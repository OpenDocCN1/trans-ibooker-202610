  '
- "## 第11章 进化中的设计决策\n\n在我们所处的现代快节奏世界中，企业无法承受迟缓。为了跟上竞争，他们必须不断地改变、进化，甚至随着时间的推移重新发明自己。在设计系统时，尤其是当我们打算设计与业务领域需求高度适配的软件时，我们不能忽视这一事实。当变化没有得到妥善管理时，即使是最精妙、最深思熟虑的设计最终也会变得难以维护和演进。本章讨论软件项目环境的变化如何影响设计决策，以及如何相应地演进设计。我们将考察四种最常见的变化向量：业务领域、组织结构、领域知识和增长。\n\
  \n### 领域的变化\n\n在第2章中，你已经了解了三种类型的业务子域，以及它们之间的不同之处：\n\nCore\n\n公司与竞争对手相比执行不同的活动，以获得竞争优势\n\
  \nSupporting\n\n公司与竞争对手相比做的事情不同，但不提供竞争优势\n\nGeneric\n\n所有公司都以相同方式做的事情\n\n在之前的章节中，你看到子域的类型会影响战略和战术设计决策：\n\
  \n- 如何设计有界上下文的边界\n- 如何在上下文之间编排集成\n- 使用哪些设计模式来适应业务逻辑的复杂性\n\n要设计以业务领域需求为驱动的软件，识别业务子域及其类型至关重要。然而，这还不是全部故事。同样重要的是要警惕子域的演变。随着组织的成长和演变，其某些子域从一种类型转变为另一种类型的情况并不少见。让我们来看一些此类变化的例子。\n\
  \n### 从核心到通用\n\n想象一家名为 BuyIT 的在线零售公司一直在实施自己的订单配送解决方案。它开发了一种创新的算法来优化其快递员的配送路线，因此能够收取比竞争对手更低的配送费用。\n\
  \n有一天，另一家公司——DeliverIT——颠覆了配送行业。它声称已解决了“旅行商”问题，并提供路径优化即服务。DeliverIT 的优化不仅更先进，而且提供的价格仅为\
  \ BuyIT 执行相同任务成本的一小部分。\n\n从 BuyIT 的角度来看，一旦 DeliverIT 的解决方案作为现成产品可用，其核心子域就转变为通用子域。结果，最优解决方案变得对\
  \ BuyIT 的所有竞争对手都可用。在没有大规模研发投资的情况下，BuyIT 不再能在路径优化子域中获得竞争优势。以前被认为是 BuyIT 竞争优势的东西已经变成所有竞争对手都可用的商品。\n\
  \n### 从通用到核心\n\n自成立以来，BuyIT 一直使用现成解决方案来管理其库存。然而，其商业智能报告持续显示对客户需求的预测不足。因此，BuyIT 无法补充最受欢迎产品的库存，并浪费仓库空间在不受欢迎的产品上。在评估了几种替代库存管理解决方案后，BuyIT\
  \ 的管理团队做出了战略决策，投资设计和构建内部系统。该内部解决方案将考虑 BuyIT 销售产品的复杂性，并对客户需求做出更好的预测。\n\nBuyIT 决定用自己的实现替换现成解决方案，已将库存管理从通用子域转变为核心子域：该功能的成功实施将为\
  \ BuyIT 提供额外的竞争优势，而竞争对手将“困”在通用解决方案中，无法使用 BuyIT 发明和开发的先进需求预测算法。\n\n将通用子域转变为核心子域的现实生活教科书案例是亚马逊。像所有服务提供商一样，亚马逊需要一个运行其服务的基础设施。该公司能够“重新发明”其物理基础设施的管理方式，后来甚至将其转变为盈利业务：亚马逊网络服务。\n\
  \n### 从支持到通用\n\nBuyIT 的市场部门实施了一个用于管理其合作的供应商及其合同的系统。该系统没有什么特别或复杂之处——只是一些用于输入数据的 CRUD\
  \ 用户界面。换句话说，它是一个典型的支持子域。\n\n然而，在 BuyIT 开始实施内部解决方案几年后，一个开源合同管理解决方案问世了。该开源项目实现了与现有解决方案相同的功能，并且具有更先进的功能，如\
  \ OCR 和全文搜索。这些额外功能在 BuyIT 的待办事项中已存在很长时间，但由于其业务影响低而从未被优先考虑。因此，公司决定放弃内部解决方案，转而集成开源解决方案。这样一来，文档管理子域就从支持转变为通用子域。\n\
  \n### 从支持到核心\n\n支持子域也可以转变为核心子域——例如，如果公司找到一种优化支持逻辑的方法，从而降低成本或产生额外利润。\n\n这种转变的典型症状是支持子域业务逻辑复杂性的不断增加。支持子域按定义是简单的，主要类似于\
  \ CRUD 接口或 ETL 流程。然而，如果业务逻辑随着时间的推移变得更加复杂，就应该有原因导致这种额外复杂性。如果它不影响公司的利润，为什么会变得更复杂呢？那是偶然的业务复杂性。另一方面，如果它增强了公司的盈利能力，那就是支持子域正在成为核心子域的迹象。\n\
  \n### 从核心到支持\n\n核心子域随着时间的推移可能成为支持子域。这可能发生在子域的复杂性得不到证实时。换句话说，它无利可图。在这种情况下，组织可能会决定削减多余的复杂性，只保留支持其他子域实施所需的最小逻辑。\n\
  \n### 从通用到支持\n\n最后，出于与核心子域相同的原因，通用子域也可以转变为支持子域。回到 BuyIT 文档管理系统示例，假设公司已决定集成开源解决方案的复杂性无法证明其收益合理，并已改回内部系统。结果，通用子域已转变为支持子域。\n\
  \n我们刚刚讨论的子域变化在图 11-1 中有所体现。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_251_0.png)\n\
  \n图 11-1. 子域类型变化因素\n\n### 战略设计问题\n\n子域类型的变化直接影响其有界上下文，进而影响相应的战略设计决策。正如你在第4章中所学，不同的有界上下文集成模式适应不同的子域类型。核心子域必须通过反腐败层保护其模型，并通过发布语言保护消费者免受实现模型频繁变化的影响。\n\
  \n受此类变化影响的另一个集成模式是分离方式模式。正如你之前所见，团队可以对支持和通用子域使用此模式。如果子域演变为核心子域，多团队复制其功能已不再可接受。因此，团队别无选择，只能集成其实现。在这种情况下，客户-供应商关系将最有意义，因为核心子域将仅由一个团队实现。\n\
  \n从实施策略角度来看，核心和支持子域在如何实现方面有所不同。支持子域可以外包或用作新员工的“训练轮”。核心子域必须在内部实施，尽可能靠近领域知识来源。因此，当支持子域转变为核心子域时，其实施应移至内部。相同的逻辑反过来也适用。如果核心子域转变为支持子域，则可以外包实施，让内部研发团队专注于核心子域。\n\
  \n### 战术设计问题\n\n子域类型变化的主要指标是现有技术设计无法支持当前业务需求。\n\n让我们回到支持子域成为核心子域的示例。支持子域使用相对简单的设计模式来实现业务逻辑：即事务脚本或活动记录模式。正如你在第5章中所见，这些模式不适合涉及复杂规则和不变量的业务逻辑。\n\
  \n如果随着时间的推移向业务逻辑添加复杂的规则和不变量，代码库也会变得越来越复杂。添加新功能将变得痛苦，因为设计不支持新的复杂程度。这种“痛苦”是一个重要\n\n\
  \nsignal. 用它作为重新评估业务领域和设计选择的契机。\n\n实施策略需要改变并非需要恐惧的事情。这是正常的。我们无法预见业务未来会如何演进。我们也不能对所有类型的子域都应用最复杂的设计模式；那样会浪费且无效。我们必须选择最合适的设计，并在需要时对其进行演进。\n\
  \n如果对如何建模业务逻辑的决策是 consciously 作出的，并且你了解所有可能的设计选择及其之间的差异，那么从一种设计模式迁移到另一种设计模式并不会那么麻烦。以下小节强调了一些示例。\n\
  \n### 从事务脚本到活动记录\n\n从核心来看，事务脚本和活动记录模式都基于同一原则：业务逻辑以过程式脚本实现。它们之间的区别在于数据结构建模方式：活动记录模式引入数据结构来封装将其映射到存储机制的复杂性。\n\
  \n因此，当在事务脚本中使用数据变得具有挑战性时，将其重构为活动记录模式。寻找复杂的数据结构并将其封装在活动记录对象中。不要直接访问数据库，而是使用活动记录来抽象其模型和结构。\n\
  \n### 从活动记录到领域模型\n\n如果操作活动记录的业务逻辑变得复杂，并且你注意到不一致和重复的情况越来越多，则将实现重构为领域模型模式。\n\n首先识别值对象。哪些数据结构可以建模为不可变对象？寻找相关的业务逻辑，并将其也作为值对象的一部分。\n\
  \n接下来，分析数据结构并寻找事务边界。为了确保所有状态修改逻辑都是显式的，使所有活动记录的 setter 为 private，以便它们只能从活动记录内部进行修改。显然，编译会失败；然而，编译错误会明确显示状态修改逻辑所在的位置。将它重构到活动记录的边界内。例如：\n\
  \n```\npublic class Player\n{\n    public Guid Id { get; set; }\n    public int\
  \ Points { get; set; }\n}\n\npublic class ApplyBonus\n{\n    ...\n    public void\
  \ Execute(Guid playerId, byte percentage)\n    {\n        var player = _repository.Load(playerId);\n\
  \        player.Points *= 1 + percentage/100.0;\n        _repository.Save(player);\n\
  \    }\n}\n```\n\n在以下代码中，你可以看到向转换迈出的第一步。代码尚未编译，但错误会明确显示外部组件在控制对象的状态：\n\n```\npublic\
  \ class Player\n{\n```\n\n```\npublic Guid Id { get; private set; }\npublic int\
  \ Points { get; private set; }\n}\n\npublic class ApplyBonus\n{\n    ...\n    public\
  \ void Execute(Guid playerId, byte percentage)\n    {\n        var player = _repository.Load(playerId);\n\
  \        player.Points *= 1 + percentage/100.0;\n        _repository.Save(player);\n\
  \    }\n}\n```\n\n在下一次迭代中，我们可以将该逻辑移入活动记录的边界内：\n\n```\npublic class Player\n{\n \
  \   public Guid Id { get; private set; }\n    public int Points { get; private set;\
  \ }\n\n    public void ApplyBonus(int percentage)\n    {\n        this.Points *=\
  \ 1 + percentage/100.0;\n    }\n}\n```\n\n当所有状态修改的业务逻辑都移入相应对象的边界后，检查需要哪些层次结构以确保对业务规则和不变量进行强一致性检查。它们是聚合体的良好候选。牢记我们在第\
  \ 6 章中讨论的聚合设计原则，寻找最小的事务边界，即你需要保持强一致性的最小数据量。沿着这些边界分解层次结构。确保外部聚合体仅通过其 ID 被引用。\n\n\
  最后，对于每个聚合体，确定其根，即其公共接口的入口点。使聚合体中所有其他内部对象的 方法为 private 并且只能从聚合体内部调用。\n\n### 从领域模型到事件溯源领域模型\n\
  \n一旦你拥有具有适当设计的聚合边界的领域模型，就可以将其过渡到事件溯源模型。不要直接修改聚合的数据，而是建模表示聚合生命周期所需的领域事件。\n\n将领域模型重构为事件溯源领域模型最具挑战性的方面是现有聚合的历史：迁移“\
  \ timeless ”状态到基于事件的模型。由于表示所有过去状态变化的细粒度数据并不存在，你必须尽力生成过去的事件或建模迁移事件。\n\n### 生成过去的转换\n\
  \n这种方法意味着为每个聚合生成近似的事件流，以便事件流可以投影为与原始实现相同的状态表示。考虑你在第 7 章中看到的示例，如表 11-1 所示。\n\n表 11-1.\
  \ 聚合数据的基于状态的表示\n\n| lead-in | first-name | last-name | phone_number | status |\n\
  |---|---|---|---|---|\n| 12 | Shauna | Mercia | 555-4753 | converted |\n\n我们可以从业务逻辑角度假设聚合的实例已被初始化；然后该人已被联系，订单已被下达，最后，由于状态为“converted”，订单的付款已被确认。以下事件集可以表示所有这些假设：\n\
  \n```\n{\n  \"lead-id\": 12,\n  \"event-id\": 0,\n  \"event-type\": \"lead-initialized\"\
  ,\n  \"first-name\": \"Shauna\",\n  \"last-name\": \"Mercia\",\n  \"phone-number\"\
  : \"555-4753\"\n},\n{\n  \"lead-id\": 12,\n  \"event-id\": 1,\n  \"event-type\"\
  : \"contacted\",\n  \"timestamp\": \"2020-05-27T12:02:12.51Z\"\n},\n{\n  \"lead-id\"\
  : 12,\n  \"event-id\": 2,\n  \"event-type\": \"order-submitted\",\n  \"payment-deadline\"\
  : \"2020-05-30T12:02:12.51Z\",\n  \"timestamp\": \"2020-05-27T12:02:12.51Z\"\n},\n\
  {\n  \"lead-id\": 12,\n  \"event-id\": 3,\n  \"event-type\": \"payment-confirmed\"\
  ,\n  \"status\": \"converted\",\n  \"timestamp\": \"2020-05-27T12:38:44.12Z\"\n\
  }\n```\n\n逐一应用时，这些事件可以投影为与原始系统完全相同的状态表示。“恢复”的事件可以通过投影状态并将其与原始数据进行比较来轻松测试。\n\n然而，必须牢记这种方法的缺点。使用事件溯源的目标是拥有聚合领域事件的可靠、强一致的历史。当使用这种方法时，不可能恢复状态转换的完整历史。在前面的示例中，我们不知道销售代理联系该人多少次，因此我们错过了多少个“contacted”事件。\n\
  \n### 建模迁移事件\n\n替代方法是承认对过去事件缺乏了解，并将其显式建模为一个事件。不要恢复可能导致当前状态的事件，定义一个迁移事件并使用它来初始化现有聚合实例的事件流：\n\
  \n```\n{\n  \"lead-id\": 12,\n  \"event-id\": 0,\n  \"event-type\": \"migrated-from-legacy\"\
  ,\n  \"first-name\": \"Shauna\",\n  \"last-name\": \"Mercia\",\n  \"phone-number\"\
  : \"555-4753\",\n  \"status\": \"converted\",\n  \"last-contacted-on\": \"2020-05-27T12:02:12.51Z\"\
  ,\n  \"order-placed-on\": \"2020-05-27T12:02:12.51Z\",\n  \"converted-on\": \"2020-05-27T12:38:44.12Z\"\
  ,\n  \"followup-on\": null\n}\n```\n\n这种方法的优点是它使过去数据缺失的情况变得明确。在任何阶段都不可能有人错误地假设事件流捕获了聚合实例生命周期期间发生的所有领域事件。缺点是遗留系统的痕迹将永远保留在事件存储中。例如，如果你正在使用\
  \ CQRS 模式（并且使用事件-\n\n\nsourced domain model you most likely will), the projections\
  \ will always have to take into account the migration events.\n\n### 组织变更\n\n影响系统设计变化的另一种类型是组织本身的变化。第\
  \ 4 章探讨了集成有界上下文的不同模式：合作伙伴关系、共享内核、顺从者、防腐层、开放主机服务和各自为政。组织结构的变化会影响团队的沟通和协作水平，进而影响有界上下文应如何集成的方式。\n\
  \n一个简单的例子就是开发中心的扩张，如图 11-2 所示。由于一个有界上下文只能由一个团队实现，新增开发团队可能会导致现有的更宽的有界上下文边界分裂成更小的边界，以便每个团队都能在其自己的有界上下文中工作。\n\
  \n![](img/b742a71dea5d5dd509847f82600a6ad1_259_0.png)\n\n此外，组织的开发中心通常位于不同的地理位置。当对现有有界上下文的工作转移到另一个地点时，可能会对团队的协作产生负面影响。因此，有界上下文的集成模式必须相应地演进，如以下场景所述。\n\
  \n### 从合作伙伴关系到客户-供应商\n\n合作伙伴关系模式假设团队之间存在强烈的沟通和协作。随着时间的推移，这种情况可能不再成立；例如，当其中一个有界上下文的工作被转移到遥远的开发中心时。这种变化会负面影响团队的沟通，并且转向客户-供应商关系而不是合作伙伴关系模式可能是有意义的。\n\
  \n### 从客户-供应商到各自为政\n\n不幸的是，团队出现严重的沟通问题并不少见。这些问题可能是由地理距离或组织政治造成的。随着时间的推移，这样的团队可能会遇到越来越多的集成问题。到了某个时候，复制功能可能比不断追逐对方的尾巴更具成本效益。\n\
  \n### 领域知识\n\n正如你所回忆的，领域驱动设计的核心理念是领域知识对于设计成功的软件系统至关重要。获取领域知识是软件工程最具挑战性的方面之一，尤其是对于核心子域。核心子域的逻辑不仅复杂，而且预计经常发生变化。此外，建模是一个持续的过程。随着对业务域了解的加深，模型必须不断改进。\n\
  \n很多时候，业务域的复杂性是隐含的。起初，一切似乎简单直接。这种初始的简单性往往具有欺骗性，很快就会演变成复杂性。随着更多功能的添加，会发现越来越多的边缘情况、不变量和规则。这些见解往往具有破坏性，需要从头开始重建模型，包括有界上下文、聚合和其他实现细节的边界。\n\
  \n从战略设计角度来看，根据领域知识的水平来设计有界上下文的边界是一个有用的启发式方法。将系统分解为有界上下文的成本可能很高，而这些有界上下文随着时间的推移被证明是错误的。因此，当领域逻辑不明确且经常变化时，设计有界上下文时采用更宽的边界是有意义的。然后，随着领域知识的逐步发现以及业务逻辑的变化趋于稳定，这些宽泛的有界上下文可以被分解为边界更窄的上下文，或*微服务*。我们将在第\
  \ 14 章更详细地讨论有界上下文与微服务之间的相互作用。\n\n当发现新的领域知识时，应利用它来演进设计并使其更具弹性。不幸的是，领域知识的变化并不总是积极的：领域知识可能会丢失。随着时间的推移，文档往往会过时，参与原始设计的人员会离开公司，并且以临时方式添加新功能，直到某一点，代码库获得了遗留系统的可疑地位。\
  \ proactively 防止此类领域知识的退化至关重要。恢复领域知识的有效工具是 EventStorming 研讨会，这是下一章的主题。\n\n### 增长\n\
  \n增长是健康系统的标志。当不断添加新功能时，这表明系统是成功的：它为用户带来价值，并不断扩展以进一步满足用户需求并跟上竞争产品。但增长也有黑暗面。随着软件项目的发展，其代码库可能会成长为大泥球：\n\
  \n> *大泥球是一种杂乱无章、蔓延、松散、靠胶带和铁丝捆绑、意大利面条代码的丛林。这些系统显示出不受监管的增长和反复、权宜性修复的明显迹象。*\n\n—Brian\
  \ Foote 和 Joseph Yoder¹\n\n导致大泥球的无监管增长源于在不重新评估设计决策的情况下扩展软件系统的功能。增长会吹大组件的边界，越来越扩展其功能。必须检查增长对设计决策的影响，尤其是因为许多领域驱动设计工具都是关于设定边界的：业务构建块（子域）、模型（有界上下文）、不可变性（值对象）或一致性（聚合）。\n\
  \n应对增长驱动复杂性的指导原则是识别并消除偶然复杂性：由过时的设计决策引起的复杂性。业务域的本质复杂性或固有复杂性应使用领域驱动设计工具和实践进行管理。\n\n\
  当我们在前几章讨论 DDD 时，我们遵循首先分析业务域及其战略组件、设计业务域的相关模型，然后在代码中设计和实现模型的过程。让我们遵循相同的脚本来处理增长驱动的复杂性。\n\
  \n### 子域\n\n正如我们在第 1 章中所讨论的，子域的边界可能具有挑战性地识别，因此，与其追求完美的边界，不如追求有用的边界。也就是说，子域应允许我们识别不同业务价值的组件，并使用适当的工具来设计和实现解决方案。\n\
  \n随着业务域的增长，子域的边界可能会变得更加模糊，使得更难识别子域跨越多个更细粒度的子域的情况。因此，重新审视已识别的子域非常重要，并遵循连贯用例的启发式方法（在同一组数据上工作的用例集），以尝试确定在哪里拆分子域（见图\
  \ 11-3）。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_263_0.png)\n\n图 11-3. 优化子域边界以适应增长\n\
  \n如果你能够识别出不同类型的更细粒度的子域，这是一个重要的见解，将允许你管理业务域的本质复杂性。关于子域及其类型的信息越精确，你在为每个子域选择技术解决方案时就越有效。\n\
  \n能够提取并使其显式的内部子域的识别对于核心子域尤其重要。我们应始终努力尽可能多地从其他子域中提炼出核心子域，以便我们可以将精力投入到从业务战略角度来看最重要的地方。\n\
  \n#### 有界上下文\n\n在第 3 章中，你了解到有界上下文模式允许我们使用业务域的不同模型。与其构建一个“样样通、样样松”的模型，不如构建多个模型，每个模型都专注于解决特定问题。\n\
  \n随着项目的演进和增长，有界上下文失去焦点并累积与不同问题相关的逻辑的情况并不少见。这就是偶然复杂性。与子域一样，定期重新审视有界上下文的边界至关重要。始终寻找简化模型的机会，通过提取专注于解决特定问题的有界上下文。\n\
  \n增长也可能使现有的隐式设计问题显式化。例如，你可能会注意到越来越多的有界上下文变得越来越“健谈”，无法在不调用另一个有界上下文的情况下完成任何操作。这可能是模型无效的强烈信号，应通过重新设计有界上下文的边界以提高其自主性来解决。\n\
  \n### 聚合\n\n当我们在第 6 章讨论领域模型模式时，我们使用了以下设计聚合边界的指导原则：\n\n> 经验法则是让聚合尽可能小，并且只包含业务域要求强一致的对象。\n\
  \n随着系统业务需求的增长，将新功能“方便地”分配给现有聚合，而不重新审视保持聚合小的原则是可能的。如果聚合增长到包含其业务逻辑并非都需要强一致的数据，那么这又是必须消除的偶然复杂性。\n\
  \n将业务功能提取到专用的聚合中不仅简化了原始聚合，而且可能简化\n\n\n\nbounded context 它所属的。经常，这种重构会揭示出一个额外的隐藏模型，一旦明确化，就应该提取到不同的\
  \ bounded context 中。\n\n### 结论\n\n正如赫拉克利特所说，生活中唯一不变的就是变化。企业也不例外。为了保持竞争力，公司不断努力进化和重塑自我。这些变化应被视为设计过程中的一等元素。\n\
  \n随着业务领域的演进，其子域的变化必须在系统的设计中被识别并采取行动。确保你的过去设计决策与业务领域及其子域的当前状态保持一致。必要时，演进你的设计以更好地匹配当前的业务战略和需求。\n\
  \n同时也很重要地认识到，组织结构的变化会影响团队之间的沟通与合作，以及他们的 bounded context 可以被集成的方式。学习业务领域是一个持续的过程。随着时间的推移发现更多的领域知识，必须利用这些知识来演进战略和战术设计决策。\n\
  \n最后，软件增长是一种期望的变化类型，但如果管理不当，它可能会对系统设计和架构产生灾难性影响。因此：\n\n- 当子域的功能被扩展时，尝试识别更细粒度的子域边界，以便你做出更好的设计决策。\n\
  - 不要允许 bounded context 成为“样样通、样样松”。确保 bounded context 所包含的模型专注于解决特定问题。\n- 确保你的聚合的边界尽可能小。使用强一致性数据的启发式方法来检测将业务逻辑提取到新的聚合中的可能性。\n\
  \n我关于这个主题的最后忠告是，持续检查不同边界是否存在增长驱动的复杂性的迹象。采取行动消除偶然复杂性，并使用领域驱动设计工具来管理业务领域的本质复杂性。\n\n\
  ## 练习\n\n1. 组织增长通常会导致 bounded context 集成发生何种变化？\n   - a. 合作伙伴到客户-供应商（顺从、反腐败层或开放主机服务）\n\
  \   - b. 反腐败层到开放主机服务\n   - c. 顺从到共享内核\n   - d. 开放主机服务到共享内核\n\n2. 假设 bounded contexts\
  \ 的集成从顺从关系转变为各自独立。基于这一变化，你能推断出什么信息？\n   - a. 开发团队难以合作。\n   - b. 重复的功能要么是支持子域，要么是通用子域。\n\
  \   - c. 重复的功能是核心子域。\n   - d. A 和 B。\n   - e. A 和 C。\n\n3. 支持子域变成核心子域的症状是什么？\n \
  \  a. 演进现有模型和实现新需求变得更容易。\n   b. 演进现有模型变得痛苦。\n   c. 子域以更高的频率发生变化。\n   d. B 和 C。\n\
  \   e. 以上都不是。\n\n4. 发现新的商业机会会带来什么变化？\n   a. 支持子域转变为核心子域。\n   b. 支持子域转变为通用子域。\n \
  \  c. 通用子域转变为核心子域。\n   d. 通用子域转变为支持子域。\n   e. A 和 B。\n   f. A 和 C。\n\n5. 业务战略中的什么变化可能将\
  \ WolfDesk（在前言中描述的虚构公司）的一个通用子域转变为核心子域？\n"
- "## 第 12 章. EventStorming\n\n在本章中，我们将暂时停止讨论软件设计模式和技术。相反，我们将专注于一种低技术建模过程，称为 *EventStorming*。该过程汇集了我们在前几章中介绍的领域驱动设计的核心方面。\n\
  \n你将学习 EventStorming 过程，如何主持 EventStorming 研讨会，以及如何利用 EventStorming 有效地共享领域知识并构建通用语言。\n\
  \n#### 什么是 EventStorming？\n\nEventStorming 是一项低技术的活动，让一群人进行头脑风暴并快速建模业务流程。从某种意义上说，EventStorming\
  \ 是共享业务领域知识的战术工具。\n\nEventStorming 会话有一个 *范围*：小组感兴趣探索的业务流程。参与者将流程作为一系列领域事件进行探索，这些事件由便签在时间线上表示。逐步地，模型会通过添加额外的概念——参与者、命令、外部系统等——而得到增强，直到其所有元素讲述了业务流程如何运作的故事。\n\
  \n#### 谁应该参与 EventStorming？\n\n> *只要记住研讨会的目的是在最短的时间内尽可能多地学习。我们邀请关键人员参加研讨会，并且我们不想浪费他们宝贵的时间。*\n\
  > \n> —Alberto Brandolini，*EventStorming* 研讨会的创建者\n\n理想情况下，多样化的人群应参与研讨会。事实上，任何与所讨论业务领域相关的人都可以参与：工程师、领域专家、产品负责人、测试人员、UI/UX\
  \ 设计师、支持人员等等。随着更多具有不同背景的人参与，将会发现更多知识。\n\n不过要注意不要让群体过大。每位参与者都应能够为流程做出贡献，但对于超过 10\
  \ 人的群体来说，这可能具有挑战性。\n\n#### EventStorming 需要什么？\n\nEventStorming 被认为是一种低技术研讨会，因为它使用笔和纸——实际上是大量的纸。让我们看看为了主持一次\
  \ EventStorming 会话你需要什么：\n\n*建模空间*\n\n首先，你需要一个大的建模空间。一整面墙覆盖的牛皮纸是最好的建模空间，如图 12-1\
  \ 所示。大型白板也可以胜任，但它必须尽可能大——你需要能获得的所有建模空间。\n\n*便签*\n\n接下来，你需要大量不同颜色的便签。这些便签将用于表示业务领域的不同概念，并且每位参与者都应能够自由添加，因此请确保你有足够的颜色和足够的数量供每个人使用。传统上用于\
  \ EventStorming 的颜色在下一节中描述。如果可能，最好坚持这些约定，以与目前所有可用的 EventStorming 书籍和培训保持一致。\n\n\
  #### 记号笔\n\n你还需要可以用来自便签上书写的记号笔。同样，物资不应成为知识共享的瓶颈——所有参与者都应有足够的记号笔。\n\n#### 小吃\n\n\
  一次典型的 EventStorming 会话持续约两到四个小时，因此请带一些健康的小吃来补充能量。\n\n#### 房间\n\n最后，你需要一个宽敞的房间。确保中间没有巨大的桌子阻碍参与者自由移动和观察建模空间。此外，椅子对于\
  \ EventStorming 会议来说是绝对禁止的。你希望人们参与并分享知识，而不是坐在角落里发呆。因此，如果可能，请把房间里的椅子搬走。¹\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_271_0.png)\n\
  \n图 12-1. EventStorming 的建模空间\n\n#### EventStorming 流程\n\nEventStorming 研讨会通常在 10\
  \ 个步骤中进行。在每个步骤中，模型都会被额外的信息和概念所丰富。\n\n#### 第 1 步：非结构化探索\n\nEventStorming 从对所探索业务领域的领域事件进行头脑风暴开始。领域事件是业务中发生的有趣的事情。重要的是以过去时态表述领域事件（见图\
  \ 12-2）——它们描述的是已经发生的事情。\n\n图 12-2. 非结构化探索\n\n在此步骤中，所有参与者都在抓取一堆橙色便签，写下他们想到的任何领域事件，并将其粘贴到建模表面上。\n\
  \n在这个早期阶段，无需担心事件的顺序，甚至也不必担心重复。此步骤完全是关于头脑风暴业务领域中可能发生的事情。\n\n小组应继续生成领域事件，直到新增事件的速度显著放缓。\n\
  \n#### 第 2 步：时间线\n\n接下来，参与者回顾生成的领域事件，并按它们在业务领域中发生的顺序进行组织。\n\n事件应从“快乐路径场景”开始：描述成功业务场景的流程。\n\
  \n一旦“快乐路径”完成，就可以添加替代场景——例如，遇到错误或不同\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_272_0.png)\n\
  \n\n\n\n\nbusiness decisions are taken. The flow branching can be expressed as two\
  \ flows coming from the preceding event or with arrows drawn on the modeling surface,\
  \ as shown in Figure 12-3.\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_273_0.png)\n\
  \nFigure 12-3. Flows of events\n\nThis step is also the time to fix incorrect events,\
  \ remove duplicates, and of course, add missing events if necessary.\n\n### Step\
  \ 3: Pain Points\n\nOnce you have the events organized in a timeline, use this broad\
  \ view to identify points in the process that require attention. These can be bottlenecks,\
  \ manual steps that require automation, missing documentation, or missing domain\
  \ knowledge.\n\nIt’s important to make these inefficiencies explicit so that it\
  \ will be easy to return to them as the EventStorming session progresses, or to\
  \ address them afterward. The pain points are marked with rotated (diamond) pink\
  \ sticky notes, as illustrated in Figure 12-4.\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_274_0.png)\n\
  \nFigure 12-4. A diamond-shaped pink sticky note, which points to an aspect of the\
  \ process that requires attention: missing domain knowledge about how the airfare\
  \ prices are compared during the booking process\n\nOf course, this step is not\
  \ the only opportunity to track pain points. As a facilitator, be aware of the participants’\
  \ comments throughout the process. When an issue or a concern is raised, document\
  \ it as a pain point.\n\n### Step 4: Pivotal Events\n\nOnce you have a timeline\
  \ of events augmented with pain points, look for significant business events indicating\
  \ a change in context or phase. These are called pivotal events and are marked with\
  \ a vertical bar dividing the events before and after the pivotal event.\n\nFor\
  \ example, “shopping cart initialized,” “order initialized,” “order shipped,” “order\
  \ delivered,” and “order returned” represent significant changes in the process\
  \ of making an order, as shown in Figure 12-5.\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_275_0.png)\n\
  \nFigure 12-5. Pivotal events denoting context changes in the flow of events\n\n\
  Pivotal events are an indicator of potential bounded context boundaries.\n\n###\
  \ Step 5: Commands\n\nWhereas a domain event describes something that has already\
  \ happened, a command describes what triggered the event or flow of events. Commands\
  \ describe the system’s operations and, contrary to domain events, are formulated\
  \ in the imperative. For example:\n\n- Publish campaign\n- Roll back transaction\n\
  - Submit order\n\nCommands are written on light blue sticky notes and placed on\
  \ the modeling space before the events they can produce. If a particular command\
  \ is executed by an actor in a specific role, the actor information is added to\
  \ the command on a small yellow sticky note, as illustrated in Figure 12-6. The\
  \ actor represents a user persona within the business domain, such as customer,\
  \ administrator, or editor.\n\nNaturally, not all commands will have an associated\
  \ actor. Therefore, add the actor information only where it’s obvious. In the next\
  \ step we will augment the model with additional entities that can trigger commands.\n\
  \n![](img/b742a71dea5d5dd509847f82600a6ad1_276_0.png)\n\nFigure 12-6. The “Submit\
  \ Order” command, executed by the customer (actor) and followed by the “Order initialized,”\
  \ “Shipping cost calculated,” and “Order shipped” events\n\n### Step 6: Policies\n\
  \nAlmost always, some commands are added to the model but have no specific actor\
  \ associated with them. During this step, you look for automation policies that\
  \ might execute those commands.\n\nAn automation policy is a scenario in which an\
  \ event triggers the execution of a command. In other words, a command is automatically\
  \ executed when a specific domain event occurs.\n\nOn the modeling surface, policies\
  \ are represented as purple sticky notes connecting events to commands, as shown\
  \ by the “Policy” sticky note in Figure 12-7.\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_277_0.png)\n\
  \nFigure 12-7. An automation policy that triggers the “Ship Order” command when\
  \ the “Shipment Approved” event is observed\n\nIf the command in question should\
  \ be triggered only if some decision criteria is met, you can specify the decision\
  \ criteria explicitly on the policy sticky note. For example, if you need to trigger\
  \ the escalate command after the “complaint received” event, but only if the complaint\
  \ was received from a VIP customer, you can explicitly state the “only for VIP customers”\
  \ condition on the policy sticky.\n\nIf the events and commands are far apart, you\
  \ can draw an arrow on the modeling surface to connect them.\n\n### Step 7: Read\
  \ Models\n\nA read model is the view of data within the domain that the actor uses\
  \ to make a decision to execute a command. This can be one of the system’s screens,\
  \ a report, a notification, and so on.\n\nThe read models are represented by green\
  \ sticky notes (see the “Shopping cart” note in Figure 12-8) with a short description\
  \ of the source of information needed to support the actor’s decision. Since a command\
  \ is executed after the actor has viewed the read model, on the modeling surface\
  \ the read models are positioned before the commands.\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_278_0.png)\n\
  \nFigure 12-8. The view of the “Shopping cart” (read model) needed for the customer\
  \ (actor) to make their decision to submit the order (command)\n\n### Step 8: External\
  \ Systems\n\nThis step is about augmenting the model with external systems. An external\
  \ system is defined as any system that is not a part of the domain being explored.\
  \ It can execute commands (input) or can be notified about events (output).\n\n\
  The external systems are represented by pink sticky notes. In Figure 12-9, the CRM\
  \ (external system) triggers execution of the “Ship Order” command. When the shipment\
  \ is approved (event), it is communicated to the CRM (external system) through a\
  \ policy.\n\n#### An external system executes a command\n\n#### Notifying an external\
  \ system\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_279_0.png)\n\nFigure 12-9.\
  \ External system triggering execution of a command (left) and approval of the event\
  \ being communicated to the external system (right)\n\nBy the end of this step,\
  \ all commands should either be executed by actors, triggered by policies, or called\
  \ by external systems.\n\n### Step 9: Aggregates\n\nOnce all the events and commands\
  \ are represented, the participants can start thinking about organizing related\
  \ concepts in aggregates. An aggregate receives commands and produces events.\n\n\
  Aggregates are represented as large yellow sticky notes, with commands on the left\
  \ and events on the right, as depicted in Figure 12-10.\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_280_0.png)\n\
  \nFigure 12-10. Commands and domain events organized in an aggregate\n\n### Step\
  \ 10: Bounded Contexts\n\nThe last step of an EventStorming session is to look for\
  \ aggregates that are related to each other, either because they represent closely\
  \ related functionality or because they’re coupled through policies. The groups\
  \ of aggregates form natural candidates for bounded contexts’ boundaries, as shown\
  \ in Figure 12-11.\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_281_0.png)\n\nFigure\
  \ 12-11. A possible decomposition of the resultant system into bounded contexts\n\
  \n### Variants\n\nAlberto Brandolini, the creator of the EventStorming workshop,\
  \ defines the EventStorming process as guidance, not hard rules. You are free to\
  \ experiment with the process to find the “recipe” that works best for you.\n\n\
  In my experience, when introducing EventStorming in an organization I prefer to\
  \ start by exploring the big picture of the business domain by following steps 1\
  \ (chaotic exploration) through 4 (pivotal events). The resultant model covers a\
  \ wide range of the company’s business domain, builds a strong foundation for ubiquitous\
  \ languages, and outlines possible boundaries for bounded contexts.\n\nAfter gaining\
  \ the big picture and identifying the different business processes, we continue\
  \ to facilitate a dedicated EventStorming session for each relevant business process—this\
  \ time, following all the steps to model the complete process.\n\n\n\n\n\n在一次完整的\
  \ EventStorming 会话结束时，你将拥有一个描述业务域的事件、命令、聚合，甚至可能的限界上下文的模型。然而，所有这些都只是不错的附加收益。EventStorming\
  \ 会话的真正价值在于过程本身——不同利益相关者之间的知识共享、对业务的心理模型的对齐、发现冲突的模型，以及最后但同样重要的是，通用语言的形成。\n\n所得模型可以被采纳作为实现事件溯源领域模型的基础。是否走这条路的决定取决于你的业务域。如果你决定实现事件溯源领域模型，你将拥有限界上下文的边界、聚合，当然还有所需的领域事件的蓝图。\n\
  \n### 何时使用 EventStorming\n\n该研讨会可以出于多种原因进行引导：\n\n- *构建通用语言*\n\n随着团队在构建业务流程模型时协作，他们会本能地同步术语并开始使用相同的语言。\n\
  \n- *建模业务流程*\n\nEventStorming 会话是构建业务流程模型的有效方式。由于它基于 DDD 导向的构建块，因此也是发现聚合和限界上下文边界的有效方式。\n\
  \n- *探索新的业务需求*\n\n你可以使用 EventStorming 来确保所有参与者对新功能达成一致，并揭示业务需求未涵盖的边缘情况。\n\n### 恢复领域知识\n\
  \n随着时间的推移，领域知识可能会丢失。这在需要现代化的遗留系统中尤为严重。\n\nEventStorming 是将每个参与者所掌握的知识合并成一个连贯图景的有效方式。\n\
  \n### 探索改进现有业务流程的方法\n\n对业务流程的端到端视图提供了发现低效和改进流程机会所需的视角。\n\n### 引导新团队成员\n\n与新团队成员一起引导\
  \ EventStorming 会话是扩展他们领域知识的绝佳方式。\n\n除了何时使用 EventStorming 外，提到何时不使用它也很重要。当你探索的业务流程简单或显而易见时，例如遵循一系列顺序步骤而没有任何有趣的业务逻辑或复杂性，EventStorming\
  \ 的效果会较差。\n\n### 引导技巧\n\n当与从未做过 EventStorming 的人群引导 EventStorming 会话时，我更喜欢先进行快速的流程概述。我解释我们即将做什么、我们即将探索的业务流程，以及我们在研讨会中将使用的建模元素。随着我们逐步介绍元素——领域事件、命令、参与者等等——我会使用我们将使用的便利贴和标签构建图例，如图\
  \ 12-12 所示，帮助参与者记住颜色编码。图例在研讨会期间应对所有参与者可见。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_284_0.png)\n\
  \n图 12-12. 描绘 EventStorming 流程的各个元素写在相应的便利贴上的图例\n\n### 关注动态\n\n随着研讨会的进行，跟踪团队的能量很重要。如果动态放缓，看看你是否可以通过提问重新点燃流程，或者是否该进入研讨会的下一阶段。\n\
  \n记住 EventStorming 是一项团队活动，因此要确保它被作为团队活动进行。确保每个人都有机会参与建模和讨论。如果你注意到某些参与者回避群体，尝试通过询问关于模型当前状态的问题来让他们参与流程。\n\
  \nEventStorming 是一项高强度活动，在某个时间点，团队需要休息。不要在所有参与者回到房间之前恢复会议。通过回顾模型的当前状态来恢复流程，以使团队重回协作建模状态。\n\
  \n### 远程 EventStorming\n\nEventStorming 最初被发明为一项低技术活动，人们在同一房间内互动和共同学习。该研讨会的创建者 Alberto\
  \ Brandolini 经常反对远程进行 EventStorming，因为当团队不在一起时，不可能达到同等程度的参与度，因而协作和知识共享也会受影响。\n\n\
  然而，随着 2020 年 COVID-19 大流行的爆发，面对面会议变得不可能，EventStorming 也无法按原意进行。一些工具试图实现远程 EventStorming\
  \ 会议的协作和引导。在撰写本文时，其中最值得注意的是 miro.com。在进行在线 EventStorming 时要更有耐心，并考虑到由此产生的沟通效率降低。\n\
  \n此外，我的经验表明，远程 EventStorming 会议在参与人数较少时更有效。虽然最多 10 人可以参加面对面的 EventStorming 会议，但我更喜欢将在线会议限制在五名参与者以内。当你需要更多参与者贡献他们的知识时，你可以引导多次会议，并在之后比较和合并所得模型。\n\
  \n当情况允许时，回到面对面 EventStorming。\n\n### 结论\n\nEventStorming 是一种基于协作的建模业务流程的研讨会。除了所得模型之外，其主要好处是知识共享。到会议结束时，所有参与者都将同步他们对业务流程的心理模型，并迈出使用通用语言的第一步。\n\
  \nEventStorming 就像骑自行车一样。通过实践学习比在书中阅读要容易得多。尽管如此，该研讨会很有趣且易于引导。你不需要是 EventStorming\
  \ 黑带才能开始。只需引导会议，遵循步骤，并在过程中学习。\n\n## 练习\n\n+   1. 谁应该被邀请参加 EventStorming 会议？\n+ \
  \     a. 软件工程师\n+      b. 领域专家\n+      c. QA 工程师\n+      d. 拥有你想要探索的业务域知识的所有利益相关者\n\
  +   2. 何时是引导 EventStorming 会议的好机会？\n+      a. 构建通用语言。\n+      b. 探索新的业务域。\n+   \
  \   c. 恢复棕地项目的丢失知识。\n+      d. 引入新团队成员。\n+      e. 发现优化业务流程的方法。\n\nf. 以上所有答案都正确。\n\
  \n3. 你可以从 EventStorming 会议中期待什么结果？\n\n+   a. 对业务域有更好的共同理解\n+   b. 通用语言的坚实基础\n+ \
  \  c. 揭示对业务域理解中的空白点\n+   d. 一个可用于实现领域模型的基于事件的模型\n+   e. 以上所有内容，但取决于会议的目的\n"
- "## 第 13 章. 真实世界中的领域驱动设计\n\n我们已经介绍了用于分析业务域、共享知识以及做出战略和战术设计决策的领域驱动设计工具。想象一下将这些知识应用于实践会有多有趣。让我们考虑一个场景：你正在进行一个绿地项目。你的所有同事都对领域驱动设计有深刻理解，从一开始大家都在尽力设计有效的模型，当然也虔诚地使用通用语言。随着项目的推进，限界上下文的边界是明确且有效的，能够保护业务域模型。最后，由于所有战术设计决策都与业务战略保持一致，代码库始终保持良好状态：它使用通用语言并实现了适应模型复杂性的设计模式。现在醒醒。\n\
  \n你体验到我刚刚描述的实验室条件的机会与中彩票的概率差不多。当然，这是可能的，但不太可能。不幸的是，许多人错误地认为领域驱动设计只能应用于绿地项目和理想条件下，即团队中的每个人都是\
  \ DDD 黑带。具有讽刺意味的是，能从 DDD 中获益最多的项目是棕地项目：那些已经证明其商业可行性并需要整顿以对抗累积的技术债务和设计熵的项目。巧合的是，我们在软件工程职业生涯中花费大部分时间的工作正是这些棕地、遗留、大泥球代码库。\n\
  \n关于 DDD 的另一个常见误解是它是一种全有或全无的提议——要么你应用该方法论的每一种工具\n\n\nhas to offer, or it’s not domain-driven\
  \ design. That’s not true. It might seem overwhelming to come to grips with all\
  \ of these concepts, let alone implement them in practice. Luckily, you don’t have\
  \ to apply all of the patterns and practices to gain value from domain-driven design.\
  \ This is especially true for brownfield projects, where it’s practically impossible\
  \ to introduce all the patterns and practices in a reasonable time frame.\n\nIn\
  \ this chapter, you will learn strategies for applying domain-driven design tools\
  \ and patterns in the real world, including on brownfield projects and in less-than-ideal\
  \ environments.\n\n### Strategic Analysis\n\nFollowing the order of our exploration\
  \ of domain-driven design patterns and practices, the best starting point for introducing\
  \ DDD in an organization is to invest time in understanding the organization’s business\
  \ strategy and the current state of its systems’ architecture.\n\n### Understand\
  \ the Business Domain\n\nFirst, identify the company’s business domain:\n\n- What\
  \ is the organization’s business domain(s)?\n- Who are its customers?\n- What service,\
  \ or value, does the organization provide to customers?\n- What companies or products\
  \ is the organization competing with?\n\nAnswering these questions will give you\
  \ a bird’s-eye view of the company’s high-level goals. Next, “zoom in” to the domain\
  \ and look for the business building blocks the organization employs to achieve\
  \ its high-level goals: the subdomains.\n\nA good initial heuristic is the company’s\
  \ org chart: its departments and other organizational units. Examine how these units\
  \ cooperate to allow the company to compete in its business domain.\n\nFurthermore,\
  \ look for the signs of specific types of subdomains.\n\n#### Core subdomains\n\n\
  To identify the company’s core subdomains, look for what differentiates it from\
  \ its competitors:\n\n- Does the company have a “secret sauce” that its competitors\
  \ lack? For example, intellectual property, such as patents and algorithms designed\
  \ in-house?\n- Keep in mind that the competitive advantage, and thus the core subdomains,\
  \ are not necessarily technical. Does the company possess a nontechnical competitive\
  \ advantage? For example, the ability to hire top-level personnel, produce a unique\
  \ artistic design, and so on?\n\nAnother powerful yet unfortunate heuristic for\
  \ core subdomains is identifying the worst-designed software components—those big\
  \ balls of mud that all engineers hate but the business is unwilling to rewrite\
  \ from scratch because of the accompanying business risk. The key here is that the\
  \ legacy system cannot be replaced with a ready-made system—it would be a generic\
  \ subdomain—and any modification to it entails business risks.\n\n#### Generic subdomains\n\
  \nTo identify generic subdomains, look for off-the-shelf solutions, subscription\
  \ services, or integration of open source software. As you learned in Chapter 1,\
  \ the same ready-made solutions should be available to the competing companies,\
  \ and those companies leveraging the same solution should have no business impact\
  \ on your company.\n\n#### Supporting subdomains\n\nFor supporting subdomains, look\
  \ for the remaining software components that cannot be replaced with ready-made\
  \ solutions yet do not directly provide a competitive advantage. If the code is\
  \ in rough shape, it triggers less emotional response from software engineers since\
  \ it changes infrequently. Thus, the effects of the suboptimal software design are\
  \ not as severe as for the core subdomains.\n\nYou don’t have to identify all of\
  \ the core subdomains. It won’t be practical or even possible to do so, even for\
  \ a medium-sized company. Instead, identify the overall structure, but pay closer\
  \ attention to the subdomains that are most relevant to the software systems you\
  \ are working on.\n\n### Explore the Current Design\n\nOnce you are familiar with\
  \ the problem domain, you can continue to investigate the solution and its design\
  \ decisions. First, start with the high-level components. These are not necessarily\
  \ bounded contexts in the DDD sense, but rather boundaries used to decompose the\
  \ business domain into subsystems.\n\nThe characteristic property to look for is\
  \ the components’ decoupled lifecycles. Even if the subsystems are managed in the\
  \ same source control repository (mono-repo) or if all the components reside in\
  \ a single monolithic codebase, check which can be evolved, tested, and deployed\
  \ independently from the others.\n\n### Evaluate the tactical design\n\nFor each\
  \ high-level component, check which business subdomains it contains and what technical\
  \ design decisions were taken: what patterns are used to implement the business\
  \ logic and define the component’s architecture?\n\nDoes the solution fit the complexity\
  \ of the problem? Are there areas where more elaborate design patterns are needed?\
  \ Conversely, are there any subdomains where it’s possible to cut corners or use\
  \ existing, off-the-shelf solutions? Use this information to make smarter strategic\
  \ and tactical decisions.\n\n### Evaluate the strategic design\n\nUse the knowledge\
  \ of the high-level components to chart the current design’s context map, as though\
  \ these high-level components were bounded contexts. Identify and track the relationships\
  \ between the components in terms of bounded context integration patterns.\n\nFinally,\
  \ analyze the resultant context map and evaluate the architecture from a domain-driven\
  \ design perspective. Are there suboptimal strategic design decisions? For example:\n\
  \n- Multiple teams working on the same high-level component\n- Duplicate implementations\
  \ of core subdomains\n- Implementation of a core subdomain by an outsourced company\n\
  - Friction because of frequently failing integration\n- Awkward models spreading\
  \ from external services and legacy systems\n\nThese insights are a good starting\
  \ point for planning the design modernization strategy. But first, given this more\
  \ in-depth knowledge of both the problem (business domain) and the solution (current\
  \ design) spaces, look for lost domain knowledge. As we discussed in Chapter 11,\
  \ knowledge of the business domain can get lost for various reasons. The problem\
  \ is widespread and acute in core subdomains, where the business logic is both complex\
  \ and business critical. If you encounter such cases, facilitate EventStorming sessions\
  \ to try to recover the knowledge. Also, use the\n\nEventStorming session as the\
  \ foundation for cultivating a ubiquitous language.\n\n### Modernization Strategy\n\
  \nThe “big rewrite” endeavors, in which the engineers are trying to rewrite the\
  \ system from scratch, this time designing and implementing the whole system correctly,\
  \ are rarely successful. Even more rarely does management support such architectural\
  \ makeovers.\n\nA safer approach to improving the design of existing systems is\
  \ to think big but start small. As Eric Evans says, not all of a large system will\
  \ be well designed. That’s a fact we have to accept, and therefore we must strategically\
  \ decide where to invest in terms of modernization efforts. A prerequisite for making\
  \ this decision is to have boundaries dividing the system’s subdomains. The boundaries\
  \ don’t have to be physical, making each subdomain a full-fledged bounded context.\
  \ Instead, start by ensuring that at least the logical boundaries (namespace, modules,\
  \ and packages, depending on the technology stack) are aligned with the subdomains’\
  \ boundaries, as shown in Figure 13-1.\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_293_0.png)\n\
  \nFigure 13-1. Reorganizing the bounded context’s modules to reflect the business\
  \ subdomains’ boundaries rather than technical implementation patterns\n\nAdjusting\
  \ the system’s modules is a relatively safe form of refactoring. You are not modifying\
  \ the business logic, just repositioning the types in a more well-organized structure.\
  \ That said,\n\nensure that references by full type names, such as the dynamic loading\
  \ of libraries, reflection, and so on, are not breaking.\n\nIn addition, keep track\
  \ of the subdomains’ business logic implemented in different codebases; stored procedures\
  \ in a database, serverless functions, and so on. Make sure to introduce the new\
  \ boundaries in those platforms as well. For instance, if some of the logic is handled\
  \ in the database’s stored procedures, either rename the procedures to reflect the\
  \ module they belong to or introduce a dedicated database schema and relocate the\
  \ stored procedures.\n\n### Strategic Modernization\n\nAs we discussed in Chapter\
  \ 10, it can be risky to prematurely decompose the system into the smallest bounded\
  \ contexts possible. We will discuss bounded contexts and microservices in more\
  \ detail in the next chapter. For now, look for where the most value can be gained\
  \ by turning the logical boundaries into physical boundaries. The process of extracting\
  \ a bounded context(s) by turning a logical boundary into a physical one is shown\
  \ in Figure 13-2.\n\nQuestions to ask yourself:\n\n- Are multiple teams working\
  \ on the same codebase? If so, decouple the development lifecycles by defining bounded\
  \ contexts for each team.\n- Are conflicting models being used by the different\
  \ components? If so, relocate the conflicting models into separate bounded contexts.\n\
  \n\n\n\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_295_0.png)\n\n### 营销有界上下文\n\n\
  ### 优化的有界上下文\n\n图 13-2. 通过将逻辑边界转变为物理边界来提取有界上下文\n\n当最少所需的有界上下文就位后，检查它们之间的关系和集成模式。观察负责不同有界上下文的团队如何沟通和协作。尤其是当它们通过临时或类似共享内核的集成进行通信时，这些团队是否拥有共同的目标和足够的协作水平？\n\
  \n注意上下文集成模式可以解决的问题：\n\n### 客户-供应商关系\n\n正如我们在第 11 章中所讨论的，组织的增长可能会使之前的沟通和协作模式失效。寻找为多个工程团队的合作伙伴关系而设计的组件，但合作伙伴关系已不再可持续。重构为适当类型的客户-供应商关系（顺从者、防腐层或开放主机服务）。\n\
  \n### 防腐层\n\n防腐层对于保护有界上下文免受遗留系统的侵害非常有用，尤其是当遗留系统使用低效的模型，这些模型倾向于扩散到下游组件时。\n\n实现防腐层的另一个常见用例是保护有界上下文免受其所使用的上游服务公共接口频繁变更的影响。\n\
  \n### 开放主机服务\n\n如果一个组件的实现细节的变更经常在系统中产生连锁反应并影响其消费者，请考虑将其设为开放主机服务：将其实施工模型与其公开的 API\
  \ 解耦。\n\n### 各走各路\n\n尤其是在大型组织中，你可能会遇到工程团队之间的摩擦，因为他们必须协作并共同演进共享功能。如果“分歧之苹果”功能并非业务关键——即不是核心子域——团队可以各走各路并实现自己的解决方案，从而消除摩擦的来源。\n\
  \n### 战术现代化\n\n首先，从战术角度来看，寻找业务价值与实施策略之间最“痛苦”的不匹配，例如核心子域实现了与模型复杂性不匹配的模式——事务脚本或活动记录。这些直接影响业务成功的系统组件必须最频繁地变更，但由于设计不佳，维护和演进却很痛苦。\n\
  \n### 培育通用语言\n\n设计成功现代化的前提是业务领域的领域知识和有效模型。正如我在本书中多次提到的，领域驱动设计的通用语言对于获取知识和构建有效的解决方案模型至关重要。\n\
  \n不要忘记领域驱动设计收集领域知识的捷径：事件风暴。使用事件风暴与领域专家一起构建通用语言并探索遗留代码库，尤其是当代码库是无人真正理解的无文档混乱时。召集所有与该功能相关的人员并探索业务领域。事件风暴是恢复领域知识的绝佳工具。\n\
  \n一旦你掌握了领域知识及其模型，就决定哪些业务逻辑实现模式最适合所讨论的业务功能。作为起点，使用第 10 章中描述的设计启发式方法。接下来你需要做出的决定涉及现代化策略：逐步替换系统的整个组件（绞杀者模式），还是逐步重构现有解决方案。\n\
  \n### 绞杀者模式\n\n*绞杀榕*，如图 13-3 所示，是一类热带树，具有奇特的生长模式：绞杀者生长在其他树——宿主树之上。绞杀者以种子形式开始其生命，种子位于宿主树的上部枝条。随着绞杀者的生长，它向下延伸直到扎根于土壤。最终，绞杀者长出遮蔽宿主树的叶冠，导致宿主树的死亡。\n\
  \n![](img/b742a71dea5d5dd509847f82600a6ad1_299_0.png)\n\n图 13-3. 生长在其宿主树之上的绞杀榕（来源：https://unsplash.com/photos/y_l5tep9wxl）\n\
  \n绞杀者迁移模式基于与该模式同名的树的相同生长动态。其思想是创建一个新的有界上下文——绞杀者——用它来实现新需求，并逐步将遗留上下文的功能迁移到其中。与此同时，除了热修复和其他紧急情况外，遗留有界上下文的演进和开发停止。最终，所有功能都迁移到新的有界上下文——绞杀者——并遵循类比，导致宿主——遗留代码库——的死亡。\n\
  \n通常，绞杀者模式与外观模式一起使用：一个薄的抽象层充当公共接口，并负责将请求转发给遗留或现代化的有界上下文进行处理。当迁移完成——即宿主死亡时——外观将被移除，因为它不再必要（见图\
  \ 13-4）。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_300_0.png)\n\n图 13-4. 外观层根据从遗留系统向现代化系统迁移功能的状态转发请求；一旦迁移完成，外观和遗留系统都将被移除\n\
  \n与每个有界上下文都是独立子系统、因此不能与其他有界上下文共享其数据库的原则相反，在实施绞杀者模式时可以放宽该规则。为了避免上下文之间复杂的集成——在许多情况下这会涉及分布式事务——现代化上下文和遗留上下文都可以使用同一个数据库——两个上下文都需要处理相同的数据，如图\
  \ 13-5 所示。\n\n放宽每个有界上下文一个数据库规则的条件是，最终，最好越快越好，遗留上下文将被退役，数据库将仅由新实现使用。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_301_0.png)\n\
  \n图 13-5. 遗留系统和现代化系统暂时使用同一个数据库\n\n绞杀者迁移的替代方案是在原地现代化遗留代码库，也称为重构。\n\n### 重构战术设计决策\n\
  \n在第 11 章中，你学习了迁移战术设计决策的各个方面。然而，在现代化遗留代码库时，有两个细微差别需要注意。\n\n首先，小步增量的步骤比大规模重写更安全。因此，不要直接将事务脚本或活动记录重构为基于事件的领域模型。相反，采取中间步骤，设计基于状态的聚合。投入精力找到有效的聚合边界。确保所有相关的业务逻辑都位于这些边界内。从基于状态到基于事件的聚合的转变将比在基于事件的聚合中发现错误的事务边界安全得多。\n\
  \n其次，遵循同样的逐步增量步骤的思路，重构为领域模型不必是原子性变更。相反，你可以逐步引入领域模型模式的元素。\n\n首先寻找可能的值对象。不可变对象即使你没有使用完整的领域模型，也能显著降低解决方案的复杂性。\n\
  \n正如我们在第 11 章中所讨论的，将活动记录重构为聚合不必一夜之间完成。它可以分阶段进行。首先收集相关的业务逻辑。接下来，分析事务边界。是否存在需要强一致性但操作于最终一致数据的决策？或者相反，解决方案是否在最终一致性就足够的地方强制执行强一致性？在分析代码库时，不要忘记这些决策是由业务而非技术问题驱动的。只有在对事务需求进行彻底分析之后，才应设计聚合的边界。\n\
  \n最后，在重构遗留系统时，如果必要，使用防腐层保护新代码库免受旧模型的影响，并通过实现开放主机服务并公开发布语言来保护消费者免受遗留代码库变更的影响。\n\n\
  ### 务实的领域驱动设计\n\n正如我们在本章引言中所讨论的，应用领域驱动设计并非全有或全无。你不必使用 DDD 提供的所有工具。例如，出于某种原因，\n\n\
  \n战术模式可能对你不起作用。也许你更喜欢使用其他设计模式，因为它们在你的特定领域中效果更好，或者只是因为你觉得其他模式更有效。那完全没问题！\n\n只要你分析业务领域及其战略，寻找解决特定问题的有效模型，最重要的是，基于业务领域的需求做出设计决策：这就是领域驱动设计！\n\
  \n值得重申的是，领域驱动设计不仅仅是关于聚合或值对象。领域驱动设计是关于让你的业务*领域驱动软件设计*决策。\n\n### 推广领域驱动设计\n\n当我在技术会议上就此主题演讲时，我几乎每次都会被问到一个问题：“听起来都很棒，但我该如何向我的团队和管理层‘推销’领域驱动设计呢？”这是一个极其重要的问题。\n\
  \n推销很难，而且我个人讨厌推销。话虽如此，如果你想想，设计软件就是推销。我们向团队、管理层或客户推销我们的想法。然而，一种涵盖如此广泛的设计决策方面，甚至超出工程领域涉及其他利益相关者的方法论，可能极难推销。\n\
  \n管理层的支持对于在组织中做出任何重大改变至关重要。然而，除非高层管理人员已经熟悉领域驱动设计或愿意投入时间学习该方法论的业务价值，否则这对他们来说并不是首要考虑的，尤其是因为\
  \ DDD 似乎带来了工程流程的巨大转变。幸运的是，这并不意味着你不能使用领域驱动设计。\n\n### 隐蔽的领域驱动设计\n\n将领域驱动设计作为你专业工具箱的一部分，而不是组织战略。DDD\
  \ 的模式和实践是工程技术，而软件工程就是你的工作，所以使用它们！\n\n让我们看看如何在日常工作中融入 DDD，而不必大张旗鼓。\n\n### 通用语言\n\n\
  通用语言的使用是领域驱动设计的核心实践。它对于领域知识发现、沟通和有效解决方案建模至关重要。\n\n幸运的是，这一实践如此简单，以至于几乎是常识。仔细聆听利益相关者在谈论业务领域时使用的语言。温和地将术语从技术术语引导向其业务含义。\n\
  \n寻找不一致的术语并请求澄清。例如，如果同一事物有多个名称，请寻找原因。这些不同的模型是否在同一解决方案中交织在一起？寻找上下文并使其明确。如果含义相同，请遵循常识并要求使用一个术语。\n\
  \n此外，尽可能多地与领域专家沟通。这些努力不一定需要正式会议。水槽边和咖啡休息时间都是很好的沟通促进者。与领域专家谈论业务领域。尝试使用他们的语言。寻找理解上的困难并请求澄清。别担心——领域专家通常很乐意与真诚想了解问题领域的工程师合作！\n\
  \n最重要的是，在你的代码和所有项目相关沟通中使用通用语言。要有耐心。改变组织中使用了一段时间的术语需要时间，但最终会流行起来。\n\n#### 有界上下文\n\
  \n在探索可能的分解选项时，坚持有界上下文模式背后的原则：\n\n- 为什么设计面向问题的模型比为所有用例设计单一模型更好？因为“全包”解决方案很少对任何事情都有效。\n\
  - 为什么有界上下文不能容纳冲突的模型？因为认知负担和解决方案复杂性增加。\n- 为什么让多个团队在同一代码库上工作是个坏主意？因为摩擦和团队之间协作受阻。\n\
  \n对有界上下文集成模式使用同样的推理：确保你理解每个模式旨在解决的问题。\n\n#### 战术设计决策\n\n在讨论战术设计模式时，不要诉诸权威：“让我们在这里使用聚合，因为\
  \ DDD 书籍就是这么说的！”相反，要诉诸逻辑。例如：\n\n- 为什么显式的事务边界很重要？为了保护数据的一致性。\n- 为什么数据库事务不能修改聚合的多个实例？为了确保一致性边界正确。\n\
  - 为什么聚合的状态不能由外部组件直接修改？为了确保所有相关的业务逻辑都位于同一位置且不被重复。\n- 为什么我们不能将聚合的部分功能卸载到存储过程？为了确保没有逻辑被重复。重复的逻辑，尤其是在系统逻辑上和物理上相距遥远的组件中，往往会不同步并导致数据损坏。\n\
  - 为什么我们应该追求小的聚合边界？因为宽的事务范围既会增加聚合的复杂性，又会负面影响性能。\n- 为什么不能简单地将事件写入日志文件来代替事件溯源？因为没有长期数据一致性保证。\n\
  \n说到事件溯源，当解决方案需要事件溯源的领域模型时，这种模式的实现可能很难推销。让我们看一个可以帮上忙的绝地心灵技巧。\n\n#### 事件溯源领域模型\n\n\
  尽管有许多优点，事件溯源对许多人来说听起来过于激进。如同我们在本书中讨论的一切，解决方案是让业务领域驱动这一决策。\n\n与领域专家交谈。向他们展示基于状态和基于事件的模型。解释差异以及事件溯源提供的优势，特别是在时间维度上。更常见的是，他们会对它提供的洞察力水平感到兴奋，并会自己倡导事件溯源。\n\
  \n并且在与领域专家互动时，不要忘记继续完善通用语言！\n\n### 结论\n\n在本章中，你学习了在真实场景中利用领域驱动设计工具的各种技术：处理棕地项目和遗留代码库，并且不一定拥有\
  \ DDD 专家团队。\n\n与在绿地项目中一样，始终从分析业务领域开始。公司的目标是什么？其实现这些目标的战略是什么？利用组织结构和现有的软件设计决策来识别组织的子域及其类型。凭借这些知识，规划现代化战略。寻找痛点。寻找获得最大业务价值的机会。通过重构或替换相关组件来现代化遗留代码。无论哪种方式，都要逐步进行。大规模重写带来的风险比业务价值更大！\n\
  \n最后，即使在你的组织中 DDD 并未被广泛采用，你也可以使用领域驱动设计工具。使用合适的工具，并在与同事讨论时，始终使用每种模式背后的逻辑和原则。\n\n\
  本章结束了我们对领域驱动设计本身的讨论。在第四部分，你将学习 DDD 与其他方法论和模式的相互作用。\n\n## 练习\n\n- 1. 假设你想向一个棕地项目引入领域驱动设计工具和实践。你的第一步会是什么？\n\
  \  a. 将所有业务逻辑重构为事件溯源领域模型。\n  b. 分析组织的业务领域及其战略。\n  c. 通过确保其遵循适当的边界上下文原则来改进系统的组件。\n\
  \  d. 在棕地项目中不可能使用领域驱动设计。\n\n- 2. 在迁移过程中，绞杀者模式在哪些方面与领域驱动设计的一些核心原则相矛盾？\n  a. 多个有界上下文使用共享数据库。\n\
  \  b. 如果现代化的有界上下文是核心子域，其实现会在旧实现和新实现中被重复。\n  c. 多个团队在同一个有界上下文上工作。\n  d. A 和 B。\n\n\
  - 3. 为什么通常不是一个好主意直接将基于活动记录的业务逻辑重构为事件溯源领域模型？\n  a. 基于状态的模型在学习过程中更容易重构聚合的边界。\n  b.\
  \ 逐步引入重大变更更安全。\n  c. A 和 B。\n  d. 以上都不是。直接将事务脚本重构为事件溯源领域模型是合理的。\n\n\n\n\n4. 当你在介绍聚合模式时，你的团队问为什么聚合不能直接引用所有可能的实体，从而使从一个地方遍历整个业务域成为可能。你如何回答他们？\n"
- '# 第四部分. 与其他方法论和模式的关系


  到目前为止，在本书中你已经学习了如何使用领域驱动设计根据组织的业务战略和需求设计软件解决方案。我们看到了如何应用 DDD 工具和实践来理解业务域、设计系统组件的边界并实现业务逻辑。


  领域驱动设计涵盖了软件开发生命周期的很大一部分，但它无法涵盖所有软件工程。其他方法论和工具也有其作用。在第四部分，我们将讨论 DDD 与其他方法论和模式的关系：

  - 众所周知，领域驱动设计之所以获得大部分关注，是由于微服务架构风格的流行。在第 14 章，我们将探讨微服务与领域驱动设计之间的相互作用，以及这两种方法如何相互补充。

  - 事件驱动架构是构建可扩展、高性能且具有弹性的分布式系统的流行方法。在第 15 章，你将学习事件驱动架构的原则，以及如何利用 DDD 来设计有效的异步通信。

  - 第 16 章以数据分析背景下的有效建模作为本书的结尾。你将了解占主导地位的数据管理架构、数据仓库和数据湖，以及数据网格架构如何解决其不足之处。我们还将


  分析和讨论 DDD 和数据网格架构如何基于相同的设计原则和目标。

  '
- "## 第 14 章. 微服务\n\n在 2010 年代中期，微服务席卷了软件工程行业。其意图是解决现代系统快速变化、可扩展并自然契合云计算分布式特性的需求。许多公司做出了战略决策，将其单体代码库分解，以获得微服务架构提供的灵活性。不幸的是，许多这样的尝试并未取得良好结果。相反，这些公司最终得到了分布式的大泥球——设计比公司想要拆分的单体更脆弱、更松散、更昂贵。\n\
  \n历史上，微服务通常与 DDD 相关联，尤其是与有界上下文模式相关。许多人甚至将 *bounded context* 和 *microservices* 术语互换使用。但它们真的相同吗？本章探讨领域驱动设计方法论与微服务架构模式之间的关系。你将学习这些模式之间的相互作用，更重要的是，如何利用\
  \ DDD 来设计有效的微服务系统。\n\n让我们从基础开始，定义服务和微服务到底是什么。\n\n#### 什么是服务？\n\n根据 OASIS，服务是一种能够访问一个或多个能力的机制，其中访问是通过规定的接口提供的。¹\
  \ *规定的接口* 是获取数据进出服务的任何机制。它可以是同步的，例如请求/响应模型，也可以是异步的，例如生产和消费事件的模型。这是服务公共接口，\n\n如图\
  \ 14-1 所示，它提供了一种与其它系统组件通信和集成的手段。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_313_0.png)\n\
  \n图 14-1. 服务之间的通信\n\nRandy Shoup 将服务的接口比作前门。所有进入或离开服务的数据都必须通过前门。此外，服务的公共接口定义了服务本身：服务所暴露的功能。一个表达良好的接口足以描述服务实现的功能。例如，图\
  \ 14-2 中说明的公共接口明确描述了服务的功能。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_313_1.png)\n\
  \n图 14-2. 服务的公共接口\n\n这就引出了微服务的定义。\n\n#### 什么是微服务？\n\n微服务的定义出奇地简单。既然服务由其公共接口定义，那么微服务就是具有微公共接口的服务：微型前门。\n\
  \n拥有微公共接口使得理解单个服务的功能及其与其他系统组件的集成变得更容易。减少服务的功能也限制了其变更原因，并使服务在开发、管理和扩展方面更具自主性。\n\n\
  此外，这也解释了微服务不暴露其数据库的做法。暴露数据库，使其成为服务前门的一部分，会使公共接口变得庞大。例如，你可以在关系数据库上执行多少种不同的 SQL 查询？由于\
  \ SQL 是一种相当灵活的语言，可能的估计是无限的。因此，微服务封装其数据库。数据只能通过更紧凑、面向集成的公共接口访问。\n\n#### 方法即服务：完美的微服务？\n\
  \n说微服务是微公共接口具有欺骗性的简单。它听起来似乎将服务接口限制为单个方法会产生完美的微服务。让我们看看如果在实践中应用这种天真的分解会发生什么。\n\n\
  考虑图 14-3 中的待办事项管理服务。其公共接口由八个公共方法组成，我们希望应用“每个服务一个方法”的规则。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_315_0.png)\n\
  \n图 14-3. 天真分解\n\n由于这些是表现良好的微服务，每个服务都封装了其数据库。没有任何一个服务被允许直接访问另一个服务的数据库；只能通过其公共接口访问。但目前没有公共接口供此使用。服务必须协同工作并同步每个服务应用的更改。因此，我们需要扩展服务的接口以考虑这些集成相关的关注点。此外，当可视化时，结果服务之间的集成和数据流类似于典型的分布式大泥球，如图\
  \ 14-4 所示。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_316_0.png)\n\n图 14-4. 集成复杂性\n\
  \n借用 Randy Shoup 的比喻，通过将系统分解为如此细粒度的服务，我们确实最小化了服务的前门。然而，为了实现整体系统的功能，我们不得不为每个服务增加巨大的“仅限工作人员”入口。让我们从这个例子中学习什么。\n\
  \n#### 设计目标\n\n遵循每个服务仅暴露单个方法的简单分解启发式方法被证明在许多原因下是次优的。首先，这根本不可能。由于服务必须协同工作，我们被迫用集成相关的公共方法扩展其公共接口。其次，我们赢得了战斗却输掉了战争。每个服务最终比原始设计简单得多，然而由此产生的系统变得复杂了数个数量级。\n\
  \n微服务架构的目标是产生一个灵活的系统。集中设计工作于单个组件，而忽略其与系统其余部分的交互，违背了系统的定义本身：\n- 一组相互连接的事物或设备，共同运行\n\
  - 一组为特定目的共同使用的计算机设备和程序\n\n因此，系统不能由独立的组件构建。在一个适当的微服务系统中，无论解耦程度如何，服务仍然必须集成并相互通信。让我们看看单个微服务的复杂性与整体系统的复杂性之间的相互作用。\n\
  \n#### 系统复杂性\n\n四十年前，没有云计算，没有全球规模的需求，也没有每 11.7 秒部署一次系统的需求。但工程师仍然必须驯服系统的复杂性。尽管当时的工具不同，但挑战——更重要的是解决方案——与现在相关，可以应用于微服务系统的设计。\n\
  \n在他的书《Composite/Structured Design》中，Glenford J. Myers 讨论了如何结构化过程代码以降低其复杂性。\n\n\n\
  \n\n\n在本书的第一页，他写道：\n\n> *复杂性主题远不止于试图最小化程序每个部分的局部复杂性。一种更重要的复杂性类型是全局复杂性：程序或系统整体结构的复杂性（即程序各主要部分之间的关联程度或相互依赖程度）。*\n\
  \n在我们的语境中，*局部复杂性*是每个独立微服务的复杂性，而*全局复杂性*是整个系统的复杂性。局部复杂性取决于服务的实现；全局复杂性由服务之间的交互和依赖关系定义。在设计基于微服务的系统时，哪种复杂性更重要需要优化？让我们分析两种极端情况。\n\
  \n令人惊讶的是，将全局复杂性降至最低是很容易的。我们只需要消除系统组件之间的任何交互——也就是说，将所有功能实现在一个单体服务中。正如我们之前所见，这种策略在某些场景下可能有效。在其他情况下，它可能导致令人恐惧的泥球：可能是局部复杂性最高的水平。\n\
  \n另一方面，我们知道当我们只优化局部复杂性而忽视系统的全局复杂性时会发生什么——更令人恐惧的分布式泥球。这种关系在图 14-5 中显示。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_319_0.png)\n\
  \n图 14-5. 服务粒度与系统复杂性\n\n要设计一个合适的基于微服务的系统，我们必须同时优化全局和局部复杂性。将设计目标设定为单独优化其中之一是一种局部最优。全局最优则平衡两种复杂性。让我们看看微公共接口的概念如何有助于平衡全局和局部复杂性。\n\
  \n### 微服务作为深度服务\n\n软件系统中的一个模块，或任何系统中的模块，都由其功能和逻辑定义。功能是模块应该做什么——其业务功能。逻辑是模块的业务逻辑——模块如何实现其业务功能。\n\
  \n在他的书 *The Philosophy of Software Design* 中，John Ousterhout 讨论了模块化的概念，并提出了一个简单而强大的视觉启发式方法来评估模块设计的深度。\n\
  \nOusterhout 建议将模块可视化为一个矩形，如图 14-6 所示。矩形的顶部边缘代表模块的功能，或其公共接口的复杂性。更宽的矩形代表更广泛的功能，而更窄的矩形具有更受限制的功能，因此公共接口更简单。矩形的面积代表模块的逻辑，或其功能的实现。\n\
  \n![](img/b742a71dea5d5dd509847f82600a6ad1_320_0.png)\n\n图 14-6. 深度模块\n\n根据此模型，有效的模块是深度的：简单的公共接口封装了复杂的逻辑。无效的模块是浅层的：浅层模块的公共接口封装的复杂性远不及深度模块。考虑以下列表中的方法：\n\
  \n```\nint AddTwoNumbers(int a, int b)\n{\n    return a + b;\n}\n```\n\n这是浅层模块的极端情况：公共接口（方法的签名）和其逻辑（方法）完全相同。拥有这样的模块会引入多余的“活动部件”，因此，它不是封装复杂性，反而为上层系统增加了偶然复杂性。\n\
  \n### 微服务作为深度模块\n\n除了术语不同之外，深度模块的概念与微服务模式不同之处在于模块可以表示逻辑和物理边界，而微服务严格是物理的。否则，这两个概念及其底层设计原则是相同的。\n\
  \n实现单个业务方法的服务，如图 14-3 所示，是浅层模块。因为我们必须引入与集成相关的公共方法，所以产生的接口比应有的更“宽”。\n\n从系统复杂性的角度来看，深度模块减少了系统的全局复杂性，而浅层模块通过引入不封装其局部复杂性的组件来增加它。\n\
  \n浅层服务也是许多面向微服务的项目失败的原因。将微服务错误地定义为代码行数不超过 X 的服务，或应比修改更容易重写的服务，集中于单个服务，而忽略了架构最重要的方面：系统。\n\
  \n系统可以分解为微服务的阈值由系统用例定义，而微服务是其一部分的。如果我们将单体分解为服务，引入更改的成本会下降。当系统分解为微服务时，它达到最小值。然而，如果你继续分解超过微服务阈值，深度服务会变得越来越浅。它们的接口会重新变宽。这一次，由于集成需求，引入更改的成本也会上升，整个系统的架构将变成令人恐惧的分布式泥球。这在图\
  \ 14-7 中有所描述。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_322_0.png)\n\n图 14-7.\
  \ 粒度和更改成本\n\n现在我们已经了解了微服务是什么，让我们看看领域驱动设计如何帮助我们找到深度服务的边界。\n\n### 领域驱动设计与微服务的边界\n\n\
  作为微服务，上一章讨论的许多领域驱动设计模式都与边界有关：有界上下文是模型的边界，子域限定业务能力，而聚合和值对象是事务边界。让我们看看这些边界中哪一个适合微服务的概念。\n\
  \n#### 有界上下文\n\n微服务和有界上下文模式有很多共同点，以至于这些模式经常被互换使用。让我们看看是否确实如此：有界上下文的边界是否与有效微服务的边界相关？\n\
  \n微服务和有界上下文都是物理边界。微服务作为有界上下文，由单个团队拥有。如同有界上下文中一样，冲突的模型不能在微服务中实现，导致接口复杂。微服务确实是有界上下文。但这种关系反过来成立吗？我们可以说有界上下文是微服务吗？\n\
  \n正如你在第 3 章中学到的，有界上下文保护通用语言和模型的一致性。不能在同一个有界上下文中实现冲突的模型。假设你正在开发一个广告管理系统。在系统的业务域中，业务实体\
  \ Lead 在促销和销售上下文中由不同的模型表示。因此，促销和销售是有界上下文，每个上下文定义了在各自边界内有效的 Campaign 实体的唯一一个模型，如图\
  \ 14-8 所示。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_324_0.png)\n\n图 14-8. 有界上下文\n\
  \n为简单起见，让我们假设系统中除了 Lead 之外没有其他冲突的模型。这使得得到的有界上下文自然较宽——每个有界上下文可以包含多个子域。子域可以从一个有界上下文移动到另一个有界上下文。只要子域不暗示冲突的模型，图\
  \ 14-9 中的所有替代分解都是完全有效的有界上下文。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_325_0.png)\n\
  \n图 14-9. 有界上下文的替代分解\n\n对有界上下文的不同分解归因于不同的需求，例如不同团队的大小和结构、生命周期依赖等。但我们可以说在这个例子中所有有效有界上下文都必然是微服务吗？不行。尤其是考虑到分解\
  \ 1 中两个有界上下文相对较宽的功能。\n\n因此，微服务与有界上下文之间的关系不是对称的。虽然微服务是有界上下文，但并非每个有界上下文都是微服务。另一方面，有界上下文表示最大有效单体的边界。这种单体不应与泥球混淆；它是一种可行的设计选择，可以保护其通用语言或其对业务域的模型的一致性。如\n\
  \n\n\n我们将在第 15 章讨论，这种宽泛的边界在某些情况下比微服务更有效。\n\n图 14-10 直观地展示了有界上下文与微服务之间的关系。有界上下文与微服务之间的区域是安全的。这些都是有效的设计选项。然而，如果系统没有分解为适当的有界上下文，或分解超过了微服务的阈值，则会分别导致大泥球或分布式大泥球。\n\
  \n![](img/b742a71dea5d5dd509847f82600a6ad1_326_0.png)\n\n图 14-10. 粒度和模块化\n\n接下来，让我们考察另一个极端：聚合是否可以帮助找到微服务的边界。\n\
  \n### 聚合\n\n虽然有界上下文对最宽的有效边界施加了限制，但聚合模式则相反。聚合的边界是可能的最窄边界。\n\n将聚合分解为多个物理服务或有界上下文不仅是不理想的，而且正如你在附录\
  \ A 中将学到的那样，至少会导致不期望的后果。\n\n作为有界上下文，聚合的边界也经常被认为可以驱动微服务的边界。聚合是一个不可分割的业务功能单元，它封装了其内部业务规则、不变量和逻辑的复杂性。也就是说，正如你在本章前面学到的那样，微服务并不是关于单个服务。单个服务必须在其与其他系统组件的交互上下文中考虑：\n\
  \n- 相关聚合是否与其子域中的其他聚合进行通信？\n- 它是否与其他聚合共享值对象？\n- 聚合的业务逻辑变更影响其子域中其他组件的可能性有多大，反之亦然？\n\
  \n聚合与其子域中的其他业务实体关系越强，作为单个服务时它就越浅。\n\n在某些情况下，将聚合作为服务会产生模块化设计。然而，更常见的是，这种细粒度的服务会增加整个系统的全局复杂性。\n\
  \n### 子域\n\n设计微服务的一个更平衡的启发式方法是使服务与业务子域的边界保持一致。正如你在第 1 章学到的那样，子域与细粒度的业务能力相关。这些是公司在其实务域中竞争所需的业务构建块。从业务域的角度来看，子域描述了能力——业务做了什么——而不解释这些能力是如何实现的。从技术角度来看，子域代表了一组连贯用例的集合：使用业务域的相同模型，操作相同或密切相关的数据，并具有强功能关系。一个用例的业务需求变更很可能会影响其他用例，如图\
  \ 14-11 所示。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_328_0.png)\n\n图 14-11. 子域\n\
  \n子域的粒度以及对功能——“做什么”而非“怎么做”的关注，使得子域自然成为深模块。子域的描述——功能——封装了更复杂的实现细节——逻辑。子域中包含的用例的连贯性也确保了由此产生的模块的深度。在许多情况下将它们拆分会产生更复杂的公共接口，从而导致模块更浅。所有这些都使得子域成为设计微服务的安全边界。\n\
  \n将微服务与子域对齐是一个安全的启发式方法，可为大多数微服务产生最优解。也就是说，会有某些情况其他边界会更有效；例如，保持在有界上下文更宽的语言边界内，或由于非功能性需求而退回到以聚合作为微服务。解决方案不仅取决于业务域，还取决于组织的架构、业务战略和非功能性需求。正如我们在第\
  \ 11 章讨论的那样，持续适应环境变化地调整软件架构和设计至关重要。\n\n### 压缩微服务的公共接口\n\n除了寻找服务边界外，领域驱动设计还可以帮助使服务更深。本节演示了开放主机服务和反腐败层模式如何简化微服务的公共接口。\n\
  \n### 开放主机服务\n\n开放主机服务将有界上下文对业务域的模型与用于与其他系统组件集成的模型解耦，如图 14-12 所示。\n\n引入集成导向的模型，即发布语言，降低了系统的全局复杂性。首先，它允许我们在不影响其消费者情况下演进服务的实现：新的实现模型可以翻译为现有的发布语言。其次，发布语言暴露了一个更受约束的模型。它围绕集成需求设计。它封装了与服务消费者无关的实现复杂性。例如，它可以以对消费者更方便的模型暴露更少的数据。\n\
  \n在相同实现（逻辑）之上拥有更简单的公共接口（功能）使服务“更深”，并有助于更有效的微服务设计。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_330_0.png)\n\
  \n图 14-12. 通过发布语言集成服务\n\n### 反腐败层\n\n反腐败层（ACL）模式则反向工作。它减少了服务与其他有界上下文集成的复杂性。传统上，反腐败层属于它所保护的有界上下文。然而，正如我们在第\
  \ 9 章讨论的那样，这一概念可以更进一步，作为一个独立服务实现。\n\n图 14-13 中的 ACL 服务同时降低了消费有界上下文的局部复杂性和系统的全局复杂性。消费有界上下文的业务复杂性与集成复杂性分离。后者被卸载到\
  \ ACL 服务。由于消费有界上下文使用更方便的集成导向模型，其公共接口被压缩——它不反映生产服务暴露的集成复杂性。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_331_0.png)\n\
  \n图 14-13. 作为独立服务的反腐败层\n\n### 结论\n\n历史上，微服务架构风格与领域驱动设计深度交织，以至于微服务和有界上下文这两个术语经常被互换使用。在本章中，我们分析了两者之间的联系，并看到它们并非同一事物。\n\
  \n所有微服务都是有界上下文，但并非所有有界上下文都是微服务。从本质上讲，微服务定义了服务的最小有效边界，而有界上下文保护所包含模型的<|message|> 一致性并代表最宽的有效边界。将边界定义为比其有界上下文更宽会导致大泥球，而比微服务更小的边界会导致分布式大泥球。\n\
  \n尽管如此，微服务与领域驱动设计之间的联系仍然紧密。我们看到了如何使用领域驱动设计工具来设计有效的微服务边界。\n\n在第 15 章中，我们将继续从不同角度讨论高级系统架构：通过事件驱动架构进行异步集成。你将学习如何利用不同种类的事件消息来进一步优化微服务的边界。\n\
  \n## 练习\n\n- 1. 有界上下文与微服务之间的关系是什么？\n  a. 所有微服务都是有界上下文。\n  b. 所有有界上下文都是微服务。\n  c.\
  \ 微服务和有界上下文是同一概念的不同术语。\n  d. 微服务和有界上下文是完全不同的概念，无法比较。\n- 2. 微服务的“微”应该指什么？\n  a. 实现微服务的团队所需的披萨数量。该指标必须考虑团队成员不同的饮食偏好和平均每日卡路里摄入量。\n\
  \n\n\n\n\n+   b. 实现服务功能所需的代码行数。由于该指标与行的宽度无关，因此最好在超宽显示器上实现微服务。\n\n+   c. 设计基于微服务的系统最重要的方面是获取微服务友好的中间件和其他基础设施组件，最好来自微服务认证的供应商。\n\
  \n+   d. 跨越服务边界并在其公共接口中体现的业务域及其复杂性的知识。\n\n3. 什么是安全的组件边界？\n\n+   a. 比有界上下文更宽的边界。\n\
  \n+   b. 比微服务更窄的边界。\n\n+   c. 有界上下文（最宽）与微服务（最窄）之间的边界。\n\n+   d. 所有边界都是安全的。\n\n4.\
  \ 将微服务与聚合的边界对齐是否是一个好的设计决策？\n\n+   a. 是的，聚合总是能构成合适的微服务。\n\n+   b. 不，聚合绝不应该作为独立的微服务暴露。\n\
  \n+   c. 不可能从单个聚合中构建微服务。\n\n+   d. 该决策取决于业务域。\n\n1 Reference model for service-oriented\
  \ architecture v1.0. (n.d.). Retrieved June 14, 2021, from OASIS.\n"
- "## 第15章 事件驱动架构\n\n与微服务一样，事件驱动架构（EDA）在现代分布式系统中无处不在。许多人建议在设计松耦合、可扩展、容错的分布式系统时，将事件驱动通信作为默认的集成机制。\n\
  \n事件驱动架构通常与领域驱动设计相关联。毕竟，EDA 基于事件，而事件在 DDD 中也很突出——我们有领域事件，并且在需要时甚至将事件用作系统的事实来源。利用\
  \ DDD 的事件作为使用事件驱动架构的基础可能很诱人。但这是一个好主意吗？\n\n事件并不是一种秘密调料，你可以将其倒在遗留系统上，就将其转变为松耦合的分布式系统。恰恰相反：粗心的\
  \ EDA 应用会将模块化单体转变为分布式的大泥球。\n\n在本章中，我们将探讨 EDA 与 DDD 之间的相互作用。你将学习事件驱动架构的基本构建块、失败的\
  \ EDA 项目的常见原因，以及如何利用 DDD 的工具来设计有效的异步集成系统。\n\n### 事件驱动架构\n\n简单地说，*事件驱动架构*是一种架构风格，其中系统的组件通过交换事件消息异步相互通信（参见图\
  \ 15-1）。\n\n组件不会同步调用服务的端点，而是发布事件以通知其他系统元素域中的变化。组件可以订阅系统中引发的事件并相应地做出反应。事件驱动执行流程的典型示例是第\
  \ 9 章中描述的 saga 模式。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_336_0.png)\n\n图 15-1.\
  \ 异步通信\n\n必须强调事件驱动架构与事件溯源之间的区别。正如我们在第 7 章中所讨论的，事件溯源是一种将状态变化作为一系列事件捕获的方法。\n\n尽管事件驱动架构和事件溯源都基于事件，但这两种模式在概念上是不同的。EDA\
  \ 指的是服务之间的通信，而事件溯源发生在服务内部。为事件溯源设计的事件表示状态转换（在事件溯源领域模型中的聚合中实现），它们旨在捕获业务域的复杂性，并不 intended\
  \ 用于将服务与其他系统组件集成。\n\n正如你将在本章后面看到的那样，事件有三种类型，其中一些更适合集成。\n\n### 事件\n\n在 EDA 系统中，事件的交换是集成组件并使其成为系统的关键通信机制。让我们更详细地看看事件，并了解它们与消息的区别。\n\
  \n### 事件、命令和消息\n\n到目前为止，事件的定义与消息模式的定义相似。¹ 然而，两者是不同的。事件是一种消息，但消息不一定是事件。有两种类型的消息：\n\
  \n*Event*\n\n    描述已经发生的更改的消息\n\n*Command*\n\n    描述需要执行的操作的消息\n\n事件是已经发生的事情，而命令是执行某事的指令。事件和命令都可以通过消息异步通信。然而，命令可以被拒绝：命令的目标可以拒绝执行命令，例如，如果命令无效或与系统的业务规则相矛盾。另一方面，事件的接收者无法取消事件。事件描述的是已经发生的事情。唯一可以推翻事件的方法是发出补偿操作——命令，正如在\
  \ saga 模式中执行的。\n\n由于事件描述的是已经发生的事情，事件的名称应以过去时形式表述：例如 DeliveryScheduled、ShipmentCompleted\
  \ 或 DeliveryConfirmed。\n\n### 结构\n\n事件是一个可以序列化并使用所选消息平台传输的数据记录。典型的事件模式包括事件的元数据及其有效载荷——事件传达的信息：\n\
  \n```\n{\n  \"type\": \"delivery-confirmed\",\n  \"event-id\": \"14101928-4d79-4da6-9486-dbc4837bc612\"\
  ,\n  \"correlation-id\": \"08011958-6066-4815-8dbe-dee6d9e5ebac\",\n  \"delivery-id\"\
  : \"05011927-a328-4860-a106-737b2929db4e\",\n  \"timestamp\": 1615718833,\n  \"\
  payload\": {\n    \"confirmed-by\": \"17bc9223-bdd6-4382-954d-f1410fd286bd\",\n\
  \    \"delivery-time\": 1615701406\n  }\n}\n```\n\n事件的有效载荷不仅描述了事件传达的信息，还定义了事件的类型。让我们详细讨论三种类型的事件以及它们之间的区别。\n\
  \n### 事件类型\n\n事件可分为三种类型之一：² 事件通知、事件携带状态传输或领域事件。\n\n### 事件通知\n\n事件通知是关于业务域中变化的消息，其他组件会对此做出反应。示例包括\
  \ PaycheckGenerated 和 CampaignPublished 等。\n\n事件通知不应冗长：目标是通知感兴趣的各方事件的发生，但通知不应携带订阅者对事件做出反应所需的所有信息。例如：\n\
  \n```\n{\n  \"type\": \"paycheck-generated\",\n  \"event-id\": \"537ec7c2-d1a1-2005-8654-96aee1116b72\"\
  ,\n  \"delivery-id\": \"05011927-a328-4860-a106-737b2929db4e\",\n  \"timestamp\"\
  : 1615726445,\n  \"payload\": {\n    \"employee-id\": \"456123\",\n    \"link\"\
  : \"/paychecks/456123/2021/01\"\n  }\n}\n```\n\n在前面的代码中，事件通知外部组件已生成工资单。它不携带与工资单相关的所有信息。相反，接收方可以使用链接获取更详细的信息。此通知流程如图\
  \ 15-2 所示。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_339_0.png)\n\n图 15-2. 事件通知流程\n\
  \n从某种意义上说，通过事件通知消息进行的集成类似于美国的无线紧急警报（WEA）系统和欧洲的 EU-Alert 系统（参见图 15-3）。这些系统使用蜂窝基站广播简短消息，通知公民公共卫生问题、安全威胁和其他紧急情况。这些系统的消息长度限制为最多\
  \ 360 个字符。这条简短的消息足以通知你紧急情况，但你必须主动使用其他信息来源获取更多细节。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_340_0.png)\n\
  \n图 15-3. 紧急警报系统\n\n简洁的事件通知在多种场景下可能是可取的。让我们更仔细地看两个：安全性和并发性。\n\n### 安全性\n\n强制接收方显式查询详细信息可防止通过消息基础设施共享敏感信息，并要求对订阅者访问数据进行额外授权。\n\
  \n### 并发性\n\n由于事件驱动集成的异步特性，信息在到达订阅者时可能已经过时。如果信息的性质对竞争条件敏感，则显式查询它可以获得最新的状态。\n\n此外，在并发消费者情况下，其中只有一个订阅者应处理事件，查询过程可以\n\
  \n\n\n与悲观锁集成。这确保了生产者端没有其他消费者能够处理该消息。\n\n### 事件携带状态传输\n\n事件携带状态传输（ECST）消息通知订阅者生产者内部状态的变化。与事件通知消息不同，ECST\
  \ 消息包含反映状态变化的所有数据。\n\nECST 消息可以有两种形式。第一种是被修改实体的状态的完整快照：\n\n```\n{\n  \"type\": \"\
  customer-updated\",\n  \"event-id\": \"6b7ce6c6-8587-4e4f-924a-cec028000ce6\",\n\
  \  \"customer-id\": \"01b18d56-b79a-4873-ac99-3d9f767dbe61\",\n  \"timestamp\":\
  \ 1615728520,\n  \"payload\": {\n    \"first-name\": \"Carolyn\",\n    \"last-name\"\
  : \"Hayes\",\n    \"phone\": \"555-1022\",\n    \"status\": \"follow-up-set\",\n\
  \    \"follow-up-date\": \"2021/05/08\",\n    \"birthday\": \"1982/04/05\",\n  \
  \  \"version\": 7\n  }\n}\n```\n\n前述示例中的 ECST 消息包含客户更新状态的完整快照。在处理大型数据结构时，将 ECST\
  \ 消息中仅包含实际被修改的字段可能是合理的：\n\n```\n{\n  \"type\": \"customer-updated\",\n  \"event-id\"\
  : \"6b7ce6c6-8587-4e4f-924a-cec028000ce6\",\n  \"customer-id\": \"01b18d56-b79a-4873-ac99-3d9f767dbe61\"\
  ,\n  \"timestamp\": 1615728520,\n  \"payload\": {\n    \"status\": \"follow-up-set\"\
  ,\n    \"follow-up-date\": \"2021/05/10\",\n    \"version\": 8\n    }\n}\n```\n\n\
  无论 ECST 消息包含完整快照还是仅更新的字段，此类事件流都允许消费者持有实体的状态的本地缓存并使用它。从概念上讲，使用事件携带状态传输消息是一种异步数据复制机制。这种方法使系统更具容错性，意味着即使生产者不可用，消费者也可以继续运行。这也是提高需要处理来自多个来源数据的组件性能的一种方法。无需每次需要数据时都查询数据源，所有数据都可以本地缓存，如图\
  \ 15-4 所示。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_342_0.png)\n\n图 15-4. 后端为前端\n\
  \n## 领域事件\n\n第三种事件消息类型是我们于第 6 章中描述的领域事件。在某种程度上，领域事件介于事件通知和 ECST 消息之间：它们既描述\n\n业务域中的重要事件，又包含描述该事件的所有数据。尽管相似，这些类型的消息在概念上是不同的。\n\
  \n### 领域事件与事件通知\n\n领域事件和事件通知都描述了生产者业务域中的变化。也就是说，存在两个概念上的差异。\n\n首先，领域事件包含描述事件的所有信息。消费者无需采取任何进一步操作即可获得完整的信息。\n\
  \n其次，建模意图不同。事件通知的设计意图是减轻与其他组件的集成。另一方面，领域事件旨在建模和描述业务域。即使没有外部消费者对它们感兴趣，领域事件也很有用。在事件溯源系统中尤其如此，其中领域事件用于建模所有可能的状态转换。如果所有可用的领域事件都有外部消费者感兴趣，将导致设计不佳。我们将在本章后面更详细地讨论这一点。\n\
  \n### 领域事件与事件携带状态传输\n\n领域事件中包含的数据在概念上与典型的 ECST 消息模式不同。\n\nECST 消息提供足够的信息来保存生产者数据的本地缓存。单个领域事件不打算暴露如此丰富的模型。即使特定领域事件中包含的数据也不足以缓存聚合的状态，因为消费者未订阅的其他领域事件可能会影响相同的字段。\n\
  \n此外，与通知事件的情况一样，两种类型消息的建模意图不同。领域事件中包含的数据并非旨在描述聚合的状态。相反，它描述了在其生命周期中发生的业务事件。\n\n###\
  \ 事件类型：示例\n\n以下是演示三种事件类型之间差异的示例。考虑以下三种表示结婚事件的方式：\n\n```\neventNotification = {\n\
  \  \"type\": \"marriage-recorded\",\n  \"person-id\": \"01b9a761\",\n  \"payload\"\
  : {\n    \"person-id\": \"126a7b61\",\n    \"details\": \"/01b9a761/marriage-data\"\
  \n  }\n};\n\necst = {\n  \"type\": \"personal-details-changed\",\n  \"person-id\"\
  : \"01b9a761\",\n  \"payload\": {\n    \"new-last-name\": \"Williams\"\n  }\n};\n\
  \ndomainEvent = {\n  \"type\": \"married\",\n  \"person-id\": \"01b9a761\",\n  \"\
  payload\": {\n    \"person-id\": \"126a7b61\",\n    \"assumed-partner-last-name\"\
  : true\n  }\n};\n```\n\nmarriage-recorded 是一个事件通知消息。它除了说明指定 ID 的人已结婚之外不包含任何信息。它包含关于事件的最小信息，并且\n\
  \n对更多细节感兴趣的消费者将不得不跟随 details 字段中的链接。\n\npersonal-details-changed 是一个事件携带状态传输消息。它描述了个人信息的更改，即其姓氏已更改。消息并未解释更改的原因。是结婚还是离婚？\n\
  \n最后，married 是一个领域事件。它尽可能接近业务域中事件的本质进行建模。它包含个人的 ID 和一个表示个人是否采用了其伴侣姓氏的标志。\n\n###\
  \ 设计事件驱动集成\n\n正如我们在第 3 章中讨论的那样，软件设计主要关乎边界。边界定义了内部属于什么、外部保留什么，最重要的是，什么跨越边界——本质上，组件如何相互集成。EDA\
  \ 系统中的事件是第一类设计元素，影响组件如何集成以及组件本身的边界。选择正确的事件消息类型决定了分布式系统是解耦还是耦合。\n\n在本节中，您将学习应用不同事件类型的启发式方法。但首先，让我们看看如何使用事件来设计一个紧密耦合的分布式大泥球。\n\
  \n### 分布式大泥球\n\n考虑图 15-5 所示的系统。\n\nCRM 有界上下文被实现为事件溯源领域模型。当 CRM 系统必须与\n\n营销有界上下文集成时，团队决定利用事件溯源数据模型的灵活性，让消费者——在这种情况下是营销——订阅\
  \ CRM 的领域事件并使用它们来投影适合其需求的模型。\n\n当引入 AdsOptimization 有界上下文时，它也必须处理 CRM 有界上下文产生的信息。同样，团队决定让\
  \ AdsOptimization 订阅 CRM 中产生的所有领域事件并投影适合 AdsOptimization 需求的模型。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_346_0.png)\n\
  \n图 15-5. 紧密耦合的分布式系统\n\n有趣的是，营销和 AdsOptimization 有界上下文都必须以相同格式呈现客户信息，因此最终都从\n\n\
  CRM 的领域事件中投影出相同的模型：每个客户状态的扁平化快照。\n\nReporting 有界上下文仅订阅 CRM 发布的部分领域事件，并将其用作事件通知消息以获取\
  \ AdsOptimization 上下文中执行的计算。然而，由于两个 AdsOptimization 有界上下文都使用相同的事件来触发其计算，为了确保 Reporting\
  \ 模型得到更新，AdsOptimization 上下文引入了延迟。它在接收到消息后五分钟处理消息。\n\n这种设计很糟糕。让我们分析一下该系统中的耦合类型。\n\
  \n### 时间耦合\n\nAdsOptimization 和 Reporting 有界上下文在时间上耦合：它们依赖于严格的执行顺序。AdsOptimization\
  \ 组件必须在 Reporting 模块被触发之前完成处理。如果顺序相反，Reporting 系统中将产生不一致的数据。\n\n为了强制执行所需的执行顺序，工程师在\
  \ Reporting 系统中引入了处理延迟。五分钟的延迟让 AdsOptimization 组件完成所需的计算。显然，这并不能防止执行顺序错误：\n\n- AdsOptimization\
  \ 可能过载，无法在五分钟内完成处理。\n- 网络问题可能会延迟传入消息向 AdsOptimization 服务的传递。\n- AdsOptimization\
  \ 组件可能出现故障并停止处理传入消息。\n\n\n\n\n\n## 功能耦合\n\nMarketing 和 AdsOptimization 有界上下文都订阅了\
  \ CRM 的领域事件，并最终实现了客户数据的相同投影。换句话说，将传入的领域事件转换为基于状态的表示的业务逻辑在两个有界上下文中都被重复了，并且它们有相同的变更原因：它们必须以相同的格式呈现客户数据。因此，如果在其中一个组件中更改了投影，则该更改必须在第二个有界上下文中复制。\n\
  \n这就是功能耦合的一个例子：多个组件实现相同的业务功能，如果它发生变化，则两个组件都必须同时发生变化。\n\n## 实现耦合\n\n这种耦合更微妙。Marketing\
  \ 和 AdsOptimization 有界上下文订阅了 CRM 事件溯源模型生成的所有领域事件。因此，CRM 实现的变更，例如添加新的领域事件或更改现有事件的模式，必须反映在两个订阅的有界上下文中！如果不这样做，可能会导致数据不一致。例如，如果事件的模式发生变化，订阅者的投影逻辑将失败。另一方面，如果向\
  \ CRM 模型添加了新的领域事件，它可能会影响投影模型，因此忽略它将导致投影不一致的状态。\n\n## 重构事件驱动集成\n\n正如你所见，盲目地向系统灌输事件并不会使其解耦或具有弹性。你可能会认为这是一个不切实际的例子，但不幸的是，这个例子是基于一个真实的故事。\n\
  \n让我们看看如何调整事件来显著改善设计。\n\n公开构成 CRM 数据模型的所有领域事件会将订阅者耦合到生产者的实现细节。实现耦合可以通过公开更受限制的事件集或不同类型的事件来解决。\n\
  \nMarketing 和 AdsOptimization 订阅者通过实现相同的业务功能在功能上耦合在一起。\n\n实现耦合和功能耦合都可以通过将投影逻辑封装在生产者中来解决：CRM\
  \ 有界上下文。CRM 不公开其实现细节，而是可以遵循消费者驱动契约模式：投影消费者需要的模型并使其成为有界上下文发布语言的一部分——一个集成特定的模型，与内部实现模型解耦。结果，消费者获得所需的所有数据，并且不知道\
  \ CRM 的实现模型。\n\n为了解决 AdsOptimization 和 Reporting 有界上下文之间的时间耦合，AdsOptimization 组件可以发布事件通知消息，触发\
  \ Reporting 组件获取所需的数据。重构后的系统如图 15-6 所示。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_350_0.png)\n\
  \n图 15-6. 重构后的系统\n\n## 事件驱动设计启发式\n\n将事件类型与手头的任务相匹配，可以使 resulting 设计的耦合度降低几个数量级，更灵活且容错。让我们总结一下所应用更改背后的设计启发式。\n\
  \n## 假设最坏情况\n\n正如 Andrew Grove 所说，只有偏执狂才能生存。³ 将其作为设计事件驱动系统时的指导原则：\n\n- 网络将会变慢。\n\
  - 服务器将在最不方便的时刻失败。\n- 事件会乱序到达。\n- 事件会被重复。\n\n最重要的是，这些事件最常发生在周末和公共假期。\n\n事件驱动架构中的\
  \ *driven* 一词意味着你的整个系统都依赖于消息的成功传递。因此，避免像瘟疫一样避免“事情会没事”的心态。确保事件始终一致地传递，无论发生什么：\n\n\
  - 使用 outbox 模式可靠地发布消息。\n- 在发布消息时，确保订阅者能够对消息进行去重并识别和重新排序乱序的消息。\n- 在编排需要发出补偿操作的跨有界上下文流程时，利用\
  \ saga 和流程管理器模式。\n\n## 使用公共和私有事件\n\n在发布领域事件时，尤其是事件溯源聚合时，要警惕暴露实现细节。将事件视为有界上下文公共接口的固有部分。因此，在实现开放主机服务模式时，确保事件反映在有界上下文的发布语言中。关于转换基于事件的模型的模式在第\
  \ 9 章中讨论。\n\n在设计有界上下文的公共接口时，利用不同类型的事件。事件携带状态传输消息将实现模型压缩为更紧凑的模型，仅传达消费者需要的信息。\n\n\
  事件通知消息可用于进一步最小化公共接口。\n\n最后，谨慎使用领域事件与外部有界上下文通信。考虑设计一组专用的公共领域事件。\n\n## 评估一致性要求\n\n\
  在设计事件驱动通信时，将有界上下文的一致性要求作为选择事件类型的额外启发式：\n\n- 如果组件可以接受最终一致的数据，请使用事件携带状态传输消息。\n- 如果消费者需要读取生产者状态中的最后一次写入，请发出事件通知消息，然后查询以获取生产者的最新状态。\n\
  \n### 结论\n\n本章将事件驱动架构作为设计有界上下文公共接口的固有方面进行了介绍。你学习了可用于跨有界上下文通信的三种事件类型：\n\n*事件通知*\n\
  \n通知发生了重要的事情，但需要消费者显式查询生产者以获取额外信息。\n\n*事件携带状态传输*\n\n基于消息的数据复制机制。每个事件都包含可用于维护生产者数据本地缓存的状态快照。\n\
  \n## 领域事件\n\n描述生产者业务域中事件的消息。\n\n使用不合适的事件类型会破坏基于 EDA 的系统，无意中将其变成大泥球。要为集成选择正确的事件类型，请评估有界上下文的一致性要求并警惕暴露实现细节。设计明确的公共和私有事件集。最后，确保系统即使在技术问题和中断面前也能传递消息。\n\
  \n## 练习\n\n- 1. 以下哪些陈述是正确的？\n  a. 事件驱动架构定义了旨在跨组件边界传输的事件。\n  b. 事件溯源定义了旨在保留在有界上下文边界内的事件。\n\
  \  c. 事件驱动架构和事件溯源是同一模式的不同术语。\n  d. A 和 B 正确。\n- 2. 哪种类型的事件最适合传达状态变更？\n  a. 事件通知。\n\
  \  b. 事件携带状态传输。\n  c. 领域事件。\n  d. 所有事件类型都同样适合传达状态变更。\n- 3. 哪个有界上下文集成模式要求明确定义公共事件？\n\
  \  a. 开放主机服务\n  b. 反腐败层\n  c. 共享内核\n  d. 顺从者\n- 4. 服务 S1 和 S2 异步集成。S1 必须通信数据并且 S2\
  \ 需要能够读取 S1 中最后写入的数据。哪种类型的事件适合此集成场景？\n  a. S2 应发布事件携带状态传输事件。\n  b. S2 应发布公共事件通知，这将提示\
  \ S1 发出同步请求以获取最新信息。\n  c. S2 应发布领域事件。\n  d. A 和 B。\n\n1 Hohpe, G., & Woolf, B. (2003).\
  \ Enterprise Integration Patterns: Designing, Building, and Deploying Messaging\
  \ Solutions. Boston: Addison-Wesley.\n\n2 Fowler, M. (n.d.). What do you mean by\
  \ “Event-Driven”? Retrieved August 12, 2021, from Martin Fowler (blog).\n\n3 Grove,\
  \ A. S. (1998). Only the Paranoid Survive. London: HarperCollins Business.\n\n\n\
  \n\n"
- "## 第16章 数据网格\n\n迄今为止，本书中我们讨论了用于构建运营系统的模型。运营系统实现实时交易，操作系统的系统数据并协调其与环境的日常交互。这些模型是联机事务处理（OLTP）数据。另一种值得关注并进行适当建模的数据类型是联机分析处理（OLAP）数据。\n\
  \n在本章中，你将了解一种名为数据网格的分析数据管理架构。你将看到基于数据网格的架构如何工作，以及它与更传统的 OLAP 数据管理方法有何不同。最终，你将看到领域驱动设计和数据网格如何相互适应。但首先，让我们看看这些分析数据模型是什么，以及为什么我们不能直接重用运营模型用于分析用例。\n\
  \n#### 分析数据模型与事务数据模型\n\n人们常说知识就是力量。分析数据是赋予公司利用积累的数据洞察如何优化业务、更好地了解客户需求，甚至通过训练机器学习（ML）模型来做出自动化决策的力量。\n\
  \n分析模型（OLAP）和运营模型（OLTP）服务于不同类型的消费者，支持不同种类的用例的实现，因此遵循不同的设计原则。\n\n运营模型围绕系统业务域中的各种实体构建，实现其生命周期并协调它们之间的交互。这些模型如图\
  \ 16-1 所示，服务于运营系统，因此必须优化以支持实时业务交易。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_356_0.png)\n\
  \n图 16-1. 描述运营模型中实体之间关系的数据库关系模式\n\n分析模型旨在为运营系统提供不同的洞察。分析模型不是实现实时交易，而是旨在提供对业务活动绩效的洞察，更重要的是，如何优化业务运营以实现更大价值。\n\
  \n从数据结构角度来看，OLAP 模型忽略了单个业务实体，而是通过建模事实表和维度表来关注业务活动。我们接下来将更详细地查看这两个表。\n\n#### 事实表\n\
  \n事实代表已经发生的业务活动。事实与领域事件的概念相似，因为两者都描述过去发生的事情。然而，与领域事件相反，事实名称没有风格上的要求必须以过去时动词命名。尽管如此，事实代表业务流程的活动。例如，事实表\
  \ `Fact_CustomerOnboardings` 将包含每个新入驻客户的记录，而 `Fact_Sales` 则包含每笔已确认销售的记录。图 16-2 显示了一个事实表的示例。\n\
  \n|  | Fact_SolvedCases |\n|---|---|\n| PK | CaseId |\n| FK | AgentKey |\n| FK |\
  \ CategoryKey |\n| FK | OpenedOnDateKey |\n| FK | ClosedOnDateKey |\n| FK | CustomerKey\
  \ |\n\n图 16-2. 包含公司支持台解决案例记录的事实表\n\n此外，与领域事件类似，事实记录永远不会被删除或修改：分析数据是仅追加数据：表达当前数据已过时的唯一方法是追加一条包含当前状态的新记录。请考虑图\
  \ 16-3 中的事实表 Fact_CaseStatus。它包含支持请求状态随时间变化的度量。事实名称中没有明显的动词，但事实所捕获的业务流程是处理支持案例的过程。\n\
  \n| Fact_CaseStatus |  |  |  |  |  |\n|---|---|---|---|---|---|\n| CaseId | Timestamp\
  \ | AgentKey | CategoryKey | CustomerKey | StatusKey |\n| case-141408202228 | 2021-06-15\
  \ 10:30:00 |  | 12 | 10060512 | 1 |\n| case-141408202228 | 15/06/2021 11:00:00 |\
  \ 285889 | 12 | 10060512 | 2 |\n| case-141408202228 | 15/06/2021 11:30:00 | 285889\
  \ | 12 | 10060512 | 2 |\n| case-141408202228 | 15/06/2021 12:00:00 | 285889 | 12\
  \ | 10060512 | 3 |\n| case-141408202228 | 15/06/2021 12:30:00 | 285889 | 12 | 10060512\
  \ | 2 |\n| case-141408202228 | 15/06/2021 13:00:00 | 285889 | 12 | 10060512 | 4\
  \ |\n\n图 16-3. 描述支持案例生命周期中状态变化的事实表\n\nOLAP 与 OLTP 模型之间的另一个显著区别是数据的粒度。运营系统需要最精确的数据来处理业务交易。对于分析模型，在许多用例中聚合数据更有效。例如，在图\
  \ 16-3 中显示的 Fact_CaseStatus 表中，可以看到快照每 30 分钟拍摄一次。使用模型的数据分析师决定什么粒度水平最适合他们的需求。为每次度量变化创建事实记录——例如每次案例数据变化——在某些情况下会造成浪费，在其他情况下甚至在技术上不可行。\n\
  \n#### 维度表\n\n分析模型另一个基本构建块是维度。如果事实代表业务流程或动作（动词），则维度描述事实（形容词）。\n\n维度旨在描述事实的属性，并作为外键从事实表引用到维度表。建模为维度的属性是任何在不同事实记录中重复出现且无法放入单个列中的度量或数据。例如，图\
  \ 16-4 中的模式将 SolvedCases 事实与其维度进行了扩充。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_360_0.png)\n\
  \n图 16-4. 被其维度包围的 SolvedCases 事实\n\n维度高度规范化的原因是分析系统需要支持灵活查询。这是运营模型和分析模型之间的另一个区别。可以预测运营模型将如何被查询以支持业务需求。分析模型的查询模式是不可预测的。数据分析师需要灵活地查看数据的方式，很难预测未来会执行什么查询。因此，规范化支持跨不同维度的动态查询和过滤，以及对事实数据的分组。\n\
  \n#### 分析模型\n\n图 16-5 中描绘的表结构称为 *星型模式*。它基于事实与其维度之间多对一的关系：每个维度记录被许多事实使用；事实的外键指向单个维度记录。\n\
  \n![](img/b742a71dea5d5dd509847f82600a6ad1_361_0.png)\n\n*图 16-5. 事实与其维度之间的多对一关系*\n\
  \n另一种主要的分析模型是雪花模式。雪花模式基于相同的构建块：事实和维度。然而，在雪花模式中，维度是多层次的：每个维度进一步规范化为更细粒度的维度，如图 16-6\
  \ 所示。\n\n由于额外的规范化，雪花模式将使用更少的空间来存储维度数据，并且更容易维护。\n\n然而，查询事实数据将需要连接更多表，因此需要更多的计算资源。\n\
  \n星型模式和雪花模式都允许数据分析师分析业务绩效，获得可以优化并构建到业务智能（BI）报告中的洞察。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_362_0.png)\n\
  \n图 16-6. 雪花模式中的多层次维度\n\n#### 分析数据管理平台\n\n让我们将讨论从分析建模转移到支持生成和提供分析数据的管理架构。在本节中，我们将讨论两种常见的分析数据架构：数据仓库和数据湖。你将了解每种架构的基本工作原理，它们之间的区别，以及每种方法的挑战。\n\
  \n\n\n\n\n了解这两种架构的工作原理将为本章的主要主题奠定基础：数据网格范式及其与领域驱动设计的相互作用。\n\n### 数据仓库\n\n数据仓库（DWH）架构相对简单。从企业所有运营系统中提取数据，将源数据转换成语义分析模型，并将所得数据加载到面向数据分析的数据库中。该数据库即为数据仓库。\n\
  \n这种数据管理架构主要基于抽取-转换-加载（ETL）脚本。数据可以来自各种来源：运营数据库、流式事件、日志等。除了将源数据转换为基于事实/维度模型之外，转换步骤还可能包括其他操作，例如删除敏感数据、去重记录、重新排序事件、聚合细粒度事件等。在某些情况下，转换可能需要对传入数据进行临时存储。这被称为暂存区。\n\
  \n如图 16-7 所示的所得数据仓库包含涵盖企业所有业务流程的分析数据。数据使用 SQL 语言（或其方言之一）进行暴露，并被数据分析师和 BI 工程师使用。\n\
  \n![](img/b742a71dea5d5dd509847f82600a6ad1_364_0.png)\n\n图 16-7. 典型的企业数据仓库架构\n\n\
  细心的读者会注意到，数据仓库架构与第 2 章和第 3 章中讨论的一些挑战相似。\n\n首先，数据仓库架构的核心目标是构建企业范围的模型。该模型应描述企业所有系统产生的数据，并满足分析数据的各种用例。分析模型可实现例如优化业务、降低运营成本、做出智能业务决策、报告，甚至训练\
  \ ML 模型。正如你在第 3 章中所学到的，这种方法对于除最小规模的组织之外都是不切实际的。为手头的任务设计模型，例如构建报告或训练 ML 模型，是更有效且可扩展的方法。\n\
  \n构建包罗万象的模型这一挑战可以通过使用数据集市来部分解决。数据集市是一个数据库，其中保存了与明确的分析需求相关的数据，例如对单个业务部门的分析。在图 16-8\
  \ 所示的数据集市模型中，一个集市直接由来自运营系统的 ETL 流程填充，而另一个集市则从数据仓库中提取数据。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_365_0.png)\n\
  \n图 16-8. 增强了数据集市的企业数据仓库架构\n\n当数据从企业数据仓库摄取到数据集市时，企业范围的模型仍需要在数据仓库中定义。或者，数据集市可以实现专用的\
  \ ETL 流程，直接从运营系统中摄取数据。在这种情况下，所得模型使得跨不同集市查询数据变得困难——例如跨不同部门——因为它需要跨数据库查询并显著影响性能。\n\
  \n数据仓库架构的另一个具有挑战性的方面是，ETL 流程在分析型（OLAP）和运营型（OLTP）系统之间创建了紧密的耦合。ETL 脚本所消费的数据不一定通过系统的公共接口公开。通常，DWH\
  \ 系统只是简单地获取驻留在运营系统数据库中的所有数据。运营数据库中使用的模式不是公共接口，而是内部实现细节。因此，模式的细微更改注定会破坏数据仓库的 ETL\
  \ 脚本。\n\n由于运营和分析系统由 somewhat 遥远的组织单元实现和维护，两者之间的沟通具有挑战性，并导致团队之间产生大量摩擦。这种沟通模式如图 16-9\
  \ 所示。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_366_0.png)\n\n图 16-9. 通过直接从运营数据库获取数据填充数据仓库，忽略面向集成的公共接口\n\
  \n数据湖架构解决了数据仓库架构的一些不足。\n\n### 数据湖\n\n作为数据仓库，数据湖架构基于相同的概念，即摄取运营系统的数据并将其转换成语义分析模型。然而，这两种方法之间存在概念上的差异。\n\
  \n基于数据湖的系统会摄取运营系统的数据。然而，与立即转换成语义分析模型不同，数据以其原始形式，即原始运营模型的形式持久化。\n\n最终，原始数据无法满足数据分析师的需求。因此，数据工程师和\
  \ BI 工程师的工作是理解湖中的数据并实现 ETL 脚本，以生成分析模型并将其馈送到数据仓库。图 16-10 描述了数据湖架构。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_367_0.png)\n\
  \n图 16-10. 数据湖架构\n\n由于运营系统的数据以原始形式持久化，并且仅在之后才进行转换，因此数据湖允许使用多个面向任务的分析模型。一个模型可用于报告，另一个用于训练\
  \ ML 模型，等等。此外，未来可以添加新模型并使用现有原始数据进行初始化。\n\n话虽如此，分析模型的延迟生成增加了整体系统的复杂性。数据工程师实现和支持同一\
  \ ETL 脚本的多个版本以适应运营模型的不同的版本的情况并不少见，如图 16-11 所示。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_368_0.png)\n\
  \n图 16-11. 多个版本的同一 ETL 脚本以适应运营模型的不同版本\n\n此外，由于数据湖是无模式的——对传入数据没有施加模式——并且对传入数据的质量没有控制，因此在一定规模下，数据湖的数据会变得混乱。数据湖使摄取数据变得容易，但使用数据变得更加困难。或者，如常说，数据湖变成了数据沼泽。数据科学家的工作变得复杂数个数量级，以理清混乱并提取有用的分析数据。\n\
  \n### 数据仓库和数据湖架构的挑战\n\n数据仓库和数据湖架构都基于这样一个假设：用于分析摄取的数据越多，组织获得的洞察就越多。然而，这两种方法在“大数据”的压力下往往会崩溃。运营到分析模型的转换在规模上会收敛到数千个无法维护的、临时的\
  \ ETL 脚本。\n\n从建模角度来看，这两种架构都侵犯了运营系统的边界，并在其实现细节上创建了依赖。这种对实现模型的耦合在运营和分析系统团队之间造成了摩擦，往往到了为了不破坏分析系统的\
  \ ETL 作业而阻止对运营模型进行更改的地步。\n\n更糟糕的是，由于数据分析师和数据工程师属于不同的组织单元，他们通常缺乏运营系统开发团队所拥有的对业务领域的深入了解。取而代之的是，他们主要专门从事大数据工具。\n\
  \n最后但并非最不重要的一点是，对实现模型的耦合在基于领域驱动设计的项目中尤其严重，在这些项目中，重点是不断发展和改进业务领域的模型。因此，运营模型的变化可能在分析模型中产生不可预见的后果。这种变化在\
  \ DDD 项目中很常见，并经常导致研发与数据团队之间的摩擦。\n\n数据仓库和数据湖的这些局限性激发了一种新的分析数据管理架构：数据网格。\n\n### 数据网格\n\
  \n数据网格架构在某种意义上是分析数据的领域驱动设计。正如 DDD 的不同模式划定边界并保护其内容一样，数据网格架构为分析数据定义并保护模型和所有权边界。\n\n\
  数据网格架构基于四个核心原则：围绕领域分解数据、数据即产品、实现自主性、构建生态系统。让我们详细讨论每个原则。\n\n### 围绕领域分解数据\n\n\n\n\n\
  \n数据仓库和数据湖方法都旨在将企业的所有数据统一到一个大型模型中。由此产生的分析模型无效的原因与企业范围内的操作模型相同。此外，将来自所有系统的数据收集到一个位置会模糊各种数据元素的拥有边界。\n\
  \n与其构建单体分析模型，数据网格架构要求利用我们在第 3 章中针对操作数据讨论的相同解决方案：使用多个分析模型并将其与数据的来源对齐。这自然地使分析模型的拥有边界与有界上下文的边界保持一致，如图\
  \ 16-12 所示。当分析模型根据系统的有界上下文进行分解时，分析数据的生成就成为相应产品团队的责任。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_371_0.png)\n\
  \n图 16-12. 使分析模型的拥有边界与有界上下文的边界保持一致\n\n每个有界上下文现在都拥有其操作（OLTP）和分析（OLAP）模型。因此，同一个团队拥有操作模型，现在负责将其转换为分析模型。\n\
  \n### 数据即产品\n\n经典的数据管理架构使得发现、理解和获取高质量的分析数据变得困难。在数据湖的情况下，这种情况尤其严重。\n\n数据即产品原则要求将分析数据视为一等公民。相反，分析系统不必从可疑来源（内部数据库、日志文件等）获取操作数据，在基于数据网格的系统中，有界上下文通过如图\
  \ 16-13 所示的明确定义的输出端口提供分析数据。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_372_0.png)\n\
  \n图 16-13. 多语言数据端点向消费者公开分析数据\n\n分析数据应与任何公共 API 相同对待：\n\n- 应该很容易发现必要的端点：数据输出端口。\n\
  - 分析端点应具有明确定义的模式，描述所提供的数据及其格式。\n- 分析数据应该是可信的，并且与任何 API 一样，它应具有定义并受监控的服务等级协议（SLA）。\n\
  - 分析模型应像常规 API 一样进行版本控制，并相应地管理模型中的破坏性集成变更。\n\n此外，由于分析数据被视为产品，它必须满足其消费者的需求。有界上下文的团队负责确保由此产生的模型满足其消费者的需求。与数据仓库和数据湖架构相反，在数据网格中，数据质量的问责是首要关注的问题。\n\
  \n分布式数据管理架构的目标是允许细粒度的分析模型组合起来满足组织的数据分析需求。例如，如果 BI 报表应反映来自多个有界上下文的数据，它应该能够轻松获取其分析数据（如有需要），应用本地转换并生成报表。\n\
  \n最后，不同的消费者可能需要以不同形式获取分析数据。有些人可能更喜欢执行 SQL 查询，其他人则从对象存储服务获取分析数据，等等。因此，数据产品必须是多语言的，以适合不同消费者需求的格式提供数据。\n\
  \n为了实施数据即产品原则，产品团队需要增加数据导向的专家。这是在跨职能团队拼图中缺失的一块，传统上该团队仅包括与操作系统相关的专家。\n\n### 赋能自主\n\
  \n产品团队应该能够创建自己的数据产品并消费由其他有界上下文提供的数据产品。就像有界上下文一样，数据产品应该是可互操作的。\n\n如果每个团队都构建自己的分析数据服务解决方案，将会浪费、效率低下且难以集成。为了防止这种情况发生，需要一个平台来抽象构建、执行和维护可互操作数据产品的复杂性。设计和构建此类平台是一项相当大的工作，需要一个专门的数据基础设施平台团队。\n\
  \n数据基础设施平台团队应负责定义数据产品蓝图、统一访问模式、访问控制和产品团队可以利用的多语言存储，以及监控平台并确保 SLA 和目标得到满足。\n\n###\
  \ 构建生态系统\n\n创建数据网格系统的最后一步是任命一个联邦治理机构以实现互操作性和生态系统。\n- d. A 和 C 正确。\n\n\n\n\n\n2.\
  \ 哪种有界上下文集成模式对于实现数据网格架构至关重要？\n\n+   a. 共享内核\n+   b. 开放主机服务\n+   c. 反腐败层\n+   d.\
  \ 合作伙伴关系\n\n3. 哪种架构模式对于实现数据网格架构至关重要？\n\n+   a. 分层架构。\n+   b. 端口与适配器。\n+   c. CQRS。\n\
  +   d. 架构模式无法支持 OLAP 模型的实现。\n\n4. 数据网格架构的定义要求围绕“域”分解数据。DDD 中用来表示数据网格的域的术语是什么？\n\n\
  +   a. 有界上下文。\n+   b. 业务域。\n+   c. 子域。\n+   d. DDD 中没有数据网格域的同义词。\n\n### 结语\n\n为了完成我们对领域驱动设计的探索，我想回到我们一开始引用的那句话：\n\
  \n> *在我们就问题达成一致之前，谈论解决方案毫无意义；在我们就解决方案达成一致之前，谈论实施步骤也毫无意义。*\n\n—Efrat Goldratt-Ashlag\n\
  \n这句话简洁地概括了我们的 DDD 之旅。\n\n### 问题\n\n要提供软件解决方案，我们首先必须理解问题：我们工作的 *业务域* 是什么，业务目标是什么，以及实现这些目标的策略是什么。\n\
  \n我们使用 *通用语言* 来深入理解业务域及其逻辑，这些逻辑需要在软件中实现。\n\n你学会了通过将其拆分为 *有界上下文* 来管理业务问题的复杂性。每个有界上下文都实现业务域的单一模型，旨在解决特定问题。\n\
  \n我们讨论了如何识别和分类业务域的构建块：*核心*、*支持* 和 *通用子域*。表 E-1 对比了这三种子域类型。\n\n### 表 E-1. 三种子域类型\n\
  \n| 子域类型 | 竞争优势 | 复杂性 | 波动性 | 实现方式 |\n|---|---|---|---|---|\n| 核心 | 是 | 高 | 高 |\
  \ 内部开发 |\n| 通用 | 否 | 高 | 低 | 购买/采用 |\n| 支持 | 否 | 低 | 低 | 内部/外包 |\n\n### 解决方案\n\n\
  你学会了利用这些知识为每种子域类型设计优化的解决方案。我们讨论了四种业务逻辑实现模式——*事务脚本*、*活动记录*、*领域模型* 和 *事件溯源领域模型*——以及每种模式在何种场景下表现最佳。你还看到了三种为业务逻辑实现提供所需脚手架的架构模式：*分层架构*、*端口与适配器*\
  \ 和 *CQRS*。图 E-1 总结了使用这些模式进行战术决策的启发式方法。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_381_0.png)\n\
  \n图 E-1. 总结战术决策启发式的决策树\n\n### 实现\n\n在第三部分中，我们讨论了如何将理论转化为实践。你学会了如何通过促进 EventStorming\
  \ 会议来有效构建通用语言，如何在业务域演进时保持设计良好，以及如何在棕地项目中引入并开始使用领域驱动设计。\n\n在第四部分中，我们讨论了领域驱动设计与其他方法论和模式之间的相互作用：微服务、事件驱动架构和数据网格。我们看到\
  \ DDD 不仅可以与这些技术协同使用，而且它们实际上是相辅相成的。\n\n### 延伸阅读\n\n我希望这本书能让你对领域驱动设计产生兴趣。如果你想继续学习，这里有一些我衷心推荐的书籍。\n\
  \n### 高级领域驱动设计\n\n- Evans, E. (2003). *Domain-Driven Design: Tackling Complexity\
  \ in the Heart of Software*. Boston: Addison-Wesley.\n  Eric Evans 的原著，首次介绍了领域驱动设计方法论。虽然它没有反映\
  \ DDD 的更新方面，如领域事件和事件溯源，但它仍然是成为 DDD 黑带的必读之作。\n- Martraire, C. (2019). *Living Documentation:\
  \ Continuous Knowledge Sharing by Design*. Boston: Addison-Wesley.\n  在这本书中，Cyrille\
  \ Martraire 提出了一种基于领域驱动设计的知识共享、文档化和测试方法。\n- Vernon, V. (2013). *Implementing Domain-Driven\
  \ Design*. Boston: Addison-Wesley.\n  另一部永恒的 DDD 经典。Vaughn Vernon 提供了深入的讨论和详细的领域驱动设计思维及其战略和战术工具集的使用示例。作为学习基础，Vaughn\
  \ 使用了一个现实世界的例子，说明了 DDD 失败的举措以及团队通过应用必要的纠正措施而焕发的新旅程。\n- Young, G. (2017). *Versioning\
  \ in an Event Sourced System*. Leanpub.\n\n在第 7 章中，我们讨论了演进事件溯源系统可能具有挑战性。这本书专门讨论了这个主题。\n\
  \n### 架构和集成模式\n\n- Dehghani, Z. (预计 2022 年出版). *Data Mesh: Delivering Data-Driven\
  \ Value at Scale*. Boston: O'Reilly.\n\nZhamak Dehghani 是我们在第 16 章中讨论的数据网格模式的作者。在这本书中，Dehghani\
  \ 解释了数据管理架构背后的原则，以及如何在实践中实现数据网格架构。\n- Fowler, M. (2002). *Patterns of Enterprise\
  \ Application Architecture*. Boston: Addison-Wesley.\n\n我曾在第 5 章和第 6 章中多次引用的经典应用架构模式书籍。这本书首次定义了事务脚本、活动记录和领域模型模式。\n\
  - Hohpe, G., & Woolf, B. (2003). *Enterprise Integration Patterns: Designing, Building,\
  \ and Deploying Messaging Solutions*. Boston: Addison-Wesley.\n\n第 9 章中讨论的许多模式最初都是在这本书中引入的。阅读这本书以了解更多组件集成模式。\n\

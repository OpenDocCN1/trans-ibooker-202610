  \n#AdoptDontShop\n\n### 引言\n\n软件工程很难。要想在其中取得成功，我们必须不断学习，无论是尝试新语言、探索新技术，还是跟上新的流行框架。然而，每周学习一个新的\
  \ JavaScript 框架并不是我们工作的最困难方面。理解新的业务领域可能更具挑战性。\n\n在整个职业生涯中，我们经常需要为各种各样的业务领域开发软件：金融系统、医疗软件、在线零售商、营销等。从某种意义上说，这就是我们的工作与其他大多数职业不同的地方。其他领域工作的人在发现软件工程涉及如此多的学习时常常感到惊讶，尤其是在更换工作场所时。\n\
  \n未能把握业务领域会导致业务软件实现不佳。不幸的是，这很常见。据研究，大约 70% 的软件项目无法按时、按预算或按照客户要求交付。换句话说，绝大多数软件项目都失败了。这个问题如此根深蒂固和普遍，以至于我们甚至有一个专门的术语来称呼它：软件危机。\n\
  \n*软件危机* 一词早在 1968 年就被引入。¹ 人们会认为在过去的 50 年里情况会有所改善。在这些年里，引入了许多方法、方法论和学科来使软件工程更有效：敏捷宣言、极限编程、测试驱动开发、高级语言、DevOps\
  \ 等等。不幸的是，情况并没有改变太多。项目仍然经常失败，软件危机仍然存在。\n\n已经进行了许多研究来调查常见项目失败的原因。² 尽管研究人员无法 pinpoint\
  \ 唯一原因，但他们的大多数发现都有一个共同点\n\n\n\ntheme: communication. 沟通问题阻碍项目可以以不同的方式表现出来；例如，不明确的需求、不确定的项目目标，或团队之间工作协调无效。\
  \ 然而，多年来，我们又尝试通过引入新的沟通机会、流程和媒介来改善团队内部和团队之间的沟通。\n不幸的是，我们项目的成功率仍然没有太大变化。\n\n领域驱动设计（DDD）提出从不同角度攻击失败软件项目的根本原因。\
  \ 有效的沟通是领域驱动设计工具和实践的核心主题，你将在本书中学习这些工具和实践。 DDD 可以分为两个部分：战略和战术。\n\nDDD 的战略工具用于分析业务领域和战略，并促进不同利益相关者之间对业务的共同理解。\
  \ 我们还将利用对业务领域的这一认知来驱动高层设计决策：将系统分解为组件并定义它们的集成模式。\n\n领域驱动设计的战术工具解决沟通问题的不同方面。 DDD 的战术模式允许我们以反映业务领域、解决其目标并使用业务语言的方式编写代码。\n\
  \nDDD 的战略和战术模式与实践都使软件设计与业务领域保持一致。 这就是名称的由来：（业务）领域驱动（软件）设计。\n\n领域驱动设计并不会像《黑客帝国》中那样直接将新\
  \ JavaScript 库的知识安装到你的大脑中。 然而，它会通过缓解理解业务领域的过程并根据业务战略指导设计决策，使你成为更有效的软件工程师。 正如你将在本书后面的章节中了解到的，软件设计与其业务战略之间的联系越紧密，维护和演进系统以满足业务未来需求就越容易，最终导致更成功的软件项目。\n\
  \n让我们从探索战略模式和实践开始我们的 DDD 之旅。\n\n+   1 “Software Engineering.” Report on a conference\
  \ sponsored by the NATO Science Committee, Garmisch, Germany, October 7–11, 1968.\n\
  +   2 See, for example, Kaur, Rupinder, and Dr. Jyotsna Sengupta (2013), “Software\
  \ Process Models and Analysis on Failure of Software Development Projects,” https://arxiv.org/ftp/arxiv/papers/1306/1306.1068.pdf.\
  \ See also Sudhakar, Goparaju Purna (2012), “A Model of Critical Success Factors\
  \ for Software Projects.” *Journal of Enterprise Information Management* 25(6),\
  \ 537–558.\n"
- "# Part I. Strategic Design\n\n> *There is no sense in talking about the solution\
  \ before we agree on the problem, and no sense talking about the implementation\
  \ steps before we agree on the solution.*\n> \n> —Efrat Goldratt-Ashlag¹\n\n领域驱动设计（DDD）方法论可以分为两个主要部分：战略设计和战术设计。\
  \ DDD 的战略方面涉及回答“是什么？”和“为什么？”的问题——我们构建什么软件以及为什么构建它。 战术部分则完全关于“如何”——每个组件如何实现。\n\n\
  我们将从探索领域驱动设计战略设计模式和原则开始我们的旅程：\n\n- 在第 1 章中，你将学习分析公司的业务战略：它为消费者提供什么价值以及它如何在行业中与其他公司竞争。\
  \ 我们将识别更细粒度的业务构建块，评估其战略价值，并分析它们如何影响不同的软件设计决策。\n- 第 2 章介绍了领域驱动设计获取对业务领域理解的基本实践：*通用语言*。\
  \ 你将学习如何培养通用语言并利用它在所有项目相关利益相关者之间促进共同理解。\n- 第 3 章讨论了另一个领域驱动设计核心工具：*有界上下文*模式。 你将学习为什么该工具对于培养通用语言至关重要，以及如何使用它将发现的知识转化为业务领域的模型。\
  \ 最终，我们将利用有界上下文来设计软件系统的粗粒度组件。\n- 在第 4 章中，你将学习影响系统组件如何集成的技术和社会约束，以及解决不同情况和限制的集成模式。\
  \ 我们将讨论每种模式如何影响软件开发团队之间的协作以及组件 API 的设计。\n\n本章结尾将介绍*上下文映射*：一种图形表示法，绘制系统有界上下文之间的通信，并提供项目集成和协作环境的鸟瞰图。\n"
- "## Chapter 1. Analyzing Business Domains\n\n如果你和我一样，你喜欢编写代码：解决复杂问题、提出优雅的解决方案，并通过精心设计规则、结构和行为来构建全新的世界。\
  \ 我相信这就是你对领域驱动设计感兴趣的原因：你希望在自己的技艺上做得更好。 然而，本章与编写代码无关。 在本章中，你将学习公司如何运作：它们为什么存在、追求什么目标，以及实现目标的战略。\n\
  \n当我在领域驱动设计课程中教授这些材料时，许多学生实际上会问：“我们需要知道这些材料吗？ 我们在编写软件，而不是经营企业。” 对他们问题的回答是响亮的“是”。\
  \ 要设计和构建有效的解决方案，你必须理解问题。 在我们的上下文中，问题是我们必须构建的软件系统。 要理解问题，你必须理解其存在的上下文——组织的业务战略，以及它通过构建软件寻求获得什么价值。\n\
  \n在本章中，你将学习领域驱动设计用于分析公司业务领域及其结构的工具：其核心、支持和通用子领域。 这些材料是设计软件的基础。 在剩余的章节中，你将学习这些概念如何影响软件设计。\n\
  \n#### What Is a Business Domain?\n\n业务领域定义了公司的主要活动领域。 一般来说，它是公司为客户提供的服务。 例如：\n\n\
  - FedEx 提供快递递送服务。\n- Starbucks 最为人所知的是其咖啡。\n- Walmart 是最广为人知的零售机构之一。\n\n一家公司可以在多个业务领域运营。\
  \ 例如，Amazon 提供零售和云计算服务。 Uber 是一家拼车公司，同时还提供食品配送和自行车共享服务。\n\n需要注意的是，公司可能会经常改变其业务领域。\
  \ 一个典型的例子是诺基亚，多年来它曾在木材加工、橡胶制造、电信和移动通信等多种不同的领域运营。\n\n#### What Is a Subdomain?\n\n\
  为了实现其业务领域的目标和指标，公司必须在多个*子领域*中运营。 子领域是业务活动的细粒度领域。 公司的所有子领域构成了其业务领域：它为客户提供的服务。\n\n\
  仅实现单个子领域不足以使公司成功；它只是整体系统中的一个构建块。 子领域必须相互交互才能实现公司在其业务领域中的目标。 例如，Starbucks 可能因其咖啡而最受认可，但要建立成功的咖啡连锁店，仅仅知道如何制作优质咖啡是不够的。\
  \ 你还必须在有效的位置购买或租赁房地产、招聘人员并管理财务，等等。 这些子领域中的任何一个单独都不会使公司盈利。 只有它们全部结合起来，公司才能在其业务领域中竞争。\n\
  \n\n\n\n\n### 子域的类型\n\n正如软件系统包含各种架构组件——数据库、前端应用、后端服务等——子域也具有不同的战略/业务价值。领域驱动设计将子域区分为三种类型：核心、通用和支持。让我们从公司战略的角度看看它们有何不同。\n\
  \n##### 核心子域\n\n核心子域是公司与竞争对手不同的地方。这可能涉及发明新产品或服务，或通过优化现有流程来降低成本。\n\n以 Uber 为例。最初，公司提供了一种新型交通方式：拼车。随着竞争对手的追赶，Uber\
  \ 找到了优化和演进其核心业务的方法：例如，通过匹配同向乘客来降低成本。\n\nUber 的核心子域影响其底线。这是公司区别于竞争对手的方式。这是公司为客户提供更好服务和/或最大化盈利能力的战略。为了保持竞争优势，核心子域涉及发明、智能优化、商业诀窍或其他知识产权。\n\
  \n再考虑另一个例子：Google Search 的排名算法。在撰写本文时，Google 的广告平台占其利润的大部分。也就是说，Google Ads 不是一个子域，而是一个独立的业务域，其下包含子域，其中包括其云计算服务（Google\
  \ Cloud Platform）、生产力和协作工具（Google Workspaces），以及 Alphabet，即 Google 的母公司运营的其他领域。但\
  \ Google Search 及其排名算法呢？尽管搜索引擎不是付费服务，但它作为 Google Ads 的最大展示平台。其提供出色搜索结果的能力推动了流量，随后成为广告平台的重要组成部分。由于算法中的错误导致搜索结果不佳，或竞争对手推出更好的搜索服务，都将损害广告业务的收入。因此，对于\
  \ Google 来说，排名算法是一个核心子域。\n\n### 复杂性\n\n一个易于实现的简单核心子域只能提供短暂的竞争优势。因此，核心子域自然是复杂的。继续以\
  \ Uber 为例，公司不仅通过拼车创造了一个新的市场空间，还通过有针对性的技术使用，打破了数十年历史的单体架构——出租车行业。通过理解其业务域，Uber 能够设计出更可靠、更透明的交通方式。公司的核心业务应具有较高的进入壁垒；竞争对手很难复制或模仿公司的解决方案。\n\
  \n### 竞争优势来源\n\n需要注意的是，核心子域不一定是技术性的。并非所有商业问题都可以通过算法或其他技术解决方案解决。公司的竞争优势可以来自各种来源。\n\
  \n例如，考虑一家在线销售产品的珠宝商。在线商店很重要，但它不是核心子域。珠宝设计才是。公司可以使用现成的在线商店引擎，但不能外包珠宝的设计。设计是客户购买该珠宝商产品并记住该品牌的原因。\n\
  \n作为一个更复杂的例子，想象一家专门从事人工欺诈检测的公司。该公司培训分析师审查可疑文件并标记潜在的欺诈案件。你正在构建分析师使用的软件系统。这是一个核心子域吗？不是。核心子域是分析师所做的工作。你正在构建的系统与欺诈分析无关，它只是显示文件并跟踪分析师的评论。\n\
  \n### 核心子域与核心域\n\n核心子域也称为核心域。例如，在最初的领域驱动设计书籍中，Eric Evans 交替使用“核心子域”和“核心域”。尽管“核心域”一词经常被使用，但我更喜欢使用“核心子域”，原因有几点。首先，它是一个*子域*，我更喜欢避免与*业务域*混淆。其次，正如你在第\
  \ 11 章中将学到的那样，子域随着时间的推移而演变并改变其类型并不少见。例如，核心子域可以转变为通用子域。因此，说“一个*通用*子域演变为*核心*子域”比说“一个通用*子域*演变为核心*域*”更直接。\n\
  \n#### 通用子域\n\n*通用子域*是所有公司以相同方式执行的业务活动。与核心子域一样，通用子域通常复杂且难以实现。然而，通用子域不会为公司提供任何竞争优势。这里不需要创新或优化：经过实战检验的实现方案广泛可用，所有公司都使用它们。\n\
  \n例如，大多数系统都需要对其用户进行身份验证和授权。与其发明专有的身份验证机制，使用现有解决方案更有意义。这样的解决方案更有可能可靠和安全，因为它已经由许多其他具有相同需求的公司进行了测试。\n\
  \n回到在线销售产品的珠宝商的例子，珠宝设计是核心子域，但在线商店是通用子域。使用与竞争对手相同的在线零售平台——相同的通用解决方案——不会影响珠宝商的竞争优势。\n\
  \n### 支持子域\n\n顾名思义，*支持子域*支持公司的业务。然而，与核心子域相反，支持子域不会提供任何竞争优势。\n\n例如，考虑一家在线广告公司，其核心子域包括将广告匹配到访客、优化广告效果以及最小化广告空间成本。然而，为了在这些领域取得成功，公司需要对其创意素材进行编目。公司存储和索引其物理创意素材（如横幅和着陆页）的方式不会影响其利润。在该领域没有需要发明或优化的东西。另一方面，创意目录对于实施公司的广告管理和投放系统至关重要。这使得内容编目解决方案成为公司支持子域之一。\n\
  \n支持子域的显著特征是解决方案业务逻辑的复杂性。支持子域是简单的。它们的业务逻辑大多类似于数据录入屏幕和 ETL（提取、转换、加载）操作；即所谓的 CRUD（创建、读取、更新和删除）接口。这些活动领域不会为公司提供任何竞争优势，因此不需要较高的进入壁垒。\n\
  \n### 比较子域\n\n现在我们对三种类型的业务子域有了更深入的了解，让我们从其他角度探索它们的区别，并看看它们如何影响战略软件设计决策。\n\n### 竞争优势\n\
  \n只有核心子域能为公司提供竞争优势。核心子域是公司区别于竞争对手的战略。\n\n通用子域按定义不能成为任何竞争优势的来源。这些是通用解决方案——公司及其竞争对手使用的相同解决方案。\n\
  \n支持子域具有较低的进入壁垒，也无法提供竞争优势。通常，公司不会介意竞争对手复制其支持子域——这不会影响其在行业中的竞争力。相反，从战略上讲，公司更希望其支持子域是通用、现成的解决方案，从而消除设计和构建其实现的需求。你将在第\
  \ 11 章中详细了解支持子域转变为通用子域的情况，以及其他可能的排列组合。这样的真实案例研究将在附录 A 中概述。\n\n公司能够解决的问题越复杂，就能提供越大的业务价值。复杂问题不仅限于向消费者提供服务。复杂问题可以是，例如，使业务更优化和高效。例如，以与竞争对手相同的服务水平，但以更低的运营成本提供，也是竞争优势。\n\
  \n### 复杂性\n\n从更技术的角度来看，识别组织的子域很重要，因为不同类型的子域具有不同的复杂性水平。在设计软件时，我们必须选择\n\n\n\n适应业务需求的复杂性。\n\
  因此，识别子域对于设计合理的软件解决方案至关重要。\n\n支持子域的业务逻辑很简单。这些是基本的 ETL 操作和 CRUD 接口，业务逻辑显而易见。通常，它不会超出验证输入或将数据从一种结构转换为另一种结构。\n\
  \n通用子域要复杂得多。别人已经投入时间和精力解决这些问题，应该有一个很好的理由。这些解决方案既不简单也不平凡。例如，考虑加密算法或身份验证机制。\n\n从知识可用性的角度来看，通用子域是“已知未知”。这些是你知道自己不知道的东西。此外，这些知识很容易获得。你可以使用业界认可的最佳实践，或者如果需要，可以聘请该领域的顾问来帮助设计定制解决方案。\n\
  \n核心子域很复杂。它们应该尽可能难以被竞争对手复制——公司的盈利能力取决于此。因此，从战略上讲，公司希望将复杂问题作为其核心子域来解决。\n\n有时区分核心子域和支持子域可能具有挑战性。复杂性是一个有用的指导原则。问一下相关子域是否可以变成一项副业。有人会单独为它付费吗？如果是，这就是核心子域。区分支持子域和通用子域也适用类似的推理：与集成外部解决方案相比，自己编写实现是否会更简单、更便宜？如果是，这就是支持子域。\n\
  \n从更技术的角度来看，识别会影响软件设计的复杂核心子域很重要。如前所述，核心子域不一定与软件相关。识别与软件相关的核心子域的另一个有用指导原则是评估你必须在代码中建模和实现的业务逻辑的复杂性。业务逻辑是否类似于用于数据输入的\
  \ CRUD 接口，还是你必须实现由复杂业务规则和不变量编排的复杂算法或业务流程？在前一种情况下，这是支持子域的迹象，而后者是典型的核心子域。\n\n图 1-1\
  \ 中的图表表示了三种子域类型在业务差异化和业务逻辑复杂性方面的相互作用。支持子域和通用子域之间的交集是一个灰色地带：可能两种情况都有。如果支持子域的功能存在通用解决方案，则由此产生的子域类型取决于集成通用解决方案是否比从头实现该功能更简单和/或更便宜。\n\
  \n![](img/b742a71dea5d5dd509847f82600a6ad1_32_0.png)\n\n图 1-1. 三种子域类型的业务差异化和业务逻辑复杂性\n\
  \n### Volatility\n\n如前所述，核心子域可能会经常发生变化。如果一个问题能在第一次尝试就得到解决，它可能不是一个好的竞争优势——竞争对手会迅速赶上。\n\
  \n因此，核心子域的解决方案是涌现式的。必须尝试不同的实现，进行改进和优化。\n\n此外，核心子域的工作永远不会结束。公司会不断创新和发展核心子域。变化以添加新功能或优化现有功能的形式出现。无论哪种方式，其核心子域的不断演进对于公司保持领先于竞争对手至关重要。\n\
  \n与核心子域相反，支持子域很少发生变化。它们不会为公司提供任何竞争优势，因此，与将同样的精力投入到核心子域相比，支持子域的演进提供的业务价值微乎其微。\n\n\
  尽管已有现有解决方案，但通用子域仍可能随时间变化。变化可能以安全补丁、错误修复或针对通用问题的全新解决方案的形式出现。\n\n### Solution strategy\n\
  \n核心子域为公司提供了与行业其他参与者竞争的能力。这是一项业务关键责任，但这是否意味着支持子域和通用子域不重要？当然不是。所有子域对于公司在其业务领域运作都是必需的。子域就像基础构建块：拿走其中一个，整个结构可能会倒塌。话虽如此，我们可以利用不同类型子域的固有属性来选择实现策略，以最有效的方式实现每种类型的子域。\n\
  \n核心子域必须在内部实现。它们不能被购买或采用；这会削弱竞争优势的概念，因为公司的竞争对手也能做到同样的事情。\n\n将核心子域的实现外包也是不明智的。这是一项战略投资。在核心子域上偷工减料不仅在短期内有风险，而且从长远来看可能产生致命后果：例如，无法支持公司目标和目的的难以维护的代码库。组织中最熟练的人才应分配到其核心子域的工作上。此外，在内部实现核心子域可以让公司更快地进行更改和演进解决方案，从而在更短的时间内建立竞争优势。\n\
  \n由于核心子域的需求预计会经常且持续地变化，解决方案必须可维护且易于演进。因此，核心子域需要实施最先进的工程技术。\n\n由于通用子域是困难但已解决的问题，因此购买现成产品或采用开源解决方案比在内部实现通用子域更具成本效益。\n\
  \n缺乏竞争优势使得避免在内部实现支持子域是合理的。然而，与通用子域不同，没有现成的解决方案。因此，公司别无选择，只能自行实现支持子域。话虽如此，业务逻辑的简单性和变化的低频率使其很容易偷工减料。\n\
  \n支持子域不需要复杂的设计模式或其他高级工程技术。快速应用开发框架足以在不引入偶然复杂性的情况下实现业务逻辑。\n\n从人员配置角度来看，支持子域不需要高度熟练的技术能力，并为培养后起之秀提供了绝佳机会。把团队中擅长应对复杂挑战的工程师留给核心子域。最后，业务逻辑的简单性使得支持子域成为外包的良好候选对象。\n\
  \n表 1-1 总结了三种子域类型在不同方面的差异。\n\n### Table 1-1. The differences between the three types\
  \ of subdomains\n\n| 子域类型 | 竞争优势 | 复杂性 | 波动性 | 实现方式 |\n| Core | Yes | High | High\
  \ | In-house |\n| Generic | No | High | Low | Buy/adopt |\n| Supporting | No | Low\
  \ | Low | In-house/outsource |\n\n### Identifying Subdomain Boundaries\n\n正如你已经看到的，识别子域及其类型可以在构建软件解决方案时帮助做出不同的设计决策。在后面的章节中，你将学习更多利用子域来简化软件设计过程的方法。但我们如何实际识别子域及其边界呢？\n\
  \n子域及其类型由公司的业务战略定义：其业务领域以及它如何与同一领域的其他公司区分开来竞争。在绝大多数软件项目中，以一种或另一种方式，子域是“已经存在”的。这并不意味着，然而，识别它们的边界总是容易和直接的。如果你向\
  \ CEO 询问他们公司的子域列表，你可能会得到一个茫然的眼神。他们不了解这个概念。因此，你必须自己进行领域分析以识别和分类所涉及的子域。\n\n一个良好的起点是公司的部门和其他组织单位。例如，在线零售商店可能包括仓库、客户服务、拣货、发货、质量控制和渠道管理等部门。然而，这些是相对粗粒度的活动领域。例如，客户服务部门。合理地假设它将\n\
  \n\n\n可能是支持性的，甚至是通用的子域，因为该功能通常外包给第三方供应商。但这些信息足以让我们做出合理的软件设计决策吗？\n\n### 提炼子域\n\n\
  粗粒度的子域是一个良好的起点，但魔鬼在细节中。我们必须确保没有遗漏隐藏在业务功能复杂性中的重要信息。\n\n让我们回到客户服务部门的例子。如果我们探究其内部运作，就会发现典型的客户服务部门由更细粒度的组件组成，例如帮助台系统、班次管理和排班、电话系统等等。当被视为独立的子域时，这些活动可能属于不同类型：虽然帮助台和电话系统是通用子域，班次管理是支持性的，而一家公司可能会开发其巧妙的算法，用于将事件路由到过去处理类似案例成功的代理。路由算法需要分析传入案例并识别过往经验中的相似性——这两项都不是简单的任务。由于路由算法使公司能够提供比竞争对手更好的客户体验，因此路由算法是核心子域。图\
  \ 1-2 展示了此示例。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_37_0.png)\n\n图 1-2. 分析看似通用的子域的内部运作，以找到更细粒度的核心子域、支持子域和两个通用子域\n\
  \n另一方面，我们不能无限地向下钻取，在越来越细的粒度层级寻找洞察。什么时候应该停止？\n\n### 子域作为连贯用例\n\n从技术角度看，子域类似于一组相互关联、连贯的用例。这类用例集通常涉及相同的参与者、业务实体，并且都操作一组密切相关的数据。\n\
  \n考虑图 1-3 中所示的信用卡支付网关用例图。用例因其所操作的数据和所涉及的参与者而紧密绑定。因此，所有用例都构成信用卡支付子域。\n\n我们可以将“子域作为一组连贯用例”的定义作为何时停止寻找更细粒度子域的指导原则。这些是最精确的子域边界。\n\
  \n![](img/b742a71dea5d5dd509847f82600a6ad1_38_0.png)\n\n图 1-3. 信用卡支付子域的用例图\n\n你是否应该始终努力识别这种激光聚焦的子域边界？对于核心子域来说，这绝对是必要的。核心子域是最重要、最不稳定、最复杂的。必须尽可能提炼它们，因为这将使我们能够提取所有通用和支持功能，并将精力投入到更聚焦的功能上。\n\
  \n对于支持性和通用子域，提炼可以适当放宽。如果进一步钻取不能揭示任何有助于你做出软件设计决策的新洞察，就可以停止了。例如，当所有更细粒度的子域与原始子域类型相同时，就会发生这种情况。\n\
  \n考虑图 1-4 中的示例。进一步提炼帮助台系统子域的用处不大，因为它没有揭示任何战略信息，并且将使用粗粒度的现成工具作为解决方案。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_39_0.png)\n\
  \n图 1-4. 提炼帮助台系统子域，揭示通用的内部组件\n\n在识别子域时需要考虑的另一个重要问题是，我们是否需要全部子域。\n\n### 专注于本质\n\n\
  子域是减轻软件设计决策过程的工具。所有组织可能都有相当多的业务功能推动其竞争优势，但与软件无关。我们在本章前面讨论的珠宝制造商就是一个例子。\n\n在寻找子域时，重要的是识别与软件无关的业务功能，将其视为此类，并专注于与你正在处理的软件系统相关的业务方面。\n\
  \n### 领域分析示例\n\n让我们看看如何在实践中应用子域的概念，并将其用于做出一系列战略设计决策。我将描述两家虚构公司：Gigmaster 和 BusVNext。作为练习，在阅读时分析这些公司的业务域。尝试为每家公司识别三种类型的子域。记住，正如现实生活一样，部分业务需求是隐含的。\n\
  \n免责声明：当然，通过阅读如此简短的描述，我们无法识别每个业务域涉及的所有子域。尽管如此，这足以训练你识别和分类可用子域。\n\n#### Gigmaster\n\
  \nGigmaster 是一家票务销售和分销公司。其移动应用分析用户的音乐库、流媒体服务账户和社交媒体资料，以识别附近用户可能感兴趣的演出。\n\nGigmaster\
  \ 的用户非常注重隐私。因此，所有用户的个人信息都已加密。此外，为确保用户的小秘密在任何情况下都不会泄露，公司推荐算法完全在匿名数据上运行。\n\n为了改进应用的推荐，实施了一个新模块。它允许用户记录过去参加过的演出，即使票不是通过\
  \ Gigmaster 购买的。\n\n##### 业务域和子域\n\nGigmaster 的业务域是票务销售。这就是它为客户提供的服务。\n\n*核心子域*\n\
  \nGigmaster 的主要竞争优势是其推荐引擎。该公司也非常重视用户隐私，仅在匿名数据上工作。最后，虽然没有明确提及，但我们可以推断移动应用的用户体验也至关重要。因此，Gigmaster\
  \ 的核心子域是：\n\n- 推荐引擎\n- 数据匿名化\n- 移动应用\n\n#### 通用子域\n\n我们可以识别并推断出以下通用子域：\n\n- 加密，用于加密所有数据\n\
  - 会计，因为公司从事销售业务\n- 清算，用于向客户收费\n- 身份验证和授权，用于识别其用户\n\n### 支持子域\n\n最后，以下是支持子域。这里的业务逻辑简单，类似于\
  \ ETL 流程或 CRUD 接口：\n\n- 与音乐流媒体服务的集成\n- 与社交网络的集成\n- 已参加演出模块\n\n### 设计决策\n\n了解正在发挥作用的子域及其类型之间的差异后，我们已经可以做出几个战略设计决策：\n\
  \n- 推荐引擎、数据匿名化和移动应用必须使用最先进的工程工具和技术在内部实现。这些模块将最频繁地发生变化。\n- 应为数据加密、会计、清算和身份验证使用现成或开源解决方案。\n\
  - 与流媒体服务和社交网络的集成，以及已参加演出模块，可以外包。\n\n#### BusVNext\n\nBusVNext 是一家公共交通公司。它的目标是为客户提供舒适的公交车乘坐体验，类似于打车。该公司在主要城市管理公交车队。\n\
  \nBusVNext 客户可以通过移动应用订购乘车。在计划出发时间，附近公交车的路线将即时调整，以便在指定的出发时间接上客户。\n\n公司的主要挑战是实现路由算法。其需求是“旅行商问题”的一种变体。路由逻辑会持续调整和优化。例如，统计数据显示取消乘车的主要原因是等待公交车到达的时间过长。因此，公司调整了路由算法以优先快速接客，即使这意味着延误下车时间。为了进一步优化路由，BusVNext\
  \ 与第三方提供商集成以获取交通状况和实时警报。\n\n不时地，BusVNext 会发放特别折扣，既吸引新客户，又在高峰和非高峰时段平衡乘车需求。\n\n#####\
  \ 业务域和子域\n\nBusVNext 为客户提供优化的公交车乘坐服务。业务域是公共交通。\n\n##### 核心子域\n\nBusVNext 的主要竞争优势是其路由算法，它试图解决一个复杂问题（“旅行商”），同时优先考虑不同的业务目标：例如减少接客时间，即使这会增加整体行程长度。\n\
  \n我们还看到乘车数据会持续分析以获得对客户行为的新见解。这些见解使公司能够通过优化路由算法来增加利润。\n\n\n\n\n\n最后，BusVNext 为其客户和司机提供的应用程序必须易于使用并提供便捷的用户界面。\n\
  \n管理车队并非易事。公交车可能会出现技术问题或需要维护。忽视这些问题可能会导致财务损失和服务水平下降。\n\n因此，BusVNext 的核心子域是：\n- 路线规划\n\
  - 分析\n- 移动应用用户体验\n- 车队管理\n\n#### 通用子域\n\n路由算法还使用第三方公司提供的交通数据和警报——这是一个通用子域。此外，BusVNext\
  \ 接受客户付款，因此必须实现会计和清算功能。BusVNext 的通用子域是：\n- 交通状况\n- 会计\n- 计费\n- 授权\n\n### 支持子域\n\n\
  管理促销和折扣的模块支持公司的核心业务。也就是说，它本身并不是核心子域。其管理界面类似于用于管理活动优惠券代码的简单 CRUD 界面。因此，这是一个典型的支持子域。\n\
  \n### 设计决策\n\n了解所涉及的子域及其类型之间的差异后，我们已经可以做出一些战略设计决策：\n- 路由算法、数据分析、车队管理和应用可用性必须使用最精细的技术工具和模式在内部实现。\n\
  - 促销管理模块的实现可以外包。\n- 识别交通状况、授权用户以及管理财务记录和交易可以委托给外部服务提供商。\n\n### 谁是领域专家？\n\n现在我们对业务域和子域有了清晰的理解，让我们来看一下在接下来的章节中我们将经常使用的另一个\
  \ DDD 术语：*领域专家*。领域专家是了解我们将建模并在代码中实现的所有业务复杂性的主题专家。换句话说，领域专家是软件业务域的知识权威。\n\n领域专家既不是收集需求的分析师，也不是设计系统的工程师。领域专家代表业务。他们是首先识别业务问题的人，所有业务知识都源于他们。系统分析师和工程师将他们对业务域的心理模型转化为软件需求和源代码。\n\
  \n作为经验法则，领域专家要么是提出需求的人，要么是软件的最终用户。软件旨在解决他们的问题。\n\n领域专家的专业知识范围可能不同。一些主题专家将对整个业务域的运作方式有详细的了解，而另一些则专门研究特定的子域。例如，在一家在线广告代理公司中，领域专家将是活动经理、媒体采购员、分析师和其他业务利益相关者。\n\
  \n### 结论\n\n在本章中，我们介绍了用于理解公司业务活动的领域驱动设计工具。正如你所见，一切都始于业务域：企业运营所在的领域以及为客户提供的服务。\n\n\
  你还了解了实现业务域成功并使公司区别于竞争对手所需的各种构建块：\n\n*核心子域*\n\n有趣的问题。这些是公司与竞争对手不同执行的活动，也是其获得竞争优势的来源。\n\
  \n*通用子域*\n\n已解决的问题。这些是所有公司以相同方式执行的事情。这里没有创新空间或需求；与其创建内部实现，使用现有解决方案更具成本效益。\n\n*支持子域*\n\
  \n有明显解决方案的问题。这些是公司可能需要在内部实现但不提供任何竞争优势的活动。\n\n最后，你了解到领域专家是业务的主题专家。他们对公司的业务域或一个或多个子域有深入的了解，对项目的成功至关重要。\n\
  \n## 练习\n\n1. 哪些子域不提供竞争优势？\n   a. 核心\n   b. 通用\n   c. 支持\n   d. B 和 C\n2. 竞争对手可能使用相同解决方案的子域是哪个？\n\
  \   a. 核心。\n   b. 通用。\n   c. 支持。\n   d. 以上都不是。公司应始终使其与竞争对手区别开来。\n3. 哪个子域预计变化最频繁？\n\
  \   a. 核心。\n   b. 通用。\n   c. 支持。\nd. 不同子域类型的波动性没有差异。\n\n考虑 WolfDesk 的描述（参见前言），该公司提供帮助台票务管理系统：\n\
  4. WolfDesk 的业务域是什么？\n5. WolfDesk 的核心子域是什么？\n6. WolfDesk 的支持子域是什么？\n7. WolfDesk\
  \ 的通用子域是什么？\n"
- "## 第 2 章. 发现领域知识\n\n> 并非领域专家的知识，而是开发人员（的误）理解被发布到生产环境中。\n> —Alberto Brandolini\n\
  \n在上一章中，我们开始探索业务域。你学习了如何识别公司的业务域或活动领域，并分析其在其中竞争的策略；即其业务子域的边界和类型。\n\n本章继续业务域分析的主题，但从另一个维度：深度。它关注子域内部发生的事情：其业务功能和逻辑。你将学习用于有效沟通和知识共享的领域驱动设计工具：通用语言。在这里我们将使用它来学习业务域的复杂性。之后在本书中我们将使用它来建模并在软件中实现其业务逻辑。\n\
  \n### 业务问题\n\n我们构建的软件系统是业务问题的解决方案。在这种情况下，单词 problem 并不是指数学问题或你能解决后就完事的谜题。在业务域的上下文中，“问题”有更广泛的含义。业务问题可以与优化工作流程和流程、最小化人工劳动、管理资源、支持决策、管理数据等相关的问题。\n\
  \n业务问题同时出现在业务域和子域层面。公司的目标是为客户的问题提供解决方案。回到第 1 章中的 FedEx 示例，该公司的客户需要在有限的时间范围内运输包裹，因此它优化了运输流程。\n\
  \n子域是更细粒度的难题域，其目标是为特定的业务能力提供解决方案。知识管理子域优化存储和检索信息的过程。清算子域优化执行金融交易的过程。会计子域跟踪公司的资金。\n\
  \n### 知识发现\n\n为了设计有效的软件解决方案，我们必须掌握业务域的至少基本知识。正如我们在第 1 章中所讨论的，这些知识属于领域专家：他们的工作是专门研究并理解业务域的所有复杂性。我们绝不应该，也不能成为领域专家。也就是说，对我们来说，了解领域专家并使用他们使用的相同业务术语至关重要。\n\
  \n为了有效，软件必须模仿领域专家思考问题的方式——他们的心理模型。如果没有对业务问题及其需求背后的推理的理解，我们的解决方案将仅限于“将”业务需求“翻译”为源代码。如果需求遗漏了关键的边界情况呢？或者未能描述一个业务概念，从而限制了我们实现能够支持未来需求的模型的能力？\n\
  \n正如 Alberto Brandolini¹ 所说，软件开发是一个学习过程；可工作的代码是副产品。软件项目的成功取决于领域\n\n\n\n专家和软件工程师。我们必须理解问题才能解决它。\n\
  \n领域专家与软件工程师之间有效的知识共享需要有效的沟通。让我们来看看软件项目中有效沟通的常见障碍。\n\n### 沟通\n\n可以肯定地说，几乎所有软件项目都需要不同角色的利益相关者的协作：领域专家、产品负责人、工程师、UI\
  \ 和 UX 设计师、项目经理、测试人员、分析师等。如同任何协作工作一样，结果取决于各方合作得有多好。例如，所有利益相关者是否同意正在解决什么问题？关于他们正在构建的解决方案——他们对其实用性和非功能性需求是否持有任何冲突的假设？对所有项目相关事宜达成一致和对齐对于项目的成功至关重要。\n\
  \n关于软件项目失败原因的研究表明，有效的沟通对于知识共享和项目成功至关重要。² 然而，尽管其重要性，有效的沟通在软件项目中很少见。经常，业务人员和工程师之间没有直接互动。相反，领域知识是从领域专家向下推送给工程师的。它是通过扮演调解人或“翻译”角色的人传递的，例如系统/业务分析师、产品负责人和项目经理。这种常见的知识共享流程如图\
  \ 2-1 所示。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_51_0.png)\n\n图 2-1. 软件项目中的知识共享流程\n\
  \n在传统的软件开发生命周期中，领域知识被“翻译”成一种对工程师友好的形式，即分析模型，它是对系统需求的描述，而不是对其背后业务领域的理解。虽然意图可能良好，但这种调解对知识共享是有害的。在任何翻译中，信息都会丢失；在这种情况下，对于解决业务问题至关重要的领域知识在传到软件工程师的途中就丢失了。这并不是典型软件项目中唯一的此类翻译。分析模型被翻译成软件设计模型（软件设计文档，该文档被翻译成实现模型或源代码本身）。正如经常发生的那样，文档很快就会过时。源代码被用来向日后维护项目的软件工程师传达业务领域知识。图\
  \ 2-2 说明了将领域知识实现为代码所需的各种转换。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_52_0.png)\n\
  \n图 2-2. 模型转换\n\n这种软件开发过程类似于儿童游戏“传话”：³ 消息或领域知识往往会失真。信息导致软件工程师实现错误的解决方案，或正确的解决方案但针对错误的问题。在任何一种情况下，结果都一样：软件项目失败。\n\
  \n领域驱动设计提出了一种更好的方法来将知识从领域专家传递给软件工程师：使用通用语言。\n\n### 什么是通用语言？\n\n使用通用语言是领域驱动设计的基石实践。想法很简单直接：如果各方需要高效沟通，而不是依赖翻译，他们必须使用相同的语言。\n\
  \n尽管这一概念近乎常识，但正如伏尔泰所说，“常识并不常见”。传统的软件开发生命周期意味着以下转换：\n- 领域知识到分析模型\n- 分析模型到需求\n- 需求到系统设计\n\
  - 系统设计到源代码\n\n领域驱动设计不是持续翻译领域知识，而是要求培养一种描述业务领域的单一语言：通用语言。\n\n所有项目相关利益相关者——软件工程师、产品负责人、领域专家、UI/UX\
  \ 设计师——在描述业务领域时都应使用通用语言。最重要的是，领域专家必须在推理业务领域时感到舒适地使用通用语言；这种语言将代表业务领域和领域专家的心理模型。\n\
  \n只有通过持续使用通用语言及其术语，才能在项目的所有利益相关者之间培养共同的理解。\n\n### 业务的语言\n\n必须强调，通用语言是业务的语言。因此，它应仅由业务领域相关的术语组成。不要使用技术术语！向业务领域专家教授单例和抽象工厂不是你的目标。通用语言旨在以易于理解的术语来框定领域专家对业务领域的理解和心理模型。\n\
  \n### 场景\n\n假设我们正在开发一个广告活动管理系统。考虑以下陈述：\n- 广告活动可以展示不同的创意素材。\n- 只有当其至少有一个投放位置处于活动状态时，活动才可以发布。\n\
  - 销售佣金在交易获批后计入。\n\n所有这些陈述都是用业务的语言表述的。也就是说，它们反映了领域专家对业务领域的看法。\n\n另一方面，以下陈述纯粹是技术性的，因此不符合通用语言的概念：\n\
  - 广告 iframe 显示一个 HTML 文件。\n- 只有当活动在 active-placements 表中有至少一条关联记录时，活动才可以发布。\n- 销售佣金基于\
  \ transactions 和 approved-sales 表中的相关记录。\n\n这些后者的陈述纯粹是技术性的，领域专家将无法理解。假设工程师只熟悉这种技术、面向解决方案的业务领域视图。在这种情况下，他们将无法完全理解业务逻辑或其运作方式的原因，这将限制他们建模和实现有效解决方案的能力。\n\
  \n### 一致性\n\n通用语言必须精确且一致。它应消除对假设的需求，并使业务领域的逻辑明确。\n\n由于歧义会阻碍沟通，通用语言中的每个术语都应有且只有一个含义。让我们看几个术语不明确的例子以及如何改进它们。\n\
  \n### 模糊的术语\n\n假设在某个业务领域中，术语 *policy* 有多种含义：它可以指监管规则或保险合同。确切的含义可以在人与人之间的互动中根据上下文推断出来。然而，软件处理歧义并不好，而且在代码中建模“policy”实体可能很繁琐且具有挑战性。\n\
  \n通用语言要求每个术语只有一个含义，因此“policy”应使用两个术语 *regulatory rule* 和 *insurance contract* 明确建模。\n\
  \n### 同义词\n\n通用语言中不能互换使用两个术语。例如，许多系统使用术语 *user*。然而，对领域专家的行话进行仔细检查可能会发现 *user* 和其他术语被互换使用：例如，*user*、*visitor*、*administrator*、*account*\
  \ 等。\n\n同义词乍一看似乎无害。然而，在大多数情况下，它们表示不同的概念。在此示例中，*visitor* 和 *account* 在技术上都指系统的用户；然而，在大多数系统中，未注册用户和已注册用户代表不同的角色并具有不同的行为。例如，“访客”数据主要用于分析目的，而“账户”实际上使用系统及其功能。\n\
  \n最好在特定上下文中明确使用每个术语。理解使用中的术语之间的差异可以构建更简单、更清晰的业务领域实体模型和实现。\n\n### 业务领域模型\n\n\n\n\n\
  \n现在让我们从另一个角度来看普遍语言：建模。\n\n### 什么是模型？\n\n> 模型是对事物或现象的简化表示，它有意强调某些方面，同时忽略其他方面。具有特定用途的抽象。\n\
  > \n> ——Rebecca Wirfs-Brock\n\n模型不是现实世界的复制品，而是一种人类构建物，有助于我们理解现实世界系统。\n\n模型的典型例子是地图。任何地图都是一个模型，包括导航地图、地形图、世界地图、地铁图等，如图\
  \ 2-3 所示。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_56_0.png)\n\n图 2-3. 不同类型的地图展示了地球的不同模型：道路、时区、海上导航、地形、航空导航和地铁线路。\n\
  \n这些地图中没有一张代表我们星球的所有细节。相反，每张地图只包含足够的数据来支持其特定目的：它 supposed 要解决的问题。\n\n### 有效建模\n\n\
  所有模型都有目的，而有效的模型只包含为实现其目的所需的信息。例如，你不会在世界地图上看到地铁站。另一方面，你不能使用地铁地图来估算距离。每张地图只包含它 supposed\
  \ 要提供的信息。\n\n这一点值得重申：有用的模型不是现实世界的复制品。相反，模型旨在解决一个问题，并且应为该目的提供足够的信息。或者，正如统计学家 George\
  \ Box 所说，“所有模型都是错误的，但有些是有用的。”\n\n从本质上讲，模型是一种抽象。抽象的概念使我们能够通过省略不必要的细节，只保留解决当前问题所需的内容来处理复杂性。另一方面，无效的抽象会删除必要的信息，或通过保留不需要的内容而产生噪音。正如\
  \ Edsger W. Dijkstra 在其论文“The Humble Programmer”⁴ 中指出的那样，抽象的目的不是含糊其辞，而是创造一个新的语义层，在其中可以做到\
  \ *绝对精确*。\n\n### 对业务领域的建模\n\n在培养普遍语言时，我们实际上是在构建业务领域的模型。该模型 supposed 要捕捉领域专家的心智模型——他们关于业务如何运作以实现其功能的思考过程。模型必须反映所涉及的业务实体及其行为、因果关系和不变量。\n\
  \n我们使用的普遍语言并不 supposed 要涵盖领域的每一个可能细节。那将相当于让每个利益相关者都成为领域专家。相反，模型 supposed 要包含业务领域的足够方面，以便能够实现所需系统；即解决软件\
  \ intended 要解决的具体问题。在接下来的章节中，你将看到普遍语言如何驱动低级设计和实现决策。\n\n工程团队与领域专家之间的有效沟通至关重要。这种沟通的重要性随着业务领域复杂性的增长而增加。业务领域越复杂，就越难以对其业务逻辑进行建模和在代码中实现。即使是对复杂业务领域或其基本原则的轻微误解，也会无意中导致容易出现严重错误的实现。验证对业务领域的理解的唯一可靠方法是与领域专家交谈，并用他们理解的语言进行交流：业务的语言。\n\
  \n### 持续努力\n\n普遍语言的制定需要与它的自然持有者——领域专家——进行互动。只有与真正的领域专家的互动才能揭示不准确之处、错误假设或对业务领域的整体错误理解。\n\
  \n所有利益相关者都应始终如一地在所有项目相关沟通中使用普遍语言，以传播知识并促进对业务领域的共同理解。语言应在整个项目中持续强化：需求、测试、文档，甚至源代码本身都应使用这种语言。\n\
  \n最重要的是，培养普遍语言是一个持续的过程。它应不断得到验证和演进。日常使用语言会随着时间的推移揭示对业务领域的更深见解。当出现这样的突破时，普遍语言必须演进以跟上新获得的领域知识。\n\
  \n### 工具\n\n有一些工具和技术可以减轻捕获和管理普遍语言的过程。\n\n例如，可以使用 wiki 作为 *术语表* 来捕获和记录普遍语言。这样的术语表可以缓解新团队成员的上手过程，因为它作为了解业务领域术语的\
  \ go-to 场所。\n\n重要的是要使术语表维护成为共同努力。当普遍语言发生变化时，应鼓励所有团队成员继续更新术语表。这与集中式方法相反，在集中式方法中，只有团队领导或架构师负责维护术语表。\n\
  \n尽管维护项目相关术语的术语表具有明显的优势，但它存在固有的局限性。术语表最适用于“名词”：实体、流程、角色等的名称。虽然名词很重要，但捕获行为至关重要。行为不仅仅是与名词相关的动词列表，而是实际的业务逻辑，其规则、假设和不变量。此类概念更难在术语表中记录。因此，术语表最好与更适合捕获行为的其他工具一起使用；例如，用例或\
  \ *Gherkin 测试*。\n\n用 Gherkin 语言编写的自动化测试不仅是捕获普遍语言的绝佳工具，而且也是弥合领域专家与软件工程师之间差距的额外工具。领域专家可以阅读测试并验证系统的预期行为。⁵\
  \ 例如，参见以下用 Gherkin 语言编写的测试：\n\n```\nScenario: Notify the agent about a new support\
  \ case\nGiven Vincent Jules submits a new support case saying:\n\"\"\"\nI need help\
  \ configuring AWS Infinidash\n\"\"\"\nWhen the ticket is assigned to Mr. Wolf\n\
  Then the agent receives a notification about the new ticket\n```\n\n管理基于 Gherkin\
  \ 的测试套件有时可能具有挑战性，尤其是在项目的早期阶段。然而，对于复杂的业务领域来说，这绝对是值得的。\n\n最后，甚至还有静态代码分析工具可以验证普遍语言术语的使用。其中一个值得注意的工具示例是\
  \ NDepend。\n\n虽然这些工具很有用，但它们是次要的，次于在日常互动中实际使用普遍语言。使用工具来支持普遍语言的管理，但不要期望文档可以取代实际使用。正如《敏捷宣言》所说，“个体和互动高于流程和工具。”\n\
  \n### 挑战\n\n理论上，培养普遍语言听起来像是一个简单直接的过程。实际上并非如此。收集领域知识的唯一可靠方法是与领域专家交谈。相当频繁地，最重要的知识是隐性的。它没有被记录或编纂，而是只存在于领域专家的脑海中。获取它的唯一方法是提问。\n\
  \n随着你在这种实践中积累经验，你会注意到，经常，这个过程不仅仅是发现已有的知识，而是与领域专家共同创建模型。有时，领域专家自己对业务领域的理解中存在模糊性和空白点；例如，只定义“快乐路径”场景，但不考虑挑战既定假设的边缘情况。此外，你可能会遇到缺乏明确定义的业务领域概念。询问关于其性质的\n\
  \n\n\n业务领域往往会使这种隐含的冲突和空白显现出来。对于核心子域来说尤其常见。在这种情况下，学习过程是相互的——你也在帮助领域专家更好地理解他们的领域。\n\
  \n当向棕地项目引入领域驱动设计实践时，你会注意到已经形成了一种描述业务领域的语言，并且利益相关者在使用它。然而，由于该语言并非由 DDD 原则驱动，因此不一定能有效反映业务领域。例如，它可能会使用技术术语，例如数据库表名。改变一个组织中已经在使用的语言并不容易。这种情况下必不可少的工具是耐心。你需要确保在容易控制的地方使用正确的语言：在文档和源代码中。\n\
  \n最后，关于通用语言的问题是我在会议上经常被问到的：如果公司不在英语国家，我们应该使用什么语言。我的建议是至少使用英语名词来命名业务领域的实体。这将缓解在代码中使用相同术语的问题。\n\
  \n### 结论\n\n有效的沟通和知识共享对于软件项目的成功至关重要。软件工程师必须理解业务领域，以便设计和构建软件解决方案。\n\n领域驱动设计的通用语言是弥合领域专家与软件工程师之间知识差距的有效工具。它通过培养一种共享语言来促进沟通和知识共享，该语言可在整个项目中被所有利益相关者使用：在对话、文档、测试、图表、源代码等中。\n\
  \n为了确保有效沟通，通用语言必须消除歧义和隐含假设。语言中的所有术语都必须保持一致——没有歧义的术语，也没有同义词。\n\n培养通用语言是一个持续的过程。随着项目的演进，会发现更多领域知识。重要的是这些见解要反映在通用语言中。\n\
  \n诸如基于 wiki 的术语表和 Gherkin 测试等工具可以极大地缓解记录和维护通用语言的过程。然而，有效通用语言的主要前提是使用：该语言必须在所有项目相关沟通中始终如一地使用。\n\
  \n## 练习\n\n- 1. 谁应该能够为通用语言的定义做出贡献？\n  - a. 领域专家\n  - b. 软件工程师\n  - c. 终端用户\n  -\
  \ d. 项目的所有利益相关者\n- 2. 通用语言应该在何处使用？\n  - a. 面对面对话\n  - b. 文档\n  - c. 代码\n  - d. 以上全部\n\
  \n3. 请回顾前言中虚构的 WolfDesk 公司的描述。你能在描述中发现哪些业务领域术语？\n\n4. 考虑你当前正在进行或过去进行过的某个软件项目：\n\
  \  - a. 尝试提出可在与领域专家对话中使用的业务领域概念。\n  - b. 尝试识别不一致术语的示例：业务领域概念具有不同含义，或相同概念由不同术语表示。\n\
  \  - c. 你是否遇到过因沟通不畅而导致的软件开发效率低下？\n\n5. 假设你在进行一个项目，你注意到来自不同组织单元的领域专家使用相同的术语，例如 policy，来描述业务领域中不相关的概念。\n\
  \n由此产生的通用语言基于领域专家的心理模型，但未能满足术语具有单一含义的要求。\n\n在继续下一章之前，你将如何解决这种困境？\n\n3 玩家排成一列，第一位玩家想出一条信息并悄悄告诉第二位玩家。第二位玩家将信息重复给第三位玩家，以此类推。最后一位玩家将听到的信息宣布给整个团体。第一位玩家随后将原始信息与最终版本进行比较。虽然目标是传达相同的信息，但它通常会被篡改，最后一位玩家收到的信息与原始信息有显著不同。\n\
  \n4 Edsger W. Dijkstra，“谦逊的程序员”。\n\n5 但请不要陷入认为领域专家会编写 Gherkin 测试的陷阱。\n"
- '## 第 3 章 管理领域复杂性


  正如你在上一章所看到的，为了确保项目的成功，至关重要的是你开发出一种通用语言，可供所有利益相关者使用，从软件工程师到领域专家。语言应反映领域专家对业务领域内部运作和基本原则的心理模型。


  由于我们的目标是使用通用语言来驱动软件设计决策，因此语言必须清晰且一致。它应免于歧义、隐含假设和多余细节。然而，在组织层面，领域专家的心理模型本身可能不一致。不同的领域专家可能对同一业务领域使用不同的模型。让我们看一个例子。


  #### 不一致的模型


  让我们回到第 2 章中的电话营销公司示例。该公司的营销部门通过在线广告产生潜在客户。其销售部门负责招揽潜在客户购买其产品或服务，其流程如图 3-1 所示。


  ![](img/b742a71dea5d5dd509847f82600a6ad1_66_0.png)


  图 3-1. 示例业务领域：电话营销公司


  对领域专家语言的检查揭示了一个奇特的观察。术语 lead 在营销和销售部门的含义不同：


  #### 营销部门


  对于营销人员来说，lead 代表有人对其中一种产品感兴趣的通知。将收到潜在客户联系方式的事件视为 lead。


  #### 销售部门


  在销售部门的语境中，lead 是一个更复杂的实体。它代表整个销售流程的生命周期。它不是一个简单的事件，而是一个长期运行的过程。


  我们如何为这家电话营销公司制定通用语言？


  一方面，我们知道通用语言必须保持一致——每个术语应只有一个含义。另一方面，我们知道通用语言必须反映领域专家的心理模型。在这种情况下，销售和营销部门的领域专家对“lead”的心理模型是不一致的。


  这种歧义在人与人之间的沟通中并不会带来太多挑战。事实上，不同部门之间的人沟通可能更具挑战性，但人类很容易从互动的上下文中推断出确切含义。


  然而，要在软件中表示这种分歧的业务领域模型则更困难。源代码无法很好地处理歧义。如果我们将销售部门的复杂模型带入营销，它会在不需要的地方引入复杂性——营销人员为优化广告活动所需的大量细节和行为都太多。但如果我们试图根据营销部门的世界观简化销售模型，它也不符合销售子域的需求，因为它对于管理和优化销售流程来说过于简单化。我们在第一种情况下会得到过度设计的解决方案，在第二种情况下会得到设计不足的解决方案。


  我们如何解决这个两难困境？


  解决这个问题的传统方案是设计一个可用于各种问题的单一模型。此类模型会产生巨大的实体关系图 ERD，遍布整面办公室墙。图 3-2 是一个有效的模型吗？






  ![](img/b742a71dea5d5dd509847f82600a6ad1_68_0.png)


  图 3-2. 企业级实体关系图


  俗话说，“样样通，样样松”。这类模型本应适用于一切，最终却对任何事物都无效。不管你做什么，你始终面临着复杂性：过滤掉无关细节的复杂性、找到真正需要的东西的复杂性，以及最重要的是，保持数据处于一致状态的复杂性。


  另一种解决方案是在有问题的术语前加上上下文的定义：“营销线索”和“销售线索”。这样就可以在代码中实现这两种模型。然而，这种方法有两个主要缺点。首先，它会增加认知负担。何时使用每种模型？冲突模型的实现越接近，犯错就越容易。其次，模型的实现不会与通用语言保持一致。没人会在对话中使用前缀。人们不需要这些额外信息；他们可以依赖对话的上下文。


  让我们转向领域驱动设计模式来应对此类场景：有界上下文模式。


  ### 什么是有界上下文？


  领域驱动设计中的解决方案很简单：将通用语言划分为多个更小的语言，然后将每种语言分配给其可以应用的明确上下文：其*有界上下文*。


  在前面的示例中，我们可以识别出两个有界上下文：营销和销售。术语*lead*同时存在于这两个有界上下文中，如图 3-3 所示。只要它在每个有界上下文中都有单一含义，每个细粒度的通用语言就保持一致并遵循领域专家的心智模型。


  ![](img/b742a71dea5d5dd509847f82600a6ad1_69_0.png)


  *图 3-3. 通过将通用语言拆分为有界上下文来解决不一致问题*


  从某种意义上说，术语冲突和隐式上下文是任何规模合理的企业固有的部分。有了有界上下文模式，上下文被建模为业务域中明确且不可或缺的一部分。


  ### 模型边界


  正如我们在上一章讨论的那样，模型不是现实世界的复制品，而是一种帮助我们理解复杂系统的构造。它所要解决的问题是模型固有的部分——其目的。模型不能没有边界存在；它会扩展成为现实世界的复制品。这使得定义模型的边界——其有界上下文——成为建模过程的内在部分。


  让我们回到地图作为模型的例子。我们看到每张地图都有其特定的上下文——航空、海图、地形、地铁等等。地图只有在其特定目的范围内才有用且一致。


  正如地铁地图对海上导航毫无用处一样，一个有界上下文中的通用语言可能与另一个有界上下文的范围完全无关。有界上下文定义了通用语言及其所代表的模型的应用范围。它们允许根据不同的问题域定义不同的模型。换句话说，有界上下文是通用语言的一致性边界。语言的术语、原则和业务规则仅在其有界上下文内部保持一致。


  ### 完善的通用语言


  有界上下文使我们能够完成通用语言的定义。通用语言并非以“无处不在”的意义上应该在整个组织中“无处不在”地使用和应用。通用语言并非通用。


  相反，通用语言仅在其有界上下文的边界内才是无处不在的。该语言专注于描述仅由有界上下文所涵盖的模型。由于模型不能没有其所要解决的问题而存在，因此通用语言不能在没有明确适用上下文的情况下被定义或使用。


  ### 有界上下文的范围


  本章开头的示例展示了业务域固有的边界。不同的领域专家对同一业务实体持有冲突的心智模型。为了对业务域建模，我们必须划分模型并为每个细粒度模型定义严格的适用上下文——其有界上下文。


  通用语言的一致性只有助于识别该语言最宽的边界。它不能更大，否则就会出现不一致的模型和术语。然而，我们仍然可以将模型进一步分解为更小的有界上下文，如图 3-4 所示。


  ![](img/b742a71dea5d5dd509847f82600a6ad1_71_0.png)


  图 3-4. 更小的有界上下文


  定义通用语言的范围——其有界上下文——是一个战略设计决策。边界可以很宽，遵循业务域固有的上下文，也可以很窄，进一步将业务域划分为更小的问题域。


  有界上下文的大小本身并不是决定因素。模型不一定大或小。模型需要有用。通用语言的边界越宽，保持其一致就越困难。将大型通用语言划分为更小、更易管理的领域可能是有益的，但追求过小的有界上下文也会适得其反。它们越小，设计带来的集成开销就越大。


  因此，有界上下文应有多大取决于具体的问题域。有时，使用宽边界会更清晰，而在其他时候，进一步分解会更有意义。


  从较大的上下文中提取更细粒度的有界上下文的原因包括组建新的软件工程团队或解决系统的某些非功能性需求；例如，当你需要将原本位于单个有界上下文中的组件的开发生命周期分开时。提取某个功能性的另一个常见原因是能够使其独立于有界上下文的其余功能进行扩展。


  因此，保持你的模型有用，并使有界上下文的大小与你的业务需求和组织约束保持一致。需要注意的一点是，不要将连贯的功能拆分为多个有界上下文。这种划分会阻碍独立演进每个上下文的能力。相反，相同的业务需求和变更将同时影响有界上下文并需要同时部署变更。为了避免这种无效的分解，使用我们在第
  1 章讨论的经验法则来查找子域：识别操作相同数据的连贯用例集，并避免将它们分解为多个有界上下文。


  我们将在第 8 章和第 10 章进一步讨论持续优化有界上下文边界的话题。


  ### 有界上下文与子域


  在第 2 章中，我们看到业务域由多个子域组成。到目前为止，本章探讨了将业务域分解为一组细粒度问题域或有界上下文的概念。乍一看，这两种分解业务域的方法似乎是多余的。然而，事实并非如此。让我们来看看为什么我们需要两者。


  ### 子域


  为了理解公司的业务战略，我们必须分析其业务域。根据领域驱动设计方法论，分析阶段涉及识别不同的子域（核心、支持和通用）。这就是组织的工作方式以及其竞争战略的规划方式。


  正如你在第 1 章中学到的那样，子域类似于一组相互关联的用例。用例由业务域和系统的需求定义。作为软件工程师，我们不定义需求；这是业务的责任。相反，我们分析业务域以识别子域。


  #### 有界上下文


  另一方面，有界上下文是设计出来的。选择模型边界是一个战略设计决策。我们决定如何将业务域划分为更小、可管理的领域。


  #### 子域与有界上下文之间的相互作用


  理论上，尽管不切实际，单个模型可以跨越整个业务域。对于小型系统来说，这种策略可能有效，如图 3-5 所示。






  ![](img/b742a71dea5d5dd509847f82600a6ad1_74_0.png)


  图 3-5. 单体有界上下文


  当出现冲突的模型时，我们可以遵循领域专家的心智模型，并将系统分解为有界上下文，如图 3-6 所示。


  ![](img/b742a71dea5d5dd509847f82600a6ad1_74_1.png)


  ![](img/b742a71dea5d5dd509847f82600a6ad1_74_2.png)


  图 3-6. 由通用语言一致性驱动的有界上下文


  如果模型仍然庞大且难以维护，我们可以将其进一步分解为更小的有界上下文；例如，为每个子域设置一个有界上下文，如图 3-7 所示。


  ![](img/b742a71dea5d5dd509847f82600a6ad1_75_0.png)


  图 3-7. 与子域边界对齐的有界上下文


  无论哪种方式，这都是一个设计决策。我们将这些边界作为解决方案的一部分进行设计。


  在某些场景下，有界上下文与子域之间的一对一关系是完全合理的。然而在其他情况下，不同的分解策略可能更合适。


  必须记住，子域是被发现的，而有界上下文是被设计的。¹ 子域由业务战略定义。然而，我们可以设计软件解决方案及其有界上下文，以应对特定项目的上下文和约束。


  最后，正如你在第 1 章学到的那样，一个模型旨在解决特定问题。在某些情况下，同时使用同一概念的多个模型来解决不同问题是有益的。正如不同类型的地图提供关于我们星球的不同类型信息一样，使用同一子域的不同模型来解决不同问题可能是合理的。将设计限制为有界上下文之间的一对一关系会抑制这种灵活性，并迫使我们在其有界上下文中使用子域的单一模型。


  ### 边界


  正如 Ruth Malan 所说，架构设计本质上是关于边界的：


  > *架构设计是系统设计。系统设计是上下文设计——它本质上是关于边界的（什么在内，什么在外，什么跨越，什么在两者之间移动），以及关于权衡。它重塑外部，就像它塑造内部一样。*²


  有界上下文模式是领域驱动设计用于定义物理和所有权边界的工具。


  #### 物理边界


  有界上下文不仅作为模型的边界，也作为实现它们的系统的物理边界。每个有界上下文都应作为一个独立的服务/项目来实现，这意味着它与其它有界上下文独立地实现、演进和版本化。


  有界上下文之间清晰的物理边界使我们能够使用最适合其需求的技术栈来实现每个有界上下文。


  正如我们之前讨论的，一个有界上下文可以包含多个子域。在这种情况下，有界上下文是物理边界，而其每个子域是逻辑边界。逻辑边界在不同编程语言中被称为不同的名称：命名空间、模块或包。


  #### 所有权边界


  研究表明，好篱笆确实能造就好邻居。在软件项目中，我们可以利用模型边界——有界上下文——来实现团队的和平共处。团队之间工作划分的另一个战略决策也可以使用有界上下文模式来做出。


  一个有界上下文应且只能由一个团队实现、演进和维护。两个团队不能同时工作于同一个有界上下文。这种隔离消除了团队之间可能对彼此模型做出的隐含假设。相反，他们必须明确定义集成其模型和系统的通信协议。


  需要注意的是，团队与有界上下文之间的关系是单向的：一个有界上下文只能由一个团队拥有。然而，一个团队可以拥有多个有界上下文，如图 3-8 所示。


  ![](img/b742a71dea5d5dd509847f82600a6ad1_77_0.png)


  图 3-8. 团队 1 在营销和优化有界上下文上工作，而团队 2 在销售有界上下文上工作


  ### 现实生活中的有界上下文


  在我的一次领域驱动设计课程中，一位参与者曾指出：“你说 DDD 是关于将软件设计与业务域对齐。但现实生活中的有界上下文在哪里？业务域中并没有有界上下文。”


  的确，有界上下文不如业务域和子域那样明显，但它们确实存在，就像领域专家的心智模型一样。你只需要有意识地思考领域专家如何思考不同的业务实体和流程。


  我想通过讨论一些例子来结束本章，证明不仅在软件中对业务域建模时有界上下文存在，而且在一般生活中使用不同上下文中的不同模型的观念也很普遍。


  #### 语义域


  可以说，领域驱动设计的 有界上下文 基于词典学上的语义域概念。语义域被定义为意义的领域以及用来谈论它的词语。例如，单词 monitor、port 和 processor
  在软件和硬件工程语义域中具有不同的含义。


  不同语义域的一个相当奇特的例子是单词 tomato 的含义。


  根据植物学定义，果实是植物传播其种子的方式。果实应从植物的花中生长出来，并至少带有一种种子。另一方面，蔬菜是一个总称，涵盖植物的所有其它可食用部分：根、茎和叶。基于此定义，西红柿是一种水果。


  然而，在烹饪艺术的上下文中，这个定义用处不大。在此上下文中，水果和蔬菜是基于其风味特征定义的。水果质地柔软，甜或酸，可以生吃，而蔬菜质地较硬，味道较淡，通常需要烹饪。根据此定义，*西红柿是蔬菜*。


  因此，在*植物学的有界上下文*中，西红柿是水果，而在*烹饪艺术的有界上下文*中，它是蔬菜。但这还不是全部。


  1883 年，美国对进口蔬菜征收 10% 的税，但不对水果征税。西红柿作为水果的植物学定义使得西红柿可以免缴进口税进入美国。为了堵住这一漏洞，1893 年美国最高法院做出裁决，将西红柿归类为蔬菜。因此，在*税收的有界上下文*中，西红柿是蔬菜。


  此外，正如我的朋友 Romeu Moura 所说，*在戏剧表演的有界上下文*中，西红柿是一种反馈机制。


  #### 科学


  正如历史学家 Yuval Noah Harari 所说，“科学家普遍认为，没有一种理论是 100% 正确的。因此，知识的真正检验不是真理，而是效用。”换句话说，没有科学理论在所有情况下都是正确的。不同的理论在不同的上下文中有用。


  这一概念可以通过艾萨克·牛顿爵士和阿尔伯特·爱因斯坦引入的不同引力模型来证明。根据牛顿运动定律，空间和时间是绝对的。它们是物体运动发生的舞台。在爱因斯坦的相对论中，空间和时间不再是绝对的，而是对不同观察者而言不同。


  尽管这两种模型可以被视为矛盾的，但在各自合适的有界上下文中，两者都是有用的。


  #### 购买冰箱


  最后，让我们看一个更贴近现实的有界上下文例子。你在图 3-9 中看到了什么？


  ![](img/b742a71dea5d5dd509847f82600a6ad1_80_0.png)


  图 3-9. 一块纸板


  它只是一块纸板吗？不，它是一个模型。它是西门子 KG86NAI31L 冰箱的模型。如果你查一下，你可能会说这块纸板看起来一点也不像那台冰箱。它没有门，甚至颜色也不同。


  虽然这是真的，但这并不相关。正如我们所讨论的，模型并不打算复制现实世界实体。相反，它应该有一个目的——它应该解决的问题。因此，关于这块纸板的正确问题是，这个模型解决了什么问题？






  在我们的公寓里，厨房没有标准的入口。纸板被精确裁剪成与冰箱宽度和深度相同的尺寸。它解决的问题是检查冰箱能否穿过厨房门（见图 3-10）。


  ![](img/b742a71dea5d5dd509847f82600a6ad1_81_0.png)


  图 3-10。厨房门道中的纸板模型


  尽管纸板看起来与冰箱完全不同，但在我们必须决定是否购买此型号还是选择更小型号时，它被证明极其有用。同样，所有模型都是错误的，但有些是有用的。制作冰箱的 3D 模型绝对会是一个有趣的项目。但它能比纸板更高效地解决问题吗？不能。如果纸板能放进去，3D
  模型也能放进去，反之亦然。用软件工程的术语来说，制作冰箱的 3D 模型就是严重的过度设计。


  那冰箱的高度呢？如果底部能放进去，但太高而无法通过门道呢？这能证明我们需要粘合一个冰箱的 3D 模型吗？不能。这个问题可以用卷尺快速、轻松地解决来检查门道的高度。卷尺在这种情况下是什么？另一个简单的模型。


  因此，我们最终得到了冰箱的两个模型。使用两个各自针对特定任务优化的模型，体现了 DDD 对建模业务域的方法。每个模型都有其严格的限定上下文：纸板验证冰箱的底座能否通过厨房入口，而卷尺验证它是否不会太高。*模型应省略与当前任务无关的多余信息。*此外，如果多个更简单的模型能分别有效解决每个问题，就没有必要设计一个复杂的样样通用的模型。


  在我发布了 [这条推文](https://twitter.com) 后的几天里，我收到了一条回复，说我本可以用带 LiDAR 扫描仪的手机和增强现实（AR）应用程序来代替折腾纸板。让我们从领域驱动设计的角度分析一下这个建议。


  评论作者说这是一个别人已经解决的问题，而且解决方案唾手可得。毋庸置疑，扫描技术和 AR 应用程序都很复杂。在 DDD 用语中，这使得检查冰箱能否通过门道的问题成为一个通用子域。


  ### 结论


  每当我们在领域专家的心智模型中遇到固有的冲突时，我们就必须将通用语言分解为多个限定上下文。通用语言应在限定上下文的范围内保持一致。然而，在不同的限定上下文中，相同的术语可能具有不同的含义。


  在发现子域的同时，限定上下文被设计出来。将领域划分为限定上下文是一个战略设计决策。


  一个限定上下文及其通用语言可以由一个团队实现和维护。两个团队不能共同承担同一个限定上下文的工作。然而，一个团队可以同时处理多个限定上下文。


  限定上下文将系统分解为物理组件——服务、子系统等等。每个限定上下文的生命周期与其他部分解耦。每个限定上下文都可以独立于系统的其余部分演进。然而，限定上下文必须协同工作以形成一个系统。其中一些更改会无意中影响另一个限定上下文。在下一章中，我们将讨论用于集成限定上下文以保护它们免受级联更改影响的不同模式。


  ## 练习


  - 1. 子域和限定上下文有什么区别？

  - a. 子域是设计的，而限定上下文是发现的。

  - b. 限定上下文是设计的，而子域是发现的。

  - c. 限定上下文和子域本质上是相同的。

  - d. 以上都不正确。

  - 2. 限定上下文是以下内容的边界：

  - a. 模型

  - b. 生命周期

  - c. 所有权

  - d. 以上全部


  3. 关于限定上下文的大小，以下哪项是正确的？


  限定上下文越小，系统越灵活。


  - a. 限定上下文应始终与子域的边界保持一致。

  - b. 限定上下文越宽越好。

  - c. 取决于情况。


  4. 关于团队对限定上下文的所有权，以下哪项是正确的？


  - a. 多个团队可以共同处理同一个限定上下文。

  - b. 一个团队可以拥有多个限定上下文。

  - c. 限定上下文只能由一个团队拥有。

  - d. B 和 C 正确。


  5. 回顾前言中 WolfDesk 公司的示例，并尝试识别系统中可能需要不同支持工单模型的功能。


  6. 尝试找到除本章所述之外的现实生活中的限定上下文示例。


  负责软件工程和业务发展的双重工作。因此，你有能力影响软件设计（限定上下文）和业务战略（子域）。因此，在我们这里讨论的（限定）上下文中，我们仅关注软件工程。



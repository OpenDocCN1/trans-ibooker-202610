  +      b. 可靠地发布消息\n+      c. 支持事件溯源领域模型模式的实现\n+      d. A 和 C\n+   3. 除了向消息总线发布消息之外，出箱模式还有哪些其他可能的用例？\n\
  +   4. Saga 模式和流程管理器模式有什么区别？\n\n+   a. 流程管理器需要显式实例化，而 Saga 在相关领域事件发布时执行。\n+   \n\
  +   b. 与流程管理器相反，Saga 从不要求其执行状态的持久化。\n+   \n+   c. Saga 要求其操作的组件实现事件溯源模式，而流程管理器不需要。\n\
  +   \n+   d. 流程管理器模式适用于复杂的业务工作流。\n+   \n+   e. A 和 D 正确。\n\n1 Richardson, C. (2019).\

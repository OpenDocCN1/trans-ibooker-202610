- "## 第 4 章。集成限定上下文\n\n限定上下文模式不仅保护了通用语言的一致性，还使建模成为可能。你无法在不指定其目的——其边界的情况下构建模型。边界划分了语言的责任。一个限定上下文中的语言可以对业务域进行建模以解决特定问题。另一个限定上下文可以表示相同的业务实体，但对其进行建模以解决不同的问题。\n\
  \n此外，不同限定上下文中的模型可以独立演进和实现。也就是说，限定上下文本身并不是独立的。就像系统不能由独立的组件构建——组件必须相互交互以实现系统的总体目标——同样，限定上下文中的实现也是如此。尽管它们可以独立演进，但必须相互集成。因此，限定上下文之间总会有接触点。这些被称为\
  \ *契约*。\n\n需要契约的原因是限定上下文的模型和语言存在差异。由于每个契约影响多个参与方，因此需要定义和协调它们。此外，根据定义，两个限定上下文使用不同的通用语言。集成时将使用哪种语言？这些集成问题应由解决方案的设计来评估和解决。\n\
  \n在本章中，你将学习领域驱动设计中用于定义限定上下文之间关系和集成的模式。这些模式由负责限定上下文的团队之间的协作性质驱动。我们将把这些模式分为三组，每组代表一种团队协作类型：合作、客户-供应商和各自为政。\n\
  \n#### 合作\n\n合作模式涉及由沟通良好的团队实现的限定上下文。\n\n在最简单的情况下，这些是由单个团队实现的限定上下文。这也适用于目标相互依赖的团队，其中一个团队的成功取决于另一个团队的成功，反之亦然。再次强调，这里主要标准是团队之间的沟通和协作质量。\n\
  \n让我们看一下适合合作团队的两种 DDD 模式：合作伙伴关系和共享内核模式。\n\n#### 合作伙伴关系\n\n在合作伙伴关系模型中，限定上下文之间的集成以临时方式协调。一个团队可以通知第二个团队关于\
  \ API 的更改，第二个团队会合作并适应——没有戏剧或冲突（见图 4-1）。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_87_0.png)\n\
  \n图 4-1。合作伙伴关系模型\n\n这里的集成协调是双向的。没有一个团队规定用于定义契约的语言。团队可以解决差异并选择最合适的解决方案。此外，双方在解决任何集成问题时都会合作\n\
  \n\n\nthat might come up. Neither team is interested in blocking the other one.\n\
  \nWell-established collaboration practices, high levels of commitment, and frequent\
  \ synchronizations between teams are required for successful integration in this\
  \ manner. From a technical perspective, continuous integration of the changes applied\
  \ by both teams is needed to further minimize the integration feedback loop.\n\n\
  This pattern might not be a good fit for geographically distributed teams since\
  \ it may present synchronization and communication challenges.\n\n### Shared Kernel\n\
  \nDespite bounded contexts being model boundaries, there still can be cases when\
  \ the same model of a subdomain, or a part of it, will be implemented in multiple\
  \ bounded contexts. It’s crucial to stress that the shared model is designed according\
  \ to the needs of all of the bounded contexts. Moreover, the shared model has to\
  \ be consistent across all of the bounded contexts that are using it.\n\nAs an example,\
  \ consider an enterprise system that uses a tailor-made model for managing users’\
  \ permissions. Each user can have their permissions granted directly or inherited\
  \ from one of the organizational units they belong to. Moreover, each bounded context\
  \ can modify the authorization model, and the changes each bounded context applies\
  \ have to affect all the other bounded contexts using the model (see Figure 4-2).\n\
  \n![](img/b742a71dea5d5dd509847f82600a6ad1_89_0.png)\n\nShared kernel\n\nFigure\
  \ 4-2. Shared kernel\n\n### Shared scope\n\nThe overlapping model couples the lifecycles\
  \ of the participating bounded contexts. A change made to the shared model has an\
  \ immediate effect on all the bounded contexts. Hence, to minimize the cascading\
  \ effects of changes, the overlapping model should be limited, exposing only that\
  \ part of the model that has to be implemented by both bounded contexts. Ideally,\
  \ the shared kernel will consist only of integration contracts and data structures\
  \ that are intended to be passed across the bounded contexts’ boundaries.\n\n###\
  \ Implementation\n\nThe shared kernel is implemented so that any modification to\
  \ its source code is immediately reflected in all the bounded contexts using it.\n\
  \nIf the organization uses the mono-repository approach, these can be the same source\
  \ files referenced by multiple bounded contexts. If using a shared repository is\
  \ not possible, the shared kernel can be extracted into a dedicated project and\
  \ referenced in the bounded contexts as a linked library. Either way, each change\
  \ to the shared kernel must trigger integration tests for all the affected bounded\
  \ contexts.\n\nThe continuous integration of changes is required because the shared\
  \ kernel belongs to multiple bounded contexts. Not propagating shared kernel changes\
  \ to all related bounded contexts leads to inconsistencies in a model: bounded contexts\
  \ may rely on stale implementations of the shared kernel, leading to data corruption\
  \ and/or runtime issues.\n\n### When to use shared kernel\n\nThe overarching applicability\
  \ criterion for the shared kernel pattern is the cost of duplication versus the\
  \ cost of coordination. Since the pattern introduces a strong dependency between\
  \ the participating bounded contexts, it should be applied only when the cost of\
  \ duplication is higher than the cost of coordination—in other words, only when\
  \ integrating changes applied to the shared model by both bounded contexts will\
  \ require more effort than coordinating the changes in the shared codebase.\n\n\
  The difference between the integration and duplication costs depends on the volatility\
  \ of the model. The more frequently it changes, the higher the integration costs\
  \ will be. Therefore, the shared kernel will naturally be applied for the subdomains\
  \ that change the most: the core subdomains.\n\nIn a sense, the shared kernel pattern\
  \ contradicts the principles of bounded contexts introduced in the previous chapter.\
  \ If the participating bounded contexts are not implemented by the same team, introducing\
  \ a shared kernel contradicts the principle that a single team should own a bounded\
  \ context. The overlapping model—the shared kernel—is, in effect, being developed\
  \ by multiple teams.\n\nThat’s the reason why the use of a shared kernel has to\
  \ be justified. It’s a pragmatic exception that should be considered carefully.\
  \ A common use case for implementing a shared kernel is when communication or collaboration\
  \ issues prevent implementing the partnership pattern—for example, because of geographical\
  \ constraints or organizational politics. Implementing a closely related functionality\
  \ without proper coordination will result in integration issues, desynchronized\
  \ models, and arguments about which model is better designed. Minimizing the shared\
  \ kernel’s scope controls the scope of cascading changes, and triggering integration\
  \ tests for each change is a way to enforce early detection of integration issues.\n\
  \nAnother common use case for applying the shared kernel pattern, albeit a temporary\
  \ one, is the gradual modernization of a legacy system. In such a scenario, the\
  \ shared codebase can be a pragmatic intermediate solution for gradually decomposing\
  \ the system into bounded contexts.\n\nFinally, a shared kernel can be a good fit\
  \ for integrating bounded contexts owned and implemented by the same team. In such\
  \ a case, an ad hoc integration of the bounded contexts—a partnership—can “wash\
  \ out” the contexts’ boundaries over time. A shared kernel can be used for explicitly\
  \ defining the bounded contexts’ integration contracts.\n\n### Customer–Supplier\n\
  \nThe second group of collaboration patterns we’ll examine is the customer–supplier\
  \ patterns. As shown in Figure 4-3, one of the bounded contexts—the supplier—provides\
  \ a service for its customers. The service provider is “upstream” and the customer\
  \ or consumer is “downstream.”\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_92_0.png)\n\
  \nFigure 4-3. Customer–supplier relationship\n\nUnlike in the cooperation case,\
  \ both teams (upstream and downstream) can succeed independently. Consequently,\
  \ in most cases we have an imbalance of power: either the upstream or the downstream\
  \ team can dictate the integration contract.\n\nThis section will discuss three\
  \ patterns addressing such power differences: the conformist, anticorruption layer,\
  \ and open-host service patterns.\n\n### Conformist\n\nIn some cases, the balance\
  \ of power favors the upstream team, which has no real motivation to support its\
  \ clients’ needs. Instead, it just provides the integration contract, defined according\
  \ to its own model—take it or leave it. Such power imbalances can be caused by integration\
  \ with service providers that are external to the organization or simply by organizational\
  \ politics.\n\nIf the downstream team can accept the upstream team’s model, the\
  \ bounded contexts’ relationship is called conformist. The downstream conforms to\
  \ the upstream bounded context’s model, as shown in Figure 4-4.\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_93_0.png)\n\
  \nFigure 4-4. Conformist relationship\n\nThe downstream team’s decision to give\
  \ up some of its autonomy can be justified in multiple ways. For example, the contract\
  \ exposed by the upstream team may be an industry-standard, well-established model,\
  \ or it may just be good enough for the downstream team’s needs.\n\nThe next pattern\
  \ addresses the case in which a consumer is not willing to accept the supplier’s\
  \ model.\n\n### Anticorruption Layer\n\nAs in the conformist pattern, the balance\
  \ of power in this relationship is still skewed toward the upstream service. However,\
  \ in this case, the downstream bounded context is not willing to conform. Instead,\
  \ it can translate the upstream bounded context’s model into a model tailored to\
  \ its own needs via an anticorruption layer, as shown in Figure 4-5.\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_93_1.png)\n\
  \nFigure 4-5. Integration through an anticorruption layer\n\nThe anticorruption\
  \ layer pattern addresses scenarios in which it is not desirable or worth the effort\
  \ to conform to the supplier’s model, such as the following:\n\n- *When the downstream\
  \ bounded context contains a core subdomain*\n\nA core subdomain’s model requires\
  \ extra attention, and adhering to the supplier’s model might impede the modeling\
  \ of the problem domain.\n\n- *When the upstream model is inefficient or inconvenient\
  \ for the consumer’s needs*\n\nIf a bounded context conforms to a mess, it risks\
  \ becoming a mess itself. That is often the case when integrating with legacy systems.\n\
  \n- *When the supplier’s contract changes often*\n\nThe consumer wants to protect\
  \ its model from frequent changes. With an anticorruption layer, the changes in\
  \ the supplier’s model only affect the translation mechanism.\n\nFrom a modeling\
  \ perspective, the translation of the supplier’s model isolates the downstream consumer\
  \ from foreign concepts that are not relevant to its bounded context. Hence, it\
  \ simplifies the consumer’s ubiquitous language and model.\n\nIn Chapter 9, we will\
  \ explore the different ways to implement an anticorruption layer.\n\n### Open-Host\
  \ Service\n\nThis pattern addresses cases in which the power is skewed toward the\
  \ consumers. The supplier is interested in protecting its consumers\n\n\n\nand providing\
  \ the best service possible.\n\n为了保护消费者免受其实现模型变化的影响，上游供应商将实现模型与公共接口解耦。这种解耦使供应商能够以不同的速率演进其实现模型和公共模型，如图\
  \ 4-6 所示。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_95_0.png)\n\n图 4-6. 通过开放主机服务集成\n\
  \n供应商的公共接口并非旨在符合其通用语言。相反，它旨在以集成导向的语言表达对消费者方便的协议进行公开。因此，公共协议被称为发布语言。\n\n从某种意义上说，开放主机服务模式是反腐败层模式的逆转：不是消费者，而是供应商实现了其内部模型的翻译。\n\
  \n将有界上下文的实现模型和集成模型解耦，给予上游有界上下文自由地演进其实现，而不会影响下游上下文。当然，这只有在修改后的实现模型可以翻译成消费者已在使用的发布语言时才可能。\n\
  \n此外，集成模型的解耦允许上游有界上下文同时公开发布语言的多个版本，从而允许消费者逐步迁移到新版本（见图 4-7）。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_96_0.png)\n\
  \n图 4-7. 开放主机服务公开发布语言的多个版本\n\n### 各走各路\n\n最后一种协作选项是根本不协作。这种模式可能因不同原因而出现，在团队不愿或无法协作的情况下。我们将在这里看几个例子。\n\
  \n#### 沟通问题\n\n避免协作的常见原因是组织规模或内部政治驱动的沟通困难。当团队难以协作和达成一致时，分道扬镳并在多个有界上下文中重复功能可能更具成本效益。\n\
  \n#### 通用子域\n\n重复子域的性质也可能是团队各走各路的原因。当所讨论的子域是通用的，并且如果通用解决方案易于集成时，将其在每个有界上下文中本地集成可能更具成本效益。一个例子是日志框架；一个有界上下文将其作为服务公开几乎没有意义。集成此类解决方案的额外复杂性将超过在多个上下文中不重复功能的收益。重复功能将比协作更便宜。\n\
  \n#### 模型差异\n\n有界上下文模型之间的差异也可能是选择各走各路协作的原因。模型可能差异太大，以至于从属关系不可能，实现反腐败层将比重复功能更昂贵。在这种情况下，团队各走各路对团队来说更具成本效益。\n\
  \n> NOTE\n> \n> 在集成核心子域时应避免各走各路模式。重复此类子域的实现将违背公司以最有效和最优化的方式实现它们的战略。\n\n### 上下文映射\n\
  \n在分析系统有界上下文之间的集成模式后，我们可以将它们绘制在上下文映射上，如图 4-8 所示。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_98_0.png)\n\
  \n图 4-8. 上下文映射\n\n上下文映射是对系统的有界上下文及其之间集成情况的视觉表示。这种视觉表示法在多个层面上提供了宝贵的战略洞察：\n\n*高层设计*\n\
  \n上下文映射提供了系统组件及其实现模型的概览。\n\n*沟通模式*\n\n上下文映射描绘了团队之间的沟通模式——例如，哪些团队正在协作，哪些更喜欢“不太亲密”的集成模式，例如反腐败层和各走各路模式。\n\
  \n*组织问题*\n\n上下文映射可以提供组织问题的洞察。例如，如果某个上游团队的下游消费者都诉诸于实现反腐败层，或者所有各走各路模式的实现都集中在同一个团队周围，这意味着什么？\n\
  \n#### 维护\n\n理想情况下，上下文映射应从项目一开始就引入，并随着新有界上下文的添加和现有上下文的修改而更新。\n\n由于上下文映射可能包含来自多个团队工作的信息，最好将上下文映射的维护定义为共同努力：每个团队负责更新其与其他有界上下文的集成。\n\
  \n上下文映射可以用像 Context Mapper 这样的工具作为代码进行管理和维护。\n\n#### 限制\n\n需要注意的是，绘制上下文映射可能是一项具有挑战性的任务。当系统的有界上下文涵盖多个子域时，可能存在多种集成模式。例如，在图\
  \ 4-9 中，你可以看到两个有界上下文具有两种集成模式：合作伙伴关系和反腐败层。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_100_0.png)\n\
  \n图 4-9. 复杂的上下文映射\n\n而且，即使有界上下文仅限于单个子域，仍然可能存在多种集成模式——例如，如果子域的模块需要不同的集成策略。\n\n###\
  \ 结论\n\n有界上下文并非独立。它们必须相互交互。以下模式定义了有界上下文可以集成的不同方式：\n\n*Partnership*\n\n有界上下文以临时方式集成。\n\
  \n*Shared kernel*\n\n两个或多个有界上下文通过共享一个属于所有参与有界上下文的有限重叠模型进行集成。\n\n*Conformist*\n\n\
  消费者遵循服务提供商的模型。\n\n*Anticorruption layer*\n\n消费者将服务提供商的模型翻译成适合消费者需求的模型。\n\n*Open-host\
  \ service*\n\n服务提供商实现发布语言——一个针对消费者需求优化的模型。\n\n*Separate ways*\n\n重复特定功能比协作和集成它更便宜。\n\
  \n有界上下文之间的集成可以绘制在上下文映射上。此工具提供了对系统高层设计、沟通模式和组织问题的洞察。\n\n现在你已经了解了用于分析和建模业务域的领域驱动设计工具和技术，我们将从战略转向战术。在第二部分，你将学习实现领域逻辑、组织高层架构以及协调系统组件之间通信的不同方法。\n\
  \n## 练习\n\n+   1. 哪个集成模式永远不应该用于核心子域？\n+   a. Shared kernel\n+   b. Open-host service\n\
  +   c. Anticorruption layer\nd. Separate ways\n\n2. 哪个下游子域更可能实现反腐败层？\n+   a. Core\
  \ subdomain\n+   b. Supporting subdomain\n+   c. Generic subdomain\n+   d. B and\
  \ C\n\n3. 哪个上游子域更可能实现开放主机服务？\n+   a. Core subdomain\n+   b. Supporting subdomain\n\
  +   c. Generic subdomain\n+   d. A and B\n\n4. 哪个集成模式，从某种意义上说，违反了有界上下文的所有权边界？\n\
  +   a. Partnership.\n+   b. Shared kernel.\n+   c. Separate ways.\n+   d. No integration\
  \ pattern should ever break the bounded contexts’ ownership boundaries.\n"
- '# Part II. 战术设计


  在第一部分，我们讨论了软件的“是什么”和“为什么”：你学习了分析业务域、识别子域及其战略价值，并将业务域知识转化为有界上下文的设计——软件组件实现业务域的不同模型。


  在本书记中，我们将从战略转向战术：软件设计的“如何”：


  - 在第 5 章至第 7 章中，你将学习业务逻辑实现模式，使代码能够使用其有界上下文的通用语言说话。第 5 章介绍了两种适应相对简单业务逻辑的模式：事务脚本和活动记录。第
  6 章转向更具挑战性的案例并介绍领域模型模式：DDD 实现复杂业务逻辑的方式。在第 7 章中，你将学习通过对时间维度的建模来扩展领域模型模式。

  - 在第 8 章中，我们将探讨组织有界上下文架构的不同方式：分层架构、端口与适配器以及 CQRS 模式。你将学习每种架构模式的精髓以及在何种情况下应使用每种模式。

  - 第 9 章将讨论编排系统组件之间交互的技术问题和实现策略。你将学习支持有界上下文实现




  集成模式，如何实现可靠的消息发布，以及定义复杂、跨组件工作流的模式。

  '
- "## 第 5 章. 实现简单的业务逻辑\n\n业务逻辑是软件中最重要的一部分。它是软件首先被实现的原因。一个系统的用户界面可以很性感，其数据库可以极快且可扩展。但如果软件对业务没有用处，它只不过是一个昂贵的科技演示。\n\
  \n正如我们在第 2 章中所看到的，并非所有业务子域都是一样的。不同的子域具有不同的战略重要性和复杂性。本章开始我们探索建模和实现业务逻辑代码的不同方式。我们将从两种适用于相对简单业务逻辑的模式开始：事务脚本和活动记录。\n\
  \n### 事务脚本\n\n> 按过程组织业务逻辑，其中每个过程处理来自表示层的单个请求。\n> —Martin Fowler¹\n\n系统的公共接口可以被视为消费者可以执行的业务事务集合，如图\
  \ 5-1 所示。这些事务可以检索系统管理的的信息、修改它，或两者兼而有之。该模式基于过程组织系统的业务逻辑，其中每个过程实现由系统的消费者通过其公共接口执行的运算。实际上，系统的公共操作被用作封装边界。\n\
  \n![](img/b742a71dea5d5dd509847f82600a6ad1_106_0.png)\n\n图 5-1. 事务脚本接口\n\n### 实现\n\
  \n每个过程都实现为一个简单、直接的过程脚本。它可以使用一个用于与存储机制集成的薄抽象层，但也可以直接访问数据库。\n\n过程必须满足的唯一要求是事务行为。每个操作都应该成功或失败，但绝不能导致无效状态。即使事务脚本的执行在最不方便的时刻失败，系统也应保持一致——要么通过回滚失败前所做的任何更改，要么通过执行补偿操作。事务行为反映在该模式的名称中：事务脚本。\n\
  \n下面是一个将一批 JSON 文件转换为 XML 文件的事务脚本示例：\n\n```\nDB.StartTransaction();\n\nvar job =\
  \ DB.LoadNextJob();\nvar json = LoadFile(job.Source);\nvar xml = ConvertJsonToXml(json);\n\
  WriteFile(job.Destination, xml.ToString());\nDB.MarkJobAsCompleted(job);\n\nDB.Commit()\n\
  ```\n\n#### 没那么容易！\n\n当我在领域驱动设计课程中介绍事务脚本模式时，我的学生们常常会扬起眉毛，有些人甚至会问：“这值得我们花时间吗？我们不是来学习更高级的模式和技术吗？”\n\
  \n问题是，事务脚本模式是你在即将到来的章节中将学习的更高级业务逻辑实现模式的*基础*。此外，尽管它看似简单，但它是很容易做错的模式。我曾经帮助调试和修复的许多生产问题，以一种或另一种方式，往往归结为系统业务逻辑事务行为的错误实现。\n\
  \n让我们看一下由于未能正确实现事务脚本而导致数据损坏的三个常见、真实的例子。\n\n#### 缺乏事务行为\n\n未能实现事务行为的一个简单例子是，在没有总体事务的情况下发出多个更新。考虑以下更新\
  \ Users 表中的记录并向 VisitsLog 表中插入记录的方法：\n\n```\n01 public class LogVisit\n02 {\n03\
  \     ...\n04\n05     public void Execute(Guid userId, DateTime visitedOn)\n06 \
  \    {\n07         _db.Execute(\"UPDATE Users SET last_visit=@p1 WHERE user_id=@p2\"\
  ,\n08             visitedOn, userId);\n09         _db.Execute(@\"INSERT INTO VisitsLog(user_id,\
  \ visit_date) VALUES(@p1, @p2)\", userId, visitedOn);\n10     }\n11 }\n12 }\n```\n\
  \n如果在 Users 表中的记录被更新（第 7 行）之后，但在第 9 行的日志记录附加成功之前出现任何问题，系统将处于不一致状态。Users 表将被更新，但\
  \ VisitsLog 表中不会写入相应的记录。问题可能由任何原因引起，从网络中断到数据库超时或死锁，甚至是执行该进程的服务器崩溃。\n\n这可以通过引入涵盖两个数据更改的适当事务来修复：\n\
  \n```\npublic class LogVisit\n{\n    ...\n    public void Execute(Guid userId, DateTime\
  \ visitedOn)\n    {\n        try\n        {\n            _db.StartTransaction();\n\
  \n            _db.Execute(@\"UPDATE Users SET last_visit=@p1 WHERE user_id=@p2\"\
  , visitedOn, userId);\n\n            _db.Execute(@\"INSERT INTO VisitsLog(user_id,\
  \ visit_date) VALUES(@p1, @p2)\", userId, visitedOn);\n\n            _db.Commit();\n\
  \        } catch {\n            _db.Rollback();\n            throw;\n        }\n\
  \    }\n}\n```\n\n由于关系数据库对跨多个记录的事务有原生支持，因此修复很容易实现。当你必须在不支持多记录事务的数据库中发出多个更新时，或者当你使用多个无法统一到分布式事务中的存储机制时，事情会变得更复杂。让我们看一个后者的例子。\n\
  \n#### 分布式事务\n\n在现代分布式系统中，常见的做法是对数据库中的数据进行更改，然后通过将消息发布到消息总线来通知系统其他组件有关更改。考虑在前一个示例中，我们不是将访问记录到表中，而是将其发布到消息总线：\n\
  \n```\n01 public class LogVisit\n02 {\n03     ...\n04\n05     public void Execute(Guid\
  \ userId, DateTime visitedOn)\n06     {\n07         _db.Execute(\"UPDATE Users SET\
  \ last_visit=@p1 WHERE user_id=@p2\",\n08                     visitedOn,userId);\n\
  09         _messageBus.Publish(\"VISITS_TOPIC\",\n10                         new\
  \ { UserId = userId, VisitDate = visitedOn });\n11     }\n12 }\n```\n\n与前一个示例一样，任何在第\
  \ 7 行之后但在第 9 行成功之前发生的故障都会破坏系统的状态。Users 表将被更新，但由于发布到消息总线失败，其他组件不会收到通知。\n\n不幸的是，修复这个问题并不像前一个示例那么容易。跨多个存储机制的分布式事务复杂、难以扩展、容易出错，因此通常会被避免。在第\
  \ 8 章中，你将学习如何使用 CQRS 架构模式来填充多个存储机制。此外，第 9 章将介绍 outbox 模式，该模式可在将更改提交到另一个数据库后实现可靠的消息发布。\n\
  \n让我们看一个事务行为实现不当的更复杂的例子。\n\n#### 隐式分布式事务\n\n考虑以下看似简单的方法：\n\n```\npublic class LogVisit\n\
  {\n    ...\n    public void Execute(Guid userId)\n    {\n        _db.Execute(\"\
  UPDATE Users SET visits=visits+1 WHERE user_id=@p1\",\n                    userId);\n\
  \    }\n}\n```\n\n与前面的示例不同，此方法不是跟踪最后访问日期，而是为每个用户维护一个访问计数器。调用该方法会将相应计数器的值增加 1。该方法所做的只是更新一个表中的一个值，位于一个数据库中。然而，这仍然是一个分布式事务，可能导致不一致的状态。\n\
  \n此示例构成分布式事务，因为它与数据库和调用该方法的外部进程进行通信，如图 5-2 所示。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_111_0.png)\n\
  \n图 5-2. LogVisit 操作更新数据并通知调用者操作的成功或失败\n\n尽管 execute 方法的类型为 void，即它不返回任何数据，但它仍然传达操作是否成功或失败：如果失败，调用者将收到异常。如果方法成功，但将结果传达给调用者失败会怎样？例如：\n\
  \n- 如果 LogVisit 是 REST 服务的一部分并且发生网络中断；或\n- 如果 LogVisit 和调用者都在同一进程中运行，但进程在调用者跟踪 LogVisit\
  \ 操作成功执行之前失败？\n\n在两种情况下，消费者都会假设失败并尝试再次调用 LogVisit。再次执行 LogVisit 逻辑将导致计数器值不正确增加。总体而言，它将增加\
  \ 2 而不是 1。与前两个示例一样，代码未能正确实现事务脚本模式，并无意中导致系统状态损坏。\n\n与前一个示例一样，这个问题没有简单的修复方法。一切都取决于业务域及其需求。在此特定示例中，确保事务行为的一种方法是使操作幂等：即即使操作重复多次也能导致相同的结果。\n\
  \n例如，我们可以要求消费者传递计数器的值。为了提供计数器的值，调用者首先必须读取当前值，在本地增加它，然后提供\n\n\n\n作为参数。即使操作会被执行多次，也不会改变最终结果：\n\
  \n```\npublic class LogVisit\n{\n    ...\n    public void Execute(Guid userId, long\
  \ visits)\n    {\n        _db.Execute(\"UPDATE Users SET visits = @p1 WHERE user_id=@p2\"\
  , visits, userId);\n    }\n}\n```\n\n另一种解决此类问题的方法是使用乐观并发控制：在调用 LogVisit 操作之前，调用方已读取计数器的当前值并将其作为参数传递给\
  \ LogVisit。LogVisit 仅在计数器的值等于调用方最初读取的值时才更新计数器：\n\n```\npublic class LogVisit\n{\n\
  \    ...\n    public void Execute(Guid userId, long expectedVisits)\n    {\n   \
  \     _db.Execute(@\"UPDATE Users SET visits=visits+1 WHERE user_id=@p1 and visits\
  \ = @p2\", userId, visits);\n    }\n}\n```\n\n使用相同的输入参数后续执行 LogVisit 不会改变数据，因为 WHERE...visits\
  \ = @prm2 条件将无法满足。\n\n### 何时使用事务脚本\n\n事务脚本模式非常适合最直接的问题域，其中业务逻辑类似于简单的过程操作。例如，在提取-转换-加载（ETL）操作中，每个操作从源提取数据，应用转换逻辑将其转换为另一种形式，并将结果加载到目标存储中。该过程如图\
  \ 5-3 所示。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_113_0.png)\n\n图 5-3. 提取-转换-加载数据流\n\
  \n事务脚本模式自然适合支持子域，其中根据定义，业务逻辑是简单的。它也可以用作与外部系统集成的适配器——例如，通用子域，或作为反腐败层的一部分（更多内容请参见第\
  \ 9 章）。\n\n事务脚本模式的主要优点是其简单性。它引入了最少的抽象，并在运行时性能和理解业务逻辑方面都将开销降至最低。也就是说，这种简单性也是该模式的缺点。随着业务逻辑变得越复杂，它越容易在事务中重复业务逻辑，从而导致不一致的行为——当重复的代码不同步时。因此，事务脚本绝不应用于核心子域，因为该模式无法应对核心子域业务逻辑的高复杂性。\n\
  \n这种简单性让事务脚本赢得了一个可疑的名声。有时该模式甚至被视为反模式。毕竟，如果复杂的业务逻辑被实现为事务脚本，迟早它会变成一个难以维护的大泥球。需要注意的是，尽管简单，事务脚本模式在软件开发中无处不在。我们将在本章和后续章节中讨论的所有业务逻辑实现模式，以一种或另一种方式都基于事务脚本模式。\n\
  \n#### 活动记录\n\n> 一个包装数据库表或视图中一行的对象，封装数据库访问，并在该数据上添加领域逻辑。\n> \n> —Martin Fowler²\n\
  \n与事务脚本模式一样，活动记录支持业务逻辑简单的场景。这里，业务逻辑可能操作更复杂的数据结构。例如，我们可以拥有更复杂的对象树和层次结构，如图 5-4 所示。\n\
  \n![](img/b742a71dea5d5dd509847f82600a6ad1_114_0.png)\n\n通过简单的事务脚本操作此类数据结构会导致大量重复代码。数据的内存表示映射会在各处重复。\n\
  \n### 实现\n\n因此，该模式使用专用对象，即活动记录，来表示复杂的数据结构。除了数据结构之外，这些对象还实现了用于创建、读取、更新和删除记录的数据访问方法——即所谓的\
  \ CRUD 操作。因此，活动记录对象与对象关系映射（ORM）或其他数据访问框架耦合。该模式的名称源于每个数据结构都是“活动的”；也就是说，它实现了数据访问逻辑。\n\
  \n与前一个模式一样，系统的业务逻辑以事务脚本组织。两者的区别在于，在这种情况下，事务脚本不是直接访问数据库，而是操作活动记录对象。操作完成后，必须作为原子事务完成或失败：\n\
  \n```\npublic class CreateUser\n{\n    ...\n\n    public void Execute(userDetails)\n\
  \    {\n        try\n        {\n            _db.StartTransaction();\n\n        \
  \    var user = new User();\n            user.Name = userDetails.Name;\n       \
  \     user.Email = userDetails.Email;\n            user.Save();\n\n            _db.Commit();\n\
  \        } catch {\n            _db.Rollback();\n            throw;\n        }\n\
  \    }\n}\n```\n\n该模式的目标是封装将内存中对象映射到数据库模式的复杂性。除了负责持久化之外，活动记录对象还可以包含业务逻辑；例如，验证分配给字段的新值，甚至实现操作对象数据的业务相关过程。也就是说，活动记录对象的显著特征是数据结构和行为（业务逻辑）的分离。通常，活动记录的字段具有公共的\
  \ getter 和 setter，允许外部过程修改其状态。\n\n#### 何时使用活动记录\n\n由于活动记录本质上是优化数据库访问的事务脚本，因此该模式只能支持相对简单的业务逻辑，例如\
  \ CRUD 操作，最多验证用户输入。\n\n因此，与事务脚本模式的情况一样，活动记录模式适用于支持子域、外部解决方案的通用子域集成或模型转换任务。两者的区别在于，活动记录解决了将复杂数据结构映射到数据库模式的复杂性。\n\
  \n活动记录模式也被称为 *贫血领域模型反模式*；换句话说，是设计不当的领域模型。我更喜欢避免 *贫血* 和 *反模式* 这一类负面含义。该模式是一种工具。就像任何工具一样，它可以解决问题，但在错误的环境中使用时也可能造成比好处更大的危害。当业务逻辑简单时，使用活动记录并没有什么问题。此外，在实现简单业务逻辑时使用更复杂的模式也会造成危害，因为会引入偶然复杂性。在下一章中，你将学习什么是领域模型以及它与活动记录模式有何不同。\n\
  \n### 注意\n\n必须强调的是，在此上下文中，*活动记录* 指的是设计模式，而不是 Active Record 框架。该模式名称由 Martin Fowler\
  \ 在 *Patterns of Enterprise Application Architecture* 中提出。框架后来出现，作为实现该模式的一种方式。在我们的上下文中，我们讨论的是设计模式及其背后的概念，而不是特定的实现。\n\
  \n### 务实一点\n\n尽管业务数据很重要，我们设计和构建的代码应保护其完整性，但在某些情况下，务实的方法更可取。\n\n尤其是在高规模水平下，有时可以放宽数据一致性保证。检查\
  \ 100 万条记录中损坏一条记录是否真的对业务是致命的，以及它是否会负面影响业务的性能和盈利能力。例如，假设你正在构建一个系统，每天从物联网设备摄取数十亿事件。如果\
  \ 0.001% 的事件被重复或丢失，是大问题吗？\n\n正如 always 所说，没有普世法则。一切都取决于你所工作的业务域。在可能的情况下“走捷径”是可以的；只要确保你评估了风险和业务影响。\n\
  \n### 结论\n\n在本章中，我们介绍了两种实现业务逻辑的模式：\n\n*Transaction script*\n\n\n\n\n\n这种模式将系统的操作组织为简单、直接的程序化脚本。流程确保每个操作都是事务性的——要么成功，要么失败。事务脚本模式很适合支持子域，其业务逻辑类似于简单、类似\
  \ ETL 的操作。\n\n#### 活动记录\n\n当业务逻辑简单但操作的是复杂的数据结构时，你可以将这些数据结构实现为活动记录。活动记录对象是一个提供简单\
  \ CRUD 数据访问方法的数据结构。\n\n本章讨论的两种模式都面向业务逻辑相对简单的场景。在下一章中，我们将转向更复杂的业务逻辑，并讨论如何使用领域模型模式来应对这种复杂性。\n\
  \n## 练习\n\n- 1. 应该使用哪种讨论过的模式来实现核心子域的业务逻辑？\n  - a. 事务脚本。\n  - b. 活动记录。\n  - c. 这两种模式都不能用于实现核心子域。\n\
  \  - d. 这两种模式都可用于实现核心子域。\n- 2. 考虑以下代码：\n\n```\npublic void CreateTicket(TicketData\
  \ data)\n{\n    var agent = FindLeastBusyAgent();\n\n    agent.ActiveTickets = agent.ActiveTickets\
  \ + 1;\n    agent.Save();\n\n    var ticket = new Ticket();\n    ticket.Id = Guid.New();\n\
  \    ticket.Data = data;\n    ticket.AssignedAgent = agent;\n    ticket.Save();\n\
  \n    _alerts.Send(agent, \"You have a new ticket!\");\n}\n```\n\n假设没有高级事务机制，这里可以发现哪些潜在的数据一致性问题？\n\
  \n- a. 在收到新工单时，被分配代理的活跃工单计数可能会增加超过 1。\n- b. 代理的活跃工单计数可能会增加 1，但代理不会被分配任何新工单。\n- c.\
  \ 代理可能会收到新工单，但不会被通知。\n- d. 以上所有问题都有可能。\n\n3. 在前面的代码中，还有至少一个可能破坏系统状态的边缘情况。你能发现它吗？\n\
  \n4. 回到书前言中 WolfDesk 的例子，系统的哪些部分可能被实现为事务脚本或活动记录？\n\n- 1 Fowler, M. (2002). *Patterns\
  \ of Enterprise Application Architecture*. Boston: Addison-Wesley.\n- 2 Fowler,\
  \ M. (2002). *Patterns of Enterprise Application Architecture*. Boston: Addison-Wesley.\n"
- "## 第 6 章. 应对复杂的业务逻辑\n\n上一章讨论了两种处理相对简单业务逻辑的模式：事务脚本和活动记录。本章继续业务逻辑实现的话题，并介绍一种面向复杂业务逻辑的模式：领域模型模式。\n\
  \n#### 历史\n\n与事务脚本和活动记录模式一样，领域模型模式最初也是在 Martin Fowler 的书 *Patterns of Enterprise\
  \ Application Architecture* 中引入的。Fowler 在对该模式的讨论结尾时说：“Eric Evans 目前正在撰写一本关于构建领域模型的书。”\
  \ 所引用的书籍是 Evans 的开创性著作，*Domain-Driven Design: Tackling Complexity in the Heart of\
  \ Software.*\n\n在他的书中，Evans 提出了一组旨在紧密关联代码与业务域底层模型的模式：聚合、值对象、仓储等。这些模式紧密跟随 Fowler\
  \ 在其书中未竟之处，并类似于实现领域模型模式的有效工具集。\n\nEvans 引入的模式通常被称为 *战术领域驱动设计*。为消除时间限制的混淆，33% 的时间限制。\n\
  - 如果代理在响应时间限制的 50% 内未打开升级的工单，则工单会自动重新分配给不同的代理。\n- 如果客户在七天内未回复代理的问题，工单将自动关闭。\n- 升级的工单不能自动关闭或由代理关闭，只能由客户或代理的经理关闭。\n\
  - 客户只能在工单关闭过去七天内重新打开已关闭的工单。\n\n这些需求形成了一个相互纠缠的依赖网，涉及不同的规则，所有这些规则都影响着支持工单的生命周期管理逻辑。这不是我们在上一章讨论的\
  \ CRUD 数据录入屏幕。尝试使用活动记录对象实现此逻辑将很容易导致逻辑重复，并通过错误实现某些业务规则来破坏系统状态。\n\n### 实现\n\n领域模型是域的对象模型，融合了行为和数据。¹\
  \ DDD 的战术模式——聚合、值对象、领域事件和领域服务——是这种对象模型的构建块。²\n\n所有这些模式都有一个共同主题：它们将业务逻辑放在首位。让我们看看领域模型如何解决不同的设计问题。\n\
  \n### 复杂性\n\n域的业务逻辑本身就很复杂，因此用于建模的对象的设计不应引入任何额外的偶然复杂性。模型应不包含任何基础设施或技术方面的关注点，例如对数据库或其他系统外部组件的调用。这种限制要求模型的对象为\
  \ *普通对象*，即实现业务逻辑而不依赖或直接包含任何基础设施组件或框架的对象。³\n\n### 通用语言\n\n对业务逻辑而非技术关注点的强调，使得领域模型的对象更容易遵循有界上下文的通用语言的术语。换句话说，该模式允许代码“说”通用语言并遵循领域专家的心智模型。\n\
  \n### 构建块\n\n让我们看看 DDD 提供的核心领域模型构建块，或战术模式：值对象、聚合和领域服务。\n\n#### 值对象\n\n值对象是可以根据其值的组合来识别的对象。例如，考虑一个颜色对象：\n\
  \n```\nclass Color\n{\n    int _red;\n    int _green;\n    int _blue;\n}\n```\n\n\
  三个字段 red、green 和 blue 的值的组合定义了一种颜色。更改其中一个字段的值将导致产生新的颜色。没有任何两种颜色可以具有相同的值。此外，同一颜色的两个实例必须具有相同的值。因此，不需要显式的标识字段来识别颜色。\n\
  \n图 6-1 中显示的 ColorId 字段不仅是冗余的，而且实际上为错误打开了大门。你可以创建两行具有相同 red、green、blue 值的数据，但比较\
  \ ColorId 的值不会反映出这其实是相同的颜色。\n\n\n\n\n\n### Colors\n\n| color-id | red | green |\
  \ blue |\n|---|---|---|---|\n| 1 | 255 | 255 | 0 |\n| 2 | 0 | 128 | 128 |\n| 3 |\
  \ 0 | 0 | 255 |\n| 4 | 0 | 0 | 255 |\n\nFigure 6-1. Redundant ColorId field, making\
  \ it possible to have two rows with the same values\n\n### Ubiquitous language\n\
  \nRelying exclusively on the language’s standard library’s primitive data types—such\
  \ as strings, integers, or dictionaries—to represent concepts of the business domain\
  \ is known as the primitive obsession⁴ code smell. For example, consider the following\
  \ class:\n\n```\nclass Person\n{\n    private int    _id;\n    private string _firstName;\n\
  \    private string _lastName;\n    private string _landlinePhone;\n    private\
  \ string _mobilePhone;\n    private string _email;\n    private int    _heightMetric;\n\
  \    private string _countryCode;\n\n    public Person(...) {...}\n}\n\nstatic void\
  \ Main(string[] args)\n{\n    var dave = new Person(\n        id: 30217,\n     \
  \   firstName: \"Dave\",\n        lastName: \"Ancelovici\",\n        landlinePhone:\
  \ \"023745001\",\n        mobilePhone: \"0873712503\",\n        email: \"dave@learning-ddd.com\"\
  ,\n        heightMetric: 180,\n        countryCode: \"BG\");\n}\n```\n\nIn the preceding\
  \ implementation of the Person class, most of the values are of type String and\
  \ they are assigned based on convention. For example, the input to the landlinePhone\
  \ should be a valid landline phone number, and the countryCode should be a valid,\
  \ two-letter, uppercased country code. Of course, the system cannot trust the user\
  \ to always supply correct values, and as a result, the class has to validate all\
  \ input fields.\n\nThis approach presents multiple design risks. First, the validation\
  \ logic tends to be duplicated. Second, it’s hard to enforce calling the validation\
  \ logic before the values are used. It will become even more challenging in the\
  \ future, when the codebase will be evolved by other engineers.\n\nCompare the following\
  \ alternative design of the same object, this time leveraging value objects:\n\n\
  ```\nclass Person {\n    private PersonId   _id;\n    private Name       _name;\n\
  \    private PhoneNumber _landline;\n    private PhoneNumber _mobile;\n    private\
  \ EmailAddress _email;\n    private Height     _height;\n    private CountryCode\
  \ _country;\n\n    public Person(...) { ... }\n}\n```\n\n```\nstatic void Main(string[]\
  \ args)\n{\n    var dave = new Person(\n        id:      new PersonId(30217),\n\
  \        name:    new Name(\"Dave\", \"Ancelovici\"),\n        landline: PhoneNumber.Parse(\"\
  023745001\"),\n        mobile:  PhoneNumber.Parse(\"0873712503\"),\n        email:\
  \   Email.Parse(\"dave@learning-ddd.com\"),\n        height:  Height.FromMetric(180),\n\
  \        country: CountryCode.Parse(\"BG\");\n    }\n}\n```\n\nFirst, notice the\
  \ increased clarity. Take, for example, the country variable. There is no need to\
  \ elaborately call it “countryCode” to communicate the intent of it holding a country\
  \ code and not, for example, a full country name. The value object makes the intent\
  \ clear, even with shorter variable names.\n\nSecond, there is no need to validate\
  \ the values before the assignment, as the validation logic resides in the value\
  \ objects themselves. However, a value object’s behavior is not limited to mere\
  \ validation. Value objects shine brightest when they centralize the business logic\
  \ that manipulates the values. The cohesive logic is implemented in one place and\
  \ is easy to test. Most importantly, value objects express the business domain’s\
  \ concepts: they make the code speak the ubiquitous language.\n\nLet’s see how representing\
  \ the concepts of height, phone numbers, and colors as value objects makes the resultant\
  \ type system rich and intuitive to use.\n\nCompared to an integer-based value,\
  \ the Height value object both makes the intent clear and decouples the measurement\
  \ from a specific measurement unit. For example, the Height value object can be\
  \ initialized using both metric and imperial units, making it easy to convert from\
  \ one unit to another, generating string representation, and comparing values of\
  \ different units:\n\n```\nvar heightMetric = Height.Metric(180);\nvar heightImperial\
  \ = Height.Imperial(5, 3);\n\nvar string1 = heightMetric.ToString();        // \"\
  180cm\"\nvar string2 = heightImperial.ToString();        // \"5 feet 3 inches\"\n\
  var string3 = heightMetric.ToImperial().ToString(); // \"5 feet 11 inches\"\n\n\
  var firstIsHigher = heightMetric > heightImperial; // true\n```\n\nThe PhoneNumber\
  \ value object can encapsulate the logic of parsing a string value, validating it,\
  \ and extracting different attributes of the phone number; for example, the country\
  \ it belongs to and the phone number’s type—landline or mobile:\n\n```\nvar phone\
  \ = PhoneNumber.Parse(\"+359877123503\");\nvar country = phone.Country;        \
  \            // \"BG\"\nvar phoneType = phone.PhoneType;                // \"MOBILE\"\
  \nvar isValid = PhoneNumber.IsValid(\"+972120266680\"); // false\n```\n\nThe following\
  \ example demonstrates the power of a value object when it encapsulates all of the\
  \ business logic that manipulates the data and produces new instances of the value\
  \ object:\n\n```\nvar red = Color.FromRGB(255, 0, 0);\nvar green = Color.Green;\n\
  var yellow = red.MixWith(green);\nvar yellowString = yellow.ToString();        \
  \    // \"#FFFF00\"\n```\n\nAs you can see in the preceding examples, value objects\
  \ eliminate the need for conventions—for example, the need to keep in mind that\
  \ this string is an email and the other string is a phone number—and instead makes\
  \ using the object model less error prone and more intuitive.\n\n### Implementation\n\
  \nSince a change to any of the fields of a value object results in a different value,\
  \ value objects are implemented as immutable objects. A change to one of the value\
  \ object’s fields conceptually creates a different value—a different instance of\
  \ a value object. Therefore, when an executed action results in a new value, as\
  \ in the following case, which uses the MixWith method, it doesn't modify the original\
  \ instance but instantiates and returns a new one:\n\n```\npublic class Color\n\
  {\n    public readonly byte Red;\n    public readonly byte Green;\n    public readonly\
  \ byte Blue;\n\n    public Color(byte r, byte g, byte b)\n    {\n        this.Red\
  \ = r;\n        this.Green = g;\n        this.Blue = b;\n    }\n\n    public Color\
  \ MixWith(Color other)\n    {\n        return new Color(\n            r: (byte)\
  \ Math.Min(this.Red + other.Red, 255),\n            g: (byte) Math.Min(this.Green\
  \ + other.Green, 255),\n            b: (byte) Math.Min(this.Blue + other.Blue, 255)\n\
  \        );\n    }\n\n    ...\n}\n```\n\nSince the equality of value objects is\
  \ based on their values rather than on an id field or reference, it's important\
  \ to override and properly implement the equality checks. For example, in C#:⁵\n\
  \n```\npublic class Color\n{\n    ...\n\n    public override bool Equals(object\
  \ obj)\n    {\n        var other = obj as Color;\n        return other != null &&\n\
  \            this.Red == other.Red &&\n            this.Green == other.Green &&\n\
  \            this.Blue == other.Blue;\n    }\n\n    public static bool operator\
  \ == (Color lhs, Color rhs)\n    {\n        if (Object.ReferenceEquals(lhs, null))\
  \ {\n            return Object.ReferenceEquals(rhs, null);\n        }\n        return\
  \ lhs.Equals(rhs);\n    }\n\n    public static bool operator != (Color lhs, Color\
  \ rhs)\n    {\n        return !(lhs == rhs);\n    }\n\n    public override int GetHashCode()\n\
  \    {\n        return ToString().GetHashCode();\n    }\n\n    ...\n}\n```\n\nAlthough\
  \ using a core library’s Strings to represent domain-specific values contradicts\
  \ the notion of value objects, in .NET, Java, and other languages the string type\
  \ is implemented exactly as a value object. Strings are immutable, as all operations\
  \ result in a new instance. Moreover, the string type encapsulates a rich behavior\
  \ that creates new instances by manipulating the values of one or more strings:\
  \ trim, concatenate multiple strings, replace characters, substring, and other methods.\n\
  \n### When to use value objects\n\nThe simple answer is, whenever you can. Not only\
  \ do value objects make the code more expressive and encapsulate business logic\
  \ that tends to spread apart, but the pattern makes the code safer. Since value\
  \ objects are immutable, the value objects’ behavior is free of side effects and\
  \ is thread safe.\n\n\n\n\n\n从业务领域视角来看，一个有用的经验法则是：对于描述其他对象属性的领域元素，使用值对象。这主要适用于实体的属性，这些将在下一节中讨论。你之前看到的示例使用了值对象来描述一个人，包括其\
  \ ID、姓名、电话号码、电子邮件等。使用值对象的其他示例包括各种状态、密码，以及更多可通过其值识别且因此不需要显式标识字段的特定于业务领域的概念。引入值对象的一个特别重要的机会是在建模货币和其他货币值时。依赖原始类型来表示货币不仅限制了你将所有与货币相关的业务逻辑封装在一个地方的能力，而且还经常导致危险的错误，例如舍入错误和其他精度相关问题。\n\
  \n### 实体\n\n*实体* 是值对象的对立面。它需要一个显式的标识字段来区分实体的不同实例。实体的一个简单示例是人。考虑以下类：\n\n```\nclass\
  \ Person\n{\n    public Name Name { get; set; }\n\n    public Person(Name name)\n\
  \    {\n        this.Name = name;\n    }\n}\n```\n\n该类只包含一个字段：name（一个值对象）。然而，这种设计并不理想，因为不同的人可以同名，并且可以拥有完全相同的姓名。那当然并不意味着他们是同一个人。因此，需要一个标识字段来正确识别个人：\n\
  \n```\nclass Person\n{\n    public readonly PersonId Id;\n    public Name Name {\
  \ get; set; }\n\n    public Person(PersonId id, Name name)\n    {\n        this.Id\
  \ = id;\n        this.Name = name;\n    }\n}\n```\n\n在前面的代码中，我们引入了类型为 PersonId 的标识字段\
  \ Id。PersonId 是一个值对象，它可以使用适合业务领域需求的任何底层数据类型。例如，Id 可以是 GUID、数字、字符串，或特定于领域的价值，例如社会安全号码。\n\
  \n标识字段的核心要求是它应为实体的每个实例唯一：就我们而言，每个人的实例（图 6-2）。此外，除了极其罕见的例外之外，实体标识字段的值应在实体的生命周期内保持不变。这引出了值对象与实体之间的第二个概念差异。\n\
  \n![](img/b742a71dea5d5dd509847f82600a6ad1_132_0.png)\n\n图 6-2. 引入显式的标识字段，允许区分对象的实例，即使所有其他字段的值相同\n\
  \n与值对象相反，实体不是不可变的，并且预期会发生变化。实体与值对象之间的另一个区别是，值对象描述实体的属性。本章前面你看到了实体 Person 的示例，它有两个值对象来描述每个实例：PersonId\
  \ 和 Name。\n\n实体是任何业务领域的必备构建块。也就是说，你可能注意到本章前面我没有在领域模型的构建块列表中包含“实体”。这不是一个错误。省略“实体”的原因是我们不会独立实现实体，而只是在聚合模式的上下文中实现。\n\
  \n### 聚合\n\n聚合是一个实体：它需要一个显式的标识字段，其状态在实例生命周期内预期会发生变化。然而，它远不止是一个实体。该模式的目标是保护其数据的一致性。由于聚合的数据是可变的，因此该模式必须解决一些影响和挑战，以始终保持其状态一致。\n\
  \n#### 一致性强制\n\n由于聚合的状态可以被修改，因此为其数据被破坏提供了多种方式。为了强制数据一致性，聚合模式在聚合与其外部范围之间划清了明确的边界：聚合是一个一致性强制边界。聚合的逻辑必须验证所有传入的修改，并确保更改不会与其业务规则矛盾。\n\
  \n从实现角度来看，一致性是通过只允许聚合的业务逻辑修改其状态来强制执行的。所有聚合外部的过程或对象仅允许读取聚合的状态。它的状态只能通过执行聚合公共接口的相应方法来修改。\n\
  \n作为聚合公共接口公开的状态修改方法通常被称为命令，如“执行某事的命令”。命令可以以两种方式实现。首先，它可以实现为聚合对象的普通公共方法：\n\n```\n\
  public class Ticket\n{\n    ...\n    public void AddMessage(UserId from, string\
  \ body)\n    {\n        var message = new Message(from, body);\n        _messages.Append(message);\n\
  \    }\n    ...\n}\n```\n\n或者，命令可以表示为参数对象，该对象封装了执行命令所需的所有输入：\n\n```\npublic class\
  \ Ticket\n{\n    ...\n    public void Execute(AddMessage cmd)\n    {\n        var\
  \ message = new Message(cmd.from, cmd.body);\n        _messages.Append(message);\n\
  \    }\n    ...\n}\n```\n\n命令在聚合代码中如何表达是个人偏好问题。我更喜欢更明确地定义命令结构并以多态方式将其传递给相关 Execute\
  \ 方法的方式。\n\n聚合的公共接口负责验证输入并强制执行所有相关的业务规则和不变量。这种严格的边界也确保了与聚合相关的所有业务逻辑都实现在一个地方：聚合本身。\n\
  \n这使得编排聚合操作的应用程序层⁶ 变得相当简单：⁷ 它所要做的只是加载聚合的当前状态，执行所需的操作，持久化修改后的状态，并将操作结果返回给调用者：\n\n\
  ```\n01 public ExecutionResult Escalate(TicketId id, EscalationReason reason)\n\
  02 {\n03     try\n04     {\n05         var ticket = _ticketRepository.Load(id);\n\
  06         var cmd = new Escalate(reason);\n07         ticket.Execute(cmd);\n08\
  \         _ticketRepository.Save(ticket);\n09         return ExecutionResult.Success();\n\
  10     }\n11     catch (ConcurrencyException ex)\n12     {\n13         return ExecutionResult.Error(ex);\n\
  14     }\n15 }\n```\n\n请注意前述代码中的并发检查（第 11 行）。保护聚合状态的一致性至关重要。⁸ 如果多个进程并发更新同一个聚合，我们必须防止后一个事务盲目覆盖第一个事务提交的更改。在这种情况下，第二个进程必须被通知它所基于的状态已过时，并且必须重试操作。\n\
  \n因此，用于存储聚合的数据库必须支持并发管理。在最简单的形式中，聚合应保存一个版本字段，该字段在每次更新后递增：\n\n```\nclass Ticket\n\
  {\n    TicketId _id;\n    int      _version;\n\n    ...\n}\n```\n\n在将更改提交到数据库时，我们必须确保被覆盖的版本与最初读取的版本匹配。例如，在\
  \ SQL 中：\n\n```\n01 UPDATE tickets\n02 SET ticket_status = @new_status,\n03 agg_version\
  \ = agg_version + 1\n04 WHERE ticket_id=@id and agg_version=@expected_version;\n\
  ```\n\n此 SQL 语句应用对聚合实例状态所做的更改（第 2 行），并增加其版本计数器（第 3 行），但前提是当前版本等于在对聚合状态应用更改之前读取的版本（第\
  \ 4 行）。\n\n当然，并发管理可以在关系数据库之外实现。此外，文档数据库更适合与聚合一起工作。也就是说，必须确保用于存储聚合数据的数据库支持并发管理。\n\
  \n#### 事务边界\n\n由于聚合的状态只能由其自身的业务逻辑修改，聚合也充当事务边界。对聚合状态的所有更改都应作为一个原子操作事务性地提交。如果聚合的状态被修改，要么所有更改都被提交，要么一个也不提交。\n\
  \n\n\n\n\n此外，任何系统操作都不能假设多聚合事务。对聚合状态的更改只能单独提交，每个数据库事务一个聚合。\n\n每个事务一个聚合实例这一要求迫使我们仔细设计聚合的边界，确保设计能够处理业务领域的不变性和规则。对多个聚合进行更改的提交需求表明事务边界错误，因此聚合边界也错误。\n\
  \n这似乎会带来建模限制。如果我们需要在同一个事务中修改多个对象怎么办？让我们看看该模式如何处理这种情况。\n\n### 实体层级\n\n正如我们在本章前面讨论的那样，我们不将实体用作独立模式，只作为聚合的一部分。让我们看看实体与聚合之间的根本区别，以及为什么实体是聚合的构建块，而不是整个领域模型的构建块。\n\
  \n存在多种业务场景，其中多个对象应共享事务边界；例如，当它们可以同时被修改，或者一个对象的业务规则依赖于另一个对象的状态时。\n\nDDD 规定系统的设计应由其业务领域驱动。聚合也不例外。为了支持需要在一个原子事务中应用的对多个对象的更改，聚合模式类似于实体层级，所有实体共享事务一致性，如图\
  \ 6-3 所示。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_138_0.png)\n\n图 6-3. 聚合作为实体的层级\n\
  \n层级包含实体和值对象，只要它们受领域业务逻辑约束，就都属于同一个聚合。\n\n这就是该模式被称为“聚合”的原因：它聚合属于同一事务边界的业务实体和值对象。\n\
  \n以下代码示例演示了跨越属于聚合边界的多个实体的业务规则——“如果代理在响应时间限制的 50% 内未打开升级的工单，则工单会自动重新分配给不同的代理”：\n\n\
  ```\n01 public class Ticket\n02 {\n03     ...\n04     List<Message> _messages;\n\
  05     ...\n06\n07     public void Execute(EvaluateAutomaticActions cmd)\n08   \
  \  {\n09         if (this.IsEscalated && this.RemainingTimePercentage < 0.5\n10\
  \         &&\n11             GetUnreadMessagesCount(for: AssignedAgent) > 0)\n```\n\
  ```\n11        {\n12            _agent = AssignNewAgent();\n13        }\n14    }\n\
  15\n16    public int GetUnreadMessagesCount(UserId id)\n17    {\n18        return\
  \ _messages.Where(x => x.To == id &&\n!x.WasRead).Count();\n19    }\n20\n21    ...\n\
  22 }\n```\n\n该方法检查工单的值以查看其是否已升级，以及剩余处理时间是否小于定义的 50% 阈值（第 9 行）。此外，它还会检查当前代理尚未阅读的消息（第\
  \ 10 行）。如果所有条件都满足，则请求将工单重新分配给不同的代理。\n\n聚合确保所有条件都针对强一致的数据进行检查，并且在检查完成后不会发生变化，因为聚合数据的所有更改都作为一个原子事务执行。\n\
  \n### 引用其他聚合\n\n由于聚合包含的所有对象共享相同的事务边界，如果聚合过大，可能会出现性能和可扩展性问题。\n\n数据的 consistency 可以成为设计聚合边界的便捷指导原则。只有聚合业务逻辑需要强一致的信息才应成为聚合的一部分。所有可以最终一致的信息都应位于聚合边界之外；例如，作为另一个聚合的一部分，如图\
  \ 6-4 所示。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_140_0.png)\n\n图 6-4. 聚合作为一致性边界\n\
  \n经验法则是尽可能保持聚合尽可能小，并且只包含聚合业务逻辑要求处于强一致状态的对象：\n\n```\npublic class Ticket\n{\n   \
  \ private UserId        _customer;\n    private List<ProductId> _products;\n   \
  \ private UserId        _assignedAgent;\n    private List<Message> _messages;\n\n\
  \    ...\n}\n```\n\n在前面的示例中，Ticket 聚合引用了一组消息，这些消息属于聚合的边界。另一方面，客户、与工单相关的产品集合以及指派的代理不属于聚合，因此通过其\
  \ ID 进行引用。\n\n引用外部聚合的 ID 的原因在于明确这些对象不属于聚合的边界，并确保每个聚合都有自己的事务边界。\n\n要决定一个实体是否属于聚合，请检查聚合是否包含业务逻辑，如果该逻辑在最终一致的数据上运行，会导致系统状态无效。让我们回到之前关于如果当前代理在响应时间限制的\
  \ 50% 内未阅读新消息则重新分配工单的示例。如果关于已读/未读消息的信息是最终一致的怎么办？换句话说，接收阅读确认在一定延迟后是合理的。在这种情况下，可以合理地预期会有相当数量的工单被不必要地重新分配。当然，这会破坏系统的状态。因此，消息中的数据属于聚合的边界。\n\
  \n### 聚合根\n\n我们之前看到，聚合的状态只能通过执行其命令之一来修改。由于聚合代表实体层级，其中只有一个应被指定为聚合的公共接口——聚合根，如图 6-5\
  \ 所示。\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_142_0.png)\n\n图 6-5. 聚合根\n\n考虑以下\
  \ Ticket 聚合的摘录：\n\n```\npublic class Ticket\n{\n    ...\n    List<Message> _messages;\n\
  \    ...\n\n    public void Execute(AcknowledgeMessage cmd)\n    {\n        var\
  \ message = _messages.Where(x => x.Id == cmd.id).First();\n        message.WasRead\
  \ = true;\n    }\n    ...\n}\n```\n\n在此示例中，聚合公开了一个命令，允许将特定消息标记为已读。尽管该操作修改了 Message\
  \ 实体的实例，但它只能通过其聚合根 Ticket 访问。\n\n除了聚合根的公共接口之外，还有另一种机制可供外部世界与聚合通信：领域事件。\n\n## 领域事件\n\
  \n领域事件是描述业务领域中已发生的重要事件的消息。例如：\n\n- Ticket assigned\n- Ticket escalated\n- Message\
  \ received\n\n由于领域事件描述的是已经发生的事情，其名称应以过去时形式表述。\n\n领域事件的目标是描述业务领域中发生了什么，并提供与事件相关的所有必要数据。例如，以下领域事件传达特定工单已被升级、升级时间以及升级原因：\n\
  \n```\n{\n  \"ticket-id\": \"c9d286ff-3bca-4f57-94d4-4d4e490867d1\",\n  \"event-id\"\
  : 146,\n  \"event-type\": \"ticket-escalated\",\n  \"escalation-reason\": \"missed-sla\"\
  ,\n  \"escalation-time\": 1628970815\n}\n```\n\n与软件工程中的几乎所有事情一样，命名很重要。确保领域事件的名称简洁地反映业务领域中发生的确切内容。\n\
  \n领域事件是聚合公共接口的一部分。聚合发布其领域事件。其他进程、聚合甚至外部系统可以订阅并对领域事件做出响应，执行自己的逻辑，如图 6-6 所示。\n\n\n\
  \n\n\n![](img/b742a71dea5d5dd509847f82600a6ad1_144_0.png)\n\n图 6-6. 领域事件发布流程\n\n\
  在下面 Ticket 聚合的摘录中，一个新的领域事件被实例化（第 12 行）并追加到该票据的领域事件集合中（第 13 行）：\n\n```\n01 public\
  \ class Ticket\n02 {\n03     ...\n04     private List<DomainEvent> _domainEvents;\n\
  05     ...\n06\n07     public void Execute(RequestEscalation cmd)\n08     {\n09\
  \         if (!this.IsEscalated && this.RemainingTimePercentage <= 0)\n10      \
  \   {\n11             this.IsEscalated = true;\n12             var escalatedEvent\
  \ = new TicketEscalated(_id, cmd.Reason);\n13             _domainEvents.Append(escalatedEvent);\n\
  14         }\n15     }\n16\n17     ...\n18 }\n```\n\n在第 9 章中，我们将讨论如何将领域事件可靠地发布给感兴趣的订阅者。\n\
  \n通用语言\n\n最后但同样重要的是，聚合应反映通用语言。用于聚合名称、其数据成员、其操作以及其领域事件的术语都应以有界上下文的通用语言表述。正如 Eric\
  \ Evans 所说，代码必须基于开发者彼此之间以及与领域专家交流时所使用的相同语言。这对于实现复杂的业务逻辑尤其重要。\n\n现在让我们来看一下领域模型的第三个也是最后一个构建块。\n\
  \n### 领域服务\n\n sooner or later，你可能会遇到不属于任何聚合或值对象，或似乎与多个聚合相关的业务逻辑。在这种情况下，领域驱动设计建议将逻辑实现为\
  \ *领域服务*。\n\n*领域服务* 是一个无状态对象，用于实现业务逻辑。在绝大多数情况下，此类逻辑协调对系统各个组件的调用以执行某些计算或分析。\n\n让我们回到票据聚合的例子。回想一下，被指派的代理有一个有限的时间框架来向客户提出解决方案。时间框架不仅取决于票据的数据（其优先级和升级状态），还取决于代理部门关于每个优先级的\
  \ SLA 的政策以及代理的工作时间表（班次）——我们不能期望代理在非工作时间做出响应。\n\n响应时间框架计算逻辑需要来自多个来源的信息：票据、被指派代理的部门以及工作时间表。这使其成为作为领域服务实现的理想候选：\n\
  \n```\npublic class ResponseTimeFrameCalculationService\n{\n    ...\n    public\
  \ ResponseTimeframe CalculateAgentResponseDeadline(UserId agentId,\n        Priority\
  \ priority, bool escalated, DateTime startTime)\n    {\n        var policy = _departmentRepository.GetDepartmentPolicy(agentId);\n\
  \        var maxProcTime = policy.GetMaxResponseTimeFor(priority);\n\n        if\
  \ (escalated) {\n            maxProcTime = maxProcTime * policy.EscalationFactor;\n\
  \        }\n\n        var shifts = _departmentRepository.GetUpcomingShifts(agentId,\n\
  \            startTime, startTime.Add(policy.MaxAgentResponseTime));\n\n       \
  \ return CalculateTargetTime(maxProcTime, shifts);\n    }\n    ...\n}\n```\n\n领域服务使协调多个聚合的工作变得容易。然而，重要的是始终牢记聚合模式的限制，即在一个数据库事务中只能修改一个聚合实例的限制。领域服务并不是规避此限制的漏洞。每事务一个实例的规则仍然成立。相反，领域服务非常适合实现需要读取多个聚合数据的计算逻辑。\n\
  \n还必须指出的是，领域服务与微服务、面向服务的架构或软件工程中几乎任何其他对“服务”一词的使用都没有关系。它只是一个用于托管业务逻辑的无状态对象。\n\n###\
  \ 管理复杂性\n\n正如本章引言中所述，聚合和值对象模式被引入作为处理业务逻辑实现复杂性的一种手段。让我们看看其背后的推理。\n\n在他的书《The Choice》中，商业管理大师\
  \ Eliyahu M. Goldratt 概述了一个简洁而强大的系统复杂性定义。根据 Goldratt 的说法，在讨论系统的复杂性时，我们感兴趣的是评估控制和预测系统行为的难度。这两个方面反映在系统的自由度上。\n\
  \n系统的自由度是描述其状态所需的数据点。考虑以下两个类：\n\n```\npublic class ClassA\n{\n    public int A {\
  \ get; set; }\n    public int B { get; set; }\n    public int C { get; set; }\n\
  \    public int D { get; set; }\n    public int E { get; set; }\n}\n\npublic class\
  \ ClassB\n{\n    private int _a, _d;\n\n    public int A\n    {\n        get =>\
  \ _a;\n        set {\n            _a = value;\n            B = value / 2;\n    \
  \        C = value / 3;\n        }\n    }\n\n    public int B { get; private set;\
  \ }\n\n    public int C { get; private set; }\n```\n\n```\npublic int D\n{\n   \
  \ get => _d;\n    set {\n        _d = value;\n        E = value * 2\n    }\n}\n\n\
  public int E { get; private set; }\n}\n```\n\n乍一看，似乎 ClassB 比 ClassA 复杂得多。它具有相同数量的变量，但除此之外，还实现了额外的计算。它比\
  \ ClassA 更复杂吗？\n\n让我们从自由度角度分析这两个类。描述 ClassA 的状态需要多少个数据元素？答案是五个：它的五个变量。因此，ClassA\
  \ 有五个自由度。\n\n描述 ClassB 的状态需要多少个数据元素？如果查看属性 A 和 D 的赋值逻辑，你会注意到 B、C 和 E 的值是 A 和 D 值的函数。如果知道\
  \ A 和 D 的值，则可以推断出其余变量的值。因此，ClassB 只有两个自由度。你只需要两个值来描述其状态。\n\n回到最初的问题，哪一个类在控制和预测其行为方面更困难？答案是自由度更多的一个，即\
  \ ClassA。ClassB 中引入的不变量降低了其复杂性。这正是聚合和值对象模式所做的：封装不变量，从而降低复杂性。\n\n与值对象状态相关的所有业务逻辑都位于其边界内。对聚合也是如此。聚合\n\
  \n只能通过其自身的方法进行修改。其业务逻辑封装并保护业务不变量，从而减少自由度。\n\n由于领域模型模式仅应用于具有复杂业务逻辑的子域，因此可以安全地假设这些是核心子域——软件的核心。\n\
  \n### 结论\n\n领域模型模式旨在处理复杂业务逻辑的情况。它由三个主要构建块组成：\n\n- *值对象*\n\n业务域中仅能通过其值来识别的概念，因此不需要显式的\
  \ ID 字段。由于字段之一的更改在语义上创建了新的值，因此值对象是不可变的。\n\n值对象不仅建模数据，还建模行为：操作值并从而初始化新值对象的方法。\n\n\
  - *聚合*\n\n共享事务边界的实体层次结构。聚合边界内包含的所有数据必须强一致以实现其业务逻辑。\n\n聚合的状态及其内部对象只能通过其公共接口进行修改，通过执行聚合的命令。数据字段对外部组件只读，以确保与聚合相关的所有业务逻辑都驻留在其边界内。\n\
  \n聚合充当事务边界。其所有数据，包括其所有内部对象，必须作为一个原子事务提交到数据库。\n\n\n\n\n\n聚合可以通过发布领域事件与外部实体进行通信——这些消息描述了聚合生命周期中的重要业务事件。其他组件可以订阅这些事件，并利用它们触发业务逻辑的执行。\n\
  \n### 领域服务\n\n一个无状态对象，托管不自然属于领域模型中任何聚合或值对象的业务逻辑。\n\n领域模型的构建块通过将业务逻辑封装在值对象和聚合的边界内来应对业务逻辑的复杂性。对对象状态外部修改能力的缺失确保了所有相关的业务逻辑都实现在聚合和值对象的边界内，并且不会在应用层中重复。\n\
  \n在下一章中，你将学习实现领域模型模式的高级方法，这次将时间维度作为模型固有的部分。\n\n## 练习\n\n+   1. 以下哪个陈述是正确的？\n+  \
  \    a. 值对象只能包含数据。\n+      b. 值对象只能包含行为。\n+      c. 值对象是不可变的。\n+      d. 值对象的状态可以改变。\n\
  +   2. 设计聚合边界的一般指导原则是什么？\n\n+   a. 聚合只能包含一个实体，因为一次数据库事务中只能包含一个聚合的实例。\n+   b. 聚合应设计得尽可能小，只要业务域的数据一致性要求保持不变即可。\n\
  +   c. 聚合代表实体层次结构。因此，为了最大化系统数据的一致性，聚合应设计得尽可能宽。\n+   d. 取决于：对于某些业务域，小聚合最好，而在其他情况下，使用尽可能大的聚合更高效。\n\
  \n### 3. 为什么一次事务中只能提交一个聚合的实例？\n\n+   a. 确保模型在高负载下能够运行。\n+   b. 确保正确的事务边界。\n+   c.\
  \ 没有这样的要求；取决于业务域。\n+   d. 使能够使用不支持多记录事务的数据库，例如键值和文档存储。\n\n### 4. 以下哪个陈述最能描述领域模型构建块之间的关系？\n\
  \n+   a. 值对象描述实体的属性。\n+   b. 值对象可以发出领域事件。\n+   c. 聚合包含一个或多个实体。\n+   d. A 和 C。\n\n\
  ### 5. 以下哪个陈述关于活动记录和聚合之间的差异是正确的？\n\n+   a. 活动记录只包含数据，而聚合也包含行为。\n+   b. 聚合封装了其所有的业务逻辑，但操作活动记录的业务逻辑可能位于其边界之外。\n\
  +   c. 聚合只包含数据，而活动记录包含数据和行为。\n+   d. 聚合包含一组活动记录。\n\n1 Fowler, M. (2002). Patterns\
  \ of Enterprise Application Architecture. Boston: Addison-Wesley.\n\n2 本章中的所有代码示例都将使用面向对象编程语言。然而，所讨论的概念不仅限于\

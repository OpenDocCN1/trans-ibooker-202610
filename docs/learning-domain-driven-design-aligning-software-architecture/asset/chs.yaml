- "# 领域驱动设计入门指南：使软件架构与业务战略保持一致\n\n\n\n\n\n\n\n\n\n\n# Praise for *Learning Domain-Driven\
  \ Design*\n\n> “Vladik Khonononov is a unique thinker who has been applying DDD\
  \ to solve real business problems for years. His ideas constantly move the whole\

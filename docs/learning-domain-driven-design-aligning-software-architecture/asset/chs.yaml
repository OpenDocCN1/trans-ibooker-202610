  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n# Revision History for the First Edition\n\n\n\n\
  \n\n\n[LSI]\n\n# Foreword\n\nDomain-driven design provides a set of practices for\
  \ a collaborative approach to building software from the perspective of the business—that\
  \ is, the domain, and its problems that you are targeting. It was originally coined\
  \ by Eric Evans in 2003 with the publication of what is fondly known in the DDD\
  \ community as “The Blue Book.” The book’s title is *Domain-Driven Design: Tackling\
  \ Complexity in the Heart of Software.*\n\nWhile tackling complexity and providing\
  \ a path to clarity is the goal of domain-driven design, there are so many great\
  \ ideas that can be applied to even less complicated software projects. DDD reminds\
  \ us that software developers are not the only people involved in building software.\
  \ The domain experts, for whom the software is being built, bring critical understanding\
  \ of the problems being solved. We create a partnership throughout the stages of\
  \ creation as we first apply “strategic design” to understand the business problem,\
  \ a.k.a. the domain, and break the problem down into smaller, solvable, interconnected\
  \ problems. The partnership with the domain experts also drives us to communicate\
  \ in the language of the domain, rather than forcing those on the business side\
  \ to learn the technical language of software.\n\nThe second stage of a DDD-based\
  \ project is “tactical design,” where we transform the discoveries of strategic\
  \ design into software architecture and implementation. Again, DDD provides guidance\
  \ and patterns for organizing these domains and avoiding further complexity. Tactical\
  \ design continues the partnership with the domain experts who will recognize their\
  \ domain language even as they look at the code built by the software teams.\n\n\
  Over the years since the publication of “The Blue Book,” not only have many organizations\
  \ benefited from the ideas, but a community of experienced DDD practitioners has\
  \ evolved. And the collaborative nature of DDD has resulted in this community sharing\
  \ their experiences and perspective and creating tools to help teams\n\nembrace\
  \ and benefit from these ideas. In a keynote at Explore DDD in 2019, Eric Evans\
  \ encouraged the community to continue to evolve DDD—not only its practices but\
  \ in finding ways to more effectively share its ideas.\n\nAnd this brings me to\
  \ why I am such a fan of *Learning Domain-Driven Design*. I was already a fan of\
  \ Vlad through his conference speaking and other writings. He has a lot of hard-won\
  \ experience as a DDD practitioner working on some deeply complex projects and has\
  \ been generous in sharing that knowledge. In this book, he tells the “story” of\
  \ DDD (not its history, but its concepts) in a unique way, providing a great perspective\
  \ for learning. This book is aimed at newcomers, yet as a longtime DDD practitioner\
  \ who also writes and speaks about DDD, I found that I learned so much from his\
  \ perspective. I was eager to reference his book in my DDD Fundamentals course on\
  \ Pluralsight before the book was even published and have already been sharing some\
  \ of this perspective in conversations with clients.\n\nGetting started with DDD\
  \ can be confusing. Just as we use DDD to reduce the complexity of projects, Vlad\
  \ presents DDD in a way that reduces the complexity of the topic itself. And he\
  \ does more than explain the principles of DDD. The latter portion of the book shares\
  \ some important practices that have evolved from DDD, such as EventStorming, addresses\
  \ the problem of evolving the business focus or organization and how this might\
  \ affect the software, and discusses how DDD aligns with microservices and how you\
  \ can integrate it with a slew of well-known software patterns. I think *Learning\
  \ Domain-Driven Design* will be an excellent introduction to DDD for newcomers,\
  \ and a very worthy read for experienced practitioners as well.\n\n*Julie Lerman*\n\
  *Software Coach, O’Reilly Author, and Serial DDD Advocate*\n\n# Preface\n\nI vividly\
  \ remember the day I started my first real software engineering job. I was both\
  \ ecstatic and terrified. After hacking software for local businesses during my\
  \ high school years, I was eager to become a “real programmer” and write some code\
  \ for one of the country’s largest outsourcing companies.\n\nIn my first days there,\
  \ my new colleagues were showing me the ropes. After setting up the corporate email\
  \ and going through the time-tracking system, we finally moved on to the interesting\
  \ stuff: the company’s coding style and standards. I was told that “here, we always\
  \ write well-designed code and use the layered architecture.” We went through the\
  \ definition of each of the three layers—the data access, business logic, and presentation\
  \ layers—and then discussed the technologies and frameworks for addressing the layers’\
  \ needs. Back then, the accepted solution for storing data was Microsoft SQL Server\
  \ 2000, and it was integrated using ADO.NET in the data access layer. The presentation\
  \ layer rocked either WinForms for desktop applications or ASP.NET WebForms for\
  \ the web. We spent quite some time on these two layers, so I was puzzled when the\
  \ business logic layer didn’t get any attention:\n\n> “But what about the business\
  \ logic layer?”\n\n> “That one is straightforward. Here is where you implement the\
  \ business logic.”\n\n> “But what is business logic?”\n\n> “Oh, business logic is\
  \ all the loops and ‘if-else’ statements you need in order to implement the requirements.”\n\
  \nThat day I began my journey to find out what exactly business logic is and how\
  \ on earth it should be implemented in well-designed code.\n\n\n\n\n\n花了我三年多时间才最终找到答案。\n\
  \n这个答案在 Eric Evans 的开创性著作 *Domain-Driven Design: Tackling Complexity in the Heart\
  \ of Software* 中。事实证明我并没有错。业务逻辑确实很重要：它是软件的核心！不幸的是，随后又花了我三年时间才理解 Eric 分享的智慧。这本书非常先进，而英语是我的第三语言，这也没有帮助。\n\
  \n最终，一切都理顺了，我与领域驱动设计（DDD）方法论达成了和解。我学习了 DDD 的原则和模式，建模和实现业务逻辑的复杂性，以及如何应对我所构建的软件核心中的复杂性。尽管障碍重重，这绝对是值得的。深入领域驱动设计对我来说是一次改变职业生涯的经历。\n\
  \n### 我为何撰写本书\n\n在过去的 10 年里，我向不同公司的同事介绍了领域驱动设计，进行了面对面授课，并教授在线课程。教学视角不仅帮助我加深了知识，也让我能够优化解释领域驱动设计原则和模式的方式。\n\
  \n正如经常发生的那样，教学比学习更具挑战性。我是 Eliyahu M. Goldratt 作品和教导的忠实拥趸。Eliyahu 曾说，即使是最复杂的系统，从正确的角度看也是本质上简单的。在我多年教授\
  \ DDD 的过程中，我一直在寻找一种能够揭示领域驱动设计固有简单性的方法论模型。\n\n本书是我努力的结果。它的目标是使领域驱动设计民主化；使其更容易理解，更易于采用。我相信\
  \ DDD 方法论绝对无价，尤其是在设计现代软件系统时。本书将为你提供足够多的工具，让你在日常工作中开始应用领域驱动设计。\n\n### 谁应该阅读本书\n\n\
  我相信，掌握领域驱动设计原则和模式的知识对所有级别的软件工程师都有用：初级、高级、员工级和首席工程师。DDD 不仅提供建模和有效实现软件的工具和技术，还阐明了软件工程中一个常被忽视的方面：上下文。配备了对系统业务问题的了解，你将更有效地选择合适的解决方案。一个既不过度也不欠设计的解决方案，而是满足业务需求和目标的解决方案。\n\
  \n领域驱动设计对软件架构师更重要，对有志成为软件架构师的人更是如此。其战略设计决策工具将帮助你将大型系统分解为组件——服务、微服务或子系统——并设计组件如何集成以形成系统。\n\
  \n最终，在本书中我们将讨论的不仅是如何设计软件，还如何随着其业务上下文的变化而共同演进设计。这种软件工程的关键方面将帮助你随着时间的推移保持系统设计的“良好状态”，并防止其退化成一团乱麻。\n\
  \n### 如何阅读本书\n\n本书分为四个部分：战略设计、战术设计、DDD 实践，以及 DDD 与其他方法论和模式的关系。在第一部分，我们介绍用于做出大规模软件设计决策的工具和技术。在第二部分，我们关注代码：实现系统业务逻辑的不同方式。\n\
  \n第三部分讨论在实际项目中应用 DDD 的技术和策略。第四部分继续讨论领域驱动设计，但这次是在其他方法论和模式的背景下。\n\n以下是各章节内容的简要总结：\n\
  \n- 第 1 章确立了软件工程项目的背景：业务领域、其目标，以及软件打算如何支持这些目标。\n- 第 2 章介绍了“通用语言”的概念：领域驱动设计用于有效沟通和知识共享的实践。\n\
  - 第 3 章讨论如何应对业务领域的复杂性并设计系统的高级架构组件：有界上下文。\n- 第 4 章探讨组织有界上下文之间通信和集成的不同模式。\n- 第 5 章以两种针对简单业务逻辑情况的模式开始讨论业务逻辑实现模式。\n\
  - 第 6 章从简单业务逻辑推进到复杂业务逻辑，并引入领域模型模式来应对其复杂性。\n- 第 7 章增加了时间的视角，并引入了一种更先进的建模和实现业务逻辑的方法：事件溯源领域模型。\n\
  - 第 8 章将焦点转移到更高层级，并描述了三种用于构建组件的架构模式。\n- 第 9 章提供了协调系统组件工作的所需模式。\n- 第 10 章将前几章讨论的模式结合起来，形成一系列简化的经验法则，以简化设计决策过程。\n\
  - 第 11 章从时间的角度探讨软件设计，以及它在其生命周期中应如何变化和演进。\n- 第 12 章介绍 EventStorming：一种低技术工作坊，用于有效共享知识、建立共同理解并设计软件。\n\
  - 第 13 章解决了在棕地项目中引入领域驱动设计时可能遇到的困难。\n- 第 14 章讨论微服务架构风格与领域驱动设计之间的关系：它们在何处不同，在何处互补。\n\
  - 第 15 章在事件驱动架构的背景下探讨领域驱动设计模式和工具。\n- 第 16 章将讨论从运营系统转移到分析数据管理系统，并讨论领域驱动设计与数据网格架构之间的相互作用。\n\
  \n所有这些章节都以若干练习问题结束，以强化学习。一些问题使用了虚构公司“WolfDesk”来展示领域驱动设计的各个方面。请阅读以下对 WolfDesk 的描述，并在回答相关练习问题时参考它。\n\
  \n### 示例领域：WolfDesk\n\nWolfDesk 以服务的形式提供帮助台工单管理系统。如果你的初创公司需要为客户提供支持，使用 WolfDesk\
  \ 的解决方案，你可以在很短时间内启动并运行。\n\nWolfDesk 使用的计费模式与其竞争对手不同。它不按用户收费，而是允许租户按需设置任意数量的用户，租户按计费周期内打开的支持工单数量付费。没有最低费用，并且对每月工单的特定阈值有自动数量折扣：打开超过\
  \ 500 张工单可享受 10% 折扣，打开超过 750 张工单可享受 20% 折扣，打开超过 1,000 张工单每月可享受 30% 折扣。\n\n为防止租户滥用商业模式，WolfDesk\
  \ 的工单生命周期算法确保不活跃的工单会自动关闭，鼓励客户在需要进一步支持时打开新工单。此外，WolfDesk 实施了欺诈检测系统，分析消息并检测同一工单中讨论无关主题的情况。\n\
  \n为帮助其租户简化与支持相关的工作，WolfDesk 实施了“支持自动驾驶”功能。自动驾驶分析新工单并尝试从租户的工单历史中自动找到匹配的解决方案。该功能可进一步减少工单的生命周期，鼓励客户为进一步的问题打开新工单。\n\
  \nWolfDesk 整合了所有安全标准和措施来验证和授权其租户的用户，并且还允许租户将其现有的用户管理系统与单点登录（SSO）配置。\n\n管理界面允许租户配置工单类别的可能值，以及租户支持的产品列表。\n\
  \n\n\n\n\n为了能够仅在租户支持代理的工作时间内将新工单路由给他们，WolfDesk 允许录入每个代理的班次安排。\n\n由于 WolfDesk 以零最低费用提供服务，它必须以最小化新租户入驻成本的方式优化其基础设施。为此，WolfDesk\
  \ 利用无服务器计算，可根据活跃工单上的操作弹性扩展其计算资源。\n\n### 本书使用的约定\n\n本书使用以下排版约定：\n\n*Italic*\n\n表示新术语、URL、电子邮件地址、文件名和文件扩展名。\n\
  \n*Constant width*\n\n用于程序列表，以及在段落中引用程序元素，如变量或函数名、数据库、数据类型、环境变量、语句和关键字。\n\n> NOTE\n\
  > \n> 此元素表示一般性说明。\n\n### 使用代码示例\n\n补充材料（代码示例、练习等）可从 https://learning-ddd.com 下载。\n\
  \n本书中呈现的所有代码示例均使用 C# 语言实现。通常，您在章节中看到的代码示例是展示所讨论概念的摘录。\n\n当然，本书中讨论的概念和技术并不局限于 C#\
  \ 语言或面向对象编程方法。所有内容对其他语言和其他编程范式同样相关。因此，请随意使用您喜欢的语言实现本书的示例并与我分享。我很乐意将它们添加到本书网站上。\n\

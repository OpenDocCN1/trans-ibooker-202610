  \n这些实现模式之间的区别在于聚合状态的持久化方式。事件溯源领域模型使用事件溯源模式来管理聚合的状态：而不是持久化聚合的状态，模型会生成描述聚合生命周期中每次更改的领域事件，并将它们用作聚合数据的事实来源。\n\

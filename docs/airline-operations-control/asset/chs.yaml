  '
- '## 1 运行控制


  ### 简介


  本章将介绍并描述航空公司运行控制中心（OCC）的概念及其背后的基本原理、其存在的目的及其在航空公司运营中的重要性。该中心的结构、选址和组成在物理布局、复杂性和参与方的参与度方面均存在显著差异。本章的重点将是考察这些参与方之间的联系及其外部隶属关系，因为建立和维护紧密的工作关系是高效识别和解决问题的关键。





  # 4 运行控制


  ![](img/bg1b.jpg)


  ## 监管框架


  尽管深入探讨与运行控制相关的监管细节超出了本书的范围，但提供一个基本框架仍然是重要且相关的。运行控制的必要性通过多种方式得到认可。首先是定义“运行控制”这一术语。根据《芝加哥公约》附件
  6 第 1 章，运行控制是指“为航空器安全、航班正常性和效率的利益，对航班的开始、继续、改航或终止行使权力”。1 因此，运行控制涉及航班的所有阶段。


  附件第 3 章还阐明，运营人或其受托人负责运行控制。随后，运行控制中心（OCC）（或航空公司使用的任何其他名称）代表航空公司承担运行控制的责任。重要的是要注意，OCC
  不仅需要遵守国际层面的法规，还必须考虑到业务涉及的每个国家（按国际民用航空组织——ICAO 的定义）的政府法规，并充分意识到这些法规在各国之间可能存在差异。这些法规涉及的领域例如包括机组值勤时间、维持飞行监视的要求，以及关于工程活动的众多要求。在
  OCC 内部，运行控制的任务随后被委派给诸如运行控制员（许多司法管辖区的称呼）或调度员等角色，例如持证调度员的情况（见下一章的飞行调度）。除了航空公司提供运行控制的法律要求外，OCC
  的一个关键目标是满足商业期望（即按向客户和其他利益相关者宣传和预期的方式执行时刻表）。因此，OCC 的任务是确保时刻表网络尽可能接近计划运行来实现。它如何完成这一点是本章和下一章的重点。


  ## 术语


  有几个术语被用来描述航空公司的运行中心。显而易见且可能最常用的一直是 OCC，或者可能是 AOC（航空公司运行控制）。一些


  ![](img/bg1c.jpg)


  航空公司则倾向于使用 AOCC（航空公司运行控制中心）、SOCC（系统运行控制中心）、NCC（网络控制中心）或 NOC（网络运行中心），而一些较小的航空公司可能使用
  ROC（区域运行控制或中心）一词。最近，由于非常充分的理由，越来越多的关键部门参与并纳入运行中心的结构中，这导致了综合运行中心（IOC）的演变、形成及其术语的产生。“综合”一词是刻意使用的，旨在强调包含在一个权力机构内的目的与活动的综合。这一组织实体随着时间的推移有了显著发展，其在处理航空公司运行动态中的关键作用怎么强调都不为过。在充分认可航空公司术语偏好及其理由的前提下，本书将全文使用
  IOC 一词（除下文的历史视角外）来泛指任何航空公司的 OCC 或系统，以避免任何混淆。


  ## 定义 IOC


  如上所述，航空公司进行运行控制存在监管要求。此外，还有对航空公司计划网络航班时刻表进行日常监督的基本需求，以确保实际运行尽可能紧密地反映预期运行的时刻表。当然，时刻表是呈现给旅客并因此被旅客所依赖的。无论航空公司是拥有极少数飞机的小型包机或支线承运人，还是拥有数百架飞机和跨越多个国家的复杂运行网络的大型公司，对一个负责机队合法、安全和高效运行的“神经中枢”的必要性是显而易见的。因此，航空公司通过这个中央集权部门来管理其运行控制。该中心的任务是监控航空公司从飞行前计划、起飞、航路、到达各阶段的多样化航班，覆盖其整个网络，不仅处理定期班机服务，2
  还根据需要处理包机和特种运行。每个航空公司的 IOC 都是独特的。每个中心的结构不同，拥有自己的系统、程序、政策和文化。当然，每个航空公司的网络也是独特的——世界上没有两家航空公司拥有相同的航线结构或机队构成。因此，IOC
  是专门为推动其自身航空公司的目标而建立的。


  ![](img/bg1d.jpg)


  除了协调和管理航空公司运行活动的这一角色外，IOC 在航空公司内部还承担另一个关键职能。其核心地位、精密的结构、包容性的代表性以及深入运行许多领域的广泛触角，赋予了它独特的特征。航空公司内没有其他部门能比它更贴近运行事件的发生，以及与其他参与利益相关者的联系。因此，IOC
  是天然的通信枢纽。外部方可以接入并监听事件的发展或根据需要提供建议。对外沟通也可以轻松传播给广泛的接收者。在发生可能演变为危机情况的重大异常或特殊事件时（例如安保、安全或其他），事件的初步处理很可能由
  IOC 管理。然而，新出现情况的严重程度将决定 IOC 继续管理它的程度，因为其影响可能需要专门的关注，无论是短期还是如果是重大事件，则需要相当长的一段时间。因此，此类事件的管理可能会交给
  IOC 的一个分支机构，如危机管理中心，该中心通常位于远离 IOC 的物理位置，并通常由包括高级管理层、航空公司各关键职能领域的专家、其他提名的航空公司人员和外部当局（如需要）在内的专业团队组成。团队的一部分将包括来自
  IOC 本身的专业专业知识代表。重要的是要认识到，在新出现的危机旁边（取决于其性质和严重性），航空公司网络的其余部分很可能不受特定事件影响，因此仍然需要被管理。换句话说，IOC
  仍需继续其正常活动。


  ## 历史


  在过去的几十年里，航空公司的许多部门领域在一定程度上是独立运作的。本质上，它们主要基于孤岛式思维运作，肩负自己的目标和指标，并拥有单一的部门指标来衡量自己的绩效和结果。这些部门的员工往往对自己工作领域之外的发生的事情几乎没有概念，往往对其他部门及其开展的工作知之甚少，且仅对彼此可能产生的影响程度有着微薄的理解。






  # 7 运行控制


  因此，某些领域的决策影响在其他领域未被充分理解或领会。这是一个极其失调的结构。当时，在后来几十年航空旅行相对“爆炸式”增长之前，竞争利益很少。监管环境限制了竞争，机场和空域拥堵极少，空中交通管制使用的设备和程序比今天简单得多。燃料相对充足，除非在特定的、周期性的世界紧张时期，价格都相当合理。政府通常支持或拥有航空公司，经营成本较少受到质疑，或者至少远不如今天那样处于聚光灯下。


  ## OCC 考量因素


  ### 早期岁月


  当时更常被称为 OCC 的运行控制中心也不例外。它通常隐藏在航空公司内部，似乎鲜为人知，肯定被误解，常被不信任，并被高级管理层视为业务底线的成本职能。因此，管理层没有意愿投资改进运行中心。由于缺乏应有的认可，用于改进运行系统、通信工具以及适当的员工招聘和培训的投资无法到位。此外，OCC
  中的工具通常是单独采购并孤立用于单一任务的。它们在技术上多种多样，往往来自一系列在运营特定方面（如飞机动态、机组资源规划或预订功能）有既得利益的供应商，但缺乏作为统一包呈现的范围和能力。这导致例如飞机动态系统无法与机组系统或预订系统“通信”。这种缺乏系统集成和内聚力的情况导致了极大的挫败感、工作量增加，以及
  OCC 运作方式的低效，当然也成为成本控制日益关注的问题。当然，一旦这些单独的系统被选定并融入日常运营，它们的使用就成为常态，员工依赖度更高，且几乎没有动力去改变看似运行良好（尽管是独立运行）的现状。结果，为了实现更好的标准化，或更好地实现综合，替换它们的财务（和社会）成本变得过高，导致大量独立程序长期并存。


  尽管存在系统缺陷，当然当时互联网尚不存在，因此获取和收集可靠信息以辅助决策，以及随后传达和传播结果，是一个缓慢的过程。旅行社占据主导地位，因此依赖它们服务旅客预订和行程管理，旅客很大程度上掌握在这些系统手中。预订条件也相当严格，单程预订有经济惩罚，要求最短停留时间，且通常包含特定日期（如周六）才能获得折扣套餐。旅客几乎没有选择权，当然也无法自行参与预订流程。解决问题的过程高度被动；通常采取“救火式”方法，OCC
  随着事态发展做出反应，因此恢复高度被动且有些常规化。在此期间，责备文化心态显而易见。由于职能领域主要独立运作，“XYZ 做了这或那”的态度相当普遍，其他领域会感到有义务“修复”其他地方造成的问题。在这个时代，当然竞争较少，但缺点是提供可行解决方案的选择也较少（例如，在本航空公司或其他承运人的航班上安置受影响旅客）。解决方案在很大程度上是“机身”导向，而非以客户为中心，意味着恢复方案更多基于挽救飞机运行模式，而非减轻对旅客行程的影响。甚至早期使用的“旅客”术语，在态度上也不同于如今更常用的“客户”或“宾客”。在早期，客座率（即占用座位与飞机总容量的比例）通常较低，航班频率较少，恢复运行相对简单。受影响旅客通常会在可能时得到安置——通常在“稍后”的航班上，有时甚至不得不等到第二天或更糟，等到下一个计划航班（即便如此，也要有足够座位承运）。低成本航空公司，正如我们今天所知，要么在早期尚未出现，要么刚开始站稳脚跟。


  ### 步入 21 世纪


  在 1990 年代和 2000 年代，行业发生了许多演变性变化。低成本航空公司的普及逐渐显现，导致竞争迅速变化，并压低成本。这与





  # 9 运行控制


  这一变革伴随着航空公司所有权的转变，许多政府剥离了对国家航空公司的参与。随着航空旅行的随后「爆发式」增长，拥堵开始成为世界许多地区的主要问题。机场扩建以应对更大的需求，次级机场开始被接受，发展更完善的基础设施以满足不断增长的国内需求，并经常促进国际服务。随着技术变革的实现，OCC
  内部的活动稳步变得更加以系统为中心。软件供应商要么意识到潜力，要么受航空公司驱动，专注于提供这些发展，从而出现了增强控制员可用图形显示实用性的工具，从而提供更强大的功能以协助优化中断恢复。例如，为了更容易地管理重大天气中断（如暴风雪或飓风），较新的工具使影响大量航班阶段的大规模补救措施能在更短的时间框架内实施，从而实现更快的恢复，并减轻控制员的工作量。技术改进也促进了职能领域间更协调的方法，特别是那些涉及工程、商业和运营利益的领域，并形成了联合解决问题的文化。因此，从自我满足的部门追求向以航空公司为中心的综合决策结果的转变开始出现。为了支持这种方法，开发了联合指标来衡量、通报、分析和提升系统性能，从而在规划和运营中带来创新，但越来越多地关注全面的持续改进。这一过程的一部分是更多地关注收入保留和保护，以及重要的是成本控制。也有共同努力来精确定位成本削减机会，特别是针对高成本活动，如机组人员和维护资源，以及隔离与非核心活动相关的成本。结果，生产率提高，间接费用减少，备件和库存水平降低。外包在帮助减少员工规模和责任方面发挥了关键作用。例如，维修和大修曾在国内处理，现在可以外包给当地第三方承包商或离岸外包，航空公司员工队伍缩减，随着劳动力的临时化，全职雇佣转变为兼职或临时职位。当然，雇佣协议需要更多灵活性，以实现工作方式的重大变革。


  # 10 运行控制


  这一时期显著变化的是重新聚焦于客户并分析其对公司的相对价值。这很大程度上源于对日益激烈竞争的认识，不仅体现在新航空公司数量增加、旅客选择大幅增多上，还体现在不断进化的最先进飞机上，许多情况下配备复杂的高端客舱，提供广泛的产品和服务展示。选择多得多，加上客户几乎无惩罚地轻易转向竞争对手，这些都是重新聚焦客户旅程的驱动因素。因此，客户影响已成为运营决策的核心，特别是关于高价值客户（高端舱位旅客）或高忠诚度客户（来自其母航司或主要航司，或来自联盟和合作伙伴航空公司）。


  ## IOC 变革的驱动因素


  有几个因素导致了 IOC 本身的哲学变革。首先，航空公司高层管理意识到 IOC 在管理航空公司资产中发挥的关键作用；这是从将 IOC 视为成本衍生物的观念中的哲学转变。鉴于
  IOC 在日常工作中能触及航空公司的许多部分，现在公认它对航空公司的行为和绩效有重要的「感知」。此外，航空公司真正接受了 IOC 对利润的重要贡献。它已成为一个卓越中心。其次，作为信息和通信的核心，并通过其对航空公司行使积极控制的能力，IOC
  已成为对航空公司绩效至关重要的结果的关键驱动力。它可以利用和协调广泛的资源，从而在运营领域实现更高效率。它还可以在帮助降低运营成本方面发挥作用，例如，通过更明智和更快的决策过程，或启动燃油政策等工具以优化燃油携带和消耗，或防范短缺或供应威胁。作为其自身绩效审查的一部分，IOC
  能够评估其成员的角色。例如，它非常适合影响政策，游说改变机组人员可用性、排班或休息惯例，改进时刻表，或要求增加地面资源，这是由于识别出导致或加剧中断的根本原因。为了证实此类提议，它现在掌握了大量数据和其他支持证据来论证其观点。




  # 运行控制以客户为中心


  航空公司客户明白，在他们的旅程中，某个时刻他们很可能会遭遇航班不正常。航空公司如何应对并恢复客户行程，以及在此过程中如何对待客户，对航空公司的声誉日益关键，且对留住忠诚客户群至关重要。随着这一重点的重申，IOC（运行控制中心）的关注点已真正转向客户满意度。在数字化时代，为了应对日益增大的客户压力，人们已认识到需要更快、更恰当的决策，以及对付费公众影响更小的最优解决方案。客户现在不仅在航班不正常发生时知情，还能通过社交媒体平台，在事件初现或展开时生成并广播信息，传播给庞大的全球受众（包括媒体）。比以往任何时候都更甚，一旦行程受阻，他们想要即时解决方案和迅速行动。随着重心重新聚焦于客户，IOC
  现在越来越能够做到这一点。它们能更高效地应对局势，产出更好的决策结果，并通过复杂的通信渠道传播必要信息。某种程度上，过去需要 24 小时的事，现在可能只需 24
  秒。这对旅行公众有重大影响，前提是客户恢复流程在努力上是真诚的。


  ## 社交媒体的影响


  多种通信平台已成为机上常态。许多航空公司引入并不断增强 Wi-Fi 的可用性和能力，让乘客触手可及地获取实时信息，从而使他们能够随时了解世界事件。这项技术为实现此类通信提供的机会，也引发了航空公司面临的潜在问题，如涉及安全、道德、保密性或传播社会不当材料等方面的问题。随着社交媒体平台的迅速扩张和影响力增强，航空公司已充分意识到社交信息传播的速度和范围，这些信息涉及其表现、服务水平、机上事件和其他事件，无论这些通讯是负面还是正面。突然之间，世界几乎任何地方的机载通信系统都能实现与世界任何其他方的快速联系。因此，许多
  IOC 在其中心内嵌入了社交媒体代表团队，以最大程度地掌握当前的公众情绪。


  ![](img/bg23.jpg)


  确实，有时通过此渠道观察到的情况首报，比收到官方情报还要早。社交媒体人员 24/7 监控各类事件，向 IOC 提供实时信息，使其能按需响应。这一持续过程已成为
  IOC 消除误解、遏制负面评论或仅仅回答问题的宝贵工具，且通信可广泛转发或专门指向航空公司内部的关键利益相关者。这种影响模式也可另辟蹊径。一旦察觉即将发生的不正常情况（如延误或取消），IOC
  现在有能力高度主动地通过自身的社交媒体功能发布意图，这在个别客户采取自行动作之前，从而在航空公司的客户群中提供快速且及时的沟通。更为重要的是，IOC 内部的客户旅程管理（CJM）团队有机会预先警告已识别的客户即将发生的航班不正常，提醒他们可能需要提前到达或在机场办理登机手续（甚至完全不出行）。在某些情况下，客户可能已被安排至备选航班。这是社交媒体一个非常积极的方面。可根据航班、不正常发生港口，或根据
  VIP 或 CIP（商业重要人物）名单的既往识别情况，精准定位客户。这种客户旅程管理方法赋予了 IOC 一种以前不具备的、造福客户的强大手段。


  ## 选址


  具有讽刺意味的是，航空公司 IOC 的实际位置并不关键。然而，能否接触到合适的公司职员，以及那些依赖和/或影响运行流程的众多关联部门，才真正决定了这一关键部门的最佳选址。因此，IOC
  往往设在航空公司总部所在的大城市或机场内部或附近，特别是航空公司的主要枢纽。虽然市区选址在需要时便于联系公司高层，但靠近关键运行资源（如飞行员和乘务员排班、维修控制、机场和地面服务人员）可能被视为更有利。因此，它们通常但不总是设在机场环境内或附近。物理上，IOC
  汇聚于一座最先进的、

  ![](img/bg24.jpg)

  安全的大楼内的一层或多层，进出通常限于相关人员。多年来不断演进的 IOC 将多个不同职能领域纳入核心群组，导致物理结构规模相当可观。在一些大型航空公司，一座专用建筑容纳
  IOC 职能，通常采用同心圆设计或类似布局分布在一层，通过架高的桥梁或平台区域为高级值班管理提供监督视野。关键的当日决策者位于最靠近中心的位置，而更多支持性或资源型角色则安置在更远处。这种集群结构在活动高峰期易导致噪音很大，但关键区域的近距离优势远大于任何劣势，因为共享问题认知、动态信息和协同决策至关重要。为因电力或系统故障，或可能因安全或其他性质的情况提供冗余，备用
  IOC 设在不同地点。虽然备用中心可能不具备与主中心相同的基础设施和布局，但它需要能够提供全面的运行控制，直到主中心活动恢复。向备用中心的临时控制权移交通常每年或每两年测试一次。


  ## 目的与理念


  IOC 的首要目的是监督提供端到端的客户体验，满足每位客户对从 A 点到 B 点安全、合法、高效飞行的期望。安全在业内至上，任何不遵循最高安全标准的航空公司都属于经营错误的业务。合法性是指决定航空公司运营方式的无数法规，以及在许可、运行标准和程序、维修、服务提供等方面合规的必要性。这些发生在国际和国家政府层面，以及航空公司政策层面。效率意味着航空公司将通过准时放行实现时刻表完整性，并在这样做的过程中审慎部署资源以确保其最优利用，同时最大化收入并控制成本。成本控制，如前所述，鉴于行业各项费用上涨（如燃油、购机、薪资、着陆费和航路费），已成为极大关注点，





  # 14 运行控制


  竞争加剧、利益相关者诉求以及对利润底线的持续关注。广泛而深入的规划流程决定了航空公司在运行日临近时的准备状态。但当然，尽管付出了这些努力，没有任何航空公司的时刻表能完全按计划运行，因此必须非常谨慎地管理干扰，以减轻其对现有客户和潜在客户的影响。IOC（运行控制中心）应对这些情况的方式多种多样，依赖于高技能专家团队、提供客户服务的理念方法，以及决策过程中所涉及的无数约束条件的结合。在可能的情况下，IOC
  通过预测潜在干扰并采取行动来主动运作，从而避免对网络构成的威胁，但其工作性质在很大程度上是被动应对的，要求快速评估、精准沟通和高效解决问题。因此，目标有二：一是解决问题，二是与内部和外部利益相关者进行有效联络。为了维系
  IOC 团队与其他部门的关系，对 IOC 的用户投资将通过完善的沟通和报告程序策略获得回报。


  ## 自主权


  无论采用何种汇报渠道，IOC 的一个关键必要条件是具备高度的公正性和自主性，以便进行运行监督和管理。与此交织在一起的是 IOC 模式的关键：即核心小组必须拥有在运行日其职权范围内的决策授权。如果个人无权在无需向其职能领域内的更高级别人员请示的情况下做出授权决策，那么这些个人被纳入
  IOC 就毫无价值，因为在如此复杂和充满挑战的环境中，决策无法通过委员会方式来实现。鉴于这一授权，中心便能以适当的独立性水平运作，并防止对运行决策过程的任何不当干预。当然，这并非意味着
  IOC 孤立运作；恰恰相反。IOC 的性质要求其与来自航空公司内部和外部各领域的关键利益相关者进行紧密而密集的沟通，以适当地为其流程提供信息。但关键在于，这种沟通是双向的。当然，IOC
  需要收集准确、可靠且及时的情报来支撑其决策过程，但也需要及时向广泛的利益相关者传播结果和相关信息。在干扰管理中，机会窗口往往相当狭窄，因此及时、简练地传递沟通信息至关重要。


  ## 层级与汇报线


  IOC 通常隶属于一个更大的部门架构，该架构有着不同的名称，如中央运行部或网络运行部，偶尔 IOC 也可能隶属于飞行运行部。直接汇报线可能指向运行副总裁、运行总监或运行总经理，又或视公司架构而定为飞行运行经理。无论运行架构的规模和构成如何，汇报线都需要明确无误，并确保高效的沟通渠道能为寻求建议和制定方向提供适当的路径。个人头衔和汇报线可能各异，但值得注意的是，这些任务仍需以某种方式执行。



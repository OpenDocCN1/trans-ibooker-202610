  ## 知识与教育


  航空业务日益复杂，要求员工至少具备对该行业的实用知识。显然，知识越渊博（理想情况下延伸至对历史事件的了解），涵盖监管、经济、运营、技术（尤其是与飞机性能相关）、商业，甚至政治等方面，就越有可能理解行业如何协同运作以实现安全、合法和高效这一核心目标。近年来，航空公司开始认识到教育资历的价值，特别是在航空管理领域，这能为个人提供广泛的行业知识，并且视课程内容而定，甚至能让他们接触到模拟问题，这些问题与具有可比挑战性和范围的真实事件并无二致。IOC
  的就业从未真正受限于特定的教育资历，但对高等数学和计算机素养的需求日益增长，以支持更复杂的数据分析和系统支持。因此，一些 IOC 倾向于雇佣具有博士学位的专家，尽管在日常运营中，并不需要这种级别的人员。


  ## 关键属性


  以下对运行控制角色至关重要的一些关键属性进行了分类，以列出相关标准。正如其他地方所述，这些属性也适用于调度员的角色（如前所述）。


  ### 积极性与热情


  运行控制员的角色要求高度的积极性。真正适合这项任务的人会在这种运行环境中找到自己的位置。对合适的人来说，这是天然的契合。正如上文所提到的，高绩效的控制员在这种环境中如鱼得水，因为手头任务的复杂性越高，且他们全身心投入问题之中，获得的满足感就越大。他们以结果为导向。如果用解决方案结果的程度来划分问题解决过程，以下例子可能有助于区分控制员之间的感知差异。一名优秀的控制员可能会制定一个可行的解决方案来解决问题，减轻损失，合理恢复时刻表，并节约使用资源。在决策理论中，这种方法通常被称为“满意化”——即达成一个令人满意或“足够好”的解决方案。它行之有效，但仅此而已。在某些事件中，考虑到时间框架可能不允许进一步的协商或审议，这可能完全可以接受。然而相比之下，一名杰出的控制员将展示远超这一基础水平的技能，投入大量精力去寻找在他们眼中最优或最理想的解决方案。实现这种崇高目标源于一个创建、测试和微调可能解决方案的过程，并处于一种不满足状态，直到找到最佳方案。对外行来说，观察专家控制员的目光似乎在飞行显示器间“跳跃”，或倾听他们提出一系列看似脱节的问题，会认为这是一种极不合理的考量事件的方式。然而，控制员实际上正在脑海中构建多个“假设”场景并测试其有效性。这就是他们感知潜在解决方案是否可行的方式。这种方法的关键在于控制员对局势的掌控力，这通过充分准备的阶段（如简报或交接班阶段）、持续的监督，以及对任何决策潜在后果的敏锐洞察力获得。这种自我成就需求让他们的肾上腺素飙升。这激励着他们，在寻求扭转逆境时给他们真正的“兴奋感”。要达到这种高度，他们必须热爱在运行环境中工作，以及它带来的一切挑战和脱颖而出的机会，当然，他们首先必须是这份工作的合适人选。





  # 27 IOC 的组成


  ## 性情/气质


  上一节内容可能给人一种印象，即这些高绩效者必须在工作中时刻保持高度兴奋，并受到充分激励，才能产生上述成果。并非如此。之所以能实现高质量的解决方案，并非源于一系列忙乱的应对，即使身处混乱的中断之中也是如此。相反，这归功于熟练管制员所具备的审慎、深思熟虑的方法。


  毋庸讳言，IOC 有时会变得相当混乱。单独的常规问题按惯例处理即可，但复杂、多重且持续的情况终将考验所有管制员的意志。担任飞行员或空中交通管制员的基本要求之一是在压力下保持冷静，因为这些领域的决策至关重要。中断模式下
  IOC 的性质（高压、嘈杂、人多、多事件、目标冲突）要求采取类似的方法，需要极其坚韧果断的人员，他们能全面剖析问题，并构建经过深思熟虑的解决方案。这不仅意味着具备多任务处理能力，还意味着擅长同时应对多个各有特点的问题。他们需要在该条件下发挥最佳水平，因此需要展现出与之匹配的职业道德。


  ## 自我管理与团队适配


  在个人层面，身处此环境的个体需要保持良好的健康状态和体能。作为轮班工作者，开始时间各异，例如 0400、1200、1800 或 2300，每次工作时长在 8 到
  12 小时之间，必须充分认识到全天候工作的严酷性，以及它如何导致工作内外累积的疲劳和倦怠。与航空运行中的其他角色类似，需要充足的高质量休息时间来恢复。人员排班（应）在缓解疲劳影响方面发挥关键作用，但个人也需对最大化休息负起自身责任。操作环境中轮班工作者通常享有的一个优势是：他们知道在经历充满挑战且颇具压力的一个班次后可以离开工作场所，第二天返回时却面临完全不同的境况。自然，相反的情况也会发生。但“将问题留在工作中”交由接班人处理，是身心恢复过程的重要组成部分。


  # 28 IOC 的组成


  为了保持冷静专业的举止，同时仍坚定地完成任务，个人需要高度的自控力和行为规范。这包括对时间管理的审慎运用，以及正如后续章节所讨论的，利用短暂的休闲时间作为短期逃避/调节的机会。部分任务使管制员能够自主工作，在极少互动的情况下执行一系列活动。但绝大多数工作依赖团队，需要与性格各异的成员密切配合，包容团队成员各自的目标和工作方式，同时参与并贡献于
  IOC 的总体目标。高级管制员需要具备娴熟的领导技能，能在中断管理过程中带动他人，鼓励团队成员发挥创造力、机智和毅力。这对于确保合力朝着正确方向至关重要。


  ## 沟通技巧


  运行管制员的一项典型要求是不仅能沟通，而且要**沟通得极好**！这要求在倾听、解读、联络、谈判以及通报与运行相关的相关信息方面给予极度的重视。这也要求高度的理解力，以及使用恰当的语言和术语。有时，清晰有力地阐述论点，或说服他人认识并接受某种观点，也可能至关重要。“在任何层面都能清晰沟通”固然是一句陈词滥调，但在该语境下却高度相关。这意味着要与各式各样的人打交道，例如团队成员、公司高层管理人员、航空公司机长、空中交通管制、国家监管机构或外国政府代表等。因此，知晓信息的含义、需向谁传达以及何时传达可能至关重要。结果是，语言各异，沟通技巧各异，甚至对特定信息的相关性或重要性的强调也各异。因此，适应这些及其他影响所需的技能也相当多样，以适应不同情境。有时管制员需要面对各方之间的冲突，可能需要在某些决策过程中扮演维和者的角色。有时，知道如何以及何时说“不”可能是必要的，敏锐地察觉到需要将沟通范围扩大或上报至更高层级也可能是必要的。沟通的性质在一定程度上取决于个人必须行使共情的程度，同时完全意识到并敏感地捕捉其他各方的利益和动机。


  # 29 IOC 的组成


  ## 认知技能


  运行管制员（确实也包括调度员）任务的关键部分是在高压、极具挑战的环境下，运用高级思维过程来评估和解决复杂问题。有几种方式可以思考决策方法。一种方法主张个人遵循理性过程。


  ### 理性、演绎思维


  理性思维被描述为指“一种合乎逻辑的、循序渐进的、系统的决策方法”。3 这种循序渐进的方法可能具有优势的场景是针对经验较少、因此接触中断较少——尤其是复杂中断——的新管制员。在基础层面上，他们可以遵循一个简单的流程（甚至写下具体编号的步骤以辅助），以获取适当信息、与正确的人交谈、考虑多个选项，并选择一个首选方案付诸行动。这种方法可作为一种有用的培训工具，引导新管制员完成决策过程，因为它可能帮助他们在达成结果时考虑所有途径。但在大多数中断情况下，当然，生成和分析可能备选方案的时间极其有限。此外，情况不断变化，信息往往稀缺、不可靠、令人困惑或相互矛盾。还有其他局限性。个人可能过度专注于确保遵循每个步骤，从而忽视了对任务本身的关注。正式的、或许是书面的步骤无法涵盖所有事件，因此也存在可靠性缺口。因此，循序渐进的方法可能适用于某些简单情况，但在许多其他情况下可能行不通，导致对该过程合法性的怀疑。当发生复杂中断时，不仅可用时间有限，而且情况往往变化迅速。因此，信息也随之快速变化并迅速积累，以至于梳理大量材料以澄清重要且相关的信息可能过于困难。另一个论点是问题本身未必定义清晰。这意味着着手





  # IOC 的组成


  通过这种繁琐的过程可能不适合典型操作挑战的环境。这一缺陷暗示了使用替代决策方法的必要性。在问题结构不良、表现出不确定性和复杂性且面临相当大时间限制的环境中，直觉的使用通常更为普遍。


  ## 直觉思维——跳出框框思考


  具有直觉是一种个人特质，这对于 IOC 成员来说是高度期望的，至少应该是。它被描述为拥有“预感”或“直觉”，或者对某事可能行得通或行不通有一种感觉。经验更丰富的高级控制员通常具有高度的直觉。自然地，他们能够以逻辑方式处理问题的变幻莫测。但真正使他们与众不同的是一种近乎潜意识的能力，能够超越显而易见或已知的量，使他们能够察觉到特殊性——事物表面上可能显而易见，但不知为何就是看起来不对劲。这种判断对错、可行与不可行的能力是一种极其宝贵的天赋，以至于逻辑可能指引他们以特定方式行事，但他们却能感知到其他影响因素。


  例如，他们可能不会遵循通常采取的若干步骤（这对经验较少的控制员来说可能显而易见），而是本能地等待，感觉到某种不对劲，或者鉴于环境可能更有利。这种区分可辨别事物与更隐晦事物的天生能力是直觉思维的主要特征之一。


  “跳出框框思考”或“跳出方框思考”等表达多次被用来强调一种能力，即通过解除人类隐性设定的边界来概念化问题和潜在解决方案。从小，人类就被给定思考和行动的参数，并被训练据此操作，甚至如果超越这些限制会受到惩罚或解雇。因此，正如预期的那样，问题的潜在解决方案是根据控制员的经验和专业知识水平来解释的。


  新手或缺乏经验的控制员可能只看到问题的“黑白”方面，并决定看似简单直接的解决方案——例如，对一个表面上看似不可避免的航班实施延误。相比之下，更有经验且富有直觉的控制员可能感觉到延误可能不需要实施，也许是因为潜在的变化或其他影响。换句话说，这位控制员意识到过于狭窄的关注点可能只能部分解决问题，而部分解决方案可能来自隐晦或新出现的来源，甚至可能尚未被识别。


  当代软件包的复杂性（如甘特图驱动和显示的软件）意味着有时只需几个按键就能获得相当复杂问题的现成解决方案。这为中断恢复提供了支持，例如飞机和机组模式以及乘客行程等功能。然而，具有讽刺意味的是，这些工具在某些情况下实际上可能阻碍决策过程。它们会产生某种解决方案，这可能是可以接受的，在时间压力下可能是当时最好的选择。但这可能不是正确的选择，因此需要人工干预并显示出其重要性。丰富的经验，特别是直觉，在确定
  IOC 中中断软件建议解决方案的优劣方面起着至关重要的作用。


  例如，在影响特定港口（如天气）的情况下，问题分析阶段可能涉及过滤甘特图显示的信息，以便仅显示通过该港口的移动。这种视觉信息的限制会降低整体态势感知。也许部分解决方案可能是考虑靠近港口的移动（飞越或通过附近港口运行）。从这个意义上说，经验丰富、富有直觉的控制员对软件表现出健康的尊重，但仍对系统生成的结果保持警惕。


  # 解决问题的技能


  正如预期的那样，IOC 的主要角色是解决问题。这通常是对情况的反应性响应。但解决问题过程的一部分是对网络或受监控特定区域发生的事情保持永无止境的感知。


  ## 网络监控


  监控飞行计划的必要性显而易见，但除了从交接班或类似简报中建立初步感知外，持续的监督是保持对运营全面感知的主要手段。这部分原因解释了为什么经验丰富的控制员表现出对事件了如指掌的精通。没有中断时，监控就是观察出发和到达随着更新而变化。但这也是提前预测以计算天气变化等影响的情况。





  # IOC 的组成


  ## 监控与风险管理


  可能造成干扰的影响因素常见且频繁，因此监控工作变得更为紧张，旨在确定潜在的冲突和不和谐来源，这需要控制员投入大量精力。这种环境要求持续的风险管理流程。评估威胁或潜在干扰的有效性，关键在于时刻保持警觉和关注。


  例如，一个相对简单的天气情况（如单跑道机场的强侧风）会立即引发连锁反应。在控制员脑海中，会浮现诸如以下的问题：

  - 鉴于如果天气持续，备降至备选目的地的可能性很大，航班是否应在当前情况下继续飞行，还是现在就应执行备降？

  - 如果航班备降，对下一趟（返程或后续）航班有何影响，机组工时是否面临风险？

  - 如何安置（即营救）备降机场的乘客？


  因此，监控角色从未真正处于休眠状态。无论问题多么微小或看似微不足道，这类心理推演始终处于运行的最前沿。


  ## 问题识别与分析


  中断事件的发生，可能因从公认来源接收到的信息而被识别，也可能因原本可靠来源未提供信息而被识别。随后，控制员需识别问题的特征，确定其性质及对时刻表的潜在威胁。


  视问题类型而定，确保信息与相关 IOC 职能部门共享，对于达成共同理解至关重要。例如，在控制员眼中看似简单、孤立的单一航班延误，可能不会对飞机运行模式造成任何干扰，但却可能对机务部门产生重大后果。因此，需要团队协作，共享并基于共同信息采取行动，以正确识别并探究潜在和实际问题的所有侧面。这是
  IOC 结构完整性的基础。


  一旦问题显现，分析阶段将涉及对问题程度的全面判定。此时，控制员需要验证所收到的信息，特别是确保其来源可信，并质疑任何可疑信息。问题分析将邀请其他 IOC 成员参与，因此乐于接受他人的观点和建议至关重要，以确保分析尽可能透彻。资深控制员的技能在此阶段显现，体现在洞察真实与潜在机遇，并识别所需采取的行动。


  换句话说，问题分析不仅仅是设想事件发生时可能出现的情况。生成并评估各种方案的额外步骤——每个方案都有其预期结果和后果——同样重要，而这正是高度创造性和直觉性思维引领出更高级解决方案的地方。


  ## 问题决策点与实施


  决策过程的关键在于识别必须做出决策的节点。过早决策，信息可能不完整，或其他 IOC 职能部门可能未来得及提供充分意见；过晚决策，可选方案可能已消失。这是一项平衡术，由支撑问题的多种因素、可用于优化解决方案的时间，以及至关重要的控制员经验和专长共同决定。


  尽管上述列举了两种决策风格，控制员仍需确保已接收到足够信息，并考虑到任何可能的变化。然后，在适当咨询并权衡所有选项后，决策付诸实施，并将结果传达给所有利益相关者，包括客户。有时，控制员需要对自己的决策坚信不疑，并有意愿援引必要的选择，因为大多数决策都会产生赢家和输家。在复杂的中断中，选择最佳方案可能有利于航空公司的整体利益，但实际上往往需要妥协，导致时刻表的某些方面受损。


  ## 选拔合适人员


  控制员的合理招聘、甄选和培训，对 IOC 的高效、有效运作至关重要。然而，IOC 承认在寻找和留住合适人才方面面临巨大困难。受聘人员可以被教授如何遵循政策、操作系统，并接受领导力、沟通等方面的培训。但极难做到的是，教会个人如何在中断管理中取得成功。这主要是因为该角色所需的先天素质和特质。因此，首次就找到合适的人选至关重要。


  ## 招聘与甄选控制员


  潜在申请者的来源因航空公司的策略而异。实际上，其可选择外部或内部来源。


  ### 外部招聘


  若 IOC 选择外部招聘控制员，通常的搜索目标是服务于其他航空公司（国内或国际）的现任控制员，或从事相关职务并希望进入 IOC 领域的个人。但全球范围内优秀、经验丰富的控制员（且愿意搬迁）极其有限。资深控制员和调度员可能因不同的条件和薪酬、或在更大公司或国家拓展角色的机会而被吸引。另一方面，考虑到个人情况，他们可能不愿离开现有职位。因此，寻找此级别的经验人员日益困难。


  资历较浅的控制员则可能被吸引。值得注意的是，部分候选人甚至可能来自行业之外。例如，某地区性 IOC 曾面临巨大困难，难以吸引合格候选人来其所在城镇。为补救，他们发现招聘具有物流行业（木材采伐）背景的候选人——尽管其航空知识甚少——却取得了成功，因为候选人可留在成长的地区，而非搬往城市。这种方法的劣势在于外行术语的性质、缺乏与航空公司各利益相关方沟通的经验，以及适应航空高压环境的挑战。


  有时，合适的未来人才来源是飞行员、空管员或飞行服务主任，他们选择转行，或因医疗条件等原因职业生涯终结。他们在各自领域的知识和专长对 IOC 往往极具价值，因为他们通常了解航空规则、实践、程序、术语及影响高效运行的因素。他们大多经历过运行环境、其压力与挑战，习惯在压力下做出理性决策。确实，他们条理分明且规避风险。因此，只要他们也具备上文提及的“跳出框架”思维技能，他们的思维模式就应支持
  IOC 环境所需的关键思维过程。


  其他来源可能包括学习航空管理或类似学位的大学生。由于极少或没有接触运行环境，他们的即时价值可能更多在于 IOC 的支持岗位，但他们可能在早期就被识别为未来角色的有潜力人选，因此一条最终通往
  IOC 角色的职业路径对个人极具吸引力，且






  # 国际奥委会的组成 / IOC 的构成


  ## 35 国际奥委会的组成 / IOC 的构成


  为航空公司带来更长远的生存能力。学生还可能带来互补技能，例如分析和研究能力，这些在 IOC 中通常不易寻觅，因此，如上所述，一些 IOC 招聘高素质（博士）学生的案例，并非为了运营目的，而是为了复杂的探索性系统和绩效分析。


  ### 内部招聘


  如果 IOC 寻求内部招聘，通过航空公司的人员管理部门（人力资源或人事部门）通常能带来优势，即对员工及其过往和现有角色、绩效有一定的现成了解。此外，员工档案将更充分地为招聘流程提供信息，并有助于在一定程度上缩小候选人范围。此类搜索的重点通常集中在已接触过业务运营侧的人员，例如机场相关、客户服务、或规划与资源配置角色。特别是，通过先前招聘进入乘务领域等途径，可能已经为进入
  IOC 铺平了道路，这使候选人接触到了中断——尤其是乘务中断——并考虑到了飞行员或空乘人员雇佣协议的变数及其他法律要求。这条屡试不爽的途径为运营角色提供了极佳的基础。有时航空公司设有毕业生培训计划，促进跨多个航空公司部门积累经验。有时这些可能包括
  IOC 角色，尽管多为初级职位。虽然匹配过程可能无法立即解决 IOC 对“合适人选”的担忧，但该个人至少能获得一个宝贵的机会窥探中心的运作，即使只有三到六个月。


  ## 36 国际奥委会的组成 / IOC 的构成


  ### 选拔流程


  选拔流程通常由人员管理部门发起，他们将通过筛选名单缩小候选人范围，并可能自行进行初步面试，IOC 管理层通常在进入候选人短名单后才参与其中。面试候选人提供了一对一的机会，以评估个人的多项特征并建立基本信息，如背景、领域知识和过往经验。通过纳入行为导向型问题，利用过往绩效作为预测未来行为的工具，可以增强这一过程。此外，提供模拟问题可引发候选人的思维过程和阐述合理、逻辑性回应的能力，这比初步面试更有利于探索技能组合。使用模拟工具（镜像
  IOC 中使用的实际系统要素）提供一系列生成的运营情景，是深入挖掘这些思维过程的进一步手段。结合一套根据既定基准衡量绩效的可信方法，这一高级工具有助于确定问题可能被如何看待以及可能的反应模式——即识别什么似乎是“自然反应”，这在常规面试过程中很难察觉。这种工具使得加权标准可以逐案操纵，从而能以更严格的方式探索高度期望的属性。


  ### 推荐信与推荐人核查


  依赖书面推荐信的背景调查很少有多大益处，因为它们总是以最积极的角度撰写，无法真实洞察个人。迄今为止，首选的方法是从推荐人名单中挑选，并使用一套定义明确、具有探究性的问题，鼓励推荐人做出恰当回应。将过往行为与未来绩效联系起来的行为问题可能产生合理的结果，前提是问题经过适当修改以适应候选人的特定背景，而非使用通用问题集，因为其中许多与目的无关。例如，请推荐人描述“Johnny”的性格价值非常有限。但与某人的生活技能（他们切实可能经历过的事情）相关且与
  IOC 紧密相关的，则是更有针对性的问题，例如：“您上次看到‘Johnny’应对棘手问题是什么时候？他实际做了什么？他是如何着手解决的？他在哪些方面表现了主动性？他有多大创造力？他在坚持解决到底方面有多执着？”


  ## 37 国际奥委会的组成 / IOC 的构成


  ### 培训管制员


  IOC 中管制员的培训形式多样，可能取决于管制员之前的角色和经验水平。当然，有些人会带着多年的运营经验，甚至一些管理经验加入航空公司，而另一些人可能相对缺乏经验。尽管如此，大多数培训议程都从某种形式的入职培训开始，这提供了公司概况、架构、文化与规范、公司政策，以及更详细的运营介绍，包括架构与汇报线、机队特性、港口信息、航空公司惯例与程序、气象学、运营系统等。


  #### 在岗培训


  IOC 通常没有正式的培训计划。在入职培训之外，管制员通常会被引入工作的细节元素，学习正常和非正常运营、支撑二者的因素及其后续管理。“课堂”式教学可能是初始培训阶段的一部分，相当详细地涵盖这些及其他大量信息，可能持续数周。但知识的转化真正在实践性、动手操作的方法中结出果实，即学员与一名现有管制员配对，在一段时间内有效地镜像其排班。这种“师徒制”培训方法可以说是
  IOC 中最常用的方法，使管制员能向导师学习数周。前提是经验丰富的管制员是称职的培训师（即有动力传授知识，且重要的是传授完成任务所需的特定技术），且培训师与学员之间的关系融洽，那么知识转移就很可能发生，特别是如果资深人员能阐述合理的认知过程。但师徒制培训也有缺点。该方法通常依赖于仅从一个人身上学习技艺，将该人的态度和习惯（好与坏）传递给学员。这显然依赖于导师的兴趣和投入程度（即充满激情且引人入胜的方式，对比奉命看护和指导的方式）。一种轮换制方法，即学员在各自的期限内跟随几位经验丰富的管制员，可以消除其中一些顾虑。随着时间的推移，任务逐渐由学员执行，指导管制员仅进行指导或观察。一旦“签署放行”，学员即可胜任更固定（但仍为初级）的角色。随后有一段试用期，在此期间，航空公司和个人都需要评估这段关系的价值。毕竟，只有双方都建立起成功的匹配，匹配才算发生。确定一名管制员的价值通常是一个至少需要
  12 个月的过程，也取决于其接触各种复杂情况的程度，从而取决于所行使的问题解决和决策程度。





  # 38 IOC 的构成


  ![](img/bg3d.jpg)


  ## 复训


  虽然初始培训对于确保受训人员获得足够的知识和指导以建立基本任务至关重要，但复训（如年度、两年一次）往往被忽视。然而，复训可能极其有益，特别是在大幅增长或变化的航空公司，或其系统变得更具技术能力的航空公司中。这种高级培训的重点可能在于高级问题解决或决策制定，或人员管理、谈判或领导力等较软性的技能培训。更正式的课程肯定会提供相当深度的信息，而在监管机构批准的航空公司签派课程的情况下，如果这还不是航空公司的要求，则可提供执照（如适用）。


  ## 飞行签派员


  IOC 雇佣签派员执行关键职能。在美国体系中，飞行签派员是根据 FAA 法规持证的航空人员，并“与机长共同[行使]对飞行的运行控制责任”。5 因此，飞行实施的法律责任落在机长（有时称为指挥员）和签派员之间。一些非美国国家的航空公司采用这一体系，要么为其
  IOC 配备持有 FAA 执照的签派员，要么承认其签派员持有本国管辖范围内的国家签派执照，但级别不及 FAA 执照。其他国家（如澳大利亚/新西兰）根本不要求签派员持有执照。关于飞行签派员任务和流程的更完整描述，请参见
  Kim (2018)。6


  ### 角色


  无论监管依据如何，调度职能内执行的任务（包括飞行计划、飞机重量平衡、飞行签派和飞行跟踪（或监控））均分配给签派员，无论该人员是否持有执照，如上所述。无论采用何种体系，签派员的角色在
  IOC 环境中都至关重要，负责通报并纠正因飞机性能限制、任何其他运行限制或时刻表潜在中断而导致的问题。


  # 39 IOC 职责构成


  签派员的职责涵盖与航空公司运行相关的许多关键方面。首先，该角色负责飞行计划流程，即编制并发送最优、省油的计划，考虑因素包括航线的高效快捷规划、双发飞机延程飞行（ETOPS）要求、运行任何阶段的天气状况、设备短缺或问题、出发、途中和到达港的机场条件，以及任何空域问题，如空域关闭（如因军事、资源问题或政治影响），或其他影响飞行的问题。其次，该角色负责飞行跟踪，采用监控流程监视每个飞行的进展，特别注意并通报因管制要求或航路或目的地天气条件变化而导致的任何重大变化，这反过来可能改变机上燃油状况。这实际上意味着一个持续的风险评估过程，时刻寻找潜在迹象，这些迹象可能破坏原本常规的飞行阶段。上述因素的任何变化可能都需要签派员进行某种形式的干预，要求与一个或多个受影响或可能受影响的飞机、或管制、或机场进行沟通，然后根据需要采取某种形式的积极行动（如发起或同意决定备降航班）。


  ## 知识


  从事签派职能的人员需要具备卓越的运行知识。这包括对航空业运行所在监管框架的全面了解。还要求彻底理解关键信息来源，如公司的政策和程序、运行手册集（如飞机性能）、标注运行限制或差异的方法（如最低设备清单（MEL）和构型偏差清单（CDL））、现有的机组合同和协议（如用于疲劳管理的疲劳风险管理体系（FRMS））、管制规则和程序等。在美国，持证签派员必须完全知悉管辖飞行运行的相关联邦航空条例（FAR）。航空知识库延伸至对天气现象有广泛熟悉和理解，以及用于提供气象警告和建议的各种众多方法、协议和符号（如
  SIGMET、PIREP、TAFOR——见常用缩略语表）。此外，对可能影响计划航线空域或机场设施（如跑道长度、机场在建工程、障碍物、塔台工作时间变更）的任何 NOTAM（飞行通告）的知识和当前关注，可能成为关注的来源，引发类似前文描述的讨论和行动。视航空公司适用的安排而定，签派员还可能协商等待时间、组织航线许可或运行许可，并安排服务延伸，但这些任务也可能归机场的航空公司员工管辖。


  ## 技能


  除了理解任务所涉及原理所需的数学和略带科学的思维外，签派员与运行控制员类似，需要展现高水平的理性和直觉思维，以适当且完整地管理流程。该角色要求在行业各层面都是优秀的沟通者，因为此时可能与机场经理联络，下一刻与管制谈判，然后可能不得不与高级机长简报并讨论可能的卸载、油量数字或备降策略。为了做到这一切，该角色还要求高水平的人际交往技能，以及在公开展现冷静和控制力的同时承受压力的能力。与
  IOC 其他关键职能领域（如气象、维修、载荷控制、货运和商务领域等）互动、谈判、影响，有时接受建议的能力至关重要。


  ## 维修监控


  维修监控（或维修控制）负责通过确保机械性能和可靠性标准的持续性，维持航空公司机队在整个网络中的适航性。设在 IOC 内部，为运行决策者和维修专业知识之间提供了主要接口。该角色要求高水平的沟通，可能包括与网络周围的维修资源以及第三方承包商联络。





  # IOC 的组成


  ## 维护



- '## 第 5 章：基于场景的信息流


  ### 简介


  第 5 章专门编写，旨在帮助弥合本书第一部分基础章节与后续场景章节之间的差距。第 2 章的图 2.1 展示了 IOC 中参与者之间的关键内部关系。所包含的职能领域范围并非详尽无遗，当然因航空公司而异。但主要目的是理解在航空公司运行环境中需要承担的众多职责和任务，无论角色是否如图所示分离，还是包含在少数个人的控制范围内。第
  5 章的主旨是展示如何将仅有的几个选定主要角色扩展，以解释不仅 IOC 参与者之间，而且就集团外部的支持和互补角色（如高级员工、支持人员、角色专家和外部组织）发生的更深层次的沟通和参与。还需要牢记的是时间就是生命，因此所有这些沟通都需要尽可能快地发生。主要角色的选择反映在图
  5.1 中。


  ![](img/bga1.jpg)


  ### 摘要


  航空公司主基地发生工程中断。IOC 已被维护监控告知一架飞机的技术问题。此时，现场工程师无法提供预计解决时间 (ETS)。


  ### IOC 角色


  图 5.1 中选定的角色呈现了图 2.1 列表的大幅缩减版，仅显示卷入此特定问题的少数关键职能。自然，在管理中断的过程中可能会有更多角色参与，这将在后续章节中展示，但当前场景中披露的角色集中在几个关键领域。图
  5.2 至 5.7 将这些职能领域呈现为“联系线索”，揭示了一些支持角色和关系。必须考虑到所有航空公司差异很大，因此显示的角色、头衔和层级数量以及“线索”差异巨大。毫无疑问，这些图表中的每一个都可以大幅展开，但此处展示它们是为了至少提供对这些关系的基本理解。


  **关键角色：**

  - 运行控制

  - 载荷控制

  - 飞行员排班

  - 乘务员排班

  - 流量/时隙控制

  - 客户旅程管理

  - 机场

  - 维护监控

  - 航班调度

  - 领航/飞行计划


  ![](img/bga2.jpg)


  ### 工程联系线索


  中断是一个工程问题，因此维护监控（在 IOC 内）是整个中断期间初始建议和后续发展的核心。正如书中早前提到的，确保信息有效且来自适当来源，对中断管理的完整性至关重要。有时，信息可能来自港口善意但消息不灵通、无工程资质的员工。信息可能是正确的，但在经授权工程人员验证之前，依赖它充满危险。这是将维护监控设在
  IOC 内的一个关键原因。维护监控与工程值班经理（后者依赖现场工程师的专业知识）之间的沟通渠道，或如果聘用第三方承包商则是其对应渠道，可以迅速评估问题性质并将其传递给运行控制员。工程职能内的另一个职位可能更侧重于工程运行支持，与机型或发动机类型保持联系。


  **工程联系线索：**

  - 运行控制

  - IOC 维护监控

  - 工程经理

  - 运行运营支持（技术）

  - 飞机/发动机制造商

  - 工程值班经理（机场）

  - 型别专家

  - 现场工程师

  - 签约第三方供应商





  # 场景化信息流


  ## 维护监控


  专家，在某些情况下直接与制造商联系，如图 5.2 所示。维护监控在场景中的作用是确定问题的确切性质，并与支持角色协作，确定让飞机在最短时间内恢复适航所需采取的措施。这可能意味着需要零件和其他设备来修复或更换组件。如果问题严重，需要大量工程支持，也可能需要卸下乘客和行李，并将飞机拖至机库。因此，维护监控人员与其他工程角色之间的沟通和行动至关重要。


  ## 机组与乘务员排班联系轨迹


  面临即将发生或已知的航班问题时，当天的机长/副驾驶排班员和乘务员排班员对任何与机组相关的问题都有深入了解，例如：机组人员从何处为航班报到、他们的签到和值勤时间、限制、分配的值勤要求（即他们为该航班执行的具体角色）、航班衔接（往返该航班）、过夜基地和次日承诺等。重点显然是管理与当前航班相关的机组编制。他们可能已经在与机上执行机组人员交谈，以确定限制或请求更改现有排班表。此外，两个排班部门都可能正在评估进一步中断的可能性，甚至在这一早期阶段就评估为当前航班（如果延误过长或需要取消）和任何可能受影响的后续航班寻找替代机组的方法。为此，他们可能会仔细检查机组成员记录，以确保任何值勤变更合法，且符合工作惯例、公司疲劳管理系统和雇主协议。


  协助排班员的是“运行日”支持人员，他们的角色可能包括更深远的影响，例如机组人员脱离模式、在“基地外”结束值勤，或无法前往培训任务等。这些支持职位有时可能需要咨询特定角色的专家，如值勤机长（飞行员排班）、机队行政人员和工会官员。


  图 5.3 和图 5.4 分别描绘了飞行员排班和乘务员排班的联系轨迹。


  ![](img/bga4.jpg)


  **图 5.3 飞行员排班联系轨迹**


  ```

  Ops Control IOC

  Pilot Crew Scheduler


  ## 第 152 页：备降影响分析


  `IOC` 现在有若干问题需要考虑。首先涉及备降飞机。


  a) 飞机抵达 `ORD` 后，加油并尝试飞回 `JFK` 是否值得？很可能会面临类似的 `ATC` 等待时间（甚至更糟，因交通积压），前提是 `ATC` 根本提供时隙。即使可行，机组是否有足够执勤时间飞行这一额外航段？


  b) 就机上总客源而言，`IOC` 还需确定有多少客户是 `DXB-JFK`，多少是 `DXB-LAX`。（如果航空公司拥有美国境内运输权，另一考量将是任何预订
  `JFK-LAX` 的客户。）在当前场景中，194 名客户目的地为 `JFK`，135 名为 `LAX`。无人预订 `JFK-LAX`。


  c) 若飞机滞留 `ORD`，是否有住宿安置这 329 名客户？即使住宿随时可用，这些客户如何及何时从 `ORD` 转运回 `JFK`？站长连同 `CJM` 团队，将在确定恢复方案后处理此类情况。


  d) 机组在 `ORD` 可能超时，无法驾驶飞机返回 `JFK`，飞机也无法继续执行 `811` 飞往 `LAX`（因为 `JFK-LAX` 航班的机组在 `JFK`）。`Crewing`（乘务调度）将知晓备降
  `ORD` 及飞机不太可能立即返回 `JFK`，以便（1）他们知道入港机组现在将在 `ORD` 结束任务，超时且脱离岗位，无法履行下一次执勤任务，（2）他们可以阻止新的
  `811 JFK-LAX` 机组报到，至少直到确定恢复计划。


  e) 备降导致三个进一步问题：首先，`DXB-JFK` 和 `DXB-LAX` 客户目前无法按计划抵达目的地。其次，329 名本不应滞留 `ORD` 的客户被困在那里。第三，飞机在
  `ORD` 终止，导致 `LAX` 无飞机执行 0700 的 `830 LAX-JFK`。


  f) `IOC` 需确定附近是否有可用飞机，并向两个 `Crewing` 职能部门确认附近是否有可用机组或可调配机组





  # 天气场景：JFK 机场降雪


  ## 第 153 页


  ### 更新 @ 1930 UTC


  查看甘特图（图 6.3）可发现相关问题。


  a) 当前时间约为 1930，航班 840 LAX-JFK (WBC) 即将起飞（计划 2015 起飞）。鉴于 811 航班已备降，需要提出的问题是 840 是否应准点起飞、延误，甚至是否应执飞。


  b) 840 需携带数小时的 JFK 盘旋燃油，预期能够着陆。飞行时长为 5 小时 15 分钟，因此 0130 的预期天气将决定那时着陆的可能性。鉴于当前状况和预报，将规划一个或多个备降场，执行该航班当然能确保有一架飞机供
  840 航班继续飞往 DXB（前提是它能先在 JFK 着陆）。


  c) 进一步检查图表发现，紧随 840 之后还有一个 LAX-JFK 航班，计划于 2130 从 LAX 起飞。这是 852 (WBD)。


  d) 这两个航班能否合并（即总客票量是否适合一架飞机？），因为一种想法可能是考虑只派一架飞机去 JFK，另一架去 ORD 救援 WBB？


  e) 合并后的客票量为 350（FLT840 上 147 人 + FLT852 上 203 人），均可容纳于该机型。因此，一个选项是取消其中一个航班。倾向于取消
  840 LAX-JFK 而非 852 LAX-JFK，因为 840 的旅客已在登机口（起飞前 45 分钟），而 852 的旅客仍在航站楼办理登机手续，无法及时赶上两个航班中较早的那个。此外，也有保持
  852 按时运行的最佳机会。


  f) 合并航班意味着立即停止 840 的放行流程，直到制定出完整计划。由于涉及众多 IOC 职能，以及航站楼的机场员工和正在准备飞机的停机坪员工，这可能需要相当长的时间。在
  1930 时，840 即将开始登机，仍在装载货物、行李和餐食，也可能正在加油。


  ## 第 154 页


  g) 另一个考量因素是飞机重量。例如，合并载荷，加上 LAX-JFK 所需的高燃油量（含盘旋时间和备降备用燃油）可能导致飞机超重，尤其是着陆超重，因此需与载荷控制/调度（视航空公司而定）联络以确认此事及任何必要措施。携带该燃油量对于满足运行条件至关重要，因此唯一的灵活性在于调整载荷。在这种情况下，旅客和行李将优先于货物，还必须考虑
  JFK 停机坪的实际状况；明智的做法是限制任何地面处理流程，以尽量减少对人员和设备的风险。载荷控制/调度关于飞机究竟有多重、哪些限制可能被超越的回复，可能进一步影响
  IOC 决策。当然，840 机长已在机上或靠近飞机，因此可就最终重量和任何限制进行咨询。


  h) 最后，执行救援计划所需的机组将导致一些机组脱离原计划排班，这可能影响他们返回基地或造成其他下游变动。这属于乘务职能解决的范畴，但如果机组能在当时协助恢复流程，这仍可能成为最优解决方案的一部分。


  i) 这只是解决方案的一部分，因为还需考虑如何处理 ORD 的飞机，以找到再次“匹配”排班的方法。如果 WBD 852 按时运行，该飞机直接继续飞往 LHR。然而，由于
  JFK 无飞机执行 840 JFK-DXB，还需进一步变动。


  j) 扫描图表将快速识别可能在国内运行/跨国运行的任何其他飞机（如 WBA 和 WBE）。在这种情况下，牺牲它们的运行会被迅速否决，因为没有收益，实际上只会造成进一步混乱。尽管如此，经验丰富的管制员非常了解其整个网络运行——这就是班前简报后熟悉阶段的价值，这种方法正是资深管制员区别于他人的地方。


  ## 第 155 页


  ### 更新 @ 1945 UTC


  综合考虑各项输入，权衡最优旅客恢复流程，并确保在维护时刻表完整性方面取得最佳结果，IOC 现可制定计划付诸行动以解决问题并恢复运行（基于已知信息且假设无进一步变动）。该计划可能包含以下内容（如图
  6.4 所示）：


  a) 取消 840 LAX-JFK，所有 147 名旅客安排乘坐 852 LAX-JFK（这些旅客延误 75 分钟）。此项行动需高度优先，以确保 WBC 卸载，合并载荷尽可能高效地装上
  WBD。理想情况下 852 本身不延误。


  b) 取消 811 JFK-LAX。（当然，现在 JFK 无飞机执行该航班，且该航班无始发旅客。）


  c) 随 840 LAX-JFK 取消，WBC 可用于执行摆渡或定位飞行，航班号 9901 LAX-ORD（航空公司为此备有备用航班号），使用 840 全体机组（驾驶舱机组和乘务员），起飞时间可能在
  2100。该飞机随后执行备降的 811 航班（作为该航班的延续段）飞行 ORD-JFK 段（显然——视该飞机到达时 JFK 天气而定），从而将所有 DXB-JFK
  旅客送达目的地。这也提供了一架飞机执行 840 JFK-DXB，尽管延误约 135 分钟（如图 6.4 所示）。


  d) 对于仍滞留 ORD 的 135 名 DXB-LAX 旅客，选项将归结为 CJM 团队与 ORD 地面代理之间的决定（因这非航空公司标准港口）。他们可被分流至其他国内航班，但需注意，对部分旅客而言
  LAX 可能非最终目的地，故将为其制定专门的行程恢复方案。或者，视下一点而定，若乘务员可执飞该航班，他们可搭乘 9902 ORD-LAX。


  e) 将尝试安排首个可用机组乘坐商业航班死头（定位）至 ORD，以执行 9902 ORD-LAX。这可能是原 811 JFK-LAX 机组，前提是有合适航班运行且能在当前天气下从
  JFK 起飞。或者，LAX 可能有机组可死头





  \n# 165 天气场景：悉尼雷暴\n\n![](img/bgbc.jpg)\n\n## d) 地面天气条件仍有利于 RWY 34L/R，机场对所有运行开放，尽管已开始降大雨，风速增加。考虑到收到的关于其燃油储备和\
  \ ATC 盘旋要求的信息，NBM 备降并不令人意外。根本考量是飞机的下一趟任务，而乘务组考虑机组任务，CJM 团队考虑 SYD 以外的中转联运。CJM 团队还将开始研究如果\
  \ IOC 需要将飞机调往他处，如何将 CNS-SYD 旅客送达 SYD。该飞机目前承担 304 SYD-BNE 任务（**图 7.3** 中用“x”标示），随后执行国际航线\
  \ 702/705 BNE-NOU-SYD，随后受 SYD 宵禁限制。\n\n## 更新 @ 1125 EST\nSYD 港口协调员传达下一更新。\n\n###\
  \ a) NBQ 刚因终端风切变复飞，已备降 CBR（ETA CBR 为 1220）。\n### b) NBO 即将进近。\n### c) 不确定 WBC 位置；正试图从\
  \ ATC 获知。\n### d) NBR 获准额外盘旋 10 分钟（盘旋至 1210）。\n### e) NBN 获准额外盘旋 20 分钟（盘旋至 1245）。\n\
  \n在 IOC 中，CJM 团队通报 NBN 322 CBR-SYD 搭载 45 名澳大利亚和努美阿政府高级部长及其部门工作人员组成的联合代表团，经 322 CBR-SYD/304\
  \ SYD-BNE/702 BNE-NOU 前往努美阿。有了这一最新信息——特别是备降航班和政府要员出行，IOC 需考虑直接影响，特别是 NBN 在 SYD 落地的可能性。甘特图可能会按**图\
  \ 7.3** 所示更新。\n\nNBQ 备降 CBR 导致 SYD 又一架飞机短缺，这次是执行 217 SYD-MEL（在**图 7.3** 中用“x”标示）。随着\
  \ SYD 地区损失两架飞机，IOC 将开始考虑取消航班以重新平衡航班。问题的有序考量可能如下：i\n\n\n\n\n\n# 天气场景：SYD 雷暴\n\n##\
  \ 场景分析\n\n### a) NBQ 备降 CBR\n\n`NBQ` 备降 `CBR` 后，该飞机要么只需加油即可执飞返回 `SYD`，要么取消一个 `SYD-CBR`\
  \ 航班。让 `NBQ` 返回 `SYD` 的问题因 `SYD` 天气状况恶化及随之而来的盘旋积压而加剧，因此极有可能需要数小时。因此，考虑的方案可能是取消 `323\
  \ SYD-CBR`（当前由 `NBO` 执飞），通过调换飞机循环，安排 `NBQ` 执飞 `335 CBR-MEL`，这将是一个现成的解决方案，也有助于保留该飞机当前飞行循环的后续时刻表。如果\
  \ `NBQ` 不加油飞回 `SYD`，将搜索订座系统以确定 `CBR-SYD` 是否有可用座位接运 `HBA-SYD` 旅客，最好是安排在下一个 `CBR-SYD`\
  \ 航班上（或必要时安排在竞争对手的航班上），同样也要想办法接运 `323` 航班的 `SYD-CBR` 旅客。`SYD-CBR` 旅客实际上可以全部安排在 `1630`\
  \ 起飞的 `327` 航班（`35` 个座位）和 `1950` 起飞的 `329` 航班（`123` 个座位）上。然而，`CBR-SYD` 方向（`328`\
  \ 航班，`1805` 从 `CBR` 起飞）仅有 `14` 个座位可用。由于 `CBR-SYD` 公路行程约四小时，可行的旅客恢复方案可能包括使用大巴车 `CBR-SYD`\
  \ 接运许多备降的 `380 HBA-SYD` 旅客。\n\n### b) NBM 备降 OOL\n\n`NBM` 备降 `OOL` 导致 `SYD` 缺乏飞机执飞\
  \ `304 SYD-BNE`，扫视飞机利用率表可知，这是一个关键航班，因为其在 `BNE` 的地面时间（`2` 小时）内，飞机需要卸货、从国内航站楼拖拽至国际航站楼，并为国际航班（`702\
  \ BNE-NOU`）做准备，这比国内航班需要更多的准备工作。延误该航班在 `SYD` 也有宵禁影响。\n\n### c) NBM 调机考量\n\n`NBM`\
  \ 的主要考量是：是否将该飞机调机 `OOL-BNE`，以便其能按时刻表执飞 `702/705 BNE-NOU-SYD`；还是应加油立即飞往 `SYD`，这能保证\
  \ `CNS-SYD` 旅客无需进一步中断即可抵达 `SYD`，同时也弥补 `SYD` 地区日益增长的飞机短缺。此外，若其他飞机从 `SYD` 备降，这也可作为一种保险。雷暴通常持续时间和影响有限，如果\
  \ `NBM` 于 `1230` 从 `OOL` 起飞，飞机要直到 `1400` 才能到达 `SYD` 地区，那时雷暴早已过去。由于该航段比 `CNS-SYD`\
  \ 短得多，可搭载更多燃油，从而拥有更长的盘旋时间（如有必要）。\n\n### d) NBN 状态考量\n\n`NBN` 的状态现在也起作用了，因为（i）它已获指令进一步盘旋，现在已非常接近备降\
  \ `CBR` 的最晚时间；（ii）机上搭载前往 `Noumea` 的政府代表团。`IOC` 内部的多个思路可考虑以下选项范围。\n\n#### i. 选项 1：NBN\
  \ 备降 BNE\n\n首先可能请求 `NBN 322` 机组计算能否使用 `BNE` 作为备降机场而非 `CBR`，如果可以（考虑到 `BNE` 比 `CBR`\
  \ 距离更远），那么他们的最晚备降时间会是何时？`NBN` 备降 `BNE` 有其优点——既能保证 `702 BNE-NOU` 按时刻表有飞机执飞，更重要的是便于政府代表团衔接。权衡之处在于，会对该航班上其他\
  \ `CBR-SYD` 旅客造成影响，他们将经由 `BNE` 旅行，然后需安排在下一个可用的 `BNE-SYD` 航班上（即 `307 WBE`，有 `114`\
  \ 个空座），将于 `1750` 抵达 `SYD`。\n\n#### ii. 选项 2：NBN 备降 CBR 后返回 SYD\n\n如果 `NBN` 无法使用\
  \ `BNE` 作为备降，第二个选项是飞机备降 `CBR`，加油，然后天气允许的情况下飞回 `SYD`。然而，此选项重演了上述 (c) 所述情况，要求 `NBM`\
  \ 调机 `OOL-BNE` 执飞 `702/705 BNE-NOU-SYD`，导致 `CNS-SYD` 旅客要么滞留 `OOL`，要么被送至 `BNE` 等待下一个可用航班前往\
  \ `SYD`。\n\n#### iii. 选项 3：NBN 备降 CBR 后飞 CBR-BNE\n\n如果 `NBN` 备降 `CBR`，第三个选项是取消 `322\
  \ CBR-SYD` 并让飞机直飞 `CBR-BNE`。`NBN` 正在 `SYD` 南部盘旋，若立即备降，约 `1215` 到达 `CBR`，约 `1245`\
  \ 再起飞，`1425` 到达 `BNE`。这可能导致 `702 BNE-NOU` 小幅延误，但能提供飞机并便于政府代表团衔接，如前所述。`322 CBR-SYD`\
  \ 旅客则按上述要点 (a) 所述方式安排。\n\n## 更新 @ 1128 EST\n\n`SYD` 港口协调员通报以下更新。\n\n### a) NBN 机组回复\n\
  \n`NBN` 机组已回复请求。他们确认可指定 `BNE` 为备降机场，但必须在 `2` 分钟内决定备降。\n\n### b) NBO 复飞\n\n`NBO`\
  \ 刚因强侧风复飞。`NBO` 燃油仅够再进近一次，之后必须备降 `OOL`。\n\n### c) WBC 盘旋\n\n`WBC` 现又在场区南侧盘旋。预计 `30`\
  \ 分钟内不会进近。\n\n## 图 7.4：SYD 天气 – 状态 @ 1130\n\n```\n.. .. .. ..13... .. .. .. .. ..\

- '# 2 IOC 的组成


  ## 简介


  IOC 的组成在一定程度上取决于航空公司的规模和复杂性。一家小型支线航空公司可能拥有一批多技能专业人员，包括运行控制员、运行主任或调度员（见下文），他们可能发现自己既负责航空器调动，又要负责机组排班和资源调配、时刻编排以及许多其他活动。设施可能相当小，因此不太可能包含大型中心通常拥有的许多正式职能领域。人们很快就会意识到，这些小型中心的个人需要在一系列活动中表现出高度的熟练程度，拥有跨越多个专业领域的广泛而详细的知识，并在航空公司的多个层面进行广泛沟通。相比之下，在大型航空公司常见的大型中心中，员工和职业的多样性会相应增加。在这些中心，专业知识高度细分，对应的职能活动包括运行（或调动）控制、调度、机组资源、机组计划、工程（维修监控/控制）、CJM、机场协调、时刻管理、气象等。伴随这种程度的专业化，需要更高水平的专业知识。例如，处理法规限制、飞行员或乘务员劳工协议，需要一丝不苟的知识和经证实的解释与应用规则的能力，以管理高度的复杂性。在这种环境下，错误应用的风险可能对航空公司产生重大影响。以下是
  IOC 关键组成部分及其角色的细分和描述，特别强调运行控制员的角色。有些 IOC 可能不包含所述的某些职能，而其他 IOC 可能包含更多此类角色，或可能以不同的名称描述它们。





  # IOC 运行控制职能的组成


  ## 运行控制职能


  ![](img/bg28.jpg)


  运行控制职能（有时称为动态控制或飞机控制）通常是 IOC 的核心焦点。它通常实体位于 IOC 的中心位置，以便被确定并视为活动的核心，从而便于与关键职能领域进行即时沟通，并利用周围的专业知识采取协作方式解决问题。值得注意的是，不同
  IOC 之间在人员职称和个人职能方面存在差异。在某些司法管辖区（如美国），运行控制员实际上是飞机动态控制员（也称为调度员），主要负责监控和调整飞机运行模式，视情况寻找更换飞机注册号/尾号的机会，并参与与停坪调度、载荷控制、工程、乘务、时隙控制和流量管理等部门的联络工作。然而，在这些司法管辖区之外，控制员拥有更大的投入和决策参与权。由于部分航空公司机队规模庞大，运行控制职能常被划分，以限制个人管控的航班数量。这种职责划分可能导致根据国际/国内航线、长途/短途运营，或按地理区域隔离系统来分配航班管控权。进一步的细分可能与机型相关。鉴于本文旨在聚焦运行控制职能，下文将详细讨论该任务所需的角色、特征和个人素质。


  ## IOC 高级管理层


  IOC 的高级管理结构将形成某种层级，最高层（通常称为副总裁 (VP)、总监、集团经理或运行总监）通常直接向航空公司 CEO 汇报。其下通常设有 IOC 经理或运行经理，再下则是若干轮班值班的值班经理，负责监督日常运行。此外，下属管理人员可能负责运行绩效分析、系统与
  IT 开发或其他相关职能。IOC 管理层的关键职责是确保航空公司安全、合法且高效的运行绩效。这意味着需遵守相关航空法规（全球范围及航空公司注册国的法规）、公司政策与惯例，以及适用于员工和其他人员的各类行业裁决。虽然本文承认包含航空公司运行控制部门的更广泛层级，并阐述了高级管理团队的职责分工，但其重点主要在于日常运行管理。因此，在探讨运行控制职能的履行时，范围向上限定至
  IOC 值班经理级别（见下文）；即轮班中对整个 IOC 日常运行活动具有直接影响的最高职位。这将恰当地界定相关群体的范围。


  ## 内部关系


  如果将 IOC 比作一个车轮，那么轮毂包含拥有整体决策权的中央监督职位（如值班经理或管理团队），而轮辐则描绘了实体内的关键职能领域。IOC 概念的成功得益于关键决策、职能科室或部门的纳入。这些科室大多由合格且经正式授权的决策者在
  IOC 中代表，而各科室的支持团队（规模更大）则位于外围。例如，IOC 内将有来自技术（飞行员）乘务和客舱乘务科室的若干人员，他们有权做出日常乘务运行所需的相关决策。其他相关角色，如乘务编组或排班活动，将位于这个核心小组之外，因为这些角色要么发生在运行日之前，要么不属于处理扰乱的决策者职责范围。同样，其他职能领域也将在靠近中心轮毂的位置设有授权代表，支持角色则设在附近。当然，IOC
  的构成取决于航空公司的规模和结构，以及纳入各职能领域的意愿。图 2.1 展示了上述关系的代表性结构。各职能的位置不暗示优先级或顺序。重要的是 IOC 是所有这些职能的整合。


  ![](img/bg2a.jpg)


  ## IOC 人员


  现在关注分配到 IOC、负责管理航空公司日常运行的具体人员。上述各职能领域向值班经理负责，但也在各自的领域内负责（即向各自的管理团队负责）。


  - 运行控制

  - 载荷控制

  - 飞行调度

  - 飞行员乘务

  - 客舱乘务

  - 气象

  - 航行/飞行计划

  - 流量/时隙控制

  - 维修监控

  - 社交媒体

  - 安保

  - 货运

  - 客户旅程管理

  - 运行绩效

  - 机场

  - 飞机分配

  - 排班/计划

  - 餐饮

  - 系统/IT


  *图 2.1 IOC 内部关系*


  ![](img/bg2b.jpg)


  ## IOC 值班经理


  IOC 由值班经理或同等职位人员监管。从本质上讲，该角色是每日轮班中职位最高的人员，需向 IOC 高级管理层负责，确保航空公司每天 24/7 的运行顺利进行。考虑到图
  2.1 所示的关系，这是核心角色，拥有权力确保 IOC 内每个职能的绩效都能胜任且有意义地为整体运行绩效和所需交付成果做出贡献。为实现这一点，需要高度的敏锐和洞察力，以驾驭各组成领域驻留的大量专业知识，因为建立和维持紧密工作关系的能力至关重要。特别是在重大扰乱时期，这种专业知识需求极高，此时问题复杂、时间往往紧迫、决策影响重大、工作环境性质紧张得不得了。有时，情况可能要求值班经理充当仲裁者，当协作但相互竞争的需求导致僵局时。在此类情况下，该角色侧重于协同各方努力、鼓励、共情、必要时安抚，但最重要的是提供强有力的领导和清晰的方向。该角色真正处于一线。


  ## 运行人员


  现在重点关注运行控制人员；即负责做出无数运行决策的人员。视航空公司运营所在国家的司法管辖区而定，运行控制员和调度员的许多职能是共通的，可由其中一方执行。在紧接着的章节中，将详细探讨各自的特征和职能。任何重叠都不影响必须执行若干任务这一事实，很快就会明显看出某些职能在一定程度上有交叉。除这两个角色外，还将简述
  IOC 中的其他角色。




  # IOC 运行控制员的构成


  ![](img/bg2c.jpg)


  运行控制员（或网络控制员）的角色性质要求具备适当技能的个人，能够在高压、快节奏且复杂的环境中胜任工作。有许多系统和工具可供辅助，以及手册、培训活动和其他支持该角色的手段。但即使拥有众多资源，教授和培训个人如何在中断管理角色中取得成功，以掌握解决复杂问题所需的技术，仍然是一个极其困难且令人沮丧的漫长过程。本节将更详细地探讨该角色及其职责，并重点关注在
  IOC 中履职所需的个人特征和素质，随后再考虑招聘、选拔和培训等更具管理导向的目标。


  ## 角色


  为避免重复并整合运行控制职能中的各种职位，"角色"一词涵盖了属于运行控制任务集的若干职位。因此，根据这一解释，下文描述的角色包括值班经理承担的部分任务，但概括了高级控制员、控制员、辅助控制员和运行官员（或用于区分不同层级人员的类似术语）的任务。从本质上讲，该角色是监控、控制和协调与按日执行已发布时刻表相关的活动，以服务于航空公司的网络。IOC
  中的运行管理包括与正常和非正常运行（包括危机或应急管理）相关的活动，明确关注客户需求，同时考虑各种期望的商业和运行目标及制约因素。


  ## 职责


  考虑到上述包含的头衔，运行控制员角色的主要职责非常广泛。控制员主要负责航空公司的运行绩效，包括达成特定目标（如准点率、效率、生产力），并在此过程中确保遵守监管要求、航空公司政策和任何工作场所协议。在日常工作中，更具体地说，他们负责监控实际飞机动态（包括起飞前、起飞、航路进展和到达），识别与时刻表的偏差，并相应地解决任何问题，以减轻对网络的潜在或实际影响。他们还负责在
  IOC 内部和外部进行沟通，并跨越任何所需层级。他们必须确保收到的任何通信都能被迅速理解、解释并根据需要应用于具体情况。同样重要的是向关键人员传播信息。除了广播决策或建议外，这有时可能意味着根据事件性质，有选择地过滤特定细节或审慎地安排信息发布时机。他们的职责可能还延伸至积极规划机队承诺、协商时隙时间、协调航线和越境许可，以及办理其他批准。


  ## 个人素质


  谁能成为一名优秀的控制员？这是较难回答的问题之一。从前面的章节似乎可以看出，控制员确实是一个拥有令人印象深刻技能阵列的特殊人物，能够以极高的能力单独评估和处理任何复杂问题，然后将构想的计划付诸行动，立即取得积极成果以解决困境，结果一切归于正轨。在理想世界中，也许可能！但现实是，该人员确实需要具备沟通、谈判、解决问题以及自我管理、他人管理和各类任务管理方面的卓越技能。要实现所有这些，需要最高水平的个人资质、实现目标不妥协的态度，有时还必须在相当大的时间限制下完成，因此会面临压力。


  但这还不够。杰出的控制员拥有可谓"第六感"的特质；这是一种将其与他人区分开来的特质。这是一种与生俱来的感知异常的能力，例如识别通信何时包含混合信息，或看似显而易见的解决方案何时存在潜在陷阱或不良后果，或延迟决策或行动可能会产生进一步的、有时截然相反的信息，从而导致不同结果。这些细微差别体现了控制员之间不同层次的觉察力和直觉。通俗地说，这在他们的基因里！他们要么能做到，要么做不到，任何数量的培训都无法充分替代。如果
  IOC 能配备这种素质的个人，它很可能会形成一个能力强得多的团队，能够产生好得多的成果。


  ## 背景与经验


  过去，IOC 中的经验水平参差不齐，许多员工拥有稳定、长期的职业生涯，通常在相当专业的岗位上，但与 IOC 职能相关。在此期间，他们通过接触众多问题和挑战积累了丰富的知识，当然也积累了巨大的能力。确实，他们因对航空公司运行的掌控力而受到推崇，因为没有其他人真正能理解问题的程度，更重要的是，理解解决复杂问题所付出的巨大努力。随着时间的推移，由于退休、不合适的任命，或可能无法应对极端压力、日益增加的复杂性以及满足绩效目标的不断增长的要求，员工流动发生了变化。因此，IOC
  内部员工的经验水平随时间大幅下降。当然，部分原因是技术的发展（例如更智能、更强大的系统，以及琐碎或重复性活动的数字化），这具有讽刺意味的是，也消除了对任务所涉及原则的某些基本或基线理解。这些系统改进使任务能够更高效、更有能力地执行，但也带来了负面影响。首先，熟练员工的总数减少了；其次，新员工作为其基础学习一部分传统上承担的"跑腿工作"现在由系统驱动，移除了这一重要的渐进步骤系列。这种学习和知识获取的短板需要在培训制度中得到认识、承认和补偿。尽管不断改进的技术为问题解决和决策提供信息并驱动它们，但由于上述原因，适当的人力资本供给仍然极为重要，因此这些人的资源配置至关重要。将几乎没有先前运行经验的"生手"任命到
  IOC 中是毫无意义的，虽然这在过去可能发生过，但现在极不可能。因此，寻找具有合适背景的适当个人是当务之急。对各 IOC 运行控制员的普查将显示，大多数员工通常在该角色上拥有五年或以上的经验，尽管背景通常大相径庭。当然，有些人在另一家航空公司积累了先前的
  IOC 经验，





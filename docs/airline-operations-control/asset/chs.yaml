  ## 客户旅程管理联系轨迹


  CJM 团队也会立即介入中断处理。根据中断发生的时间，客户可能身处各种地点。如果工程问题发生在计划起飞前数小时，可以建议客户不要前往机场，或告知延误起飞时间。然而，如果问题发生在所有客户已登机时（例如飞行前检查期间，甚至启动时），影响可能更严重。因此，CJM
  流程可能需要涉及出发端的工作人员，照顾 VIP，甚至为特定客户提供替代旅行安排，而不是让他们承受严重延误或更糟的影响。部分职能还评估到达端的影响，查看初始目的地以外的衔接（包括航空公司内部和外部）、住宿或移民问题等。重新预订客户到其他航班或以任何其他方式协助他们的流程，可以由客户支持人员或官员执行并跟进，或通过第三方承包商完成。如果事态需要升级，将有一系列负有责任和权力的人员提供更高级别的支持，如图
  5.5 所示。


  ![](img/bga6.jpg)



  \ 第 169 页：初始情况与行动\n\n![](img/bgc0.jpg)\n\n关于 `NBN` 的决定权在于 IOC。让飞机备降 `BNE` 的优势超过了返回\
  \ `CBR` 的便利性。随着 `NBO` 现已复飞，`SYD` 的飞机短缺问题再次显现。因此，需要考虑削减更多航班以缓解执行压力，优先考虑保留有替代运力供旅客选择的航线。由于\
  \ `SYD-CFS-SYD` 每天仅运行一班，而 `SYD-HTI-BNE` 和 `SYD-AYQ-SYD` 均为长航线航班，应予以商业保护，因此频次较高的\
  \ `SYD-MEL-SYD` 或 `SYD-BNE-SYD` 航线提供了解决方案的一部分。因此，从（至少）这两条航线中削减航班将释放飞机利用率。航班 `304\
  \ SYD-BNE` 目前因无飞机执飞（因 `NBM` 备降 `OOL`），且 `NBN` 也涉及 `BNE` 航线，这使得 `304` 成为取消的首选航班。IOC\
  \ 立即启动了一系列行动。此时延迟决策将导致某些选项不可用，因为在国内运行中断中，决策窗口可能极短。现在执行了大量换机（均在同机型内）（参见对页图 7.4），以保护长航线航段和宵禁，同时将整体延误降至最低。针对受影响旅客，CJM\
  \ 团队采取适当行动与其联系，安排改签其他航班，并视情况安排地面交通。\n\na) 指示（通过港口协调员/ATC）`NBN 322 CBR-SYD` 立即备降\
  \ `BNE`。该飞机随后按时刻表执行 `702 BNE-NOU`、`705 NOU-SYD`。  \nb) 取消 `323 SYD-CBR`（见图 7.4 底部取消航班栏）。\
  \  \nc) 取消 `304 SYD-BNE`（见图 7.4 底部取消航班栏）。  \nd) `NBM` 在 `OOL` 加油并继续执行 `341 OOL-SYD`。随后的考量是决定如何优先安排\
  \ `SYD` 出港航班。如上所述，`388/389 SYD-CFS-SYD` 和 `382/383 SYD-HTI-BNE` 航班不太可能受影响。同样，出于商业考虑，将优先保证\
  \ `350/351 SYD-AYQ-SYD` 按时运行。因此，决定延误 `217 SYD-MEL/218 MEL-SYD`。然而，由于 `NBQ` 将在 `MEL`\
  \ 且能比 `NBM` 更早执行 `218`，`NBM` 改执行 `220 MEL-SYD`，随后执行 `274 SYD-ADL` 和 `263 ADL-MEL`。随后进行其他调整，以在保护所有宵禁的前提下使大多数航班按时运行。\
  \  \ne) `NBO`（基于飞机进港 `SYD` 而非备降）执行 `382 SYD-HTI`、`383 HTI-BNE`、`349 BNE-MEL` 和 `226\
  \ MEL-SYD`。\n\n## 第 170 页：后续行动\n\n![](img/bgc1.jpg)\n\nf) `NBQ` 执行 `335 CBR-MEL`\
  \ 后，仅小幅延误执行 `218 MEL-SYD`，随后按时刻表执行 `225 SYD-MEL`、`266 MEL-ADL` 和 `282 ADL-PER`。\
  \  \ng) `NBT` 执行 `273 ADL-SYD` 后，执行 `310/311 SYD-BNE-SYD`。  \nh) 注意：为使 `NBQ` 执行\
  \ `335 CBR-MEL`，运行控制员需与机组排班部门（飞行员和乘务员）联络，以确定 `CBR` 有哪些可用机组。一个（或许显而易见的）解决方案是使用将飞机飞抵\
  \ `CBR` 的 `380 HBA-SYD` 机组，但可能存在排班限制而无法实施。`CBR` 当地也可能有机组可执行 `335`。若有除 `NBQ` 外的其他飞机被调整过夜停放\
  \ `PER`（维修设施极少），则需与维修监控联络，确保飞机有足够的维修放行小时数（即过夜无需检查服务）且无其他关键维修工作待办。然而，尽管利用率发生变化，本场景中极少执行过夜基地变更。反映这些行动的变更如图\
  \ 7.4 所示。\n\n### 更新 @ 1132 EST\n\n`SYD` 港口协调员通报如下更新。\n\na) 锋面正在通过。风向转为西风，从 240–280\
  \ 度吹来，风速 20–30 节，阵风 45 节。  \nb) 因此，使用跑道现已变更为 `RWY25`。（双向南北跑道的丧失及减少至单跑道运行将加剧拥堵和等待时间，因为起降率大幅降低）。\
  \  \nc) 随着雷暴抵达机场，闪电现位于 5 海里范围内。因此，所有人员被命令离开停机坪。飞机仍可起降，但在这种情况下，可能必须在机位外等待，直到 5 海里警报解除。\
  \  \nd) `NBO` 在机场东侧盘旋，如前所述，其燃油仅够再进近一次，无论如何最多只能盘旋至 1150 便须备降 `OOL`。  \ne) `WBC` 获准再盘旋\
  \ 20 分钟（在机场南侧）。\n\n## 第 171 页：进一步更新\n\n![](img/bgc2.jpg)\n\n维修监控通报，因机场有闪电，机库工程师无法将\
  \ `NBP` 从机库拖至航站楼。该飞机要到 1245 才能投入运行。\n\n### 更新 @ 1145 EST\n\n`SYD` 港口协调员通报如下更新。\n\
  \na) 闪电活动已过，恢复正常运行。  \nb) 来自 ATC 消息，`NBO` 将为首架进近飞机。  \nc) `WBC`（通过无线电）通报必须在 1150\
  \ 前进近，否则备降 `MEL`。在其他调整进行中且已有合理方案覆盖目前的中断情况，关注点转向 `NBO` 和 `WBC`。若 `NBO` 备降，下一个可能的“牺牲品”将是\
  \ `388/389 SYD-CFS-SYD`，商业上优先保护长航线 `HTI` 和 `AYQ` 航班。若 `WBC` 备降，宽体机的紧张利用率可能意味着必须取消一班\
  \ `SYD-MEL` 以恢复平衡。`NBP` 投入运行的延迟不被视为问题，因为可能仅造成轻微延误。此时，持续与机组排班、CJM、工程部门以及港口协调员联络，将使\
  \ IOC 做好最佳准备，暂时无法采取进一步行动。\n\n### 更新 @ 1150 EST\n\n`SYD` 港口协调员通报如下更新。\n\na) `NBO`\
  \ 已着陆。  \nb) `WBC` 现获准再盘旋 10 分钟，因燃油储备不足，机组选择立即备降 `MEL`（预计到达 `MEL` 1255）。  \nc) 随着机场条件持续好转，预计\
  \ `NBR`、`WBB`、`WBE` 和 `WBA` 均将按其当前预计等待时间着陆。随着机场缓慢恢复正常，且 `NBO` 已着陆，现在的想法是平衡 `WBC`\
  \ 离场造成的 `SYD` 运力损失。要么 `WBC` 在 `MEL` 加油返回 `SYD`（若 `MEL` 预计到达 1255，最早再起飞约 1340，预计到达\
  \ `SYD` 1505）。\n\n\n\n\n# 天气场景：悉尼雷暴\n\n## 图 7.5：悉尼天气 – 解决方案\n\n```text\n172 WEATHER\

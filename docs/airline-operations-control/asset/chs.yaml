  \n## 简报\n\n该航空公司是澳大利亚的国内承运人。机队由五架双发宽体飞机（注册/尾号指定为 `WBA-WBE`）和九架双发窄体（单通道）飞机（注册指定为\
  \ `NBL-NBT`）组成。宽体飞机容量为 `300 座`，窄体飞机为 `180 座`。宽体飞机客运航班间的最小周转时间为 `60 分钟`，窄体飞机为 `35\
  \ 分钟`。请参阅对面的 `图 7.1`。\n\n\n\n# 天气场景：悉尼机场雷暴\n\n## 场景描述\n\n时间为 1115 EST（悉尼时间）。几条强雷暴线正在逼近悉尼机场。IOC\
  \ 的气象部门上午已知悉迫在眉睫的雷暴，并预警了最可能的影响时间。先前发布的航路终点预报（TAF）显示，随着锋面系统移过，1130–1230 期间悉尼机场将出现来自西方的持续风，风速超过\
  \ 40 节。此外，预计将出现低云、大雨、机场及周边闪电，以及 5000 英尺以下的严重湍流。当前的 METAR 显示风向多变，偏北风，风速 15–20 节。因此，两条平行跑道\
  \ `34L` 和 `34R` 目前正在使用中。前往悉尼机场且预计 1030 起到达的航班，已被要求携带足够燃油以备降备选机场（备选燃油）。\n\n## IOC\
  \ 互动\n\n该航空公司的悉尼港口协调员建议，未来 15 分钟悉尼周边地区预计将出现雷暴。她确认 `NBQ 380 HBA-SYD` 和 `WBC 212 MEL-SYD`\
  \ 目前在悉尼以南盘旋，`NBO 361 OOL-SYD` 在北侧盘旋，但暂无更多信息。此外，她建议管制员预计风向将变，飞机在锋面通过期间可能会被进一步要求盘旋。目前，飞机正无延误地从悉尼起飞，并已在两条平行跑道上降落。\n\
  \nIOC 当前的直接关注点是即将抵达悉尼的航班，其次是已在航路但尚未抵达附近的其他航班。对利用情况的全面扫描显示，有大量飞机靠近悉尼（参见图 7.1）。扫描不仅关注即将到达的航班，还延伸至每个运行模式，以评估若受干扰可能产生的后续影响。关键信息将包括地面时间（延误可在此吸收）、通向宵禁的模式（例如\
  \ `WBA (SYD)`、`WBE (ADL)`、`NBM (SYD)`、`NBN (SYD)`、`NBO (SYD)` 和 `NBR (OOL)`），以及任何非正班航班（例如包机、摆渡飞行或国际运营），因为这些可能需要特别关注（例如执飞\
  \ `BNE-NOU-SYD` 的 `NBM`）。\n\n## 信息需求\n\n需要从两个角度确定每架进港飞机的信息。第一是确定管制员可能的进近顺序，这将协助\
  \ IOC 判断哪架飞机可能优先降落，从而对起飞进行优先级排序。第二是识别可能无法长时间盘旋的长航程进港飞机。问题可能包括以下内容：\n\n- **a)** 每架飞机在哪里（即下降中、进近中或已在盘旋模式中）？\n\
  - **b)** 每架飞机携带多少燃油？\n- **c)** 每架飞机能盘旋多久？\n- **d)** 每架飞机指定的备选机场是什么？\n\n收到的信息可能揭示许多飞机的状态，但信息往往断断续续，甚至完全没有（此时大家都很忙——尤其是管制员），在这种情况下，必须向相关区域寻求信息。\n\

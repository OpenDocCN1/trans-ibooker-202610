  ## 场景描述


  `WEATHER SCENARIO: SNOW AT JFK AIRPORT` 发生在 `9901 LAX-ORD`（用于执行 `9902 ORD-LAX`）上。其缺点是，如果
  `LAX` 有可用机组，召集机组可能需要数小时，从而大幅延误 `9901`（并随之导致 `811 ORD-JFK`、`840 JFK-DXB` 和 `9902
  ORD-LAX` 延误）。最坏的情况下，将改道飞机飞入 `ORD` 的技术机组在休息后（可能 `12 hours`，视值勤和休息规定而定）可被使用。这将实现 `9902
  ORD-LAX` 但不载客。如果机组包含乘务员，则 `9902` 可搭载 `135 DXB-LAX` 客户。


  f) 总之，两个航班（`840 LAX-JFK`，`811 JFK-LAX`）被取消，并新增两个航班（`9901 LAX-ORD`，`9902 ORD-LAX`），实现了
  `811` 客户（`ORD-JFK`）的行程衔接，并确保飞机适当定位。一些延误不可避免，但在这种情况下无法避免。


  g) `CJM` 团队（连同当地管理层）将负责在可用航班上安排客户。


  ## 最终评论


  `图 6.4` 显示了解决后的情况在 `甘特图` 上可能的样子。该场景中的解决方案在给定情况下实现了最佳客户满意度，公平高效地恢复了飞机和机组模式，并将对该网络部分的影响降至最低。当然，该解决方案依赖于天气条件允许后续运营继续通过
  `JFK`。


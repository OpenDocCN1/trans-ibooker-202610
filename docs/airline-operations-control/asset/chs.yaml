  '
- '## 6 Weather Scenario: Snowfall at JFK Airport


  ### Introduction


  The airline operates international services using five twin-engine wide-body long-range
  aircraft (registration/tail numbers `WBA`–`WBE`). Seating capacity is 350 seats.
  The minimum turnaround time between passenger flights is 90 minutes. Please refer
  to **Figure 6.1** on the facing page.


  ### Scenario Description


  The current time is 1700 UTC. A blizzard is hitting New York JFK Airport in the
  USA; conditions have been critical since early morning. However, the airport remains
  open, and flights are still operating, although some domestic and regional carriers
  have suspended several flights into and out of JFK. Due to high regional traffic
  and the requirement for instrument approaches, several aircraft have been instructed
  to hold around JFK.


  `WBB` is operating **Flight 811 (DXB–JFK)**, scheduled to arrive at JFK at 1800.
  Flight 811 departed DXB with sufficient fuel to hold over JFK for **3 hours**, with
  an alternate airport of **CLE (Cleveland, located 370 NM west of JFK)**. ATC has
  just advised the crew that a further **3 hours** of holding at JFK is anticipated,
  and that they will enter the holding pattern 80 NM east of JFK at 17:40.


  ![](img/bgab.jpg)


  ### IOC Interaction


  The JFK Station Manager has notified the IOC: Flight 811 is cleared to hold east
  of JFK for a maximum of 3 hours. No further information has been passed at this
  time.


  The IOC now needs to confirm the following:


  **a)** What is the cause of the unexpected extended holding time? (The flight plan
  already allowed for and planned weather holding; the focus is on the underlying
  reason for the *additional* holding.)


  **b)** How are air and ground conditions expected to evolve? (Overall improvement
  or deterioration? Is the revised arrival time certain or merely possible?)


  **c)** How much maximum holding time remains for the aircraft at JFK? (Given the
  additional holding, the aircraft''s endurance is expected to be exceeded, immediately
  raising diversion concerns.)


  **d)** If holding for 3 hours, which alternate airports are available? (Selecting
  a different alternate may allow the aircraft to continue holding over JFK longer
  while retaining the possibility of receiving an approach clearance.)


  **e)** Are other aircraft being cleared for approach? (If conditions are not deteriorating,
  this serves as a good predictive indicator of a possible landing.)


  **f)** Crew duty hours may also become an issue; a proactive inquiry to Crew Scheduling
  will determine the location of the nearest reserve crew should a diversion occur.


  **g)** Should the aircraft divert immediately with the expectation of returning
  to JFK later, rather than waiting for the 3-hour hold to expire, then diverting
  and facing crew duty exhaustion?


  **h)** Should the Flight 811 (JFK–LAX) crew remain at the hotel (delayed report)
  until it is confirmed the aircraft will indeed land? Please refer to **Figure 6.2**
  on the facing page.


  **i)**



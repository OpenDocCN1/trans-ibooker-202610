- '# 3 运行规划与准备


  ## 简介


  在对 IOC（综合运行控制）的性质有了一定了解后，本章将探讨运行日之前规划和准备阶段的广度。为了实现 IOC 的目标，从事运行前职能的部门需要在许多方面做到万无一失。视具体职能而定，准备阶段可能意味着提前数年的时间跨度，例如航空公司对商业和网络模式的选择、航线和港口选择的制定，以及飞机的选型和引进。一旦这些就绪，当然，随着运行日的临近，许多其他职能将适用更短的时间框架。本章解释了决定航空公司为运行日做准备的方向和方式的商业、商务和运行因素。


  ![](img/bg4a.jpg)


  ## 商业因素


  ### 商业模式


  航空公司采用的商业模式在其航线网络的开发和运行理念的形成中起着重要作用。除了显而易见的商业和营销需求外，确定期望的模式将对排班编制、机型选择、服务等级、与第三方的合同安排（尤其是地面资源方面）等产生影响。秉持持续改进的运作模式，高级管理层的关注点在于外部因素，如监管要求、竞争变化、联盟与合作伙伴关系、所有权安排、行业机遇与威胁，以及内部因素，如成本控制、生产率、满足运行和商业目标的需求等。（统称为）传统或全票价承运人与低成本承运人之间的差异，决定了航空公司应对这些因素的方法。


  #### 网络设计：枢纽辐射制 对比 点对点


  枢纽辐射式网络设计的特点是有一个中心机场（枢纽），如果航空公司规模相当大，则可能有多个关键枢纽，旅客流量通过这些枢纽分流至其他多个目的地港口（辐射点）。这种网络设计使得每天多次出现密集的航班波次或航班组
  1，在这些时段内，枢纽机场会产生大量的活动。这种活动水平的根本原则是为旅客提供广泛的联程衔接，旨在让承运人在整个客户旅程中完整保留旅客的行程。相比之下，点对点模式强调单个市场
  2，使得旅客可以直接从一个机场飞往另一个机场，前提是航空公司提供此类直飞运营。


  航空公司在成立（或重组）时采用的枢纽辐射设计，决定了所生成的排班类型，以使航班组能尽可能高效地运作，并因此决定了服务各个市场所需的机型。例如，国际或大型国内枢纽辐射式承运人通常运营宽体飞机，因为辐射点不仅产生往返枢纽本身的大量客流，而且由于该模式所定义的高度联程性，辐射点之间也产生大量客流。点对点承运人运营的航线密度较低，因为需求更多地仅代表服务于始发地和目的地的客流。因此，机型选择通常（但不总是）集中在窄体机型上。


  这些模式中的每一种都决定了 IOC 需要管理中断的方式。解决涉及多架大型飞机（拥有众多机组人员）、大载客量的问题，与解决涉及更频繁但载客量较小的小型飞机的问题相比，需要截然不同的策略和解决方案。采用枢纽辐射模式运营的航空公司，一旦主要枢纽发生严重中断，可能会变得极其脆弱，因为其网络的很大一部分可能会受到影响。相比之下，点对点运营商可能能够将运行问题隔离在特定航线或地理区域内，从而限制更大范围的网络中断。这些策略将在本文的第二部分中得到更充分的解释。


  ![](img/bg4b.jpg)


  ### 运营航线/许可证


  跨国境运营的飞机必须持有允许该运营的航线许可证。航空公司的排班部门或其分支机构通常会提前安排好所有适当的许可证、过境许可、进离港时刻或与网络排班相关的任何其他法律手续。在运行当天，任何变动，例如因备降或需要额外许可而产生的变动，将由
  IOC 本身进行微观管理。


  ### 运营港口


  选择运营港口的决定是航空公司商业战略的一部分，是数月甚至数年的指导、机遇和谈判的结果。尽管由商业利益驱动，但运行输入（例如来自飞行运行、性能工程、航空公司自身的机场代表机构等众多方面）为该过程提供依据，以确保港口和航线结构合适，并且航空公司拥有合适的设施（例如机场基础设施，如适当的导航台、足够的跑道、滑行道和硬质停机坪区域，以及航站楼条件，包括与拟议排班相匹配的旅客值机能力、贵宾休息室、由登机廊桥和/或远机位服务的登机口休息室、充足的燃油





  # 运行规划与准备


  ## 机场就绪


  随着运行日的临近，机场就绪至关重要，以确保计划航班能够在地面得到妥善安排，包括充足的机位、合同地面服务设施、设备及服务交付的使用、工程支持、运行当天的航站楼值机，以及合适登机口的提供与分配。登机口分配的责任方可能是机场管理局，也可能是航空公司的驻场人员。这是一项重要的规划任务，旨在确保登机口使用高效、拥堵最小化，并且进出港航班均能按时刻表运行，不产生延误。高效机场运行的部分流程还要求将联程航班安排在彼此合理距离的机位上，以方便旅客中转；对于许多短途或国内运营而言，也关乎机组便利，因为机组人员同样可能需要换乘飞机。


  ## 机队选择与组合


  机队规划、选择与引进是一项长期企业战略，取决于其战略规划和商业模式所确定的方向。引进飞机通常需要很长的前置周期，特别是从制造商处接收新飞机，或从另一家航空公司或租赁公司引进飞机时，这些飞机在入役前通常都要在工程部门停留一段时间。对于航空公司引进的首架新机型，可能要在抵达数周后才会投入航线飞行，此前或许会进行各机场的“展示飞行”。尽管尚未投入商业运营，但其运行仍将受到
  IOC 的监控和管制。确定引进飞机的数量和类型，是由商业需求和财务能力共同驱动的。部分机队将通过增加同型号飞机来扩充，这对融入现有运营影响甚微。另一方面，将新机型融入现有机队，不可避免地会形成某种混合机队，这在日常管理中可能颇具挑战。从
  IOC 的角度来看，飞机在工程部门放行投入航线服务后，需要尽快具备执行任务能力。


  ### 商业因素


  #### 商业时刻表


  航空公司会提前数年规划其运营。从确定服务城市、网络设计与预期航线结构开始，经过漫长而详尽的过程以确保所有相关因素均被纳入考量，最终形成飞行时刻表。通常，航空公司会根据夏季和冬季时段编制主要时刻表。这主要是由于季节性天气的显著变化，以及假期时长的差异，特别是在北半球，导致出行需求发生显著变化。因此，这一过程是监管框架、市场需求、所需机型组合及其运行性能与限制、资源与人力、以及竞争等因素的函数关系。3


  起初，时刻表只是一组模糊不清的航班，经过数月的调整和修改，才能在众多约束与限制中满足严格的商业目标。同样，运行层面的规划也极为详尽，一直持续到运行前一天晚上。因此，运行准备对于按计划优化当天运行至关重要。在倒计时进入运行日的过程中，面临着诸多挑战，主要源于航空公司自身商业与工程活动的相互竞争需求，也源于外部需求，如空管或机场登机口资源。IOC
  各职能领域内的考量必须纳入基于合同安排的资源需求（例如：飞行员、乘务员、工程师）。排班规划部的任务是构建、开发并微调航班时刻表，使其达到最大效用。这意味着满足了所有法律法规限制、企业与商业目标（如实现目标客座率和目标市场份额），并在以客户为中心的前提下实现了资源使用的最优效率。在从排班规划部移交给
  IOC 的节点上，所有这些目标及更多要求均应已达成。时刻表的大量编制工作还应包含飞行员和乘务员机组的理想利用率，考虑可用资源并内置应急备用能力，满足维护、修理或其他考量的维修要求，考虑机场和空域限制，等等。


  #### 机队利用率


  编排时刻表的部分任务是安排航班以满足商业目标，如城市对（航线）所需运力、航班频次与时间，以及提供联程时间以实现网络通达。编制出的时刻表以飞机运行利用率的形式体现，按运行时间顺序显示航班序列。于是浮现出航班运行模式，国内时刻表的模式可能基本都在一天内，而旗舰（国际）承运人的模式可能跨越数天。这些航班模式最初是分配给机型，而非个别飞机注册号或尾号；分配到具体飞机的过程发生在更接近实际运行日的时候。构建这些模式需考虑匹配每个城市对或航线的需求与运力（合适的飞机执飞合适的航线）。当然，排班规划必须充分考虑所选机型的能力，因为飞机必须具备适合的运行性能特征，以承载所需有效载荷来运营该航线结构。这是一个高度迭代的过程，持续演变和变化。随着需求波动，运力匹配过程需要适应，导致时刻表编制过程长期处于流动变动状态。此外，针对需求匹配的机型变更要求相应调整机组分配和模式（特别是飞行员），进一步增加了过程的复杂性。第三方参与者——工程或维修部门，也扮演着关键角色，因为计划维修工作需在时刻表编制过程中予以考虑，以确保机队保持满足运行要求的能力。在大型机队中，通常会有若干飞机从时刻表编排中排除，以便轮换多架机身进行大修。在可能的情况下，会安排尽可能多的飞机处于可用状态，以满足重大活动和假期等出行高峰需求。不过，在某些机队中，如果所有飞机均已投入飞行模式，或对于机队数量较少的小型航空公司，这可能不太可行。


  ![](img/bg4e.jpg)





  # 运行计划与准备


  ## 商业与运行的关联


  从上述要点可以看出，商业排班部门与运行领域（主要是运行控制、机组管理（包括飞行员和乘务员）及工程部门）之间的关联，有时会因其职能所依据的理念不同而受到挑战。


  为达成商业目标，排班设计可能会导致运行效率低下，或使未来运行在面对扰动时暴露出弱点。


  例如，如果多个“紧凑”排班要求多个航班之间需要精确的机组衔接，且缺乏替代机组方案，导致关键航班延误可能危及这些衔接，其连锁影响可能十分广泛，且几乎没有余地实施合适的恢复。


  因此，排班构建过程需要所有利益相关方的参与，其特定利益和关切需得到充分考量，因为疏远这一关系中的任何一方都会导致次优结果。


  ## 排班稳健性


  稳健性是指排班在运行日承受破坏性冲击的能力。


  排班依据商业需求构建，形成一系列计划航班，理想情况下应实现最佳乘客收益，并满足期望客座率和市场份额等商业指标。


  因此，在可能的情况下，且视航空公司采用的商业模式而定，航班时刻可针对客户偏好进行调整，例如满足高峰需求（如早晚商务出行）、提供有吸引力的出发和到达时间，以及合适的航班频次。


  从运行角度来看，有许多微妙的方式可以微调排班以增加稳健性，帮助 IOC 在运行当天进行管理。


  例如，延长总排班时间（出发至到达）有助于缓解繁忙机场的地面等待时间，增加航班间的地面时间（称为缓冲）可协助从晚点航班中恢复。


  ## 排班灵活性


  除满足上述约束外，稳健性还应考虑同机型飞机互换（同型互换）的机会，从而实现日常运行中更大的灵活性。


  这种灵活性也可满足机组管理部门为促进航班间机组衔接而提出的请求，或工程部门为将特定飞机注册号（机尾号）安排至特定航线或特定港口进行维修工作而提出的请求。


  此外，灵活性还能在主要港口实现更高效的登机口分配。


  有时，排班结果会导致飞机在机场有漫长的停留时间（例如周转时间为 5 小时、12 小时或更长）。


  某些机场预计使用停机位的航班量往往要求飞机被拖离停机位并远机位停放，直到下一个计划任务。


  此时间有时也用于维修工作。


  视机场设施配置而定，拖曳时间可能会导致出港航班延误。


  ![](img/bg51.jpg)


  ## 运行因素


  ### 空中导航


  航空公司持续致力于提升业务运作的经济性与效率。空中导航服务提供商（ANSP）的技术进步，以及各类地面和卫星导航系统的发展，改进了导航程序，使得垂直间隔缩减、机场连续下降（而非阶梯下降）、复杂的航迹跟踪手段（如“灵活航迹”）、基于性能的导航，以及增强的空中交通流管理系统成为可能。凭借这些技术，装备完善的飞机和受过训练的机组越来越能够优化飞行路径，从而节省时间和燃油。每一项都值得在别处进行大量讨论，但此处要点在于，这些不断演进的程序和系统的日益广泛应用，对航空公司运行产生有益影响，因此极受
  IOC 关注。


  ### 空域


  在许多国家，空域被划分为民用和军用区域。定期公共运输（RPT）航班通常无法穿越军用区域，或需特殊许可方可穿越。冲突时期，通常会实施限制，限制或禁止飞越危险地区。此类限制对航空公司影响显著。绕飞潜在或现有冲突区域的航线规划势在必行，结果将导致额外飞行时间、额外燃油消耗和延长机组值勤时间，从而增加运行成本，并延长到达目的地时间，进而带来衔接和周转时间的考量。在某些严重情况下，航班可能需取消，直至冲突解除或被认定安全。另一后果可能源于反复晚到目的地。若特定目的地机场实行时隙制度（目前大多数主要机场均适用），且某计划航班持续未能在允许的百分比幅度内达到计划到达时隙，该时隙可能被收回。例如，失去“祖父权”将对航空公司造成毁灭性打击。此类威胁极可能促使
  IOC 调查解决方案以防止多次发生。


  ### 宵禁


  全球许多机场均实施立法宵禁。这些是为回应社区、压力团体和环保团体对噪音及其他污染物的担忧而设定的人为限制。宵禁针对定期公共运输（RPT）航班，通常不适用于军用、医疗或应急航班。通常，宵禁适用于最大起飞重量超过特定数值（如
  34,000 千克/75,000 磅）的喷气式飞机，而其他“低噪音”飞机（如经批准的喷气机、小型喷气机和涡桨飞机）可在宵禁时段运行，但通常受限于封顶架次数。根据“祖父条款”（即长期确立的规则继续适用），特定航班（如国际航班）可能享有进一步豁免，意味着某些航班（大型飞机）可在宵禁时段内运行。宵禁主要时段为
  2300–0600，但具体时间可能因当地条件和安排而异。根据祖父条款，某些机场可能允许在 2300–2359 和 0500–0600（常称肩部时段）进行若干次着陆（但通常不允许起飞），或其他变体或组合。就调整飞机运行以适应宵禁限制而言，通常有一整套规则精确规定飞机需在宵禁时段开始前，于何时请求并获得推出、滑行和/或起飞许可，或要求何时必须离地并越过机场围栏。此外，值班跑道方向也可能因噪音影响附近社区而对起飞和/或着陆构成限制。






  # 运行规划与准备


  ## 宵禁限制


  因此，如果指定跑道因风况或其他条件而不合适，则可能不允许运行。通常有一套针对违反宵禁的罚款制度，尽管如此，航空公司有时仍可能选择晚点起飞并支付罚款（前提是他们当然拥有
  ATC 运行许可）。其理由在于：若不进行深夜起飞，取消航班所产生的成本及破坏性影响——包括由此导致的机组等待休息、可能需要的酒店住宿、网络中飞机短缺、目的地错过联程航班，以及任何其他后续连锁反应——可能远超罚款金额。可能存在豁免制度，即在特殊情况下，例如在重要假期（如重大宗教活动）前发生大范围且未预料到的中断（恶劣天气事件），宵禁开始时间可放宽，比如
  30 分钟。此类豁免最可能依赖政府部门的批准系统，但在极端情况下可能需要更高层级的政府批准。除了宵禁限制外，塔台管制员的可用性也可能受限，导致塔台（从而授权着陆或起飞的能力）仅在特定时段开放。在某些军民两用机场，ATC
  服务由军方提供，从而决定了运行时间。


  ## 时刻


  随着航空旅行需求日益增长，全球大多数机场都面临时刻限制。国际航空运输协会（IATA）根据拥堵程度对机场进行分类，应用一个包含 1、2 或 3 级的系统，具体取决于多种因素，如机场基础设施容量（跑道、滑行道、登机口等）或政府强加的条件，上述任一因素均限制机场满足交通需求的能力。4
  时刻分配过程要求航空公司必须由协调员分配时刻，以便在时刻分配生效时在机场进出港。不仅编排时刻表可能受时刻分配管控，日常运行也可能受正常和非正常因素影响。IOC
  将 COBT 或 EOBT（计算或估计的离块时间）与时刻分配进行匹配，以确保任何差异不超过允许范围（例如，早 15 分钟或晚 5 分钟），并知悉不合规可能导致处罚——通常是额外的空中盘旋时间。如果原本延误的航班错过了分配的时刻，则可能需要重新协商时刻（若可行），或等待下一个可用时刻，这可能导致网络遭受相当大的破坏。若进港时刻被延长，该航班可能面临更长的飞行时间，意味着额外燃油消耗、机组工时增加，以及对后续联程航班和目的地飞机周转时间的潜在威胁。当然，机位停放、地面资源及飞机周转时间缩短也可能是后续影响。


  ## 噪音消减


  用于确定飞机起飞或着陆航迹的程序，旨在减轻噪音对敏感居民区或其他社区区域的影响。这些程序规定了遵循特定飞行路径和功率设置，并规定了盘旋等机动动作的指定高度，或进离场机场的进近与起飞高度。它们还规定了使用指定或优先跑道（例如，指定特定跑道供进出港飞机使用），以及到达时使用或限制使用反推，尤其是在宵禁时段内进行的运行（在获得适当豁免的情况下）。


  ## 机场特性


  机场在地理位置、海拔、周边环境、物理布局、跑道和滑行道的数量及配置、停机坪设计、停放设施、加油点以及其他客货区域方面差异巨大。其中某些特性会导致显著的性能限制，影响飞机起飞。例如，美国丹佛国际机场的高密度高度（海拔
  5,400 英尺）会限制飞机起飞性能，可能减少载荷或燃油搭载量，尽管该机场拥有非常长的跑道。位于澳大利亚中部的爱丽斯泉，在澳洲夏季气温极高（如 40+ 摄氏度），导致显著的载荷限制，有时甚至需要技术经停以加油。其他机场可能位于山谷、高原或山坡上，进而限制进出场运行。此类地点通常具有恶劣天气条件（如侧风、湍流、风切变），可能特别影响飞机进近和着陆。其他机场（如新西兰皇后镇、阿拉斯加朱诺）可能被地形特征环绕，需要极其精确的导航进近（如
  RNP），这要求飞机具备合适的导航设备，且飞行员接受过专门培训。


  ## 跑道让步


  一些机场对可进出机场或停放在可用停机坪上的飞机最大重量有路面强度限制。有时，这些限制可能允许更高重量的飞机在机场运行，但会限制适用于某一最大重量的飞机在特定时间段内的起降架次。例如，可能批准
  80,000 公斤重量的让步，但限制每周仅允许一次此类运行，或每月最多六次。


  ## 机组配置


  在运行日开始前，所有计划航班理想情况下都应配备合适的机组。为抵消运行当天预期的机组病假，会在选定机场安排适当的储备机组。重要的是，航空公司期望所有排班机组成员都应充分休息并适合执勤。另一要求是他们不得受违禁物质或酒精影响，并满足所有相关法规要求。因机组培训要求，航班上可能有额外机组成员。这可能是客舱内接受培训的额外乘务员，或监督实习生、或在飞行期间对所有机组活动进行航空公司审计的乘务员。在驾驶舱内，检查与训练机长可能监督其他机组成员。包括报到和下班时间在内的最长执勤时限，由监管机构和航空公司共同规定。对于计划飞行时间超过（例如）12
  小时的定期长途航班，需安排加强机组（有时称为“重型机组”）以限制机组操纵飞机的时间。这种额外的机组配置可使执勤时间延长至 20 小时（视航空公司劳工协议而定）。未来更长航程的航班（要求机组执勤时间超过
  20 小时）将需要特别豁免。那么，加强机组的构成除“正常”机组的机长和副驾驶外，还可能包括另一名机长、另一名副驾驶或二副、或一名机长和一名副驾驶；后者提供两套完整的机组。在这些长途飞行中，机组将轮流在专用机组休息区休息。






  # 运行计划与准备维护


  在当日开始之前，`IOC` 预期按计划运行所有机队飞机，飞机处于适航状态且无运行限制。此外，维护设备和备件预期能在适当港口支持飞机且处于适航状态，且有足够劳动力执行计划维护活动。这是理论情况。然而，由于多种原因，这一理想状态往往无法实现。


  在设备方面，故障确实会发生，所需零件可能不可用或未就位。例如，若计划飞机飞往某港口或抵达某港口时其 `APU`（飞机辅助动力装置）不适航，则 `GPU` 需处于适航状态，以便在起飞前启动发动机。


  飞机可能不完全适航，但处于可继续服役的状态。例如，它们可能在 `MEL` 下运行，这实际上允许飞机在特定条件下飞行，但并非所有飞机部件都能正常工作或工作。例如，飞机可能被授权仅在两个空调包中的一个适航的情况下运行，但可能受限于例如
  `25,000 ft` 的巡航高度，在飞越山区地形的情况下，这可能成为一个限制因素。另一个考量是飞机在此较低高度会消耗额外燃油，这可能是 `IOC` 决定将该缺陷飞机调往何处的另一因素。


  或许防冰系统不适航，导致飞机无法在已知结冰条件下运行，或某发动机的推力反向器被锁定，这可能限制着陆条件。在这种情况下，飞机可能无法在侧风条件下于湿跑道上运行。


  在某些情况下，可能需要执行一套独特的程序。例如，看似微不足道的问题，如机翼尖的彩色（红/绿）航行灯不适航，飞机可能可以在 `MEL` 下放行，但这样做可能要求飞行前通知相关方，如航空公司总飞行员或值班飞行员、飞机制造商、出发和到达机场的塔台管制、监管机构以及航路
  `ATC`。


  除了 `MEL`，飞机还可能在 `CDL` 下运行。即飞机可被授权在缺少外部部件的情况下离港。例如可能是一个面板或整流罩，虽被拆除但仍允许飞机运行，尽管可能有速度和/或高度限制。


  为使这些运行成为可能，航空公司的维护程序还必须确保持证工程师/技术员对飞机进行“签署放行”，以符合制造商、监管机构及航空公司运行手册中规定的自有程序和流程。工程部门还必须通知运行机组及其他被认为需要知情的人员。此类运行限制常导致性能下降，如额外燃油消耗、飞行时长增加、航程减少，或需要
  `ATC` 的特殊许可。


  # 飞机特性


  常旅客会留意起飞前的安全演示，其中提及各飞机型号的差异。这是提醒乘客注意每架飞机的个别特性，特别涉及各类安全相关设备的存放和使用。


  从运行角度看，属于特定机队的飞机单元也存在差异。一家购买了例如 `30 B737-800` 或 `A320-200` 飞机（即同型号 30 架）的航空公司，可能要求制造商或自行将其中一些飞机配置为满足特定用途或任务。


  此外，同时运营国内和国际航线的航空公司可能利用机队单元服务于两个网络。例如，一架执飞纽约至都柏林的 `A330` 也可能服务于纽约至丹佛航线。该飞机很可能按配置（如座位、厨房和厕所布局）和装备（机上娱乐系统
  `IFE`、机组休息设施和工作站）来满足航空公司国际航线所需的服务水平。但航空公司可能也需在短期内将该特定飞机用于部分国内运营，例如填补另一机队单元不可用的空缺。在这种情况下，考虑到变更的短期性质，改变国际配置飞机的特性在时间或成本上过高，航空公司只能接受运营“非标准”飞机的现状。乘客在机上也可能明显感受到显著差异。


  另一种常见做法是从另一家航空公司或公司（如租赁公司）包机。这可能因多种原因，包括航空公司自身机队短缺或多架飞机不适航、超出航空公司自有资源能力的重大运力需求，或因重大扰乱（如多航班备降）影响自有飞机。在这种情况下，一种解决方案可能是租入额外





  # 运行计划与准备


  ## 仪表设备


  增加或选择特定的驾驶舱仪表设备，可使特定飞机在具有挑战性的机场环境或恶劣天气等情况下运行，或使用先进的导航辅助设备和程序运行。


  例如，**RNP-AR**（所需导航性能——授权要求）利用 GPS 技术，使飞机能够精确进近指定机场，这些机场通常周围地形复杂或气象条件恶劣。


  其他精密进近（如 **CAT III 进近**）也使飞机能够在极低能见度条件下进出特定机场。


  飞机可装配不同的防撞系统（**TCAS**）。例如，**TCAS I** 仅提供接近警告，而 **TCAS II** 会分析评估任何冲突航迹并提供适当的解脱建议机动。


  值得注意的是，并非航空公司机队中的所有飞机都装配相同的设备，这意味着只有选定的飞机才能执行特定航线或进出某些机场，从而在一定程度上限制了 **IOC** 可用解决方案的灵活性。


  航空业持续追求两大目标——安全和成本效益。为实现这些目标，它不断改进机载和地面系统支持，使航班能在几乎任何条件下、任何地点运行，做到尽可能安全、限制最小。


  ## 重量限制


  飞机的制造和运行均需遵守若干重量参数。航空调度员和载荷控制员当然知晓这些重量及其对其所有飞机载荷能力和运行性能的限制影响。[¹]


  因此，机队中某些飞机可能具有更高的结构重量限制，从而能够搭载更重的载荷和/或飞行更长的距离。相反，机队中某些飞机可能会减轻重量（例如，通过拆除厨房、厕所、座位或机载耗材）。


  最大限度降低总重量从而降低运营成本的一个后果可能是有益的，例如，当飞越某些空域或经由某些机场运行的费用可能直接与飞机重量相关时。


  ## 燃油容量与消耗


  为实现更长的飞行时间，机队中的专用飞机可能会加装额外燃油箱和/或以更高重量运行（无论是在制造阶段还是改装后），使其在航线上的执行能力优于同机队的其他飞机。


  可实现的航程增加可能只是增量式的，但很可能促成直飞运行或增加载荷，并可能使 **IOC** 在特定情况下倾向于选择某一架飞机而非另一架。当然，如果专用飞机无法执行选定航线，这种独特性也可能适得其反。


  飞机重量也会影响所需携带的燃油量，因此减轻重量可改善燃油消耗（使用量）。


  除上述拆除设施外，某些飞机还可能对机身进行改装以改善空气动力学性能并减少燃油消耗。例如，机翼尖的各种形状加装或改动（根据其具体设计分别称为 **winglets**、**sharklets**、**scimitars**
  等）可能由制造商在新造飞机上安装，或改装到现有机队的飞机上。


  航空公司可能会接收具有这些改进设计的新飞机，与现有机队一起运营。因此，可能会优先安排此类机身执行长途航线，以节省燃油。


  ## 发动机减推力


  为延长发动机寿命并有助于控制维护成本，航空公司可能选择对特定飞机的发动机进行降额（通过限制可用推力），从而相应限制飞机性能。


  因此，同一机型的机队可能装配两种推力设置的发动机；例如，24,000 磅和 26,000 磅推力。其后果是，装配较低额定推力发动机的飞机可能被视为不适合或不优先从某些机场起飞（如高海拔、高温或跑道较短的机场）或执行需要更高性能的航线。这在一定程度上可能限制其运行使用。


  由于改装发动机成本显著（例如 100 万美元以上），成本/效益分析需提供充分理由。


  ## 客舱配置与机上娱乐


  某些航线经济性可能要求座位配置有所变化。因此，机队中部分飞机可能配置为高密度座位，例如包机运营可能需要，甚至拆除部分座位以执行特殊任务。


  组成同一机型的飞机组合也可能导致配置差异。例如，同一机型的初批交付飞机可能有 180 个座位，但后续机型因改装或前任所有者的配置而有 186 个座位。


  其他对高端舱位需求大的城市对，可能会导致配备更多头等舱/商务舱座位的专用飞机主要服务于该航线。


  因此，机载厨房设备和餐食要求在不同飞机间可能有所不同。此类设备的差异，或无法提供适合商业需求的相应餐食服务，都是 **IOC** 在为一组航班选择特定飞机时面临的其他限制示例。


  座位配置不同的飞机可能更适合某些航线，但如果 **IOC** 需要从大配置飞机“降级”换用小配置飞机，这可能成为劣势来源。可能出现旅客卸载情况，或在舱位大小变化的情况下，导致高端旅客舱位降级。


  此外，**IFE**（机上娱乐系统）也可能不同。在某些情况下，航空公司引进新制造的飞机，或从其他机构购买/租赁飞机时，其 **IFE** 可能与机队其他飞机现有的
  **IFE** 完全不同。


  近年来，我们观察到技术持续改进——从占据货舱大量空间、仅提供有限娱乐的大型笨重机上视频系统，发展到如今轻量化、占用空间小、提供多样化娱乐选择的 **WIFI**
  系统。


  结果是，飞机总重减轻（从而降低燃油消耗），腹舱货舱空间增大使载荷能力提升，旅客满意度也得到改善。


  ## 机组休息设施


  在长途航班上，机组成员（包括飞行员和乘务员群体）必须配备机组休息设施。根据飞行段长度，必须提供一定数量的床位（法规要求机组需水平休息），并设置在飞机专门设计的安全区域内。


  自然，为执行此类航线配置的飞机在制造时就会包含这些设施，而


  [¹]: 5





  # 运行规划与准备


  ## 机队考量


  ### 除虫（或消毒）


  大多数国家要求从事国际运营的飞机必须进行除虫。该过程属于国家生物安全程序的一部分，通常按固定间隔执行。过去，抵达某些国家的飞机客舱可能需要由检疫官员喷洒药剂，这一过程给旅客带来极大不适，当然也延误了下机。庆幸的是，这种情况现在已很少发生；最近，航空公司必须遵守经认证的程序，作为持续维护程序的一部分，按固定间隔对飞机进行除虫。但在运行层面，如果航空公司希望在国际机队和国内机队之间调换飞机，必须确保有合格除虫的飞机可用于执行国际航班计划；若飞机不合规，仍可能需要实施检疫喷洒程序。


  ### 涂装方案


  有时飞机会被涂装成区别于航空公司标准涂装的特定配色方案。这可能是为了推广特殊活动（大奖赛、奥林匹克运动、健康或其他特殊事业）、航空公司的联盟合作伙伴关系、强调原住民文化，或可能反映了作为企业营销推广一部分、将所有公司飞机更新为新涂装方案的过程。此类推广可能要求特定飞机执飞专用航线结构。在较为罕见的情况下，航空公司可能选择隐去飞机标识（通过“涂白”覆盖标记或颜色），或许是为了租赁安排或出于政治原因。


  ### 机队升级


  航空公司有时会决定升级机队，以适应变化的商业模式、应对竞争，或仅仅是因磨损而刷新产品供给。此类升级范围可能从内部装饰性变更（如装饰、地毯、座椅和头枕套）到更重大的变更，如整体更换为新款式座椅，或重新设计的平躺床座椅（可能更纤薄、重量更轻）。这些变更的过渡需耗费相当长时间（例如每架飞机六周），因为飞机通常将此项工作作为正常维护计划的一部分进行，从而避免过多飞机脱离飞行模式。


  ### 所有权与保险


  租赁外国飞机或机队中包含未在本国注册的飞机的航空公司，可能因合同条款或保险条款而受限，无法将该飞机派往海外。这不仅适用于机身，也适用于发动机。对于拥有自有与租赁混合机队的航空公司（这在许多航空公司中很典型），因这些原因产生的限制对
  IOC（综合运行控制中心）而言是相当限制性的运行因素。


  ## 运行要求


  ### 跨水运行


  根据法规，跨越大面积水域运行的飞机必须携带容量足以容纳飞机全体乘员的救生筏，以应对紧急水上撤离。在某些机型上，救生筏集成在应急门/滑梯系统中，或永久固定在飞机的部分区域（如顶部空腔），或按飞机配置以其他方式安装。一旦乘客人数超过固定救生筏容量，则需额外装载救生筏。若飞机执行非跨水运行，则无需配备救生筏；若配备将不必要地增加飞机运行重量，从而增加运行成本。然而，人们很快会意识到，若进行换机，确保相应设备已安装到飞机上便成为运行效率和维护审查的一个因素。


  ### ETOPS（延程双发运行）


  ETOPS 飞行审批的要求与知识本身就是一个卷册（或培训课程），远超出本文范围。在 IOC 语境下相关的是：执行 ETOPS 飞行的飞机运行可用性，以及对任何可能阻碍或扰乱正常运行的问题的关注。与
  ETOPS 飞行相关的主要考量之一，当然是航路发动机关车的极低概率事件，以及随后需依靠剩余发动机飞往备降机场。凭借当今复杂的发动机性能与可靠性，IFSD（空中关车）率已变得极低。ETOPS
  飞行的大部分准备工作由工程部门执行，以确保符合各项审批规则。其中绝大部分维护工作涉及对以下项目的严格检查（及适用的维护）：例如飞机结构与状况、相关系统、警报与警告、发动机参数、APU
  适航性、技术日志、MEL 和 CDL 项目。近期制造的飞机获准执行更高等级的 ETOPS 运行（如 240 分钟），意味着飞机系统内置了更多冗余。然而，这些项目的运行适航性仍至关重要，可能完全阻止飞机执飞，或限制其运行航程或航线。鉴于
  ETOPS 的性质，航空公司可能选择指定特定飞机执行此类运行，这在航班排班方面可能令人满意，但在飞机不适航时（尤其是在起飞前夕）会限制运行功能。


  ### 包机运行


  航空公司机队中通常预留一些运力以执行包机飞行。这些航班通常供包机方专用（即不公开销售），可能包括慈善航班、FIFO（进出飞行）航班（见下文），例如为矿业公司服务。也可能包括飞往南极洲的航班，甚至环球观光旅行。有时可能有政府或军事包机需求，利用航空公司飞机满足特定国内或国际目的。所有这些运行都需要独特的准备，飞机可能需要特殊设备以完成任务。


  ### 搜索与救援（SAR）


  有时，航空公司可能应各主管部门要求，提供配备机组和观察员的飞机，在偏远或恶劣地区搜寻失踪人员、失踪飞机，或在海上遭遇故障或遇险的船只。从地面调动开展搜救行动所需的资源，很大程度上取决于具体的出发港口以及航班计划。





  # 运行规划与准备


  使飞机能够被释放执行搜索任务。值得注意的是，合适飞机的可用性很重要，因为它可能需要持久的续航能力往返搜索区域，并具备良好的执行任务能力。


  ## 特殊运行


  有时可能需要运营“救援”包机。这可能是由于地震、飓风或海啸等事件导致地区毁坏和/或人员流离失所，或因饥荒、疫情或战争等人道主义原因。此类请求通常由政府机构驱动，寻求航空公司协助提供带机组的飞机，在指定时间内往返特定地区。对于大规模运行，机组可能需要被“分阶段安置”以定位他们飞往指定航段。地面资源也必须安排妥当，特别是在非航空公司驻站港口。在世界某些地区（例如澳大利亚内陆偏远地区），大量采矿活动需要大量包机航班将矿工送进送出现场（`FIFO`）。这些机场通常很简陋，只有一条硬化跑道以允许在大多数天气条件下运行。然而，通常没有航站楼、导航设备、灯光、燃料、工程支持或地面电源。因此，`IOC`，特别是工程职能部门，需要确保指派执行此任务的飞机适合任务（例如，拥有可用的
  `APU` 以确保发动机启动有电源可用），并且飞机系统（例如航空电子、电气、液压）没有其他可能阻碍运行的故障。如果任务需要在停留较长时间（例如 8 小时），或一天到达第二天离开，飞机需要在机场得到妥善保管，机组通常在矿区安排住宿。


  ## 政治敏感运行


  与上述部分相反，可能出现政治局势或特定情况，完全阻止运营人执行往返或在特定国家内的航班，或排除使用可识别属于特定航空公司的飞机执行任务。因此，可能去除航空公司标识或涂装，使任务成为“白尾”运行。


  ![](img/bg5f.jpg`)


  ## 应急规划


  在运行日前夕的最终规划当然将确保时刻表能按预期执行。飞行规划/导航职能是其中的关键部分，解决因评估远程计划承诺而产生的任何复杂性或挑战，特别是那些可能涉及运行性能问题的（例如起飞重量或最大航程问题，和/或潜在的载荷卸载情况）。编制的飞行计划还考虑了主要和备用备降港，以防万一发生不可预见的情况，或确实是已知问题的情况，例如恶劣天气、火山活动或政治动荡地区。这些航路潜在备降港也会被检查以确保符合公司政策，因此在必要时能够使用。


  ### 公司燃油政策


  可能有要求实施影响部分运行的特定燃油政策。公司政策可能规定从特定港口加油，以便在不在另一港口加油的情况下完成往返行程。这可能是为了价格优势，或为了确保燃油质量。这样调运燃油总体上可能有财务或质量收益，但也可能付出代价，例如，如果因始发站大量加油导致载荷限制。无论如何，调运燃油会因初始离港时飞机重量增加而增加直接运营成本。燃油政策也可能在燃油限制或不可用的可能性下被启用。这可能意味着需要携带额外燃油以避免在第一目的地加油，预期在后续港口加油（称为下一港口燃油）。


  ## 最终 IOC 准备——交接政策


  随着运行日临近，时刻表应在商业上得到优化。即航空公司已实现其预期商业目标（如市场份额、客座率、服务水平等）并制定了稳健的时刻表。此外，所有相关筹备资源应完全组织就绪。在运行日前几天（从
  72 小时到约 14 天不等），`IOC` 接管微调计划的责任。从这个意义上说，商业时刻表正在被“运营化”，确保计划维修工作得以完成，机场地面服务能力得以满足，机组搭配和排班满足飞行任务。这个时间窗口是将机队分配给组成时刻表的飞行模式的时机。对于国际运行尤其重要，因为飞机随后会承诺执行可能使其离开航空公司主基地（因此也离开维修支持）数天的模式。运行日前的期望是没有任何遗漏或侥幸。当然，尽管为达到这一时刻付出了共同努力，计划措施的组装与确保最高成就水平所实际需要的之间总存在一定程度的脱节。因此，可能需要进一步调整时刻表以应对应急情况，如运行要求（例如性能问题）、环境问题（例如高温、大风，如上所述）或最近发布的
  `NOTAM`。当然，在这些正常情况之外，还潜伏着其他威胁或潜在破局局势，如酝酿中的工业行动、政治或社会动荡，或成型的天气模式，任何这些都可能影响即将发生的时刻表。


  ### 交接


  规划活动完成后，最后一点是每天在 `IOC` 众多地点进行一次、两次或多次的交接。离岗班次可能度过了平静的白天或夜晚，或者可能因一系列复杂的多重破局事件而付出巨大努力，导致高压力水平。无论哪种方式，向接班管制员的交接都需要捕捉将驱动下一班次的核心内容。因此，简报通常由航空公司运行的事件及当前或潜在状态的记录（电子或其他方式）摘要组成。如果需要历史记录，背景信息也可通过适当记录的数据获得。交接涵盖以下主要重要信息：


  a) 网络运行总体状态；

  b) 重大延误、备降或取消；





  # 74 运行计划与准备


  - **c)** 所有机队单位的状况（即：适航性、缺陷、限制、要求）——这包括目前正在维修但可能在当天恢复执行航线飞行的飞机；

  - **d)** 非标准运行——这可能包括包机（例如：南极观光）、宗教活动导致的高客流量，甚至关键长途航班；

  - **e)** 机场设备或设施（例如：导航设备——仪表着陆系统（ILS）的损失可能限制进近程序）；不可用的 GPU——若一架 APU 不可用的飞机计划飞往一座
  GPU 不可用的机场，这将非常关键，因为地面可能没有任何支持设备用于发动机启动等需求；不可用的登机廊桥；以及燃油供应情况）；

  - **f)** 任何跑道、滑行道关闭或施工，任何影响当前或即将进行运行的 NOTAM；

  - **g)** 天气状况——包括当前和预期（例如：当天雷暴预报，或夜间大雾）；

  - **h)** 商务问题（团体出行、贵宾、重要旅客），如需保障的重点航班、高或低客座率，以及任何潜在的超售/卸载情况；

  - **i)** 人员配备或其他资源问题；

  - **j)** 其他杂项问题。



  # 天气场景：JFK 机场降雪


  ## 第 150 页：初步评估


  一旦收到这些问题的答案并完成评估，便开始考虑采取任何行动。不过，在此阶段，`IOC`（运行控制中心）几乎无法采取实质行动，除非开始研究飞机若需备降时的备选方案。`IOC`
  的一项关键任务是与利益相关方沟通，因此将向 `IOC` 职能部门（如 `Crewing`（乘务调度）、`CJM`（客户旅程管理）、`Media`（媒体））提供情况更新。`CJM`
  人员当前最关心的是**后续运输**——即现在可能面临风险的联程航班数量。与 `JFK` 港口的对话与更新，以及如果可能的话，通过 `SATCOM`（卫星通信）直接与机长联系，将有助于全面掌握情况。在此阶段，预计
  `811 JFK-LAX` 航班将延误（如 `图 6.2` 所示），但 `IOC` 将不愿设定三小时的延误时间，因为这是基于 `ATC`（空管）告知 `WBB`
  的等待时间。通常，天气和空中交通状况等环境可能会变化，导致等待时间大幅缩短，或者相反，进一步延长。因此，`IOC` 在设定延误时间（以便通知客户、安排人员和资源匹配较晚的时刻表）时将保持审慎。不过，`IOC`
  将开始研究假设场景。如果 `WBB` 等待，比如说 1-2 小时，然后降落，那么 `811` 只是晚点飞往 `LAX`，对航线网络没有进一步影响。但如果飞机备降，客户和飞机的恢复将变得更加复杂。在此阶段，更新的信息将决定下一步流程。


  ## 第 151 页：更新 @ 1915 UTC


  `JFK` 的天气未见好转，目前仍有多架飞机在盘旋等待，尽管一些国内承运人已备降。`WBB 811` 已在纽约以东巡航高度盘旋等待约 90 分钟（以尽量减少燃油消耗）。克利夫兰港口管制部（`DPC`；负责管理和运营
  `CLE` 机场）建议，尽管 `CLE` 的天气仍适合运行，但机场已陷入**瘫痪**。这是由于早先几架备降飞机导致地面严重拥堵，不再有可用登机口。因此，`DPC`
  建议 `CLE` 现在不适合作为 `JFK` 的备降机场。此建议由 `JFK` 站长接收并传递给 `IOC`，站长从当地港务局收集信息并获取更新。`811` 机组随即获悉此情况。结果，`WBB`
  通知立即备降至 `ORD`（位于 `JFK` 西侧 643 海里），�计到达时间（`ETA`）为 2120。请参阅对页 `图 6.3`。圆圈中的 `i` 警报（在此示例中仅作为高亮显示）指示了备降情况，以及因此导致
  `JFK` 无飞机执行 `811 JFK-LAX`，进而影响 `WBB` 后续的飞行模式。



  Contracted 3rd Party Providers

  ```


  ## 机场联系轨迹


  每个（服务）机场的关键职能之一是港口协调员或机场站长/值班经理（或类似名称/级别）。本质上，这是一个航空公司角色（即不属于机场所有权或运营——而是航空公司在机场的最高代表）。IOC
  内的机场联络角色与机场的该职位有直接联系。因此，两者之间的沟通和信息传递简洁、快速且与当前问题相关。港口协调员/站长将所有机场职能联系在一起，直接联系餐饮、加油、工程师、停坪官员、航站楼工作人员、机场当局、ATC、航空公司合作伙伴、竞争对手和签约的第三方供应商。该职位还监督可供员工和公众使用的信息系统（航班信息显示屏）。因此，关于延误和取消的信息控制不仅掌握在
  IOC 手中，还需与港口协调员/站长协商，后者与旅客面对面接触，其工作场所可能直接受到大量中断（有时愤怒）旅客的影响，以及拥挤的登机口和停坪区域的影响。


  如果延误过长或航班取消，这种中断开始考验机场能力。夜间可能因后续的交通、住宿和餐券需求而加剧。繁忙航站楼登机口的延误可能因有限的停机位而对到达交通产生连锁影响。在某些机场，专用登机口适合特定机型，会产生进一步的复杂性。图
  5.6 描绘了机场联系轨迹。



  ## 广角镜头\n一种镜头，可在有限空间内看到更宽的图像，与其他标准镜头类型相反。\n\n## 广域网（WAN）\n分布在广阔地理区域的网络。\n\n## Wi-Fi\n\
  无线保真（Wi-Fi）是一种无线网络技术，可为电子设备提供访问局域网的连接。\n\n## WiGLE\n用户使用并贡献的在线数据库，用于跟踪和记录无线网络信息。\n\

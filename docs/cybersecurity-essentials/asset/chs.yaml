- "## 保护内部边界\n\n*一般来说，在*你突破了外部边界防御之后，可以将内部边界视为如图 8.1 所示的三层结构的一部分。可以将此边界视为由操作系统及其应用程序组成，它们构成了通往存储于内部区域（文件夹和文件）中数据的网关。\n\
  \n- 描述主机设备的本地登录和用户配置选项。\n- 比较和对比常见操作系统的安全功能。\n- 识别基于 Windows 和 Linux 系统的常见日志记录和审计选项。\n\
  - 解释不同操作系统环境中静态数据加密的选项。\n\n### 内部边界\n\n我们试图保护的有价值信息通常是以不同类型的文件形式存储在计算机硬件中的数字数据。这些文件由应用程序创建和解释。如果没有应用程序来解释数据，就很难确定数据实际含义。见图\
  \ 8.1。\n\n![](img/2459befd842d6fed299fabe6da3512d0_171_0.png)\n\n应用程序的运行和对文件的访问由操作系统（OS）控制。操作系统协调硬件系统及设备与软件应用程序的运行。应用程序是为特定操作系统设计的，因此它们依赖于这些操作系统。如果没有某种转换器的介入，它们将无法在另一个操作系统上运行。\n\
  \n操作系统还负责跟踪数据在系统中的存储位置以及如何定位和访问数据。如果没有操作系统的文件管理系统（FMS），就无法知道如何找到要窃取、损坏或销毁的数据。每个主要的操作系统供应商都使用不同的文件管理系统。\n\
  \n因此，要访问计算机上的数据，你必须访问由操作系统控制的正在运行的系统。然后你需要能够定位文件，这需要具备浏览操作系统文件系统的能力。最后，你需要打开文件，这需要应用程序软件或用于在数字代码级别检查数据的软件。\n\
  \n操作系统或常见应用程序本身对于盗贼来说没有太多实际价值。这类软件通常随处可见、相对便宜，并且难以在系统之间转移和使用。这些程序基本上只是用于创建和处理信息的工具。然而，它们对潜在的黑客很有吸引力，因为它们可以被访问并重新用于恶意和非法操作。\n\
  \n另一方面，存储在计算机上的数据文件对盗贼来说可能非常有吸引力。毫无疑问，你很清楚，关于大多数人的数字信息非常多，而且都存储在某个地方的计算机上。如果有人能够找到并访问这些数据文件，他们就能找到从中提取信息的方法。\n\
  \n一旦他们获得了文件（或其副本），他们既可以在自己的系统上使用最初创建该文件的同一应用程序打开它，也可以从数字代码中提取信息。后者往往更为复杂且难以完成，通常需要具备黑客技能和使用工具的人在该层面操作。\n\
  \n然而，并非每个恶意操作者都想窃取信息。有些人、组织和政府只是出于某种原因想要破坏或销毁数据。这类活动可能出于多种不同的动机，如本书引言中所述。\n\n那么，如何防止不受欢迎的人访问这些程序呢？让我们首先看看不同供应商的典型操作系统，并了解它们提供了哪些安全选项。正如你将在以下部分看到的那样，操作系统往往内置了许多安全工具和选项。\n\
  \n## 操作系统\n\n*操作系统*是旨在控制和协调计算机系统运行的程序。作为一个群体，它们很容易成为有史以来最复杂的程序之一。\n\n在所有基于微处理器的环境中，操作系统接受来自程序或输入源（如计算机用户）的命令并执行它们以完成所需的操作。同样，操作系统充当几乎同样复杂的软件应用程序与其运行的计算机硬件之间的中介。\n\
  \n### 关于操作系统的一些澄清\n\n除非显示器具有输入功能，否则它不被视为可利用的访问设备。打印机或其他仅输出设备也是如此。\n\n世界上使用最广泛的操作系统与个人计算机无关。这些操作系统存在于汽车和消费电子产品中。它们从传感设备（如空气流量传感器，而不是键盘和鼠标）接收输入，根据一组指令和输入数据执行控制程序，并将输出提供给机电设备（如燃油喷射泵，而不是视频显示器和打印机）。它们与磁盘驱动器也没有太大关系。\n\
  \n磁盘操作系统（DOS）是一组用于控制基于磁盘的系统中整体计算机操作的程序。这些程序在后台运行，允许计算机用户从键盘输入字符、定义用于存储记录的文件结构，或将数据输出到监视器或打印机。磁盘操作系统负责在磁盘上查找和组织你的数据和应用程序。\n\
  \n如图 8.2 所示，磁盘操作系统可以按照四个不同的部分进行组织：\n\n- 引导文件在启动期间从 ROM BIOS 接管系统硬件的控制。它们将操作系统内核文件加载到\
  \ RAM 内存中，以便用于控制系统操作。\n- 内核文件是操作系统的基本逻辑文件，负责解释从软件程序获得的、供中央处理单元使用的命令。这些文件是为特定的硬件架构（微处理器和芯片组）而创建的。\n\
  - 文件管理文件使系统能够在自身内部管理信息。这些文件负责将数据存储、跟踪和检索到微处理器可以访问的 RAM 内存中。\n- 实用程序文件是允许用户管理系统资源、排除系统故障和配置系统的程序。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_174_0.png)\n\n**图 8.2** 基本操作系统文件结构\n\n\
  操作系统充当应用程序与计算机硬件之间的桥梁，如图 8.3 所述。这些应用程序使用户能够创建与特定应用相关的数据文件，例如文字处理、多媒体传输、远程数据通信、业务处理和用户编程语言。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_174_1.png)\n\n**图 8.3** 操作系统在计算机系统中的位置\n\
  \n由于操作系统是通往计算机应用程序和数据电子网关的主要部分，你必须了解可用的不同一般类型操作系统，以及可用于保护它们的方法和技术。为了便于讨论，让我们根据它们所扮演的角色，将用于计算和智能控制设备的计算机操作系统分为三大类：\n\
  \n- **独立操作系统** – 这些操作系统可以在没有外部通信或管理的情况下独立运行。此类操作系统包括在消费类计算机上发现的不同 Windows、Mac 和基于\
  \ Android 的版本。然而，这一名称也适用于工业和制造应用中使用的许多智能控制设备的操作系统。\n\n虽然这些操作系统版本可以独立运行，但大多数现代版本都具备一定的网络功能，允许它们与其他智能设备或互联网通信。\n\
  \n- **客户端操作系统** – 客户端操作系统设计用于网络环境。特别是，它们被设计为利用称为*服务器*的主计算机提供的服务。虽然服务器计算机负责通过各种网络服务对客户端计算机进行监督和控制，但用户通常不在这些计算机上工作。相反，客户端计算机和设备充当工作站或自治节点。网络客户端分为三个一般子类别：\n\
  \n- **胖客户端** – 这些是全功能的 PC 和设备，可以在本地工作，但依赖网络服务器提供的服务。数据通常存储在胖客户端的本地。\n\n- **瘦客户端**\
  \ – 这些是全功能的 PC 和设备，但没有用于存储的硬盘驱动器。操作系统仅用于启动系统，然后将其操作交给服务器。所有数据和程序都存储在服务器上并在服务器上执行。\n\
  \n- **终端客户端** – 这些是依赖服务器的 PC 和设备，客户端上不存在操作系统。相反，客户端实际上启动到远程服务器，所有程序和数据都位于服务器上并在服务器上执行。\n\
  \n\n\n\n\n- **服务器操作系统** – 这些操作系统设计用于运行在专用服务器计算机上，后者作为客户端/服务器网络环境的中心。服务器操作系统版本通常负责：\n\
  \  - 网络及其设备的 数据和资源安全\n  - 集中式网络管理\n  - 为企业或机构带来的成本效益\n  - 服务器操作系统通过控制对以下内容的访问来为网络及其客户端提供安全保障：\n\
  \    - 资源（磁盘驱动器、打印机、目录和文件）\n    - 服务（电子邮件、互联网连接、即时通讯服务、数据库等）\n    - 管理工具（用户账户、本地和网络实用程序、计算机管理工具）\n\
  \n## 网络操作系统\n\n网络操作系统（NOS）旨在扩展磁盘操作系统的控制，以提供通过通信媒体连接的计算机之间进行通信和数据交换的功能。值得注意的网络操作系统包括\
  \ Windows Server OS 版本、Linux 服务器发行版和 Unix。\n\n服务器操作系统是网络环境中负责安全的主要工具之一。这些操作系统及其安全工具将在第\
  \ 14 章中深入探讨。本章的其余部分涉及可在本地独立或客户端计算机级别实施和可用的安全工具。\n\n值得注意的独立或客户端磁盘操作系统包括：Microsoft\
  \ Windows 版本、Apple Computer 的 MAC OS X、各种 Linux 操作系统发行版，以及 Google 的 Android 操作系统。\n\
  \n- 操作系统及其控制的程序和数据来自两个常见区域受到攻击：\n  - 通过操纵 OS 内核的运行\n  - 通过攻击其文件管理系统\n\n以下各节针对这两个常见的攻击区域。\n\
  \n## OS 内核安全\n\n图 8.4 说明了 OS 内核在系统硬件和应用程序之间的位置。由于这种定位，很明显，如果你能够访问 OS 内核中的编程代码并禁用它，你就禁用了整个计算机系统的运行。然而，如果你能够访问内核并操纵代码，你就接管了计算机的运行。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_177_0.png)\n\n图 8.4 内核的位置\n\n攻击者如果对给定操作系统的内存处理策略有足够的了解，可以以多种不同的方式利用\
  \ OS 内核：\n\n- 他们可以更改内核编程中变量的值以改变其行为。\n- 他们可以更改某些标准 OS 函数的返回地址，以便当 OS 试图返回到其基本指令流水线时，它被重定向到攻击者提供的代码中。\n\
  - 他们可以更改程序中的指针，该指针将指令代码的执行定向到攻击者提供的异常处理程序。\n- 他们可以将恶意代码插入到已加载到 RAM 内存中以供执行的应用程序代码中。插入的代码旨在覆盖与应用程序交互的内核组件。\n\
  \n所有这些攻击都依赖于获得对计算机内存中 OS 内核运行的特定区域的访问权限。\n\n大多数操作系统利用内置于微处理器硬件中的一项功能来保护包含特定指令代码块的某些内存区域。该功能被称为\
  \ *No eXecution (NX) 位*，或 eXecute Disable (XD) 位。NX 位技术用于将某些内存区域标记为仅存储。\n\n任何标记为\
  \ NX 属性的内存部分意味着它仅用于存储数据。因此，处理器指令不能存储在那里。这是防止恶意软件通过将代码插入到另一个程序的数据存储区域然后从该区域运行该代码来接管计算机的流行技术，就像缓冲区溢出攻击一样。\n\
  \n一些操作系统随附内置的可执行空间保护功能，被称为数据执行 prevention（DEP）模式，以击败这些类型的攻击。操作系统通过为机器上运行的每个应用程序创建唯一的、隔离的内存区域来实现这一点。每个隔离的内存区域都成为由微处理器的虚拟内存管理模块管理的虚拟环境。\n\
  \n在 Unix、类 Unix 和 Linux 操作系统中，此功能作为其标准 chroot 操作的高级实现提供（其用于创建和管理操作系统的多个虚拟化副本的系统）。\n\
  \n## 文件系统安全\n\n*文件管理系统* 在保护存储在硬盘或可移动存储设备上的数据的存在和完整性方面极为重要。如果文件系统被破坏或损坏，数据将无法访问并丢失。此外，如果未经授权的用户获得对文件系统及其存储数据的访问权限，他们就获得了破坏、销毁或窃取数据的机会。\n\
  \n保护文件系统及其数据的主要工具之一是使用访问控制列表（ACL）来提供资源访问控制。文件管理系统使用 ACL 来授予或拒绝特定用户访问其不同文件的权限，以及控制在获得访问权限后个人可以执行哪些类型的活动。例如，你可能被赋予运行文件、读取它、写入它或在文件管理系统的控制下对其执行其他操作的权限。\n\
  \n操作系统的 ACL 也用于控制对诸如 TCP/UDP 端口以及 I/O 设备等其他对象的访问。它们的 ACL 表维护记录，标识每个用户对特定系统对象的访问权限。\n\
  \n根据操作系统的不同，资源访问控制可以以强制访问控制（MAC）或基于角色的访问控制（RBAC）的形式实现。Unix 和 Linux 系统通常提供 MAC 方法，而\
  \ Microsoft 的 Windows 平台提供 RBAC 控制。\n\n## POSIX（可移植操作系统接口）\n\nPOSIX（可移植操作系统接口）是一套互操作性标准，旨在标准化\
  \ Unix 和类 Unix 操作系统的变体。POSIX 兼容系统（Unix、Linux 和 Apple OS X 系统）支持某种类型的 ACL 来管理传统的\
  \ Unix 文件访问权限。\n\n在 MAC 版本中，操作系统根据管理员的策略配置设置采取行动，以确定谁可以做什么以及可以做到什么程度。在 RBAC 下，系统根据用户在组织中的角色限制或允许对对象的访问。RBAC\
  \ 结构通常是在大型企业中采用的访问控制方法。\n\n在 Microsoft Windows 环境中，这些功能以权限的形式分配给文件夹和文件。权限也可以定义为执行操作的特权。在\
  \ Unix 和 Linux 系统中，用户被分配对文件的访问权限。\n\n保护数据的另一个工具是对其进行加密，以便在没有解密密钥的情况下变得无法使用。加密/解密过程可以在数据存储和从设备检索时执行（PR.DS-1，静态数据）或在数据从一个位置移动到另一个位置时执行（PR.DS-2，传输中数据）。\n\
  \n## 主要网络安全指南\n\nNIST 关键基础设施网络安全改进框架为保护“静态数据”（PR.DS-1）和保护“传输中数据”（PR.DS-2）指定了保护策略。\n\
  \n大多数可用的主要磁盘操作系统都通过其文件管理系统提供某种类型的数据加密功能。根据操作系统的设计，加密可以应用于设备级别、磁盘（或卷）级别或文件和文件夹级别。第三方加密应用程序也可用于许多这些操作系统。\n\
  \n\n\n\n\n不同操作系统可用的数据加密服务将在以下章节中讨论。本章后面将详细介绍数据加密技术。\n\n## 文件系统攻击\n\n对操作系统文件系统进行的典型攻击包括：\n\
  \n- 使用竞争条件攻击\n- 使用数据流隐藏文件\n- 执行目录遍历\n\n### 使用竞争条件攻击\n\n当攻击者在多用户/多任务环境中利用连续事件的时序，在事件之间将恶意代码插入系统时，就会存在\
  \ *竞争条件*。\n\n例如，当操作系统创建临时文件时，就会存在时间检查到使用时间（TOCTOU）条件。在操作系统检查该文件名是否存在的文件与实际写入文件之间的时间间隔内，攻击者执行程序，使用临时文件的名称保存恶意代码包。\n\
  \n恶意代码可能包含更高的访问权限，以便攻击者可以读取或操作文件，或者它可能包含指向脚本文件的链接，该脚本文件可授予访问存储管理员密码的密码文件的权限。\n\n\
  ### 使用替代数据流隐藏文件\n\n高级黑客使用此 NTFS 操作系统兼容功能来隐藏 rootkit 或其他黑客工具，以建立匿名基地来对系统发起攻击。\n\n\
  ADS 功能最初内置于 NTFS 中，以提供对苹果分层文件系统（HFS）文件系统的支持，该文件系统有时会将数据“分叉”到不同的文件中。然而，这种技术已被采用用于存储文件元数据并提供临时存储。\n\
  \n如前所述，黑客使用 ADS 功能来隐藏他们的工具，因为使用原生用户界面几乎不可能检测到。\n\n在隐藏的 ADS 文件嵌入到某些标准操作系统文件后，它们可以在不被检测为非法操作的情况下执行。ADS\
  \ 操作的唯一迹象是文件上存在非法时间戳，该文件已被注入隐藏工具。\n\n### 执行目录遍历\n\n这些攻击利用安全性不佳的软件应用程序来访问本不应访问的文件，以便“遍历”到更高级别的文件夹或目录，如图\
  \ 8.5 所示。此类攻击也称为 *回溯*、*目录攀爬攻击* 或 *规范化攻击*。\n\n黑客使用这种形式的 HTTP 利用来访问 Web 服务器的目录树。在黑客获得访问权限后，他们可以导航树以查看受限文件或在服务器上执行命令。此类攻击使用常见的\
  \ Web 浏览器针对配置不佳的 Web 服务器发起。\n\n![](img/2459befd842d6fed299fabe6da3512d0_181_0.png)\n\
  \n**图 8.5** 目录遍历\n\n这些攻击可以通过仔细的 Web 服务器配置、过滤 Web 浏览器输入以及使用漏洞扫描软件来最小化。\n\n以下部分比较并总结了最广泛使用的操作系统的关键结构和安全功能。此比较涉及操作系统的版本、内核架构、文件管理系统以及原生数据加密功能。\n\
  \n## Microsoft Windows\n\n微软的 Windows 系列操作系统为个人计算机提供了最广泛使用的桌面操作系统。Windows 是一种基于图形用户界面（GUI）的操作系统，使用户能够通过一系列弹出窗口和菜单在系统中导航。\n\
  \n- Windows 客户端版本 – Windows XP、Windows Vista、Windows 7、Windows 8 和 Windows 10\n\
  - Windows Server 版本 – Windows Server 和小型企业服务器（SBS）版本 2003、2008、2012 和 2016\n\n所有\
  \ Windows 操作系统都设计为可与来自 Intel、AMD 和 VIA 的 x86 32 位和 x86 64 位处理器类型一起使用。Windows XP\
  \ SP2 之后和 Windows Server 2003 之后的 Windows 操作系统支持某些 32 位 x86 处理器上的 XD 位操作，以及提供 NX\
  \ 位支持的 64 位 x86 处理器。\n\nWindows 操作系统支持以下基本文件系统格式：\n\n- FAT/FAT16/FAT32 – 文件分配表系列文件管理系统是基于集群的旧文件管理系统版本，最初开发用于管理软盘上的数据存储。由于其在\
  \ Microsoft DOS 和早期 Windows 版本中的广泛使用，它已经发展并一直使用至今。\n- FAT 标题中的数字代表跟踪磁盘上数据集群位置的表项中的位数。原始\
  \ FAT 标准采用 12 位表项，可以跟踪 4096（1 × 2^12）个表项的位置。FAT 文件系统仍常见于 USB 存储设备、SD 卡和其他闪存设备，以及许多其他便携式和嵌入式设备。FAT\
  \ 文件系统版本为其结构中存储的数据提供的安全工具相对较少。\n- NTFS – 新技术文件系统是微软专有的、默认的文件管理系统，用于其操作系统。NTFS 带来了增强的安全功能，包括访问控制列表（ACL）和加密文件系统（EFS）。\n\
  - ISO 9660（CDFS）– 压缩光盘文件系统是光盘存储的标准文件管理系统。\n- UDF – 通用磁盘格式是 CDFS 文件管理系统的继任者。特别是，它广泛用于\
  \ DVD 和先进的光学存储设备。\n\nWindows 操作系统通过其加密文件系统（EFS）功能提供文件和文件夹级别的加密。完整磁盘级别的加密在某些高端 Windows\
  \ 操作系统版本中通过名为 BitLocker 的原生实用程序提供。这些实用程序将在本章后面详细介绍。\n\nMicrosoft Windows 操作系统提供集成的\
  \ Windows 防火墙功能，使本地管理员（或所有者）能够建立和配置本地防火墙，以通过称为 *数据包过滤* 的过程控制信息从外部网络连接流入和流出本地主机计算机的流程。\n\
  \n## 本地和基于网络的防火墙\n\n本地防火墙的操作将在第 9 章中介绍。网络基于防火墙旨在控制数据流入和流出网络的流程，将在第 12 章中讨论。\n\n\
  ## Unix\n\nUnix 系列操作系统提供模块化、多任务、多用户操作系统环境，最初开发用于在大型机和小型计算机上运行。Unix 操作系统的专有版本包括几个\
  \ BSD（伯克利软件发行版）变体，以及苹果的 OS X 和 iOS 操作系统。几个值得注意的类 Unix 操作系统已从基本 Unix 操作系统派生出来，包括多个\
  \ Linux 发行版。\n\n不同的 Unix 操作系统版本已设计为可与多种不同的微处理器一起使用。同样，不同的 Unix 操作系统版本提供对多种不同文件系统格式的支持：\n\
  \n- UFS – UNIX 文件系统是为原始 UNIX 操作系统设计的第一个结构，并继续在 UNIX 及其衍生产品中使用。该文件系统标准的结构呈现出统一的树形结构，从称为根（/）的主目录开始。\n\
  - NFS – 网络文件系统由 Sun Microsystems 开发，使客户端计算机能够跨网络访问文件。由于 NFS 被开发为开放协议标准，任何公司都可以（并且已经）将其纳入其自己的受支持协议套件中。它主要用于\
  \ UNIX 操作系统版本，但也得到 Microsoft Windows 和苹果 Mac OS 的支持。\n\n\n\n\n\n一些 Unix 操作系统内置了加密文件系统功能。Unix\
  \ 操作系统中作为标准部分包含的最初加密工具是 *crypt*。然而，这个工具被认为是一种功能非常弱的加密工具，相对容易被破解。因此，它并没有被广泛使用。数据加密标准（DES）是一种更强的加密工具，用于许多\
  \ Unix 发行版。Pretty Good Privacy（PGP）是另一种广泛使用的 Unix 加密工具。该工具同时支持私钥和公钥的加密/解密，并提供了一种非常强大的数据安全方法。\n\
  \n基于 Free BSD 内核的 Unix 发行版通过 PEFS、GELI 和 GBDE 实用程序提供加密服务。私有加密文件系统（PEFS）是一种基于文件的加密系统。GELI\
  \ 和基于 GEOM 的磁盘加密（GBDE）是磁盘级别的加密实用程序。另一个用于其他 Unix 或类 Unix 操作系统的著名加密工具是 EncFS。\n\n\
  FreeBSD 和 OpenBSD 发行版还提供了多种内置防火墙实用程序，用于控制数据流入本地计算机。这些选项包括 ipfirewall（ipfw）、IPFilter\
  \ 和 Packet Filter（PF）。与前面提到的集成 Windows 防火墙一样，这些应用程序使本地计算机能够通过称为 *数据包过滤* 的过程来控制传入和传出数据的流动。本地防火墙和数据包过滤将在本章后面详细讨论。\n\
  \n> **关于加密工具的一点说明**\n> \n> 许多国家已制定法律禁止使用强加密。因此，不同的操作系统可能会因销售地点不同而提供或不提供不同的加密工具。\n\
  \n## Linux 操作系统发行版\n\n许多个人电脑用户运行的是一个名为 Linux 的自由分发、开源操作系统版本。Linux 是一个非常强大的命令行操作系统，可用于各种硬件平台，包括\
  \ Windows PC 和 Apple Mac 系统。\n\n一个程序员社区与 Linux 监督委员会合作，不断升级和增强 Linux 的基本结构，使其保持领先和竞争力。此外，一些公司开发了专有的加密服务，可在单个文件或目录上应用，而无需显著的磁盘管理开销。\n\
  \nLinux 发行版通过一个名为 Netfilter 的内核实用程序提供内置的本地防火墙功能。除了为本地防火墙实现提供数据包过滤外，该实用程序还通过称为网络地址转换（NAT）和端口地址转换（PAT）的过程提供额外保护，用于在网络中引导数据包，同时对外部网络的主机屏蔽私有\
  \ IP 地址。\n\n## Apple OS 版本\n\nApple Inc. 生产的个人电脑在本质上与 PC 不兼容。它们具有截然不同的硬件设计，并且不能直接运行为\
  \ Win/PC 环境开发的软件包。\n\n所有较新的 Apple Mac 电脑都运行在一个名为 Apple OS X 的专有 Unix 版本上。虽然 OS X\
  \ 的结构基于 Unix，但系统的用户交互部分采用了 Apple 标志性的基于 GUI 的桌面。这赋予了 Mac 一个非常强大而稳定的引擎，以及非常友好的用户界面：\n\
  \n- Apple 客户端版本：macOS、OS X 和 Mac OS X\n- Apple 服务器版本：macOS Server、Mac OS X Server\
  \ 和 OS X Server\n\nmacOS 被设计用于支持 Intel、Cyrix、VIA 和 AMD 的 x86 和 x86 64 位微处理器类型，以及\
  \ IBM 和 Motorola 的 PowerPC 处理器。这些微处理器都支持 NX-bit 功能，以保护内存的某些区域免受病毒操纵。\n\nmacOS 支持前面描述的\
  \ ISO9660、FAT、NFS、UFS 和 UDF 文件系统格式。此外，不同的 macOS 版本还提供对以下 FMS 标准的支持：\n\n- HFS/HFS+\
  \ – 分层文件系统是 Apple 专有的文件系统，作为其使用 macOS 的 Mac 电脑系列的主要文件系统而开发。它也用于 Apple 的 iPod 音乐设备系列。对更新版\
  \ HFS+ 的支持已包含在非 Apple 操作系统中，包括 Linux 内核和 Windows（包括 Apple 的 Xbox 360 游戏机中的支持）。\n\
  - SMBFS/CIFS – 服务器消息块文件系统，也称为通用 Internet 文件系统，是为了提供对文件和设备的共享访问以及网络通信而开发的。在 Active\
  \ Directory 出现之前，该 FMS 主要用于运行 Windows 的计算机。然而，对更新版 SMB 版本的支持一直延续到所有当前的 Microsoft\
  \ 操作系统版本，并且还进入了多个非 Microsoft 操作系统。\n\nApple macOS 操作系统通过名为 FileVault 的服务提供基于磁盘级别的数据加密；FileVault2\
  \ macOS 用户还可以使用内置磁盘工具来加密其磁盘并存储其主目录的子集。\n\n## iOS\n\niOS 是 Apple 专有的移动操作系统，旨在支持 Apple\
  \ 的 iPhone 和 iPad 产品线。虽然 iOS 与 macOS 共享许多结构，但它与 macOS 应用程序不兼容。\n\niOS 被设计用于支持 Acorn\
  \ RISC Machines (ARM) Ltd 公司的精简指令集计算（RISC）处理器类型。这些设备比其 x86 复杂指令集计算（CISC）竞争对手消耗的能量显著更少，产生的热量也少得多。这使得\
  \ RISC 处理器自然适用于小型电池供电设备，如手机、平板电脑和 pad。从 ARMv6 版本开始，该架构支持了 Execute Never（XN）页面保护功能。\n\
  \niOS 系统包含集成的设备级文件加密，以在运行设备丢失或被盗时保护数据。它还提供了防止未经授权的用户使用或修改数据的保护。除了其硬件加密功能外，iOS 还提供了一种称为\
  \ Data Protection 的基于类别的工具。使用此保护工具，每次数据写入设备的闪存结构时都会创建基于文件的加密密钥。\n\n## Android OS\n\
  \nAndroid 操作系统是为主要使用触摸屏手势进行操作和控制的平板电脑和智能手机设备而开发的。由于其在众多智能手机和平板设备中的使用，它目前是最流行的移动操作系统，如图\
  \ 8.6 中的图表所示。\n\n- ► JFFS2 – Android 默认日志闪存文件系统（版本 2）。此 FS 版本取代了 YAFFS2（Yet Another\
  \ Flash File System）作为早期内核版本中使用的 Android 默认闪存文件系统。\n- ► Ext2/Ext3/Ext4 – Linux 扩展文件系统的版本，取代了\
  \ F2FS 和 JFFS2 作为 Android 内部闪存设备的文件系统。\n\n除了这些闪存文件系统之外，Android 设备通常还支持 Microsoft\
  \ 文件分配表（FAT）文件系统（FAT12、FAT16 和 FAT32）及其 VFAT 扩展。\n\nAndroid 操作系统提供基于名为 dm-crypt\
  \ 的实用程序的磁盘加密，用于将数据存储在设备的闪存设备上。该实用程序是 Android Linux 内核的一个组成部分。\n\n## 操作系统安全选择\n\n\
  由于其普及性，Microsoft Windows 是恶作剧和恶意软件及灰色软件（令人讨厌的不需要的软件）作者的最大目标。因此，Windows 承受了所有与病毒和间谍软件相关的攻击中无与伦比的比例。\n\
  \n这一事实导致一些 Windows 客户采用了其他操作系统平台，如 Linux 或 macOS，这些平台成为恶意软件目标的可能性要小得多。表 8.1 总结了与各种操作系统相关的一些常见安全功能。\n\
  \n表 8.1 操作系统安全比较\n\n| 名称 | 资源访问控制 | 子系统隔离机制 | 集成防火墙 | 加密文件系统 | 禁止执行（NX） |\n| Linux\
  \ | POSIX、ACL、MAC | chroot、基于能力的安全、seccomp、SELinux、AppArmor | Netfilter，因发行版而异 |\
  \ 是 | 硬件/模拟 |\n| macOS | POSIX、ACL | chroot、使用 chflags 设置的 BSD 文件标志 | PF | 是 | 硬件/模拟\
  \ |\n\n\n\n\n\n| 名称 | 资源访问控制 | 子系统隔离机制 | 集成防火墙 | 加密文件系统 | 不可执行 (NX) |\n|---|---|---|---|---|---|\n\
  | Windows Server | ACLs, privileges, RBAC | Win32 WindowStation, desktop, job objects\
  \ | Windows Firewall | Yes | Hardware/ Emulation |\n| Windows | ACLs, privileges,\
  \ RBAC | Win32 WindowStation, desktop, job objects | Windows Firewall | Yes | Hardware/\
  \ Emulation |\n\n## 常见操作系统安全工具\n\n系统启动后，可以采取措施防止未经授权的人员访问操作系统及其应用程序。这些措施包括：\n\n\
  - 实施本地登录要求\n  - 建立用户和组账户\n  - 设置密码策略\n  - 建立锁定策略\n- 实施额外的身份验证选项\n  - 使用生物识别身份验证设备\n\
  \  - 使用物理身份验证设备\n- 使用本地管理工具\n  - 启用系统审计和事件日志记录\n  - 实施数据加密工具\n  - 监督应用程序软件安全\n-\
  \ 提供远程访问保护\n  - 建立防火墙设置\n  - 配置浏览器安全选项\n- 建立并实施恶意软件保护\n- 应用安全更新和补丁\n\n图 8.7 显示了\
  \ Microsoft Windows 控制面板中可用的本地安全策略/安全设置选项。第一组选项包括密码和账户锁定策略选择，用于本地控制对系统的访问。您还可以为系统审计、用户权限和安全策略实施本地管理员策略。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_191_0.png)\n\n**图 8.7** 本地安全策略/安全设置\n\
  \nWindows 防火墙和高级安全工具使本地管理员（或所有者）能够建立和配置本地防火墙，如前所述。图 8.7 中显示的其余工具是安全工具，可用于建立本地策略，以控制本地计算机与外部网络的交互。在以下各节中，您将学习如何为最佳本地主机安全实践实施它们。\n\
  \n## 关于安全工具的一点说明\n\n> 从图 8.7 中工具的快速浏览可以看出，这些策略旨在控制本地计算机与外部网络的交互。虽然这些工具是本地的，但它们也在网络环境中使用。在某些情况下，本地和网络管理策略都涵盖相同的<|message|>\
  \ 元素。在这些情况下，如果它们配置冲突，网络策略将覆盖本地策略。\n\n## 实施本地登录要求\n\n与个人计算设备一起使用的主要用户身份验证工具是用户名和密码登录。一般来说，有三种类型的用户相关登录需要处理：\n\
  \n- 登录到本地机器\n- 登录到特定的软件应用程序\n- 网络登录\n\n在本地计算机级别，通常需要本地登录。此级别的登录验证用户使用本地计算机资源（文件和设备）的资格。然而，在共享计算机环境中，多个用户可能被允许使用同一台计算机，本地用户和组凭据是通过存储在本地计算机上的用户账户数据库创建和配置的。\n\
  \n## 关于本地登录的一点说明\n\n在网络环境中，网络登录通常取代并替代本地登录选项。此登录级别确认用户访问远程资源的凭据。\n\n这些凭据用于获得对计算机的初始访问权限，控制对其本地资源的访问，并控制对网络资源的访问。在\
  \ Windows 环境中，这些账户是通过计算机管理下的本地用户和组实用程序创建和管理的，如图 8.8 所示。\n\n独立系统首次启动时，管理员账户会自动在操作系统的本地账户数据库中创建。管理员拥有对系统所有硬件和软件资源的权利和权限。管理员随后创建其他用户，然后根据需要授予他们权利和对系统资源的权限。\n\
  \n管理员可以单独处理用户，也可以将用户聚集到可以统一管理的组中。这样，管理员可以对个人或整个组分配权限或限制。使用组的价值在于，通过能够将通用权利应用于多个用户而不是逐个应用，可以节省时间。\n\
  \n密码的宽度与可以包含的不同字符类型的数量有关，包括不属于字母表的字符。数字、特殊字符以及大写和小写字母的组合使密码更强，尤其是在操作系统将大写和小写字母视为完全不同字符时。\n\
  \n密码可以包含控制字符、替代字符，甚至在某些操作系统中包含空格。理想情况下，在要求用户创建强密码时，应从以下所有字符集中提取。\n\n- 大写字母，如 A、B、C\n\
  - 小写字母，如 a、b、c\n- 数字，如 1、2、3\n- 特殊字符，如 $、?、&\n- 替代字符，如 @、%\n\n密码的深度涉及猜测其含义的难度。虽然好的密码应该易于记忆，但它仍然应该难以猜测。多年来，总体前两名的密码一直是“123456”和“password”。攻击者也知道创建密码时使用的常见术语和技术，例如附加和替换。\n\
  \n*附加* 是将一组字符添加到另一组字符末尾的行为（example123）。*替换* 是使用一组字符替换另一组可预测字符（ex@mple）。密码的含义不应该是可以通过简单推理轻易猜出或推断出来的。似乎效果很好的一种方法是考虑短语而不是简单单词。\n\
  \n助记短语经常被纳入其中，允许创建难以猜测但又无需写下来即可记住的密码。助记短语可以拼写为语音，例如使用“UraTygr!”代替“You’re a tiger!”。或者，可以将难忘短语中每个单词的首字母纳入其中，例如“I\
  \ mybtf”，它缩写自“I have not yet begun to fight!”\n\n另一种有效的方法是选择一个有意义且易于回忆的短语。然后，可以将短语中某些单词的缩写转换为替代字符。例如，数字“4”可以在使用字母“f”的地方进行替换。\n\
  \n## 额外的密码安全\n\n随着诈骗者继续窃取密码变得越来越容易，对额外密码安全的需求变得更加被认可。密码最终就像简单地索取它们一样容易被收集。人员绝不应该与任何人谈论密码，无论这些对话看起来多么无害或合法。\n\
  \n虽然标准密码保护实践可能足以抵御一些潜在入侵者，但某些情况需要更复杂的方法。在这些情况下，可以通过使用加密技术和一次性密码（OTP）提供额外保护。\n\n\
  *密码加密* 是将标准密码取出来并对其应用算法的过程，使其对嗅探器、破解者或其他窃听者来说毫无意义。双因素身份验证，如一次性密码，仅对一次交易有效，但增加了另一层宝贵的安全性。\n\
  \n最佳密码实践包括以下内容：\n\n- 在整个组织中使用一致的命名约定，以便用户能够理解自己的密码，而不会诉诸记录它们以便他人找到。\n- 始终为账户提供密码，并在首次登录时要求用户更改它。\n\
  - 保护密码（不要在公开空间写下来）。\n- 不要使用默认密码。\n- 教育用户创建强密码。\n- 在组织的各个层级强制执行密码策略。\n\n## 保护密码\n\
  \n真正的密码安全涉及用户保护其密码不被他人获取。\n\n## 账户锁定策略\n\n操作系统提供密码锁定策略设置，使管理员能够实施防止攻击者反复尝试的密码策略\n\
  \n\n\nto access the system. This prevents the attackers from using brute force attacks\
  \ to guess the account password so they can break into the system.\n\n*Brute force\
  \ attacks* involve the repeated use of login attempts to try to guess the password.\
  \ As shown in Figure 8.9, typical lockout policy settings include:\n\n- **Account\
  \ Lockout Duration** – How long (in minutes) the account will be locked out before\
  \ it automatically unlocks. Setting this value to 0 will prevent the account from\
  \ unlocking until the administrator manually resets it.\n- **Account Lockout Threshold/Max\
  \ Failures** – How many times account access can be attempted before the account\
  \ is locked out. The default value for this setting is 0, which disables the account\
  \ lockout function.\n- **Reset Account Lockout Counter After/Lockout Duration**\
  \ – The amount of time that can pass before the account lockout value is returned\
  \ to 0.\n\n![](img/2459befd842d6fed299fabe6da3512d0_196_0.png)\n\n**FIGURE 8.9**\
  \ Windows Lockout Options\n\n## Computer Locking\n\nUsers should never leave their\
  \ computer unattended after they have logged on. Doing so opens the door for others\
  \ to access and manipulate their computer, data, and network. All users should be\
  \ trained to either log off or lock their computers when they are away from them,\
  \ even if only for a few minutes.\n\nLocking the computer protects it from intruders\
  \ and preserves the current system state. When the computer is unlocked, the applications\
  \ and data that were active in the system are still open, making it much easier\
  \ for the user to pick up where they left off.\n\nUsers should also be instructed\
  \ to make sure they log off at the end of the day. This closes all applications\
  \ and ensures that data files are saved.\n\n## Implementing Additional Authentication\
  \ Options\n\nRecall from Chapter 2 that authentication is defined as the process\
  \ of determining that someone is who they say they are. At the local computing or\
  \ control device level, authentication can be implemented in terms of physical or\
  \ biometric authentication systems to replace or augment password authentication\
  \ methods.\n\n## Physical Authentication Devices\n\nThere are hardware devices that\
  \ can be used to make personal computer systems unusable by people other than authorized\
  \ users. These devices include items such as smart cards and biometric devices similar\
  \ to the ones described in the preceding chapter. However, unlike the devices designed\
  \ to protect access to physical infrastructure, these devices are designed specifically\
  \ to be used with personal computing systems.\n\n### USING SMARTCARDS\n\nSome organizations\
  \ issue their employees smart cards that they can use to get into their buildings,\
  \ log on to their PCs, and access appropriate applications with a single security\
  \ device.\n\nThe card system combines the users’ secret PINs (i.e., something the\
  \ users alone know) with tokens generated by the network’s Certificate Authority\
  \ authentication system to generate a unique pass code. The pass code validates\
  \ the user and their access to different resources.\n\n## Biometric Scanners for\
  \ Personal Computing Devices\n\nAs discussed in Chapter 2, biometric scanners are\
  \ becoming significantly more sophisticated, including facial scanning devices,\
  \ searchable databases, and supporting application programs.\n\nIn addition to serving\
  \ as authentication devices for facility access, many biometric scanning devices\
  \ have evolved for use with personal computers. However, the biometric authentication\
  \ device most widely used with personal computers is the fingerprint scanner. Figure\
  \ 8.10 shows different fingerprint scanner devices designed for use with PCs.\n\n\
  ![](img/2459befd842d6fed299fabe6da3512d0_198_0.png)\n\n**FIGURE 8.10** Fingerprint\
  \ Scanners\n\nSome fingerprint scanner manufacturers offer miniature touchpad versions\
  \ that sit on the desk and connect to the system through a cable and USB connector.\
  \ Other fingerprint scanners are built into key fobs that simply plug directly into\
  \ the USB port. Some manufacturers even build these devices into the top of the\
  \ mouse.\n\nSome models actually store the scanned images and account access information\
  \ on the device. This allows the identification file to travel with the user if\
  \ they work with different computers at different locations.\n\nAfter the fingerprint\
  \ scanner software has been installed and configured, the password manager will\
  \ prompt you to scan in your fingerprint rather than type a password on future log-in\
  \ attempts.\n\n## Using Local Administrative Tools\n\nAll of the different operating\
  \ systems discussed previously offer management tools to control who, when, and\
  \ how the local computer is used. Collectively, these tools are referred to as *administrative\
  \ tools* (in Microsoft Windows OS versions, the Control Panel applet where these\
  \ tools are configured and launched is titled “Administrative Tools”).\n\nThese\
  \ tools typically include programs designed to control the usage of the computer’s\
  \ memory, administer and optimize hard-disk-drive usage, configure OS services running\
  \ on the computer, control the hardware/OS handoff during startup, and troubleshoot\
  \ operating system problems. However, in each case there is a subset of these management\
  \ tools dedicated to security-related functions. In the following sections, we will\
  \ investigate common security-related OS tools and their implementations.\n\n##\
  \ Event Logging and Auditing\n\n*Auditing* is a security function of the operating\
  \ system that enables the user and operating system activities performed on a computer\
  \ to be monitored and tracked. This information can then be used to detect intruders\
  \ and other undesirable activities.\n\nThese entries provide a fundamental tool\
  \ for unauthorized-intrusion-detection efforts. There are two common types of audit\
  \ records to consider:\n\n- ► Native audit records – Event records generated by\
  \ most modern multiuser operating systems. Because these records are already being\
  \ generated by the operating system, they are always available, but they may not\
  \ contain the desired events or be in a readily usable form.\n- ► Detection-specific\
  \ audit records – Records generated to provide specific information about desired\
  \ actions or events. These actions or events can be based on operating system activities,\
  \ application events, or security events.\n\nThe auditing systems available with\
  \ most operating systems consists of two major components:\n\n- ► Audit policy (or\
  \ audit rules), which defines the types of events that will be monitored and added\
  \ to the system’s security logs\n- ► Audit entries (or audit records), which consist\
  \ of the individual entries added to the security log when an audited event occurs\n\
  \n## Windows Auditing Tools\n\nIn a Microsoft Windows environment, audit entries\
  \ are maintained in the security log file. Figure 8.11 shows a typical security\
  \ log displayed in the Windows\n\nSelecting a policy to be configured in the right\
  \ pane will produce the Local Security Setting window, depicted in Figure 8.13.\
  \ Place check marks beside the option or options that should be tracked and audited.\
  \ You can check Success, Failure, or both.\n\n![](img/2459befd842d6fed299fabe6da3512d0_201_0.png)\n\
  \nFIGURE 8.13 Establishing a Local Security Policy Setting\n\nIn Windows, auditing\
  \ must be configured both as a general system policy setting and on each object\
  \ (file, folder, and printer) that requires auditing. With this in mind, when you\
  \ are configuring an audit policy, you must consider what effect the policy will\
  \ have on the system and its performance. If you were to set up auditing on every\
  \ file, folder, and printer in a system, the auditing process would place so much\
  \ extra work on the system that the system could literally slow to a halt.\n\n##\
  \ Linux Auditing\n\nLinux systems also feature security auditing capabilities for\
  \ tracking specified security events. Figure 8.14 provides a generic representation\
  \ of a Linux security auditing framework. As with other auditing systems, the Linux\
  \ modules map computer processes to user IDs so that administrators can trace exploits\
  \ to the specific user who owns the process and is performing potentially malicious\
  \ activities in the system.\n\n\n\n\n\n## 图 8.14 Linux 审计\n\n![](img/2459befd842d6fed299fabe6da3512d0_202_0.png)\n\
  \n系统的核心是审计守护进程，它与 Linux 内核的审计模块协同工作，记录相关事件并将它们写入磁盘上的日志文件。审计规则配置在一个文件中，该文件在系统启动时执行。审计控制器实用程序使用这些规则中的参数来确定跟踪哪些系统事件以及如何将它们写入审计日志文件。\n\
  \n当应用程序遇到触发预配置审计事件的情况时，会向内核的审计接口呈现一条消息并传递给审计控制器。在审计控制器的指导下，审计守护进程将事件写入审计事件日志。\n\n\
  Linux 审计系统还包括一个报告生成工具，管理员可以使用它生成自定义安全报告。它还可能包含一个搜索实用程序，用于快速/具体地检查日志条目以查找特定事件。\n\n\
  与 Windows 组策略配置一样，您必须考虑希望 Linux 审计系统对计算机执行的审计级别及其运行后果。\n\n个人计算机系统的磁盘加密可以在软件或硬件级别执行。在软件级别，磁盘加密技术可通过大多数主要磁盘操作系统版本以及第三方供应商获得。\n\
  \n磁盘加密软件运行在操作系统的设备驱动程序和更高级别的应用程序之间。对于大多数情况，计算机程序和指定用户都不知道加密/解密过程正在进行。图 8.16 说明了加密/解密过程的简化版本。\n\
  \n在初始磁盘加密过程中会生成加密密钥并存储在系统上。此密钥以加密格式存储，需要密码或密码短语才能解密。当用户提供密码或密码短语时，系统会将解密密钥应用于数据，将其解锁以供计算机的应用程序使用。当生成新数据时，它在存储到磁盘驱动器之前会被加密。\n\
  \n## 硬件级磁盘加密\n\n许多计算机主板设计都包含一个内置微芯片，称为可信平台模块（TPM），用于存储加密信息，例如加密密钥。存储在 TPM 上的信息比外部软件攻击和物理盗窃更安全。\n\
  \n该技术可保护操作系统和用户数据，确保即使计算机无人看管、丢失或被盗，也不会被篡改。这些操作系统中的加密管理器通过加密整个驱动器来防止访问硬盘驱动器。\n\n\
  如果计算机主板配备了兼容的 TPM 芯片，磁盘操作系统会使用 TPM 来锁定保护硬盘上存储的数据的加密密钥。密钥在 TPM 验证计算机启动期间的状态之前无法访问。\n\
  \n在计算机启动过程中，TPM 将从重要操作系统配置值派生的哈希代码与之前拍摄的系统快照进行比较。如果代码匹配，操作系统将释放解锁加密磁盘驱动器的解密密钥。这样做可验证操作系统的启动过程的完整性，如图\
  \ 8.17 所示。如果 TPM 检测到操作系统安装已被更改，则不会释放密钥。\n\n![](img/2459befd842d6fed299fabe6da3512d0_205_0.png)\n\
  \n**图 8.16** 加密/解密过程\n\n![](img/2459befd842d6fed299fabe6da3512d0_206_0.png)\n\n\
  ## 图 8.17 使用 TPM\n\n理论上，如果计算机被盗，硬盘上的数据应该是安全的，因为操作系统不会允许访问硬盘。与此方法相关的一个问题是，如果主板出现故障并被更换，则需要该启动密钥的备份副本来访问硬盘上的数据。\n\
  \n## 移动 TPM 芯片\n\nTPM 芯片不能从一个主板移动到另一个主板。\n\n必须存在此驱动器才能解锁存储在卷上的数据。在这种情况下，建议您备份启动密钥。最安全的方法是要求每次启动计算机时都使用\
  \ PIN 或密码以及自动 TPM 过程。\n\n## 备份启动密钥\n\n请注意，如果 TPM 出现故障或所有启动密钥副本丢失或损坏，数据的恢复将变得非常困难。个人计算机用户必须确定他们的安全需求是否值得走这“额外的一步”来保护他们的个人电脑。然而，在企业环境中，这一要求通常由系统管理员决定。\n\
  \n## 操作系统 TPM 工具\n\n在选定的 Microsoft Windows 操作系统中，有一个名为 BitLocker 的实用程序可用于启用主板的 TPM\
  \ 模块。它与 Windows 协同工作以加密整个硬盘或硬盘驱动器（包括系统中的所有卷）。\n\nBitLocker 实用程序有四种使用方式：\n- BitLocker\
  \ 与 TPM 芯片协同工作以存储 BitLocker 加密密钥。即使驱动器被移除，也能保护硬盘数据。正如所指出的，与此方法相关的一个问题是，如果系统板出现故障并被更换，则需要该\
  \ BitLocker 加密密钥的备份副本来访问硬盘上的数据。\n- 如果计算机未配备 TPM 芯片，则必须在启动前将存储启动密钥的 USB 闪存驱动器插入系统。\n\
  - 启动密钥也可以用于拥有 TPM 芯片的计算机。与此方法相关的一个问题是用户倾向于将闪存驱动器留在计算机中。\n- 最安全的方法是要求每次启动计算机时都使用\
  \ PIN 以及自动 TPM 过程。\n\nLinux 操作系统也拥有工具来利用兼容主板的 TPM 加密功能。在这些系统中，有必要确认所涉及的 Linux 内核支持主板上的\
  \ TPM 版本。涉及 TPM 配置的三个内核模块是 tpm_bios、tpm 和 tpm_tis。通用的 tpm_bios 和 tpm 模块首先加载，然后使用特定参数加载\
  \ tpm_tis 模块。\n\n有几种 Linux 软件工具可用于管理基于 Linux 的机器上的 TPM。Trousers 是一个开源守护进程，通过单个模块控制与\
  \ TPM 的所有通信。同样，TrustedGrub 模块能够检测并支持 Linux 系统中的 TPM 功能。它是 Grub 启动加载器的可下载扩展，已为此目的进行了修改。\n\
  \n当您初始化 TPM 时，模块会请求所有者密码和存储根密钥（SRK）密码，以便它可以生成加密密钥。所有者密码用于在系统上执行管理任务，而 SRK 则用于将密钥加载到\
  \ TPM 中。这些密钥必须维护，并且永远不能丢失，因为如果没有它们，继续访问系统几乎是不可能的。\n\n## 文件和文件夹级加密\n\n顾名思义，文件和文件夹级加密应用于单个文件和文件夹。文件和文件夹级加密工具使用户能够使用只有指定用户（或授权恢复代理）可以解码的密钥来加密驱动器上存储的文件。这可以防止没有密码或解码工具的人窃取数据。它大大增强了便携式计算机上文件的安全性，使用户能够指定文件和文件夹，以便它们只能使用正确的加密密钥访问。\n\
  \n这种类型的加密通常实现为可为指定文件或文件夹建立的属性设置，并与系统中的授权用户相关联。这些用户可以像打开任何普通文件和文件夹一样打开这些文件和文件夹。但是，如果有人未经授权访问计算机，他们将无法打开加密的文件或文件夹。\n\
  \n## Microsoft 文件加密工具\n\nWindows 通过其加密文件系统（EFS）功能提供有效的本地硬盘安全性，如图 8.18 所示。\n\nEFS\
  \ 功能使用户能够使用只有指定用户（或授权恢复代理）可以解码的密钥来加密驱动器上存储的文件。这可以防止没有密码或解码工具的人窃取数据。\n\n![](img/2459befd842d6fed299fabe6da3512d0_208_0.png)\n\
  \n图 8.18 Windows 驱动器加密选项\n\n\n\n\n\nWindows 用户可以实现 EFS 选项来加密 NTFS 驱动器上的文件和文件夹。为此，他们只需在文件或文件夹的“高级属性”窗口中勾选“加密内容以便保护数据”复选框。用户可以像打开任何普通文件或文件夹一样打开这些文件和文件夹。但是，如果有人未经授权访问计算机，他们将无法打开加密的文件或文件夹。EFS\
  \ 使用简单，因为它实际上是可以为文件或文件夹建立的属性。\n\nEFS 功能通过使用户能够指定文件和文件夹，使其只能使用正确的加密密钥访问，从而进一步增强了便携式计算机上文件的安全性。\n\
  \n> **关于 EFS 的说明**\n> \n> EFS 防止文件被未经授权的用户访问，包括那些试图绕过操作系统并使用第三方实用程序访问的用户。它在保护信息时同时使用对称加密和非对称加密。\n\
  \n## 实践练习\n\n## 目标\n\n- 描述 NTFS 可用的权限。\n- 设置并测试文件和文件夹权限。\n- 验证用户帐户上设置的权限。\n- 设置并测试文件/文件夹级别加密。\n\
  \n## 资源\n\n- PC 兼容的台式机/塔式计算机系统\n- 已安装 Windows 10 专业版\n- 在您的 PC/工作站上设置 TestUser 帐户\n\
  \  - 用户：TestUser1 密码：testuser1\n- 用户：TestUser2 密码：testuser2\n- 两个帐户都应设置为标准用户。\n\
  - 已安装 AxCrypt (https://www.axcrypt.net/download/)\n\n## 讨论\n\n新技术文件系统是 Microsoft\
  \ 专有的、默认的文件管理系统，用于其操作系统。NTFS 带来了增强的安全功能，包括访问控制列表 (ACL) 和加密文件系统 (EFS)。\n\nNTFS 权限可以在关联的访问控制列表中配置为“允许”或“拒绝”选项。这是自主访问控制列表的一个示例，其中被视为文件或文件夹所有者的用户选择\
  \ said 信息的权限。图 8.19 说明了 ACL。\n\n![](img/2459befd842d6fed299fabe6da3512d0_210_0.png)\n\
  \n图 8.19 访问控制列表\n\n在本实验中，您将管理和测试权限，并将使用 AxCrypt 探索文件级别的加密。请记住，这些程序提供了对权限的介绍。本实验将在本地主机计算机上探索权限管理。本实验不涉及共享权限、服务器权限、继承或\
  \ Linux 文件权限管理。您将为一组选定用户管理文件和文件夹权限。最后，您将测试各种权限设置，以更好地了解 ACL 的重要性和强大功能。\n\n## 程序\n\
  \n## 设置和创建文件和文件夹\n\n为了能够测试您将实施的 NTFS 权限，您必须首先成为文件和文件夹的所有者。文件的所有者有权允许或拒绝其他用户访问。\n\
  \n- 1. 打开计算机电源，如有必要选择 Windows 10 专业版登录。\n- 2. 选择 TestUser1 登录，密码为 testuser1。\n-\
  \ 3. 登录后，右键单击 Windows 图标并选择文件资源管理器。\n- 4. 在文件资源管理器窗口左侧，找到并单击 C: 驱动器。\n- 5. 在中间窗格的任意空白处右键单击，然后将光标悬停在“新建”上以展开选项。单击“文件夹”选项。系统会提示您命名文件夹。输入\

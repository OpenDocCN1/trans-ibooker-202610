  \n**RAS（远程访问系统）服务器**允许客户端从远程站点拨号连接到计算机，即使它们未连接到局域网。\n\n5. **在以下哪种类型的网络攻击中，攻击者使用网络分析器监听网络流量，寻找以明文模式在网络上传输的密码和用户名等项目，或寻找信用卡或其他财务信息等敏感信息以便劫持？**\n\
  \n+   A. 数据包嗅探攻击\n+   B. ARP 欺骗攻击\n+   C. MAC 劫持攻击\n+   D. DoS 攻击\n\n**答案：A**\n\n\

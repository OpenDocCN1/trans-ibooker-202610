  +   D. 动态 ARP 检查\n\nAnswer: B, D\n\n受管交换机通常提供 DHCP 嗅探和动态 ARP 检查（DAI）配置选项，这些选项旨在挫败\
  \ MITM 攻击。DHCP 嗅探用于过滤和阻止入站 DHCP 服务器消息并构建 IP 到 MAC 地址数据库。DAI 使用 DHCP 嗅探数据库来检查和验证\

  \n## 创建文件权限\n\n在本节中，您将探索可用于限制特定用户访问您刚刚创建的文件和文件夹的选项。您可以通过 ACL 作为每个单独文件的一部分，防止特定用户或组执行、读取、写入和修改您认为重要的文件。这是通过\
  \ ACL 实现的。\n\n- 1. 验证您是否在之前步骤中创建的 Perm_Test 文件夹内。右键单击 test1 并单击属性。这将启动 test1 属性窗口，如图\

  ## Tampering with a File


  The purpose of the hash is verify file integrity. Now let’s tamper with the file
  in a minimal way so you can later attempt to discern the subtle difference.


  - 1. Leave the Command Prompt window open and return to the Windows Explorer window
  with the md5deep-4.3 folder open.

  - 2. Double-click the HashTest.txt file to open it. Notepad will launch.

  - 3. Delete the exclamation point and insert a period. The contents should now read,

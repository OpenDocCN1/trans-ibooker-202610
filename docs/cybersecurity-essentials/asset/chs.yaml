- "## 隐藏专用网络\n\n*在前面的每一章中，安全规划都被描述为一个三层计划，每一层都包含不同类型和级别的安全设备、技术和策略。Internet 安全也不例外。在这种环境中，内部是本地用户系统或组织的局域网。在本文中，我们将这些结构称为专用网络。*在本章中，你将学习：\n\
  \n- 讨论实施网络地址转换（NAT）和端口地址转换（PAT）以增强网络安全的优缺点。\n- 定义并描述网络分段和安全区域\n- 使用 NAT 在网络中创建安全分段\n\
  - 使用 VLAN 实现安全分区\n\n### 了解专用网络\n\n在使用前三章所述的适当设备、技术和策略保护内部安全之后，有必要保护*内部边界*，即个人或组织的专用网络与\
  \ Internet 之间的连接点。\n\nInternet 是你边界之外的一切。问题是，Internet 不受单一组织管理，也没有一个组织可以为我们保护它。相反，使用\
  \ Internet 意味着你的数据正在穿越由许多组织管理（并可能保护）的网络设备。\n\n如前所述，Internet 上有我们希望通过更高效地使用 Internet\
  \ 来与之互动的客户、员工和企业。然而，也有各种各样我们不想与之互动的坏人。\n\n\n\n\n\n要处理的第一个安全层是内部网络。除了实施前面章节中描述的设备、技术和实践外，许多网络安全设计者还会采取措施，将专用网络隐藏或伪装起来，使其不被互联网发现。以下各节将介绍为此目的常用的不同技术和设备。\n\
  \n## 网络地址转换\n\n*路由*简单来说就是将某个网络中使用的 IP 地址转换为另一个网络中的 IP 地址。网络地址转换（NAT）类似于简单路由，但适用于一个网络使用专用寻址的情况，如图\
  \ 20.1 所示。通常，NAT 用于将公共 IP 地址（例如来自互联网的地址）映射到网络内部的某个地址。\n\n![](img/2459befd842d6fed299fabe6da3512d0_502_0.png)\n\
  \n图 20.1 NAT 配置\n\n在进行此转换时，执行转换的网络设备（通常是路由器或防火墙）还可以对请求进行身份验证或阻止它。这种映射可以由指定具体转换的\
  \ NAT 表引导，也可以通过使用从可用地址池中分配转换后 IP 地址的动态方案来引导。\n\nNAT 可以结合基于策略的路由（PBR）来执行，其中映射决策由任意数量的规则决定，这些规则可以基于多种不同的标准。如果需要从外部访问网络，这些规则对安全性至关重要。\n\
  \n动态主机配置协议（DHCP）通常用于定义一段 IP 范围，这些 IP 可以按预配置的时长动态租用给请求系统。处理这种分配的设备称为 DHCP 服务器，它会跟踪所有地址分配，以避免重复分配同一个\
  \ IP。DHCP 服务器还支持静态分配，即可以为特定 MAC 地址预留一个 IP 地址。\n\n## 端口地址转换\n\nNAT 的一种扩展称为端口地址转换（PAT），它支持将多个或私有\
  \ IP 映射到单个或公共 IP 地址的概念，如图 20.2 所述。路由器分配一个附加到 IP 地址的端口号，有效地使每个地址成为唯一地址，即使它们共享同一个\
  \ IP 地址。\n\n![](img/2459befd842d6fed299fabe6da3512d0_503_0.png)\n\n图 20.2 PAT 配置\n\
  \n由于 IPv4 IP 地址非常紧缺，这个概念目前几乎无处不在。虽然节省 IP 地址无疑是 NAT 和 PAT 的主要原因，但这些概念还可以通过允许网络只暴露绝对必要的部分来帮助提高网络安全。大多数人认为\
  \ NAT 和 PAT 是一回事。尽管这两种技术之间有区别，但以下讨论也将其视为相同。\n\n一旦连接通过身份验证并完成所有转换，就可以检查每个数据包以确保会话有效。如果内部客户端向外部设备请求某些内容，我们必须知道该数据包是否应被允许通过。传统静态数据包过滤仅查看数据包头，但这种技术很容易被攻击者利用，攻击者会在包头中标明该数据包是一个应答，从而获准进入。\n\
  \n现代防火墙设备使用状态数据包检测或动态数据包过滤来进一步分析数据包——查看 IP 地址、端口号等。它们跟踪这些信息，以便控制自己的端口，仅在内部请求需要时才允许打开。这种做法用于阻止一种称为端口扫描的常见黑客技术。当黑客知道哪些端口在使用时，他们可以将攻击集中在通常与这些端口相关联的服务上。\n\
  \n大多数家庭网络仅将 NAT 作为其唯一的安全机制。虽然 NAT 可能不是真正的安全设备，但它确实基本上关闭了从外部对内部网络的访问，除非管理员有意打开外部访问，而且即便如此，也只为少量端口打开访问。有些人可能会争辩说，对于小型办公室/家庭办公室（SOHO）网络来说，这确实足够了——对某些人来说也许如此。但随着黑客工具日益自动化，SOHO\
  \ 网络成为任意攻击目标的可能性越来越大。\n\n虽然 NAT 相对简单，至少为家庭用户提供了一定的安全性和控制力，但网络专业人员绝不会仅仅依靠 NAT 作为唯一的防御手段。如果黑客以某个网络为目标，那么\
  \ NAT 只不过是一种混淆机制。传统的防火墙路由将更容易排除故障，并提供更好的安全级别。一旦世界全面过渡到 IPv6，我们对 NAT 的讨论可能会少得多；但在那之前，NAT\
  \ 在网络中仍将占有一席之地，用于分隔公共和私有 IP 空间。\n\n许多加密方法不会在加密中包含端口信息。因此，人们创建了一种称为网络地址转换遍历（NAT-T）的方法，以解决使用\
  \ NAT 或 PAT 的设备上遇到的转换问题。\n\n## 端口转发或映射\n\nNAT/PAT 最强的特性是，默认情况下，没有任何内容会通过设备进行转换或转发。要让数据包通过设备，必须在该设备上明确创建一条规则，将所需协议端口转发（或映射）到局域网中的私有\
  \ IP 地址和端口，如图 20.3 所示。此转换过程是透明的，因为外部客户端并不知道这种转发。\n\n![](img/2459befd842d6fed299fabe6da3512d0_504_0.png)\n\
  \n图 20.3 端口转发\n\n例如，可以创建一种不常见的端口映射，要求 Web 客户端使用端口 4444 而不是通常的端口 80 进行连接。然后，该端口可以被映射到私有网络中某个私有\
  \ IP 上的端口 80。这听起来可能像是一种巧妙的混淆手段，网络管理员也经常这样做。然而，这样的方案实际上并不能提供多少安全性。黑客可以轻松地对网络进行端口扫描，从而知道哪些端口是开放的。\n\
  \n许多应用程序可以配置为使用任意端口，从而允许多个不同的应用程序位于单个公共 IP 地址之后。其中许多应用程序可能提供 Web 界面，但其他应用程序则需要特定的客户端软件才能访问。无论哪种方式，都必须配置客户端或浏览器软件，使其访问公共\
  \ IP 地址并提供正在映射的外部端口。\n\n> **通过隐藏实现安全**\n> \n> 大多数端口扫描都是常规扫描，会检查每一个可能的端口——总共 65,535\
  \ 个——但黑客可能会在频闪扫描中寻找特定的开放端口。因此，通过将不常见的端口映射到这些服务，你或许可以让这些攻击者知难而退，但客户端随后需要在其请求中附加一个非标准端口。通过隐藏来实现安全并不能提供一个成功的安全方案。\n\
  \n端口可能位于单独的字段中，也可能附加到 IP 地址后面，并以冒号（:）分隔。因此，对于 Web 浏览器，可能类似于：\n\n```\nhttp://203.0.113.86:4444\n\
  ```\n\n这可能会映射到专用网络上的 192.168.0.4:8888，这意味着在使用 192.168.0.4 的设备上，所访问的应用程序设置在端口 8888\
  \ 上。\n\n> **关于端口转发的提示**\n> \n> 前面讨论了一些标准端口号，每个黑客都非常了解这些常见端口。只要能够轻松地映射非标准端口，就应该这样做，而不是使用常见端口。然而，技术水平高的黑客仍然会找到这些开放端口，因此不能将端口转发单独视为一种安全技术。\n\
  \n通过安全外壳（SSH）进行端口转发被称为*SSH 隧道*。SSH 隧道在远程主机与本地设备或计算机之间建立连接，通过该连接可以中继服务。这是对通常不加密的协议进行加密的一种很好的方式。SSH\
  \ 隧道可能相当复杂，并且可能成为绕过常规过滤或阻止的一种方式。\n\n## 网络分段\n\n网络分段，也称为*分区*，是一个出于多种原因而有用的概念。它本质上是将网络划分为多个子网，每个子网成为一个网段，如图\
  \ 20.4 所示。\n\n![](img/2459befd842d6fed299fabe6da3512d0_506_0.png)\n\n图 20.4 一个分段网络\n\
  \n通常在跨不同地理区域连接网络、互连不同网络拓扑（如以太网和 FDDI），或扩展已达到节点数量或电缆长度限制的网络时，会考虑对网络进行分段。\n\n虽然便利性和组织简单性可以使分段成为一个合理的解决方案，但安全考虑应推动有关网络分段的决策。从安全角度来看，部署网络分段的主要原因是限制入侵者的访问能力。每个网段还将受益于拥塞和广播流量的减少，此外还能将网络问题限制在单个网段内。\n\
  \n这些安全考虑也可能受到外部实体要求的推动。例如，信用卡供应商要求任何接受信用卡的企业遵守支付卡行业数据安全\n\n\n\n标准（PCI-DSS）。该标准要求使用防火墙和其他安全概念，例如网络分段，以确保所有存储的信用卡信息在物理和电子上都得到安全存储。即使是那些不存储信用卡数据但使用销售点设备接受信用卡的企业，也会受到此要求的影响。\n\
  \n要实现 PCI-DSS 合规性，所有销售点（POS）终端和所有存储的持卡人数据必须位于一个完全与任何第三方可能访问的网络区域隔离的网络上。某些用户可能需要访问部分网络，但\
  \ certainly 不需要访问每个段。\n\n在医疗领域，分段至关重要，网络管理员必须处理《健康保险流通与责任法案》（HIPAA）合规性，以确保患者医疗信息的保密性。\n\
  \n对网络段的访问通常通过访问控制列表提供，只有符合某些条件或通过身份验证的用户才允许访问。这被称为白名单。相反，当仅拒绝符合给定条件的用户访问时，这被称为黑名单。后一种方案安全性远不及前者，你应始终尝试对\
  \ ACL 进行白名单设置，而不是黑名单。\n\n分段也可以用于限制内部用户在区域之间的访问。销售人员可能不需要访问会计部门使用的服务器。然而，会计人员可能需要访问销售服务器上的销售数据。这些区域需要相互连接，但可以通过实施分段来控制区域之间的访问。\n\
  \n在允许外部用户进入网络时，始终使用“最小权限”和“需知”原则来建立访问级别。给予每个用户尽可能少的访问权限，并且仅限于他们必须访问的网络区域。\n\n网络分段看起来像是“设置后就不用管”的举措之一，但实际上需要持续的管理和执行。在大型企业中，由于涉及众多不同的策略和规则，分段可能是一项重大挑战。\n\
  \n本章中我们不会深入探讨管理段和处理内部应用需求的细微差别。\n\n正如你将看到的，分段是许多不同网络环境中整体互联网安全方案的关键组成部分。如果没有其他原因，分段被广泛采用，是因为它能够最大限度地减少入侵者在通过互联网进入网络后可能获得的渗透深度。\n\
  \n## 软件定义网络\n\n网络虚拟化改变了我们看待网络分段的方式。一种相对较新的软件定义网络（SDN）概念正在出现，它本质上分析任意两个节点之间的连接，并可以根据定义的策略过滤该连接。这种微分段将在普及后使安全性更加强大，但肯定会使某些管理方面变得更加复杂。\n\
  \n## 网络虚拟化\n\n计算机平台已经发展到足以让我们使用软件模拟服务器、路由器以及几乎任何其他网络资源等硬件平台。通过软件，一台硬件可以支持多个虚拟实例，如图\
  \ 20.5 所示。每个实例都能够像原始主机硬件一样运行。虚拟实例可以根据需要启用，以处理需求和可扩展性，或提供极大的可移植性。\n\n![](img/2459befd842d6fed299fabe6da3512d0_508_0.png)\n\
  \n图 20.5 虚拟实例\n\n网络虚拟化也是通过创建覆盖网络来分段网络的一种方式（本质上是在另一个物理或底层网络之上构建的网络）。在这些覆盖网络中可以使用白盒交换机（通用路由和交换硬件）。\n\
  \n网络虚拟化可以提供一个完全独立于其他网络资源的虚拟网络，创建一个区域，就像使用传统网络硬件一样。网络虚拟化也可以用于实现软件驱动的虚拟网络存储单元。这在存储区域网络（SAN）部署中可见。\n\
  \n## VLAN\n\nVLAN，即虚拟局域网，仅仅是一个软件配置的网络，其中主机表现得好像它们都连接到同一个物理网络，即使它们并非如此。这允许多个网络或广播域在虚拟上作为单个\
  \ LAN 和广播域工作，如图 20.6 所示。这降低了延迟，并且通常使网络分段更容易理解和维护。然而，你现在必须处理额外的安全问题，例如病毒和恶意软件在新的逻辑网络中传播，而不是在单个物理网络内。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_509_0.png)\n\n图 20.6 一个 VLAN\n\nVLAN\
  \ 通常在路由器或交换机上设置；但要将流量从一个 VLAN 传递到另一个 VLAN，你必须拥有支持 VLAN 或 VLAN 标记的硬件。VLAN 可以基于端口或标记/未标记。Ethernet\
  \ 帧头包含 VLAN ID，其中一部分是标签协议标识符（TPID）。\n\n如果数据包包含 VLAN 信息，则被视为标记数据包，如果不包含则为未标记数据包。基于端口的\
  \ VLAN 可能仅仅是 Ethernet 交换机上的端口组形成一个段，或跨多个交换机。\n\n受管理的第 2 层交换机可以配置为转发或阻止到或来自特定 VLAN\
  \ 的流量，并且可以向头添加 VLAN 标签或将帧封装在另一种传输帧内，如果你正在与不同的网络技术交换数据。交换机甚至可能支持交换机之间的中继线路，而中继端口将承载该交换机可访问的所有流量。支持\
  \ VLAN 标记的第 3 层交换机（或路由器）也可以支持 VLAN 之间的数据路由和阻止。\n\n## 实践练习\n\n## 目标\n\n- 检查系统是否与\
  \ Hyper V 兼容。\n- 在 Windows 10 Professional 计算机上启用 Hyper V。\n- 安装并探索虚拟交换机 Hyper-V\
  \ Manager。\n- 安装虚拟机。\n\n## 资源\n\n- 客户提供的台式机/笔记本硬件系统\n- 已安装 Windows 10 Professional（家庭版无法运行\
  \ Hyper-V）\n- 下载的 Linux 发行版以安装\n- 具有管理权限的账户\n\n> 注意 对于本实验，我们建议在 https://www.ubuntu.com/download\
  \ 下载 Ubuntu 发行版。\n\n## 讨论\n\n计算机平台已经发展到足以让我们使用软件模拟服务器、路由器以及几乎任何其他网络资源等硬件平台。通过软件，一台硬件可以支持多个虚拟实例。每个实例都能够像原始主机硬件一样运行。虚拟实例可以根据需要启用，以处理需求和可扩展性，或提供极大的可移植性。\n\
  \n网络虚拟化也是通过创建覆盖网络来分段网络的一种方式（本质上是在另一个物理或底层网络之上构建的网络）。在这些覆盖网络中可以使用白盒交换机（通用路由和交换硬件）。\n\
  \n## 程序\n\n在本程序中，你将学习如何在 Windows 10 Professional 计算机上启用虚拟化技术、配置虚拟交换机并安装虚拟机（VM）。\n\
  \n## 检查 Hyper-V 兼容性\n\n检查你的 Windows 10 Professional 计算机是否与 Hyper-V 兼容。\n\n- 1. 打开你的计算机。\n\
  - 2. 使用具有管理权限的账户登录。\n- 3. 在桌面任务栏的内置搜索栏中，输入 cmd 并按 Enter 打开命令提示符窗口。\n- 4. 在命令提示符窗口中，输入\
  \ systeminfo.exe 并按 Enter。\n- 5. 经过几秒钟后，你的系统信息应列在命令提示符窗口中，如图 20.7 所示。\n\n![](img/2459befd842d6fed299fabe6da3512d0_511_0.png)\n\
  \n图 20.7 Systeminfo 命令输出\n\n注意 该系统已安装 Hyper-V，因此在输出字段中没有提供信息。\n\n\n\n\n\n6. 在 Hyper-V\
  \ 要求下，如果结果显示为“是”，则可直接启用 Hyper-V，无需额外步骤。如果结果显示为“否”，则可能需要进入 BIOS 启用硬件功能，或者你的硬件可能与\
  \ Hyper-V 不兼容。\n\n## 在 Windows 10 专业版中启用 Hyper-V\n\n完成兼容性验证并在 BIOS 中进行任何必要的调整后，请按照以下步骤在\
  \ Windows 10 专业版计算机上启用 Hyper-V。\n\n- 1. 如果尚未完成，请启动计算机并使用具有管理员权限的账户登录。\n- 2. 在桌面任务栏的搜索框中，键入“打开或关闭\
  \ Windows 功能”，然后按 Enter 键。\n- 3. 应出现“Windows 功能”窗口，其外观应类似于图 20.8 所示。\n\n![](img/2459befd842d6fed299fabe6da3512d0_512_0.png)\n\
  \n**图 20.8** Windows 功能\n\n- 4. 找到并单击 Hyper-V 旁边的复选框，以告知 Windows 启用此功能，如图 20.9 所示。\n\
  - 5. 单击“确定”。\n\n![](img/2459befd842d6fed299fabe6da3512d0_513_0.png)\n\n### 图 20.9\
  \ 启用 Hyper-V\n\n6. Windows 将处理更改，并显示提示，指示你需要重新启动以完成所请求功能的安装，如图 20.10 所示。单击“立即重新启动”按钮。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_513_1.png)\n\n### 图 20.10 准备重新启动\n\n\
  恭喜你在计算机上启用了虚拟化技术。\n\n## 将 Hyper-V 管理器固定到任务栏\n\n- 1. 如果尚未完成，请使用具有管理员权限的账户登录你的计算机。\n\
  - 2. 在搜索栏中，键入 **Hyper-V 管理器**。\n- 3. 在显示的菜单选项中，右键单击 Hyper-V 管理器，然后选择“固定到任务栏”，如图\
  \ 20.11 所示。\n\n![](img/2459befd842d6fed299fabe6da3512d0_514_0.png)\n\n**图 20.11**\
  \ 将 Hyper-V 固定到任务栏\n\n- 4. 单击现在已固定到任务栏的 Hyper-V 管理器图标以将其打开。\n\n## 安装和配置虚拟交换机\n\n\
  你可以花时间在闲暇时探索 Hyper-V 管理器的许多选项和配置功能。但是，在本练习中，我们将直接进入虚拟交换机的配置，以便用于虚拟机的安装。\n\n- 1.\
  \ 在 Hyper-V 管理器窗口右侧的“操作”窗格中，单击“虚拟交换机管理器”。\n\n应出现一个标题为“虚拟交换机管理器（用于‘你的计算机名’）”的新窗口，如图\
  \ 20.12 所示。\n\n![](img/2459befd842d6fed299fabe6da3512d0_515_0.png)\n\n图 20.12 虚拟交换机管理器\n\
  \n2. 默认情况下会安装一个虚拟交换机，并与你的活动网卡关联。但是，让我们检查一下为虚拟机设置交换机时提供的选项。\n\n3. 如果尚未选中，请在窗口左窗格的“交换机”下单击“新建虚拟网络交换机”。\n\
  \n创建虚拟交换机时，你应看到三个选项：\n\n- 外部：创建一个绑定到物理网络适配器的虚拟交换机，以便虚拟机可以访问物理网络。\n\n- 内部：创建一个仅可由此物理计算机上运行的虚拟机使用，以及用于虚拟机和物理计算机之间的虚拟交换机。这不提供与物理网络连接的连接。\n\
  \n- 专用：创建一个仅可由此物理计算机上运行的虚拟机使用的虚拟交换机。\n\n- 4. 突出显示“外部”，并单击“创建虚拟交换机”按钮。这应带你进入一组新选项。\n\
  \n### 如何配置虚拟交换机。\n\n- 5. 在“名称”字段中，键入 Test Switch。\n- 6. 在“连接类型”下，确保选中“外部”旁边的单选按钮。\n\
  - 7. 如果你的计算机有多个网卡，你可以选择你用来连接互联网的任何网卡，但交换机管理器默认情况下应已选择该网卡。\n\n> 注意 当试图向外部网络隐藏虚拟机时，请根据你的应用程序选择“内部”或“专用”任一合适的选项。\n\
  \n- 8. 确认“允许管理操作系统共享此网络适配器”旁边的复选框已选中。如果未选中，则单击它以在框中打勾。\n- 9. 单击此窗口底部的“应用”按钮。这将出现一个警告，如图\
  \ 20.13 所示。单击“是”按钮。\n\n![](img/2459befd842d6fed299fabe6da3512d0_516_0.png)\n\n图\
  \ 20.13 应用网络更改警告\n\n10. 在“虚拟交换机管理器”窗口底部，单击“确定”按钮。这应带你返回 Hyper-V 管理器窗口。\n\n## 在 Hyper-V\
  \ 中安装 Linux 发行版\n\n- 1. 下载一个 Ubuntu 发行版并将其保存到你能找到的位置。在此示例中，我们使用 Ubuntu 16.04.3。\n\
  - 2. 如果 Hyper-V 未打开，请单击任务栏上的 Hyper-V 管理器图标以将其打开。\n- 3. 在右侧窗格中的“操作”下，找到并单击“新建”。这应显示一个侧边菜单，用于创建新的虚拟机、硬盘或软盘。\n\
  - 4. 单击“虚拟机”以打开“新建虚拟机向导”，如图 20.14 所示。\n\n![](img/2459befd842d6fed299fabe6da3512d0_517_0.png)\n\
  \n**图 20.14** 新建虚拟机向导 – “开始之前”窗口\n\n5. 单击“下一步”。这应带你到“指定名称和位置”窗口，如图 20.15 所示。\n\n\
  ![](img/2459befd842d6fed299fabe6da3512d0_518_0.png)\n\n图 20.15 指定名称和位置\n\n6. 在“名称”字段中输入\
  \ Test Linux，并单击“下一步”。\n\n7. 你应该处于“指定代数”窗口。保持默认的“第 1 代”单选按钮选中，并单击“下一步”。\n\n注意 一旦创建了虚拟机，就无法更改其代数。\n\
  \n8. 应出现“分配内存”窗口。同样，出于本实验的目的，保留默认分配并单击“下一步”。\n\n13. 浏览到下载的 Linux ISO 所在位置，单击该文件以选择它，然后单击“打开”按钮，如图\
  \ 20.17 所示。\n\n![](img/2459befd842d6fed299fabe6da3512d0_520_0.png)\n\n图 20.17 选择\
  \ ISO\n\n14. .iso 文件路径应填充到“映像文件”字段中。单击“下一步”。\n\n15. 这将带你进入一个摘要页面，显示你为安装选择的设置。单击“完成”以完成虚拟机的安装。\n\
  \n16. 你的新 Linux 虚拟机现在应出现在 Hyper-V 管理器中，如图 20.18 所示。\n\n17. 你仍然需要从映像文件将操作系统安装到此虚拟机上，使其可用，但你现在已经在\
  \ Windows 10 计算机上启用并应用了虚拟机。\n\n![](img/2459befd842d6fed299fabe6da3512d0_521_0.png)\n\
  \n### 图 20.18 已在 Hyper-V 中安装虚拟机\n\n如果启动虚拟机，系统将提示你在虚拟机上安装 Linux 发行版。完成后，它应类似于图 20.19。\n\
  \n你也可以使用 Hyper-V 管理器导入和导出现有虚拟机。这对于保存现有虚拟机安装的未损坏备份以及排查企业结构中现有 VM 上的问题非常有用。\n\n![](img/2459befd842d6fed299fabe6da3512d0_522_0.png)\n\
  \n图 20.19 Ubuntu Linux 16.04.3 LTS 作为 VM 运行\n\n## 实验问题\n\n- 1. 使用什么命令提示符实用程序来验证\
  \ Windows 计算机与 Hyper-Visor 的兼容性？\n- 2. 由于 Windows 10 专业版没有 Hyper-Visor 的安装文件，你可以在该操作系统的哪里启用\
  \ Hyper-V？\n- 3. 在 Hyper-V 中创建虚拟交换机时，有哪些可用配置选项？\n- 4. 一旦创建了虚拟机，你能更改其代数吗？\n\n## 实验答案\n\
  \n1. 使用什么命令提示符实用程序来验证 Windows 计算机与 Hyper-Visor 的兼容性？\n\n```\nsysteminfo.exe\n```\n\
  \n2. 由于 Windows 10 专业版没有 Hyper-Visor 的安装文件，你可以在该操作系统的哪里启用 Hyper-V？\n\n打开或关闭 Windows\
  \ 功能。\n\n3. 在 Hyper-V 中创建虚拟交换机时，有哪些可用配置选项？\n\n外部、内部和专用。\n\n4. 一旦创建了虚拟机，你能更改其代数吗？\n\
  \n不能。\n\n\n\n\n"
- "## 保护边界\n\n*你需要保护的第二层*是内部边界，即专用网络与互联网交汇之处。定义边界的，是你拥有控制权与不拥有控制权之间的分界线。边界是你的专用网络与你希望交互的个人和公司产生连接的地方。在本章中，你将学习到：\n\
  \n- 实施防火墙和其他入侵防御设备与结构\n- 描述常见的企业网络结构，包括内联网、外联网、DMZ 和蜜罐\n- 描述防火墙的用途和局限性\n- 描述使用蜜罐作为入侵防御技术\n\
  - 理解 DMZ（非军事区）在网络安全拓扑中的作用\n- 解释非军事区（DMZ）主机的配置与操作，包括该区域内所包含的关键服务\n\n## 理解边界\n\n内部边界是我们想要阻止互联网上的恶意人员访问专用网络的关键点，如图\
  \ 21.1 所示。\n\n普通家庭或小型办公用户。如今，ISP 提供的典型调制解调器也兼具路由器和数据包级防火墙的功能。然而，如果你的调制解调器不具备路由器功能，你将需要运行安全软件，在计算机上创建软件防火墙。Mac\
  \ 和 Windows 系统都内置了基本的防火墙功能，此外也有许多专用的软件防火墙产品，或随杀毒软件捆绑提供的防火墙功能，可帮助这些用户。\n\n每台连接到互联网的独立计算机或局域网，都会通过某种类型的网关设备进行连接，如图\
  \ 21.3 所示。该网关设备通常是路由器，但也可能是带有某种协议转换或转换器功能的交换机，使你的以太网或无线客户端能够访问 ISP 在你所在位置提供的技术。该网关设备也可以是调制解调器、接入点，甚至是\
  \ IP 语音（VoIP）适配器。\n\n![](img/2459befd842d6fed299fabe6da3512d0_526_0.png)\n\n**图\
  \ 21.3** 网关连接选项\n\n如果网关不兼作路由器（或至少是交换机），通常你需要在网关后面运行一台路由器。如果网关不具备路由器功能，它很可能连接到一个提供路由服务的网络，因此接下来我们将假设所有网络都通过路由器或路由设备连接互联网。\n\
  \n你必须准确了解路由器和 ISP 之间的任何网络硬件所执行的功能。安全不仅仅是单个设备的问题；你可能需要处理许多设备来进一步保护环境。例如，许多网络都有连接到路由器上的关键网络组件。这些设备可能充当防火墙，也可能是为用户提供某些特定功能的网络设备。\n\
  \n在许多网络环境中，通常会创建一些面向外部的网络服务，为外部用户提供可访问性。这些服务可能包括用户可以轻松访问的 Web 服务器或邮件服务器，而组织则保持对内容的控制。如图\
  \ 21.4 所示，这种与专用网络隔离、但可从互联网看到的网络被称为*公共网络*。大多数组织通过在专用网络和互联网之间创建一个受管理的、可从外部访问的网络（称为*非军事区*（DMZ））来实现这一点。本章稍后将更详细地讨论\
  \ DMZ。\n\n![](img/2459befd842d6fed299fabe6da3512d0_527_0.png)\n\n为连接到互联网的网络维护安全可能是一项巨大的挑战。这里介绍的大多数概念适用于任何网络环境，但每个网络都可能因自身所承载的服务和应用程序而面临不同的挑战。\n\
  \n接下来，我们将重点放在必须驻留在公共网络上的设备的安全性上，而不是过多关注保护专用网络免受源自互联网的威胁，尽管其中许多概念是相同的。与任何其他类型的安全一样，对互联网安全的重视程度应与可能失去的东西相关。要得出令人满意的解决方案，必须回答的重要问题包括：\n\
  \n- 你正在保护的东西有多重要？\n- 最坏的情况是什么？\n- 如果网络被入侵，你或你的公司会受到多大损害？\n- 你是否拥有必须受保护的私有数据，或者如果数据被外部用户获取，是否存在任何责任问题？\n\
  - 是否有要求你保护数据的法规或法律？\n\n每个人都应参与一定程度的互联网安全，但在回答这些问题后，你应该意识到还需要多少额外的安全措施。\n\n## 防火墙\n\
  \n在连接到互联网的网络中，最常见的第一道防线是*防火墙*。这些设备通常由硬件和软件的某种组合构成，用于保护专用网络免受通过互联网进行的未授权访问。实现方式是限制安全暴露面、执行组织的安全策略，有时还记录或监控互联网活动。\n\
  \n防火墙可以在不同的网络布局中以多种方式实现。防火墙可能是执行特定任务的硬件设备，也可能是路由器或交换机内置的功能，还可能是在一台具有多个以太网接口的计算机上实现。它甚至可以像其他应用程序一样安装在主机上的纯软件防火墙。市面上有许多网络设备在提供其他网络功能的同时，也提供防火墙和安全能力。\n\
  \n在企业或工业网络环境中，管理员控制防火墙的安装和配置。网络防火墙的优势在于，它使管理员能够控制流向其网络上所有设备的信息流，如图 21.5 所示。\n\n\
  ![](img/2459befd842d6fed299fabe6da3512d0_528_0.png)\n\n图 21.5 网络防火墙\n\n防火墙必须充当网关设备，授权并允许访问网络应用程序和协议。它们还可能充当代理服务器，提供网络地址转换，并充当\
  \ DHCP 服务器。防火墙通常还会过滤入站和出站流量。\n\n良好的防火墙会使用定义的规则提供数据包过滤，以拒绝或接受入站和出站数据包。这可能更难配置，但有效的防火墙规则对安全确实至关重要。\n\
  \n可以通过在路由器上配置数据包过滤规则来建立数据包过滤防火墙，这些规则根据客户端的源地址、目标地址或端口号等因素允许或拒绝客户端访问。通常需要考虑两种数据包过滤防火墙：静态数据包过滤和有状态数据包过滤。\n\
  \n静态（或无状态）数据包过滤防火墙不会跟踪两台计算机之间连接的状态。它们实际上与任何 ACL 的运作方式非常相似。这使得这类防火墙比其他防火墙选项相对更快。它们也往往相对便宜且易于维护。相反，静态数据包过滤防火墙提供的安全功能比其他防火墙选项更少。\n\
  \n有状态数据包过滤防火墙会跟踪实体之间的连接状态。这些防火墙收集网络连接信息，并维护用于后续连接的动态状态表。如图 21.6 所示，这使端口能够根据需要打开和关闭。一旦客户端完成通信会话，有状态数据包过滤防火墙就会关闭所使用的特定端口，直到再次请求该端口为止。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_529_0.png)\n\n# 图 21.6 有状态防火墙操作\n\n\n\
  \n\n然而，在最高安全级别下，这种防火墙配置可能会激怒网络用户，因为他们通常希望启用即插即用（UPnP）等零配置协议。与业务的其他方面一样，安全控制的使用由用户和业务的需求所决定。\n\
  \n在配置网络或网络设备之前，你必须评估自身需求，同时考虑可接受使用策略，并在所有这些因素与可用网络资源之间取得平衡。未能考虑所有这些因素的网络管理员很快就会在管理层和员工中失去人心。采用合理且有组织的网络设计和安全方法，对于高效、有效地管理网络至关重要。在正确创建和组织网络之前，必须先回答许多问题：\n\
  \n- **资源：**\n  - 可用的网络资源有哪些？\n  - 有多少用户将共享这些资源？\n  - 如果可用带宽有限，你需要考虑流量管理和服务质量（QoS）功能。\n\
  - 哪些是最关键的网络服务？\n  - 配置 QoS 以优先处理这些服务。\n- 管理层认为哪些使用方式是可接受的？\n\n要过滤用户可访问的所有类型内容可能很困难。当然，你可以阻止访问\
  \ Facebook，但流媒体视频呢？Netflix？体育赛事？你可以花时间确定带宽的使用去向，并添加新的阻止规则，防止用户访问带宽密集型应用程序。另一方面，你也可以简单地设置\
  \ QoS 策略来公平分配带宽，这样在需求高峰期，每个人都能公平地获得其应得的那部分资源。如果这种公平分配仍能支持流媒体播放，那么也许就没问题。\n\n管理层通常希望确保用户除了工作之外什么都做不了。因此，可接受使用策略很简单：网络上只允许与工作相关的活动。你能在多大程度上阻止所有与工作无关的访问，很大程度上取决于可用的网络硬件。硬件采购是根据业务需求（按策略）进行的。\n\
  \n- 需要支持哪些远程访问？\n  - VPN 支持将取决于网络硬件。\n- 你是否需要在防火墙后面运行一台电子邮件服务器，并让未通过 VPN 连接的网络用户也能访问它？\n\
  - 你将如何对网络进行分段以最大程度降低风险？\n\n## 网络设备\n\n路由器与交换机正越来越多地被集成到智能交换机中，甚至与传统操作系统相结合，从而打造出智能网络设备。这些设备中的每一款在多大程度上发挥路由器功能各不相同，但它们通常提供大量路由器功能，并配有可简化网络管理的软件。\n\
  \n一般来说，网络设备提供强大的防火墙功能，但许多设备是专门化的，专注于单一任务，例如电子邮件、垃圾邮件或防病毒和恶意软件检测。这些设备可以提供强大的工具库来抵御攻击，并减轻管理访问和网络安全的工作负担。\n\
  \n安全设备也称为统一威胁管理（UTM）设备，在一个产品中集成了网关、防病毒、防火墙、入侵防御与检测等功能，甚至更多功能，如图 21.7 所示。这不仅在统一平台上提供了众多安全功能，而且解决方案经过简化和优化，最大程度地减少了对广泛培训或安全知识的需求。企业越来越依赖这些设备，并期望其\
  \ IT 人员能够有效地管理它们。\n\n![](img/2459befd842d6fed299fabe6da3512d0_532_0.png)\n\n图 21.7\
  \ UTM 设备\n\n网络设备中可能比较复杂的方面之一就是如何选择设备。业界有许多知名品牌——例如 Cisco、Barracuda 和 Juniper——它们很受中型公司欢迎。然而，许多其他公司——例如\
  \ WatchGuard、Cyberroam 和 Check Point——则为规模较小的组织提供解决方案。\n\n除了购买价格之外，重要的是通过仔细考察所需培训量、对网络所需所有功能的支持，以及远程访问和持续支持与订阅成本来评估潜在的设备。\n\
  \n尽管 UTM 设备似乎是解决互联网安全问题的绝佳方案，但它们也代表了网络上的单点故障，并且自身也可能存在漏洞。该设备还必须能够处理所有网络流量，否则它将成为网络瓶颈。\n\
  \n选择适合你网络需求的设备至关重要，你必须考虑许多因素，以确保产品能够满足你网络的需求，而不是仅仅关注安全功能。\n\n## 代理服务器\n\n代理服务器是一道屏障，可阻止外部人员进入局域网，并阻止内部人员直接连接外部资源，如图\
  \ 21.8 所示。相反，它允许客户端通过经由代理服务器路由的方式建立间接网络连接。客户端连接到代理服务器（无论是否有明确的身份验证），并向另一台服务器请求资源。代理服务器将处理该请求，要么从其自身缓存副本中返回所请求的资源，要么将请求转发给另一台服务器（可能在转发前修改请求）。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_533_0.png)\n\n图 21.8 代理服务器的运作方式\n\n发送到互联网的所有寻址信息都将使用代理服务器的\
  \ IP 地址。由于不使用请求资源的客户端的 IP 地址，外部入侵者无法访问本地主机。\n\n配置完成后，代理服务器将向客户端提供可用的互联网服务（HTTP、FTP\
  \ 等）的地址和端口号。客户端访问是通过本地 Web 浏览器配置的。大多数操作系统和 Web 浏览器都支持代理配置。\n\n这一概念最常见的用途可能就是缓存 Web\
  \ 代理，即本地服务器缓存 Web 资源，然后智能地使其过期。Web 代理有助于节省互联网带宽并加快连接速度，但它们也可用于过滤内容，甚至重新格式化内容。\n\n\
  代理服务器可能是匿名代理，通过隐藏客户端的原始 IP 地址来提供匿名性。\n\n透明代理会提供原始 IP 地址，但仅限于 HTTP 标头中。通常情况下，用户甚至不会意识到自己正在使用透明代理。许多互联网服务提供商（ISP）会对连接进行透明代理处理，以便提供自定义的“404\
  \ 页面”或搜索结果过滤器。\n\n失真代理的工作方式与透明代理非常相似，但它在 HTTP 标头中包含错误的 IP 信息。\n\n通过代理进行的数据通信通常未加密，可能被黑客攻击。因此，使用非本地代理服务时你需要格外小心。\n\
  \n恶意代理服务器已被用于多种目的，包括传播恶意软件、注入广告以及简单的信息收集。虽然这些代理服务器可能不会传递你的 IP 地址，但它们会知道你的 IP 地址，并可能将此信息用于其他目的。\n\
  \n互联网上有大量开放代理，以隐私等名义在你浏览网页时提供隐藏 IP 地址的服务。在考虑使用此类服务之前，请充分研究它们，并且只使用已知且可信的代理服务器。\n\
  \n通常会将一组 Web 服务器放在反向代理服务器后面，由反向代理处理对 Web 资源的公开请求，然后将请求转发给其中一台或多台服务器，如图 21.9 所示。对于请求者而言，这个过程看起来就像是在直接访问这些\
  \ Web 服务器。这种安排有利于负载均衡，可以有效地将单个站点的请求分散到多台服务器上。\n\n\n\n\n\n![](img/2459befd842d6fed299fabe6da3512d0_535_0.png)\n\
  \n**图 21.9** 反向代理操作\n\n反向代理还可以用于提供 SSL 连接，使 Web 服务器集群能够共享单个安全证书。它们还可以用于缓存静态内容、数据压缩、过滤等。它们还为服务器提供额外的安全保护，并可帮助抵御某些类型的攻击。\n\
  \n## 非军事区（DMZ）\n\n除了创建与其他受信任企业的安全链接外，其他组织还希望将其业务直接扩展到客户，以进行企业对客户（B2C）运营。这通常涉及托管网页，通过互联网向公众宣传产品和服务。虽然组织希望这些客户能够访问其网站，但他们不希望客户能够访问其受保护的内部网区域。因此，托管服务的对外\
  \ Web 服务器或计算机不能直接与这些区域相连。\n\n一些组织在其网络中专门划出一部分作为一种称为非军事区的安全结构。DMZ 是一个独立的外围网络，它将安全内部网与外部世界隔离开来，同时允许公众访问对外专用资源。图\
  \ 21.10 显示了典型的 DMZ 部署。\n\n如图所示，专门用于客户流量的选定服务器和其他资源位于 DMZ 中。这些资源被称为 *堡垒主机*。堡垒主机可能是防火墙、路由器、服务器或一组计算机，它们未被另一台防火墙保护在后面，但可以直接访问互联网。\n\
  \nDMZ 中最常见的堡垒主机是提供公共访问服务的服务器，例如：\n\n- Web 服务器\n- 邮件服务器\n- FTP 服务器\n- VoIP 服务器\n\n\
  ![](img/2459befd842d6fed299fabe6da3512d0_536_0.png)\n\n图 21.10 一个 DMZ\n\n## 单防火墙\
  \ DMZ\n\n对 DMZ 的访问由一个或多个防火墙控制。在单防火墙 DMZ 中，如图 21.11 所示，防火墙必须是多宿主设备，能够提供三个独立的网络接口：\n\
  \n- 一个用于互联网的接口（外部、非受控网络）\n- 一个用于内部网的接口（内部、受控网络）\n- 一个用于 DMZ 网络的接口（外部、受控网络）\n\n![](img/2459befd842d6fed299fabe6da3512d0_536_1.png)\n\
  \n图 21.11 一个单防火墙 DMZ\n\n在此配置中，防火墙检查所有传入流量以确定是否应将其路由到 DMZ 或传递到内部网。同样，DMZ 检查来自内部网的所有传出流量以确定是否应：\n\
  \n- 从内部网传递到 DMZ 网络以提供对 Web 和邮件服务的内部请求\n- 从 DMZ 网络传递到内部网作为来自那里的请求的响应\n- 传递到互联网\n\n\
  多宿主单防火墙 DMZ 通常被选为其他安全结构，因为它们实施成本相对较低。然而，在此配置中，防火墙成为整个网络的单点故障。如果防火墙被攻破，攻击者就获得了对整个网络的访问权限。只需要一个配置不当的防火墙留下开放的攻击端口。\n\
  \n## 双防火墙 DMZ\n\n在双防火墙 DMZ 中，如图 21.12 所示，防火墙位于 DMZ 的两侧，用于过滤在内部网和 DMZ 之间以及 DMZ 和互联网之间移动的流量。这些防火墙用于将公共流量路由到\
  \ DMZ，并将内部网络流量路由到内部网。\n\n![](img/2459befd842d6fed299fabe6da3512d0_537_0.png)\n\n\
  图 21.12 一个双防火墙 DMZ\n\n双防火墙 DMZ 配置提供了更高级别的安全性，因为攻击者必须入侵多个设备才能破坏内部网。如果他们成功破坏了第一个防火墙，他们只能获得对\
  \ DMZ 中面向公众的资源的访问权限。\n\n## 蜜罐\n\n*蜜罐* 是另一种外围网络安全结构，用于诱使攻击者远离获取对合法内部网资源的访问权限。蜜罐是一个诱饵服务器、网络设备或网络段，旨在吸引攻击者远离真实网络。这是通过为攻击者提供相对容易访问网络上的诱饵系统并隐藏真正关键系统来实现的。\n\
  \n通常，蜜罐服务器被设计为配置不佳的生产服务器，使其看起来像是容易的高价值目标。这些服务器通常放置在 DMZ 中以将其与其他内部网部分隔开。图 21.13 描述了通用的蜜罐部署。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_538_0.png)\n\n**图 21.13** 蜜罐部署\n\n蜜罐通常包括监控软件，当攻击发生时配置为向网络管理员发出警报。它们还包括某种类型的被动入侵检测系统（IDS）以收集取证信息。此信息通常包括攻击者签名数据、攻击方法和可用于追究非法破解活动法律责任的法律支持信息。\n\
  \n蜜罐可作为培训或研究工具很有价值。然而，鉴于其脆弱的性质，必须时刻警惕监控蜜罐。否则，被入侵的蜜罐可能被转变为黑客平台，从中发起更多攻击，甚至可能是内部攻击。蜜罐被用于攻击您和其他人的网络的风险要求持续监控。\n\
  \n一种称为 *蜜网* 的安全结构扩展了蜜罐的概念，建立了一个小型诱饵生产网络以吸引潜在攻击者。此结构用于一些具有极其关键资源的大型网络中。然而，实施和管理此类安全系统的成本在中型和小型网络中变得难以承受。\n\
  \n## 专用网\n\n虽然内部网旨在为组织内部的授权成员提供安全网络结构，但许多企业在其网络中增加一个或多个企业对企业（B2B）渠道，用于与其他受信任组织进行安全交易。\n\
  \n术语 *专用网* 用于描述一种内部网结构，授予授权外部用户（如企业商业伙伴）有限访问权限。换句话说，一种部分私有、部分公共的网络结构，如图 21.14 所示。建立这种网络结构的主要原因是\
  \ B2B 关系。\n\n在图中给出的示例中，面向客户的 Web 服务器放置在组织的内部网和互联网之间，以服务于受信任的外部用户。服务器必须在用户能够访问服务器内容之前对来自这些用户的请求进行身份验证。防火墙通常放置在\
  \ Web 服务器和内部网之间，以阻止外部用户访问组织的内部网络结构。\n\n专用网创建了一个特殊的区域，将网络扩展到其他受信任组织。此区域还可采用 VPN 或隧道等安全通信技术在两个组织之间进行。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_540_0.png)\n\n图 21.14 一个专用网\n\n## 实践练习\n\

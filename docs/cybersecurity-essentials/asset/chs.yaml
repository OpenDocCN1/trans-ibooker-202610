  - 5. Locate md5deep.exe, sha1deep.exe, and whirlpooldeep.exe, as depicted in Figure
  22.8. These will be the hash algorithms you will test.


  ![](img/2459befd842d6fed299fabe6da3512d0_567_0.png)


  FIGURE 22.8 The Hash Algorithms



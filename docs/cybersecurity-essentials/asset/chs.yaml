  - 4. Click File and select Save to save the file. Exit Notepad by clicking on the
  red X in the top-right corner of the window.

  - 5. Exit the Windows Explorer window by clicking on the red X in the top-right
  corner of the window.


  ## Comparing Hash Values


  You might think with such a subtle change to the contents of the file that a hash
  output might be similar. You will now discover the importance of hash output by
  comparing the before and after of the file hashes.


  - 1. Return to the command prompt. You should be able to view the three previous
  hashes.





  2. 在提示符下，输入 md5deep.exe HashTest.txt。这将为刚刚被篡改的 HashTest 文件创建一个哈希。按 Enter 键。


  你的新哈希和之前的哈希之间有差异吗？


  如图 22.18 所示，将此哈希与第一个哈希进行比较，会得到一组完全不同的字符。这验证了文件的完整性。


  ![](img/2459befd842d6fed299fabe6da3512d0_574_0.png)


  ## 图 22.18 比较 MD5 哈希输出


  3. 输入 sha1deep.exe HashTest.txt 并按 Enter 键。将显示生成的哈希，它应该与之前的哈希不同，如图 22.19 所示。


  当你比较 Sha-1 输出时，有差异吗？


  4. 最后，输入 whirlpooldeep.exe HashTest.txt 并按 Enter 键。如图 22.20 所示，之前的哈希和新哈希之间应该有差异。


  你的哈希之间有差异吗？


  ![](img/2459befd842d6fed299fabe6da3512d0_575_0.png)


  ## 图 22.19 比较 Sha-1 哈希输出


  ![](img/2459befd842d6fed299fabe6da3512d0_575_1.png)


  ## 图 22.20 比较 Whirlpool 哈希输出


  - 5. 输入 exit 并按 Enter 键退出命令提示符。

  - 6. 关闭计算机。


  重要的是要记住，文件哈希只能验证完整性。它不提供机密性、可用性、真实性或不可否认性。因此，它只是安全方案中的一部分。


  ## 实验问题


  - 1. 文件哈希的目的是什么？

  - 2. 哈希提供机密性。对还是错？

  - 3. 如果文件只发生一点变化，哈希是否也只发生一点变化？

  - 4. 在使用的三种哈希算法中，哪一种的摘要最长？


  ## 实验答案


  - 1. 哈希的目的是能够验证文件完整性。

  - 2. 错误。

  - 3. 不是，即使文件中的数据发生很小的变化，哈希也会完全改变。

  - 4. Whirlpool 哈希。

  '
- "## 工具和实用程序\n\n*网络管理员必须*配备各种各样的软件工具来监控、诊断和控制他们周围的网络。在本章中，你将学习这一武器库中的基本工具。某些工具在不同的操作系统中名称略有不同，但本质上完成相同的任务。在本章中，你将学习：\n\
  \n- 将不同的工具和实用程序应用于各种网络安全场景\n- 识别常用的网络监控工具\n- 使用软件数据包嗅探器检查不同类型的网络流量\n\n## 使用基本工具\n\
  \n每个网络安全专家的工具箱中都应备有一些基本的行政管理、故障排除和监控工具及实用程序。以下各节介绍所需基本工具的一些主要版本。有些是已安装操作系统中自带的工具，而另一些则是可供下载或购买的第三方工具。\n\
  \n## Ifconfig/IPconfig\n\n你需要熟悉的第一个工具是 *ifconfig* 或 *ipconfig*，具体取决于你的操作系统。前者用于\
  \ Unix/Linux 系统，而 *ipconfig* 在 Windows 系统上完成相同的功能。该工具在命令行中使用，向你显示本地系统的 IP 地址和其他基本网络配置信息。当你想知道网关的\
  \ IP 地址、系统向何处发送 DNS 查询、系统是通过 DHCP 获得 IP 地址还是静态分配的，以及其他有用信息时，这个工具是你的第一站。\n\n## Whois\n\
  \n通常，你需要了解某个域的一些信息。如图 23.1 所示，你可以访问几乎任何域名注册商的网站，并使用他们的 Whois 搜索工具来查找有关所有权、行政和技术责任以及负责提供主机信息的服务器名称的信息。Whois\
  \ 在某些操作系统中也是一个命令行实用程序。\n\n![](img/2459befd842d6fed299fabe6da3512d0_578_0.png)\n\n\
  图 23.1 Whois 工具\n\n如今许多注册都是私密的，这意味着你无法了解所有权、行政或技术联系人的任何信息；你只能获得有关名称服务器的信息。这些信息受\
  \ ICANN 规则约束，但可能并不总是准确的。尽管如此，这里仍然是了解某个域的好地方。\n\n许多网站提供这项服务，所有类 Unix 操作系统都提供这个命令行工具。然而，并非所有\
  \ Whois 工具都能访问每个顶级域的信息。在某些情况下，你可能需要前往特定的注册商才能完整查询某个顶级域。\n\n## Nslookup\n\nnslookup\
  \ 命令是一个命令行 DNS 查询工具，通常是用来获取网站 DNS 信息的第一个工具。基本的 nslookup 命令返回与指定域名关联的 IP 地址信息。\n\n\
  可以通过添加特定参数来修改基本命令，以获取其他类型的信息，例如名称服务器或邮件交换记录。\n\n虽然 nslookup 是排查 DNS 主机名解析问题的绝佳工具，但它也是网络攻击枚举阶段信息收集过程中最常用的工具之一。\n\
  \n## PING\n\nPING 是一种用于评估能否到达任何其他 IP 主机的软件实用程序。PING 命令将测量从源主机发送到目标主机的数据包的往返时间。PING\
  \ 实用程序会向目标主机发送 Internet 控制消息协议（ICMP）请求数据包，并等待响应，同时测量往返时间和任何数据包丢失情况。\n\nPING 和用于\
  \ IPv6 主机的 ping6 在许多操作系统中都作为命令行工具提供，而且各种软件产品也通常会提供此功能，并常与 traceroute 功能捆绑在一起。\n\n\
  PING 命令是判断主机是否在线以及你的网络与主机之间连接质量的绝佳方法。然而，ICMP 流量通常被视为低优先级流量；因此，繁忙的网络可能会忽略它。此外，由于可以用\
  \ PING 请求淹没网络（称为 ping 洪泛），ICMP 流量经常被阻止。大多数防火墙设备都可以用来完全阻止 ICMP 流量。\n\nPING 实用程序提供的一些选项，例如调整数据包大小或不等待回复就发送，可用于制造\
  \ ping 洪泛，从而导致拒绝服务（DoS）攻击。这样的 ping 洪泛肯定会消耗入站带宽。但是，如果网络回复 ICMP 请求，那么出站带宽也将被消耗。\n\n\
  遗憾的是，恶意发送格式错误的 PING 数据包也是可能的。例如，较旧的系统无法处理大于 65,535 字节的数据包，任何大于该值的数据包都会导致计算机崩溃。现代路由器应该检查这些数据包的大小和分片情况，并执行规则以防止“ping\
  \ of death”造成任何问题。\n\n虽然出于各种原因，在公共网络上允许 ICMP 流量通常是一种好的做法，但关键的是你的防火墙要阻止 ICMP 流量，而且对于大多数网络，你甚至可能希望将防火墙设置为不回复这些请求本身。PING\
  \ 请求应该类似于图 23.2 所示的样子：\n\n```\nping www.google.com\n```\n\n![](img/2459befd842d6fed299fabe6da3512d0_580_0.png)\n\
  \n## 图 23.2 PING\n\n## Traceroute\n\nTRACEROUTE 实用程序将显示数据包从一个 IP 到另一个 IP 所经过的*路由*（路径）。与\
  \ PING 一样，它会测量 ICMP 数据包的往返时间（也称为*延迟*）；不过，使用 traceroute 时，测量的是路由中每个相邻主机之间的时间。\n\n\
  路由的每一段称为一个*跃点*。Traceroute 将发送三个数据包，并测量完成每个跃点所需的时间。每个跃点的累计延迟通常以毫秒为单位记录，同时还会记录每个节点的\
  \ IP 和主机名（通过反向查找获得）。\n\n这是查看主机之间延迟问题并评估连接以确定何处存在过大延迟或路由失败的好方法。\n\nTraceroute 在大多数操作系统命令行界面中都可使用。Windows\
  \ 使用 TRACERT 实用程序。某些实用程序（如 tcptraceroute）可能使用 TCP 数据包。\n\n\n\n\n## 关于 TCP 数据包的一点说明\n\
  \nPathPing 实用程序可在许多 Windows 系统上找到，它结合了 ping 和 traceroute。使用 TCP 数据包在路由中的路由器阻止 ICMP\
  \ 流量时可能很有用。\n\n典型的 traceroute 操作应类似于图 23.3 所示。\n\n![](img/2459befd842d6fed299fabe6da3512d0_581_0.png)\n\
  \n图 23.3 Traceroute 操作\n\n## Telnet\n\nTelnet 是一种应用客户端-服务器协议，可使用 Telnet 客户端软件在计算机（或设备）与通常监听在端口\
  \ 23 上的任何远程 Telnet 服务器之间建立连接。这非常像基于文本的命令行界面，允许远程用户像本地登录服务器一样执行操作，如图 23.4 所示。\n\n\
  ![](img/2459befd842d6fed299fabe6da3512d0_581_1.png)\n\n图 23.4 Telnet 操作\n\n通过自定义客户端软件可获得多种类型的\
  \ Telnet 仿真，但大多数都没有加密可用；因此，不能保证你的通信在传输过程中不会被截获。一些较旧的网络设备可能仅支持 Telnet，但只要有可能，你应改用\
  \ SSH。\n\n## 安全 Shell\n\n安全 Shell（SSH）是一种用于安全客户端-服务器连接的加密网络协议。旨在取代不安全的 shell 协议（如\
  \ Telnet），SSH 采用公钥加密认证。用户可以像使用 Telnet 一样使用密码进行身份验证，或使用密钥对，或两者兼用。负责 SSH 连接的管理员应精通\
  \ SSH 密钥管理。\n\n还可以使用关联的 SSH 文件传输协议（SFTP）或安全复制协议（SCP）进行文件传输。SSH 支持隧道和端口转发，因此在某些网络安全方案中可成为重要工具。SSH\
  \ 包含在所有类 Unix 发行版中，但不包含在 Windows 中，尽管你可以为大多数 Windows 版本获取版本。\n\n即使你不是在管理 SSH 服务器，你也最有可能在某个时候使用\
  \ SSH 客户端。尽管有关于 NSA 破译 SSH 连接的传言以及一些过去的漏洞，但 SSH 被认为是一种安全可靠的协议，几乎消除了网络流量被窃听的可能性。\n\
  \n## 监控工具和软件\n\n要真正保护网络，你必须有某种方式对其进行监控和测试。随着时间的推移，越来越强大的网络监控工具和服务变得可用。这些工具可用于确保服务器（或服务器上的特定服务）正常运行，也可用于简单地监控数据流。\n\
  \n通常，服务器或服务监控产品会向该服务发送请求（例如向 Web 服务器发送 HTTP 请求）并测量响应。如果请求没有回复或回复太慢，则可能会通过电子邮件、短信或其他警报方法向网络管理员发送消息。重要的是至少有一个独立于被监控网络的监控器，以确保在网络中断时仍能生成警报。\n\
  \n其中很大一部分监控只需要筛选日志以查找错误或其他问题，这对网络管理员来说可能是一项令人望而生畏的任务。能够汇总甚至绘制日志数据的软件工具可以成为巨大的生产力辅助。\n\
  \n以下各节讨论了供你考虑的其中一些产品。使用这些和其他网络测试工具将使你更容易审计网络，以便了解其资源、评估其风险、评估其漏洞，并制定减轻这些风险和漏洞的计划。\n\
  \n### Nagios\n\nNagios 可能是最知名的仍有免费版本的网络监控工具；然而，它已经发展并提供了一个功能齐全的商业企业版本。该项目的分支 Icinga\
  \ 是一个有趣的开源替代方案，其功能比 Nagios 的免费版本更全面。两种产品都有大量监控、报告和通知选项，最适合正常运行时间监控，但也可以监控性能。\n\n\
  ### SolarWinds\n\nSolarWinds 提供了一个功能强大的商业网络性能监控产品。虽然该产品价格有点贵，但功能非常强大，可以监控正常运行时间、性能、流量和利用率。它还提供大量报告、图表和通知选项。\n\
  \n### Microsoft Network Monitor\n\nMicrosoft Network Monitor 是一款数据包分析器，可帮助你查看流量并排除网络问题。正如你所期望的，该产品与专有的\
  \ Microsoft 协议交互做得非常好，但大多数常见的公共协议也得到支持。\n\n### Wireshark\n\nWireshark 是一款成熟的开源跨平台网络协议分析器。它可能是最知名的协议分析器，支持几乎所有协议并可在几乎任何平台上运行。有关\
  \ Wireshark 的更多信息，请访问 www.wireshark.org。\n\n如图 23.6 所示的 Wireshark，是捕获并随后分析流量以发现以及排除网络问题的宝贵工具。它可用于了解给定网络上使用的协议。此工具易于使用，但需要经验和练习才能准确分析其产生的结果。然而，每个网络管理员都应该在他们的工具库中拥有此产品。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_585_0.png)\n\n图 23.6 Wireshark\n\n###\
  \ Snort\n\nSnort 是一款开源跨平台入侵检测系统，提供实时流量分析、数据包记录、协议分析以及对蠕虫、端口扫描和漏洞利用尝试的主动检测。这当然有助于实时监控网络。它非常适合识别探测和攻击，但也可以作为网络嗅探器使用。如图\
  \ 23.7 所示的 Snort，是具有公共服务的网络的优秀产品。有关 Snort 的更多信息，请访问 www.snort.org。\n\n也许在列出的所有工具中，Snort\
  \ 有许多互补产品可以与其一起使用以扩展其检测和报告能力。\n\n与任何入侵检测/预防系统一样，Snort 只有在正确“调优”到其所使用的网络时才有效。如果没有在\
  \ IDS/IPS 上进行调优的尽职调查，管理员将同时面临太多误报（错误指控的警报）和太多漏报（错过的真正问题）。\n\n![](img/2459befd842d6fed299fabe6da3512d0_586_0.png)\n\
  \n图 23.7 Snort\n\n### Nmap\n\n如图 23.8 所示的 Nmap，是一款开源跨平台网络映射实用程序，用于发现和安全审计执行网络清单，以及监控和升级调度。这是一款高度灵活的工具，用于检查、分析任何网络中的系统。它特别适用于发现端口和服务版本。有关\
  \ Nmap 的更多信息，请访问 www.nmap.org。\n\n如图 23.8 所示，Nmap 既可使用命令行界面，也可使用 GUI 界面。\n\n###\
  \ Nikto\n\nNikto 是一款开源 Web 服务器扫描程序，可识别 Web 服务器上的问题。有关 Nikto 的更多信息，请访问 cirt.net/nikto2。\n\
  \n### OpenVAS\n\nOpenVAS 是 Linux 和 Windows 的开源漏洞扫描程序，是现在商业化的 Nessus 最后一个免费版本的分支。作为一个完整的漏洞管理解决方案构建，该工具使用\
  \ SCAP 并可执行多种网络漏洞测试（NVT）；它可以查找常见漏洞和暴露（CVE）。该产品学习曲线有点陡峭，但它是一款备受推崇且功能强大的工具，值得考虑。有关\
  \ OpenVAS 的更多信息，请访问 openvas.org。\n\n### Metasploit\n\nMetasploit 是最受欢迎的开源渗透测试框架之一。它适用于\
  \ Windows 和 Linux 环境。它通常用于识别和验证网络漏洞，包括模拟利用人类漏洞的攻击，如图 23.9 所示。Metasploit 还可用于优先处理发现的任何网络漏洞的响应。有关\
  \ Metasploit 的更多信息，请访问 www.metasploit.com。\n\n\n\n\n\n![](img/2459befd842d6fed299fabe6da3512d0_588_0.png)\n\
  \n**图 23.8 Nmap 实用程序**\n\nMetasploit 通常是一种基于命令行的工具。然而，如图 23.9 所示，也有一些商业工具提供 GUI\
  \ 前端。\n\n## 浏览器利用框架（BeEF）\n\n浏览器利用框架（BeEF）是另一个著名的开源渗透测试工具，但它专注于通过网页浏览器进行的基于 Web\
  \ 的攻击。BeEF 可用于 macOS、Windows 和 Linux。有关 BeEF 的更多信息，请访问 www.beefproject.com。\n\n\
  ## 其他产品\n\n其他值得评估的安全产品包括 Nessus、Core Impact 和 Nexpose。还有一些专用的硬件解决方案，例如来自 nGenius\
  \ 的 Netscout，它们为监控网络服务和性能提供了可靠的解决方案。每个网络都应该始终启用某种监控，并且每个网络管理员还应该能够使用可靠的数据包嗅探工具。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_589_0.png)\n\n**图 23.9 Metasploit 操作**\n\
  \n## 动手练习\n\n### 目标\n\n- 在有线以太网接口上启动 Wireshark 捕获应用程序。\n- 检查各种协议和流量。\n- 捕获并分析 PING\
  \ 序列。\n- 描述分析数据包有助于检测恶意活动的方式。\n\n### 资源\n\n- 客户提供的台式机/笔记本电脑硬件系统\n- 已安装 Windows 10\
  \ 专业版\n- 已安装 Wireshark 数据包分析器\n- 具有管理访问权限的帐户\n\n**注意：** 可从 https://www.wireshark.org/download.html\
  \ 获取 Wireshark 的最新副本。\n\n### 讨论\n\n数据包分析器是能够在数据通过数字网络传输时捕获（拦截并记录）数据的设备或软件工具。这些工具也称为数据包嗅探器、网络分析器和协议分析器。当分析器检查通过它的流量时，它会将流量解包为数据包（例如通过以太网网络传输的\
  \ TCP/IP 数据包），以便对其进行分析。这些工具在网络环境中具有广泛的应用。它们通常用于诊断网络问题、识别配置问题和解决网络瓶颈。安全专家还可以使用数据包分析器来监控网络的漏洞、误用和网络攻击企图。渗透测试人员（合法或白帽黑客）和黑客（非法或黑帽黑客）也使用数据包分析器来嗅探网络，试图窃取通过网络传输的未加密数据，例如登录凭据、财务信息或电子邮件消息。他们还可能使用这些工具进行侦察，为未来攻击做准备。Wireshark\
  \ 是一种网络数据包分析工具，通常用于捕获网络中传输的数据包，并尽可能详细地显示它们。Wireshark 是一个免费的开源程序，用于故障排除、分析、调试协议实现以及检查安全问题。\n\
  \n### 操作步骤\n\n在本操作步骤中，你将探索 Wireshark 在网络安全中的应用。分析流量可以让你深入了解网络上的活动。Wireshark 是你应该用来保护网络的众多工具之一。\n\
  \n### 启动 Wireshark\n\n你将从启动 Wireshark 并熟悉界面开始。\n\n1. 启动你的计算机。\n2. 使用具有管理权限的帐户登录。\n\
  3. 找到桌面上的 Wireshark 快捷方式图标。右键单击该图标，然后选择“以管理员身份运行”。Wireshark 将启动，如图 23.10 所示。\n\n\
  ![](img/2459befd842d6fed299fabe6da3512d0_591_0.png)\n\n**图 23.10 Wireshark 界面**\n\
  \n**注意：** 如果你收到错误“The NPF driver isn’t running”，请按照以下说明操作：\n\n1. 单击“开始”图标并选择搜索栏。\n\
  2. 输入 **cmd**，*不要*按 Enter。\n3. 右键单击“程序”下的 **cmd.exe**，然后选择“以管理员身份运行”。\n4. 当提示提升权限时，选择“是”。\n\
  5. 在命令提示符下，输入 **net start npf** 并按 Enter。\n\n你应该看到 NetGroup Packet Filter Driver\
  \ 服务已成功启动。你将需要重新启动 Wireshark。\n\n通常，你不应使用管理帐户运行 Wireshark。但在这种情况下没问题；但在正常环境中，你应该使用权限较低的帐户运行它，并在提示时提升权限。\n\
  \n4. 通过阅读每个标题和副标题来探索你的选项。有许多可用的配置选项。\n\n5. 要开始捕获实时数据包，请单击适合你特定网络配置的网络设备。你选择的设备很可能是以太网或\
  \ Wi-Fi，具体取决于你如何将计算机连接到互联网，如图 23.11 所示。\n\n**注意：** 你捕获的数据看起来应与图 23.12 类似。但是，根据你的网络流量和网络结构，你可能会看到也可能不会看到大量数据包流量。\n\
  \n6. 单击窗口左上角的红色方形图标，以停止正在运行的实时捕获。\n\n**注意：** 根据需要调整三个窗格以查看数据。\n\n捕获窗口分为三个主要部分。最上面的部分按顺序列出捕获的数据包，左侧列中显示与数据包关联的捕获编号和时间。此部分称为“数据包列表”窗格。\n\
  \n中间部分（也称为“数据包详细信息”窗格）显示突出显示的数据包的分析。\n\n底部部分（称为“数据包字节”窗格）以传输的十六进制形式提供数据包。\n\n![](img/2459befd842d6fed299fabe6da3512d0_593_0.png)\n\
  \n**图 23.11 开始捕获数据包流量**\n\n![](img/2459befd842d6fed299fabe6da3512d0_594_0.png)\n\
  \n**图 23.12 Wireshark 捕获窗口**\n\n7. 检查界面，看看你是否能解读屏幕上的信息。在顶部的“数据包列表”窗格中选择各种数据包；并在“数据包详细信息”和“数据包字节”窗格中检查与这些数据包关联的信息。\n\
  \n8. 在表 23.1 中，记录顶部“数据包列表”窗格中的定义列。\n\n**表 23.1 定义列**\n\n| 编号 | 时间 | 源 | 目标 | 协议\
  \ | 长度 | 信息 |\n|-----|------|--------|-------------|----------|--------|------|\n\
  |     |      |        |             |          |        |      |\n\n通过定位“协议”列，你可以大致了解数据包包含的内容。通过查看图\
  \ 23.12，你可以确定协议包括：\n\n- ARP：地址解析协议\n- CLDAP：无连接轻量级目录协议\n- DNS：域名系统\n- NBNS：NetBIOS\
  \ 名称服务\n\n![](img/2459befd842d6fed299fabe6da3512d0_596_0.png)\n\n**图 23.14 Ping**\n\
  \n7. 当 PING 过程完成后，返回 Wireshark 并单击窗口左上角附近的红色方形图标停止实时捕获。\n\n你会注意到列表中至少出现一个新协议。应该会列出\
  \ ICMP 协议，如图 23.15 所示。（根据你的网络正在推送的流量大小，你可能需要向上滚动。）\n\n![](img/2459befd842d6fed299fabe6da3512d0_596_1.png)\n\
  \n**图 23.15 带有 ICMP 数据包的 Wireshark 捕获窗口**\n\n**注意：** 对于每次 PING，你都会看到两个与 ICMP 相关的数据包：回显（PING）请求和回显（PING）应答。\n\
  \n8. 选择“过滤器：”字段框。输入 icmp 并按 Enter。\n\n这会将所有流量过滤为仅 ICMP 协议。在这里，你可以更轻松地查看 PING，如图\
  \ 23.16 所示。\n\n![](img/2459befd842d6fed299fabe6da3512d0_597_0.png)\n\n**图 23.16\
  \ 查看 PING**\n\n### 在 Wireshark 中探索攻击\n\n仅仅为了在 Wireshark 中查看流量而发起攻击是不明智的。在此阶段执行攻击可能会使你的本地计算机无法使用。因此，你将需要检查先前捕获的、代表不同攻击的流量。\n\
  \n你可以从以下位置下载一些示例攻击：https://wiki.wireshark.org/SampleCaptures。将它们存储在桌面上的 Wireshark\
  \ 示例文件夹中。\n\n为了本次实验，请找到并下载以下内容：\n\n- arp-storm.pcap (https://wiki.wireshark.org/SampleCaptures#ARP.2FFRARP)\n\
  - teardrop.cap (https://wiki.wireshark.org/SampleCaptures#Crack_Traces)\n\n\n\n\n\
  \n1. 在桌面上找到标有 Wireshark Examples 的文件夹。双击打开文件夹并查看其内容，如图 23.17 所示。\n\n![](img/2459befd842d6fed299fabe6da3512d0_598_0.png)\n\
  \n图 23.17 Wireshark Examples 文件夹内容\n\n2. 双击 arp-storm.pcap。如果提示请选择并选择 Wireshark\
  \ 打开此文件。图 23.18 显示了打开的文件。\n\n![](img/2459befd842d6fed299fabe6da3512d0_598_1.png)\n\
  \n图 23.18 Arp-Storm 示例\n\n当广播或多播流量压垮网络时，就被称为 *广播风暴* 或 *网络风暴*。由于广播流量会被每个网络设备重新广播，如果交换机和路由器不胜任，持续的流量会迅速使其过载。\n\
  \n与 DoS 攻击一样，监控网络中的广播风暴非常重要。然而，确保网络配置正确，并且拥有足够强大的硬件来快速传输数据并足够快地学习路由以满足组织需求也很重要。\n\
  \n- 3. 通过滚动 Packets List 面板来检查流量。看看是否能发现任何重要信息。\n- 4. 完成对 arp-storm 示例的检查后，通过单击窗口右上角的\
  \ X 关闭 Wireshark 窗口。\n- 5. 返回 Wireshark Examples 文件夹并双击 teardrop.cap。\n\n*Teardrop\
  \ 攻击* 是另一种类型的 DoS 攻击，涉及向目标机器发送分片数据包。目标机器将无法重新组装此类数据包。这会导致数据包相互重叠并最终导致目标网络设备崩溃。\n\
  \n- 6. 检查流量，特别是数据包 8 和 9，如图 23.19 所示，使用中间窗格（Packet Details）。数据包 8 被认为是设置，而数据包 9\
  \ 是重叠攻击。在此示例中，差异很微妙；然而，数据包 8 为 36 字节，而数据包 9 从偏移量 24 开始，从而导致攻击。\n- 7. 关闭所有剩余的 Wireshark\
  \ 窗口。如果提示保存再退出，请选择 Quit Without Saving。\n- 8. 关闭命令提示符窗口以及 Wireshark Examples 文件夹。\n\
  - 9. 关闭计算机。\n\nWireshark 是一款功能强大且流行的流量分析工具。本练习只是对其基础知识的介绍；它还有更多选项，包括 I/O 图表、高级过滤以及分析其他地方捕获的流量的能力。如需了解更多信息，请访问\
  \ wireshark.org。\n\n![](img/2459befd842d6fed299fabe6da3512d0_600_0.png)\n\n**图 23.19**\
  \ Teardrop 攻击示例\n\n## Lab Questions\n\n- 1. Wireshark Capture 窗口中有哪三个窗格？\n- 2. 一个\
  \ PING 涉及多少个数据包？\n- 3. 你应该使用管理员账户运行 Wireshark 吗？\n\n## Lab Answers\n\n- 1. Wireshark\
  \ Capture 窗口中有哪三个窗格？\n\n  Packet List 面板、Packet Details 面板和 Packet Bytes 面板。\n\n\
  - 2. 一个 PING 涉及多少个数据包？\n\n  对于每个 PING，你会看到两个与 ICMP 相关的包：Echo（PING）请求和 Echo（PING）回复。\n\
  \n- 3. 你应该使用管理员账户运行 Wireshark 吗？\n\n  通常不建议这样做。相反，使用权限较低的账户运行 Wireshark，并在提示时提升权限。\n"
- '## Identifying and Defending Against Vulnerabilities


  *现代互联网的现实之一* 是新的网络漏洞几乎每天都会被发现。你也可以预计这些漏洞在被发现后不久就会被利用。一个庞大的产业正在从这些发现中成长并获利，无论它们是被恶意使用还是用于防止未来被利用。在本章中，你将学习：


  - 识别与连接到互联网相关的常见计算机和网络漏洞

  - 讨论常见的网络安全漏洞利用和防御措施


  ### Zero Day Vulnerabilities


  在讨论漏洞时，你经常会听到 *零日漏洞* 或 *零日攻击* 这一术语。这些术语指的是产品厂商未知且因此尚无补丁可修复的漏洞。一旦漏洞公开，厂商必须争分夺秒地发布补丁。


  漏洞可以通过多种方式被发现。它们可能是偶然发现的，也许是有人以应用程序开发人员未预料的方式使用应用程序。但我们最担心的是被研究并针对利用的漏洞。它们可以通过“模糊测试”或以意想不到的方式与应用程序交互来找到，希望逃脱应用程序的控制。另一种找到漏洞的方法是
  *逆向工程* 应用程序，从成品文件倒推以期找到弱点。


  我们中的许多人都熟悉每月第二个星期二作为“补丁星期二”，微软通常会在这一天发布其安全补丁。


  当你处理大量漏洞时，这个时间表可能足够。然而，一些漏洞严重到需要发布非计划补丁。


  Web 浏览器通常提供简单或自动的升级方法。虽然这可能让用户感到烦恼，但这些更新应尽快应用，就像你会保持防病毒软件为最新一样。


  ### A Word About Hackers


  你可能会想知道谁发现这些零日漏洞。这通常是由被称为黑客的个人完成的。黑客一词已演变为指怀有恶意意图的计算机程序员。然而，原本的术语指的是负责在软件程序中查找问题的个人。如今，黑客实际上有不同的“色调”，并非所有黑客都怀有造成伤害的动机。


  ### Software Exploits


  几乎每天你都会看到关于某些流行软件包有更新可用的通知。当然，获取这些更新的公认方法是通過网页浏览器下载。这使得它们既是桌面问题也是应用服务器的问题。


  基于 PHP 的软件，如 WordPress、WordPress 插件或 PHPMyAdmin，由于新漏洞被频繁发现，因此更新频繁。曾有单月发布了三项或更多关键
  WordPress 安全更新来处理安全问题发现。值得称赞的是，WordPress 通过实现自动更新来应对这一问题。但管理员必须始终保持警惕，如果希望拥有这些软件包并保持软件为最新。


  插件也可能受到不同漏洞的影响，且其更新尚未自动。因此，经常手动检查所有服务器软件包的更新非常重要。如果服务器安全绝对关键，重新考虑使用这些软件包也可能是明智的，因为它们被利用的频率很高。


  大多数计算机用户至少对 Adobe Flash Player 多年来的众多漏洞有所了解。大多数人会证明这是他们多年来更新最多的单一软件。Adobe 努力跟上新的零日漏洞，但他们在这场战争中绝不是赢家。


  ### Are You Hosting a PHP Product?


  如果你托管 PHP 产品，请考虑使用 suPHP（suphp.org），它可以限制 PHP 执行。


  虽然一些漏洞可能只是在浏览器中注入广告，但其他漏洞会将勒索软件安装到易受攻击的计算机上，如第二部分所述。一旦安装，勒索软件将加密用户数据全部或部分并要求巨额金钱来解密文件。


  虽然在统计上对 Windows 系统的威胁更大，但 Mac 和 Linux 用户同样容易受到 Flash 漏洞的影响。Flash 软件会频繁检查更新，但许多用户会放弃这些更新或至少延迟它们，因为它们确实需要一些时间来完成。有时连续的多次更新会导致一些更新疲劳的用户禁用自动更新或简单地取消并忽略更新警告。


  由于 Flash 在浏览器中运行，用户可能甚至没有意识到他们正在查看某些 Flash 内容。他们可能认为，因为他们没有观看电影或演示文稿，所以它没有被使用。教育用户及时更新此软件的重要性以及不要禁用自动更新。


  Adobe 不仅要担心 Flash 漏洞，Adobe Reader（前称 Acrobat Reader）漏洞也变得越来越常见。这些漏洞可能导致任意代码执行、沙箱绕过或通常通过内存损坏导致的简单拒绝服务。


  Adobe 从 Flash 中吸取了教训，开发了良好的更新机制；但与 Flash Player 一样，此更新可能需要用户干预，因此可能被忽略。此产品应包含在你的用户教育演示中。


  微软也经常更新其软件，而不仅仅是在前面描述的“补丁星期二”。Windows 并不是唯一有风险的产品，应用程序软件也可能被利用。因此，鼓励用户允许其 Microsoft
  更新运行并完成至关重要。Windows 的每个新版本都试图使这一过程更不显眼和透明，但继续规避此过程的用户最终会意识到这些更新为何至关重要。





  一些管理员忽视的一个问题是，有些用户拥有便携式电脑，只在旅行时使用。这台机器可能数周或数月没有更新，当用户最终收到更新提示时，他们可能会因为身处酒店或飞机上而取消更新。应始终鼓励便携式电脑用户提前做好旅行准备，在出行前至少一天将笔记本电脑连接到网络，并让所有更新得以进行。


  ## SQL 注入


  也许最常见（也最可预防）的软件漏洞利用被称为*SQL 注入*。如图24.1所示，黑客可能会尝试将 SQL 命令注入面向公众的表单（如登录表单），希望借此获得对底层数据库中存储数据的访问权限。


  现代网络的许多强大功能都与在线数据库的使用有关，许多网页设计师使用 SQL（或类似 SQL）的数据库引擎来驱动它们。网站通常是功能强大的 Web 应用程序，可能存储海量信息。使用
  SQL，你常常可以像添加分号（;）然后跟上一条 SQL 命令一样轻松地串联查询和命令。分号的作用是从输入数据的需要“转义”出来，变成指示应用程序执行你随后添加内容的机会。即使你不完全理解
  SQL 编程，也能看出 SQL 注入所呈现的问题。


  想象一个基于邮政编码查找资源的 Web 表单。它会使用如下单个查询：


  ```

  SELECT * FROM Locations WHERE Zip=''$zipcode'';

  ```


  其中 $zipcode 实际上来自用户提供的输入字段。如果黑客输入的是：99336; DROP TABLE Locations 而不是仅输入 99336，那么数据库可能会串联这些命令并完全删除（drop）Locations
  表。


  黑客判断应用程序是否容易受到 SQL 注入攻击的常见方法是在登录表单上寻找单引号漏洞。身份验证查询可能如下所示：


  ```

  SELECT ID FROM Users WHERE Username = ''$username''

  AND Password = ''$password'';

  ```


  如果黑客知道或能猜到你有名为 Steve 的用户，他可以尝试输入以下密码的简单把戏：


  ```

  something'' OR ''a''=''a

  ```


  ![](img/2459befd842d6fed299fabe6da3512d0_606_0.png)


  ## 图 24.1 SQL 注入


  注意，由于应用程序查询会提供单引号，这里没有开头或结尾的单引号。现在可能执行的查询看起来像这样：


  ```

  SELECT ID FROM Users WHERE Username = ''Steve''

  AND Password = ''something OR ''a''=''a'';

  ```


  即使密码不是 something，''a'' 也始终等于 ''a''，通过使用逻辑 OR，只需其中一个比较条件为真即可。黑客甚至可能不需要猜测用户名，只需在用户名字段中尝试同样的把戏：


  ```

  SELECT ID FROM Users where Username = ''Steve'' OR ''x''=''x''

  AND Password = ''something OR ''a''=''a'';

  ```


  这里黑客既猜测了用户名也猜测了密码，但这些并不重要，因为 ''x''=''x'' 和 ''a''=''a'' 始终为真。此外，OR 子句确保每一项都匹配，黑客将获得访问权限。你可能已经在想，我们不应该允许输入单引号。对于用户名和密码字段，这种选项可能有效。然而，如果你像下面这样请求数值数据：


  ```

  SELECT ID FROM Users where UserID=$inputValue;

  ```


  而数值字段不需要引号，只需输入：


  ```

  8686 OR 5=5

  ```


  查询应该匹配，因为即使数据库中没有等于 8686 的 UserID，5 也确实等于 5。


  这可能相当吓人，但好消息是这也相当容易预防。Web 应用程序程序员只需在将每个输入字段包含到查询中之前对其进行过滤或净化。这可以通过多种方式完成，但请考虑以下方法：


  - 只允许输入白名单中的字符。显然，单引号不会在该白名单中。

  - 对输入字段数据进行转义。

  - 解析输入字段数据，并禁止 OR 和 ||（当然还有 DROP）。

  - 始终对数值输入字段加引号。


  这些方法会产生一定效果，并且对于许多表单来说可能已经足够。然而，似乎总有某种注入字符串可以绕过输入验证。转义存在一些问题，并且可能在某些字段上造成麻烦（例如，名字字段中用户可能输入撇号作为其名字的一部分）。如果黑客输入反斜杠（\）字符来转义其输入，或使用
  Unicode 或其他编码，他们最终可能击败你的净化例程。


  防止 SQL 注入的最佳方法是使用 SQL 参数。现代 SQL 系统支持参数化查询，其中参数被严格作为数据求值，不允许任何命令执行。例如：


  ```

  SELECT ID From Users where Username=''@user'' AND

  Password=''@pass'';

  ```


  在代码的某处，服务器会有处理这些参数的存储过程，并强制执行严格的数据类型和验证，以确保只有你自己的代码被执行。你在构造查询时仍然需要小心，并且要理解表和列不能作为参数。然而，这被认为是使用
  SQL 系统时的最佳实践。


  还有另外两种类似于 SQL 注入的漏洞：跨站脚本（XSS）和 LDAP 注入攻击。在*跨站脚本攻击*中，攻击者将 JavaScript 安装在输入字段中。如果该输入被回显，用户的浏览器可能会执行该代码。这类事情可以通过不回显该输入或在输入净化中转换所有
  HTML 实体来避免，这将把 `<script>` 转换为 `&lt;script&gt;` 并使其无害。要防止 LDAP 注入攻击，重要的是执行 LDAP 查询的面向公众的表单使用某种类型的输入验证。


  虽然现代浏览器可以防范跨站脚本攻击，但它们无法完全防御它。与许多其他攻击一样，这种攻击需要一个被黑客入侵或以其他方式恶意构造的网页，如图24.2所示。教育用户了解此风险，并手动登录社交媒体而不是通过网页链接登录，会有所帮助。托管网页应定期使用前面描述的工具（如
  BeEF 或 Metasploit）扫描此类漏洞利用。


  ## Java


  从统计上看，Java 可能比其他任何软件包都更容易成为漏洞利用的目标。许多人认为 Oracle 对 Java 的加固不够，并已采取立场认为应该避免使用 Java。Java
  在其自己的虚拟环境中运行，标准操作系统保护方案无法针对 Java 漏洞利用提供保护。


  大多数现代操作系统提供数据执行保护（DEP）和地址空间布局随机化（ASLR），以及其他应用程序沙箱方案，这使得漏洞利用变得困难得多。这些方案无法保护用户免受 Java
  漏洞利用的影响。加上 Java 的普遍存在，这使它成为黑客的绝佳目标。


  ![](img/2459befd842d6fed299fabe6da3512d0_609_0.png)


  图 24.2 跨站脚本


  对于那些并不是真正需要 Java 的用户，直接禁用 Java 是一个很好的解决方案。对于那些必须运行 Java 的用户，可以在一定程度上限制可使用的文件。这使得用户必须保持
  Java 修补变得更为重要。Oracle 的更新在公开漏洞利用发布后的滞后程度往往比网络安全行业所期望的稍大，但在这些补丁可用时及时更新至关重要。


  ## 其他软件漏洞利用


  尽管相关各方都做出了努力，但似乎几乎任何软件只要得到合适的黑客足够的关注，都可能被利用。同样的概念适用于所有软件：用户必须警惕其软件和数据文件的获取来源，并且必须及时执行所有软件更新。


  Microsoft Office 应用程序支持宏，这些宏存在许多可能的漏洞利用。由于大多数用户不使用这些宏，关闭宏支持在这些情况下是一个很好的解决方案。


  Web 浏览器似乎擅长自我更新，越来越多的软件包正转向自动更新机制，因此总体上正在取得良好进展。浏览器扩展日益受到关注，因为它们越来越流行，必须像其他类型的软件一样被认真对待。


  用户必须充分了解软件威胁，并对更新请求积极响应。


  简单的防病毒和反恶意软件无法完全保护用户或服务器免受软件漏洞利用的影响。一些漏洞利用可能来自高风险的网络冒险行为或社会工程学（或用户的轻信）；但归根结底，重要的是要认识到，任何人能做的防止每种漏洞利用的事情都是有限的。


  当你将这一现实与 CryptoLocker 和其他勒索软件等漏洞利用的恶劣性结合起来时，最好的防御可能是强大的备份解决方案。频繁的增量备份是最大程度减少这些漏洞利用影响的最佳方法。简单备份并不是完美的解决方案，因为你可能没有意识到漏洞利用，并可能将已被利用的软件或数据备份到好副本之上。


  使用提供基于时间的数据检索的增量备份解决方案是最好的解决方案。Apple 的 Time Machine 和 Microsoft 的 File History 是优秀的备份解决方案，允许恢复到漏洞利用发生前的某个时间点。




  '
- '# 社会工程学攻击利用


  当我们想到网络漏洞时，我们最初并不会想到人的漏洞，但它们是许多网络安全攻击的目标。*社会工程学*本质上利用人际互动来规避正常的防护。随着传统安全措施的不断完善和网络攻击手段越来越难以实施，黑客正转向心理操纵来实现其目标。


  我们往往会轻视这一概念，并且常常觉得用户能被这样欺骗实在令人惊讶，但社会工程学出奇地有效，而无需过于详细或复杂。问题的关键在于，人们倾向于过度友好和信任。当某人遇到精心设计的攻击时，如果缺乏适当的意识培训，人们很容易上当。


  一些社会工程学欺骗手段如此逼真，只有经过极其严格的审查才能被识别。用户无法提供这种程度的审查或具体理解，因此对其进行一般概念的教育是打击这些活动的最佳方式。


  ## 钓鱼攻击


  *钓鱼*是一种社会工程学技术，试图通过冒充值得信赖的组织来获取敏感信息，通常是登录凭证或信用卡数据。这些攻击通常涉及电子邮件，将用户引导至一个看似真实的虚假网站，如图
  24.3 所示。


  此类网站会提示用户输入其凭证或其他敏感信息，以便收集信息并用于身份盗窃。


  我们常常认为这些东西明显荒谬到没人会上当受骗。然而，总有人会上当，这也是它们如此流行的原因。


  打击钓鱼的第一步也是最好的方法就是对用户进行教育。与其羞辱他们是容易上当的新手，不如更好地提供简单的方法来识别真实邮件或网站与虚假邮件或网站之间的区别，包括：


  - ► 电子邮件或网站的外观可能具有欺骗性。标志、官方免责声明和法律术语并不能提供任何合法性，因为它们可以很容易地被伪造或复制。


  ![](img/2459befd842d6fed299fabe6da3512d0_612_0.png)


  **图 24.3** 钓鱼攻击示例


  - ▶ 要理解，正规公司很少发送会链接到要求提供敏感信息的任何内容的电子邮件。这些组织可能会鼓励你登录账户以享受某些新功能或利用某些促销活动。如果是这样，请以正常方式进行，而不是通过电子邮件中的链接。正规组织在多年的经验中已经学到，他们不会做任何会让你更不信任他们的事。

  - ▶ 电子邮件上的“发件人”地址可以非常容易地被伪造，任何人都可以做到这一点。

  - ▶ 电子邮件中的超链接可能很危险。如果你不认识发送电子邮件的人或组织，根本不要点击链接。

  - ▶ 如果你认识电子邮件的发件人或组织，请意识到电子邮件中的超链接可能带你到任何地方。教用户如何检查这些链接的网址，并寻找合法组织的 URL，而不是仅仅将组织名称作为
  URL 的一部分。


  例如，指向你的银行“我的超安全银行”的链接是 https://myreallysecurebank.com。在钓鱼邮件中，该链接可能显示为：https://bogus.somewhere.ru/myreallysecurebank，其中
  *bogus* 和 *somewhere* 是黑客试图将你引导到的地方，以便让你透露他们随后将用于窃取你的身份或访问你的账户的信息。最好始终直接通过书签或输入
  URL 的方式访问网站。


  - ▶ 教用户如何检查电子邮件头。这对许多人来说可能有点困难。然而，向用户展示如何查看电子邮件头并展示他们如何查看消息经过的每个邮件服务器的服务器主机名。通过这样做，你通常可以看出电子邮件是否合法。


  虽然一些公司会使用外部组织进行营销甚至支持邮件，但任何链接到需要输入敏感信息的网站的合法邮件都应始终来自组织本身。如果不是，就不要信任它。


  钓鱼攻击也可以更具针对性。* spear phishing* 可能会针对组织中的单个用户，并伪装成该组织中另一位请求敏感信息的人。解决这种攻击的最佳方法是制定公司政策，禁止用户之间发送敏感信息。然而，教育在这里也是一个强大的工具。


  回复此类电子邮件将比将其发送到其地址簿中的地址更成问题。如果用户不仅了解风险，而且还知道几种简单的避免欺骗的方法，网络将更加安全。


  钓鱼攻击有多种不同的变体，包括 pharming、spear-phishing、whaling 等。你可以通过在线搜索这些术语来了解更多关于这些变体的信息。


  ## 网络威胁和攻击


  第三部分介绍了几种不同类型的网络漏洞以及与之相关的攻击类型，它们适用于局域网连接设备。在本章中，这些漏洞和攻击类型将作为它们适用于互联网相关活动的方式重新审视。


  ### 广播风暴


  在第三部分中，你了解到当广播流量被每个网络设备重新广播时，持续的广播或多播流量会迅速使交换机和路由器过载并压垮网络。这种活动被称为 *广播风暴* 或网络风暴，如图
  24.4 所示。


  ![](img/2459befd842d6fed299fabe6da3512d0_614_0.png)


  **图 24.4** 广播风暴


  监控网络是否存在广播风暴很重要。然而，确保网络配置正确也很重要。如果网络节点直接与多个交换机通信，查找表可能会混淆，导致数据包在各段之间泛洪。这可能代表网络实施中的一个主要弱点。


  同时拥有足够强大的硬件也很重要，以便快速移动数据并足够快地学习路由以满足组织的需求。随着网络速度提升至千兆及更快，所有网络硬件都必须适合该数据速率变得越来越重要。


  虽然可以通过某种方式对网络进行分段以最大程度地降低广播风暴的风险，但生成树协议（STP）正是为处理此问题而创建的。STP 采用生成树算法（STA）来理解交换机可能有多种方式与网络节点通信，并管理最佳路径，同时仍能够回退到次要路径。关键任务网络必须使用
  STP 以最大程度地减少广播风暴。


  STP 将通过操纵其优先级级别在多路径网络中建立一个交换机作为其 *根桥*。它通过在所有网络交换机之间交换第 2 层桥接协议数据单元（BPDU）来实现这一点，直到选出获胜者。一旦建立，所有其他网络交换机都将受根桥交换机的管辖，所有网络流量都将通过它传递。每个非根桥交换机都连接到根桥交换机上的自己的根端口。


  许多网络漏洞都集中在以某种方式获取有效凭证上。欺骗之前已经讨论过，因此显而易见，攻击者伪造或欺骗网络身份并不太困难。冒充攻击可能来自被盗凭证、伪造的 IP 或电子邮件地址，或两者兼有。如果攻击者能骗用户交出其凭证，他们就可以获得该用户的网络状态。多因素身份验证工作（你不仅仅查看输入的凭证）可以最大程度地降低冒充攻击的效率，但这些解决方案可能并不总是实用。


  ## 会话劫持攻击


  在 TCP 会话中，身份验证通常只在会话开始时进行。登录网站时，通常会向用户提供会话 cookie 以便后续识别。如果攻击者能够嗅探此连接并获取会话 cookie，他们就可以访问该网站，如图
  24.5 所示。这种类型的攻击被称为 *会话劫持*。


  ## 中间人（MITM）攻击


  在第三部分中，你还被介绍到中间人（MITM）攻击或消防队攻击。这些攻击是一种会话劫持类型，涉及拦截或嗅探并修改用户之间的通信，如图所示



  Figure 24.6. You can think of them as a form of network eavesdropping. As such,
  the attacker is usually on the same network or broadcast domain as the other two
  parties and will proxy communications between the parties, inserting or altering
  data in the process. In an SSL connection, the attacker might use ARP spoofing to
  divert traffic though the attacker rather than the normal network router.


  ![](img/2459befd842d6fed299fabe6da3512d0_616_0.png)


  ## FIGURE 24.5 Session Hijacking


  ![](img/2459befd842d6fed299fabe6da3512d0_616_1.png)


  ## FIGURE 24.6 MITM Attack


  ## Clickjacking Attacks


  A clickjacking attack employs deceptive frame techniques to trick the user into
  clicking on their content rather than the intended content. This is a popular


  trick deployed on hacked websites because it is easy to do and can yield high rewards,
  as shown in Figure 24.7. The attacker mostly conceals the legitimate frame so the
  user clicks on the attacker''s frame. This is often done to social media frames.
  It is possible for the web page developer to add a little frame-busting code to
  their web documents, but that can be defeated as well.


  ![](img/2459befd842d6fed299fabe6da3512d0_617_0.png)


  FIGURE 24.7 Clickjacking


  ## Dictionary Attacks


  A dictionary attack is simply a systematic, brute-force attack using every word
  in a dictionary as a password. This type of attack is simple to eliminate by limiting
  the number of login attempts that can be performed in a given period of time. In
  addition, the IP of any user exceeding a certain number of attempts over that period
  of time could be banned until they are cleared by an administrator. Another solution
  for defeating dictionary attacks is to enforce a strict password methodology that
  requires something more than a dictionary word for access. This type of attack is
  commonly used by spammers who guess at passwords of email accounts in order to gain
  access to an account and then use it for their spam distribution.


  ## Denial of Service (DoS) Attacks


  Probably nothing disrupts a network administrator''s dreams more than the DoS attacks
  (see Figure 24.8) you were introduced to in Part III. They are disruptive


  not simply because these attacks often occur in the middle of the night, but because
  there is really no way to be completely immune to them. As you are aware from those
  previous DoS discussions, there are many ways to flood a network or a service with
  requests that can ultimately bring down even the most robust network hardware. The
  best that can be hoped for is to minimize their impact and have a plan to deal with
  them.


  ## Would You Like Fries with That DoS Attack?


  DoS attacks are now available as services known as booter services, which charge
  customers for providing a distributed Denial of Service attack on demand.


  A distributed DoS (DDoS) attack uses multiple compromised systems on many different
  networks (referred to as botnets) to provide the attack. The botnet systems are
  typically infected with a Trojan, but there are many ways to get malware into a
  computer these days.


  Because the attack could come from hundreds or even thousands of computers, a distributed
  attack is much more difficult to stop, as it’s not as simple as just blocking a
  single IP. In addition, DDoS attacks are so easy to perform that even an unsophisticated
  attacker, commonly called a script kiddie, can launch an attack that will wreak
  havoc on a network. The botnet-for-rent service is a real concern for network administrators
  as well.


  Many incorrectly think they are unlikely targets for a DoS attack of any kind. Security
  through obscurity is no longer a rational approach to network protection. There
  is some degree of randomness to DoS attacks these days, so every network will be
  affected eventually.


  Networks normally rely on firewalls to defend their resources. Some firewalls offer
  protection against DoS attacks, but a better approach is to employ a specialized
  device that examines all incoming traffic before it gets to the firewall. These
  specialized network appliances offer better DDoS mitigation and monitoring and perform
  much better than normal firewalls because of their singular focus. These products
  are very expensive and probably not practical for smaller organizations.


  Monitoring for any kind of DoS attack is critical, and having a plan to deal with
  this sort of thing is important because the network will be down before administrators
  can even start to deal with it. Because a DoS can be initiated in so many different
  ways, simply monitoring for slow network performance is the first place to start.
  Usage spikes or even a large jump in email volume should get an administrator’s
  attention.


  ![](img/2459befd842d6fed299fabe6da3512d0_619_0.png)


  ## FIGURE 24.8 A Typical DoS Attack


  If the network has a public web server, ensure that it is patched with the latest
  security and software updates. Also consider implementing transaction limits and
  monitoring so that any surges in activity can be reacted to in a rapid manner as
  well. Ensure the network''s authentication schemes are strong and web servers ideally
  should be protected with firewall software that incorporates some level of IP filtering
  and automatically block excessive activity.


  For Linux/Apache systems, a product such as Fail2ban can be used to reject IP addresses
  and services for a specified time to help thwart basic attacks. Nondistributed attacks
  are easier and, therefore, more common, making this type of protection from brute-force
  attacks very helpful.


  A new DDoS protection and mitigation service industry is on the rise, offering more
  affordable solutions for organizations. These are not on-premise solutions and they
  are not for everyone. However, this type of solution is certainly something to consider
  when running mission-critical Internet applications. While CloudFlare (cloudflare.com)
  offers a free plan that may help many organizations, the monthly costs associated
  with most plans make them very attractive as well.


  Often a DoS attack may be a diversion for some other criminal activity and should
  always be considered as a possibility when investigating an attack. If no sort of
  DDoS mitigation process is in place, you may simply have to endure the attack. When
  these attacks occur, some administrators pointlessly attempt to block IP after IP.


  Once such an attack has been initiated, the remaining option is to simply shut down
  the network. The attacker might proclaim victory and move on if you are very lucky.
  Also consider blocking every incoming port that you possibly can. If the attack
  targets a particular port, it may be possible to move this service to a different
  port.


  A newer DoS attack scheme, known as a Distributed Reflection and Amplification Denial
  of Service (DRDoS) attack, is becoming more common. Attackers are able to use a
  relatively small botnet in a distributed attack on reflection servers that redirect
  the queries they receive, making it appear as though the reflection server is the
  actual source. This type of attack is illustrated in Figure 24.9.


  The reflection server is then overwhelmed by the combination of incoming queries
  and resulting responses. Often this sort of attack targets DNS services as the attacker
  forges a DNS request and the server responds to the spoofed IP that is the actual
  target of the attack. This means that the reflection servers may not even be part
  of a botnet or be compromised at all.


  ![](img/2459befd842d6fed299fabe6da3512d0_621_0.png)


  ## FIGURE 24.9 A DRDoS Attack


  The impact of this DNS amplification attack is much stronger when the DNS server
  is authoritative for the domain being queried where the attacker will make a DNS
  ANY request, which will return all known information about that DNS zone. A name
  server is authoritative if it provides definitive answers to DNS queries rather
  than from a cache or by requesting that information from another name server. By
  leveraging a botnet of DNS servers configured to allow unrestricted recursive resolution
  for any client, known as open DNS resolvers, a small number of servers can amplify
  the DDoS attack.


  The Open DNS Resolver Project (openresolverproject.org) has a compilation of DNS
  servers that are known to serve as globally accessible resolvers so you can block
  them. However, you should also make sure that the network’s DNS servers are not
  open recursive resolvers. Some free tools are available to test DNS servers (dns.measurement-factory.com,
  dnsinspect.com and others).


  Make sure that all caching name servers respond only to local queries and any authoritative
  DNS servers do not offer recursion and instead use DNS RRL (DNS Response Rate Limiting),
  which limits the rate at which authoritative servers respond to queries.


  Most DDoS attacks target the transport and network layers. Layer 7 attacks focus
  on the application layer and generally target specific areas of a website in hopes
  of exhausting resources. This type of attack can be difficult to recognize because
  it appears as normal network traffic up to a point. The attacker will find a form
  or a feature of the website that might employ more resources and target that feature
  from a botnet.






  Popular content management systems such as WordPress are targeted with this sort
  of application layer attack, often exploiting the search function of the site that
  appears to be normal requests. The sheer volume of these requests will bring the
  site down. DDoS mitigation services will help with this, and you could also consider
  using proxy servers that can provide some sort of rate limiting.


  Ultimately, the battle to block IP addresses is rarely won, as these attacks typically
  come from thousands of IP addresses, depending on the size of the botnet. If a dynamic
  IP blocking system, such as Fail2ban, is in place some progress might be made. However,
  a large botnet will probably prevail. IP blocking is a fundamental mitigation concept,
  but the more distributed the attack the less likely this single tactic will help.


  ## Tarpitting


  Another possible solution to this sort of attack is known as *tarpitting*, sometimes
  known as a *sticky honeypot*. To mitigate an HTTP attack, the concept here is to
  initially respond to a connection as normal but with a very small TCP window size.
  The host replies to a SYN packet with a SYN/ACK, but ignores the sender’s ACK, as
  shown in Figure 24.10. The sender starts to send data, but the host will never receive
  it, or the host might just set their TCP window size to zero, effectively stopping
  incoming traffic.


  ![](img/2459befd842d6fed299fabe6da3512d0_622_0.png)


  **FIGURE 24.10** Tarpitting


  Clearly, you can’t do this for all connections, so the challenge is to identify
  the attackers and only tarpit those connections. This is far better than simply
  dropping packets because the sender will just send again rather than wait.


  To thwart bulk email attacks, the concept is to deliberately slow down bulk-delivered
  emails compared to normal traffic. This may have some impact but typically will
  just force the spammer to send smaller batches with a longer delay between batches.


  More sophisticated tarpitting software is used to monitor ARP requests looking for
  consecutive requests spaced several seconds apart without any ARP replies. When
  such requests are discovered, the software creates an ARP reply, using a bogus MAC
  address, on an unused IP address on the network.


  The software then creates a virtual machine that watches for SYN packets for that
  bogus MAC address and replies with a SYN/ACK that tarpits the connection. This virtual
  machine might even respond to pings to further the charade.


  Sophisticated tarpitting software packages are created to thwart specific worm attacks,
  but it is an ongoing battle. Sadly, you can’t just enable tarpitting and be fully
  protected—but this type of software is a great addition to the arsenal.


  ## Spam


  Spammers are generally considered the lowest form of hacker and often perform directory
  harvest attacks (DHAs), where they simply guess email addresses at a domain and
  then connect to the email server of that domain. Any addresses that are not rejected
  are considered valid and can be added to a list of real email addresses the attacker
  can sell.


  Most methods designed to thwart a DHA will result in slower service for legitimate
  mail. Some of the best solutions involve intelligently monitoring the early stages
  of mail delivery and denying access for a time to connections that have generated
  too many invalid recipient errors. Once the spammer’s efforts are blocked, they
  will probably move on to some other target.


  Spammers represent a huge threat today because they have commercial motivation as
  a startling number of users will actually respond to spam. The spammers don’t have
  to necessarily breach a network but rather can simply exploit a single user to serve
  their purposes.


  Using social engineering, deceptive emails, clickjacking, or whatever means they
  can, spammers gather credentials for one of the network user’s email accounts. Even
  if there is no public webmail server on the network, it isn’t difficult for spammers
  to figure out server settings for most networks and send email through the mail
  server as if they were the compromised user.


  ## Protecting Against Spam Exploits


  Strong passwords and education can provide only so much protection. Once exploited,
  the spammer can send spam freely through the network and worse yet could even send
  out false or misleading information that could create liability (or at least embarrassment)
  for an organization. This type of *repudiation attack* is becoming more and more
  common. It is far from trivial to limit this sort of attack, but there are some
  things you can do.


  ### Require Authentication for the Outgoing Mail Server


  Make sure the outgoing mail server requires some sort of authentication. If you
  don’t allow users to send from outside your network, this is simple. You can constrain
  sending to a subnet, but most organizations don’t do this. If the outgoing password
  is different than the incoming mail password, the user base will scream—but it will
  make it less likely for spammers to achieve this goal. If you require outside users
  to log in through a VPN to be able to send email, that can help as well provided
  the VPN is secure.


  ### Limit Outgoing Email Recipients


  You should limit the number of recipients for any outgoing email to a reasonable
  number. Spammers will want to send large batches of emails as quickly as they can
  before spam-detection blocks your mail server. If a single email can be sent to
  only 20 users at a time, this will slow down their progress. If possible, do this
  per user and accomplish even more while still allowing internal mailing lists and
  services to function normally.


  ### Configure Notifications for Email Volumes


  You should trigger notification of an administrator when an unusual volume of email
  is sent by a single user or overall. Generally, when administrators review the logs,
  they can tell by the email subjects that the message is spam. If you can quarantine
  bulk email until it can be reviewed, you are in the best position to stop this sort
  of thing.


  ### Restrict Webmail Servers


  When a public-facing webmail system is used, you should restrict that server more
  than a normal outgoing mail server because these servers are the favorite targets
  of spammers. By restricting bulk email sending to traditional email client software
  rather than webmail systems, you can remove one variable from the equation.


  ### Pay Close Attention to Email Blacklists


  You should monitor email blacklists carefully and respond to complaints immediately.
  The sooner a rogue account is discovered and disabled, the better. Blacklist-monitoring
  services that can really help are available. Even though it is too late to prevent
  a release of spam and subsequent blacklisting by the time the alerts come in, you
  will at least be in a better position to deal with the issue.


  Many email providers and administrators fail to check these lists, assuming they
  should be above reproach. Blacklisting is a mostly automated activity and what isn’t
  automated is not governed particularly well.


  Spam-weary users may report the mail server and some systems can trigger a blacklisting
  with very few complaints. Utilize services such as mxtoolbox.com, blacklistmonitoring.com,
  debouncer.com, and others to assist with blacklisting.


  ## Other Exploits


  There are many other types of attacks and hackers are busy dreaming up new ones
  every day. Some attacks are just malicious to be malicious, and there is no real
  commercial gain for the attacker, but others may have commercial motives. With any
  attack you should look for what possible commercial gain could be available as it
  may not be immediately obvious.


  ### Transport Layer Security (TLS) Exploits


  As encrypted communication using Transport Layer Security (TLS) is becoming more
  the rule rather than the exception, it should come as no surprise that more security
  attacks are focusing on it.


  After a secure connection has been negotiated and keys exchanged, there isn’t much
  that can be exploited, so these attacks focus on this key exchange.


  Often, these vulnerabilities exploit weaknesses in both the browser and server that
  can lead to a connection with weakened encryption. Patching both the client browser
  and the server SSL/TLS libraries was necessary after an OpenSSL bug was discovered
  in early 2015 that would allow a man-in-the-middle attack to downgrade connections
  from strong RSA encryption to an “export-grade” 512-bit RSA encryption.






  Export-grade encryption was created to be good enough but still allow the National
  Security Agency to decrypt communication outside the United States. The NSA lifted
  this export requirement in the late 1990s, but those cipher suites have remained
  in both client and server libraries.


  ## FREAK Exploits


  More than 15 years later, when a vulnerability known as *FREAK* (Factoring attack
  on RSA-EXPORT Keys) was discovered, it became clear that this export-grade feature
  was still available in many web clients, as well as in OpenSSL. This led to a scramble
  to patch the product.


  While this still means an attacker would have to crack a 512-bit encryption, it
  is well known that this can be done in a matter of hours. However, 1024-bit encryption
  would take an impractically long time, and today encrypted services are often using
  2048-bit encryption, which, for now anyway, seems uncrackable using contemporary
  technologies.


  Because the FREAK flaw required a susceptible browser and server, its discovery
  also exposed another area of concern when it was learned just how many mobile browsers
  were susceptible. Many mobile platforms are simply not frequently updated, leading
  Microsoft, Apple, and Google to scramble and make software solutions available soon
  after the issue was discovered.


  However, not all devices have upgrades available. Many older devices never had or
  no longer have software upgrade paths, so those browsers remain susceptible. The
  same can be said for the many painfully old desktop computers that are running obsolete
  operating systems, which will not support modern browsers. It is not that uncommon
  for employees to use personal mobile devices or laptops on their work networks,
  and these devices could create some risk for their organization.


  ## Logjam Exploits


  Another popular cryptographic algorithm used in many Internet protocols rather than
  an RSA key exchange is the Diffie-Hellman key exchange (DHE). *A logjam attack*
  is similar to the FREAK attack but instead targets this Diffie-Hellman key exchange,
  convincing the connection to use DHE Export ciphers.


  This attack exploits the *prime number sieve* (algorithm for determining all prime
  numbers up to a specified limit) used in the key-generation process, forcing it
  to use a 512-bit prime. Similar to FREAK, upgrade patches have been made available
  for modern browsers and software suites leaving obsolete systems vulnerable.


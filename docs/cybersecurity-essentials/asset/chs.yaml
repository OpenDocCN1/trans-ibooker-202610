  \ 11.2 提供了公司网络结构的概览。\n\n## 风险评估 2\n\n根据本挑战提供的信息，考虑以下 NIST 功能并对每个功能列出的类别和子类别生成想法。在这些考虑的基础上，您将随后被介绍如何实施所要求的功能的具体信息。\n\

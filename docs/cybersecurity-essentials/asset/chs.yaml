  \ 所示，该实用程序将识别当前网络配置，包括 IP 地址和物理 MAC 地址。\n\n当使用 DHCP 提供 IP 地址时，可以使用 `ipconfig /release`\
  \ 和 `ipconfig /renew` 开关强制 DHCP 服务器撤销当前的 IP 地址租约并获取新的租约。\n\n![](img/2459befd842d6fed299fabe6da3512d0_336_0.png)\n\
  \n- 1. 单击先前固定到任务栏的“命令提示符”快捷方式，打开“命令提示符”窗口。\n- 2. 在命令提示符下，键入 `ipconfig ?`，然后按 Enter\
  \ 查看 IPCONFIG 选项。您可以向上滚动查看可能已滚出屏幕的缓冲文本部分。\n- 3. 在命令提示符下，键入 `ipconfig /all` 并按 Enter。\n\

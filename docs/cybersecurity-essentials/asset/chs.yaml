  \n## spanning-tree attack\n\n如果数据包仅在此类拓扑中的第 2 层交换机之间循环，则其生存时间（TTL）字段永远不会递减——而是继续通过冗余链路循环。这会产生广播风暴，用流量淹没网络。\n\
  \n## spanning-tree Protocol (STP)\n\n该协议为多路径网络中的交换机提供无环路冗余链路。它通过配置交换机端口来实现这一点，使其根据所连接的段类型转发或阻止流量。\n\
  \n## spear phishing\n\n而钓鱼攻击是随机发送给广泛的目标， spear-phishing 攻击针对特定组织或该组织内的个人，以试图获得对机密数据的未经授权访问。spear-phishing\
  \ 攻击更有可能由寻求巨额经济利益、行业机密或军事信息的攻击者实施。\n\n## spoof\n\n任何伪造虚假身份的形式，从而获得对资产的访问权限。\n\n\
  ## spoofing attacks\n\n这些攻击基于更改设备的 MAC 或 IP 地址以改变其明显身份。\n\n## spyware\n\n一种监控系统操作并收集用户名、密码、信用卡号码和其他个人身份信息的软件程序。\n\
  \n## SQL injection\n\n恶意用户用来操纵网页上 SQL 输入填充框的技术。特别是，精通 SQL 的黑客会通过字段框输入有效的 SQL 命令，导致\
  \ SQL 数据库泄露除输入创建目的之外的信息。\n\n## SSH tunneling\n\n在远程主机和本地设备或计算机之间创建安全连接，通过该连接未加密的流量可以通过加密通道传输。\n\
  \n## star topology\n\n这种逻辑布局中，所有节点都通过分支连接到中央单元。节点通过中央单元相互通信。\n\n## stateful packet-filtering\
  \ firewalls\n\n这些防火墙收集网络连接信息并维护用于后续连接的动态状态表，从而能够根据数据包过滤规则打开和关闭端口。\n\n## stateless\
  \ packet-filtering firewalls\n\n作为访问控制列表（ACL）更有效运行，它们不跟踪两台计算机之间连接的状态；然而，它们将数据包与过滤规则进行比较。\n\
  \n## Storage Area Networks (SANs)\n\n一种基于网络的存储系统，对主机机器来说看起来像是本地连接的。\n\n## stream\
  \ cipher\n\n一种对称密钥密码，一次转换每个明文字符。\n\n## subnet\n\n最终属于更大网络的一部分的隔离网络。\n\n## super\
  \ cookies\n\n第三方 cookie，比其他类型的 cookie 更难删除。许多 cookie 不使用传统的 cookie 存储方法，而是使用本地浏览器\
  \ HTML5 数据库存储甚至 Adobe Flash 数据存储。\n\n\n\n\n\n## teardrop attack\n一种 DoS 攻击类型，向目标系统发送分片数据包。旧版操作系统在其\
  \ TCP/IP 重组机制中存在漏洞，导致分片数据包重叠并使主机崩溃。\n\n## telephoto lens\n一种焦距较长的镜头，提供放大的视野。\n\n\
  ## Telnet\n一种应用客户端-服务器协议，可在计算机（或设备）与任何远程 Telnet 服务器之间建立连接。\n\n## territorial reinforcement\n\
  这采用结构、系统和设备来防止未经授权的进入，并明确区分公共与私有的界限。\n\n## threat\n执行行动的潜在能力，意图造成疼痛、伤害、损害或其他敌对行为。\n\
  \n## threat agent\n表示具有知识和意图发起攻击的个人、团体或设备。\n\n## threat vector\n一种常见的安全术语，指攻击者可能采用的方法以到达目标。\n\
  \n## threshold-based anomaly-detection systems\n这些入侵检测系统旨在随时间跟踪特定事件的发生次数，然后在事件数量超过预定数量时生成入侵警告。\n\
  \n## time of check to time of use (TOCTOU)\n当操作系统创建临时文件时会出现此情况。在操作系统检查文件是否存在与实际写入文件之间的时间间隔内，攻击者执行程序，使用临时文件的名称保存恶意代码包。\n\
  \n## time-of-day settings\n大多数自动访问控制系统基于预配置的每日时间设置来决定有效或无效的进入请求，也称为交易。\n\n## time\
  \ of use (TOU)\n一种电费计费计划，对在一天中的某些时间和一年中的某些季节消耗的能源收取更高的费用。\n\n## top-level domain\
  \ (TLD)\n在互联网域名系统定义中，最高级别的域名，位于最右侧的点（.）之前。顶级域名通常分为商业和国家特定两类。\n\n## Top Secret\n\
  通常是三级安全许可中的最高级别。\n\n## topology\n网络连接结构的物理和/或逻辑定义。\n\n## TRACEROUTE\n此网络实用程序将显示数据包从一个\
  \ IP 到另一个 IP 所经过的路由（路径）。\n\n## tracking cookies\n放置在主机计算机上的非恶意文本文件，旨在跟踪用户的网页浏览习惯。\n\
  \n## transparent proxy\n此代理服务器代表主机机器进行通信，而不修改请求，与大多数代理服务相反。透明代理通常是用户甚至不知道正在使用的东西。\n\
  \n## Transport Layer Security (TLS)\nSSL 协议的继任者，TLS 是一种用于确保通信应用程序之间隐私的协议。\n\n##\
  \ Trojans\n看起来像是合法应用程序的恶意软件，以便用户被诱骗使用它们。虽然它们功能正常并能正常工作，但它们包含在应用程序启动时启动的恶意代码。\n\n\
  ## TrouSerS\n一个开源守护进程，通过单个模块控制与 TPM 的所有通信。\n\n## trunk\n一种通信链路，旨在处理和合并多个流量信号，通常是到其他网络设备，以实现物理端口使用的整合。\n\
  \n## Trusted Platform Module (TPM)\n许多计算机主板设计包含一个内置微芯片，称为可信平台模块（TPM），用于存储加密信息，例如加密密钥（也称为启动密钥）。\n\
  \n## Trusted VPNs\n这些 VPN 不使用加密隧道，而是信任底层网络在身份验证之外处理安全性。\n\n## TrustedGrub\n此 Linux\
  \ 模块能够检测并支持 Linux 系统中的 TPM 功能。它是 Grub 启动加载器的可下载扩展，已为此目的进行了修改。\n\n## tunneling\n\
  允许远程用户在建立互联网连接后安全地连接到内部资源。这是通过使用数据传输加密来保护传输中的数据来实现的。\n\n## two-factor authentication\n\
  一种需要两个不同因素才能授予授权的过程，基于你所知道的、你所拥有的和你所知道的。\n\n## two-man control\n要求两个用户必须相互审查和批准彼此的工作才能完成项目。虽然这对于许多任务来说可能不切实际，但对于实施该措施的任务而言，它提供了高度的安全性。\n\
  \n## U\n\n## UDP flood attack\n一种 DoS 攻击，与 ping flood 攻击类似，使用用户数据报协议数据包。\n\n## unauthorized\n\
  任何没有权限访问网络或资产的用户或设备。\n\n## unauthorized access\n个人在没有适当凭证的情况下获得对服务、应用程序、网络或设备的访问权限。\n\
  \n## unicast\n单发送方与单接收方或网络之间的通信。\n\n## unidirectional security gateways\n用于在具有不同安全分类的网络或网络段之间创建单向连接。\n\
  \n## unified threat management (UTM) devices\n安全设备，在单一产品中提供网关、反病毒、防火墙以及入侵预防和检测服务。\n\
  \n## Universal Disk Format (UDF)\n一种开放的、厂商中立的文件系统，用于在各种介质中存储数据。\n\n## Universal\
  \ Plug and Play (UPnP)\n一种零配置网络架构，可在不同品牌和类型的网络硬件之间带来一定的兼容性。虽然主要旨在帮助不熟练的家庭网络用户，但\
  \ UPnP 也得到一些非消费类硬件制造商的支持。\n\n## Universal Serial Bus (USB)\n现代个人计算机上最流行的硬件端口是通用串行总线（USB）端口。这种高速串行接口旨在提供一种快速、灵活的方法，将多达\
  \ 127 个外围设备连接到计算机。\n\n## Unix\nUnix 系列操作系统提供模块化、多任务、多用户操作系统环境，最初开发用于运行在大型机和小型机上。Unix\
  \ 操作系统的专有版本包括几种 BSD（伯克利软件发行版）变体，以及苹果的 OSX 和 iOS 操作系统和谷歌的 Android 操作系统。\n\n## Unix\
  \ File System\n为原始 Unix 操作系统设计的第一个文件结构，至今仍在使用于 Unix 及其衍生系统。该文件系统标准的结构呈现出从主目录即根目录（/）开始的统一树形结构。\n\
  \n## unlocked condition monitoring\n状况监控系统可以记录并发出信号，每当特定门或大门被解锁（授予访问权限）时，指示并记录授予了何种类型的访问权限。\n\
  \n## unmanaged switches\n即插即用（PnP）设备，不包含任何用户配置选项。这些设备往往价格低廉，适用于住宅和小型办公环境。\n\n##\
  \ untagged packet\n数据包头中未插入 VLAN ID 的数据包。\n\n## update\n服务包或补丁，可提高操作系统的可靠性、安全性和吸引力。操作系统更新最可靠的来源是操作系统制造商。某些更新可能使操作系统更方便，但不一定更安全。\n\
  \n## UPnP AV\n通用即插即用 – 音视频。这是为了支持消费类媒体设备而发布的，如电视、家庭音响系统、摄像机和其他数字媒体设备。\n\n## upstream\
  \ interface\n允许流量从客户端向服务器或客户端向互联网方向传输的接口。\n\n## user password\n此 BIOS 选项使管理员能够建立用户在启动过程中必须输入的密码，以完成启动过程并获得对操作系统的访问权限。\n\
  \n## utility files\n允许用户管理系统资源、排除系统故障和配置系统的程序。\n\n## V\n\n## varifocal lens\n包含多个可移动元件的光学组件，可允许改变监控摄像机的有效焦距（EFL）。与变焦镜头不同，可变焦镜头每次改变都需要重新聚焦。如果它具有可变焦镜头，并且可以根据用户的偏好在多个毫米设置下聚焦。\n\
  \n## VBScript\n另一种仅适用于 Microsoft Windows Internet Explorer 的脚本语言。VBScript 与 JavaScript\
  \ 类似，但由于与其他浏览器的兼容性有限，在网站中并不广泛使用。\n\n\n\n\n\n## 视频监控系统\n大多数商业安全系统的重要组成部分。该系统使用摄像头进行预防和恢复。\n\
  \n## 录像机（VCR）\n闭路电视系统传统上使用录像机（VCR）进行录制；此类系统往往劳动密集度很高。\n\n## 虚拟访问控制列表（VACL）\n过滤进入\
  \ VLAN 的流量以及在 VLAN 成员之间移动的流量的访问列表。\n\n## 虚拟局域网（VLAN）\n在数据链路层进行隔离的软件配置网络。\n\n## 虚拟专用网络（VPN）\n\
  远程用户可以通过公共网络（如互联网）连接到专用网络，然后进行身份验证并在专用网络上执行任务，就好像直接连接一样。它使用户能够在公共网络上与另一台设备进行通信，就好像是专用网络一样，确保安全。\n\
  \n## 病毒\n旨在复制并在本地计算机环境中传播的恶意软件程序。这通常发生在用户从互联网下载程序或打开电子邮件附件时。\n\n## VLAN 跳转攻击\n这些攻击也称为交换机欺骗攻击，涉及攻击者向交换机发送动态中继协议（DTP）请求，以将攻击者的端口配置为中继连接。一旦配置完成，此连接会将\
  \ VLAN 中的所有流量路由到攻击者。\n\n## VLAN 管理策略服务器（VMPS）\nVMPS 用于根据 MAC 地址动态分配 VLAN。它基于 Cisco\
  \ VQP 协议进行客户端/服务器交换，并且容易受到攻击，因为它是一种在 UDP 下运行的未经身份验证的协议。\n\n## VLAN 中继协议攻击\n这些攻击针对思科的第二层\
  \ VLAN 中继协议（VTP）。该协议在整个网络中的交换机之间提供自动化的 ISL/802.1Q 中继配置，以便它们可以共享数据包。VTP 的自动化特性默认情况下可访问网络的所有\
  \ VLAN。它可用于向网络添加或删除 VLAN。这使得具有中继端口的交换机容易受到攻击。\n\n## 语音识别\n利用用户的声音和语音模式执行各种操作的应用程序。\n\
  \n## 漏洞\n可能允许攻击者访问网络资产的任何弱点。\n\n## 漏洞模拟器\n用于渗透测试的培训模拟器。\n\n## 漏洞扫描器\n基于数据库的工具，旨在搜索计算机中已知且已添加到数据库的漏洞。它们旨在评估计算机、系统、网络和应用程序。\n\
  \n## W\n\n## web 浏览器\n提供在互联网上检索、呈现和遍历资源的软件应用程序。\n\n## web 代理\n代表访问网络的主机或主机网络访问网络的计算机或服务器。\n\
  \n## web 服务器\n企业使用 web 服务器托管在互联网上宣传其组织的网页。这些是直接与互联网交互的前端服务器。\n\nengineering tactics.\n\

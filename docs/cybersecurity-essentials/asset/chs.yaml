  \ 8.3 中记录您的结果。\n\n如果您还记得之前的操作，test1 被授予了“拒绝 – 写入”权限。\n\n您之前移除了 TestUser2 对 test2\
  \ 的所有权限。未授予或拒绝任何权限；但是，您仍然可以读取、修改和写入此文件。这是为什么？\n\nTestUser2 也是“用户”（Users）组的一部分，该组默认被授予“读取与执行”、“读取”和“写入”权限。如前所述，权限是累积的，结果是“有效权限”。只有在“拒绝”的情况下，“允许”才会被覆盖。\n\

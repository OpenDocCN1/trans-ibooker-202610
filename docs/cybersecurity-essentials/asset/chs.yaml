  ## 总结\n\n记录本章中呈现的风险评估的观察结果。在第 19 章中，您将比较这些最初的想法和观察结果与您在阅读第 12 章至第 18 章后产生的想法和观察结果。您还将能够将您的答案与专业安全专家的答案进行比较。\n\
  \n## 网络基础\n\n*当只有两个智能* 设备连接时，可以使用电缆、光信号或无线电波进行简单的直接连接。互连的设备只需使用相同的数字语言并使用商定的通信控制方法来管理它们之间信息流即可。然而，当多于两个智能数字设备链接在一起时，就会形成网络。当第三个设备添加到系统中时，必须实施额外的控制方法，不仅控制设备之间的对话，还要确保网络上的正确方接收到信息，并且不打算发送给其他方的信息保持私密。在本章中，您将学习：\n\
  \n- 识别常见网络类型的特征\n- 描述 OSI 网络模型不同层的主要功能\n- 讨论 OSI 模型层如何对应于网络数据传输数据包的生成\n- 解释不同 OSI\
  \ 模型层如何适用于网络安全问题\n- 描述标准网络拓扑\n\n## 理解网络基础\n\n在信息技术（IT）领域，存在两种基本类型的网络：\n\n- 存在于相对有限的地理区域的网络被称为局域网（LAN）。\n\
  - 分布在更广地理区域的网络被称为广域网（WAN）。\n\n## OSI 网络模型\n\n网络是复杂、多方面的结构，需要计算机设计师、网络设备设计师、操作系统制造商和网络应用程序提供商之间进行大量交互。已经提出了多个倡议，为这些团体在设计产品时提供模型作为蓝图。虽然您应该知道存在不同的分层网络模型，但最广泛讨论的倡议是由国际标准化组织提出的开放系统互连（OSI）模型。\n\
  \nOSI 模型帮助我们概念化两个联网系统之间数据的处理方式。为此，OSI 模型将数据的工作流程划分为抽象层。虽然这些层在任何意义上都不是字面上的，也不会为产品设计提供任何实际屏障，但这些层确实有助于人们尊重和理解数据管理的流程。\n\
  \nOSI 模型的层如图 12.1 所示。在图中，左侧的每一层都与右侧在其内部运行的一组协议相匹配。如您所见，许多协议在网络架构中发挥作用。\n\n![](img/2459befd842d6fed299fabe6da3512d0_294_0.png)\n\
  \n图 12.1 OSI 网络模型\n\n各层的主要功能在以下各节中进行了总结。\n\n\n\n\n\n## Layer 1: Physical\n\n这一层关注用于传输数据的传输介质。与该层相关的功能包括将数据移至传输介质、提供电信号或光信号、通信端口与介质之间的机械兼容性，以及物理连接的激活和停用。\n\
  \n## Layer 2: Data Link\n\n这一层涉及控制数据如何在通信点之间打包和移动。在这一层，数据被格式化为适合传输的帧。该层级的组件还为帧添加错误检测和纠正功能，以及媒体访问协议和关于向同一网络段上的特定节点传输的特定信息。\n\
  \n## Layer 3: Network\n\n网络层元素负责控制数据包在不同通信节点、网络段或介质类型之间的路由。这包括信号在从一种介质类型传递到另一种介质类型时的复用和解复用、组装和拆卸消息数据包，以及建立、维护和终止连接。\n\
  \n## Layer 4: Transport\n\n传输层组件负责提供有序的端到端数据流，其中包括数据包的排序以及提供基本错误恢复功能和流量控制。\n\n##\
  \ Layer 5: Session\n\n模型这一层专门用于在应用程序之间设置和管理会话，以及提供诸如安全等参数。该层组件进行的活动包括停止和启动数据传输、控制应用程序之间的数据流，以及提供网络故障恢复选项。这一层处理传输安全选项的管理，例如身份验证和隧道协议。\n\
  \n## Layer 6: Presentation\n\n这一层级元素负责控制数据在目的端对用户的外观。该层组件提供的功能包括视觉格式化和呈现数据、处理数据压缩和加密功能，以及会话的启动/停止控制。\n\
  \n## Layer 7: Application\n\nOSI 模型的最高抽象层关注网络对终端用户应用程序数据的处理。电子邮件和网络浏览器等服务是应用层发挥作用的应用示例。在模型这一层，用户\
  \ ID 和密码经过身份验证，并提供用户服务。\n\n## Data Transmission Packets\n\n当数据从一个通信节点移动到另一个通信节点时，与\
  \ OSI 模型每个层相关联的元素都会在消息中添加一个头部，其中包含执行传输所需的信息。技术上，在某些 OSI 层，还会添加一个小尾部以创建信封。但为了讨论方便，我们将重点关注头部。数据可以是数字化文本、数字、语音、视频或任何其他类型的数字化信息。当在发送节点发出移动数据的命令时（例如，通过按电子邮件消息上的发送），打包过程按图\
  \ 12.2 所描述的方式进行。\n\n随着数据包离开应用程序，在其通过不同的 OSI 层前往传输介质的途中，会在消息中添加额外的头部（信息块）。在接收端，整个消息被带入指定的接收节点，其中每个层的头部被检查，适当的头部被移除，并由其对应的层对消息进行处理。\n\
  \n通信过程中涉及的步骤通常在发送消息的用户无需干预的情况下完成。不同的头部和活动是应用程序、物理网络适配器以及中间所有“层”的功能。\n\n![](img/2459befd842d6fed299fabe6da3512d0_297_0.png)\n\
  \nFIGURE 12.2 Building Transmission Packets\n\n## OSI Layer Security\n\n每门网络课程都会从设备、协议和功能在每一层存在的角度来研究\
  \ OSI 模型。然而，不同的网络安全挑战可能存在于每一层。表 12.1 列出了与每一层相关的安全重点。\n\nTABLE 12.1 OSI Layer Security\n\
  \n| OSI LAYER | Network Security Model | Exploit Type | Security Focus |\n|---|---|---|---|\n\
  | 1) Physical Layer | 7) Physical Level | Physical Tampering/ Break-in | Physical\
  \ Security |\n| 2) Data Link Layer | 6) VLAN Level | Network Scanning Local/Internal\
  \ | Access Security |\n| 3) Network Layer | 5) ACL Level | Network Scanning Complete/Internal\
  \ | Domain Security |\n| 4) Transport Layer | 4) Software Level | Software Specific\
  \ Exploits | Port Security |\n| 5) Session Layer | 3) User Level | Social Engineering\
  \ – Users | Authentication/Encryption |\n| 6) Presentation Layer | 2) Administrative\
  \ Level | Social Engineering – Administrators | Authentication |\n| 7) Application\
  \ Layer | 1) IT Department Level | Social Engineering – IT Staff | ID/Authentication\
  \ |\n\n你也可以将前几章中开发的三层安全环应用于 OSI 模型的层。事实上，三层环实际上存在于两个地方——发送设备和接收设备。因此，外围边界在每个设备的物理终止或连接点处建立。设备之间的电缆或无线电波连接它们的外部边界。\n\
  \n外部边界对应于 OSI 模型的第 1 层组件。保护网络中的物理层涉及保护物理介质，以及网络和通信设备。\n\n同样，内部边界与模型第 2 层组件相关。在此层工作的组件代表第一层逻辑防御。在此层，数据可以根据其身份被接受、丢弃或转发。\n\
  \n最后，内部环可以被视为包括第 3 层到第 7 层。这些层中的每一层都提供了防止未经授权移动到更高层的选项。例如，与防火墙相关的端口阻止机制在第 4 层工作。\n\
  \n然而，第 7 层组件代表网络攻击最期望的目标。针对这一层的攻击旨在控制物理资产或破坏软件应用程序的运行。\n\n在第三部分中，你将了解不同网络组件的运行、它们在\
  \ OSI 架构中的位置，以及它们相关的安全漏洞和补救措施。\n\n## Network Topologies\n\n网络拓扑是第 1 层物理（或逻辑）连接策略，分为四种基本配置，如图\
  \ 12.3 所示。\n\n- Bus\n- Ring\n- Star\n- Mesh\n\n![](img/2459befd842d6fed299fabe6da3512d0_299_0.png)\n\
  \n### Bus Topology\n\n在总线拓扑中，网络的*节点*或站点连接到中央通信链路。每个节点在总线上有唯一的地址，使其与其他网络用户区分开来。任何节点都可以将信息放置在总线上。信息必须包含信息所针对的节点或节点的网络地址。连接到总线的其他节点将忽略该信息。\n\
  \n### Ring Topology\n\n在环形网络配置中，通信总线形成闭合环路。每个节点检查网络上经过的信息。\n\n内置于每个节点网络适配器中的中继器将再生每个未发往自己的消息并将其发送到下一个指定节点。源节点最终会收到消息并将其从环中移除。\n\
  \n环形拓扑往往提供非常高的数据传输速率，但需要额外的管理开销。需要额外的管理来确保可靠性。如果环形网络中的一个节点失效，整个网络就会失效。为克服这一点，环形设计者开发了具有主次数据路径的环，如图\
  \ 12.4 所示。如果主链路发生中断，网络控制器可以将数据重新路由到次级链路以避免中断。\n\n![](img/2459befd842d6fed299fabe6da3512d0_300_0.png)\n\
  \nFIGURE 12.4 Primary/Secondary Ring Topologies\n\n### Star Topology\n\n在星型拓扑中，网络的逻辑布局类似于树的分支。所有节点都通过分支连接到中央单元，分支最终通向中央单元。节点通过中央单元相互通信。\n\
  \n中央站通过轮询节点一个接一个来协调网络的活动，以确定它们是否有信息要传输。如果有，中央站会给该节点一个预定的时间片进行传输。如果消息传输时间超过分配的时间，消息将被切成小的信息包，在几次轮询周期中传输。\n\
  \n\n\n\n\n## 网状拓扑\n\n网状网络设计提供了最基本的网络连接方案和最广泛的管理方案。在这种拓扑中，每个节点都与网络中的所有其他节点有直接的物理连接。网状拓扑被用于两个非常大的网络环境——公共电话系统和互联网，以及小型无线微微网通信网络，其中包括蓝牙和\
  \ ZigBee 网络。\n\n微微网是为在同一信道上通信而分组在一起的设备的小型、短距离网络。其中一个设备作为主设备或协调器运行，而其他设备作为从设备运行。主设备的角色可以在网络中循环，不同的设备在该角色可用时承担该角色。\n\
  \n## 逻辑拓扑\n\n如果节点只是简单地相互连接，那么可视化前面描述的物理拓扑的连接就很容易了。然而，在大多数网络配置中通常并非如此。这是因为大多数网络采用了集线器、交换机和路由器等连接设备，这些设备改变了实际连接方案的外观。因此，逻辑拓扑不会与物理拓扑的外观相匹配——连接方案的细节隐藏在连接设备内部。\n\
  \n作为说明，图 12.5 显示了使用连接设备将连接集中在单个位置的典型网络连接方案。物理拓扑看起来像星型。然而，连接路由器的内部布线提供了逻辑总线拓扑。以物理星型拓扑实现逻辑环形或网状拓扑的情况并不少见。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_301_0.png)\n\n**图 12.5** 逻辑拓扑\n\n与 SSL\
  \ 不同，IPsec 在 OSI 模型中运行于第 3 层并保护网络中的所有内容。IPsec 与 SSL 的不同之处还在于它是在客户端系统上实现的，而 SSL 则内置于浏览器中。所有这些结合起来为传输数据提供了更安全的环境，通常速度更快。IPsec\
  \ 有两种模式：\n\n- ► 传输模式 – 仅封装 IP 有效载荷。\n- ► 隧道模式 – 整个 IP 数据包都被封装。\n\n连接安全包括在通信前对两台计算机进行身份验证，然后确保它们之间的保密性。Windows\
  \ 采用 IPsec 来实现连接安全。\n\n## 步骤\n\n在本步骤中，您将发现 IPsec 的配置位置和方式。您将创建一个新的连接安全规则，并探索与 IPsec\
  \ 相关的选项。本步骤旨在指导您如何创建 IPsec 通信；但是，在此环境中您将无法对其进行测试。\n\n## 访问 IPsec\n\nIPsec 位于 Windows\
  \ 防火墙高级安全中。它已被重命名为连接安全；然而，通常认为连接安全是通过使用 IPsec 规则实现的。\n\n- 1. 打开您的机器。\n- 2. 使用您的管理员账户登录\
  \ Windows。\n- 3. 在桌面上，在任务栏中嵌入的搜索栏中，输入 wf.msc 并按 Enter。\n- 4. 这应该启动 Windows 防火墙高级安全。\n\
  - 5. 单击连接安全规则条目，如图 12.6 所示。中间窗格应没有当前建立的规则。\n- 6. 展开监控，然后通过选择每个旁边的箭头展开安全关联，如图 12.7\
  \ 所示。\n\n![](img/2459befd842d6fed299fabe6da3512d0_304_0.png)\n\n**图 12.6** Windows\
  \ 防火墙高级安全\n\n![](img/2459befd842d6fed299fabe6da3512d0_304_1.png)\n\n**图 12.7** 展开的监控和安全关联项\n\
  \n5. 阅读每个的定义并选择请求对入站和出站连接进行身份验证，如图 12.9 所示。\n\n![](img/2459befd842d6fed299fabe6da3512d0_307_0.png)\n\
  \n图 12.9 新建连接安全规则向导 – 要求窗口\n\n6. 单击下一步以查看身份验证方法窗口。\n尽管列出了四个选项，但涉及 Kerberos V5 的两个选项仅限于在\
  \ Active Directory 森林内进行的连接。\n\n7. 选择旁边的高级单选按钮以使自定义按钮可用，如图 12.10 所示。\n\n8. 单击自定义按钮以启动单独的自定义高级身份验证方法窗口，如图\
  \ 12.11 所示。\n\n![](img/2459befd842d6fed299fabe6da3512d0_308_0.png)\n\n图 12.10 自定义按钮处于活动状态。\n\
  \n在此窗口中，您可以自定义身份验证方法列表以满足您的需求。仔细探索该窗口。\n\n9. 单击第一个身份验证方法下的添加按钮：添加第一个身份验证方法窗口将出现，如图\
  \ 12.12 所示。\n\n# 图 12.11 自定义高级身份验证方法窗口\n\n# 图 12.12 添加第一个身份验证方法窗口\n\n此添加第一个身份验证方法窗口提供四个可供选择的身份验证方法：\n\
  \n- - Kerberos V5\n- - NTLMv2\n- - 证书\n- - 预共享密钥（不推荐）\n\n10. 探索选项后，单击取消退出窗口。同样在自定义高级身份验证方法窗口中单击取消。\n\
  \n11. 您应该返回到新建连接安全规则向导 – 身份验证方法窗口。选择默认旁边的单选按钮，然后单击下一步。您将被引导至配置文件窗口。\n\n这些选择与计算机上存在的网络连接有关。虽然网络办公室中的独立计算机可能不需要担心使用公共网络，但旅行用的笔记本电脑需要确保通过互联网的完整性和保密性。\n\
  \n12. 保持全部三个复选框选中，如图 12.13 所示，然后单击下一步移动到名称窗口。\n\n13. 在名称下输入 Request IPsec Rule。保持描述（可选）：空白，如图\
  \ 12.14 所示。\n\n14. 单击完成以保存规则。您将被带回 Windows 防火墙高级安全窗口。新的规则现在位于中间窗格中，如图 12.15 所示。\n\
  \n注意右侧窗格。操作面板已更改，可用选项更多。\n\n要创建 IPsec 连接，另一台计算机将使用相同流程配置连接安全规则。只要计算机想要传输信息，就需要完成\
  \ IPsec 连接。\n\n# 图 12.13 新建连接安全规则向导 – 配置文件窗口\n\n请记住，您选择了请求身份验证，不需要选项。因此，您仍然可以连接到其他任何人而无需安全连接。\n\
  \n- 15. 选择中间窗格中的规则以突出显示它。在右侧窗格中，单击属性条目，如图 12.16 所示。\n\n每个选项卡都允许您调整在新建连接安全规则向导中选择的设置。\n\
  \n- 16. 探索每个选项卡，然后单击取消按钮退出属性窗口。\n\n![](img/2459befd842d6fed299fabe6da3512d0_311_0.png)\n\
  \n- - 封装安全有效载荷（ESP）提供源身份验证以及加密。ESP 将整个 TCP/UDP 数据报加密并封装在不包含任何端口信息的 ESP 头中。这意味着 ESP\
  \ 将无法通过任何使用端口地址转换（PAT）的设备。\n- - 安全关联（SAs）提供用于身份验证和密钥交换的多种算法和框架。\n- - 互联网密钥交换（IKE）是用于在\
  \ IPsec 中设置安全关联的协议。\n\n- 2. 与 SSL 不同，IPsec 在 OSI 模型中运行于第 3 层并保护网络中的所有内容。IPsec 与\
  \ SSL 的不同之处还在于它是在客户端系统上实现的，而 SSL 则内置于浏览器中。所有这些结合起来为传输数据提供了更安全的环境——通常速度更快。选项包括：\n\
  \  - 请求身份验证，但不要求。\n  - 要求对入站和出站进行身份验证。\n  - 要求入站，请求出站。这是前面选项的混合。\n\n- 3. IPsec 标准使用一套协议来实现其保护数据的目标。AH\
  \ 提供完整性，而 ESP 同时提供完整性和保密性。\n  - 完整性 – 确认数据包未被篡改。防止中间人攻击。\n  - 保密性 – 确认数据包无法被恶意用户查看。\n\
  \  - 防止网络嗅探器查看数据。\n\n4. 连接安全在通信前对两台计算机进行身份验证，然后确保它们之间的保密性。Windows 采用 IPsec 来实现连接安全。\n\
  \n\n\n\n\n## 理解网络协议\n\n*当通信路径中涉及*两个以上的计算机时，就会形成网络，并且必须采取额外的控制措施，以确保信息被发送到网络的正确成员。这是在控制网络连接上的信息流之外进行的。这些控制被实现为一组称为*协议*的规则。在本章中，你将学习如何：\n\
  \n- 讨论基本的网络协议\n- 识别与不同 IP 地址标准相关联的组件\n- 讨论与 MAC 地址相关的安全问题\n- 识别 TCP/IP 协议套件的组件和操作，并识别其漏洞\n\
  - 提供网络子网划分的示例及其用途\n- 描述以太网网络标准的函数和结构\n- 对比点对点和客户端/服务器网络访问控制方法\n\n## 网络协议的基础\n\n\
  *网络协议*是一组规则，规定网络中如何进行通信。为了使设备能够在网络上相互通信，它们必须全部使用相同的网络协议。\n\n在复杂的网络中，例如互联网，为了处理由托管如此多不同类型的设备和应用程序而产生的复杂层级，会采用多层协议。参考第\
  \ 12 章中的图 12.1，你可以看到不同类型的协议驻留在 OSI 模型从第 1 层到第 5 层的每个层级中。\n\n例如，在第 1 层和第 2 层中，不同类型的通信介质（有线网络、无线网络、光纤网络）有不同的协议。第\
  \ 1 层组件提供物理介质标准，而第 2 层提供逻辑传输标准化。第 3 层和第 4 层包含不同的网络路由方案（以确保一切到达应去的地方）、电子邮件处理应用程序、Web\
  \ 应用程序和安全传输。\n\n## MAC 地址\n\n所有网络操作都依赖于地址层次结构，以便使网络的设备能够交换信息。网络操作中最基本的地址是媒体访问控制地址（MAC\
  \ 地址），它作为连接到网络的每个设备的唯一标识符。这些地址通常由设备制造商分配并存储在其固件中。\n\n生成 MAC 地址的标准 48 位格式指定六对十六进制数字。出于显示目的，该数字写成六个数对，用连字符（-）或冒号（:）分隔——例如，\n\
  \n```\n13:A2:00:40:6B:8E:66\n```\n\n在 IEEE 术语中，这种原始的 48 位格式称为 EUI-48（扩展唯一标识符）。该格式对应于网络的原始以太网\
  \ IPv4 地址方案，并用于无线 802.11 和蓝牙网络技术。\n\nMAC 地址代码的 EUI-64 位版本将代码扩大到八对十六进制数字。例如，一个给定设备可以被分配\
  \ MAC 地址 = 00:13:A2:00:40:6B:8E:66。该格式对应于 IPv6 地址方案，并包含在 Firewire、ZigBee 和 802.15\
  \ 技术中。\n\n正如你从第 12 章中的表 12.1 回忆的那样，MAC 地址与 OSI 第 2 层操作相关联。请记住，该层负责建立到每个网络端口的逻辑访问和连接。不同的网络连接设备，例如交换机和路由器，依赖于\
  \ MAC 地址作为构建和使用内部内容可寻址内存（CAM）表的基础。设备使用这些表来路由它们从一个网络段接收到的消息，将其路由到另一个网络段上的位置，具体取决于预期接收方连接到的硬件端口。\n\
  \n许多连接设备通过 MAC 学习和发现过程构建和维护其 CAM 表。当它们与连接到其物理端口的设备交互时，它们读取消息头以获取发送和接收设备的 MAC 地址，并连同其端口信息一起记录在\
  \ CAM 中。\n\n## TCP/IP\n\n虽然世界各地使用着许多不同类型的网络协议，但 TCP/IP（传输控制协议/互联网协议）协议套件构成了目前使用最广泛的网络协议。虽然这部分是由于互联网基于它，但\
  \ TCP/IP 因大多数操作系统都支持该协议而巩固了其作为企业网络首选协议的地位。它也可以用于任何拓扑结构（例如，以太网、令牌环等）。\n\n当你尝试将不同类型的系统相互联网时（例如，Microsoft\
  \ Windows 计算机和设备、Apple 计算机和设备以及 Linux 计算机和设备），这一事实变得非常有用。此外，TCP/IP 是一种可路由协议，因此其数据包可以在到达最终目的地之前在许多不同类型的网络上传输。\n\
  \n美国国防部最初开发 TCP/IP 协议作为一种抗黑客、防篡改且安全的跨网络传输数据的协议。它被认为是最安全的网络协议之一。此外，由于美国政府开发了它，因此没有人真正拥有\
  \ TCP/IP 协议，因此它被采纳为互联网的传输标准。\n\n无论使用何种类型的计算机平台或软件，信息都必须以 TCP/IP 数据包的形式在互联网上传输。该协议要求将数据分组为称为*网络数据包*的捆绑包。TCP/IP\
  \ 数据包主要设计用于允许消息分片和重组。它通过两个头部字段存在，即 IP 头部和 TCP 头部，其后是数据字段，如图 13.1 所示。\n\n![](img/2459befd842d6fed299fabe6da3512d0_319_0.png)\n\
  \n# 图 13.1 TCP/IP 数据包\n\nTCP/IP 协议的主要部分建立在赋予其名称的两个核心协议之上：TCP 和 IP。TCP/IP 协议的 IP\
  \ 部分在 OSI 模型的第 3 层运行，而组合协议标准的 TCP 部分在第 4 层运行。因此，IP 部分负责数据包及其实际交付，而 TCP 负责跟踪消息被分割成的各个段。\n\
  \n层之间的概念划分不应被视为精确。例如，协议互联网控制消息协议（ICMP）驻留在第 3 层，尽管它不提供数据包路由或寻址信息，因为它有助于第 3 层 IP 完成其工作。另一方面，作为另一个例子，桥接控制协议（BCP）是一种路由协议，但由第\
  \ 4 层的 TCP 承载。\n\n另一个需要了解的重要元素是 TCP/IP 协议如何建立连接。这是通过三向握手安排完成的，首先客户端向服务器发送一个同步（SYN）数据包。作为响应，服务器向客户端发送回一个同步/确认（SYN/ACK）数据包。在收到\
  \ SYN/ACK 数据包后，客户端向服务器返回一个确认（ACK）数据包，然后它们之间的对话就可以开始。图 13.2 说明了 SYN/ACK 序列。\n\n![](img/2459befd842d6fed299fabe6da3512d0_320_0.png)\n\
  \n图 13.2 SYN/ACK 序列\n\n## TCP/IP 漏洞\n\n由于 TCP/IP 数据包由许多不同的部分和字段组成，攻击者经常利用数据包的构成。借助适当的工具，操纵\
  \ TCP/IP 数据包的 IP 头部以伪造地址来隐藏攻击者身份是相当容易的。在操纵源和/或目标网络地址的情况下，这种操纵过程被称为 IP 欺骗，是许多类型网络和互连网络攻击的基础。IP\
  \ 欺骗背后的想法类似于 MAC 欺骗，后者在本书本章的前一节中进行了讨论。\n\n针对 TCP/IP 数据包的另一种常见攻击方法是 SYN 洪水攻击，它利用了\
  \ TCP/IP 用于在网络节点之间建立连接的三向握手。在这种类型的攻击中，攻击者向服务器发送 SYN 请求，但操纵握手以在 SYN 数据包中伪造不同的 IP\
  \ 地址，或简单地扣留 ACK 数据包不发给服务器。\n\n在第一种情况下，服务器会向被伪造的地址发送 SYN/ACK 数据包，该地址不会响应，因为它没有发送原始\
  \ SYN 数据包。在这两种情况下，服务器未收到 ACK 数据包这一事实导致其\n\n\n\n等待一段时间。攻击者通常会向服务器发送一波 SYN 请求，使其填满半开连接，从而占用其资源。\n\
  \n当服务器处理这些请求的能力达到上限时，由于资源不足以处理该流量，它将停止提供服务。这被称为 *拒绝服务攻击 (DoS attack)*。\n\n与 TCP/IP\
  \ 操作相关的工具、攻击和预防方法将在本章后面结合服务 OSI 模型第 2、3 和 4 层的网络服务器和连接设备进行详细讨论。\n\n## IP 地址\n\n\
  互联网服务提供商 (ISPs) 向其客户提供的互联网访问地址块称为互联网协议地址，或 *IP 地址*。IP 地址使每个系统成为网络中可达的成员。这就是识别单个用户以接收文件传输、电子邮件和文件请求的方式。目前使用两种版本的\
  \ IP 地址：IPv4 和 IPv6。IPv4 是通常被引用的互联网协议版本，因为其使用广泛。\n\n### IPv4 地址\n\nIPv4 地址以 XXX.YYY.ZZZ.AAA\
  \ 的数字格式存在。每个地址由四个 8 位字段组成，用点分隔 (.)。这种指定地址的格式称为点分十进制表示法。十进制数字源自硬件所理解的二进制地址。例如，二进制网络地址为：\n\
  \n```\n10000111.10001011.01001001.00110110 (binary)\n```\n\n对应于：\n\n```\n135.139.073.054\
  \ (dotted decimal)\n```\n\n你还会发现 IP 地址以 *八位组* 的形式提及。*八位组* 只是八个连续位的分组。在刚才给出的二进制示例中，最重要的八位组为\
  \ 10000111 (或 135)。最不重要的八位组为 00110110 (或 054)。整个地址出现在四个八位组字段中，如前例所示。\n\n在四个八位组内，每个\
  \ IP 地址由两部分组成：网络地址和主机地址。网络地址标识整个网络；主机地址标识网络内的单个成员。用于局域网的三种标准 IP 地址类别为：A 类、B 类和 C\
  \ 类：\n\n- A 类地址保留给大型网络，使用地址的最后 24 位（最后三个八位组或字段）作为主机地址。第一个八位组始终以 0 开头，后跟 7 位数字。因此，有效的\
  \ A 类地址范围在 `001.x.x.x` 到 `126.x.x.x` 之间。这允许一个 A 类网络支持 126 个不同的网络，每个网络近 1700 万个主机（节点）。\n\
  - B 类地址分配给中型网络。前两个八位组可在 `128.x.x.x` 到 `191.255.0.0` 之间变化。最后两个八位组包含主机地址。这使得 B 类网络可包含多达\
  \ 16,384 个不同的网络，每个网络约有 65,534 个主机。\n- C 类地址通常用于较小的局域网。在 C 类地址中，仅最后一个八位组用于主机地址。前三个八位组可在\
  \ `192.x.x.x` 到 `223.255.255.0` 之间变化。因此，C 类地址可支持约两百万个网络，每个网络 254 个主机。\n\n### 子网\n\
  \n网络的各部分可以分组为子网，这些子网共享一个 IP 地址范围。会部署一个保护网关作为分段子网的入口和出口点。这些组被称为 *内联网*。内联网要求每个段都必须有一个保护网关作为该段的入口和出口点。在大多数情况下，网关是称为\
  \ *路由器* 或 *交换机* 的设备。路由器是一种智能设备，接收数据并将其定向到指定的 IP 地址。第 2 层交换机也是一种智能设备，但它将数据定向到指定的\
  \ MAC 地址。\n\n一些网络采用防火墙作为对外网关。防火墙是硬件和软件组件的组合，为不同安全级别的网络之间提供保护屏障。管理员配置防火墙，使其仅将数据传递到和来自指定的\
  \ IP 地址和 TCP/IP 端口。\n\n子网是通过 *屏蔽*（隐藏）子网内各单元的 IP 地址的网络地址部分而创建的。这实际上限制了数据的移动性，仅限于子网内的节点，因为它们只能识别其屏蔽范围内的地址。该概念在图\
  \ 13.3 中有所说明。创建子网的三个常见原因如下：\n\n- 将网络的一个段与所有其他段隔离。\n\n  例如，假设一个大型组织有 1,000 台计算机，所有计算机都连接到网络。没有分段，来自全部\
  \ 1,000 台设备的数据将流经每个其他网络节点。其效果是网络中的每个人都可以访问网络上的所有数据，并且网络运行会因不受控制的流量而显著变慢。\n\n- 高效使用\
  \ IP 地址。\n\n  由于 IP 地址方案定义为 32 位代码，因此只有一定数量的可能地址。虽然 126 个网络、每个网络 1700 万客户似乎很多，但在全球网络系统的范围内，这并不是很多地址。\n\
  \n- 在物理分隔的位置利用单个 IP 地址。\n\n  例如，在校园的远程区域之间对 C 类地址进行子网划分，将允许将 253 个可能地址的一半分配给一个校园位置，另一半分配给第二个位置的主机。这样，两个位置都可以使用单个\
  \ C 类地址运行。\n\n子网是通过输入数字来阻止每个 IP 地址八位组相关的任何或全部地址而建立的。例如，子网掩码值为 255 会阻止整个八位组，而值为 254\
  \ 则会阻止该八位组中除一个之外的所有地址。\n\nA 类 IP 地址的默认子网掩码为 255.0.0.0，而 B 类 IP 地址通常使用 255.255.0.0\
  \ 的子网掩码。对于通常在小型组织和住宅网络中使用的 C 类地址，通常使用 255.255.255.0 的子网掩码。这会阻止前三个八位组（地址的网络部分），并将最后一个八位组的地址留给主机使用。当你在\
  \ Windows 中输入 IP 地址时，该类 IP 地址的默认子网掩码值会自动填入。\n\n### IPv6 地址\n\nIPv6 是一种较新的 IP 地址协议，旨在应对可用\
  \ IPv4 地址不足以容纳当今可联网设备的状况。在 IPv6 下，IP 地址已扩展到 128 位，以容纳庞大的 IP 地址数量。IPv6 还提供了对数据包发送者的身份验证以及对数据包内容加密。自\
  \ Windows Vista、Windows 7 以及更早的 Linux 发行版以来，操作系统中已包含对 IPv6 的支持多年。业界预计新版 IP 将支持手机、汽车电脑以及各种其他基于\
  \ IP 的个人设备。\n\n128 位的 IPv6 地址方案将可用 IP 地址总数从 2³²（4,294,967,296）个 IPv4 地址提升到 2¹²⁸\
  \ 或 3.4 × 10³⁸ 个 IPv6 地址。当然，128 位对应于十六个八位组或八个十六进制（基数 16）字段。IPv6 地址通常以十六进制数字书写，用冒号分隔，如图所示：\n\
  \n```\n2001:0db8:00a7:0051:4dc1:635b:0000:2ffe\n```\n\n由四个零组成的组可以用双冒号 (::) 表示。然而，一个地址中不允许出现多个双冒号。\n\
  \n```\n2001:0db8:00a7:0051:4dc1:635b::2ffe\n```\n\n此外，通常会删除数字中的前导或最高有效零，以使地址更易管理：\n\
  \n```\n2001:db8:a7:51:4dc1:635b:0:2ffe\n```\n\n在 URL 中使用时，IPv6 地址必须用方括号括起来：\n\n\
  ```\nhttp://[2001:0db8:00a7:0051:4dc1:635b:0000:2ffe]\n```\n\n与 IPv4 一样，IPv6 地址包含两条信息：网络数量和这些网络内可用的主机地址数量。IPv6\
  \ 中地址网络部分的等价物称为路由前缀或简单地称为网络地址，而主机部分则称为接口标识符。\n\n地址的路由部分通常被视为外部管理的变量，而地址的主机段则在路由地址范围内使用地址空间进行本地管理。在\
  \ IPv6 下，接口标识符的最小大小为 64 位。\n\n\n\n\n因此，在提及 IPv6 地址的网络部分时，连续地址块中的第一个地址将以地址的网络部分开头，后跟一串全零：\n\
  \n```\n2001: db8: a7:0000:0000:0000:0000:0000\n```\n\n并以网络地址加上一串“f”（代表 1111₂ 或 15₁₀）结尾：\n\
  \n```\n2001: db8: a7: ffff:ffff:ffff:ffff:ffff\n```\n\n同样常见的是看到以 CIDR 表示法书写的 IPv6\
  \ 地址范围。在 IPv6 下，该系统使用地址的路由前缀部分，后跟斜杠（/）字符和一个十进制数字，该数字表示前缀保留的位数。将此规则应用于刚才描述的地址块，可产生以下表示法：\n\
  \n```\n2001:0db8:00a7::/48\n```\n\n/48 的值是通过取路由前缀占用的位数（12）并乘以每个十六进制位所需的 4 个二进制位计算得出的。\n\
  \n## 关于前导零的说明\n\n在此示例中恢复了前导零以便于计算。在真实的 CIDR 地址中通常不会保留这些零。\n\nIPv6 传输数据包格式与 IPv4\
  \ 数据包不同。因此，两者不可互换（IPv4 设备与 IPv6 设备不直接兼容）。较新的计算设备和网络设备具备 IPv6 就绪检测和连接能力。\n\n虽然 IPv4\
  \ 和 IPv6 网络都可以划分为子网，但 IPv6 中没有与子网掩码等效的术语。\n\n## 私有 IP 类别\n\n由于互联网本质上是一个巨大的 TCP/IP\
  \ 网络，其中连接到它的任何两台设备都不能拥有相同的地址，如果公司为每台系统都使用互联网可路由地址，那么世界早在很多年前就会耗尽 IP 地址方案。\n\n相反，只要私有网络不需要在互联网上可路由，它就可以使用特殊的\
  \ IP 寻址方案。这被称为私有网络。在配置私有网络时，你必须设计一个在整个网络中使用的 IP 寻址方案。虽然从技术上讲，你可以在私有网络中使用任何你想要的 IP\
  \ 寻址方案而无需咨询 ISP，但仍然存在这样的风险：任何意外的互联网连接都会让私有网络流量继续向外传播到互联网上。\n\n为了解决这个问题，每个 IP 类别中都保留了一些特殊的网络地址范围，用于私有网络。这是根据\
  \ RFC 1918 规定的。这些保留地址未在互联网上注册给任何人，更重要的是，使用这些私有范围的流量无法公开路由。这意味着所有管理互联网流量的路由器都会拒绝转发使用这些私有寻址的网络流量。\n\
  \n如果你正在配置私有网络，应使用这些地址选项之一，而不是随意创建寻址方案。网络上的客户端总数通常决定了应使用哪个 IP 寻址类别。以下私有网络 IP 地址列表可供使用：\n\
  \n-   一个 `10.0.0.0` 的 IP 地址，子网掩码为 `255.0.0.0`\n-   一个 `169.254.0.0` 的 IP 地址，子网掩码为\
  \ `255.255.255.0`（Microsoft AIPA 默认值）\n-   一个 `172.(16-32).0.0` 的 IP 地址，子网掩码为 `255.240.0.0`\n\
  -   一个 `192.168.0.0` 的 IP 地址，子网掩码为 `255.255.0.0`\n\n## 关于地址范围的说明\n\n> 在 IPv4 下，`127.x.x.x`\
  \ 地址范围是保留用于测试网络系统的特殊地址块。美国政府拥有其中一些地址用于测试互联网骨干网。`127.0.0.1` 地址保留用于测试本地系统上的总线。\n\n\
  此外，请记住，当你建立私有 IP 寻址方案时，所有主机必须具有相同的网络 ID 和子网掩码，并且网络上的任何两台计算机都不能具有相同的 IP 地址。\n\n##\
  \ 以太网\n\n虽然 TCP/IP 协议已成为主导的数据封装和传输方法，但以太网标准系列已成为硬件和电气信号接口以及提供介质访问控制的主导力量。最初的以太网标准规范由施乐公司于\
  \ 1976 年开发，并由国际电气和电子协会（IEEE）作为 IEEE-802.3 以太网协议发布。\n\n局域网的设计使得整个网络在一个频率上同步运行。因此，在任一时刻只能有一组电子信号放在网络上。然而，数据可以在网络位置之间双向移动。根据定义，这使得局域网操作本质上是半双工的（也就是说，信息可以双向传输，但不能同时进行）。\n\
  \n在这样的网络中，必须使用某种方法来确定哪个节点可以使用网络的通信路径，以及可以使用多长时间。网络的访问协议处理这些功能，并且必须防止多个用户在任何给定时间访问总线。如果两组数据同时放在网络上，就会发生数据冲突，数据就会丢失。\n\
  \n以太网访问控制方法被称为带冲突检测的载波侦听多址访问（CSMA/CD）。使用该协议，想要通过网络传输数据的节点首先侦听局域网以确定其是否正在使用。如果局域网未被使用，该节点开始传输其数据。如果网络繁忙，该节点等待预定的时间让局域网空闲，然后接管网络介质。\n\
  \n如果两个节点都在等待使用局域网，它们会周期性地同时尝试访问局域网。发生这种情况时，会产生数据冲突，两个节点的数据都会变得无用。以太网控制器的接收部分监视传输以检测冲突。当它感知到数据位重叠时，它会像另一个节点一样停止传输。发送控制器生成一个中止模式代码，该代码被传输到局域网上的所有节点，告知它们发生了冲突。这会提醒任何可能正在等待访问局域网的节点存在问题。\n\
  \n接收节点（或多个节点）会丢弃在冲突发生前接收到的任何数据。其他等待发送数据的节点会生成一个随机定时数字并进入等待模式。定时数字是节点在尝试传输之前等待的时间。由于该数字是随机生成的，因此两个节点同时再次尝试传输的可能性非常低。\n\
  \n第一个超时的节点侦听网络以确定是否仍有活动在进行。由于它几乎总是发现局域网空闲，它便开始传输。如果两个节点确实同时超时，则会发生另一次冲突，中止模式/数字生成/超时序列将重新开始。最终，其中一个节点将获得网络的明确访问权并成功传输其数据。\n\
  \n虽然以太网策略允许多达 1024 个用户共享局域网，但从其冲突恢复技术的描述中可以看出，以太网局域网上的用户越多，发生冲突的可能性就越大，完成实际数据传输的平均时间也会更长。\n\
  \n### 以太网帧\n\n在以太网标准下，信息被收集到一个称为*帧*的数据包中。图 13.4 描绘了一个典型的以太网帧。该帧携带以下六个信息部分：\n\n-\
  \   前导码\n-   目标地址\n-   源地址\n-   类型字段\n-   数据字段\n-   帧校验错误检测与纠正信息\n\n![](img/2459befd842d6fed299fabe6da3512d0_329_0.png)\n\
  \n**图 13.4** 典型以太网帧\n\n从图中可以看出，以太网帧将许多可能需要在网络中导航的信息汇集在一起。特别是，它将源和目标 MAC 地址（本章前面已讨论）以及\
  \ IP 数据包头和数据处理在一起。\n\n\n\n\n此外，以太网帧还增加了一个错误检测和纠正部分，使目的地的接收方能够检查所接收内容的正确性。如果不正确，通信系统将向原始地址生成一条消息，以重新发送损坏的帧。\n\
  \n## 以太网拓扑\n\n以太网协议被归类为总线拓扑，已在多种不同的网络介质上实现，包括：\n\n- 同轴电缆（IEEE 802.3 – 10BASE-2 或\
  \ -5）\n- 双绞铜缆（IEEE 802.3 – 10/100/1000BASE-T）\n- 光缆（IEEE 802.3 – 10/100/1000BASE-Fx、Lx\
  \ 或 Sx）\n- 无线射频（IEEE 802.11a-h）\n\n在给定的公用事业发电和配电网络中，所有这些拓扑都可能出现。因此，电力技术人员需要熟悉有线和无线\
  \ IP 网络设备与策略，以及光纤和无线电通信系统。\n\n## 网络控制策略\n\n当你开始将计算机和设备连接在一起，以便它们能够共享资源和数据时，谁将控制网络（以及如何控制）的问题很快就会浮现。在某些应用中，例如编写这样一本书，作者、美术人员和排版人员能够共享文本和图形文件的访问权限，以及打印机等设备的访问权限，是很有好处的。然而，在商业网络中，公司必须控制谁能访问敏感信息和公司资源，以及他们应该在何时拥有多少访问权限。\n\
  \n网络的控制可以通过两种方式实现：\n\n- 作为对等网络，其中每台计算机以环形或总线方式连接到网络，并与网络上的其他单元平等。\n- 作为客户端/服务器网络，其中被称为客户端的依赖工作站与称为服务器的专用主计算机协同运行。\n\
  \n图 13.5 展示了典型的对等网络布局。在这种布局中，连接到网络的用户可以共享对不同网络资源（如硬盘和打印机）的访问。在对等网络中，本地单元的控制是相当自主的。这种网络配置中的节点通常包含本地硬盘和打印机，由本地计算机控制。这些资源可以由各个用户自行决定是否共享。对等网络的一个常见定义是：所有节点在不同条件下既可以充当其他节点的客户端，也可以充当其他节点的服务器。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_331_0.png)\n\n## 图 13.5 对等网络\n\n图 13.6\
  \ 描绘了典型的客户端/服务器局域网配置。在这类局域网中，控制往往非常集中。服务器通常保存其客户端计算机的程序和数据。它还提供安全性和网络策略执行。\n\n客户端/服务器网络布局的主要优点包括：\n\
  \n- 集中管理\n- 数据和资源安全\n- 网络服务\n\n完成后，IPCONFIG /all 命令将列出所有当前网络参数。\n\nARP 命令会将网络主机的\
  \ IP 地址映射到 NIC 的 MAC 地址。\n\n接下来，NETSTAT 命令将用于识别当前网络连接，NBTSTAT 命令将有助于解析网络上连接的其他节点的\
  \ Windows 计算机名称。\n\nNET VIEW 命令将列出局域网上的节点。\n\nTRACERT 命令将用于测试到远程主机的数据包路由，并检查数据包在各跃点之间传输所需的时间。\n\
  \n最后，PING 命令将用于测试网络节点的响应能力。\n\n请记住，这些实用程序运行时实际显示的信息会因特定的网络配置而大不相同。此处提供的示例不会与真实结果完全一致。\n\
  \n## 操作步骤\n\n## 修改命令提示符窗口\n\n修改命令提示符窗口以提高可见性。\n\n- 1. 将电脑启动到 Windows 10 桌面。\n- 2.\
  \ 在任务栏上的搜索框中，输入单词 command，如图 13.7 所示。\n- 3. 右键单击“命令提示符”选项，然后选择“固定到任务栏”，以便直接在任务栏上为其创建快捷方式。\n\
  - 4. 单击刚创建的“命令提示符”快捷方式，打开“命令提示符”窗口。\n- 5. 在“命令提示符”窗口顶部的空白区域中，右键单击，然后从出现的菜单中选择“属性”。\n\
  \n您要更改的第一个选项是字体大小。具体而言，您需要将字体大小更改为观看舒适且不超过电脑所使用显示器能力的尺寸。\n\n- 6. 选择“字体”选项卡，并将字体类型更改为\
  \ Lucidia Console。\n- 7. 单击“粗体字体”复选框，在“字体”列表下方的框中创建复选标记。您的“字体”选项卡应类似于图 13.8。\n\n\
  ![](img/2459befd842d6fed299fabe6da3512d0_334_0.png)\n\n## 图 13.7 访问命令提示符\n\n![](img/2459befd842d6fed299fabe6da3512d0_334_1.png)\n\
  \n## 图 13.8 更改命令提示符字体类型和大小\n\n## 更改颜色选项\n\n更改颜色选项，使命令提示符文本更加突出。\n\n- 1. 在“属性”窗口中，选择“颜色”选项卡。\n\

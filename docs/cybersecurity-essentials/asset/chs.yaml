  \n## softphone\n\n一种软件程序，使用户能够通过互联网拨打电话。\n\n## software exploitation\n\n旨在利用软件产品、操作系统和应用程序中的漏洞或弱点的网络攻击。\n\
  \n## software-defined networking (SDN)\n\n一种计算机网络方法，分析任意两个节点之间的连接，并可以根据定义的策略过滤该连接。\n\

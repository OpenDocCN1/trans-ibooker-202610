- '## Local Host Security in the Real World


  *以下挑战为你在第二部分将学习的概念提供了*情境参考点。由于你尚未阅读第二部分中的章节，本章中的挑战旨在让你熟悉你在现实世界中将面临的本地主机场景。


  在本章中，你将学习：

  - 1. 将 NIST 网络安全框架“识别”功能的适用类别和子类别应用于特定场景，以记录网络的资产及其可能存在的漏洞。

  - 2. 使用“保护”功能的适用类别和子类别生成可用于保护指定场景下网络资产的具体政策和措施。

  - 3. 应用“检测”功能的适用类别和子类别来识别可用于监控场景中网络以确定是否发生安全事件的技术、政策、实践和策略。

  - 4. 应用“响应”功能的适用类别和子类别创建事件响应计划，以涵盖与所呈现场景相关的特定安全事件。

  - 5. 将 NIST 网络安全框架“恢复”功能的应用类别和子类别应用于场景，以实施从特定网络事件中恢复的解决方案。


  ## Security Challenges


  本章将启动你对即将学习的内容的思考过程。与其简单地试图吸收这些章节中即将学习的所有信息，你将从这里开始，更好地了解这些信息的现实相关性。


  在第 10 章中，你将回到这些场景并应用你在第 7、8 和 9 章中学到的知识。你还将把你的观察与专业安全专家为这些场景提供的观察和解决方案进行比较。


  ## Computing Device Security Scenario 1


  你已被指派为公司内部员工使用的台式计算机制定本地安全策略和配置规范。这些 PC 安装在每个隔间桌下方的专用开口中。计算机在物理上是相同的，并且都运行相同的操作系统。然而，它们可能安装了不同类型的特定工作公司软件，如图
  6.1 所示。这些计算机配备了以下设备：

  - 可拆卸键盘和鼠标

  - 六个内置 USB 连接端口

  - 独立的视频显示器

  - UTP 局域网连接端口

  - Microsoft Windows 7 Professional 操作系统

  - Microsoft Office 2013 软件

  - 双内置 DVD 光盘驱动器


  ![](img/2459befd842d6fed299fabe6da3512d0_137_0.png)


  图 6.1 企业台式 PC


  这些计算机通常包含销售人员在与客户会面时完成工作所需的产品信息。因此，机密的公司和客户信息（例如不同客户的专有价格清单、客户联系和购买历史信息、销售人员与客户之间以及与公司监督人员的机密通信，以及尚未公布的开发中产品信息）存储在这些设备上。


  显然，这些计算机是可在办公室和不同道路地点工作的便携式 PC。如图 6.2 所示，这些计算机配备了以下设备：

  - 内置键盘和显示器

  - 两个内置 USB 连接端口

  - UTP 局域网连接端口

  - Microsoft Windows 7 Professional 操作系统

  - Microsoft Office 2013 软件

  - 双 SD 卡读卡器插槽

  - 内置无线网络功能

  - 外部 VGA 显示连接端口

  - 内置 DVD 光盘驱动器


  ![](img/2459befd842d6fed299fabe6da3512d0_139_0.png)


  **图 6.2** 笔记本电脑


  ## Risk Assessment 2


  根据第二个场景提供的信息，考虑本节中详细说明的 NIST 功能，然后写下你的观察结果及其与每个类别的关系。


  ## Identify


  创建与此处描述的用户计算机相关的物理设备和系统的清单（NIST ID.AM-1）。


  创建公司笔记本电脑上使用的软件清单（NIST ID.AM-2）。


  绘制组织与这些便携式计算机的通信和数据流（NIST ID.AM-3）。


  描述与本场景中描述的环境和计算设备相关的风险。创建已识别资产漏洞的风险评估（NIST ID.RA-1, 2, 3, 4, 5）。


  ## Protect


  对于所述的设备包，确定必须到位以减轻先前识别的风险的资产（NIST PR.AC, AT, DS, IP, 和 PT）。


  描述如何管理这些计算机授权用户的身份和凭证（NIST PR.AC-1）。


  制定计划以确定当移动设备在公司设施外使用时将如何提供和保护远程访问（NIST PR.AC-3）。


  描述移动计算机上的数据将如何得到保护，以及当数据与设备通信时将如何得到保护（NIST PR.DS-1, 2）。


  ## Detect


  制定安全计划以监控这些信息系统以识别网络安全事件并验证保护措施的有效性（NIST DE.CM-1-8; DE.AE-1-5）。


  必须部署哪些类型的系统来监控这些设备发出的远程通信以检测潜在的网络安全事件（NIST DE.CM-1）？


  必须部署哪些类型的系统来监控人员活动以检测潜在的网络安全威胁（NIST DE.CM-3）？


  ## Respond


  制定计划以确保响应流程和程序到位，以便对检测到的网络安全事件做出及时响应（NIST RS.RP-1; RS.AN-1）。






  考虑到这些移动主机设备上保存的信息，如果其中一个系统的安全遭到破坏，可能需要哪种类型的响应计划（NIST RS.CO-4, 5）？


  ## 恢复


  应采取哪些步骤来从旨在访问、损坏或破坏您已识别的资产的行动中恢复（NIST RC.RP-1）？


  ## 摘要


  记录本章中风险评估的观察结果。在第10章中，您将把这些最初的想法和观察结果与在阅读第7、8和9章后产生的想法和观察结果进行比较。您还将能够将您的答案与专业安全专家的答案进行比较。


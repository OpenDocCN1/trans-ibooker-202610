  \ 泛洪攻击\n+   B. MAC 复制攻击\n+   C. 重定向攻击\n+   D. 中间人攻击\n\n**答案：B**\n\n在 *MAC 复制* 或\
  \ *MAC 克隆* 攻击中，攻击者用目标的 MAC 地址更新自己的 MAC 地址。这将导致交换机将流量转发到两个位置。\n\n## 7. 哪种无线安全功能为无线网络提供最佳防御？\n\
  \n+   A. Bluetooth\n+   B. WEP\n+   C. WPA\n+   D. WiMax\n\n**答案：C**\n\n尽管 WEP 是一种强大的加密方法，但严重的攻击者可以破解它。这促使无线行业创建了更强的\
  \ Wi-Fi Protected Access（WPA）标准。WPA 增加了改进的数据加密，使用临时密钥完整性协议（TKIP）和 IEEE 802.1X 可扩展认证协议（EAP）用户认证协议以提供更高的安全性。\n\

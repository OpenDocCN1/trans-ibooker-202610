- '## 了解环境


  *在本书的这个阶段*，你已经了解了三个一般层面的安全漏洞和解决方案：物理安全、本地主机安全和本地网络安全。这三个层面适用于计算设备、网络连接设备、网络服务器以及由所有者控制的网络介质。本章是本书中最后一个一般性安全章节，讨论的是互联网安全。在本章中，你将学习：


  - 识别与不受控的互联网环境相关的参与者类型

  - 识别与不同 IP 寻址技术相关的组件

  - 将基本端口号与网络安全联系起来

  - 识别关键的互联网安全组织和标准


  ### 互联网安全基础


  在互联网早期，安全主要与密码有关。在许多情况下，密码是生日或宠物名，并使用了几种不同的技术。我们对所生活的这个奇妙的互联世界印象深刻。然而，也有一些人蓄意制造麻烦或入侵网络，但在当时，这大多是恶作剧而非恶意行为。


  ### 本地网络安全与互联网安全的重叠


  当你学习第四部分时，你会注意到本地网络和互联网安全之间存在大量重叠，因为互联网仅仅是互联网络的集合。实际上，适用于网络的每一个安全概念也应适用于这些互联网络。不过，在本章中，我们将较少关注物理层或数据链路层技术，而主要关注互联网连接特有的概念。


  黑客行为大多只是破解，即利用软件不断循环并猜测密码，直到获得访问权限。少数真正的黑客行为涉及直接访问或将恶意代码放在软盘上。


  互联网的使用以惊人的速度增长。在短短几年内，几乎每家企业都在使用互联网，甚至有很大比例的家庭用户每天都在发送电子邮件、购物或只是探索知识。访问速度和协作软件改进如此之大，以至于整体体验对几乎所有人来说都变得极具吸引力。随着网络的发展并成为常态，用于互动的功能也成为了常态。


  网络专业人员必须处理一些安全问题以及一些更重大的安全挑战，这催生了网络安全行业。黑客可以获取电子邮件地址列表，甚至猜测地址，然后发送精心制作的软件，给毫无戒心的收件人带来烦恼和不便。我们信任大部分电子邮件，盲目点击附件，基本上很容易成为猎物。


  安全意识的真正转变始于第一批计算机病毒开始传播之时。单个用户运行一段恶意代码就可能影响整个公司网络。受害者可能在不知情的情况下，将该病毒分享给其所有联系人，从而成为病毒进一步传播的共谋。


  微软希望拥有市场上最强大的网络浏览器，一个能够彻底改变我们交流方式的浏览器。他们将这些能力构建到操作系统中，并让我们对他们所能实现的技术感到惊叹。


  没过多久，黑客就将目光投向了这种新能力，并针对这些功能创造了一个又一个漏洞利用。随着企业争相采用更新的技术，几乎立刻，要抵御恶意利用已经太迟了。世界已经依赖于互动和交流。当微软和其他公司争相修补几乎每天都被发现的新漏洞时，有一点变得非常清楚：互联网安全是件大事！


  如今，有如此多不同的软件和硬件技术使用互联网，安全需要成为每个人关心的问题。我们不能仅仅依靠操作系统供应商或应用程序供应商来保护我们的安全。我们都必须保持警惕，确保安全措施到位。即使是只通过电子邮件与孙辈交流的家庭用户，也必须具备一定的安全意识。


  在本地主机和局域网得到保护之后，还必须保护与互联网的连接。考虑到这一点，互联网安全涉及四个主要目标，以及需要考虑的这些主要形式的互联网安全：


  - 了解本地内部网络与互联网环境之间的边界。连接和使用互联网的方式有很多种。目标是理解其工作原理，以便保护数据，防止恶意互联网用户访问本地计算机上的数据，或防止其在数据通过互联网传输时被访问。

  - 保护本地硬件。物理安全仅涉及保护对本地网络硬件的物理访问。

  - 保护网络。网络安全包括保护控制数据传输的硬件，以及提供身份验证、授权和保护。

  - 保护数据。数据安全包括保护存储在网络中或通过网络传输的数据。


  网络安全既是一门学科，也是一套技能。有一点安全多疑可能是好事；但与其让安全担忧影响你的健康，不如制定一个强大的备份计划，这样即使在最坏的情况下，网络资源也能得到保护，并能合理地重新部署。


  第四部分将涵盖此处列出的互联网安全基本概念，并将其应用于多种协议和服务，以帮助你在面对新的或横向技术时也能懂得如何应对互联网安全。





  ## 理解环境


  网络是由可以自由交换信息的设备组成的集合，而互联网本质上也不过是能够交换信息的网络的集合。信息交换的自由程度各不相同，但信息能够轻松交换正是互联网如此吸引人的原因。这也是互联网如此危险的原因。


  互联网以某种形式已经存在数十年，从政府和大学的概念演变而来，随着网络变得更主流、更实用，它已成为信息交换的全球标准。直到万维网和网页浏览器的出现，这一概念才进入家庭，成为年轻人、老年人都渴望并最终几乎必不可少的东西。


  要充分理解互联网环境，你必须了解居住在互联网中的各类参与者。个人用户通常会遇到五种参与互联网活动的参与者：


  - 服务提供商

  - 想要做广告和销售的企业

  - 想要交换信息的人和企业

  - 想要访问互联网上的信息或使用服务的用户

  - 想要访问计算机窃取信息、监视他人或破坏其通信的坏人


  另一方面，对于大多数企业而言，通常需要考虑互联网上的五种参与者（如下图 19.1 所示）：


  - 可以浏览其网站并可能通过互联网订购产品的潜在客户

  - 需要通过互联网访问其内部网络的远程员工

  - 可以高效地利用互联网交换信息的受信任企业

  - 想要访问互联网上的信息或使用服务的内部用户

  - 想要访问其网络窃取资金、破坏其运营或破坏其通信的坏人


  ![](img/2459befd842d6fed299fabe6da3512d0_475_0.png)


  图 19.1 互联网参与者


  ## 基本互联网概念


  许多人认为互联网不过是电子邮件和网络。一直以来还有许多其他协议，而且每天都在创建更多协议。


  在第三部分中，你已了解 OSI 网络模型，其中系统有七层，每层仅与上下层交互。我们在网络管理中并不太关注这些层，但它们是理解网络中存在不同方式来处理不同协议的互联的关键。


  典型的互联网活动中涉及许多不同的协议。但核心协议套件（也是最重要需要理解的）是通常称为 TCP/IP 的互联网协议套件。顾名思义，TCP/IP 包括两个协议：传输控制协议（TCP）和互联网协议（IP），它们是互联网模型中最重要的协议。


  我们知道数据在任何网络上传输时都是以数据块的形式传输的，具体称为数据报、数据包或段，这取决于数据正在通过哪一层。TCP/IP 划分为四个层，并规定数据应如何打包（链路层）、寻址（互联网层）、传输（传输层）以及接收和处理（应用层）。


  协议（SMTP），而超文本传输协议（HTTP）是主要的网页协议。


  当 TCP 协议接收数据时，它将其分成块并为每个块添加 TCP 头部，形成 TCP 段，如图 19.2 所示。该段随后由互联网协议（IP）封装成通常称为 TCP
  数据包的数据报。TCP 头部包含 10 个必填字段和一个可选扩展字段。这些字段共同提供了确保头部后数据的正确可靠交付所需的信息。


  ![](img/2459befd842d6fed299fabe6da3512d0_477_0.png)


  图 19.2 TCP 段结构


  ## TCP/IP 数据包的缺点


  TCP/IP 数据包构成了互联网通信的骨干（以及大多数局域网策略）。反过来，它也为大多数类型的网络攻击提供了载体。这些攻击以不同方式操纵源地址和目标地址，以更改或隐藏消息的来源或目的地。


  TCP 协议严格跟踪所有数据，以便任何混乱或丢失的数据包都可以重新传输甚至重新排序以保持可靠性。接收这些数据包的网络设备必须在能够处理之前缓冲这些数据。因此，协议必须促进主机之间达成协议，以限制一次可以传输的未确认数据的大小。这就是所谓的
  TCP 窗口大小，位于 TCP 头部中。


  为优化此过程，TCP 使用流量控制协议，接收主机在接收数据时可能会更改该窗口大小以补偿更高的负载。如果接收主机不再有任何缓冲区空间来处理数据，它会将该窗口大小设置为零。当这种情况发生时，发送方将停止传输并启动持久计时器。当计时器到期时，发送方将发送另一个小数据包以期获得新的窗口大小。


  另一方面，UDP 只是简单地发送数据包而没有大部分复杂性和开销。这导致延迟（延迟）更低。然而，这意味着数据包可能会丢失甚至乱序接收。UDP 提供了端口号和可选的校验和以验证完整性，因此应用程序可以配置为使用
  UDP 以比 TCP 更快的速度进行无损数据传输。UDP 与许多其他协议一起使用，例如：


  - 域名系统（DNS）查询

  - 实时流传输协议（RTSP）

  - 简单文件传输协议（TFTP）


  ## 单播、广播和多播


  单播消息是指向单个网络地址发送消息。广播消息是指向所有可能的目的地发送消息。多播消息使用特殊地址分配向特定地址组发送消息。单播、广播和多播之间的差异如图 19.3
  所示。


  ![](img/2459befd842d6fed299fabe6da3512d0_479_0.png)


  在多播中，无论有多少地址会接收，源只需发送一次数据包。网络节点然后根据需要复制数据包以到达多个地址。多播用于多媒体和内容分发网络。经常使用 UDP 进行多播，因此提供商必须添加错误检测和重传机制以使多播可靠。


  ## 端口


  除了网络地址之外，许多协议还可能指定端口或端口号。协议或应用程序可能以不同方式响应特定端口。例如，Web 服务器通常通过端口 80 响应 HTTP 请求，但通过端口
  443 响应 HTTPS 请求。


  端口似乎是任意的约定，大范围的端口号通常与任何特定服务无关，因此可用于特定应用程序。如果在 Web 浏览器中将端口号添加到主机名或 IP 地址，例如，你可以创建一个访问特定应用程序或服务甚至只是常规网页内容的方式。


  端口号是一个 16 位数字。前 1,024 个端口号按惯例保留用于标识特定服务。TCP 和 UDP 协议都使用端口。一些常见端口及其描述在表 19.1 中给出。


  ### 表 19.1 一些常见端口及其用途


  | 端口 | 协议 | 描述 |

  |---|---|---|

  | 20 | TCP/UDP | FTP |

  | 22 | TCP/UDP | SSH |

  | 23 | TCP/UDP | Telnet |

  | 25 | TCP/UDP | SMTP（简单邮件传输协议） |

  | 80 | TCP/UDP | HTTP（超文本传输协议） |

  | 88 | TCP/UDP | Kerberos 认证系统 |

  | 110 | TCP | POP3（邮局协议 v3） |

  | 118 | TCP/UDP | SQL（结构化查询语言）服务 |

  | 143 | TCP | IMAP（互联网消息访问协议） |

  | 443 | TCP/UDP | HTTPS（通过 TLS/SSL 的超文本传输协议） |

  | 631 | TCP/UDP | 互联网打印协议（IPP） |


  端口号从 1024 到 49151 是由互联网号码分配机构（IANA）分配的注册端口。例如，Microsoft SQL Server 使用端口 1433 和 1434。Microsoft
  Windows 互联网名称服务（WINS）使用端口 1512 等。私有端口是 49152 到 65535 之间的端口。


  理解端口对于管理网络安全至关重要。最小化不需要的扫描或限制访问的最简单方法是监控特定端口和端口阻塞。例如，如果你运营的服务器仅是 Web 服务器，你可以限制外部网络访问，使其只能通过端口
  80 也许端口 443 进行。这样，如果有人从网络外部尝试访问端口 22 或 23 试图入侵，该请求将被阻止。


  ## 路由


  *路由* 只是选择在网络或网络之间传输数据的最佳路径的过程，如图 19.4 所示。路由器是一种复杂的设备，可在网络之间路由数据；路由器可以是硬件、软件或两者结合。路由器主要处理
  IP 地址，这可以是




  用作限制访问的另一种方式。很多时候，用户并不知道他们想访问的服务器的IP地址，而是知道主机名和域名。


  ![](img/2459befd842d6fed299fabe6da3512d0_481_0.png)


  *图19.4 路由操作*


  ## 域


  域是由称为注册商的代理机构分配的唯一领域，该代理机构已获得互联网名称与数字地址分配机构（ICANN）的授权。一些较大的注册商包括 Network Solutions、GoDaddy
  和 eNom。


  域的注册有一定的可续期时限，可以查询根权威机构，以便了解负责路由该域的名称服务器。这些名称服务器将使用与各种协议关联的IP来响应查询，并且你可以通过特定类型的查询了解与某个域关联的大多数协议。


  顶级域（TLD）本质上就是域扩展名，如图19.5所示。TLD 为国家（例如 .us）、描述性群体（.people、.rocks、.attorney 等）和通用
  TLD（如 .com、.net、.edu 和 .gov）而设立。每个 TLD 可能有不同的要求，甚至可能要求你必须使用特定的注册商来注册域。.edu 域和一些国家代码域在注册该
  TLD 下的域之前通常有特定要求，例如必须是实际的教育机构或位于该国。然而，大多数域都可以随时注册。


  一次只能在一个方向上传输数据。这些服务差异与安全措施无关，但在处理许多安全问题时，了解这些差异以及你所拥有的连接类型非常重要。


  除了控制可通过互联网连接传输的数据量并为客户分配IP地址外，ISP 还可能提供一些你应该了解的更透明的服务。许多 ISP 会通过缓存服务器或缓存设备代理你的网络连接，以最大限度减少带宽占用。一些
  ISP 还会错误地阻止某些端口，试图最大限度地减少恶意软件、病毒和蠕虫的影响。


  例如，许多有线电视和 DSL 提供商阻止端口25，除非请求指向他们的邮件服务器。如果受感染的用户成为分布式垃圾邮件僵尸网络的一部分并开始大量发送垃圾邮件，他们的邮件将被阻止使用第三方邮件服务器。这使得
  ISP 无需任何复杂的扫描技术就能防止大规模垃圾邮件爆发。这也迫使该 ISP 的用户如果想使用第三方邮件提供商，就必须将邮件软件设置为使用替代端口。


  ISP 还可能为客户提供某些网络硬件。你必须准确了解这些硬件的功能。一些 ISP 为客户提供同时也充当路由器的调制解调器，它成为互联网与本地网络之间的边界。在某些情况下，该路由器可能已预先配置了某些设置，这些设置可能与局域网管理员试图进行的设置冲突。这些问题都可以解决，但你必须了解自己的连接是如何设置的，以便正确配置网络。


  ISP 为调制解调器分配一个公共IP地址，该地址可以使用动态主机配置协议（DHCP）动态分配。使用 DHCP 并不一定意味着每次访问网络时都会获得不同的IP地址，甚至网络网关设备重启时也不一定。但也不能保证调制解调器的IP地址是固定的，就像分配静态IP地址时那样。


  DHCP 服务器从可用地址池中分配一个IP地址。该IP与调制解调器的 MAC 地址关联，并持续指定的一段时间。DHCP 也可用于在内部网络中分配地址，我们稍后将讨论。


  互联网服务通过多种技术提供，每种技术都可能影响你的安全方法。拨号连接和较慢的 ISDN 或蜂窝连接不太可能有人仅凭其速度入侵你的网络。入侵者必须确实想要进入该特定网络，才有耐心以这种方式渗透。


  ## 标准与 RFC


  如果没有一些规则来规定一切应如何运作，互联网就会像美国旧西部的蛮荒之地。与其他事物一样，有各种标准组织负责监督某些协议。但另一种不太正式的工具也有助于指导这些协议应如何运作。


  *RFC*（即请求意见稿）是提交给互联网工程任务组（IETF）的说明文件，IETF 是互联网的主要标准组织。任何人都可以提交 RFC。如果 IETF 认为该说明有价值，就会为
  RFC 分配一个唯一编号，一旦发布，在没有获得新编号的情况下就不会再修订。如果这份 RFC 吸引了足够的兴趣并形成共识，它可能会演变成互联网标准；然而，许多 RFC
  实际上是大多数互联网协议的事实标准。这个名称可能暗示它是一项正在进行的工作——在某种程度上确实如此——但当你需要理解某个协议时，这些 RFC 往往与技术手册一样重要。


  ## 安全组织与标准


  许多组织参与维护网络漏洞资源，这与病毒和恶意软件资源类似。各种商业实体已经发展起来以满足这一重要需求，但也有许多公共资源和标准值得你了解：


  - 安全内容自动化协议（SCAP）是一种使用各种开放标准来评估漏洞并衡量这些漏洞潜在影响的方法。你可以在 `scap.nist.gov` 了解更多信息。

  - 常见漏洞与暴露（CVE）是一个用于引用公开已知漏洞的系统。CVE 由 MITRE 公司维护，并得到美国国土安全部的支持，SCAP 使用 CVE。你可以在 `cve.mitre.org`
  更详细地探索 CVE。

  - 通用漏洞评分系统（CVSS）是一个为 CVE 中的漏洞评分的系统，便于你理解风险。你可以在 `www.first.org/cvss` 更详细地探索 CVSS。

  - 通用平台枚举（CPE）是一种描述和识别操作系统、硬件设备和


  ## 资源


  - 兼容 PC 的台式机/塔式计算机系统

  - 已安装 Windows 10 专业版

  - 通过网络连接访问互联网


  ## 讨论


  由于浏览器是通往更广阔外部世界的门户，其安全设置是保护本地主机安全非常重要的一部分。如果物理设备已在内部和外部边界得到保护，浏览器就会成为攻击者的主要访问点之一。


  此外，机器上的其他互联网工具可能依赖浏览器组件来执行其功能。这些应用程序可能带来增强功能，从而产生额外的漏洞。如果这些功能对系统的运行没有贡献，就应进行评估并关闭。


  ## 操作步骤


  Windows 10 专业版的 Internet Explorer 安全设置可以通过多种方式进行管理。在本实验中，你将了解这些设置的位置，以及如何根据你的具体需求进行调整。你还将学习如何控制隐私设置，以进一步控制那些经常被忽视的安全问题。


  注意：在本练习中，你将使用 Internet Explorer（IE）。大多数浏览器都有类似的安全和隐私选项，或者依赖于为 IE 选择的选项。



  \ – 读取与执行、读取、写入 | 可以访问、更改和保存文件 |\n\n## 实验问题\n\n+   1. 文件夹拥有哪些文件所没有的权限？\n+   \n+\
  \   答案：文件夹权限包括“列出文件夹内容”。文件权限只有“读取”和“读取与执行”。\n+   \n+   2. 什么是有效权限？\n+   \n+   答案：有效权限是所有来源授予的累积权限。个人和组来源相结合，在\
  \ ACL 内给出总体权限。\n+   \n+   3. 仅靠加密就能确保您的数据安全吗？\n+   \n+   答案：不能。正如实验所示，信息可能受到保护，但它并非不可触碰。如果没有设置适当的权限，恶意用户可能会选择破坏您的信息。更糟糕的是，其他人可能并不完全清楚自己在做什么，并意外地对数据造成不可逆转的影响。\n\
  \n\n\n\n\n## 第8章 · 保护内部边界\n\n**4.** 如果一个用户尝试访问一个文件，该文件对他同时赋予了来自不同来源的允许 – 读取和执行权限以及拒绝\
  \ – 读取和执行权限，他是否能够访问该文件？\n\n**答案：** 否。在大多数情况下，拒绝权限会覆盖允许权限。已授予的允许权限将被作废，用户将无法访问。\n\
  \n**5.** 如果你从特定用户移除所有权限，包括允许和拒绝，他是否能够访问文件或文件夹？\n\n**答案：** 取决于他所属的组或组，是的。用户通常会被添加到用户组中，因此他们在大多数文件上被赋予默认的允许\
  \ – 读取和执行、读取和写入权限。\n\n**6.** 作为普通用户，你可以更改任何文件或对象的权限吗？\n\n**答案：** 否。没有管理属性的用户无法更改任何文件或文件夹的权限。用户仅允许更改其被视为所有者的文件的权限。\n\
  \n## 保护远程访问\n\n*正如你在第二部分学到的那样*，计算机不必连接到其他计算机就会面临风险。尽管许多计算机可能不属于企业网络，但几乎所有现代个人计算机至少偶尔会连接到世界上最大的数据网络：互联网。因此，这些独立的计算和控制设备会暴露于来自远程源的破坏和利用。\n\
  \n- 分析并区分防病毒/反恶意软件产品。\n- 保护独立计算设备的网络浏览器。\n- 配置并测试本地防火墙安装。\n- 解释应用程序安全的重要性。\n- 审计本地操作系统服务和事件。\n\
  - 在独立主机设备上建立本地安全策略。\n- 描述进行本地更新和补丁维护活动的重要性。\n\n### 保护本地计算设备\n\n保护本地计算设备免受基于互联网的威胁有九个基本步骤：\n\
  \n- 1. 使用安全连接。\n- 2. 建立并配置防火墙以控制计算设备与互联网之间信息流。\n- 3. 在本地计算机上安装并使用反恶意软件。\n- 4. 从计算机中删除不必要的软件。\n\
  - 5. 禁用计算机上运行的任何非必要服务。\n- 6. 禁用不必要的操作系统默认功能。\n- 7. 保护网络浏览器。\n- 8. 应用操作系统和应用程序软件更新和补丁。\n\
  - 9. 要求使用强密码。\n\n### 使用安全连接\n\n保护互联网连接的第一步之一是在本地路由器上实施安全选项。如果特定连接不包含路由器，你可能还应考虑安装一个，因为配置良好的路由器提供了最好的初始防线之一。路由器和其他网络连接设备将在第三部分详细介绍。\n\
  \n配置路由器安全功能时需要考虑的一些基本项目包括：\n\n- 更改登录用户名和默认密码。 （默认值发布在用户的设置说明中，因此人人都知道。）\n- 对于无线网络连接，更改默认\
  \ SSID 设置。\n- 使用最高级别的加密配置无线网络——最好是 WPA2-AES 以实现最大数据保密性。\n- 通过进行 MAC 地址过滤来识别受信任的无线连接。\n\
  \n### 建立和使用防火墙\n\n你应始终建立并配置防火墙以控制计算设备与互联网之间信息流。对于独立或本地计算机，这可以通过操作系统提供的本地软件防火墙和/或保护路由器来解决。本章后面将讨论本地防火墙配置。\n\
  \n### 安装和使用反恶意软件\n\n反恶意软件可以通过使用包含式恶意软件预防产品安装，也可以通过结合不同类型的特定预防程序来安装，例如来自不同厂商的防病毒和反间谍软件产品。本章末尾将详细介绍不同类型的恶意软件和预防方法。\n\
  \n### 删除不必要的软件\n\n在计算机上保留未使用的软件产品会提供额外的攻击和利用途径。如果你不知道某个疑似软件程序的作用，请研究它，如果它对该系统的运行不重要就将其删除。\n\
  \n### 禁用非必要服务\n\n某些病毒旨在利用非必要服务以便在设备之间迁移。特别是，除非它们以某种方式对系统的正常运行至关重要，否则应断开任何正在运行的文件共享或设备共享服务（在非消费者使用中几乎从不如此）。\n\
  \n照片共享和音乐共享服务应始终禁用，而文件和打印机应禁用，除非需要从一个设备向另一个设备传递信息以执行工作任务。 （这适用于网络计算机，将在第四部分详细介绍。）\n\
  \n### 禁用不必要的操作系统默认功能\n\n如前所述，Autorun 是微软操作系统系列中高度可被利用的功能。当此功能启用时，操作系统将检测到可移动媒体的存在并执行其内容。如果\
  \ SD 卡或 CD/DVD 包含病毒，它将被自动执行并感染主机计算机。\n\n### 保护网络浏览器\n\n网络浏览类应用程序软件吸引了越来越多的攻击。初始浏览器配置可能在安全方面提供的保护不多。因此，通常有必要配置新浏览器的安全选项以保护系统免受通过此入口的攻击。本章后面将讨论保护不同网络浏览器的步骤。\n\
  \n## 基于软件的本地防火墙\n\n直接连接到互联网的计算机容易受到外部攻击。保护独立计算机免受外部攻击的一种方法是安装本地防火墙。防火墙是放置在本地设备和外部网络（如互联网）之间的一种设备或程序。\n\
  \n本地基于软件的防火墙可以安装在单台计算机上，以保护其免受通过互联网连接引入的恶意活动。在某些情况下，操作系统提供内置防火墙选项，可用于保护本地计算机。\n\n\
  ### 关于防火墙的一点说明\n\n> 本地软件防火墙旨在通过阻止来自互联网设备的 unwanted 连接来提供对外部攻击的保护。基于软件的防火墙服务旨在保护直接通过拨号、局域网或高速互联网连接连接到互联网的单台计算机。\n\
  \n防火墙检查所有进出外部连接的流量，可以根据期望的属性配置为控制互联网与本地设备之间的流量，如图 9.1 所示。防火墙配置为仅将数据传递到和来自指定的 IP\
  \ 地址和 TCP/UDP 端口。\n\n通常，防火墙过滤器围绕 TCP 和 UDP 网络协议识别的服务进行配置。这些协议使用端口号来标识特定进程，例如 HTTP\
  \ 或 FTP，并用于将传入数据包引用到将处理它们的软件应用程序。许多端口号是标准化的，被称为众所周知的端口。同样，其相关应用程序被称为众所周知的服务。\n\n\
  表 9.1 列出了几个众所周知的端口号及其相关服务。互联网号码分配机构（IANA）已将 0 到 1023 范围的标准端口号分配给特定服务。1024 至 49151\
  \ 号端口称为注册端口，用于厂商应用程序。49152 至 65535 号端口是动态或临时端口，由计算机应用程序用于与其他应用程序通信。\n\n\n\n\n\n\
  ## 图 9.1 防火墙操作\n\n## 表 9.1 典型 I/O 端口\n\n| 服务 | 知名端口号 |\n|---|---|\n| FTP | 20, 21\
  \ |\n| Telnet | 23 |\n| SMTP 邮件 | 25 |\n| HTTP（WWW） | 80 |\n| POP3（邮件） | 110 |\n\
  | 新闻组 | 144 |\n| HTTPS | 443 |\n| PPTP | 1723 |\n| IRC | 6667 |\n\n![](img/2459befd842d6fed299fabe6da3512d0_229_0.png)\n\
  \n防火墙检查传入的数据包时，可以读取数据包的源 IP 地址和目的 IP 地址以及任何 TCP/UDP 端口号，如图 9.2 所示。它将使用数据包头中的 IP\
  \ 地址和端口信息来确定传入的数据包是否应被路由到内部网络。\n\n![](img/2459befd842d6fed299fabe6da3512d0_230_0.png)\n\
  \n图 9.2 防火墙功能\n\n如果你已将防火墙配置为指向提供 FTP 服务的内部计算机的 IP 地址，并开放了端口 20 和 21，防火墙将识别传入包头中的\
  \ IP 地址和端口号有效，并将数据包路由到该计算机。但所有其他传入请求仍将被阻止。\n\n## 使用本地入侵检测工具\n\n与物理安全防护一样，防止未经授权的访问是本地计算和控制设备级别的第一道安全防线。然而，在这一级别上，能够检测到入侵的发生并通知相应人员其性质同样重要。\n\
  \n基于计算机的入侵检测系统（IDS）可以通过两种方式实现：基于网络的 IDS（NIDS）或基于主机的 IDS（HIDS）。无论哪种方式，系统的主要设计目标都是监控系统（本地计算机或网络环境）、记录关键事件和策略违规行为，并按指示报告这些情况。\n\
  \n入侵防御系统（IPS），也称为入侵检测与防御系统（IDPS），提供了额外的保护层级，旨在阻止已检测到的威胁得逞。\n\n正如其定义所示，HIDS 和 NIDS\
  \ 在计算机/网络环境的不同区域运行。现在，我们暂不讨论 NIDS，而是聚焦于运行在单个主机或设备上的 HIDS 工具。\n\n所有 IDS 设备都基于以下两种策略之一：\n\
  \n- 签名分析——将传入和传出流量与存储的特定代码模式数据库进行比较，这些模式已被识别为恶意威胁。\n- 异常分析——将传入和传出流量与系统已建立的正常流量基线进行比较。\n\
  \n基线是通过对系统从流量中获得的数据应用数学算法来“学习”（生成）的。\n\n基于签名的 IDS/IDPS 产品通常通过查找内容中的特定模式（称为*签名*）来工作。如果检测到“已知恶意”的模式，就可以采取适当措施保护主机。然而，由于编程语言的动态特性，网页中的脚本可用于绕过此类防护系统。\n\
  \n基于签名的 IDS 数据库通常由厂商根据观察到的恶意签名生成并分发。因此，在识别出签名并将其添加到数据库以供采取行动之前，恶意代码就已存在。恶意代码发布与其签名发布之间的时间延迟本身就构成了一个安全问题。\n\
  \n基于异常的 IDS/IDPS 系统对数据流应用统计分析技术，以确定其在任何给定时间点是“正常”还是“异常”。实现统计异常检测有两种常见方法：\n\n- 基于轮廓的异常检测系统\n\
  - 基于阈值的异常检测系统\n\n## 基于轮廓的异常检测系统\n\n这类系统使用数学算法监控正常数据流量，并制定一个描述该系统正常流量样貌的规则“轮廓”。所制定的轮廓反映了对用户过去行为的评估，并被配置为当这些行为的偏差达到一定程度（即*阈值*）时发出信号。\n\
  \n- 基于规则的异常检测——该检测方法分析审计记录，基于过去的使用模式生成“规则”集。系统随后监控流量，寻找与规则不匹配的模式。\n- 渗透检测——这类系统根据已知的渗透事件、系统弱点或行为模式生成规则。因此，它们通常针对特定主机系统。它们通常还包含安全专家根据当前安全活动生成的规则。\n\
  \n## 基于阈值的异常检测系统\n\n这类 IDS 系统旨在跟踪特定事件在一段时间内的发生次数，如果事件次数超过预定值，则生成入侵警告。\n\n大多数常见的\
  \ IDS 系统是为本地主机系统使用而设计的。然而，人们日益致力于开发基于网络的 IDS 系统，以提供更有效的入侵检测与防御手段。基于网络的分布式入侵系统将在第四部分中介绍。\n\
  \n| IDS 通知 | 在所有类型的 IDS 中，当检测到潜在攻击时，管理员都会收到通知。 |\n\n## 配置浏览器安全选项\n\nWeb 浏览器在设计上高度灵活，旨在为用户提供尽可能多的使用选项。它们的设计也着眼于吸引绝大多数非技术用户。再加上大量上网者将其网络访问用于不良目的，你的本地系统便出现了一个巨大的安全缺口。\n\
  \n例如，图 9.3 显示了 Windows Internet Explorer（IE）浏览器可用的部分 Internet 选项。如你所见，其中一些选项属于个人偏好，例如颜色、字体和工具栏。然而，还有多种涉及浏览器和互联网搜索的安全相关活动。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_233_0.png)\n\n**图 9.3** Internet 选项\n\
  \n如图所示，Web 浏览器通常会提供多种用户可选择的安全选项，可用来弥补互联网浏览和搜索给系统带来的额外脆弱性。这些选项包括：\n\n- 配置安全级别\n-\
  \ 配置脚本\n- 配置代理服务器\n- 控制 Cookie\n\n尽管每个浏览器的设计不同，但它们往往都提供类似的 Web 安全选项。用户可能需要寻找特定工具来将浏览器配置为安全运行，但相同的基本配置技术适用于所有浏览器。\n\
  \n## 配置安全级别\n\n由于浏览器是通往更广阔外部世界的门户，其安全设置非常重要。此外，机器上的其他互联网工具可能依赖浏览器的组件来执行其功能。这些应用程序可能带来增强功能，从而造成额外的漏洞。如果这些功能对系统运行没有帮助，就应对其进行评估并关闭。\n\
  \n与其他应用程序一样，浏览器附带一组预配置的安全级别。在 Microsoft IE 中，这些功能位于图 9.4 所示的安全选项卡上。\n\n![](img/2459befd842d6fed299fabe6da3512d0_234_0.png)\n\
  \n图 9.4 IE 安全选项卡\n\n在此浏览器示例中，Internet 站点可归入不同的 Internet 安全区域，使每个区域中的站点受适用于该组的安全限制约束（Internet、本地\
  \ Intranet、受信任的站点和受限制的站点）。\n\n这样，不同的网站就可以在不同的安全限制下被访问。可以建立受信任的站点以减少安全开销，而为受限制的站点分配更高的安全设置。Internet\
  \ 区域选项是未分配到其他区域选项的所有站点的默认区域。\n\n配置安全级别的最佳做法是尽可能将其设置得高，同时不要将浏览器限制到网站无法加载或无法正常工作的程度。\n\
  \n## 配置脚本支持\n\n*脚本*是可执行应用程序，用于在网站上提供交互式内容。它们也能够根据用户的选择检索信息。然而，用户可能无需执行任何操作即可运行脚本程序；这些脚本只是嵌入在被访问的网站中。\n\
  \n应控制网站上遇到的脚本，因为它们是病毒感染的主要来源之一。攻击者会重新配置脚本，使其包含客户端可能在不知情的情况下下载的病毒。它们还会促成自动弹出窗口，在客户端浏览器上毫无预兆地出现。这些窗口通常包含未经请求的广告，往往令用户厌烦。\n\
  \n在浏览器中加载和运行脚本的能力可以通过浏览器的“安全”功能进行控制。你可以控制的各个网页组件列表包括不同的脚本类型，如 ActiveX 和 JavaScript。\n\
  \nActiveX 是 Microsoft 的一种实用工具，使 Web 应用程序能够借助浏览器中的 ActiveX 框架构建扩展的交互特性和功能。当启用了 ActiveX\
  \ 的浏览器遇到调用 ActiveX 控件功能的网页时，它会自动下载，而无需用户参与。当然，这会造成潜在的安全漏洞，破解者可利用它在被入侵的网站中嵌入恶意代码。\n\
  \n一种类似的脚本语言 JavaScript 常被用于 Web 浏览器，使网站更具交互性。它尤其适合开发游戏和其他富含音频/视频内容的网页中的交互式内容。然而，它也被广泛用于传输远程活动的信息，例如浏览和阅读习惯，以供广告跟踪和分析使用。它无需重新加载收集信息的页面，也无需通知读者即可做到这一点。这再次为恶意（或至少不受欢迎的）活动创造了潜在入口。\n\
  \n\n\n\n\n## 关于 VBScript 的说明\n\nVBScript 是另一种仅适用于 Microsoft Windows Internet Explorer\
  \ 的脚本语言。VBScript 与 JavaScript 相似，但由于与其他浏览器的兼容性有限，因此在网站中并不广泛使用。\n\n网站与浏览器交互的另一个关注领域是使用插件为现有软件应用程序添加新功能，例如搜索引擎和防病毒功能。这些脚本控件类似于\
  \ ActiveX 控件，但不能在 Web 浏览器之外执行。Adobe Flash 和 QuickTime Player 是 Web 浏览器插件最广为人知的例子。\n\
  \n大多数浏览器默认支持各种插件，并依赖它们进行部分操作。伴随着这些组件的自动特性而来的是日益增加的脆弱性，无论是在设计缺陷方面还是作为潜在的黑客攻击目标。从历史上看，ActiveX\
  \ 控件、Adobe 的 PDF Reader 和 Flash 产品以及苹果的 QuickTime 产品在脚本产品中代表了记录在案的漏洞数量最多。\n\n与其它安全对象一样，浏览器通常可以配置为在遇到页面上的这些脚本项目时启用、禁用或提示用户。经验法则是，除非你知道它们可以被信任，否则应禁用所有附加组件（包括\
  \ Java、JavaScript、Flash 和 ActiveX）上的网站。\n\n## 控制 Cookie\n\n*Cookies* 是 Web 服务器在访问其页面时发送给\
  \ Web 浏览器的微小文件。这些文件的合法用途是使服务器能够在客户端浏览器每次连接到服务器时自动识别客户端浏览器。基本的 HTTP 页面传输过程在图 9.5\
  \ 中描述。\n\n![](img/2459befd842d6fed299fabe6da3512d0_236_0.png)\n\nWeb 页面传输在客户端通过本地\
  \ Web 浏览器启动。浏览器向指定的 Web 服务器发送 HTTP 请求，服务器随后返回请求的页面以及 HTTP 响应消息。消息中的一个信息可能是要求浏览器设置（接受并存储）cookie，以便可以进行更高效、自动化的页面传输过程。\n\
  \nCookie 还可能包含称为 *cookie attributes* 的多个配置信息。其中一个关键的安全相关属性是 Cookie 过期的设置。基本上，有两种需要关注的\
  \ Cookie：session cookies 和 *persistent cookies*。*Session cookies* 在浏览器关闭时会被清除，而\
  \ *persistent cookies* 将保留在计算机上，直到指定的到期日期为止。与会话 Cookie 相比，持久 Cookie 风险更高，因为它们在客户端计算机上保留的时间更长。\n\
  \nCookie 最初是为在用户在页面之间移动并将商品放入在线购物篮时保持用户登录在线购物环境而开发的。然而，Cookie 的使用已扩展到远不止购物篮。它们可以设计为收集并跟踪网站设计放置在其中的任何信息——例如，它们可能跟踪用户访问的网站信息或用于访问该网站的凭据。设计用于执行这些类型功能的\
  \ Cookie 称为 *tracking cookies*。\n\n这正是使 Cookie 对黑客具有吸引力的信息。如果网站使用 Cookie 进行身份验证，那么攻击者可能通过获取\
  \ Cookie 而未经授权访问该网站。这被称为 *cookie theft*。\n\n攻击者只需使用数据包嗅探实用程序来监控网络流量并捕获 Cookie 即可获得其凭据（用户名、密码、网络地址等）的访问权限。掌握这些信息后，攻击者就有能力在访问其他网站时冒充原始用户。\n\
  \n攻击者还可以使用一种称为 *cross-site scripting*，或 XSS 的技术，导致返回的 Cookie 被重定向到攻击者运营的第三方服务器。攻击者随后可以使用被盗的\
  \ Cookie 冒充原始站点，假装成原始用户。重定向通常是通过简单地在站点上隐藏脚本并使用社会工程技术诱骗用户点击代码来实现的。当他们这样做时，他们的 Cookie\
  \ 会被传输到攻击者指定的第三方位置。\n\n此外，攻击者可能只是更改被盗 Cookie 的内容以对原始 Web 服务器发动攻击。例如，如果 Cookie 是电子商务销售网站的产物，它可能包含有关购物车中产品定价的信息。攻击者可以更改该信息并将其发送回原始服务器，导致其以更低的价格向客户收取商品费用。这种类型的攻击，如图\
  \ 9.6 所示，是一种中间人（MITM）攻击的形式，称为 *cookie poisoning*。\n\n![](img/2459befd842d6fed299fabe6da3512d0_238_0.png)\n\
  \n**FIGURE 9.6** Cookie Poisoning\n\n几乎所有浏览器默认都支持 Cookie。有些提供用户完全启用或完全禁用 Cookie\
  \ 的选项，而其他浏览器则提供更强大的 Cookie 管理器，使用户能够查看并选择要从系统中删除的单个 Cookie。\n\n出于安全目的，处理 Cookie\
  \ 的最佳建议是禁用始终设置 Cookie 的选项。此外，使用传输加密以防止第三方在途中拦截时能够读取 Cookie。这在使用 Wi-Fi 通信时尤其重要。如果无线链路未加密，攻击者可以轻松拦截然后读取数据，包括发送的\
  \ Cookie。\n\n使用安全套接层（SSL）链接为传输数据（包括 Cookie）提供数据加密安全，并防止在通信链路上传输时未经授权访问数据。SSL 链接始终标识为\
  \ HTTPS:// 站点，而不是简单的 HTTP://。\n\nRootkits 被设计为在操作系统根级别运行，并在该级别表现为良性实体。在 rootkit\
  \ 安装到系统后，它将采取措施隐藏自己以避免被检测。它们通过更改驱动程序或内核模块来修改操作系统的核心组件的行为。这些程序具有窃取 PIN、账户密码、信用卡和其他敏感信息的能力。它们可以感染几乎任何类型的操作系统。\n\
  \nRansomware 是旨在阻止用户访问其数据并将其作为付款人质的软件。垃圾邮件是最常见的传播恶意软件的载体。然后通过用户点击电子邮件中的附件或链接来激活它。它随后会禁用基本系统服务，甚至锁定计算机，以便用户无法访问它。\n\
  \n黑客可以加密计算机上的个人文件，使用户无法访问其数据。黑客通常会提示用户输入只能通过比特币加密货币等神秘方式汇款后才能获得的代码。他们通常还会试图让用户购买合法的解密或移除工具。作者（黑客）是唯一知道所需私有解密密钥的人。\n\
  \n间谍软件通常通过看似有用的程序的 Internet 下载引入系统。与病毒和特洛伊木马不同，间谍软件通常不会自我复制。一旦间谍软件安装在系统上，它就会监控系统的运行并收集用户名、密码、信用卡号码和其他\
  \ PII 等信息。\n\n广告软件会向 Web 浏览器引入不需要的、未经请求的广告显示。它们还可以设计为从浏览器收集用户选择信息，构建更个性化的广告方案。广告软件通常通过下载免费软件（免费软件）等引入系统。\n\
  \n逻辑炸弹是一种通常用于删除数据的恶意软件类型。逻辑炸弹是计算机代码，与其他恶意软件一样，附加到合法程序上。代码保持空闲，直到特定逻辑事件结束。这包括经过一定天数、打开一定数量的程序或执行程序\n\
  \n\n\nspecific manner. Logic bombs are hard to detect because they are often included\
  \ in large programs with thousands of lines of code.\n\n► *Zombies* are infected\
  \ computers that can be placed under the remote control of a malicious user. Zombies\
  \ can be used to create Denial of Service (DoS) attacks that flood targeted networks\
  \ to slow down and sometimes stop servers completely. Computers are often infected\
  \ and become zombies by way of viruses, worms, and Trojans.\n\n► *Botnets* are a\
  \ large collection of zombies, or bots, controlled by a bot herder. This type of\
  \ network can consist of literally millions of unsuspecting computers. Botnets can\
  \ be used to send out spam (usually through email lists) originating from unsuspecting\
  \ users’ computers. It is estimated that 50 to 80 percent of spam worldwide is created\
  \ by zombie computers.\n\nIt is common to install a number of different defensive\
  \ products to protect PCs and their data from unauthorized access and malicious\
  \ interference. Most products these days include protections against multiple fronts.\
  \ The products most widely used for these purposes include:\n\n+   ► Antivirus programs\n\
  +   ► Antispyware programs\n+   ► Spam blockers\n+   ► Pop-up blockers\n\n## Using\
  \ Antivirus Programs\n\nEvery computer should have some means of protecting itself\
  \ against computer viruses. The most common means of virus protection involve installing\
  \ a virus-scanning (antivirus) program that checks disks and files before using\
  \ them in the computer. Several companies offer third-party virus-protection software\
  \ that can be configured to operate in various ways.\n\nIf the computer is a standalone\
  \ unit, it might be nonproductive to have the antivirus software run each time the\
  \ system is booted up. It would be much more practical to have the program check\
  \ any removable media attached to the system, only because this is the only possible\
  \ non-network entryway into the computer.\n\nAll computers with connections to the\
  \ Internet should be protected by an antivirus solution before they are ever attached\
  \ to the Internet. In these cases, setting the software to run at each bootup is\
  \ more desirable. In addition, most antivirus software includes utilities to check\
  \ email and files downloaded to the computer through network or Internet connections.\n\
  \nAs indicated earlier, when an antivirus application is installed on the system,\
  \ it can be configured to provide different levels of virus protection. You will\
  \ need to configure when and under what circumstances you want the virus software\
  \ to run.\n\n## Using Antispyware\n\nAs shown in Figure 9.7, there are basically\
  \ two types of antispyware products available: those that find and remove spyware\
  \ after it has been installed and those that block spyware when it is trying to\
  \ install itself. Both of these methods stand a better chance of keeping computers\
  \ free from spyware when they are combined with user information about how to avoid\
  \ spyware.\n\n![](img/2459befd842d6fed299fabe6da3512d0_242_0.png)\n\nFIGURE 9.7\
  \ Antispyware Product Types\n\nThe detect-and-remove method is by far the simpler\
  \ type of antispyware product to write. Therefore, there are several commercially\
  \ available products that use this method. Like antivirus software packages, this\
  \ type of antispyware product relies on databases of existing definitions to recognize\
  \ spyware threats. These databases must be updated frequently to recognize new spyware\
  \ versions that have been identified.\n\nThe real-time-prevention type of antispyware\
  \ product does not rely on historical data to identify spyware. Instead, it monitors\
  \ certain configuration parameters and notifies the user when suspicious installation\
  \ activity occurs. The user\n\nthen has the option to allow or block the installation\
  \ effort. Some antispyware products incorporate both methods of dealing with spyware.\n\
  \nIn addition to installing antispyware applications, users can fight spyware in\
  \ a number of other ways:\n\n+   - Install a web browser other than Internet Explorer\
  \ (for example, Chrome or Firefox).\n+   - Download the newest browser version that\
  \ offers better security features.\n+   - Work with an ISP that uses their firewalls\
  \ and proxies to block sites that are known to distribute spyware.\n+   - Download\
  \ only software from reputable sites to prevent spyware that comes attached to other\
  \ programs.\n\n## Hardening Operating Systems\n\nAs noted earlier, the second level\
  \ of hardening local computer systems against attacks is to secure their operating\
  \ systems. This involves updating vulnerable code segments of the OS as they become\
  \ known. OS hardening occurs through the application of new programming in the form\
  \ of:\n\n+   - Service packs\n+   - Patches\n+   - Updates\n\n### Service Packs\n\
  \nAfter an operating system has been in the field for some time, vendors may combine\
  \ several product improvements and distribute a numbered service pack for the specific\
  \ operating system being upgraded. Critical files should always be backed up in\
  \ the event that the service pack or OS fails to work after installing the service\
  \ pack.\n\n### Patches\n\nPatches are general improvements to a given operating\
  \ system that have been released for distribution. Many patches and updates are\
  \ purely cosmetic and\n\nSoftware programmers are asked to meet both of these objectives\
  \ in the same product.\n\nIn some cases, the programmers may be trying to create\
  \ a truly open product without concerns about how it might be exploited by malicious\
  \ people. In other cases, they may not be experienced enough to envision how their\
  \ product might be exploited. With the worldwide pool of programmers continuously\
  \ growing, there are many individuals with a significant knowledge base of how to\
  \ test, manipulate, and modify programming. This includes black hat hackers.\n\n\
  ## A Word About Black Hat Hackers\n\nA *black hat hacker* is an individual who possesses\
  \ extensive programming skills and uses them to breach or bypass network security\
  \ structures for malicious or criminal purposes. People in this category of hacker\
  \ are also known as *crackers* or *dark-side hackers*.\n\nThere are also *white\
  \ hat* and *gray hat hackers* who also seek to exploit Internet security vulnerabilities\
  \ and weaknesses, but not for malicious reasons (for example, to perform security\
  \ system analysis checks).\n\nModern operating system and application programming\
  \ is very complex. When programmers initially develop a product, they may make coding\
  \ mistakes or create portions of a product that do not work well with elements created\
  \ by other programmers in the development team. Attackers will often use software\
  \ vulnerabilities to insert and hide malicious code that can be used to disrupt\
  \ services or operations.\n\nIn particular, the attacker may alter the existing\
  \ code to create a condition in the computer’s memory known as a *buffer overflow*,\
  \ which results in erratic behavior, memory access errors, and/or system crashes.\
  \ The system is effectively disabled to the point where the user cannot use it.\
  \ This kind of attack is a type of Denial of Service (DOS) attack.\n\n## Applying\
  \ Software Updates and Patches\n\nFrom the previous section, you can see that due\
  \ to the nature of product development and the pressures on software producers to\
  \ bring new products to the market, new software releases never seem to be complete\
  \ or perfect. As security issues are revealed with software products, their producers\
  \ are forced to issue security patches for their product that correct the weakness.\n\
  \n*Security patches* are updates issued for the specific purpose of correcting an\
  \ observed weakness to prevent exploitation of the vulnerability. Microsoft issues\
  \ security patches for its products once a month. Other software developers use\
  \ dedicated security teams to develop and issue security patches as soon as possible\
  \ after a vulnerability has been discovered.\n\nFor security and stability reasons,\
  \ you should always patch operating systems on computing devices that are connected\
  \ to the Internet. However, this is not the case with all PCs. Stable PC systems\
  \ that are not connected to the Internet should not be patched unless doing so resolves\
  \ some sort of existing problem.\n\n## Hands-On Exercises\n\n### Objectives\n\n\
  +   - Manage the local firewall configuration.\n+   - Explore Windows Firewall with\
  \ Advanced Security.\n+   - Recognize the need for outbound filtering.\n+   - Create\
  \ a port filtering rule.\n+   - Create an ICMP filtering rule.\n\n### Resources\n\
  \n+   - PC-compatible desktop/tower computer system\n+   - Windows 10 Professional\
  \ installed\n+   - User account with Administrative access\n+   - Internet access\
  \ from a network connection\n\n### Discussion\n\nComputers connected directly to\
  \ the Internet are vulnerable to attacks from outsiders. One way to protect standalone\
  \ computers from outside attacks is to install a local firewall.\n\nLocal software-based\
  \ firewalls can be installed on an individual computer to protect it from malicious\
  \ activities introduced through their Internet connection.\n\n\n\n\n\n在某些情况下，操作系统提供了一个内置的防火墙选项，可用于保护本地计算机。\n\
  在本实验中，您将探索与 Windows 防火墙相关的选项，以应用本地（软件）防火墙。您还将认识到需要入站和出站过滤以及测试各种安全选项的需求。在某些场景中，您可能希望下载基于软件的防火墙，但\
  \ Microsoft 已在其操作系统中包含 Windows 防火墙以及具有高级安全性的 Windows 防火墙。\n\n## 程序\n\n### 访问 Windows\
  \ 防火墙基本设置\n\n要访问基本的 Windows 防火墙设置，请按照以下步骤操作：\n\n- 1. 打开计算机电源，如果有选择，请选择 Windows 10\
  \ Professional。\n- 2. 登录到您的管理员帐户。\n- 3. 单击任务栏上的嵌入式搜索栏，输入 Control Panel，然后在显示的菜单中单击\
  \ Control Panel。\n- 4. 如有必要，切换到以 查看方式：小图标 查看控制面板，定位并单击 Windows 防火墙。图 9.8 显示了基本的\
  \ Windows 防火墙设置。\n\n![](img/2459befd842d6fed299fabe6da3512d0_247_0.png)\n\n图 9.8\
  \ 基本 Windows 防火墙设置\n\n在此窗口中，您可以看到每种类型网络的当前防火墙状态。\n\n- 5. 通过单击每个网络右上角的向下箭头展开每种网络类型。检查当前状态和与每个网络关联的规则。将三种网络类型列在表\
  \ 9.2 中。\n- 6. 在左侧窗格中，单击 打开或关闭 Windows 防火墙，位于需要管理员访问权限的 Windows Defender Shield\
  \ 旁边。\n\n在左侧窗格中，打开或关闭 Windows 防火墙 和更改通知 均通向同一个窗口。图 9.9 描述了自定义设置窗口。\n\n![](img/2459befd842d6fed299fabe6da3512d0_248_0.png)\n\
  \n图 9.9 Windows 防火墙自定义设置窗口\n\n此窗口显示与每种网络类型相关的基本选项。您可以打开或关闭防火墙。如果防火墙已打开（推荐），您可以决定是否要阻止所有传入流量，以及是否要在程序被阻止时收到通知。\n\
  \n防火墙检查所有进出外部连接的流量，可以根据期望的属性配置为控制 Internet 与本地设备之间的流量。防火墙配置为仅将数据传递到和来自指定的 IP 地址和\
  \ TCP/UDP 端口。\n\n几乎没有理由关闭 Windows 防火墙（不推荐）。\n\n- 7. 如果任何网络类型已选择 关闭 Windows 防火墙，请单击\
  \ 打开 Windows 防火墙。单击 确定 以退出 Windows 防火墙自定义设置。\n\n### 检查具有高级安全性的 Windows 防火墙\n\n要检查具有高级安全性的\

  \ IP 地址和物理 MAC 地址。\n\n## 使用 NETSTAT 实用程序\n\nnetstat -e 命令将用于显示发送和接收的数据包数量，以及数据传输期间产生的错误数量。netstat\
  \ -r 命令将显示所有当前连接的列表，并指示哪些连接处于活动状态。\n\n- 1. 在命令提示符下，键入 netstat ? 并按 Enter。查看 NETSTAT\
  \ 实用程序的使用说明。\n\n\n\n\n2. 回到命令提示符，输入 netstat -e 并按 Enter 键，显示数据包统计信息，类似于图 13.12 所示。\n\

  \ PC1x 机器上获取的。\n\n## 使用 NET VIEW 实用程序\n\nNET VIEW 实用程序列出当前连接到 LAN 的所有计算机。它还可以显示与特定网络主机关联的所有共享设备。\n\
  \n显示共享设备的格式是 `net view \\\\your server name`，其中服务器名是执行命令的工作站或服务器的实际 NetBIOS 名称。例如，`net\
  \ view \\\\accounting` 将显示名为 accounting 的服务器支持的所有共享设备列表。\n\n- 1. 在命令提示符下，输入 **net\
  \ view ?** 并按 Enter 键。查看 NET VIEW 的使用说明。\n\n2. 在命令提示符下，输入 net view 并按 Enter 键，列出连接到本地\
  \ LAN 的所有节点。结果应该是一个类似于图 13.16 所示的列表。\n\n![](img/2459befd842d6fed299fabe6da3512d0_340_0.png)\n\

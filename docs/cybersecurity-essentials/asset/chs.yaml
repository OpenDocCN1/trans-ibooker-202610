- '## Infrastructure Security in the Real World


  *The following challenges will* provide contextual reference points for the concepts
  you will learn in Part I. Because you have not yet read the chapters in Part I,
  the challenges in this chapter are designed to introduce you to the infrastructure
  security scenarios you''ll face in the real world. In this chapter, you''ll learn
  to:


  - Understand the relevance of infrastructure security

  - Describe the functions, categories, subcategories, and reference structure of
  the NIST Cybersecurity Framework

  - Apply the NIST Framework references to specific cybersecurity scenarios


  ### Security Challenges


  The NIST Cybersecurity Framework was developed by the U.S. National Institute of
  Standards and Technology (NIST) to provide a set of independent guidelines that
  organizations can use to implement or upgrade their cybersecurity programs. Because
  the framework is a product-independent tool, it provides guidelines that any organization
  can tailor to meet its own cybersecurity needs.


  The framework is divided into five functions (Identify, Protect, Detect, Respond,
  and Recover) that provide a top-level description of the cybersecurity development
  process. Each function is then divided into applicable categories that underpin
  the stated function. Each category is further divided into subcategories and implementation
  methodology. Finally, the subcategories are supported by lists of reference documents
  that contain the nuts and bolts of building the cybersecurity program.


  This chapter will kickstart your thought processes for what you are about to learn
  in Part I. It contains two specific cybersecurity scenarios to which you will be
  asked to apply the NIST Framework in order to produce a cybersecurity solution that
  meets the desired objectives. In each case, you will be provided with specific subcategories
  to research, along with some guidance to help you produce your solutions.


  In this first pass through the scenarios, you are expected to generate and record
  general observations about securing the infrastructure described, as you have not
  yet been introduced to the supporting material. As mentioned earlier, this activity
  is designed to get your cybersecurity thought processes started.


  In Chapter 5, you will return to these scenarios and use what you have learned in
  Chapters 2, 3, and 4 to revise your initial assessments. You will also compare your
  observations to those of professional security specialists who have provided their
  observations and solutions for these scenarios.


  ### Infrastructure Security Scenario 1


  You are in charge of planning and implementing a security system for a new electrical
  substation that will be built next to a new housing development. The substation
  is equipped with high-voltage electrical switchgear for the surrounding community.
  It is not manned on a full-time basis but does have a control building that houses
  instrumentation and communication equipment, as shown in Figure 1.1.


  ![](img/2459befd842d6fed299fabe6da3512d0_28_0.png)


  FIGURE 1.1 The Electrical Substation


  The high-voltage switchgear accepts electrical power from different sources, which
  it then conditions and routes to the community users as needed.


  The energy arrives on a set of different high-voltage supply lines and leaves the
  facility via different sets of distribution lines.


  The monitoring devices and control systems in the substation communicate with different
  parts of the utility''s transmission and distribution system to route electrical
  power where and when it is needed. These communication channels include wireless
  radio signals, signals transmitted across the power lines, and traditional network
  communications media.


  ### Risk Assessment 1


  From the information provided in this first scenario, consider the National Institute
  of Standards and Technology (NIST) functions detailed in this section and then record
  your observations as they relate to each category.


  ### See Appendix C for the NIST Cyber Security Framework


  A copy of the NIST Cyber Security Framework is available in Appendix C. This framework
  was developed by the U.S. National Institute of Standards and Technology to provide
  cybersecurity guidelines for Improving Critical Infrastructure Cybersecurity under
  Executive Order 13636. The ultimate goal of this initiative is to provide guidelines
  for the nation''s critical infrastructure in business, industry, and utility organizations
  to reduce their cybersecurity risks.


  ### Identify


  Create an inventory of physical assets (devices and systems) within the substation
  (NIST ID.AM-1).


  ### Understanding NIST References


  NIST references include the function, the category, and the subcategory. In the
  example of ID.AM-1 mentioned earlier, the function is Identify (ID); the category
  is Asset Management (AM); and the subcategory is 1 (which is “physical devices and
  systems within the organization are inventoried”). To implement this portion of
  the Framework for the scenario presented, you may want to refer to an online copy
  of the designated reference documents listed under this subcategory. The same is
  true of the following subcategories as well.






  ### Protect


  一般来说，你可能会如何保护前面提到的物理资产（NIST PR.AC-2）。


  ### Detect


  你将如何知道有人或某物正在尝试访问、禁用、降低性能或破坏变电站中的一个或多个设备和/或系统？你如何检测可能影响变电站运行的异常和事件（NIST DE.CM-2,
  8）？


  ### Respond


  针对通过前面提到的设备、系统和步骤所识别出的异常和事件，你需要如何响应（NIST RS.AN-1, 2, 3）？


  ### Recover


  可以采取哪些步骤来从旨在访问、禁用、降低性能或破坏你之前识别的资产的行动中恢复（NIST RC.RP-1）？


  ## Infrastructure Security Scenario 2


  贵公司正在建设一座新的企业设施，如图 1.2 所示，用于容纳其 5,000 名总部员工。该设施将有多层楼。一些管理人员将使用带门窗的传统办公室，但大多数员工将在开放式隔间中工作。


  每个办公室和隔间都将配备电话和网络连接。此外，许多员工因工作需要而出行，需要便携式电脑。其他员工使用台式个人电脑。


  该设施将容纳一群计算机服务器和网络设备，为所有管理人员和员工提供工作流程和通信。该架构以电子方式操纵、存储和传输公司所有重要的业务信息和数据。这包括产品描述、会计信息、法律记录、客户记录、员工记录以及公司的知识产权。


  ![](img/2459befd842d6fed299fabe6da3512d0_31_0.png)


  FIGURE 1.2 Headquarters Facility Plans


  ## Risk Assessment 2


  根据第二种情况提供的信息，考虑本节中详细说明的 NIST 功能，然后根据每个类别写下你的观察结果。


  ### Identify


  - 创建组织内物理资产（设备和系统）的清单（NIST ID.AM-1）。

  - 创建组织内网络资产（软件平台和应用程序）的清单（NIST ID.AM-2）。

  - 根据资产对组织业务功能的关键性或价值对组织的资产进行优先级排序（NIST ID.BE-3）。

  - 识别产生依赖关系或为组织关键服务提供关键功能的任何资产（NIST ID.BE-4）。

  - 创建已识别资产漏洞的风险评估（NIST ID.RA-1, 3）。


  ### Protect


  - 创建基于以下项目的授权设备和资源访问管理政策（NIST PR.AC-1）。

  - 创建控制对安全资产的物理访问的方法（NIST PR.AC-2）。

  - 创建告知和培训普通员工的行动计划（NIST PR.AT-1）。

  - 创建帮助特权用户理解其工作角色和职责的计划（NIST PR.AT-2）。


  ### Detect


  - 必须部署哪些类型的系统来识别物理安全侵害的发生（NIST DE.CM-2）？

  - 必须部署哪些类型的系统来监控人员活动以检测潜在的网络安全威胁（NIST DE.CM-3）？


  ### Respond


  - 当设施的一般物理安全遭到破坏时，可能需要哪种类型的响应计划（NIST RS.AN-1, 2, 3）？

  - 鉴于公司服务器上保存的信息，当服务器机房的物理安全遭到破坏时，可能需要哪种类型的响应计划（NIST RS.CO-4, 5）？


  ### Recover


  - 当设施中的一个隔间发生一般物理安全侵害时，可能需要哪种类型的恢复计划（NIST RC.RP-1）？

  - 如果设施的服务器安全遭到破坏，恢复计划可能包括哪些项目（NIST RC.CO-1, 2）？


  ### Summary


  记录本章中呈现的风险评估的观察结果。在第 5 章中，你将把这些原始想法和观察结果与阅读第 2、3 和 4 章后产生的想法和观察结果进行比较。你还将能够将你的答案与专业安全专家的答案进行比较。

  '
- "## Understanding Access-Control and Monitoring Systems\n\n如果你跳过了阅读“Introduction”，你可能会想知道为什么整个第一部分都专门用于基础设施安全。然而，正如“Introduction”指出的那样，没有物理安全就没有安全。基础设施安全运营和管理基于三种基本类型的子系统：访问控制和监控系统（本章涵盖）、视频监控系统（第\
  \ 3 章涵盖）以及入侵检测和报告系统（第 4 章涵盖）。在本章中，你将学习：\n\n- 理解以下物理安全概念的应用：访问控制、物理屏障和生物识别\n- 区分身份验证和授权\n\
  - 识别常用的物理访问控制系统/设备，包括键盘、读卡器、生物识别读卡器、接近读卡器、电子插销和磁锁\n\n## A Quick Primer on Infrastructure\
  \ Security\n\n任何安全工作的总体目标都是建立一种安心状态（一种无忧无虑的状态）供个人、团体或组织使用。这种状态理想情况下是通过确保对资产（对象和信息）的专有权、对这些资产的访问以及对这些资产的使用来实现的。这种状态为资产所有者创造价值并提供安心感。\n\
  \n## No Time for Relaxing in the Cybersecurity World\n\n在网络安全领域，真正的无忧状态永远无法实现。新的网络攻击类型不断被设计出来，导致网络安全专家和管理员必须时刻警惕可能造成损害的情况。\n\
  \n安全的一个更现代的定义是建立个人、系统、媒体、内容和对象排除和纳入系统的科学、技术和艺术。它还提供对机器或加工设备等物理资产的更大安全性和利用率。\n\n\
  *物理安全*是建立有形资产排除和纳入系统的科学、技术和艺术。实践中，这涉及旨在打击盗窃、防止物理损坏、维护系统完整性和服务、并限制信息未经授权披露的政策、做法和步骤。\n\
  \n同样，*网络安全*一词涉及保护对财产、系统和设备端口的物理访问，同时保护包括电子、光学和信息对系统数据和控制的访问在内的无形资产。\n\n在任何现代系统中，安全都是物理和网络安全领域协同作用的函数。两者都是支持强大整体安全态势和计划所必需的。\n\
  \n当物理安全举措应用于为企业、组织或社会运营所需的物理和组织结构提供安全保障时，这被称为*基础设施安全*。\n\n虽然我们可能以锁门、巡逻保安或用于保护资产的其他方法等简单的物理形式来思考基础设施安全；但构建有效的基础设施安全系统还有几个额外的组成部分。此类系统通常涉及一系列经过精心规划和测试的、旨在满足或超过运营和组织安全需求的关键安全程序的组合。\n\
  \n如图 2.1 所示，设计和实施物理保护基础设施资产（财产、建筑物、物理空间、系统或设备）计划的一般有三层：\n\n### The Outer Perimeter\n\
  \n保护此空间涉及控制谁可以跨越标记此周界的法律或物理线移动（行走、驾驶、飞行）。\n\n\n\n\n\n典型的物理外围示例包括产权线或建筑物或建筑群的外墙。\n\
  \n## 内围\n\n该周界通常涉及物理屏障，例如墙壁、门和窗户——根据外围的上下文，可能是外部或内部的。\n\n## 内部\n\n这是安全的最内层，由建筑物、办公室、隔间等内部构成，其周围环绕着内围和外围。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_35_0.png)\n\n图 2.1 三个周界\n\n在全面的安全计划中，所有三个层次的控制都会得到解决。每个层次的安全通常由一套专门选定的设备协同工作构成，以提供有效的物理安全系统。\n\
  \n## 保护逻辑周界\n\n网络安全还涉及保护逻辑周界。它们将在后续章节中涉及计算和控制系统、网络和互联网的内容中进行介绍。这里开发的相同安全概念将在遇到这些主题时应用于这些主题。\n\
  \n在每个层次上都有两个概念在起作用：\n\n**自然访问控制方法**  自然访问控制涉及使用自然设计元素，例如结构和景观，来引导人们进出空间。\n\n**领地强化**\
  \  领地强化采用结构、系统和设备来防止未经授权的进入，并在公共和私人之间创造明确的区别。\n\n基础设施安全运营和管理基于三种基本类型的子系统：\n\n- 访问控制和监控系统\n\
  - 视频监控系统\n- 入侵检测和报告系统\n\n在本章中，您将了解访问控制和监控系统。然而，在继续阅读之前，请花几分钟时间更新第 1 章中的安全场景，以反映这些初步想法。\n\
  \n## 访问控制\n\n大多数安全专家一致认为，任何基础设施安全系统的首要和最基本目标是阻止潜在入侵者，如图 2.2 所示。这是访问控制的目标。你无法物理访问的东西就无法造成损害、破坏或被盗。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_36_0.png)\n\n**图 2.2**  访问控制\n\n设计高效访问控制系统的基础涉及三个术语：入境、离境和再入境。按定义，*入境*是个体进入财产的权利，而*离境*是合法离开财产的权利。同样，*再入境*是指重新进入财产的合法权利所使用的术语。\n\
  \n在物理安全的基础上，入境可以定义为个人正确进入财产的物理路径，而离境则是正确离开财产的物理路径。\n\n在安全术语中，*权利*是由某个被认可的权威来源授予某人或某群人的法律特权或许可。该来源可以是政府、合法认可的政府代理人或合法认可的资产所有者。由此推断，被授予访问资产权利的人被称为*授权*的，而未被授予此权利的任何人则被标记为*未授权*。当未经授权的人试图获取他们没有权利访问的资产时，他们就成为*入侵者*。\n\
  \n因此，访问控制涉及能够根据授权控制对资产的入境、离境和再入境，如图 2.3 所示。特别是，限制未经授权人员对重要资产的访问是你能采取的最基本的安全措施。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_37_0.png)\n\n图 2.3 授权\n\n从上一节的列表中可以看出，访问控制始于外围。视所研究的特定示例而定，这可能是组织物理财产的产权线或其设施的前门。\n\
  \n请记住，外围的目标是控制谁可以步行或驾车穿越周界。此处的控制可以简单到在财产边缘种植灌木丛或放置适当的视觉标志以警告未经授权的人不要进入，也可以复杂到带刺铁丝网、带门和武装警卫。\n\
  \n访问控制工作通常延伸到外围和内围之间的区域。这些工作可以包括自然访问控制技术，例如员工和访客停车的战略性放置，以及利用景观特征引导人们前往选定的出入口并阻止其他可能的出入口的进入。这还延伸到清晰地标记设施和财产的入境和离境通道。\n\
  \n## 通过环境设计预防犯罪（CPTED）\n\nCPTED 是一套建筑和物业设计原则，基于预判潜在入侵者的思维过程，以阻止他们付诸行动。\n\n物理基础设施的内围控制涉及使用物理结构，如墙壁、窗户和门，这些结构可以作为屏障，阻碍入侵者从外围向内部区域推进。再次，视所讨论的具体安全场景而定，这些屏障可能是封闭整个内部环境的建筑外部结构的一部分，也可能是控制进出单个工作区域的内部结构。\n\
  \n内部安全是基础设施安全的最内层，涉及监控内围内部区域的活动。这种监控可能包括人性和电子安全系统，以观察、跟踪和检测入侵者以及记录不同活动的证据。赋权人员和电子设备的结合使得内部安全层级成为有效的安保工具。\n\
  \n## 安全政策\n\n将三个安全层级联系在一起的关键组成部分是设计良好的安全政策，说明每个层级如何实施安全。企业和组织制定全面的安全政策，定义谁有权访问不同资产以及在访问时可以对这些资产做什么。\n\
  \n例如，允许员工和访客自由访问组织内部的所有部门会带来各种安全风险。你需要保持访问控制，以创造一个减少人性诱惑的环境。如果每个人都可以在组织内部自由移动，就很难实施保障措施，防止他们访问或获取物理或网络资产。你还需要保持访问控制以防止事故发生。\n\
  \n例如，你不希望销售代表不小心将咖啡洒在工程部门的生产服务器上。\n\n相反，在每个层级制定连贯的访问控制政策，为授权人员提供对选定资产的适当访问级别，同时阻止未经授权人员访问资产。然后根据需要使用正确类型和数量的访问控制设备（传感器、屏障、日志、身份证件或保安）来执行这些政策。\n\
  \n## 关于保安的一句话\n\n> 尽管访问控制设备可能比人工警卫便宜，但警卫能够根据潜在入侵者的行为做出宝贵的判断性决策。他们是安全的象征，可以启动人工判断，并在事件发生期间提供及时干预。\n\
  \n经常使用徽章或智能卡来控制访问。员工在进入 RFID 传感器近距离范围时，也可能通过射频识别（RFID）应答器进行识别。应答器存储访问代码并使用无线接收器和发射器。\n\
  \n这些访问控制技术、系统和设备将在本章剩余部分中详细讨论。\n\n## 物理安全控制\n\n执行访问控制措施最初可能包括在通往办公室的门上安装锁，并用类似的物理屏障将部门或网络部分分开。许多公司有一个前门或入口，包括接待员来控制访问。在营业时间内，接待员充当物理屏障，询问客户访问的性质，如图\
  \ 2.4 所示。\n\n\n\n\n![](img/2459befd842d6fed299fabe6da3512d0_40_0.png)\n\n**图 2.4**\
  \ 物理屏障\n\n在一些机构中，访客可能被要求由一名陪同人员随行，以从物理上限制其在公司内的活动范围。为了进一步加强访问控制，可以安排一名人工警卫来控制对特定受限内部区域（如实验室）的访问，或对通往受限区域（如地下室）的电梯的访问。\n\
  \n夜间，物理屏障可能仅仅是一扇锁着的门。然而，门上也可能配备传感器和报警器。报警器可以是本地报警装置（如警笛），也可以直接连接到外部监控系统或警察部门。\n\n\
  ## 锁与钥匙\n\n在大多数安全周界中，主要的物理屏障是带锁的门。门本身提供物理屏障，但只能挡住诚实的人。而锁则通过其钥匙提供屏障的认证功能。持有钥匙意味着该人要么拥有、要么知晓通过这扇门所需的准入信息。\n\
  \n安全屏障使用多种不同类型的锁。同样，解除锁定机构也使用多种不同类型的钥匙。根据所用锁的类型，钥匙可以是物理钥匙，也可以是逻辑钥匙。\n\n在大多数组织中，只有特定办公室工作的选定人员才可持有钥匙进入其工作环境。保持严格的钥匙管控，并使用明确编码为禁止复制的编号钥匙，有助于让带锁的门继续作为有效的物理屏障。\n\
  \n## 执行严格的钥匙管控政策\n\n为了成功保护上锁门后的设备和想法，必须制定严格的钥匙管控政策。\n\n## 标准钥匙锁闭闩锁\n\n标准钥匙锁闭闩锁的锁定机构与电子电磁式闩锁类似，但通过钥匙来锁闭或撤回。它们为可手动操作的门提供了额外一层安全保护。钥匙锁闭闩锁可配备单锁芯或双锁芯，如图\
  \ 2.5 所示。\n\n![](img/2459befd842d6fed299fabe6da3512d0_41_0.png)\n\n图 2.5 钥匙锁闭闩锁\n\
  \n## 电磁式闩锁\n\n电子操作的闩锁为周界提供更高水平的安全保障。适应于任何安全系统，电子闩锁在需要访问控制的门上作为辅助锁表现出色。\n\n电磁式闩锁（如图\
  \ 2.6 所示）的主要驱动部件是电激活的电磁阀。当电流施加到电磁阀线圈时，线圈周围会产生电磁场。电磁场对线圈中心的磁芯施加磁压力，使其移动。该移动要么接合（激活）物理锁定机构，要么脱离（停用）锁定机构。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_42_0.png)\n\n**图 2.6** 电子闩锁\n\n电磁阀的操作通常由远程开关或电子访问控制系统控制。在后一种情况下，系统通常由智能识别卡访问设备的输入来触发。\n\
  \n电磁式闩锁可以设置为通电时锁定或解锁，并已被美国保险商实验室（UL）列为防盗保护设备。在安全应用中，电磁锁通常配置为在门关闭时自动移动到锁定位置。这有助于防止尾随，即未经授权的人紧跟在获得授权的人身后溜过锁定门。\n\
  \n然而，一些使用自动锁的门需要配置为在 fail-safe 模式下运行（断电时解锁）。必须采用此类配置，以便员工在紧急情况下能通过该门撤离。\n\n配置为在\
  \ fail-secure 模式下运行（断电时锁定）的闩锁门不适合用作紧急出口，因为发生紧急情况时无法通过它撤离周界。对于 fail-secure 锁，门将默认为锁定状态，并因缺少电力而无法打开。\n\
  \n电子闩锁可用于平开门、推拉门、电动门和垂直升降门，也可用于围栏门。\n\n## 密码锁\n\n密码锁要求用户输入个人访问代码，常用于访问控制和管理系统。当用户在密码锁键盘上输入正确的已编程代码时，这些锁会解锁磁力门锁。它们为周界入口区域提供了额外一层安全保护。图\
  \ 2.7 显示了一个密码锁示例。\n\n![](img/2459befd842d6fed299fabe6da3512d0_43_0.png)\n\n图 2.7\
  \ 密码锁\n\n虽然电子门禁键盘可能提供更安全的物理屏障，但为了长期有效，其访问代码需要定期更换。\n\n## 访问控制门\n\n与门类似，出入口闸门也是一种物理屏障，可通过摆动、拉动或升降来控制穿过墙体或围栏的进出。访问控制门可分为两大类：\n\
  \n- ► 平移门\n- ► 摆动门\n\n两种类型均可通过电机驱动装置开启或关闭。门驱动装置的尺寸取决于通道宽度和所选门的重量。\n\n## 平移门\n\n\
  平移门（如图 2.8 所示）用于需要高水平操作安全和安保的场所。\n\n![](img/2459befd842d6fed299fabe6da3512d0_44_0.png)\n\
  \n图 2.8 平移门\n\n许多物理认证系统基于依赖于“拥有”（possession）的单因素认证，例如拥有一个打开锁的钥匙设备。根据打开物理或虚拟锁定机构的需要，钥匙可以是物理钥匙或虚拟钥匙。\n\
  \n更智能和有效的认证方法涉及双因素认证（一种需要两种因素才能授权的过程），基于*知识*（你知道的信息）和*拥有*（你拥有的物品）。\n\n高级授权和认证方法包括多因素授权与认证系统。在这些系统中，信息必须提交给认证设备，认证设备再将其传递给安全控制器的认证系统。在访问控制系统中，通常会使用多种不同的认证设备。本章以下各节将介绍主要的设备类型。\n\
  \n## 磁条阅读器\n\n*磁条卡*是一种类似信用卡的物理设备，其磁条上包含以磁编码点形式存在的认证信息，如图 2.12 所示。持卡人将卡上的磁条划过磁卡阅读器，即可利用卡上的信息访问物理空间或资产。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_48_0.png)\n\n**图 2.12** 磁条卡系统\n\n当磁条通过阅读器的磁传感器时，阅读器读取磁编码信息，并将其转换为数字数据，再传递给主机系统。主机系统的编程决定了卡上的信息是否足以授予持卡人授权和访问权限。\n\
  \n## 智能卡\n\n智能卡也是类似信用卡的设备，通常与磁条卡相似，如图 2.13 所示。然而，由于包含智能电路，它们提供了更高的数据安全性；该电路可在认证过程完成前隐藏用户数据。它们通常包含其所有者的信息，例如密码、个人识别码（PIN）、网络密钥、数字证书，以及其他可用于认证过程的个人身份信息（PII）。\n\
  \n### 关于 PII 的说明\n\nPII 是指任何能够识别个人身份的信息。PII 的示例包括：姓名、家庭住址、社会安全号码、出生日期、指纹，以及其他可能区分不同个体的信息。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_49_0.png)\n\n图 2.13 智能卡\n\n从物理上看，智能卡有多种形态：智能设备、类似信用卡的设备、身份徽章，以及与智能卡读卡器通信的插入式设备。\n\
  \n在内部，所有智能卡设计都包含嵌入卡结构中的微处理器和存储设备。智能卡存储器\n\n\nsection 包含用户特定的识别信息，以及卡片与主机安全系统通信所需的所有编程。\n\
  \n一些使用智能卡的组织会向员工发放单张卡片，他们可以用它进入建筑物、登录计算机并访问适当的应用程序。\n\n智能卡设计为防篡改。篡改智能卡通常会使其失效。此外，使用智能卡时也需要小心，因为即使弯曲也可能使其无法使用。\n\
  \n## RFID 徽章\n\n射频识别（RFID）徽章提供免持访问控制工具，在条形码、磁条和近距离读卡器技术的基础上进行了改进。RFID 系统使用无线电信号通过\
  \ RFID 读卡器设备和 RFID 标签来识别唯一物品，如图 2.14 所示。\n\n![](img/2459befd842d6fed299fabe6da3512d0_50_0.png)\n\
  \n图 2.14 RFID 系统\n\n读卡器通过无线电频率数据与 RFID 标签进行发送和接收。每个标签将发送给它的数据存储在其嵌入式集成电路（IC）设备上。虽然存储在\
  \ RFID 标签上的具体信息由 RFID 系统程序员决定，但它通常由一个识别其自身的序列号以及与该标签关联的物品的信息组成。\n\n当系统想要了解与标签相关联的内容，例如它关联的是什么（或谁）或它在何处时，它只需发出请求，这会导致被寻址的\
  \ RFID 标签通过其内置天线辐射其信息。读卡器接收来自标签的数据并将其转发给主机计算机进行处理。这种技术最有趣的部分是，无源 RFID 标签能够在没有外部电源的情况下执行其任务。\n\
  \n## 生物特征扫描仪\n\n*生物特征* 是指使用人体生理特征来验证个人身份的访问控制机制的术语。生物特征认证涉及使用独特且个人化的生理特征来验证人们的身份。\n\
  \n每个人的生理特征都是独一无二的，可以将其与他人区分开来。即使是同卵双胞胎也有各自不同的声音模式、指纹、眼睛特征和其他特征。生物特征认证中最常涉及的特征包括声音模式、指纹、手掌印、签名、面部特征以及视网膜和虹膜扫描，如图\
  \ 2.15 所示。\n\n在每种情况下，都需要生物特征扫描设备将生理量转换为数字表示。结果存储在数据库中，可在认证过程中使用。底层应用程序将使用数据的真正独特质量作为与未来访问请求进行比较的基础。如果来自未来认证请求的数据与存储版本的要点匹配，则将授予访问权限。\n\
  \n然而，并非所有生物特征扫描设备在验证用户方面的准确性都相同。在表 2.1 中，美国政府的数据显示了不同生物特征扫描设备在准确验证人员方面的能力。\n\n###\
  \ 表 2.1 生物特征设备比较\n\n|  | 误报率 | 误拒率 |\n|---|---|---|\n| 手掌印 | 1.43% | 4% |\n| 面部结构\
  \ | 0.1% | 0.8 – 1.6% |\n| 声音模式 | 2 – 5% | 5 – 10% |\n| 眼睛（视网膜或虹膜） | 0.1% | 1.1\
  \ – 1.4% |\n| 签名 | 0.49% | 7.05% |\n| 指纹 | 2.2% | 2.2% |\n\n手掌印\n\n面部结构\n\n声音模式\n\
  \n眼睛（视网膜或虹膜）\n\n签名\n\n指纹\n\n图 2.15 典型的生物特征认证方法\n\n总体而言，人眼的特征——虹膜和视网膜扫描——往往是最可靠的认证来源。在列表中剩余的生物特征变量中，指纹读数往往比语音扫描更准确。然而，指纹可以存储在透明表面上并在以后使用。另一方面，疾病和用户压力水平会影响声纹。\n\
  \n如表 2.1 所示，存在两种基本的认证失败类型：\n\n**类型 1 – 误拒或误拒失败** 这是一份产生对个人的错误拒绝的报告，从而将其锁定在他们本应能够访问的设施或安全区域之外。\n\
  \n**类型 2 – 误接受或误报失败** 这是一份错误地对个人进行认证的报告，这可能导致向此人无法访问的设备或数据提供访问权限。在两种认证失败类型中，这是最重要的一种，因为它可能授予恶意人员访问权限。\n\
  \n由于存在错误报告和不准确的可能性，可能需要在与生物特征设备一起使用时使用第二种访问控制方法。在需要更高安全性的区域，可能需要使用护照、额外的指纹或其他类型的验证，以确保个人没有被错误认证。\n\
  \n## 远程访问监控\n\n远程监控是指从远程位置或控制室对设备进行监控或测量。在安全领域，这涉及通过通信系统对安全系统进行外部访问。\n\n远程访问监控系统用于在未经授权的访问尝试时通知主管安全人员。在这些系统中，控制器监控基础设施传感器的开/关状态。当磁性开关或运动探测器等传感器被激活时，系统会自动将其识别为入侵并通知指定的安全人员。\n\
  \n通知可以以安全控制面板上的视觉通知、电话呼叫、即时通讯通知或发送到智能手机的短信的形式出现。通知还可能涉及激活频闪灯和高强度警笛以引起对入侵尝试的注意。图\
  \ 2.16 显示了远程访问典型安全系统的不同选项。\n\n![](img/2459befd842d6fed299fabe6da3512d0_54_0.png)\n\
  \n**图 2.16** 远程访问通信选项\n\n## 开启和关闭状态监控\n\n各种传感器可用于检测自动门或闸门的开启、关闭、锁定或未锁定状态。它们也可以配置为在指定的门或闸门处启动开启、关闭、锁定或未锁定状态。\n\
  \n> ### 关于传感器的说明\n> \n> 因为开启和关闭状态与锁定和未锁定状态不同，单个传感器无法区分这两种状态。需要安装并监控第二种或不同类型的传感器来执行此区分。\n\
  \n图 2.17 显示了简单的磁性传感器和用于可移动屏障（门、闸门或窗户）的匹配触点组。当门打开时磁性开关触点断开时，传感器的发射器会向控制面板或紧急拨号器发送信号。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_55_0.png)\n\n在屏障打开和关闭之间的时间段内，传感器与控制器之间的信号和报告是连续的。如果屏障在指定时间内保持打开状态，该信息也会被系统记录。状态监控系统包括事件日志，详细记录各种事件的时间和日期。例如：\n\
  \n**锁定状态监控** 锁定监控是一项功能，允许安全主管确认门已锁定。除了监控门或闸门的锁定状态外，状态监控系统还可以提供门或闸门保持锁定的时间和时间段的详细信息。\n\
  \n**未锁定状态监控** 状态监控系统可以记录并发出信号，每次特定闸门或门被解锁（授予访问权限）时以及授予了何种类型的访问权限。未锁定监控还可以识别谁被授予了访问权限。\n\
  \n**每日时间设置** 大多数自动访问控制系统基于预配置的每日时间设置来决定有效或无效的进入请求，也称为 *交易*。这是正常的，因为任何不符合已识别用户预定义时间配置文件或时间表的进入请求都将受到怀疑。\n\
  \n这种情况可能发生在日常送货比预期晚到达时。在这种情况下，用户，即被识别的送货代理，已被识别，但正在尝试在未经授权的时间进入。授权的人类主管需要介入以接受送货。\n\
  \n\n\n\n\n## 自动化门禁系统\n\n自动化门禁功能为标准的安全监控和报告功能增添了另一个维度。虽然自动化门禁并不是典型入侵检测和监控系统的组成部分，但它增加了周界出入控制的安全性和便利性。自动化门禁系统有两种类型：远程访问控制系统和远程控制访问系统。\n\
  \n远程访问控制是一种设计功能，通过位于与访问点不同位置的身份验证系统，对进入安全区域（安全区域或计算机系统）的人员进行身份验证来管理对受保护区域的进入。\n\n\
  这可以通过多种方法实现，包括密码阅读器、磁性钥匙卡和秘密密码锁代码。\n\n尽管差异很小，但远程控制访问系统的设计考虑与远程访问系统不同。远程控制访问是一种设计功能，与远程监控系统配合使用，可从远处监控、控制和监督门、闸门和运输工具。图\
  \ 2.18 显示了远程访问控制系统中涉及的典型组件。\n\n![](img/2459befd842d6fed299fabe6da3512d0_56_0.png)\n\
  \n图 2.18 远程控制操作\n\n远程控制功能使安全专家能够与远程站点建立通信，输入访问代码，获取当前状况并设置系统参数。闭路电视系统可添加到安全系统中，以为远程控制选项提供视觉识别功能。一些远程监控和控制系统，例如图\
  \ 2.19 中所示的系统，还可用于获取有关任何传感器的状态消息，该传感器检测到超出程序设定值的值，例如热量、寒冷、水泄漏、噪音、报警历史记录或其他自定义功能。\n\
  \n![](img/2459befd842d6fed299fabe6da3512d0_57_0.png)\n\n图 2.19 远程监控系统\n\n无线通信设备通常用于连接自动化门禁系统的组件。这种连接性是一种经济的解决方案，可消除控制设备、对讲机以及电动安全门和大门之间布线的需求。\n\
  \n### 实践练习\n\n在本练习中，您将学习如何保护外围区域。目标包括：\n\n- 对于给定的设施，定义其外围、内围和内部区域，并确定与每一层相关的关键漏洞。\n\
  - 对于指定的设施及其漏洞，进行研究以确定可用于保护这些点的组件（设备和系统）有哪些，以及您找到的组件的成本选项。\n- 为设施的外围设计一个访问监控和控制系统，使客户能够实施所需的安全系统来监控和控制对其设施的访问。\n\
  \n本练习所需的资源如下：\n\n- 互联网访问\n- 铅笔/钢笔和纸\n\n### 讨论\n\n图 2.20 显示了 ACME 仓库设施。该设施用于存放准备发货的\

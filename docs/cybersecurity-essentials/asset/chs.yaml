  \n+   1. 在此文件夹中，您应该看到您作为 TestUser1 创建的四个文本文档。双击 test1 尝试打开它。是否被允许？\n+   2. 通过删除文件中的所有文本并输入“This\
  \ is no longer a test.”来调整文本。点击“文件”，然后点击“保存”。系统要求您确认文件名；点击“保存”。系统询问“确认另存为”以替换文件；点击“是”。\n\

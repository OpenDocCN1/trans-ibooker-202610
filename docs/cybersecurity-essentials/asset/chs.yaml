  ## Review Questions


  1. 哪种类型的门禁设备可能是保护 CEO 办公室门的良好建议？


  Answer: A biometric ID device, a cipher lock, or a keyed lock. The information available
  in most executive offices typically requires some kind


  of protection. The level of security depends on the organization''s tolerance for
  risk and should be based on a risk assessment. This typically holds true for other
  management offices (for example, accounting and sales/marketing offices).


  2. **哪种类型的门禁设备可能是保护供应室和清洁工储物间门的良好建议？**


  **Answer:** Either a simple keyed lock or no lock at all. These closets do not contain
  valuable assets and are often shared by various levels of employees requiring access
  so they may not require any security beyond a door.


  3. **红外运动探测器在 ACME 设施的什么位置是合适的选择？**


  **Answer:** In the open floor area of the warehouse. There are no access points
  to monitor, so motion detectors can provide good wide-area monitoring for interior
  zones. Of course, these devices would only be effective during the evening and weekend
  time periods when the warehouse operation was closed down and unattended.


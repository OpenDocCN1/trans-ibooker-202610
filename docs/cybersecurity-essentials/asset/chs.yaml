  \n- *Security* is the science, technique, and art of establishing a system of exclusion\
  \ and inclusion of individuals, systems, media, content, and objects.\n- *Physical\
  \ security* is the science, technique, and art of establishing a system of exclusion\
  \ and inclusion for tangible assets. In practice, this involves policies, practices,\
  \ and steps aimed at combating theft, preventing physical damage, maintaining system\
  \ integrity and services, and limiting unauthorized disclosure of information.\n\
  - *Cybersecurity* involves securing physical access to property, systems, and equipment\
  \ ports while securing intangible assets including electronic, optical, and informational\
  \ access to the system’s data and controls.\n- *Infrastructure security* refers\
  \ to physical security initiatives that are applied to providing security for the\
  \ basic physical and\n\n- A key component that brings all three levels of security\
  \ together is a well-designed security policy that states how security is implemented\
  \ at each level.\n- A cohesive access control policy at each security level provides\
  \ authorized people with appropriate levels of access to selected assets, while\
  \ inhibiting access to assets by people who are not authorized.\n- *Authentication*\
  \ is the process of determining that someone is who they say they are.\n- Effective\
  \ access control involves being able to control the ingress, egress, and regress\
  \ to an asset based on authorization. In particular, limiting the access of unauthorized\
  \ personnel to important assets is the most fundamental security objective.\n- Multiple\
  \ factors are involved in authentication:\n  - Knowledge—Something that only the\
  \ designated person should know (something you know)\n  - Possession—Something that\
  \ only the designated person should have (something you have)\n  - Inherence—Something\
  \ that only the designated person is (something you are)\n  - Location—Somewhere\
  \ you are\n- Many physical authentication systems are based on single authentication\
  \ factors that depend on possession.\n- Intelligent authentication methods involve\
  \ *two-factor authentication* (a process that requires two of the factors to grant\
  \ authorization) based on knowledge and possession.\n- *False rejection* or false\
  \ negative failures are reports that produce an incorrect rejection of the individual,\
  \ thereby locking them out of a facility or security area to which they should have\
  \ access.\n- *False acceptance* or false positive failures are reports that incorrectly\
  \ authenticate the individual, which could provide access to equipment or data that\
  \ this person should not be able to access. Of the two types of authentication failure,\
  \ this is the most significant in that it could grant access to malicious people.\n\
  \n\n\n\n\n- *远程监控*是指从远程位置或控制室对设备进行监控或测量。在安全领域，这涉及通过通信系统对安全系统进行外部访问。\n- 远程访问监控系统用于在未经授权的访问尝试时通知监督安全人员。\n\
  - 由于开/关状态与锁/未锁状态不同，单个传感器无法区分这两种状态。需要安装并监控第二种或不同类型的传感器来执行此区分。\n- 远程访问控制是一种设计功能，通过位于访问点以外位置的身份验证系统来验证进入受保护区域的人员身份，从而管理对受保护区域的进入（安全区域或计算机系统）。\n\
  - 远程控制访问是一种设计功能，与远程监控系统配合使用，可从远处监控、控制和监督门、闸门和运输工具。\n- 功能性入侵检测和报告系统通常包括一个智能控制面板，通过电线或无线电信号连接到设施或组织各处的传感器。\n\
  - 每种安全控制器型号都设计为处理特定数量的可编程区域。区域可以是单个保护点，例如运动探测器，也可以将多个点组合成一个区域。\n- *传感器*是一类输入设备，可将物理活动转换为可呈现给安全控制器的信号。它们有多种配置可供选择，包括用于门窗的磁性开关、声学探测器、振动探测器、运动探测器和玻璃破碎探测器。传感器保护外围、选定的外部区域以及设施内部的开放空间。\n\

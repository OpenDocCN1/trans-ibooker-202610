  \ 创建局域网节点列表\n\n3. 在以下行中记录 NET VIEW 列出的主机名：\n\n4. 在命令提示符下，输入 net view \\\\host name（将\
  \ host name 替换为步骤 3 中列出的某个主机的 NetBIOS 名称）。\n\n## 运行 *PING*\n\nPING 命令是 TCP/IP 故障排除的关键工具之一。它使数据包发送到指定的\
  \ IP 地址，然后返回到发起机器。如果 IP 地址当前不活动，则会出现一条消息，说明事务已超时。\n\n当连接到网络出现问题时，可以使用 PING 测试尝试连接的机器上的\
  \ TCP/IP 功能。如果在 *环回地址* (127.0.0.1) 和发起设备自身的网络 IP 地址之间成功执行 PING，则基本可以确定主机设备上的 TCP/IP\
  \ 工作正常。\n\n下一步是测试网络服务器和/或默认网关的 IP 地址。\n\n作为最终测试，PING 远程主机服务器的 IP 地址。\n\n> **注意**\
  \ 对于发起计算机的 IP 地址或本地服务器的 IP 地址，请运行 IPCONFIG 或查阅表 13.1 中的数据。\n\n- 1. 在命令提示符下，输入 **ping**\
  \ 并按 Enter 键。查看 PING 的使用说明。\n- 2. 在命令提示符下，输入 **ping 127.0.0.1** 并按 Enter 键，测试本地主机上的\
  \ TCP/IP。\n- 3. 在命令提示符下，输入 **ping xxx.xxx.xxx.xxx**（其中 xxx.xxx.xxx.xxx 是表 13.1 中列出的主机\
  \ IP 地址）。\n- 4. 按 Enter 键测试本地 TCP/IP 连接。应出现类似于图 13.19 的屏幕。\n\n![](img/2459befd842d6fed299fabe6da3512d0_343_0.png)\n\
  \n**图 13.19** 测试本地主机和 TCP/IP\n\n5. 在命令提示符下，输入 ping 8.8.8.8 并按 Enter 键，测试与 www.google.com\
  \ 的连接。\n\n6. 应出现类似于图 13.20 所示的屏幕。\n\n![](img/2459befd842d6fed299fabe6da3512d0_344_0.png)\n\
  \n图 13.20 Ping 远程 Google 服务器集群\n\n注意：此示例显示了 ping 8.8.8.8 Google 属性和 www.google.com\
  \ 域名的结果，以便您可以同时看到这两个结果。\n\n7. 关闭所有打开的窗口并关闭两台学生 PC。\n\n## 实验问题\n\n- 1. 哪个命令行实用程序用于查找计算机的主\

  md: 'the browser to retrieve that document, losing the performance benefit provided
    by putting the CSS directly inside of the HTML.


    # 1.4 The cascade of cascading style sheets


    One of the fundamental points to understand about CSS is the cascade. When CSS
    was formed, it was around the concept of cascading, which allows styles to overwrite
    or inherit from each other. This then paved the way for multiple stylesheets which
    compete over the presentation of the web page.


    Because of this, while inspecting an element using the browser''s developer tools,
    we can sometimes see multiple CSS values fighting over each other to be the one
    rendered by the browser. How the browser decides which CSS property values to
    apply to an element is through specificity.


    Specificity is when the browser (or the user-agent) decides which declarations
    are relevant to the HTML and applies the styling to that element. One aspect in
    which specificity is calculated is the order in which style sheets are applied.
    When multiple stylesheets are applied the styles in the later will override styles
    provided by the previous stylesheet. In other words, the last one declared wins.


    In CSS there are three different stylesheet origins.


    # 1.4.1 User-agent style sheets


    The first origin is the browser''s default styles. When we first opened the project,
    before we added any styles to it, our elements did not all look the same. Our
    headers are bigger and bolder than our text for example. This is defined by the
    user-agent (UA) style sheet. These have the lowest priority and we find that different
    browsers present HTML properties slightly differently.


    Most of the time UA stylesheets set the font size, border styles, and some basic
    layout for form elements, like the text input or progress bar. This can be useful
    if the user stylesheet cannot be found or there is an error loading the file.
    The UA stylesheet provides some fallback styling, which allows the user to still
    use the website.


    # 1.4.2 Author stylesheets


    The stylesheets we as developers write are known as the author stylesheets and
    they typically have the second highest priority in terms of the styles the browser
    displays. When we create a web page the CSS stylesheets we write and apply to
    our web pages are Author stylesheets.


    # 1.4.3 User stylesheets


    The user who is accessing our web page can use their own stylesheet to override
    both author and UA styles. This can improve their experience, especially for disabled
    users.


    Instances of where a user may use their own style sheets include to set a minimum
    font size, choose a custom font, improve the contrast or increase the spacing
    between elements. Any user can apply a user stylesheet to a webpage.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'How these are applied to the webpage will depend on the browser, usually through
    the browser settings or by using a plugin.


    Once applied the, the user stylesheet is only applied for the user that added
    it, on the browser they applied it to. Whether the change is carried over from
    one device to another, will again depend on the browser itself and its ability
    to sync plugin and setting cross devices.


    # 1.4.4 CSS reset


    Default styles provided by the browser are not consistent. Each browser has their
    own stylesheets. Default styles are different in Chrome than they are in Safari
    for example. This can create some challenges if we want our applications to look
    the same across all browsers. Luckily for us there are two options available,
    CSS Resets or Normalize. Although either can be used to solve cross browser styling
    issues, they work in radically different ways.


    Reset says we don''t want any of the browser default styling at all and resets
    them all. Without any author styles applied, all elements regardless of what they
    are, look like plain text as we can see in Figure 1.7.


    ![](img/b56145aa9b751926a7aedbd7172bc818_18_0.png)


    Figure 1.7 CSS Reset applied


    To apply CSS Reset to our project first we create a reset stylesheet to add to
    our project. In our project folder we create a file called reset.css. We then
    copy the reset CSS into the file.'

    # 10.9 Handling forced-color mode


    Forced colors mode¹⁸ is a high contrast setting that allows a user to limit the
    color palette used to a series of colors that they set on their device. Windows’
    High Contrast mode is an example of this use case. When this mode is enabled it
    affects many CSS properties including some that we have used most notably background-color.
    We utilized background-color to determine whether the inner portion of the radio
    and checkbox inputs were visible



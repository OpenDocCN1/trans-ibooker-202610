    # 10.8 Adding hover and focus styles to form elements


    Because we want our form to be accessible, we need to make sure we include hover
    and focus styles on our controls and buttons. We already handled the hover styles
    for radios and checkboxes but not the focus. For the other elements we haven’t
    considered either.


    Let’s start with focus since we still need to apply it to everything on our form.
    Focus is very important for users who navigate the web via the keyboard rather
    than clicking on elements using a mouse. It gives the user a visual indicator
    of which element currently has focus.


    # 10.8.1 :focus versus :focus-visible


    Because showing the focus styles all the time, regardless of how the user is navigating
    the web can be overwhelming depending on the design, a new property was recently
    added to the CSS specification that applies focus styles based on the user’s modality,
    either keyboard or mouse. The pseudo class :focus-visible allows us to add styles
    when the user is



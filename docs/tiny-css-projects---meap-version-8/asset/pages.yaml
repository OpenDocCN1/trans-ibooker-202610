- pgno: 38
  md: "In our project we have an SVG graphic within our HTML document. To declare\
    \ a namespace in HTML we use the `xmlns` attribute. As we have learnt, it is optional\
    \ to declare the namespace for an SVG graphic as it is a known foreign element,\
    \ but we will declare it in this instance (Listing 1.10):\n\n# Listing 1.13 SVG\
    \ Namespace\n\n```\n<svg xmlns=\"http://www.w3.org/2000/svg\">\n  <!--SVG Code-->\n\
    </svg>\n```\n\nNow that our SVG is in our HTML and we have optionally added the\
    \ `namespace` value in the `xmlns` attribute, we need to add this known namespace\
    \ to our CSS. In the CSS file at the top of the style sheet we add the `namespace`\
    \ rule.\n\nThis is formed by writing `@namespace`. Then we give the namespace\
    \ a prefix. The prefix given to the namespace can be whatever we choose, but for\
    \ simplicity we have stuck with `svg` as this is the code we want to target. The\
    \ name prefix is case sensitive, so `Svg` would be treated differently to `svg`.\
    \ Then we add the `namespace` URI string in quotes: `@namespace svg \"http://www.w3.org/2000/svg\"\
    ;`\n\nNow that we have declared the namespace in our CSS let’s look at how it\
    \ can work with the universal selector.\n\nWe can use the universal selector to\
    \ style all elements within that namespace. In other words, we style all elements\
    \ within a certain coding language, like HTML or SVG. We can use the universal\
    \ selector in the following ways:\n\n+   - `*` or `*|*` - matches all elements,\
    \ regardless of their namespace\n+   - `ns|*` - matches all elements in the namespace\
    \ `ns`\n+   - `|*` - matches all elements without any defined namespace\n\nThe\
    \ next step is to write our CSS rule. We want to apply a background color to our\
    \ two SVG elements without styling the HTML. The first step is creating the selector,\
    \ which is the namespace rule we called svg, followed by a pipe (|) and then an\
    \ asterisk (*) which matches all elements in the svg namespace as seen in Listing\
    \ 1.11.\n\nOur declaration will be `fill` with a light gray Hex value of `#EDEDED`.\
    \ We can specify as many namespaces as we want. But that namespace rule only applies\
    \ to that stylesheet, so we will need to declare it once for each stylesheet we\
    \ intend to use it in.\n\n# Listing 1.14 Namespace selector\n\n```\nsvg|* {\n\
    \  fill: #EDEDED;\n}\n```\n\nOnce applied, we can see that the elements in our\
    \ svg image now have a gray background (Figure 1.24)."

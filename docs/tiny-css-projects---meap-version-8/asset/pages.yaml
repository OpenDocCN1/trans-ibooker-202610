- pgno: 109
  md: 'needs to have inside of our at-rule. We will use three properties: `symbols`,
    `system`, and `suffix`.


    # 4.2.1 Symbols


    The symbols property defines what will be used to create the bullet style. To
    define our emoji as the symbol we want to use we can either use the emoji directly
    or use its unicode value. Unicode is a character encoding standard that specifies
    how a 16 bit binary value is represented as a string. In other words, it''s the
    code representation of our emoji. The actual emoji image is determined by the
    operating system and browser which is why we see variations in how emojis look
    between iOS and Android for example. The unicode value tells the machine what
    to render. We use look-up tables such as the one found at https://unicode.org/emoji/charts/full-emoji-list.html
    to find this value for our emoji. 🫖 is listed as having the following code: U+2615.
    To tell our CSS that we are using a unicode value we will replace the U+ with
    a backslash (\). Using the unicode value our declaration will therefore look as
    follows: `symbols: "\2615"`. If we just use the emoji, our declaration will be
    `symbols: 🫖;`


    Next we need to define our system.


    # 4.2.2 System


    We are styling a list. Regardless of type (ordered or unordered), under the covers,
    the browser keeps track of the list item it is styling based on its position inside
    the list. The first item''s integer value is 1, the second 2 and so on. What the
    `system` property value does is define the algorithm used to convert that integer
    value into the visual representation we see on the screen.


    We are going to use the `cyclic` value. Earlier we only provided one emoji in
    our `symbols` declaration, but we could have included multiple different emojis
    using a space delimited list. A `cyclic` value tells the browser to loop through
    these values and when it runs out, to start back at the beginning. Since we only
    have one value, it will apply the 🫖 to the first list item and run out of symbols.
    Having run out getting to the second list item, it will start back at the beginning
    of the list applying the 🫖 once again but to the second list item this time. Then
    it will run again moving on to the third list item and the cycle continues.


    Finally we will set a suffix.


    # 4.2.3 Suffix


    The `suffix` property defines what comes between the bullet (our emoji) and the
    contents of the list item. By default it''s a period. We want to replace the period
    with plain white space between our emoji and list item content. We will therefore
    set our suffix property value to " " (a blank space).'

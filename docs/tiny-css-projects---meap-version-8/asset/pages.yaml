    this we will use the font-family property, assigning it "Raleway" as a value.
    We also apply a fallback of sans-serif. Should Raleway fail to load, we ensure
    that a comparable alternative will be used (Raleway is a sans-serif font). By
    applying the style to the body tag, we make full use of cascading and the font
    will be applied everywhere.


    With the font-family applied, we are now going to set the default color for our
    text. Also on the body, use the color property to assign a color to the text.
    We are going to use a value of #171717, which looks almost black. We aren’t using
    black with this design because it is a very soft design and pure black can be
    quite harsh.



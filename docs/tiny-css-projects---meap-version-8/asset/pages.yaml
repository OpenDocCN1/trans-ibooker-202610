- pgno: 30
  md: "#A Parent Item (.list)\n#B Children of .list\n#C Grand child of .list\n#D Great\
    \ grandchildren of .list\n\nWe are going to style only the list items (the children)\
    \ in a crimson color, without affecting the nested list items (the great grandchildren).\
    \ So the browser will find the `list` class and target just the child list items\
    \ (`li`) directly under the `list` class and change the `color` to `crimson`.\
    \ We will use the following CSS: `.list > li { color: crimson; }`\n\nAs we can\
    \ see in Figure 1.17, the list items are now in crimson while the nested list\
    \ items are still black. This is one of the benefits of using the child combinator.\
    \ It allows us to style just the child elements but not the grandchildren or anything\
    \ further down the hierarchy.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_30_0.png)\n\
    \nFigure 1.17 Child combinator applied to list items\n\n*So we can do this in\
    \ reverse and select the parent of the child element, right?* The short answer\
    \ is no. There is currently no way to select the parent item in CSS, so the following\
    \ example would not work: `article < p { color: blue; }`.\n\n# 3. ADJACENT SIBLING\
    \ COMBINATOR (+)\n\nWhen we need to style an element that is at the same level\
    \ as another (like how your brother or sister is on the same level of the family\
    \ tree as you) we can use the adjacent sibling combinator.\n\nIf we want to target\
    \ the element that is directly after another we can use the adjacent sibling selector.\n\
    \nIn this example (Listing 1.7), the browser will find any uses of the `header`\
    \ tag and then target the first paragraph (`p`) immediately after (or adjacent)\
    \ to the `header` tag and change the `font-size` to `1.5rem` and the `font-weight`\
    \ to `bold`.\n\n```\nListing 1.8 Adjacent sibling combinator\n\nheader + p {\n\
    \  font-size: 1.25rem;\n  font-weight: bold;\n}\n```\n\nFigure 1.18 shows the\
    \ code applied to our article."
  merge: -1
  img_proc: true

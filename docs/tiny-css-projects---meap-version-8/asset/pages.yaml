    # 6.1 CSS custom properties


    In our layout, specifically when we style the profile image and colored portion
    at the top of the card under the image, we are going to need to use the image
    size value for a number of calculations. In other languages like JavaScript, when
    we have a value we are going to be referencing multiple times we use variables.
    In CSS we have custom properties also sometimes referred to as CSS variables.


    To create a custom property we prefix the variable name with 2 dashes (--) immediately
    followed by the variable name. We assign the value in the same way we do any other
    property with a colon (:) followed by the value. A CSS variable declaration would
    therefore looks as follows: `--myVariableName: myValue;`


    Like any other declaration, we need to define our variables inside of a rule.
    For our project we are going to define our colors and image size and declare them
    inside of a body rule as seen in listing 6.2. Since we define our variables on
    the body, the body element and any its descendants will have access to the variables.


    Notice that we can assign different types of values to our variables. We assign
    colors, such as in our --primary variable (probably one of the most common uses
    for CSS custom properties), but we also define a size (--imageSize), a font family,
    and a gradient (--page-background).


    To reference the variable and use it as part of a declaration, we use the following
    syntax: `var(--variableName)`, therefore to assign our text color for example
    would declare: `color: var(--text-color);`'
  merge: -1

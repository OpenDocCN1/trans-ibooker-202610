- pgno: 162
  md: "# 6.2 Full height backgrounds\n\nA linear gradient is a type of image. When\
    \ we apply an image as a background to an element in CSS, if the image is smaller\
    \ than the element, the image will repeat or tile. In this particular case we\
    \ don’t want the image to repeat.\n\nWe have 2 ways we can fix this:\n\n+   -\
    \ We can tell the background we don’t want it to repeat using `background-repeat:\
    \ no-repeat;` However since our body element is only as tall as its contents,\
    \ if the window is taller than the content we will be left with an unsightly white\
    \ bar at the bottom of the page which is not ideal.\n+   - Our second option (the\
    \ one we will use) is to make both the html and body take the full height of the\
    \ screen rather than have it size itself to contents within.\n\nWe therefore add\
    \ the rule found in Listing 6.3 to our stylesheet.\n\nWe reset to margin and padding\
    \ to 0 because we want to ensure we go edge to edge inside of the window.\n\n\
    To set the height, we actually use `min-height` because should the content length\
    \ be greater than the height of the window, we still want the user to have access\
    \ to the content and for the background to be behind it. By using `min-height`\
    \ we instruct the browser to make the `body` and `html` elements at a minimum\
    \ the height of the window. If the contents would force the elements to be taller,\
    \ then the browser will use the height of the content.\n\nThe value we set for\
    \ `min-height` is `100vh`. Viewport height (vh) is a unit that is based on the\
    \ height of the viewport itself. It is percentage based so assigning a value of\
    \ `100vh` to `min-height` means we want the element to have, at minimum, a height\
    \ equal to 100% of the viewport height.\n\n# Listing 6.3 Making the background\
    \ full height\n\n```\nhtml, body {\n  margin: 0;\n  padding: 0;\n  min-height:\
    \ 100vh;\n}\n```\n\nNow that we have our background set (Figure 6.4), let’s style\
    \ the card."
  merge: -1
  img_proc: true
- pgno: 163
  md: "![](img/b56145aa9b751926a7aedbd7172bc818_163_0.png)\n\nFigure 6.4 Full screen\
    \ gradient background\n\n# 6.3 Styling and centering the card using flexbox\n\n\
    Let’s start with styling the card itself. We will give it a white background and\
    \ shadow to give our layout some depth. Notice that instead of using the color\
    \ value for the background, we use our background variable.\n\nWe are also going\
    \ to set the width of the card to 75vw. Viewport Width (vw) is the horizontal\
    \ counterpart to the viewport height (vh) unit we used earlier. It is also percentage\
    \ based, so by setting our width to 75vw we are setting the width of the card\
    \ to be 75% of the total width of the browser window.\n\nWe are then going to\
    \ further constrain the width of the card to a maximum of 500 pixels wide. By\
    \ using both the width and max-width properties, we allow for the card to shrink\
    \ when the screen size is narrow but constrain the card from becoming too wide\
    \ and unruly on larger screens.\n\nLastly we curve the corners of the card using\
    \ border radius to soften the design. Listing 6.4 shows our card rule.\n\n# Listing\
    \ 6.4 Styling the card\n\n```\n.card {\n  background-color: var(--card-background);\n\
    \  box-shadow: 0px 0px 55px rgba(38, 40, 45, .75);\n  width: 75vw;\n  max-width:\
    \ 500px;\n  border-radius: 4px;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Figure 6.5 shows the styles applied to our project. With some basic styles
    added to the card (we will add to these a little bit further into the chapter),
    let''s place the card in the middle (both vertical and horizontal) of the screen.


    ![](img/b56145aa9b751926a7aedbd7172bc818_164_0.png)


    Figure 6.5 Starting to style the card


    # 6.3.1 Using flexbox to center elements


    To center the card in the exact middle of the screen we are going to use flexbox.
    Flexbox allows us to place elements across a single axis either vertically or
    horizontally.


    The `display` property with a value of `flex` is used to dictate that elements
    should be placed on the screen using flexbox. The declaration is set on the parent
    of the elements that will be flexed.


    In our project the element being positioned is the card, its parent is the `body`
    tag, therefore we will add the `display: flex` declaration to our `body` rule.


    We then define how we want the elements within the `body` to behave. In our case
    we have 1 child (the card) and we want it centered. To center the card horizontally
    we add a `justify-content: center` declaration to the body rule. This property
    allows us to dictate how elements are distributed across our axis. Figure 6.6
    breaks down the options available to us.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '![](img/b56145aa9b751926a7aedbd7172bc818_165_0.png)


    Figure 6.6 justify-content property values


    We also want to center the card vertically. For the vertical positioning we will
    use align-items: center. The align-items property gives us the ability to dictate
    how elements should be positioned relative to one another and to the container
    as seen in Figure 6.7.'
  merge: -1
  img_proc: true
- pgno: 166
  md: "# align-items\n\ncontainer\n\nchildren\n\n# Stretch (default)\n\n# flex-start\n\
    \n# flex-end\n\n# baseline\n\n# center\n\nFigure 6.7 align-items property values\n\
    \nListing 6.5 shows our updated body rule. Remember the parent of the element\
    \ being positioned is the one on which we apply flexbox related declarations.\n\
    \n# Listing 6.4 Centering the card\n\n```\nbody {\n    ...\n    display: flex;\n\
    \    justify-content: center; #A\n    align-items: center; #B\n}\n```\n\n#A centers\
    \ the card horizontally\n\n#B centers the card vertically\n\nNow that our card\
    \ is centered (Figure 6.8), let’s focus on the contents of the card starting with\
    \ the profile picture."
  merge: -1
  img_proc: true
- pgno: 167
  md: '![](img/b56145aa9b751926a7aedbd7172bc818_167_0.png)


    Figure 6.8 Centered card


    # 6.4 Styling and positioning the profile picture


    We currently have a rectangular image. We want to make the image circular. We
    also want to center it in the card and have it stick out the top of the card a
    little bit.


    Let’s start by making it into a circle.


    # 6.4.1 Object-fit


    A circle’s height is equal to its width so as we can see in Figure 6.9, if we
    set the height and width of the picture to equal our image size variable, the
    picture will distort.'
  merge: -1
  img_proc: true
- pgno: 168
  md: "![](img/b56145aa9b751926a7aedbd7172bc818_168_0.png)\n\nFigure 6.9 Distorted\
    \ profile picture\n\nTo prevent the image from distorting we must also dictate\
    \ how the image behaves in relation to the size it is given. To do this we will\
    \ use the object-fit property. By setting the object-fit’s value to cover, we\
    \ instruct the image to maintain its initial aspect ratio but fit itself to fill\
    \ the space available. In our case this means that we will lose a little bit of\
    \ the top and bottom of the image due to the image being taller than it is wide.\n\
    \nBy default when using object-fit, the image will be centered and if some of\
    \ the image is clipped, it will be the edges, which works great for our current\
    \ use case and picture. However if we wanted to adjust the position of the image\
    \ within its allotted size and clip only from the bottom, for example, we would\
    \ also add an object-position declaration.\n\nTo make our image a 200px wide circle\
    \ we use the CSS seen in Listing 6.5. Remember that we set the image size as a\
    \ CSS custom property in the body, so set the width and height of the image equal\
    \ to the --imageSize variable. We add the object-fit declaration to prevent the\
    \ image from distorting and finally we give it a 50% border-radius to make it\
    \ a circle.\n\n# Listing 6.5 Centering the card\n\n```\nbody {\n  ...\n  --imageSize:\
    \ 200px;\n}\n\nimg {\n  width: var(--imageSize);\n  height: var(--imageSize);\n\
    \  object-fit: cover;  #A\n  border-radius: 50%;  #B\n}\n```\n\n#A Prevents the\
    \ distortion\n#B Makes the image a circle\n\nOur image now looks as seen in Figure\
    \ 6.10."
  merge: -1
  img_proc: true
- pgno: 169
  md: '![](img/b56145aa9b751926a7aedbd7172bc818_169_0.png)


    Figure 6.10 Circle profile picture


    Now we need to position our picture.


    # 6.4.2 Negative margins


    To position our image to stick out above the card we are going to use a negative
    margin. To move an element down and away from content above it, we can add a positive
    margin-top value to the element. However if we add a negative margin, instead
    of the element being pushed down, it will be pulled upwards. We are going to leverage
    this in conjunction with text centering to position the image.


    Looking back at the final design Figure 6.11, we notice that all of the text is
    centered.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'Figure 6.11 Final design


    Since all of the text is centered, let’s add a text-align: center declaration
    to the card rule. Images by default are inline elements, so we notice that by
    centering the text, the image also gets centered (Figure 6.12).


    ![](img/b56145aa9b751926a7aedbd7172bc818_170_0.png)


    Figure 6.12 Centered text


    Now all that is left is to add the negative top margin to move the image upward.
    We want ⅓ of the image to stick out from the top. We will therefore use the calc()
    function to do the math for us. Our function looks as follows: calc(-1 * var(--imageSize)
    / 3); We divide'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'the image size by 3 to get ⅓ of the height of the image and then multiply by
    -1 to make it negative. Our margin will therefore make ⅓ of the image stick out
    from the top of the card as seen in Figure 6.13.


    ![](img/b56145aa9b751926a7aedbd7172bc818_171_0.png)


    Figure 6.13 Positioned Image


    The last thing we need to do is give our card itself some margin. Due to the negative
    margin we added to the image, if we have a very short screen (Figure 6.14) we
    see that the top of the image disappears off screen.


    ![](img/b56145aa9b751926a7aedbd7172bc818_171_1.png)


    Figure 6.14 Clipping off the top of the image when window height is small


    To prevent cutting off part of the picture when the window is not very tall, we
    want to add some vertical margin to the card itself greater than or equal to the
    amount of the picture that is sticking out of the card.


    To calculate the amount sticking out we used calc(-1 * var(--imageSize) / 3);.
    For our card margin we are going to use a similar concept. We are going to take
    ⅓ of the image


    ```

    calc(-1 * var(--imageSize) / 3)

    ```'
  merge: -1
  img_proc: true
- pgno: 172
  md: "height and then add 24 pixels to move the card and image away from the edge.\
    \ Our final function will be: `calc(var(--imageSize) / 3 + 24px)`.\n\nListing\
    \ 6.6 shows the CSS we added to position the image.\n\n# Listing 6.6 Positioning\
    \ the Image\n\n```\n.card {\n  ...\n  text-align: center;\n  margin: calc(var(--imageSize)\
    \ / 3 + 24px) 24px; #A\n}\n\nimg {\n  width: var(--imageSize);\n  height: var(--imageSize);\n\
    \  object-fit: cover;\n  border-radius: 50%;\n  margin-top: calc(-1 * var(--imageSize)\
    \ / 3); #B\n}\n```\n\n#A Vertical margin of ⅓ image size + 24px and horizontal\
    \ of 24px\n\n#B Negative top margin to make the image stick out of the card\n\n\
    With our image positioned and margins added so that the top of the image does\
    \ not get cut off on small screens (Figure 6.15), let’s turn our attention to\
    \ the curved red background under the picture.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_172_0.png)\n\
    \nFigure 6.15 Added card margin"
  merge: -1
  img_proc: true
- pgno: 173
  md: '# 6.5 Background size and positioning


    To create the background behind the image we are going to follow the steps diagrammed
    in Figure 6.16.


    ![](img/b56145aa9b751926a7aedbd7172bc818_173_0.png)


    ![](img/b56145aa9b751926a7aedbd7172bc818_173_1.png)


    ![](img/b56145aa9b751926a7aedbd7172bc818_173_2.png)


    ![](img/b56145aa9b751926a7aedbd7172bc818_173_3.png)


    Figure 6.16 Creating the image background


    First, we add a background-image consisting of a radial-gradient.


    NOTE: COMBINING BACKGROUND COLOR AND IMAGE We can add both a background color
    and a background image to the same element. We assign the color to the background-color
    property and the image to the background-image property. Or we can apply both
    in the background shorthand property as follows: background: white url(path-to-image);


    The radial gradient takes an ending shape (circle or ellipse) and then where we
    want each color to start and stop to form the gradient. We define ours as radial-gradient(circle,
    var(--primary) 50%, transparent 50%, transparent). Our primary color is a dark
    salmon so our gradient will create a circle that up until it reaches 50% of its
    container will be dark salmon. At 50% of the container size it immediately shifts
    the color to transparent. Since it''s an immediate shift in color there is no
    fade, so we get a nice clean circle.


    By default, radial gradients emanate from the center of their container. In step
    2 we add circle at top to the beginning of our radial-gradient function to shift
    the origin of the circle from the center of the background to the top. Our updated
    radial-gradient function'
  merge: -1
  img_proc: true
- pgno: 174
  md: "therefore now looks as follows: radial-gradient(circle at top, var(--primary)\
    \ 50%, transparent 50%, transparent);\n\nNext we want to move the circle upwards\
    \ so that the bottom of the circle comes just under the image. Step 3 shows us\
    \ that if we move the background up -150 pixels and our card is rather short (our\
    \ profile does not have a lot of content) we will end up with a gap on each of\
    \ the top corners between our circle and the edge of the card which we don’t want.\
    \ To prevent this from happening we are going to make the background image 3 times\
    \ wider than the maximum card size (3×500 =1500).\n\nNOTE: NEGATIVE BACKGROUND\
    \ POSITION Unlike the image, where by adding negative margin, the visibly extends\
    \ out of the card, negative background positions do not render the overflow image\
    \ portions visible. Excess image from an oversized background or changed positioning\
    \ will simply be hidden.\n\nWhen we create a background-image using gradient,\
    \ the background image produced will grow and shrink with the container, we are\
    \ therefore also going to give the background a set height so that no matter how\
    \ much content is in the card, the shape of our background will be predictable.\n\
    \nAfter changing the dimensions of the background we also increase by how much\
    \ we move the background up to snuggly end just below the profile image\n\nFinally\
    \ as mentioned earlier in the chapter, background images repeat by default. By\
    \ moving the image up, we leave room for the background to tile. We only want\
    \ the one semi circle so we set the background-repeat to no-repeat.\n\nAll put\
    \ together, our card background is defined as follows (Listing 6.7):\n\n# Listing\
    \ 6.7 Positioning the Image\n\n```\n.card {\n  background-color: var(--card-background);\n\
    \  ...\n  background-image: radial-gradient(circle at top, var(--primary) 50%,\
    \ transparent 50%,\n    transparent); #A\n  background-size: 1500px 500px; #B\n\
    \  background-position: center -300px; #C\n  background-repeat: no-repeat; #D\n\
    }\n```\n\n#A Creates a semi-circle whose flat side is the top of the card\n#B\
    \ Sets the dimensions of the background image to 1500px wide and 500px tall\n\
    #C Positions the background be horizontally centered and start 300px above the\
    \ card\n#D Prevents the background from tiling\n\nFigure 6.17 shows the background\
    \ added to the card."
  merge: -1
  img_proc: true
- pgno: 175
  md: "![](img/b56145aa9b751926a7aedbd7172bc818_175_0.png)\n\nFigure 6.17 Finished\
    \ background image\n\nWith the top of our card starting to look pretty good let’s\
    \ focus on the rest of the content.\n\n# 6.6 Styling the content\n\nOur card does\
    \ not currently have any padding, which means that if our name was longer it could\
    \ potentially touch edge to edge on our card. Since in most cases, a card would\
    \ be something we would create as a component or template to reuse across multiple\
    \ users, let’s add some left and right padding to ensure our text does not run\
    \ into the edge of the card. We will also add some bottom padding to move the\
    \ links and bottom away from the bottom edge of the card.\n\nListing 6.8 shows\
    \ our updated card rule and Figure 6.18 shows the new output. We use the shorthand\
    \ property which defines 3 values. It states the top padding is 0, left and right\
    \ are 24px, and bottom is 24px. We specifically do not add padding to the top\
    \ as it would push the image down and we would have to readjust our image positioning.\n\
    \n# Listing 6.8 Added padding to the card\n\n```\n.card {\n  ...\n  padding: 0\
    \ 24px 24px;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 176
  md: "![](img/b56145aa9b751926a7aedbd7172bc818_176_0.png)\n\nFigure 6.18 Added card\
    \ padding\n\n# 6.6.1 Styling the name and job title\n\nGoing down the card, our\
    \ first piece of content is the name. As an h1 it has some default styles provided\
    \ by the browser which include some margin. We are going to edit the margin to\
    \ increase the amount of room between the header and the image and remove the\
    \ bottom margin so that the job title can come directly below the name. We will\
    \ also change the color to salmon and set the font size to 2rem.\n\n> **Rem Unit**\n\
    > Rem is a relative unit based on the font size of the root element, in our case\
    \ HTML. For most browsers, the default is 16px. We did not set a font size on\
    \ the HTML element in our project, therefore when we set the h1 font-size to 2rem,\
    \ the output size will be 32px.\n> \n> The benefit of using relative font sizes\
    \ is accessibility. They help ensure that the text can scale gracefully regardless\
    \ of the user's settings or device.\n\nFor the job title we will increase the\
    \ size and weight and change the font color to use our secondary color which is\
    \ gray.\n\nListing 6.9 shows our new rules and Figure 6.19 shows our output."
  merge: -1
  img_proc: true
- pgno: 177
  md: "# Listing 6.9 Styling the name\n\n```\nh1 {\n  font-size: 2rem;      #A\n \
    \ margin: 36px 0 0;      #A\n  color: var(--primary); #A\n}\n\n.title {\n  font-size:\
    \ 1.25rem;    #B\n  font-weight: bold;     #B\n  color: var(--secondary); #B\n\
    }\n```\n\n#A Styles for the name\n#B Styles for the job title\n\n![](img/b56145aa9b751926a7aedbd7172bc818_177_0.png)\n\
    \nFigure 6.19 Styled Name and Job title\n\nNext we are going to style the post,\
    \ like, and follower information.\n\n# 6.6.2 Space-around and gap\n\nIn our HTML,\
    \ the description list (dl) contains the post, like, and follower counts (Listing\
    \ 6.10). Each grouping is contained within a div, so we will apply a display value\
    \ of flex to the definition list in order to horizontally align all three groups.\
    \ We will then set the justify-content property to space-around in order to spread\
    \ them out across the card."
  merge: -1
  img_proc: true
- pgno: 178
  md: "# Listing 6.10 Description list HTML\n\n```\n<dl>\n  <div>\n    <dt>Posts</dt>\n\
    \    <dd>856</dd>\n  </div>\n  <div>\n    <dt>Likes</dt>\n    <dd>1358</dd>\n\
    \  </div>\n  <div>\n    <dt>Followers</dt>\n    <dd>1257</dd>\n  </div>\n</dl>\n\
    ```\n\nThe space-around value distributes the elements evenly across our axis\
    \ by providing an equal amount of space between each element and half as much\
    \ on each end. Figure 6.20 shows a diagram how the spacing is applied.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_178_0.png)\n\
    \nFigure 6.20 space-around property\n\nListing 6.11 shows our styles for the description\
    \ list. Notice we also included a gap: 12px declaration. This ensures that the\
    \ minimum amount of space between our elements will be 12 pixels. We could have\
    \ given our divs inside of the description list a margin; however, those would\
    \ have also affected the outer edges. Gap only affects the space between elements.\n\
    \n# Listing 6.11 Styling the name\n\n```\ndl {\n  display: flex;\n  justify-content:\
    \ space-around;\n  gap: 12px;\n}\n```\n\nAs seen in Figure 6.21, our profile stats\
    \ are now in a row and evenly spaced across the card."
  merge: -1
  img_proc: true
- pgno: 179
  md: "Figure 6.21 Aligned profile stats\n\nThe numbers, however, are offset. This\
    \ comes from the description which has some margins that come from the browser\
    \ defaults. Let’s get rid of those and style the text to be bold, bigger, and\
    \ salmon using the CSS from Listing 6.12.\n\n# Listing 6.12 description details\
    \ rule\n\n```\ndd {\n  margin: 0;\n  font-size: 1.25rem;\n  font-weight: bold;\n\
    \  color: var(--primary);\n}\n```\n\nWith the margin removed (Figure 6.22) we\
    \ notice that the likes are not exactly centered to the middle of our card.\n\n\
    Figure 6.22 Description list alignment\n\nThe reason that the likes are not centered\
    \ in the middle of the card is because each of the three elements do not have\
    \ exactly the same width. When the elements are distributed, the browser calculates\
    \ the total amount of space each element needs, and then redistributes the"
  merge: -1
  img_proc: true
- pgno: 180
  md: "leftovers equally. Therefore, since the div containing followers is larger\
    \ than the div containing posts, likes does not land in the middle.\n\n# 6.6.3\
    \ Flex-basis and flex-shrink\n\nTo center the likes, we will assign all three\
    \ divs the same width. Instead of using the width property, however, we will use\
    \ flex-basis and set its value to 33%. flex-basis sets the initial size the browser\
    \ should use when calculating the amount of space the element needs. We will also\
    \ set flex-shrink to 1.\n\nflex-shrink dictates whether an element is allowed\
    \ to shrink to a smaller size than the size assigned by the flex-basis value if\
    \ there is not enough room in the container for the element. If the flex-shrink\
    \ value is 0, the size is not adjusted; any positive value allows for resizing.\n\
    \nWe set our flex-basis to 33% but remember: we also set a gap of 12 pixels between\
    \ each of our elements. Therefore, the flex-basis size we set is too wide for\
    \ the container once the gap is taken into consideration. By allowing the elements\
    \ to shrink, we tell the browser to start its positioning calculations with each\
    \ div taking up 33% of the width of the container and to evenly shrink them to\
    \ fit into the available space. This prevents us from having to do math of figuring\
    \ out exactly how wide the divs should be and still have them equally sized.\n\
    \nTo write our rule (Listing 6.13), we therefore target the divs that are immediate\
    \ children of the definition list (dl) using a child combinator (>) and apply\
    \ the flex-basis and flex-shrink declarations.\n\n```\nListing 6.13 Centerering\
    \ the likes\n\ndl > div {\n  flex-basis: 33%;\n  flex-shrink: 1;\n}\n```\n\nWith\
    \ our likes centered (Figure 6.23), let’s turn our attention to the definition\
    \ terms (dt).\n\n![](img/b56145aa9b751926a7aedbd7172bc818_180_0.png)"
  merge: -1
  img_proc: true
- pgno: 181
  md: "# 6.6.4 Flex-direction\n\nIn our original design, we have the description details\
    \ (the numbers) above the description terms. To flip them visually we are going\
    \ to use the `flex-direction` property. We asserted that flexbox can place elements\
    \ across a singular axis. So far we have done our work across the horizontal or\
    \ x axis.\n\nTo move the details above the terms we are going to use flexbox on\
    \ the vertical or y axis. To change which axis we want flexbox to operate on we\
    \ use the `flex-direction` property. By default it has a value of `row`, which\
    \ makes flexbox operate on the x axis. By changing the value to `column`, we make\
    \ it operate on the y axis.\n\nFurthermore, the `flex-direction` property also\
    \ allows us to dictate how the elements should be ordered. Setting the value to\
    \ `column-reverse` tells the browser that we want to operate on the y axis, and\
    \ we want the elements to be placed in reverse HTML order, making the description\
    \ details (`dd`) appear first and the description term (`dt`) second.\n\nAs before,\
    \ we want to set the behavior on the parent, in this case the `div`. We will therefore\
    \ add to our previously created `div` rule as seen in Listing 6.14 to reorder\
    \ the elements. We also decrease the size of the description term (`dt`) to emphasize\
    \ the number over its term.\n\n```\nListing 6.14 Reversing content order\n\ndl\
    \ > div {\n  flex-basis: 33%;\n  flex-shrink: 1;\n  display: flex;\n  flex-direction:\
    \ column-reverse;\n}\ndt { font-size: .75rem; }\n```\n\n> NOTE: CONTENT ORDER\
    \ For accessibility reasons we want to make sure that the order in which our HTML\
    \ is written follows the order in which it is displayed on the screen. A user\
    \ who has their computer read the contents of the page to them as they are visually\
    \ following along would be easily disoriented or confused if the content that\
    \ is being read to them does not match what they are looking at. Caution must\
    \ therefore be used when using properties such as flex-direction to reorder content.\n\
    \nFigure 6.24 shows our styled description list (`dl`)."

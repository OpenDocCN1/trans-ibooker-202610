- pgno: 47
  md: "+   - `grid`: when we want the browser to display the grid in a block-level\
    \ box. The grid will take the full width of the container and set itself on a\
    \ new line.\n+   - `inline-grid`: this is when we want the grid to be an inline-level\
    \ box. The grid will set itself inline with the previous content much like a span.\n\
    \n# Difference between block-level and inline-level box\n\nIn HTML every element\
    \ has a box surrounding it. A block-level box says that an element's box should\
    \ use the entire horizontal space of its parent element, therefore preventing\
    \ any other element being on the same horizontal line. In contrast, inline elements\
    \ can allow other inline elements to be on the same horizontal line depending\
    \ on the remaining space.\n\nWe will use the value grid for our layout:\n\n# Listing\
    \ 2.3 Setting the display to grid\n\n```\nmain {\n  display: grid;\n}\n```\n\n\
    If we preview this in the browser we notice that visually nothing has changed.\
    \ This is because the browser by default will display the direct child items in\
    \ one column. The browser will then generate enough rows for all of the children\
    \ elements.\n\nUsing the developer tools in our browser (Figure 2.3), we can see\
    \ that programmatically the grid has been created even though the layout has not\
    \ visually changed. To view the underlying grid on most browsers we can right\
    \ click on the web page and select inspect from the menu.\n\nIn the Firefox inspect\
    \ window, we select the parent container and we will see 2 things to indicate\
    \ this is now a grid:\n\n+   1. Purple lines around each direct child item\n+\
    \   2. In the CSS panel to the right of the HTML, we see the `main` has a display\
    \ of grid and next to it an icon\n+   3. Once we click the grid icon beside `<main>`,\
    \ the layout panel shows us our grid structure\n\nAlthough we can follow similar\
    \ steps for Chrome or Safari, Firefox does provide better functionality when viewing\
    \ and editing the grid in the developer tools."
  merge: -1
  img_proc: true

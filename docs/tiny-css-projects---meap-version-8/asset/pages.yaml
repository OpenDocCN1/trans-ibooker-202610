    As we look at our layout, we notice that the image looks a little odd and out
    of place at the bottom of the second column. Let’s fix that.


    # 4.5.2 Wrapping the text around the image


    To reconnect the image with the subsequent text, we will push the image and its
    caption to the left and have the text wrap around the image using the float property.
    Applying the float property to an element pushes it to either the left or the
    right, allowing text and inline elements to wrap around it.


    This is where having the image and caption as a unit inside of a figure tag comes
    in really handy for styling. Since they are both contained inside of the figure,
    we will apply the float to the figure, which will neatly wrap the text around
    both the image and the caption.


    Listing 4.14 shows how we float the figure. Notice that we added a right margin
    to the figure. Since we are floating the figure to the left, it places itself
    on the left side of the column, allowing the text to wrap around it in the left
    over space to the right as seen in Figure 4.26. The right margin creates a space
    between the image and the text so that the text does not come right up against
    the edge of the image.'

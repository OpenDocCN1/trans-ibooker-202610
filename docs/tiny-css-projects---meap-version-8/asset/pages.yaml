- pgno: 316
  md: '![](img/b56145aa9b751926a7aedbd7172bc818_316_0.png)


    Figure 11.11: Share link hover effect


    # 11.6 Animating the component


    In Chapter 2 we used keyframes to create animation. This allowed us to define
    steps for our animation. For our hover we already have our start and end states
    defined. We are transitioning from one state (not hovered or focused) to another
    (hovered or focused), whose styles are already defined in rules so instead of
    using an animation we are going to use a transition.


    # 11.6.1 Transition


    A transition does not require a keyframe, and allows us to animate the change
    of styles from one state to another. The transition property allows us to define
    which property changes should be animated, the duration, and timing function.
    By adding `transition: transform ease-in-out 250ms;` to our `.share__link` rules
    we tell the browser to animate the size change of our link (listing 11.10).


    To choose the amount of time the transition needs to take, we choose something
    relatively fast: 250 milliseconds. We want to keep the animation slow enough to
    be seen but fast enough to keep it snappy. If we make the transition too slow
    it will make our project look laggy and distract the user from performing the
    task they are trying to accomplish (share the content).'
  merge: -1
  img_proc: true
- pgno: 317
  md: "# Listing 11.10 Transitioning the link size change\n\n```\n.share__link:link,\n\
    .share__link:visited {\n  text-decoration: none;\n  display: flex;\n  flex-direction:\
    \ column;\n  align-items: center;\n  justify-content: center;\n  height: 48px;\n\
    \  width: 48px;\n  border-radius: 50%;\n  border: solid 1px transparent;\n  transition:\
    \ transform ease-in-out 250ms;\n}\n\n.share__link:hover,\n.share__link:focus-visible\
    \ {\n  border-color: black;\n  outline: none;\n  transform: scale(1.25);\n  background:rgb(255,\
    \ 228, 106);\n}\n```\n\nIn our transition we specifically tell the browser to\
    \ animate the changes that occur on the `transform` property but we do not have\
    \ a `transform` property in our `.share__link:link`, `.share__link:visited` rule.\
    \ When we run the code, however, we notice that our size change is animated, and\
    \ that the code does work. This is because when not defined, by default scale\
    \ will equal `scale(1)`. We are therefore animating going from `scale(1)` to `scale(1.25)`\
    \ when we hover or focus the link and then animating the scale back to `scale(1)`\
    \ when moving away from the link.\n\nNext we are going to animate hiding and exposing\
    \ the links when the button is clicked.\n\n# 11.6.2 Opening and closing the component\n\
    \nRemember that our end goal is that by default the component hides our menu of\
    \ links and only exposes them once the button is clicked (Figure 11.12).\n\n![](img/b56145aa9b751926a7aedbd7172bc818_317_0.png)\n\
    \nFigure 11.12: Closed (left) and Expanded (right) states\n\nThe first thing we\

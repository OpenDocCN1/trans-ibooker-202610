    # 4.4 Using the CSS multi-column layout module


    The CSS multi-column module is fairly new and compared to similar modules like
    the grid and flexbox modules the multi-column layout module is perhaps a lesser-known
    option as a way to present content but no less useful.


    The purpose of this module is to allow content to naturally flow between multiple
    columns. It works very similarly to how we create multiple column layouts in a
    Word or Google doc. We assign columns to a section of content and the content
    naturally flows from one column to another.'

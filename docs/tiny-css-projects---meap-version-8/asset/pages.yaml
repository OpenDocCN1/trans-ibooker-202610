  md: '# 3


    # Creating a responsive animated loading screen


    # This chapter covers


    +   - Creating a Scaleable Vector Graphic (SVG) by creating basic shapes in SVGs
    to create our loader

    +   - Finding out the difference between viewbox and viewport in SVG

    +   - What keyframes are and how we can animate SVG graphics from one size to
    another

    +   - Using the animation property to set the duration, style, how many times
    it should animate and how to delay when animations should start

    +   - How to style SVG graphics using CSS

    +   - How to style an HTML progress bar element with vendor prefixes


    We see loaders in most web and mobile applications today. These loaders are used
    as a way to communicate to the user something is loading, uploading, or waiting
    for something. It gives the user confidence that something is happening and that
    the application is not frozen.


    Without some sort of indicator to tell the user something is happening the user
    may try reloading, going back and clicking the link again, or just give up and
    leave. We should be using some sort of progress indicator when an action takes
    longer than 1 second, this is when users tend to lose focus and question if there
    is a problem. As well as having a visual graphic showing something is happening,
    the loader should be accompanied with text that tells the user what is happening.


    For our animation, we’ll be looking into the CSS animation module, understanding
    the animation property, keyframes, transitions as well as accessibility and how
    we respect our user’s preferences regarding how much animation they are presented
    with.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'We’ll be creating the rectangles using an SVG graphic and take a look at what
    SVGs offer us to understand the slight differences that exist in CSS properties
    between styling HTML elements and SVG elements.


    For the progress bar, we will use the HTML `progress` element and then look at
    how we can remove the browser’s default styles and apply our own. Overall we want
    to create a consistent, responsive loader that can work across devices. The end
    result we will achieve is shown in figure 3.1.


    The code for the before and after for this project can be found in the GitHub
    repository: https://github.com/michaelgearon/Tiny-CSS-Projects


    ![](img/b56145aa9b751926a7aedbd7172bc818_65_0.png)


    Figure 3.1 End goal for this chapter


    # 3.1 SVG and graphics


    SVG stands for Scalable Vector Graphics. SVGs are written using an XML-based markup
    language and consists of vectors on a Cartesian plane.


    A vector is a mathematical formula that defines a geometric primitive. Lines,
    polygons, curves, circles, and rectangles are all examples of geometric primitives.


    A Cartesian coordinate system in a plane is a grid based system that defines a
    point using a pair of numerical coordinates based on its distance from 2 perpendicular
    axes. Where these two axes cross is the origin, which has a coordinate value of
    (0, 0). Think back to math class, when we were being asked to plot lines on a
    graph, that was a cartesian coordinate system. Essentially, SVGs are shapes on
    a coordinate plane and are written in XML.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'PNGs, JPEGs, and GIFs, by contrast, are raster images. Raster images are created
    using a grid of pixels. Figure 3.2 illustrates the difference between raster and
    vector graphics .


    ![](img/b56145aa9b751926a7aedbd7172bc818_66_0.png)


    Figure 3.2 Raster Versus Vector Graphics


    By virtue of their construction, SVGs have many advantages over raster images
    including being infinitely scalable. We can shrink or enlarge the image as much
    as we want. We can shrink raster images, but we cannot enlarge them without seeing
    pixelation which results from enlarging the grid of pixels rendering the individual
    squares of the grid visible.


    When we enlarge an SVG, since we are programatically setting shapes and lines
    on a coordinate plane, the paths between points are redrawn and the quality does
    not degrade.


    Because SVGs are written in XML, we can place SVG code directly into our HTML
    and access it, manipulate it, edit it in much the same way we do our other HTML
    elements. SVGs are to graphics as HTML is to web pages.


    Where rasters are a better choice however, is when dealing with images that are
    highly complex or photo realistic. Not that it wouldn’t be possible to create
    a photo realistic image using an SVG, it would not be practical. The file size
    and therefore performance to load the image would be significantly larger when
    creating it using vector graphics than as a raster image.


    The most common use case for SVGs are logos, icons, and loaders. We use them for
    logos because they are often simple images that need to be crisp regardless of
    the size or medium. Furthermore, it is not uncommon for a company or product to
    have several versions of a logo for usage on a dark background versus a light
    background for example. Recoloring, but also simplicity, and scaling, are also
    the reasons we use them for icons.


    We use SVGs for loaders because, unlike their raster counterparts, we can add
    animations inside the image itself. We can isolate individual elements inside
    the graphics and'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'apply CSS or JavaScript to that individual piece, an exercise which is not
    possible with rasters.


    Earlier we mentioned that SVGs are based on a Cartesian plane (a 2 dimensional
    coordinate plane), let''s dig further into what that means and how it works.


    # 3.1.1 Positions


    When working with SVG elements, the way to think about positioning is to imagine
    we are placing elements on a grid. Everything starts at 0,0 (the origin) which
    is the very top, left corner of the SVG document.


    The higher the X or Y value the further away it will be from that top left corner.
    The position is measured in pixels, which is the default and only way to position
    SVG elements on the canvas. Figure 3.3 expands on the example of the boat shown
    in Figure 3.2 adding the origin and the coordinate values for each shape.


    ![](img/b56145aa9b751926a7aedbd7172bc818_67_0.png)


    Figure 3.3 Positioning elements on a coordinate plane'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'Our loader is composed of a series of 11 rectangles. To place them we will
    need to think of their positions on a coordinate plane taking both their widths
    and the gaps between them into consideration.


    # 3.1.2 Viewport


    The viewport is the area in which the user can see the SVG. It is set by two attributes,
    width and height. The way to think of the viewport is that it’s a picture frame,
    it sets the size of the frame. It does not affect the size of the graphic it contains
    however, if we place an image inside of a picture frame that is larger than our
    frame, then we will have overflow. The same will happen to our SVG. Like positioning,
    the viewport measurements will have their origin in the top left hand corner of
    the SVG. The diagram in Figure 3.4 illustrates this concept.


    ![](img/b56145aa9b751926a7aedbd7172bc818_68_0.png)


    ```

    <svg>

    <rect width="600" height="200"

    x="50" y="50" />

    </svg>

    ```


    ```

    <svg width="250px" height="150px">

    <rect width="600" height="200"

    x="50" y="50" />

    </svg>

    ```


    Figure 3.4 SVGs with and without a defined viewport


    The viewport for our loader will be:


    ```

    <svg width="100%" height="300px"> <!--SVG code --> </svg>

    ```


    The width is set at 100%, but 100% of what? We are dictating that the loader will
    take 100% of the available space it is given by its parent item. Listing 3.1 shows
    our starting HTML. We see that our loader is nested inside of a section, therefore
    our loader will be the same width as our section.


    # Listing 3.1 Starting HTML


    ```

    <body>

    <section>

    <svg width="100%" height="300px"></svg> #A

    <h1>Scanning channels</h1>

    <p>This may take a few minutes</p>

    <progress id="file" width="100%" value="32" max="100">32%</progress> #B

    </section>

    </body>

    ```'
  merge: -1
  img_proc: true

    \ content author\"\n  \"content content aside \"\n  \"plays   .       aside \"\
    \n  \"footer  footer  footer\";\n}\n```\n\nAlthough we have defined areas, the\
    \ content is still implicitly positioning itself in each available cell, ignoring\

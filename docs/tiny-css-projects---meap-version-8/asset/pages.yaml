  md: '![](img/b56145aa9b751926a7aedbd7172bc818_23_0.png)


    Figure 1.10 CSS order of precedence


    We established that the type of selector will affect the class’s specificity.
    Let’s take a closer look at the selectors and use them in our project.


    # 1.6 CSS selectors


    The selector sets what HTML elements we want to target which is then followed
    by the declarations.


    In CSS there are seven ways to target the HTML elements we want to style. Let’s
    first look at the basic selectors.


    # 1.6.1 Basic selectors


    The most common method is selecting elements based on name, ID or class name.


    # TYPE SELECTOR


    The type selector targets the HTML element by name. The benefit of using the type
    selector is that when reading through our CSS we can quickly work out which HTML
    elements would be impacted if we made changes to the rule. It also does not require
    us to add any particular markup to the HTML in order to target the element.


    Let’s use a type selector to target all of our headings (h1 through h6), and change
    their color to crimson.


    Our CSS would be: h1, h2, h3, h4, h5, h6 { color: crimson; }. Figure 1.11 shows
    that all our headers have now changed colors.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Figure 1.11 Header color change


    # CLASS SELECTORS


    Class selectors can be used on as many different elements as we want. By applying
    a class name to elements, we are grouping multiple HTML elements together so when
    we apply styles, they will roll out to any element with that class name.


    Classes can be added to HTML by using the class attribute. Within the class attribute,
    we can add as many values (or classes) as we want, each separated by a space.
    Unlike declarations which have to be written in American English, class names
    can be written in any language using any spelling variations.'

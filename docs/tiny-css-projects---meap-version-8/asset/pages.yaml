    # 10.10 Summary


    +   - Form controls whose functionality is tightly coupled with the operating
    system such as dropdowns are harder to style than those without this coupling

    +   - We can create shapes using gradients

    +   - Using em, elements can be sized to scale with text size

    +   - To inherit font color when otherwise not possible we can use the keyword
    value currentColor

    +   - :where() and :is() pseudo classes work very similarly but have different
    levels of specificity

    +   - The :checked allows us to target form elements when they are checked

    +   - The :invalid pseudo class can be used to conditionally format fields when
    they are invalid

    +   - The validity of a field''s value is determined by the attributes set on
    the field in the HTML

    +   - :focus styles are necessary to make our designs accessible

    +   - We can use :focus-visible to make focus style only show for keyboard users

    +   - In some browsers we can forcibly make the browser apply hover and focus
    styles

    +   - It is important to always use more than just color to convey meaning

    +   - forced-colors mode changes how some properties behave and the colors we
    can apply to the UI

    +   - Media queries can be used to conditionally apply styles when forced-colors
    is set to'

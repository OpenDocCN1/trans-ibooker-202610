  md: "# 10.6.3 Styling the reset button\n\nNext we need to style the reset button.\
    \ Same as with our submit button rather than adding a class, we will use a type\
    \ selector to create our rule. The “Reset” button has a type of reset, so we can\
    \ use button: button[type=\"reset\"] as a selector for our rule.\n\nTo reinforce\
    \ that it is a secondary action, we are going to minimize it even further visually\
    \ compared to its submit counterpart by forcing its text to be all lowercase.\
    \ We will however change the text color to be our accent color to reinforce that\
    \ it is clickable, otherwise it just looks like static text.\n\nAs mentioned in\
    \ the previous section, there is not much contrast difference between our text\
    \ color and our accent color, therefore some users, especially those that are\
    \ visually impaired, may have trouble differentiating between the two colors.\
    \ It is therefore imperative that we use more than just color to differentiate\
    \ between element types and states. We will therefore add a border that is the\
    \ same color as our input borders to our button.\n\nHowever, once we apply the\
    \ border, we can see in Figure 10.30 that the reset button is now taller than\
    \ our submit button. The submit is 50px tall while the reset is 52px. Not ideal\
    \ when the goal is to make it appear less important than the submit. Size is often\
    \ an indicator of importance, the bigger an element is the more important it will\
    \ appear.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_284_0.png)\n\nFigure 10.32\
    \ Button Sizes\n\nTo remedy this situation and have both the buttons be the same\

- pgno: 83
  md: "In HTML, the initial value for this property is 50% 50% 0 so this is center,\
    \ center, flat. However, for SVG elements the initial value is 0, 0 which would\
    \ place it in the top left hand corner.\n\nFor our animation we want the rectangle\
    \ transform origin to be at the center. We want the top and bottom of the rectangles\
    \ to shrink rather than the top staying fixed in place and expanding and retracting\
    \ from that point. To do this we can either apply the keyword value `center` or\
    \ set a percentage value of `50%` to the `transform-origin` property for our rectangles.\n\
    \nEither way we are saying we want the point of origin to happen from the center\
    \ of the rectangle. For our project, we will use the keyword value. Listing 3.9\
    \ shows our updated `rect` rule.\n\nWe mentioned earlier that when working with\
    \ 2D animations, the property would take 2 values, but we only passed one. When\
    \ only one value is passed, it will be applied to both the vertical and horizontal\
    \ position, therefore `transform-origin: center;` is equivalent to `transform-origin:\
    \ center center;`.\n\n# Listing 3.11 Updated rect rule with transform-origin property\n\
    \n```\nrect {\n  animation: scale 2.2s infinite;\n  transform-origin: center;\n\
    }\n```\n\nWe have finished our loader animation (Figure 3.10) however we still\
    \ need to consider how accessible our design is.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_83_0.png)\n\
    \nFigure 3.10 Finished Loader Animation\n\nThe next section will dive into some\
    \ of the ways we can make sure to provide a positive experience for all of our\
    \ users."

    # 4.3.1      The filter property


    Like photo editors or on social media websites like Instagram we can apply filters
    to images with CSS. We can alter colors, blur, and add drop shadows. Figure 4.11
    shows examples of some of the things we can do to our images using filters in
    CSS. Checkout the code sample in codepen to see it in action: https://codepen.io/michaelgearon/pen/porovxJ.


    ![](img/b56145aa9b751926a7aedbd7172bc818_111_0.png)


    Figure 4.11 Examples of images altered using the filter property


    If we think about photography (before the digital era), when we used film and
    had to go to a shop and have it developed, we applied filters by adding a translucent
    disk over our lens, which altered the light coming into the camera box and onto
    the film. By altering the nature of the light, we altered the image being produced.
    For example, if we use a red filter while taking a picture, only the red colored
    wavelength is allowed through, therefore our picture would be tinted red. Polarized
    sunglasses are another example of a filter which alters the light coming through
    a lens.


    We can still use physical filters with digital cameras. However, in many cases,
    filters are applied digitally after the picture has already been taken.


    In CSS to apply a filter to the image, we use the `filter` property and then a
    function which defines the behavior we want the filter to have. A list of the
    available functions can be found at https://developer.mozilla.org/en-US/docs/Web/CSS/filter#functions.
    We will use the `grayscale()` function to make our picture appear to be a black
    and white photo.


    The grayscale() function takes a percentage which represents how much we want
    to reduce the amount of color in the image. We want to remove all of the color,
    so we will pass'

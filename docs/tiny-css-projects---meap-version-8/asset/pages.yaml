    \nFigure 11.5: Share button hover\n\n# 11.5.2 Share menu\n\nTo style the menu\
    \ and its items, we want to remove the bullets and then place the elements in\
    \ a row beside the button.\n\nTo remove the bullet, we give the list items a list-style\

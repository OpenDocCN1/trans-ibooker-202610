- pgno: 95
  md: '# 3.8 Summary


    +   - The animation property is a way to change the position, color or some other
    visual element using CSS.

    +   - Keyframes are a way to describe what an element should look like throughout
    its animation.

    +   - We can then delay the start of an animation using the `animation-delay`
    property

    +   - The `animation-duration` set how long the animation should take to complete

    +   - SVG can be styled using CSS

    +   - The prefers-reduced-motion media queries allows us to conditionally style
    animations per the user’s settings

    +   - The HTML progress bar is a way of showing how far something is uploaded
    or is being loaded.

    +   - By default the browser applies their own styling to the progress bar but
    it can be reset using the `appearance` property with a value of `none`.

    +   - Our ability to style progress element is fairly restricted

    +   - There are some experimental properties available to style the progress element
    but they require the use of vendor prefixes

    +   - Vendor prefixed properties are experimental and we should not use vendor
    prefixes in our production code'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# 4


    # Creating a responsive web newspaper layout


    # This chapter covers


    +   - Using the CSS multi-column layout module to create a newspaper layout

    +   - Using the counter styles CSS at-rule to create custom list styles

    +   - Styling images using the filter property

    +   - Handling broken images

    +   - Formatting captions

    +   - Using the quotes property to add quotation marks to HTML elements

    +   - Using media queries to change our layout based on screen size


    In chapter 1 we looked at creating a single column article which taught us the
    basic principles of CSS. The design, however, was quite simple. Let’s revisit
    the concept of formating articles but make it much more visually interesting.
    In this chapter we will style our content to look like a page out of a newspaper
    as seen in Figure 4.1.'
  merge: -1
  img_proc: true

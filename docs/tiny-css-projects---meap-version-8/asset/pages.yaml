- pgno: 312
  md: "![](img/b56145aa9b751926a7aedbd7172bc818_312_0.png)\n\nFigure 11.6: Styled\
    \ menu\n\n# 11.5.3 Share links\n\nTo make sure the links have a circle border\
    \ on hover (rather than an ellipse) we will set their height and width equal to\
    \ each other. We set them both to 48px. We then curve their corners. This will\
    \ also resolve our spacing issue because as we see in the HTML (Listing 11.6)\
    \ we have set the icon height and width to 24. Since we are making the link 48\
    \ pixels in height width, once centered, our links will have 12 pixels of whitespace\
    \ between the icon and the edge of the link.\n\n# Listing 11.6 Styling the links\n\
    \n```\n<li role=\"menuitem\" class=\"share__menu-item\">\n  <a href=\"https://www.facebook.com/sha...\"\
    \n    target=\"_blank\"\n    rel=\"nofollow noopener\"\n    tabindex=\"-1\"\n\
    \    class=\"share__link\"\n  >\n    <img src=\"./icons/facebook.svg\" alt=\"\
    Facebook\" width=\"24\" height=\"24\">\n  </a>\n</li>\n```\n\nWe also give the\
    \ links a transparent border. Borders take up space, so in order to prevent the\
    \ content from shifting on hover or focus when we expose the border, we add a\
    \ transparent border by default and then color it when we want to show it. This\
    \ ensures that the space needed for the border is allotted for and prevents the\
    \ content succeeding the element from shifting when the border is exposed.\n\n\
    To center the icon in the middle of the circle we use flex, justifying the content\
    \ and aligning the items to the center. Our CSS therefore looks as follows (listing\
    \ 11.7):\n\n# Listing 11.7 Styling the links\n\n```\n.share__link:link,\n.share__link:visited\
    \ {\n  height: 48px;\n  width: 48px;\n  border-radius: 50%;\n  display: flex;\n\
    \  align-items: center;\n  justify-content: center;\n}\n```\n\nWith our links\
    \ styled (Figure 11.7), we can now style the links when hovered or focused."

    Let''s add space between the areas. To accomplish this, we will use the gap property.


    # 2.4 Grid gap


    The gap property is shorthand for row-gap and column-gap properties. By setting
    the row and column gaps we are defining the gutters between each row and column.
    Gutters is a term from print design, defining the margin between columns. By default
    the gap between columns and rows is 0.


    When using the gap property, the extra space only applies between the tracks of
    the grid. No gutters are applied before the first track or after the last track.
    To set space around the grid we use padding and margin properties.'

    # 8.3.4 Padding, Margin, and Margin Collapse


    All of the content within our sections is laid out for mobile except our headers.
    The browser gives them margin by default but it is not accomplishing what we want
    it to. Instead of creating vertical space between the edge of the card and the
    header, it is pushing the card down. Margin pushes content but does not affect
    how much room an element or its content occupy which is why the top margin or
    the header is "bleeding" out of the card.


    If we remove the header''s margin and give it padding instead the card will expand
    but the gap between the two cards will disappear. We therefore need to give the
    section itself some margin in order to add space between the two cards. If we
    give the sections a margin with a value of 1rem 0 (1 rem top and bottom, but no
    left - right) we will see that we still only have a 1 rem gap between the 2 cards.
    This is a direct result of margin collapse. Unless the positioning of the element
    has been altered, via float, flex..., 2 margins up against each other will collapse
    to equal the greater of the 2 margins. Figure 8.24 diagrams what is happening.'
  merge: -1
  img_proc: true
- pgno: 241
  md: "![](img/b56145aa9b751926a7aedbd7172bc818_241_0.png)\n\nFigure 8.24 Effects\
    \ of margin and margin collapse\n\nTo add space between the edges of the card\
    \ and the header, we replace the card header’s margin with padding. Then we will\
    \ add margin to the card in order to regain the lost vertical space between them.\
    \ Lastly we add padding to the body so that the cards are not stuck right up against\
    \ the left and right edges of the screen. Listing 8.18 shows how this is done.\n\
    \n# Listing 8.18 Section Margin and Header Padding\n\n```\nbody { padding: 1rem;\

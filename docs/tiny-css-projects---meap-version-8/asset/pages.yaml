- pgno: 161
  md: "# Listing 6.2 Defining CSS custom properties\n\n```\nbody {\n  --primary: #de3c4b;\
    \ #A\n  --primary-contrast: white;\n  --secondary: #717777; #B\n  --font: Helvetica,\
    \ Arial, sans-serif;\n  --text-color: #2D3142; #C\n  --card-background: white;\n\
    \  --page-background: linear-gradient(#4F5D75, #2D3142);\n  --imageSize: 200px;\n\
    \n  background: var(--page-background);\n  font-family: var(--font);\n  color:\
    \ var(--text-color);\n}\n```\n\n#A dark salmon\n#B gray\n#C very dark blue-gray\n\
    \nNOTE: LINEAR GRADIENT Our linear gradient will go from top to bottom fading\
    \ from a dark blue to very dark blue. For a more in depth explanation of linear\
    \ gradients checkout Chapter 3 Section 3.7.2.\n\nWith our background and font\
    \ color and family applied (Figure 6.3) we notice that our background repeats\
    \ at the bottom of the page.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_161_0.png)\n\
    \nFigure 6.3 Adding the background to the body"

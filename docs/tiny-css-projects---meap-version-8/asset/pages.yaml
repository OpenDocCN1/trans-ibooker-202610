  md: '# 11


    # Animated social media share links


    # This chapter covers


    +   - OOCS, SMACSS, and BEM Architecture Patterns

    +   - Scoping CSS when working with components

    +   - Working with social media icons

    +   - Creating CSS transitions

    +   - Where to use JavaScript to overcome CSS limitations


    One of the core foundational reasons for which the internet was created was to
    share and distribute information. One of the ways we do this today is through
    social media. In this chapter we will style and animate some links that can be
    used to share a web page via email or social media.


    Like in the previous chapters, we will be using HTML and CSS for this project
    without using any frameworks. This is to keep focus on the CSS itself without
    the complexity and individual intricacies that come with using external packages.
    However, many applications in the wild do use frameworks some of which include
    the concept of the component. A very common reason to turn a piece of functionality
    into a component is to reuse the piece of code or element in multiple places in
    our applications. With reusability comes the possibility for naming collisions.
    Some systems automatically restrict the scope of the CSS of the component to itself,
    preventing any possible collision between component styles. However, many do not,
    leaving it up to the developer to organize their code to prevent accidentally
    changing the styles in another component when styling a new one. Regardless of
    the framework and how it does (or does not) handle CSS scoping we have a variety
    of architecture options to help us organize and standardize our styles.


    Before we dive into the project itself let’s take a quick look at some CSS architecture
    options and choose one for our project.'

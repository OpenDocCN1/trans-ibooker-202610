    Figure 4.20 Columns with added vertical lines


    With our lines in place we can see that we have some crowding between the article
    itself and the date and that we could use a bit more space between our lines and
    our text.


    # 4.4.4 Adjusting spacing with the column-gap property


    We now need to do 2 things, increase the container spacing between the date of
    the article and the article as well as increasing the gap between each column
    within the article.


    To adjust the spacing between the article and the date, we will add 36px of margin
    to the top of the article. When working out a value to use for spacing it is sometimes
    judging it and seeing what looks right on the page, we want to create enough spacing
    that each item has its own space and is clear but not spacing it too far apart
    that it looks separated.


    > TIP In design there are the Gestalt Principles which are a collection of principles
    of human perception that describe how humans group similar elements. 1 of 7 laws
    is the law of proximity. This principle talks about how things that are close
    together appear to be more related than things that are spaced farther apart.'

    # NAMESPACE AND THE UNIVERSAL SELECTOR


    It is possible to mix different languages together in the same document, such
    as embedding SVG code into HTML.


    The issue with doing that is that it’s difficult to distinguish between the various
    types of code. For example, we could have a link in our SVG graphic and a link
    in our HTML but we may want to style the SVG links differently than our HTML links.


    To solve this we can use namespaces to uniquely identify code and set our definition
    of what that code does. Then, in the CSS, we can select that namespace and create
    styles just for that type of code.


    In HTML5 when we insert code into a HTML file that is a known foreign element
    such as an SVG, MathML or XML it is automatically given its correct namespace.


    Here a few examples of coding languages and their namespaces:


    +   - HTML elements use the namespace of http://www.w3.org/1999/xhtml

    +   - SVG elements use the namespace of http://www.w3.org/2000/svg

    +   - MathML elements use the namespace of http://www.w3.org/1998/Math/MathML'

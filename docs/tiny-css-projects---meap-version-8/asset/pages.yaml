- pgno: 104
  md: "Let’s apply the concepts we just covered regarding importing fonts, font-weight,\
    \ and the font shorthand property to style the article title and subheadings.\n\
    \n# 4.1.4 Creating a visual hierarchy\n\nTo create visual hierarchy in the page\
    \ we will set the article heading <h2> to be smaller than our newspaper’s title\
    \ <h1> but larger than the subheadings within the article <h3>. Generally speaking,\
    \ the larger an element, the more important it will be perceived to be; we therefore\
    \ use size to make our headers stand out. By using a different font-family than\
    \ we do on the main bodies of text and making all of our letters uppercase we\
    \ further their distinction.\n\nCreating a visual hierarchy is important as it\
    \ allows the user to glance at the screen and immediately recognize elements of\
    \ interest. It also helps segment information into groups, making the information\
    \ easier to process and understand. Listing 4.5 shows our header rules.\n\nWe\
    \ will keep the same font family and uppercase lettering and adjust the sizing.\
    \ We will also remove the browser provided bottom margin of both article headers\
    \ to keep them closer to the text they precede.\n\n# Listing 4.5 Article header\
    \ rules\n\n```\nh2 { #A\n  font: 3rem/.95 'Oswald', sans-serif;\n  text-transform:\
    \ uppercase;\n  margin-bottom: 16px;\n}\n\nh3 { #B\n  font: 2rem/.95 'Oswald',\
    \ sans-serif;\n  text-transform: uppercase;\n  margin-bottom: 12px;\n}\n```\n\n\
    #A Article heading\n#B Article subheadings\n\nOur articles headers now look as\
    \ seen in Figure 4.5."
  merge: -1
  img_proc: true

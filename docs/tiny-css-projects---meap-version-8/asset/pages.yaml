  md: '# 1.3.1 Inline CSS


    We can inline the CSS by adding a style attribute to an element. This method has
    us add the CSS to the element directly in the HTML.


    Attribute tags are always specified in the start tag and typically consist of
    the name of the attribute, in this case: style. The attribute is then followed
    by an equals sign (=) and its value in quotes. All of the CSS goes inside of the
    opening and closing quotation marks.


    As an example, let’s set the color of our heading to crimson:


    ```

    <h1 style="color: crimson"> Title of our article (heading 1) </h1>

    ```


    If we save our HTML and view it in a browser, we will see it is now crimson. If
    we are using a code editor rather than a web client (codepen), we will need to
    refresh the browser page to view our changes. Figure 1.3 shows the output. We
    notice that the only element affected is the <h1> on which we applied the styles.


    ![](img/b56145aa9b751926a7aedbd7172bc818_13_0.png)


    Figure 1.4 Crimson colored header


    The benefit (and downside) of inline CSS is that it takes the highest specificity
    in CSS, which we’ll look at in more detail shortly.



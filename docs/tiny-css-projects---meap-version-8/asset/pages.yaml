    # Id SELECTOR


    In HTML ids are unique. Any given id should only be used once on a web page. If
    it is repeated more than once then our code is considered to be invalid HTML.
    Generally we should avoid using the id selectors because due to their need to
    be unique in the HTML, classes being constructed against the id are not easily
    reusable. Furthermore, an id selector is one of the most specific selectors available
    making the styles applied using an id difficult to override. Unless the uniqueness
    of the element is key, id attributes should be avoided. Like class names, id names
    can also be written in any language.


    In our example article there is a blockquote with an id attribute containing a
    value of quote-by-author. In our CSS, to select the blockquote we use a hash (#)
    immediately followed by the id we want to target. We then have curly bracket inside
    of which we place our declarations as seen in Listing 1.4.'

    Before we worry about layout, let’s define our theme.


    # 4.1 Setting up our theme


    The theme sets the tone for the page and generally consists of colors, fonts,
    borders, and sometimes padding. Our theme will stay the same regardless of screen
    size or layout. Oftentimes, the theme of a website is tightly coupled to its logo
    and brand colors.


    We will set some defaults on the <body> tag that can be inherited by its descendants.
    As a general rule, styles that revolve around typography, (color, font-family...)
    can be inherited by most elements (exceptions are some form elements, which we
    cover in Chapter 10). It is'

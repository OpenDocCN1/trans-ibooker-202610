  md: '# 6.7 Summary


    +   - CSS custom properties are allow us to set variables that can be reused throughout
    our CSS

    +   - Flexbox allows us to position elements on a single axis either horizontally
    or vertically

    +   - `flex-direction` sets which axis flexbox will operate on

    +   - Both `flex-direction` and `flex-wrap` can alter the order in which the elements
    are displayed

    +   - The `align-items` property sets how the elements are aligned on the axis
    relative to one another

    +   - The `justify-content` property dictates how the elements positioned and
    leftover space will be distributed within the element to which it is applied.

    +   - `flex-basis` sets a starting element size for the browser to use when laying
    out flexed content

    +   - `flex-shrink` dictates whether and how content can shrink when an element
    is being flexed

    +   - We can prevent images from distorting when when using fixed heights and
    widths that do not match the image’s aspect ratio by using the `object-fit` property'

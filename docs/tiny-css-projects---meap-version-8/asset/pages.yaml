- pgno: 313
  md: "![](img/b56145aa9b751926a7aedbd7172bc818_313_0.png)\n\nFigure 11.7: Styled\
    \ share links\n\n# 11.5.4 Scale()\n\nOn hover and focus we are going to want to\
    \ expose the border by changing its color from transparent to black. When we set\
    \ the border on the links, we used the border shorthand property which allows\
    \ us to, in one declaration, define the style, border width and, border color.\
    \ Since we are only changing the color, we will use border-color rather than the\
    \ border shorthand. By using border-color we can edit the border’s color without\
    \ having to worry about the rest of the already defined properties.\n\nWe are\
    \ also going to increase the size of the icon to make it look like it has been\
    \ magnified using the scale() function. In Chapter 2, while expanding the loader\
    \ bars, we used scaleY(), which grew and shrunk the bar vertically. However, we\
    \ want our links to grow proportionally; we will therefore use scale() which,\
    \ when passed a singular parameter, will grow the element both horizontally and\
    \ vertically proportionally by the same amount.\n\nThe scale() function is actually\
    \ the shorthand for combining scaleX() and scaleY(). If only one value is passed,\
    \ the scale amount is applied both vertically and horizontally. If 2 parameters\
    \ are passed, the first parameter will define the horizontal scale, and the second\
    \ the vertical.\n\nOn hover or focus we want the link to be 25% larger than when\
    \ not being interacted with. We will therefore give our function a single parameter\
    \ of 1.25 and apply it to the transform property. Our CSS will therefore look\
    \ as follows (Listing 11.8):\n\n# Listing 11.8 Styling the links\n\n```\n.share__link:hover,\n\
    .share__link:focus-visible {\n  border-color: black;\n  outline: none;\n  transform:\
    \ scale(1.25);\n}\n```\n\nWith the styles applied, on hover (Figure 11.8) our\
    \ links grow, but because the link is now taller than the container there is a\
    \ gap on the top and bottom of the link that does not have the yellow background."
  merge: -1
  img_proc: true
- pgno: 314
  md: '![](img/b56145aa9b751926a7aedbd7172bc818_314_0.png)


    Figure 11.8: Link on hover


    To create our magnification effect, we want the entire link to remain yellow.
    We can add a yellow background to the link, which would accomplish our need; however,
    the reason the background needs to be yellow is because the block’s background
    color is yellow. If we were to change the background color of the container we
    would want the link’s background color to also change.


    To make sure the colors stay in sync we could use a custom property (CSS variable)
    or we can make the element inherit the color from its parent.


    # 11.5.5 The inherit property value


    Background-color is not inherited by default. As we have demonstrated above, it
    is not because an ancestor has a background color that its descendant automatically
    has the background color as well. We want to force this to happen. To force background-color
    to be inherited from its parent we can set the background-color property value
    for the link to inherit. Inherit, however, only goes up to the parent. In our
    case, the element that controls the background color is the link’s great grandparent
    as seen in Figure 11.9.


    ![](img/b56145aa9b751926a7aedbd7172bc818_314_1.png)


    Figure 11.9: Ancestors of the media links


    We need to make the link, menu, and menu-item rules inherit the background color
    in order to make it trickle down to the link. Once we give all 3 elements a background-color
    value of inherit (Figure 10), we notice that although we fixed our gap in the
    link being hovered, we lose our curve on the right side of the component.'
  merge: -1
  img_proc: true
- pgno: 315
  md: "![](img/b56145aa9b751926a7aedbd7172bc818_315_0.png)\n\nFigure 11.10: Inherited\
    \ background color\n\nWe lose our curve because just like `background-color`,\
    \ `border-radius` is not inherited. To fix the issue, we apply the same logic\
    \ we did for the `background-color` to `border-radius`. Our edited CSS therefore\
    \ looks as follows seen in Listing 11.9. Notice that the `border-radius` of the\
    \ link was not edited. We want to keep the link’s shape as a circle, so we keep\
    \ the `border-radius: 50%` declaration on the link.\n\n# Listing 11.9 Inheriting\

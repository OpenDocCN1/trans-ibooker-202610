- pgno: 2
  md: '# welcome


    Thank you for purchasing the MEAP for *Tiny CSS Projects*. To get the most benefit
    from this book, you''ll be familiar with HTML and CSS and how to navigate through
    a basic web project. Working together we''ll then build on your existing knowledge
    and take a deep dive into CSS.


    One of the best parts of this book is how each chapter is its own project, with
    a particular focus on different CSS topics within each chapter. It allows you
    to learn through doing, rather than hypothetical concepts. We’d also encourage
    you to experiment with what you learn in your own projects, find inspiration from
    across the web and recreate it using your new found knowledge.


    To get the most out of this book the main thing is to be creative and it''s fine
    to not get it right the first time. CSS is a fun language to learn as it''s visual,
    you can see the changes instantly and in most cases you can see when something
    goes wrong.


    CSS has never been in a better place, in the last couple of years layout features
    like grid and flexbox, animations, transitions, media queries and much more have
    been introduced and expanded on, which we will look at. Whilst that''s been happening
    old browsers like Internet Explorer have dropped away and browser support is more
    consistent.


    We hope that you find this book useful, fun and interesting as you go through
    the projects and get a good understanding of where CSS is at now.


    If you have any questions, comments, or suggestions, please share them in Manning’s
    [liveBook Discussion forum](https://livebook.manning.com) for our book:


    —Michael Gearon and Martine Dowden'
  merge: -1
  img_proc: true

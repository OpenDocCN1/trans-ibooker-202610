    \ styled in order to focus on the loader, progress bar, and animations.\n\n# Listing\
    \ 3.2 Starting CSS\n\n```\nbody { background: rgb(0 28 47); }\n\nsection {\n \
    \ display: flex;              #A\n  flex-direction: column;     #B\n  justify-content:\
    \ space-between; #B\n  align-items: center;        #B\n  max-width: 800px;   \

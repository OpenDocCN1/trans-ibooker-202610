    \ poplars. At the rear things were on even a more\n\n![](img/b56145aa9b751926a7aedbd7172bc818_202_0.png)\n\
    \n1 Santa lled. ong be ran was wound under the\n\n![](img/b56145aa9b751926a7aedbd7172bc818_202_1.png)\n\
    \n# Figure 7.9 Round Floated compass\n\nBy adding the clip path we can now observe\
    \ that the image itself, including the background now appear round. The corners\
    \ have been clipped and the background, previously square, is also circular. The\
    \ added margin also moves the text around our compass arrow, making it look less\
    \ crowded.\n\nWe have demonstrated that we can create a circle using CSS Shapes,\
    \ now let’s look at how we would make the circle using border-radius.\n\n# 7.3.3\
    \ Shape-box\n\nWe can make a shape from an element’s shape which has been altered\
    \ from its rectangular shape using border radius. We still use shape-outside but\
    \ instead of passing in a shape we specify at which level of the box model we\
    \ want the shape to form. Our options are\n\n+   - margin-box: shape follows the\
    \ margins\n+   - border-box: shape follows the borders\n+   - padding-box: shape\
    \ follows the padding\n+   - content-box: shape follows the content\n\nLet’s start\
    \ with a clean slate with our image being floated to the right and some margin\
    \ to keep the text from crowding the image. Listing 7.8 includes our starting\
    \ CSS while Figure 7.10 shows the current display.\n\n# Listing 7.8 Starting point\n\
    \n```\nimg.compass {\n  aspect-ratio: 1;\n  float: right;\n  margin-left: 1rem;\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 203
  md: "Buck lived at a big house in the sun-kissed Santa Clara Valley. Judge Miller's\
    \ place, it was called. It stood back from the road, half hidden among the trees,\
    \ through which glimpses could be caught of the wide cool veranda that ran around\
    \ its four sides. The house was approached by gravelled driveways which wound\
    \ about through wide-spreading lawns and under the interlacing boughs of tall\
    \ poplars. At the rear things\n\n![](img/b56145aa9b751926a7aedbd7172bc818_203_0.png)\n\
    \nFigure 7.10 Resetting to just float and margin\n\nNow let’s add a border radius\
    \ of 50% which will make our image a circle. At this point though, the text does\
    \ not follow the curve yet, we still need to add the shape-outside property.\n\
    \nWe have margin around our image, that ideally we want the shape to respect,\
    \ we are therefore going to use the margin-box value. Listing 7.9 shows this concept\
    \ applied in code.\n\n# Listing 7.9 Starting point\n\n```\nimg.compass {\n  aspect-ratio:\
    \ 1;\n  float: right;\n  margin-left: 1rem;\n  border-radius: 50%;\n  shape-outside:\
    \ margin-box;\n}\n```\n\nFigure 7.11 shows the output with added white background\
    \ and border to emphasize the shape of the image."

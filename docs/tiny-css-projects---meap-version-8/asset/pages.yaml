  md: 'in a value of 100%. Our rule therefore looks as follows: `img { filter: grayscale(100%)
    }`. Figure 4.12 shows the filter applied to our image.


    ![](img/b56145aa9b751926a7aedbd7172bc818_112_0.png)


    Figure 4.12 Grayscale Image


    One consideration to make before using filters is the impact on website performance.
    Some of the filter functions like grayscale are relatively simple for the browser
    to process, but functions like drop-shadow and blur can be resource-intensive.
    If we find that we are applying many filters to a large number of images, it is
    worth considering the impact of the filters on the overall page performance and
    whether we should be preprocessing the image ahead of time rather than applying
    the change via CSS.


    # 4.3.2 Handling broken images


    Even with the most thorough of diligence and best testing practices, broken image
    links can happen. Let’s add some fallbacks in order to ensure that should our
    image fail to load (regardless of the reason) we maintain a positive experience
    for our users.


    First let’s purposely break our link. In the HTML we will replace the path to
    the image to an image file that does not exist in our project like so:


    ```

    <img src="./my-broken-image.jpg" alt="my broken link" />

    ```


    The image will not display as broken as seen in figure 4.13.'

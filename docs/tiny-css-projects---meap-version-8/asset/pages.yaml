  md: '# 5.6 Summary


    +   - We used the grid property as a way to layout our cards horizontally. By
    using both media queries and grid-template-columns we adjusted the layout to be
    4 columns wide if the minimum browser window size is 950px wide, if it is between
    700px and up to 950px then set to 2 columns, anything else it will default its
    default state of stacked

    +   - The `text-transform` property can visually change text to uppercase without
    impacting the accessibility of the content; when the content is copied it won’t
    be all uppercase

    +   - Use the `text-transform: uppercase` sparingly and not on large areas of
    content

    +   - The `background-clip` property with a value of text can clip a background
    image around the text

    +   - The `background-clip` property still needs to be prefixed and this property
    can change whilst it’s being implemented

    +   - We can use a media query to check whether a device supports hover and adjust
    our layout so that it prevents the user from seeing the content if their device
    does not support hover

    +   - We can chain multiple conditions on the same media query using `and`

    +   - We can use `prefers-reduced-motion` in our media query to respect user preferences
    regarding animations and motion.

    +   - The `:not()` pseudo-class represents elements that do not match a list of
    selectors.

    +   - `translateY()` will move content vertically without affecting reflow

    +   - We can use the `transition` property to animate style change between states

    +   - To conditionally apply styles based on an element’s descendent being in
    focus we use the `focus-within` pseudo-class'

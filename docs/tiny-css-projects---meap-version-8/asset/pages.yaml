- pgno: 304
  md: '# 11.1 CSS Architecture


    Some of the most popular CSS architecture methodologies include OOCSS, SMACSS,
    and BEM.


    # 11.1.1 OOCSS


    https://github.com/stubbornella/oocss/wiki


    First presented at Web Directions North in Denver by Nicolle Sullivan, OOCSS stands
    for Object Oriented Cascading Style Sheets and aims to help developers create
    CSS that is fast, maintainable, and standards-based. The Object in Object Oriented
    Cascading Style Sheet is described by Sullivan as


    > "a repeating visual pattern, that can be abstracted into an independent snippet
    of HTML, CSS, and possibly JavaScript. That object can then be reused throughout
    a site¹"


    In other words, what we might think of today as a component or widget. To achieve
    this reusability, OOCSS follows 2 main principles.


    +   - **Separate structure and skin**: keeping visual features (background, borders...
    sometimes referred to as theme) as their own classes that can be mixed and matched
    with objects to create a variety of elements

    +   - **Separate container and content**: By refraining from using location dependent
    styles, we can ensure the objects look the same no matter where they are placed
    in the application or site.


    # 11.1.2 SMACSS


    http://smacss.com


    Developed by Jonathan Snook, SMACSS stands for Scalable and Modular Architecture
    For CSS. It aims to help organize CSS by organizing rules into 5 categories.


    +   - **Base**: the defaults applied by using element, descendent, or child selectors
    and pseudo classes.

    +   - **Layout**: used to lay elements out on the page such as headers, articles,
    and footers

    +   - **Module**: More discrete parts of the layout such as carousels, cards,
    nav bars, etc.

    +   - **State**: something that augments or overrides other styles such as an
    error state or whether a menu is opened or closed.

    +   - **Theme**: defines the looks and feel. The theme does not always have to
    be separated in its own classes if there is only one theme for the page or project.


    # 11.1.3 BEM


    https://en.bem.info/methodology/


    Developed by a company named Yandex, BEM stands for Block Element Modifier. It
    is a component based architecture which aims to break the UI into independent
    blocks which can be reused.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '+   - Block

    +     - The purpose, what the block is for or doing

    +     - Class name for the element such as `header`

    +   - Element

    +     - Describes the element’s purpose

    +     - Class name is the block name followed by 2 underscores and the the element
    such as `header__text`

    +   - Modifier

    +     - Describes the appearance, state, and behavior

    +     - The class pattern is as follows: Block-name_modifier-name (ex: `header_mobile`);
    Block-name__element-name_modifier-name (ex: `header__menu_open`)


    # 11.1.4 Picking an approach


    Choosing an architectural approach for CSS is very team dependent. The needs of
    the project, size and experience of the team, as well as the libraries and frameworks
    being used are all factors in how to choose which architecture to use. There is
    no one size fits all or universally correct answer, it is a decision that needs
    to be made by the team.


    Because of its component based approach, for this chapter we will use BEM architecture
    to scope and style our social media share links.


    # 11.2 Setup


    Now that we have chosen our methodology which dictates the naming convention we
    will use for the project, let’s take a look at what we will be building. We will
    style a share button which when clicked opens a set of links which allow the user
    to share the page via email or to Facebook, LinkedIn, or Twitter. We will then
    use transitions to animate opening and closing the share options and the hover
    and focus effect of the individual links. Our end goal is shown in Figure 11.1.



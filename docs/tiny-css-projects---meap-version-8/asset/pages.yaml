- pgno: 184
  md: "# Listing 6.17 Styling the list of technologies\n\n```\nul.technologies {\n\
    \  list-style: none;\n  padding: 0;\n  margin: 24px 0;\n  display: flex;\n  justify-content:\
    \ space-between;\n  gap: 12px;\n}\n```\n\nHowever, we notice that when we reduce\
    \ the screen width (Figure 6.28), our last chip extends beyond our card.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_184_0.png)\n\
    \nFigure 6.28 Chip extending beyond width of the card\n\nOn narrow screens our\
    \ list is wider than our card. To prevent the content from overflowing the card,\
    \ we can use the flex-wrap property.\n\nBy default, flexed items will display\
    \ in a straight line even if the container is too small as we are experiencing\
    \ with our list of technologies. To force the last element onto a new line when\
    \ we run out of room, we can set the flex-wrap property to wrap. This will tell\
    \ the browser to start a new line of items below when it runs out of room.\n\n\
    Like flex-direction, flex-wrap can also change the order in which the elements\
    \ are displayed, but we won’t need to change that here. Our updated rule is shown\
    \ in Listing 6.18.\n\n# Listing 6.18 Adding flex-wrap\n\n```\nul.technologies\
    \ {\n  list-style: none;\n  padding: 0;\n  margin: 24px 0;\n  display: flex;\n\

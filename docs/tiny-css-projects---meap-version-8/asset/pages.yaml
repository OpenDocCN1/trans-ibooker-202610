    \nFigure 4.9 Styled title, heading, subheadings, and blockquote\n\n# 4.2 CSS counters\n\
    \nOur article contains an unordered (bulleted) list. Currently, each list item\
    \ has the default bullet before each list item. We can alter what our bullet looks\
    \ like by using the list-style-type property. By default, we can choose from disc\
    \ (•), circle (○), square (■), and numbers or letters in a number of different\
    \ languages, alphabets, and number formats. But let's say we wanted our bullet\
    \ to be an emoji, specifically the hot beverage emoji (☕). We would have to create\
    \ a custom list style.\n\nTo create our custom list type, we will use the counter-style\
    \ at-rule. We have used at-rules before in chapter 3 when we created keyframes.\
    \ In this case, instead of defining how an animation will behave, we will define\
    \ how our list looks and behaves. The at-rule is called counter style because\
    \ it specifically addresses the built counting mechanism for list items in CSS.\
    \ Under the covers regardless of the list being ordered or unordered, the browser\
    \ keeps track of the position of the item in the list. It counts the items.\n\n\
    Like with keyframes (which we named in order to reference them inside of our animation\
    \ property) we will name our counter-style so that we can reference it using the\
    \ list-style property and apply it to our list. Let's name our list-style \"emoji\"\
    . Our at-rule will therefore look as follows: @counter-style emoji { }. Next,\
    \ we will define the behavior our list-style"

    # 1.7 Different ways to write CSS


    CSS has flexibility in the way we write our rules and formatting. We will now
    look at shorthand properties (which we will keep coming back to throughout the
    book) and different ways we can format CSS.


    # 1.7.1 Shorthand


    Shorthand is a way to replace writing multiple CSS properties by merging all the
    values into one property. We can do this with a few properties such as padding,
    margin, animation... all of which we will cover at various points throughout this
    book. The benefit of writing shorthand is that we reduce the size of our stylesheet
    which improves readability, performance, and memory usage.


    Each shorthand property takes different values. Let''s explore the one we used
    in our project. We have a `blockquote` in our article. When we styled it we used
    the `padding` property. We declared our padding as follows: `padding: 10px`. In
    doing so we used the shorthand. We could have written the following instead (Listing
    1.12):


    # Listing 1.15 Padding expanded


    ```

    padding-top: 10px;

    padding-right: 10px;

    padding-bottom: 10px;

    padding-left: 10px

    ```


    It is completely fine to write each declaration separately, but it is expensive
    in terms of computing performance. This is especially true since all of the property
    values are the same.


    Instead we can use the `padding` property and put all four values on the same
    line. The order goes top, right, bottom, left as described in Figure 1.25.'
  merge: -1
  img_proc: true
- pgno: 40
  md: "![](img/b56145aa9b751926a7aedbd7172bc818_40_0.png)\n\nFigure 1.25 Padding shorthand\
    \ property explained\n\nAs shown in the diagram we can declare all 4 values to\
    \ define the top, right, bottom, left values. But if we say our left and right\
    \ were the same and the top and bottom were different then we can specify 3 values,\
    \ which goes top, left & right, bottom.\n\nIf there are 2 values declared then\
    \ we are saying the first value is what the top and bottom should be and then\
    \ the second value sets the left and right. Finally if there is only 1 value declared\
    \ then this sets all 4 sides.\n\n# 1.7.2 Formatting\n\nThere are a few ways we\
    \ can write CSS and often when viewing other people's code we will see different\
    \ formats. Here are a few examples:\n\nThe multi-line format (Listing 1.13) is\
    \ most likely the most popular of choices of formatting. Each declaration is on\
    \ its own line and then either indented using either tabs or spaces.\n\n# Listing\
    \ 1.16 The multi-line format\n\n```\nh1 {\n  color: red;\n  font-size: 16px;\n\
    \  font-family: sans-serif\n}\n```\n\nThis variation on the multi-line format\
    \ (Listing 1.14) places the opening bracket on its own line. It is something we\
    \ may see in the PHP language. It could be considered unnecessary to place the\
    \ opening bracket on its own line.\n\n# Listing 1.17 A variation of the multi-line\
    \ format\n\n```\nh1\n{\n  color: red;\n  font-size: 16px;\n  font-family: sans-serif\n\
    }\n```"

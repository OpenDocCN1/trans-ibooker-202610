- pgno: 322
  md: "the container. classList.toggle() will add the class if it's not currently\
    \ present on the element and remove it if it already is.\n\n# Listing 11.13 Opening\
    \ and closing the menu (JS)\n\n```\n(() => {\n  ...\n  let expanded = false; #A\n\
    \  const container = document.getElementById('share'); #B\n  ...\n  function addButtonListeners()\
    \ {          #C\n    shareButton.addEventListener('click', toggleMenu);   #C\n\
    \    ...                                     #C\n  }                         \
    \                #C\n\n  function toggleMenu(event) {\n    expanded = !expanded;\
    \ #D\n    ...\n    container.classList.toggle('share_expanded'); #E\n    ...\n\
    \    ...\n  }\n}\n```\n\n+   #A defines a variable to hold our current state\n\
    +   #B defines a variable for our HTML container element\n+   #C defines what\
    \ happens when the button is clicked\n+   #D toggles the expanded variable value\n\
    +   #E handles adding and removing the share_expanded\n\nNOTE JS IS ALREADY IN\
    \ THE STARTER CODE Since this is a CSS book, the JS has already been included\
    \ in the starter code. If you are following along, you don't need to make any\
    \ edits to the JS, it should just work.\n\nAll put together this code makes it\
    \ so that when the button is clicked we add the share_expanded class to the container.\
    \ If it is already open we remove it. We had hidden our menu items, we will now\
    \ show them when the share_expanded class is present.\n\nNOTE CLASSE NAME SHARE_EXPANDED\
    \ Remember that we decided we were going to use BEM for our class name convention.\
    \ Notice that our class name only has one underscore. This is because expanded\
    \ is our modifier. We use a modifier because we are changing (modifying) the style\
    \ based on the state (open / close). We have the block (share) and the modifier\
    \ (expanded); therefore our class name is block_modifier or share_expanded.\n\n\
    To hide our menu we used the width property with a value of 0 and hide the overflow\
    \ (Listing 11.14)."

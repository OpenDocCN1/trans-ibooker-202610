- pgno: 100
  md: "worth mentioning that font-size is not inherited. By setting inheritable properties\
    \ on the parent, the styles will trickle down to the descendents, preventing us\
    \ from needing to apply them to every element.\n\n# 4.1.1 Importing fonts from\
    \ Google Fonts\n\nWe apply a background color, font, and text color (Listing 4.2).\
    \ Notice that before the body rule, we import our chosen font-family from Google\
    \ Fonts. We tend to use Google Fonts as it’s freely available, without needing\
    \ to create an account or pay to use the fonts. PT Serif is not a font we can\
    \ safely expect a user to already have loaded on their computer, we therefore\
    \ have to import it for the browser to know what the glyphs (letters, numbers,\
    \ and symbols) should look like. We also provide a default of serif as a fallback\
    \ should the import fail.\n\n# Web safe fonts\n\nThere are very few web safe fonts\
    \ (fonts we can assume most devices will have access to). The generally accepted\
    \ list is: Arial, Verdana, Helvetica, Tahoma, Trebuchet MS, Times New Roman, Georgia,\
    \ Garamond, Courier New, Brush Script MT¹.\n\nRegardless of the font family we\
    \ choose, it is good practice to always provide a fallback value (Serif, Sans-serif,\
    \ Monospace, Cursive, or Fantasy)\n\nAlthough we will do the bulk of the layout\
    \ later in the chapter, we also add some left and right padding on our body now\
    \ to move our text away from the edge.\n\n# Listing 4.2 Defining some theme styles\n\
    \n```\n@import url('https://fonts.googleapis.com/css2?family=PT+Serif&display=swap');\
    \  #A\n\nbody {\n  background-color: #f9f7f1;\n  font-family: 'PT Serif', serif;\
    \  #B\n  color: #404040;\n  padding: 0 24px;\n}\n```\n\n#A Importing PT Serif\
    \ from Google Fonts\n\n#B Applying PT serif to our content and providing a fallback\n\
    \nFigure 4.3 shows our updated page. We notice that all of the elements in the\
    \ body have inherited the color and font-family."

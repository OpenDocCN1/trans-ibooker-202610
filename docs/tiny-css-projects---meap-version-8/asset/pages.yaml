    # 4.3.3 Formatting captions


    The Image does not currently have a caption, so we are going to add one using
    the figure and figcaption HTML elements. Then we will style it.


    <figure> and <figcaption> go hand in hand. The figure contains the image and then
    the optional figcaption. Often seen in books and other publishing material, diagrams,
    charts and images will have text underneath the element describing it or relating
    it to the text. Semantically, the benefit of grouping the image and the caption
    together is that it programmatically links the image with its caption. From a
    styling perspective, having the elements together in a parent element allows us
    to position the element and its caption together as a unit.


    Listing 4.9 shows how to change the HTML to add the figure and caption.


    # Listing 4.9 Adding a figure and figcaption to the HTML


    ```

    <figure>  #A

    <img src="./image.jpg" alt="" onerror="this.style.display=''none''" />  #B

    <figcaption>Golden Gate Bridge</figcaption> #C

    </figure> #D

    ```


    #A Start of the figure

    #B Our image

    #C Our image caption

    #D End of the figure


    Let’s style the figure and the caption, starting by removing the browser provided
    margins (seen in Figure 4.16) that are currently being applied to the figure.'

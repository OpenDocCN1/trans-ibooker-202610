- pgno: 198
  md: '# 7.3 Curving text around the compass


    The first thing we need to do to make the text wrap around our compass image is
    to float the compass to the right. Our compass is a png and by virtue of being
    an image, rectangular in nature, therefore the text wraps around the image following
    a rectangular path. Figure 7.7 shows the floated compass. A border has been applied
    to the image to expose its bounding box.


    ![](img/b56145aa9b751926a7aedbd7172bc818_198_0.png)


    Buck lived at a big house in the sun-kissed Santa Clara Valley. Judge Miller''s
    place, it was called. It stood back from the road, half hidden among the trees,
    through which glimpses could be caught of the wide cool veranda that ran around
    its four sides. The house was approached by gravelled driveways which wound about
    through wide-spreading lawns and under the interlacing boughs of tall poplars.
    At the rear things were on even a more spacious scale


    Figure 7.7 Square Compass


    # 7.3.1 Shape-Outside: Circle


    In order to make the text follow the curve of the compass we need to add a curve
    to the image for the text to wrap around.


    The property we will use is shape-outside (https://developer.mozilla.org/en-US/docs/Web/CSS/shape-outside).
    Shape-outside allows us to define a shape around which the adjacent text will
    flow. This shape does not have to be rectangular either. It can be a


    +   - Circle or ellipse

    +   - Polygon

    +   - Derived from an image - uses the alpha channel (transparency) of the image
    to determine what the shape should be

    +   - Path - in the specification but not implemented on any browser as of this
    book being written (https://developer.mozilla.org/en-US/docs/Web/CSS/basic-shape#path())

    +   - Box model value


    Since we have a very circular graphic, the shape we are going to aim for is a
    circle. This gives us a couple options:'
  merge: -1
  img_proc: true
- pgno: 199
  md: '+   1. Use CSS shapes (https://developer.mozilla.org/en-US/docs/Web/CSS/basic-shape#path())

    +   2. Use border radius


    Let’s first take a look at using shapes.


    To define our circle, we are going to use the circle function. Circle takes a
    radius property and an optional position property which defines where the center
    of the circle should start. If the position property is omitted, the origin of
    the circle will default to the center of the image.


    ```

    circle( [<shape-radius>]? [at <position>]? )

    ```


    In our case we do want the center of the circle to be the middle of the image
    so we will not pass a position. However, we will have to define a radius. We are
    going to set it to 50% (we want the radius to equal half of the width of our image)
    which under the covers will resolve to the square root of our width squared plus
    our height squared divided by the square root of 2.


    radius = % × √(height² + width²) / √2 = .5 × √(175² + 175²) / √2 = 87.5


    Since our image is square and has a width of 175, when passing a radius of 50%
    it’s very logical that our radius would be 87.5, however, if the image were to
    be rectangular, understanding how a percentage based radius is calculated is quite
    important to understand what the resulting output will look like.


    If we had a landscape image of height 100px and width 300px, the radius of the
    circle, we choose a percentage based value, is much less obvious. We can use the
    formula above to calculate what the radius would be.


    radius = % × √(height² + width²) / √2 = .5 × √(100² + 300²) / √2 ≈ 111.8


    Figure 7.8 shows how the radius would be applied to our square image, versus a
    rectangular image when using a value of 50% in the circle function.'
  merge: -1
  img_proc: true
- pgno: 200
  md: "![](img/b56145aa9b751926a7aedbd7172bc818_200_0.png)\n\n![](img/b56145aa9b751926a7aedbd7172bc818_200_1.png)\n\
    \n![](img/b56145aa9b751926a7aedbd7172bc818_200_2.png)\n\nSquare\nShape-outside:\
    \ circle(50%)\n\nlandscape\n\nportrait\n\nBack to our image, it is square, so\
    \ we use a shape-outside property with a value of circle(50%) to our image. Listing\
    \ 7.6 shows our CSS rule.\n\nOur image is square, so it has an aspect ratio of\
    \ 1 (width / height = 175 ÷ 175 = 1).\n\nASPECT RATIO: The aspect ratio of an\
    \ image is the proportional relationship of the image's height and width calculated\
    \ by dividing the width by the height.\n\nAdding the aspect ratio is not strictly\
    \ necessary to create our shape but will help reduce layout shifts on load.\n\n\
    LAYOUT SHIFTS: When an element is added to the page, or its size is changed, everything\
    \ after the element moves to make room for the element or fill in the void left\
    \ behind. The movement of elements on the page is referred to as a layout shift.\n\
    \nWhen the image has a set height and width or has a defined aspect ratio, the\
    \ browser can save room for the image while it is being loaded and therefore reduce\
    \ this movement. It is therefore good practice to define aspect ratios and or\
    \ a height and width for our images.\n\n# Listing 7.6 shape-outside\n\n```\nimg.compass\
    \ {\n  aspect-ratio: 1; #A\n  float: right;  #B\n  shape-outside: circle(50%);\
    \ #C\n}\n```\n\n#A Aspect ratio\n#B Float the image to the right\n#C Add our circle\
    \ with a value of 50%\n\nFigure 7.8 displays our output. The text wraps around\
    \ the image and follows the curve, but our image is not clipped in any way."
  merge: -1
  img_proc: true
- pgno: 201
  md: "![](img/b56145aa9b751926a7aedbd7172bc818_201_0.png)\n\nFigure 7.8 Floated compass\
    \ with curved text\n\n# 7.3.2 Clip-Path\n\nThis works because our image has a\
    \ transparent background. We’ve curved the text, but the image is still quite\
    \ square. If we add a background to the image, this becomes obvious. To make the\
    \ image appear truly circular we need to add a clip-path (https://developer.mozilla.org/en-US/docs/Web/CSS/clip-path).\
    \ Clip-path also takes a shape so we are going to pass it the same value we passed\
    \ to shape-outside. We are also going to add some margin to our image to add a\
    \ little bit of breathing room between it and the text. Listing 7.7 shows the\
    \ complete css for our image.\n\n# Listing 7.7 clip-path\n\n```\nimg.compass {\n\
    \  aspect-ratio: 1;\n  float: right;\n  shape-outside: circle(50%);\n  clip-path:\
    \ circle(50%);\n  margin-left: 1rem;\n}\n```\n\nWe added a clip-path that matches\
    \ our shape outside and a some margin to the left of the image to prevent the\
    \ text from getting too close to the image especially since the compass has arrows\
    \ protruding from the circular outline not accounted for by our circle. Figure\
    \ 7.9 shows the finished output for the compass image."
  merge: -1
  img_proc: true
- pgno: 202

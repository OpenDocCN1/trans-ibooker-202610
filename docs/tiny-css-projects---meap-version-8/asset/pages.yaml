  md: '```

    color: inherit;

    border: solid 1px var(--border);

    border-radius: 32px;

    padding: 1rem 2rem;


    display: block;

    width: calc(100% - 4rem);

    }

    ```


    ![](img/b56145aa9b751926a7aedbd7172bc818_277_0.png)


    Figure 10.24 Select not taking full width


    # 10.4.1 Select styling limitations


    Before we go about fixing the select to match our other styles, let’s first address
    some of the limitations we are going to encounter. select, like the radio and
    checkbox inputs, gets a lot of its styles and functionality from the operating
    system itself. We are therefore going to be limited in what we can style with
    CSS alone, especially the options list. We can use JavaScript and ARIA to replace
    the entire control but since this is a book about CSS, we are going to style as
    much as we can with CSS alone and stop there.


    Like we did with the radios and checkboxes, we will first start by removing as
    much of the native styles as we can by using the appearance property and give
    it a value of none. We will then set its width to 100% to make it take the full
    width of the container. With our drop down devoid of its native appearance and
    correctly sized as seen in Figure 10.25, we can focus on reinstating the arrow.
    Notice that the arrow is gone but that our options were not affected by adding
    appearance: none.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '![](img/b56145aa9b751926a7aedbd7172bc818_278_0.png)


    Figure 10.25 Full width select with no arrow


    # 10.4.2 Using linear-gradients to create an arrow


    Our next order of business will be to create a new arrow whose positioning we
    can control. Remember at the beginning of the chapter, we used a gradient to create
    a circle? We are going to use this trick again to create our arrow which we will
    add to our dropdown using the background-image property.. Instead of a radial-gradient
    however, we will use a linear-gradient.


    Much like radial-gradient, linear-gradient will take a series of colors and percentages
    for when they should start and stop, but instead of the colors being displayed
    in a circular fashion around a center point, they will be placed in a linear fashion
    towards a side or corner. It can also take an angle to dictate the direction of
    the lines of color. Table 10.3 shows the angle and their keyword equivalents when
    dictating the direction of the lines of color.


    Table 10.3 Keyword and Angle Equivalent


    | Keyword | Angle in degrees |

    |---|---|

    | to top | 0 |

    | to bottom | 180 |

    | to left | 270 |

    | to right | 90 |


    Same as with the radial-gradient, if we stop and stop a color at the same percentage,
    we will get a sharp line rather than a fade from one color to another.


    The background-image property allows us to add multiple images to our background.
    We are going to exploit this functionality. We will need three overlapping gradients
    to create our arrow which will all be assigned to our background-image property.'
  merge: -1
  img_proc: true
- pgno: 279
  md: "We first give our background a height and width of 1rem, creating a square.\
    \ We then set the background image to our three gradients. The first value will\
    \ be on top, the last on the bottom. Working from the bottom to the top, we start\
    \ with a gradient that goes from accent color to accent color. In other words,\
    \ we create a blue box. We then create a second gradient that is placed on top\
    \ of the square. Our second gradient splits the box from bottom left to top right,\
    \ where the top is transparent and bottom is our background color. This creates\
    \ a triangle obfuscating the bottom right of the box. Our third will be the opposing\
    \ diagonal, from top left to bottom right with again, the top transparent, and\
    \ the bottom our background color. This creates another triangle which obfuscates\
    \ the bottom bottom left of the box. This leaves an inverted blue triangle 1rem\
    \ wide and half a rem tall exposed. Figure 10.26 illustrates the process.\n\n\
    ![](img/b56145aa9b751926a7aedbd7172bc818_279_0.png)\n\nFigure 10.26 Creating an\
    \ arrow from superimposed gradients\n\nAll that is left is to position our background\
    \ and prevent it from repeating. We want the background to be 1rem from the right\
    \ side of our control and centered. We can use the calc() function to do the math\
    \ for us. To calculate the horizontal position we take the full width (100%) and\
    \ subtract 1rem. For the vertical positioning, we know that we have 1rem of padding\
    \ top and bottom plus our text which also has a size of 1rem making our control\
    \ 3rem in height. We can therefore position our arrow at 50% below the top. Since\
    \ the height of the arrow is only half a rem, we then add ⅓rem to the top position.\n\
    \nAll put together we get the following rule for our select (Listing 10.18):\n\
    \n# Listing 10.18 Styled Select\n\n```\nselect {\n  appearance: none;\n  width:\
    \ 100%;\n\n  background-image:\n    linear-gradient(225deg, transparent 50%, var(--background)\
    \ 50%),\n    linear-gradient(135deg, transparent 50%, var(--background) 50%),\n\
    \    linear-gradient(var(--accent), var(--accent))\n  ;\n\n  background-size:\
    \ 1rem 1rem;\n  background-position: calc(100% - 1rem) calc(50% + .33rem);\n \
    \ background-repeat: no-repeat;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 280
  md: "Figure 10.27 shows our styled select.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_280_0.png)\n\
    \nFigure 10.27 Styled and Positioned Select Arrow\n\nTo style the select options\
    \ themselves, only `color` and `background` can be styles, and even then, only\
    \ some browsers will allow those to be applied. This is because the styles for\
    \ options are controlled by the underlying operating system. For cross browser\
    \ compatibility and accessibility, we will therefore leave those as they are.\n\
    \nWe have now styled all of the form controls in our form. Let’s revisit our labels\
    \ and add some breathing room between our labels and our controls so that our\
    \ elements aren’t so closely compacted against each other.\n\n# 10.5 Styling labels\
    \ and legends\n\nTo style our labels and the legend, we are going to start by\
    \ giving them `margin`. We will give them vertical margin for breathing room in\
    \ between items. We will also give them left margin so that the label text aligns\
    \ with where the text begins in the input field. We gave the inputs left padding\
    \ of `2rem`. We can therefore give our labels the same amount of left margin to\
    \ align the text visually on the page. Because labels have a `display` value of\
    \ `inline` by default, we will need to give them a `display` value of `block`\
    \ for the margin to apply. Finally we will also decrease their font size. The\
    \ information that is most important here is the values that are entered by the\
    \ user, not the labels. By decreasing their size we diminish their importance\
    \ in the visual hierarchy. We end up with the code displayed in listing 10.19.\n\
    \n# Listing 10.19 Added margin and updated font size\n\n```\nlabel, legend { #A\n\
    \  display: block;\n  margin: 1rem 0 0 2rem; #B\n  font-size: .875rem;\n}\n```\n\
    \n#A we apply the styles to both the labels and the legend\n#B Margin top of 1\
    \ rem, margin left of 2 rem\n\nNotice in Figure 10.26 that the `legend` is still\
    \ very close to the \"Reason for Contact\" field above it. Also, our radio buttons\
    \ are now very far apart."
  merge: -1
  img_proc: true
- pgno: 281
  md: "![](img/b56145aa9b751926a7aedbd7172bc818_281_0.png)\n\nFigure 10.28 Added Label\
    \ and Legend Margin\n\nTo add space between our legend and the \"Reason for Contact\"\
    \ above we are going to give our fieldset itself some margin. We will then specifically\
    \ target the labels that are within the fieldset and reduce their vertical margin\
    \ so that the radio inputs are closer together. We want to keep the radio inputs\
    \ close together because the closer they are to one another visually, the easier\
    \ it will be for the user to recognize them as belonging together as a group.\
    \ Listing 10.20 shows our updated margins.\n\n# Listing 10.20 Added margin and\
    \ updated font size\n\n```\nfieldset {\n    #A\n    ...\n    #A\n    margin: 1rem\
    \ 0;\n    #A\n}\n\nfieldset label {\n    #B\n    margin: .5rem 0 0 2rem;\n   \
    \ #B\n```\n\n#A Add margin to our already existing fieldset rule\n#B Update the\
    \ margin of the labels that inside of the fieldset\n\nWith our labels now formatted\
    \ (Figure 10.29) let’s continue down the form and style the buttons."
  merge: -1
  img_proc: true
- pgno: 282
  md: "![](img/b56145aa9b751926a7aedbd7172bc818_282_0.png)\n\nFigure 10.29 Styled\
    \ Labels and Legend\n\n# 10.6 Styling the buttons\n\nWe have two buttons at the\
    \ bottom of our form. The first performs our primary action, \"Send\". The second,\
    \ \"Reset\" performs a secondary action. We will therefore make the \"Send\" button\
    \ much more prominent than our reset as it is the most likely to be used and the\
    \ behavior we desire the user to perform. The reset is there as a tool or utility\
    \ to help the user but should not be our primary focus.\n\n# 10.6.1 Resetting\
    \ the button styles\n\nWe will first reset the button styles to match our theme\
    \ and then differentiate where needed for our two use cases. We create a rule\
    \ with a button selector, which applies to all buttons removing the border and\
    \ background, setting our typography preferences, adding padding and marring,\
    \ adding a border-radius, and changing the cursor to a pointer. Our base styles\
    \ are shown in Listing 10.21.\n\n# Listing 10.21 Reset button styles\n\n```\n\
    button {\n  border: none;\n  background: none;\n  border-radius: 36px;\n  padding:\
    \ 1rem 3rem;\n  font-family: var(--font-family);\n  font-size: 1rem;\n  cursor:\
    \ pointer;\n}\n```"

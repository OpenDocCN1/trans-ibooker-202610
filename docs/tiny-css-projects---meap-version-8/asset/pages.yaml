- pgno: 323
  md: "# Listing 11.14 Hiding the menu\n\n```\n.share__menu {\n  display: flex;\n\
    \  margin: 0;\n  padding: 0;\n  background: inherit;\n  border-radius: inherit;\n\
    \  width: 0;          #A\n  overflow: hidden;  #B\n}\n```\n\n#A makes the width\
    \ of the menu equal to 0\n#B hides the overflow so that the links within are also\
    \ hidden\n\nTo show the links when the component is marked as expanded we must\
    \ increase our width of the menu as seen in Listing 11.15. We also add a little\
    \ bit of horizontal padding to add some room round the menu.\n\nTo calculate the\
    \ width of the menu we take the number of links and multiply by their width. The\
    \ link’s width is 48 pixels (that we hard set) plus the border (1 pixel on each\
    \ side). Therefore the menu’s width is width = 4×(48 + 2) = 200px.\n\n# Listing\
    \ 11.15 Showing the menu\n\n```\n.share_expanded .share__menu {\n  width: 200px;\n\
    \  padding: 0 2rem 0 1rem;\n}\n```\n\nRunning the code, after clicking the button\
    \ and hovering over the link we can see that our link no longer expands outside\
    \ of our menu (Figure 11.14).\n\n![](img/b56145aa9b751926a7aedbd7172bc818_323_0.png)\n\
    \n![](img/b56145aa9b751926a7aedbd7172bc818_323_1.png)\n\nFigure 11.14: Expanded\
    \ component on click\n\nThe reason we no longer expand outside of the background\
    \ like we did initially is because we added overflow: hidden to our menu in order\
    \ to hide the links when the menu was given a width of 0. We must therefore set\
    \ the overflow back to visible once we are expanded. Listing 11.16 shows our updated\
    \ rule."
  merge: -1
  img_proc: true
- pgno: 324
  md: "# Listing 11.16 Showing the menu\n\n```\n.share_expanded .share__menu {\n \
    \ width: 200px;\n  padding: 0 2rem 0 1rem;\n  overflow: visible;\n}\n```\n\nWith\
    \ the overflow reinstated, our magnification effect is restored (Figure 11.15).\
    \ The next piece is to maintain the button outline that is usually present on\
    \ hover, when the component is open.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_324_0.png)\n\
    \n# Figure 11.15: Open component with the overflow reinstated\n\nSince we already\
    \ have a rule written on hover and focus to add the border, we are going to append\
    \ the rule to also trigger when the component is open. By reusing the same rule\
    \ we ensure that the styles will be consistent when being hovered, focused, or\
    \ when the list is visible. To add the condition, we add the .share_expanded .share__button\
    \ selector to the existing rule (Listing 11.17).\n\n# Listing 11.17 Adding the\
    \ button border to share button when list is showing\n\n```\n.share__button:hover,\n\
    .share__button:focus-visible,\n.share_expanded .share__button {\n  cursor: pointer;\n\
    \  outline: solid 1px black;\n  outline-offset: -5px;\n}\n```\n\nWith the selector\
    \ added, our button now keeps its border once the component is expanded (Figure\
    \ 11.16) and when closed and not focused or hovered, we see that the border stays\
    \ absent.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_324_1.png)\n\n# Figure 11.16:\
    \ Maintaining the share button border when list is showing"
  merge: -1
  img_proc: true
- pgno: 325
  md: '# 11.6.3 Animating the menu


    Now that we have our styles set for both open and closed, let’s animate the showing
    and hiding of the menu. We want the link list to expand from the left as depicted
    in Figure 11.17.


    ![](img/b56145aa9b751926a7aedbd7172bc818_325_0.png)


    Figure 11.17: Breakdown of opening animation


    When the menu closes we will want to perform the inverse of the opening animation,
    retracting the menu hiding the link as we go.


    Same as for the magnification effect we added to the links, we are going to use
    a transition. We don’t need to use keyframes because the animation is only going
    to be performed once when the button is clicked, and we already have the 2 states
    defined.


    We will add the transition declaration to the menu as follows: `transition: width
    250ms ease-in-out`. Again we want to keep the transition snappy so we give it
    a 250 millisecond duration.


    Once we add the transition we realize that icons are becoming visible before they
    should. Figure 11.18 breaks down the effect.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '![](img/b56145aa9b751926a7aedbd7172bc818_326_0.png)


    Figure 11.18: Icons displaying too soon


    Even if we change the transition to transition all properties instead of just
    width, the same issue occurs. The root cause is overflow. When the menu is closed,
    we want the menu’s overflow to be hidden. When it is open, we want it to be visible.
    However, overflow is not something that can be gradually changed like width. It
    is either visible or it’s not—there is no in between.


    When opening the menu, we want to wait until the transition is done before we
    change overflow to visible. When we close, we want the overflow to be hidden immediately.
    This is where we turn to JavaScript to support our CSS.


    We will remove overflow: visible from our .share_expanded .share__menu class and
    handle adding it via JavaScript.


    Listing 11.18 singles out the relevant JavaScript for handling the overflow. The
    magic lies in the transitionstart and transitionend event listeners. Attached
    to the menu, they listen for when the transition is triggered and when it is done
    performing the change. Upon the event happening, they trigger their respective
    functions which handle the overflow for the menu.'
  merge: -1
  img_proc: true
- pgno: 327
  md: "# Listing 11.18 JavaScript for handling overflow\n\n```\n(() => {\n'use strict';\n\
    \nlet expanded = false;\nconst container = document.getElementById('share');\n\
    const menu = container.querySelector('menu');\n...\naddTransitionListeners();\n\
    ...\nfunction addTransitionListeners() {\n  menu.addEventListener('transitionstart',\
    \ handleAnimationStart);\n  menu.addEventListener('transitionend', handleAnimationEnd);\n\
    }\n...\nfunction handleAnimationStart() { #A\n  if (!expanded) { menu.style.overflow\
    \ = 'hidden'; } #B\n}\n...\nfunction handleAnimationEnd() { #C\n  if (expanded)\
    \ { menu.style.overflow = 'visible'; } #D\n}\n})()\n```\n\n#A Is triggered when\
    \ the transition starts\n#B If in the process of closing, we hide the menu's overflow\n\
    #C Is triggered when the transition ends\n#D If just opened, we show the overflow\n\
    \nNOTE JS IS ALREADY IN THE STARTER CODE Same as earlier in the chapter, since\

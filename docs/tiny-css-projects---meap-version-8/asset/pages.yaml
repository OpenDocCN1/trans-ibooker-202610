  md: "```\n}\n    menuItems[newIndex].setAttribute('data-current', 'true');\n   \
    \ menuItems[newIndex].querySelector('a').focus();\n}\n\nfunction moveToPrevious()\
    \ {\n    const selectedIndex = menuItems.findIndex(li => li.dataset.current);\n\
    \    const newIndex = selectedIndex < 1 ? menuItems.length - 1 : selectedIndex\
    \ - 1;\n    if (selectedIndex != -1) {\n        menuItems[selectedIndex].removeAttribute('data-current');\n\
    \    }\n    menuItems[newIndex].setAttribute('data-current', 'true');\n    menuItems[newIndex].querySelector('a').focus();\n\
    }\n\nfunction navigate(event) {\n    const url = event.target.href;\n    window.open(url);\n\
    }\n\nfunction handleAnimationStart() {\n    if (!expanded) { menu.style.overflow\
    \ = 'hidden' ;}\n}\n\nfunction handleAnimationEnd() {\n    if (expanded) { menu.style.overflow\
    \ = 'visible' }\n}\n})()\n```\n\n#A Adds event listeners to share button for clicks\
    \ and key presses to open and close the menu both via keyboard and mouse\n#B Adds\
    \ event listens to links for clicks and key presses to handle keyboard navigation\
    \ within the menu\n#C Add event listeners to menu in order to know when transitions\
    \ start and end\n#D Handles keyboard up and down arrow functionality or the share\
    \ button\n#E Handle keypress on links for keyboard navigation within the menu\
    \ including exiting the menu\n#F Prevents tab from navigating between the links\
    \ because on tab we want to return focus to the share button rather than go to\
    \ the next link\n#G Opens and closes the menu\n#H When next is defined, moves\
    \ the focus to the specific item by index. Otherwise will cycle through the links\
    \ returning to the top when user reaches the last item in the menu\n#I Moves focus\
    \ to the previous link and returns user to the bottom of the list when they reach\
    \ the first item in the menu\n#J Navigates the user when the action is keyboard\
    \ triggered and not the default click or enter. Used when the user presses space\
    \ bar while on a menu item\n#K Hides the overflow when menu is closing\n#L If\
    \ open, we show the overflow to allow the magnified icon to expand outside of\
    \ the container\n\nMost of the code is for handling keyboard accessibility for\
    \ the component, and Listing 11.13 shows the parts relevant to the button click.\
    \ When the page loads we default the component to being closed and find the element’s\
    \ container which we assign to the `container` variable. We then add event listeners\
    \ to the button so that when the button is clicked the `toggleMenu()` function\
    \ is triggered.\n\nWhen the button is clicked we change the `expanded` variable\
    \ to its inverse. If it was `true`, it will become `false` and vice versa. We\
    \ then add or remove the `share_expanded` class from"

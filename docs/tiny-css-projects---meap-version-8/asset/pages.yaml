- pgno: 246
  md: "# 8.5 Wide screens\n\nAs we continue to increase the width of the screen, however,\
    \ the summary section becomes harder to read because of the increasing distance\
    \ between the definition titles and descriptions. Since, as we get wider, we have\
    \ more horizontal real estate to play with, we will bring the summary section\
    \ up beside the cart section once the viewport reaches 995 pixels wide or larger.\
    \ Same as before we will create a media query: @media (min-width: 995px) { }.\n\
    \nIn our HTML we have a container div around our 2 sections with a class of section-container.\
    \ We will give it a display of flex for the 2 items to come side by side and align\
    \ themselves on the x-axis. We will then add a gap of 1 rem between the 2 sections.\n\
    \nNOTE Flexbox Flexbox allows us to place and align elements on a single axis.\
    \ Check out chapter 6 if you need a refresher on how flexbox works.\n\nFlexbox\
    \ will auto-calculate the amount of space to give each section based upon its\
    \ content unless we use grow and shrink to instruct it otherwise. Rather than\
    \ use grow and shrink which are ratio based, we are going to give the summary\
    \ section a minimum width, preventing the chances of the text wrapping (unless\
    \ the text is being scaled by the user) and leaving the rest of the available\
    \ space to the table.\n\nIf we take the screen even wider, such as with the extra\
    \ wide curved displays, we eventually get to a point where the content becomes\
    \ unreadable once more. To prevent this from happening we will add a final condition\
    \ limiting the width of our layout. By applying a maximum width to the body, we\
    \ ensure that no matter how wide of a display the user has, and chooses to extend\
    \ the window to, the content remains usable. We can then center the body by giving\
    \ it a left and right margin of auto.\n\nListing 8.21 shows our media query and\
    \ its contents as well as the edit to the body layout rule to cap the width the\
    \ body will take.\n\n# Listing 8.21 Wide screen media query and maximum width\n\
    \n```\nbody {\n  padding: 1rem;\n  max-width: 1280px;  #A\n  margin: 0 auto; \
    \   #A\n}\n\n@media (min-width: 995px) {\n  .section-container {  #B\n    display:\
    \ flex;      #B\n    gap: 1rem;          #B\n  }\n\n  .summary {\n    min-width:\
    \ 250px;\n  }\n}\n```\n\n#A Preventing the content from getting any wider than\
    \ 1280 pixels wide and centering the body."
  merge: -1
  img_proc: true
- pgno: 247
  md: '# #B Placing the card and the summary side by side


    Figure 8.28 shows our layout with a 1800 pixel wide viewport. Notice however,
    that now that we have flexed the container, we have extra space between the h1
    (Checkout) and the sections.


    ![](img/b56145aa9b751926a7aedbd7172bc818_247_0.png)


    Figure 8.28 Layout on a really wide screen


    Because the container now has a display flex, the margin on the sections and the
    margin from the h1 (which exists as part of the browser’s default styles) no longer
    collapse. We have 3 ways we can fix this:


    +   1. Change section margin to only have a margin bottom

    +   2. Remove margins on the sections once we are flexed

    +   3. Remove the margin-bottom which exists on the h1 from the browser’s default
    styles


    We are going to choose option 2 and remove the top and bottom margins from the
    sections since once we are flexed and the sections are side by side, they are
    no longer necessary. Inside of our media query, we therefore need to add section
    { margin: 0; }.


    With this final change we have a checkout cart that looks good on screens from
    mobile to extra wide. Figure 8.29 shows the final output for each screen size.'
  merge: -1

- pgno: 86
  md: "The default styles of the `progress` element will vary between browsers and\
    \ operating systems. Much of the functionality of the progress bar is handled\
    \ at the operating system level, as a result, we have few properties available\
    \ to use to restyle the control especially when it comes to the colored progress\
    \ indicator inside the bar itself.\n\nWe will look at some of the workarounds\
    \ available to use and some of their pitfalls, but first let’s start with what\
    \ we can easily do.\n\nFigure 3.12 shows our starting point generated by the HTML\
    \ found in Listing 3.11. At this point, no styles have been applied to the control.\
    \ Being shown are the defaults generated by the author’s machine.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_86_0.png)\n\
    \nFigure 3.12 Progress bar starting point\n\n# Listing 3.13 Progress bar HTML\n\
    \n```\n<body>\n  <section>\n    ...\n    <progress value=\"32\" max=\"100\">32%</progress>\
    \ #A\n  </section>\n```\n\n#A The progress bar\n\n# 3.6.1 Styling the progress\
    \ bar\n\nLet’s start with changing the height and the width. To increase the width\
    \ of the progress bar to match the width of the section, we will give its `width`\
    \ property a value of 100%. We also want to increase the height to 24px.\n\nTo\
    \ change the color of the progress indicator, the colored portion of the control,\
    \ we can use a fairly new property: `accent-color`. This property allows us to\
    \ change the color of form controls such as checkmarks, radio inputs, and the\
    \ progress element. We will set it to #128688, matching the color of the last\
    \ bar of our loader. Listing 3.12 shows our progress rule thus far.\n\n# Listing\
    \ 3.14 Progress rule\n\n```\nprogress {\n  height: 24px;\n  width: 100%;\n  accent-color:\
    \ #128688;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Figure 3.13 shows the Lising 3.12 styles applied to our control.


    ![](img/b56145aa9b751926a7aedbd7172bc818_87_0.png)


    Figure 3.13 Width, height, and accent color applied to the progress element


    If we try to add a background color to our element (background: pink), we will
    notice that it does not work. As a matter of fact, it fails quite spectacularly
    (Figure 3.14) as it radically changes the appearance of the element and alters
    the accent-color we had previously set. Furthermore, the background color changes
    to gray rather than pink.


    ![](img/b56145aa9b751926a7aedbd7172bc818_87_1.png)


    Figure 3.14 Background color failure


    So how do we get around this problem? In order to restyle the control, we need
    to ignore the default, and recreate the styles from scratch. To do that though
    we will need to use vendor prefixed properties.


    # 3.7 Vendor Prefixes


    Historically when browsers were introducing new properties they would be added
    with a vendor prefix before the property name. Each browser’s prefix is based
    on the rendering engine they use. Table 3.1 displays major browsers and their
    prefixes.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Table 3.1 Vendor prefixes and their browsers


    | Prefix | Browsers |

    |---|---|

    | -webkit- | Chrome, Safari, Opera, most IOS browsers (including Firefox for IOS),
    Edge |

    | -moz- | Firefox |


    However, vendor prefixed properties were never meant, and still aren’t fit, for
    production use. They are often incomplete or non-standard implementations that
    browsers may choose to either remove or completely refactor at any time. Although
    this fact has been clearly documented for years, developers, eager to use the
    latest available properties, regularly used them in production nonetheless.


    To prevent this continued behavior most major browsers have moved to shipping
    experimental features behind a feature flag. To enable the feature and play with
    it, the user must go into their browser settings and enable that specific flag.
    By moving to a flag based method, the browsers are able to let developers play
    with experimental cutting edge features without fear that a non standard implementation
    might be leveraged in a piece of production code. However many vendor prefixed
    properties are still available in the wild.


    The rest of this chapter covers how we could continue to style the progress bar,
    however, the code presented is not suitable for production use. We cover it, to
    show how a developer could test out an experimental feature that has a browser
    prefix. If we want a safe, stable, production worthy implementation, we should
    stop where we were before attempting to add the background color. To add a custom
    background color and continue to customize the control, we will need to use vendor
    prefixed properties.


    The first thing we will do to fix our background color issue is remove the default
    appearance of the control.


    # 3.7.1 Appearance property


    To reset the appearance of the progress element we use the `appearance` property.
    By setting its value to `none`, we cancel out the default styles provided by the
    user agent. Since we will be creating all of the styles from scratch, we can also
    remove the accent-color property, as it will no longer have any effect. We will
    keep our height and width, and also add a border-radius since we are going to
    have a curved finish. Although the appearance property is supported by all major
    browsers, we will still need to include the vendor prefixed version in order for
    the vendor prefixed values we add next to work. Listing 3.13 shows our updated
    rule.'
  merge: -1
  img_proc: true
- pgno: 89
  md: "# Listing 3.15 Progress rule\n\n```\nprogress {\n  height: 24px;\n  width:\
    \ 100%;\n  border-radius: 20px;\n  -webkit-appearance: none;\n  -moz-appearance:\
    \ none;\n  appearance: none;\n}\n```\n\nAt this juncture, our progress bar looks\
    \ the same as when we broke it adding the background color. This is to be expected.\
    \ With appearance none added, we can now start altering the control in ways we\
    \ previously could not. We will first focus on browsers with a -webkit- prefix.\n\
    \n# 3.7.2 Styling the progress bar for -webkit- vendor prefixed browsers\n\nThere\
    \ 3 vendor prefixed pseudo elements we can use to edit the styles of our progress\
    \ bar:\n\n+   - ::-webkit-progress-inner-element - is the out most part of the\
    \ progress element.\n+   - ::-webkit-progress-bar - the entire bar of the progress\
    \ element, the portion under the progress indicator. Is the child of ::-webkit-progress-inner-element\n\
    +   - ::-webkit-progress-value - is the progress indicator. Is the child of ::-webkit-progress-bar\n\
    \nWe will use all three values to style our element.\n\nLet’s start from the inside\
    \ and work our way outwards. The first part we will want to style is the progress\
    \ indicator. For that we will need to use ::-webkit-progress-value.\n\nWe curve\
    \ the edges and change the color of the bar to be a light blue as seen in Listening\
    \ 3.14.\n\n# Listing 3.16 Styling the progress indicator in Chrome\n\n```\n::-webkit-progress-value\
    \ {\n  border-radius: 20px;\n  background-color: #7be6e8;\n}\n```\n\nFigure 3.15\
    \ shows our output in Chrome.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_89_0.png)\n\
    \nFigure 3.15 Progress Value styled in Chrome"
  merge: -1

    # 10.7 Error handling


    Under Name, Email, and Message controls is an error message. Currently it is unstyled
    and therefore not easily identifiable as such. Furthermore, we don’t want to show
    this error message until the user has interacted with the control. Nobody wants
    an error message yelling at them before they have even gotten started.


    What we are going to do is style them to look like error messages, then we will
    hide them by default and only show them when appropriate. A bit of advanced warning,
    if you are coding along with this chapter and downloaded the starter files from
    Github you may have noticed a JavaScript file. This is where the code in that
    file is going to come into play. We will get more into details about that here
    shortly.


    # 10.7.1 Styling error messages


    Like most error messages on the web, we are going to make our text red. We will
    use the color we set in our --error custom property. We will also make the text
    bold and preface our error with the words "Error: " to clearly present it as such
    because as mentioned earlier in the chapter, we don’t want to use just color to
    convey meaning or intent. So that we can keep the wording consistent and not have
    to remember to include it everytime, instead of adding the verbiage at the beginning
    of each error, we will add it programmatically via CSS using the ::before pseudo
    element. We will also need to add a 2rem margin to the right of the error so that
    it can be aligned with the label and input text. Our rules to style our errors
    will therefore look as follows (Listing 10.25):'
  merge: -1
  img_proc: true
- pgno: 287
  md: "# Listing 10.25 Error Styles\n\n```\n.error {\n  color: var(--error);  #A\n\
    \  Font-weight: bold;\n  margin-left: 2rem;   #B\n}\n\n.error span::before { #C\n\
    \  content: 'Error: '; #C\n}                  #C\n```\n\n#A Make the text red\n\
    #B Align it with our input content and labels\n#C Add \"Error: \" before each\
    \ error\n\nNotice how when we added the \"Error: \" verbiage before the text,\
    \ we added it to the span and not the error div itself. That is because we are\
    \ going to be showing and hiding the span inside of the error and the entire error\
    \ div. Let’s take a closer look at the HTML to understand why. Listing 10.26 shows\
    \ the complete control for the Name field including its label and error message.\
    \ Notice how the error div has an id of nameError which is being referenced by\
    \ the aria-describedby attribute on the input field. The aria-describedby attribute\
    \ tells screen readers and assistive technologies that the element whose id it\
    \ references contains extra information pertaining to the input field. If we hide\
    \ the error div in its entirety using display:none, the element the aria-describedby\
    \ is pointing to will not exist. We therefore only hide the contents (the span)\
    \ in order not to break the programmatic connection between the element and its\
    \ error. Since we will only be hiding the span, we need to apply the \"Error:\
    \ \" verbiage to the span so that it can be hidden when we hide the error message.\n\
    \n# Listing 10.26 Name Field HTML\n\n```\n<label for=\"name\">Your Name</label>\n\
    <input type=\"text\" id=\"name\" name=\"name\" maxlength=\"250\" required aria-describedby=\"\
    nameError\">\n<div class=\"error\" id=\"nameError\">\n  <span role=\"alert\">\n\
    \    Please let us know who you are\n  </span>\n</div>\n```\n\nFigure 10.34 shows\
    \ our styled error messages."
  merge: -1
  img_proc: true

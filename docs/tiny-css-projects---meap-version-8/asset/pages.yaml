    # 5.2.1 Media queries


    At the moment our cards are vertically stacked. This is the default behavior in
    most cases with HTML elements and makes sense on mobile devices where device width
    is rather narrow. However, for desktop screens, where the browser window can be
    much wider, we can take advantage of the horizontal space by using media queries.
    We can define some media queries to adjust the layout.


    +   1. If the window width is greater than or equal to 700px, we adjust the grid
    to have 2 equally sized columns, and set the height of each section to exactly
    350pixels.


    +   2. At 950 pixels, we adjust the layout again to have 4 equally sized columns
    overriding the grid-template-columns value set in the previous media query. The
    height property value still remains 350 pixels since the condition for the previous
    media query (min-width: 700px) is still being met.


    ```

    min-width: 700px

    ```


    If neither of the requirements for these media queries are met (when the browser
    window is less than 700px wide) then the cards will be stacked vertically in a
    single column. Listing 5.6 shows the 2 media queries being created.'
  merge: -1
  img_proc: true
- pgno: 137
  md: "# Listing 5.6 Layout for the cards\n\n```\n@media (min-width: 700px) { #A\n\
    \  main {\n    grid-template-columns: repeat(2, 1fr);\n  }\n  main > section {\n\
    \    height: 350px;\n  }\n}\n@media (min-width: 950px) { #B\n  main {\n    grid-template-columns:\
    \ repeat(4, 1fr);\n  }\n}\n```\n\n#A Media query to determine if the browser window\
    \ is at least 700px wide. If it is then use the styles within the query.\n\n#B\
    \ Second media query determines if the browser window is at least 950px wide.\
    \ If it is then this overrides the previous query and sets grid to 4 columns wide\n\
    \nFigures 5.8 and 5.9 show the output in 800 and 1000 pixel wide browser windows."
  merge: -1

- pgno: 252
  md: '# 10.1 Creating backgrounds using radial-gradient


    Let’s start with some base typography styles, some colors, and the elements around
    the form such as the header, container holding our form, and most notably the
    background. As we can see in figure 10.2, our background has a dotted grid pattern.
    It is not a premade image, but a gradient that has been created and then repeated.


    ![](img/b56145aa9b751926a7aedbd7172bc818_252_0.png)


    Figure 10.2 Dotted Background


    We present this technique now because we will use this technique again later to
    style the arrow on the drop down. Some elements, <select> being one of them, cannot
    have ::before or ::after pseudo elements added to them. The select element, like
    the circles of the radio button, or the checkbox have very limited styling options.
    This is related to the fact that they rely on the underlying operating system
    for styles and controls. This is very visible on mobile when a number field automatically
    opens the number keypad instead of the standard keyboard for example, same for
    calendar or time controls. Furthermore, when looking at the same website or application
    on an Iphone versus Android phone, the controls will look drastically different.
    As a result however, the browser will only allow for a limited number of properties
    to be applied to the control. Because of our limited ability to style controls,
    as developers, we have found work arounds, using properties we can affect, the
    background property is often one that is editable.


    Although we could simply use an image that we repeat across the screen to create
    our gradient, images have their drawbacks in terms of flexibility. For each shape
    or color we would have to import a new image. We would also need to acquire or
    create said images. Instead, we can create simple shapes on the fly using a gradient.
    Although the background is polka dotted and not a gradient, we will be using the
    radial-gradient function to create the dots.


    # 10.1.1 Setting the color scheme using custom properties


    Before we look at the gradient, let’s first establish our color palette. We add
    them as custom properties on the html tag so that we do not have to look up the
    color codes every time we want to color something and to ensure consistency in
    our application. An added benefit to using custom properties for our colors is
    that should we want to add multiple themes to our web page in the future, it could
    be accomplished with minimal work.


    We also include our font family in our custom properties because we will need
    to apply it to several fields as most fields do not automatically inherit the
    font-family set on their parent or ancestors. Listing 10.2 shows our color palette
    and font choice.'
  merge: -1
  img_proc: true

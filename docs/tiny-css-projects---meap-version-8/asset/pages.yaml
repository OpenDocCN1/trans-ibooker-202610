  img_proc: true
- pgno: 80
  md: "and be done. For our animation we want it to continuously repeat, to do this\
    \ we use the `infinite` keyword value.\n\nBy applying this value, we are declaring\
    \ that the animation should keep playing forever. If we wanted to run a specific\
    \ number of times we would use an integer value. After adding our iteration count,\
    \ our code is as follows (Listing 3.8).\n\n# Listing 3.9 Added animation iteration\

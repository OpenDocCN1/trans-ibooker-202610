    <p lang="it">Questo paragrafo è definito in italiano.</p>

    ```


    To hint to users that this content is in Italian we will add the Italian flag
    emoji using CSS. The browser will find the language (`lang`) attribute with the
    value of Italian (`it`) and then add an Italian flag emoji `before` it. We will
    notice in Listing 1.9 that we used a pseudo-element `before` as well. We can use
    multiple types of selectors together to target the exact part of the HTML we want
    to style.'

- pgno: 70
  md: '![](img/b56145aa9b751926a7aedbd7172bc818_70_0.png)


    # Figure 3.5 Window width effect on SVG width


    With the viewport set, let’s set the viewbox so that the contents of the SVG can
    scale with its container. Because remember, right now, we have only dealt with
    the frame, not the innards.


    # 3.1.3 ViewBox


    The viewbox sets the position, height, and width of the graphic within the viewport.
    Earlier we compared the viewport to a picture frame, the viewbox allows us to
    adjust the image to fit our frame. It can position the image, and also scale the
    graphic so that it can fit inside of the frame. We can think of the viewbox as
    our pan and zoom tools. To set the viewbox, we apply the viewBox attribute to
    the SVG with the following 4 values and syntax: viewBox="min-x min-y width height".
    Listing 3.3 shows the viewBox applied to our loader.


    Dissecting the numbers in order, we start with min-x and min-y which are both
    set to 0. We want the top left corner of the graphic to be in the top left of
    our frame. Min-x and min-y allow us to adjust the position of the graphic in its
    frame; it’s the pan tool. Since we want it exactly in the top left corner, we
    set the values to 0.


    Next we apply the width. It is set to 710 because our loader has 11 total bars
    each composed with a width of 60. 60 multiplied by 11 is equal to 660, we also
    have 10 gaps. The gap width between each bar is equal to, 5 × 10 = 50 therefore
    our loader’s width will be 660 + 50 = 710.


    We will also base the height of the viewBox on the height of the bars in our loader.
    They will have a height value of 300, we therefore also set the viewport height
    to 300. Our loader will therefore fit exactly inside of its viewport.


    # Listing 3.3 Declaring the viewbox


    ```

    <svg viewBox="0 0 710 300" width="100%" height="300px">

    <!--SVG code-->

    </svg>

    ```'
  merge: -1
  img_proc: true
- pgno: 71
  md: "Notice that both our viewbox and viewport heights are equal to 300. This is\
    \ how we zoom. If the viewbox figures are less than the viewport then you are\
    \ effectively zooming out to the frame, the graphic will be smaller. If the viewbox\
    \ figures are more than the viewport then you are zooming in. Since we have equal\
    \ viewport and viewbox heights, we are not zooming.\n\nNow that we have defined\
    \ the space we will be working in, we can start adding shapes to the loader.\n\
    \n# 3.1.4 Shapes in SVG\n\nThere are a few standard SVG shapes/elements:\n\n+\
    \   - `rect` (Rectangle )\n+   - `circle`\n+   - `ellipse`\n+   - `line`\n+  \

    To create the content columns we will use the CSS multi-column module. Along the
    way we will also look at how we can manage the space between the columns, how
    to span elements across multiple columns and how to control where the content
    breaks onto a new column.


    Part of the newspaper uses a list of items, which has some default styles provided
    to us by the user agent stylesheet. We will look at how to use a new module called
    the CSS Counters module which allows us to customize how our list-items counters
    (the numbers and bullets) are styled.


    Another concept we will cover in this chapter is how to style images. This will
    include the use of the filter property in conjunction with functions to alter
    the image’s look. We will also look at solutions for broken images and how to
    make them "fail gracefully". When we say "fail gracefully", or sometimes known
    as graceful degradation, we are putting in place fallbacks if the thing we are
    trying to load is having an issue.


    The code for our project can be found in the chapter 4 folder of the GitHub repository:
    https://github.com/michaelgearon/Tiny-CSS-Projects/tree/main/chapter-04



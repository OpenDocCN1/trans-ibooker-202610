- pgno: 4
  md: '# 1


    # CSS introduction


    # This chapter covers


    +   - A brief overview of CSS

    +   - Basic CSS styling

    +   - Selecting HTML elements effectively


    Cascading Style Sheets (CSS), are used to control the appearance of the elements
    of a web page. It uses syntactic structures called style rules to instruct the
    browser to select certain elements and apply visual qualities and effects to them.


    Chapter 1 is a good place to start if you’re new to CSS or in need of a refresher.
    We’ll start with a brief history of CSS. Then swiftly moving on how to get started
    with CSS, looking at ways to link CSS with HTML.


    Once we have our CSS up and running we’ll look at the structure of CSS by creating
    a single static column article page with basic media components like headings,
    content and imagery and see how it all works together.


    # 1.1 Overview


    Håkon Wium Lie first proposed the idea of CSS in 1994, a few years after Tim Berners-Lee
    created HTML in 1990. CSS was introduced to separate styling from the content
    of the web page through the options of colors, layout and typography.


    # 1.1.1 Separation of Concerns


    This separation of content and presentation is based on the design principle of
    Separation of Concerns (SoC). The idea behind this is that a computer program
    or application should be broken up into individual, distinct sections, segregated
    by purpose.


    The benefits of keeping good SoC include'
  merge: -1
  img_proc: true
- pgno: 5
  md: '+   - Decreased code duplication and therefore easier maintainability

    +   - Extendability because it requires elements to focus on a single purpose

    +   - Stability, because code becomes easier to maintain and to test


    With this principle in mind, HTML serves as the structure and content of a web
    page, CSS is the presentation and Javascript provides additional functionality,
    which together form the web pages. Figure 1.1 displays a diagram of this process.


    ![](img/b56145aa9b751926a7aedbd7172bc818_5_0.png)


    Figure 1.1 A breakdown of a webpage


    Since the introduction of smartphones in the mid-2000s, the web then expanded
    into responsive and adaptive designs, and mobile websites which tended to have
    less features than the desktop experience. These mobile websites typically sat
    on a subdomain like m.example.com. There are pros and cons to whether we should
    create a responsive and adaptive or mobile specific website.


    In general responsive and adaptive seems to be the way forward - especially as
    the CSS expands, giving us more ability to apply CSS based on window sizes and
    media types.


    Since the first announcement of CSS in 1994, there have been three overall releases
    of CSS:


    +   - CSS1 published in 1996

    +   - CSS2 published in 1998

    +   - CSS3 published in 1999


    After 1999, the release strategy was changed to allow for faster, more frequent
    release of new features. Instead it is now divided into modules, with numbered
    levels starting at one going all the way up to level five. A CSS level one module
    would be something that is brand new to CSS such as a property that hasn’t existed
    until now. Some examples are the masking module or the multi-column module, which
    we will look at later in this book.'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'Modules which have gone through a few versions and are now level 5 are: media
    queries, color, fonts, and cascading and inheritance modules.


    The benefit of breaking CSS into modules is that each part can move independently
    rather than large sweeping changes. However, there have been some discussions
    that there is a need for someone to declare we are now at the stage of CSS4, even
    if it’s just to acknowledge that CSS has changed a lot since 1999.


    # 1.1.2 What is CSS?


    CSS is a domain-specific language (DSL). DSLs are languages that are specialized
    and created to solve a specific problem. They are generally less complex than
    General Purpose Languages (GPL) like Java or C#. CSS’s specific purpose is to
    style web content. Languages such as SQL, HTML and XPath are also DSLs.


    CSS is also a declarative programming language. This means that the code tells
    the browser what needs to be done rather than how to do it. For example, our code
    says that we want this heading to be red in color, and then the browser determines
    how it is going to do it.


    This is useful because, if we want to increase the line height of a paragraph
    to improve the reading experience, it is up to the browser to determine the new
    layout, sizing and formatting of that line height, which reduces the effort for
    the developer.


    CSS has come a long way since 1994. There are now ways to animate and transition
    elements, create motion paths to animate SVG graphics, and conditionally apply
    styles based on viewport size. This type of functionality used to be only possible
    through JavaScript or Flash (now retired).


    In the past, design choices such as the use of transparency, rounded borders,
    masking and blending, were doable but required unconventional CSS techniques and
    “hacks”. As CSS evolved, properties were added to replace these hacks with standard,
    documented features. It could be said that CSS is in a golden age. With the continual
    development of the language, opportunities for new and creative experiences are
    virtually endless.


    # 1.2 Getting started with CSS by creating an article layout


    In our first project we will explore a common use case across the web, creating
    a single column article. This chapter will focus on how to link CSS to HTML, and
    then explore the selectors we can use to style our HTML.


    The first thing we need to understand is how to tie our CSS to our HTML and how
    to select an element, then we can worry about what properties and values we want
    to apply. Let’s go over some fundamentals.


    # 1.2.1 Setup


    If you are new to coding then there are a few, often free, tools you can use for
    these projects. You have the option of coding online or you can do it on your
    computer, using a code editor such as:'

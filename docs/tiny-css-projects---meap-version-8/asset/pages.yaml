    \ of even. In this case we are going to pass it a custom pattern. We are going\
    \ to pass it a parameter of n + 3, indicating that we want to select all matching\
    \ elements starting with the third instance where n is the iterator and 3 is the\
    \ starting point. Listing 8.19 shows how this is applied to the table.\n\n# Listing\
    \ 8.19 Section Margin and Header Padding\n\n```\n@media (min-width: 550px) { #A\n\
    \n  table { table-layout: fixed; } #B\n\n  th, td {\n    padding: .5rem;\n   \
    \ text-align: left;\n  }\n\n  table img {      #C\n    width: auto;      #C\n\
    \    max-width: 100%;  #C\n  }                 #C\n\n  th:nth-of-type(n+3),  #D\n\
    \  td:nth-of-type(n+3) { #D\n    text-align: right;\n  }\n}\n```\n\n#A media query.\

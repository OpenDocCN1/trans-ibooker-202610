- pgno: 133
  md: "# 5.2 Laying out the page using grid\n\nA good starting point is to look at\
    \ the layout of our cards and the web page as a whole. We need to consider 3 aspects\
    \ of our layout:\n\n+   - The header and main content\n+   - The container for\
    \ the cards\n+   - The content within the cards\n\nWe will use the grid layout\
    \ module for all 3 use cases.\n\n> **Grid**\n> Grid allows us to place and align\
    \ elements across both the vertical and horizontal axis on a system of columns\
    \ and rows.\n> \n> Check out chapter 2 if you need a refresher on how grid works.\n\
    \nTo lay out the elements on our page we will start with creating the styles for\
    \ narrow screens and then edit the layout as we build up to larger screen sizes\
    \ via media queries.\n\nOur layout consists of 2 landmarks, <header> and <main>,\
    \ which are immediate children of <body> (Listing 5.3). By giving the body a display\
    \ property a value of grid we will be affecting the position of the header and\
    \ main elements.\n\n```\nListing 5.3 Starting HTML\n<body>\n  <header>  #A\n \
    \ ...       #A\n  </header> #A\n  <main>    #B\n  ...       #B\n  </main>   #B\n\
    </body>\n```\n\n#A Contains the page header\n#B Contains the cards\n\nWe then\
    \ use the place-item property to center the elements on the page. This property\
    \ is the short-hand for combining declaring values for the align-items and justify-items\
    \ properties. We will set its value to center, aligning all the items in the middle\
    \ of their respective rows and columns. Our updated body rule is shown in Listing\
    \ 5.4."
  merge: -1
  img_proc: true
- pgno: 134
  md: "# Listing 5.4 Positioning the header and main elements\n\n```\nbody {\n  display:\
    \ grid;\n  place-items: center;\n  margin-top: 40px;\n  padding: 20px;\n}\n```\n\
    \nNotice that we have not defined any grid-template-rows, grid-template-columns,\
    \ or grid-template-areas. By default, when none are declared, the browser will\
    \ still create a 1 column grid with as many rows as there are elements to position.\
    \ In our case, we have 2 (main and body) therefore our grid has 1 column and 2\
    \ rows (Figure 5.5).\n\n![](img/b56145aa9b751926a7aedbd7172bc818_134_0.png)\n\n\
    Figure 5.5 1 by 2 grid\n\nThe header and main’s widths are altered by being within\
    \ the grid to only take as much horizontal space as their content requires. Since\
    \ the header has narrow content (the h1 containing the word hotel) the page title\
    \ centers itself to the page. The main element takes the full width available\
    \ to it because the description of Flamingo beach (in the second card) needs the\
    \ full width, and even wraps. If we extend the width of the screen further, we\
    \ will see that the main element also centers itself (Figure 5.6)."
  merge: -1
  img_proc: true
- pgno: 135
  md: "![](img/b56145aa9b751926a7aedbd7172bc818_135_0.png)\n\nFigure 5.6 Centered\
    \ Main on a very wide screen\n\nWe will also rely on the default functionality\
    \ of the grid and omit defining rows and columns because we want to keep the cards\
    \ stacked on narrow screens. To add space between cards, we include a gap of 1rem.\
    \ We also restrict the width of the main element to a maximum of 1024 pixels to\
    \ prevent our cards being too spaced out on wide screens once we align them horizontally\
    \ for on wide screens in the next section.\n\nOur updated CSS (Listing 5.5) keeps\
    \ the cards stacked but adds a 1 rem gap between each card as seen in Figure 5.7.\n\
    \n# Listing 5.5 Positioning the cards on narrow screens\n\n```\nmain {\n  display:\
    \ grid;\n  max-width: 1024px;\n  grid-gap: 1rem;\n}\n```"

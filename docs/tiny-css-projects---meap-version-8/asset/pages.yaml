  md: "application. Furthermore, buttons by default are inline elements, and when\
    \ closed, what is presented is essentially a button, so we will give it the same\
    \ flow behavior as a button.\n\n> NOTE: FLEXBOX For a refresher as to how Flexbox\
    \ works and its associated properties check out Chapter 6: Creating a Profile\
    \ Card.\n\n# Listing 11.2 Styling the container\n\n```\n.share {\n  font-family:\
    \ Verdana, Geneva, Tahoma, sans-serif;\n  background: #ffe46a; #A\n  border-radius:\
    \ 36px;\n  display: inline-flex;\n}\n```\n\n#A Yellow\n\nWith the block styled\
    \ (Figure 11.3), let’s address the individual elements inside the block.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_309_0.png)\n\
    \nFigure 11.3: Styled Container\n\n# 11.5 Styling the elements\n\nOur block has\
    \ 3 descendent element we want to style:\n\n+   1. The share button\n+   2. The\
    \ menu containing the list of links\n+   3. The individual links\n\nLet’s start\
    \ with the share button and work our way down the list.\n\n# 11.5.1 Share button\n\
    \nThe class name given to the button will include the block name followed by 2\
    \ underscores and then the element. In our case we will call this element “button”.\
    \ Our class name will therefore be: share__button. By prefixing our class name\
    \ with share__ we ensure that the only button we will be styling is the one within\
    \ our block."

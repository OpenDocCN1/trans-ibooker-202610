    dangerous. Giving an element a class name of blue might work immediately, but
    if the design changes and the color applied is now red, our class name will no
    longer make sense.


    In our HTML we find that some of our headings have a class of small-heading. We
    are going to create a rule that selects small-heading and changes the text of
    the elements to uppercase.


    To select the small-heading class name, in the CSS we will first type dot (.)
    followed by the class name small-heading our styles then go into the curly brackets,
    same as for the class selector: .small-heading { text-transform: uppercase }.
    Figure 1.12 now shows our uppercased headings. Notice that the other headings
    were not affected. Only those on which the class was applied.'

- pgno: 193
  md: '#A Prevents our content from becoming excessively wide

    #B So that regardless of window size the background covers the whole window

    #C Centers the content when window is larger than 78ch


    # 7.1 Adding a drop cap


    We already have some base CSS to style the page, we are now going to turn our
    attention to the text. By virtue of the fact that the width of our body is already
    capped at a width that works well for our text, we do not need to worry about
    line length. We do need to address the leading or line height.


    # 7.1.1 Leading


    Leading is the amount of space found between our lines. The term comes from the
    days of the printing press, when to adjust the spacing between the lines of text,
    bars of lead of various widths would be placed. The CSS property we are going
    to use to accomplish the same outcome is `line-height` (https://developer.mozilla.org/en-US/docs/Web/CSS/line-height).


    Line height can take a number value (`line-height: 2`) or a number with a unit
    (`line-height: 5px`). The unit can either be relative such as ems, or fixed such
    as pixels. Unless the unit is relative to the font size such as `em`, when providing
    a unit, if the font is scaled or a child element has a different font size the
    line height may not look correct and can negatively impact legibility. When using
    a unitless number, the line height is automatically calculated relative to the
    font size of the element, eliminating this concern. We will therefore be using
    a unitless line height. We will set a line height of 1.5 on all paragraphs by
    creating a rule specifically for the paragraph element and then applying the height
    as follows: `p { line-height: 1.5; }`.


    > **Accessibility and Leading**

    > Research shows that for text having a line height between 1.5 and 2 makes line
    tracking for individuals cognitive disabilities easier³


    # 7.1.2 Justification


    For optimum effect when we have the text follow the image, we are going to justify
    our text. Justifying the text means we are going to make all of our lines the
    same width. A technique often seen in newspapers, where the right edge is a straight
    line rather than a ragged edge.'
  merge: -1
  img_proc: true
- pgno: 194
  md: "# Accessibility and Justification\n\nA word of caution: The Web Content Accessibility\
    \ Guideline (WCAG) includes three levels of conformance which build upon each\
    \ other A, AA, and AAA. A is the least restrictive, building up to AAA which is\
    \ the most stringent. Most often, websites will aim for AA level of conformance,\
    \ but if we are required to conform to AAA, it is worth mentioning that justifying\
    \ text goes against accessibility guideline 1.4.5 which is a requirement for AAA⁴.\n\
    \nTo justify our text we are going to use the text-align property which can take\
    \ a value of left, right, center, or justify. We add `text-align: justify;` to\
    \ our previously created paragraph rule.\n\nOur paragraph rule now has 2 properties,\
    \ text-align and line-height, which takes care of styling the paragraph. Listing\
    \ 7.3 shows the completed paragraph rule.\n\n# Listing 7.3 Completed Paragraph\
    \ Rule\n\n```\np {\n  line-height: 1.5;\n  text-align: justify;\n}\n```\n\nWith\
    \ the paragraph itself taken care off, as seen in figure 7.3, we can now hone\
    \ in on the first letter of the first paragraph to create our Drop Cap\n\n![](img/b56145aa9b751926a7aedbd7172bc818_194_0.png)\n\
    \nFigure 7.3 Styled Paragraphs\n\n# 7.1.3 First Letter\n\nWe do not need to add\
    \ any tags to the HTML to select the first letter of our first paragraph, we can\
    \ use the pseudo-class `:first-of-type` (https://developer.mozilla.org/en-US/docs/Web/CSS/:first-of-type)\
    \ to select the first paragraph and then the pseudo-element `::first-letter` (https://developer.mozilla.org/en-US/docs/Web/CSS/::first-letter)\
    \ to get to the letter, in this case a B, both of which can be chained. In code,\
    \ this translates to `p:first-of-type::first-letter {}`."
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Pseudo-Class vs Pseudo-Element


    A pseudo-class is added to a selector to target a specific state while a pseudo-elements
    allows us to select a part of the element.


    With the letter selected, we can now start styling it in order to make it look
    like a drop cap. To really make it stand out from the rest of the text, we are
    going to pick a more ornate typeface. In this particular case, we are going to
    use Passions Conflict (https://fonts.google.com/specimen/Passions+Conflict) seen
    in Figure 7.4, which we will import from google fonts.


    ![](img/b56145aa9b751926a7aedbd7172bc818_195_0.png)


    Figure 7.4 Passions Conflict Glyphs


    Because this typeface has particularly ornate capital letters, it will be well
    suited to use for our drop cap. We will also use it a little bit later on in this
    chapter to style the quote at the beginning of the chapter. Beautiful typefaces
    such as this one are a wonderful way of embellishing a page but only for very
    short bits of content. Handwriting and display fonts can be quite difficult to
    read and are therefore not well suited for large bodies of text. For a drop cap,
    large headers, or short quotes, however, they can be a great way to differentiate
    the element from the rest of the content and give the page some personality.


    This particular font has glyphs that are quite a bit smaller than those of Times
    New Roman (the font we use for the rest of our content), and we are creating a
    drop cap which by definition is larger than the rest of the text, so we are going
    to have to adjust its size. We are also going to adjust the line height of the
    letter to make it fit nicely with the text. Finally we are going to float it to
    the left so that the text flows around the letter, accomplishing our desired effect.


    The float property places an element to the right or left of its container based
    upon the value it is passed. Inline elements around it (our text) will use the
    leftover space to wrap around the floated element. The float property can take
    one of three properties:


    +   - Left

    +   - Right

    +   - None (element is not floated)'
  merge: -1
  img_proc: true
- pgno: 196
  md: "Since our text is in english which flows from left to right, we want to keep\
    \ the letter B to the left. We are therefore going to float the first letter of\
    \ the first paragraph (B) to the left by adding `float: left;` to our rule. Listing\
    \ 7.4 shows the completed CSS rule we created to style our drop cap as well as\
    \ the import of the Passions Conflict typeface. Figure 7.5 shows the output generated.\n\
    \n# Listing 7.4 Drop Cap\n\n```\n@import url(\n  'https://fonts.googleapis.com/css2?family=Passions+Conflict&display=swap'\n\
    );\n#A\np:first-of-type::first-letter {\n  font-size: 6em;\n  float: left;\n \
    \ line-height: .5;\n  font-family: 'Passions Conflict', cursive;\n}\n#B\n```\n\
    \n#A Import of the Passions Conflict typeface\n#B Rule that styles the letter\
    \ B at the beginning of our first paragraph\n\n![](img/b56145aa9b751926a7aedbd7172bc818_196_0.png)\n\
    \n# Figure 7.5 Drop Cap\n\nWe use ems and a unitless line-height so that if we\
    \ were ever to change the font size of the paragraph, the drop cap would scale\
    \ accordingly since the value of 1 em is set based on the font-size of the parent\
    \ element which in this case is our paragraph tag.\n\nTo reposition our B to fit\
    \ well with the text, we edited the line height of the letter. Another technique\
    \ we could have used would have been to set the position of the B to relative,\
    \ and then use top, bottom, left, and right, to alter its position relative to\
    \ the rest of the text.\n\nWith our drop cap created, we are now going to turn\
    \ our attention to the quote at the start of the chapter."
  merge: -1
  img_proc: true
- pgno: 197
  md: "# 7.2 Styling the quote\n\nThe quote at the top of the page is rather drab\
    \ at the moment, and gets a little lost in the rest of the text. To make it stand\
    \ out we are going to use the same font we used for our drop cap. Because of the\
    \ previously mentioned differences in size and line height, we are going to adjust\
    \ them so that the paragraphs and the quote look uniformly sized and spaced. Listing\
    \ 7.6 shows the CSS we will add to accomplish this task, and Listing 7.6 shows\
    \ the output.\n\n```\nListing 7.5 Blockquote\n```css\nblockquote {\n  font-family:\
    \ 'Passions Conflict', cursive;\n  font-size: 2em;\n  line-height: 1;\n}\n```\n\
    ```\n\n![](img/b56145aa9b751926a7aedbd7172bc818_197_0.png)\n\nFigure 7.6 Blockquote\n\
    \nAgain we use relative units so that should the rest of the content’s font size\
    \ change, so will the quote. You may have noticed that we used a line-height of\
    \ 1 even though we stated above that for optimal legibility a line height of 1.5\
    \ to 2 would be ideal. We make an exception here because observing the output,\
    \ we see that by default the font already has a very large line height, we do\
    \ not need to increase the size. This can occur on occasion especially when dealing\
    \ with cursive or display fonts.\n\nWith our text taken care of, we can now focus\
    \ on the images."

- pgno: 140
  md: "We used the shorthand font property. The first value sets the weight, and in\
    \ this case it is set to heavy. The second value is the font size of 120px, then\
    \ the font-family we want to use. If this font can not be loaded then we fallback\
    \ to a sans-serif font.\n\nWe transformed the text to uppercase through styling\
    \ rather than writing it all in uppercase within the HTML. Using all uppercase\
    \ characters can impact accessibility, as some screen readers may interpret the\
    \ all caps as an acronym and read the letters out individually instead of as a\
    \ full word. Furthermore, if someone were to copy paste our text, it would come\
    \ through in uppercase. If we set it to uppercase through CSS, we are only visually\
    \ styling the text while the characters can be mixed case. Moreover, we are in\
    \ a very unique position here with only one page to style. In a traditional project,\
    \ our styles would most likely be applied to multiple pages; by adjusting our\
    \ casing in our styles, we help ensure consistency throughout our website or application.\
    \ It is also worth noting that we should use all capitals sparingly as it can\
    \ impact readability of the content.\n\n# Listing 5.7 Header typography\n\n```\n\
    h1 {\n  font: 900 120px \"Rubik\", sans-serif; #A\n  text-transform: uppercase;\n\
    }\n```\n\n#A Shorthand font property\n\nOur header now looks as follows (Figure\
    \ 5.10):\n\n![](img/b56145aa9b751926a7aedbd7172bc818_140_0.png)\n\nMeeru Island\

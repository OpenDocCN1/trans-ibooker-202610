  md: "input will place inself with the text label without us having to create special\
    \ rules around labels containing radio inputs or checkboxes.\n\nNext we add margin\
    \ to the right of the element so that the label text does not butt right up against\
    \ it.\n\nFinally we need to handle border-radius. This is where the checkbox and\
    \ the input fields diverge since the chexbox is a square and the radio is circular.\
    \ Since our fields have very rounded edges, we are going to add a small border-radius\
    \ (4px) to the checkbox. To make the radio circular, we will add a border-radius\
    \ of 50%, which will make the box appear circular.\n\nThe rules for our checkbox\
    \ and radio inputs therefore look as follows (Listing 10.10):\n\n# Listing 10.10\
    \ Radio and Checkbox Styled\n\n```\ninput[type=\"radio\"],\ninput[type=\"checkbox\"\
    ] {\n...\n  display: inline-grid;\n  place-content: center; #A\n  width: 1.25em;\n\

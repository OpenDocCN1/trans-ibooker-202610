  md: "# Listing 4.3 Styling the newspaper title\n\n```\n@import\n    url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=PT+Serif&display=swap');\
    \ #A\n\nh1 {\n    font-weight: 700; #B\n    font-size: 4rem;\n    font-family:'Oswald',\

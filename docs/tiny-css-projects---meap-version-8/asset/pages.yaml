- pgno: 58
  md: '# grid vs grid-gap


    As CSS Grid was being defined, the specification for this property was called
    the grid-gap property but now it is recommended to use just gap. However, we still
    may see grid-gap in older projects.


    The gap property can have up to two positive values:


    +   1. the first sets the row gap

    +   2. the second is for the column gap


    If there is only one value declared it is applied to both the row-gap and the
    column-gap properties. For our project we will set a 20px gap between our rows
    and columns by adding gap: 20px to our main rule.


    Figure 2.12 shows our gaps added to our layout.



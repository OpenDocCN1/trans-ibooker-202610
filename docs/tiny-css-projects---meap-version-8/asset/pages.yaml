  img_proc: true
- pgno: 25
  md: 'There are many ways and methods to write our class names, such as Block, Element,
    Modifier (BEM) methodology or Scalable and Modular Architecture for CSS (SMACSS)
    which are style guides for writing consistent stylesheets. The main point is to
    write class names that make sense to anyone.


    For example adding the class name "text" to our paragraph elements would be highly
    confusing. This is because other elements, like our headings, can also be thought

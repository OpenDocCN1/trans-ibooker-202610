  md: "background-size property a value of cover. This will automatically calculate\
    \ the width and height the image needs in order to make sure the image covers\
    \ the entire element.\n\nWe then manipulate the image to only apply to the letters\
    \ rather than the entire h1 element. This is where the background-clip property\
    \ comes into play. This property defines, based on the box-model, which part of\
    \ the element the background should cover. In our case we will give it a value\
    \ of text because we only want the image to show behind the letters. This property\
    \ still requires a browser prefix for webkit based browsers (Chrome, Edge, and\
    \ Opera) so we also include the prefixed property for compatibility with those\
    \ browsers.\n\nOur text is currently black, which is preventing the image from\
    \ showing through. We must therefore make the letters transparent in order not\
    \ to obscure the image we just set as our text background. The text-fill property\
    \ allows us to set the color of the text. This property is very similar to using\
    \ color but if both are set, it will supersede the color property. Since text-fill\
    \ also requires a vendor prefix (for both webkit and mozilla based browsers),\
    \ we can use color property as a fall back in case the image does not load or\
    \ any of the experimental properties should fail.\n\nWe set the color to white\
    \ because we will add a black background to our page a little bit later in this\
    \ chapter.\n\nListing 5.8 shows our updated header class.\n\n# Listing 5.8 Background\
    \ clip text code\n\n```\nh1 {\n  text-transform: uppercase;\n  font: 900 120px\

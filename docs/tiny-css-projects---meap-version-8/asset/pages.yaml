- pgno: 103
  md: "# Table 4.1 Font weight values and their common weight name\n\n| Value | Common\
    \ weight name |\n| --- | --- |\n| 100 | Thin (Hairline) |\n| 200 | Extra Light\
    \ (Ultra Light) |\n| 300 | Light |\n| 400 | Normal (Regular) |\n| 500 | Medium\
    \ |\n| 600 | Semi Bold (Demi Bold) |\n| 700 | Bold |\n| 800 | Extra Bold (Ultra\
    \ Bold) |\n| 900 | Black (Heavy) |\n| 950 | Extra Black (Ultra Black) |\n\nIf\
    \ we do not import the weight that matches the one we set in the rule, the browser\
    \ will apply the closest weight it does have access to. Therefore, had we only\
    \ imported Oswald with a weight of 400 and applied a font-weight value of bold\
    \ to our element, the browser would have displayed our text with a weight of 400\
    \ because that is the only value it has to work with.\n\n# 4.1.3 Font shorthand\
    \ property\n\nUsing the `font` shorthand property we can combine most of the styles\
    \ in our rule. The font property requires us to provide a font-family and size,\
    \ and then optionally the style, variant, weight, stretch, and line-height using\
    \ the following syntax: `font: font-style font-variant font-weight font-stretch\
    \ font-size/line-height font-family`. Listing 4.4 shows our updated rule using\
    \ font.\n\n# Listing 4.4 Title styles using the font shorthand property\n\n```\n\
    h1 {\n  font: 700 4rem/1 'Oswald', sans-serif;\n  text-transform: uppercase;\n\
    \  text-align: center;\n}\n```"

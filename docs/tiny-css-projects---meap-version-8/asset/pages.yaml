    # 10.1.3 Emphasizing the form


    By giving main a brighter solid background and some shadow, we make it stand out
    and it becomes the visual focus of the page. Adding a drop shadow will further
    emphasize its differentiation from the background. The shadow does not have to
    be particularly harsh, the one we will apply will be rather subtle but will still
    go a long way to really bringing out the content as the element to pay attention
    to.


    We will also cap the width which the element can have to a maximum of to 600 pixels.
    Looking at Figure 10.4 we can see that block elements such as the fieldset around
    the radio buttons will expand as far as the screen will go. Much like text, if
    a control is too wide, eye tracking will become difficult and the user may lose
    their place while attempting to fill the form. Setting a maximum width prevents
    this issue.


    We will then center the element by setting our right and left margins to auto.
    We will also set vertical margins of 1rem both top and bottom to move it away
    from the top and bottom edges of the screen.'

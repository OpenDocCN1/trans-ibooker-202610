    # 4.1.5 Inline versus block elements


    Let’s continue to make important elements stand out from the rest of the content,
    starting with the publication date which is found in our HTML in a <time> element.
    The time element syntactically denotes a specific period in time, and takes an
    optional datetime attribute which translates the date into a machine readable
    format for search engines. Our time element looks as follows: <time datetime="2021-09-07">Tuesday,
    5<sup>th</sup> September 2021</time>. Figure 4.6 shows the look we want to achieve.


    ![](img/b56145aa9b751926a7aedbd7172bc818_105_0.png)


    Figure 4.6 Styled publication date


    Starting with the typography, we center the text and use the Oswald font-family,
    set the font-size to 1.5rem, and make the text uppercase and bold. We then change
    the text size of the "th" found in the superscript element (<sup>) to a slightly
    smaller font size and normal weight to decrease its prominence.


    We then add the top and bottom borders to be 3 pixels thick, solid, very dark
    gray lines. After adding the borders, we add some top and bottom padding so that
    we can have some breathing room between the text and the lines.


    The (date) time element <time> is an inline-level element, meaning that it will
    only take up the exact amount of space it needs for its content the same way a
    span or anchor tag does. In contrast block-level elements (like the div, paragraph,
    or list) place themselves on a new line and take the full width of their available
    space. To achieve the design seen in Figure'

  img_proc: true
- pgno: 19
  md: 'Many reset options exist but a commonly used option can be found at https://meyerweb.com/eric/tools/css/reset/.


    Finally we need to link our stylesheet to our HTML. Because order matters, we
    want to make sure we include the reset CSS **before** our author styles in our
    `head`. Our HTML will therefore look as seen in Listing 1.3.


    ```

    Listing 1.4

    <head>

    ...

    <link rel="stylesheet" href="reset.css"> #A

    <link rel="stylesheet" href="styles.css"> #B

    </head>

    ```


    #A Reset stylesheet

    #B Author stylesheet


    The benefits of CSS Reset is that we now have a blank slate to start from. As
    seen in Figure 1.7 all or our elements now look like plain text so the downside
    is that we now need to define basic styles for all elements including adding bullets
    to lists, differentiating header levels, etc. Furthermore, each version of CSS
    Reset will be slightly different based on the version and the developer who authored
    it.


    Our other option is Normalize. Instead of resetting the styles, it specifically
    targets elements that have differences across browsers and applies rules to standardize
    them.


    # 1.4.5 Normalize


    Like CSS Reset, Normalize will style things slightly differently depending on
    the version and author. A commonly used option for Normalize can be found at https://necolas.github.io/normalize.css/.
    We can apply it to our project in much the same way we did the CSS Reset. We create
    a file, copy the code into the file, and link it to our HTML. Once applied (Figure
    1.8) we notice that our HTML looks the same as it did originally as most of the
    discrepancies it handles are on form elements and buttons. Depending on the browser
    we are using, we may notice a difference in the size of the h1.'

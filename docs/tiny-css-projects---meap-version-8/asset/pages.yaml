    # 8.6 Summary


    +   - Numeral styles can be controlled via the `font-variant-numeric` property

    +   - `:invalid` can be used to target and conditionally style invalid elements

    +   - Media queries allow us to conditionally apply styles based on screen sizes

    +   - HTML attribute values can be used to select elements

    +   - HTML attributes can be displayed via CSS using the content property and
    the `attr()` function

    +   - Margins can collapse, but won’t once an element’s display property is changed
    to `flex`

    +   - `:nth-of-type` can take numbers, keywords, or custom patterns to target
    elements based on their position relative to other of the same type of elements
    inside a container'

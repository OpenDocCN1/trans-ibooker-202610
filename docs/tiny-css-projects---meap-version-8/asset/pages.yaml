- pgno: 189
  md: '# 7


    # Harnessing the full power of float


    # This chapter covers


    +   - Creating a drop cap using float

    +   - Using float to wrap text around the image

    +   - Using CSS shapes to make the text follow the floated image''s shape


    Grid and flexbox have given us the ability to create layouts that were previously
    incredibly difficult if not impossible to realize, one of the most common examples
    would be a three column layout with all three columns the same height regardless
    of the contents within. Another layout technique, which unlike its grid and flexbox
    counterparts has been around for quite some time, is float. Part of the CSS Logical
    Properties and Values Level 1 Module, float is purpose built to allow other content
    to wrap around the element being floated and as result really shines at manipulating
    images inside of text and at creating drop caps.


    Drop caps are a way to style and add emphasis to text. They consist of creating
    a larger (sometimes more ornate) capital letter which is usually found at the
    beginning of a page or paragraph. These were often seen in the illuminated manuscripts
    of the middle ages. The F at the beginning of the paragraph in Figure 7.1 is an
    example of a drop cap found in the Carmina Burana manuscript. Later, with the
    advent of the printing press, the concept was carried over into print with specialized
    glyphs and plates being created, or by simply using a larger font size. The practice
    is much more seldom seen on the web but by no means impossible and a great way
    to make our typography more interesting.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '![](img/b56145aa9b751926a7aedbd7172bc818_190_0.png)


    Figure 7.1 The Wheel of Fortune illustration from the Carmina Burana manuscript¹


    Another way to make content more visually striking is to style our images to fit
    nicely in the text. When we add images to content we often add our image tag,
    maybe some margin, and often don’t think about it much more than that. Using CSS
    shapes in conjunction with float, we can make our text wrap the actual shape of
    what is being displayed in the image to create a much more striking effect. We
    can flow text around virtually any shape we create, even curves.


    In this chapter, we will be taking a close look at our typography and images to
    make our content more visually interesting while making sure we keep our content
    accessible. We will



    \nOur unchecked inputs are styled, we now need to address the styles once they\
    \ are checked. We can see in Figure 10.16 that both checked and unchecked elements\
    \ currently look identical. We now need to address the checked style.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_268_0.png)\n\
    \n# Figure 10.16 Unchecked Radio and Checkbox Styles"

    \                           #F\n\nh1 {\n  font-size: 4.5vw;\n  margin: 40px 0\
    \ 12px;\n}\n\np {\n  font-size: 2.8vw;\n  margin-top: 0;\n}\n```\n\n#A Start of\
    \ rule styling the loader's container\n#B layout\n#C Margin written using the\
    \ shorthand property. Top and bottom: 40px margin, left and right: auto.\n#D Typography\n\
    #E Color\n#F End of rule styling the loader's container\n\nWe can see that our\
    \ section has its width capped at 800 pixels. <section> is a box-level element,\
    \ therefore by default, it will take up the full width available to it. <body>\
    \ and <html> are also box-level elements.\n\nSince we don't specify a width, padding,\
    \ or margin on either <body> or <html>, they will take the full width of the window.\
    \ <section>, will take the full width of the <body>. However we assigned a maximum\
    \ width to the <section>, therefore once the window reaches a width of 800 pixels\

  md: '![](img/b56145aa9b751926a7aedbd7172bc818_48_0.png)


    Figure 2.3 Development tools in Firefox


    # 2.2 Grid tracks and lines


    When grid was introduced it brought in new terminology to describe laying out
    items. The first concept is grid lines. Lines run horizontally and vertically
    and are numbered starting from 1 in the top left, on the opposite side to the
    positive numbers are the negative numbers.


    # Writing mode and script direction


    The number assigned to each line is dependent on the writing mode (whether lines
    of text are laid out horizontally or vertically) and script direction of the component.
    For example, if the writing mode is English then the first line on the left is
    numbered 1. If the language direction was set to right-to-left, for example because
    the language was Arabic (written from right to left), then line 1 would be the
    furthest line to the right.


    In-between the grid lines are the grid tracks that are made up of the columns
    and rows. Columns go from left to right whilst rows go from top to bottom. A track
    is the space between any two lines on a grid. In our example below (Figure 2.4)
    the track highlighted is our first row track in our grid. A column track would
    be the space between two vertical lines.


    Then within each track are grid cells. A cell is the intersection of a grid row
    and a grid column.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '![](img/b56145aa9b751926a7aedbd7172bc818_49_0.png)


    Figure 2.4 Grid structure based on writing mode being English with the direction
    set to left-to-right


    The grid-template-columns and the grid-template-rows properties can be used to
    lay out your grid.


    DEFINITION These properties specify, as a space-separated track list, the line
    names and track sizing functions of the grid. The grid-template-columns property
    specifies the track list for the grid''s columns, while grid-template-rows specifies
    the track list for the grid''s rows.


    Before we set our columns we first need to understand a few concepts that are
    specific to CSS Grids.


    # 2.2.1 Repeating columns


    To save repetition in your code you can use the repeat() function to specify how
    many columns you need.


    The repeat() function needs two values that are comma separated:


    +   1. the first value indicates how many columns to create

    +   2. the second value is the sizing of each column'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'For our project we will specify that we want 2 columns and then for the sizing
    of each column we will use the minmax function. Our column definition will therefore
    looks as follows:


    ```

    grid-template-columns: repeat(2, minmax(auto, 2fr)) 250px;

    ```


    This declaration will produce 3 columns, 2 of equal width using the fraction unit
    and one of 250 pixels. Let’s dissect this declaration a bit further. Notice that
    inside the repeat function, we use another function minmax().


    # 2.2.2 Minmax


    The minmax(min, max) function is made up of two arguments, the minimum and maximum
    range the grid track should be. The W3C specification states that the minmax function
    "defines a size range greater than or equal to min and less than or equal to max"¹.


    # Valid arguments


    To make the function valid the min value (the first argument) needs to be smaller
    than the max, otherwise max gets ignored by the browser and the function will
    rely just on the min value.


    For our project we set the minimum value to auto and the max to 2 fractions. Let’s
    look at what auto means.


    # 2.2.3 The auto keyword


    The auto keyword can be used for either the minimum or maximum value within the
    function.


    When the keyword auto is used for the maximum value then the minimum dimension
    the container will take is equal to the max-content keyword. To make layouts that
    include fixed headers and footers, we can assign overflow to the area for whom
    auto was assigned. The track that has a size value of auto will then shrink and
    grow with the window size as seen in Figure 2.5.'
  merge: -1
  img_proc: true
- pgno: 51
  md: "Header and footer stay fixed to the top and bottom of the window\n\n```\ndiv.grid\
    \ {\n  display: grid;\n  grid-template-rows: 250px auto 250px;\n}\n```\n\n```\n\
    div.grid {\n  display: grid;\n  grid-template-rows: 250px auto 250px;\n  Height:\
    \ 100vh;\n}\n\nmain {\n  overflow: auto\n}\n```\n\nFigure 2.5 Using the auto keyword\n\
    \nFor our use case, in the statement grid-template-columns: repeat(2, minmax(auto,\
    \ 2fr)) 250px; the auto keyword dictates that for our first 2 columns, the column\
    \ should be, at a minimum, as wide as the element it contains.\n\nLet’s take a\
    \ look at the Flexible Length unit (fr) used to set their maximum width.\n\n#\
    \ 2.2.4 Flexible length\n\nThe fractions (fr) unit was introduced in the CSS Grid\
    \ Module. The fractions unit is unique to grid as it is a way to tell the browser\
    \ how much room a HTML element should have compared to other elements by distributing\
    \ the left over space once minimums have been applied.\n\nLet’s first explore\
    \ what a fraction is through some tasty cake diagrams (Figure 2.6) (sorry if this\
    \ makes you crave a slice of cake). If you had a whole cake it would equal 100%.\
    \ If we decided to eat all of the cake that would be 1 fraction. In our CSS that\
    \ would be the same as grid-template-columns: 1fr which would be 100% of the column.\n\
    \nBut we are friendly and decide we will give out some of our cake to our 4 friends,\
    \ so we need to determine how many slices of our cake each person is going to\
    \ have."
  merge: -1
  img_proc: true
- pgno: 52
  md: "If we were fair we could say that our cake can be divided into 4 equal slices.\
    \ In our CSS this would be the same as grid-template-columns: 1fr 1fr 1fr 1fr.\
    \ We are telling the browser to give each HTML element an equal slice of the whole\
    \ thing.\n\nBut what if we decided to be sneaky and have a larger size? After\
    \ all, we baked the cake, right?\n\nSo we decide to take half of the cake for\
    \ ourselves, and then divide the remaining half into three slices. To do this\
    \ we need to have a total of 6 fractions, 3 fractions for our 50% of the cake\
    \ and then one fraction three times to equally split the other 50% of the cake.\n\
    \nSo in our CSS that would be grid-template-columns: 3fr 1fr 1fr 1fr, so we are\
    \ saying there are 6 fractions in total, the first column gets 3 of them (or 50%\
    \ of the total) and then the remaining 50% should be equally split between the\
    \ other 3 columns.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_52_0.png)\n\nFigure\
    \ 2.6 Diagram showing fractions value\n\nFor our project we will create our grid\
    \ lines for the columns by adding the following to our main rule:\n\n# Listing\
    \ 2.4 Setting the amount of columns\n\n```\nmain {\n  display: grid;\n  grid-template-columns:\
    \ repeat(2, minmax(auto, 2fr)) 250px\n}\n```\n\nWhen previewed in the browser\
    \ (Figure 2.7) we can see that now our grid has numbers set across each line.\
    \ What we can do with this information is explicitly choose where to place our\
    \ HTML elements within the grid based on the grid line number.\n\nWe also notice\
    \ that the browser has assumed that we want to place our HTML elements within\
    \ each grid cell so rather than each element being stacked vertically the browser\
    \ fills up each column cell until it runs out and then creates a new row and fills\
    \ in those columns. This is also known as the implicit grid."
  merge: -1

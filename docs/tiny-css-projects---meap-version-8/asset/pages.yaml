- pgno: 260
  md: '| Field Label | Type |

    |---|---|

    | Your Name | text |

    | Your Email Address | email |

    | Yes

    No | radio |

    | Subscribe to our newsletter | checkbox |


    HTML has many more types of fields including date, time, number, color, ect. each
    with their own semantic meaning and their own styling considerations. The sampling
    above was chosen because these are very commonly used types on the web today.


    Their unstyled look dictates what we will do to style them. We will treat radios
    and checkboxes very differently than the text input for example but we can reuse
    code across multiple types. We will group them by how their unstyled control looks,
    so we will handle the type text and email together and then the radio and checkbox
    together. Let’s start with the text and email inputs.


    # 10.3.1 Styling text and email inputs


    The first thing we want to figure out is how to select just text and email input
    fields, or rather, all input fields that are not a radio or checkbox. One solution
    would be to add a class to each of the inputs we want to handle. This is rather
    hard to maintain and will get quite noisy especially in a form heavy application
    or complex form. We will therefore use the pseudo-class :not()³ in conjunction
    with a type selector selector[type="value"].


    The :not() pseudo-class allows us to select elements that do not meet a particular
    criteria. In our case, we want to select all input fields that do not have a type
    of radio or checkbox. Our selector will therefore be input:not([type="radio"],
    [type="checkbox"]).


    We can now start styling the input field. We can see from figure 10.8 that our
    inputs have a white background. We are going to change that to being the same
    background color we used on the body. We can also notice that the font size is
    smaller than the 12pt size we set on the body. Input fields do not inherit font
    styles. Small font sizes are difficult to read on mobile and for many users, especially
    young children and the elderly. If we want our form to be easily usable across
    a wide population and across devices, we will need to increase it. We will therefore
    set it to 1rem to match the rest of our application. As mentioned earlier, inputs
    do not inherit font styles by default, we will therefore also explicitly set the
    color to inherit. inherit⁴ is a very handy property value. It allows us to forcibly
    inherit a property value from the parent when inheritance does not happen by default.'
  merge: -1
  img_proc: true
- pgno: 261
  md: "Next, we are going to give the inputs some padding, custom borders, and border-radius.\
    \ In this particular case, these styles are going to be for stylistic purposes.\
    \ Most applications will have a general style, or look and feel. The styles we\
    \ choose to apply to our fields should be in the same vein as the rest of our\
    \ application’s general theme. By doing this we help the form blend with the page\
    \ and look like it belongs. From a marketing perspective, keeping with your theme\
    \ will also help reinforce brand recognition. For this project we have chosen\
    \ a very round theme so we will give our fields exaggerated round corners.\n\n\
    Lastly, we will also give our fields a display value of block (inputs have a display\
    \ property value of inline by default) and make them take the full width of our\
    \ container. We will use the calc() 5 function to calculate the full width of\
    \ the container (100%) minus the padding we have added to the input field (2rem\
    \ on each side for a total of 4 in width). Remember the box model? Padding adds\
    \ to the width of the element. Therefore, we must remove the total quantity of\
    \ left and right padding from our width. A width of 100% would equate a width\
    \ of 100% of the available width of the container, then the padding value would\
    \ be added. We would therefore be 4rem larger than our allotted space if we did\
    \ not subtract the padding.\n\nOur code looks as follows (Listing 10.7).\n\n#\
    \ Listing 10.7 Styling input fields that are not of type radio or checkbox\n\n\
    ```\ninput:not([type=\"radio\"], [type=\"checkbox\"]) {\n  background: var(--background);\n\
    \  font-size: 1rem;\n  color: inherit;\n  border: solid 1px var(--border);\n \
    \ border-radius: 32px;\n  padding: 1rem 2rem;\n\n  display: block;\n  width: calc(100%\
    \ - 4rem); /*A\n}\n```\n\n# #A Calculating what the width of our element should\
    \ be\n\nWe have some basic styles set for our text and email inputs, displayed\
    \ in Figure 10.9. We have now started to develop our theme for our form controls."
  merge: -1
  img_proc: true

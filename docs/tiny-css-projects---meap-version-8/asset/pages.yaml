- pgno: 204
  md: 'Buck lived at a big house in the sun-kissed Santa Clara Valley. Judge Miller''s
    place, it was called. It stood back from the road, half hidden among the trees,
    through which glimpses could be caught of the wide cool veranda that ran around
    its four sides. The house was approached by gravelled driveways which wound about
    through wide-spreading lawns and under the interlacing boughs of tall poplars.
    At the rear things were on even a more


    ![](img/b56145aa9b751926a7aedbd7172bc818_204_0.png)


    Figure 7.1.1 Compass shape with 50% border radius and margin-box as the shape-outside
    value


    We notice that unlike when we used shape-outside with the circle function, our
    image is already cropped into a circular shape eliminating the need to use clip-path.
    This is a direct result of using border-radius, which is doing the clipping for
    us.


    We have seen two different ways to accomplish the same outcome. Like many things
    in CSS, there is more than one way to approach any singular problem. This is one
    of these situations. Neither option is particularly superior to the other, in
    this case it is a matter of preference.


    Now that we have handled the compass image, we are going to move onto wrapping
    the text around the dog.


    # 7.4 Wrapping text around the dog


    Unlike the compass, which is a standard shape, the dog has a very abnormal outline.
    However, this image is line art and composed of a single path, so we might be
    tempted to grab the path from the svg to create our shape using the path function.
    As we are about to see, although defined in the CSS specification in the specification,
    will not work.


    # 7.4.1 Using path()... or not yet


    Let’s open the image file in an editor to inspect the code. Listing 7.10 shows
    the image code redacted for brevity and to highlight the important information.'
  merge: -1
  img_proc: true
- pgno: 205
  md: "# Listing 7.10 dog.svg\n\n```\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"\
    0 0 152 193\">\n  <defs>\n    <style>\n      .cls-1{\n        fill:none;\n   \
    \     stroke:#000;\n        stroke-miterlimit:10;\n        stroke-width:2px;\n\
    \      }\n    </style>\n  </defs>\n  <path class=\"cls-1\" d=\"M21.9135,115.62c-17.2115,4.7607-37.3354,...\"\
    />\n</svg>\n```\n\nWe have defs, which includes the styles for the image. This\
    \ part defines what the individual elements in the svg will look like. Then we\
    \ have a path. The path is the element displaying the dog, however it is 1988\
    \ characters long, quite complex, and when pasted into the path function as follows\
    \ shape-outside: path('M21.913...'); does not seem to do anything. This is because\
    \ as of this book being written, no browser has path() fully implemented⁶.\n\n\
    Once this feature is implemented, creating our paths using a graphics editor and\
    \ copying them over to create our shapes will be a very valuable technique, but\
    \ one that is not available to us yet. This method also comes with the drawback\
    \ that these paths can get quite long, which makes maintainability dubious. However,\
    \ we have a couple of alternatives:\n\n+   1. Creating a polygon shape that roughly\
    \ matches our image, similarly to the technique we used above with the circle.\n\
    +   2. Using the url() function which pulls in the image and bases the shape on\
    \ the alpha channel.\n\nWe are going to go with option 2 and use the url() function.\n\
    \n# 7.4.2 Using the image\n\nSame as when we handled the compass image, we are\
    \ going to start by floating the image, but to the left this time to break up\
    \ the visual monotony in our page. Then, to create the shape we use the url()\
    \ function to which we pass the path to the image. Listing 7.11 shows the css\
    \ applied to the dog image."
  merge: -1
  img_proc: true
- pgno: 206
  md: "# Serving the image file\n\nWhen using URLs with shape-outside, we need to\
    \ make sure we are running our code through a server so that the image is getting\
    \ fetched by the browser and not just read directly from the file system. This\
    \ is specifically related to Cross-Origin Resource Sharing (CORS) and security\
    \ policies set by the browser. A detailed explanation can be found in the CSS\
    \ specification at https://drafts.csswg.org/css-shapes/#shape-outside-property.\
    \ To mitigate this issue, the sample code in the git repository uses http-server,\
    \ serving the files on localhost:8080 to accomplish this task. An alternative\
    \ option would be to reference the hosted file in github using shape-outside:\n\
    url('https://raw.githubusercontent.com/michaelgearon/Tiny-CSS-Projects/main/chapter-07/before/img/dog.svg').\n\
    \n# Listing 7.11 Dog floated left\n\n```\nimg.dog {\n  aspect-ratio: 126 / 161;\n\
    \  float: left;\n  shape-outside: url('img/dog.svg');\n}\n```\n\nWe float the\
    \ image left and then add our shape-outside passing in a reference to the image\
    \ itself. The browser will look at the transparency of the image and determine\
    \ where to create the shape based on where the transparency ends. Figure 7.12\
    \ shows our output.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_206_0.png)\n\n\
    Figure 7.12 Floated dog\n\nSince our image has an opaque line with a transparent\
    \ background, the cutoff is pretty straightforward. If our image had a gradient\
    \ that went from opaque to transparent, we could tailor where the cutoff is using\
    \ the shape-image-threshold property which takes a value between 0 and 1, zero\
    \ being fully transparent and 1 being fully opaque."
  merge: -1
  img_proc: true
- pgno: 207
  md: "# 7.4.3 Shape Margin\n\nThe next step is to add some margin to move the text\
    \ away from the image because right now, it looks rather crowded. We can't simply\
    \ add margin to the image like we did when we floated to the right, if we try\
    \ we will notice that the margin is ignored and does not actually move the text.\
    \ We need to use shape-margin instead. Shape-margin allows us to adjust the amount\
    \ of space there is between our shape and the rest of the content. We are going\
    \ to add 1 em's worth of space as seen in listing 7.12 and Figure 7.13.\n\n# Listing\
    \ 7.12 Shape Margin\n\n```\nimg.dog {\n  aspect-ratio: 126 / 161;\n  float: left;\n\
    \  shape-outside: url('img/dog.svg');\n  shape-margin: 1em;\n}\n```\n\n![](img/b56145aa9b751926a7aedbd7172bc818_207_0.png)\n\
    \n# Figure 7.13 Shape Margin\n\nThe text at the bottom of the image is still quite\
    \ close. At this point we can add some margin to increase the space as long as\
    \ the margin added is less than or equal to the shape-margin amount. If the value\
    \ is greater than the shape-margin, it will still take effect, but only as much\
    \ as the shape-margin amount. Keeping this caveat in mind, we will add 1em of\
    \ margin to the right of the image. Listing 7.13 shows the completed CSS for the\
    \ dog image."
  merge: -1
  img_proc: true
- pgno: 208
  md: "# Listing 7.13 Complete dog image\n\n```\nimg.dog {\n  aspect-ratio: 126 /\
    \ 161;\n  float: left;\n  shape-outside: url('img/dog.svg');\n  shape-margin:\
    \ 1em;\n  margin-right: 1em;\n}\n```\n\nThe combination of shape-margin and margin-right,\
    \ pushes the text away from our image for the polished end result we see in Figure\
    \ 7.14.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_208_0.png)\n\n# Figure 7.14\
    \ Finished floated dog\n\nWith this last piece completed, we have finished styling\
    \ our page as seen in Figure 7.15. We now have a layout that is visually appealing\
    \ and much more interesting than that which we started with."
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Chapter I: Into the Primitive


    > "Old longings, nomadic long,

    > Chafing at custom''s chain;

    > Again from its brumal clasp

    > Wakens the ferine chain."


    Buck did not read the newspapers, or he would have known that trouble was brewing,
    not alone for himself, but for every tide-water dog, strong of muscle and with
    warm, long hair, from Puget Sound to San Diego. Because men, groping in the Arctic
    darkness, had found a yellow metal, and because steamship and transportation companies
    were booming the find, thousands of men were rushing into the Northland. These
    men wanted dogs, and the dogs they wanted were heavy dogs, with strong muscles
    by which to toil, and furry coats to protect them from the frost.


    Buck lived at a big house in the sun-kissed Santa Clara Valley. Judge Miller''s
    place, it was called. It stood back from the road, half hidden among the trees,
    through which glimpses could be caught of the wide cool veranda that ran around
    its four sides. The house was approached by gravelled driveways which wound about
    through wide-spreading lawns and under the interlacing boughs of tall poplars.
    At the rear things were on even a more spacious scale than at the front. There
    were great stables, where a dozen grooms and boys held forth, rows of vine-clad
    servants'' cottages, an endless and orderly array of outhouses, long grape arbors,
    green pastures, orchards, and berry patches. Then there was the pumping plant
    for the artesian well, and the big cement tank where Judge Miller''s boys took
    their morning plunge and kept cool in the hot afternoon.


    ![](img/b56145aa9b751926a7aedbd7172bc818_209_0.png)


    ![](img/b56145aa9b751926a7aedbd7172bc818_209_1.png)


    And over this great demesne Buck ruled. Here he was born, and here he had lived
    the four years of his life. It was true, there were other dogs. There could not
    but be other dogs on so vast a place, but they did not count. They came and went,
    resided in the populous kennels, or lived obscurely in the recesses of the house
    after the fashion of Toots, the Japanese pug, or Ysabel, the Mexican hairless,—strange
    creatures that rarely put nose out of doors or set foot to ground. On the other
    hand, there were the fox terriers, a score of them at least, who yelped fearful
    promises at Toots and Ysabel looking out of the windows at them and protected
    by a legion of housemaids armed with brooms and mops.


    > London, Jack. "The Project Gutenberg EBook of The Call of the Wild, by Jack
    London." Project Gutenberg, https://www.gutenberg.org/files/215/215-h.htm. Accessed
    25 3 2021.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# 7.5 Summary


    +   - Leading, the amount of space between lines, is important for legibility

    +   - Float can be used in conjunction with first-letter to create drop-caps

    +   - Not all typefaces have the same size and line heights when given the same
    size value

    +   - Shape-outside uses CSS shapes to alter the shape of an element

    +   - CSS shapes can be created from border-radius

    +   - Inline content adjacent to a floated CSS shape will follow the shape

    +   - When using url() with shape-outside, the image file must be fetched by the
    browser (either hosted or via http-server or equivalent

    +   - Shape-margin sets the margin of a shape

    +   - There are layouts that cannot be accomplished without the use of float'

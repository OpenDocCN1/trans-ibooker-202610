- pgno: 117
  md: "Since we only want our content placed in columns on wider screens, we will\
    \ use a media query to conditionally apply our columns only after the window reaches\
    \ a particular size.\n\n# 4.4.1 Media queries\n\nMedia queries are a type of at-rule.\
    \ Like @counter-style which we used earlier in this chapter, it will start with\
    \ an @ symbol followed by the identifier media. Then we set the instruction for\
    \ when the rules found inside of the media query should apply. We will want to\
    \ place the content in columns once our window width is greater than or equal\
    \ to 955px. Our media query will therefore be: @media (min-width: 955px) {}. The\
    \ diagram found in Figure 4.18 breaks down the individual pieces of the query.\n\
    \n![](img/b56145aa9b751926a7aedbd7172bc818_117_0.png)\n\nFigure 4.18 Media query\
    \ breakdown\n\nInside of the media query we will now define our columns.\n\n#\
    \ 4.4.2 Defining and styling columns\n\nThere are 2 ways we can define how the\
    \ columns are created:\n\n+   - We can dictate a column width, and the browser\
    \ will create as many columns of that width it can in the available space.\n+\
    \   - We can dictate how many columns we want, and the browser will fit that number\
    \ of equally sized columns in the available space.\n\nWe will go with the second\
    \ option since we already know we want to create 3 columns. We therefore specifically\
    \ target the article and using the column-count property set our quantity to 3\
    \ as shown in Listing 4.11.\n\n```\nListing 4.11 Conditionally break article into\
    \ 3 columns based on screen width\n\n@media(min-width: 955px) { #A\n  article\
    \ {\n    column-count: 3;    #B\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 118
  md: '#A Media query


    #B Setting how many columns we want


    Figure 4.19 shows our article layed out into three columns using the above CSS.


    ![](img/b56145aa9b751926a7aedbd7172bc818_118_0.png)


    Figure 4.19 3 column layout


    Next we will adjust the spacing between our columns and add vertical lines between
    them. Let''s start with the vertical lines.


    # 4.4.3 Using the column-rule property


    To create a clear separation between our columns we will add a vertical line in
    between each column using the `column-rule` property. Like borders and outlines,
    we will need to set a line type, width, and color. To keep our line work consistent
    we will use the same color and style of line as the ones we set for the borders
    above and below the date at the top of the page. We will make the lines slightly
    narrower, however.


    The lines at the top of the screen separate content types (title, date, article),
    here we are within the same content type. We add the lines to make visual separation
    of the columns easier; we don''t want to break up the content. We therefore want
    the lines less prominent, so we will make them thinner.'
  merge: -1
  img_proc: true

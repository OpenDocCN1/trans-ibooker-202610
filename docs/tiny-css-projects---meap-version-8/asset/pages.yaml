    # 1.6.3 Pseudo-class and pseudo-element selectors


    # PSEUDO-CLASS


    A pseudo-class is added to a selector to target a specific state of the element.
    They are especially useful for elements the user will interact with such as links,
    buttons, and form fields. Pseudo classes use a single colon (:) followed by the
    state of the element. Within our article there are a few links. We have not styled
    them in any way, their styles therefore come from the user agent stylesheet. For
    most browsers, they have an underline and will vary in color based upon whether
    the link has been previously visited (the url is found in the browser''s history).


    With links, there are a few states to consider. The most common are:


    +   - link: an anchor tag that contains an href attribute and a url that is not
    found in the user''s browser history

    +   - visited: an anchor tag that contains an href, and a url that is found in
    the user''s browser history

    +   - hover: the user has their cursor over the link, but has not pressed it'

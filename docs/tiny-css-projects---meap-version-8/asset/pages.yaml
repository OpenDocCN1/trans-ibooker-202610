- pgno: 121
  md: 'Earlier in this chapter, we styled the blockquote so that it would stand out
    but now that we have a multi column format, it gets a little lost in the other
    visual elements on the page. Let’s make it span multiple columns to really make
    it pop.


    # 4.4.5 Making content span multiple columns


    We can make elements span across multiple columns by using the `column-span` property.
    Our choices of values are `all` or `none`. Since we want the quote to go across
    the entire page, we will choose `all`. Inside of our media query will therefore
    add the following rule: `blockquote { column-span: all }` resulting in the layout
    found in Figure 4.22.


    Notice that the flow of the content has changed. We added arrows to show the new
    flow introduced because of making the quote span across the screen. Instead of
    the entirety of the article flowing from top left to bottom right, evenly distributed
    across the columns, by adding the `column-span: all` on the quote, content that
    is before the quote, now flows top left to right across the page above the quote.
    The content after the quote will do the same below it. As a result of spanning
    content, we have changed the flow of the text through our columns.


    ![](img/b56145aa9b751926a7aedbd7172bc818_121_0.png)


    Figure 4.22 Content reflow due to spanning the blockquote across the columns'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'When we look at the content flow we notice that the caption and the image have
    been split across 2 different columns which isn’t ideal. Let’s prevent that from
    happening.


    # 4.4.6 Controlling content breaks


    To prevent the image and its caption from ending up in different columns we can
    use the `break-inside` property with the keyword value `avoid` which we set on
    the `<figure>` element. With this declaration we inform the browser that when
    it’s generating the columns the contents of the element should stay together as
    a unit and should not be split across multiple columns. In other words, the image
    and figcaption should remain together. The rule we add to the media query is:
    `figure { break-inside: avoid }`. Figure 4.23 shows the resulting output.


    ![](img/b56145aa9b751926a7aedbd7172bc818_122_0.png)


    Figure 4.23 Keeping the image and caption together


    # 4.5 Finishing touches


    With our content flowing the way we want it across the columns let’s polish up
    some final details. One of the hallmarks of newspaper layouts is that the text
    is often justified.


    # 4.5.1 Text justification and hyphens


    Justification refers to the alignment of the lines inside of a body of text as
    described in Figure 4.24. The text being justified means that the lines of text
    will start and end at the same spot forming a box rather than having ragged ends
    like when the text is left aligned.'
  merge: -1
  img_proc: true
- pgno: 123
  md: "![](img/b56145aa9b751926a7aedbd7172bc818_123_0.png)\n\nFigure 4.24 Text justification\n\
    \nLet’s go ahead and justify our paragraph text. To do this we will use the text-align\
    \ property and give it a value of justify. To make the lines equal in length,\
    \ extra space is distributed across the line. We can tune how the space is redistributed\
    \ using the text-justify property. If we don’t set a text-justify a value, the\
    \ browser will choose what it thinks is best for the situation. We have a fluid\
    \ design, it grows and shrinks with the window size. What is best may be different\
    \ based on the window size; we will therefore let the browser decide what will\
    \ work best.\n\nWe will, however, add some hyphens. By default, browsers will\
    \ not hyphenate words when it comes to the end of a line, it will simply continue\
    \ to the next line. We can alter this behavior by setting the hyphens property\
    \ to auto. Allowing the browser to hyphenate words at the end of lines will help\
    \ diminish the amount of whitespace that is needed between our words to justify\
    \ the text.\n\nListing 4.13 shows our paragraph rule. We continue to include our\
    \ updates inside of our media query, as these changes are only relevant once we\
    \ switch to the columns layout.\n\n# Listing 4.13 Justifying paragraph text\n\n\
    ```\n@media (min-width: 955px) {\n  ...\n  p {\n    text-align: justify;\n   \
    \ hyphens: auto;\n  }\n}\n```\n\nOur paragraphs now look as seen in Figure 4.25."
  merge: -1
  img_proc: true

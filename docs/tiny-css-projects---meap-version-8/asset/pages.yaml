    Project Gutenberg.


    Figure 2.15 Wide screen using layout from media query


    Using grid-template-areas in conjunction with media queries allows us to reconfigure
    our layout with minimal code. However, there are some accessibility pitfalls we
    must avoid.


    # 2.6 Accessibility


    When we placed our items in the grid area we mostly kept the elements in the order
    they appeared in the code: the header stayed at the top, footer remained at the
    bottom, and the content was also in a logical visual order. But what if the HTML
    code arrangement and the visual order were different from each other?


    The problem is that if a user is following along with a screen reader or navigates
    the page via keyboard and the programmatic order does not match what is being
    displayed, the behavior they will be presented with will seem random. This will
    make it very difficult for the user to navigate and to comprehend what is going
    with the page. Visually changing the location of a piece of content using a grid
    will not affect the order in which assistive technology presents the information
    to the user.


    W3 specification says the following about this case:


    > **W3 RECOMMENDATION** Authors must use order and the grid-placement properties
    only for visual, not logical, reordering of content. Style sheets that use these
    features to perform logical reordering are non-conforming.


    The solution is to keep the source code and the visual experience the same, or
    at least in a sensible order. This will give you both the most accessible web
    document and a good structure to work from. For English this means content and
    HTML should follow the same order, from top left to bottom right.'
  merge: -1
  img_proc: true

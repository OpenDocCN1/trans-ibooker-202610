- pgno: 33
  md: "+   - `active`: the user is clicking the link and holding the click down\n\
    +   - `focus`: a focused element is an element that will receive keyboard events\
    \ by default. When a user clicks on an element it automatically gains focus (unless\
    \ there is JavaScript altering this behavior). Using the keyboard to navigate\
    \ between form fields, links, and buttons will also change the element that is\
    \ in focus.\n+   - `focus-within`: is applied to a parent element. If a child\
    \ of the parent has focus, focus-within styles will be applied.\n+   - `focus-visible`:\
    \ applies only when the focus has been gained via keyboard navigation or the user\
    \ is interacting with the element via the keyboard.\n\nThere is also the `:target`\
    \ pseudo-class which we will explore later in this book when we look at `text-fragments`.\n\
    \nIn our current article project, we will first create an `a:link` rule to changing\
    \ the color of anchor tags that contain and href element and have not been visited\
    \ to a light blue using its Hex color code (#1D70B8).\n\nThe `:visited` state\
    \ should be different from the `:link` state because it should indicate to the\
    \ user that they have visited that page before. Often we see websites not differing\
    \ between the two states however, differentiating the two can provide a better\
    \ experience.\n\nIn our example, we will change the `:visited` state to a purple\
    \ color using the Hex code value #4C2C92.\n\nWe will then handle the `:hover`\
    \ state. The hover state does not apply to mobile users as there is no way to\
    \ recognize a user hovering over a link. In our article, we will change the `:hover`\
    \ state text color to a dark blue using the hex code value #003078.\n\nFinally\
    \ we will handle the `:focus` state. The focus state can be used on links, buttons,\
    \ and form inputs. The focus state is shown when the user clicks or taps on an\
    \ element. When the element is focused we will add a 1 pixel crimson outline to\
    \ the element.\n\nAll put together our link rules are as follows (Listing 1.8):\n\
    \n# Listing 1.9 Styling links using pseudo elements\n\n```\na:link {\n  color:\
    \ #1D70B8;\n}\na:visited {\n  color: #4C2C92\n}\na:hover {\n  color: #003078;\n\
    }\na:focus {\n  outline: solid 1px crimson;\n}\n```\n\nWe can view the different\
    \ element states by going into our browser, right clicking and selecting \"inspect\"\
    . Then we will typically have a view of the HTML with the CSS on the side. By\
    \ clicking the `:hov` button in the Styles section we can see a panel which may\
    \ say something like \"force element state\" and then we can toggle different\
    \ pseudo classes on and off. Figure 1.20 shows the Chrome developer tools with\
    \ the :hov panel open."

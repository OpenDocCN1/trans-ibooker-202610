    \ 10.22 shows the reset button styles and the edit to the submit button.\n\n#\
    \ Listing 10.22 Reset button styles and border edit to submit\n\n```\nbutton[type=\"\
    submit\"] {\n  ...\n  border: solid 1px var(--accent);  #A\n}\n\nbutton[type=\"\
    reset\"] {          #B\n  color: var(--accent);           #B\n  text-transform:\

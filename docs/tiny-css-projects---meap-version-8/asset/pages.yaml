- pgno: 90
  md: "Next we will edit the background behind the progress indicator using ::-webkit-progress-bar.\
    \ We will also add rounded corners to the background, and change the color to\
    \ a linear gradient going from a dark green to a light blue keeping with the theme\
    \ of the whole piece.\n\nThe linear-gradient function takes a direction followed\
    \ by a series of color and percentage pairs. The direction dictates the angle\
    \ of the gradient, the color percentage pairs dictate at which points within the\
    \ gradient we want to shift from one color to another. We will use the keyword\
    \ value to right as our direction. Then, we set a starting color of #128688 and\
    \ an ending color value of #4db3ff. Our gradient will therefore go from left to\
    \ right fading from our start color to our end color.\n\n# CSS Gradient Generators\
    \ and Vendor Prefixes\n\n> As gradients can be tedious to write by hand, many\
    \ CSS gradient generators have been created and are freely available on the web.\
    \ Many still include vendor prefixes in their generated code. These prefixes are\
    \ no longer necessary as gradients are now supported by all major browsers.\n\n\
    Finally we also add a border radius to the outermost container. The CSS for our\
    \ progress-bar is shown in Listing 3.15.\n\n# Listing 3.17 Styling the progress\
    \ indicator container in Chrome\n\n```\n::-webkit-progress-bar {\n  border-radius:\
    \ 20px;\n  background: #0eb98f;\n  background: linear-gradient(to right, #128688\
    \ 0%,#4db3ff 100%);\n}\n::-webkit-progress-inner-element {\n  border-radius: 20px;\n\
    }\n```\n\nOur progress indicator looks great in Chrome (Figure 3.16), but let’s\
    \ take a look at what it looks like in Firefox."
  merge: -1
  img_proc: true

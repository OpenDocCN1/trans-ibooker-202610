    \n# Figure 10.4 Radial Gradient²\n\nWe will create a 15px by 15px image with a\
    \ very small dot in the center which we will let repeat over the body. By default,\
    \ when using background images (and gradients are no exception) if the image is\
    \ smaller than the container, the browser will repeat the image as many times\
    \ as it can (both vertically and horizontally) to fill the container unless otherwise\
    \ explicitly specified using the background-repeat property. Because the image\
    \ we created is a 15px square and our page is much wider and taller than that,\
    \ the background image will automatically tile or repeat to fill the entire element.\n\
    \nWe will keep the gradient starting from the center from which we will apply\
    \ our accent color. After 0.75 pixels, we will then immediately shift to being\
    \ transparent to let our background color show through. If we switched from accent\
    \ color to transparent at 7.5 pixels (half of 15) our circle would be exactly\
    \ 15 pixels in diameter. Since we are doing the switch at 0.75 pixels, our circle\
    \ will be 1.5 pixels in diameter. Our background-color property value will therefore\
    \ look as follows: radial-gradient(var(--accent) .75px, transparent .75px);\n\n\
    In addition to adding the background to the body, we will also set our margins\
    \ to 0 and add 2rem of padding to prevent content from coming all the way to the\
    \ edge of the screen. Listing 10.3 shows the styles applied to the body thus far.\n\
    \n# Listing 10.3 Colors and Font Family Custom Properties\n\n```\nbody {\n  background-color:\
    \ var(--background);\n  background-image: radial-gradient(var(--accent) .75px,\
    \ transparent .75px);  #A\n```\n\n² https://codepen.io/martine-dowden/pen/poajdeQ"

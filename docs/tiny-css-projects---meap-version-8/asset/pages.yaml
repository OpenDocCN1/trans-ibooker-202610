    \ of spots to soak in at the super-sized Holiday Village Costa del Sol.\nLearn\
    \ more\n\nFigure 5.10 Applied header typography styles\n\n# 5.3.2 Background-clip\n\
    \nNext we use an image to color the letters essentially applying a background\

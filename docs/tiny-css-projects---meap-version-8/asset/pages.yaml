    Figure 8.25 Breakover point for table


    # 8.4.1 Table layouts


    Let’s improve the table layout a little bit. In the browser tables will automatically
    calculate how wide to make a column based upon the amount of content found in
    the cells within. We don’t want to allow this default behavior because we do not
    want the column widths to change when an error message is toggled. Resizing the
    columns based on the input field states would be disorienting to our users. Instead,
    we are going to give the table a table-layout value of fixed. The table-layout
    property allows us to choose the algorithm the browser will use to decide the
    width of the columns. The default value, auto, calculated column width based on
    content while fixed determines column width based on the width of the table or
    by the width of the first row of cells. The table will be evenly divided into
    a number of columns. Each column will therefore have the same width.


    Because we are setting the size of the column based on the width of the table
    we want to make sure that the images conform to the width of the column. We will
    therefore set their width to auto and give them a max-width of 100%. This sets
    the image to take the width of its container, without exceeding it or the size
    of the original image.


    Next we are also going to update the alignments of the values in the table. It
    is customary, because it makes computation easier at a glance, to justify numbers
    to the right, especially if they are being totalled in a column. We will update
    both the header and cells of the unit price, quantity and total to be right justified.
    To select the headers and cells we could use the :nth-of-type(n) selector. To
    select header and cells for the Unit Price column (3rd column), we would use th:nth-of-type(3),
    td:nth-of-type(3) { ... } and then repeat the same process for all the other columns.
    We could also, however, think about it a'
  merge: -1
  img_proc: true

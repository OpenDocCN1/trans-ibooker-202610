    \ chip where the element has a background color and rounded edges. Our CSS will\
    \ look as seen in listing 6.16. We also include some padding in order for the\
    \ text not to come right up against the edge of the chip.\n\n# Listing 6.16 Styling\
    \ the list elements\n\n```\nul.technologies li {\n  padding: 12px 24px;\n  border-radius:\
    \ 24px;\n  background: #ffdadd;\n}\n```\n\nWith the individual elements styled\
    \ (Figure 6.26) we can now focus on the list’s layout.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_183_0.png)\n\
    \nFigure 6.26 Styled List Items\n\nThe first thing we are going to do is remove\
    \ the bullets using list-style: none. We will then remove all padding and set\
    \ the margins to 24px vertically and 0 horizontally.\n\nTo position the items\
    \ we will use flexbox, add a gap of 12px and set the justify-content property\
    \ value to space-between. space-between works very similarly to space-around except\
    \ that it does not add space to the beginning and end of the container as seen\
    \ in Figure 6.27.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_183_1.png)\n\nFigure\
    \ 6.27 space-around versus space-between\n\nOur rule to layout our chips will\
    \ looks as follows (Listing 6.17):"

    # #A Styles are only being applied to inputs that have a type of radio or checkbox


    Figure 10.15 shows us that our radio input and our buttons have now disappeared.
    We can therefore start creating our own styles for the controls.


    ![](img/b56145aa9b751926a7aedbd7172bc818_267_0.png)


    Figure 10.15 Reset Radio and Checkbox Styles


    What we want to do is create a box. For radio inputs we will give that box a border-radius
    in order to make it round, but at the core regardless of checkbox or radio, we
    need a box. We will therefore create one by giving the input a height and a width
    of 1.25em. We use em units because they are a percentage of the parent’s font
    size. By setting our height and width to 1.25rem, we are setting them to equal
    1 and a quarter times the value of font size of the parent. If our label, the
    container and therefore parent of our input, has a font size or 16 pixels, our
    box will therefore have dimensions of 20 pixels wide by 20 pixels tall (16 × 1.25
    =20).


    We will then add a border to our box that inherits our label’s font color. I know
    this sounds a little weird, how are we going to make border color inherit from
    font color? We are going to use a keyword value currentColor which allows properties
    to inherit specifically font color when they otherwise could not. We are going
    to set the border color to currentColor which will make the border color match
    the font color. To set our border width we are also going to use em, same as with
    our height and width, which will allow the width of our border to also scale with
    the size of our radio button.


    Because inputs are inline elements by default, in order for the height and width
    to be applied, we will also need to change the display property. We will set it
    to inline-grid because when we handle the checked state for our inputs, we will
    need to center the inner disk or check mark. Grid allows us to do so easily using
    the place-content property.


    Inline-grid is to grid as inline-block is to block. inline-block has all the same
    properties as block, but places itself inline in the page flow. inline-grid works
    the same way. We have access to all of the features of grid, but the element will
    place itself inline in the page flow rather than below the previous content. For
    our purpose this means that the


    9 https://developer.mozilla.org/en-US/docs/Web/CSS/color_value#currentcolor_keyword

    10 https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Grid_Layout/Basic_Concepts_of_Grid_Layout'

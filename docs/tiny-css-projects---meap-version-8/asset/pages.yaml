    You might wonder why these selectors are called pseudo-class and pseudo-elements.
    Let''s look at what pseudo means:


    > *not genuine; false or pretend*


    This makes sense as technically we are targeting a state or parts of an element
    that might not exist yet, so we are just pretending. Pseudo-classes can change
    as we have seen with styling our own links. We are creating `if` conditions that
    are set in motion by the user''s actions. For example, `if` the user `hovers`
    then the browser will show one style, but `if` the user `visited` the link then
    the browser will show another style. Not all pseudo-elements and classes work
    on all HTML elements, throughout this book we will look at where we can use pseudo
    classes and with which HTML elements.


    # 1.6.4 Attribute value selectors


    Commonly used for styling links and form elements, the attribute selector styles
    HTML elements with a specified attribute. The attribute value selector looks for
    a specific attribute with the same value.


    In our article we have some content that is in Italian. The language of the paragraph
    is specified using the `lang` attribute. (Listing 1.8).


    # Listing 1.11 Italian content



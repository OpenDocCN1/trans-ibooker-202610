- pgno: 75
  md: 'The only downside to our declarations is that if there was another SVG graphic
    that also had rectangles then it could style the wrong graphic. To avoid this
    issue we can add a class name to our SVG graphic as an identifier to specify which
    SVG with the rectangle we want to style.


    # 3.3 Animation module


    The CSS Animation Module allows us to animate properties using keyframes, which
    we will look at shortly. As well as the keyframes we can then control parts of
    the animation like how long the animation should last, and how many times it animates.


    # 3.3.1 Animation property


    The animation property is shorthand for the following properties:


    +   - `animation-name`

    +   - `animation-timing-function`

    +   - `animation-iteration-count`

    +   - `animation-fill-mode`

    +   - `animation-duration`

    +   - `animation-delay`

    +   - `animation-direction`

    +   - `animation-play-state`


    For our animation we will focus on 4 of these properties:


    +   1. `animation-name`

    +   2. `animation-duration`

    +   3. `animation-iteration-count`

    +   4. `animation-delay`


    The effect we want to create is each rectangle shrinking and growing over a period
    of time but not all in sync. At any given point in time we want the heights of
    the elements to be slightly different. When they are shrinking and growing, we
    want the top and bottom of the rectangle to come towards the center and then expand
    back out to full height. Essentially, we will be creating a squeezing effect,
    going from large, to small, back to being large.


    Although we will apply the same animation to all the rectangles, in order to stagger
    their sizes we will apply a slightly different delay to the start of the animation
    of each rectangle. As each rectangle starts animating at a different time each
    one will be in a different stage of expanding and shrinking creating a ripple
    wave effect.


    Let’s first look at how we create the animation itself. Then we will look at how
    to apply it to the rectangles. Finally we will add the individual delays to stagger
    the size at any given point in time. To create the animation, we will use keyframes.
    The animation property will then reference the keyframe and dictate the duration,
    delay, and how many times we want the animation to run.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# 3.3.2 Keyframes and Animation name


    When we create our keyframes we need to give the keyframe a name. The animation-name
    declaration value matches the keyframe name to join the two together. With the
    animation-name property we can list multiple animations separated by a comma.


    Keyframes come to us from the animation and motion picture industry. When companies
    used to do animation by hand they would compose many, individual pictures, and
    then, within each picture or frame, there would be a change. Over time we kept
    making changes to each frame and gradually we would get to the end frame. A simple
    example of this technique are flipbook animations. The more frames and subtler
    the tweek over a short period of time, the more fluid the animation becomes.


    A keyframe represents the most important (key) changes in your animation (the
    frame). Then the browser works out all of the frames between each frame. This
    is known as in-betweening. Allowing the hardware to do the work it can then quickly
    fill in all of those between frames creating a smooth transition between one state
    and another. This concept is diagrammed out in Figure 3.8.


    ![](img/b56145aa9b751926a7aedbd7172bc818_76_0.png)


    In CSS keyframe is an at-rule which controls the steps to happen within an animation
    sequence. At-rules are CSS statements that dictate how our styles should behave
    or when they should be applied. They begin with an @ symbol followed by an identifier
    (in our case keyframes). The syntax looks as follows @keyframes animation-name
    { ... }. The code inside of the brackets define the animation''s behavior.


    Each step inside of the keyframe is defined by a percentage (percent of time passed
    in the animation) and the styles applied when we reach that point in time. Let''s
    look at an example (Listing 3.6, this example can also be found on codepen at
    https://codepen.io/martine-dowden/pen/dydmWZO where we can see the animation run).


    The example has 2 keyframes, one named color and one named border-radius. We have
    applied both of the animations to a div. We then defined how long the animation
    should take to run (3 seconds), and how many times it should run (10 times).'
  merge: -1
  img_proc: true
- pgno: 77
  md: "Inside of each keyframe is what styles should be applied to the elements. We\
    \ notice we have 2 different types of notation, we have keywords, and we have\
    \ percentages. Let’s break down what we are defining in the first keyframe.\n\n\
    We assert that when the animation begins (0%), we want to set the background color\
    \ of the div to blue. By the time we reach 50% of our animation (half of 3 seconds\
    \ or 1.5 seconds), our background will be yellow. And when the animation ends\
    \ (100%, or at 3 seconds), our background will be red. In between the steps we\
    \ will see a smooth change from one state to the next.\n\nIn the second keyframe,\
    \ border-radius, instead of percentages we use the keywords from and to. from\
    \ is the equivalent of 0% and to is equivalent to 100%. We also note that we can\
    \ mix the notation we want to use within the same keyframe.\n\n# Listing 3.6 Example\
    \ Animation\n\n```\n@keyframes color {\n  0% { background: blue }    #A\n  50%\
    \ { background: yellow }  #A\n  100% { background: red }   #A\n}\n\n@keyframes\
    \ border-radius {\n  from { border-radius: 0 }   #B\n  50% { border-radius: 50%\
    \ }  #B\n  to { border-radius: 0 }     #B\n}\n\ndiv {\n  animation-name: color,\
    \ border-radius;   #C\n  animation-duration: 3s;                #D\n  animation-iteration-count:\
    \ 10;         #E\n}\n```\n\n#A First keyframe, named \"color\"\n#B Second keyframe,\
    \ name \"border-radius\"\n#C animation-name property referencing both of the keyframes\n\
    #D Setting how long the animation should take to complete\n#E Setting how many\
    \ times the animation should run\n\nWhen we apply the animation to the div, we\
    \ also set a duration and iteration count. Notice that these 2 values are being\
    \ applied to both of our animations. Before we take a closer look at these 2 properties\
    \ and how they work, let’s go ahead and create our keyframes for our loader.\n\
    \nFor our loader, we want to grow and shrink, or scale, our rectangles over time.\
    \ We will therefore call our keyframe scale. Our at-rule will look as follows:\
    \ @keyframes scale { }.\n\nInside of the at-rule, we then define the steps (or\
    \ frames) for the animation. We will start with the rectangle having its full\
    \ height. Halfway through the animation, we want the height of the rectangle to\
    \ be 20% of its original height. When the animation terminates, we want the rectangle's\
    \ height to be back to full size. We will therefore have 3 steps to define: from\
    \ (or 0%), 50%, and to (or 100%)."
  merge: -1
  img_proc: true
- pgno: 78
  md: "To change the size of the rectangle we will use the `transform` property. It\
    \ allows us to change the appearance of an element (rotate, scale, distorted,\
    \ move...) without affecting the elements around it. If we were to reduce the\
    \ height of a `div` using the `height` property, the content below it would move\
    \ up to fill in the newly available space. With `transform`, the amount of space\
    \ and location of the element in terms of the page flow does not change, only\
    \ its visible aspect. Using the same scenario, if we were to decrease the height\
    \ of that same `div` using `transform`, the content below it would not move up.\
    \ We would have a blank space.\n\nTo affect the element, the `transform` property\
    \ takes a `transform-function`. We will use `scaleY()`. (A full list of available\
    \ functions can be found here: https://developer.mozilla.org/en-US/docs/Web/CSS/transform-function).\n\
    \nThe `scaleY()` function vertically resizes an element without affecting its\
    \ height, skewing or stretching it. To define how much an element should be scrunched\
    \ or stretched, we pass the function either a percent or a number. The number\
    \ value maps to the decimal value of its percentage equivalent therefore `scaleY(.5)`\
    \ and `scaleY(50%)` achieve the same result of decreasing the element’s height\
    \ to 50% of its original value. Values above 100% increase the size of the element\
    \ while values between 0 and 100% shrink it.\n\nNegative values applied to `scaleY()`\
    \ will flip the element vertically, so `scaleY(-0.5)` would flip the element upside\
    \ down and shrink its height by 50%. `scaleY(-1.5)` will flip the element upside\
    \ down and make the height 1.5 times the original value.\n\nFor our loader bars,\
    \ we want our rectangles to be full height at the beginning and end of the animation,\
    \ and 20 percent of the original height halfway through the animation. Our completed\
    \ keyframe with transforms applied will therefore look as follows (Listing 3.7).\n\
    \n# Listing 3.7 Completed keyframe\n\n```\n@keyframes scale {\n  #A\n  from {\
    \ transform: scaleY(1) }  #B\n  50% { transform: scaleY(0.2) } #C\n  to { transform:\
    \ scaleY(1) }   #D\n}                               #E\n\nrect { animation-name:\
    \ scale; }  #F\n```\n\n#A Start of the scale at-rule\n#B Start the animation full\
    \ height\n#C Halfway through the animation, the height should be 20% of the original\
    \ value\n#D By the end of the animation, return the rectangle to full height\n\
    #E End of the scale at-rule\n#F Applying the keyframe to the rectangles\n\nIf\
    \ we run the code, we will notice that nothing has changed, our rectangles are\
    \ not growing and shrinking yet even though we applied the keyframe to our rectangles.\
    \ We still need to define the duration and iteration count. Let’s dig into those\
    \ properties a bit further.\n\n# 3.3.3 Duration\n\nThe duration sets how long\
    \ we want the animation to happen from start to finish. The duration can be set\
    \ in seconds (s) or milliseconds (ms). The longer the duration the more"
  merge: -1
  img_proc: true
- pgno: 79
  md: "slowly the animation takes to complete. With accessibility in mind, we want\
    \ to consider users who are sensitive to motion and choose a duration that is\
    \ reasonable.\n\n# Animations, Seizures, and Flash Rate\n\nThe W3C recommends\
    \ that in order to prevent inducing seizures that are due to photosensitivity\
    \ in our users, we need to make sure that our animation does not contain anything\
    \ that flashes more than three times in any one second period¹.\n\nA lot goes\
    \ into choosing appropriate animation timing. An animation that is too fast can\
    \ become imperceivable or cause seizure depending on its nature. An animation\
    \ that is too slow can make our application look laggy. For small micro animations\
    \ such as flipping an arrow from pointing up to pointing down when reordering\
    \ a list, our duration should be short. Most micro animations are transitional.\
    \ They animate the change of an element from one state to another. A generally\
    \ accepted duration for this type of animation is around 250 milliseconds.\n\n\
    If the animation is larger or more complex, such as opening and closing a large\
    \ panel or menu, then we can increase the duration up to around 500 milliseconds.\
    \ A loader is a bit different though, it is not a quick passing change responding\
    \ to a user’s action, it’s a large visual element the user will be focused on\
    \ for a period of time.\n\nMost often when determining the \"correct\" timing\
    \ for a loader, we will use trial and error to find a speed that works best with\
    \ our graphic. For our project we want to set the animation to happen over 2.2\
    \ seconds. To apply the amount of time the animation should take, we add the `animation-duration`\
    \ property to our rectangles as seen in Listing 3.8.\n\n# Listing 3.8 Added animation\
    \ duration\n\n```\nrect {\n  animation-name: scale;\n  animation-duration: 2.2s;\n\
    }\n```\n\nWhen we run the code, we notice that our loader animates once and then\
    \ never again unless we reload the browser window. We also notice that all of\
    \ the bars increase and decrease in size at the same time. Let’s first handle\
    \ making our loader continue to animate over time and then we can stagger the\
    \ animation across our rectangles so that they appear to be different heights.\n\
    \n# 3.3.4 Iteration count\n\nTo make our animation restart once it has completed\
    \ we need to use the `iteration-count` property. It sets the number of times the\
    \ animation should repeat. By default the value is 1. Since we didn’t set a value\
    \ yet, the browser assumed we wanted the animation to run once"

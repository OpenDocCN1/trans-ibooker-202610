- pgno: 21
  md: "# 1.4.6 !important\n\nThe !important annotation is one we may have seen in\
    \ some stylesheets. Often used as a last resort when all else fails, it is a way\
    \ to override the specificity and declare that a particular value is the most\
    \ important thing regardless of all else. However, with great power comes great\
    \ responsibility. The !important annotation was originally created as an accessibility\
    \ feature.\n\nRemember how we talked about users being able to apply their own\
    \ styles in order to have a better user experience? It was created to help users\
    \ define their own styles without having to worry about specificity. Since it\
    \ overrides any other styles, it was created to ensure that the user’s styles\
    \ would always have the highest importance and therefore be the ones applied.\n\
    \nMaking use of !important is therefore considered bad practice and should not\
    \ be used in our author stylesheets. Doing so breaks the natural cascade of the\
    \ CSS and can make it harder to manage the stylesheet going forward.\n\n# 1.5\
    \ Specificity\n\nWhen there are multiple property values being applied to an element,\
    \ one will win over the others. How we determine the winner is through a multi\
    \ step process. We will ignore !important for the time being as it breaks the\
    \ normal flow, and we will come back around to it later.\n\nWe first look at where\
    \ the value comes from. Anything explicitly defined in a rule will override inherited\
    \ values. For example (listing 1.4), if we set a font color to red on the body\
    \ tag, the elements that are inside the tag will have red text. The font color\
    \ is inherited by those elements. If we specifically set a different color on\
    \ a paragraph inside of the body, the inherited red value would be overwritten\
    \ by the more specific blue value set on the paragraph. Therefore, that paragraph’s\
    \ text color would be blue.\n\n# Listing 1.5 Example of inheritance\n\n```\n<body>\
    \ #A\n  <h1>Example</h1> #B\n  <p>My paragraph</p> #C\n</body> #D\n\nbody { color:\
    \ red } #E\np { color: blue }  #E\n```\n\n#A start of HTML\n#B our header would\
    \ inherit the red color\n#C the paragraph’s color would be blue as set by the\
    \ paragraph rule\n#D end of HTML\n#E CSS Rules\n\nNot all property values will\
    \ be inherited. Theme related styles such as color and font size, will generally\
    \ be inherited. Layout considerations are generally not. This is a very loose\
    \ guideline, and there are definitely exceptions but this is a good place to start.\
    \ We will cover exceptions as a case by case when they appear throughout the projects."
  merge: -1
  img_proc: true
- pgno: 22
  md: 'If inherited versus explicit doesn’t act as a tiebreaker to determine the value,
    we then look at the type of selector which was used and mathematically calculate
    the specificity value. We will get into more detail about what each selector type
    is in this chapter, but let’s look at how the math is applied.


    We look at the selector, categorize the types of selectors being used by the rule,
    then apply the type value. We then add all of the values and get a final specificity
    value. Figure 1.9 diagrams the process. The biggest number wins, therefore rule
    #1 in the diagram would win over rule #2.


    ```

    button[type="submit"]#save span { ... }

    ```


    Type Selector 1 + Attribute Selector 10 + ID Selector 100 + Type Selector 1 =
    112


    ```

    button[type="submit"] span { ... }

    ```


    Type Selector 1 + Attribute Selector 10 + Type Selector 1 = 12


    Figure 1.9 Calculating specificity


    Specificity values by selector type are as follows:


    +   - 100 - ID selectors

    +   - 10 - Class selectors, attribute selectors, and pseudo classes

    +   - 1 - Type selectoros, and pseudo elements

    +   - 0 - Universal selectors


    If we still have a tie we look at which stylesheet the style originated from.
    If both values come from within the same stylesheet, the one later in the document
    wins, if they come from different stylesheets, the order is as follows


    +   1. User stylesheet

    +   2. Author stylesheet(s) (in order in which they are being imported, last one
    wins)

    +   3. User Agent stylesheet


    We set !important to the side earlier. Now that we understand the normal flow,
    let’s add it back into the mix. When a value has the !important annotation, the
    process is short circuited and the value with the annotation automatically wins
    regardless of anything else. If both values have the !important annotation, the
    normal flow is followed. The diagram in Figure 1.10 shows the flow through the
    stylesheets including property values with the !important annotation.'
  merge: -1
  img_proc: true

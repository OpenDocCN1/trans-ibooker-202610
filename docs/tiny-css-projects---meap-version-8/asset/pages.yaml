    # 6.6.7 Styling the actions


    The last thing we need to style in our profile card are the 2 actions the user
    can take at the bottom of the card: to message or to follow the profile owner.


    Even though they are semantically different, one is a link and the other is a
    button, we are going to style both of them to look like buttons. Let’s start with
    some basics that will apply to both elements. We create one rule with selectors
    for both elements in order to ensure that both element types are visually consistent.
    We then create individual rules for where they diverge.


    We also create a focus-visible rule which will be applied to all elements using
    the universal selector (*) and the pseudo-class :focus-visible so that when a
    user navigates to our links and buttons via keyboard, they are presented with
    a dotted outline around the element and can clearly see what they are about to
    select.'

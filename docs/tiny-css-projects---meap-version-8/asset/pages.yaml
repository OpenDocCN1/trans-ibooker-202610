- pgno: 41
  md: 'The single-line format (Listing 1.15) makes a lot of sense, it is compact,
    and we can quickly scan through a file knowing the first part is the selector.
    However, the downside is that it can quickly become difficult to read if a rule
    contains many declarations.


    # Listing 1.18 The single-line format


    ```

    h1 { color: red; font-size: 16px; font-family: sans-serif }

    ```


    There are positives and negatives to all of the options, but we will notice that
    the projects in this book use a combination of option one and three. The main
    thing to know is that there is no right or wrong way, it generally comes down
    to what works best for you or your team. As long as the code is easy to understand,
    then that''s all that matters.


    Those with an eagle eye will also notice in the examples above there are no semicolons
    (;) on the declarations of the last rules. Whether we want to add it or not is
    optional, but for better web performance it is best practice to remove it.


    One of the best parts about CSS is that we can write it in the way that is most
    comfortable to us.


    # 1.8 Summary


    +   - CSS is a well established coding language and each part of CSS is made up
    of modules.

    +   - Modules replaced large releases like CSS3, and there will not be a CSS4
    release.

    +   - Inline CSS can take the highest priority and has good performance, however
    it is very repetitive and hard to maintain.

    +   - External CSS keeps our CSS separate from our HTML maintaining separation
    of concerns.

    +   - As well as our own CSS, the browser applies default styling.

    +   - The user may also apply their own CSS which can override the author and
    user agent stylesheets.

    +   - Using !important is considered bad practice.

    +   - A CSS rule consists of a selector and one of more declarations.

    +   - There are many types of selectors against which we can create rules each
    with their own level of specificity'
  merge: -1

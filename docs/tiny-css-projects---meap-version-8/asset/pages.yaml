    \   #C\n}\ntime sup {                                  #D\n  font-size: .875rem;\n\
    \  font-weight: normal;\n}\n```\n\n#A Typography\n\n#B Handles the borders and\
    \ padding\n\n#C Makes the element behave like a block-level element\n\n#D Styles\
    \ the \"th\"\n\n# 4.1.6 Quotes\n\nThe last bit of text we want to feature is the\
    \ blockquote found after the second paragraph in the article. Sticking with our\
    \ theme and like all of the other elements we want to make standout, we will make\
    \ the font size bigger and bolder. We will also adjust the line height. Finally\
    \ we add margin to the element. Isolating an element away from other content around\
    \ it makes it easier to spot. By adding top and bottom margin, we add space between\
    \ it and the paragraphs above and below creating white space around the element.\
    \ By adding left and right margins, we change its alignment, effectively indenting\
    \ it. The added white space creates the isolation we were just mentioning.\n\n\
    Let’s also add quotation marks to our blockquote. To add the quotation marks at\
    \ the beginning and end of our quote we could simply go into the HTML and add\
    \ them, or we can do it programmatically via CSS.\n\nThe `quotes` property allows\
    \ us to define custom quotation marks. We can pass it the symbols we want to use\
    \ as our double and single quote glyphs. Not all languages use the same symboles.\
    \ In American English we use \"...\" and `..`, in French however we use «...»\
    \ and ‹...›. Using the quote property we can customize which symbols we want to\
    \ use. If we don’t provide a value for `quotes`, the browser’s default behavior\
    \ is to use what is customary for the language set on the document. This property\
    \ however, only defines the symbols, it does not add them.\n\nTo add them we use\
    \ the `content` property values `open-quote` and `close-quote` in conjunction\
    \ with the `::before` and `::after` pseudo elements as seen in Listing 4.7. The\
    \ pseudo elements allow us to insert content via the `content` property before\
    \ and after the element they are applied to respectively. The `open-quote` and\
    \ `close-quote` keywords represent opening and closing quotation marks as they\
    \ are defined by the `quotes` property. Since we did not add a `quotes` declaration\
    \ to our `blockquote` rule, the browser will use what is conventional for the\
    \ document’s language which we have set to en-US in the language"

- pgno: 269
  md: '# 10.3.4 :where() and :is() pseudo-classes


    At this junction, we are going to look at two pseudo classes that will help us
    keep our code clean and concise :is() ¹¹ and :where() ¹². Both work similarly
    in that they take a list of selectors and will apply the rule if any of the selectors
    within the list match. It is incredibly helpful when writing long lists of selectors.
    Instead of writing:


    ```

    input:focus, textarea:focus, select:focus, button:focus { ... }

    ```


    We can instead use :where or :is and write an equivalent like so:


    ```

    :where(input, textarea, select, button):focus { ... }

    ```


    The :is() pseudo class would be applied in the same manner. The difference between
    :is() and :where() is in their level of specificity. :where() is least specific
    and therefore easy to override. :is() on the other hand takes the specificity
    value of the most specific selector inside of the list.


    > NOTE Specify For a refresher of how specificity is calculated check out the
    Specificity section in chapter 1. We will also go into a bit more depth about
    how to calculate specificity when using :where() and :is() later in this chapter.


    Caution must therefore be used in using :is() because if we have an id selector
    inside of our list of selectors (id selectors are most specific), we can quickly
    create rules that become very difficult if not impossible to override.


    We will use both :where() and :is() in conjunction with other pseudo classes such
    as :checked, :hover, :focus, and the ::before pseudo element to finish styling
    our checkbox and radio inputs.


    # 10.3.5 Styling checked radio and checkbox inputs


    To add the inner disk of the checked radio and the checkmark for the checkbox,
    we are going to apply a similar methodology as we did for the unchecked styles
    where we created some base styles that applied to both and then added the finishing
    touches to each element individually when the styles diverged. Same as before,
    we will first create a box. We will then place that box in the center of the existing
    styles, and finally shape it to be either a disk or checkbox.


    To create this second box to be placed inside of our current element we will use
    the ::before pseudo-element. This is when the :where() pseudo class we introduced
    in the last section comes into play. We will use it to select both of our input
    types and then add the ::before pseudo elements. Our selector will therefore look
    like this: :where(input[type="radio"], input[type="checkbox"] )::before { ...
    }.


    We can now create our box. Our content will be empty, so we will use a content
    property value of "", we will give it a display of block so that we can assign
    a width and a height.'
  merge: -1
  img_proc: true
- pgno: 270
  md: "When we created the outer box earlier, we gave it a height and width of 1em.\
    \ We used an em unit so that control would scale in size relative to the text\
    \ size. We will do that here as well. We want the radio inner disk and check mark\
    \ to be smaller than their container so we will set our height and width to 0.625em.\
    \ Assuming the font size applied to the input is 16px, our box size in pixels\
    \ with be 10px by 10px (16 × 0.625 = 10).\n\nWe do not need to do anything to\
    \ position our inner box because remember how we set the input display to inline-grid\
    \ and then added the place-content property with a value of center (Listing 10.11)?\
    \ The grid layout will automatically place the inner box in the center of the\
    \ input.\n\n# Listing 10.11 Center the Inner Box\n\n```\ninput[type=\"radio\"\
    ], input[type=\"checkbox\"] {\n  ...\n  display: inline-grid;  #A\n  place-content:\
    \ center;  #A\n  ...\n}\n```\n\n#A the two properties responsible for positioning\
    \ our inner box\n\nThe code we put together thus far to create our inner box is\
    \ displayed in Listing 10.12.\n\n# Listing 10.12 Inner Box\n\n```\n:where(input[type=\"\
    radio\"], input[type=\"checkbox\"]):before {\n  display: block;\n  content: '';\n\
    \  width: 0.625em;\n  height: 0.625em;\n}\n```\n\nWhen we apply this code we will\
    \ not see any changes as demonstrated in Figure 10.17. Our inner box does exist,\
    \ but is not visible yet.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_270_0.png)\n\
    \nFigure 10.17 Invisible inner box\n\nThe box is not yet visible because it does\
    \ not have any content or background color. We will therefore be adding a background\
    \ color next."
  merge: -1
  img_proc: true
- pgno: 271
  md: "# 10.3.6 Using the :checked pseudo-class\n\nWe are not going to blankety apply\
    \ the same background color to our element all the time. We are going to use our\
    \ accent color when the element is checked, and our hover color when it is being\
    \ hovered over.\n\nThe :checked pseudo-class selector can be used on an input\
    \ of type radio or checkbox, or to the option element in a drop down list (<select>)\
    \ to apply styles when the element is checked. However, the ability to use it\
    \ on option is browser dependent.\n\nWhen we apply the background color for checked\
    \ and on hover, if the selectors have the same level of specificity (our example\
    \ will) the order in which we write these rules matters. If we write the checked\
    \ rule first and the hover rule second, the hover color will be applied to a checked\
    \ input on hover because the hover rule will override the checked rule by nature\
    \ of it being later in the CSS file. We therefore want to make sure the hover\
    \ rule is placed before the checked rule in the CSS file. Figure 10.18 illustrates\
    \ these 2 scenarios.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_271_0.png)\n\n\
    Figure 10.18 Rule order regarding background for checked checkboxes on hover\n\
    \nLet’s look at how we would go about applying our background colors in our CSS\
    \ file. Listing 10.13 shows an excerpt of our file thus far.\n\n# Listing 10.13\
    \ Inner Element Background Color\n\n```\n:where(input[type=\"radio\"], input[type=\"\
    checkbox\"]):before {\n  display: block;\n  content: '';\n  width: 0.625em;\n\
    \  height: 0.625em;\n}\n```\n\n13 https://developer.mozilla.org/en-US/docs/Web/CSS/:checked"
  merge: -1
  img_proc: true
- pgno: 272
  md: "```\n}\n\n:where(input[type=\"radio\"], input[type=\"checkbox\"]):hover::before\
    \ { #B\n  background: var(--hover);\n}\n\n:where(input[type=\"radio\"], input[type=\"\
    checkbox\"]):checked::before { #C\n  background: var(--accent);\n}\n```\n\n#A\
    \ the previously written code for the inner box\n#B adding a background color\
    \ to the inner box on hover\n#C adding a background color the inner box when input\
    \ is checked\n\nFigure 10.19 shows us that we now have a square box we can shape\
    \ inside of our elements. It is displayed using our accent color when the element\
    \ is checked and when we hover over non checked radio or checkbox inputs, we see\
    \ the gray box.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_272_0.png)\n\nFigure\
    \ 10.19 Setting up for our checked state\n\nWe now need to shape the inner box.\
    \ This is where our code will bifurcate to create a disk and checkmark for the\
    \ radio and checkbox respectively.\n\n# 10.3.7 Shaping the checked radio input’s\
    \ inner disk\n\nTo turn our box into a circle for the insides of our checked radio\
    \ input, we are going to use border-radius. We will specifically target the inputs\
    \ of type radio’s before pseudo-class, and then add a border-radius of 50% to\
    \ make our box look like a circle as seen in Listing 10.14. We do not differentiate\
    \ between hover or checked because we want the shape to be a disk no matter the\
    \ state of the element.\n\n# Listing 10.14 Radio Button Inner Disk\n\n```\ninput[type=\"\
    radio\"]::before {\n  border-radius: 50%;\n}\n```\n\nWe now have a very traditional\
    \ looking radio button (Figure 10.20) that scales nicely regardless of text size."
  merge: -1
  img_proc: true
- pgno: 273
  md: '![](img/b56145aa9b751926a7aedbd7172bc818_273_0.png)


    Figure 10.20 Styled Radio Input


    With our radio input styles, we will now turn our attention to shaping the checkmark
    inside of our checkbox.


    # 10.3.8 Using CSS shapes to create the checkmark


    Shaping our radio inputs was pretty simple, we used border-radius and achieved
    a disk shape. A checkmark is not quite as simple of a shape. To create it we will
    use clip-path.


    > NOTE Clip-path Clip path allows us to create shapes by creating a clipping region
    that defines which part of the element should be shown versus hidden. We''ve used
    clip-path before in chapters 5 and 7 if you want a refresher


    To create our checkmark, the shape we will apply to the clip-path is a polygon
    which will create our checkmark. Polygons are created by setting a series of X
    and Y percentage based coordinates between which a line is created. The (0, 0)
    coordinate is the top left corner of the shape. If the shape is not explicitly
    closed, it will automatically join the first and last points. Our polygon function
    will be: polygon(14% 44%, 0% 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%). Figure
    10.21 explains the point by point construction of the shape.'
  merge: -1
  img_proc: true
- pgno: 274
  md: "![](img/b56145aa9b751926a7aedbd7172bc818_274_0.png)\n\nFigure 10.21 Polygon\
    \ Check Mark Shape Coordinates\n\nWith our shape created we can now create our\
    \ clip-path and apply it to the inner portion of our checkbox as shown in Listing\
    \ 10.15.\n\n# Listing 10.15 Check mark in our checkbox\n\n```\ninput[type=\"checkbox\"\
    ]::before {\n  clip-path: polygon(14% 44%, 0% 65%, 50% 100%, 100% 16%, 80% 0%,\
    \ 43% 62%);\n}\n```\n\nWith the clip-path added, we now have a fully functional\
    \ checkbox. Let’s add some finishing touches. Notice how in Figure 10.22 the outline\
    \ of the checked radio and checkbox are still our font color rather than the accent\
    \ color.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_274_1.png)\n\nFigure 10.22\
    \ Style Checkmark in the checkbox"
  merge: -1
  img_proc: true
- pgno: 275
  md: "To add the outline color for both the radio and checkmark when they are checked,\
    \ we are going to use the :checked pseudo class again, to specifically select\
    \ the control only when it is checked and change the border color to our accent\
    \ color. In code this translates to what is shown in Listing 10.16. We use :is\
    \ instead of :where because of specificity.\n\n# Listing 10.16 Accent color outline\
    \ for checked inputs\n\n```\ninput[type=\"radio\"],\ninput[type=\"checkbox\"]\
    \ {\n  ...\n  border: 0.1875em solid currentColor;\n}\n\n:is(input[type=\"radio\"\
    ], input[type=\"checkbox\"]):checked {\n  border-color: var(--accent);\n}\n```\n\
    \n# 10.3.9 Calculating specificity with :is() and :where()\n\nWe mentioned earlier\
    \ that :where has a specificity of 0, meaning it is the least specific selector\
    \ available to us. We set our default border color in the following selector input[type=\"\
    radio\"], input[type=\"checkbox\"] { ... } which has a specificity of 11, calculated\
    \ using table 10.2 below. In each column we count the number of each type of selector,\
    \ with columns A, B, and C forming the specificity value¹⁶.\n\n# Table 10.2 Calculating\
    \ Specificity\n\n| Selector | A ID selectors (x100) | B Class selectors, Attribute\
    \ Selectors, & Pseudo Classes (x10) | C Type Selectors, pseudo elements (x1) |\
    \ Specificity |\n|---|---|---|---|---|\n| :where(input[type=\"radio\"], input[type=\"\
    checkbox\"]) | Ignores specificity rules and always equals 0 |  | 000 |\n| :where(input[type=\"\
    radio\"], input[type=\"checkbox\"]):checked | Ignores specificity rules and always\
    \ equals 0 |  | 000 |\n| input[type=\"radio\"] | 0 | 1 | 1 | 011 |"
  merge: -1
  img_proc: true
- pgno: 276
  md: "| input[type=\"radio\"]:checked | 0 | 2 | 1 | 021 |\n|:is(input[type=\"radio\"\
    ], input[type=\"checkbox\"]):checked | 0 | 2 | 1 | 021 |\n\nSince :is will base\
    \ its specificity value to be the value of the most specific selector within it,\
    \ in our particular case, its specificity will be 11 plus another 10 for the :checked,\
    \ giving us a specificity of 21. Since 21 is greater than 0 we override the styles\
    \ and our border becomes our accent color.\n\nOur radio inputs and checkbox are\
    \ now styled both when checked and unchecked, and on hover for both states. Figure\
    \ 10.23 shows the finished product.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_276_0.png)\n\
    \nFigure 10.23 Styled Checkmark and Radio Inputs\n\nLet’s turn our attention to\
    \ the dropdown next.\n\n# 10.4 Styling dropdowns\n\nAlthough we set the same defaults\
    \ to select elements as we did the inputs and textarea (as a refresher they are\
    \ displayed in Listing 10.17) we can see in Figure 10.24 that it did not take\
    \ the full width of our container like the others. Furthermore, with our added\
    \ border our down arrow indicating that it is a drop down is quite close to the\
    \ edge.\n\n```\nListing 10.17 Default styles applied to select\ninput:not([type=\"\
    radio\"], [type=\"checkbox\"]),\ntextarea,\nselect {\n  background: var(--background);\n\
    \  font-size: 1rem;\n  font-family: inherit;\n}\n```"
  merge: -1
  img_proc: true

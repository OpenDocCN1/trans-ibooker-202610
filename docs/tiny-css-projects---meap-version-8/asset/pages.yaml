- pgno: 310
  md: "We want to override the defaults provided by the browser and align the icon\
    \ and text within (Listing 11.3). We remove the background, and border, adjust\
    \ the font size and padding, and curve our corners.\n\nTo align the icon and text,\
    \ we give the button a display value of flex, and then use `align-items` to vertically\
    \ align the icon and text. To add white space between the icon and text, we use\
    \ the `gap` property.\n\n# Listing 11.3 Styling the share button\n\n```\n.share_button\
    \ {\n  background: none;\n  border: none;\n  font-size: 1rem;\n  padding: 0 2rem\
    \ 0 1.5rem;\n  border-radius: 36px;\n  display: flex;\n  align-items: center;\n\
    \  gap: 1ch;\n}\n```\n\nFigure 11.4 shows our output\n\n![](img/b56145aa9b751926a7aedbd7172bc818_310_0.png)\n\
    \nFigure 11.4: Styled share button\n\nNext let’s handle hover and focus styles.\
    \ We use the `:hover` and `:focus-visible` pseudo-classes to conditionally change\
    \ the cursor style and add a black outline to the button. We then offset the outline\
    \ by `-5px` so that the outline places itself 5 pixels inside the button rather\
    \ than on the outer edge.\n\nThe `outline-offset` property allows us to control\
    \ where the outline is placed. Positive numbers move the outline further out or\
    \ away from the element while negative numbers inset the outline.\n\nListing 11.4\
    \ shows our hover and focus CSS."
  merge: -1
  img_proc: true
- pgno: 311
  md: "# Listing 11.4 Share button hover and focus CSS\n\n```\n.share__button:hover,\n\
    .share__button:focus-visible {\n  cursor: pointer;\n  outline: solid 1px black;\n\
    \  outline-offset: -5px;\n}\n```\n\nFigure 11.5 shows our button being hovered\

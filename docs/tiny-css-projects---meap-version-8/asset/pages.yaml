  md: "# Listing 11.12 JavaScript File\n\n```\n(() => {\n'use strict';\n\nlet expanded\
    \ = false;\nconst container = document.getElementById('share');\nconst shareButton\
    \ = document.getElementById('shareButton');\nconst menuItems = Array.from(container.querySelectorAll('li'));\n\
    const menu = container.querySelector('menu');\n\naddButtonListeners();\naddListListeners();\n\
    addTransitionListeners();\n\nfunction addButtonListeners() {                 \
    \         #A\n  shareButton.addEventListener('click', toggleMenu);     #A\n  shareButton.addEventListener('keyup',\
    \ handleToggleButtonKeypress);  #A\n}                                        \
    \                 #A\n\nfunction addListListeners() {                        \
    \    #B\n  menuItems.forEach(li => {                              #B\n    const\
    \ link = li.querySelector('a');                  #B\n    link.addEventListener('keyup',\
    \ handleMenuItemKeypress);  #B\n    link.addEventListener('keydown', handleTab);\
    \         #B\n    link.addEventListener('click', toggleMenu);          #B\n  })\
    \                                                     #B\n}                  \
    \                                       #B\n\nfunction addTransitionListeners()\
    \ {                      #C\n  menu.addEventListener('transitionstart', handleAnimationStart);\
    \  #C\n  menu.addEventListener('transitionend', handleAnimationEnd);      #C\n\
    }                                                         #C\n\nfunction handleToggleButtonKeypress(event)\
    \ {             #D\n  switch(event.key) {                                    #D\n\
    \    case 'ArrowDown':                                    #D\n      if (!expanded)\
    \ { toggleMenu(); }                   #D\n      moveToNext();                \
    \                      #D\n      break;                                      \
    \       #D\n    case 'ArrowUp':                                      #D\n    \
    \  if (expanded) { toggleMenu(); }                    #D\n      break;       \
    \                                      #D\n  }                               \
    \                       #D\n}                                                \
    \         #D\n\nfunction handleMenuItemKeypress(event) {                 #E\n\
    \  switch(event.key) {                                    #E\n    case 'ArrowDown':\
    \                                    #E\n      moveToNext();                 \
    \                     #E\n      break;                                       \
    \      #E\n    case 'ArrowUp':                                      #E\n     \
    \ if (event.altKey === true) {                       #E\n        navigate(event);\
    \                                  #E\n        toggleMenu();                 \
    \                    #E\n      } else {                                      \
    \     #E\n        moveToPrevious();                                 #E\n     \
    \ }                                                  #E\n      break;        \
    \                                     #E\n```"

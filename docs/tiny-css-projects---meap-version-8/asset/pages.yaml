  md: 'layout elements as we grow smaller. We will create styles to accommodate 3
    sizes of screens:


    +   - Narrow (most phones): maximum width of 549 pixels

    +   - Medium (tablets and small screens): between 500px and 955px

    +   - Wide (desktops and high resolution tablets): wider than 955px


    Figure 8.1 shows our starting point and what the output will look like when we
    are done for each screen size.'

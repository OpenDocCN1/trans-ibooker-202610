  md: 'selectors, we write them as a comma delimited list before the opening curly
    bracket. To select all h1 and h2 elements for example, we would write h1,h2 {
    ... }.


    The declaration is made up of the property, in this case color, followed by the
    property value (red). The declaration defines how the element selected will be
    styled.


    Both properties and values must be written in American English. Spelling variations
    such as "colour" or "capitalise" are not supported and will not be recognized
    by the browser.


    When a browser comes across invalid CSS, it will ignore it. If a rule has an invalid
    declaration inside of it, valid declarations will still be applied, only those
    that are invalid will be ignored.


    Internal CSS works well for one-off web pages where the styles are specific to
    that page. It groups CSS nicely, allowing us to write rules that are applied across
    elements, preventing us from having to copy and paste the same styles in multiple
    places. It also has the same performance benefits as inline styles in that the
    browser immediately has access to the CSS rather than having to wait for it to
    be fetched from a different location.


    The downside of having our CSS within our HTML document is that the CSS will only
    work for that document. So if our website has multiple pages, which is often the
    case, we would need to copy that CSS into each HTML document. This will quickly
    become unmaintainable especially for large applications such as blogs or ecommerce
    websites because any style change would have to be applied to all pages.


    Let’s undo our changes to our project one last time, and look at a third technique.


    # 1.3.3 External CSS


    Like internal CSS, the external CSS approach keeps our CSS grouped together however
    it places the CSS in a separate .css file. By separating our HTML and CSS, we
    can effectively separate our concerns: content and style.


    We link the stylesheet to the HTML by using the <link> HTML tag. The link element
    needs two attributes for stylesheets: the rel attribute, which describes the relationship
    between the HTML document and the thing being linked to; and the href attribute
    which stands for hypertext reference and indicates where to find the document
    that we want to include. Listing 1.2 show how we link our stylesheet to our HTML
    for our project.


    ```

    Listing 1.3

    <!DOCTYPE html>

    <html>

    <head>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <h1>Inline CSS</h1>

    </body>

    ```


    Most of the time this is the approach you will see across the web and is the approach
    we will use throughout this book. The benefit of external stylesheets is that
    our CSS is in one single document which can be modified once and whose changes
    will apply across all of our HTML pages. The downside to this approach is that
    it does mean it will take an extra request from'

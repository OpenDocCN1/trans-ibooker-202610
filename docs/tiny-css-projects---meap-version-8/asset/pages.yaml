- pgno: 73
  md: 'First and foremost, how the SVG is being imported into our HTML affects where
    the styles need to live in order to affect the elements.


    The easiest way to add a vector graphic to a web page is via an image tag. We
    reference the image file the same way we would any other image: `<img src="myImage.svg"
    alt="">`. We can also add them as a `background-image` inside of our CSS: `background-image:
    url("myImage.svg");`


    In both of these cases our HTML and styles can affect the SVG itself but not the
    elements within. We can affect the size of the image for example but we cannot
    change the color of a particular shape contained inside the SVG. The image is
    essentially a black box we cannot penetrate to affect changes. In order to manipulate
    elements within it, the styles would need to be placed inside of the SVG itself.


    Our third option, and the one we are using in this chapter is to place the SVG’s
    XML inline, directly in our HTML rather than in an external file preventing the
    black box issue we would encounter if the code was in an external file. The drawback
    is that our concerns are not as well separated because our image code is now mixed
    in with our HTML.


    With our SVG placed inline in our HTML, the standard ways we apply CSS to any
    other HTML element apply. We can therefore place the styles we want to apply to
    our SVG inside of our CSS as it was any other HTML element.


    # SVG Presentation Attributes


    Unlike HTML where when applying styles inline we need to include a style attribute
    (ex: `<p style="background: blue">`), SVGs have a number of styles that can be
    added directly to the element as attributes. These are called **Presentation Attributes**.
    **fill** for example, (the SVG equivalent to `background-color`) can be applied
    directly to the element without a style tag: `<rect fill="blue">`.


    These properties do not have to be applied inline directly on the element. They
    can be added inside of a style tag or stylesheet the same way we apply any other
    CSS style: `rect { fill: blue; }`.


    A comprehensive list of SVG Presentation Attributes can be found at https://developer.mozilla.org/en-US/docs/Web/SVG/Attribute/Presentation


    Although the techniques to apply styles to our SVG elements remain the same as
    if they were HTML (except for the aforementioned SVG presentation attributes when
    applied inline) some of the properties we will use to style our elements will
    be different. Let’s take a closer look at the one we will be using for this project.


    # 3.2.1 Fill


    To set the background color of the loader bars, instead of using `background-color`,
    we will use the `fill` property, as the `background-color` property does not work
    for SVG elements. The fill property still supports the same values as the background-color
    such as color name, RGB(a), HSL(a) and hex. So instead of `rect { background-color:
    blue; }` we would instead write `rect { fill: blue; }`.


    If no `fill` value is assigned to a particular shape, the `fill` will default
    to black, which is why our rectangles are currently black.'
  merge: -1
  img_proc: true

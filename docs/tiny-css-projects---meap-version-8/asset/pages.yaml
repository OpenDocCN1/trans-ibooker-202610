    \ and great grandchildren.\n\n# Listing 1.7 HTML list items\n\n```\n<ul class=\"\
    list\">      #A\n  <li>List item 1</li>      #B\n  <ul>                    #C\n\
    \    <li>Nested item 1</li> #D\n    <li>Nested item 2</li> #D\n  </ul>\n  <li>List\
    \ item 2</li>    #B\n  <li>List item 3</li>    #B\n  <li>List item 4</li>    #B\n\
    </ul>                     #A\n```"

  \ 1.3 Starter HTML for our Article\n\n#### 1.3 为我们的 HTML 添加 CSS\n\nWhen styling\
  \ with CSS there are 3 ways to apply CSS to our HTML:\n\n- 1. Inline\n- 2. Internal\n\
  - 3. External\n\n#### 1.3.1 内联 CSS\n\nWe can inline the CSS by adding a style attribute\
  \ to an element. This method has us add the CSS to the element directly in the HTML.\n\
  \nAttribute tags are always specified in the start tag and typically consist of\
  \ the name of the attribute, in this case: style. The attribute is then followed\
  \ by an equals sign (=) and its value in quotes. All of the CSS goes inside of the\
  \ opening and closing quotation marks.\n\nAs an example, let’s set the color of\
  \ our heading to crimson:\n\n```\n<h1 style=\"color: crimson\"> Title of our article\
  \ (heading 1) </h1>\n```\n\nIf we save our HTML and view it in a browser, we will\
  \ see it is now crimson. If we are using a code editor rather than a web client\
  \ (codepen), we will need to refresh the browser page to view our changes. Figure\
  \ 1.3 shows the output. We notice that the only element affected is the <h1> on\
  \ which we applied the styles.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_13_0.png)\n\
  \nFigure 1.4 Crimson colored header\n\nThe benefit (and downside) of inline CSS\
  \ is that it takes the highest specificity in CSS, which we’ll look at in more detail\
  \ shortly.\n\nAnother major downsides to inline CSS is that it can quickly become\
  \ unmanageable. For example, imagine we had 20 paragraphs within an HTML document.\
  \ We would need to apply\n\nthe same style attributes with the same CSS properties\
  \ 20 times to make sure all of our paragraphs look the same.\n\nThis scenario exposes\
  \ 2 issues:\n\n- Our concerns are no longer separated. Our HTML (responsible for\
  \ the content) and CSS (responsible for styling) are now in the same place and tightly\
  \ coupled.\n- We are repeating the same code in a large number of places, making\
  \ it extremely difficult to maintain the code and to keep our styles consistent.\n\
  \nThe benefit to inline CSS is on page load performance. The browser will first\
  \ load the HTML file and then any other files it needs to render the page. With\
  \ the CSS being in the HTML file right away, the browser does not need to wait for\
  \ it to load from a separate location.\n\nLet’s undo the style we just added to\
  \ the h1 and look at a different technique with the same benefits as inline but\
  \ less drawbacks.\n\n#### 1.3.2 内部 CSS\n\nTo resolve the issue of repeating code,\
  \ we can instead add our CSS within an internal style tag. The style tag must be\
  \ placed between the opening and closing head tags. To color all of our heading\
  \ elements crimson we can use this snippet of code (Listing 1.1):\n\n```\nListing\
  \ 1.2\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n...\n<style>\n  h1, h2, h3,\
  \ h4, h5, h6 {\n    color: crimson;\n  }\n</style>\n</head>\n<body>\n...\n</body>\n\
  </html>\n```\n\nThe benefit of this approach is that we are now grouping all of\
  \ our CSS together and it will be applied to the whole HTML document. So in our\
  \ example all headings (h1, h2, h3, h4, h5, h6) within that web page will be in\
  \ crimson as we can observe in Figure 1.5.\n\n## Title of our article (heading 1)\n\

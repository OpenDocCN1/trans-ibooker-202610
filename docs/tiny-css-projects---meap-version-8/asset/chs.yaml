  #F Allows text to wrap around the image\n#G So that the background covers the whole\
  \ page even when window is longer than the content\n\nOur starting point looks as\
  \ follows (Figure 2.2).\n\n## Sonnets by William Shakespeare\n\n### Sonnet 1\nby\
  \ William Shakespeare\n\nFrom fairest creatures we desire increase,\nThat thereby\
  \ beauty's rose might never die,\nBut as the riper should by time decease,\nHis\

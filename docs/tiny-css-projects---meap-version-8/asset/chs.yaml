  \ ligula, eget lacinia odio sem nec elit.\n\n图 4.1 我们想要实现的结果\n\n要创建内容列，我们将使用 CSS\
  \ 多列模块。在此过程中，我们还将研究如何管理列之间的空间，如何使元素跨越多列以及如何控制内容换到新列的位置。\n\n报纸的一部分使用了一组项目，该项目具有用户代理样式表提供的一些默认样式。我们将研究如何使用名为\
  \ CSS Counters 模块的新模块，该模块允许我们自定义列表项计数器（数字和项目符号）的样式。\n\n本章中我们将涵盖的另一个概念是如何设置图像样式。这将包括使用\
  \ filter 属性结合函数来改变图像的外观。我们还将研究损坏图像的解决方案以及如何使它们“优雅地失败”。当我们说“优雅地失败”，有时也称为优雅降级时，我们是在为我们尝试加载的东西出现问题时提供后备方案。\n\
  \n我们的项目代码可以在 GitHub 仓库的第 4 章文件夹中找到：https://github.com/michaelgearon/Tiny-CSS-Projects/tree/main/chapter-04\n\
  \n我们的起始 HTML 由以下元素组成（清单 4.1）。在 body 标签内是报纸的标题和印刷日期，然后是一篇文章。文章有一个标题、作者姓名、引用、2 个小标题、一个列表、一些段落和一张图片。\n\

  \ after the header\n\nYou might wonder why these selectors are called pseudo-class\
  \ and pseudo-elements. Let's look at what pseudo means:\n\n> *not genuine; false\
  \ or pretend*\n\nThis makes sense as technically we are targeting a state or parts\
  \ of an element that might not exist yet, so we are just pretending. Pseudo-classes\
  \ can change as we have seen with styling our own links. We are creating `if` conditions\
  \ that are set in motion by the user's actions. For example, `if` the user `hovers`\
  \ then the browser will show one style, but `if` the user `visited` the link then\
  \ the browser will show another style. Not all pseudo-elements and classes work\
  \ on all HTML elements, throughout this book we will look at where we can use pseudo\
  \ classes and with which HTML elements.\n\n##### 1.6.4 Attribute value selectors\n\
  \nCommonly used for styling links and form elements, the attribute selector styles\
  \ HTML elements with a specified attribute. The attribute value selector looks for\
  \ a specific attribute with the same value.\n\nIn our article we have some content\
  \ that is in Italian. The language of the paragraph is specified using the `lang`\
  \ attribute. (Listing 1.8).\n\n##### Listing 1.11 Italian content\n\n```\n<p lang=\"\
  it\">Questo paragrafo è definito in italiano.</p>\n```\n\nTo hint to users that\
  \ this content is in Italian we will add the Italian flag emoji using CSS. The browser\
  \ will find the language (`lang`) attribute with the value of Italian (`it`) and\
  \ then add an Italian flag emoji `before` it. We will notice in Listing 1.9 that\
  \ we used a pseudo-element `before` as well. We can use multiple types of selectors\
  \ together to target the exact part of the HTML we want to style.\n\n##### Listing\
  \ 1.12 Using multiple types of selectors to add a flag before Italian content\n\n\
  ```\n[lang=\"it\"]::before {\n  content: \"\U0001F1EE\U0001F1F9\"\n}\n```\n\nOnce\
  \ applied, we can see in Figure 1.22 that our Italian content now has an emoji flag\
  \ before it.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_36_0.png)\n\nFigure 1.22\
  \ Italian flag being applied using attribute and pseudo element selectors\n\n#####\
  \ 1.6.5 The universal selector\n\nThe broadest type of selector is the universal\
  \ selector which uses the asterisk symbol (*). This means that any declarations\
  \ made using the universal selector will be applied to all of the HTML elements.\
  \ Sometimes this can be used to reset CSS, but in terms of specificity the universal\
  \ selector has a specificity value of 0, which means it can be overridden easily\
  \ if needed.\n\nIn the case of our example project, we will use a universal selector\
  \ (*) to set the font-family to sans-serif so it will be consistently sans-serif\
  \ throughout the article: * { font-family: sans-serif; }.\n\nOnce applied we can\
  \ see that all of the text in our document uses a sans-serif font regardless of\
  \ their element type (Figure 1.23).\n\n## Title of our article (heading 1)\n\nPosted\

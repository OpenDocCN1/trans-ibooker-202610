  \ headings\n\n## 4.1.5 Inline versus block elements\n\nLet’s continue to make important\
  \ elements stand out from the rest of the content, starting with the publication\
  \ date which is found in our HTML in a <time> element. The time element syntactically\
  \ denotes a specific period in time, and takes an optional datetime attribute which\
  \ translates the date into a machine readable format for search engines. Our time\
  \ element looks as follows: <time datetime=\"2021-09-07\">Tuesday, 5<sup>th</sup>\
  \ September 2021</time>. Figure 4.6 shows the look we want to achieve.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_105_0.png)\n\
  \nFigure 4.6 Styled publication date\n\nStarting with the typography, we center\
  \ the text and use the Oswald font-family, set the font-size to 1.5rem, and make\
  \ the text uppercase and bold. We then change the text size of the \"th\" found\
  \ in the superscript element (<sup>) to a slightly smaller font size and normal\
  \ weight to decrease its prominence.\n\nWe then add the top and bottom borders to\
  \ be 3 pixels thick, solid, very dark gray lines. After adding the borders, we add\
  \ some top and bottom padding so that we can have some breathing room between the\
  \ text and the lines.\n\nThe (date) time element <time> is an inline-level element,\
  \ meaning that it will only take up the exact amount of space it needs for its content\
  \ the same way a span or anchor tag does. In contrast block-level elements (like\
  \ the div, paragraph, or list) place themselves on a new line and take the full\
  \ width of their available space. To achieve the design seen in Figure 4.6 we want\
  \ our <time> element to behave as if it was a block-level element so that the text\
  \ will place itself in the middle of the screen and to make the borders take the\
  \ full width of the page. To change the element’s default behavior we will use the\
  \ display property and give it a value of block. Figures 4.7 and 4.8 show the time\
  \ element before and after adding the display property. In Figure 4.6 (before adding\
  \ the display property) the element is exhibiting its default behavior as an inline-level\
  \ element. In Figure 4.7 (after adding the display property) the element behaves\
  \ like a block-level element, taking the full width of the screen.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_106_0.png)\n\
  \nFigure 4.7 The time element exhibiting inline behavior\n\n![](img/b56145aa9b751926a7aedbd7172bc818_106_1.png)\n\
  \nFigure 4.8 The time element exhibiting block behavior\n\nStyling the publication\
  \ date in this manner will serve 2 purposes, making it stand out, and creating a\
  \ visual divide between the newspaper information (the date and newspaper title)\
  \ and the article itself (everything below the date). The rules we wrote to achieve\
  \ our design are found below in Listing 4.6.\n\n\n\n\n\n# Listing 4.6 Styling the\
  \ publication date\n\n```\ntime {\n  font: 700 1.5rem 'Oswald', sans-serif;    #A\n\
  \  text-align: center;                       #A\n  text-transform: uppercase;  \
  \              #A\n\n  border-top: 3px solid #333333;            #B\n  border-bottom:\
  \ 3px solid #333333;         #B\n  padding: 12px 0;                          #B\n\
  \n  display: block;                           #C\n}\ntime sup {                \
  \                  #D\n  font-size: .875rem;\n  font-weight: normal;\n}\n```\n\n\
  #A Typography\n\n#B Handles the borders and padding\n\n#C Makes the element behave\
  \ like a block-level element\n\n#D Styles the \"th\"\n\n## 4.1.6 Quotes\n\nThe last\
  \ bit of text we want to feature is the blockquote found after the second paragraph\
  \ in the article. Sticking with our theme and like all of the other elements we\
  \ want to make standout, we will make the font size bigger and bolder. We will also\
  \ adjust the line height. Finally we add margin to the element. Isolating an element\
  \ away from other content around it makes it easier to spot. By adding top and bottom\
  \ margin, we add space between it and the paragraphs above and below creating white\
  \ space around the element. By adding left and right margins, we change its alignment,\
  \ effectively indenting it. The added white space creates the isolation we were\
  \ just mentioning.\n\nLet’s also add quotation marks to our blockquote. To add the\
  \ quotation marks at the beginning and end of our quote we could simply go into\
  \ the HTML and add them, or we can do it programmatically via CSS.\n\nThe `quotes`\
  \ property allows us to define custom quotation marks. We can pass it the symbols\
  \ we want to use as our double and single quote glyphs. Not all languages use the\
  \ same symbols. In American English we use \"...\" and `..`, in French however we\
  \ use «...» and ‹...›. Using the quote property we can customize which symbols we\
  \ want to use. If we don’t provide a value for `quotes`, the browser’s default behavior\
  \ is to use what is customary for the language set on the document. This property\
  \ however, only defines the symbols, it does not add them.\n\nTo add them we use\
  \ the `content` property values `open-quote` and `close-quote` in conjunction with\
  \ the `::before` and `::after` pseudo elements as seen in Listing 4.7. The pseudo\
  \ elements allow us to insert content via the `content` property before and after\
  \ the element they are applied to respectively. The `open-quote` and `close-quote`\
  \ keywords represent opening and closing quotation marks as they are defined by\
  \ the `quotes` property. Since we did not add a `quotes` declaration to our `blockquote`\
  \ rule, the browser will use what is conventional for the document’s language which\
  \ we have set to en-US in the language\n\n(lang) attribute on the html tag. The\
  \ value of en-US specifies that our document is written in American English, therefore\
  \ the symbols that the browser renders are \" and \" as we can see in Figure 4.9.\n\
  \n# Listing 4.7 Styling the blockquote\n\n```\nblockquote {\n  font: 1.8rem/1.25\
  \ 'Oswald', sans-serif;\n  margin: 1.5rem 2rem;\n}\nblockquote::before { content:\
  \ open-quote; }\nblockquote::after { content: close-quote; }\n```\n\nWith our quote\
  \ now styled, let's turn our attention to the bulleted list found in the middle\
  \ of the article.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_108_0.png)\n\nFigure\
  \ 4.9 Styled title, heading, subheadings, and blockquote\n\n## 4.2 CSS counters\n\
  \nOur article contains an unordered (bulleted) list. Currently, each list item has\
  \ the default bullet before each list item. We can alter what our bullet looks like\
  \ by using the list-style-type property. By default, we can choose from disc (•),\
  \ circle (○), square (■), and numbers or letters in a number of different languages,\
  \ alphabets, and number formats. But let's say we wanted our bullet to be an emoji,\
  \ specifically the hot beverage emoji (☕). We would have to create a custom list\
  \ style.\n\nTo create our custom list type, we will use the counter-style at-rule.\
  \ We have used at-rules before in chapter 3 when we created keyframes. In this case,\
  \ instead of defining how an animation will behave, we will define how our list\
  \ looks and behaves. The at-rule is called counter style because it specifically\
  \ addresses the built counting mechanism for list items in CSS. Under the covers\
  \ regardless of the list being ordered or unordered, the browser keeps track of\
  \ the position of the item in the list. It counts the items.\n\nLike with keyframes\
  \ (which we named in order to reference them inside of our animation property) we\
  \ will name our counter-style so that we can reference it using the list-style property\
  \ and apply it to our list. Let's name our list-style \"emoji\". Our at-rule will\
  \ therefore look as follows: @counter-style emoji { }. Next, we will define the\
  \ behavior our list-style\n\nneeds to have inside of our at-rule. We will use three\
  \ properties: `symbols`, `system`, and `suffix`.\n\n### 4.2.1 Symbols\n\nThe symbols\
  \ property defines what will be used to create the bullet style. To define our emoji\
  \ as the symbol we want to use we can either use the emoji directly or use its unicode\
  \ value. Unicode is a character encoding standard that specifies how a 16 bit binary\
  \ value is represented as a string. In other words, it's the code representation\
  \ of our emoji. The actual emoji image is determined by the operating system and\
  \ browser which is why we see variations in how emojis look between iOS and Android\
  \ for example. The unicode value tells the machine what to render. We use look-up\
  \ tables such as the one found at https://unicode.org/emoji/charts/full-emoji-list.html\
  \ to find this value for our emoji. \U0001FAD6 is listed as having the following\
  \ code: U+2615. To tell our CSS that we are using a unicode value we will replace\
  \ the U+ with a backslash (\\). Using the unicode value our declaration will therefore\
  \ look as follows: `symbols: \"\\2615\"`. If we just use the emoji, our declaration\
  \ will be `symbols: \U0001FAD6;`\n\nNext we need to define our system.\n\n### 4.2.2\
  \ System\n\nWe are styling a list. Regardless of type (ordered or unordered), under\
  \ the covers, the browser keeps track of the list item it is styling based on its\
  \ position inside the list. The first item's integer value is 1, the second 2 and\
  \ so on. What the `system` property value does is define the algorithm used to convert\
  \ that integer value into the visual representation we see on the screen.\n\nWe\
  \ are going to use the `cyclic` value. Earlier we only provided one emoji in our\
  \ `symbols` declaration, but we could have included multiple different emojis using\
  \ a space delimited list. A `cyclic` value tells the browser to loop through these\
  \ values and when it runs out, to start back at the beginning. Since we only have\
  \ one value, it will apply the \U0001FAD6 to the first list item and run out of\
  \ symbols. Having run out getting to the second list item, it will start back at\
  \ the beginning of the list applying the \U0001FAD6 once again but to the second\
  \ list item this time. Then it will run again moving on to the third list item and\
  \ the cycle continues.\n\nFinally we will set a suffix.\n\n### 4.2.3 Suffix\n\n\
  The `suffix` property defines what comes between the bullet (our emoji) and the\
  \ contents of the list item. By default it's a period. We want to replace the period\
  \ with plain white space between our emoji and list item content. We will therefore\
  \ set our suffix property value to \" \" (a blank space).\n\n### 4.2.4 Putting it\
  \ all together\n\nWith our counter-style defined, we can now apply it to our list.\
  \ Remember that we named the counter-style rule “emoji”; we will apply the name\
  \ as the list-style property value for our list as seen in listing 4.8.\n\n# Listing\
  \ 4.8 Styling the blockquote\n\n```\n@counter-style emoji {  #A\n  symbols: \"\\\
  2615\";  #B\n  system: cyclic;\n  suffix: \" \";\n}\n\narticle ul {\n  list-style:\
  \ emoji;    #C\n}\n```\n\n#A at-rule defining the custom list-style's behavior\n\
  #B ☕\n#C Applying the custom list-style to the article's lists\n\nFigure 4.10 shows\
  \ our newly styled list.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_110_0.png)\n\
  \nFigure 4.10 List styled using ☕ as counters\n\nLet’s continue going down the page\
  \ and style the image next.\n\n## 4.3 Styling images\n\nHistorically, newspapers\
  \ were printed in black and white, colored ink in newsprint is a fairly new thing\
  \ when we consider the history of print. To give our design a bit of a retro vibe,\
  \ we will therefore make our image grayscale. We will first look at how to alter\
  \ our image using filters. Unlike print, on the web we need to worry about resources\
  \ not loading or links being\n\n\n\nbroken, we will therefore also look at how to\
  \ make the image fail gracefully should it fail to load. Finally we will add a caption\
  \ to accompany the image.\n\n## 4.3.1 The filter property\n\nLike photo editors\
  \ or on social media websites like Instagram we can apply filters to images with\
  \ CSS. We can alter colors, blur, and add drop shadows. Figure 4.11 shows examples\
  \ of some of the things we can do to our images using filters in CSS. Checkout the\
  \ code sample in codepen to see it in action: https://codepen.io/michaelgearon/pen/porovxJ.\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_111_0.png)\n\nFigure 4.11 Examples of\
  \ images altered using the filter property\n\nIf we think about photography (before\
  \ the digital era), when we used film and had to go to a shop and have it developed,\
  \ we applied filters by adding a translucent disk over our lens, which altered the\
  \ light coming into the camera box and onto the film. By altering the nature of\
  \ the light, we altered the image being produced. For example, if we use a red filter\
  \ while taking a picture, only the red colored wavelength is allowed through, therefore\
  \ our picture would be tinted red. Polarized sunglasses are another example of a\
  \ filter which alters the light coming through a lens.\n\nWe can still use physical\
  \ filters with digital cameras. However, in many cases, filters are applied digitally\
  \ after the picture has already been taken.\n\nIn CSS to apply a filter to the image,\
  \ we use the `filter` property and then a function which defines the behavior we\
  \ want the filter to have. A list of the available functions can be found at https://developer.mozilla.org/en-US/docs/Web/CSS/filter#functions.\
  \ We will use the `grayscale()` function to make our picture appear to be a black\
  \ and white photo.\n\nThe grayscale() function takes a percentage which represents\
  \ how much we want to reduce the amount of color in the image. We want to remove\
  \ all of the color, so we will pass\n\nin a value of 100%. Our rule therefore looks\
  \ as follows: `img { filter: grayscale(100%) }`. Figure 4.12 shows the filter applied\
  \ to our image.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_112_0.png)\n\nFigure\
  \ 4.12 Grayscale Image\n\nOne consideration to make before using filters is the\
  \ impact on website performance. Some of the filter functions like grayscale are\
  \ relatively simple for the browser to process, but functions like drop-shadow and\
  \ blur can be resource-intensive. If we find that we are applying many filters to\
  \ a large number of images, it is worth considering the impact of the filters on\
  \ the overall page performance and whether we should be preprocessing the image\
  \ ahead of time rather than applying the change via CSS.\n\n## 4.3.2 Handling broken\
  \ images\n\nEven with the most thorough of diligence and best testing practices,\
  \ broken image links can happen. Let’s add some fallbacks in order to ensure that\
  \ should our image fail to load (regardless of the reason) we maintain a positive\
  \ experience for our users.\n\nFirst let’s purposely break our link. In the HTML\
  \ we will replace the path to the image to an image file that does not exist in\
  \ our project like so:\n\n```\n<img src=\"./my-broken-image.jpg\" alt=\"my broken\
  \ link\" />\n```\n\nThe image will not display as broken as seen in figure 4.13.\n\
  \n### SUBHEADING\n\nmy broken link\n\nPraesent commodo cursus magna, vel scelerisque\
  \ nisl consectetur et. Aenean eu leo quam. Pellentesque ornare se non mi porta gravida\
  \ at eget metus. Aenean lacinia bibendum nulla sed consectetur. Integer posuere\
  \ erat a ante v quam. Pellentesque ornare sem lacinia quam venenatis vestibulum.\
  \ Integer posuere erat a ante venenatis danibus\n\nFigure 4.13 Broken link with\
  \ alt text\n\nWhen the link is broken, we will hide the image. There won’t be anything\
  \ there, but it will be less unsightly than the broken image icon. Because there\
  \ is no way to detect that an image is broken in CSS, we will need to use a little\
  \ bit of JavaScript to help us know when to hide the image. We will use the onerror\
  \ JavaScript event handler to trigger a change in styles as follows: <img src=\"\
  ...\" alt=\"...\" onerror=\"this.style.display='none'\" />. The bit of code that\
  \ is of interest to us here is the onerror attribute. When an error occurs, the\
  \ JavaScript inside of the onerror attribute triggers and set’s the image’s display\

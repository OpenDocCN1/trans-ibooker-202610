  \n## 10.1 Creating backgrounds using radial-gradient\n\nLet’s start with some base\
  \ typography styles, some colors, and the elements around the form such as the header,\
  \ container holding our form, and most notably the background. As we can see in\
  \ figure 10.2, our background has a dotted grid pattern. It is not a premade image,\
  \ but a gradient that has been created and then repeated.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_252_0.png)\n\
  \nFigure 10.2 Dotted Background\n\nWe present this technique now because we will\
  \ use this technique again later to style the arrow on the drop down. Some elements,\
  \ <select> being one of them, cannot have ::before or ::after pseudo elements added\
  \ to them. The select element, like the circles of the radio button, or the checkbox\
  \ have very limited styling options. This is related to the fact that they rely\
  \ on the underlying operating system for styles and controls. This is very visible\
  \ on mobile when a number field automatically opens the number keypad instead of\
  \ the standard keyboard for example, same for calendar or time controls. Furthermore,\
  \ when looking at the same website or application on an Iphone versus Android phone,\
  \ the controls will look drastically different. As a result however, the browser\
  \ will only allow for a limited number of properties to be applied to the control.\
  \ Because of our limited ability to style controls, as developers, we have found\
  \ work arounds, using properties we can affect, the background property is often\
  \ one that is editable.\n\nAlthough we could simply use an image that we repeat\
  \ across the screen to create our gradient, images have their drawbacks in terms\
  \ of flexibility. For each shape or color we would have to import a new image. We\
  \ would also need to acquire or create said images. Instead, we can create simple\
  \ shapes on the fly using a gradient. Although the background is polka dotted and\
  \ not a gradient, we will be using the radial-gradient function to create the dots.\n\
  \n### 10.1.1 Setting the color scheme using custom properties\n\nBefore we look\
  \ at the gradient, let’s first establish our color palette. We add them as custom\
  \ properties on the html tag so that we do not have to look up the color codes every\
  \ time we want to color something and to ensure consistency in our application.\
  \ An added benefit to using custom properties for our colors is that should we want\
  \ to add multiple themes to our web page in the future, it could be accomplished\
  \ with minimal work.\n\nWe also include our font family in our custom properties\
  \ because we will need to apply it to several fields as most fields do not automatically\
  \ inherit the font-family set on their parent or ancestors. Listing 10.2 shows our\
  \ color palette and font choice.\n\n## Listing 10.2 Colors and Font Family Custom\
  \ Properties\n\n```\nhtml {\n  --color: #333333;              #A\n  --font-family:\
  \ sans-serif;     #A\n  font-size: 12pt;               #A\n  color: var(--color);\
  \           #A\n  font-family: var(--font-family); #A\n\n  --background: #fafafa;\
  \         #B\n  --background-card: #fff5dc;    #C\n  --accent: #086788;        \
  \     #D\n  --accent-contrast: #ffffff;    #E\n  --error: #dd1c1aff;           \
  \ #F\n  --border: #ddd;                #G\n  --hover: #bee0eb;              #H\n\
  \n  margin: 0;\n  padding: 0;\n}\n```\n\n#A Setting our text default size, font\
  \ family, and setting the color for the font to a dark gray almost black.\n#B Page\
  \ background color, light gray almost white\n#C Background color for the form container,\
  \ pale yellow\n#D Our accent color, used for call to actions and highlighting elements\
  \ we want to draw the user’s attention to. Blue\n#E When the accent color is used\
  \ as background color, text will be set to the contrast color. White\n#F Used for\
  \ errors. Red\n#G Used anytime we have a default border color to set, gray\n#H Used\
  \ for hover effects, very pale blue\n\nOur page, seen in Figure 10.3, looks very\
  \ similar to how it looked before except for our text which is now a dark gray rather\
  \ than black and uses my system’s default sans-serif font. Also of note, we notice\
  \ that the text inside of the message textarea does not look the same as the rest\
  \ of the page. It is a different font family. An issue we will need to address when\
  \ we style it later in this chapter.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_253_0.png)\n\
  \nFigure 10.3 Updated Font Style and Color\n\n## 10.1.2 Manipulating a radial gradient\n\
  \nWith the colors set, we can start styling our background which we will apply to\
  \ the <body>.\n\nIt is possible to set both a background color and a background\
  \ image on an element. If instead of using the background property we use individually\
  \ set values for background-color and background-image, the browser will render\
  \ both. This is particularly useful when we have images that include transparency\
  \ or that do not cover the entire element they are applied to. Using our custom\
  \ property we set in the previous section, we are going to give the body a background-color\
  \ of var(--background).\n\nNext we will create our gradient. radial-gradient, as\
  \ its name implies, manipulates colors circularly from the center of the element\
  \ outwards. The radial-gradient() function allows us to dictate where the center\
  \ point of the gradient will be located and then set an arbitrary number of colors\
  \ and values for when the color should be applied relative to the center point as\
  \ illustrated in the diagram found in Figure 10.4. We can move the center point\
  \ both vertically and horizontally.\n\nThe values for color change can be either\
  \ relative units (such as percentages) or fixed units (such as pixels). When no\
  \ change value is passed, the browser will space the colors equally across the image\
  \ (First example in Figure 10.4). If we do set a position at which the color should\
  \ change and 2 subsequent values are set to change at the same distance from center,\
  \ such as in the third example of Figure 10.4, the change will be immediate and\
  \ abrupt. If the values are not identical the colors will fade from one to the other\
  \ in the typical way in which we think of gradients such as in the second example\
  \ of Figure 10.4.\n\n\n\n\n\n```\nbackground: radial-gradient(black, white, black,\
  \ white, black)\n```\n\n```\nbackground: radial-gradient(circle at 20%, black, white);\n\
  ```\n\n```\nbackground: radial-gradient(black, 30%, white, 30%, white);\n```\n\n\
  ```\nbackground-image: radial-gradient(black, 30%, white, 30%, white);\nbackground-size:\
  \ 25px 25px;\n```\n\n![](img/b56145aa9b751926a7aedbd7172bc818_255_0.png)\n\n![](img/b56145aa9b751926a7aedbd7172bc818_255_1.png)\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_255_2.png)\n\n![](img/b56145aa9b751926a7aedbd7172bc818_255_3.png)\n\
  \n从中心开始以相等间隔从黑色变为白色\n\n中心垂直居中但距离边缘 20% 并从黑色渐变到白色\n\n创建一个从开始为黑色直到圆的 30% 并立即立即切换到白色，从而形成一个圆\n\
  \n与之前相同，但背景被赋予了大小并允许重复，从而创建了波尔卡圆点背景。\n\n## Figure 10.4 Radial Gradient²\n\n我们将创建一个\
  \ 15px x 15px 的图像，其中心有一个非常小的点，我们将让它在 body 上重复。默认情况下，使用背景图像时（渐变也不例外），如果图像小于容器，浏览器将尽可能多次重复该图像（垂直和水平方向）以填充容器，除非使用\
  \ background-repeat 属性另有明确指定。因为我们创建的图像是一个 15px 的正方形，而我们的页面比它宽得多且高得多，所以背景图像将自动平铺或重复以填充整个元素。\n\
  \n我们将保持渐变从中心开始，从那里应用我们的强调色。在 0.75 像素后，我们将立即切换为透明，以便我们的背景色显示出来。如果我们在 7.5 像素处（15 的一半）从强调色切换到透明，我们的圆将恰好为\
  \ 15 像素直径。由于我们在 0.75 像素处进行切换，我们的圆将为 1.5 像素直径。因此，我们的 background-color 属性值将如下所示：radial-gradient(var(--accent)\
  \ .75px, transparent .75px);\n\n除了将背景添加到 body 外，我们还将边距设置为 0 并添加 2rem 的内边距，以防止内容一直延伸到屏幕边缘。列表\
  \ 10.3 显示了迄今为止应用于 body 的样式。\n\n## Listing 10.3 Colors and Font Family Custom Properties\n\
  \n```\nbody {\n  background-color: var(--background);\n  background-image: radial-gradient(var(--accent)\
  \ .75px, transparent .75px);  #A\n```\n\n² https://codepen.io/martine-dowden/pen/poajdeQ\n\
  \n```\nbackground-size: 15px 15px;\nmargin: 0;\npadding: 2rem;\n}\n#A\n```\n\n#A\
  \ 用于在背景中创建点网格的属性\n\n应用页面背景后，如图 10.5 所示，我们现在将设置 <main> 标签的样式，它是 header 和表单周围的容器。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_256_0.png)\n\nFigure 10.5 Dot Grid Background\
  \ Created using Radial Gradient\n\n## 10.1.3 Emphasizing the form\n\n通过给 main 一个更亮的纯色背景和一些阴影，我们使其脱颖而出，成为页面的视觉焦点。添加投影阴影将进一步强调其与背景的差异。阴影不必特别强烈，我们将应用的阴影相当微妙，但仍将极大地突出内容，使其成为需要关注的元素。\n\
  \n我们还将限制元素可以达到的最大宽度为 600 像素。查看图 10.4 我们可以看到诸如围绕单选按钮的 fieldset 等块级元素会尽可能扩展到屏幕宽度。就像文本一样，如果控件太宽，眼动追踪会变得困难，用户在尝试填写表单时可能会迷失位置。设置最大宽度可以防止此问题。\n\
  \n然后我们将通过将左右边距设置为 auto 来居中该元素。我们还将垂直边距设置为上下各 1rem，以使其远离屏幕顶部和底部的边缘。\n\n用于设置表单容器样式的属性和值在列表\
  \ 10.4 中找到。\n\n## Listing 10.4 Form Container Styles\n\n```\nmain {\n  background:\
  \ var(--background-card);\n  padding: 2rem;\n  max-width: 600px;\n  margin: 1rem\
  \ auto;\n  box-shadow: -2px 2px 15px 0 var(--border);\n}\n```\n\n我们给容器设置了背景，但现在在图\
  \ 10.6 中可以看到我们的内容紧贴其边缘。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_257_0.png)\n\
  \nFigure 10.6 Form Container Background\n\n为了防止内容在容器内过于紧凑，我们将在容器上添加 2rem 的内边距。\n\
  \n我们还将使我们的标题（“Contact”）更突出，通过应用我们的强调色，然后我们就可以开始设置表单元素的样式了。容器和标题的最后润色显示在列表 10.5 中。\n\
  \n## Listing 10.5 Finishing Touches to the Container and Header Styles\n\n```\n\
  main {\n  ...\n  padding: 2rem; #A\n}\n```\n\n```\nh1 { color: var(--accent); }\
  \ #B\n```\n\n#A 向之前创建的 main 规则添加内边距\n#B 通过引用我们在 body 上设置的变量，使标题文本变为蓝色（我们的强调色）\n\n\
  现在我们的配色方案、背景和页面布局已设置完毕（图 10.7），我们现在准备开始设置表单本身中的元素样式。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_258_0.png)\n\
  \nFigure 10.7 Form Container Background with padding and styled header\n\n## 10.2\
  \ Resetting fieldset styles\n\nFieldset 专门用于对控件和标签进行分组。单选组是它们的完美用例，因为它允许我们非常有效地和明确地将它们标识为属于一起。它还为我们提供了一种现成的方式通过\
  \ legend 对组进行标记。从风格上讲，我认为我们可以同意它们相当难看。\n\n让我们重置该组的样式，使其在视觉上消失。程序上，我们希望保留它，因为它对辅助技术用户有帮助，但在视觉上，我们将使其融合得更多。\n\
  \n为了使 fieldset 消失，我们需要重置以下属性：\n\n- border\n- margin\n- padding\n- min-width\n\n\
  列表 10.6 显示了我们的规则\n\n## Listing 10.6 Resetting Fieldset Styles\n\n```\nfieldset {\n\
  \  border: 0;\n  padding: 0;\n  min-width: 0;\n  margin: 0;\n}\n```\n\n我们的 fielset\
  \ 现在不再可见，如图 10.8 所示，让我们把注意力转向我们的输入字段。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_259_0.png)\n\
  \nFigure 10.8 Form Container Background\n\n## 10.3 Styling input fields\n\n我们在表单中有\
  \ 4 种类型的输入字段，分解在表 10.1 中\n\n## Table 10.1 Input field types in the form\n\n| Field\
  \ Label | Type |\n|---|---|\n| Your Name | text |\n| Your Email Address | email\
  \ |\n| Yes\nNo | radio |\n| Subscribe to our newsletter | checkbox |\n\nHTML 还有更多类型的字段，包括\
  \ date、time、number、color 等，每个都有其自己的语义含义和自己的样式考虑。上面选择的采样是因为这些是当今网络上非常常用的类型。\n\n它们的未样式化外观决定了我们将如何设置它们的样式。例如，我们将对单选按钮和复选框与文本输入进行非常不同的处理，但我们可以跨多种类型重用代码。我们将按其未样式化控件的外观对它们进行分组，因此我们将同时处理\
  \ type text 和 email，然后再处理 radio 和 checkbox。让我们从文本和电子邮件输入开始。\n\n### 10.3.1 Styling\
  \ text and email inputs\n\n我们首先要弄清楚如何仅选择文本和电子邮件输入字段，或者更确切地说，选择所有不是单选或复选框的输入字段。一个解决方案是在我们想要处理的每个输入上添加一个类。这在维护上相当困难，尤其是在表单繁重的应用程序或复杂表单中会变得非常嘈杂。因此，我们将使用伪类\
  \ :not()³ 结合类型选择器 selector[type=\"value\"]。\n\n:not() 伪类允许我们选择不符合特定条件的元素。在我们的例子中，我们想要选择所有类型不是\
  \ radio 或 checkbox 的输入字段。因此我们的选择器将是 input:not([type=\"radio\"], [type=\"checkbox\"\
  ])。\n\n我们现在可以开始设置输入字段的样式。我们可以从图 10.8 中看到我们的输入具有白色背景。我们将把它改为与我们在 body 上使用的相同背景颜色。我们还可以注意到字体大小小于我们在\
  \ body 上设置的 12pt 大小。输入字段不会继承字体样式。小字体大小在移动设备上难以阅读，对许多用户来说，尤其是幼儿和老年人更是如此。如果我们希望我们的表单在广泛的人群和设备上易于使用，我们将需要增加它。我们因此将其设置为\
  \ 1rem 以匹配我们应用程序的其余部分。如前所述，输入默认情况下不会继承字体样式，我们因此还将显式设置 color 为 inherit。inherit⁴ 是一个非常方便的属性值。它允许我们在继承默认情况下不发生时强制从父级继承属性值。\n\
  \n\n\n\n\n接下来，我们将为输入框添加一些内边距、自定义边框和边框圆角。在这种特定情况下，这些样式是为了美观目的。大多数应用程序都有一个整体的风格或外观。我们选择应用于字段的样式应与我们应用程序整体主题保持一致。这样做有助于表单与页面融合，看起来像是属于这里的一部分。从营销角度来看，保持与主题一致也有助于强化品牌认知。对于本项目，我们选择了非常圆润的主题，因此我们将为字段赋予夸张的圆角。\n\
  \n最后，我们还将为字段设置 `display` 值为 `block`（输入框默认的 `display` 属性值为 `inline`），并使其占据容器的全宽。我们将使用\
  \ `calc()` 函数来计算容器的全宽（100%）减去我们已添加到输入字段的内边距（每侧 2rem，总宽度为 4rem）。还记得盒模型吗？内边距会增加元素的宽度。因此，我们必须从宽度中减去左右内边距的总量。宽度为\
  \ 100% 等于可用容器宽度的 100%，然后内边距值将被添加。如果我们不减去内边距，我们的宽度将比分配的空间大 4rem。\n\n我们的代码如下所示（列表\
  \ 10.7）。\n\n## 列表 10.7 样式化非单选或复选框类型的输入字段\n\n```\ninput:not([type=\"radio\"], [type=\"\
  checkbox\"]) {\n  background: var(--background);\n  font-size: 1rem;\n  color: inherit;\n\
  \  border: solid 1px var(--border);\n  border-radius: 32px;\n  padding: 1rem 2rem;\n\
  \n  display: block;\n  width: calc(100% - 4rem); /*A\n}\n```\n\n### A 计算元素的宽度应为多少\n\
  \n我们为文本和电子邮件输入设置了一些基本样式，如图 10.9 所示。我们现在开始为表单控件开发主题。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_262_0.png)\n\
  \n图 10.9 文本和电子邮件输入样式\n\n## 10.3.2 使选择框和文本域与输入样式匹配\n\n为了确保我们在控件上的外观和感觉保持一致，让我们将应用于输入字段的相同样式应用于文本域和选择元素。我们不会创建新规则，也不会复制粘贴代码。为了保持样式的一致性和可维护性，我们将像这样将\
  \ `select` 和 `textarea` 作为选择器添加到我们已编写的规则中：\n\n```\ninput:not([type=\"radio\"], [type=\"\
  checkbox\"]), textarea, select { ... }.\n```\n\n应用后，我们注意到两个字段仍然需要一些额外的样式。让我们先关注文本域。在图\
  \ 10.10 中我们可以看到，文本域的字体类型是错误的。就像我们之前继承颜色一样，我们还需要继承 `font-family` 值。虽然非常圆润的圆角在较细的输入字段上效果很好，但在文本域上由于其高度看起来有点不协调，因此我们将仅对文本域减小\
  \ `border-radius`。\n\n图 10.10 显示了我们更新后的文本域。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_263_0.png)\n\
  \n图 10.10 更新后的文本域样式\n\n默认情况下，在网页上，用户可以通过点击并拖动右下角来在宽度和高度上调整文本域大小。在我们的布局中，增加或减少高度不会导致任何布局问题，但宽度则有问题，如图\
  \ 10.11 所示。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_264_0.png)\n\n图 10.11 文本域调整大小问题\n\
  \n文本域以不雅观的方式延伸到容器之外。当我们垂直调整大小时，容器会适当调整大小，但水平方向则不是。通过将文本域的 `resize` 属性值从默认的 `both`\
  \ 改为 `vertical`，我们可以限制用户调整文本域大小的能力。他们仍然可以更改其高度，但不能更改宽度。视觉上文本框看起来仍然相同，并且右下角仍有用于调整大小的控件，如图\
  \ 10.12 所示。当用户与调整大小控件交互时，他们将被限制为只能垂直调整大小。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_264_1.png)\n\
  \n图 10.12 文本域仅垂直调整大小\n\n6 https://developer.mozilla.org/en-US/docs/Web/CSS/resize\n\
  \n对我们基本样式的编辑以及专门为文本域添加的额外内容如下所示，见列表 10.8。\n\n## 列表 10.8 文本域的更新样式\n\n```\ninput:not([type=\"\
  radio\"], [type=\"checkbox\"]),\ntextarea,\nselect {\n  background: var(--background);\n\
  \  font-size: 1rem;\n  font-family: inherit;\n  color: inherit;\n  border: solid\
  \ 1px var(--border);\n  border-radius: 32px;\n  padding: 1rem 2rem;\n\n  display:\
  \ block;\n  width: calc(100% - 4rem);\n}\n\ntextarea {\n  border-radius: 4px;\n\
  \  resize: vertical;\n}\n```\n\n### A 将 textarea 和 select 添加到我们的样式中\n### B 使控件从父容器继承字体大小\n\
  ### C 为文本域添加了特定于边框半径和调整大小的规则\n\n我们仍然需要解决 `select` 的问题，但这比我们为文本域所做的编辑要复杂一些，所以让我们先完成输入字段的样式，然后再回过头来完成\
  \ `select` 控件的样式。\n\n## 10.3.3 样式化单选输入和复选框\n\n本章前面我们谈到过一些表单控件 notoriously 难以样式化，因为我们可以应用于它们的样式选项非常有限。单选按钮和复选框就完全属于这一类。直到最近，还没有任何属性会影响单选圆圈或复选框方块。我们唯一的选项是完全用自己的样式替换原生控件样式。\n\
  \n我们现在有能力更改原生控件的颜色。`accent-color` 属性允许我们用我们指定的颜色替换用户代理选择的颜色。将 `accent-color: var(--accent);`\
  \ 应用于我们的复选框和单选按钮将产生以下结果（图 10.13）。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_266_0.png)\n\
  \n图 10.13 将强调色应用于单选按钮和复选框\n\n元素已采用我们设置的强调色，而不是之前使用的浅蓝色默认颜色。然而，如果我增加应用程序的字体大小，我们在图\
  \ 10.14 中看到控件不会随之增大。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_266_1.png)\n\n\
  图 10.14 增加单选输入和复选框的字体大小\n\n虽然我们可以更改元素的颜色（这是一种快速高效地将控件样式调整以更好地适应我们样式的方法），如果我们希望控件随字体大小缩放，或进行任何进一步的自定义，我们将需要用自己的样式替换控件样式。\n\
  \n由于我们希望保留控件的功能并仅替换其视觉方面，因此我们的 HTML 保持不变。我们将隐藏浏览器提供的原生控件，并用我们自己的自定义样式替换其视觉部分。为了隐藏原生控件，我们将使用\
  \ `appearance` 属性并将其值设为 `none`。此属性允许我们控制控件的原生外观。通过将其属性设置为 `none`，我们表示不希望它显示操作系统提供的样式。我们还将\
  \ `background-color` 设置为我们自己的背景颜色，因为某些操作系统会为控件包含背景，最后重置我们的边距。完成的重置如列表 10.9 所示。\n\
  \n## 列表 10.9 单选和复选框重置\n\n```\ninput[type=\"radio\"],\ninput[type=\"checkbox\"] {\n\
  \  appearance: none;\n\n```\n```\nbackground-color: var(--background);\nmargin:\
  \ 0;\n}\n```\n\n### A 样式仅应用于类型为单选或复选框的输入\n\n图 10.15 显示我们的单选输入和按钮现在已经消失。因此我们可以开始为控件创建自己的样式。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_267_0.png)\n\n图 10.15 重置单选和复选框样式\n\n\
  我们想要做的是创建一个方框。对于单选输入，我们将为该方框赋予 `border-radius` 以使其变圆，但无论是复选框还是单选，核心都是需要一个方框。因此我们将通过为输入赋予\
  \ `1.25em` 的高度和宽度来创建它。我们使用 `em` 单位，因为它们是父级字体大小的百分比。通过将高度和宽度设置为 `1.25rem`，我们将它们设置为等于父级字体大小的\
  \ 1.25 倍。如果我们的标签，即输入的容器和父级，字体大小为 16 像素，那么我们的方框尺寸将为 20 像素宽 x 20 像素高（16 × 1.25 = 20）。\n\
  \n我们将为方框添加一个边框，该边框继承标签的字体颜色。我知道这听起来有点奇怪，我们如何让边框颜色从字体颜色继承？我们将使用关键字值 `currentColor`，它允许属性在原本不能的情况下专门继承字体颜色。我们将边框颜色设置为\
  \ `currentColor`，这将使边框颜色与字体颜色匹配。为了设置边框宽度，我们也将使用 `em`，与高度和宽度相同，这将使边框宽度也能随单选按钮的大小缩放。\n\
  \n由于输入默认是内联元素，为了使高度和宽度生效，我们还需要更改 `display` 属性。我们将将其设置为 `inline-grid`，因为当我们处理输入的选中状态时，我们需要居中内部圆盘或复选标记。Grid\
  \ 允许我们使用 `place-content` 属性轻松做到这一点。\n\n`inline-grid` 与 `grid` 的关系就像 `inline-block`\
  \ 与 `block` 的关系一样。`inline-block` 具有 `block` 的所有相同属性，但将其自身内联放置在页面流中。`inline-grid`\
  \ 以相同的方式工作。我们可以使用网格的所有功能，但元素将在页面流中内联放置，而不是在前一个内容下方。对于我们的目的，这意味着\n\n9 https://developer.mozilla.org/en-US/docs/Web/CSS/color_value#currentcolor_keyword\n\
  10 https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Grid_Layout/Basic_Concepts_of_Grid_Layout\n\
  \n\n\n\n\ninput 将自身放置在文本标签中，而无需我们围绕包含单选输入或复选框的标签创建特殊规则。\n\n接下来我们为元素添加右侧的外边距，这样标签文本就不会紧贴其边缘。\n\
  \n最后我们需要处理 border-radius。这里复选框和输入字段有所不同，因为复选框是正方形而单选是圆形。由于我们的字段边缘非常圆润，我们将为复选框添加一个小的\
  \ border-radius（4px）。为了使单选呈圆形，我们将添加 50% 的 border-radius，这将使框看起来呈圆形。\n\n因此，我们的复选框和单选输入的规则如下所示（列表\
  \ 10.10）：\n\n## Listing 10.10 Radio and Checkbox Styled\n\n```\ninput[type=\"radio\"\
  ],\ninput[type=\"checkbox\"] {\n...\n  display: inline-grid;\n  place-content: center;\
  \ #A\n  width: 1.25em;\n  height: 1.25em;\n  border: 0.1875em solid currentColor;\
  \ #B\n  margin: 0 .5rem 0 0;\n}\n\ninput[type=\"radio\"] { border-radius: 50%; }\n\
  \ninput[type=\"checkbox\"] { border-radius: 4px; }\n```\n\n#A 将在我们创建它们后自动将内部圆盘和复选框居中放置在元素内部\n\
  #B 我们也以 em 为单位设置边框宽度，以便边框的厚度随字体大小缩放\n\n我们的未选中输入已设置样式，现在我们需要处理选中后的样式。我们可以在图 10.16\
  \ 中看到，当前选中和未选中的元素看起来完全相同。现在我们需要处理选中样式。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_268_0.png)\n\
  \n## Figure 10.16 Unchecked Radio and Checkbox Styles\n\n## 10.3.4 :where() and\
  \ :is() pseudo-classes\n\n在此，我们将介绍两个伪类，它们将帮助我们保持代码简洁和精炼 :is() ¹¹ 和 :where() ¹²。两者工作原理相似，都接受一个选择器列表，如果列表中的任何选择器匹配，则应用规则。在编写长选择器列表时非常有帮助。不要写：\n\
  \n```\ninput:focus, textarea:focus, select:focus, button:focus { ... }\n```\n\n\
  我们可以使用 :where 或 :is 并写出等价的写法，如下所示：\n\n```\n:where(input, textarea, select, button):focus\
  \ { ... }\n```\n\n:is() 伪类将以相同方式应用。:is() 和 :where() 之间的区别在于它们的特异性级别。:where() 特异性最低，因此易于覆盖。而\
  \ :is() 则采用列表中最具体的选择器的特异性值。\n\n> NOTE Specify 为了解释特异性是如何计算的，请查看第 1 章中的 Specificity\
  \ 部分。我们将在本章后面更深入地介绍使用 :where() 和 :is() 时如何计算特异性。\n\n因此在使用 :is() 时必须谨慎，因为如果我们的选择器列表中包含\
  \ id 选择器（id 选择器特异性最高），我们可能会快速创建出非常难以甚至不可能覆盖的规则。\n\n我们将使用 :where() 和 :is() 结合其他伪类，如\
  \ :checked、:hover、:focus 以及 ::before 伪元素，来完成复选框和单选输入的样式设置。\n\n## 10.3.5 Styling\
  \ checked radio and checkbox inputs\n\n为了添加选中单选的内部圆盘和复选框的复选标记，我们将采用与未选中样式时相同的操作方法，即创建同时适用于两者的基础样式，然后在样式分歧时分别对每个元素进行最终润色。与之前一样，我们将首先创建一个框。然后将该框放置在现有样式的中心，最后将其塑形为圆盘或复选框。\n\
  \n为了创建要放置在当前元素内部的第二个框，我们将使用 ::before 伪元素。这正是上一节中介绍的 :where() 伪类发挥作用的地方。我们将使用它来选择两种输入类型，然后添加\
  \ ::before 伪元素。因此我们的选择器将如下所示：:where(input[type=\"radio\"], input[type=\"checkbox\"\
  ] )::before { ... }。\n\n现在我们可以创建我们的框。我们的内容为空，因此我们将 content 属性值设为 \"\"，我们将 display\
  \ 设为 block，以便可以分配宽度和高度。\n\n当我们之前创建外部框时，我们将其高度和宽度设为 1em。我们使用 em 单位，以便控件大小相对于文本大小缩放。我们在这里也将这样做。我们希望单选内部圆盘和复选标记比其容器小，因此我们将高度和宽度设为\
  \ 0.625em。假设应用于输入的字体大小为 16px，我们的框大小以像素计将为 10px × 10px（16 × 0.625 = 10）。\n\n我们不需要对内部框进行任何定位，因为还记得我们将输入的\
  \ display 设为 inline-grid，然后添加了 place-content 属性并赋值为 center（列表 10.11）吗？网格布局将自动把内部框放置在输入的中心。\n\
  \n## Listing 10.11 Center the Inner Box\n\n```\ninput[type=\"radio\"], input[type=\"\
  checkbox\"] {\n  ...\n  display: inline-grid;  #A\n  place-content: center;  #A\n\
  \  ...\n}\n```\n\n#A 负责定位内部框的两个属性\n\n到目前为止我们为创建内部框所组合的代码显示在列表 10.12 中。\n\n## Listing\
  \ 10.12 Inner Box\n\n```\n:where(input[type=\"radio\"], input[type=\"checkbox\"\
  ]):before {\n  display: block;\n  content: '';\n  width: 0.625em;\n  height: 0.625em;\n\
  }\n```\n\n当我们应用此代码时，我们将看不到任何变化，如图 10.17 所示。我们的内部框确实存在，但尚未可见。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_270_0.png)\n\
  \nFigure 10.17 Invisible inner box\n\n框尚未可见，因为它没有内容或背景颜色。因此我们将接下来添加背景颜色。\n\n## 10.3.6\
  \ Using the :checked pseudo-class\n\n我们不会无差别地一直将相同的背景颜色应用于元素。我们将在元素被选中时使用强调色，在悬停时使用悬停色。\n\
  \n:checked 伪类选择器可用于 type 为 radio 或 checkbox 的 input，或用于下拉列表中的 option 元素（<select>），以在元素被选中时应用样式。然而，将其用于\
  \ option 的能力取决于浏览器。\n\n当我们为选中和悬停应用背景颜色时，如果选择器的特异性级别相同（我们的示例中是），我们编写这些规则的顺序很重要。如果我们先写选中规则再写悬停规则，则在悬停选中输入时悬停颜色将被应用，因为悬停规则由于在\
  \ CSS 文件中更靠后而覆盖选中规则。因此我们需要确保在 CSS 文件中悬停规则位于选中规则之前。图 10.18 说明了这两种情况。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_271_0.png)\n\
  \nFigure 10.18 Rule order regarding background for checked checkboxes on hover\n\
  \n让我们看看如何在 CSS 文件中应用背景颜色。列表 10.13 显示了我们文件目前的摘录。\n\n## Listing 10.13 Inner Element\
  \ Background Color\n\n```\n:where(input[type=\"radio\"], input[type=\"checkbox\"\
  ]):before {\n  display: block;\n  content: '';\n  width: 0.625em;\n  height: 0.625em;\n\
  }\n```\n\n13 https://developer.mozilla.org/en-US/docs/Web/CSS/:checked\n\n```\n\
  }\n\n:where(input[type=\"radio\"], input[type=\"checkbox\"]):hover::before { #B\n\
  \  background: var(--hover);\n}\n\n:where(input[type=\"radio\"], input[type=\"checkbox\"\
  ]):checked::before { #C\n  background: var(--accent);\n}\n```\n\n#A 内部框的先前编写代码\n\
  #B 在悬停时为内部框添加背景颜色\n#C 在输入被选中时为内部框添加背景颜色\n\n图 10.19 显示我们现在在元素内部有一个可以塑形的正方形框。当元素被选中时，它使用强调色显示；当我们悬停在未选中的单选或复选框输入上时，我们会看到灰色框。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_272_0.png)\n\nFigure 10.19 Setting up\
  \ for our checked state\n\n现在我们需要塑形内部框。这里我们的代码将分叉，以分别创建单选的圆盘和复选框的复选标记。\n\n## 10.3.7\
  \ Shaping the checked radio input’s inner disk\n\n为了将我们的框变成选中单选输入内部的圆形，我们将使用 border-radius。我们将专门针对\
  \ type 为 radio 输入的 before 伪类，然后添加 50% 的 border-radius 使我们的框看起来像圆形，如列表 10.14 所见。我们不区分悬停或选中，因为我们希望形状无论元素状态如何都为圆盘。\n\
  \n## Listing 10.14 Radio Button Inner Disk\n\n```\ninput[type=\"radio\"]::before\
  \ {\n  border-radius: 50%;\n}\n```\n\n现在我们有一个非常传统的单选按钮（图 10.20），无论文本大小如何都能很好地缩放。\n\
  \n\n\n\n\n![](img/b56145aa9b751926a7aedbd7172bc818_273_0.png)\n\nFigure 10.20 Styled\
  \ Radio Input\n\n有了单选输入样式后，我们现在将注意力转向塑造复选框内部的复选标记。\n\n## 10.3.8 Using CSS shapes\
  \ to create the checkmark\n\n塑造我们的单选输入非常简单，我们使用了 border-radius 并实现了一个圆盘形状。复选标记的形状就没有那么简单了。要创建它，我们将使用\
  \ clip-path。\n\n> NOTE Clip-path Clip path 允许我们通过创建剪切区域来创建形状，该区域定义了元素的哪一部分应显示而哪一部分应隐藏。我们在第\
  \ 5 章和第 7 章中之前使用过 clip-path，如果你想复习一下\n\n要创建我们的复选标记，我们将应用于 clip-path 的形状是一个 polygon，它将创建我们的复选标记。Polygon\
  \ 是通过设置一系列基于 X 和 Y 百分比的坐标来创建的，在这些坐标之间会创建一条线。坐标 (0, 0) 是形状的左上角。如果形状未明确关闭，它将自动连接第一个和最后一个点。我们的\
  \ polygon 函数将为：polygon(14% 44%, 0% 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%)。Figure\
  \ 10.21 解释了形状逐点构建的过程。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_274_0.png)\n\n\
  Figure 10.21 Polygon Check Mark Shape Coordinates\n\n有了形状后，我们现在可以创建我们的 clip-path\
  \ 并将其应用于复选框的内部部分，如 Listing 10.15 所示。\n\n### Listing 10.15 Check mark in our checkbox\n\
  \n```\ninput[type=\"checkbox\"]::before {\n  clip-path: polygon(14% 44%, 0% 65%,\
  \ 50% 100%, 100% 16%, 80% 0%, 43% 62%);\n}\n```\n\n添加了 clip-path 后，我们现在拥有了一个完全功能的复选框。让我们添加一些\
  \ finishing touches。请注意，在 Figure 10.22 中，已选中单选按钮和复选框的轮廓仍然是我们的字体颜色，而不是强调色。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_274_1.png)\n\
  \nFigure 10.22 Style Checkmark in the checkbox\n\n为了在选中时为单选按钮和复选标记添加轮廓颜色，我们将再次使用\
  \ :checked 伪类，以专门选择控件仅在选中时并将边框颜色更改为我们的强调色。在代码中，这转化为 Listing 10.16 所示的内容。我们使用 :is\
  \ 而不是 :where 是因为特异性。\n\n### Listing 10.16 Accent color outline for checked inputs\n\
  \n```\ninput[type=\"radio\"],\ninput[type=\"checkbox\"] {\n  ...\n  border: 0.1875em\
  \ solid currentColor;\n}\n\n:is(input[type=\"radio\"], input[type=\"checkbox\"]):checked\
  \ {\n  border-color: var(--accent);\n}\n```\n\n## 10.3.9 Calculating specificity\
  \ with :is() and :where()\n\n我们之前提到过 :where 的特异性为 0，意味着它是我们可以使用的特异性最低的选择器。我们在以下选择器中设置了默认边框颜色\
  \ input[type=\"radio\"], input[type=\"checkbox\"] { ... } 其特异性为 11，使用下表 10.2 计算得出。在每一列中我们计算每种类型选择器的数量，列\
  \ A、B 和 C 形成特异性值¹⁶。\n\n### Table 10.2 Calculating Specificity\n\n| Selector | A\
  \ ID selectors (x100) | B Class selectors, Attribute Selectors, & Pseudo Classes\
  \ (x10) | C Type Selectors, pseudo elements (x1) | Specificity |\n|---|---|---|---|---|\n\
  | :where(input[type=\"radio\"], input[type=\"checkbox\"]) | Ignores specificity\
  \ rules and always equals 0 |  | 000 |\n| :where(input[type=\"radio\"], input[type=\"\
  checkbox\"]):checked | Ignores specificity rules and always equals 0 |  | 000 |\n\
  | input[type=\"radio\"] | 0 | 1 | 1 | 011 |\n\n| input[type=\"radio\"]:checked |\
  \ 0 | 2 | 1 | 021 |\n|:is(input[type=\"radio\"], input[type=\"checkbox\"]):checked\
  \ | 0 | 2 | 1 | 021 |\n\n由于 :is 将基于其内部最具体的选择器来确定其特异性值，在我们的特定情况下，其特异性将为 11 再加上 :checked\
  \ 的 10，给我们一个特异性为 21。由于 21 大于 0，我们覆盖了样式，我们的边框变为我们的强调色。\n\n我们的单选输入和复选框现在在选中和未选中时以及两种状态下的悬停时都已设置样式。Figure\
  \ 10.23 显示了成品。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_276_0.png)\n\nFigure\
  \ 10.23 Styled Checkmark and Radio Inputs\n\n让我们把注意力转向下拉菜单。\n\n## 10.4 Styling dropdowns\n\
  \n虽然我们为 select 元素设置了与输入和 textarea 相同的默认值（作为复习，它们显示在 Listing 10.17 中），但我们可以在 Figure\
  \ 10.24 中看到它并没有像其他元素一样占据我们容器的全宽。此外，由于我们添加了边框，表示其为下拉菜单的向下箭头离边缘相当近。\n\n### Listing\
  \ 10.17 Default styles applied to select\n```\ninput:not([type=\"radio\"], [type=\"\
  checkbox\"]),\ntextarea,\nselect {\n  background: var(--background);\n  font-size:\
  \ 1rem;\n  font-family: inherit;\n}\n```\n```\ncolor: inherit;\nborder: solid 1px\
  \ var(--border);\nborder-radius: 32px;\npadding: 1rem 2rem;\n\ndisplay: block;\n\
  width: calc(100% - 4rem);\n}\n```\n\n![](img/b56145aa9b751926a7aedbd7172bc818_277_0.png)\n\
  \nFigure 10.24 Select not taking full width\n\n### 10.4.1 Select styling limitations\n\
  \n在我们着手修复 select 以匹配我们的其他样式之前，让我们先解决我们将遇到的一些限制。select 与单选和复选框输入一样，其大部分样式和功能都来自操作系统本身。因此，我们仅使用\
  \ CSS 能样式化的范围将受到限制，尤其是选项列表。我们可以使用 JavaScript 和 ARIA 替换整个控件，但由于这是一本关于 CSS 的书，我们将尽可能使用\
  \ CSS 单独进行样式化，然后就此停止。\n\n像我们对单选按钮和复选框所做的那样，我们将首先通过使用 appearance 属性并将其值设为 none 来移除尽可能多的原生样式。然后我们将宽度设置为\
  \ 100%，使其占据容器的全宽。我们的下拉菜单摆脱了原生外观并正确调整大小后，如 Figure 10.25 所见，我们可以专注于重新添加箭头。请注意，箭头消失了，但添加\
  \ appearance: none 并未影响我们的选项。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_278_0.png)\n\
  \nFigure 10.25 Full width select with no arrow\n\n### 10.4.2 Using linear-gradients\
  \ to create an arrow\n\n我们的下一个任务将是创建一个我们可以控制定位的新箭头。记住在本章开头，我们使用渐变创建了一个圆？我们将再次使用这个技巧来创建我们的箭头，我们将使用\
  \ background-image 属性将其添加到下拉菜单中。与 radial-gradient 不同，我们将使用 linear-gradient。\n\n\
  与 radial-gradient 类似，linear-gradient 将接受一系列颜色和它们应开始和停止的百分比，但颜色不是以围绕中心点的圆形方式显示，而是以线性的方式放置朝向某一侧或角落。它还可以接受一个角度来规定颜色线的方向。表\
  \ 10.3 显示了规定颜色线方向时的角度及其关键字等价物。\n\nTable 10.3 Keyword and Angle Equivalent\n\n| Keyword\
  \ | Angle in degrees |\n|---|---|\n| to top | 0 |\n| to bottom | 180 |\n| to left\
  \ | 270 |\n| to right | 90 |\n\n与 radial-gradient 相同，如果我们在同一百分比停止和停止一种颜色，我们将得到一条尖锐的线而不是从一种颜色到另一种颜色的渐变。\n\
  \nbackground-image 属性允许我们在背景中添加多个图像。我们将利用此功能。我们需要三个重叠的渐变来创建我们的箭头，它们都将分配给 background-image\
  \ 属性。\n\n我们首先给背景一个高度和宽度为 1rem，创建一个正方形。然后我们将背景图像设置为我们的三个渐变。第一个值在顶部，最后一个在底部。从底部到顶部工作，我们首先使用从强调色到强调色的渐变。换句话说，我们创建一个蓝色方块。然后我们创建一个放在正方形顶部的第二个渐变。我们的第二个渐变将方块从左下到右上分割，其中顶部是透明的，底部是我们的背景颜色。这创建了一个三角形，遮挡了方块的右下角。我们的第三个将是相反的对角线，从左上到右下，同样顶部透明，底部为背景颜色。这创建了另一个三角形，遮挡了方块的左下角。这留下一个倒置的蓝色三角形，宽\
  \ 1rem，高半个 rem。Figure 10.26 说明了该过程。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_279_0.png)\n\
  \nFigure 10.26 Creating an arrow from superimposed gradients\n\n剩下的就是定位我们的背景并防止其重复。我们希望背景距离控件右侧\
  \ 1rem 并居中。我们可以使用 calc() 函数为我们做数学计算。要计算水平位置，我们取全宽 (100%) 并减去 1rem。对于垂直定位，我们知道我们有\
  \ 1rem 的上下内边距加上文本，其大小也为 1rem，使我们的控件高度为 3rem。因此我们可以将箭头定位在顶部下方 50%。由于箭头的高度只有半个 rem，我们然后在顶部位置加上\
  \ ⅓rem。\n\n全部放在一起，我们得到 select 的以下规则（Listing 10.18）：\n\n### Listing 10.18 Styled\
  \ Select\n\n```\nselect {\n  appearance: none;\n  width: 100%;\n\n  background-image:\n\
  \    linear-gradient(225deg, transparent 50%, var(--background) 50%),\n    linear-gradient(135deg,\
  \ transparent 50%, var(--background) 50%),\n    linear-gradient(var(--accent), var(--accent))\n\
  \  ;\n\n  background-size: 1rem 1rem;\n  background-position: calc(100% - 1rem)\
  \ calc(50% + .33rem);\n  background-repeat: no-repeat;\n}\n```\n\n\n\n\n\nFigure\
  \ 10.27 shows our styled select.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_280_0.png)\n\
  \nFigure 10.27 Styled and Positioned Select Arrow\n\nTo style the select options\
  \ themselves, only `color` and `background` can be styles, and even then, only some\
  \ browsers will allow those to be applied. This is because the styles for options\
  \ are controlled by the underlying operating system. For cross browser compatibility\
  \ and accessibility, we will therefore leave those as they are.\n\nWe have now styled\
  \ all of the form controls in our form. Let’s revisit our labels and add some breathing\
  \ room between our labels and our controls so that our elements aren’t so closely\
  \ compacted against each other.\n\n## 10.5 Styling labels and legends\n\nTo style\
  \ our labels and the legend, we are going to start by giving them `margin`. We will\
  \ give them vertical margin for breathing room in between items. We will also give\
  \ them left margin so that the label text aligns with where the text begins in the\
  \ input field. We gave the inputs left padding of `2rem`. We can therefore give\
  \ our labels the same amount of left margin to align the text visually on the page.\
  \ Because labels have a `display` value of `inline` by default, we will need to\
  \ give them a `display` value of `block` for the margin to apply. Finally we will\
  \ also decrease their font size. The information that is most important here is\
  \ the values that are entered by the user, not the labels. By decreasing their size\
  \ we diminish their importance in the visual hierarchy. We end up with the code\
  \ displayed in listing 10.19.\n\n### Listing 10.19 Added margin and updated font\
  \ size\n\n```\nlabel, legend { #A\n  display: block;\n  margin: 1rem 0 0 2rem; #B\n\
  \  font-size: .875rem;\n}\n```\n\n#A we apply the styles to both the labels and\
  \ the legend\n#B Margin top of 1 rem, margin left of 2 rem\n\nNotice in Figure 10.26\
  \ that the `legend` is still very close to the \"Reason for Contact\" field above\
  \ it. Also, our radio buttons are now very far apart.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_281_0.png)\n\
  \nFigure 10.28 Added Label and Legend Margin\n\nTo add space between our legend\
  \ and the \"Reason for Contact\" above we are going to give our fieldset itself\
  \ some margin. We will then specifically target the labels that are within the fieldset\
  \ and reduce their vertical margin so that the radio inputs are closer together.\
  \ We want to keep the radio inputs close together because the closer they are to\
  \ one another visually, the easier it will be for the user to recognize them as\
  \ belonging together as a group. Listing 10.20 shows our updated margins.\n\n###\
  \ Listing 10.20 Added margin and updated font size\n\n```\nfieldset {\n    #A\n\
  \    ...\n    #A\n    margin: 1rem 0;\n    #A\n}\n\nfieldset label {\n    #B\n \
  \   margin: .5rem 0 0 2rem;\n    #B\n```\n\n#A Add margin to our already existing\
  \ fieldset rule\n#B Update the margin of the labels that inside of the fieldset\n\
  \nWith our labels now formatted (Figure 10.29) let’s continue down the form and\
  \ style the buttons.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_282_0.png)\n\n\
  Figure 10.29 Styled Labels and Legend\n\n## 10.6 Styling the buttons\n\nWe have\
  \ two buttons at the bottom of our form. The first performs our primary action,\
  \ \"Send\". The second, \"Reset\" performs a secondary action. We will therefore\
  \ make the \"Send\" button much more prominent than our reset as it is the most\
  \ likely to be used and the behavior we desire the user to perform. The reset is\
  \ there as a tool or utility to help the user but should not be our primary focus.\n\
  \n### 10.6.1 Resetting the button styles\n\nWe will first reset the button styles\
  \ to match our theme and then differentiate where needed for our two use cases.\
  \ We create a rule with a button selector, which applies to all buttons removing\
  \ the border and background, setting our typography preferences, adding padding\
  \ and margin, adding a border-radius, and changing the cursor to a pointer. Our\
  \ base styles are shown in Listing 10.21.\n\n### Listing 10.21 Reset button styles\n\
  \n```\nbutton {\n  border: none;\n  background: none;\n  border-radius: 36px;\n\
  \  padding: 1rem 3rem;\n  font-family: var(--font-family);\n  font-size: 1rem;\n\
  \  cursor: pointer;\n  margin-right: 1rem;\n}\n```\n\nOur buttons, shown in Figure\
  \ 10.30 are now ready to be differentiated based on their purpose.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_283_0.png)\n\
  \nFigure 10.30 Styled Labels and Legend\n\n### 10.6.2 Styling the submit button\n\
  \nLet’s first handle the “Send” button which has a type submit. Instead of giving\
  \ it a class, we can use a type selector to specifically target our button: button[type=\"\
  submit\"]. The outcome we want to achieve is shown in Figure 10.31.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_283_1.png)\n\
  \nFigure 10.31 Styled submit button\n\nWe will make it stand out by changing the\
  \ background color to be our accent color and bolding the text. We also need to\
  \ change our text color because the dark gray, almost black, we have been using\
  \ for our text will not show up very well against a dark background. If we do not\
  \ change the text color, the color contrast between our background color and our\
  \ text will be too low and impede legibility. We will therefore change the text\
  \ color to take our accent-contrast custom property value (white) which we set at\
  \ the beginning of this chapter. Our completed styles for the submit button can\
  \ be seen below in Listing 10.21.\n\n### Listing 10.21. Added margin and updated\
  \ font size\n\n```\nbutton[type=\"submit\"] {\n  background: var(--accent);\n  color:\
  \ var(--accent-contrast);\n  text-transform: uppercase;\n  font-weight: bold;\n\
  }\n```\n\n## 10.6.3 Styling the reset button\n\nNext we need to style the reset\
  \ button. Same as with our submit button rather than adding a class, we will use\
  \ a type selector to create our rule. The “Reset” button has a type of reset, so\
  \ we can use button[type=\"reset\"] as a selector for our rule.\n\nTo reinforce\
  \ that it is a secondary action, we are going to minimize it even further visually\
  \ compared to its submit counterpart by forcing its text to be all lowercase. We\
  \ will however change the text color to be our accent color to reinforce that it\
  \ is clickable, otherwise it just looks like static text.\n\nAs mentioned in the\
  \ previous section, there is not much contrast difference between our text color\
  \ and our accent color, therefore some users, especially those that are visually\
  \ impaired, may have trouble differentiating between the two colors. It is therefore\
  \ imperative that we use more than just color to differentiate between element types\
  \ and states. We will therefore add a border that is the same color as our input\
  \ borders to our button.\n\nHowever, once we apply the border, we can see in Figure\
  \ 10.30 that the reset button is now taller than our submit button. The submit is\
  \ 50px tall while the reset is 52px. Not ideal when the goal is to make it appear\
  \ less important than the submit. Size is often an indicator of importance, the\
  \ bigger an element is the more important it will appear.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_284_0.png)\n\
  \nFigure 10.32 Button Sizes\n\nTo remedy this situation and have both the buttons\
  \ be the same size we will add 1px border to the submit button as well. We will\
  \ however give it a color of accent. It will be invisible as a border since it will\
  \ blend into the background color but it will make both of our buttons the same\
  \ size. Listing 10.22 shows the reset button styles and the edit to the submit button.\n\
  \n### Listing 10.22 Reset button styles and border edit to submit\n\n```\nbutton[type=\"\
  submit\"] {\n  ...\n  border: solid 1px var(--accent);  #A\n}\n\nbutton[type=\"\
  reset\"] {          #B\n  color: var(--accent);           #B\n  text-transform:\
  \ lowercase;      #B\n  border: solid 1px var(--border); #B\n  box-sizing: border-box;\
  \         #B\n}\n```\n\n#A added border to submit button\n#B Styles for reset button\n\
  \nWe can see in Figure 10.32 that our buttons are now styled and have equal heights.\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_285_0.png)\n\nFigure 10.33 Both buttons\
  \ are equal in height\n\nAlthough styled, the buttons are right up against the checkmark\
  \ above them. We will need to add margin between them and the above control.\n\n\
  In our HTML (shown in Listing 10.23) we notice that there is a container div around\
  \ our buttons with a class of actions.\n\n### Listing 10.23 Button HTML\n\n```\n\
  <div class=\"actions\">\n  <button type=\"submit\" onclick=\"send(event)\">Send</button>\n\
  \  <button type=\"reset\" onclick=\"setAsPristine()\">Reset</button>\n</div>\n```\n\
  \nWe will give the actions div a margin-top of 1rem, which will move the buttons\
  \ down and away from the checkbox. Listing 10.24 shows this in code.\n\n### Listing\
  \ 10.24 Margin on actions container\n\n```\n.actions {\n  margin-top: 1rem;\n}\n\
  ```\n\nAs seen in Figure 10.33, we are starting to look pretty good. Our next order\
  \ of business will be to style our error messages.\n\n\n\n\n\n![](img/b56145aa9b751926a7aedbd7172bc818_286_0.png)\n\
  \nFigure 10.34 Styled Buttons and Container\n\n## 10.7 Error handling\n\n在 Name、Email\
  \ 和 Message 控件下方有一个错误信息。目前它未经过样式处理，因此不易被识别为错误信息。此外，我们也不希望在用户与控件交互之前就显示此错误信息。没人希望在刚开始之前就被错误信息责骂。\n\
  \n我们要做的是将其样式化，使其看起来像错误信息，然后默认隐藏它们，仅在适当时显示。提前说明一下，如果你跟着本章一起编码并且从 Github 下载了起始文件，你可能已经注意到一个\
  \ JavaScript 文件。这就是该文件中代码将发挥作用的地方。我们很快就会更详细地介绍这一点。\n\n### 10.7.1 Styling error messages\n\
  \n像网络上大多数错误信息一样，我们将把我们的文本设为红色。我们将使用我们在 --error 自定义属性中设置的颜色。我们还将使文本加粗，并在错误前加上 “Error:\
  \ ” 字样，以明确表示其为错误，因为如本章前面所述，我们不想仅使用颜色来传达含义或意图。为了保持措辞一致且不必每次都记住添加，我们不会在每个错误开头添加文字，而是通过\
  \ CSS 使用 ::before 伪元素以编程方式添加。我们还需要为错误右侧添加 2rem 的外边距，以便其与标签和输入文本对齐。因此，我们的错误样式规则如下所示（Listing\
  \ 10.25）：\n\n# Listing 10.25 Error Styles\n\n```\n.error {\n  color: var(--error);\
  \  #A\n  font-weight: bold;\n  margin-left: 2rem;   #B\n}\n\n.error span::before\
  \ { #C\n  content: 'Error: '; #C\n}                  #C\n```\n\n#A 使文本变红\n#B 使其与输入内容和标签对齐\n\
  #C 在每个错误前添加 “Error: ”\n\n注意，当我们在文本前添加 “Error: ” 文字时，我们将其添加到 span 而不是 error div 本身。这是因为我们将显示和隐藏\
  \ error 中的 span 以及整个 error div。让我们更仔细地查看 HTML 以了解原因。Listing 10.26 显示了 Name 字段的完整控件，包括其标签和错误信息。注意\
  \ error div 的 id 为 nameError，该 id 被输入字段上的 aria-describedby 属性引用。aria-describedby\
  \ 属性告诉屏幕阅读器和辅助技术，其引用的 id 元素包含与输入字段相关的额外信息。如果我们使用 display:none 完全隐藏 error div，aria-describedby\
  \ 指向的元素将不存在。因此我们只隐藏内容（span），以免破坏元素与其错误之间的程序化连接。由于我们只会隐藏 span，因此我们需要将 “Error: ” 文字应用于\
  \ span，以便在隐藏错误信息时也能将其隐藏。\n\n# Listing 10.26 Name Field HTML\n\n```\n<label for=\"\
  name\">Your Name</label>\n<input type=\"text\" id=\"name\" name=\"name\" maxlength=\"\
  250\" required aria-describedby=\"nameError\">\n<div class=\"error\" id=\"nameError\"\
  >\n  <span role=\"alert\">\n    Please let us know who you are\n  </span>\n</div>\n\
  ```\n\nFigure 10.34 显示了我们样式化的错误信息。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_288_0.png)\n\
  \nFigure 10.35 Styled error messages\n\n在对输入字段进行样式化后，我们现在可以仅在适当时显示它们。在 Figure 10.33\
  \ 中我们看到输入框具有有效值，但错误信息仍然显示。为了仅在字段无效时显示它们，我们将首先默认隐藏错误信息。因此我们将 error `div` 中包含的 `span`\
  \ 应用 `display` 属性值为 `none`。然后我们使用 `:invalid` 有条件地仅在字段无效时显示它。\n\n正如我们在第 8 章中之前提到的，在这种情况下字段的有效性是基于我们在字段本身上设置的属性来确定的。让我们再次查看\
  \ name 输入的 HTML：`<input type=\"text\" id=\"name\" name=\"name\" maxlength=\"250\"\
  \ required aria-describedby=\"nameError\">`。我们包含了 `required` 和 `maxlength` 属性，因此如果字段中没有值，或者值的长度大于\
  \ 250 个字符，字段值将无效，并且使用 `:invalid` 伪类应用的样式将被应用。\n\nemail 元素（`<input type=\"email\"\
  \ id=\"email\" name=\"email\" maxlength=\"250\" required aria-describedby=\"emailError\"\
  >`）也具有 `maxlength` 和 `required` 属性，因此在与 name 字段相同的条件下也会无效。它还有一个类型为 `email`。在 HTML\
  \ 中，一些字段类型内置了验证。Email 就是其中之一，因此，如果我们输入的 email 地址值为 “myEmail”，它也会显示为无效。\n\n使用 `:invalid`\
  \ 伪类将有助于防止在字段有效时显示错误，但不会阻止在字段尚未交互时显示错误。我们目前在纯 CSS 中没有办法确定用户是否已与字段交互，有时也称为字段为 “dirty”。这就是我们需要\
  \ JavaScript 帮助的地方。附加到文件的脚本会监听 on blur 事件。Blur 事件发生在元素失去焦点时。当我们点击或从字段中切换走时，就会发生\
  \ blur 事件。我们的脚本监听这些 blur 事件，并在我们刚刚离开的字段上添加一个 dirty 类。这使我们能够知道哪些字段已被交互，哪些未被交互。具有\
  \ dirty 类的字段已被交互，没有 dirty 类的字段未被交互。当点击 “Clear” 按钮时，它会清除表单并从可能具有该类的字段中移除 dirty 类，将表单重置为干净状态。\n\
  \n由于我们有这个 dirty 类，结合 :invalid 属性，我们将仅在控件不仅无效而且已被用户触碰时才显示错误信息，从而防止在用户有机会填写表单之前显示错误信息。我们使用以下选择器：.dirty:invalid\
  \ + .error span。我们选择位于紧跟在同时无效且具有 dirty 类的元素之后的具有 error 类的元素中包含的 span。\n\n最后我们还将在字段同时无效且为\
  \ dirty 时更改其边框颜色为我们的错误颜色。\n\nListing 10.27 显示了显示和隐藏错误信息的完整规则。\n\n# Listing 10.27\
  \ Error Handling CSS\n\n```\n.error span { display: none; } #A\n\n.dirty:invalid\
  \ + .error span { #B\n  display: inline;      #B\n}                       #B\n\n\
  :is(input, textarea).dirty:invalid { #C\n  border-color: var(--error);  #C\n}  \
  \                         #C\n```\n\n#A 默认隐藏错误信息\n#B 当其在 HTML 中紧邻之前的字段为 dirty 且无效时显示错误信息\n\
  #C 当输入框和文本域无效且为 dirty 时将边框颜色改为红色\n\nFigure 10.35 显示了字段的三种可能状态，无效且为 dirty、有效，以及无效但尚未触碰。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_290_0.png)\n\nFigure 10.36 Error Handling\
  \ and field States\n\n表面上我们的表单似乎已完成，但我们仍有一些收尾工作要做。\n\n## 10.8 Adding hover and focus\
  \ styles to form elements\n\n因为我们希望表单具有可访问性，所以我们需要确保在控件和按钮上包含悬停和焦点样式。我们已经处理了单选按钮和复选框的悬停样式，但未处理焦点。对于其他元素我们也尚未考虑。\n\
  \n让我们从焦点开始，因为我们仍需要在表单上的所有元素上应用它。焦点对于通过键盘而非鼠标点击元素浏览网页的用户非常重要。它为用户提供当前具有焦点的元素的视觉指示。\n\
  \n### 10.8.1 :focus versus :focus-visible\n\n因为无论用户如何浏览网页都一直显示焦点样式可能会让人不知所措，这取决于设计，最近\
  \ CSS 规范中添加了一个新属性，可根据用户的操作方式，即键盘或鼠标，来应用焦点样式。伪类 :focus-visible 允许我们在用户是\n\n17 https://developer.mozilla.org/en-US/docs/Web/CSS/:focus-visible\n\
  \n\n\n与键盘交互时适用但在用户使用鼠标时不会应用，而与 :focus 不同，:focus 无论用户如何与元素交互始终适用。\n我们将应用一个实线轮廓，宽度为\
  \ 2 像素，并使用我们的强调色。这不仅会设置我们的轮廓样式，还会用我们专门为匹配主题而设计的样式替换浏览器的默认悬停状态轮廓。这在具有无效样式悬停的字段上看起来有点不协调。我们可以从图\
  \ 10.36 看出，不仅边框和轮廓冲突，而且边框还侵入了错误消息。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_291_0.png)\n\
  \n图 10.37 错误输入上的焦点可见\n\n为防止轮廓与边框冲突，我们使轮廓在字段为脏且无效时使用我们的错误颜色。由于所有字段都有足够的内边距，我们将内缩边框，使其不会离错误消息太近。为了内缩轮廓，我们将\
  \ outline-offset 属性设置为负值。我们最终得到了清单 20.28 中显示的 2 条规则。\n\n## Listing 10.28 Focus-visible\
  \ on form fields and button\n\n```\n:focus-visible {\n  outline: solid 2px var(--accent);\
  \  #A\n  outline-offset: -2px;              #A\n}\n\n.dirty:invalid:focus-visible\
  \ {      #B\n  outline-color: var(--error);       #B\n}\n```\n\n#A 所有元素在获得焦点时都会显示轮廓\n\
  #B 当元素为脏且无效时，我们将轮廓颜色更改为红色\n\n图 10.36 显示了使用浏览器的开发者工具应用 focus-visible 时的每个字段。在大多数主要浏览器中，开发者工具会有一个\
  \ :hov 按钮，可以点击展开一系列复选框，允许我们根据列出的伪类手动应用样式。这就是我们在此处所做的，以便同时将 focus-visible 样式应用于多个元素。\
  \ （本图及后续图中使用的浏览器为 Chrome）\n\n![](img/b56145aa9b751926a7aedbd7172bc818_292_0.png)\n\
  \n图 10.38 字段元素上的焦点可见\n\n我们的轮廓对所有字段都可见且工作良好，除了我们的复选框、单选按钮和按钮，尤其是提交按钮。为此我们将更改轮廓偏移，使轮廓不再位于元素内部，而是放置在元素外部，距离元素\
  \ 2 像素。为此我们将以下规则添加到样式文件中（清单 10.29）。\n\n## Listing 10.29 Focus-visible on radios\
  \ and checkboxes\n\n```\n:where(input[type=\"radio\"], input[type=\"checkbox\"],\
  \ button):focus-visible {\n  outline-offset: 2px;\n}\n```\n\n应用编辑后，我们的复选框、输入和按钮在通过键盘导航或交互时现在看起来如图所示\
  \ 图 10.37。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_293_0.png)\n\n图 10.39 单选、复选框和按钮上的焦点可见\n\
  \n处理完焦点样式后，让我们处理悬停。\n\n## 10.8.2 Adding hover styles\n\n用户输入文本的字段，例如类型为 text 和 email\
  \ 的输入或文本区域，在悬停时已将光标类型从默认更改为文本。表 10.4 显示了每种光标类型的外观。\n\n### Table 10.4 Cursors\n\n\
  | Cursor Name | Cursor Image |\n|---|---|\n| default |  |\n| text |  |\n| pointer\
  \ |  |\n\n我们还将按钮上的光标更改为指针。select 在悬停时没有样式或光标的任何更改。为解决 select 问题，并进一步强调其他字段和重置按钮的悬停，我们将更改元素的边框颜色以使用我们的强调色\n\
  \n使用清单 10.30 中找到的颜色。虽然冗余，但由于特异性，我们无法仅在 :is 伪类中添加 input 来覆盖我们之前设置的边框样式。请注意，我们需要同时包含\
  \ input，这将更改单选和复选框的边框颜色，以及 input:not(...)，以便更改类型为 text 和 type email 的输入的边框颜色。\n\n\
  ## Listing 10.30 Hover rule\n\n```\n:is(\n  input,\n  input:not([type=\"radio\"\
  ], [type=\"checkbox\"]),\n  textarea, select, button\n):hover {\n  border-color:\
  \ var(--accent);\n}\n```\n\n在图 10.38 中，我们再次使用了 Chrome 开发者工具来专门显示对有箭头指向的元素应用的悬停样式。\n\
  \nFigure 10.40 On Hover Styles\n\n在处理完焦点和悬停后，我们需要关心的最后一件事是确保我们的样式适用于启用了 forced-color:\
  \ active 的用户。\n\n## 10.9 Handling forced-color mode\n\n强制颜色模式¹⁸ 是一种高对比度设置，允许用户将使用的颜色调色板限制为其设备上设置的系列颜色。Windows\
  \ 的高对比度模式就是此用例的一个示例。当此模式启用时，它会影响许多 CSS 属性，包括我们使用过的一些属性，最著名的是 background-color。我们利用\
  \ background-color 来确定单选和复选框输入的内部部分是否可见\n\n![](img/b56145aa9b751926a7aedbd7172bc818_295_0.png)\n\
  \n对于已选中与未选中元素。我们还用它来重新设置 select 控件的箭头样式。\n\n在 Chrome 中，我们可以使用开发者工具模拟在机器上启用强制颜色模式，而无需实际编辑计算机设置。在开发者工具的控制台区域中，我们选择渲染选项卡。如果尚未显示，我们可以按省略号按钮显示可能的选项卡列表并从下拉菜单中选择它。在该选项卡中，我们然后查找\
  \ forced-color 仿真下拉菜单并将其设置为 forced-colors: active。这将更新页面的样式，使其表现得好像我们在机器上将 forced-colors\
  \ 设置为 active。图 10.39 显示了在 Chrome 开发者工具中启用仿真的设置。 （注意：不同浏览器可能有或没有此功能，并且启用方式可能不同。）\n\
  \n```\n<label for=\"message\">Message</label>\n<textarea id=\"message\" name=\"\
  message\" rows=\"5\" required maxlength=\"500\" aria-describedby</textarea>\n<div\
  \ class=\"error\" id=\"messageError\"></div>\n<label>\n<input type=\"checkbox\"\
  \ name=\"subscribe\" checked class=\"dirty\"> grid\n::before\n</input>\n\"Subscribe\
  \ to our newsletter \"\n</label>\n```\n\n图 10.41 Chrome 开发者工具中 forced-colors:active\
  \ 仿真设置\n\n一旦应用仿真，我们可以在图 10.40 中看到我们的页面样式发生了巨大变化。我们还注意到我们无法分辨哪个单选输入被选中，也无法分辨复选框是否被选中，并且我们下拉菜单的箭头消失了。我们还演示了使用颜色以外的东西来区分含义的重要性，因为我们的错误消息也不再是红色了。\n\
  \n# Contact\n\n您的意见对我们很重要。请填写所有字段。\n\n您的姓名\nJane Doe\n\n您的电子邮件地址\njane@email.co\n\
  \n联系原因\nOther\n\n您目前是订阅者吗？\n○ Yes\n○ No\n\nMessage\n\nError: Please let us know\
  \ how we can help\n\n☐ Subscribe to our newsletter\n\nSEND   reset\n\n图 10.42 仿真\
  \ forced-colors: active\n\n我们不会尝试在此模式下恢复我们的颜色，我们希望尊重用户的设置，但我们确实需要确保已选中的输入与未选中的输入有区别，并且我们的\
  \ select 有箭头以明显表示其为下拉菜单。\n\n为了创建仅在用户将 forced-color 设置为 active 时才应用的规则，我们将使用媒体查询\
  \ @media (forced-colors: active) { ... }。在媒体查询内部创建的规则仅在用户启用 forced-colors 时生效。\n\
  \n我们的复选标记和单选按钮不再可见的原因是系统定义的背景颜色（在本例中为白色）被应用到它们上。因此，我们将更改背景颜色以使用系统颜色而不是我们的强调色。CSS\
  \ Color Module Level 4 规范¹⁹ 定义了可供我们使用的颜色。我们将使用 CanvasText，这意味着我们将应用的颜色将与用于文本的颜色相同。\n\
  \n我们可以尝试通过更改渐变中的颜色值来将相同的逻辑应用于我们的 select，但我们会注意到它不起作用。这是因为在 forced-colors 模式下，当存在背景图像时，除非它是基于\
  \ url 的，否则它将不会显示。我们的\n\n¹⁹ https://www.w3.org/TR/css-color-4/#typedef-system-color\n\
  \n\n\n\n\nbackground images use the `linear-gradient()` function, not the `url()`\
  \ function, therefore, our value is being replaced with a value of `none`.\n\nTo\
  \ remove the system provided arrow, we gave the dropdown an `appearance` property\
  \ value of `none`. To reinstate the system provided appearance in `forced-colors`\
  \ mode, inside of the media query, we will give the `select` of an `appearance`\
  \ property value of `auto`. Our media full media query is displayed in Listing 10.31.\n\
  \n## Listing 10.31 forced-colors: active media query\n\n```\n@media (forced-colors:\
  \ active) {\n\n  :where(input[type=\"radio\"], input[type=\"checkbox\"]):checked::before\
  \ {\n    background-color: CanvasText;\n  }\n\n  select {\n    appearance: auto;\n\
  \  }\n}\n```\n\nFigure 10.41 shows our page in forced-colors mode with our media\
  \ query applied which fixes the styles that were creating usability problems for\
  \ our users.\n\n## Contact\n\nYour opinion is important to us. Please fill out all\
  \ of the fields.\n\nYour Name\nJane Doe\n\nYour Email Address\njane@email.co\n\n\
  Reason For Contact\nSales inquiry\n\nAre you currently a subscriber?\nYes\nNo\n\n\
  Message\nError: Please let us know how we can help\n\nSubscribe to our newsletter\n\
  \nSEND\nreset\n\nFigure 10.43 forced-colors: active styles fixed\n\nWhen we turn\
  \ the emulation off, we can see in figure 10.41 that our previously set styles remain\
  \ as they were and were not affected by those set inside of the media query.\n\n\
  ![](img/b56145aa9b751926a7aedbd7172bc818_301_0.png)\n\nFigure 10.44 Finished Product\n\
  \nWith this last task complete, we have now finished styling our form.\n\n## 10.10\
  \ Summary\n\n- Form controls whose functionality is tightly coupled with the operating\
  \ system such as dropdowns are harder to style than those without this coupling\n\
  - We can create shapes using gradients\n- Using em, elements can be sized to scale\
  \ with text size\n- To inherit font color when otherwise not possible we can use\
  \ the keyword value currentColor\n- :where() and :is() pseudo classes work very\
  \ similarly but have different levels of specificity\n- The :checked allows us to\
  \ target form elements when they are checked\n- The :invalid pseudo class can be\
  \ used to conditionally format fields when they are invalid\n- The validity of a\
  \ field's value is determined by the attributes set on the field in the HTML\n-\
  \ :focus styles are necessary to make our designs accessible\n- We can use :focus-visible\
  \ to make focus style only show for keyboard users\n- In some browsers we can forcibly\
  \ make the browser apply hover and focus styles\n- It is important to always use\
  \ more than just color to convey meaning\n- forced-colors mode changes how some\
  \ properties behave and the colors we can apply to the UI\n- Media queries can be\
  \ used to conditionally apply styles when forced-colors is set to\n\nactive\n\n\
  - In some browsers we can emulate `forced-colors` mode to check our designs\n\n\
  ## 11\n\n## Animated social media share links\n\n## This chapter covers\n\n- OOCS,\
  \ SMACSS, and BEM Architecture Patterns\n- Scoping CSS when working with components\n\
  - Working with social media icons\n- Creating CSS transitions\n- Where to use JavaScript\
  \ to overcome CSS limitations\n\nOne of the core foundational reasons for which\
  \ the internet was created was to share and distribute information. One of the ways\
  \ we do this today is through social media. In this chapter we will style and animate\
  \ some links that can be used to share a web page via email or social media.\n\n\
  Like in the previous chapters, we will be using HTML and CSS for this project without\
  \ using any frameworks. This is to keep focus on the CSS itself without the complexity\
  \ and individual intricacies that come with using external packages. However, many\
  \ applications in the wild do use frameworks some of which include the concept of\
  \ the component. A very common reason to turn a piece of functionality into a component\
  \ is to reuse the piece of code or element in multiple places in our applications.\
  \ With reusability comes the possibility for naming collisions. Some systems automatically\
  \ restrict the scope of the CSS of the component to itself, preventing any possible\
  \ collision between component styles. However, many do not, leaving it up to the\
  \ developer to organize their code to prevent accidentally changing the styles in\
  \ another component when styling a new one. Regardless of the framework and how\
  \ it does (or does not) handle CSS scoping we have a variety of architecture options\
  \ to help us organize and standardize our styles.\n\nBefore we dive into the project\
  \ itself let’s take a quick look at some CSS architecture options and choose one\
  \ for our project.\n\n## 11.1 CSS Architecture\n\nSome of the most popular CSS architecture\
  \ methodologies include OOCSS, SMACSS, and BEM.\n\n### 11.1.1 OOCSS\n\nhttps://github.com/stubbornella/oocss/wiki\n\
  \nFirst presented at Web Directions North in Denver by Nicolle Sullivan, OOCSS stands\
  \ for Object Oriented Cascading Style Sheets and aims to help developers create\
  \ CSS that is fast, maintainable, and standards-based. The Object in Object Oriented\
  \ Cascading Style Sheet is described by Sullivan as\n\n> \"a repeating visual pattern,\
  \ that can be abstracted into an independent snippet of HTML, CSS, and possibly\
  \ JavaScript. That object can then be reused throughout a site¹\"\n\nIn other words,\
  \ what we might think of today as a component or widget. To achieve this reusability,\
  \ OOCSS follows 2 main principles.\n\n- **Separate structure and skin**: keeping\
  \ visual features (background, borders... sometimes referred to as theme) as their\
  \ own classes that can be mixed and matched with objects to create a variety of\
  \ elements\n- **Separate container and content**: By refraining from using location\
  \ dependent styles, we can ensure the objects look the same no matter where they\
  \ are placed in the application or site.\n\n### 11.1.2 SMACSS\n\nhttp://smacss.com\n\
  \nDeveloped by Jonathan Snook, SMACSS stands for Scalable and Modular Architecture\
  \ For CSS. It aims to help organize CSS by organizing rules into 5 categories.\n\
  \n- **Base**: the defaults applied by using element, descendent, or child selectors\
  \ and pseudo classes.\n- **Layout**: used to lay elements out on the page such as\
  \ headers, articles, and footers\n- **Module**: More discrete parts of the layout\
  \ such as carousels, cards, nav bars, etc.\n- **State**: something that augments\
  \ or overrides other styles such as an error state or whether a menu is opened or\
  \ closed.\n- **Theme**: defines the looks and feel. The theme does not always have\
  \ to be separated in its own classes if there is only one theme for the page or\
  \ project.\n\n### 11.1.3 BEM\n\nhttps://en.bem.info/methodology/\n\nDeveloped by\
  \ a company named Yandex, BEM stands for Block Element Modifier. It is a component\
  \ based architecture which aims to break the UI into independent blocks which can\
  \ be reused.\n\n- Block\n  - The purpose, what the block is for or doing\n  - Class\
  \ name for the element such as `header`\n- Element\n  - Describes the element’s\
  \ purpose\n  - Class name is the block name followed by 2 underscores and the the\
  \ element such as `header__text`\n- Modifier\n  - Describes the appearance, state,\
  \ and behavior\n  - The class pattern is as follows: Block-name_modifier-name (ex:\
  \ `header_mobile`); Block-name__element-name_modifier-name (ex: `header__menu_open`)\n\
  \n### 11.1.4 Picking an approach\n\nChoosing an architectural approach for CSS is\
  \ very team dependent. The needs of the project, size and experience of the team,\
  \ as well as the libraries and frameworks being used are all factors in how to choose\
  \ which architecture to use. There is no one size fits all or universally correct\
  \ answer, it is a decision that needs to be made by the team.\n\nBecause of its\
  \ component based approach, for this chapter we will use BEM architecture to scope\
  \ and style our social media share links.\n\n## 11.2 Setup\n\nNow that we have chosen\
  \ our methodology which dictates the naming convention we will use for the project,\
  \ let’s take a look at what we will be building. We will style a share button which\
  \ when clicked opens a set of links which allow the user to share the page via email\
  \ or to Facebook, LinkedIn, or Twitter. We will then use transitions to animate\
  \ opening and closing the share options and the hover and focus effect of the individual\
  \ links. Our end goal is shown in Figure 11.1.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_305_0.png)\n\
  \nFigure 11.1: End goal\n\nOur starting HTML (Listing 11.1) consists of a container\
  \ to hold our component, a share button, and a menu to choose what we want to use\
  \ to share the page to. We also have a linked JavaScript file, which makes our component\
  \ usable via keyboard navigation and triggers showing and hiding the links inside\
  \ of the component when the share button is clicked. As we will see later in this\
  \ project, there are a handful of limitations to animating elements using only\n\
  \n\n\nCSS，所以我们将依赖几行 JavaScript 来支持我们的 CSS。我们将在本章后面更详细地介绍 JavaScript；让我们先专注于我们的 HTML\
  \ 和 CSS。\n\n## Listing 11.1 Starting HTML\n\n```\n<main>\n  <div class=\"share\"\
  \ id=\"share\">                          #A\n    <button id=\"shareButton\"    \
  \                      #B\n      class=\"share__button\"                       \
  \    #B\n      type=\"button\"                                   #B\n      aria-controls=\"\
  medialist\"                       #B\n      aria-expanded=\"false\"            \
  \               #B\n      aria-haspopup=\"listbox\">\n      <img src=\"./icons/share.svg\"\
  \ alt=\"\" width=\"24\" height=\"24\">\n      Share\n    </button>\n    <menu aria-labelledby=\"\
  share\" role=\"menu\" id=\"medialist\" class=\"share__menu\"> #C\n      <li role=\"\
  menuitem\" class=\"share__menu-item\">           #D\n        <a href=\"mailto:?subject=Tiny%20...\"\
  \                   #E\n          target=\"_blank\"\n          rel=\"nofollow noopener\"\
  \n          tabindex=\"-1\"\n          class=\"share__link\"\n        >\n      \
  \    <img src=\"./icons/email.svg\" alt=\"Email\" width=\"24\" height=\"24\"> #F\n\
  \        </a>\n      </li>\n      <li role=\"menuitem\" class=\"share__menu-item\"\
  >            #H\n        <a href=\"https://www.facebook.com/sh...\"\n          target=\"\
  _blank\"\n          rel=\"nofollow noopener\"\n          tabindex=\"-1\"\n     \
  \     class=\"share__link\"\n        >\n          <img src=\"./icons/facebook.svg\"\
  \ alt=\"Facebook\" width=\"24\" height=\"24\">\n        </a>\n      </li>\n    \
  \  ...\n    </menu>\n  </div>\n</main>\n<script src=\"./scripts.js\"></script> \
  \                        #G\n```\n\n#A 组件容器\n#B 打开和关闭社交媒体链接列表的分享按钮\n#C 媒体菜单\n#D\
  \ 菜单项\n#E 第一个链接是 mailto，用于通过电子邮件分享而不是社交媒体\n#F 媒体图标\n#G 用于键盘交互和补充 CSS 的脚本\n#H 通过社交媒体分享的链接\n\
  \n我们还对 main 应用了一些非常基础的起始 CSS，以将组件移离屏幕边缘，如下所示：`.main { margin: 48px; }`。\n\n所有起始代码（HTML、CSS\
  \ 和 JavaScript）都可以在 github 上找到：https://github.com/michaelgearon/Tiny-CSS-Projects/tree/main/chapter-11\n\
  \n因此，我们的起点如下所示（图 11.2）\n\n![](img/b56145aa9b751926a7aedbd7172bc818_307_0.png)\n\n\
  图 11.2：起点\n\n正如我们所见，图标已经提供，但让我们讨论一下这些图标的来源以及获取方式。\n\n## 11.3 Sourcing Icons\n\n\
  每当我们使用他人品牌提供的图标时，我们需要考虑\n\n- 1. 我们是否有权使用该图标？\n- 2. 使用该图标有哪些限制？\n\n在社交媒体图标的情况下，其品牌在我们的工作中得到体现，因此我们必须遵循其指南，了解何时、如何以及在何种上下文中使用其品牌。\n\
  \n对于不代表品牌的图标（例如我们为 mailto 链接或分享按钮使用的图标），除非我们自己创建了该图标，否则它受版权法的约束，就像我们在项目中使用的任何其他图像、声音、视频等一样。\n\
  \n> 免责声明 我们不是律师。这不构成法律建议。如有疑问，请咨询法律专业人士。\n\n### 11.3.1 Media Icons\n\n一种有效的方法来了解品牌图标的使用方式是查找该品牌的指南，通过网络搜索“style\
  \ guide”或“brand guide”等术语。许多社交媒体平台都会对品牌如何被体现提供具体说明，包括图标和标志的下载。表 11.1 列出了我们组件中包含的社交媒体平台以及指向其品牌信息的链接。\n\
  \n## Table 11.1: Social media brand resources\n\n| Brand | Icon | Link to assets\
  \ |\n|---|---|---|\n| Facebook |  | https://www.facebook.com/brand/resources/facebookapp/logo/\
  \ |\n| LinkedIn |  | https://brand.linkedin.com/downloads |\n| Twitter |  | https://about.twitter.com/en/who-we-are/brand-toolkit\
  \ |\n\n对于本项目，我们直接从各自的品牌指南中获取了社交媒体图标。\n\n### 11.3.2 Icon libraries\n\n寻找单个图标可能有点繁琐，尤其是在大型项目中，因此使用图标字体和库来提供图标并不罕见。如上所述，这些也受使用条款的约束。每个库和图标字体都有自己的使用规则。有些可能还要求署名，因此我们在获取图标时必须注意遵守需要遵循的任何规则。\n\
  \n对于本项目，我们从 Material Symbols（https://fonts.google.com/icons）获取了非品牌相关的图标。由于我们只需要\
  \ 2 个（share - 和 email -@），我们下载了单独的 SVG 并将它们包含在我们的图标文件夹中，而不是将整个库导入项目。\n\n图标已在起始代码中提供，因此我们准备开始样式设计。\n\
  \n## 11.4 Styling the block\n\n由于我们使用 BEM 作为命名约定，我们的块名称将为 \"share\"。因此，包裹整个组件的容器\
  \ `div` 将具有 `share` 类。此块名称还将使用第 11.1.3 节中提到的 BEM 命名约定包含在我们未来的所有类中，这将把我们的 CSS 限定在该组件中，并有助于防止组件与应用程序中它将被使用的任何其他部分之间的样式冲突。\n\
  \n如 listing 11.2 所示，我们为块定义了 `font-family`、`background` 和 `border-radius`。我们还将组件的\
  \ `display` 值设为 `inline-flex`。`inline-flex` 的工作方式与 `flex` 相同，但使元素成为行内级元素而不是块级元素。通过使我们的组件表现得像一个行内元素（与链接、span、按钮相同...），我们赋予它在被包含到应用程序中时在放置方面的最大灵活性。此外，按钮默认是行内元素，而在关闭时，所呈现的内容本质上是一个按钮，因此我们将赋予它与按钮相同的流行为。\n\
  \n> 注意：FLEXBOX 如需复习 Flexbox 的工作原理及其相关属性，请查看第 6 章：创建个人资料卡。\n\n## Listing 11.2 Styling\
  \ the container\n\n```\n.share {\n  font-family: Verdana, Geneva, Tahoma, sans-serif;\n\
  \  background: #ffe46a; #A\n  border-radius: 36px;\n  display: inline-flex;\n}\n\
  ```\n\n#A 黄色\n\n块已样式化（图 11.3）后，让我们处理块内的各个元素。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_309_0.png)\n\
  \n图 11.3：样式化的容器\n\n## 11.5 Styling the elements\n\n我们的块有 3 个后代元素需要样式化：\n\n- 1. 分享按钮\n\
  - 2. 包含链接列表的菜单\n- 3. 单个链接\n\n让我们从分享按钮开始，然后依次向下处理。\n\n### 11.5.1 Share button\n\n\
  分配给按钮的类名将包括块名称，后跟两个下划线，然后是元素。在我们的例子中，我们将此元素称为“button”。因此我们的类名将为：share__button。通过在类名前加上\
  \ share__，我们确保我们样式化的唯一按钮是我们块内的按钮。\n\n我们希望覆盖浏览器提供的默认值并在其中对齐图标和文本（Listing 11.3）。我们移除背景和边框，调整字体大小和内边距，并使角部圆润。\n\
  \n为了对齐图标和文本，我们将按钮的 display 值设为 flex，然后使用 `align-items` 垂直对齐图标和文本。为了在图标和文本之间添加空白，我们使用\
  \ `gap` 属性。\n\n## Listing 11.3 Styling the share button\n\n```\n.share_button {\n\
  \  background: none;\n  border: none;\n  font-size: 1rem;\n  padding: 0 2rem 0 1.5rem;\n\
  \  border-radius: 36px;\n  display: flex;\n  align-items: center;\n  gap: 1ch;\n\
  }\n```\n\n图 11.4 显示了我们的输出\n\n![](img/b56145aa9b751926a7aedbd7172bc818_310_0.png)\n\
  \n图 11.4：样式化的分享按钮\n\n接下来让我们处理悬停和焦点样式。我们使用 `:hover` 和 `:focus-visible` 伪类有条件地更改光标样式并为按钮添加黑色轮廓。然后我们将轮廓偏移\
  \ `-5px`，使轮廓放置在按钮内部 5 像素处，而不是在外边缘。\n\n`outline-offset` 属性允许我们控制轮廓的放置位置。正数会将轮廓移得更远或远离元素，而负数会使轮廓内嵌。\n\
  \nListing 11.4 显示了我们的悬停和焦点 CSS。\n\n\n\n\n\n## Listing 11.4 Share button hover and\
  \ focus CSS\n\n```\n.share__button:hover,\n.share__button:focus-visible {\n  cursor:\
  \ pointer;\n  outline: solid 1px black;\n  outline-offset: -5px;\n}\n```\n\nFigure\
  \ 11.5 shows our button being hovered over with the mouse.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_311_0.png)\n\
  \nFigure 11.5: Share button hover\n\n## 11.5.2 Share menu\n\nTo style the menu and\
  \ its items, we want to remove the bullets and then place the elements in a row\
  \ beside the button.\n\nTo remove the bullet, we give the list items a list-style\
  \ value of none.\n\nWe then give the menu a display property value of flex, and\
  \ remove the default margin and padding the browser automatically applies to the\
  \ menu item.\n\nListing 11.5 shows our CSS.\n\n## Listing 11.5 Share menu and menu\
  \ items\n\n```\n.share__menu-item { list-style: none }\n\n.share__menu {\n  display:\
  \ flex;\n  margin: 0;\n  padding: 0;\n}\n```\n\nWhen we look at our output (Figure\
  \ 11.6) we notice that we are in need of some space between the edge of our container\
  \ and our elements. We will handle this next as part of styling the individual links.\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_312_0.png)\n\nFigure 11.6: Styled menu\n\
  \n## 11.5.3 Share links\n\nTo make sure the links have a circle border on hover\
  \ (rather than an ellipse) we will set their height and width equal to each other.\
  \ We set them both to 48px. We then curve their corners. This will also resolve\
  \ our spacing issue because as we see in the HTML (Listing 11.6) we have set the\
  \ icon height and width to 24. Since we are making the link 48 pixels in height\
  \ width, once centered, our links will have 12 pixels of whitespace between the\
  \ icon and the edge of the link.\n\n## Listing 11.6 Styling the links\n\n```\n<li\
  \ role=\"menuitem\" class=\"share__menu-item\">\n  <a href=\"https://www.facebook.com/sha...\"\
  \n    target=\"_blank\"\n    rel=\"nofollow noopener\"\n    tabindex=\"-1\"\n  \
  \  class=\"share__link\"\n  >\n    <img src=\"./icons/facebook.svg\" alt=\"Facebook\"\
  \ width=\"24\" height=\"24\">\n  </a>\n</li>\n```\n\nWe also give the links a transparent\
  \ border. Borders take up space, so in order to prevent the content from shifting\
  \ on hover or focus when we expose the border, we add a transparent border by default\
  \ and then color it when we want to show it. This ensures that the space needed\
  \ for the border is allotted for and prevents the content succeeding the element\
  \ from shifting when the border is exposed.\n\nTo center the icon in the middle\
  \ of the circle we use flex, justifying the content and aligning the items to the\
  \ center. Our CSS therefore looks as follows (listing 11.7):\n\n## Listing 11.7\
  \ Styling the links\n\n```\n.share__link:link,\n.share__link:visited {\n  height:\
  \ 48px;\n  width: 48px;\n  border-radius: 50%;\n  display: flex;\n  align-items:\
  \ center;\n  justify-content: center;\n}\n```\n\nWith our links styled (Figure 11.7),\
  \ we can now style the links when hovered or focused.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_313_0.png)\n\
  \nFigure 11.7: Styled share links\n\n## 11.5.4 Scale()\n\nOn hover and focus we\
  \ are going to want to expose the border by changing its color from transparent\
  \ to black. When we set the border on the links, we used the border shorthand property\
  \ which allows us to, in one declaration, define the style, border width and, border\
  \ color. Since we are only changing the color, we will use border-color rather than\
  \ the border shorthand. By using border-color we can edit the border’s color without\
  \ having to worry about the rest of the already defined properties.\n\nWe are also\
  \ going to increase the size of the icon to make it look like it has been magnified\
  \ using the scale() function. In Chapter 2, while expanding the loader bars, we\
  \ used scaleY(), which grew and shrunk the bar vertically. However, we want our\
  \ links to grow proportionally; we will therefore use scale() which, when passed\
  \ a singular parameter, will grow the element both horizontally and vertically proportionally\
  \ by the same amount.\n\nThe scale() function is actually the shorthand for combining\
  \ scaleX() and scaleY(). If only one value is passed, the scale amount is applied\
  \ both vertically and horizontally. If 2 parameters are passed, the first parameter\
  \ will define the horizontal scale, and the second the vertical.\n\nOn hover or\
  \ focus we want the link to be 25% larger than when not being interacted with. We\
  \ will therefore give our function a single parameter of 1.25 and apply it to the\
  \ transform property. Our CSS will therefore look as follows (Listing 11.8):\n\n\
  ## Listing 11.8 Styling the links\n\n```\n.share__link:hover,\n.share__link:focus-visible\
  \ {\n  border-color: black;\n  outline: none;\n  transform: scale(1.25);\n}\n```\n\
  \nWith the styles applied, on hover (Figure 11.8) our links grow, but because the\
  \ link is now taller than the container there is a gap on the top and bottom of\
  \ the link that does not have the yellow background.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_314_0.png)\n\
  \nFigure 11.8: Link on hover\n\nTo create our magnification effect, we want the\
  \ entire link to remain yellow. We can add a yellow background to the link, which\
  \ would accomplish our need; however, the reason the background needs to be yellow\
  \ is because the block’s background color is yellow. If we were to change the background\
  \ color of the container we would want the link’s background color to also change.\n\
  \nTo make sure the colors stay in sync we could use a custom property (CSS variable)\
  \ or we can make the element inherit the color from its parent.\n\n## 11.5.5 The\
  \ inherit property value\n\nBackground-color is not inherited by default. As we\
  \ have demonstrated above, it is not because an ancestor has a background color\
  \ that its descendant automatically has the background color as well. We want to\
  \ force this to happen. To force background-color to be inherited from its parent\
  \ we can set the background-color property value for the link to inherit. Inherit,\
  \ however, only goes up to the parent. In our case, the element that controls the\
  \ background color is the link’s great grandparent as seen in Figure 11.9.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_314_1.png)\n\
  \nFigure 11.9: Ancestors of the media links\n\nWe need to make the link, menu, and\
  \ menu-item rules inherit the background color in order to make it trickle down\
  \ to the link. Once we give all 3 elements a background-color value of inherit (Figure\
  \ 10), we notice that although we fixed our gap in the link being hovered, we lose\
  \ our curve on the right side of the component.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_315_0.png)\n\
  \nFigure 11.10: Inherited background color\n\nWe lose our curve because just like\
  \ `background-color`, `border-radius` is not inherited. To fix the issue, we apply\
  \ the same logic we did for the `background-color` to `border-radius`. Our edited\
  \ CSS therefore looks as follows seen in Listing 11.9. Notice that the `border-radius`\
  \ of the link was not edited. We want to keep the link’s shape as a circle, so we\
  \ keep the `border-radius: 50%` declaration on the link.\n\n## Listing 11.9 Inheriting\
  \ property values\n\n```\n.share__menu-item {\n  list-style: none;\n  background:\
  \ inherit;\n  border-radius: inherit;\n}\n\n.share__menu {\n  display: flex;\n \
  \ margin: 0;\n  padding: 0;\n  background: inherit;\n  border-radius: inherit;\n\
  }\n\n.share__link:link,\n.share__link:visited {\n  height: 48px;\n  width: 48px;\n\
  \  border: solid 1px transparent;\n  border-radius: 50%; #A\n  display: flex;\n\
  \  align-items: center;\n  justify-content: center;\n  background: inherit;\n}\n\
  ```\n\n#A Makes the link a circle\n\nAlthough inheriting values in this manner can\
  \ be a bit cumbersome, it will allow us to make sure that the color is controlled\
  \ from one place. This benefits maintainability in case we decide we want to change\
  \ the background’s color and sets us up to easily expand our component to support\
  \ multiple themes.\n\nWith the `border-radius` and `background-color` inherited,\
  \ our hover and focus styles are now complete (Figure 11.11) but the change when\
  \ we hover over the link is very abrupt. Let’s animate the size change.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_316_0.png)\n\
  \nFigure 11.11: Share link hover effect\n\n## 11.6 Animating the component\n\nIn\
  \ Chapter 2 we used keyframes to create animation. This allowed us to define steps\
  \ for our animation. For our hover we already have our start and end states defined.\
  \ We are transitioning from one state (not hovered or focused) to another (hovered\
  \ or focused), whose styles are already defined in rules so instead of using an\
  \ animation we are going to use a transition.\n\n## 11.6.1 Transition\n\nA transition\
  \ does not require a keyframe, and allows us to animate the change of styles from\
  \ one state to another. The transition property allows us to define which property\
  \ changes should be animated, the duration, and timing function. By adding `transition:\
  \ transform ease-in-out 250ms;` to our `.share__link` rules we tell the browser\
  \ to animate the size change of our link (listing 11.10).\n\nTo choose the amount\
  \ of time the transition needs to take, we choose something relatively fast: 250\
  \ milliseconds. We want to keep the animation slow enough to be seen but fast enough\
  \ to keep it snappy. If we make the transition too slow it will make our project\
  \ look laggy and distract the user from performing the task they are trying to accomplish\
  \ (share the content).\n\n\n\n\n\n## Listing 11.10 转换链接大小变化\n\n```\n.share__link:link,\n\
  .share__link:visited {\n  text-decoration: none;\n  display: flex;\n  flex-direction:\
  \ column;\n  align-items: center;\n  justify-content: center;\n  height: 48px;\n\
  \  width: 48px;\n  border-radius: 50%;\n  border: solid 1px transparent;\n  transition:\
  \ transform ease-in-out 250ms;\n}\n\n.share__link:hover,\n.share__link:focus-visible\
  \ {\n  border-color: black;\n  outline: none;\n  transform: scale(1.25);\n  background:rgb(255,\
  \ 228, 106);\n}\n```\n\n在我们的过渡中，我们明确告诉浏览器对 `transform` 属性发生的变化进行动画处理，但在我们的 `.share__link:link`、`.share__link:visited`\
  \ 规则中并没有 `transform` 属性。当我们运行代码时，我们注意到大小变化是被动画化的，并且代码确实有效。这是因为在未定义时，默认情况下 scale\
  \ 等于 `scale(1)`。因此，当我们悬停或聚焦链接时，我们会从 `scale(1)` 动画到 `scale(1.25)`，然后在移开链接时将比例动画回\
  \ `scale(1)`。\n\n接下来我们将通过点击按钮来动画隐藏和显示链接。\n\n## 11.6.2 打开和关闭组件\n\n请记住，我们的最终目标是默认情况下组件隐藏我们的链接菜单，只有在点击按钮后才显示它们（图\
  \ 11.12）。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_317_0.png)\n\n图 11.12：关闭（左）和展开（右）状态\n\
  \n我们需要做的第一件事是默认隐藏菜单项。为此，我们将为菜单设置 `width` 为 `0` 并隐藏 `overflow`（列表 11.11）。\n\n## Listing\
  \ 11.11 隐藏菜单\n\n```\n.share_menu {\n  display: flex;\n  margin: 0;\n  padding: 0;\n\
  \  background: inherit;\n  border-radius: inherit;\n  width: 0;\n  overflow: hidden;\n\
  }\n```\n\n菜单隐藏后（图 11.13），我们现在需要在点击按钮时切换显示和隐藏菜单。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_318_0.png)\n\
  \n# 图 11.13：隐藏菜单\n\n我们的 JavaScript 为我们处理了部分行为。本章开始时我们提到过这个项目需要一些 JavaScript（列表 11.12）。当我们打开文件时，我们注意到里面有很多代码。\n\
  \n## Listing 11.12 JavaScript 文件\n\n```\n(() => {\n'use strict';\n\nlet expanded\
  \ = false;\nconst container = document.getElementById('share');\nconst shareButton\
  \ = document.getElementById('shareButton');\nconst menuItems = Array.from(container.querySelectorAll('li'));\n\
  const menu = container.querySelector('menu');\n\naddButtonListeners();\naddListListeners();\n\
  addTransitionListeners();\n\nfunction addButtonListeners() {                   \
  \       #A\n  shareButton.addEventListener('click', toggleMenu);     #A\n  shareButton.addEventListener('keyup',\
  \ handleToggleButtonKeypress);  #A\n}                                          \
  \               #A\n\nfunction addListListeners() {                            #B\n\
  \  menuItems.forEach(li => {                              #B\n    const link = li.querySelector('a');\
  \                  #B\n    link.addEventListener('keyup', handleMenuItemKeypress);\
  \  #B\n    link.addEventListener('keydown', handleTab);         #B\n    link.addEventListener('click',\
  \ toggleMenu);          #B\n  })                                               \
  \      #B\n}                                                         #B\n\nfunction\
  \ addTransitionListeners() {                      #C\n  menu.addEventListener('transitionstart',\
  \ handleAnimationStart);  #C\n  menu.addEventListener('transitionend', handleAnimationEnd);\
  \      #C\n}                                                         #C\n\nfunction\
  \ handleToggleButtonKeypress(event) {             #D\n  switch(event.key) {    \
  \                                #D\n    case 'ArrowDown':                     \
  \               #D\n      if (!expanded) { toggleMenu(); }                   #D\n\
  \      moveToNext();                                      #D\n      break;     \
  \                                        #D\n    case 'ArrowUp':               \
  \                       #D\n      if (expanded) { toggleMenu(); }              \
  \      #D\n      break;                                             #D\n  }    \
  \                                                  #D\n}                       \
  \                                  #D\n\nfunction handleMenuItemKeypress(event)\
  \ {                 #E\n  switch(event.key) {                                  \
  \  #E\n    case 'ArrowDown':                                    #E\n      moveToNext();\
  \                                      #E\n      break;                        \
  \                     #E\n    case 'ArrowUp':                                  \
  \    #E\n      if (event.altKey === true) {                       #E\n        navigate(event);\
  \                                  #E\n        toggleMenu();                   \
  \                  #E\n      } else {                                          \
  \ #E\n        moveToPrevious();                                 #E\n      }    \
  \                                              #E\n      break;                \
  \                             #E\n```\n\n```\ncase 'Enter':\n    toggleMenu();\n\
  \    break;\ncase '':\n    navigate(event);\n    toggleMenu();\n    break;\ncase\
  \ 'Tab':\n    event.preventDefault();\n    toggleMenu();\n    break;\ncase 'Escape':\n\
  \    toggleMenu();\n    break;\ncase 'Home':\n    moveToNext(0);\n    break;\ncase\
  \ 'End':\n    moveToNext(menuItems.length - 1);\n    break;\n}\n}\n\nfunction handleTab(event)\
  \ {\n    if (event.key !== 'Tab') { return; }\n    event.preventDefault();\n}\n\n\
  function toggleMenu(event) {\n    expanded = !expanded;\n    shareButton.ariaExpanded\
  \ = expanded;\n    container.classList.toggle('share_expanded');\n    if (expanded)\
  \ {\n        menuItems.forEach(li => li.removeAttribute('tabindex'));\n    }\n \
  \   if (!expanded) {\n        menuItems.forEach(li => {\n            li.removeAttribute('data-current');\n\
  \            li.tabIndex = -1;\n        })\n        shareButton.focus();\n    }\n\
  }\n\nfunction moveToNext(next = undefined) {\n    const selectedIndex = menuItems.findIndex(li\
  \ => li.dataset.current === 'true');\n\n    let newIndex\n    if (next) {\n    \
  \    newIndex = next;\n    } else if (selectedIndex === -1 || selectedIndex ===\
  \ menuItems.length - 1) {\n        newIndex = 0;\n    }\n    else {\n        newIndex\
  \ = selectedIndex + 1;\n    }\n\n    if (selectedIndex !== -1) {\n        menuItems[selectedIndex].removeAttribute('data-current');\n\
  \n```\n}\n    menuItems[newIndex].setAttribute('data-current', 'true');\n    menuItems[newIndex].querySelector('a').focus();\n\
  }\n\nfunction moveToPrevious() {\n    const selectedIndex = menuItems.findIndex(li\
  \ => li.dataset.current);\n    const newIndex = selectedIndex < 1 ? menuItems.length\
  \ - 1 : selectedIndex - 1;\n    if (selectedIndex != -1) {\n        menuItems[selectedIndex].removeAttribute('data-current');\n\
  \    }\n    menuItems[newIndex].setAttribute('data-current', 'true');\n    menuItems[newIndex].querySelector('a').focus();\n\
  }\n\nfunction navigate(event) {\n    const url = event.target.href;\n    window.open(url);\n\
  }\n\nfunction handleAnimationStart() {\n    if (!expanded) { menu.style.overflow\
  \ = 'hidden' ;}\n}\n\nfunction handleAnimationEnd() {\n    if (expanded) { menu.style.overflow\
  \ = 'visible' }\n}\n})()\n```\n\n#A 为分享按钮添加事件监听器，用于点击和按键以通过键盘和鼠标打开和关闭菜单\n#B 为链接添加事件监听，为菜单内的键盘导航处理点击和按键\n\
  #C 为菜单添加事件监听，以便知道过渡何时开始和结束\n#D 处理分享按钮的键盘上下箭头功能\n#E 处理链接上的按键，用于菜单内的键盘导航，包括退出菜单\n\
  #F 防止 Tab 在链接之间导航，因为在 Tab 时我们希望将焦点返回到分享按钮而不是转到下一个链接\n#G 打开和关闭菜单\n#H 当 next 已定义时，按索引将焦点移动到特定项目。否则将循环浏览链接，在用户到达菜单最后一项时返回顶部\n\
  #I 将焦点移动到上一个链接，并在用户到达菜单第一项时返回列表底部\n#J 当操作由键盘触发而非默认点击或回车时导航用户。当用户在菜单项上按下空格键时使用\n\
  #K 在菜单关闭时隐藏溢出\n#L 如果打开，我们显示溢出以允许放大图标在容器外部扩展\n\n大部分代码用于处理组件的键盘可访问性，而列表 11.13 显示了与按钮点击相关的部分。当页面加载时，我们默认将组件设置为关闭状态并找到元素的容器，我们将其分配给\
  \ `container` 变量。然后我们为按钮添加事件监听器，以便在点击按钮时触发 `toggleMenu()` 函数。\n\n当按钮被点击时，我们将 `expanded`\
  \ 变量更改为其相反值。如果它是 `true`，它将变为 `false`，反之亦然。然后我们添加或移除\n\n\n\nthe container. classList.toggle()\
  \ will add the class if it's not currently present on the element and remove it\
  \ if it already is.\n\n## Listing 11.13 Opening and closing the menu (JS)\n\n```\n\
  (() => {\n  ...\n  let expanded = false; #A\n  const container = document.getElementById('share');\
  \ #B\n  ...\n  function addButtonListeners() {          #C\n    shareButton.addEventListener('click',\
  \ toggleMenu);   #C\n    ...                                     #C\n  }       \
  \                                  #C\n\n  function toggleMenu(event) {\n    expanded\
  \ = !expanded; #D\n    ...\n    container.classList.toggle('share_expanded'); #E\n\
  \    ...\n    ...\n  }\n}\n```\n\n- #A defines a variable to hold our current state\n\
  - #B defines a variable for our HTML container element\n- #C defines what happens\
  \ when the button is clicked\n- #D toggles the expanded variable value\n- #E handles\
  \ adding and removing the share_expanded\n\nNOTE JS IS ALREADY IN THE STARTER CODE\
  \ Since this is a CSS book, the JS has already been included in the starter code.\
  \ If you are following along, you don't need to make any edits to the JS, it should\
  \ just work.\n\nAll put together this code makes it so that when the button is clicked\
  \ we add the share_expanded class to the container. If it is already open we remove\
  \ it. We had hidden our menu items, we will now show them when the share_expanded\
  \ class is present.\n\nNOTE CLASSE NAME SHARE_EXPANDED Remember that we decided\
  \ we were going to use BEM for our class name convention. Notice that our class\
  \ name only has one underscore. This is because expanded is our modifier. We use\
  \ a modifier because we are changing (modifying) the style based on the state (open\
  \ / close). We have the block (share) and the modifier (expanded); therefore our\
  \ class name is block_modifier or share_expanded.\n\nTo hide our menu we used the\
  \ width property with a value of 0 and hide the overflow (Listing 11.14).\n\n##\
  \ Listing 11.14 Hiding the menu\n\n```\n.share__menu {\n  display: flex;\n  margin:\
  \ 0;\n  padding: 0;\n  background: inherit;\n  border-radius: inherit;\n  width:\
  \ 0;          #A\n  overflow: hidden;  #B\n}\n```\n\n#A makes the width of the menu\
  \ equal to 0\n#B hides the overflow so that the links within are also hidden\n\n\
  To show the links when the component is marked as expanded we must increase our\
  \ width of the menu as seen in Listing 11.15. We also add a little bit of horizontal\
  \ padding to add some room round the menu.\n\nTo calculate the width of the menu\
  \ we take the number of links and multiply by their width. The link’s width is 48\
  \ pixels (that we hard set) plus the border (1 pixel on each side). Therefore the\
  \ menu’s width is width = 4×(48 + 2) = 200px.\n\n## Listing 11.15 Showing the menu\n\
  \n```\n.share_expanded .share__menu {\n  width: 200px;\n  padding: 0 2rem 0 1rem;\n\
  }\n```\n\nRunning the code, after clicking the button and hovering over the link\
  \ we can see that our link no longer expands outside of our menu (Figure 11.14).\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_323_0.png)\n\n![](img/b56145aa9b751926a7aedbd7172bc818_323_1.png)\n\
  \nFigure 11.14: Expanded component on click\n\nThe reason we no longer expand outside\
  \ of the background like we did initially is because we added overflow: hidden to\
  \ our menu in order to hide the links when the menu was given a width of 0. We must\
  \ therefore set the overflow back to visible once we are expanded. Listing 11.16\
  \ shows our updated rule.\n\n## Listing 11.16 Showing the menu\n\n```\n.share_expanded\
  \ .share__menu {\n  width: 200px;\n  padding: 0 2rem 0 1rem;\n  overflow: visible;\n\
  }\n```\n\nWith the overflow reinstated, our magnification effect is restored (Figure\
  \ 11.15). The next piece is to maintain the button outline that is usually present\
  \ on hover, when the component is open.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_324_0.png)\n\
  \n# Figure 11.15: Open component with the overflow reinstated\n\nSince we already\
  \ have a rule written on hover and focus to add the border, we are going to append\
  \ the rule to also trigger when the component is open. By reusing the same rule\
  \ we ensure that the styles will be consistent when being hovered, focused, or when\
  \ the list is visible. To add the condition, we add the .share_expanded .share__button\
  \ selector to the existing rule (Listing 11.17).\n\n## Listing 11.17 Adding the\
  \ button border to share button when list is showing\n\n```\n.share__button:hover,\n\
  .share__button:focus-visible,\n.share_expanded .share__button {\n  cursor: pointer;\n\
  \  outline: solid 1px black;\n  outline-offset: -5px;\n}\n```\n\nWith the selector\
  \ added, our button now keeps its border once the component is expanded (Figure\
  \ 11.16) and when closed and not focused or hovered, we see that the border stays\
  \ absent.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_324_1.png)\n\n# Figure 11.16:\
  \ Maintaining the share button border when list is showing\n\n## 11.6.3 Animating\
  \ the menu\n\nNow that we have our styles set for both open and closed, let’s animate\
  \ the showing and hiding of the menu. We want the link list to expand from the left\
  \ as depicted in Figure 11.17.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_325_0.png)\n\
  \nFigure 11.17: Breakdown of opening animation\n\nWhen the menu closes we will want\
  \ to perform the inverse of the opening animation, retracting the menu hiding the\
  \ link as we go.\n\nSame as for the magnification effect we added to the links,\
  \ we are going to use a transition. We don’t need to use keyframes because the animation\
  \ is only going to be performed once when the button is clicked, and we already\
  \ have the 2 states defined.\n\nWe will add the transition declaration to the menu\
  \ as follows: `transition: width 250ms ease-in-out`. Again we want to keep the transition\
  \ snappy so we give it a 250 millisecond duration.\n\nOnce we add the transition\
  \ we realize that icons are becoming visible before they should. Figure 11.18 breaks\
  \ down the effect.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_326_0.png)\n\nFigure\
  \ 11.18: Icons displaying too soon\n\nEven if we change the transition to transition\
  \ all properties instead of just width, the same issue occurs. The root cause is\
  \ overflow. When the menu is closed, we want the menu’s overflow to be hidden. When\
  \ it is open, we want it to be visible. However, overflow is not something that\
  \ can be gradually changed like width. It is either visible or it’s not—there is\
  \ no in between.\n\nWhen opening the menu, we want to wait until the transition\
  \ is done before we change overflow to visible. When we close, we want the overflow\
  \ to be hidden immediately. This is where we turn to JavaScript to support our CSS.\n\
  \nWe will remove overflow: visible from our .share_expanded .share__menu class and\
  \ handle adding it via JavaScript.\n\nListing 11.18 singles out the relevant JavaScript\
  \ for handling the overflow. The magic lies in the transitionstart and transitionend\
  \ event listeners. Attached to the menu, they listen for when the transition is\
  \ triggered and when it is done performing the change. Upon the event happening,\
  \ they trigger their respective functions which handle the overflow for the menu.\n\
  \n## Listing 11.18 JavaScript for handling overflow\n\n```\n(() => {\n'use strict';\n\
  \nlet expanded = false;\nconst container = document.getElementById('share');\nconst\
  \ menu = container.querySelector('menu');\n...\naddTransitionListeners();\n...\n\
  function addTransitionListeners() {\n  menu.addEventListener('transitionstart',\
  \ handleAnimationStart);\n  menu.addEventListener('transitionend', handleAnimationEnd);\n\
  }\n...\nfunction handleAnimationStart() { #A\n  if (!expanded) { menu.style.overflow\
  \ = 'hidden'; } #B\n}\n...\nfunction handleAnimationEnd() { #C\n  if (expanded)\
  \ { menu.style.overflow = 'visible'; } #D\n}\n})()\n```\n\n#A Is triggered when\
  \ the transition starts\n#B If in the process of closing, we hide the menu's overflow\n\
  #C Is triggered when the transition ends\n#D If just opened, we show the overflow\n\
  \nNOTE JS IS ALREADY IN THE STARTER CODE Same as earlier in the chapter, since this\
  \ is a CSS book, the JS has already been included in the starter code. If you are\
  \ following along, you don't need to make any edits to the JS, it should just work.\n\
  \nAll put together the CSS needed to make the animation work is found in Listing\
  \ 11.19:\n\n\n\n\n\n## 上例 11.19 用于打开和关闭动画的更新 CSS\n\n```\n.share__menu {\n  display:\
  \ flex;\n  margin: 0;\n  padding: 0;\n  background: inherit;\n  border-radius: inherit;\n\
  \  width: 0;\n  overflow: hidden;\n  transition: width 250ms ease-in-out; #A\n}\n\
  \n.share_expanded .share__menu {\n  width: 200px;\n  padding: 0 2rem 0 1rem;\n \
  \ overflow: visible; #B\n}\n```\n\n#A 添加动画\n#B 由于我们通过 JS 处理，因此从 CSS 中移除 overflow\
  \ 处理\n\n完成这些最后的修改以使动画流畅后，我们已完成了动画社交媒体分享组件。最终产品如 图 11.19 所示。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_328_0.png)\n\
  \n图 11.19：最终产品\n\n## 11.7 总结\n\n- 有多种方式组织 CSS，三个常见模式是 OOCSS、SMACSS 和 BEM\n- 图标受版权保护\n\
  - 使用社交媒体图标时请遵循品牌指南\n- 我们可以通过使用 `inline-flex` 使 flex 元素表现为行内级元素\n- `inline-flex`\
  \ 使用的属性与 `flex` 相同\n- outline 的位置可以通过 `outline-offset` 控制\n- `scale()` 函数允许我们按比例放大或缩小元素\n\
  - `inherit` 属性值允许我们继承父元素中通常不会被继承的值\n- 过渡不需要关键帧\n- 过渡允许我们从一种状态到另一种状态动画化 CSS 变化\n\
  - `overflow` 属性允许我们控制超出其容器的元素是否应被显示或隐藏\n- 当使用 JavaScript 扩展过渡功能时，我们可以使用 `ontransitionstart`\
  \ 和 `ontransitionend` 事件监听器来触发对过渡生命周期的响应 JavaScript 变化\n\n"

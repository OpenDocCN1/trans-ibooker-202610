- "# 微型 CSS 项目 - MEAP 版本 8\n\n\n\n\n\n\n\n\n\n![](img/b56145aa9b751926a7aedbd7172bc818_0_0.png)\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_1_0.png)\n\n\n\n\n\n## welcome\n\n感谢您购买\
  \ *Tiny CSS Projects* 的 MEAP。为了从本书中获得最大收益，您需要熟悉 HTML 和 CSS 以及如何在基础网页项目中导航。我们将共同在您现有知识的基础上进行构建，并深入探讨\
  \ CSS。\n\n本书最棒的部分之一是每个章节都是一个独立的项目，每个章节都侧重于不同的 CSS 主题。这使您能够通过实践学习，而不是假设性的概念。我们也鼓励您在自己的项目中尝试所学内容，从网络上汲取灵感并利用新获得的知识重新创建。\n\
  \n要充分利用本书，最重要的是要有创造力，第一次做不到也没关系。CSS 是一种有趣的语言，因为它是视觉化的，您可以立即看到更改，并且在大多数情况下，您可以看到何时出现问题。\n\
  \nCSS 从未处于更好的状态，在过去几年中，布局特性如 grid 和 flexbox、动画、过渡、媒体查询等已被引入并不断扩展，我们将对此进行探讨。与此同时，像\
  \ Internet Explorer 这样的旧浏览器已经逐渐淘汰，浏览器支持也更加一致。\n\n我们希望您在完成这些项目时能觉得本书有用、有趣且引人入胜，并对\
  \ CSS 的现状有良好的理解。\n\n如果您有任何问题、评论或建议，请在 Manning 的 [liveBook Discussion forum](https://livebook.manning.com)\
  \ 中分享我们的书籍：\n\n—Michael Gearon and Martine Dowden\n\n\n\n## 1\n\n## CSS introduction\n\
  \n### This chapter covers\n\n- A brief overview of CSS\n- Basic CSS styling\n- Selecting\
  \ HTML elements effectively\n\nCascading Style Sheets (CSS)，用于控制网页元素的外观。它使用称为样式规则的语法结构来指示浏览器选择某些元素并对其应用视觉品质和效果。\n\
  \n如果您是 CSS 新手或需要复习，章节 1 是一个不错的起点。我们将从 CSS 的简要历史开始。然后迅速进入如何开始使用 CSS，查看将 CSS 与 HTML\
  \ 关联的方法。\n\n一旦我们的 CSS 运行起来，我们将通过创建一个具有基本媒体组件如标题、内容和图像的单列静态文章页面来了解 CSS 的结构，并看看它们是如何协同工作的。\n\
  \n### 1.1 Overview\n\nHåkon Wium Lie 于 1994 年首次提出 CSS 的想法，比 Tim Berners-Lee 于 1990\
  \ 年创建 HTML 晚了几年。CSS 被引入是为了通过颜色、布局和排版的选项将样式与网页内容分离。\n\n#### 1.1.1 Separation of Concerns\n\
  \n这种内容与表现的分离基于设计原则 Separation of Concerns (SoC)。其背后的想法是计算机程序或应用程序应被分解为独立的、不同的部分，按目的进行隔离。\n\
  \n保持良好 SoC 的好处包括\n\n- 减少代码重复，因此更易于维护\n- 可扩展性，因为它要求元素专注于单一目的\n- 稳定性，因为代码更易于维护和测试\n\
  \n考虑到这一原则，HTML 作为网页的结构和内容，CSS 是表现，Javascript 提供额外的功能，三者共同构成网页。图 1.1 显示了这一过程的图表。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_5_0.png)\n\n图 1.1 网页的分解\n\n自 2000 年代中期智能手机引入以来，网络随后扩展到响应式和自适应设计，以及移动网站，这些网站通常比桌面体验功能更少。这些移动网站通常位于\
  \ m.example.com 等子域上。关于我们是否应该创建响应式和自适应网站还是移动专用网站，各有利弊。\n\n总体而言，响应式和自适应似乎是前进的方向——尤其是随着\
  \ CSS 的扩展，使我们能够根据窗口大小和媒体类型应用 CSS。\n\n自 1994 年首次宣布 CSS 以来，CSS 共有三次整体发布：\n\n- 1996\
  \ 年发布的 CSS1\n- 1998 年发布的 CSS2\n- 1999 年发布的 CSS3\n\n1999 年之后，发布策略发生了变化，以允许更快、更频繁地发布新功能。现在它被分为模块，编号级别从一级开始一直到五级。CSS\
  \ 一级模块是 CSS 中全新的东西，例如从未存在过的属性。一些例子是遮罩模块或多列模块，我们将在本书后面探讨。\n\n已经经过几个版本并达到 5 级的模块有：媒体查询、颜色、字体，以及级联和继承模块。\n\
  \n将 CSS 分成模块的好处是每个部分可以独立移动，而不是大规模的 sweeping 更改。然而，有一些讨论认为需要有人宣布我们现在处于 CSS4 阶段，即使只是为了承认自\
  \ 1999 年以来 CSS 发生了很大变化。\n\n## 1.1.2 What is CSS?\n\nCSS 是一种领域特定语言 (DSL)。DSL 是专门创建用于解决特定问题的语言。它们通常比\
  \ Java 或 C# 等通用语言 (GPL) 更简单。CSS 的特定目的是为网页内容设置样式。SQL、HTML 和 XPath 等语言也是 DSL。\n\n\
  CSS 也是一种声明式编程语言。这意味着代码告诉浏览器需要做什么而不是如何做。例如，我们的代码说我们希望此标题为红色，然后浏览器确定如何实现。\n\n这很有用，因为，如果我们想增加段落的行高以改善阅读体验，浏览器将负责确定该行高的新布局、大小和格式，从而减少开发人员的工作量。\n\
  \n自 1994 年以来，CSS 已经走得很远。现在有办法为元素设置动画和过渡、创建运动路径以对 SVG 图形进行动画处理，并根据视口大小有条件地应用样式。此类功能过去只能通过\
  \ JavaScript 或 Flash（现已退役）实现。\n\n在过去，设计选择如透明度、圆角边框、遮罩和混合是可行的，但需要非常规的 CSS 技术和“hack”。随着\
  \ CSS 的发展，属性被添加以用标准、记录的功能取代这些 hack。可以说 CSS 正处于黄金时代。随着语言的持续发展，创造新颖和创造性体验的机会几乎是无限的。\n\
  \n### 1.2 Getting started with CSS by creating an article layout\n\n在我们的第一个项目中，我们将探索网络上常见的用例，创建单列文章。本章将重点介绍如何将\
  \ CSS 链接到 HTML，然后探索我们可以用来设置 HTML 样式的选择器。\n\n我们首先需要了解的是如何将 CSS 与 HTML 关联以及如何选择元素，然后我们就可以担心要应用哪些属性和值。让我们回顾一些基础知识。\n\
  \n#### 1.2.1 Setup\n\n如果您是编码新手，那么有几种通常免费的工具可用于这些项目。您可以选择在线编码，也可以在计算机上使用代码编辑器，例如：\n\
  \n\n\n- Sublime: https://www.sublimetext.com\n- Brackets: https://brackets.io\n\
  - Visual Studio Code: https://code.visualstudio.com\n- 基本文本编辑器，例如\n  - TextEdit（Mac）\n\
  \  - Notepad（Windows）\n  - Gedit（Linux）\n\n你也可以使用免费的在线开发编辑器，如 CodePen(https://codepen.io)。在线开发编辑器是测试想法和为前端项目提供快速便捷访问的绝佳方式。\n\
  \n一旦你在电脑上安装了代码编辑器或选择了在线编辑器并创建了账户，我们就需要获取本章的入门代码。\n\n在 Github 上创建了一个代码仓库（https://github.com/michaelgearon/Tiny-CSS-Projects），其中包含你跟随每章所需的所有代码。图\
  \ 1.2 显示了该仓库的截图。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_7_0.png)\n\n代码按章节组织成文件夹。每个章节文件夹内包含\
  \ 2 个版本的代码：\n\n- before：包含项目的入门代码。这是如果你跟随章节编码时想要的版本\n- after：已完成的项目，如本章末尾应用了所展示\
  \ CSS 时的状态\n\n下载，（或如果你熟悉 git，可以克隆），项目选择屏幕顶部的“Code”下拉菜单。\n\n假设你正在跟随章节编码，从 chapter-01\
  \ 中的“before”文件夹获取文件并复制到你的项目文件夹或你的 pen 中。你应该会看到一个带有一些入门代码的 HTML 文件，以及一个空的 CSS 文件。如果你将\
  \ HTML 文件在网页浏览器中打开或将内容复制到 CodePen，你会看到内容目前未加样式，除了浏览器提供的默认样式外，如图 1.3 所示。我们现在准备好使用\

  #A Prevents our content from becoming excessively wide\n#B So that regardless of\
  \ window size the background covers the whole window\n#C Centers the content when\
  \ window is larger than 78ch\n\n## 7.1 Adding a drop cap\n\nWe already have some\
  \ base CSS to style the page, we are now going to turn our attention to the text.\
  \ By virtue of the fact that the width of our body is already capped at a width\
  \ that works well for our text, we do not need to worry about line length. We do\
  \ need to address the leading or line height.\n\n### 7.1.1 Leading\n\nLeading is\
  \ the amount of space found between our lines. The term comes from the days of the\
  \ printing press, when to adjust the spacing between the lines of text, bars of\
  \ lead of various widths would be placed. The CSS property we are going to use to\
  \ accomplish the same outcome is `line-height` (https://developer.mozilla.org/en-US/docs/Web/CSS/line-height).\n\
  \nLine height can take a number value (`line-height: 2`) or a number with a unit\
  \ (`line-height: 5px`). The unit can either be relative such as ems, or fixed such\
  \ as pixels. Unless the unit is relative to the font size such as `em`, when providing\
  \ a unit, if the font is scaled or a child element has a different font size the\
  \ line height may not look correct and can negatively impact legibility. When using\
  \ a unitless number, the line height is automatically calculated relative to the\
  \ font size of the element, eliminating this concern. We will therefore be using\
  \ a unitless line height. We will set a line height of 1.5 on all paragraphs by\
  \ creating a rule specifically for the paragraph element and then applying the height\
  \ as follows: `p { line-height: 1.5; }`.\n\n> **Accessibility and Leading**\n> Research\
  \ shows that for text having a line height between 1.5 and 2 makes line tracking\
  \ for individuals cognitive disabilities easier³\n\n### 7.1.2 Justification\n\n\
  For optimum effect when we have the text follow the image, we are going to justify\
  \ our text. Justifying the text means we are going to make all of our lines the\
  \ same width. A technique often seen in newspapers, where the right edge is a straight\
  \ line rather than a ragged edge.\n\n\n\n\n\n# 可访问性与文本对齐\n\n警告：网络内容无障碍指南（WCAG）包含三个相互递进的符合性等级\
  \ A、AA 和 AAA。A 是限制最少的，逐步提升到最严格的 AAA。通常网站会以 AA 等级为目标，但如果我们需要符合 AAA，则值得一提的是，文本两端对齐违反了无障碍指南\
  \ 1.4.5，而该条款是 AAA 的要求⁴。\n\n要对齐我们的文本，我们将使用 `text-align` 属性，该属性可以取 left、right、center\
  \ 或 justify 的值。我们将 `text-align: justify;` 添加到之前创建的段落规则中。\n\n我们的段落规则现在有 2 个属性，text-align\
  \ 和 line-height，这可以处理段落的样式。列表 7.3 显示了完成的段落规则。\n\n## 列表 7.3 完成的段落规则\n\n```\np {\n\
  \  line-height: 1.5;\n  text-align: justify;\n}\n```\n\n段落本身已处理完毕，如图 7.3 所示，我们现在可以专注于第一段的第一字母来创建首字下沉\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_194_0.png)\n\n图 7.3 样式化的段落\n\n## 7.1.3\
  \ 首字母\n\n我们不需要向 HTML 添加任何标签来选择第一段的首字母，我们可以使用伪类 `:first-of-type` (https://developer.mozilla.org/en-US/docs/Web/CSS/:first-of-type)\
  \ 来选择第一段，然后使用伪元素 `::first-letter` (https://developer.mozilla.org/en-US/docs/Web/CSS/::first-letter)\
  \ 来获取该字母，在本例中为 B，两者都可以串联。在代码中，这被翻译为 `p:first-of-type::first-letter {}`。\n\n## 伪类\
  \ vs 伪元素\n\n伪类添加到选择器中以定位特定状态，而伪元素允许我们选择元素的一部分。\n\n选中字母后，我们现在可以开始对其进行样式设置，使其看起来像首字下沉。为了使其从其余文本中脱颖而出，我们将选择一种更华丽的字形。在本例中，我们将使用\

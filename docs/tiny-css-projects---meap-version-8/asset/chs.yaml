  \n###### NAMESPACE AND THE UNIVERSAL SELECTOR\n\nIt is possible to mix different\
  \ languages together in the same document, such as embedding SVG code into HTML.\n\
  \nThe issue with doing that is that it’s difficult to distinguish between the various\
  \ types of code. For example, we could have a link in our SVG graphic and a link\
  \ in our HTML but we may want to style the SVG links differently than our HTML links.\n\
  \nTo solve this we can use namespaces to uniquely identify code and set our definition\
  \ of what that code does. Then, in the CSS, we can select that namespace and create\
  \ styles just for that type of code.\n\nIn HTML5 when we insert code into a HTML\
  \ file that is a known foreign element such as an SVG, MathML or XML it is automatically\
  \ given its correct namespace.\n\nHere a few examples of coding languages and their\
  \ namespaces:\n\n- HTML elements use the namespace of http://www.w3.org/1999/xhtml\n\
  - SVG elements use the namespace of http://www.w3.org/2000/svg\n- MathML elements\
  \ use the namespace of http://www.w3.org/1998/Math/MathML\n\nIn our project we have\
  \ an SVG graphic within our HTML document. To declare a namespace in HTML we use\
  \ the `xmlns` attribute. As we have learnt, it is optional to declare the namespace\
  \ for an SVG graphic as it is a known foreign element, but we will declare it in\
  \ this instance (Listing 1.10):\n\n##### Listing 1.13 SVG Namespace\n\n```\n<svg\
  \ xmlns=\"http://www.w3.org/2000/svg\">\n  <!--SVG Code-->\n</svg>\n```\n\nNow that\
  \ our SVG is in our HTML and we have optionally added the `namespace` value in the\
  \ `xmlns` attribute, we need to add this known namespace to our CSS. In the CSS\
  \ file at the top of the style sheet we add the `namespace` rule.\n\nThis is formed\
  \ by writing `@namespace`. Then we give the namespace a prefix. The prefix given\
  \ to the namespace can be whatever we choose, but for simplicity we have stuck with\
  \ `svg` as this is the code we want to target. The name prefix is case sensitive,\
  \ so `Svg` would be treated differently to `svg`. Then we add the `namespace` URI\
  \ string in quotes: `@namespace svg \"http://www.w3.org/2000/svg\";`\n\nNow that\
  \ we have declared the namespace in our CSS let’s look at how it can work with the\
  \ universal selector.\n\nWe can use the universal selector to style all elements\
  \ within that namespace. In other words, we style all elements within a certain\
  \ coding language, like HTML or SVG. We can use the universal selector in the following\
  \ ways:\n\n- `*` or `*|*` - matches all elements, regardless of their namespace\n\
  - `ns|*` - matches all elements in the namespace `ns`\n- `|*` - matches all elements\
  \ without any defined namespace\n\nThe next step is to write our CSS rule. We want\
  \ to apply a background color to our two SVG elements without styling the HTML.\
  \ The first step is creating the selector, which is the namespace rule we called\
  \ svg, followed by a pipe (|) and then an asterisk (*) which matches all elements\
  \ in the svg namespace as seen in Listing 1.11.\n\nOur declaration will be `fill`\
  \ with a light gray Hex value of `#EDEDED`. We can specify as many namespaces as\
  \ we want. But that namespace rule only applies to that stylesheet, so we will need\
  \ to declare it once for each stylesheet we intend to use it in.\n\n##### Listing\
  \ 1.14 Namespace selector\n\n```\nsvg|* {\n  fill: #EDEDED;\n}\n```\n\nOnce applied,\
  \ we can see that the elements in our svg image now have a gray background (Figure\
  \ 1.24).\n\n\n\n\n\nFigure 1.24: 使用命名空间和通用选择器来设置 SVG 元素的背景\n\n#### 1.7 不同方式编写 CSS\n\
  \nCSS 在我们编写规则和格式方面具有灵活性。我们现在将查看简写属性（我们在整本书中都会反复提到）以及我们可以格式化 CSS 的不同方式。\n\n#####\
  \ 1.7.1 简写\n\n简写是一种通过将所有值合并到一个属性中来替代编写多个 CSS 属性的方法。我们可以用一些属性来做到这一点，例如 padding、margin、animation……这些我们将在本书的各个部分中介绍。编写简写的优点是我们可以减少样式表的大小，从而提高可读性、性能和内存使用。\n\
  \n每个简写属性接受不同的值。让我们探索我们在项目中使用的那个。我们在文章中有 `blockquote`。当我们对其进行样式设置时，我们使用了 `padding`\
  \ 属性。我们将 padding 声明如下：`padding: 10px`。这样做时我们使用了简写。我们本可以改写如下（Listing 1.12）：\n\n#####\
  \ Listing 1.15 Padding expanded\n\n```\npadding-top: 10px;\npadding-right: 10px;\n\
  padding-bottom: 10px;\npadding-left: 10px\n```\n\n完全可以单独编写每个声明，但就计算性能而言代价昂贵。尤其是当所有属性值都相同时更是如此。\n\
  \n相反，我们可以使用 `padding` 属性并将四个值放在同一行上。顺序为上、右、下、左，如 Figure 1.25 所描述。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_40_0.png)\n\
  \nFigure 1.25 Padding shorthand property explained\n\n如图所示，我们可以声明全部 4 个值来定义上、右、下、左的值。但如果我们说左右相同而上下不同，那么我们可以指定\
  \ 3 个值，顺序为上、左右、下。\n\n如果声明了 2 个值，则表示第一个值是上下应采用的值，然后第二个值设置左右。最后如果只声明了 1 个值，则设置全部 4\
  \ 个边。\n\n##### 1.7.2 格式化\n\n我们编写 CSS 有几种方式，通常在查看他人的代码时我们会看到不同的格式。以下是一些示例：\n\n多行格式（Listing\
  \ 1.13）很可能是格式化选择中最受欢迎的一种。每个声明都单独占一行，然后使用制表符或空格缩进。\n\n##### Listing 1.16 The multi-line\
  \ format\n\n```\nh1 {\n  color: red;\n  font-size: 16px;\n  font-family: sans-serif\n\
  }\n```\n\n这种多行格式的变体（Listing 1.14）将大括号放在单独一行。它是我们可能在 PHP 语言中看到的。将大括号放在单独一行可能被认为是不必要的。\n\
  \n##### Listing 1.17 A variation of the multi-line format\n\n```\nh1\n{\n  color:\
  \ red;\n  font-size: 16px;\n  font-family: sans-serif\n}\n```\n\n单行格式（Listing 1.15）很有意义，它紧凑，我们可以快速浏览文件，知道第一部分是选择器。然而，缺点是如果规则包含许多声明，阅读起来很快就会变得困难。\n\
  \n##### Listing 1.18 The single-line format\n\n```\nh1 { color: red; font-size:\
  \ 16px; font-family: sans-serif }\n```\n\n所有选项都有利有弊，但我们会注意到本书中的项目使用了一种组合，即选项一和三。主要需要知道的是没有对错之分，通常取决于什么对你或你的团队最有效。只要代码易于理解，那就足够了。\n\
  \n有鹰眼的人也会注意到上面的示例中，最后规则的声明上没有分号（;）。是否添加它是可选的，但为了更好的网页性能，最好实践是将其移除。\n\nCSS 最好的部分之一是我们可以用最舒适的方式编写它。\n\
  \n#### 1.8 Summary\n\n- CSS 是一种成熟的编码语言，CSS 的每个部分都由模块组成。\n- 模块取代了 CSS3 等大型版本，不会有\
  \ CSS4 版本发布。\n- 内联 CSS 可以获得最高优先级并且性能良好，然而它非常重复且难以维护。\n- 外部 CSS 使我们的 CSS 与 HTML 分离，保持关注点分离。\n\
  - 除了我们自己的 CSS 之外，浏览器还会应用默认样式。\n- 用户也可以应用自己的 CSS，这可能会覆盖作者和用户代理样式表。\n- 使用 !important\
  \ 被认为是不良实践。\n- CSS 规则由选择器和一个或多个声明组成。\n- 有许多类型的选择器，我们可以针对它们创建规则，每个选择器都有自己的特异性级别\n\
  \n## 2\n\n## 使用 CSS 网格设计布局\n\n### This chapter covers\n\n- 探索网格轨道以及我们如何安排网格\n- 在\
  \ CSS 网格中使用 minimax 和 repeat 函数\n- 使用分数单位以及它在 CSS 网格中独特性\n- 创建模板区域并将项目放置在区域上\n-\
  \ 使用网格时的可访问性考虑\n- 在网格中创建列和行之间的间距\n\n现在我们对 CSS 的工作原理有了基本了解，我们可以开始探索布局 HTML 内容的选项，包括网格、弹性盒和列。首先，我们将专注于使用网格进行布局。\n\
  \n网格，在这种意义上，是相互交叉形成一系列正方形或矩形的线网络。现在得到所有主要浏览器的支持，网格已成为非常流行的布局技术。\n\n本质上，网格由列和行组成，就像表格一样。我们首先创建我们的网格，然后将项目或元素分配到该网格，就像我们在玩大富翁游戏时将船只放置在网格上一样。\n\
  \n尽管有时与表格概念相比，网格布局和表格有非常不同的用途并满足非常不同的需求。网格用于布局，而表格用于表格数据。如果正在设置样式的内容适合 Excel 表格，那么它就是表格数据，应该放在表格中。\n\
  \n历史上我们曾使用表格进行布局，有时仍然需要这样做（例如电子邮件仅支持 CSS 的子集），但在网络上这被认为是不良实践。我们现在可以使用网格代替。\n\nCSS\
  \ 网格使我们能够发挥创造力，并为不同条件下的布局制作一系列布局并与媒体查询结合进行适配，正如我们将看到的那样。我们将使用\n\ngrid 来设置我们的项目样式，到本章结束时，我们的布局将如下所示（Figure\
  \ 2.1）：\n\n![](img/b56145aa9b751926a7aedbd7172bc818_43_0.png)\n\nFigure 2.1 Final\

  \ leo quam. Pellentesque ornare non mi porta gravida at eget metus. Aenean lacinia\
  \ bibendum nulla sed consectetur. Integer posuere erat a an\n\nFigure 4.15 Restored\
  \ image with fallback\n\nNext let’s add a caption to your image.\n\n## 4.3.3 Formatting\
  \ captions\n\nThe Image does not currently have a caption, so we are going to add\
  \ one using the figure and figcaption HTML elements. Then we will style it.\n\n\
  <figure> and <figcaption> go hand in hand. The figure contains the image and then\
  \ the optional figcaption. Often seen in books and other publishing material, diagrams,\
  \ charts and images will have text underneath the element describing it or relating\
  \ it to the text. Semantically, the benefit of grouping the image and the caption\
  \ together is that it programmatically links the image with its caption. From a\
  \ styling perspective, having the elements together in a parent element allows us\
  \ to position the element and its caption together as a unit.\n\n### Listing 4.9\
  \ Adding a figure and figcaption to the HTML\n\n```\n<figure>  #A\n<img src=\"./image.jpg\"\
  \ alt=\"\" onerror=\"this.style.display='none'\" />  #B\n<figcaption>Golden Gate\
  \ Bridge</figcaption> #C\n</figure> #D\n```\n\n#A Start of the figure\n#B Our image\n\
  #C Our image caption\n#D End of the figure\n\nLet’s style the figure and the caption,\
  \ starting by removing the browser provided margins (seen in Figure 4.16) that are\
  \ currently being applied to the figure.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_115_0.png)\n\
  \n# Figure 4.16 Figure browser provided styles\n\nWe will then reinstate a bottom\
  \ margin so that our caption is kept separate from the paragraph below it. Finally\
  \ we will center the image and caption.\n\nWe will also style the caption’s text\
  \ to use the Oswald font-family (the one we used for all the headers) so that it\
  \ will be visually differentiated from the article text.\n\n### Listing 4.10 Figure\
  \ and figcaption styles\n\n```\nfigure {\n  margin: 0 0 12px 0; /*A*/\n  text-align:\
  \ center;\n}\nfigcaption {\n  font-family: 'Oswald', sans-serif;\n}\n```\n\n#A Padding\
  \ shorthand property: top, left, and right padding set to 0 and bottom set to 12px.\n\
  \nAt this point we look good on narrow screens but we still need to create our columns\
  \ on wide screens. Figure 4.17 shows the progress we have made on our project thus\

  \ of styling than they once were, so using CSS Reset or Normalize is more of a personal\
  \ choice rather than a necessity. Some differences do still exist however, and regardless\
  \ of whether or not we use CSS Reset or Normalize, we should be testing our code\
  \ across a variety of devices and browsers.\n\n#### 1.4.6 !important\n\nThe !important\
  \ annotation is one we may have seen in some stylesheets. Often used as a last resort\
  \ when all else fails, it is a way to override the specificity and declare that\
  \ a particular value is the most important thing regardless of all else. However,\
  \ with great power comes great responsibility. The !important annotation was originally\
  \ created as an accessibility feature.\n\nRemember how we talked about users being\
  \ able to apply their own styles in order to have a better user experience? It was\
  \ created to help users define their own styles without having to worry about specificity.\
  \ Since it overrides any other styles, it was created to ensure that the user’s\
  \ styles would always have the highest importance and therefore be the ones applied.\n\
  \nMaking use of !important is therefore considered bad practice and should not be\
  \ used in our author stylesheets. Doing so breaks the natural cascade of the CSS\
  \ and can make it harder to manage the stylesheet going forward.\n\n#### 1.5 Specificity\n\
  \nWhen there are multiple property values being applied to an element, one will\
  \ win over the others. How we determine the winner is through a multi step process.\
  \ We will ignore !important for the time being as it breaks the normal flow, and\
  \ we will come back around to it later.\n\nWe first look at where the value comes\
  \ from. Anything explicitly defined in a rule will override inherited values. For\
  \ example (listing 1.4), if we set a font color to red on the body tag, the elements\
  \ that are inside the tag will have red text. The font color is inherited by those\
  \ elements. If we specifically set a different color on a paragraph inside of the\
  \ body, the inherited red value would be overwritten by the more specific blue value\
  \ set on the paragraph. Therefore, that paragraph’s text color would be blue.\n\n\
  ## Listing 1.5 Example of inheritance\n\n```\n<body> #A\n  <h1>Example</h1> #B\n\
  \  <p>My paragraph</p> #C\n</body> #D\n\nbody { color: red } #E\np { color: blue\
  \ }  #E\n```\n\n#A start of HTML\n#B our header would inherit the red color\n#C\
  \ the paragraph’s color would be blue as set by the paragraph rule\n#D end of HTML\n\
  #E CSS Rules\n\nNot all property values will be inherited. Theme related styles\
  \ such as color and font size, will generally be inherited. Layout considerations\
  \ are generally not. This is a very loose guideline, and there are definitely exceptions\
  \ but this is a good place to start. We will cover exceptions as a case by case\
  \ when they appear throughout the projects.\n\nIf inherited versus explicit doesn’t\
  \ act as a tiebreaker to determine the value, we then look at the type of selector\
  \ which was used and mathematically calculate the specificity value. We will get\
  \ into more detail about what each selector type is in this chapter, but let’s look\
  \ at how the math is applied.\n\nWe look at the selector, categorize the types of\
  \ selectors being used by the rule, then apply the type value. We then add all of\
  \ the values and get a final specificity value. Figure 1.9 diagrams the process.\
  \ The biggest number wins, therefore rule #1 in the diagram would win over rule\
  \ #2.\n\n```\nbutton[type=\"submit\"]#save span { ... }\n```\n\nType Selector 1\
  \ + Attribute Selector 10 + ID Selector 100 + Type Selector 1 = 112\n\n```\nbutton[type=\"\
  submit\"] span { ... }\n```\n\nType Selector 1 + Attribute Selector 10 + Type Selector\
  \ 1 = 12\n\nFigure 1.9 Calculating specificity\n\nSpecificity values by selector\
  \ type are as follows:\n\n- 100 - ID selectors\n- 10 - Class selectors, attribute\
  \ selectors, and pseudo classes\n- 1 - Type selectors, and pseudo elements\n- 0\
  \ - Universal selectors\n\nIf we still have a tie we look at which stylesheet the\
  \ style originated from. If both values come from within the same stylesheet, the\
  \ one later in the document wins, if they come from different stylesheets, the order\
  \ is as follows\n\n- 1. User stylesheet\n- 2. Author stylesheet(s) (in order in\
  \ which they are being imported, last one wins)\n- 3. User Agent stylesheet\n\n\
  We set !important to the side earlier. Now that we understand the normal flow, let’s\
  \ add it back into the mix. When a value has the !important annotation, the process\
  \ is short circuited and the value with the annotation automatically wins regardless\
  \ of anything else. If both values have the !important annotation, the normal flow\
  \ is followed. The diagram in Figure 1.10 shows the flow through the stylesheets\
  \ including property values with the !important annotation.\n\n\n\n\n\n![](img/b56145aa9b751926a7aedbd7172bc818_23_0.png)\n\
  \nFigure 1.10 CSS order of precedence\n\n我们已经确定选择器的类型会影响类的特异性。让我们更仔细地查看选择器并在项目中使用它们。\n\
  \n#### 1.6 CSS 选择器\n\n选择器设置我们想要定位的 HTML 元素，然后跟随声明。\n\n在 CSS 中，有七种方法可以定位我们想要设置样式的\
  \ HTML 元素。让我们先来看基本选择器。\n\n##### 1.6.1 基本选择器\n\n最常见的方法是根据名称、ID 或类名选择元素。\n\n#####\
  \ TYPE SELECTOR\n\n类型选择器通过名称定位 HTML 元素。使用类型选择器的好处是，在阅读 CSS 时，我们可以快速判断如果修改规则会受到影响的\
  \ HTML 元素。它也不要求我们在 HTML 中添加任何特定标记来定位元素。\n\n让我们使用类型选择器来定位我们所有的标题（h1 到 h6），并将它们的颜色更改为深红色。\n\
  \n我们的 CSS 将是：h1, h2, h3, h4, h5, h6 { color: crimson; }。图 1.11 显示我们所有的标题颜色现在都已更改。\n\
  \n## Figure 1.11 Header color change\n\n##### CLASS SELECTORS\n\n类选择器可以应用于我们想要的任意多个不同元素。通过将类名应用于元素，我们将多个\
  \ HTML 元素分组在一起，这样当我们应用样式时，它们将应用到任何具有该类名的元素。\n\n类可以通过使用 class 属性添加到 HTML 中。在 class\
  \ 属性内，我们可以添加任意多个值（或类），每个值之间用空格分隔。与必须用美式英语书写的声明不同，类名可以用任何语言使用任何拼写变体书写。\n\n编写类名有很多方法和方式，例如\
  \ Block、Element、Modifier（BEM）方法或 CSS 的可扩展模块化架构（SMACSS），它们是编写一致样式表的风格指南。主要目的是编写任何人都能理解的类名。\n\
  \n例如，将类名 \"text\" 添加到我们的段落元素会非常令人困惑。这是因为其他元素，如我们的标题，也可以被视为文本，因此可能不清楚我们具体指的是哪个元素。基于特定样式（如颜色）应用类名也可能很危险。给元素一个名为\
  \ blue 的类名可能立即有效，但如果设计更改且应用的颜色现在是红色，我们的类名将不再有意义。\n\n在我们的 HTML 中，我们发现一些标题具有 small-heading\
  \ 的类。我们将创建一个规则来选择 small-heading 并将元素的文本更改为大写。\n\n要选择 small-heading 类名，在 CSS 中我们将首先输入点号（.），后跟类名\
  \ small-heading，然后我们的样式进入大括号，与类选择器相同：.small-heading { text-transform: uppercase\
  \ }。图 1.12 现在显示了我们的大写标题。请注意，其他标题未受影响。只有应用了该类的那些。\n\nQuisque dictum augue quis dapibus\

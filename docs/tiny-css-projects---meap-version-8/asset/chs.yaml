  \ #C\n<option value=\"feedback\"> Providing feedback</option> #C\n<option value=\"\
  other\"> Other</option> #C\n</select> #C\n\n<fieldset> #D\n<legend>Are you currently\
  \ a subscriber?</legend> #D\n<label> #D\n<input type=\"radio\" value=\"1\" name=\"\

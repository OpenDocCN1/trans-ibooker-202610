  \n# Listing 7.2 Starting CSS\n\n```\nhtml {\n  padding: 0;\n  margin: 0;\n}\n\n\
  body {\n  background-color: rgba(206, 194, 174, 0.24);\n  padding: 4rem;\n  font-size:\

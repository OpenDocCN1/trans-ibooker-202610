  <span role=\"alert\"> #B\n```\n```\nPlease provide a valid email address #B\n</span>\
  \ #B\n</div> #B\n\n<label for=\"reasonForContact\"> #C\nReason For Contact #C\n\
  </label> #C\n<select id=\"reasonForContact\" required> #C\n<option value=\"sales\"\

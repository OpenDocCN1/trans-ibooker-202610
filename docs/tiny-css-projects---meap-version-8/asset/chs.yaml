  \ 1.12 Class-selector applied to heading 4, 5 and 6\n\n##### Id SELECTOR\n\n在 HTML\
  \ 中，id 是唯一的。任何给定的 id 在网页上只能使用一次。如果重复使用多次，则我们的代码被视为无效 HTML。通常我们应避免使用 id 选择器，因为由于\
  \ id 在 HTML 中需要唯一，针对 id 构建的类不易重用。此外，id 选择器是最具体的选择器之一，使得使用 id 应用的样式难以覆盖。除非元素的唯一性是关键，否则应避免使用\
  \ id 属性。像类名一样，id 名称也可以用任何语言书写。\n\n在我们的示例文章中，有一个带有 id 属性值为 quote-by-author 的 blockquote。在我们的\
  \ CSS 中，要选择该 blockquote，我们使用井号（#）紧跟其后是要定位的 id。然后我们有大括号，在其中放置声明，如 Listing 1.4 所示。\n\

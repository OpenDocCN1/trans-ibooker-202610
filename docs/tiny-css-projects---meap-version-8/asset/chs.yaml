  \ 4.2 Starting point\n\n在担心布局之前，让我们先定义我们的主题。\n\n# 4.1 设置我们的主题\n\n主题为页面设定基调，通常由颜色、字体、边框，有时还包括内边距组成。我们的主题在屏幕尺寸或布局发生变化时保持不变。通常，网站的主题与它的标志和品牌颜色紧密相关。\n\
  \n我们将在 <body> 标签上设置一些默认值，可由其后代继承。作为一般规则，围绕排版的样式（color、font-family...）可被大多数元素继承（例外是一些表单元素，我们在第10章中介绍）。值得一提的是，font-size\
  \ 不会被继承。通过在父元素上设置可继承的属性，样式会 trickle down 到后代，从而避免我们需要在每个元素上都应用它们。\n\n# 4.1.1 从 Google\
  \ Fonts 导入字体\n\n我们应用背景颜色、字体和文字颜色（代码清单 4.2）。请注意，在 body 规则之前，我们从 Google Fonts 导入了所选的\
  \ font-family。我们倾向于使用 Google Fonts，因为它可以免费使用，无需创建账户或付费。PT Serif 并不是我们可以安全地期望用户电脑上已加载的字体，因此我们必须为浏览器导入它，以便它知道字形（字母、数字和符号）应该是什么样子。我们还提供\
  \ serif 作为后备，以防导入失败。\n\n# Web safe fonts\n\n可用的网络安全字体非常少（我们可以假设大多数设备都可访问的字体）。公认的列表是：Arial、Verdana、Helvetica、Tahoma、Trebuchet\
  \ MS、Times New Roman、Georgia、Garamond、Courier New、Brush Script MT¹。\n\n无论我们选择什么字体族，最好始终提供后备值（Serif、Sans-serif、Monospace、Cursive\
  \ 或 Fantasy）\n\n虽然我们将在本章后面进行大部分布局，但我们现在也在 body 上添加了一些左右内边距，以使我们的文字远离边缘。\n\n# Listing\
  \ 4.2 Defining some theme styles\n\n```\n@import url('https://fonts.googleapis.com/css2?family=PT+Serif&display=swap');\

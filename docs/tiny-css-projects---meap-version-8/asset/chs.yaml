  \  padding: 10px;\n  line-height: 1.75;\n}\n```\n\nFigure 1.13 shows the code applied\
  \ to our project.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_27_0.png)\n\nFigure\
  \ 1.13 shows the output\n\n##### 1.6.2 Combinators\n\n另一种编写 CSS 的方式是通过组合器，它允许在不过度使用\
  \ `class` 或 `id` 名称的情况下进行更复杂的 CSS。\n\n共有四种组合器：\n- 1. 后代组合器（空格）\n- 2. 子组合器（>） \n\
  - 3. 相邻兄弟组合器（+） \n- 4. 通用兄弟组合器（~）\n\n需要理解的一个重要概念是元素之间的关系。在接下来的几个示例中，我们将看看如何利用元素之间的关系来定位不同的\
  \ HTML 元素以设置文章的样式。图 1.14 介绍了我们将要查看的关系类型。\n\n## Figure 1.14 The relationship between\
  \ elements in HTML\n\n###### 1. DESCENDANT COMBINATOR (SPACE)\n\n后代组合器选择父元素内的所有\
  \ HTML 元素。后代组合器由三部分组成——第一部分是父元素，在本例中是 article 元素。父元素后跟一个空格，然后是我们想要选择的元素。语法在图 1.15\
  \ 中说明。\n\n## A space between the parent and child\n\nparent\nChild items of the\
  \ parent\n\n```\narticle p {\n  line-height: 2;\n}\n```\n\n## Figure 1.15 An example\
  \ of a descendant combinator\n\n![](img/b56145aa9b751926a7aedbd7172bc818_28_0.png)\n\
  \n在此示例中，浏览器会找到 article 元素的任何使用情况，然后定位父 article 元素中的所有后代段落（p）并使文本双倍行距。应用后，我们的文章看起来如\
  \ Figure 1.16 所示。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_29_0.png)\n\nFigure\
  \ 1.16 Child paragraphs are double spaced.\n\n###### 2. CHILD COMBINATORS (>)\n\n\
  子组合器是父元素的子元素。这与后代组合器不同，因为目标元素必须是直接子元素。后代组合器可以选中任何后代（子元素、孙元素、曾孙元素...）。\n\n在我们的项目中，我们将设置文章中列表项的样式。正如我们在下面的\
  \ HTML 中看到的（Listing 1.4），我们有一个无序列表（ul）包含列表项（li）。第一个子元素有自己的嵌套项，它们将是孙元素和曾孙元素。\n\n\
  ## Listing 1.7 HTML list items\n\n```\n<ul class=\"list\">      #A\n  <li>List item\
  \ 1</li>      #B\n  <ul>                    #C\n    <li>Nested item 1</li> #D\n\
  \    <li>Nested item 2</li> #D\n  </ul>\n  <li>List item 2</li>    #B\n  <li>List\
  \ item 3</li>    #B\n  <li>List item 4</li>    #B\n</ul>                     #A\n\
  ```\n\n\n\n\n### A Parent Item (.list)\n### B Children of .list\n### C Grand child\
  \ of .list\n### D Great grandchildren of .list\n\n我们将只为列表项（子项）设置绯红色样式，而不影响嵌套的列表项（曾孙项）。因此浏览器会找到\
  \ `list` 类，并仅针对直接位于 `list` 类下的子列表项（`li`）进行定位，并将 `color` 改为 `crimson`。我们将使用以下 CSS：`.list\
  \ > li { color: crimson; }`\n\n正如我们在图 1.17 中看到的，列表项现在是绯红色的，而嵌套的列表项仍然是黑色的。这是使用子组合器的好处之一。它允许我们仅设置子元素的样式，而不设置孙元素或层次结构中更深层的元素。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_30_0.png)\n\n图 1.17 子组合器应用于列表项\n\n*那么我们可以反过来选择子元素的父元素，对吗？*\
  \ 简短的答案是否定的。目前在 CSS 中没有办法选择父项，因此以下示例将不起作用：`article < p { color: blue; }`。\n\n######\
  \ 3. ADJACENT SIBLING COMBINATOR (+)\n\n当我们需要为与另一个元素处于同一级别的元素设置样式时（就像你的兄弟姐妹在家族树中与你处于同一级别一样），我们可以使用相邻兄弟组合器。\n\
  \n如果我们想定位另一个元素之后的元素，可以使用相邻兄弟选择器。\n\n在此示例中（列表 1.7），浏览器将找到 `header` 标签的任何用法，然后定位紧跟在\
  \ `header` 标签之后（或相邻）的第一个段落（`p`），并将 `font-size` 改为 `1.5rem`，`font-weight` 改为 `bold`。\n\
  \n```\nListing 1.8 Adjacent sibling combinator\n\nheader + p {\n  font-size: 1.25rem;\n\
  \  font-weight: bold;\n}\n```\n\n图 1.18 显示了该代码应用于我们的文章。\n\n## Title of our article\

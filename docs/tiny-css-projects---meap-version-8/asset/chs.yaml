  \ 所示，我们将从 Google Fonts 导入该字体。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_195_0.png)\n\
  \n图 7.4 Passions Conflict 字形\n\n由于这种字体的字母大写特别华丽，因此非常适合用于我们的首字下沉。我们稍后在本章中也会使用它来设置本章开头引用的样式。像这样的漂亮字体是装饰页面的绝佳方式，但仅适用于非常短的内容。手写体和装饰字体可能很难阅读，因此不适合用于大量文本。然而，对于首字下沉、大标题或简短引用，它们可以成为区分元素与内容其余部分并为页面增添个性的好方法。\n\
  \n这种特定字体中的字形比 Times New Roman（我们用于其余内容的字体）的字形小得多，而我们正在创建的首字下沉按定义比其余文本更大，因此我们必须调整其大小。我们还将调整字母的行高，使其与文本很好地配合。最后我们将使其向左浮动，以便文本环绕字母，达到我们期望的效果。\n\
  \nfloat 属性根据传递给它的值将元素放置在其容器的右侧或左侧。周围的内联元素（我们的文本）将使用剩余空间环绕浮动元素。float 属性可以取以下三个属性之一：\n\
  \n- Left\n- Right\n- None（元素未浮动）\n\n由于我们的文本是英文，从左到右流动，我们希望字母 B 保持在左侧。因此，我们将第一段的首字母（B）向左浮动，通过在规则中添加\
  \ `float: left;`。列表 7.4 显示了我们创建的用于设置首字下沉样式的完整 CSS 规则以及 Passions Conflict 字体的导入。图\
  \ 7.5 显示了生成的输出。\n\n## 列表 7.4 首字下沉\n\n```\n@import url(\n  'https://fonts.googleapis.com/css2?family=Passions+Conflict&display=swap'\n\
  );\np:first-of-type::first-letter {\n  font-size: 6em;\n  float: left;\n  line-height:\
  \ .5;\n  font-family: 'Passions Conflict', cursive;\n}\n```\n\nA Passions Conflict\
  \ 字体的导入\nB 样式化我们第一段开头字母 B 的规则\n\n![](img/b56145aa9b751926a7aedbd7172bc818_196_0.png)\n\
  \n图 7.5 首字下沉\n\n我们使用 em 和无单位的行高，这样如果我们 ever 更改段落的字体大小，首字下沉也会相应缩放，因为 1 em 的值是基于父元素的\
  \ font-size 设置的，在本例中是我们的段落标签。\n\n为了重新定位我们的 B 使其与文本很好地配合，我们编辑了字母的行高。另一种我们可以使用的方法是将\
  \ B 的位置设置为 relative，然后使用 top、bottom、left 和 right 来相对于其余文本更改其位置。\n\n首字下沉创建后，我们现在将注意力转向本章开头的引用。\n\
  \n## 7.2 样式化引用\n\n页面顶部的引用目前相当单调，而且在文本中有些迷失。为了使其脱颖而出，我们将使用与首字下沉相同的字体。由于前面提到的大小和行高差异，我们将对其进行调整，使段落和引用看起来大小和间距均匀。列表\
  \ 7.6 显示了我们将添加以完成此任务的 CSS，而列表 7.6 显示了输出。\n\n```\nListing 7.5 Blockquote\n```css\n\
  blockquote {\n  font-family: 'Passions Conflict', cursive;\n  font-size: 2em;\n\
  \  line-height: 1;\n}\n```\n```\n\n![](img/b56145aa9b751926a7aedbd7172bc818_197_0.png)\n\
  \n图 7.6 引用块\n\n我们再次使用相对单位，这样如果其余内容的字体大小发生变化，引用也会随之变化。你可能已经注意到，我们使用了行高 1，尽管我们上面说过为了最佳可读性，行高应为\
  \ 1.5 到 2。我们在这里破例，因为观察输出，我们发现默认情况下该字体本身已有非常大的行高，我们不需要增加大小。在处理草书或装饰字体时，这种情况偶尔会发生。\n\
  \n文本处理完毕后，我们现在可以专注于图像。\n\n## 7.3 使文本围绕指南针弯曲\n\n要使文本环绕我们的指南针图像，我们需要做的第一件事是将指南针向右浮动。我们的指南针是\
  \ png，由于是图像，因此本质上是矩形的，因此文本环绕图像遵循矩形路径。图 7.7 显示了浮动的指南针。图像上已应用边框以显示其边界框。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_198_0.png)\n\
  \nBuck lived at a big house in the sun-kissed Santa Clara Valley. Judge Miller's\
  \ place, it was called. It stood back from the road, half hidden among the trees,\
  \ through which glimpses could be caught of the wide cool veranda that ran around\
  \ its four sides. The house was approached by gravelled driveways which wound about\
  \ through wide-spreading lawns and under the interlacing boughs of tall poplars.\
  \ At the rear things were on even a more spacious scale\n\n图 7.7 方形指南针\n\n## 7.3.1\
  \ Shape-Outside: Circle\n\n为了使文本跟随指南针的曲线，我们需要为文本环绕添加一个曲线。\n\n我们将使用的属性是 shape-outside\
  \ (https://developer.mozilla.org/en-US/docs/Web/CSS/shape-outside)。shape-outside\
  \ 允许我们定义一个形状，相邻文本将围绕该形状流动。该形状也不必是矩形。它可以是\n\n- Circle 或椭圆\n- Polygon\n- 源自图像 - 使用图像的\
  \ alpha 通道（透明度）来确定形状应为\n- Path - 在规范中，但在本书撰写时尚未在任何浏览器上实现 (https://developer.mozilla.org/en-US/docs/Web/CSS/basic-shape#path())\n\
  - Box model 值\n\n由于我们有一个非常圆形的图形，我们要实现的目标形状是一个圆。这给了我们几个选项：\n\n\n\n+   1. 使用 CSS 形状\
  \ (https://developer.mozilla.org/en-US/docs/Web/CSS/basic-shape#path())\n+   2.\
  \ 使用边框半径\n\n让我们先来看一下使用形状的情况。\n\n要定义我们的圆形，我们将使用 circle 函数。Circle 接受一个 radius 属性和一个可选的\
  \ position 属性，该属性定义圆心的起始位置。如果省略 position 属性，圆的原点将默认为图像的中心。\n\n```\ncircle( [<shape-radius>]?\
  \ [at <position>]? )\n```\n\n在我们的例子中，我们希望圆的中心是图像的中间，所以我们不会传递位置。然而，我们必须定义一个半径。我们将把它设置为\
  \ 50%（我们希望半径等于图像宽度的二分之一），在内部它将解析为我们的宽度平方加上我们的高度平方的平方根除以 2 的平方根。\n\nradius = % ×\
  \ √(height² + width²) / √2 = .5 × √(175² + 175²) / √2 = 87.5\n\n由于我们的图像是正方形并且宽度为\
  \ 175，当传递 50% 的半径时，我们的半径为 87.5 非常合乎逻辑，然而，如果图像是矩形，了解基于百分比的半径是如何计算的对于理解最终输出的外观非常重要。\n\
  \n如果我们有一个高度为 100px、宽度为 300px 的横向图像，我们选择基于百分比的值时，圆的半径就没那么明显了。我们可以使用上面的公式来计算半径会是多少。\n\
  \nradius = % × √(height² + width²) / √2 = .5 × √(100² + 300²) / √2 ≈ 111.8\n\n图\
  \ 7.8 显示了当使用 circle 函数中的 50% 值时，半径将如何应用于我们的正方形图像，与矩形图像相比。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_200_0.png)\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_200_1.png)\n\n![](img/b56145aa9b751926a7aedbd7172bc818_200_2.png)\n\
  \nSquare\nShape-outside: circle(50%)\n\nlandscape\n\nportrait\n\n回到我们的图像，它是正方形，所以我们使用\
  \ shape-outside 属性并将其值设置为 circle(50%) 应用于我们的图像。列表 7.6 显示了我们的 CSS 规则。\n\n我们的图像是正方形，所以它的宽高比为\
  \ 1（宽度 / 高度 = 175 ÷ 175 = 1）。\n\n宽高比：图像的宽高比是图像高度和宽度的比例关系，通过将宽度除以高度计算得出。\n\n添加宽高比并不是创建形状所严格必要的，但有助于在加载时减少布局偏移。\n\
  \n布局偏移：当元素添加到页面或其大小发生变化时，元素之后的所有内容都会移动以腾出空间给元素或填补元素留下的空白。页面上元素的移动被称为布局偏移。\n\n当图像具有设定的高度和宽度或具有定义的宽高比时，浏览器可以在图像加载时为其预留空间，从而减少这种移动。因此，定义图像的宽高比和/或高度和宽度是良好的做法。\n\
  \n## Listing 7.6 shape-outside\n\n```\nimg.compass {\n  aspect-ratio: 1; #A\n  float:\
  \ right;  #B\n  shape-outside: circle(50%); #C\n}\n```\n\n#A 宽高比\n#B 将图像浮动到右侧\n\
  #C 添加我们的圆形，值为 50%\n\n图 7.8 显示了我们的输出。文本围绕图像环绕并遵循曲线，但我们的图像在任何方面都没有被裁剪。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_201_0.png)\n\
  \n图 7.8 带有曲线文本的浮动指南针\n\n## 7.3.2 Clip-Path\n\n这之所以有效，是因为我们的图像具有透明背景。我们已经使文本变圆，但图像仍然相当方正。如果我们为图像添加背景，这就会变得明显。为了使图像真正看起来是圆形的，我们需要添加一个\
  \ clip-path (https://developer.mozilla.org/en-US/docs/Web/CSS/clip-path)。Clip-path\
  \ 也接受一个形状，所以我们将传递与我们传递给 shape-outside 相同的数值。我们还将为图像添加一些边距，以在它和文本之间留出一些呼吸空间。列表 7.7\
  \ 显示了我们图像的完整 css。\n\n## Listing 7.7 clip-path\n\n```\nimg.compass {\n  aspect-ratio:\
  \ 1;\n  float: right;\n  shape-outside: circle(50%);\n  clip-path: circle(50%);\n\
  \  margin-left: 1rem;\n}\n```\n\n我们添加了一个与 shape outside 匹配的 clip-path，以及图像左侧的一些边距，以防止文本靠图像太近，尤其是指南针有从圆形轮廓伸出的箭头，我们的圆形并未考虑这些。图\
  \ 7.9 显示了指南针图像的最终输出。\n\nBuck lived at a big house in the sun-kissed Santa Clara\
  \ Valley. Judge Miller's place, it was called. It stood back from the road, half\
  \ hidden among the trees, through which glimpses could be caught of the wide cool\
  \ veranda that ran around its four sides. The house was approached by gravelled\
  \ driveways which wound about through wide-spreading lawns and under the interlacing\
  \ boughs of tall poplars. At the rear things were on even a more\n\n![](img/b56145aa9b751926a7aedbd7172bc818_202_0.png)\n\
  \n1 Santa lled. ong be ran was wound under the\n\n![](img/b56145aa9b751926a7aedbd7172bc818_202_1.png)\n\
  \n## Figure 7.9 Round Floated compass\n\n通过添加 clip path，我们现在可以观察到图像本身，包括背景现在看起来是圆形的。角落已被裁剪，之前是正方形的背景现在也是圆形的。添加的边距也使文本围绕我们的指南针箭头移动，使其看起来不那么拥挤。\n\
  \n我们已经证明了我们可以使用 CSS Shapes 创建一个圆，现在让我们看看我们将如何使用 border-radius 来制作圆。\n\n## 7.3.3\
  \ Shape-box\n\n我们可以通过使用 border radius 修改其矩形形状的元素形状来制作形状。我们仍然使用 shape-outside 但不是传递一个形状，我们指定要在盒模型哪个级别形成形状。我们的选项是\n\
  \n-   - margin-box: 形状跟随边距\n-   - border-box: 形状跟随边框\n-   - padding-box: 形状跟随内边距\n\
  -   - content-box: 形状跟随内容\n\n让我们从一张干净的图像开始，将图像浮动到右侧并添加一些边距以防止文本拥挤图像。列表 7.8 包含了我们的起始\
  \ CSS，而图 7.10 显示了当前显示。\n\n## Listing 7.8 Starting point\n\n```\nimg.compass {\n\
  \  aspect-ratio: 1;\n  float: right;\n  margin-left: 1rem;\n}\n```\n\nBuck lived\
  \ at a big house in the sun-kissed Santa Clara Valley. Judge Miller's place, it\
  \ was called. It stood back from the road, half hidden among the trees, through\
  \ which glimpses could be caught of the wide cool veranda that ran around its four\
  \ sides. The house was approached by gravelled driveways which wound about through\
  \ wide-spreading lawns and under the interlacing boughs of tall poplars. At the\
  \ rear things\n\n![](img/b56145aa9b751926a7aedbd7172bc818_203_0.png)\n\n图 7.10 重置为仅浮动和边距\n\
  \n现在让我们添加一个 50% 的边框半径，这将使我们的图像成为圆形。此时，文本不会跟随曲线，我们仍然需要添加 shape-outside 属性。\n\n我们图像周围有边距，我们理想情况下希望形状尊重它，因此我们将使用\
  \ margin-box 值。列表 7.9 显示了在代码中应用这一概念。\n\n## Listing 7.9 Starting point\n\n```\nimg.compass\
  \ {\n  aspect-ratio: 1;\n  float: right;\n  margin-left: 1rem;\n  border-radius:\
  \ 50%;\n  shape-outside: margin-box;\n}\n```\n\n图 7.11 显示了添加白色背景和边框以强调图像形状的输出。\n\
  \nBuck lived at a big house in the sun-kissed Santa Clara Valley. Judge Miller's\
  \ place, it was called. It stood back from the road, half hidden among the trees,\
  \ through which glimpses could be caught of the wide cool veranda that ran around\
  \ its four sides. The house was approached by gravelled driveways which wound about\
  \ through wide-spreading lawns and under the interlacing boughs of tall poplars.\
  \ At the rear things were on even a more\n\n![](img/b56145aa9b751926a7aedbd7172bc818_204_0.png)\n\
  \n图 7.1.1 指南针形状，边框半径为 50%，shape-outside 值为 margin-box\n\n我们注意到，与我们使用 shape-outside\
  \ 和 circle 函数时不同，我们的图像已经裁剪成圆形形状，消除了使用 clip-path 的需要。这直接是使用 border-radius 的结果，border-radius\
  \ 为我们做了裁剪。\n\n我们已经看到了两种实现相同结果的不同方法。像 CSS 中的许多事情一样，有不止一种方法来解决任何单一问题。这就是这种情况之一。两种选项在这种情况下并没有特别优于另一个，这是一个偏好的问题。\n\
  \n现在我们已经处理了指南针图像，我们将继续进行文本围绕狗的环绕。\n\n## 7.4 Wrapping text around the dog\n\n与指南针这种标准形状不同，狗有一个非常不规则的轮廓。然而，这张图像是线条艺术并且由单一路径组成，所以我们可能想从\
  \ svg 中获取路径来使用 path 函数创建我们的形状。正如我们即将看到的，虽然在 CSS 规范中定义，在规范中将不会工作。\n\n## 7.4.1 Using\
  \ path()... or not yet\n\n让我们在编辑器中打开图像文件来检查代码。列表 7.10 显示了为简洁起见并突出重要信息而删减的图像代码。\n\
  \n\n\n\n\n## Listing 7.10 dog.svg\n\n```\n<svg xmlns=\"http://www.w3.org/2000/svg\"\
  \ viewBox=\"0 0 152 193\">\n  <defs>\n    <style>\n      .cls-1{\n        fill:none;\n\
  \        stroke:#000;\n        stroke-miterlimit:10;\n        stroke-width:2px;\n\
  \      }\n    </style>\n  </defs>\n  <path class=\"cls-1\" d=\"M21.9135,115.62c-17.2115,4.7607-37.3354,...\"\
  />\n</svg>\n```\n\n我们有 defs，其中包含了图像的样式。这部分定义了 svg 中各个元素的外观。然后我们有一个 path。path 是显示狗狗的元素，不过它长达\
  \ 1988 个字符，非常复杂，并且当粘贴到 path 函数中如下 shape-outside: path('M21.913...'); 时似乎不起作用。这是因为在本书写作时，尚无浏览器完全实现了\
  \ path()⁶。\n\n一旦该功能实现，使用图形编辑器创建我们的路径并复制过来创建形状将是一种非常有价值的技术，但目前我们还无法使用。这种方法也存在一个缺点，即这些路径可能变得很长，这使得可维护性存疑。然而，我们有几个替代方案：\n\
  \n- 1. 创建一个大致匹配我们图像的多边形形状，类似于我们上面使用圆时采用的技术。\n- 2. 使用 url() 函数，该函数会引入图像并基于 alpha\
  \ 通道确定形状。\n\n我们将采用方案 2 并使用 url() 函数。\n\n## 7.4.2 Using the image\n\n与我们处理指南针图像时一样，我们将首先浮动该图像，但这次浮动到左侧，以打破页面上的视觉单调。然后，为了创建形状，我们使用\
  \ url() 函数，并向其传递图像的路径。Listing 7.11 显示了应用于狗狗图像的 css。\n\n## Serving the image file\n\
  \n在使用 shape-outside 时使用 URL，我们需要确保通过服务器运行我们的代码，以便浏览器获取图像而不是直接从文件系统读取。这具体与跨源资源共享（CORS）以及浏览器设置的安全策略有关。详细解释可在\
  \ CSS 规范中的 https://drafts.csswg.org/css-shapes/#shape-outside-property 找到。为缓解此问题，git\
  \ 仓库中的示例代码使用 http-server，在 localhost:8080 上提供文件以完成此任务。另一种选择是使用 shape-outside 引用\
  \ github 上托管的文件：\nurl('https://raw.githubusercontent.com/michaelgearon/Tiny-CSS-Projects/main/chapter-07/before/img/dog.svg')。\n\
  \n## Listing 7.11 Dog floated left\n\n```\nimg.dog {\n  aspect-ratio: 126 / 161;\n\
  \  float: left;\n  shape-outside: url('img/dog.svg');\n}\n```\n\n我们将图像向左浮动，然后添加\
  \ shape-outside 并传入对图像本身的引用。浏览器会查看图像的透明度，并根据透明度结束的位置确定形状的创建位置。Figure 7.12 显示了我们的输出。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_206_0.png)\n\nFigure 7.12 Floated dog\n\
  \n由于我们的图像具有不透明的线条和透明的背景，切割点相当直接。如果我们的图像有一个从不透明到透明的渐变，我们可以使用 shape-image-threshold\
  \ 属性来调整切割位置，该属性接受 0 到 1 之间的值，0 为完全透明，1 为完全不透明。\n\n## 7.4.3 Shape Margin\n\n下一步是添加一些边距以将文本移离图像，因为现在看起来相当拥挤。我们不能像之前向右浮动时那样直接给图像添加边距，如果尝试的话会发现边距被忽略并且实际上不会移动文本。我们需要使用\
  \ shape-margin。shape-margin 允许我们调整形状与其余内容之间的空间。我们将添加 1 em 的空间，如 listing 7.12 和 Figure\
  \ 7.13 所示。\n\n## Listing 7.12 Shape Margin\n\n```\nimg.dog {\n  aspect-ratio: 126\
  \ / 161;\n  float: left;\n  shape-outside: url('img/dog.svg');\n  shape-margin:\
  \ 1em;\n}\n```\n\n![](img/b56145aa9b751926a7aedbd7172bc818_207_0.png)\n\n## Figure\
  \ 7.13 Shape Margin\n\n图像底部的文本仍然相当接近。此时我们可以添加一些边距来增加空间，只要添加的边距小于或等于 shape-margin\
  \ 的值。如果值大于 shape-margin，它仍然会生效，但仅限于 shape-margin 的量。牢记这一注意事项，我们将在图像右侧添加 1em 的边距。Listing\
  \ 7.13 显示了狗狗图像的完整 CSS。\n\n## Listing 7.13 Complete dog image\n\n```\nimg.dog {\n\
  \  aspect-ratio: 126 / 161;\n  float: left;\n  shape-outside: url('img/dog.svg');\n\
  \  shape-margin: 1em;\n  margin-right: 1em;\n}\n```\n\nshape-margin 与 margin-right\
  \ 的结合，将文本推离我们的图像，得到我们在 Figure 7.14 中看到的精致最终效果。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_208_0.png)\n\
  \n## Figure 7.14 Finished floated dog\n\n完成这最后一步后，我们已完成页面的样式，如 Figure 7.15 所示。我们现在拥有一个视觉上吸引人且比我们最初开始时更有趣的布局。\n\
  \n## Chapter I: Into the Primitive\n\n> \"Old longings, nomadic long,\n> Chafing\
  \ at custom's chain;\n> Again from its brumal clasp\n> Wakens the ferine chain.\"\
  \n\nBuck 并没有读报纸，否则他就会知道麻烦正在酝酿，不仅对他个人而言，而且对从普吉特湾到圣地亚哥的每一只潮水犬而言，这些狗肌肉强壮，毛发温暖而长。因为人们在北极黑暗中摸索，发现了黄色金属，并且轮船和运输公司在宣传这一发现，成千上万的人正涌入北地。这些人想要狗，他们想要的狗是重型的狗，具有强壮的肌肉以便劳作，以及毛茸茸的皮毛以保护它们免受霜冻。\n\
  \nBuck 住在阳光普照的圣克拉拉谷的一栋大房子里。那是米勒法官的住所。它坐落在路边后面，半隐在树丛中，可以瞥见环绕其四面的宽敞凉爽的门廊。房子由碎石车道通向，车道蜿蜒穿过宽阔的草坪和参天白杨交织的枝桠。房子后面比前面更宽敞。有一座大马厩，十几个马夫和男孩在那里活动，还有一排排藤蔓覆盖的仆人小屋，无尽而整齐的杂房，长长的葡萄棚，绿色的牧场，果园和浆果地。然后是自流井的抽水站，以及米勒法官的男孩们在那里晨泳并在炎热的午后保持凉爽的大水泥水箱。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_209_0.png)\n\n![](img/b56145aa9b751926a7aedbd7172bc818_209_1.png)\n\
  \n而 Buck 统治着这片广阔的领地。他在这里出生，并在他四年的生命中一直生活在这里。确实，这片如此广阔的地方不可能没有其他狗，但它们不算数。它们来来去去，居住在人口众多的犬舍里，或像\
  \ Toots 那只日本斗牛犬，或 Ysabel 那只墨西哥无毛犬一样，隐居在房子的角落里——这些奇怪的生物很少把鼻子探出门外或踏足地面。另一方面，还有狐狸梗，至少有二十只，它们在窗外看着\
  \ Toots 和 Ysabel 时发出可怕的承诺的吠叫，并由一群手持扫帚和拖把的女佣保护。\n\n> London, Jack. \"The Project\
  \ Gutenberg EBook of The Call of the Wild, by Jack London.\" Project Gutenberg,\
  \ https://www.gutenberg.org/files/215/215-h.htm. Accessed 25 3 2021.\n\n## 7.5 Summary\n\
  \n- 行距，即行与行之间的空间，对可读性很重要\n- Float 可以与 first-letter 结合使用以创建首字下沉\n- 并非所有字体在给定相同大小值时具有相同的大小和行高\n\
  - Shape-outside 使用 CSS 形状来改变元素的形状\n- CSS 形状可以由 border-radius 创建\n- 与浮动 CSS 形状相邻的内联内容将跟随该形状\n\
  - 使用 url() 与 shape-outside 时，图像文件必须由浏览器获取（托管或通过 http-server 或等效方式\n- Shape-margin\
  \ 设置形状的边距\n- 有些布局如果不使用 float 就无法实现\n\n\n\n\n"
- "## 8\n设计结账购物车\n\n## 本章涵盖\n\n- 条件化表单输入的样式\n- 响应式表格\n- 使用网格自动定位\n- 数字格式化\n- 通过媒体查询根据视口大小有条件地设置\
  \ CSS\n- nth-of-type() 伪类\n\n从食品、书籍到娱乐以及介于两者之间的所有内容，我们中的许多人会定期在线购买商品。这一体验的共同点是结账购物车。我们通过将商品添加到虚拟购物车或篮子中来做出选择，以便在最终购买前查看我们选择的商品。在本章中，我们将研究如何为结账购物车设计样式，使其在窄屏和宽屏上都能正常工作。\n\
  \n在本章中，我们将研究如何在窄屏和宽屏上处理表格。表格对于显示数据非常有用，然而，对于移动设备来说，样式化可能有点困难。因此，我们将研究窄屏的 CSS 解决方案。\n\
  \n我们首先处理一些主题。无论屏幕宽度如何，输入字段、链接或按钮等元素看起来都一样，因此我们将先对这些进行样式化。在组装 UI 的早期定义主题可以显著减少冗余代码并提高我们保持样式一致的能力，因此无论是结账购物车还是任何其他页面或应用程序，此过程都可以翻译到任意数量的设计中。\n\
  \n我们将然后专注于从窄到宽的布局。因为在窄屏（如手机）上，我们倾向于堆叠元素，并且随着变大，我们添加规则来利用我们可用的全部宽度。从移动端开始并随着屏幕变宽而增加样式，通常比从宽屏开始然后在变小时覆盖之前设置的布局元素更容易。我们将创建样式以适应\
  \ 3 种屏幕尺寸：\n\n- 窄屏（大多数手机）：最大宽度为 549 像素\n- 中等（平板电脑和小屏幕）：介于 500px 和 955px 之间\n- 宽屏（桌面和高分辨率平板电脑）：宽于\
  \ 955px\n\n图 8.1 显示了我们的起点以及完成时每个屏幕尺寸的输出效果。\n\n图 8.1 小、中、大屏幕的开始和结束输出\n\n## 8.1 开始\n\
  \n无论屏幕尺寸如何，我们都将使用相同的 HTML。我们将有一个样式表，并使用媒体查询来调整元素在不同屏幕尺寸下的外观。媒体查询用于有条件地将样式应用于元素；我们将在本章后面更详细地探讨这些。\n\
  \n我们的 HTML 包含两个部分，一个用于购物车，一个用于摘要，它们被包装在一个容器中，我们将在宽屏上使用该容器将各部分并排放置。购物车部分包含一个标题和一个包含购物车中每个商品的表格。摘要部分包含一个标题、一个定义列表和\
  \ 2 个链接。图 8.2 显示了 HTML 元素的图表。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_214_0.png)\n\
  \n图 8.2 HTML 元素图\n\n清单 8.1 是我们开始使用的 HTML 的缩写版本。代码提到了一个 JavaScript 文件。它存在于根据应用于输入字段的数量计算并插入总值，但不影响样式。一些\
  \ HTML 元素还添加了 ARIA（可访问富互联网应用程序），以确保我们的代码是可访问的。ARIA 提供了一个框架来添加属性，这些属性有助于识别代码本身未传达的功能、关系和交互，这些功能由辅助技术（如屏幕阅读器）使用。它对样式也没有任何影响，但我们始终希望确保我们的代码是可访问的，以便我们不阻止残障用户访问和使用我们的应用程序。\n\
  \n## 清单 8.1 起始 HTML\n\n```\n<body>\n  <main>\n    <h1>Checkout</h1>\n```\n```\n\
  <div class=\"section-container\">\n  <section>\n    <h2>My Cart</h2>\n    <table>\n\
  \      <thead>\n        <tr>\n          <th>Image</th>\n          <th>Item</th>\n\

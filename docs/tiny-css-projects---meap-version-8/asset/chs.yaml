  \ or else this glutton be,\n\n### Sonnet 2\n\nWhen forty winters shall besiege thy\
  \ brow,\nAnd dig deep trenches in thy beauty's field, ...\nRead more of Sonnet 2\n\
  \n### Sonnet 3\n\nLook in thy glass and tell the face thou viewest,\nNow is the\
  \ time that face should form another, ...\nRead more of Sonnet 3\n\n## About the\
  \ Author\nWilliam Shakespeare\n\nEnglish playwright, poet, and actor who lived from\
  \ 1564 to 1616. He is credited for having authored Romeo and Juliet.\n\n## Check\
  \ out his plays:\n\n- All's Well That Ends Well\n- As You Like It\n- Cymbeline\n\
  \nWant to read more of Shakespeare's works, check out his complete works on the\
  \ Project Gutenberg.\n\n## Figure 2.2 Starting point\n\nCSS grids are a way to place\
  \ items on a two-dimensional layout, horizontal (x-axis) and vertical (y-axis).\
  \ In contrast, flexbox (covered in Chapter 6) is single-axis-oriented. It only operates\
  \ on either X or Y depending on its configuration. In short, a CSS grid is for laying\
  \ out items whilst a flexbox is for the alignment of items.\n\nFirst let's set up\
  \ our grid; we will then look at ways we can alter how our grid behaves based on\
  \ window size.\n\n## 2.1 Display\n\nThe first part of arranging a grid is setting\
  \ the `display` value to \"grid\" on the parent container item. When creating a\
  \ grid layout, we can use one of 2 values:\n\n- `grid`: when we want the browser\
  \ to display the grid in a block-level box. The grid will take the full width of\
  \ the container and set itself on a new line.\n- `inline-grid`: this is when we\
  \ want the grid to be an inline-level box. The grid will set itself inline with\
  \ the previous content much like a span.\n\n### Difference between block-level and\
  \ inline-level box\n\nIn HTML every element has a box surrounding it. A block-level\
  \ box says that an element's box should use the entire horizontal space of its parent\
  \ element, therefore preventing any other element being on the same horizontal line.\
  \ In contrast, inline elements can allow other inline elements to be on the same\
  \ horizontal line depending on the remaining space.\n\nWe will use the value grid\
  \ for our layout:\n\n## Listing 2.3 Setting the display to grid\n\n```\nmain {\n\
  \  display: grid;\n}\n```\n\nIf we preview this in the browser we notice that visually\
  \ nothing has changed. This is because the browser by default will display the direct\
  \ child items in one column. The browser will then generate enough rows for all\
  \ of the children elements.\n\nUsing the developer tools in our browser (Figure\
  \ 2.3), we can see that programmatically the grid has been created even though the\
  \ layout has not visually changed. To view the underlying grid on most browsers\
  \ we can right click on the web page and select inspect from the menu.\n\nIn the\
  \ Firefox inspect window, we select the parent container and we will see 2 things\
  \ to indicate this is now a grid:\n\n- 1. Purple lines around each direct child\
  \ item\n- 2. In the CSS panel to the right of the HTML, we see the `main` has a\
  \ display of grid and next to it an icon\n- 3. Once we click the grid icon beside\
  \ `<main>`, the layout panel shows us our grid structure\n\nAlthough we can follow\
  \ similar steps for Chrome or Safari, Firefox does provide better functionality\
  \ when viewing and editing the grid in the developer tools.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_48_0.png)\n\
  \nFigure 2.3 Development tools in Firefox\n\n## 2.2 Grid tracks and lines\n\nWhen\
  \ grid was introduced it brought in new terminology to describe laying out items.\
  \ The first concept is grid lines. Lines run horizontally and vertically and are\
  \ numbered starting from 1 in the top left, on the opposite side to the positive\
  \ numbers are the negative numbers.\n\n### Writing mode and script direction\n\n\
  The number assigned to each line is dependent on the writing mode (whether lines\
  \ of text are laid out horizontally or vertically) and script direction of the component.\
  \ For example, if the writing mode is English then the first line on the left is\
  \ numbered 1. If the language direction was set to right-to-left, for example because\
  \ the language was Arabic (written from right to left), then line 1 would be the\
  \ furthest line to the right.\n\nIn-between the grid lines are the grid tracks that\
  \ are made up of the columns and rows. Columns go from left to right whilst rows\
  \ go from top to bottom. A track is the space between any two lines on a grid. In\
  \ our example below (Figure 2.4) the track highlighted is our first row track in\
  \ our grid. A column track would be the space between two vertical lines.\n\nThen\
  \ within each track are grid cells. A cell is the intersection of a grid row and\
  \ a grid column.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_49_0.png)\n\nFigure\
  \ 2.4 Grid structure based on writing mode being English with the direction set\
  \ to left-to-right\n\nThe grid-template-columns and the grid-template-rows properties\
  \ can be used to lay out your grid.\n\nDEFINITION These properties specify, as a\
  \ space-separated track list, the line names and track sizing functions of the grid.\
  \ The grid-template-columns property specifies the track list for the grid's columns,\
  \ while grid-template-rows specifies the track list for the grid's rows.\n\nBefore\
  \ we set our columns we first need to understand a few concepts that are specific\
  \ to CSS Grids.\n\n### 2.2.1 Repeating columns\n\nTo save repetition in your code\
  \ you can use the repeat() function to specify how many columns you need.\n\nThe\
  \ repeat() function needs two values that are comma separated:\n\n- 1. the first\
  \ value indicates how many columns to create\n- 2. the second value is the sizing\
  \ of each column\n\nFor our project we will specify that we want 2 columns and then\
  \ for the sizing of each column we will use the minmax function. Our column definition\
  \ will therefore looks as follows:\n\n```\ngrid-template-columns: repeat(2, minmax(auto,\
  \ 2fr)) 250px;\n```\n\nThis declaration will produce 3 columns, 2 of equal width\
  \ using the fraction unit and one of 250 pixels. Let’s dissect this declaration\
  \ a bit further. Notice that inside the repeat function, we use another function\
  \ minmax().\n\n### 2.2.2 Minmax\n\nThe minmax(min, max) function is made up of two\
  \ arguments, the minimum and maximum range the grid track should be. The W3C specification\
  \ states that the minmax function \"defines a size range greater than or equal to\
  \ min and less than or equal to max\"¹.\n\n### Valid arguments\n\nTo make the function\
  \ valid the min value (the first argument) needs to be smaller than the max, otherwise\
  \ max gets ignored by the browser and the function will rely just on the min value.\n\
  \nFor our project we set the minimum value to auto and the max to 2 fractions. Let’s\
  \ look at what auto means.\n\n### 2.2.3 The auto keyword\n\nThe auto keyword can\
  \ be used for either the minimum or maximum value within the function.\n\nWhen the\
  \ keyword auto is used for the maximum value then the minimum dimension the container\
  \ will take is equal to the max-content keyword. To make layouts that include fixed\
  \ headers and footers, we can assign overflow to the area for whom auto was assigned.\
  \ The track that has a size value of auto will then shrink and grow with the window\
  \ size as seen in Figure 2.5.\n\n\n\n\n\nHeader and footer stay fixed to the top\
  \ and bottom of the window\n\n```\ndiv.grid {\n  display: grid;\n  grid-template-rows:\
  \ 250px auto 250px;\n}\n```\n\n```\ndiv.grid {\n  display: grid;\n  grid-template-rows:\
  \ 250px auto 250px;\n  Height: 100vh;\n}\n\nmain {\n  overflow: auto\n}\n```\n\n\
  Figure 2.5 Using the auto keyword\n\nFor our use case, in the statement grid-template-columns:\
  \ repeat(2, minmax(auto, 2fr)) 250px; the auto keyword dictates that for our first\
  \ 2 columns, the column should be, at a minimum, as wide as the element it contains.\n\
  \nLet’s take a look at the Flexible Length unit (fr) used to set their maximum width.\n\
  \n## 2.2.4 Flexible length\n\nThe fractions (fr) unit was introduced in the CSS\
  \ Grid Module. The fractions unit is unique to grid as it is a way to tell the browser\
  \ how much room a HTML element should have compared to other elements by distributing\
  \ the left over space once minimums have been applied.\n\nLet’s first explore what\
  \ a fraction is through some tasty cake diagrams (Figure 2.6) (sorry if this makes\
  \ you crave a slice of cake). If you had a whole cake it would equal 100%. If we\
  \ decided to eat all of the cake that would be 1 fraction. In our CSS that would\
  \ be the same as grid-template-columns: 1fr which would be 100% of the column.\n\
  \nBut we are friendly and decide we will give out some of our cake to our 4 friends,\
  \ so we need to determine how many slices of our cake each person is going to have.\n\
  \nIf we were fair we could say that our cake can be divided into 4 equal slices.\
  \ In our CSS this would be the same as grid-template-columns: 1fr 1fr 1fr 1fr. We\
  \ are telling the browser to give each HTML element an equal slice of the whole\
  \ thing.\n\nBut what if we decided to be sneaky and have a larger size? After all,\
  \ we baked the cake, right?\n\nSo we decide to take half of the cake for ourselves,\
  \ and then divide the remaining half into three slices. To do this we need to have\
  \ a total of 6 fractions, 3 fractions for our 50% of the cake and then one fraction\
  \ three times to equally split the other 50% of the cake.\n\nSo in our CSS that\
  \ would be grid-template-columns: 3fr 1fr 1fr 1fr, so we are saying there are 6\
  \ fractions in total, the first column gets 3 of them (or 50% of the total) and\
  \ then the remaining 50% should be equally split between the other 3 columns.\n\n\
  ![](img/b56145aa9b751926a7aedbd7172bc818_52_0.png)\n\nFigure 2.6 Diagram showing\
  \ fractions value\n\nFor our project we will create our grid lines for the columns\
  \ by adding the following to our main rule:\n\n### Listing 2.4 Setting the amount\
  \ of columns\n\n```\nmain {\n  display: grid;\n  grid-template-columns: repeat(2,\
  \ minmax(auto, 2fr)) 250px\n}\n```\n\nWhen previewed in the browser (Figure 2.7)\
  \ we can see that now our grid has numbers set across each line. What we can do\
  \ with this information is explicitly choose where to place our HTML elements within\
  \ the grid based on the grid line number.\n\nWe also notice that the browser has\
  \ assumed that we want to place our HTML elements within each grid cell so rather\
  \ than each element being stacked vertically the browser fills up each column cell\
  \ until it runs out and then creates a new row and fills in those columns. This\
  \ is also known as the implicit grid.\n\n## Explicit vs implicit grid\n\nWhen we\
  \ use either `grid-template-columns` or `grid-template-rows` we create an explicit\
  \ grid, we are clearly stating to the browser the exact amount of columns and rows\
  \ this grid should have. The implicit parts (both for the rows and columns) are\
  \ those that are automatically created by the browser, this can happen when there\
  \ are more child items than grid cells, the browser will then implicitly extra cells\
  \ to. We can control implicit behavior through `grid-auto-flow`, `grid-auto-columns`,\
  \ and `grid-auto-rows`.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_53_0.png)\n\n\
  Figure 2.7 Firefox browser preview showing the grid lines and the associated numbers\
  \ for each line\n\nAt this juncture, we have created a grid containing 3 columns.\
  \ Two of those columns use `minmax()` and then our third column has a fixed value\
  \ of 250px. This will allow us to have a three column layout. We will want to distribute\
  \ the main content in the first 2 columns and use the 3rd one as an aside to put\
  \ other less important content hence it being given less visual real estate (on\
  \ most screens it will be narrower than the first 2 columns).\n\n## 2.3 Grid template\
  \ areas\n\nIf we want to explicitly set an element on a particular row and column\
  \ of our grid, we have 2 different options. First, we can use the line numbers and\
  \ dictate the position of the child as follows: `grid-column: 1 / 4`. This would\
  \ place the element in the first column spanning through the second and third. Remember\
  \ than grid is all based on lines, and the first line is the far left edge so the\
  \ 4th line is the right edge of the grid. In our example, the element would be full\
  \ width. To define the row we would use the same syntax as for columns with the\
  \ `grid-row` property. To define that an element should start on the 3rd row and\
  \ span 2 rows we would write: `grid-row: 3 / 5`.\n\nRather than dealing with numbers,\
  \ we can instead use named areas to be referenced when explicitly placing elements\
  \ on the grid. To do this we use the `grid-template-areas` property. This allows\
  \ us to define the guide for how we want the web page to be laid out.\n\nThe `grid-template-areas`\
  \ property takes multiple strings, each composed of the names of the areas they\
  \ describe. Each string represents a row in the layout as seen in Figure 2.8. Each\
  \ name represents a column within the row. If 2 adjacent cells have the same name\
  \ (horizontally or vertically) the two cells are treated as one area.\n\n```\ngrid-template-areas:\n\
  \"header  header  header\"\n\"content content author\"\n\"content content aside\
  \ \"\n\"plays   .       aside \"\n\"footer  footer  footer\";\n```\n\n![](img/b56145aa9b751926a7aedbd7172bc818_54_0.png)\n\
  \nFigure 2.8 Syntax of the `grid-template-areas` property\n\nThe benefit of named\
  \ areas is in the visualization of the final outcome. We will define our `grid-template-areas`\
  \ as follows (Listing 2.6). Notice the dot (.) in the 4th row. The dot is used to\
  \ define a cell that we intend to keep empty. Since it does not have a name, content\
  \ cannot be assigned to it.\n\n### Listing 2.5 Creating our template areas\n\n```\n\
  main {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(auto, 2fr))\
  \ 250px;\n  grid-template-areas:\n  \"header header header\"\n  \"content content\
  \ author\"\n  \"content content aside \"\n  \"plays   .       aside \"\n  \"footer\
  \  footer  footer\";\n}\n```\n\nAlthough we have defined areas, the content is still\
  \ implicitly positioning itself in each available cell, ignoring the areas we have\
  \ defined (Figure 2.9). We now need to assign our content to each of these areas.\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_55_0.png)\n\nFigure 2.9 Defined grid\
  \ areas (Firefox)\n\n## 2.3.1 grid-area\n\nTo place an element in a defined area\
  \ we use the grid-area property. The grid-area value is the name we assigned in\
  \ the grid-template-areas property. For example, if we want the <header> element\
  \ to be placed inside of the area we defined as header, we would define: header\
  \ { grid-area: header; }. Applied to our project, we set our areas as follows:\n\
  \n### Listing 2.6 Assigning content to grid areas\n\n```\nheader { grid-area: header\
  \ }\narticle { grid-area: content }\naside { grid-area: aside }\n.author-details\
  \ { grid-area: author }\n.plays { grid-area: plays }\nfooter { grid-area: footer\
  \ }\n```\n\nNow that we explicitly defined where the content should go, we can see\
  \ that the content falls into place (Figure 2.10).\n\n![](img/b56145aa9b751926a7aedbd7172bc818_56_0.png)\n\
  \nFigure 2.10 Content explicitly placed on the grid\n\nWith the layout setup, let’s\
  \ remove some of the styles we had added for the purpose of understanding what our\
  \ layout was doing. As seen in Listing 2.7 we remove the padding and borders of\
  \ our content sections.\n\n### Listing 2.7 Removing debugging styles\n\n```\nmain\
  \ > *{\n    border: solid 1px #bfbfbf;\n    padding: 12px;\n}\n```\n\nWith those\
  \ styles removed and the screen width narrowed (Figure 2.11) we can see that the\
  \ content in adjacent columns or rows appears really close together.\n\n\n\n\n\n\
  ## 莎士比亚十四行诗\n\n## 十四行诗 1\n作者 William Shakespeare\n\nFrom fairest creatures we desire\
  \ increase,\nThat thereby beauty's rose might never die,\nBut as the riper should\

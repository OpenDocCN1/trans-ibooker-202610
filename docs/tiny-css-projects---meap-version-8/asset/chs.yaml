  \ poet, and actor who lived from 1564 to 1616. He is credited for having authored\
  \ Romeo and Juliette.\n\n## Checkout out his plays:\n- All's Well That Ends Well\n\
  - As You Like It\n- Cymbeline\n\n## 十四行诗 2\n\nWhen forty winters shall besiege\n\
  thy brow,\nAnd dig deep trenches in thy\nbeauty's field, ...\n\nRead more of Sonnet\
  \ 2\n\n## 十四行诗 3\n\nLook in thy glass and tell the\nface thou viewest,\nNow is the\
  \ time that face should\nform another, ...\n\nRead more of Sonnet 3\n\nWant to read\
  \ more of Shakespeare's works, check out his complete works on the Project Gutenberg.\n\
  \nFigure 2.15 Wide screen using layout from media query\n\nUsing grid-template-areas\
  \ in conjunction with media queries allows us to reconfigure our layout with minimal\
  \ code. However, there are some accessibility pitfalls we must avoid.\n\n## 2.6\
  \ Accessibility\n\nWhen we placed our items in the grid area we mostly kept the\
  \ elements in the order they appeared in the code: the header stayed at the top,\
  \ footer remained at the bottom, and the content was also in a logical visual order.\
  \ But what if the HTML code arrangement and the visual order were different from\
  \ each other?\n\nThe problem is that if a user is following along with a screen\
  \ reader or navigates the page via keyboard and the programmatic order does not\
  \ match what is being displayed, the behavior they will be presented with will seem\
  \ random. This will make it very difficult for the user to navigate and to comprehend\
  \ what is going with the page. Visually changing the location of a piece of content\
  \ using a grid will not affect the order in which assistive technology presents\
  \ the information to the user.\n\nW3 specification says the following about this\
  \ case:\n\n> **W3 RECOMMENDATION** Authors must use order and the grid-placement\
  \ properties only for visual, not logical, reordering of content. Style sheets that\
  \ use these features to perform logical reordering are non-conforming.\n\nThe solution\
  \ is to keep the source code and the visual experience the same, or at least in\
  \ a sensible order. This will give you both the most accessible web document and\
  \ a good structure to work from. For English this means content and HTML should\
  \ follow the same order, from top left to bottom right.\n\nAfter assigning our elements\
  \ to their respective areas on the grid we should always test our page to ensure\
  \ that regardless of how the user accesses the page, the order will still be logical.\
  \ A couple of ways we can do this are by visiting our page using a screen reader\
  \ and by tabbing through the keyboard to make sure the tab order still works.\n\n\
  There are tools and extensions that can help with visualizing tab order. As we are\
  \ using Firefox for this, in the Firefox dev tools, for example, we can select the\
  \ accessibility tab and check the \"show tabbing order\" checkbox, which will outline\
  \ and number links and buttons as shown in Figure 2.16.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_62_0.png)\n\
  \nFigure 2.16 Tabbing order of HTML exposed using Firefox dev tools\n\nWe have now\
  \ completed the project (Figure 2.17).\n\n![](img/b56145aa9b751926a7aedbd7172bc818_62_1.png)\n\
  \nFigure 2.17 Final product on wide screen\n\n\n\n\n\n我们使用 CSS Grid 模块创建了一个布局，该布局会根据浏览器宽度而响应式。网格的许多方面仍在开发和迭代中，最值得注意的是子网格，它将允许在网格内创建网格。虽然现在可以在网格内设置网格，但子网格的好处是与父网格更密切相关。若要关注未来的增强和开发，请查看位于\
  \ https://www.w3.org/TR/css-grid-2/ 的网格规范。\n\n## 2.7 总结\n\n- 在此意义上，网格是一张由相互交叉的线组成的网络，形成一系列正方形或矩形。\n\
  - `display` 属性的值为 `grid` 允许我们将项目放置在网格布局上。\n- `display` 属性应用于包含要放置在网格中的子元素的父项\n-\
  \ `grid-template-columns` 和 `grid-template-rows` 用于显式定义网格应包含的列和行的数量和大小\n- 弹性长度（`fr`）单位是\
  \ CSS 网格作为设置项目尺寸的替代方式而形成的一种测量单位\n- 我们可以使用 `repeat()` 函数作为一种提高代码效率的方式，其中一行或多行或一列或多列大小相同\n\
  - `minmax()` 函数允许我们设置两个参数，即列应有的最小宽度和最大宽度。\n- `grid-template-areas` 允许我们定义每个网格区域的名称，然后我们可以在子项上使用\
  \ `grid-area` 属性将它们分配到这些命名位置\n- `gap` 属性是一种在网格单元之间添加间距（创建间距）的方式\n- 请记住确保源代码和视觉体验在相同的逻辑顺序中。当不确定时，请使用浏览器开发者工具检查选项卡顺序\n\
  \n## 3\n\n### 创建响应式动画加载屏幕\n\n### 本章涵盖\n\n- 通过在 SVG 中创建基本形状来创建可缩放矢量图形（SVG）以创建我们的加载器\n\
  - 了解 SVG 中 viewbox 和 viewport 之间的区别\n- 什么是关键帧以及我们如何从一种尺寸动画到另一种尺寸的 SVG 图像\n- 使用 animation\
  \ 属性设置持续时间、样式、应动画播放的次数以及动画开始的延迟时间\n- 如何使用 CSS 样式化 SVG 图像\n- 如何使用供应商前缀样式化 HTML 进度条元素\n\
  \n我们今天在大多数网页和移动应用程序中都能看到加载器。这些加载器用作向用户传达正在加载、上传或等待某事的方式。它让用户确信正在发生某些事情，并且应用程序并未冻结。\n\
  \n如果没有某种指示器告诉用户正在发生某事，用户可能会尝试重新加载、返回并再次点击链接，或干脆放弃并离开。当操作耗时超过 1 秒时，我们应该使用某种进度指示器，这时用户往往会失去关注并质疑是否存在问题。除了显示正在发生某事的视觉图形外，加载器还应附带文字，告诉用户正在发生什么。\n\
  \n对于我们的动画，我们将研究 CSS 动画模块，了解 animation 属性、关键帧、过渡以及可访问性，以及我们如何尊重用户对呈现给他们的动画量的偏好。\n\
  \n我们将使用 SVG 图像创建矩形，并查看 SVG 为我们提供的功能，以了解在样式化 HTML 元素和 SVG 元素之间存在的细微 CSS 属性差异。\n\n\
  对于进度条，我们将使用 HTML `progress` 元素，然后查看如何删除浏览器的默认样式并应用我们自己的样式。总的来说，我们希望创建一个一致、响应式的加载器，可在各设备上使用。我们将实现的结果如图所示\
  \ 3.1。\n\n本项目的 before 和 after 代码可在 GitHub 仓库中找到：https://github.com/michaelgearon/Tiny-CSS-Projects\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_65_0.png)\n\n图 3.1 本章的最终目标\n\n### 3.1\
  \ SVG 和图形\n\nSVG 代表可缩放矢量图形。SVG 使用基于 XML 的标记语言编写，并由笛卡尔平面上的矢量组成。\n\n矢量是定义几何原语的数学公式。线、多边形、曲线、圆和矩形都是几何原语的示例。\n\
  \n平面上的笛卡尔坐标系是一种基于网格的系统，使用相对于两个垂直轴的距离来定义点的一对数值坐标。这两个轴相交的地方是原点，其坐标值为 (0, 0)。回想一下数学课，当我们被要求在图表上绘制线条时，那就是笛卡尔坐标系。本质上，SVG\
  \ 是坐标平面上的形状，并以 XML 编写。\n\n相比之下，PNG、JPEG 和 GIF 是光栅图像。光栅图像使用像素网格创建。图 3.2 说明了光栅和矢量图形之间的差异。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_66_0.png)\n\n图 3.2 光栅与矢量图形\n\n由于其构造方式，SVG\
  \ 相对于光栅图像具有许多优势，包括无限可缩放。我们可以随意缩小或放大图像。我们可以缩小光栅图像，但不能在不出现像素化的情况下放大，因为放大像素网格会使网格的单个正方形变得可见。\n\
  \n当我们放大 SVG 时，由于我们在坐标平面上以编程方式设置形状和线条，点之间的路径会被重绘，质量不会下降。\n\n由于 SVG 以 XML 编写，我们可以直接将\
  \ SVG 代码放入 HTML 中，并以与处理其他 HTML 元素相同的方式访问、操作、编辑它。SVG 对于图形而言就像 HTML 对于网页一样。\n\n然而，当处理高度复杂或逼真的图像时，光栅是更好的选择。并非不可能使用\
  \ SVG 创建逼真图像，但这不切实际。使用矢量图形创建图像的文件大小以及因此加载图像的性能会显著大于作为光栅图像创建。\n\nSVG 最常见的用例是徽标、图标和加载器。我们使用它们作为徽标，因为它们通常是简单图像，需要在任何尺寸或媒介上都清晰。此外，公司或产品通常会有多个版本的徽标，例如用于深色背景与浅色背景的情况。重新着色、但也包括简洁性和可缩放性，也是我们将其用于图标的原因。\n\
  \n我们使用 SVG 作为加载器，因为与光栅对应物不同，我们可以在图像本身内添加动画。我们可以隔离图形内的单个元素并将 CSS 或 JavaScript 应用于该单个元素，这是光栅无法实现的练习。\n\
  \n前面我们提到 SVG 基于笛卡尔平面（二维坐标平面），让我们进一步深入了解这意味着什么以及它是如何工作的。\n\n#### 3.1.1 位置\n\n在处理\
  \ SVG 元素时，思考定位的方式是想象我们在网格上放置元素。一切都从 0,0（原点）开始，即 SVG 文档的左上角。\n\nX 或 Y 值越高，它就离左上角越远。位置以像素为单位测量，这是定位\
  \ SVG 元素在画布上的默认且唯一方式。图 3.3 扩展了图 3.2 中所示的船的示例，添加了原点和每个形状的坐标值。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_67_0.png)\n\
  \n图 3.3 在坐标平面上定位元素\n\n我们的加载器由 11 个矩形组成。为了放置它们，我们需要考虑它们在坐标平面上的位置，同时考虑它们的宽度和它们之间的间隙。\n\
  \n#### 3.1.2 视口\n\n视口是用户可以看到 SVG 的区域。它由两个属性设置：width 和 height。思考视口的方式是把它想象成一个相框，它设置了框架的大小。它不会影响其包含的图形的大小，然而，如果我们将一张大于框架的图像放入相框中，则会出现溢出。我们的\
  \ SVG 也会发生同样的情况。与定位一样，视口测量值的原点位于 SVG 的左上角。图 3.4 说明了这一概念。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_68_0.png)\n\
  \n```\n<svg>\n<rect width=\"600\" height=\"200\"\nx=\"50\" y=\"50\" />\n</svg>\n\
  ```\n\n```\n<svg width=\"250px\" height=\"150px\">\n<rect width=\"600\" height=\"\
  200\"\nx=\"50\" y=\"50\" />\n</svg>\n```\n\n图 3.4 有和没有定义视口的 SVG\n\n我们加载器的视口将为：\n\
  \n```\n<svg width=\"100%\" height=\"300px\"> <!--SVG code --> </svg>\n```\n\n宽度设置为\
  \ 100%，但 100% 是什么的？我们规定加载器将占据其父项提供的可用空间的 100%。列表 3.1 显示了我们的起始 HTML。我们看到我们的加载器嵌套在\
  \ section 内，因此我们的加载器将与 section 相同宽度。\n\n### 列表 3.1 起始 HTML\n\n```\n<body>\n<section>\n\
  <svg width=\"100%\" height=\"300px\"></svg> #A\n<h1>Scanning channels</h1>\n<p>This\
  \ may take a few minutes</p>\n<progress id=\"file\" width=\"100%\" value=\"32\"\
  \ max=\"100\">32%</progress> #B\n</section>\n</body>\n```\n\n\n\n\n#A 高度为 300 像素、宽度为\
  \ 100% 视口的加载器\n#B 稍后在本章中我们将讨论的进度条\n\n我们也有一些起始 CSS（代码清单 3.2），背景、section、header 和段落已被预先设置样式，以便专注于加载器、进度条和动画。\n\
  \n## 代码清单 3.2 起始 CSS\n\n```\nbody { background: rgb(0 28 47); }\n\nsection {\n \
  \ display: flex;              #A\n  flex-direction: column;     #B\n  justify-content:\
  \ space-between; #B\n  align-items: center;        #B\n  max-width: 800px;     \
  \      #B\n  margin: 40px auto;          #C\n  font: 300 100% 'Roboto', sans-serif;\
  \ #D\n  text-align: center;         #D\n  color: rgb(255 255 255);    #E\n}    \
  \                         #F\n\nh1 {\n  font-size: 4.5vw;\n  margin: 40px 0 12px;\n\
  }\n\np {\n  font-size: 2.8vw;\n  margin-top: 0;\n}\n```\n\n#A 开始设置加载器容器的规则\n#B 布局\n\
  #C 使用简写属性书写的边距。上下：40px 边距，左右：auto。\n#D 排版\n#E 颜色\n#F 结束设置加载器容器的规则\n\n我们可以看到我们的 section\
  \ 的宽度上限为 800 像素。`<section>` 是一个块级元素，因此默认情况下，它将占据其可用的全部宽度。`<body>` 和 `<html>` 也是块级元素。\n\
  \n由于我们没有为 `<body>` 或 `<html>` 指定宽度、内边距或边距，它们将占据窗口的全部宽度。`<section>` 将占据 `<body>`\
  \ 的全部宽度。然而我们为 `<section>` 分配了最大宽度，因此一旦窗口宽度达到 800 像素或更宽，section 将停止随 `<body>` 一起增长，并保持在\
  \ 800 像素宽度。因为它上下边距为 auto，它也会相对于 `<body>` 水平居中。\n\n我们的加载器包含在 section 内，section 在达到\
  \ 800 像素之前会占据 body 的全部宽度，因此我们的加载器也会如此。图 3.5 展示了加载器的宽度如何受屏幕尺寸影响。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_70_0.png)\n\
  \n# 图 3.5 窗口宽度对 SVG 宽度的影响\n\n设置好视口后，让我们设置 viewbox，以便 SVG 的内容能够随其容器缩放。因为记住，现在我们只处理了框架，而不是内部内容。\n\
  \n### 3.1.3 ViewBox\n\nviewbox 设置图形在其视口内的位置、高度和宽度。之前我们将视口比作一幅画框，viewbox 允许我们调整图像以适应我们的画框。它可以定位图像，并缩放图形使其能够放入画框内。我们可以将\
  \ viewbox 视为我们的平移和缩放工具。要设置 viewbox，我们将 viewBox 属性应用于 SVG，并使用以下 4 个值和语法：viewBox=\"\
  min-x min-y width height\"。代码清单 3.3 显示了 viewBox 应用于我们的加载器。\n\n按顺序拆解这些数字，我们从 min-x\
  \ 和 min-y 开始，两者都设置为 0。我们希望图形的左上角位于画框的左上角。Min-x 和 min-y 允许我们调整图形在其画框中的位置；它是平移工具。由于我们希望它完全位于左上角，因此将值设置为\
  \ 0。\n\n接下来我们应用宽度。它设置为 710，因为我们的加载器共有 11 条条形，每条宽度为 60。60 乘以 11 等于 660，我们还有 10 个间隙。每个条形之间的间隙宽度等于，5\
  \ × 10 = 50，因此我们的加载器宽度将为 660 + 50 = 710。\n\n我们还将 viewBox 的高度基于加载器中条形的高度。它们将具有 300\
  \ 的高度值，因此我们也将视口高度设置为 300。我们的加载器因此将完全适合其视口。\n\n## 代码清单 3.3 声明 viewbox\n\n```\n<svg\
  \ viewBox=\"0 0 710 300\" width=\"100%\" height=\"300px\">\n<!--SVG code-->\n</svg>\n\
  ```\n\n请注意，我们的 viewbox 和视口高度都等于 300。这就是我们缩放的方式。如果 viewbox 数字小于视口，则相当于向画框中缩小，图形会变小。如果\
  \ viewbox 数字大于视口，则相当于放大。由于我们视口和 viewbox 高度相等，因此我们没有缩放。\n\n现在我们已经定义了工作空间，我们可以开始向加载器添加形状了。\n\
  \n### 3.1.4 SVG 中的形状\n\n有一些标准的 SVG 形状/元素：\n\n- `rect`（矩形）\n- `circle`\n- `ellipse`\n\
  - `line`\n- `polyline`\n- `polygon`\n\n如果我们想要创建不规则形状，我们也可以使用 path。但我们不需要它用于此加载器。最常见的是，当我们查看标志、图标和复杂动画图形背后的\
  \ XML 时会看到它们。对于我们的项目，我们将使用基本的矩形形状来创建波浪。\n\n要定义将创建加载器条形的矩形，我们将使用 `<rect>` 元素并添加 4\
  \ 个属性：`height`、`width`、`x` 和 `y`。x 和 y 属性将确定矩形左上角相对于 SVG 左上角的位置。\n\n我们希望创建 11 个矩形（见代码清单\
  \ 3.4），宽度为 60，高度为 300，然后我们将使用 x 属性在图形上移动矩形。我们将从 0 开始，并按条形宽度（60）加上额外的间隙 5 增加值。每个矩形的\
  \ x 值将比前一个大 65。我们的第 11 个矩形应具有 650 的 x 值。\n\n```\nListing 3.4 11 rectangles\n<svg\
  \ viewBox=\"0 0 710 300\" width=\"100%\" height=\"300\">\n  <rect width=\"60\" height=\"\
  300\" x=\"0\" />\n  <rect width=\"60\" height=\"300\" x=\"65\" />\n  <rect width=\"\
  60\" height=\"300\" x=\"130\" />\n  <rect width=\"60\" height=\"300\" x=\"195\"\
  \ />\n  <rect width=\"60\" height=\"300\" x=\"260\" />\n  <rect width=\"60\" height=\"\
  300\" x=\"325\" />\n  <rect width=\"60\" height=\"300\" x=\"390\" />\n  <rect width=\"\
  60\" height=\"300\" x=\"455\" />\n  <rect width=\"60\" height=\"300\" x=\"520\"\
  \ />\n  <rect width=\"60\" height=\"300\" x=\"585\" />\n  <rect width=\"60\" height=\"\
  300\" x=\"650\" />\n</svg>\n```\n\n我们现在已将矩形定位在视口内，并且它们会随着我们增加和减少窗口大小而正确缩放，这是由我们的\
  \ viewBox 决定的。图 3.6 显示了不同窗口大小下的 SVG。（为使截图中更清晰，已在 SVG 和条形上添加了白色边框）。内容会在其可用空间内缩小和放大，随着窗口大小变化而改变宽高比，同时不会扭曲包含的矩形。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_72_0.png)\n\n![](img/b56145aa9b751926a7aedbd7172bc818_72_1.png)\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_72_2.png)\n\n图 3.6 在 SVG 内添加了 11 个矩形\n\
  \n请注意我们的矩形是黑色的，然而，下一步我们将对其进行样式设置。\n\n## 3.2 为 SVG 应用样式\n\n我们可以以与 HTML 几乎相同的方式为 SVG\
  \ 元素应用样式，内联、在 `<style>` 标签内，或在单独的样式表中。然而有一些细微差别。\n\n首先，最重要的是，SVG 如何导入到我们的 HTML 中会影响样式需要位于何处才能影响元素。\n\
  \n将矢量图形添加到网页的最简单方法是使用图像标签。我们以与任何其他图像相同的方式引用图像文件：`<img src=\"myImage.svg\" alt=\"\
  \">`。我们也可以在 CSS 中将其作为 `background-image` 添加：`background-image: url(\"myImage.svg\"\
  );`\n\n在这两种情况下，我们的 HTML 和样式可以影响 SVG 本身，但不能影响其内部的元素。例如，我们可以影响图像的大小，但不能更改 SVG 内部特定形状的颜色。图像本质上是一个我们无法穿透的黑盒，无法影响其中的变化。为了操纵其中的元素，样式需要在\
  \ SVG 本身内部放置。\n\n我们第三个选项，也是本章使用的选项，是将 SVG 的 XML 内联放置，直接在我们的 HTML 中，而不是在外部文件中，从而避免如果代码在外部文件时会遇到的黑盒问题。缺点是我们的关注点没有那么好分离，因为我们的图像代码现在与\
  \ HTML 混合在一起。\n\n将 SVG 放置在 HTML 中内联后，应用 CSS 到任何其他 HTML 元素的方式同样适用。因此，我们可以将想要应用于 SVG\
  \ 的样式放在我们的 CSS 中，就像对待任何其他 HTML 元素一样。\n\n## SVG 演示属性\n\n与 HTML 不同，在内联应用样式时我们需要包含\
  \ style 属性（例如：`<p style=\"background: blue\">`），SVG 有许多可以直接作为属性添加到元素上的样式。这些被称为 **演示属性**。**fill**\
  \ 例如，（SVG 等同于 `background-color`）可以直接应用于元素而无需 style 标签：`<rect fill=\"blue\">`。\n\
  \n这些属性不必内联直接应用于元素上。它们也可以在 style 标签或样式表中以与应用任何其他 CSS 样式相同的方式添加：`rect { fill: blue;\
  \ }`。\n\nSVG 演示属性的完整列表可以在 https://developer.mozilla.org/en-US/docs/Web/SVG/Attribute/Presentation\
  \ 找到\n\n尽管应用样式到 SVG 元素的技术与 HTML 相同（除了前面提到的当内联应用时 SVG 演示属性），我们用于设置元素样式的一些属性会有所不同。让我们更仔细地看看本项目中我们将使用的属性。\n\
  \n### 3.2.1 Fill\n\n要设置加载器条的背景颜色，我们将使用 `fill` 属性，而不是使用 `background-color`，因为 `background-color`\
  \ 属性对 SVG 元素不起作用。fill 属性仍然支持与 background-color 相同的取值，如颜色名称、RGB(a)、HSL(a) 和十六进制。因此，而不是\
  \ `rect { background-color: blue; }` 我们将改写为 `rect { fill: blue; }`。\n\n如果未为特定形状分配\
  \ `fill` 值，`fill` 将默认为黑色，这就是为什么我们的矩形目前是黑色的。\n\n\n\n\n让我们继续为矩形添加填充颜色。因为它们并不是全部同一种颜色（它们具有不同深浅的蓝绿色，以给加载器带来一点渐变效果），而不是为每个元素指定一个类，我们将使用伪类\
  \ nth-of-child(n)，它根据元素在其父项中的位置来匹配元素。我们将查找第 n 个矩形，并为其应用填充。因此，section rect:nth-of-type(3)\
  \ 将找到 section 容器中的第三个矩形。\n\n**记住：** 伪类针对的是元素的状态。在本例中是其相对于兄弟元素的相对位置。\n\n清单 3.5 显示了为我们的每个矩形应用的填充颜色。\n\
  \n## 清单 3.5 为我们的每个矩形添加填充颜色\n\n```\nrect:nth-child(1) { fill: #1a9f8c }\nrect:nth-child(2)\
  \ { fill: #1eab8d }\nrect:nth-child(3) { fill: #20b38e }\nrect:nth-child(4) { fill:\
  \ #22b78d }\nrect:nth-child(5) { fill: #22b88e }\nrect:nth-child(6) { fill: #21b48d\
  \ }\nrect:nth-child(7) { fill: #1eaf8e }\nrect:nth-child(8) { fill: #1c4a8d }\n\
  rect:nth-child(9) { fill: #17968b }\nrect:nth-child(10) { fill: #128688 }\nrect:nth-child(11)\
  \ { fill: #128688 }\n```\n\n图 3.7 显示了我们的输出，我们可以看到加载器中的每个条形不再是黑色，并且已应用了颜色。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_74_0.png)\n\
  \n图 3.7 为加载器矩形应用填充\n\n我们声明的唯一缺点是，如果还有另一个 SVG 图形也包含矩形，那么它可能会错误地设置样式。为避免此问题，我们可以为我们的\
  \ SVG 图形添加一个类名作为标识符，以指定我们想要设置样式的包含矩形的 SVG。\n\n## 3.3 动画模块\n\nCSS 动画模块允许我们使用关键帧来为属性设置动画，我们稍后会查看。除了关键帧之外，我们还可以控制动画的各个部分，例如动画持续多长时间，以及动画播放多少次。\n\
  \n### 3.3.1 动画属性\n\nanimation 属性是以下属性的简写：\n\n- `animation-name`\n- `animation-timing-function`\n\
  - `animation-iteration-count`\n- `animation-fill-mode`\n- `animation-duration`\n\
  - `animation-delay`\n- `animation-direction`\n- `animation-play-state`\n\n对于我们的动画，我们将重点关注其中\
  \ 4 个属性：\n\n1. `animation-name`\n2. `animation-duration`\n3. `animation-iteration-count`\n\
  4. `animation-delay`\n\n我们想要创建的效果是每个矩形在一段时间内缩小和变大，但并非全部同步。在任何给定时间，我们希望元素高度略有不同。当它们在缩小和变大时，我们希望矩形的顶部和底部向中心靠拢，然后再次扩展回全高。基本上，我们将创建一个挤压效果，从大到小再回到大。\n\
  \n尽管我们将对所有矩形应用相同的动画，但为了使它们的尺寸错开，我们将为每个矩形动画的开始应用略有不同的延迟。由于每个矩形开始动画的时间不同，每个矩形都处于扩展和收缩的不同阶段，从而产生涟漪波效果。\n\
  \n让我们先看看如何创建动画本身。然后我们将看看如何将其应用于矩形。最后我们将添加单独的延迟以在任何给定时间错开大小。要创建动画，我们将使用关键帧。然后 animation\
  \ 属性将引用关键帧并规定持续时间、延迟以及我们希望动画运行的次数。\n\n### 3.3.2 关键帧和动画名称\n\n当我们创建关键帧时，我们需要为关键帧命名。animation-name\
  \ 声明的值与关键帧名称匹配，将两者连接起来。使用 animation-name 属性，我们可以列出多个用逗号分隔的动画。\n\n关键帧源自动画和电影行业。公司以前手工制作动画时，会制作许多单独的图片，然后在每张图片或帧中进行更改。随着时间的推移，我们不断对每帧进行更改，最终会达到结束帧。这种技术的简单示例是翻页书动画。帧数越多，短时间内调整越细微，动画就越流畅。\n\
  \n关键帧代表动画中最重要的（关键）变化（帧）。然后浏览器会计算出每帧之间的所有帧。这被称为中间帧。允许硬件执行工作，它可以快速填充所有这些中间帧，在一个状态和另一个状态之间创建平滑过渡。此概念在图\
  \ 3.8 中进行了图解。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_76_0.png)\n\n在 CSS 中，关键帧是一个\
  \ at-rule，它控制动画序列中发生的步骤。at-rule 是 CSS 语句，用于规定我们的样式应如何表现或何时应用。它们以 @ 符号开头，后跟标识符（在我们的例子中为\
  \ keyframes）。语法如下 @keyframes animation-name { ... }。括号内的代码定义了动画的行为。\n\n关键帧内的每个步骤都由一个百分比（动画中经过的时间百分比）和在达到该时间点时应用的样式来定义。让我们看一个示例（清单\
  \ 3.6，此示例也可以在 codepen 上找到 https://codepen.io/martine-dowden/pen/dydmWZO，在那里我们可以看到动画运行）。\n\
  \n该示例有两个关键帧，一个名为 color，一个名为 border-radius。我们已将两个动画都应用于一个 div。然后我们定义了动画运行所需的时间（3\
  \ 秒），以及应运行的次数（10 次）。\n\n在每个关键帧内部，是应应用于元素的样式。我们注意到我们有两种不同的表示法，我们有关键字和百分比。让我们分解我们在第一个关键帧中定义的内容。\n\
  \n我们断言当动画开始时（0%），我们希望将 div 的背景颜色设置为蓝色。到动画的 50% 时（3 秒的一半或 1.5 秒），我们的背景将变为黄色。当动画结束时（100%，或\
  \ 3 秒时），我们的背景将变为红色。在步骤之间，我们会看到从一个状态到下一个状态的平滑变化。\n\n在第二个关键帧 border-radius 中，我们使用关键字\
  \ from 和 to 而不是百分比。from 等同于 0%，to 等同于 100%。我们还注意到，我们可以在同一关键帧中混合使用我们想要的表示法。\n\n##\
  \ 清单 3.6 示例动画\n\n```\n@keyframes color {\n  0% { background: blue }    #A\n  50%\
  \ { background: yellow }  #A\n  100% { background: red }   #A\n}\n\n@keyframes border-radius\
  \ {\n  from { border-radius: 0 }   #B\n  50% { border-radius: 50% }  #B\n  to {\
  \ border-radius: 0 }     #B\n}\n\ndiv {\n  animation-name: color, border-radius;\
  \   #C\n  animation-duration: 3s;                #D\n  animation-iteration-count:\
  \ 10;         #E\n}\n```\n\n#A 第一个关键帧，名为 \"color\"\n#B 第二个关键帧，名为 \"border-radius\"\
  \n#C animation-name 属性引用了两个关键帧\n#D 设置动画完成所需的时间\n#E 设置动画应运行的次数\n\n当我们将动画应用于 div 时，我们还设置了持续时间和迭代次数。请注意，这两个值同时应用于我们的两个动画。在更仔细地查看这两个属性及其工作原理之前，让我们继续为我们的加载器创建关键帧。\n\
  \n对于我们的加载器，我们希望随着时间的推移放大和缩小，或缩放我们的矩形。因此我们将我们的关键帧命名为 scale。我们的 at-rule 将如下所示：@keyframes\
  \ scale { }。\n\n在 at-rule 内部，我们然后定义动画的步骤（或帧）。我们将从矩形具有其全高开始。动画进行到一半时，我们希望矩形的高度为其原始高度的\
  \ 20%。当动画终止时，我们希望矩形的高度恢复到全尺寸。因此我们将定义 3 个步骤：from（或 0%）、50% 和 to（或 100%）。\n\n\n\n\n\
  \n要改变矩形的大小，我们将使用 `transform` 属性。它允许我们改变元素的外观（旋转、缩放、扭曲、移动...），而不影响周围的元素。如果我们使用 `height`\
  \ 属性来减小一个 `div` 的高度，下方的内容会向上移动以填补新出现的空间。而使用 `transform` 时，元素在页面流中的占用空间和位置不会改变，只有其可见的外观会改变。采用相同的场景，如果我们使用\
  \ `transform` 来减小同一个 `div` 的高度，下方的内容就不会向上移动。我们会留下一个空白区域。\n\n要影响元素，`transform` 属性需要一个\
  \ `transform-function`。我们将使用 `scaleY()`。 （可用的完整函数列表可以在这里找到：https://developer.mozilla.org/en-US/docs/Web/CSS/transform-function）。\n\
  \n`scaleY()` 函数会垂直调整元素的大小，而不影响其高度，对其进行挤压或拉伸。为了定义元素应该被压缩或拉伸多少，我们向该函数传递一个百分比或一个数字。数值映射到其百分比等价的十进制值，因此\
  \ `scaleY(.5)` 和 `scaleY(50%)` 都能达到相同的效果，即将元素的高度减小到原始值的 50%。超过 100% 的值会增大元素的尺寸，而\
  \ 0 到 100% 之间的值会使其缩小。\n\n对 `scaleY()` 应用负值会使元素垂直翻转，因此 `scaleY(-0.5)` 会使元素上下颠倒并将其高度缩小\
  \ 50%。`scaleY(-1.5)` 会使元素上下颠倒并使高度变为原始值的 1.5 倍。\n\n对于我们的加载条，我们希望矩形在动画开始和结束时为全高，而在动画进行到一半时为原始高度的\
  \ 20%。因此应用变换后的完整关键帧将如下所示（清单 3.7）。\n\n## 清单 3.7 完成的 keyframe\n\n```\n@keyframes scale\
  \ {\n  #A\n  from { transform: scaleY(1) }  #B\n  50% { transform: scaleY(0.2) }\
  \ #C\n  to { transform: scaleY(1) }   #D\n}                               #E\n\n\
  rect { animation-name: scale; }  #F\n```\n\n#A scale at-rule 的开始\n#B 以全高开始动画\n#C\
  \ 动画进行到一半时，高度应为原始值的 20%\n#D 动画结束时，将矩形恢复为全高\n#E scale at-rule 的结束\n#F 将 keyframe\
  \ 应用到矩形\n\n如果我们运行代码，会注意到没有任何变化，我们的矩形还没有开始变大变小，即使我们已经将 keyframe 应用到矩形上。我们仍然需要定义持续时间和迭代次数。让我们进一步深入研究这些属性。\n\
  \n## 3.3.3 持续时间\n\n持续时间设置我们希望动画从开始到结束花费多长时间。持续时间可以用秒（s）或毫秒（ms）设置。持续时间越长，动画完成得越慢。考虑到可访问性，我们需要考虑对运动敏感的用户并选择一个合理的持续时间。\n\
  \n### 动画、癫痫发作和闪烁频率\n\nW3C 建议为了防止因光敏性而诱发用户癫痫发作，我们需要确保我们的动画在任何一秒时间内不会闪烁超过三次¹。\n\n\
  选择合适的动画时序有很多因素。一个动画过快可能会变得无法感知或因其性质而导致癫痫发作。一个动画过慢会使我们的应用程序看起来卡顿。对于诸如重新排序列表时翻转箭头指向方向这样的小型微动画，我们的持续时间应很短。大多数微动画都是过渡性的。它们会动画化元素从一种状态到另一种状态的变化。这种类型动画普遍接受的持续时间约为\
  \ 250 毫秒。\n\n如果动画更大或更复杂，例如打开和关闭大型面板或菜单，那么我们可以将持续时间增加到约 500 毫秒。加载器则有所不同，它不是对用户操作做出快速响应的短暂变化，而是一个用户会在一段时间内专注于的大型视觉元素。\n\
  \n在确定加载器的“正确”时序时，我们通常会通过反复试验找到最适合我们图形的速度。对于我们的项目，我们希望动画在 2.2 秒内完成。为了应用动画应花费的时间，我们将\
  \ `animation-duration` 属性添加到我们的矩形中，如清单 3.8 所示。\n\n## 清单 3.8 添加动画持续时间\n\n```\nrect\
  \ {\n  animation-name: scale;\n  animation-duration: 2.2s;\n}\n```\n\n当我们运行代码时，会注意到我们的加载器动画一次然后就不再继续，除非我们重新加载浏览器窗口。我们还注意到所有条形同时增大和减小。让我们先处理让加载器随时间持续动画的问题，然后我们可以错开矩形之间的动画，使它们看起来高度不同。\n\
  \n## 3.3.4 迭代次数\n\n为了使动画在完成后重新开始，我们需要使用 `iteration-count` 属性。它设置动画应重复的次数。默认值是 1。由于我们尚未设置值，浏览器假定我们希望动画运行一次然后结束。对于我们的动画，我们希望它持续重复，为此我们使用\
  \ `infinite` 关键字值。\n\n通过应用此值，我们声明动画应永远持续播放。如果我们想运行特定次数，我们将使用整数值。添加迭代次数后，我们的代码如下所示（清单\
  \ 3.8）。\n\n## 清单 3.9 添加动画迭代次数\n\n```\nrect {\n  animation-name: scale;\n  animation-duration:\
  \ 2.2s;\n  animation-iteration-count: infinite;\n}\n```\n\n运行代码时，我们可以看到所有矩形从顶部开始同步放大和缩小，并且动画在完成后会重新开始。我们仍有一些工作要做，以便设置动画从矩形中间开始而不是顶部，并错开元素之间的动画，但让我们先暂停一下来查看动画简写属性。\n\
  \n## 3.3.5 动画简写属性\n\n我们目前有 3 条声明定义了我们的动画：animation-name、animation-duration 和 animation-iteration-count。\n\
  \n我们可以通过动画简写属性将这三者合并来简化代码。`animation: scale 2.2s infinite;` 在功能上与我们当前应用于矩形的代码完全相同。使用简写属性使我们的代码更简洁，并且可能更容易阅读，然而如果你发现写出每个属性对你来说更容易，两种方法都是完全有效的。做最适合你的方法。\n\
  \n使用动画简写属性，我们更新后的 rect 规则将为：`rect { animation: scale 2.2s infinite }`。对代码进行更改后，我们会注意到动画没有变化。\n\
  \n接下来让我们解决每个矩形高度错开的问题。\n\n## 3.3.6 延迟\n\n`animation-delay` 属性顾名思义，它允许我们在元素上延迟动画的开始。延迟适用于动画的开始。一旦动画开始，它将正常循环。与持续时间一样，我们可以使用秒（s）或毫秒（ms）来设置延迟的持续时间值。默认值是\
  \ 0 秒。默认情况下，动画不会有延迟。为了在动画中创建错开的效果，我们将为每个矩形分配不同的延迟值，如清单 3.9 所示。第一个矩形的动画会立即开始。我们给它一个\
  \ 0 的延迟。我们可以完全省略此声明，因为 0 是 animation-delay 的默认值。这里添加它是为了在解释代码时更清晰。\n\n第二个矩形延迟 200\
  \ 毫秒，我们之后为每个矩形继续以 200 毫秒递增延迟。请注意在第 6 个矩形上我们\n\n\n\n切换为使用秒而不是毫秒。我们这样做是为了使代码更易读，因为秒或毫秒值都是可以接受的。\n\
  \n## Listing 3.10 Added animation iteration count\n\n```\nrect:nth-child(1) {\n\
  \  fill: #1a9f8c;\n  animation-delay: 0ms;\n}\n\nrect:nth-child(2) {\n  fill: #1eab8d;\n\
  \  animation-delay: 200ms;\n}\n\nrect:nth-child(3) {\n  fill: #20b38e;\n  animation-delay:\
  \ 400ms;\n}\n\nrect:nth-child(4) {\n  fill: #22b78d;\n  animation-delay: 600ms;\n\
  }\n\nrect:nth-child(5) {\n  fill: #22b88e;\n  animation-delay: 800ms;\n}\n\nrect:nth-child(6)\
  \ {\n  fill: #21b48d;\n  animation-delay: 1s;\n}\n\nrect:nth-child(7) {\n  fill:\
  \ #1eaf8e;\n  animation-delay: 1.2s;\n}\n\nrect:nth-child(8) {\n  fill: #1ca48d;\n\
  \  animation-delay: 1.4s;\n}\n\nrect:nth-child(9) {\n  fill: #17968b;\n  animation-delay:\
  \ 1.6s;\n}\n\nrect:nth-child(10) {\n  fill: #128688;\n  animation-delay: 1.8s;\n\
  }\nrect:nth-child(11) {\n  fill: #128688;\n  animation-delay: 2s;\n}\n```\n\n添加延迟后，我们可以看到（图\
  \ 3.8）我们已经实现了交错效果。然而，元素是从顶部而不是从中心进行生长和收缩的。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_82_0.png)\n\
  \nFigure 3.9 Animated rectangles with height change emanating from the top\n\n为了指定我们希望元素从何处生长和收缩，我们需要告诉浏览器动画应从矩形的哪个位置开始。为此，我们现在将研究\
  \ transform-origin 属性。\n\n## 3.4 Transform origin\n\ntransform-origin 属性设置动画应从哪个位置开始（原点）。如果变换发生在三维（3D）中，则该值可以多达三个值（x、y\
  \ 和 z）；当它为二维（2D）时，则最多为 2 个值（x 和 y）。\n\n第一个值是水平位置或 X 轴，第二个值是垂直或 Y 轴，然后在 3D 工作时第三个值将是前后或\
  \ Z 轴。\n\ntransform-origin 的值有 3 种声明方式：\n\n- 1. Length\n- 2. Percentage\n- 3. Keywords\n\
  \  - a) Top\n  - b) Right\n  - c) Bottom\n  - d) Left\n  - e) Center\n\n在 HTML 中，此属性的初始值为\
  \ 50% 50% 0，因此这是中心、中心、平面。然而，对于 SVG 元素，初始值为 0, 0，这会将其放置在左上角。\n\n对于我们的动画，我们希望矩形变换原点位于中心。我们希望矩形的顶部和底部收缩，而不是顶部保持固定并从该点展开和收缩。为此，我们可以为矩形应用关键字值\
  \ `center` 或将百分比值 `50%` 设置为 `transform-origin` 属性。\n\n无论哪种方式，我们都表示希望原点从矩形的中心发生。对于我们的项目，我们将使用关键字值。Listing\
  \ 3.9 显示了我们更新后的 `rect` 规则。\n\n我们之前提到过，在处理 2D 动画时，该属性将采用 2 个值，但我们只传递了一个值。当只传递一个值时，它将应用于垂直和水平位置，因此\
  \ `transform-origin: center;` 等同于 `transform-origin: center center;`。\n\n## Listing\
  \ 3.11 Updated rect rule with transform-origin property\n\n```\nrect {\n  animation:\
  \ scale 2.2s infinite;\n  transform-origin: center;\n}\n```\n\n我们已经完成了加载动画（图 3.10），但是我们仍然需要考虑我们的设计是否易于访问。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_83_0.png)\n\nFigure 3.10 Finished Loader\
  \ Animation\n\n下一节将深入探讨我们如何确保为所有用户提供积极的体验。\n\n## 3.5 Accessibility and the reduced\
  \ motion query\n\n随着实现变得更容易且浏览器支持得到改善，网络上使用运动、视差（背景移动速度比前景慢）和动画的情况有所增加。通过使用这些技术，我们可以创建更丰富的用户界面，使其具有交互性并在体验中提供更大的深度。\n\
  \n然而，使用这些技术是有代价的。对于某些用户，尤其是患有前庭功能障碍的人来说，屏幕上的运动可能会引起头痛、头晕和恶心。正如我们之前提到的，动画也可能引起癫痫发作，尤其是如果它们包含闪烁的元素。\n\
  \n在许多操作系统中，用户可以选择在设备上禁用动画。在我们的应用程序中，我们需要确保尊重这些偏好。为了检查用户设置，级别 5 媒体查询模块引入了 prefers-reduced-motion\
  \ 媒体查询。这是一个 at-rule，它检查用户对屏幕上运动的偏好，并允许我们根据用户的偏好应用条件样式。此查询有两个值：\n\n- - `no-preference`\n\
  - - `reduce`\n\n我们可以选择在用户偏好减少运动时禁用动画，或在他们未指定偏好时启用它。用户偏好减少运动并不意味着我们完全不能使用任何动画，而是我们应该选择性地保留哪些动画。决定哪些动画保持启用的因素可能包括：\n\
  \n- - 它有多快\n- - 它使用视口的多少\n- - 闪烁频率\n- - 它对网站功能或内容理解是否至关重要\n\n值得一提的是，用户可能更喜欢减少或不使用动画，但可能不知道系统偏好设置以选择退出动画，因此根据网站动画的多少，提供站内退出按钮可能很有用。\n\
  \n> **Accessibility Guidelines for Animations**\n> 用户应该能够暂停、停止或隐藏持续超过 3 秒且不被视为必要的动画。加载器在这一点上有点棘手，因为它们向用户传达重要信息（应用程序正在执行某些操作，而不是冻结）。²\n\
  \n我们的加载器可以被视为必要内容，但我们也在其下方提供了一个进度条，它也为用户提供了应用程序正在执行的操作的指示。由于信息也在下方通过不同的媒体传达，并且动画非常大、移动很多，并且可能持续超过三秒，我们将为偏好减少运动的用户禁用它，使用\
  \ Listing 3.10 中的代码。\n\n## Listing 3.12 Disabling the animation for users who prefer\
  \ reduced motion\n\n```\n@media (prefers-reduced-motion: reduce) { #A\n  rect {\
  \ animation: none; }    #A #B\n}\n#A\n```\n\n#A 在 at-rule 中，当用户启用 prefer-reduced-motion\
  \ 时有条件地应用样式\n#B 禁用之前应用于矩形的动画\n\n为了验证我们是否成功禁用了动画，而不是必须编辑机器的设置，我们可以进入浏览器开发者工具，在控制台选项卡显示中，选择渲染选项卡（如果尚未显示，使用垂直省略号并从菜单中选择它，单击省略号），并启用减少运动仿真。图\
  \ 3.11 显示了在 Chrome 版本 102.0.5005.61 中禁用的动画和开发者工具。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_85_0.png)\n\
  \nFigure 3.11 Emulating reduced motion preference using Chrome dev tools\n\n加载动画完成后，并且可访问性需求得到处理，让我们把注意力转向屏幕底部的进度条。\n\
  \n## 3.6 Styling an HTML progress bar\n\n`<progress>` HTML 元素可用于显示正在加载、上传或数据传输的情况。它通常用作向用户展示任务完成程度的方式。\n\
  \n`progress` 元素的默认样式在浏览器和操作系统之间会有所不同。进度条的大部分功能在操作系统级别处理，因此我们可用于重新设置控件样式的属性很少，尤其是在条本身内部的有色进度指示器方面。\n\
  \n我们将研究一些可用的变通方法及其陷阱，但在开始之前，让我们先从我们可以轻松完成的事情开始。\n\n图 3.12 显示了由 Listing 3.11 中的 HTML\
  \ 生成的起点。此时，尚未对控件应用任何样式。显示的是作者机器生成的默认值。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_86_0.png)\n\
  \nFigure 3.12 Progress bar starting point\n\n## Listing 3.13 Progress bar HTML\n\
  \n```\n<body>\n  <section>\n    ...\n    <progress value=\"32\" max=\"100\">32%</progress>\
  \ #A\n  </section>\n```\n\n#A 进度条\n\n### 3.6.1 Styling the progress bar\n\n让我们先从更改高度和宽度开始。为了增加进度条的宽度以匹配\
  \ section 的宽度，我们将 `width` 属性的值设为 100%。我们还希望将高度增加到 24px。\n\n要更改进度指示器的颜色，即控件的有色部分，我们可以使用一个相当新的属性：`accent-color`。此属性允许我们更改复选标记、单选输入和进度元素等表单控件的颜色。我们将其设置为\
  \ #128688，与加载器最后一根条的颜色相匹配。Listing 3.12 显示了我们迄今为止的进度规则。\n\n## Listing 3.14 Progress\
  \ rule\n\n```\nprogress {\n  height: 24px;\n  width: 100%;\n  accent-color: #128688;\n\
  }\n```\n\n\n\n\n\nFigure 3.13 shows the Lising 3.12 styles applied to our control.\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_87_0.png)\n\nFigure 3.13 Width, height,\
  \ and accent color applied to the progress element\n\nIf we try to add a background\
  \ color to our element (background: pink), we will notice that it does not work.\
  \ As a matter of fact, it fails quite spectacularly (Figure 3.14) as it radically\
  \ changes the appearance of the element and alters the accent-color we had previously\
  \ set. Furthermore, the background color changes to gray rather than pink.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_87_1.png)\n\
  \nFigure 3.14 Background color failure\n\nSo how do we get around this problem?\
  \ In order to restyle the control, we need to ignore the default, and recreate the\
  \ styles from scratch. To do that though we will need to use vendor prefixed properties.\n\
  \n## 3.7 Vendor Prefixes\n\nHistorically when browsers were introducing new properties\
  \ they would be added with a vendor prefix before the property name. Each browser’s\
  \ prefix is based on the rendering engine they use. Table 3.1 displays major browsers\
  \ and their prefixes.\n\n## Table 3.1 Vendor prefixes and their browsers\n\n| Prefix\
  \ | Browsers |\n|---|---|\n| -webkit- | Chrome, Safari, Opera, most IOS browsers\
  \ (including Firefox for IOS), Edge |\n| -moz- | Firefox |\n\nHowever, vendor prefixed\
  \ properties were never meant, and still aren’t fit, for production use. They are\
  \ often incomplete or non-standard implementations that browsers may choose to either\
  \ remove or completely refactor at any time. Although this fact has been clearly\
  \ documented for years, developers, eager to use the latest available properties,\
  \ regularly used them in production nonetheless.\n\nTo prevent this continued behavior\
  \ most major browsers have moved to shipping experimental features behind a feature\
  \ flag. To enable the feature and play with it, the user must go into their browser\
  \ settings and enable that specific flag. By moving to a flag based method, the\
  \ browsers are able to let developers play with experimental cutting edge features\
  \ without fear that a non standard implementation might be leveraged in a piece\
  \ of production code. However many vendor prefixed properties are still available\
  \ in the wild.\n\nThe rest of this chapter covers how we could continue to style\
  \ the progress bar, however, the code presented is not suitable for production use.\
  \ We cover it, to show how a developer could test out an experimental feature that\
  \ has a browser prefix. If we want a safe, stable, production worthy implementation,\
  \ we should stop where we were before attempting to add the background color. To\
  \ add a custom background color and continue to customize the control, we will need\
  \ to use vendor prefixed properties.\n\nThe first thing we will do to fix our background\
  \ color issue is remove the default appearance of the control.\n\n### 3.7.1 Appearance\
  \ property\n\nTo reset the appearance of the progress element we use the `appearance`\
  \ property. By setting its value to `none`, we cancel out the default styles provided\
  \ by the user agent. Since we will be creating all of the styles from scratch, we\
  \ can also remove the accent-color property, as it will no longer have any effect.\
  \ We will keep our height and width, and also add a border-radius since we are going\
  \ to have a curved finish. Although the appearance property is supported by all\
  \ major browsers, we will still need to include the vendor prefixed version in order\
  \ for the vendor prefixed values we add next to work. Listing 3.13 shows our updated\
  \ rule.\n\n## Listing 3.15 Progress rule\n\n```\nprogress {\n  height: 24px;\n \
  \ width: 100%;\n  border-radius: 20px;\n  -webkit-appearance: none;\n  -moz-appearance:\
  \ none;\n  appearance: none;\n}\n```\n\nAt this juncture, our progress bar looks\
  \ the same as when we broke it adding the background color. This is to be expected.\
  \ With appearance none added, we can now start altering the control in ways we previously\
  \ could not. We will first focus on browsers with a -webkit- prefix.\n\n### 3.7.2\
  \ Styling the progress bar for -webkit- vendor prefixed browsers\n\nThere 3 vendor\
  \ prefixed pseudo elements we can use to edit the styles of our progress bar:\n\n\
  - ::-webkit-progress-inner-element - is the out most part of the progress element.\n\
  - ::-webkit-progress-bar - the entire bar of the progress element, the portion under\
  \ the progress indicator. Is the child of ::-webkit-progress-inner-element\n- ::-webkit-progress-value\
  \ - is the progress indicator. Is the child of ::-webkit-progress-bar\n\nWe will\
  \ use all three values to style our element.\n\nLet’s start from the inside and\
  \ work our way outwards. The first part we will want to style is the progress indicator.\
  \ For that we will need to use ::-webkit-progress-value.\n\nWe curve the edges and\
  \ change the color of the bar to be a light blue as seen in Listening 3.14.\n\n\
  ## Listing 3.16 Styling the progress indicator in Chrome\n\n```\n::-webkit-progress-value\
  \ {\n  border-radius: 20px;\n  background-color: #7be6e8;\n}\n```\n\nFigure 3.15\
  \ shows our output in Chrome.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_89_0.png)\n\
  \nFigure 3.15 Progress Value styled in Chrome\n\nNext we will edit the background\
  \ behind the progress indicator using ::-webkit-progress-bar. We will also add rounded\
  \ corners to the background, and change the color to a linear gradient going from\
  \ a dark green to a light blue keeping with the theme of the whole piece.\n\nThe\
  \ linear-gradient function takes a direction followed by a series of color and percentage\
  \ pairs. The direction dictates the angle of the gradient, the color percentage\
  \ pairs dictate at which points within the gradient we want to shift from one color\
  \ to another. We will use the keyword value to right as our direction. Then, we\
  \ set a starting color of #128688 and an ending color value of #4db3ff. Our gradient\
  \ will therefore go from left to right fading from our start color to our end color.\n\
  \n## CSS Gradient Generators and Vendor Prefixes\n\n> As gradients can be tedious\
  \ to write by hand, many CSS gradient generators have been created and are freely\
  \ available on the web. Many still include vendor prefixes in their generated code.\
  \ These prefixes are no longer necessary as gradients are now supported by all major\
  \ browsers.\n\nFinally we also add a border radius to the outermost container. The\
  \ CSS for our progress-bar is shown in Listing 3.15.\n\n## Listing 3.17 Styling\
  \ the progress indicator container in Chrome\n\n```\n::-webkit-progress-bar {\n\
  \  border-radius: 20px;\n  background: #0eb98f;\n  background: linear-gradient(to\
  \ right, #128688 0%,#4db3ff 100%);\n}\n::-webkit-progress-inner-element {\n  border-radius:\
  \ 20px;\n}\n```\n\nOur progress indicator looks great in Chrome (Figure 3.16), but\
  \ let’s take a look at what it looks like in Firefox.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_91_0.png)\n\
  \nFigure 3.16 Styled progress indicator in Chrome\n\nIn Firefox (figure 3.17) we\
  \ see that our control remains fairly unstyled because instead of -webkit vendor\
  \ prefix, it uses -moz.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_91_1.png)\n\n\
  Figure 3.17 Unstyle progress bar in Firefox\n\nHaving written the -webkit prefixed\
  \ code, we now need to do the same for browsers that use a -moz vendor prefix.\n\
  \n### 3.7.3 Browser prefixes Styling the progress bar for -moz- vendor prefixed\
  \ browsers\n\nWe will approach the styles a bit differently for Firefox since we\
  \ don't have as many properties to play with. The only -moz prefixed property at\
  \ our disposal is ::-moz-progress-bar. Also a pseudo element, it targets the progress\
  \ indicator itself.\n\nWe will therefore style it the same way we styled ::-webkit-progress-value\
  \ for Chrome, because we want to achieve the same look in both browsers. Since we\
  \ are using the same\n\nstyles it is logical to add the -moz selector to the already\
  \ existing rule: ::-moz-progress-bar, ::-webkit-progress-value { ... }. It works\
  \ great in Firefox (Figure 3.18), however it will break Chrome (Figure 3.19).\n\n\
  ![](img/b56145aa9b751926a7aedbd7172bc818_92_0.png)\n\nFigure 3.18 Firefox Progress\
  \ Bar Styled\n\n![](img/b56145aa9b751926a7aedbd7172bc818_92_1.png)\n\nFigure 3.19\
  \ Adding both selectors the the same rule breaks Chrome\n\nHaving multiple selectors\
  \ on the same rule should not cause this type of side effect, however, we are dealing\
  \ with experimental properties which sometimes have non standard behaviors. To prevent\
  \ this unfortunate side effect, we will write 2 identical rules, one for each selector\
  \ as seen in Listing 3.16.\n\n## Listing 3.18 Styling the progress indicator container\
  \ in Chrome\n\n```\n::-webkit-progress-value {    #A\n  border-radius: 20px;   \
  \ #A\n  background-color: #7be6e8; #A\n}\n\n::-moz-progress-bar {    #B\n  border-radius:\
  \ 20px;    #B\n  background-color: #7be6e8; #B\n}\n```\n\n#A Rule for Chrome\n#B\
  \ Rule for Firefox\n\n\n\n\n\n要为 Firefox 更改背景颜色，我们为 progress 元素本身添加一个 background\
  \ 属性值。我们将使用在 `::-webkit-progress-bar` 规则中使用的相同渐变。图 3.20 显示了我们在 Firefox 中的进度。\n\n\
  ![](img/b56145aa9b751926a7aedbd7172bc818_93_0.png)\n\n图 3.20 为 progress 元素应用背景后的\
  \ Firefox\n\n我们需要做的最后一件事是移除边框，我们将把它应用到 progress 规则上。为此我们将 border 属性值设为 none。我们的最终\
  \ progress 规则如清单 3.17 所示。\n\n## 清单 3.19 最终化的 progress 规则\n\n```\nprogress {\n  height:\
  \ 24px;\n  width: 100%;\n  -webkit-appearance: none;\n  -moz-appearance: none;\n\
  \  appearance: none;\n  border-radius: 20px;\n  background: linear-gradient(to right,\
  \ #128688 0%,#4db3ff 100%);  #A\n  border: none;                               \
  \            #B\n}\n```\n\n#A 渐变背景\n#B 移除边框\n\n正如我们在图 3.21 中看到的，我们在 Chrome 和 Firefox\
  \ 中实现了相同的外观。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_94_0.png)\n\n图 3.21 Firefox\
  \ 中完成的进度条样式\n\n我们必须强调，这些样式是使用非标准的实验性功能实现的，因此不应在生产环境中使用。这里的价值在于能够在功能变得普遍可用之前尝试新功能。这也可以成为参与社区的机会，因为开发浏览器功能和规范的工作组在新标准被接受并推广供一般使用之前，通常会请求社区提供反馈。\n\
  \n## 3.8 总结\n\n- `animation` 属性是一种使用 CSS 更改位置、颜色或其他视觉元素的方式。\n- 关键帧是一种描述元素在其动画过程中的外观的方式。\n\
  - 我们随后可以使用 `animation-delay` 属性延迟动画的开始\n- `animation-duration` 设置动画完成所需的时间\n- SVG\
  \ 可以使用 CSS 进行样式设置\n- `prefers-reduced-motion` 媒体查询允许我们根据用户设置有条件地设置动画样式\n- HTML progress\
  \ bar 是一种显示某物上传或加载程度的方式。\n- 默认情况下浏览器会为进度条应用自己的样式，但可以使用 `appearance` 属性将其重置，值为 `none`。\n\
  - 我们对 progress 元素的样式能力相当受限\n- 有一些实验性属性可用于设置 progress 元素的样式，但它们需要使用厂商前缀\n- 厂商前缀属性是实验性的，我们不应在生产代码中使用厂商前缀\n\
  \n## 4\n\n## 创建响应式网页报纸布局\n\n### 本章涵盖\n\n- 使用 CSS 多列布局模块创建报纸布局\n- 使用计数器样式 CSS at-rule\
  \ 创建自定义列表样式\n- 使用 filter 属性设置图像样式\n- 处理损坏的图像\n- 格式化标题\n- 使用 quotes 属性为 HTML 元素添加引号\n\
  - 使用媒体查询根据屏幕尺寸更改布局\n\n在第 1 章中，我们研究了创建单列文章，这教会了我们 CSS 的基本原理。然而，设计相当简单。让我们重新审视格式化文章的概念，但使其在视觉上更有趣。在本章中，我们将把内容样式化，使其看起来像图\
  \ 4.1 所示的报纸页面。\n\n## 报纸标题\n\n星期二，2021 年 9 月 5 日\n\n## 文章标题\n\nJohn Doe\n\nMaecenas\

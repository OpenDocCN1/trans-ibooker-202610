  \ 仓库中找到：https://github.com/michaelgearon/Tiny-CSS-Projects/tree/main/chapter-08。\n\
  \n## 8.2 主题化\n\n尽管我们的布局有 2 个明确定义的区域（购物车和摘要），并且需要在不同屏幕尺寸下工作，但有一些样式无论它们位于何处或屏幕尺寸如何都不会改变。这些包括\n\
  \n- 使用的字体\n- 按钮和链接样式\n- 输入和错误消息样式\n- 标题大小和颜色\n\n这些类型的样式可以称为我们的主题，为了在页面上保持一致，我们通常希望一次编写它们并在任何地方应用。让我们从我们的字体开始。\n\
  \n### 8.2.1 排版\n\n目前我们的 `font-family` 是浏览器的默认值。在我的例子中它是 Times New Roman，但这可能因您的操作系统、浏览器和系统设置而异。图\
  \ 8.3 显示了默认字形和开发工具指示正在使用 Times New Roman。在大多数浏览器中，右键单击页面并选择检查将打开开发工具。由于 font-family\
  \ 未被明确设置，一些浏览器会隐藏它，您可能需要通过计算属性列表顶部的复选框或通过浏览器工具设置来兴奋地告诉浏览器显示所有属性。\n\n## Checkout\n\
  \n## My Cart\n\n![](img/b56145aa9b751926a7aedbd7172bc818_217_0.png)\n\n图 8.3 Times\
  \ New Roman 的默认浏览器\n\n我们将不再使用 Times New Roman，而是从 Google Fonts 导入 Raleway。然后我们将创建一个针对\
  \ body 标签的规则，以应用该字体。为此我们将使用 font-family 属性，将其值指定为 \"Raleway\"。我们还应用了 sans-serif\
  \ 作为后备。如果 Raleway 无法加载，我们确保将使用一个可比的替代方案（Raleway 是一种无衬线字体）。通过将样式应用于 body 标签，我们充分利用了级联，字体将被应用于任何地方。\n\
  \n应用了 font-family 后，我们现在将设置文本的默认颜色。也在 body 上，使用 color 属性为文本分配颜色。我们将使用值 #171717，它看起来几乎是黑色。我们在这个设计中不使用黑色，因为它是一个非常柔和的设计，而纯黑色可能相当刺眼。\n\
  \n接下来，我们将处理我们的数字。字体系列默认具有旧式或现代数字。两者之间的区别在于数字相对于中线和基线的对齐方式，如图 8.4 所示。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_217_1.png)\n\
  \n图 8.4 旧式与现代数字\n\n旧式数字的部分数字会超出基线之上和之下，而现代数字则不会。因为我们正在创建一个购物车，我们希望堆叠数字以显示它们相加形成总和，我们希望使用现代样式数字，以便它们更整齐地对齐。然而，Raleway（我们为页面选择的\
  \ font-family）默认使用旧式数字。为了使我们的字形使用现代数字，我们可以\n\n\n\n使用 `font-variant-numeric` (https://developer.mozilla.org/en-US/docs/Web/CSS/font-variant-numeric)\
  \ 属性，该属性让我们可以设置数字的显示方式。\n\n这个鲜为人知的属性在处理数字时非常方便，因为它允许我们控制它们显示方式的多个方面，包括：\n\n- 零是否带斜线显示\n\
  - 数字如何对齐\n- 分数如何显示\n\n我们将使用 `font-variant-numeric: lining-nums`，这会将我们的数字从旧式数字更改为现代数字。图\
  \ 8.5 显示了在将 `font-variant-numeric` 属性应用到 body 规则之前和之后的摘要部分。在之前版本中，我们可以看到数字的大小不同，而在之后版本中它们已对齐且大小一致。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_218_0.png)\n\n图 8.5 应用 font-variant-numeric\
  \ 属性前后的对比\n\n最后我们将把标题的颜色更改为青绿色。\n\n我们现在已为页面设置了基础排版。我们直接将其应用于 body 标签，以便页面内的其他子元素将继承这些值。列表\
  \ 8.2 显示了到目前为止我们构建的规则。\n\n## 列表 8.2 应用于 body 元素的排版相关样式\n\n```\nbody {\n  font-family:\
  \ 'Raleway', sans-serif;\n  color: #171717;\n  font-variant-numeric: lining-nums;\n\
  }\n\nh1, h2 {\n  color: #2c6c69;\n}\n```\n\n让我们把注意力转向链接和按钮。\n\n## 8.2.2 链接和按钮\n\n\
  此页面上有多个链接和按钮，但从样式上看，它们都像按钮。它们可以根据其用途大致分类。\n\n- 主要行动号召：继续结账链接\n- 次要行动号召：继续购物\n- 破坏性：带有\
  \ X 的按钮，用于从购物车中移除商品\n\n我们将使用这种分类来命名我们的类，以便我们的规则易于重用。在本章中，我们只处理一个页面，但这是一个异常情况。在完整的应用程序中，我们有多个页面或组件会重用相同的样式，因此我们不会将类命名为类似\
  \ \"proceed-to-checkout\"，而是使用 \"primary\"，这样该类就可以在不同的上下文中轻松重用。\n\n在解决它们之间的差异之前，让我们先考虑它们的相似之处，并为所有看起来像按钮的链接（已赋予\
  \ button 类）和按钮编写一个基线。一旦我们编写了基线，我们将为上述每种按钮类型制定规则。\n\n要创建我们的基线，我们首先要做的是使用 background:\
  \ none 移除浏览器设置的默认灰色背景。接下来添加内边距。\n\n我们对内边距的设置有 2 个选项。\n\n1. 我们可以使用 padding-top、padding-right、padding-bottom\
  \ 和 padding-right 分别设置每个边。\n2. 我们可以使用简写 padding 属性，它允许我们传递 1 到 4 个值。\n\n图 8.6 显示了使用简写属性时值是如何应用的分解。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_219_0.png)\n\n图 8.6 内边距属性简写\n\n我们将使用简写属性。我们将向\
  \ padding 属性传递 2 个值（1ex 和 1ch），第一个将处理上下内边距，而第二个将处理左右。\n\n接下来我们将添加一些默认边框。与内边距类似，边框属性相关的样式可以单独设置，也可以使用简写\
  \ border 属性，该属性接受样式、宽度和颜色。我们将其设置为 solid 1px #ddd，这将在我们的元素周围产生 1 像素宽的实心灰线。我们还将使用\
  \ border-radius 属性使角部圆润。\n\n最后，因为我们将此规则应用于链接，而链接默认是下划线的，所以我们将通过将 text-decoration\
  \ 属性设置为 none 来移除链接的下划线。\n\n我们为按钮以及具有 button 类的链接制定的基本规则如列表 8.3 所示。\n\n## 列表 8.3\
  \ 按钮的基础样式\n\n```\nbutton, .button { #A\n  background: none;\n  border-radius: 4px;\n\
  \  padding: 1ex 1ch;\n  border: solid 1px #ddd;\n  text-decoration: none;\n}\n```\n\
  \n#A 此规则将应用于所有 button 元素以及所有具有 button 类的元素\n\n在处理完按钮的默认状态后，我们现在将添加用户用鼠标悬停在按钮上或通过键盘聚焦时样式的变化。为了实现这一目标，我们将使用\
  \ :hover 和 :focus 伪类。\n\n> 注意 伪类 :hover 和 :focus 对可访问性的影响 伪类添加到选择器中以定位特定状态。在悬停和聚焦时添加样式变化对于可访问性很重要，因为它提供了视觉反馈。它让用户知道该项目可以交互。当使用键盘导航时，聚焦时的样式变化让用户知道他们即将交互的元素。没有这些视觉提示，很难知道什么可以点击以及当前焦点在哪里。\n\
  \n在悬停时，我们将在按钮周围添加一个点状青绿色轮廓，并为了留出一些呼吸空间，我们将轮廓偏移 2 像素。我们将使用 2 个属性，outline 和 outline-offset。Outline\
  \ 与 border 非常相似，接受相同的三个属性：样式、宽度和颜色。Outline-offset 接受一个长度值（可以为负），它决定我们希望轮廓与元素边缘之间的空间量。\n\
  \n聚焦将具有与悬停相同的样式，但轮廓不是点状线，而是实线。列表 8.4 显示了悬停和聚焦状态的最终 CSS。\n\n## 列表 8.4 按钮悬停和聚焦状态\n\
  \n```\nbutton:hover,\n.button:hover {\n```\n\n```\noutline: dotted 1px #2c6c69;\n\
  outline-offset: 2px;\n}\n\nbutton:focus,\n.button:focus {\n  outline: solid 1px\
  \ #2c6c69;\n  outline-offset: 2px;\n}\n```\n\n图 8.7 显示了包括悬停和聚焦状态在内的样式化链接和按钮。\n\n\
  ![](img/b56145aa9b751926a7aedbd7172bc818_221_0.png)\n\n图 8.7 按钮基础样式包括悬停和聚焦\n\n现在我们有了基线，我们可以开始关注每个单独用例。我们将从我们的行动号召开始（“继续结账”和“继续购物”链接）。由于我们已经设置了基线，我们只需要为每种用例编辑颜色，如列表\
  \ 8.5 所示。我们根据我们更喜欢或期望用户选择的方式在两种操作之间进行区分，以突出主要选择。在整个应用程序中一致地为操作类型设置样式有助于我们引导用户完成他们必须做出的选择。\n\
  \n## 列表 8.5 行动号召样式\n\n```\nbutton.primary,      #A\n.button.primary {    #A\n  border-color:\
  \ #2c6c69;  #A\n  background: #2c6c69;    #A\n  color: white;          #A\n```\n\
  \n```\n}\n#A\nbutton.secondary,\n#B\n.button.secondary {\n#B\n  border-color: #2c6c69;\n\
  #B\n  color: #2c6c69;\n#B\n}\n```\n\n#A 应用于“继续结账”链接\n#B 应用于“继续购物”链接\n\n剩下的待样式化的是购物车中每个商品的表格中用于移除商品的按钮，该按钮已被赋予\
  \ destructive 类。\n\n与之前两种类型一样，我们需要更改颜色，这次改为红色而不是青绿色，以强调这是一个破坏性操作。我们还需要进行一些调整，使按钮呈圆形并居中图像。为了使按钮看起来像一个圆圈，我们将\
  \ border radius 增加到 25%，但正如我们在图 8.8 中看到的那样，这只让我们完成了一半。我们的按钮现在是椭圆形（垂直拉长）。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_222_0.png)\n\
  \n图 8.8 椭圆形移除商品按钮\n\n为了确保我们的按钮是圆形的，我们将为其提供相等的高度和宽度。用于移除图标的图像为 24 像素乘 24 像素。我们将使按钮尺寸与图像尺寸相匹配。因此我们需要添加图像的尺寸加上边框：宽度\
  \ = 24 + 2 = 26。我们加 2 是因为我们的边框为 1 像素宽，左右各有一条边框。我们对高度做同样的操作。\n\n由于我们希望按钮与图像大小相同，我们还需要去掉按钮内部的内边距。\n\
  \n我们没有编辑操作按钮的悬停和聚焦样式，因为在基线样式中用于轮廓的颜色（青绿色 - #2c6c69）与我们为这些链接使用的颜色相匹配。这对这个按钮不成立。我们的按钮轮廓和图像是红色的；因此我们将在悬停和聚焦时使轮廓变为红色。\n\
  \n列表 8.6 显示了移除按钮的 CSS，图 8.9 显示了每个状态的输出。\n\n## 列表 8.6 移除按钮\n\n```\nbutton.destructive\
  \ {\n  border-color: #9d1616;\n  color: #9d1616;\n  border-radius: 50%;\n  height:\
  \ 26px;\n  width: 26px;\n  padding: 0;\n}\n```\n\n\n\n\n\n```\n}\nbutton.destructive:hover,\n\
  button.destructive:focus {\n  outline-color: #9d1616;\n}\n```\n\n![](img/b56145aa9b751926a7aedbd7172bc818_223_0.png)\n\
  \nFigure 8.9 Remove button styles\n\n## 8.2.3 Input fields\n\n你可能已经注意到表格中输入字段下方有一句话“Must\
  \ be a whole number between 0 and 99.” 这与字段验证有关。在 HTML 中我们已为该字段设置了可接受的最小值和最大值：<input\
  \ name=\"grapes\" type=\"number\" min=\"0\" max=\"99\" ...>。如果在字段中输入的数字超出范围，该字段即为无效。我们可以使用伪类根据其有效性有条件地为字段设置样式。因此我们将根据字段是否有效以不同方式对其进行样式设置。\n\
  \n我们假设默认情况下字段是有效的，然后再覆盖无效字段的样式。所以首先让我们为字段设置一些基本样式。这些样式与我们的基础按钮样式相同。为了避免复制粘贴，我们可以将\
  \ input 添加到现有选择器的列表中，如 Listing 8.8 所示。这样可以确保我们希望在整个主题中保持不变的一些基础部分在各处保持一致，并减少如果样式发生变化时需要更新代码的位置。\n\
  \n### Listing 8.7 Adding input to base button styles\n\n```\nbutton,\n.button,\n\
  input {\n  background: none;\n  border-radius: 4px;\n  ...\n}\n```\n\n现在让我们处理无效字段。当用户输入无效条目时，我们希望通知他们。我们的\
  \ HTML 已设置了什么构成有效值的规则。我们指定了最小值为 0，最大值为 99。由于我们未指定步长，浏览器将默认值设为 1。这意味着我们输入的有效数字仅为\
  \ 0 到 99 之间的整数，包含两端。所有其他条目在 DOM 树中都会被注册为无效。在 CSS 中，我们可以通过 :invalid 伪类专门选择无效的表单元素。\n\
  \n为了清楚地标记输入为无效，我们将把边框颜色从灰色更改为红色 (#9d1616)。我们还将增加左侧边框的宽度，以提供非颜色的视觉区分。\n\n> **NOTE\
  \ Use of Color** 尽管颜色在传达诸如状态等信息方面非常有帮助，但它不能是唯一的区分因素，因为色盲或视力受损的用户可能无法区分页面上的颜色。此外，如果使用的设备具有单色或有限颜色显示，颜色差异可能不可见²。\n\
  \n### Listing 8.8 Adding input to base button styles\n\n```\ninput:invalid {\n \
  \ border-left: solid 5px #9d1616;\n  border-color: #9d1616;\n}\n```\n\n接下来我们将为错误信息设置样式。我们将文本颜色设为与边框相同的红色，使文本加粗，但比页面上其他元素略小一些。为了确保它能被清楚地识别为错误，我们还将在文本前添加一个错误图标。\n\
  \n要添加错误图标，我们将使用伪元素 :before。\n\n> **REMEMBER** 伪类添加到选择器中以定位特定状态，而伪元素允许我们选择元素的一部分。\n\
  \n要添加图像，我们将使用 content 属性并配合 url() 函数，向其传递文件的 URL。我们随后将图像浮动到左侧，使错误文本能够环绕它。我们将图像宽度设为\
  \ 1 rem，使其与文本成比例，并为其添加一些边距，以在图标和文本之间留出呼吸空间。\n\n最后需要的一点是默认隐藏错误信息，仅在紧邻的输入无效时才显示它。我们使用\
  \ HTML 中的相邻关系将输入字段与错误信息配对。Listing 8.9 显示了我们的输入和错误 HTML。\n\n### Listing 8.9 Input\
  \ and Error HTML\n\n```\n<td data-name=\"Quantity\">\n<input name=\"grapes\" type=\"\
  number\" aria-label=\"Pounds of grape baskets\" min=\"0\" max=\"99\" id=\"grapes\"\
  \ value=\"-1\" aria-errormessage=\"grapeError\">\n<p class=\"error\" id=\"grapeError\"\
  \ role=\"alert\" aria-live=\"polite\">Must be a whole number between 0 and 99</p>\n\
  </td>\n```\n\n为了默认隐藏它，我们将为错误 div 设置 display 为 none。然后我们将使用相邻兄弟组合符 (+) 找到紧跟在无效输入之后的错误信息，并将其\
  \ display 改为 block。Listing 8.10 显示了错误信息的完整 CSS。\n\n### Listing 8.10 Adding input\
  \ to base button styles\n\n```\n.error {\n  color: #9d1616;\n  font-size: .875em;\n\
  \  font-weight: bold;\n  display: none; #A\n}\n\n.error:before {\n  content: url('./img/icons/error.svg');\
  \ #B\n  width: 1em;\n  float: left; #C\n  margin-right: .25rem; #D\n}\n\ninput:invalid\
  \ + .error { #E\n  display: block;\n}\n```\n\n- #A 默认隐藏错误信息\n- #B 添加错误图标\n- #C 使图标浮动，以便文本环绕它\n\
  - #D 在图标和文本之间增加呼吸空间\n- #E 使用相邻兄弟组合符 (+) 显示紧跟在无效输入之后的错误信息\n\nFigure 8.10 Shows the\
  \ styled input fields both valid and invalid with error message only showing for\
  \ the invalid field.\n\n## Figure 8.10 Formatted fields and error messages\n\n##\
  \ 8.2.4 Table\n\n接下来我们将为表格设置样式。我们只关注与主题相关的元素，例如颜色和边框。布局和响应式将在本章后面进行。\n\n我们的表格分为三个部分：\n\
  - 1. 表头 – `thead`\n- 2. 表体 – `tbody`\n- 3. 表尾 – `tfoot`\n\n我们将按顺序处理每个部分。\n\n我们将首先为表格标题设置样式。因为它们的重要性不如表格本身的内容，我们给它们一个略小的字体大小和比其他文本更浅的颜色。我们还将把默认的粗体字重降低为正常。通过稍微弱化它们，我们有助于在表格中创建视觉层次，并强调用户最关心的部分（购物车中的商品）。\n\
  \n在表体中，我们将通过使文本加粗来强调商品名称（位于第二列）。为了将粗体属性添加到商品，我们将使用伪类 `:nth-of-type`，以专门定位表体中每一行的第二个单元格：`tbody\
  \ td:nth-of-type(2)`。\n\n> **PSEUDO CLASS** 请记住，伪类根据元素的状态匹配元素。在这种情况下，它们在父容器（行）内部与其他兄弟（其他表格单元格）之间的位置。\n\
  \n我们还将使用 `:nth-of-type`，这次传入 `even` 值，来选择表体中的偶数行，以创建条纹。我们随后将为所有行添加顶部边框，无论它们在表格中的位置如何。\n\
  \n最后我们将使页脚中的总计加粗。我们的 CSS 将如下所示（Listing 8.11）：\n\n### Listing 8.11 Adding input to\
  \ base button styles\n\n```\nth { #A\n  color: #3a3a3a;\n  font-weight: normal;\n\
  \  font-size: .875em;\n}\n\ntbody td:nth-of-type(2), #B\ntfoot td { #C\n  font-weight:\
  \ bold;\n}\n\ntr {\n  border-top: solid 1px #aeb7b7;\n}\n\ntbody tr:nth-of-type(even)\
  \ { #D\n  background: #f2fcfc;      #D\n}                           #D\n```\n\n\
  #A 在表头和表尾中设置标题单元格样式\n#B 定位第二列中的单元格\n#C 选择表尾中非标题单元格\n#D 为行添加条纹\n\nFigure 8.11 shows\
  \ the applied styles with significantly darker background color on the stripped\
  \ row. We darkened the color for the screenshot to emphasize the vertical lines\
  \ breaking up the stripe. Previously invisible on the white background, these are\
  \ the borders of the cells, furthermore, the top border we set on our rows are not\
  \ showing up.\n\n| Image | Item | Unit Price | Quantity | Total | Actions |\n| ---\
  \ | --- | --- | --- | --- | --- |\n|  | Red Grapes, 1lb | $ 3.23 | -1 | $ -3.23\
  \ | ✕ |\n|  | Must be a whole number between 0 and 99 |  |  |  |  |\n|  | Pineapple\
  \ | $ 2.29 | 2 | $ 4.58 | ✕ |\n|  | Strawberries, 1lb | $ 4.62 | 3 | $ 13.86 | ✕\
  \ |\n|  |  |  | Total: | $ 15.21 |  |\n\nFigure 8.11 formatted table with darkened\
  \ stripe for emphasis\n\n为了消除间隙并使行上设置的边框显示出来，我们需要将 border-collapse 属性应用于我们的表格，并将值设为\
  \ collapse。该属性允许我们控制每个单元格是否拥有自己的边框，或是否共享边框。为了消除间隙，我们希望它们共享边框。\n\n### Listing 8.12\
  \ Table borders and width\n\n```\ntable {\n  width: 100%;\n  border-collapse: collapse;\n\
  }\n```\n\nFigure 8.12 shows our updated output. We can see that the white vertical\
  \ lines have disappeared.\n\n\n\n\n\n# 图 8.12：添加折叠边框\n\n## 8.2.5 定义列表\n\n摘要部分中仍需主题化的定义列表（<dl>）。通常用于术语表，或显示元数据，它非常适合我们的摘要，其中包含项目及其值。我们将以与表格标题相同的方式设置定义术语（<dt>）的样式。我们希望使其与定义描述（<dd>）脱离强调，后者包含每个元素的美元值。因为我们希望其样式与表格标题相同，所以我们将把\
  \ dt 添加为选择器到已存在的规则中，类似于我们在本章前面将 input 添加到按钮规则时的做法。\n\n然后我们将使用伪元素 :after 并使用 content\
  \ 属性插入字符，在每个定义术语后添加冒号。CSS 和输出分别显示在列表 8.13 和图 8.13 中。\n\n### 列表 8.13 设置定义列表样式\n\n\
  ```\nth, dt {  #A\n  color: #3a3a3a;\n  ...\n}\n\ndt:after {      #B\n  content:\
  \ \": \"; #B\n}               #B\n```\n\n#A 将定义术语添加到我们现有的标题样式中\n#B 在每个定义术语后添加冒号\n\
  \n## 摘要\n\nNumber of Items:\n4\nOrder Total:\n$ 15.21\nShipping:\n$ 5.00\nTotal:\n\
  $ 20.21\n\nProceed to Checkout\n\nContinue Shopping\n\n图 8.13 定义列表主题\n\n## 8.2.6\
  \ 卡片\n\n为了给布局一些深度并在各部分之间进行分隔，我们将把各部分的容器样式化为卡片。卡片是 UI 设计中常用的模式，通过将其封装在类似扑克牌的视觉框或容器中来在视觉上分隔内容。这与我们在第\
  \ 6 章中为个人资料信息创建的卡片概念相同。\n\n为了实现我们的卡片设计，我们将为 body 添加非常浅的青绿色背景，并使用阴影勾勒出各部分，使其看起来像悬浮在\
  \ body 上方一样。为了创建阴影，我们将使用 box-shadow 属性，它允许我们控制在 x 轴和 y 轴上添加的阴影量，以及模糊程度、应扩散的距离和阴影的颜色。图\
  \ 8.14 详细说明了属性值的应用方式。\n\n```\nbox-shadow: 2px 2px 7px 0 #aeb7b7;\n```\n\n![](img/b56145aa9b751926a7aedbd7172bc818_230_0.png)\n\
  \n图 8.14 box-shadow 属性值\n\n可选地，我们也可以在偏移量之前设置 inset 的值，以指示阴影应在元素内部而不是外部显示。\n\n为了完成卡片的外观，我们还将使用\
  \ 4px 的边框半径使角部圆润。使用的值与我们的链接、按钮和输入框相同。\n\n图 8.15 显示了我们样式化的各部分，但请注意，在摘要卡片底部，链接溢出而不是推动卡片变高并被包含在其中。这是因为链接默认的\
  \ display 值为 inline。\n\n## Checkout\n\n## My Cart\n\n| Image | Item | Unit Price\
  \ | Quantity | Total | Actions |\n|---|---|---|---|---|---|\n|  | Red Grapes, 1lb\
  \ | $ 3.23 | -1 | $ -3.23 | ✕ |\n|  | Pineapple | $ 2.29 | 2 | $ 4.58 | ✕ |\n| \
  \ | Strawberries, 1lb | $ 4.62 | 3 | $ 13.86 | ✕ |\n|  |  |  | Total: | $ 15.21\
  \ |  |\n\nMust be a whole number between 0 and 99\n\n## Summary\n\nNumber of Items:\n\
  4\nOrder Total:\n$ 15.21\nShipping:\n$ 5.00\nTotal:\n$ 20.21\n\nProceed to Checkout\n\
  Continue Shopping\n\n图 8.15 主题化各部分\n\n当为内联元素添加垂直内边距时，元素在页面流中的高度实际上并不会增加，它只会占据其内容（文本）的空间，这就是为什么它不会增加卡片高度的原因。为了解决这个问题，我们将把它们的\
  \ display 值从 inline 改为 inline-block。列表 8.14 显示了设置卡片样式并修复链接所需的代码。\n\n```\nListing\
  \ 8.14 Section styles\nsection {\n  background: white;\n  border-radius: 4px;\n\
  \  box-shadow: 2px 2px 7px #aeb7b7;\n}\n\nbutton,\n.button,\ninput {\n  ...\n  border:\
  \ solid 1px #ddd;\n  text-decoration: none;\n  display: inline-block;\n}\n```\n\n\
  ## 8.3 移动布局\n\n我们将从移动优先开始，然后向外扩展。我们要做的第一件事是使表格响应式。\n\n### 8.3.1 表格移动视图\n\n传统的表格布局在移动设备上效果不佳，因为表格需要大量宽度，而手机屏幕没有。为适应窄屏，我们因此将表格行和单元格的行为更像卡片而不是表格。\n\
  \n我们将首先使用媒体查询来专门在视口小于或等于 549px 时应用一组规则。媒体查询以 @ 开头，然后我们指定必须满足的条件才能使其中的代码生效。在我们的例子中，媒体查询将是\
  \ `@media (max-width: 549px) { }`。\n\n在此媒体查询内部，我们将定义窄屏上表格的外观。作为快速回顾，图 8.16 显示了我们当前表格的外观以及我们想要实现的目标。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_234_0.png)\n\n图 8.16 移动设备上表格的修改前后\n\n\
  要在大多数浏览器开发工具中查看窄屏或移动版本，我们可以设置工具以模拟特定设备的屏幕。并非所有工具都会在周围显示手机图像，但它会将浏览器窗口的大小限制为适合设备的尺寸。在\
  \ chrome 中，要选择特定设备，我们通过点击开发工具顶部带有手机图标的图标来切换设备工具栏，然后选择我们想要使用的设备，如图 8.17 所示。值得注意的是，这是一种非常有限的模拟，不能替代在实际设备上的测试。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_234_1.png)\n\n图 8.17 使用 Chrome 开发工具进行设备模拟\n\
  \n我们要做的第一件事是垂直堆叠所有内容，而不是让每行的元素水平表示。因此我们将单元格的 display 值设为 block。然后我们将图像浮动到左侧，以便行的其余内容环绕它，包括一些边距以在图像和行的其余内容之间创建空白。\n\
  \n我们越来越接近最终目标，但我们的标题信息不在需要的位置。正如我们在图 8.18 中看到的，标题信息位于表格顶部，而不是在表格主体行的每个信息之前。\n\n\
  ![](img/b56145aa9b751926a7aedbd7172bc818_235_0.png)\n\n图 8.18 表格标题位于移动表格顶部\n\n为了在每个内容之前放置标题信息，我们不会使用标题。相反，在我们的\
  \ HTML 中，我们已向单元格添加了一些 data 属性：<td data-name=\"Item\">Red Grapes, 1lb</td>。我们使用绝对定位将表格标题移出屏幕。我们不想使用\
  \ display none，因为标题中的信息仍需要辅助技术。通过使用非常大的负值将其绝对定位到屏幕外，我们在视觉上隐藏它但在程序上不隐藏它。\n\n接下来我们使用\
  \ data-name 属性信息，并在每个单元格中显示它。为了显示属性值，我们使用 attr() 函数，它接受属性名称并返回一个值。对于我们的用例，content\
  \ 属性将如下所示：td[data-name]:before { content: attr(data-name) \":\"; }。图 8.19 详细分解了它。\n\
  \n{ content: attr(data-name) \":\"; }. Figure 8.19 breaks it down in detail.\n\n\
  ```\ntd[data-name]:before { content: attr(data-name) \":\"; }\n```\n\n选择具有 data\
  \ 属性的单元格。规则不适用于没有该属性的单元格。\n\n内容值将在单元格之前放置\n\n定义要显示的内容\n\n返回 data-name 属性的值\n\n在内容后添加冒号\n\
  \n图 8.19 在单元格之前添加标题信息\n\n为了对齐我们的标签和内容，使用 text-align 和 float 的组合。我们在单元格中使用 text-align:\
  \ right 将所有内容右对齐，然后将标签浮动回左侧以在两者之间创建间隙。我们还将为单元格提供一些内边距以在它们之间添加空白。图 8.20 显示我们已成功对齐内容，然而行未使用表格的全部宽度，表格页脚可以更有效地利用空间，并且我们不希望总计换行。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_236_0.png)\n\n图 8.20 表格内容显示但仍需解决与宽度相关的问题\n\
  \n为了解决宽度问题，我们将为行提供 display 值 block。默认情况下，行的 display 值为 table-row。我们还可以为行提供一些内边距，以便\n\
  \n\n\ncontent is not placed right up against the edges of the card, or against the\
  \ borders between rows.\n\nNext let's address the table footer. To place the label\
  \ and values at opposite ends of the available space, we are going to use flexbox.\
  \ Flexbox allows us to create layouts on 1 axis, either horizontally or vertically.\
  \ We then use a combination of the `justify-content` and `align-items` properties\
  \ to define how elements are placed on the axis. `justify-content` determines how\
  \ elements are distributed on the axis, while `align-items` determine how they are\
  \ aligned in relationship to one another. Look at Chapter 6 for a detailed explanation\
  \ of how flexbox works.\n\nFinally we add the labels to our theme and style them\
  \ the same way we did the table headers and definition terms. Listing 8.15 shows\
  \ the completed CSS for making the cart section work well on mobile.\n\n## Listing\
  \ 8.15 Section styles\n\n```\nth, dt, td[data-name]:before { #A\n  color: #3a3a3a;\n\
  \  font-weight: normal;\n  font-size: .875em;\n}\n\n@media(max-width: 549px) { #B\n\
  \  thead {               #B   #C\n    position: absolute; #B   #C\n    left: -9999rem;\
  \     #B   #C\n  }                     #B   #C\n  td {                  #B\n   \
  \ display: block;     #B\n    text-align: right;  #B\n    padding: .25rem 0;  #B\n\
  \  }                     #B\n  table img {           #B\n    float: left;      \
  \  #B\n    margin-right: 1rem; #B\n  }                     #B\n  td[data-name]:before\
  \ {       #B #D\n    content: attr(data-name) \":\"; #B #D\n    float: left;   \
  \       #B #D\n  }                     #B #D\n  tr {                  #B\n    display:\
  \ block;     #B\n    padding: 1rem;      #B\n  }                     #B\n  tfoot\
  \ tr {            #B\n    display: flex;      #B\n    justify-content: space-between;\
  \  #B\n    align-items: baseline; #B\n  }                     #B\n}            \
  \           #B\n```\n\n#A Style the cell labels the same as our other labels\n#B\
  \ Only applied if screen width is less than or equal to 549px\n#C Move table head\
  \ offscreen\n#D Add HTML data-name attribute information as content before the cell\n\
  \nFigure 8.21 Shows our formatted table.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_238_0.png)\n\
  \nFigure 8.21 Formatted table on mobile\n\n## 8.3.2 Definition List\n\nUnlike the\
  \ table which has a completely different look on mobile versus on desktop, the definition\
  \ list will look the same regardless of the width. Its position will change on wider\
  \ screens but the definition list itself will not. Since it is the same regardless\
  \ of screen size we will not put the styles we create to address the layout inside\
  \ of a media query.\n\nTo display the definition list we are going to use grid.\
  \ We will define 2 columns and let items auto-position themselves within the 2 columns.\
  \ When not given specific placement instructions, child elements of a grid container\
  \ will place themselves in the first available space, which is exactly what we are\
  \ going to exploit. We will also define a gap and some padding to the container\
  \ to space the elements within the grid and card. Lastly we will justify our numbers\
  \ to the left. Listing 8.16 shows the CSS while Figure 8.22 shows the before and\
  \ after.\n\n## Listing 8.16 Section styles\n\n```\ndl {\n  display: grid;\n  gap:\
  \ .5rem;\n  grid-template-columns: auto max-content; #A\npadding: 0 1rem;\n}\ndd\
  \ { text-align: right; }\n```\n\n#A We use max-content for our second column because\
  \ we really don’t want the numbers to wrap which would make them quite difficult\
  \ to read.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_239_0.png)\n\nFigure 8.22\
  \ Layout for definition list before and after\n\n## 8.3.3 Call to Action Links\n\
  \nOur definition list looks a lot better but the action links still need some help.\
  \ The first thing we are going to do is give their container some padding. We will\
  \ then use the text-align property to center them. For instances where there is\
  \ not enough room for them to be side by side and they end up stacked, we will give\
  \ them some margin on the bottom to prevent them from being right up against one\
  \ another. Listing 8.17 displays the code while Figure 8.23 shows the before and\
  \ after.\n\n## Listing 8.17 Action links\n\n```\n.actions {\n  padding: 1rem;\n\
  \  text-align: center;\n}\n.actions a {\n  margin-bottom: .5rem;\n}\n```\n\n![](img/b56145aa9b751926a7aedbd7172bc818_240_0.png)\n\
  \nFigure 8.23 Action links layout before and after\n\n## 8.3.4 Padding, Margin,\
  \ and Margin Collapse\n\nAll of the content within our sections is laid out for\
  \ mobile except our headers. The browser gives them margin by default but it is\
  \ not accomplishing what we want it to. Instead of creating vertical space between\
  \ the edge of the card and the header, it is pushing the card down. Margin pushes\
  \ content but does not affect how much room an element or its content occupy which\
  \ is why the top margin or the header is \"bleeding\" out of the card.\n\nIf we\
  \ remove the header's margin and give it padding instead the card will expand but\
  \ the gap between the two cards will disappear. We therefore need to give the section\
  \ itself some margin in order to add space between the two cards. If we give the\
  \ sections a margin with a value of 1rem 0 (1 rem top and bottom, but no left -\
  \ right) we will see that we still only have a 1 rem gap between the 2 cards. This\
  \ is a direct result of margin collapse. Unless the positioning of the element has\
  \ been altered, via float, flex..., 2 margins up against each other will collapse\
  \ to equal the greater of the 2 margins. Figure 8.24 diagrams what is happening.\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_241_0.png)\n\nFigure 8.24 Effects of\
  \ margin and margin collapse\n\nTo add space between the edges of the card and the\
  \ header, we replace the card header’s margin with padding. Then we will add margin\
  \ to the card in order to regain the lost vertical space between them. Lastly we\
  \ add padding to the body so that the cards are not stuck right up against the left\
  \ and right edges of the screen. Listing 8.18 shows how this is done.\n\n## Listing\
  \ 8.18 Section Margin and Header Padding\n\n```\nbody { padding: 1rem; }\nsection\
  \ { margin: 1rem 0; }\nsection h2 {\n  padding: 1rem;\n  margin: 0;\n}\n```\n\n\
  With the mobile layout now finished, let’s increase the width of the screen and\
  \ consider tablet and laptop sized screens.\n\n## 8.4 Medium screen size layout\n\
  \nMost of what we did for mobile will look great on medium sized screens. Since\
  \ we used a media query to restrict table layout changes to screens less than to\
  \ 459 pixels, the styles we wrote to edit the table will not apply to any screen\
  \ 500 pixels and up. Figure 8.25 shows the table when the viewport is 449 pixels\
  \ wide and when it is 550 pixels wide. At 550 pixels of width, we are back to a\
  \ standard table layout.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_242_0.png)\n\
  \nFigure 8.25 Breakover point for table\n\n## 8.4.1 Table layouts\n\nLet’s improve\
  \ the table layout a little bit. In the browser tables will automatically calculate\
  \ how wide to make a column based upon the amount of content found in the cells\
  \ within. We don’t want to allow this default behavior because we do not want the\
  \ column widths to change when an error message is toggled. Resizing the columns\
  \ based on the input field states would be disorienting to our users. Instead, we\
  \ are going to give the table a table-layout value of fixed. The table-layout property\
  \ allows us to choose the algorithm the browser will use to decide the width of\
  \ the columns. The default value, auto, calculated column width based on content\
  \ while fixed determines column width based on the width of the table or by the\
  \ width of the first row of cells. The table will be evenly divided into a number\
  \ of columns. Each column will therefore have the same width.\n\nBecause we are\
  \ setting the size of the column based on the width of the table we want to make\
  \ sure that the images conform to the width of the column. We will therefore set\
  \ their width to auto and give them a max-width of 100%. This sets the image to\
  \ take the width of its container, without exceeding it or the size of the original\
  \ image.\n\nNext we are also going to update the alignments of the values in the\
  \ table. It is customary, because it makes computation easier at a glance, to justify\
  \ numbers to the right, especially if they are being totalled in a column. We will\
  \ update both the header and cells of the unit price, quantity and total to be right\
  \ justified. To select the headers and cells we could use the :nth-of-type(n) selector.\
  \ To select header and cells for the Unit Price column (3rd column), we would use\
  \ th:nth-of-type(3), td:nth-of-type(3) { ... } and then repeat the same process\
  \ for all the other columns. We could also, however, think about it a\n\n\n\n稍微不同。我们希望在前\
  \ 2 列之后的所有列都右对齐。在 `:nth-of-type()` 内部，我们可以传递数字，也可以传递模式。之前我们在通过传递参数 `even` 来设置行背景色时就使用了这个技巧。在这种情况下，我们将传递一个自定义模式。我们将传递参数\
  \ `n + 3`，表示我们想要选择所有匹配的元素，从第 3 个实例开始，其中 n 是迭代器，3 是起始点。列表 8.19 显示了该方法如何应用于表格。\n\n\
  ## Listing 8.19 Section Margin and Header Padding\n\n```\n@media (min-width: 550px)\
  \ { #A\n\n  table { table-layout: fixed; } #B\n\n  th, td {\n    padding: .5rem;\n\
  \    text-align: left;\n  }\n\n  table img {      #C\n    width: auto;      #C\n\
  \    max-width: 100%;  #C\n  }                 #C\n\n  th:nth-of-type(n+3),  #D\n\
  \  td:nth-of-type(n+3) { #D\n    text-align: right;\n  }\n}\n```\n\n#A 媒体查询。如果屏幕宽度大于或等于\
  \ 550px，则代码内内容才会应用\n\n#B 设置列宽基于表格宽度计算，而不是内容\n\n#C 使图像宽度与列宽匹配\n\n#D 选择从第 3 个开始的所有标题和单元格\n\
  \nFigure 8.26 显示了应用列大小和对齐后的表格。我们的文本已对齐，但我们仍需要对齐输入字段内部的数字。\n\n## My Cart\n\n![](img/b56145aa9b751926a7aedbd7172bc818_244_0.png)\n\
  \nFigure 8.26 Column sizing and text alignment\n\n我们可以选择仅在此表格视图中右对齐输入字段内的文本，或无论屏幕大小如何始终右对齐。由于我们在移动视图中也已将数字和总计右对齐，因此将数字类型的文本输入的文本也右对齐作为主题的一部分似乎是合乎逻辑的。为了专门选择类型为数字的输入，我们可以使用属性选择器：input[type=\"\
  number\"] { ... }。因此，与我们的其他主题样式一起，我们将添加 input[type=\"number\"] { text-align: right;\
  \ }\n\n在输入字段内的文本对齐后，我们需要为表格考虑的最后一部分是页脚，其中包含一个标题和一个单元格。因为我们之前只选择了行中前 2 个之后的单元格，所以页脚中的单元格未受影响，因为它总共只有\
  \ 2 个单元格。我们希望标题和数据单元格的内容都右对齐，我们可以通过专门针对 tfoot 本身中的 th 和 td 来选择，如列表 8.20 所示。\n\n\
  ## Listing 8.20 Aligning content in the table's footer\n\n```\n@media (min-width:\
  \ 550px) {\n...\ntfoot th,\ntfoot td {\n  text-align: right;\n}\n```\n\nFigure 8.27\
  \ 显示了中等屏幕的最终产品。\n\n## Checkout\n\n## My Cart\n\n![](img/b56145aa9b751926a7aedbd7172bc818_245_0.png)\n\
  \n## Summary\n\nFigure 8.27 Final layout for medium sized screens\n\n## 8.5 Wide\
  \ screens\n\n随着我们继续增加屏幕宽度，摘要部分变得更难阅读，因为定义标题和描述之间的距离越来越大。由于我们越宽，水平可用空间越多，我们将在视口达到\
  \ 995 像素宽或更大时将摘要部分带到购物车部分旁边。与之前一样，我们将创建一个媒体查询：@media (min-width: 995px) { }。\n\n\
  在我们的 HTML 中，我们在 2 个部分周围有一个容器 div，其类为 section-container。我们将为其赋予 flex 显示，使 2 个项目并排放置并在\
  \ x 轴上对齐。我们将然后在 2 个部分之间添加 1 rem 的间距。\n\nNOTE Flexbox Flexbox 允许我们在单个轴上放置和对齐元素。如果您需要复习\
  \ flexbox 的工作原理，请查看第 6 章。\n\nFlexbox 将根据其内容自动计算为每个部分分配的空间量，除非我们使用 grow 和 shrink\
  \ 来另行指示。与使用基于比率的 grow 和 shrink 不同，我们将为摘要部分设置最小宽度，防止文本换行（除非用户正在缩放文本），并将剩余的可用空间留给表格。\n\
  \n如果我们将屏幕变得更宽，例如使用超宽曲面显示，我们最终会达到内容再次变得不可读的程度。为了防止这种情况发生，我们将添加一个最终条件来限制布局的宽度。通过对\
  \ body 应用最大宽度，我们确保无论用户拥有什么样的显示器，以及选择将窗口扩展到多宽，内容仍然可用。我们可以通过为其赋予左右边距 auto 来使 body居中。\n\
  \n列表 8.21 显示了我们的媒体查询及其内容，以及对 body 布局规则的编辑以限制 body 的宽度。\n\n## Listing 8.21 Wide screen\
  \ media query and maximum width\n\n```\nbody {\n  padding: 1rem;\n  max-width: 1280px;\
  \  #A\n  margin: 0 auto;    #A\n}\n\n@media (min-width: 995px) {\n  .section-container\
  \ {  #B\n    display: flex;      #B\n    gap: 1rem;          #B\n  }\n\n  .summary\
  \ {\n    min-width: 250px;\n  }\n}\n```\n\n#A 防止内容变得比 1280 像素更宽并使 body居中。\n\n##\
  \ #B 将卡片和摘要并排放置\n\nFigure 8.28 显示了视口宽度为 1800 像素时的布局。请注意，现在我们已将容器设为 flex，我们在 h1（Checkout）和各部分之间有额外的空间。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_247_0.png)\n\nFigure 8.28 Layout on a\
  \ really wide screen\n\n由于容器现在具有 display flex，各个部分的边距和 h1 的边距（作为浏览器默认样式的一部分存在）不再折叠。我们有\
  \ 3 种方法可以修复此问题：\n\n- 1. 将 section 边距更改为仅具有底部边距\n- 2. 一旦我们设为 flex，就移除各个部分的边距\n- 3.\
  \ 移除浏览器默认样式中 h1 存在的 margin-bottom\n\n我们将选择选项 2 并移除各个部分的上边距和下边距，因为一旦我们设为 flex 且各部分并排放置，它们就不再必要。因此，在我们的媒体查询内部，我们需要添加\
  \ section { margin: 0; }。\n\n通过此最终更改，我们拥有一个从移动设备到超宽屏幕都看起来不错的结账购物车。Figure 8.29 显示了每个屏幕尺寸的最终输出。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_248_0.png)\n\nFigure 8.29 Final output\
  \ across screen sizes\n\n## 8.6 Summary\n\n- 数字样式可以通过 `font-variant-numeric` 属性控制\n\
  - `:invalid` 可用于定位并有条件地设置无效元素的样式\n- 媒体查询允许我们根据屏幕尺寸有条件地应用样式\n- HTML 属性值可用于选择元素\n\
  - HTML 属性可以通过 CSS 使用 content 属性和 `attr()` 函数显示\n- 边距可以折叠，但一旦元素的 display 属性更改为 `flex`\
  \ 就不会\n- `:nth-of-type` 可以接受数字、关键字或自定义模式，以根据元素在其容器内相对于同类型其他元素的相对位置来定位元素\n\n## 10\n\
  Styling forms\n\n## This chapter covers\n\n- Styling input fields\n- Styling radio\
  \ buttons and checkboxes\n- Styling drop down selects\n- Accessibility considerations\n\
  - :focus versus :focus-visible\n- :where and :is pseudo classes\n- accent-color\
  \ property\n\n表单无处不在于我们的应用程序中。无论是联系表单、登录屏幕，还是应用程序功能的核心，它们无处不在。然而，表单的设计很容易决定用户体验的成败。在本章中，我们将设置表单的样式并查看一些需要确保解决的可访问性考虑因素。我们将查看对某些单选和复选框输入以及下拉菜单进行样式设置时遇到的一些挑战，以及我们用于设置错误消息样式的一些选项。\n\
  \n在此上下文中，表单是一段代码，包含在 HTML <form> 元素内，包含用户与之交互以向我们的网站或应用程序提交数据的控件（表单字段）。\n\n由于联系表单在应用程序和网站中如此普遍，我们将以联系表单为项目的基础。我们的表单包含\
  \ 2 个输入字段、下拉菜单、单选按钮、复选框和一个文本区域。我们还在顶部有一个标题，并在表单末尾有 2 个按钮，Send 和 Reset。Figure 10.1\
  \ 显示了我们的起点，即未应用任何样式的原始 HTML 以及我们希望实现的目标。\n\n\n\n\n\n![](img/b56145aa9b751926a7aedbd7172bc818_250_0.png)\n\
  \n## Figure 10.1 Starting Point and Finished Product\n\nShown in listing 10.1, our\

  \ sans-serif;\n    line-height: 1;\n    text-transform: uppercase;\n    text-align:\
  \ center;\n}\n```\n\n#A updated import that includes both Oswald and PT Serif\n\n\
  #B Equivalent to using a value of bold\n\nOur updated title can be seen in Figure\
  \ 4.4.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_102_0.png)\n\nFigure 4.4 Styled\
  \ title\n\n## 4.1.2 Font-weight property\n\nThe font-weight property can either\
  \ take a number value between 100 and 900 or a keyword value (normal, bold, lighter,\
  \ or bolder). normal is equivalent to 400 and bold to 700. Lighter and bolder change\
  \ the element’s font weight based on the font-weight of the parent element.\n\n\
  ## Table 4.1 Font weight values and their common weight name\n\n| Value | Common\
  \ weight name |\n| --- | --- |\n| 100 | Thin (Hairline) |\n| 200 | Extra Light (Ultra\
  \ Light) |\n| 300 | Light |\n| 400 | Normal (Regular) |\n| 500 | Medium |\n| 600\
  \ | Semi Bold (Demi Bold) |\n| 700 | Bold |\n| 800 | Extra Bold (Ultra Bold) |\n\
  | 900 | Black (Heavy) |\n| 950 | Extra Black (Ultra Black) |\n\nIf we do not import\
  \ the weight that matches the one we set in the rule, the browser will apply the\
  \ closest weight it does have access to. Therefore, had we only imported Oswald\
  \ with a weight of 400 and applied a font-weight value of bold to our element, the\
  \ browser would have displayed our text with a weight of 400 because that is the\
  \ only value it has to work with.\n\n## 4.1.3 Font shorthand property\n\nUsing the\
  \ `font` shorthand property we can combine most of the styles in our rule. The font\
  \ property requires us to provide a font-family and size, and then optionally the\
  \ style, variant, weight, stretch, and line-height using the following syntax: `font:\
  \ font-style font-variant font-weight font-stretch font-size/line-height font-family`.\
  \ Listing 4.4 shows our updated rule using font.\n\n## Listing 4.4 Title styles\
  \ using the font shorthand property\n\n```\nh1 {\n  font: 700 4rem/1 'Oswald', sans-serif;\n\
  \  text-transform: uppercase;\n  text-align: center;\n}\n```\n\nLet’s apply the\
  \ concepts we just covered regarding importing fonts, font-weight, and the font\
  \ shorthand property to style the article title and subheadings.\n\n## 4.1.4 Creating\
  \ a visual hierarchy\n\nTo create visual hierarchy in the page we will set the article\
  \ heading <h2> to be smaller than our newspaper’s title <h1> but larger than the\
  \ subheadings within the article <h3>. Generally speaking, the larger an element,\
  \ the more important it will be perceived to be; we therefore use size to make our\
  \ headers stand out. By using a different font-family than we do on the main bodies\
  \ of text and making all of our letters uppercase we further their distinction.\n\
  \nCreating a visual hierarchy is important as it allows the user to glance at the\
  \ screen and immediately recognize elements of interest. It also helps segment information\
  \ into groups, making the information easier to process and understand. Listing\
  \ 4.5 shows our header rules.\n\nWe will keep the same font family and uppercase\
  \ lettering and adjust the sizing. We will also remove the browser provided bottom\
  \ margin of both article headers to keep them closer to the text they precede.\n\
  \n## Listing 4.5 Article header rules\n\n```\nh2 { #A\n  font: 3rem/.95 'Oswald',\
  \ sans-serif;\n  text-transform: uppercase;\n  margin-bottom: 16px;\n}\n\nh3 { #B\n\
  \  font: 2rem/.95 'Oswald', sans-serif;\n  text-transform: uppercase;\n  margin-bottom:\
  \ 12px;\n}\n```\n\n#A Article heading\n#B Article subheadings\n\nOur articles headers\
  \ now look as seen in Figure 4.5.\n\n## ARTICLE HEADING\n\nJohn Doe\n\nMaecenas\

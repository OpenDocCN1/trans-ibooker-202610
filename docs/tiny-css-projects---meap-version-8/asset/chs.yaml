  \ mollis, est non commodo luctus, nisi erat porttitor ligula, eget lacinia odio\
  \ sem nec elit.\n\nFigure 4.17 Progress thus far including styled figure and image\
  \ caption\n\nNext we will look at how to create a multi-column layout using the\
  \ multi-column layout module.\n\n## 4.4 Using the CSS multi-column layout module\n\
  \nThe CSS multi-column module is fairly new and compared to similar modules like\
  \ the grid and flexbox modules the multi-column layout module is perhaps a lesser-known\
  \ option as a way to present content but no less useful.\n\nThe purpose of this\
  \ module is to allow content to naturally flow between multiple columns. It works\
  \ very similarly to how we create multiple column layouts in a Word or Google doc.\
  \ We assign columns to a section of content and the content naturally flows from\
  \ one column to another.\n\n\n\n\n\n由于我们只希望在更宽的屏幕上将内容放置在列中，因此我们将使用媒体查询，仅在窗口达到特定大小后有条件地应用我们的列。\n\
  \n## 4.4.1 媒体查询\n\n媒体查询是一种 at-rule。与本章前面使用过的 @counter-style 类似，它将以 @ 符号开头，后跟标识符\
  \ media。然后我们设置在媒体查询内部找到的规则何时应适用。我们希望在窗口宽度大于或等于 955px 时将内容放置在列中。因此我们的媒体查询将为：@media\
  \ (min-width: 955px) {}。图 4.18 中找到的图表分解了查询的各个部分。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_117_0.png)\n\
  \n图 4.18 媒体查询分解\n\n在媒体查询内部，我们现在将定义我们的列。\n\n## 4.4.2 定义和设置列样式\n\n我们定义列创建方式有 2 种：\n\
  \n- 我们可以规定列宽，浏览器将在可用空间中创建尽可能多的该宽度的列。\n- 我们可以规定我们想要的列数，浏览器将在可用空间中适配该数量的等大列。\n\n我们将采用第二种选项，因为我们已经知道我们想要创建\
  \ 3 列。因此我们专门针对 article 并使用 column-count 属性将数量设置为 3，如清单 4.11 所示。\n\n```\nListing\
  \ 4.11 Conditionally break article into 3 columns based on screen width\n\n@media(min-width:\
  \ 955px) { #A\n  article {\n    column-count: 3;    #B\n  }\n}\n```\n\n#A 媒体查询\n\
  \n#B 设置我们想要的列数\n\n图 4.19 显示了使用上述 CSS 将我们的文章布局为三列。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_118_0.png)\n\
  \n图 4.19 3 列布局\n\n接下来我们将调整列之间的间距并在它们之间添加垂直线。让我们从垂直线开始。\n\n## 4.4.3 使用 column-rule\
  \ 属性\n\n为了在我们的列之间创建清晰的分隔，我们将使用 `column-rule` 属性在每列之间添加一条垂直线。像边框和轮廓一样，我们需要设置线型、宽度和颜色。为了保持我们的线条工作一致，我们将使用与页面顶部日期上方和下方边框设置的相同颜色和线条样式的线条。我们将使线条稍微窄一些。\n\
  \n屏幕顶部的线条分隔内容类型（标题、日期、文章），这里我们在同一内容类型内。我们添加线条是为了使列的视觉分隔更容易；我们不想破坏内容。因此我们希望线条不那么突出，所以我们将使它们变薄。\n\
  \n为了创建线条，我们在媒体查询中现有的 article 规则中添加 `column-rule: 2px solid #333333;`。我们的文章现在看起来如图所示\
  \ 4.20。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_119_0.png)\n\n图 4.20 添加垂直线的列\n\
  \n有了我们的线条，我们可以看到文章本身与日期之间有些拥挤，我们也可以在我们的线条和文本之间使用更多空间。\n\n## 4.4.4 使用 column-gap\
  \ 属性调整间距\n\n我们现在需要做 2 件事，增加文章日期与文章之间的容器间距，以及增加文章内每列之间的间隙。\n\n为了调整文章与日期之间的间距，我们将在文章顶部添加\
  \ 36px 的边距。在确定要使用的间距值时，有时需要判断并查看页面上看起来是否合适，我们希望为每个项目创建足够的空间，使其清晰但又不会相距太远以至于看起来分离。\n\
  \n> TIP 在设计中，有格式塔原则，这是一组人类感知原则，描述了人类如何对相似元素进行分组。7 条定律之一是邻近律。该原则谈到，彼此靠近的事物看起来比相距较远的事物更相关。\n\
  \n文章与日期之间的空间处理完毕后，让我们把注意力转向列之间的空间。为了在垂直线和文本之间添加间隙，我们使用 column-gap 属性。column-gap\
  \ 属性定义我们在列之间想要的空白量；我们将其设置为 42px；\n\n我们继续在媒体查询中添加这些样式，如清单 4.12 所见，因为我们只希望它们在布局为列时应用。我们不希望这些样式更改应用于更窄的屏幕。\n\
  \n### 清单 4.12 更新的媒体查询和 article 规则\n\n```\n@media (min-width: 955px) {\n  article\
  \ {\n    column-count: 3;\n    column-rule: 2px solid #333333;\n    column-gap:\
  \ 42px;\n    margin-top: 36px;\n  }\n}\n```\n\n有了这些调整（图 4.21），让我们把注意力转向引语。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_120_0.png)\n\
  \n图 4.21 调整间距后的布局\n\n本章前面，我们将 blockquote 样式化使其脱颖而出，但现在我们有了多列格式，它在页面上的其他视觉元素中显得有点迷失。让我们让它跨越多列以真正使其突出。\n\
  \n## 4.4.5 使内容跨越多列\n\n我们可以通过使用 `column-span` 属性使元素跨越多列。我们的值选择为 `all` 或 `none`。由于我们希望引语跨越整个页面，我们将选择\
  \ `all`。因此在我们的媒体查询中将添加以下规则：`blockquote { column-span: all }` 结果如图 4.22 所示。\n\n请注意，内容的流向已经改变。我们添加了箭头以显示由于使引语跨越屏幕而引入的新流向。不是整篇文章从左上到右下均匀分布在列中，通过在引语上添加\
  \ `column-span: all`，引语之前的 content 现在从左上到右在引语上方流动。引语之后的内容将在其下方同样进行。由于跨越内容，我们改变了文本在列中的流动方式。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_121_0.png)\n\n图 4.22 由于跨列的 blockquote\
  \ 而导致的内容重排\n\n当我们查看内容流时，我们注意到标题和图像已被拆分到 2 个不同的列中，这并不理想。让我们防止这种情况发生。\n\n## 4.4.6\
  \ 控制内容断开\n\n为了防止图像及其标题最终位于不同的列中，我们可以使用 `break-inside` 属性并将关键字值设置为 `avoid`，我们将其设置在\
  \ `<figure>` 元素上。通过此声明，我们通知浏览器在生成列时元素的 contents 应作为一个单元保持在一起，不应拆分到多个列中。换句话说，图像和\
  \ figcaption 应保持在一起。我们添加到媒体查询的规则是：`figure { break-inside: avoid }`。图 4.23 显示了 resulting\
  \ 输出。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_122_0.png)\n\n图 4.23 保持图像和标题在一起\n\
  \n## 4.5 最后润色\n\n有了我们想要的内容在列中流动，让我们润色一些最终细节。报纸布局的一个标志是文本通常是两端对齐的。\n\n## 4.5.1 文本对齐和连字符\n\
  \n对齐指的是如图 4.24 所描述的正文内各行的对齐方式。文本被对齐意味着文本行将从同一位置开始和结束形成一个方框，而不是像左对齐时那样有参差不齐的末端。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_123_0.png)\n\n图 4.24 文本对齐\n\n让我们继续对齐我们的段落文本。为此我们将使用\
  \ text-align 属性并赋值为 justify。为了使行长度相等，额外空间会在行中分布。我们可以使用 text-justify 属性来调整空间如何重新分配。如果我们不为\
  \ text-justify 设置值，浏览器将选择它认为最适合情况的值。我们有一个流体设计，它会随着窗口大小而增长和缩小。最好的可能因窗口大小而异；因此我们将让浏览器决定什么最有效。\n\
  \n我们将添加一些连字符。默认情况下，浏览器在单词到达行尾时不会连字符，而是简单地继续到下一行。我们可以通过将 hyphens 属性设置为 auto 来改变这种行为。允许浏览器在行尾连字符化单词将有助于减少为对齐文本而需要在单词之间需要的空白量。\n\
  \n### 清单 4.13 对齐段落文本\n\n```\n@media (min-width: 955px) {\n  ...\n  p {\n    text-align:\
  \ justify;\n    hyphens: auto;\n  }\n}\n```\n\n我们的段落现在看起来如图所示 4.25。\n\n\n\n\n\n\

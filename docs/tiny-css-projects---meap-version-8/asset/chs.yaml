  We also see a difference in how the internal CSS is written compared to inline CSS.\
  \ When writing internal CSS, we create what are known as rules. They are composed\
  \ of the following parts (Figure 1.6):\n\n![](img/b56145aa9b751926a7aedbd7172bc818_15_2.png)\n\
  \nFigure 1.6 An example of a CSS rule\n\nThe part of the rule that defines which\
  \ elements to apply the styles to is called the selector. The rule in Figure 1.6\
  \ will be applied to all h1 elements, its selector is h1. To apply multiple\n\n\n\
  \n选择器，我们将它们作为以逗号分隔的列表写在开括号之前。例如，要选择所有 h1 和 h2 元素，我们会写 h1,h2 { ... }。\n\n声明由属性组成，在本例中为\
  \ color，后跟属性值（red）。声明定义了所选元素将如何设置样式。\n\n属性和值都必须用美国英语书写。诸如 \"colour\" 或 \"capitalise\"\
  \ 之类的拼写变体不受支持，浏览器也不会识别。\n\n当浏览器遇到无效的 CSS 时，它会忽略它。如果一条规则中包含无效的声明，有效的声明仍会被应用，只有无效的部分会被忽略。\n\
  \n内部 CSS 对于样式特定于该页面的单次网页非常有效。它很好地分组了 CSS，使我们能够编写应用于元素的规则，避免在多个地方复制粘贴相同的样式。它还具有与内联样式相同的性能优势，即浏览器可以立即访问\
  \ CSS，而无需等待从其他位置获取。\n\n将 CSS 放在 HTML 文档中的缺点是，CSS 仅适用于该文档。因此，如果我们的网站有多个页面，通常就是这种情况，我们就需要将该\
  \ CSS 复制到每个 HTML 文档中。对于博客或电子商务网站等大型应用程序来说，这很快就会变得难以维护，因为任何样式更改都必须应用于所有页面。\n\n让我们最后一次撤销我们对项目的更改，并查看第三种技术。\n\
  \n#### 1.3.3 外部 CSS\n\n与内部 CSS 一样，外部 CSS 方法也将我们的 CSS 组合在一起，但它将 CSS 放在单独的 .css 文件中。通过分离\
  \ HTML 和 CSS，我们可以有效地分离关注点：内容和样式。\n\n我们通过使用 <link> HTML 标签将样式表链接到 HTML。链接元素对于样式表需要两个属性：rel\
  \ 属性，它描述了 HTML 文档与所链接内容之间的关系；以及 href 属性，它代表超文本引用并指示要包含的文档的位置。列表 1.2 显示了我们如何将样式表链接到我们项目的\
  \ HTML。\n\n```\nListing 1.3\n<!DOCTYPE html>\n<html>\n<head>\n<link rel=\"stylesheet\"\
  \ href=\"styles.css\">\n</head>\n<body>\n<h1>Inline CSS</h1>\n</body>\n```\n\n大多数情况下，这是在整个网络上看到的方法，也是我们在本书中将使用的方法。外部样式表的优点是我们的\
  \ CSS 位于单个文档中，可以一次性修改，其更改将应用于我们所有的 HTML 页面。这种方法的缺点是它意味着浏览器需要额外一次请求来检索该文档，从而失去了将\
  \ CSS 直接放在 HTML 中所提供的性能优势。\n\n#### 1.4 级联样式表的级联\n\n关于 CSS 的一个基本要点是级联。CSS 的形成围绕着级联的概念，它允许样式相互覆盖或继承。这为多个样式表竞争网页的呈现铺平了道路。\n\
  \n因此，使用浏览器开发者工具检查元素时，我们有时会看到多个 CSS 值相互竞争，以成为浏览器渲染的值。浏览器如何决定对元素应用哪些 CSS 属性值是通过特异性来决定的。\n\
  \n特异性是指浏览器（或用户代理）决定哪些声明与 HTML 相关并将样式应用于该元素。当多个样式表被应用时，样式表应用的顺序是特异性计算的一个方面。样式在后面的样式表中会覆盖先前样式表提供的样式。换句话说，最后声明的获胜。\n\
  \n在 CSS 中有三种不同的样式表来源。\n\n##### 1.4.1 用户代理样式表\n\n第一个来源是浏览器的默认样式。当我们第一次打开项目，在添加任何样式之前，我们的元素并不都看起来一样。例如，我们的标题比我们的文本更大更粗。这是由用户代理（UA）样式表定义的。这些具有最低优先级，我们发现不同浏览器对\
  \ HTML 属性的呈现略有不同。\n\n大多数时候，UA 样式表设置字体大小、边框样式，以及表单元素的一些基本布局，如文本输入或进度条。这在用户样式表找不到或加载文件时出错时很有用。UA\
  \ 样式表提供一些后备样式，允许用户仍然使用网站。\n\n##### 1.4.2 作者样式表\n\n我们作为开发者编写的样式表被称为作者样式表，它们通常在浏览器显示的样式中具有第二高的优先级。当我们创建网页时，我们编写并应用于网页的\
  \ CSS 样式表就是作者样式表。\n\n##### 1.4.3 用户样式表\n\n访问我们网页的用户可以使用自己的样式表来覆盖作者和 UA 样式。这可以改善他们的体验，尤其对残障用户而言。\n\
  \n用户可能使用自己的样式表的实例包括设置最小字体大小、选择自定义字体、提高对比度或增加元素之间的间距。任何用户都可以将用户样式表应用于网页。\n\n这些如何应用于网页将取决于浏览器，通常通过浏览器设置或使用插件。\n\
  \n一旦应用，用户样式表仅对添加它的用户在其应用的浏览器上应用。更改是否会从一个设备携带到另一个设备，又取决于浏览器本身及其跨设备同步插件和设置的能力。\n\n\
  ##### 1.4.4 CSS 重置\n\n浏览器提供的默认样式不一致。每个浏览器都有自己的样式表。例如，Chrome 中的默认样式与 Safari 中的不同。如果我们希望我们的应用程序在所有浏览器中看起来相同，这会带来一些挑战。幸运的是，我们有两个可用的选项，CSS\
  \ 重置或 Normalize。尽管两者都可用于解决跨浏览器样式问题，但它们的工作方式截然不同。\n\n重置表示我们不想要任何浏览器默认样式，并将它们全部重置。在没有应用任何作者样式的情况下，所有元素无论是什么，都看起来像纯文本，如图\
  \ 1.7 所示。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_18_0.png)\n\n图 1.7 应用了 CSS\
  \ 重置\n\n要将 CSS 重置应用于我们的项目，首先我们创建一个重置样式表添加到我们的项目中。在我们的项目文件夹中，我们创建一个名为 reset.css 的文件。然后我们将重置\
  \ CSS 复制到文件中。\n\n存在许多重置选项，但一个常用的选项可以在 https://meyerweb.com/eric/tools/css/reset/\
  \ 找到。\n\n最后我们需要将样式表链接到我们的 HTML。由于顺序很重要，我们希望确保在 `head` 中将重置 CSS **在** 作者样式 **之前**\
  \ 包含。我们的 HTML 因此将如列表 1.3 所示。\n\n```\nListing 1.4\n<head>\n...\n<link rel=\"stylesheet\"\
  \ href=\"reset.css\"> #A\n<link rel=\"stylesheet\" href=\"styles.css\"> #B\n</head>\n\
  ```\n\n#A 重置样式表\n#B 作者样式表\n\nCSS 重置的好处是，我们现在有一个空白的起点开始。如图 1.7 所示，我们所有的元素现在都看起来像纯文本，因此缺点是我们现在需要为所有元素定义基本样式，包括为列表添加项目符号、区分标题级别等。此外，每个版本的\
  \ CSS 重置都将根据版本和编写它的开发者而略有不同。\n\n我们的另一个选项是 Normalize。不是重置样式，它专门针对在浏览器之间存在差异的元素并应用规则来标准化它们。\n\
  \n##### 1.4.5 Normalize\n\n与 CSS 重置一样，Normalize 的样式会根据版本和作者略有不同。Normalize 的一个常用选项可以在\
  \ https://necolas.github.io/normalize.css/ 找到。我们可以以与 CSS 重置相同的方式将其应用于我们的项目。我们创建一个文件，将代码复制到文件中，并将其链接到我们的\
  \ HTML。应用后（图 1.8）我们注意到我们的 HTML 看起来与原来一样，因为它处理的大多数差异都在表单元素和按钮上。根据我们使用的浏览器，我们可能会注意到\
  \ h1 大小的差异。\n\n\n\n\n\n![](img/b56145aa9b751926a7aedbd7172bc818_20_0.png)\n\n##\

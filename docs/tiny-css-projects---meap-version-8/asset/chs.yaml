  As we look at our layout, we notice that the image looks a little odd and out of\
  \ place at the bottom of the second column. Let’s fix that.\n\n### 4.5.2 Wrapping\
  \ the text around the image\n\nTo reconnect the image with the subsequent text,\
  \ we will push the image and its caption to the left and have the text wrap around\
  \ the image using the float property. Applying the float property to an element\
  \ pushes it to either the left or the right, allowing text and inline elements to\
  \ wrap around it.\n\nThis is where having the image and caption as a unit inside\
  \ of a figure tag comes in really handy for styling. Since they are both contained\
  \ inside of the figure, we will apply the float to the figure, which will neatly\
  \ wrap the text around both the image and the caption.\n\nListing 4.14 shows how\
  \ we float the figure. Notice that we added a right margin to the figure. Since\
  \ we are floating the figure to the left, it places itself on the left side of the\
  \ column, allowing the text to wrap around it in the left over space to the right\
  \ as seen in Figure 4.26. The right margin creates a space between the image and\
  \ the text so that the text does not come right up against the edge of the image.\n\
  \n## Listing 4.14 Floating the figure\n\n```\n@media (min-width: 955px) {\n  ...\n\
  \  figure {\n    float: left;\n    margin-right: 24px;\n  }\n}\n```\n\n![](img/b56145aa9b751926a7aedbd7172bc818_125_0.png)\n\
  \nFigure 4.26 Floated image\n\nThere are a lot more really cool things we can do\
  \ with floating images covered in chapter 7. For now though, let’s focus on our\
  \ newspaper page. The last thing we will address is handling how the page behaves\
  \ if we are looking at the content in a really wide window.\n\n### 4.5.3 Max-width\
  \ and margin auto\n\nFigure 4.26 shows us that our layout starts to degrade as the\
  \ window gets really wide. The wider the window the worse it will get. More and\
  \ more users have extra wide screens and we therefore need to consider what would\
  \ happen if they have the window maximized taking up the entire screen. To handle\
  \ this use case we will use the same trick we used with the loader in chapter 2.\
  \ We will set a maximum width for our layout and then set its left and right margins\
  \ to auto, which will center the container when the size of the window is greater\
  \ than our maximum width.\n\nFor our page our container is the body, so we will\
  \ give our body a max-width of 1200 pixels and set our left and right margins to\
  \ auto. We will also need to move the background color from being set on the body\
  \ to being set on the html element otherwise, when our screen size is greater than\
  \ 1200 pixels we will end up with a white band to the left and right of our page.\n\
  \nThese changes won’t go inside of the media query. We will edit the styles we set\
  \ on the body at the beginning of this chapter and add an html rule to set the background\
  \ color. Our changes are as follows (Listing 4.15):\n\n## Listing 4.15 Floating\
  \ the figure\n\n```\nhtml { background-color: #f9f7f1 }\n\nbody {\n  background-color:\
  \ #f9f7f1;  #A\n  font-family: 'PT Serif', serif;\n  color: #404040;\n  padding:\
  \ 0 24px;\n  max-width: 1200px;  #B\n  margin: 0 auto;     #C\n}\n```\n\n#A We move\
  \ the background color from the body rule to the html rule\n\n#B Sets the maximum\
  \ width our page can become\n\n#C Centers the page when the window is greater than\
  \ 1200px\n\nWith these final changes we have a page that looks works for both mobile\
  \ and desktop users. Figure 4.27 shows our finished layout.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_126_0.png)\n\
  \nFigure 4.28 Finished layout\n\n## 4.6 Summary\n\n- A theme is the general look\
  \ and feel we will maintain throughout an application\n- We may need to import our\
  \ fonts if we use something that is not considered websafe\n- Creating a visual\
  \ hierarchy will help our users orient themselves to the page and identify important\
  \ information\n- We can control which symbols the browser uses when instructed to\
  \ display quotation marks\n- We can customize the way our lists display their bullets\
  \ using the counter-style at-rule\n- Filters allow us to alter the appearance of\
  \ an image\n- We can create multi column layouts using the multi-column layout module\n\
  - We can make content span all of the columns when creating multi-column layouts\n\
  - We make the browser use hyphens to break words at the end of lines\n- Float allows\
  \ us to wrap text around an element\n"
- "## 5\nSummary cards with hover interactions\n\n## This chapter covers\n\n- Clipping\
  \ static background images using the background-clip property\n- Using transitions\
  \ to reveal content on hover\n- Using media queries to choose styles based on the\
  \ device's capabilities and browser window size\n\nSummary cards are used for a\
  \ range of purposes, whether that be showing a preview for a film, buying a property,\
  \ a preview of a news article or in our case showing a list of hotels. Usually a\
  \ summary card contains a title, description, a call to action and sometimes an\
  \ image. The cards we will create in this project can be seen in Figure 5.1.\n\n\
  ![](img/b56145aa9b751926a7aedbd7172bc818_129_0.png)\n\nFigure 5.1 Finished Product\n\
  \nThe cards will be placed in a single line using the grid module for layout. Each\
  \ card will have its own background image, with the content placed on top. If the\
  \ user is viewing the card on a device that supports hover and is at least 700px\
  \ or more wide then the user will be able to see the title and then hover over the\
  \ card, which will reveal the short description and an orange call to action button\
  \ for contrast against the black as seen in Figure 5.2. The reason why we have chosen\
  \ 700px or more is that it becomes less likely that the person is viewing the web\
  \ page on a desktop or laptop device when the browser window size is less than 700px.\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_129_1.png)\n\nFigure 5.2 Hover Effect\
  \ on finished product\n\n\n\n\n\n对于在不支持悬停或宽度小于 700px 的设备上查看的用户，我们将始终显示所有信息而不使用悬停，以确保用户体验不受影响（图\
  \ 5.3）。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_130_0.png)\n\n图 5.3 在无法处理悬停状态的小型或触摸设备上的成品\n\
  \n本项目的另一部分是页眉，我们希望使其脱颖而出并具有一定的视觉趣味。为此我们将探索 background-clip 属性以及如何将图像裁剪在文字周围。\n\n\
  ## 5.1 开始\n\n列表 5.1 和 5.2 包含了我们在此章节中在此基础上构建的页面的起始 CSS 和 HTML。按照我们对页面进行样式设定的过程，你可以从\
  \ Github 仓库下载起始 HTML 和 CSS：https://github.com/michaelgearon/Tiny-CSS-Projects/tree/main/chapter-05。\n\
  \n移动端和桌面端的体验将使用相同的 HTML 和样式表。与我们在第 4 章中所做的类似，我们将利用媒体查询根据浏览器大小和功能来更改样式。列表 5.1 显示了我们的起始\
  \ HTML。每个卡片都用 <section> 标签包裹，并包含其标题（<h2>）、描述（<p>）和行动号召（<a>）。\n\n### 列表 5.1 起始 HTML\n\
  \n```\n<header>\n<h1>Hotels</h1> #A\n</header>\n<main>\n<section> #B\n<div>\n<h2>Meeru\
  \ Island Resort & Spa</h2> #C\n<p>The stylish Meeru Island Resort & Spa strikes\
  \ the perfect note for a peaceful escape.</p> #D\n<a href=\"#\">Learn more</a> #E\n\
  </div>\n</section> #F\n<section>\n<div>\n<h2>Flamingo Beach</h2>\n<p>Plenty of pools\
  \ and activities to keep children smiling, plus comfy apartments that are tailored\
  \ for families.</p>\n<a href=\"#\">Learn more</a>\n</div>\n</section>\n<section>\n\
  <div>\n<h2>Protur Safari Park</h2>\n<p>The big, family-friendly complex dishes up\
  \ plenty of pools and activities.</p>\n<a href=\"#\">Learn more</a>\n</div>\n</section>\n\
  <section>\n<div>\n<h2>Mountain View Resort</h2>\n<p>There are heaps of spots to\
  \ soak in at the super-sized Holiday Village Costa del Sol.</p>\n<a href=\"#\">Learn\
  \ more</a>\n</div>\n</section>\n</main>\n```\n\n#A 页面标题\n\n#B 第一个摘要卡片的开始\n\n#C 卡片标题\n\
  \n#D 卡片描述（仅在浏览器允许时悬停时显示）\n\n#E 卡片行动号召\n\n#F 第一个摘要卡片的结束\n\n我们的起始 CSS（列表 5.2）包含了一些基础样式来设置我们的页面。对于\
  \ body，我们只是将 margin 增加到 40px，并在四个方向都添加了 20px 的 padding。我们再次使用了 Google Fonts，但这次我们使用的是\
  \ Cardo 字体家族，常规字重但使用斜体版本，这将用于每个卡片的描述。\n\n对于标题，我们将使用 Rubik，常规和粗体字重。该字体是一个不错的选择，因为它结合了良好的可读性和圆润的边缘，提供了非正式感，与\
  \ Cardo 字体搭配效果很好。\n\n请注意，在加载多个 Google 字体时，导入可以合并为一个请求。\n\n### 列表 5.2 起始 CSS\n\n\
  ```\n@import\n  url(\"https://fonts.googleapis.com/css?family=Cardo:400i|Rubik:400,700&display=swap\"\
  )\n  ; #A\n\nbody {\n  margin-top: 40px;\n  padding: 20px;\n}\n```\n\n#A 一次请求加载\
  \ Cardo 和 Rubik 字体\n\n当我们开始为项目设置样式时，我们的页面如下所示（图 5.4）。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_132_0.png)\n\
  \n图 5.4 起始点\n\n## 5.2 使用网格布局页面\n\n一个良好的起点是查看我们的卡片布局以及整个网页。我们需要考虑布局的 3 个方面：\n\n-\
  \ 页眉和主要内容\n- 卡片的容器\n- 卡片内的内容\n\n我们将为全部 3 种用例使用网格布局模块。\n\n> **Grid**\n> Grid 允许我们在由列和行组成的系统上同时在垂直和水平轴上放置和对齐元素。\n\
  > \n> 如果你需要了解网格的工作原理，请查看第 2 章。\n\n为了在页面上布局元素，我们将从为窄屏幕创建样式开始，然后通过媒体查询在构建到更大屏幕尺寸时编辑布局。\n\
  \n我们的布局由 2 个地标组成，<header> 和 <main>，它们是 <body> 的直接子元素（列表 5.3）。通过将 body 的 display\
  \ 属性值设置为 grid，我们将影响页眉和 main 元素的位置。\n\n```\nListing 5.3 Starting HTML\n<body>\n \
  \ <header>  #A\n  ...       #A\n  </header> #A\n  <main>    #B\n  ...       #B\n\
  \  </main>   #B\n</body>\n```\n\n#A 包含页面页眉\n#B 包含卡片\n\n我们然后使用 place-items 属性将元素居中在页面上。该属性是\
  \ align-items 和 justify-items 属性声明值的简写。我们将其值设置为 center，将所有项目在其各自的行和列的中间对齐。我们更新后的\
  \ body 规则显示在列表 5.4 中。\n\n### 列表 5.4 定位页眉和 main 元素\n\n```\nbody {\n  display: grid;\n\
  \  place-items: center;\n  margin-top: 40px;\n  padding: 20px;\n}\n```\n\n请注意，我们没有定义任何\
  \ grid-template-rows、grid-template-columns 或 grid-template-areas。默认情况下，如果未声明，则浏览器仍会创建一个\
  \ 1 列网格，行数与需要定位的元素数量一样多。在我们的例子中，我们有 2 个，因此我们的网格有 1 列和 2 行（图 5.5）。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_134_0.png)\n\
  \n图 5.5 1 x 2 网格\n\n页眉和 main 的宽度因其在网格内而被更改，仅占用其内容所需的水平空间。由于页眉的内容较窄（包含单词 Hotels 的\
  \ h1），页面标题会居中于页面。main 元素占用其可用的全部宽度，因为 Flamingo 海滩（第二个卡片）的描述需要全部宽度，甚至会换行。如果我们进一步扩展屏幕宽度，我们会看到\
  \ main 元素也会居中自身（图 5.6）。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_135_0.png)\n\
  \n图 5.6 在非常宽的屏幕上居中的 Main\n\n我们还将依赖网格的默认功能并省略定义行和列，因为我们希望在窄屏幕上保持卡片堆叠。为了在卡片之间添加空间，我们包含\
  \ 1rem 的 gap。我们还将 main 元素的宽度限制为最大 1024 像素，以防止在下一节中我们在宽屏幕上将它们水平对齐时卡片在宽屏幕上过于分散。\n\n\
  我们的更新后的 CSS（列表 5.5）在保持卡片堆叠的同时在每个卡片之间添加了 1rem 的间隔，如图 5.7 所示。\n\n### 列表 5.5 在窄屏幕上定位卡片\n\
  \n```\nmain {\n  display: grid;\n  max-width: 1024px;\n  grid-gap: 1rem;\n}\n```\n\
  \n# Hotels\n\n# Meeru Island Resort & Spa\n\nThe stylish Meeru Island Resort & Spa\
  \ strikes the perfect note for a peaceful escape.\n\nLearn more\n\n# Flamingo Beach\n\
  \nPlenty of pools and activities to keep children smiling, plus comfy apartments\
  \ that are tailored for families.\n\nLearn more\n\n# Protur Safari Park\n\nThe big,\
  \ family-friendly complex dishes up plenty of pools and activities.\n\nLearn more\n\
  \n# Mountain View Resort\n\nThere are heaps of spots to soak in at the super-sized\
  \ Holiday Village Costa del Sol.\n\nLearn more\n\n图 5.7 应用于 <main> 的网格\n\n### 5.2.1\
  \ 媒体查询\n\n目前我们的卡片是垂直堆叠的。这是 HTML 元素在大多数情况下的默认行为，并且在移动设备上设备宽度相对较窄时是有意义的。然而，对于桌面屏幕，浏览器窗口可以更宽，我们可以利用水平空间使用媒体查询。我们可以定义一些媒体查询来调整布局。\n\
  \n- 1. 如果窗口宽度大于或等于 700px，我们将网格调整为 2 个等大的列，并将每个 section 的高度设置为恰好 350 像素。\n- 2. 在\
  \ 950 像素时，我们再次调整布局，使其具有 4 个等大的列，覆盖前一个媒体查询中设置的 grid-template-columns 值。高度属性值仍然保持\
  \ 350 像素，因为前一个媒体查询的条件（min-width: 700px）仍然满足。\n\n```\nmin-width: 700px\n```\n\n如果这两个媒体查询的要求均未满足（当浏览器窗口宽度小于\
  \ 700px 时），则卡片将垂直堆叠在一列中。列表 5.6 显示了正在创建的 2 个媒体查询。\n\n\n\n\n\n# Listing 5.6 卡片布局\n\
  \n```\n@media (min-width: 700px) { #A\n  main {\n    grid-template-columns: repeat(2,\
  \ 1fr);\n  }\n  main > section {\n    height: 350px;\n  }\n}\n@media (min-width:\
  \ 950px) { #B\n  main {\n    grid-template-columns: repeat(4, 1fr);\n  }\n}\n```\n\
  \n#A 媒体查询用于判断浏览器窗口宽度是否至少为 700px。如果是，则使用查询内的样式。\n\n#B 第二个媒体查询判断浏览器窗口宽度是否至少为 950px。如果是，则覆盖之前的查询并将网格设置为\
  \ 4 列宽\n\n图 5.8 和 5.9 显示了在 800 和 1000 像素宽浏览器窗口中的输出。\n\n# Hotels\n\n# Meeru Island\
  \ Resort & Spa\n\nThe stylish Meeru Island Resort & Spa strikes the perfect note\
  \ for a peaceful escape.\n\nLearn more\n\n# Flamingo Beach\n\nPlenty of pools and\
  \ activities to keep children smiling, plus comfy apartments that are tailored for\
  \ families.\n\nLearn more\n\n# Protur Safari Park\n\nThe big, family-friendly complex\
  \ dishes up plenty of pools and activities.\n\nLearn more\n\n# Mountain View Resort\n\
  \nThere are heaps of spots to soak in at the super-sized Holiday Village Costa del\
  \ Sol.\n\nLearn more\n\nFigure 5.8 Layout Achieved Viewed On a 800 Pixel wide screen\n\
  \n# Hotels\n\n# Meeru Island Resort & Spa\n\nThe stylish Meeru Island Resort & Spa\
  \ strikes the perfect note for a peaceful escape.\n\nLearn more\n\n# Flamingo Beach\n\
  \nPlenty of pools and activities to keep children smiling, plus comfy apartments\
  \ that are tailored for families.\n\nLearn more\n\n# Protur Safari Park\n\nThe big,\
  \ family-friendly complex dishes up plenty of pools and activities.\n\nLearn more\n\
  \n# Mountain View Resort\n\nThere are heaps of spots to soak in at the super-sized\
  \ Holiday Village Costa del Sol.\n\nLearn more\n\nFigure 5.9 Layout Achieved Viewed\
  \ On a 1000 Pixel wide screen\n\nWith our layout in hand, let’s start focusing on\
  \ styling our content starting with the header. We are going to change the font\
  \ for our h1 element and look at how to use an image to color our text.\n\n## 5.3\
  \ Styling the header using background-clip\n\nThe title for this page—“hotels”—could\
  \ be visually more interesting. One way to liven it up could be to set the color\
  \ to a nice vibrant color and update the font family to something modern. Another\
  \ way is to apply a background image to the text. This is possible through 2 experimental\
  \ properties, the background-clip and the text-fill-color.\n\nThey are experimental\
  \ because they still require vendor prefixes to support all main browsers. This\
  \ can present some risk as experimental properties may have non-standard implementation\
  \ and are subject to change. We can reduce this risk by setting a fallback color\
  \ value so that if these 2 properties do not work the user will still see the text,\
  \ just without the background image.\n\n### Experimental Properties\n\nExperimental\
  \ properties are not recommended for production use and often have non standard\
  \ implementations. For more details about experimental properties please refer to\
  \ Chapter 3, Section 7: Vendor Prefixes.\n\n### 5.3.1 Setting the font\n\nThe first\
  \ step we need to take is to update the font-family, weight, and size as well as\
  \ transforming the text into uppercase as seen in Listing 5.7.\n\nWe used the shorthand\
  \ font property. The first value sets the weight, and in this case it is set to\
  \ heavy. The second value is the font size of 120px, then the font-family we want\
  \ to use. If this font can not be loaded then we fallback to a sans-serif font.\n\
  \nWe transformed the text to uppercase through styling rather than writing it all\
  \ in uppercase within the HTML. Using all uppercase characters can impact accessibility,\
  \ as some screen readers may interpret the all caps as an acronym and read the letters\
  \ out individually instead of as a full word. Furthermore, if someone were to copy\
  \ paste our text, it would come through in uppercase. If we set it to uppercase\
  \ through CSS, we are only visually styling the text while the characters can be\
  \ mixed case. Moreover, we are in a very unique position here with only one page\
  \ to style. In a traditional project, our styles would most likely be applied to\
  \ multiple pages; by adjusting our casing in our styles, we help ensure consistency\
  \ throughout our website or application. It is also worth noting that we should\
  \ use all capitals sparingly as it can impact readability of the content.\n\n# Listing\
  \ 5.7 Header typography\n\n```\nh1 {\n  font: 900 120px \"Rubik\", sans-serif; #A\n\
  \  text-transform: uppercase;\n}\n```\n\n#A Shorthand font property\n\nOur header\
  \ now looks as follows (Figure 5.10):\n\n![](img/b56145aa9b751926a7aedbd7172bc818_140_0.png)\n\
  \nMeeru Island Resort & Spa\nThe stylish Meeru Island Resort & Spa strikes the perfect\
  \ note for a peaceful escape.\nLearn more\n\nFlamingo Beach\nPlenty of pools and\
  \ activities to keep children smiling, plus comfy apartments that are tailored for\
  \ families.\nLearn more\n\nProtur Safari Park\nThe big, family-friendly complex\
  \ dishes up plenty of pools and activities.\nLearn more\n\nMountain View Resort\n\
  There are heaps of spots to soak in at the super-sized Holiday Village Costa del\
  \ Sol.\nLearn more\n\nFigure 5.10 Applied header typography styles\n\n### 5.3.2\
  \ Background-clip\n\nNext we use an image to color the letters essentially applying\
  \ a background image to the letters themselves. The first thing we need to do is\
  \ set a background image on the h1 element. To ensure that the image covers the\
  \ entirety of the h1 element, we assign the background-size property a value of\
  \ cover. This will automatically calculate the width and height the image needs\
  \ in order to make sure the image covers the entire element.\n\nWe then manipulate\
  \ the image to only apply to the letters rather than the entire h1 element. This\
  \ is where the background-clip property comes into play. This property defines,\
  \ based on the box-model, which part of the element the background should cover.\
  \ In our case we will give it a value of text because we only want the image to\
  \ show behind the letters. This property still requires a browser prefix for webkit\
  \ based browsers (Chrome, Edge, and Opera) so we also include the prefixed property\
  \ for compatibility with those browsers.\n\nOur text is currently black, which is\
  \ preventing the image from showing through. We must therefore make the letters\
  \ transparent in order not to obscure the image we just set as our text background.\
  \ The text-fill property allows us to set the color of the text. This property is\
  \ very similar to using color but if both are set, it will supersede the color property.\
  \ Since text-fill also requires a vendor prefix (for both webkit and mozilla based\
  \ browsers), we can use color property as a fall back in case the image does not\
  \ load or any of the experimental properties should fail.\n\nWe set the color to\
  \ white because we will add a black background to our page a little bit later in\
  \ this chapter.\n\n# Listing 5.8 Background clip text code\n\n```\nh1 {\n  text-transform:\
  \ uppercase;\n  font: 900 120px \"Rubik\", sans-serif;\n  background: url(https://images.unsplash.com/photo-1648743430927-5a06fe9f8476?ixlib=rb-1.2.1&ixid=MnwMxMjA3fDB8MHxwaG90by1wYd1fHx8FGVufDB8fHx8&auto=format&fit=crop&w=2074&q=80);\
  \ #A\n  background-size: cover;\n  -webkit-background-clip: text; #B\n  background-clip:\
  \ text; #B\n  -moz-text-fill-color: transparent; #C\n  -webkit-text-fill-color:\
  \ transparent; #C\n  color: white; #D\n}\n```\n\n#A Adding the background image\n\
  #B Clipping the background to only be applied behind the text\n#C Making the text\
  \ transparent to allow the image to show through\n#D Fallback color\n\nWith any\
  \ prefixing we add the -moz- and -webkit- prefixes before the unprefixed version.\
  \ This allows the browser to make sure it is using the non experimental version\
  \ once it becomes available.\n\nWith our header styled (Figure 5.11), the next task\
  \ for us to tackle is styling the cards. We will first focus on styling the cards\
  \ without the hover effect and then create our media query for handling cards on\
  \ wide screens that support hover.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_142_0.png)\n\
  \nFigure 5.11 Background image clipped to the heading\n\n## 5.4 Styling the cards\n\
  \nEach card is created using an outer section element which will have a background\
  \ image, and an inner div which we will give a background color to in order to keep\
  \ our text legible over the image. Within that div is the actual content. Listing\
  \ 5.9 shows our card structure.\n\n# Listing 5.9 Card HTML\n\n```\n<section> #A\n\
  \  <div> #B\n    <h2>Meeru Island Resort & Spa</h2>    #C\n    <p>The stylish Meeru\
  \ Island Resort...</p>    #C\n    <a href=\"#\">Learn more</a>    #C\n  </div>\n\
  </section>\n```\n\n#A Outer Card container\n#B Content container\n#C Content\n\n\
  To style each part of the card, we will work outwards first, styling the container\
  \ for each card, then the container for the content, and then finally the content\
  \ itself.\n\n### 5.4.1 Outer card container\n\nThe outer container is the element\
  \ that will get the background image. Each section gets an image for its hotel or\
  \ resort. We will select each section individually by individually selecting immediate\
  \ descendent section elements of main in conjunction with the :nth-child() pseudo-class.\
  \ Our selectors are built as follows: main > section:nth-child(n) where n is the\
  \ position of the card we are trying to target within the main element. We then\
  \ assign each of the sections a background image as seen in listing 5.10.\n\n\n\n\
  \n\n## 上例 5.10 添加背景图片\n\n```\nmain > section:nth-child(1) {\n  background-image:\
  \ url(https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?ixlib=rb-1.2.1&ixid=MnwXMJA3fDB8MHxwaG90by1wYWdlfHx8FGVufDB8fHx8&auto=format&fit=crop&w=2070&q=80);\n\
  }\nmain > section:nth-child(2) {\n  background-image: url(https://images.unsplash.com/photo-1625244724120-1fd1d34d00f6?ixlib=rb-1.2.1&ixid=MnwXMJA3fDB8MHxwaG90by1wYWdlfHx8FGVufDB8fHx8&auto=format&fit=crop&w=2340&q=80);\n\
  }\nmain > section:nth-child(3) {\n  background-image: url(https://images.unsplash.com/photo-1616064959886-a500e5c38e1e?ixlib=rb-1.2.1&ixid=MnwXMJA3fDB8MHxwaG90by1wYWdlfHx8FGVufDB8fHx8&auto=format&fit=crop&w=2070&q=80);\n\
  }\nmain > section:nth-child(4) {\n  background-image: url(https://images.unsplash.com/photo-1598598795009-f80c5072e665?ixlib=rb-1.2.1&ixid=MnwXMJA3fDB8MHxwaG90by1wYWdlfHx8FGVufDB8fHx8&auto=format&fit=crop&w=1674&q=80);\n\
  }\n```\n\n添加了背景图片后（图 5.12），让我们也配置一些适用于所有区块的通用样式。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_143_0.png)\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_143_1.png)\n\n图 5.12 卡片背景图片\n\n我们可以看到图片并没有很好地居中，也没有很好地展示酒店和度假村。我们可以使用\
  \ background-size 属性来调整图片大小。我们将其设置为 cover，以便在图片的宽高比与卡片不同时，最大化显示图片的面积而不留下任何空白。我们还添加了\
  \ background-color 为 #3a8491（青绿色）作为后备。由于我们是从网络（unsplash.com）加载图片，这些图片可能会被移除或加载失败。因此我们包含一个\
  \ background-color 作为后备，以防这种情况发生。\n\n然后我们为卡片添加 border radius 来弯曲角落并柔化边缘。我们的容器样式可以在上例\
  \ 5.11 中找到。\n\n## 上例 5.11 卡片容器样式\n\n```\nmain > section {\n  background-size: cover;\n\
  \  background-color: #3a8491;\n  border-radius: 4px;\n}\n```\n\n在处理完外部容器后（图 5.13），让我们现在转向内容容器。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_144_0.png)\n\n![](img/b56145aa9b751926a7aedbd7172bc818_144_1.png)\n\
  \n图 5.13 已样式化的外部卡片容器\n\n## 5.4.2 内部容器和内容\n\n目前我们的文本不可读，因为深色文字与图片背景对比，且非常接近外部容器的边缘。\n\
  \n为了提高可读性，我们为内部容器设置 background color 为 rgba(0, 0, 0, .75)，即带透明度的黑色。我们还将文字更改为 whitesmoke\
  \ 并居中。通过在设计中不使用纯黑或纯白，我们为整体构图实现了更柔和的感觉。\n\n在添加了背景颜色后，我们为内容容器添加 1 rem 的内边距，以使文字远离深色背景的边缘，并添加\
  \ 1rem 的外边距，以在图片边缘与背景开始处之间留出间隙。\n\n最后我们调整卡片内文字的 font size、weight、line-height 和 font-family。我们的\
  \ CSS 如下所示（上例 5.12）。\n\n## 上例 5.12 卡片内容样式\n\n```\nmain > section > div {\n  background-color:\
  \ rgba(0, 0, 0, .75);    #A\n  margin: 1rem;                               #A\n\
  \  padding: 1rem;                              #A\n  color: whitesmoke;        \
  \                  #A\n  text-align: center;                         #A\n  font:\
  \ 14px \"Rubik\", sans-serif;            #A\n}                                 \
  \              #A\n\nsection h2 {                                    #B\n  font-size:\
  \ 1.3rem;                            #B\n  font-weight: bold;                  \
  \          #B\n  line-height: 1.2;                             #B\n}           \
  \                                    #B\n\nsection p {                         \
  \            #C\n  font: italic 1.125rem \"Cardo\", cursive;      #C\n  line-height:\
  \ 1.35;                            #C\n}                                       \
  \        #C\n```\n\n#A 卡片内容容器\n#B 卡片标题\n#C 卡片内容\n\n应用样式后（图 5.14），我们最后需要样式化的内容是我们的链接。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_145_0.png)\n\n图 5.14 卡片内部容器和排版\n\n由于我们的链接在此情况下作为行动号召，使用户查看有关酒店或度假村的更多信息，我们希望使其加粗且醒目（上例\
  \ 5.13）。为实现此目的，由于我们卡片内的多数元素都比较暗，我们将为链接赋予明亮的黄橙色（#ffa600）背景，并将其文字颜色更改为近乎黑色。我们还将为其添加内边距，但由于链接默认是内联元素，我们需要将其\
  \ display 属性值更改为 inline-block，以便周围元素能够正确重排。\n\n为了与卡片保持一致，我们将为链接赋予 4px 的 border-radius，并最后处理悬停和聚焦。取而代之的是下划线，我们将完全移除下划线，在悬停时稍微加深背景颜色，在聚焦时添加一个距离链接\
  \ 3 像素的虚线轮廓。\n\n## 上例 5.13 链接样式\n\n```\na {\n  background-color: #ffa600;\n  color:\
  \ rgba(0, 0, 0, .75);\n  padding: 0.75rem 1.5rem;\n  display: inline-block;\n  border-radius:\
  \ 4px;\n  text-decoration: none;\n}\n\na:hover {\n  background-color: #e69500;\n\
  }\n\na:focus {\n  outline: 1px dashed #e69500;\n  outline-offset: 3px;\n}\n```\n\
  \n图 5.15 显示了我们样式化的链接。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_146_0.png)\n\n\
  # 图 5.15 已样式化的链接\n\n链接没有垂直对齐看起来有点奇怪，也不显得很整齐。为了使所有链接对齐，我们将再次使用 grid。我们将为内部容器赋予 display\
  \ 值 grid，并将 grid-template-rows 值设置为 min-content auto min-content，同时将内部容器的高度设置为 100%\
  \ 减去我们分配给它的内边距和外边距。\n\n本章前面我们已为内部容器设置了 1rem 的外边距和 1rem 的内边距，这意味着为使其占据提供的空间的全部高度，需要分配的高度等于\
  \ 100% 减去 4rem（顶部 1rem 内边距和 1rem 外边距，底部相同，总计 4 rem）。要在 CSS 中实现这一点，我们使用 calc() 函数来为我们进行计算，将\
  \ calc(100% - 4rem) 分配给 height 属性。\n\n定义的行（grid-template-rows: min-content auto\
  \ min-content）和设定的高度的组合创建了一个布局，其中标题和链接仅占用它们需要的空间，而中间部分（段落元素）获得剩余空间。最后，为了在卡片中间垂直居中段落内容，我们使用\
  \ align-items 属性，值为 center，并移除浏览器自动添加到 h2 的底部外边距。\n\n如果我们保留标题底部的外边距，段落顶部会有比底部更多的空间，因为\
  \ min-content 会将元素上的外边距计入在内。卡片底部链接没有外边距，段落上方与下方的空白就会不成比例。\n\n上例 5.14 显示了我们的布局调整。\n\
  \n## 上例 5.14 内部容器布局调整\n\n```\nmain > section > div {\n  background-color: rgba(0,\
  \ 0, 0, .75);\n  margin: 1rem;\n  padding: 1rem;\n  color: whitesmoke;\n  text-align:\
  \ center;\n  height: calc(100% - 4rem);\n  display: grid;\n  grid-template-rows:\
  \ min-content auto min-content;\n  align-items: center;\n}\n\nsection h2 {\n  font-size:\
  \ 1.3rem;\n  font-weight: bold;\n  line-height: 1.2;\n  margin-bottom: 0;\n}\n```\n\
  \n这次最后的调整完成了我们的卡片布局（图 5.16）。我们现在将专注于为宽度大于或等于 700px 且具有悬停能力的设备显示和隐藏部分内容。\n\n\n\n\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_148_0.png)\n\nFigure 5.16 Styled cards\n\
  \n## 5.5 Transition on hover and focus-within\n\n首先我们需要创建一个媒体查询，用于检查设备是否支持悬停交互、浏览器窗口宽度至少为\
  \ 700px，并且用户在设备上未启用 prefers-reduced-motion。\n\n### Prefers reduced motion\n\n用户可能希望退出运动密集的动画。他们可以通过在设备上启用设置来实现，这会通过\
  \ prefers-reduced-motion 属性传达给浏览器。我们需要确保尊重用户的设置，因此在确定是否对内容进行动画的查询中，我们将包含该设置未被设置的情况，即值为\
  \ no-preference。有关 prefers-reduced-motion 的更多信息，请查看第 3 章中关于可访问性和 reduced motion\
  \ 查询的部分。\n\n因此我们的媒体查询如下所示： @media (hover: hover) and (min-width: 700px) and (prefers-reduced-motion:\
  \ no-preference) { }。请注意，我们可以链接多个需要满足的参数，以便查询中的 CSS 被应用。\n\n为了隐藏除标题之外的所有内容，我们将使用\
  \ transform 属性将内容向下移动到卡片底部，值为 translateY()。TranslateY() 允许我们在不影响页面流的情况下垂直移动内容，这意味着被移动元素的周围内容完全不受移动影响，不会重新定位或让出位置。\n\
  \n为了计算元素需要移动的距离，我们将再次使用 calc() 函数。我们将标题向下移动卡片的高度 350px 减去 8rem（容器的顶部边距 + 容器的 padding-top\
  \ + 标题的大小）。\n\n因此卡片的内部部分被向下移动，如图 5.17 所示。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_149_0.png)\n\
  \nFigure 5.17 Moving the content down\n\n由于我们将在用户将悬停移离该部分时为显示内容设置动画，我们不希望底部剩余的内容保留，因为如果用户将悬停在溢出图片的内容上，内容会向上移动到图片中，失去悬停然后再次向下移动。这种行为会重复造成闪烁。因此我们将内部容器的高度设置为\
  \ 5rem，并在段落和链接被隐藏时隐藏溢出。\n\n请注意，在第二张卡片中，当内容应被隐藏时，段落内容仍会有一点可见。因此我们还将使用不透明度隐藏非标题内容，当它不应被看到时。此外，我们使用\
  \ translateY 将该内容向下移动 1rem，这将允许我们在悬停时将其重新动画化时给予一点运动。\n\n总的来说，用于隐藏内容并缩短内部容器的 CSS\
  \ 如下所示（Listing 5.15）。为了选择所有不是标题的内容，我们可以使用 :not() 伪类。\n\n### Listing 5.15 Hiding\
  \ the non header content\n\n```\n@media (hover: hover) and (min-width: 700px) and\
  \ (prefers-reduced-motion: no-preference) {\n    #A\n    main > section > div {\n\
  \        transform: translateY(calc(350px - 8rem));\n        height: 5rem;\n   \
  \     overflow: hidden;\n    }\n    main > section > div > *:not(h2) {\n       \
  \ opacity: 0;\n        transform: translateY(1rem);\n    }\n}\n```\n\n#A The media\
  \ query\n#B Moving and shortening the inner content container\n#C Hiding all of\
  \ the non H2 content\n\nnot() 伪类允许我们过滤选择器。在这种情况下，我们想要定位任何不是 h2 的元素。图 5.18 描述了该过程。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_150_0.png)\n\n### Figure 5.18 Selecting\
  \ anything that is not an h2 inside of the inner container\n\n现在内容被隐藏了（图 5.19），我们可以专注于再次显示它。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_151_0.png)\n\n### Figure 5.19 Hiding\
  \ content\n\n为了再次显示内容，我们需要在悬停和获得焦点时撤销我们为隐藏它所做的一切。由于我们没有从 DOM 中移除链接，它们只是视觉上被隐藏。程序上它们仍然存在，用户可以通过键盘\
  \ Tab 到链接。因此我们需要在用户悬停在卡片上时以及链接获得焦点时显示内容。因为我们想要在子元素（链接）获得焦点时对祖先（内容容器）执行操作，我们可以使用\
  \ :focus-within 伪类。该伪类允许我们根据元素的后代是否当前处于焦点来有条件地应用样式。\n\n因此，无论链接处于焦点还是部分被悬停，我们都通过将\
  \ translateY() 参数设置为 0（无垂直位移），并将内部容器的高度设置为 350px（外部容器的高度）减去 4rem（容器的垂直内边距和边距总和）来将容器移回原位。\n\
  \n我们还需要恢复不透明度被设置为 0 并且被向下移动 1rem 的段落和链接。\n\n最后，我们通过向正在显示和隐藏的元素添加 transition 来完成我们的悬停和\
  \ focus-within 效果。由于我们预定义了在它们之间更改的状态，并且我们只希望动画在更改发生时运行一次，我们不需要使用关键帧，我们可以简单地指示 CSS\
  \ 使用 transition 属性对发生时的所有更改进行动画处理，我们为其分配的值为 all 700ms ease-in-out。这将使所有更改都被动画化，动画完成需要\
  \ 700 毫秒，并且它会从慢开始，加速，然后在完成前减速。\n\n因此我们的悬停和 focus-within CSS 如下所示（Listing 5.16）。\n\
  \n### Listing 5.16 Showing content on hover and on focus-within\n\n```\n@media (hover:\
  \ hover) and (min-width: 700px) and (prefers-reduced-motion: no-preference) {\n\
  \  main > section > div {\n    transform: translateY(calc(350px - 8rem));\n    height:\
  \ 5rem;\n    overflow: hidden;\n    transition: all 700ms ease-in-out; #E\n  }\n\
  \n  div > *:not(h2) {\n    opacity: 0;\n    transform: translateY(1rem);\n    transition:\
  \ all 700ms ease-in-out; #E\n  }\n\n  section:hover div,      #A\n  section:focus-within\
  \ div {      #B\n    transform: translateY(0);\n    height: calc(350px - 4rem);\n\
  \  }\n\n  section:hover div > *:not(h2),      #C\n  section:focus-within div > *:not(h2){\
  \      #D\n    opacity: 1;\n    transform: translateY(0);\n  }\n}\n```\n\n#A on\
  \ section hover move container back into place\n\n#B on section focus-within move\
  \ container back into place\n\n#C on hover move all non h2 elements inside the container\
  \ back into place with full opacity\n\n#D on section focus-within move all non h2\
  \ elements inside the container back into place with full opacity\n\n#E Animating\
  \ the changes\n\n应用这些更改后（图 5.20），剩下的就是为我们的页面设置背景，我们的项目就完成了。\n\n### HOTELS\n\n![](img/b56145aa9b751926a7aedbd7172bc818_153_0.png)\n\
  \nFigure 5.20 Hover and focus-within effect\n\n为了让图片更突出，我们将为整个页面添加一个非常深的灰色几乎是黑色的背景，从而完成项目。\n\
  \n为了应用背景颜色，我们将 background 属性的值设置为 #010101 添加到我们现有的 body 规则中（Listing 5.17）。\n\n###\
  \ Listing 5.17 Adding the background\n\n```\nbody {\n  display: grid;\n  place-items:\
  \ center;\n  margin-top: 40px;\n  padding: 20px;\n  background: #010101;\n}\n```\n\
  \n图 5.21、5.22 和 5.23 显示了我们在不同屏幕尺寸下的最终项目。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_154_0.png)\n\
  \nFigure 5.21 Project at window width 600px\n\nFigure 5.22 Project at window width\
  \ 850px\n\nFigure 5.23 Project at window width 1310px with prefers-reduced-motion\
  \ enabled\n\n## 5.6 Summary\n\n- 我们使用 grid 属性作为水平布局卡片的方式。通过同时使用媒体查询和 grid-template-columns，我们根据最小浏览器窗口大小调整布局，如果最小宽度为\
  \ 950px 则为 4 列宽，如果在 700px 到 950px 之间则设置为 2 列，其他情况则默认为堆叠状态\n- `text-transform` 属性可以在不影响内容可访问性的情况下视觉上将文本更改为大写；复制内容时不会全部为大写\n\
  -  sparingly 使用 `text-transform: uppercase` 并且不要在大面积内容上使用\n- `background-clip` 属性的值为\
  \ text 可以将背景图像裁剪在文本周围\n- `background-clip` 属性仍需要前缀，并且该属性在实现过程中可能会发生变化\n- 我们可以使用媒体查询检查设备是否支持悬停，并调整布局以防止用户在设备不支持悬停时看到内容\n\
  - 我们可以使用 `and` 在同一个媒体查询上链接多个条件\n- 我们可以在媒体查询中使用 `prefers-reduced-motion` 来尊重用户对动画和运动的偏好。\n\
  - `:not()` 伪类表示与选择器列表不匹配的元素。\n- `translateY()` 会在不影响重排的情况下垂直移动内容\n- 我们可以使用 `transition`\
  \ 属性在状态之间对样式更改进行动画处理\n- 为了根据元素的后代是否处于焦点来有条件地应用样式，我们使用 `focus-within` 伪类\n\n\n\n\n"
- "## 6\n## 创建个人资料卡片\n## 本章涵盖\n- CSS 自定义属性\n- 使用 radial-gradient 创建背景\n- 设置图像大小\n\
  - 使用 flexbox 定位元素\n\n在本章中我们将创建一个个人资料卡片。在网页设计中，卡片是一种包含单一主题信息的视觉元素。我们将把这个概念应用于某人的个人资料信息，本质上创建了一张数字名片。这种布局在社交媒体或博客网站上经常可以看到，以便读者快速了解内容的作者。它有时会链接到详细的个人资料页面或与该个人资料所属人互动的机会。\n\
  \n到本章结束时，我们的个人资料卡片将如下所示（图 6.1）：\n\n![](img/b56145aa9b751926a7aedbd7172bc818_158_0.png)\n\
  \n图 6.1 最终输出\n\n要创建此布局，我们将围绕定位做大量工作，特别是利用 flexbox 来帮助我们对齐和居中元素。我们还将了解如何使矩形图像适应圆形而不失真。\n\
  \n让我们直接开始并查看我们的起始 HTML（列表 6.1），它可以在 github 仓库 https://github.com/michaelgearon/Tiny-CSS-Projects/tree/main/chapter-06\
  \ 中找到。\n\n我们有一个 class 为 card 的 div，其中包含个人资料卡片中展示的所有元素。为了设置我们的博客文章信息，我们使用描述列表。\n\n\
  > **描述列表**\n> 描述列表包含术语组，包括描述术语（dt）和任意数量的描述（dd）。描述列表通常用于词汇表或显示元数据。由于我们将术语（帖子、点赞和关注者）与其计数（数字）配对，因此使用描述列表是一个很好的用例。\n\
  \n我们的技术（CSS、HTML...）以列表形式呈现。\n\n### 列表 6.1 项目 HTML\n\n```\n<body>\n  <div class=\"\
  card\">  #A\n    <img class=\"portrait\" src=\"./img/portrait.jpg\" alt=\"\"> #B\n\
  \    <h1>Annabelle Erickson</h1> #C\n    <div class=\"title\">Software Developer</div>\
  \ #D\n    <dl>          #E\n      <div>        #E\n        <dt>Posts</dt>      #E\n\
  \        <dd>856</dd>       #E\n      </div>        #E\n      <div>        #E\n\
  \        <dt>Likes</dt>      #E\n        <dd>1358</dd>       #E\n      </div>  \
  \      #E\n      <div>        #E\n        <dt>Followers</dt>  #E\n        <dd>1257</dd>\
  \       #E\n      </div>        #E\n    </dl>          #E\n    <p class=\"summary\"\
  >      #F\n      I specialize in UX / UI design and development. I love coffee,\
  \ chocolate, and my\n      betta fish. #F\n    </p>      #F\n    <ul class=\"technologies\"\
  >    #G\n      <li>CSS</li>          #G\n      <li>HTML</li>         #G\n      <li>JavaScript</li>\
  \   #G\n      <li>Accessibility</li> #G\n    </ul>          #G\n    <div class=\"\
  actions\">      #H\n      <button type=\"button\" class=\"follow\">Follow</button>\
  \  #H\n      <a href=\"\" class=\"message\">Message</a>          #H\n    </div>\
  \          #H\n  </div> #I\n</body>\n```\n\n#A 卡片开始\n#B 个人资料图片\n#C 个人资料持有者姓名\n#D\
  \ 个人资料持有者职位\n#E 帖子信息\n#F 个人简介 / 关于\n#G 技术\n#H 操作\n\n当我们开始为卡片设置样式时，我们的页面如下所示（图 6.2）。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_160_0.png)\n\n图 6.2 起始点\n\n### 6.1 CSS\
  \ 自定义属性\n\n在我们的布局中，特别是当我们为个人资料图片和卡片顶部图片下方的彩色部分设置样式时，我们需要多次使用图像大小值进行计算。在像 JavaScript\
  \ 这样的其他语言中，当我们有一个需要多次引用的值时，我们使用变量。在 CSS 中我们有自定义属性，有时也称为 CSS 变量。\n\n要创建自定义属性，我们将变量名以\
  \ 2 个破折号（--）为前缀，紧跟变量名。我们以与任何其他属性相同的方式分配值，使用冒号（:）后跟值。因此 CSS 变量声明看起来如下：`--myVariableName:\
  \ myValue;`\n\n像任何其他声明一样，我们需要在规则内部定义我们的变量。对于我们的项目，我们将定义颜色和图像大小并在 body 规则中声明它们，如列表\
  \ 6.2 所示。由于我们在 body 上定义了变量，body 元素及其所有后代都将访问这些变量。\n\n请注意，我们可以为变量分配不同类型的值。我们分配颜色，例如在我们的\
  \ --primary 变量中（可能是 CSS 自定义属性最常见的用途），但我们也定义了大小（--imageSize）、字体族和渐变（--page-background）。\n\
  \n要引用变量并将其用作声明的一部分，我们使用以下语法：`var(--variableName)`，因此例如要分配我们的文本颜色，将声明：`color: var(--text-color);`\n\
  \n### 列表 6.2 定义 CSS 自定义属性\n\n```\nbody {\n  --primary: #de3c4b; #A\n  --primary-contrast:\
  \ white;\n  --secondary: #717777; #B\n  --font: Helvetica, Arial, sans-serif;\n\
  \  --text-color: #2D3142; #C\n  --card-background: white;\n  --page-background:\
  \ linear-gradient(#4F5D75, #2D3142);\n  --imageSize: 200px;\n\n  background: var(--page-background);\n\
  \  font-family: var(--font);\n  color: var(--text-color);\n}\n```\n\n#A 深鲑鱼色\n#B\
  \ 灰色\n#C 深蓝灰色\n\n注意：线性渐变 我们的线性渐变将从上到下淡化，从深蓝色渐变为非常深的蓝色。有关线性渐变的更深入解释，请查看第 3 章第 3.7.2\
  \ 节。\n\n在应用了背景和字体颜色及族之后（图 6.3），我们注意到我们的背景在页面底部重复。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_161_0.png)\n\
  \n图 6.3 为 body 添加背景\n\n### 6.2 全高背景\n\n线性渐变是一种图像类型。当我们在 CSS 中将图像作为元素的背景应用时，如果图像小于元素，图像将重复或平铺。在这种特定情况下，我们不希望图像重复。\n\
  \n我们有 2 种方法可以修复这个问题：\n\n- 我们可以告诉背景我们不希望它重复，使用 `background-repeat: no-repeat;` 然而由于我们的\
  \ body 元素仅与内容一样高，如果窗口比内容更高，我们将在页面底部留下不雅观的白色条，这并不理想。\n- 我们的第二个选项（我们将使用的）是使 html 和\
  \ body 都占据屏幕的完整高度，而不是让其根据内部内容调整大小。\n\n因此我们将列表 6.3 中的规则添加到我们的样式表中。\n\n我们将 margin\
  \ 和 padding 重置为 0，因为我们希望确保在窗口内边缘到边缘。\n\n要设置高度，我们实际上使用 `min-height`，因为如果内容长度大于窗口高度，我们仍然希望用户能够访问内容并且背景在其后面。通过使用\
  \ `min-height`，我们指示浏览器使 `body` 和 `html` 元素至少与窗口一样高。如果内容会迫使元素更高，则浏览器将使用内容的高度。\n\n\
  我们为 `min-height` 设置的值是 `100vh`。视口高度（vh）是一个基于视口本身高度的单位。它基于百分比，因此将 `100vh` 分配给 `min-height`\
  \ 意味着我们希望元素至少具有等于视口高度 100% 的高度。\n\n### 列表 6.3 使背景全高\n\n```\nhtml, body {\n  margin:\
  \ 0;\n  padding: 0;\n  min-height: 100vh;\n}\n```\n\n现在我们已经设置了背景（图 6.4），让我们为卡片设置样式。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_163_0.png)\n\n图 6.4 全屏渐变背景\n\n### 6.3\
  \ 使用 flexbox 设置卡片样式并居中\n\n让我们从为卡片本身设置样式开始。我们将为其提供白色背景和阴影，以为我们的布局增添深度。请注意，我们没有使用颜色值作为背景，而是使用我们的背景变量。\n\
  \n我们还将把卡片的宽度设置为 75vw。视口宽度（vw）是我们在前面使用的视口高度（vh）单位的水平对应物。它也是基于百分比的，因此将我们的宽度设置为 75vw\
  \ 意味着将卡片的宽度设置为浏览器窗口总宽度的 75%。\n\n然后我们将进一步将卡片的宽度限制为最大 500 像素宽。通过同时使用 width 和 max-width\
  \ 属性，我们允许卡片在屏幕较窄时缩小，但在较大屏幕上限制卡片变得过于宽大。\n\n最后我们使用 border radius 弯曲卡片的角落以软化设计。列表 6.4\
  \ 显示了我们的卡片规则。\n\n### 列表 6.4 设置卡片样式\n\n```\n.card {\n  background-color: var(--card-background);\n\
  \  box-shadow: 0px 0px 55px rgba(38, 40, 45, .75);\n  width: 75vw;\n  max-width:\
  \ 500px;\n  border-radius: 4px;\n}\n```\n\n\n\n\n\nFigure 6.5 shows the styles applied\
  \ to our project. With some basic styles added to the card (we will add to these\
  \ a little bit further into the chapter), let's place the card in the middle (both\
  \ vertical and horizontal) of the screen.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_164_0.png)\n\
  \nFigure 6.5 Starting to style the card\n\n## 6.3.1 Using flexbox to center elements\n\
  \nTo center the card in the exact middle of the screen we are going to use flexbox.\
  \ Flexbox allows us to place elements across a single axis either vertically or\
  \ horizontally.\n\nThe `display` property with a value of `flex` is used to dictate\
  \ that elements should be placed on the screen using flexbox. The declaration is\
  \ set on the parent of the elements that will be flexed.\n\nIn our project the element\
  \ being positioned is the card, its parent is the `body` tag, therefore we will\
  \ add the `display: flex` declaration to our `body` rule.\n\nWe then define how\
  \ we want the elements within the `body` to behave. In our case we have 1 child\
  \ (the card) and we want it centered. To center the card horizontally we add a `justify-content:\
  \ center` declaration to the body rule. This property allows us to dictate how elements\
  \ are distributed across our axis. Figure 6.6 breaks down the options available\
  \ to us.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_165_0.png)\n\nFigure 6.6 justify-content\
  \ property values\n\nWe also want to center the card vertically. For the vertical\
  \ positioning we will use align-items: center. The align-items property gives us\
  \ the ability to dictate how elements should be positioned relative to one another\
  \ and to the container as seen in Figure 6.7.\n\n### align-items\ncontainer\nchildren\n\
  \n### Stretch (default)\n\n### flex-start\n\n### flex-end\n\n### baseline\n\n###\
  \ center\n\nFigure 6.7 align-items property values\n\nListing 6.5 shows our updated\
  \ body rule. Remember the parent of the element being positioned is the one on which\
  \ we apply flexbox related declarations.\n\n### Listing 6.4 Centering the card\n\
  \n```\nbody {\n    ...\n    display: flex;\n    justify-content: center; #A\n  \
  \  align-items: center; #B\n}\n```\n\n#A centers the card horizontally\n\n#B centers\
  \ the card vertically\n\nNow that our card is centered (Figure 6.8), let’s focus\
  \ on the contents of the card starting with the profile picture.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_167_0.png)\n\
  \nFigure 6.8 Centered card\n\n## 6.4 Styling and positioning the profile picture\n\
  \nWe currently have a rectangular image. We want to make the image circular. We\
  \ also want to center it in the card and have it stick out the top of the card a\
  \ little bit.\n\nLet’s start by making it into a circle.\n\n### 6.4.1 Object-fit\n\
  \nA circle’s height is equal to its width so as we can see in Figure 6.9, if we\
  \ set the height and width of the picture to equal our image size variable, the\
  \ picture will distort.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_168_0.png)\n\
  \nFigure 6.9 Distorted profile picture\n\nTo prevent the image from distorting we\
  \ must also dictate how the image behaves in relation to the size it is given. To\
  \ do this we will use the object-fit property. By setting the object-fit’s value\
  \ to cover, we instruct the image to maintain its initial aspect ratio but fit itself\
  \ to fill the space available. In our case this means that we will lose a little\
  \ bit of the top and bottom of the image due to the image being taller than it is\
  \ wide.\n\nBy default when using object-fit, the image will be centered and if some\
  \ of the image is clipped, it will be the edges, which works great for our current\
  \ use case and picture. However if we wanted to adjust the position of the image\
  \ within its allotted size and clip only from the bottom, for example, we would\
  \ also add an object-position declaration.\n\nTo make our image a 200px wide circle\
  \ we use the CSS seen in Listing 6.5. Remember that we set the image size as a CSS\
  \ custom property in the body, so set the width and height of the image equal to\
  \ the --imageSize variable. We add the object-fit declaration to prevent the image\
  \ from distorting and finally we give it a 50% border-radius to make it a circle.\n\
  \n### Listing 6.5 Centering the card\n\n```\nbody {\n  ...\n  --imageSize: 200px;\n\
  }\n\nimg {\n  width: var(--imageSize);\n  height: var(--imageSize);\n  object-fit:\
  \ cover;  #A\n  border-radius: 50%;  #B\n}\n```\n\n#A Prevents the distortion\n\
  #B Makes the image a circle\n\nOur image now looks as seen in Figure 6.10.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_169_0.png)\n\
  \nFigure 6.10 Circle profile picture\n\nNow we need to position our picture.\n\n\
  ### 6.4.2 Negative margins\n\nTo position our image to stick out above the card\
  \ we are going to use a negative margin. To move an element down and away from content\
  \ above it, we can add a positive margin-top value to the element. However if we\
  \ add a negative margin, instead of the element being pushed down, it will be pulled\
  \ upwards. We are going to leverage this in conjunction with text centering to position\
  \ the image.\n\nLooking back at the final design Figure 6.11, we notice that all\
  \ of the text is centered.\n\nFigure 6.11 Final design\n\nSince all of the text\
  \ is centered, let’s add a text-align: center declaration to the card rule. Images\
  \ by default are inline elements, so we notice that by centering the text, the image\
  \ also gets centered (Figure 6.12).\n\n![](img/b56145aa9b751926a7aedbd7172bc818_170_0.png)\n\
  \nFigure 6.12 Centered text\n\nNow all that is left is to add the negative top margin\
  \ to move the image upward. We want ⅓ of the image to stick out from the top. We\
  \ will therefore use the calc() function to do the math for us. Our function looks\
  \ as follows: calc(-1 * var(--imageSize) / 3); We divide\n\nthe image size by 3\
  \ to get ⅓ of the height of the image and then multiply by -1 to make it negative.\
  \ Our margin will therefore make ⅓ of the image stick out from the top of the card\
  \ as seen in Figure 6.13.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_171_0.png)\n\
  \nFigure 6.13 Positioned Image\n\nThe last thing we need to do is give our card\
  \ itself some margin. Due to the negative margin we added to the image, if we have\
  \ a very short screen (Figure 6.14) we see that the top of the image disappears\
  \ off screen.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_171_1.png)\n\nFigure 6.14\
  \ Clipping off the top of the image when window height is small\n\nTo prevent cutting\
  \ off part of the picture when the window is not very tall, we want to add some\
  \ vertical margin to the card itself greater than or equal to the amount of the\
  \ picture that is sticking out of the card.\n\nTo calculate the amount sticking\
  \ out we used calc(-1 * var(--imageSize) / 3);. For our card margin we are going\
  \ to use a similar concept. We are going to take ⅓ of the image\n\n```\ncalc(-1\
  \ * var(--imageSize) / 3)\n```\n\nheight and then add 24 pixels to move the card\
  \ and image away from the edge. Our final function will be: `calc(var(--imageSize)\
  \ / 3 + 24px)`.\n\n### Listing 6.6 Positioning the Image\n\n```\n.card {\n  ...\n\
  \  text-align: center;\n  margin: calc(var(--imageSize) / 3 + 24px) 24px; #A\n}\n\
  \nimg {\n  width: var(--imageSize);\n  height: var(--imageSize);\n  object-fit:\
  \ cover;\n  border-radius: 50%;\n  margin-top: calc(-1 * var(--imageSize) / 3);\
  \ #B\n}\n```\n\n#A Vertical margin of ⅓ image size + 24px and horizontal of 24px\n\
  \n#B Negative top margin to make the image stick out of the card\n\nWith our image\
  \ positioned and margins added so that the top of the image does not get cut off\
  \ on small screens (Figure 6.15), let’s turn our attention to the curved red background\
  \ under the picture.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_172_0.png)\n\n\
  Figure 6.15 Added card margin\n\n## 6.5 Background size and positioning\n\nTo create\
  \ the background behind the image we are going to follow the steps diagrammed in\
  \ Figure 6.16.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_173_0.png)\n\n![](img/b56145aa9b751926a7aedbd7172bc818_173_1.png)\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_173_2.png)\n\n![](img/b56145aa9b751926a7aedbd7172bc818_173_3.png)\n\
  \nFigure 6.16 Creating the image background\n\nFirst, we add a background-image\
  \ consisting of a radial-gradient.\n\nNOTE: COMBINING BACKGROUND COLOR AND IMAGE\
  \ We can add both a background color and a background image to the same element.\
  \ We assign the color to the background-color property and the image to the background-image\
  \ property. Or we can apply both in the background shorthand property as follows:\
  \ background: white url(path-to-image);\n\nThe radial gradient takes an ending shape\
  \ (circle or ellipse) and then where we want each color to start and stop to form\
  \ the gradient. We define ours as radial-gradient(circle, var(--primary) 50%, transparent\
  \ 50%, transparent). Our primary color is a dark salmon so our gradient will create\
  \ a circle that up until it reaches 50% of its container will be dark salmon. At\
  \ 50% of the container size it immediately shifts the color to transparent. Since\
  \ it's an immediate shift in color there is no fade, so we get a nice clean circle.\n\
  \nBy default, radial gradients emanate from the center of their container. In step\
  \ 2 we add circle at top to the beginning of our radial-gradient function to shift\
  \ the origin of the circle from the center of the background to the top. Our updated\
  \ radial-gradient function\n\n\n因此现在看起来如下：radial-gradient(circle at top, var(--primary)\
  \ 50%, transparent 50%, transparent);\n\n接下来我们想要将圆向上移动，使圆的底部刚好位于图像下方。第 3 步向我们展示，如果我们将背景向上移动\
  \ -150 像素，并且我们的卡片相当短（我们的个人资料没有太多内容），我们将在圆与卡片边缘之间在顶部两个角落产生间隙，而我们不希望出现这种情况。为了防止这种情况发生，我们将使背景图像比最大卡片尺寸宽\
  \ 3 倍（3×500 =1500）。\n\nNOTE: NEGATIVE BACKGROUND POSITION 与图像不同，通过添加负边距，可见部分会超出卡片，而负背景位置不会使溢出的图像部分可见。来自过大背景或更改定位的额外图像内容将简单地被隐藏。\n\
  \n当我们使用渐变创建 background-image 时，产生的背景图像会随着容器一起伸缩，因此我们也将为背景设置一个固定的高度，这样无论卡片中有多少内容，我们的背景形状都是可预测的。\n\
  \n更改背景尺寸后，我们还增加向上移动背景的距离，使其恰好在个人资料图像下方紧密结束\n\n最后，如本章前面提到的，背景图像默认会重复。通过向上移动图像，我们为背景平铺留出了空间。我们只想要一个半圆，因此我们将\
  \ background-repeat 设置为 no-repeat。\n\n全部组合起来，我们的卡片背景定义如下（列表 6.7）：\n\n## Listing\
  \ 6.7 Positioning the Image\n\n```\n.card {\n  background-color: var(--card-background);\n\
  \  ...\n  background-image: radial-gradient(circle at top, var(--primary) 50%, transparent\
  \ 50%,\n    transparent); #A\n  background-size: 1500px 500px; #B\n  background-position:\
  \ center -300px; #C\n  background-repeat: no-repeat; #D\n}\n```\n\n#A 创建一个半圆，其平坦的一侧是卡片顶部\n\
  #B 将背景图像的尺寸设置为宽 1500px 高 500px\n#C 将背景水平居中并从卡片上方开始 300px\n#D 防止背景平铺\n\n图 6.17 显示了添加到卡片的背景。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_175_0.png)\n\nFigure 6.17 Finished background\
  \ image\n\n随着卡片顶部开始看起来不错，让我们关注其余内容。\n\n## 6.6 Styling the content\n\n我们的卡片目前没有任何内边距，这意味着如果我们的名字更长，它可能会在卡片上边缘到边缘地接触。由于在大多数情况下，卡片是我们将作为组件或模板创建以在多个用户之间重复使用，让我们添加一些左右内边距以确保我们的文本不会进入卡片边缘。我们还将添加一些底部内边距以将链接和底部与卡片底部边缘移开。\n\
  \n列表 6.8 显示了我们更新的卡片规则，图 6.18 显示了新的输出。我们使用简写属性定义了 3 个值。它说明顶部内边距为 0，左右为 24px，底部为 24px。我们特意不为顶部添加内边距，因为它会将图像向下推，并且我们必须重新调整图像定位。\n\
  \n## Listing 6.8 Added padding to the card\n\n```\n.card {\n  ...\n  padding: 0\
  \ 24px 24px;\n}\n```\n\n![](img/b56145aa9b751926a7aedbd7172bc818_176_0.png)\n\n\
  Figure 6.18 Added card padding\n\n### 6.6.1 Styling the name and job title\n\n向下浏览卡片，我们的第一个内容是名字。作为\
  \ h1，它有一些浏览器提供的默认样式，其中包括边距。我们将编辑边距以增加标题与图像之间的空间，并在底部移除边距，以便职位标题可以直接位于姓名下方。我们还将颜色更改为鲑鱼色并将字体大小设置为\
  \ 2rem。\n\n> **Rem Unit**\n> Rem 是一个基于根元素字体大小的相对单位，在我们的例子中是 HTML。对于大多数浏览器，默认值是 16px。我们在项目中没有为\
  \ HTML 元素设置字体大小，因此当我们将 h1 font-size 设置为 2rem 时，输出大小将为 32px。\n> \n> 使用相对字体大小的好处是可访问性。它有助于确保文本可以根据用户设置或设备优雅地缩放。\n\
  \n对于职位标题，我们将增加大小和粗细，并更改字体颜色以使用我们的 secondary 颜色，即灰色。\n\n列表 6.9 显示了我们的新规则，图 6.19 显示了我们的输出。\n\
  \n## Listing 6.9 Styling the name\n\n```\nh1 {\n  font-size: 2rem;      #A\n  margin:\
  \ 36px 0 0;      #A\n  color: var(--primary); #A\n}\n\n.title {\n  font-size: 1.25rem;\
  \    #B\n  font-weight: bold;     #B\n  color: var(--secondary); #B\n}\n```\n\n\
  #A 姓名的样式\n#B 职位标题的样式\n\n![](img/b56145aa9b751926a7aedbd7172bc818_177_0.png)\n\n\
  Figure 6.19 Styled Name and Job title\n\n接下来我们将对帖子、点赞和关注者信息进行样式设置。\n\n### 6.6.2\
  \ Space-around and gap\n\n在我们的 HTML 中，描述列表（dl）包含帖子、点赞和关注者计数（列表 6.10）。每个分组都包含在 div\
  \ 中，因此我们将为定义列表应用 display 值 flex 以水平对齐所有三个组。然后我们将 justify-content 属性设置为 space-around\
  \ 以在卡片上展开它们。\n\n## Listing 6.10 Description list HTML\n\n```\n<dl>\n  <div>\n  \
  \  <dt>Posts</dt>\n    <dd>856</dd>\n  </div>\n  <div>\n    <dt>Likes</dt>\n   \
  \ <dd>1358</dd>\n  </div>\n  <div>\n    <dt>Followers</dt>\n    <dd>1257</dd>\n\
  \  </div>\n</dl>\n```\n\nspace-around 值通过为每个元素之间提供相等量的空间，并在两端各提供一半的空间来在我们的轴上均匀分布元素。图\
  \ 6.20 显示了间距如何应用的图表。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_178_0.png)\n\n\
  Figure 6.20 space-around property\n\n列表 6.11 显示了我们对描述列表的样式。请注意我们还包含了 gap: 12px 声明。这确保了我们元素之间的最小空间为\
  \ 12 像素。我们本可以给描述列表内部的 divs 一个 margin；然而，那些也会影响外部边缘。Gap 仅影响元素之间的空间。\n\n## Listing\
  \ 6.11 Styling the name\n\n```\ndl {\n  display: flex;\n  justify-content: space-around;\n\
  \  gap: 12px;\n}\n```\n\n如图 6.21 所见，我们的个人资料统计信息现在在行中并在卡片上均匀分布。\n\nFigure 6.21 Aligned\
  \ profile stats\n\n然而，数字是偏移的。这来自于描述，其中有一些来自浏览器默认值的边距。让我们去掉这些并使用列表 6.12 中的 CSS 将文本样式设置为粗体、更大、鲑鱼色。\n\
  \n## Listing 6.12 description details rule\n\n```\ndd {\n  margin: 0;\n  font-size:\
  \ 1.25rem;\n  font-weight: bold;\n  color: var(--primary);\n}\n```\n\n移除边距后（图 6.22）我们注意到点赞并没有完全居中到我们卡片的中间。\n\
  \nFigure 6.22 Description list alignment\n\n点赞没有居中在卡片中间的原因是因为三个元素都没有完全相同的宽度。当元素被分布时，浏览器会计算每个元素所需的总空间，然后重新分配剩余空间。因此，由于包含关注者的\
  \ div 比包含帖子的 div 更大，点赞不会落在中间。\n\n### 6.6.3 Flex-basis and flex-shrink\n\n为了使点赞居中，我们将为三个\
  \ div 分配相同的宽度。然而，与使用 width 属性不同，我们将使用 flex-basis 并将其值设置为 33%。flex-basis 设置浏览器在计算元素所需空间时应使用的初始大小。我们还将\
  \ flex-shrink 设置为 1。\n\nflex-shrink 规定元素是否允许缩小到小于 flex-basis 值分配的大小，如果容器中没有足够的空间容纳元素。如果\
  \ flex-shrink 值为 0，则大小不调整；任何正值都允许调整大小。\n\n我们将 flex-basis 设置为 33%，但请记住：我们还设置了元素之间的\
  \ 12 像素间隙。因此，一旦考虑间隙，我们设置的 flex-basis 大小对于容器来说就太宽了。通过允许元素收缩，我们告诉浏览器以每个 div 占用容器宽度的\
  \ 33% 开始其定位计算，并将它们均匀收缩以适应可用空间。这避免了我们必须计算 divs 应该有多宽才能仍然大小相等。\n\n因此，要编写我们的规则（列表 6.13），我们使用子组合符（>）定位定义列表（dl）的直接子\
  \ div 并应用 flex-basis 和 flex-shrink 声明。\n\n## Listing 6.13 Centering the likes\n\n\
  ```\ndl > div {\n  flex-basis: 33%;\n  flex-shrink: 1;\n}\n```\n\n随着我们的点赞居中（图 6.23），让我们把注意力转向定义术语（dt）。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_180_0.png)\n\n\n\n\n\n## 6.6.4 Flex-direction\n\
  \n在我们的原始设计中，描述详情（数字）在描述术语之上。为了在视觉上将其翻转，我们将使用 `flex-direction` 属性。我们断言 flexbox 可以在单一轴上放置元素。到目前为止，我们的工作都是在水平或\
  \ x 轴上进行。\n\n为了使详情位于术语之上，我们将使用 flexbox 在垂直或 y 轴上操作。要更改 flexbox 操作的轴，我们使用 `flex-direction`\
  \ 属性。默认情况下其值为 `row`，这使得 flexbox 在 x 轴上操作。通过将值更改为 `column`，我们使其在 y 轴上操作。\n\n此外，`flex-direction`\
  \ 属性还允许我们规定元素的排序方式。将值设置为 `column-reverse` 会告诉浏览器我们要在 y 轴上操作，并且希望元素按反向 HTML 顺序放置，使描述详情（`dd`）首先出现，描述术语（`dt`）其次。\n\
  \n与之前一样，我们希望在父元素上设置行为，在本例中为 `div`。因此我们将按清单 6.14 所示添加到之前创建的 `div` 规则中以重新排序元素。我们还减小了描述术语（`dt`）的大小以强调数字而非其术语。\n\
  \n```\nListing 6.14 Reversing content order\n\ndl > div {\n  flex-basis: 33%;\n\
  \  flex-shrink: 1;\n  display: flex;\n  flex-direction: column-reverse;\n}\ndt {\
  \ font-size: .75rem; }\n```\n\n> NOTE: CONTENT ORDER 出于可访问性原因，我们希望确保我们编写 HTML 的顺序与屏幕上显示的顺序一致。一个让计算机朗读页面内容以便用户在视觉上跟随的用户，如果被朗读的内容与他们看到的内容不匹配，就会很容易感到迷失或困惑。因此在使用\
  \ `flex-direction` 等属性重新排序内容时必须谨慎。\n\n图 6.24 显示了我们样式化的描述列表（`dl`）。\n\nFigure 6.24\
  \ Styled description List\n\n继续向下浏览卡片，让我们将注意力转向个人资料统计数据下方的摘要段落。\n\n## 6.6.5 Styling\
  \ the paragraph\n\n段落看起来已经相当不错了。我们要做的唯一一件事就是为其添加一些垂直边距以留出呼吸空间，并增加行高以提高可读性，如清单 6.15\
  \ 所示。\n\n请注意行高没有单位。通过不设置单位，我们允许行高随字体大小缩放。如果我们将其设置为例如 12 像素的值，行高将始终保持 12 像素，而不管字体大小如何。因此如果字体大小被大幅增加，我们的字母会在垂直方向上重叠。最安全的做法始终是不声明单位。\n\
  \n### Listing 6.15 Paragraph rule\n\n```\np.summary {\n  margin: 24px 0;\n  line-height:\
  \ 1.5;\n}\n```\n\n在处理完段落（图 6.25）后，让我们来样式化技术列表。\n\nFigure 6.25 Styled summary paragraph\n\
  \n## 6.6.6 Flex-wrap\n\n我们要做的第一件事是样式化列表元素本身。我们将使用有时被称为药丸或芯片的设计模式，其中元素具有背景颜色和圆角。我们的\
  \ CSS 将如清单 6.16 所示。我们还包含了一些内边距以防止文本紧贴芯片边缘。\n\n### Listing 6.16 Styling the list\
  \ elements\n\n```\nul.technologies li {\n  padding: 12px 24px;\n  border-radius:\
  \ 24px;\n  background: #ffdadd;\n}\n```\n\n在对单个元素进行样式化（图 6.26）后，我们现在可以专注于列表的布局。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_183_0.png)\n\nFigure 6.26 Styled List\
  \ Items\n\n我们要做的第一件事是使用 list-style: none 移除项目符号。然后我们将移除所有内边距并将边距设置为垂直 24px、水平 0。\n\
  \n为了定位项目，我们将使用 flexbox，添加 12px 的间距并将 justify-content 属性值设置为 space-between。space-between\
  \ 与 space-around 非常相似，只是它不会在容器的开头和结尾添加空间，如图 6.27 所示。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_183_1.png)\n\
  \nFigure 6.27 space-around versus space-between\n\n我们用于布局芯片的规则如下所示（清单 6.17）：\n\n\
  ### Listing 6.17 Styling the list of technologies\n\n```\nul.technologies {\n  list-style:\
  \ none;\n  padding: 0;\n  margin: 24px 0;\n  display: flex;\n  justify-content:\
  \ space-between;\n  gap: 12px;\n}\n```\n\n然而，我们注意到当我们减小屏幕宽度时（图 6.28），我们的最后一个芯片会超出卡片范围。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_184_0.png)\n\nFigure 6.28 Chip extending\
  \ beyond width of the card\n\n在窄屏幕上，我们的列表比卡片更宽。为了防止内容溢出卡片，我们可以使用 flex-wrap 属性。\n\
  \n默认情况下，弹性项目将显示在一行中，即使容器太小，就像我们技术列表所经历的那样。为了在空间用完时强制最后一个元素换到新行，我们可以将 flex-wrap 属性设置为\
  \ wrap。这将告诉浏览器在空间用完时在下方开始新的一行项目。\n\n与 flex-direction 类似，flex-wrap 也可以更改元素的显示顺序，但在这里我们不需要更改它。更新后的规则如清单\
  \ 6.18 所示。\n\n### Listing 6.18 Adding flex-wrap\n\n```\nul.technologies {\n  list-style:\
  \ none;\n  padding: 0;\n  margin: 24px 0;\n  display: flex;\n  justify-content:\
  \ space-between;\n  gap: 12px;\n  flex-wrap: wrap;\n}\n```\n\n请注意图 6.29 中 CSS 和\
  \ Accessibility 芯片之间的间隙，即使我们的列表元素没有任何边距。我们的列表 gap 属性值为 12px，这意味着它不仅会确保项目之间水平至少有\
  \ 12 像素，在换行时它还会在这两者之间垂直添加 12 像素的间隙。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_185_0.png)\n\
  \nFigure 6.29 Wrapping the chips on narrow screens\n\n## 6.6.7 Styling the actions\n\
  \n我们在个人资料卡中需要样式化的最后一件事是用户在卡片底部可以采取的 2 个操作：向个人资料所有者发送消息或关注。\n\n尽管它们在语义上不同，一个是链接，另一个是按钮，但我们将把它们都样式化为看起来像按钮的样子。让我们从一些将应用于两个元素的基本来开始。我们创建一个包含两个元素选择器的规则，以确保两种元素类型在视觉上保持一致。然后我们为它们不同的地方创建单独的规则。\n\
  \n我们还创建了一个 focus-visible 规则，该规则将应用于使用通用选择器 (*) 和伪类 :focus-visible 的所有元素，以便当用户通过键盘导航到我们的链接和按钮时，他们会看到元素周围的虚线轮廓，并且可以清楚地看到他们即将选择的内容。\n\
  \n### Listing 6.18 Adding flex-wrap\n\n```\n.actions a, .actions button {\n  padding:\
  \ 12px 24px;\n  border-radius: 4px;\n  text-decoration: none; #B\n  border: solid\
  \ 1px var(--primary);\n  font-size: 1rem;\n  cursor: pointer;\n}\n\n.follow {\n\
  \  background: var(--primary);\n  color: var(--primary-contrast);\n}\n\n.message\
  \ {\n  background: var(--primary-contrast);\n  color: var(--primary);\n}\n\n*:focus-visible\
  \ {\n  outline: dotted 1px var(--primary);\n  outline-offset: 3px;\n}\n```\n\n#A\
  \ applies to both the link and the button\n#B removes the underline\n\n图 6.30 显示了我们样式化的链接和按钮。然而，由于它们靠得很近，我们将想要在两个按钮之间添加一些空间。\n\
  \n![](img/b56145aa9b751926a7aedbd7172bc818_186_0.png)\n\nFigure 6.30 Styled actions\n\
  \n我们希望保持链接和按钮居中，但同时在它们之间添加一些空间。让我们最后一次使用 flex 和 gap 来定位我们的操作元素。\n\n我们将为列表赋予 display\
  \ 属性值为 flex 并添加 16px 的间距。为了保持两个元素居中，我们将使用 justify-content 属性并赋值为 center。最后，我们将通过给列表\
  \ margin-top 值 36 像素来在技术列表和操作之间添加一些空间，如清单 6.19 所示。\n\n\n\n\n\n# Listing 6.19 Positioning\
  \ the link and button\n\n```\n.actions {\n  display: flex;\n  gap: 16px;\n  justify-content:\
  \ center;\n  margin-top: 36px;\n}\n```\n\n通过这条最后的规则，我们已经完成了个人资料卡的样式设计。最终成品如图 6.31\
  \ 所示。\n\n![](img/b56145aa9b751926a7aedbd7172bc818_187_0.png)\n\nFigure 6.31 Finished\
  \ Profile Card\n\n## 6.7 Summary\n\n- CSS custom properties allow us to set variables\
  \ that can be reused throughout our CSS\n- Flexbox allows us to position elements\
  \ on a single axis either horizontally or vertically\n- `flex-direction` sets which\
  \ axis flexbox will operate on\n- Both `flex-direction` and `flex-wrap` can alter\
  \ the order in which the elements are displayed\n- The `align-items` property sets\
  \ how the elements are aligned on the axis relative to one another\n- The `justify-content`\
  \ property dictates how the elements positioned and leftover space will be distributed\
  \ within the element to which it is applied.\n- `flex-basis` sets a starting element\
  \ size for the browser to use when laying out flexed content\n- `flex-shrink` dictates\
  \ whether and how content can shrink when an element is being flexed\n- We can prevent\
  \ images from distorting when using fixed heights and widths that do not match the\
  \ image’s aspect ratio by using the `object-fit` property\n\n## 7"
- "\n## Harnessing the full power of float\n\n### This chapter covers\n\n- Creating\
  \ a drop cap using float\n- Using float to wrap text around the image\n- Using CSS\
  \ shapes to make the text follow the floated image's shape\n\nGrid and flexbox have\
  \ given us the ability to create layouts that were previously incredibly difficult\
  \ if not impossible to realize, one of the most common examples would be a three\
  \ column layout with all three columns the same height regardless of the contents\
  \ within. Another layout technique, which unlike its grid and flexbox counterparts\
  \ has been around for quite some time, is float. Part of the CSS Logical Properties\
  \ and Values Level 1 Module, float is purpose built to allow other content to wrap\
  \ around the element being floated and as result really shines at manipulating images\
  \ inside of text and at creating drop caps.\n\nDrop caps are a way to style and\
  \ add emphasis to text. They consist of creating a larger [sometimes more ornate]\
  \ capital letter which is usually found at the beginning of a page or paragraph.\
  \ These were often seen in the illuminated manuscripts of the middle ages. The F\
  \ at the beginning of the paragraph in Figure 7.1 is an example of a drop cap found\
  \ in the Carmina Burana manuscript. Later, with the advent of the printing press,\
  \ the concept was carried over into print with specialized glyphs and plates being\
  \ created, or by simply using a larger font size. The practice is much more seldom\
  \ seen on the web but by no means impossible and a great way to make our typography\
  \ more interesting.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_190_0.png)\n\nFigure\
  \ 7.1 The Wheel of Fortune illustration from the Carmina Burana manuscript¹\n\n\
  Another way to make content more visually striking is to style our images to fit\
  \ nicely in the text. When we add images to content we often add our image tag,\
  \ maybe some margin, and often don’t think about it much more than that. Using CSS\
  \ shapes in conjunction with float, we can make our text wrap the actual shape of\
  \ what is being displayed in the image to create a much more striking effect. We\
  \ can flow text around virtually any shape we create, even curves.\n\nIn this chapter,\
  \ we will be taking a close look at our typography and images to make our content\
  \ more visually interesting while making sure we keep our content accessible. We\
  \ will\n\n1 \"File:Wheel-of-fortune-carmina-burana.jpg\" Wikimedia Commons, 1220\
  \ https://commons.wikimedia.org/wiki/File:Wheel-of-fortune-carmina-burana.jpg. Accessed\
  \ 25 March 2022.\n\nstart with an unstyled excerpt of \"The Call of the Wild\" by\
  \ Jack London². We will use float to add a drop cap to our first paragraph. Then,\
  \ we will wrap our text around our images following the content of said images.\
  \ We will do this for both a raster and a vector image.\n\n### RASTER VS VECTOR\n\
  \nA raster image is created using a grid of pixels while a vector image is drawn\
  \ using mathematical formulas. For more in depth information about the difference\
  \ between raster and vectors checkout Section 1 of Chapter 3: \"SVG and graphics\"\
  \n\nFigure 7.2 shows the starting point and the finished product.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_191_0.png)\n\
  \nFigure 7.2 The Starting Point and Finished Product\n\n² London, Jack. \"The Project\
  \ Gutenberg EBook of The Call of the Wild, by Jack London.\" Project Gutenberg https://www.gutenberg.org/files/215/215-h/215-h.htm.\
  \ Accessed 25 3 2021.\n\nListings 7.1 and 7.2 include our starting CSS and HTML\
  \ for our page that we build upon in this chapter. To follow along as we style the\
  \ page you can download the starting HTML and CSS from the github repo at: https://github.com/michaelgearon/Tiny-CSS-Projects/tree/main/chapter-07.\n\
  \nOur HTML consists of a main tag inside of which we have a header, blockquote,\
  \ three paragraphs, 2 images, and the citation for where the text came from.\n\n\
  # Listing 7.1 Starting HTML\n\n```\n<main>\n<h1>Chapter I: Into the Primitive</h1>\n\
  <blockquote>\"Old longings nomadic...\"</blockquote>\n<p>Buck did not read the newspapers,\
  \ or he...</p>\n<img class=\"compass\" src=\"../img/compass.png\" #A\n     width=\"\
  175\" alt=\"a black and gray compass\"> #A\n<p>Buck lived at a big house in the...</p>\n\
  <img class=\"dog\" src=\"../img/dog.svg\" #B\n     width=\"126\" alt=\"line drawing\
  \ of a dog\"> #B\n<p>And over this great demesne Buck ruled...</p>\n<cite>London,\
  \ Jack...</cite>\n</main>\n```\n\n#A The compass image\n#B The Dog Image\n\nOur\
  \ CSS includes some base styles to set up our page including margin, padding, and\

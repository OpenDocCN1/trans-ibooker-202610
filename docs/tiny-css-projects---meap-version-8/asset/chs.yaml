  \ to thine own bright eyes,\nFeed'st thy light's flame with self-substantial fuel,\n\
  Making a famine where abundance lies,\nThy self thy foe, to thy sweet self too cruel:\n\
  Thou that art now the world's fresh ornament,\nAnd only herald to the gaudy spring,\n\
  Within thine own bud buries't thy content,\nAnd, tender churl, mak'st waste in niggarding:\n\
  Pity the world, or else this glutton be,\n\n## 关于作者\nWilliam Shakespeare\n\nEnglish\
  \ playwright, poet, and actor who lived from 1564 to 1616. He is credited for having\
  \ authored Romeo and Juliet.\n\n## 十四行诗 2\n\nWhen forty winters shall besiege thy\
  \ brow,\nAnd dig deep trenches in thy beauty's field, ...\n\nRead more of Sonnet\
  \ 2\n\n## 查看他的剧作：\n- All's Well That Ends Well\n- As You Like It\n- Cymbeline\n\n\
  ## 十四行诗 3\n\nLook in thy glass and tell the face thou viewest,\nNow is the time\
  \ that face should form another, ...\n\nRead more of Sonnet 3\n\nWant to read more\
  \ of Shakespeare's works, check out his complete works on the Project Gutenberg.\n\
  \nFigure 2.1.1 Narrow screens\n\nLet's add space between the areas. To accomplish\
  \ this, we will use the gap property.\n\n## 2.4 Grid gap\n\nThe gap property is\
  \ shorthand for row-gap and column-gap properties. By setting the row and column\
  \ gaps we are defining the gutters between each row and column. Gutters is a term\
  \ from print design, defining the margin between columns. By default the gap between\
  \ columns and rows is 0.\n\nWhen using the gap property, the extra space only applies\
  \ between the tracks of the grid. No gutters are applied before the first track\
  \ or after the last track. To set space around the grid we use padding and margin\
  \ properties.\n\n## grid vs grid-gap\n\nAs CSS Grid was being defined, the specification\
  \ for this property was called the grid-gap property but now it is recommended to\
  \ use just gap. However, we still may see grid-gap in older projects.\n\nThe gap\
  \ property can have up to two positive values:\n- the first sets the row gap\n-\
  \ the second is for the column gap\n\nIf there is only one value declared it is\
  \ applied to both the row-gap and the column-gap properties. For our project we\
  \ will set a 20px gap between our rows and columns by adding gap: 20px to our main\
  \ rule.\n\nFigure 2.12 shows our gaps added to our layout.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_58_0.png)\n\
  \nFigure 2.12 Grid layout with added gap\n\nWith the gaps added, let’s switch our\
  \ focus to adjusting our layout based on screen size.\n\n## 2.5 Media Queries\n\n\
  CSS allows us to conditionally apply our styles to our layout based upon the screen\
  \ size. Media queries are called at-rules because they start with the @ symbol.\
  \ We then define the condition under which our styles should be applied.\n\nCurrently\
  \ if we look at our layout on a wide screen (Figure 2.13), we notice we have a large\
  \ amount of space in the center of the page that could be better utilized.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_59_0.png)\n\
  \nFigure 2.13 Our layout on a wide screen\n\nLet’s create a media query that targets\
  \ screens wider than 955px. The query looks as follows: @media (min-width: 955px)\
  \ { }. All of the rules we place inside of the curly brackets ({}) will only be\
  \ applied if the screen size is greater than or equal to 955px. These styles will\
  \ override the styles we had already assigned to the grid since by being inside\
  \ of the media query, they have a higher level of specificity then our original\
  \ layout.\n\nListing 2.8 shows our media query. After defining the query, we redefine\
  \ our grid-template-areas to have a different configuration. We also update the\
  \ column sizes to all have equal widths.\n\n## Listing 2.8 Creating our template\
  \ areas with media queries\n\n```\n@media (min-width: 955px) { #A\n  main {\n  \
  \  grid-template-columns: repeat(3, 1fr); #B\n    grid-template-areas: #C\n    \
  \  \"header header header\" #C\n      \"content author aside\" #C\n      \"content\
  \ plays aside \" #C\n      \"footer  footer  footer\"; #C\n  }\n}\n```\n\n#A media\
  \ query\n#B redefines the column sizes\n#C reconfigures where the content should\
  \ be placed\n\nOur layout now looks as seen in Figure 2.14 and 2.15.\n\n![](img/b56145aa9b751926a7aedbd7172bc818_60_0.png)\n\

  在深入探讨整个主题之前，概述大数据的全貌可能会有所帮助，以便所有参与者建立初步认识。请参考图示 0-1：


  ![图示 0-1](img/fig0-1.png)


  图示 0-1


  TEUs — 20 英尺标准箱


  IPS — 工业生产统计


  S&P — 标准普尔


  NYMEX — 纽约商品交易所


  MPP — 大规模并行处理


  数据源自各种场所，形式也多种多样。来自个别公司、组织、流数据等的数据汇聚在云端，如图示 0-1 所示。组织通过内部服务器、笔记本电脑、平板电脑和其他移动设备访问信息。组织可能需要外部数据库和内部数据库的独特组合，包括计算、预测等。这些信息被发送到配备独立处理器的多台计算机上，以分析海量数据。这些连同其处理器的多台计算机被称为大规模并行处理
  (MPP)。


  ## 示例


  接下来，我们将通过一个简单示例，探讨如何处理大量数据以帮助您创建叙述性报告，从而补充会计流程。假设我们公司处于木材行业或受木材价格影响。工业生产统计数据可在 `http://www.federalreserve.gov/RELEASES/g17/ipdisk/alltables.txt`
  获取。美联储的月度工业生产率指数涵盖制造业、采矿业、电力和燃气公用事业。生产指数衡量实际产出，并以实际产出的百分比表示。


  该网站上的初始数据如表 0-2 所示。这些原始数据庞杂繁多，以目前的形式难以解读。


  ![表 0-2](img/tab0-2.png)


  表 0-2


  我们选取了 NAICS 代码 `B500001`（所有工业生产总指数统计）和 `G321`（木制品行业统计）的 IPS 数据开始分析，如表 0-3 所示：


  ![表 0-3](img/tab0-3.png)


  表 0-3


  接下来，从 `http://Finance.Yahoo.com` 获取了路易斯安那-太平洋公司 (`LPX`) 的月度数据，然后利用 Excel 将这三个数据系列合并。建立数据系列后，生成了图示
  0-2 中的图表。


  ![图示 0-2](img/fig0-2.png)


  图示 0-2


  显而易见，以图表形式呈现，这些数据以一种全新的方式“活”了过来。当我们用讲故事和数据科学来补充会计技能时，能否从这个例子的数据中得出一些总结性结论？一种解读是：


  1. 木制品生产统计数据似乎遵循与 `LPX` 股价相似的趋势线。

  2. 主要 IPS 也似乎遵循类似趋势。

  3. 可以推测木材生产下降先于整体经济下降（注意对应大萧条的急剧下降）。

  4. 可以推测房地产泡沫期间的木材生产统计数据得益于 `LPX` 股价上涨的支撑。


  仅通过处理这个小示例中的可用数据，我们就能发现可用于商业预测的趋势。然而，现实生活中的大多数大数据示例比这复杂得多。大多数使用的数据库比 Excel 大得多，技术工具也复杂得多。此示例旨在演示大数据的基本概念，以便您了解其威力并建立感性认识。


  在大数据和分析领域，也存在大量令人困惑的定义。请参考下图，它试图为今天的讨论梳理各个主题。


  ![](img/ufigf3-1.png)


  随着课程深入，我们将探索规模大得多、种类多得多的数据。用于解读大数据的软件程序比 Excel 复杂，尽管微软推出了 Power BI 产品，鉴于大多数会计师对
  Excel 的熟悉程度，这极有可能成为会计师的首选工具。


  课程结束时，您应熟悉大数据的来源、类型和趋势，以及可用于处理和解读这些信息的各种工具。我们将再看几个示例，并学习如何在您自己的实务中应用这些技术。


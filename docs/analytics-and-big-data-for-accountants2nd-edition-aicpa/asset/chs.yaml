  \n## 我们从这次搜索中学到了什么？\n\n*   前 10 名产品。\n*   产品如何排名。\n*   当前价格。\n*   原始销售价格。\n*   该报告可在不同销售周期内进行评估。\n\
  \n## 我们可以如何利用这些数据？\n\n*   可与消费者在其他商店的搜索行为进行比较。\n*   可在不同时间进行评估（节前和节后）。\n*   可用于识别即时价格变动。\n\
  *   也可用于展示消费者对产品的即时兴趣变化。\n*   可与未来的实际销售相关联（预测性）。\n*   可与发传单相关联。\n*   可与网站上的产品定位相关联。\n\
  *   可与网站上的特别优惠相关联。\n*   特别有趣的是礼品卡和洗衣电器的上升趋势。5 月 5 日没有迹象表明礼品卡或洗衣电器是热门浏览产品。然而，5 月\
  \ 7 日这两类商品都跻身顶级类别。这信息是否反映了母亲节潜在礼物？（**注：** 在获得使用 Best Buy 数据的许可时，作者与 Best Buy 代表讨论了这一见解。作者正引导到这一点时，Best\
  \ Buy 代表说出了“母亲节”。）\n\n从数据中可以得出许多其他结论和推断；然而，显而易见的是，可以从以前未被追踪的数据中获得洞察。未来几周的实际销售结果将会很有趣，看看热门浏览产品与实际销售之间是否存在相关性。此外，从竞争对手的角度考虑：竞争对手甚至不需要派遣“神秘顾客”，数据可用于比较目的。\n\
  \n## 优化\n\n统一定价很少（如果有的话）适合所有客户。定价有许多不同的决定因素，包括以下内容：\n\n*   商品与非商品地位\n*   产品可用性\n\
  *   替代产品可用性\n*   购买量\n*   季节性\n*   相关产品购买情况\n*   特别折扣\n*   定制要求\n*   提前期\n*   产品过期\n\
  *   产品质量\n*   品牌认知\n*   竞争对手的定价策略\n*   政府法律法规\n*   原材料价格变化\n*   必须通过产品定价转嫁的其他成本变化\n\
  *   产品版本\n*   产品销售渠道和方式（折扣零售商与高端精品店）\n\n无论特性如何，卖家必须了解这些项目如何相互作用以及产品定价的影响。如果产品定价过高，可能获得利润率；但总量可能下降到导致总收入和盈利能力受损的程度。如果产品定价过低，利润率可能受损；但总量可能增加到提高总收入和盈利能力的程度。每个特性也会影响其他特性。例如，想要名贵产品的客户会期望高价格以限制客户数量。如果每个人都能买得起，一些客户将不再视其为名贵，因此不会购买。因此，定价的艺术在于选择与销售产品的预期策略相辅相成的定价方法。\n\
  \n## 航运公司利用大数据优化价格¹\n\n如果理解了特性，大数据如何补充定价过程以优化组织收入？让我们看看 Carnival Cruise Lines 是如何做到的。\n\
  \nCarnival Cruises 希望细分客户群以更好地了解其消费模式。Carnival 的目标是了解以下内容：\n\n*   如何吸引新客户\n*   如何重新定价船票以填满更多客舱\n\
  *   了解客户在纪念品、岸上游览和额外服务上的消费习惯\n\n为获取这些信息，Carnival 实施了一个开创性流程。公司决定雇佣数据科学家分析过往客户和一般度假者的数据、经济趋势和社会趋势。目标之一是将客户与其\
  \ 100 艘船队中最合适的邮轮匹配——从经济型家庭游到豪华游的九个品牌。在服务和相关价格范围方面的客户差异化可能非常显著。\n\n由于邮轮的整体盈利能力取决于整个航程，公司必须能够监控和调整每日产生影响的策略。价格可能不会动态变化，但每日结果可能改变策略和促销。\n\
  \n邮轮业务的主要指标是可用乘客邮轮天数（客户在船上的天数）。据 CEO 称，全船队每年总可用天数为 8000 万。简单来说，如果每位乘客每天多花 1 美元，Carnival\
  \ 一年将增加 8000 万美元收入。\n\nCarnival 的数据科学团队每天工作，分析乘客行为、度假趋势、旅行社咨询和客户查询等数据。分析在夜间运行，为全球船票价格变动生成数千条建议。例如，基于预测需求，公司可以更改分配给不同港口的预订数量。此外，分析还可能导致将船舶运力从一个国家转移到跨洋的另一个国家。\n\
  \nCarnival 理解分析并不意味着他们做出了正确决策——只是做出了更明智的决策。管理层仍依赖人类经验结合分析。\n\nCarnival 的方法有效吗？公司业绩表明是有效的。Carnival\
  \ 在 2015 年第三季度报告了创纪录的收益，并计划在 2016 年增加更多船只。\n\n## 知识检查\n\n4. Carnival Cruises 强调使用分析影响定价将做什么？\n\
  \n    1.  确保做出最佳决策。\n    2.  导致收取尽可能高的价格。\n\n\n\n\n3. 保证做出更明智的决策。\n\n4. 保证评估所有选项。\n\
  \n## 预测工具\n\n有许多工具可用于预测未来结果。例如，如果我们能预测以下情况，会有什么优势？\n\n1. 客户推荐其他潜在客户的概率。\n2. 客户购买其他产品的概率。\n\
  3. 员工推荐其他潜在员工的可能性。\n4. 员工离职的可能性。\n\n基本上，这些问题中的每一个都可以利用我们已有的数据或容易获取的数据进行评估。例如，我们可以通过客户调查来评估第\
  \ 1 和第 2 项的可能性。我们可以通过员工调查，甚至可能通过员工邮件来评估第 3 和第 4 项。\n\n首先，考虑一种可以预测企业增长的工具。用于预测该信息的数据可能已经存在于公司系统中，或者以书面形式（调查表）存在，或者可能通过另一种反馈方式确定，例如客户回访电话。该工具称为*净推荐值*（NSP）。\n\
  \n贝恩咨询公司的 Frederick Reichheld 于 2003 年开发了 NSP。与传统的客户调查相比，NSP 方法的简洁性源于企业租车公司的两个问题客户调查。Reichheld\
  \ 的研究表明，公司的增长率与作为“推荐者”的客户百分比之间存在很强的相关性。\n\n## 知识检查\n\n1. 谁创建了净推荐值？\n    1. Lencione。\n\
  \    2. Reichheld。\n    3. Collins。\n    4. Champy。\n\n## 企业预测分析工具 — 2019²\n\n有各种软件工具可用于生成预测分析。本节不作为推荐，仅提供一些主要工具的示例。\n\
  \n1. Sisense\n2. Microsoft R Open\n3. Microsoft Azure Machine Learning Studio\n\
  4. Oracle Crystal Ball\n5. IBM SPSS Predictive Analytics Enterprise\n6. Minitab\n\
  7. Wolfram Mathematica\n8. SAS Advanced Analytics\n9. Anaconda Enterprise\n10. TIBCO\
  \ Statistica\n11. TIBCO Spotfire\n12. RapidMiner Studio\n13. KNIME Analytics Platform\n\
  14. DataRobot\n15. Dataiku DSS\n16. FICO Predictive Analytics\n17. GoodData\n18.\
  \ Buxton Analytics Platform\n19. Funnel Science\n20. Salford Systems SPM\n\n## 访问大数据源的其他简单工具\n\
  \n参加 AICPA（美国注册会计师协会）财务主管年度更新会议的与会者收到了 G17，这是支持工业生产统计的极佳数据来源。它由美联储每月发布。下图显示了总指数按年份划分的实际月度生产统计数据。网址参考为\
  \ `http://www.federalreserve.gov/RELEASES/g17/ipdisk/alltables.txt`。\n\n该信息可用于确定您所在行业及其他行业的商业周期，这也应决定您的管理策略。它还可用于将贵公司的销售额与行业趋势进行比较。如果您的销售趋势仅仅是反映行业趋势，那么您的销售团队属于平均水平。如果您的销售趋势超过行业，则您的销售团队高于平均水平；如果您的销售趋势低于行业趋势，则您的销售团队低于平均水平。\n\
  \n![](img/ufig6-9.png)\n\n那么，报业如何利用大数据快速识别其下行（且持续下行）的趋势？这些本应说服管理团队多年前就进行重组、多元化经营或退出报业。下一次分析是使用报纸出版商的\
  \ IPS 数据并复制到 Excel 中完成的。然后，创建了一个图表来整体观察该行业。\n\n![](img/ufig6-10.png) ![](img/ufig6-11.png)\n\
  \n注意 1986-87 年左右的峰值。这是个人电脑变得更加普及的时期。用户开始在线获取新闻信息的趋势即将到来。\n\n我们如何利用这些信息来了解商业周期和销售收入趋势？Excel\
  \ 数据被用来创建 3 个月和 12 个月的移动平均值。\n\n![](img/ufig6-12.png)\n\n绘制 IPS、3 个月和 12 个月移动平均值的图表会产生下图。注意持续下降，几乎始终低于\
  \ 12 个月移动平均线。自 21 世纪初以来，报业一直在持续下滑。\n\n![](img/ufig6-13.png)\n\n绘制滞后平均值。很容易看出数据何时低于\
  \ 1.0。任何时候数据低于 1.0，行业就在衰退。审慎的管理团队应采取应对衰退的措施。当数据升至 1.0 以上时，行业在增长，管理团队应关注扩张性行动。不幸的是，通过回顾带有计算的数据和前面的图表，很明显报业一直处于持续衰退中。\n\
  \n## 知识检查\n\n1. 工业生产统计数据来自哪里？\n    1. 美国人口普查局。\n    2. 劳工统计局。\n    3. 美联储。\n   \
  \ 4. 美国小企业管理局。\n\n2. 报纸出版商的行业代码是什么？\n    1. 51111。\n    2. 50001。\n    3. 54111。\n\
  \    4. 44111。\n\n![](img/ufig6-14.png)\n\n### 人口普查数据\n\n还有哪些其他大数据来源值得组织考虑使用？\n\n\
  美国人口普查局编制了从 1992 年至今的月度零售销售额估算。网址为 `http://www.census.gov/retail/index.html`。\n\n\
  ![](img/ufig6-15.png)\n\n以下是美国人口普查局提供的数据示例。该电子表格包含回溯至 1992 年的月度数据，还将行业与北美行业分类系统代码相关联。可以将这些数据与前一个示例中的\
  \ IPS 数据关联起来。\n\n![](img/ufig6-16.png)\n\n## 数据库工具\n\n如果您不使用优秀的预测软件，您的数据或分析将受到限制。为了补充您的电子表格分析，请考虑购买\
  \ Crystal Ball（`http://www.oracle.com/technetwork/middleware/crystalball/overview/index.html`）或\
  \ @RISK（`http://www.palisade.com/risk/`），它们是执行蒙特卡洛模拟分析的 Excel 加载项。此外，Domo（`http://www.domo.com`）是一个新的商业管理平台，它将所有商业平台整合在一起，结合了商业智能、预测分析和大数据。\n\
  \n第一个加载项 @RISK（读作“at risk”，意为“面临风险”）使用蒙特卡洛模拟执行风险分析，以显示电子表格模型中许多可能的结果——并告诉您它们发生的可能性有多大。它以数学和客观的方式计算并跟踪许多不同的可能未来场景，然后确定与每个不同场景相关的概率和风险。这意味着用户可以判断该承担哪些风险、该避免哪些风险，从而在不确定性下做出最佳决策。\n\
  \n@RISK 还通过集成 RISKOptimizer 帮助规划最佳风险管理策略，RISKOptimizer 将蒙特卡洛模拟与最新的求解技术相结合，以优化任何包含不确定值的电子表格。结合\
  \ @RISK 函数，使用遗传算法³ 或 OptQuest，RISKOptimizer 可以确定最佳资源分配、最优资产配置、最高效的进度安排等。⁴\n\n\n\n\
  \n## 大数据分析工具与可视化\n\n## Oracle Crystal Ball\n\nOracle Crystal Ball 是用于预测建模、预测、仿真和优化的领先基于电子表格的应用程序。它能让用户无与伦比地洞察影响风险的关键因素。借助\
  \ Crystal Ball，用户能做出正确的战术决策以达成目标，甚至在最不确定的市场条件下也能获得竞争优势。⁵\n\n## Domo\n\n根据 Domo 网站的介绍，“要把工作做好，用户需要在正确的时间获得正确的信息。遗憾的是，这些信息散落在日益增多的脱节电子表格、系统、数据库和应用程序中。”⁶\n\
  \nDomo 通过将企业及其数据汇聚在一个直观的平台上来解决这一问题。借助 Domo，用户可以创建仪表板，将所有信息集中在一处，并利用这些信息做出更快、更明智的决策。\n\
  \n## 知识检验\n\n1. 月度零售销售数据可从以下渠道获得\n    1. 美国人口普查局。\n    2. 劳工统计局。\n    3. 美联储。\n\
  \    4. 美国小企业管理局。\n\n## 大数据可视化\n\n什么是大数据可视化？根据 SAS 的说法：⁷\n\n> 数据可视化是以图表或图形格式呈现数据。几个世纪以来，人们一直依赖图表和地图等可视化表现形式，以更轻松、更快速地理解信息。\n\
  >\n> 随着收集和分析的数据越来越多，各级决策者都欢迎数据可视化软件，它使他们能够以可视化方式查看分析结果，在数百万个变量中找到相关性，向他人传达概念和假设，甚至预测未来。\n\
  >\n> 由于人脑处理信息的方式，当数据点以图表形式显示时，人们比翻阅堆积如山的电子表格或阅读大量报告更快地掌握其含义。\n\n## 文本分析⁸\n\n文本分析是从文本中提取高质量信息的过程。通过统计模式学习来理解模式和趋势，从而获得洞见。文本挖掘要求对输入文本进行结构化，识别结构化数据中的模式，最后解释输出结果。文本挖掘包括文本分类、文本聚类、概念或实体提取、细粒度分类体系生成、情感分析、文档摘要和实体关系建模（即学习命名实体之间的关系）。文本挖掘的目标是利用自然语言处理和分析方法将文本转化为数据。一个例子是扫描一组用自然语言编写的文档以进行预测性分类，或用提取的信息填充数据库。\n\
  \n- **命名实体提取**：有助于回答“谁、什么、哪里？”的问题。\n- **文档摘要**：由计算机程序创建文本的缩短版本。\n- **主题提取**：回答“使用了哪些重要词汇？”的问题。\n\
  - **概念提取**：回答“重要的高层概念是什么？”的问题。\n- **情感分析**：回答“所说内容是‘积极’还是‘消极’？”的问题。\n\n## 练习题\n\n\
  1. 列举一些定价决定因素。\n2. 描述从百思买获取的大数据。\n3. 列举几个可与贵组织进行比较的大数据来源。\n4. 描述什么是文本分析。\n\n## 注释\n\
  \n1. 1 Kim Nash, “嘉年华战略总监押注大数据将优化价格,” *The CIO Report*, *The Wall Street Journal*,\
  \ 2015 年 4 月 30 日, <http://blogs.wsj.com/cio/2015/04/30/carnival-strategy-chief-bets-that-big-data-willoptimize-prices/>.\n\
  2. 2 FinancesOnline, “2020 年 20 大最佳预测分析软件,” 访问于 2020 年 3 月 18 日, <https://financesonline.com/predictive-analysis/>.\n\
  3. 3 注：遗传算法（GA）是一种基于模仿生物进化的自然选择过程，用于求解约束和无约束优化问题的方法。该算法反复修改个体解群。在每一步中，遗传算法从当前种群中随机选择个体作为父代，生成下一代的子代。经过连续几代，种群会“进化”向最优解。\
  \ <https://www.mathworks.com/discovery/geneticalgorithm.html>\n4. 4 “@Risk,” *Statistics.com*,\
  \ 访问于 2017 年 3 月 30 日, <http://www.statistics.com/software-directory/risk-spreadsheet-add-in/>.\n\
  5. 5 “Oracle Crystal Ball,” 访问于 2017 年 3 月 30 日, <http://www.oracle.com/technetwork/middleware/crystalball/overview/index.html.>\n\
  6. 6 “Domo 平台,” 访问于 2017 年 3 月 30 日, <https://www.domo.com/company/what-is-domo>.\n\
  7. 7 “数据可视化：它是什么及为什么重要,” SAS, <http://www.sas.com/en_us/insights/big-data/datavisualization.html>\n\
  8. 8 Rao, Venky, “文本分析简介,” 访问于 2016 年 3 月 21 日, Data Science Central, <http://www.datasciencecentral.com/>\n"
- "# 第 7 章：大数据案例\n\n## 学习目标\n\n- 识别公司目前如何使用大数据。\n- 区分组织如何将本章的大数据案例应用到自己的组织中。\n\n##\
  \ 简介\n\n2018 年的首要大数据趋势是，大数据不再是一种趋势——它是任何组织的必备要素。许多公司正将大数据进一步融入其业务实践中。在人工智能和自然语言处理的帮助下，聊天机器人正在取代人工客服。随着组织转向多渠道数字体验，IBM\
  \ 在数字体验平台领域持续领先，Gartner 最近将其评为执行能力和愿景完整性两方面的领导者。^(1)\n\n公司一直在扩大预算以增加 IT 部门投入，这与本课程早期版本的预测一致。根据\
  \ 2020 年 IT 现状报告，44%的组织计划增加 2020 年的技术预算。此外，47%的公司预计将招聘更多 IT 专业人员。^(2)\n\n重点将继续放在将大数据精细调整为更易管理的信息，如“快数据”和“可行动数据”，以减少数据过剩产生的额外噪音。将暗数据转化为可用数据也是\
  \ 2018 年的一大亮点，包括使用算法和 AI 辅助来筛选非结构化信息。^(3)\n\n本章包含企业创建和使用大数据的案例。本章的目标是理解（通过提供的案例）组织拥有或可以获取许多类型的数据，这些数据能带来对其业务更深入的洞察。读者应将每个案例视为其组织的潜在应用。\n\
  \n\n\n目的不是让人不知所措，而是回顾无数案例，以增强读者对大数据众多不同应用的认知，并激发关于大数据如何在贵公司应用的思考。\n\n## 大数据案例\n\n\
  ### 达美乐披萨^(4)\n\n数据从短信、Twitter、Pebble、Android、Amazon Echo 等渠道获取，并汇入达美乐信息管理框架。此外，这些数据还与来自第三方来源的数据（USPS、地理编码信息、人口统计数据和竞争对手数据）相结合，以创建深度客户细分（每天录入\
  \ 85,000 个结构化和非结构化数据源）。\n\n达美乐 55% 到 58% 的订单通过在线处理。电话或现场订单占其余部分。\n\n达美乐可以评估个人购买模式、同一家庭中的多个消费者、主要购买者、对优惠券的依赖程度以及访问达美乐的渠道。这使达美乐能够根据客户画像定制优惠券和产品推荐。\n\
  \n### 罪犯与家谱学\n\n执法机构面临许多涉及凶恶罪行的未破案件。遗憾的是，其中一些案件悬而未决数十年。然而近年来，一种新的打击犯罪工具出现了——家谱数据库。这些数据库最初并非设计用于寻找罪犯，但已成为这一用途的资源。数据库运营方起初不愿因该目的而为人知，因为隐私和道德使用对他们至关重要。在某些情况下，警方会上传包含案发现场\
  \ DNA 的虚假档案以寻找关联。关联的对象不是罪犯本人，而是罪犯的亲属。执法机构随后会追踪家谱信息，看是否有任何人在案发时出现在案发区域。这就是目前“金州杀手”案的情况，该案审判原定于\
  \ 2020 年初进行。\n\n### 冰球与大数据\n\n自动化数据追踪技术是 2019-20 赛季的一部分。冰球和运动员的护肩将内置追踪芯片。传感器将布置在冰场周围。每时每刻都将收集位置、速度、方向、距离和其他关键指标的大数据。\n\
  \n传感器芯片将以每秒 200 次的频率为每队五名滑冰运动员和一名守门员提供数据点。一场 60 分钟的比赛将在每个类别中产生约 9,360,000 个记录事件^(5)。\n\
  \n### 约翰迪尔\n\n约翰迪尔是大数据行业的先驱之一。它在物联网框架内开发了一套系统，让农民机器的数据能与其设施中的专家交互，以预测机器何时会故障。约翰迪尔随后将必要的维修零件发送给用户，从而将机器停机时间降至最低，因为获取正确零件没有延迟。在满足世界不断增长的粮食需求方面，约翰迪尔还致力于将个别农民的田间读数与天气及其他宏观信息相连接，以最大化农作物产量和资源分配^(6)。在尊重农民隐私方面，如果农民不愿让其数据被其他方访问，约翰迪尔允许农民选择退出这种信息保留。\n\
  \n### 罗伊斯顿柴油动力\n\n罗伊斯顿柴油动力是主要用于航运业的发动机燃油管理系统开发商，利用大数据推动航运业的效率提升。实时传感器数据允许在异地持续监控船舶系统。额外的传感器使规划航线变得容易，该航线综合考虑了船舶性能、气象数据和其他因素。这种整体方法提高了到达时间准确性和资源使用效率。港口当局也能查看船舶数据，以监控港口潜在拥堵并改善货物装卸。运营管理和能源管理在大数据方面日益普遍，这些领域将继续增长，预测性维护和性能优化亦是如此^(7)。\n\
  \n### 911 呼叫中心\n\n美国紧急响应呼叫中心一直在向云端存储信息转型，并将重点放在如何记录多媒体通信上。单次 911 交互产生的大数据量巨大，因为有最初拨打或发送短信给\
  \ 911，然后有呼叫中心创建的记录，接着是发送给警察或紧急响应小组的调度信息，随后跟进的数据也会被记录。一家公司 NICE 可以接收发送给 911 的短信录音，以及短信流中的元数据（来电者、位置、日期和时间等），并允许机构通过额外的平台\
  \ AGENT511 记录这些信息。将所有这些信息集中在一个可访问的地方，使质量保证评估所需时间减半，并改善了紧急响应时间^(8)。\n\n### 美国国防部\n\
  \n国防部花费创纪录的 74 亿美元用于现代技术，以更新系统和提升能力，使现有技术不至于过时。据前国防部副部长罗伯特·沃克称：“美军要么引领即将到来的革命，要么成为其牺牲品。”^(9)\
  \ 他还表示：“人工智能的快速进步——以及它们将带来的自主系统和操作的巨大改进——正指向涉及人机协作和协同作战的新颖作战应用。” 74 亿美元比 2012 年的支出水平增长了\
  \ 32%，其中人工智能专项获得的支出增幅最大。\n\n### 苏格兰皇家银行\n\n苏格兰皇家银行通过文本分析使用自然语言处理。自然语言处理是将口语转化为计算机可执行项的活动。该机构收集客户投诉产生的所有数据，然后分析这些邮件、调查回复和录音客户通话，以了解客户投诉的原因。然后利用这些知识实施调整，改善未来的客户体验^(10)。\n\
  \n### 尊严健康\n\n尊严健康是加利福尼亚州最大的医院服务提供商，利用大数据扫描患者那些难以发现的危及生命的疾病。例如，脓毒症是主要死因之一，也是导致患者再入院的主要原因。脓毒症的体征和症状往往难以与其他健康问题区分，例如发烧很容易被归因于最初的病因。为了减少误诊并缩短从患者发病到接受治疗的时间，尊严健康使用脓毒症生物监测项目，该项目监测所有患者的生命体征和可能指向脓毒症开端的关键指标。如果项目发现存在足够多的预警信号，系统会通过患者病历提醒护士。随后护士将患者转入\
  \ ICU，采取全面措施控制病情。该系统已将尊严健康旗下医院的脓毒症死亡率降低了 5%，并带来了显著的成本节约，因为早期干预使患者在重症监护室的时间缩短^(11)。\n\
  \n### 优步\n\n\n\n#### Uber 利用大数据洞悉客户的一举一动\n\n他们住在哪里、在哪里吃饭、在哪里工作、去哪里旅行，以及这些活动的时间。Uber\
  \ 与“嘉木莱优客会”合作，这是一个精英俱乐部，每当你使用 Uber 时都能让你赚取积分。条件是你允许 Uber 和嘉木莱以他们认为合适的任何方式使用你的数据。^(12)\n\
  \n图片上写着“点击允即表示你同意授予嘉木莱优客会：访问你的全名、电子邮件、照片和促销代码的权限。访问你所有的 Uber 活动。这包括所有上下车地点和时间、车费金额、行驶距离以及使用的\
  \ Uber 产品。嘉木莱优客会将根据其隐私政策使用此信息。”\n\n![](img/ufig7-1.png)\n\n### Halo Top\n\n这个轻食冰淇淋品牌正以势不可挡之势席卷冷冻甜点行业，而此时大多数品牌都在努力维持市场份额。他们完全无视传统营销渠道，而是利用\
  \ Facebook、Twitter 和 Instagram 提供的大数据投放特定广告，并密切监控这些数字广告的投资回报率。^(13)\n\n### Electronic\
  \ Arts\n\n全球有超过 20 亿视频游戏玩家，这个 200 亿美元的行业在许多领域处于领先地位。Electronic Arts 拥有最大的市场份额之一，他们利用大数据确保客户在整个游戏体验过程中保持粘性。例如，初级关卡过难或高级关卡过易会导致玩家退出游戏，这会阻碍电子游戏的成功。Electronic\
  \ Arts 会查看玩家在游戏过程中哪个环节流失，看是否存在导致玩家退出的瓶颈，并利用这些信息来定制未来的新游戏。^(14)\n\n### NFL\n\nNFL\
  \ 正利用大数据追踪场上球员的数据，用于多种目的——特别是自由球员市场。通过在每个护肩中各放置一个传感器，以及在球场两层看台上部署精密的类 GPS 追踪系统，NFL\
  \ 现在可以追踪球员的跑动里程。一些总经理将其视为审视自由球员市场的一种方式——用以评估老将的身体损耗程度，如伤病、跑动里程、加速、减速等。^(15)\n\n\
  ### Ford\n\nFord 正利用大数据延伸其对产品的影响力。过去产品生命周期在车辆出厂时就结束了，现在 Ford 可以监控车辆在当地 Ford 经销商处保养时哪些项目需要维修或更换，并了解哪些部件最容易损坏。Ford\
  \ 还可以利用这些信息重新设计易损部件，使其更耐用。^(16)\n\n### Heineken\n\nHeineken 利用大数据将销售数据与天气报告相对应，以了解在不同季节、天气模式等条件下，哪些地区销量最好，从而确保他们的啤酒总能在正确的时间出现在正确的地点。他们还在测试一个名为\
  \ Shopperception 的项目，该项目基于 Xbox Kinect 传感器，旨在了解顾客到底何时购买啤酒、在货架前的行为如何，并获取实时购买信息。这让他们能够准确了解啤酒是如何被购买的、在商店的哪个位置被购买的以及何时被购买。^(17)\n\
  \n### Marist College\n\nMarist College 开发了一个分析模型，能根据前两周的课业表现，以 75% 的准确率预测哪些学生会成功、哪些会失败。Marist\
  \ College 利用该模型提高了学位完成率。该模型的使用引发了许多伦理问题，但迄今为止它一直被用于积极目的。^(18)\n\n### Taco Bell\n\
  \nTaco Bell 利用大数据紧跟客户体验。Taco Bell 有一个被他们昵称为“鱼缸”的部门，该部门监听并收集关于公司在 Facebook、Instagram、Twitter\
  \ 等平台上的所有信息。公司各部门高管每天早上聚在一起 15 分钟，听取“鱼缸”的汇报，实时了解公司运营状况。例如，当 Taco Bell 推出早餐时，东海岸门店误判了需求，导致排起长龙，这在社交媒体上广为传播。到了当天中西部和西海岸门店开门营业时，问题已经解决，不再有等待时间。^(19)\n\
  \n### 传感器——消费者健康与安全\n\n嵌入或附着在设备中的传感器的出现，正在改变我们体验许多活动的方式，从运动到健康监测。例如，Fitbit 是一种佩戴在手腕上的追踪器，可记录步数、距离、消耗的卡路里和活跃分钟数。Fitbit\
  \ 与佩戴者的计算机系统有无线连接。\n\n在拉斯维加斯消费电子展上，制造商展示了用于改善个人体态的芯片，以及嵌入运动器材（包括篮球、高尔夫球杆和网球）中的传感器，以帮助人们更科学地训练。甚至还有传感器用于处理寻找丢失钥匙等琐碎但重要的任务。\n\
  \n这项技术的另一个应用是包含传感器的特种地毯，通过识别正常步态模式，能让老年人活得更久、更独立。这些地毯能察觉一个人的步态何时开始发生变化，从而可能预测跌倒。跌倒是导致老年人从自家住所搬入养老中心的主要事件之一。此外，跌倒导致的髋部骨折可能是一个人生命走向终结的开端。健身设备也被用于识别地震等自然灾害的影响区域。个人健身追踪器\
  \ Jawbone 报告称，在地震震中附近区域——纳帕、索诺玛和瓦列霍——用户在震后立即被惊醒。在较远的地区，如莫德斯托和圣克鲁兹，被惊醒的用户较少。这有力地展示了大数据如何让从紧急救援人员到政府的任何人都能衡量灾害的影响。^(20)\n\
  \n## 知识检验\n\n1. 以下哪项被列为传感器？\n\n    1. 当宠物想进屋时提醒主人的传感器。\n    2. 当邮件送达信箱时通知你的传感器。\n\
  \    3. 寻找钥匙的传感器。\n    4. 检测前门有人的传感器。\n\n### 呼叫中心——不满的客户\n\nUnited Healthcare Services\
  \ Inc. 通过调查数据呼叫中心中的客户语音模式，从大数据中获得洞察，以判断是否能识别出客户的不满情绪。通过留意客户互动中的模式，UHS 可以找出导致客户流失的情境。^(21)\n\
  \n语音分析系统可以分析语气、情感、讲话或停顿模式，以评估情绪和满意度，并将用户定义短语的检测与特定坐席动作关联起来——简而言之，识别并确定需要修复内容的优先级，然后为解决问题做出贡献。^(22)\n\
  \n### 机器传感器——通用电气\n\n另一个公司利用大数据的绝佳例子是通用电气（GE）。GE 在一切“会旋转”的设备中安装装置，以找出哪些机器需要维护、哪些流程可以缩减、哪些机器的磨损率更高。因为\
  \ GE 近一半的收入来自这些机器的维护服务，所以它从所有这些数据中在服务业务上获得了巨大优势。结果是一台燃气轮机的传感器一天产生的信息量超过 Twitter\
  \ 一周产生的总量。^(23)\n\n### 天气与航班信息——连锁酒店\n\n\n\n\n## 商业中的大数据应用\n\n### Red Roof Inn：天气数据与航班取消\n\
  \n恶劣天气会导致人们减少出行，从而减少过夜住宿的购买。然而，一些连锁酒店正利用恶劣天气为己所用。Red Roof Inn 发现了恶劣天气、航班取消和滞留乘客之间的联系。当航班因恶劣天气取消时，乘客就变成了潜在且急需住宿的客户。Red\
  \ Roof Inn 获取现成的航班取消和天气信息，并利用这些信息增加预订量。公司构建了一个算法，按酒店和航空航站楼区域进行排序。该算法可用于向乘客推送酒店优惠信息。考虑到旅客会通过手机搜索酒店，Red\
  \ Roof Inn 利用多个移动平台专门针对搜索住宿的旅客，并使他们预订酒店变得尽可能简单。\n\n考虑大数据的影响。请注意，每天有 1% 到 3% 的航班被取消，这意味着每天有\
  \ 150 到 500 个航班（换句话说，25,000 到 90,000 名滞留乘客）。通过使用大数据定位这些乘客，Red Roof Inn 成功将其业务从 2013\
  \ 年到 2014 年增长了 10%。^(24)\n\n## 知识检查 2\n\n**2. 平均每天有多少百分比的航班被取消？**\n\n1.  **1% 到\
  \ 3%。**\n2.  2% 到 4%。\n3.  3% 到 5%。\n4.  4% 到 6%。\n\n### 披萨连锁店：天气与停电\n\n披萨连锁店也利用天气来定位潜在客户。一家披萨连锁店根据恶劣天气和停电情况发放优惠券。该企业了解到停电时人们无法做饭，因此通过移动广告活动针对这些人群，吸引他们购买披萨。该定向营销活动的响应率为\
  \ 20%，高于全国平均水平。^(25)\n\n### John Deere：田间传感器\n\n农业先驱 John Deere 正利用大数据在行业中掀起波澜。John\
  \ Deere Field Connect 系统监测湿度水平，并通过无线连接将信息发送给农民查看。这些天然传感器还测量“空气和土壤温度、风速、湿度、太阳辐射、降水量和叶面湿度”。\n\
  \n这些信息将帮助农民了解作物何时接近理想的水分水平。有了这些数据，农场主可以做出灌溉系统决策。模式数据还可以显示季节如何影响水分保持。^(26)\n\n###\
  \ EMI：社交网络\n\n唱片公司 EMI 利用大数据预测未来的音乐趋势。EMI 密切关注音乐购买者消费新发行音乐的方式。例如，EMI 查看音乐在社交媒体网络上被引用的情况，以及在流媒体服务上被播放的情况。公司随后分析数据，按位置、人口统计特征和亚文化进行细分，协助音乐分销商投放精准广告，并以高置信度预测产品需求。这一概念也适用于其他零售商，他们也可以聚合来自社交网络的信息流，以建立对新产品将如何被新市场或现有市场接受的理解，甚至了解他们的产品和公司声誉在公众中的认知度。^(27)\n\
  \n## 知识检查 3\n\n**3. EMI 部分从以下渠道获取音乐趋势**\n\n1.  YouTube。\n2.  Google。\n3.  **社交媒体网络。**\n\
  4.  Instagram。\n\n### Target：婴儿礼物清单与怀孕预测\n\n一个值得特别关注的零售大数据案例是 Target 的怀孕预测。Target\
  \ 将婴儿礼物清单信息与其 Guest ID 计划相关联，以辨别顾客何时可能怀孕。Target 的 Guest ID 是一个唯一的客户 ID，用于追踪购买历史、信用卡使用情况、调查回复、客户支持互动、邮件点击率和网站访问记录。该组织用人口统计信息补充购物者活动，如年龄、种族、教育程度、婚姻状况、子女数量、估计薪资、工作经历和生活事件（如离婚、申请破产或搬家）。\n\
  \n通过查看在婴儿礼物清单上登记的顾客及其 Guest ID 的购买历史，零售商可以跟踪顾客在整个怀孕期间购物倾向的变化。例如，在最初的 20 周内，孕妇开始购买钙、镁和锌等补充剂。在第二孕期，她们开始购买大码裤子和更多的洗手液、无香润肤露、无香清洁剂和大包装棉球。总的来说，零售商可以精准定位出孕妇在整个怀孕期间购买的约\
  \ 25 种商品。\n\n通过将这些购买习惯应用于所有顾客，Target 能够在顾客未直接通知 Target 或任何其他人的情况下，识别出哪些顾客怀孕了。Target\
  \ 随后利用怀孕预测模型预测每位购物者怀孕的可能性。有了这个模型，Target 为顾客分配了一个评分，以评估其怀孕的可能性。这些数字被用来识别特定的孕妇群体，然后针对怀孕的每个阶段向她们发送有针对性的促销活动。这些顾客不仅购买婴儿用品，她们的整体购买行为都有所提升。通过使用大数据，Target\
  \ 的收入从 2002 年的 440 亿美元增加到 2010 年的 670 亿美元。尽管该零售商未公开评论该计划，但 Target 的 CEO 曾向金融专家表示，公司“加大对吸引特定客户群体（如妈妈和婴儿）的商品和品类的关注”极大地促进了零售商的成功。^(28)\n\
  \n尽管必须审视客户安全和广告方面的考量，但这对零售商来说是一个重要的教训。\n\n## 知识检查 4\n\n**4. Target 以一个大数据趋势识别器而闻名。Target\
  \ 认为它可以预测什么趋势？**\n\n1.  婚姻。\n2.  **怀孕。**\n3.  疾病。\n4.  离婚。\n\n### Morgan Stanley：投资组合分析\n\
  \nMorgan Stanley 从 Target 的经验中吸取教训，并试图效仿。“我们倾倒了我们能获取的每一个日志，包括网络日志和所有不同的数据库日志，将它们放入\
  \ Hadoop 并运行基于时间的相关性分析，”企业信息管理执行总监 Gary Bhattacharjee 说道。^(29) 该公司随后能够看到市场活动，以及它如何与网络问题和数据库读写问题相对应。\n\
  \n当 Morgan 尝试进行一些投资组合分析时，发现传统数据库和网格计算无法扩展以应对其数据科学家所需的海量信息。IT 部门使用 Hadoop 连接了 15\
  \ 台旧服务器。与处理较小的数据集不同，Hadoop 允许银行从多个角度处理海量信息。它允许 Morgan Stanley 将廉价基础设施引入框架，安装 Hadoop\
  \ 并让它运行。公司现在拥有一个用于投资组合分析的高度可扩展的解决方案。\n\n### Ford Fusion：汽车数据生成\n\nFord 拥有一个庞大、碎片化的环境来获取大数据。此外，Ford\
  \ 在创造更多联网机器（包括汽车）方面投入巨资。例如，Ford 目前的混合动力 Fusion 车型每小时产生高达 25 GB 的数据。只要他们能从信息中提取知识，这些信息就是\
  \ Ford 的潜在金矿。\n\n\n\n\n## 各行业的大数据用例\n\n福特公司一直在推动采用大数据技术约一年时间。该公司的 IT 部门已能够对所有数据源以及贯穿整个组织的复杂分析难题获得高层视角。这一努力以及以新方式处理信息的需求，是\
  \ IT 部门选择 `Hadoop` 的驱动力。^(30)\n\n### 互联网 — 维珍大西洋航空\n\n维珍大西洋航空通过互联网连接了众多波音 787 飞机和货运设备。每架飞机都有许多连接部件，产生大量信息。\n\
  \n每个关联航班可提供超过半 TB 的数据。该信息可用于预测维护问题，或提高飞行和燃油效率。不幸的是，维珍大西洋航空报告称，未能充分利用所有这些数据。`Hadoop`\
  \ 试验未能产生所需的洞察；因此，该公司不得不寻找其他软件供应商。^(31)\n\n### 工业互联网 — 通用电气 (GE)\n\n正如前文机器服务示例所示，GE\
  \ 在大数据上投入巨资——从利用火车和飞机为互联网提供动力到更广泛的领域。通用电气以制造机器闻名，但它也开始将自己推销为一家主要的信息组织，推行其“工业互联网”愿景——即机器应连接到网络以提高生产力并减少停机时间。2012\
  \ 年，它推出软件帮助航空公司和铁路将数据迁移到云端，并与埃森哲合资成立 Taleris，这是一家将帮助航空业预测机械故障、减少航班延误或取消的初创公司。^(32)\n\
  \n### 制造设备 — TempuTech\n\nTempuTech 的大数据框架正影响着农业业务。该组织提供连接系统，监控理想的谷物库存并识别系统中的潜在危险（即谷物提升机）。\n\
  \n可观测到断带或轴承损坏等危险。谷物管理系统可跟踪谷仓的湿度和温度，允许手动调整空气流通和风扇设置以应对变化。该信息还会发送给农场操作员，他们可利用它预测考虑天气变化后的湿度和温度变化。^(33)\n\
  \n### 自动化食品生产 — King's Hawaiian\n\nKing's Hawaiian 面包加工厂与罗克韦尔自动化合作，利用专用机器建立了一个高度自动化的面包烘焙设施。员工拥有额外工具来监控面包生产，并可通过互联网随时随地监控运营。收集的信息使该组织能够减少机器潜在停机时间并降低维护成本。^(34)\n\
  \n## 知识检查 5\n\n**5. TempuTech 用于农业大数据的哪个方面？**\n\n1. 谷物提升机。\n2. 联合收割机。\n3. 约翰迪尔拖拉机。\n\
  4. 施肥机。\n\n### 物流传感器 — UPS\n\nUPS 利用传感器信息和大数据分析来节省资金、提高效率并减少环境影响。车辆传感器监控速度、每加仑英里数、里程、停靠次数和发动机健康状况。传感器每天为\
  \ 80,000 辆车队中的每辆车捕获 200 多个数据点。基于这些数据，怠速时间、燃油消耗和有害排放均有所减少。\n\nUPS 还使用道路集成优化与导航 (`ORION`)\
  \ 来优化配送路线。`ORION` 利用数亿个位置数据点优化路线。^(35)\n\n### 数据分析 — 大型卖场\n\n沃尔玛正在对来自 10 个站点的客户和交易信息进行数据分析。西尔斯和\
  \ Kmart 试图利用大数据增强促销活动、优惠券和优惠的个性化，以更好地与沃尔玛、塔吉特和亚马逊竞争。作为该领域的先驱，亚马逊使用 100 万个 `Hadoop`\
  \ 集群来支持其联盟网络、风险管理、机器学习和网站更新。^(36)\n\n### 数据分析 — 视频游戏\n\n视频游戏行业正利用大数据跟踪游戏玩法、预测分发模式，并每天分析超过\
  \ 500GB 的结构化信息和 4TB 的运营日志。\n\n行业增长的一个副作用是视频游戏生成的数据量增加。视频游戏数据来自多个来源：游戏玩法数据、微交易、时间戳、社交媒体、价格点、支付系统、游戏内广告、虚拟商品、多人互动、实时事件和内容更新等。\n\
  \n为分析近 20 亿视频游戏用户每天生成的海量结构化和非结构化数据，公司正使用各种工具，如 `Hadoop`。大数据使视频游戏发行商能够跟踪玩家的进度和活动，以识别游戏中的任何瓶颈或难点。该信息可用于改善玩家体验的许多方面，包括重新评估游戏的某些方面，以免沮丧的玩家弃游。\n\
  \n### 超级计算机和基因组数据库 — 西奈山伊坎医学院\n\n西奈山医院因拥抱数据科学家和超级计算机以构建未来医院，在大数据领域也举足轻重。这家纽约市医疗中心正在招募硅谷顶尖人才，建设一家基于患者基因组预测疾病的设施。这将使医院能够预判疾病、减少常规医院就诊次数，并简化电子病历。西奈山努力的核心是一台名为\
  \ `Minerva` 的 300 万美元超级计算机，它能快速处理数 GB 的健康信息，以及 `BioMe`，一个包含 25,000 多名患者基因组样本的数据库。^(37)\n\
  \n### 客户数据库 — 银行业\n\n银行业也在追求大数据。摩根大通创建了大量信用卡信息和其他关于美国购物者的价值型信息。最终，该银行将包含 15 亿条数据的数据库与美国政府公开可获取的经济统计数据进行了整合。大通利用新分析了解客户购买模式和洞察，并将这些报告提供给银行客户。这一创新使银行能在短时间内将其\
  \ Visa 信用卡客户细分为更小的群体。随后可调查这些群体内的客户留存模式。\n\n花旗银行是另一家探索不同途径的银行，旨在向企业客户提供从其全球客户群收集的价值型信息，客户可利用这些信息识别新的贸易模式。^(38)\n\
  \n## 知识检查 6\n\n**6. 大通将信用卡数据与什么整合？**\n\n1. 行业经济统计数据。\n2. 美国政府经济统计数据。\n3. 协会经济统计数据。\n\
  4. 驾照记录。\n\n### 共享信息 — 金融服务\n\n组织不仅自己使用信息；他们还欢迎他人探索和使用他们的信息。\n\nIntuit 已为开发人员推出一项计划，提供以下访问权限：\n\
  \n- 目前支持超过 6500 万条记录和 1100 万用户。\n- 来自美国和加拿大 19,000 多家金融服务机构的财务信息。\n- 汇总的消费者和企业财务账户数据，以及自动分类的交易。\n\
  \n\n\n* 用于经济高效、自助式数据访问的安全应用程序编程接口。\n* 适用于 .NET 和 Java 的软件开发工具包，以加快应用程序开发。\n\n另一个金融服务机构利用开放客户数据访问权限来改进服务的例子是法国农业信贷银行。这家法国银行创建了一个口号为“为您开发，由您开发”的开发者计划。CA\
  \ 应用商店是一个共同创建平台，它将银行客户及其应用需求与独立开发者联合起来，并让开发者能够访问匿名化的银行信息。^(39)\n\n### Kaggle — 大数据竞赛\n\
  \nKaggle 是一个大数据竞赛托管平台。公司和研究人员在 Kaggle 上发布其原始数据，以便来自世界各地的专业和业余统计学家对其进行分析。谁想出了最好的预测模型或脚本，谁就能赢得现金奖励，有时还能获得托管公司的工作。这种分析大数据的众包方法吸引了沃尔玛、州立农场保险公司和通用电气等知名公司，以及数据科学领域最聪明的人才。^(40)\n\
  \n### Gnip 社交网络接口 — 国会图书馆\n\nGnip 是一个应用程序编程接口 (API)，允许其客户访问每一个在线社交媒体网络流，包括 Twitter、Facebook\
  \ 和 Disqus。Gnip 的服务让客户能够按关键词、模式、趋势和地理位置等特征筛选和解析社交网络流。除了被 Twitter 收购并提供对 Twitter\
  \ 完整真实推文流的访问（国会图书馆即在使用该流）之外，该机构还提供交钥匙解决方案，可从多达六个不同来源收集社交数据。^(41)\n\n### 大数据 — 欺诈漏洞\n\
  \n索赔或交易欺诈被识别得越早，就能越早被制止和纠正。大数据可能掩盖欺诈，但它也可能成为更快识别欺诈模式的途径。很多时候，欺诈是在发生很久后才被发现，此时损害已造成，剩下的只能是将损失降到最低并调整流程以防止欺诈再次发生。大数据平台可利用分析来搜索指示欺诈的模式，确定哪些地区或地点的欺诈率较高，甚至测试网络漏洞。^(42)\n\
  \n### MongoDB — 芝加哥市\n\n芝加哥市正在使用 MongoDB，通过实时收集和分析来自 30 多个不同部门的地理空间信息，以最大限度地减少犯罪并增强市政服务。例如，在某个特定区域，该市可能会评估\
  \ 911 报警电话和投诉的数量、损坏的路灯、被盗的垃圾桶、酒类许可证和废弃建筑，以验证犯罪激增的可能性是否高于正常水平。该市需要融合结构化和非结构化数据，大规模地进行融合，并在内部进行分析。最终，该市希望以预测的方式使用这些数据，在犯罪或安全问题发生之前进行预防。芝加哥已向公众开放其数据，允许其他人创建新服务，例如当扫地车即将到达居民所在区域时提醒居民的应用程序。^(43)\n\
  \n### Microsoft Azure — 巴塞罗那市\n\n巴塞罗那是世界移动通信大会的年度主办城市，自身也正成为一个创新中心。\n\n该市提供运行在全市\
  \ Wi-Fi 网络上的智能停车计费器，为居民提供关于停车位置的实时报告，并允许他们使用电话支付。智能公交站通过触摸屏面板为旅客提供持续更新，全市范围的传感器系统向居民通报温度、空气质量、噪音水平和行人活动情况。\n\
  \n巴塞罗那在 Microsoft Azure 上构建了一个大数据系统，以处理和分析其获取的众多数据点。借助框架生成的信息，该市可以提供更好的服务，例如公共交通，更有效地规划像\
  \ La Merce 节日这样的活动，并更好地评估旅游业的影响。^(44)\n\n### 知识检查\n\n**7. 巴塞罗那为其客人和市民提供什么？**\n\n\
  1. 关于停车位置的实时报告。\n2. 关于汽车租赁的实时信息。\n3. 关于餐饮地点和营业时间的实时信息。\n4. 关于酒店住宿的实时信息。\n\n### RFID\
  \ 传感器 — 迪士尼世界的 MagicBand\n\n迪士尼世界正在其 MagicBand 项目中使用大数据。MagicBand 是一项 10 亿美元的投资，用于一种可穿戴的、装满传感器的腕带，游客可用它做从登记客房、购买午餐到预订特定景点排队位置等一切事情。\n\
  \n佩戴者通过将腕带轻触接收器，在特定站点“签到”，它通过 RFID 追踪他们的路径，因此迪士尼收集了游客在整个游乐园内的移动信息。利用这些信息，迪士尼可以接待更多游客，高效地为游乐设施和景点配备人员，并更好地管理高流量商店和餐馆的库存。^(45)\n\
  \n### 蓝牙传感器 — Alex and Ani\n\nAlex and Ani 是一家珠宝连锁店。它在店内安装了蓝牙传感器，可追踪活动并在顾客进入时向其手机推送更多定制优惠。\n\
  \n该公司还与技术创新公司 Swirl 合作。该应用程序追踪顾客在店内的行走习惯，就像热力图一样，以便该机构能够更好地整理和陈列商品以呈现给顾客。^(46)\n\
  \n### MongoDB — 大都会人寿客户服务\n\n大都会人寿拥有超过 1 亿客户和 100 多种产品。其后台系统涉及一个庞大的孤岛应用网络，使得客户和代理人难以获取正确数据。使用\
  \ MongoDB，大都会人寿创建了一个应用程序，提供客户的单一视图，汇总来自 70 多个现有系统的客户和产品数据，并使其可供客户和代理人访问。此外，它仅用三个月就构建了该应用程序。因此，供应商缩短了解决客户问题的时间，提高了客户满意度，让代表们有机会利用实时分析进行交叉销售和向上销售。^(47)\n\
  \n### 知识检查\n\n**8. 大都会人寿如何使用大数据？**\n\n1. 评估个别客户的风险。\n2. 交叉销售产品。\n3. 通过按地理区域汇总客户数据来评估风险。\n\
  4. 检测欺诈交易。\n\n### IBM 预测性交通管理 — 法国里昂\n\n去过大城市的人都知道交通拥堵是个真问题。它影响着不得不忍受令人愤怒的延误的居民的健康和福祉，也影响城市的经济健康。法国的一座城市决定使用\
  \ IBM 的预测性交通管理软件主动管理交通拥堵。\n\n法国里昂的交通部门官员将实时交通数据与高级分析相结合，以帮助主动管理交通拥堵。这意味着司机在交通拥堵中花费的时间更少，因为可以快速实施绕行措施，并提供替代路线建议。\n\
  \n他们是如何做到的？\n\n* 向城市提供如何重新规划交通路线以避免拥堵的信息。\n* 安排送货卡车在不那么拥堵的时间行驶。\n\n\n\n交通管理人员评估事故、预测后果，并快速决定如何恢复交通流量。解决方案可能是调整交通信号以允许车辆快速绕行，或发布信息提醒驾驶员注意事故。^(48)\n\
  \n### Evolv — 施乐人力资源\n\nEvolv 也是挖掘员工绩效以帮助降低离职率和最小化 HR 成本的大数据的重要组成部分。大数据同样正在改变组织雇佣和管理员工队伍的方式。与其他\
  \ HR 程序一样，Evolv 通过查看能力、工作经验和身份特征，帮助高管更好地了解员工和求职者。然而，Evolv 将其推向了更深层次，处理超过 5 亿个关于燃气成本、失业率和在线社交网络使用情况的数据点，以帮助像施乐这样的客户——后者已将人员流失率降低了\
  \ 20%——预测例如员工何时注定要离职。Evolv 的信息还提供了大数据研究人员发现的其他见解：拥有两个社交网络账号的人表现比拥有更多或更少账号的人高得多，并且在许多职业中——例如呼叫中心工作——有犯罪记录的员工表现比记录良好的人更好。^(49)\n\
  \n## 练习题\n\n1. 消费电子展上重点介绍了哪些传感器？\n2. 据估计，福特 Fusion 每小时产生多少 GB 的信息？\n3. 迪士尼世界正在使用什么产品来改善客户体验以及游乐园的人流？\n\

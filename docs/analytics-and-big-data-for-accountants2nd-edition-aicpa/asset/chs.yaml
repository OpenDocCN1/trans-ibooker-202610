- "# 第 6 章：大数据最终用户与会计工具\n\n## 学习目标\n\n* 认识优化如何用于大数据。\n* 回顾电子零售业务中大数据的实际案例。\n* 识别其他大数据资源。\n\
  \n## 简介\n\n本章探讨可用于大数据分析的会计工具。读者可能熟悉其中一些工具，但可能未曾考虑将这些工具作为分析大数据的资源。其中一种工具在分析销售生成和推荐方面非常有用。我们将通过一个真实案例来开始讨论大数据的应用，该案例使用了从全国性零售商提取的数据。该案例将说明如何访问、剖析和评估大数据，既包括数据中包含的信息，也包括从大数据中得出的推论。\n\
  \n## 大数据实际案例\n\n在本节中，参与者将接触一个真实的大数据案例。在查看案例时，请记住以下几点：\n\n* 注意真实大数据的“外观”。\n* 判断是否能在大数据中识别出任何趋势。\n\
  * 推测趋势是如何变化的。\n* 根据数据确定管理层可采取的行动。\n\n## 访问实际企业数据的案例 — 百思买\n\n百思买允许公众访问其部分大数据。您可以通过访问\
  \ [`https://developer.bestbuy.com/`](https://developer.bestbuy.com/) 来获取数据。\n\n\
  ![](img/ufig6-1.png)\n![](img/ufig6-2.png)\n\n有必要获取 `API key`，因此请点击图像中间显示“Get API\
  \ Key”的框。访问相关应用程序时将分配并使用一个密钥。\n\n在本章中，我们将演示百思买的开发者计划。\n\n### `Query Builder`（查询构建器）\n\
  \n`Query Builder` 通过创建自定义查询，帮助用户充分利用百思买 API。您可以为自己的自定义查询创建基础，或使用 `Query Builder`\
  \ 访问百思买 API 数据。您甚至可以自定义响应以更好地满足您的目的。\n\n访问百思买开发者工具的百思买及其他公司应用程序示例及其功能包括以下内容：\n\n\
  ### `IFTTT`\n\n`IFTTT` 通过一个简单的语句帮助您建立强大的连接：“If This, Then That”（如果这样，那么那样）。`IFTTT`\
  \ 已经与 Facebook、Evernote、LinkedIn、电子邮件等渠道集成，现在也包括百思买。通过百思买渠道，您可以创建包含产品价格、趋势和可用性变化的\
  \ `IFTTT` 配方。请查看 `IFTTT` 上百思买的示例配方。\n\n### `Factual`\n\n`Factual` 的 Global Places\
  \ 是一个权威数据库，包含 50 个国家中超过 6500 万家本地企业和兴趣点的名录。Global Places 利用商店 API 整合了 1000 多家百思买门店位置的数据，为全球开发者提供可靠信息。\n\
  \n### `Listia`\n\n`Listia` 是一个流行的在线市场，允许用户发布不再需要的物品以赚取积分，积分可兑换其他用户发布的物品或百思买及其他零售商发布的新商品。通过与\
  \ `Listia` 合作，百思买正在帮助客户减少杂物，将仍可使用的电子产品从垃圾填埋场中拯救出来，并为新科技装备寻找好归宿。\n\n### `TrackIf`\n\
  \n`TrackIf` 是一个创新的购物聚合器，可搜索网络以精确找到您正在寻找的产品。`TrackIf` 将搜寻其合作伙伴网站以找到当天的最佳优惠，以及价格下跌和供货通知。\n\
  \n### `ShopSavvy`\n\n百思买与 `ShopSavvy` 的合作使客户即使在实体店购物也能找到低价在线价格。购物者可以使用 `ShopSavvy`\
  \ 应用程序扫描店内商品，以比较竞争对手价格、寻找促销活动、进行在线购买等。\n\n### `CitiBank`（花旗银行）\n\n`CitiBank` 的 ThankYou\
  \ Rewards 允许客户通过使用参与活动的信用卡或支票账户赚取积分。这些积分可兑换各种产品，包括来自百思买的平板电脑、游戏机和其他电子产品。客户可以在最近的百思买门店自提，或选择商品配送，这为各行各业的购物者提供了便利典范，也是百思买客户的绝佳发现工具。\n\
  \n### `Jifiti`\n\n`Jifiti` 是一个巧妙的应用程序，适合任何厌倦了为即将到来的生日或其他活动暗示却无果的人。建议礼物清单会呈现给您的活动客人，他们的礼物将作为虚拟礼品卡落入您的电子邮箱。这是一份贴心的礼物，让送礼者和收礼者都能灵活选择心仪的物品。\n\
  \n### `Best Buy App`（百思买应用）\n\n`Best Buy App` 将一家百思买商店装进您的口袋。浏览完整目录、阅读评论、比较规格、追踪\
  \ My Best Buy 奖励积分等。您甚至可以直接通过手机购买商品，选择送货上门或到店自提。\n\n### `RedLaser`\n\n`RedLaser`\
  \ 应用程序允许用户在大多数主要零售店扫描 `UPC` 和 `QR` 代码，并接收即时价格比较，引导您找到最低可用价格，以及任何适用的优惠券或特别优惠。您甚至可以通过在应用程序内购买来减少网页浏览时间，My\
  \ Best Buy 客户甚至可以扫描他们的卡片以即时访问忠诚度福利。\n\n### `FindTheBest`\n\n`FindTheBest` 是一个在线研究引擎，提供关于\
  \ 2000 多个主题的详细信息，使人们能够自信地进行研究。`FindTheBest` 利用我们的 `Products API` 包含百思买产品的及时定价和产品详情。\n\
  \n作者收到访问数据的密钥（通过电子邮件）后，返回到前面提到的图库页面并点击了 `Query Builder`。\n\n下图描述了访问百思买目录的过程。\n\n\
  ![](img/ufig6-3.png)\n\n来源：百思买网站，[`http://bestbuyapis.github.io/bby-query-builder/#/productSearch`](http://bestbuyapis.github.io/bby-query-builder/#/productSearch)。\n\
  \n请注意，查询中可以包含许多选项，例如 `category` 和 `attribute`。（请参阅以下图片。）\n\n![](img/ufig6-4.png)\n\
  ![](img/ufig6-5.png)\n\n作者输入了 `data key` 并运行了 `most viewed products` 的查询。下图显示了 `query\
  \ detail`。\n\n![](img/ufig6-6.png)\n\n## 知识检查\n\n1. `Query Builder` 允许用户做什么？\n \
  \   1. 执行“假设”分析。\n    2. 处理不再需要的电子物品。\n    3. 为百思买产品编写自定义查询。\n    4. 使用软件创建用于数据分析的“如果这样，那么那样”语句。\n\
  \n\n\n\n\n### 2. Best Buy 属性中**没有**哪个字段？\n\n1.  销售价格。\n2.  原价。\n3.  折扣。\n4.  节省百分比。\n\
  \n### 3. 为了允许 Best Buy 查询运行，用户必须做什么？\n\n1.  拥有数据挖掘软件的访问权限。\n2.  获取 API 密钥。\n3. \
  \ 能够阅读 HTML。\n4.  获取 Best Buy 字段转换程序。\n\n### 练习\n\n以下页面旨在按以下格式包含。除非你有 IT 背景，或者你有一个可以自动解读图像的程序，否则很难阅读。因此，读者应该独自或与搭档一起花费几分钟来消化这些信息。你在细节中注意到了什么？\n\

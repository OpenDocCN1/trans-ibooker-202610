  \ 2016 年 3 月 21 日, [`www.mongodb.com/customers/city-of-chicago`](https://www.mongodb.com/customers/city-of-chicago).\n\
  \n44. Forrest.\n\n45. Cliff Kuang, “Disney’s $1 Billion Bet on a Magical Wristband,”\
  \ *Wired*, 2015 年 3 月 10 日, [www.wired.com/2015/03/disney-magicband/](http://www.wired.com/2015/03/disney-magicband/).\n\
  \n46. Claire Swedburg, “Alex and Ani Rolls Out Swirl’s Bluetooth Beacons at 40 Stores,”\
  \ *RFID Journal*, 2014 年 2 月 24 日, [www.rfidjournal.com/articles/view?11475](http://www.rfidjournal.com/articles/view?11475).\n\
  \n47. “Rethinking the Customer Experience at MetLife,” *mongoDB*, 访问于 2017 年 3 月\
  \ 30 日, [www.mongodb.com/customers/metlife](http://www.mongodb.com/customers/metlife).\n\
  \n48. “This French City Said Au Revoir to Traffic Jams,” *People 4 Smarter Cities*,\
  \ 访问于 2019 年 3 月 15 日, [`www.ibm.com/smarterplanet/us/en/smarter_cities/overview/`](https://www.ibm.com/smarterplanet/us/en/smarter_cities/overview/).\n\
  \n49. Mark Feffer, “HR Moves Toward Wider Use of Predictive Analytics,” *Society\
  \ for Human Resource Management*, 2014 年 10 月 6 日, [www.shrm.org/hrdisciplines/technology/articles/pages/more-hr-pros-using-predictive-analytics.aspx](http://www.shrm.org/hrdisciplines/technology/articles/pages/more-hr-pros-using-predictive-analytics.aspx).\n\
  \n\n\n\n\n### 简介\n\n会计师也不熟悉各种形式的流数据，也不熟悉为分析目的而检索数据。流数据的示例包括社交媒体讨论和机器传感器数据。有些会计师可能怀疑非结构化数据或流数据是否有任何价值。然而，在财务职能的拓展角色中，为组织增加价值的概念已超越传统财务角色。以下图片最能说明这一点：\n\
  \n![](img/ufig8-1.png`)\n\n来源：Lindell, James, *Controller as Business Manager*（《财务总监作为业务管理者》)。(AICPA,\
  \ 2014)。\n\n结构化数据存在于明细或商品层面、业务战略层面和行业战略层面。行业战略层面的数据很可能需要被查找、下载、清洗和分析。结构化数据也可能存在于最宏观的趋势层面，尽管它需要以与行业层面数据相同的方式进行处理。\n\
  \n非结构化数据和流数据可以存在于所有层面。会计师有责任确定以下事项：\n\n*   有哪些数据可用？\n*   如何访问这些数据？\n*   分析和转换数据为有用信息需要哪些工具？\n\
  \n值得注意的是，在结构化、非结构化和流数据领域中未被访问的数据，有可能为会计部门创造的价值带来显著增加。\n\n本章将阐述将大数据方法应用于日常会计职能的方法，以及为运营团队使用大数据和数据分析的途径。\n\
  \n### 面向 CFO 的大数据\n\n据 Infochimps（IT 咨询巨头 Computer Sciences Corporation 的子公司）称，大数据对当今的企业财务战略至关重要。\n\
  \n在过去的实践中，控制或合规问题、资金问题和财务报告是财务高管的主要关注点。CFO 已演变为整个公司和运营单元的战略业务合作伙伴。此外，他们已成为 CEO 的亲密顾问。如今的\
  \ CFO 将参与战略、董事会事务、收入开发、成本控制和盈利能力等诸多任务。在许多情况下，CFO 和财务总监将被要求承担法律、人力资源和信息技术领域的额外职责。CFO\
  \ 的职位描述比其他任何企业高管职位的变化都大，这并不令人惊讶。\n\n大数据比 CFO 近年见到的任何其他创新都更适用于企业财务战略。大数据使 CFO 能够访问和了解以前无法触及的领域。这将使\
  \ CFO 预判业务需求。大数据如何帮助 CFO 的一些示例包括以下内容：\n\n*   通过信息驱动规划、滚动预测和多年规划，对业务的整体维度进行规划和预测。\n\
  *   通过不断筛选每个场合和交易的关注点，寻找那些经常被忽视的欺诈迹象或其他业务风险因素，从而将风险和欺诈降至最低。\n*   用于月度账簿、法定报告和差异分析的高级财务和管理分析。\n\
  *   利用前沿成本分析、产品或客户生存能力分析以及分摊进行盈利能力建模和优化。\n*   利用创新数据可视化进行综合记分卡管理的财务系统管理。\n*   以前不可能进行的财务、比率和相关信息分析，可带来新见解、新应用，并提升公司盈利能力和价值。\n\
  \n### 知识检查\n\n1.  根据文本，哪项陈述最准确？\n\n    1.  大数据的重要性仅次于既定文化。\n    2.  大数据的重要性仅次于精益管理技术。\n\
  \    3.  大数据比 CFO 近年见到的任何其他创新都更适用于企业财务战略。\n    4.  大数据将在寻找组织内部的浪费做法中发挥重要作用。\n\n\
  有趣的是，CFO、CIO 和 CEO 可以合作，凭借快速实施大数据方案且无需雇佣新开发团队的成本，从而提升企业绩效。\n\n### 大数据关注领域\n\n在上一章中，我们探讨了大数据的大量应用，从交通流管理到烘焙更好的面包。将大数据分析应用于会计的机会同样广泛。那么，大数据可以应用在哪些具体领域呢？\n\
  \n*   应收账款\n*   应付账款\n*   重复付款检测\n*   抽样\n*   数据导入、提取和分析\n*   持续审计和监控\n*   欺诈检测和监控\n\
  *   采购卡分析\n*   工资单和工时表\n*   关联与比较\n*   存货审计\n\n我们将在后续章节中更深入地探讨这些领域。\n\n### 应收账款\n\
  \n据 Ventana Research 称，大数据应用可用于应收账款，以提升客户满意度和忠诚度。¹ 例如，对付款模式进行初步调查的组织可以大致了解特定客户何时付款。假设一位通常在每月特定日期间支付余额的客户，在其惯常付款日期过后一周仍未付款。通过应用大数据分析，系统会自动生成警报并触发后续行动。可能会给客户打电话，或发送自动邮件通知，告知客户付款延迟事宜。这种方法有几个优势。如果没有其他例外情况，仅仅是客户应付账款\
  \ (AP) 部门跟进不力，这些通知应能促使纠正行动。这也是一种比其他惩罚性措施更及时、更可取的方法。更早解决应收账款 (AR) 问题可改善现金流，如果贵方有过错，当你要求付款时，客户会感到不满。\n\
  \n大数据在应收账款中的另一个用途是识别经常晚付账单的客户。这可能引发内部讨论，探讨可能的解决方案，如限制信用额度或寻找催促更快付款的方法。\n\n数据分析对估计虽有价值，但若结合审计和预警，获利可能显著增加。数据分析可以识别出一种模式，以便将实际付款与之比较。当付款偏离预期时间框架时，这可以创建一个预警系统。当客户陷入财务困境时，忽视供应商（即贵组织）是常态。\n\
  \n组织有哪些方法可以利用大数据支持 AR，而这些方法在过去可能未被使用？\n\n*   搜索流媒体（社交媒体、Google Alerts 等）中关于客户财务状况的任何评论。\n\
  *   跟踪额外的汇款信息，这些信息可能表明客户正在扣留付款。\n*   确定客户的财务状况，并与行业基准进行对比。\n*   评估已占用信用额度或有争议项目的历史变化。\n\
  *   按销售人员、地区、行业等细分 AR 客户绩效。\n*   预测客户付款行为，并实时管理客户信用风险。\n\n### 知识检查\n\n1.  哪一项**未**被列为帮助处理和催收\
  \ AR 的方法？\n\n    1.  搜索流媒体。\n    2.  搜索非结构化汇款信息。\n    3.  建立有效的催款流程。\n    4.  对\
  \ AR 进行分层，并关注前 80% 的价值。\n\n\n\n\n### 应付账款\n\n鉴于应付账款 (AP) 包含的海量数据，预测性分析是最具增值作用的流程。许多人表示他们正在评估供应商主文档内的数据，而其他人则表示其预测性分析的重点在于采购付款分析、运营支出审查（主要关注应付账款）以及供应商付款验证。²\n\
  \n1. 按支出金额排名，谁是主要供应商？\n2. 应付账款天数与基准及应收账款天数相比处于什么状态？每天/月/季度处理的发票数量是多少？\n\n### 重复检测\n\
  \n一项常被忽视且可用于资产追回的程序是重复付款检查。这是一种发现追回资金、会计错误、异常值、欺诈或异常情况的方法。大数据能大幅缩短调查重复付款、发票、交易和供应商退货贷项所需的时间。\n\
  \n建议每年下载一次支出数据。数据应在电子表格中根据发票号码、日期、金额等进行排序。请记住，内置于应付账款系统中的传统防护措施早已被应付账款职员通过简单地添加“破折号”或“A”字母来绕过，以欺骗软件认为发票是原始的。\n\
  \n### 知识检查\n\n1. 推荐使用什么工具来检查重复付款？\n    1. 外包财务人员。\n    2. 数据库。\n    3. 电子表格。\n \
  \   4. 流式数据。\n\n### 抽样\n\n抽样是审计工作的一个主要方面，鉴于可用的方法多种多样，抽样成为数据分析增值的领军者之一也就不足为奇了。一个流行的工具是使用\
  \ `IDEA` 统计抽样技术来确定范围。通过良好的统计分析，结果可以推断到总体数据。统计函数、汇总和分层帮助管理层分析数据以进行预测和评估过往表现。\n\n\
  分层抽样可用于查看回溯交易的损益、对发票和付款进行分层，以及执行随机抽样。数据分析同样用于测试和执行唯一关键词搜索。数据分析技术提供的众多优势之一是能够细分总体数据的所有数据，这与仅查看百分比的抽样形成对比。\n\
  \n无论如何，数据分析允许您连接、排序和汇总信息，以分析较小的数据集。\n\n### 数据导入、提取和分析\n\n对大多数审计师和会计专家而言，最大的困难在于知道在哪里应用数据分析——获取所需信息并将其导入分析工具。数据分析编程工程师在简化数据导入方面取得了巨大创新，使用的工具包括\
  \ `PDF` 转换器、拖放功能以及数据容量限制的扩展。新技术还允许根据特定标准（如名称或客户代码）进行提取。而且像 `IDEA` 和 `ODBC` 这样的工具比\
  \ `MS query` 或 `SQL` 能节省数百个工时，因为它们允许更高效的下载、检查和汇总信息。\n\n审计师正在使用数据分析来执行财务交易的大量下载，连同摘要和分析，以协助在审查中确定范围和进行测试。例如，医疗服务行业的一位内部审计师正在使用数据分析从企业资源规划应用程序获取付款数据，以审查周末付款日期、重复记录搜索和账户编码错误。\n\
  \n### 持续审计和监控\n\n数据分析用于自动化手工程序并通过持续监控定期测试系统。可实施专门程序以建立不间断的审查脚本，以检测数据录入错误以及差旅娱乐、预算和财务报表异常、采购卡、\
  \ `HR` 和应付账款方面的异常。\n\n虽然监控可以识别实时异常，但会计师通常只按月或按季度处理更为可行。持续监控将取决于错误发生的可能性、错误的严重程度或现有的其他控制措施。\n\
  \n其他应考虑纳入持续监控的领域包括合规性、信用信息、市场数据、财务信息以及任何其他重大变化。\n\n此外，还应考虑通过以下方式监控主要行业趋势和公司趋势：\n\
  \n* `Google alerts` (Google 警报)\n* 社交媒体帖子、推文等\n* 犯罪记录发布\n* 来自 `SEC` 报告的管理层讨论与分析\n\
  \n### 知识检查\n\n1. 以下哪项未被列为大数据分析的困难？\n    1. 在哪里应用数据分析。\n    2. 获取必要信息。\n    3. 拥有分析数据的正确工具。\n\
  \    4. 将数据导入系统。\n\n### 欺诈检测和监控\n\n虽然您可能在寻找异常或怪异之处时发现欺诈，但许多会计师正将数据工具作为科学手段来追查欺诈和舞弊计划。数据分析工具允许从不同角度审查信息，以确定欺诈情况的真实原因。数据分析用于寻找欺诈模式的方法包括趋势分析、行为分析和支出模式变化。\n\
  \n### 采购卡分析\n\n采购卡减少了处理小额采购和过账交易所需的行政工作量。然而，采购卡也带来了额外的控制风险。虽然采购卡帮助应付账款部门实现了“精益化”，但必须通过适当的控制来加以管理，以减少滥用和浪费。会计师必须持续检查活动以分析趋势和支出模式。管理应付账款的相同流程应适用于汇总采购卡和个人采购卡。如果存在不当行为，应在分析过程中被检测出来。\n\
  \n### 工资单和工时表\n\n追查与工时表和工资单相关的错误或欺诈对审计师来说可能非常耗时。Audimation Services 进行的一项调查的受访者表示，他们执行“每周工资总额或整体合理性测试”，或者每季度对采购付款、收入、日记账分录和工资单执行\
  \ 30 多项检查程序。³ 数据分析还通过审查电子考勤记录的一致性和合规性（符合现有安排、制度和劳动法规）来增加价值。\n\n一位受访者表示，他们将“在每周向\
  \ `ADP` 传输前审查工资单所需的时间从数小时缩短到了 30 分钟以内。”⁴\n\n### 连接和比较\n\n数据分析传达的最优秀特质之一是连接数据库和记录以对信息进行排序、汇总和调查的能力。这使得能够从不同角度查看信息，以追踪异常、错报、错误和其他数据。当数据库或文件被连接后，可用于检查异常、执行存货周转分析和库存分析、从\
  \ `PDF` 中提取数据以创建新分析、核对未兑现清单，并替换手工转换流程。\n\n连接流程可用于比较数据集的一些示例包括：\n\n* 将活跃的应用程序用户账户与离职员工名单进行比对\n\
  * 将医生排班系统与计费系统进行比较\n* 供应商条款，包括提前付款天数和应收账款账龄\n* 缺失的发票号码\n* 将员工和 `HR` 记录与供应商地址进行比较\n\
  \n\n\n* 税号和利益冲突\n* 根据合同协议审查账单和定价协议\n\n### 存货审计\n\n分析工具也被用于分析存货。它们可用于以下方面：\n\n* 存货审计\n\
  * 识别滞销项目\n* 识别呆滞项目\n* 核对存货数量\n* 实施盘点测试\n* 固定资产盘点\n\n### 集中式会计与数据挖掘\n\n当公司拥有集中式数据库时，执行数据挖掘分析会更容易。请考虑供应商分析、客户分析、费用分析、分录分析等。\n\
  \n### 合规\n\n数据分析在满足行业和文档要求方面很有价值。内部审计职能可以利用数据分析来安排、执行和报告 SOX 合规性，以及审查其他领域和程序。\n\n\
  ### 数据仓库\n\n数据分析被用于帮助制定包含遗留系统的数据仓库策略。\n\n### 全量测试\n\n过去，数据分析在收集可访问、处理和分析的大量数据方面能力有限。如今的数据分析实现了这一能力，因此数据量可以增加——可能达到全量数据，而不是依赖样本数据和相应的推断。\n\
  \n### 对账\n\n数据分析的强大功能允许对数据进行更深入的分析和对账。某些政府合同要求极高的准确性。然而，在数据分析出现之前，数据量和报告层级使得这一要求难以维持。\n\
  \n### 收入报告\n\n使用数据分析进行收入报告可实现不同数据库的整合，使全公司范围的报告更快、更高效。类似于其能够增强和改进政府报告的方式，数据分析也提高了计算收入确认的能力，达到了以前无法实现的水平。\n\
  \n### 创新用途\n\nAudimation 调查的受访者还指出了数据分析的其他一些创新用途，包括以下内容：\n\n* 每小时能源竞价分析\n* 分析续约期间的客户行为\n\
  * 分析客户提供的调查问卷\n* 衡量促销计划的充分性\n* 分析学生入学情况\n* 审核账单\n* 监控《反海外腐败法》\n* 将学生数据与在线学习系统集成\n\
  * 评估风险\n* 分析坏账医疗债务\n* 测试不同系统日志中的数据\n* 分析银行系统中的电汇异常\n* 评估贷款和分析投资组合⁵\n\n其他创新用途的示例包括以下内容：\n\
  \n* **数据可视化 — 下钻、交互、图表**：新工具让用户无需大量培训即可参与数据分析。\n* **会计与聊天机器人 — AI 聊天机器人**：聊天机器人用于高效解决客户的常见问题或查询，包括最新账户余额、特定账单到期日、账户状态等。⁶\n\
  * **报告与数据挖掘**：正如我们在 Power BI 简要概述中所见，使用 BI 软件进行差异分析、报告趋势和现有数据的数据发现具有无限可能。此外，一旦会计团队精通\
  \ BI 技术，获取外部数据进行剖析、分析和预测也将拥有无限可能。\n\n### 预测分析与会计\n\n预测分析和会计部门的角色是什么？请回顾来自第 1 章的以下定义：\n\
  \n> 预测分析是从现有数据集中提取信息以确定模式并预测未来结果和趋势的实践。预测分析不会告诉你未来将发生什么。它以可接受的可靠性水平预测未来可能发生的事情，并包括假设场景和风险评估。⁷\n\
  \n### 日产如何利用预测分析在自然灾害中幸存\n\n预测分析可以为您的公司创造竞争优势，甚至帮助其度过自然灾害。请看日产汽车和 2011 年海啸的案例。2011\
  \ 年 3 月 11 日，日本遭受地震及随后海啸的重创，造成 20,000 多人死亡，福岛第一核电站严重受损。\n\n随着国家开始复苏，显然对世界经济和日本组织的影响将是巨大的。日本组织受损将给全世界带来巨大的供应链中断。\n\
  \n日产汽车公司的 John Wilenski（CPA, CGMA）的数据分析在帮助日产在灾后保持运转方面发挥了重要作用。\n\n根据麻省理工学院 (MIT)\
  \ 和普华永道的研究，日产 45 多家关键供应商因灾难遭受严重损害。⁸ 幸运的是，日产在地震前收集的供应链分析数据帮助组织在重建过程中做出了明智的判断。这一成功是\
  \ Wilenski 创建的监控日产供应商流程的一部分。\n\n日产使用供应商首席财务官提供的预算信息和数据，通常每周甚至每天更新。Wilenski 的团队创建了不同的模型来评估供应商的财务健康状况，包括现金流评估工具、包含供应商“假设”场景的压力测试和盈亏平衡工具。这些工具基于供应商信息和全球经济数据。这一过程使日产能够确定哪些供应商能在灾难中幸存，哪些供应商需要帮助。\n\
  \nMIT 和 PwC 的报告指出，可靠的风险管理和有效的对策帮助日产在 2011 年底实现了产量 9.3% 的增长，而整个行业则出现了 9.3% 的大幅下降。⁹\n\
  \n### 执行数据分析的十大关键\n\nWilenski 正在为高等教育构建预测调查工具。以下是他实施数据分析的 10 条建议：¹⁰\n\n* **明确业务目标。**\n\
  \    * 预测破产或违约？\n    * 降低风险？\n    * 提高盈利能力？\n    * 降低成本？\n    * 留住员工？\n    * 吸引新客户？\n\
  * **寻找数据源。**\n    * 公司自有系统\n    * 外部来源\n        * 政府\n        * 协会\n        * 公共数据库\n\
  \        * 非结构化或流式数据\n    * 调查\n* 在最低详细级别构建。\n* 验证信息是否准确、及时和有用。\n* 确定数据质量。\n* 找出哪些信息可能具有预测性。可能需要汇总数据并确定其相关性。\n\
  * 实现自动化和计算机化，同时保留人工交互和干预的可能性。\n* 简单沟通，使用受众的语言。\n* 协作共事。获取支持和见解。\n* 持续改进模型。\n\n###\
  \ SEC 的分析项目\n\n以下摘录来自 Scott W. Bauguess（DERA 副主任兼副首席经济学家）于 2016 年秋季在美国会计协会发表的演讲“大数据让我们变懒了吗？”。请注意他在讲话中提到的\
  \ SEC 利用大数据的方式。\n\n\n\n### Application of Data Analytics at the SEC: From Classic\
  \ Statistical Modeling to Machine Learning\n\n#### Why These Perspectives Matter?\n\
  \nI have worked at the Commission for nearly a decade, during which I participated\
  \ in research on a wide range of policy issues. The economic analyses supporting\
  \ these policy decisions were primarily built upon theory-driven research by social\
  \ scientists. They rely on carefully constructed analyses to address causal inference\
  \ problems, which is critical for understanding the potential impact of new regulations.\n\
  \n#### Recent Changes\n\nBut over the past few years, I have witnessed the arrival\
  \ of increasingly complex data and new analytical methods for analyzing such data.\
  \ Some of these analytical methods have made previously impenetrable information\
  \ sets (e.g., unstructured data, such as free text) amenable to analysis. This is\
  \ particularly important for the SEC, as registrant filings are often presented\
  \ in the form of narrative disclosures. Consequently, we have launched a series\
  \ of new initiatives utilizing machine learning methods for behavioral prediction,\
  \ particularly in the area of market risk assessment, including identifying potential\
  \ fraud and misconduct.\n\n#### Adopting New Methodologies While Maintaining Core\
  \ Principles\n\nToday, the SEC, like many other organizations, is adopting these\
  \ new methodologies at a very rapid pace. Of course, this does not mean we are abandoning\
  \ classic statistical modeling. As I want to emphasize now, regardless of whether\
  \ our analytical projects are built on classic statistical modeling or machine learning,\
  \ **neither can replace human judgment**, and human judgment remains crucial to\
  \ making the output of our analytical models and methods actionable. To illustrate\
  \ why, let me give a few examples.\n\n#### Classic Statistical Modeling: Corporate\
  \ Issuer Risk Assessment (CIRA)\n\nLet's start with the Corporate Issuer Risk Assessment\
  \ (CIRA) project, which relies on classic statistical modeling developed by DERA\
  \ economists and accountants in collaboration with expert staff from the SEC's Division\
  \ of Enforcement. The project originated from an initiative initially known as the\
  \ \"Accounting Quality Model\" (AQM), which itself was rooted in academic research.\
  \ Specifically, the AQM focused on estimating earnings quality and identifying signs\
  \ of management's improper discretion in the use of accruals. As former DERA Director\
  \ and SEC Chief Economist Craig Lewis noted: \"The finance and accounting academic\
  \ community has long studied the information contained in financial statements to\
  \ better understand the discretionary accounting choices made when reporting financial\
  \ information to shareholders.\"[^iv]\n\nToday, the CIRA project provides these\
  \ earnings quality modeling metrics as part of more than 230 custom metrics available\
  \ to SEC staff. These metrics include earnings smoothing measures, auditor activity\
  \ measures, tax treatment measures, key financial ratios, and management behavior\
  \ indicators. Importantly, they are easily accessible to SEC staff through intuitive,\
  \ customized dashboards. Citing the collaboration between DERA and the Enforcement\
  \ Division's Fraud Group, Enforcement Director Andrew Ceresney noted earlier this\
  \ year: \"CIRA provides us with a comprehensive overview of the financial reporting\
  \ environment of the Commission's registrants and assists our staff in detecting\
  \ anomalous patterns in financial statements that may warrant further investigation.\"\
  [^v]\n\n#### Clarifying the \"Robocop\" Misconception\n\nHowever, the media initially\
  \ coined the term \"Robocop\" to describe the initiative when reporting on it—as\
  \ if a machine were making the critical decisions to identify potential market risks.\
  \ As our current DERA Director and Chief Economist Mark Flannery recently pointed\
  \ out: \"The implied view is, at best, inaccurate and, at worst, misleading. While\
  \ these activities use quantitative analysis to help prioritize limited agency resources,\
  \ the tools developed in DERA cannot—and do not—operate independently.\"[^vi]\n\n\
  #### Machine Learning and Text Analysis: The Most Exciting Developments\n\nBut at\
  \ the same time, some of the most exciting developments at the Commission are focused\
  \ on machine learning and text analysis. While machine learning methods have existed\
  \ since the 1950s[^vii], the advent of big data and high-performance computing environments\
  \ has advanced their application. At the Commission, this has taken several forms.\n\
  \nAt the most basic level, consistent with approaches now common in academic research,\
  \ we extract words and phrases from tabular and narrative disclosures in filings.\
  \ For example, by applying a programming technique that uses human-written rules\
  \ to define document patterns—known as \"regular expressions\"[^viii]—we have been\
  \ able to systematically measure and assess how emerging growth companies utilize\
  \ JOBS Act provisions through disclosures in their registration statements.\n\n\
  #### Topic Modeling and Sentiment Analysis\n\nMore recently, we have adopted topic\
  \ modeling[^ix] methods to analyze the tens of thousands of narrative disclosures\
  \ contained in registrant filings. For those unfamiliar with topic modeling, when\
  \ applied to a document corpus, it identifies groups of words and phrases associated\
  \ with different concepts (\"topics\") across all documents, and simultaneously\
  \ generates the distribution of topics found in each specific document. We also\
  \ use natural language processing techniques to perform sentiment analysis to assess\
  \ the tone of each filing[^x] (e.g., identifying filings with negative tone or vague\
  \ tone). We then use machine learning algorithms to map these topic and tone \"\
  signals\" to known risk measures—such as examination findings or past enforcement\
  \ actions. Once trained, the final model can be applied to new documents filed by\
  \ registrants, assigning risk scores based on historical findings across all filers.\
  \ This process can be applied to different types of disclosures or unique registrant\
  \ categories, and the results are then used to help us determine where investigative\
  \ and examination staff should prioritize their attention.\n\n#### Limitations of\
  \ Machine Learning: The Human Element Remains Indispensable\n\nHowever, while this\
  \ machine learning text analysis approach provides new and exciting ways to detect\
  \ potential market misconduct, just like classic modeling methods, **it cannot operate\
  \ independently**. In particular, while a model may classify a filing as high risk,\
  \ that classification does not provide a definitive indicator of underlying misconduct.\
  \ Rather, many machine learning methods typically do not point to specific actions\
  \ or behaviors indicative of fraud or other violations. **The human element remains\
  \ an essential part of the equation.**[¹¹]\n\n#### References\n\nThe Roman numeral\
  \ references included in the speech are as follows:\n\n[^iv]: Craig Lewis, Chief\
  \ Economist and Director, Division of Risk, Strategy, and Financial Innovation,\
  \ U.S. Securities & Exchange Commission, Financial Executives International Committee\
  \ on Finance and Information Technology, Dec. 13, 2012.\n\n[^v]: Andrew Ceresney,\
  \ Director, Division of Enforcement, U.S. Securities & Exchange Commission, Directors\
  \ Forum 2016 Keynote Address.\n\n[^vi]: Mark Flannery, Director, Division of Economic\
  \ and Risk Analysis, U.S. Securities & Exchange Commission, Global Association of\
  \ Risk Professionals Risk Assessment Keynote Address.\n\n[^vii]: See Arthur L. Samuel,\
  \ Some Studies in Machine Learning Using the Game of Checkers, IBM Journal, Vol.\
  \ 3, No. 3, July 1959.\n\n[^viii]: Thompson, K. (1968). \"Programming Techniques:\
  \ Regular expression search algorithm.\" Communications of the ACM. 11 (6): 419-422.\
  \ doi:10.1145/363347.363387.\n\n[^ix]: See, for example, David Blei, \"Probabilistic\
  \ Topic Models,\" Communications of the ACM. 55, April 2012.\n\n[^x]: See, e.g.,\
  \ Tim Loughran and Bill McDonald, 2011, \"When is a Liability not a Liability? Textual\
  \ Analysis, Dictionaries, and 10-Ks,\" Journal of Finance, 66:1, 35-65.\n\n[¹¹]:\
  \ Footnote cited from original text\n\n\n\n\n> 练习：美国证券交易委员会（SEC）正在使用多少种大数据技术？会计部门该如何使用这些技术？\n\
  \n### 练习题\n\n1. 应访问哪类数据以增加价值？\n2. 行业趋势的一些来源有哪些？\n3. 描述创建预测分析项目的步骤。\n\n### 注释\n\n\

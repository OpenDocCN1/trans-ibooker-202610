  \n## 大数据有哪些趋势？\n\n企业如何反应并规划在未来几年使用大数据？如果组织知道如何访问和使用大数据，就能获得显著的竞争优势。本章的趋势应与贵组织的大数据方法进行对比，并用作公司战略规划会议的基准。\n\
  \n## 2020 年大数据和分析的主要趋势\n\n让我们讨论一些影响 2020 年及未来的趋势。然后我们将考虑课程上一版中强调的趋势。\n\n围绕大数据的活动持续增加，并在许多组织中变得司空见惯。在以下章节中，我们将尝试确定\
  \ 2020 年的一些当前趋势，以及识别过去几年盛行的趋势。专业人士将把以下内容视为了解和利用的可能性。选择忽视大数据潜力的企业有落后于竞争对手的风险，甚至可能失去追赶的能力。\n\
  \n### 以下商业智能 (BI) 趋势是 2020 年的新趋势^(1)\n\n1.  成为实时企业不再是可选项。\n2.  大数据只是数据。下一个是什么？宽数据。\n\
  3.  图分析和关联技术超越 SQL。\n4.  DataOps 加自助服务是新的敏捷。\n5.  活跃的元数据目录是数据和分析的连接纽带。\n6.  数据素养即服务的出现。\n\
  7.  多方面的交互将带我们超越搜索。\n8.  道德和负责任的计算现在至关重要。\n9.  数据的“Shazam”：什么成为可能。\n10. 独立与技术栈：续集。\n\
  \n### 以下 BI 趋势是 2019 年的新趋势^(2)\n\n*   **可解释人工智能 (AI) 的兴起** — 除了结论和建议外，AI 还将提供解释，以帮助用户更清楚地了解建议的依据。\n\
  *   **自然语言让数据更人性化** — 系统将能够理解用户查询背后的意图。这将使数据访问和操作更加容易。\n*   **可执行分析将数据置于情境中** —\
  \ BI 平台将允许用户分析并采取行动，而不必等待他人审查和建议行动。\n*   **数据协作放大社会公益影响** — 公共和私营部门组织致力于在“数据向善”运动中使用技术。\n\
  *   **道德准则赶上数据步伐** — 道德政策必须升级（以符合 GDPR 等法规），以纳入快速变化的技术和数据实践。\n*   **数据管理与现代 BI 平台融合**\
  \ — 组织必须确定如何捕获、清洗、定义和对齐不同的数据。\n*   **数据叙事成为企业的新语言** — 领导者必须创建一种文化，让团队负责识别和传达数据洞察。\n\
  *   **企业在分析采用方面变得更聪明** — 除非员工将工具/系统采纳到日常业务运营中，否则分析项目不会成功。\n*   **数据民主化提升数据科学家地位**\
  \ — 数据科学家开发软技能，以简单、可执行的方式传达发现。\n*   **加速云数据迁移推动现代 BI 采用** — 组织必须重新思考其数据战略，从本地存储转向云存储。\n\
  \n### 以下章节的趋势是通过以下领先咨询公司进行的调查和研究确定的：\n\n*   Gartner 公司\n*   New Vantage Partners\n\
  \n## 大数据调查\n\nGartner 公司是一家专注于信息技术的领先咨询公司。\n\nGartner 公司强调了组织在 2020 年需要探索的顶级战略技术趋势。^(3)\n\
  \nGartner 将战略技术趋势定义为具有重大颠覆潜力、开始从新兴状态突围进入更广泛影响和使用，或在未来五年内以高度波动性快速增长并达到临界点的趋势。\n\n\
  2020 年十大战略技术趋势如下：\n\n1.  **超自动化** — 包括机器学习 (ML) 和机器人流程自动化 (RPA)\n2.  **多重体验** —\
  \ 对话平台、VR、增强现实 (AR) 和混合现实 (MR)\n3.  **专业知识普及** — 所有人都能获得技术专长\n4.  **人类增强** — 对人类的认知和身体改善\n\
  5.  **透明度与可追溯性** — 个人数据、道德、所有权\n6.  **赋能边缘** — 数据更贴近用户\n7.  **分布式云** — 云的去中心化\n\
  8.  **自主事物** — 机器人、无人机、船舶、设备\n9.  **实用区块链** — 仍不成熟但有潜力\n10. **AI 安全**\n\n根据 Gartner\
  \ 的说法，还有一些其他有趣的大数据和信息收集类别。\n\n### 无人机使用增加\n\nGartner 预测，由于无人机提供了显著的生产力提升，无人机市场将在\
  \ 2018 年至 2028 年间以 40% 的复合年增长率增长。安装基数将从 324,000 增长到全球 900 多万。^(4)\n\n### 物联网 — 连接性^(5)\n\
  \nGartner 公司预测，企业和汽车物联网 (IoT) 市场将在 2020 年增长到 58 亿个端点，比 2019 年增长 21%。预计到 2019 年底，将有\
  \ 48 亿个端点在使用，比 2018 年增长 21.5%。\n\n公用事业将成为 IoT 端点的最大用户，2019 年总计 11.7 亿个端点，2020 年增长\
  \ 17% 达到 13.7 亿个端点。“无论是居民还是商业用电智能计量，都将促进公用事业对 IoT 的采用，”Gartner 高级研究总监 Peter Middleton\
  \ 表示。“物理安全方面，建筑入侵检测和室内监控用例将驱动量增长，将成为 2020 年第二大 IoT 端点用户。”\n\n由连接照明设备驱动的楼宇自动化将成为\
  \ 2020 年增长率最大的细分市场 (42%)，其次是汽车和医疗保健，预计 2020 年分别增长 31% 和 29%（见下表）。在医疗保健领域，慢性病监测将驱动最多的\
  \ IoT 端点，而在汽车领域，具有嵌入式 IoT 连接的汽车将通过一系列附加设备来完成特定任务，例如车队管理。\n\n![](img/ufig3-1.png)\n\
  \n来源：Gartner (2019 年 8 月)^(6)\n\n## 埃森哲趋势和调查\n\n2020 年 2 月，埃森哲发布了其《埃森哲技术展望 2020》^(7)，这是对未来三年技术趋势的年度预测。五大关键主题是：\n\
  \n### 体验中的“我”\n\n领先企业正与客户合作创造数字化体验。人们仍然想要定制化的诸多好处，但他们对公司用来提供这些好处的不透明方法持怀疑态度。5G 和\
  \ AR 的兴起给领导者带来了更大压力，使其成为现实。\n\n### AI 与我\n\nAI 的全部潜力已超越单纯的简单任务自动化，成为人类员工与机器之间强大的协作工具。成功的企业将理解情境在人机交互中的重要性，并利用进步在更大规模上进行协作。\n\
  \n### 智能事物的困境\n\n产品所有权的概念正在根本性地改变。当人们购买产品时，在许多情况下，他们不再购买实体成品，而是购买不断演进体验的载体。公司必须认识到这一点，并努力设计其产品和生态系统以适应持续的变化。\n\
  \n### 走出实验室的机器人\n\n\n\n机器人正在走出仓库和工厂，这得益于硬件成本的下降和 5G 网络的兴起。随着机器人能力延伸至受控环境之外，公司将面临人才、人机交互问题，以及一个由整个世界组成的测试平台等挑战。\n\
  \n## 创新 DNA\n\n企业可以通过专注于其公司创新 DNA 的三个关键构建模块来转变创新方式。成熟的数字技术、科学进步，以及 DARQ（或分布式账本技术）、AI、扩展现实（XR）和量子计算等新兴技术，可以不断为组织注入新技能和新理念。领导者们正将这些技术构建模块编织在一起，为公司的未来设定航向。\n\
  \n## “炒作曲线”\n\nGartner 还发布了“炒作曲线”，该曲线展示了其 29 项必看技术，并包含这些技术成为主流的时间预估。他们建议：“技术创新领导者应利用炒作周期中突出的创新概况，来评估新兴技术的潜在商业机会。”\n\
  \n![](img/ufig3-2.png`)\n\n⁸\n\n## NewVantage Partners 2020 年度大数据高管调查^(9)\n\n根据\
  \ NewVantage Partners 最新的年度大数据高管调查，主流企业正大力推动从大数据和 AI 中实现业务成果。\n\n2020 年报告有以下主要发现：\n\
  \n*   尽管投资速度趋于平稳，但 98.8%的企业正在投资大数据和 AI 项目。\n*   只有 14.6%的企业部署了 AI 能力。\n*   AI 作为最具颠覆性技术的比例从\
  \ 2019 年的 80.0%下降至 2020 年的 69.5%。\n*   73.4%的受访者表示，大数据的业务采纳仍是一场挣扎。\n*   37.8%已建立数据驱动型组织。\n\
  *   26.8%已形成数据驱动型文化。\n*   人员和流程挑战是成为数据驱动型组织的最大障碍（90.9%）。\n*   大多数难以在组织中确定数据的单一问责点。\n\
  *   追求大数据和 AI 投资的原因主要是进攻性原因（89%）。\n*   区块链投资似乎正在减弱。\n*   超过 70%表示组织正在获得可衡量的结果。\n\
  \n影响最大的颠覆性技术是 AI 和机器学习。\n\n![](img/ufig3-3.png`)\n\n### 业务采纳面临的最大挑战\n\n![](img/ufig3-4.png`)\n\
  \n## 知识检查\n\n1.  根据 NewVantage Partners 的调查，变革的最大障碍是什么？\n\n    1.  预算限制。\n    2.\
  \  技术限制。\n    3.  人员、业务流程、文化。\n    4.  行政政策。\n\n2.  以下哪项最能描述 NewVantage 关于区块链的发现？\n\
  \n    1.  兴趣已趋于平稳。\n    2.  兴趣以加速速度增长。\n    3.  兴趣正在减弱。\n    4.  兴趣保持不变。\n\n## 练习题\n\
  \n列出明年几项技术趋势。\n\n## 注释\n\n1.  1   “2020 数据与 BI 趋势：仅靠分析已不再足够。” QLIK. 访问于 2020 年 3\
  \ 月 5 日. [`www.qlik.com/us/-/media/files/resource-library/global-us/register/ebooks/eb-2020-data-and-bi-trends-en.pdf`](https://www.qlik.com/us/-/media/files/resource-library/global-us/register/ebooks/eb-2020-data-and-bi-trends-en.pdf).\n\
  2.  2   “商业智能趋势，” Tableau Software, 访问于 2020 年 4 月 12 日, [`www.tableau.com/reports/business-intelligence-trends`](https://www.tableau.com/reports/business-intelligence-trends).\n\
  3.  3   Gartner, “Gartner 确定 2020 年十大战略技术趋势,” [`www.gartner.com/en/newsroom/press-releases/2019-10-21-gartner-identifies-the-top-10-strategic-technology-trends-for-2020`](https://www.gartner.com/en/newsroom/press-releases/2019-10-21-gartner-identifies-the-top-10-strategic-technology-trends-for-2020),\
  \ 访问于 2020 年 4 月 13 日.\n4.  4   Gartner, “预测：按用例划分的全球物联网企业无人机，2018-2028.” [`www.gartner.com/en/documents/3956346/forecast-iot-enterprise-drones-by-use-case-worldwide-201`](https://www.gartner.com/en/documents/3956346/forecast-iot-enterprise-drones-by-use-case-worldwide-201),\
  \ 访问于 2020 年 4 月 13 日.\n5.  5   “Gartner 称 2020 年将有 58 亿企业和汽车物联网终端投入使用.” Gartner.\
  \ 访问于 2020 年 3 月 23 日. [`www.gartner.com/en/newsroom/press-releases/2019-08-29-gartner-says-5-8-billion-enterprise-and-automotive-io`](https://www.gartner.com/en/newsroom/press-releases/2019-08-29-gartner-says-5-8-billion-enterprise-and-automotive-io).\n\
  6.  6   “Gartner 称 2020 年将有 58 亿企业和汽车物联网终端投入使用.” Gartner, 2019 年 8 月 29 日. [`www.gartner.com/en/newsroom/press-releases/2019-08-29-gartner-says-5-8-billion-enterprise-and-automotive-io`](https://www.gartner.com/en/newsroom/press-releases/2019-08-29-gartner-says-5-8-billion-enterprise-and-automotive-io),\
  \ 访问于 2020 年 4 月 13 日.\n7.  7   Carrel-Billiard, Marc, Paul Daugherty, and Michael\
  \ Blitz. “2020 技术愿景.” Accenture. Accenture, 2020 年 2 月 11 日. [`www.accenture.com/us-en/insights/technology/technology-trends-2020`](https://www.accenture.com/us-en/insights/technology/technology-trends-2020).\n\
  8.  8   “Gartner 确定五大具有变革性影响的新兴技术趋势.” Gartner. 访问于 2020 年 3 月 22 日. [`www.gartner.com/en/newsroom/press-releases/2019-29-08-gartner-identifies-five-emerging-technology-trends-with-transformational-impact`](https://www.gartner.com/en/newsroom/press-releases/2019-29-08-gartner-identifies-five-emerging-technology-trends-with-transformational-impact).\n\
  9.  9   NewVantage Partners LLC, “2020 年大数据和 AI 高管调查,” 2020, [`newvantage.com/wp-content/uploads/2020/01/NewVantage-Partners-Big-Data-and-AI-Executive-Survey-2020-1.pdf`](http://newvantage.com/wp-content/uploads/2020/01/NewVantage-Partners-Big-Data-and-AI-Executive-Survey-2020-1.pdf)\
  \ 访问于 4 月 13 日.\n"
- "# 第 4 章\n\n## 大数据的战略和业务应用是什么？\n\n## 学习目标\n\n*   区分大数据战略的根本原因。\n*   回顾大数据的目标。\n\
  *   识别大数据的战略意义。\n\n## 简介\n\n![](img/fig4-1.png`)\n\n图 4-1: 大数据目标\n\n所有商业活动都必须为股东或利益相关者增加价值。在本章中，我们将探讨大数据对组织的战略意义。组织在大数据方面应有哪些目标？应制定何种战略以实现这些目标？组织如何开始大数据实施之旅？所有这些问题的第一步是确定组织的总体目标，以及大数据将如何帮助实现该目标。\n\
  \n营利性组织将增加企业价值作为其主要目标或宗旨。非营利组织的主要目标或宗旨必须是提升客户或利益相关者的生活、服务和机会。在图 4-1 中,请注意，核心目的是金钱、时间或价值。\n\
  \n金钱、时间或价值外侧的第一个圆圈代表商业洞察。为了提升企业或利益相关者的价值，组织必须考虑影响客户、运营或未来结果预测的商业洞察。当这些洞察付诸行动时，应能带来组织价值的增加。\n\
  \n\n\n## 大数据架构、来源与商业洞察\n\n## 第二圈：大数据架构\n\n第二圈代表大数据架构。该架构表明，为了实现商业洞察，组织极有可能需要投资大数据架构。大数据架构拥有无数的硬件、软件和顾问选项。它还涉及\
  \ `Hadoop`、`R` 和 `MapReduce` 等软件程序。可以稳妥地假设，如果不投资大数据架构，将难以产生能带来增值的与大数据相关的商业洞察。\n\n\
  ## 最后一圈：大数据来源\n\n最后一圈代表大数据来源。这一层级涵盖了前文提到的所有结构化和非结构化大数据来源。如果组织不愿或无法访问和分析大数据来源，则无法生成能带来企业或利益相关者价值提升的洞察。\n\
  \n## 知识检验\n\n### 1. 大数据要求所有业务活动将其根本目标设定为\n\n1.  增加股东或利益相关者的价值。\n2.  增加可扩展架构。\n3.\
  \  增加大数据容量。\n4.  数据聚合。\n\n## 大数据的目标\n\n大数据分析的总体目标是为业务提供洞察。通过分析数据和趋势，企业可以获得可应用于几乎所有运营领域的宝贵洞察。大数据有助于实现为业务提供洞察这一目标的具体方式包括：\n\
  \n*   将数据货币化，或解读数据以实现可变现的竞争优势。\n*   分析运营效率 —— 机器传感器、产品故障和流量模式。\n*   创建可靠、可扩展且强大的基础设施，以辅助数据收集、分析和推断。\n\
  *   访问和使用内部及外部的结构化、非结构化和流式数据。\n*   预测商业、社会、政治、经济、技术和环境趋势。\n*   基于预设场景采取行动。\n\n###\
  \ 组织如何规划使用机器学习、商业智能、分析？^1\n\n| 举措 | 百分比 |\n| --- | --- |\n| 自动发现可操作的数据洞察 | 54% |\n\
  | 提高信息的准确性和质量 | 47% |\n| 通过提供建议增强用户决策 | 42% |\n| 帮助用户查找、选择和使用数据进行分析 | 38% |\n| 为政府和安全自动分类数据\
  \ | 35% |\n| 改进/自动化数据目录或元数据存储库 | 34% |\n\n## 与大数据相关的商业洞察\n\n以下列表旨在传达大数据应用的广泛多样性。许多数据组件涉及多个行业。\n\
  \n### 1. 客户分析\n\n正如前一章所述，大数据的主要来源之一来自交易。来自客户的此类信息可用于深入了解客户行为的许多方面，包括：\n\n1.  放弃产品或服务\n\
  2.  分析客户在公司网站上的行为\n3.  监控客户对产品的使用情况，以检测制造或设计问题\n4.  识别高价值客户\n5.  识别交叉销售机会以及向上销售机会\n\
  6.  确定不应接触的客户\n7.  识别、定位和留住客户\n8.  将点击流数据与交易数据相结合以改进客户画像\n9.  将产品供给限制在客户感兴趣的范围内\n\
  10. 确定客户行为或产品偏好的任何方面\n11. 识别客户细分\n12. 记录和分析客户服务及支持问题\n13. 吸纳品牌拥护者并改变品牌反对者的看法\n14.\
  \ 赋能客户销售您的产品\n15. 让客户更快地找到商品\n16. 提高忠诚度或净推荐值\n17. 分析智能手机或移动数据 —— 称为详单处理、社交分析、流失预测、地理映射\n\
  18. 分析销售点数据\n19. 创建论坛 —— 群众创意、群众解决方案\n\n### 2. 制造\n\n制造商现在可以从各种流程活动中获取实时数据，从而深入了解许多因素，包括：\n\
  \n1.  产品质量或缺陷的追踪\n2.  供应链管理与规划\n3.  优化机器\n4.  工程分析\n5.  预测性维护\n6.  流程与质量分析\n7. \
  \ 保修索赔潜力（基于社交媒体评论或投诉）\n8.  企业资源规划 —— 运营、服务交付、供应链管理和常规决策自动化\n9.  对流程和程序的持续改进\n\n\
  ### 3. 研发\n\n最近，联邦政府认识到大数据在研发中的潜在价值。一项新计划启动，旨在从数字数据集合中提取知识，以帮助解决国家层面的挑战。在业务层面，大数据可助力于：\n\
  \n1.  监控产品质量\n2.  识别潜在新产品的客户需求\n3.  征求客户对产品的意见\n4.  基于呼叫中心数据改进产品\n\n### 4. 分销\n\n\
  随着仓库和分销中心日益高科技化，它们现在生成的信息可用于监控和追踪劳动力、库存和设备，包括：\n\n1.  监控产品发货\n2.  识别物流成本差异\n3. \
  \ 确定库存水平\n4.  使用如 `GPS` 的位置数据\n5.  使用射频识别\n6.  使用分销优化\n\n### 5. 物流\n\n“物信息”是物流领域巨大的新数据来源。它可用于追踪货物并提供以下方面的洞察：\n\
  \n1.  需求预测\n2.  供应链分析\n3.  跟踪\n4.  交付预测\n5.  旅游业 —— 搜索者、定价、捆绑销售（航空、酒店、汽车、轮船、娱乐）\n\
  \n### 6. 营销\n\n营销部门利用数据确定客户习惯并不陌生。凭借对海量数据的访问权，他们可将洞察应用于：\n\n1.  确定营销活动效果\n2.  确定渠道效果\n\
  3.  监控并改善客户体验\n4.  基于位置和人口统计数据定制营销活动\n5.  提供广告和公关活动 —— 需求信号、定向广告、情感分析、客户获取、促销及其他广告媒介\n\
  6.  提供品牌情感分析\n7.  提供产品植入优化\n8.  提供响应建模\n9.  提供留存建模\n10. 提供基于市场的分析\n11. 提供净推荐值\n\
  12. 提供客户细分\n\n### 7. 预测\n\n大数据可能使除商业以外领域的预测成为可能。其中包括：\n\n1.  犯罪、威胁分析\n2.  天气\n3.\
  \  投资\n4.  矿产定位\n5.  天体物理学\n6.  健康\n7.  人际关系\n\n### 8. 运营分析\n\n运营分析利用来自机器传感器的信息，从多方面改进运营，包括：\n\
  \n1.  更准确及时的决策\n2.  日志和运营数据的偏差分析\n3.  设施布局 —— 无论是制造业还是零售业\n4.  供应链优化\n5.  动态定价\n\
  \n\n\n\n### 9. 人力资源\n\n某些零售公司使用可穿戴技术来追踪员工在店内的通信和移动情况。虽然这是利用大数据进行人力资源管理的一个极端例子，但许多公司可以利用员工信息做以下一些事情：\n\
  \n1.  识别有离职风险的员工\n2.  监控招聘活动\n3.  识别招聘的外部候选人\n4.  简历数据\n5.  员工搜索\n6.  员工未来团队\n\n\
  ### 10. 会计\n\n我们将在本课程的其他章节中讨论以下一些应用：\n\n1.  风险衡量\n    1.  信用风险\n    2.  市场风险\n \
  \   3.  运营风险\n2.  预算、预测、规划\n3.  欺诈检测\n    1.  检测多人共谋欺诈\n    2.  实时欺诈预防\n4.  算法交易\n\
  5.  客户分析\n6.  重复付款\n7.  定价、商业智能和数据挖掘\n\n### 11. 竞争\n\n1.  追踪竞争对手的价格\n2.  追踪竞争对手的销售\n\
  3.  追踪竞争对手的营销举措\n4.  描绘竞争格局\n\n### 12. 媒体和电信\n\n网络优化、客户评分、担保与预防、欺诈预防\n\n### 13.\
  \ 能源\n\n智能电网分析、勘探、运营建模、电力线传感器\n\n### 14. 医疗保健和生命科学\n\n生物信息学、制药研究、临床结果研究、药物基因组学、新生儿、ICU\
  \ 监护、疫情预警系统、远程医疗监护、可能再次入院。\n\n1.  药物发现\n2.  健康治愈\n3.  健康诊断\n\n### 15. 政府\n\n1. \
  \ 法规遵从\n2.  威胁分析\n3.  执法、国防和网络安全（例如，实时监控、态势感知、网络安全检测、车牌追踪、GPS 追踪）\n4.  自然系统——野火管理、水资源管理、野生动物管理\n\
  5.  交通——智能交通管理\n6.  逃税、社保欺诈、洗钱、恐怖分子检测、通信监控、市场监管、武器系统和反恐、计量经济学、健康信息学\n\n### 16. 非结构化数据\n\
  \n与前面许多章节相关\n\n1.  传感器数据——汽车、家电、机器、温度、安防、自动售货机\n2.  社交网络——来自用户在评分、评论和博客上生成的评论的情感数据\n\
  3.  短信软件——应用日志\n4.  互联网搜索——文本和文档、挖掘\n5.  数字图像和视频\n6.  语音数据\n7.  Web——Web 分析、社交媒体分析、多变量测试\
  \ (<sup>2</sup>)  \n    多变量测试是一种通过修改多个变量来测试假设的技术。多变量测试的目标是确定在所有可能的组合中，哪种变体组合表现最佳。网站和移动应用由可变元素的组合构成。\n\
  8.  其他——文本分析、业务流程分析\n9.  点击流——用户在浏览互联网时留下的虚拟轨迹。点击流是用户在互联网上活动的记录，包括用户访问的每个网站和每个网站的每个页面、用户在页面或网站上停留的时间、页面访问的顺序、用户参与的任何新闻组，甚至用户发送和接收的邮件的电子邮件地址。互联网服务提供商和个别网站都能够追踪用户的点击流。<sup>3</sup>\n\
  \n### 17. 股市分析\n\n例如，天气对证券价格的影响或市场数据延迟分析\n\n## 知识检查\n\n2.  以下哪项未被提及为与研发相关的大数据洞察？\n\
  \n    1.  监控产品质量。\n    2.  识别客户需求。\n    3.  创建第三代和第四代产品。\n    4.  征求客户意见。\n\n##\
  \ 大数据架构\n\n![Figure 4-2](img/fig4-2.png)\n\n**图 4-2**\n\n来源：改编自 [`http://bigdataandanalysis.blogspot.com/`](http://bigdataandanalysis.blogspot.com/)\
  \ 上的信息\n\n为了提供企业所需的所有洞察，大数据平台需要实现许多目标。大数据架构的设计必须使数据在自然环境中得到分析，而不是在海量数据表中重新创建数据。该架构必须允许读取和访问各种来源，如电子邮件、财务、音频、图像、GPS\
  \ 等。架构的创建应实现四个 V（容量、速度、多样性和真实性），如第 2 章所述。该架构还必须具有经济可扩展性、足够的响应时间、多种硬件选项（由于硬件故障），并具有内置安全性以防止未经授权访问机密详细数据。\n\
  \n## 大数据的战略意义——挑战\n\n要将大数据作为组织的工具，必须首先解决一些关键的战略问题。如果在流程开始时忽视了战略问题，可能难以成功实施大数据。以下列表可作为思考实施大数据平台的起点：\n\
  \n### 战略挑战\n\n-   确立目的适用性\n-   提供整体系统架构规划\n\n### 技术挑战\n\n-   获取数据访问权\n-   获取相关方法论和元数据的访问权\n\
  -   确立数据集的来源和血缘\n-   就城市（准确性、保真度）、不确定性、误差、偏差、可靠性和校准来确立数据集质量\n-   解决安全顾虑\n-   技术可行性\n\
  -   现有数据仓库架构\n-   不成熟的新系统或所选数据的可靠性\n-   缺乏大数据的元数据和模式\n-   缺乏工具\n-   企业级产品和工具的可用性\n\
  -   高延迟\n-   在集群内运行\n\n### 资源或能力挑战\n\n-   实施大规模大数据计划的能力\n-   离散数据的整合\n-   收集数据的质量和成本\n\
  -   预算限制\n-   成本过高\n\n### 人员挑战\n\n-   大数据分析的实验和试验测试\n-   网络传输的完整性\n-   数据质量差\n-\
  \   处理实时数据的能力\n\n### 项目管理挑战\n\n-   依赖多个可能无法协同工作的顾问\n-   从正确的项目开始\n\n### 变更管理挑战\n\
  \n-   制度变更管理\n-   确保跨司法管辖区协作和通用标准\n-   阻碍大数据收集和组织的不同部门系统\n-   获取技术胜任的员工\n-   陡峭的技术学习曲线\n\
  -   招聘合格人员\n-   本质上是文化性的部门间障碍\n-   不被接受或不被信任的数据\n-   数据所有权，特别是与组织文化相关的方面\n-   缺乏业务赞助\n\
  -   缺乏对商业案例的信心\n\n### 合作伙伴挑战\n\n-   与大数据生产者建立战略联盟\n\n### 法律和监管问题\n\n\n\n\n表 4-1：注意\
  \ 2018 年的障碍，然后将其与 表 4-2 以及 TDWI 截至 2013 年的障碍分析进行对比。你能从这两个图表的对比中得出什么结论吗？\n\n![表 4-1](img/tab4-1.png)\n\
  \n表 4-1\n\n⁴\n\n![表 4.2.](img/tab4-2.png)\n\n表 4.2.\n\n来源：改编自 [www.business2community.com/big-data/drive-real-time-revenue-world-big-data-01109279](http://www.business2community.com/big-data/drive-real-time-revenue-world-big-data-01109279)\n\
  \n## 知识检验\n\n3. 根据 TDWI 的说法，大数据面临的最大挑战是什么？\n\n    1. 缺乏业务赞助。\n    2. IT 员工缺乏技能。\n\
  \    3. 数据集成复杂性。\n    4. 数据质量差。\n\n## 错误数据的危害\n\n除了使用大数据的战略挑战之外，组织也有很大可能错误地使用大数据。在许多情况下，如果组织在不充分了解统计陷阱的情况下使用大数据，可能会危及决策过程的完整性。少量数据的任何问题在大量数据中都会被放大。抽样误差或偏差可能会产生不能代表实际情况的数据，这是民意调查中常见的不准确性。错误的假设可能从数据收集之初就存在。例如，一家公司可能假设某个变量是客户留存的强预测指标，但实际上该变量仅与留存率相关。\n\
  \n组织面临着一个主要危险：沉迷于汇聚海量数据，却对这些数据得出不当的结论。这对于制造环境尤为重要，因为它们可能基于指导性分析做出关键的生产决策。\n\n###\
  \ 错误数据\n\n让我们考虑一个 Ari Zoldan 在 *Wired* 杂志上撰写的例子，该例讨论了从飓风“桑迪”期间收集的 Twitter 数据中得出结论的情况。^(5)\n\
  \n> 在罗格斯大学的一项引人入胜的研究中，科学家们试图了解人们与飓风“桑迪”相关的决策过程。从 10 月 27 日至 11 月 1 日，记录了超过 2000\
  \ 万条与该超级风暴相关的推文。关于防范准备的推文在风暴来临前一晚达到高峰，而关于聚会的推文在风暴平息后达到高峰。\n>\n> 大多数推文源自曼哈顿，主要是因为那里智能手机和\
  \ Twitter 使用率高度集中。由于大面积停电和手机电量耗尽，受灾最严重的地区（如 Seaside Heights 和 Midland Beach）发出的推文非常少。从数据中，人们可能会推断曼哈顿区承受了风暴的主要冲击；然而，我们知道事实并非如此。那些外围地区实际上发生了很多情况。鉴于数据呈现的方式，来自\
  \ Twitter 圈子中未被代表的社区存在巨大的数据空白。\n\n这个例子说明了几个观点。首先，它驳斥了“更多数据会产生更深入洞察”的迷思。它证明了不被数据量或统计数字过度影响的重要性。在审视数据时，要保持客观、批判性，并独立于任何结果。\n\
  \n统计数据不等于事实。大数据可能看起来像事实，但实际上只是数据量更大而已。在原始状态下，大数据庞大且无序，为分析组织数据非常困难。\n\n你还应该警惕偏见和缺失的背景。确认偏误是指人们在数据中寻找证据以确认其预先存在的观点。此外，当数据与潜在假设相冲突时，人们倾向于忽略它。仅仅因为数据可以被绘制成图表或由算法分析，并不意味着其解释就是有效的。更快、更强大的系统意味着我们也能比以往更快地做出错误的解释和处方。\n\
  \n在评估数据时，请记住以下三点警示：\n\n1. 人们倾向于找到他们想找的东西。更多的数据和速度并不一定意味着结果会得到改善。\n2. 数据分为两类——定量和定性。定性分析对于解释定量分析是必要的。以公开财报发布为例。数字被公布出来，然后通过解释或“口头”调整收益以最佳方式呈现，从而置于特定背景中。\n\
  3. 请记住数据的背景很重要。考虑一下全球变暖是如何被解读、重新解读、再重新解读的。对于每一个数据集，了解分析师的偏见都很重要，例如呈现的数据、修改的数据和排除的数据。例如，2015\
  \ 年第一季度国内生产总值 (GDP) 不如预期那么高。过去几年第一季度均低于预期。分析师最初将这一表现归因于严冬。遗憾的是，天气仍无法解释所有令人失望的结果，因此分析师称存在“第一季度残留季节性”及其他变量的疲软读数。应当指出，美联储的经济学家并未发现此类扭曲对汇总\
  \ GDP 有显著统计证据。^(6)\n\n## 五大 IT 大数据错误\n\n大数据问题对 IT 经理来说有多大？根据 Infochimps 的数据：\n\n\
  > 55% 的大数据项目无法完成，许多其他项目也未能达到其目标。\n>\n> 虽然原因可能有很多，但毫无疑问，最大的因素之一是高层管理者（提供整体项目愿景）与负责实施的人员之间缺乏沟通。负责大数据项目繁重开发工作的\
  \ IT 员工的意见，往往被作为事后诸葛亮，只有在项目偏离航向时才会被考虑。^(7)\n\n根据这段引述，近一半的大数据项目从未完成。在剩下的项目中，很大一部分不会为组织或利益相关者增加价值。除了数据选择和处理的潜在错误外，IT\
  \ 还可能增加复杂性。Oracle 的 Subramanian Iyer 撰文谈到了 IT 犯下的五大大数据错误：^(8)\n\n1. 过分强调所需技术而非业务需求。\n\
  2. IT 管理层往往关注错误的业务案例，假设投资回报率将与行业内其他公司相同。\n3. 管理层可能作为大爆发式实施大数据方法的一部分，并行启动多个计划。这种方法可能会降低大数据项目成功的几率。\n\
  4. IT 管理层经常不进行适当的成本效益分析，以确定大数据项目的回报。\n5. 将大数据应用置于与传统应用相同的流程要求（认证机制、访问控制、数据隔离和环境管理）之下，可能会危及项目。\n\
  \n## 知识检验\n\n4. 以下哪项**不是**大数据错误？\n\n    1. 使用迭代实施策略。\n    2. 关注技术而非业务需求。\n    3.\
  \ 未执行成本效益分析。\n    4. 作为“大爆发”方法或试点实施的一部分，并行执行多个计划。\n\n## 练习题\n\n1. 开发大数据的根本原因是什么？\n\
  2. 大数据实施面临哪些变更管理问题？\n3. 一个关于大数据和推文的警示故事与飓风“桑迪”有关。如果脱离上下文，相关推文发生了什么可能会产生错误结论？\n\n\
  ## 注释\n\n\n\n\n## 参考文献\n\n1.  1 斯托德，大卫。“人工智能与大数据时代的商业智能与分析。” <https://www.oracle.com/a/ocom/docs/middleware/application-integration/tdwi-bp-report.pdf?elqTrackId=915e6e26e9e64493b61cb60977243b58&elqid=79756&elqt=2>\n\
  \n2.  2 “什么是多变量测试？” Optipedia，访问于 2017 年 3 月 30 日，<http://www.optimizely.com/resources/multivariate-testing/>\n\
  \n3.  3 “点击流，” Webopedia，访问于 2017 年 3 月 30 日，<https://www.webopedia.com/TERM/C/clickstream.html>\n\
  \n4.  4 斯托德，大卫。TDWI - “人工智能与大数据时代的商业智能与分析。” <https://www.oracle.com/a/ocom/docs/middleware/application-integration/tdwi-bp-report.pdf?elqTrackId=915e6e26e9e64493b61cb60977243b58&elqaid=79756&elqat=2>\n\
  \n5.  5 阿里·佐尔丹，“数据越多，问题越多：大数据总是对的吗？” Wired，访问于 2016 年 3 月 17 日，<http://www.wired.com/2013/05/more-data-more-problems-is-big-data-always-right/>\n\
  \n6.  6 “GDP 中的残留季节性，” FEDS Notes，美联储，访问于 2016 年 3 月 17 日，<http://www.federalreserve.gov/econresdata/notes/feds-notes/2015/residual-seasonality-in-gdp-20150514.html>\n\
  \n7.  7 “调查：IT 团队希望其 CIO 了解的企业大数据知识，” Infochimps，访问于 2019 年 3 月 13 日，<https://www.prnewswire.com/news-releases/survey-what-it-teams-want-their-cios-to-know-about-enterprise-big-data-188190311.html>\n\
  \n8.  8 苏布拉马尼安·艾耶，“五大大数据错误，” Oracle，访问于 2015 年 6 月 8 日，<http://www.oracle.com/us/corporate/profit/big-ideas/031214-siyer-2166578.html>\n"
- "# 第 5 章：大数据平台与操作工具\n\n## 学习目标\n\n*   识别可用的大数据软件工具。\n*   识别名为 Hadoop 的开源软件。\n* \
  \  回顾 MapReduce 和 R 软件的作用。\n\n## 简介\n\n本章介绍各种大数据平台以及可在这些平台上使用的操作工具。其中最主要的工具是被称为\
  \ Hadoop 的操作系统。Hadoop 是一个开源框架，许多组织选择它来支持其大数据工作。本章将重点介绍会计师在大数据应用中建立基础理解所需的信息技术术语。\n\
  \n## 大数据能力\n\n所有大数据工作的第一步是了解组织希望达成的目标。应进行两次讨论。\n\n首先，组织应举行战略规划会议。应提出的主要问题是：就大数据而言，公司的长期愿景是什么？\n\
  \n接下来，组织应举行信息规划会议。此次讨论应侧重于组织如何利用现有资源（硬件、软件、人员和未来预算）实现第一步的战略。\n\n这两次对话都是必要的，应在两次不同的规划会议中进行。了解组织需求的一种方法是考察大数据的一些能力，然后确定其中是否有任何能力契合企业或\
  \ IT 战略。\n\n利用大数据和分析可以发挥哪些能力？\n\n![表 5-1](img/tab5-1.png)\n\n**表 5-1**\n\n来源：改编自“The\
  \ Real-World Use of big data,” IBM Institute for Business Value, accessed April\
  \ 14, 2019, <https://www.ibmbigdatahub.com/blog/big-data-requires-strong-analytics-capabilities>。\n\
  \n数据分析（DA）是分析原始信息以推断该数据结论的研究。DA 被用作众多商业项目的一部分，帮助组织做出更好的商业决策，并验证或反驳现有模型或推测。DA 与“数据挖掘”不同，因为它包含数据挖掘不一定具备的评估过程。数据挖掘涉及搜索大量信息集以发现模式和关系。DA\
  \ 侧重于根据分析师已知的信息推导答案。\n\n哪些业务分析示例可用于组织内的特定部门？\n\n### 营销分析\n\n*   竞争对手分析\n*   定价分析\n\
  *   品牌分析\n*   市场趋势\n*   市场规模\n\n### 客户分析\n\n*   终身价值\n*   销售渠道\n*   细分\n*   满意度\n\
  *   参与度\n*   流失率/情感分析\n\n### 财务分析\n\n*   现金流\n*   预测销售\n*   股东价值\n*   产品盈利能力\n*\
  \   客户盈利能力\n\n### 员工分析\n\n*   产能\n*   能力\n*   领导力\n*   招聘渠道\n*   员工绩效\n*   员工流失率/情感分析\n\
  \n### 运营分析\n\n*   供应链\n*   欺诈检测\n*   项目绩效\n*   环境影响\n*   企业责任\n\n### 核心分析\n\n* \
  \  数据挖掘\n*   预测\n*   可视化分析\n*   相关性分析\n*   回归分析\n\n数据分析涉及检查、清洗、修订和建模，目的是发现有价值的数据、提出结论并支持明智决策。数据分析具有不同的特征和方法论，在商业、科学和社会学领域有许多技术和应用。\n\
  \n数据挖掘是一种侧重于建模和发现以用于预测目的的技术。商业智能侧重于汇总企业数据。在统计应用中，有描述性统计和以下主要类型的数据分析：\n\n*   **探索性**：在数据中发现新特征。\n\
  *   **确证性**：确认或否定现有观点。\n*   **预测性**：专注于用于预测目的的统计模型。\n*   **文本**：使用统计、结构和语言技术从非结构化数据（如电子邮件）中提取和分类信息。\n\
  \n预测分析侧重于基于从现有数据集中提取的数据预测未来结果或模式。它不保证预测结果，只表明以某种可靠性可能发生的情况，并包含“假设”场景以及风险或敏感性分析。预测分析可包括数据挖掘、统计建模和机器学习等实践。过去\
  \ 10 年来，预测分析应用的重点已发生变化。下面两张来自 TDWI 的图表说明了这一点。对比 2007 年行业现状与 2018 年现状。注意重点的变化。\n\n\
  下图描绘了与预测分析最契合的业务应用。\n\n![表 5-2：2007](img/tab5-2.png)\n\n**表 5-2：2007**\n\n来源：改编自\
  \ <http://tdwi.org/articles/2007/05/10/predictive-analytics.aspx>（访问于 2020 年 4 月\
  \ 7 日）。\n\n![表 5-3：2018](img/tab5-3.png)\n\n**表 5-3：2018**\n\n\n\n来源：改编自 [`https://www.tellius.com/wp-content/uploads/2018/06/TDWI_BPReport_Q218_web.pdf`](https://www.tellius.com/wp-content/uploads/2018/06/TDWI_BPReport_Q218_web.pdf)\
  \ （访问日期：2020 年 4 月 7 日）。\n\n## 这些先前的各种概念如何与商业智能相关联？\n\n![图 5-1](img/fig5-1.png)\n\
  \n**图 5-1**\n\n请注意，“预测”区域之外的白色外部区域，是规范性分析或“我们如何让这成为现实？”发生的区域。\n\n## 知识检查 1\n\n1.\
  \  什么是探索性数据分析？\n\n    1.  使用统计模型进行预测。\n    2.  确认现有观点。\n    3.  发现数据中的新特征。\n   \
  \ 4.  规定采取的行动。\n\n## 哪些平台可用于大数据？\n\n![图 5-2：大数据架构](img/fig5-2.png)\n\n图 5-2： 大数据架构\n\
  \n让我们从回顾大数据系统的整体架构开始。本节将概述一般概念，以便读者能将其组织系统与通用大数据模型联系起来。\n\n尽管 图 5-2 并非从战略开始，但战略处于所有\
  \ IT 愿景、目标、硬件和应用的最前沿。在不解决公司与信息技术相关的战略目标的情况下，购置硬件或软件或讨论大数据是愚蠢的。因此，战略是大数据系统的一个基本组成部分。\n\
  \n## 硬件与操作系统选择\n\n硬件选择是大数据系统的核心。大多数组织将拥有成熟的 IT 架构。大数据将解决现有资源、公司期望达到的目标，然后制定获取必要硬件的计划。大数据的主要原则之一是使用通用计算机（会定期故障），将它们连接起来以创建分布式文件和分布式应用程序。根据组织的大数据方法，硬件将包含许多通用类型的计算机。这些计算机将与\
  \ Hadoop（或选定的系统软件）协同工作。\n\n选定硬件后，必须选择将在硬件上运行的操作系统。操作系统是支持计算机基本功能的主要软件。操作系统的例子包括\
  \ Windows、Linux、Unix 和 iOS。\n\n## 软件选择\n\n下一步涉及选择在操作系统上运行的软件程序。系统程序直接控制计算机并执行 I/O\
  \ 内存操作。系统程序的例子包括设备驱动程序、BIOS 软件、硬盘扇区引导软件、汇编器和编译器软件。实现大数据的程序 Hadoop 将在下一节中描述。\n\n\
  应用程序是传统的会计应用程序，如会计软件包、CRM、ERP、MS Office、iTunes、Adobe Photoshop 等。与 Hadoop 协同运行的大数据程序（以及用于归约、整理、保存、分析、预测、报告的程序）：\n\
  \n在下一节中，我们将探讨来自多个程序的应用数据。应用数据可以是结构化、半结构化或非结构化的。来自传统程序的数据通常是结构化的。来自外部来源（政府、行业、科学）或其他媒体来源（图片、影像、视频、音频）的数据通常是半结构化的。来自社交媒体或流式来源（如机器、设备或传感器）的数据通常是非结构化的。更令人困惑的是，某些软件可以充当上述多种应用程序中的一种以上。图\
  \ 5-3 试图将软件应用程序与大数据的各个细分领域对齐。此图并非旨在面面俱到，而是为了表明软件的选择将取决于组织希望执行的应用程序。\n\n![图 5-3：软件供应商能力](img/fig5-3.png)\n\
  \n图 5-3： 软件供应商能力\n\n企业面临着不断增长的数据量和日益提高的分析期望。作为回应，供应商提供高度分布式架构以及新级别的内存和处理能力。新进入市场的参与者正利用开源许可模式，该模式正成为大数据软件或架构的基本组成部分。\n\
  \nApache Hadoop 是一个成熟的开源数据处理平台，最早于 2006 年被 Yahoo 和 Facebook 等互联网巨头采用。Cloudera 于\
  \ 2008 年为企业引入了商业支持，MapR 和 Hortonworks 分别于 2009 年和 2011 年进入市场。在数据管理老牌厂商中，IBM 和 EMC-Pivotal\
  \ 推出了各自的 Hadoop 发行版。Microsoft 和 Teradata 为 Hortonworks 平台提供互补软件和支持。Oracle 转售并支持\
  \ Cloudera，而 HP、SAP 和其他厂商则与多家 Hadoop 供应商合作。\n\n由于带宽、内存和处理能力的进步，实时流处理和流分析通过 Hadoop\
  \ 变得更加可行。然而，这项技术尚未得到广泛采用。多家供应商拥有复杂事件处理（复杂事件处理，简称 CEP，并不像其名称暗示的那么复杂；从根本上说，CEP 是将业务规则应用于流式事件数据）¹，但在金融交易、国家情报和安全社区之外，极少安装。随着大数据的更广泛采用，广告投放、内容个性化、物流和其他领域的应用可能会有所变化。²\n\
  \n大数据、分析和人工智能 (AI) 的种类繁多。Matt Turck 是 AI 行业的风险投资家。他汇编了下图，描绘了可用服务、供应商和工具的广泛范围。Matt\
  \ 还授权将其包含在本课程中。第一张图展示全貌，后续图片将放大各个部分。\n\n![](img/ufig5-1.png) ![](img/ufig5-2.png)\
  \ ![](img/ufig5-3.png) ![](img/ufig5-4.png) ![](img/ufig5-5.png)\n\n## 知识检查 2\n\n\
  2.  以下哪项**未**被列为大数据的基础设施资源？\n\n    1.  SAP。\n    2.  Oracle。\n    3.  IBM。\n   \
  \ 4.  HP。\n\n## 供应商选择\n\n接下来，让我们看看一些知名的大数据软件供应商选择，并简要介绍其软件。\n\n1.  Actian Vector\
  \ 提供从 Hadoop 实现商业价值的能力。³ 其顶级的数据准备和最广泛的分析支持以下功能：\n\n    1.  弹性数据准备：利用最快的分析引擎、数据摄取技术和\
  \ Konstanz Information Miner (KNIME) 用户界面，快速引入所有数据\n    2.  SQL 分析：将 SQL 技能、应用程序和工具与\
  \ Hadoop 结合使用，提供完全工业化的 SQL 支持。\n    3.  预测分析：利用由 KNIME 驱动的高度并行化 Hadoop 分析算子，发掘趋势和模式。\n\
  \n2.  Amazon Web Services (AWS) 于 2006 年开始通过云计算向企业提供 IT 基础设施服务。⁴ 云计算使企业能够用更低且更灵活的成本取代前期基础设施费用（无需提前数周或数月订购服务器和其他基础设施），这些成本可在几分钟内随业务扩展。\n\
  \n    > 例如，AWS 是一种可扩展且低成本的云服务。全球 190 个国家有数十万家企业在使用 AWS。他们在美国、欧洲、巴西、新加坡、日本和澳大利亚设有数据中心，为客户提供低成本、敏捷性、灵活性和安全性等优势：\n\
  \n\n\n\n### 3. Cloudera\n\nCloudera 提供了一个用于大数据的统一平台——企业数据中心。企业现在拥有一个存储、处理和分析所有数据的场所，这使他们能够延伸现有投资的价值，同时实现从数据中获取价值的全新基本方式。Cloudera\
  \ 和 Hortonworks 于 2018 年底宣布平等合并。（参见第 5 项。）\n\n> Cloudera 成立于 2008 年，是第一家也是目前为企业提供和支持\
  \ Apache Hadoop 的领先供应商。Cloudera 还提供软件来应对业务关键数据挑战，包括存储、访问、管理、分析、安全和搜索。⁵\n\n### 4.\
  \ HP 大数据服务\n\nHP 大数据服务可帮助 IT 基础设施处理不断增长的字节量——来自电子邮件、社交媒体和网站下载——并将它们转化为有益信息。HP 大数据解决方案涵盖战略、设计、实施、保护和合规，具体如下：\n\
  \n1.  **大数据架构战略**：定义使 IT 与大数据计划保持一致所需的功能和能力。通过转型研讨会和路线图服务，学习如何捕获、整合、管理和保护与业务对齐的信息，包括结构化、半结构化和非结构化数据。\n\
  2.  **大数据系统基础设施**：HP 将设计并实施一个高性能、集成的平台，以支持大数据的战略架构。服务包括设计和实施、参考架构实施和集成。灵活、可扩展的基础设施将支持\
  \ HP 平台上的大数据多样性、整合、分析、共享和搜索。\n3.  **大数据保护**：确保大数据系统的可用性、安全性和合规性。HP 可帮助保护数据、实现法规遵从性和大数据领域的全生命周期保护，以及改进备份和连续性措施。\n\
  \n### 5. Hortonworks\n\nHortonworks Hadoop 数据平台 (HDP) 是唯一完全开放的 HDP。⁶ HDP 中的所有解决方案均作为项目通过\
  \ Apache 软件基金会 (ASF) 开发。HDP 中没有专有扩展。HDP 提供跨广泛访问方法的线性扩展存储和计算，从批处理到交互式，再到实时搜索和流式处理。它包含一套跨治理、集成、安全和运营的综合能力。HDP\
  \ 可与现有应用程序和系统集成，仅需对现有数据架构和技能组合进行最少量的更改，即可利用 Hadoop。可在云端、本地或通过设备跨 Linux 和 Windows\
  \ 部署 HDP。Hortonworks 和 Cloudera 于 2018 年底宣布平等合并。（参见第 3 项。）\n\n### 6. IBM\n\nIBM\
  \ 包括以下类型的信息管理数据和分析能力：⁷\n\n1.  **数据管理和数据仓库**：以更低的管理、存储、开发和服务器成本，跨多种工作负载提供有效的数据库性能；利用针对分析工作负载（如深度分析）优化的能力实现极致速度；并受益于可在数小时内启动运行的针对工作负载优化的系统。\n\
  2.  **Hadoop 系统**：通过应用加速器、分析、可视化、开发工具、性能和安全功能，将 Apache Hadoop 的强大功能引入企业。\n3.  **流计算**：高效地对不断变化的动态数据提供实时分析处理，并支持描述性和预测性分析以辅助实时决策。随时捕获并分析所有数据，恰逢其时；通过流计算，存储更少、分析更多、更快地做出更好的决策。\n\
  4.  **内容管理**：支持全面的内容生命周期和文档管理，以具有规模、安全性和稳定性的成本效益方式控制现有和新类型的内容。\n5.  **信息集成和治理**：通过跨生命周期适当地集成、理解、管理和治理数据的能力，建立对大数据的信心。\n\
  \n### 7. Infobright\n\nInfobright（现归 IGNITE Technologies 所有）是一个用于存储和分析机器生成数据的分析型数据库平台。⁸\n\
  \n1.  数据压缩比为 20:1 至 40:1\n2.  即使数据量急剧增加，也能保持快速、一致的查询性能。\n3.  可扩展至容纳长期分析所需的 TB 级和\
  \ PB 级历史数据。\n4.  每小时 TB 级的加载速度，以支持实时查询处理或告警。\n\n### 8. Kognitio\n\nKognitio 软件可与现有的业务集成和分析报告工具⁹、“数据湖”（基于对象的大型存储库，以原生格式保存数据，直到需要时为止）¹⁰\
  \ 以及 Hadoop 存储无缝互操作。它补充了预先存在的技术栈，弥合了通往新的大容量数据存储的可用性鸿沟，帮助从大数据中实现及时价值。Kognitio 分析平台是一种横向扩展的内存海量并行处理\
  \ (MPP)、不仅限于 SQL 的软件技术，针对低延迟、大容量数据加载和高吞吐量复杂分析工作负载进行了优化。\n\n### 9. MapR\n\nMapR 是唯一一个从零开始为业务关键型生产应用程序构建的分发系统。¹¹\n\
  \nMapR 是一个完整的 Apache Hadoop 发行版，包含来自 Hadoop 生态系统的十多个项目，提供广泛的大数据能力。MapR 平台包括高可用性、灾难恢复、安全性和全方位数据保护。此外，MapR\
  \ 允许 Hadoop 作为传统的网络附属存储被轻松访问，并具备读写能力。\n\n### 10. Microsoft\n\nMicrosoft 的愿景是让所有用户能够从几乎任何数据中获得可操作的见解，包括以前隐藏在非结构化数据中的见解。^(12)\
  \ 为此，Microsoft 提供了一个全面的大数据解决方案。\n\n1.  **现代数据管理层**，支持所有数据类型——结构化、半结构化和非结构化数据。它更易于集成、管理和呈现实时数据流，提供更全面的业务视图并促进快速决策。\n\
  2.  **软件还具有丰富层**，可增强数据发现，将世界行业数据与高级分析相结合。软件可连接和导入数据、创建可视化，并定期随时随地运行报表。\n3.  **软件具有洞察层**，使用\
  \ MS Office 等工具，其 Excel 程序内置丰富的 3D 可视化和讲故事功能，使可视化多个数据源并即时修改它们变得更加容易，同时可在 PowerPoint\
  \ 中演示。\n4.  **HD Insight** 是 Microsoft 基于 Hortonworks 数据平台构建的新 Hadoop 服务，提供与 Apache\
  \ Hadoop 100% 的兼容性。\n\n### 11. Oracle\n\nOracle 是一套完整的基础设施和软件工具，旨在满足组织的大数据需求。\n\n\
  ### 12. Pivotal\n\nPivotal 大数据套件为敏捷数据提供了广泛的基础。¹³ 它可以作为 Pivotal Cloud Foundry 的一部分部署，或作为\
  \ PaaS（平台即服务）技术部署，支持本地部署和公有云、虚拟化环境、商用硬件，或作为设备交付。（注：Pivotal 于 2019 年 12 月 30 日被 VMware\
  \ Tanzu 收购。）该套件提供以下功能：\n\n1.  基于 ODP 核心的 SQL 分析优化 Hadoop\n2.  领先的分析型 MPP 数据库\n3.\
  \  MPP、符合 ANSI 标准的 SQL on Hadoop 查询引擎\n\n### 13. SAP HANA\n\n像 SAP HANA 这样的软件可以简化\
  \ IT 架构。¹⁴ 它将内存处理与企业数据仓库和 Hadoop 相结合，帮助驾驭大数据。据称它可以实现以下功能：\n\n\n\n\n## 业务分析工具与平台概述\n\
  \n## 核心优势与平台特性\n\n1.  业务流程运行速度提升 10,000 至 100,000 倍。\n\n2.  结合 SAP IQ 这一数据仓库解决方案，使用大数据分析。\n\
  \n3.  跨逻辑大数据仓库虚拟化数据，无需移动数据即可获取洞察。\n\n14. Teradata Aster 拥有一个分析引擎，该引擎是用于跨大数据集进行图分析的原生图处理引擎。利用这一新一代分析引擎，组织可以解决复杂的业务问题，例如社交网络或影响力分析、欺诈检测、供应链管理、网络分析和威胁检测以及洗钱检测。¹⁵\n\
  \n15. 新一代数据分析师使 R 成为当今市场上最流行的分析软件。Teradata Aster R 通过预构建的并行 R 函数、并行构造函数，以及在 Aster\
  \ SNAP Framework 中集成开源 R，消除了开源 R 的局限性。\n\n> **什么是 R？**\n>\n> R 是一种用于统计计算和绘图的语言和环境。它是一个\
  \ GNU 项目，类似于贝尔实验室（前身为 AT&T，现为朗讯科技）开发的 S 语言和环境。R 可以被视为 S 的另一种实现。两者有一些重要差别，但为 S 编写的大量代码在\
  \ R 下无需修改即可运行。\n>\n> R 提供了多种统计技术（线性和非线性建模、经典统计检验、时间序列分析、分类、聚类……）和绘图技术，且具有高度可扩展性。S\
  \ 语言通常是统计方法学研究的首选工具，而 R 为参与该活动提供了开源途径。\n>\n> R 的优势之一是可以轻松生成设计精良、出版质量的图表，包括在需要时的数学符号和公式。图形中的细微设计选择的默认值经过了精心考量，但用户仍保留完全控制权。\n\
  >\n> R 以源代码形式根据自由软件基金会的 GNU 通用公共许可条款作为免费软件提供。它可在多种 Unix 平台及类似系统（包括 FreeBSD 和 Linux）、Windows\
  \ 和 MacOS 上编译运行。¹⁶\n\nAster Discovery Platform 还提供 SQL 和 SQL-MapReduce 分析引擎，支持适合这些引擎的多种分析，如\
  \ SQL 分析、路径或模式分析、统计分析和文本分析。\n\n## 知识检验\n\n### 3. 什么是 MapR？\n\n1.  一种减小被分析大数据规模的程序。\n\
  2.  Apache Hadoop 的不完整发行版。\n3.  **Apache Hadoop 的完整发行版，打包了十多个项目。**\n4.  一种用于大数据的关系型数据库。\n\
  \n### 4. 什么是 Teradata？\n\n1.  大数据的农业应用。\n2.  DA 软件。\n3.  用于图分析的原生图处理引擎。\n4.  **关系型数据库。**\n\
  \n## 企业级顶尖数据分析工具\n\n以下企业级顶尖数据分析工具列表基于 KDNuggets（一个商业分析网站）的 Alex Jones 制定的指南。他根据工具的“免费可用性（个人使用）、易用性（无需编码且设计直观）、强大功能（超越基础\
  \ Excel）和文档资源完善度”（如简单的 Google 搜索即可支持业务需求）来推荐工具。¹⁷\n\n16. **Tableau** 是一款数据可视化软件，旨在将大量原始数据转换为更易于解读的格式，以支持决策。Tableau\
  \ 软件允许用户查询关系型数据库、联机分析处理（OLAP）立方体、云数据库和电子表格，以生成图形化数据可视化。\n\n**OpenRefine**（前身为 Google\
  \ Refine），根据其网站介绍，“清理混乱的数据并将其从一种格式转换为另一种格式；通过 Web 服务进行扩展；并将其链接到像 Freebase 这样的数据库。”使用该软件，用户可以执行以下操作：¹⁸\n\
  \n1.  导入各种数据格式。\n2.  在几秒钟内探索数据集。\n3.  应用基础和高级单元格转换。\n4.  处理包含多个值的单元格。\n5.  在数据集之间创建即时链接。\n\
  6.  使用正则表达式轻松筛选和分区数据。\n7.  对全文字段使用命名实体提取以自动识别主题。\n8.  使用通用精炼表达语言执行高级数据操作。\n\n17.\
  \ **KNIME** 可通过可视化编程操作、分析和建模数据。用户通过拖拽活动之间的连接点来操作，而非编写代码块。该软件可扩展以运行 R、Python、文本挖掘、化学数据等，提供了进行更高级代码驱动分析的选项。\n\
  \n18. **RapidMiner** 是一个数据科学平台，集数据准备、机器学习和预测模型部署于一体。为数据科学家提供深度，为其他人提供简化操作。它通过可视化编程运行，可操作、分析和建模数据。\n\

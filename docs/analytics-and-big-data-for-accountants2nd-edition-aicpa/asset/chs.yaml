  \n2.  Google Maps 使用什么进行演示？\n    1.  咨询业务。\n    2.  犯罪统计。\n    3.  供应商分布。\n    4.\
  \  美国各地的邮局。\n\n## Hadoop — 究竟是什么？\n\n\n\n\n## Apache Hadoop 概述\n\nApache Hadoop\
  \ 项目开发用于可靠、可扩展、分布式计算的开源软件。Hadoop 是一个具有存储大型数据集能力的框架。数据集通过简单的编程模型分布在计算机集群上，并使用 Java\
  \ 编写，可在单台计算机或大型商用硬件计算机集群上运行。该软件源自 Google 发布的论文，并融合了 Google 文件系统和 `MapReduce` 范式的特性，这体现在\
  \ Hadoop 分布式文件系统和 Hadoop `MapReduce` 的名称中。\n\nHadoop 技术旨在消除企业中的大数据处理问题，并取得了巨大成功。它可以快速处理来自\
  \ Facebook、Twitter 等各类网站以及自动化传感器的海量数据。\n\n## Hadoop 术语\n\n*   **`Open-source software`**：在创建和管理程序的开发者开放网络上工作。\n\
  *   **`Framework`**：使用户能够开发和运行软件应用程序的一切，通过程序、工具集、连接等来实现。\n*   **`Distributed data`**：分布在多台计算机上存储，计算可在多台连接的机器上同时运行。\n\
  *   **`Massive storage`**：Hadoop 框架可将海量数据以块的形式存储在低成本商用硬件集群上。\n*   **`Faster processing`**：在紧密连接的低成本计算机集群上并行处理大量数据，以快速获得结果。\n\
  \n## 知识检验：Hadoop 描述\n\n7. 以下哪项描述了 Hadoop？\n\n    1. 它是专有的。\n    2. 它是开源的。\n    3.\
  \ 它是专有的，但可向非营利组织以优惠价格提供。\n    4. 它是专有的，且必须在 Unix 环境中运行。\n\n## Hadoop 历史\n\n更大的数据需求导致用户希望获得更快的搜索和更快的处理时间。Doug\
  \ Cutting 和 Mike Caferella 通过一个名为 `Nutch` 的开源网络搜索引擎项目来解决这些问题。他们利用低成本计算机上的分布式数据和计算来同时完成多项任务。在同一时期，Google\
  \ 正在开展一个类似的项目，以分布式方式实现数据存储和数据处理，从而返回更快、更相关的搜索结果。2006 年，Cutting 加入 Yahoo，继续 `Nutch`\
  \ 项目，该项目被分为两部分——网络爬虫部分和分布式处理部分（后者被称为 Hadoop）。\n\nHadoop 于 2008 年作为一个开源项目发布，由非营利组织\
  \ `ASF` 管理和维护。该项目由全球软件开发人员和贡献者社区开发。\n\n## Hadoop 核心组件\n\n![](img/ufig5-30.png)\n\
  \n来源：“Big Data Basics,” MSSQLTIPS, [www.mssqltips.com/sqlservertip/3262/big-data-basics--part-6--related-apache-projects-in-hadoop-ecosystem/](http://www.mssqltips.com/sqlservertip/3262/big-data-basics--part-6--related-apache-projects-in-hadoop-ecosystem/)\n\
  \n这些是 `ASF` 的核心组件。\n\n*   **`HDFS`**：基于 Java 的分布式文件系统，可存储结构化、非结构化等数据，无需预先组织。\n*\
  \   **`MapReduce`**：允许并行处理大量数据集的软件模型。\n*   **`YARN`**：用于调度和处理分布式应用资源请求的资源管理框架。\n\
  *   **`Pig`**：用于操作存储在 `HDFS` 中数据的平台。所有这些都是通过一个名为 `Pig Latin` 的编译器完成的，用于 `MapReduce`\
  \ 程序和高级语言。用户可以避免编写 `MapReduce` 程序来执行数据提取、转换、加载和基本分析。\n*   **`Hive`**：类似于数据库编程，它以表的形式创建数据。`Hive`\
  \ 是数据仓库和查询语言。\n*   **`HBase`**：运行在 Hadoop 之上，作为 `MapReduce` 作业的输入和输出。它是一个非关系型分布式数据库。\n\
  *   **`Zookeeper`**：用于协调分布式进程的应用程序。\n*   **`Ambari`**：用于在 Hadoop 环境中进行管理、配置和测试的\
  \ Web 界面。\n*   **`Flume`**：收集、聚合并将数据流式传输到 `HDFS` 的软件。\n*   **`Sqoop`**：在 Hadoop\
  \ 及其关系型数据库之间移动数据的传输机制。\n*   **`Oozie`**：Hadoop 作业调度器。\n\n## 知识检验：Hive\n\n8. 什么是\
  \ `Hive`？\n\n    1. 数据清洗程序。\n    2. DA 工具。\n    3. 数据仓库和查询语言。\n    4. 用于协调分布式进程的应用程序。\n\

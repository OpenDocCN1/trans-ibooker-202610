  # 概述


  ## 欢迎来到会计师的分析与大数据


  传统会计正让位于会计与分析的混合模式，而分析一直是驱动力。工具已被创建用于衡量项目效果和投资回报、可视化数据和业务流程，以及发掘关键绩效指标之间的关系——许多工具利用了前所未有的大量数据涌入组织。在本课程中，您将讨论分析与金融领域的前沿主题，课程内容充满实用技巧和实操指导，您可即刻应用。


  ## 引言


  会计师的角色将继续从数据创建者、操纵者和归档者向数据科学家和讲故事者转变。当今会计师必须跟上技术变革的步伐，认识到从历史分析转向预测性变革，最终转向规范性变革的必要性。


  正是在这一背景下，大数据和分析的出现已经影响了许多组织，并在未来将发挥更为重要的作用。


  ## 讨论主题


  * 用于查找或生成数据、选择关键绩效指标、分离项目效果的循证技术

  * 将数据与投资回报、财务价值和高管决策相关联

  * 数据来源，包括调查、访谈、客户满意度、敬业度和运营数据

  * 可视化和呈现复杂结果


  ## 本课程章节


  * 第 1 章：什么是大数据和分析？

  * 第 2 章：大数据历史——大数据来源和特征

  * 第 3 章：大数据有哪些趋势？

  * 第 4 章：大数据的战略和业务应用是什么？

  * 第 5 章：大数据平台和操作工具

  * 第 6 章：大数据最终用户和会计工具

  * 第 7 章：大数据示例

  * 第 8 章：会计部门的大数据

  * 第 9 章：大数据的伦理与隐私


  ## 开篇讨论


  随着您在课程中的进展，请思考以下挑战：


  * 您的组织目前可以访问哪些已在系统中且可供使用的信息？

  * 您的组织中存在但未被采集的信息有哪些，您可以获取吗？

  * 互联网上存在哪些行业数据库或政府数据库信息，您可以访问？




  * 通过传感器和机器可以获取哪些信息，从而深入了解贵企业的运营和战略动态？


  ## 练习


  花几分钟记下贵组织目前拥有的信息类型将大有裨益。当您考虑分析和大数据的不同应用时，此分析将很有帮助。请使用表 0-1 来收集您的信息。


  表 0-1： 贵组织有哪些可用信息？



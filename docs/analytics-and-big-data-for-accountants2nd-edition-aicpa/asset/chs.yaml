  \n\n\n\n## 练习：结构化数据分析\n\n本练习旨在展示以结构化术语收集的信息类型，这些信息通常是我们无法直接访问的。接下来的内容更有趣。前述数据来自\
  \ 2015 年 5 月 5 日。数据被采集并导入 Excel，经过解析，提取了所需信息以使其更加用户友好。随后，两天后（5 月 7 日）运行了相同的报告并放入同一个\
  \ Excel 工作表。以下图片代表一张大图——数据的最左端和最右端。\n\n![](img/ufig6-7.png) ![](img/ufig6-8.png)\n\
  \n## 对比 5 月 5 日与 5 月 7 日\n\n你能发现什么特别有趣的地方？\n\n______________________________________________________________________________\n\

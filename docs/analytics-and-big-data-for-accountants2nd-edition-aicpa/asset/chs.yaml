  \n## 解答\n\n### 第 1 章\n\n#### 练习题解答\n\n1. 大数据包含大容量、高速度和多样性的信息资产，这些资产需要具有成本效益的创新信息处理形式，以增强洞察力和决策能力。大数据可分为结构化数据、非结构化数据和流数据等领域。\n\
  \n2. 描述性、诊断性、预测性和规范性。\n\n3. Hadoop 是一个免费的、基于 Java 的编程框架，支持在分布式计算环境中处理大型数据集。它是 Apache\
  \ 软件基金会赞助的 Apache 项目的一部分。\n\n4. 数据科学家是指擅长分析数据（特别是大量数据）以帮助企业获得竞争优势的员工或商业智能顾问。\n\n\
  #### 知识检验解答\n\n1. \n   1. 错误。大数据适用于任何组织，而不仅仅是跨国公司。\n   2. 正确。结构化数据、非结构化数据和流数据。\n\
  \   3. 错误。大数据超越了 ERP 系统。它包含所有数据：结构化数据、非结构化数据和流数据。\n   4. 错误。大数据指的是一种数据类型。串行处理与大数据无关，但大规模并行处理相关。\n\
  \n2. \n   1. 错误。Instagram 用户每天每分钟分享约 55,000 张照片，而非 25,000 张。\n   2. 正确。Instagram\
  \ 用户每天每分钟分享约 55,000 张照片。\n   3. 错误。Instagram 用户每天每分钟分享约 55,000 张照片，而非 75,000 张。\n\
  \   4. 错误。Instagram 用户每天每分钟分享约 55,000 张照片，而非 100,000 张。\n\n3. \n   1. 错误。1 PB 可存放\
  \ 5×1000 亿页。1 PB 是 1 后面跟 15 个零，约相当于 5000 亿页标准文本。\n   2. 正确。1 PB 是 1 后面跟 15 个零，约相当于\
  \ 5000 亿页标准文本。\n   3. 错误。1 PB 是 1 后面跟 15 个零，可存放 5000 亿页标准打印文本，而非 9000 亿页。\n   4.\
  \ 错误。1 PB 是 1 后面跟 15 个零，可存放 5000 亿页标准打印文本，而非 7500 亿页。\n\n4. \n   1. 正确。大数据决策更明智、更快速、更准确。\n\
  \   2. 错误。大数据决策并非更慢。它更快速、更明智、更准确。\n   3. 错误。大数据决策并非更慢或更透明。它更快速、更明智、更准确。\n   4. 错误。大数据更明智、更快速、更准确，而非速度相同且更结构化。\n\
  \n### 第 2 章\n\n#### 练习题解答\n\n1. 评论应包含以下演进过程。当通过会计的视角审视大数据历史时，可按以下七个不同领域的相互作用进行分类：\n\
  \   1. 记账\n   2. 会计\n   3. 计算机器\n   4. 计算机\n   5. 互联网\n   6. 云计算\n   7. 物联网\n\n\
  2. 大数据来源众多。讨论可包括以下任意来源：\n   1. Facebook\n      1. 帖子\n      2. 消息\n      3. 照片\n\
  \      4. 消费趋势\n   2. Google 搜索\n   3. LinkedIn\n      1. 帖子\n      2. 求职搜索\n  \
  \    3. 背景调查\n      4. 群组帖子\n   4. 电子邮件数据库\n   5. 零售 CRM\n   6. 医疗健康\n      1. 保险\n\
  \      2. 医院\n      3. 心理健康\n      4. 监狱\n   7. 论坛\n   8. 社交媒体\n   9. Twitter\n\
  \   10. RFID 标签\n   11. 拍照手机\n   12. 支持 GPS 的设备\n   13. 智能电表\n   14. 电视偏好\n   15.\
  \ YouTube\n   16. 音乐工具\n   17. 政府数据库\n   18. Amazon.com\n       1. 其他读者已选择\n   \
  \    2. 社区宝箱\n\n3. 容量、多样性、速度、真实性\n\n4. 此讨论有多个正确答案，但可能包括机器传感器、社交媒体上的客户评论、客户调查、客流量、停车场车辆、退货模式、政府或行业数据库等。\n\
  \n#### 知识检验解答\n\n1. \n   1. 错误。Lotus 不是第一个电子表格。VisiCalc 创建于 1978 年。\n   2. 错误。Excel\
  \ 不是第一个电子表格。VisiCalc 创建于 1978 年。\n   3. 正确。VisiCalc 创建于 1978 年。\n   4. 错误。Multi-mate\
  \ 不是第一个电子表格。VisiCalc 创建于 1978 年。\n\n2. \n   1. 错误。汉谟拉比法典早于罗马税法。\n   2. 正确。汉谟拉比法典是最早的交易记录。\n\
  \   3. 错误。希腊商业记录晚于汉谟拉比法典。\n   4. 错误。本章未提及中国贸易记录，但提到了汉谟拉比法典。\n\n3. \n   1. 错误。美国国防部创建了互联网的第一个基础模块，而非\
  \ UCLA。\n\n\n\n\n### 第 2 章\n\n### 练习题答案\n\n2. 正确。美国国防部创建了 ARPANET，这是一个旨在抵御任何灾难的计算机网络。它成为了当今互联网的第一块基石。\n\
  \n3. 不正确。美国国防部创建了互联网的第一块基石，而不是斯坦福大学。\n\n4. 不正确。美国国防部创建了互联网的第一块基石，而不是哈佛大学。\n\n###\
  \ 知识检查答案\n\n4. \n    1. 不正确。估计是 11 亿台设备，而不是 5 亿。\n    2. 不正确。估计是 11 亿台设备，而不是 7 亿。\n\
  \    3. 正确。估计是 11 亿台设备。\n    4. 不正确。估计是 11 亿台设备，而不是 15 亿。\n\n### 第 3 章\n\n### 练习题答案\n\
  \n1. 可解释性 AI 的兴起 —— 除了结论和建议外，AI 还将提供解释，以帮助用户更清楚地理解建议的依据。\n\n2. 以下商业智能 (BI) 趋势是 2020\
  \ 年的新趋势：¹\n\n    * 成为实时企业不再是可选项。\n    * 大数据只是数据。下一步？宽数据。\n    * 图分析和关联技术超越 SQL。\n\
  \    * DataOps 加自助服务是新的敏捷。\n    * 活跃元数据目录是数据和分析的连接组织。\n    * 数据素养即服务的出现。\n    *\
  \ 多面交互将带我们超越搜索。\n    * 伦理和负责任的计算现在至关重要。\n    * 数据的“Shazam”：有什么可能？\n    * 独立与技术栈：续集。\n\
  \n### 知识检查答案\n\n1. \n    1. 不正确。变革的最大障碍是人、流程和文化，而不是预算限制。\n    2. 不正确。变革的最大障碍是人、流程和文化，而不是技术限制。\n\
  \    3. 正确。变革的最大障碍是人、流程和文化。\n    4. 不正确。变革的最大障碍是人、流程和文化，而不是行政政策。\n\n2. \n    1.\
  \ 不正确。兴趣并未趋于平稳，而是在消退。\n    2. 不正确。兴趣水平在消退。它并没有增加。\n    3. 正确。区块链的兴趣水平已消退。\n    4.\
  \ 不正确。兴趣水平并未保持不变，而是在消退。\n\n### 第 4 章\n\n### 练习题答案\n\n1. 为利益相关者增加企业价值。\n\n2. \n \
  \   * 变革管理挑战可包含以下任何评论：\n        * 机构变革管理\n        * 确保跨司法管辖区协作和通用标准\n        * 阻碍大数据收集和组织的不同部门系统\n\
  \        * 获取技术胜任的员工\n        * 陡峭的技术学习曲线\n        * 雇佣合格人员\n        * 本质上属于文化性质的部门间壁垒\n\
  \        * 不被接受或不被信任的数据\n        * 数据所有权，尤其是与组织文化相关时\n        * 缺乏业务赞助\n       \
  \ * 缺乏对商业案例的信心\n\n3. 许多推文来自曼哈顿，而不是停电发生的重灾区。\n\n### 知识检查答案\n\n1. \n    1. 正确。为股东或利益相关者增加价值是所有活动的根本目标。\n\
  \    2. 不正确。增加可扩展架构是增加价值的一种策略。根本目标是为利益相关者增加价值。\n    3. 不正确。增加大数据容量是增加价值的一种策略。根本目标是为利益相关者增加价值。\n\
  \    4. 不正确。虽然需要数据集成，但为股东或利益相关者增加价值是主要目标。\n\n2. \n    1. 不正确。监控产品质量是可通过大数据实现的洞察。多代产品难得多。\n\
  \    2. 不正确。识别客户需求是可通过大数据实现的洞察。多代产品难得多。\n    3. 正确。创建第三代和第四代产品。\n    4. 不正确。未提及征求意见，但提到了第三代和第四代产品。\n\
  \n3. \n    1. 不正确。首要问题是数据集成复杂性，而不是缺乏业务赞助。\n    2. 不正确。首要问题是数据集成复杂性，而不是 IT 员工缺乏技能。\n\
  \    3. 正确。数据集成复杂性是首要问题。\n    4. 不正确。数据集成是首要问题，而不是数据质量差。\n\n4. \n    1. 正确。使用迭代实施策略。\n\
  \    2. 不正确。关注技术而非业务需求是大数据错误。\n    3. 不正确。不执行成本效益分析是大数据错误。\n    4. 不正确。作为“大爆发”方法或试点实施的一部分并行执行多个计划是大数据错误。\n\
  \n### 第 5 章\n\n### 练习题答案\n\n1. 查询和报告、数据挖掘、优化和预测分析是众多大数据功能中的一部分。\n\n2. Apache Hadoop\
  \ 是一个框架，允许使用简单的编程模型跨计算机集群存储分布式大数据集，并用 Java 编写，可在单台计算机上运行，也可在大型商用硬件计算机集群上运行。\n\n\
  3. Map Reduce 是一种软件模型，允许并行处理大量数据集。\n\n4. R 是一种用于统计计算和绘图的语言和环境。它是一个 GNU 项目，类似于贝尔实验室开发的\
  \ S 语言和环境。\n\n### 知识检查答案\n\n1. \n    1. 不正确。探索性数据分析是在数据中发现新特征，而不是使用统计模型进行预测。\n \
  \   2. 不正确。确认现有信念不是探索性数据分析，后者涉及在数据中发现新特征。\n    3. 正确。在数据中发现新特征。\n    4. 不正确。规定行动是最后的过程；首先，有必要在数据中发现新特征。\n\
  \n2. \n    1. 正确。SAP 没有基础设施组件。\n    2. 不正确。Oracle 有基础设施，而 SAP 没有。\n    3. 不正确。IBM\
  \ 有基础设施，而 SAP 没有。\n    4. 不正确。HP 有基础设施，而 SAP 没有。\n\n3. \n    1. 不正确。MapR 代表一个完整的\
  \ Apache Hadoop 发行版，而不是一个减小所分析大数据规模的程序。\n    2. 不正确。MapR 是一个完整的，而不是不完整的 Apache Hadoop\
  \ 发行版。\n    3. 正确。包含十多个项目的完整 Apache Hadoop 发行版。\n    4. 不正确。它不是关系数据库，而是十多个项目的完整发行版。\n\
  \n4. \n    1. 不正确。Teradata 是一个图处理引擎，而不是大数据的农业应用。\n    2. 不正确。Teradata 是一个图处理引擎，而不是数据分析软件。\n\
  \    3. 正确。用于图分析的原生图处理引擎。\n    4. 不正确。它不是关系数据库，而是一个图分析工具。\n\n5. \n    1. 不正确。WolframAlpha\
  \ 是一个专业搜索引擎，而不是数据分析软件。\n    2. 正确。WolframAlpha 被称为“极客版 Google”。\n    3. 不正确。WolframAlpha\
  \ 是一个专业搜索引擎，而不是预测分析软件。\n    4. 不正确。它不是 MapR 框架内的程序，而是“极客版 Google”。\n\n6. \n    1.\
  \ 正确。Google Maps 通过作者的咨询项目进行了说明。\n\n\n\n\n#### 第 5 章\n\n#### 知识检查答案\n\n2. 错误。犯罪统计数据是用融合表说明的；Google\
  \ Maps 是用咨询项目说明的。\n\n3. 错误。Google Maps 是用作者的咨询项目说明的，而不是用供应商分布。\n\n4. 错误。Google Maps\
  \ 没有使用邮局数据，而是使用了犯罪统计数据。\n\n7.\n\n1. 错误。Hadoop 不是专有软件。它是开源的。\n\n2. 正确。Hadoop 是开源的。\n\
  \n3. 错误。Hadoop 通过开源方式可供所有人使用。\n\n4. 错误。Hadoop 不是专有软件，而是开源的。\n\n8.\n\n1. 错误。Hive\
  \ 是数据仓库工具，不是数据清洗程序。\n\n2. 错误。Hive 是数据仓库工具，不是数据分析工具。\n\n3. 正确。Hive 是数据仓库工具，也是一种查询语言。\n\
  \n4. 错误。Hive 并非为分布式进程设计，而是为数据仓库设计的。\n\n### 第 6 章\n\n#### 练习题答案\n\n1.\n\n讨论可以包括章节开头列出的许多项目，包括以下内容：\n\
  \n* 商品与非商品地位\n* 产品可获得性\n* 可用的替代产品\n* 采购量\n* 季节性\n* 相关产品购买情况\n\n2.\n\n百思买的大数据代表了任何给定日期搜索量前\
  \ 10 位的商品，以及适用于每个商品的一系列数据。\n\n3.\n\n对于每家公司，可以有许多不同的来源。文中提到工业生产统计和零售贸易统计作为示例。\n\n\
  4.\n\n文本分析是从文本中提取高质量信息的过程。\n\n#### 知识检查答案\n\n1.\n\n1. 错误。查询构建器为百思买数据编写查询。它不允许创建“假设性”分析。\n\
  \n2. 错误。查询构建器编写查询，而不是处理不再需要的电子物品。\n\n3. 正确。查询构建器是一个为百思买产品编写自定义查询的应用程序。\n\n4. 错误。查询构建器不是“如果这样，那么那样”工具。它是一个为百思买产品编写自定义查询的工具。\n\

- pgno: 25
  md: '# 1.4.1 Physical dimensions


    The Power E1080 is a modular system that is build of a single SCU and one, two,
    three, or four system nodes.


    Each system component must be mounted in a 19-inch industry standard rack. The
    SCU requires 2U rack units and each system node requires 5U rack units. Thus,
    a single-node system requires 7U, a two-node system requires 12U, a three-node
    system requires 17U, and a four-node system requires 22U rack units. More rack
    space must be allotted; for example, to PCIe I/O expansion drawers, a hardware
    management console, flat panel console kit, network switches, power distribution
    units, and cable egress space.


    Table 1-2 lists the physical dimensions of the Power E1080 server control unit
    and a Power E1080 server node. The component height is also given in Electronic
    Industries Alliance (EIA) rack units. (One EIA unit corresponds to one rack unit
    (U) and is defined as 1 3/4 inch or 44.45 mm respectively).


    Table 1-2 Physical dimensions of the Power E1080 server components,


    | Dimension | Power E1080 server control unit | Power E1080 server node |

    |---|---|---|

    | Width | 445.6 mm (17.54 in) | 445 mm (17.51 in) |

    | Depth | 779.7 mm (30.7 in) | 866.95 mm (34.13 in) |

    | Height | 86 mm (3.39 in) / 2 EIA units | 217.25 mm (8.55 in) / 5 EIA units |

    | Weight | 22.7 kg (50 lb) | 81.6 kg (180 lb) |


    # Lift tools


    It is recommended to have a lift tool available at each site where one or more
    Power E1080 servers are located to avoid any delays when servicing systems. An
    optional lift tool #EB2Z is available for order with a Power E1080 server. One
    #EB2Z lift tool can be shared among many servers and I/O drawers. The #EB2Z lift
    tool provides a hand crank to lift and position up to 159 kg (350 lb). The #EB2Z
    lift tool is 1.12 meters x 0.62 meters (44 in x 24.5 in).


    > Note: A single system node can weigh up to 86.2 kg (190 lb). Also available
    are a lighter, lower-cost lift tool #EB3Z and wedge shelf tool kit for #EB3Z with
    feature code #EB4Z.


    # 1.4.2 Electrical characteristics


    Each Power E1080 server node has four 1950 W bulk power supplies. The hardware
    design provides N+2 redundancy for the system power supply, and any node can continue
    to operate at full function in nominal mode with any two of the power supplies
    functioning.


    Depending on the specific Power E1080 configuration, the power for the SCU is
    provided through two UPIC cables connected to one or two system nodes, as described
    in 1.2, “System nodes” on page 6.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Table 1-3 lists the electrical characteristics per Power E1080 server node.
    For planning purposes, use the maximum values that are provided. However, the
    power draw and heat load depends on the specific processor, memory, adapter, and
    expansion drawer configuration and the workload characteristics.


    Table 1-3 Electrical characteristics per Power E1080 server node


    | Electrical characteristics | Properties |

    |---|---|

    | Operating voltage | 200 - 208 / 220 - 240 V AC |

    | Operating frequency | 50 or 60 Hz +/- 3 Hz AC |

    | Maximum power consumption | 4500 W |

    | Maximum power source loading | 4.6 kVA |

    | Maximum thermal output | 15355 BTU/h |

    | Phase | Single |


    > Note: The Power E1080 must be installed in a rack with a rear door and side
    panels for electromagnetic compatibility (EMC) compliance.


    # 1.4.3 Environment requirements and noise emission


    > Environmental assessment: The IBM Systems Energy Estimator tool can provide
    more accurate information about power consumption and thermal output of systems
    based on a specific configuration.


    The environment requirements for the Power E1080 servers are classified in operating
    and non-operating environments. The operating environments are further segmented
    regarding the recommended and allowable conditions.


    The recommended operating environment designates the long-term operating environment
    that can result in the greatest reliability, energy efficiency, and reliability.
    The allowable operating environment represents where the equipment is tested to
    verify functionality. Because the stresses that operating in the allowable envelope
    can place on the equipment, these envelopes must be used for short-term operation,
    not continuous operation.


    The condition of a non-operating environment pertains to the situation when equipment
    is removed from the original shipping container and is installed, but is powered
    down. The allowable non-operating environment is provided to define the environmental
    range that an unpowered system can experience short term without being damaged.


    Table 1-4 on page 14 lists the environment requirements for the Power E1080 server
    regarding temperature, humidity, dew point, and altitude. It also lists the maximum
    noise emission level for a fully configured Power E1080 server.'

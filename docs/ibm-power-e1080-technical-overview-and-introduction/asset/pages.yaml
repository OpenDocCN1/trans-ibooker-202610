  md: '# 2.8 External disk subsystems


    This section describes the following external disk subsystems that can be attached
    to the Power E1080 server:


    +   EXP24SX SAS Storage Enclosures


    +   IBM System Storage


    # 2.8.1 IBM EXP24SX SAS Storage Enclosure


    The EXP24SX SAS storage enclosure (#ESLS) is the only DASD drawer that is available
    for Power E1080 that provides extra disk drives. The ESLS supports SSDs and HDDs.
    The ESLS storage enclosures are connected to system units by using a serial-attached
    SCSI (SAS) port in the SAS adapters.


    The EXP24SX is a storage expansion enclosure with 24 2.5-inch small form factor
    (SFF) SAS bays. It supports 10K and 15K SAS HDD having 512 and 4K format drives
    and enterprise and mainstream class SAS SSDs.


    The enclosures can be split logically into one, two, or four independent groups:


    +   One set of 24 bays (mode 1) (D1-D24),


    +   Two sets of 12 bays (mode 2), (D1-D12) (D13-D24)or


    +   Four sets of 6 bays (mode 4).(D1-D6) (D7-D12) (D13-D18) (D19-D24)


    The front view of the ESLS storage enclosure with drive locations is shown in
    Figure 2-30.


    ![](img/7c8373945565ba432037f60bbf8458eb_119_0.png)


    Figure 2-30 Front view of the ESLS storage enclosure with mode groups & drive
    locations


    The SAS storage enclosures support the following operating systems:


    +   AIX


    +   IBM i


    +   Linux


    +   VIOS'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'The following PCIe Gen 3 SAS adapters support the EXP24SX drawers:


    +   - PCIe Gen 3 RAID SAS Adapter Quad-port 6 Gb x8 (#EJ0J)

    +   - PCIe Gen 3 LP RAID SAS Adapter Quad-Port 6 Gb x8 (#EJ0M)

    +   - PCIe3 SAS Tape/DVD Adapter Quad-port 6 Gb x8 (#EJ10)

    +   - PCIe3 LP SAS Tape/DVD Adapter Quad-port 6 Gb x8 (#EJ11)

    +   - PCIe Gen 3 12 GB Cache RAID Plus SAS Adapter Quad-port 6 Gb x8 (#EJ14)


    IBM i configurations require the drives to be protected (RAID or mirroring). Protecting
    the drives is highly advised, but not required for other operating systems. All
    Power servers operating system environments that use SAS adapters with write cache
    require the cache to be protected by using pairs of adapters.


    The EXP24SX drawers feature the following high-reliability design points:


    +   - SAS bays that support hot-swap.

    +   - Redundant and hot-plug power and fan assemblies.

    +   - Dual power cords.

    +   - Redundant and hot-plug Enclosure Services Managers (ESMs).

    +   - Redundant data paths to all drives.

    +   - LED indicators on drives, bays, ESMs, and power supplies that support problem
    identification.

    +   - Through the SAS adapters and controllers, drives that can be protected with
    RAID and mirroring and hot-spare capability.


    Notes: Consider the following points about mixing SSDs and HDDs:


    +   - SSDs and HDDs cannot be mixed when configured in mode 1.

    +   - SSDs and HDDs can be mixed when configured in mode 2: One disk partition
    can be SSDs and the other disk partition can be HDDs, but you cannot mix within
    a disk partition.

    +   - SSDs and HDDs can be mixed when configured in mode 4. Each disk partition
    can be SSDs or HDDs, but cannot mix within a disk partition.


    For example, in a mode 2 drawer with two sets of 12 bays, one set can hold SSDs
    and one set can hold HDDs, but you cannot mix SSDs and HDDs in the same set of
    12-bays.


    The cables that are used to connect an #ESLS storage enclosure to a server are
    different from the cables that are used with the 5887 disk drive enclosure. Attachment
    between the SAS controller and the storage enclosure SAS ports is through the
    suitable SAS YO12 or X12 cables. The PCIe Gen3 SAS adapters support 6 Gb throughput.
    The EXP12SX drawer supports up to 12 Gb throughput if future SAS adapters support
    that capability.


    The following cable options are available:


    +   - 3.0M SAS X12 Cable (Two Adapter to Enclosure (#ECDJ)

    +   - 4.5M SAS X12 AOC (Two Adapter to Enclosure (#ECDK)

    +   - 10M SAS X12 AOC (Two Adapter to Enclosure (#ECDL)


    # 2.4.5 Elastic Capacity on-Demand (Temporary)


    With the Elastic CoD offering, you can temporarily activate and deactivate processor
    cores and memory units to help meet the demands of business peaks, such as seasonal
    activity, period-end, or special promotions. When you order an Elastic CoD feature,
    you receive an enablement code that allows a system uses to make requests for
    more processor and memory capacity in increments of one processor day or 1 GB
    memory day. The system monitors the amount and duration of the activations. With
    Power E1080 server, only the prepaid Elastic Capacity on-Demand option is available
    with feature code 4586-COD in econﬁg or directly from ESS.


    Processors and memory can be activated and turned off an unlimited number of times
    when more resources are needed.


    This offering provides a system administrator an interface at the HMC to manage
    the activation and deactivation of resources. Before temporary capacity is used
    on your server, you must enable your server. To enable your server, an enablement
    feature (MES only) must be ordered and the required contracts must be in place.
    The 90-day enablement feature is not available for the Power E1080 processors.'

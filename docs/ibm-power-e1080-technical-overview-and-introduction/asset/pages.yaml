    # 2.5.2 Internal NVMe storage subsystem


    The Power E1080 supports NVMe storage technology. The NVMe subsystem is available
    in each of the E1080 server node drawers. Four internal NVMe U.2 drive slots are
    present in each of the system nodes in the center of the rear of the system. The
    slots can be independently assigned to any of the partitions (see Figure 2-19).


    ![](img/7c8373945565ba432037f60bbf8458eb_100_0.png)


    Figure 2-19 Rear view of a E1080 server node highlighting NVMe slots


    As of this writing, no feature codes support IBM i for the internal NVMe subsystem.
    An external drawer is needed in this case.


    The internal 7mm NVMe devices support only one namespace. The primary use of the
    devices is to host Virtual I/O Servers.


    The location of the NVMe U.2 drives in the system node is shown in Figure 2-20
    on page 88.'

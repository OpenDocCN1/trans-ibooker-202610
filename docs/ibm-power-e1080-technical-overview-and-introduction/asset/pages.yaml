  md: '# 1.5.8 System node PCIe interconnect features


    Each system node provides 8 PCIe Gen5 hot-plug enabled slots; therefore, a 2-node
    system provides 16 slots, a 3-node system provides 24 slots, and a 4-node system
    provides 32 slots.


    Up to four I/O expansion drawer features #EMX0 can be connected per node to achieve
    the slot capacity that is listed in Table 1-14.


    Table 1-14 PCIe slots availability for different system nodes configurations



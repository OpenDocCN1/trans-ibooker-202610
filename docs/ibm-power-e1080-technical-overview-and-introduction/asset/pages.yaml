    For more information, see 2.5.2, “Internal NVMe storage subsystem” on page 87.


    For systems that are running IBM i, an expansion or storage drawer can meet the
    NVMe requirements.


    # 1.5.6 System node USB features


    The Power E1080 supports one stand-alone external USB drive that is associated
    to feature code EUA5. The feature code includes the cable that is used to the
    USB drive to the preferred front accessible USB port on the SCU.


    The Power E1080 server node does not offer an integrated USB port. The USB 3.0
    adapter feature code EC6J is required to provide connectivity to an optional external
    USB DVD drive and requires one system node or I/O expansion drawer PCIe slot.
    The adapter connects to'
  merge: -1

- pgno: 134
  md: '![](img/7c8373945565ba432037f60bbf8458eb_134_0.png)


    Figure 2-36 Display Firmware Status window


    # 2.11 Manageability


    Manageability of the system is a key component for customers to manage, service,
    test, and monitor the system performance, security, and reliability.


    # 2.11.1 Service user interface


    To manage and service the system, the E1080 offers the following service interfaces:


    +   - ASMI

    +   - HMC GUI/CLI

    +   - Operator panel

    +   - Operating system


    ASMI is a graphical interface that is part of the service processor firmware.
    The ASMI manages and communicates with the service processor. The ASMI is required
    to set up the service processor and to perform service tasks, such as reading
    service processor error logs, reading vital product data, and controlling the
    system power.


    ASMI can be accessed by using the HMC GUI or CLI or directly attaching a laptop
    to the FSP port with an Ethernet cable that is crossed or through a switch (the
    same network subnet is required). Some of the functions in the ASMI are limited
    only to IBM service representatives, which requires celogin or dev user credentials
    during repair activities.


    The control panel functions allow you to interface with the server. Control panel
    functions range in complexity from functions that display a status (such as IPL
    speed) to service functions that only service representatives can access.


    For more information about a full list of all functions, see this web page.'
  merge: -1
  img_proc: true
- pgno: 135

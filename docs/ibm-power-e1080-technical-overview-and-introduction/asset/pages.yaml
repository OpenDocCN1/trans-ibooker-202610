    # 2.4.6 IBM Power Enterprise Pools 1.0 and Mobile Capacity on-Demand


    Although static activations are valid for a single system, some customers might
    benefit from moving processor and memory activations to different servers because
    of workload rebalance or disaster recovery.


    IBM Power Enterprise Pools 1.0 is a technology for dynamically sharing processor
    and memory activations among a group (or pool) of IBM Power Systems servers. By
    using Mobile Capacity on-Demand (CoD) activation codes, the systems administrator
    can perform tasks without contacting IBM.


    With this capability, you can move resources between Power E1080 and Power E980
    systems and have unsurpassed flexibility for workload balancing and system maintenance.


    Note: Only two consecutive generation of Power servers are supported in the same
    Power Enterprise Pools 1.0; therefore, Power E1080 can be mixed with Power E980
    servers only.


    The supported Power Enterprise Pool 1.0 members are listed by pool type in Table
    2-9.


    Table 2-9 Supported Power Enterprise Pool 1.0 members by pool type


    | Power Enterprise Pool type | Pool members |

    |---|---|

    | Midrange Power Enterprise Pool 1.0 | 770+, E870, E870C, E880C |

    | High-end Power Enterprise Pool 1.0 | 780+, 795, E880, E870C, E880C |

    | Power Enterprise Pool 1.0 | E870, E880, E870C, E880C, E980 |

    | Power Enterprise Pool 1.0 (with Power E1080) | E980, E1080 |


    A pool can support systems with different clock speeds or processor generations.


    Mobile Capacity on Demand (Mobile CoD) features the following basic rules:


    +   - The Power E1080 server requires a minimum of 16 static processor activations.

    +   - The Power E980 server requires a minimum of eight static processor activations.

    +   - For all systems, 50% of the installed memory must have activations, and
    a minimum of 25% of those must be static activations.


    An HMC can manage multiple IBM Power Enterprise Pools and systems that are not
    part of an IBM Power Enterprise Pool. Systems can belong to only one IBM Power
    Enterprise Pool at a time. Powering down an HMC does not limit the assigned resources
    of participating systems in a pool, but does limit the ability to perform pool
    change operations.


    After an IBM Power Enterprise Pool is created, the HMC can be used to perform
    the following tasks:


    +   - Mobile CoD processor and memory resources can be assigned to systems with
    inactive resources. Mobile CoD resources remain on the system to which they are
    assigned until they are removed from the system.

    +   - New systems can be added to the pool and existing systems can be removed
    from the pool.'

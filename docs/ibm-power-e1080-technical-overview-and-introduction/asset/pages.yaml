    # 2.2 SMP interconnection


    Each of the four Power10 processor chips in the system node drawer are connected
    directly to a Power10 processor chip at the same position in every other system
    node drawer by using the SMP OP-bus. Each OP-bus connection between any two system
    node drawers uses a pair of cables for the connection, with each cable carrying
    one half of the data lanes.


    Power System E980 SMP cables cannot be used on Power E1080 because the Power10
    processor-based server uses a different set of cables.


    Figure 2-11 shows how each Power10 processor socket in a system node drawer has
    the bus routed to the rear tailstock of the chassis. The Power10 processor chip
    in the first socket (see processor chip socket #0 in Figure 2-11) uses ports T0
    and T1 for the OP6 bus connection (see top left corner in Figure 2-11).



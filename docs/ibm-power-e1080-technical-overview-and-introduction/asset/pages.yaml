    |---|---|---|---|

    | 1 | 4 | 8 | 48 |

    | 2 | 8 | 16 | 96 |

    | 3 | 12 | 24 | 144 |

    | 4 | 16 | 32 | 192 |


    Each I/O expansion drawer consists of two Fanout Module feature #EMXH, each providing
    six PCIe slots. Each Fanout Module connects to the system by using a pair of CXP
    cable features. The CXP cable features are listed in Table 1-16 on page 27.


    Table 1-15 Optical CXP cable feature


    | Feature code | CCIN | Description | OS support | Order type |

    |---|---|---|---|---|

    | ECCR |  | 2 M Active Optical Cable Pair for PCIe Gen 3 Expansion Drawer |  |
    Both |

    | ECCY |  | 10 M Active Optical Cable Pair for PCIe Gen 3 Expansion Drawer |  |
    Both |

    | ECCZ |  | 20 M Active Optical Cable Pair for PCIe Gen 3 Expansion Drawer |  |
    Both |


    The RPO-only cables in this list are not available for ordering new or MES upgrade,
    but for migrating from a source system. Select a longer length feature code for
    inter-rack connection between the system node and the expansion drawer.


    The one pair of CXP optical cable connects to system node by using one 2-ports
    PCIe optical cable adapter feature EJ24, which is placed in the CEC.


    Both CXP optical cable pair and the optical cable adapter features are concurrently
    maintainable. Therefore, careful balancing of I/O, assigning adapters through
    redundant EMX0 expansion drawers, and different system nodes can ensure high-availability
    for I/O resources that are assigned to partitions.


    **Note:** At the time of this writing, feature EMXH is the only supported or orderable
    fanout module. Previous fanout module features EMXF and EMXG are not supported
    on Power E1080 system.


    For more information abut internal buses and the architecture of internal and
    external I/O subsystems, see 2.5, “Internal I/O subsystem” on page 83.'

    a. PHYP supports a maximum 240 x SMT8 = 1920. AIX support up to 1920 (240xSMT8)
    total threads in a single partition, starting with AIX v7.3 + Power10.


    # 2.1.4 Matrix-multiply assist AI workload acceleration


    The matrix-multiply assist (MMA) facility was introduced by the Power Instruction
    Set Architecture (ISA) v3.1. The related instructions implement numerical linear
    algebra operations on small matrices and are meant to accelerate computation-intensive
    kernels, such as matrix multiplication, convolution, and discrete Fourier transform.


    To efficiently accelerate MMA operations, the Power10 processor core implements
    a dense math engine (DME) microarchitecture that effectively provides an accelerator
    for cognitive computing, machine learning, and AI inferencing workloads.


    The DME encapsulates compute efficient pipelines, a physical register file, and
    associated data-flow that keeps resulting accumulator data local to the compute
    units. Each MMA pipeline performs outer-product matrix operations, reading from
    and writing back a 512-bit accumulator register.


    Power10 implements the MMA accumulator architecture without adding an architected
    state. Each architected 512-bit accumulator register is backed by four 128-bit
    Vector Scalar eXtension (VSX) registers.


    Code that uses the MMA instructions is included in OpenBLAS and Eigen libraries.
    This library can be built by using the most recent versions of GNU Compiler Collection
    (GCC) compiler. The latest version of OpenBLAS is available at this web page.


    OpenBLAS is used by Python-NumPy library, PyTorch, and other frameworks, which
    makes it easy to use the performance benefit of the Power10 MMA accelerator for
    AI workloads.


    For more information about the implementation of the Power10 processor’s high
    throughput math engine, see the white paper A matrix math facility for Power ISA
    processors.


    For more information about fundamental MMA architecture principles with detailed
    instruction set usage, register file management concepts, and various supporting
    facilities, see Matrix-Multiply Assist Best Practices Guide, REDP-5612.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 2.1.5 Power10 compatibility modes


    The Power10 core implements the Processor Compatibility Register (PCR) as described
    in the Power instruction set architecture (ISA) version 3.1, primarily to facilitate
    live partition mobility (LPM) to and from previous generations of IBM Power hardware.


    Depending on the specific settings of the PCR, the Power10 core runs in a compatibility
    mode that pertains to POWER9 (Power ISA version 3.0) or POWER8 (Power ISA version
    2.07) processors. The support for processor compatibility modes also enables older
    operating systems versions of AIX, IBM i, Linux, or Virtual I/O server environments
    to run on Power10 processor-based systems.


    The Power10 processors of the Power E1080 server support the following compatibility
    modes:


    +   - POWER8: Enabled by firmware level FW810

    +   - POWER9 Base: Enabled by firmware level FW910

    +   - POWER9: Enabled by firmware level FW940

    +   - Power10: Enabled by firmware level FW1010


    # 2.1.6 Processor feature codes


    Each system node in a Power E1080 server provides four sockets to accommodate
    Power10 single chip modules (SCMs). Three different SCM types with core density
    of 10-, 12-, and 15-cores are offered. The processor configuration of a system
    node is determined by one of three available processor features. Each feature
    represents a set of four Power10 SCMs of identical core density. All system nodes
    in a Power E1080 server must be configured with the same processor feature.


    Table 2-3 lists the processor feature codes that are available for Power E1080
    servers. Power10 processors automatically optimize their core frequencies based
    on workload requirements, thermal conditions, and power consumption characteristics.
    Each processor feature code that is listed is associated with a processor core
    frequency range within which the SCM cores typically operate. Also, the maximum
    frequency that is supported by the relevant SCM type is indicated.


    Table 2-3 Power E1080 processor features


    | Feature code | Description |

    |---|---|

    | EDP2 | 40-core (4x10) Typical 3.65 to 3.90 GHz (max) Power10 Processor with
    5U system node drawer |

    | EDP3 | 48-core (4x12) Typical 3.60 to 4.15 GHz (max) Power10 Processor with
    5U system node drawer |

    | EDP4 | 60-core (4x15) Typical 3.55 to 4.00 GHz (max) Power10 Processor with
    5U system node drawer |'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 2.1.7 On-chip L3 cache and intelligent caching


    The Power10 processor includes a large on-chip L3 cache of up to 120 MB with a
    non-uniform cache access (NUCA) architecture that provides mechanisms to distribute
    and share cache footprints across a set of L3 cache regions. Each processor core
    can access an associated local 8MB of L3 cache. It also can access the data in
    the other L3 cache regions on the chip and throughout the system.


    Each L3 region serves as a victim cache for its associated L2 cache and also can
    provide aggregate storage for the on-chip cache footprint.


    Intelligent L3 cache management enables the Power10 processor to optimize the
    access to L3 cache lines and minimize cache latencies. The L3 includes a replacement
    algorithm with data type and reuse awareness. It also supports an array of prefetch
    requests from the core, including instruction and data, and works cooperatively
    with the core, memory controller, and SMP interconnection fabric to manage prefetch
    traffic, which optimizes system throughput and data latency.


    The L3 cache supports the following key features:


    +   - Enhanced bandwidth that supports up to 64 bytes per core processor cycle
    to each SMT8 core.

    +   - Enhanced data prefetch that is enabled by 96 L3 prefetch request machines
    that service prefetch requests to memory for each SMT8 core.

    +   - Plus-one prefetching at the memory controller for enhanced effective prefetch
    depth and rate.

    +   - Power10 software prefetch modes that support fetching blocks of data into
    the L3 cache.

    +   - Data access with reduced latencies.


    # 2.1.8 Open memory interface


    The Power10 processor introduces a new and innovative open memory interface (OMI).
    The OMI is driven by 8 on-chip memory controller units (MCUs) and is implemented
    in two separate physical building blocks that lie in opposite areas at the outer
    edge of the Power10 die. Each area supports 64 OMI lanes that are grouped in four
    ports. One port in turn consists of two links with 8 lanes each, which operate
    in a latency-optimized manner with unprecedented bandwidth and scale at 32 Gbps
    speed.


    The aggregated maximum theoretical full-duplex bandwidth of the OMI interface
    culminates at 2 x 512 GBps = 1 TBps per Power10 single chip module (SCM).


    The OMI physical interface enables low latency, high-bandwidth, technology-agnostic
    host memory semantics to the processor and allows attaching established and emerging
    memory elements. With the Power E1080 server. OMI initially supports one main
    tier, low-latency, enterprise-grade Double Data Rate 4 (DDR4) differential DIMM
    (DDIMM) per OMI link. This configuration yields a total memory capacity of 16
    DDIMMs per SCM and 64 DDIMMs per Power E1080 server node. The memory bandwidth
    depends on the DDIMM density configured for a specific Power E1080 server.


    The maximum theoretical duplex memory bandwidth is 409 GBps per SCM if 32 GB or
    64 GB DDIMMs running at 3200 MHz are used. The maximum memory bandwidth is slightly
    reduced to 375 GBps per SCM if 128 GB or 256 GB DDIMMs running at 2933 MHz are
    used.'
  merge: -1
  img_proc: true
- pgno: 74
  md: "In summary, the Power10 SCM supports 128 OMI lanes with the following characteristics:\n\
    \n+   - 32 Gbps signaling rate\n+   - Eight lanes per OMI link\n+   - Two OMI\
    \ links per OMI port (2 x 8 lanes)\n+   - Eight OMI ports per single chip module\
    \ (16 x 8 lanes)\n\n# 2.1.9 Pervasive memory encryption\n\nThe Power10 MCU provides\
    \ the system memory interface between the on-chip symmetric multiprocessing (SMP)\
    \ interconnect fabric and the OMI links. This design qualifies the MCU as ideal\
    \ functional unit to implement memory encryption logic. The Power10 on-chip MCU\
    \ encrypts and decrypts all traffic to and from system memory that is based on\
    \ the AES technology.\n\nThe Power10 processor supports the following modes of\
    \ operation:\n\n+   - AES XTS mode\n+   \n+   XTS is an abbreviation for the xor–encrypt–xor\
    \ based tweaked-codebook mode with ciphertext stealing. AES XTS provides a block\
    \ cipher with strong encryption, which is particularly useful to encrypt persistent\
    \ memory.\n+   \n+   Persistent DIMM technology retains the data that is stored\
    \ inside the memory DIMMs, even if the power is turned off. A malicious attacker\
    \ who gains physical access to the DIMMs can steal memory cards. The data that\
    \ is stored in the DIMMs can leave the data center in the clear if not encrypted.\n\
    +   \n+   Also, memory cards that leave the data center for repair or replacement\
    \ can be a potential security breach. Because the attacker might have arbitrary\
    \ access to the persistent DIMM data. the stronger encryption of the AES XTS mode\
    \ is required for persistent memory. The AES XTS mode of the Power10 processor\
    \ is supported for future use if persistent memory solutions become available\
    \ for IBM Power servers.\n\n+   - AES CTR mode\n+   \n+   CTR stands for Counter\
    \ mode of operation and designates a low-latency AES bock cipher. Although the\
    \ level of encrypting is not as strong as with the XTS mode, the low-latency characteristics\
    \ make it the preferred mode for memory encryption of volatile memory. AES CTR\
    \ makes it more difficult to physically gain access to data through the memory\
    \ card interfaces. The goal is to protect against physical attacks, which becomes\
    \ increasingly important in the context of cloud deployments.\n\nThe Power E1080\
    \ servers support the AES CTR mode for pervasive memory encryption. Each Power10\
    \ processor holds a 128-bit encryption key that is used by the processor’s MCU\
    \ to encrypt the data of the differential DIMMs that are attached to the OMI links.\n\
    \nThe MCU crypto engine is transparently integrated into the data path, which\
    \ ensures that the data fetch and store bandwidth are not compromised by the AES\
    \ CTR encryption mode. Because the encryption has no noticeable performance effect\
    \ and because of the obvious security benefit, the pervasive memory encryption\
    \ is enabled by default and cannot be switched off through any administrative\
    \ interface.\n\n> Note: The pervasive memory encryption of the Power10 processor\
    \ does not affect the encryption status of a system dump content. All data that\
    \ is coming from the DDIMMs is decrypted by the memory controller unit before\
    \ it is passed onto the dump devices under the control of the dump program code.\
    \ This statement applies to the traditional system dump under the operating system\
    \ control and the firmware assist dump utility."
  merge: -1
  img_proc: true
- pgno: 75
  md: '**Note:** The PowerVM Live Partition Mobility (LPM) data encryption does not
    interfere with the pervasive memory encryption. Data transfer during a LPM operation
    uses the following general flow:


    +   1. On the source server, the Mover Server Partition (MSP) provides the hypervisor
    with a buffer.

    +   2. The hypervisor of the source system copies the partition memory into the
    buffer.

    +   3. The MSP transmits the data over the network.

    +   4. The data is received by the MSP on the target server and copied in to the
    related buffer.

    +   5. The hypervisor of the target system copies the data from the buffer into
    the memory space of the target partition.


    To facilitate LPM data compression and encryption, the hypervisor on the source
    system presents the LPM buffer to the on-chip nest accelerator (NX) unit as part
    of process in Step 2. The reverse decryption and decompress operation is applied
    on the target server as part of process in Step 4.


    The pervasive memory encryption logic of the MCU decrypts the memory data before
    it is compressed and encrypted by the NX unit on the source server. It also encrypts
    the data before it is written to memory but after it is decrypted and decompressed
    by the NX unit of the target server.


    # 2.1.10 Nest accelerator


    The Power10 processor has an on-chip accelerator called nest accelerator unit
    or NX unit. The coprocessor features that are available on the Power10 processor
    are similar to the features on the POWER9 processor. These coprocessors provide
    specialized functions, such as the following examples:


    +   - IBM proprietary data compression and decompression

    +   - Industry standard gzip compression and decompression

    +   - AES and Secure Hash Algorithm (SHA) cryptography

    +   - Random number generation


    Figure 2-6 on page 63 shows a block diagram of the NX unit.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '![](img/7c8373945565ba432037f60bbf8458eb_76_0.png)


    Figure 2-6 Block diagram of the NX unit


    Each one of the AES/SHA engines, data compression, and Gzip units consist of a
    coprocessor type and the NX unit features three coprocessor types. The NX unit
    also includes more support hardware to support coprocessor invocation by user
    code, use of effective addresses, high-bandwidth storage accesses, and interrupt
    notification of job completion.


    The direct memory access (DMA) controller of the NX unit helps to start the coprocessors
    and move data on behalf of coprocessors. SMP interconnect unit (SIU) provides
    the interface between the Power10 SMP interconnect and the DMA controller.


    The NX coprocessors can be started transparently through library or operating
    system kernel calls to speed up operations that are related to data compression,
    live partition mobility migration, IPSec, JFS2 encrypted file systems, PKCS11
    encryption, random number generation, and the most recently announced logical
    volume encryption.


    In effect, this on-chip NX unit on Power10 systems implements a high throughput
    engine that can perform the equivalent work of multiple cores. The system performance
    can benefit by off-loading these expensive operations to on-chip accelerators,
    which in turn can greatly reduce the CPU usage and improve the performance of
    applications.


    The accelerators are shared among the logical partitions (LPARs) under the control
    of the PowerVM hypervisor and accessed by way of hypervisor call. The operating
    system, along with the PowerVM hypervisor, provides a send address space that
    is unique per process requesting the coprocessor access. This configuration allows
    the user process to directly post entries to the first in - first out (FIFO) queues
    that are associated with the NX accelerators. Each NX coprocessor type has a unique
    receive address space corresponding to a unique FIFO for each of the accelerators.'
  merge: -1
  img_proc: true

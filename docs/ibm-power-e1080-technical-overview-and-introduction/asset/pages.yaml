    # 1.8.6 HMC currency


    In recent years, cybersecurity emerged as a national security issue and an increasingly
    critical concern for CIOs and enterprise IT managers.


    The IBM Power processor-based architecture always ranked highly in terms of end-to-end
    security, which is why it remains a platform of choice for mission-critical enterprise
    workloads.



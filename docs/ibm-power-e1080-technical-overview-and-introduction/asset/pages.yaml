- pgno: 149
  md: '# 3.1 PowerVM


    The PowerVM platform is the family of technologies, capabilities, and offerings
    that delivers industry-leading virtualization for enterprises. It is the umbrella
    branding term for Power processor-based server virtualization; that is, IBM POWER
    Hypervisor, logical partitioning, IBM Micro-Partitioning®, VIOS, Live Partition
    Mobility (LPM), and more. PowerVM is a combination of hardware enablement and
    software.


    > Note: PowerVM Enterprise Edition License Entitlement is included with each Power
    E1080 server. PowerVM Enterprise Edition is available as a hardware feature (#5228),
    supports up to 20 partitions per core, VIOS, multiple shared processor pools (MSPPs)
    and also offers LPM.


    # 3.1.1 IBM POWER Hypervisor


    Power processor-based servers are combined with PowerVM technology and offer the
    following key capabilities that can help to consolidate and simplify IT environments:


    +   ► Improve server usage and share I/O resources to reduce the total cost of
    ownership (TCO) and better use IT assets.

    +   ► Improve business responsiveness and operational speed by dynamically reallocating
    resources to applications as needed to better match changing business needs or
    handle unexpected changes in demand.

    +   ► Simplify IT infrastructure management by making workloads independent of
    hardware resources so that business-driven policies can be used to deliver resources
    that are based on time, cost, and service-level requirements.


    Combined with features in the Power E1080, the IBM POWER Hypervisor delivers functions
    that enable other system technologies, including logical partitioning (LPAR) technology,
    virtualized processors, IEEE virtual local area network (VLAN)-compatible virtual
    switch, virtual SCSI adapters, virtual Fibre Channel adapters, and virtual consoles.


    The POWER Hypervisor is a basic component of the system''s firmware and offers
    the following functions:


    +   ► Provides an abstraction between the physical hardware resources and the
    LPARs that use them.

    +   ► Enforces partition integrity by providing a security layer between LPARs.

    +   ► Controls the dispatch of virtual processors to physical processors.

    +   ► Saves and restores all processor state information during a logical processor
    context switch.

    +   ► Controls hardware I/O interrupt management facilities for LPARs.

    +   ► Provides VLAN channels between LPARs that help reduce the need for physical
    Ethernet adapters for inter-partition communication.

    +   ► Monitors the Flexible Service Processor (FSP) and performs a reset or reload
    if it detects the loss of one of the FSP, notifying the operating system if the
    problem is not corrected.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'The POWER Hypervisor is always active, regardless of the system configuration
    or whether it is connected to the managed console. It requires memory to support
    the resource assignment of the LPARs on the server. The amount of memory that
    is required by the POWER Hypervisor firmware varies according to several factors:


    +   - Memory usage for hardware page tables (HPTs)

    +   - Memory usage to support I/O devices

    +   - Memory usage for virtualization


    # Memory usage for hardware page tables


    Each partition on the system includes its own hardware page table (HPT) that contributes
    to hypervisor memory usage. The HPT is used by the operating system to translate
    from effective addresses to physical real addresses in the hardware. This translation
    from effective to real addresses allows multiple operating systems to run simultaneously
    in their own logical address space. Whenever a virtual processor for a partition
    is dispatched on a physical processor, the hypervisor indicates to the hardware
    the location of the partition HPT that can be used when translating addresses.


    The amount of memory for the HPT is based on the maximum memory size of the partition
    and the HPT ratio. The default HPT ratio is 1/128th (for AIX, Virtual I/O Server
    [VIOS], and Linux partitions) of the maximum memory size of the partition. AIX,
    VIOS, and Linux use larger page sizes (16 and 64 KB) instead of using 4 KB pages.
    The use of larger page sizes reduces the overall number of pages that must be
    tracked; therefore, the overall size of the HPT can be reduced. For example, the
    HPT is 2 GB for an AIX partition with a maximum memory size of 256 GB.


    When defining a partition, the maximum memory size that is specified is based
    on the amount of memory that can be dynamically added to the dynamic partition
    (DLPAR) without changing the configuration and restarting the partition.


    In addition to setting the maximum memory size, the HPT ratio can be configured.
    The hpt_ratio parameter for the chsyscfg Hardware Management Console (HMC) command
    can be issued to define the HPT ratio that is used for a partition profile. The
    valid values are 1:32, 1:64, 1:128, 1:256, or 1:512.


    Specifying a smaller absolute ratio (1/512 is the smallest value) decreases the
    overall memory that is assigned to the HPT. Testing is required when changing
    the HPT ratio because a smaller HPT might incur more CPU consumption because the
    operating system might need to reload the entries in the HPT more frequently.
    Most customers choose to use the IBM provided default values for the HPT ratios.


    # Memory usage for I/O devices


    In support of I/O operations, the hypervisor maintains structures that are called
    the translation control entities (TCEs), which provide an information path between
    I/O devices and partitions. The TCEs provide the address of the I/O buffer, indications
    of read versus write requests, and other I/O-related attributes. Many TCEs are
    used per I/O device, so multiple requests can be active simultaneously to the
    same physical device. To provide better affinity, the TCEs are spread across multiple
    processor chips or drawers to improve performance while accessing the TCEs.


    For physical I/O devices, the base amount of space for the TCEs is defined by
    the hypervisor that is based on the number of I/O devices that are supported.
    A system that supports high-speed adapters also can be configured to allocate
    more memory to improve I/O performance. Linux is the only operating system that
    uses these extra TCEs so that the memory can be freed for use by partitions if
    the system uses only AIX.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# Memory usage for virtualization features


    Virtualization requires more memory to be allocated by the POWER Hypervisor for
    hardware statesave areas and various virtualization technologies. For example,
    on Power10 processor-based systems, each processor core supports up to eight simultaneous
    multithreading (SMT) threads of execution, and each thread contains over 80 different
    registers.


    The POWER Hypervisor must set aside save areas for the register contents for the
    maximum number of virtual processors that are configured. The greater the number
    of physical hardware devices, the greater the number of virtual devices, the greater
    the amount of virtualization, and the more hypervisor memory is required. For
    efficient memory consumption, wanted and maximum values for various attributes
    (processors, memory, and virtual adapters) must be based on business needs, and
    not set to values that are significantly higher than actual requirements.


    # Predicting memory that is used by the POWER Hypervisor


    The IBM System Planning Tool (SPT) is a resource that can be used to estimate
    the amount of hypervisor memory that is required for a specific server configuration.
    After the SPT executable file is downloaded and installed, you can define a configuration
    by selecting the correct hardware platform and the installed processors and memory,
    and defining partitions and partition attributes. SPT can estimate the amount
    of memory that is assigned to the hypervisor, which assists you when you change
    a configuration or deploy new servers.


    The POWER Hypervisor provides the following types of virtual I/O adapters:


    +   - Virtual SCSI

    +     The POWER Hypervisor provides a virtual SCSI mechanism for the virtualization
    of storage devices. The storage virtualization is accomplished by using two paired
    adapters: a virtual SCSI server adapter and a virtual SCSI customer adapter.

    +   - Virtual Ethernet

    +     The POWER Hypervisor provides a virtual Ethernet switch function that allows
    partitions fast and secure communication on the same server without any need for
    physical interconnection or connectivity outside of the server if a Layer 2 bridge
    to a physical Ethernet adapter is set in one VIOS partition, also known as Shared
    Ethernet Adapter (SEA).

    +   - Virtual Fibre Channel

    +     A virtual Fibre Channel adapter is a virtual adapter that provides customer
    LPARs with a Fibre Channel connection to a storage area network through the VIOS
    partition. The VIOS partition provides the connection between the virtual Fibre
    Channel adapters on the VIOS partition and the physical Fibre Channel adapters
    on the managed system.

    +   - Virtual (TTY) console

    +     Each partition must have access to a system console. Tasks, such as operating
    system installation, network setup, and various problem analysis activities, require
    a dedicated system console. The POWER Hypervisor provides the virtual console
    by using a virtual TTY or serial adapter and a set of hypervisor calls to operate
    on them. Virtual TTY does not require the purchase of any other features or software,
    such as the PowerVM Edition features.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Logical partitions


    LPARs and virtualization increase the usage of system resources and add a level
    of configuration possibilities.


    *Logical partitioning* is the ability to make a server run as though it were two
    or more independent servers. When you logically partition a server, you divide
    the resources on the server into subsets, called *LPARs*. You can install software
    on an LPAR, and the LPAR runs as an independent logical server with the resources
    that you allocated to the LPAR.


    LPAR also is referred to in some documentation as a *virtual machine* (VM), which
    making it look similar to what other hypervisors offer. However, LPARs provide
    a higher level of security and isolation and other features that are described
    in this chapter.


    Processors, memory, and I/O devices can be assigned to LPARs. AIX, IBM i, Linux,
    and VIOS can run on LPARs. VIOS provides virtual I/O resources to other LPARs
    with general-purpose operating systems.


    LPARs share a few system attributes, such as the system serial number, system
    model, and processor FCs. All other system attributes can vary from one LPAR to
    another.


    # Micro-Partitioning


    When you use the Micro-Partitioning technology, you can allocate fractions of
    processors to an LPAR. An LPAR that uses fractions of processors is also known
    as a *shared processor partition* or *micropartition*. Micropartitions run over
    a set of processors that is called a *shared processor pool* (SPP), and virtual
    processors are used to enable the operating system manage the fractions of processing
    power that are assigned to the LPAR.


    From an operating system perspective, a virtual processor cannot be distinguished
    from a physical processor, unless the operating system is enhanced to determine
    the difference. Physical processors are abstracted into virtual processors that
    are available to partitions.


    On the Power10 processor-based server, a partition can be defined with a processor
    capacity as small as 0.05 processing units. This number represents 0.05 of a physical
    core. Each physical core can be shared by up to 20 shared processor partitions,
    and the partition’s entitlement can be incremented fractionally by as little as
    0.05 of the processor. The shared processor partitions are dispatched and time-sliced
    on the physical processors under the control of the Power Hypervisor. The shared
    processor partitions are created and managed by the HMC.


    The Power E1080 supports up to 240 cores in a single system and 1000 micropartitions
    (1000 is the maximum that PowerVM supports).


    Note: Although the Power E1080 supports up to 1000 micropartitions, the real limit
    depends on application workload demands in use on the server.


    # Processing mode


    When you create an LPAR, you can assign entire processors for dedicated use, or
    you can assign partial processing units from an SPP. This setting defines the
    processing mode of the LPAR.


    # Dedicated mode


    In dedicated mode, physical processors are assigned as a whole to partitions.
    The SMT feature in the Power10 processor core allows the core to run instructions
    from two, four, or eight independent software threads simultaneously.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Shared dedicated mode


    On Power10 processor-based servers, you can configure dedicated partitions to
    become processor donors for idle processors that they own, which allows for the
    donation of spare CPU cycles from dedicated processor partitions to an SPP. The
    dedicated partition maintains absolute priority for dedicated CPU cycles. Enabling
    this feature can help increase system usage without compromising the computing
    power for critical workloads in a dedicated processor mode LPAR.


    # Shared mode


    In shared mode, LPARs use virtual processors to access fractions of physical processors.
    Shared partitions can define any number of virtual processors (the maximum number
    is 20 times the number of processing units that are assigned to the partition).
    The Power Hypervisor dispatches virtual processors to physical processors according
    to the partition’s processing units entitlement. One processing unit represents
    one physical processor’s processing capacity. All partitions receive a total CPU
    time equal to their processing unit’s entitlement. The logical processors are
    defined on top of virtual processors. Therefore, even with a virtual processor,
    the concept of a logical processor exists, and the number of logical processors
    depends on whether SMT is turned on or off.


    # 3.1.2 Multiple shared processor pools


    MSPPs are supported on Power10 processor-based servers. This capability allows
    a system administrator to create a set of micropartitions with the purpose of
    controlling the processor capacity that can be used from the physical SPP.


    Micropartitions are created and then identified as members of the default processor
    pool or a user-defined SPP. The virtual processors that exist within the set of
    micropartitions are monitored by the Power Hypervisor. Processor capacity is managed
    according to user-defined attributes.


    If the Power server is under heavy load, each micropartition within an SPP is
    assured of its processor entitlement, plus any capacity that might be allocated
    from the reserved pool capacity if the micropartition is uncapped.


    If specific micropartitions in an SPP do not use their processing capacity entitlement,
    the unused capacity is ceded and other uncapped micropartitions within the same
    SPP can use the extra capacity according to their uncapped weighting. In this
    way, the entitled pool capacity of an SPP is distributed to the set of micropartitions
    within that SPP.


    All Power servers that support the MSPPs capability have a minimum of one (the
    default) SPP and up to a maximum of 64 SPPs.


    This capability helps customers reduce total cost of ownership (TCO) significantly
    when the cost of software or database licenses are dependant on the number of
    assigned processor-cores.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# 3.1.3 Virtual I/O Server


    The Virtual I/O Server (VIOS) is part of PowerVM. It is the specific appliance
    that allows the sharing of physical resources among LPARs to allow more efficient
    usage (for example, consolidation). In this case, the VIOS owns the physical I/O
    resources (SCSI, Fibre Channel, network adapters, or optical devices) and allows
    customer partitions to share access to them, which minimizes and optimizes the
    number of physical adapters in the system.


    The VIOS eliminates the requirement that every partition owns a dedicated network
    adapter, disk adapter, and disk drive. The VIOS supports OpenSSH for secure remote
    logins. It also provides a firewall for limiting access by ports, network services,
    and IP addresses.


    Figure 3-1 shows an overview of a VIOS configuration.


    ![](img/7c8373945565ba432037f60bbf8458eb_154_0.png)


    It is a preferred practice to run dual VIO servers per physical server.


    # Shared Ethernet Adapter


    A Shared Ethernet Adapter (SEA) can be used to connect a physical Ethernet network
    to a virtual Ethernet network. The SEA provides this access by connecting the
    Power Hypervisor VLANs to the VLANs on the external switches. Because the SEA
    processes packets at Layer 2, the original MAC address and VLAN tags of the packet
    are visible to other systems on the physical network. IEEE 802.1 VLAN tagging
    is supported.


    By using the SEA, several customer partitions can share one physical adapter.
    You also can connect internal and external VLANs by using a physical adapter.
    The SEA service can be hosted only in the VIOS (not in a general-purpose AIX or
    Linux partition) and acts as a Layer 2 network bridge to securely transport network
    traffic between virtual Ethernet networks (internal) and one or more (Etherchannel)
    physical network adapters (external). These virtual Ethernet network adapters
    are defined by the Power Hypervisor on the VIOS.


    # Virtual SCSI


    Virtual SCSI is used to view a virtualized implementation of the SCSI protocol.
    Virtual SCSI is based on a customer/server relationship. The VIOS LPAR owns the
    physical I/O resources and acts as a server or, in SCSI terms, a target device.
    The client LPARs access the virtual SCSI backing storage devices that are provided
    by the VIOS as clients.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'The virtual I/O adapters (a virtual SCSI server adapter and a virtual SCSI
    client adapter) are configured by using an HMC. The virtual SCSI server (target)
    adapter is responsible for running any SCSI commands that it receives, and is
    owned by the VIOS partition. The virtual SCSI client adapter allows a client partition
    to access physical SCSI and SAN-attached devices and LUNs that are mapped to be
    used by the client partitions. The provisioning of virtual disk resources is provided
    by the VIOS.


    # N_Port ID Virtualization


    N_Port ID Virtualization (NPIV) is a technology that allows multiple LPARs to
    access one or more external physical storage devices through the same physical
    Fibre Channel adapter. This adapter is attached to a VIOS partition that acts
    only as a pass-through that manages the data transfer through the Power Hypervisor.


    Each partition features one or more virtual Fibre Channel adapters, each with
    their own pair of unique worldwide port names. This configuration enables you
    to connect each partition to independent physical storage on a SAN. Unlike virtual
    SCSI, only the client partitions see the disk.


    For more information and requirements for NPIV, see *IBM PowerVM Virtualization
    Managing and Monitoring*, SG24-7590.


    # 3.1.4 Live Partition Mobility


    LPM allows you to move a running LPAR from one system to another without disruption.
    Inactive partition mobility allows you to move a powered-off LPAR from one system
    to another one.


    LPM provides systems management flexibility and improves system availability by
    avoiding the following situations:


    +   - Planned outages for hardware upgrade or firmware maintenance.

    +   - Unplanned downtime. With preventive failure management, if a server indicates
    a potential failure, you can move its LPARs to another server before the failure
    occurs.


    For more information and requirements for LPM, see *IBM PowerVM Live Partition
    Mobility*, SG24-7460.


    HMCV10R1 and VIOS 3.1.3 or later provide the following enhancements to the Live
    Partition Mobility Feature:


    +   - Automatically choose fastest network for LPM memory transfer

    +   - Allow LPM when a virtual optical device is assigned to a partition


    # 3.1.5 Active Memory Expansion


    Active Memory Expansion (AME) is an optional feature code (#EM8F) that belongs
    to the technologies under the PowerVM umbrella and enables memory expansion on
    the system.


    AME is an innovative technology that supports the AIX operating system. It helps
    enable the effective maximum memory capacity to be larger than the true physical
    memory maximum. Compression and decompression of memory content can enable memory
    expansion up to 100% or more. This expansion can enable a partition to complete
    significantly more work or support more users with the same physical amount of
    memory. Similarly, it can enable a server to run more partitions and do more work
    for the same physical amount of memory.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'AME uses CPU resources to compress and decompress the memory contents. The
    trade-off of memory capacity for processor cycles can be an excellent choice,
    but the degree of expansion varies about how compressible the memory content is.
    It also depends on having adequate spare CPU capacity available for this compression
    and decompression.


    The Power E1080 includes a hardware accelerator that is designed to boost AME
    efficiency and uses less processor core resources. Each AIX partition can turn
    on or turn off AME. Control parameters set the amount of expansion that is wanted
    in each partition to help control the amount of CPU used by the AME function.


    An IPL is required for the specific partition that is turning memory expansion.
    When enabled, monitoring capabilities are available in standard AIX performance
    tools, such as `lparstat`, `vmstat`, `topas`, and `svmon`.


    A planning tool is included with AIX, which enables you to sample workloads and
    estimate how expandable the partition''s memory is and much CPU resource is needed.
    The feature can be ordered with the initial order of the Power E1080 or as an
    MES order. A software key is provided when the enablement feature is ordered,
    which is applied to the system node. An IPL is not required to enable the system
    node. The key is specific to an individual system and is permanent. It cannot
    be moved to a different server.


    > **Note:** IBM i does not support AME.


    # 3.1.6 Remote Restart


    Remote Restart is a high availability option for partitions. If an error occurs
    that causes a server outage, a partition that is configured for Remote Restart
    can be restarted on a different physical server. At times, it might take longer
    to start the server, in which case the Remote Restart function can be used for
    faster reprovisioning of the partition. Typically, this can be done faster than
    restarting the server that stopped and then restarting the partitions. The Remote
    Restart function relies on technology that is similar to LPM where a partition
    is configured with storage on a SAN that is shared (accessible) by the server
    that hosts the partition.


    HMC V10R1 provides an enhancement to the Remote Restart Feature that enables remote
    restart when a virtual optical device is assigned to a partition.


    # 3.1.7 POWER processor modes


    Although they are not virtualization features, the POWER processor modes are described
    here because they affect various virtualization features.


    On Power servers, partitions can be configured to run in several modes, including
    the following modes:


    +   ► POWER8

    +   This native mode for POWER8 processors implements Version 2.07 of the IBM
    Power ISA. For more information, see IBM documentation.


    +   ► POWER9

    +   This native mode for POWER9 processors implements Version 3.0 of the IBM Power
    ISA. For more information, see IBM documentation.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# POWER10


    This native mode for Power10 processors implements Version 3.1 of the IBM Power

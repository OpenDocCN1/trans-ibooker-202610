    +   - High Function 9xC19 PDU plus 3-Phase (#ECJL)

    +     This intelligent, switched 208 volt 3-phase AC PDU includes nine C19 receptacles
    on the front of the PDU. The PDU is mounted on the rear of the rack, which makes
    the nine C19 receptacles easily accessible.

    +   - High Function 12xC13 PDU plus (#ECJN)

    +     This intelligent, switched 200-240 volt AC PDU includes 12 C13 receptacles
    on the front of the PDU. The PDU is mounted on the rear of the rack, which makes
    the 12 C13 receptacles easily accessible.

    +   - High Function 12xC13 PDU plus 3-Phase (#ECJQ)

    +     This intelligent, switched 208 volt 3-phase AC PDU includes 12 C13 receptacles
    on the front of the PDU. The PDU is mounted on the rear of the rack, which makes
    the 12 C13 receptacles easily accessible.


    Two or more additional PDUs can be installed horizontally in the rear of the rack.
    Mounting PDUs horizontally uses 1U per PDU and reduces the space that is available
    for other racked components. When mounting PDUs horizontally, the preferred approach
    is to use fillers in the EIA units that are occupied by these PDUs to facilitate
    proper air-flow and ventilation in the rack.


    Each PDU requires one PDU-to-wall power cord. Various power cord features are
    available for various countries and applications by varying the PDU-to-wall power
    cord, which must be ordered separately.


    Each power cord provides the unique design characteristics for the specific power
    requirements. To match new power requirements and save previous investments, these
    power cords can be requested with an initial order of the rack or with a later
    upgrade of the rack features.'

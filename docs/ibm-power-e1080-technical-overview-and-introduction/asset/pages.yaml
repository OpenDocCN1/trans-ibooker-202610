- pgno: 30
  md: 'Every feature code that is listed in Table 1-6 on page 16 provides the processor
    cores, not their activation. The processor core must be activated to be assigned
    as resource to a logical partition. The activations are offered through multiple
    permanent and temporary activation features. For more information about these
    options, see 2.4, “Capacity on-demand” on page 76.


    Table 1-8 lists the processor feature codes and the associated permanent activation
    features. Any of these activation feature codes can permanently activate one core.


    Table 1-8 Processor and activation features


    | Processor feature | Static activation feature | Static linux only activation
    feature |

    |---|---|---|

    | EDP2 | EDPB | ELCL |

    | EDP3 | EDPC | EL CQ |

    | EDP4 | EDPD | ECLM |


    The following types of permanent activations are available:


    **Static**

    These features permanently activate cores or memory resources in a system. These
    activations cannot be shared among multiple systems and remain associated with
    the system for which they were ordered.


    **Regular**

    A regular static activation can run any supported operating system workload.


    **Linux-only**

    A Linux-only static activation can run only Linux workloads and are priced less
    than regular static activations.


    **Mobile**

    These features permanently activate cores or memory resources. They are priced
    more than static activation features because they can be shared among multiple
    eligible systems that are participating in a Power Enterprise Pool. They also
    can be moved dynamically among the systems without IBM involvement, which brings
    more value to the customer than static activations.


    **Base**

    In a Power Enterprise Pool 2.0 (PEP 2.0) environment, systems are ordered with
    some initial compute capacity. This initial capacity is procured by using base
    activation features. These activations do not move like mobile activations in
    PEP 1.0 environment, but can be shared among multiple eligible systems in a PEP
    2.0 pool.


    **Any OS base**

    These base activations are supported on any operating system (AIX, IBM i, or Linux)
    in a PEP 2.0 environment.


    **Linux only base**

    These base activations are priced less than any OS base activation, but support
    only Linux workloads in a PEP 2.0 environment.


    A minimum of 16 processor cores must always be activated with the static activation
    features, regardless of the Power E1080 configuration. Also, if the server is
    associated to a PEP 2.0, a minimum of one base activation is required.


    For more information about other temporary activation offerings that are available
    for the Power E1080 server, see 2.4, “Capacity on-demand” on page 76.'
  merge: -1
  img_proc: true

    # 1.5.5 System node disk and media features


    At the time of this writing, the Power E1080 server node supports up to four 7
    mm NVMe U.2 drives that are plugged into the 4-bay NVMe carrier backplane (feature
    code EJBC). Each system node requires one backplane, even if no NVMe U.2 drives
    are selected.


    Each NVMe U.2 drive can be independently assigned to different LPARs for hosting
    the operating system and to start from them. They also can be used for non-data
    intensive workloads. NVMe U.2 drives are concurrently replaceable.


    Table 1-13 lists the available NVMe drive feature codes for the Power E1080 and
    the operating system support.



  md: '# 1.5 System features


    This section lists and explains the available system features on a Power E1080
    server. These features describe the resources that are available on the system
    by default or by virtue of procurement of configurable feature codes.


    An overview of various feature codes and the essential information also is presented
    that can help users design their system configuration with suitable features that
    can fulfill the application compute requirement. This information also helps with
    building a highly available, scalable, reliable, and flexible system around the
    application.


    # 1.5.1 Minimum configuration


    A minimum configuration bables a user to order a fully qualified and tested hardware
    configuration of a Power system with a minimum set of offered technical features.
    The modular design of a Power E1080 server enables the user to start low with
    a minimum configuration and scale up vertically as and when needed.


    Table 1-5 lists the Power E1080 server configuration with minimal features.



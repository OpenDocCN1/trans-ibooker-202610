- pgno: 37
  md: 'the USB port in the rear of the SCU with the cable associated to feature code
    EC6N. Because this cable is 1.5 m long, in case of a Power E1080 with more than
    one system node, the USB 3.0 adapter can be used in the first or the second system
    node only.


    The USB 3.0 adapter feature code EC6J supports the assignment to an LPAR and can
    be migrated from an operating LPAR to another, including the connected DVD drive.
    This design allows it to assign the DVD drive feature to any LPAR according to
    the need.


    Dynamic allocation of system resources such as processor, memory, and I/O is also
    referred to as *dynamic LPAR* or *DLPAR*.


    For more information about the USB subsystem, see 1.5.6, “System node USB features”
    on page 23.


    # 1.5.7 Power supply features


    Each Power E1080 server node has four 1950 W bulk power supply units that are
    operating at 240 V. These power supply unit features are a default configuration
    on every Power E1080 system node. The four units per system node do not have an
    associated feature code and are always auto-selected by the IBM configurator when
    a new configuration task is started.


    Four power cords from the power distribution units (PDU) drive these power supplies,
    which connect to four C13/C14 type receptacles on the linecord conduit in the
    rear of the system. The power linecord conduit source power from the rear and
    connects to the power supply units in the front of the system.


    The system design provides N+2 redundancy for system bulk power, which allows
    the system to continue operation with any two of the power supply units functioning.
    The failed units must remain in the system until new power supply units are available
    for replacement.


    The power supply units are hot-swappable, which allows replacement of a failed
    unit without system interruption. The power supply units are placed in front of
    the system, which makes any necessary service that much easier.


    Figure 1-7 shows the power supply units and their physical locations marked as
    E1, E2, E3, and E4 in the system.


    ![](img/7c8373945565ba432037f60bbf8458eb_37_0.png)'

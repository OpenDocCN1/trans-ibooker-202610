    # 2.5 Internal I/O subsystem


    This section provides more information about the internal PCIe architecture of
    the Power E1080 system.


    # 2.5.1 Internal PCIe Gen 5 subsystem and slot properties


    The internal I/O subsystem on the Power E1080 server is connected to the PCIe
    Gen 5 controllers on a Power10 chip in the system. Each Power10 processor module
    has two PCIe host bridges (PHBs). The PHBs (PHB0 and PHB1) have 16 PCIe lanes
    each.


    The PHBs provide different type of end point connections. Both the PHBs from Power10
    sockets P0 and P1 and one PHB from sockets P2 and P3 connect directly to a PCIe
    Gen 4 x16 or PCIe Gen 5 x8 slot to provide six PCIe Gen 4 x16 or PCIe Gen 5 x8
    slots per system node.


    The second PHB on each Power10 socket P2 and P3 is split between a PCIe Gen 5
    x8 slot and two Internal Non-Volatile Memory Express (NVMe) SSD PCIe Gen 4 x4
    slots. The design overall provides each system node of Power E1080 with:


    +   - Six PCIe Gen 4 x16 or PCIe Gen 5 x8

    +   - Two PCIe Gen 5 x8

    +   - Four Internal Non-Volatile Memory Express (NVMe) SSDs, each using a PCIe
    Gen 4 x4 connection


    Bandwidths for the connections are listed in Table 2-11.


    Table 2-11 Internal I/O connection speeds


    | Connection | Type | Speed (duplex) |

    |---|---|---|

    | PCIe adapter slot | PCIe Gen4 x16 | 64 GBps |

    | PCIe adapter slot | PCIe Gen5 x8 | 64 GBps |

    | NVMe slot | PCIe Gen4 x4 | 16 GBps |


    The following theoretical maximum I/O bandwidths in each system node are available:


    +   - Six PCIe Gen 4 x16 / PCIe Gen 5 x8 slots at 64 GBps = 384 GBps

    +   - Two PCIe Gen 5 x8 Slots at 64 GBps = 128 GBps

    +   - Four NVMe slots at 16 GBps = 64 GBps


    Total of 576 GBps = 384 GBps + 128 GBps + 64 GBps.'

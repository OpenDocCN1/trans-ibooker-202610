    # 3.3 System automation with Ansible


    Enterprises can spend many precious administrative time performing repetitive
    tasks and using manual processes. Tasks, such as updating, patching, compliance
    checks, provisioning new virtual machines or LPARs, and ensuring that the correct
    security updates are in place, are taking time away from more valuable business
    activities.


    The ability to automate by using Ansible returns valuable time to the system administrators.


    Red Hat Ansible Automation Platform for Power is fully enabled, so enterprises
    can automate several tasks within AIX, IBM i, and Linux that include deploying
    applications. Ansible also can be combined with HMC, PowerVC, and Power Virtual
    Server to provision infrastructure anywhere you need, including cloud solutions
    from other IBM Business Partners or third-party providers based on Power processor-based
    servers.'

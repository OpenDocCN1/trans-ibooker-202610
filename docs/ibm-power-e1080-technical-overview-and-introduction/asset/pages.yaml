- pgno: 114
  md: 'A minimum of one PCIe Gen 4 Optical Cable Adapter for PCIe Gen 3 Expansion
    Drawer (#EJ24) is required to connect to the PCIe Gen 3 6-slot Fanout Module in
    the I/O expansion drawer. The top port of the Fanout Module must be cabled to
    the top port of the #EJ24 port. Also, the bottom two ports must be cabled together.


    To perform the cabling correctly, complete the following steps:


    +   1. Connect an AOC to connector T0 on the PCIe Gen 4 cable adapter (#EJ24)
    in your server.

    +   2. Connect the other end of the optical cable to connector T1 on one of the
    PCIe Gen 3 6-slot Fanout Modules in your I/O expansion drawer.

    +   3. Connect another AOC cable to connector T1 on the PCIe Gen 4 cable adapter
    (#EJ24).

    +   4. Connect the other end of the cable to connector T2 on the same PCIe Gen
    3 6-slot Fanout Module in I/O expansion drawer.

    +   5. Repeat the steps 1 to 4 for the other PCIe Gen 3 6-slot Fanout Module in
    the I/O expansion drawer, if required.


    **Drawer connections:** Each Fanout Module in a PCIe Gen 3 Expansion Drawer (#EMX0)
    can be connected to only a single PCIe Gen 4 Cable Adapter (#EJ24). However, the
    two Fanout Modules in a single I/O expansion drawer can be connected to different
    system nodes in the same server.


    Figure 2-26 shows the connector locations of the PCIe Gen3 I/O Expansion Drawer.


    ![](img/7c8373945565ba432037f60bbf8458eb_114_0.png)


    Figure 2-26 Connector locations for the PCIe Gen3 I/O Expansion Drawer'
  merge: -1
  img_proc: true

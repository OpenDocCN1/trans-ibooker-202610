- pgno: 127
  md: '# 2.10 Operating system support


    The Power E1080 server supports the following operating systems:


    +   - AIX

    +   - IBM i

    +   - Linux


    In addition, the VIOS can be installed in special partitions that provide support
    to other partitions running AIX, IBM i, or Linux OSes for the use of various features,
    such as virtualized I/O devices, or PowerVM Live Partition Mobility (LPM).


    For more information about the software that is available on Power Systems, see
    IBM Power Systems Software.


    # 2.10.1 Power E1080 prerequisites


    The minimum supported levels of IBM AIX, IBM i, and Linux at the time of this
    writing are described in the following sections. For more information about hardware
    features, see IBM Power Systems Prerequisites.


    This tool helps also to plan a successful system upgrade by providing the prerequisite
    information for features currently in use or planned to be added to a system.
    It''s possible to choose a machine type and model (9080-HEX for Power E1080) and
    find out all the prerequisites, operating system levels supported and other information.


    # 2.10.2 AIX operating system


    At announcement, the Power E1080 supports the following minimum level of AIX:


    +   - AIX 7.1 TL 5 SP 5

    +   - AIX 7.2 TL 4 SP 1


    AIX 7.1 must run on an LPAR in POWER8 compatibility mode with VIOS-based virtual
    storage and networking. The I/O can be supplied only by the Virtual I/O Server
    and the system is LPM enabled, excluding Native VF (SR-IOV) directly in the customer
    LPAR.


    AIX 7.2 can run with physical and virtual I/O and requires POWER9 compatibility
    mode.


    NVMe over Fibre Channel fabrics (NVMe-OF) is now available on Power E1080 running
    AIX when the 2-port 32 Gb adapter (#EN1A or #EN1B) and the selected IBM FlashSystem
    high-end (FS9110) and mid-range (FS7200) model are used.


    IBM periodically releases maintenance packages (service packs or technology levels)
    for the AIX operating system. For more information about these packages, downloading,
    and obtaining the CD-ROM, see Fix Central.


    The Service Update Management Assistant (SUMA), which can help you automate the
    task of checking and downloading operating system downloads, is part of the base
    operating system. For more information about the suma command, see IBM documentation.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'AIX is available by using standalone (Standard Edition), Enterprise Edition,
    or through bundle options:


    +   - AIX 7.1 Standard Edition

    +   - AIX 7.1 Enterprise Edition V1.6

    +   - AIX 7.2 Standard Edition

    +   - AIX 7.2 Enterprise Edition

    +   - AIX 7.2 Enterprise Cloud Edition


    A major update for Enterprise Cloud Edition Bundles version includes PowerSC 2.0.


    Customers that are purchasing new Power E1080 can get this stack with their system
    purchase. Customers with existing systems and active SWMAs by using either of
    the Bundles can get this Product by using ESS and start using it immediately.


    # Subscription licensing model


    Per the Power E1080 announcement, a new subscription licensing model is available.
    This model provides customers with more options and flexibility in how they use
    the software.


    A subscription license is a licensing model that provides access to an IBM program
    and IBM software maintenance for a specified subscription term (one or three years).
    The subscription term begins on the start date and ends on the expiration date,
    which is reflected in Entitled Systems Support (ESS).


    Customers are licensed to run the product through the expiration date of the 1-
    or 3-year subscription term and then, can renew at the end of the subscription
    to continue using the product. This model provides flexible and predictable pricing
    over a specific term, with lower up-front entry cost.


    Another benefit of this model is that the licenses are customer number entitled,
    which means they are not tied to a specific hardware serial number as with perpetual
    licenses. Therefore, the licenses can be moved between on-premises and cloud if
    needed, something that is becoming more of a requirement with hybrid workloads.


    The new Product ID''s for the subscription licenses are listed in Table 2-29.


    Table 2-29 New subscription license PIDs (one or three years terms)


    | PID | Description |

    |---|---|

    | 5765-2B1 | AIX 7 standard edition |

    | 5765-2E1 | AIX 7 enterprise edition 1.6 |

    | 5765-2C1 | Enterprise Cloud edition 1.6 with AIX 7 |

    | 5765-6C1 | Enterprise Cloud edition 1.6 |


    The licenses are orderable through IBM configurator. The AIX perpetual and monthly
    term licenses for standard edition are still available.


    # AIX 7.3 Open Beta


    In February 2021, the registration for the Open Beta of the new AIX 7.3 operating
    system was announced. The AIX 7.3 Open Beta allows you to download, install, and
    run an early version of the software on suitable IBM systems in a non-production,
    non-supported mode.


    The Open Beta program provides an opportunity to gain early experience with AIX
    7.3. Not all capabilities of AIX are available in the Open Beta.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'Customers can request to join the Open Bets program by registering at this
    web page.


    # 2.10.3 IBM i


    IBM i is supported on the Power E1080 server by the following minimum required
    levels:


    +   - IBM i 7.3 TR11 or later

    +   - IBM i 7.4 TR5 or later


    For compatibility information for hardware features and the corresponding IBM
    i Technology Levels, see IBM Prerequisites.


    # IBM i operating system transfer


    IBM i customers can move to new Power E1080 servers, just like previous new system
    non-serial preserving upgrades/replacements.


    IBM i terms and conditions require that IBM i operating system license entitlements
    remain with the machine for which they were originally purchased. Under qualifying
    conditions, IBM allows the transfer of IBM i processor and user entitlements from
    one machine to another. This capability helps facilitate machine replacement,
    server consolidation, and load rebalancing while protecting a customer''s investment
    in IBM i software. When requirements are met, IBM i license transfer can be configured
    by using IBM configurator tools.


    The following prerequisites must be met for transfers:


    +   - The IBM i entitlements are owned by the user''s enterprise.

    +   - The donor machine and receiving machine are owned by the user''s enterprise.

    +   - The donor machine must have owned in the same user''s enterprise as the
    receiving machine for a minimum of one year.

    +   - Software Maintenance (SWMA) is on the donor machine. Each software entitlement
    to be transferred has SWMA coverage.

    +   - An electronic Proof of Entitlement (ePoE) exists for the entitlements to
    be transferred.

    +   - The donor machine entitlements is IBM i 5.4 or later.

    +   - The receiving machine includes activated processors that are available to
    accommodate the transferred entitlements.


    Each IBM i processor entitlement that is transferred to a target machine includes
    one year of new SWMA at no charge. Extra years of coverage or 24x7 support are
    available options for an extra charge.


    # 2.10.4 Linux


    The following types of Linux distributions are available to run on Power E1080:


    +   - With native Power10 processor technology support

    +   - Running in POWER9 compatibility mode


    Distributions with native Power10 processor technology support also can run in
    POWER9 compatibility mode. This feature is important when doing LPM from a POWER9
    processor-based server to Power E1080.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Red Hat


    Red Hat Enterprise Linux (RHEL) version 8.4 and later can run in native Power10
    processor mode. At the time of this writing, RHEL version 8.4 was available.


    OpenShift and CoreOS also are supported.


    # SUSE


    SUSE 15 SP3 is the first version with native Power10 processor technology support.
    Its regular support cycle is 18 months, plus long-term SP support.


    # Older distribution


    The following selected older distribution also are supported on Power E1080:


    +   - RHEL 8.2 is supported in POWER9 compatibility mode only

    +   - SLES 12 SP5 is supported in POWER9 compatibility mode only


    When a LPAR runs in POWER9 compatibility mode, it benefits from most of the features
    of the Power10 processor technology, including the full eight threads per core.
    However, program and kernel features that use new Power10 instructions or capabilities
    are not available.


    The POWER9 compatibility mode is required when moving partitions back and forth
    between POWER9 processor based-systems and Power10 processor-based systems. After
    a partition is moved to a Power 10 processor-based systems, it can be upgraded
    to a distribution with native Power10 technology support and restarted in native
    Power10 mode.


    > Note: No official support for POWER9 compatibility mode is available for older
    service pack of SLES 15, such as SLES 15 SP2.


    # Enhancements


    One of the main features of the Power10 processor chip is the possibility to support
    up to 15 cores per SCM. Therefore, on a Power E1080 that is configured with up
    to 240 processor cores (each capable of running eight threads for up to 1920 possible
    threads), the Linux distribution with native Power10 technology support can use
    this capability.


    LPARs running in POWER9 compatibility mode are restricted to 1536 threads per
    LPAR, which is the maximum for a POWER9 processor-based server. Table 2-30 lists
    the maximum logical CPUs, maximum memory, and maximum memory with LPM supported,
    according to the Linux distribution.


    Table 2-30 Maximum threads versus processing mode


    | Linux distribution | Processor mode | Maximum logical CPUs | Maximum memory
    | Maximum memory with LPM |

    |---|---|---|---|---|

    | RHEL 8.2 | POWER9 | 1536 | 64 TB | 16 TB |

    | RHEL 8.4 | Power10 | 1920 | 64 TB | 64 TB |

    | SLES 12 SP5 | POWER9 | 1536 | 64 TB | 32 TB |

    | SLES 15 SP3 | Power10 | 1920 | 64 TB | 64 TB |'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'The Power10 specific toolchain is available in Advance Toolchain version 15.0,
    which allows customers and developers to use all new Power10 processor-based technology
    instructions when programming. Cross-module function call overhead was reduced
    because of a new PC-relative addressing mode.


    One specific is a 10x-to-20x advantage over POWER9 processor-based technology
    on inferencing workloads because of new memory bandwidth and new instructions.
    One example is the new special purpose-built matrix math accelerator (MMA) that
    was tailored for the demands of machine learning and deep learning inference.
    It also includes many AI data types.


    Network virtualization is an area with significant evolution and improvements,
    which benefit virtual and containerized environments. The following recent improvements
    were made for Linux networking features on Power E1080:


    +   - SR-IOV allows virtualization of network cards at the controller level without
    the need to create virtual Shared Ethernet Adapters in the VIOS partition. It
    is enhanced with (vNIC) virtual Network Interface Controller, which allows data
    to be transferred directly from the partitions to or from the SR-IOV physical
    adapter without transiting through a VIOS partition.

    +   - Hybrid Network Virtualization (HNV) allows Linux partitions to use the efficiency
    and performance benefits of SR-IOV logical ports and participate in mobility operations,
    such as active and inactive Live Partition Mobility (LPM) and Simplified Remote
    Restart (SRR). HNV is enabled by selecting a new Migratable option when an SR-IOV
    logical port is configured.

    +   - NVMe over Fibre Channel fabrics (NVMe-OF) is now available on Power E1080
    running Linux when the 2-port 32 Gb adapter (#EN1A or #EN1B) is and the selected
    IBM FlashSystem high-end (FS9110) and mid-range (FS7200) model are used.


    # Security


    Security is a top priority for IBM and our distribution partners. Linux security
    on IBM Power is a vast topic that can be the subject of detailed separate material;
    however, improvements in the areas of hardening, integrity protection, performance,
    platform security, and certifications are introduced with this section.


    Hardening and integrity protection deal with protecting the Linux kernel from
    unauthorized tampering while allowing upgrading and servicing to the kernel. These
    topics become even more important when running in a containerized environment
    with an immutable operating system, such as CoreOS in OpenShift.


    Performance also is a security topic because specific hardening mitigation strategies
    (for example, against side-channel attacks), can have a significant performance
    effect. In addition, cryptography can use significant compute cycles.


    The Power E1080 features transparent memory encryption at the level of the controller,
    which prevents an attacker from retrieving data from physical memory or storage-class
    devices that are attached to the processor bus.


    # 2.10.5 Virtual I/O Server


    The minimum required level of VIOS for the Power E1080 server is VIOS 3.1.3.10
    or later.


    IBM regularly updates the VIOS code. For more information, see IBM Fix Central.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# 2.10.6 Entitled System Support


    The Entitled Systems Support website (ESS) is IBM''s go-to place to view and manage
    Power and Storage software and hardware. In general, most products that are offered
    by IBM Systems that are purchased through our IBM Digital Sales representatives
    or Business Partners are accessed on this site when the IBM Configurator is used.


    The site features the following three main sections:


    +   - My entitled software: Activities related to Power and Storage software that
    offer to download licensed, free, and trial software media, place software update
    orders, and manage software keys.

    +   - My entitled hardware: Activities related to Power and Storage hardware that
    offer to renew Update Access Keys, buy and use Elastic Capacity on Demand, assign
    or buy credits for new and existing pools in Enterprise Pools 2.0, download Storage
    Capacity on Demand codes, and manage Hybrid Capacity credits.

    +   - My inventory: Activities related to Power and Storage inventory that offer
    to browse software license, software maintenance, and hardware inventory, manage
    inventory retrievals by way of Base Composer or generate several types of reports.


    For more information, see this web page.


    # 2.10.7 Update Access Keys


    Since the introduction of the POWER8 processor-based server servers, IBM also
    introduced Update Access Key (UAK).


    When system firmware updates are applied to the system, UAK and its expiration
    date are checked (see Figure 2-37 on page 122). System firmware updates include
    a release date.


    When attempting to apply system firmware updates, if the release date for the
    firmware updates passed the expiration date for the update access key, the updates
    are not processed. As update access keys expire, they need to be replaced by using
    the Hardware Management Console (HMC) or the ASMI on the service processor.


    By default, newly delivered systems include an UAK that often expires after three
    years. Thereafter, the UAK can be extended every six months, but only if a maintenance
    contract exists. The contract can be verified in the ESS website (for more information,
    see 2.10.6, “Entitled System Support” on page 119).


    Determining when the current Update Access Key runs through the HMC, GUI or CLI
    as provided in the following examples. However, it also is possible to display
    the expiration date by using the suitable AIX or IBM i command.


    # UAK expiration date by using AIX 7.1


    In the case of AIX 7.1, use the following command:


    ```

    lscfg -vp1 sysplanar0 | grep -p "System Firmware"

    ```'
  merge: -1
  img_proc: true

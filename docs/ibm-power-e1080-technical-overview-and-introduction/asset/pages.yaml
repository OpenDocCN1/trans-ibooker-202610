    # 3.4 Protect trust from core to cloud


    Although enforcing a data encryption policy is an effective way to minimize the
    risk of a data breach that, in turn, minimizes costs, at the time of this writing,
    only 17% of enterprises surveyed indicated that they protected more than 50% of
    their sensitive data in cloud with encryption¹. Only a few enterprises at the
    world-wide level have an encryption strategy applied consistently across the entire
    organization, largely because it adds complexity, costs, and negatively affects
    performance, which means missed SLAs to the business.


    The rapidly evolving cyber threat landscape requires focus on cyber-resilience.
    Persistent and end-to-end security is the only way to reduce exposure to threats.


    Power processor-based platforms always offered the most secure and reliable servers
    in its class. The Power E1080 further extends the industry-leading security and
    reliability of the Power processor-based platform, with focus on protecting applications
    and data across all of the hybrid cloud environments. It also introduces significant
    innovations along the following major dimensions:


    +   - Advanced Data Protection that offers simple to use and efficient capabilities
    to protect sensitive data through mechanisms, such as encryption and multi-factor
    authentication.


    ¹ source: Thales Data Threat Report - Global Edition: https://cpl.thalesgroup.com/resources/encryption/2021/data-threat-report'

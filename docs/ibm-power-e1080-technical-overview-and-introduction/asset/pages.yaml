    footprint” efficiency. In addition, they are intelligent PDUs that provide insight
    to power usage by receptacle and remote power on and off capability for easier
    support by individual receptacle. The new PDUs are orderable as #ECJJ, #ECJL,
    #ECJN, and #ECJQ.



    \ 9080-HEX server specifications” at IBM Documentation.\n\n> Note: Government\
    \ regulations, such as those regulations that are issued by the Occupational Safety\
    \ and Health Administration (OSHA) or European Community Directives, can govern\
    \ noise level exposure in the workplace and might apply to you and your server\
    \ installation. The Power E1080 server is available with an optional acoustical\
    \ door feature that can help reduce the noise emitted from this system.\n> \n\
    > The sound pressure levels in your installation depend on various factors, including\
    \ the number of racks in the installation; the size, materials, and configuration\
    \ of the room where you designate the racks to be installed; the noise levels\
    \ from other equipment; the room ambient temperature, and employees' location\
    \ in relation to the equipment.\n> \n> Also, compliance with such government regulations\
    \ depends on various other factors, including the duration of employees' exposure\
    \ and whether employees wear hearing protection. IBM recommends that you consult\
    \ with qualified experts in this field to determine whether you are in compliance\
    \ with the applicable regulations."

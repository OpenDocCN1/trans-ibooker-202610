    The IBM System Storage 7226 Model 1U3 Multi-Media Enclosure can accommodate up
    to two tape drives, two RDX removable disk drive docking stations, or up to four
    DVD-RAM drives.


    The IBM System Storage 7226 Multi-Media Enclosure supports LTO Ultrium and DAT160
    Tape technology, DVD-RAM, and RDX removable storage requirements on the following
    IBM systems:


    +   - IBM POWER6 processor-based systems

    +   - IBM POWER7 processor-based systems

    +   - IBM POWER8® processor-based systems

    +   - IBM POWER9 processor-based systems

    +   - IBM Power10 processor-based systems



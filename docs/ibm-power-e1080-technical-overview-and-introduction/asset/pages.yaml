  md: '# 2.2.2 SMP cable RAS attribute


    Each SMP bus has 18 lanes and it is split between two separate cables, where each
    cable has nine lanes. An SMP spare lane is used on each SMP cable (eight lanes
    for data and one lane as spare). If one of the two SMP cables fail, all the traffic
    is routed to the one remaining cable, which reduces the bandwidth by half.


    The Power E1080 supports concurrent repair of the external SMP cables; therefore,
    the entire server does not need to be shut down to replace an external SMP cable.


    The concurrent repair process enables the system to restore the OP-bus to the
    full function without a system outage.


    # 2.3 Memory subsystem


    The Power E1080 server uses the next-generation differential dual inline memory
    modules (DIMMs), which are high-performance, high-reliability, high-function memory
    cards that contain a buffer chip, intelligence, and 2933/3200 MHz DRAM memory.


    DDR4 technology is used and provides the 2933/3200 MHz DRAM memory. DDIMMs are
    placed in the DDIMM slots in the system node.


    Every Power10 chip memory controller unit (MCU) provides the system memory interface
    between the on-chip SMP interconnect fabric and the OpenCAPI memory interface
    (OMI) links. Logically eight, essentially-independent MCU channels are on every
    chip that interface to a total of 16 high-speed OMI links.


    Each memory channel supports two OMI links (referred to as subchannels A and B)
    as shown in Figure 2-13 on page 73, which also shows the memory slot locations
    that are associated to the related subchannels, channels, and memory controller
    units.


    All 16 of the OMI subchannels come off the Power10 SCM and are wired to 16 memory
    buffer based DDIMM slots, with one DDIMM connected to each OMI subchannel.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '![](img/7c8373945565ba432037f60bbf8458eb_86_0.png)



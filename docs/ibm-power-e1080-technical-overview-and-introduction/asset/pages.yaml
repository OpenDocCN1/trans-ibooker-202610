  md: '# 2.1 IBM Power10 processor


    Figure 2-1 shows the logical system architecture of the Power E1080 server.


    ![](img/7c8373945565ba432037f60bbf8458eb_63_0.png)


    Figure 2-1 Power E1080 logical system


    The IBM Power10 processor was introduced to the general public on August 17, 2020
    at the 32nd HOT CHIPS¹ semiconductor conference. At that meeting, the new capabilities
    and features of the latest Power processor microarchitecture and the Power Instruction
    Set Architecture (ISA) v3.1B were revealed and categorized according to the following
    Power10 processor design priority focus areas:


    +   ► Data plane bandwidth focus area

    +   Terabyte per second signaling bandwidth on processor functional interfaces,
    petabyte system memory capacities, 16-socket symmetric multiprocessing (SMP) scalability,
    and memory clustering and memory inception capability.


    +   ► Powerful enterprise core focus area

    +   New core micro-architecture, flexibility, larger caches, and reduced latencies.


    +   ► End-to-end security focus area

    +   Hardware enabled security features that are co-optimized with PowerVM hypervisor
    support.


    +   ► Energy efficiency focus area

    +   Up to threefold energy efficiency improvement in comparison to POWER9 processor
    technology.


    1 https://hotchips.org/'
  merge: -1
  img_proc: true
- pgno: 64
  md: '+   Artificial intelligence (AI)-infused core focus area

    +   A 10-20x matrix-math performance improvement per socket compared to the POWER9
    processor technology capability.


    The remainder of this section provides more specific information about the Power10
    processor technology as it is used in the Power E1080 scale-up enterprise class
    server.


    The IBM''s Power10 Processor session material as presented at the 32nd HOT CHIPS
    conference is available through the HC32 conference proceedings archive at this
    web page.


    # 2.1.1 Power10 processor overview


    The Power10 processor is a superscalar symmetric multiprocessor that is manufactured
    in complimentary metal-oxide-semiconductor (CMOS) 7 nm lithography with 18 layers
    of metal. The processor contains up to 15 cores that support eight simultaneous
    multithreading (SMT8) independent execution contexts.


    Each core has private access to 2 MB L2 cache and local access to 8 MB of L3 cache
    capacity. The local L3 cache region of a specific core also is accessible from
    all other cores on the processor chip. The cores of one Power10 processor share
    up to 120 MB of latency optimized non-uniform cache access (NUCA) L3 cache.


    The processor supports the following three distinct functional interfaces which
    all are capable to run with a signaling rate of up to 32 GTps²:


    +   Open memory interface

    +   The Power10 processor has eight memory controller unit (MCU) channels that
    support one open memory interface (OMI) port with two OMI links each³. One OMI
    link aggregates 8 lanes running at 32 GTps speed and connects to one memory buffer
    based differential DIMM (DDIMM) slot to access main memory. Physically, the OMI
    interface is implemented in two separate die areas of 8 OMI links each. The maximum
    theoretical full-duplex bandwidth aggregated over all 128 OMI lanes is 1 TBps.


    +   SMP fabric interconnect (PowerAXON)

    +   A total of 144 lanes are available in the Power10 processor to facilitate
    the connectivity to other processors in a symmetric multiprocessing (SMP) architecture
    configuration. Each SMP connection requires 18 lanes, eight data lanes plus one
    spare lane per direction (2 x(8+1)). In this way the processor can support a maximum
    of eight SMP connections with at total of 128 data lanes per processor. This configuration
    yields a maximum theoretical full-duplex bandwidth aggregated over all SMP connections
    of 1 TBps.

    +   The generic nature of the interface implementation also allows the use of
    128 data lanes to potentially connect accelerator or memory devices through the
    OpenCAPI protocols. Also, it can support memory cluster and memory interception
    architectures.

    +   Because of the versatile characteristic of the technology, it is also referred
    to as PowerAXON interface (Power A-bus/X-bus/OpenCAPI/Networking⁴). The OpenCAPI
    and the memory clustering and memory interception use cases can be pursued in
    the future and are currently not use by available technology products.'
  merge: -1
  img_proc: true

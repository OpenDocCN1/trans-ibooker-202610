  md: '![](img/7c8373945565ba432037f60bbf8458eb_14_0.png)


    # Introduction to Power E1080


    The Power E1080 is the newest addition to IBM Power family, the industry’s best-in-class
    server platform for security and reliability. The Power E1080 introduces the essential
    enterprise hybrid cloud platform, which is uniquely designed to help you securely
    and efficiently scale core operational and artificial intelligence (AI) applications
    anywhere in a hybrid cloud.


    The Power E1080 simplifies end-to-end encryption and brings AI where your data
    is stored for faster insights. This configuration helps enable greater workload
    deployment flexibility and agility while accomplishing more work.


    The Power E1080 can help you to realize the following benefits:


    +   Protect trust from core to cloud

    +   Protect data that is in-transit and at-rest with greatly simplified end-to-end
    encryption across hybrid cloud without affecting performance.


    +   Enjoy enterprise quality of service

    +   The Power E1080 can detect, isolate, and recover from soft errors automatically
    in the hardware without taking an outage or relying on an operating system to
    manage the faults.


    +   Drive greater efficiency with sustainable and scalable compute

    +   The processor performance, massive system throughput, and memory capacity
    qualify the Power E1080 server to be the perfect workload consolidation platform.
    This performance Sentails significant savings in floor space, energy consumption,
    and operational expenditure costs.


    This chapter includes the following topics:


    +   1.1, “System overview” on page 2


    +   1.2, “System nodes” on page 6


    +   1.3, “System control unit” on page 10


    +   1.4, “Server specifications” on page 11


    +   1.5, “System features” on page 15


    +   1.6, “I/O drawers” on page 26


    +   1.7, “System racks” on page 34



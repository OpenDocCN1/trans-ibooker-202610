- pgno: 103
  md: 'To determine the remaining life of an NVMe device, complete the following steps:


    +   For an IBM AIX operating system:

    +    a. From the AIX command line, enter diag and press Enter.

    +    b. From the Function Selection menu, select Task Selection → NVMe general
    health information.

    +    c. Select the NVMe device that you want to check the remaining life for and
    press Enter.

    +    d. View the Percentage of NVM subsystem life used field.


    +   For Linux operating system.

    +    a. From the Linux command line, enter the following command and press Enter:

    +    `nvme smart-log /dev/nvmeX -H`

    +    Where nvmeX is the resource name of the NVMe device.

    +    b. View the Percentage used field.


    The NVMe device that is nearing its end of life must be replaced. The device soon
    reaches the limit for the number of write operations that are supported. Write
    operations to the NVMe device become slower over time, and at some point the NVMe
    device becomes a read-only device.


    When the operating system writes data to a read-only device, the write operations
    are rejected, and the operating system considers the device as if a failure occurred.
    To support normal write operations, the NVMe device must be replaced.


    # 2.5.3 USB subsystem



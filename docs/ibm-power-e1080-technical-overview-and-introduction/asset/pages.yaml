    # 3.4.2 Quantum-safe cryptography support


    To be prepared for the Quantum era, the Power E1080 is built to efficiently support
    future cryptography, such as Quantum-safe cryptography and FHE. The software libraries
    for these solutions are optimized for the Power10 processor-chip instruction set
    architecture (ISA) and are or will be available in the respective open source
    communities.


    Quantum-safe cryptography refers to the efforts to identify algorithms that are
    resistant to attacks by classical and quantum computers in preparation for the
    time when large-scale quantum computers are built.


    Homomorphic encryption refers to encryption techniques that permit systems to
    perform computations on encrypted data without decrypting the data first. The
    software libraries for these solutions are optimized for the Power processor-chip
    instruction set architecture (ISA).



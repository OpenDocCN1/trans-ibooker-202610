    \ 4 节点 Power E1080 服务器最多可提供 192 个 PCIe Gen 3 插槽。\n\nPCIe Gen 3 I/O 扩展抽屉（#EMX0）中的每个扇出模块均由一根光缆适配器连接，该适配器占用系统节点的一个\
    \ x16 PCIe Gen 4 插槽。\n\n支持的 I/O 抽屉最大数量和 PCIe 插槽总数量列于表 2-24。\n\n表 2-24 支持的 I/O\
    \ 抽屉最大数量和 PCIe 插槽总数量\n\n| 系统节点 | 最大 #EMX0 抽屉数 | 总插槽数 |  |  |\n| | | PCIe Gen 3,\
    \ x16 | PCIe Gen 3, x8 | 总 PCIe Gen 3 |\n| 一个系统节点 | 4 | 16 | 32 | 48 |\n| 两个系统节点\
    \ | 8 | 32 | 64 | 96 |\n| 三个系统节点 | 12 | 48 | 96 | 144 |\n| 四个系统节点 | 16 | 64 |\
    \ 128 | 192 |\n\n## 2.7.1 PCIe Gen 4 电缆适配器\n\nPCIe Gen3 I/O 扩展抽屉（#EMX0）通过使用放置在系统节点内任意\
    \ PCIe 插槽中的 PCIe Gen 4 I/O 扩展卡（#EJ24）连接到系统节点。一个扩展卡适配器通过 CXP 16X 有源光缆（AOC）对连接到\
    \ PCIe Gen3 I/O 扩展抽屉（#EMX0）的 PCIe Gen 3 6 槽扇出模块（#EMXH）。因此，该适配器也称为 PCIe Gen 4 CXP\
    \ 电缆适配器。\n\nPCIe Gen 4 电缆适配器如图 2-24 所示。\n\n![](img/7c8373945565ba432037f60bbf8458eb_111_0.png)\n\
    \n图 2-24 PCIe Gen 4 电缆适配器（#EJ24）\n\nPCIe Gen 4 电缆适配器（#EJ24）是一款半高、半长、低轮廓的 PCIe\
    \ Gen 4 x16 适配器。适配器提供两个端口用于连接 CXP 16x AOC 对。一个适配器支持连接到 EMX0 PCIe Gen3 I/O 扩展抽屉中的一个\
    \ PCIe Gen 3 6 槽扇出模块。\n\n尽管这些电缆不可冗余，但一条电缆丢失会使 I/O 带宽降低 50%（即，可用于 I/O 模块的通道数）。\n\
    \n每个系统节点最多允许八个 PCIe Gen 4 电缆适配器（#EJ24）连接到最多八个 PCIe Gen 3 6 槽扇出模块（#EMXH）。每个扇出模块必须配有一对\
    \ CXP 16x AOC 电缆，两端口均布线到来自系统节点的同一 PCIe Gen 4 电缆适配器。\n\n电缆适配器可放置在系统节点的任意插槽中。建议在系统节点中按以下适配器放置顺序进行：\n\
    \n```\nSystem node slot 1, 7, 3, 6, 2, 8, 4, 5\n```\n\n支持的适配器最大数量为每个系统节点 8 个，每个系统最多\
    \ 32 个，系统有四个节点。\n\n每当使用 PCIe Gen3 I/O 扩展抽屉（#EMX0）时，建议为系统节点中的 PCIe Gen 4 电缆适配器（#EJ24）适配器预留插槽。将高轮廓适配器放置在\
    \ I/O 扩展抽屉内。\n\n有三种不同类型的 CXP 16x AOC 电缆对可用于 PCIe Gen 4 电缆适配器（#EJ24）与 I/O 扩展抽屉的\
    \ PCIe Gen 3 扇出模块（#EMXH）之间的连接：\n\n- 2.0M（#ECCR）\n  当 I/O 抽屉与 E1080 服务器在 *同一* 机架中时使用此电缆。\n\
    - 10.0M（#ECCY）\n  当 I/O 抽屉与 E1080 服务器在 *不同* 机架中时使用此电缆。\n- 20.0M（#ECCZ）\n  与 10.0M（#ECCY）电缆类似，这些电缆用于\
    \ I/O 抽屉与 E1080 服务器在不同机架中的情况。\n\n> **注意：** 一个 #ECCR、一个 #ECCY 或一个 #ECCZ 包含两根 AOC\
    \ 电缆。\n\n## 2.7.2 PCIe Gen3 I/O 扩展抽屉\n\nPCIe Gen3 I/O 扩展抽屉（#EMX0）是一款 4U 高、基于 PCIe\
    \ Gen3 且可机架安装的 I/O 抽屉。它提供两个 PCIe 扇出模块（#EMXH），每个模块提供六个 PCIe Gen3 全高、全长插槽（两个 x16\
    \ 和四个 x8）。\n\nPower E870、Power E870C、Power E880 和 Power E880C 系统使用的旧扇出模块（#EMXF\
    \ 和 #EMXG）不能订购且与 Power system E1080 不兼容。\n\n有关抽屉尺寸的更多信息，请参见第 1.6 节，“I/O 抽屉”，第\
    \ 26 页。\n\nPCIe Gen 4 电缆适配器（#EJ24）CXP 16X AOC 将系统节点连接到 I/O 扩展抽屉中的 PCIe 扇出模块。\n\
    \n通过使用 HMC 引导菜单或操作系统支持实用程序进行并发维修以及 PCIe 适配器的添加或移除。\n\n盲插盒式磁带机（BSC）用于容纳安装到这些插槽中的全高适配器。BSC\
    \ 与上一代服务器的 #5802、#5803、#5877 和 #5873 12X 附加 I/O 抽屉所使用的 BSC 相同。\n\n功耗最高为每个适配器插槽\
    \ 50W。\n\n"

- raw:
  - '[PAGE 159]


    IBM PowerVC gives IBM Power Systems customers the following advantages:


    +   - It is deeply integrated with Power Systems.

    +   - It provides virtualization management tools.

    +   - It eases the integration of servers that are managed by PowerVM in automated
    IT environments, such as clouds.

    +   - It is a building block of IBM Infrastructure as a Service (IaaS), based
    on Power Systems.

    +   - PowerVC integrated with other cloud management tool, such as Ansible, Terraform,
    or OpenShift, and can be integrated into orchestration tools, such as the IBM
    Cloud® Automation Manager, VMware vRealize, or the SAP Landscape Management (LaMa).

    +   - PowerVC also provides an easy exchange of VM images between private and
    public clouds.


    IBM PowerVC is an addition to the PowerVM set of enterprise virtualization technologies
    that provide virtualization management. It is based on open standards and integrates
    server management with storage and network management.


    Because IBM PowerVC is based on the OpenStack initiative, Power Systems can be
    managed by tools that are compatible with OpenStack standards. When a system is
    controlled by IBM PowerVC, it can be managed in one of three ways:


    +   - By a system administrator by using the IBM PowerVC graphical user interface
    (GUI)

    +   - By a system administrator that uses scripts that contain the IBM PowerVC
    Representational State Transfer (REST) application programming interfaces (APIs)

    +   - By higher-level tools that call IBM PowerVC by using standard OpenStack
    API


    The following PowerVC offerings are positioned within the available solutions
    for Power Systems cloud:


    +   - IBM PowerVC: Advanced Virtualization Management

    +   - IBM PowerVC for Private Cloud: Basic Cloud

    +   - IBM Cloud Automation Manager: Advanced Cloud

    +   - VMware vRealize: Advanced Cloud


    PowerVC provides a systems management product that enterprise customers require
    to manage effectively the advanced features that are offered by IBM premium hardware.
    It reduces resource use and manages workloads for performance and availability.


    # 3.3 System automation with Ansible


    Enterprises can spend many precious administrative time performing repetitive
    tasks and using manual processes. Tasks, such as updating, patching, compliance
    checks, provisioning new virtual machines or LPARs, and ensuring that the correct
    security updates are in place, are taking time away from more valuable business
    activities.


    The ability to automate by using Ansible returns valuable time to the system administrators.


    Red Hat Ansible Automation Platform for Power is fully enabled, so enterprises
    can automate several tasks within AIX, IBM i, and Linux that include deploying
    applications. Ansible also can be combined with HMC, PowerVC, and Power Virtual
    Server to provision infrastructure anywhere you need, including cloud solutions
    from other IBM Business Partners or third-party providers based on Power processor-based
    servers.'
  - '[PAGE 160]


    A first task after the initial installation or set up of a new LPAR is to ensure
    that the correct patches are installed. Also, extra software (whether it is open
    source software, ISV software, or perhaps their own enterprise software) must
    be installed. Ansible features a set of capabilities to roll out new software,
    which makes it popular in Continuous Delivery/Continuous Integration (CD/CI) environments.
    Orchestration and integration of automation with security products represent other
    ways in which Ansible can be applied within the data center.


    Despite the wide adoption of AIX and IBM i in many different business sectors
    by different types of customers, Ansible can help introduce the Power processor-based
    technology to customers who believe that AIX and IBM i skills are a rare commodity
    that are difficult to locate in the marketplace but want to take advantage of
    all the features of the hardware platform. The Ansible experience is identical
    across Power or x86 processor-based technology and the same steps can be repeated
    in IBM Cloud.


    AIX and IBM i skilled customers also can benefit from the extreme automation solutions
    that are provided by Ansible.


    The Power processor-based architecture features unique advantages over commodity
    server platforms, such as x86, because the engineering teams that are working
    on the processor, motherboards, virtualization. and management appliances collaborate
    closely to ensure an integrated stack that works seamlessly. This approach is
    in stark contrast to the multivendor x86 processor-based technology approach,
    in which the processor, server, management, and virtualization must be purchased
    from different (and sometimes competing) vendors.


    The Power stack engineering teams partnered closely to deliver the enterprise

    \ 4.15 GHz (max) |\n| EDP4 | 15 | 3.25 | 3.55 | 3.55 to 4.00 GHz (max) |\n\n对于\
    \ Power E1080 服务器，默认启用 MPM。\n\n所有节电模式的控制均可在高级系统管理接口（ASMI）上使用并可动态修改。系统管理员还可以使用硬件管理控制台（HMC）设置节电模式或启用静态模式或\

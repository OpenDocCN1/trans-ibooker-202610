    length are required to support inter-rack connection between the system node and
    I/O expansion drawer.


    Table 1-16 Active Optical Cables feature codes


    | Feature code | Description | Order type |

    |---|---|---|

    | ECCR | 2M Active Optical Cable Pair for PCIe Gen 3 Expansion Drawer | Both |

    | ECCY | 10M Active Optical Cable Pair for PCIe Gen 3 Expansion Drawer | Both
    |

    | ECCZ | 20M Active Optical Cable Pair for PCIe Gen 3 Expansion Drawer | Both
    |


    Careful balancing of I/O, assigning adapters through redundant EMX0 expansion
    drawers, and connectivity to different system nodes can ensure high-availability
    for I/O resources assigned to LPARs.


    Note: Consider the following points:


    - Older PCIe Gen 3 Fanout Modules (#EMXG, #ELMF, and #ELMG) cannot be mixed with
    PCIe Gen 3 Fanout Module (feature #EMXH) in the same I/O Expansion Drawer.

    - Older I/O Expansion Drawers can be mixed with PCIe Gen 3 Fanout Modules (#ELMF,
    #ELMG) and I/O Expansion Drawers with PCIe Gen 3 Fanout Modules #EMXH in same
    configuration.

    - Older PCIe Gen 3 Fanout Modules (#ELMF, #ELMG) can be connect to older PCIe
    Gen 3 Optical Cable Adapters (#EJ05 or #EJ08).

    - PCIe Gen 3 Optical Cable Adapters (#EJ20, or #EJ1R) requires the use of Optical
    Cables (#ECCR, #ECCX, ECCY, or #ECCZ, or copper cable #ECCS).


    ### 1.6.2 I/O drawers and usable PCIe slots


    Figure 1-9 on page 28 shows the rear view of the PCIe Gen 3 I/O Expansion Drawer
    with the location codes for the PCIe adapter slots in the PCIe Gen 3 6-slot Fanout
    Module.


    ![](img/7c8373945565ba432037f60bbf8458eb_41_0.png)


    Figure 1-9 Rear view of a PCIe Gen 3 I/O Expansion Drawer with PCIe slots location
    codes


    Table 1-17 lists the PCIe slots in the PCIe Gen 3 I/O Expansion Drawer.


    Table 1-17 PCIe slot locations and descriptions for the PCIe Gen 3 I/O Expansion
    Drawer


    | Slot | Location code | Description |

    |---|---|---|

    | Slot 1 | P1-C1 | PCIe Gen 3, x16 |

    | Slot 2 | P1-C2 | PCIe Gen 3, x8 |

    | Slot 3 | P1-C3 | PCIe Gen 3, x8 |

    | Slot 4 | P1-C4 | PCIe Gen 3, x16 |

    | Slot 5 | P1-C5 | PCIe Gen 3, x8 |

    | Slot 6 | P1-C6 | PCIe Gen 3, x8 |

    | Slot 7 | P2-C1 | PCIe Gen 3, x16 |

    | Slot 8 | P2-C2 | PCIe Gen 3, x8 |

    | Slot 9 | P2-C3 | PCIe Gen 3, x8 |

    | Slot 10 | P2-C4 | PCIe Gen 3, x16 |

    | Slot 11 | P2-C5 | PCIe Gen 3, x8 |

    | Slot 12 | P2-C6 | PCIe Gen 3, x8 |


    Consider the following points regarding the information in Table 1-17:


    - All slots support full-length, regular-height adapters or short (low-profile)
    adapters with a regular-height tailstock in single-wide, Gen 3 BSCs.

    - Slots C1 and C4 in each PCIe Gen 3 6-slot Fanout Module are x16 PCIe Gen 3 buses;
    slots C2, C3, C5, and C6 are x8 PCIe buses.

    - All slots support enhanced error handling (EEH).

    - All PCIe slots are hot-swappable and support concurrent maintenance.


    Table 1-18 lists the maximum number of I/O drawers that are supported and the
    total number of PCIe slots that are available when the expansion drawer consists
    of a single drawer type.


    Table 1-18 Maximum number of supported I/O drawers and the total number of PCIe
    slots


    | System nodes | Maximum #EMX0 drawers | Total number of slots |  |  |

    |---|---|---|---|---|

    |  |  | PCIe Gen 3, x16 | PCIe Gen 3, x8 | Total PCIe Gen 3 |

    | One system node | 4 | 16 | 32 | 48 |

    | Two system nodes | 8 | 32 | 64 | 96 |

    | Three system nodes | 12 | 48 | 96 | 144 |

    | Four system nodes | 16 | 64 | 128 | 192 |


    ### 1.6.3 EXP24SX SAS Storage Enclosures


    If you need more disks than are available with the internal disk bays, you can
    attach more external disk subsystems, such as an EXP24SX SAS Storage Enclosure
    (#ESLS).


    The EXP24SX drawer is a storage expansion enclosure with 24 2.5-inch SFF SAS bays.
    It supports up to 24 hot-plug HDDs or SSDs in only 2 EIA of space in a 19-inch
    rack. The EXP24SX SFF bays use SFF Gen2 (SFF-2) carriers or trays.


    With AIX/Linux/VIOS, the EXP24SX can be ordered with four sets of 6 bays (mode
    4), two sets of 12 bays (mode 2) or one set of 24 bays (mode 1). With IBM i one
    set of 24 bays (mode 1) is supported. It is possible to change the mode setting
    in the field by using software commands along with a specifically documented procedure.


    **Important:** When changing modes, a skilled, technically qualified person must
    follow the special documented procedures. Improperly changing modes can destroy
    RAID sets, which prevent access to data, or allow other partitions to access another
    partition''s data.


    The attachment between the EXP24SX drawer and the PCIe Gen 3 SAS adapter is through
    SAS YO12 or X12 cables. The PCIe Gen 3 SAS adapters support 6 Gb throughput. The
    EXP24SX drawer can support up to 12 Gb throughput if future SAS adapters support
    that capability.


    The EXP24SX drawer includes redundant AC power supplies and two power cords.


    Figure 1-10 shows the EXP24SX drawer.


    ![](img/7c8373945565ba432037f60bbf8458eb_43_0.png)


    Figure 1-10 EXP24SX drawer


    **Note:** For the EXP24SX drawer, a maximum of 24 2.5-inch SSDs or 2.5-inch HDDs
    are supported in the #ESLS 24 SAS bays. HDDs and SSDs cannot be mixed in the same
    mode-1 drawer. HDDs and SSDs can be mixed in a mode-2 or mode-4 drawer, but they
    cannot be mixed within a logical split of the drawer. For example, in a mode-2
    drawer with two sets of 12 bays, one set can hold SSDs and one set can hold HDDs,
    but you cannot mix SSDs and HDDs in the same set of 12 bays.


    For more information about SAS cabling and cabling configurations at IBM Documentation.


    Table 1-19 lists the SFF-2 SSD and HDD feature codes that the Power E1080 supports

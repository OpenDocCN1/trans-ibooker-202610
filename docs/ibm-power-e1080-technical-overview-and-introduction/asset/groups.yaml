    # 1.6.3 EXP24SX SAS Storage Enclosures


    If you need more disks than are available with the internal disk bays, you can
    attach more external disk subsystems, such as an EXP24SX SAS Storage Enclosure
    (#ESLS).


    The EXP24SX drawer is a storage expansion enclosure with 24 2.5-inch SFF SAS bays.
    It supports up to 24 hot-plug HDDs or SSDs in only 2 EIA of space in a 19-inch
    rack. The EXP24SX SFF bays use SFF Gen2 (SFF-2) carriers or trays.


    With AIX/Linux/VIOS, the EXP24SX can be ordered with four sets of 6 bays (mode
    4), two sets of 12 bays (mode 2) or one set of 24 bays (mode 1). With IBM i one
    set of 24 bays (mode 1) is supported. It is possible to change the mode setting
    in the field by using software commands along with a specifically documented procedure.


    **Important:** When changing modes, a skilled, technically qualified person must
    follow the special documented procedures. Improperly changing modes can destroy
    RAID sets, which prevent access to data, or allow other partitions to access another
    partition''s data.


    The attachment between the EXP24SX drawer and the PCIe Gen 3 SAS adapter is through
    SAS YO12 or X12 cables. The PCIe Gen 3 SAS adapters support 6 Gb throughput. The
    EXP24SX drawer can support up to 12 Gb throughput if future SAS adapters support
    that capability.


    The EXP24SX drawer includes redundant AC power supplies and two power cords.'

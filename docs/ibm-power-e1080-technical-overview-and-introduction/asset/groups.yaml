  - '[PAGE 119]


    # 2.8 External disk subsystems


    This section describes the following external disk subsystems that can be attached
    to the Power E1080 server:


    +   EXP24SX SAS Storage Enclosures


    +   IBM System Storage


    # 2.8.1 IBM EXP24SX SAS Storage Enclosure


    The EXP24SX SAS storage enclosure (#ESLS) is the only DASD drawer that is available
    for Power E1080 that provides extra disk drives. The ESLS supports SSDs and HDDs.
    The ESLS storage enclosures are connected to system units by using a serial-attached
    SCSI (SAS) port in the SAS adapters.


    The EXP24SX is a storage expansion enclosure with 24 2.5-inch small form factor
    (SFF) SAS bays. It supports 10K and 15K SAS HDD having 512 and 4K format drives
    and enterprise and mainstream class SAS SSDs.


    The enclosures can be split logically into one, two, or four independent groups:


    +   One set of 24 bays (mode 1) (D1-D24),


    +   Two sets of 12 bays (mode 2), (D1-D12) (D13-D24)or


    +   Four sets of 6 bays (mode 4).(D1-D6) (D7-D12) (D13-D18) (D19-D24)


    The front view of the ESLS storage enclosure with drive locations is shown in
    Figure 2-30.


    ![](img/7c8373945565ba432037f60bbf8458eb_119_0.png)


    Figure 2-30 Front view of the ESLS storage enclosure with mode groups & drive
    locations


    The SAS storage enclosures support the following operating systems:


    +   AIX


    +   IBM i


    +   Linux


    +   VIOS'

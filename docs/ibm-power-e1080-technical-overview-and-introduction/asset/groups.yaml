    \n## 1.7.6 有用的机架附加件\n\n本节重点介绍 IBM Power 机架式系统的几种机架附加件解决方案。\n\n### IBM System Storage\
    \ 7226 Model 1U3 多媒体机箱\n\nIBM System Storage 7226 Model 1U3 多媒体机箱可容纳多达两台磁带驱动器、两个\
    \ RDX 可移动磁盘驱动器停靠站，或多达四个 DVD-RAM 驱动器。\n\nIBM System Storage 7226 多媒体机箱支持 LTO Ultrium\
    \ 和 DAT160 磁带技术、DVD-RAM 和 RDX 可移动存储需求，适用于以下 IBM 系统：\n\n- IBM POWER6 处理器系统\n- IBM\
    \ POWER7 处理器系统\n- IBM POWER8® 处理器系统\n- IBM POWER9 处理器系统\n- IBM Power10 处理器系统\n\
    \nIBM System Storage 7226 多媒体机箱提供广泛的驱动器功能选项，如表 1-23 所列。\n\n表 1-23 7226-1U3 支持的驱动器功能\n\
    \n| Feature code | Description | Status |\n|---|---|---|\n| 1420 | DVD-RAM SAS\

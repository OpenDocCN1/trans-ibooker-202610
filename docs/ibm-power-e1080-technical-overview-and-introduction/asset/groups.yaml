    - EXP24SX I/O DASD 抽屉（#ESLS）


    PCIe 扩展抽屉使用 #EJ24 适配器连接。EXP24S 存储机箱可以连接到系统节点或 PCIe 扩展抽屉上的 SAS 适配器。



    \ PDL | 30 Amps | One system node and 1 I/O expansion drawer | 4 |\n| 6658 | Korean\
    \ plug | 30 Amps | One system node and 1 I/O expansion drawer | 4 |\n| 6492 |\
    \ IEC 309, 2P+G, 60 A | 60 Amps | Two system node and 1 I/O expansion drawer |\
    \ 4 |\n| 6491 | IEC 309, P+N+G, 63 A | 60 Amps | Two system nodes and 1 I/O expansion\
    \ drawer | 8 |\n\n## 1.7.5 架装规则\n\n将系统安装到机架时，请考虑以下主要规则：\n\n- 为保证机架稳定性，从底部开始填充机架。\n\
    - IBM 建议在任何 IBM 或非 IBM 机架中安装系统时使用 IBM 批准的升降工具。\n- IBM 不支持将服务器节点安装在 29U 位置以上。\n\

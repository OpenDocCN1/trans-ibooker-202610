    \ Drawer\n\nThe PCIe Gen3 I/O Expansion Drawer (#EMX0) is a 4U high, PCIe Gen3-based\
    \ and rack-mountable I/O drawer. It offers two PCIe Fanout Modules (#EMXH), each\
    \ providing six PCIe Gen3 full-high, full-length slots (two x16 and four x8).\n\
    \nThe older Fanout Modules (#EMXF & #EMXG) that are used by Power E870, Power\
    \ E870C, Power E880, and Power E880C systems cannot be ordered and is not supported\
    \ with the Power system E1080.\n\nFor more information about the dimensions of\
    \ the drawer, see 1.6, “I/O drawers” on page 26.\n\nPCIe Gen 4 cable adapter (#EJ24)\
    \ CXP 16X AOCs connects the system node to a PCIe Fanout Module in the I/O expansion\
    \ drawer.\n\nConcurrent repair and addition or removal of PCIe adapters is done\
    \ by using HMC-guided menus or operating system support utilities.\n\nA blind-swap\
    \ cassette (BSC) is used to house the full-high adapters that are installed into\
    \ these slots. The BSC is the same BSC that was used with the previous generation\
    \ server’s #5802, #5803, #5877, and #5873 12X attached I/O drawers.\n\nPower consumption\
    \ is up to 50W per adapter slot.\n"

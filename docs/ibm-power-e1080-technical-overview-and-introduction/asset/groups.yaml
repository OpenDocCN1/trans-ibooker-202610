    - Eight lanes per OMI link

    - Two OMI links per OMI port (2 x 8 lanes)

    - Eight OMI ports per single chip module (16 x 8 lanes)


    ## 2.1.9 Pervasive memory encryption


    The Power10 MCU provides the system memory interface between the on-chip symmetric
    multiprocessing (SMP) interconnect fabric and the OMI links. This design qualifies
    the MCU as ideal functional unit to implement memory encryption logic. The Power10
    on-chip MCU encrypts and decrypts all traffic to and from system memory that is
    based on the AES technology.


    The Power10 processor supports the following modes of operation:


    - AES XTS mode


    XTS is an abbreviation for the xor–encrypt–xor based tweaked-codebook mode with
    ciphertext stealing. AES XTS provides a block cipher with strong encryption, which
    is particularly useful to encrypt persistent memory.


    Persistent DIMM technology retains the data that is stored inside the memory DIMMs,
    even if the power is turned off. A malicious attacker who gains physical access
    to the DIMMs can steal memory cards. The data that is stored in the DIMMs can
    leave the data center in the clear if not encrypted.


    Also, memory cards that leave the data center for repair or replacement can be
    a potential security breach. Because the attacker might have arbitrary access
    to the persistent DIMM data. the stronger encryption of the AES XTS mode is required
    for persistent memory. The AES XTS mode of the Power10 processor is supported
    for future use if persistent memory solutions become available for IBM Power servers.


    - AES CTR mode


    CTR stands for Counter mode of operation and designates a low-latency AES block
    cipher. Although the level of encrypting is not as strong as with the XTS mode,
    the low-latency characteristics make it the preferred mode for memory encryption
    of volatile memory. AES CTR makes it more difficult to physically gain access
    to data through the memory card interfaces. The goal is to protect against physical
    attacks, which becomes increasingly important in the context of cloud deployments.


    The Power E1080 servers support the AES CTR mode for pervasive memory encryption.
    Each Power10 processor holds a 128-bit encryption key that is used by the processor’s
    MCU to encrypt the data of the differential DIMMs that are attached to the OMI
    links.


    The MCU crypto engine is transparently integrated into the data path, which ensures
    that the data fetch and store bandwidth are not compromised by the AES CTR encryption
    mode. Because the encryption has no noticeable performance effect and because
    of the obvious security benefit, the pervasive memory encryption is enabled by
    default and cannot be switched off through any administrative interface.


    > Note: The pervasive memory encryption of the Power10 processor does not affect
    the encryption status of a system dump content. All data that is coming from the
    DDIMMs is decrypted by the memory controller unit before it is passed onto the
    dump devices under the control of the dump program code. This statement applies
    to the traditional system dump under the operating system control and the firmware
    assist dump utility.


    **Note:** The PowerVM Live Partition Mobility (LPM) data encryption does not interfere
    with the pervasive memory encryption. Data transfer during a LPM operation uses
    the following general flow:


    1. On the source server, the Mover Server Partition (MSP) provides the hypervisor
    with a buffer.

    2. The hypervisor of the source system copies the partition memory into the buffer.

    3. The MSP transmits the data over the network.

    4. The data is received by the MSP on the target server and copied in to the related
    buffer.

    5. The hypervisor of the target system copies the data from the buffer into the
    memory space of the target partition.


    To facilitate LPM data compression and encryption, the hypervisor on the source
    system presents the LPM buffer to the on-chip nest accelerator (NX) unit as part
    of process in Step 2. The reverse decryption and decompress operation is applied
    on the target server as part of process in Step 4.


    The pervasive memory encryption logic of the MCU decrypts the memory data before
    it is compressed and encrypted by the NX unit on the source server. It also encrypts
    the data before it is written to memory but after it is decrypted and decompressed
    by the NX unit of the target server.


    ## 2.1.10 Nest accelerator


    The Power10 processor has an on-chip accelerator called nest accelerator unit
    or NX unit. The coprocessor features that are available on the Power10 processor
    are similar to the features on the POWER9 processor. These coprocessors provide
    specialized functions, such as the following examples:


    - IBM proprietary data compression and decompression

    - Industry standard gzip compression and decompression

    - AES and Secure Hash Algorithm (SHA) cryptography

    - Random number generation


    Figure 2-6 on page 63 shows a block diagram of the NX unit.


    ![](img/7c8373945565ba432037f60bbf8458eb_76_0.png)


    Figure 2-6 Block diagram of the NX unit


    Each one of the AES/SHA engines, data compression, and Gzip units consist of a
    coprocessor type and the NX unit features three coprocessor types. The NX unit
    also includes more support hardware to support coprocessor invocation by user
    code, use of effective addresses, high-bandwidth storage accesses, and interrupt
    notification of job completion.


    The direct memory access (DMA) controller of the NX unit helps to start the coprocessors
    and move data on behalf of coprocessors. SMP interconnect unit (SIU) provides
    the interface between the Power10 SMP interconnect and the DMA controller.


    The NX coprocessors can be started transparently through library or operating
    system kernel calls to speed up operations that are related to data compression,
    live partition mobility migration, IPSec, JFS2 encrypted file systems, PKCS11
    encryption, random number generation, and the most recently announced logical
    volume encryption.


    In effect, this on-chip NX unit on Power10 systems implements a high throughput
    engine that can perform the equivalent work of multiple cores. The system performance
    can benefit by off-loading these expensive operations to on-chip accelerators,
    which in turn can greatly reduce the CPU usage and improve the performance of
    applications.


    The accelerators are shared among the logical partitions (LPARs) under the control
    of the PowerVM hypervisor and accessed by way of hypervisor call. The operating
    system, along with the PowerVM hypervisor, provides a send address space that
    is unique per process requesting the coprocessor access. This configuration allows
    the user process to directly post entries to the first in - first out (FIFO) queues
    that are associated with the NX accelerators. Each NX coprocessor type has a unique
    receive address space corresponding to a unique FIFO for each of the accelerators.


    For more information about the use of the xgzip tool that uses the gzip accelerator
    engine, see the following resources:


    - IBM support article *Using the POWER9 NX (gzip) accelerator in AIX*

    - IBM Power Systems community article *Power9 GZIP Data Acceleration with IBM
    AIX*

    - AIX community article *Performance improvement in openssh with on-chip data
    compression accelerator in power9*

    - IBM Documentation: *nxstat Command*


    ## 2.1.11 SMP interconnect and accelerator interface


    The Power10 processor provides a highly-optimized, 32 Gbps differential signaling
    technology interface that is structured in 16 entities. Each entity consists of
    eight data lanes and one spare lane. This interface can facilitate the following
    functional purposes:


    - First- or second-tier, symmetric multiprocessing link interface, enabling up
    to 16 Power10 processors to be combined into a large, robustly scalable, single-system
    image.

    - Open Coherent Accelerator Processor Interface (OpenCAPI), to attach cache coherent
    and I/O-coherent computational accelerators, load/store addressable host memory
    devices, low latency network controllers, and intelligent storage controllers.

    - Host-to-host integrated memory clustering interconnect, enabling multiple Power10
    systems to directly use memory throughout the cluster.


    > Note: The OpenCAPI interface and the memory clustering interconnect are Power10
    technology option for future use.


    Because of the versatile nature of signaling technology, the 32 Gbps interface
    is also referred to as Power/A-bus/X-bus/OpenCAPI/Networking (*PowerAXON*) interface.
    The IBM proprietary X-bus links connect two processors on a board with a common
    reference clock. The IBM proprietary A-bus links connect two processors in different
    drawers on different reference clocks by using a cable.


    OpenCAPI is an open interface architecture that allows any microprocessor to attach
    to the following items:


    - Coherent user-level accelerators and I/O devices

    - Advanced memories accessible through read/write or user-level DMA semantics


    The OpenCAPI technology is developed, enabled, and standardized by the OpenCAPI
    Consortium. For more information about the consortium’s mission and the OpenCAPI
    protocol specification, see OpenCAPI Consortium.


    The PowerAXON interface is implemented on dedicated areas that are at each corner
    of the Power10 processor die. The Power E1080 server makes use of this interface
    to implement single-drawer chip-to-chip and drawer-to-drawer chip interconnects.


    The Power E1080 single-drawer chip-to-chip SMP interconnect features the following
    properties:


    - Three (2 x 9)-bit on planar buses per Power10 single chip module (SCM)

    - Eight data lanes, plus one spare lane in each direction per chip-to-chip connection

    - 32 Gbps signaling rate providing 128 GBps per chip-to-chip SMP connection bandwidth,
    an increase of 33% compared to the Power E980 single-drawer implementation



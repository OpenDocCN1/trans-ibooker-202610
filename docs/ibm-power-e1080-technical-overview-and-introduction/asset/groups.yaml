    | P0-C1 | PCIe Gen 4 x16 or PCIe Gen 5 x8 | P0/0 | 2 | Yes |

    | P0-C2 | PCIe Gen 4 x16 or PCIe Gen 5 x8 | P2/1 | 3 | Yes |

    | P0-C3 | PCIe Gen 5 x8 | P2/0 | 4 | Yes |

    | P1-C0 | PCIe Gen 4 x4 | P2/0 | NVMe Slot 1 | NA |

    | P1-C1 | PCIe Gen 4 x4 | P2/0 | NVMe Slot 2 | NA |

    | P1-C2 | PCIe Gen 4 x4 | P3/1 | NVMe Slot 3 | NA |

    | P1-C3 | PCIe Gen 4 x4 | P3/1 | NVMe Slot 4 | NA |

    | P0-C4 | PCIe Gen 5 x8 | P3/1 | 5 | Yes |

    | P0-C5 | PCIe Gen 4 x16 or PCIe Gen 5 x8 | P3/0 | 6 | Yes |

    | P0-C6 | PCIe Gen 4 x16 or PCIe Gen 5 x8 | P1/1 | 7 | Yes |

    | P0-C7 | PCIe Gen 4 x16 or PCIe Gen 5 x8 | P1/0 | 8 | Yes |


    PCIe x16 cards are supported only in PCIe x16 slots and the slot priority is (1,
    3, 7, 2, 6, 8).


    PCIe adapters with x8 and lower lanes are supported in all the PCIe slots and
    the slot priority is (1, 7, 3, 6, 2, 8, 4, 5).


    Place 8x and 16x adapters in same size slots first before mixing connector size
    with slot size. Adapters with smaller connectors are allowed in larger PCIe slot
    sizes, but larger connectors are not compatible in smaller PCIe slots sizes.


    The system nodes allow for eight PCIe slots of which six are PCIe Gen4 x16 or
    PCIe Gen5 x8 slots and two are PCIe Gen5 x8 slots. Slots can be added by attaching
    PCIe expansion drawers; SAS disks can be attached to EXP24S SFF Gen2 expansion
    drawers. At the time of this writing, only the following expansion drawers are
    supported:


    +   - EMX0 PCIe Gen3 I/O expansion drawer (#EMX0)

    +   - EXP24SX I/O DASD drawer (#ESLS)


    The PCIe expansion drawer is connected by using an #EJ24 adapter. The EXP24S storage
    enclosure can be attached to SAS adapters on the system nodes or on the PCIe expansion
    drawer.


    For a list of adapters and their supported slots, see 2.6, “Supported PCIe adapters”
    on page 92.



    \ Center（SSIC）。\n\n> Note: Any of the existing 7216-1U2, 7216-1U3, and 7214-1U2\
    \ multimedia drawers are also supported.\n\n### 平板显示器选项\n\nIBM 7316 Model TF5\
    \ 是一款机架式平板控制台套件，还可配置为托盘向前拉出且显示器向上折叠，提供 HMC 操作员的完整查看和操作功能。\n\nModel TF5 是 Model\
    \ TF4 的后续产品，提供以下功能：\n\n- 仅占用 19 英寸标准机架 1U（1.75 英寸）空间的纤薄、时尚、轻量级显示器设计\n- 18.5 英寸（409.8\
    \ mm x 230.4 mm）平板 TFT 显示器，图像真实准确，几乎无失真\n- 可将 IBM Travel Keyboard 安装在 7316-TF5\

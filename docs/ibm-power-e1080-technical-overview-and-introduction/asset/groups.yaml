    # 1.5.3 Memory features


    This section describes the memory features that available on a Power E1080 server.
    Careful selection of these features helps the user to configure their system with
    the correct amount of memory that can meet the demands of memory intensive workloads.
    On a Power E1080 server, the memory features can be classified into the following
    feature categories:


    +   - Physical memory

    +   - Memory activation


    These features are described next.


    # Physical memory features


    Physical memory features that are supported on Power E1080 are the next generation
    differential dual inline memory modules, called DDIMM (see 2.3, “Memory subsystem”
    on page 72). DDIMMS that are used in the E1080 are Enterprise Class 4U DDIMMs.


    The memory DDIMM features are available in 32-, 64-, 128-, and 256-GB capacity.
    Among these DDIMM features, 32 GB and 64 GB DDIMMs run at 3200 MHz frequency and
    128 GB and 256 GB DDIMMs run at 2933 MHz frequency.


    Each system node provides 64 DDIMM slots that support a maximum of 16 TB memory
    and a four system node E1080 can support a maximum of 64 TB memory. DDIMMs are
    ordered by using memory feature codes, which include a bundle of four DDIMMs with
    the same capacity.


    Consider the following points regarding improved performance:


    +   - Plugging DDIMMs of same density provides the highest performance.

    +   - Filling all the memory slots provides maximum memory performance.

    +   - System performance improves when more quads of memory DDIMMs match.

    +   - System performance also improves as the amount of memory is spread across
    more DDIMM slots.


    For example, if 1TB of memory is required, 64 x 32 GB DDIMMs can provide better
    performance than 32 x 64 GB DDIMMs'

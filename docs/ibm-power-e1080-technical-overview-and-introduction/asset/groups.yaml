    Adapters that are used in the Power E1080 server are enclosed in a specially designed
    adapter cassette. The cassette includes a special mechanism for holding the adapter
    within a'
  - '[PAGE 98]


    socket and helps for easy insertion and removal of the adapter into a PCIe slot
    at the rear side of the server.


    The cassette locations are P0-C0 - P0-C7. The adapter locations are P0-C0-C0 -
    P0-C7-C0.


    All slots are of low-profile (LP) type; that is, half-height, half-length (HHHL).
    They support Enhanced Error Handling (EEH) and can be serviced with the system
    power turned on. The slots also support Gen 1 to Gen 3 adapters.


    All the PCIe slots support Single Root I/O Virtualization (SR-IOV) adapters.


    Currently, no adapter can dissipate more than 25 watts. Special considerations
    are needed to exceed this limit.


    The Power E1080 server supports concurrent maintenance (hot plugging) of PCIe
    adapters. The adapter cassette is provided with three LEDs that can indicate power
    and activity (green), identify function (amber) for the adapter (labeled C0),
    and fault function LED (amber) for the cassette. The server can be located by
    using the blue identify LED on the enclosure.


    The internal connections are shown in Figure 2-18.


    ![](img/7c8373945565ba432037f60bbf8458eb_98_0.png)


    Figure 2-18 Power E1080 server node to PCIe slot internal connection schematics



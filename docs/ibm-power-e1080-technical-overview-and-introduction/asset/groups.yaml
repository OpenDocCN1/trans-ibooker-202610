    # 2.1.13 Comparing Power10, POWER9, and POWER8 processors


    The Power E1080 enterprise class systems use exclusively single chip modules (SCM)
    with up to 15 active SMT8 capable cores. These SCM processor modules are structural
    and performance optimized for usage in scale-up multi-socket systems.


    Table 2-5 compares key features and characteristics of the Power10, POWER9, and
    POWER8 processor implementations as used in enterprise class scale-up servers.


    Table 2-5 Comparison of the Power10 processor technology to prior processor generations


    | Characteristics | Power10 | POWER9 | POWER8 |

    |---|---|---|---|

    | Technology | 7 nm | 14 nm | 22 nm |

    | Die size | 602 mm² | 693 mm² | 649 mm² |

    | Processor module size | 68.5 mm x 77.5 mm | 68.5 mm x 68.5 mm | 71.5 mm x 71.5
    mm |

    | Number of transistors | 18 billion | 8 billion | 4.2 billion |

    | Maximum cores | 15 | 12 | 12 |

    | Maximum hardware threads per core | 8 | 8 | 8 |

    | Maximum static frequency / high performance frequency range | 3.75 - 4.15 GHZ
    | 3.9 - 4.0 GHz | 4.15 GHz |

    | L2 Cache per core | 2048 KB | 512 KB | 512 KB |'

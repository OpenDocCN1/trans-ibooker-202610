    ## 1.8.6 HMC 时效性


    近年来，网络安全已成为国家安全问题，以及 CIO 和企业 IT 管理员日益关注的重点。


    基于 IBM Power 处理器的架构在端到端安全性方面一直名列前茅，这也是其仍然成为关键任务企业工作负载首选平台的原因。


    维护安全的 Power 环境的一个关键方面是确保 HMC（或虚拟 HMC）保持最新并得到完全支持（包括硬件、软件和 Power 固件更新）。



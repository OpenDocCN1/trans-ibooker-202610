  - '[PAGE 51]


    # 1.7.4 PDU connection limits


    Two possible PDU ratings are supported: 60/63 amps and 30/32 amps. The PDU rating
    is determined by the power cord that is used to connect the PDU to the electrical
    supply. The number of system nodes and I/O expansion drawers that are supported
    by each power cord are listed in Table 1-22.


    Table 1-22 Maximum supported enclosures by power cord


    | Feature code | Wall plug | PDU Rating | Maximum supported system nodes per PDU
    pair | Maximum supported I/O drawers with no system nodes |

    |---|---|---|---|---|

    | 6653 | IEC 309, 3P+N+G, 16 A | 60 Amps | Two system nodes and 1 I/O expansion
    drawer | 8 |

    | 6489 | IEC309 3P+N+G, 32 A | 60 Amps | Two system nodes and 1 I/O expansion
    drawer | 8 |

    | 6654 | NEMA L6-30 | 30 Amps | One system node and 1 I/O expansion drawer | 4
    |

    | 6655 | RS 3750DP (watertight) | 30 Amps | One system node and 1 I/O expansion
    drawer | 4 |

    | 6656 | IEC 309, P+N+G, 32 A | 30 Amps | One system node and 1 I/O expansion
    drawer | 4 |

    | 6657 | PDL | 30 Amps | One system node and 1 I/O expansion drawer | 4 |

    | 6658 | Korean plug | 30 Amps | One system node and 1 I/O expansion drawer |
    4 |

    | 6492 | IEC 309, 2P+G, 60 A | 60 Amps | Two system node and 1 I/O expansion drawer
    | 4 |

    | 6491 | IEC 309, P+N+G, 63 A | 60 Amps | Two system nodes and 1 I/O expansion
    drawer | 8 |


    # 1.7.5 Rack-mounting rules


    Consider the following primary rules when you mount the system into a rack:


    +   - For rack stability, start filling the rack from the bottom.

    +   - IBM recommends the use of an IBM approved lift tool for installation of
    systems into any IBM or non-IBM rack.

    +   - IBM does not support installation of the server nodes higher than the 29U
    position.

    +   - Any remaining space in the rack can be used to install other systems or
    peripheral devices. Ensure that the maximum permissible weight of the rack is
    not exceeded and the installation rules for these devices are followed.

    +   - Before placing the system into the service position, follow the rack manufacturer''s
    safety instructions regarding rack stability.'
  - '[PAGE 52]


    # 1.7.6 Useful rack additions


    This section highlights several rack addition solutions for IBM Power rack-based
    systems.


    # IBM System Storage 7226 Model 1U3 Multi-Media Enclosure


    The IBM System Storage 7226 Model 1U3 Multi-Media Enclosure can accommodate up
    to two tape drives, two RDX removable disk drive docking stations, or up to four
    DVD-RAM drives.


    The IBM System Storage 7226 Multi-Media Enclosure supports LTO Ultrium and DAT160
    Tape technology, DVD-RAM, and RDX removable storage requirements on the following
    IBM systems:


    +   - IBM POWER6 processor-based systems

    +   - IBM POWER7 processor-based systems

    +   - IBM POWER8® processor-based systems

    +   - IBM POWER9 processor-based systems

    +   - IBM Power10 processor-based systems


    The IBM System Storage 7226 Multi-Media Enclosure offers an expansive list of
    drive feature options, as listed in Table 1-23.


    Table 1-23 Supported drive features for the 7226-1U3


    | Feature code | Description | Status |

    |---|---|---|

    | 1420 | DVD-RAM SAS Optical Drive | Available |

    | 1422 | DVD-RAM Slim SAS Optical Drive | Available |

    | 5762 | DVD-RAM USB Optical Drive | Available |

    | 5763 | DVD Front USB Port Sled with DVD-RAM USB Drive | Available |

    | 5757 | DVD RAM Slim USB Optical Drive | Available |

    | 8348 | LTO Ultrium 6 Half High Fibre Tape Drive | Available |

    | 8341 | LTO Ultrium 6 Half High SAS Tape Drive | Available |

    | 8441 | LTO Ultrium 7 Half High SAS Tape Drive | Available |

    | 8546 | LTO Ultrium 8 Half High Fibre Tape Drive | Available |

    | EU03 | RDX 3.0 Removable Disk Docking Station | Available |


    The following options are available:


    +   - LTO Ultrium 6 Half-High 2.5 TB SAS and FC Tape Drive: With a data transfer
    rate up to 320 MBps (assuming a 2.5:1 compression), the LTO Ultrium 6 drive is
    read/write compatible with LTO Ultrium 6 and 5 media, and read-only compatibility
    with LTO Ultrium 4. By using data compression, an LTO-6 cartridge can store up
    to 6.25 TB of data.

    +   - The LTO Ultrium 7 drive offers a data rate of up to 300 MBps with compression.
    It also provides read/write compatibility with Ultrium 7 and Ultrium 6 media formats,
    and read-only compatibility with Ultrium 5 media formats. By using data compression,
    an LTO-7 cartridge can store up to 15TB of data.

    +   - The LTO Ultrium 8 drive offers a data rate of up to 300 MBps with compression.
    It also provides read/write compatibility with Ultrium 8 and Ultrium 7 media formats.
    It is not read or write compatible with other Ultrium media formats. By using
    data compression, an LTO-8 cartridge can store up to 30 TB of data.'
  - '[PAGE 53]


    +   ► DVD-RAM: The 9.4 GB SAS Slim Optical Drive with an SAS and USB interface
    option is compatible with most standard DVD disks.

    +   ► RDX removable disk drives: The RDX USB docking station is compatible with
    most RDX removable disk drive cartridges when it is used in the same OS. The 7226
    offers the following RDX removable drive capacity options:

    +     – 500 GB (#1107)

    +     – 1.0 TB (#EU01)

    +     – 2.0 TB (#EU2T)


    Removable RDX drives are in a rugged cartridge that inserts in to an RDX removable
    (USB) disk docking station (#1103 or #EU03). RDX drives are compatible with docking
    stations, which are installed internally in POWER8, POWER9, and Power10 processor-based
    servers, where applicable.


    Figure 1-12 shows the IBM System Storage 7226 Multi-Media Enclosure.


    ![](img/7c8373945565ba432037f60bbf8458eb_53_0.png)


    The IBM System Storage 7226 Multi-Media Enclosure offers a customer-replaceable
    unit (CRU) maintenance service to help make the installation or replacement of
    new drives efficient. Other 7226 components also are designed for CRU maintenance.


    The IBM System Storage 7226 Multi-Media Enclosure is compatible with most POWER8,
    POWER9, and Power10 processor-based systems that offer current level AIX, IBM
    i, and Linux operating systems.


    > Unsupported: IBM i does not support 7226 USB devices.


    For a complete list of host software versions and release levels that support
    the IBM System Storage 7226 Multi-Media Enclosure, see System Storage Interoperation
    Center (SSIC).


    > Note: Any of the existing 7216-1U2, 7216-1U3, and 7214-1U2 multimedia drawers
    are also supported.


    # Flat panel display options


    The IBM 7316 Model TF5 is a rack-mountable flat panel console kit that can also
    be configured with the tray pulled forward and the monitor folded up, which provides
    full viewing and keying capability for the HMC operator.


    The Model TF5 is a follow-on product to the Model TF4 and offers the following
    features:


    +   ► A slim, sleek, and lightweight monitor design that occupies only 1U (1.75
    in.) in a 19-inch standard rack

    +   ► A 18.5-inch (409.8 mm x 230.4 mm) flat panel TFT monitor with truly accurate
    images and virtually no distortion'
  - '[PAGE 54]


    +   ► The ability to mount the IBM Travel Keyboard in the 7316-TF5 rack keyboard
    tray

    +   ► Support for the IBM 1x8 Rack Console Switch (#4283) IBM Keyboard/Video/Mouse
    (KVM) switches


    The #4283 is a 1x8 Console Switch that fits in the 1U space behind the TF5 It
    is a CAT5-based switch. It contains eight analog rack interface (ARI) ports for
    connecting PS/2 or USB console switch cables. It supports chaining of servers
    that use an IBM Conversion Options switch cable (#4269). This feature provides
    four cables that connect a KVM switch to a system, or can be used in a daisy-chain
    scenario to connect up to 128 systems to a single KVM switch. It also supports
    server-side USB attachments


    # 1.7.7 Original equipment manufacturer racks


    The system can be installed in a suitable OEM rack if that the rack conforms to
    the EIA-310-D standard for 19-inch racks. This standard is published by the Electrical
    Industries Alliance. For more information, see IBM Documentation.


    The IBM Documentation provides the general rack specifications, including the
    following information:


    +   ► The rack or cabinet must meet the EIA Standard EIA-310-D for 19-inch racks
    that was published August 24, 1992. The EIA-310-D standard specifies internal
    dimensions, for example, the width of the rack opening (width of the chassis),
    the width of the module mounting flanges, and the mounting hole spacing.

    +   ► The front rack opening must be a minimum of 450 mm (17.72 in.) wide, and
    the rail-mounting holes must be 465 mm plus or minus 1.6 mm (18.3 in. plus or
    minus 0.06 in.) apart on center (horizontal width between vertical columns of
    holes on the two front-mounting flanges and on the two rear-mounting flanges).


    Figure 1-13 is a top view showing the rack specification dimensions.


    ![](img/7c8373945565ba432037f60bbf8458eb_54_0.png)


    Figure 1-13 Rack specifications (top-down view)


    +   ► The vertical distance between mounting holes must consist of sets of three
    holes that are spaced (from bottom to top) 15.9 mm (0.625 in.), 15.9 mm (0.625
    in.), and 12.7 mm (0.5 in.) on center, which makes each three-hole set of vertical
    hole spacing 44.45 mm (1.75 in.) apart on center.'

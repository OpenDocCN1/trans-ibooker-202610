    (half-height) adapter slots for external connectivity and 4 Non-Volatile Memory
    Express (NVMe) mainstream Solid State Drives (SSDs) of form factor U.2. for internal
    storage.


    Six of the eight external PCIe slots can be used for PCIe Gen 4 x16 or PCIe Gen
    5 x8 adapters and the remaining two offer PCIe Gen 5 x8 capability. All PCIe slots
    support earlier generations of the PCIe standard, such as PCIe Gen 1 (PCIe 1.0),
    PCIe Gen 2 (PCIe 2.0), PCIe Gen 3 (PCIe 3.0), and PCIe Gen 4 (PCIe 4.0).


    For extra connectivity, up to four 19-inch PCIe Gen 3 4U high I/O expansion units
    (#EMX0) optionally can be attached to one system node. Each expansion drawer contains
    one or two PCIe Fanout Modules (#EMXH) with six PCIe Gen 3 full-length, full-height
    slots each.


    A fully configured 4-node Power E1080 server offers a total of 32 internal PCIe
    slots and up to 192 PCIe slots through I/O expansion units.



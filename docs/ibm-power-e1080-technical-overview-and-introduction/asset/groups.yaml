  - '[PAGE 47]


    # 1.7 System racks


    The Power E1080 server fits a standard 19-inch rack. The server is certified and
    tested in the IBM Enterprise racks (7965-S42, 7014-T42, 7014-T00, or 7965-94Y).
    Customers can choose to place the server in other racks if they are confident
    that those racks have the strength, rigidity, depth, and hole pattern characteristics
    that are needed. Contact IBM Support to determine whether other racks are suitable.


    > **Order information:** It is highly recommended that you order the Power E1080
    server with an IBM 42U enterprise rack 7965-S42 feature. This rack provides a
    more complete and higher quality environment for IBM Manufacturing system assembly
    and testing, and provides a complete package.


    If a system is installed in a rack or cabinet that is not from IBM, ensure that
    the rack meets the requirements that are described in 1.7.7, “Original equipment
    manufacturer racks” on page 41.


    > **Responsibility:** The customer is responsible for ensuring the installation
    of the drawer in the preferred rack or cabinet results in a configuration that
    is stable, serviceable, safe, and compatible with the drawer requirements for
    power, cooling, cable management, weight, and rail security.


    # 1.7.1 New rack considerations


    Consider the following points when racks are ordered:


    +   - The new IBM Enterprise 42U Slim Rack 7965-S42 offers 42 EIA units (U) of
    space in a slim footprint.

    +   - The 7014-T42, 7014-T00, and 7965-94Y racks are no longer available to purchase
    with a Power E1080 server. Installing a Power E1080 server in these racks is still
    supported.


    > **Vertical PDUs:** All PDUs that are installed in a rack that contains a Power
    E1080 server must be installed horizontally to allow for cable routing in the
    sides of the rack.


    # 1.7.2 IBM Enterprise 42U Slim Rack 7965-S42


    The 2.0-meter (79-inch) Model 7965-S42 is compatible with past and present IBM
    Power servers and provides an excellent 19-inch rack enclosure for your data center.
    Its 600 mm (23.6 in.) width combined with its 1100 mm (43.3 in.) depth plus its
    42 EIA enclosure capacity provides great footprint efficiency for your systems.
    It can be placed easily on standard 24-inch floor tiles.


    Compared to the 7965-94Y Slim Rack, the Enterprise Slim Rack provides extra strength
    and shipping and installation flexibility.


    The 7965-S42 rack includes space for up to four PDUs in side pockets. Extra PDUs
    beyond four are mounted horizontally and each uses 1U of rack space.


    The Enterprise Slim Rack front door, which can be Basic Black/Flat (#ECRM) or
    High-End appearance (#ECRT) has perforated steel, which provides ventilation,
    physical security, and visibility of indicator lights in the installed equipment
    within.'
  - '[PAGE 48]


    Standard is a lock that is identical to the locks in the rear doors. The door
    (#ECRG) can be hinged on the left or right side.


    In addition to the #ECRT door, you can order the #ECRF high-end appearance door
    (Figure 1-11)


    ![](img/7c8373945565ba432037f60bbf8458eb_48_0.png)


    Figure 1-11 The #ECRF and the #ECRT rack doors.


    Orientation: #ECRT must not be flipped because the IBM logo would be upside down.


    # 1.7.3 AC power distribution unit and rack content


    The Power E1080 servers that are integrated into a rack at the factory feature
    PDUs that are mounted horizontally in the rack. Each PDU takes 1U of space in
    the rack. Mounting the PDUs vertically in the side of the rack can cause cable
    routing issues and interfere with optimal service access.


    Two possible PDU ratings are supported: 60A/63A (orderable in most countries)
    and 30A/32A. Consider the following points:


    +   The 60A/63A PDU supports four system node power supplies and one I/O expansion
    drawer or eight I/O expansion drawers.

    +   The 30A/32A PDU supports two system node power supplies and one I/O expansion
    drawer or four I/O expansion drawers.'
  - '[PAGE 49]


    Rack-integrated system orders require at least two of #7109, #7188, or #7196.


    High-function PDUs provide more electrical power per PDU and offer better “PDU
    footprint” efficiency. In addition, they are intelligent PDUs that provide insight
    to power usage by receptacle and remote power on and off capability for easier
    support by individual receptacle. The new PDUs are orderable as #ECJJ, #ECJL,
    #ECJN, and #ECJQ.


    High-function PDU FCs are listed in Table 1-20.


    # Table 1-20 Available high-function PDUs


    | PDUs | 1-phase or 3-phase depending on country wiring standards | 3-phase 208
    V depending on country wiring standards |

    | Nine C19 receptacles | ECJJ | ECJL |

    | Twelve C13 receptacles | ECJN | ECJQ |


    In addition, the following high-function PDUs are available:


    +   - High Function 9xC19 PDU plus (#ECJJ)

    +     This intelligent, switched 200-240 volt AC PDU includes nine C19 receptacles
    on the front of the PDU. The PDU is mounted on the rear of the rack, which makes
    the nine C19 receptacles easily accessible.

    +   - High Function 9xC19 PDU plus 3-Phase (#ECJL)

    +     This intelligent, switched 208 volt 3-phase AC PDU includes nine C19 receptacles
    on the front of the PDU. The PDU is mounted on the rear of the rack, which makes
    the nine C19 receptacles easily accessible.

    +   - High Function 12xC13 PDU plus (#ECJN)

    +     This intelligent, switched 200-240 volt AC PDU includes 12 C13 receptacles
    on the front of the PDU. The PDU is mounted on the rear of the rack, which makes
    the 12 C13 receptacles easily accessible.

    +   - High Function 12xC13 PDU plus 3-Phase (#ECJQ)

    +     This intelligent, switched 208 volt 3-phase AC PDU includes 12 C13 receptacles
    on the front of the PDU. The PDU is mounted on the rear of the rack, which makes
    the 12 C13 receptacles easily accessible.


    Two or more additional PDUs can be installed horizontally in the rear of the rack.
    Mounting PDUs horizontally uses 1U per PDU and reduces the space that is available
    for other racked components. When mounting PDUs horizontally, the preferred approach
    is to use fillers in the EIA units that are occupied by these PDUs to facilitate
    proper air-flow and ventilation in the rack.


    Each PDU requires one PDU-to-wall power cord. Various power cord features are
    available for various countries and applications by varying the PDU-to-wall power
    cord, which must be ordered separately.


    Each power cord provides the unique design characteristics for the specific power
    requirements. To match new power requirements and save previous investments, these
    power cords can be requested with an initial order of the rack or with a later
    upgrade of the rack features.'

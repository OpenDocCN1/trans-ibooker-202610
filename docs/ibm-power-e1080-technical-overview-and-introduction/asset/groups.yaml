  - '[PAGE 155]


    The virtual I/O adapters (a virtual SCSI server adapter and a virtual SCSI client
    adapter) are configured by using an HMC. The virtual SCSI server (target) adapter
    is responsible for running any SCSI commands that it receives, and is owned by
    the VIOS partition. The virtual SCSI client adapter allows a client partition
    to access physical SCSI and SAN-attached devices and LUNs that are mapped to be
    used by the client partitions. The provisioning of virtual disk resources is provided
    by the VIOS.


    # N_Port ID Virtualization


    N_Port ID Virtualization (NPIV) is a technology that allows multiple LPARs to
    access one or more external physical storage devices through the same physical
    Fibre Channel adapter. This adapter is attached to a VIOS partition that acts
    only as a pass-through that manages the data transfer through the Power Hypervisor.


    Each partition features one or more virtual Fibre Channel adapters, each with
    their own pair of unique worldwide port names. This configuration enables you
    to connect each partition to independent physical storage on a SAN. Unlike virtual
    SCSI, only the client partitions see the disk.


    For more information and requirements for NPIV, see *IBM PowerVM Virtualization
    Managing and Monitoring*, SG24-7590.


    # 3.1.4 Live Partition Mobility


    LPM allows you to move a running LPAR from one system to another without disruption.
    Inactive partition mobility allows you to move a powered-off LPAR from one system
    to another one.


    LPM provides systems management flexibility and improves system availability by
    avoiding the following situations:


    +   - Planned outages for hardware upgrade or firmware maintenance.

    +   - Unplanned downtime. With preventive failure management, if a server indicates
    a potential failure, you can move its LPARs to another server before the failure
    occurs.


    For more information and requirements for LPM, see *IBM PowerVM Live Partition
    Mobility*, SG24-7460.


    HMCV10R1 and VIOS 3.1.3 or later provide the following enhancements to the Live
    Partition Mobility Feature:


    +   - Automatically choose fastest network for LPM memory transfer

    +   - Allow LPM when a virtual optical device is assigned to a partition


    # 3.1.5 Active Memory Expansion


    Active Memory Expansion (AME) is an optional feature code (#EM8F) that belongs
    to the technologies under the PowerVM umbrella and enables memory expansion on
    the system.


    AME is an innovative technology that supports the AIX operating system. It helps
    enable the effective maximum memory capacity to be larger than the true physical
    memory maximum. Compression and decompression of memory content can enable memory
    expansion up to 100% or more. This expansion can enable a partition to complete
    significantly more work or support more users with the same physical amount of
    memory. Similarly, it can enable a server to run more partitions and do more work
    for the same physical amount of memory.'
  - '[PAGE 156]


    AME uses CPU resources to compress and decompress the memory contents. The trade-off
    of memory capacity for processor cycles can be an excellent choice, but the degree
    of expansion varies about how compressible the memory content is. It also depends
    on having adequate spare CPU capacity available for this compression and decompression.


    The Power E1080 includes a hardware accelerator that is designed to boost AME
    efficiency and uses less processor core resources. Each AIX partition can turn
    on or turn off AME. Control parameters set the amount of expansion that is wanted
    in each partition to help control the amount of CPU used by the AME function.


    An IPL is required for the specific partition that is turning memory expansion.
    When enabled, monitoring capabilities are available in standard AIX performance
    tools, such as `lparstat`, `vmstat`, `topas`, and `svmon`.


    A planning tool is included with AIX, which enables you to sample workloads and
    estimate how expandable the partition''s memory is and much CPU resource is needed.
    The feature can be ordered with the initial order of the Power E1080 or as an
    MES order. A software key is provided when the enablement feature is ordered,
    which is applied to the system node. An IPL is not required to enable the system
    node. The key is specific to an individual system and is permanent. It cannot
    be moved to a different server.


    > **Note:** IBM i does not support AME.


    # 3.1.6 Remote Restart


    Remote Restart is a high availability option for partitions. If an error occurs
    that causes a server outage, a partition that is configured for Remote Restart
    can be restarted on a different physical server. At times, it might take longer
    to start the server, in which case the Remote Restart function can be used for
    faster reprovisioning of the partition. Typically, this can be done faster than
    restarting the server that stopped and then restarting the partitions. The Remote
    Restart function relies on technology that is similar to LPM where a partition
    is configured with storage on a SAN that is shared (accessible) by the server
    that hosts the partition.


    HMC V10R1 provides an enhancement to the Remote Restart Feature that enables remote
    restart when a virtual optical device is assigned to a partition.


    # 3.1.7 POWER processor modes


    Although they are not virtualization features, the POWER processor modes are described
    here because they affect various virtualization features.


    On Power servers, partitions can be configured to run in several modes, including
    the following modes:


    +   ► POWER8

    +   This native mode for POWER8 processors implements Version 2.07 of the IBM
    Power ISA. For more information, see IBM documentation.


    +   ► POWER9

    +   This native mode for POWER9 processors implements Version 3.0 of the IBM Power
    ISA. For more information, see IBM documentation.'
  - '[PAGE 157]


    # POWER10


    This native mode for Power10 processors implements Version 3.1 of the IBM Power
    ISA. For more information, see IBM documentation.


    Figure 3-2 shows the available processor modes on a Power E1080.


    ![](img/7c8373945565ba432037f60bbf8458eb_157_0.png)


    Figure 3-2 Processor modes


    Processor compatibility mode is important when LPM migration is planned between
    different generation of servers. An LPAR that might be migrated to a machine that
    is managed by a processor from another generation must be activated in a specific
    compatibility mode.


    Note: Migrating a LPAR from a POWER7 processor-based server to Power E1080 by
    using LPM is not supported; however, the following steps can be completed to accomplish
    this task:


    +   1. Migrate LPAR from POWER7 processor-based server to POWER9 processor-based
    server using LPM.

    +   2. Migrate then the LPAR from POWER9 processor-based server to Power E1080.


    # 3.1.8 Single Root I/O Virtualization


    Single Root I/O Virtualization (SR-IOV) is an extension to the Peripheral Component
    Interconnect Express (PCIe) specification that allows multiple operating systems
    to simultaneously share a PCIe adapter with little or no runtime involvement from
    a hypervisor or other virtualization intermediary.'
  - '[PAGE 158]


    SR-IOV is PCI standard architecture that enables PCIe adapters to become self-virtualizing.
    It enables adapter consolidation through sharing, much like logical partitioning
    enables server consolidation. With an adapter capable of SR-IOV, you can assign
    virtual slices of a single physical adapter to multiple partitions through logical
    ports; all of this is done without a VIOS.


    # 3.1.9 More information about virtualization features


    The following IBM Redbooks publications provide more information about the virtualization
    features:


    +   - IBM PowerVM Best Practices, SG24-8062

    +   - IBM PowerVM Virtualization Introduction and Configuration, SG24-7940

    +   - IBM PowerVM Virtualization Managing and Monitoring, SG24-7590

    +   - IBM Power Systems SR-IOV: Technical Overview and Introduction, REDP-5065


    # 3.2 IBM PowerVC overview


    IBM Power Virtualization Center (PowerVC) is an advanced virtualization and cloud
    management offering (which is built on OpenStack) that provides simplified virtualization
    management and cloud deployments for IBM AIX, IBM i, and Linux VMs running on
    IBM Power Systems. PowerVC is designed to improve administrator productivity and
    simplify the cloud management of VMs on Power Systems servers.


    By using PowerVC, you can perform the following tasks:


    +   - Create VMs and resize the VMs CPU and memory.

    +   - Attach disk volumes or other networks to those VMs.

    +   - Import VMs and volumes so that they can be managed by IBM PowerVC.

    +   - Monitor the use of resources in your environment.

    +   - Take snapshots of or cone a VM.

    +   - Migrate VMs while they are running (live migration between physical servers).

    +   - Remote restart VMs in case of a server failure.

    +   - Use advanced storage technologies, such as VDisk mirroring or IBM Global
    mirror.

    +   - Improve resource usage to reduce capital expense and power consumption.

    +   - Increase agility and execution to respond quickly to changing business requirements.

    +   - Increase IT productivity and responsiveness.

    +   - Simplify Power Systems virtualization management.

    +   - Accelerate repeatable, error-free virtualization deployments.


    IBM PowerVC can manage AIX, IBM i, and Linux-based VMs that are running under
    PowerVM virtualization that are connected to an HMC or by using NovaLink. This
    release supports the scale-out and the enterprise Power Systems servers that are
    built on IBM POWER8, IBM POWER9, and subsequent technologies.


    # 3.2.1 IBM PowerVC functions and advantages


    Why IBM PowerVC? Why do you need another virtualization management offering? When
    more than 70% of IT budgets are spent on operations and maintenance, IT customers
    legitimately expect vendors to focus their new development efforts to reduce IT
    costs and foster innovation within IT departments.'
  md: "\nThe virtual I/O adapters (a virtual SCSI server adapter and a virtual SCSI\
    \ client adapter) are configured by using an HMC. The virtual SCSI server (target)\
    \ adapter is responsible for running any SCSI commands that it receives, and is\
    \ owned by the VIOS partition. The virtual SCSI client adapter allows a client\
    \ partition to access physical SCSI and SAN-attached devices and LUNs that are\
    \ mapped to be used by the client partitions. The provisioning of virtual disk\
    \ resources is provided by the VIOS.\n\n## N_Port ID Virtualization\n\nN_Port\
    \ ID Virtualization (NPIV) is a technology that allows multiple LPARs to access\
    \ one or more external physical storage devices through the same physical Fibre\
    \ Channel adapter. This adapter is attached to a VIOS partition that acts only\
    \ as a pass-through that manages the data transfer through the Power Hypervisor.\n\
    \nEach partition features one or more virtual Fibre Channel adapters, each with\
    \ their own pair of unique worldwide port names. This configuration enables you\
    \ to connect each partition to independent physical storage on a SAN. Unlike virtual\
    \ SCSI, only the client partitions see the disk.\n\nFor more information and requirements\
    \ for NPIV, see *IBM PowerVM Virtualization Managing and Monitoring*, SG24-7590.\n\
    \n## 3.1.4 Live Partition Mobility\n\nLPM allows you to move a running LPAR from\
    \ one system to another without disruption. Inactive partition mobility allows\
    \ you to move a powered-off LPAR from one system to another one.\n\nLPM provides\
    \ systems management flexibility and improves system availability by avoiding\
    \ the following situations:\n\n- Planned outages for hardware upgrade or firmware\
    \ maintenance.\n- Unplanned downtime. With preventive failure management, if a\
    \ server indicates a potential failure, you can move its LPARs to another server\
    \ before the failure occurs.\n\nFor more information and requirements for LPM,\
    \ see *IBM PowerVM Live Partition Mobility*, SG24-7460.\n\nHMCV10R1 and VIOS 3.1.3\
    \ or later provide the following enhancements to the Live Partition Mobility Feature:\n\
    \n- Automatically choose fastest network for LPM memory transfer\n- Allow LPM\
    \ when a virtual optical device is assigned to a partition\n\n## 3.1.5 Active\
    \ Memory Expansion\n\nActive Memory Expansion (AME) is an optional feature code\
    \ (#EM8F) that belongs to the technologies under the PowerVM umbrella and enables\
    \ memory expansion on the system.\n\nAME is an innovative technology that supports\
    \ the AIX operating system. It helps enable the effective maximum memory capacity\
    \ to be larger than the true physical memory maximum. Compression and decompression\
    \ of memory content can enable memory expansion up to 100% or more. This expansion\
    \ can enable a partition to complete significantly more work or support more users\
    \ with the same physical amount of memory. Similarly, it can enable a server to\
    \ run more partitions and do more work for the same physical amount of memory.\n\
    \nAME uses CPU resources to compress and decompress the memory contents. The trade-off\
    \ of memory capacity for processor cycles can be an excellent choice, but the\
    \ degree of expansion varies about how compressible the memory content is. It\
    \ also depends on having adequate spare CPU capacity available for this compression\
    \ and decompression.\n\nThe Power E1080 includes a hardware accelerator that is\
    \ designed to boost AME efficiency and uses less processor core resources. Each\
    \ AIX partition can turn on or turn off AME. Control parameters set the amount\
    \ of expansion that is wanted in each partition to help control the amount of\
    \ CPU used by the AME function.\n\nAn IPL is required for the specific partition\
    \ that is turning memory expansion. When enabled, monitoring capabilities are\
    \ available in standard AIX performance tools, such as `lparstat`, `vmstat`, `topas`,\
    \ and `svmon`.\n\nA planning tool is included with AIX, which enables you to sample\
    \ workloads and estimate how expandable the partition's memory is and much CPU\
    \ resource is needed. The feature can be ordered with the initial order of the\
    \ Power E1080 or as an MES order. A software key is provided when the enablement\
    \ feature is ordered, which is applied to the system node. An IPL is not required\
    \ to enable the system node. The key is specific to an individual system and is\
    \ permanent. It cannot be moved to a different server.\n\n> **Note:** IBM i does\
    \ not support AME.\n\n## 3.1.6 Remote Restart\n\nRemote Restart is a high availability\
    \ option for partitions. If an error occurs that causes a server outage, a partition\
    \ that is configured for Remote Restart can be restarted on a different physical\
    \ server. At times, it might take longer to start the server, in which case the\
    \ Remote Restart function can be used for faster reprovisioning of the partition.\
    \ Typically, this can be done faster than restarting the server that stopped and\
    \ then restarting the partitions. The Remote Restart function relies on technology\
    \ that is similar to LPM where a partition is configured with storage on a SAN\
    \ that is shared (accessible) by the server that hosts the partition.\n\nHMC V10R1\
    \ provides an enhancement to the Remote Restart Feature that enables remote restart\
    \ when a virtual optical device is assigned to a partition.\n\n## 3.1.7 POWER\
    \ processor modes\n\nAlthough they are not virtualization features, the POWER\
    \ processor modes are described here because they affect various virtualization\
    \ features.\n\nOn Power servers, partitions can be configured to run in several\
    \ modes, including the following modes:\n\n- POWER8\n  This native mode for POWER8\
    \ processors implements Version 2.07 of the IBM Power ISA. For more information,\
    \ see IBM documentation.\n\n- POWER9\n  This native mode for POWER9 processors\
    \ implements Version 3.0 of the IBM Power ISA. For more information, see IBM documentation.\n\
    \n## POWER10\n\nThis native mode for Power10 processors implements Version 3.1\
    \ of the IBM Power ISA. For more information, see IBM documentation.\n\nFigure\
    \ 3-2 shows the available processor modes on a Power E1080.\n\n![](img/7c8373945565ba432037f60bbf8458eb_157_0.png)\n\
    \nFigure 3-2 Processor modes\n\nProcessor compatibility mode is important when\
    \ LPM migration is planned between different generation of servers. An LPAR that\
    \ might be migrated to a machine that is managed by a processor from another generation\
    \ must be activated in a specific compatibility mode.\n\nNote: Migrating a LPAR\
    \ from a POWER7 processor-based server to Power E1080 by using LPM is not supported;\
    \ however, the following steps can be completed to accomplish this task:\n\n-\
    \ 1. Migrate LPAR from POWER7 processor-based server to POWER9 processor-based\
    \ server using LPM.\n- 2. Migrate then the LPAR from POWER9 processor-based server\
    \ to Power E1080.\n\n## 3.1.8 Single Root I/O Virtualization\n\nSingle Root I/O\
    \ Virtualization (SR-IOV) is an extension to the Peripheral Component Interconnect\
    \ Express (PCIe) specification that allows multiple operating systems to simultaneously\
    \ share a PCIe adapter with little or no runtime involvement from a hypervisor\
    \ or other virtualization intermediary.\n\nSR-IOV is PCI standard architecture\
    \ that enables PCIe adapters to become self-virtualizing. It enables adapter consolidation\
    \ through sharing, much like logical partitioning enables server consolidation.\
    \ With an adapter capable of SR-IOV, you can assign virtual slices of a single\
    \ physical adapter to multiple partitions through logical ports; all of this is\
    \ done without a VIOS.\n\n## 3.1.9 More information about virtualization features\n\
    \nThe following IBM Redbooks publications provide more information about the virtualization\
    \ features:\n\n- IBM PowerVM Best Practices, SG24-8062\n- IBM PowerVM Virtualization\
    \ Introduction and Configuration, SG24-7940\n- IBM PowerVM Virtualization Managing\
    \ and Monitoring, SG24-7590\n- IBM Power Systems SR-IOV: Technical Overview and\
    \ Introduction, REDP-5065\n\n## 3.2 IBM PowerVC overview\n\nIBM Power Virtualization\
    \ Center (PowerVC) is an advanced virtualization and cloud management offering\
    \ (which is built on OpenStack) that provides simplified virtualization management\
    \ and cloud deployments for IBM AIX, IBM i, and Linux VMs running on IBM Power\
    \ Systems. PowerVC is designed to improve administrator productivity and simplify\
    \ the cloud management of VMs on Power Systems servers.\n\nBy using PowerVC, you\
    \ can perform the following tasks:\n\n- Create VMs and resize the VMs CPU and\
    \ memory.\n- Attach disk volumes or other networks to those VMs.\n- Import VMs\
    \ and volumes so that they can be managed by IBM PowerVC.\n- Monitor the use of\
    \ resources in your environment.\n- Take snapshots of or cone a VM.\n- Migrate\
    \ VMs while they are running (live migration between physical servers).\n- Remote\
    \ restart VMs in case of a server failure.\n- Use advanced storage technologies,\
    \ such as VDisk mirroring or IBM Global mirror.\n- Improve resource usage to reduce\
    \ capital expense and power consumption.\n- Increase agility and execution to\
    \ respond quickly to changing business requirements.\n- Increase IT productivity\
    \ and responsiveness.\n- Simplify Power Systems virtualization management.\n-\
    \ Accelerate repeatable, error-free virtualization deployments.\n\nIBM PowerVC\
    \ can manage AIX, IBM i, and Linux-based VMs that are running under PowerVM virtualization\
    \ that are connected to an HMC or by using NovaLink. This release supports the\
    \ scale-out and the enterprise Power Systems servers that are built on IBM POWER8,\
    \ IBM POWER9, and subsequent technologies.\n\n## 3.2.1 IBM PowerVC functions and\
    \ advantages\n\nWhy IBM PowerVC? Why do you need another virtualization management\
    \ offering? When more than 70% of IT budgets are spent on operations and maintenance,\
    \ IT customers legitimately expect vendors to focus their new development efforts\
    \ to reduce IT costs and foster innovation within IT departments.\n"
  mdcn: "\n\n虚拟 I/O 适配器（虚拟 SCSI 服务器适配器和虚拟 SCSI 客户端适配器）是通过 HMC 进行配置的。虚拟 SCSI 服务器（目标）适配器负责运行其收到的任何\
    \ SCSI 命令，并由 VIOS 分区拥有。虚拟 SCSI 客户端适配器允许客户端分区访问映射供客户端分区使用的物理 SCSI 和 SAN 连接的设备和\
    \ LUN。虚拟磁盘资源的供应由 VIOS 提供。\n\n## N_Port ID 虚拟化\n\nN_Port ID 虚拟化（NPIV）是一种技术，允许多个\
    \ LPAR 通过同一个物理光纤通道适配器访问一个或多个外部物理存储设备。该适配器连接到一个 VIOS 分区，该分区仅作为直通使用，管理通过 Power Hypervisor\
    \ 的数据传输。\n\n每个分区都具有一个或多个虚拟光纤通道适配器，每个适配器都有自己的一对唯一的全球端口名称。此配置使您能够将每个分区连接到 SAN 上的独立物理存储。与虚拟\
    \ SCSI 不同，只有客户端分区可以看到磁盘。\n\n有关 NPIV 的更多信息和要求，请参阅 *IBM PowerVM Virtualization Managing\
    \ and Monitoring*，SG24-7590。\n\n## 3.1.4 Live Partition Mobility\n\nLPM 允许您在不中断的情况下将正在运行的\
    \ LPAR 从一个系统移动到另一个系统。非活动分区迁移允许您将已关闭电源的 LPAR 从一个系统移动到另一个系统。\n\nLPM 提供了系统管理灵活性，并通过避免以下情况提高了系统可用性：\n\
    \n- 硬件升级或固件维护的计划停机。\n- 非计划停机时间。通过预防性故障管理，如果服务器指示潜在故障，您可以在故障发生前将其 LPAR 迁移到另一台服务器。\n\
    \n有关 LPM 的更多信息和要求，请参阅 *IBM PowerVM Live Partition Mobility*，SG24-7460。\n\nHMCV10R1\
    \ 和 VIOS 3.1.3 或更高版本为 Live Partition Mobility 功能提供了以下增强功能：\n\n- 自动选择最快的网络用于 LPM\
    \ 内存传输\n- 允许在虚拟光学设备分配给分区时进行 LPM\n\n## 3.1.5 Active Memory Expansion\n\nActive\
    \ Memory Expansion（AME）是一个可选功能代码（#EM8F），属于 PowerVM 伞下的技术，使系统能够进行内存扩展。\n\nAME 是一种创新技术，支持\
    \ AIX 操作系统。它有助于使有效最大内存容量大于真实物理内存最大值。内存内容的压缩和解压缩可以使内存扩展高达 100% 或更多。此扩展可以使分区在相同的物理内存量下完成更多工作或支持更多用户。同样，它可以使服务器在相同的物理内存量下运行更多分区并完成更多工作。\n\
    \nAME 使用 CPU 资源来压缩和解压缩内存内容。以内存容量换取处理器周期的权衡可能是一个极佳的选择，但扩展程度取决于内存内容的可压缩性如何。它还取决于是否有足够的空闲\
    \ CPU 容量用于此压缩和解压缩。\n\nPower E1080 包含一个硬件加速器，旨在提高 AME 效率并使用更少的处理器核心资源。每个 AIX 分区都可以打开或关闭\
    \ AME。控制参数设置每个分区想要的扩展量，以帮助控制 AME 功能使用的 CPU 量。\n\n需要对正在打开内存扩展的特定分区进行 IPL。启用后，标准\
    \ AIX 性能工具中提供监控功能，例如 `lparstat`、`vmstat`、`topas` 和 `svmon`。\n\nAIX 中包含了一个规划工具，可让您采样工作负载并估计分区的内存可扩展性以及需要多少\
    \ CPU 资源。该功能可以与 Power E1080 的初始订单一起订购，也可以作为 MES 订单订购。当启用功能被订购时，会提供一个软件密钥，该密钥应用于系统节点。启用系统节点不需要\
    \ IPL。密钥特定于单个系统并且是永久性的。不能将其移动到不同的服务器。\n\n> **注意：** IBM i 不支持 AME。\n\n## 3.1.6\
    \ Remote Restart\n\nRemote Restart 是分区的<|message|> 可用性选项。如果发生导致服务器停机的错误，已配置为 Remote\
    \ Restart 的分区可以在不同的物理服务器上重新启动。有时，启动服务器可能需要更长时间，在这种情况下，可以使用 Remote Restart 功能来更快地重新配置分区。通常，这比重新启动已停止的服务器然后重新启动分区更快。Remote\
    \ Restart 功能依赖于类似于 LPM 的技术，其中分区配置为在 SAN 上使用存储，该存储可被托管分区的服务器共享（访问）。\n\nHMC V10R1\
    \ 为 Remote Restart 功能提供了增强功能，允许在虚拟光学设备分配给分区时进行远程重启。\n\n## 3.1.7 POWER 处理器模式\n\n\
    尽管它们不是虚拟化功能，但 POWER 处理器模式在此描述，因为它们会影响各种虚拟化功能。\n\n在 Power 服务器上，分区可以配置为在多种模式下运行，包括以下模式：\n\
    \n- POWER8\n  POWER8 处理器的原生模式，实现 IBM Power ISA 的 2.07 版。有关更多信息，请参阅 IBM 文档。\n\n\
    - POWER9\n  POWER9 处理器的原生模式，实现 IBM Power ISA 的 3.0 版。有关更多信息，请参阅 IBM 文档。\n\n##\
    \ POWER10\n\nPower10 处理器的原生模式，实现 IBM Power ISA 的 3.1 版。有关更多信息，请参阅 IBM 文档。\n\n\
    图 3-2 显示了 Power E1080 上的可用处理器模式。\n\n![](img/7c8373945565ba432037f60bbf8458eb_157_0.png)\n\
    \n图 3-2 处理器模式\n\n处理器兼容模式在计划在不同代服务器之间进行 LPM 迁移时非常重要。可能迁移到由另一代处理器管理的机器的 LPAR 必须以特定的兼容模式激活。\n\
    \n注意：使用 LPM 将 LPAR 从基于 POWER7 处理器的服务器迁移到 Power E1080 不受支持；但是，可以完成以下步骤来完成此任务：\n\
    \n- 1. 使用 LPM 将 LPAR 从基于 POWER7 处理器的服务器迁移到基于 POWER9 处理器的服务器。\n- 2. 然后将 LPAR 从基于\
    \ POWER9 处理器的服务器迁移到 Power E1080。\n\n## 3.1.8 Single Root I/O Virtualization\n\n\
    Single Root I/O Virtualization（SR-IOV）是 Peripheral Component Interconnect Express（PCIe）规范的扩展，允许多个操作系统同时共享一个\
    \ PCIe 适配器，而几乎不需要或不需要 hypervisor 或其他虚拟化中介的运行时参与。\n\nSR-IOV 是 PCI 标准架构，使 PCIe 适配器能够自我虚拟化。它通过共享实现适配器整合，就像逻辑分区实现服务器整合一样。借助支持\
    \ SR-IOV 的适配器，您可以通过逻辑端口将单个物理适配器的虚拟切片分配给多个分区；所有这些都不需要 VIOS。\n\n## 3.1.9 有关虚拟化功能的更多信息\n\
    \n以下 IBM Redbooks 出版物提供了有关虚拟化功能的更多信息：\n\n- IBM PowerVM Best Practices, SG24-8062\n\
    - IBM PowerVM Virtualization Introduction and Configuration, SG24-7940\n- IBM\
    \ PowerVM Virtualization Managing and Monitoring, SG24-7590\n- IBM Power Systems\
    \ SR-IOV: Technical Overview and Introduction, REDP-5065\n\n## 3.2 IBM PowerVC\
    \ 概述\n\nIBM Power Virtualization Center（PowerVC）是一个先进的虚拟化和云管理产品（基于 OpenStack 构建），为运行在\
    \ IBM Power Systems 上的 IBM AIX、IBM i 和 Linux 虚拟机提供简化的虚拟化管理和云部署。PowerVC 旨在提高管理员生产力并简化\
    \ Power Systems 服务器上虚拟机的云管理。\n\n通过使用 PowerVC，您可以执行以下任务：\n\n- 创建虚拟机并调整虚拟机的 CPU\
    \ 和内存大小。\n- 将磁盘卷或其他网络附加到这些虚拟机。\n- 导入虚拟机和卷以便由 IBM PowerVC 管理。\n- 监控环境中资源的使用情况。\n\
    - 对虚拟机进行快照或克隆。\n- 在虚拟机运行时迁移虚拟机（物理服务器之间的实时迁移）。\n- 在服务器故障时远程重启虚拟机。\n- 使用高级存储技术，例如\
    \ VDisk 镜像或 IBM Global mirror。\n- 提高资源使用率以降低资本支出和功耗。\n- 提高敏捷性和执行力以快速响应不断变化的业务需求。\n\
    - 提高 IT 生产力和响应能力。\n- 简化 Power Systems 虚拟化管理。\n- 加速可重复、无错误的虚拟化部署。\n\nIBM PowerVC\
    \ 可以管理通过 HMC 连接或使用 NovaLink 运行在 PowerVM 虚拟化下的 AIX、IBM i 和基于 Linux 的虚拟机。本版本支持基于\
    \ IBM POWER8、IBM POWER9 和后续技术的扩展和企业 Power Systems 服务器。\n\n## 3.2.1 IBM PowerVC\
    \ 功能和优势\n\n为什么选择 IBM PowerVC？为什么您需要另一个虚拟化管理产品？当超过 70% 的 IT 预算花费在运营和维护上时，IT 客户完全有理由期望供应商将新的开发工作重点放在降低\
    \ IT 成本和促进 IT 部门创新上。\n\n"

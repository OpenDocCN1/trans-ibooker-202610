  mdcn: '


    | 特性 | Power E980 服务器 | Power E1080 服务器 |

    |---|---|---|

    | 可靠性、可用性和可服务性 (RAS) | SMPᶜ 电缆并发维修 | 非活动 SMP 电缆，具有并发维护能力及 TDRᵈ 故障隔离 |

    | 安全且可信的启动 | 是 | 是 |


    +   a. CAPI 指定相干加速器处理器接口技术，OpenCAPI 指定开放相干加速器处理器接口技术。有关架构规范及周边系统的更多信息，请参阅此网页。

    +   b. NVMe 指定由 NVM Express 协会监督的非易失性内存 Express 接口规范：https://nvmexpress.org。

    +   c. SMP 指定对称多处理架构，用于将多个处理器实体构建成单片服务器。

    +   d. 时域反射测量 (TDR) 使服务器能够主动检测电缆中的故障并定位连接器中的不连续点。


    图 1-1 显示了一个安装在 IBM 机架中的 4 节点 Power E1080 服务器。每个系统节点由一组五个风扇冷却，风扇并排排列在一行中。冷却组件可通过机架的前门看到。


    ![](img/7c8373945565ba432037f60bbf8458eb_18_0.png)


    图 1-1 安装在 S42 机架并带 #ECRT 门的 Power E1080 4 节点服务器


    ## 1.1.4 系统容量和特性


    在任何初始订单中，Power E1080 支持多达四个系统节点。每个节点支持的最大内存容量为 4 TB。


    每个系统节点最多支持四个 PCIe Gen 3 I/O 扩展抽屉。每个 I/O 扩展抽屉可配备两个 Fanout 模块。每个 Fanout 模块反过来通过一个
    PCIe x16 到 CXP 转换卡连接到一个系统节点。


    内存特性 #EMC1 128 GB、#EMC2 256 GB、#EMC3 512 GB 和 #EMC4 1024 GB 可用。


    以下特性可用：


    - 最大 4 个 #EDN1 5U 系统节点抽屉

    - 每个节点抽屉最多 16 TB 系统内存

    - 最多 16 个 #EMX0 PCIe Gen 3 I/O 扩展抽屉

    - 最多 32 个 #EMXH PCIe Gen 3 6 槽 Fanout 模块用于 PCIe Gen 3 扩展抽屉

    - 最多 32 个 #EJ24 PCIe x16 到 CXP 转换卡


    ## 1.2 系统节点


    完整的 Power E1080 运行系统包括一个 SCU 和一个、两个、三个或四个系统节点。系统节点也称为中央电子复合体 (CEC) 或 CEC 抽屉。


    每个系统节点高 5U 机架单元，容纳四个风冷 Power10 单芯片模块 (SCM)，针对性能、可扩展性和 AI 工作负载进行了优化。SCM 由一个 Power10
    处理器芯片和更多逻辑、引脚和连接器构成，使 SCM 能够插入到系统节点平面上的相关插座中。


    Power E1080 Power10 SCM 有 10 核、12 核或 15 核容量可选。每个内核均可以八路同时多线程 (SMT) 模式运行，提供八个独立硬件线程的并行执行能力。


    10 核 SCM 采用处理器特性 #EDP2 以每系统节点四套的方式订购。这样，特性 #EDP2 为一个系统节点提供 40 个核心的处理能力，4 节点 Power
    E1080 服务器的总系统容量为 160 个核心。10 核 SCM 的最大频率为 3.9 GHz，使其成为入门级 Power E1080 服务器的理想构建模块。


    12 核 SCM 采用处理器特性 #EDP3 以每系统节点四套的方式订购。这样，特性 #EDP3 为每个系统节点提供 48 个核心容量，完全配置的 4 节点
    Power E1080 服务器最多可达 192 个核心。此 SCM 类型提供最高的处理频率，最高为 4.15 GHz，如果最高线程性能是最重要的设计目标之一，则是完美选择。


    15 核 SCM 采用处理器特性 #EDP4 以每系统节点四套的方式订购。这样，特性 #EDP4 为每个系统节点提供 60 个核心，4 节点 Power E1080
    的总系统容量令人印象深刻，达到 240 个核心。15 核 SCM 的最大运行频率为 4.0 GHz，满足对线程性能要求高且需要高计算容量密度的环境需求。


    注意：系统节点内的所有 Power10 SCM 必须为同一类型：10 核、12 核或 15 核。此外，特定 Power E1080 服务器内的所有系统节点必须配置一致，具有相同的处理器特性。


    每个 Power10 处理器芯片使用三个 PowerAXON¹ 18 位宽总线，在 CEC 抽屉内跨越一个全连接结构。这样，系统节点内的每个 SCM 都直接以
    32 Gbps 速度连接到同一抽屉的每个其他 SCM。此平面内互连提供 128 Gbps 芯片到芯片数据带宽，相对于 Power E980 系统中基于 POWER9
    处理器的平面内互连实现，增加了 33%。吞吐量可计算为 16 b 链路 * 32 gbps = 64 GBps 每方向 * 2 方向，总速率为 128 GBps。


    Power E1080 CEC 抽屉中的四个 Power10 处理器芯片中的每一个都直接连接到多节点系统中的每个其他 CEC 抽屉中相同位置的 Power10
    处理器芯片。此连接是通过使用每连接一条对称多处理 (SMP) PowerAXON 18 位宽总线以 32 Gbps 速度运行来实现的。


    Power10 SCM 在模块上直接提供八个 PowerAXON 连接器，其中六个用于将 SMP 总线路由到 CEC 机箱的后部尾架。这种创新实现允许使用无源
    SMP 电缆，从而降低数据传输延迟并增强抽屉到抽屉 SMP 互连的稳健性。如 1.2 节“系统节点”第 6 页所述，电缆特性 #EFCH、#EFCE、#EFCF
    和 #EFCG 需要将系统节点抽屉连接到系统控制单元。它们也需要在多节点 Power E1080 配置中促进每个抽屉之间的 SMP 互连。


    为了访问主内存，Power10 处理器技术引入了新的开放内存接口 (OMI)。16 个可用的高速 OMI 链路由 8 个片上内存控制器单元 (MCU) 驱动，提供每个
    SCM 高达 409 GBps 的总聚合带宽。此设计代表内存带宽相比基于 POWER9 处理器的技术能力增加了 78%。


    每个 Power10 OMI 链路直接连接到一个基于内存缓冲器的差分 DIMM (DDIMM) 插槽。因此，一个系统节点的四个插座提供总共 64 个 DDIMM
    插槽，聚合最大内存带宽为 1636 GBps。Power E1080 服务器支持的 DDIMM 密度为 32 GB、64 GB、128 GB 和 256 GB，均使用双倍数据速率
    4 (DDR4) 技术。


    Power E1080 内存选项作为 128 GB (#EMC1)、256 GB (#EMC2)、512 GB (#EMC3) 和 1024 GB (#EMC4)
    内存特性提供。每个内存特性提供四个 DDIMM。


    1 PowerAXON 代表 Power10 处理器的 A 总线/X 总线/OpenCAPI/网络接口。


    每个系统节点最多支持 16 个内存特性，覆盖 64 个 DDIMM 插槽。使用 1024 GB DDIMM 特性可实现每个节点最多 16 TB。2 节点系统的最大容量为
    32 TB。4 节点系统的最大容量为 64 TB。需要至少激活已安装容量的 50% 的内存。


    > 注意：Power10 处理器内存逻辑和 Power E1080 服务器的内存 I/O 子系统设计为支持 DDR4 DIMM，但也可以使用下一代 DDR5
    动态随机存取存储器技术。


    Power10 处理器 I/O 子系统由 32 GHz 差分 Peripheral Component Interconnect Express 5.0 (PCIe
    Gen 5) 总线驱动，提供 32 条通道，分成两组，每组 16 条通道。32 条 PCIe 通道为每个系统节点提供 576 GBps 的聚合带宽，用于支持
    8 个半长、低轮廓 (半高) 适配器插槽以实现外部连接，以及 4 个非易失性内存 Express (NVMe) 主流固态驱动器 (SSD)，采用 U.2 形式因子用于内部存储。


    八个外部 PCIe 插槽中的六个可用于 PCIe Gen 4 x16 或 PCIe Gen 5 x8 适配器，其余两个提供 PCIe Gen 5 x8 能力。所有
    PCIe 插槽均支持 PCIe 标准的早期版本，例如 PCIe Gen 1 (PCIe 1.0)、PCIe Gen 2 (PCIe 2.0)、PCIe Gen
    3 (PCIe 3.0) 和 PCIe Gen 4 (PCIe 4.0)。


    为了获得额外连接，最多可将四个 19 英寸 PCIe Gen 3 4U 高 I/O 扩展单元 (#EMX0) 可选地连接到一个系统节点。每个扩展抽屉包含一个或两个
    PCIe Fanout 模块 (#EMXH)，每个模块有六个 PCIe Gen 3 全长、全高插槽。


    完全配置的 4 节点 Power E1080 服务器提供总共 32 个内部 PCIe 插槽，以及通过 I/O 扩展单元最多 192 个 PCIe 插槽。


    图 1-2 显示了系统节点的前视图。风扇和电源单元 (PSU) 是冗余且可并发维护的。风扇为 n+1 冗余；因此，系统在任何一个风扇故障时仍能继续运行。由于电源为
    n+2 冗余，即使任何两个电源故障，系统仍能继续运行。



    that are used to detect erroneous hardware operations. Error-checking hardware
    ranges from parity error detection that is coupled with Processor Instruction
    Retry and bus try again, to ECC correction on caches and system buses.


    Within the processor or memory subsystem error checker, error-checker signals
    are captured and stored in hardware FIRs. The associated logic circuitry is used
    to limit the domain of an error to the first checker that encounters the error.

    # Enterprise solutions


    In this chapter, we describe the major pillars that can help enterprises achieve
    their business goals and the reasons on why Power E1080 provides a significant
    contribution to that end.


    This chapter includes the following topics:


    +   - 3.1, “PowerVM” on page 136

    +   - 3.2, “IBM PowerVC overview” on page 145

    +   - 3.3, “System automation with Ansible” on page 146

    +   - 3.4, “Protect trust from core to cloud” on page 149

    +   - 3.5, “Running artificial intelligence where operational data is stored”
    on page 152'
  - '[PAGE 149]


    # 3.1 PowerVM


    The PowerVM platform is the family of technologies, capabilities, and offerings
    that delivers industry-leading virtualization for enterprises. It is the umbrella
    branding term for Power processor-based server virtualization; that is, IBM POWER
    Hypervisor, logical partitioning, IBM Micro-Partitioning®, VIOS, Live Partition
    Mobility (LPM), and more. PowerVM is a combination of hardware enablement and
    software.


    > Note: PowerVM Enterprise Edition License Entitlement is included with each Power
    E1080 server. PowerVM Enterprise Edition is available as a hardware feature (#5228),
    supports up to 20 partitions per core, VIOS, multiple shared processor pools (MSPPs)
    and also offers LPM.


    # 3.1.1 IBM POWER Hypervisor


    Power processor-based servers are combined with PowerVM technology and offer the
    following key capabilities that can help to consolidate and simplify IT environments:


    +   ► Improve server usage and share I/O resources to reduce the total cost of
    ownership (TCO) and better use IT assets.

    +   ► Improve business responsiveness and operational speed by dynamically reallocating
    resources to applications as needed to better match changing business needs or
    handle unexpected changes in demand.

    +   ► Simplify IT infrastructure management by making workloads independent of
    hardware resources so that business-driven policies can be used to deliver resources
    that are based on time, cost, and service-level requirements.


    Combined with features in the Power E1080, the IBM POWER Hypervisor delivers functions
    that enable other system technologies, including logical partitioning (LPAR) technology,
    virtualized processors, IEEE virtual local area network (VLAN)-compatible virtual
    switch, virtual SCSI adapters, virtual Fibre Channel adapters, and virtual consoles.


    The POWER Hypervisor is a basic component of the system''s firmware and offers
    the following functions:


    +   ► Provides an abstraction between the physical hardware resources and the
    LPARs that use them.

    +   ► Enforces partition integrity by providing a security layer between LPARs.

    +   ► Controls the dispatch of virtual processors to physical processors.

    +   ► Saves and restores all processor state information during a logical processor
    context switch.

    +   ► Controls hardware I/O interrupt management facilities for LPARs.

    +   ► Provides VLAN channels between LPARs that help reduce the need for physical
    Ethernet adapters for inter-partition communication.

    +   ► Monitors the Flexible Service Processor (FSP) and performs a reset or reload
    if it detects the loss of one of the FSP, notifying the operating system if the
    problem is not corrected.'
  - '[PAGE 150]


    The POWER Hypervisor is always active, regardless of the system configuration
    or whether it is connected to the managed console. It requires memory to support
    the resource assignment of the LPARs on the server. The amount of memory that
    is required by the POWER Hypervisor firmware varies according to several factors:


    +   - Memory usage for hardware page tables (HPTs)

    +   - Memory usage to support I/O devices

    +   - Memory usage for virtualization


    # Memory usage for hardware page tables


    Each partition on the system includes its own hardware page table (HPT) that contributes
    to hypervisor memory usage. The HPT is used by the operating system to translate
    from effective addresses to physical real addresses in the hardware. This translation
    from effective to real addresses allows multiple operating systems to run simultaneously
    in their own logical address space. Whenever a virtual processor for a partition
    is dispatched on a physical processor, the hypervisor indicates to the hardware
    the location of the partition HPT that can be used when translating addresses.


    The amount of memory for the HPT is based on the maximum memory size of the partition
    and the HPT ratio. The default HPT ratio is 1/128th (for AIX, Virtual I/O Server
    [VIOS], and Linux partitions) of the maximum memory size of the partition. AIX,
    VIOS, and Linux use larger page sizes (16 and 64 KB) instead of using 4 KB pages.
    The use of larger page sizes reduces the overall number of pages that must be
    tracked; therefore, the overall size of the HPT can be reduced. For example, the
    HPT is 2 GB for an AIX partition with a maximum memory size of 256 GB.


    When defining a partition, the maximum memory size that is specified is based
    on the amount of memory that can be dynamically added to the dynamic partition
    (DLPAR) without changing the configuration and restarting the partition.


    In addition to setting the maximum memory size, the HPT ratio can be configured.
    The hpt_ratio parameter for the chsyscfg Hardware Management Console (HMC) command
    can be issued to define the HPT ratio that is used for a partition profile. The
    valid values are 1:32, 1:64, 1:128, 1:256, or 1:512.


    Specifying a smaller absolute ratio (1/512 is the smallest value) decreases the
    overall memory that is assigned to the HPT. Testing is required when changing
    the HPT ratio because a smaller HPT might incur more CPU consumption because the
    operating system might need to reload the entries in the HPT more frequently.
    Most customers choose to use the IBM provided default values for the HPT ratios.


    # Memory usage for I/O devices


    In support of I/O operations, the hypervisor maintains structures that are called
    the translation control entities (TCEs), which provide an information path between
    I/O devices and partitions. The TCEs provide the address of the I/O buffer, indications
    of read versus write requests, and other I/O-related attributes. Many TCEs are
    used per I/O device, so multiple requests can be active simultaneously to the
    same physical device. To provide better affinity, the TCEs are spread across multiple
    processor chips or drawers to improve performance while accessing the TCEs.


    For physical I/O devices, the base amount of space for the TCEs is defined by
    the hypervisor that is based on the number of I/O devices that are supported.
    A system that supports high-speed adapters also can be configured to allocate
    more memory to improve I/O performance. Linux is the only operating system that
    uses these extra TCEs so that the memory can be freed for use by partitions if
    the system uses only AIX.'
  - '[PAGE 151]


    # Memory usage for virtualization features


    Virtualization requires more memory to be allocated by the POWER Hypervisor for
    hardware statesave areas and various virtualization technologies. For example,
    on Power10 processor-based systems, each processor core supports up to eight simultaneous
    multithreading (SMT) threads of execution, and each thread contains over 80 different
    registers.


    The POWER Hypervisor must set aside save areas for the register contents for the
    maximum number of virtual processors that are configured. The greater the number
    of physical hardware devices, the greater the number of virtual devices, the greater
    the amount of virtualization, and the more hypervisor memory is required. For
    efficient memory consumption, wanted and maximum values for various attributes
    (processors, memory, and virtual adapters) must be based on business needs, and
    not set to values that are significantly higher than actual requirements.


    # Predicting memory that is used by the POWER Hypervisor


    The IBM System Planning Tool (SPT) is a resource that can be used to estimate
    the amount of hypervisor memory that is required for a specific server configuration.
    After the SPT executable file is downloaded and installed, you can define a configuration
    by selecting the correct hardware platform and the installed processors and memory,
    and defining partitions and partition attributes. SPT can estimate the amount
    of memory that is assigned to the hypervisor, which assists you when you change
    a configuration or deploy new servers.


    The POWER Hypervisor provides the following types of virtual I/O adapters:


    +   - Virtual SCSI

    +     The POWER Hypervisor provides a virtual SCSI mechanism for the virtualization
    of storage devices. The storage virtualization is accomplished by using two paired
    adapters: a virtual SCSI server adapter and a virtual SCSI customer adapter.

    +   - Virtual Ethernet

    +     The POWER Hypervisor provides a virtual Ethernet switch function that allows
    partitions fast and secure communication on the same server without any need for
    physical interconnection or connectivity outside of the server if a Layer 2 bridge
    to a physical Ethernet adapter is set in one VIOS partition, also known as Shared
    Ethernet Adapter (SEA).

    +   - Virtual Fibre Channel

    +     A virtual Fibre Channel adapter is a virtual adapter that provides customer
    LPARs with a Fibre Channel connection to a storage area network through the VIOS
    partition. The VIOS partition provides the connection between the virtual Fibre
    Channel adapters on the VIOS partition and the physical Fibre Channel adapters
    on the managed system.

    +   - Virtual (TTY) console

    +     Each partition must have access to a system console. Tasks, such as operating
    system installation, network setup, and various problem analysis activities, require
    a dedicated system console. The POWER Hypervisor provides the virtual console
    by using a virtual TTY or serial adapter and a set of hypervisor calls to operate
    on them. Virtual TTY does not require the purchase of any other features or software,
    such as the PowerVM Edition features.'
  md: "\n## Enterprise solutions\n\nIn this chapter, we describe the major pillars\
    \ that can help enterprises achieve their business goals and the reasons on why\
    \ Power E1080 provides a significant contribution to that end.\n\nThis chapter\
    \ includes the following topics:\n\n- 3.1, “PowerVM” on page 136\n- 3.2, “IBM\
    \ PowerVC overview” on page 145\n- 3.3, “System automation with Ansible” on page\
    \ 146\n- 3.4, “Protect trust from core to cloud” on page 149\n- 3.5, “Running\
    \ artificial intelligence where operational data is stored” on page 152\n\n##\
    \ 3.1 PowerVM\n\nThe PowerVM platform is the family of technologies, capabilities,\
    \ and offerings that delivers industry-leading virtualization for enterprises.\
    \ It is the umbrella branding term for Power processor-based server virtualization;\
    \ that is, IBM POWER Hypervisor, logical partitioning, IBM Micro-Partitioning®,\
    \ VIOS, Live Partition Mobility (LPM), and more. PowerVM is a combination of hardware\
    \ enablement and software.\n\n> Note: PowerVM Enterprise Edition License Entitlement\
    \ is included with each Power E1080 server. PowerVM Enterprise Edition is available\
    \ as a hardware feature (#5228), supports up to 20 partitions per core, VIOS,\
    \ multiple shared processor pools (MSPPs) and also offers LPM.\n\n### 3.1.1 IBM\
    \ POWER Hypervisor\n\nPower processor-based servers are combined with PowerVM\
    \ technology and offer the following key capabilities that can help to consolidate\
    \ and simplify IT environments:\n\n- Improve server usage and share I/O resources\
    \ to reduce the total cost of ownership (TCO) and better use IT assets.\n- Improve\
    \ business responsiveness and operational speed by dynamically reallocating resources\
    \ to applications as needed to better match changing business needs or handle\
    \ unexpected changes in demand.\n- Simplify IT infrastructure management by making\
    \ workloads independent of hardware resources so that business-driven policies\
    \ can be used to deliver resources that are based on time, cost, and service-level\
    \ requirements.\n\nCombined with features in the Power E1080, the IBM POWER Hypervisor\
    \ delivers functions that enable other system technologies, including logical\
    \ partitioning (LPAR) technology, virtualized processors, IEEE virtual local area\
    \ network (VLAN)-compatible virtual switch, virtual SCSI adapters, virtual Fibre\
    \ Channel adapters, and virtual consoles.\n\nThe POWER Hypervisor is a basic component\
    \ of the system's firmware and offers the following functions:\n\n- Provides an\
    \ abstraction between the physical hardware resources and the LPARs that use them.\n\
    - Enforces partition integrity by providing a security layer between LPARs.\n\
    - Controls the dispatch of virtual processors to physical processors.\n- Saves\
    \ and restores all processor state information during a logical processor context\
    \ switch.\n- Controls hardware I/O interrupt management facilities for LPARs.\n\
    - Provides VLAN channels between LPARs that help reduce the need for physical\
    \ Ethernet adapters for inter-partition communication.\n- Monitors the Flexible\
    \ Service Processor (FSP) and performs a reset or reload if it detects the loss\
    \ of one of the FSP, notifying the operating system if the problem is not corrected.\n\
    \nThe POWER Hypervisor is always active, regardless of the system configuration\
    \ or whether it is connected to the managed console. It requires memory to support\
    \ the resource assignment of the LPARs on the server. The amount of memory that\
    \ is required by the POWER Hypervisor firmware varies according to several factors:\n\
    \n- Memory usage for hardware page tables (HPTs)\n- Memory usage to support I/O\
    \ devices\n- Memory usage for virtualization\n\n### Memory usage for hardware\
    \ page tables\n\nEach partition on the system includes its own hardware page table\
    \ (HPT) that contributes to hypervisor memory usage. The HPT is used by the operating\
    \ system to translate from effective addresses to physical real addresses in the\
    \ hardware. This translation from effective to real addresses allows multiple\
    \ operating systems to run simultaneously in their own logical address space.\
    \ Whenever a virtual processor for a partition is dispatched on a physical processor,\
    \ the hypervisor indicates to the hardware the location of the partition HPT that\
    \ can be used when translating addresses.\n\nThe amount of memory for the HPT\
    \ is based on the maximum memory size of the partition and the HPT ratio. The\
    \ default HPT ratio is 1/128th (for AIX, Virtual I/O Server [VIOS], and Linux\
    \ partitions) of the maximum memory size of the partition. AIX, VIOS, and Linux\
    \ use larger page sizes (16 and 64 KB) instead of using 4 KB pages. The use of\
    \ larger page sizes reduces the overall number of pages that must be tracked;\
    \ therefore, the overall size of the HPT can be reduced. For example, the HPT\
    \ is 2 GB for an AIX partition with a maximum memory size of 256 GB.\n\nWhen defining\
    \ a partition, the maximum memory size that is specified is based on the amount\
    \ of memory that can be dynamically added to the dynamic partition (DLPAR) without\
    \ changing the configuration and restarting the partition.\n\nIn addition to setting\
    \ the maximum memory size, the HPT ratio can be configured. The hpt_ratio parameter\
    \ for the chsyscfg Hardware Management Console (HMC) command can be issued to\
    \ define the HPT ratio that is used for a partition profile. The valid values\
    \ are 1:32, 1:64, 1:128, 1:256, or 1:512.\n\nSpecifying a smaller absolute ratio\
    \ (1/512 is the smallest value) decreases the overall memory that is assigned\
    \ to the HPT. Testing is required when changing the HPT ratio because a smaller\
    \ HPT might incur more CPU consumption because the operating system might need\
    \ to reload the entries in the HPT more frequently. Most customers choose to use\
    \ the IBM provided default values for the HPT ratios.\n\n### Memory usage for\
    \ I/O devices\n\nIn support of I/O operations, the hypervisor maintains structures\
    \ that are called the translation control entities (TCEs), which provide an information\
    \ path between I/O devices and partitions. The TCEs provide the address of the\
    \ I/O buffer, indications of read versus write requests, and other I/O-related\
    \ attributes. Many TCEs are used per I/O device, so multiple requests can be active\
    \ simultaneously to the same physical device. To provide better affinity, the\
    \ TCEs are spread across multiple processor chips or drawers to improve performance\
    \ while accessing the TCEs.\n\nFor physical I/O devices, the base amount of space\
    \ for the TCEs is defined by the hypervisor that is based on the number of I/O\
    \ devices that are supported. A system that supports high-speed adapters also\
    \ can be configured to allocate more memory to improve I/O performance. Linux\
    \ is the only operating system that uses these extra TCEs so that the memory can\
    \ be freed for use by partitions if the system uses only AIX.\n\n### Memory usage\
    \ for virtualization features\n\nVirtualization requires more memory to be allocated\
    \ by the POWER Hypervisor for hardware statesave areas and various virtualization\
    \ technologies. For example, on Power10 processor-based systems, each processor\
    \ core supports up to eight simultaneous multithreading (SMT) threads of execution,\
    \ and each thread contains over 80 different registers.\n\nThe POWER Hypervisor\
    \ must set aside save areas for the register contents for the maximum number of\
    \ virtual processors that are configured. The greater the number of physical hardware\
    \ devices, the greater the number of virtual devices, the greater the amount of\
    \ virtualization, and the more hypervisor memory is required. For efficient memory\
    \ consumption, wanted and maximum values for various attributes (processors, memory,\
    \ and virtual adapters) must be based on business needs, and not set to values\
    \ that are significantly higher than actual requirements.\n\n### Predicting memory\
    \ that is used by the POWER Hypervisor\n\nThe IBM System Planning Tool (SPT) is\
    \ a resource that can be used to estimate the amount of hypervisor memory that\
    \ is required for a specific server configuration. After the SPT executable file\
    \ is downloaded and installed, you can define a configuration by selecting the\
    \ correct hardware platform and the installed processors and memory, and defining\
    \ partitions and partition attributes. SPT can estimate the amount of memory that\
    \ is assigned to the hypervisor, which assists you when you change a configuration\
    \ or deploy new servers.\n\nThe POWER Hypervisor provides the following types\
    \ of virtual I/O adapters:\n\n- Virtual SCSI\n  The POWER Hypervisor provides\
    \ a virtual SCSI mechanism for the virtualization of storage devices. The storage\
    \ virtualization is accomplished by using two paired adapters: a virtual SCSI\
    \ server adapter and a virtual SCSI customer adapter.\n- Virtual Ethernet\n  The\
    \ POWER Hypervisor provides a virtual Ethernet switch function that allows partitions\
    \ fast and secure communication on the same server without any need for physical\
    \ interconnection or connectivity outside of the server if a Layer 2 bridge to\
    \ a physical Ethernet adapter is set in one VIOS partition, also known as Shared\
    \ Ethernet Adapter (SEA).\n- Virtual Fibre Channel\n  A virtual Fibre Channel\
    \ adapter is a virtual adapter that provides customer LPARs with a Fibre Channel\
    \ connection to a storage area network through the VIOS partition. The VIOS partition\
    \ provides the connection between the virtual Fibre Channel adapters on the VIOS\
    \ partition and the physical Fibre Channel adapters on the managed system.\n-\
    \ Virtual (TTY) console\n  Each partition must have access to a system console.\
    \ Tasks, such as operating system installation, network setup, and various problem\
    \ analysis activities, require a dedicated system console. The POWER Hypervisor\
    \ provides the virtual console by using a virtual TTY or serial adapter and a\
    \ set of hypervisor calls to operate on them. Virtual TTY does not require the\
    \ purchase of any other features or software, such as the PowerVM Edition features.\n"
  mdcn: "\n\n## 企业解决方案\n\n在本章中，我们描述了可以帮助企业实现业务目标的主要支柱，以及 Power E1080 为此做出的重要贡献的原因。\n\
    \n本章包含以下主题：\n\n- 3.1，“PowerVM” 第 136 页\n- 3.2，“IBM PowerVC 概述” 第 145 页\n- 3.3，“使用\
    \ Ansible 进行系统自动化” 第 146 页\n- 3.4，“从核心到云保护信任” 第 149 页\n- 3.5，“在运营数据存储位置运行人工智能”\
    \ 第 152 页\n\n## 3.1 PowerVM\n\nPowerVM 平台是一系列技术、功能和产品组合，为企业提供业界领先的虚拟化。它是基于 Power\
    \ 处理器的服务器虚拟化的总括品牌术语；即 IBM POWER Hypervisor、逻辑分区、IBM Micro-Partitioning®、VIOS、Live\
    \ Partition Mobility (LPM) 等。PowerVM 是硬件使能和软件的结合。\n\n> 注意：PowerVM Enterprise Edition\
    \ License Entitlement 已包含在每台 Power E1080 服务器中。PowerVM Enterprise Edition 可作为硬件功能（#5228）提供，支持每个核心最多\
    \ 20 个分区、VIOS、多个共享处理器池（MSPPs），并提供 LPM。\n\n### 3.1.1 IBM POWER Hypervisor\n\n基于\
    \ Power 处理器的服务器结合 PowerVM 技术，提供以下关键功能，可帮助整合和简化 IT 环境：\n\n- 提高服务器使用率并共享 I/O 资源，以降低总体拥有成本（TCO）并更好地利用\
    \ IT 资产。\n- 通过根据需要动态重新分配资源给应用程序，提高业务响应能力和运营速度，更好地匹配不断变化的业务需求或应对需求的意外变化。\n- 通过使工作负载独立于硬件资源，简化\
    \ IT 基础设施管理，以便可以使用基于时间、成本和服务级别要求的业务驱动策略来提供资源。\n\n结合 Power E1080 中的功能，IBM POWER\
    \ Hypervisor 提供启用其他系统技术的功能，包括逻辑分区（LPAR）技术、虚拟化处理器、IEEE 虚拟局域网（VLAN）兼容虚拟交换机、虚拟 SCSI\
    \ 适配器、虚拟光纤通道适配器和虚拟控制台。\n\nPOWER Hypervisor 是系统固件的基本组件，提供以下功能：\n\n- 在使用物理硬件资源的物理硬件资源与\
    \ LPAR 之间提供抽象。\n- 通过在 LPAR 之间提供安全层来强制执行分区完整性。\n- 控制虚拟处理器到物理处理器的调度。\n- 在逻辑处理器上下文切换期间保存和恢复所有处理器状态信息。\n\
    - 控制 LPAR 的硬件 I/O 中断管理设施。\n- 在 LPAR 之间提供 VLAN 通道，有助于减少分区间通信所需的物理以太网适配器。\n- 监控\
    \ Flexible Service Processor（FSP）并在检测到 FSP 之一丢失时执行重置或重新加载，如果问题未得到纠正，则通知操作系统。\n\
    \nPOWER Hypervisor 始终处于活动状态，无论系统配置如何或是否连接到管理控制台。它需要内存来支持服务器上 LPAR 的资源分配。POWER\
    \ Hypervisor 固件所需的内存量根据以下几个因素而变化：\n\n- 硬件页表（HPT）的内存使用量\n- 支持 I/O 设备的内存使用量\n- 虚拟化功能的内存使用量\n\
    \n### 硬件页表的内存使用量\n\n系统上的每个分区都包含自己的硬件页表（HPT），这会增加 hypervisor 的内存使用量。HPT 由操作系统用来在硬件中将有效地址转换为物理实地址。这种从有效地址到实地址的转换允许多个操作系统在其各自的逻辑地址空间中同时运行。每当分区的虚拟处理器在物理处理器上调度时，hypervisor\
    \ 就会指示硬件使用可用于地址转换的分区 HPT 的位置。\n\nHPT 的内存量基于分区的最大内存大小和 HPT 比率。默认 HPT 比率为 1/128（适用于\
    \ AIX、Virtual I/O Server [VIOS] 和 Linux 分区）的分区最大内存大小。AIX、VIOS 和 Linux 使用更大的页面大小（16\
    \ 和 64 KB），而不是使用 4 KB 页面。使用更大的页面大小可减少必须跟踪的页面总数；因此，HPT 的整体大小可以减小。例如，最大内存大小为 256\
    \ GB 的 AIX 分区的 HPT 为 2 GB。\n\n在定义分区时，所指定的最大内存大小基于可以在不更改配置和重新启动分区的情況下动态添加到动态分区（DLPAR）的内存量。\n\
    \n除了设置最大内存大小外，还可以配置 HPT 比率。用于 chsyscfg 硬件管理控制台（HMC）命令的 hpt_ratio 参数可以发出以定义分区配置文件所使用的\
    \ HPT 比率。有效值是 1:32、1:64、1:128、1:256 或 1:512。\n\n指定较小的绝对比率（1/512 是最小值）会减少分配给 HPT\
    \ 的总体内存。更改 HPT 比率时需要进行测试，因为较小的 HPT 可能会导致 CPU 消耗增加，因为操作系统可能需要更频繁地重新加载 HPT 中的条目。大多数客户选择使用\
    \ IBM 提供的 HPT 比率默认值。\n\n### I/O 设备的内存使用量\n\n为支持 I/O 操作，hypervisor 维护称为转换控制实体（TCE）的结构，它们在\
    \ I/O 设备和分区之间提供信息路径。TCE 提供 I/O 缓冲区的地址、读与写请求的指示以及其他 I/O 相关属性。每个 I/O 设备使用许多 TCE，因此可以同时向同一物理设备发出多个请求。为了提供更好的亲和性，TCE\
    \ 分布在多个处理器芯片或机箱中，以提高访问 TCE 时的性能。\n\n对于物理 I/O 设备，TCE 的基础空间量由 hypervisor 定义，基于支持的\
    \ I/O 设备数量。支持高速适配器的系统也可以配置为分配更多内存以提高 I/O 性能。Linux 是唯一使用这些额外 TCE 的操作系统，因此如果系统仅使用\
    \ AIX，则内存可以释放供分区使用。\n\n### 虚拟化功能的内存使用量\n\n虚拟化需要 POWER Hypervisor 分配更多内存用于硬件状态保存区域和各种虚拟化技术。例如，在基于\
    \ Power10 处理器的系统上，每个处理器核心支持多达八个同时多线程（SMT）执行线程，每个线程包含超过 80 个不同的寄存器。\n\nPOWER Hypervisor\
    \ 必须为配置的最大虚拟处理器数量预留寄存器内容的保存区域。物理硬件设备数量越多，虚拟设备数量越多，虚拟化程度越高，需要的 hypervisor 内存就越多。为了实现高效的内存消耗，各种属性（处理器、内存和虚拟适配器）的所需值和最大值必须基于业务需求，而不是设置为明显高于实际需求的值。\n\
    \n### 预测 POWER Hypervisor 使用的内存\n\nIBM 系统规划工具（SPT）是可用于估算特定服务器配置所需 hypervisor 内存量的资源。在下载并安装\
    \ SPT 可执行文件后，您可以通过选择正确的硬件平台和已安装的处理器和内存，并定义分区和分区属性来定义配置。SPT 可以估算分配给 hypervisor\
    \ 的内存量，这有助于您更改配置或部署新服务器时。\n\nPOWER Hypervisor 提供以下类型的虚拟 I/O 适配器：\n\n- 虚拟 SCSI\n\
    \  POWER Hypervisor 提供虚拟 SCSI 机制用于存储设备的虚拟化。存储虚拟化是通过使用一对适配器实现的：虚拟 SCSI 服务器适配器和虚拟\
    \ SCSI 客户适配器。\n- 虚拟以太网\n  POWER Hypervisor 提供虚拟以太网交换机功能，允许分区在同一服务器上进行快速且安全的通信，无需任何物理互连或服务器外部的连接，如果在\
    \ VIOS 分区中设置到物理以太网适配器的第 2 层桥接，则也称为共享以太网适配器（SEA）。\n- 虚拟光纤通道\n  虚拟光纤通道适配器是虚拟适配器，可为客户\
    \ LPAR 提供通过 VIOS 分区连接到存储区域网络的光纤通道连接。VIOS 分区在 VIOS 分区上的虚拟光纤通道适配器与受管系统上的物理光纤通道适配器之间提供连接。\n\
    - 虚拟（TTY）控制台\n  每个分区必须能够访问系统控制台。诸如操作系统安装、网络设置和各种问题分析活动等任务需要专用的系统控制台。POWER Hypervisor\
    \ 通过使用虚拟 TTY 或串行适配器以及操作它们的一组 hypervisor 调用提供虚拟控制台。虚拟 TTY 不需要购买任何其他功能或软件，例如 PowerVM\
    \ Edition 功能。\n\n"

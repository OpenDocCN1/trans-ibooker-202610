    ## 1.5.4 系统节点 PCIe 功能


    每个系统节点提供八个 PCIe Gen 5 热插拔启用插槽；因此，双系统节点服务器提供 16 个插槽，三系统节点服务器提供 24 个插槽，四系统节点系统提供
    32 个插槽。


    表 1-12 列出了 Power E1080 服务器节点抽屉内支持的所有 PCIe 适配器功能代码。



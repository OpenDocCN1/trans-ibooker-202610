    ## 2.11.2 System firmware maintenance


    Starting with HMC V10R1 M1010, the main menu was re-arranged to classify the features
    that makes more sense in grouping.


    Complete the following steps to update the firmware:


    - 1. Click **Update Firmware** → **System Firmware** → **Update**.

    - 2. Accept the License Agreement (see Figure 2-37). You cannot proceed if you
    do not accept the agreement. Click **Next**.


    ![](img/7c8373945565ba432037f60bbf8458eb_135_0.png)


    Figure 2-37 Update System Firmware


    3. In the next window, the Readiness Status column shows whether the system is
    ready. If the message is too long, hover around the box to see the entire message.


    If two or more systems are selected and one is in a ready state and one is not
    in a ready state, the system that is not in a ready state is skipped and only
    the system with the ready state progresses (see Figure 2-38).


    Click Next.


    ![](img/7c8373945565ba432037f60bbf8458eb_136_0.png)


    Figure 2-38 FSP Based Systems Readiness window


    4. The System Firmware Type window opens. Two options are available: update or
    upgrade (see Figure 2-39). Click **Update** and then, click **Next.**


    Figure 2-39 System Firmware Type window


    5. The System Firmware Repository window opens (see Figure 2-40). Select from
    one of the following locations for the repository:


    - IBM Service Web Site

    - Removable Media

    - FTP Site

    - Secure FTP Site

    - Import Staging Location

    - Mount Point


    Click Next.


    ![](img/7c8373945565ba432037f60bbf8458eb_138_0.png)


    Figure 2-40 System Firmware Repository window



    The Power10 processor I/O subsystem is driven by 32 GHz differential Peripheral
    Component Interconnect Express 5.0 (PCIe Gen 5) buses that provide 32 lanes that
    are grouped in two sets of 16 lanes. The 32 PCIe lanes deliver an aggregate bandwidth

    # 2.11 Manageability


    Manageability of the system is a key component for customers to manage, service,
    test, and monitor the system performance, security, and reliability.


    # 2.11.1 Service user interface


    To manage and service the system, the E1080 offers the following service interfaces:


    +   - ASMI

    +   - HMC GUI/CLI

    +   - Operator panel

    +   - Operating system


    ASMI is a graphical interface that is part of the service processor firmware.
    The ASMI manages and communicates with the service processor. The ASMI is required
    to set up the service processor and to perform service tasks, such as reading
    service processor error logs, reading vital product data, and controlling the
    system power.


    ASMI can be accessed by using the HMC GUI or CLI or directly attaching a laptop
    to the FSP port with an Ethernet cable that is crossed or through a switch (the
    same network subnet is required). Some of the functions in the ASMI are limited
    only to IBM service representatives, which requires celogin or dev user credentials
    during repair activities.


    The control panel functions allow you to interface with the server. Control panel
    functions range in complexity from functions that display a status (such as IPL
    speed) to service functions that only service representatives can access.


    For more information about a full list of all functions, see this web page.'
  md: "\nThe Power10 specific toolchain is available in Advance Toolchain version\
    \ 15.0, which allows customers and developers to use all new Power10 processor-based\
    \ technology instructions when programming. Cross-module function call overhead\
    \ was reduced because of a new PC-relative addressing mode.\n\nOne specific is\
    \ a 10x-to-20x advantage over POWER9 processor-based technology on inferencing\
    \ workloads because of new memory bandwidth and new instructions. One example\
    \ is the new special purpose-built matrix math accelerator (MMA) that was tailored\
    \ for the demands of machine learning and deep learning inference. It also includes\
    \ many AI data types.\n\nNetwork virtualization is an area with significant evolution\
    \ and improvements, which benefit virtual and containerized environments. The\
    \ following recent improvements were made for Linux networking features on Power\
    \ E1080:\n\n- SR-IOV allows virtualization of network cards at the controller\
    \ level without the need to create virtual Shared Ethernet Adapters in the VIOS\
    \ partition. It is enhanced with (vNIC) virtual Network Interface Controller,\
    \ which allows data to be transferred directly from the partitions to or from\
    \ the SR-IOV physical adapter without transiting through a VIOS partition.\n-\
    \ Hybrid Network Virtualization (HNV) allows Linux partitions to use the efficiency\
    \ and performance benefits of SR-IOV logical ports and participate in mobility\
    \ operations, such as active and inactive Live Partition Mobility (LPM) and Simplified\
    \ Remote Restart (SRR). HNV is enabled by selecting a new Migratable option when\
    \ an SR-IOV logical port is configured.\n- NVMe over Fibre Channel fabrics (NVMe-OF)\
    \ is now available on Power E1080 running Linux when the 2-port 32 Gb adapter\
    \ (#EN1A or #EN1B) is used and the selected IBM FlashSystem high-end (FS9110)\
    \ and mid-range (FS7200) model are used.\n\n## Security\n\nSecurity is a top priority\
    \ for IBM and our distribution partners. Linux security on IBM Power is a vast\
    \ topic that can be the subject of detailed separate material; however, improvements\
    \ in the areas of hardening, integrity protection, performance, platform security,\
    \ and certifications are introduced with this section.\n\nHardening and integrity\
    \ protection deal with protecting the Linux kernel from unauthorized tampering\
    \ while allowing upgrading and servicing to the kernel. These topics become even\
    \ more important when running in a containerized environment with an immutable\
    \ operating system, such as CoreOS in OpenShift.\n\nPerformance also is a security\
    \ topic because specific hardening mitigation strategies (for example, against\
    \ side-channel attacks), can have a significant performance effect. In addition,\
    \ cryptography can use significant compute cycles.\n\nThe Power E1080 features\
    \ transparent memory encryption at the level of the controller, which prevents\
    \ an attacker from retrieving data from physical memory or storage-class devices\
    \ that are attached to the processor bus.\n\n## 2.10.5 Virtual I/O Server\n\n\
    The minimum required level of VIOS for the Power E1080 server is VIOS 3.1.3.10\
    \ or later.\n\nIBM regularly updates the VIOS code. For more information, see\
    \ IBM Fix Central.\n\n## 2.10.6 Entitled System Support\n\nThe Entitled Systems\
    \ Support website (ESS) is IBM's go-to place to view and manage Power and Storage\
    \ software and hardware. In general, most products that are offered by IBM Systems\
    \ that are purchased through our IBM Digital Sales representatives or Business\
    \ Partners are accessed on this site when the IBM Configurator is used.\n\nThe\
    \ site features the following three main sections:\n\n- My entitled software:\
    \ Activities related to Power and Storage software that offer to download licensed,\
    \ free, and trial software media, place software update orders, and manage software\
    \ keys.\n- My entitled hardware: Activities related to Power and Storage hardware\
    \ that offer to renew Update Access Keys, buy and use Elastic Capacity on Demand,\
    \ assign or buy credits for new and existing pools in Enterprise Pools 2.0, download\
    \ Storage Capacity on Demand codes, and manage Hybrid Capacity credits.\n- My\
    \ inventory: Activities related to Power and Storage inventory that offer to browse\
    \ software license, software maintenance, and hardware inventory, manage inventory\
    \ retrievals by way of Base Composer or generate several types of reports.\n\n\
    For more information, see this web page.\n\n## 2.10.7 Update Access Keys\n\nSince\
    \ the introduction of the POWER8 processor-based server servers, IBM also introduced\
    \ Update Access Key (UAK).\n\nWhen system firmware updates are applied to the\
    \ system, UAK and its expiration date are checked (see Figure 2-37 on page 122).\
    \ System firmware updates include a release date.\n\nWhen attempting to apply\
    \ system firmware updates, if the release date for the firmware updates passed\
    \ the expiration date for the update access key, the updates are not processed.\
    \ As update access keys expire, they need to be replaced by using the Hardware\
    \ Management Console (HMC) or the ASMI on the service processor.\n\nBy default,\
    \ newly delivered systems include an UAK that often expires after three years.\
    \ Thereafter, the UAK can be extended every six months, but only if a maintenance\
    \ contract exists. The contract can be verified in the ESS website (for more information,\
    \ see 2.10.6, “Entitled System Support” on page 119).\n\nDetermining when the\
    \ current Update Access Key runs through the HMC, GUI or CLI as provided in the\
    \ following examples. However, it also is possible to display the expiration date\
    \ by using the suitable AIX or IBM i command.\n\n## UAK expiration date by using\
    \ AIX 7.1\n\nIn the case of AIX 7.1, use the following command:\n\n```\nlscfg\
    \ -vpl sysplanar0 | grep -p \"System Firmware\"\n```\n\nThe output is similar\
    \ to the output that is shown in Example 2-1 (the Microcode Entitlement Date represents\
    \ the UAK expiration date).\n\n## Example 2-1 Output of the command to check UAK\
    \ expiration date via AIX 7.1\n\n```\n$ lscfg -vpl sysplanar0 | grep -p \"System\
    \ Firmware\"\n    System Firmware:\n    ...\n        Microcode Image..............SV860_138\
    \ SV860_103 SV860_138\n        Microcode Level..............FW860.42 FW860.30\
    \ FW860.42\n        Microcode Build Date........20180101 20170628 20180101\n \
    \       Microcode Entitlement Date..20190825\n        Hardware Location Code......U8284.22A.XXXXXXX-Y1\n\
    \        Physical Location: U8284.22A.XXXXXXX-Y1\n```\n\n## UAK expiration date\
    \ by using AIX 7.2\n\nIn the case of AIX 7.2, the output is slightly different\
    \ from AIX 7.1. Use the following command:\n\n```\nlscfg -vpl sysplanar0 |grep\
    \ -p \"System Firmware\"\n```\n\nThe output is similar to the output that is shown\
    \ in Example 2-2 (the Update Access Key Exp Date represents the UAK expiration\
    \ date).\n\n## Example 2-2 Output of the command to check UAK expiration date\
    \ via AIX 7.2\n\n```\n$ lscfg -vpl sysplanar0 |grep -p \"System Firmware\"\n \
    \   System Firmware:\n    ...\n        Microcode Image..............SV860_138\
    \ SV860_103 SV860_138\n        Microcode Level..............FW860.42 FW860.30\
    \ FW860.42\n        Microcode Build Date........20180101 20170628 20180101\n \
    \       Update Access Key Exp Date..20190825\n        Hardware Location Code......U8284.22A.XXXXXXX-Y1\n\
    \        Physical Location: U8284.22A.XXXXXXX-Y1\n```\n\n## UAK expiration date\
    \ by using IBM i\n\nBy using IBM i as operating system, it is possible to check\
    \ the status of the UAK by using the Display Firmware Status window.\n\nIf the\
    \ update access key expired, proceed to the ESS website to replace your update\
    \ access key. Figure 2-36 on page 121 shows the output in the IBM i 7.1 and 7.2\
    \ releases. In the 7.3 release, the text changes to Update Access Key Expiration\
    \ Date. The line that is highlighted in Figure 2-36 on page 121 is displayed whether\
    \ the system is operating system managed or HMC managed.\n\n![](img/7c8373945565ba432037f60bbf8458eb_134_0.png)\n\
    \nFigure 2-36 Display Firmware Status window\n\n## 2.11 Manageability\n\nManageability\
    \ of the system is a key component for customers to manage, service, test, and\
    \ monitor the system performance, security, and reliability.\n\n## 2.11.1 Service\
    \ user interface\n\nTo manage and service the system, the E1080 offers the following\
    \ service interfaces:\n\n- ASMI\n- HMC GUI/CLI\n- Operator panel\n- Operating\
    \ system\n\nASMI is a graphical interface that is part of the service processor\
    \ firmware. The ASMI manages and communicates with the service processor. The\
    \ ASMI is required to set up the service processor and to perform service tasks,\
    \ such as reading service processor error logs, reading vital product data, and\
    \ controlling the system power.\n\nASMI can be accessed by using the HMC GUI or\
    \ CLI or directly attaching a laptop to the FSP port with an Ethernet cable that\
    \ is crossed or through a switch (the same network subnet is required). Some of\
    \ the functions in the ASMI are limited only to IBM service representatives, which\
    \ requires celogin or dev user credentials during repair activities.\n\nThe control\
    \ panel functions allow you to interface with the server. Control panel functions\
    \ range in complexity from functions that display a status (such as IPL speed)\
    \ to service functions that only service representatives can access.\n\nFor more\
    \ information about a full list of all functions, see this web page.\n"
  mdcn: "\n\nPower10 专用的工具链在 Advance Toolchain 版本 15.0 中可用，该版本允许客户和开发人员在编程时使用所有新的基于\
    \ Power10 处理器的技术指令。由于新的 PC 相对寻址模式，跨模块函数调用开销降低了。\n\n一个具体优势是，在推理工作负载方面，相比基于 POWER9\
    \ 处理器的技术具有 10 倍至 20 倍的优势，这是由于新的内存带宽和新指令所致。一个例子是新的专用特殊用途矩阵数学加速器（MMA），该加速器针对机器学习和深度学习推理的需求进行了定制。它还包括许多\
    \ AI 数据类型。\n\n网络虚拟化是一个具有显著演进和改进的领域，其优势惠及虚拟和容器化环境。以下是在 Power E1080 上针对 Linux 网络功能所做的最新改进：\n\
    \n- SR-IOV 允许在控制器级别对网络卡进行虚拟化，而无需在 VIOS 分区中创建虚拟共享以太网适配器。其增强功能包括 (vNIC) 虚拟网络接口控制器，该控制器允许数据直接从分区传输到或来自\
    \ SR-IOV 物理适配器，而无需经过 VIOS 分区。\n- 混合网络虚拟化（HNV）允许 Linux 分区使用 SR-IOV 逻辑端口的效率和性能优势，并参与移动操作，例如活动和非活动的实时分区迁移（LPM）和简化远程重启（SRR）。HNV\
    \ 是通过在配置 SR-IOV 逻辑端口时选择新的可迁移选项来启用的。\n- NVMe over Fibre Channel 结构（NVMe-OF）现在在运行\
    \ Linux 的 Power E1080 上可用，当使用 2 端口 32 Gb 适配器（#EN1A 或 #EN1B）并且使用所选的 IBM FlashSystem\
    \ 高端（FS9110）和中端（FS7200）型号时。\n\n## Security\n\n安全性是 IBM 及其分销合作伙伴的首要任务。IBM Power\
    \ 上的 Linux 安全性是一个庞大的主题，可以作为详细的单独材料；然而，随着本节的介绍，在加固、完整性保护、性能、平台安全和认证方面引入了改进。\n\n\
    加固和完整性保护涉及在允许升级和维护内核的同时保护 Linux 内核免受未经授权的篡改。当在具有不可变操作系统的容器化环境中运行时，例如 OpenShift\
    \ 中的 CoreOS，这些主题变得更加重要。\n\n性能也是一个安全主题，因为特定的加固缓解策略（例如针对侧信道攻击）可能对性能产生显著影响。此外，密码学可能使用大量的计算周期。\n\
    \nPower E1080 具有在控制器级别的透明内存加密，可防止攻击者从物理内存或连接到处理器总线的存储类设备中检索数据。\n\n## 2.10.5 Virtual\
    \ I/O Server\n\nPower E1080 服务器所需的最低 VIOS 级别为 VIOS 3.1.3.10 或更高版本。\n\nIBM 定期更新\
    \ VIOS 代码。有关更多信息，请参阅 IBM Fix Central。\n\n## 2.10.6 Entitled System Support\n\n\
    授权系统支持网站（ESS）是 IBM 查看和管理 Power 和存储软件和硬件的首选位置。一般而言，大多数通过我们的 IBM Digital Sales 代表或业务合作伙伴购买的\
    \ IBM Systems 提供的产品在使用 IBM Configurator 时可通过该网站访问。\n\n该网站包含以下三个主要部分：\n\n- My entitled\
    \ software：与 Power 和存储软件相关的活动，提供下载许可、免费和试用软件媒体、订购软件更新和管理软件密钥。\n- My entitled hardware：与\
    \ Power 和存储硬件相关的活动，提供续订更新访问密钥、购买和使用弹性容量按需、分配或购买企业池 2.0 中新旧池的积分、下载存储容量按需代码和管理混合容量积分。\n\
    - My inventory：与 Power 和存储库存相关的活动，提供浏览软件许可、软件维护和硬件库存、管理通过 Base Composer 的库存检索或生成多种类型的报告。\n\
    \n有关更多信息，请参阅此网页。\n\n## 2.10.7 Update Access Keys\n\n自 POWER8 处理器服务器推出以来，IBM 还引入了更新访问密钥（UAK）。\n\
    \n当系统固件更新应用于系统时，会检查 UAK 及其到期日期（见第 122 页图 2-37）。系统固件更新包括发布日期。\n\n尝试应用系统固件更新时，如果固件更新的发布日期超过了更新访问密钥的到期日期，则更新不会被处理。随着更新访问密钥到期，需要使用硬件管理控制台（HMC）或服务处理器上的\
    \ ASMI 进行更换。\n\n默认情况下，交付的新系统包含一个 UAK，通常在三年后到期。此后，只要存在维护合同，UAK 就可以每六个月延长一次。合同可以在\
    \ ESS 网站上验证（有关更多信息，请参阅第 119 页的 2.10.6“Entitled System Support”）。\n\n确定当前更新访问密钥何时到期可通过\
    \ HMC 的 GUI 或 CLI 按以下示例提供。然而，也可以使用合适的 AIX 或 IBM i 命令显示到期日期。\n\n## UAK expiration\
    \ date by using AIX 7.1\n\n对于 AIX 7.1，使用以下命令：\n\n```\nlscfg -vpl sysplanar0 |\
    \ grep -p \"System Firmware\"\n```\n\n输出类似于示例 2-1 所示的输出（微代码授权日期代表 UAK 到期日期）。\n\
    \n## Example 2-1 Output of the command to check UAK expiration date via AIX 7.1\n\
    \n```\n$ lscfg -vpl sysplanar0 | grep -p \"System Firmware\"\n    System Firmware:\n\
    \    ...\n        Microcode Image..............SV860_138 SV860_103 SV860_138\n\
    \        Microcode Level..............FW860.42 FW860.30 FW860.42\n        Microcode\
    \ Build Date........20180101 20170628 20180101\n        Microcode Entitlement\
    \ Date..20190825\n        Hardware Location Code......U8284.22A.XXXXXXX-Y1\n \
    \       Physical Location: U8284.22A.XXXXXXX-Y1\n```\n\n## UAK expiration date\
    \ by using AIX 7.2\n\n对于 AIX 7.2，输出与 AIX 7.1 略有不同。使用以下命令：\n\n```\nlscfg -vpl sysplanar0\
    \ |grep -p \"System Firmware\"\n```\n\n输出类似于示例 2-2 所示的输出（更新访问密钥到期日期代表 UAK 到期日期）。\n\
    \n## Example 2-2 Output of the command to check UAK expiration date via AIX 7.2\n\
    \n```\n$ lscfg -vpl sysplanar0 |grep -p \"System Firmware\"\n    System Firmware:\n\
    \    ...\n        Microcode Image..............SV860_138 SV860_103 SV860_138\n\
    \        Microcode Level..............FW860.42 FW860.30 FW860.42\n        Microcode\
    \ Build Date........20180101 20170628 20180101\n        Update Access Key Exp\
    \ Date..20190825\n        Hardware Location Code......U8284.22A.XXXXXXX-Y1\n \
    \       Physical Location: U8284.22A.XXXXXXX-Y1\n```\n\n## UAK expiration date\
    \ by using IBM i\n\n使用 IBM i 作为操作系统，可以使用显示固件状态窗口检查 UAK 的状态。\n\n如果更新访问密钥已过期，请前往\
    \ ESS 网站更换您的更新访问密钥。图 2-36 第 121 页显示了 IBM i 7.1 和 7.2 版本中的输出。在 7.3 版本中，文本更改为更新访问密钥到期日期。图\
    \ 2-36 第 121 页中突出显示的行无论系统是操作系统管理还是 HMC 管理都会显示。\n\n![](img/7c8373945565ba432037f60bbf8458eb_134_0.png)\n\
    \nFigure 2-36 Display Firmware Status window\n\n## 2.11 Manageability\n\n系统的可管理性是客户管理、维护、测试和监控系统性能、安全性和可靠性的关键组成部分。\n\
    \n## 2.11.1 Service user interface\n\n为了管理和维护系统，E1080 提供了以下服务接口：\n\n- ASMI\n-\
    \ HMC GUI/CLI\n- Operator panel\n- Operating system\n\nASMI 是服务处理器固件的一部分的图形界面。ASMI\
    \ 管理并与服务处理器通信。ASMI 需要设置服务处理器并执行服务任务，例如读取服务处理器错误日志、读取重要产品数据和控制系统电源。\n\nASMI 可以通过\
    \ HMC GUI 或 CLI 访问，也可以通过以太网电缆交叉连接或通过交换机直接将笔记本电脑连接到 FSP 端口（需要相同的网络子网）。ASMI 中的某些功能仅限于\
    \ IBM 服务代表，在维修活动期间需要 celogin 或 dev 用户凭据。\n\n控制面板功能允许您与服务器交互。控制面板功能从显示状态（例如 IPL\
    \ 速度）的功能到只有服务代表可以访问的服务功能不等。\n\n有关所有功能的完整列表，请参阅此网页。\n\n"

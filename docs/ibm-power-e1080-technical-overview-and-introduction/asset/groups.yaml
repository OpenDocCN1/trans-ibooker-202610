  - '[PAGE 55]


    Figure 1-14 shows the vertical distances between the mounting holes.


    ![](img/7c8373945565ba432037f60bbf8458eb_55_0.png)


    Figure 1-14 Vertical distances between mounting holes


    The following rack hole sizes are supported for racks where IBM hardware is mounted:


    +   - 7.1 mm (0.28 in.) plus or minus 0.1 mm (round)

    +   - 9.5 mm (0.37 in.) plus or minus 0.1 mm (square)


    The rack or cabinet must be capable of supporting an average load of 20 kg (44
    lb.) of product weight per EIA unit. For example, a four EIA drawer has a maximum
    drawer weight of 80 kg (176 lb.).


    # 1.8 Hardware management console overview


    The Hardware Management Console (HMC) can be a hardware appliance or virtual appliance
    that can be used to configure and manage your systems. The HMC connects to one
    or more managed systems and provides capabilities for following primary functions:


    +   - Systems Management functions, such as Power Off, Power on, system settings,
    Capacity on Demand, Enterprise Pools, Shared processor Pools, Performance and
    Capacity Monitoring, and starting Advanced System Management Interface (ASMI)
    for managed systems.

    +   - Deliver virtualization management through support for creating, managing,
    and deleting Logical Partitions, Live Partition Mobility, Remote Restart, configuring
    SRIOV, managing Virtual IO Servers, dynamic resource allocation, and operating
    system terminals.'
  - '[PAGE 56]


    +   - Acts as the service focal point for systems and supports service functions,
    including call home, dump management, guided repair and verify, concurrent firmware
    updates for managed systems, and around-the-clock error reporting with Electronic
    Service Agent for faster support.

    +   - Provides appliance management capabilities for configuring network, users
    on the HMC, updating and upgrading the HMC


    We discuss the available HMC offerings next.


    # 1.8.1 HMC 7063-CR2


    The 7063-CR2 IBM Power Systems HMC (see Figure 1-15) is a second-generation Power
    processor-based HMC.


    The CR2 model includes the following features:


    +   - 6-core POWER9 130W processor chip

    +   - 64 GB (4x16 GB) or 128 GB (4x32 GB) of memory RAM

    +   - 1.8 TB with RAID1 protection of internal disk capacity

    +   - 4-ports 1 Gb Ethernet (RH-45), 2-ports 10 Gb Ethernet (RJ-45), two USB 3.0
    ports (front side) and two USB 3.0 ports (rear side), and 1 Gb IPMI Ethernet (RJ-45)

    +   - Two 900W power supply units

    +   - Remote Management Service: IPMI port (OpenBMC) and Redfish application programming
    interface (API)

    +   - Base Warranty is 1 year 9x5 with available optional upgrades


    A USB Smart Drive not included.


    > Note: The recovery media for V10R1 is the same for 7063-CR2 and 7063-CR1.


    ![](img/7c8373945565ba432037f60bbf8458eb_56_0.png)'
  - '[PAGE 57]


    The 7063-CR2 is compatible with flat panel console kits 7316-TF3, TF4, and TF5.


    > Note: The 7316-TF3 and TF4 were withdrawn from marketing.


    # 1.8.2 Virtual HMC


    Initially, the HMC was sold only as a hardware appliance, including the HMC firmware
    installed. However, IBM extended this offering to allow the purchase of the hardware
    appliance and a virtual appliance that can be deployed on ppc64le architectures
    and deployed on x86 platforms.


    Any customer with valid contract can download it from ESS site or it can be included
    within an initial Power E1080 order.


    The virtual HMC supports the following hypervisors:


    +   - On x86 processor-based servers:

    +     - KVM

    +     - Xen

    +     - VMware

    +   - On Power processor-based servers: PowerVM


    The following minimum requirements must be met to install the virtual HMC:


    +   - 16 GB of Memory

    +   - 4 virtual processors

    +   - 2 network interfaces (maximum 4 allowed)

    +   - 1 disk drive (500 GB available disk drive)


    For an initial Power E1080 order with the IBM configurator (e-config), HMC virtual
    appliance can be found by selecting add software → Other System Offerings (as
    product selections) and then:


    +   - 5765-VHP for IBM HMC Virtual Appliance for Power V10

    +   - 5765-VHX for IBM HMC Virtual Appliance x86 V10


    For more information about an overview of the Virtual HMC, see this web page.


    For more information about how to install the virtual HMC appliance and all requirements,
    see IBM Documentation.


    # 1.8.3 Baseboard management controller network connectivity rules for 7063-CR2


    The 7063-CR2 HMC features a baseboard management controller (BMC), which is a
    specialized service processor that monitors the physical state of the system by
    using sensors. OpenBMC that is used on 7063-CR2 provides a graphical user interface
    (GUI) that can be accessed from a workstation that has network connectivity to
    the BMC. This connection requires an Ethernet port to be configured for use by
    the BMC.


    The 7063-CR2 provides two network interfaces (eth0 and eth1) for configuring network
    connectivity for BMC on the appliance.'
  - '[PAGE 58]


    Each interface maps to a different physical port on the system. Different management
    tools name the interfaces differently. The HMC task Console Management → Console
    Settings → Change BMC/IPMI Network Settings modifies only the Dedicated interface.


    The BMC ports are listed see Table 1-24.


    # Table 1-24 BMC ports


    | Management Tool | Logical Port | Shared/Dedicated | CR2 Physical Port |

    |---|---|---|---|

    | OpenBMC UI | eth0 | Shared | eth0 |

    | OpenBMC UI | eth1 | Dedicated | Management port only |

    | ipmi tool | lan1 | Shared | eth0 |

    | ipmi tool | lan2 | Dedicated | Management port only |

    | HMC task (change BMC/IMPI Network settings | lan2 | Dedicated | Management port
    only |


    Figure 1-16 shows the BMC interfaces of the HMC.


    ![](img/7c8373945565ba432037f60bbf8458eb_58_0.png)


    The main difference is the shared and dedicated interface to the BMC can coexist.
    Each has its own LAN number and physical port. Ideally, the customer configures
    one port, but both can be configured. Connecting power systems to the HMC rules
    remain the same as previous versions.


    # 1.8.4 High availability HMC configuration


    For the best manageabiltiy and redundancy, a dual HMC configuration is suggested.
    This configuration can be two hardware appliances, but also one hardware appliance
    and one virtual appliance or two virtual appliances.


    The following requirements must be met:


    +   - Two HMCs are at the same version.

    +   - The HMCs use different subnets to connect to the FSPs.

    +   - The HMCs can communicate with the servers'' partitions over a public network
    to allow for full synchronization and function.'
  - '[PAGE 59]


    # 1.8.5 HMC code level requirements for the Power E1080


    The minimum required HMC version for the Power E1080 is V10R1. V10R1 is supported
    only on 7063-CR1, 7063-CR2, and Virtual HMC appliances. It is *not* supported
    on 7042 Machine types. HMC with V10R1 cannot manage POWER7 processor-based systems.


    An HMC that is running V10R1 M1010 includes the following features:


    +   - HMC OS Secure Boot support for the 7063-CR2 appliance

    +   - Ability to configure login retries and suspended time and support for inactivity
    expiration in password policy

    +   - Ability to specify HMC location and data replication for groups

    +   - VIOS Management Enhancements:

    +     - Prepare for VIOS Maintenance:

    +       - Validation for redundancy for the storage and network that is provided
    by VIOS to customer partitions

    +       - Switch path of redundant storage and network to start failover

    +       - Rollback to original configuration on failure of prepare

    +       - Audit various validation and prepare steps performed

    +       - Report any failure seen during prepare

    +     - Command Line and Scheduled operations support for VIOS backup or restore
    VIOS Configuration and SSP Configuration

    +     - Option to backup or restore Shared Storage Pool configuration in HMC

    +     - Options to import or export the backup files to external storage

    +     - Option to failover all Virtual NIC''s from one VIOS to another

    +   - Support 128 and 256 MB LMB sizes

    +   - Automatically choose fastest network for LPM memory transfer

    +   - HMC user experience enhancements:

    +     - Usability and performance improvements

    +     - Enhancements to help connect global search

    +     - Quick view of serviceable events

    +     - More progress information for UI Wizards

    +   - Allow LPM/Remote Restart when virtual optical device is assigned to partition

    +   - Update Access Key Support'

    Table 2-25 lists the PCIe slots in the PCIe Gen3 I/O Expansion Drawer.


    Table 2-25 PCIe slot locations and descriptions for the PCIe Gen3 I/O Expansion
    Drawer


    | Slot | Location code | Description |

    |---|---|---|

    | Slot 1 | P1-C1 | PCIe Gen 3, x16 |

    | Slot 2 | P1-C2 | PCIe Gen 3, x8 |

    | Slot 3 | P1-C3 | PCIe Gen 3, x8 |

    | Slot 4 | P1-C4 | PCIe Gen 3, x16 |

    | Slot 5 | P1-C5 | PCIe Gen 3, x8 |

    | Slot 6 | P1-C6 | PCIe Gen 3, x8 |

    | Slot 7 | P2-C1 | PCIe Gen 3, x16 |

    | Slot 8 | P2-C2 | PCIe Gen 3, x8 |

    | Slot 9 | P2-C3 | PCIe Gen 3, x8 |

    | Slot 10 | P2-C4 | PCIe Gen 3, x16 |

    | Slot 11 | P2-C5 | PCIe Gen 3, x8 |

    | Slot 12 | P2-C6 | PCIe Gen 3, x8 |


    Consider the following points:


    +   - All slots support full-length, regular-height adapters or short (low-profile)
    adapters with a regular-height tailstock in single-wide, Gen3 BSCs.

    +   - Slots C1 and C4 in each PCIe Gen 3 6-slot Fanout Module are x16 PCIe Gen
    3 buses, and slots C2, C3, C5, and C6 are x8 PCIe buses.

    +   - All slots support enhanced error handling (EEH).

    +   - All PCIe slots are hot-swappable and support concurrent maintenance.


    Typical Slot priorities are listed in Table 2-26.


    Table 2-26 PCIe adapter slot priorities for the PCIe Gen3 I/O Expansion Drawer


    | Feature code | Description | Slot priorities |

    |---|---|---|

    | EMX0 | Typical Slot priorities | 1, 7, 4, 10, 2, 8, 3, 9, 5, 11, 6, 12 |


    For more information about slot priorities for individual adapters, see IBM Documentation.


    If the EMX0 PCIe Gen 3 Expansion Drawer is configured with two PCIe Gen 3 6-slot
    Fanout Modules, distribute the PCIe adapters across both I/O modules whenever
    possible


    Slots 1, 7, 4, and 10 support SR-IOV capabilities. However, if the total amount
    of physical memory is less than 128 GB, Slot 4 (P1-C4) and Slot 10 (P2-C4) are
    not SR-IOV capable.'
  - '[PAGE 116]


    Figure 2-27 shows the connection schematics between system node and PCIe Gen3
    I/O Expansion Drawer.


    ![](img/7c8373945565ba432037f60bbf8458eb_116_0.png)


    Figure 2-27 Connection schematics between system node and Expansion Drawer


    # General rules for the PCIe Gen3 I/O Expansion Drawer configuration


    The PCIe Gen 4 Cable Adapter (#EJ24) can be in any of the PCIe adapter slots in
    a Power E1080 server node. However, we advise that you first populate the PCIe
    adapter slots as per the slot priorities that are discussed in this section. If
    an I/O expansion drawer is present, the PCIe Gen 4 cable adapter (#EJ24) must
    be given the highest priority.


    Each processor module drives two PCIe Gen5 slots, and all slots are equal regarding
    their bandwidth characteristics. If you first use the slots following the slot
    priorities, you ensure that one PCIe Gen5 slot per processor module is populated
    before you use the second PCIe Gen5 slot of the processor modules.


    Table 2-27 lists the PCIe adapter slot priorities in the Power E1080 server. If
    the sequence is chosen as listed in the slot priority column, the adapters are
    assigned to the SCM in alignment with the internal enumeration order: SCM0, SCM1,
    SCM2, and SCM3.


    Table 2-27 PCIe adapter slot priorities


    | Feature code | Description | Slot priorities |

    |---|---|---|

    | EJ24 | PCIe Gen 4 Optical Cable Adapter for PCIe Gen 3 Expansion Drawer | 1,
    7, 3, 6, 2, 8, 4, 5 |'

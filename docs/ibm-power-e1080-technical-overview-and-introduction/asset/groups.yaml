    cause of the fault is captured without the need to re-create the problem or run
    any sort of extending tracing or diagnostics program when a fault is detected
    in a system. For most faults, a good FFDC design means that the root cause also
    can be detected automatically without service engineers’ intervention.


    FFDC information, error data analysis, and fault isolation are necessary to implement
    the advanced serviceability techniques that enable efficient service of the systems
    and to help determine the failing items.


    In the rare absence of FFDC and Error Data Analysis, diagnostics are required
    to re-create the failure and determine the failing items.


    ## 2.12.2 Diagnostics


    Diagnostics refers to identification of errors, symptoms, and determination of
    the potential causes of the errors identified.


    Power E1080 server is supplemented with several advanced troubleshooting and diagnostic
    routines that are available through multiple service interfaces, as discussed
    in 2.12.1, “Error detection” on page 130. For more information about the available
    aids, see the following IBM Documentation web pages:


    - Analyzing problems

    - Isolation procedures


    ### Reference codes


    These codes represent the system IPL status progress codes, OS IPL progress codes,
    dump progress codes, service request numbers (SRN) and so on, which serve as diagnostic
    aid to help determine the source of various hardware errors. Diagnostic applications
    report problems by means of SRNs.


    The support team and service engineers use this information with reference code-specific
    information to analyze and determine the source of errors or find more information
    about other isolation procedures.


    ### Automatic diagnostics


    The processor and memory FFDC is designed to perform without the need to recreate
    the problems or user intervention. Solid and intermittent errors are detected
    early and isolated at the time of failure. Runtime and boot-time diagnostics fall
    into this category.


    ### Stand-alone diagnostics


    These routines provide methods to test system resources by using diagnostics that
    are packaged on CDROM. They can be accessed by starting the system in service
    mode.


    ### Service processor diagnostic


    A service processor is self-sufficient to monitor unrecoverable errors in the
    system processor without the need of resources from the system processor. It also
    can monitor HMC connections and system thermal and operating environments, along
    with remote power control, reset, and maintenance functions.


    ## 2.12.3 Reporting


    If a system hardware or environmentally induced failure occurs, the system runtime
    error diagnostics analyze the hardware error signature to determine the cause
    of failure.


    The analysis is stored in the system NVRAM. The identified errors are reported
    to the operating system and recorded in the system logs of the operating system.


    For an HMC-managed system in PowerVM environment, an ELA routine analyzes the
    error, forwards the event to the Service Focal Point (SFP) application that is
    running on the HMC, and notifies the system administrator about isolation of likely
    cause of the system problem. The service processor event log also records unrecoverable
    checkstop conditions and forwards them to the SFP application.


    The system can call home from IBM i and AIX operating systems to report platform
    recoverable errors and errors that are associated with PCIe adapters and devices.
    In an HMC-managed system environment, a Call Home service request is started from
    the HMC and the failure report that carries parts information and part location
    is sent to IBM service organization.


    Along with such information, customer contact information and system-specific
    information, machine type, model, and serial number, and error logs also are sent
    to IBM service organization electronically.


    ## 2.12.4 Notification


    In this section, we describe the types of notifications that are available.


    ### Call Home


    HMC can notify service events that need IBM service organization attention, which
    uses the Call Home feature. Call Home helps to transmit error logs, server status,
    or other service-related information to the IBM service organization electronically.


    This feature is optional, but customers can gain significant advantages implementing
    the feature, such as faster problem determination and resolution and, in most
    cases, without customer notice or direct involvement. This feature also allows
    the IBM Service organization to register auto service tickets and send customer
    replaceable units (CRU) directly to the customer or dispatching a service engineer
    to the customer location.


    ### IBM Electronic Service Agent


    The Electronic Service Agent (ESA) provides automatic problem reporting functions
    and can potentially predict and prevent hardware errors by early detection of
    potential problems. It is supported by IBM i and AIX and is not separately charged
    for because it is part of the base operating system.


    ESA monitors and collects system inventory and service information, which is accessible
    from a secured web portal.


    For more information about ESA planning, implementation, and configuration, see
    the following web pages:


    - For AIX

    - For IBM i


    Customers who are skeptical about the information that is shared with IBM can
    be assured that security protocols are in place. Also, by registering with the
    IBM Electronics Services portal, the service information is accessible to customers.


    ## 2.12.5 Ease of location and service


    For maintenance procedures that need service engineers to interact physically
    with the system, such as hardware MES execution, concurrent maintenance, or replacement
    of non-concurrent maintainable components, the time that is required for overall
    service can be greatly improved by using specific system aided tools that can
    help with replacement procedures.


    Some of the aids that are available with Power E1080 system are discussed next.


    ### Service labels


    Placed at various locations on the system hardware, these labels provide the following
    ready-to-use, graphics-based information to perform physical maintenance on the
    system:


    - Location diagrams

    Typically, these diagrams consist of placement view of various hardware components
    (FRUs and CRUs) that are inside the server chassis. This information can help
    the service engineer to find the location of the FRUs that is being serviced or
    removed.

    - Remove/ or replace procedures

    A pictorial aid that shows the way to remove hardware components from the server
    chassis. For example, a picture can show thumbs that are pressing the latches,
    which can help release the component from its place.

    - Arrows

    Numbered arrows are used to indicate the order of actions and the serviceability
    direction of components. Some serviceable parts, such as latches, levers, and
    touch points, must be pulled or pushed in a specific direction and in a specific
    order for the mechanical mechanisms to engage or disengage.

    - Physical address diagrams

    These diagrams can help map the logical address of failed components to the physical
    address so that only intended components can be identified and serviced.


    ### QR labels


    QR labels are placed on the system to provide access to key service functions
    through a mobile device. When the QR label is scanned, the mobile device goes
    to server specific landing web pages that contain many of the service functions
    of interest while physically located beside the server rack in the data center.
    These functions include installation and repair instructions, service diagrams,
    and reference code look up.


    ### Packaging for service


    Power systems deliver great experiences with its ease of service operations design
    and unique physical packaging, which includes the following characteristics:


    - Color coding (touch points): Blue-colored touch points delineate touch points
    on service components where the component can be safely handled for service actions,
    such as removal or installation.

    - Tool-less design: Selected IBM systems support tool-less or simple tool designs.
    These designs require no tools or simple tools, such as flathead screw drivers,
    to service the hardware components.

    - Positive retention: Positive retention mechanisms help to assure proper connections
    between hardware components, such as cables to connectors, and between two cards
    that attach to each other. Without positive retention, hardware components run
    the risk of becoming loose during shipping or installation, which prevents a good
    electrical connection.


    Positive retention mechanisms, such as latches, levers, thumb-screws, pop Nylatches
    (U-clips), and cables are included to help prevent loose connections and aid in
    installing (seating) parts correctly. These positive retention items do not require
    tools.


    ### Concurrent maintenance


    The Power E1080 includes many physical components that allow concurrent maintenance,
    which frees the service engineer to bring the system down for maintenance. The
    following concurrent maintainable components of E1080 are available:


    - EXP24S SAS storage enclosure drawer

    - Drives in the EXP24S storage enclosure drawer

    - NVMe U.2 drives

    - PCIe extender cards, optical PCIe link I/O expansion card

    - PCIe I/O adapters

    - PCIe I/O drawers

    - PCIe to USB conversion card

    - SMP cables

    - System node AC power supplies: Two functional power supplies must remain installed
    at all times while the system is operating

    - System node fans

    - System control unit fans

    - System control unit operations panel

    - Time of Day clock battery

    - UPIC interface card in SCU

    - UPIC power cables from system node to system control unit


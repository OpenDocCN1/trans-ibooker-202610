    The Power E1080 has no integrated USB controlled or ports in the system nodes.
    The USB PCIe adapter must be used for enabling USB access. The PCIe2 2-PORT USB
    3.0 LP adapter (#EC6J) is supported in the system node. This adapter typically
    is placed in the PCIe Slot 4/5 of system node1 or node2.


    A USB Cable (#EC6N) is used for connecting the #EC6J adapter port to the rear
    side USB port in the system control unit (SCU), which is internally routed to
    a front-accessible USB port on the SCU (see Figure 2-22).



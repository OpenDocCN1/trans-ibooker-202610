    # 2.4 Capacity on-demand


    Starting with IBM Power Systems Private Cloud with Shared Utility Capacity (Power
    Enterprise Pools 2.0), multiple types of offerings are available on the Power
    E1080 server to help meet changing resource requirements in an on-demand environment
    by using resources that are installed on the system but that are not activated.


    For more information about CoD Activation codes, see Power Systems Capacity on
    Demand.


    # 2.4.1 New Capacity on Demand features


    The Power E1080 server features similar capabilities that are offered for the
    Power E980 server with a few changes:


    +   - With IBM Power Systems Private Cloud with Shared Utility Capacity (Power
    Enterprise Pools 2.0) configuration, it is possible to order a Power E1080 server
    with as few as one Base Processor Activation and 256 GB Base Memory activations.
    When the Power Enterprise Pools 2.0 configuration is used, all of the resources
    are activated; therefore, other CoD features are not supported.

    +   - Without IBM Power Systems Private Cloud with Shared Utility Capacity configuration:

    +     - Each Power System E1080 server requires a minimum of 16 permanent processor
    core activations that use static activations or Linux on Power activations. The
    remaining cores can be permanently or temporarily activated by using extra features.'
  - '[PAGE 90]


    +   - A minimum of 50% of installed memory capacity must have activations. These
    activations can be static, mobile, or Linux on Power.

    +   - At least 25% of memory capacity must have static activations or Linux on
    Power activations.

    +   - The Power E1080 server can participate in the same IBM Power Enterprise
    Pool 1.0 with other Power E1080 servers and with previous generation Power E980
    servers, but not with Power E870C, Power E880, and Power E880C servers.

    +   - CUoD, Pre-paid Elastic Capacity on Demand (4586-COD), and Trial Capacity
    on Demand (Trial CoD) are available with Power E1080 server.

    +   - Utility Capacity on Demand (Utility CoD) is not supported on Power E1080
    server.

    +   - Post-Pay Elastic CoD offering is not available on Power E1080 server.

    +   - Enterprise Capacity Backup (CBU) offering is not available on Power E1080
    server.

    +   - Mobile-Enabled activations are not available on Power E1080 server.


    # 2.4.2 IBM Power Systems Private Cloud with Shared Utility Capacity


    IBM Power Systems Private Cloud with Shared Utility Capacity solution (Power Enterprise
    Pools 2.0) is an infrastructure offering model that enables cloud agility and
    cost optimization with pay-for-use pricing.


    All installed processors and memory on systems in a pool are activated and made
    available for immediate use when a pool is started. Processor and memory usage
    on each server are tracked by the minute and aggregated across the pool.


    The capacity in this model consists of Base Activations and Capacity Credits,
    which are shared across the pool without having to move them from server to server.
    The unpurchased capacity in the pool can be used on a pay-as-you-go basis.


    Resource usage that exceeds the pool''s aggregated base resources is charged as
    metered capacity by the minute. It also is debited against purchased Capacity
    Credits on a real-time basis, as shown in Figure 2-14.


    ![](img/7c8373945565ba432037f60bbf8458eb_90_0.png)


    Figure 2-14 IBM Power Systems Private Cloud with Shared Utility Capacity'
  - '[PAGE 91]


    IBM Power Systems Private Cloud with Shared Utility Capacity solution is supported
    only on specific POWER9 and Power10 processor-based systems. Power E1080 servers
    can co-exist with Power E980 systems in the same pool.


    A single Power Enterprise Pool 2.0 supports up to 2000 VMs; up to 1000 VMs are
    supported per HMC. At the time of this writing, up to 200 VMs are supported per
    Power E1080 server, which is planned to be increased to 750 VMs per Power E1080.


    Besides processor and memory metering, Power Enterprise Pools 2.0 enables metering
    AIX and IBM i software entitlements and SLES and RHEL subscriptions in the pool.


    For more information and requirements, see IBM Power Systems Private Cloud with
    Shared Utility Capacity, SG24-8478.


    # 2.4.3 Static, Mobile, and Base activations


    Static processor and Memory activations are restricted to a single system. They
    are enabled by entering a code into the HMC that manages the system. The extra
    cores or memory are immediately available for use by workloads on the system.


    Static activations are available in two versions:


    +   ► Static activations: This standard processor or memory activation can run
    VIOS, AIX, IBM i, and Linux workloads

    +   ► Static activations for Linux: This processor or memory activation can run
    only VIOS and Linux workloads


    Mobile activations are ordered against a specific server, but can be moved to
    any server within the Power Enterprise Pool 1.0 and support any type of application.
    Mobile activations can be purchased in the initial order or with an MES upgrade.


    Base Processor and Memory activations are associated with a single system and
    initially act as Static activations. When a system is added to a Power Enterprise
    Pools 2.0 configuration, all of its Base activations are added to the pool''s
    base capacity.


    Base activations for processor and memory resources are available in the following
    types:


    +   ► Base activations: This processor or memory activation can run VIOS, AIX,
    IBM i and Linux workloads. Initially, Base activations act like Static activations
    until the system is added to a Power Enterprise Pool 2.0. Static and Mobile activations
    can be converted to Base activations with an MES order.

    +   ► Base Linux activations: This Base Processor activation can run only VIOS
    and Linux workloads.


    Table 2-7 lists the Static, Mobile, and Base processor activation features that
    are available for initial order on the Power E1080 server.


    Table 2-7 Static, Mobile, and Base processor activation features


    | Processor feature | EDP2 (3.65 - 3.90 GHz 40-core) | EDP3 (3.60 - 4.15 GHz 48-core)
    | EDP4 (3.55 - 4.00 GHz 60-core) |

    |---|---|---|---|

    | Static activation | EDPB | EDPC | EDPD |

    | Static activation for Linux | ELCL | ELCQ | ELCM |

    | Base activation | EPDC | EPDD | EPDS |

    | Base activation for Linux | EPDU | EPDW | EPDX |'
  - '[PAGE 92]


    | Processor feature | EDP2 (3.65 - 3.90 GHz 40-core) | EDP3 (3.60 - 4.15 GHz 48-core)
    | EDP4 (3.55 - 4.00 GHz 60-core) |

    |---|---|---|---|

    | Mobile activation | EDPZ | EDPZ | EDPZ |


    Table 2-8 lists the Static, Mobile, and Base memory activations that are available
    for initial order on the Power E1080 server.


    Table 2-8 Static, Mobile, and Base Memory activation features


    | Feature code | Description |

    |---|---|

    | EMAZ | 1 GB Memory activation for HEX - Static |

    | EMQZ | 100 GB Memory activation for HEX - Static |

    | EMBZ | 512 GB Memory activation for HEX - Static |

    | ELME | 512 GB Memory activations for Linux on Power HEX - Static |

    | EDAG | 256 GB Base Memory activation for Pools 2.0 |

    | EDAH | 512 GB Base Memory activation for Pools 2.0 |

    | EDAB | 100 GB DDR4 Mobile Memory Activation for HEX |

    | EMBK | 500 GB DDR4 Mobile Memory Activation for HEX |


    # 2.4.4 Capacity Upgrade on-Demand


    The Power E1080 server includes several active processor cores and memory units.
    It can also include inactive processor cores and memory units.


    Active processor cores or memory units are processor cores or memory units that
    are available for use on your server when it comes from the manufacturer. Inactive
    cores or units are processor cores or memory units that are included with your
    server, but not available for use until you activate them.


    Inactive processor cores and memory units can be permanently activated by purchasing
    an activation feature that is called CUoD and entering the provided activation
    code on the HMC for the server.


    With the CUoD offering, you can purchase more static processors or memory capacity
    and dynamically activate them without restarting your server or interrupting your
    business. All the static processor or memory activations are restricted to a single
    server.


    CUoD features several benefits that enable a more flexible environment. One benefits
    is reducing the initial investment in a system. Traditional projects that use
    other technologies means that a system must be acquired with all the resources
    available to support the entire lifecycle of the project. As a result, you pay
    up front for capacity that you do not need until the later stages of the project
    or possibly at all, which affects software licensing costs and software maintenance.


    By using CUoD, a company starts with a system with enough installed resources
    to support the entire project lifecycle, but uses only active resources that are
    necessary for the initial project phases. Resources can be added as the project
    proceeds by activating resources as needed. Therefore, a company can reduce the
    initial investment in hardware and acquire software licenses only when they are
    needed for each project phase, which reduces the total cost of ownership (TCO)
    and total cost of acquisition (TCA) of the solution.'
  md: "\n## Plug Sequence for the Remaining DDIMMs\n\nFor a Power E1080 drawer, the\
    \ next quad of DDIMMs sequence and rules are described in this section.\n\nFor\
    \ the next quad of DDIMMs to be installed in slots that are connected to one of\
    \ the four pSCMs, consider the following rules:\n\n- The DDIMMs within each quad\
    \ must be the same size and type.\n- All DDIMMs under each SCM must have the same\
    \ capacity.\n- The DDIMM quad can be different from the DDIMM quads plugged elsewhere,\
    \ including the other quad connected to the same SCM.\n- Plug the remaining quad\
    \ of DDIMMs in any of the remaining open quad of DIMM slots and all DDIMMs under\
    \ each SCM must have the same capacity\n\nAdhere to the following order and use\
    \ Figure 2-13 on page 73 as reference:\n\n- C52, C53, C54, C55 (slots connected\
    \ to SCM P1) or\n- C60, C61, C62, C63 (slots connected to SCM P3) or\n- C68, C69,\
    \ C70, C71 (slots connected to SCM P2) or\n- C76, C77, C78, C79 (slots connected\
    \ to SCM P0) or\n- C56, C57, C58, C59 (slots connected to SCM P1) or\n- C64, C65,\
    \ C66, C67 (slots connected to SCM P3) or\n- C72, C73, C74, C75 (slots connected\
    \ to SCM P2) or\n- C80, C81, C82, C83 (slots connected to SCM P0)\n\n> Note: In\
    \ a multi-system node configuration, a drawer can be fully populated. The other\
    \ drawers can be partially populated or have all the drawers symmetrically populated.\n\
    \n## 2.4 Capacity on-demand\n\nStarting with IBM Power Systems Private Cloud with\
    \ Shared Utility Capacity (Power Enterprise Pools 2.0), multiple types of offerings\
    \ are available on the Power E1080 server to help meet changing resource requirements\
    \ in an on-demand environment by using resources that are installed on the system\
    \ but that are not activated.\n\nFor more information about CoD Activation codes,\
    \ see Power Systems Capacity on Demand.\n\n### 2.4.1 New Capacity on Demand features\n\
    \nThe Power E1080 server features similar capabilities that are offered for the\
    \ Power E980 server with a few changes:\n\n- With IBM Power Systems Private Cloud\
    \ with Shared Utility Capacity (Power Enterprise Pools 2.0) configuration, it\
    \ is possible to order a Power E1080 server with as few as one Base Processor\
    \ Activation and 256 GB Base Memory activations. When the Power Enterprise Pools\
    \ 2.0 configuration is used, all of the resources are activated; therefore, other\
    \ CoD features are not supported.\n- Without IBM Power Systems Private Cloud with\
    \ Shared Utility Capacity configuration:\n  - Each Power System E1080 server requires\
    \ a minimum of 16 permanent processor core activations that use static activations\
    \ or Linux on Power activations. The remaining cores can be permanently or temporarily\
    \ activated by using extra features.\n  - A minimum of 50% of installed memory\
    \ capacity must have activations. These activations can be static, mobile, or\
    \ Linux on Power.\n  - At least 25% of memory capacity must have static activations\
    \ or Linux on Power activations.\n  - The Power E1080 server can participate in\
    \ the same IBM Power Enterprise Pool 1.0 with other Power E1080 servers and with\
    \ previous generation Power E980 servers, but not with Power E870C, Power E880,\
    \ and Power E880C servers.\n  - CUoD, Pre-paid Elastic Capacity on Demand (4586-COD),\
    \ and Trial Capacity on Demand (Trial CoD) are available with Power E1080 server.\n\
    \  - Utility Capacity on Demand (Utility CoD) is not supported on Power E1080\
    \ server.\n  - Post-Pay Elastic CoD offering is not available on Power E1080 server.\n\
    \  - Enterprise Capacity Backup (CBU) offering is not available on Power E1080\
    \ server.\n  - Mobile-Enabled activations are not available on Power E1080 server.\n\
    \n### 2.4.2 IBM Power Systems Private Cloud with Shared Utility Capacity\n\nIBM\
    \ Power Systems Private Cloud with Shared Utility Capacity solution (Power Enterprise\
    \ Pools 2.0) is an infrastructure offering model that enables cloud agility and\
    \ cost optimization with pay-for-use pricing.\n\nAll installed processors and\
    \ memory on systems in a pool are activated and made available for immediate use\
    \ when a pool is started. Processor and memory usage on each server are tracked\
    \ by the minute and aggregated across the pool.\n\nThe capacity in this model\
    \ consists of Base Activations and Capacity Credits, which are shared across the\
    \ pool without having to move them from server to server. The unpurchased capacity\
    \ in the pool can be used on a pay-as-you-go basis.\n\nResource usage that exceeds\
    \ the pool's aggregated base resources is charged as metered capacity by the minute.\
    \ It also is debited against purchased Capacity Credits on a real-time basis,\
    \ as shown in Figure 2-14.\n\n![](img/7c8373945565ba432037f60bbf8458eb_90_0.png)\n\
    \nFigure 2-14 IBM Power Systems Private Cloud with Shared Utility Capacity\n\n\
    IBM Power Systems Private Cloud with Shared Utility Capacity solution is supported\
    \ only on specific POWER9 and Power10 processor-based systems. Power E1080 servers\
    \ can co-exist with Power E980 systems in the same pool.\n\nA single Power Enterprise\
    \ Pool 2.0 supports up to 2000 VMs; up to 1000 VMs are supported per HMC. At the\
    \ time of this writing, up to 200 VMs are supported per Power E1080 server, which\
    \ is planned to be increased to 750 VMs per Power E1080.\n\nBesides processor\
    \ and memory metering, Power Enterprise Pools 2.0 enables metering AIX and IBM\
    \ i software entitlements and SLES and RHEL subscriptions in the pool.\n\nFor\
    \ more information and requirements, see IBM Power Systems Private Cloud with\
    \ Shared Utility Capacity, SG24-8478.\n\n### 2.4.3 Static, Mobile, and Base activations\n\
    \nStatic processor and Memory activations are restricted to a single system. They\
    \ are enabled by entering a code into the HMC that manages the system. The extra\
    \ cores or memory are immediately available for use by workloads on the system.\n\
    \nStatic activations are available in two versions:\n\n- Static activations: This\
    \ standard processor or memory activation can run VIOS, AIX, IBM i, and Linux\
    \ workloads\n- Static activations for Linux: This processor or memory activation\
    \ can run only VIOS and Linux workloads\n\nMobile activations are ordered against\
    \ a specific server, but can be moved to any server within the Power Enterprise\
    \ Pool 1.0 and support any type of application. Mobile activations can be purchased\
    \ in the initial order or with an MES upgrade.\n\nBase Processor and Memory activations\
    \ are associated with a single system and initially act as Static activations.\
    \ When a system is added to a Power Enterprise Pools 2.0 configuration, all of\
    \ its Base activations are added to the pool's base capacity.\n\nBase activations\
    \ for processor and memory resources are available in the following types:\n\n\
    - Base activations: This processor or memory activation can run VIOS, AIX, IBM\
    \ i and Linux workloads. Initially, Base activations act like Static activations\
    \ until the system is added to a Power Enterprise Pool 2.0. Static and Mobile\
    \ activations can be converted to Base activations with an MES order.\n- Base\
    \ Linux activations: This Base Processor activation can run only VIOS and Linux\
    \ workloads.\n\nTable 2-7 lists the Static, Mobile, and Base processor activation\
    \ features that are available for initial order on the Power E1080 server.\n\n\
    Table 2-7 Static, Mobile, and Base processor activation features\n\n| Processor\
    \ feature | EDP2 (3.65 - 3.90 GHz 40-core) | EDP3 (3.60 - 4.15 GHz 48-core) |\
    \ EDP4 (3.55 - 4.00 GHz 60-core) |\n|---|---|---|---|\n| Static activation | EDPB\
    \ | EDPC | EDPD |\n| Static activation for Linux | ELCL | ELCQ | ELCM |\n| Base\
    \ activation | EPDC | EPDD | EPDS |\n| Base activation for Linux | EPDU | EPDW\
    \ | EPDX |\n| Mobile activation | EDPZ | EDPZ | EDPZ |\n\nTable 2-8 lists the\
    \ Static, Mobile, and Base memory activations that are available for initial order\
    \ on the Power E1080 server.\n\nTable 2-8 Static, Mobile, and Base Memory activation\
    \ features\n\n| Feature code | Description |\n|---|---|\n| EMAZ | 1 GB Memory\
    \ activation for HEX - Static |\n| EMQZ | 100 GB Memory activation for HEX - Static\
    \ |\n| EMBZ | 512 GB Memory activation for HEX - Static |\n| ELME | 512 GB Memory\
    \ activations for Linux on Power HEX - Static |\n| EDAG | 256 GB Base Memory activation\
    \ for Pools 2.0 |\n| EDAH | 512 GB Base Memory activation for Pools 2.0 |\n| EDAB\
    \ | 100 GB DDR4 Mobile Memory Activation for HEX |\n| EMBK | 500 GB DDR4 Mobile\
    \ Memory Activation for HEX |\n\n### 2.4.4 Capacity Upgrade on-Demand\n\nThe Power\
    \ E1080 server includes several active processor cores and memory units. It can\
    \ also include inactive processor cores and memory units.\n\nActive processor\
    \ cores or memory units are processor cores or memory units that are available\
    \ for use on your server when it comes from the manufacturer. Inactive cores or\
    \ units are processor cores or memory units that are included with your server,\
    \ but not available for use until you activate them.\n\nInactive processor cores\
    \ and memory units can be permanently activated by purchasing an activation feature\
    \ that is called CUoD and entering the provided activation code on the HMC for\
    \ the server.\n\nWith the CUoD offering, you can purchase more static processors\
    \ or memory capacity and dynamically activate them without restarting your server\
    \ or interrupting your business. All the static processor or memory activations\
    \ are restricted to a single server.\n\nCUoD features several benefits that enable\
    \ a more flexible environment. One benefits is reducing the initial investment\
    \ in a system. Traditional projects that use other technologies means that a system\
    \ must be acquired with all the resources available to support the entire lifecycle\
    \ of the project. As a result, you pay up front for capacity that you do not need\
    \ until the later stages of the project or possibly at all, which affects software\
    \ licensing costs and software maintenance.\n\nBy using CUoD, a company starts\
    \ with a system with enough installed resources to support the entire project\
    \ lifecycle, but uses only active resources that are necessary for the initial\
    \ project phases. Resources can be added as the project proceeds by activating\
    \ resources as needed. Therefore, a company can reduce the initial investment\
    \ in hardware and acquire software licenses only when they are needed for each\
    \ project phase, which reduces the total cost of ownership (TCO) and total cost\
    \ of acquisition (TCA) of the solution.\n"
  mdcn: "\n\n## 剩余 DDIMM 的插接顺序\n\n对于 Power E1080 抽屉，本节描述了下一个 DDIMM 四件套的顺序和规则。\n\n\
    对于要安装在连接到四个 pSCM 之一的插槽中的下一个 DDIMM 四件套，请考虑以下规则：\n\n- 每个四件套内的 DDIMM 必须具有相同的尺寸和类型。\n\
    - 每个 SCM 下的所有 DDIMM 必须具有相同的容量。\n- DDIMM 四件套可以与别处插入的 DDIMM 四件套不同，包括连接到同一 SCM 的另一个四件套。\n\
    - 将剩余的 DDIMM 四件套插入任何剩余的空 DIMM 插槽四件套中，并且每个 SCM 下的所有 DDIMM 必须具有相同的容量\n\n请遵守以下顺序并以第\
    \ 73 页的图 2-13 为参考：\n\n- C52、C53、C54、C55（连接到 SCM P1 的插槽）或\n- C60、C61、C62、C63（连接到\
    \ SCM P3 的插槽）或\n- C68、C69、C70、C71（连接到 SCM P2 的插槽）或\n- C76、C77、C78、C79（连接到 SCM\
    \ P0 的插槽）或\n- C56、C57、C58、C59（连接到 SCM P1 的插槽）或\n- C64、C65、C66、C67（连接到 SCM P3 的插槽）或\n\
    - C72、C73、C74、C75（连接到 SCM P2 的插槽）或\n- C80、C81、C82、C83（连接到 SCM P0 的插槽）\n\n> 注意：在多系统节点配置中，抽屉可以完全填充。其他抽屉可以部分填充或所有抽屉对称填充。\n\
    \n## 2.4 按需容量\n\n从 IBM Power Systems Private Cloud with Shared Utility Capacity（Power\
    \ Enterprise Pools 2.0）开始，Power E1080 服务器上提供多种类型的服务，以帮助在按需环境中满足不断变化的资源需求，使用已安装在系统上但未激活的资源。\n\
    \n有关 CoD 激活码的更多信息，请参阅 Power Systems Capacity on Demand。\n\n### 2.4.1 新的按需容量功能\n\
    \nPower E1080 服务器具有与 Power E980 服务器提供的类似功能，但有一些变化：\n\n- 使用 IBM Power Systems Private\
    \ Cloud with Shared Utility Capacity（Power Enterprise Pools 2.0）配置时，可以订购仅具有一个基本处理器激活和\
    \ 256 GB 基本内存激活的 Power E1080 服务器。当使用 Power Enterprise Pools 2.0 配置时，所有资源都已激活；因此，其他\
    \ CoD 功能不受支持。\n- 不使用 IBM Power Systems Private Cloud with Shared Utility Capacity\
    \ 配置时：\n  - 每个 Power System E1080 服务器需要至少 16 个永久处理器核心激活，使用静态激活或 Linux on Power\
    \ 激活。其余核心可通过额外功能永久或临时激活。\n  - 必须对已安装内存容量的至少 50% 进行激活。这些激活可以是静态的、移动的或 Linux on\
    \ Power。\n  - 内存容量的至少 25% 必须具有静态激活或 Linux on Power 激活。\n  - Power E1080 服务器可以与\
    \ Power E980 服务器一起参与同一个 IBM Power Enterprise Pool 1.0，但不能与 Power E870C、Power E880\
    \ 和 Power E880C 服务器一起参与。\n  - CUoD、预付弹性按需容量（4586-COD）和试用按需容量（Trial CoD）可与 Power\
    \ E1080 服务器一起使用。\n  - 实用按需容量（Utility CoD）在 Power E1080 服务器上不受支持。\n  - 后付弹性 CoD\
    \ 服务在 Power E1080 服务器上不可用。\n  - 企业容量备份（CBU）服务在 Power E1080 服务器上不可用。\n  - Mobile-Enabled\
    \ 激活在 Power E1080 服务器上不可用。\n\n### 2.4.2 IBM Power Systems Private Cloud with Shared\
    \ Utility Capacity\n\nIBM Power Systems Private Cloud with Shared Utility Capacity\
    \ 解决方案（Power Enterprise Pools 2.0）是一种基础设施提供模式，可通过按使用付费的定价实现云敏捷性和成本优化。\n\n池中系统的所有已安装处理器和内存都已激活，并在池启动时可供立即使用。每个服务器上的处理器和内存使用情况按分钟跟踪并在整个池中汇总。\n\
    \n该模型中的容量由基本激活和容量积分组成，这些容量积分在池中共享，无需在服务器之间移动。池中未购买的容量可以按需付费使用。\n\n超过池汇总基本资源的资源使用量按分钟计费为计量容量。它还实时从购买的容量积分中扣除，如图\
    \ 2-14 所示。\n\n![](img/7c8373945565ba432037f60bbf8458eb_90_0.png)\n\n图 2-14 IBM\
    \ Power Systems Private Cloud with Shared Utility Capacity\n\nIBM Power Systems\
    \ Private Cloud with Shared Utility Capacity 解决方案仅支持特定 POWER9 和 Power10 处理器系统的系统。Power\
    \ E1080 服务器可以与同一池中的 Power E980 系统共存。\n\n单个 Power Enterprise Pool 2.0 支持多达 2000\
    \ 个 VM；每个 HMC 支持多达 1000 个 VM。截至本文撰写时，每个 Power E1080 服务器支持多达 200 个 VM，预计将增加到每个\
    \ Power E1080 750 个 VM。\n\n除了处理器和内存计量外，Power Enterprise Pools 2.0 还支持在池中计量 AIX\
    \ 和 IBM i 软件授权以及 SLES 和 RHEL 订阅。\n\n有关更多信息和要求，请参阅 IBM Power Systems Private Cloud\
    \ with Shared Utility Capacity，SG24-8478。\n\n### 2.4.3 静态、移动和基本激活\n\n静态处理器和内存激活仅限于单个系统。它们是通过在管理系统的\
    \ HMC 中输入代码来启用的。额外的核心或内存可立即供系统上的工作负载使用。\n\n静态激活有两种版本：\n\n- 静态激活：此标准处理器或内存激活可运行\
    \ VIOS、AIX、IBM i 和 Linux 工作负载\n- 适用于 Linux 的静态激活：此处理器或内存激活只能运行 VIOS 和 Linux 工作负载\n\
    \n移动激活针对特定服务器订购，但可以移动到 Power Enterprise Pool 1.0 中的任何服务器并支持任何类型的应用程序。移动激活可以在初始订单中购买，也可以用\
    \ MES 升级购买。\n\n基本处理器和内存激活与单个系统相关联，最初充当静态激活。当系统添加到 Power Enterprise Pools 2.0 配置时，其所有基本激活都将添加到池的基本容量中。\n\
    \n处理器和内存资源的基本激活有以下类型：\n\n- 基本激活：此处理器或内存激活可运行 VIOS、AIX、IBM i 和 Linux 工作负载。最初，基本激活就像静态激活一样，直到系统添加到\
    \ Power Enterprise Pool 2.0。静态和移动激活可以通过 MES 订单转换为基本激活。\n- 适用于 Linux 的基本激活：此基本处理器激活只能运行\
    \ VIOS 和 Linux 工作负载。\n\n表 2-7 列出了可在 Power E1080 服务器上初始订购的静态、移动和基本处理器激活功能。\n\n\
    表 2-7 静态、移动和基本处理器激活功能\n\n| 处理器功能 | EDP2（3.65 - 3.90 GHz 40 核） | EDP3（3.60 - 4.15\
    \ GHz 48 核） | EDP4（3.55 - 4.00 GHz 60 核） |\n|---|---|---|---|\n| 静态激活 | EDPB |\
    \ EDPC | EDPD |\n| 适用于 Linux 的静态激活 | ELCL | ELCQ | ELCM |\n| 基本激活 | EPDC | EPDD\
    \ | EPDS |\n| 适用于 Linux 的基本激活 | EPDU | EPDW | EPDX |\n| 移动激活 | EDPZ | EDPZ | EDPZ\
    \ |\n\n表 2-8 列出了可在 Power E1080 服务器上初始订购的静态、移动和基本内存激活。\n\n表 2-8 静态、移动和基本内存激活功能\n\
    \n| 功能代码 | 描述 |\n|---|---|\n| EMAZ | 1 GB 内存激活 HEX - 静态 |\n| EMQZ | 100 GB 内存激活\
    \ HEX - 静态 |\n| EMBZ | 512 GB 内存激活 HEX - 静态 |\n| ELME | 512 GB 适用于 Linux on Power\
    \ HEX 的内存激活 - 静态 |\n| EDAG | 256 GB Pools 2.0 的基本内存激活 |\n| EDAH | 512 GB Pools\
    \ 2.0 的基本内存激活 |\n| EDAB | 100 GB DDR4 移动内存激活 HEX |\n| EMBK | 500 GB DDR4 移动内存激活\
    \ HEX |\n\n### 2.4.4 按需容量升级\n\nPower E1080 服务器包括多个活动处理器核心和内存单元。它还可能包括非活动处理器核心和内存单元。\n\
    \n活动处理器核心或内存单元是在服务器从制造商处交付时可供您服务器使用的处理器核心或内存单元。非活动核心或单元是随服务器一起提供但在您激活它们之前不可使用的处理器核心或内存单元。\n\
    \n非活动处理器核心和内存单元可以通过购买名为 CUoD 的激活功能并在服务器的 HMC 上输入提供的激活代码来永久激活。\n\n使用 CUoD 服务，您可以购买更多静态处理器或内存容量并在不重新启动服务器或中断业务的情况下动态激活它们。所有静态处理器或内存激活都仅限于单个服务器。\n\
    \nCUoD 具有多种优势，可实现更灵活的环境。一个优势是减少系统初始投资。使用其他技术进行的传统项目意味着系统必须配备支持整个项目生命周期的所有资源。因此，您在项目后期阶段甚至可能永远不需要的容量上提前支付，这会影响软件许可成本和软件维护。\n\
    \n通过使用 CUoD，公司从具有足够已安装资源以支持整个项目生命周期的系统开始，但仅使用初始项目阶段所需的活动资源。随着项目的进行，可以通过按需激活资源来添加资源。因此，公司可以减少硬件的初始投资，并在每个项目阶段需要时才获取软件许可证，从而降低解决方案的总拥有成本（TCO）和总采购成本（TCA）。\n\
    \n"

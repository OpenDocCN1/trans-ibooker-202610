    | 系统机箱 | EDN1 | 5U 系统节点指示器抽屉 | 1 |\n| 灵活服务处理器 | EDFP | 灵活服务处理器 | 2 |\n| 面板 | EBAB\
    \ | IBM 架装抽屉面板和硬件 | 1 |\n| 处理器 | ► EDP2 ► EDP3 ► EDP4 | ► 40 核 (4x10) 典型 3.65\

    # 2.7 External I/O subsystems


    The I/O capacity of the Power E1080 can be expanded by using extra external PCIe
    Expansion Drawers and external SAS Disk Expansion Drawers.


    This section describes the PCIe Gen3 I/O Expansion Drawer (#EMX0) that can be
    attached to the Power E1080 server.


    At the initial availability, the Power E1080 supports four PCIe Gen3 I/O drawer
    per system node, which yields a maximum of eight I/O drawers per 2-node Power
    E1080 server configuration. One I/O drawer supports two Fanout Modules that offer
    six PCIe Gen 3 adapter slots each. This configuration delivers an extra 48 PCIe
    Gen 3 slot capacity per system node and a maximum of 96 PCIe Gen 3 slots per 2-node
    server.


    All eight slots in a system node can be used to cable the four I/O drawers. It
    is always recommended to balance the I/O Drawer connectivity across the available
    system nodes.'
  - '[PAGE 110]


    With the availability of 3-node and 4-node Power System E1080 configurations in
    later GA period, the number of PCIe Gen 3 I/O drawers scale accordingly with a
    maximum of 16 per 4-node Power E1080. A maximum of 48 PCIe Gen 3 slots per system
    node and a maximum of 192 PCIe Gen 3 slots per 4-node Power E1080 server to be
    available at that date.


    Each Fanout Module in the PCIe Gen 3 I/O Expansion Drawer (#EMX0) is attached
    by one optical cable adapter, which occupies one x16 PCIe Gen 4 slot of a system
    node.


    The maximum number of supported I/O drawers and the total number of PCIe slots
    are listed in Table 2-24.


    Table 2-24 Maximum number of supported I/O drawers and the total number of PCIe
    slots


    | System nodes | Maximum #EMX0 drawers | Total number of slots |  |  |

    | | | PCIe Gen 3, x16 | PCIe Gen 3, x8 | Total PCIe Gen 3 |

    | One system node | 4 | 16 | 32 | 48 |

    | Two system nodes | 8 | 32 | 64 | 96 |

    | Three system nodes | 12 | 48 | 96 | 144 |

    | Four system nodes | 16 | 64 | 128 | 192 |


    # 2.7.1 PCIe Gen 4 cable adapter


    The PCIe Gen3 I/O Expansion Drawer (#EMX0) is connected to the system node by
    using a PCIe Gen 4 I/O expansion card (#EJ24) that is placed in any of the PCIe
    slots with in the system node. One expansion card adapter connects to one PCIe
    Gen 3 6-slot Fanout Module (#EMXH) of the PCIe Gen3 I/O Expansion Drawer(#EMX0)
    using a CXP 16X Active Optical Cable (AOC) Pair. Therefore, the adapter is also
    named as PCIe Gen 4 CXP cable adapter.'
  - '[PAGE 111]


    The PCIe Gen 4 cable adapter is shown in Figure 2-24.


    ![](img/7c8373945565ba432037f60bbf8458eb_111_0.png)


    Figure 2-24 PCIe Gen 4 cable adapter (#EJ24)


    The PCIe Gen 4 cable adapter (#EJ24) is a half-height, half-length, low-profile
    PCIe Gen 4 x16 adapter. The adapter provides two ports for the attachment of CXP
    16x AOC pair. One adapter supports the attachment of one PCIe Gen 3 6-slot fanout
    module in a EMX0 PCIe Gen3 I/O expansion drawer.


    Although these cables are not redundant, the loss of one cable reduces the I/O
    bandwidth (that is, the number of lanes that are available to the I/O module)
    by 50%.


    A total of eight PCIe Gen 4 cable adapters (#EJ24) are allowed per system node
    to connect to maximum of eight PCIe Gen 3 6-slot Fanout Modules (#EMXH). Each
    Fanout Module must go with one CXP 16x AOC cable pair with both ports wired to
    the same PCIe Gen 4 cable adapter from the system node.


    The cable adapter can be placed in any slot in the system node. The following
    adapter placement sequence in the system node is recommended:


    ```

    System node slot 1, 7, 3, 6, 2, 8, 4, 5

    ```


    The maximum number of adapters that is supported is 8 per system node and 32 per
    system, having four system nodes.


    Whenever PCIe Gen3 I/O Expansion Drawer(#EMX0) is used, it is recommended to reserve
    the slots in the system nodes for the PCIe Gen 4 cable adapter (#EJ24) adapters.
    Place the high-profile adapters within the I/O Expansion Drawers.'
  - '[PAGE 112]


    Three different types of CXP 16x AOC cable pairs are available for the connection
    between PCIe Gen 4 cable adapter (#EJ24) and PCIe Gen 3 fanout module (#EMXH)
    of the I/O Expansion Drawer:


    +   - 2.0M (#ECCR)

    +     This cable is used when I/O drawer is in the *same* rack as the E1080 server.

    +   - 10.0M (#ECCY)

    +     This cable is used when the I/O drawer is in a *different* rack from the
    E1080 server.

    +   - 20.0M (#ECCZ)

    +   - Like the 10.0M (#ECCY) cable, these cables are used when I/O drawer is in
    a different rack from the E1080 server.


    > **Note:** One #ECCR, one #ECCY, or one #ECCZ includes two AOC cables.


    # 2.7.2 PCIe Gen3 I/O Expansion Drawer


    The PCIe Gen3 I/O Expansion Drawer (#EMX0) is a 4U high, PCIe Gen3-based and rack-mountable
    I/O drawer. It offers two PCIe Fanout Modules (#EMXH), each providing six PCIe
    Gen3 full-high, full-length slots (two x16 and four x8).


    The older Fanout Modules (#EMXF & #EMXG) that are used by Power E870, Power E870C,
    Power E880, and Power E880C systems cannot be ordered and is not supported with
    the Power system E1080.


    For more information about the dimensions of the drawer, see 1.6, “I/O drawers”
    on page 26.


    PCIe Gen 4 cable adapter (#EJ24) CXP 16X AOCs connects the system node to a PCIe
    Fanout Module in the I/O expansion drawer.


    Concurrent repair and addition or removal of PCIe adapters is done by using HMC-guided
    menus or operating system support utilities.


    A blind-swap cassette (BSC) is used to house the full-high adapters that are installed
    into these slots. The BSC is the same BSC that was used with the previous generation
    server’s #5802, #5803, #5877, and #5873 12X attached I/O drawers.


    Power consumption is up to 50W per adapter slot.'

    # 1.6.4 IBM System Storage


    The IBM System Storage Disk Systems products and offerings provide compelling
    storage solutions with superior value for all levels of business, from entry-level
    to high-end storage systems.


    IBM Storage simplifies data infrastructure by using an underlying software foundation
    to strengthen and streamline the storage in the hybrid cloud environment, which
    uses a simplified approach to containerization, management, and data protection.
    For more information about the various offerings, see this web page.


    The following section highlights a few of the offerings.


    # IBM FlashSystem Family


    The IBM FlashSystem® family is a portfolio of cloud-enabled storage systems designed
    to be easily deployed and quickly scaled to help optimize storage configurations,
    streamline issue resolution, and lower storage costs.


    IBM FlashSystem is built with IBM Spectrum® Virtualize software to help deploy
    sophisticated hybrid cloud storage solutions, accelerate infrastructure modernization,
    address security needs, and maximize value by using the power of AI. The products
    are designed to provide enterprise-grade functions without compromising affordability
    or performance. They also offer the advantages of end-to-end NVMe, the innovation
    of IBM FlashCore® technology, and SCM for ultra-low latency. For more information,
    see this web page.


    # IBM System Storage DS8000


    IBM DS8900F is the next generation of enterprise data systems that are built with
    the most advanced Power processor technology and feature ultra-low application
    response times.


    Designed for data-intensive and mission-critical workloads, DS8900F adds next-level
    performance, data protection, resiliency, and availability across hybrid cloud
    solutions through ultra-low latency, better than seven 9''s (99.99999) availability,
    transparent cloud, tiering, and advanced data protection against malware and ransomware.
    This enterprise class storage solution provides superior performance and higher
    capacity, which enables the consolidation of all mission critical workloads in
    one place.


    IBM DS8900F can provide 100% data encryption at-rest, in-flight and in the cloud.
    This flexible storage supports IBM Power, IBM Z®, and IBM LinuxONE. For more information,
    see this web page.


    # IBM SAN Volume Controller


    IBM SAN Volume Controller is an enterprise-class system that consolidates storage
    from over 500 IBM and third-party storage systems to improve efficiency, simplify
    management and operations, modernize storage with new capabilities, and enable
    a common approach to hybrid cloud regardless of storage system type.


    IBM SAN Volume Controller provides a complete set of data resilience capabilities
    with high availability, business continuance, and data security features. Storage
    supports automated tiering with AI-based IBM Easy Tier® that can help improve
    performance at a lower cost. For more information, see this web page.'

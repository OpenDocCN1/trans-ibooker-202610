  mdcn: '


    ## 逻辑分区


    LPAR 和虚拟化提高了系统资源的利用率，并增加了配置可能性。


    *逻辑分区*是指使一台服务器如同两台或多台独立服务器一样运行的能力。当你对服务器进行逻辑分区时，你将服务器上的资源划分为子集，称为 *LPAR*。你可以在
    LPAR 上安装软件，并且 LPAR 作为一个独立的逻辑服务器运行，使用你分配给该 LPAR 的资源。


    LPAR 在某些文档中也被称为 *虚拟机*（VM），这使其看起来与其它超visor提供的功能相似。然而，LPAR 提供了更高级别的安全性和隔离性以及本章中描述的其他功能。


    处理器、内存和 I/O 设备可以分配给 LPAR。AIX、IBM i、Linux 和 VIOS 都可以在 LPAR 上运行。VIOS 为运行通用操作系统的其他
    LPAR 提供虚拟 I/O 资源。


    LPAR 共享一些系统属性，例如系统序列号、系统型号和处理器 FC。所有其他系统属性可以因 LPAR 而异。


    ## 微分区


    当你使用微分区技术时，你可以将处理器的分数分配给一个 LPAR。使用处理器分数的 LPAR 也称为 *共享处理器分区* 或 *微分区*。微分区在称为 *共享处理器池*（SPP）的一组处理器上运行，并且使用虚拟处理器使操作系统能够管理分配给
    LPAR 的处理能力分数。


    从操作系统角度来看，除非操作系统得到增强以确定差异，否则虚拟处理器无法与物理处理器区分开来。物理处理器被抽象为可供分区使用的虚拟处理器。


    在基于 Power10 处理器的服务器上，分区可以定义的处理能力低至 0.05 个处理单元。该数字代表 0.05 个物理核心。每个物理核心可被多达 20 个共享处理器分区共享，并且分区的授权可以以小至
    0.05 个处理器的分数递增。共享处理器分区在 Power Hypervisor 的控制下在物理处理器上进行调度并进行时间片分配。共享处理器分区由 HMC
    创建和管理。


    Power E1080 支持单系统最多 240 个核心和 1000 个微分区（1000 是 PowerVM 支持的最大值）。


    注意：虽然 Power E1080 支持多达 1000 个微分区，但实际限制取决于服务器上使用的应用程序工作负载需求。


    ## 处理模式


    当你创建 LPAR 时，你可以为专用使用分配整个处理器，或从 SPP 分配部分处理单元。此设置定义了 LPAR 的处理模式。


    ## 专用模式


    在专用模式下，物理处理器作为整体分配给分区。Power10 处理器核心中的 SMT 功能允许核心同时运行来自两个、四个或八个独立软件线程的指令。


    ## 共享专用模式


    在基于 Power10 处理器的服务器上，你可以配置专用分区成为空闲处理器的处理器捐赠者，这些处理器归其所有，从而允许将专用处理器分区中的空闲 CPU 周期捐赠给
    SPP。专用分区对专用 CPU 周期保持绝对优先级。启用此功能可以帮助提高系统使用率，而不会损害专用处理器模式 LPAR 中关键工作负载的计算能力。


    ## 共享模式


    在共享模式下，LPAR 使用虚拟处理器访问物理处理器的分数。共享分区可以定义任意数量的虚拟处理器（最大数量为分配给分区的处理单元数的 20 倍）。Power
    Hypervisor 根据分区的处理单元授权将虚拟处理器调度到物理处理器。一个处理单元代表一个物理处理器的处理能力。所有分区获得的总 CPU 时间等于其处理单元的授权。逻辑处理器是在虚拟处理器之上定义的。因此，即使使用虚拟处理器，逻辑处理器的概念仍然存在，并且逻辑处理器的数量取决于
    SMT 是否打开或关闭。


    ### 3.1.2 多个共享处理器池


    MSPP 在基于 Power10 处理器的服务器上受支持。此功能允许系统管理员创建一个微分区集，其目的是控制可以从物理 SPP 使用的处理器容量。


    微分区被创建，然后被识别为默认处理器池或用户定义的 SPP 的成员。存在于微分区集内的虚拟处理器由 Power Hypervisor 监控。处理器容量根据用户定义的属性进行管理。


    如果 Power 服务器负载很重，则 SPP 内的每个微分区都保证其处理器授权，外加如果微分区未限制时可能从保留池容量分配的任何容量。


    如果 SPP 中的特定微分区未使用其处理能力授权，未使用的容量将被让出，并且同一 SPP 内的其他未限制微分区可以根据其未限制权重使用额外容量。这样，SPP
    的授权池容量就分配给该 SPP 内的微分区集。


    所有支持 MSPP 功能的 Power 服务器至少有一个（默认）SPP，最多可达 64 个 SPP。


    此功能有助于客户在软件或数据库许可证的成本取决于分配的处理器核心数量时，显著降低总体拥有成本（TCO）。


    ### 3.1.3 虚拟 I/O 服务器


    虚拟 I/O 服务器（VIOS）是 PowerVM 的一部分。它是允许在 LPAR 之间共享物理资源以实现更高效使用（例如，整合）的特定设备。在这种情况下，VIOS
    拥有物理 I/O 资源（SCSI、光纤通道、网络适配器或光学设备），并允许客户分区共享对其的访问，从而最大程度地减少并优化系统中的物理适配器数量。


    VIOS 消除了每个分区都拥有专用网络适配器、磁盘适配器和磁盘驱动器的要求。VIOS 支持 OpenSSH 以实现安全远程登录。它还提供防火墙以按端口、网络服务和
    IP 地址限制访问。


    图 3-1 显示了 VIOS 配置的概述。


    ![](img/7c8373945565ba432037f60bbf8458eb_154_0.png)


    在每个物理服务器上运行双 VIO 服务器是推荐的做法。


    ## 共享以太网适配器


    共享以太网适配器（SEA）可用于将物理以太网网络连接到虚拟以太网网络。SEA 通过将 Power Hypervisor VLAN 连接到外部交换机上的 VLAN
    来提供此访问。由于 SEA 在第 2 层处理数据包，因此数据包的原始 MAC 地址和 VLAN 标签对物理网络上的其他系统可见。支持 IEEE 802.1
    VLAN 标记。


    通过使用 SEA，多个客户分区可以共享一个物理适配器。你还可以使用物理适配器连接内部和外部 VLAN。SEA 服务只能托管在 VIOS 中（不能在通用 AIX
    或 Linux 分区中），并充当第 2 层网络桥，以安全地在虚拟以太网网络（内部）和一个或多个（Etherchannel）物理网络适配器（外部）之间传输网络流量。这些虚拟以太网网络适配器由
    VIOS 上的 Power Hypervisor 定义。


    ## 虚拟 SCSI


    虚拟 SCSI 用于查看 SCSI 协议的虚拟化实现。虚拟 SCSI 基于客户/服务器关系。VIOS LPAR 拥有物理 I/O 资源并充当服务器，或在 SCSI
    术语中充当目标设备。客户端 LPAR 作为客户端访问由 VIOS 提供的虚拟 SCSI 后备存储设备。


    '

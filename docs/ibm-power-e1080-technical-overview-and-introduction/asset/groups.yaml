    +   - Improved clock-gating

    +   - Reduced flush rates with improved branch prediction accuracy

    +   - Fusion and gather operating merging

    +   - Reduced number of ports and reduced access to selected structures

    +   - Effective address (EA)-tagged L1 data and instruction cache yield ERAT access
    only on a cache miss


    In addition to significant improvements in performance and energy efficiency,
    security represents a major architectural focus area. The Power10 processor core
    supports the following security features:


    +   - Enhanced hardware support that provides improved performance while mitigating
    for speculation-based attacks

    +   - Dynamic Execution Control Register (DEXCR) support

    +   - Return oriented programming (ROP) protection


    # 2.1.3 Simultaneous multithreading


    Each core of the Power10 processor supports multiple hardware threads that represent
    independent execution contexts. If only one hardware thread is used, the processor
    core runs in single-threaded (ST) mode.


    If more than one hardware thread is active, the processor runs in simultaneous
    multi-threading (SMT) mode. In addition to the ST mode, the Power10 processor
    supports the following different SMT modes:


    +   - SMT2: Two hardware threads active

    +   - SMT4: Four hardware threads active

    +   - SMT8: Eight hardware threads active


    SMT enables a single physical processor core to simultaneously dispatch instructions
    from more than one hardware thread context. Computational workloads can use the
    processor core''s execution units with a higher degree of parallelism. This ability
    significantly enhances the throughput and scalability of multi-threaded applications
    and optimizes the compute density for single-threaded workloads.


    SMT is primarily beneficial in commercial environments where the speed of an individual
    transaction is not as critical as the total number of transactions that are performed.
    SMT typically increases the throughput of most workloads, especially those workloads
    with large or frequently changing working sets, such as database servers and web
    servers.'

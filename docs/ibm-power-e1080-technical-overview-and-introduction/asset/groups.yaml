    \ 或 USB 控制台开关线缆。它支持使用 IBM Conversion Options 开关线缆（#4269）进行服务器的链式连接。该功能提供四根线缆，可将\
    \ KVM 开关连接到系统，或可在菊花链场景中使用，将多达 128 个系统连接到单个 KVM 开关。它还支持服务器端 USB 连接\n\n## 1.7.7\
    \ 原始设备制造商机架\n\n如果机架符合 19 英寸机架的 EIA-310-D 标准，则系统可安装在合适的 OEM 机架中。该标准由电气工业联盟发布。有关更多信息，请参阅\
    \ IBM Documentation。\n\nIBM Documentation 提供了一般的机架规格，包括以下信息：\n\n- 机架或机柜必须符合 1992\
    \ 年 8 月 24 日发布的 19 英寸机架 EIA 标准 EIA-310-D。EIA-310-D 标准规定了内部尺寸，例如机架开口的宽度（机箱宽度）、模块安装法兰的宽度以及安装孔间距。\n\
    - 前机架开口的最小宽度必须为 450 mm（17.72 in.），导轨安装孔的中心间距必须为 465 mm 加减 1.6 mm（18.3 in. 加减 0.06\
    \ in.）。\n\n图 1-13 是显示机架规格尺寸的俯视图。\n\n![](img/7c8373945565ba432037f60bbf8458eb_54_0.png)\n\
    \n图 1-13 机架规格（俯视图）\n\n- 安装孔之间的垂直距离必须由三孔组组成，从底部到顶部间距分别为 15.9 mm（0.625 in.）、15.9\
    \ mm（0.625 in.）和 12.7 mm（0.5 in.）中心距，使得每个三孔组的垂直孔间距为 44.45 mm（1.75 in.）中心距。\n\n"

    - 平台安全确保服务器免受篡改的强化、持续保护其完整性，并确保多租户工作负载之间的强隔离。没有强大的平台安全，所有其他系统安全措施都将面临风险。

    - 面向现代威胁的安全创新提供了利用新兴技术领先于新型网络安全威胁的能力。

    - 集成安全管理解决了确保整个堆栈中众多安全功能正确配置、监控它们，并在检测到意外更改时做出反应的关键挑战。


    Power E1080 已增强以简化并集成整个堆栈的安全管理，从而降低管理员错误发生的可能性。


    在 Power E1080 中，所有数据均由大大简化的端到端加密保护，该加密扩展到混合云且无可检测的性能影响，并为未来的网络威胁做好准备。


    Power10 处理器核心技术具有内置安全集成：


    - 通过更好的加密性能以及对量子安全加密和全同态加密（FHE）的支持，领先于当前和未来的数据威胁。

    - 通过更强的防御返回导向编程（ROP）攻击来增强应用程序的安全性。

    - 无需任何设置即可实现简化的单接口混合云安全管理。

    - 通过与基于 x86 处理器的服务器相关的超visor 相比，常见漏洞暴露（CVEs）低数个数量级，在业界提供最安全的虚拟机隔离来保护您的应用程序和数据。


    此外，Power E1080 上的工作负载可受益于加密算法加速，这使得诸如高级加密标准（AES）、SHA2 和 SHA3 等算法的运行速度比基于 POWER9
    处理器的服务器每个核心快得多。这种性能加速使得诸如 AIX 逻辑卷加密等功能能够以较低的性能开销启用。


    ## 3.4.1 加密引擎和透明内存加密


    Power10 处理器技术旨在实现显著更快的加密性能，AES 加密引擎数量增加四倍。与基于 IBM POWER9 处理器的服务器相比，Power E1080
    已针对当今最苛刻的标准以及预期未来的加密标准进行了更新，例如后量子和全同态加密（FHE），并为容器安全带来了新增强。


    透明内存加密旨在通过使用硬件功能实现无缝用户体验，从而简化加密并在不影响性能的情况下支持端到端安全。基础设施各层引入的保护如图 3-5 第 151 页所示。


    ![](img/7c8373945565ba432037f60bbf8458eb_164_0.png)


    图 3-5 使用透明内存加密保护内存中的数据


    ## 3.4.2 量子安全加密支持


    为迎接量子时代做好准备，Power E1080 构建为可高效支持未来加密，例如量子安全加密和 FHE。这些解决方案的软件库针对 Power10 处理器芯片指令集架构（ISA）进行了优化，并且已在或将会在各自的开源社区中提供。


    量子安全加密是指为在构建大规模量子计算机时做好准备而识别出对经典计算机和量子计算机攻击具有抗性的算法的努力。


    同态加密是指允许系统在不先解密数据的情况下对加密数据执行计算的加密技术。这些解决方案的软件库针对 Power 处理器芯片指令集架构（ISA）进行了优化。


    ## 3.4.3 IBM PowerSC 支持


    Power E1080 可受益于 IBM PowerSC 提供的集成安全管理功能：


    - IBM PowerSC

    - 用于在运行 AIX 的每个基于 Power 处理器的平台上管理安全和合规性的 Power 软件组合

    - IBM i 或受支持的发行版

    - Linux 版本


    PowerSC 正在引入更多功能，以帮助客户在整个堆栈中端到端管理安全，以领先于各种威胁。具体而言，PowerSC 2.0 增加了对端点检测和响应（EDR）、基于主机的入侵检测、阻止列表和
    Linux 的支持。


    ## 3.5 在运营数据存储位置运行人工智能


    用于 AI 和业务应用程序的独立平台使得在生产中部署 AI 变得困难。其结果是应用程序和数据访问的端到端可用性降低、由于将运营数据发送到外部 AI 平台并接收预测而产生开销导致违反服务水平协议的风险增加，以及管理不同环境和外部加速器的复杂性和成本增加。


    随着世界准备在任何地方部署 AI，关注点正从如何快速构建 AI 转向如何快速对 AI 进行推理。


    为支持这一转变，Power E1080 通过在每个基于 Power10 技术的处理器核心上配备四个矩阵数学辅助（MMA）单元来加速 AI，从而实现就地运行
    AI 以获得更快的业务洞察。处理器核心的强大执行能力，结合 MMA AI 加速、增强的 SIMD 和增强的数据带宽，为统计机器学习和推理工作负载的执行提供了外部加速器（如
    GPU）及其相关设备管理的替代方案。这些功能，加上在 Power E1080 平台上将 AI 模型执行的多环境与其它不同类型的环境进行整合的可能性，降低了成本，并为
    AI 带来了大大简化的解决方案堆栈。


    直接在 Power E1080 上运营化 AI 推理使 AI 更接近数据。这种能力使 AI 能够继承并受益于 Power10 处理器平台的企业级服务质量（QoS）：可靠性、可用性和安全性，并支持性能提升。企业业务工作流程现在可以随时、一致地使用由
    AI 支持构建的洞察。


    Power10 处理器核心上的数据引力使用使得 AI 可以在数据库操作期间或与应用程序并发运行。例如，这对于时间敏感的用例至关重要。它能更快地将新鲜输入数据提供给
    AI，并提高洞察的质量和速度。


    随着无代码应用程序开发、按需使用模型仓库、自动机器学习和 AI 赋能的应用程序供应商的不断发展和增长，对应的软件产品被引入到 Power10 平台。Python
    以及来自 TensorFlow、PyTorch 和 XGBoost 等主要框架和工具的代码可在基于 Power10 处理器的平台上无需任何更改即可运行。


    开放神经网络交换（ONNX）模型可以从基于 x86 处理器的服务器或其他平台或小型虚拟机或 Power Virtual Server（PowerVS）迁移到
    Power E1080 进行部署，这使客户能够在商品硬件上构建，但在企业服务器上部署。


    Power10 处理器核心架构包含嵌入式矩阵数学加速器（MMA）。该 MMA 推算到 E1080 系统可提供高达 5 倍更快的 FP32 AI 推理，以将
    AI 融入业务应用程序并推动更深入的洞察，或在使用 Bfloat16 和 INT8 等降低精度数据类型时提供高达 10 倍更快的 AI 推理，与上一代基于
    Power9 的服务器相比。


    IBM 优化了数学库，以便 AI 工具受益于 Power10 芯片的 MMA 单元提供的加速。MMA 动作的好处可用于统计机器学习和推理，这为外部加速器或
    GPU 提供了具有成本效益的替代方案。


    ### 3.5.1 在任何地方训练，在 Power E1080 上部署


    IBM 基于 Power10 处理器的技术通过硬件和软件创新解决了挑战。在基于 Power 或 x86 处理器的服务器（即使字节序不同）的任何云上训练的模型都可以在
    Power E1080 上部署并无需任何更改即可运行。


    Power10 核心配备了四个用于矩阵和张量数学的数学引擎。应用程序可以在无需外部加速器、GPU 或额外 AI 平台的情况下，使用本地化数据运行模型。Power10
    技术采用“在任何地方训练，在此部署”原则来运营化 AI。


    模型可以在公共或私有云上进行训练（见图 3-6），使用以下流程：


    1. 模型连同其版本一起在所谓的 *模型库* 中注册，该库是一个 VM 或 LPAR，其中包含 Watson Openscale、BentoML 或 Tensorflow
    Serving 等工具。

    2. 模型被推送到目标（在本例中为运行数据库和应用程序的 VM 或 LPAR），模型可能被数据库或应用程序使用。

    3. 数据库和应用程序接收的交易触发模型执行并生成预测或分类。这些预测也可以本地存储。例如，这些预测可以是与交易或产品分类相关的风险或欺诈，供下游应用程序使用。

    4. 模型输出（预测或分类）的副本被发送到模型运营（ModelOps）引擎，用于通过与 Ground Truth 比较来计算漂移。

    5. 如果漂移超过阈值，则会生成模型重训练触发器。

    6. 重训练后的模型随后经过步骤 1 - 5。


    ![](img/7c8373945565ba432037f60bbf8458eb_166_0.png)


    图 3-6 运营化 AI


    通过软件和硬件创新的结合，Power E1080 可以满足注入 AI 的数据库和应用程序的模型性能、响应时间和吞吐量 KPI。



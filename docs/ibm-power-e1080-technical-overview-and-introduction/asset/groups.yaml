    | Memory | ► EVC1 ► EVC2 ► EVC3 ► EVC4 | ► 128 GB (4x32 GB) DDIMMs, 3200 MHz,
    16 GBIT DDR4 Memory ► 256 GB (4x64 GB) DDIMMs, 3200 MHz, 16 GBIT DDR4 Memory ►

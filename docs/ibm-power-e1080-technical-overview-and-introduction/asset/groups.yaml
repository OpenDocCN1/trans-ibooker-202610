    IBM PowerVC gives IBM Power Systems customers the following advantages:


    - It is deeply integrated with Power Systems.

    - It provides virtualization management tools.

    - It eases the integration of servers that are managed by PowerVM in automated
    IT environments, such as clouds.

    - It is a building block of IBM Infrastructure as a Service (IaaS), based on Power
    Systems.

    - PowerVC integrated with other cloud management tool, such as Ansible, Terraform,
    or OpenShift, and can be integrated into orchestration tools, such as the IBM
    Cloud® Automation Manager, VMware vRealize, or the SAP Landscape Management (LaMa).

    - PowerVC also provides an easy exchange of VM images between private and public
    clouds.


    IBM PowerVC is an addition to the PowerVM set of enterprise virtualization technologies
    that provide virtualization management. It is based on open standards and integrates
    server management with storage and network management.


    Because IBM PowerVC is based on the OpenStack initiative, Power Systems can be
    managed by tools that are compatible with OpenStack standards. When a system is
    controlled by IBM PowerVC, it can be managed in one of three ways:


    - By a system administrator by using the IBM PowerVC graphical user interface
    (GUI)

    - By a system administrator that uses scripts that contain the IBM PowerVC Representational
    State Transfer (REST) application programming interfaces (APIs)

    - By higher-level tools that call IBM PowerVC by using standard OpenStack API


    The following PowerVC offerings are positioned within the available solutions
    for Power Systems cloud:


    - IBM PowerVC: Advanced Virtualization Management

    - IBM PowerVC for Private Cloud: Basic Cloud

    - IBM Cloud Automation Manager: Advanced Cloud

    - VMware vRealize: Advanced Cloud


    PowerVC provides a systems management product that enterprise customers require
    to manage effectively the advanced features that are offered by IBM premium hardware.
    It reduces resource use and manages workloads for performance and availability.



    \ |\n| 5762 | DVD-RAM USB Optical Drive | Available |\n| 5763 | DVD Front USB\
    \ Port Sled with DVD-RAM USB Drive | Available |\n| 5757 | DVD RAM Slim USB Optical\
    \ Drive | Available |\n| 8348 | LTO Ultrium 6 Half High Fibre Tape Drive | Available\
    \ |\n| 8341 | LTO Ultrium 6 Half High SAS Tape Drive | Available |\n| 8441 | LTO\
    \ Ultrium 7 Half High SAS Tape Drive | Available |\n| 8546 | LTO Ultrium 8 Half\
    \ High Fibre Tape Drive | Available |\n| EU03 | RDX 3.0 Removable Disk Docking\
    \ Station | Available |\n\n以下选项可用：\n\n- LTO Ultrium 6 Half-High 2.5 TB SAS and\

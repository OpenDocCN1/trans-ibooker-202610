  mdcn: "\n\n要确定 NVMe 设备的剩余寿命，请完成以下步骤：\n\n- 对于 IBM AIX 操作系统：\n  a. 从 AIX 命令行输入 diag\
    \ 并按 Enter。\n  b. 从功能选择菜单中，选择任务选择 → NVMe 通用健康信息。\n  c. 选择要检查剩余寿命的 NVMe 设备并按 Enter。\n\
    \  d. 查看已使用的 NVM 子系统寿命百分比字段。\n\n- 对于 Linux 操作系统。\n  a. 从 Linux 命令行输入以下命令并按 Enter：\n\
    \  `nvme smart-log /dev/nvmeX -H`\n  其中 nvmeX 是 NVMe 设备的资源名称。\n  b. 查看已使用百分比字段。\n\
    \n接近使用寿命末期的 NVMe 设备必须更换。设备很快将达到支持的写入操作次数限制。写入 NVMe 设备的操作会随着时间推移变慢，最终 NVMe 设备将成为只读设备。\n\
    \n当操作系统向只读设备写入数据时，写入操作将被拒绝，操作系统会将其视为发生故障。要支持正常的写入操作，必须更换 NVMe 设备。\n\n## 2.5.3\
    \ USB 子系统\n\nPower E1080 在系统节点中没有集成 USB 控制器或端口。必须使用 USB PCIe 适配器来启用 USB 访问。系统节点支持\
    \ PCIe2 2 端口 USB 3.0 LP 适配器（#EC6J）。该适配器通常放置在系统节点 1 或节点 2 的 PCIe 插槽 4/5 中。\n\n\
    USB 电缆（#EC6N）用于将 #EC6J 适配器端口连接到系统控制单元（SCU）后侧的 USB 端口，该端口内部路由到 SCU 上的前面板可访问 USB\
    \ 端口（见图 2-22）。\n\n![](img/7c8373945565ba432037f60bbf8458eb_103_0.png)\n\n以下 USB\
    \ 设备受支持并可用于 Power E1080：\n\n- #EUA5 - 带电缆的独立 USB DVD 驱动器\n- #EUA4 - RDX USB 外部停靠站\n\
    \n图 2-23 中显示了 SCU 的前面视图，其中突出显示了系统 USB 端口和 FSP USB 端口。\n\n![](img/7c8373945565ba432037f60bbf8458eb_104_0.png)\n\
    \n图 2-23 显示系统 USB 端口和 FSP USB 端口的 SCU 前视图\n\n## 2.5.4 PCIe 插槽功能\n\n每个系统节点提供 8\
    \ 个 PCIe Gen5 热插拔启用插槽；因此，1 节点系统提供八个插槽，2 节点系统提供 16 个插槽，3 节点系统提供 24 个插槽，4 节点系统提供\
    \ 32 个插槽。\n\n您可以在每个节点上连接多达四个 I/O 扩展抽屉功能 EMX0，其插槽容量如表 2-14 所列。\n\n表 2-14 不同系统节点配置的\
    \ PCIe 插槽可用性\n\n| 系统节点数 | I/O 扩展数 | LP 插槽 | 全高插槽 |\n|---|---|---|---|\n| 1 | 4\
    \ | 8 | 48 |\n| 2 | 8 | 16 | 96 |\n| 3 | 12 | 24 | 144 |\n| 4 | 16 | 32 | 192\
    \ |\n\n每个 I/O 扩展抽屉由两个风扇模块功能 EMXH 组成，每个模块提供六个 PCIe 插槽。每个风扇模块通过一对 CXP 电缆功能连接到系统。CXP\
    \ 电缆功能列于表 2-15。列表中的仅 RPO 电缆不可用于新订购或 MES 升级，但可用于从源系统迁移。选择较长长度的功能以在机架间连接系统节点和扩展抽屉。\n\
    \n表 2-15 光纤 CXP 电缆功能\n\n| 功能代码 | CCIN | 描述 | OS 支持 | 订单类型 |\n|---|---|---|---|---|\n\
    | ECCR |  | PCIe Gen 3 扩展抽屉用 2M 有源光缆对 |  | 两者 |\n| ECCY |  | PCIe Gen 3 扩展抽屉用\

    \n可移动 RDX 驱动器位于坚固的盒中，插入 RDX 可移动（USB）磁盘停靠站（#1103 或 #EU03）中。RDX 驱动器与停靠站兼容，这些停靠站安装在\
    \ POWER8、POWER9 和 Power10 处理器服务器内部，视情况而定。\n\n图 1-12 显示了 IBM System Storage 7226\
    \ 多媒体机箱。\n\n![](img/7c8373945565ba432037f60bbf8458eb_53_0.png)\n\nIBM System Storage\
    \ 7226 多媒体机箱提供客户可更换单元（CRU）维护服务，以帮助使新驱动器的安装或更换更高效。其他 7226 组件也设计用于 CRU 维护。\n\nIBM\

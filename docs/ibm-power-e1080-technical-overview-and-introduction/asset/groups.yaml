    \ 7 驱动器提供最高 300 MBps 的数据速率，带压缩。它还提供与 Ultrium 7 和 Ultrium 6 介质格式的读写兼容性，以及与 Ultrium\
    \ 5 介质格式的只读兼容性。通过使用数据压缩，LTO-7 磁带盒可存储多达 15TB 的数据。\n- LTO Ultrium 8 驱动器提供最高 300\

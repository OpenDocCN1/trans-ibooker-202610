    ### 2.1.1 Power10 处理器概述


    Power10 处理器是一种超标量对称多处理器，采用互补金属氧化物半导体（CMOS）7 nm 光刻工艺制造，金属层数为 18 层。处理器包含最多 15 个核心，支持八路同时多线程（SMT8）独立执行上下文。


    每个核心可私有访问 2 MB L2 缓存，并可本地访问 8 MB L3 缓存容量。特定核心的本地 L3 缓存区域也可被处理器芯片上的所有其他核心访问。一个
    Power10 处理器的核心共享最多 120 MB 的延迟优化非一致缓存访问（NUCA）L3 缓存。


    处理器支持以下三种不同的功能接口，所有接口均可运行高达 32 GTps² 的信号速率：


    - 开放内存接口

    Power10 处理器具有八个内存控制器单元（MCU）通道，每个通道支持一个开放内存接口（OMI）端口，每个端口有两个 OMI 链路³。 一个 OMI 链路聚合
    8 条以 32 GTps 速度运行的通道，并连接到一个内存缓冲差分 DIMM（DDIMM）插槽以访问主内存。 物理上，OMI 接口实现在两个独立的裸片区域，每个区域有
    8 个 OMI 链路。 所有 128 个 OMI 通道的聚合最大理论全双工带宽为 1 TBps。


    - SMP 结构互连（PowerAXON）

    Power10 处理器中总共提供 144 条通道，用于在对称多处理（SMP）架构配置中与其他处理器连接。 每个 SMP 连接需要 18 条通道，每个方向 8
    条数据通道加 1 条备用通道（2 x(8+1)）。 这样处理器最多可支持八个 SMP 连接，每个处理器总共 128 条数据通道。 这种配置在所有 SMP 连接上的聚合最大理论全双工带宽为
    1 TBps。

    接口实现的通用性也允许使用 128 条数据通道通过 OpenCAPI 协议潜在地连接加速器或内存设备。 它还可支持内存集群和内存拦截架构。

    由于该技术的多功能特性，它也被称为 PowerAXON 接口（Power A-bus/X-bus/OpenCAPI/Networking⁴）。 OpenCAPI
    以及内存集群和内存拦截用例可在未来进行，并目前未被现有技术产品使用。


    ### PCIe 版本 5.0 接口


    为了支持外部 I/O 连接和访问内部存储设备，Power10 处理器提供差分外围组件互连快速版 5.0 接口总线（PCIe Gen 5），总共 32 条通道。
    通道分为两组，每组 16 条，可用于以下配置之一：


    - 1 x16 PCIe Gen 4

    - 2 x8 PCIe Gen 4

    - 1 x8, 2 x4 PCIe Gen 4

    - 1 x8 PCIe Gen 5, 1 x8 PCIe Gen 4

    - 1 x8 PCIe Gen 5, 2 x4 PCIe Gen 4



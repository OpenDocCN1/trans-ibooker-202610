    Power E1080 服务器支持 PCIe 适配器的并发维护（热插拔）。适配器盒配备了三个 LED，可指示电源和活动（绿色）、适配器（标记为 C0）的识别功能（琥珀色）以及盒的故障功能
    LED（琥珀色）。服务器可以通过机箱上的蓝色识别 LED 进行定位。


    内部连接如图 2-18 所示。



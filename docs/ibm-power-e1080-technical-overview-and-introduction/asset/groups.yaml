  mdcn: "\n\n## 表 1-4 Power E1080 环境要求和噪声排放\n\n| 属性 | 环境 |  |  |\n|  | 运行 |  | 非运行\
    \ |\n|  | 推荐 | 允许 |  |\n| 温度 | 18.0°C – 27.0°C (64.4°F – 80.6°F) | 5.0°C – 40.0°C\

    # 2.1.4 Matrix-multiply assist AI workload acceleration


    The matrix-multiply assist (MMA) facility was introduced by the Power Instruction
    Set Architecture (ISA) v3.1. The related instructions implement numerical linear
    algebra operations on small matrices and are meant to accelerate computation-intensive
    kernels, such as matrix multiplication, convolution, and discrete Fourier transform.


    To efficiently accelerate MMA operations, the Power10 processor core implements
    a dense math engine (DME) microarchitecture that effectively provides an accelerator
    for cognitive computing, machine learning, and AI inferencing workloads.


    The DME encapsulates compute efficient pipelines, a physical register file, and
    associated data-flow that keeps resulting accumulator data local to the compute
    units. Each MMA pipeline performs outer-product matrix operations, reading from
    and writing back a 512-bit accumulator register.


    Power10 implements the MMA accumulator architecture without adding an architected
    state. Each architected 512-bit accumulator register is backed by four 128-bit
    Vector Scalar eXtension (VSX) registers.


    Code that uses the MMA instructions is included in OpenBLAS and Eigen libraries.
    This library can be built by using the most recent versions of GNU Compiler Collection
    (GCC) compiler. The latest version of OpenBLAS is available at this web page.


    OpenBLAS is used by Python-NumPy library, PyTorch, and other frameworks, which
    makes it easy to use the performance benefit of the Power10 MMA accelerator for
    AI workloads.


    For more information about the implementation of the Power10 processor’s high
    throughput math engine, see the white paper A matrix math facility for Power ISA
    processors.


    For more information about fundamental MMA architecture principles with detailed
    instruction set usage, register file management concepts, and various supporting
    facilities, see Matrix-Multiply Assist Best Practices Guide, REDP-5612.'

    Table 1-21 lists the available wall power cord options for the 7188 and High Function
    PDUs and iPDU features, which must be ordered separately.


    # Table 1-21 Wall power cord options for the PDU and iPDU features


    | Feature code | Wall plug | Rated voltage (V AC) | Phase | Rated amperage | Geography
    |

    |---|---|---|---|---|---|

    | 6653 | IEC 309, 3P+N+G, 16 A | 230 | 3 | 16 amps/phase | Internationally available
    |

    | 6489 | IEC309 3P+N+G, 32 A | 230 | 3 | 32 amps/phase | EMEA |

    | 6654 | NEMA L6-30 | 200 - 208, 240 | 1 | 24 amps | US, Canada, LA, and Japan
    |

    | 6655 | RS 3750DP (watertight) | 200 - 208, 240 | 1 | 24 amps | US, Canada, LA,
    and Japan |

    | 6656 | IEC 309, P+N+G, 32 A | 230 | 1 | 24 amps | EMEA |

    | 6657 | PDL | 230-240 | 1 | 32 amps | Australia, New Zealand |

    | 6667 | PDL | 380-415 | 3 | 32 amps | Australia, New Zealand |

    | 6658 | Korean plug | 220 | 1 | 30 amps | North and South Korea |

    | 6492 | IEC 309, 2P+G, 60 A | 200 - 208, 240 | 1 | 48 amps | US, Canada, LA,
    and Japan |

    | 6491 | IEC 309, P+N+G, 63 A | 230 | 1 | 63 amps | EMEA |


    > Notes: Ensure that the suitable power cord feature is configured to support
    the power that is being supplied. Based on the power cord that is used, the PDU
    can supply 4.8 - 19.2 kVA. The power of all the drawers that are plugged into
    the PDU must not exceed the power cord limitation.


    To better enable electrical redundancy, each CEC has four power supplies that
    must be connected to separate PDUs, which are not included in the base order.


    For maximum availability, a preferred approach is to connect power cords from
    the same system to two separate PDUs in the rack, and to connect each PDU to independent
    power sources.


    For more information about power requirements of and the power cord for the 7965-94Y
    rack, see IBM Documentation.'

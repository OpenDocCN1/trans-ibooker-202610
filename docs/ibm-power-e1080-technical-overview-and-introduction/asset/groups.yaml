  mdcn: "\n\n## 1.7.4 PDU 连接限制\n\n支持两种可能的 PDU 额定值：60/63 安培和 30/32 安培。PDU 额定值由用于将 PDU\
    \ 连接到电气供电的电源线确定。每个电源线支持的系统节点数和 I/O 扩展抽屉数列于表 1-22。\n\n表 1-22 按电源线最大支持机柜数\n\n| Feature\
    \ code | Wall plug | PDU Rating | Maximum supported system nodes per PDU pair\
    \ | Maximum supported I/O drawers with no system nodes |\n|---|---|---|---|---|\n\
    | 6653 | IEC 309, 3P+N+G, 16 A | 60 Amps | Two system nodes and 1 I/O expansion\

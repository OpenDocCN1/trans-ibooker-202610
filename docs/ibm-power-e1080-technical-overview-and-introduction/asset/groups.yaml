    that memory be installed in all memory slots and evenly across all system node
    drawers and all SCMs in the system.


    Balancing memory across the installed system planar cards enables memory access
    in a consistent manner and typically results in better performance for your configuration.


    The Active Memory Expansion (AME) feature is an option that can increase the effective
    memory capacity of the system. AME uses the on-chip nest accelerator (NX) unit
    to compress or decompress memory content. This separately priced hardware feature
    is enabled at partition (LPAR) level. The related LPAR profile parameter allows
    it to configure the compression factor in accordance with memory capacity needs
    and performance trade-off consideration.'
  - '[PAGE 88]


    # 2.3.2 Memory placement rules


    In a Power E1080 single node system, each SCM must have eight of the 16 memory
    DDIMMs slots populated. Only increments of four DDIMMs are supported, all of which
    have the same capacity. These four DDIMMs must all be plugged into four of the
    eight remaining slots that are connected to an SCM.


    DDIMMs cannot be installed in such a way that an odd number of DDIMM slots are
    populated behind an SCM. DDIMMs also cannot be installed in a configuration that
    results in 10 or 14 DDIMM slots being populated behind an SCM. The only valid
    number of DDIMMs plugged into slots connected to a specific SCM is 8, 12, or 16.


    The Power E1080 system must adhere to the following DDIM plug rules:


    +   - Minimum memory that is allowed is 1 TB (see 1.5.1, “Minimum configuration”
    on page 15).

    +   - All DDIMMs under each SCM must have the same capacity.

    +   - DDIMMs must be plugged in groups of four (quads).

    +   - Each DDIMM quad must all be the same size and type (identical to each other)
    and must be the same with other DDIMM quads under each SCM, but can be different
    from other DDIMM quads from other SCMs.


    For example, in a one system node configuration:


    +   - First SCM can be connected to 8x32 GB DDIMMS

    +   - Second SCM can be connected to 8x64 GB DDIMMS

    +   - Third SCM can be connected to 8x128 GB DDIMMS

    +   - Forth SCM can be connected to 8x256 GB DDIMMS


    Overall system performance improves when all the quads match each other. Physical
    memory features from a previous generation of servers cannot be migrated to Power
    E1080.


    For the best possible performance, it is generally recommended that memory be
    installed in all memory slots and evenly across all system node drawers and all
    SCMs in the system.


    Balancing memory across the installed system planar cards enables memory access
    in a consistent manner and typically results in better performance for your configuration.


    You must account for any plans for future memory upgrades when you decide which
    memory feature size to use at the time of the initial system order.


    # Plug sequence for minimum memory


    A Power E1080 drawer requires a minimum of 32 DDIMMs. Two quads of DDIMMs per
    SCM are required.


    Spreading the DDIMMs evenly between the two memory controllers provides maximum
    performance. The DDIMMs within each quad must be the same size and type and all
    the DDIMMs under each SCM have to be same capacity.


    A DDIMM quad can be different from the DDIMM quads plugged elsewhere.


    Adhere to the following order to plug the 32 DDIMMs and use Figure 2-13 on page
    73 as reference:


    +   - C20, C21, C22, C23, C24, C25, C26, C27 (slots connected to SCM P1)

    +   - C28, C29, C30, C31, C32, C33, C34, C35 (slots connected to SCM P3)

    +   - C36, C37, C38, C39, C40, C41, C42, C43 (slots connected to SCM P2)

    +   - C44, C45, C46, C47, C48, C49, C50, C51 (slots connected to SCM P0)'

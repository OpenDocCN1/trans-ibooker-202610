- raw:
  - '[PAGE 152]


    # Logical partitions


    LPARs and virtualization increase the usage of system resources and add a level
    of configuration possibilities.


    *Logical partitioning* is the ability to make a server run as though it were two
    or more independent servers. When you logically partition a server, you divide
    the resources on the server into subsets, called *LPARs*. You can install software
    on an LPAR, and the LPAR runs as an independent logical server with the resources
    that you allocated to the LPAR.


    LPAR also is referred to in some documentation as a *virtual machine* (VM), which
    making it look similar to what other hypervisors offer. However, LPARs provide
    a higher level of security and isolation and other features that are described
    in this chapter.


    Processors, memory, and I/O devices can be assigned to LPARs. AIX, IBM i, Linux,
    and VIOS can run on LPARs. VIOS provides virtual I/O resources to other LPARs
    with general-purpose operating systems.


    LPARs share a few system attributes, such as the system serial number, system
    model, and processor FCs. All other system attributes can vary from one LPAR to
    another.


    # Micro-Partitioning


    When you use the Micro-Partitioning technology, you can allocate fractions of
    processors to an LPAR. An LPAR that uses fractions of processors is also known
    as a *shared processor partition* or *micropartition*. Micropartitions run over
    a set of processors that is called a *shared processor pool* (SPP), and virtual
    processors are used to enable the operating system manage the fractions of processing
    power that are assigned to the LPAR.


    From an operating system perspective, a virtual processor cannot be distinguished
    from a physical processor, unless the operating system is enhanced to determine
    the difference. Physical processors are abstracted into virtual processors that
    are available to partitions.


    On the Power10 processor-based server, a partition can be defined with a processor
    capacity as small as 0.05 processing units. This number represents 0.05 of a physical
    core. Each physical core can be shared by up to 20 shared processor partitions,
    and the partition’s entitlement can be incremented fractionally by as little as
    0.05 of the processor. The shared processor partitions are dispatched and time-sliced
    on the physical processors under the control of the Power Hypervisor. The shared
    processor partitions are created and managed by the HMC.


    The Power E1080 supports up to 240 cores in a single system and 1000 micropartitions
    (1000 is the maximum that PowerVM supports).


    Note: Although the Power E1080 supports up to 1000 micropartitions, the real limit
    depends on application workload demands in use on the server.


    # Processing mode


    When you create an LPAR, you can assign entire processors for dedicated use, or
    you can assign partial processing units from an SPP. This setting defines the
    processing mode of the LPAR.


    # Dedicated mode


    In dedicated mode, physical processors are assigned as a whole to partitions.
    The SMT feature in the Power10 processor core allows the core to run instructions
    from two, four, or eight independent software threads simultaneously.'
  - '[PAGE 153]


    # Shared dedicated mode


    On Power10 processor-based servers, you can configure dedicated partitions to
    become processor donors for idle processors that they own, which allows for the
    donation of spare CPU cycles from dedicated processor partitions to an SPP. The
    dedicated partition maintains absolute priority for dedicated CPU cycles. Enabling
    this feature can help increase system usage without compromising the computing
    power for critical workloads in a dedicated processor mode LPAR.


    # Shared mode


    In shared mode, LPARs use virtual processors to access fractions of physical processors.
    Shared partitions can define any number of virtual processors (the maximum number
    is 20 times the number of processing units that are assigned to the partition).
    The Power Hypervisor dispatches virtual processors to physical processors according
    to the partition’s processing units entitlement. One processing unit represents
    one physical processor’s processing capacity. All partitions receive a total CPU
    time equal to their processing unit’s entitlement. The logical processors are
    defined on top of virtual processors. Therefore, even with a virtual processor,
    the concept of a logical processor exists, and the number of logical processors
    depends on whether SMT is turned on or off.


    # 3.1.2 Multiple shared processor pools


    MSPPs are supported on Power10 processor-based servers. This capability allows
    a system administrator to create a set of micropartitions with the purpose of
    controlling the processor capacity that can be used from the physical SPP.


    Micropartitions are created and then identified as members of the default processor
    pool or a user-defined SPP. The virtual processors that exist within the set of
    micropartitions are monitored by the Power Hypervisor. Processor capacity is managed
    according to user-defined attributes.


    If the Power server is under heavy load, each micropartition within an SPP is
    assured of its processor entitlement, plus any capacity that might be allocated
    from the reserved pool capacity if the micropartition is uncapped.


    If specific micropartitions in an SPP do not use their processing capacity entitlement,
    the unused capacity is ceded and other uncapped micropartitions within the same
    SPP can use the extra capacity according to their uncapped weighting. In this
    way, the entitled pool capacity of an SPP is distributed to the set of micropartitions
    within that SPP.


    All Power servers that support the MSPPs capability have a minimum of one (the
    default) SPP and up to a maximum of 64 SPPs.


    This capability helps customers reduce total cost of ownership (TCO) significantly
    when the cost of software or database licenses are dependant on the number of
    assigned processor-cores.'

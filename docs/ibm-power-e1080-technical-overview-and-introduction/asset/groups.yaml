  mdcn: "\n\n## 1.7 系统机架\n\nPower E1080 服务器符合标准 19 英寸机架。服务器已在 IBM 企业级机架（7965-S42、7014-T42、7014-T00\
    \ 或 7965-94Y）中获得认证并经过测试。客户如果确信这些机架具有所需的强度、刚度、深度和孔距特征，可以选择将服务器放置在其他机架中。请联系 IBM\
    \ 支持部门以确定其他机架是否适用。\n\n> **订购信息：** 强烈建议您订购 Power E1080 服务器时搭配 IBM 42U 企业级机架 7965-S42\
    \ 功能。此机架为 IBM 制造系统装配和测试提供更完整、更高质量的环境，并提供完整的套件。\n\n如果系统安装在非 IBM 的机架或机柜中，请确保机架符合\
    \ 1.7.7 节“原始设备制造商机架”第 41 页所述的要求。\n\n> **责任：** 客户有责任确保抽屉安装在首选机架或机柜中时，所形成的配置在稳定性、可维护性、安全性以及与抽屉对电源、冷却、线缆管理、重量和导轨安全的要求方面兼容。\n\
    \n### 1.7.1 新机架注意事项\n\n订购机架时请考虑以下几点：\n\n- 新的 IBM 企业级 42U Slim 机架 7965-S42 在纤薄的占地面积中提供\
    \ 42 个 EIA 单位（U）的空间。\n- 7014-T42、7014-T00 和 7965-94Y 机架已不再可与 Power E1080 服务器一起购买。Power\
    \ E1080 服务器仍可安装在这些机架中并获得支持。\n\n> **垂直 PDU：** 所有安装在包含 Power E1080 服务器的机架中的 PDU\
    \ 必须水平安装，以便在机架侧面进行线缆布线。\n\n### 1.7.2 IBM 企业级 42U Slim 机架 7965-S42\n\n2.0 米（79\
    \ 英寸）型号 7965-S42 与过去和现在的 IBM Power 服务器兼容，并为数据中心提供出色的 19 英寸机架外壳。其 600 mm（23.6 in.）宽度结合\
    \ 1100 mm（43.3 in.）深度以及 42 EIA 外壳容量，为系统提供出色的占地面积效率。它可以轻松放置在标准 24 英寸地板瓷砖上。\n\n\
    与 7965-94Y Slim 机架相比，企业级 Slim 机架提供额外的强度以及运输和安装灵活性。\n\n7965-S42 机架包括侧袋中最多可容纳四个\
    \ PDU 的空间。超过四个的额外 PDU 水平安装，每个占用 1U 机架空间。\n\n企业级 Slim 机架前面门，可为 Basic Black/Flat（#ECRM）或\
    \ High-End 外观（#ECRT），采用冲孔钢板，提供通风、物理安全以及对安装设备内指示灯的可见性。\n\n标准配置为与后门锁相同的锁。门（#ECRG）可向左侧或右侧铰接。\n\
    \n除 #ECRT 门外，您还可以订购 #ECRF 高端外观门（图 1-11）\n\n![](img/7c8373945565ba432037f60bbf8458eb_48_0.png)\n\
    \n图 1-11 #ECRF 和 #ECRT 机架门。\n\n方向：#ECRT 必须不得翻转，因为 IBM 标志会倒置。\n\n### 1.7.3 交流配电单元和机架内容\n\
    \n在工厂集成到机架中的 Power E1080 服务器配备的 PDU 在机架中水平安装。每个 PDU 在机架中占用 1U 空间。将 PDU 垂直安装在机架侧面可能会导致线缆布线问题并干扰最佳服务访问。\n\
    \n支持两种可能的 PDU 额定值：60A/63A（大多数国家可订购）和 30A/32A。请考虑以下几点：\n\n- 60A/63A PDU 支持四个系统节点电源和一个\
    \ I/O 扩展抽屉或八个 I/O 扩展抽屉。\n- 30A/32A PDU 支持两个系统节点电源和一个 I/O 扩展抽屉或四个 I/O 扩展抽屉。\n\n\
    机架集成系统订单至少需要两个 #7109、#7188 或 #7196。\n\n高功能 PDU 提供更高的每 PDU 电力，并提供更好的“PDU 占地面积”效率。此外，它们是智能\
    \ PDU，可提供按插座的用电量洞察以及远程开关机能力，便于按单个插座进行支持。新的 PDU 可作为 #ECJJ、#ECJL、#ECJN 和 #ECJQ 订购。\n\
    \n高功能 PDU 功能代码列于表 1-20。\n\n#### 表 1-20 可用的高功能 PDU\n\n| PDU | 1 相或 3 相取决于国家布线标准\
    \ | 3 相 208 V 取决于国家布线标准 |\n|---|---|---|\n| 九个 C19 插座 | ECJJ | ECJL |\n| 十二个 C13\
    \ 插座 | ECJN | ECJQ |\n\n此外，以下高功能 PDU 可用：\n\n- 高功能 9xC19 PDU 加（#ECJJ）\n  此智能、开关式\
    \ 200-240 伏交流 PDU 在 PDU 前部包括九个 C19 插座。PDU 安装在机架后部，使九个 C19 插座易于访问。\n- 高功能 9xC19\
    \ PDU 加 3 相（#ECJL）\n  此智能、开关式 208 伏 3 相交流 PDU 在 PDU 前部包括九个 C19 插座。PDU 安装在机架后部，使九个\
    \ C19 插座易于访问。\n- 高功能 12xC13 PDU 加（#ECJN）\n  此智能、开关式 200-240 伏交流 PDU 在 PDU 前部包括\
    \ 12 个 C13 插座。PDU 安装在机架后部，使 12 个 C13 插座易于访问。\n- 高功能 12xC13 PDU 加 3 相（#ECJQ）\n\
    \  此智能、开关式 208 伏 3 相交流 PDU 在 PDU 前部包括 12 个 C13 插座。PDU 安装在机架后部，使 12 个 C13 插座易于访问。\n\
    \n两个或更多额外的 PDU 可以水平安装在机架后部。水平安装 PDU 使用每个 PDU 1U，并减少可用于其他机架组件的空间。水平安装 PDU 时，首选方法是使用填充件填充这些\
    \ PDU 占用的 EIA 单位，以促进机架内的适当气流和通风。\n\n每个 PDU 需要一根 PDU 到墙电源线。各种电源线功能可用于各种国家和应用，通过改变\
    \ PDU 到墙电源线提供，必须单独订购。\n\n每根电源线提供特定电源需求的独特设计特征。为了匹配新的电源需求并保留之前的投资，这些电源线可以随机架的初始订单一起请求，也可以在机架功能后期升级时请求。\n\
    \n表 1-21 列出了 7188 和高功能 PDU 以及 iPDU 功能的可用墙电源线选项，必须单独订购。\n\n#### 表 1-21 PDU 和 iPDU\
    \ 功能的墙电源线选项\n\n| 功能代码 | 墙插头 | 额定电压（V AC） | 相位 | 额定电流 | 地理区域 |\n|---|---|---|---|---|---|\n\
    | 6653 | IEC 309，3P+N+G，16 A | 230 | 3 | 16 安培/相 | 国际通用 |\n| 6489 | IEC309 3P+N+G，32\
    \ A | 230 | 3 | 32 安培/相 | EMEA |\n| 6654 | NEMA L6-30 | 200 - 208，240 | 1 | 24\
    \ 安培 | 美国、加拿大、拉美和日本 |\n| 6655 | RS 3750DP（防水） | 200 - 208，240 | 1 | 24 安培 | 美国、加拿大、拉美和日本\
    \ |\n| 6656 | IEC 309，P+N+G，32 A | 230 | 1 | 24 安培 | EMEA |\n| 6657 | PDL | 230-240\
    \ | 1 | 32 安培 | 澳大利亚、新西兰 |\n| 6667 | PDL | 380-415 | 3 | 32 安培 | 澳大利亚、新西兰 |\n\
    | 6658 | 韩国插头 | 220 | 1 | 30 安培 | 韩国南北 |\n| 6492 | IEC 309，2P+G，60 A | 200 - 208，240\
    \ | 1 | 48 安培 | 美国、加拿大、拉美和日本 |\n| 6491 | IEC 309，P+N+G，63 A | 230 | 1 | 63 安培\
    \ | EMEA |\n\n> 注：确保配置合适的电源线功能以支持所提供的电力。根据所使用的电源线，PDU 可提供 4.8 - 19.2 kVA。插入 PDU\
    \ 的所有抽屉的功率不得超过电源线限制。\n\n为了更好地实现电气冗余，每个 CEC 具有四个电源，必须连接到不包含在基础订单中的单独 PDU。\n\n为了获得最大可用性，首选方法是将同一系统的电源线连接到机架中的两个单独\
    \ PDU，并将每个 PDU 连接到独立的电源。\n\n有关 7965-94Y 机架的电源要求和电源线的更多信息，请参阅 IBM 文档。\n\n"

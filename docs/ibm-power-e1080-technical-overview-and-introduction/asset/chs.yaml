- "## Power E1080 简介\n\nPower E1080 是 IBM Power 家族的最新成员，是业界领先的安全性和可靠性服务器平台。Power E1080\
  \ 引入了必不可少的企业混合云平台，该平台专为帮助您在混合云中的任何位置安全高效地扩展核心运营和人工智能（AI）应用而设计。\n\nPower E1080 简化了端到端加密，并在您的数据存储位置带来\
  \ AI，以实现更快的洞察。此配置有助于实现更大的工作负载部署灵活性和敏捷性，同时完成更多工作。\n\nPower E1080 可帮助您实现以下优势：\n\n\
  +   从核心到云保护信任\n+   在不影响性能的情况下，通过混合云实现大大简化的端到端加密，以保护传输中和静态数据。\n\n+   享受企业级服务质量\n\
  +   Power E1080 可以在硬件中自动检测、隔离和从软错误中恢复，而无需停机或依赖操作系统来管理故障。\n\n+   通过可持续且可扩展的计算实现更高效率\n\
  +   处理器性能、巨大的系统吞吐量和内存容量使 Power E1080 服务器成为完美的工作负载整合平台。此性能带来了机房空间、能源消耗和运营支出成本的显著节省。\n\
  \n本章包含以下主题：\n\n+   1.1，“系统概述”第 2 页\n\n+   1.2，“系统节点”第 6 页\n\n+   1.3，“系统控制单元”第 10\
  \ 页\n\n+   1.4，“服务器规格”第 11 页\n\n+   1.5，“系统特性”第 15 页\n\n+   1.6，“I/O 抽屉”第 26 页\n\
  \n+   1.7，“系统机架”第 34 页\n\n+   1.8，“硬件管理控制台概述”第 42 页\n\n### 1.1 系统概述\n\nPower E1080，也称为其\
  \ 9080-HEX 机器类型型号，是 IBM Power 产品组合中最强大和最可扩展的服务器。它由称为 *节点*（或 *系统节点*）的 CEC 机箱组合以及更多单元和抽屉组成。\n\
  \n#### 1.1.1 系统节点、处理器和内存\n\n在本节中，我们对系统节点、处理器和内存进行了总体概述。有关系统节点的更多信息，请参阅 1.2，“系统节点”第\
  \ 6 页。\n\n系统节点是一个机箱，提供连接处理器与内存、内部磁盘、适配器以及扩展所需互连的连接和支持电子设备。\n\n每台服务器支持一个、两个、三个或四个系统节点的组合。\n\
  \n每个系统节点提供四个 Power10 处理器芯片插槽和 64 个差分 DIMM（DDIMM）插槽，用于双倍数据速率 4（DDR4）技术 DIMM。\n\n\
  每个插槽容纳一个 Power10 单芯片模块（SCM）。一个 SCM 可包含 10、12 或 15 个 Power10 处理器核心。它还保存额外的基础设施逻辑，以提供电力和数据连接至\
  \ Power10 处理器芯片。\n\n系统节点的处理器配置由所选的处理器特性定义。每个特性定义一组四个具有相同核心密度（10、12 或 15）的 Power10\
  \ 处理器芯片。\n\n4 节点 Power E1080 服务器可扩展至 16 个处理器插槽和 160、192 或 240 个核心，具体取决于配置的 SCM 类型的核心数量。\n\
  \n所有具有 Power E1080 服务器的系统节点必须配置相同的处理器特性。\n\n每个系统节点最多可支持使用最大可用内存 DIMM 密度时的 16 TB\
  \ 系统内存。完全配置的 4 节点 Power E1080 最多可支持 64 TB 内存。\n\n为了支持内部启动功能，每个系统节点可使用多达四个非易失性内存\
  \ express（NVMe）驱动器托架。更多驱动器托架通过扩展抽屉提供。\n\n每个系统节点提供八个 Peripheral Component Interconnect\
  \ Express（PCIe）Gen 5 能力插槽，Power E1080 服务器最多为 32 个。\n\n任何一个、两个、三个或四个系统节点配置都需要系统控制单元（SCU）才能运行。SCU\
  \ 通过冗余的 Flexible Service Processors（FSPs）提供系统硬件、固件和虚拟化控制。每个 Power E1080 服务器只需要并支持一个\
  \ SCU。有关系统控制单元的更多信息，请参阅 1.3，“系统控制单元”第 10 页。\n\n有关服务器的环境和物理方面的更多信息，请参阅 1.4，“服务器规格”第\
  \ 11 页。\n\n#### 1.1.2 扩展抽屉和存储机箱\n\n您可以通过使用扩展抽屉和存储机箱来增加系统容量。\n\n可选的 19 英寸 PCIe Gen\
  \ 3 4U I/O 扩展抽屉提供 12 个 PCIe Gen 3 插槽。I/O 扩展抽屉通过一对 PCIe x16 到 CXP 转换卡连接到系统节点，该卡位于系统节点内。每个系统节点最多可支持四个\
  \ I/O 扩展抽屉，共计 48 个 PCIe Gen 3 插槽。完全配置的 Power E1080 最多可支持 16 个 I/O 扩展抽屉，提供总共 192\
  \ 个 PCIe Gen 3 插槽。\n\n可选的 EXP24SX SAS 存储机箱提供 24 个 2.5 英寸小型型因子（SFF）串行连接 SCSI（SAS）托架。它支持多达\
  \ 24 个热插拔硬盘驱动器（HDD）或固态驱动器（SSD），仅占用 19 英寸机架中 2U 机架单元的空间。EXP24SX 通过插入系统节点 PCIe 插槽或\
  \ I/O 扩展抽屉插槽的 SAS 适配器连接到 Power E1080 服务器。\n\n有关机箱和抽屉的更多信息，请参阅 1.6，“I/O 抽屉”第 26 页。\n\
  \n有关 IBM 存储产品的更多信息，请参阅此网页。\n\n#### 1.1.3 硬件概览\n\nPower E1080 服务器提供以下硬件组件和特性：\n\n\
  +   - 10、12 或 15 核 Power10 处理器芯片，封装在每个插槽的单芯片模块中\n+   - 一个、两个、三个或四个系统节点，每个系统节点有四个\
  \ Power10 处理器插槽\n+   - 每个系统节点中的冗余时钟\n+   - 每个系统节点多达 60 个 Power10 处理器核心，整个系统多达 240\
  \ 个\n+   - 每个系统节点多达 16 TB DDR4 内存，整个系统多达 64 TB\n+   - 每个系统节点 8 个 PCIe Gen 5 插槽，整个系统最多\
  \ 32 个 PCIe Gen 5 插槽\n+   - 系统节点支持 PCIe Gen 1、Gen 2、Gen 3、Gen 4 和 Gen 5 适配器卡\n+\
  \   - 每个系统节点多达 4 个 PCIe Gen 3 4U I/O 扩展抽屉，提供最多 48 个额外的 PCIe Gen 3 插槽\n+   - 使用 16\
  \ 个 PCIe Gen 3 I/O 扩展抽屉，整个系统多达 192 个 PCIe Gen 3 插槽\n+   - 通过 EXP24SX SFF 抽屉直接连接多达\
  \ 4,000 多个 SAS HDD 或 SSD\n+   - 系统控制单元，提供冗余 Flexible Service Processors 并支持操作面板、系统\
  \ VPD 和外部连接 DVD\n\nPower E1080 服务器硬件的巨大计算能力、卓越的系统容量和前所未有的可扩展性，由独特的企业级固件和系统软件功能和特性展开。IBM\
  \ Power 企业平台提供以下重要特性和功能：\n\n+   - 支持 IBM AIX、IBM i 和 Linux 操作系统环境\n+   - 集成在每个 Power10\
  \ 处理器核心中的创新密集数学引擎，可加速 AI 推理工作负载\n+   - 在每个 Power10 处理器核心中实现的优化加密单元\n+   - 由 Power10\
  \ 处理器技术提供的专用数据压缩引擎\n\n+   - 硬件和固件辅助并强制执行的<|message|> 安全性提供可信启动和全内存加密支持\n+   - 每个系统多达\
  \ 1,000 个虚拟机（VM）或逻辑分区（LPAR）\n+   - 动态 LPAR 支持，可根据工作负载在不中断业务的情况下修改可用处理器和内存资源\n+ \
  \  - 按需容量（CoD）处理器和内存选项，可帮助更快速、更无缝地响应不断变化的业务需求和增长\n+   - 具有 Power Enterprise Pools\
  \ 2.0 的 IBM Power System Private Cloud Solution with Dynamic Capacity，支持实时工作负载平衡、系统维护和运营支出成本管理的无与伦比的企业灵活性。\n\
  \n表 1-1 根据 IBM POWER9™ 处理器技术，比较了 Power E1080 服务器与 Power System E980 服务器的重要技术特性。\n\
  \n## 表 1-1 Power E980 与 Power E1080 服务器的比较\n\n| 特性 | Power E980 服务器 | Power E1080\
  \ 服务器 |\n|---|---|---|\n| 处理器 | POWER9 | Power10 |\n| 处理器封装 | 单芯片模块 | 单芯片模块 |\n\
  | 每个单芯片模块的核心数 | 6、8、10、11、12 | 10、12、15 |\n| 每个系统的核心数 | 多达 192 核心 | 多达 240 核心 |\n\
  | 每个节点的插槽数 | 4 | 4 |\n| 系统配置选项 | 1、2、3 和 4 节点系统 | 1、2、3 和 4 节点系统 |\n| 每个节点最大内存 |\
  \ 16 TB | 16 TB |\n| 每个系统最大内存 | 64 TB | 64 TB |\n| 每个节点最大内存带宽 | 920 GBps | 1636\
  \ GBps |\n| 每个系统聚合最大内存带宽 | 3680 GBps | 6544 GBps |\n| 全内存加密 | 否 | 是 |\n| 每个节点 PCIe\
  \ 插槽 | 八个 PCIe Gen 4 插槽 | 八个 PCIe Gen 5 插槽 |\n| I/O 抽屉扩展选项 | 是 | 是 |\n| 加速端口 | 是<br>CAPI\
  \ 2.0 & OpenCAPI 3.0ᵃ | 是<br>OpenCAPI 3.0、3.1 |\n| PCIe 热插拔支持 | 是 | 是 |\n| 每个节点\
  \ I/O 带宽 | 545 GBps | 576 GBps |\n| 集成 USB | USB 3.0 | 不可用 |\n| 每个节点内部存储托架 | 四个\
  \ NVMe PCIe Gen 3 托架ᵇ | 四个 NVMe PCIe Gen 4 托架 |\n| 插槽间每通道比特率 | 25 Gbps | 32 Gbps\
  \ |\n\n\n\n\n\n| 特性 | Power E980 服务器 | Power E1080 服务器 |\n|---|---|---|\n| 可靠性、可用性和可服务性\
  \ (RAS) | SMPᶜ 电缆并发维修 | 非活动 SMP 电缆，具有并发维护能力及 TDRᵈ 故障隔离 |\n| 安全且可信的启动 | 是 | 是 |\n\
  \n+   a. CAPI 指定相干加速器处理器接口技术，OpenCAPI 指定开放相干加速器处理器接口技术。有关架构规范及周边系统的更多信息，请参阅此网页。\n\

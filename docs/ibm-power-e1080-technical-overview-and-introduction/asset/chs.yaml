  ## General rules for the PCIe Gen3 I/O Expansion Drawer configuration\n\nThe PCIe\
  \ Gen 4 Cable Adapter (#EJ24) can be in any of the PCIe adapter slots in a Power\
  \ E1080 server node. However, we advise that you first populate the PCIe adapter\
  \ slots as per the slot priorities that are discussed in this section. If an I/O\
  \ expansion drawer is present, the PCIe Gen 4 cable adapter (#EJ24) must be given\
  \ the highest priority.\n\nEach processor module drives two PCIe Gen5 slots, and\
  \ all slots are equal regarding their bandwidth characteristics. If you first use\
  \ the slots following the slot priorities, you ensure that one PCIe Gen5 slot per\
  \ processor module is populated before you use the second PCIe Gen5 slot of the\
  \ processor modules.\n\nTable 2-27 lists the PCIe adapter slot priorities in the\
  \ Power E1080 server. If the sequence is chosen as listed in the slot priority column,\
  \ the adapters are assigned to the SCM in alignment with the internal enumeration\
  \ order: SCM0, SCM1, SCM2, and SCM3.\n\nTable 2-27 PCIe adapter slot priorities\n\
  \n| Feature code | Description | Slot priorities |\n|---|---|---|\n| EJ24 | PCIe\
  \ Gen 4 Optical Cable Adapter for PCIe Gen 3 Expansion Drawer | 1, 7, 3, 6, 2, 8,\
  \ 4, 5 |\n\nThe following figures show several examples of supported configurations.\

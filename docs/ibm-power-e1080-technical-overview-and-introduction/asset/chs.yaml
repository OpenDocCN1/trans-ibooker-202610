  \ EMXF 和 EMXG 在 Power E1080 系统上不受支持。\n\n有关内部总线以及内部和外部 I/O 子系统架构的更多信息，请参阅第 2.5 节，“内部\
  \ I/O 子系统”第 83 页。\n\n### 2.6 支持的 PCIe 适配器\n\n在本节中，我们提供了有关 Power E1080 服务器上支持的 PCIe\

  \n主要区别在于共享和专用接口可以共存于 BMC。每个都有自己的 LAN 编号和物理端口。理想情况下，客户配置一个端口，但两者都可以配置。连接 Power 系统到\
  \ HMC 的规则与以前版本保持不变。\n\n#### 1.8.4 高可用性 HMC 配置\n\n为了获得最佳的可管理性和冗余，建议采用双 HMC 配置。此配置可以是两个硬件设备，也可以是一个硬件设备和一个虚拟设备，或两个虚拟设备。\n\
  \n必须满足以下要求：\n\n- 两个 HMC 处于同一版本。\n- HMC 使用不同的子网连接到 FSP。\n- HMC 可以通过公共网络与服务器的分区通信以允许完全同步和功能。\n\
  \n#### 1.8.5 Power E1080 的 HMC 代码级别要求\n\nPower E1080 所需的最低 HMC 版本为 V10R1。V10R1 仅支持\
  \ 7063-CR1、7063-CR2 和虚拟 HMC 设备。不支持 7042 机型。运行 V10R1 的 HMC 不能管理基于 POWER7 处理器的系统。\n\
  \n运行 V10R1 M1010 的 HMC 包括以下功能：\n\n- 7063-CR2 设备的 HMC OS 安全启动支持\n- 能够配置登录重试和暂停时间，并支持密码策略中的非活动过期\n\
  - 能够指定 HMC 位置和组的数据复制\n- VIOS 管理增强：\n  - 准备 VIOS 维护：\n    - 对 VIOS 为客户分区提供的存储和网络的冗余进行验证\n\
  \    - 切换冗余存储和网络路径以启动故障转移\n    - 在准备失败时回滚到原始配置\n    - 审核执行的各种验证和准备步骤\n    - 报告准备过程中出现的任何失败\n\
  \  - 命令行和计划操作支持 VIOS 备份或恢复 VIOS 配置和 SSP 配置\n  - 在 HMC 中备份或恢复共享存储池配置的选项\n  - 将备份文件导入或导出到外部存储的选项\n\
  \  - 将所有虚拟 NIC 从一个 VIOS 故障转移到另一个 VIOS 的选项\n- 支持 128 MB 和 256 MB LMB 大小\n- 自动选择 LPM\
  \ 内存传输的最快网络\n- HMC 用户体验增强：\n  - 可用性和性能改进\n  - 增强帮助连接全局搜索\n  - 可服务事件的快速查看\n  - UI\
  \ 向导的更多进度信息\n- 允许在虚拟光学设备分配给分区时进行 LPM/远程重启\n- 更新访问密钥支持\n\n\n\n\n\n计划操作功能：在电子服务代理中，一个新功能允许客户仅在计划操作失败时接收消息警报（见图\
  \ 1-17）。\n\n![](img/7c8373945565ba432037f60bbf8458eb_60_0.png)\n\n图 1-17 HMC 警报功能\n\
  \nHMC 审计跟踪的日志保留时间也已增加。\n\n### 1.8.6 HMC 时效性\n\n近年来，网络安全已成为国家安全问题，以及 CIO 和企业 IT 管理员日益关注的重点。\n\
  \n基于 IBM Power 处理器的架构在端到端安全性方面一直名列前茅，这也是其仍然成为关键任务企业工作负载首选平台的原因。\n\n维护安全的 Power 环境的一个关键方面是确保\
  \ HMC（或虚拟 HMC）保持最新并得到完全支持（包括硬件、软件和 Power 固件更新）。\n\n过时或不受支持的 HMC 代表着技术风险，可以通过升级到当前版本来快速、轻松地缓解。\n"

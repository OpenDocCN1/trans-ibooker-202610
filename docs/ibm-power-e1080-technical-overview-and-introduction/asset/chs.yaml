  \n### 2.8 External disk subsystems\n\nThis section describes the following external\
  \ disk subsystems that can be attached to the Power E1080 server:\n\n- EXP24SX SAS\
  \ Storage Enclosures\n- IBM System Storage\n\n#### 2.8.1 IBM EXP24SX SAS Storage\
  \ Enclosure\n\nThe EXP24SX SAS storage enclosure (#ESLS) is the only DASD drawer\
  \ that is available for Power E1080 that provides extra disk drives. The ESLS supports\
  \ SSDs and HDDs. The ESLS storage enclosures are connected to system units by using\
  \ a serial-attached SCSI (SAS) port in the SAS adapters.\n\nThe EXP24SX is a storage\
  \ expansion enclosure with 24 2.5-inch small form factor (SFF) SAS bays. It supports\
  \ 10K and 15K SAS HDD having 512 and 4K format drives and enterprise and mainstream\
  \ class SAS SSDs.\n\nThe enclosures can be split logically into one, two, or four\
  \ independent groups:\n\n- One set of 24 bays (mode 1) (D1-D24),\n- Two sets of\
  \ 12 bays (mode 2), (D1-D12) (D13-D24)or\n- Four sets of 6 bays (mode 4).(D1-D6)\
  \ (D7-D12) (D13-D18) (D19-D24)\n\nThe front view of the ESLS storage enclosure with\
  \ drive locations is shown in Figure 2-30.\n\n![](img/7c8373945565ba432037f60bbf8458eb_119_0.png)\n\
  \nFigure 2-30 Front view of the ESLS storage enclosure with mode groups & drive\
  \ locations\n\nThe SAS storage enclosures support the following operating systems:\n\
  \n- AIX\n- IBM i\n- Linux\n- VIOS\n\n\n\n\n\n以下 PCIe Gen 3 SAS 适配器支持 EXP24SX 抽屉：\n\
  \n- PCIe Gen 3 RAID SAS 适配器 四端口 6 Gb x8 (#EJ0J)\n- PCIe Gen 3 LP RAID SAS 适配器 四端口\
  \ 6 Gb x8 (#EJ0M)\n- PCIe3 SAS 磁带/DVD 适配器 四端口 6 Gb x8 (#EJ10)\n- PCIe3 LP SAS 磁带/DVD\
  \ 适配器 四端口 6 Gb x8 (#EJ11)\n- PCIe Gen 3 12 GB 缓存 RAID Plus SAS 适配器 四端口 6 Gb x8 (#EJ14)\n\
  \nIBM i 配置要求驱动器受保护（RAID 或镜像）。保护驱动器是强烈建议的，但对于其他操作系统并非必需。所有使用带写缓存 SAS 适配器的 Power 服务器操作系统环境都需要通过使用成对的适配器来保护缓存。\n\
  \nEXP24SX 抽屉具有以下高可靠性设计要点：\n\n- 支持热插拔的 SAS 托架。\n- 冗余且可热插拔的电源和风扇组件。\n- 双电源线。\n- 冗余且可热插拔的机箱服务管理器（ESMs）。\n\
  - 到所有驱动器的冗余数据路径。\n- 驱动器、托架、ESMs 和电源上的 LED 指示灯支持问题识别。\n- 通过 SAS 适配器和控制器，驱动器可通过 RAID\
  \ 和镜像以及热备能力进行保护。\n\n注意：考虑混合 SSD 和 HDD 的以下几点：\n\n- 配置为模式 1 时，不能混合 SSD 和 HDD。\n- 配置为模式\
  \ 2 时，可以混合 SSD 和 HDD：一个磁盘分区可以是 SSD，另一个磁盘分区可以是 HDD，但不能在同一磁盘分区内混合。\n- 配置为模式 4 时，可以混合\
  \ SSD 和 HDD。每个磁盘分区可以是 SSD 或 HDD，但不能在同一磁盘分区内混合。\n\n例如，在具有两组 12 个托架的模式 2 抽屉中，一组可以放置\
  \ SSD，另一组可以放置 HDD，但不能在同一组 12 个托架中混合 SSD 和 HDD。\n\n用于将 #ESLS 存储机箱连接到服务器的电缆与用于 5887\
  \ 磁盘驱动器机箱的电缆不同。SAS 控制器与存储机箱 SAS 端口之间的连接通过合适的 SAS YO12 或 X12 电缆进行。PCIe Gen3 SAS 适配器支持\
  \ 6 Gb 吞吐量。如果未来的 SAS 适配器支持该功能，EXP12SX 抽屉支持高达 12 Gb 吞吐量。\n\n以下电缆选项可用：\n\n- 3.0M SAS\
  \ X12 电缆（双适配器到机箱 (#ECDJ)\n- 4.5M SAS X12 AOC（双适配器到机箱 (#ECDK)\n- 10M SAS X12 AOC（双适配器到机箱\
  \ (#ECDL)\n- 1.5M SAS YO12 电缆（适配器到机箱 (#ECDT)\n- 3.0M SAS YO12 电缆（适配器到机箱 (#ECDU)\n\
  - 4.5M SAS YO12 AOC（适配器到机箱 (#ECDV)\n- 10M SAS YO12 AOC（适配器到机箱 (#ECDW)\n\nEXP24SX\
  \ 抽屉后部有六个 SAS 连接器，可连接 SAS 适配器或控制器。它们标记为 T1、T2 和 T3；两个 T1、两个 T2 和两个 T3 连接器。请考虑以下几点：\n\
  \n- 在模式 1 中，使用六个端口中的两个或四个。对于单个 SAS 适配器，使用两个 T2 端口；对于成对的两个适配器或双适配器配置，使用两个 T2 和两个\
  \ T3 端口。\n- 在模式 2 或模式 4 中，使用四个端口，即两个 T2 和两个 T3 连接器，以访问所有 SAS 托架。\n- T1 连接器未使用。\n\
  \n图 2-31 显示了 EXP24SX 存储机箱的连接器位置。\n\n![](img/7c8373945565ba432037f60bbf8458eb_121_0.png)\n\
  \n图 2-31 EXP24SX 后视图，位置代码和不同拆分模式\n\n模式设置由 IBM 制造完成。如果安装后需要更改模式，请联系您的 IBM 系统服务代表（IBM\
  \ SSR）寻求支持。\n\n有关 SAS 布线和布线配置的更多信息，请参阅 IBM 文档中“将 #ESLS 存储机箱连接到您的系统”。\n\n### 2.9\
  \ 系统控制和时钟分配\n\nPower E1080 服务器需要 UPIC、FSP 和 SMP 电缆用于机箱间连接：\n\n- UPIC 电缆允许系统节点为系统控制单元（SCU）供电\n\
  - FSP 电缆用于向组件提供系统控制\n- SMP 电缆用于扩展连接 Power10 处理器的 A 总线接口，使其跨系统节点延伸\n\n与上一代 Power\
  \ System E980 服务器类似，可提供两个服务处理器用于冗余。它们托管在 SCU 中，并通过位于 SCU 后部和系统节点的 FSI/PSI 总线连接器与系统节点通信。\n\
  \n所有服务处理器在控制单元和系统节点之间的通信都通过服务处理器电缆传输。与前几代相比，Power E1080 关联的 SCU 不再托管系统时钟。每个系统节点都托管自己的冗余时钟。\n\
  \nSCU 与系统节点之间通信所需的电缆取决于安装的系统节点数量。当添加系统节点时，必须同时添加新的一组电缆。\n\n每个系统节点所需的电缆都归为一个功能代码下，以便于配置。每组电缆包括一对\
  \ FSP 电缆，以及在适用时 SMP 电缆和通用电源互连电缆（UPIC）电缆。\n\n表 2-28 列出了可用的功能代码。\n\n*表 2-28 电缆组功能*\n\
  \n| 功能代码 | 描述 |\n|---|---|\n| EFCH | 系统节点抽屉 1 的电缆组（FSP + UPIC） |\n| EFCE | 系统节点抽屉\
  \ 2 的电缆组（FSP + SMP） |\n| EFCF | 系统节点抽屉 3 的电缆组（FSP + SMP） |\n| EFCG | 系统节点抽屉 4 的电缆组（FSP\
  \ + SMP） |\n\nPower E1080 服务器的初始订单包含一个 #EFCH，这是连接系统节点与系统控制单元（SCU）所必需的。此配置不需要 SMP\
  \ 电缆，SMP 电缆仅在两个或更多系统节点的配置中才需要。\n\n电缆组功能代码是递增的，取决于安装的系统节点数量：\n\n- 一个系统节点：#EFCH\n\
  - 两个系统节点：#EFCH 和 #EFCE\n- 三个系统节点：#EFCH、#EFCE 和 #EFCF\n- 四个系统节点：#EFCH、#EFCE、#EFCF\
  \ 和 #EFCG\n\n冗余的灵活服务处理器（FSP）提供专有接口通信，例如 FRU 服务接口（FSI）和处理器支持接口（PSI）到系统节点。\n\nPSI\
  \ 用于 FSP-主机处理器单元通信。PSI 是用于控制通信的时钟同步双向接口。SCU 中的每个 FSP 都有四个 PSI 接口，并且连接方式使得无论哪个 FSP\
  \ 成为主用，都可以控制整个系统。\n\nPower E1080 服务器中的 FSI 是用于整体系统控制结构设计中设备通信的串行点对点连接。\n\nFSI 连接网络跨越\
  \ SCU 内部的 FSP 到 FSP 连接、FSP 到系统节点通过时钟和控制逻辑。它们将 SCU 中的 FSP 连接到系统节点元素以及系统节点内部系统节点平面上的\
  \ Power10 到 Power10 处理器芯片。与 PSI 网络类似，无论哪个 FSP 成为主用，都可以控制整个服务器。\n\n图 2-32 显示了单个系统节点与\
  \ SCU 之间的 UPIC 和 FSP 布线。\n\n![](img/7c8373945565ba432037f60bbf8458eb_123_0.png)\n\
  \n图 2-32 SCU 与单个系统节点之间的 UPIC 和 FSP 连接\n\n图 2-33 显示了两个系统节点与 SCU 之间的 UPIC 和 FSP 布线。\n\
  \n![](img/7c8373945565ba432037f60bbf8458eb_124_0.png)\n\n图 2-33 SCU 与两个系统节点之间的 UPIC\
  \ 和 FSP 连接\n\n在单个系统节点配置中，两个 UPIC 电缆连接到 SCU，并提供来自系统节点的冗余电源。两个或更多系统节点的 SCU 电源由第一个和第二个系统节点提供。当\
  \ Power E1080 支持超过两个系统节点时，第三个和第四个系统节点的电源输出端口不使用。\n\n系统参考时钟源负责向所有功能单元提供同步时钟信号。Power\
  \ E1080 服务器的每个系统节点都使用自己的一套两个冗余系统时钟或控制卡。如果任一时钟或控制卡发生故障，第二张卡可确保系统在安排更换前继续运行。与 Power\
  \ E980 类似，Power E1080 服务器不需要系统控制中的全局参考时钟源。\n\n\n\n\n\n图 2-34 显示了三个系统节点与 SCU 之间的\
  \ UPIC 和 FSP 布线。\n\n![](img/7c8373945565ba432037f60bbf8458eb_125_0.png)\n\n图 2-34\
  \ SCU 与三个系统节点之间的 UPIC 和 FSP 连接\n\n图 2-35 显示了四个系统节点与 SCU 之间的 UPIC 和 FSP 布线。\n\n![](img/7c8373945565ba432037f60bbf8458eb_126_0.png)\n\
  \n图 2-35 SCU 与四个系统节点之间的 UPIC 和 FSP 连接\n\n### 2.10 操作系统支持\n\nPower E1080 服务器支持以下操作系统：\n\
  \n- AIX\n- IBM i\n- Linux\n\n此外，VIOS 可以安装在特殊分区中，为运行 AIX、IBM i 或 Linux 操作系统的其他分区提供支持，以使用各种功能，例如虚拟化\
  \ I/O 设备，或 PowerVM Live Partition Mobility (LPM)。\n\n有关 Power Systems 上可用的软件的更多信息，请参阅\
  \ IBM Power Systems Software。\n\n#### 2.10.1 Power E1080 先决条件\n\n撰写本文时，IBM AIX、IBM\
  \ i 和 Linux 的最低支持级别在以下各节中描述。有关硬件功能的更多信息，请参阅 IBM Power Systems Prerequisites。\n\n\
  此工具还有助于通过提供当前使用或计划添加到系统中的功能的先决条件信息来规划成功的系统升级。可以选择机器类型和型号（9080-HEX 代表 Power E1080）并查找所有先决条件、支持的操作系统级别和其他信息。\n\
  \n#### 2.10.2 AIX 操作系统\n\n在发布时，Power E1080 支持以下最低级别的 AIX：\n\n- AIX 7.1 TL 5 SP 5\n\
  - AIX 7.2 TL 4 SP 1\n\nAIX 7.1 必须在 POWER8 兼容模式下的 LPAR 中运行，并使用基于 VIOS 的虚拟存储和网络。I/O\
  \ 只能由 Virtual I/O Server 提供，并且系统已启用 LPM，排除了客户 LPAR 中直接的本机 VF（SR-IOV）。\n\nAIX 7.2\
  \ 可以使用物理和虚拟 I/O 运行，并需要 POWER9 兼容模式。\n\n当使用 2 端口 32 Gb 适配器（#EN1A 或 #EN1B）和选定的 IBM\
  \ FlashSystem 高端（FS9110）和中端（FS7200）型号时，NVMe over Fibre Channel 结构（NVMe-OF）现在可在运行\
  \ AIX 的 Power E1080 上使用。\n\nIBM 定期为 AIX 操作系统发布维护包（服务包或技术级别）。有关这些包、下载和获取 CD-ROM 的更多信息，请参阅\
  \ Fix Central。\n\n服务更新管理助手（SUMA），可帮助您自动化检查和下载操作系统下载的任务，是基本操作系统的一部分。有关 suma 命令的更多信息，请参阅\
  \ IBM 文档。\n\nAIX 可通过独立版（标准版）、企业版或捆绑选项使用：\n\n- AIX 7.1 Standard Edition\n- AIX 7.1\
  \ Enterprise Edition V1.6\n- AIX 7.2 Standard Edition\n- AIX 7.2 Enterprise Edition\n\
  - AIX 7.2 Enterprise Cloud Edition\n\n企业云版捆绑包的主要更新包括 PowerSC 2.0。\n\n购买新 Power E1080\
  \ 的客户可以随系统购买获得此堆栈。现有系统且使用任一捆绑包的客户以及具有有效 SWMA 的客户可以通过使用 ESS 获取此产品并立即使用。\n\n### 订阅许可模式\n\
  \n根据 Power E1080 的发布公告，提供了一种新的订阅许可模式。此模式为客户提供了更多选择和灵活性，以使用软件。\n\n订阅许可证是一种许可模式，提供在指定订阅期限（一年或三年）内访问\
  \ IBM 程序和 IBM 软件维护的权限。订阅期限从开始日期开始，到在 Entitled Systems Support (ESS) 中反映的到期日期结束。\n\
  \n客户被许可在 1 年或 3 年订阅期限的到期日期之前运行产品，然后可以在订阅期结束时续订以继续使用产品。此模式在特定期限内提供灵活且可预测的定价，前期投入成本较低。\n\
  \n此模式的另一个好处是许可证按客户编号授权，这意味着它们不像永久许可证那样绑定到特定的硬件序列号。因此，如果需要，许可证可以在本地和云之间移动，这对于混合工作负载来说变得越来越重要。\n\
  \n订阅许可证的新产品 ID 列在表 2-29 中。\n\n表 2-29 新订阅许可证 PID（一或三年期限）\n\n| PID | Description |\n\
  |---|---|\n| 5765-2B1 | AIX 7 standard edition |\n| 5765-2E1 | AIX 7 enterprise\
  \ edition 1.6 |\n| 5765-2C1 | Enterprise Cloud edition 1.6 with AIX 7 |\n| 5765-6C1\
  \ | Enterprise Cloud edition 1.6 |\n\n许可证可通过 IBM 配置器订购。标准版的 AIX 永久和月度期限许可证仍然可用。\n\
  \n### AIX 7.3 Open Beta\n\n2021 年 2 月，宣布了新 AIX 7.3 操作系统 Open Beta 的注册。AIX 7.3 Open\
  \ Beta 允许您在合适的 IBM 系统上下载、安装和运行软件的早期版本，采用非生产、非支持模式。\n\nOpen Beta 程序提供了一个机会，让您提前体验\
  \ AIX 7.3。AIX 的并非所有功能都在 Open Beta 中可用。\n\n客户可以通过在此网页注册来申请加入 Open Beta 程序。\n\n####\
  \ 2.10.3 IBM i\n\n以下最低要求的级别在 Power E1080 服务器上受 IBM i 支持：\n\n- IBM i 7.3 TR11 或更高版本\n\
  - IBM i 7.4 TR5 或更高版本\n\n有关硬件功能兼容性信息和相应的 IBM i 技术级别，请参阅 IBM Prerequisites。\n\n###\
  \ IBM i 操作系统转移\n\nIBM i 客户可以像之前的非序列保留升级/替换新系统一样迁移到新的 Power E1080 服务器。\n\nIBM i 条款和条件要求\
  \ IBM i 操作系统许可授权保留在最初购买的机器上。在符合条件的条件下，IBM 允许将 IBM i 处理器和用户授权从一台机器转移到另一台机器。此功能有助于促进机器更换、服务器整合和负载再平衡，同时保护客户对\
  \ IBM i 软件的投资。当满足要求时，可以使用 IBM 配置器工具配置 IBM i 许可证转移。\n\n转移必须满足以下先决条件：\n\n- IBM i 授权由用户的企业拥有。\n\
  - 捐赠机器和接收机器由用户的企业拥有。\n- 捐赠机器必须在与接收机器相同的用户企业中拥有至少一年。\n- 捐赠机器上启用了软件维护（SWMA）。每个待转移的软件授权都有\
  \ SWMA 覆盖。\n- 存在待转移授权的电子授权证明（ePoE）。\n- 捐赠机器授权为 IBM i 5.4 或更高版本。\n- 接收机器包括已激活的处理器，可用于容纳转移的授权。\n\
  \n转移到目标机器的每个 IBM i 处理器授权都包括一年免费的新 SWMA。额外年份的覆盖或 24x7 支持是额外收费的可选方案。\n\n#### 2.10.4\
  \ Linux\n\n以下类型的 Linux 发行版可运行在 Power E1080 上：\n\n- 支持原生 Power10 处理器技术\n- 在 POWER9\
  \ 兼容模式下运行\n\n支持原生 Power10 处理器技术的发行版也可以在 POWER9 兼容模式下运行。此功能在从基于 POWER9 处理器的服务器到 Power\
  \ E1080 进行 LPM 时很重要。\n\n### Red Hat\n\nRed Hat Enterprise Linux (RHEL) 版本 8.4 及更高版本可在原生\
  \ Power10 处理器模式下运行。撰写本文时，RHEL 版本 8.4 可用。\n\nOpenShift 和 CoreOS 也受支持。\n\n### SUSE\n\
  \nSUSE 15 SP3 是第一个支持原生 Power10 处理器技术的版本。其常规支持周期为 18 个月，外加长期 SP 支持。\n\n### 旧版发行版\n\
  \n以下选定的旧版发行版也在 Power E1080 上受支持：\n\n- RHEL 8.2 仅在 POWER9 兼容模式下受支持\n- SLES 12 SP5\
  \ 仅在 POWER9 兼容模式下受支持\n\n当 LPAR 在 POWER9 兼容模式下运行时，它受益于 Power10 处理器技术的大多数功能，包括每个核心最多八个线程。然而，使用新\
  \ Power10 指令或功能的程序和内核功能不可用。\n\n在基于 POWER9 处理器的系统和基于 Power10 处理器的系统之间来回移动分区时需要 POWER9\
  \ 兼容模式。在分区移动到基于 Power 10 处理器的系统后，可以升级到支持原生 Power10 技术支持的发行版并重新启动到原生 Power10 模式。\n\
  \n> 注意：对于 SLES 15 的旧服务包，例如 SLES 15 SP2，不提供官方的 POWER9 兼容模式支持。\n\n### 增强功能\n\nPower10\
  \ 处理器芯片的主要功能之一是能够支持每个 SCM 最多 15 个核心。因此，在配置了最多 240 个处理器核心的 Power E1080 上（每个核心可运行多达八个线程，最多可达\
  \ 1920 个线程），支持原生 Power10 技术支持的 Linux 发行版可以使用此功能。\n\n在 POWER9 兼容模式下运行的 LPAR 限制为每个\
  \ LPAR 1536 个线程，这是基于 POWER9 处理器的服务器的最大值。表 2-30 列出了最大逻辑 CPU、最大内存和支持 LPM 的最大内存，根据\
  \ Linux 发行版而定。\n\n表 2-30 最大线程与处理模式\n\n| Linux distribution | Processor mode | Maximum\
  \ logical CPUs | Maximum memory | Maximum memory with LPM |\n|---|---|---|---|---|\n\
  | RHEL 8.2 | POWER9 | 1536 | 64 TB | 16 TB |\n| RHEL 8.4 | Power10 | 1920 | 64 TB\
  \ | 64 TB |\n| SLES 12 SP5 | POWER9 | 1536 | 64 TB | 32 TB |\n| SLES 15 SP3 | Power10\
  \ | 1920 | 64 TB | 64 TB |\n\n\n\n\n\nPower10 专用的工具链在 Advance Toolchain 版本 15.0\
  \ 中可用，该版本允许客户和开发人员在编程时使用所有新的基于 Power10 处理器的技术指令。由于新的 PC 相对寻址模式，跨模块函数调用开销降低了。\n\n\
  一个具体优势是，在推理工作负载方面，相比基于 POWER9 处理器的技术具有 10 倍至 20 倍的优势，这是由于新的内存带宽和新指令所致。一个例子是新的专用特殊用途矩阵数学加速器（MMA），该加速器针对机器学习和深度学习推理的需求进行了定制。它还包括许多\
  \ AI 数据类型。\n\n网络虚拟化是一个具有显著演进和改进的领域，其优势惠及虚拟和容器化环境。以下是在 Power E1080 上针对 Linux 网络功能所做的最新改进：\n\
  \n- SR-IOV 允许在控制器级别对网络卡进行虚拟化，而无需在 VIOS 分区中创建虚拟共享以太网适配器。其增强功能包括 (vNIC) 虚拟网络接口控制器，该控制器允许数据直接从分区传输到或来自\
  \ SR-IOV 物理适配器，而无需经过 VIOS 分区。\n- 混合网络虚拟化（HNV）允许 Linux 分区使用 SR-IOV 逻辑端口的效率和性能优势，并参与移动操作，例如活动和非活动的实时分区迁移（LPM）和简化远程重启（SRR）。HNV\
  \ 是通过在配置 SR-IOV 逻辑端口时选择新的可迁移选项来启用的。\n- NVMe over Fibre Channel 结构（NVMe-OF）现在在运行\
  \ Linux 的 Power E1080 上可用，当使用 2 端口 32 Gb 适配器（#EN1A 或 #EN1B）并且使用所选的 IBM FlashSystem\
  \ 高端（FS9110）和中端（FS7200）型号时。\n"
- "## Security\n\n安全性是 IBM 及其分销合作伙伴的首要任务。IBM Power 上的 Linux 安全性是一个庞大的主题，可以作为详细的单独材料；然而，随着本节的介绍，在加固、完整性保护、性能、平台安全和认证方面引入了改进。\n\
  \n加固和完整性保护涉及在允许升级和维护内核的同时保护 Linux 内核免受未经授权的篡改。当在具有不可变操作系统的容器化环境中运行时，例如 OpenShift\
  \ 中的 CoreOS，这些主题变得更加重要。\n\n性能也是一个安全主题，因为特定的加固缓解策略（例如针对侧信道攻击）可能对性能产生显著影响。此外，密码学可能使用大量的计算周期。\n\
  \nPower E1080 具有在控制器级别的透明内存加密，可防止攻击者从物理内存或连接到处理器总线的存储类设备中检索数据。\n\n### 2.10.5 Virtual\
  \ I/O Server\n\nPower E1080 服务器所需的最低 VIOS 级别为 VIOS 3.1.3.10 或更高版本。\n\nIBM 定期更新 VIOS\
  \ 代码。有关更多信息，请参阅 IBM Fix Central。\n\n### 2.10.6 Entitled System Support\n\n授权系统支持网站（ESS）是\
  \ IBM 查看和管理 Power 和存储软件和硬件的首选位置。一般而言，大多数通过我们的 IBM Digital Sales 代表或业务合作伙伴购买的 IBM\
  \ Systems 提供的产品在使用 IBM Configurator 时可通过该网站访问。\n\n该网站包含以下三个主要部分：\n\n- My entitled\
  \ software：与 Power 和存储软件相关的活动，提供下载许可、免费和试用软件媒体、订购软件更新和管理软件密钥。\n- My entitled hardware：与\
  \ Power 和存储硬件相关的活动，提供续订更新访问密钥、购买和使用弹性容量按需、分配或购买企业池 2.0 中新旧池的积分、下载存储容量按需代码和管理混合容量积分。\n\
  - My inventory：与 Power 和存储库存相关的活动，提供浏览软件许可、软件维护和硬件库存、管理通过 Base Composer 的库存检索或生成多种类型的报告。\n\
  \n有关更多信息，请参阅此网页。\n\n### 2.10.7 Update Access Keys\n\n自 POWER8 处理器服务器推出以来，IBM 还引入了更新访问密钥（UAK）。\n\
  \n当系统固件更新应用于系统时，会检查 UAK 及其到期日期（见第 122 页图 2-37）。系统固件更新包括发布日期。\n\n尝试应用系统固件更新时，如果固件更新的发布日期超过了更新访问密钥的到期日期，则更新不会被处理。随着更新访问密钥到期，需要使用硬件管理控制台（HMC）或服务处理器上的\
  \ ASMI 进行更换。\n\n默认情况下，交付的新系统包含一个 UAK，通常在三年后到期。此后，只要存在维护合同，UAK 就可以每六个月延长一次。合同可以在\
  \ ESS 网站上验证（有关更多信息，请参阅第 119 页的 2.10.6“Entitled System Support”）。\n\n确定当前更新访问密钥何时到期可通过\
  \ HMC 的 GUI 或 CLI 按以下示例提供。然而，也可以使用合适的 AIX 或 IBM i 命令显示到期日期。\n\n## UAK expiration\
  \ date by using AIX 7.1\n\n对于 AIX 7.1，使用以下命令：\n\n```\nlscfg -vpl sysplanar0 | grep\

  #### 1.6.3 EXP24SX SAS 存储机箱\n\n如果您需要的磁盘数量超过内部磁盘托架提供的数量，您可以附加更多外部磁盘子系统，例如 EXP24SX\
  \ SAS 存储机箱（#ESLS）。\n\nEXP24SX 抽屉是一个存储扩展机箱，具有 24 个 2.5 英寸 SFF SAS 托架。它支持在 19 英寸机架的\
  \ 2 EIA 空间内最多 24 个热插拔 HDD 或 SSD。EXP24SX SFF 托架使用 SFF Gen2（SFF-2）载体或托盘。\n\n使用 AIX/Linux/VIOS\
  \ 时，EXP24SX 可以按四组 6 个托架（模式 4）、两组 12 个托架（模式 2）或一组 24 个托架（模式 1）订购。使用 IBM i 时支持一组 24\
  \ 个托架（模式 1）。可以通过使用软件命令以及专门记录的程序在现场更改模式设置。\n\n**重要提示：** 更改模式时，技术合格的人员必须遵循特殊记录的程序。不当更改模式可能会破坏\
  \ RAID 阵列，从而阻止访问数据，或允许其他分区访问另一个分区的数据。\n\nEXP24SX 抽屉与 PCIe Gen 3 SAS 适配器之间的连接通过 SAS\
  \ YO12 或 X12 电缆进行。PCIe Gen 3 SAS 适配器支持 6 Gb 吞吐量。如果未来的 SAS 适配器支持该功能，EXP24SX 抽屉可支持高达\

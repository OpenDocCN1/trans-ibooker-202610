  \ smart-log /dev/nvmeX -H`\n  其中 nvmeX 是 NVMe 设备的资源名称。\n  b. 查看已使用百分比字段。\n\n接近使用寿命末期的\
  \ NVMe 设备必须更换。设备很快将达到支持的写入操作次数限制。写入 NVMe 设备的操作会随着时间推移变慢，最终 NVMe 设备将成为只读设备。\n\n当操作系统向只读设备写入数据时，写入操作将被拒绝，操作系统会将其视为发生故障。要支持正常的写入操作，必须更换\
  \ NVMe 设备。\n\n#### 2.5.3 USB 子系统\n\nPower E1080 在系统节点中没有集成 USB 控制器或端口。必须使用 USB PCIe\

  \ | 共享 | eth0 |\n| OpenBMC UI | eth1 | 专用 | 仅管理端口 |\n| ipmi tool | lan1 | 共享 | eth0\
  \ |\n| ipmi tool | lan2 | 专用 | 仅管理端口 |\n| HMC task (change BMC/IPMI Network settings\

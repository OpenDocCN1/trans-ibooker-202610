  \ 的插槽）或\n- C68、C69、C70、C71（连接到 SCM P2 的插槽）或\n- C76、C77、C78、C79（连接到 SCM P0 的插槽）或\n\
  - C56、C57、C58、C59（连接到 SCM P1 的插槽）或\n- C64、C65、C66、C67（连接到 SCM P3 的插槽）或\n- C72、C73、C74、C75（连接到\
  \ SCM P2 的插槽）或\n- C80、C81、C82、C83（连接到 SCM P0 的插槽）\n\n> 注意：在多系统节点配置中，抽屉可以完全填充。其他抽屉可以部分填充或所有抽屉对称填充。\n\
  \n### 2.4 按需容量\n\n从 IBM Power Systems Private Cloud with Shared Utility Capacity（Power\
  \ Enterprise Pools 2.0）开始，Power E1080 服务器上提供多种类型的服务，以帮助在按需环境中满足不断变化的资源需求，使用已安装在系统上但未激活的资源。\n\
  \n有关 CoD 激活码的更多信息，请参阅 Power Systems Capacity on Demand。\n\n#### 2.4.1 新的按需容量功能\n\
  \nPower E1080 服务器具有与 Power E980 服务器提供的类似功能，但有一些变化：\n\n- 使用 IBM Power Systems Private\
  \ Cloud with Shared Utility Capacity（Power Enterprise Pools 2.0）配置时，可以订购仅具有一个基本处理器激活和\
  \ 256 GB 基本内存激活的 Power E1080 服务器。当使用 Power Enterprise Pools 2.0 配置时，所有资源都已激活；因此，其他\
  \ CoD 功能不受支持。\n- 不使用 IBM Power Systems Private Cloud with Shared Utility Capacity\
  \ 配置时：\n  - 每个 Power System E1080 服务器需要至少 16 个永久处理器核心激活，使用静态激活或 Linux on Power 激活。其余核心可通过额外功能永久或临时激活。\n\
  \  - 必须对已安装内存容量的至少 50% 进行激活。这些激活可以是静态的、移动的或 Linux on Power。\n  - 内存容量的至少 25% 必须具有静态激活或\
  \ Linux on Power 激活。\n  - Power E1080 服务器可以与 Power E980 服务器一起参与同一个 IBM Power Enterprise\
  \ Pool 1.0，但不能与 Power E870C、Power E880 和 Power E880C 服务器一起参与。\n  - CUoD、预付弹性按需容量（4586-COD）和试用按需容量（Trial\
  \ CoD）可与 Power E1080 服务器一起使用。\n  - 实用按需容量（Utility CoD）在 Power E1080 服务器上不受支持。\n\
  \  - 后付弹性 CoD 服务在 Power E1080 服务器上不可用。\n  - 企业容量备份（CBU）服务在 Power E1080 服务器上不可用。\n\
  \  - Mobile-Enabled 激活在 Power E1080 服务器上不可用。\n\n#### 2.4.2 IBM Power Systems Private\
  \ Cloud with Shared Utility Capacity\n\nIBM Power Systems Private Cloud with Shared\
  \ Utility Capacity 解决方案（Power Enterprise Pools 2.0）是一种基础设施提供模式，可通过按使用付费的定价实现云敏捷性和成本优化。\n\
  \n池中系统的所有已安装处理器和内存都已激活，并在池启动时可供立即使用。每个服务器上的处理器和内存使用情况按分钟跟踪并在整个池中汇总。\n\n该模型中的容量由基本激活和容量积分组成，这些容量积分在池中共享，无需在服务器之间移动。池中未购买的容量可以按需付费使用。\n\
  \n超过池汇总基本资源的资源使用量按分钟计费为计量容量。它还实时从购买的容量积分中扣除，如图 2-14 所示。\n\n![](img/7c8373945565ba432037f60bbf8458eb_90_0.png)\n\
  \n图 2-14 IBM Power Systems Private Cloud with Shared Utility Capacity\n\nIBM Power\
  \ Systems Private Cloud with Shared Utility Capacity 解决方案仅支持特定 POWER9 和 Power10\
  \ 处理器系统的系统。Power E1080 服务器可以与同一池中的 Power E980 系统共存。\n\n单个 Power Enterprise Pool\
  \ 2.0 支持多达 2000 个 VM；每个 HMC 支持多达 1000 个 VM。截至本文撰写时，每个 Power E1080 服务器支持多达 200 个\
  \ VM，预计将增加到每个 Power E1080 750 个 VM。\n\n除了处理器和内存计量外，Power Enterprise Pools 2.0 还支持在池中计量\
  \ AIX 和 IBM i 软件授权以及 SLES 和 RHEL 订阅。\n\n有关更多信息和要求，请参阅 IBM Power Systems Private\
  \ Cloud with Shared Utility Capacity，SG24-8478。\n\n#### 2.4.3 静态、移动和基本激活\n\n静态处理器和内存激活仅限于单个系统。它们是通过在管理系统的\
  \ HMC 中输入代码来启用的。额外的核心或内存可立即供系统上的工作负载使用。\n\n静态激活有两种版本：\n\n- 静态激活：此标准处理器或内存激活可运行 VIOS、AIX、IBM\
  \ i 和 Linux 工作负载\n- 适用于 Linux 的静态激活：此处理器或内存激活只能运行 VIOS 和 Linux 工作负载\n\n移动激活针对特定服务器订购，但可以移动到\
  \ Power Enterprise Pool 1.0 中的任何服务器并支持任何类型的应用程序。移动激活可以在初始订单中购买，也可以用 MES 升级购买。\n\n\
  基本处理器和内存激活与单个系统相关联，最初充当静态激活。当系统添加到 Power Enterprise Pools 2.0 配置时，其所有基本激活都将添加到池的基本容量中。\n\
  \n处理器和内存资源的基本激活有以下类型：\n\n- 基本激活：此处理器或内存激活可运行 VIOS、AIX、IBM i 和 Linux 工作负载。最初，基本激活就像静态激活一样，直到系统添加到\
  \ Power Enterprise Pool 2.0。静态和移动激活可以通过 MES 订单转换为基本激活。\n- 适用于 Linux 的基本激活：此基本处理器激活只能运行\
  \ VIOS 和 Linux 工作负载。\n\n表 2-7 列出了可在 Power E1080 服务器上初始订购的静态、移动和基本处理器激活功能。\n\n表 2-7\

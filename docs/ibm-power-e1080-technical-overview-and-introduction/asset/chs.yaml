  \ with two PCIe Gen 3 6-slot Fanout Modules, distribute the PCIe adapters across\
  \ both I/O modules whenever possible\n\nSlots 1, 7, 4, and 10 support SR-IOV capabilities.\
  \ However, if the total amount of physical memory is less than 128 GB, Slot 4 (P1-C4)\
  \ and Slot 10 (P2-C4) are not SR-IOV capable.\n\nFigure 2-27 shows the connection\

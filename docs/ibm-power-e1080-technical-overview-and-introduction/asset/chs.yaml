  每根电缆的长度为 775 mm（2.5 ft.），其胶带颜色为紫色。如图 2-12 所示，此配置需要 16 根电缆。\n\n#### 2.2.2 SMP 电缆\
  \ RAS 属性\n\n每个 SMP 总线有 18 个通道，并分为两根单独的电缆，每根电缆有九个通道。每个 SMP 电缆上使用一个 SMP 备用通道（八个通道用于数据，一个通道作为备用）。如果两根\
  \ SMP 电缆之一发生故障，所有流量都将路由到剩余的一根电缆，从而使带宽减半。\n\nPower E1080 支持外部 SMP 电缆的并发修复；因此，更换外部\
  \ SMP 电缆时无需关闭整个服务器。\n\n并发修复过程使系统能够在不中断系统的情况下将 OP 总线恢复到全功能状态。\n\n### 2.3 内存子系统\n\n\
  Power E1080 服务器使用下一代差分双列直插内存模块（DIMMs），这是一种高性能、高可靠性、高功能内存卡，包含缓冲芯片、智能和 2933/3200 MHz\
  \ DRAM 内存。\n\n使用 DDR4 技术提供 2933/3200 MHz DRAM 内存。DDIMM 放置在系统节点的 DDIMM 插槽中。\n\n每个\
  \ Power10 芯片内存控制器单元（MCU）提供片上 SMP 互连结构与 OpenCAPI 内存接口（OMI）链路之间的系统内存接口。逻辑上每个芯片上有八个基本独立的\
  \ MCU 通道，接口到总共 16 条高速 OMI 链路。\n\n每个内存通道支持两条 OMI 链路（称为子通道 A 和 B），如图 2-13 第 73 页所示，该图还显示了与相关子通道、通道和内存控制器单元关联的内存插槽位置。\n\
  \n所有 16 个 OMI 子通道都来自 Power10 SCM，并布线到 16 个基于内存缓冲器的 DDIMM 插槽，每个 OMI 子通道连接一个 DDIMM。\n\
  \n![](img/7c8373945565ba432037f60bbf8458eb_86_0.png)\n\n图 2-13 内存子系统逻辑图\n\n每个 Power10\
  \ 处理器芯片支持 16 个 DDIMM；因此，每个 Power E1080 CEC 抽屉最多可支持 64 个 DDIMM，可支持高达 16 TB 的内存 RAM\
  \ 容量。\n\nPower E1080 支持的 DDIMM 密度为 32 GB、64 GB、128 GB 和 256 GB，任何内存功能代码均提供四个 DDIMM。DDIMM\
  \ 具有自己的电压调节器，并且为 n+1 冗余。使用两个 PMIC 加上两个备用。\n\n需要两个电源管理 IC（PMIC）为 DDIMM 供电所需的所有电压等级。在\
  \ DDIMM 上，使用四个 PMIC，由两个冗余对组成。如果每个冗余对中的一个 PMIC 仍可运行，则不会要求更换 DDIMM。\n\n如 1.5.3 节“内存功能”第\
  \ 19 页所述，Power E1080 要求激活 50% 或更多已安装的物理内存。\n\nPowerVM Hypervisor 提供主动内存镜像，旨在确保系统操作继续进行（即使在主内存中发生不可纠正错误的不太可能情况下）。\n\
  \n#### 2.3.1 内存带宽\n\nPower10 单芯片模块（SCM）支持 16 条开放内存接口（OMI）链路，每条 OMI 链路依次驱动一个差分 DIMM（DDIMM）。一条\
  \ OMI 链路代表 8 个通道的捆绑，因此能够在一笔交易中传输 8 字节。\n\nPower E1080 提供四种不同的 DDIMM 尺寸：32 GB、64\
  \ GB、128 GB 和 256 GB。32 GB 和 64 GB DDIMM 以 3200 Mbps 的数据速率运行；128 GB 和 256 GB DDIMM\
  \ 以 2933 Mbps 的数据速率运行。\n\n表 2-6 列出了可用的 DDIMM 容量及其相关的每条 OMI 链路和每个 Power10 SCM 的最大理论带宽。\n\
  \n表 2-6 支持的 DDIMM 尺寸的内存带宽\n\n| DDIMM 容量 | 数据速率 | 每条 OMI 链路的最大理论带宽 | 每个 SCMᵃ 的最大理论带宽\
  \ |\n|---|---|---|---|\n| 32 GB / 64 GB | 3200 Mbps | 25.6 GBps | 409.6 GBps |\n\
  | 128 GB / 256 GB | 2933 Mbps | 23.5 GBps | 375.4 GBps |\n\na. 连接到一个 SCM 的 DDIMM\
  \ 模块必须全部为相同尺寸\n\n**重要提示：** 为了获得最佳性能，通常建议在所有内存插槽中安装内存，并在所有系统节点抽屉和系统中的所有 SCM 上均匀分布。\n\
  \n在已安装的系统平面卡上平衡内存可以以一致的方式实现内存访问，通常会为您的配置带来更好的性能。\n\n主动内存扩展（AME）功能是一个选项，可以增加系统的有效内存容量。AME\
  \ 使用片上嵌套加速器（NX）单元压缩或解压缩内存内容。此单独定价的硬件功能在分区（LPAR）级别启用。相关的 LPAR 配置文件参数允许根据内存容量需求和性能权衡考虑来配置压缩因子。\n\
  \n#### 2.3.2 内存放置规则\n\n在 Power E1080 单节点系统中，每个 SCM 必须填充 16 个内存 DDIMM 插槽中的八个。仅支持四的倍数增量，所有这些容量相同。这四个\
  \ DDIMM 必须全部插入连接到 SCM 的八个剩余插槽中的四个。\n\nDDIMM 不能以导致 SCM 后方有奇数个 DDIMM 插槽被填充的方式安装。DDIMM\
  \ 也不能以导致 SCM 后方填充 10 或 14 个 DDIMM 插槽的配置安装。连接到特定 SCM 的插槽中插入的 DDIMM 的唯一有效数量是 8、12\
  \ 或 16。\n\nPower E1080 系统必须遵守以下 DDIMM 插拔规则：\n\n- 允许的最小内存为 1 TB（参见 1.5.1“最小配置”第 15\
  \ 页）。\n- 每个 SCM 下的所有 DDIMM 必须具有相同的容量。\n- DDIMM 必须以四的组（四组）插入。\n- 每个 DDIMM 四组必须全部为相同尺寸和类型（彼此相同），并且必须与每个\
  \ SCM 下的其他 DDIMM 四组相同，但可以与其他 SCM 的 DDIMM 四组不同。\n\n例如，在一个系统节点配置中：\n\n- 第一个 SCM 可以连接到\
  \ 8x32 GB DDIMMS\n- 第二个 SCM 可以连接到 8x64 GB DDIMMS\n- 第三个 SCM 可以连接到 8x128 GB DDIMMS\n\
  - 第四个 SCM 可以连接到 8x256 GB DDIMMS\n\n当所有四组彼此匹配时，整体系统性能会提高。上一代服务器的物理内存功能不能迁移到 Power\
  \ E1080。\n\n为了获得最佳性能，通常建议在所有内存插槽中安装内存，并在所有系统节点抽屉和所有 SCM 上均匀分布。\n\n在已安装的系统平面卡上平衡内存可以以一致的方式实现内存访问，通常会为您的配置带来更好的性能。\n\
  \n您必须在决定初始系统订购时使用的内存功能尺寸时考虑任何未来的内存升级计划。\n\n最小内存的插拔顺序\n\nPower E1080 抽屉至少需要 32 个\
  \ DDIMM。每个 SCM 需要两个 DDIMM 四组。\n\n在两个内存控制器之间均匀分布 DDIMM 可提供最大性能。每个四组内的 DDIMM 必须为相同尺寸和类型，并且每个\
  \ SCM 下的所有 DDIMM 必须具有相同容量。\n\n一个 DDIMM 四组可以与别处插入的 DDIMM 四组不同。\n\n请按照以下顺序插入 32 个\
  \ DDIMM，并以第 73 页的图 2-13 为参考：\n\n- C20、C21、C22、C23、C24、C25、C26、C27（连接到 SCM P1 的插槽）\n\
  - C28、C29、C30、C31、C32、C33、C34、C35（连接到 SCM P3 的插槽）\n- C36、C37、C38、C39、C40、C41、C42、C43（连接到\
  \ SCM P2 的插槽）\n- C44、C45、C46、C47、C48、C49、C50、C51（连接到 SCM P0 的插槽）\n\n\n\n\n\n## 剩余\
  \ DDIMM 的插接顺序\n\n对于 Power E1080 抽屉，本节描述了下一个 DDIMM 四件套的顺序和规则。\n\n对于要安装在连接到四个 pSCM\
  \ 之一的插槽中的下一个 DDIMM 四件套，请考虑以下规则：\n\n- 每个四件套内的 DDIMM 必须具有相同的尺寸和类型。\n- 每个 SCM 下的所有\
  \ DDIMM 必须具有相同的容量。\n- DDIMM 四件套可以与别处插入的 DDIMM 四件套不同，包括连接到同一 SCM 的另一个四件套。\n- 将剩余的\
  \ DDIMM 四件套插入任何剩余的空 DIMM 插槽四件套中，并且每个 SCM 下的所有 DDIMM 必须具有相同的容量\n\n请遵守以下顺序并以第 73 页的图\

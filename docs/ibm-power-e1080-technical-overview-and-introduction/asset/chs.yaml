  \ RAID1 保护\n- 4 端口 1 Gb 以太网（RJ-45）、2 端口 10 Gb 以太网（RJ-45）、两个 USB 3.0 端口（前面板）和两个 USB\
  \ 3.0 端口（后面板），以及 1 Gb IPMI 以太网（RJ-45）\n- 两个 900W 电源单元\n- 远程管理服务：IPMI 端口（OpenBMC）和\
  \ Redfish 应用程序编程接口（API）\n- 基础保修为 1 年 9x5，可选升级\n\n未包含 USB Smart Drive。\n\n> 注意：V10R1\

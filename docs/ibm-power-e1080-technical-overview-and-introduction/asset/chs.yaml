  \n每个 Power10 处理器芯片插座对外提供四个 SMP/OpenCAPI 总线：\n\n- OP6：SMP 或 OpenCAPI\n- OP2：仅 SMP\n\
  - OP1：仅 SMP\n- OP4：SMP 或 OpenCAPI\n\n相同的电缆用于两种不同的模式：\n\n- 用于互连系统节点抽屉的 SMP\n- OpenCAPI\n\
  \n每根电缆包含 9 个位通道：\n\n- SMP 模式使用九个可用通道中的九个\n- OpenCAPI 模式使用九个通道中的八个\n\n#### 2.2.1\
  \ 双系统节点抽屉 OP 总线连接\n\n在双系统抽屉配置中，两个 OP 总线在两个抽屉之间互连处理器。图 2-12 显示了使用正确的一组电缆，通过 SMP 端口在第一个系统节点抽屉与第二个系统节点抽屉之间建立的所有连接。\n\

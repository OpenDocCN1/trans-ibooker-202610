  \n### 1.3 System control unit\n\nThe system control unit (SCU) is implemented in\
  \ a 2U high chassis and provides system hardware, firmware, and virtualization control\
  \ functions through a pair of redundant Flexible Service Processor (FSP) devices.\
  \ It also contains the operator panel and the electronics module that stores the\
  \ system vital product data (VPD). The SCU is also prepared to facilitate USB connectivity\
  \ that can be used by the Power E1080 server.\n\nOne SCU is required and supported\
  \ for each Power E1080 server (any number of system nodes) and, depending on the\
  \ number of system nodes, the SCU is powered according to the following rules:\n\
  \n- Two universal power interconnect (UPIC) cables are used to provide redundant\
  \ power to the SCU.\n- In a Power E1080 single system node configuration, both UPIC\
  \ cables are provided from the single system node to be connected to the SCU.\n\
  - For a two, three, or four system nodes configuration, one UPIC cable is provided\
  \ from the first system node and the second UPIC cable is provided from second system\
  \ node to be connected to the SCU.\n\nThe set of two cables facilitate a 1+1 redundant\
  \ electric power supply. In case of a failure of one cable, the remaining UPIC cable\
  \ is sufficient to feed the needed power to the SCU.\n\nTwo service processor cards\
  \ in SCU are ordered by using two mandatory #EDFP features. Each one provides two\
  \ 1 Gb Ethernet ports for the Hardware Management Console (HMC) system management\
  \ connection. One port is used as primary connection and the second port can be\
  \ used for redundancy. To enhance resiliency, it is recommended to implement a dual\
  \ HMC configuration by attaching separate HMCs to each of the cards in the SCU.\n\
  \nFour FSP ports per FSP card provide redundant connection from the SCU to each\
  \ system node. System nodes connect to the SCU by using the cable features #EFCH,\
  \ #EFCE, #EFCF, and #EFCG. Feature #EFCH connects the first system node to the SCU\
  \ and it is included by default in every system node configuration. It provides\
  \ FSP, UBIC, and USB cables, but no symmetric multiprocessing (SMP) cables. All\
  \ the other cable features are added depending on the number of extra system nodes\
  \ that are configured and includes FSP and SMP cables.\n\nThe SCU implementation\
  \ also includes the following highlights:\n\n- Elimination of clock cabling since\
  \ the introduction of POWER9 processor-based servers\n- Front-accessible system\
  \ node USB port\n- Optimized UPIC power cabling\n- Optional external DVD\n- Concurrently\
  \ maintainable time of day clock battery\n\nFigure 1-5 shows the front and rear\
  \ view of a SCU with the locations of the external ports and features.\n\n![](img/7c8373945565ba432037f60bbf8458eb_24_0.png)\n\
  \nFigure 1-5 Front and rear view of the system control unit\n\n### 1.4 Server specifications\n\
  \nThe Power E1080 server specifications are essential to plan for your server. For\
  \ a first assessment in the context of your planning effort, this section provides\
  \ you with an overview related to the following topics:\n\n- Physical dimensions\n\
  - Electrical characteristics\n- Environment requirements and noise emission\n\n\
  For more information about the comprehensive Model 9080-HEX server specifications\
  \ product documentation, see IBM Documentation.\n\n#### 1.4.1 Physical dimensions\n\
  \nThe Power E1080 is a modular system that is built of a single SCU and one, two,\
  \ three, or four system nodes.\n\nEach system component must be mounted in a 19-inch\
  \ industry standard rack. The SCU requires 2U rack units and each system node requires\
  \ 5U rack units. Thus, a single-node system requires 7U, a two-node system requires\
  \ 12U, a three-node system requires 17U, and a four-node system requires 22U rack\
  \ units. More rack space must be allotted; for example, to PCIe I/O expansion drawers,\
  \ a hardware management console, flat panel console kit, network switches, power\
  \ distribution units, and cable egress space.\n\nTable 1-2 lists the physical dimensions\
  \ of the Power E1080 server control unit and a Power E1080 server node. The component\
  \ height is also given in Electronic Industries Alliance (EIA) rack units. (One\
  \ EIA unit corresponds to one rack unit (U) and is defined as 1 3/4 inch or 44.45\
  \ mm respectively).\n\nTable 1-2 Physical dimensions of the Power E1080 server components\n\
  \n| Dimension | Power E1080 server control unit | Power E1080 server node |\n|---|---|---|\n\
  | Width | 445.6 mm (17.54 in) | 445 mm (17.51 in) |\n| Depth | 779.7 mm (30.7 in)\
  \ | 866.95 mm (34.13 in) |\n| Height | 86 mm (3.39 in) / 2 EIA units | 217.25 mm\
  \ (8.55 in) / 5 EIA units |\n| Weight | 22.7 kg (50 lb) | 81.6 kg (180 lb) |\n\n\
  #### Lift tools\n\nIt is recommended to have a lift tool available at each site\
  \ where one or more Power E1080 servers are located to avoid any delays when servicing\
  \ systems. An optional lift tool #EB2Z is available for order with a Power E1080\
  \ server. One #EB2Z lift tool can be shared among many servers and I/O drawers.\
  \ The #EB2Z lift tool provides a hand crank to lift and position up to 159 kg (350\
  \ lb). The #EB2Z lift tool is 1.12 meters x 0.62 meters (44 in x 24.5 in).\n\n>\
  \ Note: A single system node can weigh up to 86.2 kg (190 lb). Also available are\
  \ a lighter, lower-cost lift tool #EB3Z and wedge shelf tool kit for #EB3Z with\
  \ feature code #EB4Z.\n\n#### 1.4.2 Electrical characteristics\n\nEach Power E1080\
  \ server node has four 1950 W bulk power supplies. The hardware design provides\
  \ N+2 redundancy for the system power supply, and any node can continue to operate\
  \ at full function in nominal mode with any two of the power supplies functioning.\n\
  \nDepending on the specific Power E1080 configuration, the power for the SCU is\
  \ provided through two UPIC cables connected to one or two system nodes, as described\
  \ in 1.2, “System nodes” on page 6.\n\nTable 1-3 lists the electrical characteristics\
  \ per Power E1080 server node. For planning purposes, use the maximum values that\
  \ are provided. However, the power draw and heat load depends on the specific processor,\
  \ memory, adapter, and expansion drawer configuration and the workload characteristics.\n\
  \nTable 1-3 Electrical characteristics per Power E1080 server node\n\n| Electrical\
  \ characteristics | Properties |\n|---|---|\n| Operating voltage | 200 - 208 / 220\
  \ - 240 V AC |\n| Operating frequency | 50 or 60 Hz +/- 3 Hz AC |\n| Maximum power\
  \ consumption | 4500 W |\n| Maximum power source loading | 4.6 kVA |\n| Maximum\
  \ thermal output | 15355 BTU/h |\n| Phase | Single |\n\n> Note: The Power E1080\
  \ must be installed in a rack with a rear door and side panels for electromagnetic\
  \ compatibility (EMC) compliance.\n\n#### 1.4.3 Environment requirements and noise\
  \ emission\n\n> Environmental assessment: The IBM Systems Energy Estimator tool\
  \ can provide more accurate information about power consumption and thermal output\
  \ of systems based on a specific configuration.\n\nThe environment requirements\
  \ for the Power E1080 servers are classified in operating and non-operating environments.\
  \ The operating environments are further segmented regarding the recommended and\
  \ allowable conditions.\n\nThe recommended operating environment designates the\
  \ long-term operating environment that can result in the greatest reliability, energy\
  \ efficiency, and reliability. The allowable operating environment represents where\
  \ the equipment is tested to verify functionality. Because the stresses that operating\
  \ in the allowable envelope can place on the equipment, these envelopes must be\
  \ used for short-term operation, not continuous operation.\n\nThe condition of a\
  \ non-operating environment pertains to the situation when equipment is removed\
  \ from the original shipping container and is installed, but is powered down. The\
  \ allowable non-operating environment is provided to define the environmental range\
  \ that an unpowered system can experience short term without being damaged.\n\n\
  Table 1-4 on page 14 lists the environment requirements for the Power E1080 server\
  \ regarding temperature, humidity, dew point, and altitude. It also lists the maximum\
  \ noise emission level for a fully configured Power E1080 server.\n\n\n\n\n\n##\

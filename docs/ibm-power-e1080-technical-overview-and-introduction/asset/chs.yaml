  \ 扩展抽屉上的 SAS 磁盘不受支持。如果需要直接连接的 SAS 磁盘，则必须将其安装在 SAS 磁盘抽屉中并连接到 PCIe 插槽中受支持的 SAS 控制器之一。\n\
  \n建议将不需要高带宽的适配器放置在 EMX0 PCIe Gen 3 扩展抽屉中。将低带宽适配器放置在低延迟、高带宽插槽中并不是系统资源的最佳利用。\n\nIBM\
  \ 建议在系统包含 EMX0 PCIe Gen 3 扩展抽屉时使用所有适配器的高轮廓版本。此配置允许用户将大多数适配器放置在 EMX0 PCIe Gen 3 扩展抽屉内。通常建议使用节点插槽用于电缆适配器（#EJ24）或高带宽\
  \ PCIe Gen 4 或 PCIe Gen 5 适配器。\n\n#### 2.5.2 内部 NVMe 存储子系统\n\nPower E1080 支持 NVMe\
  \ 存储技术。NVMe 子系统可在每个 E1080 服务器节点抽屉中使用。每个系统节点在系统后部中央均设有四个内部 NVMe U.2 驱动器插槽。插槽可以独立分配给任意分区（见图\

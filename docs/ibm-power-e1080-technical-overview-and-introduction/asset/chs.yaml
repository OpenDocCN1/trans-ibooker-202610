  Power E1080 产品文档提供了各种不同 Power E1080 服务器配置的噪声排放值综合列表。有关噪声排放的更多信息，请在 IBM 文档中搜索“Model\
  \ 9080-HEX server specifications”。\n\n> 注意：政府法规，例如职业安全健康管理局 (OSHA) 或欧洲共同体指令发布的法规，可以规范工作场所的噪声水平暴露，可能适用于您和您的服务器安装。Power\
  \ E1080 服务器提供可选的隔音门功能，可帮助降低该系统发出的噪声。\n> \n> 您的安装中的声压级取决于多种因素，包括安装中的机架数量；您指定安装机架的房间的大小、材料和配置；其他设备的噪声水平；房间环境温度，以及员工相对于设备的位置。\n\
  > \n> 此外，是否符合此类政府法规还取决于其他多种因素，包括员工的暴露时长以及员工是否佩戴听力保护装置。IBM 建议您咨询该领域的合格专家，以确定您是否符合适用的法规。\n\
  \n### 1.5 系统特性\n\n本节列出并解释了 Power E1080 服务器上可用的系统特性。这些特性描述了系统默认可用或通过采购可配置特性代码而获得的资源。\n\

  \ E1080 服务器节点支持多达四个 7 mm NVMe U.2 驱动器，这些驱动器插入 4 盘位 NVMe 载体背板（功能代码 EJBC）。每个系统节点都需要一个背板，即使未选择\
  \ NVMe U.2 驱动器。\n\n每个 NVMe U.2 驱动器可以独立分配给不同的 LPAR 以托管操作系统并从中启动。它们也可以用于非数据密集型工作负载。NVMe\
  \ U.2 驱动器可并发更换。\n\n表 1-13 列出了 Power E1080 可用的 NVMe 驱动器功能代码以及操作系统支持。\n\n表 1-13 NVMe\
  \ 功能\n\n| 功能代码 | CCIN | 描述 | OS 支持 |\n|---|---|---|---|\n| EC5J | 59B4 | 主流 800\
  \ GB SSD NVMe U.2 模块 | AIX and Linux |\n| EC5K | 59B5 | 主流 1.6 TB SSD NVMe U.2 模块\
  \ | AIX and Linux |\n| EC5L | 59B6 | 主流 3.2 TB SSD NVMe U.2 模块 | AIX and Linux |\n\
  | EC7Q | 59B4 | 800 GB 主流 NVMe U.2 SSD 4k for AIX/Linux | AIX and Linux |\n\n有关更多信息，请参阅第\
  \ 87 页的 2.5.2，“内部 NVMe 存储子系统”。\n\n对于运行 IBM i 的系统，扩展或存储抽屉可以满足 NVMe 需求。\n\n### 1.5.6\
  \ 系统节点 USB 功能\n\nPower E1080 支持一个与功能代码 EUA5 关联的独立外部 USB 驱动器。该功能代码包括将 USB 驱动器连接到\
  \ SCU 上首选前面板可访问 USB 端口的电缆。\n\nPower E1080 服务器节点不提供集成 USB 端口。USB 3.0 适配器功能代码 EC6J\
  \ 需要提供对可选外部 USB DVD 驱动器的连接，并占用一个系统节点或 I/O 扩展抽屉 PCIe 插槽。适配器通过与功能代码 EC6N 关联的电缆连接到\
  \ SCU 后部的 USB 端口。由于该电缆长 1.5 m，因此对于具有多个系统节点的 Power E1080，USB 3.0 适配器只能用于第一个或第二个系统节点。\n\
  \nUSB 3.0 适配器功能代码 EC6J 支持分配给 LPAR，并可从一个运行的 LPAR 迁移到另一个 LPAR，包括连接的 DVD 驱动器。这种设计允许根据需要将\
  \ DVD 驱动器功能分配给任何 LPAR。\n\n系统资源的动态分配，例如处理器、内存和 I/O，也称为 *dynamic LPAR* 或 *DLPAR*。\n\
  \n有关 USB 子系统的更多信息，请参阅第 23 页的 1.5.6，“系统节点 USB 功能”。\n\n### 1.5.7 电源功能\n\n每个 Power\
  \ E1080 服务器节点都有四个 1950 W 批量电源单元，在 240 V 下运行。这些电源单元功能是每个 Power E1080 系统节点的默认配置。每个系统节点的四个单元没有关联的功能代码，并且在开始新的配置任务时始终由\
  \ IBM 配置器自动选择。\n\n来自电源分配单元（PDU）的四根电源线为这些电源供电，这些电源连接到系统后部线缆导管上的四个 C13/C14 型插座。电源线缆导管从后部获取源电源，并连接到系统前部的电源单元。\n\
  \n系统设计为系统批量电源提供 N+2 冗余，允许系统在任意两个电源单元正常工作时继续运行。故障单元必须保留在系统中，直到有新的电源单元可供更换为止。\n\n\
  电源单元可热插拔，允许在不中断系统的情况下更换故障单元。电源单元放置在系统前面，这使得任何必要的维护都变得更加容易。\n\n图 1-7 显示了电源单元及其在系统中的物理位置，标记为\
  \ E1、E2、E3 和 E4。\n\n![](img/7c8373945565ba432037f60bbf8458eb_37_0.png)\n\n### 1.5.8\

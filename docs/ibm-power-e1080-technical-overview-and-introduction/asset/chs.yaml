- '## 前言


  本 IBM® Redpaper® 出版物提供了对 IBM Power® E1080 服务器（也称为 Power E1080）新架构的广泛理解，该服务器支持 IBM
  AIX®、IBM i 以及选定的 Linux 操作系统发行版。本文档的目的是介绍 Power E1080，即 IBM Power 产品组合中最强大和最可扩展的服务器，以及它的产品和相关功能：


  - ► 设计支持多达四个系统节点和多达 240 个 IBM Power10™ 处理器内核


  Power E1080 可按一、二、三或四节点配置订购，每个节点提供多达 60 个 Power10 处理器内核，最大可达四节点配置中的 240 个 Power10
  处理器内核。


  - ► 设计支持多达 64 TB 内存


  Power E1080 最初可订购的总内存 RAM 容量最高达 8 TB，并在完整的四系统节点服务器中支持多达 64 TB。


  - ► 设计支持在完整的四系统节点服务器中多达 32 个 Peripheral Component Interconnect® (PCIe) Gen 5 插槽，以及使用扩展
  I/O 抽屉的多达 192 个 PCIe Gen 3 插槽


  - ► 多达超过 4,000 个直接连接的串行连接 SCSI (SAS) 磁盘或固态驱动器 (SSD)


  - ► 每台系统多达 1,000 个虚拟机 (VM) 具有逻辑分区 (LPAR)


  - ► 系统控制单元，提供冗余系统主 Flexible Service Processor (FSP)


  - ► 支持 IBM Power System Private Cloud Solution with Dynamic Capacity


  本出版物面向希望更好地了解 Power 服务器的专业人士。预期读者包括以下角色：


  - ► 客户

  - ► 销售和营销专业人员

  - ► 技术支持专业人员

  - ► IBM 业务合作伙伴

  - ► 独立软件供应商 (ISVs)


  本文不替代当前的营销材料和配置工具。它旨在作为额外信息来源，结合现有资料，可用于增强您对 IBM 服务器解决方案的了解。



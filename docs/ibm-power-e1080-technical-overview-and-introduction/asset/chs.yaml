  \ Power10 处理器芯片中的每一个都通过 SMP OP 总线直接连接到每个其他系统节点抽屉中相同位置的 Power10 处理器芯片。任意两个系统节点抽屉之间的每个\
  \ OP 总线连接使用一对电缆进行连接，每根电缆承载数据通道的一半。\n\nPower System E980 SMP 电缆不能在 Power E1080 上使用，因为基于\
  \ Power10 处理器的服务器使用不同的一组电缆。\n\n图 2-11 显示了系统节点抽屉中每个 Power10 处理器插座如何将总线路由到机箱后部的尾架。第一个插座中的\

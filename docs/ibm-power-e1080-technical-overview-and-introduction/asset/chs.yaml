  \n### 2.7 外部 I/O 子系统\n\n可通过使用额外的外部 PCIe 扩展抽屉和外部 SAS 磁盘扩展抽屉来扩展 Power E1080 的 I/O\
  \ 容量。\n\n本节描述可连接到 Power E1080 服务器的 PCIe Gen3 I/O 扩展抽屉（#EMX0）。\n\n在初始可用性时，Power E1080\
  \ 每个系统节点支持四个 PCIe Gen3 I/O 抽屉，从而使每台 2 节点 Power E1080 服务器配置最多可达八个 I/O 抽屉。一个 I/O 抽屉支持两个扇出模块，每个模块提供六个\
  \ PCIe Gen 3 适配器插槽。此配置为每个系统节点提供额外的 48 个 PCIe Gen 3 插槽容量，2 节点服务器最多可达 96 个 PCIe Gen\
  \ 3 插槽。\n\n系统节点中的全部八个插槽可用于连接四个 I/O 抽屉。始终建议在可用的系统节点之间平衡 I/O 抽屉连接。\n\n随着后期 GA 期间 3\
  \ 节点和 4 节点 Power System E1080 配置的可用性，PCIe Gen 3 I/O 抽屉的数量相应扩展，4 节点 Power E1080 最多可达\
  \ 16 个。在该日期时，每个系统节点最多可提供 48 个 PCIe Gen 3 插槽，每个 4 节点 Power E1080 服务器最多可提供 192 个 PCIe\
  \ Gen 3 插槽。\n\nPCIe Gen 3 I/O 扩展抽屉（#EMX0）中的每个扇出模块均由一根光缆适配器连接，该适配器占用系统节点的一个 x16 PCIe\
  \ Gen 4 插槽。\n\n支持的 I/O 抽屉最大数量和 PCIe 插槽总数量列于表 2-24。\n\n表 2-24 支持的 I/O 抽屉最大数量和 PCIe\
  \ 插槽总数量\n\n| 系统节点 | 最大 #EMX0 抽屉数 | 总插槽数 |  |  |\n| | | PCIe Gen 3, x16 | PCIe Gen\
  \ 3, x8 | 总 PCIe Gen 3 |\n| 一个系统节点 | 4 | 16 | 32 | 48 |\n| 两个系统节点 | 8 | 32 | 64\
  \ | 96 |\n| 三个系统节点 | 12 | 48 | 96 | 144 |\n| 四个系统节点 | 16 | 64 | 128 | 192 |\n\n\
  #### 2.7.1 PCIe Gen 4 电缆适配器\n\nPCIe Gen3 I/O 扩展抽屉（#EMX0）通过使用放置在系统节点内任意 PCIe 插槽中的\
  \ PCIe Gen 4 I/O 扩展卡（#EJ24）连接到系统节点。一个扩展卡适配器通过 CXP 16X 有源光缆（AOC）对连接到 PCIe Gen3 I/O\
  \ 扩展抽屉（#EMX0）的 PCIe Gen 3 6 槽扇出模块（#EMXH）。因此，该适配器也称为 PCIe Gen 4 CXP 电缆适配器。\n\nPCIe\
  \ Gen 4 电缆适配器如图 2-24 所示。\n\n![](img/7c8373945565ba432037f60bbf8458eb_111_0.png)\n\
  \n图 2-24 PCIe Gen 4 电缆适配器（#EJ24）\n\nPCIe Gen 4 电缆适配器（#EJ24）是一款半高、半长、低轮廓的 PCIe Gen\
  \ 4 x16 适配器。适配器提供两个端口用于连接 CXP 16x AOC 对。一个适配器支持连接到 EMX0 PCIe Gen3 I/O 扩展抽屉中的一个 PCIe\
  \ Gen 3 6 槽扇出模块。\n\n尽管这些电缆不可冗余，但一条电缆丢失会使 I/O 带宽降低 50%（即，可用于 I/O 模块的通道数）。\n\n每个系统节点最多允许八个\
  \ PCIe Gen 4 电缆适配器（#EJ24）连接到最多八个 PCIe Gen 3 6 槽扇出模块（#EMXH）。每个扇出模块必须配有一对 CXP 16x\
  \ AOC 电缆，两端口均布线到来自系统节点的同一 PCIe Gen 4 电缆适配器。\n\n电缆适配器可放置在系统节点的任意插槽中。建议在系统节点中按以下适配器放置顺序进行：\n\
  \n```\nSystem node slot 1, 7, 3, 6, 2, 8, 4, 5\n```\n\n支持的适配器最大数量为每个系统节点 8 个，每个系统最多\
  \ 32 个，系统有四个节点。\n\n每当使用 PCIe Gen3 I/O 扩展抽屉（#EMX0）时，建议为系统节点中的 PCIe Gen 4 电缆适配器（#EJ24）适配器预留插槽。将高轮廓适配器放置在\
  \ I/O 扩展抽屉内。\n\n有三种不同类型的 CXP 16x AOC 电缆对可用于 PCIe Gen 4 电缆适配器（#EJ24）与 I/O 扩展抽屉的 PCIe\
  \ Gen 3 扇出模块（#EMXH）之间的连接：\n\n- 2.0M（#ECCR）\n  当 I/O 抽屉与 E1080 服务器在 *同一* 机架中时使用此电缆。\n\
  - 10.0M（#ECCY）\n  当 I/O 抽屉与 E1080 服务器在 *不同* 机架中时使用此电缆。\n- 20.0M（#ECCZ）\n  与 10.0M（#ECCY）电缆类似，这些电缆用于\
  \ I/O 抽屉与 E1080 服务器在不同机架中的情况。\n\n> **注意：** 一个 #ECCR、一个 #ECCY 或一个 #ECCZ 包含两根 AOC\
  \ 电缆。\n\n#### 2.7.2 PCIe Gen3 I/O 扩展抽屉\n\nPCIe Gen3 I/O 扩展抽屉（#EMX0）是一款 4U 高、基于 PCIe\
  \ Gen3 且可机架安装的 I/O 抽屉。它提供两个 PCIe 扇出模块（#EMXH），每个模块提供六个 PCIe Gen3 全高、全长插槽（两个 x16 和四个\
  \ x8）。\n\nPower E870、Power E870C、Power E880 和 Power E880C 系统使用的旧扇出模块（#EMXF 和 #EMXG）不能订购且与\
  \ Power system E1080 不兼容。\n\n有关抽屉尺寸的更多信息，请参见第 1.6 节，“I/O 抽屉”，第 26 页。\n\nPCIe Gen\
  \ 4 电缆适配器（#EJ24）CXP 16X AOC 将系统节点连接到 I/O 扩展抽屉中的 PCIe 扇出模块。\n\n通过使用 HMC 引导菜单或操作系统支持实用程序进行并发维修以及\
  \ PCIe 适配器的添加或移除。\n\n盲插盒式磁带机（BSC）用于容纳安装到这些插槽中的全高适配器。BSC 与上一代服务器的 #5802、#5803、#5877\
  \ 和 #5873 12X 附加 I/O 抽屉所使用的 BSC 相同。\n\n功耗最高为每个适配器插槽 50W。\n\n\n\n\n\nFigure 2-25\
  \ shows the rear view of the PCIe Gen3 I/O Expansion Drawer.\n\n![](img/7c8373945565ba432037f60bbf8458eb_113_0.png)\n\
  \nFigure 2-25 Rear view of the PCIe Gen3 I/O Expansion Drawer\n\n#### 2.7.3 PCIe\
  \ Gen3 I/O Expansion Drawer optical cabling\n\nI/O drawers are connected to the\
  \ adapters in the system node by any of the following data transfer cables:\n\n\
  - 2.0 m CXP 16x Active Optical Cable (AOC) Pair (#ECCR)\n- 10.0 m CXP 16x Active\
  \ Optical Cable (AOC) Pair (#ECCY)\n- 20.0 m CXP 16x Active Optical Cable (AOC)\
  \ Pair (#ECCZ)\n\n> **Cable lengths:** Use the 2.0 m cables for intra-rack installations.\
  \ Use the 10.0 m or 20.0 m cables for inter-rack installations.\n\nOlder cables\
  \ #ECC6, #ECC8, and #ECC9 that are used in Power System E980 are not supported or\
  \ orderable on Power System E1080. They are supported only as model conversions\
  \ and announced as RPO.\n\nA minimum of one PCIe Gen 4 Optical Cable Adapter for\
  \ PCIe Gen 3 Expansion Drawer (#EJ24) is required to connect to the PCIe Gen 3 6-slot\
  \ Fanout Module in the I/O expansion drawer. The top port of the Fanout Module must\
  \ be cabled to the top port of the #EJ24 port. Also, the bottom two ports must be\
  \ cabled together.\n\nTo perform the cabling correctly, complete the following steps:\n\
  \n- 1. Connect an AOC to connector T0 on the PCIe Gen 4 cable adapter (#EJ24) in\
  \ your server.\n- 2. Connect the other end of the optical cable to connector T1\
  \ on one of the PCIe Gen 3 6-slot Fanout Modules in your I/O expansion drawer.\n\
  - 3. Connect another AOC cable to connector T1 on the PCIe Gen 4 cable adapter (#EJ24).\n\
  - 4. Connect the other end of the cable to connector T2 on the same PCIe Gen 3 6-slot\
  \ Fanout Module in I/O expansion drawer.\n- 5. Repeat the steps 1 to 4 for the other\
  \ PCIe Gen 3 6-slot Fanout Module in the I/O expansion drawer, if required.\n\n\
  **Drawer connections:** Each Fanout Module in a PCIe Gen 3 Expansion Drawer (#EMX0)\
  \ can be connected to only a single PCIe Gen 4 Cable Adapter (#EJ24). However, the\
  \ two Fanout Modules in a single I/O expansion drawer can be connected to different\
  \ system nodes in the same server.\n\nFigure 2-26 shows the connector locations\
  \ of the PCIe Gen3 I/O Expansion Drawer.\n\n![](img/7c8373945565ba432037f60bbf8458eb_114_0.png)\n\
  \nFigure 2-26 Connector locations for the PCIe Gen3 I/O Expansion Drawer\n\nTable\
  \ 2-25 lists the PCIe slots in the PCIe Gen3 I/O Expansion Drawer.\n\nTable 2-25\
  \ PCIe slot locations and descriptions for the PCIe Gen3 I/O Expansion Drawer\n\n\
  | Slot | Location code | Description |\n|---|---|---|\n| Slot 1 | P1-C1 | PCIe Gen\
  \ 3, x16 |\n| Slot 2 | P1-C2 | PCIe Gen 3, x8 |\n| Slot 3 | P1-C3 | PCIe Gen 3,\
  \ x8 |\n| Slot 4 | P1-C4 | PCIe Gen 3, x16 |\n| Slot 5 | P1-C5 | PCIe Gen 3, x8\
  \ |\n| Slot 6 | P1-C6 | PCIe Gen 3, x8 |\n| Slot 7 | P2-C1 | PCIe Gen 3, x16 |\n\
  | Slot 8 | P2-C2 | PCIe Gen 3, x8 |\n| Slot 9 | P2-C3 | PCIe Gen 3, x8 |\n| Slot\
  \ 10 | P2-C4 | PCIe Gen 3, x16 |\n| Slot 11 | P2-C5 | PCIe Gen 3, x8 |\n| Slot 12\
  \ | P2-C6 | PCIe Gen 3, x8 |\n\nConsider the following points:\n\n- All slots support\
  \ full-length, regular-height adapters or short (low-profile) adapters with a regular-height\

  \ 2.4.4 按需容量升级\n\nPower E1080 服务器包括多个活动处理器核心和内存单元。它还可能包括非活动处理器核心和内存单元。\n\n活动处理器核心或内存单元是在服务器从制造商处交付时可供您服务器使用的处理器核心或内存单元。非活动核心或单元是随服务器一起提供但在您激活它们之前不可使用的处理器核心或内存单元。\n\
  \n非活动处理器核心和内存单元可以通过购买名为 CUoD 的激活功能并在服务器的 HMC 上输入提供的激活代码来永久激活。\n\n使用 CUoD 服务，您可以购买更多静态处理器或内存容量并在不重新启动服务器或中断业务的情况下动态激活它们。所有静态处理器或内存激活都仅限于单个服务器。\n\
  \nCUoD 具有多种优势，可实现更灵活的环境。一个优势是减少系统初始投资。使用其他技术进行的传统项目意味着系统必须配备支持整个项目生命周期的所有资源。因此，您在项目后期阶段甚至可能永远不需要的容量上提前支付，这会影响软件许可成本和软件维护。\n\
  \n通过使用 CUoD，公司从具有足够已安装资源以支持整个项目生命周期的系统开始，但仅使用初始项目阶段所需的活动资源。随着项目的进行，可以通过按需激活资源来添加资源。因此，公司可以减少硬件的初始投资，并在每个项目阶段需要时才获取软件许可证，从而降低解决方案的总拥有成本（TCO）和总采购成本（TCA）。\n\
  \n\n\n\n\nFigure 2-15 shows a comparison between two scenarios: a fully activated\
  \ system versus a system with CUoD resources being activated along the project timeline.\n\
  \n![](img/7c8373945565ba432037f60bbf8458eb_93_0.png)\n\nFigure 2-15 Active cores\
  \ scenarios comparison during a project lifecycle\n\n### 2.4.5 Elastic Capacity\
  \ on-Demand (Temporary)\n\nWith the Elastic CoD offering, you can temporarily activate\
  \ and deactivate processor cores and memory units to help meet the demands of business\
  \ peaks, such as seasonal activity, period-end, or special promotions. When you\
  \ order an Elastic CoD feature, you receive an enablement code that allows a system\
  \ user to make requests for more processor and memory capacity in increments of\
  \ one processor day or 1 GB memory day. The system monitors the amount and duration\
  \ of the activations. With Power E1080 server, only the prepaid Elastic Capacity\
  \ on-Demand option is available with feature code 4586-COD in econfig or directly\
  \ from ESS.\n\nProcessors and memory can be activated and turned off an unlimited\
  \ number of times when more resources are needed.\n\nThis offering provides a system\
  \ administrator an interface at the HMC to manage the activation and deactivation\
  \ of resources. Before temporary capacity is used on your server, you must enable\
  \ your server. To enable your server, an enablement feature (MES only) must be ordered\
  \ and the required contracts must be in place. The 90-day enablement feature is\
  \ not available for the Power E1080 processors.\n\nFor more information about enablement\
  \ and usage of Elastic CoD, see Power Systems Capacity on Demand.\n\n### 2.4.6 IBM\
  \ Power Enterprise Pools 1.0 and Mobile Capacity on-Demand\n\nAlthough static activations\
  \ are valid for a single system, some customers might benefit from moving processor\
  \ and memory activations to different servers because of workload rebalance or disaster\
  \ recovery.\n\nIBM Power Enterprise Pools 1.0 is a technology for dynamically sharing\
  \ processor and memory activations among a group (or pool) of IBM Power Systems\
  \ servers. By using Mobile Capacity on-Demand (CoD) activation codes, the systems\
  \ administrator can perform tasks without contacting IBM.\n\nWith this capability,\
  \ you can move resources between Power E1080 and Power E980 systems and have unsurpassed\
  \ flexibility for workload balancing and system maintenance.\n\nNote: Only two consecutive\
  \ generation of Power servers are supported in the same Power Enterprise Pools 1.0;\
  \ therefore, Power E1080 can be mixed with Power E980 servers only.\n\nThe supported\
  \ Power Enterprise Pool 1.0 members are listed by pool type in Table 2-9.\n\nTable\
  \ 2-9 Supported Power Enterprise Pool 1.0 members by pool type\n\n| Power Enterprise\
  \ Pool type | Pool members |\n|---|---|\n| Midrange Power Enterprise Pool 1.0 |\
  \ 770+, E870, E870C, E880C |\n| High-end Power Enterprise Pool 1.0 | 780+, 795,\
  \ E880, E870C, E880C |\n| Power Enterprise Pool 1.0 | E870, E880, E870C, E880C,\
  \ E980 |\n| Power Enterprise Pool 1.0 (with Power E1080) | E980, E1080 |\n\nA pool\
  \ can support systems with different clock speeds or processor generations.\n\n\
  Mobile Capacity on Demand (Mobile CoD) features the following basic rules:\n\n-\
  \ The Power E1080 server requires a minimum of 16 static processor activations.\n\
  - The Power E980 server requires a minimum of eight static processor activations.\n\
  - For all systems, 50% of the installed memory must have activations, and a minimum\
  \ of 25% of those must be static activations.\n\nAn HMC can manage multiple IBM\
  \ Power Enterprise Pools and systems that are not part of an IBM Power Enterprise\
  \ Pool. Systems can belong to only one IBM Power Enterprise Pool at a time. Powering\
  \ down an HMC does not limit the assigned resources of participating systems in\
  \ a pool, but does limit the ability to perform pool change operations.\n\nAfter\
  \ an IBM Power Enterprise Pool is created, the HMC can be used to perform the following\
  \ tasks:\n\n- Mobile CoD processor and memory resources can be assigned to systems\
  \ with inactive resources. Mobile CoD resources remain on the system to which they\
  \ are assigned until they are removed from the system.\n- New systems can be added\
  \ to the pool and existing systems can be removed from the pool.\n- New Mobile CoD\
  \ processor and memory resources can be added to the pool.\n- Pool information can\
  \ be viewed, including pool resource assignments, compliance, and history logs.\n\
  \nFor the mobile activation features to be configured, an IBM Power Enterprise Pool\
  \ and the systems that are going to be included as members of the pool must be registered\
  \ with IBM. Also, the systems must have #EB35 for mobile enablement configured,\
  \ and the required contracts must be in place.\n\n> **Note:** The following convention\
  \ is used in the Order type column in the tables in this section:\n> - Initial:\
  \ Only available when ordered as part of a new system\n> - MES: Only available as\
  \ a Miscellaneous Equipment Specification (MES) upgrade\n> - Both: Available with\
  \ a new system or as part of an upgrade\n> - Supported: Unavailable as a new purchase,\
  \ but supported when migrated from another system or as part of a model conversion\n\
  \nTable 2-10 lists the mobile processor and memory activation features that are\

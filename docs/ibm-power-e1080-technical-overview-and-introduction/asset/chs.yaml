  \ 10、12 或 15 核心处理器选项。\n\n![](img/7c8373945565ba432037f60bbf8458eb_65_0.png)\n\n\
  图 2-2 Power10 处理器芯片（Die 照片由 Samsung Foundry 提供）\n\n重要 Power10 处理器特性列于 2-1。\n\n##\

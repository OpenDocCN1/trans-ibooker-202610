  \n### 2.1.2 Power10 处理器核心\n\nPower10 处理器核心继承了 POWER9 处理器核心的模块化架构，但重新设计并增强的微架构显著提升了处理器核心性能和处理效率。通过新的执行能力和优化的缓存带宽特性，峰值计算吞吐量得到明显改善。额外的矩阵数学加速引擎可为机器学习带来显著的性能提升，尤其适用于\
  \ AI 推理工作负载。\n\nPower E1080 服务器使用 Power10 企业级处理器变体，其中每个核心可运行多达八个基本独立的硬件线程。如果所有线程都处于活动状态，则操作模式称为\
  \ 8 路同时多线程（SMT8）模式。具有 SMT8 能力的 Power10 核心称为 Power10 SMT8 核心或简称为 SMT8 核心。Power10\
  \ 核心还支持四个活动线程（SMT4）模式；即两个活动线程（SMT2）和一个单活动线程（ST）。\n\nSMT8 核心包含两个执行资源域。每个域提供功能单元以服务多达四个硬件线程。\n\
  \n图 2-5 显示了所有 8 个线程处于活动状态的 SMT8 核心的功能单元。两个执行资源域用两种不同深浅的蓝色背景突出显示。\n\n![](img/7c8373945565ba432037f60bbf8458eb_68_0.png)\n\
  \n图 2-5 Power10 SMT8 核心\n\n两个执行资源域中的每一个都支持一到四个线程，并包括 4 个 128 位宽度的向量标量单元（VSU）、两个矩阵乘法辅助（MMA）加速器，以及一个四精度浮点（QP）和十进制浮点（DF）单元。\n\
  \n一个 VSU 及其直接关联的逻辑称为执行切片。两个相邻切片也可以用作组合的执行资源，然后命名为超切片。在 SMT8 模式下，八个 SMT 线程被细分为成对的形式，共同运行在两个相邻切片上，如不同深浅的绿色背景所示。\n\
  \n在 SMT4 或更低线程模式下，一个到两个线程各自共享一个四切片资源域。图 2-5 还指出了 SMT 线程之间共享的其他关键资源，例如指令缓存、指令缓冲和\
  \ L1 数据缓存。\n\nSMT8 核心支持自动工作负载平衡以改变操作 SMT 线程级别。根据工作负载特征，运行在单个芯片上的线程数量可以从四个减少到两个，甚至进一步减少到仅一个活动线程。如果运行在核心执行资源上的线程更少，单个线程在性能方面可以受益。\n\
  \n微架构性能和效率优化导致与之前的 POWER9 核心实现相比，每瓦性能显著提升。整体能效提高了约 2.6 倍，这体现了 Power10 所体现的处理器设计进步。\n\
  \nPower10 处理器核心包括以下影响性能的关键特性和改进：\n\n- 增强的加载和存储带宽\n- 更深更宽的指令窗口\n- 增强的数据预取\n- 分支执行和预测增强\n\
  - 指令融合\n\n计算资源、工作集大小和数据访问延迟方面的改进将在下文描述。与 POWER9 处理器核心实现的变更在括号中给出。\n\n#### 增强的计算资源\n\
  \n以下为主要的计算资源增强：\n\n- 八个向量标量单元（VSU）执行切片，每个切片支持 64 位标量或 128 位单指令多数据（SIMD）+100% 用于置换、定点、浮点和加密（高级加密标准（AES）/SHA）+400%\
  \ 操作。\n- 四个用于矩阵数学辅助（MMA）加速的单元，每个单元每周期可产生 512 位结果（新增），+400% 单精度和双精度 FLOPS 并支持降精度\
  \ AI 加速）。\n- 两个用于四精度浮点和十进制浮点操作的单元 新增指令类型\n\n#### 更大的工作集\n\n以下为工作集大小的主要变更：\n\n- L1\
  \ 指令缓存：2 x 48 KB 6 路（总计 96 KB）。（+50%）\n- L2 缓存：2 MB 8 路。（+400%）\n- L2 转换后援缓冲器（TLB）：2\
  \ x 4K 条目（总计 8K）。（+400%）\n\n#### 数据访问延迟降低\n\n以下主要变更可降低加载数据的延迟：\n\n- L1 数据缓存访问在标称四周期内完成，存储转发零惩罚。（-\
  \ 2 周期）用于存储转发\n- L2 数据访问在标称 13.5 周期内完成。（-2 周期）\n- L3 数据访问在标称 27.5 周期内完成。（-8 周期）\n\
  - 转换后援缓冲器（TLB）访问在标称 8.5 周期内完成，用于有效地址到实地址转换（ERAT）未命中，包括嵌套转换。（-7 周期）\n\n补充物理和逻辑设计技术的微架构创新，并专门针对能效，包括以下示例：\n\
  \n- 改进的时钟门控\n- 提高分支预测准确率从而降低刷新率\n- 融合和聚集操作合并\n- 减少端口数量并减少对选定结构的访问\n- 有效地址（EA）标记的\
  \ L1 数据和指令缓存仅在缓存未命中时才产生 ERAT 访问\n\n除了性能和能效的显著提升外，安全性也是一个重要的架构关注领域。Power10 处理器核心支持以下安全特性：\n\
  \n- 增强的硬件支持，在缓解基于推测的攻击的同时提供更好的性能\n- 动态执行控制寄存器（DEXCR）支持\n- 返回定向编程（ROP）保护\n\n### 2.1.3\
  \ 同时多线程\n\nPower10 处理器的每个核心都支持多个硬件线程，表示独立的执行上下文。如果仅使用一个硬件线程，处理器核心以单线程（ST）模式运行。\n\
  \n如果多于一个硬件线程处于活动状态，处理器以同时多线程（SMT）模式运行。除了 ST 模式外，Power10 处理器还支持以下不同的 SMT 模式：\n\n\
  - SMT2：两个硬件线程活动\n- SMT4：四个硬件线程活动\n- SMT8：八个硬件线程活动\n\nSMT 使单个物理处理器核心能够同时从多个硬件线程上下文调度指令。计算工作负载可以以更高的并行度使用处理器核心的执行单元。这种能力显著增强了多线程应用程序的吞吐量和可扩展性，并优化了单线程工作负载的计算密度。\n\
  \nSMT 主要在商业环境中受益，在这些环境中，单个事务的速度不如执行的总事务数重要。SMT 通常会提高大多数工作负载的吞吐量，尤其是那些具有大或频繁变化工作集的工作负载，例如数据库服务器和\
  \ Web 服务器。\n\n\n\n\n\n表 2-2 列出了自 POWER4 以来 IBM Power Architecture® 的每个实现所支持的 SMT\
  \ 功能的历史记录。\n\n表 2-2 Power 处理器支持的 SMT 级别\n\n| Technology | Cores/system | Supported\
  \ hardware threading modes | Maximum hardware threads per partition |\n|---|---|---|---|\n\
  | IBM POWER4 | 32 | ST | 32 |\n| IBM POWER5 | 64 | ST, SMT2 | 128 |\n| IBM POWER6\
  \ | 64 | ST, SMT2 | 128 |\n| IBM POWER7 | 256 | ST, SMT2, SMT4 | 1024 |\n| IBM POWER8\
  \ | 192 | ST, SMT2, SMT4, SMT8 | 1536 |\n| IBM POWER9 | 192 | ST, SMT2, SMT4, SMT8\
  \ | 1536 |\n| IBM Power10 | 240 | ST, SMT2, SMT4, SMT8 | 1920ᵃ |\n\na. PHYP 支持最大\
  \ 240 x SMT8 = 1920。AIX 从 AIX v7.3 + Power10 开始支持单分区最多 1920 个（240xSMT8）总线程。\n\n\
  ### 2.1.4 矩阵乘法辅助 AI 工作负载加速\n\n矩阵乘法辅助（MMA）功能由 Power 指令集架构（ISA）v3.1 引入。相关指令在小矩阵上实现数值线性代数运算，旨在加速计算密集型内核，例如矩阵乘法、卷积和离散傅里叶变换。\n\
  \n为了高效加速 MMA 操作，Power10 处理器核心实现了密集数学引擎（DME）微架构，有效为认知计算、机器学习和 AI 推理工作负载提供加速器。\n\n\
  DME 封装了计算高效的流水线、物理寄存器文件以及将累加器数据保持在计算单元本地的相关数据流。每个 MMA 流水线执行外积矩阵运算，从 512 位累加器寄存器读取并写回。\n\
  \nPower10 在不增加体系结构状态的情况下实现了 MMA 累加器架构。每个体系结构 512 位累加器寄存器由四个 128 位向量标量扩展（VSX）寄存器支持。\n\
  \n使用 MMA 指令的代码包含在 OpenBLAS 和 Eigen 库中。该库可使用最新版本的 GNU Compiler Collection（GCC）编译器构建。OpenBLAS\
  \ 的最新版本可在该网页上获得。\n\nOpenBLAS 被 Python-NumPy 库、PyTorch 和其他框架使用，这使得 Power10 MMA 加速器在\
  \ AI 工作负载中的性能优势易于使用。\n\n有关 Power10 处理器高吞吐量数学引擎实现的更多信息，请参阅白皮书 A matrix math facility\
  \ for Power ISA processors。\n\n有关基本 MMA 架构原理、详细的指令集使用、寄存器文件管理概念以及各种支持设施的更多信息，请参阅\
  \ Matrix-Multiply Assist Best Practices Guide, REDP-5612。\n\n### 2.1.5 Power10 兼容模式\n\
  \nPower10 核心实现了处理器兼容性寄存器（PCR），如 Power 指令集架构（ISA）版本 3.1 中所述，主要用于促进与 IBM Power 硬件前几代之间的实时分区迁移（LPM）。\n\
  \n根据 PCR 的具体设置，Power10 核心以与 POWER9（Power ISA 版本 3.0）或 POWER8（Power ISA 版本 2.07）处理器相关的兼容模式运行。对处理器兼容模式的支持还使\
  \ AIX、IBM i、Linux 或 Virtual I/O 服务器环境的旧操作系统版本能够在基于 Power10 处理器的系统上运行。\n\nPower E1080\
  \ 服务器的 Power10 处理器支持以下兼容模式：\n\n- POWER8：由固件级别 FW810 启用\n- POWER9 Base：由固件级别 FW910\
  \ 启用\n- POWER9：由固件级别 FW940 启用\n- Power10：由固件级别 FW1010 启用\n\n### 2.1.6 处理器功能代码\n\n\
  Power E1080 服务器中的每个系统节点提供四个插槽以容纳 Power10 单芯片模块（SCM）。提供三种不同核心密度为 10、12 和 15 核的 SCM\
  \ 类型。系统节点的处理器配置由三个可用的处理器功能之一决定。每个功能代表一组四个核心密度相同的 Power10 SCM。Power E1080 服务器中的所有系统节点必须配置相同的处理器功能。\n\
  \n表 2-3 列出了可用于 Power E1080 服务器的处理器功能代码。Power10 处理器会根据工作负载要求、热条件和功耗特性自动优化其核心频率。每个列出的处理器功能代码都与\
  \ SCM 核心通常运行的处理器核心频率范围相关联。此外，还指出了相关 SCM 类型的最大频率。\n\n表 2-3 Power E1080 处理器功能\n\n\
  | Feature code | Description |\n|---|---|\n| EDP2 | 40-core (4x10) Typical 3.65\
  \ to 3.90 GHz (max) Power10 Processor with 5U system node drawer |\n| EDP3 | 48-core\
  \ (4x12) Typical 3.60 to 4.15 GHz (max) Power10 Processor with 5U system node drawer\
  \ |\n| EDP4 | 60-core (4x15) Typical 3.55 to 4.00 GHz (max) Power10 Processor with\
  \ 5U system node drawer |\n\n### 2.1.7 片上 L3 缓存和智能缓存\n\nPower10 处理器包含一个大型的片上 L3\
  \ 缓存，最大可达 120 MB，采用非统一缓存访问（NUCA）架构，提供在 L3 缓存区域集合中分配和共享缓存占用空间的机制。每个处理器核心可以访问关联的本地\
  \ 8MB L3 缓存。它还可以访问芯片上其他 L3 缓存区域以及系统中的数据。\n\n每个 L3 区域充当其关联 L2 缓存的牺牲缓存，并且还可以为片上缓存占用空间提供聚合存储。\n\
  \n智能 L3 缓存管理使 Power10 处理器能够优化对 L3 缓存行的访问并最小化缓存延迟。L3 包含具有数据类型和重用感知的替换算法。它还支持来自核心的一系列预取请求，包括指令和数据，并与核心、内存控制器和\
  \ SMP 互连结构协同工作以管理预取流量，从而优化系统吞吐量和数据延迟。\n\nL3 缓存支持以下关键特性：\n\n- 增强的带宽，支持每个 SMT8 核心每个处理器周期高达\
  \ 64 字节。\n- 增强的数据预取，由 96 个 L3 预取请求机启用，为每个 SMT8 核心服务对内存的预取请求。\n- 内存控制器的加一预取，以增强有效的预取深度和速率。\n\
  - Power10 软件预取模式，支持将数据块提取到 L3 缓存中。\n- 具有降低延迟的数据访问。\n\n### 2.1.8 开放内存接口\n\nPower10\
  \ 处理器引入了新的创新开放内存接口（OMI）。OMI 由 8 个片上内存控制器单元（MCU）驱动，并在 Power10 芯片的相对外边缘的两个独立物理构建块中实现。每个区域支持\
  \ 64 个 OMI 通道，分成四个端口。每个端口又由两个每个 8 个通道的链路组成，以 32 Gbps 速度以延迟优化的方式运行，具有前所未有的带宽和扩展性。\n\
  \nOMI 接口的聚合最大理论全双工带宽达到 2 x 512 GBps = 1 TBps 每 Power10 单芯片模块（SCM）。\n\nOMI 物理接口使处理器能够以低延迟、高带宽、技术无关的主机内存语义进行操作，并允许连接已建立和新兴的内存元件。Power\
  \ E1080 服务器。OMI 最初支持每个 OMI 链路一个主层、低延迟、企业级双倍数据速率 4（DDR4）差分 DIMM（DDIMM）。此配置产生每个 SCM\
  \ 总共 16 个 DDIMM 和每个 Power E1080 服务器节点 64 个 DDIMM。内存带宽取决于为特定 Power E1080 服务器配置的 DDIMM\
  \ 密度。\n\n如果使用运行在 3200 MHz 的 32 GB 或 64 GB DDIMM，则最大理论双工内存带宽为每个 SCM 409 GBps。如果使用运行在\
  \ 2933 MHz 的 128 GB 或 256 GB DDIMM，则每个 SCM 的最大内存带宽略微降低至 375 GBps。\n\n\n\n\n\nIn\
  \ summary, the Power10 SCM supports 128 OMI lanes with the following characteristics:\n\
  \n- 32 Gbps signaling rate\n- Eight lanes per OMI link\n- Two OMI links per OMI\
  \ port (2 x 8 lanes)\n- Eight OMI ports per single chip module (16 x 8 lanes)\n\n\
  ### 2.1.9 Pervasive memory encryption\n\nThe Power10 MCU provides the system memory\
  \ interface between the on-chip symmetric multiprocessing (SMP) interconnect fabric\
  \ and the OMI links. This design qualifies the MCU as ideal functional unit to implement\
  \ memory encryption logic. The Power10 on-chip MCU encrypts and decrypts all traffic\
  \ to and from system memory that is based on the AES technology.\n\nThe Power10\
  \ processor supports the following modes of operation:\n\n- AES XTS mode\n\nXTS\
  \ is an abbreviation for the xor–encrypt–xor based tweaked-codebook mode with ciphertext\
  \ stealing. AES XTS provides a block cipher with strong encryption, which is particularly\
  \ useful to encrypt persistent memory.\n\nPersistent DIMM technology retains the\
  \ data that is stored inside the memory DIMMs, even if the power is turned off.\
  \ A malicious attacker who gains physical access to the DIMMs can steal memory cards.\
  \ The data that is stored in the DIMMs can leave the data center in the clear if\
  \ not encrypted.\n\nAlso, memory cards that leave the data center for repair or\
  \ replacement can be a potential security breach. Because the attacker might have\
  \ arbitrary access to the persistent DIMM data. the stronger encryption of the AES\
  \ XTS mode is required for persistent memory. The AES XTS mode of the Power10 processor\
  \ is supported for future use if persistent memory solutions become available for\
  \ IBM Power servers.\n\n- AES CTR mode\n\nCTR stands for Counter mode of operation\
  \ and designates a low-latency AES block cipher. Although the level of encrypting\
  \ is not as strong as with the XTS mode, the low-latency characteristics make it\
  \ the preferred mode for memory encryption of volatile memory. AES CTR makes it\
  \ more difficult to physically gain access to data through the memory card interfaces.\
  \ The goal is to protect against physical attacks, which becomes increasingly important\
  \ in the context of cloud deployments.\n\nThe Power E1080 servers support the AES\
  \ CTR mode for pervasive memory encryption. Each Power10 processor holds a 128-bit\
  \ encryption key that is used by the processor’s MCU to encrypt the data of the\
  \ differential DIMMs that are attached to the OMI links.\n\nThe MCU crypto engine\
  \ is transparently integrated into the data path, which ensures that the data fetch\
  \ and store bandwidth are not compromised by the AES CTR encryption mode. Because\
  \ the encryption has no noticeable performance effect and because of the obvious\
  \ security benefit, the pervasive memory encryption is enabled by default and cannot\
  \ be switched off through any administrative interface.\n\n> Note: The pervasive\
  \ memory encryption of the Power10 processor does not affect the encryption status\
  \ of a system dump content. All data that is coming from the DDIMMs is decrypted\
  \ by the memory controller unit before it is passed onto the dump devices under\
  \ the control of the dump program code. This statement applies to the traditional\
  \ system dump under the operating system control and the firmware assist dump utility.\n\
  \n**Note:** The PowerVM Live Partition Mobility (LPM) data encryption does not interfere\
  \ with the pervasive memory encryption. Data transfer during a LPM operation uses\
  \ the following general flow:\n\n1. On the source server, the Mover Server Partition\
  \ (MSP) provides the hypervisor with a buffer.\n2. The hypervisor of the source\
  \ system copies the partition memory into the buffer.\n3. The MSP transmits the\
  \ data over the network.\n4. The data is received by the MSP on the target server\
  \ and copied in to the related buffer.\n5. The hypervisor of the target system copies\
  \ the data from the buffer into the memory space of the target partition.\n\nTo\
  \ facilitate LPM data compression and encryption, the hypervisor on the source system\
  \ presents the LPM buffer to the on-chip nest accelerator (NX) unit as part of process\
  \ in Step 2. The reverse decryption and decompress operation is applied on the target\
  \ server as part of process in Step 4.\n\nThe pervasive memory encryption logic\
  \ of the MCU decrypts the memory data before it is compressed and encrypted by the\
  \ NX unit on the source server. It also encrypts the data before it is written to\
  \ memory but after it is decrypted and decompressed by the NX unit of the target\
  \ server.\n\n### 2.1.10 Nest accelerator\n\nThe Power10 processor has an on-chip\
  \ accelerator called nest accelerator unit or NX unit. The coprocessor features\
  \ that are available on the Power10 processor are similar to the features on the\
  \ POWER9 processor. These coprocessors provide specialized functions, such as the\
  \ following examples:\n\n- IBM proprietary data compression and decompression\n\
  - Industry standard gzip compression and decompression\n- AES and Secure Hash Algorithm\
  \ (SHA) cryptography\n- Random number generation\n\nFigure 2-6 on page 63 shows\
  \ a block diagram of the NX unit.\n\n![](img/7c8373945565ba432037f60bbf8458eb_76_0.png)\n\
  \nFigure 2-6 Block diagram of the NX unit\n\nEach one of the AES/SHA engines, data\
  \ compression, and Gzip units consist of a coprocessor type and the NX unit features\
  \ three coprocessor types. The NX unit also includes more support hardware to support\
  \ coprocessor invocation by user code, use of effective addresses, high-bandwidth\
  \ storage accesses, and interrupt notification of job completion.\n\nThe direct\
  \ memory access (DMA) controller of the NX unit helps to start the coprocessors\
  \ and move data on behalf of coprocessors. SMP interconnect unit (SIU) provides\
  \ the interface between the Power10 SMP interconnect and the DMA controller.\n\n\
  The NX coprocessors can be started transparently through library or operating system\
  \ kernel calls to speed up operations that are related to data compression, live\
  \ partition mobility migration, IPSec, JFS2 encrypted file systems, PKCS11 encryption,\
  \ random number generation, and the most recently announced logical volume encryption.\n\
  \nIn effect, this on-chip NX unit on Power10 systems implements a high throughput\
  \ engine that can perform the equivalent work of multiple cores. The system performance\
  \ can benefit by off-loading these expensive operations to on-chip accelerators,\
  \ which in turn can greatly reduce the CPU usage and improve the performance of\
  \ applications.\n\nThe accelerators are shared among the logical partitions (LPARs)\
  \ under the control of the PowerVM hypervisor and accessed by way of hypervisor\
  \ call. The operating system, along with the PowerVM hypervisor, provides a send\
  \ address space that is unique per process requesting the coprocessor access. This\
  \ configuration allows the user process to directly post entries to the first in\
  \ - first out (FIFO) queues that are associated with the NX accelerators. Each NX\
  \ coprocessor type has a unique receive address space corresponding to a unique\
  \ FIFO for each of the accelerators.\n\nFor more information about the use of the\
  \ xgzip tool that uses the gzip accelerator engine, see the following resources:\n\
  \n- IBM support article *Using the POWER9 NX (gzip) accelerator in AIX*\n- IBM Power\
  \ Systems community article *Power9 GZIP Data Acceleration with IBM AIX*\n- AIX\
  \ community article *Performance improvement in openssh with on-chip data compression\
  \ accelerator in power9*\n- IBM Documentation: *nxstat Command*\n\n### 2.1.11 SMP\
  \ interconnect and accelerator interface\n\nThe Power10 processor provides a highly-optimized,\
  \ 32 Gbps differential signaling technology interface that is structured in 16 entities.\
  \ Each entity consists of eight data lanes and one spare lane. This interface can\
  \ facilitate the following functional purposes:\n\n- First- or second-tier, symmetric\
  \ multiprocessing link interface, enabling up to 16 Power10 processors to be combined\
  \ into a large, robustly scalable, single-system image.\n- Open Coherent Accelerator\
  \ Processor Interface (OpenCAPI), to attach cache coherent and I/O-coherent computational\
  \ accelerators, load/store addressable host memory devices, low latency network\
  \ controllers, and intelligent storage controllers.\n- Host-to-host integrated memory\
  \ clustering interconnect, enabling multiple Power10 systems to directly use memory\
  \ throughout the cluster.\n\n> Note: The OpenCAPI interface and the memory clustering\
  \ interconnect are Power10 technology option for future use.\n\nBecause of the versatile\
  \ nature of signaling technology, the 32 Gbps interface is also referred to as Power/A-bus/X-bus/OpenCAPI/Networking\
  \ (*PowerAXON*) interface. The IBM proprietary X-bus links connect two processors\
  \ on a board with a common reference clock. The IBM proprietary A-bus links connect\
  \ two processors in different drawers on different reference clocks by using a cable.\n\
  \nOpenCAPI is an open interface architecture that allows any microprocessor to attach\
  \ to the following items:\n\n- Coherent user-level accelerators and I/O devices\n\
  - Advanced memories accessible through read/write or user-level DMA semantics\n\n\
  The OpenCAPI technology is developed, enabled, and standardized by the OpenCAPI\
  \ Consortium. For more information about the consortium’s mission and the OpenCAPI\
  \ protocol specification, see OpenCAPI Consortium.\n\nThe PowerAXON interface is\
  \ implemented on dedicated areas that are at each corner of the Power10 processor\
  \ die. The Power E1080 server makes use of this interface to implement single-drawer\
  \ chip-to-chip and drawer-to-drawer chip interconnects.\n\nThe Power E1080 single-drawer\
  \ chip-to-chip SMP interconnect features the following properties:\n\n- Three (2\
  \ x 9)-bit on planar buses per Power10 single chip module (SCM)\n- Eight data lanes,\
  \ plus one spare lane in each direction per chip-to-chip connection\n- 32 Gbps signaling\
  \ rate providing 128 GBps per chip-to-chip SMP connection bandwidth, an increase\
  \ of 33% compared to the Power E980 single-drawer implementation\n\n\n\n\n\n- 4\
  \ 路 SMP 架构实现采用每抽屉四个 Power10 SCM 的 1 跳拓扑构建\n\nPower E1080 抽屉到抽屉 SMP 互连具有以下特性：\n\n\
  - 每个 Power10 SCM 三个 (2 x 9)-位总线\n- 每个芯片到芯片连接每个方向八个数据通道加一个备用通道\n- 抽屉中的四个 SCM 中的每一个都直接连接到多节点系统中的每个其他抽屉中相同位置的\
  \ SCM\n- 32 Gbps 信号速率，提供每个芯片到芯片节点间 SMP 连接 128 GBps 带宽\n- 2 跳拓扑中的 8 插槽、12 插槽和 16\
  \ 插槽 SMP 配置选项\n\n图 2-7 显示了全配置 4 节点 16 插槽 Power E1080 系统的 SMP 连接。蓝色线代表系统节点内芯片到芯片连接。绿色线代表抽屉到抽屉\
  \ SMP 连接。\n\n![](img/7c8373945565ba432037f60bbf8458eb_78_0.png)\n\n图 2-7 4 节点 16\
  \ 插槽 Power E1080 系统中的 SMP 互连\n\n从图 2-7 所示的图中可以很容易推断出，每个插槽直接连接到系统节点内的任何其他插槽，并且只需一个中间插槽即可从一个芯片到达另一个\
  \ CEC 抽屉中的任何其他芯片。\n\n### 2.1.12 电源和性能管理\n\n基于 Power10 处理器的服务器实现了增强版的电源管理 EnergyScale\
  \ 技术。与之前的 POWER9 EnergyScale 实现一样，Power10 EnergyScale 技术支持动态处理器频率变化，该变化取决于多个因素，例如工作负载特征、活动核心数量和环境条件。\n\
  \n基于过去几年积累的丰富经验，Power10 EnergyScale 技术演进为使用以下有效且简化的操作模式集合：\n\n- 节电模式\n- 静态模式（标称频率）\n\
  - 最大性能模式（MPM）\n\nPOWER9 动态性能模式（DPM）与 POWER9 最大性能模式（MPM）具有许多共同特性。由于这种特性的冗余性，Power10\
  \ 处理器系统的 DPM 被移除，转而采用增强的 MPM。例如，最大频率现在可以在 Power10 增强最大性能模式下实现（无论活动核心数量如何），而在基于 POWER9\
  \ 处理器的服务器上并非总是如此。\n\n基于 Power10 处理器的 Power E1080 系统默认启用 MPM。该模式动态调整处理器频率以最大化性能并实现更高的处理器频率范围。每个节电模式在满足标称运行环境限制时都能提供一致的系统性能而无任何变化。\n\
  \n对于受 PowerVM Hypervisor 控制的基于 Power10 处理器的系统，MPM 是系统范围的配置设置，但每个处理器模块频率单独优化。\n\n\
  以下因素决定处理器模块可运行的最大频率：\n\n- 处理器利用率：负载越轻，频率越高。\n- 活动核心数量：活动核心越少，频率越高。\n- 环境条件：在较低环境温度下，核心可运行在更高频率。\n\
  \n以下 Power10 EnergyScale 模式可用：\n\n- 节电模式\n  频率设置为最低频率以降低能耗。启用此功能可通过将处理器时钟频率和电压降低到固定值来减少功耗。此配置在提供可预测性能的同时降低了系统的功耗。\n\
  - 静态模式\n  频率设置为可在所有正常工作负载和所有正常环境条件下维持的固定点。该频率也称为标称频率。\n- 最大性能模式\n  工作负载以尽可能高的频率运行，具体取决于工作负载、活动核心数量和环境条件。在所有正常工作负载和所有正常环境条件下，频率不会低于静态频率。\n\
  \n在 MPM 中，工作负载以尽可能高的频率运行。更高的功耗使处理器模块能够在 MPM 典型频率范围（MTFR）内运行，其下限远高于标称频率，上限由系统的最大频率给出。\n\
  \n如果特定 Power10 系统默认以 MPM 运行，则 MTFR 会作为系统规格的一部分发布。更高的功耗可能会增加相应系统节点的风扇转速以满足更高的散热需求，进而导致噪音排放水平增加高达\
  \ 15 分贝。\n\n处理器频率通常保持在 MTFR 设定的限制范围内，但在高于 27 °C（80.6 °F）的高环境温度下，可降低至 MTFR 下限与标称频率之间的频率。如果数据中心环境温度低于\
  \ 27 °C，则 MPM 中的频率始终处于 MTFR 的上部范围（比标称频率高约 10% - 20%）。在较低环境温度（低于 27 °C，或 80.6 °F）下，MPM\
  \ 模式还提供确定性性能。随着环境温度升高超过 27 °C，确定性已无法保证。此模式是 Power E1080 的默认模式。\n\n- 空闲节电模式（IPS）\n\
  \nIPS 模式在整个系统（所有插槽的所有核心）空闲时将频率降低到最低。它可以独立于所有其他模式启用或禁用。Power E1080 不支持此模式。\n\n图 2-8\
  \ 显示了 Power10 节电模式、静态或标称模式和最大性能模式的比较频率范围。不同工作负载特征、环境条件和空闲状态的频率调整也已标出。\n\n![](img/7c8373945565ba432037f60bbf8458eb_80_0.png)\n\

  \n7063-CR2 与平板控制台套件 7316-TF3、TF4 和 TF5 兼容。\n\n> 注意：7316-TF3 和 TF4 已停止销售。\n\n####\
  \ 1.8.2 虚拟 HMC\n\n最初，HMC 仅作为预装 HMC 固件的硬件设备出售。然而，IBM 扩展了此产品以允许购买硬件设备和可在 ppc64le 架构上部署并可在\
  \ x86 平台上部署的虚拟设备。\n\n任何具有有效合同的客户都可以从 ESS 站点下载它，或可在初始 Power E1080 订单中包含。\n\n虚拟 HMC\
  \ 支持以下 hypervisor：\n\n- 在基于 x86 处理器的服务器上：\n  - KVM\n  - Xen\n  - VMware\n- 在基于 Power\
  \ 处理器的服务器上：PowerVM\n\n安装虚拟 HMC 必须满足以下最低要求：\n\n- 16 GB 内存\n- 4 个虚拟处理器\n- 2 个网络接口（最多允许\
  \ 4 个）\n- 1 个磁盘驱动器（500 GB 可用磁盘驱动器）\n\n对于使用 IBM 配置器（e-config）的初始 Power E1080 订单，可通过选择添加软件\
  \ → 其他系统产品（作为产品选择）找到 HMC 虚拟设备，然后：\n\n- 5765-VHP 用于 IBM HMC 虚拟设备 Power V10\n- 5765-VHX\
  \ 用于 IBM HMC 虚拟设备 x86 V10\n\n有关虚拟 HMC 概述的更多信息，请参阅此网页。\n\n有关如何安装虚拟 HMC 设备和所有要求的更多信息，请参阅\
  \ IBM 文档。\n\n#### 1.8.3 7063-CR2 的基板管理控制器网络连接规则\n\n7063-CR2 HMC 具有基板管理控制器（BMC），这是一个专门的服务处理器，通过使用传感器监控系统的物理状态。7063-CR2\
  \ 上使用的 OpenBMC 提供了一个图形用户界面（GUI），可以从具有与 BMC 网络连接的工作站访问。此连接需要配置一个以太网端口供 BMC 使用。\n\n\
  7063-CR2 提供两个网络接口（eth0 和 eth1）用于在设备上配置 BMC 的网络连接。\n\n每个接口映射到系统上的不同物理端口。不同的管理工具以不同方式命名接口。HMC\
  \ 任务 控制台管理 → 控制台设置 → 更改 BMC/IPMI 网络设置 仅修改专用接口。\n\nBMC 端口列出见表 1-24。\n\n# 表 1-24 BMC\

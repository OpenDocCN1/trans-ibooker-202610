  \ | AIX 和 Linux |\n\n### 1.6.4 IBM System Storage\n\nIBM System Storage 磁盘系统产品和方案为从入门级到高端存储系统的所有业务级别提供具有卓越价值的引人注目的存储解决方案。\n\
  \nIBM Storage 通过使用底层软件基础来简化数据基础设施，从而加强并简化混合云环境中的存储，该环境采用简化的容器化、管理和数据保护方法。有关各种方案的更多信息，请参阅此网页。\n\
  \n以下部分重点介绍了一些方案。\n\n## IBM FlashSystem Family\n\nIBM FlashSystem® 系列是一系列云启用存储系统组合，旨在易于部署并快速扩展，以帮助优化存储配置、简化问题解决并降低存储成本。\n\
  \nIBM FlashSystem 采用 IBM Spectrum® Virtualize 软件构建，有助于部署复杂的混合云存储解决方案，加速基础设施现代化，应对安全需求，并通过利用人工智能的力量最大化价值。这些产品旨在提供企业级功能，同时不影响经济性或性能。它们还提供端到端\
  \ NVMe 的优势、IBM FlashCore® 技术的创新以及 SCM 超低延迟。有关更多信息，请参阅此网页。\n\n## IBM System Storage\
  \ DS8000\n\nIBM DS8900F 是下一代企业数据系统，采用最先进的 Power 处理器技术构建，具有超低应用响应时间。\n\nDS8900F 专为数据密集型和任务关键型工作负载而设计，通过超低延迟、优于七个\
  \ 9（99.99999）的可用性、透明云、层级化和针对恶意软件和勒索软件的先进数据保护，在混合云解决方案中增加了下一级性能、数据保护、弹性和可用性。此企业级存储解决方案提供卓越的性能和更高的容量，从而能够将所有任务关键型工作负载集中到一个位置。\n\
  \nIBM DS8900F 可提供 100% 的数据在静态、传输中和云中的加密。此灵活的存储支持 IBM Power、IBM Z® 和 IBM LinuxONE。有关更多信息，请参阅此网页。\n\
  \n## IBM SAN Volume Controller\n\nIBM SAN Volume Controller 是一款企业级系统，可将来自 500 多个\
  \ IBM 和第三方存储系统的存储进行整合，以提高效率、简化管理和运营、通过新功能实现存储现代化，并为无论存储系统类型如何的混合云提供通用方法。\n\nIBM\
  \ SAN Volume Controller 提供完整的数据弹性功能，具有高可用性、业务连续性和数据安全功能。存储支持采用 AI 驱动的 IBM Easy Tier®\
  \ 的自动化分层，可帮助以更低的成本提高性能。有关更多信息，请参阅此网页。\n\n\n\n\n### 1.7 系统机架\n\nPower E1080 服务器符合标准\
  \ 19 英寸机架。服务器已在 IBM 企业级机架（7965-S42、7014-T42、7014-T00 或 7965-94Y）中获得认证并经过测试。客户如果确信这些机架具有所需的强度、刚度、深度和孔距特征，可以选择将服务器放置在其他机架中。请联系\
  \ IBM 支持部门以确定其他机架是否适用。\n\n> **订购信息：** 强烈建议您订购 Power E1080 服务器时搭配 IBM 42U 企业级机架 7965-S42\

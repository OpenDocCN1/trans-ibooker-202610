  \ Utility Capacity on-Demand\n\nUtility CoD is *not* supported on Power E1080 server.\n\
  \n### 2.4.8 Trial Capacity on-Demand\n\nA *standard request* for Trial CoD requires\
  \ you to complete a form that includes contact information and vital product data\
  \ (VPD) from your Power E1080 server with inactive CoD resources.\n\nA standard\
  \ request activates eight processors or 64 GB of memory for 30 days. Subsequent\
  \ standard requests can be made after each purchase of a permanent processor activation.\
  \ An HMC is required to manage Trial CoD activations.\n\nAn *exception request*\
  \ for Trial CoD requires you to complete a form that includes contact information\
  \ and VPD from your Power E1080 server with inactive CoD resources. An exception\
  \ request activates all inactive processors or all inactive memory (or all inactive\
  \ processor and memory) for 30 days. An exception request can be made only once\
  \ over the life of the machine. An HMC is required to manage Trial CoD activations.\n\
  \nTo request either a Standard or an Exception Trial, see Power Systems Capacity\
  \ on Demand: Trial Capacity on Demand.\n\n### 2.4.9 Software licensing and CoD\n\
  \nFor software licensing considerations for the various CoD offerings, see the most\
  \ recent revision of the Power Systems Capacity on Demand User’s Guide.\n\n### 2.5\
  \ Internal I/O subsystem\n\nThis section provides more information about the internal\
  \ PCIe architecture of the Power E1080 system.\n\n#### 2.5.1 Internal PCIe Gen 5\
  \ subsystem and slot properties\n\nThe internal I/O subsystem on the Power E1080\
  \ server is connected to the PCIe Gen 5 controllers on a Power10 chip in the system.\
  \ Each Power10 processor module has two PCIe host bridges (PHBs). The PHBs (PHB0\
  \ and PHB1) have 16 PCIe lanes each.\n\nThe PHBs provide different type of end point\
  \ connections. Both the PHBs from Power10 sockets P0 and P1 and one PHB from sockets\
  \ P2 and P3 connect directly to a PCIe Gen 4 x16 or PCIe Gen 5 x8 slot to provide\
  \ six PCIe Gen 4 x16 or PCIe Gen 5 x8 slots per system node.\n\nThe second PHB on\
  \ each Power10 socket P2 and P3 is split between a PCIe Gen 5 x8 slot and two Internal\
  \ Non-Volatile Memory Express (NVMe) SSD PCIe Gen 4 x4 slots. The design overall\
  \ provides each system node of Power E1080 with:\n\n- Six PCIe Gen 4 x16 or PCIe\
  \ Gen 5 x8\n- Two PCIe Gen 5 x8\n- Four Internal Non-Volatile Memory Express (NVMe)\
  \ SSDs, each using a PCIe Gen 4 x4 connection\n\nBandwidths for the connections\
  \ are listed in Table 2-11.\n\nTable 2-11 Internal I/O connection speeds\n\n| Connection\
  \ | Type | Speed (duplex) |\n|---|---|---|\n| PCIe adapter slot | PCIe Gen4 x16\
  \ | 64 GBps |\n| PCIe adapter slot | PCIe Gen5 x8 | 64 GBps |\n| NVMe slot | PCIe\
  \ Gen4 x4 | 16 GBps |\n\nThe following theoretical maximum I/O bandwidths in each\
  \ system node are available:\n\n- Six PCIe Gen 4 x16 / PCIe Gen 5 x8 slots at 64\
  \ GBps = 384 GBps\n- Two PCIe Gen 5 x8 Slots at 64 GBps = 128 GBps\n- Four NVMe\
  \ slots at 16 GBps = 64 GBps\n\nTotal of 576 GBps = 384 GBps + 128 GBps + 64 GBps.\n\

  \ I/O 子系统架构的更多信息，请参阅第 83 页的 2.5，“内部 I/O 子系统”。\n\n\n\n\n### 1.6 I/O 抽屉\n\n如果需要超出系统节点插槽的更多\
  \ PCIe 插槽，Power E1080 服务器支持添加 I/O 扩展抽屉。\n\n初始可用时，每个系统节点支持零个、一个、两个、三个或四个 PCIe Gen\
  \ 3 I/O 扩展抽屉。要连接一个 I/O 扩展抽屉，使用一个 PCIe 插槽将 6 槽扩展模块连接到 I/O 抽屉中。PCIe Gen 3 I/O 扩展抽屉（#EMX0）容纳两个扩展模块，这两个扩展模块可连接到同一系统节点中的任意两个\
  \ PCIe 插槽或不同系统节点中的 PCIe 插槽。\n\n对于 SAS 磁盘的连接，提供了一个仅磁盘 I/O 抽屉。EXP24SX 是唯一受支持的磁盘抽屉。\n\
  \n#### 1.6.1 PCIe Gen 3 I/O 扩展抽屉\n\n19 英寸 4 EIA（4U）PCIe Gen 3 I/O 扩展抽屉（#EMX0）和两个\
  \ PCIe 分线模块（#EMXH）提供 12 个 PCIe I/O 全长、全高插槽。一个分线模块提供标有 C1 - C6 的六个 PCIe 插槽。C1 和 C4\
  \ 为 x16 插槽，C2、C3、C5 和 C6 为 x8 插槽。支持 PCIe Gen1、Gen2 和 Gen 3 全高适配器。\n\n盲插盒式磁带机（BSC）用于容纳安装在这些插槽中的全高适配器。BSC\
  \ 与上一代服务器的 12X 附加 I/O 抽屉（#5802、#5803、#5877 和 #5873）使用的 BSC 相同。抽屉随附一套完整的 BSC，即使 BSC\
  \ 为空。\n\n通过 HMC 引导菜单或操作系统支持实用程序进行并发维修以及添加或移除 PCIe 适配器。\n\nPCIe CXP 转换适配器和有源光缆（AOC）将系统节点连接到\
  \ I/O 扩展抽屉中的 PCIe 分线模块。每个 PCIe Gen 3 I/O 扩展抽屉有两个电源。\n\n抽屉可以稍后添加到服务器，但添加 PCIe Gen\
  \ 3 光缆适配器或 PCIe Gen 3 I/O 抽屉（#EMX0）或分线模块时必须安排系统停机。\n\n图 1-8 显示了 PCIe Gen 3 I/O 扩展抽屉。\n\

    Next, let''s tackle the event feed.


    # 2.2.6 Implementing a basic event feed


    The shopping cart microservice can now store shopping carts and add items to them.
    The items include product information from the product catalog microservice. The
    shopping cart also has an API for other microservices that allows them to add
    or delete items from shopping carts and read the contents of a shopping cart.


    The piece missing is the event feed. The shopping cart needs to publish events
    about changes to shopping carts, and other microservices can subscribe to these
    events and react to them as required. In the case of items being added to a shopping
    cart, figure 2.9 (repeated from Chapter 1) illustrates how the recommendations
    microservice and the shopper tracking microservice base part of their functionality
    on events from the shopping cart microservice.


    ![](img/608267d7803dc57a1a896ad121f37868_69_0.png)


    Figure 2.9 The shopping cart microservice publishes events about changes to shopping
    carts to an event feed. The recommendations and shopper tracking microservices
    subscribe to these events and react as events arrive.


    In this section, you''ll implement the `EventFeed` and shopping cart domain model
    components highlighted in figure 2.10. (Chapter 5 returns to the implementation
    of event feeds and event subscribers.) The domain model is responsible for raising
    events, and `EventFeed` allows other microservices to read the events that the
    shopping cart microservice has published.'

    apiVersion: apps/v1\nmetadata:\n  name: special-offers\nspec:\n  replicas: 1\n\
    \  selector:\n    matchLabels:\n      app: special-offers-pod\n  template:\n \
    \   metadata:\n      labels:\n        app: special-offers-pod\n    spec:\n   \
    \   containers:\n```\n```\n\n![](img/608267d7803dc57a1a896ad121f37868_261_0.png)"

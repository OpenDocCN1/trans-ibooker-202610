  md: "```\npublic record SpecialOfferEvent(\n    long SequenceNumber,\n    DateTimeOffset\
    \ OccuredAt,\n    string Name,\n    object Content);\n```\n\nThis concludes your\
    \ implementation of the C# part of event subscriptions. The other part—the Kubernetes\
    \ CronJob—is implemented in the next section.\n\n# 5.2.6 Deploying to Kubernetes\n\
    \nIn this section, we will deploy the loyalty program and special offers microservices\
    \ to Kubernetes. To that end there are three steps we need to perform:\n\n+  \
    \ - We will build Docker containers for both microservices. The container for\
    \ special offers is similar to what we saw in chapter 3. The container for the\
    \ loyalty program has a twist: based on an environment variable it can act either\
    \ as an HTTP API exposing the POST, PUT, and GET endpoints we implemented earlier,\
    \ or it can act as the event consumer we implemented in the previous section.\
    \ This is explained in detail next.\n+   - We will deploy the special offers microservice\
    \ similarly to how we deployed to Kubernetes in chapter 3.\n+   - We will deploy\
    \ the loyalty program, which will consist of deploying the loyalty program container\
    \ in two copies of different configurations: one running as the API and one running\
    \ as the event consumer.\n\nNOTE You can find the code for the special offers\
    \ microservice in the code download. Here I only show the deployment bits for\
    \ the special offers microservice.\n\nWith those three steps done we will have\
    \ three parts running in Kubernetes:\n\n+   - A pod for the special offers microservice\n\
    +   - A pod for the API part of the loyalty program microservice\n+   - A CronJob\
    \ for the event consumer part of the loyalty program\n\nWe will also have two\
    \ deployments in Kubernetes, one for the special offers microservice and one for\
    \ the loyalty program microservice. Since we consider the loyalty program API\
    \ and the loyalty program event consumer as parts of the same loyalty program\
    \ microservice, we will always deploy these two together, and by the same token,\
    \ we will put them into the same Kubernetes manifest file. At runtime they run\
    \ independently, though, which allows us to, for instance, scale up the API part\
    \ to deal with the higher load while still only running one event consumer.\n\n\
    # 5.2.7 Building a Docker container special offers microservice\n\nBefore we can\
    \ deploy the special offers microservice to Kubernetes, we need to build a Docker\
    \ container for it. To do that, we use the following Dockerfile, which is similar\
    \ to the Dockerfile for the shopping cart we saw in chapter 2."

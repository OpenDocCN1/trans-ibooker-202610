- pgno: 145
  md: "```\n```\nFROM mcr.microsoft.com/dotnet/aspnet:5.0 AS final\nWORKDIR /app\n\
    EXPOSE 80\nCOPY --from=publish /api/publish ./api\nCOPY --from=publish /consumer/publish\
    \ ./consumer\nENTRYPOINT dotnet $STARTUPDLL\n```\n```\n\n![](img/608267d7803dc57a1a896ad121f37868_145_0.png)\n\
    \nThis Dockerfile is a little different from what we have seen before. The Dockerfiles\
    \ we have seen before have built and published one ASP.NET application. This one\
    \ builds and publishes an ASP.NET application—the loyalty program—and a .NET console\
    \ application—the event consumer. The image built with this Dockerfile will therefore\
    \ have both the LoyaltyProgram.dll and the EventConsumer.dll in it. The last line\
    \ of the Dockerfile, ENTRYPOINT dotnet $STARTUPDLL, says that when the images\
    \ built with this Dockerfile start up, they should run dotnet on whatever the\
    \ environment variable $STARTUPDLL points to. So if $STARTUPDLL is equal to the\
    \ path to the LoyaltyProgram.dll, the image will run the loyalty program API,\
    \ and if '$STARTUPDLL' is equal to the path to the EventConsumer.dll, the image\
    \ will run the loyalty program event consumer.\n\nLet’s see this Dockerfile in\
    \ action. First we build a loyalty program Docker image:\n\n```\n```\n> docker\
    \ build . -t loyalty-program\n```\n```\n\nNow we run the loyalty program image\
    \ as either the API part or the event consumer part. Let’s first try to run it\
    \ as the API by passing in the path to the LoyaltyProgram.dll in the $STARTUPDLL:\n\
    \n```\n```\n> docker run --rm -p 5001:80 -e STARTUPDLL=\"api/LoyaltyProgram.dll\"\
    \n  loyalty-program\n```\n```\n\nThat command also maps port 5001 on your localhost\
    \ to port 80 in the container. The loyalty program API is now running, and you\
    \ can call it on localhost port 5001. Let’s run the same Docker image again, but\
    \ start it up as the Event Consumer:\n\n```\n```\n> docker run --rm -e STARTUPDLL=\"\
    consumer/EventConsumer.dll\" loyalty-program\n```\n```\n\nThis will run the event\
    \ consumer, but it will fail to fetch events from the special offers event feed,\
    \ because we do not have one running. We fix that by running the special offers\
    \ microservice in a container and putting that on the same Docker network as the\
    \ event consumer. To do that, we create a new Docker network called “microservices”:\n\
    \n```\n```\n> docker network create --driver=bridge microservices\n```\n```\n\n\
    The containers we add to the microservices network can communicate using the container\
    \ and host names. We will take advantage of that when we run the special offers\
    \ microservice by adding it to the microservices network and giving it the name\
    \ special-offers. To do just that, run this command:\n\n```\n```\n> docker run\
    \ --rm -p 5002:80 --network=microservices --name=special-offers\n  special-offers\n\
    ```\n```"

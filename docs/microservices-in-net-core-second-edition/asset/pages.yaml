- pgno: 310
  md: "![](img/608267d7803dc57a1a896ad121f37868_310_0.png)\n\nFigure 12.11 Now that\
    \ you’ve built the first part of the application, it can show a list of products\
    \ and an empty shopping cart.\n\nYou have the complete application GUI but no\
    \ functionality. The BUY! buttons don’t work, nor do the Xs in the shopping cart.\
    \ You’ll change this in the next two sections, where you’ll add some behavior\
    \ to the application.\n\n# 12.3.4 Letting users add products to the shopping cart\n\
    \nThe first piece of behavior you’ll add will make the BUY! button in the product\
    \ list work. You’ll do two things:\n\n+   1. Add an endpoint to ProductListController\
    \ that allows the application to add a product to the shopping cart. This endpoint\
    \ in the API Gateway is thin and delegates to the shopping cart microservice.\n\
    +   2. Add an OnClick function to the BUY! button that calls the new endpoint\
    \ in ProductListController.\n\nThe following listing shows the endpoint in GatewayModule\
    \ that lets the application add a product to the shopping cart.\n\n# Listing 12.14\
    \ Endpoint to add a product to the shopping cart\n\n```\n[HttpPost(\"/shoppingcart/{userId}\"\
    )]\npublic async Task<OkResult> AddToCart(\n    int userId,\n    [FromBody] int\
    \ productId)\n{\n    var response =\n        await this.shoppingCartClient.PostAsJsonAsync(\n\
    \            $\"/shoppingcart/{userId}/items\",\n            new[] { productId\
    \ });\n    response.EnsureSuccessStatusCode();\n    return Ok();\n}\n\nNew endpoint\n\
    Reads a product ID from the body of the request\nUses HttpClient to call shopping\
    \ cart\n```"

- pgno: 251
  md: '# Securing microservice-to-microservice communication


    # This chapter covers


    +   - Where to perform user authentication and authorization in a microservice
    system

    +   - Deciding on the level of trust in your microservice system

    +   - Limiting microservice-to-microservice requests

    +   - Using an API Gateway to authenticate users

    +   - Using Kubernetes network policies to limit microservice-to-microservice
    requests


    Up to this point in the book, we’ve ignored security; but for most systems, security
    is an important concern that needs careful attention. This chapter discusses how
    to address security concerns in a microservice system. In a monolith, the monolith
    completes user authentication and authorization—there is, after all, only the
    monolith to do those things. In a microservice system, several microservices are
    involved in answering most user requests; the question is this: which ones are
    responsible for authentication, and which ones are responsible for authorization?
    You must also ask how much the microservices can trust each other:'
  merge: -1
  img_proc: true
- pgno: 252
  md: '+   - If one microservice authenticates a user, can other microservices trust
    that user?

    +   - Are all microservices allowed to call each other?


    The answers vary from system to system. The first part of this chapter discusses
    how to address these questions. The second part of the chapter outlines an implementation
    of one possible answer to the first question and shows a full implementation of
    an answer to the second question.


    # 10.1 Microservice security concerns


    Security is an important concern for almost any server-side system. It’s also
    a very broad topic, much of which is outside the scope of this book. We’ll concentrate
    on two areas of security that are relevant to developers of microservice systems:


    +   1. Authentication and authorization

    +   2. How to limit communication between microservices


    Most systems have some functionality that’s only accessible to logged-in users.
    Think about the point-of-sale system discussed in earlier chapters. In chapters
    4 and 5, we talked about adding a loyalty program that allows registered users
    to receive special offers via email, based on their interests. If users are interested
    in golf, they’ll be notified about good deals on golf balls. If users want to
    edit their interests—they may have given up golf and taken up quilting, instead—they
    need to be logged in. Otherwise, one user could edit another user’s interests,
    resulting in their being notified about the wrong offers. Making sure a user really
    is who they claim to be is a matter of authentication. Deciding what the user
    is allowed to do—for instance, that they can edit their own interests but not
    anyone else’s—is a matter of authorization.


    Authentication and authorization are concerns that your systems will probably
    have regardless of whether you build them with microservices. The difference is
    that the granular nature of a microservice system begs the question: which microservices
    handle authentication and authorization? The following two sections address that
    question.


    # Data in motion vs. data at rest


    Systems handle data. That data is most often essential to the systems, but it’s
    also often essential to users. The data may be sensitive, such as users’ home
    addresses, credit card numbers, or medical records. Even if the data isn’t sensitive,
    it can still be valuable to the system—the product catalog of an e-commerce site
    isn’t sensitive, but it’s worth a lot to the business behind the site. The data
    your systems handle is important and needs to be handled safely. Broadly speaking,
    we can place data handling in one of two categories:


    +   - Data in motion—When data is moved from one part of a system to another,
    it’s said to be in motion. For instance, when collaborating microservices exchange
    data via commands, queries, or events, the data they exchange is in motion.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '* *Data at rest*—When data is stored for later use, it’s said to be at rest.
    For instance, when the microservice that owns a piece of data stores it in its
    database, that piece of data is at rest.


    It’s important that data be kept safe in both situations. This chapter concentrates
    on data in motion, because this is where a microservice system differs from systems
    with other architectures. The techniques for securing data at rest are the same
    in a microservice system as in a monolithic or traditional SOA system.


    # **10.1.1 Authenticating users at the edge**


    Authentication is about verifying that users are who they claim to be. In the
    context of a microservice system, that means verifying that requests are made
    on behalf of the users they appear to be from. Let’s look at the example in figure
    10.1, which shows part of the point-of-sale system from chapters 4 and 5—the part
    centered around the loyalty program microservice.


    ![](img/608267d7803dc57a1a896ad121f37868_253_0.png)


    Figure 10.1 The loyalty program microservice in the point-of-sale system


    If you add to the loyalty program a web frontend where registered users can edit
    their interests—for example, remove their interest in golf and add quilting instead—you
    get something like figure 10.2. You want users to be allowed to edit only their
    own interests, not the interests of others. Therefore, you require users to be
    logged in to be able to edit interests. In figure 10.2, you must authenticate
    the request to update user settings. The obvious place to perform the authentication
    is in the API Gateway microservice, which is the microservice that receives the
    request to update the user settings from the client. That request is made on behalf
    of a user, and you must verify'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'that clients are allowed to make requests on behalf of users. You do so by
    making sure the user is logged in.


    Figure 10.3 adds a login microservice to the system. The new microservice is responsible
    for handling the login process, but the API Gateway is still responsible for making
    sure only requests from logged-in users are accepted. Users are redirected to
    log in if they aren’t already logged in. The login decides how the user can log
    in and leads the user through the process. Users can log in various ways, including
    the following:


    +   - With a simple username and password

    +   - With multifactor authentication

    +   - Via an external system, such as active directory

    +   - Via social identity providers like Facebook, Twitter, Google, and so on


    ![](img/608267d7803dc57a1a896ad121f37868_254_0.png)


    ![](img/608267d7803dc57a1a896ad121f37868_254_1.png)


    Whatever the login mechanism, the login microservice handles the login and gives
    the API Gateway proof of the user’s identity in the form of an access token the
    API Gateway can verify. This can, for instance, be achieved with the OpenID Connect
    protocol.


    Notice that user authentication is at the edge of the system—that is, it’s done
    by the microservice that receives the request from the client. This is the general
    pattern; user authentication is done at the edge of the system.'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'The API Gateway microservice and the login microservice are examples of services
    that implement a technical capability. Furthermore, both are technical capabilities
    that are very similar across many different systems: in domain-driven design terms
    they are examples of generic subdomains—which means that they are prime candidates
    to be implemented by off-the-shelf products. The login microservice could be implemented
    by any identity provider, including products like Azure AD, AWS Cognito, Duende
    Identity Server, and Auth0. Likewise the API Gateway could be implemented by Azure
    API Management, AWS API Gateway, Traefik, and Istio.


    # 10.1.2 Authorizing users in microservices


    We’ve established that authentication is initiated at the edge of the system—by
    the API Gateway. When the request has been authenticated, you know who the user
    is, but you don’t know whether the user is allowed to make the request. That’s
    a question of authorization. The user is authorized to update only their own interests.
    If a client sends a request on behalf of user A that attempts to update the interests
    of user B, the system should reject the request.


    In a microservice system, the microservice at the edge—the one that initiates
    authentication—often isn’t the microservice that performs the action the request
    is about. Figure 10.4 shows the loyalty program again. The API Gateway microservice
    gets requests from the client, but the loyalty program microservice is responsible
    for keeping track of user interests. Therefore, the loyalty program updates users’
    interests.


    ![](img/608267d7803dc57a1a896ad121f37868_255_0.png)


    Figure 10.4 Authorization should be done as part of the business logic; the loyalty
    program microservice is responsible for authorizing updates to user settings.


    Remember from chapter 4 that microservices are primarily scoped to business capabilities—a
    business capability is handled by one microservice. That includes authorization,
    because authorization is part of the capability’s business rules. This is in line
    with letting the loyalty program microservice decide whether a user is allowed
    to update interests. For this to work, the user identity needs to be passed along
    from microservice to microservice. In the loyalty program, the API Gateway microservice
    must include the user identity in the requests it sends to the loyalty program.
    The user identity can be included in the request to the loyalty program in several
    ways, depending on the level of trust you want between the API Gateway and the
    other microservices. If trust is low, the user identity can be passed in the form
    of a signed identity token that the loyalty program can validate or—if trust is
    higher—the user identity can be passed in clear text in a custom HTTP header.
    In both cases, the API Gateway authenticates the user and the loyalty program
    authorizes the user based on the user identity.'
  merge: -1
  img_proc: true

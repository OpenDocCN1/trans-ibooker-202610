  md: '# 7.1.3 *Rolling forward vs. rolling backward*


    When errors happen in production, you''re faced with the question of how to fix
    them. In many traditional systems, if errors begin to occur shortly after deployment,
    the default response is to roll back to the previous version of the system. In
    a microservice system, the default can be different. As discussed in chapter 1,
    microservices lend themselves to continuous delivery. With continuous delivery,
    microservices are deployed frequently, and each deployment should be both fast
    and easy to perform. Furthermore, microservices are sufficiently small and simple
    that many bug fixes are also easy. This opens the possibility of *rolling forward*
    rather than *rolling backward*.


    Why would you want to default to rolling forward? In some situations, rolling
    backward is complicated—in particular when database changes are involved. When
    a new version that changes the database is deployed, the microservice begins to
    produce data that fits in the updated database. Once that data is in the database,
    it has to stay there, which may not be compatible with rolling backward to an
    earlier version. In such a case, rolling forward may be easier.


    # 7.1.4 *Don''t propagate failures*


    Sometimes, things happen around a microservice that may disturb its normal operation.
    We say that the microservice is *under stress* in such situations. There are many
    sources of stress, including the following:


    +   · One of the machines in the cluster on which the microservice''s data store
    runs has crashed.

    +   · The microservice has lost network connectivity to one of its collaborators.

    +   · The microservice is receiving unusually high amounts of traffic.

    +   · One of its collaborators is down.


    In all these situations, the microservice under stress can''t continue to operate
    the way it normally does. That doesn''t mean it''s down, but it must cope with
    the situation.


    When one microservice fails, its collaborators are put under stress. That means
    the collaborators are also at risk of failing. While the microservice is failing,
    its collaborators can''t query, send commands, or poll events from the failing
    microservice. As illustrated in figure 7.3, if the collaborators fail, even more
    microservices become at risk of failing: the failure begins to propagate through
    the system of microservices. Such a situation can quickly escalate from one microservice
    failing to many microservices failing.


    Here are some examples of how you can stop failures from propagating:


    +   · When one microservice tries to send a command to another microservice that
    happens to be failing at that time, the request will fail. If the sender fails
    too, you get the situation illustrated in figure 7.3, with failures propagating
    throughout the system. To stop the propagation, the sender can act as if the command
    succeeded but actually store the command in a list of failed commands. The sending
    microservice can periodically go through the list of failed commands'

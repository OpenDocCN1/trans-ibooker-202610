- pgno: 109
  md: 'Introducing a notifications-bounded context has the added benefit of clarifying
    that the three technical capabilities—sending emails, text messages, and push
    notifications—are contained in that bounded context and exist as microservices
    to serve that bounded context. As a consequence, microservices in other bounded
    contexts should not collaborate with the three supporting technical microservices;
    they should instead collaborate with the business-oriented notifications microservices.
    This helps keep the coupling between the bounded contexts low, since microservices
    in other bounded contexts do not know or care about the fact that there are three
    ways to send notifications. Thus, for instance, the email microservice is only
    used by the notification microservice and is not coupled to any other microservice.


    # 4.2.3 Identifying technical capabilities


    When you introduce supporting technical microservices, your goal is to simplify
    the microservices that implement business capabilities. Sometimes—such as with
    sending notifications—you identify a set of technical capabilities that several
    microservices need, and you turn that into a bounded context with microservices
    of its own, so other microservices can share the implementation. Other times—as
    with the ERP integration—you identify a technical capability that unduly complicates
    a microservice and turn that capability into a microservice of its own. In both
    cases, the other microservices implementing business capabilities are left with
    one less technical concern to take care of.


    When deciding to implement a technical capability in a separate microservice,
    be careful that you don’t violate the microservice characteristic of being individually
    deployable. It makes sense to implement a technical capability in a separate microservice
    only if that microservice can be deployed and redeployed independently of any
    other microservices. Likewise, deploying the microservices that are supported
    by the microservice providing the technical capability must not force you to redeploy
    the microservice implementing the technical capability.


    Identifying business capabilities and microservices based on business capabilities
    is a strategic exercise, but identifying technical supporting capabilities that
    could be implemented by separate microservices is an opportunistic exercise. The
    question of whether a supporting technical capability should be implemented in
    its own microservice is about what will be easiest in the long run. You should
    ask these questions:


    +   - If the supporting technical capability stays in a microservice scoped to
    a business capability, is there a risk that the microservice will no longer be
    replaceable with reasonable effort?

    +   - Is the supporting technical capability implemented in several microservices
    scoped to business capabilities?

    +   - Will a microservice implementing the supporting capability be individually
    deployable?

    +   - Will all microservices scoped to business capabilities still be individually
    deployable if the supporting technical capability is implemented in a separate
    microservice?'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# 4.3 **The tertiary driver for scoping microservices: Supporting efficiency
    of work**


    The third driver when we find the scope and boundaries of microservices is supporting
    efficiency of work. The microservices we design and create should be efficient
    to work with and should let teams that develop and maintain the microservices
    work efficiently. This, largely, is a matter of respecting and using Conway’s
    law, which you may recall from earlier:


    > Any organization that designs a system (defined broadly) will produce a design
    whose structure is a copy of the organization’s communication structure.


    If we have an already defined organization that we cannot change, the system of
    microservices we create must align with the organization. On the other hand, if
    the organization can be changed we should do so in accordance with the overall
    system of microservices.


    First and foremost, respecting Conway’s law means we should make sure that there
    is a clear ownership of each microservice: we should assign one team to the development
    and maintenance of each microservice. This is in line with the microservices characteristic
    that a small team can maintain a few handfuls of microservices. Each can be be
    assigned a few handfuls of services to be responsible for. It is important that
    the responsibility is clear. If the responsibility for a microservice is split
    between two or more teams, we introduce a need for those teams to coordinate closely
    whenever changes to that microservices need to happen. That coordination takes
    time and means that none of the teams involved can work autonomously. This is
    a form of inefficiency, and it is something we can avoid if we make sure each
    microservices is assigned to one team.


    Allowing teams to work autonomously plays into defining the scope and boundary
    of the microservices. First, the team must have the skills and knowledge necessary.
    For instance, a team that gets assigned the notifications microservice from earlier
    in this chapter must have the understanding of the business rules related to notifying
    users.


    Second, the teams must be able to work without too much and too detailed coordination
    with other teams. For example, when a team is assigned the notifications microservice,
    they will probably also be assigned the supporting technical microservices for
    sending SMS messages, emails, and push notifications because there is a certain
    level of coupling between those and the notifications microservices. Because of
    that coupling, assigning the supporting technical microservices to another team
    introduces a need for coordination and makes both teams less autonomous, so we
    will probably assign them all to the same team, which therefore takes responsibility
    for the whole notifications-bounded context. Once they take on the supporting
    technical microservices, the team on top of the knowledge about the business rules
    around notifications needs to have the skills necessary to create integrations
    to the SMS’s'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'gateway, the email system, and push notifications. We need to be aware of this,
    and if we cannot find or form a team with the necessary combination of knowledge
    and skills, we may have to change scopes of our microservices.


    ![](img/608267d7803dc57a1a896ad121f37868_111_0.png)


    To make sure we do not create inefficiencies for the teams developing the microservices,
    it pays to keep an eye on the dependency chains that exist. In figure 4.12 a dependency
    chain is depicted: the boxes are microservices and the arrows are dependencies.


    If each of the microservices in figure 4.12 are assigned to teams A, B, C, and
    D, as indicated inside the boxes, the team assigned to the microservice at top
    of the chain—team A—is in a very different situation than the team assigned to
    the microservice at the bottom of the chain—team D. This is because the dependencies
    between the microservices are mirrored by dependencies between the teams. Team
    A maintaining the microservices at the top can change anything it wants without
    ever thinking about breaking anything for other teams maintaining microservices
    further down the chain. Team D maintaining the microservice at the bottom, on
    the other hand, risks breaking all the other microservices in the dependency chain
    if they introduce a breaking change. At the same time, team A that is maintaining
    the microservice at the top may not be able to get much done without coordinating
    with the other teams in the dependency chain because it may depend on the other
    teams to implement stuff. In other words, we may be setting both team A and team
    B up for inefficiency if we create dependency chains that are too long. This is
    in part combatted by getting the scopes and boundaries for microservices right,
    and in part by designing the collaboration


    Figure 4.12 Dependencies between microservices are mirrored as dependencies between
    the teams maintaining the microservices. The arrows are dependencies and the boxes
    are microservices annotated with the teams maintaining them.


    between microservices in a way that favors low coupling. We will go in depth with
    designing the collaboration between microservices in chapter 5.


    NOTE In chapter 5, we will see how event-based collaboration can help break dependency
    chains.


    # 4.4 What to do when the correct scope isn’t clear


    At this point, you may be thinking that scoping microservices correctly is difficult:
    you need to get the business capabilities just right, which requires a deep understanding
    of the business domain; you also have to judge the complexity of supporting technical'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'capabilities correctly; and you need to make sure the teams can work efficiently.
    And you’re right: it is difficult, and you will find yourself in situations where
    the right scoping for your microservices isn’t clear. This lack of clarity can
    have several causes, including the following:


    +   - *Insufficient understanding of the business domain*—Analyzing a business
    domain and building up a deep knowledge of that domain is difficult and time-consuming.
    You’ll sometimes need to make decisions about the scope of microservices before
    you’ve been able to develop sufficient understanding of the business to be certain
    you’re making the correct decisions.

    +   - *Confusion in the business domain*—It’s not only the development side that
    can be unclear about the business domain. Sometimes the business side is also
    unclear about how the business domain should be approached. Maybe the business
    is moving into new markets and must learn a new domain along the way. Other times,
    the existing business market is changing because of what competitors are doing
    or what the business itself is doing. Either way, on both the business side and
    the development side, the business domain is ever changing, and your understanding
    of it is emergent.

    +   - *Incomplete knowledge of the details of a technical capability*—You may
    not have access to all the information about what it takes to implement a technical
    capability. For instance, you may need to integrate with a badly documented system,
    in which case you’ll only know how to implement the integration once you’re finished.

    +   - *Inability to estimate the complexity of a technical capability*—If you
    haven’t previously implemented a similar technical capability, it can be difficult
    to estimate how complex the implementation of that capability will be.


    None of these problems mean you’ve failed. They’re all situations that occur time
    and again. The trick is to know how to move forward despite the lack of clarity.
    In this section, I’ll discuss what to do when you’re in doubt.


    # 4.4.1 Starting a bit bigger


    When in doubt about the scope of a microservice, it’s best to err on the side
    of making the microservice’s scope bigger than it would be ideally. This may sound
    weird—I’ve talked a lot about creating small, narrowly focused microservices and
    about the benefits that come from keeping microservices small. And it’s true that
    significant benefits can be gained from keeping microservices small and narrowly
    focused. But you must also look at what happens if you err on the side of too
    narrow a scope.


    Consider the special offers microservice discussed earlier in this chapter. It
    implements the special offers business capability in a POS system and includes
    five different business processes, as illustrated in figure 4.3 and reproduced
    in the top part of figure 4.13. If you were uncertain about the boundaries of
    the special offers business capability and chose to err on the side of too small
    a scope, you might split the business capability, as shown in the bottom part
    of figure 4.13.'

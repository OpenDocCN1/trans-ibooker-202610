  md: '# Part 2


    # Building microservices


    In this part of the book, you’ll learn how to design and code a microservice.
    The assorted diverse topics all go into designing and coding good, maintainable,
    reliable microservices:


    +   - Chapter 4 explains how to slice and dice a system into a cohesive set of
    microservices. You will learn three rules of thumb that help you decide what belongs
    in each microservice.

    +   - Chapter 5 shows you how microservices can collaborate to provide functionality
    for end users. You’ll also be introduced to three categories of collaboration
    and when to use each of them.

    +   - Chapter 6 explores where the data goes in a microservice system and which
    microservices should take responsibility for which data.

    +   - Chapter 7 teaches you some simple techniques to make a microservice system
    more robust than it would be otherwise. Using these techniques, you can create
    a system that keeps running in the face of network failures and individual microservice
    crashes.

    +   - Chapter 8 turns to testing. You’ll learn how to create an effective automated
    test suite for a microservice system, all the way from broad system-level tests
    to narrowly focused unit tests.


    By the end of part 2, you’ll know how to design microservices, how to use .NET
    to code them, and Kubernetes to run them.'

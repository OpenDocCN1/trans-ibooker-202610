    \ in a Docker container.\n+   2 Write events to EventStoreDB via the EventStore\
    \ component.\n+   3 Read events from EventStoreDB via the EventStore component.\n\
    \n> **NOTE** You can learn much more about EventStoreDB than we will cover in\
    \ this chapter at https://eventstore.com/.\n\nYou can pull the EventStoreDB Docker\
    \ image down with this command:\n\n```\n```\ndocker pull eventstore/eventstore\n\

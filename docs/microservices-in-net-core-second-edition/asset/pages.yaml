- pgno: 218
  md: '# 8.4 Writing service-level tests


    Let’s move on to writing service-level tests for the entire loyalty program microservice.
    Service-level tests interact with a microservice from the outside and provide
    the microservice with mocked versions of its collaborators.


    The loyalty program makes requests to two collaborators: the event feed in the
    special offers microservice and the API of the notifications microservice. The
    service-level tests for the loyalty program go through these steps:


    +   1. Set up two endpoints in the same process as the test:

    +      - One that works as a mocked special-offer event feed

    +      - One that works as a mocked notification endpoint

    +   2. Start the loyalty program microservice and configure it to use the mocked
    endpoints in place of the real collaborators. This means whenever the loyalty
    program needs to call one of its collaborators, it will call one of the mocked
    endpoints.

    +   3. Execute a scenario against the loyalty program as a sequence of requests
    to the loyalty program endpoints.

    +   4. Record any calls to the mocked endpoints.

    +   5. Make assertions on the responses from the loyalty program and on the requests
    made to the mocked endpoints.


    Figure 8.5 shows the runtime setup for the service-level tests for the loyalty
    program microservice.


    ![](img/608267d7803dc57a1a896ad121f37868_218_0.png)


    Figure 8.5 A service-level test executes a scenario against the API of the microservice
    under test but configures the microservice to use mocked endpoints running in
    the same process as the test, in place of real collaborators. When a service-level
    test runs, it makes requests to the microservice under test, which makes real
    HTTP requests back to mocked endpoints as needed. The test can inspect the responses
    from the microservice under test as well as the calls it makes to the mocked endpoints.'

- pgno: 259
  md: "compare it with the user ID in JWT. The values—or claims—in the JWT are available\
    \ through the User property on the ControllerBase class, which the UsersController\
    \ inherits from. The User property is a ClaimsPrincipal object, which has a collection\
    \ of claims that contain all the claims from the JWT. Using this knowledge we\
    \ can make sure that users are only authorized to update their own information.\n\
    \n# Listing 10.3 Inspecting the claims on the user\n\n```\n[HttpPut(\"{userId:int}\"\
    )]\n[Authorize(AuthenticationSchemes = JwtBearerDefaults.AuthenticationScheme)]\n\
    public ActionResult<LoyaltyProgramUser> UpdateUser(\n    int userId,\n    [FromBody]\
    \ LoyaltyProgramUser user)\n{\n    var hasUserId = int.TryParse(\n        this.User.Claims.FirstOrDefault(c\
    \ => c.Type == \"userid\")?.Value,\n        out var userIdFromToken);\n    if\
    \ (!hasUserId || userId != userIdFromToken)\n        return Unauthorized();\n\
    \    return RegisteredUsers[userId] = user;\n}\n```\n\nFind the user ID in the\
    \ collection of claims.\n\nParse the user ID into userIdFromToken.\n\nCheck that\
    \ the token has a user ID that matches the user ID in the path.\n\nReturn an unauthorized\
    \ response if the user IDs do not match.\n\nThis concludes the implementation\
    \ of the authorization in the PUT endpoint in the loyalty program. We chose a\
    \ solution where the API Gateway passes a JWT with the identity of the user to\
    \ the loyalty program microservice. If the level of trust is higher, we might\
    \ choose to send the identity from the API Gateway to the loyalty program as plain\
    \ text instead.\n\nWith authorization in place, we now turn our attention to limiting\
    \ which microservices are allowed to communicate.\n\n# 10.2.2 Limiting which microservices\
    \ can communicate\n\nRecall from figure 10.1 that one of the loyalty program's\
    \ collaborators is the special offers microservice. Figure 10.6 zooms in on this\
    \ collaboration.\n\n![](img/608267d7803dc57a1a896ad121f37868_259_0.png)\n\nFigure\
    \ 10.6 The loyalty program has an API and an event consumer; the event consumer\
    \ uses the events endpoint in special offers to get events."

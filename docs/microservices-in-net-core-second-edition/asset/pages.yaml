- pgno: 115
  md: 'There are costs associated with including too much in the scope of a microservice:


    +   - The code base becomes bigger and more complex, which can lead to changes
    being more expensive.

    +   - The microservice is harder to replace.


    These costs are real, but they aren’t overwhelming when the scope of the microservice
    is still fairly small. Beware, though, because these costs grow quickly with the
    size of each microservice’s scope and become overwhelming when the scope is so
    big that it approaches a monolithic architecture.


    Nevertheless, refactoring within one code base is much easier than refactoring
    across two code bases. This gives you a better chance to experiment and to learn
    about the business capability through experiments. If you take advantage of this
    opportunity, you can arrive at a good understanding of both the special offers
    business capability and the coupons business capability more quickly than if you
    scoped your microservices too narrowly.


    This argument holds true when your microservices are a bit too big, but it falls
    apart if they’re much too big, in which case we will lose the speed and flexibility
    we want from microservices.


    > WARNING  Don’t get lazy and lump several business capabilities together in one
    microservice. You’ll quickly have a large, hard-to-manage code base with many
    of the drawbacks of a full-on monolith.


    All in all, microservices that are slightly bigger than they should ideally be
    are both less costly and allow for more agility than if they’re slightly smaller
    than they should ideally be. Thus, the rule of thumb is to err on the side of
    slightly bigger scopes.


    Once you accept that you’ll sometimes—if not often—be in doubt about the best
    scope for a microservice and that in such cases you should lean toward a slightly
    bigger scope, you can also accept that you’ll sometimes—if not often—have microservices
    in your system that are somewhat larger than they should ideally be. This means
    you should expect to have to carve new microservices out of existing ones from
    time to time.


    # 4.4.2 Carving out new microservices from existing microservices


    When you realize that one of your microservices is too big, you’ll need to look
    at how to carve a new microservice out of it. First, you need to identify a good
    scope for both the existing microservice and the new microservice. To do this,
    you can use the drivers described earlier in this chapter.


    Once you’ve identified the scopes, you must look at the code to see if the way
    it’s organized aligns with the new scopes. If not, you should begin refactoring
    toward that alignment. Figure 4.15 illustrates on a high level the refactorings
    needed to prepare to carve out a new microservice from an existing one. First,
    everything that will eventually go into the new microservice is moved to its own
    class library. Then, all communication between code that will stay in the existing
    microservice and code that will be'

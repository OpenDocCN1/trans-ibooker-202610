- pgno: 282
  md: "The pattern of this test is to do the following:\n\n+   1. Set up an HttpContext\
    \ environment that mimics the scenario you want to test. This is done using the\
    \ DefaultHttpContext type.\n+   2. Create the middleware under test and pass in\
    \ a no-op as the next piece of middleware. This terminates the pipeline, so calls\
    \ to invoke on the middleware under test will also terminate.\n+   3. Call the\
    \ middleware with the HttpContext set up at the beginning of the test.\n+   4.\
    \ Make assertions on the contents of the HttpContext or other things that the\
    \ middleware under test is expected to work on. If, for instance, the middleware\
    \ under test creates a response that should be part of the HttpContext, and therefore\
    \ accessible through the HttpContext.Response property.\n\nYou can use the same\
    \ pattern to create more tests—for other paths than oldpath. See the following\
    \ example:\n\n```\n[Fact]\npublic async Task not_redirect_other_paths()\n{\n \
    \   var ctx = new DefaultHttpContext\n    {\n        Request = {Path = \"/otherpath\"\
    }\n    };\n\n    await this.sut.Invoke(ctx);\n\n    Assert.NotEqual(\n       \
    \ StatusCodes.Status301MovedPermanently,\n        ctx.Response.StatusCode);\n\
    \    Assert.DoesNotContain(\"Location\", ctx.Response.Headers);\n}\n```\n\nThis\
    \ test follows the exact pattern as the previous test and is generally how you\
    \ test middleware.\n\nTo test a longer pipeline of several pieces of middleware,\
    \ you build the pipeline by passing one into the other as next, just as you passed\
    \ noop into your middleware. Once the pipeline is built, the rest is just like\
    \ the previous middleware tests. You compose the pieces of middleware to form\
    \ a pipeline that you can pass an HttpContext to and make an assertion of the\
    \ result running the whole pipeline.\n\nNow that you’ve learned how to write and\
    \ test ASP.NET middleware, you’re ready to use middleware to address cross-cutting\
    \ concerns in the particular context of your project. Starting with a fairly simple\
    \ microservice platform covering structured logging, tracing, and monitoring,\
    \ you can extend it further with other cross-cutting concerns along the way. That\
    \ way you can ensure that you can continue creating new microservices efficiently\
    \ while also addressing cross-cutting concerns to make your life easier from an\
    \ operational perspective."
  merge: -1
  img_proc: true
- pgno: 283
  md: '# Summary


    +   - Because you’ll often be building new microservices in a microservice system,
    you need to be able to quickly and easily build a new one from scratch.

    +   - To meet cross-cutting requirements for monitoring, logging, and security,
    there are a number of things that all microservices in a system need to do. Exactly
    which things differ from system to system.

    +   - You should develop a reusable microservice platform for your microservice
    system. With such a platform, it’s simple to create new microservices that behave
    as they’re supposed to in terms of logging, monitoring, and other cross-cutting
    concerns.

    +   - A reusable microservices platform should address only cross-cutting technical
    concerns.

    +   - A reusable microservices platform shouldn’t address domain logic, because
    this differs between microservices.

    +   - NuGet is a good format for distributing a microservice platform.

    +   - You use the `dotnet pack` command to create a NuGet package.

    +   - You can create NuGet packages to do the following:

    +     - Standardize monitoring endpoints to microservices

    +     - Standardize structured logging

    +     - Standardize tracing

    +     - Enforce any other technology-specific policies your system has

    +   - You can build NuGet packages from libraries.

    +   - You can use your own custom NuGet packages in your microservices.

    +   - You can leverage ASP.NET middleware for cross-cutting concerns.

    +   - You can easily write tests for ASP.NET middleware.'
  merge: -1
  img_proc: true

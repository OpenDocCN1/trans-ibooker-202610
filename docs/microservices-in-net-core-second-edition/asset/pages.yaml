  img_proc: true
- pgno: 179
  md: '![](img/608267d7803dc57a1a896ad121f37868_179_0.png)


    # Figure 7.1 In a system of microservices, there will be many communication paths.


    +   - **Command-based collaboration**—When sending a command fails, the sender
    can’t know whether the receiver got the command. Again, depending on how the sender
    copes, this could result in an error, or it could result in degraded functionality.

    +   - **Event-based collaboration**—When a subscriber polls an event feed but
    the call fails, the impact is limited. The subscriber will poll the event feed
    again later and, assuming the event feed is up again, receive the events at that
    time. In other words, the subscriber will still get all events, but some of them
    will be delayed. This shouldn’t be a problem for an event-based collaboration
    because it’s asynchronous anyway.


    The following subsection discusses some important ways to prepare for handling
    failure well.'
  merge: -1

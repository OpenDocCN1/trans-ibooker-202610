  md: "# Listing 10.1   Configuration to use JWT bearer tokens by default\n\n```\n\
    public void ConfigureServices(IServiceCollection services)\n{\n    services.AddAuthentication(JwtBearerDefaults.AuthenticationScheme)\n\
    \        .AddJwtBearer(x => x.TokenValidationParameters =\n            new TokenValidationParameters\n\
    \            {\n                ValidAudience = ...,\n                ValidIssuer\
    \ = ...,\n                IssuerSigningKey = ...,\n            });\n    services.AddControllers();\n\
    }\n```\n\nThis outlines how to add middleware that reads and validates a JWT from\
    \ the Authorization headers of incoming requests. This fits with an API Gateway\
    \ configured to pass the user identity in a JWT in the Authorization header.\n\
    \nThe next step is to make the user identity available for controllers, which\
    \ is done by adding authorization to the pipeline in the Startup class, shown\
    \ next.\n\n# Listing 10.2   Using authorization middleware to make identities\
    \ available to controllers\n\n```\npublic void Configure(IApplicationBuilder app,\
    \ IWebHostEnvironment env)\n{\n    app.UseHttpsRedirection();\n    app.UseRouting();\n\
    \    app.UseAuthorization();\n    app.UseEndpoints(endpoints => endpoints.MapControllers());\n\
    }\n```\n\nThis means that the controllers can now demand that an identity token\
    \ be present in the request using the Authorize attribute and can access the user\
    \ identity through the User property on ControllerBase. For instance, to protect\

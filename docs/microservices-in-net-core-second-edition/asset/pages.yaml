    \ that expects a representation of a user in the body of the request and then\
    \ registers that user in the loyalty program\n+   - An HTTP PUT endpoint at URLs\
    \ of the form \"/users/{userId}\" that expects a representation of a user in the\
    \ body of the request and then updates an already registered user\n\nLet’s write\
    \ tests for these endpoints. The loyalty program microservice has an event feed\
    \ for which you’ll also write a test. You won’t write comprehensive tests for\
    \ the endpoints and event feed in the loyalty program—only enough to see how tests\

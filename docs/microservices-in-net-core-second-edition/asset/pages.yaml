    # 6.2.3 Where does a microservice store its data?


    A microservice can use one, two, or more databases. Some of the data stored by
    the microservice may fit well into one type of database, and other data may fit
    better into another type. Many viable database technologies are available, and
    I won’t get into a comparison here. There are, however, some broad database categories
    that you can consider when you’re making a choice, including relational databases,
    key/value stores, document databases, column stores, and graph databases.


    If your production environment is in one of the major public clouds, there are
    some very compelling database services you can take advantage of. These offerings
    differ in terms of database category—relation databases, document databases, and
    so on—but also in terms of operational characteristics. Some are “server-less”
    and require very little in terms of maintenance; others are more traditional.
    These also should be taken into consideration.'

  md: "Now we have a Kubernetes cluster running in Azure, and we have the dashboard\
    \ running, so we have a friendly interface to what’s running the cluster. We also\
    \ have the shopping cart container image and a Kubernetes manifest file for the\
    \ shopping cart. With all this in place, we are ready to deploy the shopping cart\
    \ to our AKS cluster. Not only that, since the way we built the shopping cart\
    \ container easily extends to building containers for other microservices and\

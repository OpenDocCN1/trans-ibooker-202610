    \ it calls the rest of the pipeline.\n\nYou can write a test for this middleware\
    \ tests that oldpath is in fact redirected to newpath.\n\n# Listing 11.10 Test\
    \ that invokes middleware directly\n\n```\nnamespace MiddlewareTests\n{\n    using\
    \ System.Threading.Tasks;\n    using Microsoft.AspNetCore.Http;\n    using Middleware;\n\
    \    using Xunit;\n\n    public class RedirectingMiddleware_should\n    {\n  \
    \      private readonly RedirectingMiddleware sut;\n\n        public RedirectingMiddleware_should()\n\
    \        {\n            this.sut = new RedirectingMiddleware(_ => Task.CompletedTask);\n\
    \        }\n\n        [Fact]\n        public async Task redirect_oldpath_to_newpath()\n\
    \        {\n            var ctx = new DefaultHttpContext\n            {\n    \
    \            Request = {Path = \"/oldpath\"}\n            };\n\n            await\
    \ this.sut.Invoke(ctx);\n\n            Assert.Equal(StatusCodes.Status301MovedPermanently,\
    \ ctx.Response.StatusCode);\n            Assert.Equal(\"/newpath\", ctx.Response.Headers[\"\
    Location\"]);\n        }\n    }\n```\n\nCreates middleware with no-op as next\n\
    \nSets up the HttpContext for this test\n\nInvokes the middleware under test\n\

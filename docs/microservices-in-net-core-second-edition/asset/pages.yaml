  md: 'the characteristics also tell you whether you’ve scoped your microservices
    well or need to push the drivers further to find better scopes for your microservices.


    # 4.5.1 Primary scoping to business capabilities leads to good microservices


    The primary driver for scoping microservices is identifying business capabilities.
    Let’s see how that makes for microservices that adhere to the microservice characteristics.


    # RESPONSIBLE FOR A SINGLE CAPABILITY


    A microservice scoped to a single business capability by definition adheres to
    the first microservice characteristic: it’s responsible for a single capability.
    As you saw in the examples of identifying supporting technical capabilities, you
    have to be careful: it’s easy to let too much responsibility slip into a microservice
    scoped to a business capability. You have to be diligent in making sure that what
    a microservice implements is just one business capability and not a mix of two
    or more. You also have to be careful about putting supporting technical capabilities
    in their own microservices. As long as you’re diligent, microservices scoped to
    a single business capability adhere to the first characteristic of microservices.


    # INDIVIDUALLY DEPLOYABLE


    Business capabilities are those that can be performed by largely independent groups
    within an organization, so the business capabilities themselves must be largely
    independent. As a result, microservices scoped to business capabilities are largely
    independent. This doesn’t mean there’s no interaction between such microservices—there
    can be a lot of interaction, both through direct calls between services and through
    events. The point is that the interaction happens through well-defined public
    interfaces that can be kept backward compatible. If implemented well, the interaction
    is such that other microservices continue to work even if one has a short outage.
    This means well-implemented microservices scoped to business capabilities are
    individually deployable.


    # REPLACEABLE AND MAINTAINABLE BY A SMALL TEAM


    A business capability is something a small group in an organization can handle.
    This limits its scope and thus also limits the scope of microservices scoped to
    business capabilities. Again, if you’re diligent about making sure a microservice
    handles only one business capability and that supporting technical capabilities
    are implemented in their own microservices, the microservices’ scope will be small
    enough that a small team can maintain at least a handful of microservices and
    a microservice can be replaced fairly quickly if need be.


    # 4.5.2 Secondary scoping to support technical capabilities leads to good microservices


    The secondary driver for scoping microservices is identifying supporting technical
    capabilities. Let’s see how that makes for microservices that adhere to the microservice
    characteristics.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# RESPONSIBLE FOR A SINGLE CAPABILITY


    Just as with microservices scoped to business capabilities, scoping a microservice
    to a single supporting technical capability by definition means it adheres to
    the first characteristic of microservices: it’s responsible for a single capability.


    # INDIVIDUALLY DEPLOYABLE


    Before you decide to implement a technical capability as a separate supporting
    technical capability in a separate microservice, you need to ask whether that
    new microservice will be individually deployable. If the answer is no, you shouldn’t
    implement it in a separate microservice. Again, by definition, a microservice
    scoped to a supporting technical capability adheres to the second microservice
    characteristic.


    # REPLACEABLE AND MAINTAINABLE BY A SMALL TEAM


    Microservices scoped to a supporting technical capability tend to be narrowly
    and clearly scoped. On the other hand, part of the point of implementing such
    capabilities in separate microservices is that they can be complex. In other words,
    microservices scoped to a supporting technical capability tend to be small, which
    points toward adhering to the microservice characteristics of replaceability and
    maintainability; but the code inside them may be complex, which makes them harder
    to maintain and replace.


    This is an area where there’s a certain back and forth between using supporting
    technical capabilities to scope microservices on one hand, and the characteristics
    of microservices on the other. If a supporting technical microservice is becoming
    so complex that it will be hard to replace, this is a sign that you should probably
    look closely at the capability and try to find a way to break it down further,
    as in the example about notification (see section 4.2.2).


    # 4.5.3 Tertiary scoping to support efficiency of work


    The third driver for scoping microservices is supporting the efficiency of work.
    Let’s see how making sure teams can work efficiently aligns with the microservice
    characteristics.


    # INDIVIDUALLY DEPLOYABLE


    Part of making sure that teams can work efficiently and autonomously is to make
    sure that they can deliver their work all the way to production. This aligns nicely
    to the second microservice characteristic. When a microservices is individually
    deployable, the team can deploy it to production without coordinating with other
    teams. This is part of making sure that the team can work efficiently.


    # A SMALL TEAM CAN MAINTAIN A FEW HANDFULS OF MICROSERVICES


    Teams should have knowledge necessary to maintain the microservices they are responsible
    for. Otherwise, they cannot work efficiently and autonomously. When they have
    the knowledge needed, they can maintain their microservices by themselves end-to-end,
    which supports the fifth microservices characteristic.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Summary


    +   - The primary driver in scoping microservices is identifying business capabilities.
    Business capabilities are the things an organization does that contribute to fulfilling
    business goals.

    +   - You can use techniques from domain-driven design to identify business capabilities.
    Domain-driven design is a powerful tool for gaining better and deeper understanding
    of a domain. That kind of understanding enables you to identify business capabilities.

    +   - The secondary driver in scoping microservices is identifying supporting
    technical capabilities. A supporting technical capability is a technical function
    needed by one or more microservices scoped to business capabilities.

    +   - Supporting technical capabilities should be moved to their own microservices
    only if they’re sufficiently complex to be a problem in the microservices they
    would otherwise be part of, and if they can be individually deployed.

    +   - Identifying supporting technical capabilities is an opportunistic form of
    design. You should only pull a supporting technical capability into a separate
    microservice if it will be an overall simplification.

    +   - The tertiary driver in scoping microservices is efficiency of work. A team
    assigned to develop and maintain microservices should be able to work efficiently
    and autonomously.

    +   - When you’re in doubt about the scope of a microservice, lean toward making
    the scope slightly bigger rather than slightly smaller.

    +   - Because scoping microservices well is difficult, you’ll probably be in doubt
    sometimes. You’re also likely to get some of the scopes wrong in your first iteration.

    +   - You must expect to have to carve new microservices out of existing ones
    from time to time.

    +   - You can use your doubt about scope to organize the code in your microservices
    so that they lend themselves to carving out new microservices at a later stage.'
  merge: -1
  img_proc: true
- pgno: 121
  md: "# Microservice collaboration\n\n+   **This chapter covers**\n+   \n+   - Understanding\
    \ how microservices collaborate through commands, queries, and events\n+   - Comparing\
    \ event-based collaboration with collaboration based on commands and queries\n\
    +   - Implementing an event feed\n+   - Implementing command-, query-, and event-based\
    \ collaboration\n+   - Deploying collaborating microservices to Kubernetes\n\n\
    Each microservice implements a single capability, but to deliver end-user functionality,\
    \ microservices need to collaborate. Microservices can use three main communication\
    \ styles for collaboration: *commands*, *queries*, and *events*. Each style has\
    \ its strengths and weaknesses, and understanding the tradeoffs between them allows\
    \ you to pick the appropriate one for each microservice collaboration. When you\
    \ get the collaboration style right, you can implement loosely coupled microservices\
    \ with clear boundaries."
  merge: -1
  img_proc: true
- pgno: 122
  md: 'In this chapter, I''ll show you how to implement all three collaboration styles
    in code using HTTP GET, POST, PUT, and DELETE endpoints. I will also show how
    to deploy several collaborating microservices to Kubernetes and have them collaborate
    as intended using all three collaboration styles.


    # 5.1 Types of collaboration: Commands, queries, and events


    Microservices are fine grained and narrowly scoped. To deliver functionality to
    an end user, microservices need to collaborate.


    As an example, consider the loyalty program microservice from the POS system in
    chapter 4. The loyalty program microservice is responsible for the loyalty program
    business capability. The program is simple: customers can register as users with
    the loyalty program; once registered, they receive notifications about new special
    offers and earn loyalty points when they purchase something. Still, the loyalty
    program business capability depends on other business capabilities, and other
    business capabilities depend on it. As illustrated in figure 5.1, the loyalty
    program microservice needs to collaborate with a number of other microservices.


    ![](img/608267d7803dc57a1a896ad121f37868_122_0.png)


    Figure 5.1 The loyalty program microservice collaborates with several other microservices.
    In some cases, the loyalty program microservice receives requests from other microservices;
    at other times, it sends requests to other microservices.


    As stated in the list of microservice characteristics in chapter 1, a microservice
    is responsible for a single capability; and as discussed in chapter 4, that single
    capability is typically a business capability. End-user functionalities—or use
    cases—often involve several business capabilities, so the microservices implementing
    these capabilities must collaborate to deliver functionality to the end user.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'When two microservices collaborate, there are three main styles:


    +   - *Commands*—Commands are used when one microservice needs another microservice
    to perform an action. For example, the loyalty program microservice sends a command
    to the notifications microservice when it needs a notification to be sent to a
    registered user.

    +   - *Queries*—Queries are used when one microservice needs information from
    another microservice. Because customers with many loyalty points receive a discount,
    the invoice microservice queries the loyalty program microservice for the number
    of loyalty points a user has.

    +   - *Events*—Events are used when a microservice needs to react to something
    that happened in another microservice. The loyalty program microservice subscribes
    to events from the special offers microservice so that when a new special offer
    is made available, it can have notifications sent to registered users.


    The collaboration between two microservices can use one, two, or all three of
    these collaboration styles. Each time two microservices need to collaborate, you
    must decide which style to use. Figure 5.2 shows the collaborations of loyalty
    program again, but this time identifying the collaboration style I chose for each
    one.


    ![](img/608267d7803dc57a1a896ad121f37868_123_0.png)


    Figure 5.2 The loyalty program microservice uses all three collaboration styles:
    commands, queries, and events.


    Collaboration based on commands and queries should use relatively coarse-grained
    commands and queries. The calls made between microservices are remote calls, meaning
    they cross at least a process boundary and usually also a network. This means
    calls between microservices are relatively slow. Even though the microservices
    are fine-grained, you must not fall into the trap of thinking of calls from one
    microservice to another as being like function calls in a microservice.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'Furthermore, you should prefer collaboration based on events over collaboration
    based on commands or queries. Event-based collaboration is more loosely coupled
    than the other two forms of collaboration because events are handled asynchronously.
    That means two microservices collaborating through events aren’t temporally coupled;
    the handling of an event doesn’t have to happen immediately after the event is
    raised. Rather, handling can happen when the subscriber is ready to do so. In
    contrast, commands and queries are synchronous and therefore need to be handled
    immediately after they’re sent.


    # 5.1.1 Commands and queries: Synchronous collaboration


    Commands and queries are both synchronous forms of collaboration. Both are implemented
    as HTTP requests from one microservice to another. Queries are implemented with
    HTTP GET requests, whereas commands are implemented with HTTP POST, PUT, or DELETE
    requests.


    # Commands and Queries over gRPC


    As mentioned briefly in chapter 1, gRPC is a strong candidate for an alternative
    to using HTTP. gRPC is a protocol for performing remote procedure calls (RPC),
    which means that it offers a model for allowing one microservice to call a method
    in another microservice. This maps directly to commands and queries—commands are
    calls to methods that perform an action in the receiving microservices, and queries
    are methods that return some information to the calling microservices.


    Working with gRPC starts with defining a contract in the form of a proto file
    where procedure calls are described. The proto file is used to generate code for
    both the client and server side using the Grpc.Tools NuGet package.


    The main benefits of using gRPC for microservice collaboration are as follows:


    +   - *Efficiency*—gRPC uses HTTP/2 and protobuf. Protobuf is a much more compact
    format than JSON. Likewise HTTP/2 offers more efficiency than HTTP/1. In high-load
    systems this can make a significant difference and make gRPC very appealing.

    +   - *Explicit contracts*—The proto files define the contract between the calling
    microservice and the receiving microservice, and the gRPC libraries will check
    the contract at runtime. This is a double-edged sword: we can gain some safety
    by making the contracts explicit, but we also lose some flexibility to evolve
    microservices in isolation by checking the contracts in detail.

    +   - *Good .NET support*—With the Grpc.tools NuGet package for generating code
    from the proto files and the Grpc.AspNetCore NuGet package for hosting gRPC endpoints
    in ASP.NET, using gRPC fits nicely into .NET-based microservices.


    The loyalty program microservice can answer queries about registered users and
    can handle commands to create or update registered users. Figure 5.3 shows the
    command- and query-based collaborations that loyalty program takes part in.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '![](img/608267d7803dc57a1a896ad121f37868_125_0.png)


    **Figure 5.3** The loyalty program microservice collaborates with three other
    microservices using commands and queries. The queries are implemented as HTTP
    GET requests, and the commands are implemented as HTTP POST or PUT requests. The
    command collaboration with the notifications microservice is grayed out because
    I’m not going to show its implementation—it’s done exactly the same way as the
    other collaborations.


    Figure 5.3 includes two different queries: “Get loyalty points for registered
    user” and “Get settings for registered user.” You’ll handle both of these with
    the same endpoint that returns a representation of the registered user. The representation
    includes both the number of loyalty points and the settings. You do this for two
    reasons: it’s simpler than having two endpoints, and it’s also cleaner because
    the loyalty program microservice gets to expose just one representation of the
    registered user instead of having to come up with specialized formats for specialized
    queries.


    Two commands are sent to loyalty program in figure 5.3: one to register a new
    user, and one to update an existing registered user. You’ll implement the first
    with an HTTP POST and the second with an HTTP PUT. This is standard usage of POST
    and PUT HTTP methods. POST is often used to create a new resource, and PUT is
    defined in the HTTP specification to update a resource.


    All in all, the loyalty program microservice needs to expose three endpoints:


    +   - An HTTP GET endpoint at URLs of the form `/users/{userId}` that responds
    with a representation of the user. This endpoint implements both queries in figure
    5.3.

    +   - An HTTP POST endpoint at “/users/” that expects a representation of a user
    in the body of the request and then registers that user in the loyalty program.

    +   - An HTTP PUT endpoint at URLs of the form “/users/{userId}” that expects
    a representation of a user in the body of the request and then updates an already
    registered user.'

  md: "# Listing 9.9   Configuring Serilog to include tracing information in all log\
    \ messages\n\n```\nprivate static IHostBuilder CreateHostBuilder(string[] args)\
    \ =>\n    Host.CreateDefaultBuilder(args)\n        .UseSerilog((context, logger)\
    \ =>\n        {\n            logger\n                .Enrich.FromLogContext()\n\
    \                .Enrich.WithSpan();\n            if (context.HostingEnvironment.IsDevelopment())\n\
    \                logger.WriteTo.ColoredConsole(\n                    outputTemplate:\
    \ @\"{Timestamp:yyyy-MM-dd HH:mm:ss}\\n{TraceId} {Level:u3} {Message}{NewLine}{Exception}\"\
    \n                );\n            else\n                logger.WriteTo.Console(new\
    \ JsonFormatter());\n        })\n        .ConfigureWebHostDefaults(x => x.UseStartup<Startup>());\n\
    ```\n\nThe important new part in the previous listing is the line `.Enrich.WithSpan();`,\
    \ which configures Serilog to read the trace information from the `Activity.Current`\
    \ and add it to every log message. In the JSON output used in production, all\
    \ information on log messages is included by default. In the text output used\
    \ in development, we need to override the default output format to add the trace\
    \ ID, which is done by passing an output format that includes trace ID into the\

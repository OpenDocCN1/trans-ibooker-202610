- pgno: 263
  md: '# Summary


    +   - Users should be authenticated at the edge of the system. That is, the microservice
    that first receives a user request should initiate authentication.

    +   - Authorization should happen in the microservice system in the microservice
    that owns whatever data or action the request is for. The principle is that authorization
    is part of the business rules belonging to a business capability. Because microservices
    are—as you saw in chapter 4—designed around business capabilities, it follows
    that a microservice responsible for a business capability should also be responsible
    for any authorization related to that business capability.

    +   - The principle of security in-depth requires that you consider the level
    of trust you can accept between microservices. In some systems, it may be acceptable
    for microservices to trust requests from other microservices. In other systems,
    it may not.

    +   - There’s a tradeoff between the convenience of having a high degree of trust
    between microservices and the security that follows from a lower degree of trust.

    +   - You can introduce a login microservice that’s responsible for all authentication,
    including both end user authentication and authentication of calls from one microservice
    to another.

    +   - You use Kubernetes network policies to control which microservices can collaborate
    by configuring scopes and which microservices receive which scopes.

    +   - You can set up the login microservice using a number of different off-the-shelf
    products.

    +   - You can use an identity token to pass the user identity around in a more
    secure way than including a user ID as plain text.

    +   - You can read the identity token from incoming requests and use the claims
    in it to perform authorization in controller actions.'
  merge: -1
  img_proc: true

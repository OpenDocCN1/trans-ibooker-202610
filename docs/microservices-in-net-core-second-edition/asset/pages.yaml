  md: "Middleware in this style takes in the next piece of middleware in the constructor\
    \ and stores it in a private variable such that it can be called as needed in\
    \ the Invoke method, which implements the middleware's behavior. To add this kind\
    \ of middleware to the ASP.NET pipeline, you instantiate it and then use the Invoke\
    \ method as a delegate:\n\n```\napp.Use(next => new ConsoleMiddleware(next).Invoke());\n\
    ```\n\nOr, we can use the more convenient extension method UseMiddleware, which\
    \ essentially does the same thing by using reflection to find the Invoke method:\n\
    \n```\napp.UseMiddleware<ConsoleMiddleware>()\n```\n\nCalling UseMiddleware is\

- pgno: 185
  md: 'You can see that with regard to command- and query-based collaboration, robustness
    doesn’t come easily. The next two sections talk about patterns for building robustness
    into command- and query-based collaborations.


    # 7.2.1 Robustness pattern: Retry


    The client in a command- or query-based collaboration may choose to try again
    when a request fails. If the reason for the failed request is transient, the next
    attempt may be successful. Transient failures are common, and the reasons for
    them include the following:


    +   - Network congestion.

    +   - The server microservice being deployed. Depending on how the microservice
    is deployed, there may be a short window when the microservice is unavailable
    or slow—for example, while a load balancer is switched over to a new version.
    Even if the server is slow only during deployment, requests may fail due to timeouts.


    Retrying is a double-edged sword. If the reason for the failures isn’t transient,
    retrying requests won’t help. On the contrary, retrying indiscriminately puts
    stress on the server because it’s getting not only its usual number of requests,
    but also the retries (see figure 7.6). This may not seem like a big deal, but
    imagine a system that’s already under high load. During normal operation, the
    client sends many requests to the server. If requests start failing and the client
    retries all of them, the client ends up sending more and more requests to the
    server. If the reason for the failing requests is that the server is already having
    trouble keeping up with the number of requests it receives, sending even more
    requests certainly isn’t going to help.


    ![](img/608267d7803dc57a1a896ad121f37868_185_0.png)


    **Figure 7.6** If a client keeps retrying a request that continues to fail at
    the server, the stress on the server will grow, and it may eventually fail completely.'

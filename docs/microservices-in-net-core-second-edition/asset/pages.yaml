- pgno: 188
  md: 'The circuit breaker pattern addresses this situation by not making request
    E at all, but instead assumes it will fail. Not making requests that are likely
    to fail alleviates stress on both the client and the server:


    +   - The server receives fewer requests.

    +   - The client doesn’t have to wait for requests to fail but rather assumes
    they will, meaning the client doesn’t spend resources on waiting and can get its
    own work done more quickly.


    A circuit breaker wraps HTTP requests in a state machine like the one shown in
    figure 7.9. When the microservice needs to make an HTTP request, it does so through
    the circuit breaker.


    ![](img/608267d7803dc57a1a896ad121f37868_188_0.png)


    Figure 7.9 A circuit breaker is a state machine with three states. When the circuit
    breaker is closed, real HTTP requests are made. When the circuit breaker is open,
    no requests are made. A circuit breaker helps avoid making HTTP requests that
    are likely to fail.


    The circuit breaker state machine starts in the closed state and works as follows:


    +   - While the circuit breaker is in the closed state, it makes a real HTTP request
    when asked. If the HTTP request fails, the circuit breaker increments a counter.
    If the request succeeds, the circuit breaker resets the counter to zero. When
    and if that counter exceeds a preset limit—say, five failed requests in a row—the
    circuit breaker goes to the open state.

    +   - While the circuit breaker is in the open state, it doesn’t make any HTTP
    requests. Instead, it errors immediately. The circuit breaker stays in the open
    state for a preset period—say, 30 seconds—and then goes to the half-open state.

    +   - While the circuit breaker is in the half-open state, it makes an HTTP request
    the first time it’s asked. After that one HTTP request, it goes to the closed
    state if the request succeeded, or to the open state if it failed.


    The result of these simple rules is a state machine that stops making HTTP requests
    when they’re likely to fail anyway. Later in this chapter, I’ll show you how to
    use Polly to create circuit breakers around HTTP requests.'

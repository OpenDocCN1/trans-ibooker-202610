- pgno: 295
  md: 'The point of a BFF is to support the single application built on top of it.
    That means the application and BFF are tightly coupled: the BFF exposes the functionality
    the application needs, and it does so in a way that makes writing the application
    as easy as possible.


    # ADVANTAGES


    With the BFF pattern, each application gets to use an API that’s tailored exactly
    to its needs. With an API Gateway, there’s a risk of it becoming bloated as you
    add more and more functionality to it over time. With a BFF, this is less of a
    risk, because the BFF doesn’t have to cover everything in the system, only the
    functionality needed by the application it serves.


    It’s fairly easy to know when something can be removed from a BFF: when no active
    version of the application it serves uses that functionality. Compare this to
    an API Gateway with several applications in front: something can be removed from
    the API Gateway only when no version of any of the applications uses it. All in
    all, BFFs offer a way to both simplify application development and keep the server-side
    focused and well factored.


    # DISADVANTAGES


    In cases where you have several applications that provide similar or overlapping
    functionality to end users—such as having both an iOS app and an Android app targeted
    at the same type of end user—the BFF pattern leads to duplicating code among several
    BFFs. This comes with the usual disadvantages of duplication: duplicated effort
    every time there are changes to the duplicated parts, and a tendency for the duplicated
    parts to drift away from each other over time and end up working slightly differently
    in different applications.


    The BFF pattern can strike a good balance between placing the burden of integration
    on the application and creating an API Gateway that may grow too large over time.


    # 12.2.4 When to use each pattern


    Now that you know about the three patterns for building end user applications
    for a microservice system, the inevitable question is which one to choose. All
    three patterns have merit and are useful, so I won’t recommend one over the other.
    But when you’re about to build an application, you must make a choice. I base
    that choice on the following questions:


    +   - *How much intelligence do you want to put into the application?*


    For a line-of-business application that’s only used within the company firewall
    and only on company machines, you may opt to build a desktop application with
    a lot of intelligence. In that case, the composite application pattern is the
    obvious choice.


    For a public-facing e-commerce application meant to run in any browser, with the
    risk of somebody trying to hack the app, you may shy away from putting intelligence
    into the application, making the composite application pattern less attractive.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '+   - *Is there more than one application? If so, how different are the applications?*


    If you haven’t put much intelligence in the application, and if there’s only one
    application, or if all applications provide similar functionality—maybe even in
    similar ways—an API Gateway is probably a good choice.


    If there are several applications, and they provide different sets of functionality,
    the BFF pattern is a good option. With an API Gateway or with BFFs, the intelligence
    is on the backend. The API Gateway works well as long as it’s cohesive—that is,
    as long as the set of all endpoints exposed by the API Gateway has a certain consistency
    in terms of how applications should use them and how they’re structured.


    If some endpoints follow a remote procedure call (RPC) style and others follow
    a representation state transfer (REST) style, they’re inconsistent, and cohesion
    in the API Gateway codebase will probably be low. In such cases, you should consider
    the BFF pattern. With BFFs, you can have some applications that work with an RPC
    style API in one BFF and other apps that use a REST API in another, without compromising
    cohesion. Each BFF can be cohesive and consistent by itself, but you don’t need
    consistency among BFFs in terms of API style.


    +   - *How big is the system?*


    With a large system—in terms of the amount of functionality it exposes—an API
    Gateway can become an unmanageable codebase that exposes many of the disadvantages
    of monoliths. With large systems, using a number of BFFs is probably a better
    choice than one big API Gateway. On the other hand, if the system isn’t that big,
    an API Gateway can be simpler than BFFs.


    It’s worth noting that you don’t need to make the same choice for all applications.
    You may start with an API Gateway and build a few applications on it, but then
    decide that a new application with an innovative approach to doing things doesn’t
    fit the API Gateway’s way of doing things and give the new application a BFF.
    Likewise, you may have internal-facing applications that use the composite application
    pattern, while at the same time having external-facing apps that go through an
    API Gateway or BFFs.


    # 12.2.5  Client-side or server-side rendering?


    I’ve talked about three patterns for building applications over microservices:
    composite applications, API Gateway, and BFF. If you build web apps using these
    patterns, there’s another question to address: should you use server-side or client-side
    rendering? That is, should you generate ready-to-go HTML on the server—using,
    for instance, Razor (http://mng.bz/6m4R) or Blazor server-side (http://mng.bz/o8ZD)—or
    should you render the HTML in a JavaScript application, using one of the many
    application frameworks such as Angular (https://angular.io/), Vue.js (https://vuejs.org/),
    React (https://reactjs.org/), or Blazor client-side (http://mng.bz/nrZd)?


    This, again, is a question that doesn’t have one clear answer but depends entirely
    on the application you want to build. How dynamic is the application? Is it more
    concerned with working with data or with showing and entering data? The more dynamic'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'the app is, and the more its workflow is about working with and manipulating
    data, the more I lean toward client-side rendering; whereas the more static the
    app is, and the more the workflow is about viewing and entering data, the more
    I lean toward server-side rendering. The main point, though, is that the choice
    between client- and server-side rendering is about the application you want to
    build, not the fact that you’ve chosen to use a microservice architecture on the
    server side.


    All three patterns support both server-and client-side rendering. More than that,
    they support mixing server- and client-side rendering such that some parts of
    an application are server side–rendered and others are client side–rendered. For
    instance, the catalog of policies in the insurance system is static and read-only
    in most situations; it probably makes sense to render it on the server side. On
    the other hand, the valuation calculator is a more dynamic component that lets
    users play around with parameters before saving a final result; it’s probably
    well suited for client-side rendering in a JavaScript application. The two can
    coexist in the same application:


    +   - If you’re building a composite application, it can draw in the server side–rendered
    catalog of policies as well as the JavaScript app for the valuation calculator.
    The microservice responsible for the policy catalog will provide the server side–generated
    UI for the policy catalog, whereas the microservice in charge of valuations will
    provide the valuation calculator JavaScript application.

    +   - If you’re using an API Gateway, it can contain endpoints that return HTML
    and others that return data—for example, in the form of JSON. It can even contain
    endpoints that can return either HTML or JSON data, based on the Accept header
    in the request. So again, an app can contain a server side–rendered policy catalog
    along with a client side–rendered valuation calculator.

    +   - If you’re using BFFs, you have the same possibilities for having endpoints
    return HTML, data, or both. In addition, BFFs give you the opportunity to make
    different decisions for different applications: in one BFF, the policy catalog
    can be server side–rendered, but in another it may be client side–rendered.


    The choice between server- and client-side rendering of a web UI isn’t impacted
    by the fact that the server side uses microservices. All the patterns we’ve looked
    at for building applications over microservices support both server- and client-side
    rendering.


    # 12.3 Example: A shopping cart and a product list


    Let’s look at a concrete example and see the code required to implement a couple
    of pieces of functionality in one application. This example uses one application
    pattern and doesn’t show the other two in detail; it will show you how to bring
    together functionality from a number of different microservices in an application,
    which is also at the core of the other two patterns.


    The remainder of this chapter picks up the example of the shopping cart on an
    e-commerce website from earlier chapters. First I’ll recap the example, then I’ll
    show you a small UI for the shopping cart and a product list, and finally you’ll
    implement them.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'On the e-commerce website, users can browse products and add them to the shopping
    cart. When a user adds a product to their cart, the process shown in figure 12.7
    is triggered. A number of things happen:


    +   1. The item is added to the shopping cart.

    +   2. A new total is calculated for the contents of the cart.

    +   3. The recommendation and shopper tracking microservices are notified of the
    change to the shopping cart through the event feed on the shopping cart microservice.


    ![](img/608267d7803dc57a1a896ad121f37868_298_0.png)


    **Figure 12.7** The shopping cart microservice is responsible for storing and
    maintaining shopping carts on behalf of users, but the API Gateway makes that
    functionality (along with other pieces of functionality) available to end users
    to use in a web app.'

  md: "# 12.3.3 Creating the shopping cart GUI\n\nThe next bit of GUI you want to\
    \ add is the contents of the shopping cart. To do this, first extend the /productlist\
    \ endpoint to call not only the product catalog microservice but also the shopping\
    \ cart microservice, which means first we add another HttpClient to the IServiceCollection,\
    \ assuming the shopping cart runs on localhost port 5201.\n\n# Listing 12.11 Adding\
    \ shopping cart HttpClient to the service collection\n\n```\npublic void ConfigureServices(IServiceCollection\
    \ services)\n{\n    services.AddBasicHealthChecks();\n    services.AddControllersWithViews();\n\
    \    services.Configure<RazorViewEngineOptions>(x =>\n        x.ViewLocationFormats.Add(\"\
    {1}/{0}.cshtml\"));\n    services.AddHttpClient(\n        \"ProductCatalogClient\"\
    ,\n        client => client.BaseAddress = new Uri(\"https://localhost:5001\"))\n\
    \        .AddTransientHttpErrorPolicy(p =>\n            p.WaitAndRetryAsync(\n\
    \                3,\n                attempt => TimeSpan.FromMilliseconds(100\
    \ * Math.Pow(2, attempt))));\n    services.AddHttpClient(\n        \"ShoppingCartClient\"\
    ,\n        client => client.BaseAddress = new Uri(\"https://localhost:5201\"));\n\
    }\n```\n\nUse the new HttpClient to get the contents of the shopping cart.\n\n\
    # Listing 12.12 Extending /productlist to fetch the shopping cart\n\n```\nnamespace\
    \ ApiGateway.ProductList\n{\n    using System.Net.Http;\n    using System.Net.Http.Json;\n\
    \    using System.Text.Json;\n    using System.Threading.Tasks;\n    using Microsoft.AspNetCore.Mvc;\n\
    \n    public class ProductListController : Controller\n    {\n        private\
    \ readonly HttpClient productCatalogClient;\n        private readonly HttpClient\
    \ shoppingCartClient;\n\n        public ProductListController(IHttpClientFactory\
    \ httpClientFactory)\n        {\n            this.productCatalogClient =\n   \
    \             httpClientFactory.CreateClient(\"ProductCatalogClient\");\n    \
    \        this.shoppingCartClient =\n                httpClientFactory.CreateClient(\"\
    ShoppingCartClient\");\n        }\n    }\n```"

    \ Replace the current registration of ProductCatalogClient in Startup with this:\n\
    \n# Listing 2.13 Microservice error-handling policy\n\n```\nservices.AddHttpClient<IProductCatalogClient,\
    \ ProductCatalogClient>()\n    .AddTransientHttpErrorPolicy(p =>\n        p.WaitAndRetryAsync(\n\
    \            3,\n            attempt => TimeSpan.FromMilliseconds(100*Math.Pow(2,\
    \ attempt))));\n```\n\nWraps http calls made in ProductCatalogClient in a Polly\

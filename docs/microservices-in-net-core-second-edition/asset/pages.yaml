- pgno: 178
  md: '# Failures and errors


    I''ll distinguish between the terms failure and error. A failure happens when
    something goes wrong in the system and the issue is caused by something outside
    the system. Some typical sources of failures are as follows:


    +   - Lost network packets cause communication to fail.

    +   - Lost connections cause communication to fail.

    +   - Hardware failures cause microservices to fail.


    An error happens when the system can''t serve its users properly. Some typical
    examples of errors are these:


    +   - A user sees an error page.

    +   - The system hangs and never responds to a user action.

    +   - The system gives back the wrong response to a user action.


    Errors can stem from failures. On the other hand, failures only become errors
    if the software can''t cope properly with failures. It follows that a perfect
    system would see failures but no errors. Unfortunately, our systems aren''t perfect,
    and we may as well accept that errors will occur but learn to cope with them quickly.


    # 7.1 Expect failures


    When working with any nontrivial software system, you must expect failures to
    occur. Hardware can fail. Software may fail due to, for instance, unforeseen usage
    or corrupt data. A distinguishing factor of a microservice system is that there''s
    a lot of communication between microservices. Figure 7.1 repeats the diagram from
    chapter 1 that shows the communication resulting from a user adding an item to
    a shopping cart. You see that just one user action results in quite a bit of communication—and
    a real system will likely have many concurrent users all performing many actions,
    and thus lots of communication. You must expect communication to fail from time
    to time. Communication between two microservices may not fail often, but looking
    at a microservice system as a whole, communication failures are likely to occur
    often due to the amount of communication.


    Because you have to expect that some of the communication in your microservice
    system will fail, you should design your microservices to be able to cope with
    those failures. As discussed in chapter 5, you can divide the collaborations between
    microservices into three categories: query-, command-, and event-based collaborations.
    When a communication fails, the impact depends on the type of collaboration and
    the way the microservices cope with it:


    +   - Query-based collaboration—When a query fails, the caller doesn''t get the
    information it needs. If the caller copes well with that, the system keeps working,
    but with degraded functionality. If the caller doesn''t cope well, the result
    could be an error.'

- pgno: 32
  md: 'and do so within the normal pace of their work. This characteristic is another
    constraint on the size of a microservice: if it grows too large, it will be expensive
    to replace; but if it’s kept small, rewriting it is realistic.


    Why would a team decide to rewrite a microservice? Perhaps the code is a big jumble
    and no longer easily maintainable. Perhaps it doesn’t perform well enough in production.
    Neither is a desirable situation, but changes in requirements over time can result
    in a codebase that it makes sense to replace rather than maintain. If the microservice
    is small enough to be rewritten within a reasonable time frame, it’s okay to end
    up with one of these situations from time to time. The team does the rewrite based
    on all the knowledge obtained from writing the existing implementation and keeping
    any new requirements in mind.


    Now that you know the characteristics of microservices, let’s look at their benefits,
    costs, and other considerations.


    # ## 1.3  Why microservices?


    Building a system from microservices that adhere to the characteristics outlined
    in the previous section has some appealing benefits: they’re malleable, scalable,
    and robust, and they allow a short lead time from start of implementation to deployment
    to production. This adds up to doing well on all of the four key metrics outlined
    in Accelerate.[6] These benefits are realized because, when done well, microservices


    +   -   Enable continuous delivery

    +   -   Allow for an efficient developer workflow because they’re highly maintainable

    +   -   Are robust by design

    +   -   Can scale up or down independently of each other


    Let’s talk more about these points.


    # ### 1.3.1  Enabling continuous delivery


    The microservices architectural style takes continuous delivery into account.
    It does so by focusing on services that


    +   -   Can be developed and modified quickly

    +   -   Can be comprehensively tested by automated tests

    +   -   Can be deployed independently

    +   -   Can be operated efficiently


    These properties enable continuous delivery, but this doesn’t mean continuous
    delivery follows from adopting a microservices architecture. The relationship
    is more complex: practicing continuous delivery becomes easier with microservices
    than it typically is with more traditional SOA. On the other hand, fully adopting
    microservices is possible only if you’re able to deploy services efficiently and
    reliably. Continuous delivery and microservices complement each other.


    6  Nicole Forsgren, Gene Kim, and Jez Humble. *Accelerate*. IT Revolution Press:
    2018.'

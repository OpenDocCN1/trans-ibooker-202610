- pgno: 174
  md: "# Listing 6.9 Calling the product catalog microservice\n\n```\nprivate async\
    \ Task<HttpResponseMessage>\n    RequestProductFromProductCatalog(int[] productCatalogIds)\n\
    {\n    var productsResource = string.Format(getProductPathTemplate,\n        string.Join(\"\
    ,\", productCatalogIds));\n    return await\n        this.client.GetAsync(productsResource);\n\
    }\n```\n\nWith this code, an HTTP request is made every time the shopping cart\
    \ needs product information, regardless of any cache headers. This is inefficient\
    \ in cases where the shopping cart needs information about the same products several\
    \ times within 24 hours, because that’s the max-age value set in the responses\
    \ from the product catalog microservice. Such cases will occur every time a user\
    \ adds an item to their shopping cart that another user has added to theirs within\
    \ the preceding 24 hours. That’s likely to happen often.\n\nLet’s extend the code\
    \ making the call to the /products endpoint in product catalog to take cache headers\
    \ into account. Add a dependency to ProductCatalogClient on a cache that implements\
    \ an ICache interface:\n\n```\nprivate readonly HttpClient client;\nprivate readonly\
    \ ICache cache;\nprivate static string productCatalogueBaseUrl = @\"https://git.io/JeHiE\"\
    ;\nprivate static string getProductPathTemplate = \"?productIds=[{0}]\">\n\npublic\
    \ ProductCatalogClient(HttpClient client, ICache cache)\n{\n    client.BaseAddress\
    \ = new Uri(productCatalogueBaseUrl);\n    client.DefaultRequestHeaders.Accept.Add(\n\
    \        new MediaTypeWithQualityHeaderValue(\"application/json\"));\n    this.client\
    \ = client;\n    this.cache = cache;\n}\n```\n\nAs you’ll recall, ASP.NET handles\
    \ dependency injection for you, so as long as there’s an implementation of the\
    \ ICache interface registered in the IServiceCollection, ASP.NET will inject it.\
    \ Here, I’ll only show the interface, but in the code download, you can find a\
    \ simple static cache implementing the interface. The interface is straightforward\
    \ and has two methods:\n\n```\npublic interface ICache\n{\n    void Add(string\
    \ key, object value, TimeSpan ttl);\n    object Get(string key);\n}\n\nttl means\
    \ time to live.\n```\n\nYou’ll use the cache variable on ProductCatalogClient\
    \ to check whether there’s a valid object in the cache before making an HTTP request."

  md: "# Polly\n\nPolly is a convenient library for creating and using error-handling\
    \ strategies. Creating a strategy with Polly is done in a declarative way via\
    \ a fluent API. Once created, a strategy can be applied to any Func or Action,\
    \ which essentially means you can apply the strategy to any code you want. Furthermore\
    \ the HttpClient class integrates with Polly to make applying error-handling strategies\
    \ to HTTP requests even easier.\n\nThe three basic steps to using Polly are as\
    \ follows:\n\n+   - Decide which exceptions to handle, such as HttpException.\n\
    +   - Decide which policy to use, such as a retry policy.\n+   - Apply the policy\
    \ to a function.\n\nThe entry point to working with Polly is the Policy class:\n\
    \n```\nvar retryStrategy =\n    Policy\n        .Handle<HttpException>()\n   \
    \     .Retry();\n\nretryStrategy.Execute(() => DoHttpRequest());\n\nStep 1: Decide\
    \ which exceptions to handle.\nStep 2: Decide which policy to use.\nStep 3: Use\
    \ the strategy to wrap a function call.\n```\n\nPolly comes with a number of built-in\
    \ policies, including variations of retry strategies and various circuit breaker\
    \ strategies. Furthermore, all strategies come in async as well as sync flavors.\n\
    \nWe will leverage Polly and the integration with HttpClient to easily implement\
    \ solid retry and circuit breaker strategies.\n\nThe API Gateway microservice\
    \ consists of the components shown in figure 7.11. In the next two sections, we'll\
    \ zoom in on LoyaltyProgramClient.\n\n![](img/608267d7803dc57a1a896ad121f37868_190_0.png)\n\
    \nFigure 7.11 The API Gateway microservice consists of the same standard set of\
    \ components you've seen several times already."

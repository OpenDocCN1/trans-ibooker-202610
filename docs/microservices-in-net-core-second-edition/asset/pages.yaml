  img_proc: true
- pgno: 29
  md: 'To be able to deploy a single microservice while the rest of the system continues
    to function, the build process should be set up with the following in mind:


    +   - Each microservice should be built into separate artifacts (e.g., separate
    Docker containers).

    +   - The deployment process should also be set up to support deploying microservices
    individually while other microservices continue running. For instance, you might
    use a rolling deployment process where the microservice is deployed to one server
    at a time in order to reduce downtime. Kubernetes—as well as other orchestration
    technologies—supports this and other useful deployment patterns.


    The fact that you want to deploy microservices individually affects the way they
    interact. Changes to a microservice’s interface usually must be backward compatible
    so that other existing microservices can continue to collaborate with the new
    version the same way they did with the old. Furthermore, the way microservices
    interact must be robust in the sense that each must expect other services to fail
    once in a while and continue working as best it can. One microservice failing—for
    instance, due to downtime during deployment—must not result in other microservices
    failing, only in reduced functionality or slightly longer processing time.


    > **NOTE**  Microservice collaboration and robustness will be covered in chapters
    4, 5, and 7.


    # CONSISTS OF ONE OR MORE PROCESSES


    A microservice must run in a separate process, or in separate processes, if it’s
    to remain as independent as possible of other microservices in the same system.
    The same is true if a microservice is to remain individually deployable. This
    can be summarized in two points:


    +   - Each microservice must run in separate processes from other microservices.

    +   - Each microservice can have more than one process.


    Consider a shopping cart microservice again. If it ran in the same process as
    a product catalog microservice, as shown in figure 1.3, the shopping cart code
    might cause a side


    ![](img/608267d7803dc57a1a896ad121f37868_29_0.png)


    **Figure 1.3**  Running more than one microservice within a process leads to high
    coupling between the two; they cannot be deployed individually, and one might
    cause downtime in the other.'

- pgno: 138
  md: '# 5.2.5 Implementing an event-based collaboration


    Now that you know how to implement command- and query-based collaborations between
    microservices, it’s time to turn our attention to the event-based collaboration.
    Figure 5.11 repeats the collaborations that the loyalty program microservice is
    involved in. The loyalty program subscribes to events from special offers, and
    it uses the events to decide when to notify registered users about new special
    offers.


    ![](img/608267d7803dc57a1a896ad121f37868_138_0.png)


    Figure 5.11 The event-based collaboration in the loyalty program microservice
    is the subscription to the event feed in the special offers microservice.


    We’ll first look at how special offers exposes its events in a feed. Then, we’ll
    return to the loyalty program and add a second process to that service, which
    will be responsible for subscribing to and handling events.


    # IMPLEMENTING AN EVENT FEED


    You saw a simple event feed in chapter 2. The special offers microservice implements
    its event feed the same way: it exposes an endpoint—"/events"—that returns a list
    of sequentially numbered events. The endpoint can take two query parameters—start
    and end—that specify a range of events. For example, a request to the event feed
    can look like this:


    ```

    GET /events?start=10&end=110 HTTP/1.1


    Host: localhost:5002

    Accept: application/json

    ```


    The response to this request might be the following, except that I’ve cut off
    the response after five events:


    ```

    HTTP/1.1 200 OK

    Content-Type: application/json; charset=utf-8

    ```'

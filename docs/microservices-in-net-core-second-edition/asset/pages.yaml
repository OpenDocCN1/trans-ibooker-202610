    \ failed calls is to retry the call a couple of times and then give up and fail\
    \ to add any items to the shopping cart. For this chapter, you’ll implement a\
    \ simple retry policy for handling failing requests. You’ll use the Polly library\
    \ and the Microsoft.Extensions.Http.Polly extension to Polly, both of which you’ll\

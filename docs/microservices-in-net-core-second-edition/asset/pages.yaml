  md: 'None of these components address the cross-cutting concerns such as monitoring,
    logging, standardized ways of handling database connections, security, and so
    on. Furthermore, none of these components are good candidates for places to implement
    those cross-cutting concerns. Why? Because all the components in figure 11.1 implement
    things specific to the shopping cart microservice. In contrast, cross-cutting
    concerns aren’t specific to any one microservice. Therefore, we need to implement
    them in components separate from those in figure 11.1. Looking at the shopping
    cart from a different angle, in figure 11.2, you see that it gets HTTP requests
    through a web server, handles them using its various components, and returns responses
    to the web server, which then sends them back to the caller.


    ![](img/608267d7803dc57a1a896ad121f37868_266_0.png)


    Figure 11.2 The shopping cart microservice takes in HTTP requests through a web
    server.


    As I just mentioned, we want to keep the code for cross-cutting concerns separated
    from the components in figure 11.1. Furthermore, cross-cutting concerns apply
    to the microservice as a whole. This means a good place for the code that handles
    cross-cutting concerns is between the web server and the endpoint handlers in
    our MVC controller (see figure 11.3).


    The pieces of code between the web server and the endpoint handlers form a pipeline:
    every request flows through each piece in turn before reaching the endpoint handler
    in the MVC controller. Likewise, the response from the endpoint handler flows
    back through the same pipeline before reaching the web server, which sends the
    response back to the caller. In this chapter, you’ll use ASP.NET middleware to
    implement such a pipeline; each piece of the pipeline is called middleware. As
    you have seen'

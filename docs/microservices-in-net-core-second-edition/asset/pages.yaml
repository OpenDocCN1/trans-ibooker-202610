  md: "You are likely to identify more cross-cutting concerns that make sense to implement\
    \ in the platform while you develop your microservice system. Some of these can\
    \ likely fit nicely in the middleware pipeline in ASP.NET, which is the topic\
    \ of the next section.\n\n# 11.5 The ASP.NET pipeline\n\nWe touched very briefly\
    \ on middleware in chapter 1, but now it’s time for a closer look. ASP.NET allows\
    \ us to put pieces of middleware that are executed for every request. Each request\
    \ flows through each piece of middleware in turn. Together the pieces of middleware\
    \ form a pipeline that the request flows through.\n\nThe set up in figure 11.6\
    \ is a pipeline with one piece of middleware. ASP.NET defines the interface used\
    \ to communicate between each part of the pipeline. This is a uniform interface\
    \ that all parts of the pipeline implement: each piece of middleware implements\
    \ the interface. By having one uniform interface, you can compose a pipeline as\
    \ you like. You can put more middleware into it, you can take pieces out, or you\
    \ can swap them around. Because they all use the same interface, they can be rearranged\
    \ as needed.\n\n![](img/608267d7803dc57a1a896ad121f37868_276_0.png)\n\nFigure\
    \ 11.6 A pipeline is built from middleware that communicates through a uniform\
    \ standard interface.\n\nWhen the request and the response pass through the middleware,\
    \ the middleware can read them and even change them. The interface used between\
    \ the pieces of middleware is the RequestDelegate defined by ASP.NET:\n\n```\n\
    public delegate Task RequestDelegate(HttpContext context);\n```\n\nThis delegate\
    \ allows middleware to inspect and change the HttpContext and—as long as the middleware\
    \ knows the next piece of middleware—pass it on to the next piece of middleware\
    \ in the pipeline, just like figures 11.3 and 11.6 illustrate.\n\nThe RequestDelegate\
    \ is a delegate type we can choose to implement with a lambda function, which\
    \ is a lightweight way of implementing middleware. There’s one slight complication,\
    \ though: the middleware is supposed to be part of a pipeline of middleware, so\
    \ it needs to know the next piece of middleware in the pipeline. We solve that\
    \ with a small layer of indirection: we create a lambda that takes the next piece\
    \ of middleware and returns a lambda that implements RequestDelegate. Let’s look\
    \ at that in code:\n\n```\nnext =>\n  ctx =>\n  {\n```\n\nThe next piece of middleware\n\
    \nThe inner lambda is the middleware."

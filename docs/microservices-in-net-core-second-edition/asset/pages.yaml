- pgno: 105
  md: 'Let’s assume that you aren’t in a position to make changes to the ERP system,
    so the integration must be implemented using whatever interface the ERP system
    has. It might use a SOAP web service to fetch product information, or it might
    export all the product information to a proprietary file format. In either case,
    the integration must happen on the ERP system’s terms. Depending on the interface
    the ERP system exposes, this may be a smaller or larger task. In any case, it’s
    a task primarily concerned with the technicalities of integrating with some other
    system, and it has the potential to be at least somewhat complex. The purpose
    of this integration is to support the product catalog microservice.


    We’ll take the integration out of the product catalog microservice and implement
    it in a separate ERP integration microservice that’s responsible solely for that
    one integration, as illustrated in figure 4.7. We’ll do this for two reasons:


    +   - By moving the technical complexities of the integration to a separate microservice,
    we keep the scope of the product catalog microservice narrow and focused.

    +   - By using a separate microservice to deal with how the ERP data is formatted
    and organized, we keep the ERP system’s view of what a product is separate from
    the POS system. Remember that in different parts of a large domain, there are
    different views of what terms mean. It’s unlikely that the product catalog microservice
    and the ERP system agree on how the product entity is modeled. A translation between
    the two views is needed and is best done by the new microservice. In domain-driven
    design terms, the new microservice acts as an *anticorruption layer*.


    > **NOTE** The anticorruption layer is a concept borrowed from domain-driven design.
    It can be used when two systems interact: it protects the domain model in one
    system from being polluted with language or concepts from the model in the other
    system.


    ![](img/608267d7803dc57a1a896ad121f37868_105_0.png)


    **Figure 4.7** The ERP integration microservice supports the product catalog microservice
    by handling the integration with the ERP system. It translates between the way
    the ERP system exposes product data and the way the product catalog microservice
    consumes it.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'An added benefit of placing the integration in a separate microservice is that
    it’s a good place to address any reliability issues related to the integration.
    If the ERP system is unreliable, the place to handle that is in the ERP integration
    microservice. If the ERP system is slow, the ERP integration microservice can
    deal with that. Over time, you can tweak the policies used in the ERP integration
    microservice to address any reliability issues with the ERP system without touching
    the product catalog microservice at all. This integration with the ERP system
    is an example of a supporting technical capability, and the ERP integration microservice
    is an example of a microservice implementing that capability.


    # SENDING NOTIFICATIONS TO CUSTOMERS


    Now let’s consider extending the POS system with the ability to send notifications
    about new special offers to registered customers via email, SMS, or push notification
    to a mobile app. We can put this capability into one or more separate microservices.


    At the moment, the POS system doesn’t know who the customers are. To drive better
    customer engagement and customer loyalty, the company decides to start a small
    loyalty program where customers can sign up to be notified about special offers.
    The customer loyalty program is a new business capability and will be the responsibility
    of a new loyalty program microservice. Figure 4.8 shows this microservice, which
    is responsible for notifying registered customers every time a new special offer
    is available to them.


    ![](img/608267d7803dc57a1a896ad121f37868_106_0.png)


    Figure 4.8 The loyalty program microservice subscribes to events from the special
    offers microservice and notifies registered customers when new offers are available.


    As part of the registration process, customers can choose to be notified by email,
    SMS, or, if they have the company’s mobile app, push notification. This introduces
    some complexity in the loyalty program microservice in that it must not only choose
    which type of notification to use, but also deal with how each one works. As a
    first step, we’ll introduce a supporting technical microservice for each notification
    type. This is shown in figure 4.9.'

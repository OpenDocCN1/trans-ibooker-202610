    GET /events?start=100&end=200 HTTP/1.1\nHost: shoppingcart.my.company.com\nAccept:\
    \ application/json\n```\n\nPlace the implementation of this /events endpoint,\
    \ as shown in the following listing, in a new controller inside the EventFeed\
    \ folder. The endpoint takes an optional starting point and an optional ending\
    \ point, allowing other microservices to request ranges of events.\n\n# Listing\
    \ 2.17 Exposing events to other microservices\n\n```\nnamespace ShoppingCart.EventFeed\n\
    {\n    using System.Linq;\n    using Microsoft.AspNetCore.Mvc;\n\n    [Route(\"\
    /events\")]\n    public class EventFeedController : Controller\n    {\n      \
    \  private readonly IEventStore eventStore;\n\n        public EventFeedController(IEventStore\
    \ eventStore) =>\n            this.eventStore = eventStore;\n\n        [HttpGet(\"\
    \")]\n        public Event[] Get(\n```"

  md: "The loyalty program is deployed to Kubernetes as two containers: a loyalty\
    \ program API container and a loyalty program event consumer container. The loyalty\
    \ program event consumer is responsible for fetching and handling events from\
    \ the special offers microservice. Therefore only the loyalty program event consumer\
    \ container needs to be allowed to make requests to the special offers microservice.\n\
    \nWe will use a network policy in Kubernetes to limit access to special offers\
    \ so only the loyalty program event consumer is allowed to call endpoints in special\
    \ offers. Neither the loyalty program API or any other microservice will be allowed\
    \ to call endpoints in special offers. If there are other microservices outside\
    \ the ones depicted in figure 10.1 that need access to special offers, the network\
    \ policy can be extended to allow such access selectively.\n\n# Enabling network\
    \ policies in Kubernetes\n\nNetwork policies will unfortunately not work in the\
    \ Kubernetes cluster we created in chapter 3 because the cluster needs a *network\
    \ controller* that supports network policies. A network controller cannot be installed\
    \ after the cluster is created, so we will have to create a new one with a network\
    \ controller. In AKS, we can use a network plugin called *azure*, which will set\
    \ up a network controller that supports network policies. In order to do so, we\
    \ also need a slightly more involved network setup for the AKS cluster. The code\
    \ download for this chapter contains a PowerShell script that creates an AKS cluster\
    \ with a network controller and network policies enabled.\n\nDocker Desktop does\
    \ not support network controllers, so we cannot use network policies in it. In\
    \ addition, network policies will have no effect in a Kubernetes cluster without\
    \ a network controller; they will not produce any error, but they will not limit\
    \ the traffic, either.\n\nBack in chapter 5, we deployed the special offers microservice\
    \ to Kubernetes using this manifest file.\n\n```\nkind: Deployment\napiVersion:\
    \ apps/v1\nmetadata:\n    name: special-offers\nspec:\n    replicas: 1\n    selector:\n\
    \        matchLabels:\n            app: special-offers\n    template:\n      \
    \  metadata:\n            labels:\n                app: special-offers\n     \
    \   spec:\n```"

    Now that we’ve taken a high-level look at a concrete example of how a microservices
    system can handle a user request, it’s time to take a brief look at a .NET-based
    technology stack for microservices.


    # 1.8 A .NET microservices technology stack


    It’s time to say hello to the technologies used most in this book: ASP.NET, ASP.NET
    MVC, and Kubernetes.


    # 1.8.1 ASP.NET and MVC


    ASP.NET is Microsoft’s web platform that has a number of benefits relevant to
    the microservices we will create throughout this book:


    +   - Cross-platform—ASP.NET is based on .NET 5, which works across Linux, Windows,
    and more. This allows for some nice flexibility when it comes to deciding where
    to run our microservices. We will be running them in Linux container on a Kubernetes
    cluster, but our microservice could also run on a different container orchestrator,
    in Windows containers, or on Windows or Linux servers.

    +   - Fast—ASP.NET is fast, and so is the underlying .NET 5 platform.⁸ This gives
    a good foundation to build fast microservices.

    +   - Microservices are first-class citizens—One of the primary targets for ASP.NET
    is microservices, which means that the platform already implements some of the
    important plumbing that we would otherwise have to implement ourselves, such as
    request logging and monitoring support.

    +   - The middleware pipeline—Middleware is a lightweight, composable, and flexible
    way to build a pipeline for handling incoming HTTP requests. Our microservices
    will have ASP.NET MVC at the end of their middleware pipelines.

    +   - Testable—We will be taking advantage of the TestHost test helper for ASP.NET
    to test our microservices thoroughly in a style that lends itself to outside-in
    test-driven development.


    On top of the ASP.NET platform we will use Microsoft’s ASP.NET MVC⁹ web framework,
    which provides us with an extra level of convenience when it comes to implementing
    handlers for HTTP endpoints.



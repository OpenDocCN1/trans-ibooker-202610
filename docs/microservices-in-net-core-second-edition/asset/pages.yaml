- pgno: 31
  md: 'microservices, such as a shopping cart, can only access product information
    through the interface to the product catalog and never directly from the product
    catalog data store.


    The fact that each microservice owns its own data store makes it possible to use
    different database technologies for different microservices depending on the needs
    of each microservice. The product catalog microservice, for example, might use
    an SQL server to store product information; the shopping cart microservice might
    store each user’s shopping cart in Redis; and the recommendations microservice
    might use an Elasticsearch index to provide recommendations. The database technology
    chosen for a microservice is part of the implementation and is hidden from the
    view of other microservices.


    This approach allows each microservice to use whichever database is best suited
    for the job, which can also lead to benefits in terms of development time, performance,
    and scalability. The obvious downside is the need to administer, maintain, and
    work with more than one database, if that’s how you choose to architect your system.
    Databases tend to be complicated pieces of technology, and learning to use and
    run one reliably in production isn’t free. When choosing a database for a microservice,
    you need to consider this tradeoff. But one benefit of a microservice owning its
    own data store is that you can swap out one database for another later.


    > NOTE Data ownership, access, and storage will be covered in chapter 5.


    # MAINTAINED BY A SMALL TEAM


    So far, I haven’t talked much about the size of a microservice, even though the
    “micro” part of the term indicates that microservices are small. I don’t think
    it makes sense to discuss the number of lines of code that a microservice should
    have, or the number of requirements, use cases, or function points it should implement.
    All that depends on the complexity of the capability provided by the microservice.


    What does make sense, though, is considering the amount of work involved in maintaining
    a microservice. The following rule of thumb can guide you regarding the size of
    microservices: a small team of people—five, perhaps—should be able to maintain
    a few handfuls of microservices. Here, “maintaining a microservice” means dealing
    with all aspects of keeping it healthy and fit for purpose: developing new functionality,
    factoring out new microservices from ones that have grown too big, running it
    in production, monitoring it, testing it, fixing bugs, and everything else required.
    Depending on the volume of change in the microservices “a few handfuls” can mean
    anything from 10 to 30 microservices, or even more when the system, the tooling,
    and the automation is mature and effective. A team should usually own a cohesive
    set of business and technical capabilities leading to it owning the microservices
    that implement these capabilities.


    # REPLACEABLE


    For a microservice to be replaceable, it must be able to be rewritten from scratch
    within a reasonable time frame. In other words, the team maintaining the microservice
    should be able to replace the current implementation with a completely new implementation'

- pgno: 329
  md: "# MICROSOFT .NET/MICROSERVICES\n\n# Microservices in .NET Second Edition\n\n\
    Christian Horsdal Gammelgaard\n\nMicroservice architectures connect independent\
    \ components that must work together as a system. Integrating new technologies\
    \ like Docker and Kubernetes with Microsoft’s familiar ASP.NET framework and Azure\
    \ cloud platform enables .NET developers to create and manage microservices efficiently.\n\
    \n**Microservices in .NET, Second Edition** teaches you to build and deploy microservices\
    \ using ASP.NET and Azure services. It lays out microservice architecture simply,\
    \ and then guides you through several real-world projects, such as building an\
    \ ecommerce shopping cart. In this fully revised edition, you’ll learn about scoping\
    \ microservices, deploying to Kubernetes, and operations concerns like monitoring,\
    \ logging, and security.\n\n# What’s Inside\n\n+   - Optimize microservices for\
    \ continuous delivery\n+   - Design event-based collaboration between microservices\n\
    +   - Deploy microservices to Kubernetes\n+   - Set up Kubernetes in Azure\n\n\
    For C# developers. No experience with microservices required.\n\n**Christian Horsdal\
    \ Gammelgaard** is an independent consultant with more than 20 years of experience\
    \ building projects from large scale microservice systems to tiny embedded systems.\n\
    \n> > “A clear presentation of the latest best practices. A highly recommended\
    \ read.”\n> > —David Paccoud, Bioclinica\n> \n> > “Recommended for all developers\
    \ and software architects looking to jump into the microservices world.”\n> >\
    \ —Emanuele Origgi, Datas\n> \n> > “This book is the best guide to learn about\
    \ microservices and how to implement on .NET framework.”\n> > —Jeff Smith, Agilify\
    \ Automation\n> \n> > “Well-written, concise, and comprehensive. I could not put\
    \ it down and would definitely recommend it.”\n> > —Tanya Wilke, Sanlam\n\n![](img/608267d7803dc57a1a896ad121f37868_329_0.png)\n\
    \nRegister this print book to get free access to all ebook formats.\nVisit https://www.manning.com/freebook\n\
    \n![](img/608267d7803dc57a1a896ad121f37868_329_1.png)\n\n$59.99 / Can $79.99 \
    \ [INCLUDING eBOOK]\n\n![](img/608267d7803dc57a1a896ad121f37868_329_2.png)"

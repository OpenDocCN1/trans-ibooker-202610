    # 11.3 Creating a reusable microservice platform


    Chapters 9 and 10 explained that microservices must be well-behaved citizens in
    the production environment. They need to provide insight into their health through
    logging, they should allowing monitoring, and they need to follow the security
    standards you decide on for the system. Thus, creating a new microservice involves
    more than just creating a new, empty ASP.NET project.


    That’s why I recommend building a standard microservice platform to use across
    your ASP.NET-based microservices in a microservices system. As shown in figure
    11.4,'

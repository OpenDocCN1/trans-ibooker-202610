  md: "Dapper is a simple tool that provides some convenient extension methods on\
    \ IDbConnection to make working with SQL in C# easier. It also provides some basic\
    \ mapping capabilities. For instance, when the rows returned by a SQL query have\
    \ column names equal to the property names in a class, Dapper can automatically\
    \ map to instances of the class.\n\nDapper doesn’t try to hide the fact that you’re\
    \ working with SQL, so you see SQL strings in the code. This may feel like a throwback\
    \ to the earliest days of .NET. I find that as long as I’m working with a simple\
    \ database schema—as I usually am in microservices—the SQL strings in C# code\
    \ aren’t a problem.\n\nWriting a shopping cart to the database is also done through\
    \ Dapper. The implementation is the following method in ShoppingCartStore.\n\n\
    # Listing 6.2  Writing shopping carts with Dapper\n\n```\nprivate const string\
    \ insertShoppingCartSql =\n@\"insert into ShoppingCart (UserId) OUTPUT inserted.ID\
    \ VALUES (@UserId)\";\n\nprivate const string deleteAllForShoppingCartSql =\n\
    @\"delete item from ShoppingCartItem item\ninner join ShoppingCart cart on item.ShoppingCartId\
    \ = cart.ID\nand cart.UserId=@UserId\";\n\nprivate const string addAllForShoppingCartSql\
    \ =\n@\"insert into ShoppingCartItem\n(ShoppingCartId, ProductCatalogId, ProductName,\n\
    ProductDescription, Amount, Currency)\nvalues\n(@ShoppingCartId, @ProductCatalogId,\
    \ @ProductName,\n@ProductDescription, @Amount, @Currency)\";\n\npublic async Task\
    \ Save(ShoppingCart shoppingCart)\n{\n    await using var conn = new SqlConnection(this.connectionString);\n\
    \    await conn.OpenAsync();\n    await using (var tx = conn.BeginTransaction())\n\
    \    {\n        var shoppingCartId =\n            shoppingCart.Id ??\n       \
    \         await conn.QuerySingleAsync<int>(\n                    insertShoppingCartSql,\n\
    \                    new { shoppingCart.UserId }, tx);\n\n        await conn.ExecuteAsync(\n\
    \            deleteAllForShoppingCartSql,\n            new { UserId = shoppingCart.UserId\
    \ },\n            tx);\n        await conn.ExecuteAsync(\n            addAllForShoppingCartSql,\n\
    \            shoppingCart.Items.Select(x =>\n                new\n           \
    \     {\n                    shoppingCartId,\n```\n\n> Create a row in the ShoppingCart\
    \ table if the shopping cart does not already have an Id.\n\n> Deletes all pre-existing\
    \ shopping cart items\n\n> Adds the current shopping cart items"

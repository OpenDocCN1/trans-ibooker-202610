    EventStore stores every incoming event and keeps track of the order in which they\
    \ arrive. We’ll return to the subject of event stores in chapter 6, where we’ll\
    \ look more at implementing them.\n\n# A SIMPLE EVENT FEED\n\nOnce events are\
    \ stored, they’re ready to be published—in a sense, they *are* published. Even\
    \ though one microservice *subscribes* to events from another microservice, an\
    \ event feed works by having subscribers ask for new events periodically (e.g.,\
    \ once every 30 seconds). Because subscribers are responsible for asking for new\

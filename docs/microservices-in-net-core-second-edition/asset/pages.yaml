    \ The advantage of using EventStoreDB over storing events in SQL Server is that\
    \ its API is geared specifically toward storing events, reading events, and subscribing\
    \ to new events. EventStoreDB is an open source, mature, well-tested EventStoreDB\
    \ implementation that can scale and run stably under load. Furthermore, it comes\
    \ with some added features out of the box, such as a web interface for inspecting\
    \ events and Atom event feeds. SQL Server is, of course, also mature, well-tested,\
    \ scalable, and stable, but it isn’t specifically geared toward storing events.\n\
    \nYou’ll implement this version with the following steps. When you’re finished,\

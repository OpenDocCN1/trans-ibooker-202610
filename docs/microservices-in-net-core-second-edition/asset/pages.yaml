- pgno: 300
  md: 'To implement this UI, you''ll perform the following steps:


    +   1. Reuse the product catalog and shopping cart microservices from chapter
    5.

    +   2. Create an API Gateway.

    +   3. Create the product list from figure 12.9:

    +      - Create an endpoint in the API Gateway for fetching a page with the product
    list.

    +      - Make the new endpoint read the list of products from the product catalog.

    +      - Create a view with the list of products and return it from the new endpoint.

    +   4. Add the shopping cart from figure 12.9 to the web page:

    +      - Make the API Gateway get the current state of the shopping cart from
    the shopping cart.

    +      - Add the shopping cart to the web page.

    +   5. Create an endpoint in the API Gateway for adding products to the shopping
    cart:

    +      - Add a POST endpoint for adding products to the shopping cart in the API
    Gateway.

    +      - Call the shopping cart from the API Gateway to add the new product.

    +      - Update the view the user sees to reflect that a product was added to
    the shopping cart.

    +   6. Create an endpoint in the API Gateway to remove products from the shopping
    cart.


    You’ll use the product catalog microservice and the shopping cart microservice
    from chapter 5 just as they are in the new API Gateway. You could, at this point,
    add the microservice platform from chapter 11 to these microservices, but for
    the sake of brevity you’ll skip that step. The only thing you’ll do in these microservices
    is run them on different ports when you run them at the same time on your development
    machine. You specify these ports in command line.


    > NOTE To keep the scope of this example tenable, I’ve cut some corners. Most
    notably, you won’t implement a login system. Instead, you’ll trust the user ID
    in the URL. Never do that in production. In chapter 10, we discussed how to deal
    with security in general, including authenticating end users, and how you should
    obtain the user ID.


    # 12.3.1 Creating an API Gateway


    Create a new project for the API Gateway the same way you’ve created projects
    many times before. Call the new project ApiGateway. Then, add the microservice
    platform you developed in chapter 11 as a NuGet package to the new project. The
    project file should look like the following.'

- pgno: 207
  md: "```\npublic class TestController_should : IDisposable\n{\n    private readonly\
    \ IHost host;\n    private readonly HttpClient sut;\n\n    public class TestController\
    \ : ControllerBase\n    {\n        [HttpGet(\"/\")]\n        public OkResult Get()\
    \ => Ok();\n    }\n\n    public TestController_should()\n    {\n        this.host\
    \ = new HostBuilder()\n            .ConfigureWebHost(host =>\n            {\n\
    \                host.ConfigureServices(x =>\n                    x.AddControllersByType(typeof(TestController)))\n\
    \                .Configure(x =>\n                {\n                    x.UseRouting()\n\
    \                    .UseEndpoints(opt => opt.MapControllers())\n            \
    \        .UseTestServer()\n                })\n                .Start();\n   \
    \         });\n        this.sut = this.host.GetTestClient();\n    }\n\n    [Fact]\n\
    \    public async Task respond_ok_to_request_to_root()\n    {\n        var actual\
    \ = await this.sut.GetAsync(\"/\");\n        Assert.Equal(HttpStatusCode.OK, actual.StatusCode);\n\
    \    }\n\n    public void Dispose()\n    {\n        this.host?.Dispose();\n  \
    \      this.sut?.Dispose();\n    }\n}\n```\n\n![](img/608267d7803dc57a1a896ad121f37868_207_0.png)\n\
    \n![](img/608267d7803dc57a1a896ad121f37868_207_1.png)\n\n![](img/608267d7803dc57a1a896ad121f37868_207_2.png)\n\
    \n![](img/608267d7803dc57a1a896ad121f37868_207_3.png)\n\n![](img/608267d7803dc57a1a896ad121f37868_207_4.png)\n\
    \n![](img/608267d7803dc57a1a896ad121f37868_207_5.png)\n\n![](img/608267d7803dc57a1a896ad121f37868_207_6.png)\n\
    \nThere are a few things to notice about this test:\n\n+   - The test class, TestController_should,\
    \ is IDisposable. The xUnit runner understands IDisposable and calls the Dispose\
    \ method after running the Fact. In the dispose method, the host and sut are disposed,\
    \ which makes sure that everything is cleaned up. If the host is not disposed,\
    \ the test will hang until the test runner times out.\n+   - In the TestController_should\
    \ constructor we create a web host just like we do in the production code. This\
    \ is where we can configure everything around the endpoint under test. In this\
    \ test, we use a setup similar to that in the production code, except that we\
    \ use the test server, which ensures that requests are done in process."

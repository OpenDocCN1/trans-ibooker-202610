    \ which means the manifest becomes:\n\n```\nkind: Deployment\napiVersion: apps/v1\n\
    metadata:\n  name: shopping-cart\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n\
    \      app: shopping-cart\n  template:\n    metadata:\n      labels:\n       \
    \ app: shopping-cart\n    spec:\n      containers:\n        - name: shopping-cart\n\
    \          image: your_unique_registry_name.azurecr.io/shopping-cart:1.0.0\n \
    \         imagePullPolicy: IfNotPresent\n          ports:\n            - containerPort:\
    \ 80\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: shopping-cart\nspec:\n\
    \  type: LoadBalancer\n  ports:\n    - name: shopping-cart\n      port: 5000\n\
    \      targetPort: 80\n  selector:\n    app: shopping-cart\n```\n\n![](img/608267d7803dc57a1a896ad121f37868_91_0.png)\n\
    \nThe only change is the image name, which now refers to the image in our private\

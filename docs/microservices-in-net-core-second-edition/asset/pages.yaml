    \      targetPort: 80\n```\n\nThe service is no longer a load balancer.\n\n```\n\
    ---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name:\
    \ special-offers-network-policy\nspec:\n  podSelector:\n    matchLabels:\n   \
    \   app: special-offers-pod\n  policyTypes:\n  - Ingress\n  ingress:\n    - from:\n\
    \        - podSelector:\n            matchLabels:\n              app: loyalty-program-consumer\n\
    ```\n\nA network policy\n\nThe network policy applies to the special offers pod.\n\
    \nThe policy controls incoming traffic to the special offers pod.\n\nAllow only\
    \ the loyalty program consumer.\n\nThis will ensure that only the loyalty program\
    \ event consumer can make calls to special offers. The network policy works by\
    \ defining which pods it applies to—the special offers pod—and by defining which\
    \ pod can call containers in pods protected by the policy. The policies allow\
    \ pods with the label app: loyalty-program-consumer to call into special offers,\
    \ but no other pods. The only pod with that label is the loyalty program event\
    \ consumer.\n\nTo confirm that the loyalty program event consumer is indeed able\
    \ to make calls to special offers we can inspect the logs from the event consumer\
    \ using this command\n\n```\nkubectl logs -lapp=loyalty-program-consumer --all-containers\n\

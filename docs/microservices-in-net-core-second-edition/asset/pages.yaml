  md: '+   - To write service-level tests:

    +     - Write mocked endpoints for the collaborators of the microservice under
    test as MVC controller and use a ASP.NET web host to host these in the test process.

    +     - Start up the API of the microservice under test in a test host. Use ASP.NET’s
    configuration APIs to configure the microservice under test to call the mocked
    collaborators.

    +     - Write scenarios that interact with the microservice under test via requests
    going through the test host.

    +     - Simulate the event consumer Cron schedule by calling the event consumer
    directly when needed in the tests.

    +     - Make assertions both on the response from the microservice under test
    and on the requests it makes to its collaborators.

    +   - You can use the xUnit test framework to write and run your automated tests.

    +   - xUnit can be run with dotnet or in your IDE of choice.'

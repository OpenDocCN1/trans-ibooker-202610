- pgno: 180
  md: '# 7.1.1 Keeping good logs


    Once you accept that failures are bound to happen and that some of them may result
    not just in a degraded end user experience but also in errors, you must make sure
    you''re able to understand what went wrong when an error occurs. That means you
    need good logs that allow you to trace what happened in the system and led to
    an error situation. “What happened” will often span several microservices, which
    is why you should introduce a central log microservice, as shown in figure 7.2;
    all other


    ![](img/608267d7803dc57a1a896ad121f37868_180_0.png)


    Figure 7.2 A central log microservice receives log messages from all other microservices
    and stores them in a database or a search engine. The log data is accessible through
    a web interface. The dotted arrows show microservices sending log messages to
    the central log microservice.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'microservices send log messages to it, and you can inspect and search the logs
    when you need to.


    The log microservice is a central component that all other microservices use.
    You need to make certain that a failure in a log doesn’t bring down the whole
    system by causing all other microservice to fail if they can’t log messages. Therefore,
    sending log messages to a log must be decoupled, so the microservice sending the
    message shouldn’t wait for a response. That decoupling can be achieved in several
    different ways depending on the choices you make for your productions environment.
    When using containers, the standard way to decouple from the log microservices
    is for the other microservices to simply log to standard out and let a *log shipping*
    tool collect those logs and send them to the log microservice.


    # Using an off-the-shelf solution for the log microservice


    A central log microservice doesn’t implement a business capability of a particular
    system. It’s an implementation of generic technical capability. In other words,
    the requirements for a log microservice in system A aren’t that different from
    the requirements for a log microservice in system B. Therefore, I recommend using
    an off-the-shelf solution to implement your log microservice. Products in this
    category include ELK, Datadog, Splunk, Honeycomb, and many more. These are well-established,
    well-documented products, and I won’t dive into how to set them up here, but they
    all support ingesting logs from microservices with low coupling. In chapter 10,
    I’ll assume that you have a log microservice based on one of these products, and
    I’ll show you how to send useful log messages to it.


    Later in this chapter, we’ll look at logging unhandled errors by adding handlers
    to MVCs pipeline.


    # 7.1.2 Using trace IDs


    To find all log messages related to a particular action in the system, you can
    use *trace IDs*. A trace ID is an identifier attached, for example, to a request
    from an end user when it comes into the system. The trace ID is passed along from
    microservice to microservice in any communication that stems from that end user
    request. Any time one of the microservices sends a log message to the log microservice,
    the message should include the trace ID. The log microservice should allow searching
    for log messages by trace ID. In figure 7.2, the API Gateway would create and
    assign a trace ID to each incoming request, and the trace ID would then be passed
    with every microservice-to-microservice communication, including events and log
    messages. This is a well-established pattern and can be implemented based on an
    open standard like Open Telemetry (https://opentelemetry.io/), which has the benefit
    that several of the off-the-shelf logging products mentioned support and understand
    Open Telemetry.


    NOTE Chapter 9 discusses how to implement request logging and how to include trace
    IDs in communications and log messages.'

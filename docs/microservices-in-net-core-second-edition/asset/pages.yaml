  md: "# Listing 12.8 Configuring ASP.NET to find views in the same folders as controller\n\
    \n```\npublic void ConfigureServices(IServiceCollection services)\n{\n    services.AddBasicHealthChecks();\n\
    \    services.AddControllersWithViews();\n    services.Configure<RazorViewEngineOptions>(x\
    \ =>\n        x.ViewLocationFormats.Add(\"{1}/{0}.cshtml\"));\n}\n```\n\nConfigure\
    \ where ASP.NET looks for view files.\n\nThis configures ASP.NET to look for view\
    \ files named after actions in folders named after the controller. For instance,\
    \ the view returned by the ProductList action in the ProductListController should\
    \ be in ProductList/ProductList.cshtml, which is exactly where it is. With this\
    \ in place, the /productlist endpoint works and returns a product list view with\
    \ the three hardcoded products.\n\nThis code renders a product list, but the products\
    \ are hardcoded in the API Gateway. They should be fetched from the product catalog\
    \ microservice. To perform that, change the /productlist endpoint in the ProductListController\
    \ to make an HTTP request to the product catalog to get the list of products.\
    \ To do that, you will need an HttpClient, so first we will configure that in\
    \ the Startup. For now, we will assume that the product catalog runs on localhost\
    \ port 5001.\n\n# Listing 12.9 Configuring HttpClient for calling the product\
    \ catalog\n\n```\npublic void ConfigureServices(IServiceCollection services)\n\
    {\n    services.AddBasicHealthChecks();\n    services.AddControllersWithViews();\n\
    \    services.Configure<RazorViewEngineOptions>(x =>\n        x.ViewLocationFormats.Add(\"\
    {1}/{0}.cshtml\"));\n    services.AddHttpClient(\n        \"ProductCatalogClient\"\
    ,\n        client => client.BaseAddress = new Uri(\"https://localhost:5001\"))\n\
    \        .AddTransientHttpErrorPolicy(p =>\n            p.WaitAndRetryAsync(\n\
    \                3,\n                attempt => TimeSpan.FromMilliseconds(100\
    \ * Math.Pow(2, attempt))));\n}\n```\n\nPoint the HttpClient at the product catalog.\n\
    \nConfigure a retry strategy.\n\nNow we can turn to the ProductListController\
    \ again and use the HttpClient we just configured to get products from the product\
    \ catalog.\n\n# Listing 12.10 Finished endpoint implementation in the API Gateway\n\
    \n```\nnamespace ApiGateway.ProductList\n{\n    using System.Net.Http;\n    using\
    \ System.Net.Http.Json;\n    using System.Text.Json;\n    using System.Threading.Tasks;\n\
    ```"

- pgno: 208
  md: "During the configuration of the host, we use a custom extension method, `AddControllersByType`,\
    \ which I will show next. By using `AddControllersByType`, we make sure that the\
    \ host only has one controller: the `TestController`. Therefore, the test controls\
    \ quite accurately which endpoints are available through the host.\n\n# Naming\
    \ conventions\n\nMy tests follow these naming conventions:\n\n+   - My tests work\
    \ on an object called `sut` for *system under test*. In the previous test, `sut`\
    \ is a `HttpClient` object that I use to make a call to an endpoint.\n+   - I\
    \ name my test classes after the thing they test—`TestController` in this example\
    \ test—followed by `_should`.\n+   - I name the Fact method after the scenario\
    \ being tested and the expected result. I separate the words in Fact method names\
    \ with underscores and try to make sure they form a sentence when combined with\
    \ the name of the surrounding class. For instance, in this test, by concatenating\
    \ the class name and the Fact method name and replacing underscores with spaces\
    \ you get “TestController should respond okay to requests to root.”\n\nWhether\
    \ you like these conventions is a matter of taste. I happen to like them, but\
    \ they’re in no way essential to writing good tests.\n\nYou can run the previous\
    \ test with `dotnet test`; it will execute in memory and give you good coverage\
    \ because the call to `sut.GetAsync(\"/\")` executes the real ASP.NET pipeline,\
    \ including the implementation of the endpoint in `TestController`. The string\
    \ argument “/” is the relative URL to which the fake request is made. In section\
    \ 8.3.1, we’ll look at setting up a project for these unit tests and how to run\
    \ them with `dotnet test`.\n\nIn the `TestController_should` constructor, we have\
    \ used the custom extension method `AddControllersByType`, which works by overriding\
    \ how MVC decides which types are controllers. This is done by creating a custom\
    \ version of MVC’s `ControllerFeatureProvider` and replacing MVC’s default `ControllerFeatureProvider`\
    \ with the custom one. MVC uses the `ControllerFeatureProvider` to decide which\
    \ types are controllers, so by overriding it with a custom version we get to decide\
    \ which types MVC sees as controllers and therefore which endpoints are part of\
    \ the test. This is the implementation where the first part is the customer `ControllerFeatureProvider`\
    \ and the second is the extension method, as shown in the following listing.\n\
    \n```\nListing 8.2  Extension method to control which controllers are part of\
    \ the test\n\nnamespace LoyaltyProgramUnitTests\n{\n    using System;\n    using\
    \ System.Linq;\n```"

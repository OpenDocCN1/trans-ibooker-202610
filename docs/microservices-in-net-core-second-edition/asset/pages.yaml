- pgno: 159
  md: 'The choice of database technology (or technologies) for a microservice can
    be influenced by many factors, including these:


    +   - What shape is your data? Does it fit well into a relational model, a document
    model, or a key/value store, or is it a graph?

    +   - What are the write scenarios? How much data is written? Do the writes come
    in bursts, or are they evenly distributed over time?

    +   - What are the read scenarios? How much data is read at a time? How much is
    read altogether? Do the reads come in bursts?

    +   - How much data is written compared to how much is read?

    +   - Which databases do the team already know how to develop against and run
    in production?


    Asking yourself these questions—and finding the answers—will not only help you
    decide on a suitable database, but will also likely deepen your understanding
    of the nonfunctional qualities expected from the microservice. You’ll learn how
    reliable the microservice must be, how much load it must handle, what the load
    looks like, how much latency is acceptable, and so on.


    Gaining that deeper understanding is valuable, but note that I’m not recommending
    you undertake a major analysis of the pros and cons of different databases each
    time you create a new microservice. You should be able to get a new microservice
    going and deployed to production quickly. The goal isn’t to find a database technology
    that’s perfect for the job—you just want to find one that’s suitable given your
    answers to the previous questions. You may be faced with a situation in which
    a document base seems like a good choice and in which you’re confident that Couchbase,
    CosmosDB, and MongoDB would be well suited. In that case, choose one of them.
    It’s better to get the microservice to production with one of them quickly, and
    at a later stage, possibly replace the microservice with an implementation that
    uses the other, instead of delaying release of the first version of the microservice
    to production because you’re analyzing Couchbase, CosmosDB, and MongoDB in detail.


    # How many database technologies in the system?


    The decision about which database you should use in a microservice isn’t solely
    a matter of what fits well in that microservice. You need to take the broader
    landscape into consideration. In a microservice system, you’ll have many microservices
    and many data stores. It’s worth considering how many different database technologies
    you want to have in the system. There’s a tradeoff between standardizing a few
    database technologies and having a free-for-all.


    On the side of standardizing are goals like these:


    +   - Running the databases reliably in production and continuing to do so in
    the long run

    +   - Developers being able to get into and work effectively in the codebase of
    a microservice they haven’t touched before'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'Favoring a free-for-all have these types of goals:


    +   - Being able to choose the optimal database technology for each microservice
    in terms of maintainability, performance, security, reliability, and so on.

    +   - Keeping microservices replaceable. If new developers take over a microservice
    and don’t agree with the choice of database, they should be able to replace the
    database or even the microservice as a whole.


    How these goals are weighed against each other changes from organization to organization.
    It’s important to be aware that there are tradeoffs, but I will go as far as recommending
    some standardization within an organization.


    # 6.3 Implementing data storage in a microservice


    We’ve discussed where data should go in a microservice system, including which
    data a microservice should own and which it should mirror. It’s time to switch
    gears and look at the code required to store the data.


    I’ll focus on how a microservice can store the data it owns, including how to
    store the events it raises. I’ll first show you how to do this using SQL Server
    and the lightweight Dapper data access library. Then I’ll show you how to store
    events in a database specifically designed for storing events—the aptly named
    EventStoreDB.


    # New technologies used in this chapter


    In this chapter, you’ll begin using a couple of new technologies:


    +   - SQL Server—Microsoft’s SQL database. For purposes of this chapter many different
    databases would work fine. I am choosing SQL Server because I suspect it will
    be familiar to many readers.

    +   - Dapper (https://github.com/StackExchange/dapper-dot-net)—A lightweight object-relational
    mapper (ORM).

    +   - EventStoreDB (https://www.eventstore.com/eventstoredb)—A database product
    specifically designed to store events.


    # Dapper: A lightweight O/RM


    Dapper is a simple library for working with data in a SQL database from C#. It’s
    part of a family of libraries sometimes referred to as micro ORMs, which also
    includes Simple.Data and Massive. These libraries focus on being simple to use
    and fast, and they embrace SQL.


    Whereas a more traditional ORM writes all the SQL required to read data from and
    write it to the database, Dapper expects you to write your own SQL. I find this
    liberating when dealing with a database with a simple schema.


    In the spirit of choosing lightweight technologies for microservices, I choose
    Dapper over a full-fledged ORM like Entity Framework or NHibernate. Often the
    database for a microservice is simple, and in such cases, I find it easiest to
    add a thin layer—like Dapper—on top of it for a simpler solution overall. I could
    have chosen to use any of'
  merge: -1
  img_proc: true
- pgno: 161
  md: '**(continued)**


    the other micro ORMs, but I like Dapper. In this chapter, you’ll use Dapper to
    talk to SQL Server, but Dapper also works with other SQL databases like PostgreSQL,
    MySQL, or Azure SQL.


    # EventStoreDB: A dedicated event database


    EventStoreDB is an open source database server designed specifically for storing
    events. EventStoreDB stores events as JSON documents, but it differs from a document
    database by assuming that the JSON documents are part of a stream of events. Although
    EventStoreDB is a niche product because it’s so narrowly focused on storing events,
    it’s in widespread use and has proven itself in heavy-load production scenarios.


    In addition to storing events, EventStoreDB has facilities for reading and subscribing
    to events. For instance, EventStoreDB exposes its own event feeds—as ATOM feeds—that
    clients can subscribe to. If you don’t mind depending on EventStoreDB, using its
    ATOM event feed to expose events to other microservices can be a viable alternative
    to the way you’ll implement event feeds in this book.


    EventStoreDB works by exposing an HTTP API for storing, reading, and subscribing
    to events. There are a number of EventStoreDB client libraries in various languages—including
    C#, F#, Java, Scala, Erlang, Haskell, and JavaScript—that make it easier to work
    with the database.


    # 6.3.1  Preparing a development setup


    Before we dive into implementation, we will need to run the SQL Server on localhost,
    which we will do in a Docker container.


    First, pull down the latest SQL Server docker image to your machine


    ```

    docker pull mcr.microsoft.com/mssql/server

    ```


    and then run it:


    ```

    docker run -e ''ACCEPT_EULA=Y'' -e ''SA_PASSWORD=yourStrong(!)Password'' -p 1433:1433
    -d mcr.microsoft.com/mssql/server

    ```


    Last, confirm that SQL is indeed running by listing the locally running container
    and checking that SQL Server is in the list:


    ```

    docker ps


    CONTAINER ID        IMAGE                              COMMAND                  CREATED          STATUS          PORTS                    NAMES

    3388b710892f        mcr.microsoft.com/mssql/server    "/opt/mssql/bin/perm..."  52
    minutes ago   Up 52 minutes   0.0.0.0:1433->1433/tcp   friendly_bell

    ```


    If the SQL Server container did not start up, you may need to use double quotes
    instead of single quotes in the Docker run command.


    With this in place we are ready to start implementing data storage in our microservices.'

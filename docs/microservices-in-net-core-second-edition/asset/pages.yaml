- pgno: 286
  md: "# Creating applications\nover microservices\n\n+   **This chapter covers**\n\
    +   \n+   - Building an end user application on top of a microservice system\n\
    +   - Understanding the composite application, API Gateway, and backend for frontend\
    \ design patterns\n+   - Using server-side and client-side rendering in web applications\n\
    \nSo far, we’ve concentrated on implementing business capabilities in microservices\
    \ and exposing those capabilities through HTTP APIs. But end users don’t use HTTP\
    \ APIs—they use web apps, mobile apps, desktop applications, smart TVs, VR headsets,\
    \ and other applications on devices with interfaces geared toward humans. To give\
    \ end users access to all the capabilities of microservices, we need to implement\
    \ applications on top of microservices. This chapter is about doing that: we’ll\
    \ move from looking at designing single microservices to bringing all the microservices\
    \ together in an architecture that supports building applications for end users."
  merge: -1
  img_proc: true
- pgno: 287
  md: 'We’ll start with a broad, nontechnical discussion of how to approach building
    applications on top of a microservice system. Then we’ll go into three specific
    architectural patterns for implementing applications: the composite application,
    the API Gateway, and the backend for frontend patterns.


    # 12.1 End user applications for microservice systems: One or many applications?


    There are several ways to go about building end user–oriented applications both
    from a user perspective and a technical perspective. We’ll begin with the user
    perspective and look at a range of ways to surface the functionality in your microservices
    to end users in applications: from general-purpose applications that provide all
    the functionality of the system to a collection of small, specialized applications,
    each of which offers only a few capabilities. These two ways of surfacing functionality
    represent each end of a spectrum, as illustrated in figure 12.1.


    ![](img/608267d7803dc57a1a896ad121f37868_287_0.png)


    Figure 12.1 A wide spectrum of application types can be built on top of a microservice
    system, ranging from general-purpose applications to very specialized applications.


    Between the two extremes lie many other options for building applications that
    cover bigger or smaller parts of the microservice system’s functionality. Where
    on the spectrum the applications for a particular microservice system should fall
    depends on the context of that particular system: its end users, its functionality,
    and so on.


    Both ends of the spectrum have merit. The next two sections discuss them to give
    you a feel for the breadth of ways your microservice systems can provide functionality.
    The choice of where on the spectrum to land impacts how your application(s) should
    be built and which design pattern you should use.


    # 12.1.1 General-purpose applications


    A microservice system can provide a great deal of functionality. Consider, for
    instance, a line-of-business system for an insurance company. The system drives
    business processes, including selling policies, setting prices, and handling claims
    made by customers. Users include the following:


    +   - Salespeople who call and solicit potential customers

    +   - Actuaries who set policy prices and evaluate business risks based on estimated
    future claims and income

    +   - Appraisers who evaluate goods that customers want to insure and about which
    customers make claims'
  merge: -1
  img_proc: true
- pgno: 288
  md: '+   - Claims adjusters who investigate and settle customer claims

    +   - IT staff who oversee users and permissions


    You implement all the different business capabilities of the insurance system
    in different microservices, but you may also decide to implement a common application
    that covers all functionality and is used by all users. This can be thought of
    as a *general-purpose application*. It can be any type of application—for example,
    a web or desktop application.


    Various reasons may drive a decision to implement a general-purpose application
    that surfaces all functionality in the system. For example, some users in the
    insurance system may have more than one function, such as claims adjusters who
    also do appraisals. There may also be overlap between the functionalities needed
    by different types of users.


    By managing their permissions, you can still limit what each user can do in a
    general-purpose application. But they all use the same application, and it provides
    all the system’s functionality.


    # 12.1.2  Specialized applications


    Another option for building applications on top of a microservices system is to
    build lots of small, specialized applications. This is in some ways the opposite
    of the general-purpose application approach: you have many highly specialized
    applications, each of which surfaces only a little of the functionality of the
    entire system. Continuing with the example of a line-of-business application for
    an insurance company, you may have separate specialized applications for the following:


    +   - Browsing the catalog of policies offered by the company

    +   - Creating offers for potential customers

    +   - Creating an insurance policy for a customer

    +   - Creating reports about currently active insurance policies

    +   - Creating forecasts about the cost of future claims

    +   - Registering and investigating claims

    +   - Appraising insured goods

    +   - Settling claims


    With this approach, users must use more than one application. That may sound like
    a bad user experience at first, but is it really? If you choose to implement the
    applications as web apps, they can easily link to each other, creating a cohesive
    experience even though the functionality is spread over many small applications.
    And the philosophy of doing one thing and doing it well can lead to very good
    applications for each piece of functionality. For instance, Facebook has an Android
    app called Selfies for Messenger, to do just one thing: take selfies and send
    them with Facebook Messenger. The app streamlines that single functionality.


    Although I’ve mentioned only general-purpose applications and specialized applications,
    these aren’t the only two possibilities. There’s a spectrum of options (shown'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'again in figure 12.2), ranging from one big application that provides all functionality
    in the system to a long list of single-capability applications. Other possibilities
    include the following:


    +   - Splitting the large, all-in-one application into two applications, with
    administrative functionalities in the first and all other functionality in the
    second

    +   - Joining some of the single-capability applications into slightly larger
    applications that cover all the functionalities required by one type of user


    ![](img/608267d7803dc57a1a896ad121f37868_289_0.png)


    Figure 12.2 A wide spectrum of types of applications can be built on top of microservices.


    In the case of the insurance company, one middle-ground approach would be to create
    an application for each type of user. Salespeople would get a sales application
    with all the functionality they need, from canvassing for leads to signing a deal.
    Likewise, actuaries, appraisers, claims adjusters, and IT staff get applications
    tailored to their usage.


    Although this approach avoids the complexities of big, general-purpose applications
    as well as those of a vast number of single-purpose applications, it does have
    its own issues: functionality will probably be duplicated between applications,
    some users play more than one role, and so on. There’s no one right way; you need
    to decide where in the spectrum you fall, based on user-experience concerns rather
    than technical concerns.


    Now, let’s turn to the more technical side of things and look at three technical
    patterns for building applications on top of microservices.


    # 12.2 Patterns for building applications over microservices


    This section discusses the composite application, the API Gateway, and the backend
    for frontend design patterns. I’ll explain each pattern in turn and also discuss
    their pros and cons. Then I’ll turn to the question of when to use each one.


    # 12.2.1 Composite applications: Integrating at the frontend


    The first pattern for building applications over microservices is the composite
    application. A composite application is made up of functionality drawn from several
    places—in the case of microservices, from different microservices—by communicating
    with each one directly. In this pattern, each microservice provides both functionality
    and a UI for the functionality. Microservices may communicate with each other
    to perform their tasks; the composite application doesn’t care.'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'Figure 12.3 returns to the insurance example, with a general-purpose application
    that includes all the system’s functionality. The insurance system is built using
    microservices, so to provide all the system’s functionality through the application,
    the application needs to draw on the business capabilities of many microservices.
    There are more microservices in the system than are shown in the figure, and the
    application won’t draw directly from all of them. The application composes these
    functionalities into one application—thus the term *composite application*.


    ![](img/608267d7803dc57a1a896ad121f37868_290_0.png)


    **Figure 12.3**  A composite general-purpose application uses many different microservices,
    each of which provides both functionality and a UI for that functionality.


    When you build a general-purpose application in front of a microservice system
    as a composite application, the microservices provide functionality and also a
    UI to go with the functionality. As a consequence, the UI of the application is
    a composite of smaller UIs drawn from different microservices. Figure 12.4 shows
    an example structure for the insurance application’s UI: it consists of four sections,
    each drawn from a microservice that provides both functionality and a UI.


    How UI composition is achieved depends on the technology used to build the client.
    In the case of a desktop Windows Presentation Foundation (WPF) application, you
    could, for instance, use Managed Extensibility Framework (MEF; http://mng.bz/6NKA)
    to dynamically load components into the application, each of which could have
    its own piece of the UI. In the case of a web application, the UI can be built
    by loading HTML fragments and JavaScript bundles from the microservices into the
    main application and adding them to the DOM with JavaScript. In both cases, microservices
    provide both the functionality and the UI.'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'The list of insurance policies comes from the policy catalog microservice.


    The claims registration form comes from the claims registration microservice.


    ![](img/608267d7803dc57a1a896ad121f37868_291_0.png)


    The claim settling form comes from the claim settling microservice.


    The appraisals form comes from the appraisal microservice.


    Figure 12.4 A composite application takes UI components from different microservices
    and uses them to form a cohesive, composite UI.


    Composite applications aren’t all general-purpose applications; they can be smaller
    applications as well. For instance, if the insurance application has one application
    per user type, each application must provide functionality that belongs to different
    business capabilities and therefore to different microservices. It follows that
    each per-user-type application can be built as a composite application.


    # ADVANTAGES


    When you’re building composite applications, the UI is split into smaller parts
    according to business capabilities, just as functionality is distributed across
    microservices following business capabilities. That means the UI for each business
    capability is'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'implemented close to the code for the capability and is deployed along with
    that code. Because the composite application draws the UI for the capability from
    the microservice, the application is updated every time a microservice UI is updated.
    This means the agility you gain by splitting the system into small, focused microservices
    applies to the application UI, too.


    # DISADVANTAGES


    A composite application is responsible for integrating all the functionality implemented
    throughout the system of microservices. This can be a complex task: there are
    potentially many business capabilities in a microservice system, and the application’s
    UI may not be split along quite the same lines, leading to pages or screens that
    include UIs from several different microservices but that need to feel like a
    single screen to the end user.


    This kind of complexity can mean that the composite application has intimate knowledge
    of how the microservices work and, in particular, how their UIs work. If the composite
    application begins to make too many assumptions about the microservices’ UIs,
    it becomes sensitive to changes in each microservice, and thus the application
    as a whole may break because of GUI changes in a single microservice. If you wind
    up in that situation, you lose the agility that’s one of the major advantages
    of using a composite application.


    Composite applications can work very well—but only if you can avoid implementing
    complex integrations.


    # 12.2.2 API Gateway


    The second pattern for building applications over microservices is the API Gateway.
    An API Gateway is a microservice with a public HTTP API that covers all the system’s
    functionality but doesn’t implement any of the functionality itself. Instead,
    the API Gateway delegates everything to other microservices. In effect, an API
    Gateway acts like an adapter between applications and the system of microservices.


    When you build applications in front of a microservice system that uses an API
    Gateway, the applications are shielded from knowing anything about how the system
    functionality is split across microservices, or even that the system uses microservices.
    The application only needs to know about one microservice: the API Gateway.


    Throughout this book, you’ve seen the example of a shopping cart in an e-commerce
    system, including an API Gateway. Figure 12.5 shows a request to add an item to
    a user’s shopping cart coming in from the application to the API Gateway, which
    delegates to other microservices to serve the request. The role of the API Gateway
    in this case is to provide a single entry point for applications and thus simplify
    the system interface so that applications don’t have to interact directly with
    several microservices.


    You can build any kind of application in front of an API Gateway, from a general-purpose
    application that uses everything the API Gateway has to offer to specialized,
    single-capability applications that use only a fraction of the API Gateway, to
    everything in between.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'Figure 12.5 An API Gateway is the single entry point for applications. Any
    request from an application goes to the API Gateway, which delegates to the rest
    of the microservice system to fulfill the request.


    # ADVANTAGES


    The main benefit of the API Gateway pattern is that it decouples applications
    nicely from the way the system is decomposed into microservices and hides that
    completely from applications. In cases where several applications have overlapping
    functionality or where some applications are built by third parties, using the
    API Gateway pattern facilitates the following:


    +   - Maintaining a low barrier to entry for building applications

    +   - Keeping the public API stable

    +   - Keeping the public API backward compatible'
  merge: -1
  img_proc: true
- pgno: 294
  md: <!-- no content -->
  merge: -1

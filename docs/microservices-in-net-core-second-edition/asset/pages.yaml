- pgno: 96
  md: "# Identifying and scoping microservices\n\n+   **This chapter covers**\n+ \
    \  \n+   - Scoping microservices for business capability\n+   - Scoping microservices\
    \ to support technical capabilities\n+   - Scoping microservices to support efficient\
    \ development work\n+   - Managing when scoping microservices is difficult\n+\
    \   - Carving out new microservices from existing ones\n\nTo succeed with microservices,\
    \ it’s important to be good at scoping each microservice appropriately. If your\
    \ microservices are too big, the turnaround on creating new features and implementing\
    \ bug fixes becomes longer than it needs to. If they’re too small, the coupling\
    \ between microservices tends to grow. If they’re the right size but have the\
    \ wrong boundaries, coupling also tends to grow, and higher coupling also leads\
    \ to longer turnaround. In other words, if you aren’t able to scope your microservices\
    \ correctly, you’ll lose much of the benefit microservices offer. In this chapter,\
    \ I’ll teach you how to find a good scope for each microservice so it stays loosely\
    \ coupled and efficient to work with."
  merge: -1
  img_proc: true
- pgno: 97
  md: "The primary driver in identifying and scoping microservices is business capabilities,\
    \ the secondary driver is supporting technical capabilities, and the tertiary\
    \ driver is efficiency of work. Following these drivers leads to microservices\
    \ that align nicely with the list of microservice characteristics from chapter\
    \ 1:\n\n+   - A microservice is responsible for a single capability.\n+   - A\
    \ microservice is individually deployable.\n+   - A microservice consists of one\
    \ or more processes.\n+   - A microservice owns its own data store.\n+   - A small\
    \ team can maintain a handful of microservices.\n+   - A microservice is replaceable.\n\
    \nOf these characteristics, the first two and last two can only be realized if\
    \ the microservice’s scope is good. There are also implementation-level concerns\
    \ that come into play, but getting the scope wrong will prevent the service from\
    \ adhering to those four characteristics.\n\n# 4.1 The primary driver for scoping\
    \ microservices: Business capabilities\n\nEach microservice should implement exactly\
    \ one capability. For example, a shopping cart microservice should keep track\
    \ of the items in the user’s shopping cart. The primary way to identify capabilities\
    \ for microservices is to analyze the business problem and determine the business\
    \ capabilities. Each business capability should be implemented by a separate microservice.\n\
    \n# 4.1.1 What is a business capability?\n\nA business capability is something\
    \ an organization does that contributes to business goals. For instance, handling\
    \ a shopping cart on an e-commerce website is a business capability that contributes\
    \ to the broader business goal of allowing users to purchase items. A given business\
    \ will have a number of business capabilities that together make the overall business\
    \ function.\n\nWhen mapping a business capability to a microservice, the microservice\
    \ models the business capability. In some cases, the microservice implements the\
    \ entire business capability and automates it completely. In other cases, the\
    \ microservice implements only part of the business capability, because some part\
    \ of the capability is carried out by people in the real world and thus the microservice\
    \ only partly automates the business capability. In both cases, the scope of the\
    \ microservice is the business capability.\n\n> **Business capabilities and bounded\
    \ contexts**\n> \n> *Domain-driven design* is an approach to designing software\
    \ systems that’s based on modeling the business domain. An important step is identifying\
    \ the language used by domain experts to talk about the domain. It turns out that\
    \ the language used by domain experts isn’t consistent in all cases."
  merge: -1
  img_proc: true
- pgno: 98
  md: 'In different parts of a domain, different things are in focus, so a given word
    like customer may have different foci in different parts of the domain. For instance,
    for a company selling photocopiers, a customer in the sales department may be
    a company that buys a number of photocopiers and may be primarily represented
    by a procurement officer. In the customer service department, a customer may be
    an end user having trouble with a photocopier. When modeling the domain of the
    photocopier company, the word customer means different things in different parts
    of the model.


    A bounded context in domain-driven design is part of a larger domain within which
    words mean the same things. Bounded contexts are related to but different from
    business capabilities. A bounded context defines an area of a domain within which
    the language is consistent. Business capabilities, on the other hand, are about
    what the business needs to get done. Within one bounded context, the business
    may need to get several things done. Each of these things is likely a business
    capability.


    Since the business capabilities within a bounded context are related, we can accept
    a higher degree of coupling between capabilities within the same bounded context
    than we can between capabilities in different bounded context.


    # 4.1.2 Identifying business capabilities


    A good understanding of the domain will enable you to understand how the business
    functions. Understanding how the business functions means you can identify the
    business capabilities that make up the business and the processes involved in
    delivering the capabilities. In other words, the way to identify business capabilities
    is to learn about the business’s domain. You can gain this type of knowledge by
    talking with the people who know the business domain best: business analysts,
    the end users of your software, and so on—all the people directly involved in
    the day-to-day work that drives the business.


    A business’s organization usually reflects its domain. Different parts of the
    domain are handled by different groups of people, and each group is responsible
    for delivering certain business capabilities; so, this organization can give you
    hints about how the microservices should be scoped. For one thing, a microservice’s
    responsibility should probably lie within the purview of only one group. If it
    crosses the boundary between two groups, it’s probably too widely scoped and will
    be difficult to keep cohesive, leading to low maintainability. These observations
    are in line with what is known as Conway’s law:


    > Any organization that designs a system (defined broadly) will produce a design
    whose structure is a copy of the organization’s communication structure.


    Sometimes you may uncover parts of the domain where the organization and the domain
    are at odds. In such situations, there are two approaches you can take, both of
    which respect Conway’s law. You can accept that the system can’t fully reflect
    the domain and implement a few microservices that aren’t well aligned with the
    domain but are well aligned with the organization; or you can change the organization
    to'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'reflect the domain. Both approaches can be problematic. The first risks building
    microservices that are poorly scoped and that might become highly coupled. The
    second involves moving people and responsibilities between groups. Those kinds
    of changes can be difficult. Your choice should be a pragmatic one, based on an
    assessment of which approach will be least troublesome.


    To get a better understanding of what business capabilities are, it’s time to
    look at an example.


    # 4.1.3 Example: Point-of-sale system


    The example we’ll explore in this chapter is a point-of-sale system (POS), illustrated
    in figure 4.1. I’ll briefly introduce the domain, and then we’ll look at how to
    identify business capabilities within it. Finally, we’ll consider the scope of
    one of the microservices in the system in more detail.


    ![](img/608267d7803dc57a1a896ad121f37868_99_0.png)


    Figure 4.1 A POS system for a large chain of stores, consisting of a backend that
    implements all the business capabilities in the system and thin GUI clients cashiers
    use in the stores. Microservices in the backend implement the business capabilities.


    This POS system is used in all the stores of a large chain. Cashiers at the stores
    interact with the system through a thin GUI client—it could be a tablet application,
    a web application, or a physical purpose-built cash register. The GUI client is
    just a thin layer in front of the backend. The backend is where all the business
    logic (the business capabilities) is implemented, and it will be our focus.


    The system offers cashiers a variety of functions:


    +   - Scan products and add them to the invoice.

    +   - Prepare an invoice.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '+   - Charge a credit card via a card reader attached to the client.

    +   - Register a cash payment.

    +   - Accept coupons.

    +   - Print a receipt.

    +   - Send an electronic receipt to the customer.

    +   - Search in the product catalog.

    +   - Scan one or more products to show prices and special offers related to the
    products.


    These functions are things the system does for the cashier, but they don’t directly
    match the business capabilities that drive the POS system.


    # IDENTIFYING BUSINESS CAPABILITIES IN THE POINT-OF-SALE DOMAIN


    To identify the business capabilities that drive the POS system, you need to look
    beyond the list of functions. You must determine what needs to go on behind the
    scenes to support the functionality.


    Starting with the “Search in the product catalog” function, an obvious business
    capability is maintaining a product catalog. This is the first candidate for a
    business capability that could be the scope of a microservice. Such a product
    catalog microservice would be responsible for providing access to the current
    product catalog. The product catalog needs to be updated every so often, but the
    chain of stores uses another system to handle that functionality. The product
    catalog microservice would need to reflect the changes made in that other system,
    so the scope of the product catalog microservice would include receiving updates
    to the product catalog.


    The next business capability you might identify is applying special offers to
    invoices. Special offers give the customer a discounted price when they buy a
    bundle of products. A bundle may consist of a certain number of the same product
    at a discounted price (for example, three for the price of two), or it may be
    a combination of different products (say, buy A and get 10% off B). In either
    case, the invoice the cashier gets from the POS GUI client must take any applicable
    special offers into account automatically. This business capability is the second
    candidate to be the scope for a microservice. A special offers microservice would
    be responsible for deciding when a special offer applies and what the discount
    for the customer should be.


    Looking over the list of functionality again, notice that the system should allow
    cashiers to “scan one or more products to show prices and special offers related
    to the products.” This indicates that there’s more to the special offers business
    capability than just applying special offers to invoices; it also includes the
    ability to look up special offers based on products.


    If you continued the hunt for business capabilities in the POS system, you might
    end up with this list:


    +   - Product catalog

    +   - Price catalog

    +   - Price calculation'
  merge: -1
  img_proc: true
- pgno: 101
  md: '+   - Special offers

    +   - Coupons

    +   - Sales records

    +   - Invoice

    +   - Payment


    Figure 4.2 shows a map from functionalities to business capabilities. The map
    is a logical one, in the sense that it shows which business capabilities are needed
    to implement each function, but it doesn’t indicate any direct technical dependencies.
    For instance, the arrow from prepare invoice to coupons doesn’t indicate a direct
    call from some prepare invoice code in a client to a coupons microservice. Rather,
    the arrow indicates that in order to prepare an invoice, coupons need to be taken
    into account, so the prepare invoice function depends on the coupons business
    capability.


    ![](img/608267d7803dc57a1a896ad121f37868_101_0.png)


    Finding the business capabilities in real domains can be hard work and often requires
    a good deal of iterating. The list of business capabilities isn’t a static list
    made at the start of development; rather, it’s an emergent list that grows and
    changes over time as your understanding of the domain and the business grows and
    deepens.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'Now that we’ve gone through the first iteration of identifying business capabilities,
    let’s take a closer look at one of these capabilities and how it defines the scope
    of a microservice.


    # THE SPECIAL OFFERS MICROSERVICE


    The special offers microservice is based on the special offers business capability.
    To narrow the scope of this microservice, we’ll dive deeper into this business
    capability and identify the processes involved, illustrated in figure 4.3. Each
    process delivers part of the business capability.


    ![](img/608267d7803dc57a1a896ad121f37868_102_0.png)


    Figure 4.3 The special offers business capability includes a number of different
    processes.


    The special offers business capability is broken down into five processes. Four
    of these are oriented toward the POS GUI clients. The fifth—tracking the use of
    special offers—is oriented toward the business itself, which is interested in
    tracking which special offers customers are taking advantage of.


    Implementing the business capability as a microservice means you need to do the
    following:


    +   - Expose the four client-oriented processes as API endpoints that other microservices
    can call.

    +   - Implement the usage-tracking process through an event feed. The business
    intelligence parts of the POS system can subscribe to these events and use them
    to track which special offers customers use.


    The components of the special offers microservice are shown in figure 4.4.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '![](img/608267d7803dc57a1a896ad121f37868_103_0.png)


    Figure 4.4 The processes in the special offers business capability are reflected
    in the implementation of the special offers microservice. The processes are exposed
    to other microservices through the microservice’s HTTP API.


    The components of the special offers microservice are similar to the components
    of the shopping cart microservice in chapter 2, which is shown again in figure
    4.5. This is no coincidence. These are the components our microservices typically
    consist of: an HTTP API that exposes the business capability implemented by the
    microservice, an event feed (explained and implemented in chapter 5), a domain
    model implementing the business logic involved in the business capability, a data
    store component, and a database.


    ![](img/608267d7803dc57a1a896ad121f37868_103_1.png)


    Figure 4.5 The components of the shopping cart microservice from chapter 2 are
    similar to the components of the special offers microservice.'
  merge: -1

- pgno: 46
  md: "# 1.9.3 Adding an MVC controller with an implementation of the endpoint\n\n\
    Now you’ll add an MVC controller with an implementation of the single API endpoint.\
    \ We will implement controllers as classes that inherit from ControllerBase and\
    \ we will use them to declare endpoints and to implement the behavior for each\
    \ endpoint. Because we added the endpoints.MapControllers line to Startup in the\
    \ previous section, ASP.NET will discover the endpoints we declare in our controllers.\
    \ We add a controller by creating a file called CurrentDateTimeController.cs and\
    \ adding the following code to it.\n\n```\nListing 1.2 MVC Controller\n\nnamespace\
    \ HelloMicroservices\n{\n    using System;\n    using Microsoft.AspNetCore.Mvc;\n\
    \n    public class CurrentDateTimeController : ControllerBase\n    {\n       \
    \ [HttpGet(\"/\")]\n        public object Get() => DateTime.UtcNow;\n    }\n```\n\
    \nIn this controller, you declare a route for the path / with the attribute HttpGet(\"\
    /\"). This tells MVC that any HTTP GET request to / should be handled by the method\
    \ following the attribute, the method Get() in this case. The Get() method returns\
    \ the current UTC date and time, so that is the response to every HTTP GET request\
    \ to /.\n\nYou can now rerun the application and again point your browser to https://localhost:5001.\
    \ Your browser will hit the route on your MVC controller and show the current\
    \ UTC date and time as a string. We can do the same with the REST client plug-in\
    \ in Visual Studio Code, which looks like figure 1.10.\n\n![](img/608267d7803dc57a1a896ad121f37868_46_0.png)\n\
    \nFigure 1.10 REST client in VS Code makes it easy to send HTTP requests and control\
    \ the request details, such as the headers and HTTP method."

  md: '# preface


    When I first talked to Manning about writing a book, we discussed a book about
    Nancy. Part of me was excited to write about Nancy again, because it was an awesome
    web framework, but my first book was also about Nancy, and a different part of
    me wanted this book to be something more. After some contemplation and some back
    and forth with Manning, it became clear that I wanted to write about microservices;
    I wanted to write a book that was more about designing and implementing microservices
    than about any specific technology, while at the same time showcasing some great,
    lightweight .NET technologies. That became the first edition of this book.


    Since then, the technology landscape has moved on: development of Nancy has stopped
    and .NET Core (which was nascent when the first edition was written) has incorporated
    many useful ideas from community projects and changed its name to .NET. At the
    same time, microservices have become even more widespread, and most of the design
    and architecture advice from the first edition still holds up. I felt the first
    edition still has a lot to offer, but I also felt it needed a technology update.
    That’s the book you’re about to read, and I hope you’ll not only learn how to
    be successful with microservices, but also learn the value of simplicity.'
  merge: -1
  img_proc: true

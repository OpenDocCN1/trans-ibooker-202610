  md: "```\n[FromQuery] long start,\n[FromQuery] long end = long.MaxValue)\n=>\n \
    \   this.eventStore\n        .GetEvents(start, end)\n        .ToArray();\n}\n\
    ```\n\nReads the start and end values from a query string parameter\n\nReturns\
    \ the raw list of events. MVC takes care of serializing the events into the response\
    \ body.\n\nEventFeedController mostly uses MVC features that you've already encountered.\
    \ The only new bit is that the start and end values are read from query string\
    \ parameters. The FromQuery parameter in front of the method arguments tells MVC\
    \ that these are query string parameters.\n\nEventFeedController uses the event\
    \ store to filter events between the start and end values from the client. Although\
    \ filtering is probably best done at the database level, the following simple\
    \ implementation illustrates it well.\n\n# Listing 2.18 Filtering events based\
    \ on the start and end points\n\n```\npublic IEnumerable<Event> GetEvents(\n \
    \   long firstEventSequenceNumber,\n    long lastEventSequenceNumber) =>\n   \
    \     database\n            .Where(e =>\n                e.SequenceNumber >= firstEventSequenceNumber\
    \ &&\n                e.SequenceNumber <= lastEventSequenceNumber)\n         \
    \   .OrderBy(e => e.SequenceNumber);\n```\n\nWith the /events endpoint in place,\
    \ microservices that want to subscribe to events from the shopping cart microservice\
    \ can do so by polling the endpoint. Subscribers can—and should—use the start\
    \ and end query string parameters to make sure they only get new events. If the\
    \ shopping cart is down when a subscriber polls, the subscriber can ask for the\
    \ same events again later. Likewise, if a subscriber goes down for a while, it\
    \ can catch up with events from the shopping cart by asking for events starting\
    \ from the last event it saw. As mentioned, this isn't a full-fledged implementation\
    \ of an event feed, but it gets you to the point that microservices can subscribe\
    \ to events, and the code is simple.\n\nYou've now completed the version 1 implementation\
    \ of your first microservice. As you can see, a microservice is small and has\
    \ a narrow focus: it provides just one business capability. You can also see that\
    \ microservice code tends to be simple and easy to understand. This is why you\
    \ can expect to create new microservices and replace existing ones quickly.\n\n\
    # 2.3 Running the code\n\nNow that all the code for the shopping cart microservice\
    \ is in place, you can run it the same way you ran the example in chapter 1: from\
    \ within Visual Studio, or from the command line with dotnet. You can test all\

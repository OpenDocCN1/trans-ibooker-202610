    \ array of product IDs and removes those products from the cart. Add the following\
    \ code to the ShoppingCartController.\n\n![](img/608267d7803dc57a1a896ad121f37868_63_0.png)\n\
    \n**Figure 2.7** Other microservices can remove items from a shopping cart with\
    \ an HTTP DELETE request by providing an array of product IDs in the request body.\n\
    \n```\n```csharp\n[HttpDelete(\"{userId:int}/items\")]\npublic ShoppingCart Delete(\n\
    \    int userId,\n    [FromBody] int[] productIds)\n{\n    var shoppingCart =\n\
    \        this.shoppingCartStore.Get(userId);\n    shoppingCart.RemoveItems(\n\
    \        productIds,\n        this.eventStore);\n    this.shoppingCartStore.Save(shoppingCart);\n\
    \    return shoppingCart;\n}\n```\n```\n\nUsing the same route template for two\
    \ route declarations is fine if they use different HTTP methods.\n\nThe eventStore\
    \ will be used later in the RemoveItems method.\n\nThis completes ShoppingCartController,\
    \ which ends up at about 50 lines of code.\n\n# 2.2.3  Fetching product information\n\

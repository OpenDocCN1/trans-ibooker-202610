  md: 'As you can see, you can get a lot of functionality up and running with a small
    amount of code.


    # ADDING ITEMS TO A SHOPPING CART


    The second endpoint you need to add to the shopping cart microservice lets you
    add items to a user''s shopping cart. Figure 2.6 shows how other microservices
    can use this endpoint.


    ![](img/608267d7803dc57a1a896ad121f37868_60_0.png)


    Figure 2.6 Other microservices can add items to a shopping cart with an HTTP POST
    request that includes an array of product IDs in the request body.


    Like the HTTP GET endpoint in the previous section, this new endpoint receives
    a user ID in the URL. This time, the endpoint accepts HTTP POST requests instead
    of HTTP GET, and the request should provide a list of items in the body of the
    request. For example, the following request adds two items to user 123''s shopping
    cart.


    # Listing 2.5 Adding two items to a shopping cart


    ```

    POST /shoppingcart/123/items HTTP/1.1

    Host: shoppingcart.my.company.com

    Accept: application/json

    Content-Type: application/json


    [1, 2]


    The URL includes the ID of the shopping cart: 123.


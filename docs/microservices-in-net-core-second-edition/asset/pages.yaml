  md: '![](img/608267d7803dc57a1a896ad121f37868_183_0.png)


    **Figure 7.3** If the microservice marked **FAILED** is failing, so is communication
    with it. That means the microservices at the other end of those communications
    are under stress. If the stressed microservices fail due to the stress, the microservices
    communicating with them are put under stress. In that situation, the failure in
    one failed microservice can propagate to several other microservices.


    and try to send them again. This isn’t possible in all situations because the
    command may need to be handled immediately, but when this approach is feasible,
    it stops the failure in one microservice from propagating. This approach can be
    combined with a *circuit breaker*, which we’ll talk about later in the chapter.


    +   - When one microservice queries another that’s failing, the caller can use
    a cached response. In chapter 6, you saw how to cache query responses and respect
    the cache header set by the microservice being queried. If the caller has a stale
    response in the cache but a query for a fresh response fails, it may decide to
    use the stale response anyway. Again, this isn’t possible in all situations, but
    when it is, the failure won’t propagate.

    +   - An API Gateway that’s stressed because of high amounts of traffic from a
    certain client can throttle that client by not responding to more than a certain
    number of requests per second from the client. Note that the client may be sending
    an unusually high number of requests because it’s failing internally. When throttled,
    the client will get a degraded experience but will still receive some responses.
    Without the throttling, the API Gateway may become slow for all clients or fail
    completely. Moreover, because the API Gateway collaborates with other microservices,
    handling all the incoming requests would push the stress of those requests onto
    other microservices, too. Again, throttling stops the failure in the client from
    propagating to other microservices.


    As you can see from these examples, stopping failure propagation comes in many
    shapes and sizes. The important takeaway is the idea of building safeguards into
    your systems that are specifically designed to stop propagation of the kinds of
    failures you anticipate. How that’s realized depends on the specifics of the systems
    you’re building. Building in safeguards may take some effort, but it’s often well
    worth the effort because of the robustness they give the system as a whole.'

    ![](img/608267d7803dc57a1a896ad121f37868_230_0.png)


    Figure 9.3 Every microservice should have two monitoring endpoints: one at /health/startup
    and one at /health/live. The monitoring system polls both endpoints. As long as
    both respond with a success response, the monitor considers the microservice to

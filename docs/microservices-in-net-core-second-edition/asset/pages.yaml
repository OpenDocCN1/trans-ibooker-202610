  md: 'As an example of deployment, we will create a Kubernetes environment in Microsoft’s
    Azure cloud in chapter 3 and deploy a microservice to it. In the chapters that
    follow, we will continue to use that Kubernetes environment as an example and
    deploy microservices to it.


    # 1.3.2 High level of maintainability


    Well-factored and well-implemented microservices are highly maintainable from
    a couple of perspectives. From a developer perspective, several factors play a
    part in making microservices maintainable:


    +   - Each well-factored microservice provides a single capability. Not two—just
    one.

    +   - A microservice owns its own data store. No other services can interfere
    with a microservice’s data store. This, combined with the typical size of the
    codebase for a microservice, means you can understand a complete service all at
    once.

    +   - Well-written microservices can (and should) be comprehensively covered by
    automated tests.


    From an operations perspective, a couple of factors play a role in the maintainability
    of microservices:


    +   - A small team can maintain a few handfuls of microservices that must be built
    to be operated efficiently, which implies you should be able to easily determine
    the current health of any microservice.

    +   - Each microservice is individually deployable.


    It should follow that issues in production can be discovered in a timely manner
    and be addressed quickly, such as by scaling out the microservice in question
    or deploying a new version of it. The fact that a microservice owns its own data
    store also adds to its operational maintainability, because the scope of maintenance
    on the data store is limited to the owning microservice.


    # Favor lightweight


    Because every microservice handles a single capability, microservices are by nature
    fairly small, both in their scope and in the size of their codebase. The simplicity
    that follows from this limited scope is a major benefit.


    When developing microservices, it’s important to avoid complicating their codebase
    by using large, complicated frameworks, libraries, or products because you think
    you may need their functionality in the future. Chances are this won’t be the
    case, so you should prefer smaller, lightweight technologies that address the
    microservice’s current needs. Remember, a microservice is replaceable: you can
    completely rewrite it within a reasonable budget, if at some point, the technologies
    you used originally no longer meet your needs.'

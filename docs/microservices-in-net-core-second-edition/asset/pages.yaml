    # 4.4.3 Planning to carve out new microservices later


    Because you consciously err on the side of making your microservices a bit too
    big when you’re in doubt about the scope of a microservice, you have a chance
    to foresee which microservices will have to be divided at some point. If you know
    a microservice is likely to be split later, it would be nice if you could plan
    for that split in a way that will save you one or two of the refactoring steps
    shown in figure 4.15. It turns out you can frequently make that kind of plan.


    Often you’ll be unsure whether a particular function is a separate business capability,
    so you’ll follow the rule of thumb and include it in a larger business capability,
    implemented within a microservice scoped to that larger business capability. But
    you can remain conscious of the fact that this area might be a separate business
    capability.


    Think about the definition of the special offers business capability that includes
    processes for dealing with coupons. You may well have been in doubt about whether
    handling coupons was a business capability on its own, so the special offers business
    capability was modeled as including all the processes shown in figure 4.14.


    When you first implement a special offers microservice scoped to the understanding
    of the special offers business capability illustrated in figure 4.14, you don’t
    know whether the coupons functionality will eventually be moved to a coupons microservice.
    You do know, however, that the coupon’s functionality isn’t as closely related
    to the rest of the microservice as some of the other areas. It’s therefore a good
    idea to put a clear boundary around the coupon’s code in the form a well-defined
    public API and to put the code in a separate class library. This is sound software
    design, and it will also pay off if one day you end up carving out the coupon
    code to create a new coupons microservice.


    # 4.5 Well-scoped microservices adhere to the microservice characteristics


    I’ve talked about scoping microservices by identifying business capabilities first
    and supporting technical capabilities second. In this section, I’ll discuss how
    this approach to scoping aligns with these four characteristics of microservices
    mentioned at the beginning of this chapter:


    +   - A microservice is responsible for a single capability.

    +   - A microservice is individually deployable.

    +   - A small team can maintain a handful of microservices.

    +   - A microservice is replaceable.


    > **NOTE**  It’s important to note that the relationship between the drivers for
    scoping microservices and the characteristics of microservices goes both ways.
    The primary and secondary drivers lead toward adhering to the characteristics,
    but'

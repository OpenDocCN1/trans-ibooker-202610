    http://special-offers:5002/events?start={start}&end={end}\"));\nawait ProcessEvents(await\
    \ resp.Content.ReadAsStreamAsync());\nawait SaveStartIdToDataStore(start);\n\n\
    Task<long> GetStartIdFromDatastore(){...}\nasync Task ProcessEvents(Stream content){...}\n\
    Task SaveStartIdToDataStore(long startId){...}\n```\n\nWith this code above, the\
    \ EventConsumer can read a batch of events, and every time it is called, it reads\
    \ the next batch of events. The remaining part is to process the events, as shown\
    \ next.\n\n# Listing 5.12 Deserializing and then handling events\n\n```\nasync\
    \ Task ProcessEvents(Stream content)\n{\n    var events =\n        await JsonSerializer.DeserializeAsync<SpecialOfferEvent[]>(content)\n\
    \        ?? new SpecialOfferEvent[];\n    foreach (var @event in events)\n   \
    \ {\n        Console.WriteLine(@event);\n        start = Math.Max(start, @event.SequenceNumber\
    \ + 1);\n    }\n}\n```\n\nThere are a few things to notice here:\n\n+   - This\
    \ method keeps track of which events have been handled. This makes sure you don’t\
    \ request events from the feed that you’ve already processed.\n+   - As you saw\
    \ earlier, not all events carry the same data in the Content property, so depending\
    \ on the Name property, the event handling can expect different data in the Content\
    \ object. You want to be liberal in accepting incoming data in the 'Content' property—it\
    \ shouldn’t cause problems if the special offers microservice decides to add an\
    \ extra field to the event JSON. As long as the data you need is there, the rest\
    \ can be ignored.\n+   - The events are deserialized into the type SpecialOfferEvent.\
    \ This is a different type than the EventFeedEvent type used to serialize the\
    \ events in special offers. This is intentional and is done because the two microservices\
    \ don’t need to have the exact view of the events. As long as the loyalty program\
    \ doesn’t depend on data that isn’t there, all is well.\n\nThe SpecialOfferEvent\
    \ type used here is simple and contains only the fields used in the loyalty program:"

- pgno: 269
  md: 'microservices, but it changes often, it becomes a serious bottleneck instead
    of an enabler. First, the platform must be updated in the code base of each microservice,
    and then each microservice must be deployed. If there are many microservices,
    that’s a lot of work; and each time a new microservice is created, it becomes
    even more work.


    Ideally, your microservice platform will hit the sweet spot of including only
    technical concerns that really do cut across microservices and that you can update
    incrementally—that is, in one microservice at a time over a period of time. This
    makes the barrier to creating a new microservice much lower: you need less-detailed
    knowledge about the cross-cutting technical concerns, and less effort is required.


    # 11.4 Packaging and sharing cross-cutting code with NuGet


    # Using NuGet for your platform


    NuGet is a package format as well as a group of tools for installing those packages.
    Until this point in the book, you’ve only installed existing NuGet packages; all
    of them have been publicly available in the package feed on nuget.org. But NuGet
    isn’t limited to installing publicly available packages. As you’ll see in section
    11.4, you can install packages from your private package feed. And you can also
    create your own NuGet packages—as you’ll also see in section 11.4.1—and put them

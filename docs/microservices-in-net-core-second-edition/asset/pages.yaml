- pgno: 278
  md: 'executed before and after the controller method. You do that by adding MVC
    filters to the MVC configuration. But what belongs where?


    To decide what to implement in middleware and what to implement in MVC filters,
    you can follow a few simple rules of thumb:


    +   * Code that addresses a cross-cutting concern and is meant to be used across
    many microservices belongs in middleware. These reusable pieces of code should
    have few dependencies so they don''t enforce too many technology choices on the
    microservices in which they''re used. Therefore, you want to keep them independent
    of MVC.

    +   * Code that addresses a domain or business rule of a single microservice belongs
    in the application code behind an MVC controller. This type of code doesn''t depend
    on HTTP, and therefore doesn''t need to depend on ASP.NET or MVC. Putting it in
    a separate component—for example, a domain model—enables you to keep the implementation
    of business and domain rules clean and readable.

    +   * Code that handles HTTP requests and responses in a way that''s specific
    to a particular endpoint belongs in an MVC controller. This code interprets the
    incoming HTTP requests and then hands off control to the domain model. At the
    same time, that interpretation is tightly coupled to HTTP and to the specifics
    of the endpoint, making the controller the right place for it.

    +   * Code that addresses a concern that cuts across all endpoints in a microservice,
    but not across several microservices, usually belongs in middleware, but not always.
    The more technical the concern is, the more I lean toward middleware; and the
    more domain or business logic there is in the concern, the more I lean toward
    MVC controllers or, in rare cases, an MVC filter.


    I''ve introduced middleware and discussed what it''s used for. Now we will turn
    to writing and testing middleware.


    # 11.6 Writing middleware


    We''ll look at two ways to write middleware and hook them into the ASP.NET pipeline:


    +   * As a lambda—You''ve seen this style earlier in this chapter, and we will
    build on that in the next section

    +   * As a class that has a method that implements the middleware signature—You''ll
    see this style right after we''ve taken another look at the lambda style.


    The two styles are equivalent, and you can easily change between them. Which to
    choose for a particular piece of middleware is a matter of taste.


    # 11.6.1 Middleware as lambdas


    You''ve already seen middleware implemented with a lambda function. In this section,
    I''ll show you how to add lambda-based middleware to the ASP.NET pipeline in a
    Startup.cs file.'

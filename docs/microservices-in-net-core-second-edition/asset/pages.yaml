  md: "```\n```csharp\npublic void ConfigureServices(IServiceCollection services)\n\
    {\n    services.AddBasicHealthChecks();\n    services.AddControllersWithViews();\n\
    }\n```\n```\n\nTo make the `/productlist` endpoint return a view, change it, as\
    \ shown next. It returns a view called productlist and passes a hardcoded list\
    \ of products into the view as a model object.\n\n```\n```csharp\nnamespace ApiGateway.ProductList\n\
    {\n    using Microsoft.AspNetCore.Mvc;\n    using System.Threading.Tasks;\n\n\
    \    public class ProductListController : Controller\n    {\n        [HttpGet(\"\
    /productlist\")]\n        public async Task<IActionResult> ProductList([FromQuery]\
    \ int userId)\n        {\n            var products = new[]\n            {\n  \
    \              new Product(1, \"T-shirt\", \"Really nice t-shirt\"),\n       \
    \         new Product(2, \"Hoodie\", \"The coolest hoodie ever\"),\n         \
    \       new Product(3, \"Jeans\", \"Perfect jeans\"),\n            };\n      \
    \      return View(new ProductListViewModel(products));\n        }\n    }\n\n\
    \    public record Product(int ProductId,\n        string ProductName, string\
    \ Description);\n    public record ProductListViewModel(Product[] Products);\n\
    }\n```\n```\n\nListing 12.6 uses an MVC feature you haven’t used before: `View(new\
    \ ProductListViewModel(products));`. This is how you return a view from an MVC\
    \ controller. The argument is a model object that will be passed to the view and\
    \ that can be used while rendering the view. By convention the name of the view\
    \ is equal to the name of the action method—ProductList in this case. This convention\
    \ can be overridden by passing in a view name as the first parameter to `View(...)`,\
    \ but here the convention is fine.\n\nTo implement the ProductList view, create\
    \ a new file called ProductList.cshtml next to ProductListController.cs in the\
    \ ProductList folder. The file extension .cshtml tells ASP.NET that this is a\
    \ Razor view. The ProductList.cshtml file contains a simple view that iterates\
    \ over the list of products in the model object and builds an HTML list"

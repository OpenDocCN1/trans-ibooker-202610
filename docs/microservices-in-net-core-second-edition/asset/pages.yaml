    # Summary


    +   - Implementing a complete microservice doesn’t take much code. The shopping
    cart microservice has only the following:

    +     - Two short controllers

    +     - A simple ShoppingCart domain class

    +     - A client class for calling the product catalog microservice

    +     - Two straightforward data access classes: ShoppingCartDataStore and EventStore
    (not shown in this chapter)

    +   - MVC makes it simple to implement HTTP APIs. The routing attributes MVC provides
    make it easy to add endpoints to a microservice. Just add an action method and
    put a routing attribute like [HttpGet("")] or [HttpPost("")] on it.

    +   - You should always expect that other microservices may be down. To prevent
    errors from propagating, each remote call should be wrapped in a policy for handling
    failure.

    +   - The Polly library is useful for implementing failure-handling policies and
    wrapping them around remote calls.

    +   - Implementing a basic event feed is simple and enables other microservices
    to react to events. The poor man’s event feed implemented in this chapter is just
    a short controller.

    +   - Domain model code is usually responsible for raising events, which are then
    stored in an event store and published through an event feed.'

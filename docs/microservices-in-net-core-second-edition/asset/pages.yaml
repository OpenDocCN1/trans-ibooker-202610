    Content-Type: application/json


    [1, 2]

    ```


    and then reading the same cart using the GET endpoint:


    ```

    GET http:52.142.83.184:5000///shoppingcart/15

    ```


    The response from this endpoint is the list of items in the cart for user number
    15, confirming that the shopping cart works just the same on AKS as it did on
    Kubernetes on localhost, and when we ran the shopping cart directly with dotnet
    run.


    Over time, we will create many microservices in a microservice system, which,
    in turn, means we will have many pods in Kubernetes; following the pattern I have
    laid out in this chapter, each one also has an associated load balancer in Kubernetes,
    which allows balancing traffic between multiple copies of the containers. For
    instance, we might run 3, 10, or 100 copies of the shopping cart container and
    let the shopping carts load balancer spread the incoming traffic between them.
    With a load balancer for each service that each exposes endpoints to the outside
    and each with a different IP address, a problem arises: How do we manage all these
    different entry points into our Kubernetes cluster? There is a security aspect
    to this question that we will return to in chapter 10, and there is a question
    of how end user applications know where to send requests, which we will return
    to in chapter 12.


    This concludes the setup of a production-like environment and the deployment of
    the first microservice to that environment. This positions us well for continuing
    working with microservices. The AKS cluster is set up and ready to run more microservices.
    As we develop more microservices throughout, we will include a Dockerfile and
    a Kubernetes manifest in each one, enabling us to build container images, push
    them to the private registry, and deploy them to AKS.


    # Summary


    +   - The microservices we develop can be deployed to many different environments.

    +   - .NET-based microservices are easily put into containers and run as containers.

    +   - Dockerfiles for .NET-based microservices follow a common template.

    +   - Deploying our microservices to Kubernetes gives us a highly scalable environment
    and a versatile container orchestrator.

    +   - Kubernetes works the same on localhost and in the cloud. This means we can
    easily run the exact containers on localhost for development and in the cloud
    for production.

    +   - Kubernetes manifests for our microservices are all similar.

    +   - Kubernetes can run everything we are going to develop in the upcoming chapters
    while providing tools for scaling, monitoring, and debugging microservices.

    +   - Azure Kubernetes Services is an easy-to-set-up managed Kubernetes offering
    that enables us to get up and running with Kubernetes quickly.'

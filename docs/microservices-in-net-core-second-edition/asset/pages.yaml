- pgno: 27
  md: '# 1.2.1 Microservice characteristics


    I’ve said that a microservice is “a service with a very narrowly focused capability,”
    but what exactly does that mean? Well, there’s not a broadly accepted definition
    in the industry of precisely what a microservice is.³ We can, however, look at
    what generally characterizes a microservice. I’ve found there to be six core microservice
    characteristics:


    +   - A microservice is responsible for a single capability.

    +   - A microservice is individually deployable.

    +   - A microservice consists of one or more processes.

    +   - A microservice owns its own data store.

    +   - A small team can maintain a few handfuls of microservices.

    +   - A microservice is replaceable.


    This list of characteristics should help you recognize a well-formed microservice
    when you see one, and it will also help you scope and implement your own microservices.
    By incorporating these characteristics, you’ll be on your way to getting the best
    from your microservices and producing a malleable, scalable, and robust system
    as a result. Throughout this book, I’ll show how these characteristics should
    drive the design of your microservices and how to write the code that a microservice
    needs to fulfill them. Now, let’s look briefly at each characteristic in turn.


    # RESPONSIBLE FOR A SINGLE CAPABILITY


    A microservice is responsible for one and only one capability in the overall system.
    We can break this statement into two parts:


    +   - A microservice has a single responsibility.

    +   - That responsibility is for a capability.


    The single responsibility principle has been stated in several ways. One traditional
    form is, “A class should have only one reason to change.”⁴ Although this way of
    putting it specifically mentions a class, the principle turns out to apply beyond
    the context of a class in an object-oriented language. With microservices, we
    apply the single responsibility principle at the service level.


    Another, newer, way of stating the single responsibility principle, also from
    Robert C. Martin, is as follows: “Gather together the things that change for the
    same reasons. Separate those things that change for different reasons.”⁵ This
    way of stating the principle applies to microservices: a microservice should implement
    exactly one capability. That way, it will have to change only when there’s a change
    to that capability. Furthermore, you should strive to have the microservice fully
    implement the capability so that only one microservice has to change when the
    capability is changed.


    ³ For further discussion of what characterizes microservices, I recommend this
    article on the subject: Martin Fowler and James Lewis, “Microservices: A Definition
    of This New Architectural Term,” March 25, 2014, http://martinfowler.com/articles/microservices.html.


    ⁴ Robert C. Martin, “SRP: The Single Responsibility Principle,” http://mng.bz/zQyz.


    ⁵ Robert C. Martin, “The Single Responsibility Principle,” May 8, 2014, http://mng.bz/RZgU.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'There are two types of capabilities in a microservice system:


    +   - A *business capability* is something the system does that contributes to
    the purpose of the system, like keeping track of users’ shopping carts or calculating
    prices. A good way to tease apart a system’s separate business capabilities is
    to use domain-driven design.

    +   - A *technical capability* is one that several other microservices need to
    use—integration to some third-party system, for instance. Technical capabilities
    aren’t the main drivers for breaking down a system to microservices; they’re only
    identified when you find several business-capability microservices that need the
    same technical capability.


    NOTE Defining the scope and responsibility of a microservice will be covered in
    chapter 4.


    # INDIVIDUALLY DEPLOYABLE


    A microservice should be *individually deployable*. When you change a particular
    microservice, you should be able to deploy it to the production environment without
    deploying (or touching) any other part of your system. The other microservices
    in the system should continue running and working during the deployment of the
    changed microservice and continue running once the new version is deployed.


    Consider an e-commerce site. Whenever a change is made to the shopping cart microservice,
    you should be able to deploy just that microservice, as illustrated in figure
    1.2. Meanwhile, the price calculation, recommendation, and product catalog microservices,
    and others, should continue working and serving user requests.


    ![](img/608267d7803dc57a1a896ad121f37868_28_0.png)


    Figure 1.2 Other microservices continue to run while the shopping cart microservice
    is being deployed.


    Being able to deploy each microservice individually is important because in a
    microservice system there are many microservices, and each may collaborate with
    several others. At the same time, development work is done on some or all of the
    microservices in parallel. If you had to deploy all or groups of them in lockstep,
    managing the deployments would quickly become unwieldy, typically resulting in
    infrequent and big, risky deployments. This is something you should avoid. Instead,
    you want to be able to deploy small changes to each microservice frequently, resulting
    in small, low-risk deployments.'

  md: "kubectl. As mentioned, we will deploy the event consumer as a CronJob that\
    \ will be called on a schedule. To do that, we add the following to the end of\
    \ the “loyalty-program.yaml” file created in the previous section:\n\n# Listing\
    \ 5.16　Kubernetes manifest for the loyalty program event consumer\n\n```\n```yaml\n\
    ---\napiVersion: batch/v1beta1\nkind: CronJob\nmetadata:\n  name: loyalty-program-consumer\n\
    spec:\n  schedule: \"*/1 * * * *\"\n  jobTemplate:\n    spec:\n      template:\n\
    \        spec:\n          containers:\n            - name: loyalty-program\n \
    \             image: your_unique_registry_name.azurecr.io/\n                loyalty-program:1.0.2\n\
    \              imagePullPolicy: IfNotPresent\n              env:\n           \
    \     - name: STARTUPDLL\n                  value: \"consumer/EventConsumer.dll\"\
    \n              restartPolicy: Never\n          concurrencyPolicy: Forbid\n```\n\
    ```\n\n![](img/608267d7803dc57a1a896ad121f37868_148_0.png)\n\nThe schedule defined\
    \ here means the event consumer will run once every minute. This can be adjusted\
    \ based on the specifics of the event consumer. Some events are rare and do not\
    \ require immediate reaction. In those cases, the schedule can be much slower.\
    \ Some events happen often, in which case we might want to keep a one-minute schedule\
    \ but read larger batches every time the event consumer runs.\n\nTo deploy the\
    \ event consumer, we use loyalty-program.yaml again:\n\n```\n`> kubectl apply\
    \ -f loyalty-program.yaml`\n```\n\nRerunning this command is quite fine. Kubernetes\
    \ will figure out if there are any changes to make and apply only the changes.\n\
    \nNow that the event consumer has also been deployed, we should see a CronJob\
    \ in Kubernetes too:\n\n```\n```text\n> kubectl get cronjob\nNAME            \
    \             SCHEDULE    SUSPEND  ACTIVE  LAST SCHEDULE  AGE\nloyalty-program-consumer\
    \     */1 * * * *  False    0       20s             1m20s\n```\n```\n\nWe can\
    \ also see the loyalty program event consumer by looking at the last schedule\
    \ column. In my case, the CronJob was triggered 20 seconds ago."

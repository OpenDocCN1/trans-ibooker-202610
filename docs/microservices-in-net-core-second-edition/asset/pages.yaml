    # Building applications


    This part of the book adds a finishing touch to the picture: how to create applications
    for end users. You''ve learned how to break down a system into microservices and
    how to create those microservices. In chapter 12, you''ll put a GUI on top of
    your microservices so end users can take full advantage of their functionality.'
  merge: -1

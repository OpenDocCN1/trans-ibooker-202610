  md: 'container image with the compiled shopping cart microservice. The steps in
    the Dockerfile are as follows:


    +   - Build the shopping cart code—The first part of the Dockerfile builds the
    shopping cart code using a Docker image that contains the .NET SDK and calls first
    `dotnet restore` and then `dotnet build`. This is just like we did in chapter
    2 to build the shopping cart locally, except we use a couple of extra options
    to indicate that we want a release build and to specify output folders.

    +   - Publish the shopping cart microservice—The second part of the Dockerfile
    uses the `dotnet publish` command to copy the files needed at runtime from the
    build output folder (/app/build) to a new folder called /app/publish.

    +   - Create a container image based on ASP.NET—The third and final step in the
    Dockerfile creates the final container image, which is the result of the multi-stage
    build described in the Dockerfile. The step is based on an ASP.NET Docker image
    from Microsoft. That image comes with the ASP.NET runtime. We add the files from
    the /app/publish folder and specify that the entry point to the container image
    is `dotnet ShoppingCart.dll`, which is a command that runs the compiled ASP.NET
    application in the ShoppingCart.dll.


    To make sure the Dockerfile runs a clean build, we add a .dockerignore with these
    lines that make sure any bin and obj folders are not copied into the container:


    ```

    [B|b]in/

    [O|o]bj/

    ```


    With this Dockerfile in place, we are ready to build a shopping cart container
    image and to run it.


    # 3.2.2 Building and running the shopping cart container


    The next step is to build a shopping cart container image from the Dockerfile
    we just added. First, make sure you have Docker running and then open a command
    line and go to the root of shopping cart—where the Dockerfile is. Then issue this
    Docker command:


    ```

    > docker build . -t shopping-cart

    ```


    This can take a while the fist time. Be patient. Subsequent builds will be faster.
    The output of the `docker build` is rather long. When it is successful the last
    few lines of the output are similar to


    ```

    Successfully built 8d448ba53088

    Successfully tagged shopping-cart:latest

    ```


    possibly followed by this warning if you are on Windows:


    ```

    SECURITY WARNING: You are building a Docker image from Windows against a non-Windows
    Docker host. All files and directories added to build context will have ''-rwxr-xr-x''
    permissions. It is recommended to double-check and reset permissions for sensitive
    files and directories.

    ```'

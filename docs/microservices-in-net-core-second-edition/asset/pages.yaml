- pgno: 30
  md: 'effect in the product catalog. That would mean a tight, undesirable coupling
    between the shopping cart and product catalog microservices: one might cause downtime
    or bugs in the other.


    Now consider deploying a new version of the shopping cart microservice. You’d
    either have to redeploy the product catalog microservice or need some sort of
    dynamic code loading capable of switching out the shopping cart code in the running
    process. The first option goes directly against microservices being individually
    deployable. The second is complex and at a minimum puts the product catalog microservice
    at risk of going down due to a deployment to the shopping cart microservice.


    Speaking of complexity, why should a microservice consist of more than one process?
    You are, after all, trying to make each microservice as simple as possible to
    handle.


    Let’s consider a recommendation microservice. It implements and runs the algorithms
    that drive recommendations for your e-commerce site. It also has a database that
    stores the data needed to provide recommendations. The algorithms run in one process,
    and the database runs in another. Often, a microservice needs two or more processes
    so that it can implement everything (such as data storage and background processing)
    it needs in order to provide a capability to the system.


    # OWNS ITS OWN DATA STORE


    A microservice owns the data store where it stores the data it needs. This is
    another consequence of a microservice’s scope being a complete capability. Most
    business capabilities require some data storage. For instance, a product catalog
    microservice needs some information about each product to be stored. To keep the
    product catalog loosely coupled with other microservices, the data store containing
    the product information is completely owned by the microservice. The product catalog
    microservice decides how and when the product information is stored. As illustrated
    in figure 1.4, other


    ![](img/608267d7803dc57a1a896ad121f37868_30_0.png)


    *Figure 1.4*  One microservice can’t access another’s data store.'

    will set up on Azure will be based on Linux servers, so we can safely ignore the
    warning.


    You are now ready to run the newly built container image with this command:


    ```

    > docker run --name shopping-cart --rm -p 5000:80 shopping-cart

    ```


    This starts the shopping cart container and maps port 80 inside the container
    to port 5000 outside the container, as shown in figure 3.2. This means that you
    can access the shopping cart on http://localhost:5000 and use the endpoints the
    same way we did in chapter 2.


    The details of the command above are that


    +   - `--name` gives the container a name; in this case, shopping-cart.

    +   - `--rm` means that the container is automatically removed when the container
    exits. This is nice during development to avoid cluttering your localhost machine
    with too many old containers.

    +   - `-p 5000:80` means that the container exposes port 5000 and listens to traffic
    on that port. Any incoming traffic to port 5000 is forwarded to port 80 inside
    the container.

    +   - `shopping-cart` at the end of the command is the name of the container image
    to run.


    To stop the shopping cart container, you can use the docker stop command:


    ```

    > docker stop shopping-cart

    ```



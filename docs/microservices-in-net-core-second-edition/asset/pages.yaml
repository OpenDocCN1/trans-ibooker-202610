- pgno: 209
  md: "```\nusing System.Reflection;\nusing Microsoft.AspNetCore.Mvc.Controllers;\n\
    using Microsoft.Extensions.DependencyInjection;\n\npublic class FixedControllerProvider\
    \ : ControllerFeatureProvider\n{\n    private readonly Type[] controllerTypes;\n\
    \n    public FixedControllerProvider(params Type[] controllerTypes)\n    {\n \
    \       this.controllerTypes = controllerTypes;\n    }\n\n    protected override\
    \ bool IsController(TypeInfo typeInfo)\n    {\n        return this.controllerTypes.Contains(typeInfo);\n\
    \    }\n}\n\npublic static class MvcBuilderExtensions\n{\n    public static IMvcBuilder\
    \ AddControllersByType(\n        this IServiceCollection services,\n        params\
    \ Type[] controllerTypes)\n        =>\n        services\n            .AddControllers()\n\
    \            .ConfigureApplicationPartManager(mgr =>\n            {\n        \
    \        mgr.FeatureProviders.Remove(\n                    mgr.FeatureProviders.First(f\
    \ =>\n                        f is ControllerFeatureProvider));\n            \
    \    mgr.FeatureProviders.Add(\n                    new FixedControllerProvider(controllerTypes));\n\
    \            });\n}\n```\n\nCustom implementation of the controller provider\n\
    \nOverride the method used to identify controllers.\n\nThe extension method\n\n\
    Make the service collection aware of controllers.\n\nGet access to feature providers.\n\
    \nRemove the default controller provider feature.\n\nAdd a custom controller provider\
    \ feature.\n\nWe will use this extension in later tests too as a convenient way\
    \ to control the scope of a test.\n\nFor the rest of this chapter, we’ll work\
    \ at the code level and implement unit tests and service-level tests for the loyalty\
    \ program microservice. When you implemented loyalty program in chapter 5, it\
    \ didn’t have an event feed, but for these examples, you’ll add one that other\
    \ microservices can subscribe to.\n\n# 8.3 Writing unit tests using Microsoft.AspNetCore.TestHost\n\
    \nIn this section, you’ll implement some unit tests for the endpoints in the loyalty\
    \ program microservice. In chapter 5, you saw that the loyalty program has three\
    \ command and query endpoints:"

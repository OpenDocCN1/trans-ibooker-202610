  md: "product information, the user can’t add items to their shopping cart, which\
    \ means the e-commerce site can’t sell the items to the user. On the other hand,\
    \ product information doesn’t change often, so you could store a copy of it in\
    \ the shopping cart and only request it from the product catalog when the copy\
    \ doesn’t already contain the information. One way to populate such a copy is\
    \ by caching responses from the product catalog. Caching product information has\
    \ some significant advantages:\n\n+   - It makes the shopping cart more resilient\
    \ to failures in product catalog.\n+   - The shopping cart microservice will perform\
    \ better when the product information is present in the cache.\n+   - Fewer calls\
    \ made from the shopping cart microservice mean less stress is put on the product\
    \ catalog microservice.\n\nFor now, you won’t implement caching; we’ll return\
    \ to the subject of caching for the sake of robustness in chapter 7.\n\nEven with\
    \ caching in place, some calls from the shopping cart to the product catalog are\

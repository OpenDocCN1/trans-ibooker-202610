    # Alternatives to Azure Kubernetes Service


    Azure is by no means the only place we can run Kubernetes. The other major public
    clouds—Google Cloud, Amazon Web Services, Digital Ocean, and others—offer similar
    managed Kubernetes services. All of these are easy to set up, and they all offer
    tools to scale and monitor the clusters. The reason I use Azure is familiarity;
    the others are equally viable options.


    If you prefer to manage your own servers, you can also choose to set up Kubernetes
    on your own cloud or on-premise servers. The differences compared to the managed
    Kubernetes services are in the setup and management of the Kubernetes cluster.
    The management of the containers we deploy to Kubernetes is the same in all cases.


    # 3.5.1  Setting up AKS


    The setup we need in order to be ready to work with a Kubernetes cluster in AKS
    consists of four parts:


    +   1. Creating a *resource group* in Azure. A resource group is just a grouping
    of things in Azure. We are putting all the resources for the Kubernetes cluster
    and the container registry in one resource group. This will group everything together
    in the Azure portal and will make it easy for us to clean everything up once we
    are done.

    +   2. Creating a private container registry.

    +   3. Creating a Kubernetes cluster in AKS. We will create a small cluster with
    just one node, and we attach it to the private container registry to allow Kubernetes
    to pull containers from our registry.

    +   4. Logging our local Kubernetes command line—kubectl—into the newly created
    AKS cluster.


    Each of these four parts is performed by an Azure command with the Azure command
    line tool az. The end result in Azure is shown in figure 3.5, an Azure resource
    group


    ![](img/608267d7803dc57a1a896ad121f37868_87_0.png)


    **Figure 3.5** Running the shopping cart on Kubernetes on localhost is almost
    the same as on Azure.'
  merge: -1
  img_proc: true

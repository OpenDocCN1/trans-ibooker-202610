- pgno: 231
  md: 'When everything is okay the endpoint responds with a simple 200 OK response:


    ```

    HTTP/1.1 200 OK

    ```


    The second endpoint—at /health/live—checks the internal health of the microservice
    and, if everything is okay, also responds with a 200 OK status code. What checking
    the internal health of a microservice entails differs from microservice to microservice.


    You can implement both monitoring endpoints using the health check middleware
    that comes with ASP.NET, as illustrated in figure 9.4.


    ![](img/608267d7803dc57a1a896ad121f37868_231_0.png)


    Figure 9.4 You can use ASP.NET''s health check middleware to implement monitoring
    endpoints.


    When a request to the /health/startup endpoint comes in, the health check middleware
    gives a 200 OK response if the microservice is ready to receive requests. When
    a request to the /health/live endpoint comes in, the health check middleware runs
    a health check and then responds with 200 OK if the check succeeded. Other requests
    pass through the monitoring middleware and onto the rest of the pipeline endpoint
    up in the MVC.


    ASP.NET has a built-in health check middleware we can extend with health checks
    specific to our microservices to implement the two monitoring endpoints. Later
    in this chapter, we will implement health checks and configure Kubernetes to use
    them to monitor our microservice.'

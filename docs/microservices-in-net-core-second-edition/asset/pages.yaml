- pgno: 229
  md: '# 9.1 Monitoring needs in microservices


    When you deploy any server-side system into production, you need to be able to
    check the health of the system. You want to know whether it is up, whether it’s
    experiencing failures or errors, and whether it’s performing as well as it usually
    does. This is true of any system. With a traditional monolithic system, you’d
    most likely set up some monitoring and add logging to the system, as shown in
    figure 9.1. Logging is often done many places in the code base—where there’s something
    important to log—and the messages are often stored in a database.


    ![](img/608267d7803dc57a1a896ad121f37868_229_0.png)


    **Figure 9.1** Traditionally, you set up monitoring around a system and add logging
    to the system code that logs messages to a database.


    The situation for a system of microservices is similar. You have the same overarching
    need to monitor the health of the system in terms of availability, performance,
    throughput, and error rates. The difference is that a microservice system consists
    of many small pieces that run independently and are deployed independently, and
    you need to monitor all those small parts. In figure 9.2 that seems complicated,
    but it doesn’t have to be if you stick to a few conventions that let you easily
    make your microservices monitoring friendly. We’ll get to that in a bit.


    In order to monitor a microservice, you add two endpoints that the monitoring
    system will poll. These tell when the microservice is ready to receive requests.
    One endpoint is used during startup and should fail until the microservice is
    fully booted and ready to receive requests, at which point it should succeed.
    The other endpoint is used once the microservice has started and should succeed
    until the microservice is not able to receive requests for some reason. These
    two endpoints fit into how Kubernetes supports monitoring, which we will discuss
    later in the chapter.


    The first endpoint—at `/health/startup`—checks whether everything is ready for
    the microservice to receive requests, which could include things like checking
    database connections, warming a cache, or otherwise making sure the microservice
    has everything it needs (figure 9.3). While the microservice is still starting,
    the endpoint will indicate that the microservice is not yet ready to receive requests
    by responding with a 503 Service Unavailable status code like this:


    ```

    ```http

    HTTP/1.1 503 Service Unavailable


    Unhealthy

    ```

    ```'

    public LoyaltyProgramUser UpdateUser(\n    int userId,\n    [FromBody] LoyaltyProgramUser\
    \ user) =>\n    return RegisteredUsers[userId] = user;\n```\n\nThis ensures that\
    \ all requests to the PUT endpoint that updates users have a valid JWT token.\
    \ But we still cannot be sure that the correct user is updated because simply\
    \ using the user ID is passed in as part of the path; if this user ID is different\
    \ from the user ID in JWT, one user can update another user. To guard against\

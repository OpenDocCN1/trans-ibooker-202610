    \ similar to the MVC controllers you’ve already seen in this book. The new part\
    \ is that you’ll use the `ResponseCache` attribute to add a cache-control header\
    \ to the response that allows clients to cache the response for 24 hours.\n\n\
    ```\nnamespace ProductCatalog\n{\n    using System.Collections.Generic;\n    using\
    \ System.Linq;\n    using Microsoft.AspNetCore.Mvc;\n\n    [Route(\"/products\"\
    )]\n    public class ProductCatalogController : ControllerBase\n    {\n      \
    \  private readonly IProductStore productStore;\n\n        public ProductCatalogController(IProductStore\
    \ productStore) =>\n            this.productStore = productStore;\n\n        [HttpGet(\"\
    \")]\n        [ResponseCache(Duration = 86400)]\n        public IEnumerable<ProductCatalogProduct>\
    \ Get(\n            [FromQuery] string productIds)\n        {\n            var\
    \ products = this.productStore.GetProductsByIds(\n                ParseProductIdsFromQueryString(productIds));\n\
    \            return products;\n        }\n\n        private static IEnumerable<int>\n\
    \            ParseProductIdsFromQueryString(string productIdsString) => ...\n\
    \    }\n```\n\n# Listing 6.8  Adding cache headers to the product list\n\n> Adds\
    \ a cache-control header, with max-age in seconds\n\nThis implementation adds\
    \ a cache-control header to the response that looks like this:\n\n```\ncache-control:\
    \ public,max-age:86400\n```\n\nThe header tells callers that the response may\
    \ be cached for as long as indicated by max-value, which is given in seconds.\
    \ In this case, callers may cache the response for 86,400 seconds (24 hours).\n\
    \n# 6.3.5  Reading and using cache headers\n\nIn chapter 2, you saw code make\

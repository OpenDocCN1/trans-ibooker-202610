- pgno: 1
  md: 'In short, a microservice is a very narrowly focused service that has the following
    characteristics:


    +   - A microservice is responsible for a single capability.

    +   - A microservice is individually deployable.

    +   - A microservice consists of one or more processes.

    +   - A microservice owns its own data store.

    +   - A small team can maintain a few handfuls of microservices.

    +   - A microservice is replaceable.


    You can use these characteristics in two ways:

    to guide the design and implementation of microservices,

    and to recognize microservices when you see them.'
  merge: -1
  img_proc: true

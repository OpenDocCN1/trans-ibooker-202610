- pgno: 35
  md: '# 1.3.3 Robust and scalable


    A microservices-based distributed architecture allows you to scale out each microservice
    individually, based on where bottlenecks occur. Furthermore, microservices favor
    asynchronous event-based collaboration and stress the importance of fault tolerance
    wherever synchronous communication is needed. When implemented well, these properties
    result in highly available, highly scalable systems. We will return to these topics
    in more detail in chapters 5, 6, and 7.


    # 1.4 Costs and downsides of microservices


    Significant costs are associated with choosing a microservices architecture, and
    these costs shouldn’t be ignored:


    +   - Microservice systems are distributed systems. The costs associated with
    distributed systems are well known: they can be harder to reason about and harder
    to test than monolithic systems, and communication across process boundaries or
    across networks is orders of magnitude slower than in-process method calls.

    +   - Microservice systems are made up of many microservices, each of which has
    to be developed, deployed, and managed in production. This means you’ll have many
    deployments and a complex production setup.

    +   - Each microservice is a separate codebase. Consequently, refactorings that
    move code from one microservice to another are painful. You need to invest in
    getting the scope of each microservice just right.


    Before jumping head-first into building a system of microservices, you should
    consider whether the system you’re implementing is sufficiently complex to justify
    the associated overhead.


    # Do microservices perform?


    One question that always seems to pop up in discussions of whether to use microservices
    is whether a system built with microservices will be as performant as a system
    that’s not. The argument against is that if the system is built from many collaborating
    microservices, every user request will involve several microservices, and the
    collaboration between them will involve remote calls. What happens when a user
    request comes in? Do you chain together a long series of remote calls going from
    one microservice to the next? Considering that remote calls are orders of magnitude
    slower than calls inside a process, this sounds slow.


    The problem with this argument is the idea that you’d be making roughly the same
    calls between different parts of the system as you would if everything were in
    one process. First, as we’ll learn in chapters 5 and 7, the interaction between
    microservices should be much less fine-grained than calls within a process tend
    to be. Second, as we’ll discuss in chapters 5 and 6, you’ll prefer event-based
    asynchronous collaboration over making synchronous remote calls, and you’ll store
    copies of the same data in several microservices to make sure it’s available where
    it’s needed. All in all, these techniques drastically reduce the need to make
    remote calls while a user'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'is waiting. Moreover, the fine-grained nature of microservices enables you
    to scale out the specific parts of the system that get congested.


    There isn''t a simple yes-or-no answer as to whether microservices perform well.
    What I can say is that a well-designed microservice system can easily meet the
    performance requirements of many, if not most, systems.


    # 1.5 Greenfield vs. brownfield


    Should you introduce microservices from the get-go on a new project, or are they
    only relevant for large, existing systems? This question tends to come up in discussions
    about microservices.


    The microservices architectural style has grown out of the fact that many organizations''
    systems started out small but have grown big over time. Many of these systems
    consist of a single large application—a monolith that often exposes the well-known
    disadvantages of big, monolithic systems:


    +   - Coupling is high throughout the codebase.

    +   - There''s hidden coupling between subcomponents: coupling that is now obvious
    at first glance can spring from knowledge implicit in the code about how certain
    strings are formatted, how certain columns in a databases are used, and so on.

    +   - Deploying the application is a lengthy process that may involve several
    people and system downtime.

    +   - The system has a one-size-fits-all architecture intended to handle the most
    complex components. If you insist on architectural consistency across the monolith,
    the least complex parts of the system will be over-engineered. This is true of
    layering, technology choices, chosen patterns, and so on.


    The microservices architectural style arose as a result of solving these problems
    in existing monolithic systems. If you repeatedly split subcomponents of a monolith
    into ever smaller and more manageable parts, microservices are eventually created.⁷


    On the other hand, new projects are started all the time. Are microservices irrelevant
    for these greenfield projects? That depends. Here are some questions you need
    to ask yourself:


    +   - Is the system''s scope large enough to justify the complexity of a distributed
    architecture?

    +   - Is the system''s scope large enough to justify the cost of building the
    deployment automation?

    +   - Would this system benefit from the ability to deploy subsystems separately?


    ⁷ Some microservices advocates argue that the correct way to arrive at microservices
    is to apply the Strangler pattern repeatedly to different subcomponents of the
    monolith. See Martin Fowler, “MonolithFirst,” June 3, 2015, http://martinfowler.com/bliki/MonolithFirst.html.'

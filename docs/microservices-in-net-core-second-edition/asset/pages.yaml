    # Docker containers


    Containers are a way of wrapping an application—or in our case, a microservice—in
    a portable image that brings along everything it needs to run from operating system
    to application code to library dependencies. A container image can be built once,
    moved to different environments, and still be expected to work—as long as the
    application code in the container does not make assumptions about the environment.
    In this sense, containers are similar to virtual machines. But where virtual machines
    virtualize the hardware, containers virtualize the operating systems, which allow
    containers to be much smaller. This is important in a microservice context where
    we are going to have many, many microservices. With containers, we are able to
    run many microservices on the same server while maintaining a good level of isolation
    between them.


    We will get to the implementation of these steps soon, but first we will discuss
    why this is a solid approach, and touch on some alternatives.


    # 3.1  Choosing a production environment


    Simply running our microservices on localhost isn’t very interesting. We need
    them to run somewhere our end users can get to them and use them. There are a
    number of options for doing that:


    +   - Running the microservices on your own Windows or Linux servers on-premise.
    The microservices we write are .NET applications, which mean they readily run
    on both Windows and Linux. The HTTP APIs we create are ASP.NET apps and use ASP.NET’s
    web server, Kestrel, which can be put behind a proxy like Nginx or IIS. So, if
    you or your organization prefers an on-premise solution, the microservices we
    create can be hosted in a fairly traditional on-premise environment.

    +   - Using a Platform as a Service (PaaS) cloud option that supports .NET like
    Azure Web Apps or Azure Service Fabric. Using a PaaS option means that you are
    no longer maintaining the underlying infrastructure yourself. You only have to
    maintain your microservices. This does not mean that you have no operations work,
    but the operations you have to do are focused on your microservices, not the underlying
    infrastructure (e.g., you do not need to keep an operating system patched or worry
    about renewing hard drives as they age). You only have to deal with what the code
    in the microservices does.

    +   - Putting microservices into containers and deploying them to a cloud-specific
    container service like Azure’s ACS or Amazon’s ECS. As we will see in this chapter,
    our microservices can easily be put into containers. Both ACS and ECS can run
    these containers and offer tooling to manage the containers. Like a PaaS'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'option, this frees you from maintaining the underlying infrastructure, but
    since containers come with an OS, you will have to keep that up-to-date and patched.


    +   Using cloud-agnostic container orchestrators like Kubernetes, Apache Mesos,
    or RedHat OpenShift. Again containerizing our microservices is easy, and once
    they are in containers, any container orchestrator can run them. There is wide
    variability in this space, and lumping Kubernetes, Mesos, and OpenShift together

- pgno: 104
  md: '# 4.2 The secondary driver for scoping microservices: Supporting technical
    capabilities


    The secondary way to identify scopes for microservices is to look at supporting
    technical capabilities. A supporting technical capability is something that doesn’t
    directly contribute to a business goal but supports other microservices, such
    as integrating with another system or scheduling an event to happen some time
    in the future.


    # 4.2.1 What is a technical capability?


    Supporting technical capabilities are secondary drivers in scoping microservices
    because they don’t directly contribute to the system’s business goals. They exist
    to simplify and support the other microservices that implement business capabilities.


    Remember, one characteristic of a good microservice is that it’s replaceable;
    but if a microservice that implements a business capability also implements a
    complex technical capability, it may grow too large and too complex to be replaceable.
    In such cases, you should consider implementing the technical capability in a
    separate microservice that supports the original one. Before discussing how and
    when to identify supporting technical capabilities, a couple of examples would
    probably be helpful.


    # 4.2.2 Examples of supporting technical capabilities


    To give you a feel for what I mean by supporting technical capabilities, let’s
    consider two examples: an integration with another system, and the ability to
    send notifications to customers.


    # INTEGRATING WITH AN EXTERNAL PRODUCT CATALOG SYSTEM


    In the example POS system, you identified the product catalog as a business capability.
    I also mentioned that product information is maintained in another system, external
    to the microservice-based POS system. That other system is an enterprise resource
    planning (ERP) system. This implies that the product catalog microservice must
    integrate with the ERP system, as illustrated in figure 4.6.


    ![](img/608267d7803dc57a1a896ad121f37868_104_0.png)



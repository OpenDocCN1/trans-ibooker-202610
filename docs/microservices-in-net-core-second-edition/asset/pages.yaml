    Looking at these logs, we will be able to see the special offers event being consumed
    shortly after we make calls to the special offers API.


    With both the special offers microservice and the loyalty program microservice
    running in AKS, we have finished implementing examples of all three styles of
    collaboration: commands, queries, and events.


    # Summary


    +   - There are three types of microservice collaboration:

    +     - Command-based collaboration, where one microservice uses an HTTP POST,
    PUT, or DELETE to make another microservice perform an action

    +     - Query-based collaboration, where one microservice uses an HTTP GET to
    query the state of another microservice

    +     - Event-based collaboration, where one microservice exposes an event feed
    that other microservices can subscribe to by polling the feed for new events

    +   - Event-based collaboration is more loosely coupled than command- and query-based
    collaboration.

    +   - You can use HttpClient to send commands to other microservices and to query
    other microservices.'

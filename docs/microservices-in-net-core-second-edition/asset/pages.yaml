    # Getting started with microservices


    This first part explains what microservices are and why you should care. I''ll
    begin by discussing six characteristics you can use to recognize and guide your
    design of microservices. Along the way, we''ll look at the benefits and costs
    of microservices.


    Toward the end of chapter 1, I''ll give you a whirlwind tour of the technology
    stack used throughout the book; the stack consists of .NET, ASP.NET, and the ASP.NET
    MVC web framework. Chapter 2 moves on to an example of building your first microservice.
    You''ll see how little is needed to get started, and begin to see ASP.NETs strength.
    Chapter 3 shows how to containerize the microservice from chapter 2 and how to
    deploy it to Kubernetes in Azure.


    By the end of part 1, you will have your first microservice running in the cloud.'

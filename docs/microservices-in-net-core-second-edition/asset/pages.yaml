  md: "The plan to implement the monitoring endpoints is as follows:\n\n+   1. Add\
    \ the `/health/live` endpoint to the ASP.NET pipeline.\n+   2. Create the health\
    \ check for the shopping cart database.\n+   3. Add the `/health/startup` endpoint\
    \ to the pipeline.\n\nLet’s get started.\n\n# 9.3.1 Implementing the /health/live\
    \ monitoring endpoint\n\nTo implement the `/health/live` endpoint, we take advantage\
    \ of ASP.NET’s health checks, which allows us to easily add monitoring endpoints.\
    \ First we need to add a health check to the service collection. Next we will\
    \ connect that health check to the `/health/live` endpoint. We will call the health\
    \ check LivenessHealthCheck and add to the service collection by changing the\
    \ ConfigureServices method in Startup to this.\n\n# Listing 9.1 Adding the LivenessHealthCheck\
    \ to the service collection\n\n```\npublic void ConfigureServices(IServiceCollection\
    \ services)\n{\n    services.AddHealthChecks()\n        .AddCheck(\n         \
    \   \"LivenessHealthCheck\",\n            () => HealthCheckResult.Healthy(),\n\
    \            tags: new []{ \"liveness\"});\n    services.AddControllers();\n}\n\
    \n// Annotations:\n// Add facilities supporting health checks.\n// Give the health\
    \ check a name.\n// Add the LivenessHealthCheck.\n// Implement the health check\
    \ to always respond 200 OK.\n// Tag the health check to make it easier to find\
    \ later.\n```\n\nThis code simply adds a health check that always responds 200\

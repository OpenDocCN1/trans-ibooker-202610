    \ use a class to implement the middleware.\n\nTo use a class to implement middleware,\
    \ you can create a class that has a method whose signature is a RequestDelegate.\n\
    \n# Listing 11.8 Middleware implemented in a class\n\n```\npublic class ConsoleMiddleware\n\

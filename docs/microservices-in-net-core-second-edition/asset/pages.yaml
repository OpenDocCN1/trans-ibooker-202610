  md: "```\n```yaml\ncontainers:\n  - name: special-offers\n    image: your_unique_registry_name.azurecr.io/\n\
    \      special-offers:1.0.0\n    imagePullPolicy: IfNotPresent\n    ports:\n \
    \     - containerPort: 80\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name:\

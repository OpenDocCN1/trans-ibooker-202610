    \ are ready to deploy the microservice we will build in the upcoming chapter to\
    \ AKS.\n\n> NOTE To switch back and forth between working with Kubernetes on localhost\
    \ and on Azure, you can change the context of kubectl with the command kubectl\
    \ config use-context <name-of-context>, and you can see which context you have\
    \ available by running kubectl config get-contexts.\n\n# 3.5.2 Running the shopping\
    \ cart in AKS\n\nWith the infrastructure to run microservices in AKS in place,\
    \ we return to the shopping cart microservice. We have already put the shopping\
    \ cart into a container, and we have run that container in Kubernetes on localhost\
    \ by applying the Kubernetes manifest for the shopping cart to the localhost Kubernetes.\
    \ Deploying the shopping cart to AKS is mostly reusing the things we have already\
    \ made, but there are a few tweaks. The remaining steps to deploying and running\
    \ the shopping cart in AKS are as follows:\n\n+   - Tag the shopping cart container\
    \ image, so we have a precise identification of the container image.\n+   - Push\
    \ the tagged container image to our container registry in Azure.\n+   - Modify\
    \ the shopping cart’s Kubernetes manifest to refer to the tagged container.\n\
    +   - Apply the modified manifest to AKS.\n+   - Test that the shopping cart runs\
    \ correctly.\n\nAs listed we need to tag the shopping cart container image that\
    \ we built in section 3.2.2. The tag we will give the container is your_unique_registry_name.azurecr.io/shopping-cart:1.0.0.\
    \ The first part of the tag is the address of our container registry in Azure,\
    \ your_unique_registry_name.azurecr.io; the second part is the name and version\
    \ of the container image. We set the tag as follows:\n\n```\n> docker tag shopping-cart\
    \ your_unique_registry_name.azurecr.io/\n  shopping-cart:1.0.0\n```\n\nWe have\
    \ to push the container image to a container registry to make it available for\
    \ AKS to pull down and run. AKS cannot pull a container image from my or your\
    \ localhost. The registry we use in Azure is private, so any service pulling from\
    \ it or pushing to it must be authenticated. When we created the AKS cluster,\
    \ we used the option --attach-acr MicroservicesInDotnetRegistry, which connects\
    \ the AKS cluster with the container registry called YOUR_UNIQUE_REGISTRY_NAME\

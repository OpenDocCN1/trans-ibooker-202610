  md: '# 7.2 The client side’s responsibility for robustness


    When two microservices collaborate, there’s a client and server, as shown in figure
    7.4. The client is the microservice that sends out HTTP requests, and the server
    microservice handles them. The request shown in figure 7.4 happens to fail; it
    may fail because the server fails, or it may fail because it doesn’t reach the
    server. Once the request has failed, the server can’t do anything about it. The
    server can’t send a response to a failed request; it is already gone at that point.
    Responsibility for handling requests therefore must fall on the client. In other
    words, the client is responsible for making the collaboration robust in the face
    of failing requests.


    ![](img/608267d7803dc57a1a896ad121f37868_184_0.png)


    Figure 7.4 All collaborations between microservices have a client and a server.
    The client sends HTTP requests to the server. The client is responsible for handling
    failed requests.


    When you look at an event-based collaboration, you see a degree of robustness
    in the face of failing requests built into the collaboration itself. Figure 7.5
    shows an event subscriber in one microservice and an event feed in another microservice.
    As you saw in chapter 4, an event subscriber polls the event feed at intervals
    for new events. That way of collaborating means that if a request for new events
    fails, the event subscriber will ask for the same events the next time it polls
    for events. The subscriber can catch up to events in the event feed even though
    some requests fail, and thus the subscriber is robust with regard to failing requests
    for events.


    ![](img/608267d7803dc57a1a896ad121f37868_184_1.png)


    Figure 7.5 If a request for events from an event feed fails, the subscriber will
    request the same events the next time it polls for events.'

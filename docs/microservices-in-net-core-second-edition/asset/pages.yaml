- pgno: 26
  md: 'with. They just need to know how to communicate with each other. Some may communicate
    via queues, a service bus, gRPC, or GraphQL, for instance, depending on system
    requirements; but often, microservices do communicate over HTTP.


    NOTE This book focuses on implementing microservices in .NET using C# and ASP.NET.
    The microservices I''ll show you are small, tightly focused ASP.NET applications
    that collaborate over HTTP.


    NOTE This book focuses on collaboration over HTTP, but the principles guiding
    how the collaboration is designed are not specific to HTTP. I choose to use HTTP
    because it is ubiquitous and familiar to many developers and I want to focus more
    on the design principles than the technology. These principles also apply with
    different technology, notably gRPC, which is gaining in popularity in the .NET
    space and is also a good choice.


    # 1.2 What is a microservices architecture?


    This book focuses on designing and implementing individual microservices, but
    it’s worth noting that the term microservices can also be used to describe an
    architectural style for an entire system consisting of many microservices. Microservices
    as an architectural style is a lightweight form of service-oriented architecture
    (SOA) where the services are each tightly focused on doing one thing and doing
    it well. A system with a microservices architecture is a distributed system with
    a (probably large) number of collaborating microservices.


    The microservices architectural style has been quickly gaining in popularity for
    building and maintaining complex server-side software systems. And understandably
    so: microservices offer a number of potential benefits over both more traditional
    service-oriented approaches and monolithic architectures. Microservices, when
    done well, are malleable, scalable, and robust, and they allow for systems that
    do well on all four of the key metrics identified by Nicole Forsgren et al., Accelerate¹
    and the DORA state of DevOps reports,² namely


    +   1. Deployment frequency

    +   2. Lead time for changes

    +   3. Time to restore service

    +   4. Change failure rate


    This combination often proves elusive for complex software systems. Furthermore,
    it is, as documented by Forsgren et al., a reliable predictor of software delivery
    performance.


    In this book you will learn how to design and implement malleable, scalable, and
    robust microservices that form systems that deliver on all four of these key metrics.


    1 Nicole Forsgren, Gene Kim, and Jez Humble. Accelerate. IT Revolution Press:
    2018.


    2 Nicole Forsgren, Dustin Smith, Jez Humble, and Jessie Frazelle, "Accelerate:
    State of DevOps 2018," https://inthecloud.withgoogle.com/state-of-devops-18/dl-cd.html.'
  merge: -1

    # Summary


    +   - Microservices is an overloaded term used both for the microservices architectural
    style and for individual microservices in a system of microservices.

    +   - The microservices architectural style is a special form of SOA, where each
    service is small and provides one and only one business capability.

    +   - A microservice is a service with a single narrowly focused capability.

    +   - I''ll refer to six characteristics of a microservice in this book:

    +     - Provides a single capability.

    +     - Individually deployable. You must be able to deploy every microservice
    on its own without touching any other part of the system.

    +     - Runs in one or more processes, separate from other microservices.

    +     - Owns and stores the data belonging to the capability it provides in a
    data store that the microservice itself has access to.

    +     - Is small enough that a small team of around five people can develop and
    maintain a few handfuls or more of them.

    +     - Replaceable. The team should be able to rewrite a microservice from scratch
    in a short period of time if, for instance, the codebase has become a mess.

    +   - Microservices go hand-in-hand with continuous delivery:

    +     - Having small, individually deployable microservices makes continuous delivery
    easier.

    +     - Being able to deploy automatically, quickly, and reliably simplifies deploying
    and maintaining a system of microservices.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '+   A system built with microservices allows for scalability and resilience.


    +   A system built with microservices is malleable: it can be easily changed according
    to your business needs. Each microservice by itself is highly maintainable, and
    even creating new microservices to provide new capabilities can be done quickly.


    +   Microservices collaborate to provide functionality to the end user.


    +   A microservice exposes a remote public API that other microservices may use.


    +   A microservice can expose a feed of events that other microservices can subscribe
    to. Events are handled asynchronously in the subscribers but still allow subscribers
    to react to events quickly.


    +   ASP.NET is well suited for implementing microservices.


    +   Kubernetes is the container orchestrator we will use throughout the book.


    +   Most microservices don''t serve HTML from their endpoints, but rather data
    in the form of JSON, for instance. Tools like REST client, Postman, and Fiddler
    are good for testing such endpoints.'

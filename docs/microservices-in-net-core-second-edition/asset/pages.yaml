    \nThere's one small issue to overcome: in order to call middleware, you first\
    \ need to provide it with a value for next. You get around that by passing in\
    \ a RequestDelegate that does nothing:\n\n```\nRequestDelegate noOp = _ => Task.CompletedTask;\n\
    ```\n\n![](img/608267d7803dc57a1a896ad121f37868_280_0.png)\n\nYou'll use no-operation\
    \ middleware in tests as a stub to provide to middleware under test.\n\nWith this\

    > NOTE To follow along with the set up of AKS, you need to have the Azure CLI
    installed and logged into your Azure account. In appendix A you will find instructions
    on installing the Azure CLI.


    To make the AKS setup easy to repeat, I have gathered the commands needed to set
    up AKS in a PowerShell script called create-aks.ps1 that looks like this:


    ```

    az group create --name MicroservicesInDotnet --location northeurope


    az acr create --resource-group MicroservicesInDotnet --name YOUR_UNIQUE_REGISTRY_NAME
    --sku Basic


    az aks create --resource-group MicroservicesInDotnet --name MicroservicesInDotnetAKSCluster
    --node-count 1 --enable-addons monitoring --generate-ssh-keys --attach-acr YOUR_UNIQUE_REGISTRY_NAME


    az aks get-credentials --resource-group MicroservicesInDotnet --name MicroservicesInDotnetAKSCluster

    kubectl get nodes

    ```


    The first four lines correspond exactly to the four parts listed: creating a resource
    group, creating a container registry, creating the AKS cluster, and logging kubectl
    into the cluster. The last line shows the nodes in the cluster, so we know the
    cluster is up and running.


    > NOTE The az acr create ... command needs a unique registry name. If the name

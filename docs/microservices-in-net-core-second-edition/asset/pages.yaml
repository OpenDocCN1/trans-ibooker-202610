- pgno: 316
  md: 'typing dotnet. If the dotnet CLI is already installed, you will receive a help
    text from the CLI; if not, you get an error from Powershell. To install the dotnet
    CLI, go to http://dot.net, click Download, and follow the instructions to install
    the .NET SDK.


    # A.3 Setting up REST client in VS Code


    REST client is a simple text-oriented extension for VS Code that allows you to
    make HTTP requests (see figure A.1). You use such requests throughout the book
    to interact with your microservices. Apart from being simple, REST client has
    the advantage of working on text files with the extension .http, thus making it
    easy to share example HTTP requests through version control. You will find such
    files in the book’s code download and its GitHub repository. Moreover, the same
    files work in Rider in a similar UI.


    ![](img/608267d7803dc57a1a896ad121f37868_316_0.png)


    Figure A.1 REST client uses simple .http files. You make requests by clicking
    Send Request, and the response is shown in the right-hand pane.


    To install REST client, go the Extensions tab in VS Code, search for REST client,
    and click Install.


    # A.4 Docker and Kubernetes


    I use Docker in this book to package microservices as containers ready to deploy
    to a production environment, and I use Kubernetes on Azure as an example of a
    production environment. To be able to build Docker images, you will need to install
    Docker. With Docker installed, you can run and debug your containers, but to be
    able to run the containers the same as on Azure, you will also need Kubernetes.'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'If you are on Windows or Mac, you will be using Docker Desktop, and if you
    are on Linux, you will be using a .deb or .rpm package depending on your Linux
    distribution.


    To install Docker, go to https://docs.docker.com/engine/install/ and follow the
    instructions for your platform. If you are on Windows, you should choose to use
    the WSL2 backend with Linux containers while installing Docker Desktop. Once Docker
    is installed, you should be able to call the docker CLI from your shell.


    On top of Docker, you will need Kubernetes. If you are on Windows or Mac, you
    already have Kubernetes bundled with Docker Desktop and all you have to do is
    enable Kubernetes in the Docker Desktop setting, as shown in figure A.2. This
    will take a while the first time, since Docker Desktop will download, install,
    and start Kubernetes.


    ![](img/608267d7803dc57a1a896ad121f37868_317_0.png)


    Figure A.2 Kubernetes can be enabled in the Docker Desktop settings.


    On Linux, you have to get Kubernetes separately, and there are numerous options.
    One easy option is MicroK8S, which you can install by following the instructions
    at https://microk8s.io/. Once you have MicroK8S installed, you may want to add
    this alias to allow easy access to the Kubernetes command-line tool:


    ```

    > snap alias microk8s.kubectl kubectl

    ```


    Once you have Kubernetes installed, you should be able to call the Kubernetes
    command-line tool—kubectl—from your shell.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# A.5 Azure CLI


    In this book, I use Azure to set up a small Kubernetes cluster that I can deploy
    the microservices to as an example of a production environment. To follow along
    with that, you will need an Azure account and the Azure CLI.


    To create an Azure account go to https://azure.microsoft.com/en-us/free/. To get
    the Azure CLI, head to https://docs.microsoft.com/en-us/cli/azure/install-azure-cli
    and follow the installation instructions for your platform. When you have installed
    the Azure CLI, you can log the CLI into your Azure account by running `az login`
    in your shell.


    Now that you have an IDE, the `dotnet` command-line tool, a tool for working with
    HTTP requests, Docker, Kubernetes, and the Azure CLI, you’re all set to code along
    with the examples throughout the book.'
  merge: -1

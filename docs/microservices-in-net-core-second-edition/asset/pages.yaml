    Now you have an empty project, ready for the implementation of the API Gateway.\n\
    \n# 12.3.2 Creating the product list GUI\n\nThe next step is to create the part\
    \ of the application that lists products. Add a new MVC controller called ProductListController\
    \ to a folder called ProductList in the API Gateway, and add a /productlist endpoint\
    \ to that module. The ProductListController will contain all the endpoints that\
    \ serve the application to end users: it will have endpoints that give end users\
    \ a web GUI and also endpoints used by the JavaScript in that web GUI.\n\nTo keep\
    \ it simple at first, let’s begin with an endpoint that does nothing. Then you’ll\
    \ add a GUI based on a hardcoded list of products, and finally you’ll retrieve\
    \ the real list of products from the product catalog microservice.\n\nThe ProductListController\
    \ will serve the web frontend to end users, but start with the following endpoint\
    \ that always responds with an empty 501 Not Implemented.\n\n# Listing 12.4 Placeholder\
    \ endpoint implementation in the API Gateway\n\n```\nnamespace ApiGateway.ProductList\n\
    {\n    using Microsoft.AspNetCore.Mvc;\n    using System.Threading.Tasks;\n\n\
    \    public class ProductListController : Controller\n    {\n        [HttpGet(\"\
    /productlist\")]\n        public async Task<IActionResult> ProductList([FromQuery]\
    \ int userId)\n            => StatusCode(501);\n    }\n}\n```\n\nThe next step\
    \ is to add a GUI that shows the product list. So far, you’ve returned data—for\
    \ example, in the form of JSON—from all endpoints. Now, you’ll return a GUI, in\
    \ the form of server side-generated HTML using the Razor view engine, which allows\
    \ us to dynamically generate HTML on the server side. To use Razor, you need to\
    \ change the way you configure MVC slightly in the ConfigureServices method in\
    \ the Startup class."

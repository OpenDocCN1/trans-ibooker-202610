    {\n    using Microsoft.AspNetCore.Mvc;\n    using ShoppingCart;\n\n    [Route(\"\
    /shoppingcart\")]\n    public class ShoppingCartController : ControllerBase\n\
    \    {\n        private readonly IShoppingCartStore shoppingCartStore;\n\n   \
    \     public ShoppingCartController(IShoppingCartStore shoppingCartStore)\n  \
    \      {\n            this.shoppingCartStore = shoppingCartStore;\n        }\n\
    \n        [HttpGet(\"{userId:int}\")]\n        public ShoppingCart Get(int userId)\
    \ =>\n            this.shoppingCartStore.Get(userId);\n    }\n```\n\nTells MVC\
    \ that all routes in this controller start with /shoppingcart\n\nDeclares ShoppingCartController\
    \ as a controller\n\nDeclares the endpoint for handling requests to /shoppingcart/{userid},\
    \ such as /shoppingcart/123\n\nAssigns the {userId} from the URL to the userId\
    \ variable\n\nReturns the user's shopping cart. MVC serializes it before sending\
    \ it to the client.\n\nLet’s break down this code.\n\nThe attribute [HttpGet(\"\
    {userId:int}\")] declares that you want to handle HTTP GET requests to endpoints\
    \ matching the pattern inside the parenthesis. The pattern can be a literal string,\
    \ like \"/shoppingcart\"; or it can contain segments that match and capture parts\
    \ of the request URL, like {userid:int}, or it can combine literal strings and\
    \ segments, like \"/shoppingcart/{userId:int}\". The {userId:int} is called userId\
    \ and is constrained to only match integers.\n\nThe HttpGet attribute is followed\
    \ by a method:\n\n```\npublic ShoppingCart Get(int userId) =>\n    this.shoppingCartStore.Get(userId);\n\
    ```\n\nThis is the action method, and it’s the piece of code that’s executed every\
    \ time the shopping cart microservice receives a request to a URL that matches\
    \ the route declaration. For instance, when the API Gateway requests a shopping\
    \ cart via the URL path /shoppingcart/123, this is the method that handles the\
    \ request.\n\nThe action method can take arguments that match segments of the\
    \ URL. For instance, the int userId is matched to the {userId} segment based on\
    \ the names of the argument and the segment.\n\nThe action method uses a shoppingCartStore\
    \ object that the ShoppingCartController constructor takes as an argument and\
    \ assigns to an instance variable:\n\n```\npublic ShoppingCartController(IShoppingCartStore\

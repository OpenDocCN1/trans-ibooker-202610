- pgno: 37
  md: '+   - Can you build sufficient deployment automation?

    +   - Are you sufficiently knowledgeable about the domain to properly identify
    and separate the system’s various independent business capabilities?

    +   - Will the project survive long enough to recover the up-front investment
    in automation and distribution?


    Some greenfield projects meet these criteria and may benefit from adopting a microservices
    architecture from the outset.


    # 1.6 Code reuse


    Adopting a microservices architecture leads to having many services, each of which
    has a separate codebase that you’ll have to maintain. It’s tempting to look for
    code reuse across services in the hope that you can reduce the maintenance effort.
    And although there’s an obvious potential benefit to code reuse, pulling code
    out of a service and into a reusable library incurs a number of costs that may
    not be immediately apparent and that might mean the code reuse isn’t worth it:


    +   - The service now has one more dependency that you must understand in order
    to understand the complete service. This isn’t to say that there’s more code to
    comprehend, but by moving code out of the service and into a library you move
    the code further away, making simple code navigation slower and refactoring more
    difficult.

    +   - The code in the new library must be developed and maintained with multiple
    use cases in mind. This tends to take more effort than developing for just one
    use case.

    +   - The shared library introduces a form of coupling between the services using
    it. Updates to the library driven by the needs of service A may not be needed
    in service B. Should service B update to the new version of the library even though
    it’s not strictly necessary? If you upgrade B, it will have code it doesn’t need—and
    worse, B will run the risk of errors caused by that code. If you don’t upgrade,
    you’ll have several versions of the library in production, further complicating
    the library’s maintenance. Both cases incur some complexity, either in service
    B or in the combined service landscape.


    These points apply particularly to business code, which should almost never be
    reused across microservices. That type of reuse leads to harmful coupling between
    microservices and identifying a new business capability. Implementing it in a
    new microservice is usually a better option.


    With these points in mind, you should be wary of code reuse and only judiciously
    attempt it. There is, however, a case to be made for reusing infrastructure code
    that implements technical concerns.


    To keep a service small and focused on providing one capability well, you’ll often
    prefer to write a new service from scratch rather than add functionality to an
    existing'

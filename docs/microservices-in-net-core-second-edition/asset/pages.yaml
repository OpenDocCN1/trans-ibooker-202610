- pgno: 187
  md: 'This approach clearly doesn’t work for all situations. If a user is waiting
    for a response, it makes no sense to retry an hour later, because the user will
    have given up long before, so the software should also give up and give a degraded
    response sooner. On the other hand, if the request is initiated based on something
    the system does on its own—for example, as part of handling an event—you can often
    wait a long time.


    Next, we’ll discuss another useful pattern for making collaborations robust: the
    circuit breaker pattern. Then we’ll move on to code and implement both the fast-
    and slow-paced styles of retries.


    # 7.2.2 Robustness pattern: Circuit breaker


    The circuit breaker pattern is a different take on dealing with failing requests.
    (For further reading about the circuit breaker and related patterns, see Michael
    T. Nygard’s book, Release It! Design and Deploy Production-Ready Software, 2nd
    ed., Pragmatic Programmers, 2018.) As you saw in the previous section, retrying
    failing requests can add to the problem by putting the server under stress; therefore,
    you must limit the number of retries. The circuit breaker pattern takes this line
    of.


    Figure 7.8 If several requests in a row have failed, is the next one likely to
    fail? In many cases, yes.'
  merge: -1

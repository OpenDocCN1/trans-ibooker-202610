  md: '# 9.2 **Logging needs in microservices**


    In addition to monitoring each individual microservice, you also need to send
    out log messages regarding failures, errors, performance, and whatever else you
    need insight into. As discussed in chapter 7, you can introduce a centralized
    logging microservice that receives log messages from all the other microservices,
    saves them (e.g., in a search engine), and provides easy access to them through
    dashboards and search UIs (see figure 9.5). Again, you want to be able to easily
    set up each microservice to send log messages to the logging microservice.


    ![](img/608267d7803dc57a1a896ad121f37868_232_0.png)


    **Figure 9.5** All microservices send log messages to the central logging microservice.'

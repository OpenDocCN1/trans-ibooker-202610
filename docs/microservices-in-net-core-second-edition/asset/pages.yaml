    # 6.2.2 Rule 2: Replicate for speed and robustness


    The second force at play when deciding where a piece of data should be stored
    in a microservices system is locality. There’s a big difference between a microservice
    querying its own database for data and a microservice querying another microservice
    for that same data. Querying its own database is generally both faster and more
    reliable than querying another microservice.


    Once you’ve decided on the ownership of data, you’ll likely discover that your
    microservices need to ask each other for data. This type of collaboration creates
    a certain coupling: one microservice querying another means the first is coupled
    to the other. If the second microservice is down or slow, the first microservice
    will suffer.


    To loosen this coupling, you can cache query responses. Sometimes you’ll cache
    the responses as they are, but other times you can store a read model based on
    query responses. In both cases, you must decide when and how a cached piece of
    data'

  img_proc: true
- pgno: 311
  md: "This endpoint receives some data—a product ID—in the body of the POST request\
    \ and delegates it to the shopping cart microservice by sending it an HTTP POST\
    \ request. The shopping cart—as you’ve seen in earlier chapters—handles adding\
    \ the product to the shopping cart, storing the updated shopping cart, and raising\
    \ an event that notifies subscribers about the update.\n\nTo use this endpoint\
    \ from the application, you need to add a bit of JavaScript to the view: a function\
    \ that calls the new endpoint and replaces the current page with the page returned\
    \ from the endpoint.\n\n# Listing 12.15 Calling the endpoint to add a product\
    \ to the shopping cart\n\n```\nasync function buy(productId) {\n  const params\
    \ = new URLSearchParams(location.search);\n  const rawResponse =\n    await fetch('/shoppingcart/'\
    \ + params.get('userId'), {\n      method: 'POST',\n      headers: {\n       \
    \ 'Accept': 'application/json',\n        'Content-Type': 'application/json'\n\
    \      },\n      body: JSON.stringify(productId)\n    });\n  window.location.reload(true);\n\
    }\n```\n\nFunction that should be used by the BUY button\n\nCall the new endpoint\
    \ in the ProductListController.\n\nRefresh the page.\n\nThis function adds a product\
    \ to the shopping cart. It should be called whenever the user clicks one of the\
    \ BUY! buttons, so add an onclick handler to the BUY! button by changing the line\
    \ in the view that renders the button for each product in the product list, as\
    \ follows:\n\n```\n<html>\n...\n  <button class=\"btn btn-primary\" type=\"button\"\
    \ onclick=\"buy(@Current.ProductId);\">\n    BUY!\n  </button>\n...\n</html>\n\
    ```\n\nCalls the buy function with the product ID for the current product in the\
    \ iteration over the list of products\n\nThat’s all you need to do to make the\
    \ BUY! buttons work.\n\n# 12.3.5 Letting users remove products from the shopping\
    \ cart\n\nThe last bit you need to implement will let users remove products from\
    \ their shopping cart. Similar to the previous section, that means adding an endpoint\
    \ to ProductListController and adding an onclick handler to the X buttons in the\
    \ shopping cart part of the application. Add a DELETE endpoint that again mainly\
    \ delegates to the shopping cart microservice."
  merge: -1
  img_proc: true
- pgno: 312
  md: "# Listing 12.16 Endpoint to remove a product from the shopping cart\n\n```\n\
    [HttpDelete(\"/shoppingcart/{userId}\")]\npublic async Task<OkResult> RemoveFromCart(\n\
    \    int userId,\n    [FromBody] int productId)\n{\n    var request = new HttpRequestMessage(\n\
    \        HttpMethod.Delete,\n        $\"/shoppingcart/{userId}/items\");\n   \
    \ request.Content =\n        new StringContent(JsonSerializer.Serialize(new[]\
    \ {productId}));\n    var response = await this.shoppingCartClient.SendAsync(request);\n\
    \    response.EnsureSuccessStatusCode();\n    return Ok();\n}\n```\n\nTo use this\
    \ endpoint, add another JavaScript function to the view, which is very similar\
    \ to the previous JavaScript function except this one calls the DELETE endpoint.\n\
    \n# Listing 12.17 Calling the endpoint to remove a product from the shopping cart\n\
    \n```\nasync function removeFromCart(productId){\n    const _params = new URLSearchParams(location.search);\n\
    \    const rawResponse =\n        await fetch('/shoppingcart/' + _params.get('userId'),\

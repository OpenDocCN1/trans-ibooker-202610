  md: 'user registration API is covered, the event consumer is covered, the interaction
    between the API and event consumer is covered, and the collaboration with the
    special offers and notifications microservices is covered. Moreover, with the
    MocksHost and the code for starting the loyalty program API in a test host in
    place, writing other scenarios covering even more of the microservice is quite
    straightforward.


    You can run the service-level test in PowerShell or bash with dotnet test or in
    your IDE of choice. This test is relatively slow—about 400 ms on my laptop—which
    is why we need to strike a balance between the coverage and confidence service-level
    tests give and the speed and precision unit tests give.


    # Summary


    +   - The test pyramid tells you to have few system-level tests that test the
    complete system, several service-level tests for each microservice, and many unit
    tests for each microservice.

    +   - System-level tests are likely to be slow and are very imprecise.

    +   - You should write system-level tests for important success scenarios to provide
    some test coverage for most of the system.

    +   - Service-level tests are likely to be somewhat slow, but they’re faster and
    more precise than system-level tests.

    +   - You should write service-level tests for success scenarios and important
    failure scenarios for each microservice. This adds more test coverage to each
    microservice than just the system-level tests.

    +   - You can use the process for writing service-level tests as the basis for
    writing contract tests that verify the assumption one microservice makes about
    the API and behavior of another microservice. In terms of the test pyramid, contract
    tests are between system-level tests and service-level tests.

    +   - Unit tests are fast and should be kept fast. They’re also precise because
    they target a specific, narrow piece of functionality.

    +   - You should write unit tests for success and failure scenarios alike. Use
    them to cover edge cases that are harder to cover with higher-level tests.

    +   - I recommend working in an outside-in fashion with each microservice: write
    service-level tests first and then begin writing unit tests when the service-level
    tests become awkward to work with.

    +   - The Microsoft.AspNetCore.TestHost library is a powerful companion to ASP.NET
    that makes it easier to test endpoints in ASP.NET applications.

    +   - You use the test host and TestServer from Microsoft.AspNetCore.TestHost
    to test endpoints through the familiar API of an HttpClient that lets you simulate
    HTTP requests. Calls through HttpClients created by the TestServer look exactly
    like real HTTP requests to the endpoint MVC controllers.

    +   - You can test endpoints in a test host with both real and mocked data stores.'
  merge: -1
  img_proc: true

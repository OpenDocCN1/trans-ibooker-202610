    # ### 9.4.2 Trace ID is included in outgoing HTTP requests


    Not only does ASP.NET read trace IDs from incoming traceparent headers, it also
    automatically adds traceparent headers to outgoing requests made with HttpClient,
    so we do not have to do anything extra to get traceparent headers that include
    the trace ID on outgoing requests. For instance, the requests the shopping cart
    microservice makes to the product catalog microservice already include traceparent
    headers, so the trace IDs are sent along to the product catalog microservice,
    meaning that we can trace requests across microservices in the logs.


    # ### 9.4.3 Logging unhandled exceptions


    As we discussed earlier, things fail from time to time. In these cases it is important
    to have logs that show how the failure occurred. MVC will catch any other unhandled
    exception from controllers and log the exception message. Like any other log message,
    these logs will include a trace ID. This means we can trace what led to the unhandled
    exception. We can find the original user request and all other log messages made
    along'

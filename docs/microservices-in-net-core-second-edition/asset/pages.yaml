    \          },\n            body: JSON.stringify(productId)\n        });\n    window.location.reload(true);\n\
    }\n```\n\nNext, use this JavaScript function from the X button in the shopping\
    \ cart part of the view:\n\n```\n<html>\n...\n<button class=\"btn btn-link\" onclick=\"\
    removeFromBasket\">X</button>\n...\n</html>\n```\n\nWith this code in place, the\
    \ example application works! The user can add products to and remove them from\
    \ their shopping cart.\n\n# Summary\n\n+   There's a spectrum of possible kinds\

  md: "with the container registry before it is allowed to push container images to\
    \ the registry. This authentication is done using the Azure CLI like this:\n\n\
    ```\n> az acr login --name YOUR_UNIQUE_REGISTRY_NAME\n```\n\nNow the tagged container\
    \ image can be pushed to our private Docker registry in Azure with this Docker\
    \ command:\n\n```\n> docker push your_unique_registry_name.azurecr.io/shopping-cart:1.0.0\n\
    ```\n\nThe shopping cart container image is now available for our AKS cluster\
    \ to pull, but we have to tell it to do so. To that end, we have to modify the\

- pgno: 16
  md: '# about this book


    *Microservices in .NET* is a practical introduction to writing microservices in
    .NET using powerful yet easy-to-use technologies, like the simple MVC controllers
    and middleware. I’ve tried to present the material in a way that will enable you
    to use what you learn right away. To that end, I’ve tried to tell you why I build
    things the way I do, as well as show you exactly how to build them.


    # Who should read this book


    *Microservices in .NET* has 12 chapters spread across four parts.


    Part 1 gives a quick introduction to microservices, answering what they are and
    why they’re interesting. This part also introduces ASP.NET, MVC, middleware, and
    Kubernetes, the main technologies used throughout the book.


    +   - Chapter 1 introduces microservices—what they are and why they matter. It
    introduces the six characteristics of microservices that I use to guide the design
    and implementation of them. At the end of the chapter, we say hello to ASP.NET
    and MVC.

    +   - Chapter 2 is a comprehensive example of coding a microservice using ASP.NET,
    along with the Polly library. At the end of the chapter, we have a complete, albeit
    simple, microservice.

    +   - Chapter 3 gives a quick introduction to containerizing ASP.NET microservices
    and deploying them to Kubernetes—both locally and in the Azure cloud.


    Part 2 covers how to split a system into microservices and how to implement functionality
    in a system of microservices.


    +   - Chapter 4 covers how to identify microservices and decide what to put into
    each. This chapter is about the design of a system of microservices as a whole.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '+   - Chapter 5 shows how to design and implement the collaboration between
    microservices. This chapter discusses the different ways microservices can collaborate
    and shows how to implement those collaborations.

    +   - Chapter 6 discusses where data should be stored in a system of microservices
    and how some of the data may be replicated across several microservices.

    +   - Chapter 7 explains and demonstrates the implementation of some important
    techniques for making microservice systems robust.

    +   - Chapter 8 takes a thorough look at testing a microservice system, including
    testing the complete system, testing each microservice, and testing the code inside
    the microservices.


    Part 3 shows how to speed up development of new microservices by building a solid
    microservice platform leveraging features of ASP.NET and Kubernetes, tailored
    toward the needs of your particular system. Such a platform provides implementation
    of many important concerns that cut across the entire system of microservices,
    such as logging, monitoring, and security. In this part, you’ll build such a platform
    and see how it’s used to create new microservices quickly.


    +   - Chapter 9 explains the importance of monitoring and logging in a microservice
    system and shows how to leverage ASP.NET and Kubernetes to implement consistent
    logging, tracing, and monitoring across all your microservices.

    +   - Chapter 10 discusses the highly distributed nature of a microservice system,
    which poses some security concerns. As an example, I’ll also walk you through
    using Kubernetes to secure the collaboration between microservices.

    +   - Chapter 11 builds on top of chapters 9 and 10 to create a microservice platform
    by taking code from the previous chapters and packaging it in NuGet packages ready
    to be shared across microservices. The chapter includes an introduction to middleware,
    as well as an example of creating a new microservice using the platform.


    Part 4 consists of chapter 12, which rounds off the book with some approaches
    to creating end-user applications for a microservices system. The chapter also
    shows how to build a small application on top of some of the microservices from
    earlier chapters.


    Together, the 12 chapters will teach you how to design and code microservices
    using a lightweight, no-nonsense, .NET-based technology stack.


    # About the code


    Most chapters in this book have sample code. All of this can be found in the download
    for this book on Manning’s site at https://www.manning.com/books/microservices-in-net-second-edition,
    or in the Git repository at https://github.com/horsdal/microservices-in-dotnet-book-second-edition.
    The code is based on .NET 5, so you need to install .NET, the dotnet command-line
    tool, and a suitable IDE. You can find information on how to set these up in the
    appendix.'

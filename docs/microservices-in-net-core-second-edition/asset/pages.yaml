- pgno: 128
  md: '# 5.1.2  Events: Asynchronous collaboration


    Collaboration based on events is asynchronous. That is, the microservice that
    publishes the events doesn’t call the microservices that subscribe to the events.
    Rather, the subscribers process new events when they’re ready to process them.
    When we use HTTP to implement this style of collaboration, the subscribers poll
    for new events. That polling is what I’ll call *subscribing* to an event feed.
    Although the polling is made out of synchronous requests, the collaboration is
    asynchronous because publishing events is independent of any subscriber polling
    for events.


    In figure 5.7, you can see the loyalty program microservice subscribing to events
    from the special offers microservice. Special offers can publish events whenever
    something happens in its domain, such as every time a new special offer becomes
    active. Publishing an event, in this context, means storing the event in the special
    offers data store. The loyalty program won’t see the event until it makes a call
    to the event feed on special offers. When that happens is entirely up to the loyalty
    program. It can happen right after the event is published or at any later point
    in time.


    ![](img/608267d7803dc57a1a896ad121f37868_128_0.png)


    As with the other types of collaboration, there are two sides to event-based collaboration.
    One side is the microservice that publishes events through an event feed, and
    the other is the microservices that subscribe to those events.


    # EXPOSING AN EVENT FEED


    A microservice can publish events to other microservices via an *event feed*,
    which is just an HTTP endpoint—at “/events,” for instance—to which that other
    microservice can make requests and from which it can get event data. Figure 5.8
    shows the components


    ![](img/608267d7803dc57a1a896ad121f37868_128_1.png)'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'in the special offers microservice. Once again, the microservice has the same
    standard set of components that you’ve seen several times already. In figure 5.8,
    the components involved in implementing the event feed are highlighted.


    The events published by the special offers microservice are stored in its database.
    The `EventStore` component has the code that reads events from that database and
    that writes them to the database. The domain model code can use `EventStore` to
    store the events it needs to publish. The Event Feed component is the implementation
    of the HTTP endpoint that exposes the events to other microservices: that is,
    the `/events` endpoint.


    The Event Feed component uses EventStore to read events from the database and
    then returns the events in the body of an HTTP response. Subscribers can use query
    parameters to control which and how many events are returned.


    # SUBSCRIBING TO EVENTS


    Subscribing to an event feed essentially means you poll the events endpoint of
    the microservice that you subscribe to. At intervals, you send an HTTP GET request
    to the `/events` endpoint to check whether there are any events you haven’t processed
    yet.


    Figure 5.9 is an overview of the loyalty program microservice, which shows that
    it consists of two processes. We’ve already talked about the web process, but
    the event-subscriber process is new.


    ![](img/608267d7803dc57a1a896ad121f37868_129_0.png)


    **Figure 5.9** The event subscription in the loyalty program microservice is handled
    in an event-subscriber process.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'The event-subscriber process is a background process that periodically makes
    requests to the event feed on the special offers microservice to get new events.
    When it gets back a batch of new events, it processes them by sending commands
    to the notifications microservice to notify registered users about new special
    offers. The SpecialOffersSubscriber component is where the polling of the event
    feed is implemented, and the Notifications-Client component is responsible for
    sending the command to notifications. The rate at which the event subscribes gets
    events can differ quite a bit based on the specific use case. Often, events are
    fetched every 30 seconds or every few minutes, but there are also cases where
    fetching events occur frequently, like every second, or where fetching events
    seldom occur, like every hour, and is the right thing to do.


    This is the way you implement event subscriptions: microservices that need to
    subscribe to events have a subscriber process with a component that polls the
    event feed. When new events are returned from the event feed, the subscriber process
    handles the events based on business rules.


    # Events over queues


    An alternative to publishing events over an event feed is to use a queue technology,
    like RabbitMQ, AWS SQS, or Azure Queue Storage. In this approach, microservices
    that publish events push them to a queue, and subscribers read them from the queue.
    Events must be routed from the publisher to multiple subscribers, and how that’s
    done depends on the choice of queue technology and may require additional technologies
    on top of the queue. As with the event-feed approach, the microservice subscribing
    to events has an event-subscriber process that reads events from the queue and
    processes them. Event replay can also be built with queues but may require a bit
    of extra work depending on the queue technology.


    This is a viable approach to implementing event-based collaboration between microservices.
    But this book uses HTTP-based event feeds for event-based collaboration because
    it allows events to be replayed at any time and it’s a simple yet robust and scalable
    solution.


    # Event over gRPC


    As mentioned, command and queries map directly to gRPC’s remote procedure calls.
    But what about events? gRPC has a concept of streaming that allows for keeping
    an HTTP/2 connection open and sending data through the connection. Streaming in
    gRPC works in both directions—from client to server or from server to client.
    To model events using gRPC streaming, you can create a remote procedure that works
    somewhat like an event feed: it allows event subscribers to call the procedure
    and get events back in a response stream.


    # 5.1.3 Data formats


    So far, we’ve focused on exchanging data in JSON format. JSON works well in many
    situations, but there are reasons you might want to use something else:


    +   If you need to exchange a lot of data, a more compact format may be needed.
    Text-based formats such as JSON and XML are a lot more verbose than binary formats
    like protocol buffers.'
  merge: -1
  img_proc: true

  md: "```\nusing System;\nusing System.Net;\nusing System.Net.Http;\nusing System.Threading.Tasks;\n\
    using LoyaltyProgram;\nusing Microsoft.AspNetCore.Hosting;\nusing Microsoft.AspNetCore.TestHost;\n\
    using Microsoft.Extensions.Hosting;\nusing Xunit;\n\npublic class UsersEndpoints_should\
    \ : IDisposable\n{\n    private readonly IHost host;\n    private readonly HttpClient\
    \ sut;    // Remember that sut stands for \"system under test.\"\n\n    public\
    \ UsersEndpoints_should()\n    {\n        this.host = new HostBuilder()\n    \
    \        .ConfigureWebHost(x => x\n                .UseStartup<Startup>()    //\
    \ Real LoyaltyProgram startup\n                .UseTestServer())         // Use\
    \ the test server so requests are in process.\n            .Start();\n       \
    \ this.sut = this.host.GetTestClient();   // The host uses the test server to\
    \ create a test HttpClient.\n    }\n\n    [Fact]\n    public async Task respond_not_found_when_queried_for_unregistered_user()\n\
    \    {\n        var actual = await this.sut.GetAsync(\"/users/1000\");    1((CO3-5))\n\
    \        Assert.Equal(HttpStatusCode.NotFound, actual.StatusCode);\n    }\n\n\
    \    public void Dispose()\n    {\n        this.host?.Dispose();\n        this.sut?.Dispose();\n\
    \    }\n}\n```\n\nThe most interesting part of this test class is in the constructor,\
    \ where you create a host and an HttpClient object. When xUnit runs, it creates\
    \ an instance of UsersEndpoints_should and then calls a method with the Fact attribute\
    \ on that instance. Unlike most other .NET test frameworks, xUnit creates a new,\
    \ clean instance for each Fact method.\n\nThe host object in the previous listing\
    \ is initialized with the real Startup class from LoyaltyProgram. This means the\
    \ LoyaltyProgram application that the HttpClient calls into is wired up the same\
    \ way it is when it runs on top of a real web server and receives real HTTP requests.\n\
    \nLet’s move on to a test that registers a new user and then queries it to check\
    \ that it was registered as it should be. Add the following test to the UsersEndpoints_should\
    \ class."

- pgno: 313
  md: '+   - Applications over microservices can be built as composite applications
    that draw in functionality and GUI components from various microservices and combine
    them together to form a complete application.

    +   - The composite application pattern allows microservices to stay decoupled,
    but the composite application itself can become complex.

    +   - Applications over microservices can be built using the API Gateway pattern,
    which puts one general-purpose API in front of all the microservices. That API
    Gateway is the only microservice the application uses directly, but it delegates
    all requests to other microservices in which the business capabilities are implemented.

    +   - The API Gateway pattern can simplify application development and decouple
    applications from the server-side architecture.

    +   - An API Gateway can grow bigger over time because it needs to expose all
    functionality. This is especially true if several applications use the API Gateway
    because it needs to support all scenarios in all applications architecture.

    +   - Applications over microservices can be built with the backend for frontend
    (BFF) pattern. A BFF is a microservice that acts like an API Gateway, but for
    only one application.

    +   - BFFs are less prone to growing bigger than API Gateways are.

    +   - BFFs are tailored to the single application using them and should therefore
    make that application as simple to implement as possible.

    +   - When you build web applications over microservices, you’re free to use server-side
    rendering, client-side rendering, or a mix.

    +   - All three patterns—composite application, API Gateway, and BFF—support server-side
    rendering, client-side rendering, and mixes of the two.

    +   - The implementation of an API Gateway is very thin: all the endpoints you
    added to the example API Gateway delegate to other microservices.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# appendix

    Development

    environment setup


    This appendix describes how to set up a development environment for working with
    the code you write throughout this book. The development environment has five
    parts:


    +   - *An IDE*—You can choose between using Visual Studio 2019 or newer, Visual
    Studio Code (VS Code for short), or JetBrains Rider. Visual Studio is Windows-only,
    whereas Visual Studio Code and JetBrains Rider both work on Windows, Mac, and
    Linux.

    +   - *dotnet cli*—You need the dotnet command-line tool to build, create, build,
    and run .NET projects from the command line.

    +   - *REST client*—You need a tool for making HTTP requests. There are many such
    tools, including cURL, Fiddler, and Postman; I tend to use the REST client plug-in
    for Visual Studio Code, which I find easy to use, works on Windows, Mac, and Linux,
    and is compatible with the built-in HTTP request tools in JetBrains’ IDEs.

    +   - *Docker and Kubernetes*—You need Docker installed to be able to build and
    run containers. Furthermore, you need Kubernetes on top of Docker to be able to
    work with Kubernetes deployments on the localhost.

    +   - *Azure cli*—You need the Azure command-line tool to set up a Kubernetes
    cluster in Azure.


    I’ll walk you through installing and getting up and running with the development
    environment in the following sections.


    # A.1  Setting up an IDE


    There are three IDEs I recommend you use with this book’s code. Which one you
    choose is a matter of taste; all work fine with everything in the book. I, for
    one,'
  merge: -1
  img_proc: true

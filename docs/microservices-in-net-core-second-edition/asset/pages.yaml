  md: "![](img/608267d7803dc57a1a896ad121f37868_70_0.png)\n\n# Figure 2.10 The shopping\
    \ cart microservice event feed publishes events to the rest of the e-commerce\
    \ system.\n\nImplementing the event feed involves these steps:\n\n+   - *Raise\
    \ events.* The code in the shopping cart domain model raises events when something\
    \ significant (according to the business rules) happens. Significant events are\
    \ when items are added to or removed from a shopping cart.\n+   - *Store events.*\
    \ The events raised by the shopping cart domain model are stored in the microservice’s\
    \ data store.\n+   - *Publish events.* Implementing an event feed allows other\
    \ microservices to subscribe by polling.\n\nWe’ll work through each of these in\
    \ turn.\n\n# RAISING AN EVENT\n\nIn order to be published, events must first be\
    \ raised. It’s usually the domain code in a microservice that raises events, and\
    \ that’s the case in the shopping cart microservice. When items are added to a\
    \ shopping cart, the ShoppingCart domain object raises an event by calling the\
    \ Raise method on IEventStore and providing the data for the event.\n\nRemember\
    \ that I prefer to gather related things in folders, so I add a new folder called\
    \ EventFeed and add two files to it: Event.cs and EventStore.cs. The first file\
    \ contains the model type for events, shown in the following listing.\n\n# Listing\
    \ 2.14 Simple event type\n\n```\nnamespace ShoppingCart.EventFeed\n{\n    using\
    \ System;\n\n    public record Event(\n        long SequenceNumber,\n        DateTimeOffset\
    \ OccuredAt,\n        string Name,\n        object Content);\n}\n```"

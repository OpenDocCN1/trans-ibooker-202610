  md: '![](img/608267d7803dc57a1a896ad121f37868_202_0.png)


    **Figure 8.2** The loyalty program microservice collaborates with a number of
    other microservices through all three types of collaboration: events, queries,
    and commands.


    To test a loyalty program in isolation, you can create mock versions of its collaborators.
    As shown in figure 8.3, when a loyalty program interacts with a mocked collaborator,
    it gets back a hardcoded response.


    ![](img/608267d7803dc57a1a896ad121f37868_202_1.png)


    **Figure 8.3** For service-level testing, the loyalty program microservice interacts
    with mocked versions of its collaborators. The mocked microservices respond to
    requests with hardcoded responses.


    A service-level test for the loyalty program microservice could do the following:


    +   1. Send a command to create a user.

    +   2. Wait for the loyalty program microservice to query a mock special offer
    microservice for events and then receive a hardcoded event about a new special
    offer.

    +   3. Record any commands sent to the notifications microservice and assert that
    a command for a notification to the new user about the new special offer was sent.


    When a test like this passes, you can have confidence that important aspects of
    the loyalty program microservice work. When it fails, you know that the problem
    is within the loyalty program itself.


    Service-level tests are much more precise than system-level tests because they
    cover only a single microservice: if such a test fails, the problem should lie
    within the'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'microservice under test, assuming the test setup itself isn’t buggy. Because
    microservices are small—they’re replaceable, after all—knowing that a problem
    lies within a certain microservice is a lot more precise than what you get from
    system-level tests.


    To call the endpoints implemented in our MVC controllers, we’ll use the Microsoft.AspNetCore.TestHost
    library. This library lets you write tests that make calls to ASP.NET endpoints
    in memory. The calls go through ASP.NET in exactly the same way HTTP requests
    would, but without going through the network stack. To the code in our controllers,
    calls made through the TestServer from Microsoft.AspNetCore.Mvc.Testing look exactly
    like real HTTP requests. On the other hand, service-level tests are still relatively
    slow, because the microservice uses a real database and because it interacts with
    its mocked collaborators over HTTP.


    # Contract tests


    As you know by now, there’s a lot of collaboration between microservices in a
    microservices system. You implement the collaborations as requests from one microservice
    to another. If you aren’t careful, changes in an endpoint can break the microservices
    that call that endpoint. This is where contract tests (https://martinfowler.com/bliki/ContractTest.html)
    come into the picture.


    When any two microservices in the system collaborate, the one making requests
    to the other has some expectations about how the other will behave. That is, given
    a collaboration, the calling microservice expects the called microservice to implement
    a certain contract. A contract test is a test with the purpose of determining
    whether the called microservice implements the contract expected by the calling
    microservice.


    Contract tests are written from the point of view of the caller and are there
    for the sake of the calling microservice: as long as the contract test passes,
    the assumptions the caller makes about the contract are still valid. Consequently,
    the contract tests are part of the caller’s code base. They aren’t part of the
    same code base as the endpoints they test. Contract tests shouldn’t have any knowledge
    of how the microservices they test are implemented. This is where contract tests
    differ from service-level tests. With service-level tests, you isolate the microservice
    under test by providing it with mocked microservices in place of its collaborators.
    You don’t want to do that for contract tests because the contract tests shouldn’t
    know about the other collaborators of the microservice they test. In other words,
    contract tests run against the complete system.


    Because contract tests are part of the code base of one microservice but test
    things in other microservices, and because they run against the complete system,
    it can be a good idea to run them against a QA or staging environment. Moreover,
    it’s a good idea to have them run automatically every time the microservice under
    test is deployed. When a contract breaks, it’s a strong indication that the collaboration
    between the microservice the contract test belongs to and the microservice under
    test is broken, too.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '![](img/608267d7803dc57a1a896ad121f37868_204_0.png)


    A contract test runs against the complete system. It may, for instance, run against
    a staging or QA environment, where the complete microservices system is deployed.


    In terms of implementation, contract tests look a bit like the service-level tests
    you’ll write later in this chapter. The difference is that contract tests are
    a slightly higher level in the test pyramid, between system-level tests and service-level
    tests. Contract tests don’t set up mocked collaborators, whereas service-level
    tests do, and they work by making real HTTP requests to the microservice under
    test.


    My recommendation regarding service-level tests is that you should write such
    tests for the success versions of all functionality the microservice under test
    offers. Such tests will naturally use all endpoints of the microservice as well
    as rely on any event subscriptions in the microservice. In other words, they will
    cover all success paths in the microservice. In general, I recommend writing service-level
    tests only for the most important failure scenarios. Again, the number of service-level
    tests needed and how many failure scenarios they should cover depends on the system
    and the cost of failure in that particular system.


    # 8.1.4 Unit-level tests: Testing endpoints from within the process


    The tests at the bottom of the test pyramid also deal with a single microservice,
    but these don’t deal with the entire microservice; they interact with the parts
    of the microservice under test directly and in memory using an HttpClient created
    by the TestServer from the Microsoft.AspNetCore.TestHost library.


    At the unit-test level, I’ll show you two kinds of tests (see figure 8.4): one
    that uses a database and one that uses a mock in place of the database. I consider
    both unit tests, even though the first type uses a database, be it a fully fledged
    database or an in-memory database. Two things make a test a unit test: its scope
    is a small piece of functionality, and the test code and the production code in
    the microservice run in the same process.


    ![](img/608267d7803dc57a1a896ad121f37868_204_1.png)


    Figure 8.4 At the unit-test level, there are two kinds of tests: those that use
    a database and those that don’t.


    The narrow scope of a unit test makes it precise: when it fails, the problem lies
    in a small amount of code. A narrow scope also enables you to write tests that
    cover failure scenarios properly. Both types of unit tests are faster than service-level
    tests, but of course the tests that mock out databases are faster than those that
    use a database.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'Sometimes you may also have even narrower unit tests that test the business
    logic in the microservices directly by instantiating domain objects and testing
    them directly. I take a pragmatic approach to deciding how narrow the narrowest
    unit tests should be. I use a test-first workflow that starts from the outside,
    with tests that use TestServer to make calls to endpoints in my microservices.
    I start with tests that cover the broad strokes of what the endpoint should do,
    and then I progressively add tests for more details. Only when it becomes awkward
    to test a particular detail through the endpoint handler do I begin to write narrower
    unit tests. For instance, covering a particular case in the business logic with
    tests that call through the endpoint handler might require a lot of setup code.
    That’s a signal to switch down to a test that has a narrower scope—just those
    cases in the business logic. I’ll write tests for those cases that work directly
    on the code that should implement that particular part of the business logic.


    For the loyalty program microservice, we need unit tests that test the endpoint
    that lets us create users with a number of different inputs covering both possible
    valid and invalid inputs. Likewise, we need tests that try to read both existing
    and nonexistent users from the query endpoint that lets us read users. We need
    similar tests for the other endpoints in the microservice. The loyalty program
    is sufficiently simple that we don’t need to switch down to tests that are narrower
    than the microservice’s endpoints. So, the units tests I’ll show you later all
    work by calling endpoint handlers through TestServer.


    # 8.2 Testing libraries: Microsoft.AspNetCore.TestHost and xUnit


    In this chapter, we’ll use two new libraries:


    +   - `Microsoft.AspNetCore.TestHost`

    +   - `xUnit`


    I’ll give you a brief introduction to both, and then we’ll implement tests for
    some of the microservices we wrote in earlier chapters.


    # 8.2.1 Meet Microsoft.AspNetCore.TestHost


    The `Microsoft.AspNetCore.TestHost` library is a companion to ASP.NET that makes
    it easy to test endpoints. With it, we configure a TestHost in much the same way
    we configure a web host in the production code. The TestHost uses the TestServer,
    which can create HttpClient objects for use in tests. An HttpClient created by
    TestServer is the same HttpClient we are used to working with in production code.
    It allows us to use methods like GetAsync, PostAsync, PutAsync, and DeleteAsync
    to call GET, POST, PUT, and DELETE endpoints in controllers, respectively. These
    calls go through the entire ASP.NET pipeline. This means that the dependency injection
    is set up and used as usual, middleware (which we will talk about in the next
    chapter) run as usual, MVC filters run as usual, and deserialization and serialization
    run as usual. In short, to the endpoint the call looks exactly like a real HTTP
    request, but it all happens in process, so it’s a good deal faster than a real
    HTTP request going through the network stack would be. The return value of each
    method is an HttpResponseMessage just'
  merge: -1
  img_proc: true
- pgno: 206
  md: "like we usually get from an HttpClient, and we can use it just like we otherwise\
    \ would and inspect headers, status, and the response body.\n\nThe Microsoft.AspNetCore.TestHost\
    \ library hooks into the normal configuration of ASP.NET application, so apart\
    \ from the TestServer and the HttpClients, it creates everything with a TestHost\
    \ the same as it would with a real host. Therefore, we can do all the usual configuration\
    \ including, but not limited to\n\n+   - Overriding registration in the dependency\
    \ injection container, for instance, to provide mock objects in place of real\
    \ ones\n+   - Adding special hooks to the ASP.NET pipeline\n+   - Configuring\
    \ logging, for instance, to allow tests to inspect the contents of log messages\n\
    \n# 8.2.2 Meet xUnit\n\nxUnit (https://xunit.net/) is a unit-test tool for .NET.\
    \ It has a library part that allows you to write automated tests and a runner\
    \ part that can run those tests. To write a test with xUnit, you create a method\
    \ with a Fact attribute over it and put the code to perform the test there. The\
    \ xUnit runner scans for methods with a Fact attribute and executes all of them.\
    \ In addition, xUnit has an API for making assertions in tests. If an assertion\
    \ fails, the xUnit runner picks up the failure and reports it back when it’s finished\
    \ running tests. The xUnit test runner can be run by dotnet and is therefore well\
    \ suited for the projects you’re building in this book.\n\nOther .NET unit-test\
    \ tools similar to xUnit—NUnit, for instance—are available and will also work\
    \ for everything we will do in this chapter, so feel free to pick your own favorite.\n\
    \n# 8.2.3 xUnit and Microsoft.AspNetCore.TestHost working together\n\nPutting\
    \ Microsoft.AspNetCore.TestHost and xUnit together, you can write succinct tests\
    \ for endpoints implemented in MVC controllers. In section 8.3.1, you’ll set up\
    \ a project for these unit tests and run them with dotnet; but for now, I want\
    \ to give you a quick peek at how the tests will look. The following test calls\
    \ the GET endpoint in TestController and makes the assertion that the response\
    \ status code is “200 OK.”\n\n# Listing 8.1 Simple controller test using xUnit\
    \ and Microsoft.AspNetCore.TestHost\n\n```\nnamespace LoyaltyProgramUnitTests\n\
    {\n    using System;\n    using System.Net;\n    using System.Net.Http;\n    using\
    \ System.Threading.Tasks;\n    using Microsoft.AspNetCore.Builder;\n    using\
    \ Microsoft.AspNetCore.Hosting;\n    using Microsoft.AspNetCore.Mvc;\n    using\
    \ Microsoft.AspNetCore.TestHost;\n    using Microsoft.Extensions.Hosting;\n  \
    \  using Xunit;\n```"

  md: "# 7.3.1 **Implementing a fast-paced retry strategy with Polly**\n\nAs shown\
    \ in figure 7.10, the API Gateway microservice sends commands to the loyalty program\
    \ microservice. We’ll only look at adding a retry strategy to the register-user\
    \ command here, because the code for adding a retry strategy to the update-user\
    \ command is essentially the same.\n\nFirst, you need to add the Polly NuGet package\
    \ to the API Gateway microservice. The code that sends the commands to the loyalty\
    \ program microservice is in LoyaltyProgramClient in the API Gateway. You use\
    \ Polly to set up a retry policy that uses an exponential backoff. Polly splits\
    \ the setup of a policy from the execution of the policy; that is, Polly allows\
    \ you to set up different policies—a retry policy, for instance—and then later\
    \ execute a piece of code under the policy. In the case of a retry strategy, that\
    \ means retrying the piece of code if it fails. The retry policy for the register-user\
    \ command is set up as shown.\n\n```\n```csharp\nusing System;\nusing Polly;\n\
    \npublic class LoyaltyProgramClient\n{\n    private static readonly IAsyncPolicy<HttpResponseMessage>\n\
    \        ExponentialRetryPolicy =\n            Policy<HttpResponseMessage>\n \
    \               .Handle<HttpRequestException>()\n                .OrTransientHttpStatusCode()\n\
    \                .WaitAndRetryAsync(\n                    3,\n               \
    \     attempt =>\n                        TimeSpan.FromMilliseconds(100 * Math.Pow(2,\
    \ attempt))\n                );\n}\n```\n```\n\nWith the retry strategy set up,\
    \ you can use it to wrap the call to the loyalty program microservice. We can\
    \ chose to do this directly or through the integration between HttpClient and\
    \ Polly. First let’s look at using the retry policy directly with LoyaltyProgramClient:\n\
    \n```\n```csharp\npublic async Task<HttpResponseMessage>\n    RegisterUser(string\
    \ name)\n{\n    var user = new {name, Settings = new { }};\n    return await ExponentialRetryPolicy\n\
    \        .ExecuteAsync(() =>\n            this.httpClient.PostAsync(\"/users/\"\
    , CreateBody(user)));\n}\n\nprivate static StringContent CreateBody(object user)\
    \ => ...\n```\n```"

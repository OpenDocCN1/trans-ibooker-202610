- pgno: 198
  md: '# Writing tests for microservices


    +   **This chapter covers**

    +   - Writing good automated tests

    +   - Understanding the test pyramid and how it applies to microservices

    +   - Testing microservices from the outside

    +   - Writing fast, in-process tests for endpoints

    +   - Using `Microsoft.AspNetCore.TestHost` for integration and unit tests


    Up to this point, we’ve written a few microservices and set up collaborations
    between some of them. The implementations are fine, but we haven’t written any
    tests for them. As we write more and more microservices, developing systems without
    good automated tests becomes unmanageable. In the first half of this chapter,
    I’ll discuss what you need to test for each individual microservice. Then we’ll
    dive into code, looking first at testing endpoints in isolation, and then at testing
    a complete microservice as if you were sending it requests from another microservice,
    but in-process using the `TestServer` from the `Microsoft.AspNetCore.TestHost`
    library.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# 8.1 What and how to test


    In chapter 1, you saw three characteristics of a microservice that make it good
    for continuous delivery:


    +   - *Individually deployable*—As soon as any small, safe change has been made
    to a microservice, the microservice can be deployed to production. But how do
    you know a change is safe? This is where testing and particularly test automation
    come into the picture. Several other activities, like code reviews, static code
    analysis, and designing public APIs for backward compatibility, also play into
    determining that a change is safe, but testing is where much of your confidence
    will come from.

    +   - *Replaceable*—You should strive to be able to replace the implementation
    of a microservice with another functionally equivalent implementation within the
    normal pace of work. Again, tests play an important role because a good set of
    tests lets you assess whether the new implementation really is equivalent to the
    old one.

    +   - *Maintainable by a small team*—Microservices are sufficiently small and
    focused so that a team can maintain several of them. An advantage is that you
    can write tests that cover all parts of your microservices.


    If you want to become confident about changes quickly and be able to replace a
    badly implemented microservice, testing has to be fast and repeatable. To make
    testing fast and repeatable, you must automate a significant part of it—and that’s
    the focus of this chapter.


    # 8.1.1 The test pyramid: What to test in a microservices system


    The *test pyramid* shown in figure 8.1 is a tool you can use to guide which kinds
    of tests you should write and how many you should have of each kind. You can find
    variations of the test pyramid in different writings; all of them put tests on
    different levels, where the levels at the top of the pyramid are broad in scope
    and the tests at the bottom are narrow. The test pyramid illustrates that you
    should aim for having many narrowly focused tests (the ones at the wide bottom
    of the pyramid) and only a few broadly scoped tests (the ones at the narrow top).


    ![](img/608267d7803dc57a1a896ad121f37868_199_0.png)'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'The version of the test pyramid that I use here has three levels:


    +   - *System tests (top level)*—Tests that span the complete system of microservices
    and are usually implemented through the GUI.

    +   - *Service tests (middle level)*—Tests that work against one, but only one,
    complete microservice.

    +   - *Unit tests (bottom level)*—Tests that test one small piece of functionality
    in a microservice. Unit tests call code in the microservice under tests in process
    and usually involve only part of a microservice.


    Note that when I use the term *unit test*, the word *unit* refers to a small piece
    of functionality. I define the scope of a unit test not in terms of any particular
    code construct, like a class or a method, but rather in terms of functionality.
    When we look at implementations of unit tests later, you’ll see that unit tests
    can easily span all layers of a microservice, such as from an MVC controller,
    through a domain object, or down to a data access class.


    Although the test pyramid tells you to have more tests as you move down the levels,
    exactly how many tests you should have on each level is situational. It depends
    on such factors as the size of the system, the complexity of the system, and the
    cost of failure.


    # 8.1.2 System-level tests: Testing a complete microservice system end to end


    The tests at the top of the pyramid have a very broad scope and therefore cover
    a lot of code with just a few tests. Because they have such a broad scope, they’re
    also imprecise. When a system-level test breaks, it isn’t immediately clear where
    the problem lies. The test can potentially use the entire system, so the issue
    could be anywhere.


    An example of a system-level test is one that uses the web UI of the POS system
    we talked about in earlier chapters to add a number of items to an invoice, apply
    a discount code, and pay using a test credit card. If that test passes, it gives
    you confidence that invoices are created, that discounts can be applied, and that
    you can receive credit card payments. During such a system test, you might assert
    that the amount due on the invoice is as expected. If that assertion fails, any
    number of things could have caused the problem: you might be using the wrong price
    for one or more items, you might have applied the discount incorrectly, or you
    might have misinterpreted the invoice data. In other words, such a failure could
    be caused by at least a handful of different microservices. To figure out which
    one is the culprit, you need to investigate.


    The specific way a system-level test fails can give some hints as to where the
    problem lies, but there’s usually a lot of code that could be at fault. From the
    system test alone, it won’t even be clear which microservice caused the failure.
    On the other hand, when system-level tests pass, they give you a good deal of
    confidence.


    The second downside to system-level tests is that they tend to be slow. This again
    is the flip side of them involving the complete system: real HTTP requests are
    made, things are written to real data stores, and real event feeds are polled.'

    # 3.2.1 Adding a Dockerfile to the Shopping Cart microservice


    To put the shopping cart microservice in a container, we first need to add a Dockerfile
    to the root folder of the shopping cart project next to the solution file. The
    Dockerfile is a description of the container we want to build and should look
    like the following code.


    # Listing 3.1 Dockerfile for the shopping cart


    ```

    FROM mcr.microsoft.com/dotnet/core/sdk:3.1 AS build

    WORKDIR /src

    COPY ["ShoppingCart/ShoppingCart.csproj", "ShoppingCart/"]

    RUN dotnet restore "ShoppingCart/ShoppingCart.csproj"

    COPY . .

    WORKDIR "/src/ShoppingCart"

    RUN dotnet build "ShoppingCart.csproj" -c Release -o /app/build

    FROM build AS publish

    RUN dotnet publish "ShoppingCart.csproj" -c Release -o /app/publish

    FROM mcr.microsoft.com/dotnet/core/aspnet:3.1 AS final

    WORKDIR /app

    EXPOSE 80

    COPY --from=publish /app/publish .

    ENTRYPOINT ["dotnet", "ShoppingCart.dll"]

    ```


    There is a lot going on in that Dockerfile, so let’s unpack it piece by piece.
    The first thing to understand is that the Dockerfile describes a multistage build,
    which means that there are multiple discrete steps in the file. The end result
    is a ready-to-run'

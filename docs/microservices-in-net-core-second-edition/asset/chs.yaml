  \ Microsoft.AspNetCore.TestHost 编写这些测试。\n\n## 8.4 Writing service-level tests\n\n\
  让我们继续为整个忠诚度计划微服务编写服务级测试。服务级测试从外部与微服务交互，并为微服务提供其协作者的模拟版本。\n\n忠诚度计划向两个协作者发出请求：特价商品微服务中的事件\
  \ feed 和通知微服务的 API。忠诚度计划的服务级测试按以下步骤进行：\n\n- 1. 在与测试相同的进程中设置两个端点：\n  - 一个用作模拟的特价商品事件\
  \ feed\n  - 一个用作模拟的通知端点\n- 2. 启动忠诚度计划微服务并配置它使用模拟端点代替真实的协作者。这意味着每当忠诚度计划需要调用其协作者时，它将调用其中一个模拟端点。\n\
  - 3. 作为对忠诚度计划端点的请求序列，对忠诚度计划执行一个场景。\n- 4. 记录对模拟端点的任何调用。\n- 5. 对忠诚度计划的响应以及对模拟端点所做的请求进行断言。\n\
  \n图 8.5 显示了忠诚度计划微服务的服务级测试的运行时设置。\n\n![](img/608267d7803dc57a1a896ad121f37868_218_0.png)\n\
  \n图 8.5 服务级测试对被测微服务的 API 执行一个场景，但配置微服务使用在与测试相同的进程中运行的模拟端点代替真实的协作者。当服务级测试运行时，它会向被测微服务发出请求，被测微服务会根据需要向模拟端点发出真实的\
  \ HTTP 请求。测试可以检查被测微服务的响应以及它对模拟端点所做的调用。\n\n你将按照以下步骤创建图 8.5 中的测试设置：\n\n- 1. 为服务级测试创建一个测试项目。\n\
  - 2. 为特价商品事件 feed 和通知端点创建模拟端点。\n- 3. 在测试服务器中启动忠诚度计划 API。事件使用者将在测试需要时被调用。\n- 4. 编写测试代码，对忠诚度计划执行测试场景。\n\
  \n设置就绪后，你将编写一个使用它的测试。\n\n### 8.4.1 Creating a service-level test project\n\n对于服务级测试，你将创建一个新的测试项目，就像你之前创建的单元测试项目一样。也就是说，从\
  \ xUnit 项目模板创建项目并添加 Microsoft.AspNetCore.TestHost NuGet 包。就像单元测试项目一样，服务级测试项目位于生产代码旁边，因此你现在在忠诚度计划中有四个文件夹：\n\
  \n- LoyaltyProgram\n- EventConsumer\n- LoyaltyProgramServiceTests\n- LoyaltyProgramUnitTests\n\
  \n这些是构成忠诚度计划微服务的两个项目——MVC 应用程序和事件使用者——以及与微服务配套的测试项目。\n\n### 8.4.2 Creating mocked\
  \ endpoints\n\n如图 8.5 所示，你需要创建特价商品微服务和通知微服务中忠诚度计划微服务使用的端点的模拟版本。你将通过编写两个简单的 MVC 控制器来实现，每个控制器实现一个返回硬编码响应的端点。列表\

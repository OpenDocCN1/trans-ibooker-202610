  \ LoyaltyProgramUser 的序列化。\n\n## 5.1.2 事件：异步协作\n\n基于事件的协作是异步的。也就是说，发布事件的微服务不会调用订阅该事件的微服务。相反，订阅者会在准备处理时处理新事件。当我们使用\
  \ HTTP 实现这种协作方式时，订阅者会轮询新事件。这种轮询就是我所说的订阅事件源。虽然轮询由同步请求组成，但协作是异步的，因为发布事件与任何订阅者轮询事件无关。\n\
  \n在图 5.7 中，你可以看到忠诚度计划微服务订阅来自特价优惠微服务的事件。特价优惠可以在其领域发生任何事情时发布事件，例如每次有新的特价优惠变为活动状态时。发布事件，在这种上下文中，意味着将事件存储在特价优惠数据存储中。忠诚度计划在向特价优惠上的事件源发出调用之前不会看到该事件。何时发生完全取决于忠诚度计划。它可以在事件发布后立即发生，也可以在任何稍后的时间点发生。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_128_0.png)\n\n与其它类型的协作一样，基于事件的协作也有两方面。一方面是发布事件的微服务，另一方面是订阅这些事件的微服务。\n\
  \n### EXPOSING AN EVENT FEED\n\n微服务可以通过 *event feed* 向其它微服务发布事件，这只是一个 HTTP 端点——例如“/events”——其它微服务可以向其发出请求并从中获取事件数据。图\
  \ 5.8 显示了特价优惠微服务中的组件\n\n![](img/608267d7803dc57a1a896ad121f37868_128_1.png)\n\n\
  在特价优惠微服务中。再次，微服务具有你已经多次看到的同一套标准组件。在图 5.8 中，参与实现事件源的组件被突出显示。\n\n特价优惠微服务发布的事件存储在其数据库中。`EventStore`\
  \ 组件具有从该数据库读取事件并将它们写入数据库的代码。领域模型代码可以使用 `EventStore` 来存储其需要发布的事件。Event Feed 组件是公开事件给其它微服务的\
  \ HTTP 端点的实现：即 `/events` 端点。\n\nEvent Feed 组件使用 EventStore 从数据库读取事件，然后在 HTTP 响应的正文中返回事件。订阅者可以使用查询参数来控制返回哪些以及多少事件。\n\
  \n### SUBSCRIBING TO EVENTS\n\n订阅事件源本质上意味着你轮询你订阅的微服务的事件端点。按间隔，你向 `/events` 端点发送\
  \ HTTP GET 请求以检查是否有尚未处理的事件。\n\n图 5.9 是忠诚度计划微服务的概览，显示它由两个进程组成。我们已经讨论过 web 进程，但事件订阅者进程是新的。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_129_0.png)\n\n**图 5.9** 忠诚度计划微服务中的事件订阅由事件订阅者进程处理。\n\
  \n事件订阅者进程是一个后台进程，定期向特价优惠微服务的事件源发出请求以获取新事件。当它收到一批新事件时，它会通过向通知微服务发送命令来处理它们，以通知已注册用户有关新的特价优惠。SpecialOffersSubscriber\
  \ 组件是实现事件源轮询的地方，而 Notifications-Client 组件负责向通知发送命令。事件订阅获取事件的速率可以根据具体用例而有很大差异。通常，每\
  \ 30 秒或每隔几分钟获取一次事件，但也有获取事件频繁的情况，例如每秒一次，或获取事件很少的情况，例如每小时一次，并且这是正确的做法。\n\n这就是实现事件订阅的方式：需要订阅事件的微服务具有一个订阅者进程，其中包含一个轮询事件源的组件。当从事件源返回新事件时，订阅者进程会根据业务规则处理事件。\n\
  \n### Events over queues\n\n发布事件的另一种选择是使用队列技术，如 RabbitMQ、AWS SQS 或 Azure Queue Storage。在这种方法中，发布事件的微服务将它们推送到队列，订阅者从队列中读取它们。事件必须从发布者路由到多个订阅者，具体如何操作取决于队列技术的选择，可能需要在队列之上使用额外的技术。与事件源方法一样，订阅事件的微服务具有从队列读取事件并处理它们的事件订阅者进程。事件重放也可以使用队列构建，但可能需要根据队列技术做一些额外的工作。\n\
  \n这是实现微服务之间基于事件协作的可行方法。但本书使用基于 HTTP 的事件源进行基于事件的协作，因为它允许随时重放事件，并且它是一个简单但稳健且可扩展的解决方案。\n\
  \n### Event over gRPC\n\n如前所述，命令和查询直接映射到 gRPC 的远程过程调用。那事件呢？gRPC 有一个流式概念，允许保持 HTTP/2\
  \ 连接打开并通过连接发送数据。gRPC 中的流式在两个方向都有效——从客户端到服务器或从服务器到客户端。要使用 gRPC 流式建模事件，你可以创建一个远程过程，其工作方式有点像事件源：它允许事件订阅者调用该过程并在响应流中获取事件。\n\
  \n## 5.1.3 数据格式\n\n到目前为止，我们一直专注于以 JSON 格式交换数据。JSON 在许多情况下效果很好，但你可能想使用其它格式的原因如下：\n\
  \n- 如果你需要交换大量数据，可能需要更紧凑的格式。文本格式如 JSON 和 XML 比二进制格式如协议缓冲区冗长得多。\n- 如果你需要比 JSON 更结构化但仍可读的格式，你可能想使用\
  \ YAML。\n- 如果你的公司使用专有数据格式，你可能需要支持该格式。\n\n在所有这些情况下，你需要能够接收除 JSON 以外的格式数据的端点，它们也需要能够以该其它格式响应。作为示例，使用\
  \ YAML 作为请求体的向忠诚度计划微服务注册用户的请求如下所示：\n\n```\nPOST /users HTTP/1.1\nHost: localhost:5000\n\
  Accept: application/yaml\nContent-Type: application/yaml\n\nName: Christian\nSettings:\n\
  \  Interests:\n  - whisky\n  - cycling\n  - \"software design\"\n```\n\n请求响应以 YAML\
  \ 格式返回\n\n指定请求体为 YAML 格式\n\n提供 YAML 格式的请求体\n\n对此请求的响应也使用 YAML：\n\n```\nHTTP/1.1\
  \ 201 Created\nContent-Type: application/yaml\nLocation: http://localhost:5000/users/1\n\
  \nId: 1\nName: Christian\nSettings:\n  Interests:\n  - whisky\n  - cycling\n  -\
  \ \"software design\"\n```\n\n指定响应体为 YAML 格式\n\n提供 YAML 格式的响应体\n\n上述请求和响应都具有 YAML\
  \ 格式的正文，并且都在 Content-Type 头中指定正文为 YAML。请求使用 Accept 头请求以 YAML 返回响应。此示例展示了微服务如何使用不同的数据格式进行通信，以及它们如何使用\
  \ HTTP 头说明使用哪些格式。\n\n## 5.2 实现协作\n\n本节将向你展示如何为你在图 5.2 中看到的协作进行编码。我将以忠诚度计划微服务作为起点，但我也会深入研究其一些协作方——API\
  \ 网关微服务、发票微服务和特价优惠微服务——以展示协作的两端。\n\n实现协作涉及三个步骤：\n\n- 1. 为忠诚度计划设置项目。正如你之前所做，你将创建一个空的\
  \ ASP.NET 应用程序并添加 ASP.NET MVC。\n\n\n\n\n- 2. 实现图 5.2 所示的基于命令和查询的协作。你将实现忠诚度计划能够处理的所有命令和查询，以及使用它们的协作微服务中的代码。\n\
  \n- 3. 实现图 5.2 所示的基于事件的协作。你将先从 special offers 中的事件馈送开始，然后继续实现忠诚度计划中的订阅。该订阅将位于忠诚度计划的一个新项目中，并由\
  \ Kubernetes CronJob 控制。完成这些步骤后，你就实现了忠诚度计划的所有协作。\n\n忠诚度计划微服务由一个 web 进程组成，其结构与你之前见过的相同。如图\
  \ 5.10 底部所示。稍后，当你实现基于事件的协作时，你将添加另一个我称之为事件订阅者的组件。如图 5.10 顶部所示。\n\n## 忠诚度计划微服务\n\n\
  ![](img/608267d7803dc57a1a896ad121f37868_132_0.png)\n\n图 5.10 忠诚度计划微服务有一个遵循你之前所见结构的\
  \ web 进程，以及一个处理来自 special offers 微服务事件订阅的事件订阅者。本章中我将只展示突出显示组件的代码。\n\n为了专注于协作，我不会展示忠诚度计划微服务中的全部代码，而是只包含\
  \ web 进程中 HTTP API 的代码，以及 event-subscriber 进程中 special offers 事件订阅者的代码。\n\n### 5.2.1\
  \ 为忠诚度计划设置项目\n\n实现忠诚度计划微服务时首先要做的是创建一个空的 ASP.NET 应用程序，并向其中添加 MVC。你在第 1 章和第 2 章中已经这样做过几次了，因此这里不再赘述细节，只是提醒你，你的\
  \ Startup.cs 应该如下所示。\n\n**清单 5.2 带有 MVC 的 Startup 类**\n\n```csharp\nnamespace LoyaltyProgram\n\
  {\n    using Microsoft.AspNetCore.Builder;\n    using Microsoft.AspNetCore.Hosting;\n\
  \    using Microsoft.Extensions.DependencyInjection;\n\n    public class Startup\n\
  \    {\n        public void ConfigureServices(IServiceCollection services)\n   \
  \     {\n            services.AddControllers();\n        }\n\n        public void\
  \ Configure(IApplicationBuilder app, IWebHostEnvironment env)\n        {\n     \
  \       app.UseHttpsRedirection();\n            app.UseRouting();\n            app.UseEndpoints(endpoints\
  \ => endpoints.MapControllers());\n        }\n    }\n}\n```\n\n### 5.2.2 实现命令和查询\n\
  \n现在你有了一个 web 项目，可以承载忠诚度计划微服务所公开端点的实现。如前所列，这些端点包括：\n\n- 一个 HTTP GET 端点，位于 `/users/{userId}`\
  \ 形式的 URL 上，响应用户的表示形式。此端点实现了图 5.3 中的两个查询。\n- 一个 HTTP POST 端点，位于 `/users/`，期望在请求体中包含用户的表示形式，然后在忠诚度计划中注册该用户。\n\
  - 一个 HTTP PUT 端点，位于 `/users/{userId}` 形式的 URL 上，期望在请求体中包含用户的表示形式，然后更新已注册的用户。\n\n\
  你将先实现命令端点，然后再实现查询端点。\n\n### 5.2.3 使用 HTTP POST 或 PUT 实现命令\n\n忠诚度计划微服务中用于处理这两个命令——用于注册新用户的\
  \ HTTP POST 和用于更新用户的 HTTP PUT——所需的代码与你在第 2 章中看到的代码类似。你将首先为注册用户的命令实现一个 action 方法。下面的清单展示了向忠诚度计划注册新用户的请求。\n\
  \n**清单 5.3 注册名为 Christian 的用户的请求**\n\n```http\nPOST /users HTTP/1.1\nHost: localhost:5001\n\
  Content-Type: application/json\nAccept: application/json\n\n{\n  \"name\": \"Christian\"\
  ,\n  \"loyaltyPoints\": 0,\n  \"settings\": { \"interests\": [\"whisky\", \"cycling\"\
  ] }\n}\n```\n\n*正在注册用户的 JSON 表示形式*\n\n**清单 5.4 用于注册用户的 POST 端点**\n\n```csharp\n\
  using System;\nusing System.Collections.Generic;\nusing Microsoft.AspNetCore.Mvc;\n\
  \n[Route(\"/users\")]\npublic class UsersController : ControllerBase\n{\n    [HttpPost(\"\
  \")]\n    public ActionResult<LoyaltyProgramUser> CreateUser(\n        [FromBody]\
  \ LoyaltyProgramUser user)\n    {\n        if (user == null)\n            return\
  \ BadRequest();\n        var newUser = RegisterUser(user);\n        return Created(\n\
  \            new Uri($\"/users/{newUser.Id}\", UriKind.Relative),\n            newUser);\n\
  \    }\n\n    private LoyaltyProgramUser RegisterUser(LoyaltyProgramUser user)\n\
  \    {\n        // store the new user to a data store\n    }\n}\n```\n\n- 请求必须在请求体中包含一个\
  \ `LoyaltyProgramUser`。\n- 使用 201 Created 状态码作为响应。\n- 为方便起见，在响应中返回用户。\n- 在响应中添加\
  \ location 头，因为这是 HTTP 对 201 Created 响应的预期。\n\n上述请求的响应如下所示：\n\n```http\nHTTP/1.1\
  \ 201 Created\nContent-Type: application/json; charset=utf-8\nLocation: /users/4\n\
  {\n  \"id\": 4,\n  \"name\": \"Christian\",\n  \"loyaltyPoints\": 0,\n  \"settings\"\
  : { \"interests\": [\"whisky\", \"cycling\"] }\n}\n```\n\n状态码为 201 Created。\n\n\
  ASP.NET 设置 Content-Type。\n\nLocation 头指向新创建的资源。\n\n这里没有太多新东西需要注意，除了我们使用 `Created`\
  \ 方法来控制 HTTP 响应。`ControllerBase` 基类上有很多这样的便捷方法，在整本书中，我们将使用它们轻松创建我们想要的 HTTP 响应。\n\
  \n在注册用户命令的 action 方法就位后，让我们将注意力转向实现更新用户命令的 action 方法，将其添加到 UsersController 中。这段代码中没有任何你之前没见过的东西。\n\
  \n**清单 5.5 用于更新用户的 PUT 端点**\n\n```csharp\nprivate static readonly IDictionary<int,\
  \ LoyaltyProgramUser>\n    RegisteredUsers = new Dictionary<int, LoyaltyProgramUser>();\n\
  \n[HttpPut(\"{userId:int}\")]\npublic LoyaltyProgramUser UpdateUser(\n    int userId,\n\
  \    [FromBody] LoyaltyProgramUser user)\n    => RegisteredUsers[userId] = user;\n\
  ```\n\n*返回新用户，并让 ASP.NET 将其转换为 HTTP 响应*\n\n命令的 action 只是协作的一方面。另一方面是发送命令的代码。图 5.2\
  \ 显示 API Gateway 微服务向忠诚度计划微服务发送命令。你不会在这里构建完整的 API Gateway 微服务，但在本章的代码下载中，你会发现一个充当\
  \ API Gateway 与忠诚度计划协作的控制台应用程序。这里，我们只关注发送命令的代码。\n\n在 API Gateway 微服务中，你将创建一个名为 `LoyaltyProgramClient`\
  \ 的类，负责处理与忠诚度计划微服务的通信。该类封装了向忠诚度计划微服务构建和发送 HTTP 请求的逻辑。\n\n发送注册用户命令的代码以用户名为输入，创建一个在请求体中包含用户对象的\
  \ HTTP POST，并将其发送到忠诚度计划微服务。在收到来自忠诚度计划的响应后，我们将直接把整个响应作为 `HttpResponseMessage` 返回。这对当前需求来说是一个简单的解决方案，但像这样的客户端类通常还会检查响应的状态码，如果状态码符合预期则反序列化响应体，甚至可能在状态码指示错误时执行错误处理。下面的清单展示了具体实现。\n\
  \n**清单 5.6 API Gateway 微服务注册新用户**\n\n```csharp\nusing System.Net.Http;\nusing System.Text;\n\
  using System.Threading.Tasks;\nusing System.Text.Json;\n\npublic class LoyaltyProgramClient\n\
  {\n    private readonly HttpClient httpClient;\n\n    public LoyaltyProgramClient(HttpClient\
  \ httpClient)\n    {\n        this.httpClient = httpClient;\n    }\n\n    public\
  \ async Task<HttpResponseMessage> RegisterUser(string name)\n    {\n        var\
  \ user = new { name, Settings = new { } };\n        return await this.httpClient.PostAsync(\"\
  /users/\",\n            CreateBody(user));\n    }\n\n    private static StringContent\
  \ CreateBody(object user)\n    {\n        return new StringContent(\n          \
  \  JsonSerializer.Serialize(user),\n            Encoding.UTF8,\n            \"application/json\"\
  );\n    }\n}\n```\n\n![](img/608267d7803dc57a1a896ad121f37868_136_0.png)\n\n类似地，`LoyaltyProgramClient`\
  \ 有一个用于发送更新用户命令的方法。该方法同样封装了发送命令所涉及的 HTTP 通信。\n\n**清单 5.7 API Gateway 微服务更新用户**\n\
  \n```csharp\npublic async Task<HttpResponseMessage> UpdateUser(dynamic user) =>\n\
  \    await this.httpClient.PutAsync(\n        $\"/users/{user.id}\",\n        CreateBody(user));\n\
  ```\n\n![](img/608267d7803dc57a1a896ad121f37868_136_1.png)\n\n这段代码与注册用户命令的代码类似，只是该\
  \ HTTP 请求使用 PUT 方法。在忠诚度计划微服务中实现了命令处理程序，并在 API Gateway 中实现了 `LoyaltyProgramClient`\n\
  \n\nmicroservice，基于命令的协作已实现。API 网关可以注册和更新用户，但目前还无法查询用户。\n\n### 5.2.4 使用 HTTP GET\
  \ 实现查询\n\n忠诚度计划微服务可以处理它需要处理的命令，但它无法回答有关已注册用户的查询。请记住，忠诚度计划只需要一个端点来处理查询。如前所述，处理查询的端点是一个\
  \ HTTP GET 端点，其 URL 形式为“/users/{userId}”，并以用户表示形式响应。该端点实现了图 5.3 中的两个查询。\n\n**Listing\
  \ 5.8 GET endpoint to query a user and their loyalty point by user ID**\n\n```csharp\n\
  namespace LoyaltyProgram.Users\n{\n    using System;\n    using System.Collections.Generic;\n\
  \    using Microsoft.AspNetCore.Mvc;\n\n    [Route(\"/users\")]\n    public class\
  \ UsersController : ControllerBase\n    {\n        private static readonly Dictionary<int,\
  \ LoyaltyProgramUser>\n            RegisteredUsers = new();\n\n        [HttpGet(\"\
  {userId:int}\")]\n        public ActionResult<LoyaltyProgramUser> GetUser(int userId)\
  \ =>\n            RegisteredUsers.ContainsKey(userId)\n                ? (ActionResult<LoyaltyProgramUser>)\
  \ Ok(RegisteredUsers[userId])\n                : NotFound();\n\n        ...\n  \
  \  }\n}\n```\n\n这段代码中没有任何你以前没有见过的内容。同样，API 网关微服务中查询此端点所需的代码也不应该令人惊讶：\n\n```csharp\n\
  public class LoyaltyProgramClient\n{\n    ...     \n    public async Task<HttpResponseMessage>\
  \ QueryUser(string arg) =>\n        await this.httpClient.GetAsync($\"/users/{int.Parse(arg)}\"\
  );\n}\n```\n\n这就是基于查询的协作所需的一切。你现在已经实现了忠诚度计划微服务的命令和查询协作。\n\n### 5.2.5 实现基于事件的协作\n\
  \n现在你已经知道如何实现微服务之间的命令和查询协作，是时候将注意力转向基于事件的协作了。图 5.11 重复了忠诚度计划微服务所涉及的协作。忠诚度计划订阅来自特价优惠的事件，并使用这些事件来决定何时通知已注册用户有关新的特价优惠。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_138_0.png)\n\nFigure 5.11 The event-based\
  \ collaboration in the loyalty program microservice is the subscription to the event\
  \ feed in the special offers microservice.\n\n我们将首先查看特价优惠如何以 feed 的形式公开其事件。然后，我们将返回忠诚度计划并为该服务添加第二个进程，该进程将负责订阅和处理事件。\n\
  \n### Implementing an event feed\n\nYou saw a simple event feed in chapter 2. The\
  \ special offers microservice implements its event feed the same way: it exposes\
  \ an endpoint—\"/events\"—that returns a list of sequentially numbered events. The\
  \ endpoint can take two query parameters—start and end—that specify a range of events.\
  \ For example, a request to the event feed can look like this:\n\n```http\nGET /events?start=10&end=110\
  \ HTTP/1.1\n\nHost: localhost:5002\nAccept: application/json\n```\n\nThe response\
  \ to this request might be the following, except that I’ve cut off the response\
  \ after five events:\n\n```http\nHTTP/1.1 200 OK\nContent-Type: application/json;\
  \ charset=utf-8\n\n[{\n  \"sequenceNumber\": 1,\n  \"occurredAt\": \"2020-06-16T20:13:53.6678934+00:00\"\
  ,\n  \"name\": \"SpecialOfferCreated\",\n  \"content\": {\n    \"description\":\
  \ \"Best deal ever!!!\",\n    \"id\": 0\n  }\n},\n{\n  \"sequenceNumber\": 2,\n\
  \  \"occurredAt\": \"2020-06-16T20:14:22.6229836+00:00\",\n  \"name\": \"SpecialOfferCreated\"\
  ,\n  \"content\": {\n    \"description\": \"Special offer - just for you\",\n  \
  \  \"id\": 1\n  }\n},\n{\n  \"sequenceNumber\": 3,\n  \"occurredAt\": \"2020-06-16T20:14:39.841415+00:00\"\
  ,\n  \"name\": \"SpecialOfferCreated\",\n  \"content\": {\n    \"description\":\
  \ \"Nice deal\",\n    \"id\": 2\n  }\n},\n{\n  \"sequenceNumber\": 4,\n  \"occurredAt\"\
  : \"2020-06-16T20:14:47.3420926+00:00\",\n  \"name\": \"SpecialOfferUpdated\",\n\
  \  \"content\": {\n    \"oldOffer\": {\n      \"description\": \"Nice deal\",\n\
  \      \"id\": 2\n    },\n    \"newOffer\": {\n      \"description\": \"Best deal\
  \ ever - JUST GOT BETTER\",\n      \"id\": 0\n    }\n  }\n},\n{\n  \"sequenceNumber\"\
  : 5,\n  \"occurredAt\": \"2020-06-16T20:14:51.8986625+00:00\",\n  \"name\": \"SpecialOfferRemoved\"\
  ,\n  \"content\": {\n    \"offer\": {\n      \"description\": \"Special offer -\
  \ just for you\",\n      \"id\": 1\n    }\n  }\n}]\n```\n\nContent 属性用于事件特定数据，也是\
  \ SpecialOfferCreated 事件、SpecialOfferUpdated 事件和 SpecialOfferRemoved 事件之间差异出现的地方。每个事件在\
  \ Content 中都有其自己的对象类型。\n\n这就是公开事件 feed 所需的一切。使用基于 HTTP 的事件 feed 发布事件的巨大优势在于其简单性。基于事件的协作可以通过队列系统实现，但这会引入另一个复杂的生产技术，你必须学习使用和维护。某些情况下这种复杂性是合理的，但绝非总是如此。\n\
  \n### Creating an event-subscriber process\n\n订阅事件 feed 本质上意味着你将轮询你订阅的微服务的 events\
  \ 端点。按间隔，你将向“/events”端点发送 HTTP GET 请求，以检查是否有尚未处理的事件。\n\n我们将此周期性轮询实现为两个主要部分：\n\n\
  - 一个简单的控制台应用程序，用于读取一批事件\n- 一个 Kubernetes CronJob，用于按间隔运行控制台应用程序\n\n将这两者结合起来实现了事件订阅：CronJob\
  \ 确保控制台应用程序按间隔运行，而每次控制台应用程序运行时，它都会发送 HTTP GET 请求以检查是否有事件需要处理。\n\n实现事件订阅进程的第一步是使用以下\
  \ dotnet 命令创建一个控制台应用程序：\n\n```powershell\nPS> dotnet new console -n EventConsumer\n\
  ```\n\n并用 dotnet 运行它：\n\n```powershell\nPS> dotnet run\n```\n\n该应用程序为空，因此目前不会发生任何有趣的事情，但在下一节中我们将使其读取事件。\n\
  \n### Subscribing to an event feed\n\n你现在有一个 EventConsumer 控制台应用程序。它所要做的就是读取一批事件并跟踪下一批事件的起点。这按如下方式完成。\n\
  \n**Listing 5.11 Reading a batch of events from an event feed**\n\n```csharp\nusing\
  \ System;\nusing System.IO;\nusing System.Net.Http;\nusing System.Net.Http.Headers;\n\
  using System.Text.Json;\nusing System.Threading.Tasks;\n\n// Read the starting point\
  \ of this batch from a database.\nvar start = await GetStartIdFromDatastore();\n\
  var end = 100;\nvar client = new HttpClient();\n\nclient.DefaultRequestHeaders\n\
  \    .Accept\n    .Add(new MediaTypeWithQualityHeaderValue(\"application/json\"\
  ));\nusing var resp = await client.GetAsync(\n    new Uri($\"http://special-offers:5002/events?start={start}&end={end}\"\
  ));\nawait ProcessEvents(await resp.Content.ReadAsStreamAsync());\nawait SaveStartIdToDataStore(start);\n\
  \nTask<long> GetStartIdFromDatastore(){...}\nasync Task ProcessEvents(Stream content){...}\n\
  Task SaveStartIdToDataStore(long startId){...}\n```\n\n通过上面的代码，EventConsumer 可以读取一批事件，并且每次被调用时，它都会读取下一批事件。剩余的部分是处理事件，如下所示。\n\
  \n**Listing 5.12 Deserializing and then handling events**\n\n```csharp\nasync Task\
  \ ProcessEvents(Stream content)\n{\n    var events =\n        await JsonSerializer.DeserializeAsync<SpecialOfferEvent[]>(content)\n\
  \        ?? new SpecialOfferEvent[];\n    foreach (var @event in events)\n    {\n\
  \        Console.WriteLine(@event);\n        start = Math.Max(start, @event.SequenceNumber\
  \ + 1);\n    }\n}\n```\n\n这里有几点需要注意：\n\n- 此方法跟踪已处理的事件。这确保你不会从 feed 请求已处理的事件。\n-\
  \ 如你之前所见，并非所有事件在 Content 属性中携带相同的数据，因此根据 Name 属性，事件处理可以期望 Content 对象中存在不同的数据。你希望在接受传入的\
  \ 'Content' 属性中的数据时保持宽松——如果特价优惠微服务决定向事件 JSON 添加额外字段，不应造成问题。只要你需要的数据在那里，其余部分可以被忽略。\n\
  - 事件被反序列化为 SpecialOfferEvent 类型。这与用于在特价优惠中序列化事件的 EventFeedEvent 类型不同。这是故意的，因为两个微服务不需要对事件有完全相同的视图。只要忠诚度计划不依赖于不存在的数据，一切都很好。\n\
  \n此处使用的 SpecialOfferEvent 类型很简单，仅包含忠诚度计划中使用的字段：\n\n\n\n```csharp\npublic record\
  \ SpecialOfferEvent(\n    long SequenceNumber,\n    DateTimeOffset OccurredAt,\n\
  \    string Name,\n    object Content);\n```\n\n至此，你已完成事件订阅中C#部分的实现。另一部分——Kubernetes\
  \ CronJob——将在下一节中实现。\n\n## 5.2.6 部署到 Kubernetes\n\n在本节中，我们将把忠诚度计划和特惠微服务部署到 Kubernetes。为此，我们需要执行三个步骤：\n\
  \n- 我们将为这两个微服务构建 Docker 容器。特惠服务的容器与第 3 章中看到的类似。忠诚度计划的容器则有一点不同：它可以根据环境变量的值，要么作为 HTTP\
  \ API 公开我们之前实现的 POST、PUT 和 GET 端点，要么作为上一节中实现的事件消费者运行。这一点接下来会详细说明。\n- 我们将类似第 3 章中部署到\
  \ Kubernetes 的方式部署特惠微服务。\n- 我们将部署忠诚度计划，这将以两种不同配置的副本来部署忠诚度计划容器：一个作为 API 运行，一个作为事件消费者运行。\n\
  \n**注意：** 你可以在代码下载中找到特惠微服务的代码。在这里，我只展示特惠微服务的部署相关部分。\n\n完成这三个步骤后，我们将有三个部分在 Kubernetes\
  \ 中运行：\n\n- 一个用于特惠微服务的 Pod\n- 一个用于忠诚度计划微服务 API 部分的 Pod\n- 一个用于忠诚度计划事件消费者部分的 CronJob\n\
  \n我们还将有两个 deployment 在 Kubernetes 中，一个用于特惠微服务，一个用于忠诚度计划微服务。由于我们将忠诚度计划 API 和忠诚度计划事件消费者视为同一个忠诚度计划微服务的组成部分，因此我们总是将这两者一起部署，并且同样地，我们也会将它们放在同一个\
  \ Kubernetes 清单文件中。不过，它们在运行时是独立运行的，这使我们能够，例如，扩展 API 部分以应对更高的负载，同时仍然只运行一个事件消费者。\n\
  \n## 5.2.7 为忠诚度计划微服务构建 Docker 容器\n\n在将忠诚度计划微服务部署到 Kubernetes 之前，我们需要为其构建一个 Docker\
  \ 容器。为此，我们使用下面的 Dockerfile，它与我们在第 2 章中看到的购物车 Dockerfile 类似。\n\n```dockerfile\nFROM\
  \ mcr.microsoft.com/dotnet/aspnet:5.0 AS final\nWORKDIR /app\nEXPOSE 80\nCOPY --from=publish\
  \ /api/publish ./api\nCOPY --from=publish /consumer/publish ./consumer\nENTRYPOINT\
  \ dotnet $STARTUPDLL\n```\n\n![](img/608267d7803dc57a1a896ad121f37868_145_0.png)\n\
  \n这个 Dockerfile 与我们之前看到的有一些不同。我们之前看到的 Dockerfile 都是构建并发布一个 ASP.NET 应用程序。而这个 Dockerfile\
  \ 构建并发布了一个 ASP.NET 应用程序——忠诚度计划——以及一个 .NET 控制台应用程序——事件消费者。因此，使用这个 Dockerfile 构建的镜像中会同时包含\
  \ `LoyaltyProgram.dll` 和 `EventConsumer.dll`。Dockerfile 的最后一行 `ENTRYPOINT dotnet\
  \ $STARTUPDLL` 表示，当用此 Dockerfile 构建的镜像启动时，它们应当对环境变量 `$STARTUPDLL` 所指向的内容运行 `dotnet`。所以，如果\
  \ `$STARTUPDLL` 等于 `LoyaltyProgram.dll` 的路径，镜像将运行忠诚度计划 API；如果 `$STARTUPDLL` 等于 `EventConsumer.dll`\
  \ 的路径，镜像将运行忠诚度计划事件消费者。\n\n让我们来看看这个 Dockerfile 的实际使用。首先，我们构建一个忠诚度计划的 Docker 镜像：\n\
  \n```bash\n> docker build . -t loyalty-program\n```\n\n现在，我们将忠诚度计划镜像作为 API 部分或事件消费者部分来运行。我们首先尝试通过传入\
  \ `$STARTUPDLL` 中 `LoyaltyProgram.dll` 的路径来将其作为 API 运行：\n\n```bash\n> docker run\
  \ --rm -p 5001:80 -e STARTUPDLL=\"api/LoyaltyProgram.dll\" loyalty-program\n```\n\
  \n该命令还将你本地的 5001 端口映射到容器中的 80 端口。忠诚度计划 API 现在正在运行，你可以在本地 5001 端口调用它。让我们再次运行同一个 Docker\
  \ 镜像，但以事件消费者的方式启动它：\n\n```bash\n> docker run --rm -e STARTUPDLL=\"consumer/EventConsumer.dll\"\
  \ loyalty-program\n```\n\n这将运行事件消费者，但它会无法从特惠事件源获取事件，因为我们没有运行这样一个事件源。我们通过在一个容器中运行特惠微服务，并将其放到与事件消费者相同的\
  \ Docker 网络中来修复这个问题。为此，我们创建一个名为“microservices”的新 Docker 网络：\n\n```bash\n> docker\
  \ network create --driver=bridge microservices\n```\n\n我们添加到 microservices 网络中的容器可以使用容器名和主机名进行通信。我们将在运行特惠微服务时利用这一点，将其添加到\
  \ microservices 网络中，并命名为 special-offers。要执行此操作，请运行以下命令：\n\n```bash\n> docker run\
  \ --rm -p 5002:80 --network=microservices --name=special-offers special-offers\n\
  ```\n\n```yaml\nimagePullPolicy: IfNotPresent\nports:\n  - containerPort: 80\nenv:\n\
  \  - name: STARTUPDLL\n    value: \"api/LoyaltyProgram.dll\"\n---\napiVersion: v1\n\
  kind: Service\nmetadata:\n  name: loyalty-program\nspec:\n  type: LoadBalancer\n\
  \  ports:\n    - name: loyalty-program\n      port: 5001\n      targetPort: 80\n\
  \  selector:\n    app: loyalty-program\n```\n\n覆盖 STARTUPDLL 环境变量以控制容器的启动方式。\n\n\
  指向 LoyaltyProgram.dll，这将运行 LoyaltyProgram API。\n\n有了这个文件，我们就可以使用以下命令将忠诚度计划 API 部署到\
  \ Kubernetes：\n\n```bash\n> kubectl apply -f loyalty-program.yaml\n```\n\n特惠微服务的\
  \ Kubernetes 清单是类似的，也使用 `kubectl apply` 命令进行部署。\n\n一旦忠诚度计划 API 和特惠微服务部署完成，我们应该能在\
  \ Kubernetes 仪表板（我们在第 3 章中配置的）以及 `kubectl` 命令行中看到它们都在运行：\n\n```text\n> kubectl get\
  \ pods\nNAME                              READY   STATUS    RESTARTS   AGE\nloyalty-program-5d87df4656-9x89c\
  \  1/1     Running   0          55s\nspecial-offers-67d6b78998-mttp6   1/1     Running\
  \   0          43s\n```\n\n我们还可以找到这两个 API 可用的 IP 地址和端口：\n\n```text\n> kubectl get\
  \ services\nNAME             TYPE           CLUSTER-IP      EXTERNAL-IP      PORT(S)\
  \          AGE\nkubernetes       ClusterIP      10.0.0.1        <none>         \
  \  443/TCP          20d\nloyalty-program  LoadBalancer   10.0.137.255    40.127.231.56\
  \    5001:32553/TCP   2m28s\nspecial-offers   LoadBalancer   10.0.76.165     52.142.115.22\
  \    80:32391/TCP     2m16s\n```\n\n在我的例子中，忠诚度计划 API 可通过 http://40.127.231.56:5001\
  \ 访问，特惠 API 可通过 http://52.142.115.22/ 访问。由于这些 IP 地址是由 AKS 动态分配的，你的环境中会有所不同。\n\n\
  这就是部署这两个 API 所需的全部内容。\n\n## 5.2.10 部署 EventConsumer\n\n剩下的工作就是部署忠诚度计划事件消费者。这可以通过扩展忠诚度计划的\
  \ Kubernetes 清单并使用 kubectl 重新应用它来完成。如前所述，我们将把事件消费者部署为一个按计划调用的 CronJob。为此，我们在上一节创建的\
  \ “loyalty-program.yaml” 文件末尾添加以下内容：\n\n### 清单 5.16 忠诚度计划事件消费者的 Kubernetes 清单\n\n\
  ```yaml\napiVersion: batch/v1beta1\nkind: CronJob\nmetadata:\n  name: loyalty-program-consumer\n\
  spec:\n  schedule: \"*/1 * * * *\"\n  jobTemplate:\n    spec:\n      template:\n\
  \        spec:\n          containers:\n            - name: loyalty-program\n   \
  \           image: your_unique_registry_name.azurecr.io/loyalty-program:1.0.2\n\
  \              imagePullPolicy: IfNotPresent\n              env:\n             \
  \   - name: STARTUPDLL\n                  value: \"consumer/EventConsumer.dll\"\n\
  \          restartPolicy: Never\n  concurrencyPolicy: Forbid\n```\n\n![](img/608267d7803dc57a1a896ad121f37868_148_0.png)\n\
  \n这里定义的调度意味着事件消费者将每分钟运行一次。这可以根据事件消费者的具体情况调整。有些事件很少发生，不需要立即反应。在这种情况下，调度可以慢得多。有些事件经常发生，在这种情况下，我们可能希望保持一分钟的调度，但每次事件消费者运行时读取更大的批次。\n\
  \n为了部署事件消费者，我们再次使用 loyalty-program.yaml：\n\n```bash\n> kubectl apply -f loyalty-program.yaml\n\
  ```\n\n重新运行这个命令是完全可以的。Kubernetes 会判断是否有任何更改需要执行，并只应用这些更改。\n\n既然事件消费者也已部署，我们应该也能在\
  \ Kubernetes 中看到一个 CronJob：\n\n```text\n> kubectl get cronjob\nNAME            \
  \             SCHEDULE    SUSPEND  ACTIVE  LAST SCHEDULE  AGE\nloyalty-program-consumer\
  \     */1 * * * *  False    0       20s             1m20s\n```\n\n我们还可以通过查看“上次调度”列来了解忠诚度计划事件消费者。在我的例子中，CronJob\
  \ 是在 20 秒前触发的。\n\n\n\n\n\n我们也可以通过查看 Kubernetes 作业列表来看到忠诚度计划事件消费者的最近调用情况：\n\n```\n\
  > kubectl get jobs\nNAME                          COMPLETIONS   DURATION   AGE\n\
  loyalty-program-consumer-1590755940   1/1          2s         11s\nloyalty-program-consumer-1590757080\
  \   1/1          2s         1m11s\nloyalty-program-consumer-1590757140   1/1   \
  \       3s         2m11s\n```\n\n至此，忠诚度计划微服务的部署已完成。API 部分以及事件消费者部分都在 AKS 中的 Kubernetes\
  \ 集群中运行。我们为忠诚度计划创建的 Kubernetes 清单是为我们将创建的所有微服务的清单的模板；只有容器镜像的名称会不同，事件消费者的调度也会有所不同。\n\
  \n如果我们想确认事件消费者确实在运行，可以检查 CronJob 的其中一个实例的日志：\n\n```\n> kubectl logs job.batch/loyalty-program-consumer-1590755940\n\
  [{\"sequenceNumber\":1,\"occurredAt\":\"2020-06-18T18:07:13.7973414+00:00\",\"name\"\
  :\"SpecialOfferCreated\",\"content\":{\"description\":\"Nice deal\",\"id\":0}},\n\
  {\"sequenceNumber\":2,\"occurredAt\":\"2020-06-18T18:07:17.7957514+00:00\",\"name\"\
  :\"SpecialOfferCreated\",\"content\":{\"description\":\"Nice deal\",\"id\":1}},\n\
  {\"sequenceNumber\":3,\"occurredAt\":\"2020-06-18T18:07:47.4246091+00:00\",\"name\"\
  :\"SpecialOfferUpdated\",\"content\":{\"oldOffer\":{\"description\":\"Nice deal\"\
  ,\"id\":1},\"newOffer\":{\"description\":\"Best deal ever - JUST GOT BETTER\",\"\
  id\":0}}},{\"sequenceNumber\":4,\"occurredAt\":\"2020-06-18T18:08:04.5908816+00:00\"\
  ,\"name\":\"SpecialOfferRemoved\",\"content\":{\"offer\":{\"description\":\"Nice\
  \ deal\",\"id\":0}}}]\n```\n\n查看这些日志，我们将能够看到在我们调用特价优惠 API 后不久，特价优惠事件已被消费。\n\n在 AKS\
  \ 中同时运行特价优惠微服务和忠诚度计划微服务后，我们已完成了三种协作风格的所有示例的实现：命令、查询和事件。\n\n## Summary\n\n- There\
  \ are three types of microservice collaboration:\n  - Command-based collaboration,\
  \ where one microservice uses an HTTP POST, PUT, or DELETE to make another microservice\
  \ perform an action\n  - Query-based collaboration, where one microservice uses\
  \ an HTTP GET to query the state of another microservice\n  - Event-based collaboration,\
  \ where one microservice exposes an event feed that other microservices can subscribe\
  \ to by polling the feed for new events\n- Event-based collaboration is more loosely\
  \ coupled than command- and query-based collaboration.\n- You can use HttpClient\
  \ to send commands to other microservices and to query other microservices.\n- You\
  \ can use MVC controllers to expose the endpoints for receiving and handling commands\
  \ and queries.\n- An MVC controller can expose a simple event feed.\n- You can create\
  \ a process that subscribes to events by\n  - Creating a .NET console application\n\
  \  - Using `HttpClient` to read events from an event feed\n  - Running this application\
  \ as a CronJob in Kubernetes\n"
- "## Data ownership and data storage\n\n### This chapter covers\n\n- Which data microservices\
  \ store\n- Understanding how data ownership follows business capabilities\n- Using\
  \ data replication for speed and robustness\n- Building read models from event feeds\
  \ with event subscribers\n- Implementing data storage in microservices\n\n软件系统创建、使用和转换数据。如果没有数据，大多数软件系统就没有什么价值，微服务系统也是如此。在本章中，您将学习数据应存储在何处以及哪个微服务应负责使其保持最新。此外，您还将学习如何使用数据复制使微服务系统更具健壮性和更快。\n\
  \n## 6.1 Each microservice has a data store\n\n第一章中确定的微服务的一个特征是，每个微服务都应拥有自己的数据存储。该数据存储中的数据完全由微服务控制，并且正是微服务所需的数据。首先，它是属于微服务实现的能力的数据，但它也是支持数据，例如从事件源创建的缓存数据和读模型。\n\
  \n每个微服务都拥有数据存储这一事实意味着您不需要为所有微服务使用相同的数据库技术。您可以为每个微服务选择适合其需要存储的数据的数据库技术。\n\n微服务通常需要存储三种类型的数据：\n\
  \n- 属于微服务实现的能力的数据。这是微服务负责并必须保持安全和最新的数据。\n- 微服务引发的事件。在命令处理期间，微服务可能需要引发事件以通知系统其余部分有关其负责的数据的更新。\n\
  - 基于来自其他微服务的事件中的数据或偶尔基于对其他微服务的查询的数据的读模型。\n\n这三种类型的数据可能存储在不同的数据库中，甚至是不同类型的数据库中。\n\
  \n## 6.2 Partitioning data between microservices\n\n当您决定在微服务系统中存储数据的地点时，会有相互竞争的因素在起作用。两个主要因素是数据所有权和局部性：\n\
  \n- *数据所有权*意味着负责保持数据的正确、安全和最新。\n- *数据局部性*指的是微服务所需的数据存储的位置。通常，数据应存储在附近——最好是在微服务本身中。\n\
  \n这两个因素可能存在冲突，为了同时满足两者，您通常需要在多个地方存储数据。这是可以的，但重要的是其中只有一个地方被视为权威来源。图 6.1 说明了这一点；而一个微服务存储数据的权威副本，其他微服务可以在自己的数据存储中镜像该数据。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_152_0.png)\n\nFigure 6.1 Microservices\
  \ A and C collaborate with microservice B. Microservices A and C can store mirrors\
  \ of the data owned by microservice B, but the authoritative copy is stored in microservice\
  \ B’s own data store.\n\ncart. Most of the microservices in figure 6.2 are dimmed\
  \ to put the focus on three microservices: shopping cart, product catalog, and recommendations.\n\
  \n图 6.2 中突出显示的每个微服务都处理一个业务能力：购物车微服务负责跟踪用户的购物车；产品目录微服务负责为系统其余部分提供产品目录的信息访问；推荐微服务负责为电子商务网站的用户计算并提供产品推荐。数据与这些业务能力相关联，每个微服务都拥有并负责与其能力相关的数据。图\
  \ 6.3 显示了每个微服务拥有的数据。说一个微服务拥有某块数据意味着它必须存储该数据并成为该数据的权威来源。\n\n![](img/608267d7803dc57a1a896ad121f37868_154_0.png)\n\
  \nFigure 6.3 Each microservice owns the data belonging to the business capability\
  \ it implements.\n\n### 6.2.2 Rule 2: Replicate for speed and robustness\n\n在微服务系统中决定数据应存储在哪里的第二个因素是局部性。微服务查询自己的数据库获取数据与微服务查询另一个微服务获取相同数据之间存在很大差异。查询自己的数据库通常比查询另一个微服务更快、更可靠。\n\
  \n一旦您决定了数据的所有权，您可能会发现您的微服务需要互相请求数据。这种类型的协作会产生一定的耦合：一个微服务查询另一个微服务意味着第一个与另一个耦合。如果第二个微服务宕机或变慢，第一个微服务将受到影响。\n\
  \n为了放松这种耦合，您可以缓存查询响应。有时您会按原样缓存响应，但有时您可以存储基于查询响应的读模型。在这两种情况下，您必须决定何时以及如何缓存数据\n\n\n\
  \n变得无效。拥有数据的微服务最适合判断数据的有效期。因此，响应微服务所拥有数据的查询时，应在响应中包含缓存头，告知调用方应该缓存响应数据多长时间。\n\n##\
  \ 使用 HTTP 缓存头控制缓存\n\nHTTP 定义了若干用于控制 HTTP 响应如何缓存的头部。HTTP 缓存机制有两个目的：\n\n- 在很多情况下，消除调用方再次请求已有信息的需求\n\
  - 在另一些情况下，消除发送完整 HTTP 响应的需求\n\n为了消除调用方请求已有信息的需求，服务器可以在响应中添加 `cache-control` 头。HTTP\
  \ 规范定义了可以在 `cache-control` 头中设置的一系列控制指令。最常见的是 `private`/`public` 和 `max-age` 指令。前者指示是否只有调用方（`private`）或任何缓存/中间层（例如代理服务器）也可以缓存响应。`max-age`\
  \ 指令指示响应可以被缓存多少秒。例如，下面的 `cache-control` 头指示调用方（且仅限调用方）可以将响应缓存 3,600 秒：\n\n```\n\
  cache-control: private, max-age=3600\n```\n\n换句话说，调用方在 3,600 秒内，只要想对相同 URL 发起相同方法（GET、POST、PUT、DELETE）且相同请求体的\
  \ HTTP 请求，就可以复用该响应。在本书中，我只对查询使用缓存，这意味着仅用于 GET 请求。值得注意的是，查询字符串是 URL 的一部分，因此缓存会将查询字符串考虑在内。\n\
  \n为了在调用方持有缓存但已过期响应时避免发送完整响应，可以使用 `ETag` 和 `If-None-Match` 头：服务器可以在响应中添加 `ETag` 头。这是响应的标识符。当调用方之后使用相同方法和相同请求体向相同\
  \ URL 发起请求时，可以在名为 `If-None-Match` 的请求头中包含该 ETag。服务器可以读取 ETag，得知调用方缓存的是哪个响应。如果服务器判定缓存响应仍然有效，它可以返回带有“304\
  \ Not Modified”状态码的响应，告知客户端使用已经缓存的响应。此外，服务器可以在 304 响应中添加 `cache-control` 头，以延长响应可被缓存的时间。注意，ETag\
  \ 由服务器设置，之后也由同一服务器读取。\n\n让我们再次看图 6.3 中的微服务。购物车微服务通过查询产品目录微服务来获取产品信息。对于任何给定产品，产品目录信息可能正确的时长，最好由拥有数据的产品目录来决定。因此，产品目录应该在其响应中添加缓存头，购物车应该利用这些头来决定可以缓存响应多长时间。图\
  \ 6.4 展示了购物车想要向产品目录发起的一系列请求。\n\n![](img/608267d7803dc57a1a896ad121f37868_156_0.png)\n\
  \n**图 6.4** 产品目录微服务可以通过在其 HTTP 响应中包含缓存头，让协作方缓存响应。在本示例中，它设置 `max-age` 来指示响应可以缓存多久，并且还包含一个由产品\
  \ ID 和版本构建的 ETag。\n\n在图 6.4 中，第一个请求的响应中的缓存头告诉购物车微服务，它可以将响应缓存 3,600 秒。当购物车第二次想要发起相同请求时，由于经过的时间少于\
  \ 3,600 秒，因此复用了缓存响应。第三次，由于经过的时间超过 3,600 秒，因此向产品目录微服务发起了请求。该请求在 `If-None-Match` 头中包含了来自第一个响应的\
  \ ETag。产品目录使用 ETag 判断响应仍然相同，因此返回\n\n![](img/608267d7803dc57a1a896ad121f37868_158_0.png)\n\
  \n**图 6.5** 购物者跟踪微服务订阅购物车微服务的事件，并跟踪产品被添加到购物车或从购物车移除的次数。\n\n添加到购物车或从购物车移除。但事件是构建这种模型的良好来源。购物者跟踪微服务为每个产品维护两个计数器：一个用于记录产品被添加到购物车的次数，另一个用于记录被移除的次数。每次从购物车收到事件，就会更新其中一个计数器；每次对产品进行查询时，就会读取该产品的两个计数器。\n\
  \n## 6.2.3 微服务将数据存储在哪里？\n\n一个微服务可以使用一个、两个或更多数据库。微服务存储的某些数据可能非常适合某种数据库类型，而其他数据可能更适合另一种类型。有许多可行的数据库技术可供选择，这里我不做比较。不过，在选择时，你可以考虑一些广泛的数据库类别，包括关系型数据库、键值存储、文档数据库、列存储和图数据库。\n\
  \n如果你的生产环境位于某个主要公有云中，你可以利用一些非常有吸引力的数据库服务。这些服务在数据库类别（关系型数据库、文档数据库等）上有所不同，在运维特性上也有所不同。有些是“无服务器”的，几乎不需要维护；另一些则更为传统。这些因素也应纳入考虑。\n\
  \n微服务所选数据库技术（一种或多种）可能受到许多因素的影响，包括：\n\n-   你的数据是什么形状？它是否适合关系模型、文档模型、键值存储，还是图结构？\n\
  -   写入场景是怎样的？写入的数据量有多大？写入是突发的，还是在时间上均匀分布？\n-   读取场景是怎样的？每次读取多少数据？总共读取多少？读取是否是突发的？\n\
  -   与读取相比，写入的数据量如何？\n-   团队已经熟悉开发和在生产中运行哪些数据库？\n\n问自己这些问题——并找到答案——不仅有助于你选择合适的数据库，而且很可能会加深你对微服务预期具备的非功能性质量的理解。你会了解微服务必须有多可靠、必须处理多大的负载、负载是什么样、可接受的延迟是多少，等等。\n\
  \n获得这种更深层次的理解很有价值，但请注意，我并不建议你每次创建新的微服务时都针对不同数据库的优缺点进行重大分析。你应该能够快速启动一个新的微服务并部署到生产环境。目标不是找到一种完美适合该工作的数据库技术——你只需要根据前面问题的答案找到一种合适的即可。你可能面临这样的情况：文档数据库看起来是个不错的选择，并且你有信心\
  \ Couchbase、CosmosDB 和 MongoDB 都非常适合。在这种情况下，选择其中之一即可。最好能快速让微服务使用其中一个进入生产环境，并在稍后阶段，可能用使用另一个的实现替换该微服务，而不是因为你在详细分析\
  \ Couchbase、CosmosDB 和 MongoDB 而推迟微服务第一版发布到生产环境。\n\n### 系统中有多少种数据库技术？\n\n关于应该在微服务中使用哪种数据库的决定，并不仅仅取决于哪种数据库适合该微服务。你需要考虑更广泛的情况。在微服务系统中，会有许多微服务和许多数据存储。值得考虑的是，你希望在系统中有多少种不同的数据库技术。在标准化少数几种数据库技术和放任自由之间有一个权衡。\n\
  \n支持标准化的一侧有这些目标：\n\n-   在生产环境中可靠地运行数据库，并长期持续做到这一点\n-   开发人员能够进入他们以前没有接触过的微服务代码库并高效工作\n\
  \n\n\n\n\n偏向自由竞争的模式具有以下类型的目标：\n\n- 能够根据可维护性、性能、安全、可靠性等方面，为每个微服务选择最优的数据库技术。\n- 保持微服务的可替换性。如果新开发者接手一个微服务并且不同意数据库的选择，他们应该能够替换数据库，甚至替换整个微服务。\n\
  \n这些目标之间的权衡因组织而异。认识到存在权衡非常重要，但我会进一步建议在组织内部进行一定的标准化。\n\n## 6.3 在微服务中实现数据存储\n\n我们已经讨论了在微服务系统中数据应该放在哪里，包括微服务应该拥有哪种数据以及镜像哪种数据。现在是时候转换思路，来看存储数据所需的代码。\n\
  \n我将重点介绍微服务如何存储其拥有的数据，包括如何存储其引发的事件。我将首先向你展示如何使用 SQL Server 和轻量级数据访问库 Dapper 来实现这一点。然后我将展示如何将事件存储在专门为存储事件而设计的数据库中——名为\
  \ EventStoreDB 的数据库。\n\n## 本章使用的新技术\n\n在本章中，你将开始使用几种新技术：\n\n- SQL Server——微软的 SQL\
  \ 数据库。就本章目的而言，许多不同的数据库都可以使用。我选择 SQL Server，因为我怀疑它对许多读者来说会很熟悉。\n- Dapper (https://github.com/StackExchange/dapper-dot-net)—一个轻量级对象关系映射器（ORM）。\n\
  - EventStoreDB (https://www.eventstore.com/eventstoredb)—一种专门为存储事件而设计的数据库产品。\n\n\
  ## Dapper：轻量级 O/RM\n\nDapper 是一个用于从 C# 在 SQL 数据库中工作数据的简单库。它属于有时被称为微 ORM 的库家族，其中还包括\
  \ Simple.Data 和 Massive。这些库专注于易用性和速度，并拥抱 SQL。\n\n而更传统的 ORM 会编写读取和写入数据库所需的所有 SQL，Dapper\
  \ 要求你自己编写 SQL。当处理具有简单模式的数据库时，我发现这种方式很解放。\n\n为了选择微服务的轻量级技术，我选择 Dapper 而不是 Entity\
  \ Framework 或 NHibernate 等全功能 ORM。通常微服务的数据库很简单，在这种情况下，我发现为其添加一个薄层——比如 Dapper——整体上更容易实现。我本可以选用其他微\
  \ ORM 中的任何一个，但我喜欢 Dapper。在本章中，你将使用 Dapper 与 SQL Server 通信，但 Dapper 也可与 PostgreSQL、MySQL\
  \ 或 Azure SQL 等其他 SQL 数据库一起使用。\n\n## EventStoreDB：专用事件数据库\n\nEventStoreDB 是一个专门为存储事件而设计的开源数据库服务器。EventStoreDB\
  \ 将事件存储为 JSON 文档，但它与文档数据库不同，因为它假设 JSON 文档是事件流的一部分。尽管 EventStoreDB 由于其对存储事件的高度专注而是一个利基产品，但它被广泛使用，并在高负载生产场景中证明了自己。\n\
  \n除了存储事件之外，EventStoreDB 还提供读取和订阅事件的功能。例如，EventStoreDB 公开其自己的事件源——作为 ATOM 源——客户端可以订阅。如果不介意依赖\
  \ EventStoreDB，使用其 ATOM 事件源向其他微服务公开事件可以成为本书中你将实现事件源的一种可行替代方案。\n\nEventStoreDB 通过公开用于存储、读取和订阅事件的\
  \ HTTP API 来工作。有许多 EventStoreDB 客户端库使用各种语言——包括 C#、F#、Java、Scala、Erlang、Haskell 和\
  \ JavaScript——使与数据库的工作变得更容易。\n\n### 6.3.1 准备开发环境\n\n在我们深入实现之前，我们需要在本地主机上运行 SQL Server，我们将在\
  \ Docker 容器中执行此操作。\n\n首先，将最新的 SQL Server docker 镜像拉取到你的机器上\n\n```\ndocker pull mcr.microsoft.com/mssql/server\n\
  ```\n\n然后运行它：\n\n```\ndocker run -e 'ACCEPT_EULA=Y' -e 'SA_PASSWORD=yourStrong(!)Password'\
  \ -p 1433:1433 -d mcr.microsoft.com/mssql/server\n```\n\n最后，通过列出本地运行的容器并检查 SQL Server\
  \ 是否在列表中来确认 SQL 是否确实正在运行：\n\n```\ndocker ps\n\nCONTAINER ID        IMAGE       \
  \                       COMMAND                  CREATED          STATUS       \
  \   PORTS                    NAMES\n3388b710892f        mcr.microsoft.com/mssql/server\
  \    \"/opt/mssql/bin/perm...\"  52 minutes ago   Up 52 minutes   0.0.0.0:1433->1433/tcp\
  \   friendly_bell\n```\n\n如果 SQL Server 容器未启动，你可能需要在 Docker run 命令中使用双引号而不是单引号。\n\
  \n有了这个，我们就可以开始在我们的微服务中实现数据存储了。\n\n## 6.3.2 存储微服务拥有的数据\n\n一旦你决定了微服务拥有哪些数据，存储这些数据就相对直接了。如何实现取决于你选择的数据库。特定于微服务的唯一区别是数据存储完全由微服务本身拥有和访问。\n\
  \n作为示例，让我们回到购物车微服务。它拥有用户的购物车，因此存储它们。你将使用 Dapper 在 SQL Server 中存储购物车。\n\n你在第 2 章中实现了购物车微服务的大部分内容。在这里，你将填入数据存储部分。\n\
  \n> **NOTE**  我们使用 SQL Server 作为示例，但我们对 SQL Server 所做的一切同样可以用任何其他关系数据库完成，无论是 PostgreSQL、MySQL，还是\
  \ Azure SQL 或 AWS Aurora 等云托管关系数据库。\n\n如果你熟悉在 SQL Server 中存储数据，实现应该不会让你感到惊讶，这正是重点。存储微服务拥有的数据不需要涉及任何花哨的东西。存储购物车的步骤如下：\n\
  \n- 1. 创建一个数据库。\n- 2. 使用 Dapper 实现读取、写入和更新购物车的代码。\n\n首先，你将创建一个用于存储购物车的简单数据库。它将有两个表，如图\
  \ 6.6 所示。\n\nShoppingCart 数据库和两个表——ShoppingCart 和 ShoppingCartItem——可以用 SQL 脚本创建，你可以在连接到本地主机端口\
  \ 1433 上的 SQL Server 容器后，使用各种工具（包括 SQL Management Studio 和 Visual Studio Code）执行这些脚本：\n\
  \n```\nCREATE DATABASE ShoppingCart\nGO\n\nUSE [ShoppingCart]\nGO\n\nCREATE TABLE\
  \ [dbo].[ShoppingCart] (\n    [ID] int IDENTITY(1,1) PRIMARY KEY,\n    [UserId]\
  \ [bigint] NOT NULL,\n    CONSTRAINT ShoppingCartUnique UNIQUE ([ID], [UserID])\n\
  )\nGO\n\nCREATE INDEX ShoppingCart_UserId\nON [dbo].[ShoppingCart] (UserId)\nGO\n\
  ```\n\n| ShoppingCart |  |\n|---|---|\n| **PK** | **ID** |\n|  | UserId |\n\n| ShoppingCartItem\
  \ |  |\n|---|---|\n| **PK** | **ID** |\n| **FK** | ShoppingCartId |\n|  | ProductCatalogId\
  \ |\n|  | ProductName |\n|  | ProductDescription |\n|  | Amount |\n|  | Currency\
  \ |\n\n![](img/608267d7803dc57a1a896ad121f37868_162_0.png)\n\n```\nCREATE TABLE\
  \ [dbo].[ShoppingCartItem] (\n    [ID] int IDENTITY(1,1) PRIMARY KEY,\n    [ShoppingCartId]\
  \ [int] NOT NULL,\n    [ProductCatalogId] [bigint] NOT NULL,\n    [ProductName]\
  \ [nvarchar](100) NOT NULL,\n    [ProductDescription] [nvarchar](500) NULL,\n  \
  \  [Amount] [int] NOT NULL,\n    [Currency] [nvarchar](5) NOT NULL\n)\nGO\n\nALTER\
  \ TABLE [dbo].[ShoppingCartItem] WITH CHECK ADD CONSTRAINT [\n    FK_ShoppingCart]\
  \ FOREIGN KEY([ShoppingCartId])\nREFERENCES [dbo].[ShoppingCart] ([Id])\nGO\n\n\
  ALTER TABLE [dbo].[ShoppingCartItem] CHECK CONSTRAINT [FK_ShoppingCart]\nGO\n\n\
  CREATE INDEX ShoppingCartItem_ShoppingCartId\nON [dbo].[ShoppingCartItem] (ShoppingCartId)\n\
  GO\n```\n\n> NOTE 如果你连接容器中的 SQL Server 时遇到问题，可能是因为它使用了一个开发证书，你必须显式信任该证书。\n\n数据库就绪后，你可以在购物车微服务中实现读取、写入和更新数据库的代码。你将把\
  \ Dapper NuGet 包安装到微服务中。记住，你可以通过在与 ShoppingCart.csproj 文件相同的文件夹中从命令行使用 dotnet add\
  \ package dapper 命令，将 Dapper 添加到 ShoppingCart 项目来完成此操作。添加 Dapper 包后，包含包引用的项目组，ShoppingCart.csproj\
  \ 文件应如下所示：\n\n```\n<ItemGroup>\n  <PackageReference Include=\"Dapper\" Version=\"\
  2.0.35\" />\n  <PackageReference Include=\"Microsoft.Extensions.Http.Polly\" Version=\"\
  3.1.0\" />\n  <PackageReference Include=\"Polly\" Version=\"7.2.0\" />\n  <PackageReference\
  \ Include=\"Scrutor\" Version=\"3.1.0\" />\n</ItemGroup>\n```\n\n添加 Dapper 库\n\n\
  在第 2 章中，购物车微服务期望一个 IShoppingCart 接口的实现。你将稍微修改该接口以允许其实现异步调用数据库。这是修改后的接口：\n\n```\n\
  public interface IShoppingCartStore\n{\n    Task<ShoppingCart> Get(int userId);\n\
  \    Task Save(ShoppingCart shoppingCart);\n}\n```\n\n\n\n\n现在是时候查看 `IShoppingCartStore`\
  \ 接口的实现。首先，让我们考虑从数据库读取购物车的代码。\n\n## Listing 6.1  使用 Dapper 读取购物车\n\n```\nnamespace\
  \ ShoppingCart.ShoppingCart\n{\n    using System.Data;\n    using System.Data.SqlClient;\n\
  \    using System.Linq;\n    using System.Threading.Tasks;\n    using Dapper;\n\n\
  \    public interface IShoppingCartStore\n    {\n        Task<ShoppingCart> Get(int\
  \ userId);\n        Task Save(ShoppingCart shoppingCart);\n    }\n\n    public class\
  \ ShoppingCartStore : IShoppingCartStore\n    {\n        private string connectionString\
  \ =\n            @\"Data Source=localhost;Initial Catalog=ShoppingCart;\nUser Id=SA;\
  \ Password=yourStrong(!)Password\";\n\n        private const string readItemsSql\
  \ =\n            @\"\nselect ShoppingCart.ID, ProductCatalogId,\nProductName, ProductDescription,\
  \ Currency, Amount\nfrom ShoppingCart, ShoppingCartItem\nwhere ShoppingCartItem.ShoppingCartId\
  \ = ShoppingCart.ID\nand ShoppingCart.UserId=@userId\";\n\n        public async\
  \ Task<ShoppingCart> Get(int userId)\n        {\n            await using var conn\
  \ = new SqlConnection(this.connectionString);\n            var items = (await\n\
  \                conn.QueryAsync(\n                    readItemsSql,\n         \
  \           new { UserId = userId }))\n                .ToList();\n            return\
  \ new ShoppingCart(\n                items.FirstOrDefault()?.ID,\n             \
  \   userId,\n                items.Select(x =>\n                    new ShoppingCartItem(\n\

  \ INF Successfully added products to shopping cart [1, 2], {\"userId\":123,\"items\"\
  :[{\"productCatalogueId\":1,\"productName\":\"Basic t-shirt\",\"description\":\"\
  a quiet t-shirt\",\"price\":{\"currency\":\"eur\",\"amount\":40}},{ \"productCatalogueId\"\

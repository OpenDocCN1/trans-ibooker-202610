  \n## 8.3.2 使用 TestServer 和 HttpClient 对端点进行单元测试\n\n既然测试项目已经搭建好，你就可以开始向其中添加测试了。你要添加的第一个测试非常简单：给定忠诚度计划微服务中没有已注册用户的情况，用户期望得到状态码为“404\
  \ Not Found”的响应。向 LoyaltyProgramUnit-Tests 项目添加一个名为 UsersEndpoints_should.cs 的文件，并将以下代码放入其中。\n\
  \n**清单 8.3 用户端点的第一个测试**\n```csharp\nnamespace LoyaltyProgramUnitTests\n{\n```\n\
  ```\nusing System;\nusing System.Net;\nusing System.Net.Http;\nusing System.Threading.Tasks;\n\
  using LoyaltyProgram;\nusing Microsoft.AspNetCore.Hosting;\nusing Microsoft.AspNetCore.TestHost;\n\
  using Microsoft.Extensions.Hosting;\nusing Xunit;\n\npublic class UsersEndpoints_should\
  \ : IDisposable\n{\n    private readonly IHost host;\n    private readonly HttpClient\
  \ sut;    // Remember that sut stands for \"system under test.\"\n\n    public UsersEndpoints_should()\n\
  \    {\n        this.host = new HostBuilder()\n            .ConfigureWebHost(x =>\
  \ x\n                .UseStartup<Startup>()    // Real LoyaltyProgram startup\n\
  \                .UseTestServer())         // Use the test server so requests are\
  \ in process.\n            .Start();\n        this.sut = this.host.GetTestClient();\
  \   // The host uses the test server to create a test HttpClient.\n    }\n\n   \
  \ [Fact]\n    public async Task respond_not_found_when_queried_for_unregistered_user()\n\
  \    {\n        var actual = await this.sut.GetAsync(\"/users/1000\");\n       \
  \ Assert.Equal(HttpStatusCode.NotFound, actual.StatusCode);\n    }\n\n    public\
  \ void Dispose()\n    {\n        this.host?.Dispose();\n        this.sut?.Dispose();\n\
  \    }\n}\n```\n\n这个测试类最有趣的部分在构造函数中，你在其中创建了一个 host 和一个 HttpClient 对象。当 xUnit 运行时，它会创建\
  \ UsersEndpoints_should 的一个实例，然后在该实例上调用带有 Fact 特性的方法。与大多数其他 .NET 测试框架不同，xUnit 会为每个\
  \ Fact 方法创建一个全新的清洁实例。\n\n上一个清单中的 host 对象是使用 LoyaltyProgram 中真实的 Startup 类初始化的。这意味着\
  \ HttpClient 所调用的 LoyaltyProgram 应用程序，其装配方式与它在真实 Web 服务器上运行并接收真实 HTTP 请求时的装配方式相同。\n\

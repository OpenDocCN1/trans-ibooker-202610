  \ users add products to the shopping cart\n\n### 12.3.4 让用户将产品添加到购物车\n\nThe first\
  \ piece of behavior you’ll add will make the BUY! button in the product list work.\
  \ You’ll do two things:\n\n你将添加的第一项行为会使产品列表中的 BUY! 按钮生效。你需要做两件事：\n\n- 1. Add an\
  \ endpoint to ProductListController that allows the application to add a product\
  \ to the shopping cart. This endpoint in the API Gateway is thin and delegates to\
  \ the shopping cart microservice.\n- 1. 在 ProductListController 中添加一个端点，允许应用程序将产品添加到购物车。API\
  \ 网关中的此端点很薄，并委托给购物车微服务。\n- 2. Add an OnClick function to the BUY! button that calls\
  \ the new endpoint in ProductListController.\n- 2. 在 BUY! 按钮中添加一个 OnClick 函数，调用\
  \ ProductListController 中的新端点。\n\nThe following listing shows the endpoint in GatewayModule\
  \ that lets the application add a product to the shopping cart.\n\n以下列表显示了 GatewayModule\
  \ 中允许应用程序将产品添加到购物车的端点。\n\n### Listing 12.14 Endpoint to add a product to the shopping\
  \ cart\n\n### 列表 12.14 添加产品到购物车的端点\n\n```\n[HttpPost(\"/shoppingcart/{userId}\"\
  )]\npublic async Task<OkResult> AddToCart(\n    int userId,\n    [FromBody] int\
  \ productId)\n{\n    var response =\n        await this.shoppingCartClient.PostAsJsonAsync(\n\
  \            $\"/shoppingcart/{userId}/items\",\n            new[] { productId });\n\
  \    response.EnsureSuccessStatusCode();\n    return Ok();\n}\n```\n\nNew endpoint\n\
  新端点\nReads a product ID from the body of the request\n从请求体中读取产品 ID\nUses HttpClient\
  \ to call shopping cart\n使用 HttpClient 调用购物车\n\nThis endpoint receives some data—a\
  \ product ID—in the body of the POST request and delegates it to the shopping cart\
  \ microservice by sending it an HTTP POST request. The shopping cart—as you’ve seen\
  \ in earlier chapters—handles adding the product to the shopping cart, storing the\
  \ updated shopping cart, and raising an event that notifies subscribers about the\
  \ update.\n\n此端点在 POST 请求的正文中接收一些数据——产品 ID——并通过发送 HTTP POST 请求将其委托给购物车微服务。购物车——正如你在前几章中看到的——处理将产品添加到购物车、存储更新后的购物车，并引发事件通知订阅者更新。\n\
  \nTo use this endpoint from the application, you need to add a bit of JavaScript\
  \ to the view: a function that calls the new endpoint and replaces the current page\
  \ with the page returned from the endpoint.\n\n要从应用程序使用此端点，你需要在视图中添加一些 JavaScript：一个调用新端点并用端点返回的页面替换当前页面的函数。\n\
  \n### Listing 12.15 Calling the endpoint to add a product to the shopping cart\n\
  \n### 列表 12.15 调用添加产品到购物车的端点\n\n```\nasync function buy(productId) {\n  const params\
  \ = new URLSearchParams(location.search);\n  const rawResponse =\n    await fetch('/shoppingcart/'\
  \ + params.get('userId'), {\n      method: 'POST',\n      headers: {\n        'Accept':\
  \ 'application/json',\n        'Content-Type': 'application/json'\n      },\n  \
  \    body: JSON.stringify(productId)\n    });\n  window.location.reload(true);\n\
  }\n```\n\nFunction that should be used by the BUY button\n\n应由 BUY 按钮使用的函数\n\nCall\
  \ the new endpoint in the ProductListController.\n\n调用 ProductListController 中的新端点。\n\
  \nRefresh the page.\n\n刷新页面。\n\nThis function adds a product to the shopping cart.\
  \ It should be called whenever the user clicks one of the BUY! buttons, so add an\
  \ onclick handler to the BUY! button by changing the line in the view that renders\
  \ the button for each product in the product list, as follows:\n\n此函数将产品添加到购物车。每当用户点击其中一个\
  \ BUY! 按钮时都应调用它，因此通过更改视图中为产品列表中的每个产品渲染按钮的那一行，为 BUY! 按钮添加一个 onclick 处理程序，如下所示：\n\n\
  ```\n<html>\n...\n  <button class=\"btn btn-primary\" type=\"button\" onclick=\"\
  buy(@Current.ProductId);\">\n    BUY!\n  </button>\n...\n</html>\n```\n\nCalls the\
  \ buy function with the product ID for the current product in the iteration over\
  \ the list of products\n\n使用产品列表迭代中的当前产品的产品 ID 调用 buy 函数\n\nThat’s all you need\
  \ to do to make the BUY! buttons work.\n\n这就是使 BUY! 按钮生效所需做的全部工作。\n\n## 12.3.5 Letting\
  \ users remove products from the shopping cart\n\n### 12.3.5 让用户从购物车中移除产品\n\nThe\
  \ last bit you need to implement will let users remove products from their shopping\
  \ cart. Similar to the previous section, that means adding an endpoint to ProductListController\
  \ and adding an onclick handler to the X buttons in the shopping cart part of the\
  \ application. Add a DELETE endpoint that again mainly delegates to the shopping\
  \ cart microservice.\n\n你需要实现的最后一部分将允许用户从购物车中移除产品。与上一节类似，这意味着向 ProductListController\
  \ 添加一个端点，并在应用程序的购物车部分中的 X 按钮上添加一个 onclick 处理程序。添加一个 DELETE 端点，该端点再次主要委托给购物车微服务。\n\
  \n### Listing 12.16 Endpoint to remove a product from the shopping cart\n\n### 列表\
  \ 12.16 从购物车中移除产品的端点\n\n```\n[HttpDelete(\"/shoppingcart/{userId}\")]\npublic async\
  \ Task<OkResult> RemoveFromCart(\n    int userId,\n    [FromBody] int productId)\n\
  {\n    var request = new HttpRequestMessage(\n        HttpMethod.Delete,\n     \
  \   $\"/shoppingcart/{userId}/items\");\n    request.Content =\n        new StringContent(JsonSerializer.Serialize(new[]\
  \ {productId}));\n    var response = await this.shoppingCartClient.SendAsync(request);\n\
  \    response.EnsureSuccessStatusCode();\n    return Ok();\n}\n```\n\nTo use this\
  \ endpoint, add another JavaScript function to the view, which is very similar to\
  \ the previous JavaScript function except this one calls the DELETE endpoint.\n\n\
  要使用此端点，请在视图中添加另一个 JavaScript 函数，它与之前的 JavaScript 函数非常相似，只是它调用 DELETE 端点。\n\n###\
  \ Listing 12.17 Calling the endpoint to remove a product from the shopping cart\n\
  \n### 列表 12.17 调用从购物车中移除产品的端点\n\n```\nasync function removeFromCart(productId){\n\
  \    const _params = new URLSearchParams(location.search);\n    const rawResponse\
  \ =\n        await fetch('/shoppingcart/' + _params.get('userId'), {\n         \
  \   method: 'DELETE',\n            headers: {\n                'Accept': 'application/json',\n\
  \                'Content-Type': 'application/json'\n            },\n          \
  \  body: JSON.stringify(productId)\n        });\n    window.location.reload(true);\n\
  }\n```\n\nNext, use this JavaScript function from the X button in the shopping cart\
  \ part of the view:\n\n接下来，从视图的购物车部分中的 X 按钮使用此 JavaScript 函数：\n\n```\n<html>\n...\n\
  <button class=\"btn btn-link\" onclick=\"removeFromBasket\">X</button>\n...\n</html>\n\
  ```\n\nWith this code in place, the example application works! The user can add\
  \ products to and remove them from their shopping cart.\n\n有了这段代码，示例应用程序就可以工作了！用户可以向购物车添加产品，也可以从购物车中移除产品。\n\
  \n## Summary\n\n## 摘要\n\n- There's a spectrum of possible kinds of applications\
  \ to build on top of a microservice system, from general-purpose applications covering\
  \ all the functionality in the system to small, single-capability applications.\n\
  - 可以在微服务系统之上构建的应用程序种类存在一个谱系，从涵盖系统中所有功能的通用应用程序到小型、单一功能应用程序。\n- Applications over\
  \ microservices can be built as composite applications that draw in functionality\
  \ and GUI components from various microservices and combine them together to form\
  \ a complete application.\n- 基于微服务的应用程序可以构建为复合应用程序，从各种微服务中引入功能和 GUI 组件并将它们组合在一起形成完整的应用程序。\n\
  - The composite application pattern allows microservices to stay decoupled, but\
  \ the composite application itself can become complex.\n- 复合应用程序模式允许微服务保持解耦，但复合应用程序本身可能变得复杂。\n\
  - Applications over microservices can be built using the API Gateway pattern, which\
  \ puts one general-purpose API in front of all the microservices. That API Gateway\
  \ is the only microservice the application uses directly, but it delegates all requests\
  \ to other microservices in which the business capabilities are implemented.\n-\
  \ 基于微服务的应用程序可以使用 API 网关模式构建，该模式在所有微服务前面放置一个通用 API。 该 API 网关是应用程序直接使用的唯一微服务，但它将所有请求委托给实现业务能力的其他微服务。\n\
  - The API Gateway pattern can simplify application development and decouple applications\
  \ from the server-side architecture.\n- API 网关模式可以简化应用程序开发并将应用程序与服务器端架构解耦。\n- An\
  \ API Gateway can grow bigger over time because it needs to expose all functionality.\
  \ This is especially true if several applications use the API Gateway because it\
  \ needs to support all scenarios in all applications architecture.\n- API 网关随着时间的推移可能会变得更大，因为它需要公开所有功能。如果有多个应用程序使用\
  \ API 网关，则尤其如此，因为它需要支持所有应用程序架构中的所有场景。\n- Applications over microservices can be\
  \ built with the backend for frontend (BFF) pattern. A BFF is a microservice that\
  \ acts like an API Gateway, but for only one application.\n- 基于微服务的应用程序可以使用后端为前端（BFF）模式构建。BFF\
  \ 是一个像 API 网关一样工作的微服务，但仅针对一个应用程序。\n- BFFs are less prone to growing bigger than\
  \ API Gateways are.\n- BFF 比 API 网关更不容易变得更大。\n- BFFs are tailored to the single\
  \ application using them and should therefore make that application as simple to\
  \ implement as possible.\n- BFF 是为使用它们的单个应用程序量身定制的，因此应尽可能使该应用程序易于实现。\n- When you\
  \ build web applications over microservices, you’re free to use server-side rendering,\
  \ client-side rendering, or a mix.\n- 当你在微服务之上构建 Web 应用程序时，你可以自由使用服务器端渲染、客户端渲染或混合方式。\n\
  - All three patterns—composite application, API Gateway, and BFF—support server-side\
  \ rendering, client-side rendering, and mixes of the two.\n- 所有三种模式——复合应用程序、API\
  \ 网关和 BFF——都支持服务器端渲染、客户端渲染以及两者的混合。\n- The implementation of an API Gateway is very\
  \ thin: all the endpoints you added to the example API Gateway delegate to other\
  \ microservices.\n- API 网关的实现非常精简：你添加到示例 API 网关中的所有端点都委托给其他微服务。\n"
- "## appendix\n## 附录\nDevelopment\nenvironment setup\n\n开发\n环境设置\n\nThis appendix\
  \ describes how to set up a development environment for working with the code you\
  \ write throughout this book. The development environment has five parts:\n\n本附录描述了如何设置开发环境，以便在整本书中编写代码。开发环境分为五个部分：\n\
  \n- *An IDE*—You can choose between using Visual Studio 2019 or newer, Visual Studio\
  \ Code (VS Code for short), or JetBrains Rider. Visual Studio is Windows-only, whereas\
  \ Visual Studio Code and JetBrains Rider both work on Windows, Mac, and Linux.\n\
  - *一个 IDE*——你可以选择使用 Visual Studio 2019 或更新版本、Visual Studio Code（简称 VS Code）或 JetBrains\
  \ Rider。Visual Studio 仅限 Windows，而 Visual Studio Code 和 JetBrains Rider 都可在 Windows、Mac\
  \ 和 Linux 上运行。\n- *dotnet cli*—You need the dotnet command-line tool to build, create,\
  \ build, and run .NET projects from the command line.\n- *dotnet cli*——你需要 dotnet\
  \ 命令行工具来从命令行构建、创建、构建和运行 .NET 项目。\n- *REST client*—You need a tool for making HTTP\
  \ requests. There are many such tools, including cURL, Fiddler, and Postman; I tend\
  \ to use the REST client plug-in for Visual Studio Code, which I find easy to use,\
  \ works on Windows, Mac, and Linux, and is compatible with the built-in HTTP request\
  \ tools in JetBrains’ IDEs.\n- *REST 客户端*——你需要一个用于发出 HTTP 请求的工具。有许多此类工具，包括 cURL、Fiddler\
  \ 和 Postman；我倾向于使用 Visual Studio Code 的 REST 客户端插件，我发现它易于使用，可在 Windows、Mac 和 Linux\
  \ 上运行，并且与 JetBrains IDE 中的内置 HTTP 请求工具兼容。\n- *Docker and Kubernetes*—You need Docker\
  \ installed to be able to build and run containers. Furthermore, you need Kubernetes\
  \ on top of Docker to be able to work with Kubernetes deployments on the localhost.\n\
  - *Docker 和 Kubernetes*——你需要安装 Docker 才能构建和运行容器。此外，你需要在 Docker 之上使用 Kubernetes，以便在本地主机上使用\
  \ Kubernetes 部署。\n- *Azure cli*—You need the Azure command-line tool to set up a\
  \ Kubernetes cluster in Azure.\n- *Azure cli*——你需要 Azure 命令行工具来在 Azure 中设置 Kubernetes\
  \ 集群。\n\nI’ll walk you through installing and getting up and running with the development\
  \ environment in the following sections.\n\n我将在以下各节中指导你安装并开始使用开发环境。\n\n## A.1 Setting\
  \ up an IDE\n\n## A.1 设置 IDE\n\nThere are three IDEs I recommend you use with this\
  \ book’s code. Which one you choose is a matter of taste; all work fine with everything\
  \ in the book. I, for one,\n\n我推荐你使用本书代码的三种 IDE。你选择哪一个是个人喜好问题；所有 IDE 都能很好地与书中的内容配合使用。我个人，\n\
  \n\n输入 dotnet。如果 dotnet CLI 已安装，你会收到 CLI 的帮助文本；如果没有，你会从 Powershell 得到一个错误。要安装 dotnet\
  \ CLI，请访问 http://dot.net，点击 Download，并按照说明安装 .NET SDK。\n\n## A.3 在 VS Code 中设置 REST\
  \ 客户端\n\nREST 客户端是一个面向文本的简单 VS Code 扩展，允许你发出 HTTP 请求（见图 A.1）。你在本书中会一直使用此类请求与微服务交互。除了简单之外，REST\
  \ 客户端还有一个优点：它处理扩展名为 .http 的文本文件，因此很容易通过版本控制共享示例 HTTP 请求。你会在本书的代码下载和 GitHub 仓库中找到此类文件。此外，同样的文件在\
  \ Rider 中也能以类似的界面工作。\n\n![](img/608267d7803dc57a1a896ad121f37868_316_0.png)\n\n\
  图 A.1 REST 客户端使用简单的 .http 文件。你可以通过点击 Send Request 发出请求，响应显示在右侧窗格中。\n\n要安装 REST 客户端，请在\
  \ VS Code 中转到“扩展”选项卡，搜索 REST client，然后点击 Install。\n\n## A.4 Docker 和 Kubernetes\n\
  \n在本书中，我使用 Docker 将微服务打包为容器，以便部署到生产环境，并使用 Azure 上的 Kubernetes 作为生产环境的示例。为了能够构建 Docker\
  \ 镜像，你需要安装 Docker。安装了 Docker 之后，你可以运行和调试容器，但为了能像在 Azure 上一样运行容器，你还需要 Kubernetes。\n\
  \n如果你使用 Windows 或 Mac，你将使用 Docker Desktop；如果你使用 Linux，你将根据你的 Linux 发行版使用 .deb 或\
  \ .rpm 包。\n\n要安装 Docker，请访问 https://docs.docker.com/engine/install/ 并按照适用于你的平台的说明进行操作。如果你使用\
  \ Windows，在安装 Docker Desktop 时应选择使用带有 Linux 容器的 WSL2 后端。Docker 安装完成后，你应该能够从 shell\
  \ 中调用 docker CLI。\n\n在 Docker 之外，你还需要 Kubernetes。如果你使用 Windows 或 Mac，Docker Desktop\
  \ 已经捆绑了 Kubernetes，你只需在 Docker Desktop 设置中启用 Kubernetes，如图 A.2 所示。第一次会花费一些时间，因为\
  \ Docker Desktop 会下载、安装并启动 Kubernetes。\n\n![](img/608267d7803dc57a1a896ad121f37868_317_0.png)\n\
  \n图 A.2 可以在 Docker Desktop 设置中启用 Kubernetes。\n\n在 Linux 上，你必须单独获取 Kubernetes，并且有很多选择。一个简单的选项是\
  \ MicroK8S，你可以按照 https://microk8s.io/ 上的说明进行安装。安装完 MicroK8S 后，你可能想添加这个别名，以便轻松访问\
  \ Kubernetes 命令行工具：\n\n```\n> snap alias microk8s.kubectl kubectl\n```\n\n安装 Kubernetes\
  \ 后，你应该能够从 shell 中调用 Kubernetes 命令行工具 kubectl。\n\n## A.5 Azure CLI\n\n在本书中，我使用 Azure\
  \ 建立一个小的 Kubernetes 集群，作为生产环境的示例，将微服务部署到该集群。要跟随操作，你需要一个 Azure 账户和 Azure CLI。\n\n\
  要创建 Azure 账户，请访问 https://azure.microsoft.com/en-us/free/。要获取 Azure CLI，请前往 https://docs.microsoft.com/en-us/cli/azure/install-azure-cli\
  \ 并按照适用于你的平台的安装说明操作。安装 Azure CLI 后，你可以在 shell 中运行 `az login` 将 CLI 登录到你的 Azure 账户。\n\
  \n现在你已经拥有 IDE、`dotnet` 命令行工具、用于处理 HTTP 请求的工具、Docker、Kubernetes 和 Azure CLI，可以开始编写本书中的所有示例代码了。\n\

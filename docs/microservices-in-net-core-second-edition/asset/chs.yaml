- '# .NET Core 微服务（第二版）





  '
- '## 前言


  当我最初与 Manning 讨论写书事宜时，我们讨论了一本关于 Nancy 的书。我的一部分我很兴奋能再次撰写关于 Nancy 的内容，因为它是一个出色的 Web
  框架，但我的第一本书也是关于 Nancy 的，而我内心的另一部分则希望这本书能有更深层的内容。经过一番深思并与 Manning 来回沟通后，我明确意识到我想写关于微服务的内容；我想写一本更多关注微服务设计与实施，而非特定技术的书，同时也展示一些优秀的、轻量级的
  .NET 技术。这就成了本书的第一版。


  自那以后，技术领域已发生演变：Nancy 的开发已停止，而 .NET Core（在第一版撰写时还处于萌芽阶段）已吸纳了许多来自社区项目的有用想法，并更名为 .NET。与此同时，微服务变得更加普及，第一版中关于设计和架构的大部分建议依然适用。我觉得第一版仍有很大价值，但也觉得它需要技术上的更新。这就是您即将阅读的书，我希望您不仅能学会如何成功使用微服务，还能学会简洁的价值。



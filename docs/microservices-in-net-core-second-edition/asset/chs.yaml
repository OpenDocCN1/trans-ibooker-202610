  \n[Fact]\npublic async Task Scenario()\n{\n    await RegisterNewUser();\n    await\
  \ RunConsumer();\n    AssertNotificationWasSent();\n}\n\nprivate async Task RegisterNewUser()\n\
  {\n    var actual = await this.sut.PostAsync(\n        \"/users\",\n        new\
  \ StringContent(\n            JsonSerializer.Serialize(\n                new LoyaltyProgramUser(\n\
  \                    0, \"Chr\", 0, new LoyaltyProgramSettings())),\n          \
  \  Encoding.UTF8,\n            \"application/json\"));\n\n    Assert.Equal(HttpStatusCode.Created,\
  \ actual.StatusCode);\n}\n\nprivate Task RunConsumer() =>\n    EventConsumer.ConsumeBatch(\n\
  \        0,\n        100,\n        $\"http://localhost:{mocksPort}/specialoffers\"\
  ,\n        $\"http://localhost:{mocksPort}\");\n\nprivate void AssertNotificationWasSent()\
  \ =>\n    Assert.True(NotificationsMock.ReceivedNotification);\n\npublic void Dispose()\n\
  {\n    this.serviceMock?.Dispose();\n    this.sut?.Dispose();\n    this.loyaltyProgramHost?.Dispose();\n\
  }\n```\n\n```\n\n这个测试显示了为我们的微服务编写服务级测试是多么相对容易和直接。使用不到 100 行代码，RegisterUserAndGetNotification\
  \ 涵盖了忠诚度计划中大量代码和功能：\n\n\n用户注册 API 已覆盖，事件消费者已覆盖，API 与事件消费者之间的交互已覆盖，与特惠和通知微服务的协作也已覆盖。此外，由于\
  \ MocksHost 和用于在测试主机中启动忠诚度计划 API 的代码已就位，编写覆盖该微服务更多部分的其他场景也变得相当简单。\n\n你可以在 PowerShell\
  \ 或 bash 中使用 dotnet test 运行服务级测试，也可以在所选的 IDE 中运行。该测试相对较慢——在我的笔记本电脑上大约 400 毫秒——因此我们需要在服务级测试所提供的覆盖率与信心，以及单元测试所提供的速度与精度之间取得平衡。\n\
  \n## 小结\n\n- 测试金字塔告诉你要有为数不多的测试完整系统的系统级测试，每个微服务要有若干服务级测试，以及每个微服务要有大量单元测试。\n- 系统级测试很可能很慢，而且非常不精确。\n\
  - 你应该为重要的成功场景编写系统级测试，以便为系统的大部分内容提供一些测试覆盖。\n- 服务级测试可能有点慢，但它们比系统级测试更快、更精确。\n- 你应该为每个微服务的成功场景和重要失败场景编写服务级测试。这比仅靠系统级测试能为每个微服务增加更多的测试覆盖。\n\
  - 你可以将编写服务级测试的过程作为编写契约测试的基础，契约测试用于验证一个微服务对另一个微服务的 API 和行为所做的假设。就测试金字塔而言，契约测试介于系统级测试和服务级测试之间。\n\
  - 单元测试很快，而且应保持快速。它们也很精确，因为它们针对的是具体、狭窄的功能片段。\n- 你应该同时为成功和失败场景编写单元测试，并用它们覆盖较难通过更高级别测试覆盖的边界情况。\n\
  - 我建议对每个微服务采用由外向内（outside-in）的方式：先编写服务级测试，当服务级测试变得不便操作时，再开始编写单元测试。\n- Microsoft.AspNetCore.TestHost\
  \ 库是 ASP.NET 的强大伴侣，让 ASP.NET 应用程序中的端点测试变得更加容易。\n- 你可以使用 Microsoft.AspNetCore.TestHost\
  \ 中的测试主机和 TestServer，通过熟悉的 HttpClient API 来测试端点，从而模拟 HTTP 请求。由 TestServer 创建的 HttpClient\
  \ 发出的调用，对于端点 MVC 控制器来说与真实 HTTP 请求完全一样。\n- 你可以在测试主机中同时使用真实数据存储和模拟数据存储来测试端点。\n\n-\
  \ 要编写服务级测试：\n  - 为被测微服务的协作者编写模拟端点，将其作为 MVC 控制器，并使用 ASP.NET Web 主机在测试进程中托管它们。\n \
  \ - 在测试主机中启动被测微服务的 API。使用 ASP.NET 的配置 API，将被测微服务配置为调用模拟的协作者。\n  - 编写通过测试主机发送请求与被测微服务交互的场景。\n\
  \  - 在测试需要时，通过直接调用事件消费者来模拟事件消费者的 Cron 调度。\n  - 既要对被测微服务的响应做出断言，也要对其向协作者发出的请求做出断言。\n\
  - 你可以使用 xUnit 测试框架来编写和运行自动化测试。\n- xUnit 可以通过 dotnet 运行，也可以在所选的 IDE 中运行。\n"
- '# 第 3 部分


  ## 处理横切关注点：构建可复用的微服务平台


  在这一部分，你将学习如何处理一些重要的横切关注点。你将处理的横切关注点包括监控、日志记录、在微服务之间随请求传递追踪 ID，以及围绕微服务间请求的安全问题。所有这些关注点都能让微服务在生产环境中表现良好。有了这些机制，你可以深入了解每个微服务的健康状况，并跨微服务追踪业务事务。在第
  9 章中，我们将利用 ASP.NET 的功能来帮助实现监控、日志记录和追踪关注点。


  在第 10 章中，我们考察不同的身份验证和授权方法，以及保护微服务间请求安全的方法。作为示例，我们将利用 Kubernetes 来保护请求，并控制哪些微服务可以相互调用。


  你可以在每个微服务中实现这些关注点，也可以创建可复用的实现用于许多微服务。在每个微服务中实现关注点显然会产生一些重复工作，但复用实现又会在微服务之间造成耦合。换句话说，你想复用到什么程度，是在保持微服务彼此独立与避免重复工作之间进行权衡。你会在这个权衡中如何取舍，需要根据系统的具体情况来做决定。


  最后，第 11 章展示了如何构建一个可以轻松在许多微服务中复用的平台。

  '
- "## 横切关注点：监控与日志记录\n\n**本章涵盖**\n\n- 微服务系统中的监控\n- 探索结构化日志\n- 跨微服务的分布式追踪\n- 记录未处理的异常\n\
  \n在本章中，你将开始学习 ASP.NET 如何帮助我们处理一些重要的横切关注点：监控、日志记录和追踪。这三者在所有微服务中都是必需的，并且在让微服务系统易于运维方面发挥着重要作用。一旦你的系统投入生产，你需要知道所有微服务是否都在运行，这就是为什么需要监控它们。此外，正如第\
  \ 7 章所讨论的，你需要良好的日志记录来诊断系统。\n\n在这里，你将在一个微服务的上下文中配置中间件。然后，在第 11 章中，你将把该配置放入 NuGet\
  \ 包中，以便在所有微服务中轻松复用。\n\n### 9.1 微服务中的监控需求\n\n当你将任何服务端系统部署到生产环境时，你需要能够检查系统的健康状况。你想知道它是否在运行，是否遇到故障或错误，以及它的性能是否与平时一样好。这对任何系统都适用。对于传统的单体系统，你很可能会设置一些监控并向系统添加日志记录，如图\
  \ 9.1 所示。日志记录通常出现在代码库中的许多位置——只要有重要的内容需要记录——这些消息通常存储在数据库中。\n\n![](img/608267d7803dc57a1a896ad121f37868_229_0.png)\n\
  \n**图 9.1** 传统上，你会在系统周围设置监控，并向系统代码添加日志记录，以将消息记录到数据库中。\n\n微服务系统的情况也类似。你同样有一个总体需求：从可用性、性能、吞吐量和错误率等方面监控系统的健康状况。区别在于，微服务系统由许多独立运行、独立部署的小部件组成，而你需要监控所有这些小部件。从图\
  \ 9.2 来看，这似乎很复杂，但如果你遵循一些约定，让微服务很容易实现监控友好，就不必如此。我们稍后会讲到这一点。\n\n为了监控微服务，你需要添加两个由监控系统轮询的端点。它们用来指示微服务何时准备好接收请求。一个端点在启动期间使用，在微服务完全启动并准备好接收请求之前，它应返回失败；一旦就绪，它应返回成功。另一个端点在微服务启动后使用，在微服务因某种原因无法接收请求之前，它应一直返回成功。这两个端点与\
  \ Kubernetes 支持监控的方式相契合，我们将在本章后面讨论。\n\n第一个端点——`/health/startup`——检查微服务接收请求所需的一切是否就绪，可能包括检查数据库连接、预热缓存，或以其他方式确保微服务具备所需的一切（图\
  \ 9.3）。当微服务仍在启动时，该端点会以 503 Service Unavailable 状态码响应，表示微服务尚未准备好接收请求，如下所示：\n\n```http\n\
  HTTP/1.1 503 Service Unavailable\n\nUnhealthy\n```\n\n\n\n\n图 9.2 每个微服务都通过轮询一个端点来进行监控。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_230_0.png)\n\n图 9.3 每个微服务应有两个监控端点：一个位于\
  \ /health/startup，一个位于 /health/live。监控系统轮询这两个端点。只要两个端点都返回成功响应，监控程序就认为该微服务在线。\n\n\
  ![](img/608267d7803dc57a1a896ad121f37868_230_1.png)\n\n当一切正常时，端点会返回一个简单的 200 OK\
  \ 响应：\n\n```\nHTTP/1.1 200 OK\n```\n\n第二个端点（位于 /health/live）会检查微服务的内部健康状态，如果一切正常，同样返回\
  \ 200 OK 状态码。检查微服务内部健康状态的具体内容因微服务而异。\n\n如图 9.4 所示，你可以使用 ASP.NET 自带的健康检查中间件来实现这两个监控端点。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_231_0.png)\n\n图 9.4 你可以使用 ASP.NET 的健康检查中间件来实现监控端点。\n\
  \n当请求到达 /health/startup 端点时，如果微服务已准备好接收请求，健康检查中间件会返回 200 OK 响应。当请求到达 /health/live\
  \ 端点时，健康检查中间件会执行一次健康检查，如果检查成功，则返回 200 OK。其他请求会穿过监控中间件，进入 MVC 中后续的管线端点。\n\nASP.NET\
  \ 内置了健康检查中间件，我们可以通过添加微服务特有的健康检查来扩展它，以实现这两个监控端点。在本章稍后，我们将实现健康检查，并配置 Kubernetes 使用它们来监控我们的微服务。\n\
  \n## 9.2 **微服务中的日志需求**\n\n除了监控每个单独的微服务外，你还需要发送有关故障、错误、性能以及其他任何需要获取洞察的信息的日志消息。如第\
  \ 7 章所述，你可以引入一个集中式日志微服务，它接收来自所有其他微服务的日志消息，将其保存（例如保存到搜索引擎中），并通过仪表板和搜索界面提供便捷访问（见图\
  \ 9.5）。同样，你希望能够轻松地将每个微服务配置为向日志微服务发送日志消息。\n\n![](img/608267d7803dc57a1a896ad121f37868_232_0.png)\n\
  \n**图 9.5** 所有微服务都将日志消息发送到集中式日志微服务。\n\n在整个系统中传播 trace ID，并将其包含在日志消息中，使我们能够跟随（或追踪）请求在系统中的流转。这提供了上下文，让我们能够更好地排查问题。\n\
  \ntrace ID 通过使用 traceparent 头在微服务之间传递，该头由 W3C Trace Context 标准¹ 规定，该标准指定了共同构成 traceparent\
  \ 头的四个字段：版本、trace ID、父 ID 和追踪标志。我们主要关注的是 trace ID 字段，因为它旨在跟随请求在整个系统中流转。父 ID 提供更多本地上下文，并允许在请求流经系统时发生变化。traceparent\
  \ 头的格式如下：\n\n```\n\"version\"-\"trace id\"-\"parent id\"-\"trace flags\"\n```\n\n\
  例如，如果 trace ID 是 cb32e1c31b369748bf45958f8a49e3e7，父 ID 是 90757069a8f0ea4b，则 traceparent\
  \ 头如下所示：\n\n![](img/608267d7803dc57a1a896ad121f37868_234_0.png)\n\n这意味着从购物车微服务发往商品目录微服务的请求可能如下所示：\n\
  \n```\nHTTP GET /products?productIds=[1,2] HTTP/1.1\nAccept: application/json\n\
  traceparent: 00-cb32e1c31b369748bf45958f8a49e3e7-90757069a8f0ea4b-00\n```\n\n这会让商品目录微服务知道\
  \ trace ID 是 cb32e1c31b369748bf45958f8a49e3e7，并且所有日志消息中都应包含该 trace ID。\n\n除了在 HTTP\
  \ 请求中传播 trace ID 外，我们还应该将其包含在事件中。在事件产生时将 trace ID 与事件一起保存，使我们能够在事后追踪事件产生的原因。这同样是一个强大的故障排查工具。\n\
  \nASP.NET 实现了 Trace Context 标准，因此开箱即用时，ASP.NET 会在传入请求中查找 traceparent 头，并将 trace\
  \ ID 传播到出站请求（由 HttpClient 发出的请求）。如果传入请求没有 traceparent 头，ASP.NET 会分配一个随机的 trace ID。我们很快就会看到这一点。\n\
  \n### 9.2.2 使用 Serilog 进行结构化日志记录\n\n传统的日志库将日志消息视为简单字符串，可能附带异常，但我们将使用更好的方案：一个名为 Serilog\
  \ 的结构化日志库。结构化日志的思想是允许日志消息包含结构化数据：日志消息不仅包含一个平铺直叙的消息——比如“出了问题”，还包含对象。\n\nSerilog 在\
  \ .NET 格式字符串之上，为日志消息引入了一些额外语法。这些额外语法允许你为参数命名，并控制参数的取值是通过调用 .ToString() 转换为字符串，还是将对象作为整体包含在日志消息中。命名参数用花括号括起来，例如\
  \ \"{RequestTime}\"。你可以在名称前面加上 @ 来告诉 Serilog 将整个值包含在消息中：\"{@Request}\"。与 .NET 格式字符串一样，不带前导\
  \ @ 的参数可以添加格式化指令。\n\n例如，你可以将 Serilog 与 .NET 自带的日志器结合使用，发送如下日志消息——假设 log 是配置为使用 Serilog\
  \ 的 .NET 类型 ILogger 的一个实例：\n\n```\nvar simplifiedRequest = new\n{\n    Path = \"\
  /foo\",\n    Method = \"GET\",\n    Protocol = \"HTTP\",\n};\n\nvar requestTime\
  \ = 200;\n\nlog.LogInformation(\n    \"Processed request: {@Request} in {RequestTime:000}\
  \ ms.\",\n    simplifiedRequest,\n    requestTime);\n```\n\nsimplifiedRequest 和\
  \ requestTime 是构成消息一部分的对象。与其他日志框架一样，Serilog 允许你配置不同的接收器（sink）来写入日志消息。这里要使用的接收器是控制台接收器。当上面的日志消息写入控制台时，simplifiedRequest\
  \ 和 requestTime 会经过 JSON 序列化并插入到日志消息字符串中。Serilog 还会添加一些元数据，因此写入控制台的消息如下所示：\n\n```\n\
  2020-12-03 09:14:33 INF Processed request {\"Path\":\"/foo\", \"Method\":\"GET\"\
  , \"Protocol\":\"HTTP\"} in 200 ms.\n```\n\n如你所见，这保留了原始日志消息中的所有数据，因为完整的 simplifiedRequest\
  \ 对象和 requestTime 都被包含在写入控制台的消息中。这很好，但当我们把日志发送到像 Elasticsearch 这样的搜索引擎时，效果会更好。当你这样做时，日志消息中包含的对象（如\
  \ simplifiedRequest）会被存储并在搜索引擎中建立索引。这意味着你可以根据消息中对象特定属性的值来搜索日志消息。例如，你可能会搜索包含一个 Path\
  \ 属性值为 /foo 的 Request 对象的日志消息。之前的消息会被包含，但关于 /bar 请求的日志消息则不会。\n\n保留日志消息中包含数据的结构，意味着日志微服务的\
  \ Web 前端能够以结构化方式展示日志消息。最终得到的日志更容易搜索、更方便总览，包含更多数据，并且可以根据需要深入查看。Kibana 就是这样一个前端，它与存储在\
  \ Elasticsearch 中的日志配合良好，并提供强大的搜索和可视化工具。\n\n正如你在稍后实现日志记录时所看到的，你可以配置 Serilog，使每条日志消息都包含额外数据。这类额外信息的一个例子是上一节中提到的\
  \ traceparent 头中的追踪信息。将追踪信息包含在每条日志消息中，使你能够高效地搜索具有给定 trace ID 的所有日志消息。由于 trace ID\
  \ 跨服务传播，这让我们能够跟踪（或者说追踪）与特定操作相关的日志消息在系统中的流转（例如，如图 9.6 所示，当客户向购物车添加一件商品，并且有一个传入请求到达\
  \ API Gateway，该请求被分配了一个 trace ID 时）。当“添加到购物车”操作流转到其他服务（购物车、商品目录和价格计算微服务）时，trace\
  \ ID 会跟随该操作。通过搜索分配给该“添加到购物车”操作的 trace ID 的日志消息，你可以看到与该特定购物车添加操作相关的所有日志信息。你可以看到 API\
  \ Gateway 做了什么、购物车做了什么、商品目录做了什么，以及价格计算微服务做了什么。这在调试生产环境问题时非常强大。\n\n在本章余下的部分，你将实现监控和日志记录。你需要所有微服务都这样做，因此你可以在已经实现的任何一个微服务的上下文中开展工作。我将以购物车微服务为例，并基于第\
  \ 7 章的代码进行构建，但这段代码同样适用于其他微服务。\n\n## 9.3 实现监控端点\n\n在本节中，你将使用 ASP.NET 的 *健康检查* 支持来实现前面讨论的两个监控端点。这两个端点的行为如下：\n\
  \n- `/health/live`：对每个请求都返回 `200 OK` 状态，表示微服务正在运行且能够处理请求。根据微服务的实现情况，你可能希望在此端点中添加更深层的健康检查。\n\
  - `/health/startup`：执行一次基本的健康检查，如果健康检查成功，则返回 `200 OK` 状态。如果健康检查失败，则返回 `503 Service\
  \ Unavailable`。该健康检查将查询购物车微服务数据库，以确认能否建立数据库连接，因为购物车微服务只要能够查询其数据库，就准备好接收请求了。\n\n\n\
  \n\n\n实现监控端点的计划如下：\n\n- 1. 将 `/health/live` 端点添加到 ASP.NET 管道中。\n- 2. 为购物车数据库创建健康检查。\n\
  - 3. 将 `/health/startup` 端点添加到管道中。\n\n让我们开始吧。\n\n## 9.3.1 实现 /health/live 监控端点\n\
  \n为了实现 `/health/live` 端点，我们利用 ASP.NET 的健康检查功能，这使我们能够轻松添加监控端点。首先，我们需要向服务集合添加一个健康检查。接下来，我们将该健康检查连接到\
  \ `/health/live` 端点。我们将这个健康检查命名为 LivenessHealthCheck，并通过修改 Startup 中的 ConfigureServices\
  \ 方法将其添加到服务集合，如下所示。\n\n### 清单 9.1 将 LivenessHealthCheck 添加到服务集合\n\n```\npublic void\
  \ ConfigureServices(IServiceCollection services)\n{\n    services.AddHealthChecks()\n\
  \        .AddCheck(\n            \"LivenessHealthCheck\",\n            () => HealthCheckResult.Healthy(),\n\
  \            tags: new []{ \"liveness\"});\n    services.AddControllers();\n}\n\n\
  // Annotations:\n// Add facilities supporting health checks.\n// Give the health\
  \ check a name.\n// Add the LivenessHealthCheck.\n// Implement the health check\
  \ to always respond 200 OK.\n// Tag the health check to make it easier to find later.\n\
  ```\n\n这段代码只是向服务集合添加了一个始终响应 200 OK 的健康检查。接下来，我们将通过修改 Startup 中的 Configure 方法，将 `health/live`\
  \ 作为健康检查添加到 ASP.NET 管道，从而将其连接到 `/health/live` 端点：\n\n```\npublic void Configure(IApplicationBuilder\
  \ app, IWebHostEnvironment env)\n{\n    app.UseHttpsRedirection();\n    app.UseHealthChecks(\"\
  /health/live\",\n        new HealthCheckOptions\n        {\n            Predicate\
  \ = x => x.Tags.Contains(\"liveness\")\n        });\n    app.UseRouting();\n   \
  \ app.UseEndpoints(endpoints => endpoints.MapControllers());\n}\n\n// Annotations:\n\
  // Add /health/live as a monitoring endpoint.\n// Use all health checks tagged with\
  \ liveness.\n// Configure how to perform the health check for /health/live.\n```\n\
  \n这会将 `/health/live` 添加为管道中接受 HTTP GET 请求的端点。当收到对 `/health/live` 的请求时，服务集合中所有标记为“liveness”的健康检查都会被执行，如果全部成功，响应将是\
  \ 200 OK。在这种情况下，只有一个标记为“liveness”的健康检查，但如果有需要，我们可以添加更多。这提供了一种很好的模块化方式，将不同的健康检查组合到监控端点中。\n\
  \n这就是实现 /health/live 端点所需的全部内容。现在让我们转向 /health/startup 端点，它遵循相同的模式，只是额外添加了一部分。\n\
  \n## 9.3.2 实现 /health/startup 监控端点\n\n有了 liveness 健康检查之后，我们可以转向实现 startup 健康检查。由于我们将在\
  \ startup 健康检查中检查微服务是否能访问数据库，因此这会稍微复杂一些。为此，我们将首先在一个实现 ASP.NET 接口 IHealthCheck 的类中实现数据库检查，然后使用该类定义另一个健康检查。下面的清单展示了数据库检查的实现。\n\
  \n### 清单 9.2 实现数据库健康检查的类\n\n```\nnamespace ShoppingCart\n{\n    using System.Data.SqlClient;\n\
  \    using System.Threading;\n    using System.Threading.Tasks;\n    using Dapper;\n\
  \    using Microsoft.Extensions.Diagnostics.HealthChecks;\n\n    public class DbHealthCheck\
  \ : IHealthCheck\n    {\n        public async Task<HealthCheckResult> CheckHealthAsync(\n\
  \            HealthCheckContext context,\n            CancellationToken cancellationToken)\n\
  \        {\n            await using var conn =\n                new SqlConnection(\"\
  Data Source=localhost;\nInitial Catalog=ShoppingCart;\nUser Id=SA; Password=yourStrong(!)Password\"\
  );\n\n            var result = await conn.QuerySingleAsync<int>(\"SELECT 1\");\n\
  \            return result == 1\n                ? HealthCheckResult.Healthy()\n\
  \                : HealthCheckResult.Degraded();\n        }\n    }\n```\n\n这个类实现了\
  \ IHealthCheck 接口，该接口只定义了一个方法——CheckHealthAsync——每当健康检查执行时都会调用该方法。CheckHealthAsync\
  \ 的返回值指示检查是否成功。\n\n`/health/startup` 端点的其余实现与 `/health/live` 端点类似，包括将健康检查添加到服务集合，并在管道的端点中使用它。为了实现这一点，我们将\
  \ Startup 类修改为如下所示。\n\n### 清单 9.3 包含两个监控端点的完整 Startup 类\n\n```\npublic class Startup\n\
  {\n    public void ConfigureServices(IServiceCollection services)\n    {\n     \
  \   services.AddHealthChecks()\n            .AddCheck<DbHealthCheck>(\n        \
  \        nameof(DbHealthCheck),\n                tags: new [] { \"startup\" })\n\
  \            .AddCheck(\n                \"LivenessHealthCheck\",\n            \
  \    () => HealthCheckResult.Healthy(),\n                tags: new [] { \"liveness\"\
  \ });\n        services.AddControllers();\n    }\n\n    public void Configure(IApplicationBuilder\
  \ app, IWebHostEnvironment env)\n    {\n        app.UseHttpsRedirection();\n   \
  \     app.UseHealthChecks(\n            \"/health/startup\",\n            new HealthCheckOptions\n\
  \            {\n                Predicate = x => x.Tags.Contains(\"startup\")\n\
  \            });\n        app.UseHealthChecks(\n            \"/health/live\",\n\
  \            new HealthCheckOptions\n            {\n                Predicate =\
  \ x => x.Tags.Contains(\"liveness\")\n            });\n        app.UseRouting();\n\
  \        app.UseEndpoints(endpoints => endpoints.MapControllers());\n    }\n}\n\n\
  Use the DbHealthCheck class to implement a health check.\nTag the health check with\
  \ \"startup.\"\nAdd /health/startup as a health check endpoint.\nUse the new health\
  \ check in /health/startup.\n```\n\n完成这些之后，你可以使用 dotnet 运行购物车微服务并测试监控端点。对 `/health/live`\
  \ 端点的请求如下所示：\n\n```\nGET https://localhost:5001/health/live\n```\n\n成功的响应如下所示：\n\
  \n```\nHTTP/1.1 200 OK\nContent-Type: text/plain\n\nHealthy\n```\n\n以下是对 `/health/startup`\
  \ 端点的请求：\n\n```\nGET https://localhost:5001/health/startup\n```\n\n这是一个成功的响应：\n\n\
  ```\nHTTP/1.1 200 OK\nContent-Type: text/plain\n\nHealthy\n```\n\n最后，以下是一个失败的响应：\n\
  \n```\nHTTP/1.1 503 Service Unavailable\nContent-Type: text/plain\n\nUnhealthy\n\
  ```\n\n至此，监控端点的实现就完成了。稍后，我们将回到这些端点，看看如何配置 Kubernetes 来使用它们。\n\n## 9.4 *实现结构化日志*\n\
  \n如前所述，结构化日志可以提高日志的价值，主要是使其更易于搜索。在本节中，我们将配置购物车微服务使用 Serilog，使日志输出结构化。要让日志结构化，需要三个小步骤：\n\
  \n- 1. 将 Serilog NuGet 包和一个辅助包添加到购物车微服务中\n- 2. 配置 .NET 日志器在底层使用 Serilog\n- 3. 将日志输出改为\
  \ JSON 格式，这种格式更适合机器处理\n\n完成这三个步骤后，我们的日志就可以被 Kubernetes 日志收集，并发送到你选择的日志产品中。（我不会展示如何发送日志，因为这与你选择的日志产品更相关，每个供应商都提供了设置日志发送所需的文档。）\n\
  \n首先，我们将向购物车微服务添加两个 NuGet 包：\n\n- 1. Serilog.Sinks.ColoredConsole：允许我们在控制台进行结构化日志记录的库\n\
  - 2. Serilog.AspNetCore：一个用于将 .NET 日志记录与 Serilog 结合使用的辅助包\n\n一旦这两个包被添加到购物车微服务中，我们就可以使用\
  \ Program.cs 中的以下代码配置 .NET 日志器使用 Serilog。\n\n### 清单 9.4 将 Serilog 用作 .NET 日志器的后端\n\
  \n```\nnamespace ShoppingCart\n{\n    using Microsoft.AspNetCore.Hosting;\n    using\
  \ Microsoft.Extensions.Hosting;\n    using Serilog;\n```\n\n...[/content]中。我们已经在开头和结尾加了。\n\

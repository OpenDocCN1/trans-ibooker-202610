  :\"\",\"Path\":\"/users/0/items\",\"QueryString\":\"\",\"HostingRequestFinishedLog\"\
  :\"Request finished HTTP/1.1 POST https://localhost:5001/users/0/items application/json\
  \ 9 - 200 0 - 165.5149ms\",\"EventId\":{\"Id\":2,\"Name\":\"RequestFinished\"},\"\
  SourceContext\":\"Microsoft.AspNetCore.Hosting.Diagnostics\",\"RequestId\":\"0HM4QJ9RN6M7Q:00000002\"\

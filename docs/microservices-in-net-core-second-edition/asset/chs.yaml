  :1,\"productName\":\"Basic t-shirt\",\"description\":\n    \"a quiet t-shirt\",\"\
  price\":{\"currency\":\"eur\",\"amount\":40}},\n    {\"productCatalogueId\":2,\"\
  productName\":\"Fancy shirt\",\"description\":\n    \"a loud t-shirt\",\"price\"\
  :{\"currency\":\"eur\",\"amount\":50}}]}\n2020-12-07 11:10:39 f2e604d90da6114a8d4a77daa57a7890\

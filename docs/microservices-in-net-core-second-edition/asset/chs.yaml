- "## 微服务一览\n\n**本章涵盖**\n\n- 理解微服务及其核心特征\n- 审视微服务的优点与缺点\n- 一个微服务协同工作以服务用户请求的示例\n-\
  \ 使用 ASP.NET 构建一个简单应用\n\n在本章中，我将解释什么是微服务，并演示它们为何值得关注。我们还会了解微服务的六个特征。最后，我将向你介绍本书中最重要的技术：ASP.NET\
  \ 和 ASP.NET MVC。\n\n### 1.1 什么是微服务？\n\n*微服务*是一种只具备一项且唯一一项高度聚焦能力的服务，该能力通过远程 API 暴露给系统中的其他部分。例如，想象一个系统\n\
  \n它们只需要知道如何相互通信。有些可能通过队列、服务总线、gRPC 或 GraphQL 进行通信，具体取决于系统需求；但通常，微服务确实通过 HTTP 进行通信。\n\
  \n注意 本书专注于使用 C# 和 ASP.NET 在 .NET 中实现微服务。我将展示的微服务是小型、高度聚焦的 ASP.NET 应用程序，它们通过 HTTP\
  \ 进行协作。\n\n注意 本书专注于通过 HTTP 进行协作，但指导协作设计的原则并不特定于 HTTP。我选择使用 HTTP，因为它无处不在且为许多开发者所熟悉，而我希望更多地关注设计原则而非技术。这些原则同样适用于其他技术，尤其是\
  \ gRPC——它在 .NET 领域越来越受欢迎，也是一个不错的选择。\n\n### 1.2 什么是微服务架构？\n\n本书专注于设计和实现单个微服务，但值得注意的是，“微服务”一词也可以用来描述由许多微服务组成的整个系统的架构风格。作为一种架构风格，微服务是面向服务架构（SOA）的一种轻量级形式，其中每个服务都高度聚焦于做好一件事。采用微服务架构的系统是一个分布式系统，包含（可能数量庞大的）协作微服务。\n\
  \n微服务架构风格在构建和维护复杂的服务器端软件系统方面迅速流行起来。这完全可以理解：微服务相比更传统的面向服务方法和单体架构，提供了许多潜在优势。微服务如果做得好，具有可塑性、可扩展性和健壮性，并且能让系统在\
  \ Nicole Forsgren 等人在《加速》¹ 和 DORA DevOps 状态报告² 中确定的四个关键指标上表现出色，即：\n\n1. 部署频率\n2.\
  \ 变更前置时间\n3. 服务恢复时间\n4. 变更失败率\n\n对于复杂的软件系统来说，同时实现这四点往往难以企及。此外，正如 Forsgren 等人所证明的，这组指标是软件交付绩效的可靠预测因子。\n\
  \n在本书中，你将学习如何设计和实现可塑、可扩展且健壮的微服务，从而构建在这四个关键指标上均表现优异的系统。\n\n1 Nicole Forsgren, Gene\
  \ Kim, and Jez Humble. Accelerate. IT Revolution Press: 2018.\n\n2 Nicole Forsgren,\
  \ Dustin Smith, Jez Humble, and Jessie Frazelle, \"Accelerate: State of DevOps 2018,\"\
  \ https://inthecloud.withgoogle.com/state-of-devops-18/dl-cd.html.\n\n#### 1.2.1\
  \ 微服务的特征\n\n我说过微服务是“一种只具备一项高度聚焦能力的服务”，但这究竟意味着什么？实际上，业界对于微服务的精确定义并没有广泛接受的标准。³ 然而，我们可以看看微服务通常具备哪些特征。我发现微服务有六个核心特征：\n\
  \n- 微服务负责单一能力。\n- 微服务可独立部署。\n- 微服务由一个或多个进程组成。\n- 微服务拥有自己的数据存储。\n- 一个小团队可以维护少量微服务。\n\
  - 微服务是可替换的。\n\n这份特征清单应该能帮助你识别一个设计良好的微服务，同时也能帮助你界定和实现自己的微服务。通过融入这些特征，你将能够充分发挥微服务的优势，并最终构建出可塑、可扩展且健壮的系统。在本书中，我将展示这些特征如何驱动微服务的设计，以及如何编写微服务满足这些特征所需的代码。现在，让我们逐一简要了解每个特征。\n\
  \n#### 负责单一能力\n\n微服务在整个系统中只负责一项且唯一一项能力。我们可以将这句话拆分为两部分：\n\n- 微服务具有单一职责。\n- 该职责是针对一项能力的。\n\
  \n单一职责原则有多种表述方式。一种传统形式是：“一个类应该只有一个引起它变化的原因。”⁴ 虽然这种表述特别提到了类，但事实证明该原则适用于面向对象语言中类之外的场景。对于微服务，我们在服务级别应用单一职责原则。\n\
  \n另一种较新的单一职责原则表述同样来自 Robert C. Martin：“将因相同原因而变化的事物聚集在一起。将因不同原因而变化的事物分离开来。”⁵ 这种表述方式适用于微服务：一个微服务应该恰好实现一项能力。这样，只有当该项能力发生变化时，它才需要改变。此外，你应该努力让微服务完整地实现该能力，以便当能力发生变化时，只需要修改这一个微服务。\n\
  \n微服务系统中有两种类型的能力：\n\n- *业务能力*是系统为达成其目的而做的事情，例如跟踪用户的购物车或计算价格。梳理系统中不同业务能力的一个好方法是使用领域驱动设计。\n\
  - *技术能力*是其他多个微服务需要使用的能力——例如与某个第三方系统的集成。技术能力并不是将系统拆分为微服务的主要驱动力；只有当你发现多个业务能力微服务需要相同的技术能力时，才会识别出它们。\n\
  \n注意 关于微服务范围和职责的定义将在第 4 章中介绍。\n\n³ 关于微服务特征的进一步讨论，我推荐这篇文章：Martin Fowler and James\
  \ Lewis, “Microservices: A Definition of This New Architectural Term,” March 25,\
  \ 2014, http://martinfowler.com/articles/microservices.html。\n\n⁴ Robert C. Martin,\
  \ “SRP: The Single Responsibility Principle,” http://mng.bz/zQyz。\n\n⁵ Robert C.\
  \ Martin, “The Single Responsibility Principle,” May 8, 2014, http://mng.bz/RZgU。\n\
  \n#### 可独立部署\n\n微服务应该是*可独立部署*的。当你修改某个特定的微服务时，你应该能够将其部署到生产环境，而无需部署（或触碰）系统中的任何其他部分。在部署被修改的微服务期间，系统中的其他微服务应继续运行和工作，并在新版本部署完成后继续运行。\n\
  \n考虑一个电子商务网站。每当购物车微服务发生更改时，你应该能够只部署该微服务，如图 1.2 所示。与此同时，价格计算、推荐、产品目录等微服务应继续工作并服务用户请求。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_28_0.png)\n\n图 1.2 在部署购物车微服务时，其他微服务继续运行。\n\
  \n能够单独部署每个微服务非常重要，因为在微服务系统中有许多微服务，每个微服务可能与其他多个微服务协作。同时，开发工作是在部分或全部微服务上并行进行的。如果你必须以同步方式部署全部或一组微服务，管理部署很快就会变得笨拙，通常会导致不频繁且大型、高风险的部署。这是你应该避免的。相反，你希望能够频繁地将小改动部署到每个微服务，从而实现小规模、低风险的部署。\n\
  \n\n\n\n为了能够在系统其余部分继续运行的同时部署单个微服务，构建过程应考虑以下几点：\n\n- 每个微服务都应被构建为独立的工件（例如，独立的 Docker\
  \ 容器）。\n- 部署过程还应设置为支持在其他微服务继续运行时单独部署微服务。例如，你可以使用滚动部署过程，一次将一个微服务部署到一台服务器上，以减少停机时间。Kubernetes——以及其他编排技术——支持这种以及其他有用的部署模式。\n\
  \n希望单独部署微服务这一事实会影响它们的交互方式。对微服务接口的更改通常必须向后兼容，以便其他现有微服务能够继续以与旧版本相同的方式与新版本协作。此外，微服务的交互方式必须健壮，也就是说，每个微服务都必须预料到其他服务偶尔会失败，并继续尽最大努力工作。一个微服务发生故障——例如，由于部署期间的停机——不得导致其他微服务故障，而只应导致功能下降或处理时间稍长。\n\
  \n> **注意** 微服务的协作和健壮性将在第 4、5 和 7 章中介绍。\n\n#### 由一个或多个进程组成\n\n如果微服务要尽可能独立于同一系统中的其他微服务，它必须在单独的进程或多个单独的进程中运行。如果微服务要保持可单独部署，也是如此。这可以总结为两点：\n\
  \n- 每个微服务必须在与其他微服务分离的进程中运行。\n- 每个微服务可以有多个进程。\n\n再次考虑购物车微服务。如果它与商品目录微服务运行在同一进程中，如图\
  \ 1.3 所示，购物车代码可能会在商品目录中造成一个\n\n![](img/608267d7803dc57a1a896ad121f37868_29_0.png)\n\
  \n**图 1.3** 在同一进程内运行多个微服务会导致两者之间的高度耦合；它们无法单独部署，并且一个微服务可能导致另一个微服务停机。\n\n副作用。\n\n\
  这意味着购物车和商品目录微服务之间会产生紧密且不理想的耦合：一个可能导致另一个停机或出现错误。\n\n现在，考虑部署购物车微服务的新版本。你要么必须重新部署商品目录微服务，要么需要某种能够在运行进程中切换购物车代码的动态代码加载机制。第一种选择直接违背了微服务可单独部署的要求。第二种选择很复杂，而且至少会使商品目录微服务面临因购物车微服务部署而停机的风险。\n\
  \n说到复杂性，为什么微服务要由多个进程组成？毕竟，你正努力让每个微服务尽可能简单易处理。\n\n让我们考虑一个推荐微服务。它实现并运行驱动电子商务网站推荐的算法。它还有一个数据库，用于存储提供推荐所需的数据。算法在一个进程中运行，数据库在另一个进程中运行。通常，微服务需要两个或更多进程，才能实现为系统提供某种能力所需的一切（例如数据存储和后台处理）。\n\
  \n#### 拥有自己的数据存储\n\n微服务拥有存储其所需数据的数据存储。这是微服务范围是完整能力的又一结果。大多数业务能力都需要一些数据存储。例如，商品目录微服务需要存储每个产品的某些信息。为了保持商品目录与其他微服务的松散耦合，包含产品信息的数据存储完全由该微服务拥有。商品目录微服务决定如何以及何时存储产品信息。如图\
  \ 1.4 所示，其他\n\n![](img/608267d7803dc57a1a896ad121f37868_30_0.png)\n\n*图 1.4* 一个微服务不能访问另一个微服务的数据存储。\n\
  \n微服务（例如购物车）只能通过商品目录的接口访问产品信息，绝不能直接从商品目录的数据存储中访问。\n\n每个微服务拥有自己的数据存储这一事实，使得可以根据每个微服务的需求为不同的微服务使用不同的数据库技术。例如，商品目录微服务可以使用\
  \ SQL Server 存储产品信息；购物车微服务可以将每个用户的购物车存储在 Redis 中；推荐微服务可以使用 Elasticsearch 索引来提供推荐。为微服务选择的数据库技术是实施的一部分，对其他微服务不可见。\n\
  \n这种方法允许每个微服务使用最适合该工作的数据库，这也能在开发时间、性能和可扩展性方面带来好处。明显的缺点是，如果你选择这样架构系统，就需要管理、维护和使用多个数据库。数据库往往是复杂的技术，学会使用并让其在生产环境中可靠运行并非没有代价。在为微服务选择数据库时，你需要考虑这种权衡。但微服务拥有自己的数据存储的一个好处是，以后可以将一个数据库换成另一个。\n\
  \n> 注意 数据所有权、访问和存储将在第 5 章中介绍。\n\n#### 由一个小团队维护\n\n到目前为止，我还没有过多讨论微服务的大小，尽管术语中的“微”部分表明微服务很小。我认为讨论一个微服务应该有多少行代码，或者它应该实现多少需求、用例或功能点，是没有意义的。这些都取决于微服务所提供功能的复杂性。\n\
  \n然而，有意义的是考虑维护一个微服务所涉及的工作量。以下经验法则可以指导你把握微服务的规模：一个小团队——也许五个人——应该能够维护几个微服务。在这里，“维护一个微服务”意味着处理保持其健康和适合用途的所有方面：开发新功能、从已经变得太大的微服务中拆分出新的微服务、在生产中运行它、监控它、测试它、修复错误，以及所有其他必要的工作。根据微服务中的变更量，“几个”可能意味着\
  \ 10 到 30 个微服务，甚至更多（当系统、工具和自动化成熟且有效时）。一个团队通常应该拥有一组内聚的业务和技术能力，从而使它拥有实现这些能力的微服务。\n\
  \n#### 可替换的\n\n要使微服务可替换，它必须能够在合理的时间范围内从头重写。换句话说，维护该微服务的团队应该能够用全新的实现替换当前实现，并在其正常的工作节奏内完成。这个特性是对微服务规模的另一个约束：如果它变得太大，替换成本会很高；但如果保持较小，重写它是现实的。\n\
  \n团队为什么会决定重写一个微服务？也许代码是一大团乱麻，不再易于维护。也许它在生产环境中表现不够好。这两种情况都不理想，但随着时间的推移，需求的变化可能导致代码库更适合替换而非维护。如果微服务足够小，可以在合理的时间范围内重写，那么偶尔出现其中一种情况也没关系。团队根据编写现有实现所获得的所有知识进行重写，并牢记任何新需求。\n\
  \n现在你了解了微服务的特征，让我们来看看它们的好处、成本和其他考虑因素。\n\n### 1.3 为什么使用微服务？\n\n使用遵循上一节所述特征的微服务构建系统有一些吸引人的好处：它们具有可塑性、可扩展性和健壮性，并且从开始实现到部署到生产环境的交付周期很短。这意味着在\
  \ Accelerate[6] 中概述的所有四项关键指标上都能表现出色。这些好处之所以能实现，是因为如果做得好，微服务：\n\n- 支持持续交付\n- 由于高度可维护，支持高效的开发者工作流\n\
  - 设计上具有健壮性\n- 可以彼此独立地扩展或缩减\n\n让我们更详细地谈谈这些要点。\n\n#### 1.3.1 支持持续交付\n\n微服务架构风格将持续交付纳入考量。它通过重点关注以下服务来实现这一点：\n\
  \n- 可以快速开发和修改\n- 可以通过自动化测试进行全面测试\n- 可以独立部署\n- 可以被高效运维\n\n这些特性支持持续交付，但这并不意味着采用微服务架构就会自动实现持续交付。两者关系更为复杂：使用微服务实践持续交付通常比更传统的\
  \ SOA 更容易。另一方面，只有能够高效可靠地部署服务，才可能全面采用微服务。持续交付和微服务相辅相成。\n\n6 Nicole Forsgren、Gene\
  \ Kim 和 Jez Humble。*Accelerate*。IT Revolution Press：2018年。\n\n\n\n\n\n持续交付的好处众所周知。它们包括在业务层面的敏捷性提升、可靠的发布、风险降低以及产品质量的改善。\n\
  \n#### 什么是持续交付？\n\n*持续交付* 是一种开发实践，团队确保软件随时都可以快速部署到生产环境。发布到市场仍然是业务决策，但实践持续交付的团队往往会频繁部署到生产环境，并在新软件进入源代码控制后不久就部署它。\n\
  \n持续交付有两个主要要求。首先，软件必须始终处于完全可用的状态。为此，团队需要高度关注质量。这导致了高度的测试自动化以及以非常小的增量进行开发。其次，部署过程必须可重复、可靠且快速，以便实现频繁的生产部署。这部分通过完全自动化部署过程以及对生产环境健康状况的高度洞察来实现。\n\
  \n尽管持续交付需要相当多的技术技能，但它更多是流程和文化的问题。这种质量、自动化和洞察水平需要开发和运营软件的所有相关方之间密切协作的文化，包括业务人员、开发人员、信息安全专家和系统管理员。换句话说，它需要一种\
  \ DevOps 文化，开发、运营和其他团队协作并相互学习。\n\n持续交付与微服务相辅相成。如果没有能够快速廉价地部署单个微服务的能力，构建由它们组成的系统很快就会变得昂贵。如果微服务部署没有自动化，部署一个完整的微服务系统所需的手工工作量将不堪重负。\n\
  \n持续交付带来了 DevOps 文化，而这也是微服务的先决条件。要想在微服务方面取得成功，每个人都必须致力于使服务在生产环境中平稳运行，并在生产系统的健康状况上创造高度透明度。这需要具备运营、开发和安全技能的人员以及对业务领域有深入了解的人员等之间的协作。\n\
  \n本书不会专注于持续交付或 DevOps，但它会默认你在其中开发微服务的环境使用持续交付。本书中构建的服务可以部署到任何云或本地服务器，使用任何数量能够处理\
  \ .NET 的部署自动化技术。本书确实涵盖了持续交付和 DevOps 对单个微服务的意义。在第 3 部分，我们将详细介绍如何构建一个处理所有微服务必须解决的运营问题的平台。\n\
  \n作为部署示例，我们将在第 3 章在微软的 Azure 云中创建一个 Kubernetes 环境并向其部署一个微服务。在接下来的章节中，我们将继续使用该 Kubernetes\
  \ 环境作为示例并向其部署微服务。\n\n### 1.3.2 高可维护性\n\n结构良好且实现良好的微服务从几个角度来看都具有高度可维护性。从开发人员角度来看，有几个因素会影响微服务的可维护性：\n\
  \n- 每个结构良好的微服务提供单一功能。不是两个——只有一个。\n- 微服务拥有自己的数据存储。其他服务不能干扰微服务的数据存储。这加上微服务代码库的典型规模意味着你可以一次性理解一个完整的服务。\n\
  - 编写良好的微服务可以（并且应该）被自动化测试全面覆盖。\n\n从运营角度来看，有几个因素会影响微服务的可维护性：\n\n- 一个小型团队可以维护几十个微服务，这些微服务必须构建得便于高效运营，这意味着你应该能够轻松确定任何微服务的当前健康状况。\n\
  - 每个微服务都可以单独部署。\n\n由此可以推断，生产环境中的问题可以及时发现并快速解决，例如通过扩展相关微服务或部署其新版本。微服务拥有自己的数据存储这一事实也增加了其运营可维护性，因为对数据存储的维护范围仅限于拥有该存储的微服务。\n\
  \n#### 偏好轻量级\n\n由于每个微服务都处理单一功能，微服务在本质上相当小，无论是其范围还是代码库大小。这种源于有限范围的简洁性是一项主要优势。\n\n\
  在开发微服务时，重要的是避免通过使用大型复杂的框架、库或产品来使代码库复杂化，因为你认为将来可能需要其功能。很可能不会如此，因此你应优先选择能够满足微服务当前需求的更小、更轻量级的技术。记住，微服务是可以替换的：如果在某个时间点你最初使用的技术不再满足需求，你可以在合理的预算内完全重写它。\n\
  \n### 1.3.3 健壮且可扩展\n\n基于微服务的分布式架构允许你根据瓶颈出现的位置单独扩展每个微服务。此外，微服务偏好基于异步事件的协作，并在需要同步通信的地方强调容错的重要性。实现良好时，这些特性会产生高可用、高可扩展的系统。我们将在第\
  \ 5、6 和 7 章更详细地讨论这些主题。\n\n### 1.4 微服务的成本和缺点\n\n选择微服务架构会带来显著的成本，这些成本不应被忽视：\n\n- 微服务系统是分布式系统。分布式系统的成本是众所周知的：它们可能比单体系统更难推理和测试，并且跨进程边界或跨网络的通信比进程内方法调用慢几个数量级。\n\
  - 微服务系统由许多微服务组成，每个微服务都必须在生产环境中进行开发、部署和管理。这意味着你将有许多部署和复杂的生产设置。\n- 每个微服务都是一个单独的代码库。因此，将代码从一个微服务重构到另一个微服务是痛苦的。你需要投入精力确保每个微服务的范围恰到好处。\n\
  \n在全速投入构建微服务系统之前，你应该考虑你正在实现的系统是否足够复杂以证明相关的开销是合理的。\n\n#### 微服务性能如何？\n\n关于是否使用微服务的一个讨论中总会出现的疑问是，用微服务构建的系统是否会像非微服务的系统一样具有性能。反对的论点是，如果系统由许多协作的微服务构建，每个用户请求都将涉及多个微服务，它们之间的协作将涉及远程调用。当用户请求到来时会发生什么？你是否将一系列远程调用串联起来，从一个微服务到下一个微服务？考虑到远程调用比进程内调用慢几个数量级，这听起来很慢。\n\
  \n这个论点的症结在于你会在不同系统部分之间进行与所有内容都在一个进程中时大致相同的调用。首先，正如我们在第 5 章和第 7 章将学到的，微服务之间的交互应该比进程内调用的粒度要粗得多。其次，正如我们在第\
  \ 5 章和第 6 章将讨论的，你会更倾向于基于事件的异步协作而不是进行同步远程调用，并且你会在多个微服务中存储相同数据的副本以确保它在需要的地方可用。总的来说，这些技术极大地减少了在用户请求处理期间进行远程调用的需求\n\
  \n\n\n\nis waiting. Moreover, the fine-grained nature of microservices enables you\
  \ to scale out the specific parts of the system that get congested.\n\nThere isn't\
  \ a simple yes-or-no answer as to whether microservices perform well. What I can\
  \ say is that a well-designed microservice system can easily meet the performance\
  \ requirements of many, if not most, systems.\n\n### 1.5 Greenfield vs. brownfield\n\
  \nShould you introduce microservices from the get-go on a new project, or are they\
  \ only relevant for large, existing systems? This question tends to come up in discussions\
  \ about microservices.\n\nThe microservices architectural style has grown out of\
  \ the fact that many organizations' systems started out small but have grown big\
  \ over time. Many of these systems consist of a single large application—a monolith\
  \ that often exposes the well-known disadvantages of big, monolithic systems:\n\n\
  - Coupling is high throughout the codebase.\n- There's hidden coupling between subcomponents:\
  \ coupling that is now obvious at first glance can spring from knowledge implicit\
  \ in the code about how certain strings are formatted, how certain columns in a\
  \ databases are used, and so on.\n- Deploying the application is a lengthy process\
  \ that may involve several people and system downtime.\n- The system has a one-size-fits-all\
  \ architecture intended to handle the most complex components. If you insist on\
  \ architectural consistency across the monolith, the least complex parts of the\
  \ system will be over-engineered. This is true of layering, technology choices,\
  \ chosen patterns, and so on.\n\nThe microservices architectural style arose as\
  \ a result of solving these problems in existing monolithic systems. If you repeatedly\
  \ split subcomponents of a monolith into ever smaller and more manageable parts,\
  \ microservices are eventually created.⁷\n\nOn the other hand, new projects are\
  \ started all the time. Are microservices irrelevant for these greenfield projects?\
  \ That depends. Here are some questions you need to ask yourself:\n\n- Is the system's\
  \ scope large enough to justify the complexity of a distributed architecture?\n\
  - Is the system's scope large enough to justify the cost of building the deployment\
  \ automation?\n- Would this system benefit from the ability to deploy subsystems\
  \ separately?\n\n⁷ Some microservices advocates argue that the correct way to arrive\
  \ at microservices is to apply the Strangler pattern repeatedly to different subcomponents\
  \ of the monolith. See Martin Fowler, “MonolithFirst,” June 3, 2015, http://martinfowler.com/bliki/MonolithFirst.html.\n\
  \n- Can you build sufficient deployment automation?\n- Are you sufficiently knowledgeable\
  \ about the domain to properly identify and separate the system’s various independent\
  \ business capabilities?\n- Will the project survive long enough to recover the\
  \ up-front investment in automation and distribution?\n\nSome greenfield projects\
  \ meet these criteria and may benefit from adopting a microservices architecture\
  \ from the outset.\n\n### 1.6 Code reuse\n\nAdopting a microservices architecture\
  \ leads to having many services, each of which has a separate codebase that you’ll\
  \ have to maintain. It’s tempting to look for code reuse across services in the\
  \ hope that you can reduce the maintenance effort. And although there’s an obvious\
  \ potential benefit to code reuse, pulling code out of a service and into a reusable\
  \ library incurs a number of costs that may not be immediately apparent and that\
  \ might mean the code reuse isn’t worth it:\n\n- The service now has one more dependency\
  \ that you must understand in order to understand the complete service. This isn’t\
  \ to say that there’s more code to comprehend, but by moving code out of the service\
  \ and into a library you move the code further away, making simple code navigation\
  \ slower and refactoring more difficult.\n- The code in the new library must be\
  \ developed and maintained with multiple use cases in mind. This tends to take more\
  \ effort than developing for just one use case.\n- The shared library introduces\
  \ a form of coupling between the services using it. Updates to the library driven\
  \ by the needs of service A may not be needed in service B. Should service B update\
  \ to the new version of the library even though it’s not strictly necessary? If\
  \ you upgrade B, it will have code it doesn’t need—and worse, B will run the risk\
  \ of errors caused by that code. If you don’t upgrade, you’ll have several versions\
  \ of the library in production, further complicating the library’s maintenance.\
  \ Both cases incur some complexity, either in service B or in the combined service\
  \ landscape.\n\nThese points apply particularly to business code, which should almost\
  \ never be reused across microservices. That type of reuse leads to harmful coupling\
  \ between microservices and identifying a new business capability. Implementing\
  \ it in a new microservice is usually a better option.\n\nWith these points in mind,\
  \ you should be wary of code reuse and only judiciously attempt it. There is, however,\
  \ a case to be made for reusing infrastructure code that implements technical concerns.\n\
  \nTo keep a service small and focused on providing one capability well, you’ll often\
  \ prefer to write a new service from scratch rather than add functionality to an\
  \ existing service. It’s important to do this quickly and painlessly, and this is\
  \ where code reuse across services is relevant. As we’ll explore in detail in part\
  \ 3, there are a number of technical concerns that all services need to implement\
  \ in order to fit well into the overall service landscape. You don’t need to write\
  \ this code for every service; you can put it into a reusable platform and reuse\
  \ it across services to gain consistency in how these technical aspects are handled\
  \ and to reduce the effort needed to create a new service.\n\n### 1.7 Serving a\
  \ user request: An example of how microservices work in concert\n\nTo get a feel\
  \ for how a microservices architecture works, let’s look at an example: a user of\
  \ an e-commerce website adding an item to their shopping cart. From the viewpoint\
  \ of the client-side code, a request is fired to the backend system via an API Gateway,\
  \ and an updated shopping cart along with some price information is returned. This\
  \ is as simple as the interaction shown in figure 1.5. We’ll return to the topic\
  \ of API Gateways in chapter 13.\n\n![](img/608267d7803dc57a1a896ad121f37868_38_0.png)\n\
  \nFigure 1.5 When frontend code makes a request to add an item to the shopping cart,\
  \ it only communicates with the API Gateway microservice. What goes on behind the\
  \ gateway isn’t visible.\n\nThis is neither surprising nor exciting. The interesting\
  \ part is the interactions taking place behind the API Gateway microservice to fulfill\
  \ the request. To add the new item to the user’s shopping cart, the API Gateway\
  \ uses a few other microservices. Each microservice is a separate process, and in\
  \ this example they communicate via HTTP requests.\n\n### 1.7.1 Main handling of\
  \ the user request\n\nAll the microservices and their interactions for fulfilling\
  \ a user request to add an item to their shopping cart are shown in figure 1.6.\
  \ The request to add an item to the shopping cart is divided into smaller tasks,\
  \ each of which is handled by a separate microservice:\n\n- The API Gateway microservice\
  \ is responsible only for a cursory validation of the incoming request. Once it’s\
  \ validated, the work is delegated first to the shopping cart microservice and then\
  \ to the price calculation microservice.\n- The shopping cart microservice uses\
  \ another microservice—the product catalog—to look up the necessary information\
  \ about the item being added to\n\n### 1.7.2 Side effects of the user request\n\n\
  At this particular e-commerce website, when a user adds an item to their shopping\
  \ cart, a couple of actions happen in addition to adding the item to the cart:\n\
  \n1. The recommendation engine updates its internal model to reflect the fact that\
  \ the user has shown a high degree of interest in that particular product.\n2. The\
  \ tracking service records that the user added the item to their cart in the tracking\
  \ database. This information may be used later for reporting or other business intelligence\
  \ purposes.\n\nNeither of these actions needs to happen in the context of the user’s\
  \ request; they may as well happen after the request has ended, when the user has\
  \ received a response and is no longer waiting for the backend system.\n\nYou can\
  \ think of these types of actions as side effects of the user’s request. During\
  \ the request the fact that the user added an item to the shopping is recorded as\
  \ an event. The side effects aren’t direct effects of the request to update the\
  \ user’s shopping cart; they’re secondary effects that happen as reactions to the\
  \ event that recorded that the item was added to the cart. Figure 1.7 zooms in on\
  \ the side effects of adding an item to the cart.\n\n![](img/608267d7803dc57a1a896ad121f37868_40_0.png)\n\
  \nFigure 1.7 The shopping cart microservice publishes events, and other subscribing\
  \ microservices react.\n\nThe trigger for these side effects is an ItemAddedToCart\
  \ event published by the Shopping Cart microservice. Two other microservices subscribe\
  \ to events from shopping cart and take the necessary actions as events (such as\
  \ ItemAddedToCart events) occur. These two subscribers react to the events asynchronously—outside\
  \ the context of the original request—so the side effects may happen in parallel\
  \ with the main handling of the request or after the main handling has completed.\n\
  \n\n\n\nNOTE 使用事件源实现这种事件驱动架构将在第5章中介绍。\n\n#### 1.7.3 完整视图\n\n总共有六个不同的微服务参与处理向购物车添加商品请求，如图1.8所示。这些微服务中没有任何一个了解其他微服务的内部结构。其中五个拥有专用的私有数据存储区，仅服务于其自身用途。部分处理在用户请求的上下文中同步进行，部分则异步进行。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_41_0.png)\n\n图1.8 当用户将商品添加到购物车时，前端向API网关微服务发起请求，该微服务与其他微服务协作以完成请求。在处理过程中，微服务可能会引发事件，其他微服务可以订阅并异步处理这些事件。\n\
  \n这是一个典型的微服务系统。请求通过多个微服务的协作来处理，每个微服务只负责单一职责，并尽可能保持与其他微服务的独立性。\n\n现在，我们从一个高层角度具体查看了微服务系统如何处理用户请求，是时候简要了解一下基于\
  \ .NET 的微服务技术栈了。\n\n### 1.8 .NET 微服务技术栈\n\n是时候来介绍本书中使用的最核心技术：ASP.NET、ASP.NET MVC\
  \ 和 Kubernetes 了。\n\n### 1.8.1 ASP.NET 和 MVC\n\nASP.NET 是微软的 Web 平台，具有多项与本书中我们将创建的微服务相关的优势：\n\
  \n- 跨平台——ASP.NET 基于 .NET 5，可在 Linux、Windows 等平台上运行。这在决定在哪里运行微服务时提供了一定的灵活性。我们将在 Kubernetes\
  \ 集群中的 Linux 容器内运行它们，但微服务也可以在不同的容器编排器、Windows 容器，或 Windows 或 Linux 服务器上运行。\n- 快速——ASP.NET\
  \ 很快，底层的 .NET 5 平台⁸ 同样如此。这为构建快速的微服务奠定了良好的基础。\n- 微服务是一等公民——ASP.NET 的主要目标之一是微服务，这意味着该平台已经实现了我们需要自行实现的一些重要基础功能，例如请求日志记录和监控支持。\n\
  - 中间件管道——中间件是一种轻量级、可组合且灵活的方式来构建处理传入 HTTP 请求的管道。我们的微服务将在其中间件管道的末端使用 ASP.NET MVC。\n\
  - 可测试——我们将利用 ASP.NET 的 TestHost 测试助手，以有利于测试驱动开发中“由外到内”风格的方式，对微服务进行彻底测试。\n\n在 ASP.NET\
  \ 平台之上，我们将使用微软的 ASP.NET MVC⁹ Web 框架，它在实现 HTTP 端点处理器时提供了额外的便利性。\n\n### 1.8.2 Kubernetes\n\
  \nKubernetes 是一个容器编排器，我们将使用它来运行微服务。它允许我们自动化部署，并在某种程度上管理我们的微服务。在第3章中，我们将在 Azure 中创建一个\
  \ Kubernetes 集群，并查看如何\n\n⁸ 根据 TechEmpower 基准测试：https://www.techempower.com/benchmarks/。\n\
  \n⁹ 在整个书中，我将经常把 ASP.NET MVC 简称为 MVC。\n\n将我们的微服务部署到 Kubernetes 集群。随后，我们将继续将微服务部署到\
  \ Kubernetes。\n\n### 1.8.3 设置开发环境\n\n在开始编写第一个微服务代码之前，你需要具备合适的工具。要跟随本书中的示例，你需要四个主要工具：IDE、.NET\
  \ 命令行、HTTP 工具和 Docker。\n\n首先，你需要一个用于创建 ASP.NET 应用程序的开发环境。三种最常见的选择如下：\n\n- Visual\
  \ Studio——Visual Studio 是一个功能完备的 IDE，对编写和调试 ASP.NET 应用程序提供了很好的支持。它仅支持 Windows，可能是\
  \ ASP.NET 开发中最广泛使用的 IDE。\n- Visual Studio Code——Visual Studio Code 是一个功能丰富的编辑器，自带\
  \ C# 插件，使其成为编写 ASP.NET 应用程序的得力工具。它轻量级，并支持 Windows、Linux 和 Mac。\n- JetBrains Rider——Rider\
  \ 是另一个功能完备的 IDE，对编写和调试 ASP.NET 应用程序提供了强大的支持。Rider 在 Windows、Linux 和 Mac 上均可运行。\n\
  \n所有这些工具都支持开发、运行和调试 ASP.NET 应用程序。它们都提供了带有 IntelliSense 和重构支持的 C# 编辑器。它们都支持 ASP.NET，并且都可以启动和调试\
  \ ASP.NET 应用程序。\n\n其次，你需要拥有 .NET 命令行工具的一个版本。如果 IDE 没有附带该工具，请按照 http://dot.net 上的说明安装\
  \ .NET。这将为你提供一个名为 `dotnet` 的命令行工具，用于执行与微服务相关的各种任务，包括还原、构建、创建 NuGet 包以及运行微服务。在整个书中，我将使用\
  \ `dotnet` 命令行来完成这些任务，但如果你愿意，也可以在 IDE 中完成大部分工作。\n\n第三，你需要一个发起 HTTP 请求的工具。我推荐使用 Visual\
  \ Studio Code 的 REST 客户端插件，但 Fiddler、Postman 和 cURL 也是优秀且流行的工具。你可以使用其中任何一个来跟随本书中的示例。\n\
  \n第四，你需要安装 Docker，并需要在 Docker 设置中启用 Kubernetes。\n\nNOTE 在附录A中，你可以找到 Visual Studio、Visual\
  \ Studio Code、JetBrains Rider 和 Docker 的下载、安装及快速使用信息。现在是时候设置你选择的工具了——在书的剩余部分你将需要它们。\n\
  \n### 1.9 一个简单的微服务示例\n\n一旦你拥有了可运行的开发环境，是时候来一个“Hello World”式的微服务示例了。你将使用 ASP.NET\
  \ 创建一个微服务，\n\n该微服务只有一个 API 端点。通常，一个微服务会有多个端点，但对于这个示例来说，一个就足够了。该端点响应当前的 UTC 日期和时间。图1.9对此进行了说明。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_44_0.png)\n\n**图1.9** 一个“Hello World”式的微服务，响应当前的日期和时间\n\
  \n> **NOTE** 当我提到*API端点*、*HTTP端点*或仅仅*端点*时，我指的是你的某个微服务响应 HTTP 请求的 URL。\n\n要实现这个示例，你将遵循以下三个步骤：\n\
  \n1. 创建一个空的 ASP.NET 应用程序。\n2. 向应用程序添加 ASP.NET MVC。\n3. 添加一个包含端点实现的 MVC 控制器。\n\n\
  接下来的部分将详细讲解每一步。\n\n### 1.9.1 创建一个空的 ASP.NET 应用程序\n\n你需要做的第一件事是使用 .NET 命令行工具创建一个名为\
  \ `Hello-Microservices` 的空 ASP.NET 应用程序。如果你愿意，也可以使用 IDE 创建项目——结果是一样的。要使用 .NET 命令行工具，打开一个\
  \ shell 并执行命令 `dotnet new web --name HelloMicroservices`。\n\n一旦你创建了空的 ASP.NET 应用程序并将其命名为\
  \ Hello-Microservices，你应该会看到一个名为 HelloMicroservices 的文件夹，其中包含以下文件：\n\n- appsettings.Development.json\n\
  - appsettings.json\n- HelloMicroservices.csproj\n- Program.cs\n- Startup.cs\n\n\
  项目中还有其他文件，但目前你只需要关注这些文件。\n\n这是一个完整的应用程序，随时可以运行。它将响应路径“/”的 HTTP GET 请求，并返回字符串 Hello\
  \ World。你可以通过进入 HelloMicroservices 文件夹并输入命令 `dotnet run` 从命令行启动该应用程序。\n\n该应用程序在本地主机端口\
  \ 5000 上运行。（请注意，如果你选择在 Visual Studio 内部运行，可能会分配到另一个端口。）如果在浏览器中访问 http://localhost:5000，你将得到“Hello\
  \ World”响应。\n\n\n\n\n\n### 1.9.3 添加一个带有端点实现的 MVC 控制器\n\n现在你将添加一个带有单个 API 端点实现的 MVC\
  \ 控制器。我们将控制器实现为继承自 ControllerBase 的类，并使用它们来声明端点并为每个端点实现行为。由于我们在上一节中向 Startup 添加了\
  \ endpoints.MapControllers 行，ASP.NET 将发现我们在控制器中声明的端点。我们通过创建一个名为 CurrentDateTimeController.cs\
  \ 的文件并向其中添加以下代码来添加一个控制器。\n\n### Listing 1.2 MVC Controller\n\n```\nnamespace HelloMicroservices\n\
  {\n    using System;\n    using Microsoft.AspNetCore.Mvc;\n\n    public class CurrentDateTimeController\
  \ : ControllerBase\n    {\n        [HttpGet(\"/\")]\n        public object Get()\
  \ => DateTime.UtcNow;\n    }\n}\n```\n\n在此控制器中，你使用属性 HttpGet(\"/\") 为路径 / 声明了一个路由。这告诉\
  \ MVC 任何对 / 的 HTTP GET 请求都应由属性后面的方法处理，此例中为方法 Get()。Get() 方法返回当前的 UTC 日期和时间，因此这是对\
  \ / 的每次 HTTP GET 请求的响应。\n\n你现在可以重新运行应用程序并再次将浏览器指向 https://localhost:5001。你的浏览器将命中你的\
  \ MVC 控制器的路由并以字符串形式显示当前的 UTC 日期和时间。我们也可以使用 Visual Studio Code 中的 REST 客户端插件来做同样的事情，如图\
  \ 1.10 所示。\n\n![](img/608267d7803dc57a1a896ad121f37868_46_0.png)\n\nFigure 1.10\
  \ REST client in VS Code makes it easy to send HTTP requests and control the request\
  \ details, such as the headers and HTTP method.\n\n在网络上，这是请求：\n\n```\nGET / HTTP/1.1\n\
  Host: localhost:5001\nAccept: application/json\n```\n\nHTTP method (GET), path (/),\
  \ and protocol (HTTP/1.1) used in the request\n\nHost to which the request is made\n\
  \nList of request headers. In this case, there's only an Accept header with the\
  \ value application/json.\n\n此请求的响应是当前 UTC 日期和时间以 JSON 字符串形式表示：\n\n```\nHTTP/1.1\
  \ 200 OK\nConnection: close\nDate: Thu, 21 Nov 2019 12:28:01 GMT\nContent-Type:\
  \ application/json; charset=utf-8\nServer: Kestrel\nTransfer-Encoding: chunked\n\
  ```\n\n```\n\"2019-11-21T12:28:02.5561423Z\"\n```\n\n> NOTE Remember you can create\
  \ HTTP request and see the responses using tools like REST client for VS Code, Postman,\
  \ or Fiddler.\n\n你现在已经使用 ASP.NET MVC 实现了你的第一个 HTTP 端点。\n\n### Summary\n\n- Microservices\
  \ is an overloaded term used both for the microservices architectural style and\
  \ for individual microservices in a system of microservices.\n- The microservices\
  \ architectural style is a special form of SOA, where each service is small and\
  \ provides one and only one business capability.\n- A microservice is a service\
  \ with a single narrowly focused capability.\n- I'll refer to six characteristics\
  \ of a microservice in this book:\n  - Provides a single capability.\n  - Individually\
  \ deployable. You must be able to deploy every microservice on its own without touching\
  \ any other part of the system.\n  - Runs in one or more processes, separate from\
  \ other microservices.\n  - Owns and stores the data belonging to the capability\
  \ it provides in a data store that the microservice itself has access to.\n  - Is\
  \ small enough that a small team of around five people can develop and maintain\
  \ a few handfuls or more of them.\n  - Replaceable. The team should be able to rewrite\
  \ a microservice from scratch in a short period of time if, for instance, the codebase\
  \ has become a mess.\n- Microservices go hand-in-hand with continuous delivery:\n\
  \  - Having small, individually deployable microservices makes continuous delivery\
  \ easier.\n  - Being able to deploy automatically, quickly, and reliably simplifies\
  \ deploying and maintaining a system of microservices.\n- A system built with microservices\
  \ allows for scalability and resilience.\n- A system built with microservices is\
  \ malleable: it can be easily changed according to your business needs. Each microservice\
  \ by itself is highly maintainable, and even creating new microservices to provide\
  \ new capabilities can be done quickly.\n- Microservices collaborate to provide\
  \ functionality to the end user.\n- A microservice exposes a remote public API that\
  \ other microservices may use.\n- A microservice can expose a feed of events that\
  \ other microservices can subscribe to. Events are handled asynchronously in the\
  \ subscribers but still allow subscribers to react to events quickly.\n- ASP.NET\
  \ is well suited for implementing microservices.\n- Kubernetes is the container\
  \ orchestrator we will use throughout the book.\n- Most microservices don't serve\
  \ HTML from their endpoints, but rather data in the form of JSON, for instance.\
  \ Tools like REST client, Postman, and Fiddler are good for testing such endpoints.\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_51_0.png)\n\n**Figure 2.1** The shopping\
  \ cart microservice allows other microservices to get a shopping cart, add items\
  \ to and delete items from a shopping cart, and subscribe to events from the shopping\
  \ cart.\n\n![](img/608267d7803dc57a1a896ad121f37868_51_1.png)\n\n**Figure 2.2**\
  \ Overview of how an e-commerce site built with microservices can handle adding\
  \ an item to a user’s shopping cart\n\nThe shopping cart microservice supports three\
  \ types of synchronous requests:\n\n- Getting a shopping cart\n- Adding an item\
  \ to a shopping cart\n- Deleting an item from a shopping cart\n\nOn top of that,\
  \ it exposes an event feed that other microservices can subscribe to. Now that you’ve\
  \ seen an overview of the shopping cart microservice’s complete functionality, you\
  \ can start drilling into its implementation.\n\n### 2.1.1 Components of the Shopping\
  \ Cart microservice\n\nLet’s zoom in and see what this microservice looks like at\
  \ closer range. As shown in figure 2.3, the shopping cart microservice consists\
  \ of these components:\n\n- A small component called shopping cart domain model\
  \ responsible for implementing any business rules related to shopping carts.\n-\
  \ An HTTP API component that’s responsible for handling all incoming HTTP requests.\
  \ The HTTP API component is divided into two parts: one handles requests from other\
  \ microservices to do something, and the other exposes an event feed.\n\n![](img/608267d7803dc57a1a896ad121f37868_52_0.png)\n\
  \nFigure 2.3 The shopping cart microservice is a small codebase with a few components\
  \ that provide one focused business capability.\n\nThere are two data store components:\
  \ EventStore and ShoppingCartStore. These data store components are responsible\
  \ for talking to the data store (Shopping Cart Database):\n\n- EventStore handles\
  \ saving events to and reading them from the data store.\n- ShoppingCartStore handles\
  \ reading and updating shopping carts in the data store. Note that shopping carts\
  \ and events may be stored in different databases; we’ll return to this in chapter\
  \ 6.\n\nThe ProductCatalogClient component is responsible for communicating with\
  \ the product catalog microservice shown in figure 2.1. Placing that communication\
  \ in ProductCatalogClient serves several purposes:\n\n- It encapsulates knowledge\
  \ of the other microservice’s API in one place.\n- It encapsulates the details of\
  \ making an HTTP request.\n- It encapsulates caching results from the other microservice.\n\
  - It encapsulates handling errors from the other microservice.\n\nThis chapter includes\
  \ the code for the domain model, the HTTP API, and a basic implementation of ProductCatalogClient,\
  \ but skips EventStore and ShoppingCartStore and the data store. In addition, for\
  \ the sake of brevity, this chapter omits error-handling code. Chapter 5 will go\
  \ further into detail about how to implement microservice APIs easily with ASP.NET;\
  \ chapter 6 will also return to the subject of storing data in a microservice. Chapter\
  \ 7 will dive deeper into how to design robustness and error handling into clients\
  \ such as ProductCatalogClient.\n\n## 2.2 Implementing the Shopping Cart microservice\n\
  \nNow that you understand the shopping cart microservice’s components, it’s time\
  \ to get into the code.\n\n### New technologies used in this chapter\n\nIn this\
  \ chapter, you’ll begin using three new technologies:\n\n- System.Net.Http.HttpClient\
  \ is a .NET type for making HTTP requests. It provides an API for creating and sending\
  \ HTTP requests as well as reading the responses that come back.\n- Polly is a library\
  \ that makes it easy to implement the more common policies for handling remote-call\
  \ failures. Out of the box, Polly has support for various retry and circuit breaker\
  \ policies. I’ll discuss circuit breakers in chapter 7.\n- Scrutor is a library\
  \ that adds a number of convenient extensions to ASP.NET’s built-in dependency injection\
  \ container\n\n### 2.2.1 Creating an empty project\n\nThe first thing you need to\
  \ do is set up an ASP.NET project, just as in chapter 1. First, create an empty\
  \ ASP.NET application called ShoppingCart—on the command line, you can use the command\
  \ dotnet new web -n ShoppingCart. Second, add ASP.NET MVC to the application in\
  \ the Startup class, as shown in the following listing.\n\n### Listing 2.1 Startup\
  \ class with MVC\n\n```\nnamespace ShoppingCart\n{\n    using Microsoft.AspNetCore.Builder;\n\
  \    using Microsoft.Extensions.DependencyInjection;\n}\n```\n\n\n```csharp\npublic\
  \ class Startup\n{\n    public void ConfigureServices(IServiceCollection services)\n\
  \    {\n        services.AddControllers();\n    }\n\n    public void Configure(IApplicationBuilder\
  \ app)\n    {\n        app.UseHttpsRedirection();\n        app.UseRouting();\n \
  \       app.UseEndpoints(endpoints =>\n            endpoints.MapControllers());\n\
  \    }\n}\n```\n\n现在，你拥有了一个随时可以使用的空应用程序。\n\n## 2.2.2 面向其他服务的购物车微服务 API\n\n在本节中，你将实现购物车微服务的\
  \ HTTP API，如图 2.4 中突出显示的部分。该 API 由三部分组成，每一部分都实现为一个 HTTP 端点：\n\n- 一个 HTTP GET 端点，其他微服务可以通过提供用户\
  \ ID 来获取用户的购物车，返回结果为 JSON 文档。\n- 一个 HTTP POST 端点，其他微服务可以向用户的购物车中添加物品。要添加的物品以产品 ID\
  \ 的 JSON 数组形式传递给该端点。\n- 一个 HTTP DELETE 端点，其他微服务可以从用户的购物车中移除物品。要删除的物品以产品 ID 的 JSON\
  \ 数组形式放在请求体中传递。\n\n![](img/608267d7803dc57a1a896ad121f37868_54_0.png)\n\n接下来的三节将分别实现其中一个端点。\n\
  \n**注意：** 我不会展示 EventStore 或 ShoppingCartStore 的实现。第 6 章会介绍它们，但现在，一个简单的硬编码实现就足够了。你可以从本书的代码包中获取\
  \ EventStore 和 ShoppingCartStore 的实现，也可以自己创建一个。\n\n### 获取购物车\n\n你将实现的 HTTP API 的第一部分是让其他微服务能够获取用户购物车的端点。图\
  \ 2.5 展示了其他微服务如何使用端点来获取购物车。\n\n![](img/608267d7803dc57a1a896ad121f37868_55_0.png)\n\
  \n图 2.5 其他微服务可以使用购物车上的端点，以 JSON 文档的形式获取购物车。\n\n该端点接受 HTTP GET 请求。其 URL 包含其他微服务所需购物车对应的用户\
  \ ID，响应主体是该购物车的 JSON 序列化结果。\n\n例如，图 2.1 中的 API 网关可能需要 ID 为 123 的用户的购物车。为了获取它，网关会发送以下\
  \ HTTP 请求：\n\n```\nHTTP GET /shoppingcart/123 HTTP/1.1\nHost: shoppingcart.my.company.com\n\
  Accept: application/json\n```\n\n这是对购物车微服务上 shoppingcart/123 的请求，URL 中的 123 部分就是用户\
  \ ID。\n\n为了处理这些请求，你需要向 ShoppingCart 项目中添加一个名为 ShoppingCartController 的控制器，以及 ShoppingCart\
  \ 领域模型。我倾向于采用一种遵循领域划分的文件夹结构，将紧密相关的内容集中在一起，将不太相关的内容分开。因此，我在 ShoppingCart 项目中新建了一个名为\
  \ ShoppingCart 的文件夹，将 ShoppingCartController 和 ShoppingCart 放在里面。下面的清单展示了文件夹结构。该文件夹结构遵循领域划分，将紧密相关的内容放在以领域命名的文件夹中。例如，ShoppingCart\
  \ 领域类型和控制器位于同一个文件夹中。\n\n**清单 2.2 ShoppingCart 文件夹结构**\n\n```\nShoppingCart\n  appsettings.Development.json\n\
  \  appsettings.json\n```\n\nShoppingCart 领域模型很简单，如下所示：\n\n```csharp\nnamespace ShoppingCart.ShoppingCart\n\
  {\n    using System.Collections.Generic;\n    using System.Linq;\n\n    public class\
  \ ShoppingCart\n    {\n        private readonly HashSet<ShoppingCartItem> items\
  \ = new();\n\n        public int UserId { get; }\n        public IEnumerable<ShoppingCartItem>\
  \ Items => this.items;\n\n        public ShoppingCart(int userId) => this.UserId\
  \ = userId;\n\n        public void AddItems(IEnumerable<ShoppingCartItem> shoppingCartItems)\n\
  \        {\n            foreach (var item in shoppingCartItems)\n              \
  \  this.items.Add(item);\n        }\n\n        public void RemoveItems(int[] productCatalogueIds)\
  \ =>\n            this.items.RemoveWhere(i => productCatalogueIds.Contains(\n  \
  \              i.ProductCatalogueId));\n    }\n\n    public record ShoppingCartItem(\n\
  \        int ProductCatalogueId,\n        string ProductName,\n        string Description,\n\
  \        Money Price)\n    {\n        public virtual bool Equals(ShoppingCartItem?\
  \ obj) =>\n            obj != null && this.ProductCatalogueId.Equals(obj.ProductCatalogueId);\n\
  \n        public override int GetHashCode() =>\n            this.ProductCatalogueId.GetHashCode();\n\
  \    }\n\n    public record Money(string Currency, decimal Amount);\n}\n```\n\n\
  领域模型就绪后，我们就可以编写 ShoppingCartController 了。正如第 1 章所述，我们将通过继承 Controller 来实现控制器，并使用控制器来实现\
  \ HTTP 端点。将以下代码放入名为 ShoppingCartController.cs 的文件中。\n\n**清单 2.3 按用户 ID 访问购物车的端点**\n\
  \n```csharp\nnamespace ShoppingCart.ShoppingCart\n{\n    using Microsoft.AspNetCore.Mvc;\n\
  \    using ShoppingCart;\n\n    [Route(\"/shoppingcart\")]\n    public class ShoppingCartController\
  \ : ControllerBase\n    {\n        private readonly IShoppingCartStore shoppingCartStore;\n\
  \n        public ShoppingCartController(IShoppingCartStore shoppingCartStore)\n\
  \        {\n            this.shoppingCartStore = shoppingCartStore;\n        }\n\
  \n        [HttpGet(\"{userId:int}\")]\n        public ShoppingCart Get(int userId)\
  \ =>\n            this.shoppingCartStore.Get(userId);\n    }\n```\n\n- 告诉 MVC 该控制器中的所有路由都以\
  \ /shoppingcart 开头\n- 将 ShoppingCartController 声明为控制器\n- 声明用于处理对 /shoppingcart/{userId}（例如\
  \ /shoppingcart/123）请求的端点\n- 将 URL 中的 {userId} 赋值给 userId 变量\n- 返回用户的购物车。MVC 会在将其发送给客户端之前进行序列化。\n\
  \n让我们来分析一下这段代码。\n\n`[HttpGet(\"{userId:int}\")]` 特性声明了你希望处理与括号内模式匹配的 HTTP GET 请求端点。该模式可以是一个字符串字面量，例如\
  \ `\"/shoppingcart\"`；也可以包含与请求 URL 的某些部分匹配并将其捕获的段，例如 `{userId:int}`；还可以将字符串字面量和段组合起来，例如\
  \ `\"/shoppingcart/{userId:int}\"`。`{userId:int}` 名为 userId，并且被约束为只能匹配整数。\n\nHttpGet\
  \ 特性后面是一个方法：\n\n```csharp\npublic ShoppingCart Get(int userId) =>\n    this.shoppingCartStore.Get(userId);\n\
  ```\n\n这就是操作（action）方法，每当购物车微服务收到与路由声明匹配的 URL 请求时，都会执行这段代码。例如，当 API 网关通过 URL 路径\
  \ /shoppingcart/123 请求购物车时，处理该请求的就是这个方法。\n\n操作方法可以接受与 URL 各段匹配的参数。例如，根据参数名和段名，int\
  \ userId 会与 {userId} 段匹配。\n\n操作方法使用一个 shoppingCartStore 对象，该对象由 ShoppingCartController\
  \ 的构造函数作为参数接收，并赋值给一个实例变量：\n\n```csharp\npublic ShoppingCartController(IShoppingCartStore\
  \ shoppingCartStore)\n{\n    this.shoppingCartStore = shoppingCartStore;\n}\n```\n\
  \n```csharp\npublic class ShoppingCartStore : IShoppingCartStore\n{\n    private\
  \ static readonly Dictionary<int, ShoppingCart> Database = new Dictionary<int, ShoppingCart>();\n\
  \n    public ShoppingCart Get(int userId) =>\n        Database.ContainsKey(userId)\n\
  \        ? Database[userId]\n        : new ShoppingCart(userId);\n\n    public void\
  \ Save(ShoppingCart shoppingCart) =>\n        Database[shoppingCart.UserId] = shoppingCart;\n\
  }\n```\n\n目前使用内存字典而不是数据库。\n\n回到 ShoppingCartController，操作方法 Get 返回从 shoppingCartStore\
  \ 获取的 ShoppingCart 对象：\n\n```csharp\nthis.shoppingCartStore.Get(userId);\n```\n\n\
  ShoppingCart 类型是购物车微服务特有的，因此 MVC 无法了解这个特定类型。但你可以返回任何你想要的类型，MVC 会将其序列化并将数据返回给调用方。\n\
  \n下面的清单展示了向 /shoppingcart/123 发起请求后，响应结果的一个示例。\n\n**清单 2.4 购物车微服务的响应示例**\n\n```\n\
  HTTP/1.1 200 OK\nContent-Type: application/json; charset=utf-8\n\n539\n{\n  \"userId\"\
  : 42,\n  \"items\": [\n    {\n      \"productCatalogueId\": 1,\n      \"productName\"\
  : \"Basic t-shirt\",\n      \"description\": \"a quiet t-shirt\",\n      \"price\"\
  : {\n        \"currency\": \"eur\",\n        \"amount\": 40\n      }\n    },\n \
  \   {\n      \"productCatalogueId\": 2,\n      \"productName\": \"Fancy shirt\"\
  ,\n      \"description\": \"a loud t-shirt\",\n      \"price\": {\n        \"currency\"\
  : \"eur\",\n        \"amount\": 50\n      }\n    }\n  ]\n}\n```\n\n- 响应主体为 JSON\
  \ 格式。\n- 响应主体的长度\n- 序列化为 JSON 的购物车\n\n\n\n\n\n正如你所见，使用少量代码即可实现大量功能并使其运行。\n\n## 向购物车添加商品\n\
  \n你需要添加到购物车微服务中的第二个端点可让你向用户的购物车中添加商品。图 2.6 显示了其他微服务如何使用此端点。\n\n![](img/608267d7803dc57a1a896ad121f37868_60_0.png)\n\
  \n图 2.6 其他微服务可以通过包含请求体中产品 ID 数组的 HTTP POST 请求向购物车添加商品。\n\n与上一节中的 HTTP GET 端点类似，此新端点在\
  \ URL 中接收用户 ID。这次，端点接受 HTTP POST 请求而不是 HTTP GET，并且请求应在请求体中提供商品列表。例如，以下请求将两件商品添加到用户\
  \ 123 的购物车中。\n\n### 代码清单 2.5 向购物车添加两件商品\n\n```\nPOST /shoppingcart/123/items HTTP/1.1\n\
  Host: shoppingcart.my.company.com\nAccept: application/json\nContent-Type: application/json\n\
  \n[1, 2]\n```\n\nURL 包含购物车的 ID：123。\n响应应为 JSON 格式。\n请求体中的数据为 JSON。\n请求体是产品 ID 的\
  \ JSON 数组。\n\n要处理此类请求，你需要在 ShoppingCart-Controller 中添加另一个 action 方法。新的 action 方法从请求体中读取商品，查找每个商品的产品信息，将它们添加到正确的购物车中，并返回更新后的购物车。\
  \ （获取产品信息的代码在第 2.2.3 节中显示。）\n\n新的 action 方法显示在下一个清单中。将它添加到 ShoppingCart-Controller。\n\
  \n### 代码清单 2.6 添加商品到购物车的路由处理程序\n\n```\n[Route(\"/shoppingcart\")]\npublic class\
  \ ShoppingCartController : Controller\n{\n```\n```csharp\nprivate readonly IShoppingCartStore\
  \ shoppingCartStore;\nprivate readonly IProductCatalogClient productCatalogClient;\n\
  private readonly IEventStore eventStore;\n\npublic ShoppingCartController(\n   \
  \ IShoppingCartStore shoppingCartStore,\n    IProductCatalogClient productCatalogClient,\n\
  \    IEventStore eventStore)\n{\n    this.shoppingCartStore = shoppingCartStore;\n\
  \    this.productCatalogClient = productCatalogClient;\n    this.eventStore = eventStore;\n\
  }\n\n[HttpGet(\"{userId:int}\")]\npublic ShoppingCart Get(int userId) =>\n    this.shoppingCartStore.Get(userId);\n\
  \n[HttpPost(\"{userId:int}/items\")]\npublic async Task<ShoppingCart> Post(\n  \
  \  int userId,\n    [FromBody] int[] productIds)\n{\n    var shoppingCart = shoppingCartStore.Get(userId);\n\
  \    var shoppingCartItems =\n        await this.productCatalogClient\n        \
  \    .GetShoppingCartItems(productIds);\n    shoppingCart.AddItems(shoppingCartItems,\
  \ eventStore);\n    shoppingCartStore.Save(shoppingCart);\n    return shoppingCart;\n\
  }\n```\n```\n\n![](img/608267d7803dc57a1a896ad121f37868_61_0.png)\n\n这里有两种新的 MVC\
  \ 能力在发挥作用。首先，新的 action 方法是异步的，因为它对产品目录微服务进行了远程调用。异步执行该外部调用可为购物车节省资源。ASP.NET 可以完全异步运行，这使得应用程序代码能够很好地利用\
  \ C# 的 async/await 功能。当我们超越 IShoppingCartStore 的虚拟实现并开始使用真实数据库时，同样的原则也适用，IShoppingCartStore\
  \ 上的 Get 和 Save 方法也将变为 async，这反过来会使 action 方法 Get 变为 async。\n\n其次，请求的 body 包含产品\
  \ ID 的 JSON 数组。这些是要添加到购物车的商品。action 使用 MVC 模型绑定将其读取为 C# 数组：\n\n```\n```csharp\n\
  [FromBody] int[] productIds\n```\n```\n\n模型绑定支持任何可序列化的 C# 对象。你通常会使用比平面 JSON 数组更结构化的对象来向端点发送数据，读取它与本例一样简单。参数\
  \ `int[] productIds` 的类型只需更改为 `int[]` 以外的其他类型即可。\n\n## 从购物车中移除商品\n\n第三个也是最后一个端点是一个\
  \ HTTP DELETE 端点，如图 2.7 所示，可让其他微服务从购物车中移除商品。你现在应该已经掌握了向控制器添加端点的方法。你需要实现一个 HTTP DELETE\
  \ 端点，该端点接受产品 ID 数组并从购物车中移除这些产品。将以下代码添加到 ShoppingCartController。\n\n![](img/608267d7803dc57a1a896ad121f37868_63_0.png)\n\
  \n**图 2.7** 其他微服务可以通过在请求体中提供产品 ID 数组的 HTTP DELETE 请求从购物车中移除商品。\n\n```\n```csharp\n\
  [HttpDelete(\"{userId:int}/items\")]\npublic ShoppingCart Delete(\n    int userId,\n\
  \    [FromBody] int[] productIds)\n{\n    var shoppingCart =\n        this.shoppingCartStore.Get(userId);\n\
  \    shoppingCart.RemoveItems(\n        productIds,\n        this.eventStore);\n\
  \    this.shoppingCartStore.Save(shoppingCart);\n    return shoppingCart;\n}\n```\n\
  ```\n\n如果它们使用不同的 HTTP 方法，使用相同的路由模板进行两个路由声明是可以的。\n\neventStore 将在 RemoveItems 方法中稍后使用。\n\
  \n这完成了 ShoppingCartController，其代码最终约为 50 行。\n\n## 2.2.3 获取产品信息\n\n现在购物车微服务公开的 API\
  \ 已经实现，让我们换个思路，看看产品信息是如何从产品目录微服务获取的。图 2.8 突出了 ProductCatalogClient，你将在本节中实现它。\n\n\
  产品目录微服务和购物车微服务是运行在不同进程中的独立微服务，甚至可能运行在不同的服务器上。产品目录公开了一个 HTTP API，供购物车使用。产品目录信息是通过对产品目录微服务上的端点进行的\
  \ HTTP GET 请求获取的。\n\n![](img/608267d7803dc57a1a896ad121f37868_64_0.png)\n\n# 图 2.8\
  \ ProductCatalogClient\n\n要实现对产品目录微服务的 HTTP 请求，你需要遵循以下三个步骤：\n\n- 1. 实现 HTTP GET\
  \ 请求。\n- 2. 解析产品目录微服务端点的响应并将其转换为购物车微服务的领域。\n- 3. 实现处理对产品目录微服务失败请求的策略。\n\n后续章节将引导你完成这些步骤。\n\
  \n## 实现 HTTP GET\n\n产品目录微服务在路径 /products 上公开一个端点。端点接受产品 ID 数组作为查询字符串参数，并返回这些产品的产品信息。例如，以下请求获取产品\
  \ ID 1 和 2 的信息：\n\n```\nHTTP GET /products?productIDs=[1,2] HTTP/1.1\nHost: productcatalog.my.company.com\n\
  Accept: application/json\n```\n\n你将使用 HttpClient 类型执行 HTTP 请求。不是使用真实的产品目录微服务，实现会调用\
  \ GitHub 上的一个硬编码 JSON 文件，该文件充当产品目录端点的伪版本。使用该伪端点，以下代码向产品目录微服务发出 HTTP GET 请求。\n\n\
  ### 代码清单 2.9 向产品目录微服务发出 HTTP GET 请求\n\n```\npublic class ProductCatalogClient :\
  \ IProductCatalogClient\n{\n    private readonly HttpClient client;\n    private\
  \ static string productCatalogBaseUrl =\n```\n\n![](img/608267d7803dc57a1a896ad121f37868_64_1.png)\n\
  \n```\n@\"https://git.io/JeHiE\";\nprivate static string getProductPathTemplate\
  \ = \"?productIds={0}\";\n\npublic ProductCatalogClient(HttpClient client)\n{\n\
  \    client.BaseAddress =\n        new Uri(productCatalogBaseUrl);\n    client\n\
  \        .DefaultRequestHeaders\n        .Accept\n        .Add(new MediaTypeWithQualityHeaderValue(\"\
  application/json\"));\n    this.client = client;\n}\n\npublic async Task<IEnumerable<ShoppingCartItem>>\n\
  \    GetShoppingCartItems(int[] productCatalogIds)\n{\n    ....\n}\n\nprivate async\
  \ Task<HttpResponseMessage>\n    RequestProductFromProductCatalog(int[] productCatalogIds)\n\
  {\n    var productsResource =\n        string.Format(getProductPathTemplate,\n \
  \           string.Join(\",\", productCatalogIds));\n    return await\n        this.client.GetAsync(productsResource);\n\
  }\n```\n\nASP.NET 注入 HttpClient。\n\n配置 HttpClient 以使用产品目录的基础地址。\n\n配置 HttpClient\
  \ 以接受来自产品目录的 JSON 响应。\n\n稍后会实现\n\n指示 HttpClient 异步执行 HTTP GET\n\n这相当直接。唯一需要注意的是，通过异步执行\
  \ HTTP GET 请求，当前线程被释放以处理购物车中的其他任务，而请求在产品目录中处理。这是一种良好的实践，因为它保留了购物车微服务中的资源，使其资源消耗更少、更具可扩展性。\n\
  \n为了让 ASP.NET 能够在 ProductCatalogClient 中注入 HttpClient，我们需要将 ProductCatalogClient\
  \ 注册为类型化 http 客户端，我们通过在 Startup 中的 ConfigureServices 方法中添加以下内容来实现：\n\n```\nservices.AddHttpClient<IProductCatalogClient,\
  \ ProductCatalogClient>();\n```\n\n现在 ASP.NET 可以解析 ProductCatalogClient，后者可以反过来注入到其他类型中，例如\
  \ ShoppingCartController。\n\n## 2.2.4 解析产品响应\n\n产品目录微服务以 JSON 数组形式返回产品信息。该数组包含每个请求产品的条目，如下所示。\n\
  \n### 代码清单 2.10 返回产品 JSON 列表\n\n```\nHTTP/1.1 200 OK\nContent-Type: application/json;\
  \ charset=utf-8\n```\n\n\n\n\n\n```\n[\n    {\n        \"productId\": \"1\",\n \
  \       \"productName\": \"Basic t-shirt\",\n        \"productDescription\": \"\
  a quiet t-shirt\",\n        \"price\": { \"amount\": 40, \"currency\": \"eur\" },\n\
  \        \"attributes\": [\n            {\n                \"sizes\": [\"s\", \"\
  m\", \"l\"],\n                \"colors\": [\"red\", \"blue\", \"green\"]\n     \
  \       }\n        ]\n    },\n    {\n        \"productId\": \"2\",\n        \"productName\"\
  : \"Fancy shirt\",\n        \"productDescription\": \"a loud t-shirt\",\n      \
  \  \"price\": { \"amount\": 50, \"currency\": \"eur\" },\n        \"attributes\"\
  : [\n            {\n                \"sizes\": [\"s\", \"m\", \"l\", \"xl\"],\n\
  \                \"colors\": [\"ALL\", \"Batique\"]\n            }\n        ]\n\
  \    }\n]\n```\n\nThis JSON must be deserialized, and the information required to\
  \ create a list of ShoppingCart items needs to be read from it. The array returned\
  \ from product catalog is formatted by the microservice’s API. To avoid tight coupling\
  \ between microservices, only the ProductCatalogClient class knows anything about\
  \ the API of the product catalog microservice. That means the ProductCatalogClient\
  \ is responsible for translating the data received from the microservice into types\
  \ for the ShoppingCart project. In this case, you need a list of ShoppingCartItem\
  \ objects. The following listing shows the code for deserializing and translating\
  \ the response data.\n\n### Listing 2.11 Extracting data from the response\n\n```csharp\n\
  private static async Task<IEnumerable<ShoppingCartItem>>\n    ConvertToShoppingCartItems(HttpResponseMessage\
  \ response)\n{\n    response.EnsureSuccessStatusCode();\n    var products = await\n\
  \        JsonSerializer.DeserializeAsync<List<ProductCatalogProduct>>(\n       \
  \     await response.Content.ReadAsStreamAsync(),\n            new JsonSerializerOptions\n\
  \            {\n                PropertyNameCaseInsensitive = true\n           \
  \ }) ?? new();\n    return products\n        .Select(p =>\n            new ShoppingCartItem(\n\
  \                p.ProductId,\n                p.ProductName,\n                p.ProductDescription,\n\
  \                p.Price));\n}\n\nprivate record ProductCatalogProduct(\n    int\
  \ ProductId,\n    string ProductName,\n    string ProductDescription,\n    Money\
  \ Price);\n```\n\n- Uses System.Text.Json to deserialize the JSON from the product\
  \ catalog microservice.\n- Creates a ShoppingCartItem for each product in the response.\n\
  - Uses a private record to represent the product data.\n\nIf you compare listings\
  \ 2.10 and 2.11, you may notice that there are more properties in the response than\
  \ in the ProductCatalogProduct class. This is because the Shopping Cart microservice\
  \ doesn’t need all the information, so there’s no reason to read the remaining properties.\
  \ Doing so would only introduce unnecessary coupling. I’ll return to this topic\
  \ in chapters 5, 6, and 8.\n\nThe following listing combines the code that requests\
  \ the product information and the code that parses the response. This method makes\
  \ the HTTP GET request and translates the response to the domain of the shopping\
  \ cart.\n\n### Listing 2.12 Fetching products and converting them to shopping cart\
  \ items\n\n```csharp\npublic async Task<IEnumerable<ShoppingCartItem>>\n    GetShoppingCartItems(int[]\
  \ productCatalogIds)\n{\n    using var response =\n        await RequestProductFromProductCatalogue(productCatalogIds);\n\
  \    return await ConvertToShoppingCartItems(response);\n}\n```\n\nThe ProductCatalogClient\
  \ is almost finished. The only part missing is the code that handles an HTTP request\
  \ failure.\n\n## 2.2.5 Adding a failure-handling policy\n\nRemote calls can fail.\
  \ Not only can they fail, but when running a distributed system at scale, remote\
  \ calls often do fail. You may not expect the call from shopping cart to product\
  \ catalog to fail often, but in an entire system of microservices there will often\
  \ be a failing remote call somewhere in the system.\n\nRemote calls fail for many\
  \ reasons: the network can fail, the call could be malformed, the remote microservice\
  \ might have a bug, the server where the call is handled may fail during processing,\
  \ or the remote microservice might be in the middle of a redeploy. In a system of\
  \ microservices, you must expect failures and design a level of resilience around\
  \ every place remote calls are made. This is an important topic, and I’ll go into\
  \ more detail in chapter 7.\n\nThe level of resilience needed around a particular\
  \ remote call depends on the business requirements for the microservice making the\
  \ call. The call to the product catalog microservice from the shopping cart microservice\
  \ is important; without the product information, the user can’t add items to their\
  \ shopping cart, which means the e-commerce site can’t sell the items to the user.\
  \ On the other hand, product information doesn’t change often, so you could store\
  \ a copy of it in the shopping cart and only request it from the product catalog\
  \ when the copy doesn’t already contain the information. One way to populate such\
  \ a copy is by caching responses from the product catalog. Caching product information\
  \ has some significant advantages:\n\n- It makes the shopping cart more resilient\
  \ to failures in product catalog.\n- The shopping cart microservice will perform\
  \ better when the product information is present in the cache.\n- Fewer calls made\
  \ from the shopping cart microservice mean less stress is put on the product catalog\
  \ microservice.\n\nFor now, you won’t implement caching; we’ll return to the subject\
  \ of caching for the sake of robustness in chapter 7.\n\nEven with caching in place,\
  \ some calls from the shopping cart to the product catalog are still made. For these\
  \ calls, you may decide that the best strategy for handling failed calls is to retry\
  \ the call a couple of times and then give up and fail to add any items to the shopping\
  \ cart. For this chapter, you’ll implement a simple retry policy for handling failing\
  \ requests. You’ll use the Polly library and the Microsoft.Extensions.Http.Polly\
  \ extension to Polly, both of which you’ll install in the ShoppingCart project as\
  \ a NuGet package.\n\n> **NOTE** Failure-handling strategies and Polly are described\
  \ in much more detail in chapter 7.\n\nUsing a Polly policy involves these two steps:\n\
  \n1. Declaring the policy.\n2. Using the policy to execute the remote call.\n\n\
  As you can see in the following listing, Polly’s API and integration with ASP.NET\
  \ makes both these steps easy. Replace the current registration of ProductCatalogClient\
  \ in Startup with this:\n\n### Listing 2.13 Microservice error-handling policy\n\
  \n```csharp\nservices.AddHttpClient<IProductCatalogClient, ProductCatalogClient>()\n\
  \    .AddTransientHttpErrorPolicy(p =>\n        p.WaitAndRetryAsync(\n         \
  \   3,\n            attempt => TimeSpan.FromMilliseconds(100*Math.Pow(2, attempt))));\n\
  ```\n\n- Wraps http calls made in ProductCatalogClient in a Polly policy.\n- Uses\
  \ Polly’s fluent API to set up a retry policy with an exponential back-off.\n\n\
  The HttpClient injected in ProductCatalogClient will use this policy around the\
  \ call to the product catalog microservice: in case of failure, retry the call at\
  \ most three times. And for each failure, double the amount of waiting time before\
  \ making the next attempt.\n\nThis completes the implementation of `ProductCatalogClient`.\
  \ Even though it has fewer than *70* lines of code, it does a lot: it builds up\
  \ the HTTP GET request and executes it. It parses the response from product catalog\
  \ and translates it into the shopping cart domain. And it uses the retry policy\
  \ used for these calls. Next, let's tackle the event feed.\n\n## 2.2.6 Implementing\
  \ a basic event feed\n\nThe shopping cart microservice can now store shopping carts\
  \ and add items to them. The items include product information from the product\
  \ catalog microservice. The shopping cart also has an API for other microservices\
  \ that allows them to add or delete items from shopping carts and read the contents\
  \ of a shopping cart.\n\nThe piece missing is the event feed. The shopping cart\
  \ needs to publish events about changes to shopping carts, and other microservices\
  \ can subscribe to these events and react to them as required. In the case of items\
  \ being added to a shopping cart, figure 2.9 (repeated from Chapter 1) illustrates\
  \ how the recommendations microservice and the shopper tracking microservice base\
  \ part of their functionality on events from the shopping cart microservice.\n\n\
  ![](img/608267d7803dc57a1a896ad121f37868_69_0.png)\n\nFigure 2.9 The shopping cart\
  \ microservice publishes events about changes to shopping carts to an event feed.\
  \ The recommendations and shopper tracking microservices subscribe to these events\
  \ and react as events arrive.\n\nIn this section, you'll implement the `EventFeed`\
  \ and shopping cart domain model components highlighted in figure 2.10. (Chapter\
  \ 5 returns to the implementation of event feeds and event subscribers.) The domain\
  \ model is responsible for raising events, and `EventFeed` allows other microservices\
  \ to read the events that the shopping cart microservice has published.\n\n\n\n\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_70_0.png)\n\n*图 2.10 购物车微服务事件 feed 将事件发布到电商系统的其他部分。*\n\
  \n实现事件 feed 涉及以下步骤：\n\n- *触发事件。* 购物车领域模型中的代码会在发生重要事件（根据业务规则）时触发事件。重要事件是指向购物车中添加或移除商品。\n\
  - *存储事件。* 购物车领域模型触发的事件会存储在微服务的数据存储中。\n- *发布事件。* 实现事件 feed 允许其他微服务通过轮询订阅。\n\n我们将依次处理这些步骤。\n\
  \n### 触发事件\n\n要被发布，事件必须先被触发。通常是微服务中的领域代码触发事件，在购物车微服务中也是如此。当向购物车添加商品时，ShoppingCart\
  \ 领域对象通过在 IEventStore 上调用 Raise 方法并提供事件数据来触发事件。\n\n记住我喜欢将相关内容放在文件夹中，所以我添加了一个名为 EventFeed\
  \ 的新文件夹，并在其中添加了两个文件：Event.cs 和 EventStore.cs。第一个文件包含事件的模型类型，如以下列表所示。\n\n**列表 2.14\
  \ 简单事件类型**\n\n```\nnamespace ShoppingCart.EventFeed\n{\n    using System;\n\n  \
  \  public record Event(\n        long SequenceNumber,\n        DateTimeOffset OccurredAt,\n\
  \        string Name,\n        object Content);\n}\n```\n\n```\nseqNumber,\nDateTimeOffset.UtcNow,\n\
  eventName,\ncontent));\n}\n```\n\nEventStore 存储所有传入的事件并跟踪它们的到达顺序。我们将在第 6 章重新讨论事件存储的主题，在那里我们将更深入地研究其实现。\n\
  \n### 一个简单的事件 feed\n\n一旦事件被存储，它们就准备好被发布——从某种意义上说，它们*已经*被发布了。即使一个微服务*订阅*另一个微服务的事件，事件\
  \ feed 也是通过让订阅者定期请求新事件（例如每 30 秒一次）来工作的。由于订阅者负责请求新事件，你在购物车微服务中需要做的只是添加一个 HTTP 端点，允许订阅者请求事件。订阅者例如可以发出以下请求来获取编号\
  \ 100 之后的所有事件：\n\n```\nGET /events?start=100 HTTP/1.1\nHost: shoppingcart.my.company.com\n\
  Accept: application/json\n```\n\n或者，如果订阅者想要限制每次调用的传入事件数量，它可以在请求中添加 end 参数：\n\n```\n\
  GET /events?start=100&end=200 HTTP/1.1\nHost: shoppingcart.my.company.com\nAccept:\
  \ application/json\n```\n\n将此 /events 端点的实现，如以下列表所示，放在 EventFeed 文件夹中的一个新控制器中。该端点接受可选的起始点和可选的结束点，允许其他微服务请求事件范围。\n\
  \n**列表 2.17 向其他微服务公开事件**\n\n```\nnamespace ShoppingCart.EventFeed\n{\n    using\
  \ System.Linq;\n    using Microsoft.AspNetCore.Mvc;\n\n    [Route(\"/events\")]\n\
  \    public class EventFeedController : Controller\n    {\n        private readonly\
  \ IEventStore eventStore;\n\n        public EventFeedController(IEventStore eventStore)\
  \ =>\n            this.eventStore = eventStore;\n\n        [HttpGet(\"\")]\n   \
  \     public Event[] Get(\n            [FromQuery] long start,\n            [FromQuery]\
  \ long end = long.MaxValue)\n        =>\n            this.eventStore\n         \
  \       .GetEvents(start, end)\n                .ToArray();\n    }\n}\n```\n\n从查询字符串参数读取\
  \ start 和 end 值\n\n返回原始事件列表。MVC 会负责将事件序列化为响应体。\n\nEventFeedController 大多使用你已经遇到过的\
  \ MVC 功能。唯一的新内容是 start 和 end 值是从查询字符串参数中读取的。方法参数前面的 FromQuery 参数告诉 MVC 这些是查询字符串参数。\n\
  \nEventFeedController 使用事件存储根据客户端的 start 和 end 值过滤事件。虽然过滤最好在数据库级别完成，但以下简单实现很好地说明了这一点。\n\
  \n**列表 2.18 根据起始点和结束点过滤事件**\n\n```\npublic IEnumerable<Event> GetEvents(\n    long\
  \ firstEventSequenceNumber,\n    long lastEventSequenceNumber) =>\n        database\n\
  \            .Where(e =>\n                e.SequenceNumber >= firstEventSequenceNumber\
  \ &&\n                e.SequenceNumber <= lastEventSequenceNumber)\n           \
  \ .OrderBy(e => e.SequenceNumber);\n```\n\n有了 /events 端点，想要订阅购物车微服务事件的微服务可以通过轮询端点来实现。订阅者可以——也应该——使用\
  \ start 和 end 查询字符串参数，确保只获取新事件。如果在订阅者轮询时购物车宕机，订阅者稍后可以再次请求相同的事件。同样，如果订阅者宕机了一段时间，它可以通过从上次看到的事件开始请求事件来追赶购物车的事件。如前所述，这不是一个完整的事件\
  \ feed 实现，但它使微服务能够订阅事件，并且代码很简单。\n\n你现在已经完成了第一个微服务的版本 1 实现。如你所见，微服务很小且专注度窄：它只提供一种业务能力。你也可以看到微服务代码往往简单易懂。这就是为什么你可以期望快速创建新的微服务并替换现有微服务。\n\
  \n### 2.3 运行代码\n\n现在购物车微服务的所有代码都已就位，你可以像在第 1 章运行示例那样运行它：从 Visual Studio 内部，或从命令行使用\
  \ dotnet。你可以用 RestClient 或类似工具测试所有端点。\n\n当你第一次尝试通过 HTTP GET 到 /shoppingcart/123\
  \ 获取购物车时，购物车将是空的。尝试通过 HTTP POST 到 /shoppingcart/123/items 添加一些商品，然后再次获取它；响应应包含已添加的商品。你也可以查看\
  \ /events 处的事件 feed，你应该能看到每个添加商品的事件。\n\n**警告** 我没有展示 EventStore 或 ShoppingCartStore\
  \ 的实现。如果你没有创建这些的实现，你的微服务将无法工作。\n\n### 总结\n\n- 实现一个完整的微服务不需要太多代码。购物车微服务只有以下内容：\n\
  \  - 两个简短的控制器\n  - 一个简单的 ShoppingCart 领域类\n  - 一个用于调用产品目录微服务的客户端类\n  - 两个简单的数据访问类：ShoppingCartDataStore\
  \ 和 EventStore（本章未展示）\n- MVC 使实现 HTTP API 变得简单。MVC 提供的路由属性使向微服务添加端点变得容易。只需添加一个 action\
  \ 方法并在其上放置一个像 [HttpGet(\"\")] 或 [HttpPost(\"\")] 这样的路由属性即可。\n- 你应该始终期望其他微服务可能宕机。为了防止错误传播，每个远程调用都应包装在处理失败的策略中。\n\
  - Polly 库对于实现失败处理策略并将其包装在远程调用周围非常有用。\n- 实现一个基本的事件 feed 很简单，并且使其他微服务能够对事件做出反应。本章实现的简陋事件\
  \ feed 只是一个简短的控制器。\n- 领域模型代码通常负责触发事件，这些事件随后存储在事件存储中并通过事件 feed 发布。\n"
- "## 将微服务部署到 Kubernetes\n\n### 本章涵盖\n\n- 将微服务打包到 Docker 容器中\n- 将微服务容器部署到本地主机上的 Kubernetes\n\
  - 在 Azure 的 AKS（Azure Kubernetes Service）上创建基本的 Kubernetes 集群\n- 将微服务容器部署到 AKS 上的\
  \ Kubernetes 集群\n\n在第 2 章中，我们开发了一个简单的购物车微服务，但我们只在本地主机上直接使用 dotnet run 命令运行它。在本章中，我们将该微服务部署到公共云中的类似生产环境。我们的微服务可以在许多不同的环境中运行，但我们将只选择其中一个作为示例。我们将重点介绍如何将购物车微服务运行在\
  \ Microsoft Azure 的 Kubernetes 集群中。为了实现这一目标，本章我们将：\n\n- 将购物车放入 Docker 容器中\n- 在本地主机上设置\
  \ Kubernetes，以便我们拥有一个测试环境\n\n\n\n\n\n- 在 Azure 中设置 Kubernetes，以便我们拥有一个类似生产的环境\n\
  - 在本地主机 Kubernetes 集群和 Azure Kubernetes 集群中运行相同的购物车容器\n\n## Docker 容器\n\n容器是将应用程序——在我们的例子中是微服务——包装在便携式镜像中的一种方式，该镜像自带运行所需的一切，从操作系统到应用程序代码再到库依赖项。容器镜像可以一次构建，移动到不同的环境中，并且仍然可以预期正常工作——只要容器中的应用程序代码不对环境做出假设。在这种意义上，容器类似于虚拟机。但虚拟机虚拟化硬件，而容器虚拟化操作系统，这使得容器可以小得多。在微服务上下文中，这一点很重要，因为我们将拥有很多、很多个微服务。有了容器，我们就能在同一台服务器上运行许多微服务，同时保持它们之间良好的隔离级别。\n\
  \n我们很快就会进入这些步骤的实现，但首先我们将讨论为什么这是可靠的方法，并介绍一些替代方案。\n\n## 3.1 选择生产环境\n\n仅仅在本地主机上运行我们的微服务并不是很有趣。我们需要它们运行在最终用户可以访问并使用它们的地方。有几种选择可以做到这一点：\n\
  \n- 在本地的 Windows 或 Linux 服务器上运行微服务。 我们编写的微服务是 .NET 应用程序，这意味着它们可以在 Windows 和 Linux\
  \ 上轻松运行。我们创建的 HTTP API 是 ASP.NET 应用，并使用 ASP.NET 的 Web 服务器 Kestrel，可以将其置于 Nginx 或\
  \ IIS 等代理之后。因此，如果你或你的组织更喜欢本地解决方案，我们创建的微服务可以在相当传统的本地环境中托管。\n- 使用支持 .NET 的平台即服务 PaaS\
  \ 云选项，如 Azure Web Apps 或 Azure Service Fabric。使用 PaaS 选项意味着你不再自行维护底层基础设施。你只需要维护你的微服务。这并不意味着你没有运维工作，但你需要做的运维工作集中在你的微服务上，而不是底层基础设施上（例如，你不需要保持操作系统打补丁或担心硬盘老化时更换）。你只需要处理微服务代码中的内容。\n\
  - 将微服务放入容器并部署到云特定的容器服务，如 Azure 的 ACS 或 Amazon 的 ECS。正如本章将看到的那样，我们的微服务可以轻松放入容器中。ACS\
  \ 和 ECS 都可以运行这些容器并提供管理容器的工具。与 PaaS 选项一样，这使你摆脱了维护底层基础设施的负担，但由于容器自带操作系统，你将不得不保持其更新和修补。\n\
  - 使用云无关的容器编排器，如 Kubernetes、Apache Mesos 或 RedHat OpenShift。同样，将我们的微服务容器化很容易，一旦它们进入容器，任何容器编排器都可以运行它们。该领域存在很大的差异，将\
  \ Kubernetes、Mesos 和 OpenShift 归为一类可能并不完全公平，但它们都可以运行和管理我们的微服务，并且不绑定于任何特定云提供商。\n\n\
  在整本书中，我们注意保持这些选项开放。另一方面，我也想向你展示如何将微服务运行在类似生产的环境中。这意味着从列出的选项中选择一个作为本章和本书其余部分中生产环境的示例。这并不意味着其他选项不可行；它们是可行的。\n\
  \n为本书的目的，我选择使用容器并在 Kubernetes 中运行它们（图 3.1），因为它为我们提供了许多好处，这些好处与我们针对微服务所追求的灵活性和可扩展性非常契合：\n\
  \n- 通过选择将我们的微服务放入容器，我们保持了上述多个选项开放，这给了我们灵活性。\n- 通过选择 Kubernetes，我们获得了一个成熟且广泛使用的容器编排器，它由所有主要云支持，并且也可以在自己的服务器上运行。Kubernetes\
  \ 拥有成熟且庞大的生态系统，具有高度可扩展性，专为由许多小型容器组成的系统而构建，这些容器经常更新和重新部署，就像我们所讨论的微服务系统一样。\n\n![](img/608267d7803dc57a1a896ad121f37868_77_0.png)\n\
  \n图 3.1 我们将在 AKS 中创建一个单节点 Kubernetes 集群，并在其上部署负载均衡器和一个购物车容器。\n\n**NOTE** 确保你已在开发环境上设置了\
  \ Docker。在附录 A 中，你可以找到安装 Docker 的说明。\n\n我们要构建的设置如图 3.1 所示。我们在 AKS 中创建一个单节点 Kubernetes\
  \ 集群。在该集群中，我们将部署一个负载均衡器和一个购物车容器的实例。负载均衡器将具有公共端点，可从外部接收流量并将该流量路由到购物车容器。\n\n现在我们已经确定使用\
  \ Kubernetes，让我们先在本地主机上，然后在 Azure 上将购物车运行在 Kubernetes 中。\n\n## 3.2 将购物车微服务放入容器\n\
  \n将购物车微服务运行在 Kubernetes 中的第一步是将其放入容器并运行该容器。我们继续使用在第 2 章中开发的购物车微服务。\n\n### 3.2.1\
  \ 为购物车微服务添加 Dockerfile\n\n要将购物车微服务放入容器，我们首先需要在购物车项目的根文件夹中，解决方案文件旁边添加一个 Dockerfile。Dockerfile\
  \ 是我们想要构建的容器的描述，应该如下所示的代码。\n\n**Listing 3.1 购物车的 Dockerfile**\n\n```\nFROM mcr.microsoft.com/dotnet/core/sdk:3.1\
  \ AS build\nWORKDIR /src\nCOPY [\"ShoppingCart/ShoppingCart.csproj\", \"ShoppingCart/\"\
  ]\nRUN dotnet restore \"ShoppingCart/ShoppingCart.csproj\"\nCOPY . .\nWORKDIR \"\
  /src/ShoppingCart\"\nRUN dotnet build \"ShoppingCart.csproj\" -c Release -o /app/build\n\
  FROM build AS publish\nRUN dotnet publish \"ShoppingCart.csproj\" -c Release -o\
  \ /app/publish\nFROM mcr.microsoft.com/dotnet/core/aspnet:3.1 AS final\nWORKDIR\
  \ /app\nEXPOSE 80\nCOPY --from=publish /app/publish .\nENTRYPOINT [\"dotnet\", \"\
  ShoppingCart.dll\"]\n```\n\nDockerfile 中有很多内容，让我们逐段拆解。需要理解的第一件事是 Dockerfile 描述了一个多阶段构建，这意味着文件中存在多个离散步骤。最终结果是一个可运行的容器镜像，其中包含编译后的购物车微服务。Dockerfile\
  \ 中的步骤如下：\n\n- 构建购物车代码——Dockerfile 的第一部分使用包含 .NET SDK 的 Docker 镜像构建购物车代码，并首先调用 `dotnet\
  \ restore` 然后调用 `dotnet build`。这与我们在第 2 章中本地构建购物车时所做的类似，只是我们使用了几个额外选项来指示我们想要一个发布构建并指定输出文件夹。\n\
  - 发布购物车微服务——Dockerfile 的第二部分使用 `dotnet publish` 命令将运行时所需的文件从构建输出文件夹（/app/build）复制到名为\
  \ /app/publish 的新文件夹。\n- 基于 ASP.NET 创建容器镜像——Dockerfile 中第三步也是最后一步创建最终容器镜像，这是 Dockerfile\
  \ 中描述的多阶段构建的结果。该步骤基于来自 Microsoft 的 ASP.NET Docker 镜像。该镜像自带 ASP.NET 运行时。我们添加来自 /app/publish\
  \ 文件夹的文件并指定容器镜像的入口点为 `dotnet ShoppingCart.dll`，这是一个运行 ShoppingCart.dll 中编译的 ASP.NET\
  \ 应用程序的命令。\n\n为了确保 Dockerfile 运行干净的构建，我们添加一个 .dockerignore，其中包含以下行，确保任何 bin 和 obj\
  \ 文件夹都不会被复制到容器中：\n\n```\nbin/\nobj/\n```\n\n有了这个 Dockerfile，我们就可以构建购物车容器镜像并运行它了。\n\
  \n### 3.2.2 构建和运行购物车容器\n\n下一步是从我们刚刚添加的 Dockerfile 构建购物车容器镜像。首先，确保 Docker 正在运行，然后打开命令行并进入购物车的根目录——Dockerfile\
  \ 所在的位置。然后发出此 Docker 命令：\n\n```\n> docker build . -t shopping-cart\n```\n\n第一次执行可能需要一段时间。请耐心等待。后续构建会更快。`docker\
  \ build` 的输出相当长。当成功时，输出的最后几行类似于\n\n```\nSuccessfully built 8d448ba53088\nSuccessfully\
  \ tagged shopping-cart:latest\n```\n\n如果你在 Windows 上，可能还会看到以下警告：\n\n```\nSECURITY\
  \ WARNING: You are building a Docker image from Windows against a non-Windows Docker\
  \ host. All files and directories added to build context will have '-rwxr-xr-x'\
  \ permissions. It is recommended to double-check and reset permissions for sensitive\
  \ files and directories.\n```\n\n\n\n\n这个警告出现是因为你正在 Windows 上使用 Linux 容器，在开发环境中这是可以的。我们将在\
  \ Azure 上搭建的生产环境将基于 Linux 服务器，因此可以安全地忽略该警告。\n\n现在你可以使用以下命令运行新构建的容器镜像：\n\n```\n>\
  \ docker run --name shopping-cart --rm -p 5000:80 shopping-cart\n```\n\n这会启动购物车容器，并将容器内部的\
  \ 80 端口映射到容器外部的 5000 端口，如图 3.2 所示。这意味着你可以通过 http://localhost:5000 访问购物车，并以我们在第 2\
  \ 章中相同的方式使用端点。\n\n上面命令的细节如下：\n\n- `--name` 为容器命名；在此例中为 shopping-cart。\n- `--rm`\
  \ 表示容器退出时自动删除。在开发期间这样做很方便，可以避免在本地主机上积累太多旧容器。\n- `-p 5000:80` 表示容器公开 5000 端口并监听该端口的流量。所有发往\
  \ 5000 端口的入站流量都会转发到容器内部的 80 端口。\n- 命令末尾的 `shopping-cart` 是要运行的容器镜像的名称。\n\n要停止购物车容器，可以使用\
  \ docker stop 命令：\n\n```\n> docker stop shopping-cart\n```\n\n![](img/608267d7803dc57a1a896ad121f37868_80_0.png)\n\
  \n图 3.2 购物车在容器内部监听 80 端口。容器监听 5000 端口的流量并将该流量转发到购物车微服务。\n\n这证实我们已成功构建了包含购物车的容器。我们所做的只是创建一个描述如何构建容器的\
  \ Dockerfile，然后使用 Docker 构建它。从中我们得到一个可移植的容器镜像。这非常不错，因为它使我们能够在想要的所有环境中运行相同的容器镜像，包括本地主机和生产环境。由于我们可以在不同环境中运行相同的镜像，因此我们可以合理地确信它在各环境中的表现相同。\n\
  \n查看 Dockerfile，我们注意到其中没有任何内容使其特定于购物车，除了 .csproj 文件和 .dll 文件的名称。因此，我们不仅构建了一个可在多种环境中运行的购物车容器，还学会了如何对我们将要构建的所有其他基于\
  \ .NET 的微服务执行相同的操作。\n\n下一步我们需要做的是在 Kubernetes 中运行购物车容器。\n\n## 3.3 在 Kubernetes 中运行购物车容器\n\
  \n现在购物车已在容器中，它已准备好在 Kubernetes 中运行。我们将创建一个 Kubernetes 清单文件并使用它在 Kubernetes 上运行购物车——首先在本地主机上，然后在\
  \ Azure 上。在 Kubernetes 中运行购物车容器如图 3.3 所示，这几乎与本章开头的图表完全相同，只是 Kubernetes 运行在本地主机上而不是\
  \ Azure 上。这并非偶然，因为我们将以与在 Azure 上相同的方式在本地主机上运行购物车。\n\n![](img/608267d7803dc57a1a896ad121f37868_81_0.png)\n\
  \n图 3.3\n在本地主机上 Kubernetes 上运行购物车几乎与在 Azure 上相同。\n\n### 3.3.1 设置 Kubernetes 本地主机\n\
  \n如何在开发机器上设置 Kubernetes 取决于你使用的操作系统。如果你使用 Windows 或 Mac，我建议使用 Docker Desktop，它附带启用\
  \ Kubernetes 的选项。如果你使用 Linux，有许多选项；一个简单的选项是 MicroK8S。\n\n### 在 Docker Desktop 中启用\
  \ Kubernetes\n\n要在 Docker Desktop 中启用 Kubernetes，请确保你使用的是 Linux 容器，而不是 Windows 容器。打开\
  \ Docker Desktop 设置，选择 Kubernetes 并点击“Enable Kubernetes”，如下图所示。第一次这样做需要花费一些时间，因为\
  \ Docker Desktop 将下载、安装并启动 Kubernetes。\n\n![](img/608267d7803dc57a1a896ad121f37868_82_0.png)\n\
  \nDocker Desktop Kubernetes 设置\n\n一旦 UI 指示 Kubernetes 正在运行，你就可以开始在本地主机上使用 Kubernetes\
  \ 了。\n\n### 安装并启动 MicroK8S\n\n要在 Linux 机器上安装 MicroK8S，只需运行以下命令：\n\n```\n> sudo snap\
  \ install microk8s --classic\n```\n\n这将安装并启动 Kubernetes 集群。此外，这还安装了 microk8s 命令行界面，其中包括我们将要使用的\
  \ kubectl 命令。为了更方便地跟随以下各节的工作，你可以为 kubectl 创建一个别名：\n\n```\n> snap alias microk8s.kubectl\
  \ kubectl\n```\n\n当 Kubernetes 运行时，你可以转到命令行并使用以下命令检查 Kubernetes 是否确实正在运行\n\n```\n\
  > kubectl cluster-info\n```\n\n它应该会给出类似以下的响应：\n\n```\nKubernetes master is running\
  \ at https://kubernetes.docker.internal:6443\nKubeDNS is running at https://kubernetes.docker.internal:6443/api/v1/\n\
  \  namespaces/kube-system/services/kube-dns:dns/proxy\n\nTo further debug and diagnose\
  \ cluster problems, use `kubectl cluster-info dump`.\n```\n\nkubectl 命令是控制 Kubernetes\
  \ 的命令行界面，我们将使用它将购物车部署到 Kubernetes，无论是在本地主机还是在 Azure 上。此外，kubectl 可用于检查 Kubernetes\
  \ 集群并启动 Kubernetes 仪表板，它提供了一个友好的 UI 来查看 Kubernetes 集群内部。\n\n## 3.4 为购物车创建 Kubernetes\
  \ 部署\n\n接下来，我们希望将购物车部署到我们刚刚安装并启动的 Kubernetes 集群。为此，我们需要在购物车代码库中添加一个描述部署的清单文件 shopping-cart.yaml。该文件包含两个主要部分：\n\
  \n- 1. 一个部署部分，指定我们想要部署哪个容器以及如何设置它：\n  - 我们想要部署购物车容器。\n  - 我们希望运行一个容器的副本。我们可以设置不同的数量，Kubernetes\
  \ 将负责运行我们想要的实例数。\n  - 容器通信的端口，购物车的情况下为端口 80，就像我们之前看到的那样。\n- 2. 一个服务部分，配置购物车前面的负载均衡。负载均衡器通过为其提供外部\
  \ IP 使购物车在 Kubernetes 集群外部可访问。如果我们部署了多个购物车容器实例，负载均衡器将平衡购物车实例之间的入站流量。\n\nshopping-cart.yaml\
  \ 文件的内容如下：\n\n```\nkind: Deployment\napiVersion: apps/v1\nmetadata:\n  name: shopping-cart\n\
  spec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: shopping-cart\n\
  \  template:\n    metadata:\n      labels:\n        app: shopping-cart\n    spec:\n\
  ```\n\n指定容器部署的开始部分\n\n```\ncontainers:\n  - name: shopping-cart\n    image: shopping-cart\n\
  \    imagePullPolicy: IfNotPresent\n    ports:\n      - containerPort: 80\n---\n\
  kind: Service\napiVersion: v1\nmetadata:\n  name: shopping-cart\nspec:\n  type:\
  \ LoadBalancer\n  ports:\n    - name: shopping-cart\n      port: 5000\n      targetPort:\
  \ 80\n  selector:\n    app: shopping-cart\n```\n\n要部署的容器镜像\n\n容器监听请求的端口\n\n指定服务的开始部分\n\
  \n指定这是一个负载均衡服务\n\n在外部监听 5000 端口\n\n映射到容器上的 80 端口\n\n将请求路由到购物车\n\n使用此清单在 Kubernetes\
  \ 中部署和运行购物车与从命令行运行以下命令一样简单：\n\n```\n> kubectl apply -f shopping-cart.yaml\n```\n\
  \n此命令告诉 Kubernetes 运行清单中描述的所有内容，因此 Kubernetes 将启动负载均衡器和购物车。要检查两者是否都在运行，我们可以使用命令\
  \ kubectl get all，它将列出 Kubernetes 集群中运行的所有内容。如果部署成功，kubectl get all 的输出应类似于以下内容：\n\
  \n```\nNAME                         READY   STATUS    RESTARTS   AGE\npod/shopping-cart-f4c8f4b94-4j48v\
  \   1/1     Running   0          15h\n\nNAME                     TYPE          \
  \ CLUSTER-IP     EXTERNAL-IP   PORT(S)          AGE\nservice/kubernetes       ClusterIP\
  \      10.96.0.1      <none>        443/TCP           36d\nservice/shopping-cart\
  \    LoadBalancer   10.103.8.64    localhost     5000:31593/TCP    6d20h\n\nNAME\
  \                                 READY   UP-TO-DATE   AVAILABLE   AGE\ndeployment.apps/shopping-cart\
  \        1/1     1            1           6d20h\n\nNAME                        \
  \                    DESIRED   CURRENT   READY   AGE\nreplicaset.apps/shopping-cart-f4c8f4b94\
  \         1         1         1       15h\n```\n\n如果你更喜欢使用 UI，可以安装并启动 Kubernetes\
  \ 仪表板。首先使用以下命令安装 Kubernetes 仪表板：\n\n```\n> kubectl apply -f https://raw.githubusercontent.com/kubernetes/dashboard/v2.2.0/aio/deploy/recommended.yaml\n\
  ```\n\n截至撰写本文时，Kubernetes 仪表板的版本为 2.2.0，这是此命令的一部分。请参阅 GitHub 上的 Kubernetes 仪表板项目文档\
  \ https://github.com/kubernetes/dashboard 以获取当前版本。\n\n\n\n\n\n运行命令 `kubectl proxy`\
  \ 将启动仪表板并使其在 somewhat 复杂的 URL 上可用，http://localhost:8001/api/v1/namespaces/kubernetes-dashboard/services/https:kubernetes-dashboard:/proxy/#/overview?namespace=default。\
  \ 该仪表板还应显示购物车正在运行，如图 3.4 所示。\n\n> **NOTE** 如果 Kubernetes 仪表板要求登录令牌，你可以通过运行命令 `kubectl\
  \ -n kube-system describe secret default` 获取，并从响应中复制令牌。\n\n![](img/608267d7803dc57a1a896ad121f37868_85_0.png)\n\
  \n图 3.4 Docker Desktop Kubernetes 设置\n\n我们相当确定 Kubernetes 正在按预期运行购物车，这一点从我们在仪表板和\
  \ `kubectl` 中看到的情况可以看出，但为了确保其按预期运行，让我们测试购物车的端点。首先，让我们向购物车添加几件商品：\n\n```http\nPOST\
  \ http://localhost:5000/shoppingcart/15/items\nAccept: application/json\nContent-Type:\
  \ application/json\n\n[1, 2]\n```\n\n接下来，让我们读取同一个购物车：\n\n```http\nGET http://localhost:5000/shoppingcart/15\n\
  ```\n\nGET 请求的响应体应为购物车中的商品列表：\n\n```json\n{\n  \"userId\": 15,\n  \"items\": [\n\
  \    {\n      \"productCatalogueId\": 1,\n      \"productName\": \"Basic t-shirt\"\
  ,\n      \"description\": \"a quiet t-shirt\",\n      \"price\": {\n        \"currency\"\
  : \"eur\",\n        \"amount\": 40\n      }\n    },\n    {\n      \"productCatalogueId\"\
  : 2,\n      \"productName\": \"Fancy shirt\",\n      \"description\": \"a loud t-shirt\"\
  ,\n      \"price\": {\n        \"currency\": \"eur\",\n        \"amount\": 50\n\
  \      }\n    }\n  ]\n}\n```\n\n这告诉我们购物车确实在 Kubernetes 上运行，正如我们所期望的那样，因为它与我们之前已经运行并测试过的容器镜像相同。\n\
  \n完成购物车后，我们可以通过使用以下命令从 Kubernetes 中删除购物车来进行清理：\n\n```bash\nkubectl delete -f shopping-cart.yaml\n\
  ```\n\n查看我们用来在 Kubernetes 上运行购物车的 Kubernetes 清单，我们可以注意到，除了名称 ShoppingCart 之外，该清单也适用于其他微服务。这意味着我们现在有了为微服务创建\
  \ Dockerfile 以及为其创建 Kubernetes 清单的模板。这使我们能够快速将所有微服务部署到 Kubernetes。\n\n我们仍然在 localhost\
  \ 上，所以让我们继续将购物车部署到 Azure 上。\n\n## 3.5 在 Azure Kubernetes Service 上运行购物车容器\n\n下一个目标是在\
  \ Azure Kubernetes Service (AKS) 上运行购物车。当我们完成此操作后，到本节结束时，我们将实现在生产环境中运行第一个微服务的目标，并创建图\
  \ 3.1 所示的设置。我们需要执行以下操作来实现这一目标：\n\n- 设置 AKS。我们需要为 AKS 中的 Kubernetes 集群创建所有 Azure\
  \ 资源。这包括集群本身、网络以及我们将存储微服务容器镜像的私有容器注册表。\n- 将购物车容器镜像推送到我们的私有容器注册表。\n- 使用购物车的 Kubernetes\
  \ 清单将购物车部署到 AKS 集群。\n\n### Azure Kubernetes Service 的替代方案\n\nAzure 绝不是我们唯一可以运行 Kubernetes\
  \ 的地方。其他主要公共云——Google Cloud、Amazon Web Services、Digital Ocean 等——都提供类似的托管 Kubernetes\
  \ 服务。所有这些都易于设置，并且都提供用于扩展和监控集群的工具。我使用 Azure 的原因是熟悉度；其他选项同样可行。\n\n如果你更喜欢管理自己的服务器，你也可以选择在自己的云或本地服务器上设置\
  \ Kubernetes。与托管 Kubernetes 服务相比，其差异在于 Kubernetes 集群的设置和管理。我们部署到 Kubernetes 的容器的管理在所有情况下都是相同的。\n\
  \n### 3.5.1 设置 AKS\n\n为了准备在 AKS 中使用 Kubernetes 集群，我们需要四个部分：\n\n1. 在 Azure 中创建 *资源组*。资源组只是\
  \ Azure 中事物的分组。我们将 Kubernetes 集群和容器注册表的资源全部放在一个资源组中。这将在 Azure 门户中将所有内容分组在一起，并在我们完成后轻松清理所有内容。\n\
  2. 创建私有容器注册表。\n3. 在 AKS 中创建 Kubernetes 集群。我们将创建一个只有一个节点的集群，并将其附加到私有容器注册表，以便 Kubernetes\
  \ 可以从我们的注册表中拉取容器。\n4. 将本地 Kubernetes 命令行—`kubectl`—登录到新创建的 AKS 集群。\n\n这四个部分中的每一个都由\
  \ Azure 命令行工具 `az` 的 Azure 命令执行。Azure 中的最终结果如图 3.5 所示：一个 Azure 资源组，其中包含私有 Azure\
  \ 容器注册表和单节点 Kubernetes 集群在 AKS 中。这是我们的生产环境。\n\n![](img/608267d7803dc57a1a896ad121f37868_87_0.png)\n\
  \n**图 3.5** 在 localhost 上在 Kubernetes 上运行购物车几乎与在 Azure 上相同。\n\n> **NOTE** 要跟随 AKS\
  \ 的设置，你需要安装 Azure CLI 并登录到你的 Azure 账户。在附录 A 中你将找到安装 Azure CLI 的说明。\n\n为了使 AKS 设置易于重复，我将设置\
  \ AKS 所需的命令收集到一个名为 `create-aks.ps1` 的 PowerShell 脚本中，其内容如下：\n\n```text\naz group\
  \ create --name MicroservicesInDotnet --location northeurope\n\naz acr create --resource-group\
  \ MicroservicesInDotnet --name YOUR_UNIQUE_REGISTRY_NAME --sku Basic\n\naz aks create\
  \ --resource-group MicroservicesInDotnet --name MicroservicesInDotnetAKSCluster\
  \ --node-count 1 --enable-addons monitoring --generate-ssh-keys --attach-acr YOUR_UNIQUE_REGISTRY_NAME\n\
  \naz aks get-credentials --resource-group MicroservicesInDotnet --name MicroservicesInDotnetAKSCluster\n\
  kubectl get nodes\n```\n\n前四行与列出的四个部分完全对应：创建资源组、创建容器注册表、创建 AKS 集群以及将 `kubectl` 登录到集群。最后一行显示集群中的节点，以便我们知道集群已启动并运行。\n\
  \n> **NOTE** `az acr create ...` 命令需要一个唯一的注册表名称。如果名称不唯一，你会收到名称已被使用的错误。你可以使用此处记录的\
  \ API 检查名称是否已被占用：http://mng.bz/PXZg。\n\n运行脚本需要一段时间——大约 5–10 分钟。它还会产生大量输出，尽管是突发式的，所以不要惊讶如果几分钟内没有反馈，然后出现输出突发。输出的最后几行是\
  \ `kubectl get nodes` 行的输出，应类似于：\n\n| NAME | STATUS | ROLES | AGE | VERSION |\n\
  | --- | --- | --- | --- | --- |\n| aks-nodepool1-32786309-vmss000000 | Ready | agent\
  \ | 107s | v1.14.8 |\n\n这是你的 `kubectl` 命令行所连接的 Kubernetes 集群中的节点列表。你的节点名称会与我的不同，但应以\
  \ `aks-` 开头。\n\n> **NOTE** 如果你想了解设置 AKS 所涉及步骤的更多背景和细节，请参考 Microsoft 的文档，例如文章“Quickstart:\
  \ Deploy an Azure Kubernetes Service Cluster Using the Azure CLI” at http://mng.bz/J6ZP。\n\
  \n当你完成 AKS 中的 Kubernetes 集群时，你也可以使用以下命令删除集群以及容器注册表：\n\n```bash\n> az group delete\
  \ --name MicroservicesInDotnet --yes --no-wait\n```\n\n此时，AKS 中的 Kubernetes 集群已启动并运行。在继续之前，我们还将启动\
  \ Kubernetes 仪表板。运行 Kubernetes 仪表板有两个步骤：首先我们必须允许仪表板访问集群，然后启动仪表板。\n\n此命令将通过告诉 Kubernetes\
  \ 将角色 `cluster-admin` 分配给账户 `kube-system:kubernetes-dashboard` 来授予仪表板访问权限：\n\n```bash\n\
  > kubectl create clusterrolebinding kubernetes-dashboard \\\n  --clusterrole=cluster-admin\
  \ \\\n  --serviceaccount=kube-system:kubernetes-dashboard\n```\n\nKubernetes 仪表板使用\
  \ `kube-system:kubernetes-dashboard` 账户，因此现在它将拥有集群管理员权限。\n\n访问就绪后，我们可以使用 Azure 命令行像这样启动\
  \ Kubernetes 仪表板：\n\n```bash\n> az aks browse --resource-group MicroservicesInDotnet\
  \ --name MicroservicesInDotnetAKSCluster\n```\n\n这将启动 Kubernetes 仪表板并打开一个浏览器标签页显示仪表板，如图\
  \ 3.6 所示。\n\n> **NOTE** 如果你在启动 Kubernetes 仪表板时遇到任何问题，请参考 Microsoft 的文档，其中有文章“Access\
  \ the Kubernetes Web Dashboard in Azure Kubernetes Service (AKS)” at http://mng.bz/wQxW，其中包含故障排除信息。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_89_0.png)\n\n图 3.6 Kubernetes 仪表板\n\n\
  \n\n\n\n现在我们已经在 Azure 上运行了一个 Kubernetes 集群，并且仪表板也在运行，因此我们拥有一个友好的界面来查看集群中正在运行的内容。我们还拥有购物车容器镜像和购物车的\
  \ Kubernetes 清单文件。在具备了所有这些条件后，我们已准备好将购物车部署到我们的 AKS 集群。不仅如此，由于我们构建购物车容器的方式很容易扩展到为其他微服务构建容器，并且\
  \ Kubernetes 清单也很容易扩展到其他微服务，因此我们已准备好将即将在下一章中构建的微服务部署到 AKS。\n\n> 注意 要在本地主机和 Azure\
  \ 上来回切换使用 Kubernetes，可以使用命令 `kubectl config use-context <name-of-context>` 更改 kubectl\
  \ 的上下文，并且可以通过运行 `kubectl config get-contexts` 查看可用的上下文。\n\n## 3.5.2 在 AKS 中运行购物车\n\
  \n在 AKS 中运行微服务的基础设施就绪后，我们回到购物车微服务。我们已经将购物车放入容器中，并且已通过将购物车的 Kubernetes 清单应用到本地主机\
  \ Kubernetes，在本地主机 Kubernetes 上运行了该容器。将购物车部署到 AKS 大多是重用我们已有的东西，但有一些调整。部署和在 AKS 中运行购物车的剩余步骤如下：\n\
  \n- 为购物车容器镜像打标签，以便我们对容器镜像有精确的标识。\n- 将带标签的容器镜像推送到我们在 Azure 中的容器注册表。\n- 修改购物车的 Kubernetes\
  \ 清单以引用带标签的容器。\n- 将修改后的清单应用到 AKS。\n- 测试购物车是否正确运行。\n\n如所列，我们需要为在 3.2.2 节中构建的购物车容器镜像打标签。我们将给容器打的标签是\
  \ `your_unique_registry_name.azurecr.io/shopping-cart:1.0.0`。标签的第一部分是我们 Azure 中容器注册表的地址，`your_unique_registry_name.azurecr.io`；第二部分是容器镜像的名称和版本。我们按如下方式设置标签：\n\
  \n```\n> docker tag shopping-cart your_unique_registry_name.azurecr.io/\n  shopping-cart:1.0.0\n\
  ```\n\n我们必须将容器镜像推送到容器注册表，以便 AKS 可以拉取并运行它。AKS 无法从我的或你的本地主机拉取容器镜像。我们在 Azure 中使用的注册表是私有的，因此任何从中拉取或向其推送的服务都必须经过身份验证。当我们创建\
  \ AKS 集群时，我们使用了选项 `--attach-acr MicroservicesInDotnetRegistry`，它将 AKS 集群与名为 YOUR_UNIQUE_REGISTRY_NAME\
  \ 的容器注册表连接起来，并允许 AKS 拉取镜像。同样，我们本地主机的 Docker 客户端在被允许向注册表推送容器镜像之前需要使用容器注册表进行身份验证。此身份验证使用\
  \ Azure CLI 如下进行：\n\n```\n> az acr login --name YOUR_UNIQUE_REGISTRY_NAME\n```\n\
  \n现在带标签的容器镜像可以用此 Docker 命令推送到我们 Azure 中的私有 Docker 注册表：\n\n```\n> docker push your_unique_registry_name.azurecr.io/shopping-cart:1.0.0\n\
  ```\n\n购物车容器镜像现在可供我们的 AKS 集群拉取，但我们必须告诉它这样做。为此，我们必须修改清单文件 `shopping-cart.yaml`，使其通过标签\
  \ `your_unique_registry_name.azurecr.io/shopping-cart:1.0.0` 引用容器，这意味着清单变为：\n\n\
  ```\nkind: Deployment\napiVersion: apps/v1\nmetadata:\n  name: shopping-cart\nspec:\n\
  \  replicas: 1\n  selector:\n    matchLabels:\n      app: shopping-cart\n  template:\n\
  \    metadata:\n      labels:\n        app: shopping-cart\n    spec:\n      containers:\n\
  \        - name: shopping-cart\n          image: your_unique_registry_name.azurecr.io/shopping-cart:1.0.0\n\
  \          imagePullPolicy: IfNotPresent\n          ports:\n            - containerPort:\
  \ 80\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: shopping-cart\nspec:\n\
  \  type: LoadBalancer\n  ports:\n    - name: shopping-cart\n      port: 5000\n \
  \     targetPort: 80\n  selector:\n    app: shopping-cart\n```\n\n![](img/608267d7803dc57a1a896ad121f37868_91_0.png)\n\
  \n唯一的变化是镜像名称，现在它引用我们在 Azure 中私有容器注册表中的镜像。剩下的就是将此清单应用到 AKS 中的 Kubernetes 集群：\n\n\
  ```\n> kubectl apply -f shopping-cart.yaml\n```\n\n过了一会儿，购物车将在 AKS 中运行。为了验证这一点，我们需要购物车在\
  \ AKS 中的 IP 地址，以便我们可以调用其端点。我们可以在 Kubernetes 仪表板中查找购物车的 IP 地址，也可以使用命令行。\n\n使用命令行，命令\
  \ `kubectl get all` 将显示集群中所有正在运行的信息。输出应类似于以下内容：\n\n```\nNAME READY STATUS RESTARTS\
  \ AGE\npod/shopping-cart-f4c8f4b94-vnmn9 1/1 Running 0 107s\n\nNAME TYPE CLUSTER-IP\
  \ EXTERNAL-IP PORT(S) AGE\nservice/kubernetes ClusterIP 10.0.0.1 <none> 443/TCP\
  \ 15m\nservice/shopping-cart LoadBalancer 10.0.100.183 52.142.83.184 5000:31552/TCP\
  \ 107s\n\nNAME READY UP-TO-DATE AVAILABLE AGE\ndeployment.apps/shopping-cart 1/1\
  \ 1 1 107s\n\nNAME DESIRED CURRENT READY AGE\nreplicaset.apps/shopping-cart-f4c8f4b94\
  \ 1 1 1 107s\n```\n\n购物车负载均衡器的 IP 地址在服务列表的外部 IP 列中。在本例中，IP 地址是 52.142.83.184，端口是\
  \ 5000，就像在本地主机上一样。我们可以通过负载均衡器调用购物车，在本例中为 52.142.83.184:5000。\n\n同样，IP 地址也可以在 Kubernetes\
  \ 仪表板下的服务中找到，如图 3.7 所示。\n\n![](img/608267d7803dc57a1a896ad121f37868_92_0.png)\n\n\
  图 3.7  \n在服务下查找购物车的地址。\n\n为了验证购物车确实在运行，我们可以通过例如使用购物车的 POST 端点向购物车添加商品来测试其端点：\n\n\
  ```\nPOST http:52.142.83.184:5000///shoppingcart/15/items\nAccept: application/json\n\
  Content-Type: application/json\n\n[1, 2]\n```\n\n然后使用 GET 端点读取同一个购物车：\n\n```\nGET\
  \ http:52.142.83.184:5000///shoppingcart/15\n```\n\n此端点的响应是用户编号 15 的购物车中的商品列表，证实购物车在\
  \ AKS 上的工作方式与在本地主机 Kubernetes 上以及直接使用 `dotnet run` 运行购物车时完全相同。\n\n随着时间的推移，我们将在微服务系统中创建许多微服务，这反过来意味着\
  \ Kubernetes 中会有许多 Pod；按照本章中我所概述的模式，每一个也都有一个关联的 Kubernetes 负载均衡器，允许在容器的多个副本之间平衡流量。例如，我们可能会运行\
  \ 3、10 或 100 个购物车容器副本，并让购物车的负载均衡器在它们之间分配传入流量。对于每个服务都有一个负载均衡器，每个负载均衡器都向外部公开端点并且每个都有不同的\
  \ IP 地址，会出现一个问题：我们如何管理所有这些进入 Kubernetes 集群的不同入口点？这个问题有一个安全方面，我们将在第 10 章中再次讨论，还有一个问题是终端用户应用程序如何知道将请求发送到哪里，我们将在第\
  \ 12 章中再次讨论。\n\n这标志着生产环境样例的设置以及第一个微服务的部署到该环境的完成。这为我们继续使用微服务奠定了良好的基础。AKS 集群已设置好并准备好运行更多微服务。随着我们开发更多微服务，我们将在其中每个中包含一个\
  \ Dockerfile 和一个 Kubernetes 清单，使我们能够构建容器镜像，将其推送到私有注册表，并部署到 AKS。\n\n## Summary\n\n\
  - 我们开发的微服务可以部署到许多不同的环境中。\n- 基于 .NET 的微服务很容易放入容器并作为容器运行。\n- 基于 .NET 的微服务的 Dockerfile\
  \ 遵循一个通用模板。\n- 将我们的微服务部署到 Kubernetes 为我们提供了一个高度可扩展的环境和一个多功能的容器编排器。\n- Kubernetes\
  \ 在本地主机和云中工作方式相同。这意味着我们可以轻松地在本地主机上用于开发，在云中用于生产运行完全相同的容器。\n- 我们微服务的 Kubernetes 清单都相似。\n\
  - Kubernetes 可以运行我们在即将到来的章节中将开发的所有内容，同时提供用于扩展、监控和调试微服务的工具。\n- Azure Kubernetes Services\
  \ 是一种易于设置的托管 Kubernetes 服务，使我们能够快速开始使用 Kubernetes。\n\n\n\n\n"
- '# 第 2 部分：构建微服务


  在本书的这一部分，你将学习如何设计和编码一个微服务。这些各式各样的话题都围绕着如何设计和编码出良好、可维护、可靠的微服务：


  - 第 4 章解释了如何将一个系统拆分组合为一组内聚的微服务。你将学到三条经验法则，帮助你判断每个微服务中应该包含什么。

  - 第 5 章展示了微服务如何协作以向最终用户提供功能。你还会了解三类协作方式以及何时使用它们。

  - 第 6 章探讨了在微服务系统中数据应该放在哪里，以及哪些微服务应该对哪些数据负责。

  - 第 7 章教你一些简单的技术，使微服务系统比原本更加健壮。利用这些技术，你可以创建一个在网络故障和单个微服务崩溃时仍能持续运行的系统。

  - 第 8 章转向测试。你将学习如何为微服务系统创建有效的自动化测试套件，从广泛的系统级测试到聚焦的单元测试，一应俱全。


  到第 2 部分结束时，你将知道如何设计微服务、如何使用 .NET 编写它们，以及如何使用 Kubernetes 运行它们。

  '
- '## 识别和界定微服务


  **本章涵盖**


  - 根据业务能力界定微服务

  - 根据技术能力界定微服务

  - 根据高效开发工作界定微服务

  - 处理难以界定的情况

  - 从现有微服务中拆分出新的微服务


  要在微服务上取得成功，善于恰当界定每个微服务的范围至关重要。如果你的微服务太大，创建新功能和实施错误修复的周期就会超过必要的时间。如果它们太小，微服务之间的耦合往往会增加。如果它们大小合适但边界错误，耦合也会增加，而更高的耦合同样会导致更长的交付周期。换句话说，如果你不能正确界定微服务的范围，就会失去微服务所提供的许多好处。在本章中，我将教你如何为每个微服务找到合适的范围，使其保持松散耦合且便于处理。


  识别和界定微服务的主要驱动因素是业务能力，次要驱动因素是支持性技术能力，第三驱动因素是工作效率。遵循这些驱动因素，微服务就能与第 1 章中的微服务特征清单很好地对应：


  - 一个微服务负责单一能力。

  - 一个微服务可以单独部署。

  - 一个微服务由一个或多个进程组成。

  - 一个微服务拥有自己的数据存储。

  - 一个小团队可以维护少量微服务。

  - 一个微服务是可替换的。


  在这些特征中，前两项和最后两项只有在微服务范围合理时才能实现。虽然实现层面也有一些需要考虑的问题，但范围界定错误会阻碍服务符合这四项特征。


  ### 4.1 界定微服务的主要驱动因素：业务能力


  每个微服务应该只实现一种能力。例如，购物车微服务应该跟踪用户购物车中的商品。识别微服务能力的主要方式是分析业务问题并确定业务能力。每个业务能力都应该由一个独立的微服务来实现。


  #### 4.1.1 什么是业务能力？


  业务能力是一个组织所做的、有助于实现业务目标的事情。例如，在电子商务网站上处理购物车就是一种业务能力，它有助于实现让用户购买商品的更广泛的业务目标。一个企业会拥有许多业务能力，这些能力共同构成整体业务功能。


  当把业务能力映射到微服务时，微服务就是对这种业务能力的建模。在某些情况下，微服务实现并完全自动化整个业务能力。在其他情况下，微服务只实现业务能力的一部分，因为该能力的一部分由现实世界中的人员完成，因此微服务仅部分自动化了该业务能力。在两种情况下，微服务的范围就是该业务能力。


  > **业务能力与限界上下文**

  >

  > *领域驱动设计*是一种基于业务领域建模的软件系统设计方法。其中一个重要步骤是识别领域专家用来讨论该领域的语言。事实证明，领域专家使用的语言并非在所有情况下都一致。在领域的不同部分，关注点各不相同，因此像“customer”这样的词在领域的不同部分可能有不同的侧重点。例如，对于一家销售复印机的公司来说，销售部门的客户可能是购买多台复印机的公司，并且可能主要由采购官员代表。在客户服务部门，客户可能是使用复印机遇到问题的最终用户。在对这家复印机公司的领域进行建模时，“customer”一词在模型的不同部分含义不同。

  >

  > 在领域驱动设计中，限界上下文是更大领域的一部分，其中词语的含义一致。限界上下文与业务能力相关但又不相同。限界上下文定义了领域内语言一致的区域。而业务能力则关乎业务需要完成什么。在一个限界上下文内，业务可能需要完成多件事情。每件事情通常都可能是一种业务能力。

  >

  > 由于同一限界上下文内的业务能力是相关的，因此我们可以接受同一限界上下文内能力之间的耦合程度高于不同限界上下文之间能力的耦合程度。


  #### 4.1.2 识别业务能力


  对领域的深入理解将使你能够了解业务是如何运作的。了解业务如何运作意味着你可以识别出构成业务的各项业务能力，以及交付这些能力所涉及的过程。换句话说，识别业务能力的方法就是了解业务领域。你可以通过与最了解业务领域的人交谈来获得这类知识：业务分析师、软件的最终用户，等等——所有直接参与推动业务的日常工作的相关人员。


  企业的组织形式通常反映了其领域。领域的不同部分由不同的人群处理，每个群体负责交付某些业务能力；因此，这种组织形式可以为你提供关于如何界定微服务的启示。首先，一个微服务的职责可能应该只属于一个群体的管辖范围。如果它跨越了两个群体之间的边界，那么它的范围可能过于宽泛，难以保持内聚性，从而导致可维护性降低。这些观察结果与所谓的康威定律一致：


  > 任何设计系统（广义定义）的组织，都会产生一种设计，其结构是该组织沟通结构的复制。


  有时你可能会发现领域中组织与领域不一致的部分。在这种情况下，有两种方法可以采用，两种方法都尊重康威定律。你可以接受系统不能完全反映领域，并实现一些与领域不完全一致但与组织良好对齐的微服务；或者你可以改变组织以




  反映该领域。两种方法都可能有问题。第一种方法存在构建范围界定不佳且可能高度耦合的微服务的风险。第二种方法涉及在团队之间移动人员和职责。这类变更可能很困难。你的选择应是务实的，基于对哪种方法会最少麻烦的评估。


  为了更好地了解业务能力是什么，我们需要看一个例子。


  ## 4.1.3 示例：销售点系统


  本章将探讨的示例是一个销售点系统（POS），如图 4.1 所示。我将简要介绍该领域，然后我们将研究如何在其中识别业务能力。最后，我们将更详细地考虑系统中某个微服务的范围。


  ![](img/608267d7803dc57a1a896ad121f37868_99_0.png)


  图 4.1 一个大型连锁商店的 POS 系统，由实现系统中所有业务能力的后端和收银员在商店中使用的轻量级 GUI 客户端组成。后端中的微服务实现业务能力。


  该 POS 系统用于大型连锁店的所有商店。商店中的收银员通过轻量级 GUI 客户端与系统交互——它可以是平板电脑应用程序、Web 应用程序或专用的实体收银机。GUI
  客户端只是后端前面的一个薄层。所有业务逻辑（业务能力）都在后端实现，后端将是我们的重点。


  系统为收银员提供多种功能：


  - 扫描产品并将其添加到发票中。

  - 准备发票。

  - 通过连接到客户端的读卡器为信用卡充电。

  - 注册现金支付。

  - 接受优惠券。

  - 打印收据。

  - 将电子收据发送给客户。

  - 在产品目录中搜索。

  - 扫描一个或多个产品以显示价格和与产品相关的特别优惠。


  这些功能是系统为收银员提供的，但它们并不直接对应驱动 POS 系统的业务能力。


  ## 在销售点领域中识别业务能力


  要识别驱动 POS 系统的业务能力，你需要超越功能列表。你必须确定在幕后需要发生什么来支持这些功能。


  从“在产品目录中搜索”功能开始，一个明显的业务能力是维护产品目录。这是第一个可能成为微服务范围的业务能力的候选。这样的产品目录微服务将负责提供对当前产品目录的访问。产品目录需要不时更新，但商店连锁使用另一个系统来处理该功能。产品目录微服务需要反映在该其他系统中所做的更改，因此产品目录微服务的范围将包括接收产品目录的更新。


  你可能识别出的下一个业务能力是向发票应用特别优惠。特别优惠在客户购买产品捆绑包时给予折扣价。捆绑包可能由一定数量的相同产品以折扣价组成（例如，买二送一），也可能是不同产品的组合（例如，买
  A 可享受 B 9 折）。在任何情况下，收银员从 POS GUI 客户端获得的发票都必须自动考虑任何适用的特别优惠。这是第二个可作为微服务范围的候选业务能力。特别优惠微服务将负责决定何时适用特别优惠以及客户应获得的折扣。


  再次查看功能列表，注意系统应允许收银员“扫描一个或多个产品以显示价格和与产品相关的特别优惠”。这表明特别优惠业务能力不仅仅是向发票应用特别优惠；它还包括根据产品查找特别优惠的能力。


  如果你继续在 POS 系统中寻找业务能力，你可能会得到以下列表：


  - 产品目录

  - 价格目录

  - 价格计算

  - 特别优惠

  - 优惠券

  - 销售记录

  - 发票

  - 付款


  图 4.2 显示了从功能到业务能力的映射。该映射在逻辑上是成立的，因为它显示了实现每个功能所需的业务能力，但它并不能表示任何直接的技术依赖。例如，从准备发票到优惠券的箭头并不表示客户端中某个准备发票代码直接调用优惠券微服务。相反，该箭头表示为了准备发票，需要考虑优惠券，因此准备发票功能依赖于优惠券业务能力。


  ![](img/608267d7803dc57a1a896ad121f37868_101_0.png)


  在真实领域中找到业务能力可能是一项艰巨的工作，通常需要大量的迭代。业务能力列表不是在开发开始时制定的静态列表；相反，它是一个随着你对领域和业务的理解不断增长和加深而不断演变和变化的列表。


  现在我们已经完成了识别业务能力的第一次迭代，让我们更仔细地看看其中一个能力以及它如何定义微服务的范围。


  ## 特别优惠微服务


  特别优惠微服务基于特别优惠业务能力。为了缩小该微服务的范围，我们将深入研究该业务能力并识别所涉及的流程，如图 4.3 所示。每个流程都提供业务能力的一部分。


  ![](img/608267d7803dc57a1a896ad121f37868_102_0.png)


  图 4.3 特别优惠业务能力包括多个不同的流程。


  特别优惠业务能力被分解为五个流程。其中四个面向 POS GUI 客户端。第五个——跟踪特别优惠的使用——面向业务本身，业务有兴趣跟踪客户利用了哪些特别优惠。


  将业务能力作为微服务实现意味着你需要执行以下操作：


  - 将四个面向客户端的流程作为 API 端点公开，供其他微服务调用。

  - 通过事件馈送实现使用跟踪流程。POS 系统的业务智能部分可以订阅这些事件并使用它们来跟踪客户使用哪些特别优惠。


  特别优惠微服务的组件如图 4.4 所示。


  ![](img/608267d7803dc57a1a896ad121f37868_103_0.png)


  图 4.4 特别优惠业务能力中的流程反映在特别优惠微服务的实现中。流程通过微服务的 HTTP API 向其他微服务公开。


  特别优惠微服务的组件与第 2 章中的购物车微服务的组件相似，后者再次显示在图 4.5 中。这并非巧合。这些是我们微服务通常由以下组件组成：一个公开微服务实现的业务能力的
  HTTP API、一个事件馈送（在第 5 章中解释并实现）、实现业务能力所涉及业务逻辑的领域模型、数据存储组件和数据库。


  ![](img/608267d7803dc57a1a896ad121f37868_103_1.png)


  图 4.5 第 2 章中的购物车微服务的组件与特别优惠微服务的组件相似。


  ## 4.2 微服务范围划分的次要驱动因素：支持技术能力


  识别微服务范围的第二种方法是查看支持技术能力。支持技术能力是指不直接促进业务目标但支持其他微服务的东西，例如与其他系统集成或安排在未来某个时间发生事件。


  ### 4.2.1 什么是技术能力？


  支持技术能力是微服务范围划分中的次要驱动因素，因为它们不直接促进系统的业务目标。它们存在于简化并支持实现业务能力的其他微服务。


  记住，一个好的微服务的特征之一是可替换的；但如果实现业务能力的微服务还实现了复杂的技术能力，它可能会变得过大和过于复杂而无法替换。在这种情况下，你应考虑在单独的微服务中实现该技术能力，该微服务支持原始微服务。在讨论如何以及何时识别支持技术能力之前，提供几个例子可能会有所帮助。


  ### 4.2.2 支持技术能力的示例


  为了让你了解我所说的支持技术能力是什么意思，让我们考虑两个例子：与其他系统的集成，以及向客户发送通知的能力。


  ### 与外部产品目录系统集成


  在示例 POS 系统中，你将产品目录识别为业务能力。我还提到产品信息在微服务型 POS 系统外部的另一个系统中维护。另一个系统是企业资源规划（ERP）系统。这意味着产品目录微服务必须与
  ERP 系统集成，如图 4.6 所示。


  ![](img/608267d7803dc57a1a896ad121f37868_104_0.png)


  图 4.6 产品数据从 ERP 系统流向产品目录微服务。用于从 ERP 系统获取产品信息的协议由 ERP 系统定义。它可以公开一个 SOAP Web 服务来获取信息，也可以将产品信息导出为专有文件格式。






  假设你无法对 ERP 系统做出修改，那么集成必须通过 ERP 系统所提供的任何接口来实现。它可能使用 SOAP Web 服务来获取产品信息，也可能将所有产品信息导出为专有文件格式。无论哪种情况，集成都必须按照
  ERP 系统的规则来进行。根据 ERP 系统暴露的接口不同，这可能是一个或大或小的任务。无论如何，这个任务主要关注的是与其他系统集成时的技术细节，并且有可能至少在一定程度上较为复杂。该集成的目的是为产品目录微服务提供支持。


  我们将把集成从产品目录微服务中分离出来，并在一个独立的 ERP 集成微服务中实现它，该微服务仅负责这一项集成，如图 4.7 所示。我们这样做基于两个原因：


  -   通过将集成的技术复杂性转移到单独的微服务中，我们可以让产品目录微服务的范围保持窄小而专注。

  -   通过使用单独的微服务来处理 ERP 数据的格式和组织方式，我们能够让 ERP 系统对“产品”的视图与 POS 系统对“产品”的视图保持分离。请记住，在一个大型领域的不同部分，对术语含义存在不同的理解。产品目录微服务与
  ERP 系统在产品实体的建模方式上很可能无法达成一致。需要在这两种视图之间进行转换，而这最好由新的微服务来完成。用领域驱动设计的术语来说，这个新微服务充当了一个*防腐层*。


  > **注意** 防腐层是一个源自领域驱动设计的概念。当两个系统交互时可以使用它：它保护一个系统中的领域模型不被另一个系统模型中的语言或概念所污染。


  ![](img/608267d7803dc57a1a896ad121f37868_105_0.png)


  **图 4.7** ERP 集成微服务通过处理与 ERP 系统的集成来支持产品目录微服务。它在 ERP 系统暴露产品数据的方式与产品目录微服务消费这些数据的方式之间进行转换。


  将集成放在独立微服务中的一个额外好处是，它是解决与集成相关的可靠性问题的好地方。如果 ERP 系统不可靠，处理该问题的位置就在 ERP 集成微服务中。如果 ERP
  系统速度慢，ERP 集成微服务可以应对这一点。随着时间推移，你可以调整 ERP 集成微服务中使用的策略，以解决 ERP 系统的可靠性问题，而完全不需要改动产品目录微服务。这个与
  ERP 系统的集成是一个支持性技术能力的示例，而 ERP 集成微服务则是一个实现该能力的微服务示例。


  ## 向客户发送通知


  现在让我们考虑为 POS 系统扩展功能，使其能够通过电子邮件、短信或移动应用推送通知，向注册客户发送关于新特别优惠的通知。我们可以将这个能力放入一个或多个独立的微服务中。


  目前，POS 系统并不知道客户是谁。为了提升客户参与度和客户忠诚度，公司决定启动一个小型忠诚度计划，客户可以注册以接收特别优惠通知。客户忠诚度计划是一项新的业务能力，将由一个新的忠诚度计划微服务负责。图
  4.8 展示了该微服务，它负责在每次有新特别优惠可用时通知注册客户。


  ![](img/608267d7803dc57a1a896ad121f37868_106_0.png)


  图 4.8 忠诚度计划微服务订阅特别优惠微服务的事件，并在新优惠可用时通知注册客户。


  作为注册流程的一部分，客户可以选择通过电子邮件、短信，或者如果他们安装了公司的移动应用则通过推送通知来接收通知。这给忠诚度计划微服务带来了一些复杂性，因为它不仅需要选择使用哪种类型的通知，还要处理每种通知的工作方式。作为第一步，我们将为每种通知类型引入一个支持性技术微服务。如图
  4.9 所示。


  ## 第4章 *识别和界定微服务*


  ![](img/608267d7803dc57a1a896ad121f37868_107_0.png)


  **图 4.9** 为了避免忠诚度计划微服务陷入处理每种通知类型的技术细节中，我们将引入三个支持性技术微服务，每种通知类型一个。


  这样更好。忠诚度计划微服务不必实现与每种通知类型相关的所有细节，从而使该微服务的范围保持窄小而专注。不过，这种情况并非完美：该微服务仍然需要决定为每个注册客户调用哪个支持性技术微服务。


  这促使我们再引入一个微服务，它作为处理三种通知类型的三个微服务的前端。这个新的通知微服务如图 4.10 所示，它负责在每次需要通知客户时选择使用哪种通知类型。


  ![](img/608267d7803dc57a1a896ad121f37868_107_1.png)


  **图 4.10** 为了从忠诚度计划微服务中移除更多复杂性，我们将引入一个通知微服务，负责根据客户偏好选择通知类型。


  这个支持性技术能力的示例与之前的 ERP 集成示例有所不同，因为其他微服务也可能需要向特定客户发送通知。例如，POS 系统的功能之一就是发送……


  引入通知限界上下文还有一个额外好处，即明确了三种技术能力——发送电子邮件、短信和推送通知——都包含在该限界上下文中，并作为微服务来服务于该限界上下文。因此，其他限界上下文中的微服务不应与这三个支持性技术微服务直接协作，而应面向业务的通知微服务协作。这有助于保持限界上下文之间的低耦合，因为其他限界上下文中的微服务不知道也不关心存在三种发送通知的方式。例如，电子邮件微服务只被通知微服务使用，并且不与任何其他微服务耦合。


  ### 4.2.3 识别技术能力


  当你引入支持性技术微服务时，你的目标是简化实现业务能力的微服务。有时——比如发送通知——你会识别出一组多个微服务所需的技术能力，并将其转化为一个拥有自己微服务的限界上下文，以便其他微服务可以共享该实现。其他时候——比如
  ERP 集成——你会识别出一种使微服务过度复杂化的技术能力，并将该能力转化为一个独立的微服务。在这两种情况下，其他实现业务能力的微服务就少了一项需要处理的技术关注点。


  在决定将技术能力实现为独立微服务时，请注意不要违反微服务“可独立部署”的特性。只有当该微服务可以独立于任何其他微服务进行部署和重新部署时，将技术能力实现为独立微服务才有意义。同样，部署由提供技术能力的微服务所支持的微服务，也不得强制你重新部署实现该技术能力的微服务。


  识别业务能力以及基于业务能力的微服务是一项战略性工作，而识别可由独立微服务实现的技术支持能力则是一项机会性工作。一个支持性技术能力是否应在自己的微服务中实现，最终取决于从长远来看怎样做最为简单。你应该提出以下问题：


  -   如果支持性技术能力保留在业务能力范围的微服务中，该微服务是否存在无法以合理代价进行替换的风险？

  -   该支持性技术能力是否在多个业务能力范围内的微服务中实现？

  -   实现该支持性能力的微服务能否独立部署？

  -   如果将支持性技术能力实现在独立微服务中，所有业务能力范围内的微服务是否仍然可以独立部署？






  ## 4.3 界定微服务范围的第三个驱动因素：支持工作效率


  我们在确定微服务的范围和边界时，第三个驱动因素是支持工作效率。我们设计和创建的微服务应便于使用，并应让开发和维护微服务的团队高效工作。在很大程度上，这关乎尊重并运用康威定律，您可能还记得前面提到的：


  > 任何设计系统（广义定义）的组织，其产生的设计结构都会是该组织沟通结构的复制。


  如果我们有一个已经定义且无法改变的组织，那么我们创建的微服务系统必须与该组织保持一致。另一方面，如果组织可以改变，我们就应该根据整个微服务系统来进行调整。


  首先，尊重康威定律意味着我们应确保每个微服务都有明确的所有权：我们应该为每个微服务的开发和维护分配一个团队。这与微服务的特性一致，即一个小团队可以维护少数几个微服务。每个团队可以分配少数几个服务来负责。责任明确非常重要。如果一个微服务的责任被分配给两个或多个团队，那么每当需要对该微服务进行更改时，这些团队就需要密切协调。这种协调需要时间，并且意味着相关团队都无法自主工作。这是一种低效形式，如果我们确保每个微服务都分配给一个团队，就可以避免这种情况。


  允许团队自主工作有助于界定微服务的范围和边界。首先，团队必须具备必要的技能和知识。例如，一个被分配了本章前面提到的通知微服务的团队，必须理解与通知用户相关的业务规则。


  其次，团队必须能够在与其他团队无需过多、过细协调的情况下工作。例如，当一个团队被分配了通知微服务时，他们可能也会被分配用于发送短信、电子邮件和推送通知的支持性技术微服务，因为这些微服务与通知微服务之间存在一定程度的耦合。由于这种耦合，将支持性技术微服务分配给另一个团队会引入协调需求，并降低两个团队的自主性，因此我们可能会将它们全部分配给同一个团队，这样该团队就负责整个通知限界上下文。一旦他们承担了支持性技术微服务，该团队除了需要掌握围绕通知的业务规则知识外，还需要具备与短信网关、电子邮件系统和推送通知进行集成的必要技能。我们需要意识到这一点，如果我们找不到或无法组建一个具备所需知识与技能组合的团队，我们可能不得不改变微服务的范围。


  ![](img/608267d7803dc57a1a896ad121f37868_111_0.png)


  为了确保我们不会给开发微服务的团队带来低效问题，关注现有的依赖链是值得的。图4.12描绘了一个依赖链：方框代表微服务，箭头代表依赖关系。


  如果图4.12中的每个微服务都按方框内所示分配给团队A、B、C和D，那么分配给依赖链顶部微服务的团队A，与分配给链底部微服务的团队D，所处的情况截然不同。这是因为微服务之间的依赖关系会反映为团队之间的依赖关系。维护顶部微服务的团队A可以随意更改任何内容，而不必担心会破坏链中下游其他团队所维护的微服务。另一方面，维护底部微服务的团队D，如果引入破坏性变更，则可能会破坏依赖链中的所有其他微服务。同时，维护顶部微服务的团队A，如果不与依赖链中的其他团队协调，可能也无法完成多少工作，因为它可能依赖其他团队来实现某些功能。换句话说，如果我们创建的依赖链过长，可能会使团队A和团队B都陷入低效。这在一定程度上可以通过正确界定微服务的范围和边界来应对，部分则通过设计微服务之间的协作方式以利于低耦合来应对。我们将在第5章深入探讨微服务之间的协作设计。


  图4.12 微服务之间的依赖关系会反映为维护这些微服务的团队之间的依赖关系。箭头表示依赖关系，方框表示微服务，并标注了维护它们的团队。


  注意 在第5章中，我们将看到基于事件的协作如何帮助打破依赖链。


  ## 4.4 当正确范围不明确时该怎么办


  此时，您可能会想，正确地界定微服务范围确实很难：您需要准确理解业务能力，这需要对业务领域有深入的理解；您还必须正确判断支持性技术能力的复杂性；并且您需要确保团队能够高效工作。您说得对：这确实很难，而且您会发现自己处于微服务正确范围不明确的情况中。这种不明确可能有多种原因，包括以下这些：


  - *对业务领域理解不足*——分析业务领域并建立对该领域的深入知识是困难且耗时的。有时，您需要在尚未充分理解业务、无法确定自己做出正确决策之前，就做出关于微服务范围的决策。

  - *业务领域中的困惑*——不仅开发方可能对业务领域不清晰，有时业务方也不清楚应如何处理业务领域。也许业务正在进入新市场，必须在此过程中学习新领域。其他时候，现有业务市场会因竞争对手的行为或业务自身的行为而发生变化。无论哪种情况，在业务方和开发方，业务领域都在不断变化，您对它的理解也是逐步形成的。

  - *对技术能力细节了解不完整*——您可能无法获得实现技术能力所需的全部信息。例如，您可能需要与一个文档记录不佳的系统集成，在这种情况下，您只有在完成集成后才会知道如何实现它。

  - *无法估计技术能力的复杂性*——如果您之前没有实现过类似的技术能力，可能很难估计该能力的实现会有多复杂。


  这些问题都不意味着您失败了。它们都是反复出现的情况。诀窍在于知道如何在缺乏清晰度的情况下继续前进。在本节中，我将讨论当您心存疑虑时该怎么做。


  ### 4.4.1 从稍大的范围开始


  当对微服务的范围不确定时，最好倾向于使微服务的范围比理想情况下更大一些。这听起来可能有些奇怪——我谈了很多关于创建小型、聚焦的微服务以及保持微服务小型化带来的好处。确实，保持微服务小型且聚焦可以带来显著的好处。但您也必须考虑，如果范围过窄，会发生什么。


  考虑本章前面讨论的“特别优惠”微服务。它在POS系统中实现了“特别优惠”业务能力，并包含五个不同的业务流程，如图4.3所示，并在图4.13的顶部部分再次呈现。如果您对“特别优惠”业务能力的边界不确定，并选择倾向于过小的范围，您可能会拆分该业务能力，如图4.13底部部分所示。






  # 特价优惠业务能力


  ![](img/608267d7803dc57a1a896ad121f37868_113_0.png)


  # 特价优惠业务能力错误地拆分到两个微服务中


  ![](img/608267d7803dc57a1a896ad121f37868_113_1.png)


  # 责任划分不清晰：两个具有相关功能且需要相同数据和相同搜索逻辑的流程


  图 4.13 如果你将微服务的范围设得太小，你会发现单个业务能力会被拆分到多个高度耦合的部分。


  如果你仅基于特价优惠业务能力的一部分来确定微服务的范围，你将产生一些显著的成本：


  - 数据和数据模型在两个微服务之间的重复——实现的两部分都需要将其数据存储中的所有特价优惠都存储起来。

  - 责任划分不清晰——被分割的业务能力的一部分可以回答某个产品是否属于任何特价优惠，而另一部分可以根据过往购买向客户推荐特价优惠。这两个功能密切相关，你很快就会陷入一种情况，即不清楚某段代码应属于哪个微服务。


  - *重构业务能力代码的障碍*——这可能是因为代码分散在两个微服务的代码库中。这种跨代码库的重构很困难，因为很难全面了解重构的后果，而且工具支持也很差。

  - *难以独立部署两个微服务*——在涉及两个微服务的重构或功能实现之后，两个微服务可能需要同时部署或按特定顺序部署。无论哪种情况，两个微服务版本之间的耦合都违反了微服务可单独部署的特性。这使得测试、部署和生产监控变得更加复杂。


  这些成本从微服务首次创建时开始产生，直到你积累足够的经验和知识，更正确地识别出业务能力以及微服务的更好范围为止，在本例中即整个特价优惠业务能力。除了这些成本之外，业务能力重构和更改实现的困难会导致你在这两方面做得更少，因此你需要更长时间来了解业务能力。与此同时，你要承担重复数据和数据模型的成本，以及缺乏单独部署能力的成本。


  我们已经确定，倾向于范围过窄很容易导致以一种方式划定微服务的范围，从而在微服务之间产生昂贵的耦合。为了判断这是否比倾向于范围过大更好或更差，我们需要查看这种做法的成本。


  如果你倾向于更大的范围，你可能会决定特价优惠微服务的范围也包括处理优惠券。该更大特价优惠微服务的范围如图 4.14 所示。


  ![](img/608267d7803dc57a1a896ad121f37868_114_0.png)


  图 4.14 如果你选择倾向于更大的范围，你可能会决定将优惠券的处理纳入特价优惠业务能力。


  将过多内容纳入微服务范围会带来成本：


  - 代码库变得更大更复杂，这可能导致更改成本更高。

  - 微服务更难被替换。


  这些成本是真实存在的，但在微服务范围仍然相当小的情况下，它们并不压倒性。要注意的是，这些成本会随着每个微服务范围的大小迅速增长，并在范围大到接近单体架构时变得压倒性。


  尽管如此，在一个代码库内的重构比跨两个代码库的重构容易得多。这给了你更多进行实验并通过实验了解业务能力的机会。如果你利用这个机会，你可以比将微服务范围划定得过窄时更快地对特价优惠业务能力和优惠券业务能力形成良好的理解。


  当你的微服务只是有点过大时，这一论点成立，但如果它们大得太多，这一论点就不成立了，在这种情况下我们将失去微服务所期望的速度和灵活性。


  > WARNING  不要偷懒将多个业务能力塞进一个微服务。你很快就会拥有一个庞大、难以管理的代码库，具有完整的单体所带来的许多缺点。


  总的来说，略大于理想大小的微服务在成本上更低，并且比略小于理想大小的微服务允许更多的敏捷性。因此，经验法则是倾向于稍大的范围。


  一旦你接受了在不确定微服务最佳范围时，你有时——如果不是经常——会存在疑虑，并且在这种情况下应偏向稍大的范围，你也可以接受有时——如果不是经常——你的系统中会有一些比理想大小稍大的微服务。这意味着你应该预期不时地需要从现有微服务中拆分出新的微服务。


  ## 4.4.2 从现有微服务中拆分出新的微服务


  当你意识到某个微服务过大时，你需要考虑如何从中拆分出新的微服务。首先，你需要为现有微服务和新微服务确定良好的范围。为此，你可以使用本章前面描述的驱动因素。


  一旦确定了范围，你必须查看代码，看看其组织方式是否与新的范围保持一致。如果不一致，你应该开始重构以实现这种一致性。图 4.15 在高层级说明了为拆分出新的微服务而进行的重构。首先，将最终进入新微服务的所有内容移至其自己的类库。然后，将保留在现有微服务中的代码与将移至新微服务的代码之间的所有通信重构为通过接口进行。该接口将在拆分后成为两个微服务的公共
  HTTP 接口的一部分。


  ![](img/608267d7803dc57a1a896ad121f37868_116_0.png)


  步骤 0：特价优惠微服务包含优惠券能力。


  ![](img/608267d7803dc57a1a896ad121f37868_116_1.png)


  ![](img/608267d7803dc57a1a896ad121f37868_116_2.png)


  步骤 1：特价优惠微服务仍然包含优惠券能力，但优惠券能力已重构为单独的项目。


  ![](img/608267d7803dc57a1a896ad121f37868_116_3.png)


  ![](img/608267d7803dc57a1a896ad121f37868_116_4.png)


  步骤 2：特价优惠微服务仍然包含优惠券能力，但它已被重构，并且所有通信都通过公共 API 进行。


  ![](img/608267d7803dc57a1a896ad121f37868_116_5.png)


  图 4.15 通过重构为拆分出新的微服务做准备：首先将属于新微服务的所有内容移至其自己的项目，然后使所有通信都通过公共 API 进行，该 API 类似于新微服务最终将拥有的
  API。


  当你达到图 4.15 中的步骤 2 时，可以以可控的努力将新微服务从旧微服务中分离出来。创建一个新的微服务，将需要从现有微服务中拆分出来的代码移至新微服务，并将两部分之间的通信改为通过
  HTTP 进行。


  ## 4.4.3 计划日后拆分出新的微服务


  由于你在不确定微服务范围时有意识地倾向于使其稍大一些，你有机会预见到哪些微服务最终需要被拆分。如果你知道某个微服务很可能会日后拆分，最好能为该拆分提前规划，从而节省图
  4.15 中显示的一个或两个重构步骤。事实证明，你经常可以做出这种规划。


  通常你会不确定某个特定功能是否是一个独立的业务能力，因此你会遵循经验法则，将其纳入一个更大的业务能力中，在针对该更大业务能力范围的微服务内实现。但你可以保持意识到该区域可能是一个独立的业务能力。


  考虑一下包含处理优惠券流程的特价优惠业务能力的定义。你很可能对优惠券处理是否是一个独立的业务能力存在疑虑，因此特价优惠业务能力被建模为包含图 4.14 所示的所有流程。


  当你首次实现一个范围针对图 4.14 所示的特价优惠业务能力理解的特价优惠微服务时，你并不知道优惠券功能最终是否会被移至优惠券微服务。你确实知道，优惠券功能与微服务的其余部分相比关联性并不那么紧密。因此，最好在优惠券代码周围设置一个清晰的边界，以明确定义的公共
  API 的形式，并将代码放在单独的类库中。这是一种良好的软件设计，如果有一天你最终拆分出优惠券代码以创建新的优惠券微服务，它也会带来回报。


  ## 4.5 范围良好的微服务遵循微服务特性


  我谈到了通过首先识别业务能力，然后其次支持技术能力来划定微服务的范围。在本节中，我将讨论这种划定范围的方法如何与本章开头提到的微服务的四个特性保持一致：


  - 微服务负责单一能力。

  - 微服务可单独部署。

  - 一个小型团队可以维护少数几个微服务。

  - 微服务可被替换。


  > **NOTE**  需要注意的是，微服务划定范围的驱动因素与微服务特性之间的关系是双向的。首要和次要驱动因素导向遵循特性，但




  the characteristics also tell you whether you’ve scoped your microservices well
  or need to push the drivers further to find better scopes for your microservices.


  ## 4.5.1 Primary scoping to business capabilities leads to good microservices


  The primary driver for scoping microservices is identifying business capabilities.
  Let’s see how that makes for microservices that adhere to the microservice characteristics.


  ### RESPONSIBLE FOR A SINGLE CAPABILITY


  A microservice scoped to a single business capability by definition adheres to the
  first microservice characteristic: it’s responsible for a single capability. As
  you saw in the examples of identifying supporting technical capabilities, you have
  to be careful: it’s easy to let too much responsibility slip into a microservice
  scoped to a business capability. You have to be diligent in making sure that what
  a microservice implements is just one business capability and not a mix of two or
  more. You also have to be careful about putting supporting technical capabilities
  in their own microservices. As long as you’re diligent, microservices scoped to
  a single business capability adhere to the first characteristic of microservices.


  ### INDIVIDUALLY DEPLOYABLE


  Business capabilities are those that can be performed by largely independent groups
  within an organization, so the business capabilities themselves must be largely
  independent. As a result, microservices scoped to business capabilities are largely
  independent. This doesn’t mean there’s no interaction between such microservices—there
  can be a lot of interaction, both through direct calls between services and through
  events. The point is that the interaction happens through well-defined public interfaces
  that can be kept backward compatible. If implemented well, the interaction is such
  that other microservices continue to work even if one has a short outage. This means
  well-implemented microservices scoped to business capabilities are individually
  deployable.


  ### REPLACEABLE AND MAINTAINABLE BY A SMALL TEAM


  A business capability is something a small group in an organization can handle.
  This limits its scope and thus also limits the scope of microservices scoped to
  business capabilities. Again, if you’re diligent about making sure a microservice
  handles only one business capability and that supporting technical capabilities
  are implemented in their own microservices, the microservices’ scope will be small
  enough that a small team can maintain at least a handful of microservices and a
  microservice can be replaced fairly quickly if need be.


  ## 4.5.2 Secondary scoping to support technical capabilities leads to good microservices


  The secondary driver for scoping microservices is identifying supporting technical
  capabilities. Let’s see how that makes for microservices that adhere to the microservice
  characteristics.


  ### RESPONSIBLE FOR A SINGLE CAPABILITY


  Just as with microservices scoped to business capabilities, scoping a microservice
  to a single supporting technical capability by definition means it adheres to the
  first characteristic of microservices: it’s responsible for a single capability.


  ### INDIVIDUALLY DEPLOYABLE


  Before you decide to implement a technical capability as a separate supporting technical
  capability in a separate microservice, you need to ask whether that new microservice
  will be individually deployable. If the answer is no, you shouldn’t implement it
  in a separate microservice. Again, by definition, a microservice scoped to a supporting
  technical capability adheres to the second microservice characteristic.


  ### REPLACEABLE AND MAINTAINABLE BY A SMALL TEAM


  Microservices scoped to a supporting technical capability tend to be narrowly and
  clearly scoped. On the other hand, part of the point of implementing such capabilities
  in separate microservices is that they can be complex. In other words, microservices
  scoped to a supporting technical capability tend to be small, which points toward
  adhering to the microservice characteristics of replaceability and maintainability;
  but the code inside them may be complex, which makes them harder to maintain and
  replace.


  This is an area where there’s a certain back and forth between using supporting
  technical capabilities to scope microservices on one hand, and the characteristics
  of microservices on the other. If a supporting technical microservice is becoming
  so complex that it will be hard to replace, this is a sign that you should probably
  look closely at the capability and try to find a way to break it down further, as
  in the example about notification (see section 4.2.2).


  ## 4.5.3 Tertiary scoping to support efficiency of work


  The third driver for scoping microservices is supporting the efficiency of work.
  Let’s see how making sure teams can work efficiently aligns with the microservice
  characteristics.


  ### INDIVIDUALLY DEPLOYABLE


  Part of making sure that teams can work efficiently and autonomously is to make
  sure that they can deliver their work all the way to production. This aligns nicely
  to the second microservice characteristic. When a microservices is individually
  deployable, the team can deploy it to production without coordinating with other
  teams. This is part of making sure that the team can work efficiently.


  ### A SMALL TEAM CAN MAINTAIN A FEW HANDFULS OF MICROSERVICES


  Teams should have knowledge necessary to maintain the microservices they are responsible
  for. Otherwise, they cannot work efficiently and autonomously. When they have the
  knowledge needed, they can maintain their microservices by themselves end-to-end,
  which supports the fifth microservices characteristic.


  ## Summary


  - The primary driver in scoping microservices is identifying business capabilities.
  Business capabilities are the things an organization does that contribute to fulfilling
  business goals.

  - You can use techniques from domain-driven design to identify business capabilities.
  Domain-driven design is a powerful tool for gaining better and deeper understanding
  of a domain. That kind of understanding enables you to identify business capabilities.

  - The secondary driver in scoping microservices is identifying supporting technical
  capabilities. A supporting technical capability is a technical function needed by
  one or more microservices scoped to business capabilities.

  - Supporting technical capabilities should be moved to their own microservices only
  if they’re sufficiently complex to be a problem in the microservices they would
  otherwise be part of, and if they can be individually deployed.

  - Identifying supporting technical capabilities is an opportunistic form of design.
  You should only pull a supporting technical capability into a separate microservice
  if it will be an overall simplification.

  - The tertiary driver in scoping microservices is efficiency of work. A team assigned
  to develop and maintain microservices should be able to work efficiently and autonomously.

  - When you’re in doubt about the scope of a microservice, lean toward making the
  scope slightly bigger rather than slightly smaller.

  - Because scoping microservices well is difficult, you’ll probably be in doubt sometimes.
  You’re also likely to get some of the scopes wrong in your first iteration.

  - You must expect to have to carve new microservices out of existing ones from time
  to time.

  - You can use your doubt about scope to organize the code in your microservices
  so that they lend themselves to carving out new microservices at a later stage.


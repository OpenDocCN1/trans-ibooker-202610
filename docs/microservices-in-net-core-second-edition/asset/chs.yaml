  \    Hosting environment: Development\ninfo: Microsoft.Hosting.Lifetime[0]\n   \
  \ Content root path: C:\\Users\\chors\\Documents\\horsdal3\\code\\Chapter07\\\n\
  \        LoyaltyProgram\\LoyaltyProgram\nfail: Microsoft.AspNetCore.Server.Kestrel[13]\n\
  \    Connection id \"0HM2KQ4LI56GR\", Request id \"0HM2KQ4LI56GR:00000001\":\n \
  \       An unhandled exception was thrown by the application.\nSystem.NotImplementedException:\
  \ The method or operation is not implemented.\n    at LoyaltyProgram.Users.UsersController.Fail()\
  \ in C:\\Users\\chors\\\nDocuments\\horsdal3\\code\\Chapter07\\LoyaltyProgram\\\
  LoyaltyProgram\\Users\\\nUsersController.cs:line 13\n    at lambda_method(Closure\
  \ , Object , Object[] )\n    at Microsoft.Extensions.Internal.ObjectMethodExecutor.Execute(\n\
  Object target, Object[] parameters)\n    at Microsoft.AspNetCore.Mvc.Infrastructure.ActionMethodExecutor.\n\
  SyncActionResultExecutor.Execute(IActionResultTypeMapper mapper,\nObjectMethodExecutor\
  \ executor, Object controller, Object[] arguments)\n    at Microsoft.AspNetCore.Mvc.Infrastructure.ControllerActionInvoker.\n\
  InvokeActionMethodAsync()\n    at Microsoft.AspNetCore.Mvc.Infrastructure.ControllerActionInvoker.\n\
  Next(State& next, Scope& scope, Object& state, Boolean& isCompleted)\n    at Microsoft.AspNetCore.Mvc.Infrastructure.ControllerActionInvoker.\n\
  InvokeNextActionFilterAsync()\n--- End of stack trace from previous location where\
  \ exception was thrown ---\n    at Microsoft.AspNetCore.Mvc.Infrastructure.ControllerActionInvoker.\n\
  Rethrow(ActionExecutedContextSealed context)\n    at Microsoft.AspNetCore.Mvc.Infrastructure.ControllerActionInvoker.\n\
  Next(State& next, Scope& scope, Object& state, Boolean& isCompleted)\n    at Microsoft.AspNetCore.Mvc.Infrastructure.ControllerActionInvoker.\n\
  InvokeInnerFilterAsync()\n```\n\nStart of the error log\n\n```\n--- End of stack\
  \ trace from previous location where exception was thrown ---\n   at Microsoft.AspNetCore.Mvc.Infrastructure.ResourceInvoker.<\n\
  \      InvokeFilterPipelineAsync>g__Awaited|19_0(ResourceInvoker invoker, Task lastTask,\
  \ State next, Scope scope, Object state, Boolean isCompleted)\n   at Microsoft.AspNetCore.Mvc.Infrastructure.ResourceInvoker.<InvokeAsync>\n\
  \      g__Awaited|17_0(ResourceInvoker invoker, Task task, IDisposable scope)\n\
  \   at Microsoft.AspNetCore.Routing.EndpointMiddleware.<Invoke>\n      g__AwaitRequestTask|6_0(Endpoint\
  \ endpoint, Task requestTask,\n      ILogger logger)\n   at Microsoft.AspNetCore.Server.Kestrel.Core.Internal.Http.HttpProtocol.\n\
  \      ProcessRequests[TContext](IHttpApplication`1 application)\n```\n\n在第 10 章中，我们将回到日志记录并了解如何配置它并使其更有用，但就目前而言，我们很满意所有异常都被记录下来。\n\
  \n## 7.3.5 Deploying to Kubernetes\n\n我们已经在忠诚度计划微服务周围的所有协作中实现了健壮性模式，但我们并没有改变协作风格——查询仍然是查询，命令仍然是命令，事件仍然是事件。此外，微服务之间的依赖关系仍然相同：忠诚度计划微服务仍然订阅来自特价优惠微服务的事件并仍然向通知微服务发送命令。这意味着部署到\
  \ Kubernetes 不需要改变，因此与我们在第 5 章中看到的完全相同。\n\n至此，围绕忠诚度计划微服务的协作的健壮性措施的实现已经完成。有了这些相当简单的措施，协作在生产负载下很可能会更加健壮。\n\
  \n## Summary\n\n- 由于微服务之间存在大量通信，你必须预期某些通信会失败。微服务优雅地处理此类故障对于系统的健壮性至关重要。\n- 你应该在微服务中设计健壮性，以便故障不会在系统中传播并最终成为错误。\n\
  - 协作的客户端负责在出现故障时使通信健壮。\n- 你应该拥有良好的日志，并且在需要调查生产问题时易于访问和搜索。中央日志微服务应接收所有日志消息并提供访问权限。\n\
  - 使通信健壮的最重要策略是重试和断路器模式。\n- Polly 使设置和使用重试策略以及断路器变得容易。\n- 默认情况下 ASP.NET 将错误记录到标准输出。现成的日志产品支持从所有微服务收集这些日志并将其集中化。\n"
- "# Writing tests for microservices\n\n- **This chapter covers**\n- Writing good\
  \ automated tests\n- Understanding the test pyramid and how it applies to microservices\n\
  - Testing microservices from the outside\n- Writing fast, in-process tests for endpoints\n\
  - Using `Microsoft.AspNetCore.TestHost` for integration and unit tests\n\n到目前为止，我们已经编写了一些微服务并在它们之间设置了协作。实现是好的，但我们还没有为它们编写任何测试。随着我们编写越来越多的微服务，如果没有良好的自动化测试，开发系统将变得难以管理。本章的前半部分，我将讨论你需要为每个单独的微服务测试什么。然后我们将深入代码，首先查看在隔离中测试端点，然后查看如何像从另一个微服务发送请求一样测试完整的微服务，但使用\
  \ `Microsoft.AspNetCore.TestHost` 库中的 `TestServer` 在进程内进行测试。\n\n\n\n\n\n## 8.1 如何以及测试什么\n\
  \n在第 1 章中，你看到了微服务具备的三种特性，使其非常适合持续交付：\n\n- *可单独部署*——只要对微服务进行了任何小的、安全的变化，就能将微服务部署到生产环境。但你如何知道一个变化是安全的？这就是测试以及特别是测试自动化发挥作用的地方。诸如代码评审、静态代码分析、以及为向后兼容设计公共\
  \ API 等其他活动，也有助于判断一个变化是否安全，但测试是你信心的主要来源。\n- *可替换*——你应该努力在正常的工作节奏中，用另一个功能等价的实现替换微服务的一个实现。同样，测试发挥着重要作用，因为一套良好的测试可以让你评估新的实现是否真的等同于旧的实现。\n\
  - *可由小团队维护*——微服务足够小且专注，以至于一个团队可以维护其中几个。一个优点是你能够编写覆盖微服务所有部分的测试。\n\n如果你想快速对变化充满信心，并能够替换实现糟糕的微服务，测试必须快速且可重复。为了使测试快速且可重复，你必须自动化其中很大一部分——这就是本章的重点。\n\
  \n### 8.1.1 测试金字塔：要在微服务系统中测试什么\n\n图 8.1 所示的 *测试金字塔* 是一个你可以用来指导应该编写哪些种类的测试以及每种应该有多少个的工具。你可以在不同的著作中找到测试金字塔的变体；它们都将测试放在不同的层级，其中金字塔顶部的层级范围较广，而底部的测试则较窄。测试金字塔说明你应该力求拥有许多\
  \ narrowly focused 的测试（金字塔宽阔底部上的那些）以及只有少数范围较广的测试（狭窄顶部上的那些）。\n\n![](img/608267d7803dc57a1a896ad121f37868_199_0.png)\n\
  \n我在这里使用的测试金字塔版本有三个层级：\n\n- *系统测试（顶层）*——跨越完整的微服务系统并且通常通过 GUI 实现的测试。\n- *服务测试（中间层）*——针对一个、且仅一个完整的微服务工作的测试。\n\
  - *单元测试（底层）*——测试微服务中一个小功能片段的测试。单元测试在进程中调用被测微服务的代码，通常只涉及微服务的一部分。\n\n请注意，当我使用 *单元测试*\
  \ 这个术语时，*单元* 指的是一个小功能片段。我定义单元测试的范围不是基于任何特定的代码构造，如类或方法，而是基于功能。当我们稍后查看单元测试的实现时，你会看到单元测试可以轻松跨越微服务的所有层，例如从\
  \ MVC 控制器，通过领域对象，或到数据访问类。\n\n尽管测试金字塔告诉你要随着层级的下降而拥有更多的测试，但在每个层级上应该有多少测试是情境性的。它取决于诸如系统规模、系统复杂性以及失败成本等因素。\n\
  \n### 8.1.2 系统级测试：端到端测试完整的微服务系统\n\n金字塔顶部的测试范围非常广，因此用很少的测试就能覆盖大量代码。由于范围如此广，它们也不精确。当系统级测试中断时，问题所在并不立即明确。该测试可能使用整个系统，因此问题可能在任何地方。\n\
  \n一个系统级测试的例子是使用我们在前面章节中谈到的 POS 系统的 Web UI 添加若干项到发票中，应用折扣码，并使用测试信用卡付款。如果该测试通过，它会让你确信发票会被创建，折扣可以被应用，并且你可以接收信用卡付款。在这样的系统测试期间，你可能会断言发票上的应付金额符合预期。如果该断言失败，任何数量的事情都可能导致问题：你可能对一项或多项商品使用了错误的价格，你可能错误地应用了折扣，或者你可能误解了发票数据。换句话说，这种失败可能由至少几台不同的微服务引起。要弄清楚哪个是罪魁祸首，你需要进行调查。\n\
  \n系统级测试失败的具体方式可以给出一些问题所在位置的提示，但通常有大量代码可能存在故障。仅从系统测试来看，甚至无法明确哪个微服务导致了失败。另一方面，当系统级测试通过时，它们会给你相当大的信心。\n\
  \n系统级测试的第二个缺点是它们往往很慢。这再次是它们涉及完整系统的另一面：会发出真实的 HTTP 请求，内容会写入真实的数据存储，并且会轮询真实的事件馈送。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_202_0.png)\n\n**图 8.2** 忠诚度计划微服务通过三种类型的协作与许多其他微服务协作：事件、查询和命令。\n\
  \n为了隔离测试忠诚度计划，你可以创建其协作者的模拟版本。如图 8.3 所示，当忠诚度计划与模拟的协作方交互时，它会得到硬编码的响应。\n\n![](img/608267d7803dc57a1a896ad121f37868_202_1.png)\n\
  \n**图 8.3** 对于服务级测试，忠诚度计划微服务与协作者的模拟版本交互。模拟的微服务对请求以硬编码响应进行响应。\n\n针对忠诚度计划微服务的服务级测试可以执行以下操作：\n\
  \n1. 发送创建用户的命令。\n2. 等待忠诚度计划微服务查询模拟的特价优惠微服务的事件，然后接收关于新特价优惠的硬编码事件。\n3. 记录发送到通知微服务的任何命令并断言已发送向新用户关于新特价优惠的通知命令。\n\
  \n当这样的测试通过时，你可以确信忠诚度计划微服务的重要方面是有效的。当它失败时，你知道问题出在忠诚度计划本身。\n\n服务级测试比系统级测试精确得多，因为它们只覆盖单个微服务：如果这样的测试失败，问题应该出在被测微服务内部，前提是测试设置本身没有错误。由于微服务很小——毕竟它们是可替换的——知道问题出在某个微服务内部，比系统级测试提供的要精确得多。\n\
  \n为了调用我们在 MVC 控制器中实现的端点，我们将使用 Microsoft.AspNetCore.TestHost 库。该库让你编写对 ASP.NET 端点进行内存调用的测试。这些调用以与\
  \ HTTP 请求完全相同的方式经过 ASP.NET，但不会经过网络栈。对我们控制器中的代码来说，通过 Microsoft.AspNetCore.Mvc.Testing\
  \ 中的 TestServer 发出的调用看起来与真实的 HTTP 请求完全一样。另一方面，服务级测试仍然相对较慢，因为微服务使用真实数据库，并且它通过 HTTP\
  \ 与其模拟的协作方交互。\n\n### 契约测试\n\n正如你现在所知，微服务系统中微服务之间存在大量协作。你将协作实现为一个微服务对另一个微服务的请求。如果你不小心，端点的更改可能会破坏调用该端点的微服务。这就是契约测试（https://martinfowler.com/bliki/ContractTest.html）发挥作用的地方。\n\
  \n当系统中的任意两个微服务协作时，发起请求的那个对另一个的行为有一些期望。也就是说，给定一种协作，调用微服务期望被调用微服务实现某个特定的契约。契约测试是一种旨在确定被调用微服务是否实现了调用微服务所期望的契约的测试。\n\
  \n契约测试是从调用者的角度编写的，并且是为了调用微服务的利益而存在：只要契约测试通过，调用者对契约所做的假设仍然有效。因此，契约测试是调用者代码库的一部分。它们不是被测试端点所在代码库的一部分。契约测试不应对它们所测试的微服务的实现方式有任何了解。这就是契约测试与服务级测试的不同之处。对于服务级测试，你通过为被测微服务提供其协作者的模拟来隔离它。你不希望对契约测试这样做，因为契约测试不应了解被测微服务的其他协作方。换句话说，契约测试在完整系统上运行。\n\
  \n由于契约测试是某个微服务的代码库的一部分但测试其他微服务中的内容，并且它们在完整系统上运行，将它们运行在 QA 或 staging 环境中会是一个好主意。此外，最好在每次被测微服务部署时自动运行它们。当契约被破坏时，这强烈表明契约测试所属的微服务与被测微服务之间的协作也被破坏了。\n\
  \n\n\n\n\n![](img/608267d7803dc57a1a896ad121f37868_204_0.png)\n\n契约测试会针对完整系统运行。例如，它可以针对预发布（staging）或\
  \ QA 环境运行，在这些环境中部署了完整的微服务系统。\n\n在实现方面，契约测试看起来有点像你将在本章后面编写的服务级测试。不同之处在于，契约测试在测试金字塔中的层级略高，位于系统级测试和服务级测试之间。契约测试不会设置模拟的协作对象，而服务级测试会；契约测试通过向被测微服务发起真实的\
  \ HTTP 请求来工作。\n\n关于服务级测试，我的建议是，你应该为被测微服务提供的所有功能的成功场景编写此类测试。这类测试自然要使用微服务的所有端点，并且依赖微服务中的任何事件订阅。换句话说，它们会覆盖微服务中所有的成功路径。一般来说，我只建议为最重要的失败场景编写服务级测试。再说一次，所需服务级测试的数量以及它们应该覆盖多少失败场景，取决于系统以及该特定系统中失败的代价。\n\
  \n## 8.1.4 单元级测试：从进程内测试端点\n\n测试金字塔底部的测试同样只涉及单个微服务，但它们并不针对整个微服务；它们使用由 Microsoft.AspNetCore.TestHost\
  \ 库中的 TestServer 创建的 HttpClient，直接在内存中与被测微服务的各个部分交互。\n\n在单元测试级别，我将向你展示两种测试（见图 8.4）：一种使用数据库，另一种使用模拟对象代替数据库。我认为这两种都是单元测试，即使第一种类型使用了数据库，无论它是功能完整的数据库还是内存数据库。有两件事使一个测试成为单元测试：它的范围是一小块功能，并且微服务中的测试代码和生产代码在同一进程中运行。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_204_1.png)\n\n图 8.4 在单元测试级别，有两种测试：使用数据库的测试和不使用数据库的测试。\n\
  \n单元测试的范围很窄，因此定位很精确：当它失败时，问题就出在少量代码中。窄范围也让你能够编写恰当覆盖失败场景的测试。两种类型的单元测试都比服务级测试更快，当然，模拟数据库的测试比使用数据库的测试更快。\n\
  \n有时，你可能还会编写更细粒度的单元测试，通过实例化领域对象并直接测试它们，从而直接测试微服务中的业务逻辑。对于最细粒度的单元测试应该细到什么程度，我采取务实的做法。我采用由外而内的测试优先工作流：先用\
  \ TestServer 调用微服务中的端点来编写测试。我从覆盖端点应完成的主要功能的测试开始，然后逐步添加更详细的测试。只有当通过端点处理程序来测试某个特定细节变得别扭时，我才开始编写更窄的单元测试。例如，要通过端点处理程序调用测试来覆盖业务逻辑中的某个特定情况，可能需要大量设置代码。这就是一个信号，表明应该转为范围更窄的测试——只覆盖业务逻辑中的那些情况。对于这些情况，我会编写直接针对实现该业务逻辑特定部分的代码的测试。\n\
  \n对于忠诚度计划微服务，我们需要单元测试来测试允许我们创建用户的端点，使用多种不同的输入，涵盖可能的有效和无效输入。同样，我们需要从允许我们读取用户的查询端点测试读取存在和不存在的用户。对于微服务中的其他端点，我们也需要类似的测试。忠诚度计划足够简单，我们不需要转向比微服务端点更窄的测试。因此，我稍后展示的单元测试都是通过\
  \ TestServer 调用端点处理程序来工作的。\n\n## 8.2 测试库：Microsoft.AspNetCore.TestHost 和 xUnit\n\
  \n在本章中，我们将使用两个新的库：\n\n- `Microsoft.AspNetCore.TestHost`\n- `xUnit`\n\n我将对这两个库做简要介绍，然后为我们在前面章节中编写的一些微服务实现测试。\n\
  \n### 8.2.1 认识 Microsoft.AspNetCore.TestHost\n\n`Microsoft.AspNetCore.TestHost`\
  \ 库是 ASP.NET 的配套库，可以方便地测试端点。借助它，我们可以像在生产代码中配置 Web 主机一样配置 TestHost。TestHost 使用 TestServer，后者可以创建测试用的\
  \ HttpClient 对象。由 TestServer 创建的 HttpClient 与我们在生产代码中使用的 HttpClient 相同。它允许我们使用 GetAsync、PostAsync、PutAsync\
  \ 和 DeleteAsync 等方法来分别调用控制器中的 GET、POST、PUT 和 DELETE 端点。这些调用会经过整个 ASP.NET 管道。这意味着依赖注入照常设置和使用，中间件（我们将在下一章讨论）照常运行，MVC\
  \ 过滤器照常运行，反序列化和序列化也照常运行。简而言之，对端点来说，这个调用看起来就是一个真实的 HTTP 请求，但它全部发生在进程内，因此比经过网络栈的真实\
  \ HTTP 请求要快得多。每个方法的返回值都是 HttpResponseMessage，就像我们通常从 HttpClient 得到的一样，我们可以像平常一样使用它，检查标头、状态和响应正文。\n\
  \n`Microsoft.AspNetCore.TestHost` 库会接入 ASP.NET 应用程序的正常配置中，因此，除了 TestServer 和 HttpClient\
  \ 之外，它使用 TestHost 创建的一切都与使用真实主机时相同。因此，我们可以进行所有通常的配置，包括但不限于：\n\n- 覆盖依赖注入容器中的注册，例如，用模拟对象代替真实对象\n\
  - 向 ASP.NET 管道添加特殊钩子\n- 配置日志记录，例如，允许测试检查日志消息的内容\n\n### 8.2.2 认识 xUnit\n\nxUnit（https://xunit.net/）是\
  \ .NET 的单元测试工具。它有一个库部分，允许你编写自动化测试，还有一个运行器部分，可以运行这些测试。要用 xUnit 编写测试，你需要创建一个带有 Fact\
  \ 特性的方法，并在其中编写执行测试的代码。xUnit 运行器会扫描带有 Fact 特性的方法并全部执行它们。此外，xUnit 还提供了在测试中进行断言的 API。如果断言失败，xUnit\
  \ 运行器会捕获失败并在测试运行完成后报告。xUnit 测试运行器可以通过 dotnet 运行，因此非常适合你在本书中构建的项目。\n\n还有其他与 xUnit\
  \ 类似的 .NET 单元测试工具，例如 NUnit，它们也适用于我们本章将做的所有工作，所以你可以随意选择自己喜欢的工具。\n\n### 8.2.3 xUnit\
  \ 与 Microsoft.AspNetCore.TestHost 协同工作\n\n将 Microsoft.AspNetCore.TestHost 和 xUnit\
  \ 结合起来，你就能为 MVC 控制器中实现的端点编写简洁的测试。在 8.3.1 节中，你将为此类单元测试建立一个项目，并用 dotnet 运行它们；但现在，我想让你先快速了解一下这些测试的样子。下面的测试调用了\
  \ TestController 中的 GET 端点，并断言响应状态码是“200 OK”。\n\n### 清单 8.1 使用 xUnit 和 Microsoft.AspNetCore.TestHost\
  \ 的简单控制器测试\n\n```\nnamespace LoyaltyProgramUnitTests\n{\n    using System;\n   \
  \ using System.Net;\n    using System.Net.Http;\n    using System.Threading.Tasks;\n\
  \    using Microsoft.AspNetCore.Builder;\n    using Microsoft.AspNetCore.Hosting;\n\
  \    using Microsoft.AspNetCore.Mvc;\n    using Microsoft.AspNetCore.TestHost;\n\
  \    using Microsoft.Extensions.Hosting;\n    using Xunit;\n```\n\n\n\npublic class\
  \ TestController_should : IDisposable\n{\n    private readonly IHost host;\n   \
  \ private readonly HttpClient sut;\n\n    public class TestController : ControllerBase\n\
  \    {\n        [HttpGet(\"/\")]\n        public OkResult Get() => Ok();\n    }\n\
  \n    public TestController_should()\n    {\n        this.host = new HostBuilder()\n\
  \            .ConfigureWebHost(host =>\n            {\n                host.ConfigureServices(x\
  \ =>\n                    x.AddControllersByType(typeof(TestController)))\n    \
  \            .Configure(x =>\n                {\n                    x.UseRouting()\n\
  \                    .UseEndpoints(opt => opt.MapControllers())\n              \
  \      .UseTestServer()\n                })\n                .Start();\n       \
  \     });\n        this.sut = this.host.GetTestClient();\n    }\n\n    [Fact]\n\
  \    public async Task respond_ok_to_request_to_root()\n    {\n        var actual\
  \ = await this.sut.GetAsync(\"/\");\n        Assert.Equal(HttpStatusCode.OK, actual.StatusCode);\n\
  \    }\n\n    public void Dispose()\n    {\n        this.host?.Dispose();\n    \
  \    this.sut?.Dispose();\n    }\n}\n\n![](img/608267d7803dc57a1a896ad121f37868_207_0.png)\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_207_1.png)\n\n![](img/608267d7803dc57a1a896ad121f37868_207_2.png)\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_207_3.png)\n\n![](img/608267d7803dc57a1a896ad121f37868_207_4.png)\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_207_5.png)\n\n![](img/608267d7803dc57a1a896ad121f37868_207_6.png)\n\
  \n关于这个测试，有几点需要注意：\n\n-   测试类 `TestController_should` 实现了 `IDisposable` 接口。xUnit\
  \ 运行器能识别 `IDisposable`，并在运行 Fact 之后调用 `Dispose` 方法。在 dispose 方法中，host 和 sut 会被释放，从而确保所有资源都被清理干净。如果\
  \ host 没有被释放，测试将一直挂起，直到测试运行器超时。\n-   在 `TestController_should` 构造函数中，我们像生产代码一样创建了一个\
  \ Web 主机。这正是我们可以针对被测端点配置一切的地方。在这个测试中，我们使用了与生产代码类似的设置，只不过我们使用了测试服务器，这可以确保请求在进程内完成。\n\
  \n在配置主机的过程中，我们使用了一个自定义扩展方法 `AddControllersByType`，我接下来会展示这个方法。通过使用 `AddControllersByType`，我们确保主机只拥有一个控制器：`TestController`。因此，该测试可以相当精确地控制主机上哪些端点可用。\n\
  \n## 命名约定\n\n我的测试遵循以下命名约定：\n\n-   我的测试针对一个名为 `sut`（即 *被测系统* system under test）的对象进行操作。在前面的测试中，`sut`\
  \ 是一个 `HttpClient` 对象，我用它来向端点发出调用。\n-   我根据被测对象来命名测试类——在这个示例测试中是 `TestController`——后面再加上\
  \ `_should`。\n-   我根据正在测试的场景和预期结果来命名 Fact 方法。我用下划线分隔 Fact 方法名称中的单词，并尽量确保它们与外围类名组合后能构成一个句子。例如，在这个测试中，将类名和\
  \ Fact 方法名拼接起来并把下划线替换为空格，就得到 “TestController should respond okay to requests to\
  \ root.”（TestController 应当对根路径的请求返回正常响应）。\n\n你是否喜欢这些约定纯属个人品味问题。我恰好喜欢它们，但它们对于编写好的测试绝非必需。\n\
  \n你可以使用 `dotnet test` 运行前面的测试；它会在内存中执行并给你良好的覆盖率，因为对 `sut.GetAsync(\"/\")` 的调用会执行真实的\
  \ ASP.NET 管道，包括 `TestController` 中端点的实现。字符串参数 “/” 是发出假请求的相对 URL。在 8.3.1 节中，我们将介绍如何为这些单元测试建立项目，以及如何用\
  \ `dotnet test` 运行它们。\n\n在 `TestController_should` 构造函数中，我们使用了自定义扩展方法 `AddControllersByType`，它的原理是覆盖\
  \ MVC 决定哪些类型是控制器的方式。这是通过创建 MVC 的 `ControllerFeatureProvider` 的自定义版本，并用自定义版本替换 MVC\
  \ 默认的 `ControllerFeatureProvider` 来实现的。MVC 使用 `ControllerFeatureProvider` 来决定哪些类型是控制器，因此，用自定义版本覆盖它后，我们就可以决定\
  \ MVC 将哪些类型视为控制器，从而决定哪些端点属于测试范围。下面的清单展示了其实现，其中第一部分是自定义的 `ControllerFeatureProvider`，第二部分是扩展方法。\n\
  \n清单 8.2 控制哪些控制器属于测试范围的扩展方法\n\nnamespace LoyaltyProgramUnitTests\n{\n    using System;\n\
  \    using System.Linq;\n    using System.Reflection;\n    using Microsoft.AspNetCore.Mvc.Controllers;\n\
  \    using Microsoft.Extensions.DependencyInjection;\n\n    public class FixedControllerProvider\
  \ : ControllerFeatureProvider\n    {\n        private readonly Type[] controllerTypes;\n\
  \n        public FixedControllerProvider(params Type[] controllerTypes)\n      \
  \  {\n            this.controllerTypes = controllerTypes;\n        }\n\n       \
  \ protected override bool IsController(TypeInfo typeInfo)\n        {\n         \
  \   return this.controllerTypes.Contains(typeInfo);\n        }\n    }\n\n    public\
  \ static class MvcBuilderExtensions\n    {\n        public static IMvcBuilder AddControllersByType(\n\
  \            this IServiceCollection services,\n            params Type[] controllerTypes)\n\
  \            =>\n            services\n                .AddControllers()\n     \
  \           .ConfigureApplicationPartManager(mgr =>\n                {\n       \
  \             mgr.FeatureProviders.Remove(\n                        mgr.FeatureProviders.First(f\
  \ =>\n                            f is ControllerFeatureProvider));\n          \
  \          mgr.FeatureProviders.Add(\n                        new FixedControllerProvider(controllerTypes));\n\
  \                });\n    }\n}\n\n-   控制器提供程序的自定义实现\n-   覆盖用于识别控制器的方法。\n-   扩展方法\n\
  -   让服务集合感知控制器。\n-   访问功能提供程序。\n-   移除默认的控制器提供程序功能。\n-   添加自定义的控制器提供程序功能。\n\n我们也会在后面的测试中使用这个扩展，把它作为控制测试范围的便捷方式。\n\
  \n在本章剩余部分中，我们将在代码层面工作，为忠诚度计划微服务实现单元测试和服务级测试。当你在第 5 章实现忠诚度计划时，它并没有事件提要，但对于这些示例，你将添加一个可供其他微服务订阅的事件提要。\n\
  \n## 8.3 使用 Microsoft.AspNetCore.TestHost 编写单元测试\n\n在本节中，你将为实现忠诚度计划微服务中的端点编写一些单元测试。在第\
  \ 5 章中，你看到忠诚度计划有三个命令和查询端点：\n\n-   一个 HTTP GET 端点，URL 形式为 “/users/{userId}”，返回用户的表示形式。\n\
  -   一个 HTTP POST 端点，指向 “/users/”，它期望请求正文中包含用户的表示形式，然后将该用户注册到忠诚度计划中。\n-   一个 HTTP\
  \ PUT 端点，URL 形式为 “/users/{userId}”，它期望请求正文中包含用户的表示形式，然后更新一个已注册的用户。\n\n让我们为这些端点编写测试。忠诚度计划微服务还有一个事件提要，你也将为其编写一个测试。你不会为忠诚度计划中的端点和事件提要编写全面的测试——只需足以了解如何针对\
  \ MVC 端点编写测试即可。在以下小节中，你将完成以下工作：\n\n-   建立一个测试项目，用于存放忠诚度计划微服务的单元测试。\n-   编写使用 Microsoft.AspNetCore.TestHost\
  \ 来测试忠诚度计划中端点的测试，并让微服务中的代码使用真实数据库。你将编写三个这样的测试，分别针对以下三项功能：\n    -   一个尝试读取不存在用户的测试。\n\
  \    -   一个创建用户并读回该用户的测试。\n    -   一个修改用户并读回该用户的测试。\n-   编写同样使用 Microsoft.AspNetCore.TestHost\
  \ 来测试某个端点、但通过在被测端点中注入模拟数据库来限制范围的测试。这些测试将测试微服务中的事件提要。\n\n完成后，你将学会如何针对 MVC 端点编写单元测试——既包括带真实数据库的情况，也包括不带真实数据库的情况。\n\

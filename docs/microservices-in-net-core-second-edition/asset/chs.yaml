  \ 端点可以正常工作并返回包含三个硬编码产品的产品列表视图。\n\n此代码渲染了产品列表，但产品是硬编码在 API 网关中的。它们应该从产品目录微服务获取。为此，修改\
  \ ProductListController 中的 /productlist 端点以向产品目录发出 HTTP 请求获取产品列表。为此需要一个 HttpClient，因此首先我们在\

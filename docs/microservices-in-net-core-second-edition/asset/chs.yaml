  \ 表中创建一行。\n\n> 删除所有预先存在的购物车项目\n\n> 添加当前的购物车项目\n\n到系统——用户做了一些在业务上很有趣的事情——而后者则报告技术细节——一段软件做了某事，因为程序员决定那样实现它。事件应该在微服务实现的功能的抽象级别上具有重要意义，并且它们通常涵盖对底层数据库的多次更新。事件应对应业务级事务，而不是数据库事务。\n\
  \n每当微服务中的领域逻辑引发事件时，它都会存储到微服务中的数据库。在图 6.8 中，这是通过 EventStore 组件完成的，该组件负责与存储事件的数据库对话。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_167_0.png)\n\n图 6.8 当领域模型引发事件时，EventStore\
  \ 组件代码必须将其写入数据库。\n\n以下两个部分展示了 EventStore 组件的两种实现。第一种手动将事件存储到 SQL 数据库中的表中，第二种使用开源的\
  \ EventStoreDB。\n\n## 手动存储事件\n\n在这里，你将在购物车微服务中构建 EventStore 组件的实现，该实现将事件存储到 SQL\
  \ Server 中的表中。EventStore 组件负责向该数据库写入事件并从中读取事件。\n\n实现 EventStore 组件涉及以下步骤：\n\n- 1.\
  \ 在 ShoppingCart 数据库中添加一个 EventStore 表。该表将包含领域模型引发的每个事件的一行。\n- 2. 使用 Dapper 实现 EventStore\
  \ 组件的写入部分。\n- 3. 使用 Dapper 实现 EventStore 组件的读取部分。\n\n在深入实现 EventStore 组件之前，这里提醒一下购物车中\
  \ Event 类型的样子。\n\n## Listing 6.3  ShoppingCart 微服务中的 Event 类型\n\n```\npublic record\
  \ Event(\n    long SequenceNumber,\n    DateTimeOffset OccuredAt,\n    string Name,\n\
  \    object Content);\n```\n\n这是你将在 ShoppingCart 数据库中存储的事件类型。第一步是进入 ShoppingCart\
  \ 数据库并添加如图 6.9 所示的表。代码下载中文件 `Chapter06\\ShoppingCart\\database-scripts\\create-shopping-cart-db.sql`\
  \ 中的数据库脚本创建了此表以及 ShoppingCart 数据库中的另外两个表。\n\n| EventStore |  |\n|---|---|\n| **PK**\
  \ | **ID** |\n|  | Name |\n|  | OccuredAt |\n|  | Content |\n\n**图 6.9**  **EventStore**\
  \ 表有四列用于这些类别：事件 ID、事件名称、事件发生时间以及事件内容。\n\n接下来，将名为 EventStore.cs 的文件添加到购物车中，并向其中添加以下用于写入事件的代码。\n\
  \n```\n```csharp\nnamespace ShoppingCart.EventFeed\n{\n    using System;\n    using\
  \ System.Collections.Generic;\n    using System.Data.SqlClient;\n    using System.Text.Json;\n\
  \    using System.Threading.Tasks;\n    using Dapper;\n\n    public interface IEventStore\n\
  \    {\n        Task<IEnumerable<Event>> GetEvents(long firstEventSequenceNumber,\n\
  \            long lastEventSequenceNumber);\n        Task Raise(string eventName,\
  \ object content);\n    }\n\n    public class EventStore : IEventStore\n    {\n\
  \        private string connectionString =\n            @\"Data Source=localhost;Initial\
  \ Catalog=ShoppingCart;\nUser Id=SA; Password=yourStrong(!)Password\";\n\n     \
  \   private const string writeEventSql =\n            @\"insert into EventStore(Name,\
  \ OccuredAt, Content)\nvalues (@Name, @OccuredAt, @Content)\";\n\n        public\
  \ async Task Raise(string eventName, object content)\n        {\n            var\
  \ jsonContent = JsonSerializer.Serialize(content);\n```\n\n\n\n\n```csharp\nawait\
  \ using var conn = new SqlConnection(this.connectionString);\nawait conn.ExecuteAsync(\n\
  \    writeEventSql,\n    new\n    {\n        Name = eventName,\n        OccurredAt\
  \ = DateTimeOffset.Now,\n        Content = jsonContent\n    });\n}\n```\n\n这段代码无法编译，因为\
  \ EventStore 接口还有另一个方法，用于读取事件。读取部分的实现如下所示。\n\n### Listing 6.5 EventStore 用于读取事件的方法\n\
  \n```csharp\nprivate const string readEventsSql =\n    @\"select * from EventStore\
  \ where ID >= @Start and ID <= @End\";\n\npublic async Task<IEnumerable<Event>>\
  \ GetEvents(\n    long firstEventSequenceNumber,\n    long lastEventSequenceNumber)\n\
  {\n    await using var conn = new SqlConnection(this.connectionString);\n    return\
  \ await conn.QueryAsync<Event>(\n        readEventsSql,\n        new\n        {\n\
  \            Start = firstEventSequenceNumber,\n            End = lastEventSequenceNumber\n\
  \        });\n}\n```\n\n> **NOTE** 存储事件本质上相当于在 EventStore 表的一行中存储事件内容的 JSON 序列化结果，同时附带事件的\
  \ ID、事件名称以及事件触发的时间。存储事件并通过事件 feed 发布它们的概念可能是新的，但实现起来相当简单。\n\n这就是实现一个基本事件存储所需的一切。购物车微服务现在可以在领域模型中触发事件，并依赖\
  \ EventStore 组件将其写入 ShoppingCart 数据库中的 EventStore 表。此外，购物车有一个事件 feed，你在第 2 章中实现了它，现在它使用\
  \ EventStore 组件从数据库读取事件。当订阅者轮询 feed 时，它会将事件发送给事件订阅者。\n\n这个事件存储实现非常基础，并不适用于所有生产用例。例如，当微服务开始从多个并发线程触发事件时，尤其是在高负载下，它可能会遇到锁竞争问题。然而，这个示例确实展示了存储事件的含义。\n\
  \n> **NOTE** 有多个高质量的开源项目在关系型数据库之上实现了事件存储，包括 SqlStreamStore (https://sqlstreamstore.readthedocs.io)\
  \ 和 Marten (https://marten.db.io/)。\n\n## STORING EVENTS USING THE EVENTSTOREDB\
  \ SYSTEM\n\n你现在将在购物车微服务中实现 EventStore 组件的另一个版本，这次使用开源的 EventStoreDB。与在 SQL Server\
  \ 中存储事件相比，使用 EventStoreDB 的优势在于其 API 专为存储事件、读取事件和订阅新事件而设计。EventStoreDB 是一个开源的、成熟的、经过充分测试的事件存储数据库，可以在负载下扩展并稳定运行。此外，它开箱即带了一些附加功能，例如用于检查事件的\
  \ Web 界面和 Atom 事件 feed。当然，SQL Server 也是成熟的、经过充分测试的、可扩展且稳定的，但它并非专门针对存储事件而设计。\n\n\
  你将通过以下步骤实现此版本。完成后，你将在购物车微服务中基于 EventStoreDB 拥有一个完全可用的 EventStore 组件实现：\n\n1. 在 Docker\
  \ 容器中运行 EventStoreDB。\n2. 通过 EventStore 组件将事件写入 EventStoreDB。\n3. 通过 EventStore\
  \ 组件从 EventStoreDB 读取事件。\n\n> **NOTE** 你可以在 https://eventstore.com/ 了解更多关于 EventStoreDB\
  \ 的信息，远不止本章所涵盖的内容。\n\n你可以用以下命令拉取 EventStoreDB Docker 镜像：\n\n```bash\ndocker pull\
  \ eventstore/eventstore\n```\n\n拉取后，你可以这样运行 EventStoreDB 容器：\n\n```bash\ndocker\
  \ run --name eventstore-node -it -p 2113:2113 -p 1113:1113 --rm eventstore/eventstore:latest\
  \ --run-projections All --enable-external-tcp --enable-atom-pub-over-http\n```\n\
  \n> **NOTE** 如果你在 localhost 上运行 EventStoreDB 容器时收到错误 “TLS is enabled on at least\
  \ one TCP/HTTP interface—a certificate is required to run EventStoreDB”，你可以向 Docker\
  \ run 命令添加 `--insecure` 开关。这会移除 TLS 提供的<|message|> 安全，不应在生产环境中使用。\n\n你可以通过访问 http://127.0.0.1:2113/\
  \ 来检查 EventStoreDB 是否正在运行。你应该会看到一个登录提示，允许你使用用户名 “admin” 和密码 “changeit” 登录。\n\n为了从购物车微服务代码中使用\
  \ EventStoreDB，你首先需要将 EventStore.Client NuGet 包添加到项目中。安装后，你就可以针对 EventStoreDB 实现\
  \ EventStore 组件。以下列表显示了写入事件的代码。\n\n### Listing 6.6 Storing events to the EventStoreDB\n\
  \n```csharp\nnamespace ShoppingCart.EventFeed\n{\n    using System;\n    using System.Collections.Generic;\n\
  \    using System.Linq;\n    using System.Text;\n    using System.Text.Json;\n \
  \   using System.Threading.Tasks;\n    using EventStore.ClientAPI;\n\n    public\
  \ class EsEventStore : IEventStore\n    {\n        private const string ConnectionString\
  \ =\n            \"tcp://admin:changeit@localhost:1113\";\n\n        public async\
  \ Task Raise(string eventName, object content)\n        {\n            using var\
  \ connection =\n                EventStoreConnection.Create(\n                 \
  \   ConnectionSettings.Create().DisableTls().Build(),\n                    new Uri(ConnectionString));\n\
  \            await connection.ConnectAsync();\n            await connection.AppendToStreamAsync(\n\
  \                \"ShoppingCart\",\n                ExpectedVersion.Any,\n     \
  \           new EventData(\n                    Guid.NewGuid(),\n              \
  \      \"ShoppingCartEvent\",\n                    isJson: true,\n             \
  \       data: Encoding.UTF8.GetBytes(\n                        JsonSerializer.Serialize(content)),\n\
  \                    metadata: Encoding.UTF8.GetBytes(\n                       \
  \ JsonSerializer.Serialize(new EventMetadata\n                        {\n      \
  \                      OccurredAt = DateTimeOffset.UtcNow,\n                   \
  \         EventName = eventName\n                        }))));\n        }\n\n \
  \       public record EventMetadata(\n            DateTimeOffset OccurredAt,\n \
  \           string EventName);\n    }\n}\n```\n\n此代码将购物车微服务自己的 Event 类型映射到 EventStoreDB\
  \ 的 EventData 类型，然后将其存储到 EventStoreDB。读取事件的实现如下所示。\n\n### Listing 6.7 Reading events\
  \ from the EventStoreDB\n\n```csharp\npublic async Task<IEnumerable<Event>>\nGetEvents(long\
  \ firstEventSequenceNumber, long lastEventSequenceNumber)\n{\n    using var connection\
  \ =\n        EventStoreConnection.Create(\n            ConnectionSettings.Create().DisableTls().Build(),\n\
  \            new Uri(ConnectionString));\n    await connection.ConnectAsync();\n\
  \    var result = await connection.ReadStreamEventsForwardAsync(\n        \"ShoppingCart\"\
  ,\n        start: firstEventSequenceNumber,\n        count: (int)(lastEventSequenceNumber\
  \ - firstEventSequenceNumber),\n        resolveLinkTos: false);\n    return result.Events\n\
  \        .Select(e =>\n            new\n            {\n                Content =\
  \ Encoding.UTF8.GetString(e.Event.Data),\n                Metadata = JsonSerializer.Deserialize<EventMetadata>(\n\
  \                    Encoding.UTF8.GetString(e.Event.Metadata),\n              \
  \      new JsonSerializerOptions\n                    {\n                      \
  \  PropertyNameCaseInsensitive = true\n                    })!\n            })\n\
  \        .Select((e, i) =>\n            new Event(\n                i + firstEventSequenceNumber,\n\
  \                e.Metadata.OccurredAt,\n                e.Metadata.EventName,\n\
  \                e.Content));\n}\n```\n\n- 从 EventStoreDB 读取事件\n- 访问来自 EventStoreDB\
  \ 的结果中的事件\n- 获取每个事件的内容部分\n- 获取每个事件的元数据部分\n- 将事件映射为来自 EventStoreDB Event 对象的事件\n\n\
  此代码从 EventStoreDB 读取事件，反序列化事件的内容和元数据部分，然后将它们映射回购物车微服务自己的 Event 类型。\n\n这完成了基于 EventStoreDB\
  \ 的 EventStore 组件的实现。让我们现在来看使用缓存。\n\n## 6.3.4 Setting cache headers in HTTP responses\n\
  \n让我们再次考虑图 6.2 中的微服务。购物车微服务使用通过查询产品目录微服务获得的产品信息；你在第 2 章中实现了购物车微服务在该协作中的部分。在这里，你将首先在实现端点的代码中设置缓存头\n\
  \n\n\n产品目录。然后，你将重写购物车中调用产品目录的代码，以读取并使用缓存头。\n\n假设产品目录微服务中的 `/products` 端点实现在名为 `ProductCatalogController`\
  \ 的 MVC 控制器中。你将以查询参数的形式接收一个以逗号分隔的产品 ID 列表。该端点返回由该产品 ID 列表标识的每个产品的产品信息。实现方式与本书中你已见过的\
  \ MVC 控制器类似。新的部分是，你将使用 `ResponseCache` 属性向响应添加一个缓存控制头，允许客户端缓存响应 24 小时。\n\n```\n\
  namespace ProductCatalog\n{\n    using System.Collections.Generic;\n    using System.Linq;\n\

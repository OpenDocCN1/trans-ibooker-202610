  \ =>\n            this.productStore = productStore;\n\n        [HttpGet(\"\")]\n\
  \        [ResponseCache(Duration = 86400)]\n        public IEnumerable<ProductCatalogProduct>\
  \ Get(\n            [FromQuery] string productIds)\n        {\n            var products\
  \ = this.productStore.GetProductsByIds(\n                ParseProductIdsFromQueryString(productIds));\n\
  \            return products;\n        }\n\n        private static IEnumerable<int>\n\
  \            ParseProductIdsFromQueryString(string productIdsString) => ...\n  \
  \  }\n}\n```\n\n### Listing 6.8  为产品列表添加缓存头\n\n> 添加一个缓存控制头，其中 max-age 以秒为单位\n\n\
  此实现向响应添加了一个缓存控制头，看起来像这样：\n\n```\ncache-control: public,max-age:86400\n```\n\n该头告诉调用者响应可以被缓存的时间长度由\
  \ max-age 指示，max-age 以秒为单位。在本例中，调用者可以缓存响应 86,400 秒（24 小时）。\n\n### 6.3.5  读取和使用缓存头\n\
  \n在第 2 章中，你看到购物车微服务从 `/products` 端点发出调用的代码。代码如下；它是 `ProductCatalogClient` 类的一部分。\n\
  \n### Listing 6.9  调用产品目录微服务\n\n```\nprivate async Task<HttpResponseMessage>\n \
  \   RequestProductFromProductCatalog(int[] productCatalogIds)\n{\n    var productsResource\
  \ = string.Format(getProductPathTemplate,\n        string.Join(\",\", productCatalogIds));\n\
  \    return await\n        this.client.GetAsync(productsResource);\n}\n```\n\n使用此代码，每当购物车需要产品信息时都会发出一次\
  \ HTTP 请求，而不管任何缓存头。这在购物车在 24 小时内多次需要同一产品的相关信息时效率低下，因为这是产品目录微服务响应中设置的 max-age 值。这种情况每次都会发生，当用户向其购物车添加商品，而另一用户在之前的\
  \ 24 小时内也将其添加到购物车时。这很可能会经常发生。\n\n让我们扩展对产品目录中 `/products` 端点发出调用的代码，使其考虑缓存头。为 `ProductCatalogClient`\
  \ 添加对实现 `ICache` 接口的缓存的依赖：\n\n```\nprivate readonly HttpClient client;\nprivate\
  \ readonly ICache cache;\nprivate static string productCatalogueBaseUrl = @\"https://git.io/JeHiE\"\
  ;\nprivate static string getProductPathTemplate = \"?productIds=[{0}]\";\n\npublic\
  \ ProductCatalogClient(HttpClient client, ICache cache)\n{\n    client.BaseAddress\
  \ = new Uri(productCatalogueBaseUrl);\n    client.DefaultRequestHeaders.Accept.Add(\n\
  \        new MediaTypeWithQualityHeaderValue(\"application/json\"));\n    this.client\
  \ = client;\n    this.cache = cache;\n}\n```\n\n正如你所回忆的，ASP.NET 会为你处理依赖注入，因此只要在\
  \ `IServiceCollection` 中注册了 `ICache` 接口的实现，ASP.NET 就会注入它。在这里，我只展示接口，但在代码下载中，你可以找到一个实现该接口的简单静态缓存。接口很简单，有两个方法：\n\
  \n```\npublic interface ICache\n{\n    void Add(string key, object value, TimeSpan\
  \ ttl);\n    object Get(string key);\n}\n```\n\nttl 表示生存时间。\n\n你将在 `ProductCatalogClient`\
  \ 上使用缓存变量，在发出 HTTP 请求之前检查缓存中是否存在有效对象。\n\nstyle 而不是基于查询的方式。记住第 5 章中基于事件的协作是优选的，因为耦合度降低。\n\
  \n- 微服务使用哪个数据库或数据库是该微服务特有的设计决策。不同的微服务可以使用不同的数据库。\n- 存储微服务拥有的数据类似于在其他类型的系统中存储数据。\n\
  - 你可以使用 Dapper 从 SQL 数据库读取数据并向其写入数据。\n- 存储事件本质上是将序列化事件存储到数据库中。\n- 事件存储的简单版本涉及将事件存储到\

  :{\"currency\":\"eur\",\"amount\":50}}]}\n```\n\n我们原样复制。\n\n注意原文中“Listing 9.8”后面的代码块是C#，我们原样复制。\n\
  \n注意原文中“Listing 9.9”后面的代码块是C#，我们原样复制。\n\n注意原文中“The JSON-formatted log messages created\
  \ when we start the shopping cart microservice in production look like this:”后面的代码块是JSON，我们原样复制。\n\
  \n一切就绪。\n\n现在输出。[content]\n```csharp\nusing Serilog.Enrichers.Span;\nusing Serilog.Formatting.Json;\n\
  \npublic class Program\n{\n    public static void Main(string[] args)\n    {\n \

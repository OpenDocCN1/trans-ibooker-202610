  \n```\nPS > dotnet run\n2020-12-03 10:24:34 INF Now listening on: \"https://localhost:5001\"\
  \n2020-12-03 10:24:34 INF Now listening on: \"http://localhost:5000\"\n2020-12-03\
  \ 10:24:34 INF Application started. Press Ctrl+C to shut down.\n2020-12-03 10:24:34\
  \ INF Hosting environment: \"Development\"\n2020-12-03 10:24:34 INF Content root\
  \ path: \"C:\\\\Users\\\\chors\\\\Documents\\\\horsdal3\\\\code\\\\Chapter10\\\\\
  ShoppingCart\"\n```\n\n这并不特别令人兴奋，但如果我们从购物车中的某个控制器记录一些内容，就能开始看到它的价值。为此，我们可以在 `ShoppingCartController`\
  \ 中依赖 `ILogger`，并在某个操作方法中使用该日志记录器。.NET 已经将 `ILogger` 注册到服务集合中，因此它会像其他依赖一样被注入到 `ShoppingCartController`\
  \ 中。要建立依赖，我们只需将 `ILogger` 作为构造函数的一个参数添加，如下所示。\n\n**清单9.5 依赖 ILogger 以便从控制器记录日志**\n\
  \n```csharp\npublic ShoppingCartController(\n    IShoppingCartStore shoppingCartStore,\n\
  \    IProductCatalogClient productCatalog,\n    IEventStore eventStore,\n    ILogger<ShoppingCartController>\
  \ logger)\n{\n    this.shoppingCartStore = shoppingCartStore;\n    this.productCatalog\
  \ = productCatalog;\n    this.eventStore = eventStore;\n    this.logger = logger;\n\
  }\n```\n\n然后，该日志记录器就可以用于例如向购物车添加商品的操作端点，你可以在下面的清单中看到。\n\n**清单9.6 在控制器日志中包含结构化信息**\n\
  \n```csharp\n[HttpPost(\"{userId:int}/items\")]\npublic async Task<ShoppingCart>\
  \ Post(int userId, [FromBody] int[] productIds)\n{\n    var shoppingCart = await\
  \ shoppingCartStore.Get(userId);\n    var shoppingCartItems = await this.productCatalog.GetShoppingCartItems(productIds);\n\
  \    await shoppingCart.AddItems(shoppingCartItems, this.eventStore);\n    await\
  \ this.shoppingCartStore.Save(shoppingCart);\n\n    this.logger.LogInformation(\n\
  \        \"Successfully added products to shopping cart {@productIds}, {@shoppingCart}\"\
  , productIds, shoppingCart);\n\n    return shoppingCart;\n}\n```\n\n记录一条结构化消息。\n\
  \n如果我们现在发起一个 HTTP POST 请求来向购物车添加商品，我们将在控制台中看到如下一条日志消息。\n\n**清单9.7 包含购物车的结构化日志消息**\n\
  \n```\n2020-12-03 11:37:08 INF Successfully added products to shopping cart [1,\
  \ 2], {\"userId\":123,\"items\":[{\"productCatalogueId\":1,\"productName\":\"Basic\
  \ t-shirt\",\"description\":\"a quiet t-shirt\",\"price\":{\"currency\":\"eur\"\
  ,\"amount\":40}},{ \"productCatalogueId\":2,\"productName\":\"Fancy shirt\",\"description\"\
  :\"a loud t-shirt\",\"price\":{\"currency\":\"eur\",\"amount\":50}}]}\n```\n\n这条日志消息将整个购物车以\
  \ JSON 形式包含在内，相比简单的“成功将商品添加到购物车”消息，它为消息提供了更多上下文。这就是结构化日志的优势。\n\n最后一步，我们需要让日志消息在日志传输管道中更易于消费。为此，我们将它们格式化为\
  \ JSON 日志。不过，这会让消息对人类阅读变得有点困难，因此我倾向于在开发环境中使用我们目前看到的输出，而在生产环境中使用 JSON 输出，如下面的清单所示。这是通过告诉\
  \ Serilog 在环境不是“development”时将控制台输出格式化为 JSON 来实现的。\n\n**清单9.8 在生产环境中使用 JSON 日志**\n\
  \n```csharp\nprivate static IHostBuilder CreateHostBuilder(string[] args) =>\n \
  \   Host.CreateDefaultBuilder(args)\n        .UseSerilog((context, logger) =>\n\
  \        {\n            logger\n                .Enrich.FromLogContext();\n    \
  \        if (context.HostingEnvironment.IsDevelopment())\n                logger.WriteTo.ColoredConsole();\n\
  \            else\n                logger.WriteTo.Console(new JsonFormatter());\n\
  \        })\n        .ConfigureWebHostDefaults(x => x.UseStartup<Startup>());\n\
  ```\n\n> **注意** 环境由环境变量 `ASPNETCORE_ENVIRONMENT` 控制。\n\n当我们在生产环境中启动购物车微服务时，生成的 JSON\
  \ 格式日志消息如下所示：\n\n```json\n{\"Timestamp\":\"2020-12-03T12:00:41.5723302+01:00\",\"\
  Level\":\"Information\",\"MessageTemplate\":\"Now listening on: {address}\",\"Properties\"\
  :{\"address\":\"https://localhost:5001\",\"SourceContext\":\"Microsoft.Hosting.Lifetime\"\
  }}\n{\"Timestamp\":\"2020-12-03T12:00:41.5803748+01:00\",\"Level\":\"Information\"\
  ,\"MessageTemplate\":\"Now listening on: {address}\",\"Properties\":{\"address\"\
  :\"http://localhost:5000\",\"SourceContext\":\"Microsoft.Hosting.Lifetime\"}}\n\
  {\"Timestamp\":\"2020-12-03T12:00:41.5809434+01:00\",\"Level\":\"Information\",\"\
  MessageTemplate\":\"Application started. Press Ctrl+C to shut down.\",\"Properties\"\
  :{\"SourceContext\":\"Microsoft.Hosting.Lifetime\"}}\n{\"Timestamp\":\"2020-12-03T12:00:41.5812286+01:00\"\
  ,\"Level\":\"Information\",\"MessageTemplate\":\"Hosting environment: {envName}\"\
  ,\"Properties\":{\"envName\":\"Production\",\"SourceContext\":\"Microsoft.Hosting.Lifetime\"\
  }}\n{\"Timestamp\":\"2020-12-03T12:00:41.5815246+01:00\",\"Level\":\"Information\"\
  ,\"MessageTemplate\":\"Content root path: {contentRoot}\",\"Properties\":{\"contentRoot\"\
  :\"C:\\\\Users\\\\chors\\\\Documents\\\\horsdal3\\\\code\\\\Chapter10\\\\ShoppingCart\"\
  ,\"SourceContext\":\"Microsoft.Hosting.Lifetime\"}}\n```\n\n既然你已经配置了结构化日志消息，接下来让我们用跟踪信息来丰富它们。\n\
  \n### 9.4.1 向所有日志消息添加跟踪 ID\n\n回顾第7章以及本章前面的内容，如果你能利用日志消息来追踪用户请求在微服务系统中的流转，那么这些日志消息会更有价值。用户请求可能不是由单个微服务处理的。通常，多个微服务会协作完成用户请求。能够跨所有这些协作微服务追踪用户请求是非常有用的——这正是跟踪\
  \ ID 所能提供的。如前所述，ASP.NET 实现了跟踪上下文标准，因此 ASP.NET 已经为所有请求分配了跟踪 ID。跟踪 ID 要么从 `traceparent`\
  \ 头中读取，要么——如果请求上没有 `traceparent` 头——则分配一个随机的跟踪 ID。ASP.NET 将跟踪 ID 和其他跟踪信息存储在 `System.Diagnostics.Activity`\
  \ 类型中，可以通过 `Activity.Current` 属性访问。我们只需将跟踪 ID 添加到每条日志消息中。我们将使用一个名为 `Serilog.Enrichers.Span`\
  \ 的便捷包，它与 Serilog 配合使用即可实现这一点。首先，我们将安装 `Serilog.Enrichers.Span`，然后稍微修改 Serilog 的配置，使其如下所示。\n\
  \n**清单9.9 配置 Serilog 以在所有日志消息中包含跟踪信息**\n\n```csharp\nprivate static IHostBuilder\
  \ CreateHostBuilder(string[] args) =>\n    Host.CreateDefaultBuilder(args)\n   \
  \     .UseSerilog((context, logger) =>\n        {\n            logger\n        \
  \        .Enrich.FromLogContext()\n                .Enrich.WithSpan();\n       \
  \     if (context.HostingEnvironment.IsDevelopment())\n                logger.WriteTo.ColoredConsole(\n\
  \                    outputTemplate: @\"{Timestamp:yyyy-MM-dd HH:mm:ss}\\n{TraceId}\
  \ {Level:u3} {Message}{NewLine}{Exception}\"\n                );\n            else\n\
  \                logger.WriteTo.Console(new JsonFormatter());\n        })\n    \
  \    .ConfigureWebHostDefaults(x => x.UseStartup<Startup>());\n```\n\n上一个清单中重要的新增部分是\
  \ `.Enrich.WithSpan();` 这一行，它配置 Serilog 从 `Activity.Current` 读取跟踪信息并将其添加到每条日志消息中。在生产环境使用的\
  \ JSON 输出中，默认会包含日志消息上的所有信息。在开发环境使用的文本输出中，我们需要覆盖默认输出格式以添加跟踪 ID，这可以通过向日志记录器配置传入包含跟踪\
  \ ID 的输出格式来实现。\n\n现在运行购物车微服务并向其发出请求，会产生带有跟踪信息的日志消息。在开发环境中，看起来像这样：\n\n```\n2020-12-07\
  \ 11:10:39 f2e604d90da6114a8d4a77daa57a7890 INF Request starting\n    HTTP/1.1 POST\
  \ https://localhost:5001/users/0/items application/json 9\n2020-12-07 11:10:39 f2e604d90da6114a8d4a77daa57a7890\
  \ INF Executing endpoint\n    \"ShoppingCart.Users.UsersController.Post (ShoppingCart)\"\
  \n2020-12-07 11:10:39 f2e604d90da6114a8d4a77daa57a7890 INF Route matched with\n\
  \    \"{action = \\\"Post\\\", controller = \\\"Users\\\"}\". Executing controller\
  \ action\n    with signature \"Task<ShoppingCart> Post(Int32, Int32[])\" on controller\n\
  \    \"ShoppingCart.Users.UsersController\" (\"ShoppingCart\").\n2020-12-07 11:10:39\
  \ f2e604d90da6114a8d4a77daa57a7890 INF Successfully added\n    products to shopping\
  \ cart [1, 2], {\"userId\":123,\"items\":[{\n    \"productCatalogueId\":1,\"productName\"\
  :\"Basic t-shirt\",\"description\":\n    \"a quiet t-shirt\",\"price\":{\"currency\"\
  :\"eur\",\"amount\":40}},\n    {\"productCatalogueId\":2,\"productName\":\"Fancy\
  \ shirt\",\"description\":\n    \"a loud t-shirt\",\"price\":{\"currency\":\"eur\"\
  ,\"amount\":50}}]}\n2020-12-07 11:10:39 f2e604d90da6114a8d4a77daa57a7890 INF Executed\
  \ action\n    \"ShoppingCart.Users.UsersController.Post (ShoppingCart)\" in 45.891ms\n\
  2020-12-07 11:10:39 f2e604d90da6114a8d4a77daa57a7890 INF Executed endpoint\n   \
  \ \"ShoppingCart.Users.UsersController.Post (ShoppingCart)\"\n2020-12-07 11:10:39\
  \ f2e604d90da6114a8d4a77daa57a7890 INF Request finished\n    HTTP/1.1 200 19.3457ms\n\
  ```\n\n所有这些请求都通过跟踪 ID——f2e604d90da6114a8d4a77daa57a7890——关联在一起。使用生产配置的同一请求会产生以下日志输出：\n\
  \n\n```text\n449d-ab84-cb196a437710\", \"RequestId\": \"0HM4QJ9RN6M7Q:00000002\"\
  , \"RequestPath\": \"/users/0/items\", \"ConnectionId\": \"0HM4QJ9RN6M7Q\", \"SpanId\"\
  : \"469950e2392da4db\", \"TraceId\": \"7e413f37415aea4d8c4ff04924292ad2\", \"ParentId\"\
  : \"0000000000000000\"})\n{\"timestamp\":\"2020-12-07T11:25:49.506975+01:00\",\"\
  Level\":\"Information\",\"MessageTemplate\":\"Executed endpoint '{EndpointName}'\"\
  ,\"Properties\":{\"EndpointName\":\"ShoppingCart.Users.UsersController.Post (ShoppingCart)\"\
  ,\"EventId\":{\"Id\":1,\"Name\":\"ExecutedEndpoint\"},\"SourceContext\":\"Microsoft.AspNetCore.Routing.EndpointMiddleware\"\
  ,\"RequestId\":\"0HM4QJ9RN6M7Q:00000002\",\"RequestPath\":\"/users/0/items\",\"\
  ConnectionId\":\"0HM4QJ9RN6M7Q\",\"SpanId\":\"469950e2392da4db\",\"TraceId\":\"\
  7e413f37415aea4d8c4ff04924292ad2\",\"ParentId\":\"0000000000000000\"}}\n{\"timestamp\"\
  :\"2020-12-07T11:25:49.5124936+01:00\",\"Level\":\"Information\",\"MessageTemplate\"\
  :\"{HostingRequestFinishedLog:1}\",\"Properties\":{\"ElapsedMilliseconds\":165.5149,\"\
  StatusCode\":200,\"ContentType\":null,\"ContentLength\":0,\"Protocol\":\"HTTP/1.1\"\

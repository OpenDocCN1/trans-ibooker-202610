  :\"1\",\"Rendering\":\"Request finished HTTP/1.1 POST https://localhost:5001/users/0/items\
  \ application/json 9 - 200 0 - 165.5149ms\"}]}}\n```\n\n虽然这些日志对人类来说远不如开发日志易读，但它们确实包含了更多信息，当这些日志被存储在搜索引擎中并以良好的用户界面呈现时，它们会变得非常强大。现在请注意，每条日志消息都包含跟踪\
  \ ID：`\"TraceId\": \"7e413f37415aea4d8c4ff04924292ad2\"`。\n\n### 9.4.2 跟踪 ID 包含在出站\
  \ HTTP 请求中\n\nASP.NET 不仅会从传入的 traceparent 标头中读取跟踪 ID，还会自动为使用 HttpClient 发出的出站请求添加\
  \ traceparent 标头，因此我们无需额外操作即可让出站请求携带包含跟踪 ID 的 traceparent 标头。例如，购物车微服务向产品目录微服务发出的请求已经包含了\
  \ traceparent 标头，因此跟踪 ID 会随请求一起发送到产品目录微服务，这意味着我们可以在日志中跨微服务跟踪请求。\n\n### 9.4.3 记录未处理的异常\n\
  \n正如我们之前讨论的，故障时有发生。在这些情况下，重要的是要有能够显示失败如何发生的日志。MVC 会捕获控制器中任何其他未处理的异常，并记录异常消息。与任何其他日志消息一样，这些日志也会包含跟踪\
  \ ID。这意味着我们可以追踪是什么导致了未处理的异常。我们可以找到原始用户请求以及沿途生成的所有其他日志消息。\n\n```yaml\ntemplate:\n\
  \  metadata:\n    labels:\n      app: shopping-cart\n  spec:\n    containers:\n\
  \      - name: shopping-cart\n        image: shopping-cart\n        imagePullPolicy:\
  \ IfNotPresent\n        ports:\n          - containerPort: 80\n        env:\n  \
  \        - name: STARTUPDLL\n            value: \"api/ShoppingCart.dll\"\n     \
  \   livenessProbe:\n          httpGet:\n            path: /health/live\n       \
  \     port: 80\n          periodSeconds: 30\n        startupProbe:\n          httpGet:\n\
  \            path: /health/startup\n            port: 80\n          initialDelaySeconds:\
  \ 10\n          periodSeconds: 10\n---\napiVersion: v1\nkind: Service\nmetadata:\n\
  \  name: shopping-cart\nspec:\n  type: LoadBalancer\n  ports:\n    - name: shopping-cart\n\
  \      port: 5001\n      targetPort: 80\n  selector:\n    app: shopping-cart\n```\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_248_0.png)\n\n现在，当我们运行 `kubectl apply\
  \ -f shopping-cart.yaml` 重新部署购物车微服务时，Kubernetes 将使用启动探针和存活探针来判断容器的健康状况。我们可以使用 `kubectl\
  \ get pods` 来测试容器是否按预期运行，输出应显示购物车 Pod 正在运行且未被重启，类似下面这一行：\n\n```text\nNAME      \
  \                    READY   STATUS    RESTARTS   AGE\nshopping-cart-54ff7c4846-rvkcc\
  \  1/1     Running   0          8m3s\n```\n\n> **注意** 如果你的 Kubernetes 集群中没有运行 SQL\
  \ Server，启动探针将会失败，因为启动健康检查会尝试连接 SQL Server。如果你想看到存活探针成功，你可以在 Kubernetes 集群中部署 SQL\
  \ Server，或者移除启动探针。\n\n此外，我们可以使用 `kubectl describe deployment.apps/shopping-cart`\
  \ 检查配置，它会显示探针的配置以及购物车部署的其余配置。\n\n我们还可以预期在日志中看到对监控端点的调用。我们可以使用 `kubectl logs` 从 Kubernetes\
  \ 获取日志。要获取购物车部署的所有日志，我们可以运行以下命令来打印购物车部署的日志：\n\n```\nkubectl logs -f --tail=10 deployment.apps/shopping-cart\n\
  ```\n\n`-f` 告诉 kubectl 持续跟随日志，因此一旦购物车微服务记录日志，我们就会在控制台中看到它。`--tail=10` 告诉 kubectl\
  \ 从打印最近的 10 条日志开始。当购物车微服务启动并运行后，部分日志输出看起来像下面这两条来自一次存活探针调用的日志消息：\n\n```text\n{\"\
  Timestamp\":\"2020-12-07T13:15:21.1589211+00:00\",\"Level\":\"Information\",\"MessageTemplate\"\
  :\"{HostingRequestStartingLog:1}\",\"Properties\":{\"Protocol\":\"HTTP/1.1\",\"\
  Method\":\"GET\",\"ContentType\":null,\"ContentLength\":null,\"Scheme\":\"http\"\
  ,\"Host\":\"10.1.0.22:80\",\"PathBase\":\"\",\"Path\":\"/health/live\",\"QueryString\"\
  :\"\",\"HostingRequestStartingLog\":\"Request starting HTTP/1.1 GET http://10.1.0.22:80/health/live\
  \ - -\",\"EventId\":{\"Id\":1,\"Name\":\"RequestStarting\"},\"SourceContext\":\"\
  Microsoft.AspNetCore.Hosting.Diagnostics\",\"RequestId\":\"0HM4QLU8CA00I:00000002\"\
  ,\"RequestPath\":\"/health/live\",\"ConnectionId\":\"0HM4QLU8CA00I\",\"SpanId\"\
  :\"a2c71b41ba089b44\",\"TraceId\":\"ca68d09e29e61e4d92d363cb3bfa4827\",\"ParentId\"\
  :\"0000000000000000\"},\"Renderings\":{\"HostingRequestStartingLog\":[{\"Format\"\
  :\"1\",\"Rendering\":\"Request starting HTTP/1.1 GET http://10.1.0.22:80/health/live\
  \ - -\"}]}}\n```\n\n```text\n{\"Timestamp\":\"2020-12-07T13:15:21.1591769+00:00\"\
  ,\"Level\":\"Information\",\"MessageTemplate\":\"{HostingRequestFinishedLog:1}\"\
  ,\"Properties\":{\"ElapsedMilliseconds\":0.3009,\"StatusCode\":200,\"ContentType\"\
  :\"text/plain\",\"ContentLength\":null,\"Protocol\":\"HTTP/1.1\",\"Method\":\"GET\"\
  ,\"Scheme\":\"http\",\"Host\":\"10.1.0.22:80\",\"PathBase\":\"\",\"Path\":\"/health/live\"\
  ,\"QueryString\":\"\",\"HostingRequestFinishedLog\":\"Request finished HTTP/1.1\
  \ GET http://10.1.0.22:80/health/live - - 200 - text/plain 0.3009ms\",\"EventId\"\
  :{\"Id\":2,\"Name\":\"RequestFinished\"},\"SourceContext\":\"Microsoft.AspNetCore.Hosting.Diagnostics\"\
  ,\"RequestId\":\"0HM4QLU8CA00I:00000002\",\"RequestPath\":\"/health/live\",\"ConnectionId\"\
  :\"0HM4QLU8CA00I\",\"SpanId\":\"a2c71b41ba089b44\",\"TraceId\":\"ca68d09e29e61e4d92d363cb3bfa4827\"\
  ,\"ParentId\":\"0000000000000000\"},\"Renderings\":{\"HostingRequestFinishedLog\"\
  :[{\"Format\":\"1\",\"Rendering\":\"Request finished HTTP/1.1 GET http://10.1.0.22:80/health/live\
  \ - - 200 - text/plain 0.3009ms\"}]}}\n```\n\n这正是我们从微服务输出这些日志消息的方式；它们是 JSON 格式、结构化的，并且包含跟踪信息。\n\
  \n在本章中，你在购物车微服务中创建了两个监控端点，但它们不依赖于微服务的任何业务逻辑。它们完全可以写在任何其他微服务中。你还配置了 Kubernetes 来使用这些新端点。在其他微服务中，这完全相同。该\n\
  \n\n本章中你完成的日志记录工作也是如此。所有微服务都一样。在第12章中，你将把购物车中的公共代码提取出来，打包到NuGet包中，以便在许多微服务中复用。\n\
  \n## 小结\n\n- 微服务系统与其他任何服务端系统一样，都需要监控和日志记录。\n- 每个微服务都应被监控并发送日志消息。\n- 由于系统中的微服务数量众多，设置监控和日志记录需要简单易行。\n\
  - 追踪ID使得跨多个微服务追踪请求变得更加容易。\n- ASP.NET 实现了追踪上下文标准，因此使用 `traceparent` HTTP 头来传播追踪ID。\n\
  - 你可以使用 ASP.NET 的健康检查中间件创建两个监控端点：一个用于启动，一个用于存活。\n- 结构化日志是一种在日志消息中包含有价值信息并使这些数据可搜索的好方法。\n\
  - Serilog 是一个用于进行结构化日志记录的库。\n- ASP.NET 将追踪信息存储在 `Activity.Current` 中。\n- 你可以配置 Serilog，使其在所有的日志消息中包含来自\
  \ `Activity.Current` 的追踪信息。\n- `HttpClient` 会在每个传出 HTTP 请求中包含一个 `traceparent` 头，确保追踪ID被发送到其他微服务。\n\
  - Kubernetes 支持健康探针，这与我们的监控端点非常匹配。\n- Kubernetes 允许我们轻松访问容器中的日志。\n- 为了充分利用日志，所有日志消息都应发送到一个具有良好搜索和可视化能力的中央日志记录微服务。\n"
- "## 保护微服务间的通信\n\n### 本章涵盖\n\n- 在微服务系统中应在何处执行用户身份验证和授权\n- 决定微服务系统中的信任级别\n- 限制微服务间的请求\n\
  - 使用 API 网关对用户进行身份验证\n- 使用 Kubernetes 网络策略限制微服务间的请求\n\n到目前为止，本书一直忽略了安全性；但对于大多数系统而言，安全性是一个需要认真对待的重要问题。本章讨论如何在微服务系统中解决安全问题。在单体架构中，单体应用完成用户身份验证和授权——毕竟只有单体应用来做这些事情。在微服务系统中，处理大多数用户请求时涉及多个微服务；问题是：哪些微服务负责身份验证，哪些负责授权？你还必须考虑微服务之间可以相互信任多少：\n\
  \n- 如果一个微服务验证了用户，其他微服务能否信任该用户？\n- 是否允许所有微服务相互调用？\n\n答案因系统而异。本章的第一部分讨论如何解决这些问题。第二部分概述了对第一个问题的一个可能答案的实现，并展示了对第二个问题的一个完整实现。\n\
  \n## 10.1 微服务的安全问题\n\n安全性几乎对任何服务端系统来说都是一个重要的关注点。它也是一个非常广泛的主题，其中很大部分超出了本书的范围。我们将集中讨论与微服务系统开发者相关的两个安全领域：\n\
  \n- 1. 身份验证和授权\n- 2. 如何限制微服务之间的通信\n\n大多数系统都有一些仅供登录用户访问的功能。想想前面章节中讨论的销售点系统。在第4章和第5章中，我们讨论了添加一个忠诚度计划，允许注册用户根据他们的兴趣通过电子邮件接收特别优惠。如果用户对高尔夫感兴趣，他们就会收到关于高尔夫球优惠的通知。如果用户想编辑他们的兴趣——他们可能已经放弃高尔夫转而开始学习绗缝——他们需要登录。否则，一个用户可能会编辑另一个用户的兴趣，导致收到错误的优惠通知。确保用户确实是其所声称的身份是身份验证的问题。决定用户被允许做什么——例如，他们只能编辑自己的兴趣而不能编辑别人的——是授权的问题。\n\
  \n无论你是否使用微服务构建系统，身份验证和授权都可能是你需要关注的问题。不同之处在于，微服务系统的细粒度特性引出了一个问题：哪些微服务处理身份验证和授权？以下两节将讨论这个问题。\n\
  \n## 传输中的数据与静态数据\n\n系统处理数据。这些数据通常对系统至关重要，但往往也对用户至关重要。数据可能是敏感的，例如用户的家庭住址、信用卡号或医疗记录。即使数据不敏感，它也可能对系统很有价值——电子商务网站的产品目录并不敏感，但对背后的业务来说价值巨大。你的系统处理的数据很重要，需要安全地处理。大致来说，我们可以将数据处理分为两类：\n\
  \n- 传输中的数据——当数据从系统的一个部分移动到另一个部分时，它被称为传输中的数据。例如，当协作的微服务通过命令、查询或事件交换数据时，它们交换的数据就是传输中的数据。\n\
  \n* *静态数据*——当数据被存储以供以后使用时，它被称为静态数据。例如，当拥有某条数据的微服务将其存储在数据库中时，该数据就是静态的。\n\n在这两种情况下，确保数据安全都很重要。本章侧重于传输中的数据，因为这是微服务系统与其他架构的系统不同的地方。在微服务系统中保护静态数据的技术与单体或传统SOA系统中的技术相同。\n\
  \n### 10.1.1 在边缘进行用户身份验证\n\n身份验证是关于验证用户是否是其声称的身份。在微服务系统的上下文中，这意味着验证请求是否代表其看似来自的用户发出。让我们看一下图10.1中的示例，它展示了第4章和第5章中销售点系统的一部分——围绕忠诚度计划微服务的部分。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_253_0.png)\n\n图10.1 销售点系统中的忠诚度计划微服务\n\
  \n如果你在忠诚度计划中添加一个 Web 前端，注册用户可以在其中编辑他们的兴趣——例如，移除他们对高尔夫的兴趣，改为添加绗缝——你会得到类似图10.2的内容。你希望用户只能编辑自己的兴趣，而不是其他人的兴趣。因此，你要求用户登录才能编辑兴趣。在图10.2中，你必须对更新用户设置的请求进行身份验证。明显的身份验证位置是\
  \ API 网关微服务，它是从客户端接收更新用户设置请求的微服务。该请求代表某个用户发出，你必须验证\n\n客户端是否被允许代表用户发出请求。你可以通过确保用户已登录来做到这一点。\n\
  \n图10.3向系统添加了一个登录微服务。这个新微服务负责处理登录过程，但 API 网关仍然负责确保只接受来自已登录用户的请求。如果用户尚未登录，则会被重定向到登录页面。登录过程决定用户如何登录，并引导用户完成该过程。用户可以通过各种方式登录，包括以下方式：\n\
  \n- 使用简单的用户名和密码\n- 使用多因素身份验证\n- 通过外部系统，如活动目录\n- 通过社交媒体身份提供商，如 Facebook、Twitter、Google\
  \ 等\n\n![](img/608267d7803dc57a1a896ad121f37868_254_0.png)\n\n![](img/608267d7803dc57a1a896ad121f37868_254_1.png)\n\
  \n无论采用何种登录机制，登录微服务都会处理登录，并以 API 网关可以验证的访问令牌形式向 API 网关提供用户身份的证明。例如，这可以通过 OpenID Connect\
  \ 协议实现。\n\n请注意，用户身份验证发生在系统的边缘——也就是说，由接收客户端请求的微服务完成。这是通用模式；用户身份验证在系统的边缘完成。\n\n\n\n\
  \n\nAPI Gateway 微服务和登录微服务是实现技术能力的服务的示例。此外，两者都是在许多不同系统中非常相似的技术能力：在领域驱动设计术语中，它们是通用子域的示例——这意味着它们是使用现成产品实现的理想候选者。登录微服务可以由任何身份提供者实现，包括\
  \ Azure AD、AWS Cognito、Duende Identity Server 和 Auth0 等产品。同样，API Gateway 可以由 Azure\
  \ API Management、AWS API Gateway、Traefik 和 Istio 实现。\n\n## 10.1.2 在微服务中授权用户\n\n\
  我们已经确定身份验证是在系统边缘启动的——由 API Gateway 启动。请求经过身份验证后，你就知道用户是谁，但你不知道用户是否被允许发出该请求。那是授权的问题。用户只能更新自己的兴趣。如果客户端代表用户\
  \ A 发送请求，试图更新用户 B 的兴趣，系统应拒绝该请求。\n\n在微服务系统中，启动身份验证的边缘微服务——通常不是执行请求所针对的操作的微服务。图 10.4\
  \ 再次展示了忠诚度计划。API Gateway 微服务接收来自客户端的请求，但忠诚度计划微服务负责跟踪用户兴趣。因此，忠诚度计划更新用户的兴趣。\n\n![](img/608267d7803dc57a1a896ad121f37868_255_0.png)\n\
  \n图 10.4 授权应作为业务逻辑的一部分完成；忠诚度计划微服务负责授权对用户设置的更新。\n\n请记住第 4 章中提到的内容，微服务主要按业务能力进行划分——一个业务能力由一个微服务处理。这包括授权，因为授权是该能力业务规则的一部分。这与让忠诚度计划微服务决定用户是否被允许更新兴趣是一致的。为此，用户身份需要在微服务之间传递。在忠诚度计划中，API\
  \ Gateway 微服务必须在发送给忠诚度计划的请求中包含用户身份。用户身份可以通过多种方式包含在发送给忠诚度计划的请求中，具体取决于你希望 API Gateway\
  \ 与其他微服务之间信任的程度。如果信任度低，用户身份可以以签名身份令牌的形式传递，忠诚度计划可以验证该令牌；如果信任度更高——用户身份可以以明文形式通过自定义\
  \ HTTP 头传递。在这两种情况下，API Gateway 对用户进行身份验证，忠诚度计划根据用户身份对用户进行授权。\n\n## 10.2 实现安全的微服务到微服务通信\n\
  \n在本章的剩余部分，我们将研究围绕忠诚度计划实现安全性的示例。安全需求如下：\n\n- 1. 在 API Gateway 中对用户进行身份验证。\n- 2.\
  \ 允许微服务访问用户身份。\n- 3. 限制哪些微服务可以协作。\n\n前两个需求可以通过 API Gateway 来满足。我不会详细介绍这一点，只提到你可以使用\
  \ Azure API Management 来实现这一点。第三个需求可以使用 Kubernetes 网络策略来满足，我们接下来将通过示例讨论这一点。\n\n\
  ### 10.2.1 在忠诚度计划中访问用户身份\n\n在忠诚度计划微服务中，我们假设 API Gateway 已配置为执行用户身份验证，并且用户身份以身份令牌的形式从\
  \ API Gateway 传递到忠诚度计划微服务，如图 10.5 所示\n\n![](img/608267d7803dc57a1a896ad121f37868_257_0.png)\n\
  \n图 10.5 在 Azure API Management 中实现的 API Gateway 对用户进行身份验证，并将身份令牌传递给 Kubernetes\
  \ 中的忠诚度计划微服务。\n\n在以下各节中，你将学习如何在忠诚度计划中使用身份令牌，通过\n\n- 使用 ASP.NET 身份验证中间件验证令牌\n- 在\
  \ MVC 控制器中授权\n\n第一步是添加身份验证中间件。我们通过将身份验证添加到服务集合，在 Startup 类中执行此操作。我只在这里概述解决方案，因为细节取决于确切的\
  \ API Gateway 配置，这超出了本章的范围。\n\n在忠诚度计划中，我们可以将 Startup 中的 ConfigureServices 方法更改为如下所示。\n\
  \n### Listing 10.1 Configuration to use JWT bearer tokens by default\n\n```\npublic\
  \ void ConfigureServices(IServiceCollection services)\n{\n    services.AddAuthentication(JwtBearerDefaults.AuthenticationScheme)\n\
  \        .AddJwtBearer(x => x.TokenValidationParameters =\n            new TokenValidationParameters\n\
  \            {\n                ValidAudience = ...,\n                ValidIssuer\
  \ = ...,\n                IssuerSigningKey = ...,\n            });\n    services.AddControllers();\n\
  }\n```\n\n这概述了如何添加中间件，从传入请求的 Authorization 头中读取和验证 JWT。这与配置为在 Authorization 头中以\
  \ JWT 形式传递用户身份的 API Gateway 相符。\n\n下一步是通过在 Startup 类中将授权添加到管道，使用户身份可供控制器使用，如下所示。\n\
  \n### Listing 10.2 Using authorization middleware to make identities available to\
  \ controllers\n\n```\npublic void Configure(IApplicationBuilder app, IWebHostEnvironment\
  \ env)\n{\n    app.UseHttpsRedirection();\n    app.UseRouting();\n    app.UseAuthorization();\n\
  \    app.UseEndpoints(endpoints => endpoints.MapControllers());\n}\n```\n\n这意味着控制器现在可以使用\
  \ Authorize 属性要求请求中存在身份令牌，并可以通过 ControllerBase 上的 User 属性访问用户身份。例如，为了保护用于更新现有用户的\
  \ PUT 端点，我们可以在 UsersController 中的 UpdateUser 方法上添加 Authorize 属性：\n\n```\n[HttpPut(\"\
  {userId:int}\")]\n[Authorize(AuthenticationSchemes =\n    JwtBearerDefaults.AuthenticationScheme)]\n\
  public LoyaltyProgramUser UpdateUser(\n    int userId,\n    [FromBody] LoyaltyProgramUser\
  \ user) =>\n    return RegisteredUsers[userId] = user;\n```\n\n这确保了所有对更新用户的 PUT\
  \ 端点的请求都有有效的 JWT 令牌。但我们仍然不能确定是否更新了正确的用户，因为简单地使用作为路径一部分传递的用户 ID；如果此用户 ID 与 JWT 中的用户\
  \ ID 不同，一个用户就可以更新另一个用户。为了防止这种情况，我们必须\n\n将其与 JWT 中的用户 ID 进行比较。JWT 中的值——或声明——可通过 ControllerBase\
  \ 类上的 User 属性获得，UsersController 从该类继承。User 属性是一个 ClaimsPrincipal 对象，它有一个包含来自 JWT\
  \ 的所有声明的声明集合。利用这一知识，我们可以确保用户只能授权更新自己的信息。\n\n### Listing 10.3 Inspecting the claims\
  \ on the user\n\n```\n[HttpPut(\"{userId:int}\")]\n[Authorize(AuthenticationSchemes\
  \ = JwtBearerDefaults.AuthenticationScheme)]\npublic ActionResult<LoyaltyProgramUser>\
  \ UpdateUser(\n    int userId,\n    [FromBody] LoyaltyProgramUser user)\n{\n   \
  \ var hasUserId = int.TryParse(\n        this.User.Claims.FirstOrDefault(c => c.Type\
  \ == \"userid\")?.Value,\n        out var userIdFromToken);\n    if (!hasUserId\
  \ || userId != userIdFromToken)\n        return Unauthorized();\n    return RegisteredUsers[userId]\
  \ = user;\n}\n```\n\n在声明集合中找到用户 ID。\n\n将用户 ID 解析为 userIdFromToken。\n\n检查令牌中的用户 ID\
  \ 是否与路径中的用户 ID 匹配。\n\n如果用户 ID 不匹配，则返回未经授权的响应。\n\n这完成了忠诚度计划中 PUT 端点授权的实现。我们选择了一种解决方案，即\
  \ API Gateway 将带有用户身份的 JWT 传递给忠诚度计划微服务。如果信任级别更高，我们可能会选择以明文形式将身份从 API Gateway 发送到忠诚度计划。\n\
  \n有了授权后，我们现在将注意力转向限制哪些微服务被允许通信。\n\n### 10.2.2 限制哪些微服务可以通信\n\n请回顾图 10.1，忠诚度计划的协作者之一是特别优惠微服务。图\
  \ 10.6 放大了这种协作。\n\n![](img/608267d7803dc57a1a896ad121f37868_259_0.png)\n\n图 10.6\
  \ 忠诚度计划具有 API 和事件消费者；事件消费者使用特别优惠中的事件端点获取事件。\n\n\n\n\n\n忠诚度计划部署到 Kubernetes 中包含两个容器：忠诚度计划\
  \ API 容器和忠诚度计划事件消费者容器。忠诚度计划事件消费者负责从特价优惠微服务获取并处理事件。因此只有忠诚度计划事件消费者容器需要被允许向特价优惠微服务发起请求。\n\
  \n我们将使用 Kubernetes 中的网络策略来限制对特价优惠的访问，以确保只有忠诚度计划事件消费者被允许调用特价优惠中的端点。忠诚度计划 API 或任何其他微服务都不会被允许调用特价优惠中的端点。如果图\
  \ 10.1 中未描绘的其他微服务需要访问特价优惠，可以扩展网络策略以有选择地允许此类访问。\n\n## 在 Kubernetes 中启用网络策略\n\n网络策略很不幸地在我们在第\
  \ 3 章中创建的 Kubernetes 集群中无法工作，因为该集群需要一个支持网络策略的 *网络控制器*。网络控制器无法在集群创建后安装，因此我们必须创建一个新的集群并使用网络控制器。在\
  \ AKS 中，我们可以使用名为 *azure* 的网络插件，它将设置一个支持网络策略的网络控制器。为此，我们还需要为 AKS 集群设置一个稍微复杂一些的网络。该章的代码下载包含一个\
  \ PowerShell 脚本，用于创建启用了网络控制器和网络策略的 AKS 集群。\n\nDocker Desktop 不支持网络控制器，因此我们无法在其中使用网络策略。此外，在没有网络控制器的\
  \ Kubernetes 集群中，网络策略将不起任何作用；它们不会产生任何错误，但也不会限制流量。\n\n在第 5 章中，我们使用此清单文件将特价优惠微服务部署到\
  \ Kubernetes。\n\n```\nkind: Deployment\napiVersion: apps/v1\nmetadata:\n    name:\
  \ special-offers\nspec:\n    replicas: 1\n    selector:\n        matchLabels:\n\
  \            app: special-offers\n    template:\n        metadata:\n           \
  \ labels:\n                app: special-offers\n        spec:\n```\n\n```\n```yaml\n\
  containers:\n  - name: special-offers\n    image: your_unique_registry_name.azurecr.io/\n\
  \      special-offers:1.0.0\n    imagePullPolicy: IfNotPresent\n    ports:\n   \
  \   - containerPort: 80\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name:\
  \ special-offers\nspec:\n  type: LoadBalancer\n  ports:\n    - name: special-offers\n\
  \      port: 5002\n      targetPort: 80\n  selector:\n    app: special-offers\n\
  ```\n```\n\n这会创建一个包含特价优惠容器的 Pod，以及一个在 Kubernetes 外部暴露特价优惠的负载均衡器。我们需要以两种方式更改它，以获得我们想要的对特价优惠微服务的访问限制。首先，我们将更改服务部分，使其不再在\
  \ Kubernetes 外部暴露特价优惠。其次，我们将添加一个网络策略。\n\n第一个更改很简单。我们只需要删除行 `type: LoadBalancer`。这意味着我们不再创建负载均衡器，但我们仍会创建服务。\n\
  \n第二个更改——引入网络策略——在清单中添加了另一个部分，指定只有忠诚度计划事件消费者被允许访问特价优惠。`special-offers.yaml` 中的最终特价优惠清单如下所示。\n\
  \n### Listing 10.5 Modified manifest for special offers with a network policy\n\n\
  ```\n```yaml\nkind: Deployment\napiVersion: apps/v1\nmetadata:\n  name: special-offers\n\
  spec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: special-offers-pod\n\
  \  template:\n    metadata:\n      labels:\n        app: special-offers-pod\n  \
  \  spec:\n      containers:\n```\n\n![](img/608267d7803dc57a1a896ad121f37868_261_0.png)\n\
  \n```\n- name: special-offers\n  image: your_unique_registry_name.azurecr.io/\n\
  \    special-offers:1.0.0\n  imagePullPolicy: IfNotPresent\n  ports:\n    - containerPort:\
  \ 80\n```\n\n```\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: special-offers\n\
  spec:\n  selector:\n    app: special-offers-pod\n  ports:\n    - port: 5002\n  \
  \    targetPort: 80\n```\n\n服务不再是负载均衡器。\n\n```\n---\napiVersion: networking.k8s.io/v1\n\
  kind: NetworkPolicy\nmetadata:\n  name: special-offers-network-policy\nspec:\n \
  \ podSelector:\n    matchLabels:\n      app: special-offers-pod\n  policyTypes:\n\
  \  - Ingress\n  ingress:\n    - from:\n        - podSelector:\n            matchLabels:\n\
  \              app: loyalty-program-consumer\n```\n\n一个网络策略\n\n网络策略适用于特价优惠 Pod。\n\
  \n该策略控制进入特价优惠 Pod 的流量。\n\n仅允许忠诚度计划消费者。\n\n这将确保只有忠诚度计划事件消费者可以向特价优惠发起调用。网络策略通过定义它适用的\
  \ Pod——特价优惠 Pod——以及哪些 Pod 可以调用受策略保护的 Pod 中的容器来工作。策略允许带有标签 app: loyalty-program-consumer\
  \ 的 Pod 调用特价优惠，但不允许其他 Pod。唯一具有该标签的 Pod 是忠诚度计划事件消费者。\n\n为了确认忠诚度计划事件消费者确实能够向特价优惠发起调用，我们可以使用以下命令检查事件消费者的日志\n\
  \n```\nkubectl logs -lapp=loyalty-program-consumer --all-containers\n```\n\n这将显示忠诚度计划事件消费者最近几次调用的日志。\n\
  \n至此，安全需求的实现已完成。你已通过依赖 Azure API Management 充当 API 网关并执行身份验证、使用 ASP.NET 对 JWT 的支持、使控制器中的业务逻辑执行授权，以及依赖\
  \ Kubernetes 网络策略来限制哪些微服务可以通信，从而满足了这些需求。\n\n## Summary\n\n- 用户应在系统边缘进行身份验证。也就是说，最先接收用户请求的微服务应启动身份验证。\n\
  - 授权应在微服务系统中、在拥有请求所针对数据的微服务中进行。原则是授权是属于业务能力的业务规则的一部分。由于微服务——正如你在第 4 章中所见——是围绕业务能力设计的，因此负责业务能力的微服务也应负责与该业务能力相关的任何授权。\n\
  - 深度防御的安全原则要求你考虑微服务之间可以接受的信任级别。在某些系统中，微服务信任来自其他微服务的请求可能是可以接受的。在其他系统中，可能不可接受。\n-\
  \ 微服务之间高度信任带来的便利性与较低信任带来的安全性之间存在权衡。\n- 你可以引入一个登录微服务，负责所有身份验证，包括终端用户身份验证和一个微服务到另一个微服务的调用身份验证。\n\
  - 你使用 Kubernetes 网络策略来控制哪些微服务可以通过配置作用域进行协作，以及哪些微服务接收哪些作用域。\n- 你可以使用多种现成的产品来设置登录微服务。\n\
  - 你可以使用身份令牌以比将用户 ID 作为明文包含更安全的方式在各处传递用户身份。\n- 你可以从传入请求中读取身份令牌并使用其中的声明在控制器操作中执行授权。\n\
  \n这些组件均未解决横切关注点，例如监控、日志记录、处理数据库连接的标准方式、安全等。此外，这些组件都不是实现这些横切关注点的合适位置。为什么？因为图 11.1\
  \ 中的所有组件都实现了特定于购物车微服务的功能。相比之下，横切关注点并非特定于任何一个微服务。因此，我们需要在图 11.1 中的组件之外实现它们。从另一个角度看购物车，如图\
  \ 11.2 所示，它通过 Web 服务器接收 HTTP 请求，使用其各种组件处理请求，并向 Web 服务器返回响应，Web 服务器再将其发送回调用方。\n\n\
  ![](img/608267d7803dc57a1a896ad121f37868_266_0.png)\n\n图 11.2 购物车微服务通过 Web 服务器接收\
  \ HTTP 请求。\n\n正如我刚才提到的，我们希望将横切关注点的代码与图 11.1 中的组件分开。此外，横切关注点适用于整个微服务。这意味着处理横切关注点的代码的良好位置是在\
  \ Web 服务器和我们 MVC 控制器中的端点处理程序之间（见图 11.3）。\n\nWeb 服务器和端点处理程序之间的代码片段形成了一条管道：每个请求在到达\
  \ MVC 控制器中的端点处理程序之前依次流经管道中的每个部分。同样，端点处理程序的响应也会沿同一管道返回，然后到达 Web 服务器，Web 服务器再将其发送回调用方。在本章中，你将使用\
  \ ASP.NET 中间件来实现这样的管道；管道中的每个部分称为中间件。正如你所见\n\n\n\n![](img/608267d7803dc57a1a896ad121f37868_267_0.png)\n\
  \n图 11.3 你可以在 Web 服务器和端点处理程序之间使用中间件管道来处理横切关注点。\n\n在之前的章节中，ASP.NET 已经开箱即用地支持了许多横切关注点——例如请求日志记录和监控端点——通常在内部使用中间件。随着你转向更特定于环境的关注点，中间件可能会非常有帮助。本章后面我会介绍如何编写和测试自己的中间件，但在那之前，让我们先看看如何将这些横切关注点收集到一个可复用的微服务平台中。\n\
  \n## 11.3 创建可复用的微服务平台\n\n第 9 章和第 10 章解释了微服务必须在生产环境中成为守规矩的公民。它们需要通过日志记录提供健康状况的洞察，应该允许监控，并且需要遵循你为系统决定的安全标准。因此，创建一个新的微服务不仅仅是创建一个新的、空的\
  \ ASP.NET 项目。\n\n这就是为什么我建议构建一个标准的微服务平台，在微服务系统中跨你的基于 ASP.NET 的微服务使用。如图 11.4 所示，\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_268_0.png)\n\n**图 11.4** 微服务平台是一组跨所有微服务的技术关注点的实现集合。平台被安装在——并且成为——每个微服务的一部分。\n\
  \n平台被安装在每个微服务中。本章后面，你将创建一个这样的平台的第一个迭代，包括以下内容：\n\n- 适合 Kubernetes 的监控端点\n- 简化结构化日志记录和追踪的日志配置\n\
  \n这些是我为本书选择的平台领域，但它们不一定是你系统微服务平台所需的全部内容。我尝试包含了常见组件。特别是，我认为此类平台应包含监控、追踪和结构化日志部分。它们不必采用本书中使用的确切形式；例如，你可能更喜欢不同的追踪标准或另一个日志框架。根据你为微服务之间安全所选择的方案，你也可能有机会通过将横切安全代码放入平台来使安全更简单。此外，你应考虑包含与你在许多微服务中使用的技术相关的策略——例如，处理数据库连接。\n\
  \n另一面是：你是否应该在微服务平台中包含更多内容？没有一概而论的答案，但你应谨慎添加项目；每次你在平台中包含某项内容，它就会变得更大更重。此外，当你添加所有微服务都预期包含的内容时，如果它们没有运行相同版本的平台会怎样？其他微服务能处理这种情况吗？围绕你的微服务系统的基础设施能处理这种情况吗？如果平台发展成必须在所有微服务中保持同步的东西，但它经常变化，它就会成为严重的瓶颈而不是推动者。首先，平台必须在每个微服务的代码库中更新，然后每个微服务必须部署。如果有许多微服务，那就是大量工作；并且每次创建新微服务时，工作量会更大。\n\
  \n理想情况下，你的微服务平台将恰好包含那些真正横切微服务且可以增量更新的技术关注点——也就是说，在一段时间内一次在一个微服务中更新。这使得创建新微服务的门槛大大降低：你需要对横切技术关注点的详细知识更少，所花费的精力也更少。\n\
  \n## 11.4 使用 NuGet 打包和共享横切代码\n\n### 使用 NuGet 构建你的平台\n\nNuGet 是一种包格式，也是安装这些包的一组工具。直到本书的这一点，你只安装了现有的\
  \ NuGet 包；它们都公开在 nuget.org 上的包源中。但 NuGet 不限于安装公开可用的包。正如你在 11.4 节中将看到的，你可以从私有包源安装包。而且你也可以创建自己的\
  \ NuGet 包——正如你在 11.4.1 节中也会看到的——并将它们放入你的私有 NuGet 源。\n\n我们现在将注意力转向构建一个可跨微服务复用的小型平台所需的代码。你已经构建了进入这个小型平台的功能，但你是一次在一个微服务中完成的。现在，你将从创建它的微服务中提取代码并将其放入包中，你可以轻松地在新微服务中安装和使用。你将使用\
  \ NuGet，因为它能提供易于创建的包，你的微服务可以安装和使用。你已经在微服务中使用了许多 NuGet 包，所以它已是你的工作流程的一部分；可复用微服务平台中的包将完美契合。一旦我们建立了这个小型平台，我们将回到中间件作为工具，让你将更多横切关注点构建到平台中，使其完美契合你的特定系统和组织。你将从以下部分构建平台：\n\
  \n- 第 9 章中的健康检查\n- 第 9 章中的追踪\n- 第 9 章中的结构化日志记录\n\n如图所示 11.5，平台将由以下 NuGet 包组成：\n\n\
  - `MicroserviceNET.Logging`——结构化日志记录和追踪\n- `MicroserviceNET.Monitoring`——健康检查\n\n\
  ![](img/608267d7803dc57a1a896ad121f37868_270_0.png)\n\n图 11.5 微服务平台包含两个包，每个包包含一些技术横切关注点的代码。\n\
  \n你的微服务只需添加 MicroserviceNET.Platform 包和少量启动代码即可使用和配置微服务平台。创建 NuGet 包来做这件事似乎是过度设计吗？也许。ASP.NET\
  \ 已经使监控和日志关注点变得相当容易，所以这些包起初不会有太多代码。但这些包只是起点；随着你的系统增长以及你对运维的经验增长，你很可能会发现想要在微服务间标准化的片段和更多细节。你可以，如果对你的特定系统和环境相关，标准化个人身份信息在日志中的脱敏方式；秘密（如数据库凭据）如何处理；事件如何馈送到你的数据湖；输出缓存如何处理；如何连接到数据库、队列和其他技术；等等。\
  \ certainly 不需要在所有微服务系统中标准化所有这些内容，但大多数微服务系统都会有自己的需要一些标准化和是微服务平台添加的良好候选的横切关注点列表。在以下各节中，你将创建这两个\
  \ NuGet 包中的每一个。\n\n### 11.4.1 创建日志包\n\n在本节中，你将通过执行以下操作创建 MicroserviceNET.Logging\
  \ NuGet 包：\n\n1. 从购物车微服务中提取第 9 章中创建的结构化日志记录和追踪配置到一个名为 MicroserviceNET.Logging 的类库中。\n\
  2. 添加一个便捷方法，使向 ASP.NET 管道添加监控和日志中间件变得容易。\n3. 从 MicroserviceNET.Logging 库创建 NuGet\
  \ 包。\n\n第一步是创建一个 .NET 类库并将其命名为 MicroserviceNET.Logging。你可以用你的 IDE 或 dotnet 来完成。然后，添加日志和追踪\n\
  \n\n\n将第 9 章的配置代码以及该代码使用的 NuGet 包迁移到 MicroserviceNET.Logging 库中。我会在这里重复该代码，但有关代码的解释请参考第\
  \ 9 章。\n向 MicroservicesNET.Logging 库添加 NuGet 包 Microsoft.Extensions.Hosting、Serilog.AspNetCore、Serilog.Sinks.ColoredConsole\
  \ 和 Serilog.Enrichers.Span。然后在 MicroserviceNET.Logging 项目中添加一个 HostBuilderExtensions.cs\
  \ 文件，并将以下代码放入其中，该代码将 Serilog 配置为记录器并使用跟踪信息丰富所有日志。\n\n## Listing 11.1 Logger configuration\
  \ from chapter 9\n\n```\nnamespace MicroserviceNET.Logging\n{\n    using Microsoft.Extensions.Hosting;\n\
  \    using Serilog;\n    using Serilog.Enrichers.Span;\n    using Serilog.Formatting.Json;\n\
  \n    public static class HostBuilderExtensions\n    {\n        public static IHostBuilder\
  \ UseLogging(this IHostBuilder builder) =>\n            builder.UseSerilog((context,\
  \ logger) =>\n            {\n                logger\n                    .Enrich.FromLogContext()\n\
  \                    .Enrich.WithSpan();\n                if (context.HostingEnvironment.IsDevelopment())\n\
  \                    logger.WriteTo.ColoredConsole(\n                        outputTemplate:\
  \ \"{Timestamp:yyyy-MM-dd HH:mm:ss} {TraceId} { Level:u3} {Message}{NewLine}{Exception}\"\
  );\n                else\n                    logger.WriteTo.Console(new JsonFormatter());\n\
  \            });\n    }\n```\n\n这就是 MicroserviceNET.Logging 项目中所需的所有代码。这将日志配置代码从购物车微服务中提取出来，并将其放置在一个方便的扩展方法\
  \ UseLogging 中，我们可以从使用该平台的每个微服务的 Program.cs 文件中调用它。\n\n## Listing 11.2 Using UseLogging\
  \ in a Program.cs\n\n```\nusing Microsoft.AspNetCore.Hosting;\nusing Microsoft.Extensions.Hosting;\n\
  using MicroserviceNET.Logging\n\nCreateHostBuilder(args).Build().Run();\n\nstatic\
  \ IHostBuilder CreateHostBuilder(string[] args) =>\n    Host.CreateDefaultBuilder(args)\n\
  \    .UseLogging()\n```\n\n```\n```csharp\n.ConfigureWebHostDefaults(\n    webBuilder\
  \ => { webBuilder.UseStartup<Startup>(); });\n```\n```\n\n要从 MicroserviceNET.Logging\
  \ 库创建 NuGet 包，可以使用 dotnet。转到项目文件夹——即包含 MicroserviceNET.Logging .csproj 文件的文件夹——并运行以下命令：\n\
  \n```\n```powershell\nPS> dotnet pack --configuration Release\n```\n```\n\n这将在 bin/Release\
  \ 中创建一个名为 MicroserviceNET.Logging.1.0.0.nupkg 的 NuGet 包。该包包含编译为程序集的 MicroserviceNET.Logging\
  \ 项目的代码。此外，该包需要我们在 MicroserviceNET.Logging 中安装的三个 Serilog 包和 Microsoft.Extensions.Hosting\
  \ 包，这意味着每当此包安装到项目中时，这四个包也会被安装。\n\n该包已准备好安装并在任意数量的微服务中使用。\n\n## 11.4.2 Creating a\
  \ package with monitoring endpoints\n\n在本节中，我们将以相同的方式创建另一个 NuGet 包。它将包含 Kubernetes\
  \ 期望的监控端点的健康检查代码。创建新包有三个步骤：\n\n- 创建一个名为 `MicroserviceNET.Monitoring` 的新类库。\n- 添加第\
  \ 9 章中的健康检查代码。\n- 使用 `dotnet pack` 构建包。\n\n一旦你创建了一个名为 MicroserviceNET.Monitoring\
  \ 的新类库，你应该向其中添加这些 NuGet 包，因为它们被健康检查代码使用：\n\n- `Microsoft.Extensions.DependencyInjection`\n\
  - `Microsoft.Extensions.Diagnostics.HealthChecks`\n- `Microsoft.AspNetCore.Http.Abstractions`\n\
  - `Microsoft.AspNetCore.Diagnostics.HealthChecks`\n\n添加健康检查有两个步骤。首先，它们被添加到服务集合中，然后添加到应用程序构建器中。第一部分我们放在\
  \ MicroserviceNET.Monitoring 库中的一个新文件 ServiceCollectionExtensions.cs 中。我们从第 9 章的购物车代码中提取添加健康检查到服务集合的代码，并补充了一些添加更多健康检查的便捷方法。\n\
  \n```\n```csharp\nnamespace MicroserviceNET.Monitoring\n{\n    using Microsoft.Extensions.DependencyInjection;\n\
  \    using Microsoft.Extensions.Diagnostics.HealthChecks;\n\n    public static class\
  \ ServiceCollectionExtensions\n    {\n```\n```\n\n```\nprivate const string Liveness\
  \ = \"liveness\";\nprivate const string Startup = \"startup\";\n\npublic static\
  \ IServiceCollection AddBasicHealthChecks(\n    this IServiceCollection services)\n\
  {\n    services.AddHealthChecks()\n        .AddCheck(\"BasicStartupHealthCheck\"\
  ,\n            () => HealthCheckResult.Healthy(), tags: new[] {Startup})\n     \
  \   .AddCheck(\"BasicLivenessHealthCheck\",\n            () => HealthCheckResult.Healthy(),\
  \ tags: new[] {Liveness});\n\n    return services;\n}\n\npublic static IServiceCollection\
  \ AddAdditionStartupHealthChecks<T>(\n    this IServiceCollection services) where\
  \ T : class, IHealthCheck\n{\n    services.AddHealthChecks().AddCheck<T>(nameof(T),\
  \ tags: new[] {\n        Startup});\n    return services;\n}\n\npublic static IServiceCollection\
  \ AddAdditionLivenessHealthChecks<T>(\n    this IServiceCollection services) where\
  \ T : class, IHealthCheck\n{\n    services.AddHealthChecks().AddCheck<T>(nameof(T),\
  \ tags: new[] {\n        Liveness});\n    return services;\n}\n}\n```\n\n添加一个基本的启动检查和一个基本存活检查。\n\
  \n使用 startup 进行标记以便后续使用。\n\n使用 liveness 进行标记以便后续使用。\n\n允许添加更多启动检查。\n\n允许添加更多存活检查。\n\
  \n这只是为启动和存活注册非常基础的——空的——健康检查。检查被标记为 startup 或 liveness，这将在我们将健康检查添加到应用程序构建器时使用。还有两个方法——AddAdditionStartupHealthChecks\
  \ 和 AddAdditionLivenessHealthChecks——使注册额外的检查变得容易，并将它们添加到启动或存活健康端点。\n\n第二步是将健康检查添加到应用程序构建器。我们向库中添加另一个文件。将其命名为\
  \ ApplicationBuilderExtensions 并填入以下代码。\n\n## Listing 11.4 Convenient extension\
  \ method for adding health endpoints\n\n```\nnamespace MicroserviceNET.Monitoring\n\
  {\n    using Microsoft.AspNetCore.Builder;\n    using Microsoft.AspNetCore.Diagnostics.HealthChecks;\n\
  \n    public static class ApplicationBuilderExtensions\n    {\n```\n\n```\npublic\
  \ static IApplicationBuilder\nUseKubernetesHealthChecks(this IApplicationBuilder\
  \ app) =>\n    app\n        .UseHealthChecks(\"/health/startup\",\n            new\
  \ HealthCheckOptions\n            {\n                Predicate = x => x.Tags.Contains(\"\
  startup\")\n            })\n        .UseHealthChecks(\"/health/live\",\n       \
  \     new HealthCheckOptions\n            {\n                Predicate = x => x.Tags.Contains(\"\
  liveness\")\n            });\n```\n\n添加我们在 Kubernetes 清单中使用的启动端点。\n\n添加所有标记为 startup\
  \ 的健康检查。\n\n添加我们在 Kubernetes 清单中使用的存活端点。\n\n添加所有标记为 liveness 的健康检查。\n\n健康检查上的标签用于确定它们属于哪个端点。这确保基本健康检查以及任何额外的健康检查都被添加到启动和存活端点。\n\
  \n现在我们准备好使用 dotnet pack 构建 NuGet 包并开始使用 MicroserviceNET.Monitoring 包。它将帮助我们确保使用它的所有微服务都公开相同的监控端点。\n\
  \n不过，在构建 NuGet 包之前，还有一个决定需要做出。在第 9 章中，我们还创建了一个在启动期间运行并检查数据库连接是否可以建立的 DbHealthCheck。如果这与你几乎所有的微服务都相关，你也可以将其添加到\
  \ MicroserviceNET.Monitoring 中。如果它只与一些微服务相关，我们就进入了一个灰色地带：如果足够多的微服务使用 SQL Server\
  \ 数据库，我们可以向我们的微服务平台添加另一个 NuGet 包并将 DbHealthCheck 添加到其中。然后微服务可以引入这个第三个包。\n\n作为提醒，我将重复\
  \ DbHealthCheck 的代码，重命名为 MsSqlStartupHealthCheck 以使用法更明确。\n\n## Listing 11.5 Startup\
  \ health check that uses an SQL Server database\n\n```\nnamespace MicroserviceNET.Monitoring\n\
  {\n    using System.Data.SqlClient;\n    using System.Net.Http;\n    using System.Threading;\n\
  \    using System.Threading.Tasks;\n    using Dapper;\n    using Microsoft.Extensions.Diagnostics.HealthChecks;\n\
  \    using Microsoft.Extensions.Logging;\n\n    public class MsSqlStartupHealthCheck\
  \ : IHealthCheck\n    {\n        private readonly HttpClient httpClient;\n\n   \
  \     public MsSqlStartupHealthCheck(ILoggerFactory logger)\n        {\n```\n\n\
  新名称表示为 MS SQL server\n\n\n\n```\nthis.httpClient = new HttpClient();\n}\n\npublic\
  \ async Task<HealthCheckResult> CheckHealthAsync(\n    HealthCheckContext context,\n\
  \    CancellationToken cancellationToken)\n{\n    await using var conn = new SqlConnection(...);\n\
  \    var result = await conn.QuerySingleAsync<int>(\"SELECT 1\");\n    return result\
  \ == 1\n        ? HealthCheckResult.Healthy()\n        : HealthCheckResult.Degraded();\n\
  }\n}\n```\n\n请注意，`MsSqlStartupHealthCheck` 实现了 `IHealthChecks`，这意味着它可以很好地融入之前创建的\
  \ `AddAdditionStartupHealthChecks`。微服务可以使用 `MicroserviceNET.Monitoring` 包和 `MsSqlStartupHealthCheck`。\n\
  \n## 清单 11.6 使用微服务平台注册健康检查\n\n```\npublic class Startup\n{\n    public void ConfigureServices(IServiceCollection\
  \ services)\n    {\n        services\n            .AddBasicHealthChecks()\n    \
  \        .AddAdditionStartupHealthChecks<MsSqlStartupHealthCheck>();\n    }\n}\n\
  ```\n\n微服务可以通过利用所创建的应用构建器扩展，在标准化的监控端点中公开这些检查。\n\n## 清单 11.7 添加标准化的监控端点\n\n```\n\
  public void Configure(IApplicationBuilder app)\n{\n    app.UseRouting();\n    app.UseKubernetesHealthChecks();\n\
  \    app.UseEndpoints(endpoints => endpoints.MapControllers());\n}\n```\n\n我们已经创建了微服务平台的第一版，它有助于标准化我们的微服务日志、追踪和暴露监控端点。要使用该平台，微服务需要安装两个\
  \ NuGet 包——`MicroserviceNET.Logging` 和 `MicroserviceNET.Monitoring`——并在 `Program.cs`\
  \ 中使用宿主构建器扩展来设置日志记录，在 `Startup` 类中使用服务集合和应用构建器上的扩展来设置监控端点。\n\n在开发微服务系统的过程中，你很可能会发现更多适合在平台中实现的横切关注点。其中一些可以很好地融入\
  \ ASP.NET 的中间件管道中，这正是下一节的主题。\n\n## 11.5 ASP.NET 管道\n\n我们在第 1 章中简要提到了中间件，但现在我们该仔细看看了。ASP.NET\
  \ 允许我们放入一些中间件，这些中间件会在每个请求时执行。每个请求依次流经每一部分中间件。这些中间件一起构成了请求流经的管道。\n\n图 11.6 中的设置是一个包含一段中间件的管道。ASP.NET\
  \ 定义了管道各部分之间通信所用的接口。这是一个所有管道部分都实现的统一接口：每一段中间件都实现该接口。通过拥有一个统一的接口，你可以按需组合管道。你可以向其中添加更多中间件，可以移除部分中间件，也可以调换它们的顺序。因为它们都使用相同的接口，所以可以根据需要重新排列。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_276_0.png)\n\n图 11.6 管道由中间件构建而成，这些中间件通过统一的标准化接口进行通信。\n\
  \n当请求和响应通过中间件时，中间件可以读取它们甚至修改它们。中间件之间使用的接口是 ASP.NET 定义的 `RequestDelegate`：\n\n```\n\
  public delegate Task RequestDelegate(HttpContext context);\n```\n\n这个委托允许中间件检查和修改\
  \ `HttpContext`，并且只要中间件知道下一段中间件，就可以将其传递给管道中的下一段中间件，正如 11.3 和 11.6 所示。\n\n`RequestDelegate`\
  \ 是一种委托类型，我们可以选择用 lambda 函数来实现它，这是一种实现中间件的轻量级方式。不过有一个小复杂点：中间件应该是中间件管道的一部分，因此它需要知道管道中的下一段中间件。我们用一个小间接层来解决：创建一个\
  \ lambda，它接收下一段中间件，并返回一个实现 `RequestDelegate` 的 lambda。让我们看一下代码：\n\n```\nnext =>\n\
  \  ctx =>\n  {\n```\n\n下一段中间件\n\n内部 lambda 就是中间件。\n\n```\nSystem.Console.WriteLine(\"\
  Got request\");\nreturn next(ctx);\n}\n```\n\n让我们分解这段代码。首先，`next` 的类型是 `RequestDelegate`，并且应当是管道中的下一段中间件。其次，`ctx`\
  \ 的类型是 `HttpContext`。这意味着内部 lambda 接收一个 `HttpContext` 作为参数，并返回一个 `Task`：\n\n```\n\
  ctx =>\n{\n    System.Console.WriteLine(\"Got request\");\n    return next(ctx);\n\
  }\n```\n\n`ctx` 的类型是 `HttpContext`。\n\n`next` 是一个 `RequestDelegate`，因此它返回一个 `Task`。\n\
  \n既然我们已经确定了内部 lambda 实现了 `RequestDelegate`，我们就可以看到外部 lambda 如何用于构建管道。用一段中间件调用外部\
  \ lambda，会创建一个包含两段中间件的管道：先是内部 lambda 中的中间件，然后是传入的中间件：\n\n```\nRequestDelegate secondMiddleware\
  \ = ...\nvar fisrstMiddleware = next =>\n    ctx =>\n    {\n        System.Console.WriteLine(\"\
  Got request\");\n        return next(ctx);\n    }\n\nRequestDelegate pipeline =\
  \ firstMiddleware(secondMiddleware);\n```\n\n前面清单中的中间件\n\n来自某处的中间件\n\n管道也实现了 `RequestDelegate`。\n\
  \n管道本身也是一个 `RequestDelegate`，这一事实使得构建更长的管道以及组合管道成为可能。在启动期间，ASP.NET 会构建管道，以便在 HTTP\
  \ 请求到来时准备好处理它们。\n\n`HttpContext` 包含与 HTTP 请求和响应相关的所有内容。在请求侧，这包括所有请求头、请求路径和请求体。同样，在响应侧，`HttpContext`\
  \ 包括响应头、状态码和响应体。有了所有这些访问权限，中间件可以对 HTTP 请求和响应做任何事情。\n\n`RequestDelegate` 是一个简单的类型，但它实现了一个强大的概念。中间件管道既灵活又强大，我觉得它非常有用。接下来，我将讨论何时使用\
  \ ASP.NET 中间件，以及何时使用 MVC 的功能。\n\n### 11.5.1 什么属于中间件？\n\nASP.NET 为你提供了一种构建中间件管道的方法，每个请求都会流经该管道。管道的不同部分可以响应请求并向响应写入内容。同样，MVC\
  \ 让你可以处理请求并编写响应。使用 MVC，你主要在控制器的方法中处理请求，但也可以添加在控制器方法之前和之后执行的代码。你可以通过向 MVC 配置添加 MVC\
  \ 过滤器来实现这一点。但什么该放在哪里？\n\n为了决定在中间件中实现什么，以及在 MVC 过滤器中实现什么，你可以遵循几条简单的经验法则：\n\n- * 处理横切关注点且旨在跨多个微服务使用的代码属于中间件。这些可重用的代码片段应该具有较少的依赖关系，这样它们就不会对使用它们的微服务强制施加太多技术选择。因此，你希望它们独立于\
  \ MVC。\n- * 处理单个微服务的领域或业务规则的代码属于 MVC 控制器后面的应用程序代码。这类代码不依赖于 HTTP，因此不需要依赖 ASP.NET\
  \ 或 MVC。将它放在单独组件中——例如领域模型——可以使业务和领域规则的实现保持干净和可读。\n- * 以特定端点特有的方式处理 HTTP 请求和响应的代码属于\
  \ MVC 控制器。这段代码解释传入的 HTTP 请求，然后将控制权移交给领域模型。同时，这种解释与 HTTP 和端点的细节紧密耦合，使得控制器成为它的合适位置。\n\
  - * 处理横切某个微服务内所有端点、但不横切多个微服务的关注点的代码，通常属于中间件，但并不总是如此。关注点越技术性，我越倾向于中间件；关注点中的领域或业务逻辑越多，我越倾向于\
  \ MVC 控制器，或者在极少数情况下，使用 MVC 过滤器。\n\n我已经介绍了中间件并讨论了它的用途。现在我们转向编写和测试中间件。\n\n## 11.6\
  \ 编写中间件\n\n我们将介绍两种编写中间件并将其挂接到 ASP.NET 管道中的方法：\n\n- * 作为 lambda——你已经在前面章节中看到了这种风格，我们将在下一节中在此基础上继续构建\n\
  - * 作为具有实现中间件签名的方法的类——在我们再次查看 lambda 风格之后，你将看到这种风格。\n\n这两种风格是等价的，你可以很容易地在它们之间切换。为某段特定中间件选择哪一种，只是品味问题。\n\
  \n### 11.6.1 作为 lambda 的中间件\n\n你已经看到了用 lambda 函数实现的中间件。在本节中，我将向你展示如何在 `Startup.cs`\
  \ 文件中将基于 lambda 的中间件添加到 ASP.NET 管道中。\n\n\n\n\n这就是你之前见过几次的 lambda 中间件：\n\n```\nnext\
  \ =>\nctx =>\n{\n    System.Console.WriteLine(\"Got request\");\n    return next(ctx);\n\
  }\n```\n\nnext 是一个 RequestDelegate。\n\n内部 lambda 是一个 RequestDelegate，它接收一个 HttpContext。\n\
  \n在 Startup.cs 中，我们可以通过调用应用程序生成器上的 Use 方法向管道添加中间件：\n\n```\npublic class Startup\n\
  {\n    public void Configure(IApplicationBuilder app)\n    {\n        app.Use(next\
  \ => ctx =>\n        {\n            Console.WriteLine(\"Got request in lambda middleware\"\
  );\n            return next(ctx);\n        })\n        ...\n    }\n}\n```\n\nUse\
  \ 会向管道添加一段中间件。\n\n这就是向管道添加一段中间件所需的全部操作。现在每个传入的请求都会经过我们这段小型中间件。\n\n## 11.6.2 中间件类\n\
  \n将中间件编写为 lambda 函数是可行的，但当中间件更复杂时，就会变得有些困难。在这种情况下，使用类来实现中间件会更好。\n\n要使用类来实现中间件，可以创建一个类，该类包含一个签名是\
  \ RequestDelegate 的方法。\n\n**清单 11.8 在类中实现的中间件**\n\n```\npublic class ConsoleMiddleware\n\
  {\n    private readonly RequestDelegate next;\n\n    public ConsoleMiddleware(RequestDelegate\
  \ next)\n    {\n        this.next = next;\n    }\n\n    public Task Invoke(HttpContext\
  \ ctx)\n    {\n        Console.WriteLine(\"Got request in class middleware\");\n\
  \        return this.next(ctx);\n    }\n}\n```\n\n- 在实例化时持有 next\n- 具有 RequestDelegate\
  \ 签名\n\n这种风格的中间件在构造函数中接收下一个中间件，并将其存储在私有变量中，以便可以在实现中间件行为的 Invoke 方法中按需调用。要将这种中间件添加到\
  \ ASP.NET 管道中，需要实例化它，然后使用 Invoke 方法作为委托：\n\n```\napp.Use(next => new ConsoleMiddleware(next).Invoke());\n\
  ```\n\n或者，我们可以使用更方便的扩展方法 UseMiddleware，它通过反射查找 Invoke 方法，本质上做了相同的事情：\n\n```\napp.UseMiddleware<ConsoleMiddleware>()\n\
  ```\n\n调用 UseMiddleware 是添加基于类的中间件的首选方式。之所以首选，是因为它更易于阅读，还因为它允许我们使用依赖注入：中间件类构造函数中除\
  \ next 之外的任何依赖项都将从服务集合中解析，就像 MVC 控制器中的依赖项一样。这为使用中间件做更多事情打开了大门。\n\n现在你已经知道如何将中间件实现为\
  \ lambda 和类。接下来，让我们看看如何测试中间件。\n\n## 11.7 测试中间件和管道\n\n测试 ASP.NET 中间件很简单：为要测试的场景创建一个\
  \ HttpContext，然后调用中间件，传入该 HttpContext。\n\n> 注意：如第 8 章所述，你可以从 Visual Studio 或使用 dotnet\
  \ 创建测试项目。这些项目使用 xUnit，这也是这里使用的测试框架。\n\n有一个小问题需要解决：为了调用中间件，你首先需要为它提供一个 next 值。你可以通过传入一个什么都不做的\
  \ RequestDelegate 来解决这个问题：\n\n```\nRequestDelegate noOp = _ => Task.CompletedTask;\n\
  ```\n\n![](img/608267d7803dc57a1a896ad121f37868_280_0.png)\n\n在测试中，你将使用空操作中间件作为桩，提供给被测中间件。\n\
  \n有了这个，你就可以为中间件编写测试了。假设你要测试以下基于类的中间件，它处理从 oldpath 到 newpath 的重定向。\n\n**清单 11.9 一段示例中间件**\n\
  \n```\nnamespace Middleware\n{\n    public class RedirectingMiddleware\n    {\n\
  \        private readonly RequestDelegate next;\n\n        public RedirectingMiddleware(RequestDelegate\
  \ next)\n        {\n            this.next = next;\n        }\n\n        public Task\
  \ Invoke(HttpContext ctx)\n        {\n            if (ctx.Request.Path.Value.TrimEnd('/')\
  \ == \"/oldpath\")\n            {\n                ctx.Response.Redirect(\"/newpath\"\
  , permanent: true);\n                return Task.CompletedTask;\n            }\n\
  \n            return this.next(ctx);\n        }\n    }\n}\n```\n\n如果请求路径是 oldpath，它会以重定向作为响应。否则，它会调用管道的其余部分。\n\
  \n你可以为这个中间件编写一个测试，以验证 oldpath 确实被重定向到了 newpath。\n\n**清单 11.10 直接调用中间件的测试**\n\n```\n\
  namespace MiddlewareTests\n{\n    using System.Threading.Tasks;\n    using Microsoft.AspNetCore.Http;\n\
  \    using Middleware;\n    using Xunit;\n\n    public class RedirectingMiddleware_should\n\
  \    {\n        private readonly RedirectingMiddleware sut;\n\n        public RedirectingMiddleware_should()\n\
  \        {\n            this.sut = new RedirectingMiddleware(_ => Task.CompletedTask);\n\
  \        }\n\n        [Fact]\n        public async Task redirect_oldpath_to_newpath()\n\
  \        {\n            var ctx = new DefaultHttpContext\n            {\n      \
  \          Request = {Path = \"/oldpath\"}\n            };\n\n            await\
  \ this.sut.Invoke(ctx);\n\n            Assert.Equal(StatusCodes.Status301MovedPermanently,\
  \ ctx.Response.StatusCode);\n            Assert.Equal(\"/newpath\", ctx.Response.Headers[\"\
  Location\"]);\n        }\n    }\n}\n```\n\n- 使用 no-op 作为 next 创建中间件\n- 为此测试设置 HttpContext\n\
  - 调用被测中间件\n- 对 HttpContext 的内容进行断言\n\n此测试的模式如下：\n\n1. 设置一个模拟你想要测试的场景的 HttpContext\
  \ 环境。这是使用 DefaultHttpContext 类型完成的。\n2. 创建被测中间件，并传入一个 no-op 作为下一个中间件。这会终止管道，因此对被测中间件的\
  \ Invoke 调用也会终止。\n3. 使用测试开始时设置的 HttpContext 调用中间件。\n4. 对 HttpContext 的内容或被测中间件预期处理的其他内容进行断言。例如，如果被测中间件创建了应该是\
  \ HttpContext 一部分的响应，因此可以通过 HttpContext.Response 属性访问。\n\n你可以使用相同的模式创建更多测试——针对 oldpath\
  \ 之外的其他路径。请参见以下示例：\n\n```\n[Fact]\npublic async Task not_redirect_other_paths()\n\
  {\n    var ctx = new DefaultHttpContext\n    {\n        Request = {Path = \"/otherpath\"\
  }\n    };\n\n    await this.sut.Invoke(ctx);\n\n    Assert.NotEqual(\n        StatusCodes.Status301MovedPermanently,\n\
  \        ctx.Response.StatusCode);\n    Assert.DoesNotContain(\"Location\", ctx.Response.Headers);\n\
  }\n```\n\n此测试遵循与之前测试完全相同的模式，这通常就是您测试中间件的方式。\n\n要测试由多个中间件组成的较长管道，你可以将一个中间件作为 next\
  \ 传入另一个中间件来构建管道，就像你将 noop 传入你的中间件一样。管道构建完成后，其余部分就像之前的中间件测试一样。你将中间件组合成一个管道，可以向其传递\
  \ HttpContext，并对整个管道运行的结果进行断言。\n\n现在你已经学会了如何编写和测试 ASP.NET 中间件，你可以准备好在项目的特定上下文中使用中间件来处理横切关注点。从一个相当简单的微服务平台开始，涵盖结构化日志、跟踪和监控，你可以在此基础上进一步扩展其他横切关注点。这样，你可以确保继续高效地创建新的微服务，同时处理横切关注点，从运维角度来看，这会让你的工作更轻松。\n\
  \n## 总结\n\n- 因为在微服务系统中，你经常需要构建新的微服务，所以你需要能够快速、轻松地从零开始构建一个新的微服务。\n- 为了满足监控、日志记录和安全方面的横切需求，系统中的所有微服务都需要做一些事情。具体要做哪些事情因系统而异。\n\
  - 你应该为你的微服务系统开发一个可重用的微服务平台。有了这样的平台，就可以轻松创建新的微服务，这些微服务在日志记录、监控和其他横切关注点方面符合预期行为。\n\
  - 一个可重用的微服务平台应该只处理横切的技术关注点。\n- 可重用的微服务平台不应该处理领域逻辑，因为这在各个微服务之间是不同的。\n- NuGet 是分发微服务平台的一种好格式。\n\
  - 你使用 `dotnet pack` 命令来创建 NuGet 包。\n- 你可以创建 NuGet 包来实现以下目的：\n  - 标准化微服务的监控端点\n \
  \ - 标准化结构化日志\n  - 标准化跟踪\n  - 强制执行系统拥有的任何其他技术特定策略\n- 你可以从库构建 NuGet 包。\n- 你可以在微服务中使用自己的自定义\
  \ NuGet 包。\n- 你可以利用 ASP.NET 中间件来处理横切关注点。\n- 你可以轻松地为 ASP.NET 中间件编写测试。\n\n\n\n# 第4部分"
- "## 构建应用程序\n\n本书的这一部分将为全貌画上点睛之笔：如何为终端用户创建应用程序。你已经学会了如何将系统拆分为微服务，以及如何创建这些微服务。在第12章中，你将在微服务之上添加图形用户界面（GUI），让终端用户能够充分利用其功能。\n\
  \n## 在微服务之上创建应用程序\n\n**本章涵盖**\n\n- 在微服务系统之上构建终端用户应用程序\n- 理解复合应用、API网关和后端为前端设计模式\n\
  - 在Web应用程序中使用服务端渲染和客户端渲染\n\n到目前为止，我们一直专注于在微服务中实现业务能力，并通过HTTP API暴露这些能力。但终端用户使用的并不是HTTP\
  \ API，而是Web应用、移动应用、桌面应用、智能电视、VR头显以及设备上其他面向人类界面的应用程序。为了让终端用户能够访问微服务的全部能力，我们需要在微服务之上实现应用程序。本章正是为此而设：我们将从设计单个微服务转向把所有微服务整合到一个支持为终端用户构建应用程序的架构中。\n\
  \n我们将从一次宽泛、非技术性的讨论开始，探讨如何在微服务系统之上构建应用程序。然后，我们将深入介绍三种用于实现应用程序的具体架构模式：复合应用、API网关和后端为前端模式。\n\
  \n## 12.1 微服务系统的终端用户应用程序：一个还是多个？\n\n从用户角度和技术角度来看，构建面向终端用户的应用程序有多种方式。我们将从用户角度出发，探讨一系列在应用程序中向终端用户呈现微服务功能的方法：从提供系统全部功能的通用应用程序，到一组小型专用应用程序，每个应用程序仅提供少数几种能力。这两种功能呈现方式代表了一个范围谱系的两端，如图12.1所示。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_287_0.png)\n\n图12.1 在微服务系统之上可以构建多种多样的应用程序类型，从通用应用程序到高度专用的应用程序。\n\
  \n在两个极端之间，还存在许多其他构建应用程序的选项，这些应用程序覆盖微服务系统功能的大范围或小范围。特定微服务系统的应用程序应落在谱系的哪个位置，取决于该特定系统的上下文：其终端用户、功能等。\n\
  \n谱系的两端各有优点。接下来两节将对其进行讨论，以便让你体会到微服务系统提供功能的各种方式的广度。决定落在谱系的哪个位置，会影响你的应用程序应如何构建以及应使用哪种设计模式。\n\
  \n### 12.1.1 通用应用程序\n\n微服务系统可以提供大量功能。例如，考虑一个保险公司的业务系统。该系统驱动业务流程，包括销售保单、制定价格和处理客户索赔。用户包括：\n\
  \n- 打电话招揽潜在客户的销售人员\n- 根据估算的未来索赔和收入制定保单价格并评估业务风险的精算师\n- 评估客户想要投保及客户索赔货物的评估师\n- 调查和解决客户索赔的理赔员\n\
  - 管理用户和权限的IT人员\n\n你在不同的微服务中实现保险系统的所有不同业务能力，但也可以决定实现一个覆盖所有功能、供所有用户使用的通用应用程序。这可以视为*通用应用程序*。它可以是任何类型的应用程序——例如Web或桌面应用程序。\n\
  \n多种原因可能促使你决定实现一个呈现系统所有功能的通用应用程序。例如，保险系统中的一些用户可能承担不止一种职能，例如同时从事评估工作的理赔员。不同类型用户所需的功能之间也可能存在重叠。\n\
  \n通过管理他们的权限，你仍然可以限制每个用户在通用应用程序中能做什么。但他们都在使用同一个应用程序，而该应用程序提供了系统的所有功能。\n\n### 12.1.2\
  \ 专用应用程序\n\n在微服务系统之上构建应用程序的另一个选项是构建大量小型专用应用程序。这在某些方面与通用应用程序方法相反：你拥有许多高度专用的应用程序，每个应用程序只呈现整个系统的一小部分功能。继续以保险公司的业务应用程序为例，你可能会有以下独立的专用应用程序：\n\
  \n- 浏览公司提供的保单目录\n- 为潜在客户创建报价\n- 为客户创建保险保单\n- 创建关于当前有效保险保单的报告\n- 创建未来索赔成本预测\n- 登记和调查索赔\n\
  - 评估投保货物\n- 处理理赔\n\n采用这种方法，用户必须使用多个应用程序。这乍听起来可能是一种糟糕的用户体验，但真的是这样吗？如果你选择将这些应用程序实现为Web应用，它们可以轻松地相互链接，即使功能分布在许多小应用程序中，也能营造出连贯的体验。而且，“做一件事并把它做好”的理念可以为每项功能带来非常出色的应用程序。例如，Facebook有一款名为Selfies\
  \ for Messenger的Android应用，它只做一件事：拍自拍并通过Facebook Messenger发送。该应用精简了这一单一功能。\n\n虽然我只提到了通用应用程序和专用应用程序，但这并不是仅有的两种可能性。选项是一个谱系（再次如图12.2所示），从提供系统全部功能的一个大型应用程序，到一长串单一能力应用程序。其他可能性包括：\n\
  \n- 将大型一体化应用程序拆分为两个应用程序，第一个包含管理功能，第二个包含所有其他功能\n- 将某些单一能力应用程序合并为稍大的应用程序，覆盖某一类用户所需的所有功能\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_289_0.png)\n\n图12.2 在微服务之上可以构建多种多样的应用程序类型。\n\
  \n就保险公司而言，一种折中方法是按用户类型创建一个应用程序。销售人员将获得一个包含他们所需全部功能的销售应用程序，从寻找线索到签署交易。同样地，精算师、评估师、理赔员和IT人员也会获得适合其使用方式的应用程序。\n\
  \n尽管这种方法避免了大型通用应用程序和海量单一用途应用程序的复杂性，但它也有自己的问题：功能可能会在应用程序之间重复，有些用户承担多个角色，等等。没有一种唯一正确的方法；你需要根据用户体验方面的考虑而非技术方面的考虑，来决定你处于谱系的哪个位置。\n\
  \n现在，让我们转向更技术性的一面，看看在微服务之上构建应用程序的三种技术模式。\n\n## 12.2 在微服务之上构建应用程序的模式\n\n本节讨论复合应用、API网关和后端为前端设计模式。我将逐一解释每种模式，并讨论其优缺点。然后，我会讨论每种模式的适用时机。\n\
  \n### 12.2.1 复合应用：在前端集成\n\n在微服务之上构建应用程序的第一种模式是复合应用。复合应用由来自多个地方（在微服务情况下，来自不同微服务）的功能组成，通过与每个微服务直接通信来实现。在这种模式中，每个微服务既提供功能，也提供该功能的UI。微服务之间可以相互通信来执行任务；复合应用并不关心这一点。\n\
  \n\n\n## 图 12.3 上下文\n\n图 12.3 回到了保险示例，其中有一个通用型应用，包含了系统的全部功能。保险系统是使用微服务构建的，因此要通过该应用提供系统的全部功能，应用需要借助许多微服务的业务能力。系统中的微服务数量比图中显示的要多，应用不会直接利用所有这些微服务。应用将这些功能组合成一个应用——因此就有了*复合应用*这一术语。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_290_0.png)\n\n**图 12.3** 一个复合通用型应用使用许多不同的微服务，每个微服务既提供功能，也为该功能提供\
  \ UI。\n\n当你作为复合应用在微服务系统前端构建通用型应用时，微服务既提供功能，也提供伴随这些功能的 UI。因此，应用的 UI 是由来自不同微服务的更小\
  \ UI 组成的复合体。图 12.4 展示了保险应用 UI 的示例结构：它由四个部分组成，每个部分都来自一个既提供功能又提供 UI 的微服务。\n\nUI 组合的实现方式取决于构建客户端所用的技术。例如，对于桌面\
  \ Windows Presentation Foundation（WPF）应用，你可以使用 Managed Extensibility Framework（MEF；http://mng.bz/6NKA）将组件动态加载到应用中，每个组件都可以有自己的\
  \ UI 部分。对于 Web 应用，可以通过将来自微服务的 HTML 片段和 JavaScript 包加载到主应用中，再使用 JavaScript 将它们添加到\
  \ DOM 来构建 UI。在这两种情况下，微服务都同时提供功能和 UI。\n\n- 保险单列表来自保单目录微服务。\n- 理赔登记表单来自理赔登记微服务。\n\
  - 理赔结算表单来自理赔结算微服务。\n- 评估表单来自评估微服务。\n\n![](img/608267d7803dc57a1a896ad121f37868_291_0.png)\n\
  \n**图 12.4** 复合应用从不同微服务获取 UI 组件，并将它们组合成一个有凝聚力的复合 UI。\n\n复合应用并不都是通用型应用；它们也可以是较小的应用。例如，如果保险应用按用户类型分别提供应用，那么每个应用都必须提供属于不同业务能力、因而属于不同微服务的功能。因此，每个按用户类型划分的应用都可以构造成一个复合应用。\n\
  \n### 优点\n\n在构建复合应用时，UI 会根据业务能力拆分为更小的部分，就像功能按照业务能力分布在各个微服务中一样。这意味着每个业务能力的 UI 都在该能力代码的附近实现，并与该代码一同部署。由于复合应用从微服务中获取该业务能力的\
  \ UI，因此每当微服务 UI 更新时，应用也会随之更新。这意味着通过将系统拆分为小而专注的微服务所获得的敏捷性，也同样适用于应用 UI。\n\n### 缺点\n\
  \n复合应用负责集成整个微服务系统中所实现的所有功能。这可能是一项复杂的任务：一个微服务系统中可能有多个业务能力，而应用的 UI 可能不会按完全相同的界线拆分，导致页面或屏幕包含来自多个不同微服务的\
  \ UI，但又需要让最终用户感觉它们像一个单一的屏幕。\n\n这种复杂性可能意味着复合应用需要深入了解微服务的工作方式，特别是它们的 UI 工作方式。如果复合应用开始对微服务的\
  \ UI 做过多的假设，它就会对每个微服务的变化很敏感，因此整个应用可能因为单个微服务中的 GUI 变化而崩溃。如果你最终陷入这种情况，就会失去使用复合应用的主要优势之一——敏捷性。\n\
  \n复合应用可以很好地工作——但前提是你能避免进行复杂的集成。\n\n## 12.2.2 API 网关\n\n在微服务之上构建应用的第二种模式是 API 网关。API\
  \ 网关是一个微服务，具有公开的 HTTP API，覆盖系统全部功能，但本身不实现任何功能。相反，API 网关将所有事情委托给其他微服务。实际上，API 网关就像应用与微服务系统之间的适配器。\n\
  \n当你在采用 API 网关的微服务系统前端构建应用时，应用无需知道系统功能如何在微服务之间拆分，甚至无需知道系统使用了微服务。应用只需要知道一个微服务：API\
  \ 网关。\n\n在本书中，你已经看到了电子商务系统中购物车的示例，包括 API 网关。图 12.5 展示了一个从应用发送到 API 网关的、向用户购物车添加商品的请求，API\
  \ 网关将其委托给其他微服务来处理该请求。在这种情况下，API 网关的作用是为应用提供单一入口，从而简化系统接口，使应用不必直接与多个微服务交互。\n\n你可以在\
  \ API 网关前端构建任何类型的应用，从使用 API 网关所提供一切功能的通用型应用，到仅使用 API 网关一小部分功能的专业化单能力应用，以及介于两者之间的各种应用。\n\
  \n**图 12.5** API 网关是应用的单一入口。来自应用的任何请求都到达 API 网关，API 网关再将请求委托给微服务系统的其余部分来处理。\n\n\
  ### 优点\n\nAPI 网关模式的主要好处是，它使应用与系统如何分解为微服务的方式很好地解耦，并完全对应用隐藏这一点。在多个应用具有重叠功能，或某些应用由第三方构建的情况下，使用\
  \ API 网关模式有助于实现以下目标：\n\n- 保持构建应用的低进入门槛\n- 保持公共 API 稳定\n- 保持公共 API 向后兼容\n\n### BFF\
  \ 模式上下文\n\nBFF 的意义在于为构建在其之上的单一应用提供支持。这意味着应用和 BFF 是紧密耦合的：BFF 暴露应用所需的功能，并以尽可能简化应用编写的方式实现这一点。\n\
  \n### 优点\n\n使用 BFF 模式，每个应用都可以使用恰好满足其需求的 API。使用 API 网关时，随着你不断向其中添加越来越多的功能，它可能会变得臃肿。使用\
  \ BFF 时，这种风险较小，因为 BFF 不必覆盖系统中的所有内容，只需覆盖它所服务应用所需的功能。\n\n判断何时可以从 BFF 中移除某些内容是比较容易的：当它所服务的应用没有任何活跃版本使用该功能时。相比之下，对于前端有多个应用的\
  \ API 网关，只有当任何应用的任何版本都不使用某个功能时，才能将其从 API 网关中移除。总而言之，BFF 提供了一种既能简化应用开发，又能让服务端保持专注且分解良好的方式。\n\
  \n### 缺点\n\n在你有多个应用向最终用户提供相似或重叠功能的情况下——例如同时拥有面向同一类最终用户的 iOS 应用和 Android 应用——BFF\
  \ 模式会导致多个 BFF 之间出现重复代码。这带来了重复代码常见的缺点：每次对重复部分进行修改时都要重复工作，并且重复部分往往会随着时间推移相互偏离，最终在不同应用中产生略有差异的行为。\n\
  \nBFF 模式可以在将集成负担放在应用上，和创建一个随时间推移可能变得过大的 API 网关之间，取得一个良好的平衡。\n\n## 12.2.4 何时使用每种模式\n\
  \n既然你已经了解了为微服务系统构建最终用户应用的三种模式，那么不可避免的问题是选择哪一种。这三种模式都有价值，也都有用，所以我不会推荐其中任何一种。但当你准备构建应用时，你必须做出选择。我是基于以下问题来做选择的：\n\
  \n- *你希望将多少智能放入应用中？*\n\n对于仅在公司防火墙内、且仅在公司机器上使用的业务应用，你可能会选择构建一个包含大量智能的桌面应用。在这种情况下，复合应用模式显然是合适的选择。\n\
  \n对于面向公众的电子商务应用，它需要在任何浏览器中运行，并且存在有人试图入侵应用的风险，你可能会倾向于避免将智能放入应用中，这使得复合应用模式的吸引力降低。\n\
  \n\n\n\n- *是否有不止一个应用？如果有，这些应用之间有何不同？*\n\n如果你在应用中没有投入太多智能，并且只有一个应用，或者所有应用都提供相似的功能——甚至以相似的方式提供——API\
  \ 网关可能是一个不错的选择。\n\n如果有多个应用，并且它们提供不同的功能集合，BFF 模式是一个不错的选择。使用 API 网关或使用 BFF，智能位于后端。只要\
  \ API 网关保持内聚——也就是说，只要 API 网关公开的所有端点集合在应用应如何使用它们以及它们的结构方面具有一定的一致性——API 网关就能很好地工作。\n\
  \n如果某些端点遵循远程过程调用（RPC）风格，而其他端点遵循表述性状态转移（REST）风格，它们就是不一致的，API 网关代码库中的内聚性可能很低。在这种情况下，你应该考虑\
  \ BFF 模式。使用 BFF，你可以让某些应用在一个 BFF 中使用 RPC 风格的 API，而其他应用在另一个 BFF 中使用 REST API，而不会损害内聚性。每个\
  \ BFF 可以自行保持内聚和一致，但你不需要在 API 风格方面在 BFF 之间保持一致。\n\n- *系统有多大？*\n\n对于一个功能暴露量很大的大型系统，API\
  \ 网关可能会变成一个难以管理的代码库，暴露出单体架构的许多缺点。对于大型系统，使用多个 BFF 可能比一个庞大的 API 网关更好。另一方面，如果系统不是很大，API\
  \ 网关可能比 BFF 更简单。\n\n值得注意的是，你不需要为所有应用做出相同的选择。你可以先使用 API 网关并在其上构建几个应用，但随后决定一个采用创新方法的新应用不适合\
  \ API 网关的工作方式，并为该新应用提供一个 BFF。同样，你可能有使用复合应用模式的内部面向应用，同时又有通过 API 网关或 BFF 的外部面向应用。\n\
  \n## 12.2.5 客户端渲染还是服务器端渲染？\n\n我已经讨论了构建微服务应用的三种模式：复合应用、API 网关和 BFF。如果你使用这些模式构建 Web\
  \ 应用，还有一个问题需要解决：是否使用服务器端或客户端渲染？也就是说，你是否应该在服务器上生成可直接使用的 HTML——例如使用 Razor (http://mng.bz/6m4R)\
  \ 或 Blazor 服务器端 (http://mng.bz/o8ZD)——还是应该在 JavaScript 应用中渲染 HTML，使用 Angular (https://angular.io/)、Vue.js\
  \ (https://vuejs.org/)、React (https://reactjs.org/) 或 Blazor 客户端 (http://mng.bz/nrZd)\
  \ 等众多应用框架之一？\n\n这同样是一个没有明确答案的问题，完全取决于你想要构建的应用。该应用有多动态？它更关心处理数据还是展示和输入数据？应用越动态，其工作流程越是关于处理和操作数据，我就越倾向于客户端渲染；而应用越静态，其工作流程越是关于查看和输入数据，我就越倾向于服务器端渲染。关键点在于，客户端和服务器端渲染之间的选择取决于你想要构建的应用，而不是你选择在服务器端使用微服务架构这一事实。\n\
  \n所有三种模式都支持服务器端和客户端渲染。更进一步，它们支持混合服务器端和客户端渲染，使得应用的某些部分是服务器端渲染的，而其他部分是客户端渲染的。例如，保险系统中的保单目录在大多数情况下是静态的且只读的；将其在服务器端渲染可能更有意义。另一方面，估值计算器是一个更动态的组件，允许用户在保存最终结果之前随意调整参数；它很适合在\
  \ JavaScript 应用中进行客户端渲染。这两者可以在同一个应用中共存：\n\n- 如果你构建的是复合应用，它可以同时引入服务器端渲染的保单目录以及估值计算器的\
  \ JavaScript 应用。负责保单目录的微服务将提供保单目录的服务器端生成的 UI，而负责估值的微服务将提供估值计算器 JavaScript 应用。\n\
  - 如果你使用 API 网关，它可以包含返回 HTML 的端点，也可以包含返回数据——例如 JSON 形式——的端点。它甚至可以包含根据请求中的 Accept\
  \ 头返回 HTML 或 JSON 数据的端点。因此，应用可以同时包含服务器端渲染的保单目录和客户端渲染的估值计算器。\n- 如果你使用 BFF，你同样有让端点返回\
  \ HTML、数据或两者兼有的可能性。此外，BFF 还给了你为不同应用做出不同决策的机会：在一个 BFF 中，保单目录可以是服务器端渲染的，但在另一个 BFF\
  \ 中它可能是客户端渲染的。\n\nWeb UI 的服务器端与客户端渲染选择不受服务器端使用微服务这一事实的影响。我们研究过的所有用于在微服务之上构建应用的模式都支持服务器端和客户端渲染。\n\
  \n## 12.3 示例：购物车和产品列表\n\n让我们看一个具体示例，看看在单个应用中实现几项功能所需的代码。此示例使用一种应用模式，并没有详细展示另外两种；它将向你展示如何在应用中整合来自多个微服务的功能，这也是另外两种模式的核心。\n\
  \n本章的其余部分将延续前几章中电子商务网站的购物车示例。首先我会回顾该示例，然后向你展示购物车和产品列表的简单 UI，最后你将实现它们。\n\n在电子商务网站上，用户可以浏览产品并将其添加到购物车。当用户将产品添加到购物车时，会触发图\
  \ 12.7 所示的过程。会发生许多事情：\n\n- 1. 该商品被添加到购物车中。\n- 2. 为购物车内容计算新的总计。\n- 3. 推荐和购物者跟踪微服务通过购物车微服务上的事件馈送被通知购物车发生了变化。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_298_0.png)\n\n**图 12.7** 购物车微服务负责代表用户存储和维护购物车，但\
  \ API 网关使该功能（以及其他功能）可供最终用户在 Web 应用中使用。\n\n在以下各节中，你将实现此过程的一部分以及一个简单的产品列表，允许用户将商品添加到购物车。图\
  \ 12.8 显示了你将实现系统的部分。\n\n![](img/608267d7803dc57a1a896ad121f37868_299_0.png)\n\n\
  图 12.8 此示例侧重于 API 网关、产品目录微服务和购物车微服务。你将基于这三个组件实现应用的一部分。\n\n这足以让用户获得图 12.9 所示的页面，该页面让用户查看产品列表并将它们添加到购物车。当用户将产品添加到购物车时，页面的右侧——显示购物车内容的部分——会更新并显示新的内容。该页面还允许用户从购物车中删除产品。\n\
  \n![](img/608267d7803dc57a1a896ad121f37868_299_1.png)\n\n图 12.9 你将实现的电子商务应用部分显示产品列表，并允许用户将产品添加到购物车或从购物车中移除。\n\
  \n\n\n\n\n要实现此 UI，你将执行以下步骤：\n\n+   1. 复用第 5 章中的产品目录和购物车微服务。\n+   2. 创建一个 API 网关。\n\
  +   3. 创建图 12.9 中的产品列表：\n+      - 在 API 网关中创建一个用于获取产品列表页面的端点。\n+      - 让新的端点从产品目录读取产品列表。\n\
  +      - 创建一个包含产品列表的视图并从新的端点返回它。\n+   4. 将图 12.9 中的购物车添加到网页：\n+      - 让 API 网关从购物车获取购物车的当前状态。\n\
  +      - 将购物车添加到网页。\n+   5. 在 API 网关中创建用于向购物车添加产品的端点：\n+      - 在 API 网关中添加用于向购物车添加产品的\
  \ POST 端点。\n+      - 从 API 网关调用购物车以添加新产品。\n+      - 更新用户看到的视图以反映产品已添加到购物车。\n+  \
  \ 6. 在 API 网关中创建用于从购物车移除产品的端点。\n\n你将使用第 5 章中的产品目录微服务和购物车微服务，就像它们在新的 API 网关中一样。你可以在此时将第\
  \ 11 章中的微服务平台添加到这些微服务中，但为了简洁起见，你将跳过该步骤。你在这两个微服务中唯一要做的就是在同一台开发机器上同时运行时，让它们运行在不同的端口上。你在命令行中指定这些端口。\n\
  \n> 注意 为了使本示例的范围保持可行，我做了一些取巧处理。最明显的是，你不会实现登录系统。相反，你将信任 URL 中的用户 ID。在生产环境中永远不要这样做。在第\
  \ 10 章中，我们讨论了如何处理安全性总体问题，包括对终端用户进行身份验证，以及你应如何获取用户 ID。\n\n## 12.3.1 创建 API 网关\n\n\
  以你以前多次创建项目的方式为 API 网关创建一个新项目。将新项目命名为 ApiGateway。然后，将你在第 11 章中开发的微服务平台作为 NuGet 包添加到新项目中。项目文件应如下所示。\n\
  \n```\nservices.AddControllers();\n}\n\npublic void Configure(IApplicationBuilder\
  \ app, IWebHostEnvironment env)\n{\n    app.UseRouting();\n    app.UseKubernetesHealthChecks();\n\
  \    app.UseEndpoints(endpoints => endpoints.MapControllers());\n}\n}\n```\n\n现在你有一个空项目，可以准备实现\
  \ API 网关。\n\n## 12.3.2 创建产品列表 GUI\n\n下一步是创建列出产品的应用程序部分。在 API 网关的 ProductList 文件夹中添加一个名为\
  \ ProductListController 的新 MVC 控制器，并向该模块添加一个 /productlist 端点。ProductListController\
  \ 将包含为终端用户提供服务的应用程序的所有端点：它将具有为终端用户提供网页 GUI 的端点，也具有由该网页 GUI 中的 JavaScript 使用的端点。\n\
  \n为了简单起见，首先让我们从一个什么都不做的端点开始。然后你将基于硬编码的产品列表添加 GUI，最后你将从产品目录微服务检索真实的产品列表。\n\nProductListController\
  \ 将为终端用户提供网页前端，但首先使用以下始终以空的 501 Not Implemented 响应的端点。\n\n### 代码清单 12.4 API 网关中的占位符端点实现\n\
  \n```\nnamespace ApiGateway.ProductList\n{\n    using Microsoft.AspNetCore.Mvc;\n\
  \    using System.Threading.Tasks;\n\n    public class ProductListController : Controller\n\
  \    {\n        [HttpGet(\"/productlist\")]\n        public async Task<IActionResult>\

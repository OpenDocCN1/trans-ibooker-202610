  \ 185–188\n\n## MICROSOFT .NET/微服务\n\n### .NET 微服务（第二版）\n\nChristian Horsdal Gammelgaard\n\
  \n微服务架构连接了必须作为一个系统协同工作的独立组件。将 Docker 和 Kubernetes 等新技术与微软熟悉的 ASP.NET 框架和 Azure 云平台集成，使得\
  \ .NET 开发者能够高效地创建和管理微服务。\n\n**.NET 微服务（第二版）**教你使用 ASP.NET 和 Azure 服务构建和部署微服务。它简明扼要地阐述了微服务架构，然后引导你完成几个真实项目，例如构建一个电商购物车。在这一全面修订的版本中，你将学习如何界定微服务范围、部署到\
  \ Kubernetes，以及监控、日志记录和安全性等运维注意事项。\n\n### 内容提要\n\n- 优化微服务以实现持续交付\n- 设计微服务之间基于事件的协作\n\
  - 将微服务部署到 Kubernetes\n- 在 Azure 中设置 Kubernetes\n\n面向 C# 开发者。无需微服务经验。\n\n**Christian\

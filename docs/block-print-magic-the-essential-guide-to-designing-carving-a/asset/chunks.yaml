  fmt: '

    DR: I have an amazing basement studio in my home, and I am super proud of it.
    It’s fully stocked with everything I need to produce woodcuts, linoleum cuts,
    and silk screens. I have a motorized etching press as well as a letterpress proofing
    press that I print my relief prints on, a full size drying rack, a guillotine
    style paper cutter capable of cutting over 200 sheets of paper at a time, a vacuum
    table, a silk screen exposing unit, and t-shirt press for silkscreen. I literally
    don’t have to leave the house to make my art.


    ### EH: Name one thing you hate about printmaking and one thing you love about
    it.


    DR: There are five emotional stages to making a relief print.

    1\. The excitement of starting a fresh block

    2\. The agony of being so close but yet so far from finishing carving the block

    3\. The anticipation of pulling the first print

    4\. The depression of seeing everything backward for the first time

    5\. Acceptance and moving on


    ### EH: Do you have any helpful tricks or hacks'''' that you''ve picked up along
    the way?


    DR: It’s very easy to overwork a relief print. Taking frequent breaks is important,
    not only for health reasons, but also as a visual reset. Plan your block completely,
    leaving nothing to “figure out later.” Rushing into a block is the quickest route
    to making mistakes.

    Even when working with a black and white relief print, there are many grays that
    can be achieved through carving patterns, hatches, and cross hatches. These hatches
    and cross hatches will give the print depth. It’s important to give the print
    enough contrast to make the grays stand out. I’ve found that a balanced print
    can have at least 20% solid black, 20% solid white, and up to 60% grays. Without
    enough solid black and white the grays wash out and turn flat.


    ![Image](images/f0072-01.jpg)

    Tunacorn


    ### EH: What is your favorite piece that you''ve ever made?


    DR: For three years I worked on a series of woodcuts about Kentucky monsters,
    myths, and legends. It’s a 14-piece series of interconnected prints that can be
    completely rearranged and still line up edge to edge. All together it measures
    32 1/2 feet (9.9 m) long.


    ![Image](images/f0073-01.jpg)


    ### EH: What''s one piece of advice you''d give to someone new to printmaking?


    DR: I’ll give them two. First of all, don’t get discouraged, you have 100 terrible
    prints in you. The quicker you get them out of the way, the sooner you can make
    something special.

    And the other one is practical: Keep everything clean all the time. Trying to
    make clean prints in a dirty shop is a nightmare. I always preclean all my palette
    knives, rollers, roll up slabs, the press, and especially my hands before I print.


    ![Image](images/f0073-02.jpg)

    Derrick Riley in his studio


    ![Image](images/f0073-03.jpg)

    Jackalope



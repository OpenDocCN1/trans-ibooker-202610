    Using a glue brush and matte-finish adhesive, arrange torn bits of tissue paper
    on heavier-weight printing paper and glue into place, sealing over the top.


    ![Image](images/f0101-01.jpg)![Image](images/f0101-02.jpg)![Image](images/f0101-03.jpg)![Image](images/f0101-04.jpg)


    ### Groundwork: Paint Job

    Add color, pattern, and extra visual interest to an otherwise simple print with
    paint experiments. Try painting different patterns and playing with different
    colors to achieve different moods. Paint precise patterns on dry paper or fluid
    washes on paper first wet by a clean, watery brush. Try adding a pinch of salt,
    as salt sprinkled on a wet wash will cause the pigment to gather, resulting in
    a mottled effect. Brush the salt off after the paint is dry, and before you print.


    ![Image](images/f0101-05.jpg)


    ### Groundwork: Brayer Blot

    I often have precut papers lying about from other projects. Sometimes during cleanup
    I blot my brayer on these papers instead of old magazines. This cleans excess
    ink from the brayer while also giving me a cool, layered print surface for future
    experiments like this one! Simply roll your brayer, loaded with any color ink
    onto any color paper.


    ![Image](images/f0102-01.jpg)![Image](images/f0102-02.jpg)


    ### Groundwork: Transparent Layers

    Although this one isn’t technically a specially prepared ground, it is still a
    cool effect. Print onto sheets of transfer paper and play with layering these
    prints in various arrangements until you hit on a composition you like.


    ![Image](images/f0102-03.jpg)


    ### Groundwork: The Rub

    A fun way to utilize old blocks is to create texture rubbings from them. Try using
    your block from the very first project, the Texture Quilt! Place your printing
    paper on top of your (clean, dry) previously used block and rub with the tip of
    a crayon or soft colored pencil. Shift the paper as you go to break up patterns.


    ![Image](images/f0102-04.jpg)


    ### Groundwork: Holes

    I purchased this paper from a specialty paper shop (see Resources, page 150) to
    use in collage work. Try printing on paper that you punched holes in or cut in
    patterns with a craft knife and self-healing mat. When printing on paper with
    pieces cut out, make sure to place a “buffer” piece of paper behind cut out areas
    as you print. This will keep the printing area clean of ink and the backs of subsequent
    prints clean as well. Mount onto a piece of contrasting paper.


    ![Image](images/f0103-01.jpg)![Image](images/f0103-02.jpg)![Image](images/f0103-03.jpg)


    ### Groundwork: In Stitches

    Having enjoyed sewing since childhood, I’m always trying to find ways to sneak
    stitching into my printed projects. I treated these heavyweight tagboard printing
    papers just like fabric and stitched directly onto them, using my sewing machine
    and taking care not to tear the paper as I went. Since I couldn’t efficiently
    tie any knots or back up the stitches, I placed tape on the back of the papers
    to hold the stitches in place.


    ![Image](images/f0103-04.jpg)![Image](images/f0104-01.jpg)


    ### Groundwork: Cleanup Crew

    When cleaning up after another project, I noticed that the lines created by my
    wiping made its own kind of drawing. Before all of the ink is fully wiped from
    your inking plate, blot the plate with a clean piece of printing paper.


    ![Image](images/f0104-02.jpg)![Image](images/f0104-03.jpg)![Image](images/f0104-04.jpg)


    ## ARTIST SPOTLIGHT:


    **AFTYN SHAH**


    Crafting exquisitely detailed landscapes from her studio outside of Philadelphia,
    Pennsylvania, printmaker Aftyn Shah explores inspiration and restoration that
    nature provides. Her studio practice is named Rise + Wander, a call to adventure,
    beckoning the viewer outdoors. Shah’s lyrical, playful linework forms bold compositions
    that seem to breathe with a life all their own.


    ![Image](images/f0105-01.jpg)![Image](images/f0105-02.jpg)


    ### EH: How did you first become interested in printmaking?

    AS: My husband’s family comes from India, and I’ve developed a huge appreciation
    for the textile industry there—particularly the block printing! I’ve received
    pieces as gifts and was always in awe of the craftsmanship. Looking for a creative
    outlet a few years ago, I got it in my head that I wanted to make a scarf, and
    I headed to the nearest craft store to buy all the supplies. I ended up only printing
    on paper, but I haven’t stopped since then—and I still haven’t made my scarf!


    ### EH: What drew you to relief in particular?

    AS: I love that it removes the need for perfection. Previously, I had always painted
    or drawn, artforms that involve adding, adding, adding, until the piece is as
    close to the idea in my head as possible. And nothing ever reached that level,
    which is disappointing and frustrating, even disheartening. With relief printing,
    the process is reductive. I tend to work in only black and white (or maybe just
    a few colors), and I can only remove so much before the piece starts to lose balance.
    At some point, I have to just stop. I have to step away. There isn’t the sense
    that I can just add on forever, trying to reach perfection. That’s freeing. Also,
    I love the more rustic aesthetic, with the occasional wisp of errant ink or a
    little patching. It makes each piece individual and its own work of art.


    ![Image](images/f0106-01.jpg)


    ### EH: How long have you been working as a printmaker?

    AS: My first print was a Valentine’s Day card for friends in 2015, and I gradually
    picked up the pace in my creations over that year, before really dedicating time
    in the beginning of 2016. I started Rise + Wander in January 2016, and I’ve made
    it a point to work on something almost every day, even if it’s only for ten minutes.


    ### EH: How would you describe your work and your process?

    AS: In a word? Slow. With two young sons, the rhythm of my life—including my art—is
    set by their schedules. I often have to find time to work between their needs.
    For this reason, I generally have thought about a design for hours or days, sometimes
    even weeks, before I actually sketch it out. Because I don’t have as much time
    as I’d like, I minimize steps where possible, like drawing something out directly
    on the block. Then, depending on how life goes, it can take weeks to finish even
    a smaller block. I used to get impatient and frustrated with this slower schedule,
    but I’ve begun to welcome the pace. This way, I can return to it each time with
    fresh eyes and evaluate the direction I’m headed with it.


    ### EH: What are your main sources of artistic inspiration?

    AS: Definitely nature in all its forms. The majestic, the tiny, the wild, the
    beautiful. I love taking a walk with my family or hiking by myself and mentally
    outlining everything. I like to think about how I would represent different details
    and textures in black and white lines and marks.


    ### EH: How do you stay creative on a day-to-day basis?

    AS: I actually think it’s easy for me to stay creative on a daily basis because
    I’m so limited in time. I spend a lot of my day thinking about ideas, taking in
    different elements (creative projects my son is working on, our beautiful houseplants,
    views during hikes, for instance) and synthesizing. As a result, I have a lot
    of excitement built up when it’s time to finally execute.


    ![Image](images/f0107-01.jpg)


    ### EH: Describe the space in which you make your art-do you have a home studio,
    rent space, or use a print collective?

    AS: I work out of a home studio, which we converted from our formal dining room.
    It’s a nice, big, and fairly light-filled room that allows me to work close to
    my family—to bounce back and forth between my roles. My favorite part is a giant
    hand-me-down rug my in-laws gave us that takes up most of the floor. It’s a simple
    design, but it makes the space comfortable and pretty.


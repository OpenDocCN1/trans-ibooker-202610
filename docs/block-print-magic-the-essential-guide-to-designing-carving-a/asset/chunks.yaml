    This method requires the use of Ternes-Burton registration pins and stripping
    tabs, which are readily available directly from the company’s website or through
    most well-stocked online art supply retailers. They’re cheap and wildly effective—I
    would consider this the most precise registration technique of the three. Stripping
    tabs are attached to the paper and the pins are attached to the jig. The tabs
    fit into the pins, holding the paper firmly in place.


    ### TOOLS AND MATERIALS

    Scrap piece of board

    One thin, narrow strip of wood or cardboard

    Tape

    Glue

    Ruler

    Pencil

    Pins and tabs


    ### MAKE IT!

    1 Take a scrap piece of board (it helps if it’s squared, with straight edges and
    90-degree angles) and glue the thin strip to it, along the top. Allow it to fully
    bond. The bottom of edge of this strip will act as a bumper to align the top edge
    of your printing paper.

    ![Image](images/f0046-01.jpg)

    2 Place the registration pins on the strip, lining them up with the bottom edge
    of the strip. Tape them firmly in place. (I use tape for this device so that I
    can move elements around when I’m working on differently sized blocks.)

    ![Image](images/f0046-02.jpg)

    3 The pins hold the paper in place but we need something to hold the block in
    place, too. Place two strips of mat/card/chip board together like an L to form
    a 90-degree angle. Decide where you want to place your block and firmly tape the
    L to the board at your block’s lower left-hand corner. A more detailed look at
    using this device can be found in the Reduction Cut Sunflower project, shown [here](#ch03.xhtml#page_64).


    ### Cleaning Up After Printing

    Proper cleanup preserves the life of your tools, the integrity of your prints,
    and will help you keep your sanity in the studio. Follow this cleanup process
    after every print run. (Instructions intended for the oil-based, washable inks
    used throughout this book.)

    Hang all wet prints on the drying rack.

    **Clean the brayer:** Remove excess ink by rolling the brayer on an old phone
    book or magazine. Discard and repeat until nothing comes off on the paper. Wash
    in the sink with soap and water.

    **Clean the inking plate:** Scrape away excess ink with an ink scraper, palette
    knife, or mat board strip. If the ink is uncorrupted (meaning nothing else has
    been mixed into it), excess can be placed back in its original container. If the
    ink is corrupted or you can’t get it back into the container (for example, if
    it came from a tube), discard. Once ink is scraped up, the quickest and most efficient
    way to wipe down the plate is with a disinfectant wipe. Alternatively, you can
    use vegetable oil and paper towels.

    **Wipe excess ink** from palette knives and clean thoroughly with vegetable oil
    and a paper towel or a disinfectant wipe.

    **Clean the block:** Blot away excess ink by pressing the block with newsprint
    or scrap paper. Wipe with vegetable oil or a disinfectant wipe. Though the inks
    used throughout the book clean up with soap and water, I try to always keep my
    blocks dry. If the hessian backing of unmounted linoleum gets too wet, it can
    cause the linoleum to curl.

    **Replace all caps and lids tightly**, and store any inks in clear containers
    away from light.

    **Wash your hands thoroughly** with pumice soap such as Permatex Fast Orange (soaps
    like this are easily found at hardware or automotive stores. Also it lasts forever—I’ve
    been using the same 64 oz container for over two years). Scrub under your fingernails
    with a brush.


    ### Editions

    An edition is a set of identical prints. Each print of the edition is considered
    an original, and is numbered, signed, and dated by the artist along the bottom
    of the print. The majority of artists choose to sign in pencil. The artist’s signature
    is traditionally located in the lower right-hand corner and the title of the print
    is in the center. In the lower left-hand corner you’ll find the edition number:

    #### NUMBERING

    If you make an edition of 20, you will number each print as 1/20, 2/20, 3/20,
    and so on. Though each print should be as close to identical as possible, generally
    the cleanest/best prints in the edition will be numbered lower. So the first print
    in an edition of 100 (1/100) will be better quality/more valuable than 96/100.

    There are other ways to identify a print. Sometimes at the bottom of a print you’ll
    see A/P or AP, which stands for Artist Proof. The first few pulls of a block are
    known as the test prints or proofs, and are not considered a part of the edition.
    This is the time to test out how much ink you need to apply, adjust the pressure
    of your baren or press, and make any final cuts into the block.


    # CHAPTER 3


    ## THE BASICS

    The projects in this chapter will take you on a tour of foundational concepts
    of the relief printing process. Here you’ll learn how to:

    ![Images](images/bulla.jpg)  Achieve a variety of textures through the manipulation
    of your tools;

    ![Images](images/bulla.jpg)  Make a three-color print with three separate blocks;

    ![Images](images/bulla.jpg)  Make a three-color print with a single block;

    ![Images](images/bulla.jpg)  Manipulate lines to render an object in three dimensions;

    ![Images](images/bulla.jpg)  Use collage and hand painting to embellish a print;

    ![Images](images/bulla.jpg)  Use text to print your own tiny book

    In completing these projects, you’ll learn to do a bit of inverted thinking. Remember
    that relief printing is in essence a **reductive** or **subtractive** process—artists
    *remove* linoleum from the block to reveal the design (in contrast, hand building
    with clay is an **additive** process—where elements are gradually *added* to the
    form). Learning to think subtractively will help you plan better prints and execute
    more nuanced results.

    ![Image](images/f0048-01.jpg)


    ### PROJECT: TEXTURE QUILT BLOCK

    The best way to get to know your carving tools and the magic of wielding them
    is to dive right in! This classic moonlight star quilt pattern provides the perfect
    visual structure for experimenting with mark making, textures, and values all
    in the same project.

    For this project, you will be attempting to use as many of your carving tools
    as possible to make as many different textures and values as possible.

    This will involve experimenting with:

    ![Images](images/bulla.jpg)  The shapes made by each of your tools or blades

    ![Images](images/bulla.jpg)  The depth of your blades in the linoleum

    ![Images](images/bulla.jpg)  The length of strokes

    ![Images](images/bulla.jpg)  The direction of your strokes

    ![Images](images/bulla.jpg)  The spacing of your marks

    ![Images](images/bulla.jpg)  Whether cuts intersect or are parallel

    We won’t need to use any transfer techniques for this texture exploration, as
    we will be drawing directly onto the block. I recommend drawing the full design
    in pencil first, then going over your drawing with a permanent marker, so you
    can edit any mistakes.

    #### Tools and Materials

    9" x 9" (23 x 23 cm) unmounted linoleum

    Pencil

    Ruler

    Permanent marker

    Carving tools

    Inking plate

    Palette knife

    Brayer

    12" x 12" (30.5 x 30.5 cm) printing paper

    Baren

    ![Image](images/f0050-01.jpg)![Image](images/f0051-01.jpg)

    1 Begin by making a 1 1/2" (4 cm) grid on the linoleum block. Using your ruler
    for precise measurements, make tick marks at 11/2" (4 cm) increments around the
    perimeter of the block.

    ![Image](images/f0051-02.jpg)

    2 Line up the marks on opposite edges with your ruler, using it as a guide to
    draw perpendicular lines across the block. You should end up with 36 squares measuring
    1 1/2" (4 cm) each.

    ![Image](images/f0051-03.jpg)

    3 Locate the middle mark along each edge. Connect the four middle marks with the
    ruler to make a diamond shape.


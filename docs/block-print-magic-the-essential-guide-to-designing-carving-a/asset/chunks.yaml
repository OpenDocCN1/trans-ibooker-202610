    ### EH：说一件你讨厌印刷术的事和一件你喜欢的事。


    DR：制作凸版画有五个情感阶段。

    1\. 开始雕刻新版块的兴奋

    2\. 雕刻版块几乎完成却又遥不可及的痛苦

    3\. 揭开第一张印品的期待

    4\. 第一次看到一切倒置的沮丧

    5\. 接受并继续前进


    ### EH：你在创作过程中有没有学到什么有用的技巧或窍门''''？


    DR：很容易过度雕刻凸版画。经常休息很重要，不仅出于健康原因，也是为了视觉重置。完全规划好你的版块，不要留下任何“以后再想”的部分。仓促进入雕刻是最快导致出错的途径。

    即使在制作黑白凸版画时，也可以通过雕刻图案、平行线和交叉线来呈现许多灰色。这些平行线和交叉线会赋予印品深度。重要的是给印品足够的对比度，使灰色突出。我发现一幅平衡的印品至少要有
    20%的纯黑、20%的纯白，以及多达 60%的灰色。如果纯黑和纯白不足，灰色就会被冲淡而变得平淡。


    ![Image](img/f0072-01.jpg)

    Tunacorn


    ### EH：你做过的最喜欢的作品是什么？


    DR：我花了三年时间制作了一系列关于肯塔基州怪物、神话和传说的木刻。它是一套由 14 件相互关联的印品组成的系列，可以完全重新排列并且边缘仍然对齐。全部加起来长达
    32 1/2 英尺（9.9 米）。


    ![Image](img/f0073-01.jpg)


    ### EH：你会给刚接触版画的人什么建议？


    DR：我会给他们两个建议。首先，不要气馁，你体内有 100 张糟糕的印品。越快把它们做出来，越早能创作出特别的东西。

    另一个建议很实际：时刻保持一切清洁。在脏乱的工作室里试图制作干净的印品是一场噩梦。我在印刷前总是预先清洁我的调色刀、滚筒、卷起的胶板、压机，尤其是我的双手。


    ![Image](img/f0073-02.jpg)

    Derrick Riley 在他的工作室


    ![Image](img/f0073-03.jpg)

    Jackalope


    **访问 Derrick 的网站 [www.drockpress.com](http://www.drockpress.com)**


    peace of the natural world and suggest a thoughtful, studied approach, reminding
    us that direct observation is often one of the best teachers.


    ![Image](images/f0079-01.jpg)![Image](images/f0079-02.jpg)


    ### EH: How did you become interested in printmaking?


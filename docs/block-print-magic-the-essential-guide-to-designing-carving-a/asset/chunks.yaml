    ## Carving Process


    ![Image](images/f0083-03.jpg)


    4 After clearing the negative space, start on the florals. Notice that the flower
    buds have disappeared from the composition. They will be printed separately on
    different paper.


    ![Image](images/f0084-01.jpg)


    5 On the body of the raven, highlight the contours of the feathers using intentional,
    directional lines. A straight line can suggests a flat plane, and a curved line
    suggests a curved plane (use the knowledge you gained from the Contour Line Skull
    project shown [here](#ch03.xhtml#page_74)). It can be helpful to go over your
    carved areas with a thick permanent marker to check your work and get a sense
    of how the block will look when it prints.


    ![Image](images/f0084-03.jpg)


    6 Using small, short strokes with a 1-mm V-parting tool, carve the suggestion
    of the raven’s body feathers. This will make it appear as if the feathers are
    catching light, and gives the form a more definite sense of volume. Once the block
    is fully carved, set it aside.


    ![Image](images/f0084-04.jpg)


    7 The design calls for eight bigger flowers and seven little buds. Transfer the
    designs for the bigger flower and little bud onto a scrap piece of unmounted linoleum
    and carve them (since they repeat in the composition, you only need one of each).
    Now we’re ready to print!


    ![Image](images/f0084-02.jpg)


    ### Carve the raven’s talons


    ![Image](images/f0085-01.jpg)


    ## Printing Process


    8 Set up a simple printing jig using a large sheet of paper or a scrap piece of
    cardboard. Trace a template for your printing paper (12" x 12" \[30.5 x 30.5 cm\]
    square). Position the block in the center and trace around it.


    ![Image](images/f0085-02.jpg)


    9 Since the design is circular, I''ve indicated the top in order to give each
    print in the edition exactly the same orientation. Make a mark at the top of your
    block with a permanent marker, and extend that mark off of the block and onto
    the printing jig. Each time you lay the block down, make sure these marks line
    up.


    ![Image](images/f0085-03.jpg)


    10 Spread a small amount of black ink onto your inking plate and roll out. Apply
    to the block.


    ![Image](images/f0085-04.jpg)


    11 Carefully lay a sheet of printing paper onto the block and press with a baren,
    coaxing out fine details using a firmer baren or spoon if necessary.


    ![Image](images/f0086-01.jpg)


    12 Gently peel the print back from the block to check for any areas you may have
    missed. Set the completed print aside to dry.


    ![Image](images/f0086-04.jpg)![Image](images/f0086-02.jpg)


    ## Finishing


    13 Take the small flower block and apply ink. You might want to use a smaller
    brayer for this one, unless you don’t mind a mess!


    ![Image](images/f0086-05.jpg)


    14 Remove excess ink from your blocks and clean all your tools and surfaces. Let
    your prints dry before moving on to the next steps.


    ![Image](images/f0086-03.jpg)


    15 We can begin embellishing the now-dry prints, starting with paint. Mix paints
    with a brush on a palette until you get your desired color. I recommend using
    watercolor or gouache and testing the paints on a scrap piece of paper before
    you begin painting on your prints. Taking care not to overload your brush with
    too much paint or water, carefully paint in each blueberry. If you printed with
    an oil-based ink, you’ll notice how the paint naturally resists the ink, making
    it a little bit easier to stay inside the lines. Once the painting is complete,
    clean your materials and set the print aside to dry.


    ![Image](images/f0086-06.jpg)![Image](images/f0087-01.jpg)


    16 Using a craft knife and self-healing mat or other cutting surface, carefully
    cut out eight big flowers and seven little buds. It is important to be aware of
    the blade at all times, never pulling it directly toward your body. Replace the
    cap when not in use.


    ![Image](images/f0087-02.jpg)


    17 Refer to the original drawing as a map to show you where to place the flowers.
    Apply adhesive to the back of each flower, position it on the print, and press
    it with your (clean) finger or with the (clean) rubber end of your pencil. Repeat
    for each flower and bud. Once each has been applied, place the print under a heavy
    stack of books to keep it from warping as the adhesive sets.


    18 Repeat as per the size of your edition.


    ![Image](images/f0087-03.jpg)


    ### The final product, a bit spiffed up


    ## PROJECT: ONE-PAGE POCKET ZINE


    Perhaps the greatest legacy of printmaking is its role in democratizing knowledge.
    The advent of Johannes Gutenberg’s movable type press in 1436 allowed for faster
    production of printed materials in Europe; books became more widely available
    and the working classes gained literacy. Given this history, we would be remiss
    to leave out text in our linoleum prints.


    Part of the appeal of printmaking is the potential for nearly limitless multiples,
    so it’s the perfect medium for creating your very own zine to distribute. A zine
    is a self-published, small-circulation book or magazine that is usually photocopied
    and hand bound. For this project, you’ll be making your very own hand-bound and
    hand-printed zine out of one standard U.S. letter size (or A4) sheet of paper.


    ### Tools and Materials


    8 1/2" x 11" (21.5 x 28 cm) unmounted linoleum


    Drawing paper


    Tracing paper


    Pencil


    Washi/masking tape


    Carving tools


    Ink


    Brayer


    Inking plate


    Palette knife


    Baren


    Scissors


    ![Image](images/f0088-01.jpg)


    Zines originally emerged as science-fiction-fan magazines in the 1930s, picking
    up in popularity again with the rise of *Star Trek*, but then quickly spread to
    the music scene. The proliferation of copy shops in the 1970s and 1980s along
    with DIY aesthetic of punk music caused the creating and trading of zines to expand
    because of quicker and cheaper distribution. Zines today vary a great deal in
    size, style and content.


    #### Make a Plan


    Decide what you want your zine to be about, and then start designing and planning
    each page. Keep in mind that we’re only going to have six usable “content” pages—you
    will have eight pages in total, but two of those are the front and back covers.
    Each page will end up measuring 4 1/4" x 2 3/4" (10.8 x 7 cm) and will be oriented
    portrait.


    Having trouble thinking of an idea? Here are some potential titles to get your
    brain churning.


    Things I Know for Sure


    A Simple Recipe


    A 6-Line Poem About Hope


    A 6-Word Poem About Breakups


    A Word of Advice


    A Letter to My Haters


    Things I Love About You


    What I Wish I’d Said


    How to Make Friends with a Baby


    Lies I’ve Told


    A List of Favorite Foods


    A Public Service Announcement


    Things My Dog Would Say


    ![Image](images/f0089-01.jpg)


    Illustration 1


    1 Grab a piece of 8 1/2" x 11" (21.5 x 28 cm) paper. Fold lengthwise once (like
    a hotdog bun), once again widthwise (like a hamburger bun), and then (hamburger)
    once again, as in illustration 1.


    Unfold the paper. You should have eight equal rectangles measuring 4 1/4" x 2
    3/4" (11 x 7 cm).


    Orienting the paper in the landscape direction, label your covers and pages as
    in illustration 2 .The rectangles on the top half of the sheet will be upside
    down, and the rectangles on the bottom will be right side up.


    ![Image](images/f0089-02.jpg)


    Illustration 2


    2 Transfer your drawing to your block with the method of your choice (see Transfer
    Methods, shown [here](#ch02.xhtml#page_32)).


    ![Image](images/f0089-03.jpg)


    3 Double check that your text as it appears on the block reads backward, then
    ink in your block with a permanent marker.


    ![Image](images/f0090-01.jpg)


    4 Carve out the negative space.


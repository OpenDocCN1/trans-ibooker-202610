    \n    5 Continue weaving in the other strips, scooting each down tightly against\
    \ the previous strip.\n\n    ![Image](images/f0136-01.jpg)\n\n    6 Stop weaving\
    \ in strips once you’ve reached the edge of the original image.\n\n    ![Image](images/f0136-02.jpg)\n\
    \n    7 Flip it over and tape strips into place.\n\n    ![Image](images/f0136-03.jpg)\n\
    \n    8 Trim the excess strip lengths.\n\n    ![Image](images/f0136-04.jpg)\n\n\
    \    9 Trim any strips on the front of the print that fall outside of the original\
    \ border.\n\n    ![Image](images/f0136-05.jpg)\n\n    10 In order to achieve a\
    \ clean presentation, a tightly fit mat hides any less-than-perfect edges. *Voilà!*\
    \ You have a one-of-a-kind print with a variety of textures both simulated (from\
    \ your cuts) and real (from the woven paper).\n\n    ## GLOSSARY\n\n    **Additive:**\
    \ sculptural method by which elements are added to construct the form.\n\n   \
    \ **Appliqué:** joining a smaller piece of fabric to the surface of a larger piece\
    \ of fabric.\n\n    **Artist’s proof (AP or A/P):** a print set aside from the\
    \ edition for the artists’ use.\n\n    **Baren:** a smooth, round pad either flat\
    \ or slightly convex, used to apply pressure to the back of paper as it sits on\
    \ an inked block.\n\n    **Bench hook:** a wood or metal plate with a raised lip\
    \ on opposite sides of the plate, which hold a wood or linoleum block in place\
    \ as you work on a tabletop.\n\n    **Block:** a piece of thick, flat material\
    \ (usually wood, rubber, or linoleum) with a design carved onto its surface, used\
    \ to print repeated impressions.\n\n    **Blockbook printing:** combining image\
    \ and text within a single block.\n\n    **Brayer:** a hard or soft rubber roller\
    \ with a handle, used for spreading out ink evenly and applying it directly a\
    \ block.\n\n    **Burnish:** to rub or buff.\n\n    **Burr:** a rough bit of metal\
    \ that can form on the edge of a blade.\n\n    **Depth:** the apparent distance\
    \ from near to far.\n\n    **Edition:** a set of identical prints created by the\
    \ same block that are numbered and signed. **Limited edition:** a set of prints\
    \ limited in number. **Open edition:** a set of prints unlimited in number.\n\n\
    \    **Embroidery:** the embellishment of fabric with needle and thread\n\n  \
    \  **Hem:** to turn under and sew the edges of a piece of fabric.\n\n    **Inking\
    \ plate:** any surface on which you spread and roll out ink.\n\n    **Mood:**\
    \ the overall feeling of a work of art.\n\n    **Noise:** extra marks on a print\
    \ caused by ink hitting previously carved areas of the block; noise can be intentional\
    \ or unintentional.\n\n    **Print:** each individual copy or impression made\
    \ from a block.\n\n    **Printing jig:** a guide used in the registration of prints.\n\
    \n    **Reduction cut:** a method of color printing in which you use the same\
    \ block over and over, carving more away with each new layer of color.\n\n   \
    \ **Registration:** any system used by printmakers to ensure that the block and\
    \ paper are both in the same position for each print, usually involving the alignment\
    \ of two or more blocks on a single image.\n\n    **Relief:** sculpture technique\
    \ where elements are carved into a surface as to stand out from the background.\
    \ The term comes from the Latin verb *relevo*, to raise.\n\n    **Relief print:**\
    \ process of pulling a print from a carved block, where the ink is deposited on\
    \ the remaining (uncarved) areas of the block.\n\n    **Running stitch:** small,\
    \ even stitches that run in and out of the cloth, to give the appearance of a\
    \ dotted line.\n\n    **Satin stitch:** long, straight embroidery stitches made\
    \ parallel and close together to fill a space.\n\n    **Seed stitch:** a short,\
    \ straight embroidery stitch used for background filling.\n\n    **Space:** the\
    \ area in, around or between objects in a composition. **Negative space:** the\
    \ area around the object/subject. **Positive space:** the area taken up by an\
    \ object/subject.\n\n    **Split stitch:** an embroidery chain stitch in which\
    \ the needle is brought back through the previous stitch to give the appearance\
    \ of an unbroken line.\n\n    **Subtractive (reductive):** sculptural method by\
    \ which material is removed to reveal the form.\n\n    **Test print:** the first\
    \ print pulled from the block in order to determine the variables in the printing\
    \ process."

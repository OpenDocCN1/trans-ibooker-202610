    The whole point of the studio is to be a space that is exclusive to artmaking,
    but sometimes you don’t have the luxury of having a whole room to yourself. The
    good news is that all you really need is one good-sized tabletop and a few key
    pieces of equipment. When planning your space, consider the following needs.


    ### 1. Clean space

    For drafting designs, preparing printing papers, and carving blocks and signing
    prints. Keep this area completely free of ink in order to preserve the cleanliness
    of your papers. It would be sad to pull a five-color print only to ruin it with
    a big stray ink smudge picked up from the table!


    ### 2. Dry space

    A place to keep your wet prints as you pull them. DIY drying rack plans can be
    found shown [here](#ch01.xhtml#page_26).


    ### 3. Print space

    This is the area where you’ll print your inked blocks. I like to cover this area
    with butcher paper and tape it down to the table for easy cleanup after a project.
    This is also where you will put any registration device/printing jig (see [here](#ch02.xhtml#page_43))
    you may be using for your project. Keep a mini-clean zone above the jig so that
    there’s a safe place to stack your prepared papers.


    ### 4. Ink space

    For making a mess! This is where your inking plate lives for mixing, rolling out,
    and applying ink to blocks. On one of my studio tables, I have a large sheet of
    plexiglass screwed directly into the tabletop as a permanent ink surface.

    Underneath the shelf are hooks for hanging my brayers, which further help to corral
    the ink. Hanging brayers keeps the rubber roller from becoming dented or otherwise
    damaged over time. I also keep all of my essential ink cleaning supplies within
    easy reach: a roll of paper towels, a container of cotton swabs, disinfectant
    wipes, mat board strips, gloves, baby oil, a stack of old magazines, and a garbage
    can, which is tucked under the table.


    ![Image](images/f0024-01.jpg)![Image](images/f0023-02.jpg)![Image](images/f0024-02.jpg)

    Blocks that have already been printed, cleaned, and dried are stacked in milk
    crates, with titles visible for easy access


    ![Image](images/f0025-01.jpg)

    A second station, ready for printing


    ![Image](images/f0025-02.jpg)

    Inks, brayers, and other tools organized on a shelf above my worktable


    ![Image](images/f0025-03.jpg)

    When I’m not pulling by hand I use my Richeson Medium Etching Press. Though expensive
    and bulky, pulling prints with a press takes a lot of the physical gruntwork for
    you.


    ### MAKE IT: TIGHTROPE DRYING RACK

    One of the most challenging aspects of working in a small space is finding a convenient
    place to store prints as they dry. This tabletop drying rack is a cheap alternative
    to specialty racks. It takes under an hour to build and requires no special skills
    or equipment. Have your board and copper pipes cut to size at your local hardware
    store. Be sure to sand off any rough edges before you begin, and remember to observe
    basic studio safety procedures.


    ![Image](images/f0026-01.jpg)


    #### Tools and Materials

    Ruler

    Pencil

    Drill

    3/4" (2 cm) Phillips head screwdriver bit

    1/8" (3 mm) drill bit

    Two 1/2" (1.3 cm) floor flanges

    Two 1/2" (1.3 cm) nipples

    3/4" (2 cm) wood screws, Phillips head

    Birch plywood board, 11 1/2" x 28" (29 x 73.5 cm)

    Two 16" (40.5 cm) long pieces of 1/2" (1.3 cm) wide copper pipe

    32" (81.5 cm) of heavy-duty picture hanging wire

    15 small bulldog clips

    Steel wool


    ![Image](images/f0026-02.jpg)


    #### MAKE IT!

    1 Make a center mark at the end of your board 5 3/4" (14.5 cm) along the shortest
    end.

    2 Come in 3/4" (2 cm) from the center mark on the edge and make another mark.
    Repeat on the other end of the board.

    3 Lay one of your floor flanges on the board as shown, centering one of the holes
    over your 3/4" (2 cm) mark. Make marks in the remaining three holes.

    4 Remove the flange. Use each of the marks to drill pilot holes with your drill
    and 1/8" (3 mm) drill bit. This will keep your board from splitting.


    ![Image](images/f0027-01.jpg)


    5 Replace the flange. Screw in place with four 3/4" (2 cm) wood screws.

    6 Repeat steps 3 to 5 on the other end of the board.

    7 Insert 1/2" (1.3 cm) nipple into each flange and screw in tightly.


    ![Image](images/f0027-02.jpg)


    8 Take one of the copper pipe pieces. Measure and make a mark 1/2" (1.3 cm) from
    the end of the pipe. Holding the pipe steady with one hand, use your electric
    drill with a 1/8" (3 mm) drill bit to perforate two holes in the end of the copper
    pipe. Clean off any rough bits with steel wool.

    9 Repeat step 8 with the second piece of pipe.

    10 Take one of the copper pipes and attach the end without the hole onto the nipple
    set inside the flange. This may take a little bit of elbow grease and/or vise
    grips if you have them. Make sure that, as you screw it in, the two holes going
    through the top of the pipe are parallel with the grain of the board.

    11 If you mark up or marr the pipe as you install them, a quick rub with steel
    wool will tidy them right back up.

    12 Take your length of wire and thread it through one of the pipes. Tie a knot
    on the outside, trimming any excess wire (can be done with scissors or wire cutters).

    13 Thread 15 small bulldog clips onto the wire.


    ![Image](images/f0027-03.jpg)


    14 Thread the other end of the wire through the opposite pipe, pull gently until
    taut, and then wrap the excess wire around the pipe, twisting the wire to secure
    in place.

    15 Install your finished drying rack in your studio space and proceed to fill
    it with gorgeous, handmade prints!


    # CHAPTER 2

    ## ESSENTIAL TECHNIQUES

    Though there are detailed directions for every project in this book, there are
    some essential practices that need tackling first. This chapter includes a refresher
    on some of the basic tenets of good design to help you plan your original compositions,
    and details different approaches to transferring images onto the carving block.
    You’ll also find tips on carving techniques, the primary steps for pulling a print,
    and instructions about how to register (or line up) a multicolored print.


    ![Image](images/f0028-01.jpg)


    ### DESIGN ESSENTIALS

    A good design is the foundation of a successful print. The elements and principles
    of design are a framework for helping us create, understand, appreciate, talk
    about, and critique art. They also make you sound smart at fancy parties! I like
    to think of design elements as my visual vocabulary. Here are a few key elements
    and principles of design brought to you by some of the best works from relief
    printmaking’s history.


    ![Image](images/f0030-01.jpg)

    *The Plague of Locusts from the Nuremburg Chronicle*, 1493

    A clear foreground, middle ground, and background are established, defining the
    **space**—the area in, around, or between objects in a composition.

    The figures at the bottom of the picture plane are much larger in **scale** (size)
    than the buildings in the background, making them appear closer to the viewer.


    ![Image](images/f0030-02.jpg)

    *Death and the Ploughman*, Hans Lutzelburger, 1538


    ![Image](images/f0031-01.jpg)

    *House Engulfed in Flames*, American School, 1933


    ![Image](images/f0031-02.jpg)

    *The Gale*, Felix Edouard Vallotton, 1894


    ### TRANSFER METHODS

    Ask a group of printmakers about their favorite transfer technique and you’ll
    get a wide variety of answers. The following four methods are those that I’ve
    found the most reliable, with the most consistent results. A solid transfer makes
    carving a much more enjoyable experience and gives you a clear roadmap to plan
    your cuts.


    #### Drawing Rub


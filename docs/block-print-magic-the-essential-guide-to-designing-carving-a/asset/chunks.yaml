- raw: "    KM: Art has been a love of mine for as long as I can remember. My focus\
    \ for many years was landscape drawing and painting, and it actually wasn’t until\
    \ my third year in college that I discovered printmaking. I took an intro to etching\
    \ class and unexpectedly found that printmaking felt like the perfect mix of drawing,\
    \ painting, and sculpture, which was very exciting to me. I felt like I had opened\
    \ a door to a new world where there was the possibility to explore the true spontaneity\
    \ of artmaking. In a lot of ways printmaking is a very calculated operation, but\
    \ inevitably there is a degree of uncertainty because of the process of transferring\
    \ ink to paper. I never really know exactly how a piece will look until it is\
    \ printed. I absolutely love the mystery, suspense, and surprise that awaits me\
    \ after finishing a carved block.\n\n    ![Image](images/f0080-02.jpg)\n\n   \
    \ ###### EH: What drew you to relief in particular?\n\n    KM: I find I can achieve\
    \ the graphic images that I set out to create by making linocuts. The color fields\
    \ of the linocut are rich and uninterrupted by the grain of the wood for example.\
    \ I’m drawn to the crisp, velvety nature of relief prints.\n\n    ![Image](images/f0080-01.jpg)\n\
    \n    Also this act of drawing with light, in a sense, holds an innate graphic\
    \ power that I absolutely love. The idea of taking away to create instead of adding\
    \ to something has intrigued me from the beginning. In this type of printmaking,\
    \ shapes are formed by enforcing white or light in the image with carving tools.\
    \ It's in taking away material from around and within a design that an image will\
    \ begin to form. This process forces me to deconstruct and abstract the landscape\
    \ that I’m working from. For me this is a much more challenging undertaking than\
    \ drawing an image with graphite, for example. I like having to think carefully\
    \ about mark making in order to portray texture, depth, shadow, fluidity, and\
    \ softness with a hard line while simultaneously honoring the balance of lights\
    \ and darks (because I work mainly in black and white) in each composition.\n\n\
    \    I find it is a sculptural way to make two-dimensional artwork. It’s meditative\
    \ and so satisfying to watch the image come to life in a three-dimensional form\
    \ on the block. Some may find hours of carving with tiny knives and gouges mundane\
    \ and tedious, but I find it to be an extremely calming and therapeutic practice.\
    \ I feel I’m drawn to this process almost on a subconscious level. The familiarity\
    \ of picking up the tools is calming and comforting. Spending time using these\
    \ tools to shape and create something makes me feel like I’m spending time in\
    \ a tucked-away oasis where I can find a flow and focus, a place that heightens\
    \ my senses while clearing my mind. The tools become an unconscious extension\
    \ of myself. When I am deep in this place \\[where\\] the craft of cutting/carving\
    \ happens I lose myself to the intuitive energy that emerges from the emotion\
    \ and creativity from within.\n\n    I also enjoy the process and repeated pattern\
    \ of movement when creating multiples. I find this step of the process calming\
    \ and contemplative as well. It is in this rhythm that I notice the beauty and\
    \ subtleties of each print. Making them their own entity and giving them each\
    \ their own personality.\n\n    ###### EH: How would you describe your work and/or\
    \ your process?\n\n    KM: I would describe my work as graphic, nature-inspired\
    \ impressions of the wilderness. Creating these pieces brings me joy, and I hope\
    \ connects others to the natural world as well. I hope that these prints are little\
    \ reminders of what lies beyond our buildings, windows, phones, computers.\n\n\
    \    I feel like so many of us have become disconnected from the natural world,\
    \ and forget that our health is affected by this. I believe contact with nature\
    \ improves our physical, mental, and emotional well-being. People need to reconnect\
    \ to the wilderness around them, and it is then that they will feel fulfilled.\
    \ It is then that they will live a more satisfying life and feel content, and\
    \ hopefully in turn this will lead to stewardship of the land and the world’s\
    \ wilderness areas.\n\n    My current body of work explores human relationship\
    \ with trees and their form through relief printmaking. I have created my own\
    \ interpretations of the species that move me in hopes that they will enchant\
    \ the viewer and evoke feelings of nostalgia, wonder, and peace. This medium allows\
    \ me to carve away the unessential and use creative subtraction to form a delicate\
    \ dance between negative and positive space, designing an image and place for\
    \ contemplation and reflection. With the simple use of contrast, as well as line\
    \ manipulation, I strive to create absorbing compositions inspired by the West\
    \ Coast forests.\n\n    My process of transforming my experience into a print\
    \ involves reversing the image from my sketches onto the relief surface, then\
    \ carving away the negative space or the areas I would like white. After the block\
    \ is complete, I roll a thin layer of ink onto the block with a brayer, gently\
    \ place damp cotton-rag paper on the inked surface of the block, and roll it through\
    \ a press to transfer the image onto the paper or make an impression of the image\
    \ onto the paper. I usually publish editions of 20–100 prints.\n\n    ![Image](images/f0081-01.jpg)\n\
    \n    Kelli MacConnell's *Giant Redwood* and *Vertical Tree Series* for the Ford\
    \ Gallery\n\n    ###### EH: Sometimes we have a love/hate relationship with our\
    \ passions. Name one thing you hate about printmaking and one thing you love about\
    \ it.\n\n    KM: One of the things I find frustrating about printmaking is that\
    \ occasionally I feel like the process and the steps I’m taking to create a print\
    \ are the same as I’ve done before, yet I don’t get the outcome I had planned\
    \ or predicted; this is actually exactly the same thing I love so much about printmaking.\
    \ In the same breath, I love the unexpected surprises that happen when printing\
    \ that I can learn from. I suppose it depends on if I’m excited about that surprise\
    \ outcome or not!\n\n    ![Image](images/f0081-02.jpg)\n\n    MacConnell's *Juniper*\
    \ carving block\n\n    **Visit Kelli at [www.kellimacconnell.com](http://www.kellimacconnell.com).**\n\

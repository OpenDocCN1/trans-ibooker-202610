- raw: "    The whole point of the studio is to be a space that is exclusive to artmaking,\
    \ but sometimes you don’t have the luxury of having a whole room to yourself.\
    \ The good news is that all you really need is one good-sized tabletop and a few\
    \ key pieces of equipment. When planning your space, consider the following needs.\n\
    \n    ###### 1\\. Clean space\n\n    For drafting designs, preparing printing\
    \ papers, and carving blocks and signing prints. Keep this area completely free\
    \ of ink in order to preserve the cleanliness of your papers. It would be sad\
    \ to pull a five-color print only to ruin it with a big stray ink smudge picked\
    \ up from the table!\n\n    ###### 2\\. Dry space\n\n    A place to keep your\
    \ wet prints as you pull them. DIY drying rack plans can be found shown [here](#ch01.xhtml#page_26).\n\
    \n    ###### 3\\. Print space\n\n    This is the area where you’ll print your\
    \ inked blocks. I like to cover this area with butcher paper and tape it down\
    \ to the table for easy cleanup after a project. This is also where you will put\
    \ any registration device/printing jig (see [here](#ch02.xhtml#page_43)) you may\
    \ be using for your project. Keep a mini-clean zone above the jig so that there’s\
    \ a safe place to stack your prepared papers.\n\n    ###### 4\\. Ink space\n\n\
    \    For making a mess! This is where your inking plate lives for mixing, rolling\
    \ out, and applying ink to blocks. On one of my studio tables, I have a large\
    \ sheet of plexiglass screwed directly into the tabletop as a permanent ink surface.\n\
    \n    Underneath the shelf are hooks for hanging my brayers, which further help\
    \ to corral the ink. Hanging brayers keeps the rubber roller from becoming dented\
    \ or otherwise damaged over time. I also keep all of my essential ink cleaning\
    \ supplies within easy reach: a roll of paper towels, a container of cotton swabs,\
    \ disinfectant wipes, mat board strips, gloves, baby oil, a stack of old magazines,\
    \ and a garbage can, which is tucked under the table.\n\n    ![Image](images/f0024-01.jpg)![Image](images/f0023-02.jpg)![Image](images/f0024-02.jpg)\n\
    \n    Blocks that have already been printed, cleaned, and dried are stacked in\
    \ milk crates, with titles visible for easy access\n\n    ![Image](images/f0025-01.jpg)\n\
    \n    A second station, ready for printing\n\n    ![Image](images/f0025-02.jpg)\n\

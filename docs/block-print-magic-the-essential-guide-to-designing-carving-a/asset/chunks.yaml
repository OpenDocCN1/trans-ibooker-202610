- raw: "    One of the quickest ways to transfer an original graphite drawing requires\
    \ only some elbow grease! This method calls for a pencil drawing, tape, and a\
    \ burnishing tool (a fat permanent marker works great).\n\n    ![Image](images/f0032-01.jpg)\n\
    \n    1 Make a drawing with a soft graphite pencil on thin sketchbook or printer\
    \ paper. Trim away excess paper with scissors.\n\n    ![Image](images/f0032-02.jpg)\n\
    \n    2 Flip the drawing over, graphite side down onto your linoleum block, and\
    \ tape it firmly into place. Take a spoon or butt of a marker and vigorously rub\
    \ the back of the drawing, taking care not to let the paper slip.\n\n    ![Image](images/f0032-03.jpg)\n\
    \n    #### Tracing Paper\n\n    I like this method because it allows you to make\
    \ changes to the drawing as you transfer it to the block. All you need is a pencil,\
    \ your original image, tape, and a piece of tracing paper cut down to size.\n\n\
    \    ![Image](images/f0033-01.jpg)\n\n    1 Place the tracing paper over your\
    \ drawing and trace the lines. Make any necessary changes to the drawing as you\
    \ trace.\n\n    ![Image](images/f0033-02.jpg)\n\n    2 Flip the tracing paper\
    \ over, then tape it into place on the linoleum block. Go over the back of the\
    \ drawing with a pencil. Use medium pressure, as it’s easy to rip through the\
    \ thin tracing paper.\n\n    ![Image](images/f0033-03.jpg)\n\n    #### Blender\
    \ Pen\n\n    This method requires a photocopied image (use toner as opposed to\
    \ ink—this method will not work with an inkjet print), a blender pen such as the\
    \ Chartpak AD Marker Colorless Blender, tape, and a burnishing tool. Beware as\
    \ some blender pens can have a very strong smell, so work in a well-ventilated\
    \ area.\n\n    ![Image](images/f0034-01.jpg)\n\n    1 Flip the photocopy, image\
    \ side down, and tape it firmly into place on the linoleum, keeping the image\
    \ as flat against the linoleum as possible. Any waves in the paper could potentially\
    \ cause the image to bleed.\n\n    ![Image](images/f0034-02.jpg)\n\n    2 Saturate\
    \ the back of the copy with a blender pen, which will make the paper transparent.\
    \ Be careful not to oversaturate the paper otherwise the toner will bleed and\
    \ run.\n\n    ![Image](images/f0034-03.jpg)\n\n    3 Burnish the back of the paper\
    \ with a firm tool until it is visibly dry. Allow it to sit for 5 minutes before\
    \ peeling off the paper.\n\n    #### Glue and Inkjet/Photocopy\n\n    This is\
    \ a great method to use if you have a lot of intricate linework or a larger image\
    \ with a lot of visual information. There are a few different material options\
    \ for this transfer technique, but each yields crisp results. In my own explorations,\
    \ I found that matte-finish Mod Podge with an inkjet print is a good combination,\
    \ as well as Mod Podge Photo Transfer Medium with a photocopy. A cheap alternative\
    \ to Mod Podge is clear-drying wood glue cut with a little bit of water. You’ll\
    \ also need a glue brush and a water-soaked rag. No matter what combination of\
    \ paper/ink/glue you choose, the process is the same.\n\n    ![Image](images/f0035-01.jpg)\n\
    \n    1 Brush a liberal amount of glue onto the surface of the linoleum, smoothing\
    \ out any ridges made by brush bristles and avoiding globs.\n\n    ![Image](images/f0035-02.jpg)\n\
    \n    2 Flip the printed image over and place it on the wet glue, smoothing out\
    \ any air bubbles. The idea is to ensure that each area of the source image comes\
    \ into contact with the linoleum. For best results, allow to dry for 12 hours.\n\
    \n    ![Image](images/f0035-03.jpg)\n\n    3 Take a wet rag and blot the back\
    \ of the drawing. This will make the paper translucent. Let it sit for one or\
    \ two minutes.\n\n    ![Image](images/f0035-04.jpg)![Image](images/f0035-05.jpg)![Image](images/f0035-06.jpg)\n\
    \n    4 Use your finger to gently rub away the paper, revealing the drawing.\n\
    \n    ### CARVING TECHNIQUES\n\n    If thoughtful design is the foundation of\
    \ a great print, then the carving technique is the frame, further supporting the\
    \ overall piece.\n\n    ![Image](images/f0036-01.jpg)\n\n    A lineup of tool\
    \ handles\n\n    #### Grip\n\n    The shape and size of a carving tool’s handle\
    \ determines how you can hold the tool. There are many different styles of handles\
    \ out there—some tools have a mushroom-shaped handle that fits comfortably into\
    \ the palm of your hand, while others have larger, cylindrical handles that accommodate\
    \ longer blades. Shorter blades give you a smaller range of motion and keep your\
    \ hands closer to the cutting edge, both of which are good for detail work. Longer\
    \ tools clear more material faster and are great for working on larger pieces.\
    \ Hold the tool in whatever way feels most natural, but generally it’s best to\
    \ direct the blade away from your body to prevent accidentally stabbing yourself.\
    \ These tools are sharp and can do a lot of damage if you’re not careful, so always\
    \ be conscious of your hand placement.\n\n    ![Image](images/f0037-01.jpg)\n\n\
    \    Carving with a full-size veiner, using my other hand to stabilize the blade\n\
    \n    ![Image](images/f0037-02.jpg)\n\n    Carving one-handed with a palm tool\n\
    \n    ![Image](images/f0037-03.jpg)\n\n    Carving two-handed with a palm tool\n\
    \n    ![Image](images/f0037-04.jpg)\n\n    Sometimes I like to use a backward\
    \ grip in highly detailed areas, as it allows me maximum control. But keep in\
    \ mind that it’s best practice to direct the blade away from the body. You can\
    \ use a leather arm guard (like the kind used by archers) or a Kevlar sleeve to\
    \ protect your carving arm from any possible slips of the blade.\n\n    #### Depth\n\
    \n    In addition to the size and shape of your tool, the angle at which you hold\
    \ it determines the depth of your cuts.\n\n    ![Image](images/f0038-01.jpg)\n\
    \n    Holding the tool at a low angle, tip the blade down slightly to allow it\
    \ to bite into the linoleum. The blade should glide smoothly.\n\n    ![Image](images/f0038-02.jpg)\n\
    \n    Holding the tool at too low an angle will cause the blade to glance off\
    \ the surface.\n\n    ![Image](images/f0038-03.jpg)\n\n    Holding tools at too\
    \ high an angle will cause the top edges of the blade to dip fully under the linoleum’s\
    \ surface, resulting in tears.\n\n    #### Channeling\n\n    One of the easiest\
    \ ways to preserve delicate linework in your design is to carve channels around\
    \ the form’s outline and then clear out the space. These channels create a physical\
    \ barrier that stops the blade.\n\n    Using a tool such as a bench hook will\
    \ help to stabilize your block as you carve, allowing you to push against it with\
    \ strength.\n\n    If you find it at all difficult to cut through the linoleum\
    \ and you’re wiggling the blade back and forth, it’s probably time to sharpen\
    \ your tools! (See Tools and Tool Care shown [here](#ch01.xhtml#page_14).) Some\
    \ artists also find it helpful to heat the linoleum slightly before carving to\
    \ soften it. You can use an iron on a low setting with a towel, but I find that\
    \ sitting on my block like a hen works just as well.\n\n    ![Image](images/f0039-01.jpg)![Image](images/f0039-02.jpg)![Image](images/f0039-03.jpg)\n\
    \n    ### PRINTING TECHNIQUES\n\n    These basic steps for making a relief print\
    \ will stay the same for each project, with only minor variations.\n\n    ![Image](images/f0040-02.jpg)\n\
    \n    1 Using the palette knife, apply a small dollop of ink onto your inking\
    \ plate. (If you’re using ink from a tin rather than a tube, be sure to scrape\
    \ the ink from the top instead of deeply gouging into the ink. This protects the\
    \ ink from excess air exposure, which will cause it to get gummy and dry up.)\
    \ Work the ink back and forth for a few minutes to warm it up, taking care not\
    \ to spread it out any wider than the width of the brayer.\n\n    ![Image](images/f0040-01.jpg)\n\
    \n    2 Touch the brayer to the ink and roll it back toward you, lifting the brayer\
    \ and repeating a few times until the ink spreads consistently on the inking plate.\n\
    \n    ![Image](images/f0040-03.jpg)\n\n    3 Examine the rolled ink. If you spot\
    \ any ink “boogers,” or dried bits of ink, you can pick them out easily with a\
    \ scrap strip of mat board.\n\n    ![Image](images/f0040-04.jpg)"
  fmt: '

    One of the quickest ways to transfer an original graphite drawing requires only
    some elbow grease! This method calls for a pencil drawing, tape, and a burnishing
    tool (a fat permanent marker works great).


    ![Image](images/f0032-01.jpg)


    1 Make a drawing with a soft graphite pencil on thin sketchbook or printer paper.
    Trim away excess paper with scissors.


    ![Image](images/f0032-02.jpg)


    2 Flip the drawing over, graphite side down onto your linoleum block, and tape
    it firmly into place. Take a spoon or butt of a marker and vigorously rub the
    back of the drawing, taking care not to let the paper slip.


    ![Image](images/f0032-03.jpg)


    ### Tracing Paper


    I like this method because it allows you to make changes to the drawing as you
    transfer it to the block. All you need is a pencil, your original image, tape,
    and a piece of tracing paper cut down to size.


    ![Image](images/f0033-01.jpg)


    1 Place the tracing paper over your drawing and trace the lines. Make any necessary
    changes to the drawing as you trace.


    ![Image](images/f0033-02.jpg)


    2 Flip the tracing paper over, then tape it into place on the linoleum block.
    Go over the back of the drawing with a pencil. Use medium pressure, as it’s easy
    to rip through the thin tracing paper.


    ![Image](images/f0033-03.jpg)


    ### Blender Pen


    This method requires a photocopied image (use toner as opposed to ink—this method
    will not work with an inkjet print), a blender pen such as the Chartpak AD Marker
    Colorless Blender, tape, and a burnishing tool. Beware as some blender pens can
    have a very strong smell, so work in a well-ventilated area.


    ![Image](images/f0034-01.jpg)


    1 Flip the photocopy, image side down, and tape it firmly into place on the linoleum,
    keeping the image as flat against the linoleum as possible. Any waves in the paper
    could potentially cause the image to bleed.


    ![Image](images/f0034-02.jpg)


    2 Saturate the back of the copy with a blender pen, which will make the paper
    transparent. Be careful not to oversaturate the paper otherwise the toner will
    bleed and run.


    ![Image](images/f0034-03.jpg)


    3 Burnish the back of the paper with a firm tool until it is visibly dry. Allow
    it to sit for 5 minutes before peeling off the paper.


    ### Glue and Inkjet/Photocopy


    This is a great method to use if you have a lot of intricate linework or a larger
    image with a lot of visual information. There are a few different material options
    for this transfer technique, but each yields crisp results. In my own explorations,
    I found that matte-finish Mod Podge with an inkjet print is a good combination,
    as well as Mod Podge Photo Transfer Medium with a photocopy. A cheap alternative
    to Mod Podge is clear-drying wood glue cut with a little bit of water. You’ll
    also need a glue brush and a water-soaked rag. No matter what combination of paper/ink/glue
    you choose, the process is the same.


    ![Image](images/f0035-01.jpg)


    1 Brush a liberal amount of glue onto the surface of the linoleum, smoothing out
    any ridges made by brush bristles and avoiding globs.


    ![Image](images/f0035-02.jpg)


    2 Flip the printed image over and place it on the wet glue, smoothing out any
    air bubbles. The idea is to ensure that each area of the source image comes into
    contact with the linoleum. For best results, allow to dry for 12 hours.


    ![Image](images/f0035-03.jpg)


    3 Take a wet rag and blot the back of the drawing. This will make the paper translucent.
    Let it sit for one or two minutes.


    ![Image](images/f0035-04.jpg)![Image](images/f0035-05.jpg)![Image](images/f0035-06.jpg)


    4 Use your finger to gently rub away the paper, revealing the drawing.


    ## CARVING TECHNIQUES


    If thoughtful design is the foundation of a great print, then the carving technique
    is the frame, further supporting the overall piece.


    ![Image](images/f0036-01.jpg)


    A lineup of tool handles


    ### Grip


    The shape and size of a carving tool’s handle determines how you can hold the
    tool. There are many different styles of handles out there—some tools have a mushroom-shaped
    handle that fits comfortably into the palm of your hand, while others have larger,
    cylindrical handles that accommodate longer blades. Shorter blades give you a
    smaller range of motion and keep your hands closer to the cutting edge, both of
    which are good for detail work. Longer tools clear more material faster and are
    great for working on larger pieces. Hold the tool in whatever way feels most natural,
    but generally it’s best to direct the blade away from your body to prevent accidentally
    stabbing yourself. These tools are sharp and can do a lot of damage if you’re
    not careful, so always be conscious of your hand placement.


    ![Image](images/f0037-01.jpg)


    Carving with a full-size veiner, using my other hand to stabilize the blade


    ![Image](images/f0037-02.jpg)


    Carving one-handed with a palm tool


    ![Image](images/f0037-03.jpg)


    Carving two-handed with a palm tool


    ![Image](images/f0037-04.jpg)


    Sometimes I like to use a backward grip in highly detailed areas, as it allows
    me maximum control. But keep in mind that it’s best practice to direct the blade
    away from the body. You can use a leather arm guard (like the kind used by archers)
    or a Kevlar sleeve to protect your carving arm from any possible slips of the
    blade.


    ### Depth


    In addition to the size and shape of your tool, the angle at which you hold it
    determines the depth of your cuts.


    ![Image](images/f0038-01.jpg)


    Holding the tool at a low angle, tip the blade down slightly to allow it to bite
    into the linoleum. The blade should glide smoothly.


    ![Image](images/f0038-02.jpg)


    Holding the tool at too low an angle will cause the blade to glance off the surface.


    ![Image](images/f0038-03.jpg)


    Holding tools at too high an angle will cause the top edges of the blade to dip
    fully under the linoleum’s surface, resulting in tears.


    ### Channeling


    One of the easiest ways to preserve delicate linework in your design is to carve
    channels around the form’s outline and then clear out the space. These channels
    create a physical barrier that stops the blade.


    Using a tool such as a bench hook will help to stabilize your block as you carve,
    allowing you to push against it with strength.


    If you find it at all difficult to cut through the linoleum and you’re wiggling
    the blade back and forth, it’s probably time to sharpen your tools! (See Tools
    and Tool Care shown [here](#ch01.xhtml#page_14).) Some artists also find it helpful
    to heat the linoleum slightly before carving to soften it. You can use an iron
    on a low setting with a towel, but I find that sitting on my block like a hen
    works just as well.


    ![Image](images/f0039-01.jpg)![Image](images/f0039-02.jpg)![Image](images/f0039-03.jpg)


    ## PRINTING TECHNIQUES


    These basic steps for making a relief print will stay the same for each project,
    with only minor variations.


    ![Image](images/f0040-02.jpg)


    1 Using the palette knife, apply a small dollop of ink onto your inking plate.
    (If you’re using ink from a tin rather than a tube, be sure to scrape the ink
    from the top instead of deeply gouging into the ink. This protects the ink from
    excess air exposure, which will cause it to get gummy and dry up.) Work the ink
    back and forth for a few minutes to warm it up, taking care not to spread it out
    any wider than the width of the brayer.


    ![Image](images/f0040-01.jpg)


    2 Touch the brayer to the ink and roll it back toward you, lifting the brayer
    and repeating a few times until the ink spreads consistently on the inking plate.


    ![Image](images/f0040-03.jpg)


    3 Examine the rolled ink. If you spot any ink “boogers,” or dried bits of ink,
    you can pick them out easily with a scrap strip of mat board.


    ![Image](images/f0040-04.jpg)


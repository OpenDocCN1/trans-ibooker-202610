    \ *我们为什么制作事物以及它为什么重要：工匠的教育*. Boston: David R. Godine, 2013.\n\nMartha Stewart\
    \ Living Magazine. *玛莎·斯图尔特缝纫与布艺百科全书：缝纫、拼布、刺绣、拼缝、染色和印刷的基础技术，以及从 A 到 Z 的 150 个灵感项目*.\

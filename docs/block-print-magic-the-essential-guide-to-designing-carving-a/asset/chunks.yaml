    \n![Image](images/f0139-01.jpg)![Image](images/f0139-02.jpg)\n\nSpines of *UPPERCASE\
    \ magazine*—you don’t even have to open one to get inspired! (But please do, you\
    \ won’t regret it.)\n\n## ACKNOWLEDGMENTS\n\nMany people contributed to this little\
    \ volume of magic. Thanks are due first and foremost to my generous editor Judith,\
    \ who kept me encouraged and focused throughout the writing process and to Rockport\
    \ Publishers, who transformed me from an artist into an author—a lifelong dream.\
    \ To my contributors Lili Arnold, Jen Hewett, Kelli MacConnell, Derrick Riley,\
    \ and Aftyn Shah—thank you for giving us glimpses into your work, your spaces,\
    \ and your hearts.\n\n![Image](images/f0140-01.jpg)\n\nThank you to my incredible\
    \ support system of family and friends, namely my parents for believing in me\
    \ before I ever believed in myself, for teaching me to read, for encouraging my\
    \ strangeness and nurturing my curiosity. This book wouldn’t exist if you hadn’t\
    \ loved me so very well. Thanks also to the fiercely loving gang of girlfriends\
    \ who were by my side throughout this process, especially Kyle and “The Aunties”—if\
    \ I shine, it’s only because I’m reflecting your light. And to David…thank you\
    \ for everything.\n\nMy life has been touched by a great many teachers who, like\
    \ most, sacrifice much for the benefit of the next generation. My public education\
    \ in Kentucky set me on a path of lifelong curiosity with the guidance of passionate,\
    \ talented teachers like Terri Schatzman and Roberta Schultz. Many thanks to the\
    \ art department faculty and staff at the University of Kentucky and the University\
    \ of Cincinnati who allowed me to flourish in their programs.\n\nThanks especially\
    \ (and again) to Derrick Riley, my teacher and friend, for getting me into this\
    \ mess.\n\n## ABOUT THE AUTHOR\n\nEmily Louise Howard is a printmaker and illustrator\
    \ born in Burlington, Vermont, and reared in Erlanger, Kentucky. Identifying as\
    \ an artist since the tender age of seven, she has spent her life in the pursuit\
    \ of visual expression and storytelling. Emily earned her undergraduate degree\
    \ from the University of Kentucky and earned two master’s degrees in Fine Arts\
    \ and Visual Art Education from the University of Cincinnati. Having spent a few\
    \ enriching years as a public school art teacher in northern Kentucky, Emily is\
    \ now a full-time printmaker who runs her one-woman fine art printmaking business\
    \ and studio practice, The Diggingest Girl, from her home studio with the help\
    \ of her cat, Selu. Emily’s feminine, narrative prints are collected internationally\
    \ and inspired by the natural world, the human body and stories of all kinds.\n\
    \nFollow along with Emily’s printmaking journey through her website:\n\n[www.thediggingestgirl.com](http://www.thediggingestgirl.com)\n\
    \nFor a more intimate look into the daily life of a printmaker, see Emily’s work\
    \ on Instagram as @thediggingestgirl.\n\n## INDEX\n\nA\n\nAcid-free paper, [19](#ch01.xhtml#page_19)\n\
    \nAdditive, [137](#gloss.xhtml#page_137)\n\nAdhesives, [21](#ch01.xhtml#page_21)\n\

    \ CUT PRINTS\n\n    With reduction prints you will only ever be able to do a single,\
    \ limited-edition run. Because you use the same piece of substrate for each block,\
    \ you essentially destroy the first block in order to make the second—and then\
    \ destroy the second in order to make the third, and so on.\n\n    ### ARTIST\
    \ SPOTLIGHT:  \n\n    DERRICK RILEY\n\n    My life changed forever when, as a\
    \ senior at the University of Kentucky, I took my very first printmaking class,\
    \ beginning woodcut, with Derrick Riley. An MFA and member of the Kentucky Division\
    \ of the famed Outlaw Printmakers, Riley has been operating his own press since\
    \ 2005, churning out epic-scale narrative prints that celebrate the strangest\
    \ of Kentucky folklore, randy robots, and curious creature mashups. He’s known\
    \ for his bold, graphic style and finely detailed renderings of form.\n\n    ![Image](images/f0071-01.jpg)\n\
    \n    Cyclopian Gorilla\n\n    ###### EH: How did you first become interested\
    \ in printmaking?\n\n    DR: I was a drawing major as an undergrad, and a printmaking\
    \ course was required for my degree. During the course, in 2000, there was a Joel\
    \ Feldman retrospective at the university museum. The exhibition had these gigantic\
    \ banner style black and white woodcuts of Aesop’s Fables that were amazing. Until\
    \ that time I had never realized that a print could be that large. After that\
    \ I was hooked.\n\n    ###### EH: What drew you to relief in particular?\n\n \
    \   DR: Several things initially drew me into relief printmaking. First of all,\
    \ playing with knives all day is pretty awesome. And I was intrigued with how\
    \ the visual power of a limited palette—and the stark contrast of white and black—is\
    \ far greater than a full palette. I also happen to be very heavy handed, and\

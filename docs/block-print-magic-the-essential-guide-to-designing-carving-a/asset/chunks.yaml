    一块废板

    一根薄而窄的木条或纸板条

    胶带

    胶水

    尺子

    铅笔

    定位销和固定片


    ### 开始制作！

    1 取一块废板（如果板面方正、边缘笔直且呈 90 度角会更好），并将其薄条沿顶部粘在上面。让其完全粘合。这个条的底部边缘将作为挡块来对齐印刷纸的顶部边缘。

    ![图像](img/f0046-01.jpg)

    2 将定位销放在条上，使其与条的底部边缘对齐。用胶带牢固地固定住。（我使用胶带制作这个装置，这样在处理不同尺寸的版块时可以移动各个部件。）

    ![图像](img/f0046-02.jpg)

    3 定位销可以固定纸张，但我们也需要固定版块。把两条裱板/卡纸/瓦楞纸板像字母 L 一样放在一起形成 90 度角。决定好版块的放置位置，然后将 L 用胶带牢固地粘在板上，位于版块左下角的位置。关于使用此装置的更详细说明，可在

    \n    The final product, a bit spiffed up\n\n    ### PROJECT:  \n\n    ONE-PAGE\
    \ POCKET ZINE\n\n    Perhaps the greatest legacy of printmaking is its role in\
    \ democratizing knowledge. The advent of Johannes Gutenberg’s movable type press\
    \ in 1436 allowed for faster production of printed materials in Europe; books\
    \ became more widely available and the working classes gained literacy. Given\
    \ this history, we would be remiss to leave out text in our linoleum prints.\n\
    \n    Part of the appeal of printmaking is the potential for nearly limitless\
    \ multiples, so it’s the perfect medium for creating your very own zine to distribute.\
    \ A zine is a self-published, small-circulation book or magazine that is usually\
    \ photocopied and hand bound. For this project, you’ll be making your very own\
    \ hand-bound and hand-printed zine out of one standard U.S. letter size (or A4)\
    \ sheet of paper.\n\n    Tools and Materials\n\n    8 1/2\" x 11\" (21.5 x 28\
    \ cm) unmounted linoleum\n\n    Drawing paper\n\n    Tracing paper\n\n    Pencil\n\
    \n    Washi/masking tape\n\n    Carving tools\n\n    Ink\n\n    Brayer\n\n   \
    \ Inking plate\n\n    Palette knife\n\n    Baren\n\n    Scissors\n\n    ![Image](images/f0088-01.jpg)\n\
    \n    Zines originally emerged as science-fiction-fan magazines in the 1930s,\
    \ picking up in popularity again with the rise of *Star Trek*, but then quickly\
    \ spread to the music scene. The proliferation of copy shops in the 1970s and\
    \ 1980s along with DIY aesthetic of punk music caused the creating and trading\
    \ of zines to expand because of quicker and cheaper distribution. Zines today\
    \ vary a great deal in size, style and content.\n\n    ##### Make a Plan\n\n \
    \   Decide what you want your zine to be about, and then start designing and planning\
    \ each page. Keep in mind that we’re only going to have six usable “content” pages—you\
    \ will have eight pages in total, but two of those are the front and back covers.\
    \ Each page will end up measuring 4 1/4\" x 2 3/4\" (10.8 x 7 cm) and will be\
    \ oriented portrait.\n\n    Having trouble thinking of an idea? Here are some\
    \ potential titles to get your brain churning.\n\n    Things I Know for Sure\n\
    \n    A Simple Recipe\n\n    A 6-Line Poem About Hope\n\n    A 6-Word Poem About\
    \ Breakups\n\n    A Word of Advice\n\n    A Letter to My Haters\n\n    Things\
    \ I Love About You\n\n    What I Wish I’d Said\n\n    How to Make Friends with\
    \ a Baby\n\n    Lies I’ve Told\n\n    A List of Favorite Foods\n\n    A Public\
    \ Service Announcement\n\n    Things My Dog Would Say\n\n    ![Image](images/f0089-01.jpg)\n\

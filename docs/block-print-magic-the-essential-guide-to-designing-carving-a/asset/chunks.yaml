    ### PROJECT: REDUCTION CUT SUNFLOWERS


    在这个项目中，我们探索减版雕刻——一种色彩印刷方法，你反复使用同一块版，每增加一层颜色就雕刻掉更多部分。花朵一直是艺术家的永恒题材，它们的丰富色彩和形状使其成为研究减版雕刻的绝佳对象。


    #### Tools and Materials

    4" x 8" (10 x 20 cm) 未装裱的软木版

    铅笔

    彩色铅笔

    尺子

    永久性记号笔

    描图纸

    雕刻工具

    针孔定位注册装置（见这里）

    定位片

    和纸/遮蔽胶带

    上墨板

    三种颜色的墨水

    调色刀

    压墨辊

    9" x 12" (23 x 30.5 cm) 印刷纸

    擦印棒



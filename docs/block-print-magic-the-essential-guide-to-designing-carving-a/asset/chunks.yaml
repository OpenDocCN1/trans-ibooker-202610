    这种方法需要使用 Ternes-Burton 定位销和剥离片，它们可以直接从公司网站或大多数库存充足的在线艺术用品零售商处获得。它们价格便宜且效果极佳——我认为这是三种中最精确的定位技术。剥离片粘贴在纸上，而定位销粘贴在夹具上。固定片插入定位销中，使纸张牢固地固定在原位。


    ### 工具和材料

    一块废板

    一根薄而窄的木条或纸板条

    胶带

    胶水

    尺子

    铅笔

    定位销和固定片


    ### 开始制作！

    1 取一块废板（如果板面方正、边缘笔直且呈 90 度角会更好），并将其薄条沿顶部粘在上面。让其完全粘合。这个条的底部边缘将作为挡块来对齐印刷纸的顶部边缘。

    ![图像](img/f0046-01.jpg)

    2 将定位销放在条上，使其与条的底部边缘对齐。用胶带牢固地固定住。（我使用胶带制作这个装置，这样在处理不同尺寸的版块时可以移动各个部件。）

    ![图像](img/f0046-02.jpg)

    3 定位销可以固定纸张，但我们也需要固定版块。把两条裱板/卡纸/瓦楞纸板像字母 L 一样放在一起形成 90 度角。决定好版块的放置位置，然后将 L 用胶带牢固地粘在板上，位于版块左下角的位置。关于使用此装置的更详细说明，可在减切向日葵项目中找到，显示于这里。


    ### 印刷后清洁

    适当的清洁可以延长工具的使用寿命，保持印品的完整性，并帮助你在工作室保持理智。每次印刷后都要遵循此清洁流程。（说明适用于本书通篇使用的油性、可水洗油墨。）

    将所有湿润的印品挂在晾干架上。

    **清洁压滚：** 通过在旧电话簿或杂志上滚动压滚来去除多余油墨。丢弃并重复，直到纸上不再沾有油墨为止。用肥皂和水在水槽中清洗。

    **清洁上墨板：** 用刮墨刀、调色刀或裱板条刮除多余油墨。如果油墨未受污染（即未混入其他物质），多余油墨可放回原容器。如果油墨受污染或无法放回容器（例如来自油管），则丢弃。刮除油墨后，用消毒湿巾擦拭板面是最快最有效的方法。或者也可以使用植物油和纸巾。

    **擦拭调色刀上的多余油墨**并用植物油和纸巾或消毒湿巾彻底清洁。

    **清洁版块：** 用报纸或废纸按压版块以吸走多余油墨。用植物油或消毒湿巾擦拭。虽然本书使用的油墨可用肥皂和水清洁，但我尽量保持版块干燥。如果未装裱的油印布的麻布衬背太湿，可能会导致油印布卷曲。

    **拧紧所有瓶盖和盖子**，并将任何油墨存放在避光的透明容器中。

    **彻底洗手**，使用浮石皂如 Permatex Fast Orange（这类肥皂很容易在五金或汽车用品店找到。而且非常耐用——我已经使用同一瓶 64 盎司的容器超过两年了）。用刷子刷洗指甲下方。


    ### 版次

    版次是一组相同的印品。版次中的每张印品都被视为原作，并由艺术家在印品底部编号、签名并标注日期。大多数艺术家选择用铅笔签名。艺术家的签名传统上位于右下角，印品标题位于中央。在左下角你会找到版次编号：

    #### 编号

    如果你制作 20 张的版次，你会将每张印品编号为 1/20、2/20、3/20，依此类推。虽然每张印品应尽可能相同，但通常版次中质量最干净/最好的印品编号会更靠前。因此，100
    张版次中的第一张印品（1/100）质量/价值会高于 96/100。

    还有其他方式来标识印品。有时在印品底部你会看到 A/P 或 AP，表示艺术家样张。版块的前几次拉印被称为测试印或样张，不被视为版次的一部分。这是在测试需要涂抹多少油墨、调整巴伦或压机的压力，并对版块进行最后雕刻的时间。


    # 第 3 章


    ## 基础

    本章的项目将带你游览浮雕印刷工艺的基础概念。在这里你将学习如何：

    ![图像](img/bulla.jpg)  通过操纵工具实现多种纹理；

    ![图像](img/bulla.jpg)  使用三个独立版块制作三色印品；

    ![图像](img/bulla.jpg)  使用单个版块制作三色印品；

    ![图像](img/bulla.jpg)  操纵线条以呈现物体的三维效果；

    ![图像](img/bulla.jpg)  使用拼贴和手绘来装饰印品；

    ![图像](img/bulla.jpg)  使用文字印刷你自己的微型书

    完成这些项目后，你将学会一点逆向思维。请记住，浮雕印刷本质上是一种**减法**或**减去**的过程——艺术家*去除*版块上的油印布以显现设计（与之对比，手捏陶艺是一种**加法**过程——元素会逐渐*添加到*造型上）。学会减法思维将帮助你更好地规划印品并实现更细腻的效果。

    ![图像](img/f0048-01.jpg)


    ### 项目：纹理拼布块

    了解你的雕刻工具并掌握其魔力的最好方式就是直接上手！这种经典的月光星拼布图案为在同一项目中尝试记号制作、纹理和明暗提供了完美的视觉结构。

    在这个项目中，你将尝试使用尽可能多的雕刻工具来制作尽可能多的不同纹理和明暗。

    这将涉及尝试：

    ![图像](img/bulla.jpg)  你每种工具或刀片所产生的形状

    ![图像](img/bulla.jpg)  刀片在油印布中的深度

    ![图像](img/bulla.jpg)  笔触的长度

    ![图像](img/bulla.jpg)  笔触的方向

    ![图像](img/bulla.jpg)  记号的间距

    ![图像](img/bulla.jpg)  切割是相交还是平行

    我们不需要使用任何转印技术来进行这次纹理探索，因为我们将直接在版块上作画。我建议先用铅笔绘制完整设计，然后用永久性记号笔描过你的绘画，这样可以修改任何错误。

    #### 工具和材料

    9" x 9" (23 x 23 cm) 未装裱的油印布

    铅笔

    尺子

    永久性记号笔

    雕刻工具

    上墨板

    调色刀

    压滚

    12" x 12" (30.5 x 30.5 cm) 印刷纸

    巴伦

    ![图像](img/f0050-01.jpg)![图像](img/f0051-01.jpg)

    1 首先在油印布版块上制作一个 1 1/2" (4 cm) 的网格。使用尺子进行精确测量，在版块周边每隔 1 1/2" (4 cm) 做标记。

    ![图像](img/f0051-02.jpg)

    2 用尺子将相对边缘的标记对齐，以其为导向在版块上画出垂直线。你应该得到 36 个每个测量 1 1/2" (4 cm) 的正方形。

    ![图像](img/f0051-03.jpg)

    3 找到每条边缘的中点标记。用尺子连接四个中点标记以制作一个菱形。


    ### PROJECT: REDUCTION CUT SUNFLOWERS


    In this project, we explore the reduction cut—a method of color printing in which
    you use the same block over and over, carving more away with each new layer of
    color. Flowers have been an enduring subject for artists, and their wide range
    of colors and shapes make them great for study when it comes to reduction cuts.


    #### Tools and Materials

    4" x 8" (10 x 20 cm) unmounted linoleum

    Pencil

    Colored pencils

    Ruler

    Permanent marker

    Tracing paper

    Carving tools

    Pin-and-tab registration device (see [here](#ch02.xhtml#page_46))

    Tabs

    Washi/masking tape

    Inking plate

    Three colors of ink

    Palette knife

    Brayer

    9" x 12" (23 x 30.5 cm) printing papers

    Baren


    ![Image](images/f0064-01.jpg)![Image](images/f0065-01.jpg)


    1 Before we begin drafting the block, let’s prepare our printing materials. First,
    we need to add a custom jig to the pin-and-tab registration device (see [here](#ch02.xhtml#page_46)).
    I knew that I wanted the block relatively centered within the printing paper,
    so with a pencil I drew two guidelines on the registration device to center the
    block vertically. Then I eyeballed it so the block would fall between the pins,
    thus centering the block horizontally.


    ![Image](images/f0065-02.jpg)


    2 Place a heavy object (I used a stone) on the block to keep it from scooting
    out of position. Take two strips of mat board, chipboard, or cardboard and position
    them perpendicular to one another to form a 90-degree angle. Tape these strips
    firmly into place at the bottom left-hand corner of the block.


    3 Now that the jig is ready, the paper must be prepared. Cut or tear paper to
    9" x 12" (23 x 30.5 cm). Take a sheet of paper and lay it on the registration
    device. Line up the top edge of the paper by placing it flush against the raised
    strip (the bit of board to which the tabs are taped). Once the paper is aligned,
    attach two tabs to the pins, which will then overlap the top edge of the paper.
    Tape the tabs into place. Repeat this process for the rest of the papers (as always,
    the edition size is up to you). These tabs will remain attached to your papers
    until you’ve printed the third and final color.



  trans: '

    DR：我家地下室有一个惊人的工作室，我非常为它自豪。它配备齐全，拥有制作木刻、胶版画和丝网印刷所需的一切。我有一台电动蚀刻压机，以及一台用于印刷凸版画的平版打样压机，还有全尺寸晾干架、一台可一次裁切

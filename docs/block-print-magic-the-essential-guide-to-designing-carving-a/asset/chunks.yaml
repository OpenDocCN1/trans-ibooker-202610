    ## OIL-BASED INKS


    There are two kinds of oil-based inks: those that require solvents for cleanup
    and those that are water soluble/washable. Both yield equally velvety finishes
    and hold strong, vivid color. Solvents such as turpentine and kerosene are the
    most efficient cleaners of oil-based inks, but are quite toxic. A safer cleanser
    is plain old vegetable oil. Simply saturate a paper towel and wipe. This tends
    to leave a residue on the block, so I usually follow up with a disinfectant wipe.
    My favorite ink of this variety is Gamblin Relief Ink.


    Water-soluble oil-based inks are made with vegetable oil. Wonderfully nontoxic,
    these inks are vibrant and have a tack that makes for uniform coverage. They’re
    easy to clean up with soap and water or disinfectant wipes. Caligo Safe Wash Relief
    Inks are a great choice, and were used for the majority of the projects in this
    book.


    ### INK MODIFIERS


    There are many different kinds of additives that you can mix into your ink to
    achieve different results. Adding a drop of cobalt **drier** to ink will significantly
    speed up the drying time of your prints. Cobalt drier is quite toxic, however,
    so handle it with gloves. Adding **extenders** or **transparent base** will dilute
    the color of the ink without changing its viscosity—think of it as turning down
    an ink’s opacity.


    Adding **retarder** will slow down the drying time of the ink, which is nice if
    you like to work slowly or you’re pulling a large number of prints. However, keep
    in mind you’ll need to keep your prints in the drying rack a little longer, too.


    ## Papers


    Although, technically, you can print onto nearly any flat surface, the cheapest,
    easiest, and most widely available surface is paper. There’s something so tactile
    and rich and just plain *pleasant* about rubbing a decadently thick sheet of gorgeous
    paper between your fingers. Lucky for me (and you too) there are many different
    kinds of paper on the market today. The most common ingredients in artists’ papers
    are wood pulp, cotton rag, pulped linen, and mulberry/kozo—all are great choices
    for printing linoleum blocks by hand. It’s fine to use any old paper when you’re
    learning in your own home for fun, but you’ll find that the higher quality paper
    you choose, the better your prints will be.


    ![Image](images/f0019-01.jpg)


    Here are some helpful things to know about paper as you experiment and decide
    what you like best.


    ![Image](images/f0019-02.jpg)


    Left column


    Blick Masterprinter paper, 74 gsm


    Yasutomo Japanese mulberry paper, 71.5 gsm


    Daler Rowney Canford paper in dreadnought gray, 150 gsm


    Canson Edition paper in antique white, 250 gsm


    Right column


    Thai Tamarind Leaves mulberry paper, 30 gsm


    Canson Mi-Teintes drawing paper in no. 502 bisque, 160 gsm


    Stonehenge paper in warm white, 250 gsm


    BFK Rives paper in white, 280 gsm.


    ### ACID FREE AND ARCHIVAL


    The ideal papers to use are free of lignin, an acidic substance in wood pulp that
    causes paper to yellow and turn brittle over time. Paper that is acid free is
    known as archival, which essentially means that it will last a really long time.
    One hundred percent cotton rag paper is naturally acid free and is a great choice.
    Professional printmakers are sure to select archival, acid-free papers to ensure
    their artwork lasts for many years.


    ### WEIGHT


    The weight or thickness of a given paper is measured in grams per square meter
    (gsm). The higher the gsm, the thicker the paper. You can use papers of all thicknesses
    in relief printmaking, depending on the type of inks and blocks you use and the
    final look you hope to achieve. Thinner papers are great for printing by hand,
    but they can sometimes lack the luxurious feel and look of thicker papers. Some
    handmade papers have lots of texture that can drastically affect the evenness
    of a print. Try out a wide variety of papers, and you will come to learn which
    works best for you and your specific project.


    ### HOT PRESSED AND COLD PRESSED


    Machine-made papers pass through a series of metal cylinders that are heated and
    compressed or cooled and more loosely compressed to create different textures.
    Hot-pressed paper has a smooth surface with a fine grain. Cold-pressed paper has
    a slightly toothier, or more textured, surface.


    ## MISCELLANEOUS EQUIPMENT


    ### Drawing Materials


    Sketchbook


    Pencils


    Pencil case


    Eraser


    Black permanent markers


    Tracing paper


    Drafting brush/duster


    Carbon paper


    ![Image](images/f0020-01.jpg)


    ### Other Useful Materials


    Apron


    Boxcutter


    Scissors


    Roll of butcher/kraft paper


    Washi or masking tape


    Ink scraper


    Mat board strips


    Disinfectant wipes


    Paper towels


    Pumice soap


    ![Image](images/f0021-01.jpg)


    ### Mixed Media Materials


    Craft knife


    Self-healing cutting mat


    A yard (1 m) of unbleached 100% cotton duck (also known as duck cloth)


    Basic sewing kit (needle set, all-purpose thread)


    Embroidery hoop


    Embroidery floss


    Embroidery needle


    Set of gouache or watercolor paints


    Palette, water cup, paintbrushes


    Bone folder


    Adhesives


    #### A Note on Adhesives


    You’ll need to join paper to paper for multiple projects in this book, and using
    the wrong adhesive can be disastrous for the fate of your prints. Some glues can
    cause papers to warp, wrinkle, turn yellow, and deteriorate. PVA glues, however,
    are acid free and will not yellow over time. They dry clear and remain flexible.
    Yes Paste and Nori Paste are both good options, as they are slow-drying (giving
    you more time to position your work) and won’t cause excessive buckling of your
    papers.


    ![Image](images/f0021-02.jpg)


    ## ANATOMY OF A PRINT STUDIO


    Now that all of your materials are sorted, the next challenge is finding the space
    to do it all. I recall the following quote by Joseph Campbell as I set up my studio
    space in my home:


    *“\[A sacred place\] is an absolute necessity for anybody today. You must have
    a room, or a certain hour or so a day, where you don''t know what was in the newspapers
    that morning, you don''t know who your friends are, you don''t know what you owe
    anybody, you don''t know what anybody owes to you. This is a place where you can
    simply experience and bring forth what you are and what you might be. This is
    the place of creative incubation. At first you may find that nothing happens there.
    But if you have a sacred place and use it, something eventually will happen.”*


    ![Image](images/f0022-01.jpg)![Image](images/f0022-02.jpg)


    The studio is a world apart from politics, bills, and the million tiny worries
    that bombard me throughout the day. It’s a place where magic lives—I just have
    to show up and activate it. But first I have to invite the magic in. My own humble
    space boasts of an awkward L-shaped layout with a lot of homemade equipment, dotted
    with too many stacks of paper. But it is heaven on earth to me. You don’t need
    a studio that rivals one you’d find at the Rhode Island School of Design and it
    doesn’t need to make Martha Stewart turn green with envy. The main goal of your
    creative space—whether it is a separate room, alcove, or just a temporary tabletop—is
    to make the print process as efficient, comfortable, and inspiring as possible.


    ![A simple set up](images/f0023-01.jpg)


    Potential tabletop layout


    An efficient studio layout starts with consideration of the activities you’ll
    be performing, in my case, the basic steps to pulling a print:


    Drafting designs


    Carving blocks


    Inking


    Printing


    Drying


    Storing


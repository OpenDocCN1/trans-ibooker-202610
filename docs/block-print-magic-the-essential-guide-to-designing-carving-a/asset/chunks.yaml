- raw: "    Water-soluble fabric marking pen\n\n    Printing Tools and Materials\n\
    \n    Ink\n\n    Baren\n\n    Inking plate\n\n    Palette knife\n\n    Brayer\n\
    \n    ![Image](images/f0122-01.jpg)\n\n    Notes for Printing on Fabric\n\n  \
    \  To get an even print on fabric, you might find it helpful to first lay a towel\
    \ on the printing surface, creating more cushion.\n\n    The toothier, or rougher,\
    \ the fabric, the less even your print will be.\n\n    For the best results, use\
    \ inks that are specifically formulated to be used on fabrics—consider their permanence\
    \ and solubility. Speedball makes a great line of fabric block-printing inks,\
    \ but my favorite to use are Gamblin relief inks—especially Gamblin Textile Ink.\
    \ Both of these inks are oil based, and so can both be washed again and again\
    \ without running or losing intensity.\n\n    Always do a few test runs on paper\
    \ before printing on fabric—this helps to prime the block, getting it fully loaded\
    \ with ink.\n\n    Heat setting: Check the product information on the ink to find\
    \ out whether or not you need to heat set the ink to make it permanent.\n\n  \
    \  Allow the print on fabric to fully dry before manipulating it—otherwise you\
    \ run the risk of smearing ink. To speed drying time, you can add cobalt drier\
    \ to the ink before you print (using gloves!) and point a fan at the drying rack.\n\
    \n    ![Image](images/f0123-01.jpg)![Image](images/f0123-02.jpg)\n\n    1 Iron\
    \ flat a clean 1/2 yard (45.5 cm) piece of unbleached cotton canvas, and then\
    \ cut it in half. One half will comprise the base for your wall hanging and the\
    \ other half is for experimentation and printing additional elements. I kept the\
    \ design of the central block simple to allow room for improvisation and printed\
    \ it in the center of the canvas.\n\n    ![Image](images/f0124-01.jpg)\n\n   \
    \ 2 Whenever I can, I like to repurpose blocks from previous projects, so I printed\
    \ several additional hands from the Puzzle Block Project (shown [here](#ch04.xhtml#page_96))\
    \ onto my extra canvas and cut them out. To keep the edges of fabric sharp, clean,\
    \ and unfrayed, before cutting into the fabric, “trace” around the perimeter of\
    \ the image with a liquid fray stopper. Once dry, cut out the shapes just as you\
    \ would if they were printed on paper. (Warning: Liquid fray stoppers can cause\
    \ water-soluble inks to run, so always test first.)\n\n    3 Joining a smaller\
    \ piece of fabric to a larger one is called appliqué. Traditionally, applique\
    \ is done by sewing the pieces together, but here I used a permanent fabric adhesive\
    \ called Liquid Stitch.\n\n    ![Image](images/f0124-02.jpg)\n\n    4 After placing\
    \ the hands, the bulk of my design was complete. Using a water-soluble marking\
    \ pen, I drew a banner shape around my image and cut it out, allowing extra room\
    \ on all sides for hemming.\n\n    5 To hem the edge of a piece of fabric, simply\
    \ fold the edge once, then again, and stitch through all layers.\n\n    ![Image](images/f0125-01.jpg)\n\
    \n    6 Hem the top edge of the banner, stitching close to first fold to allow\
    \ a narrow sleeve for the wooden dowel to slide through.\n\n    ![Image](images/f0125-02.jpg)\n\
    \n    A QUICK EMBROIDERY PRIMER  \n\n    Embroidery is a beautiful means of hand\
    \ embellishing the surface of a fabric: I like to think of it as drawing with\
    \ thread. Though some consider it a tedious task, I find the practice of embroidery\
    \ to be incredibly relaxing and meditative. It’s easy and convenient to carry\
    \ a work-in-progress around with you to pick up whenever you have a free moment.\n\
    \n    Here are three different stitches that can be used to embellish fabric.\n\
    \n    ![Image](images/f0125-03.jpg)\n\n    **Running stitch:** small, even stitches\
    \ that run in and out of the cloth, and which appear like a dotted line; running\
    \ stitches grouped together to fill a background are called **seed stitches.**\n\
    \n    ![Image](images/f0125-04.jpg)\n\n    **Split stitch:** a chain stitch in\
    \ which the needle is brought back through the previous stitch; it appears like\
    \ an unbroken line\n\n    ![Image](images/f0125-05.jpg)\n\n    **Satin stitch:**\
    \ long, straight stitches that are made parallel and close together to fill a\
    \ space\n\n    ![Image](images/f0126-01.jpg)\n\n    7 To prepare your wall hanging\
    \ for hand embellishment, place it in the embroidery hoop. The hoop is made of\
    \ two circles, a smaller one fitting inside a slightly larger one with a clamp.\
    \ Place the small hoop underneath the fabric and the larger hoop on top, sandwiching\
    \ the fabric between the hoops. Gently pull the fabric taut like a drum and tighten\
    \ the clamp to hold it in place.\n\n    ![Image](images/f0126-02.jpg)\n\n    8\
    \ I began my stitching with a satin stitch in the outer ring of the design, filling\
    \ in the empty space with parallel stitches in an array of colors.\n\n    ![Image](images/f0127-01.jpg)\n\
    \n    9 I added longer-length satin stitches to fill in the center of the the\
    \ floral pods (gold thread). A series of running stitches grouped together make\
    \ up the seed stitch, and is used for background filling.\n\n    ![Image](images/f0127-02.jpg)\n\
    \n    10 Reposition the hoop as necessary according to the needs of your design.\n\
    \n    ![Image](images/f0127-03.jpg)\n\n    11 When finished with the stitching,\
    \ remove the fabric from the hoop and lay flat to iron out any wrinkles. Slide\
    \ the 14\" (35.5 cm) dowel through the sleeve you created when hemming the banner\
    \ (store-bought canvas banners are usually already outfitted with hanging hardware).\
    \ Use a length of jute, hemp, or any other sturdy string to tie around each end\
    \ of the dowel for hanging.\n\n    ## CHAPTER 5\n\n    ## WASTE NOT\n\n    I ’ve\
    \ never been all that interested in perfection. The works of art that speak the\
    \ loudest to my soul are always those in which the artist’s hand is clearly evident.\
    \ I love to search for wayward marks, cracks, odd proportions, and strange color\
    \ combinations in every piece I consume because, to me, the “mistakes” are the\
    \ fulcrums of magic in a given work of art. *Kintsugi* is the Japanese art of\
    \ lovingly repairing broken ceramics with a special gold, silver, or platinum\
    \ lacquer—essentially highlighting a mistake and turning it into something sparkling\
    \ and special. These final projects are exercises in letting go of failures and\
    \ embracing the imperfect nature of print.\n\n    ![Image](images/f0128-01.jpg)\n\
    \n    ### Project:  \n\n    FRANKENSTEIN'S MONSTER\n\n    Much like the monster\
    \ in Mary Shelley’s *Frankenstein*, this project focuses on repurposing interesting\
    \ and useful parts of failed prints to create something new and wholly unexpected.\
    \ This is the perfect opportunity for experimentation and play: Because the prints\
    \ you’ll be using are unsuitable to edition, they are thus devoid of preciousness.\
    \ That means you have complete freedom from your original intentions and how things\
    \ are “supposed” to look. So use that freedom to really stretch your legs creatively;\
    \ for example, if you’re usually neat, orderly, and organized, try approaching\
    \ this project with wild expression. I recommend playing mad scientist in the\
    \ laboratory. Cut things up, move them around, crank up the music, and work by\
    \ instinct. When you land on an arrangement or pairing that makes you say to yourself,\
    \ *oh that’s interesting*, follow that stream wherever it takes you. Don’t be\
    \ surprised if you get swept up in a flood of new ideas.\n\n    Tools and Materials\n\
    \n    A small stack of failed prints\n\n    One sheet 8\" x 10\" (20.5 x 25.5\
    \ cm) heavyweight tagboard paper\n\n    Repositionable adhesive\n\n    Glue brush\n\
    \n    Scissors or craft knife\n\n    Optional: needle and thread or sewing machine\n\
    \n    Optional: tracing paper\n\n    Optional: paint kit\n\n    Optional: lightning\
    \ storm\n\n    ![Image](images/f0130-01.jpg)![Image](images/f0131-01.jpg)\n\n\
    \    1 Because this is a collage that involves layering papers, the background\
    \ is the first consideration. I used a misprint from Texture Quilt (shown [here](#ch03.xhtml#page_50))."

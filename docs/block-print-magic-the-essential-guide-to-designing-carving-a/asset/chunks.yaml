    ## Rainbow Roll Process


    ### 3 Select a brayer that is as wide as or wider than the block

    Place a small dollop each of two different colors of ink next to each other on
    the inking plate. (Both inks pictured here were created by blending various quantities
    of phthalo blue, black, and opaque white.)


    ![Image](images/f0117-04.jpg)![Image](images/f0117-05.jpg)


    ### 4 Use the brayer to pull the ink down

    Create the smooth color transition by moving the brayer marginally to one side
    and then the other with each pull.


    ![Image](images/f0118-01.jpg)


    ### 5 Once you’ve achieved a smooth gradation

    Roll the brayer carefully across the block. Make a few passes if necessary, but
    make sure to pull the brayer in the same direction each time.


    ![Image](images/f0118-02.jpg)


    ### 6 You can make a simple printing jig to ensure that your block will always
    land roughly in the same place for each print

    Using a large sheet of paper, lay flat a sheet of your prepared 7" x 9" (18 x
    23 cm) printing paper. Carefully trace around the perimeter of the printing paper
    with a sharp pencil. Remove the printing paper and place the block where you’d
    like the print to land. Trace the block with a sharp pencil.


    ![Image](images/f0118-03.jpg)


    ### 7 Carefully lay a sheet of printing paper on the inked block

    Using the traced rectangle as a guide. Using the baren, lightly apply even pressure
    on the back of the paper. Take care not to use too much pressure if using a softer
    rubber block, or you might cause fine details to bleed out.


    **VARIATION:** You can also play with using a rainbow roll as ground for your
    print. Simply roll the ink directly onto the printing paper. Allow the paper to
    dry, and then print your block on top of that.


    ![Image](images/f0118-04.jpg)


    ### 8 Carefully peel the paper from the block

    Congratulations! You’ve achieved a rainbow roll!


    ## ARTIST SPOTLIGHT: JEN HEWETT


    California native Jen Hewett has built a career on print from her San Francisco
    studio—she’s a prolific printmaker, surface designer, textile artist, teacher,
    and author. Hewett’s bright, bold prints evoke the landscape around her. In her
    book, *Print Pattern Sew: Block-Printing Basics + Simple Sewing Projects for an
    Inspired Wardrobe*, Hewett generously shares her extensive knowledge and takes
    readers on colorful walk through the world textile printing.


    ![Image](images/f0119-01.jpg)![Image](images/f0119-02.jpg)![Image](images/f0119-03.jpg)![Image](images/f0120-01.jpg)![Image](images/f0120-02.jpg)


    #### EH: How would you describe your work and/or process?

    **JH:** I create visually layered, highly tactile printed work on fabric. Most
    of my work is inspired by both the natural and manmade California landscapes,
    and my color palette tends towards the saturated.


    #### EH: How did you first become interested in printmaking?

    **JH:** I was working an uncreative, corporate job, and was looking for a creative
    outlet. I decided to sign up for a screenprinting class at a local community center
    on a whim, and I was quickly hooked. Prior to my corporate job I’d had a stationery
    business, but I had sent the stationery designs off to a printer. With screen
    printing, I was able to control both the design and the production.


    #### EH: What do you like about relief printing in particular?

    **JH:** I began my printmaking life in silkscreen, which requires having access
    to special equipment, and spending a lot of time waiting for screens to dry. Relief
    printing is much more accessible; I only need carving tools and a block. Plus
    my hands are always busy—drawing, carving, printing. It’s incredibly satisfying
    to have that uninterrupted connection to what I’m creating.


    #### EH: What drew you to printing on fabric?

    **JH:** I started working on paper, but found that the biggest pain point in sales
    was that customers saw prints as too much work: they’d have to frame them and
    figure out where to hang them. I decided to experiment with printing on linen
    and sewing the printed fabric into bags. Those first bags sold incredibly well
    so I kept developing new textile work and eventually stopped printing on paper.
    At the same time, I had begun to sew my own clothing and had a hard time finding
    printed garment fabric that I liked. It seemed natural to combine my two passions—sewing
    and printmaking.


    #### EH: How do you stay creative on a day-to-day basis?

    **JH:** I’ve been doing self-imposed creative challenges since 2014, when I did
    my 52 Weeks of Printmaking project. That year I created a new print every week.
    The next year I moved on to printing yardage and sewing it into a new garment
    every month. The past two years, I’ve had a Tea Towel of the Month Club. I design,
    screenprint, and sell a new tea towel every month, and probably spend more time
    on that than I need to! I also have some client work that requires me to be constantly
    creating. And I’ve finally started carving out some time to work on personal projects
    again.


    ![Image](images/f0121-01.jpg)


    #### EH: Describe the space in which you make your art.

    **JH:** I have two studios in my home! One has designated areas for drawing and
    computer work, sewing, and relief printing. The other studio is my tiny service
    porch, which I use for my screenprinting room. I do go to a shared studio a few
    times per month to burn my screens, and to print large-format prints, since I
    don’t have room in my house for an exposure unit or flat drying racks.


    #### EH: What is your favorite thing that you’ve ever made?

    **JH:** I recently designed my first line of fabric with the company Cotton and
    Steel. My Cotton and Steel fabric is commercially printed, but my process involved
    scanning my hand-printed work and manipulating it digitally. I don’t sell hand-printed
    yardage because it’s so labor intensive, and I’d long wanted to create a fabric
    line that would be widely available, so this collection is a dream come true.


    ![Image](images/f0121-02.jpg)


    #### EH: What’s one piece of advice you’d give to someone new to printmaking?

    **JH:** Print a lot and print regularly! Printmaking is a physical activity, and
    you do develop muscle memory. I call this “thinking with your hands.” Your hands
    tell you what direction to carve, how much pressure to apply when you print, etc.
    But you can’t get to this point unless you are dedicated to the craft.


    ![Image](images/f0121-03.jpg)


    #### EH: What music/books/podcasts (if any) do you like to listen to while you
    work?

    **JH:** I listen to a lot of audiobooks, preferably crime fiction. And, lately
    I’ve been really into Philip Glass’s music. Much of his work almost forces its
    technical complexity on the listener, and it’s good company when I have to work
    in long stretches on more complex (usually screenprinting) work. Nineties R&B
    and neo-soul can make printing and drawing feel like a party.


    **Visit Jen at [jenhewett.com](http://www.jenhewett.com)**


    ## PROJECT: WALL HANGING


    This project is sort of the big-sister version of Dress Up (shown [here](#ch03.xhtml#page_82)),
    in that it involves a little bit of mixed media and collage, but this time instead
    of working on paper we’ll be working on fabric. I’ll take you on a “tour” of how
    I made this piece, highlighting techniques that you can use to make your own unique
    wall hanging.


    **Note:** The intricacies of machine sewing are legion, and thus too much to cover
    in this little printmaking book. Some resources for sewing are located in Resources,
    page 150. Alternatively, many craft and fabric stores today carry premade, blank
    canvas banners for crafting that can be used instead of sewing your own.


    ### Textile Tools and Materials

    - 1/2 yd (45.5 cm) 100% cotton duck

    - 14" (35.5 cm) wooden dowel

    - Jute twine

    - Embroidery floss

    - Embroidery hoop

    - Needle

    - Fabric scissors

    - Liquid fray stopper

    - Permanent fabric adhesive

    - Sewing machine

    - Iron

    - Ironing board


- raw: "    There are two kinds of oil-based inks: those that require solvents for\
    \ cleanup and those that are water soluble/washable. Both yield equally velvety\
    \ finishes and hold strong, vivid color. Solvents such as turpentine and kerosene\
    \ are the most efficient cleaners of oil-based inks, but are quite toxic. A safer\
    \ cleanser is plain old vegetable oil. Simply saturate a paper towel and wipe.\
    \ This tends to leave a residue on the block, so I usually follow up with a disinfectant\
    \ wipe. My favorite ink of this variety is Gamblin Relief Ink.\n\n    Water-soluble\
    \ oil-based inks are made with vegetable oil. Wonderfully nontoxic, these inks\
    \ are vibrant and have a tack that makes for uniform coverage. They’re easy to\
    \ clean up with soap and water or disinfectant wipes. Caligo Safe Wash Relief\
    \ Inks are a great choice, and were used for the majority of the projects in this\
    \ book.\n\n    ##### INK MODIFIERS\n\n    There are many different kinds of additives\
    \ that you can mix into your ink to achieve different results. Adding a drop of\
    \ cobalt **drier** to ink will significantly speed up the drying time of your\
    \ prints. Cobalt drier is quite toxic, however, so handle it with gloves. Adding\
    \ **extenders** or **transparent base** will dilute the color of the ink without\
    \ changing its viscosity—think of it as turning down an ink’s opacity.\n\n   \
    \ Adding **retarder** will slow down the drying time of the ink, which is nice\
    \ if you like to work slowly or you’re pulling a large number of prints. However,\
    \ keep in mind you’ll need to keep your prints in the drying rack a little longer,\
    \ too.\n\n    #### Papers\n\n    Although, technically, you can print onto nearly\
    \ any flat surface, the cheapest, easiest, and most widely available surface is\
    \ paper. There’s something so tactile and rich and just plain *pleasant* about\
    \ rubbing a decadently thick sheet of gorgeous paper between your fingers. Lucky\
    \ for me (and you too) there are many different kinds of paper on the market today.\
    \ The most common ingredients in artists’ papers are wood pulp, cotton rag, pulped\
    \ linen, and mulberry/kozo—all are great choices for printing linoleum blocks\
    \ by hand. It’s fine to use any old paper when you’re learning in your own home\
    \ for fun, but you’ll find that the higher quality paper you choose, the better\

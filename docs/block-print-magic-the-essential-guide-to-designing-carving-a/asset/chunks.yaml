- raw: "    4 With the brayer, roll ink onto the block. Keep the roller parallel with\
    \ the block as you apply the ink. Pull the brayer across the block in multiple\
    \ directions, ensuring an even coating of ink. Take care to hit the edges of the\
    \ block, which are easy to miss. Hold the block up to the light, tilting it and\
    \ inspecting it to see that each area of the block is wet. Be careful not to swing\
    \ too far in the other direction and overink the block, which would cause ink\
    \ to bleed into the finer details.\n\n    5 If any ink has hit areas of negative\
    \ space on your block, or anywhere else you didn’t want your ink to go, you can\
    \ wipe the area with a paper towel to avoid noise in your print.\n\n    ![Image](images/f0041-01.jpg)\n\
    \n    6 Apply paper on top of the block, taking care to lay it down once and not\
    \ move it again.\n\n    ![Image](images/f0041-02.jpg)\n\n    7 Lightly hold the\
    \ paper in place with one hand, and with the other, tightly grip your baren and\
    \ press down on the block, moving in small circles with firm pressure.\n\n   \
    \ ![Image](images/f0041-03.jpg)\n\n    8 Gently peel the paper off the block and\
    \ place on your drying rack or on a flat surface.\n\n    #### Ink Application\n\
    \n    The application of ink can be a fickle process with many variables, starting\
    \ with your brayer. I have artist friends who use exclusively hard rubber and\
    \ some (like me!) who swear by soft rubber. The benefit of hard rubber is that\
    \ it’s great for applying thin layers of ink to delicate, detailed areas of the\
    \ block, but I find that it’s tough to get an even coating. The benefit of soft\
    \ rubber is that the ink is applied evenly without much effort, but sometimes\
    \ these brayers can deposit too much ink into shallow channels, causing details\
    \ to bleed out upon printing.\n\n    ##### DIRECTION OF APPLICATION\n\n    As\
    \ you pull the brayer across the block, move in multiple directions—up and down\
    \ as well as left to right—to ensure that each area of the block receives ink.\
    \ If your brayer is not quite wide enough to stretch across the whole block, stagger\
    \ your passes so the ink layers evenly. Beware of any large areas of negative\
    \ space, as the brayer may hit it and deposit ink accidentally, causing noise\
    \ or accidental marks in the final print. It’s up to the artist to decide what\
    \ is or is not an acceptable amount of noise.\n\n    ##### PRESSURE OF APPLICATION\n\
    \n    The pressure used when rolling the brayer across the block depends on a\
    \ couple factors: consistency of the brayer and consistency of the block. If your\
    \ brayer is soft, you’ll barely need to assist gravity because pushing too hard\
    \ will cause the soft rubber of the brayer to push into the channels you’ve carved,\
    \ depositing ink where you don’t want it. You may need to lean into the brayer\
    \ slightly if it’s hard rubber, as it needs a bit more pressure to evenly deposit\
    \ ink.\n\n    If printing with a soft rubber block instead of dense linoleum,\
    \ a much lighter touch is required. Push too hard and the block will squish, allowing\
    \ ink into shallow channels, causing detail loss in the final print.\n\n    ![Image](images/f0042-01.jpg)\n\
    \n    Using too much ink can also cause the ink to squish up over the edge of\
    \ your brayer. This can can cause unsightly lines and globs of ink to appear in\
    \ the final print. Always make sure that your brayer is properly cleaned after\
    \ each printing session to avoid dried ink buildups.\n\n    ![Image](images/f0042-02.jpg)\n\
    \n    #### Goldilocks and the Three Prints\n\n    ![Image](images/f0043-01.jpg)\n\
    \n    Underinked: Not enough ink transferred from inking plate to brayer to block.\
    \ I either didn’t have enough ink on the brayer or I didn’t make enough passes\
    \ over the block with the brayer. “Ghosts” or tiny hiccups in the ink, as well\
    \ as other imperfections, are painfully visible.\n\n    ![Image](images/f0043-02.jpg)\n\
    \n    Overinked: My brayer was overloaded, so I lost details in the fur.\n\n \
    \   ![Image](images/f0043-03.jpg)\n\n    Just Right: The print boasts a velvety\
    \ finish and a clean background. All details in the fur are visible and ink is\
    \ consistent across the image.\n\n    ![Image](images/f0043-04.jpg)\n\n    ####\
    \ Registration\n\n    Registration is a system used by printmakers to ensure that\
    \ the block and paper are both in the same position for each print. This is most\
    \ important when you are printing with multiple colors layered on top of one another—being\
    \ off by even a millimeter can have disastrous effects on a detailed composition.\n\
    \n    Additionally, the straighter the block is on the paper, the more professional\
    \ the print’s appearance will be. A crooked print can be saved by some clever\
    \ framing, but it’s best to avoid such trouble if you can.\n\n    On the following\
    \ pages are three different types of registration devices, or printing jigs. Each\
    \ of these is used at least once for the projects in this book, but will also\
    \ help you keep printing straight long after you’ve closed these pages.\n\n  \
    \  ![Image](images/f0043-05.jpg)\n\n    Registered\n\n    ![Image](images/f0043-06.jpg)\n\
    \n    Unregistered\n\n    ### PROJECT:  \n\n    BOX GRID\n\n    This is the simplest\
    \ type of registration device, and the one I use most often. It works best with\
    \ unmounted blocks or printing surfaces with a lower profile. I made an easy device\
    \ from a scrap piece of hard composite wood.\n\n    ##### TOOLS AND MATERIALS\n\
    \n    Scrap piece of 11\" x 14\" (28 x 35.5 cm) board\n\n    Ruler\n\n    Permanent\

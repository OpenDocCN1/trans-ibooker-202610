    # CHAPTER 4


    ## TARGETED TECHNIQUES


    Exploration and experimentation are essential to artistic growth and are reliable
    routes to discovering your own voice. The following projects will help you stretch
    your creative muscles: using uncommon methods to alter paper, making a multi-color
    print with a single pull, and crossing disciplines with fiber arts to name a few.
    In this chapter, three contemporary printmakers will show us a wide variety of
    techniques from sweeping landscapes to divine color gradients to possibilities
    of print on textiles.


    ![Image](images/f0094-01.jpg)


    ### PROJECT: PUZZLE BLOCK PRINT


    One simple and efficient way to make a multi-color print in a single pull is by
    utilizing the puzzle-block method: individual blocks, inked separately, but then
    assembled and printed as one. You can start with a simple design, like this one,
    or make one as complicated as you wish with as many pieces and colors as you dare!
    For projects such as this, I like to use the softer rubber blocks rather than
    the more firm linoleum, because the rubber cuts smoothly with very little effort,
    making intricate or small pieces easier to cut out.


    #### Tools and Materials


    Scrap pieces of Speedy-Cut carving blocks


    7" x 9" (18 x 23 cm) printing papers


    Pencil


    Tracing paper


    Carving tools


    Washi/masking tape


    Inking plate


    Three different ink colors


    Palette knife(s)


    Brayer(s)


    Baren


    ![Image](images/f0096-01.jpg)


    1 Design your print, using two or more colors. Transfer your design to scrap pieces
    of Speedball Speedy Cut (I used the tracing paper transfer method).


    ![Image](images/f0097-01.jpg)


    2 Carve out your design, carefully cutting elements apart with a sharp craft knife.
    Use a self-healing mat to protect your work surface.


    ![Image](images/f0097-02.jpg)


    3 Make a simple printing jig: With a sharp pencil trace a sheet of 7" x 9" (18
    x 23 cm) printing paper on a larger sheet of paper. Arrange the blocks within
    this border and trace around the blocks.


    ![Image](images/f0097-03.jpg)![Image](images/f0097-04.jpg)


    4 Select and mix the colors for each block. (I used Caligo SafeWash Relief inks
    in naphthol red, raw umber, burnt sienna, and black, and Schmincke Aqua Linoprint
    ink in gold.) Spread and roll out the inks, and apply ink to the blocks using
    small brayers.


    ![Image](images/f0098-01.jpg)


    5 Arrange blocks in the printing jig.


    ![Image](images/f0098-02.jpg)


    6 Lay a printing paper down on the blocks, pressing very lightly with a padded
    baren. Speedy Cut is a very soft and malleable material and is prone to bleeding
    if too much pressure is used during printing.


    ![Image](images/f0098-03.jpg)


    7 Carefully peel the paper away from the blocks. Set it aside to dry.


    ### PROJECT: UNCOMMON GROUND


    “G round” refers to the background surface on which a print impression is made.
    The most common ground is plain paper, as received from the manufacturer. Sometimes
    preparing the ground beforehand can yield interesting results, however, changing
    the entire mood of the final print.


    Playing around with ground is a fun and easy way to experiment, especially when
    you feel stuck and stale in your practice. But don’t stop with the suggestions
    here: challenge yourself to think of additional ways to manipulate the surface
    of your paper and push the boundaries of your creativity. This project focuses
    on the printing ground, so the design and execution of the block is up to you.
    You know the drill.



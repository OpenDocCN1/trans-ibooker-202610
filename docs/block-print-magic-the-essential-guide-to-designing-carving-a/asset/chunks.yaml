- raw: "    This method requires the use of Ternes-Burton registration pins and stripping\
    \ tabs, which are readily available directly from the company’s website or through\
    \ most well-stocked online art supply retailers. They’re cheap and wildly effective—I\
    \ would consider this the most precise registration technique of the three. Stripping\
    \ tabs are attached to the paper and the pins are attached to the jig. The tabs\
    \ fit into the pins, holding the paper firmly in place.\n\n    ##### TOOLS AND\
    \ MATERIALS\n\n    Scrap piece of board\n\n    One thin, narrow strip of wood\
    \ or cardboard\n\n    Tape\n\n    Glue\n\n    Ruler\n\n    Pencil\n\n    Pins\
    \ and tabs\n\n    #### MAKE IT!\n\n    1 Take a scrap piece of board (it helps\
    \ if it’s squared, with straight edges and 90-degree angles) and glue the thin\
    \ strip to it, along the top. Allow it to fully bond. The bottom of edge of this\
    \ strip will act as a bumper to align the top edge of your printing paper.\n\n\
    \    ![Image](images/f0046-01.jpg)\n\n    2 Place the registration pins on the\
    \ strip, lining them up with the bottom edge of the strip. Tape them firmly in\
    \ place. (I use tape for this device so that I can move elements around when I’m\
    \ working on differently sized blocks.)\n\n    ![Image](images/f0046-02.jpg)\n\
    \n    3 The pins hold the paper in place but we need something to hold the block\
    \ in place, too. Place two strips of mat/card/chip board together like an L to\
    \ form a 90-degree angle. Decide where you want to place your block and firmly\
    \ tape the L to the board at your block’s lower left-hand corner. A more detailed\
    \ look at using this device can be found in the Reduction Cut Sunflower project,\
    \ shown [here](#ch03.xhtml#page_64).\n\n    #### Cleaning Up After Printing\n\n\
    \    Proper cleanup preserves the life of your tools, the integrity of your prints,\
    \ and will help you keep your sanity in the studio. Follow this cleanup process\
    \ after every print run. (Instructions intended for the oil-based, washable inks\
    \ used throughout this book.)\n\n    Hang all wet prints on the drying rack.\n\
    \n    **Clean the brayer:** Remove excess ink by rolling the brayer on an old\
    \ phone book or magazine. Discard and repeat until nothing comes off on the paper.\
    \ Wash in the sink with soap and water.\n\n    **Clean the inking plate:** Scrape\
    \ away excess ink with an ink scraper, palette knife, or mat board strip. If the\
    \ ink is uncorrupted (meaning nothing else has been mixed into it), excess can\
    \ be placed back in its original container. If the ink is corrupted or you can’t\
    \ get it back into the container (for example, if it came from a tube), discard.\
    \ Once ink is scraped up, the quickest and most efficient way to wipe down the\
    \ plate is with a disinfectant wipe. Alternatively, you can use vegetable oil\
    \ and paper towels.\n\n    **Wipe excess ink** from palette knives and clean thoroughly\
    \ with vegetable oil and a paper towel or a disinfectant wipe.\n\n    **Clean\
    \ the block:** Blot away excess ink by pressing the block with newsprint or scrap\
    \ paper. Wipe with vegetable oil or a disinfectant wipe. Though the inks used\
    \ throughout the book clean up with soap and water, I try to always keep my blocks\
    \ dry. If the hessian backing of unmounted linoleum gets too wet, it can cause\
    \ the linoleum to curl.\n\n    **Replace all caps and lids tightly**, and store\
    \ any inks in clear containers away from light.\n\n    **Wash your hands thoroughly**\
    \ with pumice soap such as Permatex Fast Orange (soaps like this are easily found\
    \ at hardware or automotive stores. Also it lasts forever—I’ve been using the\
    \ same 64 oz container for over two years). Scrub under your fingernails with\
    \ a brush.\n\n    #### Editions\n\n    An edition is a set of identical prints.\
    \ Each print of the edition is considered an original, and is numbered, signed,\
    \ and dated by the artist along the bottom of the print. The majority of artists\
    \ choose to sign in pencil. The artist’s signature is traditionally located in\
    \ the lower right-hand corner and the title of the print is in the center. In\
    \ the lower left-hand corner you’ll find the edition number:\n\n    ##### NUMBERING\n\
    \n    If you make an edition of 20, you will number each print as 1/20, 2/20,\
    \ 3/20, and so on. Though each print should be as close to identical as possible,\
    \ generally the cleanest/best prints in the edition will be numbered lower. So\
    \ the first print in an edition of 100 (1/100) will be better quality/more valuable\
    \ than 96/100.\n\n    There are other ways to identify a print. Sometimes at the\
    \ bottom of a print you’ll see A/P or AP, which stands for Artist Proof. The first\
    \ few pulls of a block are known as the test prints or proofs, and are not considered\
    \ a part of the edition. This is the time to test out how much ink you need to\
    \ apply, adjust the pressure of your baren or press, and make any final cuts into\
    \ the block.\n\n    ## CHAPTER 3\n\n    ## THE BASICS\n\n    The projects in this\
    \ chapter will take you on a tour of foundational concepts of the relief printing\
    \ process. Here you’ll learn how to:\n\n    ![Images](images/bulla.jpg)  Achieve\
    \ a variety of textures through the manipulation of your tools;\n\n    ![Images](images/bulla.jpg)  Make\
    \ a three-color print with three separate blocks;\n\n    ![Images](images/bulla.jpg)  Make\

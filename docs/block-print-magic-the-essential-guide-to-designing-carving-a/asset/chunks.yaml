  fmt: '

    What started as something practical really turned into something that I truly
    loved. I think part of my deep love for relief printing comes from the meditative
    process of carving the block, and of course printing it in peaceful repetition.
    I also appreciate the fact that anyone can try it at home; it’s a great art form
    because it’s accessible to all ages, styles, budgets, and spaces.


    ### EH: How would you describe your work process?

    LA: My process is simple, low tech, yet still so satisfying. Working without a
    press, without multiple layers, and without a real studio has pushed me to figure
    out alternative ways of being efficient and productive. Through these challenges
    I was able to create methods that really worked for my subject matter and lifestyle.


    ![Image](images/f0113-01.jpg)![Image](images/f0113-02.jpg)


    ### EH: What are your main sources of artistic inspiration?

    LA: I am constantly inspired by nature. Whether it’s the cacti growing in my backyard,
    or extremely intricate sea creatures at the aquarium, or the colors of a forest
    after a light rain. I am always humbled and awestruck by the natural world around
    me. I also love looking through books of scientific illustration, folk art, and
    poster art. Something about the tangible pages of a book connects me to what I’m
    looking at much more than a screen. That said, I do however love Pinterest for
    organizing ideas and themes, and finding more specific sources of inspiration
    for a particular project.


    ### EH: What other art forms do you dabble in?

    LA: I dabble in a little bit of textile design (both handmade with hand-carved
    blocks and hand-drawn illustration), watercolor, typography and lettering, and
    music. I love almost any art form that’s hands on; there’s just not enough time
    in the day!


    ![Image](images/f0114-01.jpg)


    ### EH: How do you stay creative on a day-to-day basis?

    LA: To stay creative and productive requires organization, planning, and lots
    of daydreaming; but there are a few things that really help me stay on top of
    things. First, having a sketchbook allows me to keep all my ideas in one place,
    so I always have a project ready to go. Second, making to-do lists has been a
    total game-changer for my productivity and confidence.

    Running my business can get a bit overwhelming at times, but my to-do lists keep
    me on track and ease my mind, which allows for creativity to continue to thrive
    among the stress that might otherwise be debilitating. Also, it feels so good
    to cross out items on a to-do list! Oh the little pleasures. If I’m ever feeling
    really creatively stumped, I will usually try to immerse myself in the outdoors
    if I have the time. Whether it’s a hike, a trip to the local arboretum, or just
    a walk along the beach, getting away from my laptop, or the tall pile of paper
    I need to tear, or the blank page impatiently waiting for my pencil, or the noisy
    frat boys that live next door really helps me clear my mind. I usually find that
    the creative block just dissipates and new ideas start flowing back in.


    ![Image](images/f0114-02.jpg)


    ### EH: Describe the space in which you make your art.

    LA: My art studio is my bedroom and sometimes my living room. Surprisingly I am
    able to be quite productive in these small spaces! I think because I don’t have
    a press, it makes for a more contained environment that doesn’t take up too much
    room. It’s nice to work at home because I can get started on a project at any
    point, while balancing freelance design work, making meals, and spending time
    with my husband. Though working at home can cause some clutter (especially when
    I’m working on a large edition—prints on the bed, floor, clothesline), I try to
    clean up and put everything away after every printing session to keep the house
    feeling peaceful and put together. My equipment is very basic: Speedball linocut
    tools, Soft-Kut rubber blocks, Speedball water-based inks, rollers, barens, and
    Stonehenge papers.


    ### EH: Do you have any helpful tricks or “hacks” that you’ve picked up along
    the way?

    LA: One of my most useful tricks with my botanical prints is using the “puzzle
    method” in which I cut out the pieces that need to be inked up in a different
    color, then reassemble the composition when everything’s inked and I’m ready to
    pull the print. I first figured out this method because I wanted to work in multiple
    colors, but didn’t have the knowledge or ability to work with multiple blocks
    and layers. It can be limiting at times, but for the most part it works well for
    my subject matter.

    Another crucial aspect of making my prints work is adding Speedball ink retarder
    to my inks, especially when working on larger pieces. Because I use water-based
    inks, they tend to dry out pretty fast and make it hard to print a large edition
    at once; however, the ink retarder prolongs the life of the ink and allows me
    to keep working for hours without having to worry about the longevity of the ink.


    ### EH: What is your favorite piece that you’ve ever made?

    LA: My most proud project yet was a block-printed poster I made for my favorite
    musician of all time, Gillian Welch. I have been so inspired by her music for
    many years, so having an opportunity to collaborate was truly special. I really
    connect with the visual narratives that her music evokes, so of course I enjoyed
    every minute of sketching, planning, carving, and printing the piece.


    ### EH: What’s the best advice you’ve ever been given as an artist?

    LA: I think some of the most helpful advice I’ve been given as an artist is don’t
    try to be like anyone else. Though I’ve gotten so much inspiration from other
    artists over the years, I’ve always been encouraged to find my own artistic path.
    Staying true to yourself and embracing your own genuine ideas provides the most
    creative satisfaction, plus it’s what makes you stand out from the crowd.


    ### EH: What music/books/podcasts (if any) do you like to listen to while you
    work?

    LA: I’m always listening to music when I work. I have some go-tos like Gillian
    Welch, Hiss Golden Messenger, The Wood Brothers, Mandolin Orange, and The Milk
    Carton Kids. Some days I crave more upbeat vibes, so I’ll throw on something like
    Stevie Wonder, Leon Bridges, Bahamas, Vulfpeck, or Emily King. Also, my husband
    is a musician so he’s often recording at home which keeps me entertained.


    **Visit Lili at [www.liliarnold.com](http://www.liliarnold.com)**


    ![Image](images/f0115-01.jpg)


    ### PROJECT:

    #### RAINBOW ROLL

    The rainbow roll is one of the great joys of the printing process—a simple, satisfying,
    and lovely way to play with color in your prints. In fact, I challenge you to
    pull a rainbow roll and not smile—it simply cannot be done! In this project, you’ll
    practice blending two inks together to create a smooth gradation, or transition,
    between two colors.


    **REMEMBER:** Soft-Kut lives up to its name and requires nearly zero power behind
    a carving tool, so work slowly and deliberately, and mind your cuts. You may also
    want to trim away excess negative space to minimize noise.


    #### Tools and Materials

    3" x 6" (7.5 x 15 cm) rubber block

    7" x 9" (18 x 23 cm) printing papers

    Pencil

    Ruler

    Fine-tip permanent marker

    Tracing paper

    Carving tools

    Washi/masking tape

    Inking plate

    Ink (two different colors)

    Palette knife

    Brayer

    Baren


    ![Image](images/f0116-01.jpg)![Image](images/f0117-01.jpg)


    1 Decide on the design you’ll be using for this project.


    ![Image](images/f0117-02.jpg)


    2 Transfer your design onto your carving material, lock in lines with a fine-tip
    permanent marker, and carve out the negative space. Though I used Speedball Soft-Kut
    for this project, you can easily swap in mounted or unmounted linoleum according
    to your preferences.


    ![Image](images/f0117-03.jpg)


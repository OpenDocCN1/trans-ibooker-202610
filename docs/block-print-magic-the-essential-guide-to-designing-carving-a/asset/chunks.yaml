    # PROJECT: MULTI-BLOCK HEX SIGN


    Hex signs—also referred to as barn stars, but not to be confused with barn quilts—are
    a ubiquitous part of the rural Pennsylvania landscape, adorning the facades and
    gables of barns. These striking, perfectly balanced circular designs are part
    of a folk art tradition brought to the United States by the Pennsylvania Dutch,
    a group of German immigrants in the early 1700s. Employing either rotational symmetry
    or parallel (reflective) symmetry, contemporary hex signs often incorporate symbolic
    motifs: stars and rosettes for good luck, tulips for faith, wheat sheaves and
    rain drops for abundance, oak leaves for strength of character, and more.


    ## Tools and Materials


    Three pieces of 6" x 6" (15 x 15 cm) unmounted linoleum

    Three pieces of 7 1/2" x 9 1/2" (19 x 24 cm) firm chipboard, or mat board

    Wood glue

    Hinged registration device

    Pencil

    Ruler

    Permanent markers in various colors

    At least two pieces of tracing paper

    Drawing paper

    Compass

    Carving tools

    Three color inks

    Inking plate

    Palette knife

    Brayer(s)

    9" x 12" (23 x 30.5 cm) printing paper

    Baren

    Masking/washi tape


    ![Image](images/f0056-01.jpg)


    For my hex sign, I used an eight-pointed rosette as the main element, adding in
    raindrops, a scalloped border, and watchful eyes. You can design your own, using
    symbols and colors that are meaningful or pleasing to you.


    For this project, we will be using the **multi-block technique**, where the impressions
    from three separate blocks, each inked with a different color, will create a three-color
    print. Remember that you are welcome to experiment as you please with colors of
    your own choosing. Printing with multiple blocks can be a little bit tricky if
    it’s your first time, but be patient with yourself and diligent with your measurements,
    and together we can pull something clean! When it comes to multi-block printing,
    planning is everything, starting with the design.


    ![Image](images/f0057-01.jpg)


    1 First let’s get a bit of prep work out of the way: each piece of unmounted lino
    must be adhered to a piece of 7 1/2" x 9 1/2" (19 x 24 cm) board in order to work
    properly in the hinged registration device. I used chipboard, but you can use
    mat board or dense cardboard as well. Using a ruler, center your block on the
    chipboard (the more exact the measurements, the better), and glue it in place
    with wood glue. Place it under a heavy stack of books to ensure a full bond. Repeat
    with the remaining two blocks. Add a tab with masking tape at the bottom of each
    board to make it easier to remove from the device.


    ![Image](images/f0057-02.jpg)


    2 While you wait for your blocks to bond, plan your design. I usually begin with
    a simple line sketch, followed by a full-color sketch. Then I visually separate
    the colors so I can see how my blocks are supposed to look.


    ![Image](images/f0057-03.jpg)


    3 Now that you have your plan, make a clean, full-size line rendering of your
    design on drawing paper (we’ll call this the master drawing). I suggest using
    a ruler and a compass in order to make drafting a perfect circle easier. Be sure
    this design will fit on your 6" x 6" (15 x 15 cm) blocks.


    ![Image](images/f0058-01.jpg)


    4 According to the plan, the blue block has the most visual information, so this
    block will be the key block, which will serve as a guideline for the other colors.
    Lay a sheet of tracing paper on your drawing, taping it in place if desired. Carefully
    trace only the blue parts of the design. Mark the top of the design so you know
    which way is up—when transferring rotational designs, things can get confusing!


    5 Grab one of the mounted blocks. Place a mark on the board to signify the top.
    Transfer your traced image onto the block (see Transfer Methods shown [here](#ch02.xhtml#page_32)).
    Lock the drawing in place with a permanent marker (you don’t have to color in
    with the marker, you can just draw in the lines).


    ![Image](images/f0058-02.jpg)


    6 Carve out the negative space.


    ![Image](images/f0058-03.jpg)


    7 Now we will use the carved key block to transfer the design onto the remaining
    blocks. Grab the hinged registration device. Firmly tape a clean sheet of tracing
    paper to the window.


    8 Open the window of the registration device and set the key block into the jig,
    ensuring that it fits snugly in place and does not move.


    ![Image](images/f0059-01.jpg)


- raw: "    DR: I have an amazing basement studio in my home, and I am super proud\
    \ of it. It’s fully stocked with everything I need to produce woodcuts, linoleum\
    \ cuts, and silk screens. I have a motorized etching press as well as a letterpress\
    \ proofing press that I print my relief prints on, a full size drying rack, a\
    \ guillotine style paper cutter capable of cutting over 200 sheets of paper at\
    \ a time, a vacuum table, a silk screen exposing unit, and t-shirt press for silkscreen.\
    \ I literally don’t have to leave the house to make my art.\n\n    ###### EH:\
    \ Name one thing you hate about printmaking and one thing you love about it.\n\
    \n    DR: There are five emotional stages to making a relief print.\n\n    1\\\
    . The excitement of starting a fresh block\n\n    2\\. The agony of being so close\
    \ but yet so far from finishing carving the block\n\n    3\\. The anticipation\
    \ of pulling the first print\n\n    4\\. The depression of seeing everything backward\
    \ for the first time\n\n    5\\. Acceptance and moving on\n\n    ###### EH: Do\
    \ you have any helpful tricks or hacks'' that you've picked up along the way?\n\
    \n    DR: It’s very easy to overwork a relief print. Taking frequent breaks is\
    \ important, not only for health reasons, but also as a visual reset. Plan your\
    \ block completely, leaving nothing to “figure out later.” Rushing into a block\
    \ is the quickest route to making mistakes.\n\n    Even when working with a black\
    \ and white relief print, there are many grays that can be achieved through carving\
    \ patterns, hatches, and cross hatches. These hatches and cross hatches will give\
    \ the print depth. It’s important to give the print enough contrast to make the\
    \ grays stand out. I’ve found that a balanced print can have at least 20% solid\
    \ black, 20% solid white, and up to 60% grays. Without enough solid black and\
    \ white the grays wash out and turn flat.\n\n    ![Image](images/f0072-01.jpg)\n\
    \n    Tunacorn\n\n    ###### EH: What is your favorite piece that you've ever\
    \ made?\n\n    DR: For three years I worked on a series of woodcuts about Kentucky\
    \ monsters, myths, and legends. It’s a 14-piece series of interconnected prints\
    \ that can be completely rearranged and still line up edge to edge. All together\
    \ it measures 32 1/2 feet (9.9 m) long.\n\n    ![Image](images/f0073-01.jpg)\n\
    \n    ###### EH: What's one piece of advice you'd give to someone new to printmaking?\n\
    \n    DR: I’ll give them two. First of all, don’t get discouraged, you have 100\
    \ terrible prints in you. The quicker you get them out of the way, the sooner\
    \ you can make something special.\n\n    And the other one is practical: Keep\
    \ everything clean all the time. Trying to make clean prints in a dirty shop is\
    \ a nightmare. I always preclean all my palette knives, rollers, roll up slabs,\
    \ the press, and especially my hands before I print.\n\n    ![Image](images/f0073-02.jpg)\n\
    \n    Derrick Riley in his studio\n\n    ![Image](images/f0073-03.jpg)\n\n   \
    \ Jackalope\n\n    **Visit Derrick at [www.drockpress.com](http://www.drockpress.com)**\n\
    \n    His work can be seen at: Revelry Gallery (Louisville, Kentucky); Brickaloge\
    \ Art Collective (Paducah, Kentucky); City Gallery (Lexington, Kentucky); Gather\
    \ (Bloomington, Indiana); Conspire (Greencastle, Indiana)\n\n    ### PROJECT:\
    \  \n\n    CONTOUR LINE SKULL\n\n    Contour lines are lines that suggest the\
    \ form of an object. These lines can be used to show any planar changes within\
    \ the form.\n\n    In diagram 1, you can see how the simple addition of straight\
    \ lines and then curved lines transform a flat circular shape into a three-dimensional\
    \ spherical form.\n\n    Diagram 2 breaks down the contour lines of a sphere.\
    \ To see how contour lines suggest volume, start by quartering a circle, then\
    \ draw lines that bend by varying degrees the farther away from the center line\
    \ they are.\n\n    For a brilliant example, see these contour lines by the master\
    \ Albrecht Dürer in this self-portrait woodcut from 1527.\n\n    Tools and Materials\n\
    \n    8\" x 8\" (20.5 x 20.5 cm) unmounted linoleum\n\n    10\" x 10\" (25 x 25\
    \ cm) printing papers\n\n    Pencil\n\n    Fine-tip permanent marker\n\n    Tracing\
    \ paper\n\n    Carving tools\n\n    Washi/masking tape\n\n    Inking plate\n\n\
    \    Black ink\n\n    Palette knife\n\n    Brayer\n\n    Baren\n\n    ![Image](images/f0074-01.jpg)\n\
    \n    *Albrecht Dürer, aged 56*, German School, 1527\n\n    ![Image](images/f0074-02.jpg)\n\
    \n    Diagram 1\n\n    ![Image](images/f0074-03.jpg)\n\n    Diagram 2\n\n    ![Image](images/f0075-01.jpg)\n\
    \n    1 Using the transfer method of your choice, transfer your own design onto\
    \ the block.\n\n    2 Lock in the lines with a fine-point marker.\n\n    ![Image](images/f0075-02.jpg)\n\
    \n    3 Carefully carve out the negative space.\n\n    4 Carve out the floral\
    \ details.\n\n    ![Image](images/f0075-03.jpg)\n\n    a. Carve out a center line\
    \ on the leaf.\n\n    ![Image](images/f0075-04.jpg)\n\n    b. Carve an inner border\
    \ line on one side of the leaf.\n\n    ![Image](images/f0075-05.jpg)\n\n    c.\
    \ Beginning at the center line and sloping downward and to the left, carve vein\
    \ lines for the left side of the leaf, stopping just before the edge.\n\n    ![Image](images/f0075-06.jpg)\n\
    \n    d. Beginning at the inner border line and sloping upward toward the center\
    \ line, carve vein lines for the right side of the leaf.\n\n    ![Image](images/f0075-07.jpg)\n\
    \n    Here is the fully carved out floral background.\n\n    ![Image](images/f0076-01.jpg)![Image](images/f0076-02.jpg)\n\
    \n    5 Using the contour line guide, lightly draw contour lines across the skull\
    \ with a pencil. Begin carving out lines that follow the contours of the skull,\
    \ using a smaller gouge—I used my 1-mm V-parting tool.\n\n    ![Image](images/f0076-03.jpg)\n\
    \n    6 Continue until the skull is covered in thin contour lines.\n\n    ![Image](images/f0077-01.jpg)\n\
    \n    7 Take a second pass at carving, this time with a bigger tool. Here I used\
    \ my 4-mm no. 12 V-parting tool. Concentrate your marks on the apexes of curved\
    \ areas (the spots that stick out the most, like the forehead and cheekbones).\
    \ This will help lighten the value in these areas, making them appear to move\
    \ forward or appear closer to the viewer.\n\n    ![Image](images/f0077-02.jpg)\n\
    \n    8 Continue carving until you’ve achieved a range of values within your form\
    \ (dark blacks, medium grays, and light whites).\n\n    ![Image](images/f0077-03.jpg)\n\
    \n    9 Assemble your printing tools and roll out your ink.\n\n    ![Image](images/f0078-01.jpg)\n\
    \n    10 Make a simple printing jig by tracing the block as well as a piece of\
    \ the 10\" x 10\" (25 x 25 cm) printing paper on a larger piece of paper. This\
    \ will help the print fall roughly in the same spot for each print of the edition.\n\
    \n    ![Image](images/f0078-02.jpg)\n\n    11 After inking the block, apply paper\
    \ to the block and press firmly with a baren, burnishing areas with a firmer baren\
    \ such as a spoon, if necessary.\n\n    ![Image](images/f0078-03.jpg)\n\n    12\
    \ Carefully peel the paper back from the block.\n\n    ![Image](images/f0078-04.jpg)\n\
    \n    13 Set your print aside to dry.\n\n    ### ARTIST SPOTLIGHT:  \n\n    KELLI\

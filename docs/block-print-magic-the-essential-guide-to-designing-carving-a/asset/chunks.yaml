    #### Printing Tools and Materials

    - Ink

    - Baren

    - Inking plate

    - Palette knife

    - Brayer


    ![Image](images/f0122-01.jpg)


    #### Notes for Printing on Fabric

    To get an even print on fabric, you might find it helpful to first lay a towel
    on the printing surface, creating more cushion.

    The toothier, or rougher, the fabric, the less even your print will be.

    For the best results, use inks that are specifically formulated to be used on
    fabrics—consider their permanence and solubility. Speedball makes a great line
    of fabric block-printing inks, but my favorite to use are Gamblin relief inks—especially
    Gamblin Textile Ink. Both of these inks are oil based, and so can both be washed
    again and again without running or losing intensity.

    Always do a few test runs on paper before printing on fabric—this helps to prime
    the block, getting it fully loaded with ink.

    Heat setting: Check the product information on the ink to find out whether or
    not you need to heat set the ink to make it permanent.

    Allow the print on fabric to fully dry before manipulating it—otherwise you run
    the risk of smearing ink. To speed drying time, you can add cobalt drier to the
    ink before you print (using gloves!) and point a fan at the drying rack.


    ![Image](images/f0123-01.jpg)![Image](images/f0123-02.jpg)


    1 Iron flat a clean 1/2 yard (45.5 cm) piece of unbleached cotton canvas, and
    then cut it in half. One half will comprise the base for your wall hanging and
    the other half is for experimentation and printing additional elements. I kept
    the design of the central block simple to allow room for improvisation and printed
    it in the center of the canvas.


    ![Image](images/f0124-01.jpg)


    2 Whenever I can, I like to repurpose blocks from previous projects, so I printed
    several additional hands from the Puzzle Block Project (shown [here](#ch04.xhtml#page_96))
    onto my extra canvas and cut them out. To keep the edges of fabric sharp, clean,
    and unfrayed, before cutting into the fabric, “trace” around the perimeter of
    the image with a liquid fray stopper. Once dry, cut out the shapes just as you
    would if they were printed on paper. (Warning: Liquid fray stoppers can cause
    water-soluble inks to run, so always test first.)


    3 Joining a smaller piece of fabric to a larger one is called appliqué. Traditionally,
    applique is done by sewing the pieces together, but here I used a permanent fabric
    adhesive called Liquid Stitch.


    ![Image](images/f0124-02.jpg)


    4 After placing the hands, the bulk of my design was complete. Using a water-soluble
    marking pen, I drew a banner shape around my image and cut it out, allowing extra
    room on all sides for hemming.


    5 To hem the edge of a piece of fabric, simply fold the edge once, then again,
    and stitch through all layers.


    ![Image](images/f0125-01.jpg)


    6 Hem the top edge of the banner, stitching close to first fold to allow a narrow
    sleeve for the wooden dowel to slide through.


    ![Image](images/f0125-02.jpg)


    ### A QUICK EMBROIDERY PRIMER

    Embroidery is a beautiful means of hand embellishing the surface of a fabric:
    I like to think of it as drawing with thread. Though some consider it a tedious
    task, I find the practice of embroidery to be incredibly relaxing and meditative.
    It’s easy and convenient to carry a work-in-progress around with you to pick up
    whenever you have a free moment.

    Here are three different stitches that can be used to embellish fabric.


    ![Image](images/f0125-03.jpg)


    **Running stitch:** small, even stitches that run in and out of the cloth, and
    which appear like a dotted line; running stitches grouped together to fill a background
    are called **seed stitches.**


    ![Image](images/f0125-04.jpg)


    **Split stitch:** a chain stitch in which the needle is brought back through the
    previous stitch; it appears like an unbroken line


    ![Image](images/f0125-05.jpg)


    **Satin stitch:** long, straight stitches that are made parallel and close together
    to fill a space


    ![Image](images/f0126-01.jpg)


    7 To prepare your wall hanging for hand embellishment, place it in the embroidery
    hoop. The hoop is made of two circles, a smaller one fitting inside a slightly
    larger one with a clamp. Place the small hoop underneath the fabric and the larger
    hoop on top, sandwiching the fabric between the hoops. Gently pull the fabric
    taut like a drum and tighten the clamp to hold it in place.


    ![Image](images/f0126-02.jpg)


    8 I began my stitching with a satin stitch in the outer ring of the design, filling
    in the empty space with parallel stitches in an array of colors.


    ![Image](images/f0127-01.jpg)


    9 I added longer-length satin stitches to fill in the center of the the floral
    pods (gold thread). A series of running stitches grouped together make up the
    seed stitch, and is used for background filling.


    ![Image](images/f0127-02.jpg)


    10 Reposition the hoop as necessary according to the needs of your design.


    ![Image](images/f0127-03.jpg)


    11 When finished with the stitching, remove the fabric from the hoop and lay flat
    to iron out any wrinkles. Slide the 14" (35.5 cm) dowel through the sleeve you
    created when hemming the banner (store-bought canvas banners are usually already
    outfitted with hanging hardware). Use a length of jute, hemp, or any other sturdy
    string to tie around each end of the dowel for hanging.


    ## CHAPTER 5


    ### WASTE NOT

    I ’ve never been all that interested in perfection. The works of art that speak
    the loudest to my soul are always those in which the artist’s hand is clearly
    evident. I love to search for wayward marks, cracks, odd proportions, and strange
    color combinations in every piece I consume because, to me, the “mistakes” are
    the fulcrums of magic in a given work of art. *Kintsugi* is the Japanese art of
    lovingly repairing broken ceramics with a special gold, silver, or platinum lacquer—essentially
    highlighting a mistake and turning it into something sparkling and special. These
    final projects are exercises in letting go of failures and embracing the imperfect
    nature of print.


    ![Image](images/f0128-01.jpg)


    #### Project: FRANKENSTEIN''S MONSTER

    Much like the monster in Mary Shelley’s *Frankenstein*, this project focuses on
    repurposing interesting and useful parts of failed prints to create something
    new and wholly unexpected. This is the perfect opportunity for experimentation
    and play: Because the prints you’ll be using are unsuitable to edition, they are
    thus devoid of preciousness. That means you have complete freedom from your original
    intentions and how things are “supposed” to look. So use that freedom to really
    stretch your legs creatively; for example, if you’re usually neat, orderly, and
    organized, try approaching this project with wild expression. I recommend playing
    mad scientist in the laboratory. Cut things up, move them around, crank up the
    music, and work by instinct. When you land on an arrangement or pairing that makes
    you say to yourself, *oh that’s interesting*, follow that stream wherever it takes
    you. Don’t be surprised if you get swept up in a flood of new ideas.


    ##### Tools and Materials

    - A small stack of failed prints

    - One sheet 8" x 10" (20.5 x 25.5 cm) heavyweight tagboard paper

    - Repositionable adhesive

    - Glue brush

    - Scissors or craft knife

    - Optional: needle and thread or sewing machine

    - Optional: tracing paper

    - Optional: paint kit

    - Optional: lightning storm


    ![Image](images/f0130-01.jpg)![Image](images/f0131-01.jpg)


    1 Because this is a collage that involves layering papers, the background is the
    first consideration. I used a misprint from Texture Quilt (shown [here](#ch03.xhtml#page_50)).


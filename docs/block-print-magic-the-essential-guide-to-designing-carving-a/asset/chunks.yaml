    4 With the brayer, roll ink onto the block. Keep the roller parallel with the
    block as you apply the ink. Pull the brayer across the block in multiple directions,
    ensuring an even coating of ink. Take care to hit the edges of the block, which
    are easy to miss. Hold the block up to the light, tilting it and inspecting it
    to see that each area of the block is wet. Be careful not to swing too far in
    the other direction and overink the block, which would cause ink to bleed into
    the finer details.


    5 If any ink has hit areas of negative space on your block, or anywhere else you
    didn’t want your ink to go, you can wipe the area with a paper towel to avoid
    noise in your print.


    ![Image](images/f0041-01.jpg)


    6 Apply paper on top of the block, taking care to lay it down once and not move
    it again.


    ![Image](images/f0041-02.jpg)


    7 Lightly hold the paper in place with one hand, and with the other, tightly grip
    your baren and press down on the block, moving in small circles with firm pressure.


    ![Image](images/f0041-03.jpg)


    8 Gently peel the paper off the block and place on your drying rack or on a flat
    surface.


    ## Ink Application

    The application of ink can be a fickle process with many variables, starting with
    your brayer. I have artist friends who use exclusively hard rubber and some (like
    me!) who swear by soft rubber. The benefit of hard rubber is that it’s great for
    applying thin layers of ink to delicate, detailed areas of the block, but I find
    that it’s tough to get an even coating. The benefit of soft rubber is that the
    ink is applied evenly without much effort, but sometimes these brayers can deposit
    too much ink into shallow channels, causing details to bleed out upon printing.


    ### DIRECTION OF APPLICATION

    As you pull the brayer across the block, move in multiple directions—up and down
    as well as left to right—to ensure that each area of the block receives ink. If
    your brayer is not quite wide enough to stretch across the whole block, stagger
    your passes so the ink layers evenly. Beware of any large areas of negative space,
    as the brayer may hit it and deposit ink accidentally, causing noise or accidental
    marks in the final print. It’s up to the artist to decide what is or is not an
    acceptable amount of noise.


    ### PRESSURE OF APPLICATION

    The pressure used when rolling the brayer across the block depends on a couple
    factors: consistency of the brayer and consistency of the block. If your brayer
    is soft, you’ll barely need to assist gravity because pushing too hard will cause
    the soft rubber of the brayer to push into the channels you’ve carved, depositing
    ink where you don’t want it. You may need to lean into the brayer slightly if
    it’s hard rubber, as it needs a bit more pressure to evenly deposit ink.


    If printing with a soft rubber block instead of dense linoleum, a much lighter
    touch is required. Push too hard and the block will squish, allowing ink into
    shallow channels, causing detail loss in the final print.


    ![Image](images/f0042-01.jpg)


    Using too much ink can also cause the ink to squish up over the edge of your brayer.
    This can can cause unsightly lines and globs of ink to appear in the final print.
    Always make sure that your brayer is properly cleaned after each printing session
    to avoid dried ink buildups.


    ![Image](images/f0042-02.jpg)


    ## Goldilocks and the Three Prints

    ![Image](images/f0043-01.jpg)


    Underinked: Not enough ink transferred from inking plate to brayer to block. I
    either didn’t have enough ink on the brayer or I didn’t make enough passes over
    the block with the brayer. “Ghosts” or tiny hiccups in the ink, as well as other
    imperfections, are painfully visible.


    ![Image](images/f0043-02.jpg)


    Overinked: My brayer was overloaded, so I lost details in the fur.


    ![Image](images/f0043-03.jpg)


    Just Right: The print boasts a velvety finish and a clean background. All details
    in the fur are visible and ink is consistent across the image.


    ![Image](images/f0043-04.jpg)


    ## Registration

    Registration is a system used by printmakers to ensure that the block and paper
    are both in the same position for each print. This is most important when you
    are printing with multiple colors layered on top of one another—being off by even
    a millimeter can have disastrous effects on a detailed composition.


    Additionally, the straighter the block is on the paper, the more professional
    the print’s appearance will be. A crooked print can be saved by some clever framing,
    but it’s best to avoid such trouble if you can.


    On the following pages are three different types of registration devices, or printing
    jigs. Each of these is used at least once for the projects in this book, but will
    also help you keep printing straight long after you’ve closed these pages.


    ![Image](images/f0043-05.jpg)


    Registered


    ![Image](images/f0043-06.jpg)


    Unregistered


    ## PROJECT: BOX GRID

    This is the simplest type of registration device, and the one I use most often.
    It works best with unmounted blocks or printing surfaces with a lower profile.
    I made an easy device from a scrap piece of hard composite wood.


    ### TOOLS AND MATERIALS

    Scrap piece of 11" x 14" (28 x 35.5 cm) board


    Ruler


    Permanent marker


    ### MAKE IT!

    ![Image](images/f0044-02.jpg)


    1 With a pencil and a ruler, trace outlines of the standard sizes of papers and
    blocks that you use the most. Go over the lines with a permanent marker. Standard
    US sizes are 4" x 6" (10 x 15 cm), 5" x 7" (13 x 18 cm), 8" x 10" (20 x 25 cm),
    9" x 12" (23 x 30.5 cm), and 11" x 14" (28 x 35.5 cm).


    2 To register the block, simply set it within the outline of its corresponding
    size. A 5" x 7" (13 x 18 cm) block is placed in 5" x 7" (13 x 18 cm) space.


    ![Image](images/f0044-03.jpg)


    An 8" x 10" (20 x 25 cm) printing paper is laid on top of the block. Use the 8"
    x 10" (20 x 25 cm) outline as a guideline for where to drop the paper.


    ## PROJECT: HINGED WINDOW

    With the hinged window, the block sits snugly within the slightly raised border
    of the base window, and printing paper is taped to the top window. The printing
    paper is aligned with the upper guideline. When the block is inked and the top
    window is closed, the paper comes into contact with the block.


    ### TOOLS AND MATERIALS

    Two precut 11" x 14" (28 x 35.5 cm) mats with an 8" x 10" (20 x 25 cm) window


    One 11" x 14" (28 x 35.5 cm) or larger board


    Tape


    Ruler


    Pencil


    ### MAKE IT!

    1 Glue one of the precut mats flat to the 11" x 14" (28 x 35.5 cm) board, keeping
    the edges of the mat and the board flush together. Weight the mat while the glue
    dries to ensure a full bond. This creates a shallow space that will hold your
    block in place as you print.


    ![Image](images/f0045-01.jpg)


    2 Place the other mat directly on top of the attached mat. Firmly tape the two
    mats together along one of the short ends. The tape creates a hinge and allows
    the top mat to swing open.


    3 Place registration marks on the top mat. Draw a dark line along the top, parallel
    to the hinged edge. This will be the guideline to which you will match the top
    of your printing paper.


    ![Image](images/f0045-02.jpg)


    4 Draw marks all around the mat—the more marks you make, the more precise your
    registration will be. For a more detailed look at using this device, see Multi-Block
    Hex Sign project, shown [here](#ch03.xhtml#page_56).


    ## PROJECT: PIN AND TAB


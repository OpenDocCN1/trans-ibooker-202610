    Test your tapes and how they adhere to your papers before you actually tape the
    tabs into place. The washi tape used in these photos pulled cleanly off the Blick
    printmaking papers, but tore the more fibrous kozo paper. Some printmakers prefer
    painter’s tape, but I find that sometimes it loses its stickiness too quickly.
    You may need to do a little trial and error beforehand. It would be super sad
    to ruin a perfect print by accidentally tearing the paper when removing the tabs!
    (However if this does happen, you can use the print in one of the projects in
    [Chapter 5](#ch05.xhtml#ch05): Waste Not.)


    ![Image](images/f0066-01.jpg)


    ## Process Steps


    ### 4 Sketch your design and then do a final line drawing. Use colored pencils
    to plan where you want your colors.

    ![Image](images/f0066-02.jpg)


    ### 5 Tape a piece of tracing paper over your drawing and carefully trace the
    design with a sharp, soft graphite pencil.

    ![Image](images/f0066-03.jpg)


    ### 6 Flip the tracing paper onto the block and tape it in place. Trace only the
    outline of your design. Lock the drawing into place with a fine-point permanent
    marker.


    ### 7 Carve out the negative space. This will give your image a clean, blank background.

    ![Image](images/f0067-01.jpg)


    ### 8 As always, we start with printing the lightest color first, in this case
    the yellow. (To make a happy, sunshiny yellow, I mixed Caligo SafeWash Relief
    inks in diarylide yellow and opaque white.) Mix and spread the ink with a palette
    knife on your inking plate.

    ![Image](images/f0067-02.jpg)


    ### 9 Roll out the ink and apply it to your block. Take care to wipe off any wayward
    ink.

    ![Image](images/f0067-03.jpg)


    ### 10 Set the block into the pin-and-tab registration device, making sure that
    it is firmly tucked into the corner of the jig.


    ### 11 Fit a tabbed piece of printing paper into the pins and carefully lay down
    the paper. Press firmly on the back of the paper with a baren, taking care to
    hit every area of the block.

    ![Image](images/f0068-01.jpg)


    ### 12 Peel up the paper to check that all areas of the block are transferring
    evenly. Use a firmer baren such as a spoon to coax out stubborn details. This
    is also a good time to recheck your design. (At this point, I realized that I
    wanted the veins in the leaves to read as white lines, so I went back and carved
    them.)

    ![Image](images/f0068-02.jpg)


    ### 13 Set the print aside to dry and repeat steps 9–12 as often as your edition
    size calls for. Even when mixing in cobalt drier to speed up drying time, I still
    like to allow three days in between layers to ensure that the ink dries completely.
    Printing wet ink onto wet ink can cause a loss of detail and inconsistent, blotchy
    color.


    ### 14 Clean excess ink from the block by first blotting with scrap paper and
    then wiping the block down. Highly pigmented inks often stain the block, but as
    long as the block is thoroughly cleaned, these stains will not transfer.

    ![Image](images/f0069-01.jpg)


    ### 15 Using the traced image from step 5, line up the image with your carved
    block and transfer the details. Everything that you carve away now will remain
    yellow on the print. Carve out everything that you want to remain yellow. For
    this design, you will be mostly carving out the petals of the flowers.

    ![Image](images/f0069-02.jpg)


    ### 16 Now that you’ve carved the second pass, it’s time to print orange (I used
    light orange, diarylide yellow, and opaque white to achieve this color). Roll
    out the ink, apply to the block, and place the block in the jig.

    ![Image](images/f0069-03.jpg)


    ### 17 You will be printing directly on top of the previous, now-dry yellow layer.
    Print the orange block and repeat as per your edition size. Set the prints aside
    to dry.

    ![Image](images/f0069-04.jpg)


    ### 18 Clean excess ink from the block by first blotting with scrap paper and
    then wiping the block down.

    ![Image](images/f0070-01.jpg)


    ### 19 Time to carve for the third and final time. Cut away the portions of the
    block that you want to remain orange. Everything you leave on the block after
    this will print black. So for this design, carve out everything except the outline.

    ![Image](images/f0070-02.jpg)


    ### 20 With the final pass carved, roll out the black ink and apply it to the
    block. You will be printing directly on top of previous, now-dry yellow and orange
    layers. Print the black block and repeat as per your edition size. Set aside to
    dry.

    ![Image](images/f0070-03.jpg)


    You can try printing on colored paper too!


    ### 21 Clean your block, workspace, and tools.


    ### 22 When the final layer has completely dried, carefully peel the tape and
    tabs off your prints.


    ## AN IMPORTANT NOTE ABOUT REDUCTION CUT PRINTS


    With reduction prints you will only ever be able to do a single, limited-edition
    run. Because you use the same piece of substrate for each block, you essentially
    destroy the first block in order to make the second—and then destroy the second
    in order to make the third, and so on.


    ## ARTIST SPOTLIGHT: DERRICK RILEY


    My life changed forever when, as a senior at the University of Kentucky, I took
    my very first printmaking class, beginning woodcut, with Derrick Riley. An MFA
    and member of the Kentucky Division of the famed Outlaw Printmakers, Riley has
    been operating his own press since 2005, churning out epic-scale narrative prints
    that celebrate the strangest of Kentucky folklore, randy robots, and curious creature
    mashups. He’s known for his bold, graphic style and finely detailed renderings
    of form.


    ![Image](images/f0071-01.jpg)


    Cyclopian Gorilla


    ### EH: How did you first become interested in printmaking?

    DR: I was a drawing major as an undergrad, and a printmaking course was required
    for my degree. During the course, in 2000, there was a Joel Feldman retrospective
    at the university museum. The exhibition had these gigantic banner style black
    and white woodcuts of Aesop’s Fables that were amazing. Until that time I had
    never realized that a print could be that large. After that I was hooked.


    ### EH: What drew you to relief in particular?

    DR: Several things initially drew me into relief printmaking. First of all, playing
    with knives all day is pretty awesome. And I was intrigued with how the visual
    power of a limited palette—and the stark contrast of white and black—is far greater
    than a full palette. I also happen to be very heavy handed, and the resistance
    provided by a block of wood or linoleum keeps my heavy hand in check.


    ### EH: How would you describe your work and process?

    DR: I start each block by drawing my imagery, first in pencil then again in Sharpie.
    I meticulously draw each detail until it’s exactly how I want the print to look
    in the end. I stain the block red so that I’ll be able to see where I’ve carved
    and where I haven’t—then I start carving. My work is very intricate and tedious.
    It’s not uncommon for me to work on a block continuously for 6 months at a time.


    ### EH: How do you stay creative on a day-to-day basis?

    DR: I give myself strict goals and deadlines, and I stick to them. Many times
    I find myself telling a friend that I can’t do something because I have to finish
    a block, When they ask what the block is for, I don’t have an answer for them,
    there isn’t a deadline, it’s not specifically for anything, but I can still feel
    the need and drive to finish it.


    ### EH: Describe the space in which you make your art.


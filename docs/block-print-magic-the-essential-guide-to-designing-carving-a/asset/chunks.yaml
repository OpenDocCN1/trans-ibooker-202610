    ![Image](images/f0107-02.jpg)


    ### EH: What’s the best advice you’ve ever been given as an artist?


    AS: Not everyone is going to like what you create. When we’re creating, we’re
    putting something of ourselves into our work in one way or another, and when we
    share it with the world we obviously want it to be appreciated. Unfortunately,
    not everyone is going to share our taste or our vision, and we just have to accept
    that. It’s important not to take it personally. As much as we invest in our work,
    just be sure you like it, so you have the confidence to shrug it off when someone
    criticizes it or even hates it.


    ![Image](images/f0107-03.jpg)


    ### EH: If you could spend a day in the studio with three artists you admire (living
    or dead) who would you choose?


    AS: Emily Carr, Frida Kahlo, and Jane LaFarge Hamill. Each has such a different,
    well-defined vision, and I would love to just bask in their brilliant talent.


    **Visit Aftyn Shah at [www.riseandwander.com](http://www.riseandwander.com)**


    ### PROJECT: LIVING LANDSCAPE


    Usually my advice is to work from observation and trust your eyes, but this project
    has you do quite the opposite. The memory of a place can often be more vivid,
    more inventive, than a traditional study *en plein air* or from a photograph.
    Allow your expression to evolve by gradually removing the burden of reality from
    your landscape.


    Visit a place. Take in the mood. Allow your senses to do the drawing. With your
    eyes, trace the path of flotsam rushing down a creek. Smell the leaves underfoot
    and notice their mottled repetition on the forest floor. Listen to the wind crashing
    through the trees like waves. Watch the clouds boil and tumble across the sky
    as the sun bleeds into the horizon. The land is alive, and you can inject that
    same life into your composition.


    Return to the studio and record your impression of that place by making sketches.
    Try drawing from the shoulder, which keeps lines loose and allows them to sweep
    across the picture plane. I also recommend studying the brushstrokes of such notable
    post-Impressionist painters as Emily Carr and Vincent Van Gogh. Here we have Van
    Gogh’s 1889 *Wheatfield with Cypresses*, where the land appears to undulate and
    wave. The short, staccato marks in the foreground suggest a dense field, while
    the longer brushstrokes in the trees fade off into wisps, giving the design more
    room to breathe. With each mark, Van Gogh suggests the presence of wind and directs
    our eyes across the page. Though his medium was oil paint on canvas, the same
    ideas apply to the marks you make with your carving tools.


    #### Tools and Materials


    8" x 10" (20.5 x 25.5 cm) unmounted linoleum

    9" x 12" (23 x 30.5 cm) printing papers

    Pencil

    Fine-tip permanent marker

    Tracing paper

    Carving tools

    Washi/masking tape

    Inking plate

    Black ink

    Palette knife

    Brayer

    Baren


    ![Image](images/f0108-01.jpg)![Image](images/f0108-02.jpg)


    *Wheatfield with Cypresses*, Vincent van Gogh, 1889


    #### Keep in Mind


    An established foreground, middleground, and background will give the composition
    balance.

    Focused, directional lines that move across the plane will help you achieve the
    impression of movement in an otherwise static scene.

    A wide variety of line widths and lengths will allow you to add texture, energy,
    and depth to the scene.


    1 Starting with a memory of a bonfire on a farm with friends, I sketched up a
    nighttime landscape that attempts to echo the feeling of that night. I established
    a foreground with two late-autumn trees acting as a frame for the entire scene,
    ferns growing at their base. The middleground includes the grasses, pine trees,
    and cabin. Smoke from the chimney reaches into the black night sky background
    with a smattering of stars.


    ![Image](images/f0109-01.jpg)


    2 When I have a drawing with lots of visual information, I like to transfer the
    drawing directly to the block by taping it in place and rubbing firmly with the
    butt of a marker. After a successful transfer, I inked in the lines, making edits
    as I went along.


    3 Desiring to keep my landscape as loose as possible, I didn’t want to plan my
    marks too much. Carving intuitively can be a bit scary, but the expressiveness
    of your lines may surprise you! Below are details on how I carved the block.


    ![Image](images/f0109-02.jpg)


    **Moon detail:** I used contour lines (see Contour Line Skull project, shown [here](#ch03.xhtml#page_74))
    to give the moon a little bit of volume, curving my marks in accordance with the
    form, experimenting with craters and pocks. Here I used a 0.5-mm veiner as well
    as a 2-mm U gouge.


    ![Image](images/f0109-03.jpg)


    **Pine tree detail:** Tiers of short cuts with a 1-mm V-parting tool created a
    stylistic pine tree. Clumping the marks closer together on the right side of the
    trees act as a highlight, suggesting reflected light from the moon and giving
    the illusion of volume.


    ![Image](images/f0110-01.jpg)


    **Frame tree detail:** Inspired by the cypress trees that are heavily featured
    in Van Gogh’s body of work, I used my own photo of bald cypress bark to inform
    my marks. First I outlined the trunk and branches to set the trees apart from
    the background, then I allowed my interior cuts to cross over one another, come
    together, and wander apart.


    ![Image](images/f0110-02.jpg)


    **Star detail:** To make the tiny holes that read as stars, I held a 0.5-mm veiner
    perpendicular to the block and gently pushed it straight down until the blade
    bit in, and then twirled it in place. Instead of spreading the stars evenly across
    the sky, I decided to cluster them together slightly, meandering upward like a
    stream.


    ![Image](images/f0110-03.jpg)


    **Ground detail:** As the foreground is closest to the viewer, I included more
    details here. I added in small flowers and ferns, and used small clusters of narrow,
    wispy, upward strokes to suggest grass receding into the distance.


    ![Image](images/f0110-04.jpg)


    **Smoke detail:** Lack of a definite outline keeps the smoke looking loose, as
    larger spaces between the marks suggest more air. Long, swirling lines appear
    playful, and further assist in directing the eye around the composition. I used
    a 1-mm V-parting tool, 0.5-mm veiner, and a 2-mm U gouge to ensure variety, the
    larger marks appearing to catch more light.


    **Cabin detail:** Repeating parallel lines mimic timber and reinforce perspective.
    Tiny notched tick marks suggest shingles on the roof catching light from the moon.


    ![Image](images/f0111-01.jpg)


    4 Print as usual (see Printing Techniques shown [here](#ch02.xhtml#page_40)).


    ![Image](images/f0111-02.jpg)![Image](images/f0111-03.jpg)


    *The Cabin*, fully carved


    ![Image](images/f0111-04.jpg)


    The completed print


    ### ARTIST SPOTLIGHT: LILI ARNOLD


    The work of Lili Arnold is instantly recognizable: her colorful block prints are
    executed with practiced craftsmanship and fueled by a love of nature, especially
    the flora of her California homeland. Colors blend seamlessly into one another,
    lending a soft richness to the surface of her prints. Arnold’s compositions are
    beautifully balanced with a wonderful variety of lines. Read on for a deeper dive
    into Arnold’s creative practice.


    ![Image](images/f0112-01.jpg)![Image](images/f0112-02.jpg)


    ### EH: What drew you to relief in particular?


    LA: I was drawn to relief printing as first because of its practicality. I don’t
    have a real art studio or much space to create art, so relief printing has been
    the perfect solution because I can make prints without a press and with just a
    few materials: ink, paper, rollers, and a block. When I first started I used a
    wooden spoon to burnish my prints, but eventually upgraded to a plastic baren,
    and now I hope to upgrade to a press someday!


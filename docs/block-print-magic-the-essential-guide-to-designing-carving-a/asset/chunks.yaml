    \n    Scissors\n\n    Ruler\n\n    Pencil\n\n    Optional but helpful: paper cutter\n\
    \n    Tape\n\n    ![Image](images/f0134-01.jpg)\n\n    1 Choose a “base” print—this\
    \ will be the print that all the other prints are woven into. For ease of cutting,\
    \ I recommend choosing a print with a very clear, straight border.\n\n    ![Image](images/f0134-02.jpg)\n\

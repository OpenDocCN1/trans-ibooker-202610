    We’re about to make something awesome together. In this book I’ll be sharing essential
    techniques and processes for creating visually captivating linoleum and rubber
    block prints. I’ve designed a series of projects to hone your skills and test
    your creativity, including some fun ways to salvage your mistakes and give mess
    ups a second life. This book is meant to inspire, encourage, and help you build
    the skill set you’ll need to bring every glorious idea you have to life.


    Never picked up a carving tool before? No worries—this book is for you. Dabbled
    in printmaking in art class, and looking to take your work more seriously? This
    book is for you, too! In the following pages you’ll find useful information on
    everything from tools and materials to elements of a good composition. I’ll show
    you how to make some of your own studio supplies, such as simple inking plates
    and drying racks. Each printing project is designed to focus on a specific skill
    or skills—from basic textures to multi-block prints to rainbow rolls and everything
    in between. We’ll also meet a handful of printmakers from across the United States
    who graciously share their experience and secrets to help us along. No matter
    your own art history or skill level, there’s something for you here.


    My own background as an artist is interdisciplinary: my roots are in classical
    drawing and painting from observation, and I found printmaking relatively late
    in my education. I treat sculpture like a creative palate cleanser, and love tweaking
    designs for woodworking projects. I practice embroidery as a form of stress relief.
    Each discipline informs the other. The painter has something to learn from the
    sculptor, just as the football player has something to learn from the ballet dancer.
    It is my dearest hope that you’ll be able to learn something from me.


    And now it’s time! Test the weight of the carving tool in your hand and feel the
    tingling sensation of *possibilities*. Listen for the kiss of the brayer as it
    rolls out the ink. Let some choice swear words slip in tandem with your V-gouge
    (hey, it happens to all of us). Make plenty of mistakes, stab yourself once or
    twice, learn your lessons, and then revel in your first perfect print. Pull something
    into existence by the force of your own will. There’s magic to be made here.


    Yours in inky solidarity,


    Emily


    ![Image](images/f0009-01.jpg)


    # CHAPTER 1

    ## ESSENTIAL TOOLS AND MATERIALS


    In this chapter, you’ll learn about the basic materials needed to take you from
    bright idea to successful linocut print. Linocut printing is a form of relief
    printing, the process of pulling a print from a carved block, where the ink is
    deposited on the remaining (uncarved) areas of the block. One of my favorite things
    about relief printmaking is that you don’t need expensive equipment to make studio-quality
    prints, and most tools are relatively affordable. There are lots of brands of
    tools, papers, blocks, and inks to try, so research and experiment to find what
    works best for you.


    ![Image](images/f0010-01.jpg)


    ### ESSENTIAL TOOLS


    #### Blocks


    ##### CARVING BLOCKS


    Though printmaking encompasses many different types of carving surfaces, this
    book focuses on the use of linoleum and rubber blocks. Soft rubber is often a
    good choice for younger, less experienced printmakers as it is easy to cut with
    beginner’s tools. I also prefer soft rubber when printing on fabric. The sturdier
    linoleum is harder to cut and requires sharp tools but its density holds detailed
    cuts beautifully, and it is less likely to accidentally squish and bleed during
    printing.


    ![Image](images/f0012-01.jpg)


    ##### LINOLEUM BLOCKS


    Made of linseed oil, cork dust, wood flour, and pine resin, linoleum is a medium
    that many artists choose to work in because of its renewable composition. It comes
    in a variety of small-to-medium standard sizes as well as in large rolls, and
    due to its flexibility it can be cut into any shape. Many professional printmakers
    prefer the unmounted “battleship gray” linoleum.


    Linoleum sometimes comes mounted on thick blocks of composite wood and although
    these can’t be easily manipulated into different shapes, the wooden backing provides
    extra support and protection for your carving. The weight of the mounted block
    also helps to keep your carving stable when you peel off the print.


    Linoleum (mounted or unmounted) can be heated to help carving tools move through
    them more smoothly: you can do this by covering the block with a towel and gliding
    over it with a clothes iron on a medium setting. Or you can simply warm it with
    a hairdryer. I personally find that sitting on a block heats it up just enough.
    If you keep your carving tools sharp, however, you may not need to heat your block.


    Linoleum should always be stored flat, away from direct sunlight and extreme temperatures.
    Light, extreme temperatures, and time will eventually cause your linoleum to become
    hard, warped, crumbly, and infuriating to carve. I don’t keep much linoleum on
    hand because fresh linoleum cuts best.


    ![Image](images/f0013-01.jpg)


    From top to bottom: MOO Carve Professional Carving Block; Speedball Speedy-Carve;
    Speedball Speedy-Cut; Speedball mounted linoleum block; Blick battleship gray
    unmounted linoleum.


    ![Image](images/f0013-02.jpg)


    The loose-weave burlap on the back of unmounted linoleum, also referred to as
    the hessian backing.


    ##### RUBBER BLOCKS


    Rubber blocks such as Soft-Kut, MOO Carve, and Speedy-Carve are a good alternative
    to traditional linoleum: they’re generally much softer and easier for the blade
    of your carving tools to bite into. It takes only a fraction of the power necessary
    to push a blade through linoleum. The softest of the blocks, like MOO Carve, require
    only the lightest flicks of your blades so a steady hand is very helpful. Rubber
    blocks are great for detailed work and won’t get crumbly as linoleum sometimes
    does.


    #### Carving Tools and Tool Care


    Most starter kits come with a variety of blade widths and shapes, ranging from
    the narrowest veiners to the widest U-shaped blades. Veiners are for making very
    thin, fine lines. V gouges are formed at either 45- or 90-degree angles. U gouges
    are—you guessed it—shaped like Us, and are great for scooping out lino cleanly.
    You should also consider the size of your hand and the type of handle that will
    give you the best grip—full-size tools can be harder to wield but provide greater
    leverage for more power behind your cuts. Mushroom-shaped palm tools can provide
    a more comfortable, stable grip for carving fine details.


    Though I keep many tools at hand, I usually end up reaching for the same four
    tools over and over again: a 1-mm U gouge, 3-mm U gouge, 1-mm V gouge, and a 0.5-mm
    veiner. Those are my workhorses, suitable for most projects with fine details
    under 11" x 14" (28 x 35.5 cm).


    ![Image](images/f0014-01.jpg)


    Top to bottom: Pfeil full size no. 11 veiner; Pfeil palm tools set C; Powergrip
    set; Speedball linoleum cutter with interchangeable blade heads.


    ![Image](images/f0014-02.jpg)


    Pfeil Swiss-made carving tools, set C


    The density of your linoleum has an impact on your tools. Dense battleship gray
    lino will dull a blade much faster than its soft rubbery counterparts. Because
    your blades will take a beating just from regular use, it is worthwhile to buy
    the best quality blades you can afford. However don’t discount the cheaper starter
    sets—they are perfect for beginners and some have interchangeable blades that
    you can conveniently store in the handle of the tool itself.


    ##### Sharpening Your Tools

    '

    ## 项目：轮廓线骷髅


    轮廓线是暗示物体形态的线条。这些线条可用于显示形态内的任何平面变化。

    在图 1 中，你可以看到简单地添加直线然后是曲线如何将一个扁平的圆形转变为三维的球形。

    图 2 分解了球体的轮廓线。要了解轮廓线如何暗示体积，先将圆四等分，然后画出线条，随着远离中心线而以不同程度弯曲。

    一个绝佳的例子，可参见大师阿尔布雷希特·丢勒在这幅 1527 年的自画像木刻中的这些轮廓线。


    ### 工具和材料

    8" x 8" (20.5 x 20.5 cm) 未装裱的胶版

    10" x 10" (25 x 25 cm) 印刷纸

    铅笔

    细头永久性记号笔

    描图纸

    雕刻工具

    和纸/遮蔽胶带

    上墨板

    黑色油墨

    调色刀

    滚筒

    焙板


    ![Image](img/f0074-01.jpg)

    *阿尔布雷希特·丢勒，56 岁*，德国学派，1527 年


    ![Image](img/f0074-02.jpg)

    图 1


    ![Image](img/f0074-03.jpg)

    图 2


    ![Image](img/f0075-01.jpg)

    1 使用你选择的转印方法，将自己的设计转印到版块上。

    2 用细头记号笔固定线条。


    ![Image](img/f0075-02.jpg)

    3 小心地雕刻出负空间。

    4 雕刻出花卉细节。


    ![Image](img/f0075-03.jpg)

    a. 在叶片上雕刻出一条中心线。


    ![Image](img/f0075-04.jpg)

    b. 在叶片一侧雕刻出一条内边框线。


    ![Image](img/f0075-05.jpg)

    c. 从中心线开始，向下向左倾斜，雕刻叶片左侧的叶脉线，在边缘前停止。


    ![Image](img/f0075-06.jpg)

    d. 从内边框线开始，向中心线方向向上倾斜，雕刻叶片右侧的叶脉线。


    ![Image](img/f0075-07.jpg)

    这里是完全雕刻好的花卉背景。


    ![Image](img/f0076-01.jpg)![Image](img/f0076-02.jpg)

    5 使用轮廓线指南，用铅笔轻轻在骷髅上画出轮廓线。开始雕刻出跟随骷髅轮廓的线条，使用较小的凿子——我使用的是我的 1 毫米 V 形分切工具。


    ![Image](img/f0077-01.jpg)

    6 继续直到骷髅被薄薄的轮廓线覆盖。


    ![Image](img/f0077-02.jpg)

    7 再次进行雕刻，这次使用更大的工具。这里我使用的是我的 4 毫米 12 号 V 形分切工具。将你的刻痕集中在弯曲区域的顶点（最突出之处，如额头和颧骨）。这将有助于减轻这些区域的明度，使其看起来向前移动或更接近观者。


    ![Image](img/f0077-03.jpg)

    8 继续雕刻直到你在形态内实现了明度的范围（深黑、中灰和浅白）。


    ![Image](img/f0078-01.jpg)

    9 组装你的印刷工具并滚出油墨。


    ![Image](img/f0078-02.jpg)

    10 通过在更大的一张纸上描摹版块以及 10" x 10" (25 x 25 cm) 印刷纸的一块，制作一个简单的印刷夹具。这将有助于每张版的印品大致落在同一位置。


    ![Image](img/f0078-03.jpg)

    11 上墨后，将纸张贴到版块上并用焙板用力压实，如有必要，用更坚硬的焙板如勺子抛光区域。


    ![Image](img/f0078-04.jpg)

    12 小心地将纸张从版块上剥离。


    13 将你的印品放在一旁晾干。


    ## 艺术家聚焦：KELLI MACCONNELL


    一位无所畏惧的实验者、自然世界的学生和才华横溢的版画家，来自俄勒冈州波特兰的 Kelli MacConnell 创作了一些自然界最精美标本的亲密肖像。MacConnell
    对树木的精湛描绘赋予了它们超越森林的生命，庄严而高贵，值得敬仰。她的印品唤起自然世界的宁静，并暗示了一种深思熟虑、经过研究的创作方法，提醒我们直接观察往往是最好的老师之一。


    ![Image](img/f0079-01.jpg)![Image](img/f0079-02.jpg)



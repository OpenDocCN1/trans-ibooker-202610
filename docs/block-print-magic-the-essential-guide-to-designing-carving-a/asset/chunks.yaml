    ## PROJECT: CONTOUR LINE SKULL


    Contour lines are lines that suggest the form of an object. These lines can be
    used to show any planar changes within the form.

    In diagram 1, you can see how the simple addition of straight lines and then curved
    lines transform a flat circular shape into a three-dimensional spherical form.

    Diagram 2 breaks down the contour lines of a sphere. To see how contour lines
    suggest volume, start by quartering a circle, then draw lines that bend by varying
    degrees the farther away from the center line they are.

    For a brilliant example, see these contour lines by the master Albrecht Dürer
    in this self-portrait woodcut from 1527.


    ### Tools and Materials

    8" x 8" (20.5 x 20.5 cm) unmounted linoleum

    10" x 10" (25 x 25 cm) printing papers

    Pencil

    Fine-tip permanent marker

    Tracing paper

    Carving tools

    Washi/masking tape

    Inking plate

    Black ink

    Palette knife

    Brayer

    Baren


    ![Image](images/f0074-01.jpg)

    *Albrecht Dürer, aged 56*, German School, 1527


    ![Image](images/f0074-02.jpg)

    Diagram 1


    ![Image](images/f0074-03.jpg)

    Diagram 2


    ![Image](images/f0075-01.jpg)

    1 Using the transfer method of your choice, transfer your own design onto the
    block.

    2 Lock in the lines with a fine-point marker.


    ![Image](images/f0075-02.jpg)

    3 Carefully carve out the negative space.

    4 Carve out the floral details.


    ![Image](images/f0075-03.jpg)

    a. Carve out a center line on the leaf.


    ![Image](images/f0075-04.jpg)

    b. Carve an inner border line on one side of the leaf.


    ![Image](images/f0075-05.jpg)

    c. Beginning at the center line and sloping downward and to the left, carve vein
    lines for the left side of the leaf, stopping just before the edge.


    ![Image](images/f0075-06.jpg)

    d. Beginning at the inner border line and sloping upward toward the center line,
    carve vein lines for the right side of the leaf.


    ![Image](images/f0075-07.jpg)

    Here is the fully carved out floral background.


    ![Image](images/f0076-01.jpg)![Image](images/f0076-02.jpg)

    5 Using the contour line guide, lightly draw contour lines across the skull with
    a pencil. Begin carving out lines that follow the contours of the skull, using
    a smaller gouge—I used my 1-mm V-parting tool.


    ![Image](images/f0076-03.jpg)

    6 Continue until the skull is covered in thin contour lines.


    ![Image](images/f0077-01.jpg)

    7 Take a second pass at carving, this time with a bigger tool. Here I used my
    4-mm no. 12 V-parting tool. Concentrate your marks on the apexes of curved areas
    (the spots that stick out the most, like the forehead and cheekbones). This will
    help lighten the value in these areas, making them appear to move forward or appear
    closer to the viewer.


    ![Image](images/f0077-02.jpg)

    8 Continue carving until you’ve achieved a range of values within your form (dark
    blacks, medium grays, and light whites).


    ![Image](images/f0077-03.jpg)

    9 Assemble your printing tools and roll out your ink.


    ![Image](images/f0078-01.jpg)

    10 Make a simple printing jig by tracing the block as well as a piece of the 10"
    x 10" (25 x 25 cm) printing paper on a larger piece of paper. This will help the
    print fall roughly in the same spot for each print of the edition.


    ![Image](images/f0078-02.jpg)

    11 After inking the block, apply paper to the block and press firmly with a baren,
    burnishing areas with a firmer baren such as a spoon, if necessary.


    ![Image](images/f0078-03.jpg)

    12 Carefully peel the paper back from the block.


    ![Image](images/f0078-04.jpg)

    13 Set your print aside to dry.



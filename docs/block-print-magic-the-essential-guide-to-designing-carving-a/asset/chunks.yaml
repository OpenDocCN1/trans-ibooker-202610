    Over time, the blades of carving tools lose their edge and become dull. A dull
    blade is a printmaker''s nightmare, because it is more difficult to push through
    linoleum. This will cause you to tire quickly and also makes the blade more likely
    to slip or tear the linoleum. A good practice is to sharpen your blades regularly
    to keep them free from nicks and burrs, which are rough little bits of metal that
    can form on the edge of the blade. And to any art student who had to endure the
    struggle of carving with a raggedy tool used by a hundred other students that
    semester, this one’s for you.


    ![Image](images/f0015-01.jpg)

    Flatlay of sharpening tools


    ## Using a Slipstrop

    Here is how to hone your tools using the Flexcut SlipStrop.


    ![Image](images/f0015-02.jpg)

    1 Start with sharpening the outside of the tool. Rub the yellow honing compound
    (included with the set) onto the flat side of the slipstrop, applying it to the
    leather surface liberally.


    ![Image](images/f0015-03.jpg)

    2 Hold the tool at about a 15-degree angle and place it on the leather, pointing
    away from you. Pulling it back toward you, gently push the outer edge of the blade
    against the leather. If you’re sharpening a U gouge, start on one side of the
    gouge, and roll it to the other side as you pull it back toward you. Rolling the
    tool gradually from side to side ensures that the entire edge makes contact.


    3 If you’re sharpening a V-parting tool, do one side at a time instead of rolling.
    Don''t rub the tool back and forth; pick it up and place it at the top of the
    slipstrope for each stroke.


    ![Image](images/f0015-04.jpg)

    4 Flip the slipstrop over to reveal the funky, ridged side. These curved and steepled
    ridges correspond to the shape of most gouge tools. Select the ridge that matches
    your blade and rub the yellow honing compound liberally along it. Repeat the same
    process for the inner portion of the blade as you used on the outer edge.


    ## Using a Whetstone and Slipstone

    1 Submerge the whetstone in water for 5 to 10 minutes before use. Place on a paper
    towel.


    ![Image](images/f0016-01.jpg)

    2 Hold the tool against the blue side of the whetstone at about a 15-degree angle
    (or so that the cutting edge is flush with the surface of the stone). If you''re
    sharpening a V-parting tool, gently move it up and down against the stone about
    5 times or until you see the edge start to sharpen.


    ![Image](images/f0016-02.jpg)

    3 If you''re sharpening a U-gouge, rock the tool by turning your wrist as you
    move it left to right.


    ![Image](images/f0016-03.jpg)

    4 Run a slipstone, also called an Arkansas stone, along the inside curve of the
    tool, pushing the stone out toward the blade edge. Use a rounded stone for U gouges
    and a pointed one for V-parting tools.


    5 Flip over the whetstone and repeat the process on the finer-grit side to further
    hone/finish the blade.


    ## Brayers, Barens, Plates, and Knives


    ### BRAYERS

    Brayers are rollers used to evenly spread ink onto the surface of a carved block.
    They come in a variety of sizes and are made of either hard or soft rubber. The
    hard rubber brayers are great for coaxing out fine details, and soft rubber brayers
    apply ink very uniformly across a block. You hardly need to exert any pressure
    to apply ink to the block with a soft rubber brayer.


    Consider the size of the block you’ll be printing when selecting a brayer. Ideally,
    the brayer should be slightly wider than the shortest side of the block. This
    will allow an even application of ink without any stray marks left by the edge
    of the roller. The brayer should also be smooth, without any bumps, dents, or
    ridges in the rubber roller, as these imperfections in the roller will transfer
    directly to your print. Keep your brayers clean of ink when not in use and store
    them so that the rubber roller isn’t touching anything.


    ![Image](images/f0016-04.jpg)


    ### BARENS

    A baren is the essential tool for hand pulling a successful print: you use it
    to burnish the back of the paper on your inked block. This tool allows you to
    apply even pressure across the block without ripping holes in your paper. The
    most readily available (and not to mention inexpensive!) baren is a simple wooden
    spoon like mine (see 2 in the photo). A smooth, hard surface is really all you
    need! Steer clear of metal spoons, as the friction needed for printing causes
    them to become hot. Hold the spoon near the top, putting the pads of your index
    finger and middle finger in the bowl; this will give you a stable grip and sufficient
    leverage to burnish your paper.


    Traditional barens intended for Japanese woodblock printing are covered in bamboo
    leaves that make up the handle (see 3). Over time, the bamboo will wear out and
    need to be replaced.


    The Speedball brand baren (see 1) has a higher handle profile and plush pad. I
    find this works great for printing with softer rubber blocks.


    ![Image](images/f0017-01.jpg)


    ### INKING PLATES

    Every printmaker needs an inking plate or platen, which is a clean, smooth, nonporous
    surface on which to mix, spread, and roll out ink. Various materials can be used
    as an inking plate, such as a metal tray, metal bench hook, a piece of safety
    glass with a beveled edge, or a piece of plexiglass with the edges sanded or taped.
    I made the inking plate featured in this book simply by screwing a piece of plexiglass
    to a similarly sized wood board. It helps when the inking plate is heavy or anchored,
    as inks are tacky and can sometimes cause the plate to stick to the brayer. Always
    clean your inking plate immediately after finishing a print run, as dried ink
    on the plate will keep you from getting an even application of ink the next time
    you use it.


    ### PALETTE KNIVES

    An essential tool for preparing ink is the palette knife, or spatula, used to
    scrape ink from its container and spread and mix it on the inking plate. Palette
    knives come in a variety of shapes and degrees of flexibility. If you plan to
    do large print runs, which involves pulling many prints in the same session, a
    wider knife would be appropriate for mixing and spreading large amounts of ink.
    I prefer flexible knives with rounded edges, as I’m less likely to scratch my
    inking surface.


    ![Image](images/f0017-03.jpg)


    ## ESSENTIAL MATERIALS

    In addition to the right tools, every printmaker needs ink and paper. Each type
    of ink yields a different result, and the paper options today are seemingly endless.
    Read on to learn about ink, paper, and a handful of other materials that will
    round out your toolkit.


    ### Inks

    Choosing the right ink is an important part of the print process, and there are
    many considerations to be made. It’s important to use ink that is specifically
    formulated for relief printing, as opposed to just using any old paint or ink.
    Paint will ruin your brayers and blocks. The right inks will extend the life of
    your block as well as look gorgeous on paper.


    ![Image](images/f0018-01.jpg)


    #### WATER-BASED INKS

    Water-based inks are a good choice for beginners and kids, and when you have to
    print in crampled conditions, because they clean up easily with soap and water.
    Also, they are fast-drying, which is nice when you’re short on time or if you
    run a small edition of prints. However, water-based inks tend to have a flaky
    appearance upon drying and are often difficult to roll evenly over the block.


    #### OIL-BASED INKS


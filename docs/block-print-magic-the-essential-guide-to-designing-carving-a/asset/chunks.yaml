    \ little adventure in paper manipulation is a quick and effective project for\
    \ using up any misprints that might be cluttering up your drying rack or studio\
    \ table. When you weave several prints together into one abstract composition,\
    \ the result—turning chaos into order—is always a surprise. When choosing prints\
    \ to combine for this project, I recommend looking for a range of values and textures\
    \ and even colors to give the final result maximum visual variety. Now rummage\

    \ as many different marks, lines, and textures as possible, using as many of your\
    \ tools as possible. Take a moment to consider all the ways you might manipulate\
    \ your tools to create different effects.\n\n    ![Image](images/f0052-04.jpg)![Image](images/f0052-05.jpg)\n\
    \n    6 Using a narrow V tool, carve around the inner border of each blank shape.\
    \ This will help you keep your marks where you want them. Then fill in that same\
    \ shape with a permanent marker. This will make it easier to see your marks as\
    \ you carve.\n\n    ![Image](images/f0052-06.jpg)![Image](images/f0052-07.jpg)![Image](images/f0053-01.jpg)\n\
    \n    7 Carve until all blank areas have been filled with texture. Treat the star\
    \ in the center as a free space where you can create any pattern, texture, or\
    \ design you like to make your print truly your own. If you decide that all that\
    \ work simply wasn’t enough, you can embellish the black areas as well.\n\n  \
    \  8 Use a draftsman duster to brush off all cuttings. A thorough job of this\
    \ will mean a cleaner print down the road.\n\n    ![Image](images/f0053-02.jpg)\n\
    \n    9 Shave a quarter-sized dollop of ink from your tin, and warm it up by spreading\
    \ it on your inking plate with a palette knife.\n\n    ![Image](images/f0053-03.jpg)\n\
    \n    10 Using the largest brayer you have to accomodate the block, roll out the\
    \ ink on the inking plate until you achieve a nice even layer on your brayer.\n\
    \n    ![Image](images/f0054-01.jpg)\n\n    11 Apply ink to your block by making\
    \ several passes with the brayer, returning to the inkwell on your platen as needed.\
    \ Take care not to overink and fill in any fine textures you may have carved.\
    \ Pay close attention to the edges of the block, which can be easy to miss.\n\n\
    \    ![Image](images/f0054-02.jpg)\n\n    12 Place the paper of your choice (Blick\
    \ Masterprinter Paper pictured here) over the block, securing it in place by lightly\
    \ pressing down with your hand. Grip the handle of your baren tightly and rub\
    \ the back of the paper, applying even pressure across the block. You may wish\
    \ to further burnish the back of your paper with a wooden spoon to achieve more\
    \ consistent blacks in the uncarved areas.\n\n    ![Image](images/f0054-03.jpg)\n\
    \n    13 Carefully peel off the paper, and place in a safe area to dry.\n\n  \
    \  TYPES OF LINES TO CONSIDER:\n\n    Straight lines\n\n    Curved lines\n\n \
    \   Swirling lines\n\n    Directional lines\n\n    Long lines\n\n    Short lines\n\

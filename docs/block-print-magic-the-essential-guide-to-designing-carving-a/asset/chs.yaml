  \ 140\n   134. 141\n   135. 142\n   136. 143\n   137. 144\n\n## 引言\n亲爱的读者，\n\n\n\
  \n\n我们即将一起创造些美妙的东西。在这本书中，我将分享制作视觉上引人注目的油毡和橡胶版画的基本技巧和流程。我设计了一系列项目来磨练你的技能并激发你的创造力，其中包括一些有趣的方法来挽救你的失误并让错误获得第二次生命。本书旨在激励、鼓励你，并帮助你建立所需技能，将你所有的精彩想法变为现实。\n\
  \n从未拿起过雕刻工具？没关系——这本书就是为你准备的。在美术课上尝试过版画，并希望更认真地对待你的作品？这本书也适合你！在接下来的页面中，你将找到从工具和材料到良好构图要素等各方面的实用信息。我会向你展示如何制作一些自己的工作室用品，例如简单的上墨板和晾干架。每个印刷项目都旨在专注于特定的技能或多项技能——从基本纹理到多色套印再到彩虹滚印以及中间的一切。我们还将认识来自美国各地的几位版画家，他们慷慨地分享经验和秘诀来帮助我们。无论你的艺术背景或技能水平如何，这里都有适合你的内容。\n\
  \n我作为艺术家的背景是跨学科的：我的根基在于写生的古典绘画和素描，而我是在教育相对较晚的阶段才接触版画。我把雕塑当作创意上的味觉清洁剂，并喜欢为木工项目调整设计。我把刺绣作为一种减压方式来练习。每一种学科都相互影响。画家可以从雕塑家那里学到东西，就像足球运动员可以从芭蕾舞者那里学到东西一样。我最衷心的希望是，你能从我这里学到一些东西。\n\
  \n现在是时候了！感受手中雕刻工具的重量，并体会 *可能性* 带来的颤动感。倾听压墨辊滚开油墨时的轻吻声。让几句精选的脏话随着你的 V 形凿一起脱口而出（嘿，这对我们所有人都会发生）。多犯些错误，扎自己一两次，吸取教训，然后沉浸在你的第一张完美印版中。用你自己的意志力将某物拉入存在。这里有魔法可造。\n\
  \n墨迹团结致意，\n\nEmily\n\n![Image](img/f0009-01.jpg)\n"

  4 按顺序图在网格上完成月光星图案，用永久记号笔涂黑指定区，便于记住雕刻位置。


  ![Image](img/f0052-02.jpg)![Image](img/f0052-03.jpg)


  5 为视觉锚定，涂黑区不雕刻。目标是用尽可能多工具在空白区填入多种标记、线条和纹理。思考工具的不同用法。


  ![Image](img/f0052-04.jpg)![Image](img/f0052-05.jpg)


  6 用窄 V 工具沿空白形状内缘雕刻，保持标记位置。然后用永久记号笔填满该形状，便于雕刻时看清。



  ## 滚筒、压纸工具、板材和刀具


  ### 滚筒

  滚筒是用于将油墨均匀涂抹到雕刻版表面的滚轮。它们有多种尺寸，由硬橡胶或软橡胶制成。硬橡胶滚筒非常适合勾勒精细细节，而软橡胶滚筒能非常均匀地在版面上涂抹油墨。使用软橡胶滚筒在版上涂墨几乎不需要施加任何压力。


  在选择滚筒时请考虑你将要印刷的版块大小。理想情况下，滚筒应略宽于版块的最短边。这将允许均匀涂抹油墨，而不会因滚轮边缘留下任何杂乱的痕迹。滚筒还应光滑，橡胶滚轮上没有任何凸起、凹陷或棱纹，因为这些滚轮上的不完美之处会直接转移到你的印刷品上。使用时请保持滚筒清洁，并在不使用时将其存放，使橡胶滚轮不接触任何东西。


  ![Image](img/f0016-04.jpg)


  ### 压纸工具

  压纸工具是手工拉印成功印刷品必不可少的工具：你用它来在已上墨的版面上擦亮纸张背面。该工具允许你在版面上施加均匀的压力，而不会撕破纸张。最容易获得的（而且毫不夸张地说便宜！）压纸工具就是像我这样简单的木勺（见照片中的
  2）。光滑坚硬的表面其实就是你所需要的！避开金属勺，因为印刷所需的摩擦会使它们变热。握住勺子靠近顶部，将食指和中指的指垫放在勺碗中；这将给你稳定的握持和足够的杠杆来擦亮纸张。


  传统上用于日本木版印刷的压纸工具由构成手柄的竹叶覆盖（见 3）。随着时间的推移，竹子会磨损并需要更换。


  Speedball 品牌的压纸工具（见 1）具有更高的手柄轮廓和柔软的垫子。我发现这非常适合用较软的橡胶版印刷。


  ![Image](img/f0017-01.jpg)


  ### 上墨板

  每位版画家都需要一个上墨板或压板，这是一个干净、光滑、非多孔的表面，用于混合、涂抹和滚开油墨。各种材料都可以用作上墨板，例如金属托盘、金属工作台挂钩、一块带斜边的防爆玻璃，或一块边缘打磨或贴胶的有机玻璃。我只是通过将一块有机玻璃拧在一块同样大小的木板上，就制作了本书中出现的上墨板。当上墨板较重或固定时会有帮助，因为油墨有粘性，有时会使板粘在滚筒上。每次印刷完成后立即清洁上墨板，因为板上干掉的油墨会让你下次使用时无法均匀上墨。


  ### 调色刀

  准备油墨必不可少的工具是调色刀，也称为刮刀，用于从容器中刮取油墨并在上墨板上涂抹和混合。调色刀有各种形状和柔韧程度。如果你计划进行大量印刷，即在同一时段内拉印许多张印刷品，那么较宽的刀就适合混合和涂抹大量油墨。我更喜欢柔韧且边缘圆润的刀，因为这样我不太可能刮伤上墨表面。


  ![Image](img/f0017-03.jpg)


  ### 必备材料

  除了合适的工具外，每位版画家都需要油墨和纸张。每种油墨都会产生不同的效果，而今天的纸张选择似乎无穷无尽。继续阅读以了解油墨、纸张以及几项其他材料，它们将完善你的工具包。


  ### 油墨

  选择合适的油墨是印刷过程的重要组成部分，需要考虑许多因素。重要的是使用专门为凸版印刷配方的油墨，而不是随便使用任何旧油漆或油墨。油漆会毁坏你的滚筒和版块。合适的油墨既能延长版块的使用寿命，也能在纸上呈现出美丽的外观。


  ![Image](img/f0018-01.jpg)


  #### 水性油墨

  水性油墨是初学者和儿童的好选择，也适合在狭小环境下印刷，因为它们可以用肥皂和水轻松清洁。此外，它们干燥速度快，当你时间紧迫或只印少量版次时很方便。然而，水性油墨干燥后往往有片状外观，并且通常难以均匀地滚涂在版块上。


  #### 油性油墨




  ## 油性墨水


  油性墨水有两种：一种需要溶剂清洁，另一种是水溶性/可水洗的。两者都能产生同样丝绒般的质感，并保持强烈的鲜艳色彩。松节油和煤油等溶剂是最有效的油性墨水清洁剂，但毒性相当大。更安全的清洁剂是普通的菜籽油。只需用纸巾充分浸湿后擦拭即可。这往往会在版块上留下残留物，所以我通常会再用消毒湿巾擦拭。我最喜欢的这类墨水是
  Gamblin Relief Ink。


  水溶性油性墨水以植物油为原料。非常无毒，这些墨水色彩鲜艳，具有使覆盖均匀的粘性。它们用肥皂和水或消毒湿巾即可轻松清洁。Caligo Safe Wash Relief
  Inks 是很好的选择，并且本书大部分项目都使用了它。


  ### 墨水改性剂


  有很多种不同的添加剂可以混入墨水中以获得不同的效果。在墨水中加入一滴钴 **干燥剂** 会显著加快印刷品的干燥时间。然而，钴干燥剂毒性相当大，所以请戴手套操作。加入
  **延展剂** 或 **透明基底** 会在不改变其粘度的情况下稀释墨水的颜色——可以把它想成是降低墨水的透明度。


  加入 **缓干剂** 会减慢墨水的干燥时间，如果你喜欢慢慢工作或要印大量作品，这很不错。不过，请记住你也需要让印刷品在晾干架上停留更久。


  ## 纸张


  从技术上讲，你几乎可以在任何平坦表面上印刷，但最便宜、最容易获得且最广泛的表面就是纸张。用手指摩擦一张奢华厚实、精美的纸张时，有一种如此触感丰富、细腻而且纯粹
  *愉悦* 的感觉。幸运的是（对你也是），市场上今天有许多不同种类的纸张。艺术家用纸最常见的成分是木浆、棉麻、纸浆亚麻和桑皮/楮皮——所有这些都是手工印刷胶木版块的绝佳选择。在家学习时使用任何旧纸是可以的，但你会发现你选择的纸张质量越高，印刷品就越好。


  ![图像](img/f0019-01.jpg)


  在实验并决定自己最喜欢什么时，关于纸张有一些有用的知识需要了解。


  ![图像](img/f0019-02.jpg)


  左栏


  Blick Masterprinter 纸，74 gsm


  Yasutomo 日本桑皮纸，71.5 gsm


  Daler Rowney Canford 纸， dreadnought 灰色，150 gsm


  Canson Edition 纸，古董白，250 gsm


  右栏


  Thai Tamarind Leaves 桑皮纸，30 gsm


  Canson Mi-Teintes 绘图纸，编号 502 陶土色，160 gsm


  Stonehenge 纸，暖白色，250 gsm


  BFK Rives 纸，白色，280 gsm。


  ### 无酸与档案级


  理想的纸张应不含木质素，这种存在于木浆中的酸性物质会随着时间推移使纸张变黄并变得脆弱。无酸纸被称为档案级，这基本上意味着它会非常持久。百分之百棉麻纸天然无酸，是一个很好的选择。专业版画家一定会选择档案级、无酸纸，以确保他们的作品能够保存多年。


  ### 重量


  纸张的重量或厚度以每平方米克数（gsm）来衡量。gsm 越高，纸张越厚。在凸版印刷中，你可以根据使用的墨水和版块类型以及希望达到的最终效果使用各种厚度的纸张。较薄的纸张非常适合手工印刷，但有时会缺乏较厚纸张的奢华手感和外观。一些手工纸具有大量纹理，会极大地影响印刷的均匀度。尝试各种各样的纸张，你会逐渐了解哪种最适合你和你的特定项目。


  ### 热压与冷压


  机制纸会经过一系列金属圆筒，这些圆筒被加热并压紧，或被冷却并松散压紧以创造不同的纹理。热压纸表面光滑，具有细腻的纹理。冷压纸表面略带颗粒感，或更具纹理。



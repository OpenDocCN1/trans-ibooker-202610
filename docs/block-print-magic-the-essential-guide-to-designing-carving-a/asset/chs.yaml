  ![Image](img/f0075-03.jpg)

  a. 在叶片上雕刻出一条中心线。


  ![Image](img/f0075-04.jpg)

  b. 在叶片一侧雕刻出一条内边框线。


  ![Image](img/f0075-05.jpg)

  c. 从中心线开始，向下向左倾斜，雕刻叶片左侧的叶脉线，在边缘前停止。


  ![Image](img/f0075-06.jpg)

  d. 从内边框线开始，向中心线方向向上倾斜，雕刻叶片右侧的叶脉线。


  ![Image](img/f0075-07.jpg)

  这里是完全雕刻好的花卉背景。


  ![Image](img/f0076-01.jpg)![Image](img/f0076-02.jpg)

  5 使用轮廓线指南，用铅笔轻轻在骷髅上画出轮廓线。开始雕刻出跟随骷髅轮廓的线条，使用较小的凿子——我使用的是我的 1 毫米 V 形分切工具。


  ![Image](img/f0077-01.jpg)

  6 继续直到骷髅被薄薄的轮廓线覆盖。


  ![Image](img/f0077-02.jpg)

  7 再次进行雕刻，这次使用更大的工具。这里我使用的是我的 4 毫米 12 号 V 形分切工具。将你的刻痕集中在弯曲区域的顶点（最突出之处，如额头和颧骨）。这将有助于减轻这些区域的明度，使其看起来向前移动或更接近观者。


  ![Image](img/f0077-03.jpg)

  8 继续雕刻直到你在形态内实现了明度的范围（深黑、中灰和浅白）。


  ![Image](img/f0078-01.jpg)

  9 组装你的印刷工具并滚出油墨。


  ![Image](img/f0078-02.jpg)

  10 通过在更大的一张纸上描摹版块以及 10" x 10" (25 x 25 cm) 印刷纸的一块，制作一个简单的印刷夹具。这将有助于每张版的印品大致落在同一位置。


  ![Image](img/f0078-03.jpg)

  11 上墨后，将纸张贴到版块上并用焙板用力压实，如有必要，用更坚硬的焙板如勺子抛光区域。


  ![Image](img/f0078-04.jpg)

  12 小心地将纸张从版块上剥离。


  13 将你的印品放在一旁晾干。


  ## 艺术家聚焦：KELLI MACCONNELL


  一位无所畏惧的实验者、自然世界的学生和才华横溢的版画家，来自俄勒冈州波特兰的 Kelli MacConnell 创作了一些自然界最精美标本的亲密肖像。MacConnell
  对树木的精湛描绘赋予了它们超越森林的生命，庄严而高贵，值得敬仰。她的印品唤起自然世界的宁静，并暗示了一种深思熟虑、经过研究的创作方法，提醒我们直接观察往往是最好的老师之一。


  ![Image](img/f0079-01.jpg)![Image](img/f0079-02.jpg)


  ### EH：你是如何对版画产生兴趣的？




  KM：艺术一直是我从记事起就热爱的。多年来我的专注点是风景素描和绘画，直到大学三年级我才发现了版画。我上了一门蚀刻入门课，意外发现版画感觉像是绘画、绘画和雕塑的完美结合，这让我非常兴奋。我感觉自己打开了一扇通往新世界的大门，在那里可以探索艺术创作真正的自发性。在很多方面，版画是一项非常精密的操作，但不可避免地存在不确定性，因为墨水转移到纸上的过程。直到印刷出来，我从不知道一件作品最终会是什么样子。我绝对喜欢在完成雕刻版块后等待我的神秘感、悬念和惊喜。


  ![Image](img/f0080-02.jpg)


  ### EH：是什么特别吸引你使用凸版？


  KM：我发现通过制作胶版画可以实现我想要创作的图形图像。例如，胶版画的色彩区域丰富，且不受木纹的干扰。我被凸版印刷品那种清晰、丝绒般的质感所吸引。


  ![Image](img/f0080-01.jpg)


  另外，这种以某种方式用光作画的行为具有我绝对热爱的内在图形力量。从一开始，减去材料来创作而不是添加东西的想法就吸引了我。在这种版画中，形状是通过雕刻工具在图像中刻出白色或亮部来形成的。正是通过从设计周围和内部去除材料，图像才开始形成。这个过程迫使我解构和抽象我正在使用的风景。对我来说，这比例如用石墨绘制图像要更具挑战性。我喜欢必须仔细思考用线条表现纹理、深度、阴影、流畅性和柔软度，同时在每件作品中尊重明暗平衡（因为我主要以黑白为主）。


  我认为这是一种制作二维艺术作品的雕塑方式。这是一种冥想式的体验，令人非常满足的是看着图像在版块上以三维形式活起来。有些人可能会觉得用小刀和凿子雕刻数小时枯燥乏味，但我觉得这是一种极其平静且具有治疗性的练习。我觉得我几乎在潜意识层面被这个过程吸引。拿起工具的熟悉感令人平静和安心。花时间使用这些工具塑造和创造东西，让我感觉自己是在一个隐蔽的绿洲中度过时光，在那里我可以找到流畅和专注，一个增强感官同时清空头脑的地方。工具变得是我无意识的延伸。当我深陷于这个地方
  \[where\] 切割/雕刻工艺发生的境地时，我沉浸在源自内心情感和创造力的直觉能量中。


  我也很喜欢制作多件作品时的过程和重复的动作模式。我也觉得这个步骤同样令人平静和沉思。正是在这种节奏中，我注意到每件印刷品的美感和细微差别。让它们成为各自独立的存在，并赋予它们各自的个性。


  ### EH：你会如何描述你的作品和/或你的创作过程？


  KM：我会将我的作品描述为图形化的、受自然启发的荒野印象。创作这些作品给我带来快乐，我也希望能让他人与自然世界产生联系。我希望这些印刷品能提醒人们我们建筑、窗户、手机、电脑之外所存在的事物。


  我觉得我们中的许多人都与自然世界脱节了，并忘记了我们的健康会因此受到影响。我相信与自然接触能改善我们的身体、心理和情感健康。人们需要重新与周围的荒野建立联系，然后他们才会感到充实。然后他们将过上更令人满意的生活并感到满足，希望这反过来会促使人们保护土地和世界各地的荒野地区。


  我目前的作品系列通过凸版印刷探索人类与树木及其形态的关系。我创作了我自己的对令我感动的物种的诠释，希望它们能迷住观者并唤起怀旧、惊奇和平静的感觉。这种媒介让我能够剔除不必要的部分，并利用创造性的减法在负空间和正空间之间形成微妙的舞蹈，设计出供沉思和反思的图像和空间。通过简单的对比使用以及线条的操控，我力求创作出受西海岸森林启发的引人入胜的构图。


  我将体验转化为印刷品的过程涉及将草图中的图像反转到浮雕表面，然后雕刻掉负空间或我想要呈现白色的区域。版块完成后，我用滚筒在版块上滚上一层薄薄的墨水，轻轻将湿润的棉麻纸放在已上墨的版块表面，然后通过压印机将其压过，以将图像转移到纸上或在纸上留下图像的印记。我通常出版
  20–100 件的版数。


  ![Image](img/f0081-01.jpg)


  Kelli MacConnell 为 Ford Gallery 创作的 *Giant Redwood* 和 *Vertical Tree Series*


  ### EH：有时候我们对自己的热情有爱恨交织的关系。说说你讨厌版画的一点和你喜欢版画的一点。


  KM：我觉得版画令人沮丧的一点是，有时我感觉创作印刷品的过程和步骤与之前做过的一样，但却得不到我计划或预测的结果；这实际上正是我如此热爱版画的原因。同样地，我喜欢印刷时发生的意外惊喜，我可以从中学习。我想这取决于我是否对那个意外的结果感到兴奋！


  ![Image](img/f0081-02.jpg)


  MacConnell 的 *Juniper* 雕刻版块


  **访问 Kelli 的 [www.kellimacconnell.com](http://www.kellimacconnell.com)。**


  ### 项目：装扮


  有时在设计新印刷品时，我希望有一点色彩点缀，真正让我的构图闪耀。如此小的色彩区域很少值得单独制作一个版，这时我喜欢手工上色。本项目详细介绍了手工绘画和拼贴如何提升原本简单的黑墨印刷品。


  注：通常最好使用更坚固、更厚的纸作为“支撑”纸，将较薄的纸拼贴其上。在本项目中，我在厚重的标签板上印刷，而拼贴元素则印在较轻、带纹理的珊瑚色剪贴簿纸上。


  #### 工具和材料


  10" x 10"（25 x 25 厘米）未装裱的油印胶


  12" x 12"（30.5 x 30.5 厘米）印刷纸


  额外的彩色纸


  踪影纸


  铅笔


  细头永久性记号笔


  雕刻工具


  和纸/遮蔽胶带


  上墨板


  调色刀


  滚筒


  压印工具


  胶水


  丙烯颜料或水彩颜料及调色板


  水杯和毛巾


  小画笔


  美工刀


  自修复切割垫


  ![Image](img/f0082-01.jpg)


  1 设计并规划你的印刷品，标明哪些区域将通过绘画或拼贴上色。因为这个设计中央有一只黑色的乌鸦，我计划在花卉背景中上色——手工绘制蓝莓并拼贴花蕾。


  ![Image](img/f0083-01.jpg)


  2 使用你选择的方法将设计转移到版块上，并用细头永久性记号笔固定住绘画。


  ![Image](img/f0083-02.jpg)


  3 开始雕刻背景，先用小 V 形凿雕刻轮廓以保护细节（我使用的是 Pfeil 1 毫米 No. 12 V 分割工具），然后清理负空间。




  ## 雕刻过程


  ![Image](img/f0083-03.jpg)


  4 清除负空间后，开始雕刻花卉。注意花蕾已从构图中消失。它们将单独在不同纸上印刷。


  ![Image](img/f0084-01.jpg)


  5 在乌鸦身体上，使用有意的、方向性的线条突出羽毛的轮廓。一条直线可以暗示平坦的平面，而一条曲线则暗示弯曲的平面（使用你在《轮廓线骷髅》项目中获得的知识，该项目展示于这里）。用粗记号笔[content]

  ## 雕刻过程


  ![Image](img/f0083-03.jpg)


  4 清除负空间后，开始雕刻花卉。注意花蕾已从构图中消失。它们将单独在不同纸上印刷。


  ![Image](img/f0084-01.jpg)


  5 在乌鸦身体上，使用有意的、方向性的线条突出羽毛的轮廓。一条直线可以暗示平坦的平面，而一条曲线则暗示弯曲的平面（使用你在《轮廓线骷髅》项目中获得的知识，该项目展示于这里）。用粗记号笔涂过雕刻区域有助于检查你的作品，并了解印版印刷时会是什么样子。


  ![Image](img/f0084-03.jpg)


  6 使用 1 毫米 V 型刻刀的小而短的笔触，雕刻乌鸦身体羽毛的暗示。这会使其看起来像是羽毛正在捕捉光线，并使形态更具体积感。一旦印版完全雕刻完成，将其放在一旁。


  ![Image](img/f0084-04.jpg)


  7 设计需要八朵较大的花和七个小花蕾。将较大花朵和小花蕾的设计转移到一块废弃的未装裱油印胶板上并雕刻它们（由于构图中重复出现，你每个只需要一块）。现在我们准备好印刷了！


  ![Image](img/f0084-02.jpg)


  ### 雕刻乌鸦的爪子


  ![Image](img/f0085-01.jpg)


  ## 印刷过程


  8 使用大张纸或一块废纸板搭建一个简单的印刷夹具。描出你的印刷纸模板（12" x 12" \[30.5 x 30.5 cm\] 方形）。将印版置于中央并描出其轮廓。


  ![Image](img/f0085-02.jpg)


  9 由于设计是圆形的，我已标明顶部，以便版样中每张印刷品的方向完全相同。用记号笔在印版顶部做一个标记，并将该标记延伸出印版到印刷夹具上。每次放置印版时，确保这些标记对齐。


  ![Image](img/f0085-03.jpg)


  10 在上墨板上涂抹少量黑色油墨并辊开。涂到印版上。


  ![Image](img/f0085-04.jpg)


  11 小心地将一张印刷纸铺在印版上，用擦墨刀压印，如有必要，可用更坚实的擦墨刀或勺子勾出精细细节。


  ![Image](img/f0086-01.jpg)


  12 轻轻将印品从印版上揭开，检查是否有遗漏的区域。将完成的印品放在一旁晾干。


  ![Image](img/f0086-04.jpg)![Image](img/f0086-02.jpg)


  ## 完成


  13 取出小花印版并上墨。你可能想为此使用较小的滚墨器，除非你不在意弄脏！


  ![Image](img/f0086-05.jpg)


  14 从印版上去除多余油墨并清洁所有工具和表面。在进行下一步之前让印品晾干。


  ![Image](img/f0086-03.jpg)


  15 我们可以开始装饰现在已干的印品，从绘画开始。用画笔在调色板上混合颜料，直到得到你想要的颜色。我建议使用水彩或珂乐颜料，并在开始在印品上作画前先在废纸上测试颜料。注意不要让画笔沾上太多颜料或水，小心地将每颗蓝莓涂上颜色。如果你使用油性油墨印刷，你会注意到颜料自然排斥油墨，使其更容易保持在轮廓内。绘画完成后，清洁材料并将印品放在一旁晾干。


  ![Image](img/f0086-06.jpg)![Image](img/f0087-01.jpg)


  16 使用美工刀和自愈切割垫或其他切割表面，小心地剪出八朵大花和七个小花蕾。使用时务必时刻注意刀片，切勿直接朝身体拉动。未使用时请盖上刀帽。


  ![Image](img/f0087-02.jpg)


  17 参考原始绘画作为地图，显示花朵的放置位置。将胶水涂在每朵花的背面，将其放置在印品上，并用（干净的）手指或（干净的）铅笔的（干净的）橡胶端压实。对每朵花和花蕾重复此操作。全部粘贴后，将印品放在一堆重书下，以防止胶水凝固时翘曲。


  18 根据你的版数重复操作。


  ![Image](img/f0087-03.jpg)


  ### 最终成品，稍作修饰


  ## 项目：单页口袋小志


  印刷术最伟大的遗产之一在于其推动知识民主化的作用。约翰内斯·古腾堡于 1436 年发明的活字印刷机使欧洲印刷品的生产速度加快；书籍变得更易获得，工人阶级获得了识字能力。鉴于这一历史，我们在油印胶板印刷品中省略文字就说不过去了。


  印刷术的吸引力之一在于几乎无限的复制潜力，因此它是制作你自己的小志进行分发的完美媒介。小志是一种自出版、发行量小的书籍或杂志，通常是影印并手工装订。对于本项目，你将使用一张标准美国信纸尺寸（或
  A4）纸制作你自己的手工装订和手工印刷小志。


  ### 工具和材料


  8 1/2" x 11" (21.5 x 28 cm) 未装裱油印胶板


  绘图纸


  描图纸


  铅笔


  和纸胶带/遮蔽胶带


  雕刻工具


  油墨


  滚墨器


  上墨板


  调色刀


  擦墨刀


  剪刀


  ![Image](img/f0088-01.jpg)


  小志最初在 1930 年代作为科幻迷杂志出现，随着 *星际迷航* 的兴起再次流行，随后迅速传播到音乐界。1970 年代和 1980 年代复印店的普及以及朋克音乐的
  DIY 美学导致小志的创作和交易因更快捷、更便宜的分发而扩展。如今的小志在尺寸、风格和内容上差异很大。


  #### 制定计划


  决定你的小志要关于什么，然后开始设计和规划每一页。请记住，我们只有六个可用的“内容”页——你总共有八页，但其中两页是封面和封底。每页最终尺寸为 4 1/4" x
  2 3/4" (10.8 x 7 cm) 且为竖向。


  想不出点子？以下是一些能激发你思维的潜在标题。


  我确知的事


  一个简单的食谱


  一首关于希望的六行诗


  一首关于分手的六字诗


  一句忠告


  一封写给我的黑粉的信


  我喜欢你的地方


  我希望我当时说的话


  如何与婴儿交朋友


  我撒过的谎


  最喜欢食物清单


  公共服务公告


  我的狗会说的话


  ![Image](img/f0089-01.jpg)


  图 1


  1 拿一张 8 1/2" x 11" (21.5 x 28 cm) 的纸。沿长度方向折一次（像热狗面包），再沿宽度方向折一次（像汉堡面包），然后再次（汉堡）折一次，如图
  1 所示。


  展开纸张。你应该得到八个相等的矩形，每个尺寸为 4 1/4" x 2 3/4" (11 x 7 cm)。


  将纸张以横向方向放置，按图 2 所示标记封面和页面。纸张上半部分的矩形将是倒置的，下半部分的矩形将是正向的。


  ![Image](img/f0089-02.jpg)


  图 2


  2 使用你选择的转印方法将你的绘画转印到印版上（参见转印方法，展示于这里）。


  ![Image](img/f0089-03.jpg)


  3 仔细检查印版上显示的文字是否倒读，然后用记号笔在印版上着墨。


  ![Image](img/f0090-01.jpg)


  4 雕刻出负空间。




  5 将约一枚四分之一大小的油墨团铺在你的调墨板上。如需，可加入一滴钴干燥剂。用调墨刀将油墨摊开或将钴干燥剂混入，使其变暖。用滚筒将其滚至均匀的稠度。


  6 小心地将油墨滚到版块上，注意不要用滚筒碰到大面积的空白区域。


  7 将版块边缘与纸张边缘对齐，并将纸张牢牢压在版块上。版块在下、纸张在上，固定纸张的同时用吧仁施加均匀、坚实的压力。


  ![图片](img/f0090-02.jpg)


  8 将吧仁放下，小心地将纸张从版块上剥离。将纸张放在一旁晾干。


  9 打印所需数量，清洁所有材料，并将印品放在一旁晾干。


  ![图片](img/f0091-01.jpg)


  10 待所有页面完全干燥后，你可以将其装订成小册子。就像你在图 1 之后用原始草图纸所做的那样，将纸张沿长度方向对折（热狗式）。


  ![图片](img/f0091-02.jpg)![图片](img/f0091-03.jpg)


  11 再沿宽度方向对折一次（汉堡式）。


  ![图片](img/f0091-04.jpg)


  12 再对折一次，然后将纸张重新展开。


  ![图片](img/f0092-01.jpg)![图片](img/f0092-02.jpg)


  13 将纸张沿宽度方向对折，然后用一对剪刀小心地仅沿中间页之间的折痕剪开。不要把纸剪成两半！


  ![图片](img/f0092-03.jpg)![图片](img/f0092-04.jpg)


  14 将纸张重新展开并沿长度方向重新折叠，使纸张的印刷面朝外。


  ![图片](img/f0092-05.jpg)


  15 用手指捏住纸张的两端，将双手推向一起，使切口张开，中间的页面弹出。


  ![图片](img/f0093-01.jpg)


  16 打开一端并将内部页面推入封面内。


  ![图片](img/f0093-02.jpg)


  17 合上，确保封面在外侧


  ![图片](img/f0093-03.jpg)


  18 对所有印品重复此操作，然后恭喜自己。你刚刚自出版了自己的小志！


  ## 项目：多版块六角星


  六角星——也称谷仓星，但不要与谷仓拼布混淆——是宾夕法尼亚州乡村景观中随处可见的一部分，装饰在谷仓的立面和山墙上。这些引人注目的、完美平衡的圆形设计是宾夕法尼亚荷兰人，即
  1700 年代初移民到美国的德国移民带来的民间艺术传统的一部分。采用旋转对称或平行反射对称，当代六角星常融入象征性母题：星星和蔷薇代表好运，郁金香代表信仰，小麦束和雨滴代表丰收，橡叶代表品格力量等。


  ## 工具与材料


  三块 6" x 6" 15 x 15 cm 未装裱的软木

  三块 7 1/2" x 9 1/2" 19 x 24 cm 坚硬的夹板或裱板

  木胶

  铰链式定位装置

  铅笔

  尺子

  多种颜色的永久性记号笔

  至少两张描图纸

  绘图纸

  圆规

  雕刻工具

  三种颜色油墨

  调墨板

  调色刀

  滚筒

  9" x 12" 23 x 30.5 cm 印刷纸

  巴伦

  遮蔽/和纸胶带


  ![Image](img/f0056-01.jpg)


  我的六角星以八角蔷薇为主元素，加入雨滴、波浪边框和注视的眼睛。你可以用对你有意义或 pleasing 的符号和颜色设计自己的图案。


  本项目将使用 **多版块技术**，三个不同颜色上墨的独立版块的印痕将形成三色印刷。记住你可以用自己选择的颜色随意实验。多版块印刷如果第一次做会有一点棘手，但请耐心对待自己，仔细测量，我们就能做出干净的作品！多版块印刷的关键是规划，从设计开始。


  ![Image](img/f0057-01.jpg)


  1 首先处理一些准备工作：每块未装裱的软木必须粘在一块 7 1/2" x 9 1/2" 19 x 24 cm 的板上，才能在铰链式定位装置中正常工作。我用的是夹板，你也可以用裱板或致密硬纸板。用尺子将版块居中放在夹板上，测量越精确越好，用木胶粘牢。放在重书堆下确保完全粘合。对其余两块重复。
  在每块板的底部用遮蔽胶带加一个标签，便于从装置中取出。


  ![Image](img/f0057-02.jpg)


  2 等待版块粘合时，规划设计。我通常先做简单的线稿，然后做全彩草图。然后我将颜色视觉分离，以便看到版块应有的样子。


  ![Image](img/f0057-03.jpg)



  #### 关于粘合剂的说明


  本书中的多个项目需要将纸张粘合在一起，使用错误的粘合剂会对印刷品的命运造成灾难性的影响。一些胶水会导致纸张翘曲、起皱、变黄和劣化。然而，PVA 胶水无酸，不会随时间变黄。它们干燥后透明且保持柔韧。Yes
  Paste 和 Nori Paste 都是不错的选择，因为它们干燥缓慢（给你更多时间定位作品），并且不会导致纸张过度起皱。


  ![图像](img/f0021-02.jpg)


  #### 印刷工作室的结构


  现在所有材料都已整理好，下一个挑战是找到一个可以完成所有工作的空间。我在家里布置工作室时想起了约瑟夫·坎贝尔的以下名言：


  *“\[一个神圣的地方\] 对今天的任何人来说都是绝对必要的。你必须有一个房间，或每天某个时段，在那里你不知道早上报纸上有什么新闻，你不知道你的朋友是谁，你不知道你欠任何人什么，你也不知道任何人欠你什么。这是一个你可以单纯体验并展现你是什么以及你可能成为什么的地方。这是创造性孵化的地方。一开始你可能会发现那里什么也没发生。但如果你有一个神圣的地方并使用它，最终总会发生一些事情。”*


  ![图像](img/f0022-01.jpg)![图像](img/f0022-02.jpg)


  工作室与政治、账单以及整天轰炸我的无数琐碎担忧截然不同。那是一个魔法的栖息之地——我只需要出现并激活它。但首先我必须邀请魔法进来。我自己的简陋空间拥有一个 awkward
  的 L 形布局，配有大量自制设备，点缀着太多纸张堆。但对我来说，它就是人间的天堂。你不需要一个能与罗德岛设计学院相媲美的工作室，也不需要让玛莎·斯图尔特因嫉妒而面色发绿。你的创意空间——无论是单独的房间、壁龛，还是只是临时的桌面——的主要目标是让印刷过程尽可能高效、舒适且富有灵感。


  ![一个简单的设置](img/f0023-01.jpg)


  潜在的桌面布局


  高效的工作室布局始于对你将要进行的活动的考虑，就我而言，是制作印刷品的基本步骤：


  设计草图


  雕刻版块


  上墨


  印刷


  干燥


  储存




  The whole point of the studio is to be a space that is exclusive to artmaking, but
  sometimes you don’t have the luxury of having a whole room to yourself. The good
  news is that all you really need is one good-sized tabletop and a few key pieces
  of equipment. When planning your space, consider the following needs.


  ### 1. Clean space

  For drafting designs, preparing printing papers, and carving blocks and signing
  prints. Keep this area completely free of ink in order to preserve the cleanliness
  of your papers. It would be sad to pull a five-color print only to ruin it with
  a big stray ink smudge picked up from the table!


  ### 2. Dry space

  A place to keep your wet prints as you pull them. DIY drying rack plans can be found
  shown here.


  ### 3. Print space

  This is the area where you’ll print your inked blocks. I like to cover this area
  with butcher paper and tape it down to the table for easy cleanup after a project.
  This is also where you will put any registration device/printing jig (see here)
  you may be using for your project. Keep a mini-clean zone above the jig so that
  there’s a safe place to stack your prepared papers.


  ### 4. Ink space

  For making a mess! This is where your inking plate lives for mixing, rolling out,
  and applying ink to blocks. On one of my studio tables, I have a large sheet of
  plexiglass screwed directly into the tabletop as a permanent ink surface.

  Underneath the shelf are hooks for hanging my brayers, which further help to corral
  the ink. Hanging brayers keeps the rubber roller from becoming dented or otherwise
  damaged over time. I also keep all of my essential ink cleaning supplies within
  easy reach: a roll of paper towels, a container of cotton swabs, disinfectant wipes,
  mat board strips, gloves, baby oil, a stack of old magazines, and a garbage can,
  which is tucked under the table.


  ![Image](img/f0024-01.jpg)![Image](img/f0023-02.jpg)![Image](img/f0024-02.jpg)

  Blocks that have already been printed, cleaned, and dried are stacked in milk crates,
  with titles visible for easy access


  ![Image](img/f0025-01.jpg)

  A second station, ready for printing


  ![Image](img/f0025-02.jpg)

  Inks, brayers, and other tools organized on a shelf above my worktable


  ![Image](img/f0025-03.jpg)

  When I’m not pulling by hand I use my Richeson Medium Etching Press. Though expensive
  and bulky, pulling prints with a press takes a lot of the physical gruntwork for
  you.


  ### MAKE IT: TIGHTROPE DRYING RACK

  One of the most challenging aspects of working in a small space is finding a convenient
  place to store prints as they dry. This tabletop drying rack is a cheap alternative
  to specialty racks. It takes under an hour to build and requires no special skills
  or equipment. Have your board and copper pipes cut to size at your local hardware
  store. Be sure to sand off any rough edges before you begin, and remember to observe
  basic studio safety procedures.


  ![Image](img/f0026-01.jpg)


  #### Tools and Materials

  Ruler

  Pencil

  Drill

  3/4" (2 cm) Phillips head screwdriver bit

  1/8" (3 mm) drill bit

  Two 1/2" (1.3 cm) floor flanges

  Two 1/2" (1.3 cm) nipples

  3/4" (2 cm) wood screws, Phillips head

  Birch plywood board, 11 1/2" x 28" (29 x 73.5 cm)

  Two 16" (40.5 cm) long pieces of 1/2" (1.3 cm) wide copper pipe

  32" (81.5 cm) of heavy-duty picture hanging wire

  15 small bulldog clips

  Steel wool


  ![Image](img/f0026-02.jpg)


  #### MAKE IT!

  1 Make a center mark at the end of your board 5 3/4" (14.5 cm) along the shortest
  end.

  2 Come in 3/4" (2 cm) from the center mark on the edge and make another mark. Repeat
  on the other end of the board.

  3 Lay one of your floor flanges on the board as shown, centering one of the holes
  over your 3/4" (2 cm) mark. Make marks in the remaining three holes.

  4 Remove the flange. Use each of the marks to drill pilot holes with your drill
  and 1/8" (3 mm) drill bit. This will keep your board from splitting.


  ![Image](img/f0027-01.jpg)


  5 Replace the flange. Screw in place with four 3/4" (2 cm) wood screws.

  6 Repeat steps 3 to 5 on the other end of the board.

  7 Insert 1/2" (1.3 cm) nipple into each flange and screw in tightly.


  ![Image](img/f0027-02.jpg)


  8 Take one of the copper pipe pieces. Measure and make a mark 1/2" (1.3 cm) from
  the end of the pipe. Holding the pipe steady with one hand, use your electric drill
  with a 1/8" (3 mm) drill bit to perforate two holes in the end of the copper pipe.
  Clean off any rough bits with steel wool.

  9 Repeat step 8 with the second piece of pipe.

  10 Take one of the copper pipes and attach the end without the hole onto the nipple
  set inside the flange. This may take a little bit of elbow grease and/or vise grips
  if you have them. Make sure that, as you screw it in, the two holes going through
  the top of the pipe are parallel with the grain of the board.

  11 If you mark up or marr the pipe as you install them, a quick rub with steel wool
  will tidy them right back up.

  12 Take your length of wire and thread it through one of the pipes. Tie a knot on
  the outside, trimming any excess wire (can be done with scissors or wire cutters).

  13 Thread 15 small bulldog clips onto the wire.


  ![Image](img/f0027-03.jpg)


  14 Thread the other end of the wire through the opposite pipe, pull gently until
  taut, and then wrap the excess wire around the pipe, twisting the wire to secure
  in place.

  15 Install your finished drying rack in your studio space and proceed to fill it
  with gorgeous, handmade prints!


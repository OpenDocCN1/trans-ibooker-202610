  - Ironing board




  ### 水溶性织物标记笔


  #### 印刷工具和材料

  - 墨水

  - 巴伦

  - 上墨板

  - 调色刀

  - 滚筒


  ![Image](img/f0122-01.jpg)


  #### 在织物上印刷的注意事项

  要在织物上获得均匀的印刷效果，你可能会发现先在印刷表面铺上一条毛巾很有帮助，这样可以增加缓冲。

  织物越有齿感或越粗糙，你的印刷效果就越不均匀。

  为了获得最佳效果，请使用专门配制用于织物的墨水——考虑其永久性和溶解性。Speedball 推出了一系列很棒的织物木版印刷墨水，但我最喜欢使用的是 Gamblin
  浮雕墨水——尤其是 Gamblin Textile Ink。这两种墨水都是油性的，因此都可以反复清洗而不会晕染或失去强度。

  在织物上印刷前，请先在纸上做几次测试印刷——这有助于预先上墨，使印块完全充满墨水。

  热定型：请查看墨水产品信息，了解是否需要热定型墨水使其永久固定。

  让织物上的印刷完全干燥后再操作——否则有弄脏墨水的风险。为了加快干燥时间，你可以在印刷前将钴干燥剂加入墨水中（戴手套！）并将风扇对准干燥架。


  ![Image](img/f0123-01.jpg)![Image](img/f0123-02.jpg)


  1 将一块干净的 1/2 码（45.5 厘米）未漂白棉帆布熨平，然后对半剪开。一半将用作你的墙挂底座，另一半用于实验和印刷额外元素。我将中央印块的设计保持简单，以便留出即兴发挥的空间，并将其印刷在帆布中央。


  ![Image](img/f0124-01.jpg)


  2 每当我可以时，我都喜欢重新利用之前项目的印块，因此我在多余的帆布上印刷了几个来自拼图印块项目的额外手部（见此处）并将其剪下。为了保持织物边缘锋利、干净且不散边，在剪裁织物之前，先用液体防散边剂沿着图像的周边“描摹”。干燥后，就像印刷在纸上一样剪出形状。（警告：液体防散边剂可能会导致水溶性墨水晕染，因此请务必先测试。）


  3 将较小的织物片连接到较大的织物上称为贴布绣。传统上，贴布绣是通过缝合将碎片缝合在一起，但在这里我使用了名为 Liquid Stitch 的永久性织物粘合剂。


  ![Image](img/f0124-02.jpg)


  4 放置好手部后，我的设计主体就完成了。使用水溶性标记笔，我在图像周围画出一个横幅形状并将其剪下，四周留出额外的空间用于包边。


  5 要包边一块织物，只需将边缘折叠一次，再折一次，然后穿过所有层缝合即可。


  ![Image](img/f0125-01.jpg)


  6 将横幅的顶部边缘包边，缝合靠近第一道折痕处，以便留出一个狭窄的袖口供木质圆棒滑入。


  ![Image](img/f0125-02.jpg)


  ### 刺绣快速入门

  刺绣是一种美化织物表面的精美手工装饰方式：我喜欢把它看作是用线作画。虽然有些人认为这是一项繁琐的任务，但我发现刺绣练习非常放松且具有冥想性。携带进行中的作品非常方便和快捷，你可以在有空闲片刻时随时拿起来。

  以下是三种可用于装饰织物的针法。


  ![Image](img/f0125-03.jpg)


  **Running stitch:** 小而均匀的针脚进出布料，看起来像点线；一组用于填充背景的回针称为 **seed stitches.**


  ![Image](img/f0125-04.jpg)


  **Split stitch:** 一种锁链针，针头穿过前一针脚；看起来像一条不间断的线


  ![Image](img/f0125-05.jpg)


  **Satin stitch:** 长而直的针脚平行且紧密排列以填充空间


  ![Image](img/f0126-01.jpg)


  7 为了准备你的墙挂进行手工装饰，将其放入刺绣绷中。绷由两个圆圈组成，一个较小的圆圈装入稍大的圆圈内并带夹子。将小圆圈放在织物下方，大圆圈放在上方，将织物夹在两个圆圈之间。轻轻拉紧织物使其像鼓面一样绷紧，然后拧紧夹子将其固定在原位。


  ![Image](img/f0126-02.jpg)


  8 我从设计的外环开始刺绣，使用缎面针法，用多种颜色的平行针脚填充空隙。


  ![Image](img/f0127-01.jpg)


  9 我在花卉荚的中心添加了更长的缎面针脚（金线）。一组回针组成了籽绣，用于背景填充。


  ![Image](img/f0127-02.jpg)


  10 根据设计需要适时重新定位绷子。


  ![Image](img/f0127-03.jpg)


  11 刺绣完成后，将织物从绷中取出平铺熨平皱纹。将 14 英寸（35.5 厘米）的圆棒滑入包边时你制作的袖口中（商店购买的帆布横幅通常已配备悬挂五金件）。使用一根麻绳、黄麻绳或任何其他结实的绳子在圆棒的两端系好以便悬挂。


  ## 第五章

  '
- '## 物尽其用

  我从来就不太在意完美。对我的灵魂来说呼声最大的艺术作品总是那些艺术家手迹清晰可见的作品。我喜欢在每件我接触的作品中寻找走样的痕迹、裂纹、奇特的比例和奇怪的颜色组合，因为对我来说，“错误”正是某件艺术作品中魔法的支点。*Kintsugi*
  是日本用特殊的金、银或铂金漆细心修复破损陶瓷的艺术——本质上是突出一个错误并将其变成闪闪发光且特别的东西。这些最终项目是放下失败、拥抱印刷不完美本质的练习。


  ![Image](img/f0128-01.jpg)


  #### 项目：弗兰肯斯坦的怪物

  就像玛丽·雪莱的 *Frankenstein* 中的怪物一样，这个项目专注于重新利用失败印刷中有趣且有用的部分来创造全新的、完全出乎意料的东西。这是一个实验和玩乐的绝佳机会：因为你将使用的印刷品不适合做成限量版，因此它们没有珍贵性。这意味着你完全摆脱了最初的意图以及事物“应该”看起来如何。所以利用这种自由真正发挥你的创造力；例如，如果你通常整洁、有条理且井然有序，请尝试以狂野的表达方式来处理这个项目。我建议在实验室里扮演疯狂科学家。剪开东西、移动它们、放开音乐，并凭直觉工作。当你找到一种排列或搭配让你自己说
  *oh that’s interesting* 时，就跟随那股思路无论它带你去哪里。不要对自己被新想法洪流席卷感到惊讶。


  ##### 工具和材料

  - 一小叠失败的印刷品

  - 一张 8 英寸 x 10 英寸（20.5 x 25.5 厘米）重磅标签板纸

  - 可重新定位粘合剂

  - 胶水刷

  - 剪刀或美工刀

  - 可选：针线或缝纫机

  - 可选：描图纸

  - 可选：绘画套装

  - 可选：雷暴


  ![Image](img/f0130-01.jpg)![Image](img/f0131-01.jpg)


  1 由于这是一个涉及纸张分层的拼贴作品，背景是首要考虑因素。我使用了来自 Texture Quilt 的一张印刷错误（见此处）。




  2 我将构图裁切成四个 3" x 4"（7.5 x 10 厘米）的矩形，旋转它们，然后拼合在一起，形成一个 6" x 8"（15 x 20.5 厘米）的纹理和明暗区域，作为背景的基础。将它们粘贴在坚固的背景纸上，例如厚重的标签板纸。


  ![Image](img/f0131-02.jpg)


  3 作为对弗兰肯斯坦怪物在大多数电影改编中使用的标志性缝线的致敬，我将印品送入缝纫机，将背景的各个部分缝合在一起。如果喜欢，也可以用手工缝纸达到类似效果。


  ![Image](img/f0132-01.jpg)


  4 根据你认为最具视觉趣味的部分裁剪其他错印的碎片。我喜欢在拼贴中使用多种纸张，但描图纸很有趣，它是一种相对模拟的方式来调节背景的透明度。


  ![Image](img/f0132-02.jpg)


  5 开始拼贴元素时使用可重新定位的胶水，例如 Nori Paste——这将允许你在过程中进行修改。


  ![Image](img/f0132-03.jpg)


  6 我以 Puzzle Block Print 中的手（显示于此处）作为构图的基底，并使用层叠的描图纸碎片在图像内创造另一个空间。思考如何让观众的视线在构图中移动。


  ![Image](img/f0132-04.jpg)


  7 我裁剪了我 2016 年版画 *Pencils* 的错印碎片，将它们排列在描图纸形状所形成的区域内。描图纸减弱了背景的“噪点”，使铅笔不会在视觉上丢失。


  ![Image](img/f0133-01.jpg)


  8 你可以进一步为你的印品注入生命——不是通过闪电的电荷，而是通过绘画！使用水彩或广告水彩为构图增添色彩，并突出你希望观众看到的部分。


  ![Image](img/f0133-02.jpg)![Image](img/f0133-03.jpg)


  9 拼贴之美的一部分在于混乱，但没有人喜欢凌乱的边缘。只需将你独一无二的拼贴印品装入衬板，即可轻松整理其呈现效果。


  ## 项目：编织印品


  这项纸张处理的迷你冒险是快速而有效的使用掉可能堆满你的晾架或工作室桌面的任何错印的项目。当你将几张印品编织成一幅抽象构图时，结果——将混乱变为秩序——总是令人惊喜。在为本项目挑选要组合的印品时，我建议寻找明暗、纹理甚至色彩的多样性，以赋予最终成果最大的视觉变化。现在翻翻你的废弃堆吧！


  ### 工具和材料

  3–4 张失败的印品

  剪刀

  尺子

  铅笔

  可选但有帮助：切纸刀

  胶带


  ![Image](img/f0134-01.jpg)


  1 选择一张“底”印品——这将是所有其他印品编织进去的印品。为了便于裁切，我建议选择一张边缘非常清晰、笔直的印品。


  ![Image](img/f0134-02.jpg)


  2 使用尺子、铅笔和剪刀或切纸刀，将底印品裁切成宽 1"（2.5 厘米）的条带，从图像边缘开始裁。裁到图像末端时停止，刚好进入纸张的边距——不要再继续裁切，因为你希望底印品保持完整。


  ![Image](img/f0135-01.jpg)


  3 将剩余的错印裁切成宽 1"（2.5 厘米）的条带。它们将被编织进底印品中，按指示交替每一条。


  ![Image](img/f0135-02.jpg)


  4 取一条 1"（2.5 厘米）的纸条，将其编织进底印品中，把纸条一直滑到裁切在边距处停止的位置。


  ![Image](img/f0135-03.jpg)


  5 继续编织其他条带，将每一条紧紧推靠在前一条上。


  ![Image](img/f0136-01.jpg)


  6 一旦到达原始图像的边缘，就停止编织条带。


  ![Image](img/f0136-02.jpg)


  7 翻过来并用胶带将条带固定住。


  ![Image](img/f0136-03.jpg)


  8 修剪多余的条带长度。


  ![Image](img/f0136-04.jpg)


  9 修剪印品正面超出原始边框的任何条带。


  ![Image](img/f0136-05.jpg)


  10 为了获得整洁的呈现，紧密贴合的衬板可以隐藏任何不完美的边缘。*瞧！* 你拥有一张独一无二的印品，具有多种纹理，既有模拟的（来自你的裁切），也有真实的（来自编织的纸张）。

  '
- '## 术语表


  **Additive:** 通过添加元素来构建形态的雕塑方法。


  **Appliqué:** 将较小的布片连接到较大布片表面。


  **Artist’s proof (AP or A/P):** 从版数中预留给艺术家使用的印品。


  **Baren:** 一种光滑、圆形的垫子，扁平或略微凸起，用于在纸张置于已上墨的版块上时，对纸背施加压力。


  **Bench hook:** 一块木制或金属板，板的两侧有凸起的唇边，用于在桌面上工作时固定木块或油毡块。


  **Block:** 一块厚实的平板材料（通常为木材、橡胶或油毡），表面雕刻有图案，用于印刷重复的印痕。


  **Blockbook printing:** 在单个版块内结合图像和文字。


  **Brayer:** 带手柄的硬质或软质橡胶辊，用于均匀涂抹油墨并直接涂在版块上。


  **Burnish:** 擦拭或抛光。


  **Burr:** 可能在刀刃边缘形成的金属粗糙部分。


  **Depth:** 从近到远的表观距离。


  **Edition:** 由同一版块制作的一组相同的印品，并进行编号和签名。 **Limited edition:** 数量有限的一组印品。 **Open edition:**
  数量无限的一组印品。


  **Embroidery:** 用针线装饰布料


  **Hem:** 将布料边缘翻折并缝合。


  **Inking plate:** 任何用于涂抹和滚开油墨的表面。


  **Mood:** 艺术作品的整体感受。


  **Noise:** 印品上因油墨接触到版块上先前雕刻的区域而产生的额外痕迹；噪点可以是有意的也可以是无意的。


  **Print:** 由版块制作的每一份单独的复制品或印痕。


  **Printing jig:** 用于印品套准的导向工具。


  **Reduction cut:** 一种色彩印刷方法，反复使用同一版块，每增加一层颜色就雕刻掉更多部分。


  **Registration:** 版画家使用的任何系统，以确保每次印刷时版块和纸张都在同一位置，通常涉及将两个或多个版块对齐到单幅图像上。


  **Relief:** 雕塑技法，将元素雕刻到表面使其从背景中凸出。该术语源自拉丁语动词 *relevo*，意为抬起。


  **Relief print:** 从雕刻版块上印制印品的过程，油墨沉积在剩余的（未雕刻）区域。


  **Running stitch:** 小而均匀的针脚穿梭于布料进出，形成点线外观。


  **Satin stitch:** 长而直的刺绣针脚，平行且紧密排列以填充空间。


  **Seed stitch:** 用于背景填充的短而直的刺绣针脚。


  **Space:** 构图中物体内部、周围或之间的区域。 **Negative space:** 物体/主体周围的区域。 **Positive space:**
  物体/主体占据的区域。


  **Split stitch:** 一种刺绣链针，针线穿回前一针脚，使其呈现不间断的线条外观。


  **Subtractive (reductive):** 通过去除材料来展现形态的雕塑方法。


  **Test print:** 从版块上拉出的第一张印品，用于确定印刷过程中的变量。




  **纹理（或触感）：** 物体所暗示的物理粗糙度或光滑度。


  **统一性：** 当整体构图感觉完整和谐时。


  **明暗：** 或图像中明显的明暗范围。



  ![Image](img/f0059-03.jpg)


  11 现在你将把设计从第一个版块转移到第二个版块。打开窗口并取下主版。用第二个装好的版块替换它，并标记顶部。


  12 关闭窗口并再次摩擦描图纸的背面，将设计再次转移到版块上。


  ![Image](img/f0059-04.jpg)


  13 打开窗口，取下第二个版块，放在一旁晾干。用最终版块重复步骤 12，并标记顶部。放在一旁晾干。（我让它们过夜晾干。）


  14 清除主版上的多余墨水并放在一旁晾干。取下窗口上的已印刷描图纸并丢弃。


  ![Image](img/f0060-01.jpg)


  15 取出现在已干的第二个版块。这将是黄色版块。以版块上转移的图像为指导，徒手描绘黄色元素。或者，你可以回到你的主稿，描出黄色元素，然后以这种方式转移。你不必担心清洗这个版块上的墨水，因为你会把大部分已上墨的部分都刻掉。


  16 刻掉所有负空间——除了你想要印成黄色的部分之外的一切。标记后将雕刻好的版块放在一旁。


  ![Image](img/f0060-02.jpg)


  17 取出最终版块并描绘所有粉色元素。


  18 刻掉所有负空间——除了你想要印成粉色的部分之外的一切。标记版块。


  19 取一张干净的印刷纸，并使用注册装置闭合窗口顶部处的导线将其对齐。将其固定在原位。


  ![Image](img/f0060-03.jpg)


  20 使用尖锐的铅笔标记纸张顶部，然后使用窗口上的导线在周边做出注册标记。这些线条将帮助你每次都把纸张放在完全相同的位置。


  ![Image](img/f0061-01.jpg)


  21 多色印刷时，最佳做法是始终先从最浅的颜色开始，然后再逐步过渡到最后的深色。首先使用粉色版块。打开注册装置上的窗口并将其牢固地放置在夹具内。


  ![Image](img/f0061-02.jpg)


  22 在上墨板上用调色刀混合墨水以获得想要的颜色。要实现这里所示的桃粉色，我混合了 Caligo Safe Wash Relief Inks 中的浅橙色、宝石红和不透明白色。


  ![Image](img/f0061-03.jpg)


  23 滚出少量粉色墨水并用压墨辊将其涂到版块上。用棉签或抹布清理任何飞溅的墨水。


  ![Image](img/f0061-04.jpg)


  24 关闭窗口。小心地用擦印棒按压纸张背面，注意不要用力过猛，以免在锋利的雕刻边缘撕破纸张。


  ![Image](img/f0062-01.jpg)


  25 你可以抬起窗口查看墨水是否均匀转移到纸上。如果没有， simply 关闭窗口并再次按压，用擦印棒增加压力或用勺子进行擦拭。成功印刷粉色版块后，打开窗口并将其从夹具中取出。


  26 通常我在印刷不同颜色的层次之间等待 2 到 3 天以让墨水干燥，但由于这种设计中粉色和黄色元素不相交，我可以在同一会话中同时印刷它们。这意味着我们可以让纸张留在窗口中。把黄色版块放入夹具。


  ![Image](img/f0062-03.jpg)


  27 滚出墨水并用干净的压墨辊将其涂到黄色版块上。


  ![Image](img/f0062-02.jpg)


  28 关闭窗口并用擦印棒按压，印刷黄色版块。现在你已经在同一张纸上印上了粉色和黄色版块。


  ![Image](img/f0062-04.jpg)


  29 如果你要印刷自己原创设计的成套作品，你可以为想要的每张印刷品重复步骤 19 到 28。如果只印一张，可以让纸张留在注册装置中过夜晾干。清理工作台和工具，并将任何多余的墨水保存在小而密封的容器中。


  ![Image](img/f0062-05.jpg)


  30 当印刷品充分干燥后（不再有粘性，手指触摸后干净）就可以印刷最后一层——主版了！在上墨板上用调色刀混合你想要使用的颜色。我使用了酞青蓝、黑色和不透明白色来获得这里所示的烟熏海军蓝。用压墨辊滚出墨水并涂到版块上，清理任何飞溅的墨水。


  ![Image](img/f0063-01.jpg)


  31 确保纸张仍与注册标记对齐。将版块放入夹具并关闭窗口。


  ![Image](img/f0063-02.jpg)


  32 使用擦印棒按压纸张背面并印刷主版，打开检查是否覆盖了设计的全部区域。


  33 恭喜！现在你拥有一张紧密套准的三色多版六角形标志印刷品！


  ### PROJECT: REDUCTION CUT SUNFLOWERS


  在这个项目中，我们探索减版雕刻——一种色彩印刷方法，你反复使用同一块版，每增加一层颜色就雕刻掉更多部分。花朵一直是艺术家的永恒题材，它们的丰富色彩和形状使其成为研究减版雕刻的绝佳对象。


  #### Tools and Materials

  4" x 8" (10 x 20 cm) 未装裱的软木版

  铅笔

  彩色铅笔

  尺子

  永久性记号笔

  描图纸

  雕刻工具

  针孔定位注册装置（见这里）

  定位片

  和纸/遮蔽胶带

  上墨板

  三种颜色的墨水

  调色刀

  压墨辊

  9" x 12" (23 x 30.5 cm) 印刷纸

  擦印棒


  ![Image](img/f0064-01.jpg)![Image](img/f0065-01.jpg)


  1 在开始起稿版块之前，让我们先准备印刷材料。首先，我们需要在针孔定位注册装置上添加一个定制夹具（见这里）。我希望版块在印刷纸上相对居中，所以用铅笔在注册装置上画了两条垂直居中的导线。然后凭目测使版块落在销钉之间，从而水平居中。


  ![Image](img/f0065-02.jpg)


  2 在版块上放一个重物（我用了一块石头）以防止其移位。取两条裱板、夹板或纸板条，使其相互垂直形成 90 度角。在版块左下角牢固地用胶带将这些条带固定在原位。


  3 夹具准备好后，纸张必须进行准备。将纸裁剪或撕成 9" x 12" (23 x 30.5 cm)。取一张纸放在注册装置上。将纸张顶部边缘与凸起的条带（即定位片粘贴的板片）齐平对齐。纸张对齐后，将两个定位片连接到销钉上，它们会覆盖纸张顶部边缘。将定位片用胶带固定在原位。对其余纸张重复此过程（正如始终一样，印数由你决定）。这些定位片将一直附着在你的纸张上，直到你印刷第三种也是最后一种颜色。


  #### AN IMPORTANT NOTE ON TAPES




  测试胶带以及它们与纸张的粘合效果，然后再实际粘贴标签。照片中使用的和纸胶带可以干净地从 Blick 版画纸上取下，但却撕破了纤维更粗的楮纸。一些版画家更喜欢美纹纸胶带，但我发现有时它的粘性会太快消失。你可能需要在事先做一点试错。意外在取下标签时撕破纸张而毁掉一张完美的印刷品会非常遗憾！（不过如果真的发生了，你可以在第
  5 章中的一个项目中使用该印刷品：物尽其用。）


  ![图片](img/f0066-01.jpg)


  ## 制作步骤


  ### 4 绘制你的设计草图，然后完成最终的线稿。使用彩色铅笔规划你想要的颜色位置。

  ![图片](img/f0066-02.jpg)


  ### 5 在你的画稿上贴上一层描图纸，小心地用锋利、柔软的石墨铅笔描摹设计。

  ![图片](img/f0066-03.jpg)


  ### 6 将描图纸翻转到版块上并贴牢。只描摹设计的轮廓。用细头永久性记号笔将画稿固定到位。


  ### 7 雕刻出负空间。这将为你的图像提供干净、空白的背景。

  ![图片](img/f0067-01.jpg)


  ### 8 如同往常一样，我们先印刷最浅的颜色，这里是黄色。（为了制作出明亮、阳光般的黄色，我将 Caligo SafeWash Relief 油墨中的二芳基黄和不透明白混合。）用调色刀在上墨板上混合并涂抹油墨。

  ![图片](img/f0067-02.jpg)


  ### 9 滚开油墨并将其涂到版块上。注意擦拭掉任何多余的油墨。

  ![图片](img/f0067-03.jpg)


  ### 10 将版块放入针孔和标签套准装置中，确保它牢固地塞入夹具的角落。


  ### 11 将带标签的印刷纸装入销钉中，小心地铺好纸。用团印工具用力按压纸张背面，注意覆盖版块的每个区域。

  ![图片](img/f0068-01.jpg)


  ### 12 揭开纸张检查版块各区域是否均匀转印。使用更坚实的团印工具，如勺子，来处理顽固的细节。这也是重新检查设计的好时机。（此时，我意识到我希望叶脉呈现为白色线条，于是我回去雕刻了它们。）

  ![图片](img/f0068-02.jpg)


  ### 13 将印刷品放在一旁晾干，并根据版数重复步骤 9–12。即使加入钴干剂来加快干燥时间，我仍然喜欢在各层之间间隔三天，以确保油墨完全干燥。将湿油墨印在湿油墨上会导致细节丢失以及颜色不一致、斑驳。


  ### 14 先用废纸吸去版块上的多余油墨，然后擦拭干净。高度着色的油墨经常会污染版块，但只要彻底清洁，这些污渍就不会转印。

  ![图片](img/f0069-01.jpg)


  ### 15 使用步骤 5 中的描摹图像，将图像与雕刻好的版块对齐并转移细节。你现在雕刻掉的部分在印刷品上会保留黄色。雕刻掉你希望保留黄色的所有部分。对于此设计，你主要会雕刻掉花朵的花瓣。

  ![图片](img/f0069-02.jpg)


  ### 16 第二遍雕刻完成后，是时候印刷橙色了（我使用浅橙色、二芳基黄和不透明白来达到这种颜色）。滚开油墨，涂到版块上，并将版块放入夹具。

  ![图片](img/f0069-03.jpg)


  ### 17 你将直接在之前已干的黄色层上印刷。印刷橙色版块并根据版数重复。把印刷品放在一旁晾干。

  ![图片](img/f0069-04.jpg)


  ### 18 先用废纸吸去版块上的多余油墨，然后擦拭干净。

  ![图片](img/f0070-01.jpg)


  ### 19 是时候进行第三次也是最后一次雕刻了。切除你希望保留橙色的版块部分。之后留在版块上的所有部分都会印成黑色。所以对于此设计，雕刻掉除轮廓外的所有部分。

  ![图片](img/f0070-02.jpg)


  ### 20 最后一次雕刻完成后，滚开黑色油墨并涂到版块上。你将直接在之前已干的黄色和橙色层上印刷。印刷黑色版块并根据版数重复。放在一旁晾干。

  ![图片](img/f0070-03.jpg)


  你也可以尝试在彩色纸上印刷！


  ### 21 清洁你的版块、工作台和工具。


  ### 22 当最后一层完全干燥后，小心地将胶带和标签从印刷品上撕下。


  ## 关于减法雕刻版画的重要说明


  减法版画你只能制作一次、限量的版次。因为你为每个版块使用同一块基材，你本质上是在制作第二个版块时摧毁第一个版块——然后为了制作第三个而摧毁第二个，以此类推。


  ## 艺术家聚焦：德里克·赖利


  我的人生在肯塔基大学大四时永远改变了，当时我上了我的第一堂版画课，初级木刻，由德里克·赖利教授。拥有 MFA 学位并是著名 Outlaw Printmakers
  肯塔基分部的成员，赖利自 2005 年起经营自己的印刷机，制作出史诗般规模的叙事版画，庆祝肯塔基最奇异的民间传说、放荡的机器人和奇异的生物混搭。他以大胆的图形风格和对形态的精细描绘而闻名。


  ![图片](img/f0071-01.jpg)


  独眼巨人猩猩


  ### EH：你是如何第一次对版画产生兴趣的？

  DR：我本科主修绘画，版画课程是学位要求的一部分。在课程期间，2000 年大学博物馆举办了 Joel Feldman 的回顾展。展览中有这些巨大的横幅风格黑白木刻《伊索寓言》，令人惊叹。在那之前我从未意识到版画可以如此巨大。之后我就上瘾了。


  ### EH：是什么吸引你特别钟爱凸版？

  DR：起初有几件事吸引我进入凸版印刷。首先，一整天玩刀子挺棒的。而且我对有限调色板——以及黑白鲜明对比的视觉力量——比全色调板更强大感到着迷。我也恰好手劲很大，而木块或油画胶板提供的阻力正好控制住我过重的力道。


  ### EH：你如何描述你的作品和创作过程？

  DR：我从用铅笔绘制图像开始，每块版都先用铅笔再用 Sharpie 描一遍。我一丝不苟地绘制每个细节，直到它完全是我想要的最终印刷品的样子。我把版块染成红色，这样我就能看到雕刻过和未雕刻的地方——然后开始雕刻。我的作品非常精细且繁琐。连续工作一块版长达
  6 个月的情况并不少见。


  ### EH：你如何在日常保持创造力？

  DR：我给自己设定严格的目标和截止日期，并坚持执行。很多时候我会告诉朋友我不能做某事，因为我必须完成一块版。当他们问那块版是做什么用的时，我无法回答他们，没有截止日期，也不是专门为某事制作的，但我仍然能感受到完成它的需要和动力。


  ### EH：描述你创作艺术的空间。




  DR：我家地下室有一个惊人的工作室，我非常为它自豪。它配备齐全，拥有制作木刻、胶版画和丝网印刷所需的一切。我有一台电动蚀刻压机，以及一台用于印刷凸版画的平版打样压机，还有全尺寸晾干架、一台可一次裁切
  200 多张纸的吉洛丁式裁纸机、真空台、丝网曝光机和用于丝网印刷的 T 恤压机。我完全不需要离开家就能创作我的艺术。


  ### EH：说一件你讨厌印刷术的事和一件你喜欢的事。


  DR：制作凸版画有五个情感阶段。

  1\. 开始雕刻新版块的兴奋

  2\. 雕刻版块几乎完成却又遥不可及的痛苦

  3\. 揭开第一张印品的期待

  4\. 第一次看到一切倒置的沮丧

  5\. 接受并继续前进


  ### EH：你在创作过程中有没有学到什么有用的技巧或窍门''''？


  DR：很容易过度雕刻凸版画。经常休息很重要，不仅出于健康原因，也是为了视觉重置。完全规划好你的版块，不要留下任何“以后再想”的部分。仓促进入雕刻是最快导致出错的途径。

  即使在制作黑白凸版画时，也可以通过雕刻图案、平行线和交叉线来呈现许多灰色。这些平行线和交叉线会赋予印品深度。重要的是给印品足够的对比度，使灰色突出。我发现一幅平衡的印品至少要有
  20%的纯黑、20%的纯白，以及多达 60%的灰色。如果纯黑和纯白不足，灰色就会被冲淡而变得平淡。


  ![Image](img/f0072-01.jpg)

  Tunacorn


  ### EH：你做过的最喜欢的作品是什么？


  DR：我花了三年时间制作了一系列关于肯塔基州怪物、神话和传说的木刻。它是一套由 14 件相互关联的印品组成的系列，可以完全重新排列并且边缘仍然对齐。全部加起来长达
  32 1/2 英尺（9.9 米）。


  ![Image](img/f0073-01.jpg)


  ### EH：你会给刚接触版画的人什么建议？


  DR：我会给他们两个建议。首先，不要气馁，你体内有 100 张糟糕的印品。越快把它们做出来，越早能创作出特别的东西。

  另一个建议很实际：时刻保持一切清洁。在脏乱的工作室里试图制作干净的印品是一场噩梦。我在印刷前总是预先清洁我的调色刀、滚筒、卷起的胶板、压机，尤其是我的双手。


  ![Image](img/f0073-02.jpg)

  Derrick Riley 在他的工作室


  ![Image](img/f0073-03.jpg)

  Jackalope



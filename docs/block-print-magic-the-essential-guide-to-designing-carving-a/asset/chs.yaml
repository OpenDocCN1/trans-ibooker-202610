  ## 项目：多版块六角星


  六角星也称谷仓星，但不要与谷仓拼布混淆，是宾夕法尼亚乡村常见景观，装饰谷仓立面和山墙。这些引人注目、平衡的圆形设计是宾夕法尼亚荷兰人，即 1700 年代初移民美国的德国人带来的民间艺术传统。采用旋转对称或平行反射对称，当代六角星常融入象征母题：星星和蔷薇代表好运，郁金香代表信仰，小麦束和雨滴代表丰收，橡叶代表品格力量等。


  ## 工具与材料


  三块 6" x 6" 15 x 15 cm 未装裱软木

  三块 7 1/2" x 9 1/2" 19 x 24 cm 坚硬夹板或裱板

  木胶

  铰链式定位装置

  铅笔

  尺子

  多种颜色永久记号笔

  至少两张描图纸

  绘图纸

  圆规

  雕刻工具

  三种颜色油墨

  调墨板

  调色刀

  滚筒

  9" x 12" 23 x 30.5 cm 印刷纸

  巴伦

  遮蔽/和纸胶带


  ![Image](img/f0056-01.jpg)


  我的六角星以八角蔷薇为主，加入雨滴、波浪边框和注视眼睛。你可用有意义或 pleasing 的符号和颜色设计自己的图案。


  本项目使用 **多版块技术**，三个不同颜色上墨的独立版块印痕形成三色印刷。可随意实验自选颜色。多版块印刷初次操作较棘手，但耐心并仔细测量即可做出干净作品。多版块印刷关键是规划，从设计开始。


  ![Image](img/f0057-01.jpg)


  1 先做准备：每块未装裱软木须粘在 7 1/2" x 9 1/2" 19 x 24 cm 板上才能在铰链定位装置中工作。我用夹板，也可用裱板或致密硬纸板。用尺子将版块居中粘牢，测量越准越好，用木胶粘合后压重书确保粘合。重复其余两块。在每块板底部用遮蔽胶带加标签便于取出。


  ![Image](img/f0057-02.jpg)


  2 等待粘合时规划设计。我通常先画简单线稿，再画全彩草图，然后视觉分离颜色以便看清版块效果。


  ![Image](img/f0057-03.jpg)


  3 有计划后在绘图纸上制作干净全尺寸线稿，即主稿。建议用尺和圆规便于画完美圆形。确保设计能放入 6" x 6" 15 x 15 cm 版块。


  ![Image](img/f0058-01.jpg)


  4 按计划蓝色版块信息最多，为关键版块，作为其他颜色[content]

  ![Image](img/f0052-01.jpg)



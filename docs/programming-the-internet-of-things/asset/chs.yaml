  ## 使用 Git 远程和分支进行源代码控制\n\n使用 Git 的关键好处之一是能够与其他人协作并将你的本地代码仓库与存储在云中的远程代码仓库同步。如果你以前使用过\
  \ Git，你已经熟悉远程和分支。我不会在这里深入细节，但它们是作为你的自动化环境的一部分需要掌握的重要概念。\n\n分支本质上是一种方式，使每个开发人员或团队能够在不影响主代码库的情况下分割他们的工作。在\
  \ Git 中，这个默认主分支目前称为 ‘master’，通常用于包含已完成、测试、验证并且——通常——已投入生产 的代码。这是 ‘programmingtheiot-java’\
  \ 和 ‘programmingtheiot-python’ 的默认分支，虽然你可以保持原样并简单地在此默认分支上工作，但通常不建议这样做，原因如我所述。\n\n\
  分支策略可能因公司和团队而异，虽然我喜欢使用的方法是每个章节使用一个新分支，然后一旦一切工作正常并通过适当测试，章节分支就会合并到 master 中。从那里，为下一章从合并后的\
  \ master 创建一个新分支，以此类推。\n\n这种方法允许你轻松跟踪章节之间的更改，甚至可以返回到早期章节的历史记录，如果你想查看例如第 2 章和第 5\
  \ 章之间发生了什么更改。在 Eclipse 中，你可以右键单击项目（‘programmingtheiot-java’ 或 ‘programmingtheiot-python’），并选择\
  \ ‘Team > Switch To > New Branch...’ 来为你的代码建立一个新分支。\n\n我建议你使用 ‘chapternn’ 作为每个分支名称的命名约定，其中\
  \ ‘nn’ 是两位数的章节号。例如，第 1 章的分支将命名为 ‘chapter01’，第 2 章将命名为 ‘chapter02’，以此类推。\n\n> NOTE\n\
  > \n> 本书的范围不包括 Git 分支和合并的所有细节，因此如果您想深入了解，我建议阅读以下指南 https://git-scm.com/book/en/v2/Git-Branching-Basic-Branching-and-Merging。\n\
  \n## 云中的自动化 CI/CD\n\n在 Eclipse 中，你可以编写你的 CDA 和 GDA 代码，执行单元测试，并构建和打包这两个应用程序。这实际上并不是自动化的，因为你必须通过从命令行执行类似\
  \ mvn install 的命令，或从 IDE 内调用 Maven install 过程来自行启动该过程。这对于将两个应用程序带到可以运行它们的程度非常好，但实际上并没有运行它们\
  \ -\n\n\n\n你仍然需要手动启动应用程序，然后运行你的集成和/或性能测试。\n\n作为一名开发者，你的工作一部分是编写和测试代码以满足已捕获的需求（例如在看板上的卡片），因此总会涉及一些手动工作。一旦你知道你的代码单元功能正确，就会有点酷炫地让其他一切自动运行——比如在你将代码提交并推送到远程开发分支（例如‘chapter02’）之后。\n\
  \nGitHub 通过 GitHub Actions 11 支持这种自动化。我将在第 2 章更详细地讨论这个问题，并帮助你为即将构建的应用程序设置自己的自动化。\n\
  \n## 本地开发环境中的自动化 CI/CD\n\n在本地环境中管理 CI/CD 有很多方法。例如，GitHub Actions 可以使用自托管运行器 12 在本地运行。还有一个名为\
  \ Jenkins 13 的工作流自动化工具，可以在本地运行，与 Git 本地和远程仓库集成良好，并且具有插件架构，允许你几乎无限地扩展其功能。\n\n## WARNING\n\
  \n有很多很棒的第三方 Jenkins 插件，但有些维护不善，可能会引入安全漏洞。如果是一个你确定需要的插件，请务必跟踪其更新和修补的频率。如果没有定期维护，它可能会为你的环境引入兼容性和安全问题。\n\
  \n安装并确保安全后，你可以配置 Jenkins 自动监控你的 Git 仓库（本地或远程），并在本地系统上运行构建/测试/部署/运行工作流，并在每个步骤检查成功情况。例如，如果构建因代码中的编译错误而失败，Jenkins\
  \ 将报告此问题并停止流程。如果构建成功但测试失败，流程也会在第一个失败点停止。这确保了你的本地部署不会被覆盖为一个无法编译或未能成功执行配置测试的更新。\n\n\
  设置任何本地自动化工具都可能是一项复杂且耗时的任务。然而，它非常有帮助，因为它基本上自动化了你构建、测试和部署软件所需做的所有事情。也就是说，这本书中的任何练习都不需要它。\n\
  \n我已在我的网站上的文档中详细介绍了我使用 GitHub Actions 和自托管运行器以及 Jenkins 的方法，网址为 https://programmingtheiot.com/setup/ConnectedDevices_DevEnvironmentSetup.html。请参阅目录以导航到与你的环境最相关的部分。\n\
  \n## 关于容器化的一些想法\n\n你可能听说过 *容器化*，它只是一种将你的应用程序及其所有依赖项打包到单个镜像或 *容器* 中的方法，该容器可以部署到许多不同的操作系统环境中。这种方法非常方便，因为它允许你在构建软件并以这样的方式部署它，使托管环境不再成为问题，前提是目标环境支持你使用的容器基础设施。\n\
  \nDocker 14 本质上是一个在各种操作系统（如 Windows、Mac 和 Linux）上运行的应用程序引擎，并作为你的容器实例的宿主。例如，你的 GDA\
  \ 和 CDA 各自可以被容器化，然后部署到支持底层容器基础设施和运行时的任何硬件设备上。\n\n值得指出的是，将任何具有硬件特定代码的应用程序容器化可能存在问题，因为它无法移植到另一个不同的硬件平台（即使容器引擎受支持）。如果你希望你的硬件特定应用程序在支持\
  \ Docker 的任何平台上运行，该平台将需要一个与为应用程序开发的代码兼容的硬件特定模拟器。\n\n例如，如果你的 CDA 具有依赖于树莓派特定硬件的代码。这目前对我们来说不是什么大问题，因为你只会模拟传感器和执行器，并且在第\
  \ 4 章之前不会有任何硬件特定代码需要担心（同样，这是可选的）。我将在第 4 章中更详细地讨论这个问题，并讨论克服 CDA 中硬件特定性的策略。\n\n当在远程或云环境中使用\
  \ CI/CD 管道时，你会注意到这些服务可能会部署到虚拟机，并在包含所需依赖项的容器中运行你的代码，所有这些都作为管道的一部分进行配置。对于许多情况，这完全合理，并且可以成为确保一致性和部署简便性的有效策略。\n\
  \n为了让事情更简单一些，我不会在本书中介绍在你的开发环境中使用容器化以及作为你的工作站的一部分，即使这样做有很多好处。主要原因是它在初期增加了另一个需要管理的复杂层，而我希望你能尽快开始运行自己的应用程序。\n\
  \n如果你有兴趣了解更多关于容器化你的物联网工作站和本地环境的信息，我已在 https://programmingtheiot.com/setup/ConnectedDevices_DevEnvironmentSetup.html\
  \ 中详细介绍了我对 GDA、CDA 和其他相关应用程序的方法。请参阅标记为“Using Containers”的部分以获取更多信息。\n\n## Conclusion\n\
  \n恭喜！你刚刚完成了书中最长——也许也是最乏味——的一章。你学习了一些基本的物联网原则，创建了一个驱动你的物联网解决方案的问题陈述，并建立了一个包含云层和边缘层的基线物联网系统架构。\n\
  \n也许最重要的是，我介绍了两个应用程序——GDA 和 CDA——它们将作为你在本书中大部分物联网软件开发的基础，并且你将在第 2 章开始构建它们。最后，你设置了开发环境和工作流，了解了需求管理，探索了单元、集成和性能测试，并考虑了一些基本的\
  \ CI/CD 概念来帮助自动化你的构建和部署。\n\n你现在准备好使用 Python 和 Java 开始构建你的前两个物联网应用程序了。如果你准备继续，我建议你泡一杯好咖啡或茶。让我们开始吧。\n\

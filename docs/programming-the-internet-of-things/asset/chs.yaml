  \ SystemPerformanceManager。你能看出我的思路了吗？\n\n## 创建 SYSTEMCPUUTIL 任务模块\n\n这是我们系统性能应用程序真正开始起作用的地方。SystemCpuUtilTask\
  \ 将检索\n\n\n\ncurrent CPU utilization across all cores, average them together, and\
  \ return the result as a float.\n\n让我们将其命名为 *PIOT-CDA-02-003 - Create module SystemCpuUtilTask*。以下是描述内容：\n\
  \n### Description\n- 创建一个名为 SystemCpuUtilTask 的新 Python 模块，类名为 SystemCpuUtilTask。\n\
  \n### Actions\n- 导入 psutil 库。\n- 在模块内创建一个名为 SystemCpuUtilTask 的类。\n- 在构造函数中，添加以下内容：\n\
  \  - self.perfMgr = psutil()\n- 添加 getTelemetry() 方法，并添加以下内容：\n  - cpuUtilPct =\
  \ self.perfMgr.cpu_percent()\n- 在 getTelemetry() 中，记录一条信息日志，指示已收集数据以及 cpuUtilPct\
  \ 的值。\n\n### Estimate (Small = < 2 hrs ; Medium = 4 hrs ; Large = 8 hrs )\n- Small\n\
  \n### Tests\n- 以 PyUnit 测试的形式运行 SystemCpuUtilTaskTest。所有测试都应通过。\n\n#### NOTE\n你可能记得\
  \ psutil 是你在设置 virtualenv 环境时导入的库之一，并使用 pip 安装了 basic_imports.txt。此库使你能够监控系统指标，例如\
  \ CPU 利用率和内存利用率。你可以在网上阅读其所有功能（https://psutil.readthedocs.io/en/latest/#）。\n\n仔细查看指定以下代码行的操作：\n\
  \n```\ncpuUtilPct = self.perfMgr.cpu_percent()\n```\n\n该库会将所有核心聚合为单个 CPU 百分比，这对你作为开发人员来说相当容易。这个类本质上归结为返回这一行代码的值。\n\
  \n好吧，在我们继续之前，为什么要在代码周围加上花哨的包装？这不是过度设计吗？简单来说，是的。但你会看到一种模式出现，你将以类似的方式编写代码来表示其他更复杂的传感器。本练习的重点当然是获取\
  \ CPU 利用率，但也是为了建立控制分离或关键功能分离的模式，以便它们可以与应用程序其余逻辑分开进行管理和更新。\n\n#### NOTE\n与任何软件设计一样，复杂性、巧妙编码和简单完成之间存在平衡。我将在整本书中尝试保持这种平衡。你可能有不同的想法——太好了！我鼓励你考虑如何以其他方式实现每个练习以满足你的特定需求。这正是编程富有创造性和乐趣的一部分。\n\
  \n## CREATE THE SYSTEMMEMUTIL TASK MODULE\n假设你的 SystemCpuUtilTask 测试运行并且全部通过，你可以继续下一个模块，即创建\
  \ SystemMemUtilTask。这将检索当前虚拟内存利用率并以浮点数形式返回结果。\n\n让我们将其命名为 *PIOT-CDA-02-004 - Create\
  \ module SystemMemUtilTask*。以下是描述内容：\n\n### Description\n- 创建一个名为 SystemMemUtilTask\
  \ 的新 Python 模块，类名为 SystemMemUtilTask。\n\n### Actions\n- 导入 psutil 库。\n- 在模块内创建一个名为\
  \ SystemMemUtilTask 的类。\n- 在构造函数中，添加以下内容：\n  - self.perfMgr = psutil()\n- 添加 getTelemetry()\
  \ 方法，并添加以下内容：\n  - memUtilPct = self.perfMgr.virtual_memory().percent\n- 在 getTelemetry()\
  \ 中，记录一条信息日志，指示已收集数据以及 memUtilPct 的值。\n\n### Estimate (Small = < 2 hrs ; Medium\
  \ = 4 hrs ; Large = 8 hrs )\n- Small\n\n### Tests\n- 以 PyUnit 测试的形式运行 SystemMemUtilTask。所有测试都应通过。\n\
  \n关键功能封装在以下代码行中：\n\n```\nmemUtilPct = self.perfMgr.virtual_memory().percent\n```\n\
  \n你可以从对 virtual_memory() 的调用中提取其他属性，并且欢迎你进行实验。现在，只需返回百分比利用率即可。\n\n在继续之前，请确保你的 SystemMemUtilTaskTest\
  \ PyUnit 测试全部通过。现在，让我们将 SystemCpuUtilTask 和 SystemMemUtilTask 连接到 SystemPerformanceManager。\n\
  \n你可以对 SystemMemUtilTask 重复相同的步骤，当然使用正确的名称！我建议现在就这样做，然后运行 SystemMemUtilTaskTest\
  \ 单元测试以确保它返回有效数据。\n\n#### How to Poll for Sensor Updates\n从传感器（模拟或真实）读取单个值是好的，但对我们的目的来说并不太有用，因为我们希望随着时间的推移监控这些值以查看它们是否发生变化。即使在将\
  \ SystemCpuUtilTask 和 SystemMemUtilTask 连接到 SystemPerformanceManager 之后，你也希望定期处理它们的数据。\n\
  \n在 Python 中有许多方法可以做到这一点：你可以使用 Python 的并发库构建自己的调度机制，或利用众多开源库之一为你完成此操作。我在 basic_imports.txt\
  \ 中包含了 apscheduler¹，它提供了一种调度机制，非常适合我们的目的。\n\n#### NOTE\nPython 提供了两种使代码看起来与其它代码同时执行的方式。一种是使用并发，另一种是使用多进程。前者使用线程处理，而后者使用单独的子进程处理。一个关键区别是\
  \ Python 线程实际上使用与主应用程序相同的处理器核心按顺序运行，但它们以一种看起来同时运行的方式发生。多处理允许真正的并行，其中使用多处理器库编写的代码可以分发到单独的处理器核心上运行，可以与不同处理器核心上的其他代码并行执行。书中\
  \ CDA 特定的练习和示例将假设 Python 中的线程并发足以满足我们的需求，因此我不会讨论任何 CDA 开发中的多处理。\n\n## INTEGRATING\
  \ SYSTEMCPUUTIL TASK AND SYSTEMMEMUTIL TASK WITH SYSTEMPERFORMANCEMANAGER\n在本节中，你将创建两个非常相似的任务：*PIOT-CDA-02-006\
  \ - Connect SystemCpuUtilTask to SystemPerformanceManager*，和 *PIOT-CDA-02-007 -\
  \ Connect SystemMemUtilTask to SystemPerformanceManager。*\n\n以下是 *PIOT-CDA-02-006\
  \ - Connect SystemCpuUtilTask and SystemMemUtilTask to SystemPerformanceManager*\
  \ 的描述内容：\n\n### Description\n- 在 SystemPerformanceManager 中创建 SystemCpuUtilTask\
  \ 和 SystemMemUtilTask 的实例，并使用 apscheduler 库以定期间隔运行每个任务。\n\n### Actions\n- 添加以下导入语句：\n\
  \  - from apscheduler.schedulers.background import BackgroundScheduler\n- 更新 SystemPerformanceManager\
  \ 构造函数以接受名为 pollRate 的参数，并将其默认值设为 30：\n  - def __init__(self, pollRate = 30):\n\
  - 在 SystemPerformanceManager 构造函数内创建 SystemCpuUtilTask 的类作用域实例，命名为 cpuUtilTask\n\
  - 在 SystemPerformanceManager 构造函数内创建 SystemMemUtilTask 的类作用域实例，命名为 memUtilTask\n\
  - 创建一个名为 handleTelemetry() 的公共方法，并添加以下代码行：\n  ```\n  cpuUtilPct = self.cpuUtilTask.getTelemetry()\n\
  \  memUtilPct = self.memUtilTask.getTelemetry()\n  ```\n- 在 handleTelemetry() 中添加一条信息日志消息，记录\
  \ cpuUtilPct 和 memUtilPct 的值\n- 在 SystemPerformanceManager 构造函数内创建 BackgroundScheduler\
  \ 的类作用域实例，命名为 scheduler\n- 使用以下代码行在 SystemPerformanceManager 中向调度器添加一个作业：\n  ```\n\
  \  self.scheduler.add_job('self.handleTelemetry', 'interval', seconds = pollRate)\n\
  \  ```\n\n### Estimate (Small = < 2 hrs ; Medium = 4 hrs ; Large = 8 hrs )\n- Small\n\
  \n### Tests\n- 向 SystemPerformanceManagerTest 添加一个单元测试，该测试将使用 pollRate = 10 创建 SystemPerformanceManager\
  \ 实例，调用 startManager() 方法，等待 65 秒，然后调用 stopManager()。\n- 测试应显示应用程序和 SystemPerformanceManager\
  \ 启动日志消息，随后是表示六个（大部分）不同值的 CPU 利用率和内存利用率交错消息，最后是 SystemPerformanceManager 和应用程序停止日志消息。\n\
  \n\n\n\n\n#### NOTE\n\n注意 apscheduler 的使用——它相对比较直接。这在一定程度上是因为在 Python 中，你能够传递函数指针（是的，我们称它们为方法）。这使得你在\
  \ SystemPerformanceManager 中已创建的回调 handleTelemetry() 可以被 apscheduler 轻松调用，并且使用并发。\n\
  \n你现在可以执行 ConstrainedDeviceApp 的完整功能单元测试 test 了。立即运行它，并查看日志输出。它应该看起来与以下类似（再次说明，你的日志消息可能与我的不同）：\n\

  2020-07-06 21:03:03,656:INFO:Starting SystemPerformanceManager...\n2020-07-06 21:03:03,656:INFO:CDA\
  \ ran successfully.\n```\n\n恭喜！你刚刚完成了 CDA 的第一次迭代。它是一个完全独立的 Python 应用，并且有一套完整的单元测试供你在接下来的章节中在此基础上构建。现在让我们转向\
  \ GDA 并开始编写一些 Java 代码。\n\n## The GDA\n\n你的 GDA 需要与你的 CDA 相同的三个组件：一个应用包装器、一个系统性能管理器，以及用于读取系统性能数据的组件，这些数据将构成你的\
  \ GDA 的遥测数据。\n\n#### NOTE\n\n在 IoT 系统中，网关设备可能生成也可能不生成自己的遥测数据。本书中你将构建的示例仅生成其自身的系统性能遥测数据。约束设备，即\
  \ CDA，将负责不仅生成其特定的系统性能遥测数据，还负责任何传感器特定的遥测数据。\n\n让我们使用图 2-5 中的类图来表示 GDA 的设计。你会注意到它看起来与我们的\

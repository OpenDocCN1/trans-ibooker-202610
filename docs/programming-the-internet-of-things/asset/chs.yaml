  \ to load configuration...\n2020-07-06 17:15:39,655:INFO:Starting CDA...\n2020-07-06\
  \ 17:15:39,655:INFO:CDA ran successfully.\n```\n\n恭喜！你的 GDA 和 CDA 都已在 IDE 中设置并正常工作。此时，你在技术上已准备好开始为两个应用程序编写自己的代码。但在我们进入第\
  \ 2 章的练习之前，我们需要先弄清楚接下来的两个步骤：测试和自动化。\n\n## Step II: Define Your Testing Strategy\n\
  \n现在你的 GDA 和 CDA 的开发环境已经建立，我们可以讨论你将如何测试即将开发的代码。显然，良好的测试是任何工程工作中的至关重要的一部分，编程也不例外。你构建的每个应用程序都应经过彻底测试，无论它是否完全独立于其他应用程序运行，还是与其它系统紧密集成。此外，你编写的每一单元代码都应经过测试，以确保其按预期行为。究竟什么是单元？就我们的目的而言，单元始终以你想要测试的函数或方法的形式表示。\n\
  \n#### NOTE\n\n函数和方法有什么区别？粗略地过度简化一下，函数是一段执行任务的代码的命名分组（例如将两个数字相加）并返回结果。如果函数接受任何输入，它将作为一个或多个参数传递。方法几乎与函数相同，但附加到对象上。在面向对象的术语中，对象只是已被实例化的类，而类是组件的形式定义——其方法、参数、构造和析构逻辑。\
  \ 本书中的所有 Java 示例都将以类形式表示，并在每个类中定义方法。Python 可以以脚本形式用函数编写，也可以作为带方法的类编写，但我更喜欢用带方法的\
  \ Python 类编写，并且本书记载的每个 Python 示例都将如此，只有少数例外。\n\n## Unit, Integration, and Performance\
  \ Testing\n\n有许多方法可以测试软件应用程序和系统，并且对此主题有许多优秀的书籍、文章和博客。开发一个可行的物联网解决方案需要仔细关注测试——在应用程序内部以及不同应用程序和系统之间。就你将开发的解决方案而言，我将只关注三种：单元测试、集成测试和性能测试。\n\
  \n单元测试是编写的代码模块，用于测试对测试可访问的最小可能代码单元，例如函数或方法。这些测试编写用于验证给定函数或方法的一组输入是否返回预期结果。边界条件通常也会被测试，以确保函数或方法能够适当处理这些类型的条件。\n\
  \n#### NOTE\n\n代码单元在技术上可以是一个单行、多行代码，甚至整个代码库。就我们的目的而言，单元是指可通过本地系统上可用的单个接口访问的一行或多行代码，或整个代码库——即封装单元功能的函数或方法，可从你的测试应用程序调用。此功能例如可以是排序算法、计算，甚至是进入一个或多个附加函数或方法的入口点。\n\
  \n我使用 JUnit 进行 Java 代码的单元测试（随 Eclipse 提供），并使用 PyUnit 进行 Python 代码的单元测试（Python 解释器的标准部分，并在\
  \ PyDev 中可用）。如果你使用 Eclipse 和 PyDev，在 IDE 中编写和执行单元测试无需安装任何额外组件。\n\n#### NOTE\n\n\
  在你的 GDA 项目中，你可能注意到 Maven 为你的源代码创建了两个目录结构：一个用于位于 ./src/main/java 的 Java 源代码，另一个用于位于\
  \ ./src/test/java 的 Java 单元测试代码。由于这是 Maven 项目的默认约定，保持原样。\n\n在你的 CDA 项目中，代码路径结构与\
  \ GDA 项目略有不同：./src/main/java 和 ./src/test/java 缺失了。这可能看起来很合理，因为这是一个 Python 项目而不是\
  \ Java！所有源代码都包含在 ./src/programmingtheiot 中，而所有测试都包含在 ./tests/programmingtheiot 中。\n\
  \n虽然我为你提供了大量单元测试供使用，但我们将在第 2 章深入研究创建你自己的测试。如果你是该开发领域的新手，我在下面提供了 Java 和 Python 中的几个简单代码片段，以帮助你更熟悉代码结构。以下是使用\
  \ JUnit ⁶ 的简单 Java 单元测试，验证方法 addTwoIntegers() 是否按预期行为：\n\n```\n@Test\npublic int\
  \ testAddTwoIntegers(int a, int b)\n{\nMyClass mc = new MyClass();\n\n// baseline\
  \ test\n\nassertTrue(mc.addTwoIntegers(0, 0) == 0);\n\nassertTrue(mc.addTwoIntegers(1,\
  \ 2) == 3);\n\nassertTrue(mc.addTwoIntegers(-1, 1) == 0);\n\nassertTrue(mc.addTwoIntegers(-1,\
  \ -2) == -3);\n\nassertFalse(mc.addTwoIntegers(1, 2) == 4);\n\nassertFalse(mc.addTwoIntegers(-1,\
  \ -2) == -4);\n\n}\n```\n\n如果你的单个测试类有两个独立的单元测试，但你只想运行其中一个？只需在 @Test 注解前添加 @Ignore，JUnit\
  \ 将跳过该特定测试。删除该注解即可重新启用测试。\n\n让我们用 Python 3 内置的 PyUnit 框架和 unittest 库⁷ 查看相同的示例：\n\
  \n```\ndef testAddTwoIntegers(self, a, b):\n\nMyClass mc = MyClass()\n\n## baseline\
  \ test\n```\n\n```\nself.assertTrue(mc.addTwoIntegers(0, 0) == 0)\nself.assertTrue(mc.addTwoIntegers(1,\
  \ 2) == 3)\nself.assertTrue(mc.addTwoIntegers(-1, 1) == 0)\nself.assertTrue(mc.addTwoIntegers(-1,\
  \ -2) == -3)\nself.assertFalse(mc.addTwoIntegers(1, 2) == 4)\nself.assertFalse(mc.addTwoIntegers(-1,\
  \ -2) == -4)\n```\n\nPyUnit 与 JUnit 类似，允许你在需要时禁用特定测试。只需在方法声明前添加 @unittest.skip(\"\
  Put your reason here.\")，或仅添加 @unittest.skip 作为注解，框架将跳过该特定测试。\n\n集成测试对于物联网至关重要，因为它们可用于验证系统和应用程序之间的连接和交互是否按预期工作。假设你想使用嵌入在测试类中的基本数据集测试一个简单的排序算法——你通常会编写一个或多个单元测试，执行每个测试并验证一切正常。简单，对吧？\n\
  \n但是，如果排序算法需要从可通过本地网络甚至互联网访问的数据存储库中提取数据呢？那么怎么样，你可能会问？好吧，现在你只是为了运行排序测试而又多了一个依赖。你将需要一个集成\n\
  \n\n\ntest to verify that data repository connection is both available and working\
  \ properly before exercising the sorting unit test.\n\nThese kinds of dependencies\
  \ can make integration testing pretty challenging with any environment, and even\
  \ more so with the IoT, since we sometimes have to set up servers to run specialized\
  \ protocols to test our stuff. Fortunately, Maven can help with this, too, since\
  \ it supports plugins which make some of this much easier. For all the code that\
  \ needs to integrate only within the Edge Tier, we’ll use Maven plus some specialized\
  \ Unit Tests as part of our integration testing strategy.\n\nFinally, performance\
  \ tests are useful for testing how quickly, or efficiently, a system handles a variety\
  \ of conditions. They can be used with both unit and integration tests when, for\
  \ instance, response time or the number of supported *concurrent*, or simultaneous\
  \ connections needs to be measured.\n\nLet’s say there are many different systems\
  \ that need to retrieve a list of data from your data repository, and each one wants\
  \ that list of data sorted before your application returns it to them. Ignoring\
  \ system design and database schema optimization for a moment, a series of performance\
  \ tests can be used to time the responsiveness of each system’s request (from the\
  \ initial request to the response), as well as the number of concurrent systems\
  \ that can access your application before it no longer responds adequately.\n\n\
  Another aspect of performance testing is to test the load of the system your application\
  \ is running on, which can be quite useful for IoT applications. IoT devices are\
  \ generally constrained in some way - memory, CPU, storage, etc - whereas cloud\
  \ services can scale as much as we need them to. It stands to reason then, that\
  \ our first IoT applications - coming up in Chapter 2 - will set the stage for monitoring\
  \ each device’s performance individually.\n\nSince performance testing often goes\
  \ hand-in-hand with both integration and unit testing, we’ll continue to use Maven\
  \ and specialized Unit Tests for this as well, along with open source tools where\
  \ needed.\n\n> **NOTE**\n> \n> There are many performance testing tools available,\
  \ and you can also write your own. While system-to-system and communications protocol\
  \ performance testing is completely optional for the purposes of this book, I’ll\
  \ cover it in more detail beginning in Part III, Chapter 5, where I’ll introduce\
  \ Locust ⁸, a tool you can use in your local environment to test scalability for\
  \ your solution. Locust allows for extensions that enable you to test many different\
  \ protocols and connection paradigms, which will be important for device-to-device\
  \ communications testing between your GDA and CDA.\n\n## Testing Tips for the Exercises\
  \ in this Book\n\nThe sample code provided for each exercise in this book includes\
  \ unit tests, which you can use to test the code you’ll write. These unit tests\
  \ are provided as part of the connected-devices-java and connected-devices-python\
  \ repositories you’ve already pulled into your new iot-gateway and iot-device (respectively)\
  \ projects are key to ensuring your implementation works properly.\n\nSome exercises\
  \ also have integration tests that you can use as-is, or modify to suit your specific\
  \ needs. I’ve also included some sample performance tests you can use to test how\
  \ well some of your code performs when under load.\n\nYour implementation of each\
  \ exercise should pass each provided unit test with 100% success. You’re welcome\
  \ to add more unit tests if you feel they’ll be helpful to verify the functionality\
  \ you develop. The integration tests and performance tests provided will be helpful,\
  \ but not required as part of each exercise.\n\nRemember, tests are your friend.\
  \ And, like a friend, they shouldn’t be ignored. They can surely be time consuming\
  \ to write and maintain, but any good friendship takes investment. These tests -\
  \ whether unit, integration, or performance - will help you validate your design\
  \ and verify your functionality is working properly.\n\n## Step III: Managing Your\
  \ Workflow - Requirements, Source Code, and CI/CD\n\nSo you’ve figured out how you\
  \ want to write your code and test it - great! But wouldn’t it be great if you could\
  \ manage all your requirements, source code, and CI/CD pipelines. Let’s tackle this\
  \ in our last step, which is all about managing your overall development process\
  \ workflow. This includes requirements tracking, source code management, and CI/CD\
  \ automation.\n\nYou’re probably sick of me saying that building IoT systems is\
  \ hard, and that’s largely because of the nature of the Edge Tier (since we often\
  \ have to deal with different types of devices, communication paradigms, operating\
  \ environments, security constraints, and so on). Fortunately, there are many modern\
  \ CI/CD tools that can be used to help navigate these troubled waters. Let’s look\
  \ at some selection requirements for these tools, and then explore how to build\
  \ out a CI/CD pipeline that will work for our needs.\n\nYour IoT CI/CD pipeline\
  \ should support secure authentication and authorization, scriptability from a Linux-like\
  \ command line, integration with Git and containerization infrastructure, and the\
  \ ability to run pipelines within my local environment as well as a cloud-hosted\
  \ environment.\n\nThere are many online services that provide these features, some\
  \ of which provide both free and paid service tiers. When you downloaded the source\
  \ code for this book, you pulled it from my GitHub ⁹ repositories using Git’s clone\
  \ feature. GitHub is an online service that supports overall developer workflow\
  \ management, including source code control (using Git), CI/CD automation, and planning.\n\
  \nEach exercise will build, test, and deploy locally, but also assume your code\
  \ is committed to an online repository using Git for source code management. You’re\
  \ welcome to use the online service of your choice, of course. For this book, all\
  \ examples and exercises will assume GitHub is being used. You can learn more about\
  \ GitHub’s features and create a free account on their website (https://github.com/).\n\
  \n> **NOTE**\n> \n> There are lots of great resources, tools and online services\
  \ available that let you manage your development work and set up automated CI/CD\
  \ pipelines. Read through this section, try things out, and then as you gain more\
  \ experience, choose the tools and service that works best for you.\n\n## Managing\
  \ Requirements\n\nAh yes - requirements. What are we building, who cares, and how\
  \ are we going to build it? Plans are good, are they not? And since they’re good,\
  \ we should have a tool that embraces goodness, which includes: task prioritization,\
  \ task tracking, team collaboration, and (maybe) integration with other tools.\n\
  \nRemember the code you cloned from my GitHub repository? Choose one - for example,\
  \ constraineddeviceapp, and open its URL in a web browser. You’ll notice that it\
  \ has some Issues (like, literally - there’s a column called ‘Issues’ on the main\
  \ page). If you click on ‘Issues’, you’ll see all the tasks (requirements) that\
  \ need to be implemented.\n\nEach task contains the instructions and other details\
  \ a developer (you) will need to write the code and make sure it works correctly.\n\
  \nSo far, so good, right? These tasks - at least in GitHub - can be organized into\
  \ a board, so that you can see all of the things that need to be implemented for\
  \ a project. You’ve probably heard of Agile 10 project management processes such\
  \ as Scrum and Kanban.\n\nOne of the workflow organizational approaches GitHub let’s\
  \ you select for a project is a Kanban-based electronic board. Kanban organizes\
  \ tasks as cards, which can then be placed into various columns within the board’s\
  \ workflow depending on their status. This is the approach we’ll use in the book\
  \ to track things that need to be done for each code repository.\n\nNOTE\nI’m managing\
  \ all of the activities for this book within a Kanban board, too. Each card on the\
  \ board represents a task I (or one of my team members) needs to complete. Cards\
  \ only move to ‘Done’ after Sarah approves (thanks Sarah!)\n\n\n\n\n\n这种方法非常强大，我想你会看到它如何帮助你组织需要完成的工作，并在阅读本书的过程中跟踪你的进度。\n\
  \n## 设置云项目和代码仓库\n\n本书实际上被组织成一个使用单个看板板跨代码仓库的大型物联网项目。每个代码仓库将有一组任务，这些任务与基于章节的里程碑保持一致，并映射回看板。\n\
  \n这种方法的优点是，一旦你的项目和代码仓库设置妥当，你真正需要做的就是在逐章编写、测试和提交代码的过程中更新任务状态。工作流引擎将自动解析你的任务更新，并为你代表任务的卡片在看板上显示。很\
  \ neat，不是吗？\n\n如果你有兴趣使用 GitHub 来设置所有这些，这里有一个简单的 3 步流程可供你开始使用：\n\n- 1. 创建一个 GitHub\
  \ 账户\n  - a. 如有需要，创建一个与 GitHub 账户关联的组织\n- 2. 在你的账户（或组织）内，创建以下内容：\n  - a. 一个名为 ‘Programming\

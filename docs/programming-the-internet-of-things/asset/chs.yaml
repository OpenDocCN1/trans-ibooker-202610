  \ origin {your new URL}\n```\n\n```\ngit commit -m \"Initial commit.\"\n```\n\n\
  ```\ngit push\n```\n\n- b. 重要：请确保对 ‘piot-java-components’ 和 ‘piot-python-components’\
  \ 都执行此操作，并为每个使用适当的 Git 代码仓库 URL！\n\n> NOTE\n> \n> 我写了一份指南来帮助你配置所有这些内容，位于本书的主页（https://programmingtheiot.com/programming-the-iot-book.html）。\n\

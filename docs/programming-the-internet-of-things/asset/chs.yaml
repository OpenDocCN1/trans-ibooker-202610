- "## Chapter 1. Setting Up Your Environment\n\n### A NOTE FOR EARLY RELEASE READERS\n\
  \n使用 Early Release 电子书，您可以在官方发布这些标题之前很长时间就利用这些技术——作者在写作时对其原始未编辑内容进行获取，以便您可以在这些技术正式发布之前利用它们。\n\
  \n这将是最终书籍的第 1 章。请注意，GitHub 仓库将在稍后激活。\n\n如果您对如何改进本书的内容和/或示例有任何评论，或者如果您注意到本章中缺少材料，请联系作者\
  \ aking.em@gmail.com。\n\n> *前方有一条路，*\n> \n> *荆棘丛生，然后变得清晰。*\n> \n> *快到了。耐心。*\n\n\
  **基本概念：** 确定要解决的问题领域并定义架构作为物联网解决方案的基础；设置支持多种部署选项的以物联网为中心的开发环境。\n\n您现在可能已经了解到，物联网可能非常庞大、难以控制且非常难以驯服。为了规划前进方向，我们首先需要确定要解决的问题领域，然后创建用于设计和构建物联网解决方案的架构。\n\
  \n让我们从几个关键问题开始，以建立基线：\n您要解决什么问题？它从哪里开始又在哪里结束？为什么需要物联网生态系统？所有这些部分将如何协同工作来解决这个问题？如果一切按设计运行，您可以期待什么结果？我们将详细探讨每一个问题，并在过程中构建一个满足我们需求的端到端集成物联网解决方案。\n\
  \n## 本章您将学到什么\n\n为了帮助您真正理解物联网系统应如何构建，我将深入探讨基于上述问题的一些基本架构概念，并以此作为每个编程活动的依据。从那里开始，您将构建一个逐层解决问题的解决方案，随着您完成后续每一章，添加更多功能。\n\
  \n不用说，当然，合适的开发工具可能会为您节省时间和挫折，而且还有助于测试、验证和部署。有许多优秀的开源和商业开发工具和框架可供您使用。\n\n如果您从事开发工作已有相当一段时间，我预计您有自己的特定开发环境偏好，最适合您的编程风格和方法。我当然也有我的偏好，而我在此章中展示的示例将基于我首选的一组工具，但我的目标不是指定您必须使用的工具，而是帮助您快速上手物联网开发，使您能够迅速开展工作并最终为未来的开发项目选择自己的工具。\n\
  \n我将介绍的概念才是最重要的——编程语言、工具（及其各自的版本）和方法可以更改。这些概念代表了一致软件开发的一些基本要素：系统设计、编码和测试。让我们深入探讨每一个，并朝着构建您的集成物联网系统迈进。\n\
  \n## 设计您的系统\n\n创建问题陈述可能是这个拼图中最重要的部分。让我们尝试通过起草一个相当直接但足以涵盖各种有趣物联网挑战的内容来实现：\n\n我想了解我家中的环境以及它如何随时间变化，并进行调整以提高舒适度同时节省资金。\n\
  \n看起来很简单，但这是一个非常广泛的目标。我们可以通过定义问题陈述中的关键动作和对象来缩小范围。我们的目标是分离“什么”、“为什么”和“如何”。让我们首先查看“什么”和“为什么”，并确定设计应在此过程中考虑的任何操作。\n\
  \n## 拆解问题\n\n本书中的练习将侧重于构建一个物联网解决方案，帮助您了解家庭环境并做出适当响应。假设您希望了解房屋内发生的事情（在合理范围内），并且如果有必要采取某种行动（即，如果温度过高，打开空调）。简单，对吧？\n\
  \n这种设计方法需要三个步骤：\n\n- 1. 收集数据\n\n让我们将其定义为可以感知的东西，例如温度、湿度等。这集中在 *telemetry*（测量数据）的捕获和传输上。操作，或更确切地说，操作类别，将简单地命名为\
  \ *data collection*\n  - 温度\n  - 相对湿度\n  - 大气压力\n  - 系统性能（CPU、内存、存储的利用率指标）\n\n-\
  \ 2. 确定相关变化\n\n为了决定哪些数据相关，以及值变化是否重要，我们不仅需要收集数据，还需要存储并对我们可感知的项目（例如温度、湿度，\n\n\n\n\
  等等，上面已指出)。让我们将此操作类别称为 *数据管理*。\n\n### 3. 执行操作\n\n我们将建立一些基本规则来判断是否跨越了任何重要阈值，这仅仅意味着如果某个阈值被跨越需要某种类型的操作，我们就会向某物发送信号（例如调高/调低恒温器）。我们将此操作类别称为\
  \ *系统触发*。\n\n## 定义相关结果\n\n现在我们知道了需要采取哪些步骤，让我们来探讨问题陈述的“为什么”部分。我们可以用以下两点来总结：\n\n-\
  \ 增加舒适度\n  理想情况下，我们希望在生活环境中保持一致的温度和湿度。当我们考虑房间数量、它们的使用方式等时，事情会变得稍微复杂一些。我们将此操作类别称为\
  \ *配置管理*，它与数据管理和系统触发两者紧密相关。\n\n- 节省开支\n  这有点棘手。最明显省钱的方法是不花钱！由于我们很可能需要分配财务资源来加热、冷却或加湿某个区域，我们希望进行优化——不要太多（浪费），也不要太少（我们可能会在冬季导致水管冻结）。由于我们可能需要处理一些复杂性——包括公用事业成本、季节变化等，以及与配置管理相关的任何内容——我们可能需要一些更高级的分析来处理这些问题。我们将此操作类别称为\
  \ **_analytics_**。\n\n你可能已经注意到，“什么”和“为什么”部分中的每个步骤都有一个操作类别名称，这将在我们进入“如何”时帮助解决方案设计。提醒一下，这些类别是：数据收集、数据管理、系统触发、配置管理和分析。我们将在实施方法中进一步深入探讨其中每一个。\n\
  \n尽管问题陈述在表面上看起来相当简单，但事实证明，你为解决该问题所需做的事情在许多物联网系统中其实相当常见。需要在源头收集数据，存储和分析这些数据，并在某些指标表明有益时采取行动。一旦你定义了物联网架构并开始构建实现它的组件——即使它特定于此问题——你会看到它可以应用于许多其他问题领域。\n\
  \n让我们快速看一下代表此决策过程的简单数据流，如图 1-1 所示。你会注意到每个操作类别都在图 1-1 所示的数据流图中突出显示：\n\nData Collection\n\
  \nTelemetry\n\nData Management\n\nAnalytics\n\nSystem Triggers\n\nNo Action\n\n\
  Time-Series Storage\n\nConfiguration Settings\n\nFigure 1-1. Simple IoT data flow\n\
  \n大多数物联网系统至少需要我提到的五个操作类别中的一些：数据收集、数据管理、分析、配置管理和系统触发。这意味着我们可以将这些映射到系统图中定义一个架构，然后开始创建实现系统一部分的软件组件。\n\
  \n这就是我们工程师开始变得有趣的地方，所以让我们开始定义一个可以支持我们问题陈述的架构定义（事实上，对其他问题也是可重用的）。\n\n## 架构设计解决方案\n\
  \n组织、结构和清晰度是良好架构的标志，但太多会使系统变得僵化，难以很好地扩展以满足未来的需求。而且如果我们试图建立一个能够满足我们所有合理需求的架构，我们永远也完不成（或也许甚至从未开始）！这关乎平衡，所以让我们在定义架构时考虑到未来的灵活性，但同时也保持相对良好的边界。这将使你能够快速实现解决方案，同时仍允许未来进行更新。但首先，有几个关键术语需要定义，以帮助建立构建解决方案的基础架构构造。\n\
  \n正如你可能从前言中的图 0-1 回忆的那样，物联网系统通常至少考虑到两个（有时三个或更多）架构层。这允许在物理和逻辑上分离功能，从而允许灵活的部署方案。所有这些只是说，云层中运行的云服务——从技术上讲——可以在世界任何地方，而边缘层中运行的设备必须与要测量的物理系统位于同一位置。就像图\
  \ 0-1 所暗示的那样，此分层的示例可能包括具有传感器或执行器的受限设备与网关设备通信，后者反过来与基于云的服务通信，反之亦然。\n\n由于我们需要一个地方来实现这五个类别的功能，确定它们在架构中的位置很重要，这样我们就可以让一些东西运行在行动发生的地方附近，而另一些则运行在云中，你和我可以轻松访问（甚至调整）功能。回顾前言中的边缘层和云层架构，让我们看看如何将“什么”和“为什么”中的每个操作类别映射到其中：\n\
  \n- Edge Tier（受限设备和网关设备）：数据收集、数据管理、设备触发、配置管理和分析。\n- Cloud Tier（云服务）：数据管理、配置管理和系统分析。\n\
  \n为什么边缘层和云层包含相似的功能？首先，让我们看看我们的流程图如何融入分层架构中：\n\n![](img/051213a7a9851bf581895f86e6a2becd_47_0.png)\n\
  \n## Edge Tier\n\n## Cloud Tier\n\nFigure 1-2. - Notional IoT data flows between\
  \ the Edge and Cloud Tiers\n\n再次注意，我们有一些共享责任，其中一些操作类别在两个层中都实现。通常，工作重复是不好的——但在这种情况下，它可能是一个优势！简单的分析可以基于一些简单设置触发设备，如果有必要——例如，如果你家中的温度超过\
  \ 80o F，你很可能希望立即触发 HVAC 并开始将温度降至例如 72o F。没有必要依赖云层中的远程基于云的服务来执行此操作，尽管通知云层正在发生此事并可能存储一些历史数据以供以后分析会很有用。\n\
  \n我们的架构开始成形。现在我们只需要一种方法将其映射到系统图，以便我们可以与物理世界（使用传感器和执行器）交互。最好也在我们的边缘层内结构化事物，以避免不必要地将组件暴露给互联网。这可以通过使用具有专用软件应用程序的受限设备来管理，该应用程序可以直接在设备上运行，或在笔记本电脑或其他通用计算系统上运行，模拟逻辑可以模拟传感器和执行器行为。\n\
  \n由于你最终希望访问互联网，你的设计应包括一个网关来处理此事和其他需求。此功能可以作为在网关设备上运行的软件应用程序的一部分来实现（或再次，在笔记本电脑或其他通用计算系统上）。你的网关设备和受限设备将构成你物联网设计的“边缘”，我将此称为你架构的边缘层。\n\
  \n我们还希望以安全但可从网关设备以及人类访问的方式部署分析服务、存储功能和事件管理器。有很多方法可以做到这一点，但我们将专注于一个（或多个）云服务来实现此功能。\n\
  \n图 1-3 提供了一个新视图，将进一步深入了解你将要构建的内容以及如何开始整合我已经提到的五个操作类别。它代表了云层中的云服务（灰色框），以及边缘层中的两个应用程序——CDA\
  \ 和 GDA——将实现以包含你的受限设备和网关设备的功能，分别。\n\n\n\n\n\n![](img/051213a7a9851bf581895f86e6a2becd_50_0.png)\n\
  \nFigure 1-3. - Notional IoT simplified logical architecture with Edge and Cloud\
  \ Tiers\n\n让我们进一步深入探讨每一部分：\n\n- Constrained Device App (CDA)\n  你将构建此软件应用程序以在受限设备（仿真或实际）中运行，它将提供数据采集和系统触发功能。它将处理设备传感器（从环境读取数据）与执行器（触发动作，例如打开或关闭恒温器）之间的接口。它还将在需要执行动作时发挥作用。最终，它将连接到通信库以向网关设备应用程序发送消息并从其接收消息。\n\
  - Gateway Device App (GDA)\n  你将构建此软件应用程序以在网关设备（仿真或实际）中运行，它将提供数据管理、分析和配置管理功能。其主要作用是管理数据以及\
  \ CDA 与存在于云层中的云服务之间的连接。它会根据需要本地管理数据，有时通过向受限设备发送命令来触发执行动作。它还将管理部分配置设置，即代表你环境正常值的那些设置，并在接收到新的遥测数据时执行一些简单分析。\n\
  - Cloud Services\n\n所有云服务应用程序和功能都执行繁重的数据处理和存储工作，因为它们理论上可以无限扩展。这仅仅意味着，如果设计良好，你可以添加任意数量的设备，存储任意数量的数据，并对这些数据进行深入分析——趋势、最高值、最低值、配置值等，同时将任何相关见解传递给人类终端用户，甚至可能根据任何定义的阈值越限生成边缘层动作。从技术上讲，物联网环境中的云服务可以处理之前提到的所有动作类别，除了数据采集（即，它们不直接执行传感或执行动作）。你将构建一些云服务来处理此功能，但主要利用云服务提供商已提供的通用服务。\n\
  \n![](img/051213a7a9851bf581895f86e6a2becd_53_0.png)\n\nFigure 1-4. - Notional IoT\
  \ detailed logical architecture with Edge and Cloud Tiers\n\n将所有内容整合到详细逻辑架构中，图 1-4\
  \ 显示了我们在两个架构层中的每个主要逻辑组件如何相互交互。我们将使用这两个图表（图 1-3 和图 1-4）作为本书所有练习的基础架构。\n\n现在我们已经了解了我们面临的情况，让我们设置开发环境，以便开始编写代码。\n\
  \n## Building, Testing and Deploying Software for the IoT\n\n在不同的操作系统、硬件配置和配置系统之间构建和部署代码绝非易事。对于典型的物联网项目，我们不仅要处理不同的硬件组件，还要处理在这些平台上开发和部署的多种方式，更不用说我们在其中工作的各种云服务提供商环境的持续集成/持续部署（CI/CD）特殊性了。\n\
  \n面对所有这些挑战，我们如何开始？首先——我们要解决什么问题？作为一名开发人员，你希望将物联网设计实现为代码，对其进行测试，将其打包成可轻松分发到一个或多个系统的形式，并安全地部署它。我们可以将开发挑战分为两个构建、测试和部署阶段，这恰好映射到我们的架构分层：边缘层环境和云层环境。我们将在第\
  \ 10 章开始深入研究云层内的功能。目前，我们仅关注边缘层。\n\n尽管我们的边缘层最终将有专门的硬件来处理，但我们可以在本地开发环境中模拟这些硬件组件的某些方面。这将使部署变得容易得多，并且对于本书中的所有练习都完全足够，除了第\
  \ 4 章，我将在本章后面提到它，并且是可选的。\n\n有许多方法可以开始物联网开发，但我们将重点关注三条具体路径：一条是纯粹仿真的，我之前提到过，除了第 4\
  \ 章外，其余部分都足够。其他两条需要物联网专用硬件，将在第 4 章中更深入讨论。\n\n## Integrated Simulated Deployment\n\
  \n这种方法不需要任何专用设备，允许你使用开发工作站（笔记本电脑）作为网关设备和受限设备。这意味着你将在本地计算环境中运行 GDA 和 CDA。你将通过构建简单的软件模拟器来模拟传感和执行硬件，以在\
  \ CDA 中捕获此功能。除了第 4 章中的练习外，所有练习都可以使用此部署方法工作。\n\n## Separated Physical Deployment\n\
  \n这需要一个硬件设备，例如 Raspberry Pi，满足下面列出的硬件标准，使你能够连接和与真实传感器和执行器交互。尽管许多现成的单板计算机（SBC）设备可用作功能齐全的计算工作站，我将将其称为你的受限设备，并且它将直接在设备上运行你的\
  \ CDA。与模拟方法一样，你将在本地计算环境中运行 GDA。\n\n> **NOTE**\n> \n> 互联网工程任务组（IETF）的请求评论文档 RFC 7228\
  \ 定义了各种受限设备（也称为受限节点）类别。这些类别包括 Class 0（非常受限）、Class 1（受限）和 Class 2（ somewhat 受限）。¹\
  \ 对于我们的目的，我们假设我们的 CDA 可以在 Class 2 或更强大的设备上运行，这些设备通常支持完整的基于 IP 的网络协议栈，这意味着我们将在本书中处理的协议通常适用于此类设备。尽管从技术上讲可以将\
  \ Class 2 设备直接连接到互联网，但我们所有的示例和练习都将通过 GDA 间接与互联网交互。\n\n## Blended Physical Deployment\n\
  \n这种方法几乎与分离部署方法相同，但会将你的 CDA 和 GDA 都运行在 SBC 设备上（例如 Raspberry Pi 或其他类似系统）。这在技术上意味着你可以选择将每个应用程序部署到不同的\
  \ SBC，尽管对于列出的任何练习来说都不是必要的。\n\n如果你选择部署路径 B 或 C，有许多种价格低廉的 SBC 可供选择。像选择我们的设备应具有通用目的输入/输出（GPIO）功能，至少一个可用的集成电路间（I2C）总线，通过\
  \ Wi-Fi 或以太网支持 TCP/IP 和 UDP/IP 网络，运行基于 Linux 的通用操作系统，例如 Debian（或其衍生版如 Raspbian），并支持\
  \ Python 3 和 Java 11（或更高版本）。\n\n尽管你可以选择任何适合你需求的 SBC，但本书中的练习将重点关注集成仿真部署路径，当然除了第 4\
  \ 章。 第二部分介绍了与物理世界集成的概念，我将专门用第 4 章来讨论使用实际硬件的这种集成。虽然原则适用于许多 SBC，但任何硬件特定的集成都将集中在 Raspberry\
  \ Pi 平台上——具体来说是 Raspberry Pi 3 Model B+、Model 4 Model B 以及最新版本的 Raspberry Pi Zero\
  \ W。\n\n无论选择哪种部署路径，所有练习和示例都假设你将在单个工作站上进行开发和部署。这涉及一个三步流程，包括准备开发环境、定义测试策略以及确定构建和部署自动化方法。我将在本章中介绍这些步骤的基础知识，但也会逐步补充\n\
  \n\n\n你会在后续的练习中深入研究那些具有额外依赖项、测试和自动化需求的练习。\n\n> **NOTE**\n> \n> 如本节前面所述，对“在单一工作站上开发”这一假设的例外是第\
  \ 4 章中的练习，在那里我将讨论在真实硬件上的实现和部署。再次强调，这仅在你计划遵循部署路径 B 和 C 时才适用，否则，你的所有 Edge Tier 代码都将在你的本地开发工作站上部署和运行。\n\
  \n## Step I: Prepare Your Development Environment\n\n请记住，你的 CDA 将用 Python 编写，而你的\
  \ GDA 将用 Java 编写。让我们确保你的工作站已安装好支持这些语言及其相关依赖项所需的内容，按照以下步骤操作。\n\n- 1. 在你的工作站上安装 Python\
  \ 3.7 或更高版本（截至本文撰写时最新版本为 3.8.2）。你可以使用以下步骤检查是否已安装，或在未安装时进行安装：\n  - 打开一个终端或控制台窗口，并输入：\n\
  \    `$ python3 -version`\n  - 它应返回类似以下内容：\n    `Python 3.7.6`\n\n```\n$ python3\
  \ -version\n```\n\n```\nPython 3.7.6\n```\n\n- 如果你收到错误（例如“not found”），你需要安装 Python\
  \ 3.7 或更高版本。按照 https://www.python.org/downloads/ 上针对你的操作系统（Windows、Mac、Linux）的说明进行操作。\n\
  \n2. 通过下载位于 https://bootstrap.pypa.io/get-pip.py 的脚本来安装 pip。\n\na. 使用 Python 执行\
  \ pip 安装。打开一个终端或控制台窗口，并输入：\n\n```\n$ python3 get-pip.py\n```\n\n3. 确保你的工作站上已安装 Java\
  \ 11 或更高版本（截至本文撰写时 OpenJDK 的最新版本为 Java 14）。你可以使用以下步骤检查是否已安装，或在未安装时进行安装：\n\na. 打开一个终端或控制台窗口，并输入：\n\
  \n```\n$ java -version\n```\n\nb. 它应返回类似以下内容（确保至少为 Java 8）\n\n```\njava 13.0.1 2019-10-15\n\
  \nJava(TM) SE Runtime Environment (build 13.0.1+9)\n\nJava HotSpot(TM) 64-Bit Server\
  \ VM (build 13.0.1+9, mixed mode, sharing)\n```\n\nc. 如果你收到错误（例如“not found”），你需要安装\
  \ Java 11 或更高版本。按照 https://openjdk.java.net/install/ 上针对你的平台（Windows、MacOS 或 Linux）的说明进行操作。\n\
  \n4. 安装 Git。前往 https://git-scm.com/book/en/v2/Getting-Started-Installing-Git 并查看针对你特定操作系统的说明。\n\
  \n> NOTE\n> \n> 本书中任何练习的前提，以及设置你的开发环境的前提，都是对 Git——一种源代码管理和版本控制工具——的基本理解。许多 IDE（包括\
  \ Eclipse）已通过嵌入式 Git 客户端启用了源代码管理。在之前的步骤中，你已通过命令行安装了 Git，以便独立于 IDE 运行 Git 命令。有关从命令行使用\
  \ Git 的更多信息，请参阅 https://git-scm.com/docs/gittutorial。\n\n> TIP\n> \n> 你可以在本地开发工作站上将\
  \ Git 用作独立的源代码管理工具，并使用各种免费和商业服务在云中管理你的源代码。GitHub² 是我使用的服务，我将利用该平台提供的一些功能来支持 CI/CD\
  \ 管道，或工作流步骤，让你能够自动化构建、测试、打包和部署过程。\n\n5. 创建一个工作开发目录，并下载本书的源代码和单元测试：\n\n- a. 打开一个终端或控制台窗口，创建一个新的工作开发目录，然后切换到该目录。输入以下内容：\n\
  \  i. Linux/macOS:\n    `mkdir $HOME/programmingtheiot`\n    `cd $HOME/programmingtheiot`\n\
  \  ii. Windows:\n    `mkdir C:\\programmingtheiot`\n    `cd C:\\programmingtheiot`\n\
  \n- b. 通过输入以下内容克隆本书的以下两个源代码仓库：\n  `$ git clone https://github.com/programmingtheiot/python-components.git`\n\
  \  `$ git clone https://github.com/programmingtheiot/java-components.git`\n\n###\
  \ 6. Install and configure virtualenv using pip ³\n\n- a. 打开一个终端或控制台窗口。切换到你刚刚从 GitHub\
  \ 克隆的 constraineddeviceapp 代码的目录，并通过输入以下内容安装 virtualenv：\n  i. Linux/macOS:\n  \
  \  `$ pip install virtualenv`\n  ii. Windows:\n\n```\nC:\\programmingtheiot> pip\
  \ install virtualenv\n```\n\nb. 为你的环境配置 virtualenv。切换到你刚刚从 GitHub 克隆的 constraineddeviceapp\
  \ 代码的目录，并输入以下内容：\n\n- i. Linux/macOS\n\n```\n$ cd $HOME/programmingtheiot/python-components\n\
  \n$ virtualenv -p python3 .venv\n\n$ . .venv/bin/activate\n\n(venv) $ pip install\
  \ -r basic_imports.txt\n```\n\n- ii. Windows\n\n```\ncd C:\\programmingtheiot\\\
  python-components\n\nC:\\programmingtheiot\\python-components> virtualenv -p C:\\\
  PathToYourPythonExecutable\\python.exe .venv\n\nC:\\programmingtheiot\\python-components>\
  \ .venv\\Scripts\\activate.bat\n\n(.venv) C:\\programmingtheiot\\python-components>\
  \ pip install -r basic_imports.txt\n```\n\nc. 你的 virtualenv 环境现已设置好，你的终端正在 virtualenv\
  \ 中运行。你可以轻松地从命令行使用 activate 脚本激活 virtualenv，然后使用 deactivate 命令停用它：\n\n- i. Linux/macOS\n\
  \n```\n$ . .venv/bin/activate\n(venv) $ deactivate\n```\n\n- ii. Windows\n\n```\n\
  C:\\programmingtheiot\\python-components>\n.venv\\Scripts\\activate.bat\n\n(.venv)\n\
  C:\\programmingtheiot\\python-components> deactivate\n```\n\n此时，你的开发工作站已基本配置完成，让我们深入到下一节，安装一些额外的工具以使开发过程更加顺畅。\n\
  \n## Configuring an Integrated Development Environment (IDE)\n\n有许多优秀的工具和 IDE 可帮助你这位开发者编写、测试和部署用\
  \ Java 和 Python 编写的应用程序。有一些工具我非常熟悉，并且能很好地满足我的开发需求。我猜你也是如此，并且有自己的工具偏好。使用哪种工具集并不重要，只要它们满足一些基本要求即可。对我来说，这些包括代码高亮和补全、代码格式化和重构、调试、编译和打包、单元和其他测试，以及源代码控制。\n\
  \n市场上有很多很棒的 IDE——既有商业的也有开源的，选择权在你。我使用 Eclipse IDE 4 并安装了 PyDev 5 来开发本书中的示例，因为它满足了我指定的要求，并提供了我在开发项目中经常使用的许多其他便捷功能。\n\
  \n如果你已经熟悉使用不同的 IDE 编写、测试和管理软件应用程序，那么本节的大部分内容对你来说可能已是老生常谈。然而，我还是建议你阅读它，因为本节为你的 GDA\
  \ 和 CDA 的开发奠定了基础。\n\n> NOTE\n> \n> 我在我的网站上为我的 Connected Devices 课程的学生维护了有关使用 Programming\
  \ the IoT 设置 Eclipse with PyDev 的详细说明。你可以在本书网站 https://programmingtheiot.com/programming-the-iot-book.html\
  \ 上找到更多详细信息。\n\n## Setup Your GDA Project\n\n此过程的第一步是安装最新的 Eclipse IDE for Java\
  \ development。你可以在 https://www.eclipse.org/downloads/ 找到 Eclipse 的最新下载链接。你会注意到有许多不同的\

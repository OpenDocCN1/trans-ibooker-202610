  \ Stopping GDA...\nJul 19, 2020 1:01:38 PM\nprogrammingtheiot.gda.system.SystemPerformanceManager\n\
  \  stopManager\nINFO: SystemPerformanceManager is stopped.\nJul 19, 2020 1:01:38\
  \ PM\nprogrammingtheiot.gda.app.GatewayDeviceApp\nstopApp\nINFO: GDA stopped successfully\
  \ with exit code 0.\n```\n\n简单，对吧？请注意测试要求——它不是针对 SystemPerformanceManager 的；您只是重新运行名为\
  \ testRunGatewayApp() 的 GatewayDeviceAppTest 单元测试。此测试和 SystemPerformanceManager\
  \ 测试均未更改——两者之间的连接现在已启用，因此输出略有不同。\n\n在两个组件集成后，让我们构建实际的系统性能遥测收集逻辑。\n\n## CREATE THE\
  \ SYSTEMCPUUTIL TASK MODULE\n\n这是我们系统性能应用程序真正开始发挥作用的地方。SystemCpuUtilTask 将检索所有核心的当前\
  \ CPU 利用率，对其进行平均，并将结果作为 float 返回。\n\n让我们将其命名为 PIOT-CDA-02-004 - Create module SystemCpuUtilTask。以下是说明内容：\n\
  \n### Description\n\n- 创建 SystemCpuUtilTask 模块并实现检索 CPU 利用率的功能。\n\n### Actions\n\
  \n- 在 programmingtheiot.gda.system 包内，创建一个名为 SystemCpuUtilTask 的新 Java 类。\n- 添加以下导入语句：\n\
  - import java.lang.management.ManagementFactory;\n- 添加公共的 getTelemetry() 方法。它将检索\
  \ CPU 利用率（在任何/所有核心上平均）并将值作为 float 返回。使用以下代码作为值：ManagementFactory.getOperatingSystemMXBean().getSystemLoadAverage()\n\
  \n### Estimate (Small = < 2 hrs ; Medium = 4 hrs ; Large = 8 hrs )\n\n- Small\n\n\
  ### Tests\n\n- 运行 SystemCpuUtilTaskTest 单元测试（只有一个）。如果您的操作系统支持检索 CPU 负载，每个测试都应通过，同时显示大于\
  \ 0.0% 且（可能）小于 100.0% 的值。如果您的\n\n\n\nOperating System doesn’t support this, each\
  \ test will result in negative value, as follows:\n\n```\nTest 1: CPU Util not supported\
  \ on this OS: -1.0\nTest 2: CPU Util not supported on this OS: -1.0\nTest 3: CPU\
  \ Util not supported on this OS: -1.0\nTest 4: CPU Util not supported on this OS:\
  \ -1.0\nTest 5: CPU Util not supported on this OS: -1.0\n```\n\n#### NOTE\n\n你可能还记得\
  \ psutil 是你在设置 virtualenv 环境时导入的库之一，并且使用 pip 安装了 basic_imports.txt。这个库使你能够监控系统指标，例如\
  \ CPU 利用率和内存利用率。你可以在网上阅读其所有功能（https://psutil.readthedocs.io/en/latest/#）。\n\n仔细查看指定以下代码行的操作：\n\
  \n```\npuUtilPct = self.perfMgr.cpu_percent()\n```\n\n该库会将所有核心聚合为单一的 CPU 百分比，这对你作为开发者来说非常方便。这个类本质上就是返回这一行代码的值的简化。\n\
  \n好吧，在我们继续之前，为什么要在代码周围加上花哨的包装？这不是过度设计吗？简单来说，是的。但你会看到一种模式在形成，你将用类似的代码来表示其他更复杂的传感器。\n\
  \n每个练习的一个目标是建立 *控制分离* 的模式，或将关键功能分离，以便它们可以与应用程序其余逻辑分开管理和更新。\n\n> **NOTE**\n> \n>\
  \ 就像任何软件设计一样，复杂性、巧妙编码和直接完成工作之间存在平衡。我将在整本书中尝试把握这种平衡。你可能有不同的想法——太好了！我鼓励你考虑如何以其他方式实现每个练习以满足你的特定需求。这正是编程富有创造性和乐趣所在。\n\
  \n## CREATE THE SYSTEMMEMUTILTASK MODULE\n\n我相信你已经注意到了这里的模式。我们正在 CDA 中复制的一些功能也在\
  \ GDA 中复制。这是由分布式物联网设备以及各种操作系统或运行时环境的性质决定的，正如我在前言中提到的。\n\n下一个任务是创建内存利用率收集逻辑。让我们将其命名为\
  \ *PIOT-GDA-02-005 - Create module SystemMemUtilTask*，并使用以下内容作为描述：\n\n### Description\n\
  \n- 创建 SystemMemUtilTask 模块并实现检索 JVM 内存利用率的功能。\n\n### Actions\n\n- 在 programmingtheiot.gda.system\
  \ 包中，创建一个名为 SystemMemUtilTask 的新 Java 类。\n- 添加以下 import 语句：\n- import java.lang.management.MemoryUsage;\n\
  - 添加 getTelemetry() 方法。它将检索 JVM 内存利用率并以 float 形式返回该值。使用以下代码作为值：ManagementFactory.getMemoryMXBean().getHeapMemoryUsage().getUsed()\n\
  \n### Estimate (Small = < 2 hrs ; Medium = 4 hrs ; Large = 8 hrs )\n\n- Small\n\n\
  ### Tests\n\n- 运行 SystemMemUtilTaskTest 单元测试。它应该通过并记录 0.0% 到 100.0% 之间的值。\n\n关键功能封装在以下代码行中：\n\
  \n```\nmemUtilPct = self.perfMgr.virtual_memory().percent\n```\n\n你可以从对 virtual_memory()\
  \ 的调用中提取其他属性，并且欢迎你进行实验。现在，只需返回百分比利用率即可。\n\n确保你的 SystemMemUtilTaskTest JUnit 测试全部通过后再继续。现在，让我们将\
  \ SystemCpuUtilTask 和 SystemMemUtilTask 都连接到 SystemPerformanceManager。\n\n## RUNNING\
  \ REPEATABLE TASKS IN JAVA\n\n虽然你的 GDA 并没有收集传感器数据，但它显然需要收集和评估其自身的系统性能（例如 CPU 和内存利用率，当然）。这种类型的功能通常在后台以固定间隔收集，就像\
  \ Python 一样，Java 提供了创建轮询系统的选项。\n\n幸运的是，没有必要导入任何单独的库，因为这是内置于核心 Java SDK 中的。\n\n####\
  \ NOTE\n\nJava 的并发库非常强大，允许你使用基本的 Timer 功能以及 ScheduledExecutorService（如果你真的想，当然也可以创建自己的线程轮询系统）。我们将使用\
  \ ScheduledExecutorService，因为它提供了一种半保证的方式以固定间隔轮询，为我们处理了大部分复杂性。现代 Java 虚拟机会在 CPU\
  \ 架构上处理负载分配，意味着如果可能的话它将利用多个核心。\n\n## INTEGRATING SYSTEMCPUUTIL TASK AND SYSTEMMEMUTIL\
  \ TASK WITH SYSTEMPERFORMANCEMANAGER\n\n在本节中，你将创建两个非常相似的任务：*PIOT-GDA-02-006 - Connect\
  \ SystemCpuUtilTask and SystemMemUtilTask to SystemPerformanceManager。*\n\n这个练习涉及的内容稍微多一些，即使完成它不需要太多代码行。这是因为你将同时使用并发和\
  \ *Runnable* 实现，\n\n后者只是一个接口定义，用于可以由 Java 线程一次或多次调用的方法。\n\n让我们使用以下描述来记录这项工作：\n\n\
  ### Description\n\n- 将 SystemCpuUtilTask 和 SystemMemUtilTask 连接到 SystemPerformanceManager，并在管理器启动时启动的线程中调用每个实例的\
  \ handleTelemetry() 方法，并在管理器停止时停止。此工作应在 SystemPerformanceManager 类中实现。\n\n### Actions\n\
  \n- 添加以下 import 语句：\n\n```\nimport java.util.concurrent.Executors;\nimport java.util.concurrent.ScheduledExecutorService;\n\
  import java.util.concurrent.ScheduledFuture;\nimport java.util.concurrent.TimeUnit;\n\
  ```\n\n- 向类添加以下成员：\n\n```\nprivate ScheduledExecutorService schedExecSvc = null;\n\
  private SystemCpuUtilTask sysCpuUtilTask = null;\nprivate SystemMemUtilTask sysMemUtilTask\
  \ = null;\nprivate Runnable taskRunner = null;\nprivate boolean isStarted = false;\n\
  ```\n\n- 创建一个名为 handleTelemetry() 的公共方法，包含以下内容：\n  - cpuUtilPct = this.cpuUtilTask.getTelemetry()\n\
  \  - memUtilPct = this.memUtilTask.getTelemetry()\n  - 记录一条包含 cpuUtilPct 和 memUtilPct\
  \ 值的 info 消息\n\n- 在构造函数中，添加以下内容：\n\n```\nthis.schedExecSvc =\nExecutors.newScheduledThreadPool(1);\n\
  this.sysCpuUtilTask = new SystemCpuUtilTask();\nthis.sysMemUtilTask = new SystemMemUtilTask();\n\
  this.taskRunner = () -> {\n    this.handleTelemetry();\n};\n```\n\n- 在 startManager()\
  \ 方法中，添加以下内容：\n\n```\nif (! this.isStarted) {\n    ScheduledFuture<?> futureTask\
  \ =\n    this.schedExecSvc.scheduleAtFixedRate(this.taskRunner,\n    0L, this.pollSecs,\
  \ TimeUnit.SECONDS);\n    this.isStarted = true;\n}\n```\n\n- 在 stopManager() 方法中，添加以下内容：\n\
  \  - this.schedExecSvc.shutdown();\n\n### Estimate (Small = < 2 hrs ; Medium = 4\
  \ hrs ; Large = 8 hrs )\n\n- Medium\n\n### Tests\n\n- 在 GatewayDeviceAppTest 测试用例中，注释掉\
  \ testRunGatewayApp() 单元测试前的 @Test 注解，并取消注释 testRunTimedGatewayApp 单元测试前的 @Test\
  \ 注解。运行后者测试——它应产生与以下类似的输出：\n\n```\nJul 19, 2020 1:53:19 PM\nprogrammingtheiot.gda.app.GatewayDeviceApp\
  \ <init>\nINFO: Initializing GDA...\nJul 19, 2020 1:53:19 PM\nprogrammingtheiot.gda.app.GatewayDeviceApp\n\
  parseArgs\nINFO: No command line args to parse.\nJul 19, 2020 1:53:19 PM\nprogrammingtheiot.gda.app.GatewayDeviceApp\n\
  initConfig\nINFO: Attempting to load configuration: Default.\nJul 19, 2020 1:53:19\
  \ PM\nprogrammingtheiot.gda.app.GatewayDeviceApp\nstartApp\nINFO: Starting GDA...\n\
  Jul 19, 2020 1:53:19 PM\nprogrammingtheiot.gda.system.SystemPerformanceManager\n\
  \  startManager\nINFO: SystemPerformanceManager is starting...\nJul 19, 2020 1:53:19\
  \ PM\nprogrammingtheiot.gda.app.GatewayDeviceApp\nstartApp\nINFO: GDA started successfully.\n\
  Jul 19, 2020 1:53:20 PM\nprogrammingtheiot.gda.system.SystemPerformanceManager\n\
  \  handleTelemetry\nINFO: Handle telemetry results: cpuUtil=-1.0,\nmemUtil=6291456.0\n\
  Jul 19, 2020 1:53:50 PM\nprogrammingtheiot.gda.system.SystemPerformanceManager\n\
  \  handleTelemetry\nINFO: Handle telemetry results: cpuUtil=-1.0,\nmemUtil=6291456.0\n\
  Jul 19, 2020 1:54:20 PM\nprogrammingtheiot.gda.system.SystemPerformanceManager\n\
  \  handleTelemetry\nINFO: Handle telemetry results: cpuUtil=-1.0,\nmemUtil=6291456.0\n\
  ```\n\n\n\n\n```\nINFO: Handle telemetry results: cpuUtil=-1.0,\nmemUtil=6291456.0\n\
  Jul 19, 2020 1:54:24 PM\nprogrammingtheiot.gda.app.GatewayDeviceApp\nstopApp\nINFO:\
  \ Stopping GDA...\nJul 19, 2020 1:54:24 PM\nprogrammingtheiot.gda.system.SystemPerformanceManager\n\
  stopManager\nINFO: SystemPerformanceManager is stopped.\nJul 19, 2020 1:54:24 PM\n\
  programmingtheiot.gda.app.GatewayDeviceApp\nstopApp\nINFO: GDA stopped successfully\
  \ with exit code 0.\n```\n\n要测试所有这些新功能，你只需要运行名为 testRunTimedGatewayApp() 的 GatewayDeviceAppTest\
  \ 单元测试。按照上面“Test”部分列出的说明进行操作。\n\n#### NOTE\n\nJUnit 单元测试可以通过在单元测试方法前使用 @Test 注解来包含或排除在一次测试运行中。你可以根据需要简单地将其注释掉/取消注释。还请注意，单元测试并非设计为按特定顺序运行——你应该预期任何随机顺序，并将你的测试编写为独立的。\n\
  \n示例输出已在上方提供——请注意它相当详尽！这是因为你不仅在做很多很酷的事情，而且还让应用运行了超过一分钟。\n\n如果你的测试运行产生类似的输出，太棒了！现在你可以真正庆祝了。你刚刚完成了\
  \ IoT Edge Tier 两个应用的第一次迭代——GDA 和 CDA。本书的其余部分将介绍如何为这些应用添加功能，将它们连接起来，并最终将一切连接到云服务。系好安全带！\n\
  \n## Additional Exercises\n\n图 2-5 表明 GDA 实际上拥有不止两个遥测收集任务。这些是可选的，但仍然很重要。尝试使用 SystemCpuUtilTask\
  \ 和 SystemMemUtilTask 的模式添加 SystemDiskUtilTask、SystemNetInTask 和 SystemNetOutTask\
  \ 组件。\n\n事实上，为 CDA 也实现这些组件并不是一个坏主意，尽管相关性较低，因为你的 CDA 不会收集和存储太多数据。\n\n不要忘记为每个组件添加你的单元测试用例！\n"

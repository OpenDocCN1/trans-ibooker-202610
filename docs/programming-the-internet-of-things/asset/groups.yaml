    Now that we have a handle on what we’re up against, let’s get our development
    environment setup so we can start slinging code.


    # Building, Testing and Deploying Software for the IoT


    Building and deploying code across different operating systems, hardware configurations,
    and configuration systems is no walk in the park. With typical IoT projects, we
    not only have to deal with different hardware components, but the myriad ways
    to develop and deploy across these platforms, not to mention the various Continuous
    Integration / Continuous Deployment (CI/CD) idiosyncrasies with the various cloud
    service provider environments we often work within.


    With all these challenges, how do we even get started? First things first - what
    problem are we trying to solve? As a developer, you want to implement your IoT
    design in code, test it, package it into something that can be easily distributed
    to one or more systems, and deploy it safely. We can think of our'
  - '[PAGE 55]


    development challenges in two build, test and deploy phases, that just so happen
    to map to our architectural tiering: Edge Tier Environment and Cloud Tier Environment.
    We’ll dig into the functionality within the Cloud Tier beginning in Chapter 10.
    For now, we’ll focus just on our Edge Tier.


    Although our Edge Tier will eventually have specialized hardware to deal with,
    we can simulate some aspects of these hardware components within our local development
    environment. This will make deployment much easier and is perfectly fine for all
    the exercises in this book except for Chapter 4, which I’ll touch on later in
    this chapter and is optional.


    There are many ways to get up and running with IoT development, but we’ll focus
    on three specific paths: One is purely simulated, and as I mentioned previously
    is sufficient for all but Chapter 4. The other two require IoT-specific hardware
    and will be discussed in more depth in Chapter 4.


    # Integrated Simulated Deployment


    This approach doesn’t require any specialized device, and allows you to use your
    development workstation (laptop) as both gateway device and constrained device.
    This means you’ll run your GDA and CDA in your local computing environment. You’ll
    emulate your sensing and actuation hardware by building simple software simulators
    to capture this functionality within your CDA. All exercises, with the exception
    of those in Chapter 4, will work using this deployment approach.'

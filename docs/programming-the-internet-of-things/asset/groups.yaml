    Devices course for the past three years. This book is the formalization of these
    lecture notes, presentations, examples, and lab exercises, structured in much
    the same way as my course.


    The original class was designed as an introduction to the IoT, but with student
    input and suggestions from my Teaching Assistants, it quickly morphed into an
    advanced, project-oriented software development course designed as one of the
    final required classes for students wrapping up their Master’s in the Cyber Physical
    Systems department of Northeastern University. The goal of the course is to establish
    a strong baseline of IoT knowledge to help students move from academia into industry,
    bringing foundational IoT skills and knowledge into their respective organizations.


    This book is structured so it can be used as a reference guide or even as a major
    component of a complete curriculum to help you with your own IoT-related course.
    The content is focused on constructing an end-to-end, open and integrated IoT
    solution, from device to cloud, using a ‘learn as you build’ approach to teaching.
    Since each chapter builds upon the previous, you can use this book to guide your
    students in building their own platform from the ground up.


    You can remain up to date on exercises and other relevant content useful for teaching
    and explaining concepts on the book’s website (https://programmingtheiot.com/programming-the-iot-book/).


    ## To the Technology Manager and Executive


    The contents of this book should help you better understand the integration challenges
    inherent with any IoT project and provide insight into the skillsets required
    to help your technology team(s) succeed across your IoT initiatives.


    If you’re part of this group, my assumption is that you’re mostly concerned with
    understanding this technology area as a whole – its integration challenges, dev
    team setup requirements and needs, team skillsets, business user / stakeholder
    concerns around the IoT, and the potential change management challenges you may
    encounter as you embark on your organization’s IoT journey.


    ## What Do I Need To Know?


    Although the exercises in this book assume that you have experience as a programmer,
    most do not require sophisticated programming skills or a formal computer science
    background. However, if you intend to complete the exercises at the end of most
    chapters, you’ll need to possess a basic level of comfort working with both Python
    and Java as coding languages to build simple applications comfortably; working
    in an Integrated Development Environment (IDE); reading, writing, and executing
    Unit Tests; and configuring Linux-based systems via a shell-based command line.


    All exercises are preceded by a to-be design diagram for the specific task at
    hand, which provides specific detail on the way any new logical components you
    build are to work together along with the existing components you’ve already developed.
    Most of these diagrams will follow the guidelines specified by the Unified Modeling
    Language (UML)¹, and incorporate other non-UML design constructs in order to make
    the design as clear as possible. A legend is included within those diagrams where
    I deemed it will add sufficient value, and excluded where I felt it just adds
    noise.


    For technology executives and managers, you don’t need to implement the exercises
    yourself, but it will be helpful to read through the entire book so you understand
    the challenges your team will likely encounter.


    For business stakeholders interested mostly in understanding what the IoT entails,
    I recommend reading – at a minimum – the Overview section of each chapter, then
    focusing your efforts on the final chapter, which discusses a handful of practical
    cases, scenarios, and implementation suggestions.


    ## How Is This Book Arranged?


    This book will take you through building an end-to-end, full-stack, and integrated
    IoT solution using various open source libraries and software components that
    you’ll build – step-by-step. Each of these components will be part of the larger
    system, and you’ll see how they interconnect with and map into an end-state architecture
    as you work through each chapter’s exercises.


    If you’re not planning on implementing the exercises and just want to get your
    feet wet with various IoT technologies, feel free to skip around to those sections
    that are most interesting to you and relevant for your needs.


    I’ve grouped like chapters together and used this scheme to establish the four
    parts of the book: Part I - Getting Started, Part II - Connecting to the Physical
    World, Part III - Connecting to Other Devices, and Part IV - Connecting to the
    Cloud. Let’s review each in a bit more detail.


    ## Part I – Getting Started


    In this section, we build our initial foundation for IoT development. You’ll start
    by creating a development and testing environment, and wrap-up the section by
    writing two simple applications to validate our environment is working properly.


    - Chapter 1 is the longest chapter in the book as it lays the groundwork for how
    you’ll build your end-to-end solution. It will help you establish a baseline of
    IoT knowledge and set up your workstation and development environment so you can
    be productive as quickly as possible. I’ll cover some basic IoT terms, create
    a simple problem statement, define core architectural concepts, and establish
    an initial design approach that I’ll use as the framework for each subsequent
    exercise.


    ### NOTE


    The IoT consists of a plethora of heterogeneous devices and systems, and there
    are many tools and utilities available to support development and system automation.
    The tools and utilities I use throughout the book fall into the open source category,
    and represent a small subset of those available to you. These shouldn’t be taken
    as carte blanche recommendations, of course, as you may have your own that you
    prefer to work with and are best suited for your specific needs. My goal is only
    to keep the content well-bounded, and to help inform a generalized development
    and automation approach to help you be successful implementing the exercises in
    this book.


    - Chapter 2 covers your development environment setup and requirements capture
    approach, and then moves into coding. In this chapter, you’ll create your first
    two IoT applications - one in Python and the other in Java. These will be quite
    simple, but set the stage for subsequent chapters. Even if you’re an experienced
    developer, it’s important to work through the exercises as given so we’re working
    from the same baseline going forward.


    ## Part II – Connecting to the Physical World


    This section covers a fundamental characteristic of the IoT – integration with
    the physical world. You''ll learn how to read sensor data and trigger an actuator
    both virtually using emulators and on an actual IoT device.


    - Chapter 3 explores ways you can collect data from the physical world (sensing),
    and trigger actions based on that data (actuation). You''ll start by building
    a set of simple emulators which you may continue using throughout each subsequent

    \ Environment\n\nRecall that your CDA will be written in Python, and your GDA\
    \ will be written in Java. Let’s make sure your workstation has the right stuff\
    \ installed to support these languages and their associated dependencies, by following\
    \ the steps below.\n\n- 1. Install Python 3.7 or higher on your workstation (the\
    \ latest version as of this writing is 3.8.2). You can check if it’s already installed,\
    \ or install it if not, using the following steps:\n  - Open a terminal or console\
    \ window, and type:\n    `$ python3 -version`\n  - It should return something\
    \ similar to the following:\n    `Python 3.7.6`\n\n```\n$ python3 -version\n```\n\
    \n```\nPython 3.7.6\n```\n\n- If you get an error (e.g. ‘not found’), you’ll need\
    \ to install Python 3.7 or higher. Follow the instructions for your operating\
    \ system (Windows, Mac, Linux) at https://www.python.org/downloads/.\n\n2. Install\
    \ pip by downloading the script located at https://bootstrap.pypa.io/get-pip.py.\n\
    \na. Use Python to execute the pip installation. Open a terminal or console window,\
    \ and type:\n\n```\n$ python3 get-pip.py\n```\n\n3. Ensure Java 11 or higher is\
    \ installed on your workstation (the latest version of OpenJDK as of this writing\
    \ is Java 14). You can check if it’s already installed, or install it if not,\
    \ using the following steps:\n\na. Open a terminal or console window, and type:\n\
    \n```\n$ java -version\n```\n\nb. It should return something like the following\
    \ (make sure it’s at least Java 8)\n\n```\njava 13.0.1 2019-10-15\n\nJava(TM)\
    \ SE Runtime Environment (build 13.0.1+9)\n\nJava HotSpot(TM) 64-Bit Server VM\
    \ (build 13.0.1+9, mixed mode, sharing)\n```\n\nc. If you get an error (e.g. ‘not\
    \ found’), you’ll need to install Java 11 or higher. Follow the instructions for\
    \ your platform (Windows, MacOS, or Linux) here: https://openjdk.java.net/install/\n\
    \n4. Install Git. Go to https://git-scm.com/book/en/v2/Getting-Started-Installing-Git\
    \ and review the instructions for your specific operating system.\n\n> NOTE\n\
    > \n> A prerequisite for any of the exercises in this book, and for setting up\
    \ your development environment, is a basic understanding of Git – a source code\
    \ management and versioning tool. Many IDE’s (including Eclipse) come with source\
    \ code management already enabled via an embedded Git client. In a previous step,\
    \ you installed Git via the command line so you can run Git commands independently\
    \ of your IDE. For more information on using Git from the command line, please\
    \ see https://git-scm.com/docs/gittutorial.\n\n> TIP\n> \n> You can use Git as\
    \ a standalone source code management tool on your local development workstation,\
    \ and also manage your source code in the cloud using a variety of free and commercial\
    \ services. GitHub² is the service I use, and will leverage some of the features\
    \ this platform provides to support CI/CD pipelines, or workflow steps, that allow\
    \ you to automate the build, test, package, and deployment process.\n\n5. Create\
    \ a working development directory, and download the source code and unit tests\
    \ for this book:\n\n- a. Open a terminal or console window, create a new working\
    \ development directory, and then change to that directory. Type the following:\n\
    \  i. Linux/macOS:\n    `mkdir $HOME/programmingtheiot`\n    `cd $HOME/programmingtheiot`\n\
    \  ii. Windows:\n    `mkdir C:\\programmingtheiot`\n    `cd C:\\programmingtheiot`\n\
    \n- b. Clone the following two source code repositories for this book by typing\
    \ the following:\n  `$ git clone https://github.com/programmingtheiot/python-components.git`\n\
    \  `$ git clone https://github.com/programmingtheiot/java-components.git`\n\n\
    ## 6. Install and configure virtualenv using pip ³\n\n- a. Open a terminal or\
    \ console window. Change your directory to that of the constraineddeviceapp code\
    \ you just cloned from GitHub, and install virtualenv by typing the following:\n\
    \  i. Linux/macOS:\n    `$ pip install virtualenv`\n  ii. Windows:\n\n```\nC:\\\
    programmingtheiot> pip install virtualenv\n```\n\nb. Configure virtualenv for\
    \ your environment. Change your directory to that of the constraineddeviceapp\
    \ code you just cloned from GitHub, and type the following:\n\n- i. Linux/macOS\n\
    \n```\n$ cd $HOME/programmingtheiot/python-components\n\n$ virtualenv -p python3\
    \ .venv\n\n$ . .venv/bin/activate\n\n(venv) $ pip install -r basic_imports.txt\n\
    ```\n\n- ii. Windows\n\n```\ncd C:\\programmingtheiot\\python-components\n\nC:\\\
    programmingtheiot\\python-components> virtualenv -p C:\\PathToYourPythonExecutable\\\
    python.exe .venv\n\nC:\\programmingtheiot\\python-components> .venv\\Scripts\\\
    activate.bat\n\n(.venv) C:\\programmingtheiot\\python-components> pip install\
    \ -r basic_imports.txt\n```\n\nc. Your virtualenv environment is now set up, and\
    \ your terminal is running within virtualenv. You can activate (using the activate\
    \ script) and then deactivate virtualenv (using the deactivate command) from your\
    \ command line easily enough:\n\n- i. Linux/macOS\n\n```\n$ . .venv/bin/activate\n\
    (venv) $ deactivate\n```\n\n- ii. Windows\n\n```\nC:\\programmingtheiot\\python-components>\n\
    .venv\\Scripts\\activate.bat\n\n(.venv)\nC:\\programmingtheiot\\python-components>\
    \ deactivate\n```\n\nAt this point, your development workstation is mostly configured,\
    \ so let’s dig into the next section and install some additional tools to make\
    \ the development process more streamlined.\n\n## Configuring an Integrated Development\
    \ Environment (IDE)\n\nThere are many excellent tools and IDE’s that help you,\
    \ the developer, write, test, and deploy applications written in both Java and\
    \ Python. There are tools that I’m very familiar with and work well for my development\
    \ needs. My guess is you’re much the same and have your own tool preferences.\
    \ It doesn’t really\n\nmatter which toolset you use, provided they meet some basic\
    \ requirements. For me, these include code highlighting and completion, code formatting\
    \ and refactoring, debugging, compiling and packaging, unit and other testing,\
    \ and source code control.\n\nThere are many fantastic IDE's on the market - both\
    \ commercial and open source, and the choice is certainly yours. I developed the\
    \ examples in this book using the Eclipse IDE 4 with PyDev 5 installed, as it\
    \ meets the requirements I've specified and provides a bunch of other convenient\
    \ features that I regularly use in my development projects.\n\nIf you’re already\
    \ familiar with writing, testing, and managing software applications using a different\
    \ IDE, most of this section will be old hat. I do recommend you read through it,\
    \ however, as this section sets the stage for the development of your GDA and\
    \ CDA.\n\n> NOTE\n> \n> I maintain detailed instructions for setting up Eclipse\
    \ with PyDev for use with Programming the IoT on my website for students of my\
    \ Connected Devices course. You can find more details on this books website at\
    \ https://programmingtheiot.com/programming-the-iot-book.html.\n\n## Setup Your\
    \ GDA Project\n\nThe first step in this process is to install the latest Eclipse\
    \ IDE for Java development. You can find the latest download links for Eclipse\
    \ at https://www.eclipse.org/downloads/. You’ll notice that there are many different\
    \ flavors of the IDE available. For our purposes, you can simply choose ‘Eclipse\
    \ IDE for Java Developers’. Then, follow the instructions for installing the IDE\
    \ onto your local system.\n\nOnce installed, launch Eclipse, select ‘File -> Import’,\
    \ and find ‘Git -> Projects from Git’, and click ‘Next’.\n\nSelect ‘Existing local\
    \ repository’ and click ‘Next’. If you already have some Git repositories in your\
    \ home path, Eclipse will probably pick them up and present them as options to\
    \ import in the next dialog (not shown). To pull in the newly cloned repository,\
    \ simply click ‘Add…’, which will take you to the next dialog, shown in Figure\
    \ 1-5. From here, you can add your new Git repository.\n\nOn my workstation, the\
    \ repository I want to import is located at E:\\aking\\programmingtheiot\\java-components.\
    \ Yours will most likely have a different name, so be sure to enter it correctly!\n"

  md: "\n# Chapter 2. Building Two Simple IoT Monitoring Applications\n\n# A NOTE\
    \ FOR EARLY RELEASE READERS\n\nWith Early Release ebooks, you get books in their\
    \ earliest form—the author’s raw and unedited content as they write—so you can\
    \ take advantage of these technologies long before the official release of these\
    \ titles.\n\nThis will be the 2nd chapter of the final book. Please note that\
    \ the GitHub repo will be made active later on.\n\nIf you have comments about\
    \ how we might improve the content and/or examples in this book, or if you notice\
    \ missing material within this chapter, please reach out to the author at aking.em@gmail.com.\n\
    \n*I must have data!*\n\n*How much memory remains?*\n\n*I dare not look. Sigh.*\n\
    \n**Fundamental concepts:** Build two IoT performance monitoring applications\
    \ – one as an IoT gateway, and the other as an IoT constrained device.\n\nThis\
    \ chapter focuses on the initial steps to getting your IoT solution up and running.\
    \ You’ll build upon these in the upcoming chapters, so setting the basic design\
    \ in place now is very important. The overall architecture presented in Chapter\
    \ 1 provides the initial guidance you’ll need to start coding your IoT\n\nsolution,\
    \ and we’ll keep building upon it as we blaze ahead in this chapter and beyond.\
    \ I’m sure you’re anxious to start building out your own solution based on what\
    \ you’ll learn, but it’s important to take things one step at a time.\n\nWe’ll\
    \ start with two simple applications that collect some simple telemetry about\
    \ the devices (real or virtual): a Gateway Device App (GDA) that will run on your\
    \ “gateway device”, and a Constrained Device App (CDA) that will run on your “constrained\
    \ device”. The design of each application provides the foundation for all of the\
    \ code you’ll develop for the edge tier, so you may want to keep the design from\
    \ Chapter 1 handy for reference.\n\n# What you’ll learn in this chapter\n\nThis\
    \ is the beginning of your coding journey with the IoT. You’ll learn how to define\
    \ a detailed design for both your GDA and CDA, separate the logical components\
    \ of your design, and implement the framework for these two applications in Java\
    \ (GDA) and Python (CDA).\n\nThese will be very simple applications, but they’ll\
    \ serve as important foundation layers for your overall solution. Each will implement\
    \ an application framework and exercise that framework by incorporating external\
    \ libraries used to track the performance of a computing system. You’ll use the\
    \ data they generate for your initial foray into creating telemetry using your\
    \ CDA and GDA.\n\n# Designing Your IoT Applications\n\nRemember the problem statement\
    \ from Chapter 1? Let’s briefly review it now:\n\n> *I want to understand the\
    \ environment in my home and how it changes over time, and make adjustments to\
    \ enhance comfort while saving money.*\n\nIf you think about all of the things\
    \ your applications will need to do to address this problem, and also consider\
    \ the importance of testing system behavior and performance, there are some important\
    \ capabilities you’ll want to ‘bake in’ from the start. One is the ability to\
    \ easily add new features as we go, and the other is to track each application’s\
    \ performance so we know if it’s working adequately.\n\nThe first step in designing\
    \ both the GDA and CDA is to create an application wrapper that can determine\
    \ what features need to be loaded and then launch those features consistently.\
    \ I’ll introduce application configuration using a configuration file in Chapter\
    \ 3, so no need to worry about that right now.\n\nYour initial GDA and CDA designs\
    \ will look very similar to one another. They’ll collect some basic telemetry,\
    \ which for now will include just CPU utilization and memory utilization, and\
    \ simply log the data to the console. It won’t be long before you’ll have both\
    \ applications talking to one another.\n\nLet’s get started, shall we?\n\n# NOTE\n\
    \nMost of the design diagrams throughout the book will follow Unified Modeling\
    \ Language (UML) notation. I'll explain them as we go, but you'll want to become\
    \ familiar with the UML's class diagram and relationship constructs. Check out\
    \ the links at https://www.uml.org/resource-hub.htm for tutorials and other helpful\
    \ UML resources.\n\n# The CDA\n\nYour CDA needs four components: an application\
    \ wrapper, a manager to run the show, and two components to read the basic system\
    \ performance data we want to collect as part of our telemetry: CPU utilization\
    \ and memory utilization.\n\nLet's use Figure 2-1 to represent this design:\n\n\
    ![](img/051213a7a9851bf581895f86e6a2becd_112_0.png)\n\nFigure 2-1. - CDA system\
    \ performance design diagram\n\nThe class diagram in Figure 2-1 shows the four\
    \ primary components and their relationship to one another:\nConstrainedDeviceApp,\
    \ which you’ll recall from Chapter 1 as being part of the code base you’ve already\
    \ downloaded, is the application wrapper.\n\nConstrainedDeviceApp is the entry\
    \ point for the application and creates the instance of, and manages,\nSystemPerformanceManager.\
    \ There are also two other components - SystemCpuUtilTask and SystemMemUtilTask.\
    \ As their names imply, these are components that will collect - you guessed it\
    \ - system CPU utilization and system memory utilization. These components will\
    \ be managed by SystemPerformanceManager and run as asynchronous threads that\
    \ update a method you’ll define within SystemPerformanceManager.\n\n> **NOTE**\n\
    > \n> If you’re already familiar with Python development and comfortable implementing\
    \ your solution from the UML design above, feel free to skim the next section\
    \ as a reference and write your code. I’d recommend you do walk through CDA Testing\
    \ Details, however, as it will provide some insights into the unit test framework\
    \ that’s part of your codebase.\n\n# CDA Implementation Details\n\nBefore you\
    \ start writing code, there’s some administrative steps you’ll need to take to\
    \ get your CDA code repository and Issues\n\ntracker setup. This will let you\
    \ easily track your work within your project's Kanban board. Let’s do this administrative\
    \ work now.\n\n# NOTE\n\nYou may find this section to be a bit pedantic. Don’t\
    \ worry! Once you get through some of the drudgery that comes next, the following\
    \ code examples will be easier to digest and move more quickly. There are two\
    \ reasons for this:\n\n+   1. The setup work will be done after this section;\
    \ you’ll know how to add tasks, write meaningful descriptions, and map them to\
    \ your Kanban board.\n+   2. I’ll move along a bit faster and only explain the\
    \ code that’s somewhat specialized or unique to IoT environments. My expectation\
    \ is that you’ll ramp up quickly and won’t need a line-by-line description of\
    \ everything you need to write.\n\nAs I mentioned in Chapter 1, the tasks you\
    \ write are called ‘Issues’. Figure 2-2 is a screenshot from my GitHub page displaying\
    \ all the CDA tasks that need to be implemented for this chapter.\n\n![](img/051213a7a9851bf581895f86e6a2becd_115_0.png)\n\
    \nFigure 2-2. - CDA system performance design tasks\n\nIf you’re using GitHub,\

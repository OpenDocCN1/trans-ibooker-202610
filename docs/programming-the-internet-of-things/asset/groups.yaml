    upon over the next chapters. Now let’s move onto the GDA and start writing some
    Java code.


    ## The GDA


    Your GDA will need the same three components as your CDA: an application wrapper,
    a system performance manager, and components to read the system performance data
    that will comprise your GDA’s telemetry.


    ## NOTE


    In IoT systems, the gateway device may or may not generate its own telemetry.
    The example you’ll build within this book only generates its own system performance
    telemetry. The constrained device, implemented as the CDA, will be responsible
    for not only generating its specific system performance telemetry, but any sensor-specific
    telemetry as well.


    Let’s use the class diagram in Figure 2-5 to represent the GDA’s design. You’ll
    notice it looks surprisingly similar to our CDA Design (Figure 2-1), with the
    main differences being the implementation language, the application wrapper name,
    and - of course - the number of tasks!



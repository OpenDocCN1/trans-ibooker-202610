    \ Python 类编写，并且本书记载的每个 Python 示例都将如此，只有少数例外。\n\n## Unit, Integration, and Performance\
    \ Testing\n\n有许多方法可以测试软件应用程序和系统，并且对此主题有许多优秀的书籍、文章和博客。开发一个可行的物联网解决方案需要仔细关注测试——在应用程序内部以及不同应用程序和系统之间。就你将开发的解决方案而言，我将只关注三种：单元测试、集成测试和性能测试。\n\
    \n单元测试是编写的代码模块，用于测试对测试可访问的最小可能代码单元，例如函数或方法。这些测试编写用于验证给定函数或方法的一组输入是否返回预期结果。边界条件通常也会被测试，以确保函数或方法能够适当处理这些类型的条件。\n\
    \n## NOTE\n\n代码单元在技术上可以是一个单行、多行代码，甚至整个代码库。就我们的目的而言，单元是指可通过本地系统上可用的单个接口访问的一行或多行代码，或整个代码库——即封装单元功能的函数或方法，可从你的测试应用程序调用。此功能例如可以是排序算法、计算，甚至是进入一个或多个附加函数或方法的入口点。\n\
    \n我使用 JUnit 进行 Java 代码的单元测试（随 Eclipse 提供），并使用 PyUnit 进行 Python 代码的单元测试（Python\
    \ 解释器的标准部分，并在 PyDev 中可用）。如果你使用 Eclipse 和 PyDev，在 IDE 中编写和执行单元测试无需安装任何额外组件。\n\n\
    ## NOTE\n\n在你的 GDA 项目中，你可能注意到 Maven 为你的源代码创建了两个目录结构：一个用于位于 ./src/main/java 的 Java\
    \ 源代码，另一个用于位于 ./src/test/java 的 Java 单元测试代码。由于这是 Maven 项目的默认约定，保持原样。\n\n在你的 CDA\
    \ 项目中，代码路径结构与 GDA 项目略有不同：./src/main/java 和 ./src/test/java 缺失了。这可能看起来很合理，因为这是一个\
    \ Python 项目而不是 Java！所有源代码都包含在 ./src/programmingtheiot 中，而所有测试都包含在 ./tests/programmingtheiot\
    \ 中。\n\n虽然我为你提供了大量单元测试供使用，但我们将在第 2 章深入研究创建你自己的测试。如果你是该开发领域的新手，我在下面提供了 Java 和 Python\
    \ 中的几个简单代码片段，以帮助你更熟悉代码结构。以下是使用 JUnit ⁶ 的简单 Java 单元测试，验证方法 addTwoIntegers() 是否按预期行为：\n\
    \n```\n@Test\npublic int testAddTwoIntegers(int a, int b)\n{\nMyClass mc = new\

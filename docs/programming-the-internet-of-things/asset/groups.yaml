  mdcn: "\n\n# 第 2 章. 构建两个简单的 IoT 监控应用程序\n\n# 致早期发布读者的说明\n\n使用 Early Release 电子书，您可以在这些标题正式发布之前很久就利用这些技术——作者在撰写过程中提供的原始未编辑内容。\n\
    \n这将是最终书籍的第 2 章。请注意，GitHub 仓库将在稍后激活。\n\n如果您对如何改进本书的内容和/或示例有任何意见，或者如果您注意到本章中缺少材料，请联系作者\
    \ aking.em@gmail.com。\n\n*我必须要有数据！*\n\n*还剩下多少内存？*\n\n*我不敢看。叹气。*\n\n**基本概念：** 构建两个\
    \ IoT 性能监控应用程序——一个作为 IoT 网关，另一个作为 IoT 受限设备。\n\n本章重点介绍让您的 IoT 解决方案运行起来的初始步骤。您将在后续章节中在此基础上进行构建，因此现在设置基本设计非常重要。第\
    \ 1 章中介绍的整体架构将为您提供开始编码 IoT 解决方案所需的初始指导，我们将在本章及以后继续在此基础上构建。我相信您迫不及待地想要根据所学内容构建自己的解决方案，但重要的是要一步一步来。\n\
    \n我们将从两个简单的应用程序开始，它们收集有关设备（真实或虚拟）的一些简单遥测数据：将在您的“网关设备”上运行的网关设备应用程序（GDA），以及将在您的“受限设备”上运行的受限设备应用程序（CDA）。每个应用程序的设计为边缘层的所有代码提供了基础，因此您可能希望将第\
    \ 1 章的设计保留在手边以供参考。\n\n# 本章您将学到什么\n\n这是您与 IoT 编程之旅的开始。您将学习如何为 GDA 和 CDA 定义详细设计，分离设计的逻辑组件，并使用\
    \ Java（GDA）和 Python（CDA）实现这两个应用程序的框架。\n\n这些将是非常简单的应用程序，但它们将作为您整体解决方案的重要基础层。每个应用程序都将实现一个应用程序框架，并通过整合用于跟踪计算系统性能的外部库来使用该框架。您将使用它们生成的数据进行使用\
    \ CDA 和 GDA 创建遥测的初步尝试。\n\n# 设计您的 IoT 应用程序\n\n还记得第 1 章中的问题陈述吗？让我们现在简要回顾一下：\n\n\
    > *我想了解我家中的环境以及它如何随时间变化，并做出调整以提高舒适度同时节省开支。*\n\n如果您思考应用程序为解决此问题需要做的一切，并考虑到测试系统行为和性能的重要性，有一些重要功能您希望从一开始就“内置”。一个是能够轻松添加新功能，另一个是跟踪每个应用程序的性能以便我们知道它是否工作良好。\n\
    \n设计 GDA 和 CDA 的第一步是创建一个应用程序包装器，该包装器可以确定需要加载哪些功能，然后一致地启动这些功能。我将在第 3 章中介绍使用配置文件进行应用程序配置，因此现在无需担心。\n\
    \n您的初始 GDA 和 CDA 设计将非常相似。它们将收集一些基本遥测数据，目前仅包括 CPU 利用率和内存利用率，并简单地将数据记录到控制台。不久之后，您将让两个应用程序相互通信。\n\
    \n让我们开始吧，好吗？\n\n# 说明\n\n本书中大部分设计图都将遵循统一建模语言（UML）表示法。我会在过程中进行解释，但您需要熟悉 UML 的类图和关系构造。查看\
    \ https://www.uml.org/resource-hub.htm 上的链接以获取教程和其他有用的 UML 资源。\n\n# CDA\n\n您的\
    \ CDA 需要四个组件：一个应用程序包装器、一个管理执行的管理器，以及两个用于读取我们作为遥测的一部分想要收集的基本系统性能数据的组件：CPU 利用率和内存利用率。\n\
    \n让我们使用图 2-1 来表示此设计：\n\n![](img/051213a7a9851bf581895f86e6a2becd_112_0.png)\n\n\
    图 2-1. - CDA 系统性能设计图\n\n图 2-1 中的类图显示了四个主要组件及其相互关系：\nConstrainedDeviceApp，您会记得从第\
    \ 1 章中它是您已下载的代码库的一部分，是应用程序包装器。\n\nConstrainedDeviceApp 是应用程序的入口点并创建 SystemPerformanceManager\
    \ 的实例并管理它。还有另外两个组件 - SystemCpuUtilTask 和 SystemMemUtilTask。正如它们的名字所暗示的那样，这些是组件，它们将收集——您猜对了——系统\
    \ CPU 利用率和系统内存利用率。这些组件将由 SystemPerformanceManager 管理并作为异步线程运行，更新您将在 SystemPerformanceManager\
    \ 中定义的方法。\n\n> **说明**\n> \n> 如果您已熟悉 Python 开发并且能够根据上面的 UML 设计舒适地实现解决方案，请随意浏览下一节作为参考并编写代码。我建议您还是阅读\
    \ CDA 测试细节，因为它将提供有关代码库中单元测试框架的一些见解。\n\n# CDA 实现细节\n\n在开始编写代码之前，您需要执行一些管理步骤来设置\
    \ CDA 代码仓库和问题跟踪器。这将让您轻松地在项目的看板中跟踪您的工作。让我们现在做这项管理工作。\n\n# 说明\n\n您可能会发现本节有点啰嗦。别担心！一旦您度过了接下来一些繁琐的工作，后面的代码示例将更容易消化并更快地推进。有两个原因：\n\
    \n+   1. 设置工作将在本节之后完成；您将知道如何添加任务、编写有意义的描述并将它们映射到您的看板。\n+   2. 我将加快进度，只解释一些专门或独特于\
    \ IoT 环境的代码。我的期望是您会快速上手，不需要逐行描述您需要编写的一切。\n\n正如我在第 1 章中提到的，您编写的任务称为“问题”。图 2-2 是我\
    \ GitHub 页面上的屏幕截图，显示了本章需要为 CDA 实现的所有任务。\n\n![](img/051213a7a9851bf581895f86e6a2becd_115_0.png)\n\
    \n图 2-2. - CDA 系统性能设计任务\n\n如果您使用 GitHub，请现在使用网络浏览器导航到您的 CDA 的 Git 仓库页面。您会看到有一个“问题”选项卡——点击它，这将带您到一个类似图\
    \ 2-2 的页面，但没有任何问题。\n\n让我们先更改一个标签。点击“标签”，并查找“增强”。您可以保持原样或将其重命名为“功能”，我建议这样做。\n\n\
    返回问题页面，现在点击“里程碑”。让我们为每个章节添加一个里程碑，如图 2-3 所示。\n\n# 标签\n\n# 里程碑\n\n新建里程碑\n\n8 个打开\

  - '[PAGE 95]


    Figure 1-12. - Task template


    Most of these categories are self-explanatory. But, why only three levels-of-effort
    for Estimate? In this book, most of the activities should take ~2 hours or less
    (Small), about half a day (Medium), or about one day (Large). If you come across
    an activity that you’re sure will take more than a day, it should be broken down
    into smaller tasks that fit one of these three levels-of-effort.


    For example, a ‘task’ with the name *Integrate IoT solution with three cloud services*
    certainly represents work that needs to be done, but judging by the name only,
    it’s clearly way too big and complicated to be a single work activity.


    My suggestion is to write tasks that align to a specific code module, or even
    a single method, as much as possible. I’m sure you’ve heard this before: Keep
    it simple.



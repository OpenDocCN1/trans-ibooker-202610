- raw:
  - '[PAGE 10]


    Devices course for the past three years. This book is the formalization of these
    lecture notes, presentations, examples, and lab exercises, structured in much
    the same way as my course.


    The original class was designed as an introduction to the IoT, but with student
    input and suggestions from my Teaching Assistants, it quickly morphed into an
    advanced, project-oriented software development course designed as one of the
    final required classes for students wrapping up their Master’s in the Cyber Physical
    Systems department of Northeastern University. The goal of the course is to establish
    a strong baseline of IoT knowledge to help students move from academia into industry,
    bringing foundational IoT skills and knowledge into their respective organizations.


    This book is structured so it can be used as a reference guide or even as a major
    component of a complete curriculum to help you with your own IoT-related course.
    The content is focused on constructing an end-to-end, open and integrated IoT
    solution, from device to cloud, using a ‘learn as you build’ approach to teaching.
    Since each chapter builds upon the previous, you can use this book to guide your
    students in building their own platform from the ground up.


    You can remain up to date on exercises and other relevant content useful for teaching
    and explaining concepts on the book’s website (https://programmingtheiot.com/programming-the-iot-book/).'
  - '[PAGE 11]


    # To the Technology Manager and Executive


    The contents of this book should help you better understand the integration challenges
    inherent with any IoT project and provide insight into the skillsets required
    to help your technology team(s) succeed across your IoT initiatives.


    If you’re part of this group, my assumption is that you’re mostly concerned with
    understanding this technology area as a whole – its integration challenges, dev
    team setup requirements and needs, team skillsets, business user / stakeholder
    concerns around the IoT, and the potential change management challenges you may
    encounter as you embark on your organization’s IoT journey.


    # What Do I Need To Know?


    Although the exercises in this book assume that you have experience as a programmer,
    most do not require sophisticated programming skills or a formal computer science
    background. However, if you intend to complete the exercises at the end of most
    chapters, you’ll need to possess a basic level of comfort working with both Python
    and Java as coding languages to build simple applications comfortably; working
    in an Integrated Development Environment (IDE); reading, writing, and executing
    Unit Tests; and configuring Linux-based systems via a shell-based command line.'
  - '[PAGE 12]


    All exercises are preceded by a to-be design diagram for the specific task at
    hand, which provides specific detail on the way any new logical components you
    build are to work together along with the existing components you’ve already developed.
    Most of these diagrams will follow the guidelines specified by the Unified Modeling
    Language (UML)¹, and incorporate other non-UML design constructs in order to make
    the design as clear as possible. A legend is included within those diagrams where
    I deemed it will add sufficient value, and excluded where I felt it just adds
    noise.



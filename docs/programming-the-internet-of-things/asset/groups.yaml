  md: "\n![](img/051213a7a9851bf581895f86e6a2becd_50_0.png)\n\nFigure 1-3. - Notional\
    \ IoT simplified logical architecture with Edge and Cloud Tiers\n\nLet’s dig into\
    \ each a bit further:\n\n- Constrained Device App (CDA)\n  You’ll build this software\
    \ application to run within the constrained device (emulated or actual), and it\
    \ will provide data collection and system triggers functionality. It will handle\
    \ the interface between the device’s sensors (which read data from the environment)\
    \ and actuators (which trigger actions, such as turning the thermostat on or off).\
    \ It will also play a role in taking action when an actuation is needed. Eventually,\
    \ it will be connected to a communications library to send messages to, and receive\
    \ messages from, the Gateway Device App.\n- Gateway Device App (GDA)\n  You’ll\
    \ build this software application to run within the gateway device (emulated or\
    \ actual), and it will provide data management, analytics, and configuration management\
    \ functionality. It’s primary role is to manage data and the connections between\
    \ the CDA and cloud services that exist within the Cloud Tier. It will manage\
    \ data locally as appropriate, and - sometimes - take action by sending a command\
    \ to the constrained device that triggers an actuation. It will also manage some\
    \ of the configuration settings - that is, those that represent nominal for your\
    \ environment, and perform some simple analytics when new telemetry is received.\n\
    - Cloud Services\n\nAll cloud services applications and functionality do the heavy\
    \ data processing and storage work, as they can theoretically scale it ad infinitum.\
    \ This simply means that, if designed well, you can add as many devices as you\
    \ want, store as much data as you want, and do in-depth analysis of that data\
    \ - trends, highs, lows, configuration values, etc., all while passing any relevant\
    \ insights along to a human end user, and perhaps even generate Edge Tier actions\
    \ based on any defined threshold crossing(s). Technically, cloud services within\
    \ an IoT environment can handle all the action categories previously mentioned,\
    \ with the exception of data collection (meaning, they don’t perform sensing or\
    \ actuation actions directly). You’ll build some cloud services to handle this\
    \ functionality, but mostly utilize those generic services already available from\
    \ some cloud service providers.\n\n![](img/051213a7a9851bf581895f86e6a2becd_53_0.png)\n\
    \nFigure 1-4. - Notional IoT detailed logical architecture with Edge and Cloud\
    \ Tiers\n\nPutting it all together into a detailed logical architecture, Figure\
    \ 1-4, shows how each major logical component within our two architectural tiers\
    \ interacts with the others. We’ll use these two diagrams (Figure 1-3 and Figure\
    \ 1-4) as our baseline architecture for all the exercises in this book.\n\nNow\
    \ that we have a handle on what we’re up against, let’s get our development environment\
    \ setup so we can start slinging code.\n\n## Building, Testing and Deploying Software\
    \ for the IoT\n\nBuilding and deploying code across different operating systems,\
    \ hardware configurations, and configuration systems is no walk in the park. With\
    \ typical IoT projects, we not only have to deal with different hardware components,\
    \ but the myriad ways to develop and deploy across these platforms, not to mention\
    \ the various Continuous Integration / Continuous Deployment (CI/CD) idiosyncrasies\
    \ with the various cloud service provider environments we often work within.\n\
    \nWith all these challenges, how do we even get started? First things first -\
    \ what problem are we trying to solve? As a developer, you want to implement your\
    \ IoT design in code, test it, package it into something that can be easily distributed\
    \ to one or more systems, and deploy it safely. We can think of our\n\ndevelopment\
    \ challenges in two build, test and deploy phases, that just so happen to map\
    \ to our architectural tiering: Edge Tier Environment and Cloud Tier Environment.\
    \ We’ll dig into the functionality within the Cloud Tier beginning in Chapter\
    \ 10. For now, we’ll focus just on our Edge Tier.\n\nAlthough our Edge Tier will\
    \ eventually have specialized hardware to deal with, we can simulate some aspects\
    \ of these hardware components within our local development environment. This\
    \ will make deployment much easier and is perfectly fine for all the exercises\
    \ in this book except for Chapter 4, which I’ll touch on later in this chapter\
    \ and is optional.\n\nThere are many ways to get up and running with IoT development,\
    \ but we’ll focus on three specific paths: One is purely simulated, and as I mentioned\
    \ previously is sufficient for all but Chapter 4. The other two require IoT-specific\
    \ hardware and will be discussed in more depth in Chapter 4.\n\n## Integrated\
    \ Simulated Deployment\n\nThis approach doesn’t require any specialized device,\
    \ and allows you to use your development workstation (laptop) as both gateway\
    \ device and constrained device. This means you’ll run your GDA and CDA in your\
    \ local computing environment. You’ll emulate your sensing and actuation hardware\
    \ by building simple software simulators to capture this functionality within\
    \ your CDA. All exercises, with the exception of those in Chapter 4, will work\
    \ using this deployment approach.\n\n## Separated Physical Deployment\n\nThis\
    \ requires a hardware device, such as a Raspberry Pi, that meets the hardware\
    \ criteria listed in the below, giving you the ability to connect to and interact\
    \ with real sensors and actuators. Although many off-the-shelf single-board computing\
    \ (SBC) devices can be used as full-blown computing workstations, I’ll refer to\
    \ this as your constrained device, and it will run your CDA directly on the device.\
    \ As with the Simulated approach, you’ll run the GDA in your local computing environment.\n\
    \n> **NOTE**\n> \n> The Internet Engineering Task Force’s (IETF) Request For Comments\
    \ document RFC 7228 defines various classes of constrained devices (also referred\
    \ to as constrained nodes). These classes include Class 0 (very constrained),\
    \ Class 1 (constrained), and Class 2 (somewhat constrained).¹ For our purposes,\
    \ we’ll assume our CDA can run on Class 2 or even more powerful devices, which\
    \ typically support full IP-based networking stacks, meaning the protocols we’ll\
    \ deal with in this book will generally work on these types of devices. Although\
    \ technically feasible to connect Class 2 devices directly to the Internet, all\
    \ of our examples and exercises will interact indirectly with the Internet via\
    \ the GDA.\n\n## Blended Physical Deployment\n\nThis approach is nearly identical\
    \ to the Separated Deployment approach, but will run both your CDA and GDA on\
    \ the SBC device (e.g. Raspberry Pi or other, similar system). This technically\
    \ means you can choose to deploy\n\neach app to a different SBC, although it isn’t\
    \ necessary for any of the exercises listed.\n\nIf you choose either Path B or\
    \ C for your deployment, there are a wide range of inexpensive SBC’s that could\
    \ work for you. Like choosing our device should have general purpose input/output\
    \ (GPIO) functionality, at least one available Inter-Integrated Circuit (I2C)\
    \ bus, support TCP/IP and UDP/IP networking via Wi-Fi or Ethernet, run a general\
    \ purpose Linux-based operating system such as Debian (or a derivative such as\
    \ Raspbian), and support Python 3 and Java 11 (or higher).\n\nAlthough you may\
    \ choose any SBC that works for your needs, the exercises in the book will focus\
    \ on the Integrated Simulated Deployment Path, excepting Chapter 4 of course.\
    \ Part II introduces the concept of integration with the physical world, and I’ll\
    \ devote Chapter 4 to this type of integration using actual hardware. While the\
    \ principles will apply to many SBC’s, any hardware-specific integration will\
    \ focus on the Raspberry Pi platform - specifically, the Raspberry Pi 3 Model\
    \ B+, Model 4 Model B, and the latest version of the Raspberry Pi Zero W.\n\n\
    Irrespective of the selected Deployment Path, all exercises and examples assume\
    \ you’ll do your development and deployment on a single workstation. This involves\
    \ a three-step process that includes preparation of your development environment,\
    \ defining your testing strategy, and identifying a build and deployment automation\
    \ approach. I’ll cover the basics of these steps to get you started in this chapter,\
    \ but also add to each as\n"
  mdcn: "\n\n![](img/051213a7a9851bf581895f86e6a2becd_50_0.png)\n\nFigure 1-3. - Notional\
    \ IoT simplified logical architecture with Edge and Cloud Tiers\n\n让我们进一步深入探讨每一部分：\n\
    \n- Constrained Device App (CDA)\n  你将构建此软件应用程序以在受限设备（仿真或实际）中运行，它将提供数据采集和系统触发功能。它将处理设备传感器（从环境读取数据）与执行器（触发动作，例如打开或关闭恒温器）之间的接口。它还将在需要执行动作时发挥作用。最终，它将连接到通信库以向网关设备应用程序发送消息并从其接收消息。\n\
    - Gateway Device App (GDA)\n  你将构建此软件应用程序以在网关设备（仿真或实际）中运行，它将提供数据管理、分析和配置管理功能。其主要作用是管理数据以及\
    \ CDA 与存在于云层中的云服务之间的连接。它会根据需要本地管理数据，有时通过向受限设备发送命令来触发执行动作。它还将管理部分配置设置，即代表你环境正常值的那些设置，并在接收到新的遥测数据时执行一些简单分析。\n\
    - Cloud Services\n\n所有云服务应用程序和功能都执行繁重的数据处理和存储工作，因为它们理论上可以无限扩展。这仅仅意味着，如果设计良好，你可以添加任意数量的设备，存储任意数量的数据，并对这些数据进行深入分析——趋势、最高值、最低值、配置值等，同时将任何相关见解传递给人类终端用户，甚至可能根据任何定义的阈值越限生成边缘层动作。从技术上讲，物联网环境中的云服务可以处理之前提到的所有动作类别，除了数据采集（即，它们不直接执行传感或执行动作）。你将构建一些云服务来处理此功能，但主要利用云服务提供商已提供的通用服务。\n\
    \n![](img/051213a7a9851bf581895f86e6a2becd_53_0.png)\n\nFigure 1-4. - Notional\
    \ IoT detailed logical architecture with Edge and Cloud Tiers\n\n将所有内容整合到详细逻辑架构中，图\
    \ 1-4 显示了我们在两个架构层中的每个主要逻辑组件如何相互交互。我们将使用这两个图表（图 1-3 和图 1-4）作为本书所有练习的基础架构。\n\n现在我们已经了解了我们面临的情况，让我们设置开发环境，以便开始编写代码。\n\
    \n## Building, Testing and Deploying Software for the IoT\n\n在不同的操作系统、硬件配置和配置系统之间构建和部署代码绝非易事。对于典型的物联网项目，我们不仅要处理不同的硬件组件，还要处理在这些平台上开发和部署的多种方式，更不用说我们在其中工作的各种云服务提供商环境的持续集成/持续部署（CI/CD）特殊性了。\n\
    \n面对所有这些挑战，我们如何开始？首先——我们要解决什么问题？作为一名开发人员，你希望将物联网设计实现为代码，对其进行测试，将其打包成可轻松分发到一个或多个系统的形式，并安全地部署它。我们可以将开发挑战分为两个构建、测试和部署阶段，这恰好映射到我们的架构分层：边缘层环境和云层环境。我们将在第\
    \ 10 章开始深入研究云层内的功能。目前，我们仅关注边缘层。\n\n尽管我们的边缘层最终将有专门的硬件来处理，但我们可以在本地开发环境中模拟这些硬件组件的某些方面。这将使部署变得容易得多，并且对于本书中的所有练习都完全足够，除了第\
    \ 4 章，我将在本章后面提到它，并且是可选的。\n\n有许多方法可以开始物联网开发，但我们将重点关注三条具体路径：一条是纯粹仿真的，我之前提到过，除了第\
    \ 4 章外，其余部分都足够。其他两条需要物联网专用硬件，将在第 4 章中更深入讨论。\n\n## Integrated Simulated Deployment\n\
    \n这种方法不需要任何专用设备，允许你使用开发工作站（笔记本电脑）作为网关设备和受限设备。这意味着你将在本地计算环境中运行 GDA 和 CDA。你将通过构建简单的软件模拟器来模拟传感和执行硬件，以在\
    \ CDA 中捕获此功能。除了第 4 章中的练习外，所有练习都可以使用此部署方法工作。\n\n## Separated Physical Deployment\n\
    \n这需要一个硬件设备，例如 Raspberry Pi，满足下面列出的硬件标准，使你能够连接和与真实传感器和执行器交互。尽管许多现成的单板计算机（SBC）设备可用作功能齐全的计算工作站，我将将其称为你的受限设备，并且它将直接在设备上运行你的\
    \ CDA。与模拟方法一样，你将在本地计算环境中运行 GDA。\n\n> **NOTE**\n> \n> 互联网工程任务组（IETF）的请求评论文档 RFC\
    \ 7228 定义了各种受限设备（也称为受限节点）类别。这些类别包括 Class 0（非常受限）、Class 1（受限）和 Class 2（ somewhat\
    \ 受限）。¹ 对于我们的目的，我们假设我们的 CDA 可以在 Class 2 或更强大的设备上运行，这些设备通常支持完整的基于 IP 的网络协议栈，这意味着我们将在本书中处理的协议通常适用于此类设备。尽管从技术上讲可以将\
    \ Class 2 设备直接连接到互联网，但我们所有的示例和练习都将通过 GDA 间接与互联网交互。\n\n## Blended Physical Deployment\n\
    \n这种方法几乎与分离部署方法相同，但会将你的 CDA 和 GDA 都运行在 SBC 设备上（例如 Raspberry Pi 或其他类似系统）。这在技术上意味着你可以选择将每个应用程序部署到不同的\
    \ SBC，尽管对于列出的任何练习来说都不是必要的。\n\n如果你选择部署路径 B 或 C，有许多种价格低廉的 SBC 可供选择。像选择我们的设备应具有通用目的输入/输出（GPIO）功能，至少一个可用的集成电路间（I2C）总线，通过\
    \ Wi-Fi 或以太网支持 TCP/IP 和 UDP/IP 网络，运行基于 Linux 的通用操作系统，例如 Debian（或其衍生版如 Raspbian），并支持\
    \ Python 3 和 Java 11（或更高版本）。\n\n尽管你可以选择任何适合你需求的 SBC，但本书中的练习将重点关注集成仿真部署路径，当然除了第\
    \ 4 章。 第二部分介绍了与物理世界集成的概念，我将专门用第 4 章来讨论使用实际硬件的这种集成。虽然原则适用于许多 SBC，但任何硬件特定的集成都将集中在\
    \ Raspberry Pi 平台上——具体来说是 Raspberry Pi 3 Model B+、Model 4 Model B 以及最新版本的 Raspberry\
    \ Pi Zero W。\n\n无论选择哪种部署路径，所有练习和示例都假设你将在单个工作站上进行开发和部署。这涉及一个三步流程，包括准备开发环境、定义测试策略以及确定构建和部署自动化方法。我将在本章中介绍这些步骤的基础知识，但也会逐步补充\n\
    \n"

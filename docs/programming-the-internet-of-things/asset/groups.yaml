  - "[PAGE 91]\n\nThis approach is really powerful, and I think you’ll see how it\
    \ will help you organize the work you need to do and track your progress as you\
    \ go through this book.\n\n# Setting up a Cloud Project and Repositories\n\nThis\
    \ book is actually organized as a large IoT project using a single Kanban board\
    \ across the repositories. Each repository will have a set of tasks that are aligned\
    \ to chapter-based milestones, which map back into the Kanban board.\n\nThe beauty\
    \ of this approach is that, once your project and repositories are properly set\
    \ up, all you really need to do is update your task status as you work through\
    \ each chapter writing, testing and committing your code. The workflow engine\
    \ will automatically parse your task updates, and represent the task’s card on\
    \ the board for you. Neat, huh?\n\nIf you’re interested in using GitHub to set\
    \ all of this up, here’s a simple 3-step process you can use to get started:\n\
    \n+   1. Create a GitHub account\n+   \ta. If desired, create an organization\
    \ associated with the GitHub account\n+   2. Within the your account (or organization),\
    \ create the following:\n+   \ta. A new private project named ‘Programming the\
    \ IoT - Exercises’"

    \n+   a. From the command line, execute the following commands:\n\n```\ngit remote\
    \ set-url origin {your new URL}\n```\n\n```\ngit commit -m \"Initial commit.\"\
    \n```\n\n```\ngit push\n```\n\n+   b. IMPORTANT: Be sure to do this for both ‘piot-java-components’\
    \ and ‘piot-python-components’, using the appropriate Git repository URL for each!\n\
    \n> NOTE\n> \n> I’ve written a guide to help you configure all of this, located\
    \ at the book’s homepage (https://programmingtheiot.com/programming-the-iot-book.html).\n\
    \nOnce you complete the tasks above, your cloud-based workflow environment is\
    \ now set up and ready to use. Take a look at Figure 1-12. It shows the task template\

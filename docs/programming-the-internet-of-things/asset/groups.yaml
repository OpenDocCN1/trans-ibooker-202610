    These kinds of dependencies can make integration testing pretty challenging with
    any environment, and even more so with the IoT, since we sometimes have to set
    up servers to run specialized protocols to test our stuff. Fortunately, Maven
    can help with this, too, since it supports plugins which make some of this much
    easier. For all the code that needs to integrate only within the Edge Tier, we’ll
    use Maven plus some specialized Unit Tests as part of our integration testing
    strategy.


    Finally, performance tests are useful for testing how quickly, or efficiently,
    a system handles a variety of conditions. They can be used with both unit and

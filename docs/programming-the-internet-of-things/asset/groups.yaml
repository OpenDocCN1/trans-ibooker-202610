    you still need to manually start the applications up and then run your integration
    and / or performance tests.


    As a developer, part of your job is writing and testing code to meet the requirements
    that have been captured (in cards on a Kanban board, for example), so there’s
    always some manual work involved. Once you know your code units function correctly,
    it would be pretty slick to have everything else run automatically - say, after
    committing and pushing your code to the remote dev branch (such as ‘chapter02’,
    for example).


    GitHub supports this automation through GitHub actions 11. I’ll talk more about
    this in Chapter 2 and help you set up your own automation for the applications
    you’re going to build.


    ## Automated CI/CD in your Local Development Environment


    There are lots of ways to manage CI/CD within your local environment. GitHub actions
    can be run locally using self-hosted runners 12, for example. There’s also a workflow
    automation tool called Jenkins 13 that can be run locally, integrates nicely with
    Git local and remote repositories, and has a plugin architecture that allows you
    expand its capabilities seemingly ad infinitum.


    ## WARNING


    There are lots of great 3rd party Jenkins plugins, but some are not well maintained
    and may introduce security vulnerabilities. If it’s a plugin you’re certain you
    need, be sure to track how often it’s updated and patched. If it’s not regularly
    maintained, it could introduce compatibility and security issues to your environment.


    Once installed and secured, you can configure Jenkins to automatically monitor
    your Git repository locally or remotely, and run a build / test / deploy / run
    workflow on your local system, checking the success at each step. If, for example,
    the build fails because of a compile error in your code, Jenkins will report on
    this and stop the process. The same is true if the build succeeds, but the tests
    fail - the process stops at the first failure point. This ensures your local deployment
    won’t get overwritten with an update that doesn’t compile or fails to successfully
    execute the configured tests.


    Setting up any local automation tool can be a complicated and time consuming endeavor.
    It’s super helpful, however, as it basically automates all the stuff you’re going
    to do to build, test and deploy your software. That said, it’s not required for
    any of the exercises in this book.


    I’ve detailed my own approach using GitHub actions and self-hosted runners as
    well as Jenkins in a document on my website at https://programmingtheiot.com/setup/ConnectedDevices_DevEnvironmentSetup.html.
    See the Table of Contents to navigate to the section most relevant for your environment.


    ## A Few Thoughts on Containerization


    You''ve likely heard of *containerization*, which is simply a way to package your
    application and all of its dependencies into a single image, or *container*, that
    can be deployed to many different operating environments. This approach is very
    convenient, since it allows you to build your software and deploy it in such a
    way as to make the hosting environment no longer a concern, provided the target
    environment supports the container infrastructure you''re using.


    Docker 14 is essentially an application engine that runs on a variety of operating
    systems, such as Windows, Mac, and Linux, and serves as a host for your container
    instance(s). Your GDA and CDA, for example, can each be containerized and then
    deployed to any hardware device that supports the underlying container infrastructure
    and runtime.


    It''s worth pointing out that containerizing any application that has hardware-specific
    code may be problematic as it will not be portable to another, different hardware
    platform (even if the container engine is supported). If you want your hardware-specific
    application to run on any platform that supports Docker, that platform would require
    a hardware-specific emulator compatible with the code developed for the application.


    For example, if your CDA has code that depends on Raspberry Pi-specific hardware,
    This is less of a concern for us at the moment, since you’ll be simply emulating
    sensors and actuators and won’t have any hardware-specific code to worry about
    until Chapter 4 (which, again, is optional). I’ll discuss this more in Chapter
    4, along with strategies to overcome hardware-specificity in your CDA.


    When using CI/CD pipelines in a remote, or cloud, environment, you’ll notice that
    these services will likely deploy to virtual machines and run your code within
    a container that includes the required dependencies, all configured as part of
    the pipeline. For many cases, this makes perfect sense and can be an effective
    strategy to ensure consistency and ease of deployment.


    To keep things a bit more simple, I won’t walk through containerization in this
    book for use within your development environment and as part of your workstation,
    even though there are many benefits to doing so. The primary reason is that it
    adds another layer of complexity to manage initially and I want to get you up
    and running with your own applications as soon as possible.


    If you’re interested in learning more about containerizing your IoT workstation
    and local environment, I’ve detailed my approach for the GDA, CDA, and other related
    applications within https://programmingtheiot.com/setup/ConnectedDevices_DevEnvironmentSetup.html.
    See the section labeled ‘Using Containers’ for more information.


    ## Conclusion


    Congratulations! You’ve just completed the longest - and perhaps most tedious
    - chapter in the book. You learned about some basic IoT principles, created a
    problem statement to drive your IoT solution, and established a baseline IoT systems
    architecture that includes the cloud tier and edge tier.


    Perhaps most importantly, I introduced two applications - the GDA and CDA - which
    will serve as the foundation for much of your IoT software development throughout
    this book, and that you’ll start building in Chapter 2. Finally, you set up your
    development environment and workflow, learned about requirements management, explored
    unit, integration and performance testing, and considered some basic CI/CD concepts
    to help automate your builds and deployment.


    You’re now ready to start building your first two IoT applications using Python
    and Java. If you’re ready to move on, I’d suggest you grab a good cup of coffee
    or tea. Let’s dig in.


    1 Details on the various classes of constrained devices can be found within the
    IETF’s RFC 7228 (https://tools.ietf.org/html/rfc7228).


    2 More information on GitHub can be found on their website (https://github.com/).


    3 Virtualenv provides a way to contain your Python 3 environment and all the necessary
    library dependencies within a single, lightweight, virtual environment.


    4 The Eclipse IDE version used for the exercises and examples listed in this book
    is 2020-06 and can be downloaded from the Eclipse website (https://www.eclipse.org/downloads/).


    5 More information on PyDev can be found on the project''s website (http://www.pydev.org/).


    6 Detailed information on JUnit and the latest version, JUnit 5, can be found
    on the JUnit website (https://junit.org/junit5/).


    7 Detailed information on Python 3''s unittest library can be found in the unittest
    documentation (https://docs.python.org/3/library/unittest.html).


    8 For more information on Locust, see the documentation from their website (https://docs.locust.io/en/stable/what-is-locust.html).


    9 You can read more about GitHub and its Git hosting features on their website
    (https://github.com/).


    10 Read more about the Agile Manifesto at https://agilemanifesto.org/.


    11 GitHub actions is a feature available within GitHub that allows customized
    workflows to be created for those who have an account within GitHub. You can read
    more about GitHub actions on their website (https://docs.github.com/en/actions).


    12 Self-hosted runners, part of GitHub actions, allow you to run your action workflows

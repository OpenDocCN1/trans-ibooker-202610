    # Chapter 2. Building Two Simple IoT Monitoring Applications


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 2nd chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the author at aking.em@gmail.com.


    *I must have data!*


    *How much memory remains?*


    *I dare not look. Sigh.*


    **Fundamental concepts:** Build two IoT performance monitoring applications –
    one as an IoT gateway, and the other as an IoT constrained device.


    This chapter focuses on the initial steps to getting your IoT solution up and
    running. You’ll build upon these in the upcoming chapters, so setting the basic
    design in place now is very important. The overall architecture presented in Chapter
    1 provides the initial guidance you’ll need to start coding your IoT'

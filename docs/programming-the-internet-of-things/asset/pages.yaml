- pgno: 130
  md: 'Reading a single value from a sensor (emulated or real) is good, but not very
    useful for our purposes, since we’ll want to monitor these values over time to
    see if they change. Even after connecting SystemCpuUtilTask and SystemMemUtilTask
    into SystemPerformanceManager, you’ll want to process their data on a recurring
    basis.


    There are many ways to do this in Python: You can build your own scheduling mechanism
    using Python’s concurrency library, or leverage one of many open source libraries
    to do this for you. I’ve included apscheduler¹ in basic_imports.txt, which provides
    a scheduling mechanism that will suit our purposes rather well.


    # NOTE


    Python provides two mechanisms for running code in a way that appears to execute
    simultaneously with other code. One is using concurrency, and the other is using
    multiprocessing. The former is handled using threads, whereas the latter is handled
    using separate child processes. One key difference is that Python threads actually
    get run in sequence using the same processor core as the main application, but
    they happen in such a way as to appear to be running simultaneously. Multiprocessing
    allows for true parallelism, where the code written using the multiprocessor library
    can be distributed to run on a separate processor core, which can execute in parallel
    to other code in a different processor core. The CDA-specific exercises and samples
    within this book will assume that threaded concurrency in Python is sufficient
    for our needs, and so I won’t discuss multiprocessing for any CDA development.


    # INTEGRATING SYSTEMCPUUTIL TASK AND SYSTEMMEMUTIL TASK WITH'
  merge: -1
  img_proc: true

- pgno: 136
  md: 'Why is the gateway device doing all of this work? Tracking CPU and memory utilization
    makes sense, since you’ll want to track the device’s overall load and memory consumption.


    But disk and network utilization? In Chapter 5, I’ll discuss local caching of
    messages, so this will be an important metric to track. In Chapter 6 and beyond,
    I’ll dig into passing messages between devices (and eventually the cloud in Chapter
    10), so tracking network utilization will be pretty useful as well.


    Aren’t there tools for this? Sure, and you should use them when they make sense.
    Devices that are part of the IoT Edge Tier aren’t always easy to manage, nor are
    they always able to participate in network monitoring environments. This doesn’t
    mean we need to build everything from scratch! But, we will anyway. Because we
    can. And it’s fun :).


    Back to the diagram. Notice that GatewayDeviceApp is the entry point for the application
    and creates the instance of, and manages, SystemPerformanceManager, which is rather
    similar to the CDA design. We also have a SystemCpuUtilTask and SystemMemUtilTask,
    along with the other tasks (SystemDiskUtilTask, SystemNetInputTask, and SystemNetOutputTask)
    that will help us later.'

- pgno: 13
  md: '# How Is This Book Arranged?


    This book will take you through building an end-to-end, full-stack, and integrated
    IoT solution using various open source libraries and software components that
    you’ll build – step-by-step. Each of these components will be part of the larger
    system, and you’ll see how they interconnect with and map into an end-state architecture
    as you work through each chapter’s exercises.


    If you’re not planning on implementing the exercises and just want to get your
    feet wet with various IoT technologies, feel free to skip around to those sections
    that are most interesting to you and relevant for your needs.


    I’ve grouped like chapters together and used this scheme to establish the four
    parts of the book: Part I - Getting Started, Part II - Connecting to the Physical
    World, Part III - Connecting to Other Devices, and Part IV - Connecting to the
    Cloud. Let’s review each in a bit more detail.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Part I – Getting Started


    In this section, we build our initial foundation for IoT development. You’ll start
    by creating a development and testing environment, and wrap-up the section by
    writing two simple applications to validate our environment is working properly.


    +   - Chapter 1 is the longest chapter in the book as it lays the groundwork for
    how you’ll build your end-to-end solution. It will help you establish a baseline
    of IoT knowledge and set up your workstation and development environment so you
    can be productive as quickly as possible. I’ll cover some basic IoT terms, create
    a simple problem statement, define core architectural concepts, and establish
    an initial design approach that I’ll use as the framework for each subsequent
    exercise.


    # NOTE


    The IoT consists of a plethora of heterogeneous devices and systems, and there
    are many tools and utilities available to support development and system automation.
    The tools and utilities I use throughout the book fall into the open source category,
    and represent a small subset of those available to you. These shouldn’t be taken
    as carte blanche recommendations, of course, as you may have your own that you
    prefer to work with and are best suited for your specific needs. My goal is only
    to keep the content well-bounded, and to help inform a generalized development
    and automation approach to help you be successful implementing the exercises in
    this book.'
  merge: -1
  img_proc: true
- pgno: 15
  md: +   - Chapter 2 covers your development environment setup and requirements capture
    approach, and then moves into coding. In this chapter, you’ll create your first
    two IoT applications - one in Python and the other in Java. These will be quite
    simple, but set the stage for subsequent chapters. Even if you’re an experienced
    developer, it’s important to work through the exercises as given so we’re working
    from the same baseline going forward.

- pgno: 110
  md: 'Remember the problem statement from Chapter 1? Let’s briefly review it now:


    > *I want to understand the environment in my home and how it changes over time,
    and make adjustments to enhance comfort while saving money.*


    If you think about all of the things your applications will need to do to address
    this problem, and also consider the importance of testing system behavior and
    performance, there are some important capabilities you’ll want to ‘bake in’ from
    the start. One is the ability to easily add new features as we go, and the other
    is to track each application’s performance so we know if it’s working adequately.


    The first step in designing both the GDA and CDA is to create an application wrapper
    that can determine what features need to be loaded and then launch those features
    consistently. I’ll introduce application configuration using a configuration file
    in Chapter 3, so no need to worry about that right now.


    Your initial GDA and CDA designs will look very similar to one another. They’ll
    collect some basic telemetry, which for now will include just CPU utilization
    and memory utilization, and simply log the data to the console. It won’t be long
    before you’ll have both applications talking to one another.


    Let’s get started, shall we?'

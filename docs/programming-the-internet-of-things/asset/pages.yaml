- pgno: 45
  md: 'Figure 1-1. Simple IoT data flow


    Most IoT systems will require at least some of the five action categories I’ve
    called out: data collection, data management, analytics, configuration management,
    and system triggers. This means we can define an architecture that maps these
    into a systems diagram, and then start creating software components that implement
    part of the system.


    This is where the fun starts for us engineers, so let’s get going with an architecture
    definition that can support our problem statement (and will, in fact, be reusable
    for others).


    # Architecting a Solution


    Organization, structure, and clarity are hallmarks of a good architecture, but
    too much can make for a rigid system that doesn’t scale well for future needs.
    And if we try to establish an architecture that will meet all our plausible needs,
    we’ll never finish (or perhaps even never get started)! It’s about balance, so
    let’s define the architecture with future flexibility in mind, but also keep things
    relatively well bounded. This will allow you to focus on getting to a solution
    quickly, while still permitting updates in the future. But first, there are a
    few key terms that need to be defined to help establish a baseline architectural
    construct to build your solution upon.


    As you may recall from Figure 0-1 in the Preface, IoT systems are generally designed
    with at least two (sometimes three or more) architectural tiers in mind. This
    allows for the separation'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'of functionality both physically and logically, which permits for flexible
    deployment schemes. All of this is to simply say that the cloud services running
    within the cloud tier can - technically speaking - be anywhere in the world, while
    the devices running within the edge tier must be in the same location as the physical
    systems that are to be measured. Just as Figure 0-1 implies, an example of this
    tiering may include a constrained device with sensors or actuators talking to
    a gateway device, which in turn talks to a cloud-based service, and vice-versa.


    Since we need a place for these five categories of functionality to be implemented,
    it’s important to identify their location within the architecture so we can have
    some things running close to where the action is, and others running in the cloud
    where you and I can access (and even tweak) the functionality easily. Recalling
    the edge tier and cloud tier architecture from the Preface, let’s see how to map
    each of the action categories from the ‘what’ and ‘why’ into each:


    +   - Edge Tier (constrained devices and gateway devices): Data collection, data
    management, device triggers, configuration management, and analytics.

    +   - Cloud Tier (cloud services): Data management, configuration management and
    system analytics.


    Why do the Edge Tier and Cloud Tier include similar functionality? First, let’s
    take a look at how our flow chart fits within a tiered architecture:'
  merge: -1
  img_proc: true
- pgno: 47
  md: '![](img/051213a7a9851bf581895f86e6a2becd_47_0.png)


    # Edge Tier


    # Cloud Tier'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'Figure 1-2. - Notional IoT data flows between the Edge and Cloud Tiers


    Again, notice that we have some shared responsibility where some of the action
    categories are implemented within both tiers. Normally, duplication of effort
    is a bad thing - but in this case, it can be an advantage! Simple analytics can
    be used to trigger a device based on some simple settings if warranted - for example,
    if the temperature in your home exceeds 80o F, you’ll probably want to trigger
    the HVAC straight away and start cooling things down to, say, 72o F. There’s no
    need to depend on a remote cloud-based service in the Cloud Tier to do this, although
    it would be useful to notify the Cloud Tier that this is happening, and perhaps
    store some historical data for later analysis.


    Our architecture is starting to take shape. Now we just need a way to map it to
    a systems diagram so we can interact with the physical world (using sensors and
    actuators). It would also be good to structure things within our Edge Tier to
    avoid exposing components to the Internet unnecessarily. This can be managed using
    a constrained device with a specialized software application that can either run
    directly on the device, or on a laptop or other generic computing system with
    simulation logic that can emulate sensor and actuator behavior.


    Since you’ll want to access the Internet eventually, your design should include
    a gateway to handle this and other needs. This functionality can be implemented
    as part of a software application that runs on a gateway device (or, again, a
    laptop'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'or other generic computing system). Your gateway device and constrained device
    will comprise the ‘edge’ of your IoT design, which I’ll refer to as the edge tier
    of your architecture going forward.


    We’ll also want to deploy analytics services, storage capabilities, and event
    managers in a way that’s secure, but accessible from our gateway device and also
    by human beings. There are many ways to do this, but we’ll focus on one (or more)
    cloud services for this functionality.


    Figure 1-3 provides a new view that will provide further insight into what you’re
    going to build and how you can begin incorporating the five action categories
    I’ve already mentioned. It represents, in grey boxes, cloud services within the
    Cloud Tier, and two applications within the Edge Tier - CDA and GDA - that will
    be implemented to contain the functionality of your constrained device and gateway
    device, respectively.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '![](img/051213a7a9851bf581895f86e6a2becd_50_0.png)'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Figure 1-3. - Notional IoT simplified logical architecture with Edge and Cloud
    Tiers


    Let’s dig into each a bit further:


    +   - Constrained Device App (CDA)

    +     You’ll build this software application to run within the constrained device
    (emulated or actual), and it will provide data collection and system triggers
    functionality. It will handle the interface between the device’s sensors (which
    read data from the environment) and actuators (which trigger actions, such as
    turning the thermostat on or off). It will also play a role in taking action when
    an actuation is needed. Eventually, it will be connected to a communications library
    to send messages to, and receive messages from, the Gateway Device App.

    +   - Gateway Device App (GDA)

    +     You’ll build this software application to run within the gateway device
    (emulated or actual), and it will provide data management, analytics, and configuration
    management functionality. It’s primary role is to manage data and the connections
    between the CDA and cloud services that exist within the Cloud Tier. It will manage
    data locally as appropriate, and - sometimes - take action by sending a command
    to the constrained device that triggers an actuation. It will also manage some
    of the configuration settings - that is, those that represent nominal for your
    environment, and perform some simple analytics when new telemetry is received.

    +   - Cloud Services'
  merge: -1
  img_proc: true
- pgno: 52
  md: All cloud services applications and functionality do the heavy data processing
    and storage work, as they can theoretically scale it ad infinitum. This simply
    means that, if designed well, you can add as many devices as you want, store as
    much data as you want, and do in-depth analysis of that data - trends, highs,
    lows, configuration values, etc., all while passing any relevant insights along
    to a human end user, and perhaps even generate Edge Tier actions based on any
    defined threshold crossing(s). Technically, cloud services within an IoT environment
    can handle all the action categories previously mentioned, with the exception
    of data collection (meaning, they don’t perform sensing or actuation actions directly).
    You’ll build some cloud services to handle this functionality, but mostly utilize
    those generic services already available from some cloud service providers.
  merge: -1
  img_proc: true

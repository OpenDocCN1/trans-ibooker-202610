- pgno: 38
  md: "# Chapter 1. Setting Up Your Environment\n\n# A NOTE FOR EARLY RELEASE READERS\n\
    \nWith Early Release ebooks, you get books in their earliest form—the author’s\
    \ raw and unedited content as they write—so you can take advantage of these technologies\
    \ long before the official release of these titles.\n\nThis will be the 1st chapter\
    \ of the final book. Please note that the GitHub repo will be made active later\
    \ on.\n\nIf you have comments about how we might improve the content and/or examples\
    \ in this book, or if you notice missing material within this chapter, please\
    \ reach out to the author at aking.em@gmail.com.\n\n> *A path lies ahead,*\n>\
    \ \n> *Brambles and thorns, then it clears.*\n> \n> *Almost there. Patience.*\n\
    \n**Fundamental concepts:** Identify a problem area to tackle and define an architecture\
    \ as the baseline for your IoT solution; Setup an IoT-centric development environment\
    \ that supports multiple deployment options.\n\nYou’ve likely gathered by now\
    \ that the Internet of Things can be vast, unwieldy, and very difficult to tame.\
    \ To plan a way forward, we’ll first want to identify a problem area to tackle\
    \ and then create an architecture from which to design and build our IoT solution."
  merge: -1
  img_proc: true
- pgno: 39
  md: 'Let’s start with a few key questions to establish a baseline:

    What problem are you trying to solve? Where does it start and end? Why does it
    require an IoT ecosystem? How will all these pieces work together to solve this
    problem? What outcome can you expect if everything works as designed? We’ll explore
    each of these in detail, and along the way construct an end-to-end, integrated
    IoT solution that meets our needs.


    # What you’ll learn in this chapter


    To help you really understand how an IoT system can and should be constructed,
    I’ll dig into some basic architectural concepts based on the questions above,
    and use this as the basis for each programming activity. From there, you’ll build
    a solution that addresses the problem layer by layer, adding more functionality
    as you work through each subsequent chapter.


    It goes without saying, of course, that the right development tools will likely
    save you time and frustration, not to mention help you with testing, validation,
    and deployment. There are many excellent open source and commercial development
    tools and frameworks available to support you.


    If you’ve been a developer for any length of time, I expect you have your own
    specific development environment preferences that best suit your programming style
    and approach. I certainly have mine, and while the examples I present will be
    based on my preferred set of tools, my goal in this chapter is not to'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'specify those you must use, but to help you ramp up on IoT development in a
    way that enables you to move out quickly and eventually choose your own for future
    development projects.


    The concepts I present will be what matter most – the programming languages, tools
    (and their respective versions), and methods can be changed. These concepts represent
    some of the fundamentals of consistent software development: system design, coding,
    and testing. Let’s dig into each and get moving towards building your integrated
    IoT system.


    # Designing Your System


    Creating a problem statement is probably the most important part of this puzzle.
    Let’s try it by drafting something reasonably straight-forward, but sufficient
    to encompass a variety of interesting IoT challenges:


    I want to understand the environment in my home and how it changes over time,
    and make adjustments to enhance comfort while saving money.


    Seems simple enough, but this is a very broad goal. We can narrow it down by defining
    the key actions and objects in our problem statement. Our goal is to isolate the
    ‘what’, ‘why’, and ‘how’. Let’s first look at the ‘what’ and the ‘why’, and identify
    any action(s) that the design should consider as part of this process.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Breaking Down The Problem


    The exercises in this book will focus on building an IoT solution that can help
    you understand your home environment and respond appropriately. The assumption
    is that you’ll want to know what’s going on within your house (within reason),
    and take some sort of action if it’s warranted (that is, if the temperature is
    too hot, turn on the air conditioning). Simple, right?


    This part of your design approach requires three steps:


    +   1. Collect Data


    Let’s define this in terms of what can be sensed, like temperature, humidity,
    etc. This is centered on the capture and transmission of *telemetry* (measurement
    data). The action, or rather, action category, will simply be named *data collection*


    +   - Temperature

    +   - Relative Humidity

    +   - Barometric Pressure

    +   - System Performance (utilization metrics for CPU, memory, storage)


    +   2. Determine Relevant Changes


    To decide which data is relevant, and whether or not a change in value is important,
    we need to not only collect data, but to store, and trend, time-series data on
    the items we can sense (like temperature, humidity,'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'etc, as indicated above). Let’s refer to this action category as *data management*.


    # 3. Take Action


    We’ll establish some basic rules to determine if we’ve crossed any important thresholds,
    which simply means we’ll send a signal to something if a threshold is crossed
    that requires some type of action (e.g. turn up / down a thermostat). We’ll refer
    to this action category as *system triggers*.


    # Defining Relevant Outcomes


    Now that we know what steps we need to take, let’s explore the ‘why’ portion of
    our problem statement. We can summarize this using the following two points:


    +   - Increase Comfort

    +     Ideally, we’d like to maintain a consistent temperature and humidity in
    our living environment. Things get a bit more complicated when we consider the
    number of rooms, how they’re used, etc. We’ll refer to this action category as
    *configuration management*, and it goes hand-in-hand with both data management
    and system triggers.


    +   - Save Money

    +     This gets a bit tricky. The most obvious way to save money is to not spend
    it! Since we’ll likely need to allocate financial resources to heat, cool, or
    humidify a given area, we want to optimize - not too much (wasteful), and not
    too little (we could end up with frozen water pipes in the winter). Since we might
    have'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'some complexity to deal with here - including utility costs, seasonal changes,
    etc., as well as anything related to configuration management - we’ll probably
    need some more advanced analytics to handle these concerns. We’ll call this action
    category **_analytics_.**


    You’ve likely noticed that each of the steps in the ‘what’ and ‘why’ sections
    above have an action category name that will help with the solution design once
    we move onto the ‘how’. As a reminder, these categories are: data collection,
    data management, system triggers, configuration management, and analytics. We’ll
    dig further into each of these as part of our implementation approach.


    Although the problem statement seems rather simple on the surface, it turns out
    that the things you’ll need to do to address the problem are actually quite common
    within many IoT systems. There’s a need to collect data at its source, store and
    analyze that data, and take action if some indicator suggests that would be beneficial.
    Once you define your IoT architecture and start building the components that implement
    it - even though it will be specific to this problem - you’ll see how it can be
    applied to many other problem areas.


    Let’s take a quick look at a simple data flow that represents this decision process
    in Figure 1-1. You’ll notice each action category is highlighted in the data flow
    diagram depicted in Figure 1-1:'
  merge: -1
  img_proc: true

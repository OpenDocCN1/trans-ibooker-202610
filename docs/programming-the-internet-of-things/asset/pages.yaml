- pgno: 127
  md: '# NOTE


    You may recall psutil was one of the libraries you imported when setting up your
    virtualenv environment and used pip to install basic_imports.txt. This library
    gives you the ability to monitor system metrics, such as CPU utilization and memory
    utilization. You can read all about its features online (https://psutil.readthedocs.io/en/latest/#).


    Look carefully at the action specifying the following line of code:


    ```

    puUtilPct = self.perfMgr.cpu_percent()

    ```


    The library will aggregate all cores into a single CPU percentage, which makes
    life rather easy for you as a developer. This class essentially boils down to
    returning the value of this single line of code.


    OK, so before we go any further, why the fancy wrapper around the code? Isn’t
    this overkill? Simply put, yes it is. But you’ll see a pattern emerge in how you’ll
    write similar code to represent other, more complicated sensors. The point of
    this particular exercise is certainly to obtain the CPU utilization, but also
    to establish a pattern of separation of control, or separation of key functions
    so they can be managed and updated separately from the rest of the application’s
    logic.'
  merge: -1
  img_proc: true

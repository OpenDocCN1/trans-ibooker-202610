- pgno: 80
  md: '# NOTE


    What’s the difference between a function and a method? To grossly oversimplify,
    a function is a named grouping of code that performs a task (such as adding two
    numbers together) and returns a result. If the function accepts any input, it
    will be passed as one or more parameters. A method is almost identical to a function,
    but is attached to an object. In object oriented parlance, an object is simply
    a class that’s been instantiated, and a class is the formal definition of a component
    - its methods, parameters, construction, and deconstruction logic. All of the
    Java examples in this book will be represented in class form with methods defined
    as part of each class. Python can be written in script form with functions or
    as classes with methods, but I prefer to write Python classes with methods and
    will do so for each Python example shown in this book, with only a few exceptions
    to this.


    # Unit, Integration, and Performance Testing


    There are many ways to test software applications and systems, and some excellent
    books, articles and blogs on the subject. Developing a working IoT solution requires
    careful attention to testing - within an application and between different applications
    and systems. For the purposes of the solution you’ll develop, I’ll focus on just
    three: Unit tests, integration tests, and performance tests.


    Unit tests are code modules written to test the smallest possible unit of code
    that’s accessible to the test, such as a function or method. These tests are written
    to verify a set of'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'inputs to a given function or method returns an expected result. Boundary conditions
    are often tested as well, to ensure the function or method can handle these types
    of conditions appropriately.


    # NOTE


    A unit of code can technically be a single line, multiple lines of code, or even
    an entire code library. For our purposes, a unit refers to one or more lines of
    code, or an entire code library, that can be accessed through a single interface
    that is available on the local system - that is, a function or a method which
    encapsulates the unit’s functionality and can be called from your test application.
    This functionality can be, for example, a sorting algorithm, a calculation, or
    even an entry point to one or more additional functions or methods.


    I use JUnit for unit testing Java code (included with Eclipse), and PyUnit for
    unit testing Python code (part of the standard Python interpreter, and available
    within PyDev). You don’t have to install any additional components to write and
    execute unit tests within your IDE if you’re using Eclipse and PyDev.'
  merge: -1
  img_proc: true

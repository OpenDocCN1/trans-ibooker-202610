    # Step II: Define Your Testing Strategy


    Now that your development environment is established for your GDA and CDA, we
    can discuss how you’ll test the code you’re about to develop. Obviously, good
    testing is a critically important part of any engineering effort, and programming
    is no exception to this. Every application you build should be thoroughly tested,
    whether it works completely independently of other applications or is tightly
    integrated with other systems. Further, every unit of code you write should be
    tested to ensure it behaves as expected. What exactly is a unit? For our purposes,
    a unit is always going to be represented as a function or method that you want
    to test.'

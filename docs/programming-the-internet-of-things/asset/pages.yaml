  md: 'solution, and we’ll keep building upon it as we blaze ahead in this chapter
    and beyond. I’m sure you’re anxious to start building out your own solution based
    on what you’ll learn, but it’s important to take things one step at a time.


    We’ll start with two simple applications that collect some simple telemetry about
    the devices (real or virtual): a Gateway Device App (GDA) that will run on your
    “gateway device”, and a Constrained Device App (CDA) that will run on your “constrained
    device”. The design of each application provides the foundation for all of the
    code you’ll develop for the edge tier, so you may want to keep the design from
    Chapter 1 handy for reference.


    # What you’ll learn in this chapter


    This is the beginning of your coding journey with the IoT. You’ll learn how to
    define a detailed design for both your GDA and CDA, separate the logical components
    of your design, and implement the framework for these two applications in Java
    (GDA) and Python (CDA).


    These will be very simple applications, but they’ll serve as important foundation
    layers for your overall solution. Each will implement an application framework
    and exercise that framework by incorporating external libraries used to track
    the performance of a computing system. You’ll use the data they generate for your
    initial foray into creating telemetry using your CDA and GDA.


    # Designing Your IoT Applications'

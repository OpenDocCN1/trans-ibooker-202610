- pgno: 30
  md: '*Figure P-1. - Notional IoT System Architecture*


    I find it easiest to qualify these devices as follows:


    +   - *Constrained devices* only handle sensing, actuation, or perhaps both, while
    only processing messages for themselves, passing messages along if the right communications
    protocol is implemented, and sending messages to a gateway device. In short, they’re
    limited in their abilities, and don’t connect directly to the Internet – only
    via a gateway device.

    +   - *Gateway devices* are a super set – they can potentially do the same work
    as a constrained device (in that they may have sensor(s) or actuator(s) attached),
    but also have the ability to perform ‘at the edge’ analytics, determine how messages
    should be routed (if at all), and of course, connect directly to the Internet
    and the various cloud services that make the IoT useful for business stakeholders.


    Can a constrained device connect directly to the Internet? Sure, if it contains
    a TCP/IP stack, has a routable IP address that’s accessible to and from the public
    Internet, and of course has the appropriate communications hardware to talk to,
    and is connected with, the Internet. For the purposes of this book, however, I’ll
    narrow the category of constrained devices to these two limitations:


    +   - They do not support packet routing directly to or from the public Internet
    (although we’ll assume they support both TCP/IP and UDP/IP) and must interact
    with a gateway device in order to be part of any IoT ecosystem.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   - They do not contain adequate computing resources to intelligently determine
    complex courses of action based on the data they collect.


    What it all means is this: As we make better computing devices that are smaller,
    faster, and cheaper; use them to interact with the physical world, and connect
    them (or their data) to the Internet for processing using cloud services, we can
    derive insights that help deliver better business outcomes.


    At the end of this book, I’ll explore some use cases like the one just discussed,
    but in more detail. Each use case will include an implementation exercise that
    will allow you to explore the concept using the knowledge you’ve gleaned from
    previous chapters and the code you’ll develop as part of the exercises.


    One last point before delving into our first section: Each chapter begins with
    a haiku that attempts to capture the essence of what you’ll learn and some of
    the challenges you’ll likely encounter. How did this come to be? From my early
    days as a software developer, one of the team’s I worked with had a policy that
    if you committed code that caused the nightly build to break, you’d have to write
    a haiku related to the issue and e-mail it to everyone on the team. You may not
    encounter ‘broken nightly builds’ much by working through the exercises in this
    book, but the haiku’s should at least provide some levity before you dig into
    each chapter.


    Thanks for reading!'
  merge: -1
  img_proc: true

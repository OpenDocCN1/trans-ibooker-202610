    # A Few Thoughts on Containerization


    You''ve likely heard of *containerization*, which is simply a way to package your
    application and all of its dependencies into a single image, or *container*, that
    can be deployed to many different operating environments. This approach is very
    convenient, since it allows you to build your software and deploy it in such a
    way as to make the hosting environment no longer a concern, provided the target
    environment supports the container infrastructure you''re using.


    Docker ¹⁴ is essentially an application engine that runs on a variety of operating
    systems, such as Windows, Mac, and Linux, and serves as a host for your container
    instance(s). Your GDA and CDA, for example, can each be containerized and then
    deployed to any hardware device that supports the underlying container infrastructure
    and runtime.


    It''s worth pointing out that containerizing any application that has hardware-specific
    code may be problematic as it will not be portable to another, different hardware
    platform (even if the container engine is supported). If you want your hardware-specific
    application to run on any platform that supports Docker, that platform would require
    a hardware-specific emulator compatible with the code developed for the application.'

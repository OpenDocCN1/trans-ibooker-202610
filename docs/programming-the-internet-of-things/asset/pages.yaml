- pgno: 16
  md: '# Part II – Connecting to the Physical World


    This section covers a fundamental characteristic of the IoT – integration with
    the physical world. You''ll learn how to read sensor data and trigger an actuator
    both virtually using emulators and on an actual IoT device.


    +   - Chapter 3 explores ways you can collect data from the physical world (sensing),
    and trigger actions based on that data (actuation). You''ll start by building
    a set of simple emulators which you may continue using throughout each subsequent
    exercise. These simple emulators will help you simulate real sensors and permit
    you to trigger actuation events.

    +   - Chapter 4 builds upon Chapter 3 by discussing ways to connect to a small
    sampling of real sensors and actuators if you choose to build and run your applications
    on one or more physical devices. This chapter focuses on the Raspberry Pi, and
    assumes the hardware is running the Raspbian operating system.

    +   - Chapter 5 discusses telemetry and data formatting. I''ll discuss ways to
    structure your data so it''s easy to store, transmit, and understand by both humans
    and machines. This will serve as the foundation for your interoperability with
    other ‘things’.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Part III – Connecting to Other Things


    This is where the rubber meets the road, so to speak. This section focuses on
    integration across devices, as to be truly integrated, you’ll need a way to get
    your telemetry and other information from one place to another. The chapters in
    this section focus on learning about and utilizing application layer protocols
    designed for use within IoT ecosystems. I’ll assume your networking layer is already
    in place and working, although I’ll discuss a few wireless protocols along the
    way.


    +   - Chapter 6 introduces Publish / Subscribe protocols - specifically Message
    Queuing Telemetry Transport (MQTT) and other related standards often used in IoT
    applications. I’ll walk through a select set of specifications and explain how
    you can begin building out a simple abstraction layer that allows you to easily
    interface with common open source libraries.

    +   - Chapter 7 is nearly identical to Chapter 5, except it focuses on Request
    / Response protocols - specifically the Constrained Application Protocol (CoAP)
    and other standards, also commonly used in IoT applications.

    +   - Chapter 8 explores the use of both Publish / Subscribe and Request / Response
    protocols together. You’ll integrate MQTT and CoAP as part of your solution, and
    see how these two protocols complement one another.

    +   - Chapter 9 introduces yet another protocol - the OPC UA (Open Platform Communications
    Unified Architecture) - giving you the ability to use both the publish / subscribe
    and request / response'
  merge: -1
  img_proc: true

- pgno: 7
  md: '# Preface


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the Preface of the final book. Please note that the GitHub repo will
    be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the author at aking.em@gmail.com.


    The Internet of Things (IoT) is a complex, interconnected system-of-systems composed
    of different hardware devices, software applications, data standards, communications
    paradigms, and cloud services. Knowing where to start with your own IoT project
    can be a bit daunting. *Programming the Internet of Things* is designed to get
    you started on your IoT development journey, and shows you, the developer, how
    to make the IoT work.


    If you decide to stay with me through this book, you’ll learn how to write, test
    and deploy the software needed to build your own basic, end-to-end IoT capability.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Who Is This Book For?


    *Programming the Internet of Things* is written for programmers by a programmer.
    It’s also designed for any technologist (programmer or not) interested in learning
    about, and building, end-to-end IoT solutions, as well as college-level instructors
    teaching their own connected devices course.


    This is not designed as a reference book, nor does it provide an exhaustive deep
    dive into and analysis of the various protocols commonly used for communicating
    amongst IoT devices and cloud services. There are extremely well-written specifications
    for this purpose (although we’ll certainly dive into some of these details to
    better understand these protocols).


    Those who are interested in practicing what is learned in each chapter can move
    straight into the exercises at the end of each chapter, while those interested
    more in the concepts and general knowledge can simply move on to the next section.
    I’ve organized this book so that each of these three groups - Programmers, Instructors,
    and Information Technology (IT) Executives - can benefit.


    # To the Programmer


    If you’re embarking on your own IoT learning journey as a practitioner, I’m assuming
    you’re mostly interested in expanding your skillset, as you’ve witnessed the growth
    of IoT opportunities and want to be part of this important technology evolution.
    Over the years, I found the step-by-step, “build from'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'the ground up" approach to implementing integrated and open IoT solutions to
    be most helpful in understanding the complexities of this area, and so I follow
    this model throughout the book.


    The programming examples you’ll encounter throughout this book are constructed
    from my own journey in learning about the IoT, and have evolved to represent many
    of the lab module assignments from the graduate-level Connected Devices course
    I teach as part of Northeastern University’s Cyber Physical Systems program.


    Each chapter and exercise builds upon the previous, so if you’re starting out
    with the IoT, I’d recommend walking through each as-is, in the order given. If
    you’re experienced in this space and are using this book as a reference guide,
    you may consider incorporating specific lessons of interest into your own application.


    If you’re new to the IoT and unfamiliar with how an end-to-end IoT system comes
    together through software, I’d recommend walking through the book in order, working
    through each exercise, and consider application customizations only after you’ve
    mastered each chapter.


    # To the Instructor


    The contents that form the underpinnings of this book have been used successfully
    in my graduate-level Connected'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'Devices course for the past three years. This book is the formalization of
    these lecture notes, presentations, examples, and lab exercises, structured in
    much the same way as my course.


    The original class was designed as an introduction to the IoT, but with student
    input and suggestions from my Teaching Assistants, it quickly morphed into an
    advanced, project-oriented software development course designed as one of the
    final required classes for students wrapping up their Master’s in the Cyber Physical
    Systems department of Northeastern University. The goal of the course is to establish
    a strong baseline of IoT knowledge to help students move from academia into industry,
    bringing foundational IoT skills and knowledge into their respective organizations.


    This book is structured so it can be used as a reference guide or even as a major
    component of a complete curriculum to help you with your own IoT-related course.
    The content is focused on constructing an end-to-end, open and integrated IoT
    solution, from device to cloud, using a ‘learn as you build’ approach to teaching.
    Since each chapter builds upon the previous, you can use this book to guide your
    students in building their own platform from the ground up.


    You can remain up to date on exercises and other relevant content useful for teaching
    and explaining concepts on the book’s website (https://programmingtheiot.com/programming-the-iot-book/).'

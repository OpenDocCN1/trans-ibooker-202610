    |

    | Project team cohesion | Consistent, united, committed project team |

    | Agile project management | Iterative, feedback-centric management approach |

    | Informed project schedule | Ambitious but practical schedule |


    Highlighting some key considerations in more detail:


    # Data


    Typically the number one determinant of success or failure for a given project.
    Many organizations struggle to capture, organize, and make available the most
    important data used to drive decision making. Organizations with formal data strategies
    have higher success rates.


    # Infrastructure readiness


    Also a strong contributing factor to success, giving organizations that have standardized
    and invested in analytic enclaves and platforms an advantage when operationalizing
    AI.


    # Analytic techniques


    These are critical to an organization’s success or failure. Many times, traditional
    analytic methods are sufficient. But there are times when more cutting-edge methods,
    like deep learning, are crucial to success. For example, natural language processing
    and computer vision methods are'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'achieving incredible success, while newer methods like reinforcement learning
    are still in their infancy.


    While the above factors generally apply to all AI projects, we recognize that
    every organization is unique. It’s important to identify, track, and socialize
    the factors that influence the success of AI across your enterprise. Holding AI
    executive visioning sessions can help to develop objectives and goals as the guiding
    principles for your AI strategy. This ensures your organization can rapidly transition
    prototypes to enterprise AI solutions that meet operational requirements and deliver
    against organizational priorities.


    As you begin to plan new AI projects within your organization, there are a few
    exploratory questions you can ask during your project reviews to help predict
    the success of that project:


    +   1. “Is project leadership actively involved in the project, and do they understand
    and support the objectives?”

    +   2. “Do we have the appropriate mix of skills, training, and experience on
    the project team?”

    +   3. “What delays are we anticipating in the first 90 days of the project?”

    +   4. “What is the anticipated, or actual, retention of key project resources?
    What are the contingency plans?”

    +   5. “How will the team coordinate their efforts throughout the project?”

    +   6. “What are the key objectives and success criteria for the project, and
    how achievable are they?”


    These questions will help you identify and collect critical pieces of information
    to determine whether your AI project is ready to begin its journey. Think back
    to the 10 criteria we outlined above. Are the answers you’re receiving painting
    a picture that these 10 criteria will be met? Are you beginning to realize the
    ideal observations defined in Table 6-1? If so, you can feel confident your AI
    project is on the right track.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'Conversely, if you implement AI without a clear vision, you’ll be unable to
    tie back any success AI brings to your organization’s goals. Without this knowledge,
    your organization could fail to recognize AI’s added value. Moving forward with
    ideas lacking clear value will undercut future AI efforts and hinder additional
    resource investments.


    As you develop early objectives to track the success of your individual AI projects
    and the enterprise AIOps capability, keep in mind the following tips:


    +   - Your objectives will depend on where your organization is in its AI journey.
    Objectives that drive implementation at early stages of implementation will need
    to focus as much on vetting ideas and educating members of the organization as
    they do on developing key elements—the people skills, infrastructure, repeatable
    and integrated solutions—for successful AI.

    +   - Focus on objectives that you can easily measure.

    +   - Focus on new capabilities that address something the organization cannot
    do today instead of reinventing existing or legacy capabilities. This makes it
    easier to demonstrate value added to the organization’s capabilities.

    +   - The objectives need to align with risk tolerance, responsible AI principles,
    data asset availability, and talent requirements.


    We recommend four steps for establishing general objectives as you begin to deploy
    AIOps:


    +   1. Set a clear vision for your organization’s AI capability, starting with
    a clearly defined vision and business objectives. Your organization can use these
    to recognize what its current capabilities are, identify the outcomes you want
    to achieve, and place these within the context of your broader strategic plan.
    Your vision and business objectives will then inform your strategic plan that
    rolls out AI capabilities incrementally, with a focus of continual improvement
    of AIOps, while keeping the mission of the organization clearly in mind.'
  merge: -1
  img_proc: true

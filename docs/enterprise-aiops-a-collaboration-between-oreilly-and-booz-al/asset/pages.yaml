- pgno: 74
  md: 'Figure 5-7. ML life cycle


    # Business Analysis


    Business units are increasingly investing in or identifying ML techniques as areas
    for potential growth. These business units are looking to leverage data and discover
    patterns to drive efficiency and enable better-informed decision making. A successful
    machine learning project analyzes business objectives to reveal significant factors
    influencing outcomes for machine learning deliverables. This step is critical
    to ensure your machine learning projects produce the right answers, ones that
    directly address the business problem you originally set out to solve.


    You should collaborate closely with subject matter experts and end users to better
    understand how they perform their activities in the current environment. Interviews
    and consultation performed at this stage will help you to better understand the
    business problem that needs to be addressed, the goal to be met, any applicable
    constraints or dependencies, and the desired outcome.


    A project plan should then be developed that defines how machine learning will
    address business goals. It’s important for all stakeholders to agree on the criteria
    that specify how results should be measured and what constitutes success from
    a business perspective. Assumptions should be documented to help guide the subsequent
    model development process during the next phase. All steps should be defined,
    including project details about scope, duration, required resources, inputs, outputs,
    and dependencies.


    # Model Development


    Developing ML for business use requires incremental steps (outline in Figure 5-8).
    Because this development process involves scoping the problem, conducting experiments,
    reviewing results, and refining the approach, it’s difficult to depict in a straightforward
    fashion. While each of the five steps may occur at various times, their contribution
    to the overall process remains consistent.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Model development


    ![](img/53a28dd44bbae66341b0fe693bd59916_75_0.png)


    A united approach to model development enables reduced cycle time, increased automation,
    and consistent support for explainability, reproducibility, and the application
    of ethical artificial intelligence concepts


    Figure 5-8. Model development steps


    Once the project objectives are set and the business problem is understood, an
    exploratory analysis is necessary to identify and collect all relevant data and
    assess their ability to meet the intended business purpose. This process is designed
    to create a comprehensive view of the available data and use analytic techniques
    to explore important relationships in the data.


    Exploratory analysis also serves to identify deficiencies in the data that may
    prevent the model from meeting the intended business purpose. Data exploration
    analyzes the data we have available and also informs the type of data needed to
    develop a useful model.


    The data preparation stage transforms data to be used with ML algorithms. You’ll
    want to check for issues such as missing information, duplicate/invalid data,
    or imbalanced data.


    This stage also includes techniques to help prepare data, including: removing
    duplicate/invalid records from the dataset; addressing class imbalance (when the
    total number of a class of data [positive] is far less than the total number'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'of another class of data [negative]); enrichment using additional data sources;
    and selecting data features and executing feature engineering (to include combining
    multiple features for additional training benefits). This process is designed
    to help determine the required input variables when developing a predictive model.
    Your subject matter experts are invaluable during this phase of model development.


    *Model training* begins once data is prepared. In this step, training and validation
    data is used to compute the model parameters that optimize performance. Prior
    to initializing the model training process, it is necessary to define the model
    to be trained and its corresponding configurations. A general process for model
    training can typically be used across different algorithms.


    For most types of ML, the general training procedure begins by randomly initializing
    the model and its associated parameters. This model is then trained using data
    to fine-tune it, generating and comparing predictions for each entry in the training
    dataset. Using these predictions, the model training computes error and other
    performance metrics between model prediction and ground truth for each entry (e.g.,
    case, record, image). The computed error, often referred to as “loss,” is then
    used to adjust model parameters to optimize for desired metrics. The training
    script will continue to loop through the aforementioned steps until it achieves
    the desired performance or until the maximum number of training steps has been
    reached.


    The next step, *model versioning*, is crucial to ensure a workflow is explainable
    and can be replicated. In this step, models are versioned based on the data used
    for training, selected specifications (e.g., learning rate, batch size, number
    of epochs),⁶ and the resulting output. An identifier should be assigned to each
    model to provide context. Versioning enables your team to track model lineage
    and pedigree, which will improve results as your project progresses.


    Here are some items we recommend tracking during your development efforts: software
    used to train and run the model; development environment; model architecture;
    training data used; model parameters; and the artifacts'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'collected during training, such as reports and log files. This process should
    be standardized and conducted for each model training event with parameters stored
    in a common repository.


    The final step in development, *model validation*, is vetting a model’s training
    by using a validation dataset to determine if any additional performance adjustments
    are necessary. It’s important that this validation dataset not include any data
    used in the model training stage to ensure validation metrics are fully independent
    from the training procedure.


    In the validation stage, the model you’ve created is used to make predictions
    for every entry in the test dataset. Prediction error and other model performance
    metrics are calculated to ensure observed model performance meets user-defined
    requirements before deploying the model.


    # Model Vetting


    The next step in the ML life cycle is to vet your model, as shown in Figure 5-9.
    Vetting a trained ML model is a crucial, yet underappreciated, step in the path
    to operationalizing machine learning. Rigorous model vetting enables the local
    data science team to discover costly bugs and correct them while still in a low-risk
    environment. Once vetting is executed locally, it is then replicated in the production
    environment. Deploying properly working models will build organizational trust,
    not only in the deployed system but in AI projects as a whole.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '![](img/53a28dd44bbae66341b0fe693bd59916_78_0.png)


    Figure 5-9. Model vetting steps


    Trained models that meet initial performance requirements are *deployed for testing*
    to a production-like environment for a rigorous test and evaluation stage. This
    step involves conducting computational and performance testing to ensure the model
    meets requirements. For the sake of consistency, deploying a model to the test
    environment should parallel the steps taken to deploy a model to an actual production
    environment. Your development team should work closely with subject matter experts
    and functional users to ensure the test environment mirrors actual production.


    Similar to model development stages, it is important to *verify results*. This
    step ensures model performance is in line with expectations and has not suffered
    from performance degradation. *It’s important to note that, based on our experience,
    most preproduction model issues are discovered during this step.* As noted previously,
    it’s crucial that the data sent to the model during this stage be representative
    of the data the model will analyze while in a production environment.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'Part of the results verification process is exploring how the model handles
    malformed or otherwise improper data. The model should be able to handle improper
    data and ensure that important data is not lost, an appropriate error notification
    is sent to the software development team, and the model remains functional after
    encountering the error.


    *Result tracking* is critical to ensure your model is effectively reviewed and
    audited. The ability to store and review historical model output allows subject
    matter experts and functional users to conduct periodic reviews, ensuring the
    model is making acceptable and appropriate predictions.


    The final step, *staging for deployment*, prepares the model to be moved to the
    production environment. Once the model is deployed to the production environment,
    the model is considered “live” and will be available to all authorized end users
    and systems. Data scientists, software engineers, and all appropriate experts
    should be consulted to ensure the model is deployed in a manner that matches expectations
    in the production environment.


    # Model Operation


    The operationalizing ML workflow’s ultimate goal is the successful deployment
    and smooth operation of a well-functioning model. The ideal model provides end
    users with predictions when requested in a timely manner, performs automatic monitoring
    of model performance and usage, and notifies people of relevant model activity
    through reporting and alert mechanisms. In short, a successful deployment means
    that your ML application performs as expected and alerts you when your attention
    is needed. Model operations (shown in Figure 5-10) will allow you to meet these
    needs.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '![](img/53a28dd44bbae66341b0fe693bd59916_80_0.png)


    Figure 5-10. Model operation steps


    The first step in operationalizing a model is deploying the model to the production
    environment and verifying that the model has been successfully transferred and
    no issues exist with running the model in the intended environment. The deployment
    verification is typically done by closely monitoring the model immediately after
    deployment to ensure it’s receiving, analyzing, and returning appropriate data.
    This step also involves verifying input data formatting is correct and analyzing
    output for correctness to ensure that no model performance degradation has occurred.
    These tests are best performed on the production hosting environment by the software
    engineering team immediately after deployment.


    The operation step involves executing the model when required. During this step,
    the software engineering team must ensure all aspects of the deployed model are
    working as intended. Any system issues should be fixed based on their order of
    importance to ensure the model continues to operate as intended. This process
    typically requires using regularly scheduled automated tests of the system, validating
    model responsiveness, ensuring models are being retrained when necessary, and
    verifying that models are resilient against ingesting malformed or improper data.
    These events result in'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'system alerts to request human inspection when necessary and a support request
    system that allows end users to submit help tickets.


    Smooth operation of a deployed model requires robust *monitoring* capabilities.
    A deployed monitoring system should be able to track model input and output, capture
    any warning or error message produced by the software environment, compute anomalous
    model activity (e.g., drift detection analysis, adversarial AI attacks detection),
    and forward all relevant information to the system’s reporting and alerting interfaces.


    Effective monitoring of a deployed system requires several component systems to
    operate together seamlessly. This is best done by automating as much of the system
    as possible. Given the speed and scale at which many AI systems operate, it is
    insufficient to rely solely on human monitoring and analysis to capture all necessary
    details in a timely fashion. As such, automated monitoring tasks are required
    for desired monitoring activity and set to run as needed. All results of these
    automated monitoring tasks are reported and sent as an alert, when deemed necessary.


    *Reporting* allows for human inspection of the deployed model. The speed and scale
    at which many AI systems operate may make it impractical for a human to review
    model performance in real time. However, automated reporting at regular time intervals
    will enable users to verify the system is working as intended. It is also possible
    for these reports to be used by other automated systems to monitor the deployed
    model. These reports are examined using visually engaging formats such as a dashboard,
    spreadsheet, or document to provide user insights.


    *Alerting* modules are responsible for creating real-time notifications about
    the deployed system’s status. These notifications are meant to either signal people
    for immediate system review or to create micro-reports to be included in automated
    system logs. Events that require alert notifications are initially flagged by
    the model monitoring module. These flagged events are received by the alerting
    module, where the alerts are drafted based on prewritten notification templates.
    These notifications are then sent out via a messaging service to the recipient.
    Based on requirements, notifications can'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'be sent as text messages, emails, Slack messages, app push notifications, or
    automated phone calls.


    # Machine Learning Operations (MLOps)


    Early in the history of software development, innovations in tooling, automation,
    and process optimization were focused almost exclusively on efficient delivery
    of new functionality. DevOps, and later DevSecOps, established frameworks that
    introduced similar innovations to balance functionality against priorities like
    automation, reliability, distributed development, and security.


    As reviewed in this ML section, there are many steps to the design, training,
    testing, deployment, and monitoring of ML models. In many cases, these steps are
    executed manually. However, this greatly reduces the ability to scale the model
    development process. MLOps⁷ provides a potential solution to this problem through
    integration and automation to allow for increased efficiencies in the development
    and training of ML models.


    MLOps is similar to DevSecOps, with some unique differences (e.g., use of production
    data for model training, rapid iterations of models, accounting for bias, need
    for continuous monitoring) that you must consider. Organizations today are primarily
    prioritizing the development of AI models and not the process used to develop
    those models. Through the integration of these manual processes using the rapidly
    expanding open source and commercial solutions, MLOps will allow an organization
    to scale their AI development pipelines to meet future demand and operate at the
    enterprise level.


    # Scalable Training Infrastructure


    AI model training currently requires larger training datasets (e.g., streaming,
    IoT), an increasing number of modeling approaches (e.g., supervised, unsupervised,
    reinforcement learning), and more complex models (e.g., deep learning) composed
    of larger numbers of training parameters. With this growth, we see an increasing
    need for more robust and scalable training'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'infrastructures. This infrastructure requires additional automation to evaluate
    the range of required models while collecting training results for comparisons
    across model versions and approaches.


    MLOps combines more traditional DevSecOps techniques like continuous build systems,
    distributed processing, and “As a Service” (AaS) infrastructure with ML-specific
    approaches like model bias, model training, hardware acceleration (e.g., distributed
    processing, GPUs), model optimization infrastructure (see next paragraph), and
    model monitoring. Through this process, models are developed more quickly and
    follow standard processes with detailed documentation of the results.


    # Model Optimization Infrastructure


    In the early days of ML, models were typically trained individually and infrequently
    (weekly, monthly) due to hardware constraints and immature optimization techniques.


    Today, we have the operational requirements and the computational resources to
    train models more frequently (daily, hourly, continuously) and in large batches
    (10s to 100s) using scalable training infrastructures, modern optimization techniques,
    and scalable computing infrastructure. In addition, teams are increasingly deploying
    AI models to a range of edge-hosting environments. If models are to operate effectively
    in these edge environments, you must optimize them to operate on those lower capacity
    hardware configurations.


    MLOps can help developers by integrating with scalable training infrastructure
    and coordinating the accumulation, storage, and comparison of trained models.
    Additionally, centralized storage and analysis of models can provide valuable
    insights into model development over time, providing an approach to evaluate model
    and data drift. This standard process also supports optimization of trained models
    based on the target hosting environment to ensure models can effectively operate
    in production. In the longer term, these model optimization repositories may also
    play an'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'important role in explainability considerations, given the metadata collected
    as part of this process.


    # Model Deployment Infrastructure


    For many AI teams, deploying a completed model to operational infrastructure for
    use by its intended end user can represent a significant technical and process
    challenge. This is because AI teams often lack the in-depth software development,
    system administration, and network engineering knowledge to deploy such systems.


    AI development teams can benefit from defining standardized, automated deployment
    workflows for their ML models using standard automated deployment applications
    (e.g., Jenkins, Ansible). These pipelines can be developed with direct contributions
    from subject matter experts in software development and system administrators
    as part of the integrated AI development team. This approach ensures that deployments
    meet organizational requirements and minimize the burden placed on the AI development
    team while decreasing time to execute initial and retraining deployments.


    O’Reilly has additional resources you can explore to learn more about MLOps, including
    Introducing MLOps and Practical MLOps.


    Operationalizing ML capabilities within your organization requires practitioners
    with very specific skill sets. Table 5-1 lists some of these roles alongside elements
    to keep in mind as you staff your AI team.'
  merge: -1

    # Workforce Development


    Critical workforce roles span organizational and project team levels. For example,
    executives are accountable for setting an organization’s vision, goals, and fundamental
    values. They hold ultimate responsibility for navigating complex business questions
    surrounding possible ethical impacts when introducing AI into their organizations.


    Whether made up of executives or frontline employees, a responsible AI development
    team’s composition will vary from project to project based upon specific needs.
    Nevertheless, there are common functions critical to any project’s success. AI-specific
    technical talent may be foremost in your mind, but other considerations are equally
    important.


    Responsibly developing AI requires a well-integrated, cross-functional team. End
    users, subject matter experts, technical staff, and other functional staff need
    to work collaboratively throughout the product development life cycle. Non-AI-specific
    staff should have a baseline technical understanding so they can successfully
    communicate their insights to the technical team. Similarly, AI staff should consider
    ethics an ever-present responsibility and have full understanding of and appreciation
    for intended use and desired outcomes.


    End users and subject matter experts provide organizational and use-case-specific
    context. By providing input from the beginning through the full'

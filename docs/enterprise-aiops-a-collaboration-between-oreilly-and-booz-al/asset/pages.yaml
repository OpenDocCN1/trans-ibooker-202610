    # AI Risks and Complexities


    AI risks and complexities apply during every phase of the AIOps life cycle. For
    example, there are systems that are more human centric (e.g., credit card score)
    versus ones that are machine centric (e.g., valve monitoring of a factory machine).


    One significant risk is a failure to meet ethical standards. This failure can
    lead to AI potentially harming people, property, or the environment. Oftentimes,
    it is difficult or impossible for organizations to predict the long-term consequences
    and impacts of a new technology on society. For example, pollution was not an
    early concern tied to widespread automobile use. This type of blind spot applies
    to AI solutions as well.


    A major subset of ethical risk is training data containing unidentified bias.
    This bias can lead to models that produce inaccurate results. This may occur when
    teams fail to incorporate diverse input from a range of technical and nontechnical
    stakeholders during model development and training, resulting in a system with
    embedded, unconscious bias. A common reason for use of biased datasets is a development
    team using datasets simply because they are available without consideration of
    whether the dataset reflects the real world. An example of unconscious bias in
    production is when banking financial algorithms approve fewer and smaller loans
    to women than to men with equivalent credit scores and income simply because that
    pattern existed'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'in historical data. Historical trends uncovered that women would need to earn
    30% more than men to be approved for equivalent sized loans.⁴


    In addition, there are unique risks and complexities that are introduced through
    the use of AI for autonomous, disconnected systems. These systems take many forms
    that include aerial, ground, and manufacturing. When these systems are operating
    autonomously, the operator may not be able to intervene to override the algorithms.
    Therefore, this must be taken into account in the AI model design and testing
    process to reduce these risks.


    Creating a feedback loop is critical because model outputs begin to affect the
    conditions within which the model operates. Original conditions that existed when
    training the model no longer exist due to the model’s own influence within the
    environment. AI solutions are highly sensitive to data inputs and may produce
    inaccurate results without highlighting an error if the data types or assumptions
    change unexpectedly.


    In real-world settings, AI solutions are vulnerable to security attack, data spillage,
    or a loss of privacy, the same as with other computer-based technologies. Attacks
    can come from internal or external sources. In many cases, they can even be avoidable—for
    example, improper access credentials in development and production environments.
    Continuous, sophisticated, adversarial attacks can occur on all components of
    the technology stack, associated datasets, and enabling infrastructure.


    # Technology Stack


    A set of technologies—such as software products and programming languages—an organization
    uses to build applications.


    A lack of governance strategies and processes for AI-based operations can lead
    to vulnerable systems. Additionally, due to data aggregation and broader use,
    there is an increased risk that sensitive data spillage can occur, inadvertently
    granting access to unauthorized users. However, when crafting governance processes,
    use caution. Overly bureaucratic governance'

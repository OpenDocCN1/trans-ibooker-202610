- pgno: 61
  md: 'Understanding these techniques also enables us to consider a model’s ability
    to generalize (i.e., ability to apply each model to sets of unfamiliar data) when
    putting models into a production environment, and to better monitor and improve
    our overall design choices.


    *Supervised learning* is perhaps the most often discussed example of ML. With
    this technique, algorithms are used to analyze numeric or labelled data (e.g.,
    input-output pairs, tagged images, or other closely associated information). Common
    applications include regression models used for predicting continuous numeric
    values (e.g., stock prices) and classification models used for predicting categorical
    (e.g., file is/not malicious) class labels from operational data features.


    Supervised ML breaks data into input (called “features”) and outputs (known as
    “labels” for classification and “targets” for regression) and attempts to predict
    the latter from the former. Supervised learning’s key benefit is that it enables
    us to focus the analytic model on a specific task for high accuracy, precision,
    and recall.² This makes supervised learning the most practical technique for most
    operational use cases.'

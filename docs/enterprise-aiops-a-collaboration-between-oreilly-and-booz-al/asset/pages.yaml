    # Neural network


    A series of algorithms that attempt to identify underlying relationships in a
    set of data by using a process that mimics the way the human brain operates.


    # Deep learning


    A specialized collection of machine learning approaches leveraging neural networks
    to enable AI capabilities such as computer vision and natural language processing.


    In this section, we introduce the concept of an ML model and distinct ML frameworks
    to address specific data structures and analytic objectives. This section isn’t
    intended to be a functional “how-to” for ML, but a solid working knowledge will
    help you better lead AI adoption within your organization.


    # What Is an ML Model?


    Business analytics, often referred to as simply “analytics,” are business rules
    encoded into software by an analyst or developer that subsequently converts data
    into useful insights to inform decision making. By comparison, ML models use learning
    algorithms to generate business rules using prepared training data.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Training data


    An initial, usually large, dataset used to teach a ML model to be predictive or
    to learn a desired task. This may include inputs (raw data) and outputs (labels)
    or unlabeled data.


    For supervised and reinforcement learning techniques, these learned rules are
    encoded in a special file known as a model. Because they are designed to be written
    and interpreted by machines, these models are much harder to read (explain) than
    business analytics.


    Unlike conventional analytics, the act of feeding user data into the analytic
    and producing insights is known as inference. Updating ML analytics is accomplished
    with some combination of the original training data, new/updated data, and the
    trained model.


    Traditionally, organizations treat ML models as black boxes where only their inputs
    and outputs required explanation. For all the reasons described in Chapter 3,
    mature organizations are abandoning this black box approach in favor of explainable
    outcomes.¹ From a leadership standpoint, this shift toward explainability will
    continue to change how results are documented in the short term and overall design
    processes in the long term.


    ML models are also unique in that similar models and data can produce radically
    different results. Identical source code is compiled into identical applications,
    but identical training data produces a variety of models, depending on training
    parameters. Since it is difficult to predict the best configuration in advance,
    it is often best practice to train with many different configurations and then
    compare performance for each of the results during training.


    This is especially true for more sophisticated ML approaches, such as neural networks,
    and accounts for part of these techniques’ reputation for large computational
    and data storage overhead. Additionally, even the smallest changes to training
    data can produce meaningful changes to the end result.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'These trends result in the potential for hundreds or even thousands of individual
    ML model versions. Only a small number will be operational, but many (or all,
    depending on your goals) are worth preserving to provide additional insight into
    the training process. You should choose how much data and the number of models
    you’d like to retain based on how explainable the analysis must be and how tightly
    you can control the operational and training data inputs.


    As with any other form of software, it is important for ML models to be documented,
    tested, and version-controlled to help the team maintain knowledge of its structure
    and functionality. Unlike conventional analytics, it’s not possible to break up,
    document, or independently test a model’s internal structure. Instead, we must
    rely on surrounding documentation, testing, and metadata. While not entirely unique
    to ML analytics, metadata plays a much larger role in describing a model’s behavior
    than it does with normal (or classic) software. MLOps (discussed in “Machine Learning
    Operations (MLOps)”) can help with this documentation, testing, and version control.


    DataOps provides the data pipelines to develop and train ML models. Then, MLOps
    provides an integrated and automated process with a documented CI/CD process to
    integrate these models into larger software applications that leverage said models
    using DevSecOps. This approach ensures resulting software applications that utilize
    integrated models are secure and that data scientists or software engineers can
    rapidly update the software and models as required. These combined frameworks
    allow data science practitioners to continuously refine models and their overall
    approach to analytics.


    # ML Methodologies


    Much like selecting the right tool for a given job, it’s important to understand
    the algorithms supporting our analytic efforts. Particularly in the case of ML,
    we use these underlying processes to characterize and define each unique ML approach.
    By understanding these techniques, we can address any assumptions and identify
    appropriate performance evaluation metrics.'
  merge: -1

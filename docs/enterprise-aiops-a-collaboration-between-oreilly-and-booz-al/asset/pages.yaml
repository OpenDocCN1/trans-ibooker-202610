    Figure 5-2. Supervised ML process


    With supervised learning, labeled input data is fed into the algorithm to train
    the model, where it refines the algorithm’s “weighting” by testing against specified
    criteria. The process used to refine a model is rooted in statistical cross-validation,
    where data is divided into two random subsets—one to train the model, the other
    to test its performance. Although the specifics get incredibly technical very
    quickly, the bottom line is this: once sufficiently trained, we can refine and
    improve deployed models by reengineering training data features and retraining
    the model as necessary while monitoring its behavior throughout the ML life cycle.


    A second ML technique, unsupervised learning, trains a model directly from patterns
    present in data rather than the input-output approach found in other types of
    ML. The key advantage with unsupervised algorithms is its capacity for finding
    patterns not known to the developer beforehand, presenting new avenues of exploration.
    This approach’s downside is that these algorithms generally find a high volume
    of patterns in production data, with no focused'

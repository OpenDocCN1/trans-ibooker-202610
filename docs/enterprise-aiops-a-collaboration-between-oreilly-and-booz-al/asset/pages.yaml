- pgno: 97
  md: 'In each of our previous AI Adoption Blueprint themes, we discussed success
    criteria relevant to each component of AIOps. When establishing the metrics that
    you will begin measuring to track success of your new AI capability, we recommend
    tying these metrics back to the important lessons we’ve covered throughout this
    report. Here are our recommendations for the metrics you should track organized
    by their alignment to the AI Adoption Blueprint (and corresponding chapter):


    # Metrics Related to Responsible AI (Chapter 3)


    +   1. **Acceptable Performance:** actual accuracy of model versus required accuracy
    (some models may have a higher acceptable margin of error, for example)

    +   2. **Bias:** watch for any bias that may have been introduced in the model
    training process¹

    +   3. **Necessary approvals:** ensure your team has received any approvals that
    might be needed for certain datasets

    +   4. **Repeatability:** ability to recreate the results of model training or
    inference based on data collected throughout the AIOps process

    +   5. **Resilience:** susceptibility of the model to compromise through adversarial
    influence


    # Metrics Related to Data Engineering (Chapter 4)


    +   1. **Data readiness:** indicators to track readiness of a dataset as input
    to AI models

    +   2. **Data quality and data drift:** qualitative and quantitative metrics to
    measure data quality and potential early indicators of change in data profile
    driving drift

    +   3. **Data security and privacy:** qualitative and quantitative metrics that
    can be used as indicators of data security and privacy'
  merge: -1
  img_proc: true
- pgno: 98
  md: '+   4. **Data transparency:**² metadata and metrics can help improve model
    explainability


    # Metrics Related to ML Models (Chapter 5)


    +   1. **Accuracy, precision, recall:** quantitative performance of model decisions


    +   2. **Throughput:** increase in throughput of data processed by model compared
    to baseline


    +   3. **Speed of decision:** time it takes model to provide answer in many cases
    compared to baseline process timeline for decision making


    +   4. **Capacity:** ability of model inference to meet number of user requests
    and delay in providing those requests


    +   5. **Usage:** given the target user base, what percentage are using the solution
    and how that changes over time


    Ideally, you want your AIOps capability to enable the success at an enterprise-wide
    scale. Therefore, if your AIOps framework is successful, you will begin to see
    improvements to these metrics throughout a project’s life cycle. As a reminder,
    this will remain an iterative process, using feedback from these criteria and
    stakeholder engagement to track and guide the development of your AI capability
    and continued advancement of the sophistication of AIOps implementations.


    # Reference Architectures


    Throughout this report, we introduced building blocks to help your teams repeatedly
    create the necessary infrastructure and subsequently deploy scalable AI solutions.
    Combined, these building blocks result in a *reference architecture*, a framework
    to visualize interrelated capabilities and components required to operationalize
    and deliver AI. Reference architectures are also a central component needed to
    inform the required technical infrastructure and related development processes
    (i.e.,'
  merge: -1

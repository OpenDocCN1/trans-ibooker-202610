- pgno: 40
  md: 'Figure 3-1. Risk management process


    Identifying risk involves assessing AI system performance, data integrity, model
    transparency, solution security, and any real-world constraints imposed on the
    use case. You should always actively look out for bias in the data, whether or
    not the AI system is appropriately using the models and data, whether or not hacking
    and security are a concern for the specific AI solution, and whether or not your
    proposed solution is feasible and tractable given the available resources.


    Once risks are identified, it’s time to quantify the impact. Quantifying impact
    is the process of identifying and assigning a value to the likelihood, impact,
    and tolerance of each risk based on (1) the validity of the model or system output,
    (2) user adoption and acceptance, and (3) organization security and reputation.
    When quantifying impact, you should examine potential magnitude and scale.


    The next step is to develop a monitoring and mitigation plan. There are many considerations
    for such a plan, but primary among them is an approach for periodically reevaluating
    identified risks. Data monitoring includes the need to track historical trends
    in data to identify significant deviations from those trends. These deviations
    may indicate underlying changes in processes and thus may result in reduced model
    accuracy, indicating a need to retrain the model.


    Once the monitoring plans are in place, it’s important to understand what to do
    if there is a discrepancy. Escalation is a key step in any risk management plan—calculating
    the expected impacts of any risk not fully addressed or mitigated.


    If a risk meets preestablished criteria for escalation, teams must then notify
    key stakeholders so they can consider and take action. You can then engage expert
    AI reach-back support as necessary to address identified issues. Once the risk
    mitigation occurs, the AI solution is revalidated and redeployed. At this point,
    you would also update the list of identified risks and monitoring/mitigation plans
    as necessary.'
  merge: -1
  img_proc: true

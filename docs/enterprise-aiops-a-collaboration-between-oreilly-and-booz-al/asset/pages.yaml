  md: '![](img/53a28dd44bbae66341b0fe693bd59916_68_0.png)


    Figure 5-5. Neural network example


    Developing a neural network’s structure is a difficult and expensive design process.
    To minimize this expense in time and effort, organizations often tailor existing
    neural networks for a specific application by starting with the structural information
    and regenerating weighting information from different training data. This process,
    called transfer learning, is the most approachable way for many organizations
    to use pretrained neural networks and leverage the extensive training previously
    executed for similar applications.


    As previously mentioned, models are updated in one of several ways, depending
    on the learning technique. In some use cases, it is not desirable to reload all
    of the training data that were initially used to create a model to update a model.
    In this situation, an online learning technique can be used to allow training
    data to be incrementally added to the model without having to retrain from scratch.


    An even more extreme version of this is distributed/federated learning. Recent
    developments in so-called “edge” technologies, such as widely used'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'mobile phones and other IoT devices, enable ML development using distributed—or
    remote—architectures.


    Distributed learning with edge devices occurs in parallel: training occurs in
    multiple online locations at the same time, before merging results to combine
    their overall knowledge. Distributed learning’s key advantage is the ability to
    enable the model to be configured for inference and training on low-powered edge
    devices while combining significant amounts of information globally in a single
    model. The disadvantage of edge learning is that the learning process is increasingly
    dynamic, complex, and difficult to curate. This environment can create complex
    scenarios that are extremely difficult to predict, detect, and correct in real
    time to combine that distributed learning into a valid global model.


    Examining the architecture outlined in Figure 5-6, distributed learning’s first
    step involves pushing a pretrained “pseudo model” to edge devices from a central
    hub. Once on the edge device, this initial model is refined by available data
    at the edge, performing inference and training updates on the local device. After
    these edge-based models are sufficiently trained and updated, we aggregate them
    at a central hub, versioning the models for eventual redeployment to edge devices.
    The central hub orchestrates these iterative improvements by using an MLOps approach
    to monitor model performance.'
  merge: -1

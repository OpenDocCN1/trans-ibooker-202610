- pgno: 62
  md: '# Accuracy


    The ability for ML models to produce exact versus approximate results. It measures
    how close your model came to correctly predicting all true positives and true
    negatives.


    # Precision


    A measure of confidence for your ML model. Precision is calculated by dividing
    the total number of true positives by (true positives + false positives). In other
    words, for all of the data that your model predicted to be a “positive,” what
    proportion of these were actually positives?


    # Recall


    A measure of classification performance for your ML model. Recall (also known
    as sensitivity or “true positive rate”) is calculated by dividing the total number
    of true positives by (true positives + false negatives). In other words, for all
    observations that are actually positive, what proportion of observations did your
    model correctly predict to be “positive”?


    Supervised learning’s operational success has resulted in additional research
    and development into explainability and sustainability, currently far in advance
    of other ML techniques. The key distinction between supervised learning and other
    ML approaches centers on the optimization of the model through the process of
    training its weights (i.e., learned parameters), as depicted in Figure 5-2.'
  merge: -1
  img_proc: true

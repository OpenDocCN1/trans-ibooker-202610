- pgno: 42
  md: '# Chapter 4. Data: Your Most Precious Asset


    When it comes to your organization’s data, you can’t manage what you don’t see,
    and you certainly can’t protect what you aren’t tracking.


    AI relies on large volumes of historical data and advanced ML methods to generate
    insights. Data is the starting point for AI development. It’s critical you establish
    data management as a fundamental competency, ensuring your teams have the tools
    needed to properly handle and curate data.


    The amount of data available today is exploding as organizations continue to accumulate
    information at an exponential rate. This growth complicates our ability to understand
    what data exists, where it exists, who can use it, and how it can be used to generate
    better outcomes.


    It’s critical that your organization find and develop the technologies, implement
    appropriate policies, and help train employees to adapt to the changing data-centric
    environment.


    # Data’s Role in AIOps


    An AI project’s success depends on data readiness (e.g., is the data cleansed
    in a standard format? is incomplete data removed/filled? etc.) both for training
    AI models and operationalizing AI capabilities. Data readiness for AI can be measured
    through the key drivers of availability, accessibility,¹ timeliness, accuracy,²
    usability,³ form, quality,⁴ provenance,⁵ and security.⁶'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Accuracy


    The degree to which data correctly describes the “real world” object or event
    being described.


    # Usability


    A measure of how reliable the data is. Data that is messy, is missing substantial
    records, is difficult to ingest, or is otherwise prohibitive would be less usable.


    # Provenance


    Provenance of a resource is a record that describes entities and processes involved
    in producing and delivering or otherwise influencing that resource. Provenance
    provides a critical foundation for assessing authenticity, enabling trust, and
    allowing reproducibility. Provenance assertions are a form of contextual metadata
    and can themselves become important records with their own provenance.


    # Security


    How safe the data is from loss or unwanted manipulation.


    Managing data as an asset can help your organization address these challenges
    and support AI needs through a multilayered approach to data readiness. A holistic
    approach will help drive data readiness across all dimensions of data as follows:


    +   - A data strategy aligns data capabilities with AI needs and establishes effective
    data management and data usage practices tailored to AI needs.

    +   - DataOps processes optimize workflows for automated data ingest, processing,
    and storage to help keep up with data needs at scale.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '+   - Standardized methods enable data ingest, transformation, validation,
    and preparation.

    +   - Data governance expedites value and spans compliance, risk, and regulation
    related to data (including privacy, security, and access controls).

    +   - Responsible data policies specify access rights, “right to see” authorizations,
    ethical principles, and acceptable applications for data usage across the organization.


    # Data Strategy


    Moving from piloting to operationalizing AI requires a strategy to help align
    data capabilities with AI needs. This is your first step to achieving a scalable
    and repeatable AI model development process and operationalizing AI.


    A data strategy is essential to realizing AI goals and scaling value creation
    through the following areas of focus:


    +   - Identifying AI data needs and gaps to include the practical or legal constraints
    to usage of data

    +   - Identifying ways to acquire/collect data to fill gaps and identify nontraditional
    data sources for added insights and integrating this data into existing data environments

    +   - Creating a centralized vision to align data capabilities with needs of AI
    projects

    +   - Aligning data management, transformation, quality, and governance functions
    toward building up and scaling AI capabilities

    +   - Enabling a consistent view of data-related capabilities so they can evolve
    with AI needs

    +   - Defining concrete actions, trade-offs, and metrics to help assess and prepare
    data capabilities'
  merge: -1
  img_proc: true
- pgno: 45
  md: '+   - Tracking data lineage, provenance, and quality to aid AI transparency
    and explainability


    Your data strategy needs to answer the following questions in the AI context:


    +   - What challenges might AI solve for your organization where traditional analytics
    has fallen short?

    +   - How will the strategy put the organization on a path to realizing the goals?

    +   - What concrete steps can help implement the strategy?

    +   - What actual impacts can be tied to the strategy?

    +   - How will aligning resources with the strategy support the mission and scale
    value creation?


    While the path data takes between phases will differ for every organization, the

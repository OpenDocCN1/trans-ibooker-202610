- pgno: 104
  md: 'Figure 6-4. AIOps components


    As outlined in Figure 6-4, DataOps, MLOps, and DevSecOps comprise the AIOps core
    operational components that should be customized for your organization’s particular
    use case. Considered AIOps collectively, the integration of these approaches focuses
    on translating organizational requirements into data and analytic processes through
    a combination of:


    +   - Developing integrated automation pipelines that span from data ingest and
    process through model training to subsequent AI model deployment

    +   - Updating AI models integrated into systems and business processes as needed
    to ensure they remain up to date and relevant, not static

    +   - Continuously integrating and deploying processes across data, model, and
    development structures with feedback loops incorporated to drive process improvement

    +   - Metadata collection process across all phases supporting model explainability


    When considering our approach to incorporating these operational frameworks, we
    should reiterate the alignment of DataOps, MLOps, and DevSecOps in the wider AIOps
    framework. We will use these working definitions when describing the integration
    of components in the next section. A holistic approach to AIOps integration contains
    the following processes:


    +   1. Leverage an iterative DataOps process to create data pipelines, democratize
    access, and monitor and automate processes to meet strategic data requirements
    to enable an AI capability.

    +   2. Incorporate MLOps to adjust model implementations to better determine the
    approach best suited for given operational requirements; MLOps focuses on automated
    training, deployment, monitoring, and management of ML models.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '+   3. Implement *DevSecOps* to orchestrate broader software application development
    that supports rapid integration of ML models and deployment to target hosting
    environments. As discussed earlier, DevSecOps adds a critical security element
    to established DevOps processes and practices.


    From the enterprise perspective, AIOps components exist as part of the larger
    ecosystem of mission-critical systems that support organizational goals. Given
    the complexity and rapidly evolving nature of mission-critical systems, it’s important
    to adhere to best practices for integrating AI capabilities tailored to specific
    organizational requirements. As with other mission-critical systems, AI systems
    need to be secured through a comprehensive enterprise security approach where
    all security best practices apply.


    Overall, the approach allows for integrated and iterative development of solutions
    using a standard process that is scalable and repeatable across AI solution requirements.
    This is done while having full visibility across the process, thanks to the help
    of metadata, which is collected within a centralized data platform. In the following
    section, we will apply the AI Adoption Blueprint to address the integration of
    these essential components of the AIOps framework.


    # Component Integration


    Designing and developing an enterprise AI capability requires development in the
    individual AIOps components plus upstream and downstream coordination to enable
    these components to support each other synergistically. As described in detail
    throughout this report and the AI Adoption Blueprint, we consider several interconnected
    elements when on the road to holistic AIOps integration: responsible AI to guide
    the workforce on this journey, data engineering to fuel analytic processes; analytic
    frameworks to derive value and insight from data; meeting technical requirements
    and sustained deployment through digital architecture.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'Recall that the AI Adoption Blueprint defined AIOps integration as the responsible
    integration of DataOps, DevSecOps, and MLOps to design, develop, and sustain an
    AI capability. Pipeline integration between the AIOps components is crucial to
    operationalizing and sustaining your enterprise AI system. Both DevSecOps and
    DataOps are complex disciplines that exist independently of AIOps but require
    unique consideration when they are applied to AI model development. When implementing
    MLOps, many organizations focus solely on model development and do not invest
    the time required to mature other processes around ML model development, a path
    that often leads to AI systems producing suboptimal results and failing to address
    business needs.


    There are a few considerations you should keep in mind when designing the operational
    pipelines necessary to integrate components of the enterprise AI system. In Table
    6-2, we outline these interrelated considerations for AIOps by mapping linkages
    between elements from the AI Adoption Blueprint and questions to examine their
    interdependencies.'

  md: 'Figure 5-6. Distributed learning example


    # ML Advanced Topics


    Having discussed conventional ML modeling approaches and their considerations,
    we should pause a moment to examine emerging frontiers. These specialized applications
    leverage complex algorithms that combine and further abstract ML approaches. Each
    of the following approaches enables more mature AI capability. However, as with
    all techniques, we recommend you choose cautiously when considering the wider
    implications of interpretability and explainability. Due to the complex architecture
    within these techniques, we are generally unable to “open the black box” of these
    models, often forcing us to verify their reliability in development and production
    environments.³


    One of the most impactful developments in ML over the last several decades is
    deep learning, a collection of methods leveraging multilayered “deep” neural networks
    to perform highly specialized tasks. Use cases include image classification, machine
    translation, and speech recognition. In practice, deep learning takes advantage
    of multiple ML methodologies (e.g., applying unsupervised approaches to transform
    data as the input for neural networks) to engineer features and improve model
    performance. These complex models enable AI by leveraging large quantities of
    data to train and refine parameters of deep neural networks, whose specific architecture
    enables performance able to exceed human capabilities. As with any ML approach,
    the underlying structure of the algorithm dictates the functional benefit of its
    specialized task, underscoring the need to consider responsible implementation,
    resource requirements, and interpretability of complex deep learning models.


    Natural language processing is a broad field containing both manual approaches
    and AI applications to analyze natural language data. Enabling machines to parse
    textual data is a critical component of natural language processing, without which
    we could not ingest data necessary to train the model. Traditionally, challenges
    are rooted in the subjectivity of human'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'language and difficulty achieving semantic generalization, particularly when
    working with jargon or translating between structurally dissimilar languages.⁴


    Fortunately, recent research⁵ provides novel approaches to encapsulating language,
    necessitating more robust benchmarking metrics as performance improves. Current
    natural language processing applications span document classification, sentiment
    analysis, topic modeling, neural machine translation, speech recognition, and
    more. As this field continues to mature, you can anticipate increasingly novel
    applications to promote automated language understanding.


    # ML Life Cycle


    Operationalizing ML consists of four primary phases: business analysis, model
    development, model vetting, and model operation (e.g., monitoring your model in
    production). Executing these components with common approaches, practices, and
    understanding allows an organization to scale ML applications while reducing time-to-market
    business value of AI systems. To achieve this common understanding, it helps to
    decompose each component into its respective activities and discuss the methodologies,
    approaches, and opportunities presented by each, as illustrated in Figure 5-7.'

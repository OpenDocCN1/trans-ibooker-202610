- pgno: 99
  md: 'implementing DevSecOps³ on the technical infrastructure as a component of the
    wider AIOps framework).


    # DevSecOps


    Based on DevOps (a set of processes and techniques devoted to increasing the efficiency
    of communication and coordination between developers and operations staff), DevSecOps
    expands this relationship further to include security and the need to make systems
    robust against intentional meddling by a motivated adversary.


    Every organization’s implementation of the reference architecture will be different,
    but the fundamental components remain the same (Figure 6-3). A reference architecture
    serves as the gold standard for your teams to quickly deploy their own AI models
    and applications. By establishing a reference architecture, your organization
    can then produce real-world solutions (solution baselines) from an abstract framework.
    These solution baselines correspond to your organization’s specific use cases
    and result in a common framework of reusable components that comply with a common
    architecture that results in increased efficiency and scalability of your enterprise
    AI capability.'

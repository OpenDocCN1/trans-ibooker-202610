- '# 第 3 章. 负责任的 AI


  如第 1 章所述，在生产中维持 AI 需要与各种关键利益相关者（例如终端用户、风险经理）协调，以确保其对他们的利益负责。


  此外，可持续的 AI 开发应寻求自动化这种协调，以减轻开发人员的负担，并确保利益相关者和开发人员共同承担责任。


  随着您将 AI 运营化以在企业规模上解决问题，建立负责任的系统变得越来越重要。如果不这样做，可能会导致您的组织出现意想不到的风险、影响和后果。


  今天的负责任 AI 讨论突出了那些往往让公司登上报纸头版的问题。但这些广泛的讨论未能提供解决潜在责任挑战的具体建议。增加挑战的是，负责任 AI 的衡量没有容易定义的指标。为了建立这一基础，开发人员、经理和高级领导者都应了解他们在这个过程中的独特角色和贡献。


  简而言之，负责任 AI 的问责属于组织中的*每个人*。这正通过更多指导的出台而进一步得到证明，包括美国国防部副部长最近发布的“Implementing Responsible
  Artificial Intelligence in the Department of Defense。”¹ 该备忘录包括实施和评估国防部负责任 AI 生态系统的条款，以提供领导、治理和监督。此外，私营部门也在讨论许多非国防部法规。快速的网络搜索²将揭示许多新的负责任
  AI 实践。






  ## 什么是负责任的 AI？


  负责任的 AI 涉及的不仅仅是“偏见”、“公平”以及其他现代流行语。这些概念很重要，但它们仅仅代表 AI 系统的特征。这些特征本身既不是好也不是坏。因此，评估一个
  AI 系统是否负责任需要情境上下文。谁将使用该系统以及他们将如何使用它？该系统可能如何影响其部署的环境？模型是否使用适当的涵盖预期运行环境的完整数据集进行训练？


  从设计阶段开始一直到实施和监控，都需要从一开始就思考负责任的 AI。这不是一劳永逸的，而是一个核心方面，需要始终置于最前沿，关注构成负责任 AI 的要素——采用、伦理和劳动力。简单来说，负责任的
  AI 是 AI 采用、AI 伦理以及为 AI 项目需求进行劳动力发展的结合。


  负责任的 AI 在考虑人工智能系统如何影响人们时才变得有意义。“谁”的问题至关重要。换句话说，负责任的 AI 需要一个焦点——无论是个体、一群人或某类人，还是整个社会。但负责任的
  AI 也需要一个权威来源或道德指南针。那可以是组织的共同价值观和原则，也可以是社会的规范和文化实践。只有这样，我们才能解决例如什么是“公平”的 AI 系统、为谁以及为什么我们首先认为其影响是公平的问题。这些价值观需要嵌入到治理结构中，并配备适当的控制和措施来验证执行情况。此治理结构，包括控制和指标，应在组织层面达成一致，而不是按项目进行。


  创建负责任的 AI 需要特定的工具和支持性的治理流程，以有意义地平衡收益与风险的权衡。这些是使负责任的 AI 原则和价值观付诸实践所需的基础要素。实施是关键，在开始这段旅程时，有几个需要考虑的问题：


  - 你需要保持警惕，注意对关键用户/利益相关者可能产生的偏见或伤害。表达这种可能性有助于识别算法开发、部署、实施、再利用和输出方面的问题。开发阶段应提供质疑结果并解决任何阶段发现的偏见的机会。

  - AI 系统、创建者、所有者和风险管理人员应对 AI 的不良后果负责。此外，重要的是适当分配责任，避免将复杂系统错误归咎于最近的人类操作员这一常见陷阱。影响终端利益相关者的算法决策应具有可解释性，并且以与项目可接受风险水平一致的方式被理解；某些用例比其他用例需要更多的可解释性和理解。应保留记录和元数据，以确保结果可以调整，并且未来利益相关者能够知晓如果发生不良后果或行为。

  - 用于训练模型或系统的所有数据，以及该数据的来源和血缘关系，应以描述性形式保持可用，并随着变化/使用情况不断更新。这将使他人能够探索涉及数据收集过程的潜在偏见，这是帮助识别和分类模型最初预期用途的关键步骤。

  - 开发人员应采用与预期用例/结果相关的严格验证和测试方法，并在结果旁边进行记录。例行测试应探测部署 AI 解决方案后可能出现的任何不良后果。开发人员应确保可追溯性和问责制被
  AI 系统捕获并存储，以便让相关方对不良后果负责。


  成功的采用意味着在流程早期优先考虑负责任的使用。随着算法的不断普及，我们更有可能看到非常现实的伦理挑战。负责开发企业 AI 系统的团队可能不得不放弃那些无法达到负责任使用标准的机器学习用例和技术。生命往往处于危险之中，尤其是在这些算法用于防御关键基础设施或公用事业免受网络攻击时，因此我们必须确保我们的解决方案实施了适当解决出现伦理挑战的技术。


  优先考虑公平的结果、当出现问题时明确的问责制，以及对 AI 系统本身如何构建以及如何运行的透明度，将确保这些工具的使用方式与组织价值观一致。此外，这些优先事项将有助于在问题出现之前主动减轻伦理风险。第三个好处是为数据、算法开发以及
  AI 系统控制和措施提供更强的治理。


  ## 采用负责任的 AI


  第一步是为使用人工智能确定明确的目标。你希望 AI 为你的组织做什么？是否有少数几个 AI 可以解决的狭义定义用例？你的组织是否计划进行更广泛的 AI 驱动转型？


  像任何技术采用一样，拥有明确的目标——你希望 AI 为谁做什么——至关重要。此外，还有关键要素来支持长期采用：为特定使命和业务成果设计 AI、创建和实施 AI
  治理结构（例如组织 AI 风险矩阵框架）、定义支持 AI 所需的组织结构和角色，以及创建持续学习和参与的文化以建立理解和信任（例如工作组、领导顾问委员会等）。


  AI 采用最关键的方面是信任，而信任植根于控制。用户通常对将任何控制权让给算法感到犹豫。了解 AI 系统的工作原理——为什么它会产生其做出的决策或输出——并提供对结果的某种控制，是建立信任的关键要素，尤其是在早期采用阶段。


  这可以采取多种形式，从允许用户调整社交媒体新闻推送参数到授予用户对系统建议的最终决策权。事实上，AI 的一大优势是减少了对用户反馈采取行动所需的开销。我们可以利用这一优势，通过整合低开销的用户反馈机制来建立用户信任。最终，大多数用户可能不会行使可用的用户控制和自由（可用性启发式）；仅仅知道他们可以访问控制可能就足够了。³


  接下来是建立你组织的人工智能文化准备度。清晰传达组织的客观目标，同时为员工提供在对话中发声的机会。以开放和透明的方式解决疑虑，明确 AI 将如何影响他们以及组织将如何管理变革。在解决人工智能疑虑的同时，强化
  AI 作为帮助他们让生活更轻松的工具，有助于在人们相信其被负责任使用的信念下实现采用。


  组织还必须让关键决策者对 AI 感到真实和可理解。至关重要的是他们要了解 AI 的使用在何处是合适的，以实现业务目标和组织的更广泛使命。这使领导者能够挑选和优先考虑正确的项目，对最终结果有现实的期望，并更好地了解推动
  AI 在整个组织中采用所需的条件。


  成功的 AI 采用还需要合适的人才组合。然而，这并不意味着创建一个由数据科学家和计算机科学博士组成的单一团队。至关重要的是你的团队包括专注于 AI 概念参与和教育的角色。所有员工——包括每个领导层——都需要具备
  AI 知识。对劳动力的技能提升应成为核心战略组成部分。为了加速这一过程，确保关键岗位的新招聘人员具备这一 AI 基础是有帮助的。


  ## 伦理


  负责任地开发和采用 AI 需要整体管理——从指导原则一直到系统实施。精确地



  for this reason, we consider ethics to be a foundational element for responsible
  AI.


  There are five main considerations when integrating ethics:


  - 1. Ensure you understand how AI systems will impact your organization’s stakeholders
  in specific and tangible ways. This assessment should include routinely considering
  the political, economic, social, technological, legal, and environmental impacts
  across different stakeholders over time. This analysis should inform how you design
  and build models and select datasets to achieve desired results.

  - 2. Build meaningfully diverse and inclusive development teams. Include members
  with different backgrounds, skills, and thinking styles. Your team’s collective
  experience and insights will reduce unconscious bias, identify potential unintended
  consequences, and better reflect stakeholders’ wide-ranging values and concerns.

  - 3. Develop mechanisms for data provenance and audibility to verify your AI systems
  are operating as intended. If something goes wrong, data tracing and auditability
  mechanisms will help uncover data or concept drift or potentially expose upstream/downstream
  data issues. However, this will not necessarily capture issues in generalization;
  therefore, there may be a need for broader consideration of confounding/missing
  data and/or inappropriate method selections. Clear accountability mechanisms can
  help reduce ethical concerns, so it is critical to transparently account for the
  results. Your teams should understand that they are accountable for the actions,
  outputs, and impact of their models.

  - 4. Stay informed regarding AI technical developments. Because this field of study
  is changing rapidly, tools used to design and implement ethical systems have limited
  shelf lives. Your model’s sophistication will often outpace your ethical tools,
  increasing the probability something will go wrong and reducing your ability to
  fix it if it does. Maintaining awareness of AI technical developments and implementing
  controls and measures to monitor can help you mitigate risk and protect your organization
  from unintended consequences.

  - 5. Design your systems with specific applications and use cases in mind. Assessing
  the “fairness” of a model requires *context* and *specificity*. AI systems should
  be fair, but fair to *whom*? And in *what way*? Fairness is a laudable goal but
  becomes useful only when applied to a specific situation. Something that may be
  a fair outcome for someone in one situation could be deemed totally unfair in another
  situation.


  ## Workforce Development


  Critical workforce roles span organizational and project team levels. For example,
  executives are accountable for setting an organization’s vision, goals, and fundamental
  values. They hold ultimate responsibility for navigating complex business questions
  surrounding possible ethical impacts when introducing AI into their organizations.


  Whether made up of executives or frontline employees, a responsible AI development
  team’s composition will vary from project to project based upon specific needs.
  Nevertheless, there are common functions critical to any project’s success. AI-specific
  technical talent may be foremost in your mind, but other considerations are equally
  important.


  Responsibly developing AI requires a well-integrated, cross-functional team. End
  users, subject matter experts, technical staff, and other functional staff need
  to work collaboratively throughout the product development life cycle. Non-AI-specific
  staff should have a baseline technical understanding so they can successfully communicate
  their insights to the technical team. Similarly, AI staff should consider ethics
  an ever-present responsibility and have full understanding of and appreciation for
  intended use and desired outcomes.


  End users and subject matter experts provide organizational and use-case-specific
  context. By providing input from the beginning through the full development life
  cycle, these employees help ensure the AI project remains clearly tied to your organization’s
  mission and business needs. Additionally, by incorporating end user perspectives
  throughout planning and development, the AI model is more likely to meet user needs
  and, accordingly, more likely to be adopted. Finally, end users also play a fundamental
  role in providing key insights into human-machine teaming.


  Despite any specific roles assigned during a project’s life cycle, *everyone* bears
  responsibility when considering ethical outcomes throughout planning and development.


  ## AI Risks and Complexities


  AI risks and complexities apply during every phase of the AIOps life cycle. For
  example, there are systems that are more human centric (e.g., credit card score)
  versus ones that are machine centric (e.g., valve monitoring of a factory machine).


  One significant risk is a failure to meet ethical standards. This failure can lead
  to AI potentially harming people, property, or the environment. Oftentimes, it is
  difficult or impossible for organizations to predict the long-term consequences
  and impacts of a new technology on society. For example, pollution was not an early
  concern tied to widespread automobile use. This type of blind spot applies to AI
  solutions as well.


  A major subset of ethical risk is training data containing unidentified bias. This
  bias can lead to models that produce inaccurate results. This may occur when teams
  fail to incorporate diverse input from a range of technical and nontechnical stakeholders
  during model development and training, resulting in a system with embedded, unconscious
  bias. A common reason for use of biased datasets is a development team using datasets
  simply because they are available without consideration of whether the dataset reflects
  the real world. An example of unconscious bias in production is when banking financial
  algorithms approve fewer and smaller loans to women than to men with equivalent
  credit scores and income simply because that pattern existed in historical data.
  Historical trends uncovered that women would need to earn 30% more than men to be
  approved for equivalent sized loans.⁴


  In addition, there are unique risks and complexities that are introduced through
  the use of AI for autonomous, disconnected systems. These systems take many forms
  that include aerial, ground, and manufacturing. When these systems are operating
  autonomously, the operator may not be able to intervene to override the algorithms.
  Therefore, this must be taken into account in the AI model design and testing process
  to reduce these risks.


  Creating a feedback loop is critical because model outputs begin to affect the conditions
  within which the model operates. Original conditions that existed when training
  the model no longer exist due to the model’s own influence within the environment.
  AI solutions are highly sensitive to data inputs and may produce inaccurate results
  without highlighting an error if the data types or assumptions change unexpectedly.


  In real-world settings, AI solutions are vulnerable to security attack, data spillage,
  or a loss of privacy, the same as with other computer-based technologies. Attacks
  can come from internal or external sources. In many cases, they can even be avoidable—for
  example, improper access credentials in development and production environments.
  Continuous, sophisticated, adversarial attacks can occur on all components of the
  technology stack, associated datasets, and enabling infrastructure.


  ## Technology Stack


  A set of technologies—such as software products and programming languages—an organization
  uses to build applications.


  A lack of governance strategies and processes for AI-based operations can lead to
  vulnerable systems. Additionally, due to data aggregation and broader use, there
  is an increased risk that sensitive data spillage can occur, inadvertently granting
  access to unauthorized users. However, when crafting governance processes, use caution.
  Overly bureaucratic governance




  processes can mean delays in new model deployment, resulting in further inaccurate
  predictions.


  While using AI does not inherently make a solution riskier, there are several unique
  aspects that complicate the risk assessment process. These are some of the unique
  aspects:


  - Data is processed at speeds far faster than traditional analytical processes.

  - Decisions made by AI are likely to apply at a previously unimaginable scale.

  - Complicated algorithms may limit transparency and challenge human understanding.

  - Autonomous or self-learning systems may lead to unintended outcomes.

  - Organizational analytic and data maturity can have disproportionate impacts.

  - End users may blindly trust products, assuming developers accounted for all risks.


  While not a comprehensive list, Table 3-1 outlines approaches to risk mitigation
  that are enabled through AIOps adoption.


  ## Table 3-1. Risk mitigation facilitated by a reference architecture


  | AI complexity | Mitigation options |

  |---|---|

  | Speed | - Advanced monitoring for data, concept, mode<br>- Strategic alerting
  to enable human intervention |

  | Scale | - Application monitoring and versioning to ensure consistent rigor to
  include tracking model and data drift when scaling to additional environments/clients<br>-
  Application testing during model development<br>- Local testing using a data science
  notebook; model vetting during preproduction; outcome tracking and pedigree<br>-
  Use of data limits, infrastructure limits, and automated approvals to prevent unwanted
  scaling |

  | Transparency | - Track end-to-end data delivery (including training datasets);
  model development; model testing and deployment to include configuration management
  over time<br>- Comprehensive concept overview for operationalized model, including
  hardware usage and software versions used |

  | Unintended outcomes or consequences | - Evaluation of model usefulness and validity
  at preestablished time intervals and after discovery of unintended outcomes |

  | Organizational analytics and data maturity | - Develop reference architectures
  that provide baseline capability, accelerating maturity and enterprise understanding<br>-
  Establish an educational series that increases employee awareness and understanding
  of AI concepts<br>- Create defined roles for critical AI functions, including roles
  focused on engagement and education of AI concepts |

  | Blind trust | - Create education-based initiatives to decrease users’ blind trust
  in AI systems and increase their understanding of AI concepts<br>- Ability to reproduce
  the system code for all components<br>- Develop functionality to introduce known
  false positive and false negative data for model assurance testing<br>- While outside
  this report’s scope, teams should work closely with clients to scope work in a way
  that addresses blind spots. This includes working with subject matter experts to
  better assess risk and prescribe feedback loops to allow for proactive monitoring
  and decision-making. |


  Adopting an AIOps framework provides a consistent process to help mitigate risks,
  especially when you consider risks from the outset and incorporate controls into
  your scope of work.


  ## Risk Management Processes


  AI risk management business processes involve five main steps: (1) identifying risk,
  (2) quantifying impact, (3) developing monitoring and mitigation plans, (4) escalation,
  and (5) updating solutions. The overall process is shown in Figure 3-1.


  Identify risk

  Assess data integrity, model transparency, security


  Update solution

  Update solution, validate, and redeploy


  Continual update of risk matrix, controls and measure, and solutions


  Quantify impact

  Validity of output; user adoption; organizational security; and magnitude and scale


  Escalate

  Risk matrix escalation for notification and engagement


  Develop monitoring and mitigation plan

  Mitigation plan with continual evaluation; data and model management; implementation


  Figure 3-1. Risk management process


  Identifying risk involves assessing AI system performance, data integrity, model
  transparency, solution security, and any real-world constraints imposed on the use
  case. You should always actively look out for bias in the data, whether or not the
  AI system is appropriately using the models and data, whether or not hacking and
  security are a concern for the specific AI solution, and whether or not your proposed
  solution is feasible and tractable given the available resources.


  Once risks are identified, it’s time to quantify the impact. Quantifying impact
  is the process of identifying and assigning a value to the likelihood, impact, and
  tolerance of each risk based on (1) the validity of the model or system output,
  (2) user adoption and acceptance, and (3) organization security and reputation.
  When quantifying impact, you should examine potential magnitude and scale.


  The next step is to develop a monitoring and mitigation plan. There are many considerations
  for such a plan, but primary among them is an approach for periodically reevaluating
  identified risks. Data monitoring includes the need to track historical trends in
  data to identify significant deviations from those trends. These deviations may
  indicate underlying changes in processes and thus may result in reduced model accuracy,
  indicating a need to retrain the model.


  Once the monitoring plans are in place, it’s important to understand what to do
  if there is a discrepancy. Escalation is a key step in any risk management plan—calculating
  the expected impacts of any risk not fully addressed or mitigated.


  If a risk meets preestablished criteria for escalation, teams must then notify key
  stakeholders so they can consider and take action. You can then engage expert AI
  reach-back support as necessary to address identified issues. Once the risk mitigation
  occurs, the AI solution is revalidated and redeployed. At this point, you would
  also update the list of identified risks and monitoring/mitigation plans as necessary.



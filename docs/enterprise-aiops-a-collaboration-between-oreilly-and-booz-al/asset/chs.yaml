- '# Chapter 4. Data: Your Most Precious Asset


  When it comes to your organization’s data, you can’t manage what you don’t see,
  and you certainly can’t protect what you aren’t tracking.


  AI relies on large volumes of historical data and advanced ML methods to generate
  insights. Data is the starting point for AI development. It’s critical you establish
  data management as a fundamental competency, ensuring your teams have the tools
  needed to properly handle and curate data.


  The amount of data available today is exploding as organizations continue to accumulate
  information at an exponential rate. This growth complicates our ability to understand
  what data exists, where it exists, who can use it, and how it can be used to generate
  better outcomes.


  It’s critical that your organization find and develop the technologies, implement
  appropriate policies, and help train employees to adapt to the changing data-centric
  environment.


  ## Data’s Role in AIOps


  An AI project’s success depends on data readiness (e.g., is the data cleansed in
  a standard format? is incomplete data removed/filled? etc.) both for training AI
  models and operationalizing AI capabilities. Data readiness for AI can be measured
  through the key drivers of availability, accessibility,¹ timeliness, accuracy,²
  usability,³ form, quality,⁴ provenance,⁵ and security.⁶


  ### Accuracy


  The degree to which data correctly describes the “real world” object or event being
  described.


  ### Usability


  A measure of how reliable the data is. Data that is messy, is missing substantial
  records, is difficult to ingest, or is otherwise prohibitive would be less usable.


  ### Provenance


  Provenance of a resource is a record that describes entities and processes involved
  in producing and delivering or otherwise influencing that resource. Provenance provides
  a critical foundation for assessing authenticity, enabling trust, and allowing reproducibility.
  Provenance assertions are a form of contextual metadata and can themselves become
  important records with their own provenance.


  ### Security


  How safe the data is from loss or unwanted manipulation.


  Managing data as an asset can help your organization address these challenges and
  support AI needs through a multilayered approach to data readiness. A holistic approach
  will help drive data readiness across all dimensions of data as follows:


  - A data strategy aligns data capabilities with AI needs and establishes effective
  data management and data usage practices tailored to AI needs.

  - DataOps processes optimize workflows for automated data ingest, processing, and
  storage to help keep up with data needs at scale.






  - 标准化方法使数据摄取、转换、验证和准备成为可能。

  - 数据治理加速价值实现，涵盖与数据相关的合规、风险和监管问题（包括隐私、安全和访问控制）。

  - 负责任的数据政策规定了访问权限、“查看权”授权、伦理原则，以及组织内数据使用的可接受应用。


  ## 数据战略


  从试点转向运营化 AI 需要一个战略来帮助将数据能力与 AI 需求保持一致。这是实现可扩展且可重复的 AI 模型开发流程并运营化 AI 的第一步。


  数据战略对于实现 AI 目标并通过以下重点领域实现价值创造的规模化至关重要：


  - 识别 AI 数据需求和差距，包括数据使用的实际或法律限制

  - 识别获取/收集数据以填补差距的方式，并识别非传统数据源以获得额外洞察，并将此数据整合到现有数据环境中

  - 创建集中化的愿景以使数据能力与 AI 项目的需求保持一致

  - 使数据管理、转换、质量和治理职能保持一致，以建立和扩展 AI 能力

  - 实现对数据相关能力的一致性视图，以便它们能够随 AI 需求而演进

  - 定义具体行动、权衡和指标以帮助评估和准备数据能力

  - 跟踪数据血缘、来源和质量以帮助 AI 的透明度和可解释性


  你的数据战略需要在 AI 语境下回答以下问题：


  - AI 可能为你的组织解决哪些传统分析已无法解决的挑战？

  - 该战略将如何使组织走上实现目标的道路？

  - 哪些具体步骤可以帮助实施该战略？

  - 可以将哪些实际影响与该战略联系起来？

  - 如何通过将资源与战略保持一致来支持使命并实现价值创造的规模化？


  虽然数据在各阶段之间的路径对每个组织都不同，但表 4-1 中的数据战略开发方法将数据战略开发和实施组织为四个阶段，可作为大多数组织的模板。


  ## 表 4-1. 建议的数据战略开发阶段


  | 阶段 | 行动 |

  |-------|---------|

  | 识别 | - 识别你的组织创建、收集或以其他方式能够访问以训练 AI 模型并扩展 AI 需求的数据。<br>- 识别数据如何在企业内流动以及它如何与 AI
  数据需求保持一致。<br>- 识别数据可用性的差距以及获取/收集数据的潜在方式。<br>- 识别非传统数据源，它们可以提供间接洞察。 |

  | 评估 | 评估你当前的数据能力并评估数据差距：<br>- 评估数据差距、填补差距的来源，以及在数据获取或使用存在可用性或实际和/或法律限制的情况下的替代方案。<br>-
  对当前数据能力进行记分卡评估，与 AI 数据就绪的关键驱动因素进行对比：可用性、可访问性、及时性、准确性、可用性、形式、质量、来源和安全性。<br>- 利用记分卡中的评估标准来衡量组织在人员、流程、工具和技术以及所需文化方面的表现。
  |

  | 对齐 | 定义数据战略以帮助你的组织解决 AI 需求并从数据中获得最大价值：<br>- 审查记分卡评估结果以确定组织优先需求。<br>- 定义组织就数据使用和管理达成一致的数据原则。<br>-
  将其与分析/AI 机会保持一致以优先考虑目标并定义后续目标。 |

  | 实施 | 实施数据战略和支持计划以帮助你从数据中获得最大价值：<br>- 制定实施计划、分配资源、定义 KPI 并制定变革管理计划。<br>- 执行由数据战略驱动的举措，并定期评估成果。
  |


  作为战略开发的一部分，AI 决策者应努力确保数据所有者、业务利益相关者、首席信息官和首席数据官的积极参与。这将有助于战略反映出关于数据及其在组织内适用用例的整体观点。


  ## DataOps：运营化你的数据战略


  DataOps 是运营化你的数据战略以大规模交付企业 AI 需求所需数据的方法论。Gartner 将 DataOps 定义为一种协作式数据管理实践，专注于改善组织内数据管理者和数据消费者之间的数据流的沟通、集成和自动化。⁷


  以规模支持 AI 数据需求需要高级管理层的关注。领导者可以确保战略执行成功并防止数据在各个业务单元内“孤岛化”。表 4-2 列出了你在开始构建数据战略时应纳入组织的关键角色和团队。


  ## 表 4-2. DataOps 中的关键角色


  | 关键角色 | DataOps 角色 |

  |---|---|

  | 首席数据官 | 首席数据官的角色部分是数据战略家和顾问，部分是提高数据质量的管家，部分是数据共享的倡导者，部分是技术人员，部分是新数据产品的开发者。ᵃ |

  | 企业信息管理（EIM）组 | 开发沟通、共享并强化组织内数据价值的机制。建立使用可重复流程和框架来治理和管理数据资产的政策和程序。确保数据被视为战略资产。
  |

  | 跨职能团队 | DataOps 从业者，他们通过各种行业领先的技术和工具实现跨职能所有权文化、可重复流程和数据能力的持续交付。 |

  | 业务单元负责人 | 运营单元或业务职能的领导或指定代表，他们创建/来源和管理其数据。 |



  - 3. Maria Rosala, “User Control and Freedom (Usability Heuristic #3)”, Nielsen
  Norman Group, November 28, 2020.

  - 4. See the *Harvard Business Review* article from November 2020: “AI Can Make
  Bank Loans More Fair”.


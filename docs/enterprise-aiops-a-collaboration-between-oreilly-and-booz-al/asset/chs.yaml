  \ architecture\n\n要支持全面的参考架构，您还必须考虑数字架构决策，包括基础设施和开发流程，以将您的 AI 能力从原型演进为已部署的解决方案。您的数字架构选择应支持参考架构和\
  \ AIOps 框架的所有组件，包括与终端用户、数据平台和分析技术的接口。考虑到这些相互关联的元素，以下是围绕这些数字架构组件的一些高层考虑，以开发协调、可扩展和可持续的\
  \ AI 能力。\n\n## Technical Infrastructure\n\n从本质上讲，AI 模型训练在计算上可能非常密集，通常需要大量算力。用于训练简单/中等复杂度的深度学习模型的类型硬件是专用实例或由图形处理器单元（GPU）或\
  \ CPU 与 GPU 组合驱动的小型/中型集群。高性能计算（HPC）环境可针对涉及高维数据集的更复杂模型进行优化，并配备 GPU 和并行分布式文件系统。\n\n\
  ## Development Processes\n\nDevSecOps 提供标准化流程，包含组织开发工作的框架，包括跨技术团队的协作以及在其整个生命周期内对能力的统一文档记录。在开发期间，该流程及其相关工具对于使跨职能团队能够高效地开发和测试\
  \ AI 模型至关重要。部署后，我们还考虑 AI 能力的长期可持续性，例如能力的持续集成、交付以及对其对组织影响的评估（基于定义的绩效结果）。\n\n## AIOps\
  \ Integration\n\n现在我们了解了来自 AI 采用蓝图的整体关注点，包括建立目标和绩效衡量，是时候考虑整合使 AI 运营化的要素的方法和流程了。为了实现这些期望的结果，我们必须考虑\
  \ AIOps 的组件流程——具体来说是 DataOps、MLOps 和 DevSecOps——包括它们在人员、流程和技术方面的相互关系和依赖性。首先，我们将概述这些考虑因素及其实施，然后从更技术性的角度深入探讨这些流程的整合。\n\
  \n## Operational Components\n\nAI 能力旨在在部署以支持业务流程时提供价值。为此，团队必须将 AI 能力集成到历史上支持业务流程的系统中。鉴于系统复杂性的指数级增长，扩展和维持\
  \ AI 需要对流程和依赖关系进行整体视图——以及结构化的工程方法——以将 AI 模型组合转化为已部署的运营能力。图 6-4 将此视图定义为应包含并在组织内集成的核心组件，以实现成功的\
  \ AI 部署。\n\n## AI process\n\n## AI integration\n\nMission and system engineering\n\
  \n+ Pipeline utilities\n+ Blueprints\n+ Registries\n+ Repositories\n+ Standards\n\
  + Services/tools\n\n## AI pipelines\n\n## DataOps\n\n+ - Processing\n+ - Versioning\
  \ and validating\n+ - Storage\n\n## MLOps\n\n+ - Model training\n+ - Analytics\n\
  + - Diagnostics and monitoring\n\n## DevSecOps\n\n+ - Programming\n+ - Packaging\n\
  + - Orchestration and deployment\n\nProcesses\n\nFederated & distributed learning\n\
  \n## Enterprise IT infrastructure\n\nEnd users\n\nAI tools\n\nServer/hub\n\nEdge\
  \ devices\n\nInference and diagnostic returns\n\nServices\n\nAI/ML application services\n\
  \nConfiguration management and orchestration\n\nEnabling components\n\nData management\
  \ systems\n\nInfrastructure and workspace environments\n\nFigure 6-4. AIOps components\n\
  \n如图 6-4 所示，DataOps、MLOps 和 DevSecOps 构成了应根据您组织特定用例定制的 AIOps 核心运营组件。将其视为 AIOps 整体，这些方法的整合侧重于通过以下组合将组织需求转化为数据和分析流程：\n\
  \n+ - 开发集成自动化管道，跨越从数据摄取和处理到模型训练再到后续 AI 模型部署\n+ - 根据需要更新集成到系统和业务流程中的 AI 模型，以确保它们保持最新和相关，而非静态\n\
  + - 在数据、模型和开发结构之间持续集成和部署流程，并纳入反馈循环以推动流程改进\n+ - 在所有阶段支持模型可解释性的元数据收集流程\n\n在考虑我们将这些运营框架纳入的方法时，我们应重申\
  \ DataOps、MLOps 和 DevSecOps 在更广泛的 AIOps 框架中的一致性。我们将在下一节描述组件整合时使用这些工作定义。AIOps 整合的整体方法包含以下流程：\n\
  \n+ 1. 利用迭代的 DataOps 流程创建数据管道、普及访问权限，并监控和自动化流程以满足战略数据需求，从而实现 AI 能力。\n+ 2. 结合 MLOps\
  \ 以调整模型实现，更好地确定最适合给定运营需求的方法；MLOps 专注于 ML 模型的自动化训练、部署、监控和管理。\n\n+ 3. 实施 *DevSecOps*\
  \ 以协调更广泛的软件应用程序开发，支持 ML 模型的快速集成并部署到目标托管环境。如前所述，DevSecOps 在已建立的 DevOps 流程和实践中增加了关键的安全要素。\n\
  \n从企业角度来看，AIOps 组件作为支持组织目标的更大使命关键系统生态系统的一部分存在。鉴于使命关键系统的复杂性和快速演变性质，重要的是要遵循将 AI 能力集成到特定组织需求的最佳实践。与其他使命关键系统一样，AI\
  \ 系统需要通过全面的企业安全方法进行保护，所有安全最佳实践均适用。\n\n总体而言，该方法允许使用标准流程以可扩展和可重复的方式集成和迭代开发解决方案，同时在整个流程中保持完全可见性，这得益于元数据的帮助，元数据在集中式数据平台中收集。在以下部分，我们将应用\
  \ AI 采用蓝图来解决 AIOps 框架这些基本组件的整合问题。\n\n## Component Integration\n\n设计和开发企业 AI 能力需要对各个\
  \ AIOps 组件进行开发，以及上游和下游的协调，以使这些组件能够协同支持彼此。如本报告和 AI 采用蓝图所述，我们在通往整体 AIOps 整合的道路上考虑了几个相互关联的元素：负责任的\
  \ AI 以指导员工的旅程，数据工程以驱动分析流程；分析框架以从数据中获取价值和洞察；通过数字架构满足技术要求和持续部署。\n\n\n\n\n\n请记住，AI\
  \ 采用蓝图将 AIOps 集成定义为负责任地集成 DataOps、DevSecOps 和 MLOps，以设计、开发和维持 AI 能力。AIOps 组件之间的管道集成对于运营化和维持您的企业\
  \ AI 系统至关重要。DevSecOps 和 DataOps 都是复杂的学科，它们独立于 AIOps 存在，但在应用于 AI 模型开发时需要独特的考虑。在实施\
  \ MLOps 时，许多组织仅专注于模型开发，而没有投入足够的时间来完善围绕 ML 模型开发的其他流程，这种做法往往会导致 AI 系统产生次优结果，无法满足业务需求。\n\
  \n在设计集成企业 AI 系统组件所需的运营管道时，您应牢记以下几点考虑因素。在表 6-2 中，我们通过将 AI 采用蓝图中的元素与问题进行映射来概述 AIOps\
  \ 的这些相互关联的考虑因素，以检查它们的相互依赖关系。\n\n## Table 6-2. AIOps integration\n\n|  | Responsible\
  \ AI | Data engineering | Analytic frameworks | Digital architecture |\n|---|---|---|---|---|\n\
  | Responsible AI | **Incorporation of risk evaluation and management concerns surrounding\
  \ responsible workforce AI adoption.** |  |  |  |\n| Data engineering | *Does your\
  \ data strategy account for responsible governance and policy? Does your DataOps\
  \ process enable secure, democratized access?* | **Enterprise data strategy implemented\
  \ through DataOps to prepare and utilize data as a critical asset.** |  |  |\n|\
  \ Analytic frameworks | *What are the risks associated with interpreting and implementing\
  \ ML algorithms? What is the value derived from these analytics?* | *Is your data\
  \ readily available and prepared for sustained analysis? Is data appropriately managed\
  \ and versioned to enable advanced analytics?* | **Implementation of advanced analytics\
  \ and ML frameworks through MLOps.** |  |\n| Digital architecture | *Does your digital\
  \ infrastructure align to risk management and technical requirements? Are your development\
  \ processes clearly documented from prototype to production?* | *Are there established\
  \ data pipelines between storage systems and development environments? Does your\
  \ infrastructure support automation to reliably move data from a development to\
  \ production environment?* | *Do the outcomes of your analytic processes and development\
  \ practices correspond to specific organizational objectives? Do you have standardized\
  \ metrics to evaluate the impact of your AI capability?* | **Modular reference architecture\
  \ as required tech infrastructure to enable component integrations via DevSecOps.**\
  \ |\n\n在了解 AIOps 组件之间的联系并规划管道的实施特定设计之后，现在是时候构建和部署管道了。您的实施特定设计现在应被转化为最符合您即时业务需求和团队专业知识的技术特定构建。\n\
  \n请记住，AIOps 组件的集成应与构建组件本身一样严谨。事实上，我们应将这些互联视为组件本身！与其他软件解决方案一样，您的开发团队应编写测试以确保这些管道合规且可靠。这种验证必须彻底，并由主题专家提供信息，以确保考虑所有细微差别。管道应像企业\
  \ AI 系统的其余部分一样严格维护，并应定期更新，以确保系统持续遵守 AI 最佳实践。\n\n本报告提供了深入回顾组织需要具备的各种方面，以便通过应用 AIOps\
  \ 以及所有相关支持因素不断推进其企业 AI 能力。这些方面中的每一个都不能单独解决。\n\n相反，组织必须将它们视为一套集成能力，以提升其构建成功且有影响力的\
  \ AI 解决方案的能力。\n\n- 1. 有关如何检测模型中偏差的进一步阅读，请参阅 [this article from TowardsDataScience](this\
  \ article from TowardsDataScience)。\n- 2. Steve Sirich，“Data Privacy in the Age\
  \ of Privacy Protection”，*Forbes*，2020 年 5 月 25 日。\n- 3. 有关进一步阅读，请参阅 Jim Bird 的\
  \ 2016 年报告 *DevSecOps*（O’Reilly Media）。\n\n## Conclusion\n\n本报告的目标是提供有关组织如何从在受控实验室环境中应用\
  \ AI 推进到将组织提升为企业 AI 能力的见解。如所述，要使这一转型成功，必须解决许多因素（AI 项目的范围界定、衡量成功、嵌入负责任 AI、运营的集成、监控\
  \ AI 模型性能以及追求持续改进）。今天，我们正处于与 AI 相关的最大炒作和潜力点。如果组织无法将 AI 模型投入生产并实现这些投资的潜在回报，AI 解决方案将面临采用率下降以及组织体验\
  \ AI 作为转型能力所能提供的全部价值的时间线延长。\n\n通过应用本报告中概述的方法和框架，组织可以利用经验教训，减少在使 AI 成为其组织的企业能力方面的时间和风险。在许多情况下，组织专注于其中一个或少数几个方面，导致在建立和扩展企业\
  \ AI 时遇到挑战。本报告中概述的每个领域都必须得到关注和资源投入，必须集成，并且必须迭代增强，以实现企业 AI 的全部潜力。\n\n同时还必须牢记，每个主题都需要迭代改进，尤其是在快速技术发展和\
  \ AI 研究的背景下。新的工具和能力不断被开发，推动了这些领域的最新进展，因此 AIOps 应该是一段持续的旅程，而不是“一劳永逸”的过程。\n\n如果组织利用这些\
  \ AIOps 方法和框架，它们就能够迅速将 AI 运营化到企业层面。它们可以成为一个组织，能够在与负责任 AI 原则以及组织愿景和目标保持一致的情况下，快速开发和改进其\
  \ AI 解决方案。这些 resulting 解决方案可以使组织实现 AI 的预期潜力——一种跨行业的转型能力——并开始看到对其投资的真正、可量化的回报。\n\n\

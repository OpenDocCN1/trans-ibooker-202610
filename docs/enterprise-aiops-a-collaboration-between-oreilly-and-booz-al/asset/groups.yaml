    要支持全面的参考架构，您还必须考虑数字架构决策，包括基础设施和开发流程，以将您的 AI 能力从原型演进为已部署的解决方案。您的数字架构选择应支持参考架构和
    AIOps 框架的所有组件，包括与终端用户、数据平台和分析技术的接口。考虑到这些相互关联的元素，以下是围绕这些数字架构组件的一些高层考虑，以开发协调、可扩展和可持续的
    AI 能力。


    ## Technical Infrastructure


    从本质上讲，AI 模型训练在计算上可能非常密集，通常需要大量算力。用于训练简单/中等复杂度的深度学习模型的类型硬件是专用实例或由图形处理器单元（GPU）或
    CPU 与 GPU 组合驱动的小型/中型集群。高性能计算（HPC）环境可针对涉及高维数据集的更复杂模型进行优化，并配备 GPU 和并行分布式文件系统。


    ## Development Processes


    DevSecOps 提供标准化流程，包含组织开发工作的框架，包括跨技术团队的协作以及在其整个生命周期内对能力的统一文档记录。在开发期间，该流程及其相关工具对于使跨职能团队能够高效地开发和测试
    AI 模型至关重要。部署后，我们还考虑 AI 能力的长期可持续性，例如能力的持续集成、交付以及对其对组织影响的评估（基于定义的绩效结果）。


    ## AIOps Integration


    现在我们了解了来自 AI 采用蓝图的整体关注点，包括建立目标和绩效衡量，是时候考虑整合使 AI 运营化的要素的方法和流程了。为了实现这些期望的结果，我们必须考虑
    AIOps 的组件流程——具体来说是 DataOps、MLOps 和 DevSecOps——包括它们在人员、流程和技术方面的相互关系和依赖性。首先，我们将概述这些考虑因素及其实施，然后从更技术性的角度深入探讨这些流程的整合。


    ## Operational Components


    AI 能力旨在在部署以支持业务流程时提供价值。为此，团队必须将 AI 能力集成到历史上支持业务流程的系统中。鉴于系统复杂性的指数级增长，扩展和维持 AI 需要对流程和依赖关系进行整体视图——以及结构化的工程方法——以将
    AI 模型组合转化为已部署的运营能力。图 6-4 将此视图定义为应包含并在组织内集成的核心组件，以实现成功的 AI 部署。



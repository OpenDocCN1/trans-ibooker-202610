    - 2. **吞吐量：** 与基线相比，模型处理的数据吞吐量增加

    - 3. **决策速度：** 模型提供答案所需的时间，在许多情况下与基线流程的决策制定时间线相比

    - 4. **容量：** 模型推理满足用户请求数量的能力以及提供这些请求时的延迟

    - 5. **使用率：** 鉴于目标用户群，有多少百分比正在使用该解决方案以及随时间的变化


    理想情况下，您希望您的 AIOps 能力能够在企业范围内实现成功。因此，如果您的 AIOps 框架成功，您将开始在项目的生命周期中看到这些指标的改善。需要提醒的是，这将仍然是一个迭代过程，利用这些标准和利益相关者参与的反馈来跟踪和指导您
    AI 能力的开发以及 AIOps 实施复杂性的持续进步。



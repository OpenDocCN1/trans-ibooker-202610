    Is Your Organization Ready?”。

    4. Ian Sample，“Computer Says No: Why Making AIs Fair, Accountable and Transparent
    Is Crucial”，The Guardian，2017 年 11 月 5 日。


    ## 第 3 章. 负责任的 AI


    如第 1 章所述，在生产中维持 AI 需要与各种关键利益相关者（例如终端用户、风险经理）协调，以确保其对他们的利益负责。


    此外，可持续的 AI 开发应寻求自动化这种协调，以减轻开发人员的负担，并确保利益相关者和开发人员共同承担责任。


    随着您将 AI 运营化以在企业规模上解决问题，建立负责任的系统变得越来越重要。如果不这样做，可能会导致您的组织出现意想不到的风险、影响和后果。


    今天的负责任 AI 讨论突出了那些往往让公司登上报纸头版的问题。但这些广泛的讨论未能提供解决潜在责任挑战的具体建议。增加挑战的是，负责任 AI 的衡量没有容易定义的指标。为了建立这一基础，开发人员、经理和高级领导者都应了解他们在这个过程中的独特角色和贡献。


    简而言之，负责任 AI 的问责属于组织中的*每个人*。这正通过更多指导的出台而进一步得到证明，包括美国国防部副部长最近发布的“Implementing Responsible
    Artificial Intelligence in the Department of Defense。”¹ 该备忘录包括实施和评估国防部负责任 AI 生态系统的条款，以提供领导、治理和监督。此外，私营部门也在讨论许多非国防部法规。快速的网络搜索²将揭示许多新的负责任

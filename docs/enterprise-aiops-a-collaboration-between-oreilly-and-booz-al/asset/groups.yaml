    To prepare your workforce to embrace AI, skilled technical teams are not enough.
    Introducing AI into your organization can upend a traditional work environment
    and responsibilities. Leaders who prepare their workforces to operate in their
    modified roles will prevent talent skill gaps, expedite successful adoption, and,
    most importantly, prepare all staff members to play a role in developing responsible
    AI. Where an AI team must *build* AI responsibly, end users must *use* AI responsibly.
    End users must receive training on appropriate uses for the applications, including
    how to understand and interpret outputs, the appropriate degree of human oversight,
    and key risks.



    Understanding these techniques also enables us to consider a model’s ability to
    generalize (i.e., ability to apply each model to sets of unfamiliar data) when
    putting models into a production environment, and to better monitor and improve
    our overall design choices.


    *Supervised learning* is perhaps the most often discussed example of ML. With
    this technique, algorithms are used to analyze numeric or labelled data (e.g.,
    input-output pairs, tagged images, or other closely associated information). Common
    applications include regression models used for predicting continuous numeric
    values (e.g., stock prices) and classification models used for predicting categorical
    (e.g., file is/not malicious) class labels from operational data features.


    Supervised ML breaks data into input (called “features”) and outputs (known as
    “labels” for classification and “targets” for regression) and attempts to predict
    the latter from the former. Supervised learning’s key benefit is that it enables
    us to focus the analytic model on a specific task for high accuracy, precision,
    and recall.² This makes supervised learning the most practical technique for most
    operational use cases.'
  - '[PAGE 62]


    # Accuracy


    The ability for ML models to produce exact versus approximate results. It measures
    how close your model came to correctly predicting all true positives and true
    negatives.


    # Precision


    A measure of confidence for your ML model. Precision is calculated by dividing
    the total number of true positives by (true positives + false positives). In other
    words, for all of the data that your model predicted to be a “positive,” what
    proportion of these were actually positives?


    # Recall


    A measure of classification performance for your ML model. Recall (also known
    as sensitivity or “true positive rate”) is calculated by dividing the total number
    of true positives by (true positives + false negatives). In other words, for all
    observations that are actually positive, what proportion of observations did your
    model correctly predict to be “positive”?


    Supervised learning’s operational success has resulted in additional research
    and development into explainability and sustainability, currently far in advance
    of other ML techniques. The key distinction between supervised learning and other
    ML approaches centers on the optimization of the model through the process of
    training its weights (i.e., learned parameters), as depicted in Figure 5-2.'
  - '[PAGE 63]


    ![](img/53a28dd44bbae66341b0fe693bd59916_63_0.png)


    Figure 5-2. Supervised ML process


    With supervised learning, labeled input data is fed into the algorithm to train
    the model, where it refines the algorithm’s “weighting” by testing against specified
    criteria. The process used to refine a model is rooted in statistical cross-validation,
    where data is divided into two random subsets—one to train the model, the other
    to test its performance. Although the specifics get incredibly technical very
    quickly, the bottom line is this: once sufficiently trained, we can refine and
    improve deployed models by reengineering training data features and retraining
    the model as necessary while monitoring its behavior throughout the ML life cycle.


    A second ML technique, unsupervised learning, trains a model directly from patterns
    present in data rather than the input-output approach found in other types of
    ML. The key advantage with unsupervised algorithms is its capacity for finding
    patterns not known to the developer beforehand, presenting new avenues of exploration.
    This approach’s downside is that these algorithms generally find a high volume
    of patterns in production data, with no focused'
  - '[PAGE 64]


    way of knowing which patterns are valuable to a particular use case apart from
    abstract data-fit metadata. Additionally, unsupervised learning approaches are
    inherently less explainable than supervised models, as they usually leverage training
    data lacking a specified classification or input-output relationship between features.
    This high-level process is depicted in Figure 5-3.


    ![](img/53a28dd44bbae66341b0fe693bd59916_64_0.png)


    Figure 5-3. Unsupervised ML process


    While unsupervised learning techniques are certainly used as stand-alone approaches
    to modeling (e.g., anomaly detection and data clustering), we regularly leverage
    these techniques in tandem with supervised processes to simplify the problem space
    or gain additional insight into our data through exploratory analysis.


    A third technique is reinforcement learning, which provides a novel approach to
    training models within a specified environment. While there are similarities with
    supervised learning (e.g., optimization around a relevant penalty or reward metric),
    reinforcement learning takes a distinct approach to model refinement. Approaches
    such as Q-learning allow so-called “agents” (i.e., software bots) to interact
    directly with their environment (physically, virtually, or both) to refine its
    behavior with a goal of iterating toward a specified objective. The underlying
    algorithms, including support vector machines (SVM) and neural networks (defined
    later in this section),'
  - '[PAGE 65]


    generate a model to dictate the agent’s behavior and continue to update based
    on increased experience within the environment.


    Additionally, this technique is considered to be more explainable than a purely
    unsupervised approach. During a reinforcement learning process, we incrementally
    feed training data into a model, producing a result evaluated by a reward function,
    and then provide the model with feedback in the form of the results of the reward
    function that is combined with subsequent training data to continually refine
    the model parameters.


    As shown in Figure 5-4, the reinforcement learning process begins with users establishing
    goals, which become the primary objectives for the ML algorithm. When we initialize
    this process, the agent is completely ignorant of the rules of the experiment,
    necessitating multiple training runs before it can improve its performance. As
    the agent’s model continues to update based on reward feedback from the environment,
    it continually refines its performance, learning from previous successful approaches
    while deemphasizing less useful tactics. This approach initially gained notoriety
    through the application to games like chess, AlphaGo, and Starcraft, where, after
    execution of significant training, the models were able to outperform expert human
    players at these games.'

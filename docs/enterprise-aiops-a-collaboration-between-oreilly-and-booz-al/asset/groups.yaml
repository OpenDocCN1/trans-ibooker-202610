    # AIOps: standardized, scalable, repeatable AI/ML engineering process


    Mission engineering (defining the use case)


    Responsible AI with human-centered design


    AI team


    DataOps


    MLOps


    DevSecOps


    Data engineering


    Machine learning engineering


    Systems engineering


    Reliability engineering


    Integration of the "OPS"


    Infrastructure and cybersecurity engineering


    Operational feedback loop(s)'
  - '[PAGE 19]


    Figure 2-1. AIOps framework


    This AIOps framework provides you with the basis to move AI from pilots to production.
    It is composed of several key components that are integrated to deliver AI solutions
    that meet requirements of specific use cases, operate in production environments,
    and can be updated rapidly to address changing conditions. We’ll discuss each
    of these components throughout the report. These primary components are:


    # Mission engineering


    It is critical for organizations to define and validate if AI is applicable to
    the use case(s) they want to solve through the deployment of AI.

    Successful mission engineering will allow organizations to bring AI to the enterprise
    responsibly with real mission outcomes. We’ll cover this more in Chapter 6.


    # Responsible AI with human-centered design


    To operationalize AI, you’ll need to focus on responsible AI to ensure the AI
    solutions, when deployed, will meet performance required and adhere to organization
    standards and core values. We’ll discuss this further in Chapter 3.


    # Data engineering and data operations (DataOps)


    Locating the data required and developing repeatable data pipelines to increase
    value of data and make it available across the enterprise. The operationalization
    of data engineering and management is known as “DataOps,” which allows the rest
    of your downstream pipeline to reap the benefits (e.g., more accurate AI/ML training)
    of better data availability and quality. See Chapter 4 for more detail.


    # ML engineering and ML operations (MLOps)


    Development of advanced algorithms using supervised, unsupervised, reinforcement,
    deep learning, etc. as required to support complex decision making. This process
    includes both science and art but provides'
  - '[PAGE 20]


    a structured process for training models from data and maintaining configuration
    management of those models. Operationalizing ML through MLOps allows you to deploy
    your ML models into production environments and sustain them. We’ll cover this
    more in Chapter 5.


    # Systems engineering and DevSecOps


    Application of a structured framework for integration, documentation, and automation
    to develop, deploy, and monitor software and system solutions across your organization.
    Development, security, and operations (DevSecOps) integrates critical components
    of security and focuses on operationalizing the applications you’ll develop through
    software and systems engineering. A strong DevSecOps¹ framework is necessary to
    embed your AI analytics into existing or new software solutions. We’ll discuss
    more in Chapter 6.


    # Reliability engineering


    It is important for your organization and teams to establish clear objectives
    for AI solutions that are focused and realistic with quantitative definitive measures
    of success. You’ll need a repeatable and scalable approach to monitor the success

    Recall that the AI Adoption Blueprint defined AIOps integration as the responsible
    integration of DataOps, DevSecOps, and MLOps to design, develop, and sustain an
    AI capability. Pipeline integration between the AIOps components is crucial to
    operationalizing and sustaining your enterprise AI system. Both DevSecOps and
    DataOps are complex disciplines that exist independently of AIOps but require
    unique consideration when they are applied to AI model development. When implementing
    MLOps, many organizations focus solely on model development and do not invest
    the time required to mature other processes around ML model development, a path
    that often leads to AI systems producing suboptimal results and failing to address
    business needs.


    There are a few considerations you should keep in mind when designing the operational
    pipelines necessary to integrate components of the enterprise AI system. In Table
    6-2, we outline these interrelated considerations for AIOps by mapping linkages
    between elements from the AI Adoption Blueprint and questions to examine their
    interdependencies.


    ## Table 6-2. AIOps integration


    |  | Responsible AI | Data engineering | Analytic frameworks | Digital architecture
    |

    |---|---|---|---|---|

    | Responsible AI | **Incorporation of risk evaluation and management concerns
    surrounding responsible workforce AI adoption.** |  |  |  |

    | Data engineering | *Does your data strategy account for responsible governance
    and policy? Does your DataOps process enable secure, democratized access?* | **Enterprise
    data strategy implemented through DataOps to prepare and utilize data as a critical
    asset.** |  |  |

    | Analytic frameworks | *What are the risks associated with interpreting and implementing
    ML algorithms? What is the value derived from these analytics?* | *Is your data
    readily available and prepared for sustained analysis? Is data appropriately managed
    and versioned to enable advanced analytics?* | **Implementation of advanced analytics
    and ML frameworks through MLOps.** |  |

    | Digital architecture | *Does your digital infrastructure align to risk management
    and technical requirements? Are your development processes clearly documented
    from prototype to production?* | *Are there established data pipelines between
    storage systems and development environments? Does your infrastructure support
    automation to reliably move data from a development to production environment?*
    | *Do the outcomes of your analytic processes and development practices correspond
    to specific organizational objectives? Do you have standardized metrics to evaluate
    the impact of your AI capability?* | **Modular reference architecture as required
    tech infrastructure to enable component integrations via DevSecOps.** |


    After understanding the connections between the components of AIOps and planning
    the implementation-specific design of your pipelines, it is finally time to build
    and deploy the pipelines. Your implementation-specific designs should now be translated
    into technology-specific builds that best align to your immediate business needs
    and team expertise.


    Keep in mind that integrating AIOps components should be treated with the same
    rigor as the building of the components themselves. In fact, we should approach
    these interconnections as components themselves! As with other software solutions,
    your development team should be writing tests to ensure these pipelines are compliant
    and reliable. This verification must be thorough and informed by subject matter
    experts to ensure all nuances are considered. Pipelines should be maintained as
    rigorously as the rest of the enterprise AI system and should receive regular
    updates to ensure the system continuously adheres to AI best practices.


    This report has provided an in-depth review of the range of aspects that are required
    to allow organizations to continually advance their enterprise AI capabilities
    through the application of AIOps and all the associated supporting factors. Each
    of these aspects cannot be addressed individually.


    Instead, organizations must view them as an integrated set of capabilities that
    advance their ability to build successful and impactful AI solutions.


    - 1. For further reading on how to detect bias in your model, see [this article
    from TowardsDataScience](this article from TowardsDataScience).

    - 2. Steve Sirich, “Data Privacy in the Age of Privacy Protection”, *Forbes*,
    May 25, 2020.

    - 3. For further reading, see Jim Bird’s 2016 report *DevSecOps* (O’Reilly Media).


    ## Conclusion


    This report’s objective was to provide insights into how an organization can progress
    from applying AI in a controlled lab environment to advancing the organization
    to an enterprise AI capability. As outlined, there are many factors that must
    be addressed to make this transition successful (scoping of AI projects, measuring
    success, embedding responsible AI, integration of the ops, monitoring AI model
    performance, and pursuing continuous improvement). Today, we are at the point
    of maximum hype and potential associated with AI. If organizations are not able
    to move AI models to production and realize the potential return on those investments,
    AI solutions are in danger of decreased adoption and longer horizons until organizations
    experience the full value AI can provide as a transformation capability.


    Through the application of the approaches and frameworks outlined in this report,
    an organization can leverage lessons learned to reduce time and risk in making
    AI an enterprise capability for their organization. In many cases, organizations
    focus on one or a small number of these aspects, leading to challenges in establishing
    and scaling enterprise AI. Each area outlined in this report must be given attention
    and resources, must be integrated, and must be iteratively enhanced to realize
    the full potential of enterprise AI.


    It is also critical to keep in mind that each topic needs to be improved iteratively,
    especially in light of the state of rapid technology development and AI research.
    New tools and capabilities are continually being developed that advance the state
    of the art in each of these areas, so AIOps should be a continuous journey and
    not a “one and done” process.


    If organizations utilize these AIOps approaches and frameworks, they are well
    positioned to rapidly move to operationalizing AI at the enterprise level. They
    can become an organization that rapidly develops and improves their AI solutions
    in alignment with responsible AI principles and organizational vision and goals.
    Those resulting solutions can enable organizations to realize the expected potential
    of AI—a transformational capability spanning industries—and begin to see a true,
    quantitative return on their investment.


    ## About the Authors


    **Justin Neroda** leads strategic investment efforts to apply artificial intelligence,
    machine learning, digital solutions, and advanced analytics for defense and intelligence
    clients. His expertise includes operationalizing AI solutions across a portfolio
    of ongoing AI projects. Justin also has more than 20 years of experience managing
    analysts and developers to execute a broad range of modeling, simulation, visualization,
    and analytical tasks for the DoD. Justin holds an M.B.A. in management information
    systems from George Mason University and a B.S. in industrial and systems engineering
    from Virginia Tech.


    **Steve Escaravage** leads Booz Allen’s analytics practice and AI services business,
    assisting clients with the operational integration of data science, machine learning,
    and AI solutions. As a leader in Booz Allen’s strategic innovation initiatives,
    Steve also leads the firm’s investments in data science, machine learning, and
    AI. He holds an M.S. in operations research from George Mason University and a
    B.A. in mathematics from Rutgers University.


    **Aaron Peters** is a leader for Booz Allen’s AIOps capability, building frameworks
    and tools that enable clients to deploy their AI capabilities more effectively
    into production. During his time at Booz Allen, Aaron has led projects delivering
    data science solutions to health and civil clients. Aaron’s educational background
    is rooted in his B.S. in computer science from Purdue University, where he focused
    specifically in software engineering, data management, and data engineering.


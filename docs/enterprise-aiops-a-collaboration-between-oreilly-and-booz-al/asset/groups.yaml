    Recall that the AI Adoption Blueprint defined AIOps integration as the responsible
    integration of DataOps, DevSecOps, and MLOps to design, develop, and sustain an
    AI capability. Pipeline integration between the AIOps components is crucial to
    operationalizing and sustaining your enterprise AI system. Both DevSecOps and
    DataOps are complex disciplines that exist independently of AIOps but require
    unique consideration when they are applied to AI model development. When implementing
    MLOps, many organizations focus solely on model development and do not invest
    the time required to mature other processes around ML model development, a path
    that often leads to AI systems producing suboptimal results and failing to address
    business needs.


    There are a few considerations you should keep in mind when designing the operational
    pipelines necessary to integrate components of the enterprise AI system. In Table
    6-2, we outline these interrelated considerations for AIOps by mapping linkages
    between elements from the AI Adoption Blueprint and questions to examine their
    interdependencies.'

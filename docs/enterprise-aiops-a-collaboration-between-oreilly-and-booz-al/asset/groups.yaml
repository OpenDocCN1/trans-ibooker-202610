  - '[PAGE 10]


    behavior of an AI analytic is called explainability and will be explored in detail
    in the following chapters.


    With machine learning, computer models use experiences/historical data to make
    decisions by recognizing patterns in data. These experiences take several forms.
    For example, they could be collected by reviewing historical process data or observing
    current processes, or they could be generated using synthetic data. However, in
    many cases, practitioners must manually extract these patterns before they can
    be used. The sophistication of patterns and resulting operations can vary wildly
    based on the algorithm selected, the learning parameters used, and the way in
    which the training data is processed into the algorithm.


    Similarly, AI (to be more specific—the sub-area of deep learning) uses models,
    such as neural networks, to learn highly complex patterns across various data
    types. To summarize at a high level, AI enables computers to perceive, learn from,
    abstract, and act on data while automatically recognizing patterns in provided
    datasets.²


    AI can be used for a variety of use cases—some of which you may be familiar with.
    A few common examples where AI can be deployed to recognize patterns include:



    sci-fi movies depict robots with the ability to have sophisticated, improvised,
    and fluent conversations with humans, or carry out complex actions and decisions
    in unexpected circumstances as people can. In fact,


    we’re not at that level of AI sophistication; to get there will take significant,
    persistent investment to advance current AI capabilities.


    Currently, operational instances of AI represent what is known as *narrow intelligence*,
    or the ability to supplement human judgment for a single decision under controlled
    circumstances. Artificial *general intelligence*, in which machines can match
    a human’s capacity to perform multiple decisions in uncontrolled circumstances,
    does not exist at this point in time. While there have been recent advances to
    move in the direction of general intelligence,³ we are still quite far from this
    type of AI being seen at any meaningful scale. Figure 1-1 provides a high-level
    overview on what AI can and cannot do well today.



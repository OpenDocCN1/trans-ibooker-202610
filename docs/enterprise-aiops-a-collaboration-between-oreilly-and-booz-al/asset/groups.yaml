    AI needs a focus—whether that’s an individual, a group or class of people, or
    an entire society. But responsible AI also needs a source of authority or moral
    compass. That can be an organization’s shared values and principles or a society’s
    norms and cultural practices. It is only then that we can address, for example,
    what a “fair” AI system is and for whom and why we consider the implications to
    be fair in the first place. Those values need to be embedded into the governance
    structure with the proper controls and measures to validate execution. This governance
    structure, including controls and metrics, should be agreed upon at an organizational
    level and not on a per project basis.


    Creating responsible AI requires specific tools and a supporting governance process
    to meaningfully balance the benefit-to-risk trade-offs. These are foundational
    elements required to put your responsible AI principles and values into practice.
    Implementation is key, and there are several considerations to keep in mind as
    you begin that journey:


    - You need to remain vigilant regarding possible bias or harm to key users/stakeholders.
    Expressing this possibility can help identify problems with an algorithm’s development,
    deployment, implementation, reuse, and output. Development stages should provide
    opportunities to question outcomes and address biases identified at any stage.

    - AI system, creators, owners, and risk managers should be held responsible for
    adverse outcomes of AI. Furthermore, it is important to distribute responsibility
    appropriately and avoid the common pitfall of blaming the nearest human operator
    for complex system errors. An algorithm’s decisions that affect endpoint stakeholders
    should be explainable and understood in a way that is consistent with your project’s
    acceptable risk levels; some use cases require much more explainability and understanding
    than others. Records and metadata should be maintained to ensure results can be
    adjusted and future stakeholders can be aware if adverse outcomes or actions occur.

    - All data, and provenance and lineage of that data, used to train a model or
    system should remain available in a descriptive form and continually updated with
    changes/uses. This will enable others to explore potential bias involving the
    data gathering process, a critical step to help identify and categorize a model’s
    originally intended use.

    - Developers should utilize rigorous validation and testing methods associated
    with the intended use case/outcomes and documented alongside results. Routine
    testing should probe for any adverse outcomes that may appear after deploying
    an AI-based solution. Developers should ensure that traceability and accountability
    are captured and stored by the AI system to hold relevant parties responsible
    for adverse outcomes.


    Successful adoption means prioritizing responsible use early in the process. As
    algorithms proliferate, we are more likely to see very real ethical


    challenges. Your teams charged with developing enterprise AI systems may have
    to forgo ML use cases and technologies that do not achieve standards of responsible
    use. Lives are often at stake, especially when these algorithms are defending
    critical infrastructure or utilities from cyberattack, so we must ensure our solutions
    are implementing techniques that properly address the ethical challenges that
    arise.


    Prioritizing considerations like fair outcomes, clear lines of accountability
    when things go wrong, and transparency into how the AI system itself was built
    and how it operates will ensure these tools are used in a manner consistent with
    your organization values. Furthermore, these prioritizations will help proactively
    mitigate ethical risks before they arise. A third benefit is increased governance
    for the data, algorithm development, and AI system controls and measures.


    ## Adopting Responsible AI


    The first step is to identify clear objectives for using artificial intelligence.
    What do you want AI to do for your organization? Are there a few narrowly defined
    use cases AI can address? Is your organization planning a broader AI-driven transformation?


    Like any technology adoption, having clear objectives—what you want AI to do and
    for whom—is critical. In addition, there are key elements to support adoption
    over the long term: designing AI for specific mission and business outcomes, creating
    and implementing an AI governance structure (e.g., organizational AI risk matrix
    framework), defining the organizational structure and roles needed to support
    AI, and creating a culture of continuous learning and engagement to build understanding
    and trust (e.g., working groups, leadership advisory committees, etc.).


    The most critical aspect of AI adoption is trust, and trust is rooted in control.
    Users are generally apprehensive about ceding any control to an algorithm. Understanding
    how an AI system works—why it produces the decisions or outputs that it does—and
    providing some control regarding outcomes are key elements to building trust,
    especially during early adoption.


    This can take any number of forms, from allowing a user to adjust social media
    newsfeed parameters to granting users ultimate decision rights over a system’s
    recommendations. In fact, one great strength of AI is the reduction of overhead
    needed to act on user feedback. We can use this strength to our advantage by incorporating
    low-overhead user feedback mechanisms to build user trust. Ultimately, most users
    may not exercise the user control and freedom (usability heuristic) available
    to them; it may simply be enough to know they have access to control.³


    Next is building your organization’s AI cultural readiness. Communicate your organization’s
    objectives clearly while providing employees a voice in the conversation. Address
    concerns in an open and transparent way, specifying how AI will affect them and
    how the organization is going to manage the change. Addressing concerns about
    artificial intelligence, while reinforcing AI as a tool to help make their lives
    easier, helps create adoption with the belief that it is being used responsibly.


    Organizations must also make AI real and understandable for key decision makers.
    It’s critical they understand where AI’s use is appropriate to deliver against
    business goals and an organization’s broader mission. This empowers leaders to
    pick and prioritize the right projects, have realistic expectations for end results,
    and better understand what’s needed to drive AI adoption throughout their organizations.


    Successful AI adoption also requires the right mix of talent. However, this doesn’t
    mean creating a monolithic team of data scientists and computer science PhDs.
    It is critical that your team include roles focused on engagement and education
    of AI concepts. All employees—including at each leadership level—need to be AI
    knowledgeable. Upskilling your workforce should be a core strategic component.
    To accelerate this process, it is helpful to ensure new hires for key roles have
    this AI baseline.


    ## Ethics


    Responsibly developing and adopting AI requires holistic management—from guiding
    principles all the way through system implementation. Precisely


    Figure 6-3. Reference architecture


    To support a comprehensive reference architecture, you must also consider digital
    architecture decisions, including both infrastructure and development processes,
    to evolve your AI capability from prototype to a deployed solution. Your digital
    architecture choices should support all components of your reference architecture
    and AIOps framework, including interfaces with end users, data platforms, and
    analytic technologies. Taking these interconnected elements into account, the
    following are some high-level considerations surrounding these digital architecture
    components to develop a coordinated, scalable, and sustainable AI capability.


    # Technical Infrastructure


    By its very nature, AI model training can be computationally intensive and often
    requires a large amount of power. The type of hardware used to train deep learning
    models of simple/moderate complexity are dedicated instances or small/medium clusters
    powered by graphic processor units (GPU) or a combination of CPUs and GPUs. High
    performance computing (HPC) environments can be optimized with GPUs and parallel
    distributed file systems for more complex models involving high-dimensional datasets.


    # Development Processes


    DevSecOps provides a standardized process, containing frameworks to organize development
    efforts, including collaboration across technical teams and uniform documentation
    of the capability throughout its life cycle. During development, this process
    and associated tools are critical to allow cross-functional teams to efficiently
    develop and test AI models. Once deployed, we also consider the long-term sustainment
    of the AI capability, such as continuous integration, delivery, and evaluation
    of the capability’s impact on the organization (based on defined performance outcomes).


    # AIOps Integration'
  - '[PAGE 102]


    Now that we understand the holistic concerns from the AI Adoption Blueprint, including
    establishing objectives and performance measure, it’s time to consider the approach
    and process to integrate elements that operationalize AI. To achieve these desired
    outcomes, we must consider AIOps’ component processes—specifically DataOps, MLOps,
    and DevSecOps— including their interrelation and dependencies across people, process,
    and technology. First, we’ll outline these considerations and their implementation

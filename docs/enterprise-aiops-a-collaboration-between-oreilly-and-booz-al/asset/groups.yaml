    ## Chapter 2. Defining the AIOps Framework


    Now that we’ve outlined the challenges of moving AI deployments from pilots to
    production, let’s introduce a framework (see Figure 2-1) that will enable your
    organization to move past these challenges and operationalize AI at an enterprise
    scale.


    Our AIOps framework will focus on two primary objectives: (1) evolving the AI
    development process itself and (2) integrating that development process within
    other parts of your organization to achieve a scalable, sustainable, and coordinated
    AI enterprise capability. In the following section, we’ll introduce the components
    and functionalities you’ll need to implement for a successful AIOps deployment.
    Figure 2-1 demonstrates how these components are aligned and sequenced with one
    another to enable enterprise AIOps.


    *AIOps*


    The processes, strategies, and frameworks to operationalize AI to address real-world
    challenges and realize high-impact, enduring outcomes. AIOps combines responsible
    AI development, data, algorithms, and teams into an integrated, automated, and
    documented modular solution for development and sustainment of AI.


    ## AIOps: standardized, scalable, repeatable AI/ML engineering process


    Mission engineering (defining the use case)


    Responsible AI with human-centered design


    AI team


    DataOps


    MLOps


    DevSecOps


    Data engineering


    Machine learning engineering


    Systems engineering


    Reliability engineering


    Integration of the "OPS"


    Infrastructure and cybersecurity engineering


    Operational feedback loop(s)


    Figure 2-1. AIOps framework


    This AIOps framework provides you with the basis to move AI from pilots to production.
    It is composed of several key components that are integrated to deliver AI solutions
    that meet requirements of specific use cases, operate in production environments,
    and can be updated rapidly to address changing conditions. We’ll discuss each
    of these components throughout the report. These primary components are:


    ### Mission engineering


    It is critical for organizations to define and validate if AI is applicable to
    the use case(s) they want to solve through the deployment of AI.

    Successful mission engineering will allow organizations to bring AI to the enterprise
    responsibly with real mission outcomes. We’ll cover this more in Chapter 6.


    ### Responsible AI with human-centered design


    To operationalize AI, you’ll need to focus on responsible AI to ensure the AI
    solutions, when deployed, will meet performance required and adhere to organization
    standards and core values. We’ll discuss this further in Chapter 3.


    ### Data engineering and data operations (DataOps)


    Locating the data required and developing repeatable data pipelines to increase
    value of data and make it available across the enterprise. The operationalization
    of data engineering and management is known as “DataOps,” which allows the rest
    of your downstream pipeline to reap the benefits (e.g., more accurate AI/ML training)
    of better data availability and quality. See Chapter 4 for more detail.


    ### ML engineering and ML operations (MLOps)


    Development of advanced algorithms using supervised, unsupervised, reinforcement,
    deep learning, etc. as required to support complex decision making. This process
    includes both science and art but provides

    a structured process for training models from data and maintaining configuration
    management of those models. Operationalizing ML through MLOps allows you to deploy
    your ML models into production environments and sustain them. We’ll cover this
    more in Chapter 5.


    ### Systems engineering and DevSecOps


    Application of a structured framework for integration, documentation, and automation
    to develop, deploy, and monitor software and system solutions across your organization.
    Development, security, and operations (DevSecOps) integrates critical components
    of security and focuses on operationalizing the applications you’ll develop through
    software and systems engineering. A strong DevSecOps¹ framework is necessary to
    embed your AI analytics into existing or new software solutions. We’ll discuss
    more in Chapter 6.


    ### Reliability engineering


    It is important for your organization and teams to establish clear objectives
    for AI solutions that are focused and realistic with quantitative definitive measures
    of success. You’ll need a repeatable and scalable approach to monitor the success
    of your AI deployments. We’ll also provide this framework in Chapter 6.


    ### Integration of the “Ops”


    Our AIOps framework will embed components of the other “ops” discussed above (DataOps,
    MLOps, DevSecOps) that you’ll need to successfully operationalize AI at the enterprise
    level. We’ll discuss the details of each ops in its corresponding chapter (e.g.,
    Chapter 4 will include information specific to DataOps). Then, in the final chapter
    (Chapter 6), we’ll describe the specific components you’ll need to take from each
    ops as you build your AIOps framework.


    ### Infrastructure and cybersecurity engineering


    A strong technical architecture and cybersecurity policies to protect your data
    and AI applications are critical for the long-term success of operationalizing
    AI. Although cybersecurity is an important part of your AIOps framework, it is
    not the focus of this report.² Instead, we simply want to point out that this
    is a fundamental prerequisite to a strong enterprise AIOps framework. We will
    discuss standing up and selecting infrastructures in some detail within Chapter
    4.


    ### Operational feedback loop(s)


    Feedback and learning is one of the most essential pieces of your AIOps framework.
    Your teams must be able to monitor data, models, applications, and processes to
    evaluate if changes are required throughout their life cycle. It is important
    that your AIOps framework allows teams across your organization to both share
    feedback with each other and allow their tools and processes to learn and improve
    from such feedback. We’ll discuss this process in Chapter 6.


    ### AI team


    A cross-functional, integrated team results in holistic AI/ML solutions that leverage
    the expertise of the individual members and results in best-in-class solutions.
    There are many key players that will enable your organization to operationalize
    AI effectively. Instead of setting aside one chapter or section to talk through
    these key players, we’ll introduce each where it makes the most logical sense
    (e.g., Chapter 4 will introduce the chief data officer).


    ## Why You Need an AIOps Framework


    As the technical barriers to AI continue to fall, an increasing number of organizations
    are initiating AI pilots, building prototypes, and attempting to move them into
    production. This leads to short-term triumphs as the pilots show potential through
    minimally viable products (MVPs) but long-term

    frustrations as teams encounter unexpected challenges when attempting to promote
    these pilots into production and embed them across their enterprise.


    These challenges provide a very real danger of trapping the organization in an
    endless cycle of fixing symptoms rather than addressing the underlying structural
    issues. The potential result is an exhaustion of resources (both funding and goodwill)
    and the ultimate failure of many AI efforts, not because they lacked merit but
    because the organization did not plan for and incentivize operationalizing them.
    An example of such a situation is developing an AI solution but not accounting
    for the end user’s education and training needs, leading to the failure of the
    end user to adopt the solution at all.


    While time will continue to solve and reduce the technical barriers to AI, the
    challenges of embedding AI across the enterprise and moving from pilots to production
    will not get easier simply by playing the waiting game. On the contrary, if organizations
    do not begin investing in standing up a framework to deploy AI at scale, they
    risk missing out on the ever-increasing benefits that AI has to offer.


    Enterprise AI adoption efforts are often fragile, lack unconditional leadership
    support, and challenge entrenched processes and interests. Early operational setbacks
    can mean the difference between long-term success and failure, making preventative
    steps essential. Some of the challenges and decisions you might face when deploying
    AI at scale are:


    - Ensuring business problems with greatest benefit-to-risk trade-off are prioritized

    - Minimizing the cost and rework for AI integration activities

    - Minimizing continuity of business risks

    - Ensuring maintainability of resulting AI capabilities, solutions, and systems

    - Optimal use of talent within your AI teams


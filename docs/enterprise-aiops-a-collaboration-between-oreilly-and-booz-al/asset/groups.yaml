    for potential growth. These business units are looking to leverage data and discover
    patterns to drive efficiency and enable better-informed decision making. A successful
    machine learning project analyzes business objectives to reveal significant factors
    influencing outcomes for machine learning deliverables. This step is critical
    to ensure your machine learning projects produce the right answers, ones that
    directly address the business problem you originally set out to solve.


    You should collaborate closely with subject matter experts and end users to better
    understand how they perform their activities in the current environment. Interviews
    and consultation performed at this stage will help you to better understand the
    business problem that needs to be addressed, the goal to be met, any applicable
    constraints or dependencies, and the desired outcome.


    A project plan should then be developed that defines how machine learning will
    address business goals. It’s important for all stakeholders to agree on the criteria
    that specify how results should be measured and what constitutes success from
    a business perspective. Assumptions should be documented to help guide the subsequent
    model development process during the next phase. All steps should be defined,
    including project details about scope, duration, required resources, inputs, outputs,
    and dependencies.



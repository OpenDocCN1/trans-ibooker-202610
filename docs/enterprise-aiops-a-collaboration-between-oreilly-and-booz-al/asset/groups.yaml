  - '[PAGE 54]


    holistic data governance, focused not only on creating a structure to regulate
    the storage, handling, and responsible use of data but also to facilitate maximizing
    data’s overall usefulness.


    An effective governance process ensures that subject matter experts—along with
    other technical, business, and regulatory compliance stakeholders—provide guidance
    to align efforts and meet your organization’s enterprise-wide strategic goals.


    Data governance priorities include:


    +   - Creating policies and procedures tailored to support data needs for AI at
    enterprise scale

    +   - Addressing data acquisition policies and procedures to include legal processes,
    agreements, and data brokers/data services

    +   - Empowering key stakeholders to facilitate and lead your organization’s data
    governance

    +   - Developing data security plans and data privacy policies in accordance with
    appropriate regulatory frameworks (e.g., Health Insurance Portability and Accountability
    Act [HIPAA], Federal Information Security Modernization Act [FISMA], European
    Union’s General Data Protection Regulation [GDPR], etc.)

    +   - Prioritizing metadata management to ensure compliance and troubleshooting
    support



    for this reason, we consider ethics to be a foundational element for responsible
    AI.


    There are five main considerations when integrating ethics:


    - 1. Ensure you understand how AI systems will impact your organization’s stakeholders
    in specific and tangible ways. This assessment should include routinely considering
    the political, economic, social, technological, legal, and environmental impacts
    across different stakeholders over time. This analysis should inform how you design
    and build models and select datasets to achieve desired results.

    - 2. Build meaningfully diverse and inclusive development teams. Include members
    with different backgrounds, skills, and thinking styles. Your team’s collective
    experience and insights will reduce unconscious bias, identify potential unintended
    consequences, and better reflect stakeholders’ wide-ranging values and concerns.

    - 3. Develop mechanisms for data provenance and audibility to verify your AI systems
    are operating as intended. If something goes wrong, data tracing and auditability
    mechanisms will help uncover data or concept drift or potentially expose upstream/downstream
    data issues. However, this will not necessarily capture issues in generalization;
    therefore, there may be a need for broader consideration of confounding/missing
    data and/or inappropriate method selections. Clear accountability mechanisms can
    help reduce ethical concerns, so it is critical to transparently account for the
    results. Your teams should understand that they are accountable for the actions,
    outputs, and impact of their models.

    - 4. Stay informed regarding AI technical developments. Because this field of
    study is changing rapidly, tools used to design and implement ethical systems
    have limited shelf lives. Your model’s sophistication will often outpace your
    ethical tools, increasing the probability something will go wrong and reducing
    your ability to fix it if it does. Maintaining awareness of AI technical developments
    and implementing controls and measures to monitor can help you mitigate risk and
    protect your organization from unintended consequences.

    - 5. Design your systems with specific applications and use cases in mind. Assessing
    the “fairness” of a model requires *context* and *specificity*. AI systems should
    be fair, but fair to *whom*? And in *what way*? Fairness is a laudable goal but
    becomes useful only when applied to a specific situation. Something that may be
    a fair outcome for someone in one situation could be deemed totally unfair in
    another situation.


    ## Workforce Development


    Critical workforce roles span organizational and project team levels. For example,
    executives are accountable for setting an organization’s vision, goals, and fundamental
    values. They hold ultimate responsibility for navigating complex business questions
    surrounding possible ethical impacts when introducing AI into their organizations.


    Whether made up of executives or frontline employees, a responsible AI development
    team’s composition will vary from project to project based upon specific needs.
    Nevertheless, there are common functions critical to any project’s success. AI-specific
    technical talent may be foremost in your mind, but other considerations are equally
    important.


    Responsibly developing AI requires a well-integrated, cross-functional team. End
    users, subject matter experts, technical staff, and other functional staff need
    to work collaboratively throughout the product development life cycle. Non-AI-specific
    staff should have a baseline technical understanding so they can successfully
    communicate their insights to the technical team. Similarly, AI staff should consider
    ethics an ever-present responsibility and have full understanding of and appreciation
    for intended use and desired outcomes.


    End users and subject matter experts provide organizational and use-case-specific
    context. By providing input from the beginning through the full development life
    cycle, these employees help ensure the AI project remains clearly tied to your
    organization’s mission and business needs. Additionally, by incorporating end
    user perspectives throughout planning and development, the AI model is more likely
    to meet user needs and, accordingly, more likely to be adopted. Finally, end users
    also play a fundamental role in providing key insights into human-machine teaming.


    Despite any specific roles assigned during a project’s life cycle, *everyone*
    bears responsibility when considering ethical outcomes throughout planning and
    development.


    ## AI Risks and Complexities


    AI risks and complexities apply during every phase of the AIOps life cycle. For
    example, there are systems that are more human centric (e.g., credit card score)
    versus ones that are machine centric (e.g., valve monitoring of a factory machine).


    One significant risk is a failure to meet ethical standards. This failure can
    lead to AI potentially harming people, property, or the environment. Oftentimes,
    it is difficult or impossible for organizations to predict the long-term consequences
    and impacts of a new technology on society. For example, pollution was not an
    early concern tied to widespread automobile use. This type of blind spot applies
    to AI solutions as well.


    A major subset of ethical risk is training data containing unidentified bias.
    This bias can lead to models that produce inaccurate results. This may occur when
    teams fail to incorporate diverse input from a range of technical and nontechnical
    stakeholders during model development and training, resulting in a system with
    embedded, unconscious bias. A common reason for use of biased datasets is a development
    team using datasets simply because they are available without consideration of
    whether the dataset reflects the real world. An example of unconscious bias in
    production is when banking financial algorithms approve fewer and smaller loans
    to women than to men with equivalent credit scores and income simply because that
    pattern existed in historical data. Historical trends uncovered that women would
    need to earn 30% more than men to be approved for equivalent sized loans.⁴


    In addition, there are unique risks and complexities that are introduced through
    the use of AI for autonomous, disconnected systems. These systems take many forms
    that include aerial, ground, and manufacturing. When these systems are operating
    autonomously, the operator may not be able to intervene to override the algorithms.
    Therefore, this must be taken into account in the AI model design and testing
    process to reduce these risks.


    Creating a feedback loop is critical because model outputs begin to affect the
    conditions within which the model operates. Original conditions that existed when
    training the model no longer exist due to the model’s own influence within the
    environment. AI solutions are highly sensitive to data inputs and may produce
    inaccurate results without highlighting an error if the data types or assumptions
    change unexpectedly.


    In real-world settings, AI solutions are vulnerable to security attack, data spillage,
    or a loss of privacy, the same as with other computer-based technologies. Attacks
    can come from internal or external sources. In many cases, they can even be avoidable—for
    example, improper access credentials in development and production environments.

    \n## Chapter 6. The Road to AI Adoption\n\n在之前的章节中，我们介绍了组织应在其团队中整合和协调的关键组件，以利用\
    \ AIOps 并开始构建强大的企业 AI 能力。\n\n本章概述了 AI 采用蓝图，以指导将这些主要组件整合到端到端技术解决方案中。利用这一整体蓝图，您的组织可以在多个企业工作流中整合这些解决方案，通过考虑定制和扩展\
    \ AI 所需的人员、流程和技术，将 AI 从原型过渡到有影响力的解决方案。\n\n## AI Adoption Blueprint\n\n在开始采用 AI\
    \ 时，至关重要的是要明白，没有任何组织能在一天内成功。相反，请预期一个由试错定义的过程，并持续获得来自组织各方利益相关者的反馈。本节提供了 AI 采用蓝图及其组件的概述，为这段旅程奠定基础，促进向强大的\
    \ AI 能力逐步推进。\n\n将 AI 解决方案运营化的最有效和可持续的方法是对相关风险保持勤勉和审慎。部分得益于 AI 日益普及，组织往往在考虑其独特的\
    \ AIOps 因素之前就寻求其项目的“AI 魔法”。虽然组织在采用 AI 解决方案时可以快速行动，但在没有适当计划的情况下仓促进行 AI 开发是存在风险的。\n\
    \n未能全面思考 AIOps 的所有考虑因素，会给团队带来风险，使其开发出不可靠的 AI 解决方案，而员工既不会接受也不会使用，最终限制了组织对 AI 的采用。特别是在大型企业或政府机构的情况下，这种失败可能导致对社会和关键资源产生毁灭性后果的影响。*AI\
    \ Adoption Blueprint* 将使您能够通过使用 AIOps 来解决这些问题，并制定缓解策略以避免此类陷阱。\n\n首先，您应考虑在推广整体\
    \ AI 创建时，负责任 AI 的广泛关注点，如图 6-1 所示。这些要素概述了负责任 AI 采用的主要考虑因素，并为理解 AI 采用蓝图提供了一个有用的起点。\n\
    \n![](img/53a28dd44bbae66341b0fe693bd59916_88_0.png)\n\nFigure 6-1. Holistic view\
    \ of responsible AI\n\n要让员工接受 AI，仅靠熟练的技术团队是不够的。将 AI 引入组织可能会颠覆传统的 work 环境和职责。准备好员工在修改后的角色中运作的领导者将防止人才技能差距，加速成功采用，最重要的是，让所有员工做好准备，在开发负责任\
    \ AI 中发挥作用。AI 团队必须 *build* AI  responsibly，而终端用户必须 *use* AI responsibly。终端用户必须接受有关应用程序适当用途的培训，包括如何理解和解释输出、适当的人工监督程度以及关键风险。\n\
    \n将这些负责任 AI 的考虑因素纳入我们的 AIOps 方法，让我们现在来审视图 6-2 中的 AI 采用蓝图。该蓝图整合了本报告中详细阐述的 AIOps\
    \ 框架要素，其中 *AIOps Integration* 作为一种机制，用于将组织要求纳入设计、开发和维持企业 AI 能力。我们将在本章后面更详细地讨论\
    \ AIOps Integration 和 *Digital Architecture*，因此让我们先从 AIOps 框架中熟悉主题的概述开始：\n\n###\
    \ *Responsible AI*\n\n在第 3 章中讨论，重点是建立信任、培养文化准备度、支持 workforce 策略，并在 AI 采用过程中尽早优先考虑伦理。\n\
    \n### *Data engineering*\n\n在第 4 章中讨论，将数据视为战略资产，并有助于确保 AI 的数据就绪性，既用于训练 AI 模型，也用于扩展\
    \ AI 能力。您的团队可以利用 DataOps 来实施企业数据战略，以促进对驱动 AI 解决方案的基本数据的安全、民主化访问。\n\n### *Analytic\
    \ frameworks*\n\n利用 ML 和专门的分析方法推动 AI 能力，并通过数据驱动的洞察提供价值。该要素涉及 MLOps，以在整个生命周期中开发和管理复杂模型。\n\
    \n![](img/53a28dd44bbae66341b0fe693bd59916_91_0.png)\n\nFigure 6-2. AI Adoption\
    \ Blueprint\n\n虽然蓝图的每个要素都是一个有效的独立关注点，但在收获 AI 的全部益处之前，您必须整合这些组件。在以下各节中，我们确定将这些要素整合到您独特的解决方案中的关键第一步，从明确阐述\
    \ AI 能力的预期最终状态开始。\n\n## Establishing Clear Objectives\n\n利用 AI 采用蓝图来指导我们的提问，您可以开始确定开发目标。在解决具体的实施问题之前，至关重要的是在开始时建立明确的目标和成果。这为利益相关者更好地评估\

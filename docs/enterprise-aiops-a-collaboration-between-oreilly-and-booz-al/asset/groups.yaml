    and assist in quantifying AI’s added value. These measures will determine the
    outcomes and relative performance for each AI initiative. They can also help you
    determine or refactor priorities and adjust the approach when warranted.


    Whenever possible, organizations should standardize these metrics across AI projects
    and integrate into your AIOps development and sustainment process. This ensures
    projects are calculating metrics on a regular basis, tracking them in a central
    repository, and reporting regularly for continuous monitoring and improvement
    of AI project impact.



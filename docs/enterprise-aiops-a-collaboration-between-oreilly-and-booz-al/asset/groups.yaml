    ## 第 2 章. 定义 AIOps 框架


    现在我们已经概述了将 AI 部署从试点推向生产所面临的挑战，让我们介绍一个框架（见图 2-1），该框架将使您的组织能够克服这些挑战，并在企业规模上实现 AI
    的运营化。


    我们的 AIOps 框架将聚焦于两个主要目标：（1）发展 AI 开发流程本身，以及（2）将该开发流程整合到组织的其他部分，以实现可扩展、可持续且协调的 AI
    企业能力。在以下部分中，我们将介绍您为成功部署 AIOps 所需实施的组件和功能。图 2-1 展示了这些组件如何相互对齐和排序，以实现企业级 AIOps。


    *AIOps*


    为应对现实世界挑战并实现高影响力、持久成果而运营化 AI 的流程、策略和框架。AIOps 将负责任的 AI 开发、数据、算法和团队结合成一个集成、自动化且有文档记录的模块化解决方案，用于
    AI 的开发和维护。


    ## AIOps：标准化、可扩展、可重复的 AI/ML 工程流程


    任务工程（定义用例）


    以人为中心的负责任 AI 设计


    AI 团队


    DataOps


    MLOps


    DevSecOps


    数据工程


    机器学习工程


    系统工程


    可靠性工程


    “OPS” 的整合


    基础设施和网络安全工程


    运营反馈循环


    图 2-1. AIOps 框架


    该 AIOps 框架为您提供了将 AI 从试点推向生产的依据。它由多个关键组件组成，这些组件集成在一起，以提供满足特定用例要求的 AI 解决方案、在生产环境中运行，并能快速更新以应对不断变化的条件。我们将在整个报告中讨论这些组件。这些主要组件是：


    ### 任务工程


    组织必须定义并验证 AI 是否适用于他们希望通过部署 AI 来解决的用例。

    成功的任务工程将使组织能够负责任地将 AI 引入企业并实现真正的任务成果。我们将在第 6 章中更详细地介绍这一点。


    ### 以人为中心的负责任 AI 设计


    要运营化 AI，您需要关注负责任的 AI，以确保部署的 AI 解决方案在满足所需性能的同时，遵守组织标准和核心价值观。我们将在第 3 章中进一步讨论这个问题。


    ### 数据工程和数据运营（DataOps）


    定位所需数据并开发可重复的数据管道，以提高数据价值并使其在整个企业中可用。数据工程和管理的运营化被称为“DataOps”，它使下游管道能够从更好的数据可用性和质量中受益（例如，更准确的
    AI/ML 训练）。有关更多细节，请参阅第 4 章。


    ### ML 工程和 ML 运营（MLOps）


    使用监督学习、无监督学习、强化学习、深度学习等开发先进算法，以支持复杂的决策制定。该过程既包括科学也包括艺术，但为从数据中训练模型并维护这些模型的配置管理提供了一个结构化流程。通过
    MLOps 运营化 ML，您可以将 ML 模型部署到生产环境并对其进行维护。我们将在第 5 章中更详细地介绍这一点。


    ### 系统工程和 DevSecOps


    应用结构化框架进行集成、文档化和自动化，以在整个组织中开发、部署和监控软件和系统解决方案。开发、安全和运营（DevSecOps）整合了安全的关键组件，并专注于通过软件和系统工程运营化您将开发的应用。强大的
    DevSecOps¹ 框架对于将您的 AI 分析嵌入到现有或新的软件解决方案中是必要的。我们将在第 6 章中讨论更多内容。


    ### 可靠性工程


    组织及其团队必须为 AI 解决方案建立明确、专注且现实的目标，并以量化的明确成功衡量标准为依据。您需要一种可重复且可扩展的方法来监控 AI 部署的成功情况。我们还将在第
    6 章中提供该框架。


    ### “Ops” 的整合


    我们的 AIOps 框架将嵌入上述其他“ops”的组件（DataOps、MLOps、DevSecOps），您需要这些组件才能在企业层面成功运营化 AI。我们将在其对应的章节中讨论每个
    ops 的细节（例如，第 4 章将包含特定于 DataOps 的信息）。然后，在最后一章（第 6 章）中，我们将描述在构建 AIOps 框架时您需要从每个
    ops 中提取的具体组件。


    ### 基础设施和网络安全工程


    强大的技术架构和网络安全政策以保护您的数据和 AI 应用，对于运营化 AI 的长期成功至关重要。虽然网络安全是您 AIOps 框架的重要组成部分，但它不是本报告的重点。²
    相反，我们只是想指出，这是强大企业 AIOps 框架的基本前提。我们将在第 4 章中详细讨论基础设施的建立和选择。


    ### 运营反馈循环


    反馈和学习是您 AIOps 框架中最重要的部分之一。您的团队必须能够监控数据、模型、应用程序和流程，以评估其生命周期中是否需要更改。重要的是，您的 AIOps
    框架应允许组织各团队之间共享反馈，并使他们的工具和流程能够从此类反馈中学习和改进。我们将在第 6 章中讨论这一过程。


    ### AI 团队


    跨职能、集成的团队能够产生整体的 AI/ML 解决方案，利用个人成员的专业知识并产生一流的解决方案。有许多关键参与者将使您的组织能够有效地运营化 AI。与其单独设置一章或一节来讨论这些关键参与者，我们将在最合乎逻辑的地方介绍他们（例如，第
    4 章将介绍首席数据官）。


    ## 为什么您需要 AIOps 框架


    随着 AI 的技术壁垒不断降低，越来越多的组织正在启动 AI 试点、构建原型并尝试将其推向生产。这导致短期胜利，因为试点通过最小可行产品（MVP）显示出潜力，但长期挫败感，因为团队在尝试将这些试点推广到生产并嵌入整个企业时遇到意想不到的挑战。


    这些挑战带来了非常现实的危险，即组织陷入无休止的修复症状而非解决根本结构性问题的循环。潜在的结果是资源（资金和 goodwill）的耗尽，以及许多 AI 工作的最终失败，并非因为它们缺乏价值，而是因为组织没有计划并激励其运营化。一个这样的例子是开发
    AI 解决方案但未考虑终端用户的教育和培训需求，导致终端用户完全无法采用该解决方案。


    虽然时间会继续解决并减少 AI 的技术壁垒，但将 AI 嵌入企业并从试点转向生产所面临的挑战并不会因等待而变得更容易。相反，如果组织不开始投资建立大规模部署
    AI 的框架，他们将面临错失 AI 所带来的日益增长的益处的风险。


    企业 AI 采用工作往往脆弱、缺乏无条件的领导支持，并挑战根深蒂固的流程和利益。早期的运营挫折可能意味着长期成功与失败之间的差异，使得预防性措施至关重要。部署
    AI 大规模时您可能面临的一些挑战和决策是：


    - 确保收益与风险权衡最大的业务问题得到优先处理

    - 最小化 AI 集成活动的成本和返工

    - 最小化业务连续性风险

    - 确保 resulting AI 能力、解决方案和系统的可维护性

    - 在 AI 团队中实现人才的最优使用



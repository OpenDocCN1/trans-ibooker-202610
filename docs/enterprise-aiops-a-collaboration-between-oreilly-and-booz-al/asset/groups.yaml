    ## Machine Learning Operations (MLOps)


    Early in the history of software development, innovations in tooling, automation,
    and process optimization were focused almost exclusively on efficient delivery
    of new functionality. DevOps, and later DevSecOps, established frameworks that
    introduced similar innovations to balance functionality against priorities like
    automation, reliability, distributed development, and security.


    As reviewed in this ML section, there are many steps to the design, training,
    testing, deployment, and monitoring of ML models. In many cases, these steps are
    executed manually. However, this greatly reduces the ability to scale the model
    development process. MLOps⁷ provides a potential solution to this problem through
    integration and automation to allow for increased efficiencies in the development
    and training of ML models.


    MLOps is similar to DevSecOps, with some unique differences (e.g., use of production
    data for model training, rapid iterations of models, accounting for bias, need
    for continuous monitoring) that you must consider. Organizations today are primarily
    prioritizing the development of AI models and not the process used to develop
    those models. Through the integration of these manual processes using the rapidly
    expanding open source and commercial solutions, MLOps will allow an organization
    to scale their AI development pipelines to meet future demand and operate at the
    enterprise level.


    ## Scalable Training Infrastructure


    AI model training currently requires larger training datasets (e.g., streaming,
    IoT), an increasing number of modeling approaches (e.g., supervised, unsupervised,
    reinforcement learning), and more complex models (e.g., deep learning) composed
    of larger numbers of training parameters. With this growth, we see an increasing
    need for more robust and scalable training infrastructures. This infrastructure
    requires additional automation to evaluate the range of required models while
    collecting training results for comparisons across model versions and approaches.


    MLOps combines more traditional DevSecOps techniques like continuous build systems,
    distributed processing, and “As a Service” (AaS) infrastructure with ML-specific
    approaches like model bias, model training, hardware acceleration (e.g., distributed
    processing, GPUs), model optimization infrastructure (see next paragraph), and
    model monitoring. Through this process, models are developed more quickly and
    follow standard processes with detailed documentation of the results.


    ## Model Optimization Infrastructure


    In the early days of ML, models were typically trained individually and infrequently
    (weekly, monthly) due to hardware constraints and immature optimization techniques.


    Today, we have the operational requirements and the computational resources to
    train models more frequently (daily, hourly, continuously) and in large batches
    (10s to 100s) using scalable training infrastructures, modern optimization techniques,
    and scalable computing infrastructure. In addition, teams are increasingly deploying
    AI models to a range of edge-hosting environments. If models are to operate effectively
    in these edge environments, you must optimize them to operate on those lower capacity
    hardware configurations.


    MLOps can help developers by integrating with scalable training infrastructure
    and coordinating the accumulation, storage, and comparison of trained models.
    Additionally, centralized storage and analysis of models can provide valuable
    insights into model development over time, providing an approach to evaluate model
    and data drift. This standard process also supports optimization of trained models
    based on the target hosting environment to ensure models can effectively operate
    in production. In the longer term, these model optimization repositories may also
    play an important role in explainability considerations, given the metadata collected
    as part of this process.


    ## Model Deployment Infrastructure


    For many AI teams, deploying a completed model to operational infrastructure for
    use by its intended end user can represent a significant technical and process
    challenge. This is because AI teams often lack the in-depth software development,
    system administration, and network engineering knowledge to deploy such systems.


    AI development teams can benefit from defining standardized, automated deployment
    workflows for their ML models using standard automated deployment applications

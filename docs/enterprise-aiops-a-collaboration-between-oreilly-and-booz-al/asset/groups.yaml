    # Establishing Clear Objectives


    Using the AI Adoption Blueprint to guide our questioning, you can begin identifying
    your goals for development. Before addressing specific implementation concerns,
    it’s critical to establish clear objectives and outcomes at the onset. This lays
    the groundwork for stakeholders to better evaluate return on investment resulting
    from the AI model.


    In this section, we first define project success criteria, identifying AIOps components
    that enable individual AI projects to succeed.


    By applying hard-won experience to the overall AIOps framework, you encourage
    successful AI adoption at the enterprise level. After defining objectives and
    identifying factors that contribute to successful outcomes, you can leverage AIOps
    criteria to evaluate your AI capability and performance.


    Table 6-1 outlines 10 ideal observations that encourage successful enterprise
    AI adoption.'

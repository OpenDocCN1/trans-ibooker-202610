    \ AIOps 框架，您可以促进企业层面的 AI 成功采用。在定义目标并确定促成成功结果的因素之后，您可以利用 AIOps 标准来评估您的 AI 能力和性能。\n\
    \nTable 6-1 概述了 10 项理想观察结果，可促进企业 AI 采用的成功。\n\n## Table 6-1. Top ten leading indicators\
    \ for AI project success\n\n| Leading indicator | Ideal observation |\n|---|---|\n\
    | Data readiness | Accessible, high-quality, catalogued datasets |\n| Infrastructure\
    \ readiness | Flexible, scalable, secure environments and tools |\n| Organizational\
    \ readiness | Forward-leaning, transparent, well-led organization |\n| Analytic\
    \ technique | Literature- and experience-backed processes and methods |\n| Leadership\
    \ and stakeholder buy-in | Executive sponsorship, end-user buy-in and adoption\
    \ |\n| Clearly defined business problem | Well-defined scope and ROI value proposition\
    \ |\n| Project team expertise | Expert, diverse team blending tech and nontech\
    \ skills |\n| Project team cohesion | Consistent, united, committed project team\
    \ |\n| Agile project management | Iterative, feedback-centric management approach\
    \ |\n| Informed project schedule | Ambitious but practical schedule |\n\n突出一些关键考虑因素的详细说明：\n\
    \n### Data\n\n通常是给定项目成功或失败的头号决定因素。许多组织在捕获、组织和提供用于驱动决策的最重要数据方面遇到困难。拥有正式数据战略的组织成功率更高。\n\
    \n### Infrastructure readiness\n\n也是成功的强有力促成因素，使已标准化并投资于分析飞地和平台的组织在运营化 AI 时具有优势。\n\

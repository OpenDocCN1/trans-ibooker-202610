    # Operational Components


    AI capabilities are designed (and expected) to deliver value when deployed to
    support business processes. Doing so means teams must integrate AI capabilities
    into systems that historically support business processes. Given the exponential
    rise in system complexity, scaling and sustaining AI requires a holistic view
    of processes and dependencies—and a structured engineering approach—to translate
    a portfolio of AI models into deployed operational capabilities. Figure 6-4 defines
    this view as the core components you should include and integrate across your
    organization to enable successful AI deployments.'

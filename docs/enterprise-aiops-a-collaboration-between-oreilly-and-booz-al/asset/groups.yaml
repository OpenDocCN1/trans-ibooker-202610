    significant training, the models were able to outperform expert human players
    at these games.


    The primary issue with reinforcement learning is that not all use cases allow
    for good reward functions, and reward functions may be more difficult to explain
    than training data for a given use case. Despite its more obscure processing,
    reinforcement learning provides spectacular results when employed in use cases
    that provide appropriate and measurable reward functions, such as with robotics
    and video games. Another benefit of reinforcement learning is that it can produce
    structured training data to support model development for applications where training
    data does not currently exist.


    *Neural networks* are an ML implementation that uses layered network architectures
    (i.e., neurons and weights) to perform a specific function, passing inputs through
    the network’s layers to calculate an output of interest. While neural networks
    also leverage statistical methods to evaluate a given input, they are unique in
    that their inner processes are largely nonlinear abstractions of conventional
    calculations. A neural network contains a collection of parameters, known as weights
    and biases, trained to optimize its outputs based on a given criteria. While neural
    networks continue to grow in complexity and layers of abstraction, in every instance
    the network’s architecture determines its function.


    On their own, neural networks do not specify the method used to train them. They
    are capable of following the supervised, unsupervised, and reinforcement learning
    paradigms interchangeably.


    For example, the *convolutional neural network* in Figure 5-5 can ingest machine-readable
    images, training the algorithm to assess latent patterns and relationships among
    encoded pixels, and then classify the image with a given degree of certainty.'

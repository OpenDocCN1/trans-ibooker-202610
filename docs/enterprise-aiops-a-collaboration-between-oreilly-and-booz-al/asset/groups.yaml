    ## ML Advanced Topics


    在讨论了传统的 ML 建模方法及其注意事项之后，我们应该暂停一下，审视新兴的前沿领域。这些专业应用利用复杂的算法，结合并进一步抽象 ML 方法。以下每种方法都使更成熟的
    AI 能力成为可能。然而，与所有技术一样，我们建议您在考虑可解释性和可说明性的更广泛影响时谨慎选择。由于这些技术内部的复杂架构，我们通常无法“打开这些模型的黑箱”，这迫使我们在开发和生产环境中验证其可靠性。³


    在过去几十年中，ML 领域最具影响力的发展之一是深度学习，这是一组利用多层“深度”神经网络执行高度专业化任务的方法。用例包括图像分类、机器翻译和语音识别。实际上，深度学习利用多种
    ML 方法论（例如，应用无监督方法转换数据作为神经网络的输入）来设计特征并提高模型性能。这些复杂模型通过利用大量数据来训练和优化深度神经网络的参数来实现 AI，其特定架构能够实现超过人类能力的性能。与任何
    ML 方法一样，算法的底层结构决定了其专业任务的功能优势，这凸显了考虑复杂深度学习模型负责任的实现、资源需求和可解释性的必要性。


    自然语言处理是一个包含手动方法和 AI 应用于分析自然语言数据的广泛领域。使机器能够解析文本数据是自然语言处理的关键组成部分，如果没有它，我们就无法摄取训练模型所需的数据。传统上，挑战根植于人类语言的主观性以及实现语义泛化的难度，特别是在处理行话或在结构差异较大的语言之间进行翻译时。⁴



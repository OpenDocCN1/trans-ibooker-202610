    positioned to rapidly move to operationalizing AI at the enterprise level. They
    can become an organization that rapidly develops and improves their AI solutions
    in alignment with responsible AI principles and organizational vision and goals.
    Those resulting solutions can enable organizations to realize the expected potential
    of AI—a transformational capability spanning industries—and begin to see a true,
    quantitative return on their investment.'

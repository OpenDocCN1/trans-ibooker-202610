    # Accuracy


    The degree to which data correctly describes the “real world” object or event
    being described.


    # Usability


    A measure of how reliable the data is. Data that is messy, is missing substantial
    records, is difficult to ingest, or is otherwise prohibitive would be less usable.


    # Provenance


    Provenance of a resource is a record that describes entities and processes involved
    in producing and delivering or otherwise influencing that resource. Provenance
    provides a critical foundation for assessing authenticity, enabling trust, and
    allowing reproducibility. Provenance assertions are a form of contextual metadata
    and can themselves become important records with their own provenance.


    # Security


    How safe the data is from loss or unwanted manipulation.


    Managing data as an asset can help your organization address these challenges
    and support AI needs through a multilayered approach to data readiness. A holistic
    approach will help drive data readiness across all dimensions of data as follows:


    +   - A data strategy aligns data capabilities with AI needs and establishes effective
    data management and data usage practices tailored to AI needs.

    +   - DataOps processes optimize workflows for automated data ingest, processing,
    and storage to help keep up with data needs at scale.'

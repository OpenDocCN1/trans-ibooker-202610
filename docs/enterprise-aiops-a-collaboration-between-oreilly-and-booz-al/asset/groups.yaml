    理解这些技术还能让我们在将模型投入生产环境时，考虑模型的泛化能力（即将每个模型应用于不熟悉的数据集的能力），并更好地监控和改进整体设计选择。


    *监督学习*或许是 ML 最常被讨论的例子。通过这种技术，算法用于分析数值或标记数据（例如，输入-输出对、带标签的图像或其他紧密关联的信息）。常见应用包括用于预测连续数值（如股票价格）的回归模型，以及用于从运营数据特征中预测类别（如文件是否恶意）标签的分类模型。


    监督 ML 将数据拆分为输入（称为“特征”）和输出（分类中称为“标签”，回归中称为“目标”），并尝试从前者预测后者。监督学习的关键优势在于，它使我们能够将分析模型聚焦于特定任务，以获得高准确性、精确度和召回率。²
    这使得监督学习成为大多数运营用例中最实用的技术。


    ## Accuracy


    机器学习模型产生精确结果与近似结果的能力。它衡量模型在正确预测所有真正例和真负例方面接近的程度。


    ## Precision


    对机器学习模型置信度的衡量。精确度是通过将真正例的总数除以（真正例 + 假正例）来计算的。换句话说，对于模型预测为“阳性”的所有数据，其中有多少比例实际上是阳性的？


    ## Recall


    对机器学习模型分类性能的衡量。召回率（也称为灵敏度或“真正例率”）是通过将真正例的总数除以（真正例 + 假负例）来计算的。换句话说，对于所有实际为阳性的观测值，模型正确预测为“阳性”的比例是多少？


    监督学习的运营成功推动了对可解释性和可持续性的额外研究和开发，目前远超其他 ML 技术。监督学习与其他 ML 方法之间的关键区别在于通过训练其权重（即学习参数）的过程来优化模型，如图
    5-2 所示。


    ![](img/53a28dd44bbae66341b0fe693bd59916_63_0.png)


    Figure 5-2. Supervised ML process


    在监督学习中，标记的输入数据被输入到算法中以训练模型，其中它通过与指定标准进行测试来完善算法的“加权”。用于完善模型的过程植根于统计交叉验证，其中数据被划分为两个随机子集——一个用于训练模型，另一个用于测试其性能。虽然具体细节会迅速变得极其技术化，但要点是：训练充分后，我们可以通过重新设计训练数据特征并在必要时重新训练模型，同时在
    ML 生命周期中监控其行为，来完善和改进已部署的模型。


    第二种 ML 技术，无监督学习，直接从数据中存在的模式训练模型，而不是其他类型 ML 中发现的输入-输出方法。无监督算法的关键优势在于其发现开发人员事先不知道的模式的能力，为探索提供了新的途径。这种方法的缺点是，这些算法通常在生产数据中发现大量模式，除了抽象的数据拟合元数据外，没有集中化的方式来判断哪些模式对特定用例有价值。此外，与监督模型相比，无监督学习方法本质上更难解释，因为它们通常利用缺乏指定分类或特征之间输入-输出关系的训练数据。这种高层级过程如图
    5-3 所示。


    ![](img/53a28dd44bbae66341b0fe693bd59916_64_0.png)


    Figure 5-3. Unsupervised ML process


    虽然无监督学习技术肯定被用作建模的独立方法（例如，异常检测和数据聚类），但我们经常将这些技术与监督流程结合使用，以简化问题空间或通过探索性分析获得对数据的额外洞察。


    第三种技术是强化学习，它提供了一种在指定环境中训练模型的新方法。虽然与监督学习有相似之处（例如，围绕相关惩罚或奖励指标进行优化），但强化学习对模型完善采取了不同的方法。诸如
    Q-learning 之类的方法允许所谓的“智能体”（即软件机器人）直接与其环境（物理、虚拟或两者兼有）交互，以完善其行为，目标是迭代实现指定目标。底层算法包括支持向量机（SVM）和神经网络（在本节后面定义），


    生成一个模型来指导智能体的行为，并随着在环境中经验的增加而持续更新。


    此外，该技术被认为比纯无监督方法更具可解释性。在强化学习过程中，我们逐步将训练数据输入模型，产生由奖励函数评估的结果，然后以奖励函数结果的形式向模型提供反馈，并将其与后续训练数据结合以持续完善模型参数。


    如图 5-4 所示，强化学习过程始于用户设定目标，这些目标成为 ML 算法的主要目标。当我们初始化此过程时，智能体对实验规则一无所知，需要多次训练运行后才能提高其性能。随着智能体的模型基于环境中的奖励反馈持续更新，它不断完善其性能，从以前成功的方案中学习，同时淡化不太有用的策略。这种方法最初通过应用于国际象棋、AlphaGo
    和星际争霸等游戏而声名鹊起，在执行大量训练后，模型能够在这些游戏中超越专家人类玩家。


    ![](img/53a28dd44bbae66341b0fe693bd59916_66_0.png)


    Figure 5-4. Reinforcement ML process


    如图 5-4 所示，强化学习过程始于用户设定目标，这些目标成为 ML 算法的首要目标。当我们初始化此过程时，智能体对游戏规则完全不知情，需要多次训练运行后才能提高其性能。随着智能体的模型基于环境中的奖励反馈持续更新，它不断完善其性能，从以前成功的方案中学习，同时淡化不太有用的策略。这种方法最初通过应用于国际象棋、AlphaGo
    和星际争霸等游戏而声名鹊起，在执行


    大量训练后，模型能够在这些游戏中超越专家人类玩家。


    强化学习的主要问题是，并非所有用例都允许良好的奖励函数，而且奖励函数可能比给定用例的训练数据更难解释。尽管其处理过程更为晦涩，强化学习在提供适当且可衡量的奖励函数的用例中提供了惊人的结果，例如机器人技术和电子游戏。强化学习的另一个好处是，它可以产生结构化训练数据，以支持在目前尚无训练数据的应用中进行模型开发。


    *神经网络*是一种 ML 实现，使用分层网络架构（即神经元和权重）执行特定功能，将输入通过网络的层传递以计算感兴趣的输出。虽然神经网络也利用统计方法来评估给定输入，但它们是独特的，因为其内部过程在很大程度上是对传统计算的非线性抽象。神经网络包含一组参数，称为权重和偏置，通过给定标准训练以优化其输出。虽然神经网络在复杂性和抽象层面上不断增长，但在每种情况下，网络的架构决定了其功能。


    神经网络本身并不指定用于训练它们的方法。它们能够交替遵循监督、无监督和强化学习范式。


    例如，图 5-5 中的 *卷积神经网络* 可以摄取机器可读图像，训练算法评估编码像素之间的潜在模式和关系，然后以给定程度的确定性对图像进行分类。



    # Removing Sleeves from Woven Garments


    ![DK](Images/Page_105_01.png)


    1. Using a seam ripper, carefully unpick the stitching that attaches the sleeves.
    If the garment is lined, unpick the stitching that attaches the sleeve lining
    as well. Remove any loose threads or broken stitches from around the armholes.


    ![DK](Images/Page_105_02.png)


    2. If the garment is lined, pin the outer and lining together around the armholes
    with pins placed parallel to the new raw edge, about ⅝in (1.5 cm) away from the
    original stitching line. Then, you''ll be able to treat both layers as one in
    the following steps.


    ![DK](Images/Page_106_01.png)


    3. The former stitching line around the armhole will still be visible thanks to
    the perforations in the fabric. Trim the seam allowance around the armholes so
    only ¼in (7 mm) remains between the raw edge and the former stitching line.


    ![DK](Images/Page_106_02.png)


    4. Holding the bias tape face down, open up the top fold and align the outer edge
    with the raw edge at the bottom of the armhole. Leave the first ¾in (2 cm) of
    the bias tape loose, extending beyond the side seam. Place a pin through all layers,
    perpendicular to the edges.


    ![DK](Images/Page_106_03.png)


    5. Continue to align the outer edge of the bias tape with the raw edge of the
    armhole all the way around, keeping the bias tape flat and avoiding tucks or pleats.
    Pin as you go. When the bias tape reaches the starting point, cut off the remainder
    leaving ¾in (2 cm) loose at the end, extending beyond the side seam.


    ![DK](Images/Page_107_01.png)


    6. Thread a needle with a length of sewing thread no longer than 18 in (45 cm).
    Tie a knot at one end of the single strand of thread. Using small, neat, running
    stitches, stitch the bias tape to the garment all around the armhole. Use the
    crease in the bias tape as your guide. Remove the pins.


    ![DK](Images/Page_107_02.png)


    7. Open up the other fold of the bias tape and carefully press it flat. Position
    the loose ends of bias tape right-sides facing, and using small, neat running
    stitches, stitch them together across their width. Trim the excess bias tape ¼in
    (7 mm) away from the line of stitching.


    ![DK](Images/Page_107_03.png)


    8. Turn the garment inside out. Flip the bias tape to the inside. If your garment
    fabric can withstand heat, carefully press the edge of the armhole curve to set
    the crease. A little steam will help the bias tape mold around the curve.


    ![DK](Images/Page_108_01.png)


    9. Open the bias tape up so the running stitches are visible. Bring the outer
    raw edge of the bias tape to meet the stitching. Then, fold the bias tape back
    down into position with the right side facing up, and carefully press to set the
    new fold.


    ![DK](Images/Page_108_02.png)


    10. Continuing to work from the wrong side of the garment, place pins diagonally
    through all layers to keep the bias tape in place. Position the pins at regular
    intervals around the armhole.


    ![DK](Images/Page_108_03.png)


    11. Rethread the needle following [step 6](#104-109_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0282).
    Starting at the bottom of the armhole, push the needle down through all layers
    close to the bias tape''s folded edge and pull through from below, so that the
    knot is on the inside of the garment.


    ![DK](Images/Page_108_04.png)


    12. Make small, neat running stitches close to the folded lower edge of the bias
    tape to keep it permanently in position. Remove the pins, give the binding a final
    press, and turn the garment right side out.


    g [WEAR YOUR CLOTHES](#078-079_Mend_it_Wear_It_Love_It.xhtml#part3) g [CONTENTS](#contents.xhtml)


    # For Knit/Jersey Garments


    If you want to remove sleeves from a T-shirt or jersey garment, use this simpler
    method. Because the raw edges of knit fabrics rarely fray, there''s no need for
    bias tape.


    ![DK](Images/Page_109_01.png)


    1. Knit garments are more difficult to unpick than woven garments due to the risk
    of stretching the fabric. Carefully cut the sleeves off instead, cutting away
    the seam allowances as well as the sleeves.


    ![DK](Images/Page_109_02.png)


    2. Handle the raw edges with care until the armhole has been stitched. Turn the
    garment inside out. Carefully fold the raw edge back ⅜in (1 cm) to the inside.
    Pin in place around the edge of the armhole.


    ![DK](Images/Page_109_03.png)


    3. Thread a needle with no more than 18 in (45 cm) of thread and tie a knot at
    one end. Starting at the bottom of the armhole, push the needle down through both
    layers about ¼in (7 mm) from the inner folded edge of the armhole.


    ![DK](Images/Page_109_04.png)


    4. Making small, neat running stitches, continue to stitch around the armhole.
    Keep the stitching quite loose (to allow for some stretch when dressing and undressing).
    Remove the pins as you go. Press the armholes and turn the item right side out.


    g [WEAR YOUR CLOTHES](#078-079_Mend_it_Wear_It_Love_It.xhtml#part3) g [CONTENTS](#contents.xhtml)


    # Adding Elastic to Hems and Cuffs


    Another way to modify a garment''s silhouette is to transform the volume of full
    sleeves and wide trouser legs with some clever elastic.


    ## Materials


    | **You will need** | | **Super-speedy method:** seam ripper, tape measure, 39
    in (1 m) elastic, scissors/thread snips, 2 large safety pins, hand-sewing needle,
    color-matched thread |

    | --- | --- | --- |

    | | | **Creating a channel:** pins, tape measure, fabric-marking tool, 39 in (1
    m) elastic, fabric scissors, iron, ironing board, scissors/thread snips, hand-sewing
    needle, color-matched thread, 2 large safety pins |


    ## Sewing Machine Option


    Use a straight stitch where a running stitch is indicated in [step 5](#110-113_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0308).


    ## Top Tip


    > This technique is best applied to garments made from light- and medium-weight
    fabrics, and is suitable for both wovens and knits.


    g [WEAR YOUR CLOTHES](#078-079_Mend_it_Wear_It_Love_It.xhtml#part3) g [CONTENTS](#contents.xhtml)


    # Super-Speedy Method


    If you want to keep the length, and the measurement between the very bottom edge
    of the cuff and the hem stitching is at least ½in (1cm) or so, then opt for this
    swift method.


    ![DK](Images/Page_111_01.png)


    1. With the garment inside out, find the section of hem where the sleeve or inside
    leg seam are visible. Carefully unpick the seam stitching between the bottom folded
    edge and the hem stitching.


    ![DK](Images/Page_111_02.png)


    2. Measure the distance between the bottom folded edge and the hem stitching.
    Select elastic that is slightly narrower than this, cut off a generous piece,
    overlap the ends, and secure with a safety pin.


    ![DK](Images/Page_111_03.png)


    3. Try the elastic at the position where the garment hem will sit. Adjust the
    loop until it feels snug but not uncomfortable. Allowing ¾in (2 cm) for the ends
    to overlap, cut two pieces of elastic the correct length.


    ![DK](Images/Page_111_04.png)


    4. Affix a safety pin to one end of the elastic and attach to the inner edge of
    the hem. Securing the elastic will prevent it from getting lost inside. Put the
    second safety pin through the other end.


    ![DK](Images/Page_112_01.png)


    5. Insert the free safety-pinned end into the hole in the seam. Feed it through
    the channel until it emerges, checking that it hasn''t twisted. Pull the ends
    away from the item and remove both safety pins. Overlap the ends by ¾in (2 cm)
    and repin.


    ![DK](Images/Page_112_02.png)


    6. Feed the elastic back into the channel. Try the garment on to check that the
    elastic feels right. Then, secure by stitching up and down through both layers
    of elastic at the overlap. Close up the hole at the hem using a ladder stitch
    (see [Repair from the top](#060-065_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0148)).


    g [WEAR YOUR CLOTHES](#078-079_Mend_it_Wear_It_Love_It.xhtml#part3) g [CONTENTS](#contents.xhtml)


    # Creating a Channel


    If you want to shorten the length as well as elasticizing the hem, you''ll need
    a new channel. If the original hems are too narrow, follow this method but omit
    steps 1 and 3.


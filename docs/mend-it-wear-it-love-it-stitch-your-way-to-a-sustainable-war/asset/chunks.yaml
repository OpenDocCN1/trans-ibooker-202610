    # Making a garment larger


    *“It''s just a bit small”* is a common reason not to wear an item. While we can''t
    magically make an item bigger, we can insert a strip into side and sleeve seams
    to size-up a top or dress.


    ## You will need

    - Seam ripper

    - Tape measure

    - Fabric-marking tool

    - Insert fabric (match to garment fabric type)

    - Fabric scissors

    - Iron

    - Ironing board

    - Hand-sewing needle

    - Thread (match color to the garment)

    - Scissors/thread snips

    - Pins


    ## Sewing machine?

    - **For hemming (step 4):** For woven fabrics, use a straight stitch; for knits,
    use a three-step or wide zigzag stitch.

    - **For attaching the insert (step 6):** For woven fabrics, use a straight stitch;
    for knit fabrics, use a narrow zigzag, which will allow the seam to stretch a
    little.


    ![DK](Images/Page_102_01.png)


    **1** Carefully unpick the side seams and sleeve seams of the garment. If the
    garment is sleeveless and has an armhole facing, unpick the side seam of the facing,
    too, then treat the outer and facing layers as one in the following steps.


    ![DK](Images/Page_102_02.png)


    **2** Measure the length of the seam from sleeve hem (or armhole) to the garment
    hem. Add 1⅝ in (4 cm) to this figure to find the length of the insert. Gauge how
    wide you''d like the insert to be and add double the garment''s original seam
    allowance.


    ![DK](Images/Page_103_01.png)


    **3** Using a fabric-marking tool, mark this rectangle out on your insert fabric
    and cut it out. It may be necessary to make a join with running stitches if the
    rectangle length measurement is particularly long.


    ![DK](Images/Page_103_02.png)


    **4** Turn the short ends back by ⅜ in (1 cm), press, then turn again by ⅜ in
    (1 cm) and press. Thread a needle with 12 in (30 cm) of thread and tie a knot
    in one end. Make small running stitches close to the hem at both short ends.


    ![DK](Images/Page_103_03.png)


    **5** With right sides together, position the insert along one of the side seams
    (and sleeve seam, as necessary), aligning the raw edges. Match the insert''s hems
    with the garment''s hem and sleeve hem or underarm. Insert pins at regular intervals.


    ![DK](Images/Page_103_04.png)


    **6** Thread a needle with 18 in (45 cm) of thread and tie a knot in one end.
    With the garment fabric wrong side up, make small, neat running stitches to attach
    the insert. Pin the other edge of the insert as for step 5; repeat to sew the
    other side.


    [WEAR YOUR CLOTHES](#078-079_Mend_it_Wear_It_Love_It.xhtml#part3) | [CONTENTS](#contents.xhtml)


    ---


    # Removing sleeves


    Fitting techniques are excellent for streamlining the silhouette of a garment
    that used to be too big. But how do we approach a garment that is too small? If
    tight sleeves are the issue, a simple option is to remove them completely.


    ## You will need


    ### For woven garments

    - Seam ripper

    - Scissors/thread snips

    - Pins

    - Tape measure

    - 39 in (1 m) bias tape

    - Fabric scissors

    - Hand-sewing needle

    - Color-matched thread

    - Iron

    - Ironing board


    ### For knit/jersey garments

    - Fabric scissors

    - Pins

    - Tape measure

    - Scissors/thread snips

    - Hand-sewing needle

    - Color-matched thread

    - Iron

    - Ironing board


    ## Sewing machine?

    - Use a straight stitch where a running stitch is indicated in [steps 6](#104-109_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0282),
    [7](#104-109_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0283), and [12](#104-109_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0288).

    - Use a three-step zigzag stitch in [step 4](#104-109_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0293).


    ## Top Tip

    > The success of this technique relies on being able to envision whether the garment
    will look good without sleeves! New armholes will follow the line of the current
    sleeve seam.


    [WEAR YOUR CLOTHES](#078-079_Mend_it_Wear_It_Love_It.xhtml#part3) | [CONTENTS](#contents.xhtml)


    ---


    # For woven garments


    Raw edges of woven fabric are liable to fray, so this method employs bias tape
    to stabilize and conceal the raw edge. The binding is positioned on the inside
    of the garment, with only a row of small, neat stitches visible from the outside.


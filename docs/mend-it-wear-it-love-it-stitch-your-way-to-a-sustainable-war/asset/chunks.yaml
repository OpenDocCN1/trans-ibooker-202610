    \ hem](#084-087_Mend_it_Wear_It_Love_It.xhtml)\n\n*   [Adding a contrast band](#084-087_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0218)\n\
    \n*   [Creating a ruffle](#084-087_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0225)\n\
    \n[**Inspiration:** Contrast bands, trims, and ruffles](#088-089_Mend_it_Wear_It_Love_It.xhtml)\n\
    \n[Adding a simple patch pocket](#090-093_Mend_it_Wear_It_Love_It.xhtml)\n\n[**Inspiration:**\

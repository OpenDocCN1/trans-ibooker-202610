- raw: "Do note that you don’t have to stick to one reworking per garment. Got a slightly\
    \ plain shirt dress? Why not add some waist-shaping darts and swap all the buttons\
    \ for something more fun? Got an overly loose tunic top that seems to drown you?\
    \ What about adding elastic at the cuffs and refitting it at the side seams? Got\
    \ a practical jacket in your favorite color but the sleeves are a tad tight? You\
    \ could turn it into a vest by removing the sleeves. Oh, and while you’re there,\
    \ you could add a pocket that will actually fit your hand.\n\nA wardrobe that\
    \ feels more “you”\n\nDeploying a few clever fixes and techniques can make any\
    \ garment feel more “you.” The evolution of a garment needn’t stop where the designers\
    \ and garment workers left off. With these ideas and techniques under your belt,\
    \ you are free to customize and personalize your clothing to fit your shape, style,\
    \ and requirements.\n\ng [WEAR YOUR CLOTHES](#078-079_Mend_it_Wear_It_Love_It.xhtml#part3)\
    \ g [CONTENTS](#contents.xhtml)\n\n# Shortening a hem\n\nIt’s no surprise that\
    \ an off-the-rack garment’s hem length won’t always be exactly right. Shortening\
    \ hems is an easy task; sometimes, an adjustment of just ¾in (2 cm) can make all\
    \ the difference.\n\n| **You will need** || pins, tape measure, fabric-marking\
    \ tool, fabric scissors, iron, hand-sewing needle, color-matched thread, scissors/thread\
    \ snips |\n\n| --- | --- |\n\n| **Sewing machine?** || For hemming in step 6:\
    \ for visible hems on a woven garment, use a straight stitch; for hems on knit/jersey\
    \ garments, use a three-step zigzag |\n\nTop Tip\n\nMore dramatic transformations\
    \ are also possible—turning long sleeves into short sleeves, jeans into shorts,\
    \ or a dress into a top.\n\n![DK](Images/Page_082_02.png)\n\n**1** Try the garment\
    \ on in front of a mirror and put on suitable footwear. Turn up a section of the\
    \ hem to the desired length and roughly pin in place. Stand up to assess the new\
    \ length; adjust if necessary.\n\n![DK](Images/Page_082_03.png)\n\n**2** Lay the\
    \ garment right-side facing out on a flat surface. Based on the section you pinned,\
    \ place a new pin horizontally to indicate what will be the bottom of the new\
    \ finished length. Remove any other pins.\n\n![DK](Images/Page_083_01.png)\n\n\
    **3** Mark horizontally on the fabric below the pin what you’ll need for a hem\
    \ allowance. Add 1⅝in (4 cm) for woven fabrics to hide the raw edge; add only\
    \ ¾ in (2 cm) for knit/jersey as they don’t fray.\n\n![DK](Images/Page_083_02.png)\n\
    \n**4** Measure from the original hemline to the new mark. Measure up this amount\
    \ from the bottom edge all around the hem, making horizontal marks on the fabric\
    \ every 2 in (5 cm). Cut off the excess fabric.\n\n![DK](Images/Page_083_03.png)\n\
    \n**5** Turn the garment inside out. Turn up the bottom edge by ¾ in (2 cm), press,\
    \ then pin. If the garment is woven, turn another ¾ in (2 cm) to hide the raw\
    \ edge within the folded hem, and press again.\n\n![DK](Images/Page_083_04.png)\n\
    \n**6** For woven fabrics, slip stitch as for an [invisible hem](#036-039_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0073);\
    \ for a visible hem, use running stitch (see [Basic sashiko-style stitching](#040-043_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0095)).\
    \ For a knit/jersey item, use a loose running stitch to allow stretching. Press\
    \ the bottom edge.\n\ng [WEAR YOUR CLOTHES](#078-079_Mend_it_Wear_It_Love_It.xhtml#part3)\
    \ g [CONTENTS](#contents.xhtml)\n\n# Lengthening a hem\n\nSadly, we can’t wave\
    \ a magic wand to make a hem that feels too short grow longer. But we can attach\
    \ a contrasting band of fabric to add length and create a cool design feature\
    \ at the same time.\n\n| **You will need** || **Adding a contrast band:** tape\
    \ measure, seam ripper, fabric-marking tool, fabric for contrast band, fabric\
    \ scissors, pins, iron, ironing board, hand-sewing needle, thread (match color\
    \ to the contrast fabric), scissors/thread snips  \n\n**Creating a ruffle:** tape\
    \ measure, seam ripper, fabric-marking tool, fabric scissors, fabric for ruffle,\
    \ pins, hand-sewing needle, thread (match color to the contrast fabric), iron,\
    \ ironing board, scissors/thread snips |\n\n| --- | --- |\n\n| **Sewing machine?**\
    \ || For hemming in [steps 3](#084-087_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0228)\
    \ and [4](#084-087_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0229): for visible hems\
    \ on a woven garment, use a straight stitch; for hems on knit/jersey garments,\
    \ use a three-step zigzag. For attaching the band or ruffle in [steps 6](#084-087_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0231),\
    \ use a straight stitch instead of a running stitch |\n\ng [WEAR YOUR CLOTHES](#078-079_Mend_it_Wear_It_Love_It.xhtml#part3)\
    \ g [CONTENTS](#contents.xhtml)\n\n# Adding a contrast band\n\nThis method suits\
    \ straight and A-line-shaped garments made from fabric that doesn’t have much\
    \ drape. Match the fabric for lengthening to the type and thickness of the garment.\n\
    \n![DK](Images/Page_085_01.png)\n\n**1** Try the item on and work out how much\
    \ extra length you want. Measure around its bottom edge (circumference), unpick\
    \ the original hem, and mark ⅜in (1 cm) below its bottom edge. Cut the fabric\
    \ on this line.\n\n![DK](Images/Page_085_02.png)\n\n**2** Mark out a rectangle\
    \ where the long sides match the item’s circumference plus a ¾in (2 cm) seam allowance.\
    \ If the contrast fabric is not wide enough, then join two rectangles of equal\
    \ length.\n\n![DK](Images/Page_085_03.png)\n\n**3** The depth of the rectangle\
    \ is your extra length plus ⅜in (1 cm) seam allowance for the top edge, plus a\
    \ hem allowance along the bottom edge (1⅝in/4 cm for woven fabric; ¾in/2 cm for\
    \ knit/jersey). Cut out.\n\n![DK](Images/Page_085_04.png)\n\n**4** Lay the short\
    \ ends of the rectangle on top of each other, with right sides facing, and pin.\
    \ Sew the ends together using a running stitch ⅜in (1 cm) from the edge. Remove\
    \ the pins and press the seam open. Follow [steps 5](#082-083_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0215)\
    \ and [6](#082-083_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0216) to finish the bottom\
    \ edge.\n\n![DK](Images/Page_086_01.png)\n\n**5** With the item upside down and\
    \ the contrast band inside out, slip the contrast band over the garment. Align\
    \ the side seams of the band with those of your garment. Pin to keep sections\
    \ together.\n\n![DK](Images/Page_086_02.png)\n\n**6** Join the garment and band\
    \ with a row of running stitches ⅜in (1 cm) from the edge. Flip the contrast band\
    \ down into position, then press the seam allowances at the join toward the garment\
    \ on the inside.\n\ng [WEAR YOUR CLOTHES](#078-079_Mend_it_Wear_It_Love_It.xhtml#part3)\
    \ g [CONTENTS](#contents.xhtml)\n\n# Creating a ruffle\n\nA romantic ruffle works\
    \ equally well on straight or flared garments in light- to medium-weight fabrics.\n\
    \n![DK](Images/Page_086_03.png)\n\n**1** Follow [step 1](#084-087_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0219)\
    \ on to measure and prepare your garment for lengthening. If the original hem\
    \ is less than ⅜in (1 cm) deep, there is no need to unpick. Note: a ruffle will\
    \ require more fabric than a band.\n\n![DK](Images/Page_086_04.png)\n\n**2** Mark\
    \ the rectangle for the ruffle. The long sides need to be 1½–2 times the circumference\
    \ of your garment’s hem, depending on how full a ruffle you’d like. Follow [step\
    \ 3](#084-087_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0221) for its depth.\n\n![DK](Images/Page_087_01.png)\n\
    \n**3** If the fabric isn’t wide enough, divide the width into two equal rectangles.\
    \ Follow [step 4](#084-087_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0222) to stitch\
    \ the short ends together and press the seams open. Turn up a hem to finish the\
    \ ruffle’s bottom edge.\n\n![DK](Images/Page_087_02.png)\n\n**4** Stitch two rows\
    \ of long running stitches, the first ½in (1.3 cm) from the top edge, the other\
    \ at ¼in (7 mm); leave long tails of thread at each end. Take a pair of tails\
    \ and double knot them together.\n\n![DK](Images/Page_087_03.png)\n\n**5** Hold\
    \ one set of knotted-together tails tightly with one hand. With the other hand,\
    \ gently ease the fabric along the threads, away from the tails. Continue until\
    \ the gathered edge of the ruffle matches the circumference of your garment."

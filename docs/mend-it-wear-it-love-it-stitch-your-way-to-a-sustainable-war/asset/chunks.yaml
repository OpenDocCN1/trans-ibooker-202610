- raw: "Select a straight stitch and sew a few rows, then take the fabric off the\
    \ machine and have a look. Check to see if the stitch looks even on both sides\
    \ of the fabric. If there is a mess of loops or the stitches on one side look\
    \ much looser or tighter than on the other side, carefully rethread the machine\
    \ and reinsert the bobbin. It could be that you missed a key threading point.\n\
    \nA MIXED PACK OF NEEDLES\n\n![DK](Images/Page_027_02.png)\n\nINSERT THE NEEDLE\
    \ CORRECTLY\n\n![DK](Images/Page_027_03.png)\n\nIS THE TENSION RIGHT?\n\n![DK](Images/Page_028_01.png)\n\
    \nTip 4: Give the machine some TLC\n\nIf you have followed the manual and/or relevant\
    \ tutorials, and the other tips listed here, but the machine refuses to function\
    \ properly, it may well be time to bring in a professional. Sewing machines, particularly\
    \ older ones, require occasional maintenance to stay in good working order. And\
    \ even newer models that have been left unused or have suffered a mishap might\
    \ need some TLC from a servicing and repairs person.\n\nTip 5: Learn the basic\
    \ stitches\n\nWhen the machine is stitching nicely, you can then select the most\
    \ suitable stitch for your repair. Recommended stitch types are specified on each\
    \ repair technique page, but the most useful stitches to have in your arsenal\
    \ are straight stitch, zigzag stitch, and three-step zigzag stitch. All but the\
    \ most basic of sewing machine models should allow you to adjust the length and\
    \ width of the different stitches, should you need to. Always test your selected\
    \ stitch and any adjustments you make on a scrap of fabric before starting your\
    \ repair.\n\nTHE THREE BASIC STITCHES\n\n![DK](Images/Page_028_02.png)\n\nTip\
    \ 6: Find the reverse function\n\nAlways use the reverse stitch (backstitch) at\
    \ the beginning and end of every row you sew to secure the thread, otherwise your\
    \ repair is likely to come undone.\n\nTop Tip\n\nTo help thread the needle, trim\
    \ the thread at an angle and hold it close to the end to guide it through the\
    \ eye.\n\ng [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2)\
    \ g [CONTENTS](#contents.xhtml)\n\n# Sewing on a button\n\n*“I can’t even sew\
    \ a button on!*” is a popular claim that often follows any mention of sewing or\
    \ garment care. Yet sewing a button back on is the ground zero of garment repair.\
    \ Literally five minutes’ effort can prevent an item from falling into permanent\
    \ disuse.\n\n| **You will need** || hand-sewing needle, thread, same-size buttons,\
    \ scissors/thread snips |\n\n| --- | --- |\n\n![DK](Images/Page_030_02.png)\n\n\
    Top Tip\n\nBefore you begin, remove any remains of thread that may still be attached\
    \ to the button or on the garment where the button used to be attached.\n\n![DK](Images/Page_030_03.png)\n\
    \n**1** Thread a sewing needle with a strand of thread about 20 in (50 cm) long.\
    \ Hold together both ends of the thread and tie a knot. Tie a second knot over\
    \ the top of the first to make it bulkier. You now have a double thickness of\
    \ thread. Next, follow the method appropriate for your type of button.\n\nSEWING\
    \ ON A BUTTON WITH HOLES\n\n![DK](Images/Page_031_01.png)\n\n**2a** Push the needle\
    \ through the fabric from behind and through a top hole. Hold the button in place\
    \ while pulling the needle and thread all the way through.\n\n![DK](Images/Page_031_02.png)\n\
    \n**3a** Push the needle through the hole below and pull it and the thread all\
    \ the way through. Repeat steps 2a and 3a three or four times; repeat for the\
    \ second pair of holes, as necessary.\n\nSEWING ON A SHANK BUTTON\n\n![DK](Images/Page_031_03.png)\n\
    \n**2b** Push the needle through the fabric from behind and under the shank. Hold\
    \ the button in place while pulling the needle and thread all the way through.\n\
    \n![DK](Images/Page_031_04.png)\n\n**3b** Keep the button flat against the garment.\
    \ Push the needle through the fabric below the shank and pull it and the thread\
    \ all the way through. Repeat steps 2b and 3b three or four times.\n\n![DK](Images/Page_031_05.png)\n\
    \n**4** Flip the garment over so you can clearly see the area behind the button.\
    \ Make two small stitches on top of each other, over the stitching that is holding\
    \ your button on. Pull tight and trim the excess thread close to the fabric.\n\
    \ng [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)\n\
    \n# Repairing a buttonhole\n\nBroken stitching around a buttonhole can lead to\
    \ some annoying fraying. Not only does it look tatty, but it can also make it\
    \ tricky to push the button through. Yet a few carefully placed stitches can repair\
    \ that broken stitching, and bring an unrivaled feeling of satisfaction.\n\n|\
    \ **You will need** || scissors/thread snips, hand-sewing needle, color-matched\
    \ thread |\n\n| --- | --- |\n\n| **Left-handed?** || Work in the opposite direction\
    \ to the one shown here if that feels more comfortable |\n\n![DK](Images/Page_032_01.png)\n\
    \n**1** Carefully cut away any fraying and, if possible, remove the broken stitches\
    \ from the original buttonhole. Refer to step 1 of [Sewing on a button](#030-031_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0056)\
    \ for how to prepare the needle and thread.\n\n![DK](Images/Page_032_02.png)\n\
    \n**2** Hold the garment so the right side is facing you and the buttonhole is\
    \ lying horizontally. Push the needle up through the fabric from behind, coming\
    \ out at the bottom of the original stitch height. Pull the needle and thread\
    \ out from above.\n\n![DK](Images/Page_033_01.png)\n\n**3** Post the needle down\
    \ through the slit of the buttonhole directly above where your needle emerged.\
    \ Pull the needle and thread most of the way through the slit from behind. Pull\
    \ gently, leaving a loop of thread on the right side.\n\n![DK](Images/Page_033_02.png)\n\
    \n**4** Push the needle up through the fabric again from behind at the same point\
    \ as step 2. Pull the needle and thread out from above, then pass the needle through\
    \ the loop of thread from step 3. Pull the needle and thread upward to tighten.\n\
    \n![DK](Images/Page_033_03.png)\n\n**5** Post the needle through the slit as before,\
    \ then push it through the fabric from behind, slightly to the right of the last\
    \ stitch. Pull the needle and thread out almost all the way, leaving a loop, as\
    \ before. Pass through this second loop and tighten.\n\n![DK](Images/Page_033_04.png)\n\
    \n**6** Continue to repeat step 5, always pushing the needle up slightly to the\
    \ right of the previous stitch, until the broken area has been filled in. To finish\
    \ off, make one tiny stitch through the inner edge of the last stitch. Pull tightly\
    \ and trim the thread.\n\ng [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2)\
    \ g [CONTENTS](#contents.xhtml)\n\n# Contrasting buttons\n\nCHANGING THE BUTTONS\
    \ IS AN EASY WAY TO ALTER THE LOOK OF A GARMENT. DO MAKE SURE THE NEW ONES ARE\
    \ THE SAME SIZE AS THE OLD ONES.\n\n![DK](Images/Page_034_01.jpg)\n\ng [MEND YOUR\
    \ CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)\n\
    \n# Repairing a hem\n\nMending a hem that has come undone is a simple task. If\
    \ the original hem has barely visible stitches, follow the [invisible-hem method](#036-039_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0073).\
    \ If it has a visible row of stitches, use the [visible-hem method](#036-039_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0080).\
    \ Color match the thread to the fabric for both methods.\n\n| **You will need**\
    \ || **Invisible-hem method:** iron, ironing board, pins, tape measure, sharp\
    \ hand-sewing needle, color-matched thread, scissors/thread snips  \n\n**Visible-hem\
    \ method:** scissors/thread snips, pins (optional), hand-sewing needle, color-matched\
    \ thread, fabric-marking tool (optional) |\n\n| --- | --- |\n\n| **Left-handed?**\
    \ || Work in the opposite direction to the one shown here if that feels more comfortable\
    \ |\n\nTop Tip\n\nIf the broken section of hem stitching is quite long, it’s a\
    \ good idea to use a fabric-marking tool to draw a stitching line to guide you.\n\
    \ng [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)\n\
    \n# Invisible-hem method"
  fmt: "\n# Sewing Machine Tips\n\nSelect a straight stitch and sew a few rows, then\
    \ take the fabric off the machine and have a look. Check to see if the stitch\
    \ looks even on both sides of the fabric. If there is a mess of loops or the stitches\
    \ on one side look much looser or tighter than on the other side, carefully rethread\
    \ the machine and reinsert the bobbin. It could be that you missed a key threading\
    \ point.\n\n## A Mixed Pack of Needles\n\n![DK](Images/Page_027_02.png)\n\n##\
    \ Insert the Needle Correctly\n\n![DK](Images/Page_027_03.png)\n\n## Is the Tension\
    \ Right?\n\n![DK](Images/Page_028_01.png)\n\n## Tip 4: Give the Machine Some TLC\n\
    \nIf you have followed the manual and/or relevant tutorials, and the other tips\
    \ listed here, but the machine refuses to function properly, it may well be time\
    \ to bring in a professional. Sewing machines, particularly older ones, require\
    \ occasional maintenance to stay in good working order. And even newer models\
    \ that have been left unused or have suffered a mishap might need some TLC from\
    \ a servicing and repairs person.\n\n## Tip 5: Learn the Basic Stitches\n\nWhen\
    \ the machine is stitching nicely, you can then select the most suitable stitch\
    \ for your repair. Recommended stitch types are specified on each repair technique\
    \ page, but the most useful stitches to have in your arsenal are straight stitch,\
    \ zigzag stitch, and three-step zigzag stitch. All but the most basic of sewing\
    \ machine models should allow you to adjust the length and width of the different\
    \ stitches, should you need to. Always test your selected stitch and any adjustments\
    \ you make on a scrap of fabric before starting your repair.\n\n### The Three\
    \ Basic Stitches\n\n![DK](Images/Page_028_02.png)\n\n## Tip 6: Find the Reverse\
    \ Function\n\nAlways use the reverse stitch (backstitch) at the beginning and\
    \ end of every row you sew to secure the thread, otherwise your repair is likely\
    \ to come undone.\n\n> **Top Tip**\n>\n> To help thread the needle, trim the thread\
    \ at an angle and hold it close to the end to guide it through the eye.\n\n---\n\
    \n# Sewing on a Button\n\n*“I can’t even sew a button on!*” is a popular claim\
    \ that often follows any mention of sewing or garment care. Yet sewing a button\
    \ back on is the ground zero of garment repair. Literally five minutes’ effort\
    \ can prevent an item from falling into permanent disuse.\n\n| **You will need**\
    \ | | hand-sewing needle, thread, same-size buttons, scissors/thread snips |\n\
    | --- | --- | --- |\n\n![DK](Images/Page_030_02.png)\n\n> **Top Tip**\n>\n> Before\
    \ you begin, remove any remains of thread that may still be attached to the button\
    \ or on the garment where the button used to be attached.\n\n![DK](Images/Page_030_03.png)\n\
    \n**1** Thread a sewing needle with a strand of thread about 20 in (50 cm) long.\
    \ Hold together both ends of the thread and tie a knot. Tie a second knot over\
    \ the top of the first to make it bulkier. You now have a double thickness of\
    \ thread. Next, follow the method appropriate for your type of button.\n\n## Sewing\
    \ on a Button with Holes\n\n![DK](Images/Page_031_01.png)\n\n**2a** Push the needle\
    \ through the fabric from behind and through a top hole. Hold the button in place\
    \ while pulling the needle and thread all the way through.\n\n![DK](Images/Page_031_02.png)\n\
    \n**3a** Push the needle through the hole below and pull it and the thread all\
    \ the way through. Repeat steps 2a and 3a three or four times; repeat for the\
    \ second pair of holes, as necessary.\n\n## Sewing on a Shank Button\n\n![DK](Images/Page_031_03.png)\n\
    \n**2b** Push the needle through the fabric from behind and under the shank. Hold\
    \ the button in place while pulling the needle and thread all the way through.\n\
    \n![DK](Images/Page_031_04.png)\n\n**3b** Keep the button flat against the garment.\
    \ Push the needle through the fabric below the shank and pull it and the thread\
    \ all the way through. Repeat steps 2b and 3b three or four times.\n\n![DK](Images/Page_031_05.png)\n\
    \n**4** Flip the garment over so you can clearly see the area behind the button.\
    \ Make two small stitches on top of each other, over the stitching that is holding\
    \ your button on. Pull tight and trim the excess thread close to the fabric.\n\
    \n---\n\n# Repairing a Buttonhole\n\nBroken stitching around a buttonhole can\
    \ lead to some annoying fraying. Not only does it look tatty, but it can also\
    \ make it tricky to push the button through. Yet a few carefully placed stitches\
    \ can repair that broken stitching, and bring an unrivaled feeling of satisfaction.\n\
    \n| **You will need** | | scissors/thread snips, hand-sewing needle, color-matched\
    \ thread |\n| --- | --- | --- |\n\n| **Left-handed?** | | Work in the opposite\
    \ direction to the one shown here if that feels more comfortable |\n| --- | ---\
    \ | --- |\n\n![DK](Images/Page_032_01.png)\n\n**1** Carefully cut away any fraying\
    \ and, if possible, remove the broken stitches from the original buttonhole. Refer\
    \ to step 1 of [Sewing on a button](#sewing-on-a-button) for how to prepare the\
    \ needle and thread.\n\n![DK](Images/Page_032_02.png)\n\n**2** Hold the garment\
    \ so the right side is facing you and the buttonhole is lying horizontally. Push\
    \ the needle up through the fabric from behind, coming out at the bottom of the\
    \ original stitch height. Pull the needle and thread out from above.\n\n![DK](Images/Page_033_01.png)\n\
    \n**3** Post the needle down through the slit of the buttonhole directly above\
    \ where your needle emerged. Pull the needle and thread most of the way through\
    \ the slit from behind. Pull gently, leaving a loop of thread on the right side.\n\
    \n![DK](Images/Page_033_02.png)\n\n**4** Push the needle up through the fabric\
    \ again from behind at the same point as step 2. Pull the needle and thread out\
    \ from above, then pass the needle through the loop of thread from step 3. Pull\
    \ the needle and thread upward to tighten.\n\n![DK](Images/Page_033_03.png)\n\n\
    **5** Post the needle through the slit as before, then push it through the fabric\
    \ from behind, slightly to the right of the last stitch. Pull the needle and thread\
    \ out almost all the way, leaving a loop, as before. Pass through this second\
    \ loop and tighten.\n\n![DK](Images/Page_033_04.png)\n\n**6** Continue to repeat\

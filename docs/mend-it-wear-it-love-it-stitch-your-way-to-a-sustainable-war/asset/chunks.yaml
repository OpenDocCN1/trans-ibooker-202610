    # Introduction


    Our clothes work hard for us. They keep us warm and comfy, look great, and say
    a lot about who we are. So, when they start to show signs of all this work, don’t
    we owe it to them to pick up that needle and thread?


    Before we get into the techniques to deploy against the signs of wear and tear,
    first let’s consider our mind-set. At this point, you may be feeling a bit nervous
    about wielding pins and needles (let alone scissors!) anywhere near your well-loved
    garment, and wondering whether it’s such a good idea after all. Please internalize
    the sentiment that any repair that extends the life of a garment by even one more
    wear is a major success and should be celebrated. By even attempting to make your
    clothes last longer, you are an active participant in the slow-fashion movement—congratulations!


    Any repair that extends the life of a garment by even one more wear is a major
    success.


    Bold or subtle?


    A garment repair can sit anywhere on the spectrum from “super-neat and invisible
    to the naked eye,” to “a glaringly obvious extension of the life of the garment.”
    Explore #visiblemending online to investigate and revel in the rationale of this
    approach. It is shared by many who like to highlight, not hide, the journey their
    clothes have been on.


    The role that a garment plays in your wardrobe and your personal style will affect
    which approach you choose for a specific repair. Whatever you are aiming for,
    please don’t think that a mend needs to look perfect, or even vaguely neat, to
    be a success; but it’s a good idea to follow some [basic rules](#024-025_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0048)
    for the best results.


    If you don’t feel confident, or are trying something new, test out the technique
    on a scrap of fabric first.


    Flex newfound skills


    The techniques included in this book offer a great foundation for you to tackle
    most garment repairs. Over time, as issues with your clothes arise, you will get
    the chance to test out and become familiar with these techniques. It is likely
    that you’ll have great success with some, yet others might take a few tries to
    achieve the effect that you were hoping for.


    Each repair technique in this book is suitable for a beginner. Yet, in reality,
    there may be a number of different ways to approach any repair job. Feel free
    to experiment and adapt these techniques if you wish, apply them in a different
    way, or even develop some of your own.


    Have fun, get crafty, and be proud!


    To increase the chances of successful repairs, follow these basic rules:


    *   Once you notice a repair is called for, do not wear the garment again until
    you have dealt with the problem. Don’t wash it either. Continuing to wear or washing
    the garment before you mend it will very likely make the issue worse and will
    therefore be more difficult to repair later on.


    *   Don’t attempt to repair a garment while wearing it. You need to lay the garment
    out and properly inspect the issue to be able to make the best repair possible.


    *   Try to repair your garment in good lighting. Dark-colored garments are particularly
    difficult to work on in poor or artificial light.


    *   If you don’t feel confident, or are trying something new, test out the technique
    on a scrap of fabric first. It’s OK to take your time—this is slow fashion after
    all.


    *   If the fabric is delicate, fine, fraying rapidly, or super-expensive, consider
    taking it to a tailor or alterations expert. It’s OK to pick your projects. When
    you collect the repaired garment, ask them how they approached the repair, so
    perhaps you can try something similar another time.


    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    # Using a sewing machine


    To make your repairs speedier and give them a neater finish, use a sewing machine.
    Banish any bad memories from school home ec lessons (if you even had any), and
    if you can beg, borrow, or steal a machine, why not give it a try?


    There are a number of basic functions that you will need to get the hang of initially—winding
    a bobbin, threading the machine, selecting and adjusting the stitch, and positioning
    your project ready to be sewn. Assuming you are not the machine’s owner, and they
    are unable to give you a lesson, find out if the machine’s manual can walk you
    through these steps. If you cannot get your hands on a physical version, you may
    be able to buy a PDF copy or locate a video tutorial; search online for the brand
    name and model number of the machine.


    Once you’ve learned the machine’s basic functions, discover these handy tips to
    help you toward sewing success.


    Tip 1: Use a super-sharp needle


    Buy a new pack of sewing machine needles that include a range of sizes (usually
    from 8 to 16). Most machines will take universal needles, but some (usually older)
    models use a different type. Do match the needle to the type of fabric, too: universal
    needles are suitable for woven fabrics but jersey and stretchy fabrics call for
    a ballpoint needle.


    Change the needle of your sewing machine regularly as it’s hard to see if it has
    been damaged. Sewing with a damaged or blunt needle can, in turn, damage the fabric
    of the item you are trying to repair.


    Tip 2: Use the right size of needle


    Always match the size of needle to the thickness of the fabric you are about to
    sew (see table, below). Basically, the larger the number, the larger the needle.


    | Needle size || Type of fabric |


    | --- | --- |


    | 8(60) and 10(70) || lightweight fabrics, such as cotton lawn, silk, and voile
    |


    | --- | --- |


    | 12(80) || medium-weight fabrics, such as jersey, poplin, shirting, and linen
    |


    | 14(90) and 16(100) || heavyweight fabrics, such as cotton drill, denim, and
    corduroy |


    THREAD A SEWING MACHINE IN SIX EASY STEPS


    ![DK](Images/Page_027_01.png)


    n Double-tap image to read the labels


    FAMILIARIZE YOURSELF WITH THE MACHINE


    ![DK](Images/Page_028_03.png)


    n Double-tap image to read the labels


    Tip 3: Get to know the machine


    Refer to the manual/tutorials to get the machine ready: wind and insert a bobbin,
    insert a new needle, and thread the machine. Also, check the tension dial is set
    as stated in the manual. Then, run a test on a fabric scrap. If possible, practice
    on a fabric that’s similar in type and thickness to the garment you are about
    to mend.'

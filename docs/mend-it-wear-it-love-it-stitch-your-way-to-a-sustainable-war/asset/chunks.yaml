    but resist over-fitting.


    ![DK](Images/Page_099_02.png)


    **2** Turn the garment inside out and put it back on. Recreate the desired effect
    and place a pin vertically in each side at your natural waistline. Aim to pin
    the fabric by the same amount at each dart position. Ask a friend to help if possible/necessary.


    ![DK](Images/Page_099_03.png)


    **3** Carefully take off the garment and lay it on a flat surface inside out,
    ready to mark the darts. Place a pin vertically on either side of the fabric at
    the pinch. Remove the original pin so the fabric can lay flat. Repeat on the other
    side.


    ![DK](Images/Page_099_04.png)


    **4** Measure the distance from the side seam to the nearest vertical pin on both
    sides. Add these measurements together and divide by two to get the average distance
    from the side seam to outer edge of the dart. Write this number down.


    ![DK](Images/Page_100_01.png)


    **5** Measure the distance between each pair of vertical pins. Add them together
    and divide by two to get an average width for each dart. Write this down. With
    these numbers, you can start to plot your dart onto the fabric.



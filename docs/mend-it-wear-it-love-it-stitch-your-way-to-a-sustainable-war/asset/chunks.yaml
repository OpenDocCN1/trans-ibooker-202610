    \n---\n\n# Love Your Clothes\n\n## Introduction\n\nYou’re fixing damaged garments.\
    \ You’re transforming abandoned garments into something wearable for you or a\
    \ friend. Everything in your wardrobe is looking great and working well. Now,\
    \ it’s time to talk about the long term.\n\nWell done, you! You’ve been taking\
    \ the time to learn an array of new skills to fix the flaws in your clothes. And\
    \ you’ve expanded upon that further, brandishing new techniques to customize and\
    \ adapt existing clothing to your specifications. These are fun, heady, creative\
    \ times, aren’t they? Hopefully you’re still in the throes of rekindled passion\
    \ for the garments that you’ve already worked on. But now it’s time to talk about\
    \ caring for your clothes in the long term.\n\n### Future-proofing your wardrobe\n\
    \nIn this chapter we’ll cover storage methods for both regularly used and off-season\
    \ clothing (including how to prevent moth damage), laundry and ironing tips, tactics\
    \ for treating or hiding stains, and how to dive into the world of dyeing.\n\n\
    Granted, garment care may not be as exciting as learning and flexing new and interesting\
    \ skills. But the “slow-fashion” ethos is as much about soaking a tea-stained\
    \ T-shirt in cold water, as it is about sashiko-style stitching. All that awesome\
    \ mending and innovative reworking will be undermined if you don’t take good care\
    \ of those newly improved garments. You owe it to yourself and to the clothes\
    \ to go the extra mile and learn how best to look after them. Only then can they\
    \ perform their functions successfully, while looking great for as long as possible.\n\
    \n### The all-important storage\n\nFirst up, we will brush up on how best to keep\
    \ your clothing when it is not being worn. Whether you wear the garment all the\
    \ time or it is in its off-season, all garments deserve to be put away and stored\
    \ correctly. So, what approaches will help them keep their structure well? Which\
    \ items definitely need to be hung up and which should be folded?\n\nHow can you\
    \ maximize storage space so that all your options are accessible and nothing becomes\
    \ lost, forgotten, or overlooked. And is there anything to be done to prevent\
    \ the biggest causes of wardrobe wreckage—moths and mold or mildew? We’ll give\
    \ you all the answers.\n\n> All that awesome mending and innovative reworking\
    \ will be undermined if you don’t take good care of those newly improved garments.\n\
    \n### Laundry aficionado\n\nPresumably you’ve already been doing your own laundry\
    \ (and possibly other people’s) for some time. So, it might seem a bit weird to\
    \ be boning up on laundry techniques at this stage as, by now, it’s most likely\
    \ something that you just do. Yet, it’s the actions that are performed day in\
    \ and day out that keep your garments healthy and functioning well or lead them\
    \ to become prematurely faded and misshapen.\n\nWhen we talk of garment care,\
    \ what does that really mean? Keeping it fresh and clean by laundering it regularly?\
    \ No! The biggest takeaway to be had is to wash your clothes as infrequently as\
    \ you can get away with. Nothing weakens and fades clothing quicker than washing\
    \ after every wear (undies, base wear, and socks are exempt).\n\nDiscovering which\
    \ approaches to washing and drying are kinder to the planet greatly affects how\
    \ much or little a garment impacts the environment over its lifetime.\n\n> The\
    \ biggest takeaway to be had is to wash your garments as infrequently as you can\
    \ get away with.\n\n### Garment refreshers\n\nAt risk of sounding like a detergent\
    \ advertisement, coffee spills, pasta sauce splashes, sweat marks, and baby poop\
    \ (even on pale garments) needn’t make you roll your eyes and announce, “Well,\
    \ that’s ruined”. If you discover the right approaches and deal with it quickly,\
    \ you should be able to get rid of that stain completely.\n\nRefreshing a garment’s\
    \ color or changing it up entirely is also a way to enliven a well-worn pair of\
    \ jeans or perk up an old T-shirt. Learning the basics of which fabrics take dye\
    \ best and types of dye will enable you to branch out into a world of color. And\
    \ if all efforts at stain removal fail, then disguise marks with a cute embroidery\
    \ detail with a little needle and thread action.\n\nThere is a real satisfaction\
    \ from caring properly for garments that you have invested in. While efforts may\
    \ not always be visible, it doesn’t mean they can’t be appreciated.\n\ng [LOVE\
    \ YOUR CLOTHES](#116-117_Mend_it_Wear_It_Love_It.xhtml#part4) g [CONTENTS](#contents.xhtml)\n\
    \n## Smart Storage Options\n\nUse these tips for storing your clothes, whether\
    \ in regular rotation or packed away for their off-season. Your rewards are clothes\
    \ that stay in the best possible shape longer and remain undamaged by moths, mold,\
    \ or mildew.\n\nEven with garments that you wear often, there are certain storage\
    \ methods and practices that are good to stick to. These will give your clothes\
    \ their best shot at looking good for as long as possible.\n"
  trans: "\n![DK](img/Page_112_03.png)\n\n# 弹性袖口和裤脚\n\n## 步骤\n\n**1** 在镜子前试穿衣物。翻起下摆并用别针固定。评估新长度；如有需要请调整。松紧带会略微提起下摆，所以要多留一点以补偿。\n\
    \n![DK](img/Page_112_04.png)\n\n**2** 选择合适宽度的松紧带。如果您希望尽可能保留长度，请选择窄松紧带；避免使用宽度小于\
    \ ⅜英寸（1 厘米）的松紧带。\n\n![DK](img/Page_113_01.png)\n\n**3** 按照“缩短下摆”的步骤 2 操作。测量松紧带宽度，加上\
    \ ⅝英寸（1.5 厘米），并标记这个额外量。按照步骤 4 去除下摆多余的布料。\n\n![DK](img/Page_113_02.png)\n\n**4**\
    \ 将衣物里面朝外，将底边向后折叠 ⅜英寸（1 厘米）并熨烫。然后，向后折叠松紧带宽度加 ³⁄₁₆ 英寸（5 毫米）并再次熨烫。将这个通道距离其上边缘约 ¼英寸（7\
    \ 毫米）处用别针固定。\n\n![DK](img/Page_113_03.png)\n\n**5** 从内侧缝线开始，缝一排细小整齐的平针。在缝线中留出\
    \ 1³⁄₁₆ 英寸（3 厘米）的缝隙以便穿入松紧带。按照步骤 4 和 5 穿入松紧带。\n\n![DK](img/Page_113_04.png)\n\n\
    **6** 将松紧带重新送入通道。试穿衣物检查松紧带是否合适。然后，在重叠处上下穿刺缝过松紧带的两层来固定。用平针缝合缝隙。\n\ng 穿戴你的衣物 g 目录\n\

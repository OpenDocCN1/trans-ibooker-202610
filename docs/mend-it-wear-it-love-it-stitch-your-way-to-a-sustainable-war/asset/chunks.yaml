    # Mending a split seam


    A split seam differs from a tear because only the stitching is broken; the fabric
    is still intact. If a split seam is the issue, even if the garment is fully lined,
    it is easy to create an invisible-to-the-naked-eye repair.


    ## You will need


    | Method | Tools |

    | --- | --- |

    | Repair from the top | scissors/thread snips, hand-sewing needle, color-matched
    thread |

    | Repair from the inside | scissors/thread snips, pins (optional), hand-sewing
    needle, color-matched thread, fabric-marking tool (optional) |

    | Repair and reinforcement | scissors/thread snips, tape measure, iron-on interfacing,
    fabric scissors, iron, ironing board, pressing cloth, fabric-marking tool, hand-sewing
    needle, color-matched thread |


    ## Sewing machine?


    | Method | Instructions |

    | --- | --- |

    | Repair from the inside | follow steps 1 and 2 and then use a straight stitch
    instead of the running stitch. |

    | Repair and reinforcement | follow steps 1 to 4 and then use a straight stitch
    instead of running stitch |


    ## Left-handed?


    | Note |

    | --- |

    | Work in the opposite direction to the one shown here if that feels more comfortable
    |


    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    # Repair from the top


    Mend any split seam by creating a version of the slip stitch (also known as ladder
    stitch, invisible stitch, or blind stitch) that we first used to [repair a hem](#036-039_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0071).


    ![DK](Images/Page_061_01.png)


    **1** With the right side facing you, snip any loose threads in the split. Thread
    a needle with a length of thread about 12 in (30 cm) long. Tie a knot in one end,
    then tie a second knot over the first to make it bulkier.


    ![DK](Images/Page_061_02.png)


    **2** Insert the needle through the seam allowance on the inside of the split
    so that its point emerges on the original seam where the split begins. Pull the
    needle out from the front, so the knot stays hidden.


    ![DK](Images/Page_061_03.png)


    **3** Bring the needle across the seam directly below where it emerged. Insert
    the needle into the opposite edge of the original seam and take it across to the
    left, making a horizontal stitch ⅛ in (3 mm) long.


    ![DK](Images/Page_061_04.png)


    **4** Pull the needle and thread to start to close the gap between the seam edges.
    Take the needle back across the seam and make a ⅛ in- (3 mm-) long horizontal
    stitch in the seam’s upper edge.


    ![DK](Images/Page_062_01.png)


    **5** Repeat steps 3 and 4 along the length of the split seam. Carefully pull
    the thread at the end of each stitch tightly enough to close the gap but avoiding
    puckering. You want invisible stitches with a nice flat seam.


    ![DK](Images/Page_062_02.png)


    **6** To finish, make a tiny stitch just inside the edge of the seam. Pull the
    thread through gently, leaving a little loop of thread. Pass the needle through
    this loop, then pull tightly and trim the excess thread.


    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    # Repair from the inside


    Use this method to repair a split seam in an unlined garment where you can access
    both sides of the split stitching—it makes for a robust and long-lasting repair.


    ![DK](Images/Page_062_03.png)


    **1** Lay the garment down on a flat surface so the inside of the garment is facing
    up and the seam is visible. Carefully cut away any loose threads from both sides
    of the split section of seam.


    ![DK](Images/Page_062_04.png)


    **2** Unless the split section is very short, use pins to stabilize it and keep
    it flat while you work. Insert the pins perpendicular to the seam. Prepare a needle
    and thread as in [step 1](#060-065_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0149).


    ![DK](Images/Page_063_01.png)


    **3** To fill in the split section you will use a running stitch along the original
    seam line. If the crease or the holes created by the original stitching aren’t
    visible, draw a guide using a fabric-marking tool.


    ![DK](Images/Page_063_02.png)


    **4** Start a few stitches into the unbroken section of the seam. Push the needle
    up from behind through both layers of fabric and then push back down about ⅛ in
    (3 mm) further on and pull down from behind.


    ![DK](Images/Page_063_03.png)


    **5** Repeat step 4 to make a row of running stitches that fills in the split
    section. Take care to keep your stitches on the original seam line. Make a couple
    of extra stitches that overlap with the original unbroken stitching.


    ![DK](Images/Page_063_04.png)


    **6** To finish, make two small stitches on top of each other over your final
    stitch. Trim the excess thread and remove any pins. With the iron on a low setting,
    gently press the seam flat from the reverse side.


    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    # Repair and reinforcement


    When stress has been put on a seam, a split in the stitching may be accompanied
    by fraying or damage to the fabric. This method deals with both issues and offers
    a neat finish.


    ![DK](Images/Page_064_01.png)


    **1** Lay the garment down on a flat surface so the inside of the garment is facing
    up and the seam is visible. Carefully cut away any loose threads. Measure the
    length of the split and damaged section.


    ![DK](Images/Page_064_02.png)


    **2** Select a fusible interfacing of a similar weight to your garment. Add an
    extra 1 in (2.5 cm) to the length of the split you measured and mark out a shape
    ⅝ in (1.5 cm) wide. Cut out two strips this size.


    ![DK](Images/Page_064_03.png)


    **3** Position one strip of interfacing centrally over the area of split seam
    and damaged fabric, glue-side down. Using a pressing cloth, fix with an iron.
    Flip the seam over and repeat with the second strip.


    ![DK](Images/Page_064_04.png)


    **4** Draw a stitching guide with a fabric-marking tool. Start on the original
    stitching line, then curve about ⅛ in (3 mm) away from any fraying so the stitching
    goes through undamaged fabric. Rejoin the line.


    ![DK](Images/Page_065_01.png)


    **5** Prepare the needle and thread as in [step 2](#036-039_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0075),
    then repeat [steps 4](#060-065_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0159) to
    [6](#060-065_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0161) to make a row of running
    stitches. To avoid unraveling, make a few stitches that overlap the original stitching
    at the start and finish of the new stitched line.


    ![DK](Images/Page_065_02.png)


    **6** Press the repaired seam on the inside of the garment—if it’s an open seam,
    press the seam apart; if it’s a closed seam, press both parts of the seam together
    to one side. Then, flip the item over and press the repair from the front.


    ### Top Tip


    Match the weight and shade of the iron-on interfacing to that of the garment fabric
    for the best finish.


    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    # Zipper issues


    Zippers are ingenious inventions, and it’s tricky to imagine a wardrobe without
    them. However, they can malfunction in numerous—and spectacular—ways. Replacing
    a zipper is best left to a tailor or alterations expert, but here are some tips
    and tricks that are worth trying at home first.


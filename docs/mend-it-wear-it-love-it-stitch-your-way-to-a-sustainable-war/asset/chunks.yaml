    # Adding a simple patch pocket


    Garments that have no pockets, or pockets that are too small to actually use,
    are highly annoying. But what if you could just make your own pocket and add it
    on? Let’s work through the steps of this real-life magic trick.


    | **You will need** || a sheet of paper, pencil, ruler, paper scissors, fabric
    to make the pocket (woven fabric with no stretch works best), pins, fabric scissors,
    iron, ironing board, tape measure, hand-sewing needle, thread (match the color
    to the pocket fabric), safety pins, scissors/thread snips |


    | --- | --- |


    | **Sewing machine?** || Use a straight stitch instead of a running stitch where
    indicated in the following steps |


    Top Tip


    When choosing a fabric for your patch pocket, anything goes when it comes to color
    or pattern. But ensure you opt for a medium- or heavyweight woven fabric with
    no stretch.


    ![DK](Images/Page_091_01.png)


    **1** Design the rough shape of your pocket in the center of the paper; check
    that it is big enough to put your hand in easily. When you’re happy with the size,
    use a ruler to make straight edges straight, and check any curves are smooth and
    even.


    ![DK](Images/Page_091_02.png)


    **2** Add 1⅝in (4 cm) to the opening edge. Then add ⅜in (1 cm) to the other edges
    and draw these new lines. Cut along this new outer edge with paper scissors for
    your pocket template.


    ![DK](Images/Page_091_03.png)


    **3** Position your paper pocket template on your fabric and pin it in place.
    Use your fabric scissors to cut out the pocket shape from the fabric. Repeat for
    however many pockets you’d like to add.


    ![DK](Images/Page_091_04.png)


    **4** Lay the pocket piece right-side down, turn the opening edge back ¾ in (2
    cm). Press this fold. Turn the edge back by another ¾ in (2 cm) and press again.
    Thread a needle with a length of thread about 12 in (30 cm) long. Tie a knot in
    one end.


    ![DK](Images/Page_092_01.png)


    **5** Still with the pocket piece right-side down, make a running stitch, close
    to the inner fold at the opening edge. Push the needle up through all layers.
    Pull the needle back down, about ³/[16]in (5 mm) away from where it first emerged.


    ![DK](Images/Page_092_02.png)


    **6** Pull the needle and thread down from behind, then repeat step 5 to make
    a row of even running stitches. Make two small stitches on top of each other over
    the final running stitch. Trim the excess thread. The opening edge is now finished.


    ![DK](Images/Page_092_03.png)


    **7** Fold the remaining edges of the pocket piece in by ⅜in (1 cm). Press the
    edges. (If a pocket includes curves, fold and press carefully to avoid any harsh
    lines.) Flip the pocket piece over, so the right side faces up, and press to set
    the shape.


    ![DK](Images/Page_092_04.png)


    **8** Pin the pocket to your garment with safety pins in roughly the right position.
    Pockets need to be accessible and keep their contents safe, but where you put
    them is up to you. Try on the garment to check the position and adjust as necessary.


    ![DK](Images/Page_093_01.png)


    **9** Lay the garment on a flat surface. Add dressmaking pins to stabilize the
    pocket in its final position. Place the pins about 1 in (2.5 cm) apart, perpendicular
    to the edges. Do not pin the opening edge. Pin through a single layer of the garment
    only.


    ![DK](Images/Page_093_02.png)


    **10** Thread a needle with an 18 in (45 cm) length of thread (longer for a large
    pocket). Tie a knot in one end. Starting at the top corner, about ⅛in (3 mm) from
    the edge, push the needle up from behind through the garment and the pocket.


    ![DK](Images/Page_093_03.png)


    **11** Pull the needle and thread out from above and push them back down, about
    ³/[16]in (5 mm) away. Continue around the pocket with even running stitches. At
    the back, make two small stitches on top of each other, through the garment only.


    ![DK](Images/Page_093_04.png)


    **12** Prepare a needle and a double thickness of thread (see [Sewing on a button](#030-031_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0056)).
    At both the top corners, push the needle up from behind and make a diagonal stitch.
    Stitch over this a few times, then repeat in the opposite direction to make an
    “X.”



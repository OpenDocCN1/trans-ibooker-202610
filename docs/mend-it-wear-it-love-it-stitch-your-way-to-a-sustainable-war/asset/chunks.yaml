    g [CONTENTS](#contents.xhtml)


    # Introduction


    Today’s rapid cycle of production, buying, and disposal of clothing impairs our
    ability to feel satisfied and connected with our wardrobes. It’s time for a new,
    slower approach to repairing clothes and to cherishing what we have.


    The fundamental source of happiness is relationships. So, it’s time to build a
    healthier relationship with our wardrobes. Let’s push back against the concept
    that pleasure can only be found in the next new thing.


    This book gives you the skills to create and update your own sustainable wardrobe
    of outfits based on what you already own.


    Clothes shopping habits


    Over the past decades, the speed at which we collectively buy, use, and discard
    clothing has accelerated dramatically. Research by Greenpeace shows that we consume
    60 percent more clothing than we did even 15 years ago. According to the American
    Apparel and Footwear Association (AAFA), at the beginning of the ’90s, Americans
    bought 40 new garments a year on average; by the end of the decade, it had risen
    to 65 garments per year.


    What’s in your wardrobe?


    It’s time to analyze the clothing you already have. You may be surprised. The
    average American woman has $550 of unworn clothing in her closet—a massive waste
    of money. And what we do wear, we use only about seven times before we throw it
    away. We have entered a state of permanent dissatisfaction with the clothing that
    we own, and we’ve been encouraged to believe the only way to move forward is to
    have a clear out and buy yet more clothes.


    Bucking the trend


    Well, how about you seek satisfaction and joy in the things you already have,
    instead? Come on a journey to rediscover and reconnect with your existing wardrobe.
    It’s hard to build relationships with items that are as ever-changing as the contents
    of your fridge. So, establish a status quo and resist the urge to buy anything
    new for now. You’ll need time and brain space to move toward a more fulfilling
    connection with your clothes.


    According to the AAFA, shoppers bought 60 percent more clothing at the end of
    the 1990s than they did 10 years previously.


    When you take the time and effort to repair or improve a garment, you will value
    it and, more importantly, enjoy wearing it.


    What needs mending or fixing?


    First, you need to identify which items you’re just not wearing any more. With
    these garments separated out, it’s time to figure out what the problems are so
    you can address them. For some, the issues will be obvious: the hem is hanging
    down in one place or a strategic button popped off, for example. With others,
    the problems will be harder to identify; they always felt “meh.”


    If the reason you’re not wearing a particular garment isn’t glaringly obvious,
    perhaps you need a prompt. Leaf through the inspirational ideas within this book
    to see if switching up the buttons is what’s needed, or if adding new pockets
    or removing sleeves is the way to go. Whatever you decide, this book gives you
    the practical know-how to rework those items and bring them back into regular
    wardrobe rotation.


    Sewing novices welcome


    Panic not: no prior knowledge or experience of sewing is required. This book starts
    at the very beginning, by providing a guide to the essential equipment you need.
    With clear explanations and illustrations, it will lead you through each step
    to fix common clothing malfunctions, as well as to apply clever alteration techniques.
    You don’t need a sewing machine, but if you have access to one there are helpful
    tips to get you started and suitable alternatives where possible.


    Satisfaction, guaranteed


    Once you’ve mended your first item, you can go on to bring new life to other unloved
    garments. When you take the small amount of time and effort to repair or improve
    a garment, you will value it and, more importantly, enjoy wearing it. The benefits
    of learning and developing new skills—and taking the time to focus on completing
    a task using your hands—will be fully felt.


    Learning new skills doesn’t stop with mending and customizing clothes. Be sure
    to read the all-important sections on caring for and storing your clothes.


    So, what are you waiting for? Just remember to take it slow!


    g [CONTENTS](#contents.xhtml)


    # The lowdown on “fast fashion”


    Fast fashion has huge human and environmental costs, and as a society we should
    be consuming far less of it. So, let’s have a closer look at the impact of those
    irresistibly cheap T-shirts.


    But what is fast fashion exactly? Well, it’s all that inexpensive clothing, produced
    rapidly by mass-market retailers, in response to the latest trends. It’s cool,
    it’s cute, it’s cheap, and there’ll be something different on the racks the next
    time you enter the store, as clothing manufacturers race to reproduce the latest
    catwalk and celebrity looks. But the speed of this is the very definition of unsustainable.
    The truth is no clothing should be that cheap.


    Only 2 percent of the 40 million garment workers around the world earn a living
    wage—it effectively amounts to modern-day slavery.


    Who picks up the bill?


    So, if the consumer isn’t paying its true cost, where is the shortfall being made
    up? Partly, it’s in the low quality of the fabrics used and the finishing and
    manufacturing processes. And, more tragically, the cost of production is kept
    low by paying fabric and garment workers very little and offering poor working
    conditions. When the ills of fast fashion are being documented, it’s usually an
    image of an exhausted garment worker hunched over a sewing machine that comes
    to mind, so let’s start there.


    The human costs


    On April 24, 2013, in Bangladesh, an eight-story concrete building called Rana
    Plaza collapsed. The building contained many factories used by fast-fashion brands.
    Caused by negligent construction, the collapse took the lives of 1,134 garment
    workers and injured another 2,500. Poor conditions and scant safety measures are
    common in factories producing fast-fashion clothing, and sadly the Rana Plaza
    tragedy is far from the only deadly incident.


    Garment workers are disregarded and undervalued, with only 2 percent of the estimated
    40 million garment workers around the world earning a living wage—it effectively
    amounts to modern-day slavery. Attempts to unionize and to campaign for improvements
    in safety, conditions, wages, sick pay, and job security are kept in check by
    the threat of job losses and even documented acts of violence.


    The system is unsustainable


    But the problems faced by garment workers are not simply caused by factory owners
    and their need for profit. Workers and their families are trapped in poverty,
    because a rise in workers’ pay results in higher costs for the factory, which
    in turn would likely mean the factory losing a contract to another that has offered
    a lower bid to the fashion brand’s tender.


    The issues are systemic: responsibility must travel up the chain to be shouldered
    both by the brands themselves for their commitment to keeping the cost of their
    products so low and by the consumers who have got used to paying so little.'

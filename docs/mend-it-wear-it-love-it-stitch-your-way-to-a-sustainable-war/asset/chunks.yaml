    # Acknowledgments


    ## Author''s Acknowledgments


    Enormous thanks to my husband, Pat, for his love and constant belief in my abilities.
    You always value them highly, even when I wobble and lose focus. And thank you
    for helping me to find ways to write this book during lockdown, stuck in a flat
    with other jobs, and two small children to look after and home-school.


    Massive thanks to my children, Dolores and Frankie. I hope that when the world
    is passed on to you and your generation, that it will be in better condition than
    it currently is. You push me every day to try to find ways to improve it: you
    are my inspiration. Just please be gentle with my sewing machine!


    Thanks to Vic for supporting me through everything, all the time.


    I''d like to thank my parents for raising me in a household that valued making
    and creating, not simply consuming. And thanks in particular to my mum for facilitating
    my interest in sewing, sharing her skills and knowledge, and showing me that there
    isn''t a garment out there that can''t be altered!


    Thank you to the sewing community, for being the nicest, most generous, most supportive
    group of people there is, both IRL and on the internet!


    And huge thanks to Nikki and Dawn from DK for guiding me so well through the process
    of writing this book. You helped make it a wonderful experience.



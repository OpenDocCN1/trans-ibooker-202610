    the [machine](#026-029_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0049). Locate the
    stitch type selector and choose a straight stitch. Then select 3–3.5 on the stitch
    length selector.


    ![DK](Images/Page_051_02.png)


    **2** Position the item on the machine (which can be tricky depending where the
    patch is) and stitch back and forth over the damaged area. Turn the garment so
    that you next stitch at right angles to the first row of stitches to strengthen
    the repair.


    **Top Tip**


    Choose the mending method depending on the hole’s size, the fabric type, and where

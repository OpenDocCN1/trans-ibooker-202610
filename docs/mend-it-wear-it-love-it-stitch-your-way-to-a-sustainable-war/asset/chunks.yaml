- raw: 'There are three main types of zippers found in clothing: open-ended, closed-ended,
    and concealed/invisible. The ends of open-end zippers can be separated completely
    and are mainly used to fasten zip-through hoodies and jackets. Closed-end zippers
    are joined at the base. These are found in various types of garments, including
    the fly fronts of jeans and trousers. Concealed (or invisible) zippers are almost
    exclusively found in womenswear. When inserted well, only the zipper pull is visible,
    so it helps a garment maintain a sleek, well-fitting silhouette.


    Metal or plastic?


    Most modern zippers have plastic teeth made from polyester or nylon. The teeth
    in lightweight, plastic-toothed zippers are formed from a coil. On the other hand,
    metal zippers, often found in jeans and more robust outerwear, have separate teeth
    made from brass, stainless steel, aluminum, or zinc.


    ![DK](Images/Page_066_01.png)


    A sticky zipper


    It can be infuriating when a zipper is sticking. If your zipper is difficult to
    open and close, first check to see if something’s caught in the teeth: a hair
    or thread, perhaps. Otherwise, some lubrication along the teeth just above or
    below the slider may be in order. Candle wax, crayon, pencil lead, soap, or lip
    balm can help coax a zipper back into action. Then, jiggle the slider to work
    the lubricant into the teeth. Just be careful not to stain the fabric of your
    garment.


    FREE UP A STICKY ZIPPER


    ![DK](Images/Page_067_01.png)


    A broken or missing zipper pull


    It can be super-fussy to open and close your zipper if the zipper pull breaks
    off. But if the loop on the front of the slider is still intact, you’re in luck.
    Try threading a thin piece of wire through this loop and making a ring to act
    as a new zipper pull. A paper clip or key ring can also work for this. You can
    also source fancier replacement zipper pulls.


    A PAPER CLIP TURNED PULL


    ![DK](Images/Page_067_02.png)


    A loose zipper slider


    You have a loose zipper slider when it leaves some teeth open when you pull the
    zipper closed. A gentle squeeze with some pliers to the bottom part of the slider
    where it meets the teeth usually does the trick. Test the repaired zipper, and
    squeeze a little more, if necessary.


    TIGHTEN A ZIPPER SLIDER


    ![DK](Images/Page_068_01.png)


    Hole in the seam below a zipper


    The stress of repeatedly opening and closing a zipper can result in a hole appearing
    in the seam just below the zipper. This is particularly common in skirts and dresses
    with a concealed (or invisible) zipper. Follow the technique for method 1 of [Mending
    a split seam](#060-065_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0147) to mend such
    a hole using a ladder stitch.


    MEND A HOLE BELOW A ZIPPER


    ![DK](Images/Page_068_03.png)


    A zipper won’t stay up


    Everyone can relate to the embarrassment associated with a fly mishap. If the
    zipper on your trousers or jeans refuses to stay closed, the long-term solution
    is to get the zipper replaced. But, a temporary measure is to attach a key-ring
    loop to the zipper pull. Pull the zipper closed, then hook this ring over the
    button on the waistband before fastening it to avoid any unwelcome fresh air or
    awkward encounters.


    HELP THE ZIPPER STAY UP


    ![DK](Images/Page_068_02.png)


    A broken zipper slider


    Before taking the drastic (and more expensive) step of getting the entire zipper
    replaced, it’s worth trying a little garment DIY since replacement zipper sliders
    can be bought cheaply online. Remove the broken slider by snipping it with a pair
    of wire cutters. At the top of the zipper on the same side that you removed the
    broken slider from, fold aside the top stop then slide the replacement slider
    onto the teeth and zip as normal.


    REMOVE A BROKEN SLIDER


    ![DK](Images/Page_068_04.png)


    Top Tip


    If your zipper has missing or misaligned teeth, take it to an alterations expert
    to get it replaced. It’s quite a tricky fix otherwise.


    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    # Repairing collars and cuffs


    After some years of use, a shirt or blouse can start to show signs of wear on
    the collar and cuffs while the rest of the garment still looks great. If only
    there was some way to reinforce and disguise these sad, worn-out areas. Oh, but
    there is! Enter: bias tape.


    | **You will need** || tape measure, 39 in (1 m) or 1 pack of ¾ in (2 cm) wide
    or slightly wider bias tape (depending how it’s sold), scissors/thread snips,
    pins, hand-sewing needle, thread (match color to bias tape) |


    | --- | --- |


    | **Left-handed?** || Work in the opposite direction to the one shown here if
    that feels more comfortable |


    Top Tip


    You can find bias tape in a wide range of colors and patterns. Choose a close
    color match to the fabric of your garment for a subtle repair, or pick a contrasting
    bias tape that will add an entirely new design feature—it’s up to you.


    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    # Fixing a collar


    Collars rub against the neck, so over time the fabric starts to wear out. Whip
    stitching a length of bias tape along a collar will offer protection and extend
    a garment’s life.


    ![DK](Images/Page_071_01.png)


    **1** Lay the collar flat. Measure from edge to edge along the inner worn part.
    Trim the end of the bias tape if it isn’t neat. Then, add ¾ in (2 cm) to the collar
    measurement and cut that length of bias tape.


    ![DK](Images/Page_071_02.png)


    **2** Position the bias tape along the collar, centered over the worn part; ⅜
    in (1 cm) will extend at each end. Pin it in place with pins at 45°. Prepare a
    needle and thread as in [step 2](#036-039_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0075).


    ![DK](Images/Page_071_03.png)


    **3** Fold under the end of the bias tape by ⅜ in (1 cm) to create a fold flush
    with the edge of the collar. Push the needle up through the bias tape at the bottom
    of the fold right at the edge, so the knot is hidden.


    ![DK](Images/Page_071_04.png)


    **4** Push the point of the needle into the top layer of collar fabric, then push
    it diagonally across so it comes through the edge of the binding, about ⅛ in (3
    mm) away from where it first emerged.


    ![DK](Images/Page_072_01.png)


    **5** Continue making tiny whip stitches along the end and then the top length
    of the bias tape. When you reach the end, turn the collar around, fold over and
    stitch the short end, and finish the other length.


    ![DK](Images/Page_072_02.png)


    **6** Push the needle up through the bias tape, then make a tiny stitch through
    the collar and tape. Pull it through, leaving a little loop of thread. Pass the
    needle through this loop, then pull tightly. Trim the thread.


    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    # Mending cuffs


    Apply bias tape to garment cuffs to transform them from tattered into toughened.


    ![DK](Images/Page_072_03.png)


    **1** Measure the length of the cuff along the worn edge. Trim the end of the
    bias tape if it isn’t neat, then add ¾ in (2 cm) to the cuff measurement and cut
    that length of bias tape.


    ![DK](Images/Page_072_04.png)


    **2** Center the bias tape along the top edge of the cuff; it should extend by
    ⅜ in (1 cm) at each end. At one end, fold this extra bias tape to the back and
    keep it in place with your thumb and forefinger.


    ![DK](Images/Page_073_01.png)


    **3** Now, start to fold the bias tape in half lengthwise so that just half its
    width is visible. Pin the bias tape in place. Fold the second end of tape in,
    then fold and pin the remaining length of bias tape.


    ![DK](Images/Page_073_02.png)


    **4** Prepare your needle and thread as in [step 2](#036-039_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0075).
    Turn the cuff over and work on the inside now. Push the needle up through the
    folded edges of bias tape at the end of the cuff, so the knot is hidden.


    ![DK](Images/Page_073_03.png)'

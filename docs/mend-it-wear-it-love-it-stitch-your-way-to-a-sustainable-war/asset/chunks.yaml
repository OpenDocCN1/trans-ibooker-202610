  trans: "\n\n# 修补、穿着、热爱它\n\n## 作者简介\n\nZoe Edwards 是一位缝纫和服装制作教师，她记录缝纫历程的博客已坚持十余年。她对缝纫、材料再利用以及揭露快时尚弊端的热情，构成了她追求更可持续、更真实生活方式的一部分。她还致力于激励和帮助他人制作自己的衣物，坚信享受缝纫的乐趣不必花费巨资。她发起了广受欢迎的年度挑战活动“Me-Made-May”（五月自制月），鼓励自制衣物的人们在五月份更频繁地穿着自制服装，或尝试不同的搭配方式。其目的旨在鼓励人们将\
    \ DIY 和手工精神更坚定地融入日常生活，并与自己亲手打造的衣橱建立更良好的关系。Zoe 的博客地址为 sozowhatdoyouknow.blogspot.com，Instagram\
    \ 账号为 @sozoblog。\n\n![DK](img/DK-Logo.png)\n\n## 版权页\n\n**责任编辑** Nikki Sims, Dawn\
    \ Titmus\n\n**美版编辑** Megan Douglass\n\n**美术编辑** Amy Child, Jessica Tapolcai\n\n\
    **资深制作编辑** Tony Phipps\n\n**资深制作统筹** Stephanie McConnell\n\n**封面设计** Amy Cox\n\
    \n**封面统筹** Lucy Philpott\n\n**插画师** Steven Marsden\n\n**编辑部主任** Ruth O’Rourke\n\
    \n**美术编辑主任** Christine Keilty\n\n**美术总监** Maxine Pedliham\n\n**出版总监** Katie Cowan\n\

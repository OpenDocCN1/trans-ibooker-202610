    \ or sprayed with chemicals by individuals who inhale the fumes each day.\n\n\
    Global issue with local problems\n\nThe environmental costs, which we’ll come\
    \ to, also have an effect on the local populations indirectly involved in the\
    \ garment industry. From regions facing drought due to water supplies being diverted\
    \ to grow cotton in India and the Middle East, to local pollution around fabric-processing\
    \ plants due to the leaching of toxic chemicals and dyes into waterways.\n\nCharities\
    \ around the world, such as Fair Trade Federation, Fashion Revolution, and TRAID,\
    \ campaign to support and advocate for garment workers, and work to hold brands\
    \ and governments to account to protect their human rights. Supporting these charities\
    \ is an excellent way to make a difference straight away.\n\nHow fashion affects\
    \ the planet\n\nBut it’s not just humans affecting and exploiting other humans\
    \ in the pursuit of trend-led, affordable attire. Studies have revealed that the\
    \ clothing industry is the second-most polluting industry on Earth.\n\nFabric\
    \ and clothing production processes emit greenhouse gases—the biggest contributor\
    \ to today’s most pressing issue: climate change. Globally, the fashion industry\
    \ produces 3.6 billion tons (3.3 billion metric tons) of CO[2] per year—almost\
    \ matching the carbon footprint of the entire European Union.\n\nSynthetic or\
    \ natural?\n\nIn addition, many fibers in clothing are sourced from fossil fuels\
    \ as well. Synthetic fibers (for instance, acrylic, polyester, elastane, Lycra,\
    \ Spandex, and nylon) are plastics, formed from polymers obtained from petroleum\
    \ and other by-products of fossil fuels. When these synthetic fabrics go through\
    \ a washing machine, they release tiny plastic fibers (microplastics) into the\
    \ waterways. Marine life consumes these microplastics, which enter the food chain.\n\
    \nSpeaking of water, cotton, often lauded as one of the most sustainable of fibers,\
    \ is responsible for a staggering amount of global water consumption. Recent research\
    \ has shown that it takes 2,000–2,640 gallons (7,570–10,000 liters) of water to\
    \ make a single pair of jeans.\n\nPrecious water resources\n\nThe extraction and\
    \ diversion of water to use in cotton growing is a massive problem in many countries,\
    \ predominantly in Asia. With a population of 1.38 billion people, access to safe\
    \ water is a major issue for some in India. Nevertheless, India’s cotton industry\
    \ consumes the same volume of water in a year that could supply 85 percent of\
    \ its inhabitants with 26 gallons (100 liters) of water every day.\n\nThe use\
    \ of water for growing crops, particularly cotton, has resulted in the desertification\
    \ of some areas, such as the Aral Sea on the borders of Kazakhstan and Uzbekistan.\
    \ The speed of its disappearance is shocking: in 1960, the Aral Sea was the biggest\
    \ inland sea in the world. The fisheries and communities that relied on it have\

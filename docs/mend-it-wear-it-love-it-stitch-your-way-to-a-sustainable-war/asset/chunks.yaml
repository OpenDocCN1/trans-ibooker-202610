- raw: 'If the hem of your garment was originally sewn with barely visible stitching,
    use the slip-stitch method below to repair your hem and match it seamlessly.


    ![DK](Images/Page_037_01.png)


    **1** Using the original crease line as your guide, refold the section of loose
    hem and press the crease with an iron if necessary. Pin the hem in place, positioning
    the pins horizontally about ⅝ in (1.5 cm) below the hem’s inner edge, pointing
    left.


    ![DK](Images/Page_037_02.png)


    **2** Thread a sharp needle with a single strand of thread no longer than 18 in
    (45 cm). Tie a knot at one end of the thread. Hold the garment so the folded edge
    of the hem is facing you and sew from right to left.


    ![DK](Images/Page_037_03.png)


    **3** Secure the thread by passing the needle through the back of the hem to the
    front, about ³/[16] in (5 mm) from the top edge, so that the knot is hidden behind
    the hem.


    ![DK](Images/Page_037_04.png)


    **4** Make a stitch, no more than ⅜ in (1 cm) long, diagonally to the left by
    catching a couple of threads of the fabric just above the hem. Pull the thread
    through to complete the stitch, but don’t pull too tight.


    ![DK](Images/Page_038_01.png)


    **5** Bring the tip of the needle diagonally down and to the left. Make another
    stitch, no more than ⅜ in (1 cm) long, by catching a couple of threads of the
    hem fabric. Pull the thread through to complete the stitch. Continue in this way
    to reattach the hem.


    ![DK](Images/Page_038_02.png)


    **6** To finish, remove the pins and make two small stitches, about ³/[16] in
    (5 mm) long, on top of each other through the hem fabric only. Trim the excess
    sewing thread close to the fabric. Give your finished hem repair a gentle press
    with an iron to set the stitches.


    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    # Visible-hem method


    Mending a hem with visible stitching is even easier than with slip stitch! It’s
    time to learn how to backstitch.


    ![DK](Images/Page_038_03.png)


    **1** Carefully remove any remaining threads from the broken section of stitching.
    Position the hem with the outside of the garment facing up. If necessary, pin
    the broken section of hem back in place, positioning the pins horizontally.


    ![DK](Images/Page_038_04.png)


    **2** Refer to step 1 of [Sewing on a button](#030-031_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0056)
    for how to prepare the needle and thread. Push the needle up in between the last
    two unbroken stitches of the original row of hem stitching. Pull the needle and
    thread out from the front.


    ![DK](Images/Page_039_01.png)


    **3** Take the needle backward, away from the section of broken stitching. Push
    the needle down through the fabric one stitch length away from where it emerged.
    Pull the needle and thread down from behind; these overlapping stitches should
    prevent it from unraveling.


    ![DK](Images/Page_039_02.png)


    **4** Still holding the needle behind the hem, bring the needle back toward the
    broken section. Push the needle up through the fabric two stitch lengths to the
    left. Pull the needle and thread out from the front. Make another backstitch,
    one stitch length to the right.


    ![DK](Images/Page_039_03.png)


    **5** You have now made two stitches over the original stitching. Repeat step
    4 to continue making backstitches along the broken section of hem. Remember to
    try to match your stitch length to the original hem stitching so your stitches
    blend in.


    ![DK](Images/Page_039_04.png)


    **6** When your row of backstitches reaches the original stitching, complete two
    more stitches. Flip the hem over to the inside. To finish, remove the pins and
    make two small stitches on top of each other, behind a backstitch; these should
    not be visible from the front. Trim the excess thread.


    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    # Mending a hole from the top


    View a hole in clothes as an opportunity to have some fun! Patch over it; the
    effect can be subtle, beautiful, or bonkers. Then, celebrate your repair with
    sashiko-style stitching.


    Use this technique with patches and thread color-matched to the garment when repairing
    areas you might not wish to highlight—such as the seat of your jeans. Alternatively,
    you can use a contrasting color of thread or the patch itself on the knees, elbows,
    and anywhere else you need a talking point.


    | **You will need** || tape measure, fabric to make the patch or appliqué, fabric-marking
    tool, fabric scissors, iron, ironing board, safety pins (use dressmaking pins
    if the fabric is likely to be damaged by safety pins), hand-sewing needle, thread
    (color to match or contrast), scissors/thread snips, 100 percent cotton sashiko
    thread (optional) |


    | --- | --- |


    | **Sewing machine?** || Prepare and secure the patch or appliqué as shown in
    steps 1 to 3, then try using a wide zigzag stitch around the edge of your shape
    |


    | **Left-handed?** || Work in the opposite direction to the one shown here if
    that feels more comfortable |


    Top Tip


    Match the weight and type of patch fabric to the garment. A tightly woven fabric
    with no stretch works well for patching.


    ![DK](Images/Page_041_01.png)


    **1** Inspect the shape and position of the hole or holes, and check if the surrounding
    area is weakened or damaged at all. Decide on a shape for your patch; a simple
    rectangle or square will be easiest to begin with.


    ![DK](Images/Page_041_02.png)


    **2** Measure how wide and deep the patch will need to be to cover the hole (and
    any damaged area, as necessary). Add an extra 1 in (2.5 cm) to each side and draw
    this bigger shape out on your patching fabric with a marking tool. You can make
    your patch larger if you wish.


    ![DK](Images/Page_041_03.png)


    **3** Cut the fabric shape out carefully. With the right side of your patch facing
    down, turn each edge in by ⅜ in (1 cm) and press with an iron.


    ![DK](Images/Page_041_04.png)


    **4** Position your patch centrally over the hole or damaged area and pin it in
    place. Thread a sewing needle with a strand of thread about 39 in (1 m) long as
    shown in [step 1](#030-031_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0057). You now
    have a double thickness of thread.


    ![DK](Images/Page_042_01.png)


    **5** Start at a corner. From behind, push the needle up about ³/[16] in (5 mm)
    from the edge of the patch. Pull the needle and thread through from the front
    then push it back down about ³/[16] in (5 mm) to the left and repeat.


    ![DK](Images/Page_042_02.png)


    **6** Repeat step 5 until you’ve stitched around all the edges. Keep stitches
    an even length and ³/[16] in (5 mm) from the edge. From behind through the garment
    fabric only, make two small stitches on top of each other to finish. Trim the
    thread.


    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    # Basic sashiko-style stitching


    For additional strength and beautification, why not try some sashiko-style stitching?


    Top Tip


    If you don’t have sashiko thread, use two strands of regular thread and knot all
    four ends together (a four-ply thread).


    ![DK](Images/Page_042_04.png)


    **1** Prepare your patch as in [steps 1](#040-043_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0089)
    to [3](#040-043_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0091). Using sashiko thread
    looks great, but a similar effect can be achieved with regular thread (see [Top
    Tip](#040-043_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0096)) to sew with a four-ply
    thread. Use sashiko thread single ply with a knot in one end.


    ![DK](Images/Page_043_01.png)


    **2** Follow [step 5](#040-043_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0093) to
    complete one row of horizontal stitches. Try to keep the stitches even in length
    and finish your last stitch ³/[16] in (5 mm) from the edge of your patch.


    ![DK](Images/Page_043_02.png)'

- raw: "Zoe Edwards is a sewing and dressmaking teacher who has been blogging about\
    \ her sewing journey for over a decade. Her passions for sewing, reusing materials,\
    \ and debunking fast fashion form part of her attempts to live a more sustainable\
    \ and authentic life. She also aims to inspire and assist others in making their\
    \ own clothing, with the firm belief that enjoying sewing needn’t break the bank.\
    \ She’s the creator of the popular annual challenge Me-Made-May, which asks those\
    \ who make their own clothing to wear it more often, or in different ways, during\
    \ the month of May. The aim is to encourage people to bring the DIY and handmade\
    \ ethos more firmly into their everyday lives, and to develop a better relationship\
    \ with their handcrafted wardrobe. Zoe blogs at sozowhatdoyouknow.blogspot.com\
    \ and is on Instagram as @sozoblog.\n\n![DK](Images/DK-Logo.png)\n\n**Senior Editors**\

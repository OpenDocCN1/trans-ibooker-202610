    # Dyeing and Embroidery Techniques


    ## Dyeing


    ### Color Considerations


    Obviously, you can achieve a more intense color when using fabric dye on white
    and pale-colored garments. Dyeing darker garments will have a more subtle result,
    so for dark clothes, it might be better to stick to matching and refreshing the
    original color. Colorful clothing can also be dyed, but here color theory applies—for
    instance, using a red-colored dye on a blue-colored fabric will result in a purple
    shade. Dyeing patterned fabric is totally possible, but the design will remain
    visible afterward.


    ![DK](Images/Page_131_01.png)


    ### Natural Dyes


    Regular fabric dyes do contain some potentially polluting chemicals that will
    end up in waterways. And while re-dyeing with regular fabric dyes will have a
    lower environmental impact than discarding and replacing that garment with a new
    one, the impact of reviving your clothing will be lessened using natural dyeing
    processes instead. Natural dyes can be made with items found in your garden or
    the supermarket—onion skins, butternut squash peelings, coffee grounds, tea leaves,
    avocado skins, strawberries, cherries, lavender, red cabbage, beets, celery leaves,
    and bamboo, to name just some. The preparation of the dye is an extra step to
    factor in, and they only work on pale fabrics. But if you are looking for a subtle
    effect, then natural dyes can bring beautiful results.


    ![DK](Images/Page_131_02.png)


    ### Tie-Dye Techniques


    A plain garment can be reinvented and uniquely transformed with a tie-dye effect.
    Since regular dyeing will not cover every stain, camouflaging it with a tie-dye
    effect may be more effective. Tie-dye needn''t result in the stereotypical hippy-style
    garment. Approaches to tie-dyeing range from the intricate, detailed Japanese
    shibori to the super-simple scrunch or crumple dyeing. And when executed with
    natural dyes, the effects can be delicate and artfully stylish. Plus, it''s so
    much fun.


    ![DK](Images/Page_131_03.png)


    ### Dyeing Accessories


    It''s not just garments that can be re-dyed. If you are re-dyeing your trusty
    worn-in jeans back to black again, consider throwing in those faded canvas shoes,
    too. If you are trying to disguise a stained T-shirt with a bold shade, why not
    pop in a discolored cotton tote bag and even some socks?


    ---


    REFRESH OR ENLIVEN FADED GARMENTS AND REINVENT YOUR WARDROBE''S COLOR PALETTE
    WITH READY-TO-USE OR NATURAL FABRIC DYES.


    ![DK](Images/Page_132_01.jpg)


    ## Disguising Stains with Embroidery


    What to do when a small stain or burn mark refuses to shift from an otherwise
    perfectly good garment? If the fabric is marked but not damaged, covering it with
    a patch or appliqué may seem like overkill. Yet hiding the mark with some simple,
    discreet embroidery might just be the sweet distraction that is required.


    ### Materials Needed


    | Item | Details |

    |------|---------|

    | **You will need** | contrasting thread/s (embroidery floss, regular thread,
    or darning wool for knitwear), hand-sewing needle with a large eye, scissors/thread
    snips, fabric-marking tool |

    | **Left-handed?** | Work in the opposite direction to the one shown here if that
    feels more comfortable |


    ### Top Tip


    Embroidery thread or floss is ideal here, but a similar effect can be achieved
    using regular thread; use darning thread on knitwear.


    ### Simple Flower Motif


    Learn how to prep your thread and embroider a simple flower. Chain stitching the
    flower petals around the stain at its center could even look as if it was the
    plan all along.


    ![DK](Images/Page_135_01.png)


    **1a** Cut a length of embroidery thread about 12 in (30 cm) long, separate the
    strands to your preferred thickness (this thread is formed from six strands),
    thread the needle, and tie a knot in one end.


    ![DK](Images/Page_135_02.png)


    **1b** For regular thread, cut about 39 in (1 m) of thread, fold it in half, wet
    and pinch the loop so it becomes narrow enough to thread through the needle, and
    then tie all the ends in a knot.


    ![DK](Images/Page_135_03.png)


    **2** With a sharp-tipped fabric-marking tool, draw a basic six-point star shape
    over the center of the stain. The "arms" of the star will provide a guide for
    the position of the six petals.


    ![DK](Images/Page_135_04.png)


    **3** Push the needle up from behind, about ⅛ in (3 mm) from the center. Pull
    the needle and thread through from the front. Insert the needle as close as possible
    to where it emerged to make a loop with the thread.


    ![DK](Images/Page_136_01.png)


    **4** Angle the needle downward then push it up about ¼ in (7 mm) along one of
    the lines. Slowly pull the needle through to form a loop. Make a tiny stitch at
    the outer edge of the loop to keep it in place.


    ![DK](Images/Page_136_02.png)


    **5** Repeat steps 3 and 4 to form the other petals. Then, make a tiny stitch
    on the back of one of the petals. Pull the thread through, leaving a loop, and
    pass the needle through and pull tightly. Trim the thread.


    ### Flying Bug or Bee Motif


    Use satin stitch (a "filling" stitch) here to "color in" over a stain or burn
    mark in the shape of a bug or bee.


    ![DK](Images/Page_136_03.png)


    **1** Follow [step 1a](#134-137_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0349) or
    [1b](#134-137_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0350) to prepare your needle
    and thread. Choose one color for the body of a bug or alternate between stripes
    of black and yellow to make a bee.


    ![DK](Images/Page_136_04.png)


    **2** With a sharp-tipped fabric-marking tool, draw the body of the insect with
    an oval shape. Aim for a length between ⅝ in (1.5 cm) and ¾ in (2 cm). A crisp,
    clean outline will be most helpful.


    ![DK](Images/Page_137_01.png)


    **3** Push the needle up from behind at one end of the shape, slightly left of
    the line. Take the needle across to the line on the other side to make a straight
    stitch and pull it down from behind.


    ![DK](Images/Page_137_02.png)


    **4** From behind, bring the needle up slightly below where it first emerged.
    Pull the needle and thread through from the front. Take the needle across to the
    line slightly below the end of the previous stitch.


    ![DK](Images/Page_137_03.png)


    **5** Repeat step 4, filling in the body with smooth, horizontal stitches (remember
    to alternate colors if you want a bee). Take care not to pull the stitches too
    tight or leave them loose and baggy.


    ![DK](Images/Page_137_04.png)


    **6** Rethread your needle with white thread for a dark garment or black thread
    for a light garment. Then, follow [steps 3](#134-137_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0352)
    to [5](#134-137_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0354) to make the outlines
    of the wings with detached chain stitch.


    ## Further Resources


    ### Books


    - **Darning, visible mending, and sashiko**

    - Lily Fulop, *Wear, Repair, Repurpose: A Maker''s Guide to Mending and Upcycling
    Clothes*. Vermont: Countryman Press, 2020

    - Erin Lewis-Fitzgerald, *Modern Mending: Minimize Waste and Maximize Style*.
    Melbourne: Affirm Press, 2020

    - Nina Montenegro and Sonya Montenegro, *Mending Life: A Handbook for Repairing
    Clothes And Hearts*. Seattle: Sasquatch Books, 2020

    - Kerstin Neumüller, *Mend & Patch: A Handbook to Repairing Clothes and Textiles*.
    London: Pavilion Books, 2019

    - Katrina Rodabaugh, *Mending Matters: Stitch, Patch, and Repair Your Favorite
    Denim & More*. New York: Abrams, 2018


    ### Instagram Accounts to Follow


    - @erinlewisfitzgerald

    - @katrinarodabaugh

    - @reclaimmending

    - @thefarwoods

    - @tomofholland

    - @visible_creative_mending

    - @visiblemend



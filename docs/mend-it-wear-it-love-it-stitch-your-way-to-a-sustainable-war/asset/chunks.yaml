- raw: "Also known as a stitch ripper or quick unpicker, this sharp metal hook with\
    \ a plastic or wooden handle (and safety cover) is useful for the careful removal\
    \ of stitches. Using scissors or snips to remove stitches is more likely to result\
    \ in holes in the fabric.\n\nSewing thread\n\nGo for spools of polyester or 100\
    \ percent cotton thread made by a known brand, such as Gütermann or Coats & Clark.\
    \ Cheap or very old sewing threads are liable to break. If you bought a sewing\
    \ kit that includes thread, treat yourself to some stronger, higher-quality stuff\
    \ anyway. It’s a good idea to keep a small color range in your kit (black, white,\
    \ navy, red, gray, and cream) that should cover most of your projects, and add\
    \ other colors to your collection as you need them.\n\nNeedle threader\n\nThis\
    \ simple metal device helps you thread through the eye of a needle without the\
    \ aid of a magnifying glass. It can be invaluable when using embroidery floss\
    \ or other multistranded thread.\n\nHand-sewing needles\n\nTry to find a mixed\
    \ pack that includes needles in a range of thicknesses, which will be suitable\
    \ for different thicknesses of fabric.\n\nPins\n\nA container of sharp pins can\
    \ help you keep things in place during a repair—only an octopus could successfully\
    \ complete every project without some pins! The little plastic shapes or spheres\
    \ on the ends of pins make them easier to pick up, though these will melt if touched\
    \ by a hot iron. A pin cushion is handy to store pins while you’re working.\n\n\
    Safety pins\n\nA few safety pins in a range of sizes will come in very handy.\
    \ They can be used instead of pins for some projects to keep things in place,\
    \ and you will be less likely to prick yourself while using them. Safety pins\
    \ are also invaluable for threading elastic through a channel when making an elasticized\
    \ waistband or cuff.\n\nSmall, sharp scissors or thread snips\n\nA basic, store-bought\
    \ sewing kit may not include scissors but they are a necessary item. Cheap thread\
    \ snips are available in most craft stores, but even sharp nail scissors will\
    \ do—you just need something small with a sharp point to make precise cuts.\n\n\
    ![DK](Images/Page_016_01.png)\n\n**TOOLS FOR SEWING, PINNING, AND SNIPPING**\n\
    \ng [THE BASICS](#012-013_Mend_it_Wear_It_Love_It.xhtml#part1) g [CONTENTS](#contents.xhtml)\n\
    \n# Other equipment and useful supplies\n\nFor tackling more involved repairs\
    \ or alterations, and for creating a more professional finish, you will need to\
    \ invest in a few extra items. Many repairs will also require what are known as\
    \ “notions”—ribbons, trimmings, buttons, and fasteners, which can be found at\
    \ most craft stores.\n\nThis is next-level business: when your sewing kit grows\
    \ and can no longer be kept all together in a cookie tin! Some additional pieces\
    \ of equipment will allow you to create a flawless finish for your repairs and\
    \ alterations and will broaden your options of the types of projects you will\
    \ be able to undertake. What additions you end up collecting from the following\
    \ list will depend on your personal style and creative vision.\n\nFabric scissors\n\
    \nYou’ll need a pair of large, sharp scissors for repairs and alterations that\
    \ involve cutting fabric, such as shortening hems and adding patches. Pinking\
    \ shears help reduce fraying by cutting a zigzag edge. Keep fabric scissors for\
    \ fabric. Using them for other tasks, such as cutting paper, will blunt them,\
    \ and blunt scissors will not only cause frustration but may also damage the fabric\
    \ or garment.\n\nIron\n\nMost households have an iron, and it will allow you to\
    \ improve the finished look of your repair or alteration. It is essential for\
    \ applying patches and pockets, and using iron-on interfacing. Make sure the bottom\
    \ is clean and free from any burned-on residue.\n\nSewing machine\n\nA machine\
    \ will make most repairs and alterations quicker and more professional-looking.\
    \ For advice on [using a sewing machine](#026-029_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0049).\n\
    \nIroning board\n\nObviously an ironing board goes hand-in-hand with an iron,\
    \ but can also provide a useful surface for resting your project on while you\
    \ work. A heat-resistant surface, such as a kitchen countertop, covered with a\
    \ clean towel could be a substitute in a pinch.\n\nTop Tip\n\nIf you invest in\
    \ some fabric scissors, clearly mark them “fabric only”!\n\n![DK](Images/Page_019_01.png)\n\
    \n**TOOLS FOR NEATER FINISHING OF FABRIC**\n\nFabric scraps\n\nCreate patches,\
    \ pockets, additional lengths for hems, and reinforcement for worn-through areas\
    \ with small pieces of fabric. Harvest fabric scraps from old items that are beyond\
    \ repair. Particularly useful scraps include denim, T-shirt jersey, and woven\
    \ cotton (think old shirts).\n\nButtons\n\nYou may need to replace one rogue button\
    \ that went MIA, or you might wish to swap all the buttons on a garment to transform\
    \ its look. Like fabric scraps, buttons can be removed from old clothes. Always\
    \ keep the spare buttons that come attached to your store-bought clothing in a\
    \ safe place.\n\nBias tape\n\nSold in packs or by the yard (meter), bias tape\
    \ is a long, narrow, continuous strip of fabric with its edges folded toward the\
    \ center. It is applied over a raw or worn edge to create a new, stronger finish.\
    \ It’s available in a wide variety of widths and colors so, like elastic, you\
    \ might want to buy this on a project-by-project basis.\n\nIron-on patches\n\n\
    If you like the look of ready-made, iron-on patches, then they are a great tool\
    \ for quickly covering up a hole or stain. If you see any that appeal to you,\
    \ buy them to have on hand.\n\nIron-on interfacing\n\nAlso known as fusible interfacing,\
    \ this fabric-like material is available in white or charcoal and in a variety\
    \ of thicknesses. Interfacing is used to stabilize or add additional structure\
    \ to an area of a garment. Match the thickness of interfacing to the weight of\
    \ your fabric; for instance, use a lightweight interfacing on fine fabrics and\
    \ a heavyweight version for thicker fabrics such as denim. One side of iron-on\
    \ interfacing has tiny, dry spots of glue that are activated by the heat of an\
    \ iron; always [use a pressing cloth](#046-051_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0112)\
    \ or the glue will end up on your iron or ironing board!\n\nElastic\n\nThis stretchy\
    \ material is available in a variety of types, widths, and colors. Buy elastic\
    \ on a project-by-project basis to start with. But if you buy slightly too much\
    \ each time, you’ll end up with a stash for future projects that will save you\
    \ a trip to the store.\n\nDarning mushroom\n\nDarning is made easier using a wooden\
    \ tool called a “mushroom” (or “egg”). It provides a smooth, curved, hard surface\
    \ that you hold behind the damaged area. If you don’t have one, you could try\
    \ using an orange or the base of a drinking glass.\n\nDarning yarn\n\nPacks of\
    \ darning yarn are cheap and available in lots of colors—choose yours to make\
    \ your repair blend in or stand out.\n\nTop Tip\n\nIron-on patches often start\
    \ to peel off after a wash or two, so it is a good idea to stitch around the edges\
    \ after the initial application.\n\n![DK](Images/Page_020_01.png)\n\n**HANDY-TO-HAVE\
    \ ITEMS AND NOTIONS**\n\n![DK](Images/Page_022_01.png)Mini TOC \n\ng [CONTENTS](#contents.xhtml)\n\
    \n[Introduction](#024-025_Mend_it_Wear_It_Love_It.xhtml)\n\n[Using a sewing machine](#026-029_Mend_it_Wear_It_Love_It.xhtml)\n\
    \n[Sewing on a button](#030-031_Mend_it_Wear_It_Love_It.xhtml)\n\n[Repairing a\
    \ buttonhole](#032-033_Mend_it_Wear_It_Love_It.xhtml)\n\n[**Inspiration:** Contrasting\
    \ buttons](#034-035_Mend_it_Wear_It_Love_It.xhtml)\n\n[Repairing a hem](#036-039_Mend_it_Wear_It_Love_It.xhtml)\n\
    \n*   [Invisible-hem method](#036-039_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0073)\n\
    \n*   [Visible-hem method](#036-039_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0080)\n\
    \n[Mending a hole from the top](#040-043_Mend_it_Wear_It_Love_It.xhtml)\n\n[Basic\
    \ sashiko-style stitching](#040-043_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0095)\n\
    \n[**Inspiration:** Visible mending](#044-045_Mend_it_Wear_It_Love_It.xhtml)\n\
    \n[Patching a hole from behind](#046-051_Mend_it_Wear_It_Love_It.xhtml)"
  fmt: "\n# Tools for Sewing, Pinning, and Snipping\n\nAlso known as a stitch ripper\
    \ or quick unpicker, this sharp metal hook with a plastic or wooden handle (and\
    \ safety cover) is useful for the careful removal of stitches. Using scissors\
    \ or snips to remove stitches is more likely to result in holes in the fabric.\n\
    \n## Sewing thread\n\nGo for spools of polyester or 100 percent cotton thread\
    \ made by a known brand, such as Gütermann or Coats & Clark. Cheap or very old\
    \ sewing threads are liable to break. If you bought a sewing kit that includes\
    \ thread, treat yourself to some stronger, higher-quality stuff anyway. It's a\
    \ good idea to keep a small color range in your kit (black, white, navy, red,\
    \ gray, and cream) that should cover most of your projects, and add other colors\
    \ to your collection as you need them.\n\n## Needle threader\n\nThis simple metal\
    \ device helps you thread through the eye of a needle without the aid of a magnifying\
    \ glass. It can be invaluable when using embroidery floss or other multistranded\
    \ thread.\n\n## Hand-sewing needles\n\nTry to find a mixed pack that includes\
    \ needles in a range of thicknesses, which will be suitable for different thicknesses\
    \ of fabric.\n\n## Pins\n\nA container of sharp pins can help you keep things\
    \ in place during a repair—only an octopus could successfully complete every project\
    \ without some pins! The little plastic shapes or spheres on the ends of pins\
    \ make them easier to pick up, though these will melt if touched by a hot iron.\
    \ A pin cushion is handy to store pins while you're working.\n\n## Safety pins\n\
    \nA few safety pins in a range of sizes will come in very handy. They can be used\
    \ instead of pins for some projects to keep things in place, and you will be less\
    \ likely to prick yourself while using them. Safety pins are also invaluable for\
    \ threading elastic through a channel when making an elasticized waistband or\
    \ cuff.\n\n## Small, sharp scissors or thread snips\n\nA basic, store-bought sewing\
    \ kit may not include scissors but they are a necessary item. Cheap thread snips\
    \ are available in most craft stores, but even sharp nail scissors will do—you\
    \ just need something small with a sharp point to make precise cuts.\n\n![DK](Images/Page_016_01.png)\n\
    \n> g [`THE BASICS`](#012-013_Mend_it_Wear_It_Love_It.xhtml#part1) g [`CONTENTS`](#contents.xhtml)\n\
    \n# Other equipment and useful supplies\n\nFor tackling more involved repairs\
    \ or alterations, and for creating a more professional finish, you will need to\
    \ invest in a few extra items. Many repairs will also require what are known as\
    \ \"notions\"—ribbons, trimmings, buttons, and fasteners, which can be found at\
    \ most craft stores.\n\nThis is next-level business: when your sewing kit grows\
    \ and can no longer be kept all together in a cookie tin! Some additional pieces\
    \ of equipment will allow you to create a flawless finish for your repairs and\
    \ alterations and will broaden your options of the types of projects you will\
    \ be able to undertake. What additions you end up collecting from the following\
    \ list will depend on your personal style and creative vision.\n\n## Fabric scissors\n\
    \nYou'll need a pair of large, sharp scissors for repairs and alterations that\
    \ involve cutting fabric, such as shortening hems and adding patches. Pinking\
    \ shears help reduce fraying by cutting a zigzag edge. Keep fabric scissors for\
    \ fabric. Using them for other tasks, such as cutting paper, will blunt them,\
    \ and blunt scissors will not only cause frustration but may also damage the fabric\
    \ or garment.\n\n## Iron\n\nMost households have an iron, and it will allow you\
    \ to improve the finished look of your repair or alteration. It is essential for\
    \ applying patches and pockets, and using iron-on interfacing. Make sure the bottom\
    \ is clean and free from any burned-on residue.\n\n## Sewing machine\n\nA machine\
    \ will make most repairs and alterations quicker and more professional-looking.\
    \ For advice on [`using a sewing machine`](#026-029_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0049).\n\
    \n## Ironing board\n\nObviously an ironing board goes hand-in-hand with an iron,\
    \ but can also provide a useful surface for resting your project on while you\
    \ work. A heat-resistant surface, such as a kitchen countertop, covered with a\
    \ clean towel could be a substitute in a pinch.\n\n> **Top Tip**\n>\n> If you\
    \ invest in some fabric scissors, clearly mark them \"fabric only\"!\n\n![DK](Images/Page_019_01.png)\n\
    \n## Tools for neater finishing of fabric\n\n### Fabric scraps\n\nCreate patches,\
    \ pockets, additional lengths for hems, and reinforcement for worn-through areas\
    \ with small pieces of fabric. Harvest fabric scraps from old items that are beyond\
    \ repair. Particularly useful scraps include denim, T-shirt jersey, and woven\
    \ cotton (think old shirts).\n\n### Buttons\n\nYou may need to replace one rogue\
    \ button that went MIA, or you might wish to swap all the buttons on a garment\
    \ to transform its look. Like fabric scraps, buttons can be removed from old clothes.\
    \ Always keep the spare buttons that come attached to your store-bought clothing\
    \ in a safe place.\n\n### Bias tape\n\nSold in packs or by the yard (meter), bias\
    \ tape is a long, narrow, continuous strip of fabric with its edges folded toward\
    \ the center. It is applied over a raw or worn edge to create a new, stronger\
    \ finish. It's available in a wide variety of widths and colors so, like elastic,\
    \ you might want to buy this on a project-by-project basis.\n\n### Iron-on patches\n\
    \nIf you like the look of ready-made, iron-on patches, then they are a great tool\
    \ for quickly covering up a hole or stain. If you see any that appeal to you,\
    \ buy them to have on hand.\n\n### Iron-on interfacing\n\nAlso known as fusible\
    \ interfacing, this fabric-like material is available in white or charcoal and\
    \ in a variety of thicknesses. Interfacing is used to stabilize or add additional\
    \ structure to an area of a garment. Match the thickness of interfacing to the\
    \ weight of your fabric; for instance, use a lightweight interfacing on fine fabrics\
    \ and a heavyweight version for thicker fabrics such as denim. One side of iron-on\
    \ interfacing has tiny, dry spots of glue that are activated by the heat of an\
    \ iron; always [`use a pressing cloth`](#046-051_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0112)\
    \ or the glue will end up on your iron or ironing board!\n\n### Elastic\n\nThis\
    \ stretchy material is available in a variety of types, widths, and colors. Buy\
    \ elastic on a project-by-project basis to start with. But if you buy slightly\
    \ too much each time, you'll end up with a stash for future projects that will\
    \ save you a trip to the store.\n\n### Darning mushroom\n\nDarning is made easier\
    \ using a wooden tool called a \"mushroom\" (or \"egg\"). It provides a smooth,\
    \ curved, hard surface that you hold behind the damaged area. If you don't have\
    \ one, you could try using an orange or the base of a drinking glass.\n\n### Darning\
    \ yarn\n\nPacks of darning yarn are cheap and available in lots of colors—choose\
    \ yours to make your repair blend in or stand out.\n\n> **Top Tip**\n>\n> Iron-on\
    \ patches often start to peel off after a wash or two, so it is a good idea to\
    \ stitch around the edges after the initial application.\n\n![DK](Images/Page_020_01.png)\n\
    \n## Handy-to-have items and notions\n\n![DK](Images/Page_022_01.png)\n\n### Mini\
    \ TOC\n\n- g [`CONTENTS`](#contents.xhtml)\n- [`Introduction`](#024-025_Mend_it_Wear_It_Love_It.xhtml)\n\
    - [`Using a sewing machine`](#026-029_Mend_it_Wear_It_Love_It.xhtml)\n- [`Sewing\
    \ on a button`](#030-031_Mend_it_Wear_It_Love_It.xhtml)\n- [`Repairing a buttonhole`](#032-033_Mend_it_Wear_It_Love_It.xhtml)\n\
    - [`**Inspiration:** Contrasting buttons`](#034-035_Mend_it_Wear_It_Love_It.xhtml)\n\
    - [`Repairing a hem`](#036-039_Mend_it_Wear_It_Love_It.xhtml)\n  - [`Invisible-hem\
    \ method`](#036-039_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0073)\n  - [`Visible-hem\
    \ method`](#036-039_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0080)\n- [`Mending a\
    \ hole from the top`](#040-043_Mend_it_Wear_It_Love_It.xhtml)\n  - [`Basic sashiko-style\
    \ stitching`](#040-043_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0095)\n- [`**Inspiration:**\
    \ Visible mending`](#044-045_Mend_it_Wear_It_Love_It.xhtml)\n- [`Patching a hole\

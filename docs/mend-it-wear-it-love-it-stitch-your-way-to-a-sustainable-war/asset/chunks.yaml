  trans: "\n# 缝纫、别针与剪线工具\n\n也被称为拆线器或快速拆线器，这种带有塑料或木制手柄（和安全盖）的锋利金属钩，可用于小心地拆除针脚。用剪刀或线剪拆线更容易在织物上造成破洞。\n\
    \n## 缝纫线\n\n选择知名品牌生产的涤纶线或 100% 棉线线轴，例如 Gütermann 或 Coats & Clark。廉价或陈旧的缝纫线容易断裂。如果你买的缝纫工具包里含有线，还是建议另买一些更结实、质量更高的线。在工具包里备一小套颜色（黑、白、藏青、红、灰和奶白）是个好主意，这能应付大多数项目，需要时再往收藏里添加其他颜色。\n\
    \n## 穿线器\n\n这个简单的金属装置能帮你在不用放大镜的情况下将线穿过针眼。使用刺绣线或其他多股线时，它非常有用。\n\n## 手缝针\n\n试着找一包混合装，里面包含不同粗细的针，以适应不同厚度的面料。\n\
    \n## 别针\n\n一盒锋利的别针能帮你在修补时固定东西——只有章鱼才能在没有别针的情况下成功完成每个项目！别针末端的小塑料形状或球体让它们更容易拾起，不过碰到烫热的熨斗会融化。别针垫在工作时存放别针很方便。\n\
    \n## 大头针/安全别针\n\n几个不同尺寸的大头针会非常有用。它们可以在某些项目中代替别针固定东西，而且用的时候不太容易扎到自己。做松紧腰头或袖口时，大头针穿松紧带穿过套管也是必不可少的。\n\
    \n## 小型锋利剪刀或线剪\n\n基础的成品缝纫工具包可能不含剪刀，但剪刀是必备品。大多数手工艺店都有卖便宜的线剪，甚至锋利的指甲剪也能凑合——你只需要一种小巧且尖锐的工具来进行精确切割。\n\
    \n![DK](img/Page_016_01.png)\n\n> g `基础知识` g `目录`\n\n# 其他设备和实用辅料\n\n要应对更复杂的修补或改造，并获得更专业的完成效果，你需要投资购置一些额外物品。许多修补还需要所谓的“辅料”——丝带、装饰带、纽扣和扣件，这些在大多数手工艺店都能买到。\n\
    \n这是进阶操作：当你的缝纫工具包扩大到再也装不进一个曲奇饼干罐时！一些额外的设备能让你的修补和改造达到完美效果，并拓宽你能承接的项目类型。你最终从下列清单中添置哪些物品，取决于你的个人风格和创意构想。\n\
    \n## 布剪\n\n你需要一把大而锋利的剪刀，用于涉及剪裁面料的修补和改造，例如缩短下摆和添加补丁。齿剪通过剪出锯齿边缘来减少脱线。布剪专剪布。用来剪纸等其他用途会让它们变钝，钝剪刀不仅让人心烦，还可能损坏面料或衣物。\n\
    \n## 熨斗\n\n大多数家庭都有熨斗，它能让你改善修补或改造的成品外观。贴补丁、口袋和使用烫熨衬布时必不可少。确保底板干净，没有烧焦的残留物。\n\n\
    ## 缝纫机\n\n缝纫机能让大多数修补和改造更快、更专业。关于`使用缝纫机`的建议。\n\n## 熨衣板\n\n显然熨衣板是熨斗的标配，但也能在你工作时提供一个放置项目的实用表面。在紧急情况下，铺一条干净毛巾的耐热表面（如厨房台面）可以代用。\n\
    \n> **小贴士**\n>\n> 如果你买了布剪，请清楚地标记“仅限剪布”！\n\n![DK](img/Page_019_01.png)\n\n## 让面料收口更整齐的工具\n\
    \n### 布料碎片\n\n利用小块布料制作补丁、口袋、下摆加长布条和磨损穿孔处的加固布。从无法修复的旧物上拆下布料碎片。特别有用的碎片包括牛仔布、T 恤针织布和机织棉布（想想旧衬衫）。\n\
    \n### 纽扣\n\n你可能需要替换一颗失踪（MIA）的顽固纽扣，或者想换掉衣服上所有纽扣来改变外观。像布料碎片一样，纽扣可以从旧衣服上拆下来。一定要把新买衣服附带的备用纽扣妥善保管。\n\
    \n### 斜裁带/包边带\n\n成包或按码（米）出售，斜裁带是一条长而窄的连续布条，两边向中间折叠。它覆盖在毛边或磨损边缘上，形成新的、更牢固的边缘。有多种宽度和颜色可选，所以像松紧带一样，你可能想按项目购买。\n\
    \n### 烫熨补丁\n\n如果你喜欢现成的烫熨补丁的外观，它们就是快速遮盖破洞或污渍的好工具。看到喜欢的就买些备用。\n\n### 烫熨衬布/粘合衬\n\n\
    也称粘合衬，这种类布材料有白色或炭灰色，厚度多样。衬布用于稳固或增加衣物某部位的结构感。衬布厚度要匹配面料厚度；例如薄面料用薄衬布，牛仔布等厚面料用厚衬布。烫熨衬布一面有微小干胶点，遇熨斗热量激活；务必`使用熨烫布`，否则胶会沾到熨斗或熨衣板上！\n\
    \n### 松紧带\n\n这种有弹性的材料有多种类型、宽度和颜色。开始时按项目购买松紧带。但如果每次买得稍多一点，最后你会积攒一堆存货，为未来的项目省去跑商店一趟。\n\
    \n### 补织蘑菇/补织蛋\n\n使用一种叫“蘑菇”（或“蛋”）的木制工具能让补织更容易。它提供一个光滑、弯曲、坚硬的表面，你把它托在破损处后面。如果没有，可以试试用橙子或高脚杯底代替。\n\
    \n### 补织线\n\n补织线成包出售，便宜且颜色多样——选一种颜色让你的修补融为一体或醒目突出。\n\n> **小贴士**\n>\n> 烫熨补丁洗一两次后往往开始翘边，所以初次烫熨后沿边缘缝一圈是个好主意。\n\
    \n![DK](img/Page_020_01.png)\n\n## 实用的备用物品和辅料\n\n![DK](img/Page_022_01.png)\n\n\
    ### 迷你目录\n\n- g `目录`\n- `简介`\n- `使用缝纫机`\n- `缝纽扣`\n- `修补纽扣孔`\n- `**灵感：** 对比色纽扣`\n\
    - `修补下摆`\n  - `隐形下摆法`\n  - `明线下摆法`\n- `从正面修补破洞`\n  - `基础刺子绣风格针法`\n- `**灵感：** 可见性修补`\n\
    - `从背面贴补丁修补破洞`\n"

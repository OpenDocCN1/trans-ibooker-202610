- raw: "**5** Repeat [step 4](#056-059_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0137)\
    \ to make the first whip stitch. Continue to make a row of whip stitches along\
    \ the edge of the bias tape. Try to catch only the top layer of fabric of the\
    \ cuff with your needle.\n\n![DK](Images/Page_073_04.png)\n\n**6** At the end\
    \ of that row, push the needle through all layers of bias tape and cuff. Turn\
    \ the cuff back to work on the outside. Continue to whip stitch the bias tape\
    \ in place. Finish as in [step 6](#070-073_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0187).\n\
    \ng [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)\n\
    \n# Repairing visible topstitching\n\nTopstitching is the visible stitching that\
    \ strengthens durable areas and highlights design features. When that stitching\
    \ breaks, it can spoil the look of the garment. Allow our friend—the backstitch—to\
    \ come to the rescue.\n\n| **You will need** || scissors/thread snips, pins (optional),\
    \ hand-sewing needle, thread (color-matched topstitching thread or regular thread)\
    \ |\n\n| --- | --- |\n\n| **Sewing machine?** || Prep the repair as in step 1\
    \ and select a straight stitch on the machine. Test the stitch on a scrap of fabric,\
    \ then adjust the length of the stitch and retest until your stitching matches\
    \ that of the original topstitching |\n\n| **Left-handed?** || Work in the opposite\
    \ direction to the one shown here if that feels more comfortable |\n\n![DK](Images/Page_074_01.png)\n\
    \n**1** Carefully cut away any loose threads from the broken section of topstitching.\
    \ If the topstitching secured a pocket or other feature that is now loose or out\
    \ of position, use pins to keep it in place during stitching.\n\n![DK](Images/Page_074_02.png)\n\
    \n**2** If using topstitching thread, thread the needle as in [step 2](#036-039_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0075).\
    \ If using regular thread, use a strand 30 in (75 cm) long. Tie both ends in a\
    \ knot (so it’s double thickness) then tie a second knot.\n\n![DK](Images/Page_075_01.png)\n\
    \n**3** Use backstitch to fill in the gap of broken topstitching. From the inside,\
    \ push the needle up between the last two unbroken stitches of the original row\
    \ of topstitching. Pull the needle and thread through from the front.\n\n![DK](Images/Page_075_02.png)\n\
    \n**4** Take the needle backward (away from the broken section) by one stitch.\
    \ Push the needle down through the fabric overlapping the unbroken stitch and\
    \ bring it up two stitch lengths to the left.\n\n![DK](Images/Page_075_03.png)\n\
    \n**5** Make another backstitch, one stitch length to the right. Continue to backstitch\
    \ along the broken section of topstitching. Match the stitch length of the original\
    \ topstitching as much as possible.\n\n![DK](Images/Page_075_04.png)\n\n**6**\
    \ When your backstitching fills the gap, overlap the unbroken stitches by two\
    \ stitches. Push the needle to the back and on the inside make two small stitches\
    \ on top of each other. Trim excess thread.\n\ng [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2)\
    \ g [CONTENTS](#contents.xhtml)\n\n# Visible stitching\n\nTOPSTITCHING IS USED\

    # Refitting a garment at the seams


    Reducing the volume of a garment by taking it in at the seams can have a major
    impact on its overall look. Follow these steps to give a fresh, refined feel to
    your tops, dresses, jeans, skirts, T-shirts, and knitwear. Basically any unlined
    garment is fair game!


    | **You will need** || pins, fabric-marking tool, tape measure, hand-sewing needle,
    color-matched thread, scissors/thread snips, fabric scissors |


    | --- | --- |


    | **Sewing machine?** || Use a straight stitch where a running stitch is indicated
    in step 4 |


    Top Tip


    Resist the urge to make your garment overly fitted. You still need to move, reach,
    bend, and sit down comfortably in it. Remove a conservative amount of material
    to begin with; you can always pinch more out later.


    ![DK](Images/Page_097_01.png)


    **1** Try the garment on in front of a mirror. You can make skirts, trousers,
    dresses, and tops more form-fitting by pinching out fabric at the side seams;
    and you can slim down sleeves at the seam, too. Play around with pinching out
    fabric along the seams with your fingers and/or pins to find the look you want;
    it’s easier to do this with the item the right way around. Remove any pins.


    ![DK](Images/Page_097_02.png)


    **2** Take off the garment, turn it inside out, and put it back on. Recreate your
    desired look by placing pins parallel to the seam to indicate a new stitching
    line. Make sure you reduce the volume evenly on both sides of the garment. Carefully
    take the garment off with the pins still in place.


    ![DK](Images/Page_097_03.png)


    **3** Lay the garment out on a flat surface. Use a fabric-marking tool to mark
    the new stitching line shown by the pins. Blend the new stitching line smoothly
    into the original stitching. Repeat on the other seam. Use a tape measure to check
    that the same amount is being taken out of both seams. Remove the pins.


    ![DK](Images/Page_097_04.png)


    **4** Stabilize the stitching line by placing pins perpendicular to the seam.
    Prepare your needle and thread as in [step 2](#036-039_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0075).
    Use running stitch along your marked line (refer to [steps 4](#060-065_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0159)–[6](#060-065_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0161),
    if necessary); repeat on the other side of the garment. Trim excess fabric ⅝in
    (1.5 cm) away from the new stitching line.


    g [WEAR YOUR CLOTHES](#078-079_Mend_it_Wear_It_Love_It.xhtml#part3) g [CONTENTS](#contents.xhtml)


    # Refitting using waist-shaping darts


    Almost any hip-length or longer garment that feels a bit shapeless can be refined
    to feel and look more elegant. You can easily alter dresses, tunics, shirts, blouses,
    and tops without affecting the look from the front at all. Witchcraft? No. Waist-shaping
    darts? Yes.'

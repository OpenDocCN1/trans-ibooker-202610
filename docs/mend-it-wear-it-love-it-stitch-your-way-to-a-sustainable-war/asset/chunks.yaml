    \ visible stitches, follow the [invisible-hem method](#invisible-hem-method).\
    \ If it has a visible row of stitches, use the [visible-hem method](#visible-hem-method).\
    \ Color match the thread to the fabric for both methods.\n\n| **You will need**\

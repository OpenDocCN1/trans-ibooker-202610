  trans: "\n**5** 重复步骤 4 制作第一个绷缝针脚。继续沿斜裁带边缘制作一排绷缝针脚。尽量只挑起袖口面料的最表层。\n\n![DK](img/Page_073_04.png)\n\
    \n**6** 在该排末端，将针穿过斜裁带和袖口的所有层。将袖口翻回正面继续缝制。继续用绷缝将斜裁带固定到位。按步骤 6 所述完成。\n\ng 修补衣物 g\
    \ 目录\n\n# 修复可见的明线缝制\n\n明线缝制是可见的缝线，用于加固耐磨区域并突出设计特征。当这些缝线断裂时，会破坏服装的外观。让我们的好帮手——回针缝——来解救吧。\n\
    \n| 所需物品 | 详情 |\n| --- | --- |\n| **你将需要** | 剪刀/剪线钳、大头针（可选）、手缝针、线（颜色匹配的明线缝制线或普通线）\
    \ |\n| **缝纫机？** | 按步骤 1 准备修补，并在机器上选择直线缝。在废布上试缝，然后调整针脚长度并再次试缝，直到你的缝线与原明线缝制相匹配 |\n\
    | **左撇子？** | 如果觉得更舒服，可按此处所示的相反方向操作 |\n\n![DK](img/Page_074_01.png)\n\n**1** 小心剪去断裂明线缝制处的任何松散线头。如果明线缝制固定的口袋或其他部位现已松动或移位，用大头针在缝制过程中将其固定到位。\n\
    \n![DK](img/Page_074_02.png)\n\n**2** 若使用明线缝制线，按步骤 2 穿针。若使用普通线，取长 30 英寸（75 厘米）的一股线。将两端打结（使其变成双股），再打第二个结。\n\
    \n![DK](img/Page_075_01.png)\n\n**3** 用回针缝填补断裂明线缝制的空隙。从里面开始，在原明线缝制排最后两个完好的针脚之间将针向上穿出。从正面将针线拉出。\n\
    \n![DK](img/Page_075_02.png)\n\n**4** 将针向后（远离断裂部分）移动一个针脚距离。将针穿过面料，重叠在完好的针脚上，然后向左前方提起两个针脚长度的位置。\n\
    \n![DK](img/Page_075_03.png)\n\n**5** 再做一个回针缝，向右一个针脚长度。继续沿断裂的明线缝制部分回针缝。尽可能匹配原明线缝制的针脚长度。\n\
    \n![DK](img/Page_075_04.png)\n\n**6** 当回针缝填满空隙后，重叠完好的针脚两针。将针穿到背面，在里面在同一位置做两个小针脚固定。剪去多余线头。\n\
    \ng 修补衣物 g 目录\n\n# 可见缝线\n\n明线缝制用于突出和加固缝线及设计细节，且易于修复。\n\n![DK](img/Page_076_01.jpg)\n\
    \n![DK](img/Page_078_01.png)\n\n**迷你目录**\n\ng 目录\n\n- 简介\n- 缩短下摆\n- 加长下摆\n  -\
    \ 添加对比色边条\n  - 制作荷叶边\n- **灵感：** 对比色边条、滚边和荷叶边\n- 添加简单贴袋\n- **灵感：** 贴袋\n- 在缝线处修改版型\n\
    - 使用腰部塑形省道修改版型\n- 放大服装\n- 拆除袖子\n  - 针对梭织服装\n  - 针对针织/针织面料服装\n- 给下摆和袖口加松紧带\n  -\
    \ 超快速方法\n  - 制作套管\n- **灵感：** 松紧袖口和裤脚\n\ng 穿着衣物 g 目录\n\n# 简介\n\n你如何处理那些虽未损坏、无需修补，却几乎从不或从未穿着的衣物？本章分享大量创意和必要技巧，助你将服装改造成你的新宠装扮。\n\
    \n你衣橱里的每一件服装都可以像你一样独一无二。本书这一部分提供丰富的灵感和技术指导，助你实现这一目标。\n\n**问题出在哪？**\n\n你衣橱里目前有多少件服装符合此描述：没有明显的“问题”，但你就是不想再穿了？下摆完好，拉链不卡，没有洞眼或开裂的缝线需要修补。你曾经喜欢它——毕竟，曾经你决定拥有它。也许你们共度过愉快的最初几次穿着。但不知为何，如今换衣时它总被略过。它不再作为一件衣物发挥作用，沦为“衣橱填充物”，其唯一明显作用似乎只是让你更难找到想穿的衣服。\n\
    \n抽出时间发挥创意，灵活运用你日益精进的缝纫技巧，让不再喜爱的服装焕发新生。\n\n**可持续思考**\n\n你当然可以直接把那件衣服送去二手店。然而，捐赠的衣物只有极小部分能作为衣物转售。大多数被出口到国外市场，或被转卖制成抹布。\n\
    \n可持续和遵循慢时尚，关乎考量制作一件服装所投入的所有能源、资源和劳动，首先解决问题要好得多。\n\n服装的演变不必止步于设计师和服装工人手中。\n\n\
    **给服装第二次机会**\n\n有时你清楚不喜欢服装的哪里：版型略显邋遢，下摆拖地，或就是没有放手机的口袋。但有时诊断问题（或问题们）更难。原因或许更偏向审美而非实用，因此问题显得更抽象。发现他人使用的新颖想法和方法，往往能激发你如何让衣橱里的一两件服装焕然一新的灵感。\n\
    \n仅因服装让人觉得“有点微妙”就与它彻底告别，似乎太可惜了。抽出时间发挥创意，灵活运用你日益精进的缝纫技巧，让那些不再喜爱的服装焕发新生。\n\n**小调整还是大改造？**\n\
    \n也许你会选择将裤子缩短 ¾ 英寸（2 厘米），使其*恰到好处*地落在脚踝处。或者你可能尝试给及膝裙加长成中长裙，添加醒目的对比色荷叶边。无论哪种方式，这一系列修改和改造创意或许能让你重新对穿某件衣服感到兴奋。\n"

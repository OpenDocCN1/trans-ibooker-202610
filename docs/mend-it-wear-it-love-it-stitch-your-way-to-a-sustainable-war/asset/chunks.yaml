    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    # Darning a hole


    Discovering a hole in your favorite sweater or knitted garment can be sad, but
    it needn’t spell the end. Hole-darning is a little more time consuming than other
    repairs in this book, but channeling your inner grandma is really worth it to
    extend the life of your clothes.


    | **You will need** | darning needle, darning yarn (choose a close color match
    for a repair that will blend in or a contrast color to create a visible repair),
    scissors/thread snips, darning mushroom or egg (or base of a drinking glass or
    orange) (optional) |

    | --- | --- |

    | **Left-handed?** | Work in the opposite direction to the one shown here if that
    feels more comfortable |


    ![DK](Images/Page_052_01.png)


    **1** Thread a darning needle with a strand of darning yarn about 20 in (50 cm)
    long. Leave the end unknotted. With the item right-side up (with a darning mushroom
    beneath), insert the point of the needle about ⅝ in (1.5 cm) away from the hole.


    ![DK](Images/Page_052_02.png)


    **2** Hold the needle at the front of the garment throughout. Push the point of
    the needle out again, ⅛ in (4 mm) from where it was inserted. Pull the needle
    and thread out and upward from above, but leave a tail of thread about 1⅝ in (4
    cm) long.


    ![DK](Images/Page_053_01.png)


    **3** Continue to weave the needle in and out of the fabric, making a row of running
    stitches. Try to keep the stitches small and even, no more than ⅛ in (4 mm) in
    length. Continue until the row extends at least ⅝ in (1.5 cm) above the hole.


    ![DK](Images/Page_053_02.png)


    **4** At the end of the row, leave a tiny loop of yarn, change direction, and
    sew another row of running stitches, close to the first but heading downward.
    Continue to go up and down in this way to cover the whole area. The tiny loops
    of yarn at the end of rows allow for shrinkage.


    ![DK](Images/Page_053_03.png)


    **5** Make horizontal rows of running stitch, weaving in and out of the vertical
    stitches when over the hole. This will create a new “fabric” over the hole. Don’t
    worry if it doesn’t look dense over the hole, as the darning yarn will become
    fuzzy through wear and bulk out.


    ![DK](Images/Page_053_04.png)


    **6** During the repair, it is likely that you will need to rethread your needle
    with more yarn, and by the end there will be loose threads around the edge of
    the darning. Take each loose end in turn, thread it on to your needle, and weave
    it into the repair to hide and secure it.


    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    # Visible darning


    MENDING KNITWEAR OFFERS A GREAT OPPORTUNITY TO HAVE FUN. DON’T BOTHER TRYING TO
    MATCH COLORS—ADD A CONTRAST COLOR POP INSTEAD.


    ![DK](Images/Page_054_01.jpg)


    © KATE SEKULES


    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    # Mending a tear


    By this point, you’ve got a few tricks up your sleeve for dealing with holes in
    your garment. But what if that sleeve has a tear or a rip in it? Fear not, here
    are two more tricks.


    | **You will need** | |

    | --- | --- |

    | **Robust repair:** | iron-on interfacing, fabric scissors, iron, ironing board,
    pressing cloth, hand-sewing needle, color-matched thread, scissors/thread snips
    |

    | **Less-visible repair:** | pins, fabric-marking tool, hand-sewing needle, color-matched
    thread, scissors/thread snips, iron, ironing board |


    | **Sewing machine?** | |

    | --- | --- |

    | **Robust repair:** | follow steps 1 and 2, then use a wide zigzag stitch over
    the tear instead of the whip stitch |

    | **Less-visible repair:** | follow steps 1 and 2, then use a straight stitch
    (set to length 2) instead of the running stitch |


    **Top Tip**


    If the area around a tear is damaged, you may need to patch it (see [Mending a
    hole from the top](#040-043_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0087)). If it’s
    just a rip or tear, use one of the methods shown here.


    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    # Robust repair


    Let’s revisit and redeploy the [whip stitch](#046-051_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0103).
    Although more visible than the next method, this method creates a more stable,
    secure repair for garments that get a lot of use.


    ![DK](Images/Page_057_01.png)


    **1** Choose iron-on interfacing of a similar weight to the fabric of your garment;
    it will stabilize the torn area ahead of stitching. Cut out a rectangle about
    1 in (2.5 cm) wide and 1 in (2.5 cm) longer than the tear.


    ![DK](Images/Page_057_02.png)


    **2** Place the garment wrong side up on an ironing board. Butt the edges of the
    tear together and position the interfacing (glue-side down) over the tear. Using
    a pressing cloth, carefully press with an iron.


    ![DK](Images/Page_057_03.png)


    **3** With the right side up, prepare your needle and thread as in [step 2](#036-039_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0075).
    Starting just below and at least ⅛ in (3 mm) to the side of the tear, push the
    needle up from behind and pull it out from the front.


    ![DK](Images/Page_057_04.png)


    **4** Take the needle across to the other side of the tear. Push it through the
    fabric to make a stitch that straddles the tear. Pull the needle and thread down
    from behind. Don’t pull too tightly to avoid “pinching.”


    ![DK](Images/Page_058_01.png)


    **5** From behind, take the needle diagonally upward. Push the needle up through
    the interfacing and the fabric, this time about ⅛ in (3 mm) above the first stitch.
    Pull the needle and thread out from the front. Repeat step 4 to complete stitch
    two.


    ![DK](Images/Page_058_02.png)


    **6** Repeat steps 4 and 5 to create an even “ladder” of stitches along the length
    of the tear. Make one or two extra stitches beyond the end of the tear. Then,
    from the back make two small stitches on top of each other. Trim the excess thread.


    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    # Less-visible repair


    Running stitch helps create a less-visible mend (great for patterned fabric, less
    so for fabrics that fray).


    ![DK](Images/Page_058_03.png)


    **1** Fold the garment with the right sides facing so that the length of the tear
    runs along the folded edge. Keep the fabric flat and in position by placing pins
    perpendicular to the fold.


    ![DK](Images/Page_058_04.png)


    **2** With the item flat, draw a guide for the stitching—a smooth, curved line
    that runs about ³/[16] in (5 mm) from the edge of the tear—with a fabric-marking
    tool. Start and finish about ⅜ in (1 cm) from each end.


    ![DK](Images/Page_059_01.png)


    **3** Prepare your needle and thread as in [step 2](#036-039_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0075).
    Starting very close to the folded edge, push the needle up from behind through
    both layers of fabric. Pull the needle and thread out from the front.


    ![DK](Images/Page_059_02.png)


    **4** Push the needle back down about ⅛ in (3 mm) further along the line. Pull
    the needle and thread down from behind. The aim is for tight stitches, but try
    to keep the fabric flat and avoid puckering.


    ![DK](Images/Page_059_03.png)


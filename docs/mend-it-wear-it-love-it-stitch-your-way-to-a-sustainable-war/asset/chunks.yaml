    ## Patching a hole from behind


    You’ve learned how to [patch from the top](#040-043_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0087),
    now let’s add a few more hole-repair approaches to your repertoire. Patching a
    hole or damaged area from the inside gives you a more discreet fix while preventing
    the issue from getting worse. Here are three ways to do it.


    | **You will need** | |

    | --- | --- |

    | **Patching robust garments:** | scissors/thread snips, tape measure, fabric-marking
    tool, ruler (optional), fabric to make the patch (tightly woven fabrics with no
    stretch work best), fabric scissors, safety pins or pins, hand-sewing needle,
    thread, 100 percent cotton sashiko thread (optional) |

    | **No-sew method:** | scissors/thread snips, iron-on interfacing, iron, ironing
    board, pressing cloth |

    | **Stitching for strength:** | fabric-marking tool, tape measure, ruler (optional),
    iron-on interfacing, fabric scissors, iron, ironing board, pressing cloth, hand-sewing
    needle, color-matched thread or 100 percent cotton sashiko thread, scissors/thread
    snips |


    | **Sewing machine?** | Use for [Stitching for strength](#046-051_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0116)
    |

    | **Left-handed?** | Work in the opposite direction to the one shown here if that
    feels more comfortable |


    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    ### Patching robust garments


    Use this method to fix holes in robust garments—jeans, trousers, and unlined jackets.
    The colors of the patch and thread will help this repair either stand out or blend
    in.


    ![DK](Images/Page_047_01.png)


    **1** Lay the item right-side up and inspect the hole. Trim any threads from the
    hole’s inner edge. Consider the patch’s size and shape to cover the hole (and
    weakened area), then add ¾ in (2 cm) or so all round.


    ![DK](Images/Page_047_02.png)


    **2** With a fabric-marking tool, draw this shape directly onto the garment—it
    should cover the damaged area generously. Shapes with straight edges are easier
    to work with, so draw along a ruler or tape.


    ![DK](Images/Page_047_03.png)


    **3** Using the shape you’ve drawn as a template, cut a patch out of scrap fabric
    that matches its size and shape. Position the patch on the inside so its outline
    matches the drawn shape. Pin in place.


    ![DK](Images/Page_047_04.png)


    **4** Prepare a needle and thread as in [step 1](#040-043_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0097).
    Push the needle up from behind ⅜ in (1 cm) from the patch’s edge. Sew running
    stitch around all edges, secure, and trim thread (see [steps 5](#040-043_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0093)
    and [6](#040-043_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0094)).


    ![DK](Images/Page_048_01.png)


    **5** With some new thread, prepare your needle and thread as before. Now, you
    will create a whip stitch around the edge of the hole. Push the needle up from
    behind through both layers, about ³/[16] in (5 mm) from the edge of the hole.
    Pull the needle and thread through at the front.


    ![DK](Images/Page_048_02.png)


    **6** Push the needle back down just inside the edge of the hole into the patch
    fabric. Pull the needle and thread down at the back. For the next stitch, move
    the needle diagonally to one side and push it up again to the front, close to
    your first whip stitch. Pull the needle and thread through at the front.


    ![DK](Images/Page_048_03.png)


    **7** Continue to whip stitch all around the edge of the hole. To finish, take
    your needle to the back and make two small stitches on top of each other through
    the garment fabric only; they shouldn’t be visible from the front. Trim the excess
    thread and remove any fabric marking.


    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    ### No-sew method


    This simple no-sew method is great for tackling very small holes, particularly
    on jersey garments and thinner fabrics.


    ![DK](Images/Page_049_01.png)


    **1** Choose an appropriate weight of iron-on interfacing and cut out a circle
    that will easily cover the hole. Position the circle, glue-side down, over the
    hole on the inside of the garment. Using a pressing cloth to avoid any glue (see
    [Top Tip](#046-051_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0115)), press with the
    iron. The interfacing requires heat to stick, but check your garment can take
    the heat.


    ![DK](Images/Page_049_02.png)


    **2** Check that the interfacing is properly applied: try picking at the edge
    with a fingernail. If the interfacing starts to come away, press down with the
    iron for longer or, if possible, increase the heat of the iron. Do be careful
    not to scorch the fabric!


    #### Top Tip


    Always use a pressing cloth between iron and interfacing or interfacing and ironing
    board to avoid getting glue in the wrong place. A light- or medium-weight 100
    percent cotton fabric—an old, clean handkerchief or section of bedsheet—would
    work well as a pressing cloth.


    g [MEND YOUR CLOTHES](#022-023_Mend_it_Wear_It_Love_It.xhtml#part2) g [CONTENTS](#contents.xhtml)


    ### Stitching for strength


    Add the first and second methods together and you get this technique, which combines
    the stabilizing interfacing with extra stitching for strength—perfect for areas
    that get a lot of wear and tear but you don’t wish to highlight.


    ![DK](Images/Page_050_01.png)


    **1** Lay out the garment and inspect the damaged or weakened area. Hold the fabric
    up to the light to see how far it extends. On the inside of the garment, draw
    a shape that will cover this area with a fabric-marking tool. Extend the shape
    by ¾ in (2 cm) on all sides.


    ![DK](Images/Page_050_02.png)


    **2** Choose a weight of iron-on interfacing that matches the thickness of the
    garment fabric (the undamaged part). Referring to the guide you made in step 1,
    cut the required shape out of the interfacing. Follow the [No-sew method](#046-051_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0112)
    to apply the interfacing to the inside of the garment using an iron.


    ![DK](Images/Page_050_03.png)


    **3** Thread a needle with sashiko thread, or prepare four-ply thread using regular
    thread as in [step 1](#040-043_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0097) (see
    [Top Tip](#040-043_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0096)). Try to use a
    thread that matches the color of your garment fabric as closely as possible. Turn
    the item right-side out and follow [steps 2](#040-043_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0098)
    to [5](#040-043_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0101) to cover the damaged
    area with neat, sashiko-style cross stitches.


    #### Using a sewing machine


    ![DK](Images/Page_051_01.png)


    # The Human and Environmental Cost of Fast Fashion


    It’s almost impossible to list every job involved to produce every piece of fast
    fashion, but it’s likely that almost all of these jobs are poorly paid in unhealthy
    working conditions. Every sparkly top has had its beads and sequins laboriously
    stitched on by hand, often by the small fingers of children. Every pair of faux-worn
    jeans has been sandblasted, hand-sanded, or sprayed with chemicals to achieve
    the effect by (often poorly protected) individuals who inhale the fumes each day.


    To achieve a faux-worn effect, jeans are sandblasted, hand-sanded, or sprayed
    with chemicals by individuals who inhale the fumes each day.


    ## Global Issue with Local Problems


    The environmental costs, which we’ll come to, also have an effect on the local
    populations indirectly involved in the garment industry. From regions facing drought
    due to water supplies being diverted to grow cotton in India and the Middle East,
    to local pollution around fabric-processing plants due to the leaching of toxic
    chemicals and dyes into waterways.


    Charities around the world, such as Fair Trade Federation, Fashion Revolution,
    and TRAID, campaign to support and advocate for garment workers, and work to hold
    brands and governments to account to protect their human rights. Supporting these
    charities is an excellent way to make a difference straight away.


    ## How Fashion Affects the Planet


    But it’s not just humans affecting and exploiting other humans in the pursuit
    of trend-led, affordable attire. Studies have revealed that the clothing industry
    is the second-most polluting industry on Earth.


    Fabric and clothing production processes emit greenhouse gases—the biggest contributor
    to today’s most pressing issue: climate change. Globally, the fashion industry
    produces 3.6 billion tons (3.3 billion metric tons) of CO[2] per year—almost matching
    the carbon footprint of the entire European Union.


    ### Synthetic or Natural?


    In addition, many fibers in clothing are sourced from fossil fuels as well. Synthetic
    fibers (for instance, acrylic, polyester, elastane, Lycra, Spandex, and nylon)
    are plastics, formed from polymers obtained from petroleum and other by-products
    of fossil fuels. When these synthetic fabrics go through a washing machine, they
    release tiny plastic fibers (microplastics) into the waterways. Marine life consumes
    these microplastics, which enter the food chain.


    Speaking of water, cotton, often lauded as one of the most sustainable of fibers,
    is responsible for a staggering amount of global water consumption. Recent research
    has shown that it takes 2,000–2,640 gallons (7,570–10,000 liters) of water to
    make a single pair of jeans.


    ### Precious Water Resources


    The extraction and diversion of water to use in cotton growing is a massive problem
    in many countries, predominantly in Asia. With a population of 1.38 billion people,
    access to safe water is a major issue for some in India. Nevertheless, India’s
    cotton industry consumes the same volume of water in a year that could supply
    85 percent of its inhabitants with 26 gallons (100 liters) of water every day.


    The use of water for growing crops, particularly cotton, has resulted in the desertification
    of some areas, such as the Aral Sea on the borders of Kazakhstan and Uzbekistan.
    The speed of its disappearance is shocking: in 1960, the Aral Sea was the biggest
    inland sea in the world. The fisheries and communities that relied on it have
    been decimated, and what remains is increasingly polluted by fertilizers and pesticides.


    It takes 2,000–2,640 gallons (7,570–10,000 liters) of water to make a single pair
    of jeans.


    ### How Textiles Are Made


    Sadly, pesticides, herbicides, and fertilizers impact the local population wherever
    non-organic natural fibers are grown for clothing production. It is impossible
    to prevent them from reaching neighboring farms, nor to stop the run-off into
    local waterways.


    The processing of many types of fiber destined to become fabric also requires
    vast quantities of harmful chemicals. Regenerated fibers including rayon/viscose,
    for instance, started life as wood pulp. These tough plant materials are broken
    down using a chemical and mechanical process involving sodium hydroxide, carbon
    disulfide, ammonia, and other chemicals depending on the fiber source. This forms
    a viscous liquid that is then spun into threads using sulfuric acid. As well as
    the environmental hazards, exposure to some of these chemicals has been proven
    to lead to a host of detrimental effects on the health of textile workers, including
    nerve damage, heart disease, mental deterioration, and strokes.


    The production of regenerated fibers has caused deforestation of rainforests,
    resulting in the displacement of communities and habitat destruction for many
    species, and ancient forests are being cleared for lucrative bamboo plantations
    for bamboo textiles.


    ### All Such a Waste


    At the other end of the life of a garment, the US alone is responsible for sending
    21 billion pounds (9.5 billion kg) of clothing to the landfill every year. Synthetic
    fibers, which are effectively plastic, are unable to biodegrade. And even though
    fabrics made from natural fibers (cotton, wool, linen, hemp, and silk) and regenerated
    fibers (rayon/viscose, bamboo, Tencel/lyocell, modal, cupro) are able to biodegrade,
    they will release toxic chemicals into the ground from the finishes and dyes they
    carry.


    Then, there is the CO[2] produced from the transportation of fibers, fabrics,
    and finished garments around the world. A single garment will likely have clocked
    up thousands of miles (kilometers) of travel before arriving at the store, ready
    for you to buy it and take it home.


    ## The Future of Slow Fashion


    We need to play our part by embracing the concept of slow fashion. Being able
    to prolong the life of the clothes we own and wear already is the first step.
    We can’t undo the impact of the clothes we have already bought, but we can take
    meaningful steps going forward to mend, wear, and love those clothes more.


    ![DK](Images/Page_012_01.png)


    ## Mini Table of Contents


    - [CONTENTS](#contents.xhtml)

    - [Your basic sewing kit](#014-017_Mend_it_Wear_It_Love_It.xhtml)

    - [Other equipment and useful supplies](#018-021_Mend_it_Wear_It_Love_It.xhtml)

    - [THE BASICS](#012-013_Mend_it_Wear_It_Love_It.xhtml#part1)

    - [CONTENTS](#contents.xhtml)


    # Your Basic Sewing Kit


    You may be lucky and own some of these items already. If not, basic sewing kits
    are available that already include most of the items covered here. Over the next
    few pages, we list everything you need for repairing clothes by hand.


    Once upon a time, it was common for every household to own a basic (or not so
    basic) sewing kit. Perhaps you have some memories of a sewing kit that used to
    belong to older family members. Well, it’s time you got your very own! Think of
    it as a rite of passage for any adult committed to caring for their clothes. Then,
    hopefully, as you repair and rework one garment after another, over time you will
    create memories with your own trusty little kit. Like how you rescued the hem
    of your favorite work trousers. Or the time you repaired the topstitching on your
    most flattering jeans. Or that other time when you saved your dignity by replacing
    the most “strategic” of buttons on your blouse!


    Ah, happy memories.


    > **Top Tip**

    >

    > Once you have collected the basic items, try to keep them together in one container
    (box, bag, or tin, say) so you can grab them quickly when a repair or alteration
    becomes necessary.


    ## Tools for Marking and Measuring


    ![DK](Images/Page_015_01.png)


    ### Tape Measures


    Fancier, retractable tape measures are available, but the basic ribbon kind works
    perfectly fine!


    ### Fabric-Marking Tools


    A wide range of fabric-marking tools are available, from the basic triangle-shaped
    tailor’s chalks and chalk wheels that dispense chalk dust, to marker pens with
    ink that disappears when you iron or wash it. Buy whichever tool appeals to you
    and experiment with using it.


    ### Seam Ripper


- raw: 'The general rule is: structured garments and those that require ironing should
    be hung up; everything else either can or definitely should be put away flat (folded
    or rolled). Jeans, cords, and robust trousers can be hung or folded, depending
    on space. Knitwear and knit fabric garments, including T-shirts, knit dresses,
    and sweatshirts, should always be folded or rolled so their weight doesn’t distort
    their shape.


    Hang it up


    Keep structured coats and jackets hung up on wide, sturdy hangers that properly
    extend into the shoulders. Coats and jackets, as well as other button-up garments
    such as shirts, blouses, and shirt-dresses, are all best kept with their top button
    done up, plus at least every other one, to help retain their structure. Never
    use wire coat hangers because they can rub and damage the fabric over time.


    HANG UP STRUCTURED CLOTHES


    ![DK](Images/Page_121_03.png)


    Don’t cut off the hanging loops


    If your hanging garments include hanging loops, use them. The loops help distribute
    the pressure put on the garment when it’s hung up. They also keep slippery garments
    from sliding off their hangers and ending up in a pile at the bottom of the closet.


    USE THE HANGING LOOPS


    ![DK](Images/Page_121_02.png)


    Customize clip hangers


    The ideal skirt hangers include padding where the hanger grips the garment to
    prevent indentations. If yours do not have these, insert rectangles of fabric
    between the clips to sandwich the garment in the middle to provide some DIY cushioning.


    ADD PADDING TO CLIP HANGERS


    ![DK](Images/Page_121_01.png)


    Keep out of the sun


    Some people like clothing racks for an at-a-glance shot of what outfits are available;
    however, sunlight can permanently discolor and weaken fabric, so clothes fare
    best inside a closet. Consider buying fabric hanging storage bags for off-season
    garments that need to be hung but don’t fit inside a closed closet.


    STORE AWAY FROM THE SUN


    ![DK](Images/Page_122_01.png)


    Fold, roll, and repeat


    For garments that are stored flat in drawers or boxes, consider either rolling
    and storing on their sides, or folding in a way that they can be filed in rows.
    When you open the box or drawer, you can see the entire contents at a glance,
    plus it’ll be easier to remove items without disturbing the contents.


    Air your closet regularly


    Two other causes of clothing damage are moths and mold or mildew. Like most things
    in life, prevention is better than cure, so keep your closet well ventilated.
    Moths hate light and movement, so air your closet and drawers every couple of
    months and move clothes around. It is their larvae, rather than the moths themselves,
    that cause clothing damage, so put them off wanting to make your closet their
    home. Vacuum your closet’s corners and crevices often to nip any potential infestations
    in the bud.


    AIR YOUR CLOSET


    ![DK](Images/Page_122_03.png)


    Target the pesky moths


    Moth larvae love nothing more than feasting on keratins—these are found in animal-based
    fibers (wool, mohair, cashmere, silk, leather, felt, and feathers). Regularly
    inspect these items for the first signs of holes. Wash or dry clean any clothes
    that do show signs of moth holes immediately. Dry cleaning is the best way to
    kill moth larvae. The effectiveness of mothballs and cedar repellents is debatable.


    Rotate your wardrobe


    The best tactic to keep air circulating around your closet is to steer clear of
    overfilling it. That might mean packing away out-of-season and rarely used garments.
    Before doing this, make sure those garments are freshly washed or dry cleaned
    and are bone dry. Pests are attracted to the oil from our skin and food residues.


    Ban condensation


    Mold and mildew are caused by condensation and damp, and there are a number of
    moves you can make to stop them from appearing on your clothes. Hang wet clothes
    out to dry as soon as possible. And check that laundry is fully dry before putting
    it away. If your home suffers from condensation problems, it’s probably a good
    idea to invest in a dehumidifier product specifically for closets.


    DEHUMIDIFY IF NEEDED


    ![DK](Images/Page_122_04.png)


    Find a permanent storage that works


    There are various types of containers available for packing away clothing. All
    appear to have their pros and cons, but arguably, air-tight plastic storage bins
    or vacuum or compression storage bags should provide the best protection from
    both pests and damp.


    MINIATURIZE STORAGE


    ![DK](Images/Page_122_02.png)


    g [LOVE YOUR CLOTHES](#116-117_Mend_it_Wear_It_Love_It.xhtml#part4) g [CONTENTS](#contents.xhtml)


    # Laundry and ironing tips


    How, and how often, you wash your clothes greatly affects the lifespan of garments.
    And laundering accounts for a huge proportion of a garment’s carbon footprint.
    Discover how to treat both your clothing and the planet with care.


    However long you’ve been doing the washing, learn how new laundry habits can benefit
    your newly revamped wardrobe.


    Wash clothes less


    Before automatically throwing a garment into the laundry basket, ask yourself
    if it really needs washing. If a garment has had no contact with sweat and isn’t
    stained, you can wear it multiple times before you need to wash it. Repeated laundering
    breaks down the fibers and fades colors, making garments look old and worn more
    quickly. And clothes made from synthetic fibers release microplastics with each
    wash, which enter waterways and the food chain.


    WASH INFREQUENTLY


    ![DK](Images/Page_125_01.png)


    Naturally neutralize smells


    Don’t rush to wash clothing that looks fine, but smells a little musty or has
    lingering odors from cooking and so on. Neutralize the smell by hanging it up
    for a couple of hours by an open window or in an outside space. Another option
    is the “hang it while you shower” approach—the steam encourages the fibers to
    release any odor particles and any wrinkles, too.


    FRESHEN UP OUTDOORS


    ![DK](Images/Page_125_02.png)


    Out, damned spot!


    If an otherwise clean-looking garment is sporting a small mark, avoid the damage
    a full wash will do by spot-cleaning instead. A more extensive guide to the removal
    and pretreatment of all kinds of [stains](#128-129_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0336)
    is. But the best way to deal with a small stain is to rub the marked area with
    the corner of a clean, damp cloth and some hand soap. Rub again with a soap-free
    corner of the damp cloth and leave to dry.


    SPOT-CLEAN SMALL MARKS


    ![DK](Images/Page_125_03.png)


    Wash like with like


    Always separate your light-, bright-, and dark-colored fabrics and wash like-with-like
    to avoid dye run-off and prematurely tired-looking clothes. Get to know which
    garments require handwashing or dry cleaning by checking the garment care labels,
    and wash everything else at 86°F or 104°F max. Fasten any zippers or buttons to
    prevent damage, and wash all garments inside out to reduce pilling caused by the
    friction of garments rubbing together.


    SEPARATE LIGHTS AND DARKS


    ![DK](Images/Page_125_04.png)


    Hands down: the best method


    Tailored garments such as coats and jackets will need professional dry cleaning
    to retain their shape. However, unstructured and soft garments that are labeled
    “dry clean only” can be hand-washed instead of professional dry cleaned. Always
    clean the sink you will be using to avoid traces of grease being transferred onto
    clothes. Make sure the water temperature is cold or tepid, and use a laundry detergent
    specifically designed for handwashing. After handwashing, you can hang lightweight
    garments to drip dry. Lie heavier-weight items such as knitwear flat on a towel
    to dry, as hanging may distort the shape of the garment.


    HAND-WASH DELICATE ITEMS


    ![DK](Images/Page_126_01.png)


    Line drying is best'

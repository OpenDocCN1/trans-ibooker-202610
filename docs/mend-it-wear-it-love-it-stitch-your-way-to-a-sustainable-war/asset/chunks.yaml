- raw: "Tumble drying takes a massive toll on your clothes; the additional friction\
    \ and intense heat creates pilling, weakens and breaks down fibers, and can cause\
    \ shrinking and fading. It also uses an enormous amount of energy—for a typical\
    \ load that was washed at 104°F then dried in a tumble dryer, 75 percent of the\
    \ carbon footprint is attributed to the drying. Hanging clothes outside on a line\
    \ or drying rack, whenever possible, will do wonders for the longevity of your\
    \ clothing, and significantly lessen their environmental impact. When the weather\
    \ is poor or if you have no outside space, consider hanging laundry on a clothes\
    \ horse or drying rack in a well-ventilated room where it won’t get in your way.\
    \ A bathroom that sees little use during the day with a window open is ideal.\n\
    \nLINE DRY IF POSSIBLE\n\n![DK](Images/Page_126_03.png)\n\nThe iron-free approach\n\
    \nIroning is another laundry process that can damage clothing and uses energy\
    \ that might be avoided entirely. Ward off the formation of wrinkles by removing\
    \ your clean clothes from the machine as soon as the wash cycle ends. Give each\
    \ garment a good shake and peg or hang it out as flat as possible. Steam helps\
    \ creases drop out of clothing (as well as odors, see also [Laundry and ironing\
    \ tips](#124-127_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0327)), so it’s worth hanging\
    \ an item up in the bathroom while you take a shower if there’s time—it may avoid\
    \ having to get the ironing board out altogether.\n\nSTEAM OUT WRINKLES\n\n![DK](Images/Page_126_02.png)\n\
    \nIroning out the wrinkles\n\nWhen ironing is necessary, always check the garment\
    \ care label to find the recommended temperature setting before you start. Temperature\
    \ settings on individual irons can fluctuate, so test the chosen setting out on\
    \ a less-visible section of the garment before starting with the rest of the task.\
    \ Where possible, iron clothing inside out. The heat and pressure from ironing\
    \ can create permanent shiny areas that make a garment look older and more worn\
    \ than it is. When and where it is necessary to iron on the right side of the\
    \ garment, use a pressing cloth (see [No-sew method](#046-051_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0112))\
    \ to reduce potential damage.\n\nIRON INSIDE OUT\n\n![DK](Images/Page_126_04.png)\n\
    \ng [LOVE YOUR CLOTHES](#116-117_Mend_it_Wear_It_Love_It.xhtml#part4) g [CONTENTS](#contents.xhtml)\n\
    \n# Stains and how to remove them\n\nNothing spoils the look of a garment quite\
    \ like an ugly stain. We’ll look at some approaches for pretreatment and dealing\
    \ more generally with some common stain-makers to avoid them becoming permanent.\n\
    \nNo matter what the substance is that is threatening to stain your clothing,\
    \ first try to get as much off as you can. Use a clean, dry cloth to blot up liquid\
    \ spills. With thick, gloppy things—sauces, for instance—scrape off as much as\
    \ possible with a spoon or knife. Start from the edge of the blob and scrape inward\
    \ to avoid spreading it further.\n\nAs we’ve seen (see [Laundry and ironing tips](#124-127_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0327)),\
    \ to improve clothing longevity and to reduce our carbon footprint, tumble drying\
    \ our clothes should ideally be a last resort. Never use them to dry clothing\
    \ that has been stained, because it will set the stain permanently. A wet garment\
    \ may fool you into thinking it’s stain-free, but you cannot really tell until\
    \ it is dry, so don’t risk the tumble dryer. Better still, if possible, allow\
    \ the garment to dry outside in direct sun—sunlight has amazing stain-removal\
    \ powers.\n\nTop Tip\n\nIf all attempts to remove an unsightly stain have failed\
    \ and it’s too large to hide, then consider dyeing the garment (see [Fabric dye\
    \ transformations](#130-131_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0338)).\n\n\
    A GUIDE TO STAIN REMOVAL\n\n| Stains || How best to treat |\n\n| --- | --- |\n\
    \n| Tea and coffee || There’s a reason why coffee and tea can be used to dye cloth:\
    \ they leave a permanent stain. Sprinkle salt or baking soda to cover a coffee\
    \ stain as soon as possible. Leave it for a while, then rinse off. For tea stains,\
    \ run under cold water immediately, gently rubbing the fabric to try to lift the\
    \ stain. If the stain remains, soak light-colored fabrics in a chlorine bleach\
    \ solution; for dark and bright colors, try mixing equal parts of white vinegar\
    \ and salt and gently rubbing onto the stain. Rinse with cold water and wash as\
    \ usual. |\n\n| --- | --- |\n\n| Blood and baby poop || The worst thing for protein-based\
    \ stains, like blood and baby poop, is heat—no 140°F wash is going to shift this\
    \ mark. Rinse the area with cold water while the stain is fresh. If possible,\
    \ put it straight into the machine on a cold cycle; if not, soak the item in cold\
    \ water until you can pop it in that cold wash, but avoid soaking for longer than\
    \ 10–12 hours, as the stain will be more likely to set. Absolutely do not tumble\
    \ dry or iron until you’re sure the stain is gone. |\n\n| Makeup and greasy foods\
    \ || For oil-based stains—makeup, greasy food, and sauces—there are a couple of\
    \ avenues of attack, depending on what you have on hand. First, slip some cardboard\
    \ or a magazine underneath the stain to protect the fabric below. Apply a spot\
    \ of dish-washing liquid directly to the stained area. With a damp, clean cloth,\
    \ rub the stain in a circular motion, working from the outside in to avoid it\
    \ spreading. Rinse the dish-washing liquid out and wash as usual. Another approach\
    \ is to use a powder to lift the oil out of the fibers. You can apply cornstarch,\
    \ baking powder, or talcum powder to draw out the grease. Leave cornstarch on\
    \ for 10 minutes, baking powder for 30 minutes, and talcum powder overnight if\
    \ necessary. Then, dust off the remaining powder. If the stain remains, blot with\
    \ a damp, clean cloth before putting in the wash. |\n\n| Sweat || Yellow sweat\
    \ stains look unappealing, but luckily there are two substances we can turn to\
    \ for help. The first is baking soda. Mix it with water to make a paste, then\
    \ apply it to the fabric. If the fabric isn’t delicate, scrub the paste into the\
    \ stain. Leave for an hour then rinse off.  \n\nThe second solution is to soak\
    \ the area in undiluted white vinegar for up to an hour. With an old toothbrush,\
    \ very gently rub the area—sweat stains need agitation for successful removal.\
    \ Then, pop in the washing machine on the hottest temperature the fabric can tolerate\
    \ (be sure to check the care label). |\n\ng [LOVE YOUR CLOTHES](#116-117_Mend_it_Wear_It_Love_It.xhtml#part4)\
    \ g [CONTENTS](#contents.xhtml)\n\n# Fabric dye transformations\n\nSadly, dyeing\
    \ fabric is often overlooked for disguising stains and refreshing tired-looking\
    \ items. Here are some pointers on extending the life of a garment with dye.\n\
    \nHow will you embrace the world of dye and revamp your wardrobe? Choose from\
    \ commercial dyes and plant-based ones.\n\nHand or machine dye?\n\nYou can find\
    \ store-bought dyes in fabric and hardware stores, as well as online. You can\
    \ choose between hand dyes or machine dyes. Hand dyeing requires you to gather\
    \ together the dye pack, table salt, rubber gloves, a bucket, and a stick for\
    \ stirring. Machine dye goes directly into your washing machine and is easier\
    \ and potentially less messy. For bolder effects, you can use more than one dye\
    \ at a time.\n\nNatural vs synthetic fibers\n\nNatural fibers (such as cotton,\
    \ linen, wool, and silk) and regenerated fibers (rayon/viscose, modal, bamboo,\
    \ Tencel/lyocell) take fabric dyes well; make sure the garment can withstand a\
    \ 104°F wash if you plan to use machine dye. Dyeing fabrics that are a blend of\
    \ natural or regenerated fibers and synthetic fibers, such as poly-cotton, will\
    \ have a paler outcome. Dyes specifically designed for synthetics are available\
    \ online.\n\nWhat color is it now?"

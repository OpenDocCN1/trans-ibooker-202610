    \n# Introduction\n\nYou’re fixing damaged garments. You’re transforming abandoned\
    \ garments into something wearable for you or a friend. Everything in your wardrobe\
    \ is looking great and working well. Now, it’s time to talk about the long term.\n\
    \nWell done, you! You’ve been taking the time to learn an array of new skills\
    \ to fix the flaws in your clothes. And you’ve expanded upon that further, brandishing\
    \ new techniques to customize and adapt existing clothing to your specifications.\
    \ These are fun, heady, creative times, aren’t they? Hopefully you’re still in\
    \ the throes of rekindled passion for the garments that you’ve already worked\
    \ on. But now it’s time to talk about caring for your clothes in the long term.\n\
    \nFuture-proofing your wardrobe\n\nIn this chapter we’ll cover storage methods\
    \ for both regularly used and off-season clothing (including how to prevent moth\
    \ damage), laundry and ironing tips, tactics for treating or hiding stains, and\
    \ how to dive into the world of dyeing.\n\nGranted, garment care may not be as\
    \ exciting as learning and flexing new and interesting skills. But the “slow-fashion”\
    \ ethos is as much about soaking a tea-stained T-shirt in cold water, as it is\
    \ about sashiko-style stitching. All that awesome mending and innovative reworking\
    \ will be undermined if you don’t take good care of those newly improved garments.\
    \ You owe it to yourself and to the clothes to go the extra mile and learn how\
    \ best to look after them. Only then can they perform their functions successfully,\
    \ while looking great for as long as possible.\n\nThe all-important storage\n\n\
    First up, we will brush up on how best to keep your clothing when it is not being\
    \ worn. Whether you wear the garment all the time or it is in its off-season,\
    \ all garments deserve to be put away and stored correctly. So, what approaches\
    \ will help them keep their structure well? Which items definitely need to be\
    \ hung up and which should be folded?\n\nHow can you maximize storage space so\
    \ that all your options are accessible and nothing becomes lost, forgotten, or\
    \ overlooked. And is there anything to be done to prevent the biggest causes of\
    \ wardrobe wreckage—moths and mold or mildew? We’ll give you all the answers.\n\
    \nAll that awesome mending and innovative reworking will be undermined if you\
    \ don’t take good care of those newly improved garments.\n\nLaundry aficionado\n\
    \nPresumably you’ve already been doing your own laundry (and possibly other people’s)\
    \ for some time. So, it might seem a bit weird to be boning up on laundry techniques\
    \ at this stage as, by now, it’s most likely something that you just do. Yet,\
    \ it’s the actions that are performed day in and day out that keep your garments\
    \ healthy and functioning well or lead them to become prematurely faded and misshapen.\n\
    \nWhen we talk of garment care, what does that really mean? Keeping it fresh and\
    \ clean by laundering it regularly? No! The biggest takeaway to be had is to wash\
    \ your clothes as infrequently as you can get away with. Nothing weakens and fades\
    \ clothing quicker than washing after every wear (undies, base wear, and socks\
    \ are exempt).\n\nDiscovering which approaches to washing and drying are kinder\
    \ to the planet greatly affects how much or little a garment impacts the environment\
    \ over its lifetime.\n\nThe biggest takeaway to be had is to wash your garments\
    \ as infrequently as you can get away with.\n\nGarment refreshers\n\nAt risk of\
    \ sounding like a detergent advertisement, coffee spills, pasta sauce splashes,\
    \ sweat marks, and baby poop (even on pale garments) needn’t make you roll your\
    \ eyes and announce, “Well, that’s ruined”. If you discover the right approaches\
    \ and deal with it quickly, you should be able to get rid of that stain completely.\n\
    \nRefreshing a garment’s color or changing it up entirely is also a way to enliven\
    \ a well-worn pair of jeans or perk up an old T-shirt. Learning the basics of\
    \ which fabrics take dye best and types of dye will enable you to branch out into\
    \ a world of color. And if all efforts at stain removal fail, then disguise marks\
    \ with a cute embroidery detail with a little needle and thread action.\n\nThere\
    \ is a real satisfaction from caring properly for garments that you have invested\
    \ in. While efforts may not always be visible, it doesn’t mean they can’t be appreciated.\n\
    \ng [LOVE YOUR CLOTHES](#116-117_Mend_it_Wear_It_Love_It.xhtml#part4) g [CONTENTS](#contents.xhtml)\n\
    \n# Smart storage options\n\nUse these tips for storing your clothes, whether\
    \ in regular rotation or packed away for their off-season. Your rewards are clothes\
    \ that stay in the best possible shape longer and remain undamaged by moths, mold,\
    \ or mildew.\n\nEven with garments that you wear often, there are certain storage\
    \ methods and practices that are good to stick to. These will give your clothes\
    \ their best shot at looking good for as long as possible."
  fmt: "\n![DK](Images/Page_112_03.png)\n\n# Elasticized Sleeves and Trouser Hems\n\
    \n## Steps\n\n**1** Try on the item in front of a mirror. Turn up the hem and\
    \ pin. Assess the new length; adjust if needed. The elastic will lift the hem\
    \ slightly, so add a little extra to compensate.\n\n![DK](Images/Page_112_04.png)\n\
    \n**2** Select an appropriate width of elastic. If you wish to retain as much\
    \ length as possible, pick a narrow elastic; avoid elastic that is narrower than\
    \ ⅜in (1 cm).\n\n![DK](Images/Page_113_01.png)\n\n**3** Follow [step 2](#082-083_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0212)\
    \ of Shortening a hem. Measure the width of the elastic, add ⅝in (1.5 cm), and\
    \ mark this extra amount. Follow [step 4](#082-083_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0214)\
    \ to remove the excess fabric from the hems.\n\n![DK](Images/Page_113_02.png)\n\
    \n**4** With the garment inside out, fold back the bottom edge by ⅜in (1 cm) and\
    \ press. Then, fold back the width of the elastic plus ³⁄₁₆ in (5 mm) and press\
    \ again. Pin this channel about ¼in (7 mm) from its top edge.\n\n![DK](Images/Page_113_03.png)\n\
    \n**5** Starting at the inner seam, make a line of small, neat running stitches.\
    \ Leave a 1³⁄₁₆ in (3 cm) gap in the stitching to thread the elastic through.\
    \ Follow steps [4](#110-113_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0300) and [5](#110-113_Mend_it_Wear_It_Love_It.xhtml#DK_MEND_0301)\
    \ to insert the elastic.\n\n![DK](Images/Page_113_04.png)\n\n**6** Feed the elastic\
    \ back into the channel. Try the garment on to check that the elastic feels right.\
    \ Then, secure by stitching up and down through both layers of elastic at the\
    \ overlap. Close the gap with running stitch.\n\ng [WEAR YOUR CLOTHES](#078-079_Mend_it_Wear_It_Love_It.xhtml#part3)\

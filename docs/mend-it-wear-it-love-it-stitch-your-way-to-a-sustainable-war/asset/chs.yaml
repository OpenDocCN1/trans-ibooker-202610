  \ 棉质刺子绣线（可选） |\n| --- | --- | --- |\n| **缝纫机？** | | 按步骤 1 至 3 准备并固定补丁或贴布，然后尝试用宽锯齿针沿形状边缘缝制\
  \ |\n| **左撇子？** | | 如果觉得更舒服，可按相反方向操作 |\n\n> **小贴士**\n>\n> 补丁面料的厚度和类型要与衣物匹配。无弹性的紧密织物适合做补丁。\n\
  \n![DK](img/Page_041_01.png)\n\n**1** 检查破洞的形状和位置，并查看周围区域是否有薄弱或损坏。决定补丁的形状；简单的长方形或正方形最适合入门。\n\
  \n![DK](img/Page_041_02.png)\n\n**2** 测量补丁需要多宽多深才能盖住破洞（如有必要，包括受损区域）。每边额外增加 1 英寸（2.5\
  \ 厘米），用标记工具在补丁面料上画出这个放大后的形状。如果您愿意，补丁可以做得更大。\n\n![DK](img/Page_041_03.png)\n\n**3**\
  \ 小心剪下面料形状。补丁正面朝下，将每条边向内折 ⅜ 英寸（1 厘米）并用熨斗烫平。\n\n![DK](img/Page_041_04.png)\n\n**4**\
  \ 将补丁居中置于破洞或受损区域上方并用别针固定。如步骤 1 所示，穿一根约 39 英寸（1 米）长的线在缝纫针上。现在您有了双股线。\n\n![DK](img/Page_042_01.png)\n\
  \n**5** 从一个角开始。从背面将针在距离补丁边缘约 ³⁄₁₆ 英寸（5 毫米）处穿出。从正面拉出针线，然后在左侧约 ³⁄₁₆ 英寸（5 毫米）处将针穿回背面，重复此动作。\n\
  \n![DK](img/Page_042_02.png)\n\n**6** 重复步骤 5，直到绕补丁所有边缘缝完。保持针脚长度均匀且距离边缘 ³⁄₁₆ 英寸（5\
  \ 毫米）。从背面仅穿过衣物面料，重叠缝两个小针脚收尾。剪断线。\n\n修补衣物 | 目录\n\n# 基础刺子绣风格针法\n\n为了增加牢固度和美观度，为什么不试试刺子绣风格的针法呢？\n\
  \n> **小贴士**\n>\n> 如果没有刺子绣线，可用两股普通缝纫线，将四个线头打结在一起（形成四股线）。\n\n![DK](img/Page_042_04.png)\n\
  \n**1** 按照步骤 1 至步骤 3 准备补丁。使用刺子绣线效果最好，但用普通线（见小贴士）缝四股线也能达到类似效果。使用单股刺子绣线，一端打结。\n\n\
  ![DK](img/Page_043_01.png)\n\n**2** 按照步骤 5 完成一行水平针脚。尽量保持针脚长度均匀，最后一针距离补丁边缘 ³⁄₁₆ 英寸（5\
  \ 毫米）处结束。\n\n![DK](img/Page_043_02.png)\n\n\n\n**3** 从背面将针垂直穿至上一针的上方。将针向上推出，使其在上一针末端上方\
  \ ⅜ 英寸（1 厘米）处露出。从正面拉过针和线。现在沿与前一行相反的方向缝制。\n\n![DK](img/Page_043_03.png)\n\n**4**\
  \ 继续缝制第二行针脚，保持每针长度为 ³/[16] 英寸（5 毫米）。每针应正对上一行的针脚，间距 ⅜ 英寸（1 厘米）。继续以交替方向添加行针脚，直到补丁区域被覆盖。根据需要移动大头针。\n\
  \n![DK](img/Page_043_04.png)\n\n**5** 你可以在此结束，也可以继续制作美观的十字/星形效果。从背面将针在最后一针中心上方 ⅛\
  \ 英寸（3 毫米）处穿出。交叉针脚并将针向下刺入，形成一针长 ³/[16] 英寸（5 毫米）的垂直针脚。向下和向上穿针，为所有水平针脚制作“十字”交叉。\n\n\

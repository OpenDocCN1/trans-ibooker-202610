- "# 简介\n\n你如何处理那些虽未损坏、无需修补，却几乎从不或从未穿着的衣物？本章分享大量创意和必要技巧，助你将服装改造成你的新宠装扮。\n\n你衣橱里的每一件服装都可以像你一样独一无二。本书这一部分提供丰富的灵感和技术指导，助你实现这一目标。\n\
  \n**问题出在哪？**\n\n你衣橱里目前有多少件服装符合此描述：没有明显的“问题”，但你就是不想再穿了？下摆完好，拉链不卡，没有洞眼或开裂的缝线需要修补。你曾经喜欢它——毕竟，曾经你决定拥有它。也许你们共度过愉快的最初几次穿着。但不知为何，如今换衣时它总被略过。它不再作为一件衣物发挥作用，沦为“衣橱填充物”，其唯一明显作用似乎只是让你更难找到想穿的衣服。\n\
  \n抽出时间发挥创意，灵活运用你日益精进的缝纫技巧，让不再喜爱的服装焕发新生。\n\n**可持续思考**\n\n你当然可以直接把那件衣服送去二手店。然而，捐赠的衣物只有极小部分能作为衣物转售。大多数被出口到国外市场，或被转卖制成抹布。\n\
  \n可持续和遵循慢时尚，关乎考量制作一件服装所投入的所有能源、资源和劳动，首先解决问题要好得多。\n\n服装的演变不必止步于设计师和服装工人手中。\n\n**给服装第二次机会**\n\
  \n有时你清楚不喜欢服装的哪里：版型略显邋遢，下摆拖地，或就是没有放手机的口袋。但有时诊断问题（或问题们）更难。原因或许更偏向审美而非实用，因此问题显得更抽象。发现他人使用的新颖想法和方法，往往能激发你如何让衣橱里的一两件服装焕然一新的灵感。\n\
  \n仅因服装让人觉得“有点微妙”就与它彻底告别，似乎太可惜了。抽出时间发挥创意，灵活运用你日益精进的缝纫技巧，让那些不再喜爱的服装焕发新生。\n\n**小调整还是大改造？**\n\
  \n也许你会选择将裤子缩短 ¾ 英寸（2 厘米），使其*恰到好处*地落在脚踝处。或者你可能尝试给及膝裙加长成中长裙，添加醒目的对比色荷叶边。无论哪种方式，这一系列修改和改造创意或许能让你重新对穿某件衣服感到兴奋。\n\
  \n\n\n请注意，你不必局限于每件衣服只进行一次改造。有一件略显平淡的衬衫裙？为什么不加些塑造腰身的省道，并把所有纽扣换成更有趣的款式呢？有一件过于宽松的罩衫让你显得淹没其中？在袖口加松紧带并在侧缝处重新调整版型如何？有一件你喜欢颜色的实用夹克但袖子稍紧？你可以拆掉袖子把它改成背心。哦，顺便你还可以加个真正能装下手的口袋。\n\
  \n## 一个更像“你自己”的衣橱\n\n运用几个巧妙的修补技巧，就能让任何衣物更贴合“你自己”。衣物的演变不必止步于设计师和缝纫工人的成品。掌握这些想法和技巧后，你可以自由地定制和个性化你的衣物，以适应你的体型、风格和需求。\n\
  \ng 穿你的衣服 g 目录\n\n# 缩短下摆\n\n成衣的下摆长度并不总是完全合身，这并不奇怪。缩短下摆是项简单的任务；有时，仅调整 ¾ 英寸（2 厘米）就能带来截然不同的效果。\n\
  \n| **所需工具** | 大头针、卷尺、布料标记工具、布料剪刀、熨斗、手缝针、配色线、剪刀/剪线钳 |\n|---|---|\n| **需要缝纫机？** |\
  \ 第 6 步缝制下摆时：梭织面料的明线下摆用平针；针织/针织衫面料的下摆用三步锯齿针 |\n\n**小贴士**  \n更大胆的改造也是可能的——将长袖改短袖、长裤改短裤，或将连衣裙改上衣。\n\
  \n![DK](img/Page_082_02.png)\n\n**1** 在镜子前试穿衣物，并穿上合适的鞋子。将一部分下摆翻起至理想长度，用大头针大致固定。站直评估新长度；如有需要则调整。\n\
  \n![DK](img/Page_082_03.png)\n\n**2** 将衣物正面朝外平铺在平面上。根据你固定的部分，水平放置一枚新大头针，以标示新成品长度的底部位置。移除其他大头针。\n\
  \n![DK](img/Page_083_01.png)\n\n**3** 在大头针下方的布料上水平标记所需的下摆预留量。梭织面料预留 1⅝ 英寸（4 厘米）以包裹毛边；针织/针织衫面料仅预留\
  \ ¾ 英寸（2 厘米），因为它们不易脱线。\n\n![DK](img/Page_083_02.png)\n\n**4** 从原下摆线量至新标记处。从底边向上量取此长度，绕过整个下摆，每隔\
  \ 2 英寸（5 厘米）在布料上做一个水平标记。剪去多余布料。\n\n![DK](img/Page_083_03.png)\n\n**5** 将衣物翻至反面。将底边向上翻折\
  \ ¾ 英寸（2 厘米），熨烫，然后用大头针固定。如果是梭织面料，再向上翻折 ¾ 英寸（2 厘米）将毛边包裹在折叠的下摆内，再次熨烫。\n\n![DK](img/Page_083_04.png)\n\
  \n**6** 梭织面料用挑针缝制，如同隐形下摆；明线下摆用平针（见基础刺子绣式缝法）。针织/针织衫衣物用松散的平针以便拉伸。熨烫底边。\n\ng 穿你的衣服\
  \ g 目录\n\n# 加长下摆\n\n遗憾的是，我们无法挥动魔杖让过短的下摆变长。但我们可以缝上一条对比色布条来增加长度，同时创造一个酷炫的设计细节。\n\n\
  | **所需工具** | **加对比色布条：** 卷尺、拆线器、布料标记工具、对比色布料、布料剪刀、大头针、熨斗、熨衣板、手缝针、线（颜色配对比色布料）、剪刀/剪线钳<br>**做荷叶边：**\
  \ 卷尺、拆线器、布料标记工具、布料剪刀、荷叶边布料、大头针、手缝针、线（颜色配对比色布料）、熨斗、熨衣板、剪刀/剪线钳 |\n|---|---|\n| **需要缝纫机？**\
  \ | 第 3 和 4 步缝制下摆时：梭织面料的明线下摆用平针；针织/针织衫面料的下摆用三步锯齿针。第 6 步缝合布条或荷叶边时，用机缝平针代替手工平针 |\n\
  \ng 穿你的衣服 g 目录\n\n## 加对比色布条\n\n此法适用于垂感不强的直筒型和 A 字型衣物。加长用的布料要与衣物的类型和厚度相匹配。\n\n![DK](img/Page_085_01.png)\n\
  \n**1** 试穿衣物，确定想要加长的长度。量一下底边周长（圆周），拆开原下摆，在底边下方 ⅜ 英寸（1 厘米）处做标记。沿此线剪开布料。\n\n![DK](img/Page_085_02.png)\n\
  \n**2** 画一个长方形，其长边长度等于衣物周长加 ¾ 英寸（2 厘米）缝份。如果对比色布料宽度不够，则拼接两个等长的长方形。\n\n![DK](img/Page_085_03.png)\n\
  \n**3** 长方形的宽度（深度）等于你要加长的长度，加上顶边 ⅜ 英寸（1 厘米）缝份，再加底边下摆预留量（梭织面料 1⅝ 英寸/4 厘米；针织/针织衫 ¾\
  \ 英寸/2 厘米）。剪下来。\n\n![DK](img/Page_085_04.png)\n\n**4** 将长方形短边对齐叠放，正面相对，用大头针固定。距边缘\
  \ ⅜ 英寸（1 厘米）处用平针缝合短边。拆除大头针，将缝份熨开。按步骤 5 和步骤 6 处理底边。\n\n![DK](img/Page_086_01.png)\n\
  \n**5** 将衣物倒置，对比色布条反面朝外，套在衣物上。将布条的侧缝与衣物的侧缝对齐。用大头针固定各部分。\n\n![DK](img/Page_086_02.png)\n\
  \n**6** 距边缘 ⅜ 英寸（1 厘米）处用一排平针将衣物与布条缝合。将对比色布条翻下到位，然后将连接处的缝份向衣物内侧熨烫。\n\ng 穿你的衣服 g 目录\n\
  \n## 做荷叶边\n\n浪漫的荷叶边同样适合薄至中厚面料的直筒型或喇叭型衣物。\n\n![DK](img/Page_086_03.png)\n\n**1**\
  \ 按照步骤 1 测量并准备衣物以便加长。如果原下摆深度小于 ⅜ 英寸（1 厘米），则无需拆开。注意：荷叶边所需布料比布条多。\n\n![DK](img/Page_086_04.png)\n\
  \n**2** 标记荷叶边的长方形。长边长度需为衣物下摆周长的 1.5–2 倍，视你想要的荷叶边丰满度而定。宽度（深度）参考步骤 3。\n\n![DK](img/Page_087_01.png)\n\
  \n**3** 如果布料宽度不够，将宽度分成两个等宽的长方形。按步骤 4 缝合短边并将缝份熨开。翻折下摆处理荷叶边的底边。\n\n![DK](img/Page_087_02.png)\n\
  \n**4** 缝两排长平针，第一排距顶边 ½ 英寸（1.3 厘米），第二排距 ¼ 英寸（7 毫米）；两端留长线头。取一对线头打双结固定。\n\n![DK](img/Page_087_03.png)\n\
  \n**5** 一手紧握打结的一对线头，另一手沿着线轻轻推拢布料，使其远离线头。继续直到荷叶边的聚拢边长度与衣物周长一致。\n\n\n\n![DK](img/Page_087_04.png)\n\
  \n**6** 将所有松散的线头系在一起。然后，将褶皱均匀地分布在周围。按照对页的步骤 5 和 6 缝上荷叶边；它正好覆盖聚拢针脚。荷叶边缝好后，拆除聚拢针脚。\n\
  \ng 穿上你的衣服 g 目录\n\n# 对比色边条、饰边和荷叶边\n\n拼色边条、浪漫荷叶边和甜美饰边都能让袖子和下摆变长。\n\n![DK](img/Page_088_01.jpg)\n\
  \ng 穿上你的衣服 g 目录\n\n# 添加简单的贴袋\n\n没有口袋、或口袋太小根本装不下东西的衣服，简直让人抓狂。但如果你能自己做个口袋缝上去呢？让我们一步步来完成这个现实版的魔术吧。\n\
  \n| **所需工具** | 一张纸、铅笔、尺子、纸剪刀、制作口袋的布料（最好用无弹力的机织布）、大头针、布剪刀、熨斗、熨衣板、软尺、手缝针、线（颜色与口袋布料匹配）、安全别针、剪刀/剪线钳\
  \ |\n| --- | --- |\n| **缝纫机？** | 在以下步骤指示的位置，用平针代替直针 |\n\n> **小贴士**\n> 选择贴袋布料时，颜色和图案随意。但要确保选用中厚或厚实的无弹力机织布。\n\
  \n![DK](img/Page_091_01.png)\n\n**1** 在纸张中央设计口袋的大致形状；检查是否足够大，能轻松伸进手。对大小满意后，用尺子把直边画直，检查曲线是否平滑均匀。\n\
  \n![DK](img/Page_091_02.png)\n\n**2** 在开口边增加 1⅝英寸（4 厘米）。然后在其他边各增加⅜英寸（1 厘米）并画出这些新线。沿着这个新外边缘用纸剪刀剪下，作为口袋纸样。\n\
  \n![DK](img/Page_091_03.png)\n\n**3** 将纸制口袋纸样放在布料上，用大头针固定。用布剪刀剪出口袋形状。重复此步骤，剪出你想要添加的数量。\n\
  \n![DK](img/Page_091_04.png)\n\n**4** 将口袋片正面朝下，将开口边向后折回¾英寸（2 厘米）。熨烫此折痕。再将边缘向后折回¾英寸（2\
  \ 厘米）并再次熨烫。穿针引线，线长约 12 英寸（30 厘米）。在一端打结。\n\n![DK](img/Page_092_01.png)\n\n**5** 口袋片仍正面朝下，在开口边内侧折痕附近做直针。将针从所有层中穿出。将针穿回，距离第一次穿出处约\
  \ 3/16 英寸（5 毫米）。\n\n![DK](img/Page_092_02.png)\n\n**6** 从背面拉出针线，然后重复步骤 5，缝出一排均匀的直针。在最后一针直针上重叠缝两小针。剪掉多余线头。开口边缝制完成。\n\
  \n![DK](img/Page_092_03.png)\n\n**7** 将口袋片剩余边缘向内折⅜英寸（1 厘米）。熨烫边缘。（如果口袋包含曲线，小心折叠熨烫以避免生硬的线条。）将口袋片翻面，正面朝上，熨烫定型。\n\
  \n![DK](img/Page_092_04.png)\n\n**8** 用安全别针将口袋别在衣服上大致合适的位置。口袋要方便取物且物品不易掉落，但具体位置由你决定。试穿衣服检查位置，并根据需要调整。\n\
  \n![DK](img/Page_093_01.png)\n\n**9** 将衣服平铺在平面上。加上缝纫大头针，固定口袋最终位置。大头针间距约 1 英寸（2.5\
  \ 厘米），垂直于边缘。不要别开口边。只别过衣服单层布料。\n\n![DK](img/Page_093_02.png)\n\n**10** 穿针引线，线长 18\
  \ 英寸（45 厘米）（大口袋可用更长的线）。一端打结。从顶角开始，距离边缘约⅛英寸（3 毫米），从背面将针穿过衣服和口袋。\n\n![DK](img/Page_093_03.png)\n\
  \n**11** 从上方拉出针线，再穿回，距离约 3/16 英寸（5 毫米）。沿口袋周围继续缝均匀的直针。在背面，重叠缝两小针，只穿过衣服布料。\n\n![DK](img/Page_093_04.png)\n\
  \n**12** 准备针和双股线（见缝纽扣）。在两个顶角处，从背面穿针缝一斜针。在上面重复缝几次，然后反方向再缝一次，形成一个“X”形。\n\ng 穿上你的衣服\
  \ g 目录\n\n# 贴袋\n\n通过制作和添加实用贴袋或装饰性贴袋，改变衣服外观，增添乐趣。\n\n![DK](img/Page_094_01.jpg)\n\
  \ng 穿上你的衣服 g 目录\n\n# 在接缝处改裁衣服\n\n通过在接缝处收缩来减小衣服尺寸，能极大改变其整体外观。按照以下步骤，让你的上衣、连衣裙、牛仔裤、裙子、T\
  \ 恤和针织衫焕然一新，更显精致。基本上任何无里子的衣服都可以改！\n\n| **所需工具** | 大头针、布料标记工具、软尺、手缝针、配色线、剪刀/剪线钳、布剪刀\
  \ |\n| --- | --- |\n| **缝纫机？** | 在第 4 步指示直针的地方用平针 |\n\n> **小贴士**\n> 克制住把衣服改得过于紧身的冲动。你仍需要在衣服里舒适地活动、伸手、弯腰和坐下。开始时只收出保守的量；以后随时可以再收更多。\n\
  \n![DK](img/Page_097_01.png)\n\n**1** 对着镜子试穿衣服。你可以通过在侧缝处捏出布料，让裙子、裤子、连衣裙和上衣更贴身；袖子也可以在袖缝处收窄。用手指和/或大头针沿着接缝捏出布料，尝试找到你想要的效果；衣服正面朝外时更容易操作。拔掉所有大头针。\n\
  \n![DK](img/Page_097_02.png)\n\n**2** 脱下衣服，翻到里面，再穿上。将大头针平行于缝线别上，标示新缝线位置，重现你想要的效果。确保衣服两侧收缩量均匀。带着大头针小心脱下衣服。\n\
  \n![DK](img/Page_097_03.png)\n\n**3** 将衣服平铺在平面上。用布料标记工具标记大头针显示的新缝线。将新缝线平滑地过渡到原缝线。在另一侧缝线重复。用软尺检查两侧缝线收缩量是否相同。拔掉大头针。\n\
  \n![DK](img/Page_097_04.png)\n\n**4** 将大头针垂直于缝线别上，固定缝线。像步骤 2 那样准备针线。沿标记线用直针缝合（如有需要参考步骤\
  \ 4–6）；在衣服另一侧重复。在距离新缝线⅝英寸（1.5 厘米）处剪除多余布料。\n\ng 穿上你的衣服 g 目录\n\n# 利用腰部塑形省道改裁\n\n几乎任何及臀或更长、显得略微无型的衣服，都可以通过改裁变得更优雅挺括。你可以轻松改裁连衣裙、长衬衫、衬衫、女式衬衫和上衣，而完全不影响正面外观。魔法？不。腰部塑形省道？是的。\n\
  \n\n\n# 收腰\n\n## 所需工具\n- 大头针\n- 卷尺\n- 织物标记工具\n- 尺子\n- 手缝针\n- 配色线\n- 剪刀/剪线钳\n- 熨斗\n\
  - 熨衣板\n\n## 缝纫机？\n在第 10 步指示使用平针的地方，改用直线针脚。\n\n## 小贴士\n> 自然腰线的位置比大多数人想象的要高。要找到你的自然腰线位置，面对镜子站立，身体向侧面弯曲。将手放在躯干折皱处：这就是你的自然腰线。\n\
  \n![DK](img/Page_099_01.png)\n\n**1** 在镜子前试穿衣物。在背部自然腰线处（见小贴士）均匀地捏取两侧面料，尝试不同的效果；衣物正面朝外时更容易观察。捏取不同量的面料，但要避免过度修身。\n\
  \n![DK](img/Page_099_02.png)\n\n**2** 将衣物翻到里面并再次穿上。重现想要的效果，在自然腰线处的两侧各垂直插一枚大头针。力求在每个省道位置捏取相同量的面料。如果可能/必要，请朋友帮忙。\n\
  \n![DK](img/Page_099_03.png)\n\n**3** 小心脱下衣物，将其里面朝外平铺在平面上，准备标记省道。在捏取处的织物两侧各垂直插一枚大头针。拔掉原来的大头针，使织物能平铺。另一侧重复此操作。\n\
  \n![DK](img/Page_099_04.png)\n\n**4** 测量侧缝到两侧最近的垂直大头针的距离。将这两个测量值相加并除以二，得出侧缝到省道外边缘的平均距离。记下这个数字。\n\
  \n![DK](img/Page_100_01.png)\n\n**5** 测量每对垂直大头针之间的距离。将它们相加并除以二，得出每个省道的平均宽度。记下这个数字。有了这些数字，你就可以开始在织物上绘制省道了。\n\
  \n> **注意：** 你可能会发现，先用这些测量值在纸上练习第 4 至 9 步绘制省道，然后再标记实际衣物会很有用。在实际面料上很难去除任何绘制错误。\n\n\
  ![DK](img/Page_100_02.png)\n\n**6** 拔掉大头针。在自然腰线处，从侧缝向横向测量，并根据第 4 步的测量值画一条垂直标记。利用第\
  \ 5 步的数字，为省道宽度做第二个标记。另一侧重复此操作。\n\n## 小贴士\n> 克制捏取过多面料的冲动，因为这会破坏衣物的平衡并导致变形，使前片面料与后片相比显得不成比例。\n\
  \n![DK](img/Page_101_01.png)\n\n**7** 省道的宽度现已绘制完毕。要绘制其长度，首先穿过省道中心画一条垂直线，使其与腰线垂直。将该线向腰线上方延伸至少\
  \ 6 英寸（15 厘米），向下方延伸至少 6 英寸（15 厘米）。\n\n![DK](img/Page_101_02.png)\n\n**8** 如果你的省道宽度为\
  \ 1⅜英寸（3.5 厘米）或更宽，在长垂直线上腰线上方和下方 6 英寸（15 厘米）处做一个小横向标记。如果宽度小于 1⅜英寸（3.5 厘米），则在腰线上方和下方\
  \ 4¾英寸（12 厘米）处做标记。\n\n![DK](img/Page_101_03.png)\n\n**9** 画直线连接这四个点，形成一个长菱形。沿垂直线折叠衣物，正面相对。重新绘制腰线处的尖角，使其变成平滑的曲线。另一侧重复此操作。\n\
  \n![DK](img/Page_101_04.png)\n\n**10** 将大头针垂直于省道插入，保持面料平整且位置固定。参考*修补撕裂*中的第 3 步至第\
  \ 6 步，沿线缝制一排平针。缝制两个省道，然后轻轻将它们向后中线方向熨烫。\n\n穿上你的衣服 | 目录\n\n---\n\n# 将衣物改大\n\n*“衣服有点小”*是不穿某件衣物的常见理由。虽然我们无法神奇地让衣物变大，但我们可以在侧缝和袖缝处插入一条布条，来给上衣或连衣裙加大尺码。\n\
  \n## 所需工具\n- 拆线钳\n- 卷尺\n- 织物标记工具\n- 插片面料（匹配衣物面料类型）\n- 织物剪刀\n- 熨斗\n- 熨衣板\n- 手缝针\n\
  - 线（颜色匹配衣物）\n- 剪刀/剪线钳\n- 大头针\n\n## 缝纫机？\n- **用于卷边（第 4 步）：** 梭织面料使用直线针脚；针织面料使用三步或宽锯齿针脚。\n\
  - **用于缝合插片（第 6 步）：** 梭织面料使用直线针脚；针织面料使用窄锯齿针脚，这将允许缝缝有一定的弹性。\n\n![DK](img/Page_102_01.png)\n\
  \n**1** 小心拆开衣物的侧缝和袖缝。如果衣物无袖且有袖窿里布，也要拆开里布的侧缝，然后在后续步骤中将外层和里布层视为一层处理。\n\n![DK](img/Page_102_02.png)\n\
  \n**2** 测量从袖口（或袖窿）到衣摆的缝线长度。在此数值上加 1⅝英寸（4 厘米），得出插片的长度。估算你想要的插片宽度，并加上衣物原始缝份的两倍。\n\n\
  ![DK](img/Page_103_01.png)\n\n**3** 使用织物标记工具，在插片面料上标记出这个长方形并剪下。如果长方形的长度特别长，可能需要用平针拼接。\n\
  \n![DK](img/Page_103_02.png)\n\n**4** 将短边向里折回⅜英寸（1 厘米），熨烫，再折回⅜英寸（1 厘米）并熨烫。穿针引线约\
  \ 12 英寸（30 厘米），一端打结。在两个短边靠近卷边处缝制细小的平针。\n\n![DK](img/Page_103_03.png)\n\n**5** 正面相对，将插片沿一条侧缝（如有必要包括袖缝）定位，对齐毛边。将插片的卷边与衣物的衣摆和袖口或腋下对齐。以固定间隔插入大头针。\n\
  \n![DK](img/Page_103_04.png)\n\n**6** 穿针引线约 18 英寸（45 厘米），一端打结。将衣物面料反面朝上，缝制细小整齐的平针以固定插片。像第\
  \ 5 步一样固定插片的另一侧边缘；重复缝制另一侧。\n\n穿上你的衣服 | 目录\n\n---\n\n# 拆除袖子\n\n修身技术非常适合简化原本过大的衣物轮廓。但如何处理过小的衣物？如果紧身袖子是问题所在，一个简单的选择是将它们完全拆除。\n\
  \n## 所需工具\n\n### 针对梭织面料衣物\n- 拆线钳\n- 剪刀/剪线钳\n- 大头针\n- 卷尺\n- 39 英寸（1 米）斜纹带\n- 织物剪刀\n\
  - 手缝针\n- 配色线\n- 熨斗\n- 熨衣板\n\n### 针对针织/运动衫面料衣物\n- 织物剪刀\n- 大头针\n- 卷尺\n- 剪刀/剪线钳\n-\
  \ 手缝针\n- 配色线\n- 熨斗\n- 熨衣板\n\n## 缝纫机？\n- 在第 6 步、第 7 步和第 12 步指示使用平针的地方，改用直线针脚。\n-\
  \ 在第 4 步使用三步锯齿针脚。\n\n## 小贴士\n> 此技术的成败取决于你能否想象衣物去掉袖子后是否好看！新的袖窿将沿着当前的袖缝线条。\n\n穿上你的衣服\
  \ | 目录\n\n---\n\n# 针对梭织面料衣物\n\n梭织面料的毛边容易脱线，因此此方法采用斜纹带来稳固并遮盖毛边。包边位于衣物内侧，外侧仅露出一排细小整齐的针脚。\n\
  \n\n\n\n# 从机织服装上拆除袖子\n\n![DK](img/Page_105_01.png)\n\n1. 使用拆线器，小心拆开固定袖子的缝线。如果服装有里料，也要拆开固定袖子里料的缝线。清除袖窿周围的任何松散线头或断裂针脚。\n\
  \n![DK](img/Page_105_02.png)\n\n2. 如果服装有里料，将面料和里料在袖窿处用别针固定在一起，别针平行于新的毛边，距离原缝线约 ⅝\
  \ 英寸（1.5 厘米）。这样在后续步骤中，你就可以将两层视为一层来处理。\n\n![DK](img/Page_106_01.png)\n\n3. 由于面料上的针孔，袖窿周围的原缝线仍清晰可见。修剪袖窿周围的缝份，使毛边与原缝线之间仅保留\
  \ ¼ 英寸（7 毫米）。\n\n![DK](img/Page_106_02.png)\n\n4. 将斜裁带正面朝下，打开上边的折痕，将其外边缘与袖窿底部的毛边对齐。留出斜裁带前\
  \ ¾ 英寸（2 厘米）松散，延伸至侧缝之外。将别针垂直穿过所有层。\n\n![DK](img/Page_106_03.png)\n\n5. 继续将斜裁带的外边缘与袖窿的毛边对齐，一圈到底，保持斜裁带平整，避免出现褶皱或折痕。边对齐边别针。当斜裁带回到起点时，剪去多余部分，在末端留出\
  \ ¾ 英寸（2 厘米）松散，延伸至侧缝之外。\n\n![DK](img/Page_107_01.png)\n\n6. 穿针引线，缝纫线长度不超过 18 英寸（45\
  \ 厘米）。在单股线的一端打结。用细小整齐的直针脚，将斜裁带缝合到袖窿周围的服装上。以斜裁带上的折痕为基准。拔出别针。\n\n![DK](img/Page_107_02.png)\n\
  \n7. 打开斜裁带的另一道折痕，小心熨烫平整。将斜裁带的松散末端正面相对，用细小整齐的直针脚，沿宽度方向将它们缝合在一起。修剪多余的斜裁带，距离缝线 ¼ 英寸（7\
  \ 毫米）。\n\n![DK](img/Page_107_03.png)\n\n8. 将服装翻到里面。将斜裁带翻到内侧。如果你的服装面料耐热，小心熨烫袖窿曲线边缘以定型折痕。少许蒸汽有助于斜裁带贴合曲线。\n\
  \n![DK](img/Page_108_01.png)\n\n9. 打开斜裁带，使直针脚露出来。将斜裁带的外侧毛边拉至与缝线相接。然后将斜裁带折回原位，正面朝上，小心熨烫以定型新的折痕。\n\
  \n![DK](img/Page_108_02.png)\n\n10. 继续在服装反面操作，将别针斜向穿过所有层以固定斜裁带。在袖窿周围按固定间距放置别针。\n\
  \n![DK](img/Page_108_03.png)\n\n11. 按照步骤 6 重新穿针。从袖窿底部开始，将针靠近斜裁带折边穿过所有层向下刺入，从下方拉出，使线结位于服装内侧。\n\
  \n![DK](img/Page_108_04.png)\n\n12. 在斜裁带下折边缘附近缝制细小整齐的直针脚，使其永久固定。拔出别针，给包边最后熨烫一次，将服装翻回正面。\n\
  \ng 穿你的衣服 g 目录\n\n# 针对针织/运动衫面料服装\n\n如果你想从 T 恤或针织服装上拆除袖子，请使用这个更简单的方法。因为针织面料的毛边很少脱线，所以不需要斜裁带。\n\
  \n![DK](img/Page_109_01.png)\n\n1. 针织服装比机织服装更难拆线，因为面料容易拉伸。相反，请小心剪掉袖子，连同缝份一起剪掉。\n\
  \n![DK](img/Page_109_02.png)\n\n2. 在袖窿缝好之前，小心处理毛边。将服装翻到里面。小心将毛边向内折回 ⅜ 英寸（1 厘米）。在袖窿边缘周围别上别针固定。\n\
  \n![DK](img/Page_109_03.png)\n\n3. 穿针引线，线长不超过 18 英寸（45 厘米），在一端打结。从袖窿底部开始，将针穿过双层，距离袖窿内折边约\
  \ ¼ 英寸（7 毫米）处向下刺入。\n\n![DK](img/Page_109_04.png)\n\n4. 用细小整齐的直针脚继续缝制袖窿周围。保持缝线适当松弛（以便穿脱时有一定弹性）。缝制过程中拔出别针。熨烫袖窿，将衣物翻回正面。\n\

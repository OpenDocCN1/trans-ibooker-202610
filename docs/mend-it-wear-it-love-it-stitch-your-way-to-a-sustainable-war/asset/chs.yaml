  '
- "# 简介\n\n我们的衣物为我们辛勤服务。它们让我们保暖舒适、外观出众，还能彰显我们的个性。所以，当它们开始显露出辛劳的痕迹时，我们难道不该拿起针线回报它们吗？\n\
  \n在深入探讨对抗磨损迹象的技巧之前，先让我们调整心态。此时，你可能会对在心爱衣物附近挥舞大头针和缝衣针（更别提剪刀！）感到有些紧张，甚至怀疑这到底是不是个好主意。请铭记这一信念：任何能让衣物多穿一次的修补都是巨大的成功，值得庆祝。仅仅尝试让衣物更耐穿，你就是慢时尚运动的积极参与者——恭喜你！\n\
  \n> 任何能让衣物多穿一次的修补都是巨大的成功。\n\n## 大胆还是低调？\n\n衣物修补可以介于“超级整齐、肉眼不可见”到“显而易见地延长了衣物寿命”之间的任何位置。在网上探索\
  \ #visiblemending（可见修补）以了解并沉醉于这种方法的理念。许多人认同这种做法，他们喜欢展示而非隐藏衣物经历的旅程。\n\n衣物在你衣橱中的角色和你的个人风格将影响你对特定修补选择的方法。无论你的目标是什么，请不要认为修补必须看起来完美，甚至不必显得模糊整齐才算成功；但遵循一些\
  \ `基本规则` 有助于获得最佳效果。\n\n如果你没有信心，或正在尝试新方法，请先在布料碎片上测试该技巧。\n\n## 灵活运用新技能\n\n本书包含的技巧为你应对大多数衣物修补提供了绝佳基础。随着时间的推移，当衣物出现问题时，你将有机会尝试并熟悉这些技巧。你很可能在某些技巧上大获全胜，而另一些可能需要几次尝试才能达到预期效果。\n\
  \n本书中的每种修补技巧都适合初学者。然而，实际上，处理任何修补工作可能有多种不同方法。如果你愿意，请随意实验和调整这些技巧，以不同方式应用，甚至开发出自己的方法。\n\
  \n享受乐趣，动手创造，并为此自豪！\n\n为增加修补成功的几率，请遵循以下基本规则：\n\n*   一旦发现需要修补，请在解决问题前不要再穿这件衣物。也不要清洗它。在修补前继续穿着或清洗衣物很可能会加剧问题，导致日后更难修复。\n\
  *   不要尝试在穿着衣物时进行修补。你需要将衣物平铺并仔细检查问题，以便做出最佳修补。\n*   尽量在光线良好的环境下修补衣物。深色衣物在光线不足或人造光下尤为难以操作。\n\
  *   如果你没有信心，或正在尝试新方法，请先在布料碎片上测试该技巧。慢慢来没关系——毕竟这是慢时尚。\n*   如果面料精致、细薄、严重起毛或极其昂贵，请考虑送往裁缝店或修改专家处。挑选适合自己的项目没关系。取回修补好的衣物时，询问他们采用了什么修补方法，以便日后你能尝试类似做法。\n\
  \n`g 修补你的衣物 g 目录`\n\n# 使用缝纫机\n\n为使修补更快捷、完成度更整齐，请使用缝纫机。抛弃学校家政课留下的不愉快回忆（如果你上过的话），如果你能借到、求到或偷到一台机器，为什么不试一试？\n\
  \n最初你需要掌握一些基本功能——绕底线、穿线、选择和调节针脚，以及定位工件以便缝制。假设你不是机器主人，且他们无法教你，请查看机器说明书是否能指导你完成这些步骤。如果拿不到实体版，你或许能买到\
  \ PDF 版或找到视频教程；在网上搜索机器的品牌名称和型号。\n\n掌握机器基本功能后，请参考这些实用小贴士，助你缝制成功。\n\n## 贴士 1：使用超锋利的针\n\
  \n购买一包包含多种规格（通常为 8 到 16 号）的缝纫机针。大多数机器适用通用机针，但部分（通常是老款）机型使用不同类型。还要根据面料类型匹配机针：通用机针适合梭织面料，而针织和弹力面料则需要圆头针。\n\
  \n定期更换缝纫机针，因为很难肉眼判断是否受损。使用损坏或钝化的机针反而会损坏你试图修补的物品面料。\n\n## 贴士 2：使用合适尺寸的针\n\n始终将机针尺寸与你即将缝制的面料厚度相匹配（见下表）。基本上，数字越大，机针越粗。\n\
  \n| 机针尺寸 | 面料类型 |\n| --- | --- |\n| 8(60) 和 10(70) | 轻薄面料，如棉细布、丝绸和薄纱 |\n| 12(80)\
  \ | 中等厚度面料，如针织布、平纹布、衬衫布和亚麻布 |\n| 14(90) 和 16(100) | 厚重面料，如棉斜纹布、牛仔布和灯芯绒 |\n\n## 六步轻松给缝纫机穿线\n\
  \n![DK](img/Page_027_01.png`)\n\n> 双击图片查看标签\n\n## 熟悉你的机器\n\n![DK](img/Page_028_03.png`)\n\
  \n> 双击图片查看标签\n\n## 贴士 3：了解你的机器\n\n参考说明书/教程准备机器：绕底线并装入、装入新机针、给机器穿线。此外，检查张力旋钮是否按说明书设置。然后，在布料碎片上试缝。如果可能，在类似你即将修补的衣物类型和厚度的面料上练习。\n\
  \n\n\n# 缝纫机技巧\n\n选择直线针脚缝制几行，然后将面料从机器上取下检查一下。检查针脚在面料两面是否均匀。如果线圈混乱，或者针脚在一面看起来比另一面松得多或紧得多，请小心地重新穿线并重新装入梭芯。可能是你漏掉了一个关键的穿线点。\n\
  \n## 一包混合针\n\n![DK](img/Page_027_02.png)\n\n## 正确安装机针\n\n![DK](img/Page_027_03.png)\n\
  \n## 线张力对吗？\n\n![DK](img/Page_028_01.png)\n\n## 技巧 4：给机器一点关爱\n\n如果你已经按照说明书和/或相关教程操作，并遵循了此处列出的其他技巧，但机器仍拒绝正常工作，那么很可能是时候请专业人士来维修了。缝纫机，尤其是老式机型，需要偶尔保养以保持良好工作状态。即使是较新的机型，如果长期闲置或遭遇过意外，也可能需要维修人员的精心呵护。\n\
  \n## 技巧 5：学习基本针脚\n\n当机器缝制顺畅时，你便可以为修补选择最合适的针脚。每个修补技巧页面都会指定推荐的针脚类型，但你技能库中最实用的针脚是直线针脚、之字形针脚和三步之字形针脚。除最基础的缝纫机型号外，所有机型都应允许你在需要时调整不同针脚的长度和宽度。在开始修补前，务必在废料布上测试你选择的针脚及所做的任何调整。\n\
  \n### 三种基本针脚\n\n![DK](img/Page_028_02.png)\n\n## 技巧 6：找到倒缝功能\n\n每次缝制开始和结束时，都要使用倒缝（回针）来固定线迹，否则你的修补很可能会散开。\n\
  \n> **小贴士**\n>\n> 为了方便穿针，将线头斜剪，并捏住靠近末端的地方引导它穿过针眼。\n\n---\n\n# 缝纽扣\n\n*“我连个纽扣都不会缝！*”\
  \ 是一句常在提到缝纫或衣物护理时听到的流行语。然而，缝上纽扣是衣物修补的基础起点。字面上只需五分钟的功夫，就能防止一件衣物永久闲置。\n\n| **所需工具**\
  \ | | 手缝针、线、同尺寸纽扣、剪刀/剪线钳 |\n| --- | --- | --- |\n\n![DK](img/Page_030_02.png)\n\n\
  > **小贴士**\n>\n> 开始前，清除可能仍附着在纽扣上或衣物原纽扣位置的残留线头。\n\n![DK](img/Page_030_03.png)\n\n\
  **1** 将一根约 20 英寸（50 厘米）长的线穿入缝纫针。将线的两端合在一起打个结。在第一个结上再打第二个结，使其更粗大。现在你有了双股线。接下来，根据你的纽扣类型选择相应的方法。\n\
  \n## 缝带孔纽扣\n\n![DK](img/Page_031_01.png)\n\n**2a** 从背面将针穿过面料并穿过一个上孔。按住纽扣固定位置，同时将针线完全拉过。\n\
  \n![DK](img/Page_031_02.png)\n\n**3a** 将针穿过下方的孔并将针线完全拉过。重复步骤 2a 和 3a 三到四次；如有必要，对第二对孔重复相同操作。\n\
  \n## 缝带柄纽扣\n\n![DK](img/Page_031_03.png)\n\n**2b** 从背面将针穿过面料并从柄下穿过。按住纽扣固定位置，同时将针线完全拉过。\n\
  \n![DK](img/Page_031_04.png)\n\n**3b** 使纽扣平贴在衣物上。将针从柄下方穿过面料并将针线完全拉过。重复步骤 2b 和 3b\
  \ 三到四次。\n\n![DK](img/Page_031_05.png)\n\n**4** 翻转衣物，以便清晰地看到纽扣背后的区域。在固定纽扣的针脚上重叠缝两个小针脚。拉紧并剪去靠近面料处的多余线头。\n\
  \n---\n\n# 修补纽扣眼\n\n纽扣眼周围的断线会导致恼人的脱线。这不仅显得凌乱，还会让纽扣难以穿过。然而，几针精心缝制的针脚就能修补断线，带来无与伦比的成就感。\n\
  \n| **所需工具** | | 剪刀/剪线钳、手缝针、配色线 |\n| --- | --- | --- |\n\n| **左撇子？** | | 如果反方向操作更舒服，请按相反于此处所示的方向操作\
  \ |\n| --- | --- | --- |\n\n![DK](img/Page_032_01.png)\n\n**1** 小心剪去任何脱线，如果可能，拆除原纽扣眼上的断线。参考缝纽扣的步骤\
  \ 1 了解如何准备针线。\n\n![DK](img/Page_032_02.png)\n\n**2** 手持衣物使正面朝向你，纽扣眼水平放置。从背面将针向上穿过面料，在原针脚高度的底部穿出。从上方拉出针线。\n\
  \n![DK](img/Page_033_01.png)\n\n**3** 将针从针刚穿出位置正上方的纽扣眼缝隙中向下穿入。从背面将针线大部分拉过缝隙。轻轻拉动，在右侧留一个线圈。\n\
  \n![DK](img/Page_033_02.png)\n\n**4** 再次从背面在步骤 2 的同一位置将针向上穿过面料。从上方拉出针线，然后将针穿过步骤\
  \ 3 留下的线圈。向上拉针线收紧。\n\n![DK](img/Page_033_03.png)\n\n**5** 像之前一样将针穿过缝隙，然后从背面在上一针稍微偏右的位置穿过面料。将针线几乎完全拉出，留一个线圈，如之前一样。穿过这个第二个线圈并收紧。\n\
  \n![DK](img/Page_033_04.png)\n\n**6** 继续重复步骤 5，每次总是将针在上一针稍微偏右的位置向上穿出，直到破损区域被填满。收尾时，在最后一针的内侧边缘缝一个极小的针脚。拉紧并剪断线。\n\
  \n---\n\n# 对比色纽扣\n\n更换纽扣是改变衣物外观的简易方法。务必确保新纽扣与旧纽扣尺寸相同。\n\n![DK](img/Page_034_01.jpg)\n\
  \n---\n\n# 修补衣摆\n\n修补散开的衣摆是项简单的任务。如果原衣摆针脚几乎不可见，请遵循隐形衣摆法。如果有明显的一行针脚，请使用明线衣摆法。两种方法都要将线色与面料匹配。\n\
  \n| **所需工具** | | **隐形衣摆法：** 熨斗、熨衣板、大头针、卷尺、锋利的手缝针、配色线、剪刀/剪线钳  \n**明线衣摆法：** 剪刀/剪线钳、大头针（可选）、手缝针、配色线、布料标记工具（可选）\
  \ |\n| --- | --- | --- |\n\n| **左撇子？** | | 如果反方向操作更舒服，请按相反于此处所示的方向操作 |\n| --- |\
  \ --- | --- |\n\n> **小贴士**\n>\n> 如果衣摆断线段落很长，建议使用布料标记工具画一条缝制引导线。\n\n## 隐形衣摆法\n\n\n\
  \n\n## 暗针修补衣摆\n\n如果您的衣物衣摆原本是用几乎看不见的针脚缝制的，请使用下面的暗针法来修补衣摆，使其完美融合。\n\n![DK](img/Page_037_01.png)\n\
  \n**1** 以原有的折痕线为基准，重新折好松脱的衣摆部分，如有必要用熨斗烫平折痕。用别针固定衣摆，将别针水平放置在距离衣摆内边缘约 ⅝ 英寸（1.5 厘米）处，别针尖朝左。\n\
  \n![DK](img/Page_037_02.png)\n\n**2** 穿好一根长度不超过 18 英寸（45 厘米）的单股线在尖针上。在线的一端打个结。拿住衣物，使衣摆的折边朝向自己，从右向左缝纫。\n\
  \n![DK](img/Page_037_03.png)\n\n**3** 将针从衣摆背面穿到正面，距离上边缘约 ³⁄₁₆ 英寸（5 毫米）处，以此固定线头，使结隐藏在衣摆后面。\n\
  \n![DK](img/Page_037_04.png)\n\n**4** 斜向左上方挑取衣摆上方面料的几根线，针脚长度不超过 ⅜ 英寸（1 厘米）。拉过线完成针脚，但不要拉得太紧。\n\
  \n![DK](img/Page_038_01.png)\n\n**5** 将针尖斜向左下方移动。再次挑取衣摆面料的几根线，针脚长度不超过 ⅜ 英寸（1 厘米）。拉过线完成针脚。以此方式继续缝制，重新固定衣摆。\n\
  \n![DK](img/Page_038_02.png)\n\n**6** 收尾时，拔出别针，仅在衣摆面料上重叠缝两个约 ³⁄₁₆ 英寸（5 毫米）长的小针脚。剪掉靠近面料处的多余缝纫线。用熨斗轻轻烫压修补好的衣摆，使针脚定型。\n\
  \n修补衣物 | 目录\n\n## 明线衣摆修补法\n\n用明线修补衣摆比暗针法甚至更简单！现在来学习如何回针缝。\n\n![DK](img/Page_038_03.png)\n\
  \n**1** 仔细清除断裂针脚处残留的线头。将衣摆朝外（衣物正面朝上）摆放。如有必要，用别针将断裂的衣摆部分固定回原位，别针水平放置。\n\n![DK](img/Page_038_04.png)\n\
  \n**2** 请参考缝纽扣的步骤 1 来准备针线。将针从原衣摆针脚行最后两个完好针脚之间穿出。从正面拉出针线。\n\n![DK](img/Page_039_01.png)\n\
  \n**3** 将针向后（远离断裂针脚处）移动。在针穿出位置后方一个针脚长度处将针穿入面料背面。从背面拉出针线；这些重叠的针脚应能防止脱线。\n\n![DK](img/Page_039_02.png)\n\
  \n**4** 仍将针握在衣摆背面，将针向断裂处移回。在左侧两个针脚长度处将针从面料背面穿到正面。从正面拉出针线。再缝一个回针，向右一个针脚长度。\n\n![DK](img/Page_039_03.png)\n\
  \n**5** 现在您已在原针脚上缝了两针。重复步骤 4，沿着断裂的衣摆部分继续缝回针。请尽量使针脚长度与原衣摆针脚一致，以便新针脚融为一体。\n\n![DK](img/Page_039_04.png)\n\
  \n**6** 当回针行缝到原针脚处时，再缝两针。将衣摆翻到里面。收尾时，拔出别针，在一个回针后面重叠缝两个小针脚；这些针脚从正面不应可见。剪掉多余的线。\n\n\
  修补衣物 | 目录\n\n# 从正面修补破洞\n\n把衣服上的破洞看作是一场有趣的创作机会吧！打上补丁；效果可以是低调的、美观的，或是疯狂独特的。然后，用刺子绣风格的针法来庆祝您的修补成果。\n\
  \n修补不想凸显的区域时（如牛仔裤的臀部），可使用与衣物颜色相匹配的补布和线。或者，您也可以在膝盖、肘部或任何想引人注目的地方，使用对比色的线或补布本身作为亮点。\n\

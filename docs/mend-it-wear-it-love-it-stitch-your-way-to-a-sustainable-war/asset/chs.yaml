  \ng 修补衣物 g 目录\n\n## 从背面贴补破洞\n\n你已学会如何从正面贴补，现在让我们再掌握几种破洞修补方法。从内侧贴补破洞或受损区域，能获得更隐蔽的修复效果，同时防止问题恶化。以下介绍三种方法。\n\
  \n| **所需工具** | |\n| --- | --- |\n| **贴补结实衣物：** | 剪刀/剪线钳、卷尺、布料标记工具、直尺（可选）、制作补丁的布料（紧密编织、无弹力的面料效果最佳）、布剪、大头针或别针、手缝针、线、100%\
  \ 棉刺子线（可选） |\n| **免缝法：** | 剪刀/剪线钳、烫熨衬里、熨斗、熨衣板、垫布 |\n| **加固缝制：** | 布料标记工具、卷尺、直尺（可选）、烫熨衬里、布剪、熨斗、熨衣板、垫布、手缝针、配色线或\
  \ 100% 棉刺子线、剪刀/剪线钳 |\n\n| **缝纫机？** | 可用于加固缝制 |\n| **左撇子？** | 如果觉得更舒服，可按相反方向操作 |\n\
  \ng 修补衣物 g 目录\n\n### 贴补结实衣物\n\n此法适用于修补结实衣物上的破洞——牛仔裤、长裤和无里夹克。补丁和线的颜色将决定修补痕迹是显眼还是融为一体。\n\
  \n![DK](img/Page_047_01.png)\n\n**1** 将衣物正面朝上铺平，检查破洞。修剪破洞内缘的残线。考虑补丁的大小和形状以覆盖破洞（及薄弱区域），然后四周各额外增加\
  \ ¾ 英寸（2 厘米）左右。\n\n![DK](img/Page_047_02.png)\n\n**2** 用布料标记工具将此形状直接画在衣物上——应充分覆盖受损区域。直边形状更易操作，沿直尺或卷尺绘制。\n\
  \n![DK](img/Page_047_03.png)\n\n**3** 以绘制的形状为模板，从废料中剪出同等大小形状的补丁。将补丁置于内侧，使其轮廓与绘制形状对齐。用大头针固定。\n\
  \n![DK](img/Page_047_04.png)\n\n**4** 按步骤 1 准备针线。从背面在补丁边缘 ⅜ 英寸（1 厘米）处穿针上来。在四周缝平针，固定并剪断线（见步骤\
  \ 5 和步骤 6）。\n\n![DK](img/Page_048_01.png)\n\n**5** 换新线，按前法准备针线。现在将在破洞边缘缝绕边针。从背面穿过双层布料，在距破洞边缘\
  \ ³/[16] 英寸（5 毫米）处穿针上来。从正面拉过针线。\n\n![DK](img/Page_048_02.png)\n\n**6** 将针从破洞边缘内侧刺入补丁布料。从背面拉过针线。下一针，将针斜向一侧移动，再次从正面穿出，靠近第一针绕边针。从正面拉过针线。\n\
  \n![DK](img/Page_048_03.png)\n\n**7** 继续沿破洞边缘四周缝绕边针。收尾时，将针引至背面，在仅穿衣物面料（不穿补丁）的情况下重叠缝两小针；正面不应露出。剪去多余线头，擦除布料标记。\n\
  \ng 修补衣物 g 目录\n\n### 免缝法\n\n这种简单的免缝法非常适合修补极小破洞，尤其是针织衣物和薄面料。\n\n![DK](img/Page_049_01.png)\n\
  \n**1** 选择合适厚度的烫熨衬里，剪出一个足以覆盖破洞的圆片。将圆片胶面朝下置于衣物内侧破洞处。使用垫布防止胶水溢出（见小贴士），用熨斗烫压。衬里需热熔粘合，但请确认衣物耐热。\n\
  \n![DK](img/Page_049_02.png)\n\n**2** 检查衬里是否牢固粘合：用指甲尝试撬起边缘。若衬里开始脱离，延长烫压时间或在可能情况下提高熨斗温度。小心不要烫焦面料！\n\
  \n#### 小贴士\n\n熨斗与衬里之间、衬里与熨衣板之间务必垫一块垫布，防止胶水沾到不该沾的地方。一块薄或中等厚度的 100% 棉布——旧干净手帕或床单的一角——均可作为垫布。\n\
  \ng 修补衣物 g 目录\n\n### 加固缝制\n\n将前两法结合即得此技法：它将稳固的衬里与加固缝线相结合，非常适合磨损严重但不想凸显修补痕迹的部位。\n\
  \n![DK](img/Page_050_01.png)\n\n**1** 铺平衣物，检查受损或薄弱区域。对着光看以判断范围。在衣物内侧用布料标记工具绘制覆盖该区域的形状，四周各延伸\
  \ ¾ 英寸（2 厘米）。\n\n![DK](img/Page_050_02.png)\n\n**2** 选择与衣物面料厚度匹配（未受损部分）的烫熨衬里。参考步骤\
  \ 1 绘制的指引，从衬里上剪出所需形状。按免缝法用熨斗将衬里烫贴于衣物内侧。\n\n![DK](img/Page_050_03.png)\n\n**3** 穿入刺子线，或按步骤\
  \ 1 用普通线准备四股线（见小贴士）。尽量选择与衣物面料颜色最接近的线。将衣物翻至正面，按步骤 2 至步骤 5 操作，用整齐的刺子风格十字针覆盖受损区域。\n\
  \n#### 使用缝纫机\n\n![DK](img/Page_051_01.png)\n\n\n\n**1** 你可以在步骤 3 中使用缝纫机代替手工缝制。设置好缝纫机。找到针迹类型选择器并选择直线针迹。然后在针距选择器上选择\
  \ 3–3.5。\n\n![DK](img/Page_051_02.png)\n\n**2** 将物品放在缝纫机上（这可能有点棘手，取决于补丁的位置），在受损区域来回缝制。翻转衣物，使下一行针脚与第一行针脚成直角，以加固修补处。\n\
  \n**实用贴士**\n\n根据破洞的大小、面料类型和破洞的位置选择修补方法。\n\ng 修补衣物 g 目录\n\n# 补织破洞\n\n在心爱的羊毛衫或针织衣物上发现破洞会让人难过，但这不意味着它的寿命就此终结。补织破洞比本书中的其他修补方法稍微耗时一些，但发挥你内心的“奶奶精神”绝对值得，因为这能延长衣物的使用寿命。\n\
  \n| **所需工具** | 补织针、补织线（选择颜色接近的线以使修补处融为一体，或选择对比色以制作显性修补）、剪刀/剪线钳、补织蘑菇或补织蛋（或饮用杯底、橘子）（可选）\
  \ |\n| --- | --- |\n| **惯用左手？** | 如果反方向操作更舒服，请按此处所示的相反方向进行 |\n\n![DK](img/Page_052_01.png)\n\
  \n**1** 在补织针上穿一根约 20 英寸（50 厘米）长的补织线。线头不打结。将物品正面朝上（下方垫上补织蘑菇），将针尖插入距离破洞约 ⅝ 英寸（1.5\
  \ 厘米）处。\n\n![DK](img/Page_052_02.png)\n\n**2** 始终将针保持在衣物正面。再次将针尖刺出，位置距离插入点 ⅛ 英寸（4\
  \ 毫米）。从上方向上拉出针和线，但留出约 1⅝ 英寸（4 厘米）长的线尾。\n\n![DK](img/Page_053_01.png)\n\n**3** 继续让针在织物中上下穿插，形成一排直线针脚。尽量保持针脚细小均匀，长度不超过\
  \ ⅛ 英寸（4 毫米）。继续缝制，直到这一行延伸至破洞上方至少 ⅝ 英寸（1.5 厘米）处。\n\n![DK](img/Page_053_02.png)\n\n\
  **4** 在行末留一个小线圈，换个方向，再缝一排直线针脚，紧挨第一排但方向向下。以此方式继续上下缝制以覆盖整个区域。每行末端的小线圈可为缩水留出余地。\n\n\
  ![DK](img/Page_053_03.png)\n\n**5** 缝制横向的直线针脚行，在经过破洞时在纵向针脚间上下穿插。这将在破洞上方形成新的“织物”。如果破洞处看起来不够密实也不必担心，因为补织线会因穿着而起毛变厚实，从而填补空隙。\n\
  \n![DK](img/Page_053_04.png)\n\n**6** 修补过程中，你很可能需要给针重新穿更多的线，最后补织边缘会有松散的线头。逐个处理每个线头，穿上针，将其编织进修补处以隐藏并固定。\n\
  \ng 修补衣物 g 目录\n\n# 显性补织\n\n修补针织品提供了一个尽情发挥创意的绝佳机会。别费心去匹配颜色了——直接加入一抹对比色亮点吧。\n\n![DK](img/Page_054_01.jpg)\n\
  \n© KATE SEKULES\n\ng 修补衣物 g 目录\n\n# 修补撕裂\n\n此时，你已掌握几招处理衣物破洞的妙招。但如果袖子撕裂或破了个口子怎么办？别担心，这里还有两招。\n\
  \n| **所需工具** | |\n| --- | --- |\n| **牢固修补法：** | 粘合衬、布剪、熨斗、熨衣板、熨烫布、手缝针、配色线、剪刀/剪线钳\
  \ |\n| **隐形修补法：** | 大头针、织物标记工具、手缝针、配色线、剪刀/剪线钳、熨斗、熨衣板 |\n\n| **用缝纫机？** | |\n| ---\
  \ | --- |\n| **牢固修补法：** | 按步骤 1 和 2 操作，然后在撕裂处使用宽之字针迹代替包边针 |\n| **隐形修补法：** | 按步骤\
  \ 1 和 2 操作，然后使用直线针迹（设为长度 2）代替直线针脚 |\n\n**实用贴士**\n\n如果撕裂周围区域也受损，你可能需要给它打补丁（参见从正面补洞）。如果只是单纯的裂口或撕裂，请使用此处展示的方法之一。\n\
  \ng 修补衣物 g 目录\n\n# 牢固修补法\n\n让我们重温并再次运用包边针。虽然这种方法比下一种更显眼，但它能为经常穿着的衣物提供更稳固、牢靠的修补效果。\n\
  \n![DK](img/Page_057_01.png)\n\n**1** 选择与衣物面料厚度相似的粘合衬；它会在缝制前稳固撕裂区域。剪一块宽约 1 英寸（2.5\
  \ 厘米）、比撕裂口长 1 英寸（2.5 厘米）的长方形。\n\n![DK](img/Page_057_02.png)\n\n**2** 将衣物反面朝上放在熨衣板上。将撕裂的边缘对齐拼合，将粘合衬（胶面朝下）覆盖在撕裂处上方。垫上熨烫布，用熨斗小心熨烫。\n\
  \n![DK](img/Page_057_03.png)\n\n**3** 正面朝上，像步骤 2 那样准备好针线。从撕裂口下方、距离撕裂口至少 ⅛ 英寸（3 毫米）处开始，从背面将针刺入并从正面拉出。\n\
  \n![DK](img/Page_057_04.png)\n\n**4** 将针穿过到撕裂口的另一侧。刺穿织物，形成一个跨过撕裂口的针脚。从背面将针线向下拉出。不要拉得太紧，以免“绞紧”织物。\n\
  \n![DK](img/Page_058_01.png)\n\n**5** 从背面将针斜向上移动。将针穿过粘合衬和织物从正面刺出，这次位置在第一个针脚上方约 ⅛\
  \ 英寸（3 毫米）处。从正面拉出针线。重复步骤 4 完成第二个针脚。\n\n![DK](img/Page_058_02.png)\n\n**6** 重复步骤\
  \ 4 和 5，沿着撕裂口长度缝出整齐的“梯子状”针脚。在撕裂口末端再缝一两个针脚。然后在背面重叠缝两个小针脚固定。剪去多余线头。\n\ng 修补衣物 g 目录\n\
  \n# 隐形修补法\n\n直线针脚有助于制作隐形修补效果（适合有图案的面料，不太适合易脱线的面料）。\n\n![DK](img/Page_058_03.png)\n\
  \n**1** 将衣物正面相对折叠，使撕裂口的长度方向沿着折边。将大头针垂直插在折边上，保持织物平整且位置固定。\n\n![DK](img/Page_058_04.png)\n\
  \n**2** 物品平铺，用织物标记工具画一条缝制引导线——一条平滑的曲线，距离撕裂口边缘约 ³/₁₆ 英寸（5 毫米）。起止位置距离两端各约 ⅜ 英寸（1 厘米）。\n\
  \n![DK](img/Page_059_01.png)\n\n**3** 像步骤 2 那样准备好针线。从紧贴折边处开始，从背面将针穿过两层织物刺向正面。从正面拉出针线。\n\
  \n![DK](img/Page_059_02.png)\n\n**4** 沿着线条再向前约 ⅛ 英寸（3 毫米）将针刺回背面。从背面将针线向下拉出。目标是针脚紧密，但要尽量保持织物平整，避免起皱。\n\
  \n![DK](img/Page_059_03.png)\n\n\n\n**5** 将针从距离第一针约 ⅛ 英寸（3 毫米）处挑到正面，并沿着线迹继续缝制整齐、均匀的平针。经常检查针脚是否穿过完好的面料，且距离撕裂边缘至少\
  \ ³⁄₁₆ 英寸（5 毫米）。\n\n![DK](img/Page_059_04.png)\n\n**6** 当缝制行回到折边时，在同一位置缝两个小针脚以结束。剪去多余的线头并拔出大头针。将衣物翻面，熨斗调至低温档，轻轻熨平修补处。\n\
  \ng 修补衣物 g 目录\n\n# 修补开线的缝合线\n\n开线的缝合线与撕裂不同，因为只有缝线断了；面料本身仍然完好。如果问题是开线的缝合线，即使衣物有全衬里，也很容易做出肉眼不可见的修补。\n\
  \n## 所需工具\n\n| 方法 | 工具 |\n| --- | --- |\n| 从正面修补 | 剪刀/剪线钳、手缝针、配色线 |\n| 从里面修补 | 剪刀/剪线钳、大头针（可选）、手缝针、配色线、布料标记工具（可选）\
  \ |\n| 修补与加固 | 剪刀/剪线钳、卷尺、粘合衬、布剪、熨斗、熨衣板、垫布、布料标记工具、手缝针、配色线 |\n\n## 缝纫机？\n\n| 方法 |\
  \ 说明 |\n| --- | --- |\n| 从里面修补 | 按照步骤 1 和 2 操作，然后用直线针迹代替平针。 |\n| 修补与加固 | 按照步骤 1\
  \ 到 4 操作，然后用直线针迹代替平针。 |\n\n## 左撇子？\n\n| 注意事项 |\n| --- |\n| 如果觉得更舒服，请按此处所示的相反方向操作\
  \ |\n\ng 修补衣物 g 目录\n\n# 从正面修补\n\n通过制作一种暗针（也称为梯子针、隐形针或盲针）来修补任何开线的缝合线，这种针法我们最初用于修补下摆。\n\
  \n![DK](img/Page_061_01.png)\n\n**1** 正面朝向你，剪去开线处任何松散的线头。穿好针线，长度约 12 英寸（30 厘米）。在一端打个结，然后在第一个结上再打第二个结，使其更粗大。\n\
  \n![DK](img/Page_061_02.png)\n\n**2** 从开线处内侧的缝份穿入针尖，使针尖从开线起始处的原缝合线处钻出。从正面拉出针，这样结就会隐藏在里面。\n\
  \n![DK](img/Page_061_03.png)\n\n**3** 将针直接穿到钻出点正下方的缝合线对面。将针插入原缝合线的另一侧边缘，向左穿过，缝一个长\
  \ ⅛ 英寸（3 毫米）的水平针脚。\n\n![DK](img/Page_061_04.png)\n\n**4** 拉出针线，开始合拢缝合线两边的缝隙。将针穿回缝合线对面，在缝合线的上边缘缝一个长\
  \ ⅛ 英寸（3 毫米）的水平针脚。\n\n![DK](img/Page_062_01.png)\n\n**5** 沿着开线缝合线的长度重复步骤 3 和 4。仔细在每针结束时拉紧线，程度足以合拢缝隙但避免起皱。你想要的是隐形的针脚和漂亮的平整缝合线。\n\
  \n![DK](img/Page_062_02.png)\n\n**6** 结束时，在缝合线边缘内侧缝一个极小的针脚。轻轻拉过线，留一个小线圈。将针穿过这个线圈，然后拉紧并剪去多余的线头。\n\
  \ng 修补衣物 g 目录\n\n# 从里面修补\n\n使用此方法修补无衬里衣物上开线的缝合线，因为你可以接触到开线缝线的两面——这能实现牢固且持久的修补。\n\
  \n![DK](img/Page_062_03.png)\n\n**1** 将衣物平铺在平面上，使衣物内侧朝上且缝合线可见。小心剪去开线缝合线段两侧任何松散的线头。\n\
  \n![DK](img/Page_062_04.png)\n\n**2** 除非开线段非常短，否则使用大头针将其固定并保持平整以便操作。将大头针垂直于缝合线插入。像步骤\
  \ 1 那样准备针线。\n\n![DK](img/Page_063_01.png)\n\n**3** 要填补开线段，你将沿着原缝合线缝制平针。如果原缝线留下的折痕或针孔不可见，请使用布料标记工具画一条引导线。\n\
  \n![DK](img/Page_063_02.png)\n\n**4** 从未开线的缝合线段几针处开始。从背面将针穿过两层面料挑起，然后在约 ⅛ 英寸（3 毫米）远的地方从背面刺入并拉下。\n\
  \n![DK](img/Page_063_03.png)\n\n**5** 重复步骤 4，缝制一排平针以填补开线段。注意保持针脚在原缝合线上。多缝几针，与原未开线的缝线重叠。\n\
  \n![DK](img/Page_063_04.png)\n\n**6** 结束时，在最后一针上重叠缝两个小针脚。剪去多余的线头并拔出所有大头针。熨斗调至低温档，从反面轻轻将缝合线熨平。\n\
  \ng 修补衣物 g 目录\n\n# 修补与加固\n\n当缝合线承受压力时，缝线开线可能伴随面料磨损或损坏。此方法同时解决这两个问题，并提供整洁的完成效果。\n\
  \n![DK](img/Page_064_01.png)\n\n**1** 将衣物平铺在平面上，使衣物内侧朝上且缝合线可见。小心剪去任何松散的线头。测量开线和损坏段的长度。\n\
  \n![DK](img/Page_064_02.png)\n\n**2** 选择一块与衣物重量相似的粘合衬。在测量的开线长度基础上增加 1 英寸（2.5 厘米），标记出宽\
  \ ⅝ 英寸（1.5 厘米）的形状。剪出两条此尺寸的条带。\n\n![DK](img/Page_064_03.png)\n\n**3** 将一条衬条胶面朝下居中放在开线缝合线和损坏面料区域上。使用垫布，用熨斗熨烫固定。将缝合线翻面，用第二条衬条重复操作。\n\
  \n![DK](img/Page_064_04.png)\n\n**4** 用布料标记工具画一条缝制引导线。从原缝合线开始，然后向外弯曲约 ⅛ 英寸（3 毫米）避开磨损处，使缝线穿过完好的面料。再回到原线上。\n\
  \n![DK](img/Page_065_01.png)\n\n**5** 像步骤 2 那样准备针线，然后重复步骤 4 到步骤 6 缝制一排平针。为防止散线，在新缝线的开始和结束处，多缝几针与原缝线重叠。\n\
  \n![DK](img/Page_065_02.png)\n\n**6** 在衣物内侧熨烫修补好的缝合线——如果是开缝，将缝份熨开；如果是合缝，将缝份的两部分熨向一侧。然后，将衣物翻面，从正面熨烫修补处。\n\
  \n## 小贴士\n\n将粘合衬的重量和色调与衣物面料相匹配，以获得最佳效果。\n\ng 修补衣物 g 目录\n\n# 拉链问题\n\n拉链是巧妙的发明，很难想象没有拉链的衣橱。然而，它们可能以多种——且壮观的——方式失灵。更换拉链最好交给裁缝或改衣专家，但这里有一些值得先在家尝试的技巧和窍门。\n\
  \n\n\n\n# 拉链修复\n\n## 拉链类型\n\n服装中常见的拉链主要有三种类型：开口拉链、闭口拉链和隐形拉链。开口拉链的两端可以完全分开，主要用于连帽衫和夹克等拉链贯穿式服装的固定。闭口拉链底部相连。它们见于各类服装，包括牛仔裤和长裤的前襟拉链。隐形拉链几乎只用于女装。安装得当时，只有拉链头可见，有助于服装保持流畅、合身的轮廓。\n\
  \n## 金属还是塑料？\n\n大多数现代拉链的齿由聚酯或尼龙制成。轻量级塑料齿拉链的齿由线圈形成。另一方面，金属拉链常见于牛仔裤和更结实的外套，其齿由黄铜、不锈钢、铝或锌制成，呈分离状。\n\
  \n![DK](img/Page_066_01.png)\n\n## 卡滞的拉链\n\n拉链卡住时会让人非常恼火。如果拉链难以拉开或拉合，首先检查齿间是否卡住了什么东西：可能是头发或线头。否则，可以在滑块上方或下方的齿上涂抹一些润滑剂。蜡烛油、蜡笔、铅笔芯、肥皂或润唇膏都能帮助拉链恢复顺滑。然后，晃动滑块使润滑剂渗入齿间。只需小心别弄脏衣物面料。\n\
  \n**让卡滞的拉链顺滑起来**\n\n![DK](img/Page_067_01.png)\n\n## 拉链头损坏或丢失\n\n如果拉链头断了，拉开和拉合拉链会非常麻烦。但如果滑块前端的环仍完好，你就走运了。试着将一根细金属丝穿过这个环并做成一个圈，作为新的拉链头。回形针或钥匙圈也可以派上用场。你也可以买更花哨的替换拉链头。\n\
  \n**回形针变身拉链头**\n\n![DK](img/Page_067_02.png)\n\n## 松动的拉链滑块\n\n当你拉上拉链时，如果滑块留下一些齿未合拢，说明滑块松动了。用钳子轻轻夹住滑块与齿接触的底部通常就能解决问题。测试修复后的拉链，如有需要可再夹紧一点。\n\
  \n**收紧拉链滑块**\n\n![DK](img/Page_068_01.png)\n\n## 拉链下方缝合处的破洞\n\n反复拉开拉合拉链的压力可能导致拉链正下方的缝合处出现破洞。这在带隐形拉链的裙子和连衣裙中尤为常见。按照`修补开裂的缝合线`中方法\
  \ 1 的技巧，使用梯子针法修补此类破洞。\n\n**修补拉链下方的破洞**\n\n![DK](img/Page_068_03.png)\n\n## 拉链自动下滑\n\
  \n大家都能理解裤门拉链失误带来的尴尬。如果你的裤子或牛仔裤拉链合不上，长久之计是更换拉链。但临时的办法是给拉链头系个钥匙圈。拉上拉链，然后将这个圈挂在腰头的纽扣上，再扣上纽扣，以免走光或尴尬。\n\
  \n**帮助拉链保持拉上状态**\n\n![DK](img/Page_068_02.png)\n\n## 损坏的拉链滑块\n\n在采取更换整条拉链这一激进（且更昂贵）措施前，不妨尝试一点服装\
  \ DIY，因为替换滑块网上买很便宜。用钳子剪断损坏的滑块将其移除。在拉链顶部、你拆下损坏滑块的那一侧，拨开顶端挡，将替换滑块滑入齿中，然后像往常一样拉拉链。\n\
  \n**移除损坏的滑块**\n\n![DK](img/Page_068_04.png)\n\n## 小贴士\n\n如果拉链缺齿或齿错位，请找修改专家更换。否则很难修好。\n\
  \n`g MEND YOUR CLOTHES g CONTENTS`\n\n# 修补衣领和袖口\n\n穿着几年后，衬衫或女式衬衫的领子和袖口可能开始出现磨损迹象，而衣服其他部分依然如新。要是有办法加固并遮盖这些令人心碎的磨损处就好了。哦，真有！请看：斜纹带。\n\
  \n| **所需工具** | | 卷尺，39 英寸（1 米）或 1 包宽¾英寸（2 厘米）或稍宽的斜纹带（视销售方式而定），剪刀/剪线钳，大头针，手缝针，线（颜色与斜纹带匹配）\
  \ |\n| --- | --- | --- |\n\n| **左撇子？** | | 如果觉得更舒服，请按此处所示的相反方向操作 |\n| --- | ---\
  \ | --- |\n\n## 小贴士\n\n斜纹带有各种颜色和图案可选。选择与面料颜色接近的斜纹带可实现隐形修补，或挑选对比色的斜纹带增添全新设计细节——全凭你喜好。\n\
  \n`g MEND YOUR CLOTHES g CONTENTS`\n\n## 修补衣领\n\n衣领摩擦颈部，久而久之面料开始磨损。沿衣领用绕边针法缝上一段斜纹带可提供保护，延长衣物寿命。\n\
  \n![DK](img/Page_071_01.png)\n\n**1** 将衣领铺平。沿内侧磨损部分从边缘量到边缘。如果斜纹带端头不整齐，修剪一下。然后，在衣领长度基础上加¾英寸（2\
  \ 厘米），剪下该长度的斜纹带。\n\n![DK](img/Page_071_02.png)\n\n**2** 将斜纹带沿衣领放置，使其居中覆盖磨损处；两端各延伸⅜英寸（1\
  \ 厘米）。用大头针以 45°角固定。像`步骤 2`那样准备针线。\n\n![DK](img/Page_071_03.png)\n\n**3** 将斜纹带端头向内折叠⅜英寸（1\
  \ 厘米），使折痕与衣领边缘齐平。从折痕底部边缘处将针穿过斜纹带向上引出，以便隐藏线结。\n\n![DK](img/Page_071_04.png)\n\n**4**\
  \ 将针尖刺入衣领面料表层，然后斜向穿出，从包边边缘出来，距离初次出针处约⅛英寸（3 毫米）。\n\n![DK](img/Page_072_01.png)\n\n\
  **5** 继续沿端头然后沿斜纹带顶部长度做细小的绕边针。到达末端时，翻转衣领，折叠并缝合短端，完成另一侧长度。\n\n![DK](img/Page_072_02.png)\n\
  \n**6** 将针从斜纹带穿出，然后在衣领和斜纹带上做一个小针脚。拉出线，留一个小线圈。将针穿过这个线圈，然后拉紧。剪断线。\n\n`g MEND YOUR\
  \ CLOTHES g CONTENTS`\n\n## 修补袖口\n\n给衣物袖口缝上斜纹带，让它们从破烂变得结实耐用。\n\n![DK](img/Page_072_03.png)\n\
  \n**1** 沿磨损边缘量取袖口长度。如果斜纹带端头不整齐，修剪一下，然后在袖口长度基础上加¾英寸（2 厘米），剪下该长度的斜纹带。\n\n![DK](img/Page_072_04.png)\n\
  \n**2** 将斜纹带居中放在袖口顶部边缘；两端各应延伸⅜英寸（1 厘米）。在一端，将多余的斜纹带折向背面，用拇指和食指按住固定。\n\n![DK](img/Page_073_01.png)\n\
  \n**3** 现在，开始将斜纹带沿长度方向对折，使其仅露出一半宽度。用大头针固定斜纹带。将另一端折进去，然后折叠并固定剩余长度的斜纹带。\n\n![DK](img/Page_073_02.png)\n\
  \n**4** 像`步骤 2`那样准备针线。翻转袖口，现在在内侧操作。从袖口端头斜纹带的折叠边缘将针穿出，以便隐藏线结。\n\n![DK](img/Page_073_03.png)\n\
  \n`g MEND YOUR CLOTHES g CONTENTS`\n\n\n\n**5** 重复步骤 4 制作第一个绷缝针脚。继续沿斜裁带边缘制作一排绷缝针脚。尽量只挑起袖口面料的最表层。\n\
  \n![DK](img/Page_073_04.png)\n\n**6** 在该排末端，将针穿过斜裁带和袖口的所有层。将袖口翻回正面继续缝制。继续用绷缝将斜裁带固定到位。按步骤\
  \ 6 所述完成。\n\ng 修补衣物 g 目录\n\n# 修复可见的明线缝制\n\n明线缝制是可见的缝线，用于加固耐磨区域并突出设计特征。当这些缝线断裂时，会破坏服装的外观。让我们的好帮手——回针缝——来解救吧。\n\
  \n| 所需物品 | 详情 |\n| --- | --- |\n| **你将需要** | 剪刀/剪线钳、大头针（可选）、手缝针、线（颜色匹配的明线缝制线或普通线）\
  \ |\n| **缝纫机？** | 按步骤 1 准备修补，并在机器上选择直线缝。在废布上试缝，然后调整针脚长度并再次试缝，直到你的缝线与原明线缝制相匹配 |\n\
  | **左撇子？** | 如果觉得更舒服，可按此处所示的相反方向操作 |\n\n![DK](img/Page_074_01.png)\n\n**1** 小心剪去断裂明线缝制处的任何松散线头。如果明线缝制固定的口袋或其他部位现已松动或移位，用大头针在缝制过程中将其固定到位。\n\
  \n![DK](img/Page_074_02.png)\n\n**2** 若使用明线缝制线，按步骤 2 穿针。若使用普通线，取长 30 英寸（75 厘米）的一股线。将两端打结（使其变成双股），再打第二个结。\n\
  \n![DK](img/Page_075_01.png)\n\n**3** 用回针缝填补断裂明线缝制的空隙。从里面开始，在原明线缝制排最后两个完好的针脚之间将针向上穿出。从正面将针线拉出。\n\
  \n![DK](img/Page_075_02.png)\n\n**4** 将针向后（远离断裂部分）移动一个针脚距离。将针穿过面料，重叠在完好的针脚上，然后向左前方提起两个针脚长度的位置。\n\
  \n![DK](img/Page_075_03.png)\n\n**5** 再做一个回针缝，向右一个针脚长度。继续沿断裂的明线缝制部分回针缝。尽可能匹配原明线缝制的针脚长度。\n\
  \n![DK](img/Page_075_04.png)\n\n**6** 当回针缝填满空隙后，重叠完好的针脚两针。将针穿到背面，在里面在同一位置做两个小针脚固定。剪去多余线头。\n\
  \ng 修补衣物 g 目录\n\n# 可见缝线\n\n明线缝制用于突出和加固缝线及设计细节，且易于修复。\n\n![DK](img/Page_076_01.jpg)\n\

- pgno: 139
  md: 'noticeable throughout the mobile AR/VR operation, as tracking is more likely
    to be corrupt if the marker is not visible. Correspondingly, another popular motion
    tracking system for mobile AR/VR is the model-based method. This tracking method
    uses a prior model of the environment to be tracked. Usually, this prior knowledge
    consists of 3D models or 2D templates of the real scene.


    # Summary


    This work presented a real-time motion tracking strategy for smartphone AR/VR
    that is more effective than conventional visual-based marker-less tracking approaches.
    A monocular visual-inertial fusion is developed in the document that could effectively
    boost the tracking robustness and enhance frame rate with the aid of an inertial
    sensor, given the real-time and robust posture arriving for mobile AR/VR. Moreover,
    an adaptive filter system is proposed to mitigate the jitter phenomena in heterogeneous
    sensor fusion that can change the filter weight as per various motion circumstances,
    resulting in real-time and smooth motion monitoring for both technologies. Eventually,
    experiments are done in various AR/VR scenarios, and the outcomes indicate that
    the proposed approach is both robust and accurate. A segmented adaptive framework
    is presented in this article for a simplifying calculation, and a suboptimal output
    for real-time motion tracking for smartphone AR/VR is obtained. Even so, unstable
    transitions occur at the segmented point in tracking output, so future work will
    focus on a more continuous filtering system for visual-inertial fusion.'

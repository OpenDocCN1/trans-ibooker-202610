- pgno: 47
  md: '# Standard Algorithms


    The efficiency of these state-of-the-art visual recognition technologies has been
    vastly enhanced due to recent advancements in Neural Networks and deep learning
    approaches. This book is a great platform for learning about deep learning architectures
    and how they’re used in cutting-edge machine vision science. In this book, we
    will go through the five most important computer vision strategies which are:
    Convolutional Neural Networks, AlexNet, Region-Based Convolutional Neural Network
    (R-CNN), and Fast R-CNN. Additionally, we will go through the main deep learning
    models and applications that each strategy can be used for.


    # Image Classification


    Image classification’s (Figure 3-4) goal is as follows: we’re given a series of
    images that are all labeled with a single category, and we’re asked to forecast
    these categories for a new set of test images, and we’re asked to calculate the
    accuracy of our predictions. Viewpoint variance, size variation, intra-class variation,
    image deformation, image occlusion, lighting conditions, and context clutter are
    all problems that this activity presents.


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_47_0.png)


    Figure 3-4. Image Classification


    How can we go about building an algorithm that can categorize images into various
    groups? Researchers in Computer Vision have devised a data-driven solution to
    this problem. They supply the computer with several examples of each image class
    and then create learning algorithms'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'that look at these examples and learn about the visual appearance of each class,
    rather than attempting to determine what each of the image categories of interest
    looks like explicitly in code.


    In other words, a training dataset of labeled images is first fed to the system
    to process and create a classification model accordingly. Here is a formalized
    version of the image classification pipeline:


    +   - A training dataset containing N images, each labeled with one of K groups,
    is provided as input; where N is the total number of images in all groups and
    K is the number groups in the classification mode. A group represents the category
    the images belong to.

    +   - Then we use this training package to teach a classifier how to classify
    the images.

    +   - Finally, we measure the classifier’s output by telling it to infer labels
    for a new series of images it has never seen before. The actual labels of these
    images would then be equivalent to the ones projected by the classifier.


    Convolutional Neural Networks (CNNs) are the most commonly used image recognition
    architecture. When you feed the network images and the network classifies the
    data, this is a common use case for CNNs. A CNN typically begins with an input
    “scanner” that isn’t designed to process all of the training data at once (Figure
    3-5). When working with CNNs, you wouldn’t want a layer with 10,000 nodes into
    which you input a 100 × 100-pixel file, for example. This would be extremely inefficient
    and not practical on a larger scale.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '![](img/7d8e54ee4578088e252f4c75b5cd4c88_49_0.png)


    # Figure 3-5. Convolutional Neural Network


    Rather, you create a 10 × 10 scanning Input Layer into which you feed the image’s
    first 10 × 10 pixels. After passing the data, move the scanner 1 pixel to the
    right to feed it the next 10 × 10 pixels. Sliding windows are the name for this
    process.


    Convolutional layers, rather than regular layers, are used to process the input
    data. Each node is only concerned with cells in its immediate vicinity. These
    convolutional layers often appear to shrink as they get thicker, owing to quickly
    divisible input factors. They frequently have pooling layers in addition to convolutional
    layers. A popular pooling strategy is max pooling, in which we take, say, 2 ×
    2 pixels and move on to the pixel with the most of a certain attribute.


    ImageNet, a dataset of nearly 1.2 million high-resolution training files, is used
    to train most image recognition techniques nowadays. Test images will be viewed
    with no initial annotation (i.e., no segmentation or labels), and algorithms will
    be required to create labeling showing which objects are present in the images.
    Leading computer vision groups from Oxford, INRIA, and XRCE tested some of the
    better current computer vision approaches on this dataset. Typically, computer
    vision solutions use multistage pipelines that are hand-tuned by tuning a few
    parameters in the early stages.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Alex Krizhevsky (NIPS 2012), the winner of the first ImageNet competition,
    built a very deep Convolutional Neural Net of the kind pioneered by Yann LeCun.
    It had seven secret layers in its architecture, not including any max pooling
    layers (Figure 3-6). The first two layers were convolutional, and the last layers
    were globally related. In each secret plate, the activation functions were linear
    units that had been rectified. These units were far more articulate and trained
    much faster than logistic units. Furthermore, competitive normalization was used
    to eliminate secret behaviors when nearby units had stronger activities. This
    assisted with strength differences.


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_50_0.png)


    Figure 3-6. AlexNet


    In terms of hardware, Alex used two Nvidia GTX 580 GPUs to run a very powerful
    implementation of convolutional nets (over 1000 fast little cores). GPUs are great
    for matrix-matrix multiplications and have a lot of memory bandwidth. This helps
    them to train the network in a week and merge findings from ten patches quickly
    during testing. Big neural nets can advance more than conventional CV networks
    as cores get cheaper and databases get larger.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Object Detection


    Outputting bounding boxes and marks for specific objects is widely used to describe
    objects within images. This varies from the classification/ localization challenge
    in which classification and localization are applied to a large number of objects
    rather than a single dominant one. Item bounding boxes and non-object bounding
    boxes are the only two types of object grouping. In car detection, for example,
    you must detect all cars in a given picture and their bounding boxes (Figure 3-7).


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_51_0.png)


    Figure 3-7. Object Detection


    We need to add a CNN to several different crops of the image if we use the sliding
    window technique to identify and localize images. Since CNN classifies each crop
    as an entity or a context, we must apply CNN to a vast range of locations and
    sizes, which is computationally expensive.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'To deal with this, Neural Network theorists have suggested using regions instead,
    which are image regions that are likely to include features that are “blobby”
    in appearance.


    This is a relatively easy game to play. R-CNN (Region-Based Convolutional Neural
    Network) was the first model to get it moving. In an R-CNN, we first use a selective
    search algorithm to scan the input image for potential artifacts, producing 2,000
    area proposals (Figure 3-8). Then, on top of all these area proposals, we run
    a CNN. Finally, we feed each CNN’s output into an SVM to identify the area and
    linear regression to tighten the object’s bounding box.


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_52_0.png)


    # Figure 3-8. R-CNN Network


    Essentially, we transformed the issue of object recognition into one of image
    classification. However, there are several drawbacks: preparation takes a long
    time and requires a lot of disk space, and inference is often sluggish.


    Quick R-CNN is a direct descendant of R-CNN, which increases detection speed by
    performing two enhancements: (1) performing feature extraction before proposing
    areas, resulting in only running one CNN over the whole image, and 2) replacing
    SVM with a softmax layer, resulting in expanding the Neural Network for predictions
    rather than developing a new model.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'Since it only trains one CNN for the whole picture, fast R-CNN performs much
    better in terms of speed. The selective search algorithm, on the other hand, also
    takes a long time to produce area proposals.


    As a result, a faster R-CNN was developed, and it has since become a canonical
    standard for deep learning-based object detection (Figure 3-9). It inserts a Region
    Proposal Network (RPN) to predict proposals from features, replacing the slow
    selective search algorithm with a fast Neural Network. To minimize the computational
    requirements of the overall inference process, the RPN is used to determine “where”
    to look. The RPN scans each position rapidly and efficiently to decide if additional
    processing is needed in that region. It accomplishes this by producing K bounding
    box proposals, each with two scores showing the possibility of an item being present
    at each site.


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_53_0.png)


    Figure 3-9. Fast R-CNN


    We feed our area ideas directly into what is effectively a swift R-CNN once we
    have them. A pooling layer, several fully connected layers, a softmax classification
    layer, and a bounding box regressor are added at last.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Overall, faster R-CNN outperforms the competition in terms of speed and accuracy.
    While future models increased detection speeds dramatically, only a few models
    were able to outperform faster R-CNN by a substantial margin. In other words,
    while faster R-CNN isn’t the easiest or fastest object detection process, it’s
    still one of the most efficient (Figure 3-10).



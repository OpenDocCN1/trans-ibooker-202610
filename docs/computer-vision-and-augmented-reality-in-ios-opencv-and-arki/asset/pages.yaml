  md: '![](img/7d8e54ee4578088e252f4c75b5cd4c88_160_0.png)


    # Color Selector


    We like to adjust the color of the frames using a ColorController script connected
    to buttons in a simple UI, so we made ARGlassesController a singleton so that
    the ColorController can access it whenever it’s accessible on the scene.'

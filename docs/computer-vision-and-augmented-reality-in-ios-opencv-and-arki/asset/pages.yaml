- pgno: 152
  md: '# Face Tracking in ARKit 3


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_152_0.png)


    Figure 7-6. Face Tracking in ARKit 3


    # User Level: Basic


    Augmented Reality has provided us with the ability to develop interactive and
    exciting opportunities for mobile technology users since its introduction to the
    industry. AR can save our time in a variety of ways, including checking out how
    our ideal sofa will look in our apartment, determining if the chosen paint color
    would suit the interior, and even instantly trying on new makeup.


    Face tracking is a strong feature of ARKit 3 on iPhone X and newer. We can quickly
    create applications for trying on jewelry, lipstick, or glasses with the right
    components. We''ll concentrate on the last choice in this example: creating an
    AR app for trying on glasses with a simple frame color shift.


    # Setup and Specifications for ARKit 3


    Since the A11 Bionic chip introduced in the iPhone X is needed for AR face tracking
    with ARKit 3, we''ll need this system or one that''s newer to make our example
    work. We''ll need Unity 2019.1 or later for our project'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'to take advantage of all of ARKit 3’s functionality, such as multiple-face
    tracking. We’ll need to install the required ARKit packages after we’ve built
    our project. Since ARKit for Unity has been included in the ARFoundation bundle
    since July 2019, we’ll need to open the Package Manager from the Window menu and
    install the following packages:


    +   1. ARFoundation

    +   2. AR Subsystems

    +   3. AR Face Tracking for all the required face tracking scripts

    +   4. XR Legacy Input Helpers for the Tracked Pose Driver script


    It’s a great idea to move the project to the iOS platform and set the player configuration
    after the installation. Set the Target minimum iOS Version to 11.0 in the Player
    Settings window, as ARKit 3.0 needs a minimum SDK version of 11.0.


    Choose ARM64 from the Architecture dropdown in the same window, as ARKit only
    supports 64-bit devices. You’ll also need to specify the Camera Usage Description,
    which is the script that will appear when the app requests approval to use the
    system camera. You can change the text to whatever you want, such as “ARKit 3
    Face Detection.”


    # Session Objects in Augmented Reality


    We can begin creating the requisite AR Session objects once the project has been
    properly set up. Initially, we make an ARSession GameObject in our scene and add
    two scripts to it: an AR Session script and an AR Input Manager script.


    Then, with an AR Session Origin script and an AR Face Manager, we create an AR
    Session Origin object. Since ARKit seldom uses the device’s frontal camera – it’s
    only used in face tracking/identification scenarios –'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'the Face Manager script is critical. There’s an empty field for a Camera script
    in the AR Session Origin.


    Let us just place the Main Camera object inside the AR Session Origin object and
    then reference it in the AR Session Origin script. Three scripts will be required:


    +   - Pose Driver with Tracking (in the Tracked Pose Driver, change the Pose Source
    to Color Camera and enable Use Relative Transform)

    +   - AR Camera History

    +   - AR Camera Manager


    Have you found how there’s an empty field for a Face Prefab in the AR Face Manager
    in the AR Session Origin script? That’s the prefab we’ll use to imagine our AR
    Face-based glasses.


    # Prefab AR Glasses


    We will need to make a new GameObject, which we named GlassesPrefab. The very
    first thing we need to do with our prefab is attach two components to it. The
    first is an ARFace variable, which will provide us with face point data that has
    been identified. The second is ARGlassesController, a script that will be in charge
    of positioning the glasses based on data updated by ARFace.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '![](img/7d8e54ee4578088e252f4c75b5cd4c88_155_0.png)


    # Figure 7-7. ARFace Application


    After that, we’ll need to build a GameObject within the prefab that will be attached
    to our glasses mesh, which we’ll manipulate using the ARGlassesController. The
    prefab’s final form should resemble that shown in the preceding image. The manipulated
    mesh must be saved as a child object inside our prefab. The ARFaceManager controls
    the location of the prefab, and the ARFace vertices are local points for features
    related to the detected face.'
  merge: -1
  img_proc: true

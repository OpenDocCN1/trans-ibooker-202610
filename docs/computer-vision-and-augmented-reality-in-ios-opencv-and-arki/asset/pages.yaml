    Because of its cross-domain mastery, many scientists agree that machine vision
    paves the way for Artificial General Intelligence because it represents a relative
    comprehension of visual environments and their contexts.


    # So What Is Computer Vision?


    Definitions from the formal textbooks are given in the following:


    +   - “The construction of explicit, meaningful descriptions of physical objects
    from images” (Ballard & Brown, 1982).


    +   - “...computing properties of the 3D world from one or more digital images”
    (Trucco & Verri, 1998).


    +   - “...to make useful decisions about real physical objects and scenes based
    on sensed images” (Sockman & Shapiro, 2001).


    # Why Computer Vision?


    The most obvious response is that this area of research has an increasingly growing
    collection of practical applications. Here are only a few examples (Figure 3-3):


    +   - Face recognition: To add filters and recognize you in images, Snapchat and
    Facebook use face detection algorithms.


    +   - Picture retrieval: To locate appropriate images, Google Images uses content-based
    queries. The algorithms explore the content of the query image and return results
    depending on the content that is most closely related.'

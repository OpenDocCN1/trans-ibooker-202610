    that allows you to put virtual furniture in a sitting room. It enables us to experiment
    with different object designs, as well as location combos. A client must determine
    where to position the virtual object within such a procedure. It is referred to
    as “marker-less AR.”


    # Location-Based AR


    A virtual world exists in the real world.


    Augmented reality technology is connected to a particular location through location-based
    AR. Assume walking down a public path you’re unfamiliar with seeing a virtual
    street sign showing the street name from your smartphone camera, and that is location-based

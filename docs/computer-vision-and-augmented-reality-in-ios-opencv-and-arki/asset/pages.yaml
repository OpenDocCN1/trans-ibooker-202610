    # Using OpenCV to Create ArUco Markers


    Utilizing OpenCV, we can quickly produce such markers. There are 25 predefined
    vocabularies for markers inside the aruco module of OpenCV. The dictionary’s markers
    all include the same block size orbits (44, 55, 66, or 77), so every vocabulary
    has a set number of markers (50, 100, 250, or 1000).


    Here is the C++ code that shows how to identify and generate Aruco markers. We
    have to use the aruco module. PredefinedDictionary in the code shows how dictionaries
    of 250 markers will be loaded.'

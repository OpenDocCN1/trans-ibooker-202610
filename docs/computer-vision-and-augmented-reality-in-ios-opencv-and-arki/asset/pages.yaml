  md: '# Normal Image of a Dog


    # Unusual Image of a Dog


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_23_0.png)


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_23_1.png)


    Figure 1-9. Normal vs. Unusual Image of an Object


    Consequently, in the 1980s, various groundbreaking research were published. The
    research suggested using an artificial network of simple and complex “neurons”
    that could recognize certain patterns. This artificial network is today referred
    to as an Artificial Neural Network (ANN). A Neural Network is a computing model
    that is designed to recognize patterns in a given set of labeled data (labeled
    images in this case). The network uses the given images to recognize a pattern
    and predict the results of each image. Once the network predicts the results of
    an image, it compares its prediction to the labels assigned to the image. The
    comparison stage enables the network to “learn” from the errors in its initial
    process, and then it performs the same process multiple times until the network
    provides more accurate results. Neural Networks often required lots of labeled
    data to provide significantly good results. Hence, in the early days, a Neural
    Network was not used to its full potential due to the lack of data.


    In the early 2010s, a group of Computer Vision researchers initiated a large-scale
    image dataset with millions of images and over 20,000 categories, called ImageNet.
    ImageNet was inspired by the need of more data in the Computer Vision field. And
    it enabled the development of'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'state-of-the-art Neural Network Models that had a great influence on the advanced
    computer vision applications seen today. Neural Networks and their variations
    are considered part of the field of Deep Learning, which is a subset of Machine
    Learning. Therefore, when Neural Networks are used to perform vision tasks, I
    will be referring to it as Deep Learning-based Computer Vision.


    # Traditional vs. Deep Learning-Based Computer Vision


    Traditional Computer Vision has existed ever since the computer vision field began.
    Traditional Computer Vision techniques have been used for decades to efficiently
    perform vision tasks. The traditional techniques helped develop many algorithms
    that are commonly used today, such as Scale-Invariant Feature Transform (SIFT)
    and Speeded-Up Robust Features (SURF). Algorithms like SIFT and SURF have been
    a fundamental part of developing today’s Augmented Reality technology due to their
    efficient performance and accurate results. However, in some cases, traditional
    computer vision techniques are not the best choice due to the lack of accuracy.
    In these cases, the best option is typically using a deep learning-based technique.
    Deep learning is used in several ways to perform complex vision tasks, such as
    image classification. Deep learning-based approaches typically outperform traditional
    approaches when it comes to image classification. Image classification is the
    process of classifying the contents of an image between separate categories. For
    example, one of the most popular image classification problems is classifying
    images of cats and dogs. When a software is presented with an image of a cat,
    it should classify it as a cat with high accuracy. Before deep learning, this
    task was nearly impossible to achieve; however, deep'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'learning pushed the limits of what is possible to achieve in Computer Vision
    and successfully enabled a computer to differentiate between a cat and a dog with
    high accuracy. This would have not been possible without extremely fast computers
    and datasets of millions of cat and dog images. You may wonder why deep learning
    would require fast computers and a huge amount of data. Well, the answer lies
    behind what deep learning is and how it really works. Deep learning is a subset
    of machine learning that is largely established on Artificial Neural Networks
    (ANNs), a computing model inspired by how the human brain operates. Similar to
    the human brain, an Artificial Neural Network consists of several computing “neurons.”
    An artificial neuron in a Neural Network performs a simple computing operation
    that communicates with other connected neurons in the network to make a decision.
    Each neuron connection to another neuron has a certain strength. The strengths
    of connections between neurons are called weights (see Figure 1-10).


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_25_0.png)


    Figure 1-10. Feedforward Artificial Neural Network Model'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Figure 1-10 is demonstrating a simple Neural Network consisting of three layers—(1)
    Input Layer, (2) Hidden Layer, (3) Output Layer:


    +   1. The Input Layer consists of multiple inputs where each input represents
    a unique feature about the given dataset.

    +   2. The Hidden Layer is a set of neurons that calculates and processes in a
    certain way depending on the weight value.

    +   3. The Output Layer is the last layer in a Neural Network that receives the
    final results from the previous Hidden Layer.


    A set of neurons represents a Neural Network Hidden Layer, and a typical deep
    learning algorithm consists of multiple Neural Network Hidden Layers. ANNs consist
    of two phases, the learning phase and the performing phase. During the learning
    phase, a Neural Network takes advantage of a labeled dataset to “learn” the correlation
    between the data and their description (also known as labels). In our case, a
    labeled dataset would consist of a set of images with a description of the contents
    of each image. When a Neural Network is given a labeled image, it attempts to
    process the image in the Hidden Layers and return a prediction of the label as
    an output. Once an output is returned, the Neural Network “grades” its result
    by comparing it to the original label using a variety of functions called objective
    functions. If the grade does not surpass a certain threshold, it will “learn”
    from it by adjusting the weights of the connections between neurons in the Neural
    Network. The Neural Network continues learning by presenting the same input to
    itself, and the weights of the network are adjusted as it learns. This process
    repeats multiple times until the Neural Network’s “grade” surpasses the required
    threshold. The process of “learning” and adjusting weights is called Backward'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Propagation of Errors, also known as Backpropagation. To recap, here is a simple
    ordered list of the steps a typical Artificial Neural Network goes through to
    “learn” something new:


    +   1. Receives labeled input

    +   2. Attempts to predict the input’s label

    +   3. Returns the predicted label as an output

    +   4. Compares the predicted label to the actual label

    +   5. Grades the results

    +   6. Adjusts the strengths of connections between neurons, also known as weights

    +   7. Repeats the process until the final grade surpasses the threshold


    # Computer Vision in Augmented Reality


    Augmented Reality (AR) is the technology that augments or displays digital objects
    in the physical world through a camera live feed. In order to display digital
    objects in the physical world, we would need to understand and detect objects
    of the physical world in real time. In some cases, the objects can be a specific
    template. In other cases, it can be a horizontal surface, such as a desk and a
    floor, or it can be a vertical surface, such as a wall and a door. To be able
    to detect objects and surfaces, we would need to use Computer Vision techniques
    to display digital objects in the physical world. There are three main types of
    Augmented Reality: Marker-Based, Marker-Less, and Geolocation Augmented Reality.
    Marker-Based AR requires a certain predefined template to display digital objects
    on. For example, a page in a book or a magazine can have a special icon so when
    a camera detects that icon it would display a digital object mapped on the icon
    or the page (Figure 1-11).'
  merge: -1
  img_proc: true
- pgno: 28
  md: '![](img/7d8e54ee4578088e252f4c75b5cd4c88_28_0.png)


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_28_1.png)


    # Marker-Based AR


    # Marker-Less AR


    Figure 1-11. Marker-Based vs. Marker-Less AR


    Unlike Marker-Based AR, Marker-Less AR does not require any special predefined
    templates to display digital objects. Instead, it can place digital objects on
    any horizontal or vertical surfaces using various Computer Vision techniques.
    Geolocation AR, in many cases, depends on either Marker-Based or Marker-Less AR
    and integrates location sensor technologies to display digital objects in the
    physical world based on visual and location data.


    Augmented Reality today is mostly accessible through mobile devices, smartphones
    to be more specific. Although there have been various attempts to integrate immersive
    AR experiences by developing custom hardware and devices, such as Microsoft''s
    HoloLens, Magic Leap Glasses, and Google Glasses, it is too early for consumers
    to adapt to using new and unfamiliar hardware. Therefore, smartphones were the
    perfect tool to introduce consumers to AR. In the early days of mobile AR, using
    markers, such as a QR code or a template image, was the main way to augment digital
    objects in the physical world. To achieve that, techniques such as pattern recognition
    and pose estimation were required. Pattern recognition is a technique that depends
    on a predefined set of data describing features to find and analyze in a given
    image. Pose estimation'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'uses the detected pattern to simulate a three-dimensional pose based on the
    camera angle (see Figure 1-12); this technique is used to enable seeing a three-dimensional
    object from all angles based on the camera’s point of view.


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_29_0.png)


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_29_1.png)


    Figure 1-12. Body Pose Estimation


    Marker-Based AR allowed any user with access to a smartphone to interact and use
    the technology; however, the requirement of having a physical marker was not scalable
    nor practical for daily use. Therefore Marker-Less AR had more potential due to
    its ease of use and accessibility. In the early days of Marker-Less AR development,
    dual cameras were required to have a reconstruction of the physical world.'

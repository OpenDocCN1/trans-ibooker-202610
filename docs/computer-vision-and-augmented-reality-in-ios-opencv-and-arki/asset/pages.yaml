  md: '# With C++, Create and Customize Barcodes


    You may also adjust the barcode''s display. You may change the foreground color,
    background color, scale, boundary type, and other options, for instance. The methods
    for customizing barcodes with Aspose.BarCode with C++ are listed in the following.


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_117_0.png)


    +   - Make an object of a Barcode Generator class.

    +   - The Barcode Generator->get Parameters () methodologies are used to reach
    the barcode specifications.

    +   - Define the specifications that you like.

    +   - Make a barcode as well as save it as a photo.


    The following coding demonstration illustrates how to create a personalized barcode
    in C++:


    ```

    System::SharedPtr<BarcodeGenerator> barcodeGenerator = &[] { auto tmp_0 = System::MakeObject<BarcodeGenerator>(EncodeTypes::Aztec,
    System::String(u"1234567890"));

    // set border style

    tmp_0->get_Parameters()->get_Border()->set_DashStyle(Aspose::BarCode::BorderDashStyle::Solid);

    // set width

    tmp_0->get_Parameters()->get_Border()->set_Width(System::Drawing::Unit::Millimeters(1.0f));

    // set border visibility

    tmp_0->get_Parameters()->get_Border()->set_Visible(true);

    // set background color

    tmp_0->get_Parameters()->set_BackColor(System::Drawing::Color::get_Black());

    // set barcode''s bar color

    tmp_0->get_Parameters()->get_Barcode()->set_ForeColor(System::Drawing::Color::get_Orange());

    // set border color

    tmp_0->get_Parameters()->get_Border()->set_Color(System::Drawing::Color::get_Black());

    // set text color

    tmp_0->get_Parameters()->get_Barcode()->get_CodeTextParameters()->set_Color(System::Drawing::Color::get_Orange());

    // set image resolution

    tmp_0->get_Parameters()->set_Resolution(400);

    return tmp_0; };

    barcodeGenerator->Save(System::String(u"custom_barcode.jpg"));


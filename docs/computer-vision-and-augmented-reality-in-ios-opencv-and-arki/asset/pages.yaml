  md: '# Bitwise Operation


    AND, OR, XOR, and NOT are bitwise operations. These operations are very helpful
    and used together with masking when we want to remove an area we wish from an
    input image (Figure 4-6).


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_67_0.png)



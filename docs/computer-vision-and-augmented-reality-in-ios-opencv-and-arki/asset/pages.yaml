- pgno: 129
  md: '# C++


    ```

    // Compute homography from source and destination points

    Mat h = cv::findHomography(pts_src, pts_dst);


    // Warped image

    Mat warpedImage;


    // Warp source image to destination based on homography

    warpPerspective(im_src, warpedImage, h, frame.size(), INTER_CUBIC);


    // Prepare a mask representing region to copy from the warped image into the original
    frame.

    Mat mask = Mat::zeros(frame.rows, frame.cols, CV_8UC1);

    fillConvexPoly(mask, pts_dst, Scalar(255, 255, 255));


    // Erode the mask to not copy the boundary effects from the warping

    Mat element = getStructuringElement( MORPH_RECT, Size(3,3) );

    erode(mask, mask, element);


    // Copy the masked warped image into the original frame in the mask region.

    Mat imOut = frame.clone();

    warpedImage.copyTo(imOut, mask);

    ```


    The source points (pts src) are the current scenario picture edge point, and the
    endpoint positions (dst src) are matching image center points inside the photo
    frame within the clicked picture. The homography function ‘h’ among an input as
    well as target points is computed using the OpenCV function findHomography. A
    current picture would then be warped to blend into the targeted frame using the
    homography matrix. A masked and replicated distorted picture is pasted into the
    intended frame. That phase has been continued within each frame in the clip.



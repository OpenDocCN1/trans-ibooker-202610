    with the person’s world is known as augmented reality. Users can interact with
    virtual objects in their natural surroundings by using augmented reality technologies.
    A person who is wearing virtual reality glasses either uses a phone or tablet
    screen to see details regarding any objects they have been viewing.


    Three different types of AR are discussed here.'

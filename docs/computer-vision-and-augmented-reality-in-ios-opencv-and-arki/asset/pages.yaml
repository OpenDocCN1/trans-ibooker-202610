    # What Are ArUco Markers?


    ArUco stands for Augmented Reality University of Cordoba (Figure 6-1). The University
    of Cordoba is a university in Cordoba, Spain, where it was made.


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_123_0.png)


    Figure 6-1. ArUco Marker


    Few examples follow:


    The ArUco marker is a fiducial marker that is positioned onto the photographed
    item as well as a scenario. It’s a binary square having a dark background as well
    as borders, as well as a white produced pattern that'

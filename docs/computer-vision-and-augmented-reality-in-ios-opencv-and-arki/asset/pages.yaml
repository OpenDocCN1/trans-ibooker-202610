- pgno: 151
  md: "The position and rotation of the joints in 3D space are provided by ARKit!\
    \ That’s how you update the sphere’s scale, location, and rotation in 2D screen\
    \ space:\n\n```\nprivate void UpdateJointTransform(Transform jointT, XRHumanBodyJoint\
    \ bodyJoint)\n{\n    jointT.localScale = bodyJoint.anchorScale;\n    jointT.localRotation\
    \ = bodyJoint.anchorPose.rotation;\n    jointT.localPosition = bodyJoint.anchorPose.position;\n\
    }\n```\n\nThat’s it! Let’s build and test our app on a real iOS device!\n\n# Step\
    \ 5: Create and Deploy\n\nEventually, we must construct and test the project on\
    \ a real device. We can’t test our code on macOS because ARKit is only available\
    \ on iOS and iPadOS. Select File ► Build Settings in Unity. Click the Build button\
    \ after selecting the iOS build target. You must choose a place for the produced\
    \ project to be saved. Patiently wait till Unity’s build process is completed.\
    \ An Xcode project will be created by Unity (.xcodeproj). Using Xcode 11 beta,\
    \ open the project. You’ll get an error and your project won’t run properly if\
    \ you use an older version of Xcode. Give your iOS development credentials, connect\
    \ your iOS 13 device, and then click the Run button once the project has been\
    \ launched. The project will be deployed to the device in this manner.\n\nWhen\
    \ you’re done, point the camera toward a person to see the 3D overlay appear on\
    \ top of the tracked body!"

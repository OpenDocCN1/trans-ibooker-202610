- pgno: 55
  md: 'Convolutional Networks (R-FCNs) were observable. As a consequence, these strategies
    separate themselves from the three R-CNN techniques’ expensive subnetworks. The
    key reason behind these patterns is to stop making different algorithms concentrate
    on their respective subproblems in isolation, which may increase training time
    and decrease network precision.


    The method of following a single point of interest, or several objects, in a given
    scene is known as object tracking (Figure 3-11). It has historically been used
    in video and real-world encounters where findings are made after the initial identification
    of an object. It is now important for autonomous driving applications such as
    Uber and Tesla’s self-driving cars.


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_55_0.png)


    # Figure 3-11. Object Tracking


    According to the observation paradigm, object tracking approaches can be classified
    into two categories: generative and discriminative. The generative approach, such
    as PCA, uses a generative model to explain the visible characteristics and minimizes
    the reconstruction error.


    The discriminative approach will differentiate between the target and the background;
    its accuracy is more reliable, and it is increasingly replacing the traditional
    tracking method. Tracking by detection is another term for the discriminative
    process, and deep learning falls into this'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'group. To achieve tracking by detection, we detect candidate objects in all
    frames and then use deep learning to classify the target object among the candidates.
    Stacked autoencoders (SAEe) and Convolutional Neural Networks (CNNs) are two types
    of simple network models that can be used.


    Deep Learning Tracker (DLT) is the most common deep network for monitoring tasks
    using SAE, as it allows for offline pre-training and online fine-tuning. The procedure
    is as follows:


    +   - By applying noise to input images and reconstructing the original images,
    the stacked denoising autoencoder will achieve a more robust function expression
    ability.


    To create the classification network, combine the coding portion of the pre-trained
    network with a classifier, and then fine-tune the network using the positive and
    negative samples collected from the original frame to discriminate the current
    entity from the past. DLT creates candidate patches for the current frame using
    a particle filter as the motion model. The classification network produces likelihood
    scores for these patches, which show how confident their classifications are,
    and then selects the highest of these patches as the object.


    +   - DLT employs a minimal threshold approach to model updating.


    CNN has become the standard deep paradigm of machine vision and visual recognition
    due to its dominance in image recognition and object detection. A large-scale
    CNN can be trained as both a classifier and a tracker, in general. A fully convolutional
    network tracker (FCNT) and multi-domain CNN are two examples of CNN-based tracking
    algorithms (MD Net).'
  merge: -1
  img_proc: true
- pgno: 57
  md: '+   - FCNT successfully analyzes and utilizes the function maps of the VGG
    model, which is a pre-trained ImageNet, yielding the following findings:

    +     - CNN function maps may be used for monitoring and localization.

    +     - For the task of distinguishing a specific object from its context, often
    CNN function maps are often blurred or unrelated.

    +     - Lower layers encode more discriminative attributes to capture intra-class
    variation, while higher layers capture semantic concepts on object categories.


    Because of these results, FCNT builds a feature discovery network to pick the
    most important feature maps on the VGG network’s conv4-3 and conv5-3 layers. It
    then creates two additional channels (called SNet and GNet) for the chosen feature
    maps from two layers separately to prevent overfitting on noisy ones. The GNet
    captures the object’s category detail, while the SNet distinguishes the object
    from a similar-looking context.


    To obtain heat maps of the object, both networks are initialized with the specified
    bounding box in the first frame, and for new frames, a region of interest (ROI)
    centered at the object position in the previous frame is cropped and propagated.
    Finally, the classifier receives two heat maps for prediction via SNet and GNet,
    and the tracker determines which heat map will be used to produce the final tracking
    result based on whether there are any distractors. The FCNT pipeline is illustrated
    in the following (Figure 3-12).'
  merge: -1
  img_proc: true

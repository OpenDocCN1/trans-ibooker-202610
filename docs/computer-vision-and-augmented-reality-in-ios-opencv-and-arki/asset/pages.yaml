- pgno: 11
  md: '# CHAPTER 1


    # Introduction to

    Computer Vision


    This chapter will focus on what computer vision is, why we need it, the evolution
    of the technology, its different applications, and how it is used in Augmented
    Reality.


    # What Is Computer Vision?


    Vision is the ability to analyze and interpret scenes and objects of interest.
    Human vision has been studied for hundreds of years to understand how the visual
    process works. The human visual process is one of the most complex processes to
    understand. In fact, to this day, vision scientists have not yet found a complete
    answer to how the visual process works. However, vision scientists’ discoveries
    on how the human visual process begins and a little beyond that inspired computer
    scientists to develop what we know today as Computer Vision. Vision researchers
    and scientists describe that the visual process begins with the eyes processing
    signals of light and converting them into scenes and images for the brain’s visual
    cortex to analyze and interpret. A breakthrough in vision research in the 1950s
    discovered that the visual process begins by detecting the simple structures and
    edges of an image to help build up a more detailed interpretation as the visual
    information becomes more complex. The'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'breakthrough vision research inspired computer scientists to develop the preprocessing
    Computer Vision algorithms we use today to initiate every computer vision task.
    Compared to a typical computer today, the human brain computing speed is significantly
    slower than a computer’s computing speed, yet the human brain performs vision
    tasks much faster and significantly better than any computer. Hence, researchers’
    inspiration to develop Computer Vision algorithms has always been the evolution
    of vision in nature.


    Computer Vision is the field of studying and developing technology that enables
    computers to process, analyze, and interpret digital images. Today, Computer Vision
    applications can be found in several industries, such as industrial robots, medical
    imaging, surveillance, and many more. All these applications have one principal
    mission, and it is processing, analyzing, and interpreting the contents of digital
    images to perform a task relevant to an industry’s needs, which will be referred
    to as a vision task in the rest of this book. A vision task is any kind of task
    that requires processing, analyzing, or interpreting the contents of digital images
    and videos. For reference, a video is a sequence of digital images, typically
    consisting of 30–60 digital images per second, also referred to as frames.


    Computers display digital images very often. When a digital image is given to
    a computer as an input, the computer reads it as a two-dimensional array of pixels;
    it can also be defined as a two-dimensional matrix. An image matrix consists of
    M columns and N rows. The size of an image in pixels can be determined by finding
    the product of M columns and N rows (M × N), where M is the width and N is the
    height of the image. A pixel position is identified by its x and y coordinates
    (x, y) in the matrix. The coordinate system in computer graphics and digital images
    is slightly different from a typical Cartesian coordinate system; the point of
    origin (0, 0) in a digital image begins from the top-left corner of the image.
    Therefore, x is increasing from left to right, and y is increasing from top to
    bottom (see Figure 1-1).'
  merge: -1
  img_proc: true
- pgno: 13
  md: '![](img/7d8e54ee4578088e252f4c75b5cd4c88_13_0.png)


    # Figure 1-1. Digital Image Coordinate System


    In a grayscale digital image, a pixel value can be represented in various formats;
    however, the most common format used is an 8-bit (1-byte) unsigned integer ranging
    from 0 to 255 where 0 is black and 255 is white. Any value between 0 and 255 defines
    a different shade of gray (see Figure 1-2).


    # Magnified 16x16 Grayscale Image


    # The Image Matrix


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_13_1.png)


    ```

    0 16 32 48 64 80 96 112 128 144 160 176 192 208 224 240

    1 17 33 49 65 81 97 113 129 145 161 177 193 209 225 241

    2 18 34 50 66 82 98 114 130 146 162 178 194 210 226 242

    3 19 35 51 67 83 99 115 131 147 163 179 195 211 227 243

    4 20 36 52 68 84 100 116 132 148 164 180 196 212 228 244

    5 21 37 53 69 85 101 117 133 149 165 181 197 213 229 245

    6 22 38 54 70 86 102 118 134 150 166 182 198 214 230 246

    7 23 39 55 71 87 103 119 135 151 167 183 199 215 231 247

    8 24 40 56 72 88 104 120 136 152 168 184 200 216 232 248

    9 25 41 57 73 89 105 121 137 153 169 185 201 217 233 249

    10 26 42 58 74 90 106 122 138 154 170 186 202 218 234 250

    11 27 43 59 75 91 107 123 139 155 171 187 203 219 235 251

    12 28 44 60 76 92 108 124 140 156 172 188 204 220 236 252

    13 29 45 61 77 93 109 125 141 157 173 189 205 221 237 253

    14 30 46 62 78 94 110 126 142 158 174 190 206 222 238 254

    15 31 47 63 79 95 111 127 143 159 175 191 207 223 239 255

    ```


    # Figure 1-2. Grayscale Image Converted to a Matrix


    Figure 1-2 demonstrates a 16 × 16 grayscale image converted to pixel values that
    are represented in 8-bit unsigned integers.


    In a color digital image, a pixel value must be specified in three colors – red,
    green, and blue – which represents an RGB color space. Thus, the pixel value is
    represented as a vector of three numbers where each number ranges from 0 to 255.
    As the number increases, the brightness of each color increases, also referred
    to as color intensity. For example, if a given pixel'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'value is (255, 255, 255), this means the red, green, and blue intensities (or
    brightness) are set to their highest value, which defines a white pixel (see Figure
    1-3).


    | Red Intensity | 0 | 255 | 255 | 0 | 0 |

    | Green Intensity | 0 | 255 | 0 | 255 | 0 |

    | Blue Intensity | 0 | 255 | 0 | 0 | 255 |


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_14_0.png)


    # Figure 1-3. RGB Color Space and Color Intensity Example


    In Figure 1-3 you can see how the color intensity can affect the final resulting
    color. The higher the color intensity, the brighter the resulting color.


    Although rendering a digital image appears to be a computer-friendly task, computer
    vision requires more complex processing to interpret, analyze, or manipulate the
    contents of a digital image. Computer Vision consists of two core applications:
    manipulating digital images and processing digital images to perform vision tasks.
    Manipulating digital images includes image enhancement, restoration, reconstruction,
    and compression. Image enhancement and restoration are typically used to improve
    the quality of distorted images. Reconstruction of images takes advantage of a
    set of two-dimensional images from different angles to reconstruct a three-dimensional
    image. However, some implementations that use deep learning attempt to reconstruct
    a three-dimensional image from a single two-dimensional image. Image compression
    is used to convert images into a more efficient representation to minimize storage
    usage. Processing digital images, on the other hand, may use some image manipulation
    techniques to perform vision tasks that match, describe, or recognize the contents
    of an image. The process of matching and describing contents of an image mainly
    depends on segmenting images'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'into smaller parts and comparing the segmented parts to other template images
    and measuring the relationships between the segmented parts and the template images
    (see Figure 1-4).


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_15_0.png)


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_15_1.png)


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_15_2.png)


    Template Matching Algorithm


    Image Credits: Racool_studio/Freepik.com


    # Figure 1-4. Template Matching Abstract Example


    Figure 1-4 demonstrates a sample result of a template matching algorithm.


    # An Overview on How Computer Vision Works


    In order for a computer to perform a vision task, such as face detection, it requires
    performing several smaller tasks to reach the target task. For example, in order
    to perform a vision task, a computer typically has to perform various digital
    image preprocessing techniques, such as grayscale manipulation, edge enhancement
    and detection, noise removal, image restoration, interpolation, and image segmentation.
    Image preprocessing is the first stage in every vision task, and it plays a significant
    role to have a successful outcome. The purpose of preprocessing is extracting
    the valuable parts in a given image and getting rid of unwanted distortions.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'The valuable parts help in developing useful descriptions of pixels, shapes,
    and surfaces in a given image. As we mentioned earlier, a pixel value is defined
    by either a 1-byte integer (when it is in a grayscale image) or a vector of integers
    representing an RGB color space (when it is in a color image); and each pixel
    value has a different intensity level representing the brightness of the color.
    The changes of intensity in a given image provide clues about the structure of
    shapes and surfaces in the image.


    In the preprocessing stage, we try to extract this information without any knowledge
    of the contents of an image using techniques, such as noise removal, edge enhancement,
    and image segmentation. Noise removal is the process of smoothing an image to
    reduce and eliminate unwanted noise/distortion. However, sometimes noise removal
    techniques end up blurring the image; in this case, edge enhancement techniques
    come in handy. Edge enhancement helps with improving the sharpness of the edges
    in an image by increasing the intensity level difference between the boundaries
    of two regions (see Figure 1-5).


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_16_0.png)


    Figure 1-5. Edge Enhancement/Detection Example


    The image on the left is the original image. The image on the right is the resulting
    image after applying an edge enhancement technique. As you may have noticed, the
    right image appears to “outline” the edges of the dog, which can be used in various
    vision tasks, such as image classification.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Image segmentation is the process of separating an image into smaller parts
    called segments. Segments are used to process the parts of an image separately,
    because in many cases an image has more than just one unique object or feature
    that can help identify the contents of the image. Image segmentation is considered
    an intermediate step between preprocessing and processing an image for object
    detection or segment classification (see Figure 1-6).


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_17_0.png)


    Figure 1-6. Abstract Computer Vision Pipeline


    After preprocessing a digital image, the processing steps begin, and in many cases,
    it may involve techniques such as feature extraction, texture analysis, and pattern
    recognition. Depending on each vision task, you would pick the more relevant technique
    to perform the task. For example, to perform an image classification task, you
    would use a feature extraction technique to extract unique features in the segments
    of a given image. The segments of an image are extracted during the image segmentation
    process. Once the unique features are extracted from the image segments, they
    are used to find a distinct pattern matching predefined or labeled image segments;
    a labeled image segment is a piece of an image that is manually defined under
    human supervision (Figure 1-7).


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_17_1.png)


    Figure 1-7. Labeled Image Segments Example'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'The process of finding an exact match to a labeled segment is called feature
    matching; and the process of finding a distinct pattern is called pattern recognition.
    Figure 1-6 demonstrates an abstract Computer Vision pipeline and what a given
    image has to typically go through when a computer is performing a vision task.
    Further details on different image processing techniques will be covered throughout
    the book.


    # Why Do We Need Computer Vision?


    Since the Internet has been accessible to billions of users around the world,
    it has enabled many to capture, produce, and publish media-rich content, such
    as images, videos, and animated images (also known as GIFs). User-generated content
    defines the Internet we know today, and the amount of media-rich content published
    per day is rapidly increasing. Today, YouTube publishers alone contribute 300
    hours of video per minute; that is 3 million hours of video per week. There is
    no human who can handle watching this much video at this rate. YouTube and many
    similar companies that allow user-generated content on their platforms are challenged
    to index, classify, and categorize billions of user-generated images and videos
    to provide their viewers the most relevant content they would watch. The categorization
    of all this content cannot be properly handled by a typical software; most of
    the existing approaches depend on the publishers’ text input, such as video title,
    description, keywords, etc. However, in many cases, the publisher''s text input
    can be irrelevant; and their content may contain inappropriate or violent scenes
    that should not be displayed to certain age groups, or many viewers would want
    to opt out of viewing such content. The only technology that would enable large-scale
    image and video indexing, classification, and categorization is Computer Vision.
    Computer Vision is needed by companies, such as'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'YouTube, to index and categorize the massive amount of media-rich content.
    In addition to categorizing images and videos, computer vision can be used to


    +   - Provide a visual description of images and videos to the visually impaired
    users and customers.

    +   - Filter inappropriate content to certain age groups.

    +   - Warn viewers of the type of scenes and content included in an image or a
    video.

    +   - Detect manipulated images and videos that may cause harm to the viewers
    or persons in the manipulated content.


    In addition to the Internet-related problems Computer Vision can solve, there
    are many other problems across various industries that need computer vision technology
    to be solved. Now, you can find computer vision technology integrated in many
    things we interact with on a daily basis, such as cashier systems, surveillance
    systems, biometric scanners, medical equipment, transportation, and many more.


    +   - Cashier systems integrate computer vision technology to enable self-checkout
    kiosks.

    +   - Surveillance systems use image and video enhancement algorithms to detect
    and analyze the contents of surveillance images and videos.

    +   - Biometric scanners use edge detection and enhancement techniques to collect
    and analyze biometric information (i.e. fingerprints, facial features, eye features...
    etc).

    +   - Medical equipment takes advantage of various computer vision techniques,
    such as image reconstruction and restoration to retrieve useful information from
    medical devices and scanners.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'The list can go on for pages demonstrating all the different applications of
    computer vision. In fact, the need of computer vision technology has been only
    increasing over the past decade. Top companies are adopting the technology in
    their products, and new companies are starting to provide computer vision-powered
    products. The impact of computer vision technology is limitless, and it will be
    adopted by more industries and organizations around the world over the next couple
    years. You may have already seen the initial iterations of the future of computer
    vision applications, such as self-driving vehicles, autonomous manufacturing,
    and education via Augmented Reality.


    In 2019, companies’ demand on Augmented Reality, Virtual Reality, and Computer
    Vision engineers has increased by 1500% (State of Software Engineers, Hired.com).
    Computer Vision will have a great impact on society in the following years and
    will require more contributors to the technology, which this book will intend
    to do by enabling software engineers and persons with interest in computer vision
    to be part of the development of this revolutionary technology.


    # The Evolution of Computer Vision


    In 1959, a neurophysiology research conducted a couple experiments on a cat’s
    visual system. The experiments placed electrodes in the main visual cortex of
    a cat’s brain, and the researchers observed the neural response of the visual
    cortex as they presented various images to the cat (Figure 1-8).'
  merge: -1
  img_proc: true
- pgno: 21
  md: '![](img/7d8e54ee4578088e252f4c75b5cd4c88_21_0.png)


    # Figure 1-8. Hubel and Wiesel’s Experiment


    As the experiments went on, the researchers noticed a pattern in the cat’s neural
    response when presented with a new image. The research concluded that there are
    simple and complex neurons in the visual cortex. And the visual process begins
    by detecting the simple structures and edges of an image to help build up a more
    detailed interpretation. As the visual information becomes more complex, the visual
    cortex depends on the complex neurons to interpret the remaining details of an
    image. This research later became to be one of the most influential research in
    the field of Computer Vision. It inspired Computer Vision researchers to achieve
    what is known today as image preprocessing.


    In July of 1966, Seymour Papert, a professor at the Artificial Intelligence Lab
    at Massachusetts Institute of Technology (MIT), initiated “The Summer Vision Project.”
    The project was assigned to undergraduate MIT students to develop pattern recognition
    technology in an attempt to enable machines to see. The project was a very optimistic
    plan to develop what we know today as Computer Vision in one summer. There were
    various attempts in the 1960s to develop a computer visual system; however, researchers
    eventually came to realize that such a project would require years, if not decades,
    to achieve. And here we are, 50 years later, and Computer Vision is still in the
    research and development phases.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Since the 1960s, Computer Vision has evolved to the technology we see in many
    applications today. One of the pioneering research in computer vision was in the
    1970s, where the research focused on object recognition. The initial iteration
    of object recognition was abstract and simple to prove the concept of object recognition.
    The implementation used the line joints of simple objects, such as cylinders and
    cubes, to identify them. In the following decades, researchers and engineers developed
    the core techniques of traditional computer vision, which consists of two principal
    stages:


    +   1. Image preprocessing

    +   2. Image processing


    The image preprocessing stage focuses on enhancing image colors and edges to help
    in detecting simple structures in a given image. The processing stage uses the
    preprocessed image to perform one or more of the following processing techniques:


    +   - Image compression

    +   - Image enhancement

    +   - Image restoration and reconstruction

    +   - Pattern matching and recognition


    Although traditional image processing techniques such as the ones listed previously
    have been used for decades since their development, there have been a few problems
    these techniques alone would not solve, such as recognizing objects in a significantly
    unusual or unexpected context, such as handwritten words, digits, and images of
    objects captured from an unusual angle (Figure 1-9).'
  merge: -1
  img_proc: true

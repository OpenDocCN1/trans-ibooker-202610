    Augmented reality, also known as AR, is a type of technology that allows us to
    see virtual objects and details inside our visual field. We could get details
    on the objects that we can visualize with augmented reality. This improves the
    screen by incorporating real-world components. If I point my mobile at a street,
    for instance, this will provide me with additional info like the names of restaurants,

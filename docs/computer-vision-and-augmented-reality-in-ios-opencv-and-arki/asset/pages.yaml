    which is known to have high accuracy. The smartphone AR is prone to collapsing
    based solely on visual-based motion tracking due to the incredible blurred picture.
    Even so, the tracking loss phenomena caused by fast motion blur can be alleviated
    using the proposed sensor fusion–dependent tracking method.


    VR helps the user to communicate with the virtual world in a variety of ways.
    As a result, real-time monitoring of the user’s postures and behaviors is crucial
    for a VR device. Furthermore, the frame rate for motion tracking in VR is higher
    than that of AR. Alternatively, the consumers will become ill as a result of the
    latency phenomenon. A smooth 6-DoF motion tracking for cellular VR could be accomplished
    in real time using the proposed adaptive visual-inertial fusion process. The 6-DoF
    motion of the user can be observed in real time using the proposed multi-sensor
    device installed on the user’s head. As a result, when the user walks independently
    in the real world, the virtual scene’s focus will adjust to match the real 6-DoF
    motion tracking.


    # Real-Time Motion Tracking


    Real-time motion tracking is a critical issue for any AR/VR device, so there are
    a variety of ways to achieve this performance. In marker-based motion tracking,
    the device must first detect and recognize the marker before calculating the observer’s
    relative pose. Even so, the marker must be placed on or near the item of concern
    ahead of time, and it is not always possible to do so in some cases. Furthermore,
    the marker must stay'
  merge: -1

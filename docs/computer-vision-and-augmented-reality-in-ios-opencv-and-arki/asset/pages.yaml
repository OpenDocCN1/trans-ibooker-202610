- pgno: 31
  md: '# CHAPTER 2


    # Introduction to Augmented Reality


    This chapter will focus on what Augmented Reality is, the evolution of the technology,
    and its different applications.


    # What Is Augmented Reality?


    Over the decades, humans have always used some sort of technology to visualize
    data, tell stories, educate students, and even be entertained. Data visualization
    has been essential for many organizations and individuals to better understand
    information and make decisions. Storytelling plays an important role in getting
    an audience engaged in an activity. Education is critical to enable today’s students
    to form their future. Forms of entertainment can be video games, sports, and concerts.
    All these are examples of activities that can be much more interactive by augmenting
    digital objects in the physical world and enabling consumers to interact with
    them. To successfully augment digital objects in the physical world, we would
    have to project light into custom shapes and display it on physical objects. However,
    this approach would require additional hardware that is not commonly used by most
    consumers, such as screen projectors and holographic projectors. The fact that
    additional hardware is needed to “augment” digital objects in the physical world
    made the technology less'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'accessible and hardly scalable due to the high price tag of the hardware needed.
    As the development of computer vision arose, more researchers and engineers worked
    together to develop various techniques to augment digital objects in the physical
    world and enable new ways to interact with computers, to develop what we know
    today as Augmented Reality.


    Augmented Reality is the field of developing interactive user experiences by reconstructing
    and displaying interactive digital objects in the physical world. In the process
    of developing Augmented Reality technology and applications, we are required to
    take in consideration three core concepts:


    +   1. Physical world reconstruction and mapping techniques

    +   2. Digital object projection techniques

    +   3. New human-computer interaction guidelines


    One of the early approaches to augment and interact with digital objects in the
    physical world was a project developed by a computer researcher, Myron Krueger,
    who used a camera’s live visual data and projected a computer interface to interact
    with the digital computer components in the physical world (Figure 2-1).


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_32_0.png)


    Figure 2-1. Videoplace – Beginning of AR'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Many other approaches also depended on a camera’s live visual data for scene
    understanding; but the projection of the digital components was always changing.
    Some attempts created headsets and glasses that would project the digital components
    on a small screen that was wearable. And others would stream the camera’s live
    visual data to a computer screen and interact with the digital components through
    the screen. As computer vision technology evolved and camera devices with a live
    feed on a portable screen became more popular and accessible to consumers, the
    development of the Augmented Reality technology that we are familiar with today
    began. In addition to developing computer vision and digital object projection
    techniques to achieve Augmented Reality, making Augmented Reality human-friendly
    and easy to use is crucial to enable the full potential of the technology. Computer
    vision, hardware, and human-computer interaction researchers and engineers have
    been working together over the years to create the ultimate Augmented Reality
    experience, which led to developing the most common form of Augmented Reality
    seen today in mobile phones.


    Today, smartphones, such as iOS and Android devices, are the main devices that
    enable users to experience Augmented Reality, given that the majority of smartphones
    have powerful cameras, sensors, and geolocation hardware. By making use of information
    provided by the hardware found in smartphones, we can provide an immersive and
    entertaining experience to the users through Augmented Reality. The hardware pieces
    in a smartphone that provide sufficient information to achieve Augmented Reality
    are single-lens or multi-lens cameras, accelerometers, gyroscopes, magnetometers,
    and geolocation sensors (Figure 2-2).'
  merge: -1
  img_proc: true
- pgno: 34
  md: '![](img/7d8e54ee4578088e252f4c75b5cd4c88_34_0.png)


    # Figure 2-2. Single-Lens Camera


    Single-lens cameras provide visual data of a scene from one angle, which helps
    in detecting and tracking simple features of a surface in a scene. Multi-lens
    cameras, on the other hand, provide visual data from two different angles, which
    helps in detecting and tracking the depth in a scene, and depth tracking enables
    a more accurate real-world distance measuring. Accelerometers, gyroscopes, and
    magnetometers are all part of a unit called Inertial Measurement Unit (IMU), which
    enables measuring a device’s acceleration and estimating its velocity, distance,
    orientation, and gravitational force. Geolocation sensors provide information
    about the device’s location and geographic coordinates, which enables augmenting
    and “pinning” digital objects in location-specific areas (Figure 2-3).'
  merge: -1
  img_proc: true
- pgno: 35
  md: '![](img/7d8e54ee4578088e252f4c75b5cd4c88_35_0.png)


    # Figure 2-3. Geolocation Sensor Measurement


    As mentioned previously, there are three core concepts we need to consider when
    developing Augmented Reality technology, and the first concept is physical world
    reconstruction and mapping, also referred to as scene reconstruction. Scene reconstruction
    is a computer vision task whose core objective is to reconstruct video frames
    into a three-dimensional scene. This vision task is essential to enable placing
    digital objects in a specific part of a room and identify an object’s position
    in the physical world using a certain coordinate value retrieved from the reconstructed
    three-dimensional scene.


    To perform this vision task, we would need to retrieve video frames from either
    a single-lens or a multi-lens camera. Video frames retrieved from a single-lens
    camera will make it more difficult to reconstruct the scene due to the lack of
    depth information; however, thanks to a computer vision technique known as structure
    from motion (SfM), scene reconstruction is possible to perform via a single-lens
    camera. SfM is a technique that uses an array of two-dimensional images to detect
    unique'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'features in the array of images and reconstruct a three-dimensional scene (Figure
    2-4). Unlike single-lens cameras, preforming scene reconstruction using images
    from multi-lens cameras is slightly less challenging since we can estimate depth
    from two or more images and reconstruct a three-dimensional scene using the depth
    data.


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_36_0.png)


    # Figure 2-4. Structure from Motion Model


    Although scene reconstruction using vision-only techniques could be sufficient
    in some cases, in many cases visual data coming from handheld mobile phones is
    distorted due to the excessive motion and unpredictable lighting conditions, leading
    to a large error margin and in some cases failing to achieve scene reconstruction.
    In this case, Inertial Measurement Units (IMUs) that can be found in most mobile
    phones today would be used alongside the visual data to result in the best scene
    reconstruction possible. Information retrieved from IMU devices, such as orientation
    and acceleration, is extremely helpful when the visual data is distorted or delayed
    for any reason since the IMU data is provided at a higher frequency than the visual
    data, which helps in detecting any small'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'or significant changes in the motion and environment. Such IMU data is aligned
    with the visual data to compute the initial velocity and the physical coordinates
    of the device.


    Using IMU data alongside the visual data from a camera has been a common approach
    used in the Computer Vision and Augmented Reality fields to perform scene reconstruction
    and other physical world measurement tasks. In fact, it is typically referred
    to as Visual-Inertial Odometry, VIO for short. VIO was initially developed for
    use in aerial robotics, such as drones, and vehicles to enable autonomous applications.
    As the technology evolved from only depending on multi-lens visual to single-lens
    visual data, its applications increased and eventually enabled Augmented Reality
    on smartphones. The Augmented Reality applications of VIO mainly revolve around
    “Marker-Less AR,” which enables augmenting digital objects in the physical world
    without the requirement of a “marker.” An AR marker is a uniquely identified object
    or image that is used to augment digital objects on; this can be a QR code, image
    in a book, or human/animal body parts, such as face, hands, and feet. To achieve
    Marker-Based Augmented Reality, various vision tasks are required, such as object
    pose estimation, annotation, and landmark detection.


    # Different Types of Augmented Reality


    There are a few types of Augmented Reality that are commonly used today; that
    includes Marker-Based, Marker-Less, and Geolocation-Based Augmented Reality (AR).
    All three types’ core objective is to augment digital objects in the physical
    world; however, the techniques used to achieve each type vary. Additionally, the
    applications of each type have different purposes. For example, Marker-Based AR
    requires previously defined image features that we can use to augment digital
    objects on. A commonly seen use case of this is Face Filters. AR Face Filters
    augment digital objects on or surrounding a detected face and track the face movements
    to change the digital objects’ position accordingly (Figure 2-5).'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/7d8e54ee4578088e252f4c75b5cd4c88_38_0.png)


    # Figure 2-5. Face Detection and Landmark Estimation


    To achieve AR Face Filters, we would need to perform computer vision tasks, such
    as face detection and face landmark detection/tracking. Face detection is a process
    of segmenting and detecting a face from a given image. Face landmark detection
    is the process of detecting face features and tracking changes, such as eye blinking,
    mouth opening/closing, and facial expressions. By combining both information about
    the face in real time, we would be able to successfully augment digital objects
    on a face. In addition to using a detected face as a marker, there are other approaches
    that depend on various other markers, such as a simple QR code, a unique image,
    and custom physical objects (i.e., bottle, cup, hat, etc.). The processing techniques
    used to achieve other marker-based AR approaches are derived from the computer
    vision concepts of feature detection, tracking, and pose estimation. As we get
    closer to the implementation process at the end of this book, we will cover a
    more in-depth description of the algorithms used to achieve marker-based AR.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'Marker-less AR is a robust technique that does not require any previous knowledge
    of an environment; however, it requires certain pieces of hardware to achieve
    it. In the early days of marker-less AR development, the type of hardware required
    to achieve marker-less AR was not commonly owned by consumers, such as stereo
    cameras and advanced IMU devices. As research and development of AR increased,
    we have seen various approaches to minimize the use of uncommon hardware and instead
    depend on hardware that is widely accessible to consumers, such as low-cost IMU
    devices and single-lens cameras, commonly found in smartphones today. In the previous
    section, we briefly covered how marker-less AR is achieved today in most mobile
    phones using Visual-Inertial Odometry techniques, which make use of information
    retrieved from both IMU devices and a camera to perform scene reconstruction alongside
    other computer vision tasks that would enable marker-less AR. Marker-less AR applications
    are limitless, and there is a lot of space for more creative and impactful applications.
    Today, marker-less AR can be used to measure physical objects and simulate an
    experience onto the physical world. These applications have had a great impact
    throughout many industries including education, design, tourism, and many more.
    To summarize, marker-less and marker-based AR are fundamentally the same but have
    completely different applications due to the restrictions each technology has.
    Despite the fact that these two AR approaches have extremely different applications,
    they can be used simultaneously to achieve a more complex Augmented Reality experience,
    which leads us to Geolocation-Based AR.


    Geolocation-Based AR integrates both marker-less and marker-based AR with geographic
    location data to augment and “pin” digital objects in a specific geolocation coordinate
    (Figure 2-6).'
  merge: -1
  img_proc: true
- pgno: 40
  md: '![](img/7d8e54ee4578088e252f4c75b5cd4c88_40_0.png)


    Figure 2-6. Geolocation-Based AR


    # Summary


    In this chapter, we discussed some basic concepts related to Augmented Reality.
    After that, different types of Augmented Reality were discussed.


    AR can be defined as a system that incorporates three basic features: a combination
    of real and virtual worlds, real-time interaction, and accurate 3D registration
    of virtual and real objects.


    The core components of any AR-based tool are the processor, sensors, input devices,
    and mainly the display. The display could be a smartphone, a handheld device,
    smart glasses, or a head-mounted display (HMD). The input devices are either cameras
    or web cams. Sensors include gyroscopes and accelerometers.


    In the next chapter, we will take a look at image and video processing fundamentals
    in detail.'

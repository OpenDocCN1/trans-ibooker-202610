- pgno: 89
  md: '# BOOSTING Tracker


    This tracker is based on an online version of AdaBoost, which is the internal
    algorithm of the Haar cascade-based face detector. This classifier must be conditioned
    for both positive and negative instances of the object during runtime. The classifier
    is run with each pixel in the vicinity of the previous position in a new frame,
    and the classifier’s score is registered. The object’s new position is the one
    with the highest score. As a result, we now have yet another positive example
    for the classifier. Since more frames are received, the classifier is modified
    with the new information.


    Advantages: Its algorithm is over a decade old and still works, but I couldn’t
    think of a better purpose to do it while there are other specialized trackers
    (MIL, KCF), which operate along with similar principles.


    Disadvantages: Output in terms of tracking is mediocre. It doesn’t always understand
    whenever tracking isn’t working.


    # MIL Tracker


    It is similar to the BOOSTING tracker. The major difference is that, rather than
    finding just the object’s current position as a positive example, this searches
    a small community surrounding the current location for many possible positive
    examples. You don’t specify positive and negative examples in MIL; instead, you
    specify positive and negative “packs.” The positive bag’s array of photographs
    isn’t entirely made up of positive examples. Instead, just one picture from the
    optimistic bag must be a good illustration! A positive pocket, in our example,
    contains a patch based on the object’s current position as well as patches from
    a small community around it.


    Advantages: The result is excellent. It does not drift even more than the BOOSTING
    tracker, so this performs admirably when partially obscured. This might be the
    better tracker accessible unless you’re using OpenCV 3.0. However, if you’re using
    a later version, KCF is a good option.


    Disadvantages: The error of tracking is not accurately recorded. After a complete
    occlusion, it does not heal.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Kernelized Correlation Filter (KCF)


    The ideas discussed in the previous two trackers are expanded upon in the Kernelized
    Correction Filter tracker. This tracker incorporates MIL tracker’s multiple positive
    samples that include wide interacting areas. This concurrent research defines
    some interesting geometric parameters, which this tracker uses to make tracking
    both quicker and much more precise.


    Advantages: It outperforms BOOSTING and MIL in terms of accuracy and speed as
    well as reporting tracking failure. I suggest using this for most applications
    if you’re using OpenCV 3.1 or higher.


    Disadvantages: After a complete obstruction, it doesn’t restore.


    # MedianFlow Tracker


    From within, the detector calculates the differences among the object’s forward
    and backward trajectories in a period. It can accurately detect tracking errors
    and pick accurate trajectories in clip sequences by reducing the forward/backward
    error. In my experiments, I discovered that this tracker works when the motion
    is small and predictable. This tracker can detect when the tracking has failed
    and stops accordingly, however other trackers continue running even if the tracking
    has failed.


    Advantages: Outstanding reporting on monitoring failures. If a motion is predictable
    and there is no constriction, this technique works extremely well.


    Disadvantages: When there is a lot of movement, it stalls.


    # GOTURN Tracker


    It is the only tracking algorithm throughout the tracker class that uses a Convolutional
    Neural Network (CNN). We understand that OpenCV is “reliable to prospective modifications,
    illumination changes, and defects” with its documents.


    To be considered: The Caffe model is used by GOTURN, which is a CNN-based tracker.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# MOSSE Tracker


    MOSSE stands for minimum output sum of squared error. While initialized with a
    single frame, an adaptive correlation is used for object tracking, resulting in
    balanced association filtering. Variations in illumination, length, and posture
    and non-rigid deformations do not affect the MOSSE tracker.


    The maximum average ratio of the squared error is often used to identify deformation,
    allowing the tracker to stop and restart in which it leaves whenever the object
    shows up. It is indeed simple to use, reliable, as well as much quicker than other
    complicated trackers. However, it falls short of deep learning-based trackers
    in terms of accuracy.


    # CSRT Tracker


    The spatial reliability map is used in the Discriminative Correlation Filter with
    Channel and Spatial Reliability (DCF-CSR) to change the filter aid to the portion
    of the specified location through a framework for tracking. It only makes use
    of two standard features (HoGs and Color Names). It also has a lower frame rate
    (25 fps) but has better object tracking reliability.


    # C) Image-to-Text Analysis


    # Using the C++ OCR Library, Convert an Image to Text


    OCR (Optical Character Recognition) technology allows you to interpret and translate
    text from images or scanned documents into human-understandable text. Reading
    codes from coupons, creating text format-able, self-service shops, translating
    print information into digital versions, and so on are only a few of the applications
    for OCR. There seems to be a variety of OCR software and libraries on the market,
    but the accuracy of the OCR tests is crucial. In this section, I’ll show you how
    to use C++ to build our own OCR software and transform images to text.'

    # Key Problem


    As a result, a key problem for mobile AR/VR is how to perform real-time motion
    tracking while automatically balancing jitter and latency in various situations.
    The frame rate of incoming photos and IMU measurements is constant with the existing
    monocular camera and inertial sensor, resulting in a constant time interval between
    adjacent arriving poses from the visual-inertial fusion. As a result, the position
    changes of neighboring postures are used to differentiate between various motion
    circumstances in real time.


    The following extensive analyses of the proposed segmented strategies are given
    to further explain the proposed adaptive filter system:


    +   - Jitter filtering: So when a mobile AR/VR device is nearly stationary or
    runs gradually, the transition among adjacent poses can be almost neglected. As
    a result, the jitter phenomenon dominates in this case, whereas the latency phenomenon
    for mobile AR/VR users can be ignored. Such a stage is referred to as jitter-filtering
    in this book. At the same time, the real-time distances among arrival poses are
    currently small enough.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '+   - Moderation filtering: During the work with a moderate distance pith,
    this stage is known as moderation filtering when the motion situation of the mobile
    AR/VR system is under moderate motion circumstances.


    +   - Latency filtering: Whenever the mobile AR/VR system is subjected to rapid
    motion, a difference among adjacent arriving poses is dramatic. When the pose
    does not arrive on time, the consumer will note the latency. Therefore, in this
    situation for mobile AR/VR, the latency phenomenon dominates, while the jitter
    phenomenon can be overlooked in a fast-moving situation. Latency filtering is
    the term for this point.


    The normalized distance among adjacent postures can be used to feed the proposed
    adaptive filter system, as per the preceding explanations. Thus, to solve various
    motion situations, the appropriate filter phase is decided. To efficiently solve
    the jitter and latency phenomena, quadratic functions are used in the jitter and
    latency stages to smooth out extreme motion conditions. Furthermore, a linear
    function is known as moderation filtering to bridge the jitter filtering and latency
    filtering stages on mobile terminals to reduce computing complexity. These segmented
    frameworks aim to estimate an ideal dynamic system, resulting in a simple and
    suboptimal solution for mobile AR/VR jitter and latency. Therefore, an adaptive

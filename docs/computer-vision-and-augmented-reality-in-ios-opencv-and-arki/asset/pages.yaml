  md: '# Semantic Segmentation


    The method of agglomerating portions of an image that fall under the same object
    class is called semantic separation or image segmentation. Each pixel of the image
    has a sort of pixel preview since it is categorized by category. Cityscapes, PASCAL
    VOC, and ADE20K are among the standards for this mission. Mean IoU and pixel precision
    metrics are commonly used in testing models. The mean IoU is used to test models.
    More precisely, the purpose of semantic image segmentation is to mark what is
    depicted in each pixel of an image a corresponding class. This method is widely
    referred to as dense prediction, since we forecast for each pixel in the image.


    One important point to remember is that instances of the same class are not separated;
    we think just for the type of each pixel. In other words, if you have two objects
    in the same group in your input image, they are not automatically distinguished
    as separate objects by the segmentation map. A different type of model exists,
    known as example segmentation model, which discriminates between distinct objects
    of the same class.


    For a number of activities, segmentation models are helpful.


    # Vehicles That Are Automatic


    In order for self-driving cars to fit safely into our current highways, we need
    to equip cars with the requisite perception to consider their surroundings.


    # Medical Diagnostic Picture


    Machines will improve the research carried out by radiologists, significantly
    decreasing the time needed for diagnostic testing to be carried out (Figure 4-12).'

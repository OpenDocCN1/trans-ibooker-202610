    ## 第 1 章


    ## 计算机视觉导论


    本章将重点介绍计算机视觉是什么、我们为什么需要它、技术的发展历程、其不同的应用，以及它在增强现实中的使用方式。


    ### 什么是计算机视觉？


    视觉是分析和解释感兴趣的场景和物体的能力。人类视觉已被研究了数百年，以了解视觉过程如何运作。人类视觉过程是最复杂的过程之一。事实上，至今视觉科学家尚未找到视觉过程如何运作的完整答案。然而，视觉科学家对人类视觉过程如何开始以及其之后的少量发现启发了计算机科学家开发出我们今天所知的计算机视觉。视觉研究人员和科学家描述说，视觉过程始于眼睛处理光信号并将其转换为场景和图像，供大脑视觉皮层分析和解释。1950
    年代的一项视觉研究突破发现，视觉过程始于检测图像的简单结构和边缘，以帮助在视觉信息变得更复杂时构建更详细的解释。这项突破性的视觉研究启发了计算机科学家开发我们今天使用的预处理计算机视觉算法，以启动每项计算机视觉任务。与今天典型的计算机相比，人类大脑的计算速度明显慢于计算机的计算速度，然而人类大脑执行视觉任务的速度要快得多，并且明显优于任何计算机。因此，研究人员开发计算机视觉算法的灵感始终是自然界中视觉的演变。


    计算机视觉是研究和开发使计算机能够处理、分析和解释数字图像的技术领域。今天，计算机视觉应用可以在多个行业中找到，例如工业机器人、医学成像、监控等。所有这些应用都有一个主要使命，即处理、分析和解释数字图像的内容以执行与行业需求相关的任务，在本书其余部分中将此称为视觉任务。视觉任务是指任何需要处理、分析或解释数字图像和视频内容的一类任务。供参考，视频是一系列数字图像，通常每秒由
    30–60 张数字图像组成，也称为帧。


    计算机经常显示数字图像。当数字图像作为输入提供给计算机时，计算机将其读取为二维像素数组；也可以定义为二维矩阵。图像矩阵由 M 列和 N 行组成。图像的像素大小可以通过求
    M 列和 N 行的乘积来确定（M × N），其中 M 为图像宽度，N 为图像高度。像素位置由其在矩阵中的 x 和 y 坐标（x, y）标识。计算机图形和数字图像中的坐标系统与典型的笛卡尔坐标系统略有不同；数字图像中原点（0,
    0）始于图像的左上角。因此，x 从左到右递增，y 从上到下递增（见图 1-1）。



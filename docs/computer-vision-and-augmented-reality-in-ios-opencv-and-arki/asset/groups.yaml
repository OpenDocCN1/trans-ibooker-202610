    ## Marker-Based Augmented Reality


    ## Using ArUco Markers in OpenCV (C++) to Create Augmented Reality


    Throughout this section, we’ll go over what ArUco markers are as well as how to
    utilize them with OpenCV to perform basic augmented reality activities. For a
    long time, ArUco markers have been utilized in virtual reality, camera pose prediction,
    and calibration. Let us just take a closer look at it.


    ### What Are ArUco Markers?


    ArUco stands for Augmented Reality University of Cordoba (Figure 6-1). The University
    of Cordoba is a university in Cordoba, Spain, where it was made.


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_123_0.png)


    Figure 6-1. ArUco Marker


    Few examples follow:


    The ArUco marker is a fiducial marker that is positioned onto the photographed
    item as well as a scenario. It’s a binary square having a dark background as well
    as borders, as well as a white produced pattern that recognizes this. The dark
    borders make it much easier to see. It is available in a range of sizes. For effective
    detection, the size is selected depending upon the size of the object as well
    as the scenario. While quite minor markers aren’t being identified, simply growing
    their size will help them to be found.


    A concept will be to scan such markers as well as use them in real life. Photographing
    the natural world allows you to identify these markers especially. When you’re
    a beginner, you might be wondering, “How does this help me?” Let us just glance
    at a few examples. We placed the printed as well as the markers, mostly on edges
    of the image frame throughout the instance they mentioned throughout the article.
    So, when markers are specifically identified, you can substitute an image frame
    through either a picture or clip. Once you switch the camera, a new image seems
    to have the right viewpoint distorted. Such markers could be placed across a route
    of a warehouse both fitted with a camera inside a robotics application. Since
    each marker seems to have a unique ID, we recognize where markers are positioned
    inside the warehouse. Whenever the robot’s camera identifies any of these markers,
    this can pinpoint the exact position within a warehouse.


    ### Using OpenCV to Create ArUco Markers


    Utilizing OpenCV, we can quickly produce such markers. There are 25 predefined
    vocabularies for markers inside the aruco module of OpenCV. The dictionary’s markers
    all include the same block size orders (44, 55, 66, or 77), so every vocabulary
    has a set number of markers (50, 100, 250, or 1000).


    Here is the C++ code that shows how to identify and generate Aruco markers. We
    have to use the aruco module. PredefinedDictionary in the code shows how dictionaries
    of 250 markers will be loaded.


    ### C++


    ```

    // Import the aruco module in OpenCV

    #include <opencv2/aruco.hpp>


    Mat markerImage;

    // Load the predefined dictionary

    Ptr<cv::aruco::Dictionary> dictionary =

    aruco::getPredefinedDictionary(cv::aruco::DICT_6X6_250);

    // Generate the marker

    aruco::drawMarker(dictionary, 33, 200, markerImage, 1);

    ```


    The preceding drawMarker function allows us to select a marker with a specific
    ID (the second parameter – 33) out of a set of 250 markers with IDs ranging from
    0 to 249. The size of the marker produced is determined by the drawMarker function’s
    third parameter. It might produce a 200 × 200-pixel picture throughout the preceding
    instance. The object that will be used to preserve the created marker would be
    the fourth parameter (preceding markerImage). Eventually, a density parameter
    refers to the number of blocks that should be inserted as a boundary toward the
    formed binary pattern. Inside the illustration earlier, a 1-bit border would be
    inserted across the 6×6 produced shape, resulting in a 7×7 bit picture in a 200
    × 200-pixel picture (Figure 6-2). The preceding code will produce a marker similar
    to the one shown in the following.


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_125_0.png)


    Figure 6-2. Sample Marker


    For most cases, we’ll need to create several markers, print them out, as well
    as position them inside the scenario.


    **ArUco marker detection:** We must identify the ArUco markers and then utilize
    them in additional analysis until a scenario has been visualized by it. We''ll
    show you how to spot the markers in the following.


    ### C++


    // Load the dictionary that was used to generate the markers.

    Ptr<Dictionary> dictionary = getPredefinedDictionary(DICT_6X6_250);


    // Initialize the detector parameters using default values

    Ptr<DetectorParameters> parameters = DetectorParameters::create();


    // Declare the vectors that would contain the detected marker corners and the
    rejected marker candidates

    vector<vector<Point2f>> markerCorners, rejectedCandidates;


    // The ids of the detected markers are stored in a vector

    vector<int> markerIds;


    // Detect the markers in the image

    detectMarkers(frame, dictionary, markerCorners, markerIds, parameters, rejectedCandidates);


    To begin, we load a similar vocabulary that has been used to create a marker.
    DetectorParameters is used to detect a starting collection of parameters: make
    something (). We can adjust numerous parameters within the identification phase
    using OpenCV. The default parameters function well in most situations, and OpenCV
    suggests that you use them. As a result, we''ll keep the same settings. Four side
    points of a marker are identified with each active marker detection, of the sequence
    top left, top right, bottom right, and bottom left. Such rectangular pointers
    being processed as a vector of points in C++, as well as several markers throughout
    the picture were combined into a vector of vectors of points. A detectMarkers
    feature is utilized to find and detect markers'' corners. The picture of the scenario
    with the markers will be the first parameter. The dictionary utilized to create
    markers is the second parameter. Markers that were accurately identified would
    be saved as markerCorners, or their IDs will be saved in markerIds. Also sent
    as a parameter seems to be the DetectorParameters entity that was created earlier.
    Eventually, the disqualified members are kept in the rejected candidates database.


    It’s critical to leave a white border across the black boundary of the markers
    whenever printing, cutting, and inserting them within the scene so that they could
    be conveniently identified.


    ### An Augmented Reality Application


    An ArUco marker has been designed for overcoming an issue for estimating camera
    posture for just a wide range of apps, such as augmented reality. We’ll use them
    in this section for an augmented reality app that allows us to superimpose every
    current scenario upon a current picture or a clip. We choose a scenario at houses
    with such a huge image frame which we would like to substitute to the latest ones
    to view how they appear on a surface. We after which attempt to embed a clip into
    a film. We do this by printing, cutting, and pasting wide ArUco markers onto the
    picture region’s edges, as seen in the picture here, and afterward recording a
    clip. The clip that’s been taken can be found on the left side of the video at
    the top of the page. After that, we handle each frame of the video one by one.
    A marker first is detected for each picture. The identified markers are shown
    in green in the following image. A tiny red ring denotes the first point. By clockwise
    navigating a marker’s boundary, you can get to the second, third, and fourth stages.


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_127_0.png)


    To compute a homography, four corresponding points inside the input picture as
    well as a current scenario picture are utilized (Figure 6-3). Under one of our
    previous posts, we discussed homography. Homography is indeed a transformation
    mapping and a referring point to another given intersection point within differing
    opinions of the scenario.


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_128_0.png)


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_128_1.png)


    Figure 6-3. Augmented Reality Using ArUco Markers in OpenCV


    A homography metric is utilized throughout the example to warp the new scenario
    picture through into a quadrilateral identified by the markers in the clicked
    picture. In the following code, we demonstrate how to do so.


    +   - In a variable, store the image’s direction.

    +   - Make a buffer to keep OCR results in.

    +   - The aspose::ocr::page rect(const char *image path, wchar t *buffer, size
    t buffer size, int x, int y, int w, int h) function is used to perform OCR.


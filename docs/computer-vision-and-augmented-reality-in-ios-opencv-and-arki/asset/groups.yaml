    包括计算机科学（图形学、算法、哲学、结构与体系结构）、数学（信息检索、机器学习）、工程学（机器人、语音、NLP、图像处理）、物理学（光学）、生物学（神经科学）以及心理学（认知科学），等等。


    由于其跨领域的掌握能力，许多科学家都认为机器视觉为通用人工智能铺平了道路，因为它代表了对视觉环境及其上下文的相对理解。


    ## 那么什么是计算机视觉？


    正式教材中的定义如下：


    - “从图像构建物理对象的明确、有意义的描述”（Ballard & Brown, 1982）。

    - “...从一个或多个数字图像计算三维世界的属性”（Trucco & Verri, 1998）。

    - “...基于感知的图像对真实物理对象和场景做出有用决策”（Sockman & Shapiro, 2001）。


    ## 为什么是计算机视觉？


    最明显的回答是，这一研究领域拥有日益增长的实用应用集合。以下是仅有的几个例子（图 3-3）：


    - 人脸识别：Snapchat 和 Facebook 使用人脸检测算法来添加滤镜并在图像中识别你。

    - 图片检索：Google 图片使用基于内容的查询来定位合适的图像。算法会探索查询图像的内容，并根据最相关的内容返回结果。

    - 游戏和控制：Microsoft Kinect 是一款出色的商用设备，在游戏中利用立体视觉。


    ## 计算机视觉的应用


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_46_0.png)


    图 3-3. 计算机视觉的应用


    - 监控摄像头在公共场所很常见，用于追踪异常活动。

    - 指纹、虹膜和人脸匹配是最受欢迎的生物识别认证技术之一。

    - 视觉仍然是检测智能车辆的道路信号、灯光和其他视觉特征的主要信息来源。


    计算机视觉涉及视觉识别，例如图像描述、定位和识别。


    ## 标准算法


    这些最先进的视觉识别技术的效率由于神经网络和深度学习方法的最新进展而得到了极大提升。本书是学习深度学习架构以及它们在尖端机器视觉科学中如何使用的绝佳平台。在本书中，我们将介绍五种最重要的计算机视觉策略：卷积神经网络、AlexNet、基于区域的卷积神经网络（R-CNN）和
    Fast R-CNN。此外，我们还将介绍每种策略可用于的主要深度学习模型和应用。


    ## 图像分类


    图像分类（图 3-4）的目标如下：我们得到一系列图像，所有图像都用单一类别标记，我们被要求为一组新的测试图像预测这些类别，并计算预测的准确率。视角变化、尺寸变化、类内变化、图像变形、图像遮挡、光照条件和背景杂乱都是该活动带来的问题。


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_47_0.png)


    图 3-4. 图像分类


    我们如何构建一个可以将图像分类到不同组别的算法？计算机视觉研究人员为此问题设计了数据驱动的解决方案。他们向计算机提供每个图像类别的多个示例，然后创建学习算法，让这些算法查看这些示例并学习每个类别的视觉外观，而不是尝试在代码中显式确定感兴趣的每个图像类别的外观。


    换句话说，首先将标记好的图像训练数据集输入系统进行处理并据此创建分类模型。以下是图像分类流程的正式版本：


    - 作为输入提供包含 N 张图像的训练数据集，每张图像都标记为 K 个组之一；其中 N 是所有组中图像的总数，K 是分类模式中的组数。组代表图像所属的类别。

    - 然后我们使用这个训练包来教分类器如何对图像进行分类。

    - 最后，我们通过让它为从未见过的新图像系列推断标签来衡量分类器的输出。这些图像的实际标签将与分类器预测的标签相等。


    卷积神经网络（CNNs）是最常用的图像识别架构。当你将图像输入网络并让网络对数据进行分类时，这是 CNN 的常见用例。CNN 通常以一个输入“扫描器”开始，该扫描器并非设计为一次处理所有训练数据（图
    3-5）。例如，当处理 CNN 时，你不希望有一个包含 10,000 个节点的层来输入一个 100 × 100 像素的文件。这将极其低效且在更大规模上不实用。


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_49_0.png)


    # 图 3-5. 卷积神经网络


    相反，你创建一个 10 × 10 扫描输入层，将图像的第一个 10 × 10 像素输入其中。数据传递后，将扫描器向右移动 1 像素以输入下一个 10 × 10
    像素。这种过程被称为滑动窗口。


    卷积层而非常规层用于处理输入数据。每个节点只关心其邻近范围内的单元。这些卷积层通常随着变厚而显得变小，这归因于可快速分割的输入因子。它们通常还具有池化层。一种流行的池化策略是最大池化，其中我们取例如
    2 × 2 像素并继续处理具有最多特定属性的像素。


    ImageNet，一个近 120 万个高分辨率训练文件的数据集，如今被用于训练大多数图像识别技术。测试图像将以无初始标注的方式查看（即无分割或标签），算法将被要求创建标注以显示图像中存在哪些对象。来自牛津、INRIA
    和 XRCE 的领先计算机视觉团队在此数据集上测试了一些更好的当前计算机视觉方法。通常，计算机视觉解决方案使用多阶段管道，并在早期阶段通过调整几个参数进行手工调优。


    Alex Krizhevsky（NIPS 2012），首届 ImageNet 竞赛的获胜者，构建了一个非常深的卷积神经网络，其类型由 Yann LeCun
    开创。其架构中有七个隐藏层，不包括任何最大池化层（图 3-6）。前两层是卷积层，最后几层是全局相关的。在每个隐藏层中，激活函数是经过整流的线性单元。这些单元比逻辑单元更具表达力且训练速度更快。此外，还使用了竞争性归一化来消除隐藏行为，当附近单元具有更强活动时。这有助于强度差异。


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_50_0.png)


    图 3-6. AlexNet


    就硬件而言，Alex 使用两块 Nvidia GTX 580 GPU 来运行非常强大的卷积网络实现（超过 1000 个快速小核心）。GPU 非常适合矩阵-矩阵乘法并且具有大量内存带宽。这有助于它们在一周内训练网络，并在测试期间快速合并来自十个补丁的结果。随着核心变得更便宜且数据库变得更大，大型神经网络可以比传统
    CV 网络更进一步。


    ## 目标检测


    输出特定对象的边界框和标记是广泛用于描述图像中对象的技术。这与分类/定位挑战不同，在该挑战中分类和定位应用于大量对象而非单一主导对象。对象分组只有两种类型：项目边界框和非对象边界框。例如，在汽车检测中，你必须检测给定图片中的所有汽车及其边界框（图
    3-7）。


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_51_0.png)


    图 3-7. 目标检测


    如果我们使用滑动窗口技术来识别和定位图像，我们需要将 CNN 添加到图像的多个不同裁剪上。由于 CNN 将每个裁剪分类为实体或上下文，我们必须将 CNN 应用于大量位置和尺寸，这在计算上非常昂贵。



    # Change the Color Space


    In a way that makes them conveniently reproducible, a protocol for expressing
    colors is a color space. A grayscale image has one pixel value for a single pixel,
    however color images have three values for a single pixel, that is, red (R), green
    (G), and blue (B) usually referred to as RGB.


    In most cases, computer vision uses the RGB format to process images. Today, the
    OpenCV library the default format when reading and image is RGB, however it stores
    the image data in BGR, which is similar to RGB but it only differs in the order
    of the pixel description. Therefore when reading pictures with OpenCV, you must
    convert the image color field from BGR to RGB (Figure 4-3).


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_65_0.png)


    Figure 4-3. RGB Components of an Image


    # Resize the Images


    A training model has a fixed input size for machine learning tasks. The same also
    applies to computer vision models. We should have images of the same size when
    training our model. OpenCV offers convenience methods allowing scaling up and
    down images. These methods are helpful when we need to translate images to the
    input form of the deep learning algorithm for its training (Figure 4-4).'

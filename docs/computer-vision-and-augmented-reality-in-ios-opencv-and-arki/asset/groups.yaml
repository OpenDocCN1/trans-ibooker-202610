    to as an Artificial Neural Network (ANN). A Neural Network is a computing model
    that is designed to recognize patterns in a given set of labeled data (labeled
    images in this case). The network uses the given images to recognize a pattern
    and predict the results of each image. Once the network predicts the results of
    an image, it compares its prediction to the labels assigned to the image. The
    comparison stage enables the network to “learn” from the errors in its initial
    process, and then it performs the same process multiple times until the network
    provides more accurate results. Neural Networks often required lots of labeled
    data to provide significantly good results. Hence, in the early days, a Neural
    Network was not used to its full potential due to the lack of data.


    In the early 2010s, a group of Computer Vision researchers initiated a large-scale

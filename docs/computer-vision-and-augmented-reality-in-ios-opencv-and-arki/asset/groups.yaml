  - '[PAGE 8]


    # About the Author


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_8_0.png)


    **Ahmed Fathi Bekhit** is Cofounder and Chief Technology Officer at Magic Studio,
    a software company based in Boca Raton, Florida, that focuses on developing cutting-edge
    video processing and streaming technologies. In the early days of Ahmed’s career
    in software engineering, he was awarded the Apple WWDC Scholarship three times
    in a row and was also titled “Apple’s Whiz Kid” by *The Wall Street Journal* at
    the age of 15.


    As of today, Ahmed has worked as a software engineer with a few startups for seven
    years, and he has been writing software for over a decade. He also regularly contributes
    to the open source community and has been known for creating ARVideoKit, an iOS
    framework that renders ARKit content to capture videos, GIFs, and live photos
    with Augmented Reality components. In addition to developing software, Ahmed has
    interest in writing educational material that is focused on software engineering
    to share his background and knowledge with others. For example, he contributed
    various articles on the tutorial site AppCoda. He also published educational material
    through Stanford University’s Scholar Initiative. Additionally, over the past
    few years, Ahmed developed and published independent iOS applications that reached
    over five million users. Ahmed’s engineering work has been notably integrated
    in Emmy-winning software and licensed to help with the COVID vaccine manufacturing
    pipeline.'
  - '[PAGE 9]


    # About the Technical Reviewer


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_9_0.png)


    **Massimo Nardone** has more than 22 years of experience in security, web/mobile
    development, and cloud and IT architecture. His true IT passions are security
    and Android. He has been programming and teaching how to program with Android,
    Perl, PHP, Java, VB, Python, C/C++, and MySQL for more than 20 years. He holds
    a Master of Science degree in computing science from the University of Salerno,
    Italy.


    He has worked as a project manager, software engineer, research engineer, chief
    security architect, information security manager, PCI/SCADA auditor, and senior
    lead IT security/cloud/SCADA architect for many years.'
  - '[PAGE 10]



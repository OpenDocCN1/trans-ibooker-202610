    AR 在许多情况下依赖于基于标记或免标记 AR，并集成位置传感器技术，根据视觉和位置数据在物理世界中显示数字对象。


    增强现实今天主要通过移动设备访问，具体来说是智能手机。虽然人们曾尝试通过开发定制硬件和设备（如微软的 HoloLens、Magic Leap 眼镜和 Google
    眼镜）来集成沉浸式 AR 体验，但对于消费者来说，采用新颖不熟悉的硬件还为时过早。因此，智能手机是向消费者介绍 AR 的完美工具。在移动 AR 的早期，使用标记，如二维码或模板图像，是在物理世界中增强数字对象的主要方式。为此，需要诸如模式识别和姿态估计等技术。模式识别是一种依赖于预定义的数据集来描述在给定图像中查找和分析的特征的技术。姿态估计


    使用检测到的模式根据摄像机角度模拟三维姿态（见图 1-12）；该技术用于根据摄像机的视角从各个角度看到三维对象。


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_29_0.png)


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_29_1.png)


    图 1-12. 身体姿态估计


    基于标记的 AR 允许任何拥有智能手机的用户交互和使用该技术；然而，拥有物理标记的要求对于日常使用来说既不可扩展也不实用。因此，由于其易用性和可访问性，免标记
    AR 具有更大的潜力。在免标记 AR 开发的早期，需要双摄像头来重建物理世界。


    ## 总结


    在本章中，我们阅读了计算机视觉的历史。比较了灰度图像和彩色图像。我们还研究了为什么我们需要计算机视觉及其评估。我们还看到了前馈人工神经网络的简化架构。最后，我们查看了增强现实。


    总之，计算机视觉是人工智能（AI）的一个领域，它使计算机和系统能够从数字图像、视频和其他视觉输入中提取有意义的信息，并基于该信息采取行动或做出建议。如果 AI
    使计算机能够思考，计算机视觉则使它们能够看到、观察和理解。


    计算机视觉的工作方式与人类视觉非常相似，只是人类起步更早。人类视觉的优势在于拥有数十年的上下文来训练如何区分物体、它们有多远、它们是否在移动，以及图像中是否有问题。



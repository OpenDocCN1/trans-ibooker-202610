  md: "\n## Proposed Adaptive Visual-Inertial Approach\n\nThe proposed adaptive visual-inertial\
    \ approach has several advantages. Furthermore, tracking stability can be enhanced\
    \ when suffering from motion blur or poor texture, as per credible pose estimate\
    \ by IMU within a brief period. A quantitative experiment is conducted to further\
    \ validate the proposed procedure. The ground truth for the proposed approach\
    \ is the trajectory obtained from the typical target pattern, which is known to\
    \ have high accuracy. The smartphone AR is prone to collapsing based solely on\
    \ visual-based motion tracking due to the incredible blurred picture. Even so,\
    \ the tracking loss phenomena caused by fast motion blur can be alleviated using\
    \ the proposed sensor fusion–dependent tracking method.\n\nVR helps the user to\
    \ communicate with the virtual world in a variety of ways. As a result, real-time\
    \ monitoring of the user’s postures and behaviors is crucial for a VR device.\
    \ Furthermore, the frame rate for motion tracking in VR is higher than that of\
    \ AR. Alternatively, the consumers will become ill as a result of the latency\
    \ phenomenon. A smooth 6-DoF motion tracking for cellular VR could be accomplished\
    \ in real time using the proposed adaptive visual-inertial fusion process. The\
    \ 6-DoF motion of the user can be observed in real time using the proposed multi-sensor\
    \ device installed on the user’s head. As a result, when the user walks independently\
    \ in the real world, the virtual scene’s focus will adjust to match the real 6-DoF\
    \ motion tracking.\n\n## Real-Time Motion Tracking\n\nReal-time motion tracking\
    \ is a critical issue for any AR/VR device, so there are a variety of ways to\
    \ achieve this performance. In marker-based motion tracking, the device must first\
    \ detect and recognize the marker before calculating the observer’s relative pose.\
    \ Even so, the marker must be placed on or near the item of concern ahead of time,\
    \ and it is not always possible to do so in some cases. Furthermore, the marker\
    \ must stay noticeable throughout the mobile AR/VR operation, as tracking is more\
    \ likely to be corrupt if the marker is not visible. Correspondingly, another\
    \ popular motion tracking system for mobile AR/VR is the model-based method. This\
    \ tracking method uses a prior model of the environment to be tracked. Usually,\
    \ this prior knowledge consists of 3D models or 2D templates of the real scene.\n\
    \n## Summary\n\nThis work presented a real-time motion tracking strategy for smartphone\
    \ AR/VR that is more effective than conventional visual-based marker-less tracking\
    \ approaches. A monocular visual-inertial fusion is developed in the document\
    \ that could effectively boost the tracking robustness and enhance frame rate\
    \ with the aid of an inertial sensor, given the real-time and robust posture arriving\
    \ for mobile AR/VR. Moreover, an adaptive filter system is proposed to mitigate\
    \ the jitter phenomena in heterogeneous sensor fusion that can change the filter\
    \ weight as per various motion circumstances, resulting in real-time and smooth\
    \ motion monitoring for both technologies. Eventually, experiments are done in\
    \ various AR/VR scenarios, and the outcomes indicate that the proposed approach\
    \ is both robust and accurate. A segmented adaptive framework is presented in\
    \ this article for a simplifying calculation, and a suboptimal output for real-time\
    \ motion tracking for smartphone AR/VR is obtained. Even so, unstable transitions\
    \ occur at the segmented point in tracking output, so future work will focus on\
    \ a more continuous filtering system for visual-inertial fusion.\n\n## CHAPTER\
    \ 7\n\n## Augmented Reality Using ARKit and OpenCV\n\nARKit has been one of Apple’s\
    \ most popular iOS 11 functionality. Many more innovative augmented reality applications\
    \ are being developed daily. In this project we will focus on setting up your\
    \ first Augmented Reality projects using Apple’s ARKit and implementing it in\
    \ Unity.\n\n### Why Do You Use OpenCV instead of Core ML?\n\n#### Multiple Platforms\
    \ Are Supported\n\nAlthough Core ML could be the best option for an iOS 11-only\
    \ iPhone app, whenever you want backward compatibility or would like to support\
    \ multiple platforms, you will have to instead build a custom approach for each\
    \ platform or use OpenCV.\n\nMachine Learning isn’t right for every issue. Although\
    \ Apple offers a couple of free open source models for items like object as well\
    \ as scene detection, the field of computer vision is far bigger than just machine\
    \ learning, and OpenCV is the most convenient way to get access to these resources.\n\
    \n## ARKit and OpenCV Integration\n\nVia a delegate call, ARSession allows direct\
    \ access to the current frame data.\n\n```\n- (void)session:(ARSession *)session\
    \ didUpdateFrame:(ARFrame *)frame;\n```\n\nWhen a new frame becomes visible, this\
    \ function is invoked. We can get a CVPixelBufferRef of the raw data via a frame\
    \ from here. Although the data in the frame is given in planar YCbCr format, we\
    \ only require the grayscale version for our purposes. We miss the conversion\
    \ stage and just catch the Y frame as we know it’s a YUV format.\n\nThis was how\
    \ we went about doing it:\n\n```\ncv::Mat mat;\n\nCVPixelBufferLockBaseAddress(buffer,\
    \ 0);\n\n//Get only the data from the plane we're interested in\n\nvoid *address\
    \ = CVPixelBufferGetBaseAddressOfPlane(buffer, 0);\n\nint bufferWidth = (int)CVPixelBufferGetWidthOfPlane(buffer,0);\n\
    \nint bufferHeight = (int)CVPixelBufferGetHeightOfPlane(buffer, 0);\n\nint bytePerRow\
    \ = (int)CVPixelBufferGetBytesPerRowOfPlane(buffer, 0);\n\nmat = cv::Mat(bufferHeight,\
    \ bufferWidth, CV_8UC1, address, bytePerRow).clone();\n\n//Rotate the frame we\
    \ receive\n\ncv::Mat rotated;\n\ncv::transpose(mat, rotated);\n\ncv::flip(rotated,\
    \ rotated,1);\n//Do what we want with the frame\n//detect faces, track objects\
    \ ect.\n\nCVPixelBufferUnlockBaseAddress(buffer, 0);\n```\n\nWe only need the\
    \ Y frame, which is held in the first place, as previously mentioned.\n\nTo do\
    \ so, we use the `CVPixelBufferGetBaseAddressOfPlane` techniques with a plane\
    \ index of 0 instead of the standard `CVPixelBufferGet` methods.\n\nEventually,\
    \ since the frame we obtain is in landscape mode, all we have to do is rotate\
    \ it before moving it on to any OpenCV magic we have.\n\nThe logic is being reused.\n\
    \nIf you’re making an Augmented Reality app that also supports iOS 10, you can\
    \ use the preceding approach by changing the format of your AVCaptureVideoDataOutput\
    \ to fit ARKit\n\n```\n_captureOutputVideo.videoSettings = @{\n    (NSString *)kCVPixelBufferPixelFormatTypeKey\
    \ :\n    @(kCVPixelFormatType_420YpCbCr8BiPlanarVideoRange)};\n```\n\nand using\
    \ the SampleBufferRef to get the same CVPixelBufferRef.\n\n```\nCVImageBufferRef\
    \ imageBuffer =\nCMSampleBufferGetImageBuffer(sampleBuffer);\n```\n\n## To Sum\
    \ Up\n\nAlthough iOS 11 (and beyond) install base has been increasing, a typical\
    \ augmented reality application can not solely integrate the tools included in\
    \ Apple’s latest update. However, by integrating the frame data we get from ARKit\
    \ with OpenCV, we'll be able to build seemingly convincing interactions because\
    \ they’re truly augmenting truth using both low-level implementation from OpenCV\
    \ and ARKit’s convenience methods and APIs. Interactions can be anything from\
    \ body tracking to depth analysis (Figure 7-1).\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_143_0.png)\n\
    \nFigure 7-1. Body Tracking with ARKit in iOS\n\n## Prerequisite\n\nWe require\
    \ a Mac computer to develop our programs and an iOS device to run them because\
    \ we are building for the Apple ecosystem.\n\n## Hardware\n\nA macOS PC that is\
    \ compatible with macOS Catalina is required in terms of hardware. The strong\
    \ Apple A12 Bionic CPUs are also required for body monitoring programs to function\
    \ properly. The following Mac computers and iOS devices are eligible for this\
    \ promotion:\n\n| Computers | Mobile devices |\n|---|---|\n| 12-inch MacBook |\
    \ iPhone XS |\n| MacBook Air, 2012 and later | iPhone XS Max |\n| MacBook Pro,\
    \ 2012 and later | iPhone XR |\n| Mac mini, 2012 and later | iPad Pro 11-inch\
    \ |\n| iMac, 2012 and later | iPad Pro 12.9-inch |\n| iMac Pro |  |\n| Mac Pro,\
    \ 2013 and later |  |\n\nFigure 7-2. Mac Computers and iOS Devices Eligible for\
    \ This Promotion\n\n## Software\n\nYou'll need to install the following applications\
    \ on your Mac to run the demos:\n\n- Unity3D 2019.1.5f1 with iOS build target\n\
    - MacOS Catalina 10.15 (beta)\n- Xcode 11 (beta)\n\niOS 13 (beta) or iPadOS 13\
    \ should be installed on your device (beta). As you'll see, the majority of the\
    \ program is still in beta at the time of writing. Please remember that the devices\
    \ may become sluggish or unreliable, so take extra precautions to avoid losing\
    \ important data.\n\n## Body Tracking Step by Step\n\nLet's get started with the\
    \ ARKit magic. Launch Unity3D 2019.1 on your computer and start a new project\
    \ (Figure 7-3).\n"
  mdcn: "\n\n## 拟议的自适应视觉-惯性方法\n\n拟议的自适应视觉-惯性方法具有多个优势。此外，当遭受运动模糊或纹理较差时，跟踪稳定性可以得到增强，这是由于\
    \ IMU 在短时间内提供了可信的姿态估计。进行了定量实验以进一步验证拟议的流程。拟议方法的地面真值是从典型目标图案获得的轨迹，已知其具有高精度。智能手机\
    \ AR 仅基于视觉运动跟踪就容易崩溃，这是由于不可思议的模糊图像。即使如此，使用拟议的传感器融合依赖跟踪方法也可以缓解由快速运动模糊引起的跟踪丢失现象。\n\
    \nVR 帮助用户以多种方式与虚拟世界进行通信。因此，实时监控用户的姿势和行为对于 VR 设备至关重要。此外，VR 中运动跟踪的帧率高于 AR。或者，用户会因延迟现象而感到不适。拟议的自适应视觉-惯性融合过程可以实时实现蜂窝\
    \ VR 的平滑 6-DoF 运动跟踪。用户头部安装的拟议多传感器设备可以实时观察用户的 6-DoF 运动。因此，当用户在现实世界中独立行走时，虚拟场景的焦点将调整以匹配真实的\
    \ 6-DoF 运动跟踪。\n\n## 实时运动跟踪\n\n实时运动跟踪是任何 AR/VR 设备的关键问题，因此有多种方法可以实现此性能。在基于标记的运动跟踪中，设备必须先检测并识别标记，然后再计算观察者的相对姿势。即使如此，标记必须提前放置在关注项目上或附近，并且在某些情况下并非总是可行。此外，标记必须在移动\
    \ AR/VR 操作期间保持可见，因为如果标记不可见，跟踪更有可能被破坏。相应地，移动 AR/VR 的另一种流行运动跟踪系统是基于模型的方法。这种跟踪方法使用要跟踪环境的先验模型。通常，这种先验知识由真实场景的\
    \ 3D 模型或 2D 模板组成。\n\n## 总结\n\n本工作提出了一种用于智能手机 AR/VR 的实时运动跟踪策略，其效果优于传统的基于视觉的无标记跟踪方法。文档中开发了一种单目视觉-惯性融合，可以在实时和稳健的姿态到达移动\
    \ AR/VR 的情况下，有效提高跟踪鲁棒性并在惯性传感器的帮助下提高帧率。此外，提出了一种自适应滤波系统，以减轻异构传感器融合中的抖动现象，可以根据各种运动情况改变滤波器权重，从而实现两种技术的实时和平滑运动监控。最终，在各种\
    \ AR/VR 场景中进行了实验，结果表明拟议的方法既稳健又准确。本文提出了一种分段自适应框架以简化计算，并获得了智能手机 AR/VR 实时运动跟踪的次优输出。即使如此，跟踪输出在分段点处会出现不稳定转换，因此未来的工作将集中于视觉-惯性融合的更连续滤波系统。\n\
    \n## 第 7 章\n\n## 使用 ARKit 和 OpenCV 的增强现实\n\nARKit 一直是 Apple 最受欢迎的 iOS 11 功能之一。每天都在开发更多创新的增强现实应用程序。在本项目中，我们将重点介绍如何使用\
    \ Apple 的 ARKit 设置您的第一个增强现实项目并在 Unity 中实现它。\n\n### 为什么使用 OpenCV 而不是 Core ML？\n\
    \n#### 支持多个平台\n\n虽然 Core ML 对于仅限 iOS 11 的 iPhone 应用可能是最佳选择，但每当您想要向后兼容或希望支持多个平台时，您将不得不为每个平台构建自定义方法或使用\
    \ OpenCV。\n\n机器学习并非适用于每个问题。虽然 Apple 为对象以及场景检测等项目提供了一些免费开源模型，但计算机视觉领域的范围远大于机器学习，而\
    \ OpenCV 是访问这些资源最方便的方式。\n\n## ARKit 和 OpenCV 集成\n\n通过委托调用，ARSession 允许直接访问当前帧数据。\n\
    \n```\n- (void)session:(ARSession *)session didUpdateFrame:(ARFrame *)frame;\n\
    ```\n\n当新帧可见时，此函数将被调用。我们可以从这里通过帧获取原始数据的 CVPixelBufferRef。虽然帧中的数据以平面 YCbCr 格式给出，但对于我们的目的，我们只需要灰度版本。我们跳过转换阶段并直接捕获\
    \ Y 帧，因为我们知道它是 YUV 格式。\n\n我们是这样做的：\n\n```\ncv::Mat mat;\n\nCVPixelBufferLockBaseAddress(buffer,\
    \ 0);\n\n//Get only the data from the plane we're interested in\n\nvoid *address\
    \ = CVPixelBufferGetBaseAddressOfPlane(buffer, 0);\n\nint bufferWidth = (int)CVPixelBufferGetWidthOfPlane(buffer,0);\n\
    \nint bufferHeight = (int)CVPixelBufferGetHeightOfPlane(buffer, 0);\n\nint bytePerRow\
    \ = (int)CVPixelBufferGetBytesPerRowOfPlane(buffer, 0);\n\nmat = cv::Mat(bufferHeight,\
    \ bufferWidth, CV_8UC1, address, bytePerRow).clone();\n\n//Rotate the frame we\
    \ receive\n\ncv::Mat rotated;\n\ncv::transpose(mat, rotated);\n\ncv::flip(rotated,\
    \ rotated,1);\n//Do what we want with the frame\n//detect faces, track objects\
    \ ect.\n\nCVPixelBufferUnlockBaseAddress(buffer, 0);\n```\n\n我们只需要 Y 帧，正如前面提到的，它保存在第一个平面中。\n\
    \n为此，我们使用平面索引为 0 的 `CVPixelBufferGetBaseAddressOfPlane` 技术，而不是标准的 `CVPixelBufferGet`\
    \ 方法。\n\n最终，由于我们获得的帧处于横向模式，我们所要做的就是在将其传递给任何 OpenCV 魔法之前旋转它。\n\n逻辑被重用了。\n\n如果您正在制作一个也支持\
    \ iOS 10 的增强现实应用，您可以通过更改 AVCaptureVideoDataOutput 的格式以适应 ARKit 来使用前面提到的方法\n\n\
    ```\n_captureOutputVideo.videoSettings = @{\n    (NSString *)kCVPixelBufferPixelFormatTypeKey\
    \ :\n    @(kCVPixelFormatType_420YpCbCr8BiPlanarVideoRange)};\n```\n\n并使用 SampleBufferRef\
    \ 来获取相同的 CVPixelBufferRef。\n\n```\nCVImageBufferRef imageBuffer =\nCMSampleBufferGetImageBuffer(sampleBuffer);\n\
    ```\n\n## 总结\n\n虽然 iOS 11（及以后版本）的安装基数一直在增加，但典型的增强现实应用程序不能仅集成 Apple 最新更新中包含的工具。然而，通过将我们从\
    \ ARKit 获得的帧数据与 OpenCV 集成，我们将能够构建看似令人信服的交互，因为它们确实使用 OpenCV 的低级实现和 ARKit 的便捷方法和\
    \ API 来增强真实。交互可以是任何内容，从身体跟踪到深度分析（图 7-1）。\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_143_0.png)\n\
    \n图 7-1. iOS 中使用 ARKit 的身体跟踪\n\n## 先决条件\n\n由于我们为 Apple 生态系统构建，因此我们需要一台 Mac 计算机来开发我们的程序和一台\
    \ iOS 设备来运行它们。\n\n## 硬件\n\n就硬件而言，需要一台兼容 macOS Catalina 的 macOS PC。强大的 Apple A12\
    \ Bionic CPU 也需要用于身体监控程序的正常运行。以下 Mac 计算机和 iOS 设备有资格参加此促销活动：\n\n| 计算机 | 移动设备 |\n\
    |---|---|\n| 12 英寸 MacBook | iPhone XS |\n| MacBook Air，2012 及以后 | iPhone XS Max\
    \ |\n| MacBook Pro，2012 及以后 | iPhone XR |\n| Mac mini，2012 及以后 | iPad Pro 11 英寸\
    \ |\n| iMac，2012 及以后 | iPad Pro 12.9 英寸 |\n| iMac Pro |  |\n| Mac Pro，2013 及以后\
    \ |  |\n\n图 7-2. 适用于此促销的 Mac 计算机和 iOS 设备\n\n## 软件\n\n要在 Mac 上运行演示，您需要安装以下应用程序：\n\
    \n- Unity3D 2019.1.5f1 with iOS build target\n- MacOS Catalina 10.15 (beta)\n\
    - Xcode 11 (beta)\n\n您的设备上应安装 iOS 13（beta）或 iPadOS 13。正如您将看到的那样，在撰写本文时，大多数程序仍处于测试阶段。请记住，设备可能会变得缓慢或不可靠，因此请采取额外的预防措施以避免丢失重要数据。\n\
    \n## 分步身体跟踪\n\n让我们开始 ARKit 魔法。在计算机上启动 Unity3D 2019.1 并开始一个新项目（图 7-3）。\n\n"

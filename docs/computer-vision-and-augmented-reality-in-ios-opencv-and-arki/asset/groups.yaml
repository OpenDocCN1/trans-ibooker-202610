    # Overview


    Augmented reality, also known as AR, is a type of technology that allows us to
    see virtual objects and details inside our visual field. We could get details
    on the objects that we can visualize with augmented reality. This improves the
    screen by incorporating real-world components. If I point my mobile at a street,
    for instance, this will provide me with additional info like the names of restaurants,
    fitness centers, physicians, and so on. A real-time combination of digital knowledge
    with the person’s world is known as augmented reality. Users can interact with
    virtual objects in their natural surroundings by using augmented reality technologies.
    A person who is wearing virtual reality glasses either uses a phone or tablet
    screen to see details regarding any objects they have been viewing.


    Three different types of AR are discussed here.'
  - '[PAGE 122]


    # Marker-Based AR


    A digital world is interconnected with the physical world. We have to know that
    the user is aiming the camera at the specific page to display an educational animation
    directly onto the paper of a journal. As a result, the system initially should
    detect which page you are viewing from the live view of the camera. It would be
    accomplished by using a unique image or form on the page. The image would be identified,
    and the animation will begin right away, tracking toward the correct location
    on the page. A user also can switch that actual book across to see if the virtual
    world adheres toward the page’s real surface. A marker is the name given to the
    recognizable image that the system identifies. Almost everything could be used
    as a marker as long as it has sufficiently distinct visual features.


    # Marker-Less AR


    The virtual objects are moved by the user. Consider an augmented reality technology
    that allows you to put virtual furniture in a sitting room. It enables us to experiment
    with different object designs, as well as location combos. A client must determine
    where to position the virtual object within such a procedure. It is referred to
    as “marker-less AR.”


    # Location-Based AR


    A virtual world exists in the real world.


    Augmented reality technology is connected to a particular location through location-based
    AR. Assume walking down a public path you’re unfamiliar with seeing a virtual
    street sign showing the street name from your smartphone camera, and that is location-based
    AR. And, much the same as our AR City application, this helps you to move toward
    the location by overlaying routes over top of the actual paths in front of you.'

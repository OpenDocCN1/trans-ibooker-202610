    源点（pts_src）是当前场景图片边缘点，而终点位置（pts_dst）是点击图片内照片框架中匹配的图片中心点。单应性函数‘h’在输入点和目标点之间是使用
    OpenCV 函数 findHomography 计算的。然后当前图片会使用单应性矩阵进行扭曲以融合到目标框架中。经过遮罩和复制的扭曲图片被粘贴到目标框架中。该阶段在剪辑中的每一帧中持续进行。


    ## 手机上基于视觉-惯性估计的无标记增强现实


    在增强现实（AR）中，真实世界环境的实时视图与计算机生成的虚拟内容相结合。移动增强/虚拟现实（AR/VR）中虚拟场景与现实世界的配准需要实时六自由度（6-DoF）运动跟踪。即使如此，由于当今移动终端有限的计算能力，连续到达位姿之间的延迟会损害移动
    AR/VR 的用户体验。移动 AR/VR 到达位姿的实时精度是通过惯性传感器提供的高频率和被动输出实现的。此外，传统仅视觉运动跟踪的鲁棒性得到了改进，从而在存在运动模糊时提高了移动
    AR/VR 效率。此外，还开发了一种自适应滤波系统，以自动应对不同的运动情况，在视觉-惯性融合期间平衡抖动和延迟，从而实现实时 6-DoF 运动跟踪。AR
    系统面临特定的障碍，例如需要高质量的相机位姿估计以及需要在资源最少的平台上运行。移动 AR 旨在在真实世界环境中以准确的位姿呈现虚拟对象。设备必须能够使用移动计算确定用户的位置和他们正在看的内容。


    另一方面，移动 VR 允许用户与虚拟世界之间进行各种交互和连接。在此，我们提出了一个完整的系统，该系统基于混合方法，使用 ORB 二进制特征和光流在消费级平板电脑上接近实时运行。因此，移动
    AR/VR 中最相关的问题之一是位姿跟踪，即实时测量用户的位置和方向。即使如此，由于移动设备的计算能力有限，移动 AR/VR 的实时运动跟踪仍然是一个瓶颈。基于标记或基于模型的方法只能在对场景有一定先验知识的情况下执行
    6-DoF 跟踪，而无标记运动跟踪可以在任何情况下运行。因此，无标记跟踪将在未来在移动 AR/VR 中变得更加普遍。


    即使如此，由于计算需求高且环境多变，实时 6-DoF 无标记运动监控在移动 AR/VR 中的适用性和鲁棒性仍需要进一步研究。设备采用自适应特征地图来增加可使用的
    ORB 特征数量。“地图”被描述为特征描述符及其 3D 世界坐标的列表。因此每个地图都有一个由四个世界坐标组成的三维边界框。一旦计算出相机位姿，该边界框就可以投影到图片帧中。


    通过集成单目相机和惯性传感器，实现了移动 AR/VR 实时基于传感器融合的 6-DoF 运动跟踪。提出了一种自适应滤波架构，以在视觉-惯性融合期间平衡抖动和延迟现象，从而实现移动
    AR/VR 的实时、平滑的 6-DoF 运动跟踪。在此，我们展示了如何通过提出平台特定的优化以及使用两种现有位姿估计算法来提高跟踪速度和范围，从而实现实时效率。如果我们想在合成
    VR 世界中建立临场感，跟踪用户的姿势也是必不可少的。借助有关用户 6-DoF 位姿的详细信息，设备将从用户的视角显示虚拟世界。同时定位与地图构建（SLAM）是一种常见的无标记跟踪方法，可以在未准备好的环境中检测移动相机的
    6-DoF 位姿，从而允许在没有基准标记的情况下使用手机 AR/VR 应用。


    ## 增强现实（AR）虚拟现实的子类


    虚拟现实（VR）有一个名为增强现实（AR）的子类。在真正的虚拟现实应用中，用户接收到的所有感官反馈都是模拟的。在增强现实中，虚拟内容与真实世界的感官反馈混合以产生环境的组合版本。它最常由当今的消费级移动设备实现。该系统能够实时运行，使用计算机视觉技术分析来自手持相机或头戴式显示器（HMD）的实时视频输入，以评估相机在
    3D 空间中的位置和方向（位姿）。利用这些位姿数据，虚拟增强可以无缝地融入真实世界的视频流中。无标记 AR 可用于更普遍和临时的应用。无标记 AR 系统不是依赖人工标记，而是利用环境中已有的自然特征。无标记
    AR 最困难的部分是通过自然特征检测和匹配来满足相机位姿估计的计算需求。该问题在手持移动设备中至关重要。设备工作所需的一切只是一个校准过的单目相机。


    几乎所有过程，包括地图制作，都是在线实时完成的，这限制了处理速度和内存。对管道的每个点，讨论了移动设备的计算限制，并使用 Android 实现来测试整个系统。当找到足够数量的良好匹配时，设备会尝试使用地图已知的
    3D 坐标和 2D 帧位置来估计相机的位姿。在决定位姿时，考虑了两种情况：来自描述符匹配的位姿和来自跟踪内点的位姿，每种对应于混合系统的模式。尽管在匹配过程中实施了各种限制和阈值，但仍可能存在误报。这样的错误匹配可能占对应关系的大部分，如果不将其丢弃，恢复的相机位姿的准确性就会受损。目标是仅使用正确的匹配来计算位姿。最大迭代次数是通过反复试验计算得出的。由于
    RANSAC 算法不是概率性的，因此相机位姿的可信度在很大程度上取决于在可能的最多迭代次数中选择四个正确点对应关系的可能性。虽然在 5000 次迭代后找不到内点的风险微乎其微，但运行时间会过长。


    在地图修改后，最后一步是将恢复的位姿返回给 OpenGL，在那里它将被用于生成模型视图矩阵。任何 3D 增强都可以使用从准确相机位姿获得的模型视图矩阵绘制。有了足够的
    3D 绘图知识，人们可以创建与真实环境融合的复杂增强。我们的系统算法与其他候选算法进行了比较，特别关注执行速度。笔记本电脑测试是为了解释效率差距而进行的


    '

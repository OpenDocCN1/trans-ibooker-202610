    \n```\n97  // Display FPS on frame\n98  putText(frame, \"FPS : \" + SSTR(int(fps)),\
    \ Point(100,50),\n99  FONT_HERSHEY_SIMPLEX, 0.75, Scalar(50,170,50), 2);\n100\
    \ \n101  // Display frame.\n102  imshow(\"Tracking\", frame);\n103 \n104  // Exit\
    \ if ESC pressed.\n105  int k = waitKey(1);\n106  if(k == 27)\n107  {\n108   \
    \   break;\n109  }\n110 }\n111 }\n```\n\nFinally, the frame is displayed on the\
    \ screen after the tracking is complete and the bounding box is created. The imshow\
    \ function handles displaying the fully rendered frame in the user interface.\
    \ And the if statement handles when the exit key is pressed to cancel the tracking.\n\
    \nWe’ll look at a few various tracking algorithms throughout this portion. The\
    \ aim is to gain real knowledge of each tracker, rather than a piece of deep theoretical\
    \ knowledge.\n\nTo begin, I’ll go through some basic tracking concepts. Our aim\
    \ of tracking will be to locate an object throughout a current frame after accurately\
    \ tracking it in (or approximately all) prior frames. A motion model seems to\
    \ be simply a nice way of saying that you know the object’s position and velocity\
    \ (velocity + direction of movement) in subsequent frames. We can estimate a new\
    \ position depending on the present motion model unless we are unable to detect\
    \ or analyze the object; therefore it is essential to be relatively familiar what\
    \ the object is to detect where it is in realtime. You may create an appearance\
    \ model that describes how the object appears. To more accurately predict the\
    \ position of the object, this appearance model could be utilized to search within\
    \ a tiny neighborhood of the motion model’s predicted location. Positive (object)\
    \ and negative (context) instances are fed to a classifier to train it. Let us\
    \ just take a look at how different tracking algorithms solve the online training\
    \ issue.\n\n## BOOSTING Tracker\n\nThis tracker is based on an online version\
    \ of AdaBoost, which is the internal algorithm of the Haar cascade-based face\
    \ detector. This classifier must be conditioned for both positive and negative\
    \ instances of the object during runtime. The classifier is run with each pixel\
    \ in the vicinity of the previous position in a new frame, and the classifier’s\
    \ score is registered. The object’s new position is the one with the highest score.\
    \ As a result, we now have yet another positive example for the classifier. Since\
    \ more frames are received, the classifier is modified with the new information.\n\
    \nAdvantages: Its algorithm is over a decade old and still works, but I couldn’t\
    \ think of a better purpose to do it while there are other specialized trackers\
    \ (MIL, KCF), which operate along with similar principles.\n\nDisadvantages: Output\
    \ in terms of tracking is mediocre. It doesn’t always understand whenever tracking\
    \ isn’t working.\n\n## MIL Tracker\n\nIt is similar to the BOOSTING tracker. The\
    \ major difference is that, rather than finding just the object’s current position\
    \ as a positive example, this searches a small community surrounding the current\
    \ location for many possible positive examples. You don’t specify positive and\
    \ negative examples in MIL; instead, you specify positive and negative “packs.”\
    \ The positive bag’s array of photographs isn’t entirely made up of positive examples.\
    \ Instead, just one picture from the optimistic bag must be a good illustration!\
    \ A positive pocket, in our example, contains a patch based on the object’s current\
    \ position as well as patches from a small community around it.\n\nAdvantages:\
    \ The result is excellent. It does not drift even more than the BOOSTING tracker,\
    \ so this performs admirably when partially obscured. This might be the better\
    \ tracker accessible unless you’re using OpenCV 3.0. However, if you’re using\
    \ a later version, KCF is a good option.\n\nDisadvantages: The error of tracking\
    \ is not accurately recorded. After a complete occlusion, it does not heal.\n"
  mdcn: "\n\n# OpenCV Tracking API\n\nOpenCV 4 包含一个跟踪 API，具有多种配置用于单个目标跟踪算法。BOOSTING、MIL、KCF、TLD、MEDIANFLOW、GOTURN、MOSSE\

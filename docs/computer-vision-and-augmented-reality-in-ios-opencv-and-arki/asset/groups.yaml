    # Computer Vision Algorithms


    The technique used to classify or identify photographs is typically represented
    in a set of data points that is used to predict a specific category. Image labeling
    is a classification sub-problem in which a whole picture is labeled a category.
    Using the image labeling technique, a human manually labels the whole image with
    a set of categories. Once we have a set of data with labeled images, we can apply
    a matching algorithm to compare a new non-labeled user inputted image with the
    dataset we have. Once a matching or similar labeled image is found, we return
    the appropriate set of categories.


    There are countless groups in which you can classify a particular picture. Consider
    a manual procedure in which images are matched and identical images are sorted
    by like characteristics, but without understanding what you are looking for in
    advance. This is an onerous assignment, clearly. To make it more clear, presume
    that there are hundreds of thousands of images. In order to do this effectively,
    it is immediately obvious that an automated system is needed.


    A number of tasks for classifying images require photography of objects. CIFAR-10
    and CIFAR-100 are two common datasets, with pictures to be classified, respectively,
    into 10 and 100 groups. These datasets are industry standard and are available
    for the public domain.


    # Image Classification in Deep Learning


    The architecture for deep photography recognition usually contains convolutional
    layers, becoming a Neural Network that is convolutional (CNN). For CNNs, it is
    common to have images on the network and details are divided into network categories.
    CNNs start with an input “scanner,” and not all training data are parsed simultaneously.
    For example, you would not want a 10,000-node layer to process an image of 100
    × 100 pixels. Instead, you create a 10 × 10 Input Layer that accepts the first
    10 × 10 image'

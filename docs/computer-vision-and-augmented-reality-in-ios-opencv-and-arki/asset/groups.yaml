    In a color digital image, a pixel value must be specified in three colors – red,
    green, and blue – which represents an RGB color space. Thus, the pixel value is
    represented as a vector of three numbers where each number ranges from 0 to 255.
    As the number increases, the brightness of each color increases, also referred
    to as color intensity. For example, if a given pixel value is (255, 255, 255),
    this means the red, green, and blue intensities (or brightness) are set to their
    highest value, which defines a white pixel (see Figure 1-3).


    | Red Intensity | 0 | 255 | 255 | 0 | 0 |

    | Green Intensity | 0 | 255 | 0 | 255 | 0 |

    | Blue Intensity | 0 | 255 | 0 | 0 | 255 |



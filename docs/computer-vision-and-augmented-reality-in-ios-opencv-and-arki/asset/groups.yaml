    \n图 5-15. 可在此处看到上下均包含字幕的条形码\n\n## 利用 C++，扫描和读取条形码\n\n让我们看看如何使用 Aspose.BarCode\
    \ for C++ 来扫描和读取条形码。使用此功能的过程如下：\n\n- 从 Barcode Reader 类创建一个实体。\n- 创建一个包含条形码及其符号的图片文件的\
    \ Barcode Reader 示例。\n- 使用 Barcode Reader->Read () 工具获取条形码的文本或形式。\n\n以下编程示例演示了如何在\

    +   - Then we use this training package to teach a classifier how to classify
    the images.

    +   - Finally, we measure the classifier’s output by telling it to infer labels
    for a new series of images it has never seen before. The actual labels of these
    images would then be equivalent to the ones projected by the classifier.



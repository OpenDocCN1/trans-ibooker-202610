    Data augmentation methods are among the most commonly used, and one easy-to-introduce
    technique in image/data augmentation is rotation (Figure 4-5). Using this technique,
    we will be able to build more examples for our deep learning training model. Data
    augmentation uses the samples of data available and builds new copies of them
    using rotation and translation.


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_66_1.png)


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_66_2.png)



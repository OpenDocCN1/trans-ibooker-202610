    AND, OR, XOR, and NOT are bitwise operations. These operations are very helpful
    and used together with masking when we want to remove an area we wish from an
    input image (Figure 4-6).


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_67_0.png)


    Figure 4-6. Bitwise Operations


    We can measure the segmented mask in the image with the use of the watershed algorithm
    and see the image provided by us after we use the bitwise “AND” operation to eliminate
    the backdrop of the image and take the region we need.


    # Detect the Edges


    Edges are very useful image features, which can be used for various purposes,
    such as image recognition and positioning of objects. The edge characteristics
    of the objects in the picture can be determined also by deep research models.
    They are also used to sharpen an image (Figure 4-7).'

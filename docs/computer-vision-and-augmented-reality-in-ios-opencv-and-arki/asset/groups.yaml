    To blur images, we use the Gaussian filter, which gives the neighboring pixels
    different weights depending on their distance from the pixel being considered
    (Figure 4-8).


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_68_2.png)


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_68_3.png)



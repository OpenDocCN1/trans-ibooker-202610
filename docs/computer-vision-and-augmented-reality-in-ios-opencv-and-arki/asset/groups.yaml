    # Proposed Adaptive Visual-Inertial Approach


    The proposed adaptive visual-inertial approach has several advantages. Furthermore,
    tracking stability can be enhanced when suffering from motion blur or poor texture,
    as per credible pose estimate by IMU within a brief period. A quantitative experiment
    is conducted to further validate the proposed procedure. The ground truth for
    the proposed approach is the trajectory obtained from the typical target pattern,
    which is known to have high accuracy. The smartphone AR is prone to collapsing
    based solely on visual-based motion tracking due to the incredible blurred picture.
    Even so, the tracking loss phenomena caused by fast motion blur can be alleviated
    using the proposed sensor fusion–dependent tracking method.


    VR helps the user to communicate with the virtual world in a variety of ways.
    As a result, real-time monitoring of the user’s postures and behaviors is crucial
    for a VR device. Furthermore, the frame rate for motion tracking in VR is higher
    than that of AR. Alternatively, the consumers will become ill as a result of the
    latency phenomenon. A smooth 6-DoF motion tracking for cellular VR could be accomplished
    in real time using the proposed adaptive visual-inertial fusion process. The 6-DoF
    motion of the user can be observed in real time using the proposed multi-sensor
    device installed on the user’s head. As a result, when the user walks independently
    in the real world, the virtual scene’s focus will adjust to match the real 6-DoF
    motion tracking.


    # Real-Time Motion Tracking


    Real-time motion tracking is a critical issue for any AR/VR device, so there are
    a variety of ways to achieve this performance. In marker-based motion tracking,
    the device must first detect and recognize the marker before calculating the observer’s
    relative pose. Even so, the marker must be placed on or near the item of concern
    ahead of time, and it is not always possible to do so in some cases. Furthermore,
    the marker must stay'
  - '[PAGE 139]


    noticeable throughout the mobile AR/VR operation, as tracking is more likely to
    be corrupt if the marker is not visible. Correspondingly, another popular motion
    tracking system for mobile AR/VR is the model-based method. This tracking method
    uses a prior model of the environment to be tracked. Usually, this prior knowledge
    consists of 3D models or 2D templates of the real scene.


    # Summary


    This work presented a real-time motion tracking strategy for smartphone AR/VR
    that is more effective than conventional visual-based marker-less tracking approaches.
    A monocular visual-inertial fusion is developed in the document that could effectively
    boost the tracking robustness and enhance frame rate with the aid of an inertial
    sensor, given the real-time and robust posture arriving for mobile AR/VR. Moreover,
    an adaptive filter system is proposed to mitigate the jitter phenomena in heterogeneous
    sensor fusion that can change the filter weight as per various motion circumstances,
    resulting in real-time and smooth motion monitoring for both technologies. Eventually,
    experiments are done in various AR/VR scenarios, and the outcomes indicate that
    the proposed approach is both robust and accurate. A segmented adaptive framework
    is presented in this article for a simplifying calculation, and a suboptimal output
    for real-time motion tracking for smartphone AR/VR is obtained. Even so, unstable
    transitions occur at the segmented point in tracking output, so future work will
    focus on a more continuous filtering system for visual-inertial fusion.'

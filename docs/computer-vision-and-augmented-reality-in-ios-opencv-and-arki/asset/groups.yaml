    \n图 5-14. 可自定义 Aztec 条形码\n\n## 利用 C++，创建带字幕的条形码\n\n字幕可以出现在条形码下方或上方。条形码图片中字幕的内容和外观也可以自定义。以下代码示例说明了如何在\

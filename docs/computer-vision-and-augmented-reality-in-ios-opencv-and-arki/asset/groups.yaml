    Template Matching Algorithm


    Image Credits: Racool_studio/Freepik.com


    # Figure 1-4. Template Matching Abstract Example


    Figure 1-4 demonstrates a sample result of a template matching algorithm.


    # An Overview on How Computer Vision Works


    In order for a computer to perform a vision task, such as face detection, it requires
    performing several smaller tasks to reach the target task. For example, in order
    to perform a vision task, a computer typically has to perform various digital
    image preprocessing techniques, such as grayscale manipulation, edge enhancement
    and detection, noise removal, image restoration, interpolation, and image segmentation.
    Image preprocessing is the first stage in every vision task, and it plays a significant
    role to have a successful outcome. The purpose of preprocessing is extracting
    the valuable parts in a given image and getting rid of unwanted distortions.


    The valuable parts help in developing useful descriptions of pixels, shapes, and
    surfaces in a given image. As we mentioned earlier, a pixel value is defined by
    either a 1-byte integer (when it is in a grayscale image) or a vector of integers
    representing an RGB color space (when it is in a color image); and each pixel
    value has a different intensity level representing the brightness of the color.
    The changes of intensity in a given image provide clues about the structure of
    shapes and surfaces in the image.


    In the preprocessing stage, we try to extract this information without any knowledge
    of the contents of an image using techniques, such as noise removal, edge enhancement,
    and image segmentation. Noise removal is the process of smoothing an image to
    reduce and eliminate unwanted noise/distortion. However, sometimes noise removal
    techniques end up blurring the image; in this case, edge enhancement techniques
    come in handy. Edge enhancement helps with improving the sharpness of the edges
    in an image by increasing the intensity level difference between the boundaries
    of two regions (see Figure 1-5).


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_16_0.png)


    Figure 1-5. Edge Enhancement/Detection Example


    The image on the left is the original image. The image on the right is the resulting
    image after applying an edge enhancement technique. As you may have noticed, the
    right image appears to “outline” the edges of the dog, which can be used in various
    vision tasks, such as image classification.


    Image segmentation is the process of separating an image into smaller parts called
    segments. Segments are used to process the parts of an image separately, because
    in many cases an image has more than just one unique object or feature that can
    help identify the contents of the image. Image segmentation is considered an intermediate
    step between preprocessing and processing an image for object detection or segment
    classification (see Figure 1-6).


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_17_0.png)


    Figure 1-6. Abstract Computer Vision Pipeline


    After preprocessing a digital image, the processing steps begin, and in many cases,
    it may involve techniques such as feature extraction, texture analysis, and pattern
    recognition. Depending on each vision task, you would pick the more relevant technique
    to perform the task. For example, to perform an image classification task, you
    would use a feature extraction technique to extract unique features in the segments
    of a given image. The segments of an image are extracted during the image segmentation
    process. Once the unique features are extracted from the image segments, they
    are used to find a distinct pattern matching predefined or labeled image segments;
    a labeled image segment is a piece of an image that is manually defined under
    human supervision (Figure 1-7).


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_17_1.png)


    Figure 1-7. Labeled Image Segments Example


    The process of finding an exact match to a labeled segment is called feature matching;
    and the process of finding a distinct pattern is called pattern recognition. Figure
    1-6 demonstrates an abstract Computer Vision pipeline and what a given image has
    to typically go through when a computer is performing a vision task. Further details
    on different image processing techniques will be covered throughout the book.



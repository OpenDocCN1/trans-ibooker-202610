  - '[PAGE 11]


    # CHAPTER 1


    # Introduction to

    Computer Vision


    This chapter will focus on what computer vision is, why we need it, the evolution
    of the technology, its different applications, and how it is used in Augmented
    Reality.


    # What Is Computer Vision?


    Vision is the ability to analyze and interpret scenes and objects of interest.
    Human vision has been studied for hundreds of years to understand how the visual
    process works. The human visual process is one of the most complex processes to
    understand. In fact, to this day, vision scientists have not yet found a complete
    answer to how the visual process works. However, vision scientists’ discoveries
    on how the human visual process begins and a little beyond that inspired computer
    scientists to develop what we know today as Computer Vision. Vision researchers
    and scientists describe that the visual process begins with the eyes processing
    signals of light and converting them into scenes and images for the brain’s visual

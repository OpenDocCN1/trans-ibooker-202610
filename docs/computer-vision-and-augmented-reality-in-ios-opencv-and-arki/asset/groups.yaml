    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_58_0.png)


    # Figure 3-12. Convolutional Network Pipeline


    # Summary


    This chapter covers basic math for computer vision including linear algebra and
    multivariable calculus. It also covers why to study computer vision. The standard
    algorithms covered in this chapter are image classification, object detection,
    instance segmentation, and object tracking. It also covers how a computer reads
    an image.


    Image classification is the process of categorizing and labeling groups of pixels
    or vectors within an image based on specific rules.


    Object detection is a computer vision technique that allows us to identify and
    locate objects in an image or video.


    Semantic segmentation describes the process of associating each pixel of an image
    with a class label (such as flower, person, road, sky, ocean, or car).


    In the upcoming chapter, we will discuss facial detection/recognition and body
    detection / tracking.'

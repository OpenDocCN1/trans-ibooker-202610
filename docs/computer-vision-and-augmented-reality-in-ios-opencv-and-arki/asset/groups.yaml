  - '[PAGE 72]


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_72_0.png)


    Figure 4-10. Object Recognition/ Detection


    # Object Detection Types


    Goal recognition can typically be divided into machine learning approaches and
    deep learning approaches.


    Computer vision techniques are used to identify classes of pixels, which may belong
    to an object, using traditional machine learning-based approaches to analyze various
    properties of an image, such as a color histogram or boundaries. These characteristics
    are then integrated into a regression model that predicts the location and name
    of the entity.


    Deep learning approaches, however, are based on Convolutional Neural Networks
    (CNNs) for the purposes of identification of artifacts that have to be extracted
    separately.'
  - '[PAGE 73]


    As deep learning approaches have become the modern methods of object recognition,
    these are the techniques that we will focus on for the purposes of this implementation.


    # Importance of Object Detection


    Object ID is inextricably associated with other related computer vision techniques,
    such as pattern recognition and image segmentation, that help us to identify and
    perceive image or video scenes.


    Nevertheless, there are underlying differences. Image detection only creates a
    class label for a detected object, and image segmentation provides a pixel-level
    description of the components of a scene. Object recognition is separated from
    these other practices by possessing the unique ability to recognize objects within
    an image or video. This then allows you to count those objects and map them with
    the unique ability to recognize certain primary distinctions; we can see how it
    can be incorporated in a variety of ways:


    +   - Counting audience

    +   - Cars self-driving

    +   - Surveillance recording

    +   - Detection of the mask


    # Detection of Anomaly


    This is obviously not a complete list, but it includes some of the main issues
    through which object recognition impacts our future.'
  - '[PAGE 74]


    # Object Tracking


    In any given scene, this applies to tracking one or more moving objects (Figure
    4-11). This has historically been implemented after the original object has been
    observed to track real-world encounters. It is a very significant part of self-driving
    vehicles that will be launched by companies such as Uber and Tesla. It is possible
    to break object detection into two categories: generative and biased. The generative
    approach would describe visible features and minimize reconstruction errors in
    the hunt for the subject.


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_74_0.png)


    Figure 4-11. Object Detection Bounding Boxes


    The discriminatory process is more efficient and accurate. It can be used to tell
    the difference between the issue and the meaning and has been the preferred way
    of monitoring. It goes with the name tracking by detection.'
  - '[PAGE 75]


    # Semantic Segmentation


    The method of agglomerating portions of an image that fall under the same object
    class is called semantic separation or image segmentation. Each pixel of the image
    has a sort of pixel preview since it is categorized by category. Cityscapes, PASCAL
    VOC, and ADE20K are among the standards for this mission. Mean IoU and pixel precision
    metrics are commonly used in testing models. The mean IoU is used to test models.
    More precisely, the purpose of semantic image segmentation is to mark what is
    depicted in each pixel of an image a corresponding class. This method is widely
    referred to as dense prediction, since we forecast for each pixel in the image.


    One important point to remember is that instances of the same class are not separated;
    we think just for the type of each pixel. In other words, if you have two objects
    in the same group in your input image, they are not automatically distinguished
    as separate objects by the segmentation map. A different type of model exists,
    known as example segmentation model, which discriminates between distinct objects
    of the same class.


    For a number of activities, segmentation models are helpful.


    # Vehicles That Are Automatic


    In order for self-driving cars to fit safely into our current highways, we need
    to equip cars with the requisite perception to consider their surroundings.


    # Medical Diagnostic Picture


    Machines will improve the research carried out by radiologists, significantly
    decreasing the time needed for diagnostic testing to be carried out (Figure 4-12).'
  - '[PAGE 76]


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_76_0.png)


    Figure 4-12. Sample Segmented Image


    # Instance Segmentation


    For each recognized object within an image, instance segmentation distinguishes
    each instance of an object.


    Segmentation of instances assigns a mark to each image pixel. It is used to count
    the number of items in a given image for tasks like image segmentation.


    # Requirements


    The objective here of object detection is to identify specific objects and to
    place a bounding box for each entity example.


    Each example is segmented. The goal is to define every pixel in a fixed set of
    categories without distinguishing object instances.


    Mask R-CNN is a deep learning technique that expands on R-CNN by focusing more
    on instance segmentation.


    What’s new about R-CNN and faster R-CNN?


    Mask R-CNN has another branch for predicting the segmentation of pixels to pixels
    in every field or region of interest (ROI).


    R-CNN does not synchronize the input network pixels for higher speed. R-CNN produces
    two outputs faster:


    +   - Class symbol

    +   - Each applicant’s offset bounding box'
  - '[PAGE 77]


    Three outputs of mask R-CNN are


    +   - Class symbol

    +   - Each applicant’s offset bounding box

    +   - Mask object


    Mask R-CNN and faster R-CNN branches, for grouping and regression of boundaries
    are found here.


    To delete the image feature, we may use the ResNet 101 deep learning architecture.


    Both use the network zone proposal to establish a field of interest (RPN).


    # Work on Image Reconstruction


    Imagine that you have an old snapshot and, over time, pieces have begun to erode.
    This is a very valuable photo, so you’d like to recover it. That’s the restoration
    of pictures. In order to come up with corrupted copies of images that the models
    have to learn to restore and enhance, the datasets would normally contain existing
    pictures. With businesses such as IBM and Pinterest leading the way, both sectors
    are investing heavily in computer vision research. It is still important to remember
    that given all the strength of computer vision, since it is infamous for its black-box
    decision making, there are still remaining security issues. This is where people
    are suspicious of computers that use information to forecast their every move
    and make decisions on matters such as their credit risk, health status, and many
    other human choices. Nevertheless, with the fast growth of AI and security requirements,
    we should hope to address certain issues to remedy our privacy concerns.'
  - '[PAGE 78]


    # Implementing Vision Applications


    # A) Face Detection/Recognition


    The program here makes use of the OpenCV library for detecting a face in a web
    cam feed or even a video clip saved locally. The code here recognizes or monitors
    faces in live time. It accomplishes this with the aid of pre-trained XML classifiers.
    Facial features have been programmed into the classifiers used in this program.
    To detect various objects, classification techniques could be utilized.


    To run a program, you’ll need to do the following:


    +   1. On the local computer, OpenCV must be configured.

    +   2. Before the program can be run, the paths to the classifier XML files must
    be defined. The OpenCV location “OpenCV/data/haarcascades” contains these XML
    files.

    +   3. When capturing, utilize “0” as the value. To run the web cam stream, type
    open (0).

    +   4. Provide the path to the video file to use in face detection, (capture.open(“path
    to video”)), for example.'
  - "[PAGE 79]\n\n# Implementation\n\n```\n// CPP program to detects face in a video\n\
    \n// Include required header files from OpenCV directory\n#include \"/usr/local/include/opencv2/objdetect.hpp\"\
    \n#include \"/usr/local/include/opencv2/highgui.hpp\"\n#include \"/usr/local/include/opencv2/imgproc.hpp\"\
    \n#include <iostream>\n\nusing namespace std;\nusing namespace cv;\n\n// Function\
    \ for Face Detection\nvoid detectAndDraw( Mat& img, CascadeClassifier& cascade,\n\
    CascadeClassifier& nestedCascade, double scale );\nstring cascadeName, nestedCascadeName;\n\
    \nint main( int argc, const char** argv )\n{\n    // VideoCapture class for playing\
    \ video for which faces to be detected\n    VideoCapture capture;\n    Mat frame,\
    \ image;\n\n    // PreDefined trained XML classifiers with facial features\n \
    \   CascadeClassifier cascade, nestedCascade;\n    double scale=1;\n\n    // Load\
    \ classifiers from \"opencv/data/haarcascades\" directory\n    nestedCascade.load(\
    \ \"../../haarcascade_eye_tree_eyeglasses.xml\" );\n```\n\nIn this part of the\
    \ code, you need to include required header files from the OpenCV directory and\
    \ load classifiers.\n\n```\n// Change path before execution\ncascade.load( \"\
    ../../haarcascade_frontalcatface.xml\" );\n```\n\nAfter that, change the path\
    \ in “cascade.load” before executing it."

  - '[PAGE 95]


    # CHAPTER 5


    # Custom Object

    Tracking


    In this chapter how to track moving and stationary objects is covered in real
    time using downscaled picture details through measuring the period averaging background
    scene.


    # Overview


    While working through a clip stream rather than single static pictures, we frequently
    have a specific object or items in mind to track across a visual field.


    The basic issue of tracking in computer vision occurs in one of the two types;
    you will either be tracking previously identified objects or tracking unknown
    objects, across many scenarios, recognizing them depending on their movement.


    There’s also the issue of modeling moreover in tracking. At their finest, tracking
    strategies send us messy estimates of an object’s actual location from frame to
    frame (Figure 5-1). Modeling helps us overcome this. In measuring a trajectory
    of an object evaluated messily, several effective mathematic methodologies have
    been made. Such strategies may be used to create two-dimensional or three-dimensional
    representations of objects as well as their positions.'
  - '[PAGE 96]


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_96_0.png)


    Figure 5-1. Object Tracking


    # Real-Time Object Tracking


    The topic illustrates how to use a conventional web cam to track moving or fixed
    objects in real time. As objects begin to display, a simple method of tracking
    would be to compare the pre-specified background picture to an identical background
    frame. Such a situation operates within fixed environments in which you can understand
    a background picture despite having to track any foreground objects, for example,
    indoors, landings, workplaces, markets, workshops, and so on. If a paper moves
    or stays fixed in such a scenario across a longer length of time, one should treat
    it as if it is already a portion of a scenario as well as superimpose the picture
    toward the background to prevent additional detections. If a background object
    is eliminated by a scenario, the same applies. A lack of lighting and the need
    to adjust the cam location are both disadvantages of this method. You’ll have
    to measure the latest background again in this scenario. A further option is to
    utilize edge operators for reducing adjustments in illumination. If you want to
    describe the object’s body rather than only the outlines, you’ll have to write
    some extra code.'

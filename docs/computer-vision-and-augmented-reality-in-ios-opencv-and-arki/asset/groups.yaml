    # The Evolution of Computer Vision


    In 1959, a neurophysiology research conducted a couple experiments on a cat’s
    visual system. The experiments placed electrodes in the main visual cortex of
    a cat’s brain, and the researchers observed the neural response of the visual
    cortex as they presented various images to the cat (Figure 1-8).'
  - '[PAGE 21]


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_21_0.png)


    # Figure 1-8. Hubel and Wiesel’s Experiment


    As the experiments went on, the researchers noticed a pattern in the cat’s neural
    response when presented with a new image. The research concluded that there are
    simple and complex neurons in the visual cortex. And the visual process begins
    by detecting the simple structures and edges of an image to help build up a more
    detailed interpretation. As the visual information becomes more complex, the visual
    cortex depends on the complex neurons to interpret the remaining details of an
    image. This research later became to be one of the most influential research in
    the field of Computer Vision. It inspired Computer Vision researchers to achieve
    what is known today as image preprocessing.


    In July of 1966, Seymour Papert, a professor at the Artificial Intelligence Lab
    at Massachusetts Institute of Technology (MIT), initiated “The Summer Vision Project.”
    The project was assigned to undergraduate MIT students to develop pattern recognition
    technology in an attempt to enable machines to see. The project was a very optimistic
    plan to develop what we know today as Computer Vision in one summer. There were
    various attempts in the 1960s to develop a computer visual system; however, researchers
    eventually came to realize that such a project would require years, if not decades,
    to achieve. And here we are, 50 years later, and Computer Vision is still in the
    research and development phases.'
  - '[PAGE 22]


    Since the 1960s, Computer Vision has evolved to the technology we see in many
    applications today. One of the pioneering research in computer vision was in the
    1970s, where the research focused on object recognition. The initial iteration
    of object recognition was abstract and simple to prove the concept of object recognition.
    The implementation used the line joints of simple objects, such as cylinders and
    cubes, to identify them. In the following decades, researchers and engineers developed
    the core techniques of traditional computer vision, which consists of two principal
    stages:


    +   1. Image preprocessing

    +   2. Image processing


    The image preprocessing stage focuses on enhancing image colors and edges to help
    in detecting simple structures in a given image. The processing stage uses the
    preprocessed image to perform one or more of the following processing techniques:


    +   - Image compression

    +   - Image enhancement

    +   - Image restoration and reconstruction

    +   - Pattern matching and recognition


    Although traditional image processing techniques such as the ones listed previously
    have been used for decades since their development, there have been a few problems
    these techniques alone would not solve, such as recognizing objects in a significantly
    unusual or unexpected context, such as handwritten words, digits, and images of
    objects captured from an unusual angle (Figure 1-9).'

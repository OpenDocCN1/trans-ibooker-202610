    ## 增强现实中的计算机视觉


    增强现实（AR）是一种通过摄像头实时画面在物理世界中增强或显示数字对象的技术。为了在物理世界中显示数字对象，我们需要实时理解和检测物理世界中的对象。在某些情况下，对象可以是特定的模板。在其他情况下，它可以是水平表面，例如桌子和地板，或者是垂直表面，例如墙壁和门。为了能够检测对象和表面，我们需要使用计算机视觉技术在物理世界中显示数字对象。增强现实主要有三种类型：基于标记、免标记和基于地理位置的增强现实。基于标记的
    AR 需要预定义的模板来在上面显示数字对象。例如，书或杂志中的一页可以有一个特殊图标，当摄像头检测到该图标时，它会在图标或页面上映射并显示一个数字对象（图
    1-11）。


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_28_0.png)


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_28_1.png)



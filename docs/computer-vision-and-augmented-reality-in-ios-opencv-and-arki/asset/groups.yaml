  md: "\n## Face Tracking in ARKit 3\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_152_0.png)\n\
    \nFigure 7-6. Face Tracking in ARKit 3\n\n### User Level: Basic\n\nAugmented Reality\
    \ has provided us with the ability to develop interactive and exciting opportunities\
    \ for mobile technology users since its introduction to the industry. AR can save\
    \ our time in a variety of ways, including checking out how our ideal sofa will\
    \ look in our apartment, determining if the chosen paint color would suit the\
    \ interior, and even instantly trying on new makeup.\n\nFace tracking is a strong\
    \ feature of ARKit 3 on iPhone X and newer. We can quickly create applications\
    \ for trying on jewelry, lipstick, or glasses with the right components. We'll\
    \ concentrate on the last choice in this example: creating an AR app for trying\
    \ on glasses with a simple frame color shift.\n\n## Setup and Specifications for\
    \ ARKit 3\n\nSince the A11 Bionic chip introduced in the iPhone X is needed for\
    \ AR face tracking with ARKit 3, we'll need this system or one that's newer to\
    \ make our example work. We'll need Unity 2019.1 or later for our project\n\n\
    to take advantage of all of ARKit 3’s functionality, such as multiple-face tracking.\
    \ We’ll need to install the required ARKit packages after we’ve built our project.\
    \ Since ARKit for Unity has been included in the ARFoundation bundle since July\
    \ 2019, we’ll need to open the Package Manager from the Window menu and install\
    \ the following packages:\n\n- 1. ARFoundation\n- 2. AR Subsystems\n- 3. AR Face\
    \ Tracking for all the required face tracking scripts\n- 4. XR Legacy Input Helpers\
    \ for the Tracked Pose Driver script\n\nIt’s a great idea to move the project\
    \ to the iOS platform and set the player configuration after the installation.\
    \ Set the Target minimum iOS Version to 11.0 in the Player Settings window, as\
    \ ARKit 3.0 needs a minimum SDK version of 11.0.\n\nChoose ARM64 from the Architecture\
    \ dropdown in the same window, as ARKit only supports 64-bit devices. You’ll also\
    \ need to specify the Camera Usage Description, which is the script that will\
    \ appear when the app requests approval to use the system camera. You can change\
    \ the text to whatever you want, such as “ARKit 3 Face Detection.”\n\n## Session\
    \ Objects in Augmented Reality\n\nWe can begin creating the requisite AR Session\
    \ objects once the project has been properly set up. Initially, we make an ARSession\
    \ GameObject in our scene and add two scripts to it: an AR Session script and\
    \ an AR Input Manager script.\n\nThen, with an AR Session Origin script and an\
    \ AR Face Manager, we create an AR Session Origin object. Since ARKit seldom uses\
    \ the device’s frontal camera – it’s only used in face tracking/identification\
    \ scenarios –\n\nthe Face Manager script is critical. There’s an empty field for\
    \ a Camera script in the AR Session Origin.\n\nLet us just place the Main Camera\
    \ object inside the AR Session Origin object and then reference it in the AR Session\
    \ Origin script. Three scripts will be required:\n\n- Pose Driver with Tracking\
    \ (in the Tracked Pose Driver, change the Pose Source to Color Camera and enable\
    \ Use Relative Transform)\n- AR Camera History\n- AR Camera Manager\n\nHave you\
    \ found how there’s an empty field for a Face Prefab in the AR Face Manager in\
    \ the AR Session Origin script? That’s the prefab we’ll use to imagine our AR\
    \ Face-based glasses.\n\n## Prefab AR Glasses\n\nWe will need to make a new GameObject,\
    \ which we named GlassesPrefab. The very first thing we need to do with our prefab\
    \ is attach two components to it. The first is an ARFace variable, which will\
    \ provide us with face point data that has been identified. The second is ARGlassesController,\
    \ a script that will be in charge of positioning the glasses based on data updated\
    \ by ARFace.\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_155_0.png)\n\n### Figure\
    \ 7-7. ARFace Application\n\nAfter that, we’ll need to build a GameObject within\
    \ the prefab that will be attached to our glasses mesh, which we’ll manipulate\
    \ using the ARGlassesController. The prefab’s final form should resemble that\
    \ shown in the preceding image. The manipulated mesh must be saved as a child\
    \ object inside our prefab. The ARFaceManager controls the location of the prefab,\
    \ and the ARFace vertices are local points for features related to the detected\
    \ face.\n\n## ARGlassesController Class\n\n```\nusing UnityEngine;\nusing UnityEngine.XR.ARFoundation;\n\
    using UnityEngine.XR.ARSubsystems;\n\n[RequireComponent(typeof(ARFace))]\npublic\
    \ class ARGlassesController : MonoBehaviour\n{\n    [field: SerializeField]\n\
    \    public static ARGlassesController Instance { get; private set; }\n\n    [field:\
    \ SerializeField]\n    public Transform ModelTransform { get; private set; }\n\
    \n    [field: SerializeField]\n    public Material FrameMaterial { get; private\
    \ set; }\n\n    private ARFace ARFaceComponent { get; set; }\n\n    private const\
    \ string MATERIAL_COLOR_SETTING_NAME = \"_Color\";\n    private const int AR_GLASSES_PLACEMENT_VERTICE_INDEX\
    \ = 16;\n\n    public void ChangeFrameColor (Color color)\n    {\n        if (FrameMaterial\
    \ != null)\n        {\n            FrameMaterial.SetColor(MATERIAL_COLOR_SETTING_NAME,\
    \ color)\n        }\n    }\n\n    protected virtual void Awake ()\n    {\n   \
    \     if (Instance == null)\n        {\n            Instance = this;\n       \
    \ }\n    }\n```\n\n```\nARFaceComponent = GetComponent();\n}\n\nprotected virtual\
    \ void OnDestroy ()\n{\n    Instance = null;\n}\n\nprotected virtual void OnEnable\
    \ ()\n{\n    ARFaceComponent.updated += TryToUpdateModelStatus;\n    ARSession.stateChanged\
    \ += TryToUpdateModelStatus;\n    TryToUpdateModelStatus();\n}\n\nprotected virtual\
    \ void OnDisable ()\n{\n    ARFaceComponent.updated -= TryToUpdateModelStatus;\n\
    \    ARSession.stateChanged -= TryToUpdateModelStatus;\n}\n\nprivate void TryToUpdateModelStatus\
    \ (ARFaceUpdatedEventArgs eventArgs)\n{\n    TryToUpdateModelStatus();\n}\n\n\
    private void TryToUpdateModelStatus (ARSessionStateChangedEventArgs eventArg\n\
    {\n    TryToUpdateModelStatus();\n}\n```\n\n```\nprotected virtual void OnDisable\
    \ ()\n{\n    ARFaceComponent.updated -= TryToUpdateModelStatus;\n    ARSession.stateChanged\
    \ -= TryToUpdateModelStatus;\n}\n\nprivate void TryToUpdateModelStatus (ARFaceUpdatedEventArgs\
    \ eventArgs)\n{\n    TryToUpdateModelStatus();\n}\n\nprivate void TryToUpdateModelStatus\
    \ (ARSessionStateChangedEventArgs eventAr;\n{\n    TryToUpdateModelStatus();\n\
    }\n\nprivate void TryToUpdateModelStatus ()\n{\n    bool isFaceVisible = GetFaceVisibility();\n\
    \    ModelTransform.gameObject.SetActive(isFaceVisible);\n\n    if (isFaceVisible\
    \ == true)\n    {\n        ModelTransform.localPosition = ARFaceComponent.vertices[AR_(\n\
    \    }\n}\n\nprivate bool GetFaceVisibility()\n{\n    return enabled == true &&\
    \ ARFaceComponent.trackingState != Tracking!\n}\n```\n\n## ARFace Data and Face\
    \ Detection in ARKit 3\n\nThe procedure is straightforward: when the ARFaceManager\
    \ detects a face, it sends new ARFace data. Since our controller is linked to\
    \ ARFace’s updated case, the script updates the location of the glasses whenever\
    \ a new set of face point coordinates is detected.\n\nThe vertex array indexes\
    \ often apply to the same characteristic points on a human’s face; the only thing\
    \ that varies based on a person’s facial characteristics is the overall location\
    \ and face mesh. We aligned our glasses to vertex index 16, yielding the following\
    \ outcome.\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_159_0.png)\n\n## Select\
    \ Color\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_160_0.png)\n\n## Color Selector\n\
    \nWe like to adjust the color of the frames using a ColorController script connected\
    \ to buttons in a simple UI, so we made ARGlassesController a singleton so that\
    \ the ColorController can access it whenever it’s accessible on the scene.\n\n\
    ```\nusing UnityEngine;\n\npublic class ColorController : MonoBehaviour\n{\n \
    \   [field: SerializeField]\n    public Color Color { get; private set; }\n\n\
    \    public void SetFrameColor()\n    {\n        if (ARGlassesController.Instance\
    \ != null)\n        {\n            ARGlassesController.Instance.ChangeFrameColor(Color);\n\
    \        }\n    }\n}\n```\n\nThe SetFrameColor function is linked to the Click\
    \ event of each color button on the scene, allowing us to change the frame color\
    \ to the one specified in the controller whenever we click a button.\n\n## Summary\n\
    \nThe preceding instructions covered are for an Augmented Reality face tracking\
    \ app. This is just one instance of many possible applications in Augmented Reality\
    \ and ARKit. The ARKit face tracking APIs can be used to build rather more complicated\
    \ applications, not just for fashion and cosmetics but also for industrial and\
    \ enterprise applications, such as, employee identification and user authentication.\
    \ Apple today provides us with sophisticated and versatile tools that could empower\
    \ thousands of applications. Given a future where companies invest more into Augmented\
    \ Reality hardware and software, we are thrilled to see how the technology evolves\
    \ in the near future and what Apple will be offering in both hardware and software\
    \ in the near future.\n"
  mdcn: "\n\n## ARKit 3 中的面部追踪\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_152_0.png)\n\
    \n图 7-6. ARKit 3 中的面部追踪\n\n### 用户等级：基础\n\n自增强现实引入行业以来，它为我们提供了开发面向移动技术用户的互动且令人兴奋的机会的能力。AR\
    \ 可以在多种方式上为我们节省时间，包括查看理想的沙发在我们公寓中的外观、判断所选的油漆颜色是否适合室内装饰，甚至即时试戴新妆容。\n\n面部追踪是 iPhone\
    \ X 及更新机型上 ARKit 3 的强大功能。我们可以用合适的组件快速创建用于试戴珠宝、口红或眼镜的应用程序。在本示例中，我们将集中于最后一种选择：创建一个用于试戴眼镜的\
    \ AR 应用，并带有简单的镜框颜色切换。\n\n## ARKit 3 的设置和规范\n\n由于 ARKit 3 的 AR 面部追踪需要 iPhone X\
    \ 中引入的 A11 Bionic 芯片，因此我们需要该系统或更新的系统来使我们的示例正常工作。我们需要 Unity 2019.1 或更高版本来构建我们的项目\n\
    \n以利用 ARKit 3 的所有功能，例如多面部追踪。在构建项目后，我们需要安装所需的 ARKit 包。自 2019 年 7 月起，ARKit for Unity\
    \ 已包含在 ARFoundation 捆绑包中，因此我们需要从 Window 菜单打开 Package Manager 并安装以下包：\n\n- 1. ARFoundation\n\
    - 2. AR Subsystems\n- 3. AR Face Tracking 用于所有必需的面部追踪脚本\n- 4. XR Legacy Input\
    \ Helpers 用于 Tracked Pose Driver 脚本\n\n安装后，将项目移动到 iOS 平台并设置播放器配置是个好主意。在 Player\
    \ Settings 窗口中将 Target minimum iOS Version 设置为 11.0，因为 ARKit 3.0 需要最低 SDK 版本 11.0。\n\
    \n在同一窗口的 Architecture 下拉菜单中选择 ARM64，因为 ARKit 仅支持 64 位设备。你还需要指定 Camera Usage Description，即当应用请求使用系统摄像头的批准时出现的脚本。你可以将文本更改为你想要的任何内容，例如“ARKit\
    \ 3 Face Detection。”\n\n## 增强现实中的会话对象\n\n项目正确设置后，我们就可以开始创建必需的 AR Session 对象。首先，我们在场景中创建一个\
    \ ARSession GameObject 并向其添加两个脚本：一个 AR Session 脚本和一个 AR Input Manager 脚本。\n\n\
    然后，我们使用 AR Session Origin 脚本和 AR Face Manager 创建一个 AR Session Origin 对象。由于 ARKit\
    \ 很少使用设备的正面摄像头——它仅在面部追踪/识别场景中使用——\n\nFace Manager 脚本至关重要。AR Session Origin 中有一个用于\
    \ Camera 脚本的空字段。\n\n让我们只需将 Main Camera 对象放置在 AR Session Origin 对象内部，然后在 AR Session\
    \ Origin 脚本中引用它。需要三个脚本：\n\n- Pose Driver with Tracking（在 Tracked Pose Driver 中，将\
    \ Pose Source 更改为 Color Camera 并启用 Use Relative Transform）\n- AR Camera History\n\
    - AR Camera Manager\n\n你是否发现 AR Session Origin 脚本中的 AR Face Manager 中有一个用于 Face\
    \ Prefab 的空字段？那是我们将用来想象我们的基于 AR Face 的眼镜的预制件。\n\n## 预制件 AR 眼镜\n\n我们需要创建一个新的 GameObject，我们将其命名为\
    \ GlassesPrefab。我们对预制件需要做的第一件事是为其附加两个组件。第一个是 ARFace 变量，它将为我们提供已识别的面部点数据。第二个是 ARGlassesController，这是一个脚本，将负责根据\
    \ ARFace 更新的数据定位眼镜。\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_155_0.png)\n\n\
    ### 图 7-7. ARFace 应用\n\n之后，我们需要在预制件内构建一个 GameObject，它将附加到我们的眼镜网格上，我们将使用 ARGlassesController\
    \ 对其进行操作。预制件的最终形式应类似于前一图像所示。被操作的网格必须作为子对象保存在我们的预制件内。ARFaceManager 控制预制件的位置，而 ARFace\
    \ 顶点是与检测到的面部相关的特征的局部点。\n\n## ARGlassesController 类\n\n```\nusing UnityEngine;\n\
    using UnityEngine.XR.ARFoundation;\nusing UnityEngine.XR.ARSubsystems;\n\n[RequireComponent(typeof(ARFace))]\n\
    public class ARGlassesController : MonoBehaviour\n{\n    [field: SerializeField]\n\
    \    public static ARGlassesController Instance { get; private set; }\n\n    [field:\
    \ SerializeField]\n    public Transform ModelTransform { get; private set; }\n\
    \n    [field: SerializeField]\n    public Material FrameMaterial { get; private\
    \ set; }\n\n    private ARFace ARFaceComponent { get; set; }\n\n    private const\
    \ string MATERIAL_COLOR_SETTING_NAME = \"_Color\";\n    private const int AR_GLASSES_PLACEMENT_VERTICE_INDEX\
    \ = 16;\n\n    public void ChangeFrameColor (Color color)\n    {\n        if (FrameMaterial\
    \ != null)\n        {\n            FrameMaterial.SetColor(MATERIAL_COLOR_SETTING_NAME,\
    \ color)\n        }\n    }\n\n    protected virtual void Awake ()\n    {\n   \
    \     if (Instance == null)\n        {\n            Instance = this;\n       \
    \ }\n    }\n```\n\n```\nARFaceComponent = GetComponent();\n}\n\nprotected virtual\
    \ void OnDestroy ()\n{\n    Instance = null;\n}\n\nprotected virtual void OnEnable\
    \ ()\n{\n    ARFaceComponent.updated += TryToUpdateModelStatus;\n    ARSession.stateChanged\
    \ += TryToUpdateModelStatus;\n    TryToUpdateModelStatus();\n}\n\nprotected virtual\
    \ void OnDisable ()\n{\n    ARFaceComponent.updated -= TryToUpdateModelStatus;\n\
    \    ARSession.stateChanged -= TryToUpdateModelStatus;\n}\n\nprivate void TryToUpdateModelStatus\
    \ (ARFaceUpdatedEventArgs eventArgs)\n{\n    TryToUpdateModelStatus();\n}\n\n\
    private void TryToUpdateModelStatus (ARSessionStateChangedEventArgs eventArg\n\
    {\n    TryToUpdateModelStatus();\n}\n```\n\n```\nprotected virtual void OnDisable\
    \ ()\n{\n    ARFaceComponent.updated -= TryToUpdateModelStatus;\n    ARSession.stateChanged\
    \ -= TryToUpdateModelStatus;\n}\n\nprivate void TryToUpdateModelStatus (ARFaceUpdatedEventArgs\
    \ eventArgs)\n{\n    TryToUpdateModelStatus();\n}\n\nprivate void TryToUpdateModelStatus\
    \ (ARSessionStateChangedEventArgs eventAr;\n{\n    TryToUpdateModelStatus();\n\
    }\n\nprivate void TryToUpdateModelStatus ()\n{\n    bool isFaceVisible = GetFaceVisibility();\n\
    \    ModelTransform.gameObject.SetActive(isFaceVisible);\n\n    if (isFaceVisible\
    \ == true)\n    {\n        ModelTransform.localPosition = ARFaceComponent.vertices[AR_(\n\
    \    }\n}\n\nprivate bool GetFaceVisibility()\n{\n    return enabled == true &&\
    \ ARFaceComponent.trackingState != Tracking!\n}\n```\n\n## ARKit 3 中的 ARFace 数据和面部检测\n\
    \n过程很简单：当 ARFaceManager 检测到面部时，它会发送新的 ARFace 数据。由于我们的控制器链接到 ARFace 的 updated 事件，脚本会在检测到新的面部点坐标集时更新眼镜的位置。\n\
    \n顶点数组索引通常适用于人类面部上的相同特征点；唯一根据个人面部特征而变化的是整体位置和面部网格。我们将眼镜与顶点索引 16 对齐，得到了以下结果。\n\n\
    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_159_0.png)\n\n## 选择颜色\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_160_0.png)\n\
    \n## 颜色选择器\n\n我们喜欢使用连接到简单 UI 中按钮的 ColorController 脚本来调整镜框颜色，因此我们将 ARGlassesController\
    \ 制作成单例，以便 ColorController 在场景中可用时可以访问它。\n\n```\nusing UnityEngine;\n\npublic\
    \ class ColorController : MonoBehaviour\n{\n    [field: SerializeField]\n    public\
    \ Color Color { get; private set; }\n\n    public void SetFrameColor()\n    {\n\
    \        if (ARGlassesController.Instance != null)\n        {\n            ARGlassesController.Instance.ChangeFrameColor(Color);\n\
    \        }\n    }\n}\n```\n\nSetFrameColor 函数链接到场景中每个颜色按钮的 Click 事件，使我们能够在点击按钮时将镜框颜色更改为控制器中指定的颜色。\n\
    \n## 总结\n\n前面的说明涵盖了增强现实面部追踪应用的制作。这只是增强现实和 ARKit 中众多可能应用的一个实例。ARKit 面部追踪 API 可用于构建更复杂的应用程序，而不仅仅是时尚和化妆品，还可用于工业和企业应用，例如员工识别和用户身份验证。今天，苹果为我们提供了复杂且多功能的工具，可以赋能数千个应用程序。鉴于未来公司将更多投资于增强现实硬件和软件，我们很高兴看到该技术在不久的将来如何发展，以及苹果在不久的将来在硬件和软件方面将提供什么。\n\
    \n"

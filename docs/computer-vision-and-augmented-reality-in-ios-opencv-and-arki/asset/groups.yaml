    \ smallImgROI, nestedObjects, 1.1, 2, 0|CASCADE_SCALE_IMAGE, Size(30, 30) );\n\
    ```\n\n这会从输入图像中检测眼睛。\n\n```\nfor ( size_t j = 0; j < nestedObjects.size(); j++\
    \ )\n{\n    Rect nr = nestedObjects[j];\n    center.x = cvRound((r.x + nr.x +\
    \ nr.width*0.5)*scale);\n    center.y = cvRound((r.y + nr.y + nr.height*0.5)*scale);\n\
    \    radius = cvRound((nr.width + nr.height)*0.25*scale);\n    circle( img, center,\
    \ radius, color, 3, 8, 0 );\n}\n```\n\n此循环将在眼睛周围绘制一个圆。\n\n```\n}\n}\n\n// Show\
    \ Processed Image with detected faces\nimshow( \"Face Detection\", img );\n}\n\
    ```\n\n函数 *imshow* 将在检测到人脸时处理图像，如以下输出图像所示：\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_82_0.png)\n\
    \n## B) 身体检测/跟踪\n\n跟踪是在视频中逐帧寻找物体的过程。虽然含义似乎直接，但跟踪确实是计算机视觉和机器学习中一个极其宽泛的概念，其中包含概念相关但技术上不同的概念。例如，目标跟踪涵盖了许多以下不同但相互关联的概念：\n\
    \n- 密集光流：此类算法有助于计算视频帧中每个像素的运动矢量。\n\n稀疏光流：Kanade-Lucas-Tomasi (KLT) 特征跟踪是其中一种算法，它跟踪图片中某些特征点的位移。\n\
    \n卡尔曼滤波：一种常用的信号处理算法，利用先前的运动知识来预测移动物体的位置。导弹的制导是该算法最早的应用之一！“引导阿波罗 11 号登月舱下降的机载计算机具有卡尔曼滤波器”，根据文章所述。\n\
    \n均值漂移和 Camshift：这些算法可用于找到密度函数的最大值。它们也用于跟踪过程中。\n\n单目标跟踪器：在此类跟踪器中，第一帧用矩形标记出我们希望跟踪的物体的位置。然后使用跟踪算法在后续帧中跟踪该物体。此类跟踪器通常与物体检测器结合使用于实际应用中。\n\
    \n多目标跟踪算法：使用快速物体检测器时，最好从每一帧中检测多个物体，并使用跟踪算法来确定每一帧中的矩形是否与下一帧中的矩形相对应。\n\n检测与跟踪：如果你使用过\
    \ OpenCV 人脸检测，你会发现它在实时中运行或可以立即在每一帧中发现人脸。为什么要在初始位置进行跟踪？让我们看看为什么你需要在剪辑中跟踪物体，而不是仅仅进行重复检测。\n\
    \n跟踪比检测更快：与检测算法相比，跟踪算法通常更快。原因很简单。虽然跟踪一个在上一帧中已观察到的物体时，我们拥有关于该物体存在的大量信息。我们现在知道前一帧的位置，以及移动位置和速度。因此，在下一帧中，我们将利用所有这些知识来估计物体所在的位置，或者在预测位置周围进行小范围搜索以精确放置物体。有效的跟踪算法可以利用它在整个过程中对物体的所有了解，而检测算法总是从零开始。因此，在构建这样一个有效的方法时，物体检测算法通常每隔\
    \ n 帧运行一次，而跟踪算法用于 n-1 帧（n 减 1，其中 n 为视频中的总帧数）。你可以在第一帧中检测到物体后就跟踪它。虽然在我们有额外数据时跟踪有优势（即大量图像或视频），但如果物体在较长时间内被障碍物遮挡或移动速度过快以至于跟踪算法无法跟上，它仍可能丢失和遗漏。跟踪算法也常会出现错误，例如跟踪物体的边界框会逐渐偏离。检测算法经常被应用来解决这些跟踪算法的问题。训练检测算法的一个巨大例子用于其物体。因此，它们对物体的特定类别非常了解。另一方面，跟踪算法最了解的是我们一直在跟踪的类别的特定实例。\n\
    \n当检测失效时，跟踪会提供帮助：当在剪辑中使用人脸检测器但物体遮挡了人的脸时，它很可能会失败。另一方面，强大的跟踪算法可以在一定程度上处理形变。\n\n\
    跟踪保留了身份：物体检测会输出包含物体的矩形序列。然而，该物体没有身份。例如，检测红色点的检测器可以在这里的剪辑中发出指向每一帧中检测到的每个点的矩形。这会在第一帧中产生一系列新的矩形。特定点可能在第一帧中以数组中的索引\
    \ 10 的矩形表示，而在第二帧中以索引 17 表示。当我们对单帧使用检测时，我们无法确定哪个矩形指的是哪个物体。\n\n"

    # Face Tracking in ARKit 3


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_152_0.png)


    Figure 7-6. Face Tracking in ARKit 3


    # User Level: Basic


    Augmented Reality has provided us with the ability to develop interactive and
    exciting opportunities for mobile technology users since its introduction to the
    industry. AR can save our time in a variety of ways, including checking out how
    our ideal sofa will look in our apartment, determining if the chosen paint color
    would suit the interior, and even instantly trying on new makeup.


    Face tracking is a strong feature of ARKit 3 on iPhone X and newer. We can quickly
    create applications for trying on jewelry, lipstick, or glasses with the right
    components. We''ll concentrate on the last choice in this example: creating an
    AR app for trying on glasses with a simple frame color shift.


    # Setup and Specifications for ARKit 3


    Since the A11 Bionic chip introduced in the iPhone X is needed for AR face tracking
    with ARKit 3, we''ll need this system or one that''s newer to make our example
    work. We''ll need Unity 2019.1 or later for our project'
  - '[PAGE 153]


    to take advantage of all of ARKit 3’s functionality, such as multiple-face tracking.
    We’ll need to install the required ARKit packages after we’ve built our project.
    Since ARKit for Unity has been included in the ARFoundation bundle since July
    2019, we’ll need to open the Package Manager from the Window menu and install
    the following packages:


    +   1. ARFoundation

    +   2. AR Subsystems

    +   3. AR Face Tracking for all the required face tracking scripts

    +   4. XR Legacy Input Helpers for the Tracked Pose Driver script


    It’s a great idea to move the project to the iOS platform and set the player configuration
    after the installation. Set the Target minimum iOS Version to 11.0 in the Player
    Settings window, as ARKit 3.0 needs a minimum SDK version of 11.0.



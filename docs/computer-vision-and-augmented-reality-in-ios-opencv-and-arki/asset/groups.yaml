    # CHAPTER 7


    # Augmented Reality Using ARKit and OpenCV


    ARKit has been one of Apple’s most popular iOS 11 functionality. Many more innovative
    augmented reality applications are being developed daily. In this project we will
    focus on setting up your first Augmented Reality projects using Apple’s ARKit
    and implementing it in Unity.


    # Why Do You Use OpenCV instead of Core ML?


    # Multiple Platforms Are Supported


    Although Core ML could be the best option for an iOS 11-only iPhone app, whenever
    you want backward compatibility or would like to support multiple platforms, you
    will have to instead build a custom approach for each platform or use OpenCV.


    Machine Learning isn’t right for every issue. Although Apple offers a couple of
    free open source models for items like object as well as scene detection, the
    field of computer vision is far bigger than just machine learning, and OpenCV
    is the most convenient way to get access to these resources.'
  - '[PAGE 141]


    # ARKit and OpenCV Integration


    Via a delegate call, ARSession allows direct access to the current frame data.


    ```

    - (void)session:(ARSession *)session didUpdateFrame:(ARFrame *)frame;

    ```


    When a new frame becomes visible, this function is invoked. We can get a CVPixelBufferRef
    of the raw data via a frame from here. Although the data in the frame is given
    in planar YCbCr format, we only require the grayscale version for our purposes.
    We miss the conversion stage and just catch the Y frame as we know it’s a YUV
    format.


    This was how we went about doing it:


    ```

    cv::Mat mat;


    CVPixelBufferLockBaseAddress(buffer, 0);


    //Get only the data from the plane we''re interested in


    void *address = CVPixelBufferGetBaseAddressOfPlane(buffer, 0);


    int bufferWidth = (int)CVPixelBufferGetWidthOfPlane(buffer,0);



    \ while higher layers capture semantic concepts on object categories.\n\nBecause\
    \ of these results, FCNT builds a feature discovery network to pick the most important\
    \ feature maps on the VGG network’s conv4-3 and conv5-3 layers. It then creates\
    \ two additional channels (called SNet and GNet) for the chosen feature maps from\
    \ two layers separately to prevent overfitting on noisy ones. The GNet captures\
    \ the object’s category detail, while the SNet distinguishes the object from a\
    \ similar-looking context.\n\nTo obtain heat maps of the object, both networks\
    \ are initialized with the specified bounding box in the first frame, and for\
    \ new frames, a region of interest (ROI) centered at the object position in the\
    \ previous frame is cropped and propagated. Finally, the classifier receives two\
    \ heat maps for prediction via SNet and GNet, and the tracker determines which\
    \ heat map will be used to produce the final tracking result based on whether\
    \ there are any distractors. The FCNT pipeline is illustrated in the following\
    \ (Figure 3-12).\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_58_0.png)\n\n###\
    \ Figure 3-12. Convolutional Network Pipeline\n\n## Summary\n\nThis chapter covers\
    \ basic math for computer vision including linear algebra and multivariable calculus.\
    \ It also covers why to study computer vision. The standard algorithms covered\
    \ in this chapter are image classification, object detection, instance segmentation,\
    \ and object tracking. It also covers how a computer reads an image.\n\nImage\
    \ classification is the process of categorizing and labeling groups of pixels\
    \ or vectors within an image based on specific rules.\n\nObject detection is a\
    \ computer vision technique that allows us to identify and locate objects in an\
    \ image or video.\n\nSemantic segmentation describes the process of associating\
    \ each pixel of an image with a class label (such as flower, person, road, sky,\
    \ ocean, or car).\n\nIn the upcoming chapter, we will discuss facial detection/recognition\
    \ and body detection / tracking.\n"
  mdcn: "\n\n为了解决这个问题，神经网络理论家建议改用区域，即图像中可能包含外观“斑块状”特征的图像区域。\n\n这是一个相对容易进行的游戏。R-CNN（基于区域的卷积神经网络）是第一个推动它发展的模型。在\
    \ R-CNN 中，我们首先使用选择性搜索算法扫描输入图像以寻找潜在的伪影，产生 2,000 个区域建议（图 3-8）。然后，在所有这些区域建议之上运行 CNN。最后，我们将每个\
    \ CNN 的输出输入 SVM 以识别区域，并使用线性回归收紧对象的边界框。\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_52_0.png)\n\
    \n### Figure 3-8. R-CNN Network\n\n本质上，我们将对象识别问题转化为图像分类问题。然而，有几个缺点：准备需要很长时间并且需要大量的磁盘空间，并且推理通常很缓慢。\n\
    \n快速 R-CNN 是 R-CNN 的直接后代，它通过进行两项改进来提高检测速度：（1）在提出区域之前进行特征提取，从而只需对整张图像运行一次 CNN，以及\
    \ 2）用 softmax 层替换 SVM，从而扩展神经网络进行预测而不是开发新模型。\n\n由于它只为整张图片训练一个 CNN，因此 fast R-CNN\
    \ 在速度方面表现更好。另一方面，选择性搜索算法生成区域建议也需要很长时间。\n\n因此，开发了更快的 R-CNN，并且它此后已成为基于深度学习的物体检测的经典标准（图\
    \ 3-9）。它插入一个区域建议网络（RPN）来从特征中预测建议，用快速神经网络取代缓慢的选择性搜索算法。为了最大限度地减少整体推理过程的计算需求，RPN\
    \ 用于确定“在哪里”查找。RPN 快速高效地扫描每个位置，以决定该区域是否需要进一步处理。它通过生成 K 个边界框建议来实现这一点，每个建议都有两个分数，显示在每个位置存在项目的可能性。\n\
    \n![](img/7d8e54ee4578088e252f4c75b5cd4c88_53_0.png)\n\nFigure 3-9. Fast R-CNN\n\
    \n一旦我们有了它们，我们就将我们的区域想法直接输入到实际上是快速 R-CNN 的内容中。最后添加一个池化层、多个全连接层、一个 softmax 分类层和一个边界框回归器。\n\
    \n总体而言，faster R-CNN 在速度和准确性方面优于竞争对手。虽然未来模型将检测速度大幅提高，但只有少数模型能够以相当大的优势超越 faster\
    \ R-CNN。换句话说，虽然 faster R-CNN 不是最简单或最快的物体检测过程，但它仍然是最有效的方法之一（图 3-10）。\n\n## Faster\
    \ R-CNN\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_54_0.png)\n\nFigure 3-10.\
    \ Faster R-CNN\n\n近年来，全球物体检测模式已转向更简单、更强大的检测系统。作为在整张图片上共享计算的一步，像 You Only Look\
    \ Once（YOLO）、Single Shot MultiBox Detector（SSD）和 Region-Based Fully\n\nConvolutional\
    \ Networks（R-FCNs）等方法变得可见。因此，这些策略使自己与三个 R-CNN 技术昂贵的子网络区分开来。这些模式背后的主要原因是停止让不同的算法孤立地专注于各自的子问题，这可能会增加训练时间并降低网络精度。\n\
    \n在给定场景中跟踪一个感兴趣点或多个对象的方法称为对象跟踪（图 3-11）。它历史上一直用于视频和现实世界遭遇中，其中结果是在对象最初识别后得出的。它现在对于自动驾驶应用（如\
    \ Uber 和 Tesla 的自动驾驶汽车）至关重要。\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_55_0.png)\n\
    \n### Figure 3-11. Object Tracking\n\n根据观察范式，对象跟踪方法可分为两类：生成式和判别式。生成式方法，例如 PCA，使用生成模型来解释可见特征并最小化重建误差。\n\
    \n判别式方法将目标与背景区分开来；其准确性更可靠，并且越来越多地取代传统的跟踪方法。跟踪检测是判别过程的另一个术语，深度学习属于这一组。为了实现跟踪检测，我们在所有帧中检测候选对象，然后使用深度学习在候选对象中对目标对象进行分类。堆叠自编码器（SAE）和卷积神经网络（CNN）是两种可用于此的简单网络模型。\n\
    \nDeep Learning Tracker（DLT）是使用 SAE 进行监控任务的最常见深度网络，因为它允许离线预训练和在线微调。过程如下：\n\n-\
    \ 通过对输入图像施加噪声并重建原始图像，堆叠去噪自编码器将实现更强大的函数表达能力。\n\n要创建分类网络，将预训练网络的编码部分与分类器结合，然后使用从原始帧收集的正负样本微调网络，以区分当前实体与过去。DLT\
    \ 使用粒子滤波器作为运动模型为当前帧创建候选补丁。分类网络为这些补丁生成似然分数，显示其分类的置信度，然后选择其中最高的补丁作为对象。\n\n- DLT\
    \ 采用最小阈值方法进行模型更新。\n\n由于其在图像识别和物体检测中的主导地位，CNN 已成为机器视觉和视觉识别的标准深度范式。通常可以训练大规模 CNN\
    \ 作为分类器和跟踪器。一般来说。完全卷积网络跟踪器（FCNT）和多域 CNN 是两种基于 CNN 的跟踪算法的示例（MD Net）。\n\n- FCNT\
    \ 成功分析和利用 VGG 模型的函数映射，该模型是预训练的 ImageNet，得出以下结果：\n  - CNN 函数映射可用于监控和定位。\n  - 对于区分特定对象与其上下文的任务，通常\
    \ CNN 函数映射通常模糊或无关。\n  - 较低层编码更多判别属性以捕捉类内变化，而较高层捕捉对象类别上的语义概念。\n\n由于这些结果，FCNT 构建了一个特征发现网络，以在\
    \ VGG 网络的 conv4-3 和 conv5-3 层上选择最重要的特征映射。然后它为来自两个层的选定特征映射分别创建两个额外通道（称为 SNet 和\
    \ GNet），以防止在嘈杂的特征映射上过拟合。GNet 捕捉对象的类别细节，而 SNet 将对象与相似的外观上下文区分开来。\n\n为了获得对象的热力图，两个网络都使用第一帧中指定的边界框进行初始化，对于新帧，以前一帧中对象位置为中心的感兴趣区域（ROI）被裁剪并传播。最后，分类器接收来自\
    \ SNet 和 GNet 的两个热力图进行预测，并且跟踪器根据是否存在干扰物确定将使用哪个热力图来产生最终跟踪结果。FCNT 流程如下所示（图 3-12）。\n\
    \n![](img/7d8e54ee4578088e252f4c75b5cd4c88_58_0.png)\n\n### Figure 3-12. Convolutional\
    \ Network Pipeline\n\n## Summary\n\n本章涵盖了计算机视觉的基础数学，包括线性代数和多元微积分。它还涵盖了为什么要学习计算机视觉。本章涵盖的标准算法是图像分类、物体检测、实例分割和物体跟踪。它还涵盖了计算机如何读取图像。\n\
    \n图像分类是根据特定规则对图像中像素或向量的组进行分类和标记的过程。\n\n物体检测是一种计算机视觉技术，允许我们在图像或视频中识别和定位物体。\n\n\
    语义分割描述了将图像的每个像素与类别标签关联起来的过程（例如花朵、人、道路、天空、海洋或汽车）。\n\n在下一章中，我们将讨论人脸检测/识别和人体检测/跟踪。\n\
    \n"

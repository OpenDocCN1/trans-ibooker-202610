    \ trackerType + \" Tracker\", Point(100,20),\nFONT_HERSHEY_SIMPLEX, 0.75, Scalar(50,170,50),2);\n\
    ```\n\n视频帧将在 while 循环中读取。然后会创建一个边界框，然后根据跟踪器类型在视频帧上显示并显示相应的结果。\n\n```\n97  // Display\
    \ FPS on frame\n98  putText(frame, \"FPS : \" + SSTR(int(fps)), Point(100,50),\n\
    99  FONT_HERSHEY_SIMPLEX, 0.75, Scalar(50,170,50), 2);\n100 \n101  // Display\
    \ frame.\n102  imshow(\"Tracking\", frame);\n103 \n104  // Exit if ESC pressed.\n\
    105  int k = waitKey(1);\n106  if(k == 27)\n107  {\n108      break;\n109  }\n\
    110 }\n111 }\n```\n\n最后，在跟踪完成后并创建边界框后，帧会在屏幕上显示。imshow 函数负责在用户界面中显示完全渲染的帧。而 if\
    \ 语句处理按下退出键以取消跟踪的情况。\n\n我们将在本部分中查看一些不同的跟踪算法。目标是获得对每个跟踪器的实际了解，而不是一小部分深奥的理论知识。\n\
    \n首先，我将介绍一些基本的跟踪概念。我们的跟踪目标是在准确跟踪（或大约所有）先前帧中的对象后，在当前帧中定位该对象。运动模型似乎只是一个很好的说法，即你知道对象在后续帧中的位置和速度（速度\
    \ + 移动方向）。除非我们无法检测或分析对象，否则我们可以根据当前运动模型估计新位置；因此，了解对象是什么对于实时检测其位置至关重要。你可以创建一个描述对象外观的外观模型。此外观模型可用于在运动模型预测位置的小邻域内搜索，以更准确地预测对象的位置。正例（对象）和负例（上下文）被输入到分类器中以训练它。让我们看看不同的跟踪算法如何解决在线训练问题。\n\
    \n## BOOSTING Tracker\n\n该跟踪器基于 AdaBoost 的在线版本，这是基于 Haar 级联的人脸检测器的内部算法。该分类器必须在运行时针对对象的正例和负例进行训练。在新帧中，分类器在前一个位置附近的每个像素上运行，并记录分类器的分数。分数最高的像素就是对象的新位置。因此，我们现在又有一个分类器的正例。随着更多帧的到来，分类器会用新信息进行更新。\n\
    \n优点：其算法已有十多年历史并且仍然有效，但在有其他专用跟踪器（MIL、KCF）可用的情况下，我想不出更好的用途，它们遵循类似的原理。\n\n缺点：跟踪方面的输出平平。它并不总是能理解何时跟踪不起作用。\n\
    \n## MIL Tracker\n\n它与 BOOSTING 跟踪器相似。主要区别在于，与其仅将对象的当前位置作为正例来查找，此方法会在当前位置周围的小社区中搜索多个可能的正例。在\
    \ MIL 中，你不指定正例和负例，而是指定正例和负例“包”。正例包的图像数组并不完全由正例组成。相反，正例包中只需要一张图片是好的例子！在我们的例子中，正例包包含基于对象当前位置的补丁以及其周围小社区的补丁。\n\
    \n优点：结果很优秀。它不会像 BOOSTING 跟踪器那样漂移，因此在部分遮挡时表现非常出色。如果你在 OpenCV 3.0 上，这可能是最好的跟踪器。然而，如果你使用的是更高版本，KCF\
    \ 是一个不错的选择。\n\n缺点：跟踪误差没有被准确记录。在完全遮挡后，它不会恢复。\n\n"

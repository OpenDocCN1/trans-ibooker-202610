    \ C++ 扫描包含多种条形码符号的图片：\n\n```\n// Set barcode symbologies\nSystem::ArrayPtr<System::SharedPtr<BaseDecodeType>>\
    \ objArray = System::MakeArray<System::SharedPtr<Aspose::BarCode::BarCodeRecognition::BaseDecodeType>>({DecodeType::Code39Standard,\
    \ DecodeType::PDF417});\n\n// Initialize the BarCodeReader, Call Read() method\
    \ in a loop and Display the codetext and symbology type\nSystem::SharedPtr<BarCodeReader>\
    \ reader = System::MakeObject<BarCodeReader>(u\"RecognizingMultipleSymbologies.png\"\
    , objArray);\nwhile (reader->Read())\n{\n    System::Console::WriteLine(System::String(u\"\
    Codetext: \") + reader->GetCodeText());\n    System::Console::WriteLine(System::String(u\"\
    Symbology type: \") + reader->GetCodeType());\n}\nreader->Close();\n```\n\n##\
    \ 摘要\n\n在本章中，您学习了如何使用 C++ 构建各种符号的条形码。涵盖了条形码的扫描和读取，并附有 C++ 代码示例。文档将帮助您了解有关 API\
    \ 的所有内容。\n\n## 第 6 章\n\n## 增强现实\n使用 OpenCV\n\n本章解释了如何通过测量周期平均背景场景来使用缩小后的图片细节实时跟踪移动和静态对象。\n\
    \n## 概述\n\n增强现实，也称为 AR，是一种允许我们在视野中看到虚拟对象和细节的技术。我们可以通过增强现实获得我们可以看到的对象的详细信息。这通过结合现实世界组件来改进屏幕。例如，如果我将手机指向一条街道，这将为我提供额外的信息，如餐馆、健身中心、医生的名称等。增强现实被称为数字知识与个人世界的实时结合。用户可以通过增强现实技术与其自然环境中的虚拟对象进行交互。佩戴虚拟现实眼镜的人使用手机或平板电脑屏幕来查看他们正在查看的任何对象的详细信息。\n\
    \n这里讨论了三种不同类型的 AR。\n\n## 基于标记的 AR\n\n数字世界与物理世界相互连接。我们必须知道用户将摄像机对准特定页面以将教育动画直接显示在期刊的纸张上。因此，系统最初应检测您从摄像机的实时视图中正在查看的是哪一页。这将通过使用页面上的独特图像或形状来实现。图像将被识别，动画将立即开始，跟踪到页面上的正确位置。用户也可以将该实际书籍移动以查看虚拟世界是否遵循页面的真实表面。系统识别的可识别图像被称为标记。几乎任何东西都可以用作标记，只要它具有足够独特的视觉特征即可。\n\
    \n## 无标记 AR\n\n虚拟对象由用户移动。考虑一种增强现实技术，允许您将虚拟家具放置在客厅中。它使我们能够尝试不同的对象设计，以及位置组合。客户必须在该过程中确定虚拟对象的放置位置。它被称为“无标记\
    \ AR”。\n\n## 基于位置的 AR\n\n虚拟世界存在于现实世界中。\n\n基于位置的 AR 将增强现实技术连接到特定位置。假设您走在一条不熟悉的公共道路上，看到手机摄像机显示一个虚拟街道标志，显示街道名称，那就是基于位置的\
    \ AR。而且，就像我们的 AR City 应用程序一样，这可以帮助您通过在您面前的实际路径上方叠加路线来移动到该位置。\n\n"

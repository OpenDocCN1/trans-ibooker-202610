    In Figure 1-3 you can see how the color intensity can affect the final resulting
    color. The higher the color intensity, the brighter the resulting color.


    Although rendering a digital image appears to be a computer-friendly task, computer
    vision requires more complex processing to interpret, analyze, or manipulate the
    contents of a digital image. Computer Vision consists of two core applications:
    manipulating digital images and processing digital images to perform vision tasks.
    Manipulating digital images includes image enhancement, restoration, reconstruction,
    and compression. Image enhancement and restoration are typically used to improve
    the quality of distorted images. Reconstruction of images takes advantage of a
    set of two-dimensional images from different angles to reconstruct a three-dimensional
    image. However, some implementations that use deep learning attempt to reconstruct
    a three-dimensional image from a single two-dimensional image. Image compression
    is used to convert images into a more efficient representation to minimize storage
    usage. Processing digital images, on the other hand, may use some image manipulation
    techniques to perform vision tasks that match, describe, or recognize the contents
    of an image. The process of matching and describing contents of an image mainly
    depends on segmenting images into smaller parts and comparing the segmented parts
    to other template images and measuring the relationships between the segmented
    parts and the template images (see Figure 1-4).


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_15_0.png)


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_15_1.png)



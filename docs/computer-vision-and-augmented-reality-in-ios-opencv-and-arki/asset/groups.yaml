    ## 基于标记的增强现实


    ## 使用 OpenCV (C++) 中的 ArUco 标记创建增强现实


    在本节中，我们将介绍 ArUco 标记是什么，以及如何利用它们与 OpenCV 一起执行基本的增强现实活动。ArUco 标记长期以来一直用于虚拟现实、相机姿态预测和校准。让我们更仔细地了解一下它。


    ### 什么是 ArUco 标记？


    ArUco 代表 Augmented Reality University of Cordoba（科尔多瓦大学增强现实，图 6-1）。科尔多瓦大学是西班牙科尔多瓦的一所大学，它是在那里创建的。


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_123_0.png)


    图 6-1. ArUco 标记


    以下是一些示例：


    ArUco 标记是一种 fiducial 标记，它被放置在被拍摄的物体以及场景上。它是一个二进制正方形，具有深色背景和边框，以及一个识别它的白色生成图案。深色边框使其更容易被看到。它有多种尺寸可供选择。为了有效检测，尺寸是根据物体的大小以及场景的大小来选择的。虽然非常小的标记无法被识别，但只需增大其尺寸即可帮助它们被找到。


    一个概念是将这些标记扫描并在现实生活中使用它们。拍摄自然世界可以让你特别识别这些标记。当你是一个初学者时，你可能会想，“这对我有什么帮助？”让我们看几个例子。我们在文章中提到的实例中，将打印的标记大多放置在图像框架的边缘上。因此，当标记被特别识别时，你可以用图片或剪辑替换图像框架。一旦你切换相机，一个新的图像似乎具有正确的视点失真。这些标记可以放置在仓库的路线上，并在机器人应用中安装相机。由于每个标记都有唯一的
    ID，我们知道标记在仓库中的位置。每当机器人的相机识别到这些标记中的任何一个时，它就可以精确定位仓库内的确切位置。


    ### 使用 OpenCV 创建 ArUco 标记


    利用 OpenCV，我们可以快速生成这些标记。OpenCV 的 aruco 模块中预定义了 25 个标记词汇表。字典中的标记都包含相同的块大小顺序（44、55、66
    或 77），因此每个词汇表都有固定数量的标记（50、100、250 或 1000）。


    以下是显示如何识别和生成 Aruco 标记的 C++ 代码。我们必须使用 aruco 模块。代码中的 PredefinedDictionary 显示了如何加载包含
    250 个标记的字典。


    ### C++


    ```

    // Import the aruco module in OpenCV

    #include <opencv2/aruco.hpp>


    Mat markerImage;

    // Load the predefined dictionary

    Ptr<cv::aruco::Dictionary> dictionary =

    aruco::getPredefinedDictionary(cv::aruco::DICT_6X6_250);

    // Generate the marker

    aruco::drawMarker(dictionary, 33, 200, markerImage, 1);

    ```


    前面的 drawMarker 函数允许我们从一组 250 个 ID 范围为 0 到 249 的标记中选择一个具有特定 ID（第二个参数 – 33）的标记。生成的标记的大小由
    drawMarker 函数的第三个参数决定。它可能在前面的实例中生成一个 200 × 200 像素的图片。第四个参数（前面的 markerImage）是用于保存生成的标记的对象。最终，密度参数指的是应作为边界插入到形成的二进制图案中的块的数量。在之前的说明中，一个
    1 位边框将被插入到 6×6 生成的形状中，从而在 200 × 200 像素的图片中产生一个 7×7 位图片（图 6-2）。前面的代码将生成一个与以下所示类似的标记。


    ![](img/7d8e54ee4578088e252f4c75b5cd4c88_125_0.png)


    图 6-2. 示例标记


    在大多数情况下，我们需要创建多个标记，将它们打印出来，并将它们放置在场景中。


    **ArUco 标记检测：** 我们必须识别 ArUco 标记，然后在场景被可视化时将它们用于进一步分析。我们将在下面向你展示如何发现标记。


    ### C++


    // Load the dictionary that was used to generate the markers.

    Ptr<Dictionary> dictionary = getPredefinedDictionary(DICT_6X6_250);


    // Initialize the detector parameters using default values

    Ptr<DetectorParameters> parameters = DetectorParameters::create();


    // Declare the vectors that would contain the detected marker corners and the
    rejected marker candidates

    vector<vector<Point2f>> markerCorners, rejectedCandidates;


    // The ids of the detected markers are stored in a vector

    vector<int> markerIds;


    // Detect the markers in the image

    detectMarkers(frame, dictionary, markerCorners, markerIds, parameters, rejectedCandidates);


    首先，我们加载一个与创建标记时使用的相同的词汇表。DetectorParameters 用于检测一组起始参数：make something ()。我们可以使用
    OpenCV 在识别阶段调整许多参数。默认参数在大多数情况下效果良好，OpenCV 建议你使用它们。因此，我们将保持相同的设置。每个活动标记检测都会识别标记的四个侧点，按顺序为左上、右上、右下和左下。这些矩形指针被处理为
    C++ 中的点向量，以及图片中多个标记被组合成点向量的向量。detectMarkers 功能用于查找和检测标记的角。场景中带有标记的图片将是第一个参数。用于创建标记的字典是第二个参数。被准确识别的标记将被保存为
    markerCorners，或其 ID 将被保存到 markerIds 中。DetectorParameters 实体也被作为参数发送，该实体是在之前创建的。最终，被拒绝的成员保存在
    rejected candidates 数据库中。


    在打印、裁剪并将它们插入场景中时，务必在标记的黑色边界上留出白色边框，以便于识别。


    ### 一个增强现实应用



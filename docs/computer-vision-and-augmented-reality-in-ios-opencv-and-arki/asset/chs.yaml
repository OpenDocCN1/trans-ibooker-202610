  \n以下是 Blob 结构：\n\n```\nstruct Blob {\n    unsigned int elements_number;\n    vector<struct\
  \ Element> elements;\n    unsigned int area;\n    RECT bounding_box;    //{[top,left;\
  \ right,bottom)\n};\n```\n\n因此，元素数量是存储在 Element 结构的元素数组中的 blob 中的元素数量。\n\n```\n\
  struct Element {\n    vector<struct Element> neighbs;\n    struct Coord coord;\n\
  };\n```\n\n坐标确实是图像向量中的元素坐标，而邻居包括其直接相邻的邻近元素。\n\n```\nstruct Coord {\n    int x;\n\
  \    int y;\n};\n```\n\n在调用 find blobs() 时，我们可以使用 find bounding boxes() 来测量每个 blob\
  \ 的边界框，该边界框包含在 Blobs::bounding box 的 RECT 布局中。在再次调用 find blobs() 之前，必须使用 delete\
  \ blobs() 从 Picture Blobs 对象中删除找到的 blob。\nfind_blob() 函数如下所示：\n\n```\nint ImageBlobs::find_blobs(const\
  \ vec2Dc& image,\n                          unsigned int min_elements_per_blob)\n\
  {\n    if (m_image == 0)\n        //not initialized\n        return -1;\n\n    m_image->copy(image);\n\
  \n    while (true) {\n        struct Blob blob;\n        blob.elements_number =\
  \ 0;\n        blob.area = 0;\n\n        unsigned int y, x;\n        //find first\
  \ non-zero entry//////////////////////////////\n        for (y = 0; y < m_image->height();\
  \ y++) {\n            for (x = 0; x < m_image->width(); x++) {\n               \
  \ if ((*m_image)(y, x) != 0) {\n                    struct Element element;\n  \
  \                  element.coord.x = x;\n                    element.coord.y = y;\n\
  \                    blob.elements_number = 1;\n                    blob.elements.push_back(element);\n\
  \                    blob.area = 0;\n                    memset(&blob.bounding_box,\
  \ 0, sizeof(RECT));\n                    break;\n                }\n           \
  \ }\n            if (blob.elements_number > 0)\n                break;\n       \
  \ }\n\n        if (blob.elements_number == 0) {\n            mark_blobs_on_image();\n\
  \            return get_blobs_number();\n        }\n\n        blob.elements.reserve(m_image->width()\
  \ * m_image->height());\n```\n\n\n\n\nHere we will find the first non-zero entry:\n\
  \n```\n//find blob////////////////////////////////////////////\nunsigned int index\
  \ = 0;\nwhile (index < blob.elements_number) {\n    unsigned int N = (unsigned int)blob.elements_number;\n\
  \    for (unsigned int i = index; i < N; i++) {\n        add_up_neighbour(blob,\
  \ i);\n        add_right_neighbour(blob, i);\n        add_down_neighbour(blob, i);\n\
  \        add_left_neighbour(blob, i);\n    }\n    index = N;\n}\nremove_blob_from_image(blob);\n\
  \nif (blob.elements_number > min_elements_per_blob) {\n    blob.area = (unsigned\
  \ int)blob.elements_number;\n    blob.elements.reserve(blob.elements_number);\n\
  \    m_blobs.push_back(blob);\n}\n```\n\nNow we will find the blob in the given\
  \ code.\n\nAn add * neighbour () processes look for the picture component that is\
  \ identical to an ith Component within the present blob upwards, below, left, or\
  \ right, then attach this towards a Blob components array:\n\n```\ninline unsigned\
  \ int ImageBlobs::add_up_neighbour(struct Blob& blob, unsigned int i)\n{\n    const\
  \ struct Element& element = blob.elements[i];\n    if (element.coord.y - 1 < 0)\n\
  \        return 0;\n    else if ((*m_image)(element.coord.y - 1, element.coord.x)\
  \ > 0) {\n        struct Element new_element;\n        new_element.coord.x = element.coord.x;\n\
  \        new_element.coord.y = element.coord.y - 1;\n        if (has_neighbour(element,\
  \ new_element) == false) {\n            int index = is_element_present(blob, new_element);\n\
  \            if (index >= 0) {\n                blob.elements[index].neighbs.push_back(element);\n\
  \                return 0;\n            }\n            new_element.neighbs.push_back(element);\n\
  \            blob.elements_number++;\n            blob.elements.push_back(new_element);\n\
  \            return 1;\n        }\n        else\n            return 0;\n    }\n\
  \    else\n        return 0;\n}\n```\n\nIs_element_present() as well as has_neighbour()\
  \ decide whether the same latest component has already been existing inside the\
  \ blob:\n\n```\ninline int ImageBlobs::is_element_present(const struct Blob& blob,\n\
  \    const struct Element& new_element) const\n{\n    //int index = 0;\n    for(int\
  \ i = (int)blob.elements_number - 1; i >= 0; i--) {\n        const struct Element&\
  \ element = blob.elements[i];\n        if (element.coord.x == new_element.coord.x\
  \ &&\n            element.coord.y == new_element.coord.y) {\n            //wprintf(L\"\
  \ %d\\n\", blob.elements_number - 1 - i);\n            return i;\n        }\n  \
  \      //if (++index > 2) //inspect at least 2 last elements\n        //    break;\n\
  \    }\n    return -1;\n}\n\ninline bool ImageBlobs::has_neighbour(const struct\
  \ Element& element,\n    const struct Element& new_element) const\n{\n    unsigned\
  \ int N = (unsigned int)element.neighbs.size();\n    if (N > 0) {\n        for (unsigned\
  \ int i = 0; i < N; i++) {\n            if (element.neighbs[i].coord.x == new_element.coord.x\
  \ &&\n                element.neighbs[i].coord.y == new_element.coord.y)\n     \
  \           return true;\n        }\n        return false;\n    }\n    else\n  \
  \      return false;\n}\n```\n\n#### Conclusions\n\nI’ve chosen a fixed background\

  \ Using Xcode 11 beta, open the project. You’ll get an error and your project won’t\
  \ run properly if you use an older version of Xcode. Give your iOS development credentials,\
  \ connect your iOS 13 device, and then click the Run button once the project has\
  \ been launched. The project will be deployed to the device in this manner.\n\n\
  When you’re done, point the camera toward a person to see the 3D overlay appear\
  \ on top of the tracked body!\n\n\n\n\n\n#### ARKit 3 中的面部追踪\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_152_0.png)\n\
  \n图 7-6. ARKit 3 中的面部追踪\n\n##### 用户等级：基础\n\n自增强现实引入行业以来，它为我们提供了开发面向移动技术用户的互动且令人兴奋的机会的能力。AR\
  \ 可以在多种方式上为我们节省时间，包括查看理想的沙发在我们公寓中的外观、判断所选的油漆颜色是否适合室内装饰，甚至即时试戴新妆容。\n\n面部追踪是 iPhone\
  \ X 及更新机型上 ARKit 3 的强大功能。我们可以用合适的组件快速创建用于试戴珠宝、口红或眼镜的应用程序。在本示例中，我们将集中于最后一种选择：创建一个用于试戴眼镜的\
  \ AR 应用，并带有简单的镜框颜色切换。\n\n#### ARKit 3 的设置和规范\n\n由于 ARKit 3 的 AR 面部追踪需要 iPhone X\
  \ 中引入的 A11 Bionic 芯片，因此我们需要该系统或更新的系统来使我们的示例正常工作。我们需要 Unity 2019.1 或更高版本来构建我们的项目\n\
  \n以利用 ARKit 3 的所有功能，例如多面部追踪。在构建项目后，我们需要安装所需的 ARKit 包。自 2019 年 7 月起，ARKit for Unity\
  \ 已包含在 ARFoundation 捆绑包中，因此我们需要从 Window 菜单打开 Package Manager 并安装以下包：\n\n- 1. ARFoundation\n\
  - 2. AR Subsystems\n- 3. AR Face Tracking 用于所有必需的面部追踪脚本\n- 4. XR Legacy Input Helpers\
  \ 用于 Tracked Pose Driver 脚本\n\n安装后，将项目移动到 iOS 平台并设置播放器配置是个好主意。在 Player Settings\
  \ 窗口中将 Target minimum iOS Version 设置为 11.0，因为 ARKit 3.0 需要最低 SDK 版本 11.0。\n\n在同一窗口的\
  \ Architecture 下拉菜单中选择 ARM64，因为 ARKit 仅支持 64 位设备。你还需要指定 Camera Usage Description，即当应用请求使用系统摄像头的批准时出现的脚本。你可以将文本更改为你想要的任何内容，例如“ARKit\
  \ 3 Face Detection。”\n\n#### 增强现实中的会话对象\n\n项目正确设置后，我们就可以开始创建必需的 AR Session 对象。首先，我们在场景中创建一个\
  \ ARSession GameObject 并向其添加两个脚本：一个 AR Session 脚本和一个 AR Input Manager 脚本。\n\n然后，我们使用\
  \ AR Session Origin 脚本和 AR Face Manager 创建一个 AR Session Origin 对象。由于 ARKit 很少使用设备的正面摄像头——它仅在面部追踪/识别场景中使用——\n\
  \nFace Manager 脚本至关重要。AR Session Origin 中有一个用于 Camera 脚本的空字段。\n\n让我们只需将 Main Camera\
  \ 对象放置在 AR Session Origin 对象内部，然后在 AR Session Origin 脚本中引用它。需要三个脚本：\n\n- Pose Driver\
  \ with Tracking（在 Tracked Pose Driver 中，将 Pose Source 更改为 Color Camera 并启用 Use Relative\
  \ Transform）\n- AR Camera History\n- AR Camera Manager\n\n你是否发现 AR Session Origin\
  \ 脚本中的 AR Face Manager 中有一个用于 Face Prefab 的空字段？那是我们将用来想象我们的基于 AR Face 的眼镜的预制件。\n\
  \n#### 预制件 AR 眼镜\n\n我们需要创建一个新的 GameObject，我们将其命名为 GlassesPrefab。我们对预制件需要做的第一件事是为其附加两个组件。第一个是\
  \ ARFace 变量，它将为我们提供已识别的面部点数据。第二个是 ARGlassesController，这是一个脚本，将负责根据 ARFace 更新的数据定位眼镜。\n\
  \n![](img/7d8e54ee4578088e252f4c75b5cd4c88_155_0.png)\n\n##### 图 7-7. ARFace 应用\n\
  \n之后，我们需要在预制件内构建一个 GameObject，它将附加到我们的眼镜网格上，我们将使用 ARGlassesController 对其进行操作。预制件的最终形式应类似于前一图像所示。被操作的网格必须作为子对象保存在我们的预制件内。ARFaceManager\
  \ 控制预制件的位置，而 ARFace 顶点是与检测到的面部相关的特征的局部点。\n\n#### ARGlassesController 类\n\n```\n\
  using UnityEngine;\nusing UnityEngine.XR.ARFoundation;\nusing UnityEngine.XR.ARSubsystems;\n\
  \n[RequireComponent(typeof(ARFace))]\npublic class ARGlassesController : MonoBehaviour\n\

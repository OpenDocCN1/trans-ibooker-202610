  \n#### Custom Barcode Generator/Reader\n\n##### Utilizing C++, Build and Read Barcodes\n\
  \nWe’ll show you how to programmatically create barcodes in C++ within the chapter.\
  \ You’ll also discover ways to build a barcode reader or scanner in the C++ program\
  \ (Figure 5-12).\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_113_0.png)\n\nFigure\
  \ 5-12. Custom Barcode Reader\n\nInformation is visually represented in the format\
  \ in which machines can read it using barcodes. Innovation has proven to be beneficial\
  \ in such a variety of applications, including automatic check systems within shops\
  \ as well as in markets. A barcode can now be used on most commercial products.\
  \ The barcode’s increasing success has led to new applications across several fields.\
  \ Aspose introduced a barcode generator and reader API for different channels a\
  \ couple of years back, recognizing the importance of barcodes. The purpose of this\
  \ chapter is to demonstrate how to automatically produce and interpret barcodes\
  \ using the barcode generator and reader in C++ programs.\n\n#### API for Producing\
  \ and Reading Barcodes in C++\n\nAssume, barcode with C++ is indeed a functionality\
  \ C++ API that allows users to build and read a wide range of 1D as well as 2D barcodes.\
  \ It allows you to produce, configure, as well as send greater-quality pictures\
  \ through barcodes.\n\nThe following is a list of barcode symbologies that Aspose.BarCode\
  \ with C++ will generate:\n\n- Code128\n- Code39 Standard\n- Code39 Extended\n-\
  \ Code93 Standard\n- Code93 Extended\n- Code11\n- Codabar\n- BooklandEAN\n- EAN13\n\
  - EAN8\n- EAN128\n- Interleaved2of5\n- Standard2of5\n- MSI\n- Postnet\n- Planet\n\
  - UPCA\n- UPCE\n- EAN14(SCC14)\n- SSCC18\n- ITF14\n- BarCode supplement\n- Pdf417\n\
  - QR\n- Datamatrix\n- Matrix 2 of 5\n- PZN (Pharma Zentral Nummer, Pharmazentralnummer\
  \ barcode)\n- Deutsche Post Identcode\n- Aztec\n- Australia Post\n\n#### Generating\
  \ a Barcode Using C++\n\nUtilizing Aspose to build a barcode: With only a few code\
  \ lines, you can create a barcode. The measures to execute this procedure include\
  \ the following:\n\n- Make an object of a Barcode Generator class.\n- Start an object\
  \ with encode form and text of the barcode.\n- Use the Barcode Generator->Save (System::String)\
  \ process, and build a barcode.\n\nThe following code demonstration illustrates\
  \ how to produce a barcode in C++:\n\n```\nconst System::String codeText = u\"1234567\"\
  ;\nconst System::String fileName = u\"code39_barcode.jpg\";\n// Create barcode generator\n\
  System::SharedPtr<BarcodeGenerator> barcodeGenerator = System::MakeObject<BarcodeGenerator>(EncodeTypes::Code39Standard,\
  \ codeText);\nbarcodeGenerator->get_Parameters()->set_Resolution(300);\n// Generate\
  \ barcode and save as image\nbarcodeGenerator->Save(fileName);\n```\n\n\n\n\n\n\
  使用前面的代码生成的条形码如下所示（图 5-13）：\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_116_0.png)\n\
  \n图 5-13. 自定义条形码阅读器\n\n#### 利用 C++，生成二维条形码（QR 或其他）\n\n我们在之前的实例中生成了一个一维条形码。让我们制作一个类似二维码的二维条形码。制作\
  \ QR 条形码的步骤如下：\n\n- 创建一个条形码生成器类的对象。\n- Encode Types:: 用于配置对象。设置二维码的文本。\n- 使用 Barcode\
  \ Generator->Save (System::String) 过程，并创建条形码图片。\n\n以下代码演示说明了如何使用 C++ 创建 QR 条形码：\n\
  \n```\nconst System::String codeText = u\"1234567\";\nconst System::String fileName\

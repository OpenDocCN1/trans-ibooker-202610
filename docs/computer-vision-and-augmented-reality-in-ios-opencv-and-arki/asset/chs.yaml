  #### 图 1-2. 灰度图像转换为矩阵


  图 1-2 演示了一个 16 × 16 灰度图像转换为像素值，这些像素值以 8 位无符号整数表示。


  在彩色数字图像中，像素值必须用三种颜色指定——红色、绿色和蓝色——这代表 RGB 色彩空间。因此，像素值表示为三个数字的向量，每个数字范围从 0 到 255。随着数值的增加，每种颜色的亮度也会增加，也称为颜色强度。例如，如果某个像素值为
  (255, 255, 255)，则表示红色、绿色和蓝色强度（或亮度）均设置为最高值，这定义了一个白色像素（见图 1-3）。


  | 红色强度 | 0 | 255 | 255 | 0 | 0 |

  | 绿色强度 | 0 | 255 | 0 | 255 | 0 |

  | 蓝色强度 | 0 | 255 | 0 | 0 | 255 |


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_14_0.png)


  #### 图 1-3. RGB 色彩空间和颜色强度示例


  在图 1-3 中可以看到颜色强度如何影响最终的颜色结果。颜色强度越高，结果颜色越亮。


  尽管渲染数字图像看起来像是计算机友好的任务，但计算机视觉需要更复杂的处理来解释、分析或操作数字图像的内容。计算机视觉包含两个核心应用：操作数字图像和处理数字图像以执行视觉任务。操作数字图像包括图像增强、修复、重建和压缩。图像增强和修复通常用于提高失真图像的质量。图像重建利用来自不同角度的一组二维图像来重建三维图像。然而，一些使用深度学习的实现尝试从单张二维图像重建三维图像。图像压缩用于将图像转换为更高效的表示以最小化存储使用。另一方面，处理数字图像可能会使用一些图像操作技术来执行视觉任务，以匹配、描述或识别图像的内容。匹配和描述图像内容的过程主要取决于将图像分割成更小的部分，并将分割后的部分与其他模板图像进行比较，并测量分割部分与模板图像之间的关系（见图
  1-4）。


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_15_0.png)


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_15_1.png)


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_15_2.png)


  模板匹配算法


  图片来源：Racool_studio/Freepik.com


  #### 图 1-4. 模板匹配抽象示例


  图 1-4 演示了模板匹配算法的示例结果。


  #### 计算机视觉工作原理概述


  为了让计算机执行面部检测等视觉任务，它需要执行多个较小的任务以达到目标任务。例如，为了执行视觉任务，计算机通常必须执行各种数字图像预处理技术，例如灰度操作、边缘增强和检测、噪声去除、图像修复、插值和图像分割。图像预处理是每个视觉任务的第一阶段，并且在取得成功结果方面发挥着重要作用。预处理的目的是提取给定图像中的有价值部分并去除不需要的失真。


  有价值的部分有助于开发像素、形状和表面在给定图像中的有用描述。如前所述，像素值由 1 字节整数定义（当它在灰度图像中时）或表示 RGB 色彩空间的整数向量（当它在彩色图像中时）；并且每个像素值都有不同的强度级别代表颜色的亮度。给定图像中强度的变化提供了关于图像中形状和表面结构的线索。


  在预处理阶段，我们尝试使用诸如噪声去除、边缘增强和图像分割等技术在没有任何图像内容知识的情况下提取这些信息。噪声去除是平滑图像以减少和消除不需要的噪声/失真的过程。然而，有时噪声去除技术最终会使图像模糊；在这种情况下，边缘增强技术就派上用场了。边缘增强通过增加两个区域边界之间的强度水平差异来提高图像中边缘的清晰度（见图
  1-5）。


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_16_0.png)


  图 1-5. 边缘增强/检测示例


  左侧的图像是原始图像。右侧的图像是在应用边缘增强技术后得到的结果图像。如你可能已经注意到的，右侧图像似乎“勾勒”出了狗的边缘，这可用于各种视觉任务，例如图像分类。


  图像分割是将图像分离成称为分割的较小部分的过程。分割用于分别处理图像的部分，因为在许多情况下，图像不仅仅包含一个有助于识别图像内容的独特对象或特征。图像分割被认为是预处理和为对象检测或分割分类处理图像之间的中间步骤（见图
  1-6）。


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_17_0.png)


  图 1-6. 抽象计算机视觉流程


  在对数字图像进行预处理后，处理步骤开始，在许多情况下，它可能涉及特征提取、纹理分析和模式识别等技术。根据每个视觉任务的不同，你会选择更相关的技术来执行任务。例如，为了执行图像分类任务，你会使用特征提取技术从给定图像的分割中提取独特特征。图像的分割是在图像分割过程中提取的。一旦从图像分割中提取出独特特征，它们就会被用来寻找与预定义或标记的图像分割相匹配的独特模式；标记的图像分割是经过人工监督手动定义的一块图像（图
  1-7）。


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_17_1.png)


  图 1-7. 标记图像分割示例


  寻找与标记分割完全匹配的过程称为特征匹配；寻找独特模式的过程称为模式识别。图 1-6 演示了抽象的计算机视觉流程，以及当计算机执行视觉任务时给定图像通常需要经历的过程。本书将在后续章节中介绍不同图像处理技术的更多细节。


  #### 为什么我们需要计算机视觉？


  自从互联网可供全球数十亿用户访问以来，它使许多人能够捕获、制作和发布多媒体内容，例如图像、视频和动画图像（也称为 GIF）。用户生成内容定义了我们今天所知的互联网，并且每天发布的多媒体内容数量正在迅速增加。今天，仅
  YouTube 发布者每分钟就贡献 300 小时的视频；即每周 300 万小时的视频。没有人能以这种速度观看这么多视频。YouTube 和许多允许在其平台上发布用户生成内容的类似公司面临着为数十亿用户生成图像和视频编目、分类和分类的挑战，以便为观众提供他们最想观看的最相关内容。所有这些内容的分类不能由典型的软件妥善处理；大多数现有方法都依赖于发布者的文本输入，例如视频标题、描述、关键词等。然而，在许多情况下，发布者的文本输入可能不相关；其内容可能包含不适合某些年龄段显示的不当或暴力场景，或者许多观众可能希望选择不观看此类内容。唯一能够实现大规模图像和视频编目、分类和分类的技术是计算机视觉。计算机视觉是公司所需要的，例如




  YouTube，用于索引和分类海量多媒体内容。除了对图像和视频进行分类之外，计算机视觉还可以用于


  - 为视障用户和客户提供图像和视频的视觉描述。

  - 过滤不适合特定年龄段的不当内容。

  - 警告观众图像或视频中包含的场景和内容类型。

  - 检测可能对观众或被篡改内容中的人物造成伤害的被操纵图像和视频。


  除了计算机视觉可以解决的与互联网相关的问题之外，还有许多其他行业的问题需要计算机视觉技术来解决。如今，你可以在我们日常互动的许多事物中发现计算机视觉技术集成其中，例如收银系统、监控系统、生物识别扫描仪、医疗设备、交通运输等，还有更多。


  - 收银系统集成计算机视觉技术以实现自助结账亭。

  - 监控系统使用图像和视频增强算法来检测和分析监控图像和视频的内容。

  - 生物识别扫描仪使用边缘检测和增强技术来收集和分析生物识别信息（即指纹、面部特征、眼睛特征……等）。

  - 医疗设备利用各种计算机视觉技术，例如图像重建和恢复，以从医疗设备和扫描仪中获取有用信息。


  这个列表可以延续数页，展示计算机视觉的所有不同应用。事实上，过去十年中，对计算机视觉技术的需求只是在不断增加。顶级公司正在其产品中采用该技术，而新公司则开始提供由计算机视觉驱动的产品。计算机视觉技术的影响是无限的，在未来几年里，它将被世界各地更多的行业和组织所采用。你可能已经看到了计算机视觉应用未来的初步迭代，例如自动驾驶车辆、自主制造以及通过增强现实进行的教育。


  在 2019 年，企业对增强现实、虚拟现实和计算机视觉工程师的需求增加了 1500%（State of Software Engineers, Hired.com）。计算机视觉将在未来几年对社会产生巨大影响，并需要更多为该技术做出贡献的人，本书旨在通过使软件工程师和对计算机视觉感兴趣的人参与到这项革命性技术的发展中来实现这一目标。


  #### 计算机视觉的演变


  1959 年，一项神经生理学研究对一只猫的视觉系统进行了几次实验。实验在猫大脑的主视觉皮层放置电极，研究人员在向猫展示各种图像时观察视觉皮层的神经反应（图 1-8）。


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_21_0.png)


  ##### 图 1-8. Hubel 和 Wiesel 的实验


  随着实验的进行，研究人员注意到当呈现新图像时猫的神经反应存在一种模式。研究得出结论，视觉皮层中存在简单和复杂神经元。视觉过程始于检测图像的简单结构和边缘，以帮助构建更详细的解释。随着视觉信息变得更加复杂，视觉皮层依赖复杂神经元来解释图像的剩余细节。这项研究后来成为计算机视觉领域最具影响力的研究之一。它启发了计算机视觉研究人员实现了今天所知的图像预处理。


  1966 年 7 月，麻省理工学院（MIT）人工智能实验室的教授 Seymour Papert 发起了“夏季视觉项目”。该项目分配给 MIT 本科生，旨在开发模式识别技术，尝试使机器能够看到。该项目是一个非常乐观的计划，旨在在一个夏天开发出我们今天所知的计算机视觉。在
  1960 年代，有各种尝试开发计算机视觉系统；然而，研究人员最终意识到这样一个项目需要数年，如果不是数十年才能实现。而现在，50 年后，计算机视觉仍处于研究和开发阶段。


  自 1960 年代以来，计算机视觉已经发展成为我们今天在许多应用中看到的技术。计算机视觉的开创性研究之一是在 1970 年代，研究重点是物体识别。物体识别的初始迭代是抽象且简单的，目的是证明物体识别的概念。实现使用了简单物体的线条连接，例如圆柱体和立方体，以识别它们。在随后的几十年中，研究人员和工程师开发了传统计算机视觉的核心技术，其中包括两个主要阶段：


  - 1. 图像预处理

  - 2. 图像处理


  图像预处理阶段专注于增强图像颜色和边缘，以帮助检测给定图像中的简单结构。处理阶段使用预处理后的图像执行以下一种或多种处理技术：


  - 图像压缩

  - 图像增强

  - 图像恢复和重建

  - 模式匹配和识别


  尽管自开发以来几十年来一直使用传统的图像处理技术，例如上面列出的技术，但这些技术 alone 无法解决的一些问题，例如在显著不寻常或意外的上下文中识别物体，例如手写单词、数字，以及从不寻常角度拍摄的物体图像（图
  1-9）。


  ##### 狗的正常图像


  ##### 狗的不寻常图像


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_23_0.png)


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_23_1.png)


  图 1-9. 物体的正常 vs. 不寻常图像


  因此，在 1980 年代，发表了各种开创性研究。研究建议使用简单和复杂“神经元”的人工网络来识别某些模式。这个人工网络今天被称为人工神经网络（ANN）。神经网络是一种计算模型，旨在在一组标记数据（本例中为标记图像）中识别模式。网络使用给定的图像来识别模式并预测每张图像的结果。一旦网络预测了图像的结果，它就会将其预测与分配给图像的标签进行比较。比较阶段使网络能够“学习”其初始过程中的错误，然后它多次执行相同过程，直到网络提供更准确的结果。神经网络通常需要大量标记数据才能提供显著良好的结果。因此，在早期，由于缺乏数据，神经网络并未发挥其全部潜力。


  在 2010 年代初期，一组计算机视觉研究人员启动了一个大规模图像数据集，包含数百万张图像和超过 20,000 个类别，称为 ImageNet。ImageNet
  的灵感来自计算机视觉领域对更多数据的需求。它推动了最先进神经网络模型的发展，这些模型对今天看到的先进计算机视觉应用产生了巨大影响。神经网络及其变体被认为是深度学习领域的一部分，而深度学习是机器学习的一个子集。因此，当神经网络用于执行视觉任务时，我将称其为基于深度学习的计算机视觉。


  #### 传统 vs. 基于深度学习的计算机视觉


  传统计算机视觉自计算机视觉领域开始以来就一直存在。传统计算机视觉技术已被用于几十年，以高效执行视觉任务。传统技术帮助开发了许多今天常用的算法，例如尺度不变特征变换（SIFT）和加速稳健特征（SURF）。像
  SIFT 和 SURF 这样的算法由于其高效性能和准确结果，已成为开发当今增强现实技术的基石。然而，在某些情况下，由于缺乏准确性，传统计算机视觉技术并不是最佳选择。在这些情况下，最佳选择通常是使用基于深度学习的技术。深度学习以多种方式用于执行复杂的视觉任务，例如图像分类。基于深度学习的方法在图像分类方面通常优于传统方法。图像分类是将图像内容在不同类别之间进行分类的过程。例如，最受欢迎的图像分类问题之一是猫和狗图像的分类。当软件被呈现猫的图像时，它应该以高准确度将其分类为猫。在深度学习之前，这项任务几乎不可能实现；然而，深度




  深度学习推动了计算机视觉可能实现极限的边界，并成功使计算机能够以高精度区分猫和狗。如果没有极快的计算机和数百万张猫狗图像的数据集，这是不可能实现的。你可能会想知道为什么深度学习需要快速的计算机和大量的数据。好吧，答案在于深度学习是什么以及它是如何真正工作的。深度学习是机器学习的一个子集，大多建立在人工神经网络（ANNs）之上，人工神经网络是一种受人类大脑运作方式启发的计算模型。与人类大脑相似，人工神经网络由多个计算“神经元”组成。神经网络中的一个人工神经元执行一个简单的计算操作，并与其他连接的神经元通信以做出决策。神经元之间连接的每个连接都有特定的强度。神经元之间连接的强度称为权重（见图
  1-10）。


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_25_0.png)


  图 1-10. 前馈人工神经网络模型


  图 1-10 展示了一个简单的神经网络，由三层组成——（1）输入层，（2）隐藏层，（3）输出层：


  - 1. 输入层由多个输入组成，每个输入代表给定数据集的独特特征。

  - 2. 隐藏层是一组神经元，根据权重值以某种方式计算和处理。

  - 3. 输出层是神经网络中的最后一层，从之前的隐藏层接收最终结果。


  一组神经元代表一个神经网络隐藏层，而典型的深度学习算法由多个神经网络隐藏层组成。ANNs 由两个阶段组成，学习阶段和执行阶段。在学习阶段，神经网络利用标记数据集来“学习”数据与其描述（也称为标签）之间的相关性。在我们的例子中，标记数据集将由一组图像组成，每张图像都有其内容的描述。当神经网络被提供一张标记图像时，它会尝试在隐藏层中处理该图像并返回标签的预测作为输出。一旦输出返回，神经网络就会通过使用称为目标函数的各种函数将其与原始标签进行比较来“评分”其结果。如果成绩没有超过某个阈值，它就会从中“学习”，通过调整神经网络中神经元之间连接的权重。神经网络通过向自身重复呈现相同的输入来继续学习，并且随着学习的进行，网络的权重会得到调整。此过程重复多次，直到神经网络的“成绩”超过所需的阈值。“学习”并调整权重的过程称为误差反向传播，也称为反向传播。回顾一下，典型的<|message|>
  人工神经网络在“学习”新事物时经历的简单有序步骤如下：


  - 1. 接收标记输入

  - 2. 尝试预测输入的标签

  - 3. 将预测的标签作为输出返回

  - 4. 将预测的标签与实际标签进行比较

  - 5. 对结果进行评分

  - 6. 调整神经元之间连接的强度，也称为权重

  - 7. 重复该过程，直到最终成绩超过阈值


  #### 增强现实中的计算机视觉


  增强现实（AR）是一种通过摄像头实时画面在物理世界中增强或显示数字对象的技术。为了在物理世界中显示数字对象，我们需要实时理解和检测物理世界中的对象。在某些情况下，对象可以是特定的模板。在其他情况下，它可以是水平表面，例如桌子和地板，或者是垂直表面，例如墙壁和门。为了能够检测对象和表面，我们需要使用计算机视觉技术在物理世界中显示数字对象。增强现实主要有三种类型：基于标记、免标记和基于地理位置的增强现实。基于标记的
  AR 需要预定义的模板来在上面显示数字对象。例如，书或杂志中的一页可以有一个特殊图标，当摄像头检测到该图标时，它会在图标或页面上映射并显示一个数字对象（图 1-11）。


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_28_0.png)


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_28_1.png)


  #### 基于标记的 AR


  ##### 免标记 AR


  图 1-11. 基于标记与免标记 AR


  与基于标记的 AR 不同，免标记 AR 不需要在显示数字对象时使用任何特殊预定义模板。相反，它可以使用各种计算机视觉技术将数字对象放置在任何水平或垂直表面上。地理位置
  AR 在许多情况下依赖于基于标记或免标记 AR，并集成位置传感器技术，根据视觉和位置数据在物理世界中显示数字对象。


  增强现实今天主要通过移动设备访问，具体来说是智能手机。虽然人们曾尝试通过开发定制硬件和设备（如微软的 HoloLens、Magic Leap 眼镜和 Google
  眼镜）来集成沉浸式 AR 体验，但对于消费者来说，采用新颖不熟悉的硬件还为时过早。因此，智能手机是向消费者介绍 AR 的完美工具。在移动 AR 的早期，使用标记，如二维码或模板图像，是在物理世界中增强数字对象的主要方式。为此，需要诸如模式识别和姿态估计等技术。模式识别是一种依赖于预定义的数据集来描述在给定图像中查找和分析的特征的技术。姿态估计


  使用检测到的模式根据摄像机角度模拟三维姿态（见图 1-12）；该技术用于根据摄像机的视角从各个角度看到三维对象。


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_29_0.png)


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_29_1.png)


  图 1-12. 身体姿态估计


  基于标记的 AR 允许任何拥有智能手机的用户交互和使用该技术；然而，拥有物理标记的要求对于日常使用来说既不可扩展也不实用。因此，由于其易用性和可访问性，免标记
  AR 具有更大的潜力。在免标记 AR 开发的早期，需要双摄像头来重建物理世界。


  #### 总结


  在本章中，我们阅读了计算机视觉的历史。比较了灰度图像和彩色图像。我们还研究了为什么我们需要计算机视觉及其评估。我们还看到了前馈人工神经网络的简化架构。最后，我们查看了增强现实。


  总之，计算机视觉是人工智能（AI）的一个领域，它使计算机和系统能够从数字图像、视频和其他视觉输入中提取有意义的信息，并基于该信息采取行动或做出建议。如果 AI
  使计算机能够思考，计算机视觉则使它们能够看到、观察和理解。


  计算机视觉的工作方式与人类视觉非常相似，只是人类起步更早。人类视觉的优势在于拥有数十年的上下文来训练如何区分物体、它们有多远、它们是否在移动，以及图像中是否有问题。


  在下一章中，我们将研究增强现实以及不同类型的增强现实。

  '
- '### 第 2 章


  ### 增强现实简介


  本章将重点介绍增强现实是什么、技术的发展及其不同的应用。


  #### 什么是增强现实？


  几十年来，人类一直使用某种技术来可视化数据、讲述故事、教育学生，甚至娱乐。数据可视化对于许多组织和个人更好地理解信息和做出决策至关重要。讲故事在让观众参与活动中发挥着重要作用。教育对于使当今的学生能够塑造他们的未来至关重要。娱乐形式可以是电子游戏、体育和音乐会。所有这些都是可以通过在物理世界中增强数字对象并使消费者能够与之交互而变得更加互动的活动示例。为了成功地在物理世界中增强数字对象，我们必须将光投影成自定义形状并将其显示在物理对象上。然而，这种方法需要大多数消费者不常用的额外硬件，例如屏幕投影仪和全息投影仪。需要额外硬件来“增强”物理世界中的数字对象这一事实使该技术变得




  易于获取且难以扩展，因为所需的硬件价格昂贵。随着计算机视觉的发展，越来越多的研究人员和工程师共同努力开发各种技术，以在物理世界中增强数字对象并实现与计算机交互的新方式，从而发展出我们今天所知的增强现实。


  增强现实是重建并在物理世界中显示交互式数字对象以开发交互式用户体验的领域。在开发增强现实技术和应用的过程中，我们需要考虑三个核心概念：


  - 1. 物理世界重建和映射技术

  - 2. 数字对象投影技术

  - 3. 新的人机交互指南


  早期增强和与物理世界中的数字对象交互的方法之一是由计算机研究员 Myron Krueger 开发的一个项目，他使用摄像头的实时视觉数据并将计算机界面投影出来，以便在物理世界中与数字计算机组件进行交互（图
  2-1）。


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_32_0.png)


  图 2-1. Videoplace – AR 的开端


  许多其他方法也依赖于摄像头的实时视觉数据来进行场景理解；但数字组件的投影始终在变化。一些尝试创建了头戴设备和眼镜，将数字组件投影到可佩戴的小屏幕上。另一些则将摄像头的实时视觉数据流式传输到计算机屏幕，并通过屏幕与数字组件进行交互。随着计算机视觉技术的演进，带有便携屏幕实时画面摄像头的设备变得更受欢迎且更容易被消费者获取，我们今天所熟悉的增强现实技术的开发也随之开始。除了开发计算机视觉和数字对象投影技术来实现增强现实之外，使增强现实更人性化、易于使用对于发挥该技术的全部潜力至关重要。多年来，计算机视觉、硬件和人机交互研究人员和工程师一直在共同努力创造终极的增强现实体验，这导致了今天在手机上看到的最常见的增强现实形式的诞生。


  今天，智能手机，例如 iOS 和 Android 设备，是使用户体验增强现实的主要设备，因为大多数智能手机都配备了功能强大的摄像头、传感器和地理定位硬件。通过利用智能手机中硬件提供的信息，我们可以通过增强现实为用户提供沉浸式和娱乐性的体验。智能手机中提供足够信息来实现增强现实的硬件部件包括单镜头或多镜头摄像头、加速度计、陀螺仪、磁力计和地理定位传感器（图
  2-2）。


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_34_0.png)


  ##### 图 2-2. 单镜头摄像头


  单镜头摄像头提供场景从一个角度的视觉数据，有助于检测和跟踪场景中表面的简单特征。另一方面，多镜头摄像头提供来自两个不同角度的视觉数据，有助于检测和跟踪场景中的深度，而深度跟踪能够实现更准确的现实世界距离测量。加速度计、陀螺仪和磁力计都是惯性测量单元（IMU）的一部分，该单元能够测量设备的加速度并估计其速度、距离、方向和重力。地理定位传感器提供有关设备位置和地理坐标的信息，这使得能够在特定位置区域“钉住”并增强数字对象（图
  2-3）。


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_35_0.png)


  ##### 图 2-3. 地理定位传感器测量


  如前所述，在开发增强现实技术时，我们需要考虑的三个核心概念中，第一个概念是物理世界重建和映射，也称为场景重建。场景重建是一项计算机视觉任务，其核心目标是将视频帧重建为三维场景。这项视觉任务对于在房间的特定部分放置数字对象并使用从重建的三维场景中获取的特定坐标值来识别对象在物理世界中的位置至关重要。


  要执行此视觉任务，我们需要从单镜头或多镜头摄像头获取视频帧。从单镜头摄像头获取的视频帧由于缺乏深度信息，重建场景会更困难；然而，借助一种称为运动结构（SfM）的计算机视觉技术，通过单镜头摄像头进行场景重建是可行的。SfM
  是一种利用一组二维图像来检测图像阵列中的独特特征并重建三维场景的技术（图 2-4）。与单镜头摄像头不同，使用多镜头摄像头的图像进行场景重建稍 less 具有挑战性，因为我们可以从两个或多个图像中估计深度并使用深度数据重建三维场景。


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_36_0.png)


  ##### 图 2-4. 运动结构模型


  尽管仅使用视觉技术进行场景重建在某些情况下可能足够，但在许多情况下，手持移动电话提供的视觉数据由于过度运动和不可预测的光照条件而失真，导致误差范围很大，在某些情况下甚至无法实现场景重建。在这种情况下，现代大多数移动电话中都有的惯性测量单元（IMU）将与视觉数据一起使用，以实现最佳的场景重建。来自
  IMU 设备的诸如方向和加速度等信息在视觉数据因任何原因失真或延迟时非常有帮助，因为 IMU 数据提供的频率高于视觉数据，这有助于检测运动和环境中的任何细微或显著变化。这样的
  IMU 数据与视觉数据对齐以计算初始速度和设备的物理坐标。


  使用 IMU 数据与摄像头视觉数据相结合一直是计算机视觉和增强现实领域中用于执行场景重建和其他物理世界测量任务的常见方法。事实上，它通常被称为视觉惯性里程计，简称
  VIO。VIO 最初是为空中机器人，例如无人机，以及车辆开发的，以实现自主应用。随着技术从仅依赖多镜头视觉发展到单镜头视觉数据，其应用范围扩大，并最终实现了智能手机上的增强现实。VIO
  的增强现实应用主要围绕“无标记 AR”展开，它可以在不需要“标记”的情况下在物理世界中增强数字对象。AR 标记是用于增强数字对象的唯一标识对象或图像；这可以是二维码、书中的图像，或人体/动物身体部位，例如面部、手部和脚部。为了实现基于标记的增强现实，需要执行各种视觉任务，例如对象姿态估计、标注和地标检测。


  #### 不同类型的增强现实


  今天常用的增强现实有几种类型；包括基于标记的、无标记的和基于地理位置的增强现实（AR）。这三种类型的核心目标都是在物理世界中增强数字对象；然而，实现每种类型所使用的技术各不相同。此外，每种类型的应用目的也不同。例如，基于标记的
  AR 需要预先定义的图像特征，我们可以利用这些特征来增强数字对象。其常见用例是面部滤镜。AR 面部滤镜在检测到的面部上或周围增强数字对象，并跟踪面部运动以相应地改变数字对象的位置（图
  2-5）。






  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_38_0.png)


  #### Figure 2-5. Face Detection and Landmark Estimation


  要实现 AR 面部滤镜，我们需要执行计算机视觉任务，例如人脸检测和人脸关键点检测/跟踪。人脸检测是从给定图像中分割并检测人脸的过程。人脸关键点检测是检测面部特征并跟踪变化的过程，例如眨眼、张嘴/闭嘴和面部表情。通过实时结合人脸的两种信息，我们就能成功地在人脸上叠加数字对象。除了使用检测到的人脸作为标记外，还有其他方法依赖于各种其他标记，例如简单的二维码、独特图像和定制物理物体（即瓶子、杯子、帽子等）。用于实现其他基于标记的
  AR 方法的处理技术源自计算机视觉中特征检测、跟踪和姿态估计的概念。随着我们在本章末尾接近实现过程，我们将更深入地介绍用于实现基于标记的 AR 的算法。


  无标记 AR 是一种稳健的技术，不需要对环境有任何先验知识；然而，实现它需要某些硬件。在无标记 AR 开发的早期，实现无标记 AR 所需的硬件类型并不为消费者所普遍拥有，例如立体相机和先进的
  IMU 设备。随着 AR 研究和开发的增加，我们看到了各种方法来减少对不常见硬件的使用，而转而依赖消费者广泛可用的硬件，例如低成本 IMU 设备和单镜头相机，今天智能手机中常见。在上一节中，我们简要介绍了今天大多数手机中如何使用视觉惯性里程计技术实现无标记
  AR，该技术利用 IMU 设备和相机检索到的信息来执行场景重建以及其他能够实现无标记 AR 的计算机视觉任务。无标记 AR 应用是无限的，并且有更多创造性和影响力应用的空间。今天，无标记
  AR 可用于测量物理物体并将体验模拟到物理世界。这些应用在教育、设计、旅游等众多行业产生了巨大影响。总之，无标记和基于标记的 AR 在根本上是相同的，但由于每种技术的限制，其应用完全不同。尽管这两种
  AR 方法的应用极其不同，但它们可以同时使用以实现更复杂的增强现实体验，这就引出了基于地理位置的 AR。


  基于地理位置的 AR 将无标记和基于标记的 AR 与地理位置数据集成，以增强并“钉”数字对象到特定的地理位置坐标（图 2-6）。


  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_40_0.png)


  Figure 2-6. Geolocation-Based AR


  #### Summary


  在本章中，我们讨论了一些与增强现实相关的基本概念。之后，讨论了不同类型的增强现实。


  AR 可以定义为一个系统，它结合了三个基本特征：真实世界和虚拟世界的结合、实时交互以及虚拟和真实物体的精确 3D 注册。


  任何基于 AR 的工具的核心组件都是处理器、传感器、输入设备，主要是显示器。显示器可以是智能手机、手持设备、智能眼镜或头戴式显示器（HMD）。输入设备是相机或网络摄像头。传感器包括陀螺仪和加速度计。


  在下一章中，我们将详细了解图像和视频处理的基础知识。

  '
- "### CHAPTER 3\n\n### Image and Video Processing Fundamentals\n\n本章将重点介绍图像和视频处理基础，包括所需数学、标准算法、实现选项，以及将实际示例实现到\
  \ C++ 应用程序中。\n\n### Mathematics Overview\n\n自第一台计算机发明以来，数学一直是计算机工作的基础。事实上，计算机的早期应用之一是在需要在一短时间内计算复杂数学问题的企业中。随着计算机硬件能力在几十年中不断提升，计算机在一秒钟内能够完成的复杂计算量急剧增加，使计算机能够轻松执行图像和视频处理，从而使计算机能够用于图形处理和音频处理等高速和高计算功率应用。在之前的章节中，我们简要介绍了图像如何显示、渲染和处理。在本节中，我们将介绍\n\
  \n使当今的图像和视频处理（也称为计算机视觉）和人工智能技术成为可能的数学基础。\n\n尽管计算机视觉和人工智能关系密切，但它们对数学的侧重点略有不同。下面的雷达图总结了这一论点。在下面的图中，你可以看到计算机视觉与人工智能/深度学习相比融合了不同的数学分支。计算机视觉比深度学习更大幅度地利用概率和统计（图\
  \ 3-1）。\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_42_0.png)\n\nComputer Vision\n\
  \nMachine Learning\n\n#### Figure 3-1. Computer Vision vs. Machine Learning\n\n\
  尽管计算机视觉和深度学习有很多共同点，但它们的主要关注点极其不同。我们在计算机视觉中的主要目标是调查和分析图像或视频，提出建议并验证它们。\n\n这些似乎是用于揭示数据中初看不可见的隐藏假设的方法。因此，为了比较和测试假设，我们必须完全依赖统计和概率概念（图\
  \ 3-2）。计算机视觉和机器学习都强调线性代数原理，因为它是所有复杂系统的起点。另一方面，多元微积分关注参数分析，这将是我们在本书中进一步讨论的所有深度神经网络背后的驱动因素。\n\
  \n![](img/7d8e54ee4578088e252f4c75b5cd4c88_43_0.png)\n\n#### Figure 3-2. Use of\
  \ Math in Computer Vision\n\n考虑一下。我们更喜欢数据挖掘技术中使用的数据是干净的，并且根据方法学准备好的。如果我们想端到端工作（计算机视觉\
  \ + 机器学习），我们应该学习和探索计算机视觉和人工智能应用所需的数学基础。\n\n在计算机视觉和机器学习中，数学并不是关于分析数据；而是关于理解正在发生的事情，为什么会发生，以及我们如何通过实验不同变量来获得我们期望的结果。下面的图表展示了给定变量的变化率；这也被称为上升除以运行、斜率公式，有时也被称为梯度。这使我们能够理解给定输入的变化上下文。\n\
  \n![](img/7d8e54ee4578088e252f4c75b5cd4c88_44_0.png)\n\n#### Graph for Rate of Change\
  \ of Variable\n\n对任何线性方程的几何解释和直觉在处理给定图像时至关重要。下面公式是梯度公式的标准表示：\n\n```\nGradient at\
  \ x ≈ Rise/Run = [f(x + Δx) - f(x)] / [(x + Δx) - x] = [f(x + Δx) - f(x)] / Δx\n\
  ```\n\n#### Rate of Change of Variables (Differentiation)\n\n这有助于我们解读这些令人困惑的陈述。\n\
  \n好吧，让我们转换我们的重点，理解为什么我们必须学习这些不同的数学分支，以及什么会是直观学习它们的良好来源。\n\n#### Image Processing\
  \ Basics\n\n目前，最热门的研究领域之一是深度学习。深度学习是一种机器学习和人工智能（AI）技术，它模仿人类获取某些类型知识的方式。与典型的机器学习算法线性不同，深度学习算法以日益复杂和抽象的层次构建。深度学习作为一个领域融合了多种学术学科，\n\
  \n\n\n包括计算机科学（图形学、算法、哲学、结构与体系结构）、数学（信息检索、机器学习）、工程学（机器人、语音、NLP、图像处理）、物理学（光学）、生物学（神经科学）以及心理学（认知科学），等等。\n\
  \n由于其跨领域的掌握能力，许多科学家都认为机器视觉为通用人工智能铺平了道路，因为它代表了对视觉环境及其上下文的相对理解。\n\n#### 那么什么是计算机视觉？\n\
  \n正式教材中的定义如下：\n\n- “从图像构建物理对象的明确、有意义的描述”（Ballard & Brown, 1982）。\n- “...从一个或多个数字图像计算三维世界的属性”（Trucco\
  \ & Verri, 1998）。\n- “...基于感知的图像对真实物理对象和场景做出有用决策”（Sockman & Shapiro, 2001）。\n\n\
  #### 为什么是计算机视觉？\n\n最明显的回答是，这一研究领域拥有日益增长的实用应用集合。以下是仅有的几个例子（图 3-3）：\n\n- 人脸识别：Snapchat\
  \ 和 Facebook 使用人脸检测算法来添加滤镜并在图像中识别你。\n- 图片检索：Google 图片使用基于内容的查询来定位合适的图像。算法会探索查询图像的内容，并根据最相关的内容返回结果。\n\
  - 游戏和控制：Microsoft Kinect 是一款出色的商用设备，在游戏中利用立体视觉。\n\n#### 计算机视觉的应用\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_46_0.png)\n\
  \n图 3-3. 计算机视觉的应用\n\n- 监控摄像头在公共场所很常见，用于追踪异常活动。\n- 指纹、虹膜和人脸匹配是最受欢迎的生物识别认证技术之一。\n\
  - 视觉仍然是检测智能车辆的道路信号、灯光和其他视觉特征的主要信息来源。\n\n计算机视觉涉及视觉识别，例如图像描述、定位和识别。\n\n#### 标准算法\n\
  \n这些最先进的视觉识别技术的效率由于神经网络和深度学习方法的最新进展而得到了极大提升。本书是学习深度学习架构以及它们在尖端机器视觉科学中如何使用的绝佳平台。在本书中，我们将介绍五种最重要的计算机视觉策略：卷积神经网络、AlexNet、基于区域的卷积神经网络（R-CNN）和\
  \ Fast R-CNN。此外，我们还将介绍每种策略可用于的主要深度学习模型和应用。\n\n#### 图像分类\n\n图像分类（图 3-4）的目标如下：我们得到一系列图像，所有图像都用单一类别标记，我们被要求为一组新的测试图像预测这些类别，并计算预测的准确率。视角变化、尺寸变化、类内变化、图像变形、图像遮挡、光照条件和背景杂乱都是该活动带来的问题。\n\
  \n![](img/7d8e54ee4578088e252f4c75b5cd4c88_47_0.png)\n\n图 3-4. 图像分类\n\n我们如何构建一个可以将图像分类到不同组别的算法？计算机视觉研究人员为此问题设计了数据驱动的解决方案。他们向计算机提供每个图像类别的多个示例，然后创建学习算法，让这些算法查看这些示例并学习每个类别的视觉外观，而不是尝试在代码中显式确定感兴趣的每个图像类别的外观。\n\
  \n换句话说，首先将标记好的图像训练数据集输入系统进行处理并据此创建分类模型。以下是图像分类流程的正式版本：\n\n- 作为输入提供包含 N 张图像的训练数据集，每张图像都标记为\
  \ K 个组之一；其中 N 是所有组中图像的总数，K 是分类模式中的组数。组代表图像所属的类别。\n- 然后我们使用这个训练包来教分类器如何对图像进行分类。\n\
  - 最后，我们通过让它为从未见过的新图像系列推断标签来衡量分类器的输出。这些图像的实际标签将与分类器预测的标签相等。\n\n卷积神经网络（CNNs）是最常用的图像识别架构。当你将图像输入网络并让网络对数据进行分类时，这是\
  \ CNN 的常见用例。CNN 通常以一个输入“扫描器”开始，该扫描器并非设计为一次处理所有训练数据（图 3-5）。例如，当处理 CNN 时，你不希望有一个包含\
  \ 10,000 个节点的层来输入一个 100 × 100 像素的文件。这将极其低效且在更大规模上不实用。\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_49_0.png)\n\
  \n##### 图 3-5. 卷积神经网络\n\n相反，你创建一个 10 × 10 扫描输入层，将图像的第一个 10 × 10 像素输入其中。数据传递后，将扫描器向右移动\
  \ 1 像素以输入下一个 10 × 10 像素。这种过程被称为滑动窗口。\n\n卷积层而非常规层用于处理输入数据。每个节点只关心其邻近范围内的单元。这些卷积层通常随着变厚而显得变小，这归因于可快速分割的输入因子。它们通常还具有池化层。一种流行的池化策略是最大池化，其中我们取例如\
  \ 2 × 2 像素并继续处理具有最多特定属性的像素。\n\nImageNet，一个近 120 万个高分辨率训练文件的数据集，如今被用于训练大多数图像识别技术。测试图像将以无初始标注的方式查看（即无分割或标签），算法将被要求创建标注以显示图像中存在哪些对象。来自牛津、INRIA\
  \ 和 XRCE 的领先计算机视觉团队在此数据集上测试了一些更好的当前计算机视觉方法。通常，计算机视觉解决方案使用多阶段管道，并在早期阶段通过调整几个参数进行手工调优。\n\
  \nAlex Krizhevsky（NIPS 2012），首届 ImageNet 竞赛的获胜者，构建了一个非常深的卷积神经网络，其类型由 Yann LeCun\
  \ 开创。其架构中有七个隐藏层，不包括任何最大池化层（图 3-6）。前两层是卷积层，最后几层是全局相关的。在每个隐藏层中，激活函数是经过整流的线性单元。这些单元比逻辑单元更具表达力且训练速度更快。此外，还使用了竞争性归一化来消除隐藏行为，当附近单元具有更强活动时。这有助于强度差异。\n\
  \n![](img/7d8e54ee4578088e252f4c75b5cd4c88_50_0.png)\n\n图 3-6. AlexNet\n\n就硬件而言，Alex\
  \ 使用两块 Nvidia GTX 580 GPU 来运行非常强大的卷积网络实现（超过 1000 个快速小核心）。GPU 非常适合矩阵-矩阵乘法并且具有大量内存带宽。这有助于它们在一周内训练网络，并在测试期间快速合并来自十个补丁的结果。随着核心变得更便宜且数据库变得更大，大型神经网络可以比传统\
  \ CV 网络更进一步。\n\n#### 目标检测\n\n输出特定对象的边界框和标记是广泛用于描述图像中对象的技术。这与分类/定位挑战不同，在该挑战中分类和定位应用于大量对象而非单一主导对象。对象分组只有两种类型：项目边界框和非对象边界框。例如，在汽车检测中，你必须检测给定图片中的所有汽车及其边界框（图\
  \ 3-7）。\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_51_0.png)\n\n图 3-7. 目标检测\n\n\
  如果我们使用滑动窗口技术来识别和定位图像，我们需要将 CNN 添加到图像的多个不同裁剪上。由于 CNN 将每个裁剪分类为实体或上下文，我们必须将 CNN 应用于大量位置和尺寸，这在计算上非常昂贵。\n\
  \n\n\n\n\n为了解决这个问题，神经网络理论家建议改用区域，即图像中可能包含外观“斑块状”特征的图像区域。\n\n这是一个相对容易进行的游戏。R-CNN（基于区域的卷积神经网络）是第一个推动它发展的模型。在\
  \ R-CNN 中，我们首先使用选择性搜索算法扫描输入图像以寻找潜在的伪影，产生 2,000 个区域建议（图 3-8）。然后，在所有这些区域建议之上运行 CNN。最后，我们将每个\
  \ CNN 的输出输入 SVM 以识别区域，并使用线性回归收紧对象的边界框。\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_52_0.png)\n\
  \n##### Figure 3-8. R-CNN Network\n\n本质上，我们将对象识别问题转化为图像分类问题。然而，有几个缺点：准备需要很长时间并且需要大量的磁盘空间，并且推理通常很缓慢。\n\
  \n快速 R-CNN 是 R-CNN 的直接后代，它通过进行两项改进来提高检测速度：（1）在提出区域之前进行特征提取，从而只需对整张图像运行一次 CNN，以及\
  \ 2）用 softmax 层替换 SVM，从而扩展神经网络进行预测而不是开发新模型。\n\n由于它只为整张图片训练一个 CNN，因此 fast R-CNN 在速度方面表现更好。另一方面，选择性搜索算法生成区域建议也需要很长时间。\n\
  \n因此，开发了更快的 R-CNN，并且它此后已成为基于深度学习的物体检测的经典标准（图 3-9）。它插入一个区域建议网络（RPN）来从特征中预测建议，用快速神经网络取代缓慢的选择性搜索算法。为了最大限度地减少整体推理过程的计算需求，RPN\
  \ 用于确定“在哪里”查找。RPN 快速高效地扫描每个位置，以决定该区域是否需要进一步处理。它通过生成 K 个边界框建议来实现这一点，每个建议都有两个分数，显示在每个位置存在项目的可能性。\n\
  \n![](img/7d8e54ee4578088e252f4c75b5cd4c88_53_0.png)\n\nFigure 3-9. Fast R-CNN\n\
  \n一旦我们有了它们，我们就将我们的区域想法直接输入到实际上是快速 R-CNN 的内容中。最后添加一个池化层、多个全连接层、一个 softmax 分类层和一个边界框回归器。\n\
  \n总体而言，faster R-CNN 在速度和准确性方面优于竞争对手。虽然未来模型将检测速度大幅提高，但只有少数模型能够以相当大的优势超越 faster R-CNN。换句话说，虽然\
  \ faster R-CNN 不是最简单或最快的物体检测过程，但它仍然是最有效的方法之一（图 3-10）。\n\n#### Faster R-CNN\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_54_0.png)\n\
  \nFigure 3-10. Faster R-CNN\n\n近年来，全球物体检测模式已转向更简单、更强大的检测系统。作为在整张图片上共享计算的一步，像 You\
  \ Only Look Once（YOLO）、Single Shot MultiBox Detector（SSD）和 Region-Based Fully\n\n\
  Convolutional Networks（R-FCNs）等方法变得可见。因此，这些策略使自己与三个 R-CNN 技术昂贵的子网络区分开来。这些模式背后的主要原因是停止让不同的算法孤立地专注于各自的子问题，这可能会增加训练时间并降低网络精度。\n\
  \n在给定场景中跟踪一个感兴趣点或多个对象的方法称为对象跟踪（图 3-11）。它历史上一直用于视频和现实世界遭遇中，其中结果是在对象最初识别后得出的。它现在对于自动驾驶应用（如\
  \ Uber 和 Tesla 的自动驾驶汽车）至关重要。\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_55_0.png)\n\
  \n##### Figure 3-11. Object Tracking\n\n根据观察范式，对象跟踪方法可分为两类：生成式和判别式。生成式方法，例如 PCA，使用生成模型来解释可见特征并最小化重建误差。\n\
  \n判别式方法将目标与背景区分开来；其准确性更可靠，并且越来越多地取代传统的跟踪方法。跟踪检测是判别过程的另一个术语，深度学习属于这一组。为了实现跟踪检测，我们在所有帧中检测候选对象，然后使用深度学习在候选对象中对目标对象进行分类。堆叠自编码器（SAE）和卷积神经网络（CNN）是两种可用于此的简单网络模型。\n\
  \nDeep Learning Tracker（DLT）是使用 SAE 进行监控任务的最常见深度网络，因为它允许离线预训练和在线微调。过程如下：\n\n- 通过对输入图像施加噪声并重建原始图像，堆叠去噪自编码器将实现更强大的函数表达能力。\n\
  \n要创建分类网络，将预训练网络的编码部分与分类器结合，然后使用从原始帧收集的正负样本微调网络，以区分当前实体与过去。DLT 使用粒子滤波器作为运动模型为当前帧创建候选补丁。分类网络为这些补丁生成似然分数，显示其分类的置信度，然后选择其中最高的补丁作为对象。\n\
  \n- DLT 采用最小阈值方法进行模型更新。\n\n由于其在图像识别和物体检测中的主导地位，CNN 已成为机器视觉和视觉识别的标准深度范式。通常可以训练大规模\
  \ CNN 作为分类器和跟踪器。一般来说。完全卷积网络跟踪器（FCNT）和多域 CNN 是两种基于 CNN 的跟踪算法的示例（MD Net）。\n\n- FCNT\
  \ 成功分析和利用 VGG 模型的函数映射，该模型是预训练的 ImageNet，得出以下结果：\n  - CNN 函数映射可用于监控和定位。\n  - 对于区分特定对象与其上下文的任务，通常\
  \ CNN 函数映射通常模糊或无关。\n  - 较低层编码更多判别属性以捕捉类内变化，而较高层捕捉对象类别上的语义概念。\n\n由于这些结果，FCNT 构建了一个特征发现网络，以在\
  \ VGG 网络的 conv4-3 和 conv5-3 层上选择最重要的特征映射。然后它为来自两个层的选定特征映射分别创建两个额外通道（称为 SNet 和 GNet），以防止在嘈杂的特征映射上过拟合。GNet\
  \ 捕捉对象的类别细节，而 SNet 将对象与相似的外观上下文区分开来。\n\n为了获得对象的热力图，两个网络都使用第一帧中指定的边界框进行初始化，对于新帧，以前一帧中对象位置为中心的感兴趣区域（ROI）被裁剪并传播。最后，分类器接收来自\
  \ SNet 和 GNet 的两个热力图进行预测，并且跟踪器根据是否存在干扰物确定将使用哪个热力图来产生最终跟踪结果。FCNT 流程如下所示（图 3-12）。\n\
  \n![](img/7d8e54ee4578088e252f4c75b5cd4c88_58_0.png)\n\n##### Figure 3-12. Convolutional\
  \ Network Pipeline\n\n#### Summary\n\n本章涵盖了计算机视觉的基础数学，包括线性代数和多元微积分。它还涵盖了为什么要学习计算机视觉。本章涵盖的标准算法是图像分类、物体检测、实例分割和物体跟踪。它还涵盖了计算机如何读取图像。\n\
  \n图像分类是根据特定规则对图像中像素或向量的组进行分类和标记的过程。\n\n物体检测是一种计算机视觉技术，允许我们在图像或视频中识别和定位物体。\n\n语义分割描述了将图像的每个像素与类别标签关联起来的过程（例如花朵、人、道路、天空、海洋或汽车）。\n\
  \n在下一章中，我们将讨论人脸检测/识别和人体检测/跟踪。\n\n\n\n\n"
- "### CHAPTER 4\n### 计算机视觉应用\n\n本章将重点介绍各种计算机视觉应用、技术的发展演变，以及如何搭建一个 C++ 视觉应用。\n\n####\
  \ 概述\n\n在计算机视觉中，模拟人眼使计算机能够以与人类相同的方式处理和识别视频和照片中的事物，从风景到物体、运动等等。计算机视觉直到最近才以小规模运行。如今，深度学习推动了我们在日常使用的许多软件中看到的先进计算机视觉。事实上，深度学习最受欢迎的分支之一就是计算机视觉；因此，深度学习在实现和执行复杂的计算机视觉操作方面发挥着至关重要的作用。\n\
  \n如果让你描述图 4-1 中的物体/事物，你可能会提到这张图片中有“果汁、篮子、男孩、女孩、男人、女人、草等”。然后如果让你描述图片中发生了什么，你的回答很可能是“这是一个家庭正在享受野餐”，几乎不需要任何努力。这些是大多数六七岁以上儿童都能完成的两个非常基本任务。然而，从上下文来看，这是一个非常复杂的过程。人眼视觉是我们视力中极其复杂的有机组成部分。我们的概念模型、我们对抽象解释的概念，以及我们在与宇宙的数十亿次、万亿次相遇中所考虑的上下文发生，都被纳入其中。\n\
  \n![](img/7d8e54ee4578088e252f4c75b5cd4c88_60_0.png)\n\n图 4-1. 彩色图像（RGB 图像）\n\n\
  数码相机呈现的图像分辨率具有远超人类视觉系统的细节。以非常高的精度，颜色的变化也可以被观察和量化。但对这些图片内容进行理解是计算机几十年来面临的挑战。\n\n\
  我们作为人类，很容易体验到周围世界的三维特性。与此同时，计算机视觉研究人员已经开发出数学方法来恢复摄影中物体的三维结构和外观。\n\n#### 计算机视觉的应用\n\
  \n计算机视觉在其解决的问题上具有相关性。这是数字世界中最重要的发展之一。计算机视觉帮助车辆实现自主驾驶并感知周围环境。摄像头记录汽车的不同角度并将信息输入计算机视觉软件，然后该软件通过处理图像实时找到道路限制和交通灯，并检测与其他汽车、行人和物体的距离。在高速公路和街道上，自动驾驶车辆随后会导航其行驶路线，避免撞击障碍物，并安全地将乘客送达目的地。\n\
  \n计算机视觉中的一个常见功能是人脸识别。我们通过计算机视觉技术将人们的人脸照片与他们的身份进行匹配。在图像中，计算机视觉算法检测人脸特征并将其与数据库中的人脸档案进行比较。为了验证其所有者的身份，消费设备使用面部识别。为了标记用户，社交媒体应用程序使用面部识别。\n\
  \n在计算机视觉中，帮助平板电脑、智能眼镜和智能手机等计算机系统在现实世界图片中叠加虚拟物体的技术在增强现实和混合现实中发挥着重要作用。AR 设备使用计算机视觉来识别现实世界中的物体，以便在设备的显示器上定位虚拟物体。例如，AR\
  \ 系统可能会使用计算机视觉算法来检测平面，这些平面对于检测深度和测量以及定位非常重要。\n\n像 Google Photos 这样的在线照片库使用计算机的“眼睛”来检测并自动按主题类型对照片进行分类。你将节省大量时间，而无需为你的照片和说明应用标签。该技术还允许用户通过输入他们想要的内容形式来扫描视频小时数，而不是手动观看全长视频。计算机视觉在健康科学的进步中也发挥了至关重要的作用。计算机视觉算法可以帮助医疗自动化任务，包括在皮肤图像中识别癌性肿块。\n\
  \n计算机视觉中还存在其他更复杂的应用。例如，想象一个智能家居监控摄像头不断将你家视频发送到云端，并允许你在远程级别上显示图像。你可以设置一个带有计算机视觉的云框架，以便在发生任何可疑情况时立即提醒你，房子里任何起火的东西。这将为你节省大量时间，确保你可以用一双警惕的眼睛看着你的房子。美国军方现在正在使用计算机视觉处理由摄像头和无人机记录的视频内容。\n\
  \n如果你在此示例中更进一步，你会注意到保护程序只存储视觉算法标记为异常的视频。这将使我们能够最小化存储在云中的内容大小，因为在几乎所有情况下，你的安全摄像头照片都是无害的，不需要检查。\n\
  \n在计算机视觉能够实现的一些深度学习活动出现之前，开发人员和人工操作员需要大量的主动性和手动编码。例如，如果你想识别人脸，你必须执行以下步骤：\n\n- 1.\
  \ 通过建立数据库，以特定格式收集每个主体的图像。为每张图片注释图像并输入大量数据项，例如眼睛之间的距离、鼻梁宽度、上唇与鼻子的距离，以及数百项进一步的测量值，这些测量值定义了每个人的特定特征。\n\
  - 2. 捕获图像。如果你使用图片或视频内容，你将不得不捕获新文件。然后必须重新进行测量过程以标记图片中的关键点。你还必须考虑图像的角度。\n\n程序最终会将这些与数据库中的内容进行匹配，并比较在新图像中找到的测量值，如果它们符合任何跟踪档案。事实上，这项工作是手动进行的，自动化程度很低，误差率仍然很高。\n\
  \n机器学习是解决计算机视觉问题的另一种方法。有了机器学习，开发人员不再需要在视觉应用中为每个规则手动编写代码。相反，“特征”的编程包括可以检测此类图像模式的较小应用程序。然后算法使用统计学习算法（如线性回归、决策树和逻辑回归）来检测趋势、识别独特特征并检测对象。\n\
  \n深度学习为机器学习提供了一种全新的方式。深度学习依赖于神经网络，可以克服任何可以通过示例说明的问题。神经网络包含特定类别数据的许多表示，可以从这些示例中提取常见模式并将其转换为数学方程，有助于识别潜在数据项。\n\
  \n构建深度学习程序只涉及选择一个预先构建的算法或使用预期检测的个人的面部示例创建一个。神经网络可以在没有额外功能和测量说明的情况下，仅凭适当的示例识别人脸。\n\
  \n深度学习是计算机视觉的强大方法。在某些情况下，开发成功的深度学习算法包括选择大量命名训练数据和限制，例如神经网络形式、网络的神经层数以及训练网络的次数。深度学习和机器学习都比以前的形式更容易、更快地实现。\n\
  \n随着硬件和云计算基础设施的可用性和进步，深度学习被用于大多数当前机器视觉系统，如自动驾驶车辆、人脸识别和癌症识别。\n\n\n\n\n\n#### 读取、写入和显示图像\n\
  \n计算机使用数字如照片和文本来查看和处理一切。图像的读取和写入对于任何计算机视觉项目都很重要。而使用 OpenCV 库，这项工作变得简单得多。\n\n矩阵中的一个整数决定了该特定位置的像素强度。在上图中，我们显示了灰度图像及其右侧的像素值强度等价物（图\
  \ 4-2），在该示例中只有一个属性，即给定像素位置处的黑色强度。OpenCV 中 imread 的功能以 BGR 读取图像。在实现 imread 函数时，我们可以选择以不同形式读取给定图像：彩色、灰度或未更改。下面列表演示了需要传递给函数的实际值：\n\
  \n- 1. Cv2.IMREAD_COLOR\n- 2. Cv2.IMREAD_GRAYSCALE\n- 3. Cv2.IMREAD_UNCHANGED\n\n\
  ![](img/7d8e54ee4578088e252f4c75b5cd4c88_64_0.png)\n\n图 4-2. 二维连续图像中的行列划分\n\n####\
  \ 更改颜色空间\n\n以便于重现的方式，表达颜色的协议是一种颜色空间。灰度图像对单个像素有一个像素值，而彩色图像对单个像素有三个值，即红色（R）、绿色（G）和蓝色（B），通常称为\
  \ RGB。\n\n在大多数情况下，计算机视觉使用 RGB 格式处理图像。今天，OpenCV 库读取图像时的默认格式是 RGB，然而它以 BGR 存储图像数据，这与\
  \ RGB 相似，但仅在像素描述的顺序上有所不同。因此，使用 OpenCV 读取图片时，必须将图像颜色字段从 BGR 转换为 RGB（图 4-3）。\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_65_0.png)\n\
  \n图 4-3. 图像的 RGB 分量\n\n#### 调整图像大小\n\n训练模型对机器学习任务有固定的输入大小。计算机视觉模型也同样适用。我们在训练模型时应具有相同大小的图像。OpenCV\
  \ 提供方便的方法来放大和缩小图像。当我们需要将图像转换为深度学习算法的输入形式以进行训练时，这些方法很有帮助（图 4-4）。\n\n#### 图 4-4. 图像的不同分辨率/比例\n\
  \n![](img/7d8e54ee4578088e252f4c75b5cd4c88_66_0.png)\n\n#### 旋转图像\n\n数据增强方法是最常用的方法之一，而图像/数据增强中一种易于引入的技术是旋转（图\
  \ 4-5）。使用这种技术，我们将能够为深度学习训练模型构建更多示例。数据增强使用可用数据样本并通过旋转和平移构建它们的新副本。\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_66_1.png)\n\
  \n![](img/7d8e54ee4578088e252f4c75b5cd4c88_66_2.png)\n\n#### 图 4-5. 图像旋转\n\n####\
  \ 位运算\n\nAND、OR、XOR 和 NOT 是位运算。这些运算非常有帮助，并且与掩码一起使用，当我们想从输入图像中移除我们希望的区域时（图 4-6）。\n\
  \n![](img/7d8e54ee4578088e252f4c75b5cd4c88_67_0.png)\n\n图 4-6. 位运算\n\n我们可以使用分水岭算法测量图像中的分割掩码，并在使用位“AND”运算消除图像背景并获取我们需要的区域后，查看我们提供的图像。\n\
  \n#### 检测边缘\n\n边缘是非常有用的图像特征，可用于各种目的，例如图像识别和物体定位。图片中物体的边缘特征也可以通过深度研究模型确定。它们还用于锐化图像（图\
  \ 4-7）。\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_68_0.png)\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_68_1.png)\n\
  \n图 4-7. 图像锐化\n\n#### 图像滤波\n\n为了模糊图像，我们使用高斯滤波器，它根据邻近像素与所考虑像素的距离给予它们不同的权重（图 4-8）。\n\
  \n![](img/7d8e54ee4578088e252f4c75b5cd4c88_68_2.png)\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_68_3.png)\n\
  \n图 4-8. 原始图像和高斯核处理后的图像\n\n要应用高斯滤波器，使用核进行图像滤波。核用于确定图像中给定部分的点积。当计算新像素值时，核的中心与像素重叠。附近的像素值乘以必要的核值。分配给与核中心重合的像素一个值。\n\
  \n#### 人脸检测\n\nOpenCV 支持基于 Haar 级联的物体识别。Haar 级联是基于机器学习框架的分类器，测量边缘、线条等各种特征。机器通过视网膜检测人脸（图\
  \ 4-9）。\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_69_0.png)\n\n图 4-9. 人脸检测的边界框\n\
  \n#### 计算机视觉算法\n\n用于对照片进行分类或识别的技术通常表示为一组数据点，用于预测特定类别。图像标注是分类的一个子问题，其中整张图片被标记为一个类别。使用图像标注技术，人手动将整张图像标记为一组类别。一旦我们有一组带标签的图像数据，我们就可以应用匹配算法将新的未标记用户输入图像与我们的数据集进行比较。一旦找到匹配或相似的带标签图像，我们就返回相应的类别集合。\n\
  \n你可以将特定图片分类到无数个组中。考虑一个手动过程，其中图像被匹配并按相似特征排序，但事先不知道你在寻找什么。这显然是一项繁重的任务。为了更清楚，假设有数十万张图像。为了有效地做到这一点，显然需要一个自动化系统。\n\
  \n对图像进行分类的许多任务需要物体的照片。CIFAR-10 和 CIFAR-100 是两个常见的数据集，图片分别需要分类到 10 个和 100 个组中。这些数据集是行业标准，并且可供公众使用。\n\
  \n#### 深度学习中的图像分类\n\n深度照片识别的架构通常包含卷积层，形成卷积神经网络（CNN）。对于 CNN，通常将图像输入网络并将细节划分为网络类别。CNN\
  \ 从一个输入“扫描器”开始，并非所有训练数据同时被解析。例如，你不希望一个 10,000 节点的层处理一个 100 × 100 像素的图像。相反，你创建一个\
  \ 10 × 10 输入层，接受前 10 × 10 图像像素。你在输入传输前将扫描器向右移动 1 个像素，然后输入下一个 10 × 10 像素。这种技术使过程更高效。\n\
  \n#### 目标检测\n\n目标检测是一种机器视觉过程，用于在图片或视频中查找和区分物体。物体识别具体是在检测到的物体周围绘制边界框以确定它们在给定场景中的位置（或观察它们如何移动）。目标识别通常与图像识别混淆，因此在继续之前我们必须解释它们之间的区别。图像识别，也称为图像分类，为图像分配一个名称。狗的图片代表“狗”标记。“狗”标记仍然适用于两只狗的图片。另一方面，目标识别在每只狗周围绘制边界框并将框命名为“狗”。这指定了模型预测中给定物体的位置以及应添加的标记/标题。因此，目标检测提供了比识别/分类更多的图像信息（图\
  \ 4-10）。\n\n\n\n\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_72_0.png)\n\nFigure\
  \ 4-10. Object Recognition/ Detection\n\n#### Object Detection Types\n\n目标识别通常可以分为机器学习方法和深度学习方法。\n\
  \n计算机视觉技术使用传统的基于机器学习的方法来识别像素的类别，这些像素可能属于一个物体，通过分析图像的各种属性，例如颜色直方图或边界。然后将这些特征整合到一个回归模型中，该模型预测实体的位置和名称。\n\
  \n深度学习方法则基于卷积神经网络（CNN），用于识别需要单独提取的工件。\n\n由于深度学习方法已成为目标识别的现代方法，因此对于本次实现的目的，我们将重点关注这些技术。\n\
  \n#### Importance of Object Detection\n\n物体 ID 与其他相关的计算机视觉技术不可分割地联系在一起，例如模式识别和图像分割，这些技术帮助我们识别和感知图像或视频场景。\n\
  \n尽管如此，仍存在根本差异。图像检测仅为检测到的物体创建类别标签，而图像分割则提供场景组件的像素级描述。目标识别通过具备在图像或视频中识别物体的独特能力，与这些其他实践区分开来。这随后使您能够计算这些物体并以能够识别某些主要区别的独特能力对它们进行映射；我们可以看出它可以以多种方式整合：\n\
  \n- Counting audience\n- Cars self-driving\n- Surveillance recording\n- Detection\
  \ of the mask\n\n#### Detection of Anomaly\n\n这显然不是一个完整的列表，但它包括了目标识别影响我们未来的一些主要问题。\n\
  \n#### Object Tracking\n\n在任何给定场景中，这适用于跟踪一个或多个移动物体（Figure 4-11）。这在历史上是在最初观察到物体后实现的，以跟踪现实世界的遭遇。它是\
  \ Uber 和 Tesla 等公司即将推出的自动驾驶汽车中非常重要的一部分。可以将目标检测分为两类：生成式和有偏见的。生成式方法将描述可见特征并在寻找主题时最小化重建误差。\n\
  \n![](img/7d8e54ee4578088e252f4c75b5cd4c88_74_0.png)\n\nFigure 4-11. Object Detection\
  \ Bounding Boxes\n\n歧视性过程更高效、更准确。它可用于区分问题和含义，并且一直是监控的首选方式。它被称为通过检测跟踪。\n\n#### Semantic\
  \ Segmentation\n\n将图像中属于同一物体类别的部分聚类的方法称为语义分离或图像分割。由于它按类别进行分类，每个图像像素都具有某种像素预览。Cityscapes、PASCAL\
  \ VOC 和 ADE20K 是此任务的标准之一。Mean IoU 和像素精度指标通常用于测试模型。Mean IoU 用于测试模型。更准确地说，语义图像分割的目的是标记图像中每个像素所描绘的内容对应的类别。这种方法通常被称为密集预测，因为我们为图像中的每个像素进行预测。\n\
  \n需要记住的一个重要点是，同一类别的实例不会被区分；我们只考虑每个像素的类型。换句话说，如果您的输入图像中有两个属于同一组的物体，它们不会自动被分割图区分开来作为单独的物体。存在另一种类型的模型，称为示例分割模型，它区分同一类别的不同物体。\n\
  \n对于许多活动，分割模型很有帮助。\n\n#### Vehicles That Are Automatic\n\n为了使自动驾驶汽车能够安全地融入我们当前的高速公路，我们需要为汽车配备必要的感知能力来考虑其周围环境。\n\
  \n#### Medical Diagnostic Picture\n\n机器将改善放射科医生进行的研究工作，显著减少诊断测试所需的时间（Figure 4-12）。\n\
  \n![](img/7d8e54ee4578088e252f4c75b5cd4c88_76_0.png)\n\nFigure 4-12. Sample Segmented\
  \ Image\n\n#### Instance Segmentation\n\n对于图像中每个识别出的物体，实例分割区分每个物体的实例。\n\n实例分割为每个图像像素分配一个标记。它用于计算给定图像中项目的数量，例如图像分割任务。\n\
  \n#### Requirements\n\n这里目标检测的目标是识别特定物体并为每个实体示例放置一个边界框。\n\n每个示例都被分割。目标是定义固定类别集合中的每个像素，而不区分物体实例。\n\
  \nMask R-CNN 是一种深度学习技术，它扩展了 R-CNN，更专注于实例分割。\n\nR-CNN 和 Faster R-CNN 有什么新变化？\n\n\
  Mask R-CNN 还有另一个分支，用于预测每个字段或感兴趣区域（ROI）的像素到像素分割。\n\nR-CNN 不同步输入网络像素以提高速度。Faster R-CNN\
  \ 产生两个输出：\n\n- Class symbol\n- Each applicant’s offset bounding box\n\nMask R-CNN\
  \ 的三个输出是\n\n- Class symbol\n- Each applicant’s offset bounding box\n- Mask object\n\
  \nMask R-CNN 和 Faster R-CNN 分支在这里用于边界的分组和回归。\n\n为了删除图像特征，我们可以使用 ResNet 101 深度学习架构。\n\
  \n两者都使用网络区域提议来建立感兴趣的区域（RPN）。\n\n#### Work on Image Reconstruction\n\n想象一下，你有一张旧照片，随着时间的推移，照片的某些部分开始侵蚀。这是一张非常珍贵的照片，所以你想恢复它。这就是图片的修复。为了提出模型必须学习恢复和增强的图像的损坏副本，数据集通常包含现有图片。在\
  \ IBM 和 Pinterest 等企业的引领下，两个行业都在大力投资计算机视觉研究。尽管计算机视觉功能强大，但它以黑箱决策而臭名昭著，因此仍然存在安全问题。这就是人们怀疑使用信息来预测他们的一举一动并对信用风险、健康状况以及许多其他人类选择等事项做出决定的计算机的原因。尽管如此，随着人工智能的快速发展和安全需求的增加，我们应该希望解决某些问题来缓解我们的隐私问题。\n\
  \n#### Implementing Vision Applications\n\n##### A) Face Detection/Recognition\n\
  \n此程序在此使用 OpenCV 库在网络摄像头馈送或本地保存的视频剪辑中检测人脸。此处的代码实时识别或监控人脸。它借助预训练的 XML 分类器来实现这一点。该程序中使用的分类器已编程了面部特征。为了检测各种物体，可以使用分类技术。\n\
  \n要运行程序，您需要执行以下操作：\n\n- 1. 在本地计算机上，必须配置 OpenCV。\n- 2. 在程序运行之前，必须定义分类器 XML 文件的路径。这些\
  \ XML 文件位于 OpenCV 位置“OpenCV/data/haarcascades”中。\n- 3. 在捕获时，使用“0”作为值。要运行网络摄像头流，请键入\
  \ open (0)。\n- 4. 提供视频文件的路径以用于人脸检测，(capture.open(“path to video”))，例如。\n\n#### Implementation\n\
  \n```\n// CPP program to detects face in a video\n\n// Include required header files\
  \ from OpenCV directory\n#include \"/usr/local/include/opencv2/objdetect.hpp\"\n\
  #include \"/usr/local/include/opencv2/highgui.hpp\"\n#include \"/usr/local/include/opencv2/imgproc.hpp\"\
  \n#include <iostream>\n\nusing namespace std;\nusing namespace cv;\n\n// Function\
  \ for Face Detection\nvoid detectAndDraw( Mat& img, CascadeClassifier& cascade,\n\
  CascadeClassifier& nestedCascade, double scale );\nstring cascadeName, nestedCascadeName;\n\
  \nint main( int argc, const char** argv )\n{\n    // VideoCapture class for playing\
  \ video for which faces to be detected\n    VideoCapture capture;\n    Mat frame,\
  \ image;\n\n    // PreDefined trained XML classifiers with facial features\n   \
  \ CascadeClassifier cascade, nestedCascade;\n    double scale=1;\n\n    // Load\
  \ classifiers from \"opencv/data/haarcascades\" directory\n    nestedCascade.load(\
  \ \"../../haarcascade_eye_tree_eyeglasses.xml\" );\n```\n\n在此代码部分，您需要包含 OpenCV 目录中的所需头文件并加载分类器。\n\
  \n```\n// Change path before execution\ncascade.load( \"../../haarcascade_frontalcatface.xml\"\
  \ );\n```\n\n之后，在执行之前更改“cascade.load”中的路径。\n\n\n\n\n// 执行前更改路径\ncascade.load( \"\
  ../../haarcascade_frontalcatface.xml\" );\n\n// 开始视频..1) 0 表示网络摄像头 2) \"视频路径\" 表示本地视频\n\
  capture.open(0);\nif( capture.isOpened() )\n{\n    // 从视频中捕获帧并检测人脸\n    cout <<\
  \ \"Face Detection Started....\" << endl;\n    while(1)\n    {\n        capture\
  \ >> frame;\n        if( frame.empty() )\n            break;\n        Mat frame1\
  \ = frame.clone();\n        detectAndDraw( frame1, cascade, nestedCascade, scale\
  \ );\n        char c = (char)waitKey(10);\n\n        // 按 q 退出窗口\n        if( c\
  \ == 27 || c == 'q' || c == 'Q' )\n            break;\n    }\n    else\n       \
  \ cout<<\"Could not Open Camera\";\n    return 0;\n}\n\n使用 0 启动网络摄像头流。之后，人脸检测将开始。\n\
  \n```\nvoid detectAndDraw( Mat& img, CascadeClassifier& cascade,\n             \
  \       CascadeClassifier& nestedCascade,\n                    double scale)\n{\n\
  \    vector<Rect> faces, faces2;\n    Mat gray, smallImg;\n\n    cvtColor( img,\
  \ gray, COLOR_BGR2GRAY ); // Convert to Gray Scale\n    double fx = 1 / scale;\n\
  \n    // Resize the Grayscale Image\n    resize( gray, smallImg, Size(), fx, fx,\
  \ INTER_LINEAR );\n    equalizeHist( smallImg, smallImg );\n\n    // Detect faces\
  \ of different sizes using cascade classifier\n    cascade.detectMultiScale( smallImg,\
  \ faces, 1.1,\n        2, 0|CASCADE_SCALE_IMAGE, Size(30, 30) );\n```\n\n这段代码使用级联分类器检测不同尺寸的人脸。\n\
  \n```\nfor ( size_t i = 0; i < faces.size(); i++ )\n{\n    Rect r = faces[i];\n\
  \    Mat smallImgROI;\n    vector<Rect> nestedObjects;\n    Point center;\n    Scalar\
  \ color = Scalar(255, 0, 0); // Color for Drawing tool\n    int radius;\n\n    double\
  \ aspect_ratio = (double)r.width/r.height;\n    if( 0.75 < aspect_ratio && aspect_ratio\
  \ < 1.3 )\n    {\n        center.x = cvRound((r.x + r.width*0.5)*scale);\n     \
  \   center.y = cvRound((r.y + r.height*0.5)*scale);\n        radius = cvRound((r.width\
  \ + r.height)*0.25*scale);\n        circle( img, center, radius, color, 3, 8, 0\
  \ );\n    }\n    else\n        rectangle( img, cvPoint(cvRound(r.x*scale), cvRound(r.y*scale)),\n\
  \            cvPoint(cvRound((r.x + r.width-1)*scale),\n            cvRound((r.y\
  \ + r.height-1)*scale)), color, 3, 8, 0 );\n    if( nestedCascade.empty() )\n  \
  \      continue;\n    smallImgROI = smallImg( r );\n```\n\n这段代码通过检测形状在人脸周围绘制一个圆，并使用标量颜色作为绘图工具。\n\
  \n```\nnestedCascade.detectMultiScale( smallImgROI, nestedObjects, 1.1, 2, 0|CASCADE_SCALE_IMAGE,\
  \ Size(30, 30) );\n```\n\n这会从输入图像中检测眼睛。\n\n```\nfor ( size_t j = 0; j < nestedObjects.size();\
  \ j++ )\n{\n    Rect nr = nestedObjects[j];\n    center.x = cvRound((r.x + nr.x\
  \ + nr.width*0.5)*scale);\n    center.y = cvRound((r.y + nr.y + nr.height*0.5)*scale);\n\
  \    radius = cvRound((nr.width + nr.height)*0.25*scale);\n    circle( img, center,\
  \ radius, color, 3, 8, 0 );\n}\n```\n\n此循环将在眼睛周围绘制一个圆。\n\n```\n}\n}\n\n// Show Processed\
  \ Image with detected faces\nimshow( \"Face Detection\", img );\n}\n```\n\n函数 *imshow*\
  \ 将在检测到人脸时处理图像，如以下输出图像所示：\n\n![](img/7d8e54ee4578088e252f4c75b5cd4c88_82_0.png)\n\
  \n#### B) 身体检测/跟踪\n\n跟踪是在视频中逐帧寻找物体的过程。虽然含义似乎直接，但跟踪确实是计算机视觉和机器学习中一个极其宽泛的概念，其中包含概念相关但技术上不同的概念。例如，目标跟踪涵盖了许多以下不同但相互关联的概念：\n\
  \n- 密集光流：此类算法有助于计算视频帧中每个像素的运动矢量。\n\n稀疏光流：Kanade-Lucas-Tomasi (KLT) 特征跟踪是其中一种算法，它跟踪图片中某些特征点的位移。\n\
  \n卡尔曼滤波：一种常用的信号处理算法，利用先前的运动知识来预测移动物体的位置。导弹的制导是该算法最早的应用之一！“引导阿波罗 11 号登月舱下降的机载计算机具有卡尔曼滤波器”，根据文章所述。\n\
  \n均值漂移和 Camshift：这些算法可用于找到密度函数的最大值。它们也用于跟踪过程中。\n\n单目标跟踪器：在此类跟踪器中，第一帧用矩形标记出我们希望跟踪的物体的位置。然后使用跟踪算法在后续帧中跟踪该物体。此类跟踪器通常与物体检测器结合使用于实际应用中。\n\
  \n多目标跟踪算法：使用快速物体检测器时，最好从每一帧中检测多个物体，并使用跟踪算法来确定每一帧中的矩形是否与下一帧中的矩形相对应。\n\n检测与跟踪：如果你使用过\
  \ OpenCV 人脸检测，你会发现它在实时中运行或可以立即在每一帧中发现人脸。为什么要在初始位置进行跟踪？让我们看看为什么你需要在剪辑中跟踪物体，而不是仅仅进行重复检测。\n\
  \n跟踪比检测更快：与检测算法相比，跟踪算法通常更快。原因很简单。虽然跟踪一个在上一帧中已观察到的物体时，我们拥有关于该物体存在的大量信息。我们现在知道前一帧的位置，以及移动位置和速度。因此，在下一帧中，我们将利用所有这些知识来估计物体所在的位置，或者在预测位置周围进行小范围搜索以精确放置物体。有效的跟踪算法可以利用它在整个过程中对物体的所有了解，而检测算法总是从零开始。因此，在构建这样一个有效的方法时，物体检测算法通常每隔\
  \ n 帧运行一次，而跟踪算法用于 n-1 帧（n 减 1，其中 n 为视频中的总帧数）。你可以在第一帧中检测到物体后就跟踪它。虽然在我们有额外数据时跟踪有优势（即大量图像或视频），但如果物体在较长时间内被障碍物遮挡或移动速度过快以至于跟踪算法无法跟上，它仍可能丢失和遗漏。跟踪算法也常会出现错误，例如跟踪物体的边界框会逐渐偏离。检测算法经常被应用来解决这些跟踪算法的问题。训练检测算法的一个巨大例子用于其物体。因此，它们对物体的特定类别非常了解。另一方面，跟踪算法最了解的是我们一直在跟踪的类别的特定实例。\n\
  \n当检测失效时，跟踪会提供帮助：当在剪辑中使用人脸检测器但物体遮挡了人的脸时，它很可能会失败。另一方面，强大的跟踪算法可以在一定程度上处理形变。\n\n跟踪保留了身份：物体检测会输出包含物体的矩形序列。然而，该物体没有身份。例如，检测红色点的检测器可以在这里的剪辑中发出指向每一帧中检测到的每个点的矩形。这会在第一帧中产生一系列新的矩形。特定点可能在第一帧中以数组中的索引\
  \ 10 的矩形表示，而在第二帧中以索引 17 表示。当我们对单帧使用检测时，我们无法确定哪个矩形指的是哪个物体。\n\n\n\n\n\n##### OpenCV\
  \ Tracking API\n\nOpenCV 4 包含一个跟踪 API，具有多种配置用于单个目标跟踪算法。BOOSTING、MIL、KCF、TLD、MEDIANFLOW、GOTURN、MOSSE\
  \ 和 CSRT 是 OpenCV 4.2 中包含的八个跟踪器。在本节中我们将进一步阐述每种配置的差异以及优缺点。\n\n**需要考虑：** 只有以下六个跟踪器在\
  \ OpenCV 3.2 中实现：BOOSTING、MIL、TLD、MEDIANFLOW、MOSSE 和 GOTURN。以下五个跟踪器在 OpenCV 3.1\
  \ 中实现：BOOSTING、MIL、KCF、TLD 和 MEDIANFLOW。BOOSTING、MIL、TLD 和 MEDIANFLOW 是 OpenCV 3.0\

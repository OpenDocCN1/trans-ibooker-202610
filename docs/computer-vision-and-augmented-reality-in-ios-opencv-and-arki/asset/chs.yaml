  \n我们将在本部分中查看一些不同的跟踪算法。目标是获得对每个跟踪器的实际了解，而不是一小部分深奥的理论知识。\n\n首先，我将介绍一些基本的跟踪概念。我们的跟踪目标是在准确跟踪（或大约所有）先前帧中的对象后，在当前帧中定位该对象。运动模型似乎只是一个很好的说法，即你知道对象在后续帧中的位置和速度（速度\
  \ + 移动方向）。除非我们无法检测或分析对象，否则我们可以根据当前运动模型估计新位置；因此，了解对象是什么对于实时检测其位置至关重要。你可以创建一个描述对象外观的外观模型。此外观模型可用于在运动模型预测位置的小邻域内搜索，以更准确地预测对象的位置。正例（对象）和负例（上下文）被输入到分类器中以训练它。让我们看看不同的跟踪算法如何解决在线训练问题。\n\
  \n##### BOOSTING Tracker\n\n该跟踪器基于 AdaBoost 的在线版本，这是基于 Haar 级联的人脸检测器的内部算法。该分类器必须在运行时针对对象的正例和负例进行训练。在新帧中，分类器在前一个位置附近的每个像素上运行，并记录分类器的分数。分数最高的像素就是对象的新位置。因此，我们现在又有一个分类器的正例。随着更多帧的到来，分类器会用新信息进行更新。\n\
  \n优点：其算法已有十多年历史并且仍然有效，但在有其他专用跟踪器（MIL、KCF）可用的情况下，我想不出更好的用途，它们遵循类似的原理。\n\n缺点：跟踪方面的输出平平。它并不总是能理解何时跟踪不起作用。\n\
  \n##### MIL Tracker\n\n它与 BOOSTING 跟踪器相似。主要区别在于，与其仅将对象的当前位置作为正例来查找，此方法会在当前位置周围的小社区中搜索多个可能的正例。在\
  \ MIL 中，你不指定正例和负例，而是指定正例和负例“包”。正例包的图像数组并不完全由正例组成。相反，正例包中只需要一张图片是好的例子！在我们的例子中，正例包包含基于对象当前位置的补丁以及其周围小社区的补丁。\n\
  \n优点：结果很优秀。它不会像 BOOSTING 跟踪器那样漂移，因此在部分遮挡时表现非常出色。如果你在 OpenCV 3.0 上，这可能是最好的跟踪器。然而，如果你使用的是更高版本，KCF\
  \ 是一个不错的选择。\n\n缺点：跟踪误差没有被准确记录。在完全遮挡后，它不会恢复。\n\n\n\n\n\n##### Kernelized Correlation\
  \ Filter (KCF)\n\n前两个跟踪器中讨论的思想在 Kernelized Correlation Filter 跟踪器中得到了扩展。该跟踪器结合了\
  \ MIL 跟踪器的多个正样本，这些样本包含宽交互区域。该并发研究定义了一些有趣的几何参数，该跟踪器使用这些参数使跟踪既更快又更精确。\n\n优点：它在准确性和速度方面优于\
  \ BOOSTING 和 MIL，并且报告跟踪失败。如果您使用的是 OpenCV 3.1 或更高版本，我建议在大多数应用中使用它。\n\n缺点：在完全遮挡后，它不会恢复。\n\
  \n##### MedianFlow Tracker\n\n在内部，检测器计算对象在一段时间内前后轨迹之间的差异。它可以通过减少前后误差来准确检测跟踪错误，并在剪辑序列中选择准确的轨迹。在我的实验中，我发现当运动很小且可预测时，该跟踪器有效。该跟踪器可以检测到跟踪失败并相应停止，然而其他跟踪器即使跟踪失败也会继续运行。\n\
  \n优点：对监控失败的报告非常出色。如果运动可预测且没有收缩，这种技术效果极佳。\n\n缺点：当运动量很大时，它会停滞。\n\n##### GOTURN Tracker\n\
  \n它是跟踪器类中唯一使用卷积神经网络（CNN）的跟踪算法。我们了解到 OpenCV 的文档称其“可靠地应对预期修改、光照变化和缺陷”。\n\n需要考虑：GOTURN\
  \ 使用 Caffe 模型，这是一个基于 CNN 的跟踪器。\n\n##### MOSSE Tracker\n\nMOSSE 代表最小输出平方和误差。在用单帧初始化时，使用自适应相关进行对象跟踪，从而实现平衡的关联滤波。光照、长度和姿势变化以及非刚性变形不会影响\
  \ MOSSE 跟踪器。\n\n平方误差的最大平均比率通常用于识别变形，从而使跟踪器在对象出现时停止并重新开始。它确实简单易用、可靠，并且比其他复杂跟踪器快得多。然而，在准确性方面，它不及基于深度学习的跟踪器。\n\
  \n##### CSRT Tracker\n\nDiscriminative Correlation Filter with Channel and Spatial\
  \ Reliability (DCF-CSR) 中使用空间可靠性图，通过跟踪框架将滤波器辅助更改为指定位置的部分。它仅使用两种标准特征（HoGs 和 Color\
  \ Names）。它也有较低的帧率（25 fps），但具有更好的对象跟踪可靠性。\n\n#### C) Image-to-Text Analysis\n\n#####\
  \ 使用 C++ OCR 库，将图像转换为文本\n\nOCR（光学字符识别）技术允许您解释和翻译图像或扫描文档中的文本，将其转换为人类可理解的文本。从优惠券上读取代码、创建可格式化文本的自助商店、将印刷信息翻译成数字版本等等，只是\
  \ OCR 的一些应用。市场上似乎有各种 OCR 软件和库，但 OCR 测试的准确性至关重要。在本节中，我将向您展示如何使用 C++ 构建我们自己的 OCR 软件并将图像转换为文本。\n\
  \n##### 使用 C++ 将图像页面转换为文本\n\n让我们从一个包含多行文本的图片的场景开始。如果您有一本扫描的书籍，每页有大量文本行，则可能是这种情况。在这种情况下，将图像转换为文本的步骤如下。\n\
  \n- 在字符串变量中存储图像的方向。\n- 制作一个缓冲区来保存 OCR 结果。\n- 使用 aspose::ocr::page(const char *image\
  \ path, wchar_t *buffer, size_t buffer size) 函数执行 OCR。\n- 结果可以打印或保存到文件。\n- 以下程序示例演示了如何使用\
  \ C++ 进行 OCR 并将图像转换为文本：\n\n```\nstd::string image_path = \"sample.png\";\n\n// Prepare\
  \ buffer for result (in symbols, len_byte = len * sizeof(wchar_t))\nconst size_t\
  \ len = 4096;\nwchar_t buffer[len] = { 0 };\n\n// Perform OCR\nsize_t size = aspose::ocr::page(image_path.c_str(),\
  \ buffer, len);\n\n//Print result\nstd::wcout << buffer << L\"\\n\";\n```\n\n#####\
  \ 使用 C++ 对图像进行单行 OCR\n\n我们在前一个示例中转换了包含多行文本的图像。当图片只有一行文本时，例如标题或标语，这可能是这种情况。在这种情况下，执行\
  \ OCR 的步骤如下：\n\n- 使用字符串变量设置图像的方向。\n- 创建一个缓冲区来保存 OCR 数据。\n- 使用 aspose::ocr::line(const\
  \ char *image path, wchar_t *buffer, size_t buffer size) 函数执行 OCR。\n- OCR 发现可以保存或打印。\n\
  \n以下代码示例演示了如何使用 C++ 对包含短文本的图片实现 OCR：\n\n```\nstd::string image_path = \"sample_line.jpg\"\
  ;\n\n// Prepare buffer for result (in symbols, len_byte = len * sizeof(wchar_t))\n\
  const size_t len = 4096;\nwchar_t buffer[len] = { 0 };\n\n// Perform OCR\nsize_t\
  \ size = aspose::ocr::line(image_path.c_str(), buffer, len);\n\n//Print result\n\
  std::wcout << buffer << L\"\\n\";\n```\n\n##### 在 C++ 中，将图像的特定区域转换为文本\n\n您还可以配置\
  \ API 以将 OCR 限制为图像的特定区域。在此场景中，您可以通过在图像上绘制矩形来访问所需区域。提取图像特定区域文本的步骤如下：\n\n- 在变量中存储图像的方向。\n\
  - 制作一个缓冲区来保存 OCR 结果。\n- 使用 aspose::ocr::page_rect(const char *image path, wchar_t\
  \ *buffer, size_t buffer size, int x, int y, int w, int h) 函数执行 OCR。\n- 应打印 OCR\
  \ 结果。\n\n以下 C++ 代码示例演示了如何将图像的特定区域转换为文本：\n\n```\nstd::string image_path = \"sample_line.jpg\"\
  ;\n\n// Prepare buffer for result (in symbols, len_byte = len * sizeof(wchar_t))\n\
  const size_t len = 4096;\nwchar_t buffer[len] = { 0 };\n\nint x = 138, y = 352,\
  \ w = 2033, h = 537;\n\n// Perform OCR or selected area\nsize_t size = aspose::ocr::page_rect(image_path.c_str(),\
  \ buffer, len, x, y, w, h);\n\n//Print result\nstd::wcout << buffer << L\"\\n\"\
  ;\n```\n"
- "### CHAPTER 5\n\n### Custom Object Tracking\n\n本章介绍了如何通过测量周期平均背景场景，使用缩小后的图片细节实时跟踪移动和静止对象。\n\
  \n#### Overview\n\n在处理剪辑流而不是单个静态图片时，我们经常有特定的对象或项目要跨视觉场进行跟踪。\n\n计算机视觉中跟踪的基本问题发生在两种类型之一；您将要么跟踪先前识别的对象，要么在许多场景中跟踪未知对象，根据其运动识别它们。\n\
  \n跟踪中还有建模的问题。此外，在最佳情况下，跟踪策略会向我们发送对象从帧到帧的实际位置的混乱估计（图 5-1）。建模帮助我们克服这一点。在测量对象轨迹的混乱评估时，已经制定了几种有效的数学方法。这样的策略可用于创建对象的二维或三维表示及其位置。\n\
  \n![](img/7d8e54ee4578088e252f4c75b5cd4c88_96_0.png)\n\n图 5-1. 对象跟踪\n\n#### Real-Time\
  \ Object Tracking\n\n该主题说明了如何使用传统的网络摄像头实时跟踪移动或固定对象。当对象开始显示时，跟踪的简单方法是将预先指定的背景图片与相同的背景帧进行比较。这种情况在固定环境中运行，您可以在其中了解背景图片，尽管必须跟踪任何前景对象，例如室内、着陆区、办公室、市场、车间等。如果一张纸在这种情况下移动或在较长时间内保持固定，您应该将其视为场景的一部分并将图片叠加到背景上以防止额外检测。如果场景中删除了背景对象，同样适用。这种方法的缺点是缺乏照明和需要调整摄像头位置。在这种情况下，您必须再次测量最新的背景。另一个选择是使用边缘算子来减少光照变化的影响。如果您想描述对象的身体而不是仅轮廓，您将不得不编写一些额外的代码。\n\
  \n\n\n\n\n#### 背景\n\n传统的网络摄像头分辨率为 640 × 480 像素已过时。如果您计划跟踪非常小的物体，可以将此分辨率缩小约三倍，以消除失真并在不丢失关键跟踪能力的情况下大大提高处理器速度。降采样步骤可以实现物体跟踪的极高处理速度。当没有物体时，在\
  \ 2 GHz 单核上运行速度约为每秒一百帧，而有物体时则在每秒 30 到 90 帧之间。物体越大，测量 blob 的每个像素所需的时间就越长。除了 ImageBlobs\
  \ 类之外，本章以及代码都依赖于之前的提交。\n\n#### 利用代码\n\n通过设置摄像头以及在 Video Preview 中定义的帧捕获级别，同时使用 Buffered\
  \ Mode 中的 SampleGrabber 将帧捕获到内存中来开始视频捕获。首先，背景测量方法选择一个背景单选按钮。当您选择启动跟踪复选框以开始物体跟踪时，所有记录的帧都应合并，并且会计算出一个平均背景帧，该帧将保存为名为\
  \ background.jpg 的 JPEG 文件。我建议您将摄像头对准您认为会看到运动的方向。在处理摄像头失真或在短时间内场景中出现一些随机移动物体时，测量数秒的背景。它们将被平均背景计算有效消除。将一个物体引入您想要跟踪的场景，要么等待它们出现，要么它们处于活动状态。\n\

    # Chapter 3. Basics of Incident Response


    > “It is a fairly open secret that almost all systems can be hacked, somehow.
    It is a less spoken secret that such hacking has actually gone quite mainstream.”

    >

    > Dan Kaminsky


    Intelligence is only one half of the intelligence-driven incident-response puzzle.
    While computer incident response isn’t nearly as old as the art of espionage,
    in the last 40 years it has rapidly evolved into a major industry. *Incident response*
    encompasses the entire process of detecting intrusions (whether against a single
    system or an entire network), developing the information necessary to fully understand
    them, developing and executing the plans to remove the intruders, and recording
    information for follow up actions (such as legal actions, regulatory reporting,
    or intelligence operations).


    Intrusion detection and incident response share many characteristics. Both are
    abstract. Both complicated topics, and as a result people have sought to simplify
    them by abstracting them into cycles or models. These models make understanding
    the complex interplay between defender and adversary possible and form the basis
    for planning how to undertake responding to these incidents. Just like intelligence
    models, they are rarely perfect and can’t always be followed explicitly, but they
    provide a framework for understanding the adversaries’ intrusion and the defenders’
    response processes and allow multiple responders to work together to understand
    an intrusion using the same terminology and methodology. The combination of shared
    vocabulary and thought processes helps make these complex events less fraught
    and far more likely to succeed.


    Just like the exploration of intelligence, this chapter starts with overarching
    theory and then moves to more specific applications and models. Afterward we’ll
    dig into common defensive techniques and finish with the integrated intelligence
    and operations models we’ll use for the rest of the book.


    ## Incident-Response Cycle


    In the same way that we need a standard language for discussing intelligence concepts,
    we need a language to discuss detecting and responding to incidents. This process
    can be viewed from both the defender’s perspective and the adversary’s perspective.
    Let’s start with the defenders.


    The *incident-response cycle* is made up of the major steps taken in intrusion
    detection and incident response. The goal of this model is to be agnostic to the
    type of attack (phishing, strategic web compromise, service compromise, etc.)
    and generalize the steps that are generic to all of those attacks (and many others).
    [Figure 3-1](#ch03.html#fig_1_the_incident_response_cycle) illustrates this cycle.


    ![](assets/image-to-come.png)


    There’s some argument about where the concept of the incident-response cycle began.
    The first references seem to come from the National Institute of Standards and
    Technology’s seminal document on incident response, “`NIST 800-61 Computer Security
    Incident Handling Guide` ([`http://bit.ly/2tGfwUz`](http://bit.ly/2tGfwUz)).”
    Now in its second revision, this document is the basis for how United States Government
    agencies handle incidents. Although this guide introduced a huge number of key
    concepts, one of the most important is the description of the incident-response
    cycle, which provides a defender centric view of the incident-response process.
    This process includes five phases:


    *   Preparation

    *   Identification

    *   Containment

    *   Eradication

    *   Recovery


    Each phase of the cycle serves a specific purpose and is critical to the success
    of the entire cycle. It is important to understand the purpose of the entire cycle,
    along with the details of each phase, before beginning the process. Because of
    this, we will go in depth into each of these phases below.


    ### Preparation


    From the defender’s perspective, the first stage of an incident comes before the
    attack begins: the *Preparation phase*. Preparation is the defender’s chance to
    get ahead of the adversary by hardening assets, deploying detection capabilities,
    creating and updating signatures, and understanding baseline system and network
    activity. This is a combination of network security architecture and security
    operations. Many of these steps go beyond the security team, impacting and being
    impacted by general network operations, network architecture, system management,
    and even help desk and support.


    Preparation should focus on five key elements, three technical and two nontechnical:


    **Attack Surface Mapping**


    : It’s extremely difficult to defend systems that are unknown. In today’s world
    of shadow IT, cloud providers, and rapid prototyping it’s nearly impossible to
    have a complete understanding, let alone inventory, of every system in a network.
    Yet without this understanding, or as close as possible, defense remains a guessing
    game.


    **Telemetry**


    : You can’t find what you can’t see. Specialized systems are required for incident
    responders to identify and investigate intrusions. These systems range from network
    to host and should provide the ability to investigate a wide variety of activities
    at multiple levels.


    **Hardening**


    : The only thing better than identifying an intrusion quickly is it never happening
    in the first place. Preparation is the stage for ensuring that patches are deployed,
    configurations are locked down, and tools that limit attacks such as virtual private
    networks (`VPNs`) and firewalls are in place.


    **Process and documentation**


    : On the nontechnical side, process is the first line of defense that can be prepared
    ahead of time. Few things are worse during an incident than trying to figure out
    what you’re doing as you’re doing it. Along with processes (such as an incident-response
    plan, notification plan, and communications plan), having documentation for common
    questions such as network configurations, system configurations, and system owners
    will also speed up responses.


    **Practice**



- raw: 'The last thing preparation allows is the chance to practice your plans. This
    will speed up future incidents and identify issues that can be corrected (something
    we’ll touch on more in “Lessons Learned”). The best incident-response teams are
    those that have been through incidents together, and the best way to do that is
    practice.


    When discussing computer network defense, many (mostly pessimistic) people are
    quick to point out all the advantages an adversary has. Most of these advantages
    boil down to surprise: in computer network exploitation, the adversary gets to
    pick the location and time of the attack. What many don’t take into account is
    the key advantage of the defender: namely, the ability to prepare for an attack
    by controlling the environment. The adversary can do reconnaissance, but in many
    cases is attacking a black box, without full understanding of the target until
    the attack is underway. Defenders can leverage this by preparing adequately and
    maximizing their “home field” advantage.


    ## Identification


    The *Identification phase* is the moment where the defender identifies the presence
    of an adversary impacting their environment. This can occur through a variety
    of methods:


    *   Identifying the adversary entering the network, such as a server attack or
    an incoming phishing email


    *   Noticing command-and-control traffic from a compromised host


    *   Seeing the massive traffic spike when the adversary begins exfiltrating data


    *   Getting a visit from a special agent at your local FBI field office


    *   All network devices suddenly displaying a screen announcing you’ve been hit
    with ransomware.


    Regardless of what actions the adversary takes, the Identification phase begins
    when you first gain awareness of adversary activity against your resources. In
    this model, the Identification phase is the entire intrusion-detection phase,
    glossing over many details in a complicated topic (we’ll dig into other models
    specifically about this phase later). This is obviously an oversimplification,
    but reasonable given that this cycle focuses on the overarching, end-to-end process
    of incident response rather than digging into the details of each phase. The Identification
    phase typically leads to an investigation, discovering even more information about
    the incident and the adversary, before beginning to respond directly. One of the
    key goals of threat intelligence is to augment the Identification phase, increasing
    the accuracy and quantity of methods to identify adversaries earlier.


    Identification, at least in the incident-response sense, is not simply hearing
    about an attack that took place or learning about a new adversary. Identification
    starts when there is direct impact to your users, systems, or resources. For it
    to be an incident, there has to be impact.


    On the other hand, if an adversary has capability, intent, and opportunity, that
    adversary does represent a threat. This isn’t the start of the incident cycle,
    but the intelligence cycle. Only after the adversary is identified in your environment
    should an incident begin.


    ## Containment


    The first two phases of the cycle can be considered primarily passive and are
    focused on information gathering. The first phase of actual response, meaning
    that specific actions are being taken in response to a specific attack, is containment.
    *Containment* is the initial attempt to mitigate the actions of an adversary,
    stopping the bleeding in the short term while preparing a longer-term response.
    These shorter-term responses may not make the attack impossible, but they dramatically
    reduce the ability of the adversary to continue to achieve the objectives. These
    actions should be taken in a rapid but controlled manner to limit the adversary’s
    opportunity to respond.


    Common containment options are as follows:


    *   Disabling the network switch port to which a particular system is connected


    *   Blocking access to malicious network infrastructure such as IPs (at the firewall)
    and domains or specific URLs (via a network proxy)


    *   Temporarily locking a user account under the control of an intruder


    *   Disabling system services or software an adversary is exploiting


    In many incident responses, defenders may choose to skip over the Containment
    phase entirely. Containment risks tipping off the adversary by changing the environment
    while that adversary still may have control. Skipping directly to eradication
    may also give comfort to executives who see containment alone as a band-aid.


    ## Eradication


    *Eradication* consists of the longer-term mitigation actions meant to remove an
    adversary from an environment and keep them out for good, unlike the temporary
    measures in the Containment phase. These actions should be carefully planned out
    and may take a considerable amount of time and resources to deploy. Eradication
    actions are focused on completely removing the adversary’s ability to regain access
    to the network once they are kicked out. It includes focusing not just on the
    specific tactics that allowed them to gain access in the first place, but also
    additional hardening of the network based on the knowledge of the adversary’s
    objectives and Tactics, Techniques, and Procedures (TTP).


    Common eradication actions are as follows:


    *   Removing all malware and tools installed by the adversary (see the sidebar
    “Wiping and Reloading Versus Removal”)


    *   Resetting and remediating all impacted user and service accounts


    *   Re-creating secrets that could have been accessed by the adversary, such as
    shared passwords, certificates, and tokens


    *   User education and awareness about the incident to reduce future social engineering


    *   Patching software vulnerabilities and changing vulnerable configurations


    Often responders will go for a *scorched-earth* approach to eradication. In these
    cases, responders will take remediations on resources with no indications of compromise;
    for example, regenerating all VPN certificates after an adversary accessed one
    VPN server. Scorched-earth approaches are effective at mitigating the *unknown
    unknown* situations, where it’s impossible to know 100% what the adversary did,
    but comes with the compromise that it may require a significant effort to make
    these changes.


    The effort necessary varies based on the sort of service or information involved.
    Forcing full password resets in an active directory–managed Windows environment
    is relatively easy. Regenerating and redeploying extended validations (EV) TLS
    certificates with domain pinning in major browsers is hard. The incident-response
    team needs to collaborate with the corporate risk management and system/service
    owner teams to determine how far to go in these situations.


    For example, in the spring of 2015, Pennsylvania State University took its entire
    engineering network offline for three days in response to a compromise ([http://bit.ly/2u7R5Bu](http://bit.ly/2u7R5Bu)).
    Afterward it had to bring the network back online and return it to normal service.
    A recovery like this requires removing malware from systems, resetting credentials
    such as passwords and certificates, patching software, and many other changes
    meant to completely remove the adversary from the network and limiting that adversary’s
    ability to return. In this case, the mitigation action, taking the entire network
    offline (likely to limit the adversary’s ability to make changes during the remediation
    phase), preceded the remediation actions. This is a common pattern when dealing
    with persistent adversaries. On one hand it decreases the adversary’s ability
    to react to the mitigation and remediation (except by pre-planned or automated
    means) but on the other hand it gives a clear signal to the adversary that a response
    is under way and does cause a significant negative impact to anyone using the
    network.


    ## Recovery'

- raw: 'Conceptual models on the other hand, are representations of explicit knowledge,
    and are commonly the result of intelligence synthesis based on mental models that
    have been codified. Some of the most useful models have been derived from an analyst
    capturing and codifying a way that they intuitively approached or thought about
    problems. One example of this is the Diamond Model for Intrusion Analysis, which
    we cover in depth in Chapter 3, The Basics of Incident Response. Sergio Caltegrione,
    one of the creators of the model, described the generation of a new model as “a
    long progression of understanding the work we were repeatedly doing, until we
    understood it well enough to abstract it. Once abstracted, it became infinitely
    more useful because we could then ask new questions \[of the model\].” Sergio
    also described models as formulas - you have to understand its parts and their
    relationships before you can fully utilize them.


    The goal of codifying a conceptual model is to be able to structure information
    so that it can be analyzed and acted on. Many models that are frequently used
    in intelligence analysis, including the diamond model, are covered further in
    Chapters [3,](https://atlas.oreilly.com/oreillymedia2/intelligence-driven-incident-response/editor/master/02-basics-of-intelligence.html#basics_of_incident_response)
    the Basics of Incident Response, and 7, Analyze.


    ## Using Models for Collaboration


    One of the key benefits of using explicit, conceptual models (rather than exclusively
    using mental models) is that it enables collaboration. Intelligence collaboration
    has been likened to “thinking in public”, because it requires analysts to verbalize
    or otherwise articulate mental processes of analysis and synthesis that can be
    difficult to describe. Models are critical to analytic collaboration and will
    result in higher quality intelligence, and therefore it is worth the time investment
    to make sure that team members understand the different conceptual models that
    are commonly used and also understand the process for codifying the mental models
    that they commonly use in analysis.


    ## Process Models


    Models can be divided into two broad categories: models that represent our thinking,
    and models that represent the subject of analysis. The first type of model can
    be thought of as being used to give structure to processes - such as how we think,
    or the process of generating intelligence. This section covers two models that
    are used to effectively generate and act on intelligence. The first is the OODA
    loop, which can be used in making quick, time-sensitive decisions. The second
    is the intelligence cycle, or intelligence process, which can be used to generate
    more-formal intelligence products that will be used in a variety of ways, from
    informing policy to setting future intelligence requirements.


    ## OODA


    One of the most referenced military concepts in security is *OODA*, an acronym
    for observe, orient, decide, act. The OODA loop, shown in [Figure 2-1](#ch02.html#figure_2_1_the_ooda_loop),
    was developed by fighter pilot, military researcher, and strategist John Boyd
    in the 1960s. He believed that a fighter pilot who was at a disadvantage against
    an adversary with more-advanced equipment or capabilities could be victorious
    by using OODA to respond more quickly to stimuli and effectively attack the opponent’s
    mind through decisive actions.


    ![](assets/image-to-come.png)


    Here’s an introduction to each of the four stages.


    ### Observe


    The Observe phase centers around the collection of information. In this phase,
    an individual collects information from the outside world—anything and everything
    that could be useful. If the individual is planning to catch a baseball, this
    phase is about observing the baseball to determine its velocity and trajectory.
    If the individual is trying to catch a network attacker, the observation includes
    gathering logs, monitoring systems, and collecting any outside information that
    could help identify the attacker.


    ### Orient


    The Orient phase puts the information collected during the Observe phase into
    context with already known information. This takes into account past experience,
    preconceived notions, expectations, and models. For the baseball example, orientation
    uses what the observer knows about how a ball moves, taking into account its velocity
    and trajectory, to predict where it will go and how much force the impact will
    generate when it is caught. In the example of a network attacker, orientation
    takes the telemetry pulled from the logs and combines it with knowledge about
    the network, relevant attack groups, and previously identified artifacts such
    as specific IP addresses or process names. The orientation phase is heavily reliant
    on the mental models we previously discussed. Without a way to quickly and accurately
    “sort” the data you have observed, orientation becomes a very difficult task.


    ### Decide


    At this point, information has been collected (observed) and contextualized (oriented),
    and now it is time to determine a course of action. The decide phase is not about
    executing an action. It is about debating various courses of action until the
    final course of action is determined.


    In the baseball example, this phase includes determining where to run and how
    fast, how the fielder should move and position her hand, and anything else needed
    to attempt to catch the ball. In the case of dealing with a network attacker,
    it means deciding whether to wait and continue to observe the attacker’s actions,
    whether to start an incident-response action, or whether to ignore the activity.
    In either case, the defender *decides* on the next steps to achieve their goal.


    ### Act


    After all that, the Act phase is relatively straightforward: the individual follows
    through with the chosen course of action. This doesn’t mean it’s 100% guaranteed
    to be successful. That determination is made in the observation phase of the next
    OODA loop, as the cycle begins again back at the observation phase.


    OODA is a generalization of the basic decision-making process that everyone goes
    through thousands of times a day. This explains how individuals make decisions,
    but also how teams and organizations do so. It explains the process a network
    defender or incident responder goes through when gathering information and figuring
    out how to use it.


    The OODA loop is used by not only one side. While we, as defenders, go through
    the process of observing, orienting, deciding, and acting, in many cases the attacker
    is as well. The attacker is observing the network and the defender’s actions in
    that network, and deciding how to respond to changes in the environment and attempts
    to kick them out. As with many things, the side that can observe and adapt faster
    tends to win. [Figure 2-2](#ch02.html#figure_2_2_competing_ooda_loop_of_the_defender_and_the_attacker)
    shows the OODA loop for both an attacker and defender.


    One thing to note about the OODA loop is that it can often trip analysts up as
    they try to think through adversarial responses to their actions - “first I will
    do x, then they will do y, and then I will…” - when in reality it can be difficult
    to know how the adversary will respond. There will always be some level of uncertainty
    when dealing with adversaries who are human and may act unpredictably, which can
    make the risk-adverse wary of making any moves. When in doubt, reach back to your
    requirements, or even further back to the goals and mission of your team or program.
    Are you tasked with defending the network? With safeguarding user data or public
    safety? Make sure those requirements and missions are included in the orientation
    phase, which can help to avoid decision-paralysis when it comes time to decide
    what the best course of action is.


    ![](assets/image-to-come.png)'
  fmt: '

    Conceptual models, on the other hand, are representations of explicit knowledge,
    and are commonly the result of intelligence synthesis based on mental models that
    have been codified. Some of the most useful models have been derived from an analyst
    capturing and codifying a way that they intuitively approached or thought about
    problems. One example of this is the Diamond Model for Intrusion Analysis, which
    we cover in depth in Chapter 3, The Basics of Incident Response. Sergio Caltegrione,
    one of the creators of the model, described the generation of a new model as "a
    long progression of understanding the work we were repeatedly doing, until we
    understood it well enough to abstract it. Once abstracted, it became infinitely
    more useful because we could then ask new questions [of the model]." Sergio also
    described models as formulas—you have to understand its parts and their relationships
    before you can fully utilize them.


    The goal of codifying a conceptual model is to be able to structure information
    so that it can be analyzed and acted on. Many models that are frequently used
    in intelligence analysis, including the diamond model, are covered further in
    Chapters [3](https://atlas.oreilly.com/oreillymedia2/intelligence-driven-incident-response/editor/master/02-basics-of-intelligence.html#basics_of_incident_response)
    (the Basics of Incident Response) and 7 (Analyze).


    ## Using Models for Collaboration


    One of the key benefits of using explicit, conceptual models (rather than exclusively
    using mental models) is that it enables collaboration. Intelligence collaboration
    has been likened to "thinking in public", because it requires analysts to verbalize
    or otherwise articulate mental processes of analysis and synthesis that can be
    difficult to describe. Models are critical to analytic collaboration and will
    result in higher quality intelligence, and therefore it is worth the time investment
    to make sure that team members understand the different conceptual models that
    are commonly used and also understand the process for codifying the mental models
    that they commonly use in analysis.


    ## Process Models


    Models can be divided into two broad categories: models that represent ours to
    their actions—"first I will do x, then they will do y, and then I will…"—when
    in reality it can be difficult to know how the adversary will respond. There will
    always be some level of uncertainty when dealing with adversaries who are human
    and may act unpredictably, which can make the risk-adverse wary of making any
    moves. When in doubt, reach back to your requirements, or even further back to
    the goals and mission of your team or program. Are you tasked with defending the
    network? With safeguarding user data or public safety? Make sure those requirements
    and missions are included in the orientation phase, which can help to avoid decision-paralysis
    when it comes time to decide what the best course of action is.


    ![](assets/image-to-come.png)

    '
  trans: '

    另一方面，概念模型是显性知识的表现，通常是基于已编码化的心智模型进行情报综合的结果。一些最有用的模型源于分析师捕捉并编码化了他们直观解决或思考问题的方式。一个例子是用于入侵分析的钻石模型，我们将在第
    3 章“事件响应基础”中深入介绍。该模型的创建者之一塞尔吉奥·卡尔特格里奥内将新模型的生成描述为“一个漫长的过程，即理解我们反复进行的工作，直到我们足够了解它以便将其抽象化。一旦抽象化，它就变得无限地更有用，因为我们随后可以向[模型]提出新问题。”塞尔吉奥还将模型描述为公式——在完全利用它们之前，你必须理解其组成部分及其关系。


    编码化概念模型的目标是能够构建信息结构，以便对其进行分析和采取行动。情报分析中常用的许多模型（包括钻石模型）将在第[3](https://atlas.oreilly.com/oreillymedia2/intelligence-driven-incident-response/editor/master/02-basics-of-intelligence.html#basics_of_incident_response)章（事件响应基础）和第
    7 章（分析）中进一步介绍。


    ## 使用模型进行协作


    使用显性概念模型（而非仅使用心智模型）的主要好处之一是它能促进协作。情报协作被比作“公开思考”，因为它要求分析师口头表达或以其他方式阐述难以描述的分析和综合心智过程。模型对分析协作至关重要，并将产出更高质量的情报，因此值得投入时间，确保团队成员了解常用的不同概念模型，并理解编码化他们在分析中常用的心智模型的过程。


    ## 过程模型


    模型可分为两大类：代表我方与对方行动互动的模型——“首先我做 X，然后他们做 Y，接着我……”——但在现实中，很难知道对手将如何应对。在应对可能不可预测行动的人类对手时，总会存在一定程度的不确定性，这会让厌恶风险的人不敢采取任何行动。如有疑虑，请回顾你的需求，甚至进一步回顾你团队或项目的目标和使命。你的任务是保卫网络吗？还是保护用户数据或公共安全？确保这些需求和使命包含在定向阶段，这有助于在决定最佳行动方案时避免决策瘫痪。


    ![](img/image-to-come.png)

    '

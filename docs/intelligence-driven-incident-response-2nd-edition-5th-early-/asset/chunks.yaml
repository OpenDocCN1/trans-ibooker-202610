    ## Vulnerability Management and Threat Intelligence


    Most of security operations is built on metrics, but vulnerability management
    more than most. Whether it''s a Common Vulnerability Scoring System (CVSS), the
    time since the patch was released, the criticality of the system, whether or not
    it''s a full moon, or some combination of all of the above! While the CVSS score
    does take into account things like whether or not there''s a public exploit, the
    idea that a known adversary is using it, how it''s being deployed, and what it''s
    being used to deliver can all make a difference.


    For example think about Log4Shell attacks aimed at [CVE-2021-44228, CVE-2021-45046,
    and CVE-2021-44832](https://www.microsoft.com/en-us/security/blog/2021/12/11/guidance-for-preventing-detecting-and-hunting-for-cve-2021-44228-log4j-2-exploitation/).
    Initial reporting, largely from GreyNoise and CISA, identified the primary vector
    for Log4J exploitation as aimed at Java web services such as Tomcat and games
    like Minecraft. While these were 100% valid, Intelligence teams quickly started
    hearing about other ways it could be exploited, such as putting Log4Shell exploit
    strings in documents going through content proxies like web security gateways.
    That knowledge caused a fundamental shift in what systems the vulnerability management
    team needed to focus on, suddenly it was less about externally facing systems
    and moved to a much wider variety of internal systems. This was before the CVSS
    score was updated to take this into account.


    Take a look at [CISA''s Known Exploited Vulnerabilities Catalogue](https://www.cisa.gov/known-exploited-vulnerabilities-catalog).


    ### Architecture & Engineering


    Okay...those last two were pretty straight forward, but hear us out. There are
    actually a lot of ways Threat Intelligence can better inform network and even
    application engineering and architecture. In a lot of ways this ends up being
    an extension of our vulnerability analysis discussion: by understanding how adversaries
    are attacking systems we can better improve the resilience of those systems by
    whatever means make the most sense. Ultimately speaking systems engineering and
    architecture is a series of decisions about tradeoffs, and better information
    means better decisions, and intelligence is decision support.


    #### A (Exceedingly) Brief Introduction to Resilience


    While a growing topic system, resilience is the ability for a system to resist
    external threats while returning the system to its ability to function effectively.
    According to Utah State University''s Center for Anticipatory Intelligence this
    is made up of the 4Rs:


    **Resistance**

    : How well do you keep the threat out?


    **Retention**

    : How can you keep the systems core functions going during disruption?


    **Recovery**

    : How quickly can you get the systems core functions to bounce back?


    **Resurgence**

    : How do you make a system stronger and smarter after the disruption?


    Only one of these, resistance, is *left of boom*, before exploitation. The rest
    come after the adversary has started to gain control. The result is these come
    at the point where, through intelligence, we can use past knowledge to anticipate
    what steps an adversary will take and prepare to respond to them.


    ### Privacy, Safety, and Physical Security


    Human systems have vulnerabilities, threats, and need resilience as well. Many
    of these challenges are amplified by technology, and while technology can''t solve
    these problems it is incumbent on us to build systems that don''t exacerbate them.
    This ends up being wildly specific to the system, and outside the scope of this
    book, but is certainly worth keeping in mind. It''s a different sort of system,
    but it can still benefit from the same kind of decision support from a strategic
    level threat intelligence.


    Now that we understand more about the role of strategic intelligence in intelligence-driven
    incident response and beyond, we can move onto the hard part - actually conducting
    and leveraging strategic analysis.


    ## Building a Frame with Strategic Intelligence


    Daniel Kahneman and Amos Tversky, whose [groundbreaking research](http://www.stat.columbia.edu/~gelman/surveys.course/TverskyKahneman1981.pdf)
    on framing and decision making has had a far-reaching impact on fields such as
    psychology and economics, advocate for building what they call a "broad frame"
    for making decisions. In a talk to the CFA Institute''s Conference, Kahneman urged
    that we should "see a decision as a member of a class of decisions that you''ll
    probably have to make" rather than a single, stand-alone decision.


    A traditional "frame" in intelligence analysis is viewed like a picture frame
    on the wall. Everything you are looking at is contained within the frame, and
    the viewer is outside, looking in. Framing is a way of defining what it is you
    are looking at and to break a problem or an issue down into its component parts
    to be more closely studied. A frame often provides a visual means of identifying
    the individual parts of an issue so that they can be viewed independently. In
    this sense, we can think of many of the models we covered in Chapters 4 and 8
    as analytic frames. With strategic intelligence, however, it is even more crucial
    that our frames be based on both analysis and synthesis. In addition to strategic
    analysis - or breaking down large-scale concepts into their individual parts so
    that they can be understood, we also need to think critically about *strategic
    synthesis -* or understanding how different pieces work together in a complex
    system. As Josh Korbel explains in his paper "[The US Intelligence Community''s
    Creativity Challenge](https://nationalinterest.org/feature/the-us-intelligence-communitys-creativity-challenge-11451)",
    complex environments are defined not just by their parts, but how those parts
    interact in often unpredictable and unanticipated ways. In complex situations,
    analysis alone will not help understand the situation in a complex system. For
    a truly complex system, in addition to breaking down an issue into parts, framing
    must also include information on how the different parts interact and under what
    circumstance will the parts impact other parts. This process is called synthesis,
    and is a crucial part of framing for strategic intelligence in an increasingly
    complex world. In fact, synthesis is one of the primary reasons that it is so
    important to include intelligence-driven incident response findings into strategic
    intelligence - it helps identify and call out those relationships between parts
    of the system and highlight the changing nature of the landscape in which an organization
    or business is operating.


    Frames can be either mental frameworks for approaching problems, a descriptive
    way that the problem is presented to others, or as mentioned above, a visual representation
    of a system or situation. With strategic intelligence which is used by many people
    in many different roles ranging from analyst to CEO, a documented, often visual,
    frame is one of the best ways to keep all necessary parties aligned. In the next
    sections we will cover a few of the models that can help with framing in strategic
    intelligence.


    ### Models for Strategic Intelligence


    In *Psychology of Intelligence Analysis*, Richards Heuer points towards models
    as a key method to overcome several shortcomings analysts face, including the
    limitations of working memory and the ability to clearly recall multiple details,
    their connections, and their often complex context at any given point in time.
    We have used models in several different ways throughout this book precisely because
    they are such good tools to support analysis. With strategic intelligence, we
    will use models primarily as a way to create a detailed visual representation
    of a problem to assist with framing, analysis, and synthesis.


    #### Target models

    '
  trans: '

    ## 漏洞管理与威胁情报


    大多数安全运营都建立在指标之上，但漏洞管理比大多数更依赖指标。无论是通用漏洞评分系统（CVSS）、补丁发布以来的时间、系统的关键性、是否是满月，还是以上所有因素的某种组合！虽然
    CVSS 评分确实考虑了是否存在公开漏洞利用代码等因素，但已知对手正在使用它、如何部署以及用于投递什么载荷，这些都可能产生影响。


    例如，考虑针对 [CVE-2021-44228、CVE-2021-45046 和 CVE-2021-44832](https://www.microsoft.com/en-us/security/blog/2021/12/11/guidance-for-preventing-detecting-and-hunting-for-cve-2021-44228-log4j-2-exploitation/)
    的 Log4Shell 攻击。早期报告主要来自 GreyNoise 和 CISA，将 Log4J 漏洞利用的主要载体确定为针对 Java Web 服务（如
    Tomcat）和游戏（如 Minecraft）。虽然这些完全有效，但情报团队很快听说了一些其他利用方式，例如将 Log4Shell 漏洞利用字符串放入通过内容代理（如
    Web 安全网关）的文档中。这一认知导致漏洞管理团队需要关注的系统发生根本性转变，重点突然从面向外部的系统转移到了种类更广泛的内部系统。这发生在 CVSS
    评分更新以考虑此因素之前。


    请查看 [CISA 的已知被利用漏洞目录](https://www.cisa.gov/known-exploited-vulnerabilities-catalog)。


    ### 架构与工程


    好的……前两点相当直接，但请听我们解释。实际上，威胁情报有很多方式可以更好地为网络甚至应用工程和架构提供参考。在很大程度上，这是我们漏洞分析讨论的延伸：通过了解对手如何攻击系统，我们可以通过最合理的方式更好地提高这些系统的韧性。归根结底，系统工程和架构是一系列关于权衡的决策，更好的信息意味着更好的决策，而情报就是决策支持。


    #### 韧性的（极其）简短介绍


    虽然这是一个日益增长的话题体系，但韧性是指系统抵抗外部威胁并恢复其有效运行能力的能力。根据犹他州立大学预见性情报中心的说法，这由 4R 组成：


    **抵抗力**

    : 你防住威胁的效果如何？


    **保持力**

    : 在中断期间如何维持系统的核心功能运行？


    **恢复力**

    : 系统核心功能能多快恢复？


    **复苏力**

    : 中断后如何让系统变得更强大、更智能？


    其中只有抵抗力是*爆炸前*（left of boom），即在漏洞利用之前。其余三个发生在对手开始获取控制权之后。结果是这些发生在这样一个节点：通过情报，我们可以利用过去的知识预判对手将采取的步骤，并准备好应对它们。


    ### 隐私、安全与物理安全


    人类系统也存在漏洞、威胁，也需要韧性。这些挑战很多都被技术放大了，虽然技术无法解决这些问题，但我们有责任构建不加剧这些问题的系统。这最终取决于具体系统，超出了本书范围，但绝对值得铭记。这是一种不同类型的系统，但仍可从战略级威胁情报提供的同类决策支持中受益。


    现在我们更了解战略情报在情报驱动的事件响应及其他方面的作用，可以进入困难的部分——实际开展并利用战略分析。


    ## 利用战略情报构建框架


    丹尼尔·卡尼曼和阿莫斯·特沃斯基，他们的[开创性研究](http://www.stat.columbia.edu/~gelman/surveys.course/TverskyKahneman1981.pdf)关于框架和决策制定，对心理学和经济学等领域产生了深远影响，他们主张建立所谓的“宽框架”来进行决策。在
    CFA 协会会议的演讲中，卡尼曼敦促我们要“将一个决策视为一类你可能必须做出的决策中的一员”，而不是一个孤立的、独立的决策。


    情报分析中的传统“框架”就像墙上的相框。你所观察的一切都包含在框架内，而观察者在外部向内看。构建框架是一种定义观察对象、将问题或议题分解为组成部分以便更深入研究的方法。框架通常提供一种可视化手段来识别问题的各个部分，以便独立查看。从这个意义上说，我们可以把第
    4 章和第 8 章介绍的许多模型视为分析框架。然而，对于战略情报而言，我们的框架必须同时基于分析和综合，这更为关键。除了战略分析——即将大规模概念分解为各个部分以便理解——我们还需要批判性地思考*战略综合*——即理解在复杂系统中不同部分如何协同工作。正如乔什·科贝尔在其论文“[美国情报界的创造力挑战](https://nationalinterest.org/feature/the-us-intelligence-communitys-creativity-challenge-11451)”中所解释的，复杂环境不仅由其组成部分定义，还由这些部分以往往不可预测和意想不到的方式相互作用来定义。在复杂情况下，仅靠分析无法帮助理解复杂系统中的局势。对于真正复杂的系统，除了将问题分解为部分外，框架构建还必须包含不同部分如何相互作用以及在何种情况下部分会影响其他部分的信息。这个过程称为综合，是日益复杂的世界中战略情报框架构建的关键部分。事实上，综合是将情报驱动的事件响应发现纳入战略情报如此重要的主要原因之一——它有助于识别并指出系统各部分之间的关系，并突显组织或企业运营环境的变化本质。


    框架可以是解决问题的心智框架、向他人呈现问题的描述性方式，或者如上所述，系统或情况的可视化表示。战略情报被从分析师到 CEO 等许多不同角色的人使用，一个有文档记录的、通常是可视化的框架，是让所有必要方保持一致的最佳方式之一。在接下来的章节中，我们将介绍一些有助于战略情报框架构建的模型。


    ### 战略情报模型


    在《情报分析心理学》中，理查兹·休尔指出模型是克服分析师面临的几个缺陷的关键方法，包括工作记忆的局限性，以及在任何给定时间点清晰回忆多个细节、它们的联系及其往往复杂的背景的能力。我们在本书中以几种不同方式使用模型，正是因为它们是支持分析的绝佳工具。对于战略情报，我们将主要使用模型来创建问题的详细可视化表示，以协助框架构建、分析和综合。


    #### 目标模型

    '

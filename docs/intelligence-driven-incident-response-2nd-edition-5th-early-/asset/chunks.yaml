- raw: "*   **Supporting information** - non-technical or tactical details of the\
    \ intrusion - who was targeted, what was going on in the company (or in the world)\
    \ that may have motivated the intrusion. What was the impact? \n\n*   **Links\
    \ or references** to information related to the incident or the adversary that\
    \ was shared, was publicly available, or used as a reference in the course of\
    \ the investigation. \n\n*   **Internal actions taken or request made** - one\
    \ very important aspect that should not be overlooked is what was done in response\
    \ to the incident, and what requests for additional action were made for the future.\
    \ For example, if the incident response report called out that more frequent monitoring\
    \ of company credentials on underground forums would prevent similar attacks in\
    \ the future, that recommendation (or possibly commitment!) should not be lost\
    \ in the aftermath of the incident. \n\nAfter deciding what information should\
    \ be exploited, it is necessary to extract that information from incident data,\
    \ standardize it, and store it for future analysis and reference. This will require\
    \ a process - ideally one that is documented and can be shared with others so\
    \ that it can be repeated and improved upon moving forward. Processes will vary\
    \ from team to team, however there are a few key components that all Exploit-focused\
    \ processes should have: Gathering information, storing information, and managing\
    \ Information. \n\n# Gathering Information\n\nIf your organization is anything\
    \ like most of the ones we have seen, at the end of the investigation you have\
    \ an “Official Spreadsheet of Doom” (plus five or six non-official versions),\
    \ thirteen files of notes, several photos of whiteboards, and a slack channel\
    \ full of hypotheses, links to external documents, and a variety of “let’s follow\
    \ up on this in the future” comments. The difference between this and some of\
    \ the best process-driven teams we have seen is that the more advanced teams clean\
    \ things up periodically along the way - we have yet to see, meet, or even hear\
    \ about a team who doesn’t have somewhat messy, creative, but effective processes\
    \ in the middle of an intense incident. If you are staring at a mountain of disorganized\
    \ data in as many different structures as you have team members, do not fret.\
    \ The Exploit process will help you get things in order so that you can learn\
    \ and adapt moving forward. \n\nDepending on how you manage your incident-response\
    \ data, it is entirely possible that the most difficult part of the Exploit phase\
    \ will be finding the important bits of intelligence from the investigation. When\
    \ it comes to gathering incident-response data, we have seen it all—from elaborate\
    \ systems, to Excel spreadsheets, to Post-It notes with IP addresses stuck to\
    \ a whiteboard. There is no wrong way to gather that data, but if you want to\
    \ be able to extract it so that it can be analyzed and used in the future, there\
    \ are certainly some ways to make the process easier.\n\nWhen you are dealing\
    \ with exploiting information from a previous incident, you are often limited\
    \ in the data that you have available. One of the goals of intelligence-driven\
    \ incident response is to ensure that the incident-response process captures the\
    \ information needed for intelligence analysis, but if you are just beginning\
    \ the process of integrating operations and intelligence, you may not have been\
    \ able to influence what information was gathered (yet). A good starting point\
    \ for the Exploit phase is to understand exactly what you have available. We have\
    \ found that the information that is currently available usually falls into one\
    \ of two categories: high-level information, and technical details such as malware\
    \ analysis.\n\nIf you have only high-level information in the form of a narrative\
    \ about the incident, you will be looking at extracting strategic-level details.\
    \ If you have access to detailed malware analysis, you can extract tactical-level\
    \ details about the malware’s functionality. Initially, you may have access to\
    \ only one level of information or the other, but ideally, as you implement this\
    \ process in your organization, you will be able to gather both the technical\
    \ details of an incident as well as the strategic information on the information\
    \ targeted and what the impact was. Being able to combine information across all\
    \ the levels is one of the things that makes intelligence most powerful.\n\n##\
    \ Information Gathering Goals\n\nThe first thing to consider when gathering data,\
    \ no matter what the source, is what are your goals. These come in an interesting\
    \ variety, but the most common ones are:\n\nIndicators of Compromise\n\n: \n\n\
    Everyone always wants to say indicators of compromise aren’t useful anymore, but\
    \ even the best adversaries don’t always change everything. While there may be\
    \ more durable methods of tracking adversaries you’d be making a mistake not to\
    \ pull even the IOCs at the bottom of the Pyramid of Pain and adding them to your\
    \ pile of threat data.\n\nSignatures\n\n: \n\nWhile not always available, depending\
    \ on the product, you may be able to pull out even more advanced compound indicators\
    \ in the form of signatures. Snort and Yara are most common, and it will often\
    \ depend on your tech stack, but even product specific signatures can be translated\
    \ into other tools.\n\nTactics, Techniques and Procedures\n\n: \n\nWhile not quite\
    \ as atomic, another common approach after the rise of ATT&CK, is to pull out\
    \ how an adversary operates in the form of TTPs. \n\nStrategic Data\n\n: \n\n\
    This is a bit fuzzier, but in a lot of cases, especially reading 3rd party data,\
    \ it’s the non-technical data that is most interesting. Information about attribution\
    \ and adversary motivation can be harder to capture but is often very high value.\n\
    \nSo where do we pull this data from?\n\n## Mining Previous Incidents\n\nIf you\
    \ are reading this book with the intention of understanding how to start integrating\
    \ operations and intelligence, it is important to note that you don’t have to\
    \ start with the next incident; you can go back through previous incidents and\
    \ exploit that information. In fact, this type of activity is a great way to familiarize\
    \ people in your organization with the F3EAD process and help them feel comfortable\
    \ with it as you build your threat profile. Digging through and analyzing previous\
    \ incident data can give you a great idea of the types of threats facing your\
    \ network and identify the visibility or information gaps you may need to address\
    \ as you move forward. Whenever possible (and hopefully it is always possible)\
    \ include dates and date ranges when mining information from previous incidents.\n\
    \n## Gathering External Information (aka Conducting a Literature Review)"

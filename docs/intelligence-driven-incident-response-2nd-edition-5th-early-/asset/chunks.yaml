- raw: 'The kill chain is a good way to abstract an adversary’s TTPs. It provides
    a structure to understand the abstract actions of an attack.


    Though the earlier phases of the kill chain, especially Targeting and Reconnaissance,
    are sometimes opaque to the defender, usually difficult and circumstantial to
    detect, they’re worth understanding. Defenders tend to think that adversaries
    succeed every time with zero effort. This is far from the truth. In fact, our
    ability to disrupt these pre-intrusion phases later might be one of the strongest
    advantages defenders have.


    ## Targeting


    Before the kill chain proper begins, the adversary must decide what to attack
    (for example, who is the potential target). In many cases, this occurs in consultation
    with some form of sponsor or stakeholder, often as part of their own intelligence
    or operational requirements. As defenders, we commonly think of the target as
    the victim organization, but in many cases that is less important than the information
    or capabilities being targeted.


    Targeting is an interesting aspect of the kill chain because it speaks to motivation
    and thus the general category (though not necessarily specific identification
    or attribution) of an adversary. For example, an adversary who wants to steal
    money needs to go where the money is. Understanding what’s being targeted gives
    insight into what the adversary is after (the adversary’s ultimate goals) and
    may lead to better defensive techniques (discussed later in “Active Defense”).


    ## Reconnaissance


    After deciding *what* and *who* to target, the adversary begins conducting reconnaissance.
    In the *Reconnaissance* phase (or simply *recon*), the adversary develops as much
    information as possible about the planned victim. Reconnaissance can fall into
    multiple categories based on the type of data sought (hard data versus soft data)
    and collection methods (passive versus active).


    ### Hard data versus soft data


    The intelligence world has multiple ways of dividing information based on subject
    (SIGINT, TECHINT, etc.) as we discussed in Chapter 2, but for computer network
    operations, we can think of things a bit more simply.


    *Hard data* includes information about technical aspects of a network and the
    systems attached to it. For an adversary (and defenders while investigating adversaries),
    this usually includes open source intelligence:


    *   Footprinting or enumerating the target network


    *   DNS information such as reverse DNS


    *   Operating systems and application versions


    *   Information about system configurations


    *   Information about security systems


    *Soft data* includes information about the organization behind the network and
    its systems:


    *   Organizational charts, public relationships, and other hierarchy documents


    *   Business plans and goals


    *   Hiring information, which can often leak information such as technologies
    in use


    *   Information on employees, both professional and personal, for use in social
    engineering attacks


    ### Active versus passive collection methods


    Adversaries may use different methods of collecting information. We can categorize
    these methods as *active* or *passive*:


    *Active methods* require interacting directly with the target. An active hard
    intelligence collection could be port scanning a system directly. An active soft
    collection could be a social engineering attack to gather information about internal
    hierarchy and contact information.


    *Passive methods* are based on collecting information without interacting directly
    with the target, often by gathering information from a third-party information
    service such as DNS or WHOIS. A passive hard collection might exploit domain information
    from a public service. A soft passive collection gathers information about an
    organization from a site such as LinkedIn, where people often share considerable
    information (even information they shouldn’t).


    A defender’s ability to detect this recon activity varies tremendously. Active
    methods are much easier to detect than passive methods, for example, and most
    network defenders have more control over hard information than soft information.
    Detecting active hard collection in the form of a port scan is easier than detecting
    soft passive collection in the form of reading job postings for positions that
    describe specific technologies in use at an organization. In some cases, adversaries
    can proxy or bounce their reconnaissance activity through public services, some
    of which execute active methods such as network scans or DNS interrogation at
    the request of a user. This level of anonymity or hiding in noise benefits defenders
    and adversaries alike, as many such tools are used by both sides.


    ## Weaponization


    If all security controls, or all software in general, worked as intended (that
    is, as their designers imagined, not as they were built), then adversaries would
    almost always fail. Thus, the goal for adversaries is to find places where the
    intention and implementation don’t match—a vulnerability. This vulnerability must
    then be exploited reliably and packed into a form that’s ready to be delivered
    to a target (for example, a malicious document or exploit kit). The process of
    finding this vulnerability, crafting an exploit, and combining it with a payload
    is *Weaponization*.


    ### Vulnerability Hunting


    The vulnerability subphase of weaponization is particularly interesting given
    its effect on what targets can be attacked. This forces the adversary to make
    a decision. Some widely deployed pieces of software are likely to be found in
    any environment, such as Adobe Acrobat and Reader or Microsoft Windows and Office.
    This means that any exploit targeting them is widely usable. However, these pieces
    of software have been attacked for years, and their respective companies have
    made considerable efforts to identify and mitigate vulnerabilities. The alternative
    is attacking a more esoteric piece of software that may be less defended but also
    less widely deployed. This limits where an adversary can use it. This process
    can be tied in with the cyber kill chain’s *Reconnaissance* phase. The effort
    that adversaries are willing to put in may also be influenced by their own direction
    and intelligence requirements.


    As an example of this trade-off, consider the Stuxnet incident, in which unconfirmed
    adversaries disabled centrifuges within the Iranian nuclear facility at Natanz.
    Part of this included deploying exploits against programmable logic controllers
    (PLCs) in Siemens equipment. While this equipment is not widely deployed in most
    organizations, it existed in the target environment. Vulnerabilities in those
    PLCs thus provided a vector for the adversaries to carry out their mission.


    We, as defenders, disrupt this process constantly by using development-centric
    security approaches. Good development practices such as [Microsoft’s Security
    Development Lifecycle](https://www.microsoft.com/en-us/sdl/) reduce the introduction
    of the mismatches that become vulnerabilities. Application security teams and
    related reviews constantly hunt for these vulnerabilities in source code. Strong
    patch management can help eliminate old vulnerabilities within an environment.


    Every vulnerability that is patched constrains adversaries a little bit and forces
    them to find new vulnerabilities to exploit. This is a time-consuming and expensive
    process. The longer a vulnerability is in the wild, the more value it has to an
    adversary because of its longer effective life span. In turn, then, disrupting
    the return on investment (ROI) of a vulnerability brings defensive value.


    Imagine that an adversary has a privilege escalation in Windows 95. The adversary
    uses it for years, and it finally gets fixed in Windows 7. This means the adversary
    could use that exploit for multiple years across multiple versions. The longer
    it lasts, the more ROI the adversary receives from the vulnerability hunting and
    exploit creation effort.'

    大多数安全团队无法完成 `F3EAD` 循环的原因并非秘密：生成情报已经够难了，但管理情报则是一系列全新的头疼问题。处理流程、时效、时效性、访问控制和格式足以让任何人晕头转向。然而，尽管这些问题不可否认地复杂，但必须直面解决。妥善提取和捕获事件相关信息，并确保对其进行跟进，这可能意味着彻底修复对手对您网络的访问权限，与仅仅延缓他们的回归和最终成功之间的区别。利用事件响应过程中生成的情报，可确保投入到识别、理解和修复事件中的所有时间和精力，进一步支持整体的网络防御和响应流程。至少对您自己的组织如此，理想情况下也适用于许多其他组织。本章介绍了您在
    `F3EAD` 的 `Exploit` 阶段应执行的各项任务，将使该过程不那么令人生畏，甚至可以说，可能还有点令人兴奋。


    ### Note


    我们已经讨论过军事术语与通用信息安全行话之间偶尔存在的差异，而 `Exploit` 恰好是其中一个主要差异。在信息安全领域，我们倾向于几乎专门使用 exploit
    一词来指代利用漏洞，从而使对手获得系统访问权限或信息。相比之下，在军事术语中，exploit 更广泛地意味着利用、发挥作用，不仅用于系统漏洞的语境，还用于许多其他语境。在
    `F3EAD` 的语境下，它指提取在前期行动过程中收集的信息。当与传统情报周期对齐时，`Exploit` 阶段可被视为收集（尽管通常更多是内部收集信息的聚合）和处理的结合，以将该信息转化为可用格式以便分析。


    ## 战术 `OODA` 循环与战略 `OODA` 循环


    在第 2 章中，我们介绍了 `OODA` 循环模型，并讨论了它如何应用于事件响应。回顾一下，`OODA` 代表观察、调整、决策、行动，一般经验法则是：第一个完成
    `OODA` 循环的一方将通过率先基于完整信息采取行动而获得竞争优势。在 `F3EAD` 的前三个阶段——`Find`、`Fix` 和 `Finish` 中，我们经历了一个旨在为事件响应人员提供**战术竞争优势**的
    `OODA` 循环。在 `F3EAD` 的后半部分——`Exploit`、`Analyze` 和 `Disseminate` 中，目标是获得**战略竞争优势**。简而言之，我们想要如此深入地了解对手，以至于他们的常规战术和技术不再对我们奏效。对手将不得不退一步、重整旗鼓、尝试想出不同的方法来执行任务——所有这些都需要时间，并会使他们的任务和生活更加困难。这也给了我们更多时间来继续构建针对他们的防御和弹性。


    根据您团队的结构（我们将在第 10 章详细讨论），您实际上可能会同时运行这两个 `OODA` 循环。您团队的事件响应部分可能正埋头苦战于战术 `OODA`
    循环中，而您的情报团队则开始收集其战略 `OODA` 循环所需的信息。如果这些职能合二为一，以战术为重点的 `OODA` 循环可能会优先，并且您将在开始执行
    `Exploit` 阶段之前完成 `Find`、`Fix` 和 `Finish`。无论哪种方法都可以，重要的是您确实要进入第二阶段操作，因为战术优势可能只持续几天或几周，但战略优势将产生长远影响，并给您提供所需时间以准备应对未来无疑将到来的入侵。


    在战略 `OODA` 循环中，`Exploit` 阶段涵盖观察和调整这两个步骤。在这些步骤中，您开始筛选事件响应行动期间收集的海量数据，收集或聚合来自与该事件相关的先前事件或外部来源的额外信息，并捕捉这些信息对您的组织在过去、现在以及未来的潜在意义。这可能看起来是一项艰巨的任务，因此知道从何处入手会有所帮助。


    ## 利用什么？


    当 `F3EAD` 未正确实施或未完整执行时，您很可能会发现自己反复应对相同的入侵或类型的事件，而且很可能就在不远的将来。这不仅浪费时间，而且如果入侵导致敏感客户数据丢失，还可能招致额外的审查。2017
    年 9 月，信用报告公司 Equifax 遭遇入侵，导致 1.47 亿人的高度敏感信息被未经授权访问。2019 年，美国联邦贸易委员会提起诉讼，指控 Equifax
    未能妥善解决其 Web 应用程序系统中的已知漏洞，从而导致了该泄露事件。这一指控为未来公司在事件发生后，其安全实践（包括事件响应流程和跟进工作）接受严格评估奠定了基础。专注于
    `Exploit` 阶段将使识别额外风险并指出彻底处理事件所需的行动变得容易得多。


    在该循环之前的 `Find`、`Fix` 和 `Finish` 阶段，我们专注于特定攻击、特定对手以及处理该特定事件所需的特定行动。如果您碰巧识别或缓解了利用类似战术的对手的攻击，这只是一个幸运的巧合，绝非有意为之。在
    `ROAD RUNNER` 入侵事件的 `Finish` 阶段结束时，我们已识别出大量围绕该入侵、其背后的行为体及其作案手法的信息。但即使这些信息的组织方式有利于事件响应的快速响应性质，也不一定意味着它采用了适合后续情报分析的正确格式。


    在 `Exploit` 阶段，我们开始一个确保我们不仅处理，而且*从中吸取教训*的过程。我们关注威胁，而不仅仅是敌人。因此，重要的是我们不仅要提取与特定攻击相关的技术指标（如恶意软件样本和命令与控制
    IP 地址），还要提取导致入侵并使攻击者至少在一定程度上取得成功的总体因素。这包括攻击中被针对的漏洞或弱点信息、被针对的信息或系统，以及可能阻碍我们更早识别和行动的流程弱点。我们不仅仅是试图保护网络免受完全相同的攻击重演，而是要了解导致入侵成功的各种因素，如策略、技术漏洞或可见性差距，并为它们开发防护或检测措施。因此，我们认为几乎没有信息是*不*应该被利用和分析的——但这当然增加了管理这些信息的复杂性。


    为了使该过程更易于管理，我们倾向于将信息分解为以下类别：


    *   `Technical indicators`（技术指标）- IP、域名、哈希、证书等及其上下文信息

    *   `Tactics and techniques`（战术和技术）- 对手如何开展行动，最常使用 `VERIS` 或 `ATT&CK` 记录——我们将在本章后面详细介绍。`CVEs`
    或 `CWEs` 也可以归入此类别。

    '

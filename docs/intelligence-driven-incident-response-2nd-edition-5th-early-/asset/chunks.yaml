    Grey Spike begins operations by gaining an understanding of the network footprint
    of its targets, including domain names, mail servers, key technologies, and web
    and mobile applications. The group also gathers information on key personnel,
    such as campaign management, social media managers, and the technology consulting
    firms retained by the campaigns.


    ## Weaponization


    Grey Spike receives quarterly resource allocations including zero-day vulnerabilities,
    but in general prefers to use these when no other vector is available. In this
    case, the actor has a suite of download macros that it implants as payloads in
    documents custom-written in the target languages by regional and cultural specialists
    on loan from other departments within their intelligence agency. Additionally,
    infrastructure in the form of private servers used for C2 and delivery is rented
    in the name of shell companies from providers around the globe.


    ## Delivery


    The operators send the weaponized documents to key managers in the campaign staff.
    Each document is written to appeal to that manager specifically, including offers
    to provide financial contributions and endorsements. Because of the rapid pace
    of the campaign trail, the targets open these documents with a high success rate,
    allowing the adversary’s implants to run on their laptops.


    ## Exploitation


    The implant code runs in the form of a document macro that runs an older exploit
    for the PDF reader used by the campaign. Although a patch has been available for
    the vulnerability for some time, campaign staff have frozen all updates because
    of the belief by senior staff that this may cause outages at inopportune times.


    ## Delivery


    The exploit code is a downloader that then contacts a malware delivery server
    in a shared hosting environment at a popular ISP to install a remote access Trojan
    (RAT) on the target system. The RAT next contacts a C2 server at a bulletproof
    ISP in a third country.


    ## Command and control


    Grey Spike issues commands to the RAT via the C2 channel, in this case through
    encoded DNS lookups. Using their covert channel, they conduct searches for the
    target’s email and relevant documents. In addition to some of the information
    they’ve been tasked with acquiring, they find emails documenting shared accounts,
    including passwords that they can then use to extend their access throughout the
    network.


    ## Actions on Objective


    In this scenario, Grey Spike is tasked specifically with information retrieval
    only. The policy makers do not wish to interfere directly with the campaign, largely
    because of concern about political consequences, despite having the technical
    ability to destroy most of the data and online infrastructure of the candidates.


    Kill chains help to organize incident-response data in a way that allows you to
    visualize what the attack looked like as it took place, and can help identify
    patterns in activity. Another method to accomplish this is the diamond model,
    which we will discuss next.


    # Diamond Model


    The diamond model ([Figure 3-4](#ch03.html#fig_3_the_diamond_model)) for intrusion
    analysis differs in many ways from the kill chain, though later in this section
    we’ll discuss how they complement each other. Originally discussed in a seminal
    paper by Christopher Betz, Sergio Caltagirone, and Andrew Pendergast, they summarize
    the model as follows: “An *adversary* deploys a *capability* over some *infrastructure*
    against a *victim*. These activities are called *events*...events are phase-ordered
    by an adversary-victim pair into *activity threads* representing the flow of an
    adversary’s operations.” Ultimately, it is a paradigm for understanding the interaction
    between the various actors (the adversary and the victim) and the adversary’s
    tools (infrastructure and capabilities).


    ![](assets/image-to-come.png)


    The diamond model is an incredibly powerful tool for analyzing and understanding
    intrusions and it is worth it to understand how to use and extend the model in
    intrusion analysis.


    ## Basics of the Diamond Model


    An ***adversary*** is an intelligent party (actor) with intent to gather information
    or do harm to an information system. We can further break this down into the *operator*
    carrying out the actions and the *customer* who will benefit from the actions.
    The same person might fulfill both roles (in a small mercenary or financially-motivated
    adversary group), but not always (as in the case of a nation-state SIGINT agency
    where the customer and operator could come from different agencies, let alone
    teams). Adversaries will have an intent, which could be as general as “make money
    through credit card fraud” or as specific as “acquire the communications of a
    specified person regarding a particular topic of interest.”


    An adversary has a set of exploits and techniques, called a ***capability***,
    they can deploy to accomplish their goals. This includes the weaponized software
    and implants discussed in the kill chain, but it can also include the ability
    to carry out a social engineering attack or, in some cases, deploy some sort of
    physical ability, whether for gathering information or disrupting systems.


    An adversary uses a set of communication systems and protocols, called ***infrastructure***,
    to deliver or control a capability, or to cause some result on a victim. This
    includes systems owned directly by the adversary (e.g., desktops and network equipment
    in their physical possession) and systems compromised and re-purposed (e.g., end-user
    systems in a botnet).


    Adversaries target a ***victim*** against which they deploy their capabilities
    in the attempt to accomplish a certain intent. The victim includes people and
    assets, and both may be targeted separately. And as noted, a victim system may
    then be used as infrastructure against another victim.


    Each occurrence in which all four elements are present (an adversary using a capability
    across infrastructure against a victim) represents a single event. Events that
    feed into each other then are analyzed as *activity threads*, and we can further
    collect those threads into *activity groups* (related threads that may run in
    parallel or otherwise not necessarily flow linearly).


    ## Extending the Model


    One of the ways in which the model starts to demonstrate its power comes from
    looking at the axes across the diamond. The “north-south” axis connecting adversaries
    and victims represents a social-political relationship. The adversary has some
    interest in the victim, whether as a class (credit card numbers) or specifically
    (a CEO targeted for spear phishing to enable fraudulent wire transfers). Analysis
    of this axis can shed light on an adversary’s motivation and possibly assist with
    attribution or operational and strategic planning for intrusion detection and
    incident response.


    As mentioned at the beginning of this section, the diamond model complements the
    kill chain, and in fact the two integrate well. Each event in the diamond model
    can be categorized according to its phase in the kill chain. This allows the analyst
    to have a greater understanding of the relationship between events and consider
    investigating and documenting phases that you have previously neglected to investigate.
    (That said, not every phase of the kill chain will be present in every incident.)


    This model has also been extended to act as a clustering mechanism, where analysts
    attempt to compare multiple kill chains together to find similarities and group
    them into campaigns and actors (something we’ll discuss later on.


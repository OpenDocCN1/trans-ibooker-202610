    ## Key Assumptions Check


    3. Collect each participant''s responses and write them on a whiteboard, or if
    conducting the session virtually, on a collaboration document or via screen sharing.


    4. As a group, review the assumptions that have been identified and start brainstorming
    additional assumptions. One good question to ask to get this part moving is "what
    assumptions are so basic and fundamental that we would never even think to question
    them?"


    5. Once you have a solid list, go through each assumption and ask key questions
    about it such as "Why do we think this is true?" "How much evidence supports that
    this assumption is true?" "If this was true in the past, why do we think it is
    still true?" It is also helpful to propose counter assumptions - not necessarily
    the exact opposite of the assumption, but an alternate assumption that would significantly
    change the perception of a situation.


    6. For each assumption, evaluate as a group whether it is a sound or solid assumption,
    whether it is supported but with some caveats, or whether it is unsupported or
    questionable. Heuer Jr. and Pherson suggest using these three categories; however,
    other practitioners use a 1 to 5 scale to rate confidence in an assumption, with
    1 being totally unsupported conjecture, and 5 being an assumption with significant
    evidence supporting it. A 3 or less for any assumption should include a plan to
    gather additional information to help determine whether that assumption should
    remain part of the analysis - they are known as "key uncertainties" rather than
    key assumptions.


    7. One additional suggestion, especially if there are several key assumptions
    low on the confidence scale, is to assign each key assumption a place on a 2 x
    2 matrix measuring high and low certainty and high and low potential impact. Once
    they are all assigned a spot, based on group consensus, the low certainty/high
    impact assumptions are the ones to start trying to address most urgently.


    ![](assets/analyze_837710_02.png)


    It is important to note that you cannot do a key assumptions check at one point
    in time and then hold the position that the assumptions will always remain valid
    (or invalid, based on your findings). A key assumptions check does not turn an
    assumption into a fact or a piece of evidence; it remains an assumption, which
    means that at some point additional information may make it more or less valid.
    It is important to recheck your key assumptions periodically, for as long as they
    still remain central to your analysis.


    ### Analysis of Competing Hypotheses


    Analysis of Competing Hypotheses, or ACH, is a method developed by Richards Heuer
    that is used to evaluate multiple, alternate hypotheses and identify the most
    likely hypothesis based on the evidence. ACH is an eight-step process that aims
    to force an analyst to look at all possibilities rather than to identify a hypothesis
    based on intuition and look for evidence that supports that hypothesis. The eight
    steps are as follows:


    1. Identify the possible hypotheses to be considered. Heuer recommends using a
    group of analysts with different backgrounds and different perspectives to brainstorm
    the possibilities. It is also important to differentiate between an `unproven`
    hypothesis and a `disproven` hypothesis during this step. An `unproven` hypothesis
    is one where there is no evidence that it is correct, whereas a `disproven` hypothesis
    is one where there is evidence that the hypothesis is incorrect. Include an `unproven`
    hypothesis, no matter how improbable, in the ACH process, but do not include `disproven`
    hypotheses.


    2. Make a list of significant evidence for and against each hypothesis. If you
    have already gone through the process of evaluating key assumptions, this step
    should be relatively simple; you already have the key pieces of evidence that
    contribute to the various hypotheses.


    3. Create a matrix with hypotheses across the top and evidence down the side and
    evaluate whether each piece of evidence supports or refutes each hypothesis. See
    [Figure 5-3](#ch05.html#fig_3_ach_matrix_template_completed_ach_matrix) for an
    example of this matrix. There are several approaches to filling out the matrix.
    Richard Heuer suggests listing whether each piece of evidence is consistent with
    the hypothesis by putting a `C`, if it is inconsistent with the hypothesis by
    putting an `I`, or if it is neutral or not applicable, in which case you would
    put `N/A`. Others suggest using a weighing scale such as a plus sign (`+`) if
    a piece of evidence moderately supports a hypothesis or two plus signs (`++`)
    if it strongly supports a piece of evidence, and so forth.


    ![](assets/analyze_837710_03.png)


    In the matrix in [Figure 5-3](#ch05.html#fig_3_ach_matrix_template_completed_ach_matrix),
    we can see that `H3` is not supported by any piece of evidence, and therefore
    would be removed from the matrix. Likewise, `E3` is not applicable to any of the
    hypotheses, and `E5` is inconsistent with every hypothesis, so the analyst would
    need to go back and reevaluate those pieces of evidence to make sure that they
    are both relevant to the analysis and are accurate. It is possible for a flawed
    or biased piece of evidence to make it through the evaluation stage, and this
    is another opportunity to identify whether something should be considered in the
    analysis.


    4. Conduct initial analysis to refine the matrix. After step 3, the matrix should
    show a few things: some hypotheses may have Inconsistent (`I` or `-`) assessments
    for every piece of evidence. Although this doesn''t disprove a hypothesis, if
    there is no evidence to support it, then it should be removed from the matrix
    (see [Figure 5-3](#ch05.html#fig_3_ach_matrix_template_completed_ach_matrix)).
    Similarly, if a piece of evidence has an `N/A` assessment for each hypothesis,
    the analyst should either remove it from the matrix or, if it truly is a key piece
    of evidence, should reevaluate whether there is another hypothesis that needs
    to be considered.


    One thing that incident responders may run into from time to time is evidence
    from a separate, unrelated intrusion ending up in the analysis, simply because
    it was identified around the same time as the other evidence. When something does
    not match up with any other evidence, it may be best to remove it from the current
    analysis and analyze it on its own.


    5. Draw initial conclusions about the likelihood of each hypothesis. Focus on
    disproving the hypotheses rather than proving them to be correct. After the matrix
    has been initially refined, you can evaluate the likelihood of each hypothesis
    based on how much of the evidence supports it. In the example in [Figure 5-3](#ch05.html#fig_3_ach_matrix_template_completed_ach_matrix),
    `H1` has the most supporting evidence, and if it is deemed by the analyst that
    `E5` is not a valid piece of information, then there is no evidence that contradicts
    this hypothesis. `H1` would therefore be considered the most likely hypothesis.
    `H2` and `H4` both have evidence that supports them, but also have evidence that
    is inconsistent with them; therefore, they are less likely. If any of the evidence
    that was marked as inconsistent proves that those hypotheses are incorrect, they
    would be considered `disproven` hypotheses. It is easier to disprove a hypothesis
    than it is to prove that a hypothesis is absolutely true.


    6. Analyze how much of your conclusion is dependent on a single piece of evidence.
    Re-analyze the information that led to your judgment of the most likely hypothesis
    or led to a hypothesis being disproven. Was there a single piece of evidence that
    weighed most heavily? If so, how confident are you in that piece of evidence?
    This will help determine the overall confidence in a judgment. If multiple pieces
    of evidence from various sources strongly support a hypothesis, there will be
    higher confidence in the assessment than if the judgment was based on one or two
    key pieces of information from a single source.

    '
  trans: '

    ## 关键假设检查


    3. 收集每位参与者的回答并将其写在白板上，如果是虚拟会议，则写在协作文档上或通过屏幕共享展示。


    4. 作为一个小组，回顾已识别的假设并开始头脑风暴寻找其他假设。一个推动此环节的好问题是：“哪些假设过于基础和根本，以至于我们从未想过要质疑它们？”


    5. 一旦你有了一个可靠的清单，逐一检查每个假设并针对其提出关键问题，例如：“我们为什么认为这是真的？”“有多少证据支持这一假设为真？”“如果这在过去是真的，我们为什么认为它现在仍然是真的？”提出反面假设也很有帮助——不一定是该假设的完全相反面，而是一个会显著改变对局势看法的替代假设。


    6. 对于每个假设，作为一个小组评估它是否合理可靠，是否有支持但附带一些警示，或者是否无支持或存疑。Heuer Jr. 和 Pherson 建议使用这三个类别；然而，其他从业者使用
    1 到 5 的等级来评估对假设的信心，其中 1 代表完全无根据的推测，5 代表有大量证据支持的假设。任何评分在 3 分或以下的假设都应包含一个收集更多信息的计划，以帮助确定该假设是否应保留在分析中——它们被称为“关键不确定性”，而非关键假设。


    7. 还有一条额外建议，特别是当有几个关键假设在信心量表上得分较低时，将每个关键假设放置在一个衡量高/低确定性和高/低潜在影响的 2 x 2 矩阵中。一旦根据小组共识全部分配好位置，低确定性/高影响的假设就是最需要优先解决的。


    ![](img/analyze_837710_02.png)


    需要注意的是，你不能在某一时间点进行一次关键假设检查，然后就坚持认为这些假设将永远保持有效（或根据你的发现判定为无效）。关键假设检查并不能将假设变为事实或证据；它仍然是一个假设，这意味着在某个时刻，额外的信息可能会使其变得更有效或无效。定期重新检查你的关键假设非常重要，只要它们仍然是你分析的核心，就应持续检查。


    ### 竞争假设分析


    竞争假设分析（Analysis of Competing Hypotheses，简称 ACH）是由 Richards Heuer 开发的一种方法，用于评估多个备选假设并根据证据确定最可能的假设。ACH
    是一个八步流程，旨在迫使分析师审视所有可能性，而不是基于直觉确定一个假设，然后寻找支持该假设的证据。这八个步骤如下：


    1. 确定待考虑的可能假设。Heuer 建议使用由不同背景、不同视角的分析师组成的小组来头脑风暴各种可能性。在此步骤中，区分 `unproven`（未证实）假设和
    `disproven`（已证伪）假设也很重要。`unproven` 假设是指没有证据表明其正确的假设，而 `disproven` 假设是指有证据表明其不正确的假设。无论多么不可能，都应将
    `unproven` 假设纳入 ACH 流程，但不要包含 `disproven` 假设。


    2. 列出支持和反对每个假设的重要证据。如果你已经完成了关键假设评估的过程，这一步应该相对简单；你已经拥有了支撑各种假设的关键证据。


    3. 创建一个矩阵，顶部列出假设，侧边列出证据，评估每项证据是支持还是反驳每个假设。请参阅 图 5-3 了解该矩阵的示例。填写矩阵有几种方法。Richard
    Heuer 建议通过标记 `C` 表示每项证据与假设一致，标记 `I` 表示不一致，如果是中性或不适用，则标记 `N/A`。其他人建议使用权重标度，例如用加号（`+`）表示证据中度支持假设，用两个加号（`++`）表示强力支持，依此类推。


    ![](img/analyze_837710_03.png)


    在 图 5-3 的矩阵中，我们可以看到 `H3` 没有任何证据支持，因此应从矩阵中移除。同样，`E3` 不适用于任何假设，而 `E5` 与每个假设都不一致，因此分析师需要回头重新评估这些证据，以确保它们既与分析相关又准确。有缺陷或有偏见的证据可能通过了评估阶段，这提供了另一个机会来判断某事项是否应纳入分析考量。


    4. 进行初步分析以优化矩阵。完成步骤 3 后，矩阵应显示出一些情况：某些假设可能对每项证据都获得了不一致（`I` 或 `-`）的评估。虽然这不能证伪一个假设，但如果没有证据支持它，则应将其从矩阵中移除（请参阅
    图 5-3）。同样，如果一项证据对每个假设的评估都是 `N/A`，分析师应将其从矩阵中移除，或者，如果它确实是关键证据，则应重新评估是否还有其他假设需要考虑。


    事件响应人员有时会遇到一种情况：来自独立、无关入侵的证据混入了分析中，仅仅是因为它被发现的时间与其他证据大致相同。当某事项与任何其他证据都不吻合时，最好将其从当前分析中移除，单独进行分析。


    5. 对每个假设的可能性得出初步结论。重点在于证伪假设，而非证明其正确。在矩阵初步优化后，你可以根据有多少证据支持来评估每个假设的可能性。在 图 5-3 的示例中，`H1`
    拥有最多的支持证据，如果分析师判定 `E5` 不是有效信息，则没有证据反驳该假设。因此 `H1` 会被视为最可能的假设。`H2` 和 `H4` 都有支持证据，但也有与之不一致的证据；因此它们可能性较小。如果任何被标记为不一致的证据证明这些假设不正确，它们将被视为
    `disproven`（已证伪）假设。证伪一个假设比证明一个假设绝对为真更容易。


    6. 分析你的结论在多大程度上依赖于单一证据。重新分析导致你判断出最可能假设或导致某假设被证伪的信息。是否有单一证据起了决定性作用？如果有，你对该证据有多大信心？这将有助于确定判断的总体信心。如果来自不同来源的多项证据强力支持一个假设，评估的信心会比仅基于单一来源的一两条关键信息做出判断时高得多。

    '

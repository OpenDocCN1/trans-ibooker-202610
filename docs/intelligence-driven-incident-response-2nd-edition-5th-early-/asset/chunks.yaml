- raw: 'As you go through the process of collecting information, you most likely subconsciously
    start to form a hypothesis about whatever question you are trying to answer, which
    is the beginning of analysis. Analysis involves taking all of the information
    you have and synthesizing and interpreting it in order to determine its meaning
    and ideally what should be done about it. In order for analytic judgements to
    be complete, accurate, and reproducible, it is best to follow a structured process
    to conduct your analysis.


    ## Developing Your Hypothesis


    At this stage, we begin to get into the actual analysis, which begins with clearly
    stating your hypothesis. As mentioned previously, you usually begin to come up
    with some working answers to your question during the collection/enrichment process.
    At the hypothesis development phase, you should start to document those working
    answers, no matter how speculative or far-fetched they are; the rest of the analytic
    process will weed out the obviously incorrect ideas. Make sure that when you document
    your ideas, you write them as fully as possible, and if specific information was
    found during collection that led to the formation of a particular hypothesis,
    make sure to note what it was. This will help with evaluating the hypothesis further
    down the road. If you cannot clearly articulate an idea, or you discover that
    it is too vague or doesn’t answer the question that you are asking, then it is
    not a good working idea, and you can move on to the next possible hypothesis.


    In the case of our Road Runner intrusion, the first thing we want to understand
    is whether we were specifically targeted. Everything we have seen from this adversary
    indicates that they are a sophisticated threat group that is deliberate in their
    targeting, but we want to analyze the data we have to confirm that we were targeted.
    Our hypothesis, based on the information we gathered during the investigation
    and internal enrichment data about who at our organization was targeted, is that
    this was in fact a targeted attack aimed at obtaining sensitive information related
    to our campaign. This hypothesis is specific and is based on our research, but
    it still needs to be verified by going through the rest of the structured analytic
    process.


    Over the course of your career, developing a hypothesis will become easier for
    several reasons. First, many incidents have similarities, and it will become easier
    to identify indications of a particular behavior. While this can cut down on the
    time it takes to carry out the analytic process, it is important to  *not* assume
    that this answer is correct; it is still just a hypothesis. Make sure that you
    go through the rest of the process even when the answer seems obvious, and make
    sure that you account for assumptions and biases, which we will discuss next.


    The second reason that hypothesis development becomes easier is that after many
    iterations of this process as you step through numerous investigations, the mind
    often becomes more creative and less concerned when generating possible answers.
    After working through the analytic process and becoming comfortable with the fact
    that bad ideas *will* be identified and weeded out, an analyst can explore all
    possible ideas, often coming up with new ideas that they would not have identified
    before.


    Regardless of how easy or difficult it is to generate your hypothesis, when you
    have a working hypothesis, the next step in the process is to evaluate the assumptions
    upon which that hypothesis is based so that you can move into the judgement and
    conclusion stage aware of and accounting for your biases.


    ## Evaluating Key Assumptions


    As we discussed in the section on Structured Analytic Techniques, a *key assumption*
    is any part of a hypothesis that relies on a preexisting judgment or belief. Before
    continuing with the analysis, teams or individuals should take a few minutes or
    a few hours to identify these key assumptions and determine whether they are valid
    and should contribute to the analysis. For example, if an analyst has developed
    a hypothesis about how a particular attack could have been prevented, it is based
    on an assumption of how the attack was carried out, which would have been identified
    during the Find, Fix, and Finish phases. It should be relatively easy to evaluate
    whether that assumption is correct, but it should still be documented and discussed
    to make sure that all analysts have the same understanding of the information
    that contributed to the hypothesis. 


    We outlined the SAT process for conducting a key assumptions check earlier in
    the chapter, however there are other methods for evaluating assumptions at different
    stages of analysis. The [CIA’s Tradecraft Primer](http://bit.ly/2vrrGmm) outlines
    how to evaluate key assumptions after hypothesis generation, and highlights the
    many benefits of going through this process. These benefits include developing
    an understanding of the key issues that contribute to a hypothesis, identifying
    faulty logic, and stimulating discussions among analysts. The process for evaluating
    key assumptions is as follows:


    1.  Identify all key assumptions about a situation or hypothesis.


    2.  Identify why the assumption was made.


    3.  Assess the confidence in the assumption.


    4.  Identify how the confidence rating was determined.


    5.  Challenge each assumption and determine whether it is true and remains true
    for the current situation.


    6.  Remove any assumptions that are not true or that have a low confidence; these
    should not be used in the analysis. It is important to note that you do not have
    to remove a hypothesis that has been generated because it was associated with
    an assumption that was removed, however it is important that there is still other
    evidence or other higher confidence assumptions in order for the hypothesis to
    remain plausible.


    Our hypothesis that the Road Runner intrusion targeted us specifically is based
    on several assumptions. First, we are assuming that the actor who targeted us
    is Grey Spike, and that the activity we are calling Road Runner was this actor’s
    attempt to access multiple campaigns similar to ours. This is a key assumption,
    and it is made based on the fact that the information we obtained on the actor
    matched what we found in our network, including tactics, techniques, technical
    indicators, and targeting. We are confident in the accuracy of this assumption,
    based on the technical details and the timing. We are aware that additional information,
    especially information regarding deception activities on the part of the attacker,
    may change this assumption, and we will be prepared to change our analysis if
    any new information of that nature is identified.


    Assumptions are not always easy to evaluate, and include things such as cognitive
    biases, which are logical fallacies or flaws in thinking that can easily cloud
    an analyst’s judgment. It is not possible to completely remove biases from analysis.


    ## Judgment and Conclusions'

- raw: "*   Based on your tools, complete the necessary logistical steps to prep them\
    \ for exploitation - whether this means creating a new file based off of a template,\
    \ identifying that tags that will be used when entering data into a database,\
    \ or beginning a new wiki page that will house all of the information from this\
    \ incident. \n\n*   Working down the checklist you created of data to be aggregated,\
    \ begin moving data from disparate sources into your tool of choice, checking\
    \ off one source once it is complete.\n\nHaving a clear process to get from a\
    \ pile of data post-incidents to a structured, comprehensive set of information\
    \ ready for analysis is one of the best ways to set yourself up for success. The\
    \ system you develop may involve multiple people focusing on different functions\
    \ within the system, or it may just be a process for yourself. You may add timelines\
    \ or milestones into the process to keep you on track and accountable, or you\
    \ may find that every incident is so different that timelines don’t matter as\
    \ much as just moving through the steps. The important part is to document how\
    \ you will move through the data extraction process and to be comfortable updating\
    \ or revising the process as goals, tools, or needs change. \n\n### Step 4: Launch\
    \ and iterate  \n\nThis where you dive in. This can be the hardest part of the\
    \ whole process - even if you have the right tools and a solid process you have\
    \ to actually start working through the steps in a systematic way. Try things\

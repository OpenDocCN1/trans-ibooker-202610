- raw: 'Strategic intelligence, when used to support business operations, relies heavily
    on an understanding of the defending organization’s business. Many security professionals
    struggle with supporting strategic-level business decisions because they do not
    take the time to understand the problems that the business is facing or what information
    is critical to operations. Without understanding the business, it is nearly impossible
    for intelligence analysts or incident responders to produce strategic intelligence
    that will help leaders make the best decisions for their organization’s security.


    Like all things in security, business operations and priorities are not static,
    so it is important to continually update and gather new information as it becomes
    available. *Business sources* include information on the markets an organization
    operates in, competitors, challenges to the business, new regions or markets that
    the business is planning to expand into, key personnel changes, and other aspects
    of business operations that have been identified as significant.


    In addition to these sources of information (geopolitical, economic, historical,
    and business), which are more strategically focused than other collection sources
    discussed in earlier chapters, it is also important to incorporate information
    from previous incidents into strategic analysis. Doing so allows the analyst to
    present a holistic picture of what is being seen in the network combined with
    additional insight into historical, political, and economic trends that may influence
    the threats that an organization faces. All of this information will be pulled
    together in the strategic analysis phase.


    ## Analysis


    Analysis at the strategic level follows the same process described in Chapter
    8. Requirements are clearly stated, collection and processing occur, and hypotheses
    are developed and tested by researching and reviewing evidence that supports or
    refutes them. Strategic intelligence teams, however, must analyze a larger and
    more diverse data set, and therefore a larger team with diverse backgrounds and
    experiences should be utilized. You should keep these points in mind when conducting
    strategic-level analysis:


    *   The evidence to be considered will come not just from network information,
    as is often the case with incident response, but from many sources that the analysts
    may or may not have subject matter expertise or substantial knowledge of. In those
    cases, understanding the source of the information is especially relevant because
    the analysts will often end up taking the information at face value. Look for
    information that comes from peer-reviewed, reputable sources. If a particular
    piece of evidence is deemed to be a key during a process such as analysis of competing
    hypotheses, it is best to try to find more than one source that is reporting the
    same information.


    *   Biases can run rampant in strategic intelligence, where there is often a smaller
    amount of tactical evidence and more evidence that is open to interpretation.


    ## Processes for strategic intelligence


    Some specific processes are more conducive to strategic-level intelligence, and
    others are far less effective at this level. For example, the target-centric model,
    which is an asset to an analyst investigating an intrusion or working at the operational
    and campaign level, is not as useful at the strategic level because as we discussed,
    many of the target models are being developed during the analysis.


    Several analytic models and processes stand out as particularly useful for strategic
    intelligence, including SWOT analysis, brainstorming, and scrub down.


    ### SWOT analysis.


    *Strength, Weakness, Opportunity*, and *Threat* (SWOT), is a model that is commonly
    used in risk management. SWOT takes into consideration internal aspects (strengths
    and weaknesses) as well as external aspects (opportunities and threats). It also
    lends itself to strategic intelligence specifically around network security and
    defense, because in many cases it will identify big-picture problems and concerns
    that will need to be addressed. It requires that an organization have a solid
    understanding of its core competencies and where they excel, be honest and up
    front about the issues that they face, and understand the external threats that
    are facing them. The basic outline for SWOT analysis is pictured in [Figure 6-5](#ch06.html#fig_5_swot_analysis).


    ![](assets/strategic_intelligence_466966_05.png)


    For example, if documentation indicates that 90% of successful intrusions into
    the network come from phishing emails, this demonstrates a weakness of the organization
    that needs to be addressed. Identifying strengths can help determine steps that
    can be taken to mitigate those weaknesses.


    SWOT analysis is useful not only for determining an organization’s own strengths
    and weaknesses. It can also be used to analyze a foreign government, a criminal
    organization, or an attack group. To conduct this analysis, it is important to
    pull heavily from the research that was done in the collection phase. An important
    part of using this type of SWOT analysis is to look for places where an adversary’s
    strengths line up with your organization’s weaknesses. Those are places that need
    to be addressed.


    ### Brainstorming


    Strategic intelligence analysis should not be the work of one individual. As we
    mentioned, it is helpful to have multiple analysts with different backgrounds
    focusing on identifying the issues that will have a significant impact on an organization
    moving forward. An analysis on past intelligence failures (an analysis of analysis,
    one might say) has found that many times an intelligence failure is the result
    of group think, which discourages creativity and thinking outside of the box.
    General James Mattis said there is no place for group think, especially when it
    comes to national policy ([http://washex.am/2trKeBt](http://washex.am/2trKeBt)):
    “The national security decision-making process, as you know, you need different
    ideas to be strongly argued. You don’t want the tyranny of consensus of group-think.”


    Brainstorming, especially with a group that comes from different disciplines,
    is a good way to counter group think by encouraging new and creative approaches
    to problems. Brainstorming can be used on its own or with nearly any other analytic
    method. Although it sounds as if it is unstructured, the CIA’s Tradecraft primer
    notes that brainstorming should be structured in order to be most effective. One
    of the most critical components of successful brainstorming is to allot enough
    time at the beginning of the process to enable the group to explore a wide variety
    of possibilities. When a group is time-constrained or feels rushed, they are more
    likely to select a smaller group of hypotheses that sounds realistic rather than
    exploring a larger set of possibilities that may generate new insight into an
    issue. It is also a good idea to ensure that at least one person is participating
    in the brainstorming who has a different role or approach than the team. Although
    getting together a group of incident responders to brainstorm will likely bring
    more than one point of view, it is still likely to be constrained to the typical
    experiences of an incident responder. By bringing in an outsider, whether that
    is a systems administrator, security architect, or someone from human resources,
    having new and different perspectives in the group will also discourage group
    thinking and force the rest of the team to consider new angles.'

- raw: 'All too often, incident responders find themselves dealing with the same situation
    manifesting itself in the same way. The same vulnerabilities, the same lateral
    movement, maybe even the exact same stolen or reused passwords, and very often
    the same adversaries. At that point, many find themselves shaking their fists
    at the sky, asking how this could have happened. Didn’t we learn from the last
    time? Didn’t we fix the problems? And unfortunately, the answer is often no. When
    the last incident was resolved, there were other things to worry about, other
    problems requiring the attention of everyone from the security team to the IT
    manager to the CIO, and since the problem had been “resolved” there was no more
    time to spend thinking about it. Lessons were not learned, and although some small
    changes may have been made, there was no lasting impact on the security of the
    organization because new, urgent problems took priority. Investing time in strategic
    intelligence, both understanding the “big picture” and assessing how individual
    incidents validate or change that understanding will help prevent incident dejavu
    and not only help protect your organization, but also help your security teams
    stay focused on emerging threats rather than the same threats time after time.
    In this chapter we will cover what strategic intelligence is, how it fits into
    the intelligence-drive incident response process, and how you can utilize it,
    whether you have a team or 1 or 100.


    # What Is Strategic Intelligence?


    Nothing happens in a vacuum - even (especially!) network intrusions. Everything
    happens within a specific context - the strategic environment - and that context
    holds a great deal of importance across the entire F3EAD process and beyond. The
    strategic environment extends far beyond your own networks, data, and the tactical
    and operational impacts of an intrusion. It includes geopolitical, economic, social,
    and technological issues, along with many other variables. Strategic intelligence
    provides the necessary information for planning future actions and policies and
    helps decision makers tackle long term projects and initiatives.


    Strategic intelligence gets its name not only from the subjects that it covers,
    typically a high-level analysis of information with long-term implications, but
    also from its most common audience. Strategic intelligence is geared toward decision
    makers (most often business/agency senior leadership) with the ability and authority
    to act, because this type of intelligence should shape policies and strategies
    moving forward. This doesn’t mean, however, that leadership is the only group
    that can benefit from these insights. Strategic intelligence is extremely useful
    to all levels of personnel because it can help them understand the surrounding
    context of the issues that they deal with at their particular levels. Helping
    individuals understand why certain policies were created, or why an emphasis is
    being placed on a particular area will help them to fulfill their role more effectively.


    In his paper, “[The State of Strategic Analysis,](https://www.cia.gov/static/789d2c84e758c9111bdaaa2adb8c628a/the-state-of-strategic-intelligence.pdf)”
    John Heidenrich wrote that “a strategy is not really a plan but the logic driving
    a plan.” When that logic is present and clearly communicated, analysts can approach
    problems in a way that supports the overarching goals behind a strategic effort
    rather than treating each individual situation as its own entity. When that logic
    is NOT there following any plan can become incredibly difficult, and knowing when
    the plan should be modified is even harder.


    Strategic intelligence supports intelligence-driven response processes by helping
    analysts prioritize responses, identify when an intrusion is particularly significant
    to their organization, and ensure that the lessons learned from each incident
    are analyzed and acted upon. Without strategic intelligence, intelligence-driven
    incident response can still provide insight and support to the incident-response
    process, but with strategic intelligence it can drastically improve an organization’s
    ability to understand and posture themselves to prevent, identify, and respond
    to subsequent intrusions. But how does one *get* to strategic intelligence? How
    can you identify the logic that will help dictate the plan that you will follow,
    especially when there are so many other time-sensitive needs competing for your
    attention?


    ## Sherman Kent: Father of American Intelligence Analysis


    Sherman Kent is known as the father of American intelligence analysis, and quite
    literally wrote the book on intelligence analysis with his book Strategic Intelligence
    for World Policy (still a great read almost 60 years later). He was so instrumental
    to the intelligence discipline that the CIA’s school to train new intelligence
    analysts is called the Sherman Kent School for Intelligence Analysis.


    Kent received a doctorate in history from Yale University and taught on the faculty
    until World War II, when he joined a new division of the newly formed foreign
    intelligence service (and CIA precursor) Office of Strategic Services (OSS) called
    the Research and Analysis Branch (R&A). There, Kent used his experience as a historian,
    combined with an ability to lead, to bring together economists, scientists, philosophers,
    poets, and military members to conduct some of the most influential analysis of
    the war. Kent and the R&A analysts were not planning operations or tactical skirmishes;
    they were analyzing the underpinnings of the enemy and operating environment.
    They analyzed the cultures and the resources available (food, finances, and transportation)
    to help the United States determine what actions would have the most significant
    impact to the national strategy. They generated strategic intelligence that helped
    not just a single mission, but the entire war effort.


    In many cases, one of the most significant differences between strategic and tactical
    or current intelligence is the modeling process. In tactical and current intelligence,
    analysts use the models that they have available, whether that model is an actor
    dossier or an internal network map, to solve the problem at hand. In strategic
    analysis, those models are often being updated or developed for the first time.
    In fact, when strategic analysts start leveraging only pre-existing models, whether
    mental or tangible, they run the risk of missing significant changes in the way
    the world functions making their analysis less effective, and in some cases flat
    out wrong.


    While it is beneficial to have a corpus of work to look back on when applying
    these principles to modern intelligence-driven incident response, it is also important
    to understand how the world has changed since World War II and how that may change
    some of the doctrine intelligence analysts rely on.


    ## The Role of Strategic Intelligence in IDIR


    The strategic intelligence of Sherman Kent’s day was designed to inform policy
    makers at the strategic level of what they needed to know in order to make the
    right decisions. Analysts often had access to information that no one else did,
    and were able to provide insight that would otherwise have been lost to policy
    makers. Things have changed quite a bit since that time, and leaders are often
    dealing with too *much information* rather than too little.'

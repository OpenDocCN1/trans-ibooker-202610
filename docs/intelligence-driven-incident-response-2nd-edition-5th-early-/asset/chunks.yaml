- raw: "As we mentioned, strategic intelligence can be thought of as the logic behind\
    \ a plan, and so the primary role of strategic intelligence in IDIR is often before\
    \ or after an incident, rather than during, with a few exceptions. When leveraged\
    \ before an incident, strategic intelligence can shape the response process itself,\
    \ helping to identify how critical the response process is to an organization\
    \ and whether there are any particular requirements to keep in mind - for example\
    \ legal requirements about when and how to report the incident, and what type\
    \ of data exposure warrants reporting. It can also help position defenses based\
    \ off of an understanding of the strategic threat landscape and any significand\
    \ world events that may have an impact on security. After an incident is the time\
    \ when new information that was learned through the intelligence-driven incident\
    \ response process is integrated into the existing understanding of the key questions\
    \ that are often asked by leaders and executives, primarily things like:\n\n*\
    \   Who is targeting our organization?\n\n*   What are they after?\n\n*   How\
    \ effective are we at preventing attacks?\n\n*   What is the impact of a successful\
    \ intrusion?\n\nIt is important to note that while it is critical to include information\
    \ from your own incidents to update the answers to these questions, they can also\
    \ be influenced by intrusions that have occurred elsewhere that you learned about\
    \ via threat information sharing or media reporting. If you are basing updates\
    \ to strategic intelligence on media reporting, however, it is important to make\
    \ sure that you have enough insight into what happened and trust the validity\
    \ of the reporting before making significant changes to the way your organization\
    \ views threats.\n\nThere are, as always, exceptions. While most often applied\
    \ before and after, there are times when strategic intelligence can be directly\
    \ leveraged during the incident response process. In these cases, analysts are\
    \ often not generating strategic intelligence - after all the direct focus of\
    \ incident response is often tactical in nature which requires a different way\
    \ of thinking - but are instead turning towards strategic intelligence to help\
    \ understand a potential contradiction that is stalling or even halting analytic\
    \ progress. As Father Richard Rohr wrote, “Dictionaries define a *contradiction*\
    \ as two things that cannot be true at the same time. I would say it this way:\
    \ a contradiction is two things that cannot be true at the same time *by your\
    \ present frame of logic.”* As analysts, we always view the information that we\
    \ are analyzing through a specific frame, and when something does not make sense\
    \ or does not seem like it should be possible, that often means the analyst needs\
    \ a new frame. The process of reframing a mindset can be very difficult when remaining\
    \ “in the weeds” (where many incident responders like to stay). Reframing, or\
    \ changing your present state of logic, often requires taking a step back and\
    \ looking to the bigger picture, which is what strategic intelligence provides.\
    \ When using a structured analytic technique like a Key Assumptions Check, it\
    \ can be beneficial to turn towards existing strategic level intelligence to help\
    \ counter biases and identify information that may make the assumptions untrue.\n\
    \n## Intelligence Beyond Incident Response\n\nThis is as good a time as any to\
    \ bring up a key concept that the threat intelligence world is still coming to\
    \ terms with: intelligence can go far beyond just supporting detection engineering,\
    \ intrusion detection, and incident response activities. Throughout this chapter\
    \ we’re discussing strategic intelligence, how threat intelligence can be used\
    \ to help an organization’s leadership make better decisions, but many other security\
    \ decisions benefit from decision support.\n\n### Red Teaming\n\nThe first way\
    \ to use Intelligence beyond tactical/operational defensive operations is using\
    \ it to inform adversarial operations. In red teaming an internal team acts as\
    \ an adversary to challenge the intrusion detection and incident response teams.\
    \ In many organizations the red team develops their own persona, often based on\
    \ the red team’s engineers’ capabilities. If the team knows how to build zero\
    \ days then the red team adversary will leverage zero days. If the red team engineers\
    \ typically use the Metasploit Framework then the simulated adversary will use\
    \ Metasploit. Even more complex is if the red team engineers know a programming\
    \ language like Python then the adversarie’s tools will end up being written in\
    \ Python.\n\nYou might be noticing at this point that the only adversary we’ve\
    \ talked about at this point is the artificial one. That’s the problem. Giving\
    \ the defense an adversary to track and respond to teaches them how to track and\
    \ respond to that simulated adversary. But if the simulate adversary isn’t similar\
    \ enough to the real adversaries an organization faces then the defense won’t\
    \ learn useful lessons. For example, if the red team uses HTTP beacons over 80/tcp\
    \ (because it’s easier to build or download sample remote access Trojans that\
    \ just use well understood protocols like HTTP) but the organizations main adversary\
    \ uses encoded in DNS then the tools, techniques, and procedures (yep, defense\
    \ has TTPs too) the blue team develops responding to the red team may not be very\
    \ effective.\n\nSo what way would be better? Well, the most obvious approach is\
    \ for red teams to act more like real adversaries. Unfortunately, most red teams\
    \ don’t know what real adversaries act like. This is somewhat expected. Most red\
    \ teamers migrate out of one of three other roles which explain their... lack\
    \ of perspective (sorry red teamers!):\n\nApplication Security Analysts\n\n: \n\
    \nThey are focused on hunting through code for vulnerabilities. Some write fixes,\
    \ some write exploits. Either way their approach is always going to be more focused\
    \ on the vulnerability/exploit than how they’re really used in the real world.\n\
    \nVulnerability Analysts\n\n: \n\nMost of these folks focus on using tools like\
    \ scanners to understand where there are network vulnerabilities. They know how\
    \ to interpret the outputs of these tools, but don’t understand the kinds of objectives\
    \ adversaries are after or the stages after initial exploitation.\n\nFormer Offensive\
    \ Engineers\n\n: \n\nWhile rare there are a small number of folks who were “real”\
    \ offensive engineers. These folks, usually former government, have actually conducted\
    \ intrusions. They do know what adversary tradecraft looked like, at least at\
    \ one point in the past, but often can’t disclose it. Subconsciously they may\
    \ emulate it, but not all nation state adversaries operate the same way, and chances\

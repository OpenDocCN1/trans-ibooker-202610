    It is no secret why most security teams stop short of completing the `F3EAD` cycle:
    it’s hard enough to generate intelligence, but managing it is a whole new series
    of headaches. Dealing with processes, timing, aging, access control, and formats
    is enough to make anyone’s head spin. And yet, as undeniably complex as these
    problems are, they have to be addressed head on. Properly extracting and capturing
    information about an incident and ensuring that it is followed up on can mean
    the difference between truly remediating an adversary’s access to your network
    and simply delaying their return and eventual success. Exploiting the intelligence
    that you have generated during the incident-response process ensures that all
    of the time and energy that went into identifying, understanding, and remediating
    the incident further supports network defense and response processes across the
    board. For your own organization at least, and ideally many others. This chapter
    describes the various tasks you should do in the `Exploit` phase of `F3EAD` and
    will make the process a little less daunting and, dare we say, maybe even a little
    exciting.


    ### Note


    We’ve discussed the occasional difficulties between military jargon and common
    information security vernacular, and `Exploit` just happens to be one of the big
    ones. In information security, we tend to almost exclusively use the term exploit
    to refer to the exploitation of a vulnerability that will give an adversary system
    access or information. By contrast, in military terms, exploit more broadly means
    to take advantage of and is used not only in the context of system vulnerabilities
    but many other contexts as well. In the context of `F3EAD`, it refers to extracting
    information that has been collected during the course of pre-operations. When
    lined up with the traditional intelligence cycle, the `Exploit` phase can be considered
    a combination of collection (though usually more of an aggregation of internally
    gathered information) and processing to get that information into a usable format
    so that it can be analyzed.


    ## Tactical Versus Strategic `OODA` Loops


    In Chapter 2 we introduced the `OODA` loop model and discussed how it applied
    to incident response. To review, `OODA` stands for Observe, Orient, Decide, Act,
    and the general rule of thumb is that the first side to get through the `OODA`
    loop will gain a competitive advantage by acting on complete information first.
    In the first three phases of `F3EAD` - `Find`, `Fix`, and `Finish` - we moved
    through an `OODA` loop aimed at giving incident responders a `tactically competitive
    advantage`. In the second half of `F3EAD` - `Exploit`, `Analyze`, and `Disseminate`,
    the goal is to gain a `strategically competitive advantage`. In short, we want
    to understand the adversary so well that their usual tactics and techniques will
    no longer work against us. The adversary will have to take a step back, regroup,
    try to come up with different ways to carry out their tasks - all things that
    will take time and make their tasks, and their lives, more difficult. They also
    give us more time to continue to build defenses and resiliency against them.


    Depending on the structure of your team, which we will discuss in length in chapter
    10, you may actually be running these two `OODA` loops at the same time. The incident
    response portion of your team may be heads-down fighting in a tactical `OODA`
    loop while your intelligence team begins gathering the information they need for
    their strategic `OODA` loop. If those functions are one and the same, the tactically-focused
    `OODA` loop may take priority and you will complete `Find`, `Fix`, and `Finish`
    before ever beginning to execute the `Exploit` phase. Either method is fine, the
    important part is that you do actually move into the second phase of operations,
    because a tactical advantage may last for a few days or weeks, but a strategic
    advantage will have a long-lasting impact and give you the time you need to prepare
    for future intrusions which undoubtedly will come.


    In a strategic `OODA` loop, the `Exploit` phase covers both the Observe and Orient
    steps. In these steps, you begin to sift through the mountains of data that has
    been gathered during the incident response operation, gathering or aggregating
    additional information from previous incidents or external sources related to
    the incident, and capturing what this information means to your organization in
    the past, the present, as well as potentially in the future. This can seem like
    a daunting task, so it is helpful to know where to start.


    ## What to Exploit?


    When `F3EAD` is not properly implemented or is not carried out completely, you
    likely will find yourself dealing with the same intrusions or types of incidents
    time and time again, and likely not too far down the road. This is not only a
    waste of time, but may result in additional scrutiny if the intrusion results
    in the loss of sensitive customer data. In September 2017, the credit reporting
    company Equifax experienced an intrusion that resulted in unauthorized access
    to highly sensitive information of 147 million people. In 2019, the US Federal
    Trade Commission filed a complaint claiming that Equifax failed to properly address
    a known vulnerability in their web application system, resulting in the breach.
    This claim set the stage for future companies to have their security practices,
    including their incident response processes and follow-up, closely evaluated following
    an incident. Focusing on the `Exploit` phase will make it much easier to identify
    additional risks and call out actions needed to completely address an incident.


    In the previous `Find`, `Fix`, and `Finish` stages of the cycle, we focused on
    a specific attack, a specific adversary, and the specific actions needed to deal
    with that particular incident. If you happen to identify or mitigate an attack
    by an adversary leveraging similar tactics, it is a happy coincidence but is by
    no means intentional. By the end of the `Finish` phase of the `ROAD RUNNER` intrusion,
    we had identified a large amount of information around the intrusion, the actors
    behind it, and how they operated. But even though that information is organized
    in a way that facilitates the rapid-response nature of incident response, that
    doesn’t necessarily mean it is in the right format for follow-up intelligence
    analysis.


    In the `Exploit` phase, we begin the process that ensures that we not only address,
    but *learn from* the incident. We focus on the threat, and not just the enemy.
    Because of this, it is important that we not only extract technical indicators
    related to the particular attack, such as malware samples and command-and-control
    IP addresses, but also the overarching aspects that led to the intrusion and allowed
    the attackers to be, at least to some degree, successful. This includes information
    about the vulnerabilities or weaknesses that were targeted in the attack, and
    the information or systems that were targeted, and the process weaknesses that
    may have prevented us from identifying and acting sooner. We are not just trying
    to protect the network from a replay of the exact same attack, but to understand
    the various factors such as policies, technical vulnerabilities, or visibility
    gaps that led to the successful intrusion and to develop protections or detections
    for them as well. Because of this, we believe that there is very little information
    that should *not* be exploited and analyzed—but this, of course, makes managing
    that information complex.


    To make this process a little more manageable, we like to break information down
    into the following categories:


    *   `Technical indicators` - IPs, domains, hashes, certificates, etc. and their
    contextual information

    *   `Tactics and techniques` - how the adversary carried out their operations,
    most often captured using `VERIS` or `ATT&CK` - which we will describe in detail
    later in this chapter. `CVEs` or `CWEs` can also be captured in this category.


- raw: 'Intelligence analysis is one of the oldest and most consistent concepts in
    human history. Every morning people turn on the news or scroll through feeds on
    their phones, looking for information that will help them plan their day. What
    is the weather report? What implications does that have for their activities for
    that day? How is the traffic? Do they need to plan for extra time to get to where
    they need to go? External information is compared to an internal set of experiences
    and priorities, and an assessment is made of the impact on the target subject—the
    individual in question.


    This is the basic premise of intelligence: taking in external information from
    a variety of sources and analyzing it against existing requirements in order to
    provide an assessment that will affect decision making. This occurs at the individual
    level as well as at higher levels; this same process is implemented at the group,
    organization, and government level every single day. There is one big catch though
    - unlike many forms of day-to-day analysis, intelligence analysis involves trying
    to understand something about an adversary who very much wants to stay hidden
    from you. The weather report - although occasionally inaccurate - was not intentionally
    tricking you into leaving your umbrella at home so that you would get soaked in
    a downpour. Because of this, intelligence analysis almost always involves some
    aspect of secrecy. Even when it is not part of a classified government program,
    it involves an entity that does not want you to have the whole picture. Likewise,
    you don’t want that entity to know what you know about it, otherwise it might
    change tactics and cause you to start over at the beginning. In fact, a significant
    debate in intelligence work is around the concept of intelligence-gain-loss (which
    we will cover in depth in chapter $) where analysts have to determine how much
    intelligence value will be lost by taking an action that would warn the adversary
    that their presence, tactics, or tools have been identified.


    Although there are a growing number of intelligence training programs inside and
    outside of traditional government and military fields, many individuals currently
    conduct some form of intelligence analysis on their own without formal training,
    and many security teams work through similar processes as they conduct investigations
    without realizing that they are, in fact, engaged in intelligence analysis. While
    intuitive analysis can be beneficial to a security program, it is even more useful
    when basic structures, such as processes and models, are utilized to streamline
    intelligence work, account for biases, and make the analytic judgements defensible
    and repeatable.


    When businesses and governments conduct intelligence operations, it is based on
    a formalized process and doctrine that have been captured over the years. In addition,
    there are formalized processes which have been specialized for intelligence operations
    in information security and incident response. This chapter walks through key
    concepts, some from intelligence—some from security, and a few that combine both.
    We’ll start with abstract concepts that are primarily pulled from intelligence
    doctrine and move toward the more concrete concepts that can be applied directly
    to your incident-response investigations.


    # Intelligence and Research


    Intelligence as a discipline follows the same basic principles of other types
    of applied research, however there are several significant differences; secrecy,
    timeliness, and lack of reproducibility. The first, as we mentioned briefly above,
    is the understanding that intelligence often deals with matters that the subject
    or the target is actively trying to keep hidden. Researchers cannot go to an archive
    or search online repositories and find \*all\* of the information that they need.
    They may be able to find a great deal of relevant information, but there will
    always be an unspoken understanding that key pieces of information are intentionally
    not included in public information.


    The second difference is that timeliness is far more significant with intelligence
    analysis than in other forms of research. If the information is not analyzed and
    presented to decision makers ahead of when it is needed, then it is likely no
    longer relevant. The third difference is that reproducibility, or being able to
    replicate findings, is often not done because of the first two principles. Most
    analysts will not have access to the exact same information to provide external
    validation of an analytic judgment, and the timeliness required of intelligence
    products means that the peer-review process is a rarity in the field, and often
    only conducted in the aftermath of an intelligence failure.


    # Data Versus Intelligence


    Before tackling anything else, it’s important to clear up one of the most important
    distinctions of this discussion: the difference between information, data, and
    intelligence. All of these are significant terms in the security community and
    unfortunately are often used interchangeably, to the point that many practitioners
    have a difficult time articulating the difference between them.


    “Joint Publication 2-0,” the US military’s primary joint intelligence doctrine,
    is one of the foundational intelligence documents used today. In its introduction,
    it states, “Information on its own may be of utility to the commander, but when
    related to other information about the operational environment and considered
    in the light of past experience, it gives rise to a new understanding of the information,
    which may be termed intelligence.”


    Data is a piece of information, a fact, or a statistic. Data is something that
    describes something that is. In our previous example about the weather report,
    the temperature is a piece of data. It is a fact, something that has been measured
    using a proven and repeatable process. Knowing the temperature is important, but
    in order to be useful for decision-making, it must be analyzed in the context
    of what else is going on that day. In information security, an IP address or a
    domain are pieces of data. Without any additional analysis to provide context,
    they are simply facts. When various data points are gathered and analyzed to provide
    insight around a particular requirement, it becomes intelligence.


    Intelligence is derived from a process of collecting, processing, and analyzing
    data. Once it has been analyzed, it must be disseminated in order to be useful.
    Not only does intelligence need to be disseminated, but it needs to reach its
    intended audience in a timely manner. Intelligence that does not get to the right
    audience is wasted intelligence. Wilhelm Agrell, a Swedish writer and historian
    who studied peace and conflict, once famously said, “Intelligence analysis combines
    the dynamics of journalism with the problem solving of science.”


    The difference between data and true intelligence is analysis. Intelligence requires
    analysis that is based on a series of requirements and is aimed at answering questions
    relevant to decision makers. Without analysis, most of the data generated by the
    security industry remains simply data. That same data, however, once it has been
    properly analyzed in response to requirements, becomes intelligence, as it now
    contains the appropriate context needed to answer questions and support decision-making.


    # Sources and Methods


    Now that we have cleared up the distinction between information, data, and intelligence,
    the natural next question is, “Where should I get this data from so that I can
    analyze it and generate intelligence?”


    Traditional intelligence sources are most often centered around the INTs, which
    describe where the data is collected from:


    HUMINT



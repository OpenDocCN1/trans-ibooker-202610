  trans: '


    除了事件的内部信息，我们还可以从外部来源收集关于对手的大量信息。虽然你是一个独一无二的组织，但你的对手很可能并非全新出现，也并非只专注于你一个目标。他们极有可能以前以其他组织为目标，或者其他组织曾分享过关于战术、技术或其他被攻击组织的信息。重要的是要记住，基于“看起来相似”进行归因，通常无法为你的组织应该做什么或如何应对事件创建一份精确的路线图，但它有助于提供额外的背景信息或态势感知。它有助于了解与其他已知事件的相似之处和不同之处，以及在哪里可能需要采取不同的行动或分析。从这个意义上说，它类似于学术研究中的文献综述。文献综述涉及研究人员查看之前进行了哪些研究、论文或分析，它们得出了什么结论，哪里与你自己的研究相似，哪里不相似。文献综述的目标有两方面——确定你研究中填补前人研究空白的独特之处，以及在前人基础上构建并进一步加深对某一主题的整体理解。在情报驱动的事件响应中，我们希望在自身知识的基础上构建，如果条件允许共享，进一步增进对威胁的集体理解，帮助整个社区变得更强大、更具韧性。无论你扩展知识的范围如何，了解外部报告中关于行为体、妥指标或与你自身事件相关的其他信息都很重要。然而，就像文献综述一样，请记住，在此过程中发现的信息不应在没有明确引用的情况下直接与你自己的数据和发现混合。在许多情况下，这种“文献综述”应保存在单独的章节中，并在
    F3EAD 的下一步——分析阶段——中被引用。


    # 提取和存储威胁数据


    在调查结束时——无论是紧随其后还是事后六个月——你很可能会拥有大量数据。你在利用阶段的任务是获取这些信息，无论其外观如何，并将其构建为一种可供今后分析和使用的格式。虽然组织处理此任务的方式有很多种，但我们发现它们通常分为两类——主要是手动方式和平台化方式。我们将通过两种专业工具——通用的电子表格和更奇特的基于图的集中式情报平台——来演示这两种不同的方法，但首先让我们谈谈标准。


    ## 存储威胁数据的标准


    没有对各种数据标准的讨论，威胁情报的讨论就不算完整。无论是在 Twitter 上还是在各种安全大会的走廊里，人们已经进行了许多辩论——关于哪些标准最好，哪些只是一时的时尚，哪些正在经历“回潮”。撇开这些辩论不谈，你选择的标准首先取决于你组织的独特需求，你的选择可能与他人不同。我们即将深入探讨各种数据标准的细节，这可能会让你从此不想再谈论它们，但请耐心读下去。一旦你找到适合自己的标准，数据标准会让你的生活轻松得多——如果这有帮助，把自己想象成一位正在规划
    `mise en place`（备料/准备工作）的厨师，决定哪种刀工和哪种容器能让上菜服务最顺畅。


    ## 指标的数据标准和格式


    有几类常用于存储和共享技术威胁数据的数据标准。尽管业界竭尽全力，但没有任何一个神奇的标准能一统天下，所以最好的方法是了解存在哪些标准，并确定其中是否有一个适合你。例如，如果你属于使用
    `STIX`/`TAXII` 共享数据的共享组织，那可能是存储你自己数据的一个好选择。如果你的组织已经投资于使用特定格式（如 `OpenIOC`）的安全工具，那可能效果最好。如果你需要使用不止一个标准（这种情况我们经常见到），次优的方法是确保你理解各种标准的基础知识，并准备好进行数据字段映射，因为你迟早可能会处理这些数据格式之一的信息。


    ### OASIS 套件 - 即 `STIX`/`TAXII`


    `STIX` 最初于 2010 年创建，旨在标准化关于网络事件所捕获的信息，并促进组织间信息的自动化共享。它最初由 `MITRE` 公司代表国土安全部进行维护。`OASIS`
    网络威胁情报 TC（`OASIS` 开放标准组织的一个组成部分）接管了 `MITRE` 在支持 `CybOX`、`STIX` 和 `TAXII` 数据格式方面的角色。这些标准是较为知名的标准之一，部分原因是美国政府采用了这一套件。因此，许多威胁情报平台都集成了
    `STIX`——无论是 `STIX 1` 还是 `STIX 2.X`，以及 `STIX` 数据的传输机制 `TAXII`。


    #### `STIX` 1


    结构化威胁信息表达（`STIX` 1）的原始版本是用称为“`CybOX`”的构建块构建的，即网络可观测表达。`CybOX` 由可观测对象组成，这些对象是*具有状态和可度量属性的定义对象*。`CybOX`
    有多种用例，范围从事件管理到恶意软件分析和信息共享。有大量的 `CybOX` 对象用于捕获可观测对象，尽管并非所有对象都直接与事件响应相关。 <ref [`https://stixproject.github.io/getting-started/whitepaper/`](https://stixproject.github.io/getting-started/whitepaper/)>


    在 `STIX` v1 中，`CybOX` 是基本单元，然而标准的“`STIX`”部分允许向 `CybOX` 对象添加更多上下文细节。这支持进一步分析，并在共享威胁数据时提供巨大优势。这些额外的上下文字段包括
    `Threat Actors`（威胁行为体）、`Campaigns`（攻击活动）、`Victim Targets`（受害目标）和 `TTPs`（战术、技术与过程）。这使你能够获取通过
    `CybOX` 捕获的单个可观测对象，将它们串联起来并添加更多上下文。这就是威胁数据真正开始转化为威胁情报的时刻。虽然知道某个文件是恶意的很好，但从分析角度来看，知道该文件被用于针对特定行业受害者的特定攻击活动中，且在文件执行后，行为体试图窃取知识产权，这更有用。


    虽然回顾 `STIX` 1 很有趣，可以看到系统是如何发展的，但一个关键点是 `STIX` 1 实际上并非供人直接使用，而是旨在与一组特定工具紧密集成。随着信息交换和共享的需求超越了仅仅一小群志同道合的组织，该标准也需要随之演进。它确实演进了。


    #### `STIX` 2.X


    '

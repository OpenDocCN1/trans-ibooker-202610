- raw: 'In some ways *Target models* are the ultimate type of model for framing. If
    we carry forward with the art analogy, a target model is a landscape painted in
    a realistic fashion by an artist with an eye for detail. As a whole, the painting
    tells the story of a moment in time, with enough interesting details and components
    to help the viewer understand more about the situation the more they look. Stepping
    back from the art analogy, target models are representations of an area of focus.
    They can describe things such as a broad problem area (food insecurity), a specific
    entity such as a corporation or a nation, or even a process (the ransomware distribution
    lifecycle). The goal should be to show the component parts as well as the relationships
    between different aspects.


    Developing these models can be time-consuming, and the larger or more complex
    a target is, the more complex the model will be. Don’t let that stop you from
    beginning - once developed, target models can be some of the most useful tools
    for understanding a particular issue, and can easily be updated when new information
    is identified - such as information gained from the intelligence-driven incident
    response process. The first step in developing a target model is to determine
    what it is you are hoping to explain or understand by creating it. If you are
    hoping to understand where in your organization’s network you see the most successful
    or attempted intrusions, you can start with a network infrastructure map, which
    can then be overlayed with information from recent intrusions. If you are looking
    at something more broad, for example, how cybersecurity issues are likely to impact
    emerging multinational markets, then your target map will likely be focused more
    broadly on the components of multinational markets, and then overlaid with examples
    of cybersecurity impacts for each of the components. In both cases it is perfectly
    acceptable to start with a hand-drawn map of what you are envisioning as a way
    to get started. In many cases getting started is the hardest part of the process.
    \[[Figure 6-1](#ch06.html#fig_1__image) to come\]


    ![](assets/strategic_intelligence_466966_01.png)


    Once you have developed a working target model, the hardest part is done, however
    models are rarely static; they must be updated periodically to remain applicable
    and effective. In the case of an organization’s network infrastructure map, for
    example, it must be updated frequently to remain current. With organizational
    structures, it can be necessary to update them whenever there is a reorganization
    or when key leaders change or leave, which can occur almost as frequently as network
    changes. Developing models is an investment, but will provide a solid frame for
    future analysis, whether it is used in the next intrusion you are supporting or
    used to propose a plan to increase the security budget or staffing of your incident
    response or threat intelligence teams.


    In addition to target models, which can represent nearly any topic, there are
    some forms of specialized target models that can be useful is specific situations.


    #### Hierarchical models


    Some sets of information, such as organizational structure, fit best as *hierarchical
    models*. These models use a parent-child relationships to illustrate the chain
    of command, or leadership structure, of a target. This can help an analyst identify
    all the components of a target that need to be further analyzed. It can also help
    identify any choke points or bottlenecks that could be significant. This information
    can be gathered from many sources, and needs to be updated periodically as personnel
    or organizational structures change. A hierarchical model is best used to display
    a closed system that is not likely to change based on outside variables.


    [Figure 6-2](#ch06.html#fig_2_hierarchical_model) shows an example of a hierarchical
    model.


    ![](assets/strategic_intelligence_466966_02.png)


    Hierarchical models are traditionally used to show personnel or roles, but one
    unique application of a hierarchical model is to use it to identify the data that
    is important to an organization and which departments are responsible for it.
    A hierarchical model for data includes the broad categories of data, such as financial
    information, customer information, and sensitive company information. Any information
    that is valuable to the organization and that an attacker may try to access or
    impact in some way should be identified. When taking this approach, it is useful
    to be as specific as possible with the types of data. Financial information may
    break down further into credit card information, payroll information for employees,
    and futures projections for the company. All of this data likely sits in different
    places within the organization, with different teams responsible for maintaining
    and securing. Owner information for each data type should also be built into the
    model. This type of model will help organizations understand the data they are
    protecting and where it resides, and can be used to identify which data types
    are most targeted over time. As with all of the models we discuss in this chapter,
    it can take some time to build an accurate model, and this should not be done
    during an active incident.


    #### Network models


    *Network models* are useful when representing the relationships or interactions
    between individuals or groups that are interconnected in a non-hierarchical way.
    Network models are commonly used to develop computer network diagrams, both of
    an organization’s own network and often of an attacker’s infrastructure. In his
    keynote talk at the SANS cyber threat intelligence summit, Dr. Chris Sanders spoke
    about the importance of “friendly intelligence” in addition to “threat intelligence”.
    Friendly intelligence includes intelligence about things that we are trying to
    protect, and in intelligence-driven incident response we are often trying to protect
    our networks. Having a well-defined, up-to-date, and accurate model of the network
    is invaluable for defenders, and should be a part of strategic intelligence work.
    In addition to building out the physical and logical connections of the network,
    it is also helpful to include additional details that are relevant to your organization’s
    operations, including any regulatory compliance requirements for any portions
    of the network, including international requirements if your organization operates
    globally.


    From a threat intelligence aspect, a strategic-level threat intelligence network
    models have also been used to show the relationships between attacker groups as
    well as the relationships between victims of an intrusion. As more and more advanced
    opportunistic attacks take place, understanding the relationship between victims
    can help better understand the nature of the threat itself. Network models have
    to be updated the most frequently of any of the data types discussed here, because
    they have many moving parts that change quickly and often. [Figure 6-3](#ch06.html#fig_3_network_model_example)
    shows a sample network map.


    ![](assets/strategic_intelligence_466966_03.png)


    #### Process models'

    # Techniques in this family help an analyst come up with new approaches, rethink
    previously held beliefs, or begin to push the boundaries of the biases that tell
    us that something *isn''t possible.* Exploration techniques focus on methods such
    as brainstorming and creating mind maps, often focusing on the relationships between
    different elements.


    ## Diagnostic Techniques


    This family of techniques is used frequently in intelligence-driven incident response
    - in fact we deep dive into one of its most commonly-leveraged methods, Analysis
    of Competing Hypotheses, in the section below. Diagnostic techniques most closely
    mirror the scientific method that many of us learned when we were younger, with
    the caveat that in intelligence analysis we almost never have the complete picture
    and it''s typically not possible to fully test any hypothesis that is generated.
    Other methods in this family are Multiple-Hypothesis Generation, Diagnostic Reasoning,
    and Deception Detection.


    ## Reframing Techniques


    These techniques are a key staple in any analyst''s tool belt, they are specifically
    designed to help identify when biases or misapplied mental models could be impacting
    analysis. Many of the "contrarian techniques" covered later in the chapter, including
    Red Hat Analysis and What If? Analysis are considered reframing techniques. These
    techniques are best done with a group to better identify flaws in mental models
    that an individual may have, however they can be done even by individual analysts,
    such as through a Structured Self-Critique exercise.


    ## Foresight Techniques


    "Predictive Intelligence" is something that every security manager and CISO wishes
    that their teams could generate regularly. While it is unfortunately not possible
    to perfectly predict the future, there is a set of SATs designed to help identify
    driving forces that may indicate a future outcome and be prepared to monitor those
    to anticipate changes. One method that is particularly useful in intelligence-driven
    incident response is Indicator Generation, Validation, and Evaluation, which we
    will cover in the next section.


    ## Decision Support Techniques


    There are times - many times in fact - where an analyst is not conducting analysis
    to help determine their own next steps, but to know what to present to a senior
    leader or decision maker to help *them* make a decision. And fortunately, there
    is a family of techniques that help think through information and structure it
    in a way to support decision making. These techniques include heavy-hitters also
    used in business intelligence, such as SWOT Analysis and Decision Trees.


    Here are a few steps that will guide you to set yourself up for productive analysis
    by helping you decide which SAT to use and identifying who else should be part
    of the process.


    1. Determine what question you are going to answer, ideally using specific requirements
    from your leadership. You can conduct multiple iterations of structured analysis
    in order to answer multiple questions present through requirements, but just as
    you do not try to test multiple variables within a single experiment, it is best
    not to try to answer several questions with the same analysis. Even if the processes
    are only slightly different, it is ideal to keep them separate to avoid clouding
    your judgment or contaminating your conclusions. If time constraints are present,
    focus on the most pressing question/requirement and begin to work on that.


    2. Identify the nature of the question you are trying to answer through analysis.
    Is it future looking? Perhaps you should review techniques from the foresight
    Family. Are you attempting to describe how a recent intrusion fits into the overall
    pattern of threats that your organization has dealt with? A diagnostic technique
    may be more beneficial. Capturing not only the question, but the *nature* of the
    question will help you on the right path.


    3. Review your exploited data to determine whether or not you have all the information
    that you need to generate a hypothesis or several hypotheses to answer your question.
    This involves going through the information you gathered from the investigation,
    and may require collecting additional enrichment information, which we will discuss
    later in the chapter.


    4. As we mentioned previously, structured analysis can be done as an individual
    analyst, but many of the techniques are most effective when done as part of a
    team, so think about who your team should be here. If you already work as part
    of a team of dynamic analysts then this may be easy - and you are very fortunate!
    If that is not the case, there are still others you can include in the analysis.
    Key incident response personnel, malware analysts, red teamers - all of these
    groups are used to. The core techniques we will cover in the next section include
    Key Assumptions Check, Analysis of Competing Hypotheses, and Indicator Generation,
    Validation, and Evaluation. We will also cover some very helpful Contrarian techniques
    to help address biases, which as we will learn, can seriously hinder analysis.


    ### Key Assumptions Check


    Key Assumptions Check is one of the most leveraged structured analytic techniques,
    and for good reason. As we discussed previously, our brains look for shortcuts
    wherever they can. One place they often look to is assumptions that often become
    the basis of our analysis, whether they should or not. And to be fair, sometimes
    they *should,* but it is important that we are intentional about the fundamental
    beliefs we have about our situation. For example, with our Road Runner intrusion,
    we made an assumption that because we were passed information about a threat from
    another campaign, when we found some of the same indicators in our network, that
    it was *because* we were a campaign. While this is a reasonable assumption and
    it certainly seemed to help us during the Find, Fix, and Finish phases, that does
    not mean we should never question that assumption. A Key Assumptions Check supports
    that questioning process.


    A Key Assumptions Check is a systematic approach to identifying the assumptions
    that are being used to fill in key information gaps and determining whether these
    assumptions are valid and should remain part of the analytic process. Ideally
    this is done at the beginning of an analytic undertaking because, as we will see
    as we move through other common structured analytic techniques, many of them depend
    on having a firm grasp of assumptions and preconceptions that are part of the
    analysis.


    Heuer Jr. and Pherson outline a process for conducting a Key Assumptions Check:


    1. Gather the group who will participate in the key assumptions check. This should
    include those who are familiar with the project or topic, along with some respected
    analysts who are not intimately familiar with the issue and can provide a fresh
    set of eyes.


    2. Begin the session by identifying the specific topic to be discussed, and ask
    each participant to silently write down the assumptions that they have about the
    topic. For Road Runner, this could include things such as "election campaigns
    are targeted by sophisticated actors", and "the information passed to us from
    the sharing group was a legitimate intrusion and not a false flag or misinformation
    operation".

    '
  trans: '

    # 该系列技术可帮助分析师提出新方法、重新审视既有观点，或开始突破那些告诉我们某事*不可能*的偏见界限。探索技术侧重于头脑风暴和创建思维导图等方法，通常关注不同要素之间的关系。


    ## 诊断技术


    这一系列技术在情报驱动的事件响应中被频繁使用——事实上，我们将在下文中深入探讨其最常用的方法之一：竞争假设分析。诊断技术最接近我们年轻时学到的科学方法，但有一个警示：在情报分析中，我们几乎从未拥有完整的图景，且通常无法完全测试任何生成的假设。该系列中的其他方法包括多假设生成、诊断性推理和欺骗检测。


    ## 重构技术


    这些技术是任何分析师工具包中的关键核心，专门设计用于帮助识别偏见或误用的思维模型何时可能正在影响分析。本章后面介绍的许多“反向技术”，包括红队分析和假设分析，都被视为重构技术。这些技术最好由小组完成，以便更好地识别个人可能存在的思维模型缺陷，但个人分析师也可以执行，例如通过结构化自我批判练习。


    ## 预见技术


    “预测性情报”是每一位安全经理和 CISO 都希望其团队能定期产出的成果。虽然遗憾的是无法完美预测未来，但有一套 SATs 旨在帮助识别可能预示未来结果的驱动力，并做好监控准以预判变化。在情报驱动的事件响应中，一个特别有用的方法是指标生成、验证与评估，我们将在下一节介绍。


    ## 决策支持技术


    有很多时候——事实上是非常多的时候——分析师进行分析不是为了确定自己的后续步骤，而是为了知道该向高层领导或决策者呈现什么，以帮助*他们*做出决策。幸运的是，有一系列技术有助于梳理信息并以支持决策的方式构建结构。这些技术包括商业情报中也常用的重量级方法，如
    SWOT 分析和决策树。


    以下是几个步骤，将指导您为高效分析做好准备，帮助您决定使用哪种 SAT 并确定谁 else 应参与该过程。


    1.  确定您要回答的问题，最好使用来自领导层的具体需求。您可以进行多次结构化分析迭代，以回答需求中存在的多个问题，但正如您不会在单个实验中尝试测试多个变量一样，最好不要试图用同一次分析回答多个问题。即使流程仅略有不同，最好也将它们分开，以避免判断模糊或结论受污染。如果存在时间限制，请专注于最紧迫的问题/需求并开始着手处理。


    2.  确定您试图通过分析回答的问题的性质。是面向未来的？也许您应该回顾预见系列的技术。您是否试图描述最近一次入侵如何符合贵组织应对过的整体威胁模式？诊断技术可能更有帮助。不仅要捕捉问题，还要捕捉问题的*性质*，这将帮助您走上正轨。


    3.  审查您利用的数据，以确定您是否拥有生成一个或多个假设以回答问题所需的所有信息。这涉及梳理调查中收集的信息，并可能需要收集额外的丰富信息，我们将在本章后面讨论这一点。


    4.  如前所述，结构化分析可以由个人分析师完成，但许多技术作为团队一部分执行时最为有效，因此请考虑您的团队应由谁组成。如果您已经作为一个充满活力的分析师团队的一员工作，那么这可能很容易——而且您非常幸运！如果不是这种情况，您仍然可以让其他人参与分析。关键事件响应人员、恶意软件分析师、红队成员——所有这些群体都习惯于。我们将在下一节介绍的核心技术包括关键假设检查、竞争假设分析，以及指标生成、验证与评估。我们还将介绍一些非常有用的反向技术，以帮助应对偏见，正如我们将了解到的，偏见会严重阻碍分析。


    ### 关键假设检查


    关键假设检查是最常用的结构化分析技术之一，这是有充分理由的。正如我们之前讨论的，我们的大脑会在任何可能的地方寻找捷径。它们经常求助的一个地方是假设，这些假设往往成为我们分析的基础，无论它们是否应该。公平地说，有时它们*应该*成为基础，但我们有意识地对待我们对局势的根本信念非常重要。例如，在“Road
    Runner”入侵事件中，我们假设因为我们从另一个活动中获得了威胁情报，当我们在网络中发现相同的指标时，那是*因为*我们是一个活动的目标。虽然这是一个合理的假设，并且在发现、修复和完成阶段似乎确实帮了我们，但这并不意味着我们永远不应质疑该假设。关键假设检查支持这一质疑过程。


    关键假设检查是一种系统的方法，用于识别用于填补关键信息空白的假设，并确定这些假设是否有效、是否应保留在分析过程中。理想情况下，这应在分析工作开始时进行，因为正如我们在学习其他常见的结构化分析技术时将看到的，其中许多技术都依赖于对作为分析一部分的假设和先入之见有牢固的掌握。


    Heuer Jr. 和 Pherson 概述了进行关键假设检查的流程：


    1.  召集将参与关键假设检查的小组。这应包括熟悉项目或主题的人员，以及一些不熟悉该问题的受人尊敬的分析师，他们能提供新的视角。


    2.  会议开始时确定要讨论的具体主题，并要求每位参与者默默写下他们对该主题的假设。对于“Road Runner”案例，这可能包括“选举活动是复杂行为体的目标”，以及“共享小组传递给我们的信息是合法的入侵，而非虚假旗帜行动或错误信息行动”
    等内容。


    '

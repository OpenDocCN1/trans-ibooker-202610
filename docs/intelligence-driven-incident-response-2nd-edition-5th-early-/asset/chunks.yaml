    ## 理解攻击者


    理解攻击者意味着可以保护网络免遭进一步利用，识别其下一步可能的攻击目标，并能做出响应，无论是在微观层面（识别实施攻击的个人）还是宏观层面（意识到国家正在其传统情报收集武器库中采用新战术，并改变政策以应对这一变化）。共享这种理解最终被证明不仅是保护劳伦斯伯克利国家实验室的关键，也是保护许多其他政府机构的关键。


    ### 破坏性攻击


    1988 年，康奈尔大学学生罗伯特·T·莫里斯闯入麻省理工学院（MIT）的一个计算机实验室，并释放了一个计算机程序，该程序旨在在不被检测的情况下尽可能多地复制自身到其他计算机上。它通过利用互联网电子邮件投递系统中的一个后门以及识别网络用户的
    *finger* 程序中的一个缺陷来实现这一点。这可能只是一个无害的实验——或者正如一些人所描述的，只是一个恶作剧，鲜为人知，然而它并没有完全按照莫里斯的意图运行，从而成为了网络历史的一部分（这就像普通历史，但更酷）。该蠕虫最终导致
    6000 台计算机瘫痪，约占当时互联网规模的 10%，受害者包括哈佛、普林斯顿、斯坦福、约翰霍普金斯、美国国家航空航天局（NASA）和劳伦斯利弗莫尔国家实验室等众多机构。联邦调查局（FBI）的调查人员在检查活动时举步维艰，不确定这是停机事故还是攻击，这时莫里斯给两个朋友打电话，承认是他制造了该蠕虫。其中一位朋友致电《纽约时报》，这最终导致莫里斯因违反
    1986 年新颁布的《计算机欺诈和滥用法案》（CFAA）而被识别并定罪。


    虽然该蠕虫背后没有恶意意图——它实际上只是程序并不总是完全按照其创建者的意图运行的另一个例子——但它产生了深远的影响，至今仍清晰可见。随着互联网对运营变得越来越关键，能够快速识别和修复其他入侵或破坏性攻击变得愈发重要。计算机应急响应小组（CERT）在卡内基梅隆大学成立，作为一个专业、受过训练的响应团队，负责为网络攻击提供评估和解决方案。这也凸显了为什么有时归因攻击很重要——1988
    年冷战显著“缓和”，里根和戈尔巴乔夫在莫斯科会晤，苏联军队开始从阿富汗撤军。如果该蠕虫被错误地归咎于苏联活动——这实际上正是“布谷鸟蛋”事件中活动的归因情况——可能会显著改变历史进程。


    ### “月光迷宫”


    在 1986 年“布谷鸟蛋”事件和 1988 年“莫里斯蠕虫”事件之后的十年里，应急响应领域得到了改善，不仅因为 CERT 的成立，还因为该领域本身在政府、军队和私营部门实现了专业化。此外，适当的网络监控工具的出现意味着防御者不再依赖散落在地下室的打印机来识别恶意网络活动。这种能力的增强是幸运的，因为入侵不仅持续发生，而且在范围和复杂性上不断增长。1998
    年，美国政府发现了据信迄今为止规模最大、持续时间最长的政府网络入侵事件——代号为“月光迷宫”。


    1998 年 3 月，美国政府在多个敏感和受限网络中发现了异常活动，包括五角大楼、美国国家航空航天局（NASA，显然 NASA 一直以来都是入侵者的高优先级目标）和能源部（DOE）。进一步分析在几所大学中发现了相同的恶意活动，并确认该活动至少已持续了两年。这种持续性质不同于之前已知的任何入侵，后者似乎更具针对性且昙花一现。与那些实例不同，对手在网络的不同部分留下了战略性后门，以便随时返回。信息从许多通常看似无关的地点被收集。


    我们有幸与直接支持“月光迷宫”事件调查和响应的人员密切合作，无论是在 1990 年代还是今天，因为关于此次入侵仍有许多未知之处和许多有待发掘的见解。与这些人交谈并阅读大量关于该入侵的报告，深刻地说明了情报工作对事件响应至关重要，特别是网络威胁情报填补了国家利益与外国对手在战略层面发生的事情，以及这些对手的目标和行动如何在计算机网络上显现之间的空白。美国拥有全方位的情报机构积极搜寻和监听外国干预的迹象，但最大规模的网络攻击却直到“意外”被发现才被察觉，因为情报工作尚未完全调整以应对针对网络的行动。


    “月光迷宫”将网络威胁情报能力推向了现代。计算机网络不再是可能偶尔受到影响的对象，这些网络现在因其持有的信息和访问权限而成为直接攻击目标。计算机网络成为了情报收集的一部分，情报也需要在其防御中发挥作用。


    ## 现代网络威胁情报


    几十年来，威胁不断增长和演变。对手不再仅仅是外国政府或好奇的学生。有组织犯罪分子、身份窃贼、诈骗者、意识形态驱动的活动家以及其他具有各种动机的人，都意识到当他们的活动针对数字目标而非物理目标时，能产生多大的影响。这些对手使用不断扩大的工具和战术集来攻击受害者，并主动试图逃避检测。与此同时，我们对网络的依赖不断增加，使得事件的影响更大。理解攻击者变得更加复杂，但并不减少其重要性。


    理解如何识别攻击者活动以及如何利用这些信息保护网络，是事件响应者工具箱中一个较新成员——网络威胁情报——背后的基本概念。*威胁情报*是对对手的分析——他们的能力、动机和目标，而*网络威胁情报*（CTI）是对对手如何利用网络领域实现其目标的分析。请参阅图
    1-1，了解这些攻击层级如何相互关联。


    ![](img/image-to-come.png)


    最初，情报分析师是在像“月光迷宫”这样的入侵事件发生后才介入，以了解整体入侵事件告诉我们关于对手的什么信息。他们的目标、动机、能力、组织架构——所有这些对于战略理解和长期规划都很重要，但对于那些试图防御当下、明天、甚至有时是上周攻击的人来说，并不能立即提供价值。网络威胁情报开始更多地关注更具即时可操作性的战术和技术细节，在此过程中了解在不同情况下哪些类型的信息最有价值。网络威胁情报分析师不仅带来数据，还带来洞察。


    '

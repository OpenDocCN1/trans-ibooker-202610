    tactics and new mediums.


    This is one of the reasons that military doctrines ranging from Sun Tzu’s *Art
    of War* to Carl von Cluasewitz’s *On War* are so often quoted in cyber-security
    presentations. Just because they were written long before modern incident response
    does not mean that they are not relevant to the prevention and detection of attacks

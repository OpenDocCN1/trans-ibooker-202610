- raw: 'Brainstorming should result in the identification of a new set of hypotheses,
    and at that point the team can focus on identifying specific evidence from the
    collected information to support or refute the hypothesis, and then use an analytic
    method such as ACH to complete the analysis. It is just fine if it is not possible
    for the entire group to see the analysis to completion. One of the most important
    aspects of brainstorming is having the group there to identify new hypotheses,
    call out our unfounded assumptions, and identify bias at the beginning of the
    analytic process. If one or more analysts takes the lead on completing the analysis,
    it is still critical that they consult or check in with the group from time to
    time.


    ### Scrub down.


    The term scrub down (also known as a murder board) was originally coined to describe
    a process used to help a candidate prepare for oral presentations. During a scrub
    down, an analyst presents his findings to a review board, which then questions
    not only the findings, but the analytic processes used to come to that conclusion.
    Through this process, it is possible to identify any biases that are present in
    the analysis, any key assumptions that were not validated, and any analytic leaps
    that were not founded in evidence. Even if the analysis is sound and no obvious
    errors exist, a scrub down helps an analyst vocalize the process used and explain
    the methods and findings, something that many intelligence analysts struggle with.
    When questioned about how a certain conclusion was reached, especially at the
    strategic level, that has more variables and pieces to tie together, an analyst
    will often default back to using vague terminology or anecdotes to explain how
    they conducted the analysis, and that type of explanation often does not inspire
    confidence in decision makers. Being prepared to describe not just the conclusion,
    but the analytic process itself, is a skill that takes time and practice to develop.


    Rob Dartnall, an analyst from Great Britain, reminded us of the importance of
    the scrub down, especially when it comes to strategic intelligence where the stakes
    are high, in his presentation “Conventional Intelligence Analysis in Cyber Threat
    Intelligence ([https://www.youtube.com/watch?v=jzHw8lkocXA)](https://www.youtube.com/watch?v=jzHw8lkocXA\)).”


    When analysis that you have done is about to lead directly to important and potentially
    drastic actions, it is imperative that not only is your analysis sound, but that
    you are prepared to defend it under scrutiny.


    ## Dissemination


    *Dissemination* is only slightly different at the strategic level, and those differences
    are due to the scope and nature of strategic intelligence. The recommendations
    that are being made have the potential to significantly impact a businesses’ operations
    moving forward, and therefore, unless there are specific time requirements, accuracy
    and thoroughness take precedence over speed.


    Many of the same principles that we discussed in Chapter 9 are directly applicable
    to dissemination at the strategic level, but there are some unique aspects, too.
    Specifically:


    *   The audience is key at this level, and so it is important to identify who
    the audience will be before beginning the process of writing or creating the final
    deliverable. If multiple audiences would like to receive information in different
    ways, it is a good idea to make sure that the information is presented to each
    audience in the way that will be most useful to them. Make sure that the different
    versions of intelligence products or reports tell the same story, however. The
    last thing you want is for different leaders within an organization to have a
    different interpretation of the analysis and its meaning.


    *   In strategic intelligence, it is important to specifically call out any intelligence
    gaps or trigger events that would result in a change to the analysis. It can be
    difficult to tell leadership that the analytic findings have room for doubt, but
    setting these expectations will make it easier to communicate changes as they
    occur.


    # Moving towards anticipatory intelligence


    As the saying goes “All models are wrong, but some are useful”. Strategic intelligence
    is ultimately a model and while it’s useful today it is not (and never was) perfect.
    As a result, like so many models, it will evolve or get replaced. At its core
    the United States Intelligence Community’s concept of strategic intelligence was
    based on a “two body problem” originating in the 1950s - The Cold War conflict
    between the United States and USSR. Nearly everything was looked at strategically
    as conflict between these two adversaries, even secondary and tertiary conflict
    was rolled up with the assumption that at a strategic level it was ultimately
    about the US vs USSR. The actions of the Vietnamese Viet Cong were really just
    a proxy for the Soviet intelligence and military apparatus. The 1970s Mujahideen
    in Afghanistan were a proxy force for the United State intelligence community.
    The modern era though is not nearly so straight forward. There are multiple sets
    of adversaries leveraging asymmetric threats (of which cyber is just one), and
    emergent problems like cypto-currency and climate change.


    Strategic intelligence is designed to provide information to decision makers on
    long-term, broad topics with perceived implications to national security for years
    to come. It requires time to conduct solid intelligence analysis, and when a situation
    occurs before there was time for a complete analytic picture to be formed, decisions
    are often made without it. That often remains the primary focus even in a business
    decision making context, and more and more often results in actions with unintended
    consequences. As the world changes and needs change, many believe that it is time
    for strategic intelligence to change as well. An approach that may begin to make
    more sense for organizations and governments large and small is *anticipatory
    intelligence* - the practice of studying a situation and the surrounding context,
    environment, and related situations to anticipate future events and their implications.
    This is not the same as predicting a specific event - something that most analysts
    wish they could do regularly. While predictions are narrow and describe a specific
    event or outcome, anticipatory intelligence uncovers a broader spectrum of possible
    outcomes. Josh Kerbel, a strong proponent of moving towards anticipatory intelligence,
    proposed a new definition of anticipatory intelligence, “The intelligence process
    or practice whereby potentially emergent developments stemming from the increasingly
    complex security environment are foreseen via the cultivation of holistic perspectives.”


    The good news is that moving towards anticipatory intelligence does not require
    an entirely new intelligence process - just the re-application of existing processes
    and practices, along with new ways of thinking about situations. This is a growing
    and developing field, but will be a critical component of intelligence-driven
    incident response in years to come.


    # Conclusion


    We consider strategic intelligence to be the logic behind the plan, and it is
    no wonder that many incident responders struggle with finding the time to conduct
    this level of analysis. In many organizations, incident responders would be hard-pressed
    to find a plan at all, much less understand the logic behind the plan. Strategic
    intelligence, when properly analyzed and adopted by leadership, can not only inform
    leadership of the long-term threats to an organization, but can also provide incident
    responders with policies and procedures that will support their ability to meet
    the needs of their organization.'

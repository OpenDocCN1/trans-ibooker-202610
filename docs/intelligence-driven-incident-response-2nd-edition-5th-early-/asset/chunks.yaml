  trans: '

    # 过程模型


    过程模型展示了构成结构化过程的各种动作和决策点。过程模型在作为团队一部分进行分析时尤为重要，因为它有助于让人员在整个分析过程中保持步调一致。网络入侵杀伤链是另一种过程模型。在第
    4 章、第 5 章和第 6 章中，它被用来捕获特定事件的指标，但杀伤链也可用于记录攻击者在更战略层面采取的步骤，以协助开发目标模型。设计支持战略分析的过程模型时，有两种方法。您可以查看您正在执行的那些通常未记录的过程或
    SOP（标准作业程序），并将它们构建成一个过程；或者您可以浏览不同类型分析中使用的过程模型示例，挑选一个最适合您工作方式的并将其作为自己的模型采用。任选其一均可——过程模型旨在实用，而非规定您如何工作，因此不必觉得需要更改一个已经很好的过程，仅仅为了适应某人推荐的模型。然而我们发现，浏览他人开发的模型确实提供了一个反思和优化现有方法的良机。


    除了杀伤链，还有其他几种模型可用作开发战略情报过程模型的指南。2020 年，在回顾了从犯罪心理学到气象学等领域的多个过程模型后，Nicole Hoffman
    推出了她的模型——认知分析阶梯。Nicole 在她的[博客文章](https://threathuntergirl.com/2022/11/01/the-cognitive-stairways-of-analysis/)中描述了发布该模型的动机：“大家都在谈论分析，但没人详细说明如何执行分析”。认知阶梯模型包含分析师采取的遵循固定模式的“步骤”，不过该模式可调整以适应您正在执行的任何特定任务。在她的头脑风暴示例中——这是任何类型分析的关键组成部分，她包含以下步骤：


    1. 头脑风暴/生成假设/思考步骤 - 此步骤将帮助您确定将分析重点放在何处 - 类似于您的情报需求（尽管并不总是那么具体）

    2. 确定范围 - 确定您将在分析中关注的框架 - 您将通过其进行分析的背景。

    3. 关键假设检查 - 您将带入分析的假设是什么 - 确保在开始前假设有效，否则需要将其抛弃。

    4. 汇编数据/信息质量 (QoI) 检查 - 收集与您关注主题相关的数据，同时评估数据的来源和完整性。

    5. 清洗数据/剔除无用数据 - 为了在分析中正确使用数据，数据需要采用一种格式和分类法，使您能够在分析中既利用又引用它。

    6. 探索性数据分析 (EDA)/可视化与回归 - 您收集的数据对某主题说明了什么？尽量不要过多关注您在步骤 1 中制定的总体假设或思考步骤——那一步的目标是让您步入正轨，但现在您必须审视数据，必要时利用可视化和回归，以理解数据指示的内容。此步骤中的发现可能要求您回到步骤
    4 再次收集更多数据，这完全没问题。

    7. 确证 - **这**才是您根据最初的思考步骤或假设检查分析和发现，从而得出分析判断的步骤。

    8. 传播 - 这是您结束分析并分享发现的地方，理想情况下包括更新任何可能因新发现而改变的预先存在的目标模型。


    ![](img/strategic_intelligence_466966_04.png)


    过程模型可以采取多种形式，最重要的是您拥有一个适合您、已文档化且可被他人利用的过程模型。


    ## 时间线


    时间线是显示活动间基于时间的关系的线性模型。事件响应人员最熟悉显示事件期间采取特定行动时间的攻击时间线，但在事件响应情况下，许多其他时间线也很有帮助。了解从漏洞发现到修复的时间线有助于网络防御者知道他们将在多长时间内对特定攻击保持脆弱状态，并可帮助决策者确定何时需要采取行动。指示不同威胁行为者群体何时被发现使用特定漏洞利用或工具的时间线，可以帮助分析师确定该恶意软件的威胁，以及了解工具被识别后工具重用传播的速度快慢。


    可视化各种活动的时间方面，为分析师提供了一个框架，以理解这些方面将如何影响其组织的目标和宗旨。


    # 战略情报周期


    第 2 章相当详细地涵盖了情报周期，但主要关注战术和作战层面的情报——遵循周期以应对特定且往往紧迫的威胁。在战略层面，情报周期遵循相同的过程，但每个步骤（从设定需求到传播）与应对紧迫威胁时的样子不同。让我们来探讨这些差异。


    ## 设定战略需求


    设定战略层面的需求似乎比战术情报更模糊。有了战术情报，有一个具体的威胁可供关注，这有助于指导需求。战略情报往往并非如此；当需求被下达时，它们通常很模糊，比如“告诉我我们需要知道什么”。尽管范围和时间跨度大得多，需求仍应具体。


    战略需求通常遵循军事指挥官意图的概念。指挥官意图使大型分散部队能够就是何时以及如何开展行动做出决策。利用作为战略过程一部分而开发的模型，指挥官、CEO 或
    CISO 可以陈述其目标或宗旨（即意图），并信任所有决策者步调一致，将采取支持该目标的行动，而无需微观管理。例如，如果意图是确保公司新产品首创上市，那么确保制造图纸、营销计划和其他敏感信息不泄露就是属于指挥官意图范畴内的任务。开发可能针对该敏感信息的攻击者模型，是支持保护该信息能力所必需的战略情报需求。

    '

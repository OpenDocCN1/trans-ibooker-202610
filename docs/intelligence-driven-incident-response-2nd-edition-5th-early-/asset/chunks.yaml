  trans: '

    *   根据您的工具，完成必要的后勤步骤以准备利用它们——无论这意味着基于模板创建新文件、确定将数据录入数据库时使用的标签，还是开始一个新的 Wiki 页面来存放此事件的所有信息。

    *   按照您创建的待聚合数据清单，开始将来自不同来源的数据移入您选择的工具中，完成一个来源后就将其勾选掉。


    拥有一个清晰的流程，能让您从事件后堆积如山的数据中，得到一套结构化、全面的信息集以供分析，这是为成功奠定基础的最佳方式之一。您开发的系统可能涉及多人专注于系统内的不同职能，也可能只是一个供您个人使用的流程。您可以在流程中加入时间线或里程碑以保持进度和责任感，也可能会发现每起事件差异巨大，以至于时间线不如单纯推进步骤那般重要。关键在于记录下您将如何推进数据提取流程，并能够随着目标、工具或需求的变化，舒适地更新或修订该流程。


    ## 步骤 4：启动与迭代


    这就是您深入实施的地方。这可能是整个过程中最难的部分——即使您拥有合适的工具和可靠的流程，也必须真正开始有条不紊地执行步骤。尝试各种方法，看看什么有效，哪里遇到了障碍。不要害怕调整流程，开始识别可能需要的新工具，或能让流程更轻松的新技能。如果您发现某种特别有用的方法或途径，请务必将其记录下来，以供未来的分析师（或未来的您）参考。


    # 管理信息


    管理信息不仅仅涉及捕获调查中的单个妥指标或工件。还需要捕获大量额外信息，以便您知道如何管理和处理未来所有类型的信息。


    有几个关键要素对于帮助管理信息至关重要：


    **日期：** 何时看到这条数据或信息？这将有助于分析，同时支持数据的过期或退役，实质上是确定数据何时仍可用于行动和分析，以及何时不再有效。


    **来源：** 没有什么比不知道一条信息何时、何地来自更令人沮丧的了。捕获信息来源将有助于您在需要时回溯获取更多信息，或为该信息分配置信度，这两者在分析阶段都非常有用。


    **数据处理信息：** 数据通常需要根据其敏感度和来源进行不同的处理。我们建议使用 `DHS` 的交通灯协议 (`TLP`)，它规定了信息如何共享。`TLP`
    标准于 2022 年 8 月更新，更多信息请见[此处](https://www.first.org/tlp/)。


    **`TLP:CLEAR`：** 可公开获取的信息，可通过任何方式与任何人共享。


    **`TLP:GREEN`：** 可与同行和合作伙伴共享的信息，但不得通过公开渠道共享，例如发布在博客上或推送给记者。千万别这么做。


    **`TLP:AMBER`：** 此信息可与您组织内部人员及其客户共享，但不得对外共享，也不得通过公开渠道共享。`TLP` v2 通过明确包含组织的客户，并引入新的限制条件
    `TLP:AMBER+STRICT`，消除了关于 `TLP:AMBER` 使用的一些困惑，后者意味着信息必须留在与其共享的组织内，不得与外部方（包括客户）共享。`TLP:AMBER`
    和 `TLP:AMBER+STRICT` 信息不得通过公开渠道共享。


    **`TLP:RED`：** 这是极度敏感的信息，通常与正在进行的事件或调查有关。未经事先批准，不得在特定接收人之外共享，甚至不得在接收人的组织内部共享。通常一旦情况解决，`TLP:RED`
    信息会被重新分级为 Amber 或 Green。


    **重复数据：** 重要的是要确保您不会因意外多次捕获同一事件数据或威胁报告而导致数据重复。然而，有时您会从多个来源收到相同信息，此时捕获这一事实非常重要。从多个地方（如内部调查*和*来自
    `FBI` 的威胁报告）接收相同的指标可能有严重影响，但如果您无法捕获围绕这两个来源的细节，就会严重阻碍您接下来将要进入的分析过程。


    在开始存储和管理数据时牢记这些事项，将使数据的使用和维护变得更加容易。


    ## 威胁情报平台


    从我们对标准的介绍以及管理调查期间所利用的所有信息的众多要求来看，捕获和分析所有这些信息绝非易事。威胁情报平台常被用来简化这一过程，使收集、存储和搜索这些信息变得更加容易。


    威胁情报平台 (`TIP`) 是专门设计用于处理威胁信息的数据库和用户界面。存在各类威胁情报平台——有的专注于信息共享，有的则侧重于大量 `IOC` 的存储和管理。大多数
    `TIP` 可以摄入前文所述战术格式的信息，并捕获管理信息所需的额外信息。使用 `TIP` 将显著减少 `F3EAD` 中利用阶段所需的工作量。有多个流行的开源平台可用，也有各种商业解决方案。我们接下来将讨论这些选项。


    ### MISP


    恶意软件信息共享平台 (`MISP`) 是管理基于恶意软件的威胁数据的免费选项。`MISP` 由一群开发人员联合 `NATO` 的计算机事件响应能力 (`NCIRC`)
    共同创建。`MISP` 包含一个带有用户界面的数据库，使组织能够存储与攻击相关的技术和非技术信息，以促进威胁信息的关联和共享。`MISP` 可以 `OpenIOC`、纯文本、`CSV`、`MISP
    XML` 和 `JSON` 格式导出信息，以便用于支持入侵检测和防御。`MISP` 还具有强大的共享功能，使用户能够与其他 `MISP` 用户或群组共享。您可以在
    [GitHub](https://github.com/MISP/MISP) 上获取更多关于 `MISP` 的信息。


    ### CRITs


    协同威胁研究 (`CRITs`) 是另一个用于管理和共享威胁数据的开源工具。`CRITs` 由 `MITRE` 开发，因此设计为可与 `STIX` 和 `TAXII`
    配合工作。`CRITs` 存储威胁信息，并包含为已捕获指标添加置信度和严重性的功能。它与 `TAXII` 服务集成以促进共享，因此是许多从政府或其他使用 `STIX/TAXII`
    的组织接收或交换信息的组织的良好选择。`CRITs` 可以将数据导出为 `CSV`、`STIX` 和 `JSON` 格式。关于安装和使用 `CRITs` 的信息和文档可在
    [GitHub](https://github.com/crits/crits) 上找到。


    ### YETI

    '

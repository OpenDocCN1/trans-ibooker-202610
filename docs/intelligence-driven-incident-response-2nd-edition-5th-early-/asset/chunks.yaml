    # Strategic Requirements


    Strategic requirements, unlike tactical or operational ones, have the luxury of
    time on their side. Requirements can be planned far in advance, allowing them
    to be larger or broader in scope, depending on the needs of the organization,
    and they can also specify timing or periodicity. For example, a strategic requirement
    may be to update a company’s threat model twice a year, or to analyze what new
    threats may impact a business if they move into a new market or a new geographical
    region. When setting strategic requirements, it is helpful to identify early on
    if the requirement is ongoing, when analysis needs to be completed, and how often
    the findings will need to be reviewed or updated. It is also important to periodically
    review standing strategic requirements to identify whether they are still relevant
    and necessary. Strategic requirements, just like tactical and operational ones,
    can become stale if they are no longer relevant. However, it can take much longer
    to realize that strategic requirements are stale.


    ## Collection


    The type of collection we have focused on so far in this book has been centered
    around logs and external sources such as threat feeds and information sharing.
    Although these types of collections still play a part in strategic intelligence,
    the scope of what you are collecting and from where will greatly increase, which
    is pretty exciting for those of us who are intelligence nerds at heart. Depending
    on your requirements—which have been specifically called out, *right*?—you may
    find yourself pulling information on economic, political, and cultural sources,
    or any number of other sources. This type of collection will also be more extensive
    than tactical collection, where any information older than a few days or even
    hours may be obsolete. With strategic intelligence, you may be searching for information
    that goes back years in order to capture trends or look for changes. The following
    sections describe useful types of strategic information to collect.


    ### Geopolitical Sources


    *Geopolitical intelligence* provides information on what is going on in the world,
    including conflicts, alliances, tensions, and other factors related to international
    relations in a particular region. There was a time when many people, maybe even
    some of the people reading (or writing) this book, disregarded geopolitics when
    it came to incident response. It is possible to hack a network from anywhere,
    so why would it matter if conflicts existed in certain areas of the world? Well,
    it turns out that there are many reasons geopolitics are important for incident
    response. Although it is possible to access networks from anywhere in the world,
    it doesn’t mean that regional conflicts or international tension have no impact
    on intrusion targeting and planning. Numerous times over the past decade, understanding
    geopolitical intelligence has been critical to understanding and responding to
    cyber attacks. Here are some examples:


    - In 2008, the ongoing conflict between Russia and Georgia escalated with a series
    of DDoS attacks against the Georgian state government, specifically targeting
    the website of the president along with sites dedicated to communications and
    finance. Shortly after these attacks began, kinetic operations commenced, making
    this the first official case of joint cyber-kinetic offensive operations.

    - In 2011, public outcry arose against the beating and eventual death of a homeless
    man in Fullerton, California, by police officers. As the investigation and hearings
    against the officers were conducted, both the city and the police department were
    targeted with DDoS attacks against websites and other attempted attacks targeting
    city assets. Attackers were successful at bringing the police department’s website
    down on at least one occasion.


    What is going on in the world, whether it is in our own backyards or across the
    globe, matters to strategic cyber threat intelligence. Understanding political
    climates, conflicts, triggers, and tactics of adversaries can assist in strategic
    planning.


    Although it is normal to focus outward on international threats, some aspects
    of geopolitics are local and should be considered as well. Good sources of geopolitical
    intelligence are peer-reviewed articles, white papers, and assessments. For this
    type of intelligence, is it often useful to look for historical information as
    well as current information about a situation. Understanding trends and patterns
    is particularly useful with geopolitical intelligence, where history often seems
    to repeat itself.


    ### Economic Sources


    *Economic intelligence* is incredibly important to network defense. Economics,
    the study of the production, consumption, and transfer of wealth, is not just
    useful for situational awareness, but for understanding the motivations of many
    threat actors. The vast majority of intrusions are economically motivated, whether
    that involves stealing credit cards for direct monetization or stealing intellectual
    property for strategic economic gain, and economic intelligence sources can provide
    insight into an adversary’s motivations.


    Economic intelligence sources vary, and can include information on how stolen
    information is monetized, the types of information that criminals target, the
    types of information that are being targeted for industrial espionage, and economics
    associated with nation states that are likely to target you or have targeted you
    in the past. Even with a broad understanding of economics, this type of information
    can help organizations understand the strategic threats that they are facing.
    A specialized knowledge can provide an even greater level of insight, though it
    is harder to find someone specializing in economics on a network security team.



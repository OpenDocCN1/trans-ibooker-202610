    # The Perishable Nature of Cyber-Threat Data


    The majority of cyber-threat data that is collected is perishable. The lifespan
    of that data varies from minutes to potentially months or even years, but there
    is always a period of time when this information is relevant. Understanding when
    data was collected can help defenders understand how it can be acted upon. It
    is difficult to properly analyze or utilize any data when you do not know when
    it was collected.


    ## Context


    The collection method and date can both provide some level of context around the
    data, but the more context that is available, the easier it will be to analyze.
    Context can include additional details, such as specific activities related to
    the information and relationships between pieces of information.


    ## Addressing Biases in Analysis


    All analysts have biases, and identifying and countering those biases so that
    they do not influence analysis is a key component of quality intelligence. Some
    biases that analysts should seek to avoid include *confirmation bias*, which seeks
    to identify information that will support a previously formulated conclusion,
    and *anchoring bias*, which leads analysts to focus too heavily on a single piece
    of information while disregarding other, potentially more valuable information.
    We cover biases in depth in Chapter 7, Analyze.


    # Levels of Intelligence


    The intelligence models we have examined thus far focus on a logical flow of information
    through a sort of analysis pipeline. But just as with incident analysis, this
    approach is not the only way to model the information. We can think about intelligence
    at different levels of abstraction, ranging from the highly specific (tactical)
    to the logistical (operational) to the very general (strategic). As we examine
    these levels of intelligence, keep in mind that this model represents a continuous
    spectrum with gray areas between them, not discrete buckets.


    ## Tactical Intelligence


    **Tactical intelligence** is low-level, highly perishable information that supports
    security operations and incident response. The customers for tactical intelligence
    include security operations center (SOC) analysts and computer incident response
    team (CIRT) investigators. In the military, this level of intelligence supports
    small-unit actions. In cyber-threat intelligence (CTI), this usually includes
    IOCs and observables as well as highly granular TTPs describing precisely how
    an adversary deploys a particular capability. Tactical intelligence enables defenders
    to respond directly to threats using methods such as hunting in the network for
    signs of adversary activity, prioritizing critical patching based on reports of
    active exploitation, or issuing information to employees of active phishing campaigns
    targeting their organization.


    An example of tactical intelligence is IOCs related to an exploitation of a newly
    discovered vulnerability. These tactical-level IOCs include IP addresses conducting
    scans searching for the vulnerability, domains hosting malware that will be downloaded
    to the host if exploitation is successful, and various host-based artifacts that
    are generated during exploitation and installation of malware. This tactical intelligence
    would enable security operations teams to effectively hunt for malicious activity
    in the network while taking concrete steps to mitigate any future exploitation.


    ## Operational Intelligence


    In the military, **operational intelligence** is a step up from tactical. This
    information supports logistics and analyzes effects of terrain and weather on
    larger operations - in other words, it involves far more context than just the
    tactical mission at hand. In CTI, this usually includes information on campaigns
    and higher-order TTPs, as well as anticipated responses from adversaries and how
    those actions may impact other operations. It may also include information on
    specific actor attribution as well as capabilities and intent. Customers for operational
    intelligence include senior-level Digital Forensics and Incident Response (DFIR)
    analysts and other CTI teams.


    This is one of the harder levels of intelligence for many analysts to work with,
    because it sometimes feels too general to be tactical but too specific to be strategic.
    Operational intelligence needs to be acted on somewhat urgently, however there
    are potentially far reaching implications of any action taken, so both the "observe"
    and "orient" phases of the OODA loop have far more components and complexities.
    In addition, the necessity of making a decision and acting on it is felt differently
    by analysts who are working on the data and decision makers, over at the executive
    level, who may want to spend a considerable amount of time weighing the best course
    of action.


    Following the preceding example about tactical-level indicators of active exploitation
    of a vulnerability, operational-level intelligence would include information on
    how widespread the exploitation is, whether it is targeted or opportunistic, who
    else is being targeted, the purpose of the malware that is being installed, and
    any details on the actors who are carrying out the attacks. Understanding these
    details can support the generation of follow-up intelligence, including what other
    actions that may be seen, and should include information on the severity of the
    threat to help plan a response.


    ## Strategic Intelligence


    In the military or government, **strategic intelligence** deals with national
    and policy-level information and is often the accumulation of years of analytic
    work aimed at providing a holistic picture of a situation. In CTI, we think of
    this as supporting C-level executives and boards of directors in making serious
    decisions about risk assessments, resource allocation, and organizational strategy.
    This information includes threat trends and actor motivations, along with additional
    information relevant to the organization. In the preceding example, strategic
    intelligence would include information on the motivations of the attackers, especially
    if the activity indicates a new or previously unidentified threat, and any information
    that indicates new tactics or attacker targeting that may require higher-level
    responses, such as new policies or an architecture change.


    # Confidence Levels


    As mentioned previously, intelligence typically has different confidence levels
    associated with it. These confidence levels reflect the analysts'' trust that
    the information is correct and accurate. For some types of data, this confidence
    may be on a numeric scale (for example, 0 to 100) and calculated using traditional
    statistical methods, while in other cases the confidence assessment is provided
    on a qualitative, subjective basis by analysts directly. It is important to identify
    confidence in two important areas: confidence in the source of the information,
    and confidence in an analyst''s conclusions.


    One common way of describing source reliability is the Admiralty Code or NATO
    System found in `FM 2-22.3` (`https://fas.org/irp/doddir/army/fm2-22-3.pdf`).
    This consists of two scales. The first evaluates the reliability of a source based
    on previous information, ranging from A (Reliable) to E (Unreliable). The second
    scale evaluates the degree of confidence in the information content itself, ranging
    from 1 (Confirmed) to 5 (Improbable). These two scores are combined for a particular
    piece of information based on the source and specific content, so that information
    known to be true from a source with a history of valid information might be evaluated
    as B1, but information that is improbable from a source with a history of invalid
    information would be evaluated as E5.


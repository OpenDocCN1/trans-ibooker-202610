    intelligence. The traditional intelligence cycle—which we cover in depth in [`#basics_of_intelligence`](https://atlas.oreilly.com/oreillymedia2/intelligence-driven-incident-response/editor/master/01-introduction.html#basics_of_intelligence)—involves
    direction, collection, processing, analysis, dissemination, and feedback. Intelligence-driven
    incident response involves all of these components and helps inform direction,
    collection, and analysis in other applications of threat intelligence as well,
    such as network defense, secure software development, and user awareness training.
    Intelligence-driven incident response doesn’t end when the intrusion is understood
    and remediated; it generates information that will continue to feed the intelligence
    cycle.


    Analysis of an intrusion, no matter if it was successful or failed, can provide
    a variety of information that can be used to better understand the overall threat
    to an environment. The root cause of the intrusion and the initial access vector
    can be analyzed to inform an organization of weaknesses in network defenses or
    of policies that attackers may be abusing. The malware that is identified on a
    system can help identify the tactics that attackers are using to evade traditional
    security measures such as antivirus or host-based intrusion-detection tools and
    the capabilities they have available to them. The way an attacker moves laterally
    through a network can be analyzed and used to create new ways to monitor for attacker
    activity in the network. The final actions that an attacker performed (such as
    stealing information or changing how systems function), whether they were successful
    or not, can help analysts understand the enemy’s motivations and goals, which
    can be used to guide overall security efforts. There is essentially no part of
    an incident-response engagement that cannot be used to better understand the threats
    facing an organization and improve future defense and response.


    For this reason, the various processes and cycles outlined in this book are aimed
    at ensuring that intelligence-driven incident response supports overall intelligence
    operations. Although they provide specific guidance for utilizing cyber-threat
    intelligence in incident response, keep in mind that wider applications can be
    used as intelligence capabilities expand.


    # What Is Intelligence-Driven Incident Response?


    Cyber-threat intelligence isn’t a new concept, simply a new name for an old approach:
    applying a structured analytical process to understand an attack and the adversary
    behind it. The application of threat intelligence to network security is more
    recent, but the basics haven’t changed. Cyber-threat intelligence involves applying
    intelligence processes and concepts—some of the oldest concepts that exist—and
    making them a part of the overall information security process. Threat intelligence
    has many applications, but one of the fundamental ways it can be utilized is as
    an integral part of the intrusion-detection and incident-response process. We
    call this *intelligence-driven incident response* and think it is something every
    security team can do, with or without a major capital investment. It’s less about
    tools, although they certainly help sometimes, and more about a shift in the way
    we approach the incident-response process. Intelligence-driven incident response
    will help not only to identify, understand, and eradicate threats within a network,
    but also to strengthen the entire information security process to improve those
    responses in the future.


    # Why Intelligence-Driven Incident Response?


    Over the past few decades, our world has become increasingly interconnected, both
    literally and figuratively, allowing attackers to carry out complex campaigns
    and intrusions against multiple organizations with the same effort that it used
    to take to target a single entity. We are long past the point where we can automatically
    assume that an intrusion is an isolated incident - in fact, while we used to be
    stunned to find overlaps and connections between intrusions, now we are suspicious
    when we *don’t* see overlap. When we better understand the adversary, we can more
    easily pick up on the patterns that show commonalities between intrusions. Intelligence-driven
    incident response ensures that we are gathering, analyzing, and sharing intelligence
    in a way that will help us identify and respond to these patterns more quickly.


    ## Operation SMN


    A good example of this is the analysis of the Axiom Group, which was identified
    and released as a part of a Coordinated Malware Eradication (CME) campaign in
    2014 called [Operation SMN.](http://www.novetta.com/wp-content/uploads/2014/11/Executive_Summary-Final_1.pdf)

    '
  trans: '

    在信息安全领域，我们传统上关注可观测的概念；我们偏好那些可测试、可复现的事物。而网络威胁情报则处于观测与解读之间的领域。我们可能无法**确定**某对手会企图访问员工财务记录，但我们可以对过往入侵数据以及我们网络外部成功攻击者的数据进行分析，并就可能需要额外防护的系统和数据类型提出建议。我们不仅需要能够解读信息，还需要能够以一种对目标受众有意义的方式传达它，以帮助他们做出决策。回顾他对《布谷鸟的蛋》中入侵事件的历史性分析，Cliff
    Stoll 将“讲故事的必要性”视为他从整个经历中获得的关键教训之一。“我以为我只需向人们展示数据，他们就会理解，”他说，“但我错了。你需要讲一个故事。”（SANS
    CTI Summit 2017）


    ## 前进之路


    新技术让我们获得了更多关于攻击者行为的信息，也提供了基于这些信息采取行动的更多方式。然而，我们发现，随着每一项新技术或概念的实施，对手也在适应；拥有字母汤般名字的蠕虫和病毒变种的速度比我们的设备识别它们的速度还快，而资金充足、技术成熟的攻击者往往比许多网络防御者更有组织、更有动机。临时性和凭直觉的情报工作将不足以让防御者保持在威胁之前。分析也必须随之进化，变得正式且结构化。范围必须扩大，目标必须变得更具雄心。


    除了检测针对组织往往模糊且短暂的边界的威胁外，分析师还需要深入其网络内部，寻找那些突破防线的攻击，一直追踪到单个用户系统和服务器本身，同时还要向外看向第三方服务，以更好地了解可能针对他们的攻击者。信息需要被分析并理解其含义，随后必须采取行动，以更好地预防、检测和根除威胁。为更好地了解对手而采取的行动需要成为一个正式流程，并成为信息安全运营的关键部分：威胁情报。


    # 情报驱动的事件响应


    *情报*通常被定义为经过提炼和分析、能够使利益相关者做出更好决策的数据。因此，情报需要数据。在情报驱动的事件响应中，有多种方式收集可被分析并用于支持事件响应的信息。但重要的是要注意，事件响应本身也会生成网络威胁情报。传统情报周期——我们将在
    [`#basics_of_intelligence`](https://atlas.oreilly.com/oreillymedia2/intelligence-driven-incident-response/editor/master/01-introduction.html#basics_of_intelligence)
    中深入探讨——涉及指导、收集、处理、分析、传播和反馈。情报驱动的事件响应包含所有这些组成部分，并有助于为威胁情报的其他应用（如网络防御、安全软件开发和用户安全意识培训）中的指导、收集和分析提供信息。情报驱动的事件响应并不在入侵被理解和修复时结束；它生成的信息将持续反哺情报周期。


    无论入侵是成功还是失败，对其进行分析都能提供各种信息，用于更好地理解环境面临的整体威胁。入侵的根因和初始访问向量可以被分析，以告知组织其网络防御中的弱点或攻击者可能滥用的策略。在系统上发现的恶意软件有助于识别攻击者用于规避传统安全措施（如防病毒软件或基于主机的入侵检测工具）的战术，以及他们可用的能力。攻击者在网络中横向移动的方式可以被分析，并用于创建监控网络中攻击者活动的新方法。攻击者执行的最终动作（如窃取信息或更改系统功能），无论是否成功，都能帮助分析师了解敌人的动机和目标，从而指导整体安全工作。事件响应工作中基本没有哪个部分不能用于更好地理解组织面临的威胁，并改进未来的防御和响应。


    因此，本书中概述的各种流程和周期旨在确保情报驱动的事件响应支持整体情报行动。虽然它们为在事件响应中利用网络威胁情报提供了具体指导，但请记住，随着情报能力的扩展，可以有更广泛的应用。


    # 什么是情报驱动的事件响应？


    网络威胁情报并非新概念，只是给一个旧方法起了个新名字：应用结构化分析流程来理解攻击及其背后的对手。将威胁情报应用于网络安全是较近期的事，但基础没有变。网络威胁情报涉及应用情报流程和概念——一些最古老的概念——并使其成为整体信息安全流程的一部分。威胁情报有许多应用，但其最基本的利用方式之一是作为入侵检测和事件响应流程不可或缺的一部分。我们称之为*情报驱动的事件响应*，并认为这是每个安全团队都能做到的，无论是否有大量资本投入。它与工具关系不大，尽管工具有时确实有帮助，而更多的是关于我们处理事件响应流程方式的转变。情报驱动的事件响应不仅有助于识别、理解和根除网络中的威胁，还能强化整个信息安全流程，以改进未来的响应。


    # 为什么需要情报驱动的事件响应？


    在过去几十年里，我们的世界变得日益互联，无论是字面上还是隐喻上，这使得攻击者能够以过去针对单个实体所需的相同精力，对多个组织发动复杂的战役和入侵。我们早已过了可以自动假设入侵是孤立事件的阶段——事实上，虽然我们过去常因发现入侵之间的重叠和关联而震惊，但现在如果我们*没*看到重叠，反而会感到怀疑。当我们更好地了解对手时，就能更容易地捕捉到显示入侵共性的模式。情报驱动的事件响应确保我们以一种有助于更快识别和响应这些模式的方式收集、分析和共享情报。


    ## SMN 行动


    一个很好的例子是对 Axiom 组织的分析，该组织是在 2014 年作为协同恶意软件根除（CME）活动的一部分被识别并披露的，该活动称为 [Operation
    SMN.](http://www.novetta.com/wp-content/uploads/2014/11/Executive_Summary-Final_1.pdf)

    '

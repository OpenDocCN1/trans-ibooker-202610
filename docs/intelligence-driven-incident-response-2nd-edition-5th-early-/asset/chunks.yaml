    ### Anchoring bias


    In anchoring bias, analysts tend to become over reliant or give more weight to
    the first piece of information that they hear. Any subsequent information or evidence
    is compared to that initial piece of evidence, and the analyst often unconsciously
    debates whether the new evidence supports or refutes the first piece, making that
    first piece of information central to the investigation. If analysts were told
    going into the process of analyzing an intrusion that “we think it was Russia,”
    then each piece of evidence will influence their interpretation of whether it
    was Russia, when that really is not the question that the analysts were meant
    to answer. Anchoring bias is one of the reasons that some experts such as [Robert
    M. Lee](http://www.robertmlee.org/tag/attribution/) say that true attribution
    (attribution to a particular government or nation-state) makes it more difficult
    for analysts to do their job because that attribution becomes the anchor that
    they base their judgments off of rather than a useful piece of evidence to include
    in analysis. Again, going through the process of focusing on the requirements
    and what question is actually being asked, developing a hypothesis, and evaluating
    key assumptions should help an analyst account for and counteract anchoring bias.


    ### Availability bias


    In availability bias, there is an overemphasis on the information that is available,
    whether or not that information has itself been analyzed. Richard Heuer calls
    this bias the Vividness Criterion, which means that information that you personally
    experience or are most familiar with will become more important than information
    you are not as familiar with. It has also been referred to as the “I know a guy”
    bias, as in, “I know a guy who smoked a pack of cigarettes a day and lived to
    be 100; therefore, smoking can’t be that bad for you.” A newer version of the
    “I know a guy” bias is the “I saw it on the internet” bias.


    Incident responders and intelligence analysts in particular need to be aware of
    this bias because this is what allows their previous experience to hurt rather
    than help them. If they focus on particular pieces of evidence that they are most
    familiar with because they have seen it before, then they may give that one thing
    too much weight or discount other pieces of evidence that they are not as familiar
    with.


    ### Bandwagon effect


    Bandwagoning occurs when an assumption seems more likely to be true as more people
    agree with it. Although there is something to be said for group consensus after
    a piece of evidence has been analyzed, the bias comes into play when this judgment
    occurs prior to analysis, or when the fact that others support the assumption
    becomes a basis for believing that assumption is true. There is some interesting
    psychological reasoning with bandwagoning, and it can therefore be hard to overcome,
    but it is important to note that “because everyone says so” is not a valid justification
    for an assumption to be labeled as accurate. If there is evidence to back up a
    group consensus, it is important to look at the evidence rather than the fact
    that everyone is in agreement.


    Heuer also refers to an “oversensitivity to consistency” and writes that, “Information
    may be consistent only because it is highly correlated or redundant, in which
    case many related reports may be no more informative than a single report.” To
    overcome this, Heuer recommends that analysts ensure that they are familiar with
    the body of evidence that previous analysis is based on, including the sample
    size and the information available, and question whether the same, consistent
    conclusion would likely continue with a larger sample size or the availability
    of more information. This is especially helpful with media reporting of an attacker.
    Multiple media reports may all be based on a single incident, so just because
    there are multiple reports does not mean that there were multiple incidents.


    ### Mirroring


    Mirroring, or mirror-image bias, occurs when an analyst makes the assumption that
    a target being studied thinks like the analyst and therefore would make the same
    decisions as the analyst would. This leads to an analyst making assumptions about
    what an adversary would or wouldn’t do based on the analyst’s own personal experiences,
    which are often completely different from those of the target. Instead of using
    the evidence to guide judgments, an analyst suffering from this bias uses her
    own opinions of what would have been a logical step, or “what I would have done”
    to determine whether an assumption is correct. Mirroring is often used during
    the generation of working ideas, but during the Evaluation phase, it is important
    to identify when mirroring, rather than evidence, is the basis of an assumption
    and remove that bias from the analysis.


    # Conclusion


    If there is one phrase that can sum up the most effective way to approach analysis,
    it is `slow down`. Not only will this help engage the system 2 process before
    you need to jump right back to the beginning with another intrusion or some other
    pressing task. While it may seem urgent to move onto something else, you are not
    quite done yet. Taking a little bit of time to understand if and how the recent
    incident fits into your organization’s understanding of the strategic threat landscape
    is a task that will pay dividends down the road. It is one of the best ways to
    make sure that your organization actually learns from the incident and moves forward
    in a more resilient, informed manner.


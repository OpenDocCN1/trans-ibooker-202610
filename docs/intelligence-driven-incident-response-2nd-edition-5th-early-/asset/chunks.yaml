  fmt: '

    *   Based on your tools, complete the necessary logistical steps to prep them
    for exploitation - whether this means creating a new file based off of a template,
    identifying that tags that will be used when entering data into a database, or
    beginning a new wiki page that will house all of the information from this incident.

    *   Working down the checklist you created of data to be aggregated, begin moving
    data from disparate sources into your tool of choice, checking off one source
    once it is complete.


    Having a clear process to get from a pile of data post-incidents to a structured,
    comprehensive set of information ready for analysis is one of the best ways to
    set yourself up for success. The system you develop may involve multiple people
    focusing on different functions within the system, or it may just be a process
    for yourself. You may add timelines or milestones into the process to keep you
    on track and accountable, or you may find that every incident is so different
    that timelines don’t matter as much as just moving through the steps. The important
    part is to document how you will move through the data extraction process and
    to be comfortable updating or revising the process as goals, tools, or needs change.


    ## Step 4: Launch and iterate


    This where you dive in. This can be the hardest part of the whole process - even
    if you have the right tools and a solid process you have to actually start working
    through the steps in a systematic way. Try things out to see what is working and
    where you are running into hurdles. Don’t be afraid to change your process up,
    start identifying new tools you may need, or new skills that would make the process
    easier. If you find a method or approach that is especially useful, make sure
    to document it for future analysts (or for future you)


    # Managing Information


    Managing information does not simply involve capturing the individual indicators
    of compromise or artifacts from an investigation. A great deal of additional information
    needs to be captured as well so that you know how to manage and handle all the
    types of information moving forward.


    Some key things are critical to capture in order to help manage information:


    **Date:** When was this piece of data or information seen? This will help with
    analysis as well as support expiration or retirement of data, essentially determining
    when data is still good to act on and include in analysis and when that data is
    no longer valid.


    **Source:** Few things are more frustrating than not knowing when and where a
    piece of information came from. Capturing the source of the information will help
    if you ever need to go back to get more information or if you want to assign the
    confidence of that piece of information, both of which will be useful during the
    analysis phase.


    **Data-handling information:** Often data will need to be handled differently
    based on the sensitivity and the source. We recommend using `DHS`’s Traffic Light
    Protocol (`TLP`), which dictates how information can be shared. The `TLP` standard
    was updated in August 2022, additional information can be found [here](https://www.first.org/tlp/).


    **`TLP:CLEAR`:** Publicly available information that can be shared with anyone
    using any method.


    **`TLP:GREEN`:** Information that can be shared with peers and partners, but not
    using publicly available channels, such as posting it on a blog or tweeting it
    to journalists. Seriously, don’t do that.


    **`TLP:AMBER`:** This information can be shared with people within your organization
    and its clients, but not outside it, and not using public channels. `TLP` v2 helped
    to clear up some confusion about the use of `TLP:AMBER` by specifically including
    client of an organization, and introducing the new caveat `TLP:AMBER+STRICT`,
    which means that the information must stay with the organization with whom it
    is shared, and cannot be shared with external parties, including clients. `TLP:AMBER`
    and `TLP:AMBER+STRICT` information should not be shared using public channels.


    **`TLP:RED`:** This is extremely sensitive information, usually related to an
    ongoing incident or investigation. It should not be shared outside the specific
    recipient, not even within the recipient’s organization, without prior approval.
    Often `TLP:RED` information will be reclassified as Amber or Green once the situation
    has been resolved.


    **Duplicate data:** It is important to make sure that you are not duplicating
    data by accidentally capturing the same incident data or threat report more than
    one time. However, at times you will receive the same information from more than
    one source, and when that happens, it is important to capture that. Receiving
    the same indicators from multiple places, such as from an internal investigation
    *and* from a threat report from the `FBI` can have serious implications, but if
    you are not able to capture the details around both sources, you can seriously
    hinder the analytic process, which you will be moving into next.


    Keeping these things in mind as you begin to store and manage your data will make
    using and maintaining your data much easier.


    ## Threat-Intelligence Platforms


    As you can probably tell from our coverage of standards and the numerous requirements
    for managing all the information that you have exploited during an investigation,
    that capturing and analyzing all of this information is no trivial task. A threat
    intelligence platform is often used to simplify that process and make gathering,
    storing, and searching this information easier.


    A threat-intelligence platform (`TIP`) is a database and user interface specifically
    designed to handle threat information. Various types of threat intelligence platforms
    exist—some that specialize in information sharing, and some that focus on the
    storage and management of large quantities of `IOCs`. Most `TIPs` can ingest information
    in the tactical formats described earlier in the chapter, and capture the additional
    information needed to manage the information as well. Using a `TIP` will significantly
    reduce the amount of work that needs to be done in the Exploit phase of `F3EAD`.
    Several popular open source platforms are available, and a variety of commercial
    solutions as well. We will discuss those options next.


    ### MISP


    The Malware Information Sharing Platform (`MISP`) is a free option for managing
    malware-based threat data. `MISP` was created by a group of developers in conjunction
    with `NATO`’s Computer Incident Response Capability (`NCIRC`). `MISP` includes
    a database with a user interface that enables organizations to store both technical
    and nontechnical information related to attacks in order to facilitate correlation
    and sharing of information on threats. `MISP` can export information in `OpenIOC`,
    plain text, `CSV`, `MISP XML`, and `JSON` formats so that it can be used to support
    intrusion detection and prevention. `MISP` also has a robust sharing capability
    enabling users to share with other `MISP` users or groups. You can get more information
    on `MISP` [on GitHub](https://github.com/MISP/MISP).


    ### CRITs


    Collaborative Research into Threats (`CRITs`) is another open source tool for
    managing and sharing threat data. `CRITs` was developed by `MITRE`, and therefore
    was designed to work with `STIX` and `TAXII`. `CRITs` stores threat information
    and includes the ability to add confidence and severity to the indicators that
    have been captured. It integrates with `TAXII` services to facilitate sharing,
    and is therefore a good choice for many organizations that receive or exchange
    information with the government or other organizations using `STIX/TAXII`. `CRITs`
    can export data into `CSV`, `STIX`, and `JSON` formats. Information and documentation
    for installing and using `CRITs` can be found [on GitHub](https://github.com/crits/crits).


    ### YETI


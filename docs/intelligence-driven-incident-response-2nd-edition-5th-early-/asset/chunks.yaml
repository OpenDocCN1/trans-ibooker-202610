- raw: 'Apart from hacking back, however, active defense includes several other valid
    and useful elements. Wendi Rafferty at the SANS DFIR Summit in 2015 described
    the goal of active defense as attempting to disrupt the tempo of an adversary.
    Andrew Thompson of Mandiant uses the same phrasing as Gen. Nakasone, describing
    it as “imposing cost”. Like a detective, the goal of incident responders is to
    catch an adversary in a mistake, providing a chance to expose them. Active defense
    gives defenders a means to accelerate that by forcing the adversary into an error,
    generally while responding to a roadblock put into place by the incident-response
    team.


    As previously discussed for adversaries, defenders have the option to deny, disrupt,
    degrade, deceive, and destroy (Thus we call this model the D5 model of defense).
    Originally developed as a series of desired capabilities for computer network
    attack (CNA), it turns out the same D5 model provides a great list of capabilities
    for active defense.


    ## Deny


    The idea of denying an adversary is so straightforward and common that most organizations
    wouldn’t even imagine it’s a type of active defense, most are actively doing deny
    style actions regularly. If we go by our traditional definition of disrupting
    the adversary’s tempo, though, this is a perfect example. Denying can be simple,
    such as implementing a new firewall rule to block an adversary’s command and control,
    applying a system patch for a vulnerability, or shutting down access for a compromised
    email account. The key to denial is *preemptively excluding a capability or infrastructure
    from the malicious actor*.


    Denial forces adversaries to deviate from their plan and to find a different way
    to achieve their objectives. If the adversaries don’t change every single indicator
    of compromise (IOC) before continuing, you can force them into revealing TTPs
    and pivot your investigation to their new activities. Additionally, many deny
    actions could be interpreted as mere coincidence, such as a user resetting a password
    because of a required window, not at the direction of the incident-response team.


    ## Disrupt


    If the Deny action preemptively excludes a capability or infrastructure from the
    malicious actor, then Disrupt *actively excludes a resource from the malicious
    actor*. In most cases, disruption requires active observation of an adversary
    in order to know when they’re active so that they can be disrupted in real time.
    This could mean cutting off a command-and-control channel while it’s being used
    or interrupting the exfiltration of a large archive file.


    ## Degrade


    Closely related to disrupting and denying an adversary, Degrade focuses on *marginal
    reduction of an adversary’s resources while they’re actively being used*. An easily
    understandable example is throttling an adversary’s bandwidth during exfiltration,
    causing a large file to upload over an extremely slow time frame. This degradation
    of access attempts to frustrate adversaries, hopefully driving them to attempt
    to access the data in a different way and expose additional infrastructure, tools,
    or TTPs.


    Disruption and degradation present interesting but dangerous opportunities for
    a network defense team. While denial actions may be explained away as coincidence
    or normal passive defensive operations, disruption and degradation are clearly
    active. They begin to open up a dialogue with an adversary, giving the adversary
    an indication that the defender is deliberately responding. Adversaries in situations
    like this can take a variety of actions. They may spool up attack tempo and severity
    by bringing advanced capabilities to bear, or they may go all the way in the other
    direction and cease operations entirely while they wait for the heat to go down.
    This is the risk of these types of active defense, and they need to be taken with
    a measure of caution and preparation.


    ## Deceive


    Easily the most advanced of available techniques, the Deceive active defense action
    is based on the counter intelligence concept of *deliberately feeding adversaries
    false information* with the hopes they’ll treat it as truth and make decisions
    based on it. This ranges from planting false documents with incorrect values to
    hosting honeypot systems or even networks.


    Deception operations require a deep understanding of the adversary’s goals, methods,
    and even psychology, as well as your own resources. Making deception material
    that an adversary is willing to accept as truth is incredibly difficult, as skilled
    adversaries will attempt to corroborate any material they find with other sources.
    That said, deception has gotten the attention of vendors selling tools ranging
    from simply honeypots or tokens (a passive deception approach), all the way up
    to advanced deception suites that mimic entire networks and monitor adversaries
    as they pivot around (active deception).


    ## Destroy


    Destroy actions do actual harm, whether kinetic or virtual, to an adversary’s
    tools, infrastructure, or operators. In most cases, this is the purview of law
    enforcement, intelligence, or military operators (in the United States these are
    Title 10 and Title 50 organizations) that have the legal authority to commit such
    acts. For a commercial or private organization to do so is not only generally
    accepted to be illegal but also dangerous. It is unlikely that they have the tools,
    methodology, and operators to conduct a successful computer network attack, and
    there could be significant unintended consequences. Those resources are better
    allocated to improved defensive operations.


    Is active defense for you? Active defense is a trendy topic, but should organizations
    make it a part of their security program? As with almost any simple question about
    complex topics, the answer is, “It depends.” Active defense doesn’t have to be
    implemented in its entirety. Denying an adversary is in the realm of any organization,
    and in fact most are probably already doing it whether they know it or not. Disruption
    and degradation require maturity. Deception is an advanced tactic that carries
    high reward but also high risk and should be reserved for all but the most advanced
    security teams. As we just said, the Destroy active defense action requires special
    legal status that’s not available to non-government organizations.


    # F3EAD


    The last major cycle to cover combines the intelligence generation aspects of
    the intelligence cycle with the operations-centric aspect of the incident and
    kill chain cycles. Built as a targeting methodology for special operations teams
    working with intelligence analysis cells in the field, F3EAD addresses two key
    issues with both of the previous cycles:


    *   Intelligence cycles shouldn’t just lead to more intelligence: they should
    lead to meaningful operations. In our case, this means threat intelligence shouldn’t
    just lead us to more threat intelligence but instead to aggressive incident-response
    actions.


    *   Operations cycles shouldn’t end after the objective is completed. The information
    gained during any operation should start feeding a new intelligence cycle. In
    our case, when an incident response is concluded, the information developed during
    it should be fed into the intelligence apparatus to start developing new intelligence,
    learn from previous incidents, and be better prepared for future intrusion attempts.


    Thus, these two cycles, operations and intelligence, *feed into each other* instead
    of just themselves ([Figure 3-5](#ch03.html#fig_4_the_f3ead_operations_intelligence_cycle).
    Each incident-response operation leads to intelligence operations, and each intelligence
    operation leads to an incident-response operation, continuing the cycle.


    ![](assets/image-to-come.png)'

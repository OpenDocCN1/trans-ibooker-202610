- raw: 'The original way that hosts on the internet were able to identify and communicate
    with each other was by using a single test file containing the names and IP addresses
    of all hosts. This file was aptly named *HOSTS.TXT* and was FTPed to all of the
    machines on the internet. This solution was sustainable when a limited number
    of hosts were on the internet, as shown in [Figure 5-5](#ch05.html#fig_5_arpanet).
    However, it was difficult to maintain, and as the file grew, it took more and
    more bandwidth to transfer.


    ![](assets/analyze_837710_05.png)


    A more sustainable solution was developed, called the Domain Name System (DNS).
    It is essentially still a list of domains and hosts, but rather than a single
    file that is shared with everyone, the list exists on domain name servers that
    are queried when a host needs to look something up. The DNS is defined in [RFC
    1034](https://www.ietf.org/rfc/rfc1034.txt) and [1035](https://www.ietf.org/rfc/rfc1035.txt),
    and [RFC 7719](https://tools.ietf.org/html/rfc7719) released in 2015 defines modern
    DNS terminology. *Passive DNS*, originally called *Passive DNS Replication*, is
    a technique invented by Florian Weimer in 2004 as a way to gather and reconstruct
    information from the global DNS. The original use case identified in the paper
    “[Passive DNS Replication](http://bit.ly/2tNacPc)” presented at the FIRST Conference
    in 2004 was the identification of domain names associated with botnet command
    and control IPs. Weimer noted that botnet C2 often uses multiple domain names
    rather than hardcoded IP addresses, and that these domains can resolve to multiple
    IP addresses, making filtering difficult. In order to identify what IP address
    a domain resolved to at any given time, or vice versa, would require collecting
    the information ahead of time and storing it in a database so that it could be
    queried when needed.


    Passive DNS provides an analyst with information on IP addresses and domains that
    were identified during an investigation. It can also provide information on the
    nature of the activity. Passive DNS information is especially useful when paired
    with WHOIS information to get a more complete picture of an indicator of compromise.
    Just remember that Passive DNS information, like WHOIS information, is not static,
    so make sure that you pay attention to the time frame.


    #### Certificates


    The bases of both modern encryption and code signing certificates are another
    information rich source of information. Because certificates come from signing
    authorities that require more information than registering a domain or IP address,
    they have multiple facets to pivot off of. Different kinds of certificates (code
    signing vs network TLS) and different providers will collect different information.
    Given many providers set a high bar, both in information, validation, and cost,
    for getting certificates adversaries may be forced reuse certificates and makes
    a great pivot point.


    #### Malware information


    Information on malware can be extremely useful in analysis, and similar to Passive
    DNS information, many of the details around a piece of malware tend to change
    as time goes on and more information is discovered. Resources such as VirusTotal
    are living resources, the information changes as new entries are made, new detections
    are recorded, or users identify additional details around a sample. The following
    are examples of enrichment information on malware (Table 5-1):


    Table 5-1. \[Table title to come\]


    | Detection ratio || This number will change as time goes on and can be a useful
    indicator of the uniqueness of a sample that has been identified. When a sample
    first appears and is analyzed, the detection number, or the number of antivirus
    vendors who flag that sample as malicious, will be low. As time goes on, this
    number will increase. |


    | --- | --- |


    | File details || This includes information that has been identified about a file,
    which is updated as more individuals or organizations analyze the sample. Even
    if you have conducted your own analysis of a particular malware sample, seeing
    what other analysis has been conducted can help to fill in any gaps you have and
    can also indicate how widespread the deployment is. It is helpful to know whether
    something has been used only against your network, or is being seen across many
    networks in several industries. |


    | Malware behavior || In addition to static information such as the hash of a
    malware sample, it is also possible to identify additional aspects of the malware’s
    behavior, including where it installs, other files it calls or relies upon to
    execute, and any automated or scripted actions it takes upon execution. These
    details can help you understand other malicious activities you may find on your
    network and provide a glimpse into the sophistication of the attacker and whether
    the malware is unique or is a variant of a common malware family. |


    ### Internal enrichment information


    Not all enrichment information comes from external sources. Internal enrichment
    information provides additional details on things such as compromised hosts, users,
    or accounts. Internal information to be aware of includes the following (Table
    5-2):


    Table 5-2. \[Table title to come\]


    | Business operations || Knowing what is going on in your network and in your
    organization at the time of an incident can help answer questions about why you
    were targeted and why the attack was successful. Did you recently announce new
    partnerships? Were you involved in a new merger or acquisition? These are important
    details that can help you understand the nature of an attack and often can be
    obtained only by talking to people within your organization. |


    | --- | --- |


    | User information || Identifying which users were targeted or compromised can
    help you understand what information the attackers may have been after, if you
    have not already identified what was stolen. It can also provide information on
    the attacker’s tactics; for example, if they initially target HR employees, and
    then attempt to move to a user with more access, such as a systems administrator.
    |


    ## Leverage Information sharing


    Understanding when or if an indicator was previously identified can help put your
    particular incident into perspective. You should have identified some of this
    information during the Find phase, but it is useful to see what has changed or
    if any new information has been identified about any indicators that you are using
    in your analysis.


    A good source of timely, nonpublic information of this nature is sharing relationships
    with other organizations. Public information is useful as well, and should be
    used in analysis, but information-sharing groups can provide details that often
    do not make it into the public domain, including specifics about when an indicator
    was seen, how it was identified, and what industry it was seen in. These are the
    types of details that many organizations do not want published but are often willing
    to share with partner organizations, especially when other organizations are sharing
    this sensitive information as well. There are formalized sharing groups, such
    as Information Sharing and Analysis Centers (ISACs), Information Sharing and Analysis
    Organizations (ISAOs), public/private partnerships, and informal groups. Many
    of the formal groups are arranged around industry or other shared interest groups.
    In some cases, information obtained from sharing groups can be used to detect
    malicious activity, but for the purpose of analyzing incidents, it can also be
    used as an enrichment source to help build out your understanding of the intrusion
    you are analyzing.


    Once all information has been evaluated and enriched, it is time to move on to
    the next step: developing a hypothesis.'
  fmt: '

    ## DNS and Passive DNS


    互联网上的主机最初识别和通信的方式是使用一个包含所有主机名称和 IP 地址的单一测试文件。该文件被恰当地命名为 `HOSTS.TXT`，并通过 FTP 传输到互联网上的所有机器。正如[图
    5-5](#ch05.html#fig_5_arpanet)所示，当互联网上的主机数量有限时，该解决方案是可持续的。然而，它难以维护，且随着文件增长，传输所需的带宽越来越多。


    ![](assets/analyze_837710_05.png)


    开发出了一种更可持续的解决方案，称为域名系统（`DNS`）。它本质上仍然是域名和主机的列表，但不再是共享给所有人的单个文件，而是列表存在于域名服务器上，当主机需要查找内容时会查询这些服务器。`DNS`
    定义在 [RFC 1034](https://www.ietf.org/rfc/rfc1034.txt) 和 [RFC 1035](https://www.ietf.org/rfc/rfc1035.txt)
    中，[RFC 7719](https://tools.ietf.org/html/rfc7719) 于 2015 年发布，定义了现代 `DNS` 术语。`Passive
    DNS`，最初称为 `Passive DNS Replication`，是 Florian Weimer 于 2004 年发明的一种技术，用于从全局 `DNS`
    收集和重构信息。2004 年 FIRST 会议上发表的论文“[Passive DNS Replication](http://bit.ly/2tNacPc)”中确定的原始用例是识别与僵尸网络命令控制
    IP 相关的域名。Weimer 指出，僵尸网络 C2 通常使用多个域名而非硬编码 IP 地址，且这些域名可解析为多个 IP 地址，使得过滤变得困难。为了识别某域名在任意给定时间解析到的
    IP 地址（或反之），需要提前收集信息并存储在数据库中，以便需要时查询。


    `Passive DNS` 为分析师提供调查期间识别的 IP 地址和域名信息。它还可提供活动性质的信息。当 `Passive DNS` 信息与 `WHOIS`
    信息结合使用时，对于获取妥指标的更完整图景特别有用。只需记住，`Passive DNS` 信息与 `WHOIS` 信息一样，并非静态的，因此请务必关注时间范围。


    ### Certificates


    现代加密和代码签名证书的基础是另一个信息丰富的来源。因为证书来自签名机构，而签名机构要求的信息比注册域名或 IP 地址更多，所以它们有多个可供支点分析的侧面。不同类型的证书（代码签名与网络
    TLS）和不同的提供商将收集不同的信息。鉴于许多提供商在信息、验证和成本方面为获取证书设置了高门槛，攻击者可能被迫重用证书，这使其成为极佳的支点。


    ### Malware information


    恶意软件信息在分析中极其有用，且与 `Passive DNS` 信息类似，围绕某恶意软件的许多细节会随着时间推移和更多信息的发现而变化。`VirusTotal`
    等资源是活体资源，随着新条目的添加、新检测的记录或用户识别出样本的更多细节，信息也会随之变化。以下是恶意软件丰富信息的示例（表 5-1）：


    **表 5-1. 恶意软件丰富信息**


    | 类别 | 说明 |

    | --- | --- |

    | Detection ratio | 此数字会随时间变化，可作为已识别样本独特性的有用指标。当样本首次出现并被分析时，检测数（即将该样本标记为恶意的防病毒厂商数量）较低。随着时间的推移，该数字会增加。
    |

    | File details | 包括关于文件的已识别信息，随着更多个人或组织分析样本而更新。即使您已对特定恶意软件样本进行了自己的分析，查看其他分析结果也有助于填补空白，并可指示部署的广泛程度。了解某样本是仅针对您的网络使用，还是在多个行业的许多网络中被发现，这很有帮助。
    |

    | Malware behavior | 除了恶意软件样本哈希等静态信息外，还可识别恶意软件行为的其他方面，包括安装位置、执行所调用或依赖的其他文件、以及执行时采取的任何自动化或脚本化操作。这些细节有助于理解您网络上可能发现的其他恶意活动，并窥见攻击者的复杂程度，以及该恶意软件是独特的还是常见恶意软件家族的变体。
    |


    ### Internal enrichment information


    并非所有丰富信息都来自外部来源。内部丰富信息提供关于受损主机、用户或账户等的额外细节。需了解的内部信息包括以下内容（表 5-2）：


    **表 5-2. 内部丰富信息**


    | 类别 | 说明 |

    | --- | --- |

    | Business operations | 了解事件发生时您的网络和组织内发生的情况，有助于回答为何成为目标以及为何攻击成功的问题。您最近是否宣布了新合作伙伴关系？是否涉及新的合并或收购？这些重要细节有助于理解攻击性质，通常只能通过与组织内部人员交谈获得。
    |

    | User information | 识别被针对或受损的用户，有助于了解攻击者可能追求的信息（如果您尚未识别出被盗内容）。它还可提供攻击者战术的信息；例如，如果他们最初针对
    HR 员工，然后尝试转向权限更高的用户（如系统管理员）。 |


    ## Leverage Information sharing


    了解某指标是否曾被识别及识别时间，有助于将您的特定事件置于合理视角。您应在 Find 阶段识别出其中一些信息，但查看有何变化或是否有关于分析中使用的任何指标的新信息也很有用。


    此类及时、非公开信息的良好来源是与其他组织的共享关系。公开信息也有用，应用于分析，但信息共享组织可提供通常不进入公共领域的细节，包括指标被发现的具体时间、如何被识别、以及在哪个行业被发现。这些是许多组织不愿公开但常愿与合作伙伴组织共享的细节，尤其是当其他组织也在共享此类敏感信息时。存在正式的共享组织，如信息共享与分析中心（`ISACs`）、信息共享与分析组织（`ISAOs`）、公私合作伙伴关系和非正式团体。许多正式团体围绕行业或其他共同兴趣群体组织。在某些情况下，从共享组织获得的信息可用于检测恶意活动，但就分析事件而言，它也可作为丰富来源，帮助构建您正在分析的入侵的理解。


    一旦所有信息经过评估和丰富，便进入下一步：建立假设。

    '

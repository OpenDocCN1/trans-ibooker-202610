    # Strategic Intelligence in IDIR


    As we mentioned, strategic intelligence can be thought of as the logic behind
    a plan, and so the primary role of strategic intelligence in IDIR is often before
    or after an incident, rather than during, with a few exceptions.


    When leveraged before an incident, strategic intelligence can shape the response
    process itself, helping to identify how critical the response process is to an
    organization and whether there are any particular requirements to keep in mind
    - for example legal requirements about when and how to report the incident, and
    what type of data exposure warrants reporting. It can also help position defenses
    based off of an understanding of the strategic threat landscape and any significand
    world events that may have an impact on security.


    After an incident is the time when new information that was learned through the
    intelligence-driven incident response process is integrated into the existing
    understanding of the key questions that are often asked by leaders and executives,
    primarily things like:


    *   Who is targeting our organization?

    *   What are they after?

    *   How effective are we at preventing attacks?

    *   What is the impact of a successful intrusion?


    It is important to note that while it is critical to include information from
    your own incidents to update the answers to these questions, they can also be
    influenced by intrusions that have occurred elsewhere that you learned about via
    threat information sharing or media reporting. If you are basing updates to strategic
    intelligence on media reporting, however, it is important to make sure that you
    have enough insight into what happened and trust the validity of the reporting
    before making significant changes to the way your organization views threats.


    There are, as always, exceptions. While most often applied before and after, there
    are times when strategic intelligence can be directly leveraged during the incident
    response process. In these cases, analysts are often not generating strategic
    intelligence - after all the direct focus of incident response is often tactical
    in nature which requires a different way of activities. Throughout this chapter
    we’re discussing strategic intelligence, how threat intelligence can be used to
    help an organization’s leadership make better decisions, but many other security
    decisions benefit from decision support.


    ### Red Teaming


    The first way to use Intelligence beyond tactical/operational defensive operations
    is using it to inform adversarial operations. In red teaming an internal team
    acts as an adversary to challenge the intrusion detection and incident response
    teams. In many organizations the red team develops their own persona, often based
    on the red team’s engineers’ capabilities. If the team knows how to build zero
    days then the red team adversary will leverage zero days. If the red team engineers
    typically use the `Metasploit Framework` then the simulated adversary will use
    `Metasploit`. Even more complex is if the red team engineers know a programming
    language like `Python` then the adversarie’s tools will end up being written in
    `Python`.


    You might be noticing at this point that the only adversary we’ve talked about
    at this point is the artificial one. That’s the problem. Giving the defense an
    adversary to track and respond to teaches them how to track and respond to that
    simulated adversary. But if the simulate adversary isn’t similar enough to the
    real adversaries an organization faces then the defense won’t learn useful lessons.
    For example, if the red team uses `HTTP` beacons over `80/tcp` (because it’s easier
    to build or download sample remote access Trojans that just use well understood
    protocols like `HTTP`) but the organizations main adversary uses encoded in `DNS`
    then the tools, techniques, and procedures (yep, defense has `TTPs` too) the blue
    team develops responding to the red team may not be very effective.


    So what way would be better? Well, the most obvious approach is for red teams
    to act more like real adversaries. Unfortunately, most red teams don’t know what
    real adversaries act like. This is somewhat expected. Most red teamers migrate
    out of one of three other roles which explain their... lack of perspective (sorry
    red teamers!):


    **Application Security Analysts**


    They are focused on hunting through code for vulnerabilities. Some write fixes,
    some write exploits. Either way their approach is always going to be more focused
    on the vulnerability/exploit than how they’re really used in the real world.


    **Vulnerability Analysts**


    Most of these folks focus on using tools like scanners to understand where there
    are network vulnerabilities. They know how to interpret the outputs of these tools,
    but don’t understand the kinds of objectives adversaries are after or the stages
    after initial exploitation.


    **Former Offensive Engineers**


    While rare there are a small number of folks who were “real” offensive engineers.
    These folks, usually former government, have actually conducted intrusions. They
    do know what adversary tradecraft looked like, at least at one point in the past,
    but often can’t disclose it. Subconsciously they may emulate it, but not all nation
    state adversaries operate the same way, and chances are your new red teamers former
    employer is not your company’s current adversary (and if they are you may be in
    bigger trouble).


    The fact is most red teamers will welcome being more relevant and useful. Certain
    immature red team members think their job is *popping shells and* *pwning* *boxes*
    but most realize that red team is really just blue team with a different focus.
    The goal is to help defense be as effective as possible. By taking the time to
    share and review adversary profiles that your organization faces the red team
    can adjust their TTPs to better emulate the threats your defenses will actually
    face, such as testing more effectively, using more realistic tools, and even setting
    up a similar infrastructure. All of these things help your defense prepare better
    for their actual adversaries.


    ### Vulnerability Management


    Closely related to this is vulnerability management. Vulnerability management
    seeks to reduce attack surface by identifying, mitigating, and remediating vulnerabilities
    before an adversary can exploit them, usually by working with, or being a member
    of the organizations patching team.

    '

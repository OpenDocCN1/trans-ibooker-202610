- raw: '*Process models* illustrate the various actions and decision points that make
    up a structured process. Process models are especially important when conducting
    analysis as part of a team, as it helps keep people on the same page as they move
    through the analytic process. The cyber intrusion kill chain is another kind of
    process model. In Chapter 4, Chapter 5, and Chapter 6, it was used to capture
    indicators of a specific incident, but the kill chain can also be used to document
    the steps that an attacker takes at a more strategic level to assist in the development
    of the target model. There are two approaches to take when designing process models
    that support strategic analysis. You can either look at the often undocumented
    processes or SOPs (standard operating procedures) that you are already doing and
    build them out into a process, or you can look through examples of process models
    used in different types of analysis and pick one that best fits your way of operating
    and adopt it as your own. Either option is fine - process models are meant to
    be useful, not to dictate how you work, so do not feel that you need to change
    an already good process just to fit a model someone recommends. We have found
    however, that looking through models that others have developed does provide a
    good opportunity for reflection and optimization of existing methods.


    In addition to the kill chain, there are several other models that can be used
    as guides for developing a strategic intelligence process model. In 2020, after
    reviewing several process models in fields ranging from criminal psychology to
    meteorology, Nicole Hoffman introduced her model, *Cognitive Stairways of Analysis.*
    Nicole described her motivation for publishing her model in her [blog post](https://threathuntergirl.com/2022/11/01/the-cognitive-stairways-of-analysis/),
    “Everyone talks about analysis, but no one goes into detail about how to perform
    analysis”. The Cognitive Stairways model include “steps” that are taken by an
    analyst that follow a set pattern, however the pattern can be tweaked to fit whatever
    particular task you are undertaking. In her example for brainstorming - a key
    component of any type of analysis, she includes the following steps:


    1.  Brainstorm/Generate Hypothesis/Think Steps - this step will help you determine
    what you are going to focus your analysis on - similar to your intelligence requirements
    (though not always that specific)


    2.  Determine the Scope - identify the frame that you will focus on for your analysis
    - the context through which you will conduct your analysis.


    3.  Key Assumptions Check - what are the assumptions you will take with you into
    the analysis - making sure that the assumptions are valid before beginning, or
    they will need to be tossed out.


    4.  Compile Data/Quality of Information (QoI) check - Gather data relevant to
    the topic you are focusing on, while evaluating the source and completeness of
    the data.


    5.  Clean Data/Omit Useless Data - In order to properly use the data in analysis,
    it needs to be in a format and used with a taxonomy that will make it possible
    for you to both leverage and reference it within your analysis.


    6.  Exploratory Data Analysis (EDA)/Visualization and Regression - What does that
    data you have gathered tell you about a topic? Try not to focus too much on the
    general hypothesis or think steps you developed in step one - the goal of that
    step was to get you on the right path, but now you must look at the data, using
    visualizations and regressions if helpful, to understand what the data indicates.
    Findings in this step may require you to hop back down to step 4 again to gather
    more data, and that is perfectly fine.


    7.  Confirmatory - THIS is the step where you check your analysis and findings
    against your original think steps or hypothesis to come to an analytic judgement.


    8.  Disseminate - This is where you conclude your analysis and share your findings,
    which ideally includes updating any pre-existing target models that may be changed
    based on the new findings.


    ![](assets/strategic_intelligence_466966_04.png)


    Process models can take many forms, and the most important thing is that you have
    a process model that works for you, is documented, and can be leveraged by others.


    #### Timelines


    *Timelines* are linear models that show the time-based relationships between activities.
    Incident responders are most familiar with attack timelines that show when specific
    actions were taken during an incident, but many other timelines can be helpful
    in an incident-response situation. Understanding the timeline from vulnerability
    discovery to remediation is useful to help a network defender know how long they
    will remain vulnerable to a particular attack and can help decision makers determine
    when they will need to act. A timeline indicating when different actor groups
    were seen using a particular exploit or tool can help an analyst determine the
    threat from that malware, as well as understand how quickly or slowly tool-reuse
    propagates after a tool is identified.


    Visualizing the temporal aspects of various activities provides analysts with
    a framework for understanding how those aspects will impact their organization’s
    goals and objectives.


    # The Strategic Intelligence Cycle


    Chapter 2 covered the intelligence cycle pretty extensively, but the primary focus
    was on tactical and operational-level intelligence—following the cycle in order
    to respond to a specific and often immediate threat. At the strategic level, the
    intelligence cycle follows the same process, but each step (from setting requirements
    to dissemination) looks different than it does when dealing with an immediate
    threat. Let’s examine these differences.


    ## Setting Strategic Requirements


    It may seem that setting requirements at the strategic level would be more vague
    than with tactical intelligence. With tactical intelligence, there is a specific
    threat to focus on, which helps direct requirements. That is not often the case
    with strategic intelligence; and when requirements are passed down, they are often
    something vague like “Tell me what we need to know.” Although the scope and the
    time frame are much larger, the requirements should still be specific.


    Strategic requirements often follow the military concept of *commander’s intent*.
    Commander’s intent is what allowed large, dispersed units to make decisions about
    when and how to conduct operations. Using the models that were developed as part
    of the strategic process, the commander, or the CEO or CISO, can state their goal
    or objective (a.k.a intent) and trust that all decision makers are on the same
    page and will take actions that will support that objective without the need to
    micromanage. For example, if the intent is to ensure that a company is first-to-market
    with a new product, then making sure that the manufacturing schematics, marketing
    plans, and other sensitive information are not leaked is a task that would fall
    under the commander’s intent. Developing a model of the attackers who may target
    that sensitive information is a strategic intelligence requirement that is necessary
    to support the ability to protect that information.'

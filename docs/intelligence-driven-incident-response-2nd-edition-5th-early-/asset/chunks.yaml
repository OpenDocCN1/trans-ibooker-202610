    # Threat Intelligence Frameworks


    ## MITRE ATT&CK


    Mitre’s Adversary Tactics, Techniques, and Common Knowledge (ATT&CK) was created
    in 2013 with the goal of categorizing attacker behaviors throughout the attack
    lifecycle and was originally focused on attacks against Microsoft Windows. It
    focused on tactics - which were described as short-term, tactical adversary goals
    of an attack, and techniques - which were the means through which adversaries
    achieved their tactical goals.(ref to [https://www.mitre.org/sites/default/files/publications/pr-18-0944-11-mitre-attack-design-and-philosophy.pdf](https://www.mitre.org/sites/default/files/publications/pr-18-0944-11-mitre-attack-design-and-philosophy.pdf))
    Since then it has grown to include attacks against Linux and MacOS, along with
    additional matrices describing pre-exploitation activity (PRE-ATT&CK), mobile
    platforms (Mobile ATT&CK), as well as Industrial Control Systems, Cloud Systems,
    even Containers like Docker and Kubernetes.


    The ATT&CK object structure includes tags, fields, and relationships. Tags are
    data points that can be used to filter or pivot off of; fields are used for free
    text to describe different tactics or techniques, and relationships are fields
    that define the relationship between different entities.


    The model and its relationships can be seen in the image below ([Figure 4-1](#ch04.html#att_ck_model_relationships)).
    Each entity, Adversary Group, Techniques, Tactics, and Software all have their
    own fields that can be used to capture additional relevant information, making
    ATT&CK a model that can be used to capture both tactical and strategic information.


    ![](assets/exploit_403850_01.png)


    ## VERIS


    The Vocabulary for Event Recording and Incident Sharing (VERIS) is a JSON-based
    standard that is well-known for supporting the Verizon Data Breach Incident Report
    (DBIR). The VERIS framework captures information that falls into four categories,
    known as the Four A’s: Actor, Asset, Action, and Attribute, all of which answer
    a question about the incident.


    **Actor**: The Actor field answers the question, “Whose actions affected this
    asset?” This field captures high-level information about the actors responsible
    for an incident. The data schema enumerations for Actor include whether the actor
    is an internal, external, or partner actor, as well as the actor’s motivation.


    **Action**: The Action field answers the question, “What actions affected the
    asset?” Action includes things such as how the attackers were able to get access,
    including the use of malware, hacking, or social engineering. It also includes
    the specific vector, such as exploiting a known vulnerability, or using phishing
    emails.


    **Asset**: This field answers the question, “Which assets were affected?”—an incredibly
    important question to answer from a strategic perspective. The enumerations include
    information about the type of asset affected, as well as information about its
    accessibility and management.


    **Attribute**: The Attribute field answers the question, “How was the asset affected?”
    It uses the traditional Confidentiality, Integrity, Availability triad.


    VERIS also captures information about the timeline and impact of an incident.
    These fields provide places to capture how long it took to identify, contain,
    and remediate an incident and how severe the impact is for the organization affected.


    The primary use case for VERIS is not generating rules or alerts, but for helping
    organizations understand the risks that they face. Therefore, the information
    is not as detailed nor as technical as the information that is captured in STIX
    or the formats that we mentioned previously. However, it can be used to tell a
    more complete story of what happened in a particular incident.


    ## CAPEC


    The Common Attack Pattern Enumeration and Classification (CAPEC) framework was
    originally designed to help with the development of secure software. The concept
    behind CAPEC is that if software developers were able to understand the common
    ways in which attackers targeted and exploited software, they would be able to
    design and build software that is not susceptible to those attacks. Rather than
    just capturing specific technical details, CAPEC attempts to capture the entirety
    of an attack as an attack pattern, which includes information on attack prerequisites,
    related weaknesses, related vulnerabilities, and attacker steps.


    An organization can learn a great deal from an attack when a clear picture of
    what happened is available and is captured in CAPEC. An analysis of attack patterns
    over time can provide an understanding of the way attackers operate, the way they
    adapt to security measures, and any additional measures required to protect an
    organization.


    # Process for Extracting


    Once you have identified the format you want (or need) to capture data in and
    where you will store it, it is important to develop a process for extracting all
    the relevant information. This is the part of the Exploit phase where the rubber
    meets the road. While we wish we could spend this section outlining the exact
    step-by-step process that you should use, the truth is that like everything else
    in cyber threat intelligence, there are unique components to every CTI program
    that will make these processes vary case by case. We are instead going to outline
    the process for developing a process, with the goal of helping you outline something
    that will work for you long term and that you can easily modify if your needs
    change.


    ## Step 1: Identify Your Goals


    Be as specific as you can be here, don’t just say “our goal is to manage the data
    from the incident” although it can be a good start. A clear goal would include
    the intended outcome of the exploit phase, who it will be supporting, and the
    intended impact. *“Capture all information - including IOCs, TTPs, target information,
    and strategic information in a spreadsheet with an executive summary of the incident
    so our current team of 5 intelligence analysts can further analyze and make additional
    recommendations for detections and mitigations.”* Written out like this, a goal
    becomes a roadmap for the process that you will follow.


    ## Step 2: Identify Your Tools


    We use the term “tools“ here very lightly. A tool is anything that is going to
    help you achieve the goals we outline in step one. Some organizations have threat
    intelligence platforms (or TIPs, covered later in this chapter), which may have
    built-in functionality like automated indicator extraction and categorization.
    If you don’t have a TIP there are still many other resources that can be used
    to help, including scripts, spreadsheets, non-TIP databases, and productivity
    and collaboration tools. At this stage you should also call out whether or not
    you have the right tools to achieve the goal you laid out - for example, if the
    goal involves sharing information with a team of five analysts, you will need
    some sort of collaboration tools. If you do not have any tools that will facilitate
    sharing information, then you will have a very difficult time meeting that goal.


    ## Step 3: Identify the System or Process You Will Use


    This can be the most diverse step out of these three because there are so many
    different ways that an analyst can start to get data into the tools needed to
    achieve the Exploit goals identified in step 1. Approaching this undertaking in
    a systematic, ideally documented fashion is the best way to make sure that it
    is done completely and there isn’t information missed or overlooked in the process.
    One process may involve the following tasks:


    * Identify the location of all data sources that will be aggregated as part of
    the Exploit process.

    * Create a checklist of all of the sources to keep track of what has been exploited.


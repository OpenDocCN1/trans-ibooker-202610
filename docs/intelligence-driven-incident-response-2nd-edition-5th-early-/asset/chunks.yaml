    \ structures as you have team members, do not fret. The Exploit process will help\
    \ you get things in order so that you can learn and adapt moving forward.\n\n\
    Depending on how you manage your incident-response data, it is entirely possible\
    \ that the most difficult part of the Exploit phase will be finding the important\
    \ bits of intelligence from the investigation. When it comes to gathering incident-response\
    \ data, we have seen it all—from elaborate systems, to Excel spreadsheets, to\
    \ Post-It notes with IP addresses stuck to a whiteboard. There is no wrong way\
    \ to gather that data, but if you want to be able to extract it so that it can\
    \ be analyzed and used in the future, there are certainly some ways to make the\
    \ process easier.\n\nWhen you are dealing with exploiting information from a previous\
    \ incident, you are often limited in the data that you have available. One of\
    \ the goals of intelligence-driven incident response is to ensure that the incident-response\
    \ process captures the information needed for intelligence analysis, but if you\
    \ are just beginning the process of integrating operations and intelligence, you\
    \ may not have been able to influence what information was gathered (yet). A good\
    \ starting point for the Exploit phase is to understand exactly what you have\
    \ available. We have found that the information that is currently available usually\
    \ falls into one of two categories: high-level information, and technical details\
    \ such as malware analysis.\n\nIf you have only high-level information in the\
    \ form of a narrative about the incident, you will be looking at extracting strategic-level\
    \ details. If you have access to detailed malware analysis, you can extract tactical-level\
    \ details about the malware’s functionality. Initially, you may have access to\
    \ only one level of information or the other, but ideally, as you implement this\
    \ process in your organization, you will be able to gather both the technical\
    \ details of an incident as well as the strategic information on the information\
    \ targeted and what the impact was. Being able to combine information across all\
    \ the levels is one of the things that makes intelligence most powerful.\n\n##\
    \ Information Gathering Goals\n\nThe first thing to consider when gathering data,\
    \ no matter what the source, is what are your goals. These come in an interesting\
    \ variety, but the most common ones are:\n\n**Indicators of Compromise**  \nEveryone\
    \ always wants to say indicators of compromise aren’t useful anymore, but even\
    \ the best adversaries don’t always change everything. While there may be more\
    \ durable methods of tracking adversaries you’d be making a mistake not to pull\
    \ even the IOCs at the bottom of the Pyramid of Pain and adding them to your pile\
    \ of threat data.\n\n**Signatures**  \nWhile not always available, depending on\
    \ the product, you may be able to pull out even more advanced compound indicators\
    \ in the form of signatures. Snort and Yara are most common, and it will often\
    \ depend on your tech stack, but even product specific signatures can be translated\
    \ into other tools.\n\n**Tactics, Techniques and Procedures**  \nWhile not quite\
    \ as atomic, another common approach after the rise of ATT&CK, is to pull out\
    \ how an adversary operates in the form of TTPs.\n\n**Strategic Data**  \nThis\
    \ is a bit fuzzier, but in a lot of cases, especially reading 3rd party data,\
    \ it’s the non-technical data that is most interesting. Information about attribution\
    \ and adversary motivation can be harder to capture but is often very high value.\n\
    \nSo where do we pull this data from?\n\n## Mining Previous Incidents\n\nIf you\
    \ are reading this book with the intention of understanding how to start integrating\
    \ operations and intelligence, it is important to note that you don’t have to\
    \ start with the next incident; you can go back through previous incidents and\
    \ exploit that information. In fact, this type of activity is a great way to familiarize\
    \ people in your organization with the F3EAD process and help them feel comfortable\
    \ with it as you build your threat profile. Digging through and analyzing previous\
    \ incident data can give you a great idea of the types of threats facing your\
    \ network and identify the visibility or information gaps you may need to address\
    \ as you move forward. Whenever possible (and hopefully it is always possible)\
    \ include dates and date ranges when mining information from previous incidents.\n\
    \n## Gathering External Information (aka Conducting a Literature Review)\n"
  trans: "\n*   **支持信息** - 入侵的非技术性或战术性细节 - 谁被攻击了，公司内部（或世界上）发生了什么可能促使了这次入侵。影响是什么？\n\
    *   **链接或参考** 指向与事件或对手相关的信息，这些信息被共享、公开可用，或在调查过程中被用作参考。\n*   **采取的内部行动或提出的请求**\
    \ - 一个绝不能忽视的非常重要的方面是针对事件采取了什么响应措施，以及为未来提出了哪些额外行动请求。例如，如果事件响应报告指出，更频繁地监控地下论坛上的公司凭证将防止未来发生类似攻击，那么该建议（甚至可能是承诺！）不应在事后被遗忘。\n\
    \n在决定应利用什么信息后，有必要从事件数据中提取该信息、将其标准化，并存储起来以供未来分析和参考。这将需要一个流程 - 理想情况下是一个有文档记录且可与他人共享的流程，以便日后能够重复和改进。流程因团队而异，然而所有以利用为重点的流程都应具备几个关键组成部分：收集信息、存储信息和管理信息。\n\
    \n# 收集信息\n\n如果你的组织像我们见过的大多数组织一样，在调查结束时，你会有一份“官方毁灭电子表格”（外加五六个非官方版本）、十三个笔记文件、几张白板照片，以及一个塞满假设、外部文档链接和各种“我们以后再跟进这个”的评论的\
    \ Slack 频道。这与我们见过的最优秀的流程驱动型团队的区别在于，更先进的团队会在过程中定期清理整理 - 我们从未见过、遇到过，甚至听说过哪个团队在激烈的事件中间没有某种混乱、富有创造力但有效的流程。如果你面对着一座由无序数据组成的大山，其结构之多与团队成员数量相当，请不要烦恼。利用流程将帮助你理清头绪，以便你能够向前学习和适应。\n\
    \n根据你管理事件响应数据的方式，利用阶段最困难的部分完全可能是从调查中找到重要的情报碎片。在收集事件响应数据方面，我们什么都见过 - 从精心设计的系统，到\
    \ Excel 电子表格，再到贴在白板上带有 IP 地址的便利贴。收集这些数据没有错误的方式，但如果你想能够提取它们以便将来分析和使用，当然有一些方法可以让这个过程更轻松。\n\
    \n当你处理从以往事件中利用信息时，你通常受限于现有的可用数据。情报驱动事件响应的目标之一是确保事件响应流程捕获情报分析所需的信息，但如果你刚开始整合运营和情报的流程，你可能还无法影响收集了什么信息（目前）。利用阶段的一个良好起点是准确了解你到底有什么可用。我们发现，目前可用的信息通常分为两类：高层级信息，以及恶意软件分析等技术细节。\n\
    \n如果你只有以事件叙述形式呈现的高层级信息，你将着眼于提取战略层面的细节。如果你有详细的恶意软件分析，你可以提取关于恶意软件功能的战术层面细节。最初，你可能只能访问其中一层信息，但理想情况下，随着你在组织中实施此流程，你将能够同时收集事件的技术细节以及所针对信息和影响的战略信息。能够跨所有层级组合信息是情报最强大的体现之一。\n\
    \n## 信息收集目标\n\n无论数据来源是什么，收集数据时首先要考虑的是你的目标是什么。这些目标种类繁多，但最常见的有：\n\n**失陷指标**  \n\
    大家总爱说失陷指标没用了，但即使是最优秀的对手也不总是改变一切。虽然可能有更持久的追踪对手的方法，但如果你不把痛苦金字塔底部的 IOC 拿出来加到你的威胁数据堆里，那你就犯错了。\n\
    \n**特征签名**  \n虽然并不总是可用，取决于产品，但你可能能够以特征签名的形式提取更高级的复合指标。Snort 和 Yara 最常见，这通常取决于你的技术栈，但即使是特定产品的签名也可以转换为其他工具使用。\n\
    \n**战术、技术与程序**  \n虽然不那么原子化，但在 ATT&CK 框架兴起后，另一种常见方法是以 TTP 的形式提取对手如何运作。\n\n**战略数据**\
    \  \n这有点模糊，但在很多情况下，尤其是阅读第三方数据时，非技术性数据往往最有趣。关于归因和对手动机的信息可能更难捕获，但通常价值极高。\n\n那么我们从哪里提取这些数据呢？\n\
    \n## 挖掘以往事件\n\n如果你阅读本书是为了了解如何开始整合运营和情报，重要的是要注意，你不必从下一个事件开始；你可以回溯以往的事件并利用那些信息。事实上，这种活动是让组织中的人员熟悉\
    \ F3EAD 流程、并在构建威胁画像时帮助他们对其感到舒适的好方法。挖掘和分析以往的事件数据能让你很好地了解面临网络的威胁类型，并识别出你在前进过程中可能需要解决的可见性或信息差距。只要可能（希望总是可能），在从以往事件中挖掘信息时，请包含日期和日期范围。\n\
    \n## 收集外部信息（即进行文献综述）\n"

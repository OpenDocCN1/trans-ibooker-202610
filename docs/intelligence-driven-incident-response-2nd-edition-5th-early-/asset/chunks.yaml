  trans: '

    这些操作 + 情报模型不必局限于安全运营中心（SOC）和情报团队。同样的流程也可用于漏洞管理和应用安全（AppSec）团队。例如，当应用安全团队发现新漏洞时，该漏洞可被视为一条情报。无法保证应用安全工程师是发现该漏洞的第一人。因此，AppSec
    团队会向 SOC 提供尽可能多的信息，SOC 随即开始寻找针对该漏洞的过往攻击迹象。


    # 选择合适的模型


    模型的目的是提供一个框架，用于解读信息并生成情报。请记住乔治·博克斯的名言：“所有模型都是错的，但有些是有用的。”有数百种可用于情报分析的模型，还可以从其他学科（如军事冲突理论和执法^(4)）中引入更有用的模型。其中一些模型旨在通用，另一些则是为个人或特定用例开发的。在决定使用哪种模型时，有几个因素需要牢记。可用的分析时间有助于确定哪种模型合适。如果有时间进行深入分析或事件分析，钻石入侵分析模型可能效果很好。如果有时间限制，可以使用
    OODA 循环等模型来驱动决策。信息类型也可能决定哪种模型最合适，因为某些模型是为特定数据源（如 NetFlow 或端点数据）设计的。最后，可能取决于分析师的偏好。如果分析师发现某个模型在其流程中效果良好，则完全可以继续使用该模型。甚至可能会出现开发新模型成为最佳选择的情况。


    # 场景：ROAD RUNNER（大路奔跑者）


    现在我们已经学习了许多关键模型，你需要了解情报驱动的事件响应。我们即将深入事件响应、网络威胁情报的实际核心细节，以及它们如何协同工作以帮助你保卫组织。


    本书其余部分将采用联合行动/情报模型 F3EAD，并辅以特别适合情报驱动型事件响应的额外分析模型和框架进行编排。在演示此过程时，我们将使用我们对 Road
    Runner 的自行调查，这是我们在本章前面首次了解到的以选举为重点的活动的代号。我们认为这是威胁主体 Grey Spike（灰色尖刺）的最新任务，且他们正积极以我们的组织及其他组织为目标。利用该对手及相关活动，我们将贯穿
    F3EAD 流程。


    ## Find（发现）


    下一章将介绍我们如何主动和被动地锁定对手，以收集支持 F3EAD 流程其余部分所需的信息。我们将评估我们从以往组织内部事件以及外部共享信息中了解到的关于 Road
    Runner 的情况。


    ## Fix（锁定）


    此阶段可视为调查阶段，涉及在受害者环境中追踪对手。在此，我们将在网络中主动狩猎 Road Runner 活动，谁知道呢，我们甚至可能发现之前未知的其他对手迹象！


    ## Finish（终结）


    一旦识别出所有对手活动，终结阶段将把对手从环境中清除。


    ## Exploit（开发利用）


    事件响应流程结束后，我们将开始开发源自我们事件响应流程的数据，以便汲取经验教训和洞见。我们已经知道 Road Runner 行动是由资金充足且持久的对手实施的，我们需要积极努力防止他们重新获取对我们信息的访问权限。这始于尽可能多地了解他们的活动。


    ## Analyze（分析）


    接下来，我们将把这些数据转化为情报，以便在未来保护我们的组织，并帮助可能面临类似入侵或相同对手的其他人。


    ## Disseminate（分发）


    开发出情报后，我们将其制作成多种实用格式，面向多类受众，以便从该流程中获得最大可能的效用。


    最后，我们将形成一套完整的产品，深度拆解名为 Road Runner 的活动。


    # 结论


    事件响应等复杂流程通常受益于模型的使用，模型为流程提供结构，并可定义任务完成所需的必要步骤。确定应使用哪些模型取决于具体情况、可用数据，在许多情况下还取决于分析师的偏好。你对这些模型及其应用越熟悉，就越容易针对不同事件确定应使用哪些模型。


    现在，让我们深入 Find 阶段！


    # 参考资料


    ^(1) [`www.wired.com/2014/11/countdown-to-zero-day-stuxnet/`](https://www.wired.com/2014/11/countdown-to-zero-day-stuxnet/)


    ^(2) [`www.nytimes.com/2021/12/05/us/politics/us-military-ransomware-cyber-command.html`](https://www.nytimes.com/2021/12/05/us/politics/us-military-ransomware-cyber-command.html)


    ^(3) [`smallwarsjournal.com/jrnl/art/f3ead-opsintel-fusion-“feeds”-the-sof-targeting-process`](https://smallwarsjournal.com/jrnl/art/f3ead-opsintel-fusion-%E2%80%9Cfeeds%E2%80%9D-the-sof-targeting-process)


    ^(4) [`github.com/juanandresgs/papers/blob/master/VB2018-Guerrero-Saade-FINAL.pdf`](https://github.com/juanandresgs/papers/blob/master/VB2018-Guerrero-Saade-FINAL.pdf)


    # 第 4 章 开发利用


    > “如果你只关注敌人，你将忽视威胁。”

    >

    > —— Walter Piatt 上校


    此时，通常会交付最终的事件响应报告，响应人员转而处理下一项需要关注的事务，但本书并未就此结束。在整个调查过程中，事件响应团队收集了大量关于攻击者的数据，在其网络内查找额外信息，并采取了影响攻击者行动的措施。现在，我们需要收集所有这些数据，分析其情报价值，并将其整合到不仅包括检测和预防方法，还包括风险评估、工作优先级排序和未来安全投资等更具战略层面的举措中。要达到能做所有这些事情的程度，你必须启动
    F3EAD 循环的情报部分：开发利用、分析和分发。


    '

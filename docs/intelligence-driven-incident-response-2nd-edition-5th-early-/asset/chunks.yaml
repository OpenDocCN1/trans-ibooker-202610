    These operations + intelligence model doesn’t need to be limited to the SOC and
    intelligence teams. This same process can be used with the vulnerability management
    and application security (AppSec) teams. For example, when the application security
    team finds a new vulnerability, that vulnerability can then be treated as a piece
    of intelligence. Nothing guarantees the application security engineer was the
    first person to find this vulnerability. Thus, the AppSec team feeds as much information
    as possible to the SOC, which begins looking for any indications of previous attacks
    against that vulnerability.


    # Picking the Right Model


    The purpose of models is to provide a framework that can be used to interpret
    information and generate intelligence. Keep in mind the quote by George Box: “All
    models are wrong, some are useful.” Hundreds of models are available for intelligence
    analysis, and more useful ones can be pulled from other disciplines, such as military
    conflict theory and law enforcement^([4](#ch03.html#idm46530557100800)). Some
    of these models are meant to be general purpose, and some have been developed
    for individual or specific use-cases. When deciding what model to use, there are
    several factors to keep in mind. The time available for analysis can help determine
    which model is appropriate. If there is time to conduct an in-depth analysis or
    an incident, the diamond model for intrusion analysis may work well. If you have
    time constraints, something like the OODA loop can be used to drive decisions.
    The type of information may also dictate which model is most appropriate, as some
    models are designed to be used with certain data sources such as netflow or endpoint
    data. Finally, it may all come down to analyst preference. If an analyst has found
    that a certain model works well within their processes, then by all means continue
    to use that model. There may even come a time when the best option is to develop
    a new model.


    # Scenario: ROAD RUNNER


    Now that we’ve worked through many of the key models, you’ll need to understand
    intelligence-driven incident response. We’re about to launch into the practical
    nuts and bolts of incident response, cyber threat intelligence, and how they can
    work together to help you defend your organization.


    The rest of the book is laid out using the joint operations/intelligence model
    F3EAD augmented with additional analytic models and frameworks that are especially
    well suited for intelligence-driven incident response. As we work through this
    process, we’ll use our own investigation into Road Runner, which is the name we
    have given to the election-focused activity we first learned about earlier in
    the chapter. We believe that this is the most recent tasking of the actor Grey
    Spike, and that they are actively targeting our organization as well as others.
    Using this adversary and related activity, we will move through the F3EAD process.


    ## Find


    The next chapter introduces how we target adversaries, both proactively and reactively,
    to gather the information that we need to support the rest of the F3EAD process.
    We will evaluate what we know about Road Runner both from previous incidents in
    our organization, along with information shared from external parties.


    ## Fix


    This phase can be thought of as the investigation phase, which involves tracking
    an adversary in the victim’s environment. Here we will actively hunt for Road
    Runner activity in our networks, and who knows, we may even find signs of additional
    adversaries we didn’t know about before!


    ## Finish


    Once all adversary activity has been identified, the Finish Phase removes an adversary
    from the environment.


    ## Exploit


    Once the incident-response process is over, we’ll start developing data that resulted
    from our incident response process so that we can derive lessons and insight.
    We already know that the Road Runner campaign is being carried out by a well-funded
    and persistent adversary, we will need to actively work to prevent them from regaining
    access to our information. That starts with understanding as much as we can about
    their activities.


    ## Analyze


    Next, we’ll develop that data into intelligence that can be useful for protecting
    our organization going forward and helping others who may be dealing with similar
    intrusions or the same adversary.


    ## Disseminate


    After developing the intelligence, we’ll put it into a variety of useful formats
    for a variety of customers, so that the most possible use can be derived from
    the process.


    By the end, we’ll have developed a full set of products, breaking down the activity
    known as Road Runner.


    # Conclusion


    Complex processes such as incident response often benefit from the use of models,
    which give the processes structure and can define necessary steps for task completion.
    Determining which models should be used depends on the situation, the data available,
    and in many cases the analyst’s preference. The more familiar you become with
    these models and their applications, the easier it will be to determine which
    models to use in response to different incidents.


    Now let’s dive into Find!


    # References


    ^([1](#ch03.html#idm46530557019536-marker)) [https://www.wired.com/2014/11/countdown-to-zero-day-stuxnet/](https://www.wired.com/2014/11/countdown-to-zero-day-stuxnet/)


    ^([2](#ch03.html#idm46530557114624-marker)) [https://www.nytimes.com/2021/12/05/us/politics/us-military-ransomware-cyber-command.html](https://www.nytimes.com/2021/12/05/us/politics/us-military-ransomware-cyber-command.html)


    ^([3](#ch03.html#idm46530557116704-marker)) [https://smallwarsjournal.com/jrnl/art/f3ead-opsintel-fusion-“feeds”-the-sof-targeting-process](https://smallwarsjournal.com/jrnl/art/f3ead-opsintel-fusion-%E2%80%9Cfeeds%E2%80%9D-the-sof-targeting-process)


    ^([4](#ch03.html#idm46530557100800-marker)) [https://github.com/juanandresgs/papers/blob/master/VB2018-Guerrero-Saade-FINAL.pdf](https://github.com/juanandresgs/papers/blob/master/VB2018-Guerrero-Saade-FINAL.pdf)


    # Chapter 4. Exploit


    > “If you focus solely on the enemy, you will ignore the threat.”

    >

    > Colonel Walter Piatt


    At this point it is common for the final incident-response report to be delivered
    and the responders to move on to the next matter requiring their attention, but
    that is not where this book ends. Throughout the course of the investigation,
    incident response teams gather a lot of data on our attackers, look for additional
    information from within their networks, and take actions that have an impact on
    the attacker’s operations. Now we need to gather all of that data, analyze it
    for intelligence value, and integrate it into not only detection and prevention
    methods, but also more strategic-level initiatives such as risk assessments, prioritization
    of efforts, and future security investments. To get to the point where you can
    do all these things, you have to engage the intelligence portion of the F3EAD
    cycle: Exploit, Analyze, and Disseminate.


- raw: "To facilitate this process, F3EAD^([3](#ch03.html#idm46530557116704)) uses\
    \ a modified version of a combined intelligence and operations cycle: Find, Fix,\
    \ Finish, Exploit, Analyze, Disseminate. As you’ll see, this means going through\
    \ the incident-response cycle and feeding the results into the intelligence cycle,\
    \ and then connecting those results back into a new incident-response cycle.\n\
    \n## Find\n\nThe *Find* phase includes the *targeting* phase of the operation,\
    \ which is where you determine the threats that you will address. This can come\
    \ from many sources, such as intelligence from a vendor or open source. Ideally,\
    \ your own previous intelligence cycles should feed this process as well. Depending\
    \ on the operation or investment, this phase may be determined by the IR team\
    \ itself, in conjunction with the intelligence team, or even working with groups\
    \ outside these teams, such as the SOC or management. This parallels the Preparation\
    \ phase of the incident-response cycle.\n\n## Fix\n\nBased on the information\
    \ from the Find phase, the *Fix* phase establishes telemetry and determines where\
    \ an adversary is on the network as well any external presence we can detect.\
    \ Just to be clear, *fix* does not mean to repair (we were confused too!); it\
    \ refers to the identification of the operational presence of the adversary within\
    \ the network. This involves taking available information and figuring out which\
    \ systems, services, or resources an adversary may have compromised, what their\
    \ channels of communications are, and how they’re moving around your network.\
    \ We can think of this as the Identification phase of the incident-response cycle.\n\
    \n## Finish\n\nThe *Finish* phase includes the actual incident-response action\
    \ (as opposed to the more kinetic and lethal actions intended for the original\
    \ military version of this process—please do not do these). This is when you take\
    \ decisive action against the adversary, carrying out the containment, mitigation,\
    \ and eradication phases of the incident-response cycle.\n\nThe major transition\
    \ in F3EAD is that the conclusion of the IR operation doesn’t end the cycle. Whether\
    \ the organization shifts resources and responsibilities between teams or the\
    \ same team changes its own activity focus, the end of the Finish phase starts\
    \ the beginning of the Exploit phase. The intelligence half of the F3EAD process\
    \ then begins.\n\n## Exploit\n\nThe *Exploitation* phase roughly maps to the collection\
    \ phase of the intelligence cycle, with one primary difference being that this\
    \ phase is laser-focused on information gathered from the adversary during the\
    \ operational phases of the cycle. Some of the information that is especially\
    \ useful for intelligence-driven incident response includes:\n\n*   Any indicators\
    \ of compromise, including IP addresses, URLs, hashes, and email addresses\n\n\
    *   Automated enrichment for the IOCs (such as getting reverse DNS for given IP\
    \ addresses or gathering WHOIS data)\n\n*   Exploit delivery samples\n\n*   Malware\
    \ samples\n\n*   Common vulnerabilities and exposures (CVE) and exploits\n\n*\
    \   User and incident reports\n\n*   Communications from the adversary\n\n*  \
    \ Previously identified TTPs\n\n*   Adversary objectives, goals, and motivations\n\
    \nIt’s impossible to list everything that might be useful, but analysts should\
    \ collect as much information as they can about the various phases of the attack.\
    \ Think through the kill chain and try to collect information about each stage\
    \ where possible.\n\n## Analyze\n\nThe Analyze phase maps to (surprise) the Analyze\
    \ phase of the intelligence cycle. During this phase, the idea is to assess what\
    \ the collected information is telling us about both short term and long term\
    \ implications on the activity. This is achieved through a few methods:\n\n* \
    \  Summarizing tactics, techniques, and procedures\n\n*   Putting data into models\
    \ or frameworks for further analysis\n\n*   Interpreting timelines and kill chains\
    \ to derive actionable recommendations\n\nLike the general intelligence phase,\
    \ the Analyze phase itself is cyclical. Malware analysis may lead to more IOCs,\
    \ which themselves can be enriched, and may lead to finding more malware. The\
    \ overall goal is to develop a complete picture of the actor and their tactics,\
    \ techniques, and procedures, with a focus on how to detect, mitigate, and remediate\
    \ their actions.\n\n## Disseminate\n\nIntelligence is only useful when it gets\
    \ to the right audience in the right format, with enough time for it to be absorbed\
    \ and actioned. Dissemination is not just pushing information out - it is identifying\
    \ what information is needed by decision makers, delivering it in a way that they\
    \ can consume, and being available to answer questions or accepted follow-up requests\
    \ for information. Dissemination of intelligence is focused primarily on the audience,\
    \ not on how the individual analyst prefers to operate. Because of this it is\
    \ critical to understand the audience, which typically fall into one of the following\
    \ categories:\n\nTactical\n\n: \n\nThe most immediate audience for the intelligence\
    \ is the incident-response team, feeding back into the beginning of the next F3EAD\
    \ cycle. They’ll want a focus on IOCs and summarized TTPs.\n\nStrategic\n\n: \n\
    \nIt generally takes only one significant incident for management to start having\
    \ a strong investment and interest in the IR and threat intelligence teams. Their\
    \ interest will be in highly generalized TTPs (more focused on campaigns than\
    \ individual incidents) and actions on target. This intelligence should be useful\
    \ to decision makers in future resource allocation and larger business planning\
    \ (for example, informing risk assessments).\n\nThird party\n\n: \n\nMany organizations\
    \ participate in some form of threat intelligence sharing group. Each organization\
    \ has to determine its own rules of engagement for participating. Work with your\
    \ leadership and legal teams to determine the best methods to do that. This may\
    \ include intelligence from any level of abstraction, depending on your goals\
    \ and appetite for collaboration.\n\nRegardless of the level of intelligence or\
    \ the audience you are addressing, you will want the information you disseminate\
    \ to be clear, concise, accurate, and actionable.\n\n## Using F3EAD\n\nF3EAD is\
    \ one of the most powerful concepts that can be implemented to improve both the\
    \ threat intelligence and incident-response side of security operations. It’s\
    \ also one of the most difficult. It’s hard to explain why an arcane Special Forces\
    \ acronym that most people don’t even know how to say should be a part of an IT\
    \ department’s standard operating procedures, but it provides a key missing piece:\
    \ how operations can lead to better intelligence, and vice versa.\n\nWhen thinking\
    \ about what this looks like, rather than focus on the details, focus on the overall\
    \ concept: security operations and incident response become an input to threat\
    \ intelligence, and threat intelligence becomes an input to security operations\
    \ and incident response. Whenever any part of the security operations team (whether\
    \ that’s a SOC, CIRT, or individual engineers) completes an incident response,\
    \ all of their outputs and documentation, notes, forensic artifacts, malware,\
    \ and research should be passed on to the intelligence team. From there, the intelligence\
    \ team exploits and analyzes this information. Their output based on that incident\
    \ should be provided back to the ops team, and then the cycle continues. This\
    \ ends up forming a kind of security operations/threat intelligence OODA loop\
    \ – Observe, Orient, Decide, Act, The faster the security ops team can use this\
    \ intelligence, the faster they can complete their operations tasks, which in\
    \ turn drives more intelligence."

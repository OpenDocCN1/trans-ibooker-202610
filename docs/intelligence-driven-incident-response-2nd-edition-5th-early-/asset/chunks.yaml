    ### 锚定偏差


    在锚定偏差中，分析师往往会过度依赖或更看重他们听到的第一条信息。任何后续信息或证据都会与该初始证据进行比较，分析师往往会无意识地争论新证据是支持还是反驳第一条证据，从而使该第一条信息成为调查的核心。如果分析师在分析入侵事件的过程中被告知“我们认为是俄罗斯干的”，那么每一条证据都会影响他们对“是否为俄罗斯”的判断，而这实际上并不是分析师本应回答的问题。锚定偏差是一些专家（如
    [Robert M. Lee](http://www.robertmlee.org/tag/attribution/)）认为真正的归因（归因于特定政府或民族国家）会使分析师更难开展工作的原因之一，因为这种归因成为了他们判断的依据（锚点），而不是分析中可纳入的有用证据。同样，经历聚焦需求和实际提问是什么、建立假设、评估关键假设的过程，应有助于分析师考量并对抗锚定偏差。


    ### 可得性偏差


    在可得性偏差中，会过分强调可获得的信息，无论该信息本身是否已被分析。Richard Heuer 称这种偏差为“生动性标准”，意指你亲身经历或最熟悉的信息会变得比你不太熟悉的信息更重要。这也被称为“我认识个家伙”偏差，例如：“我认识个家伙，每天抽一包烟，活到了
    100 岁；所以抽烟没那么坏。”“我认识个家伙”偏差的新版本是“我在网上看到的”偏差。


    事件响应人员和情报分析师尤其需要意识到这种偏差，因为这会让他们以往的经验起反作用而非助益。如果他们因为以前见过而专注于最熟悉的特定证据，那么他们可能会过分看重那一点，或低估其他他们不太熟悉的证据。


    ### 随大流效应


    随大流效应发生在：随着同意某假设的人越来越多，该假设看起来更可能为真。虽然证据分析后达成的群体共识有一定道理，但偏差出现在这种判断发生在分析之前，或者“他人支持该假设”这一事实成为相信该假设为真的依据时。随大流效应背后有一些有趣的心理机制，因此很难克服，但重要的是要注意，“因为大家都这么说”不是将假设标记为准确的有效理由。如果有证据支持群体共识，重要的是看证据，而不是看大家都同意这一事实。


    Heuer 还提到“过度敏感于一致性”，并写道：“信息可能仅因为高度相关或冗余而保持一致，在这种情况下，许多相关报告可能不比单份报告更有信息量。”为克服此问题，Heuer
    建议分析师确保熟悉先前分析所依据的证据主体，包括样本量和可用信息，并质疑在样本量更大或信息更多的情况下，是否仍可能得出相同的一致结论。这在媒体报道攻击者时尤为有用。多份媒体报道可能都基于单一事件，所以仅仅因为有多份报道，并不意味着发生了多起事件。


    ### 镜像效应


    镜像效应，或镜像偏差，发生在分析师假设研究目标的思维方式与自己相同，因此会做出与分析师相同的决策时。这导致分析师基于自身经验（往往与目标完全不同）来推测对手会或不会做什么。受此偏差影响的分析师不使用证据来指导判断，而是用自己对“合乎逻辑的下一步”或“我会怎么做”的看法来判断假设是否正确。镜像效应常用于生成工作构想阶段，但在评估阶段，重要的是识别何时是镜像效应而非证据构成了假设的基础，并从分析中移除该偏差。


    # 结论


    如果有一句话能概括分析最有效的方法，那就是 `slow down`。这不仅有助于在你需要立即投入下一起入侵事件或其他紧迫任务之前，启动系统 2 思维过程。虽然转向其他事情似乎很紧迫，但你还没完全结束。花一点时间了解最近的事件是否以及如何融入贵组织对战略威胁形势的理解，是一项长远来看会带来回报的任务。这是确保组织真正从事件中吸取教训，并以更具韧性、更明智的方式前进的最佳途径之一。


    '

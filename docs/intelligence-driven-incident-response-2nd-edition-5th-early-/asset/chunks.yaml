    # 威胁情报框架


    ## MITRE ATT&CK


    Mitre 的对手战术、技术和通用知识（ATT&CK）创建于 2013 年，旨在对攻击生命周期中的攻击者行为进行分类，最初专注于针对 Microsoft Windows
    的攻击。它关注战术——被描述为攻击中对手的短期战术目标，以及技术——对手实现其战术目标的手段。（参考[`www.mitre.org/sites/default/files/publications/pr-18-0944-11-mitre-attack-design-and-philosophy.pdf`](https://www.mitre.org/sites/default/files/publications/pr-18-0944-11-mitre-attack-design-and-philosophy.pdf)）此后，它扩展至包含针对
    Linux 和 MacOS 的攻击，以及描述攻击前活动（PRE-ATT&CK）、移动平台（Mobile ATT&CK）、工业控制系统、云系统，甚至 Docker
    和 Kubernetes 等容器的额外矩阵。


    ATT&CK 对象结构包括标签、字段和关系。标签是可用于筛选或透视分析的数据点；字段用于自由文本以描述不同的战术或技术，关系是定义不同实体间关系的字段。


    该模型及其关系如下图所示（图 4-1）。每个实体、对手组织、技术、战术和软件都有自己的字段，可用于捕获额外的相关信息，这使得 ATT&CK 成为一个可用于捕获战术和战略信息的模型。


    ![](img/exploit_403850_01.png)


    ## VERIS


    事件记录和事件共享词汇表（VERIS）是一个基于 JSON 的标准，因支持 Verizon 数据泄露调查报告（DBIR）而广为人知。VERIS 框架捕获的信息分为四类，称为“四个
    A”：行动者、资产、行动和属性，它们都回答了关于事件的一个问题。


    **行动者**：行动者字段回答“谁的行为影响了该资产？”该字段捕获对事件负责的行动者的高层信息。行动者的数据模式枚举包括行动者是内部、外部还是合作伙伴行动者，以及行动者的动机。


    **行动**：行动字段回答“何种行为影响了该资产？”行动包括攻击者如何获取访问权限，例如使用恶意软件、黑客攻击或社会工程学。它还包括具体载荷，如利用已知漏洞或使用钓鱼邮件。


    **资产**：该字段回答“哪些资产受到了影响？”——从战略角度来看，这是一个极其重要的问题。枚举包括受影响资产类型的信息，以及其可访问性和管理信息。


    **属性**：属性字段回答“资产是如何受影响的？”它使用传统的机密性、完整性、可用性三要素。


    VERIS 还捕获事件时间线和影响的信息。这些字段提供了记录识别、遏制和修复事件所需时间，以及对受影响组织影响严重程度的位置。


    VERIS 的主要用例不是生成规则或警报，而是帮助组织了解其面临的风险。因此，该信息不如 STIX 或我们之前提到的格式中捕获的信息那样详细或技术性强。然而，它可用于讲述特定事件发生的更完整故事。


    ## CAPEC


    通用攻击模式枚举与分类（CAPEC）框架最初旨在协助安全软件的开发。CAPEC 背后的理念是，如果软件开发人员能够了解攻击者针对和利用软件的常见方式，他们就能设计和构建不易受这些攻击影响的软件。CAPEC
    不仅捕获具体的技术细节，还试图将攻击的全貌作为攻击模式捕获，其中包括攻击前提条件、相关弱点、相关漏洞和攻击者步骤的信息。


    当事件的清晰图景可用并被 CAPEC 捕获时，组织可以从攻击中学到很多东西。随时间推移对攻击模式的分析可以提供对攻击者运作方式、他们如何适应安全措施，以及保护组织所需的任何额外措施的理解。


    # 提取流程


    一旦你确定了想要（或需要）捕获数据的格式以及存储位置，制定一个提取所有相关信息的流程就很重要了。这是“利用”阶段中理论联系实际的部分。虽然我们希望能在本节中列出你应该使用的确切分步流程，但事实是，就像网络威胁情报中的其他事物一样，每个
    CTI 项目都有独特的组成部分，这会导致这些流程因情况而异。相反，我们将概述制定流程的流程，目标是帮助你规划出一个长期有效且在需求变化时易于修改的方案。


    ## 步骤 1：明确目标


    这里要尽可能具体，不要只说“我们的目标是管理事件数据”，虽然这可以是个好的开始。明确的目标应包括利用阶段的预期成果、支持对象和预期影响。*“捕获所有信息——包括
    IOC、TTP、目标信息和战略信息——存入电子表格，并附上事件执行摘要，以便我们目前的 5 名情报分析师团队能进一步分析并提出额外的检测和缓解建议。”* 像这样写下来，目标就变成了你将遵循流程的路线图。


    ## 步骤 2：确定工具


    我们在这里非常宽泛地使用“工具”一词。工具是任何有助于实现步骤一中概述目标的事物。有些组织拥有威胁情报平台（或 TIP，本章后面将介绍），它们可能具有自动指标提取和分类等内置功能。如果你没有
    TIP，仍有许多其他资源可提供帮助，包括脚本、电子表格、非 TIP 数据库，以及生产力和协作工具。在这个阶段，你还应该指出是否拥有实现既定目标的正确工具——例如，如果目标涉及与五名分析师的团队共享信息，你将需要某种协作工具。如果没有任何工具能促进信息共享，那么你将很难实现该目标。


    ## 步骤 3：确定将使用的系统或流程


    这可能是这三个步骤中最多样化的一个，因为分析师将数据导入实现步骤 1 中确定的利用目标所需工具的方式有很多种。以系统化、理想情况下有文档记录的方式处理这项任务，是确保其彻底完成且过程中无信息遗漏或疏忽的最佳途径。一个流程可能包含以下任务：


    * 确定将作为利用流程一部分进行聚合的所有数据源的位置。

    * 创建所有来源的清单，以跟踪已利用的内容。


    '

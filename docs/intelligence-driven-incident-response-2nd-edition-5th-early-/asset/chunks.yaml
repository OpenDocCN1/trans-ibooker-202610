    ## Understanding the Attacker


    Understanding the attacker meant that it was possible to protect the network from
    further exploitation, identify where he may target next, and allowed a response,
    both on the micro level (identifying the individual carrying out the attacks)
    and on the macro level (realizing that nations were employing new tactics in their
    traditional intelligence-gathering arsenal and changing policies to respond to
    this change). Sharing this understanding ended up being key not just to protecting
    Lawrence Berkeley National Lab, but many other government organizations.


    ### Destructive Attacks


    In 1988 Cornell student Robert T. Morris hacked into a computer lab at the Massachusetts
    Institute of Technology (MIT) and released a computer program that was designed
    to replicate itself to as many computers as possible without being detected. It
    did this by exploiting a backdoor in the Internet’s email delivery system as well
    as a flaw in the *finger* program that identified network users. It may have just
    been a harmless experiment - or a prank, as some have described it - that few
    people ever knew about, however it did not work exactly as Morris intended and
    became part of cyber history (which is just like regular history, but cooler).
    The worm ended up crashing 6000 computers, which was about 10% of the internet
    of the time, with computers at Harvard, Princeton, Stanford, Johns Hopkins, NASA,
    and the Lawrence Livermore National Laboratory among the many victims. Investigators
    from the FBI were struggling to inspect the activity, unsure if it was an outage
    or an attack, when Morris called two friends and admitted that he was the one
    behind the worm. One of the friends called *The New York Times,* which led to
    the eventual identification and conviction of Morris for violations of the new
    Computer Fraud and Abuse Act of 1986 (CFAA).


    While there was no nefarious intent behind this worm - it was really just another
    example of how programs don’t always behave exactly the way that their creator
    intended them to - there were far reaching implications that can still be seen
    today. As the internet became more and more critical to operations, it became
    even more important to be able to quickly identify and remediate other intrusions
    or destructive attacks. The Computer Emergency Response Team (CERT) was established
    at Carnegie Mellon University as a professional, trained response team responsible
    for providing assessments and solutions for cyber attacks. It also highlights
    why it is sometimes important to be able to attribute an attack - in 1988 there
    had been significant “warming” of the Cold War, with Reagan and Gorbachev meeting
    in Moscow and Soviet Troops beginning to withdraw from Afghanistan. If this worm
    had inaccurately been blamed on Soviet activity - which was actually the case
    for the activity from the Cuckoo’s Egg - it could have significantly changed the
    course of history.


    ### Moonlight Maze


    In the decade following 1986’s Cuckoo’s Egg and 1988’s Morris Worm, the field
    of Incident Response improved, not just with the creation of CERT, but because
    of the professionalization of the field itself across the government, military,
    and private sector. In addition, the emergence of proper network monitoring tools
    meant that defenders weren’t reliant on printers scattered around a basement to
    identify malicious network activity. This increase in capabilities was fortuitous,
    as intrusions not only continued but grew in scope and sophistication. In 1998,
    the US government identified what is believed to still be the largest and longest
    running intrusion into government networks - codenamed Moonlight Maze.


    In March of 1998, the US government noticed anomalous activity within several
    sensitive and restricted networks, including the Pentagon, NASA (yes, NASA has
    apparently always been pretty high on the priority list for intrusions), and the
    Department of Energy (DOE). Further analysis identified the same malicious activity
    at several universities and identified that the activity had been ongoing for
    at least two years. The sustained nature of this activity was unlike any of the
    previous intrusions (as far as was known at the time) which had seemed more targeted
    and short-lived. Unlike those instances, the adversaries had left strategic backdoors
    in different parts of the network so that they could return at will. Information
    was being gathered from numerous locations that often seemed unrelated.


    We have been fortunate enough to work closely with people who directly supported
    the investigation and response to Moonlight Maze, both in the 1990s and today,
    as there are still many unknowns and many insights to be found from this intrusion.
    Talking with these individuals and reading through the numerous reports on the
    intrusion hammers home the point that intelligence work is critical to incident
    response, and that cyber threat intelligence in particular bridges the gap between
    what is happening on the strategic level with national interests and foreign adversaries,
    and how those adversarial goals and actions show up on a computer network. The
    US has had a full scope intelligence community actively looking and listening
    for signs of foreign interference, but the largest network attack went unnoticed
    until it was detected “by accident” because intelligence work had not yet been
    fully modified to account for actions taken against a network.


    Moonlight Maze kicked cyber threat intelligence capabilities into the modern era.
    Computer networks were not something that might be impacted from time to time,
    these networks were now being targeted directly for the information and access
    they held. Computer networks were part of intelligence collection, and intelligence
    needed to play a role in their defense.


    ## Modern Cyber-Threat Intelligence


    Over the decades, the threats have grown and morphed. Adversaries are not just
    foreign governments or curious students. Organized criminals, identity thieves,
    scammers, ideologically motivated activists, and others with various motivations
    all realized the impact that their activities could have when directed at digital
    targets instead of physical ones. These adversaries use an ever-expanding set
    of tools and tactics to attack their victims and actively attempt to evade detection.
    At the same time our reliance on our networks has increased, making incidents
    even more impactful. Understanding the attacker has gotten much more complicated,
    but no less important.


    Understanding how to identify the attacker activity and how to use that information
    to protect networks is the fundamental concept behind a more recent addition to
    the incident responder’s toolkit: cyber-threat intelligence. *Threat intelligence*
    is the analysis of adversaries—their capabilities, motivations, and goals, and
    cyber-*threat intelligence* (CTI) is the analysis of how adversaries use the cyber
    domain to accomplish their goals. See [Figure 1-1](#ch01.html#figure_1_1_from_intelligence_to_cyber_threat_intelligence)
    on how these levels of attacks play into one another.


    ![](assets/image-to-come.png)


    Initially, intelligence analysts came into the picture after an intrusion like
    Moonlight Maze to understand what the overall intrusion told us about the adversary.
    What were their goals, their motivations, their capabilities, their organizational
    structure - all things that were important for a strategic understanding and long-term
    planning, but not things that would immediately provide value to those trying
    to defend their networks from the attacks of today, tomorrow, or sometimes even
    last week. Cyber-threat intelligence began to focus more on tactical and technical
    details that were more immediately actionable, learning along the way what types
    of information were most valuable in different situations. Cyber-threat intelligence
    analysts didn’t just bring data, they also brought insights.


  trans: '

    事件响应人员往往不得不面对同一种情况以同一种方式再次发生。同样的漏洞、同样的横向移动，甚至可能是完全相同的被盗或重复使用的密码，而且通常还是同一个对手。此时，许多人会感到愤懑不已，质问这怎么可能发生。我们难道没有从上次事件中吸取教训吗？我们难道没有修复问题吗？遗憾的是，答案往往是否定的。上一次事件解决后，还有其他事情需要担心，其他问题需要从安全团队到
    IT 经理再到 CIO 的所有人关注，既然问题已被“解决”，就没有更多时间花在流程上，以及你如何利用它，无论你的团队是 1 人还是 100 人。


    # 什么是战略情报？


    没有任何事情是在真空中发生的——甚至（尤其是！）网络入侵。一切都发生在特定的背景下——战略环境——而这种背景在整个 F3EAD 流程乃至更广泛的范围内都具有极其重要的意义。战略环境远远超出了你自己的网络、数据以及入侵的战术和操作层面影响。它包括地缘政治、经济、社会和技术问题，以及许多其他变量。战略情报为规划未来的行动和政策提供必要信息，并帮助决策者应对长期项目和计划。


    战略情报之所以得名，不仅因为它涵盖的主题——通常是对具有长期影响的信息进行高层分析——还因为它最常见的受众。战略情报面向拥有行动能力和权力的决策者（最常见的是企业/机构高层领导），因为这种情报应当塑造未来的政策和战略。然而，这并不意味着领导层是唯一能从这些洞察中受益的群体。战略情报对各级人员都极其有用，因为它能帮助他们理解其特定层面所处理问题的周围背景。帮助个人理解为何制定某些政策，或为何重点关注某一特定领域，将有助于他们更有效地履行职责。


    在他的论文“[战略分析的现状](https://www.cia.gov/static/789d2c84e758c9111bdaaa2adb8c628a/the-state-of-strategic-intelligence.pdf)”中，John
    Heidenrich 写道：“战略并非真正的计划，而是驱动计划的逻辑。”当这种逻辑存在且传达清晰时，分析师可以用一种支持战略努力背后总体目标的方式来处理问题，而不是将每个单独的情况视为独立的实体。当这种逻辑**不**存在时，遵循任何计划都会变得极其困难，而知道何时应修改计划则更难。


    战略情报通过帮助分析师确定响应优先级、识别入侵何时对其组织尤为重要，以及确保从每次事件中吸取的教训得到分析和采取行动，来支持情报驱动的响应流程。如果没有战略情报，情报驱动的事件响应仍能为事件响应流程提供洞察和支持，但有了战略情报，它能极大地提升组织理解并调整自身姿态以预防、识别和应对后续入侵的能力。但如何*获得*战略情报？当有如此多其他时间敏感的需求争夺你的注意力时，你如何识别出将帮助制定你将遵循的计划的逻辑？


    ## Sherman Kent：美国情报分析之父


    Sherman Kent 被称为美国情报分析之父，他确实用其著作《世界政策的战略情报》（*Strategic Intelligence for World
    Policy*，距今近 60 年仍是佳作）为情报分析“写了教科书”。他对情报学科的贡献如此之大，以至于 CIA 培训新情报分析师的学校被称为 Sherman
    Kent School for Intelligence Analysis（谢尔曼·肯特情报分析学院）。


    Kent 在耶鲁大学获得历史学博士学位并在该校任教，直到第二次世界大战爆发，他加入了新成立的战略情报局（Office of Strategic Services，OSS，CIA
    的前身）下属的一个新部门——研究与分析处（Research and Analysis Branch，R&A）。在那里，Kent 利用其历史学家的经验，结合领导能力，汇聚了经济学家、科学家、哲学家、诗人和军事人员，开展了战争期间一些最具影响力的分析工作。Kent
    和 R&A 分析师并非在规划行动或战术冲突；他们在分析敌方及作战环境的根基。他们分析文化和可用资源（粮食、财政和交通），以帮助美国确定哪些行动对国家战略影响最大。他们产出的战略情报不仅有助于单一任务，更助力了整个战争努力。


    在许多情况下，战略情报与战术或即时情报最显著的区别之一在于建模过程。在战术和即时情报中，分析师使用现有的模型——无论该模型是行动者档案还是内部网络地图——来解决手头的问题。在战略分析中，这些模型通常正在被更新或首次开发。事实上，当战略分析师开始仅利用预先存在的模型（无论是心智模型还是有形模型）时，他们就冒着错过世界运作方式重大变化的风险，导致分析效果降低，甚至在某些情况下完全错误。


    虽然在将这些原则应用于现代情报驱动的事件响应时，回顾过往的成果库是有益的，但了解自第二次世界大战以来世界发生了怎样的变化，以及这如何改变情报分析师所依赖的某些教条，同样重要。


    ## 战略情报在 IDIR 中的作用


    Sherman Kent 时代的战略情报旨在告知战略层面的决策者他们需要知道什么以做出正确决策。分析师通常能获取他人无法获取的信息，并能提供决策者原本可能错过的洞察。时代已经发生了很大变化，现在领导者往往面临的是信息*过多*而非过少。

    '

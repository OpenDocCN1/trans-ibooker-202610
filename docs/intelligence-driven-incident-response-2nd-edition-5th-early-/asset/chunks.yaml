    ## Your Everyday Threat Intelligence (YETI) Platform


    Your Everyday Threat Intelligence (`YETI`) platform is a newer threat intelligence
    management tool that was released for public use in March of 2017. `YETI` was
    designed to enable analysts to organize and analyze the various components of
    threat intelligence in one place. It supports observables, indicators of compromise,
    TTPs, as well as general knowledge on threats. One of the great aspects of `YETI`
    is that in addition to storing information that you have already found about threats,
    it can also perform some indicator enrichment, including domain resolution and
    WHOIS lookups, as well as any additional integrations you want to configure. `YETI`
    can ingest data from `MISP` instances, `JSON` feeds, `XML` feeds, and various
    malware sandboxes. `YETI` was specifically designed to support many challenges
    that threat-intelligence analysts have identified in recent years, and to be flexible,
    as many analysts often need the same information, but have different processes
    or workflows. `YETI` has a [GitHub repository](https://github.com/yeti-platform/yeti)
    where you can find more information on installation as well as documentation.


    ### Commercial solutions


    A variety of commercial solutions are available for threat-intelligence management
    as well. Most of the commercial solutions include similar features to `MISP`,
    `CRITs`, and `YETI`, but also manage system configuration, take responsibility
    for setup and hardware management, and offer support for troubleshooting or feature
    requests. Commercial solutions can be ideal for organizations with limited development
    resources that want something easy to set up and maintain.


    All of the threat intelligence platforms, whether open source or commercial, have
    many of the same features and functionality, but may have been designed with a
    particular use case in mind, whether that is malware-based threat information,
    a specific information sharing, or supporting and enabling analytic processes.
    One of the best things about starting with open source threat-intelligence platforms
    is that you can find the best fit for your organization. If installation and support
    of the tools are a problem for your organization, you can explore several commercial
    solutions once you identify the best overall type of platform for your organization.


    # Conclusion


    Information that is gained from an investigation should not be forgotten after
    the engagement is over—whether that investigation occurred at your own organization
    or happened somewhere else and you are fortunate enough to have access to the
    data. That information needs to be analyzed and disseminated so that organizations
    can learn and adapt to threats. Analysis and dissemination are not possible, however,
    without first going through the critical exploitation phase where information
    is gathered, processed into a usable format, and stored for analysis. As you learned
    in this chapter, you have many options for processing and storing this information,
    from the format it is stored in to the actual database it is kept in and the interface
    used to access it, so take time to explore your options and find a system or combinations
    of systems that will work well for you. Once the `Exploit phase` is completed,
    it will be much easier to move into the next phase of the `F3EAD` cycle: `Analyze`.


    # Chapter 5. Analyze


    > “If you do not know how to ask the right question, you will discover nothing.”

    >

    > W. Edward Deming


    All of the information that you have gathered has been exploited and is now sitting—formatted
    and standardized—in a database or a threat-intelligence platform. So now what?
    The information sitting there does little good until it is analyzed. The `Analyze
    phase` of `F3EAD` is one of the hardest to articulate but also one of the most
    important. This is the phase where we take data and information and process it
    into intelligence. This chapter covers the basic principles of analysis, models
    such as `target-centric` and `structured analysis`, and processes to assign confidence
    levels and address cognitive biases.


    ## The Fundamentals of Analysis


    To properly analyze the information you have, you must go through another (thankfully,
    smaller) version of the intelligence cycle. You must decide what your requirements
    are, or in other words, what questions you are going to answer. You need to collect
    the information that you will use to answer those questions. Most of that collection
    will come from the information you gathered throughout the investigation and standardized
    in the `Exploit phase`, but other information will be needed to enrich or augment
    that information so it can be properly analyzed. Therefore, it may be necessary
    to continue to collect data as you move into the `Analyze phase`. The `Analyze
    phase` of `F3EAD` captures the entire intelligence cycle, pictured [`Figure 5-1`](#ch05.html#fig_1_analysis_within_f3ead).


    ![](assets/analyze_837710_01.png)


    During the response to the `Road Runner` intrusion, we identified domains and
    IP addresses that were used in the exploitation and `command-and-control` phases
    of their operations. That information helped us in the `Fix` and `Finish` stages,
    and will continue to help us as we analyze the intrusion, but in a different way.
    Rather than only identifying the technical details of the attack in order to respond
    and remediate, we can analyze those same domains and IPs to identify patterns
    that can be used to better understand the attacker’s tactics. This process involves
    gathering additional information about the domains and IPs, including who they
    were registered to, and how the attacker used them in order to determine whether
    patterns can be used to identify or predict future behaviors. This new information
    is then analyzed, intelligence gaps (critical pieces of information that are needed
    to conduct analysis) are identified, and more information is gathered as needed.


    ## Dual Process. Instead, we need “slow thinking” - though probably still on a
    deadline (often even short deadlines).

    '

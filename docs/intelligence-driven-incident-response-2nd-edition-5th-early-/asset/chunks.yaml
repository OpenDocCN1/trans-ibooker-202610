    ## Step 3


    Begin developing the conceptual model of your “target”. Many, though not all,
    targets are adversary networks, and the goal of understanding them is to determine
    how to best prevent, detect, and respond to any malicious activity you may experience
    from them. Depending on the adversary you may have specific information about
    who and where they are, however that is not necessary for a good model. Without
    any identifying information, you can still capture and describe a threat actor’s
    recurrent patterns of actions, understand the key components of their operations
    against you, and detail the behavioral, physical, and functional nodes that they
    rely on when attempting to compromise your organization. Building this shared
    understanding of the threat should lean heavily on information that has been exploited
    throughout the process thus far. It is one of the many reasons that the Exploit
    phase, as tedious as it may feel at some times, is so important. Developing the
    initial model for target-centric intelligence analysis can also leverage several
    structured analytic techniques, including things like brainstorming and key assumptions
    checks.


    ## Step 4


    Once the model has been developed, you also need to outline the operating processes
    you will follow to ensure that you are truly conducting target-centric intelligence
    analysis which is collaborative, iterative, and at times, predictive. Although
    the process needs to involve other stakeholders such as you intelligence customers,
    collectors, and other analysts, take ownership of driving the process and finding
    a way to engage other teams without putting too much of a burden on them - this
    is one way to ensure that you can maintain a collaborative approach. Outline logistics,
    such as weekly syncs to go over findings and identify new questions. Include an
    internal chat channel for asking time sensitive questions, and identifying secondary
    points-of-contact for when a primary stakeholder is out of the office or unable
    to participate due to other obligations. These may not seem like exciting tasks
    but they are critical to the success of this approach.


    ## Step 5


    Now we get to work. Once the conceptual model has been developed and standard
    operating procedures outlined, we begin the process of understanding the questions
    customers have around the model, the answers we already have, and the answers
    we still need. The answers we have are considered `actionable intelligence`, intelligence
    that can be acted on or can answer questions. Actionable intelligence is shared
    with the customer, and if more or different information is needed, the model is
    updated, and we move back through the collection and analysis process again. Target-centric
    analysis follows an iterative process, where information is gathered, analyzed
    to see whether it helps answer the questions presented, and occasionally ends
    up generating new requirements. If more or different information is needed, the
    collection and processing phases are reengaged, ensuring that all the necessary
    information is available to collective group. This method also allows for analysis
    to check in frequently with customers to see if the situation and needs have changed.
    Although every analyst wants to think that they can come to analytic judgements
    and conclusions while they are still needed, it is important to be honest about
    time constraints and how quickly things may change, which can alter intelligence
    requirements.


    Repeat as needed, and be open to change. The benefit of using the target-centric
    method of analysis is that it involves multiple check-ins between the various
    stakeholders involved in the process. Although you may have a few customers who
    are regular parts of the target-centric approach, it is beneficial to check in
    with all the recipients of the analysis, whether that is a CISO or a SOC analyst,
    to make sure that what is being provided meets their needs, and identify whether
    or not their needs have changed. This is a good way to not only ensure that the
    shared understanding that comes from the analysis continues to grow, and to identify
    when a customer may become a key stakeholder who should participate in the process
    more frequently.


    Once you’ve identified the method that you will use for the analysis, but before
    you begin the analysis process, take a step back and look at the context for the
    question you are answering and the situation you are analyzing. As we discussed
    at the beginning of the chapter, this pause is a key step in switching from System
    1 to System 2.


    # Conducting the Analysis


    We spent the first part of this chapter building out the analytic toolkit that
    can be used to conduct analysis in a way that counters biases, is repeatable,
    and allows analysts to explain how they came to a particular judgement. Now the
    work can begin - as long as you know what it is you are analyzing.


    ## What to Analyze?


    Conducting analysis is incredibly difficult if you do not know what you are trying
    to analyze. Often the thought of analysis conjures up images of someone standing
    in front of a wall with pictures and newspaper clippings haphazardly taped to
    it, waiting for that “aha” moment when everything suddenly makes sense. Or maybe
    you think of Newton sitting under a tree as an apple falls on his head, a simple
    (and over simplified) tale of an event that brings about sudden clarity, as everything
    you have been wondering about makes sense.


    If your approach is to stare at all the data you have collected with the vague
    idea that you want to understand what it means, you will have a far more difficult
    time analyzing it than if you asked specific questions of the data, such as, “Why
    were we targeted?” or “How could this attack have been prevented?” You can certainly
    ask multiple questions of the information, and the questions can build on each
    other to increase your understanding of an attack and its implications, but without
    a starting point, many analysts find it difficult to complete this phase of the
    process. As we discussed at the beginning of this chapter, analysis often seems
    to mimic a mini-intelligence cycle, and therefore identifying or revisiting requirements
    - the questions you are trying to answer - is the first step.


    If you do not have specific requirements that are being analyzed for leadership
    or other internal teams, you can ask a standard set of questions that are helpful
    for analyzing each incident. However, some questions will always be unique to
    your organization or incident, so do not think of the following examples as the
    `only` things you should be analyzing. Here are some of the questions you can
    start with:


    ### Why were we targeted?


    This question will provide a wealth of information on how to identify additional
    intrusions as well as how to protect your organization from future attacks. The
    nature of the attack, whether the attacker targeted integrity, confidentiality,
    or availability of your data, whether they used the attack to get access to third-party
    connected networks, and the actions they took after finding what they were looking
    for, can all provide insight into what you need to be looking for moving forward.
    Tactics and techniques may change, but an attacker’s goals change far less frequently.


    ### Who attacked us?


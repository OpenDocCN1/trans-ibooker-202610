- raw: "Once an adversary has established persistence, especially if they’ve chosen\
    \ the RAT route, they need a method to deliver commands (either via push or pull).\
    \ Command and Control (C2) communication are carried out using a variety of methods\
    \ and can leverage different ports, protocols, and services. Adversaries have\
    \ been known to be incredibly creative in setting up C2 processes. One notable\
    \ example is Turla, a group known to get innovative with command and control channels.\
    \ In one instance they used an implant that communicated via encoded commands\
    \ on popstar Britany Spears’ Instagram comments. In the past, many pieces of malware,\
    \ especially distributed denial-of-service (DDoS) tools, communicated by joining\
    \ IRC channels or HTTP calls to a server under the adversary’s control. The [Comment\
    \ Crew](http://symc.ly/2tHeLKX) got its moniker from doing command-and-control\
    \ with HTML comments on otherwise innocuous-looking web pages. Some adversaries\
    \ use multiple methods, including DNS lookups, social media, or popular cloud\
    \ applications.\n\nAdversaries focus on making sure that their communication channels\
    \ avoid notice and provide enough bandwidth to meet the needs of the adversary.\
    \ In some cases, malware may communicate using only a few lines of text a day,\
    \ while others include full virtual desktop capability.\n\n## Actions on Objective\n\
    \nIn most cases, all of this is not the ultimate goal, but rather the setup. Adversaries\
    \ go through the process of setting up access in order to give themselves the\
    \ capability to affect the target in a way they didn’t have before. We call this\
    \ new capability the *actions on objective (AoO)*.\n\nWhile many of the earliest\
    \ AoO were as simple as exploration, since the mid 1990s the most common action\
    \ on objective has been collecting and exfiltrating information on target systems.\
    \ In a very simple way, it makes a lot of sense: computers are ultimately about\
    \ processing information. Supposedly infamous bank robber Willie Sutton was once\
    \ asked why he robbed banks. Sutton responded “Because that’s where the money\
    \ is.” In the modern age where money is data (as ones and zeros in a ledge or\
    \ blockchain), plans for the next military technology are in computer aided design\
    \ and development files on corporate servers, and political intelligence is stored\
    \ as PDFs or Excel spreadsheets is it any wonder data theft became the dominant\
    \ action on objective?\n\nNext to data exfiltration the most common action on\
    \ objective, and goes along with the network persistence piece of installation,\
    \ is pivoting. In many cases the true target an adversary is after isn’t available\
    \ to attack directly. People shouldn’t be opening phishing emails from the FTP\
    \ server that holds their most valuable plans (they often do unfortunately) and\
    \ shouldn’t be browsing shady websites from the system with all their customer\
    \ data (they do that too) but in the cases where these practices are followed\
    \ the adversary will often attack related systems that may facilitate further\
    \ access to get to the ultimate target. In many cases the adversary wouldn’t even\
    \ know what system they ultimately targeted, but would attack anything available,\
    \ establish persistence, and pivot; essentially starting the entire intrusion\
    \ process over again (kill chains within kill chains). A common intrusion pattern\

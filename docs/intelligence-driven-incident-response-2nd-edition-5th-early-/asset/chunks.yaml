    # The Intelligence Cycle


    ## Analysis Phase


    The goal of the Analysis phase is to answer the questions identified in the Direction
    phase of the intelligence cycle. The type of answer will be determined by the
    nature of the question. In some cases, the analysis may generate a new intelligence
    product in the form of a report or could be as simple as a yes/no answer, most
    often backed up with a confidence value. It is important to understand what the
    output will be before beginning the analysis.


    Analysis is not a perfect science and must often be conducted with incomplete
    information and uncertainty. It is important that analysts identify and clearly
    state any information gaps in their analysis so that decision makers can be aware
    of potential blind spots in the analysis. Information gaps can also drive the
    collection process to identify new sources in order to reduce those gaps. If the
    gaps are significant enough that an analyst does not think it is possible to complete
    the analysis with the current information, then it may be necessary to go back
    to the Collection phase and gather additional data. It is much better to delay
    the final analysis than to provide an assessment that the analyst knows is flawed.


    It is important to note that all intelligence analysis is generated by a human.
    If it is automated, it is actually processing instead, which is a critical step
    in the intelligence cycle but is not by itself analysis.


    ## Dissemination


    At this point, the process has generated real intelligence: a contextualized answer
    to the question posed in the Direction phase. A report with an answer is useless
    until it’s shared with the relevant stakeholders: those who can use this intelligence.
    In plenty of documented intelligence failures, analysis was spot-on but dissemination
    failed. Intelligence must be shared with relevant stakeholders in the form they
    find the most useful. This makes dissemination dependent on the audience. If the
    product is aimed at executives, it’s important to consider length and phrasing.
    If it’s aimed at implementation in technical systems (such as IDS or firewalls),
    this could require vendor-specific programmatic formats. In any case, intelligence
    must be usable by the relevant stakeholders.


    ## Feedback


    Often forgotten, the Feedback phase is key to continuing intelligence efforts.
    The Feedback phase asks whether the intelligence that was generated answers the
    direction successfully. This results in one of two outcomes:


    **Success**


    : If the intelligence process answered the question, the cycle may be over. In
    many cases, though, a successful intelligence process leads to a request for more
    intelligence based on either new questions or the actions taken based on the answer
    given.


    **Failure**


    : In some cases, the intelligence process failed. In this case, the Feedback phase
    should focus heavily on identifying the aspect of the original direction that
    was not properly answered. The following Direction phase should take special care
    to address the reasons for that failure. This usually comes down to a poorly structured
    Direction phase that didn’t narrow the goal enough, or an incomplete Collection
    phase that was unable to gather enough data to answer the question, or improper
    analysis that did not extract correct (or at least useful) answers from the data
    available.


    # Using the Intelligence Cycle


    Let’s consider how the intelligence cycle can be used to start learning about
    a new adversary.


    One of the most common questions a chief information security officer, often abbreviated
    as CISO, asks (hopefully before she gets asked it herself) is, “What do we know
    about this threat group I heard about?” A CISO will want a basic understanding
    of a group’s capabilities and intention, as well as an assessment of relevance
    to a given organization. So what does the intelligence process look like in this
    situation? Here is an example of what is involved in each step of the intelligence
    cycle to meet the CISO’s needs:


    ## Direction


    This came from a key stakeholder: the CISO. “What do we know about `X` threat
    group?” The real answer sought is a target package, which we’ll explore in detail
    later.


    ## Collection


    Start with the original source, most likely a news article or report. That document
    will usually provide at least some context for beginning the collection. If the
    source material includes information about a specific intrusion or attack, it
    can be helpful to understand more about the entity that had been targeted and
    identify any potential motivations or goals of the intrusion. If indicators (IPs,
    URLs, etc.) exist, explore those as deeply as possible by pivoting and enriching.
    The source may itself point to additional reporting with IOCs, tactics, techniques,
    and procedures (TTPs), or other analyses.


    ## Processing


    This is very workflow/organization dependent. Getting all the collected information
    into a place where it can be used most effectively may be as simple as putting
    all the information into a single text document, or it may require importing it
    all into an analysis framework. Additional enrichment can be done with technical
    details related to the group. In addition, translation of reports or other documents
    may be necessary.


    ## Analysis


    Using the collected information, the analyst will start by attempting to answer
    key questions:


    * What are these attackers interested in?

    * What tactics and tools do they typically use?

    * How can defenders detect those tools or tactics?

    * Who are these attackers? (Although this is always a question, it is not always
    one worth taking the time to answer.)


    ## Dissemination


    For a product like this that has a specific requester, the CISO, a simple email
    may suffice. Although in some cases limiting a response to this makes sense, a
    real product for proactive distribution to others will almost always create greater
    value.


    ## Feedback


    The key question: is the CISO pleased with the results? Does it lead to other
    questions? These pieces of feedback help close the loop and may begin a new series
    of collections.


    The intelligence cycle is a generalized model that can be used to answer questions
    large and small. However, it is important to note that following the steps will
    not automatically result in good intelligence.


    # Qualities of Good Intelligence


    The quality of intelligence relies primarily on two things: collection sources
    and analysis. Many times in cyber-threat intelligence we end up working with data
    that we did not collect ourselves, and therefore it is critical that we understand
    as much as possible about the information. When generating intelligence ourselves,
    we also need to ensure that we understand collection sources and are addressing
    biases in our analysis. Here are some things that should be considered to ensure
    that quality intelligence is produced:


    ## Collection Method


    It is important to understand whether the information is collected primarily from
    incidents or investigations, or whether it is being collected from an automated
    collection system such as a honeypot or a network sensor. Although knowing the
    exact details of the collection is not imperative—some providers prefer to keep
    their sources confidential—it is possible to have a basic understanding of where
    the data comes from without compromising collection resources. The more details
    you have about the way information was collected, the better your analysis of
    this information will be. For example, it is good to know that data comes from
    a honeypot; it is better to know that it comes from a honeypot configured to identify
    brute-force attempts against remote web administration tools.


    ## Date of Collection


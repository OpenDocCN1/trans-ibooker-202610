    # Thinking Fast and Slow


    The concept of thinking fast and slow was popularized by Daniel Kahneman in the
    book by the same name (*Thinking, Fast and Slow*); however, the theory of the
    dual process of thought has been studied for decades. The general idea states
    that there are two modes of thinking: "fast thinking", also known as *System 1
    thinking*, is a quick, automatic process often based on association and experience,
    relying heavily on pre-existing mental models. This type of thinking can get us
    out of a jam when time is short and action is needed quickly. When using this
    system, the mind makes an assumption that the risk associated with minor flaws
    in intuitive judgement are less significant than the risk of not acting fast enough.
    The flaws associated with *system 1 thinking* include cognitive biases and misapplied
    mental models, which may not be that serious when outrunning a tiger, but could
    cause a lot of problems when making decisions that will impact you long term.
    The second system, slow thinking or *system 2 thinking*, is a deliberate process
    of reasoning that aims to counter the impulsive biases that are so effective with
    *system 1*. With *system 2 thinking*, not only do you need to take the time to
    counter things like biases, but you also need to make sure that you have a firm
    grasp on the context of the different pieces of information that you are analyzing
    and are thinking through second and third order effects. Understanding complex
    networks and situations takes time, and without the time to think things through
    it is very likely that you will come to at least some faulty judgements.


    In this chapter, we are focusing on the *System 2* process of thinking as a way
    to help generate greater insights that can be clearly articulated, defended, and
    shared with others who will be able to follow the reasoning and come to more or
    less the same analytic conclusion. This is not an easy task; however, throughout
    the chapter we will be presenting different approaches, methods, and frameworks
    that can be used to support this analysis. We will also cover some additional
    mental models that can put analysts in the right frame of mind for *thinking about
    thinking*, or metacognition, a concept that has been discussed and debated since
    at least the time of Greek philosopher Aristotle.


    ## Inductive, Deductive, and Abductive Reasoning


    While thinking about approaching a problem we don''t usually think about how we
    think about problems. It''s a little bit like driving a car to work: it''s easy
    to just pick a "normal" way to go and head the same way no matter what. But it''s
    not always that easy, is it? Sometimes there''s traffic, sometimes there''s construction,
    sometimes you need to stop by the store, sometimes you just want a different view.
    In these cases, you may take a different route to get to the same place. Reasoning
    can go the same way.


    Before we start, it''s important to know reasoning, like so many things we do,
    follows the typical intelligence axiom when you ask which type of reasoning is
    the best: it depends. Like your trips in the car, which type of reasoning you
    use depends on what you''re trying to accomplish, which is fine. The issue is
    when you don''t know why you chose the approach you have. The fact is, in a lot
    of cases analysts do the same thing, without really thinking about why (kind of
    like when you drive somewhere on mental autopilot). In a lot of cases, analysts
    (both intelligence and security) do the same kind of reasoning the same way. You
    may even do it yourself. So, take a step back, and let''s think about how we solve
    problems and why we should reconsider different approaches.


    ### Deductive Reasoning


    > **Deduction**: the deriving of a conclusion by reasoning specifically: [inference](https://www.merriam-webster.com/dictionary/inference)
    in which the conclusion about particulars follows necessarily from general or
    universal premises

    >

    > [Merriam Webster, Definition 2a.](https://www.merriam-webster.com/dictionary/deduction)


    Made famous by everyone''s favorite detective, Sherlock Holmes, deduction isn''t
    usually what people think it is. In short, a deduction is always based on universally
    accepted premises. Another way to think about it is starting with an idea, making
    an observation or series of observations on causes, and then making a conclusion
    about the expected effect.


    Deductions are often very direct and simple, not what we think of in investigations.
    For example, think back to high school geometry. One rule of geometry is that
    the internal angles of all triangles add up to 180 degrees. If you have a triangle
    with two 45 degree angles then you can deduce, based on the 180 degree rule, that
    the 3rd angle must be 90 degrees (you could go one step further given another
    rule that any triangle with a 90 degree angle is a right triangle and say this
    must be a right triangle as well).


    While the Baker Street resident sleuth likes to reference it a lot, most detectives
    aren''t deducing their cases. In most examples of deduction there are both simple
    premises and nearly perfect information. Deductions are often useful for understanding
    basic life but not for investigations. We rarely have enough perfect information
    and can rarely make universal rules.


    ### Inductive Reasoning


    > **Induction**: inference of a generalized conclusion from particular instances

    >

    > [Merriam Webster, Definition 2a.](https://www.merriam-webster.com/dictionary/induction)


    The first, and most commonly seen reasoning method in most investigations is induction.
    Induction is a circumstance where you start with a pile of data, maybe a singular
    example, maybe a few different examples, and work out a rule that fits all the
    data. You could simplify this down to induction being the process of using a specific
    set of cause and effect relationships to build a generalized rule.


    Inductive reasoning is often a shortcut. For example, say you have a new coworker
    who has a peanut butter and jelly sandwich for their lunch on their first Monday.
    They have the same peanut butter and jelly sandwich on Tuesday, Wednesday, and
    Thursday. So, what about Friday? Well, inductive reasoning may lead you to say
    "obviously, they eat peanut butter and jelly sandwiches every day, so clearly
    they''ll eat a peanut butter and jelly sandwich on Friday as well", and maybe
    they do, but your new coworker asks others if they want to go out to lunch for
    Friday.


    Inductive reasoning always benefits from more information as it makes it possible
    to further refine the theories you''re matching against. These inductive theories
    are only as good as the data available, but this imperfect data also makes it
    possible to come up with generalizations that aren''t 100% correct, such as assuming
    our coworker would follow four days of one lunch with a fifth. After the first
    week, we might refine our theory to assume they always eat lunch out on Fridays,
    but after a second week, that could change again if you find out they only went
    out that first Friday to meet coworkers. So, you might need to refine it again.
    This often manifests as "correlation doesn''t equal causation".


    The more data, the better the theories will be, but this is a challenge in security
    investigations. It''s impossible to know how much data we have, whether we can
    see 10% or 100%. It''s impossible to know how good our theories are, and dangerous
    to assume they''re too good. We see this happen a lot using link analysis tools
    such as Maltego. People will often throw data on a force directed graph and start
    making inductive theories. This can often be something as simple as looking at
    network flows in a graph and assuming the node with the most connections must
    be the most important. Is it? Well... sometimes it is, but ask any malware analyst
    how many pieces of malware reach out to [google.com](http://google.com) or [microsoft.com](http://microsoft.com)
    to verify internet connectivity? Does that mean those are bad websites? Clearly
    not.


    ### Abductive Reasoning

    '

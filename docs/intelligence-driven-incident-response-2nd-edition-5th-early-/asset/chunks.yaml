    # Axiom Group and SolarWinds Case Studies


    For more than six years, a group of attackers known as the Axiom Group stealthily
    targeted, infiltrated, and stole information from Fortune 500 companies, journalists,
    nongovernmental organizations, and a variety of other organizations. The group
    used sophisticated tools, and the attackers went to great lengths to maintain
    and expand access within the victims'' networks. As malware was detected and the
    incident-response process began within various victim organizations, coordinated
    research on one of the malware families used by this group identified that the
    issue was far more complex than originally thought. As more industry partners
    became involved and exchanged information, patterns began to emerge that showed
    not just malware behavior, but the behaviors of a threat actor group working with
    clear guidance. Strategic intelligence was identified, including regions and industries
    targeted.


    This was an excellent example of the intelligence cycle at work in an incident-response
    scenario. Not only was information collected, processed, and analyzed, but it
    was disseminated in such a way as to generate new requirements and feedback, starting
    the process over again until the analysts had reached a solid conclusion and could
    act with decisiveness, eradicating 43,000 malware installations at the time that
    the report was published. The published report, also part of the dissemination
    phase, allowed incident responders to better understand the tactics and motivations
    of this actor group.


    ## SolarWinds


    In December of 2020, news broke of a massive intrusion at the Texas-based company
    SolarWinds, which makes software for monitoring and managing IT networks and is
    a very popular tool in many large networks, including cybersecurity companies,
    governments, and Fortune 500 companies. The activity was detected after the cybersecurity
    firm FireEye, a SolarWinds customer, identified that their networks had been compromised
    and a set of tools they developed for identifying intrusions had been accessed
    by an unknown entity. Their own investigation into the intrusion on their network
    led them to identify SolarWinds as the source of the intrusion.


    Their analysis indicated that the SolarWinds'' networks had been compromised in
    late 2019 and their software tampered with, so that a software update that was
    pushed to all its clients contained a backdoor that would allow the adversaries
    access to those networks as well. This was not the first software-based supply
    chain attack; however it was notable for its size and scale - estimates suggested
    that over 18,000 of SolarWinds'' customers were impacted. It was also notable
    for its response, which, 20 years after Moonlight Maze, showed how far cyber threat
    intelligence has come as a discipline. Once identified, FireEye published a blog
    post with details about the incident and ways for others to detect activity on
    their network. Additional teams jumped in to analyze activity on their networks
    and continued to share indicators and findings, both publicly and through established
    threat sharing groups, allowing a picture of the overall attack to quickly develop.
    The Department of Homeland Security published guidance on supply chain attacks,
    taking the response from a mentality of just reacting to one isolated incident
    to and how it can help not only the organizations directly impacted but help to
    surface important lessons for others.


    Both the Axiom Group attacks and the SolarWinds software supply chain intrusion
    were information-seeking, espionage-related attacks, but nation-state sponsored
    attackers aren''t the only thing that incident responders have to worry about.
    Financially motivated criminal activity is also evolving, and those actors are
    also working hard to stay ahead of defenders and incident responders. One of the
    most significant tactic changes for financially motivated criminals in recent
    years is the move to ransomware. Ransomware attacks use tools to encrypt data
    on a network and then charge a ransom for the key to decrypt the data. The concept
    of ransomware has been around for decades; however its usage has increased drastically
    since 2012, along with its impact. Although ransomware attacks do not always involve
    strategic and coordinated attacks against multiple organizations, the groups executing
    ransomware attacks often target different victims using the same tactics, toolsets,
    and often even targeting information. Defenders working against these financially
    motivated attacks can also leverage intelligence-driven incident response to identify
    early indications that their networks have been breached by these actors before
    the actual encryption process has begun.


    # Conclusion


    Despite the many advances in the computer security field, attackers continue to
    adapt - but they do not have to outpace defenders. Intelligence-driven incident
    response allows us to learn from attackers; to identify their motivations, processes,
    and behaviors; to identify their activities even as they seek to outwit our defenses
    and detection methods. The more we know about attackers, the better we can prevent,
    detect, and respond to their actions.


    We have reached the point where a structured and repeatable process for implementing
    intelligence in the incident-response process is necessary, and this book aims
    to provide insight into that process. Throughout this book, we provide various
    models and methods that can be viewed as the building blocks of intelligence-driven
    incident response, as well as the background as to why these models are beneficial
    to and integrate with incident response. There is no one-size-fits-all approach.
    In many cases, the incident or the organization will dictate which specific combination
    of models and approaches fits best. Understanding the foundational principles
    of intelligence and incident response, as well as the specific methods for integrating
    them, will allow you to build a process for intelligence-driven incident response
    that will work for you and to develop that process to meet the needs of your organization.


    ## Sources


    - <https://www.fbi.gov/news/stories/morris-worm-30-years-since-first-major-attack-on-internet-110218>

    - <https://www.sciencedirect.com/topics/computer-science/moonlight-maze>

    - <https://www.mandiant.com/resources/evasive-attacker-leverages-solarwinds-supply-chain-compromises-with-sunburst-backdoor>

    - <https://threatpost.com/solarwinds-attackers-new-tactics-malware/176818/>

    - Marcus Willett (2021) Lessons of the SolarWinds Hack, Survival, 63:2, 7-26,
    DOI: <https://doi-org.ezproxy2.apus.edu/10.1080/00396338.2021.1906001>

    - <http://www.novetta.com/wp-content/uploads/2014/11/Executive_Summary-Final_1.pdf>


    # Chapter 2. Basics of Intelligence


    > It consists of gathering facts. … It consists of forming hypotheses on the basis
    of these facts, of testing these hypotheses for traces of one''s own ignorance
    or bias, of cleansing them if possible. The goal is to build better hypotheses
    than already exist and to establish them as relatively more true: it is to reveal
    a sharper picture of what happened and to make a closer approach to actuality
    than anyone has yet contrived.

    >

    > — Sherman Kent


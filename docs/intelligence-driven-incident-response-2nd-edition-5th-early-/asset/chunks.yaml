    # Intelligence Collection Disciplines


    ## HUMINT (Human Intelligence)


    Human-source intelligence is derived from humans, either through covert or clandestine
    methods or from overt collection such as from diplomats. Human-source intelligence
    is the oldest form of intelligence collection. There is serious debate about whether
    cyber-threat intelligence can be derived from HUMINT, however there is a growing
    body of evidence to suggest that HUMINT can be a crucial part of the story. One
    example is interviews or conversations with individuals who are involved with
    or have firsthand knowledge of intrusions, such as when researchers from `Kaspersky
    Labs` were able to connect with a systems administrator from a network compromised
    as part of `Moonlight Maze`. Not only did the sysadmin give inside information
    and perspective that only a person who experienced an intrusion can, he also provided
    access to a server from the intrusion that had been sitting under his desk - HUMINT
    can often lead to additional data collection. Another example that many describe
    as HUMINT is information gained from interactions with individuals via restricted
    or members-only online forums. This type of intelligence gathering could also
    be considered SIGINT, as it is derived from electronic communications.


    ## SIGINT (Signals Intelligence)


    Signals intelligence includes intelligence derived from the interception of signals,
    including communications intelligence (COMINT), electronic intelligence (ELINT),
    and foreign instrumentation signals intelligence (FISINT). Most technical intelligence
    collection falls under SIGINT, because after all, computers function using electronic
    signals, so anything derived from a computer or other networking device could
    be considered SIGINT.


    ## OSINT (Open Source Intelligence)


    Open source intelligence is gathered from publicly available sources, including
    news, social media, and commercial databases as well as a variety of other nonclassified
    sources. We discussed previously that intelligence analysis, including cyber threat
    intelligence, involves some aspect of secrecy. This does not mean, however, that
    ALL intelligence sources must be secret. Published reports on cyber-security threats
    is one type of OSINT that can be incredibly useful in intelligence analysis. When
    dealing with government-backed actors, publications that detail the organizational
    structure of that government’s offensive cyber forces can provide a wealth of
    knowledge. OSINT can also help reveal technical details about things like IP addresses
    or domain names that are publicly accessible; for example, a `WHOIS` query detailing
    who registered a malicious domain.


    ## IMINT (Imagery Intelligence)


    Imagery intelligence is collected from visual representations, including photography
    and radar. IMINT is not typically a source of cyber-threat intelligence, however
    there are always cases where visual representations can provide critical information,
    such as the ability to watch troop movements during large scale, government-backed
    denial of service attacks, as were previously seen with the Russia and Georgia
    conflict.[^1]


    ## MASINT (Measurement and Signature Intelligence)


    Measurement and signature intelligence is gathered from technical means, excluding
    signal and imagery. MASINT often includes signatures from nuclear, optical, radio
    frequency, acoustics, and seismic signatures. As MASINT specifically excludes
    signals intelligence, it is also not a typical source of cyber-threat intelligence.


    ## GEOINT (Geospatial Intelligence)


    Geospatial intelligence is collected from geospatial data, including satellite
    and reconnaissance imagery, maps, `GPS` data, and other sources of data related
    to locations. Some organizations consider IMINT to be a part of GEOINT, and some
    believe it is a separate discipline. Similar to IMINT, GEOINT is not a typical
    source of cyber-threat intelligence, but it can provide contextual information
    on threats to help you understand how attackers may use the cyber domain to achieve
    their goals.


    ## Other Intelligence Disciplines


    At this point, many would bring up a variety of other INTs that have popped up
    over the years, including `CYBINT`, `TECHINT`, `FININT`, and the most recent one
    we found - `CyberHumint` - but most of these new terms are already covered by
    other intelligence-collection methods. For example, cyber intelligence is primarily
    derived from `ELINT` and `SIGINT`. It is not important to get into an argument
    about the number of INTs in existence; the important thing is to understand the
    source of the data. At the end of the day, if it helps to refer to a specific
    collection type as its own INT, then go ahead; just be prepared to deal with the
    eventual terminology conflicts that tend to pop up in this field.


    ## Cyber Threat Intelligence Specific Collection Methods


    In addition to the traditional intelligence-collection disciplines listed here,
    some collection methods are often utilized specifically in cyber threat intelligence.
    It is useful to have a solid understanding of where this specific threat data
    comes from:


    ### Incidents and Investigations


    This data is collected from the investigation of data breaches and incident-response
    activities. This is often one of the richest data sets used in cyber-threat intelligence
    because investigators are able to identify multiple aspects of the threat, including
    the tools and techniques that are used, and often can identify the intent and
    motivation behind the intrusion.


    ### Honey Pots and Honey Nets


    These devices are set up to emulate machines or entire networks and gather information
    about interactions with these devices. There are many types of honey pots: low
    interaction, high interaction, internal honeypots, and honeypots on the public
    internet. Honeypot information can be useful as long as you know the type of honeypots
    it comes from, what they were monitoring for, and the nature of the interactions.
    Traffic gathered from a honeypot that captures exploit attempts or attempts to
    install malware on a system are far more useful in analysis than scanning or web-scrapping
    traffic.


    ### Forums and Websites


    A variety of companies claim to have deep web or dark web collections. In many
    cases, these companies are referring to forums and chatrooms with restricted access
    that are not easily accessible from the internet. In these forums and sites, individuals
    often exchange information that is valuable after it’s analyzed. There are so
    many of these types of sites that it is nearly impossible for any one company
    to have complete coverage of `the dark net`, so be aware that the collection is
    often limited in scope and will differ from that of other companies that claim
    to have similar data.


    Even these techniques are new iterations of common techniques of the past. What’s
    old is new as technology evolves, and intelligence is no different. The philosopher
    George Santayana’s missive about forgetting the past is as true as ever.


    # Models


    ## The Role of Models


    Models are a critical tool in the analyst’s toolkit. Without models, many analysts
    would not be able to keep up with the quantity of data that exists in the world
    or the requirements that they provide meaning around this data. They would struggle
    to synthesize the information that they collected from all the various sources
    we just discussed and make meaning and insight that are relevant to decision makers.


    ## Types of Models: Mental and Conceptual


    One of the best working definitions of models for intelligence purposes comes
    from the book *Quantitative Intelligence Analysis* - “Models refer to the cognitive,
    conceptual, mathematical, physical, or otherwise logical representation of systems,
    entities, phenomena, or processes.” The two most common types of models used in
    cyber threat intelligence are mental models and conceptual models. Mental models
    are cognitive models that hold an analyst’s perception of reality. Even when analysts
    have gone through similar courses of formalized training, their mental models
    may be very different because of the many diverse ways that individuals perceive
    and process information.


    [^1]: [1](#ch02.html#idm46530565004560)

    '

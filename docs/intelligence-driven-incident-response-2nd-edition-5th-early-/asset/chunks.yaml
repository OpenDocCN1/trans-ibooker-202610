    \ this is made up of the 4Rs:\n\nResistance\n\n: \n\nHow well do you keep the\
    \ threat out?\n\nRetention\n\n: \n\nHow can you keep the systems core functions\
    \ going during disruption?\n\nRecovery\n\n: \n\nHow quickly can you get the systems\
    \ core functions to bounce back?\n\nResurgence\n\n: \n\nHow do you make a system\
    \ stronger and smarter after the disruption?\n\nOnly one of these, resistance,\
    \ is *left of boom*, before exploitation. The rest come after the adversary has\
    \ started to gain control. The result is these come at the point where, through\
    \ intelligence, we can use past knowledge to anticipate what steps an adversary\
    \ will take and prepare to respond to them.\n\n### Privacy, Safety, and Physical\
    \ Security\n\nHuman systems have vulnerabilities, threats, and need resilience\
    \ as well. Many of these challenges are amplified by technology, and while technology\
    \ can’t solve these problems it is incumbent on us to build systems that don’t\
    \ exacerbate them. This ends up being wildly specific to the system, and outside\
    \ the scope of this book, but is certainly worth keeping in mind. It’s a different\
    \ sort of system, but it can still benefit from the same kind of decision support\
    \ from a strategic level threat intelligence.\n\nNow that we understand more about\
    \ the role of strategic intelligence in intelligence-driven incident response\
    \ and beyond, we can move onto the hard part - actually conducting and leveraging\
    \ strategic analysis.\n\n## Building a Frame with Strategic Intelligence\n\nDaniel\
    \ Kahneman and Amos Tversky, whose [groundbreaking research](http://www.stat.columbia.edu/~gelman/surveys.course/TverskyKahneman1981.pdf)\
    \ on framing and decision making has had a far-reaching impact on fields such\
    \ as psychology and economics, advocate for building what they call a “broad frame”\
    \ for making decisions. In a talk to the CFA Institute’s Conference, Kahneman\
    \ urged that we should “see a decision as a member of a class of decisions that\
    \ you’ll probably have to make” rather than a single, stand-alone decision.\n\n\
    A traditional “frame” in intelligence analysis is viewed like a picture frame\
    \ on the wall. Everything you are looking at is contained within the frame, and\
    \ the viewer is outside, looking in. Framing is a way of defining what it is you\

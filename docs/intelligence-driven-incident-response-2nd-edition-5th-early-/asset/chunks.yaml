- raw: "Domains\n\n: \n\nFew network connections go directly to IP addresses, so most\
    \ adversaries use domain names. Some domains are chosen as specific lures or confuse\
    \ analysts, meant to mimic or seem similar to other recognizable domains (such\
    \ as using homography attacks such as using a lowercase L in place of a capital\
    \ I).\n\nEmail Addresses\n\n: \n\nPhishing is the first, and most obvious usage\
    \ of email by adversaries. These email addresses are usually built to be throw\
    \ away or limited use and like domains may emulate related domains or even specific\
    \ people. Email addresses are also required to set up other infrastructure, to\
    \ put in certificates, and even to associate with payment sending and receiving\
    \ methods like cryptocurrency.\n\n## Delivery\n\nOnce the adversary has gathered\
    \ enough information to craft an attack, the next kill chain stage is Delivery.\
    \ Common delivery scenarios include but are not limited to the following:\n\n\
    Spear Phishing\n\n: \n\nThe adversary sends a weaponized exploit, either as an\
    \ attachment or as a link, via direct communications (often email) to a specific\
    \ target. The communication is usually crafted to appear legitimate and reduce\
    \ suspicion in the mind of the targeted user. In recent years adversaries have\
    \ also leveraged instant messaging platforms and SMS to send communications with\
    \ a malicious link to users.\n\nService Exploitation\n\n: \n\nA common group of\
    \ vectors in the early 2000s direct exploitation of web facing services has reared\
    \ its head again. In these cases, adversaries find a vulnerability in a web facing\
    \ service, such as a web application or virtual private network, and attack that\
    \ directly. In many cases these are commodity systems (such as Chinese-nexus adversaries\
    \ compromising Pulse VPN - [https://www.mandiant.com/resources/suspected-apt-actors-leverage-bypass-techniques-pulse-secure-zero-day](https://www.mandiant.com/resources/suspected-apt-actors-leverage-bypass-techniques-pulse-secure-zero-day)).\
    \ While some of these attacks are highly targeted, vulnerabilities like Shellshock\
    \ and Log4J have been widely exploited.\n\nStrategic Web Compromise (Watering\
    \ Hole)\n\n: \n\nIn a two-stage attack, often based on a previous service exploitation\
    \ scenario, the adversary first compromises a secondary resource, usually a website\
    \ the intended target is likely to use, and places a browser or media exploit\
    \ on it. The assumption is that the target, usually focused at an entire group\
    \ rather than a specific individual, will visit the site, becoming compromised.\n\
    \nThe key to delivery is how simple it is: it’s just getting the payload to the\
    \ victim. This simplicity belies the importance of this stage. Delivery is the\
    \ first necessarily active stage on the part of the adversary to the victim. While\
    \ the previous stages can (in the case of Targeting and Reconnaissance) be active,\
    \ Delivery is the first case where an adversary *must* be active, which often\
    \ results in something the victim (either the intended target or the security\
    \ team) could detect. This means delivery is the first case where a victim is\
    \ guaranteed to have indicators of compromise and adversary tactics, techniques,\
    \ and procedures to build from. In the case of spear phishing, this may be email\
    \ artifacts such as headers and an email address, while for SQL injection it may\
    \ be an IP address that initiated the web server/database connections.\n\n## Exploitation\n\
    \nUnderstanding the difference between delivery and exploitation can be challenging.\
    \ Up through the start of delivery, the adversary has not had direct interaction\
    \ with the target and does not have any control of the targeted system. Even in\
    \ the case of a spear phishing email, it is possible that security measures will\
    \ prevent successful delivery, so even though there was delivery, there was no\
    \ actual exploitation. Exploitation is the point where the adversary’s gain control\
    \ of code execution and begin executing their own code.\n\nIn a watering hole\
    \ attack, this takes place the second a victim hits an infected page. For the\
    \ spear phishing attack, this is when the victim clicks on a malicious attachment\
    \ or link. From this point forward, the adversary has control of at least one\
    \ process on the target’s system. This foothold is the start of the adversary’s\
    \ move into the network.\n\nExploitation is a massive topic unto itself to the\
    \ point it has its own specialists (and indeed its own companies, market places,\
    \ and even economy). For a deeper understanding take a look at:\n\n*   [The Shellcoder’s\
    \ Handbook - 2+ Edition](https://www.goodreads.com/book/show/1174511.The_Shellcoder_s_Handbook?ac=1&from_search=true&qid=bOCHnNGKPA&rank=1)\
    \ by Jack Koziol, Chris Anley, and John Heasman\n\n*   [The Ida Pro Book](https://www.goodreads.com/book/show/3004460-the-ida-pro-book?from_search=true&from_srp=true&qid=SrY3kR5hSP&rank=1)\
    \ by Chris Eagle\n\n*   [Real World Bug Hunting](https://www.goodreads.com/book/show/35545851-real-world-bug-hunting?from_search=true&from_srp=true&qid=DF9uclWR3D&rank=1)\
    \ by Peter Yaworski\n\n*   [A Guide to Kernel Exploitation](https://www.goodreads.com/book/show/9224826-a-guide-to-kernel-exploitation?from_search=true&from_srp=true&qid=LMXQzQLd7c&rank=1)\
    \ Enrico Perla and Massimiliano Oldani\n\n## Installation\n\nGetting initial execution\
    \ is often difficult and not something an adversary wants to do multiple times.\
    \ Once adversaries have code execution, their first move is typically to solidify\
    \ their access by creating a permanent foothold. The Lockheed Martin Kill Chain\
    \ paper describes this in the following way: “Installation of a remote-access\
    \ Trojan or backdoor on the victim system allows the adversary to maintain persistence\
    \ inside the environment.” While this is what the adversary usually does at this\
    \ stage, we find it useful to look at these actions as establishing system or\
    \ network persistence (in many cases, the adversary will do both, but it still\
    \ helps to consider them separately).\n\n### System persistence\n\nAt this point,\
    \ the adversary has code execution on a single system, and likely just a single\
    \ process at that. This is a useful start, but it doesn’t persist past a reboot.\
    \ A shutdown of the compromised application may even remove their access.\n\n\
    Most adversaries begin by solidifying their hold on a small number of hosts by\
    \ deploying a rootkit or remote-access trojan (RAT) style of implant. A rootkit\
    \ establishes kernel-level access to a system and, once installed, permits an\
    \ adversary to evade many detection methods of the underlying OS. A RAT is a piece\
    \ of remote-control software meant to persist past reboots and without relying\
    \ on a certain exploit. This allows the adversary to persist on an individual\
    \ host.\n\n### Network persistence\n\nThe vast majority of adversaries aren’t\
    \ content to establish a single-system foothold. Instead, they want to establish\
    \ deeper persistence. To do so, they’ll typically establish a wider footprint,\
    \ using one (or both) of two techniques:\n\nEstablish system persistence on multiple\
    \ systems\n\n: \n\nThis means using captured credentials and installing RATs or\
    \ similar access methods on other systems. An adversary has a variety of options\
    \ for this, from custom software to native tools such as PsExec in Windows or\
    \ SSH in \\*nix environments.\n\nGathering credentials that allow access to broadly\
    \ utilized network resources without accessing a system on the network\n\n: \n\
    \nThis often means VPNs, cloud services, or other internet-exposed systems such\
    \ as web mail. This lowers the risk of detection in many cases and doesn’t require\
    \ a form of malware, instead using native tools.\n\nThese techniques can be used\
    \ individually or together. This combination of techniques is often a signature\
    \ set of techniques for most adversaries.\n\n## Command and Control"
  fmt: '

    # Domains


    Few network connections go directly to IP addresses, so most adversaries use domain
    names. Some domains are chosen as specific lures or confuse analysts, meant to
    mimic or seem similar to other recognizable domains (such as using homography
    attacks such as using a lowercase L in place of a capital I).


    # Email Addresses


    Phishing is the first, and most obvious usage of email by adversaries. These email
    addresses are usually built to be throw away or limited use and like domains may
    emulate related domains or even specific people. Email addresses are also required
    to set up other infrastructure, to put in certificates, and even to associate
    with payment sending and receiving methods like cryptocurrency.


    ## Delivery


    Once the adversary has gathered enough information to craft an attack, the next
    kill chain stage is Delivery. Common delivery scenarios include but are not limited
    to the following:


    ### Spear Phishing


    The adversary sends a weaponized exploit, either as an attachment or as a link,
    via direct communications (often email) to a specific target. The communication
    is usually crafted to appear legitimate and reduce suspicion in the mind of the
    targeted user. In recent years adversaries have also leveraged instant messaging
    platforms and SMS to send communications with a malicious link to users.


    ### Service Exploitation


    A common group of vectors in the early 2000s direct exploitation of web facing
    services has reared its head again. In these cases, adversaries find a vulnerability
    in a web facing service, such as a web application or virtual private network,
    and attack that directly. In many cases these are commodity systems (such as Chinese-nexus
    adversaries compromising Pulse VPN - <https://www.mandiant.com/resources/suspected-apt-actors-leverage-bypass-techniques-pulse-secure-zero-day>).
    While some of these attacks are highly targeted, vulnerabilities like Shellshock
    and Log4J have been widely exploited.


    ### Strategic Web Compromise (Watering Hole)


    In a two-stage attack, often based on a previous service exploitation scenario,
    the adversary first compromises a secondary resource, usually a website the intended
    target is likely to use, and places a browser or media exploit on it. The assumption
    is that the target, usually focused at an entire group rather than a specific
    individual, will visit the site, becoming compromised.


    The key to delivery is how simple it is: it''s just getting the payload to the
    victim. This simplicity belies the importance of this stage. Delivery is the first
    necessarily active stage on the part of the adversary to the victim. While the
    previous stages can (in the case of Targeting and Reconnaissance) be active, Delivery
    is the first case where an adversary *must* be active, which often results in
    something the victim (either the intended target or the security team) could detect.
    This means delivery is the first case where a victim is guaranteed to have indicators
    of compromise and adversary tactics, techniques, and procedures to build from.
    In the case of spear phishing, this may be email artifacts such as headers and
    an email address, while for SQL injection it may be an IP address that initiated
    the web server/database connections.


    ## Exploitation


    Understanding the difference between delivery and exploitation can be challenging.
    Up through the start of delivery, the adversary has not had direct interaction
    with the target and does not have any control of the targeted system. Even in
    the case of a spear phishing email, it is possible that security measures will
    prevent successful delivery, so even though there was delivery, there was no actual
    exploitation. Exploitation is the point where the adversary''s gain control of
    code execution and begin executing their own code.


    In a watering hole attack, this takes place the second a victim hits an infected
    page. For the spear phishing attack, this is when the victim clicks on a malicious
    attachment or link. From this point forward, the adversary has control of at least
    one process on the target''s system. This foothold is the start of the adversary''s
    move into the network.


    Exploitation is a massive topic unto itself to the point it has its own specialists
    (and indeed its own companies, market places, and even economy). For a deeper
    understanding take a look at:


    - [The Shellcoder''s Handbook - 2+ Edition](https://www.goodreads.com/book/show/1174511.The_Shellcoder_s_Handbook?ac=1&from_search=true&qid=bOCHnNGKPA&rank=1)
    by Jack Koziol, Chris Anley, and John Heasman

    - [The Ida Pro Book](https://www.goodreads.com/book/show/3004460-the-ida-pro-book?from_search=true&from_srp=true&qid=SrY3kR5hSP&rank=1)
    by Chris Eagle

    - [Real World Bug Hunting](https://www.goodreads.com/book/show/35545851-real-world-bug-hunting?from_search=true&from_srp=true&qid=DF9uclWR3D&rank=1)
    by Peter Yaworski

    - [A Guide to Kernel Exploitation](https://www.goodreads.com/book/show/9224826-a-guide-to-kernel-exploitation?from_search=true&from_srp=true&qid=LMXQzQLd7c&rank=1)
    by Enrico Perla and Massimiliano Oldani


    ## Installation


    Getting initial execution is often difficult and not something an adversary wants
    to do multiple times. Once adversaries have code execution, their first move is
    typically to solidify their access by creating a permanent foothold. The Lockheed
    Martin Kill Chain paper describes this in the following way: "Installation of
    a remote-access Trojan or backdoor on the victim system allows the adversary to
    maintain persistence inside the environment." While this is what the adversary
    usually does at this stage, we find it useful to look at these actions as establishing
    system or network persistence (in many cases, the adversary will do both, but
    it still helps to consider them separately).


    ### System Persistence


    At this point, the adversary has code execution on a single system, and likely
    just a single process at that. This is a useful start, but it doesn''t persist
    past a reboot. A shutdown of the compromised application may even remove their
    access.


    Most adversaries begin by solidifying their hold on a small number of hosts by
    deploying a rootkit or remote-access trojan (RAT) style of implant. A rootkit
    establishes kernel-level access to a system and, once installed, permits an adversary
    to evade many detection methods of the underlying OS. A RAT is a piece of remote-control
    software meant to persist past reboots and without relying on a certain exploit.
    This allows the adversary to persist on an individual host.


    ### Network Persistence


    The vast majority of adversaries aren''t content to establish a single-system
    foothold. Instead, they want to establish deeper persistence. To do so, they''ll
    typically establish a wider footprint, using one (or both) of two techniques:


    #### Establish System Persistence on Multiple Systems


    This means using captured credentials and installing RATs or similar access methods
    on other systems. An adversary has a variety of options for this, from custom
    software to native tools such as `PsExec` in Windows or `SSH` in \*nix environments.


    #### Gather Credentials for Broad Network Resource Access


    This often means VPNs, cloud services, or other internet-exposed systems such
    as web mail. This lowers the risk of detection in many cases and doesn''t require
    a form of malware, instead using native tools.


    These techniques can be used individually or together. This combination of techniques
    is often a signature set of techniques for most adversaries.


    ## Command and Control

    '
  trans: '


    # 域名


    极少数网络连接直接指向 IP 地址，因此大多数攻击者使用域名。某些域名被选作特定的诱饵或用于迷惑分析师，旨在模仿或看起来与其他可识别的域名相似（例如使用同形异义攻击，如用小写字母
    l 代替大写字母 I）。


    # 电子邮件地址


    网络钓鱼是攻击者利用电子邮件的首要且最明显的方式。这些电子邮件地址通常构建为一次性或限时使用，并且像域名一样可能模仿相关域名甚至特定人物。电子邮件地址也是建立其他基础设施、嵌入证书，甚至关联加密货币等支付收发方式所必需的。


    ## 投递


    一旦攻击者收集了足够的信息来构建攻击，杀伤链的下一阶段就是投递。常见的投递场景包括但不限于以下内容：


    ### 定向钓鱼


    攻击者通过直接通信（通常是电子邮件）向特定目标发送武器化的漏洞利用代码，形式为附件或链接。该通信通常经过精心设计，使其看起来合法，从而降低目标用户的戒备心理。近年来，攻击者还利用即时通讯平台和短信向用户发送包含恶意链接的通信。


    ### 服务漏洞利用


    2000 年代初常见的一类直接利用面向 Web 的服务的攻击向量再次抬头。在这些情况下，攻击者发现面向 Web 的服务（如 Web 应用程序或虚拟专用网络）中的漏洞，并直接发起攻击。在许多情况下，这些是通用系统（例如中国关联攻击者入侵
    Pulse VPN - <https://www.mandiant.com/resources/suspected-apt-actors-leverage-bypass-techniques-pulse-secure-zero-day>）。虽然其中一些攻击高度定向，但像
    Shellshock 和 Log4J 这样的漏洞已被广泛利用。


    ### 战略性网站入侵（水坑攻击）


    在一种两阶段攻击中，通常基于之前的服务漏洞利用场景，攻击者首先入侵一个次级资源（通常是预期目标可能会使用的网站），并在其上植入浏览器或媒体漏洞利用代码。其假设是目标（通常针对整个群体而非特定个人）会访问该网站，从而被攻陷。


    投递的关键在于其简单性：仅仅是将有效载荷传递给受害者。这种简单性掩盖了该阶段的重要性。投递是攻击者对受害者采取的第一个必然的主动阶段。虽然之前的阶段（在目标选择和侦察的情况下）可以是主动的，但投递是攻击者*必须*主动的第一种情况，这往往会导致受害者（无论是预期目标还是安全团队）能够检测到的痕迹。这意味着投递是受害者保证拥有妥指标和攻击者战术、技术与流程以供分析的第一种情况。在定向钓鱼的情况下，这可能是邮件头和电子邮件地址等邮件工件，而对于
    SQL 注入，这可能是发起 Web 服务器/数据库连接的 IP 地址。


    ## 漏洞利用


    理解投递和漏洞利用之间的区别可能具有挑战性。在投递开始之前，攻击者未与目标有过直接交互，也不控制目标系统。即使在定向钓鱼邮件的情况下，安全措施也可能阻止成功投递，因此即使发生了投递，也未发生实际的漏洞利用。漏洞利用是攻击者获得代码执行控制权并开始执行其自身代码的时刻。


    在水坑攻击中，这发生在受害者访问受感染页面的那一刻。对于定向钓鱼攻击，这是受害者点击恶意附件或链接的时刻。从这一点开始，攻击者控制了目标系统上至少一个进程。这个立足点是攻击者横向移动进入网络的起点。


    漏洞利用本身就是一个庞大的主题，以至于拥有自己的专家（甚至拥有自己的公司、市场和经济体系）。如需深入了解，请参阅：


    - [The Shellcoder''s Handbook - 2+ Edition](https://www.goodreads.com/book/show/1174511.The_Shellcoder_s_Handbook?ac=1&from_search=true&qid=bOCHnNGKPA&rank=1)
    by Jack Koziol, Chris Anley, and John Heasman

    - [The Ida Pro Book](https://www.goodreads.com/book/show/3004460-the-ida-pro-book?from_search=true&from_srp=true&qid=SrY3kR5hSP&rank=1)
    by Chris Eagle

    - [Real World Bug Hunting](https://www.goodreads.com/book/show/35545851-real-world-bug-hunting?from_search=true&from_srp=true&qid=DF9uclWR3D&rank=1)
    by Peter Yaworski

    - [A Guide to Kernel Exploitation](https://www.goodreads.com/book/show/9224826-a-guide-to-kernel-exploitation?from_search=true&from_srp=true&qid=LMXQzQLd7c&rank=1)
    by Enrico Perla and Massimiliano Oldani


    ## 安装


    获得初始执行通常很困难，也不是攻击者愿意重复多次的事情。一旦攻击者获得代码执行权限，他们的第一步通常是通过创建永久立足点来巩固访问权限。洛克希德·马丁杀伤链论文对此描述如下：“在受害者系统上安装远程访问木马或后门，允许攻击者在环境中保持持久性。”虽然这是攻击者在此阶段通常所做的，但我们发现将这些行为视为建立系统或网络持久性很有用（在许多情况下，攻击者两者都会做，但分别考虑它们仍然有帮助）。


    ### 系统持久性


    此时，攻击者在单个系统上获得了代码执行权限，且可能仅限于单个进程。这是一个有用的开端，但无法在重启后持久存在。受损应用程序的关闭甚至可能移除他们的访问权限。


    大多数攻击者首先通过部署 Rootkit 或远程访问木马（RAT）风格的植入程序，来巩固他们对少量主机的控制。Rootkit 建立对系统的内核级访问，一旦安装，允许攻击者规避底层操作系统的许多检测方法。RAT
    是一种远程控制软件，旨在持久化以度过重启，且不依赖特定漏洞。这使攻击者能够在单个主机上持久化。


    ### 网络持久性


    绝大多数攻击者不满足于建立单系统立足点。相反，他们想要建立更深层的持久性。为此，他们通常会建立更广泛的足迹，使用以下两种技术中的一种（或两者兼用）：


    #### 在多个系统上建立系统持久性


    这意味着使用窃取的凭证，在其他系统上安装 RAT 或类似的访问方法。攻击者有多种选择，从定制软件到原生工具，如 Windows 中的 `PsExec` 或
    \*nix 环境中的 `SSH`。


    #### 收集凭证以实现广泛的网络资源访问


    这通常意味着 VPN、云服务或其他面向互联网的系统，如 Web 邮箱。这在许多情况下降低了被检测的风险，且不需要恶意软件形式，而是使用原生工具。


    这些技术可以单独使用，也可以组合使用。这种技术组合通常是大多数攻击者的标志性技术集。


    ## 命令与控制



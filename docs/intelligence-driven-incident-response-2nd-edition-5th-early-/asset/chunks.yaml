- raw: 'After the assumptions around evidence that supports a hypothesis have been
    evaluated and biases accounted for, the analyst can move toward making their judgment
    and conclusion about the hypothesis. Analysts can use several methods to interpret
    the evidence and identify whether a hypothesis is likely to be true or not, or
    whether they need to generate a new hypothesis either in part or in its entirety.
    Judgement is the step where analysts have to depart from what is known and use
    their knowledge, experience, and logic to fill in any gaps in known information
    to answer the questions that are facing them. Structured Analytic Techniques and
    Target-Centric Analysis can both help you get to a place where you know clearly
    the limits of your evidence and what it is telling you, understand your assumptions
    and conjectures and how confident you are in your validity, and have identified
    what new or changing information would impact those assumptions. At this point,
    analysts need to package this information as an analytic judgement. 


    One common misconception is that a judgment is when you determine the correct
    hypothesis and answer the question being addressed as part of an intelligence
    requirement. While that may be the judgement that you present to the majority
    of your audiences during the dissemination phase, a judgement is actually required
    every time you determine that a hypothesis is incorrect as well. If you use a
    method such as ACH, then this step naturally flows from the process, as the later
    steps on ACH involve developing initial conclusions, which are often further evaluated
    using contrarian techniques. Even if you did not use ACH to conduct the analysis,
    a version of the final steps can still be useful to pull into any type of analysis:


    *   Assess the likelihood of the hypothesis based on the evidence available. Focus
    on disproving the hypotheses rather than proving them to be correct. Identify
    if any information disproves a hypothesis. 


    *   Review the information that led to your judgment of the hypothesis, whether
    it was accepted or rejected as a hypothesis. Was there a single piece of evidence
    that weighed most heavily? If so, how confident are you in that piece of evidence?
    This will help determine the overall confidence in a judgment.


    *   Record your conclusion on each hypothesis, including citing the evidence that
    led to the conclusion and the confidence in the assessment. This should be directly
    tied to the evidence the supported or refuted it and should be clearly articulated
    so that another analyst would be able to review the evidence and clearly follow
    to logic. The rule of thumb here is that an analyst shouldn’t have to “be you”
    in order to understand the findings. 


    *   Articulate what would have to change in order for you to determine that the
    analysis would need to be reevaluated. These criteria should become part of your
    indicator generation, 


    A good formula for capturing a judgement is as follows:


    I/we assess with *\[low, moderate, high*\] confidence that \[*state your judgment*\]
    based on \[*state the evidence reviewed*\]. I/we will be monitoring \[state your
    indicators\] to further support or refute this judgement. If you follow this method,
    even if you end up changing the statement during the dissemination phase, you
    will know that you have all of the pieces needed to make and support analytic
    judgement and conclusion. 


    # Things that are Gonna Screw You Up, Aka Analytic Bias


    We have covered several different ways that you can use structured processes and
    step-by-step approaches to analysis, all with the goal of engaging System 2 thinking
    and intentionally avoiding mental shortcuts that may lead to faulty analysis.
    System 1 thinking and our mental shortcuts are deeply ingrained however, and even
    using SATs and structured methods are not guaranteed to remove things like cognitive
    bias that can interfere with analysis. Understanding more about the mechanics
    behind these biases and some of the specific ways they show up in analysis can
    help identify them. 


    Richard Heuer, one of the fathers of intelligence and the author of *The Psychology
    of Intelligence Analysis* (Military Bookshop, 2010) describes *cognitive biases*
    as “various simplifying strategies and rules of thumb to ease the burden of mentally
    processing information to make judgments and decisions.” Cognitive biases are
    essentially shortcuts that our minds develop so that we do not have to go through
    the entire analytic process for every minute decision we make in our lives. A
    basic example is a child who complains of being cold, and whose parents immediately
    tell him to put on a sweater. Years later, whenever that (now grown) child feels
    cold, he has the thought to put on a sweater. He probably also tells his children
    to put on a sweater. His mind does not have to run through the entire process
    of developing a hypothesis. (Maybe a hat would be best? Perhaps an extra pair
    of socks?) Testing and judging that hypothesis (clearly two pairs of socks are
    not enough) and coming up with a conclusion. He can simply shortcut to something
    that his mind tells them is an appropriate response to the situation.


    ## Accounting for biases


    Cognitive biases aren’t always bad, and they do save a lot of time, but in intelligence
    analysis they can have a negative influence by causing an analyst to make assumptions
    and jump to faulty judgments. Another example of a cognitive bias at work is the
    use of previously identified malware, such as Poison Ivy. An analyst who has heard
    of or experienced several instances where sophisticated attackers used complicated,
    previously unseen malware, may automatically generate the assumption that this
    actor is *not* sophisticated. In this instance, they would be using a cognitive
    bias called *anchoring* that lets one piece of evidence override any other piece
    of evidence without a sound analytic judgement.


    Many types of biases exist. Here is an overview of some that are commonly seen
    in intelligence analysis and incident response, along with ways that you can leverage
    the skills we have covered in this chapter to help counter them. 


    ### Confirmation bias


    With confirmation biases, we tend to seek out or focus on evidence that supports
    our preexisting judgment or conclusion. If, in the back of our minds, we think
    that we are going to find evidence of a specific type of activity, any evidence
    that seems to support that conclusion will be given more weight than something
    that disproves or questions that judgment. In the Road Runner scenario, we may
    have run into the issue of an analyst who assumes that the actors were attempting
    to steal credentials, since we have seen the tactic in the past. If a phishing
    email appears similar to a credential-lure, the analyst may assume that as long
    as no password was provided that there is no lingering threat without investigating
    the actual email any further. That same analyst may also identify the use of password-guessing
    techniques, also used by less-sophisticated actors, to prove this assumption.
    This judgment would require the analyst to ignore the historical cases where sophisticated
    actors also used password guessing, or give them less weight. Confirmation bias
    is one of the primary reasons that it is important to go through the exercise
    of evaluating key assumptions prior to coming to a final judgment.


    ### Anchoring bias'
  fmt: '

    # Making Analytic Judgments and Conclusions


    After the assumptions around evidence that supports a hypothesis have been evaluated
    and biases accounted for, the analyst can move toward making their judgment and
    conclusion about the hypothesis. Analysts can use several methods to interpret
    the evidence and identify whether a hypothesis is likely to be true or not, or
    whether they need to generate a new hypothesis either in part or in its entirety.
    Judgement is the step where analysts have to depart from what is known and use
    their knowledge, experience, and logic to fill in any gaps in known information
    to answer the questions that are facing them. `Structured Analytic Techniques`
    and `Target-Centric Analysis` can both help you get to a place where you know
    clearly the limits of your evidence and what it is telling you, understand your
    assumptions and conjectures and how confident you are in your validity, and have
    identified what new or changing information would impact those assumptions. At
    this point, analysts need to package this information as an analytic judgement.


    One common misconception is that a judgment is when you determine the correct
    hypothesis and answer the question being addressed as part of an intelligence
    requirement. While that may be the judgement that you present to the majority
    of your audiences during the dissemination phase, a judgement is actually required
    every time you determine that a hypothesis is incorrect as well. If you use a
    method such as `ACH`, then this step naturally flows from the process, as the
    later steps on `ACH` involve developing initial conclusions, which are often further
    evaluated using contrarian techniques. Even if you did not use `ACH` to conduct
    the analysis, a version of the final steps can still be useful to pull into any
    type of analysis:


    *   Assess the likelihood of the hypothesis based on the evidence available. Focus
    on disproving the hypotheses rather than proving them to be correct. Identify
    if any information disproves a hypothesis.


    *   Review the information that led to your judgment of the hypothesis, whether
    it was accepted or rejected as a hypothesis. Was there a single piece of evidence
    that weighed most heavily? If so, how confident are you in that piece of evidence?
    This will help determine the overall confidence in a judgment.


    *   Record your conclusion on each hypothesis, including citing the evidence that
    led to the conclusion and the confidence in the assessment. This should be directly
    tied to the evidence the supported or refuted it and should be clearly articulated
    so that another analyst would be able to review the evidence and clearly follow
    to logic. The rule of thumb here is that an analyst shouldn''t have to "be you"
    in order to understand the findings.


    *   Articulate what would have to change in order for you to determine that the
    analysis would need to be reevaluated. These criteria should become part of your
    indicator generation.


    ## Formulating a Judgment


    A good formula for capturing a judgement is as follows:


    ```

    I/we assess with [`low`, `moderate`, `high`] confidence that [`state your judgment`]
    based on [`state the evidence reviewed`]. I/we will be monitoring [`state your
    indicators`] to further support or refute this judgement.

    ```


    If you follow this method, even if you end up changing the statement during the
    dissemination phase, you will know that you have all of the pieces needed to make
    and support analytic judgement and conclusion.


    # Things that are Gonna Screw You Up, Aka Analytic Bias


    We have covered several different ways that you can use structured processes and
    step-by-step approaches to analysis, all with the goal of engaging `System 2`
    to the situation.


    ## Accounting for Biases


    Cognitive biases aren''t always bad, and they do save a lot of time, but in intelligence
    analysis they can have a negative influence by causing an analyst to make assumptions
    and jump to faulty judgments. Another example of a cognitive bias at work is the
    use of previously identified malware, such as `Poison Ivy`. An analyst who has
    heard of or experienced several instances where sophisticated attackers used complicated,
    previously unseen malware, may automatically generate the assumption that this
    actor is *not* sophisticated. In this instance, they would be using a cognitive
    bias called *anchoring* that lets one piece of evidence override any other piece
    of evidence without a sound analytic judgement.


    Many types of biases exist. Here is an overview of some that are commonly seen
    in intelligence analysis and incident response, along with ways that you can leverage
    the skills we have covered in this chapter to help counter them.


    ### Confirmation Bias


    With confirmation biases, we tend to seek out or focus on evidence that supports
    our preexisting judgment or conclusion. If, in the back of our minds, we think
    that we are going to find evidence of a specific type of activity, any evidence
    that seems to support that conclusion will be given more weight than something
    that disproves or questions that judgment. In the `Road Runner` scenario, we may
    have run into the issue of an analyst who assumes that the actors were attempting
    to steal credentials, since we have seen the tactic in the past. If a phishing
    email appears similar to a credential-lure, the analyst may assume that as long
    as no password was provided that there is no lingering threat without investigating
    the actual email any further. That same analyst may also identify the use of password-guessing
    techniques, also used by less-sophisticated actors, to prove this assumption.
    This judgment would require the analyst to ignore the historical cases where sophisticated
    actors also used password guessing, or give them less weight. Confirmation bias
    is one of the primary reasons that it is important to go through the exercise
    of evaluating key assumptions prior to coming to a final judgment.


    ### Anchoring Bias

    '
  trans: '

    # 制定分析判断与结论


    在评估了支持假设的证据相关假设并考量了偏见后，分析师便可以着手对该假设做出判断和结论。分析师可以使用多种方法来解读证据，判断假设是否可能成立，或者是否需要部分或完全生成新的假设。判断是分析师必须脱离已知信息，利用其知识、经验和逻辑来填补已知信息的空白，以回答面临问题的步骤。`结构化分析技术`和`以目标为中心的分析`都能帮助你明确证据的界限及其指向，理解你的假设和推测及你对其有效性的信心程度，并识别出哪些新信息或变化的信息会影响这些假设。此时，分析师需要将这些信息打包为一项分析判断。


    一个常见的误区是，认为判断就是确定正确的假设，并回答作为情报需求一部分的问题。虽然那可能是你在传播阶段向大多数受众呈现的判断，但每当你认定某个假设不成立时，实际上也需要做出判断。如果你使用`ACH`等方法，这一步骤会自然地从流程中衍生出来，因为`ACH`的后续步骤涉及形成初步结论，这些结论通常会进一步通过反面技术进行评估。即使你未使用`ACH`进行分析，其最终步骤的变体仍可引入任何类型的分析中：


    *   根据现有证据评估假设的可能性。重点在于证伪假设而非证实假设。识别是否有任何信息能推翻某个假设。


    *   回顾导致你对假设做出判断的信息，无论该假设被采纳还是拒绝。是否有单一证据起了决定性作用？如果有，你对该证据有多大信心？这将有助于确定判断的总体信心水平。


    *   记录你对每个假设的结论，包括引用得出结论的证据和评估的信心水平。这应直接关联到支持或反驳该假设的证据，并清晰阐述，以便其他分析师能够复查证据并清晰地遵循逻辑。这里的经验法则是：分析师不必“成为你”就能理解调查结果。


    *   阐述需要发生何种变化才会导致你认定分析需要重新评估。这些标准应成为你指标生成的一部分。


    ## 构建判断


    一个捕捉判断的好公式如下：


    ```

    I/we assess with [`low`, `moderate`, `high`] confidence that [`state your judgment`]
    based on [`state the evidence reviewed`]. I/we will be monitoring [`state your
    indicators`] to further support or refute this judgement.

    ```


    如果你遵循此方法，即使最终在传播阶段修改了措辞，你也会知道自己拥有制定和支撑分析判断与结论所需的所有要素。


    # 会让你栽跟头的东西，即分析偏见


    我们介绍了多种使用结构化流程和分步方法进行分析的方式，目的都是为了让`系统 2`介入处理情境。


    ## 考量偏见


    认知偏见并不总是坏事，它们确实能节省大量时间，但在情报分析中，它们可能会产生负面影响，导致分析师做出假设并草率下达错误判断。认知偏见发挥作用的另一个例子是使用先前已识别的恶意软件，例如`Poison
    Ivy`。听闻或经历过多起复杂攻击者使用复杂、前所未见的恶意软件的分析师，可能会自动假设该攻击者*不*复杂。在这种情况下，他们使用了一种称为*锚定效应*的认知偏见，让单一证据在缺乏合理分析判断的情况下覆盖了其他所有证据。


    存在多种类型的偏见。以下是情报分析和事件响应中常见的一些偏见概述，以及你可以利用本章介绍的技能来对抗它们的方法。


    ### 确认偏见


    由于确认偏见，我们倾向于寻找或关注支持我们预存判断或结论的证据。如果我们在潜意识里认为会发现特定类型活动的证据，任何似乎支持该结论的证据都会比反驳或质疑该判断的证据获得更高的权重。在`Road
    Runner`场景中，我们可能会遇到这样一位分析师：因为过去见过该战术，便假设攻击者企图窃取凭证。如果一封钓鱼邮件看起来像凭证诱饵，该分析师可能会假设只要未提供密码就不存在残留威胁，而不再进一步调查邮件本身。同一分析师还可能指出攻击者使用了密码猜测技术（这也是技术不成熟的攻击者常用的），以此来证明自己的假设。这种判断要求分析师忽略复杂攻击者也使用密码猜测的历史案例，或降低其权重。确认偏见是为什么在做出最终判断前必须进行关键假设评估练习的主要原因之一。


    ### 锚定偏见

    '

- raw: "Containment and eradication often require drastic action. *Recovery* is the\
    \ process of going back to a non-incident state. In some regards, recovery is\
    \ less from the attack itself, but more from the actions taken by the incident\
    \ responders.\n\nFor example, if a compromised system is taken from a user for\
    \ forensic analysis, the Recovery phase includes returning or replacing the user’s\
    \ system so that the user can resume their business functions. If an entire network\
    \ is compromised, the Recovery phase involves undoing any actions taken by the\
    \ adversary across the entire network, and can be a lengthy and involved process,\
    \ sometimes including rebuilding the entire network. Cloud services add a variety\
    \ of pros and cons; on one hand they can be difficult to track down shadow IT,\
    \ on the other in many cases these networks are deterministic (built using configuration\
    \ management tools) that can make resetting and rebuilding easier.\n\nThis phase\
    \ depends on the actions taken during the prior two phases, the adversary’s methods,\
    \ and the resources that were compromised. It generally requires coordination\
    \ with other teams, such as desktop administrators and network engineering.\n\n\
    Incident response is always a team sport, requiring actions by a wide variety\
    \ of security and non-security teams, but in no part of the incident is this quite\
    \ as obvious as during recovery. Security may set certain requirements for the\
    \ way systems are recovered (most of these will take place during eradication),\
    \ but recovery, after the incident-response team’s all clear, is handled largely\
    \ by IT and system owners. Figuring out how to work together and collaborate effectively\
    \ is key and often requires both practice and experience (though good documentation\
    \ also helps). Few things can compromise a response faster than IT beginning recovery\
    \ before the IR team has fully eradicated the threat.\n\n## Lessons Learned\n\n\
    The last phase of the incident cycle, akin to many other security and intelligence\
    \ cycles, includes taking time to assess past decisions and learn how to improve\
    \ in the future.\n\nThis phase can be called many things, an After Action Report,\
    \ Hot Wash, or Retrospective (Retro). The Lessons Learned phase, no matter what\
    \ it’s called, evaluates the team’s performance through each step of the incident.\
    \ Basically, this takes the incident report and answers some basic questions:\n\
    \n1.  What happened?\n\n2.  What did we do well?\n\n3.  What could we have done\
    \ better?\n\n4.  What will we do differently next time?\n\nAs an exercise, this\
    \ can often be daunting. Many teams resist reviewing lessons learned or conducting\
    \ after-action reviews. This occurs for a wide variety of reasons, from being\
    \ concerned about mistakes being highlighted (and thus blamed on the IR team)\
    \ to simply not having enough time due to new or ongoing incidents. Whatever the\
    \ reason, nothing will keep an incident response team from advancing like skipping\
    \ lessons learned. The goal of the Lessons Learned phase is to discover how to\
    \ make the next incident response go faster, smoother, or ideally never happen\
    \ at all. Without this crucial step, IR teams (and the teams they collaborate\
    \ with) will make the same mistakes, suffer from the same blockers, and fail to\
    \ identify improvements.\n\nAlthough it’s important, conducting a Lessons Learned\
    \ phase doesn’t have to be daunting; in fact, it should be the opposite. A good\
    \ after-action doesn’t need to take hours or require everyone involved in the\
    \ incident response. Here are a few detailed starter questions you will want to\
    \ ask when evaluating each phase during the Lessons Learned process:\n\nPreparation\n\
    \n: \n\n*   How could we have avoided the incident altogether? This includes changes\
    \ to your network architecture, system configuration, user training, or even policy.\n\
    \n*   What policies or tools could have improved the entire process?\n\nIdentification\n\
    \n: \n\n*   What telemetry sources (IDS, net flow, DNS, etc.) could have made\
    \ it easier or faster to identify this attack?\n\n*   What signatures or threat\
    \ intelligence could have helped?\n\nContainment\n\n: \n\n*   Which containment\
    \ measures were effective?\n\n*   Which were not?\n\n*   Could other containment\
    \ measures have been useful if they’d been more easily deployable?\n\nEradication\n\
    \n: \n\n*   Which eradication steps went well?\n\n*   What could have gone better?\n\
    \nRecovery\n\n: \n\n*   What slowed the recovery? (*Hint:* focus on communication,\
    \ as that’s one of the toughest parts of recovery to do well.)\n\n*   What did\
    \ the response to recovery tell us about the adversary?\n\nLessons Learned:\n\n\
    : \n\n*   Not to be too meta, but even evaluating how the Lessons Learned process\
    \ could be done more effectively; for example, would it help if responders took\
    \ notes throughout the process? Did you wait too long and things were lost or\
    \ forgotten?\n\nLessons Learned can also be practiced (the same as any other piece\
    \ of the incident-response process). Don’t just do Lessons Learned for actual\
    \ incidents, but take the time to build and follow your Lessons Learned process\
    \ for red team and tabletop exercises as well. In fact, building lessons learned\
    \ into table top exercises is essential.\n\nUltimately, the key to Lessons Learned\
    \ is having the understanding that although early lessons learned will be painful,\
    \ they will improve—and that’s the point. Early Lessons Learned exercises will\
    \ call out flaws, missing technology, missing team members, bad processes, and\
    \ bad assumptions. Growing pains with this process are common, but take the time\
    \ and gut through them. Few things will improve an IR team and IR capability as\
    \ quickly as some tough lessons learned sessions. In addition, capture these lessons\
    \ and share them with your leadership and related teams. Although it seems like\
    \ calling out a team’s flaws, in many cases these reports provide concrete justification\
    \ for making changes that will improve your incident-response capability.\n\n\
    The incident-response cycle is one of the first models that incident responders\
    \ learn for good reason: it succinctly describes the life cycle of an investigation.\
    \ Where it becomes key is by taking the time to evaluate your team’s ability to\
    \ execute at each stage, from Preparation through to Lessons Learned. As with\
    \ intelligence work, there are several models and frameworks that can help in\
    \ the incident-response cycle.\n\n# Kill Chain\n\nAnother military concept that\
    \ has made its way into cyber threat intelligence vernacular is the *kill chain*.\
    \ In fact, it has become so popular that finding information on the original kill\
    \ chains is difficult because of the extent of information security use cases\
    \ and marketing. While this concept was on the fringes for years, a paper by Lockheed\
    \ Martin researchers Eric M. Hutchins et al. titled [“Intelligence-Driven Computer\
    \ Network Defense Informed by Analysis of Adversary Campaigns and Intrusion Kill\
    \ Chains”](http://lmt.co/2miXqrZ) brought the concept into the information security\
    \ mainstream with a formalized mapping of the most common intrusion pattern as\
    \ a formalized kill chain.\n\nSince their report, the kill chain has become a\
    \ go-to model for cyber threat intelligence, referenced by nearly every vendor,\
    \ and a staple guiding process of defensive teams. The kill chain provides an\
    \ important abstraction for the phases an adversary moves through when exploiting\
    \ a target, particularly scenarios that involve phishing-based attacks.\n\nBut\
    \ what is a kill chain? In its simplest form, a *kill chain* is a series of steps\
    \ an adversary must conduct in order to achieve an objective (see [Figure 3-2](#ch03.html#fig_2_cyber_kill_chain)).\
    \ In our case, we’re discussing a computer network adversary, but it works for\
    \ many adversarial activities. This means abstracting the incident process, but\
    \ whereas the incident cycle is focused on the *defender’s* actions, the kill\
    \ chain focuses on the *adversary’s* actions.\n\n![](assets/image-to-come.png)"
  fmt: '

    ## Recovery


    Containment and eradication often require drastic action. `Recovery` is the process
    of going back to a non-incident state. In some regards, recovery is less from
    the attack itself, but more from the actions taken by the incident responders.


    For example, if a compromised system is taken from a user for forensic analysis,
    the Recovery phase includes returning or replacing the user''s system so that
    the user can resume their business functions. If an entire network is compromised,
    the Recovery phase involves undoing any actions taken by the adversary across
    the entire network, and can be a lengthy and involved process, sometimes including
    rebuilding the entire network. Cloud services add a variety of pros and cons;
    on one hand they can be difficult to track down shadow IT, on the other in many
    cases these networks are deterministic (built using configuration management tools)
    that can make resetting and rebuilding easier.


    This phase depends on the actions taken during the prior two phases, the adversary''s
    methods, and the resources that were compromised. It generally requires coordination
    with other teams, such as desktop administrators and network engineering.


    Incident response is always a team sport, requiring actions by a wide variety
    of security and non-security teams, but in no part of the incident is this quite
    as obvious as during recovery. Security may set certain requirements for the way
    systems are recovered (most of these will take place during eradication), but
    recovery, after the incident-response team''s all clear, is handled largely by
    IT and system owners. Figuring out how to work together and collaborate effectively
    is key and often requires both practice and experience (though good documentation
    also helps). Few things can compromise a response faster than IT beginning recovery
    before the IR team has fully eradicated the threat.


    ## Lessons Learned


    The last phase of the incident cycle, akin to many other security and intelligence
    cycles, includes taking time to assess past decisions and learn how to improve
    in the future.


    This phase can be called many things, an After Action Report, Hot Wash, or Retrospective
    (Retro). The Lessons Learned phase, no matter what it''s called, evaluates the
    team''s performance through each step of the incident. Basically, this takes the
    incident report and answers some basic questions:


    1. What happened?

    2. What did we do well?

    3. What could we have done better?

    4. What will we do differently next time?


    As an exercise, this can often be daunting. Many teams resist reviewing lessons
    learned or conducting after-action reviews. This occurs for a wide variety of
    reasons, from being concerned about mistakes being highlighted (and thus blamed
    on the IR team) to simply not having enough time due to new or ongoing incidents.
    Whatever the reason, nothing will keep an incident response team from advancing
    like skipping lessons learned. The goal of the Lessons Learned phase is to discover
    how to make the next incident response go faster, smoother, or ideally never happen
    at all. Without this crucial step, IR teams (and the teams they collaborate with)
    will make the same mistakes, suffer from the same blockers, and fail to identify
    improvements.


    Although it''s important, conducting a Lessons Learned phase doesn''t have to
    be daunting; in fact, it should be the opposite. A good after-action doesn''t
    need to take hours or require everyone involved in the incident response. Here
    are a few detailed starter questions you will want to ask when evaluating each
    phase during the Lessons Learned process:


    **Preparation**


    * How could we have avoided the incident altogether? This includes changes to
    your network architecture, system configuration, user training, or even policy.

    * What policies or tools could have improved the entire process?


    **Identification**


    * What telemetry sources (IDS, net flow, DNS, etc.) could have made it easier
    or faster to identify this attack?

    * What signatures or threat intelligence could have helped?


    **Containment**


    * Which containment measures were effective?

    * Which were not?

    * Could other containment measures have been useful if they''d been more easily
    deployable?


    **Eradication**


    * Which eradication steps went well?

    * What could have gone better?


    **Recovery**


    * What slowed the recovery? (`Hint:` focus on communication, as that''s one of
    the toughest parts of recovery to do well.)

    * What did the response to recovery tell us about the adversary?


    **Lessons Learned**


    * Not to be too meta, but even evaluating how the Lessons Learned process could
    be done more effectively; for example, would it help if responders took notes
    throughout the process? Did you wait too long and things were lost or forgotten?


    Lessons Learned can also be practiced (the same as any other piece of the incident-response
    process). Don''t just do Lessons Learned for actual incidents, but take the time
    to build and follow your Lessons Learned process for red team and tabletop exercises
    as well. In fact, building lessons learned into table top exercises is essential.


    Ultimately, the key to Lessons Learned is having the understanding that although
    early lessons learned will be painful, they will improve—and that''s the point.
    Early Lessons Learned exercises will call out flaws, missing technology, missing
    team members, bad processes, and bad assumptions. Growing pains with this process
    are common, but take the time and gut through them. Few things will improve an
    IR team and IR capability as quickly as some tough lessons learned sessions. In
    addition, capture these lessons and share them with your leadership and related
    teams. Although it seems like calling out a team''s flaws, in many cases these
    reports provide concrete justification for making changes that will improve your
    incident-response capability.


    The incident-response cycle is one of the first models that incident responders
    learn for good reason: it succinctly describes the life cycle of an investigation.
    Where it becomes key is by taking the time to evaluate your team''s ability to
    execute at each stage, from Preparation through to Lessons Learned. As with intelligence
    work, there are several models and frameworks that can help in the incident-response
    cycle.


    # Kill Chain


    Another military concept that has made its way into cyber threat intelligence
    vernacular is the `kill chain`. In fact, it has become so popular that finding
    information on the original kill chains is difficult because of the extent of
    information security use cases and marketing. While this concept was on the fringes
    for years, a paper by Lockheed Martin researchers Eric M. Hutchins et al. titled
    ["Intelligence-Driven Computer Network Defense Informed by Analysis of Adversary
    Campaigns and Intrusion Kill Chains"](http://lmt.co/2miXqrZ) brought the concept
    into the information security mainstream with a formalized mapping of the most
    common intrusion pattern as a formalized kill chain.


    Since their report, the kill chain has become a go-to model for cyber threat intelligence,
    referenced by nearly every vendor, and a staple guiding process of defensive teams.
    The kill chain provides an important abstraction for the phases an adversary moves
    through when exploiting a target, particularly scenarios that involve phishing-based
    attacks.


    But what is a kill chain? In its simplest form, a `kill chain` is a series of
    steps an adversary must conduct in order to achieve an objective (see [Figure
    3-2](#ch03.html#fig_2_cyber_kill_chain)). In our case, we''re discussing a computer
    network adversary, but it works for many adversarial activities. This means abstracting
    the incident process, but whereas the incident cycle is focused on the *defender''s*
    actions, the kill chain focuses on the *adversary''s* actions.


    ![](assets/image-to-come.png)

    '

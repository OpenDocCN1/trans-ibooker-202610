- raw: 'Strategic intelligence for incident response not only enables you to make
    smart decisions about the visibility of your networks, but also feeds directly
    into the requirements for tactical and operational levels of analysis, and help
    you move towards anticipatory intelligence. It will help you answer the following:


    *   Which threats are most significant so that incident response can prioritize
    and focus on those threats


    *   Which types of information are important to capture, and what warrants a brief
    to the CISO or other executives


    *   What situations may emerge as the outside world changes?


    *   How do external situations such as financial crisis, global conflict, or pandemics
    impact the security posture of the organization?


    There is a misconception that there is simply no time to conduct strategic intelligence.
    There is so much happening on a daily—and in the world of incident response, sometimes
    an hourly—basis, that many people feel overwhelmed by trying to keep up at the
    tactical level. Strategic intelligence, often viewed as a “nice to have” rather
    than a “need to have” gets relegated to the pile of things to do when time allows,
    and time rarely allows. However, strategic intelligence is critical to our ability
    to do our jobs, and although it does take time away from the daily emergencies,
    it can position us to better deal with those emergencies and therefore it should
    not be overlooked. All actions that take place can be tied back to strategic requirements.
    As you understand the logic and reasoning behind the requirements (and once you
    start adding to that logic yourself) you will be able to adapt and respond when
    situations change without having to revisit the entire process. Strategic intelligence
    takes time, but when it is done correctly, it can set up entire programs for success
    long into the future. It is well worth the time and effort.


    # About the Authors


    **Rebekah Brown** has spent more than a decade working in the intelligence community;
    her previous roles include NSA network warfare analyst, Operations Chief of a
    United States Marine Corps cyber unit, and a U.S. Cyber Command training and exercise
    lead. Rebekah has helped develop threat intelligence and security awareness programs
    at the federal, state, and local level, as well as at multiple Fortune 500 companies.


    **Scott J. Roberts** makes up his title every time he’s asked, so we’ll say he’s
    the Director of Bad Guy Catching. He has worked for 900 lb security gorillas,
    government security giants and boutiques, and financial services security firms
    and done his best to track down bad guys at all these places. He’s released and
    contributed to multiple tools for threat intelligence and malware analysis. Scott
    is also really good at speaking in the third person.'

- raw: 'The Diamond Model for intrusion analysis is a well-used reliable method for
    analyzing adversary activity, however it leaves the format and the method for
    capturing different information up to the user of the model In recent years, methods
    for standardizing and capturing information on adversaries tactics and use of
    infrastructure. Two of these frameworks, ATT&CK and D3FEND, have essentially become
    industry standards. Whether combined with the Diamond Model or used independently,
    these frameworks can be incredibly useful in the intrusion analysis process.


    # ATT&CK & D3FEND


    The MITRE Corporation (usually just called MITRE), a United States Federally Funded
    Research and Development Center, has released a variety of useful cyber frameworks
    that can be used independently or in conjunction with other models. These two
    models have different focuses, one on helping understand and categorize adversary
    actions, and one of focused on counter measures that can be used by the defense.
    Both of these frameworks are worth exploring in depth, however here we will provide
    a brief overview focusing on how these methods can augment other models useful
    in the IDIR process.


    ## ATT&CK


    The Kill Chain and the Diamond Model for Intrusion Analysis are two examples of
    models that you are likely to use frequently, whether explicitly or as mental
    models. Another more recent addition to the analyst’s toolkit is the MITRE ATT&CK
    Framework, which enhances and extends the traditional kill chain. ATT&CK stands
    for “Adversary Tactics, Techniques, and Common Knowledge”(and yes, if you’re thinking
    it, no one likes the Ampersand in the middle, but these are the things you do
    for good acronyms). MITRE describes ATT&CK as “a globally-accessible knowledge
    base of adversary tactics and techniques based on real-world observations \[which
    is\] used as a foundation for the development of specific threat models and methodologies”.


    ATT&CK can be broken down into a few key groups of major concepts (Taken directly
    from attack.mitre.org):


    | Concept || MITRE Definition |


    | --- | --- |


    | Tactics || Tactics represent the “why” of an ATT&CK technique or sub-technique.
    It is the adversary’s tactical goal: the reason for performing an action. For
    example, an adversary may want to achieve credential access. |


    | --- | --- |


    | Techniques || Techniques represent ‘how’ an adversary achieves a tactical goal
    by performing an action. For example, an adversary may dump credentials to achieve
    credential access. |


    | Groups || Groups are sets of related intrusion activity that are tracked by
    a common name in the security community. Analysts track clusters of activities
    using various analytic methodologies and terms such as threat groups, activity
    groups, threat actors, intrusion sets, and campaigns. |


    | Software || Software is a generic term for custom or commercial code, operating
    system utilities, open-source software, or other tools used to conduct behavior
    modeled in ATT&CK. |


    There are a few other Secondary categories as well, including matrices, data sources,
    mitigations, and resources. Matrices are important as they tie together other
    data into various environments. The vast majority of the time people are referring
    to the ATT&CK Enterprise matrix, but Mobile and ICS (as in Industrial Control
    System) could also be important depending on your organization. Data Sources is
    focused on mapping data back to the collection source, i.e. the sensor or type
    of log you can find the data in. Mitigations, which are split up by matrix, represent
    ways to respond to various attacks as well.


    The tactics and techniques captured in ATT&CK are not theoretical - they have
    been observed by cybersecurity practitioners while tracking adversaries conducting
    network operations. These tactics and techniques are captured as individual components
    that are displayed in a matrix form. ATT&CK is a multi-functional model. It can
    be used as a library of tactics and techniques to help an incident responder and
    intelligence team build their understanding of existing and emerging adversary
    trends.


    At this point ATT&CK has moved beyond the US government, or even being a mental
    model for cyber threat intelligence analysts and incident responders, and is now
    in use by vendors who base their detections around ATT&CK, offensive security
    (we’ll talk more about Red Canary Atomic Red Team later on), technology evaluators,
    and even ambitious authors. We’re going to discuss more about ATT&CK throughout
    the rest of this chapter and even the rest of this book.


    ## D3FEND


    MITRE also released the other side of ATT&CK; D3FEND (and another on the nose
    yet delightful acronym). Created with funding from the National Security Agency,
    D3FEND enumerates the countermeasures and responses defenders can take to block
    or respond to an adversary. Similarly, to ATT&CK D3FEND splits these into tactics
    (the overarching goals) and techniques (the technical controls actually being
    implemented). The goal of D3FEND is to tie specific defensive techniques to specific
    offensive techniques. Between these two models it *should* be possible to go from
    a specific actor (say G0032 - Lazarus Group) all the way to the specific system
    hardening steps you should take to block them and the type of detections you need
    to find them.


    Will this work? It might be too soon to tell. ATT&CK was slow to get started for
    the first few years, so it’s possible D3FEND will gain speed. This ends up being
    a great lead into our next topic.


    # Active Defense


    One of the most talked about and least understood concepts about intelligence-driven
    incident-response cycles is the idea of active defense.


    Active Defense is frequently equated with the idea of “*hack back”*, attempting
    to attack a malicious actor directly. Although this qualifies as one aspect of
    active defense, five other useful pieces of active defense are far more common.
    This mix-up is based on a fundamental misunderstanding of the purpose of active
    defense.


    Most people who attempt or request some form of hack back have in mind a childish,
    schoolyard-style form of revenge. It’s natural. You get hit; you want to hit someone
    back. There are reasons we’ve outgrown these juvenile tactics. First of all, in
    network intrusions, we often find it difficult to know the adversary’s identity,
    leading to misattribution and thus a misdirected attack. It can be hard to know
    if a given technology asset is the property of an adversary, something they’re
    purchasing from a vendor (yep, adversaries love the cloud as much as your devops
    team), a free service that the adversary is leveraging, or even a stolen asset
    (meaning an attack might not just be against an adversary, but the innocent legitimate
    owner). Second, proportionate response is difficult for defensively oriented organizations.
    Third, it usually serves a limited purpose aside from a sense of revenge and retribution.
    Fourth, hacking back could, depending on the adversary, cause them to retaliate
    to the hack back. Lastly, and perhaps most importantly, it is illegal in most
    countries to attempt to compromise a computer system without its permission or
    appropriate legal authority such as granted to law enforcement and military organizations,
    which in theory submit to strict oversight. In short you probably can’t do it.


    ###### Note


    Aside: You might sit there and say “But what about the people who do have the
    authority and information to hack back? Well, it turns out that’s starting to
    happen. In late 2021 Gen. Paul Nakasone, head of Cyber Command and director of
    the National Security Agency, speaking in the New York Times^([2](#ch03.html#idm46530557114624)),
    acknowledged that “we have taken actions and we have imposed costs” against ransomware
    operators. How effective this will be long term is yet to be seen.'

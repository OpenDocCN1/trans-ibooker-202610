    # Axiom Group 和 SolarWinds 案例研究


    六年多来，一个被称为 Axiom Group 的攻击者组织隐蔽地瞄准、渗透并窃取了财富 500 强企业、记者、非政府组织以及各类其他组织的信息。该组织使用复杂的工具，攻击者不遗余力地在受害者网络中维持并扩大访问权限。随着恶意软件被检测到，各受害组织启动了事件响应流程，对该组织使用的恶意软件家族之一进行的协同研究表明，问题远比最初想象的更为复杂。随着更多行业合作伙伴参与并交换信息，出现了一些模式，这些模式不仅显示了恶意软件的行为，还显示了一个在明确指导下工作的威胁行为者组织的行为。战略情报也随之被识别出来，包括被瞄准的地区和行业。


    这是情报周期在事件响应场景中发挥作用的一个绝佳例子。信息不仅被收集、处理和分析，还以一种能够产生新需求和反馈的方式进行传播，从而再次启动流程，直到分析师得出可靠结论并能果断行动，在报告发布时根除了
    43,000 个恶意软件安装实例。发布的报告也是传播阶段的一部分，使事件响应人员能够更好地了解该行为者组织的战术和动机。


    ## SolarWinds


    2020 年 12 月，位于德克萨斯州的 SolarWinds 公司发生大规模入侵事件的消息传出。该公司生产用于监控和管理 IT 网络的软件，是许多大型网络（包括网络安全公司、政府机构和财富
    500 强企业）中非常流行的工具。该活动是在网络安全公司 FireEye（SolarWinds 的客户）发现其网络遭到入侵、其开发的一套用于识别入侵的工具被未知实体访问后被检测到的。他们对自身网络入侵事件的调查使他们确定
    SolarWinds 是入侵源头。


    他们的分析表明，SolarWinds 的网络在 2019 年底已被攻破，其软件被篡改，导致推送给所有客户的软件更新包含一个后门，允许对手访问这些客户的网络。这并非首例基于软件的供应链攻击；但其规模和范围引人注目——据估计，超过
    18,000 家 SolarWinds 客户受到影响。其响应方式也引人注目，在 Moonlight Maze 事件 20 年后，展示了网络威胁情报作为一门学科已经取得了多大进步。一旦被识别，FireEye
    发布了包含事件细节和供他人检测网络活动方法的博客文章。其他团队迅速加入，分析其网络上的活动，并继续公开或通过既定的威胁共享小组共享指标和发现，从而迅速勾勒出整体攻击的全貌。国土安全部发布了关于供应链攻击的指导，将响应从仅对单一孤立事件做出反应的心态，转变为如何不仅帮助直接受影响的组织，还能为其他组织揭示重要经验教训。


    Axiom Group 的攻击和 SolarWinds 软件供应链入侵均属于寻求信息、与间谍活动相关的攻击，但国家资助的攻击者并非事件响应人员唯一需要担心的威胁。以经济利益为目的的犯罪活动也在演变，这些行为者也在努力保持在防御者和事件响应人员之前。近年来，以经济利益为目的的罪犯最重大的战术变化之一是转向勒索软件。勒索软件攻击使用工具加密网络上的数据，然后索要赎金以换取解密密钥。勒索软件的概念已存在数十年；然而，自
    2012 年以来，其使用量急剧增加，影响力也随之增大。尽管勒索软件攻击并不总是涉及针对多个组织的战略性和协同攻击，但实施勒索软件攻击的团体通常使用相同的战术、工具集，甚至往往共享目标情报来攻击不同受害者。针对这些以经济利益为目的的攻击，防御者也可以利用情报驱动的事件响应，在实际加密过程开始前，识别出其网络已被这些行为者攻破的早期迹象。


    # 结论


    尽管计算机安全领域取得了诸多进步，攻击者仍在不断适应——但他们不必超越防御者。情报驱动的事件响应使我们能够从攻击者身上学习；识别他们的动机、流程和行为；即使他们试图智取我们的防御和检测方法，也能识别他们的活动。我们对攻击者了解得越多，就能更好地预防、检测和响应他们的行动。


    我们已达到这样一个阶段：在事件响应流程中实施情报，需要一个结构化且可重复的过程，而本书旨在为该过程提供洞见。全书中，我们提供了各种模型和方法，它们可被视为情报驱动事件响应的基石，以及这些模型为何有益于事件响应并能与之融合的背景知识。没有放之四海而皆准的方法。在许多情况下，具体的事件或组织将决定哪种特定的模型和方法组合最为适用。理解情报和事件响应的基本原则，以及将二者融合的具体方法，将使您能够构建一个适合您的情报驱动事件响应流程，并开发该流程以满足组织的需求。



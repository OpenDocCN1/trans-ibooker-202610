    > 溯因推理：一种三段论，其中大前提显而易见，但小前提以及因此得出的结论仅具有或然性。

    >

    > [梅里亚姆-韦伯斯特词典，‘演绎’与‘归纳’与‘溯因’](https://www.merriam-webster.com/words-at-play/deduction-vs-induction-vs-abduction)


    # 溯因推理在安全调查中的应用


    此时，你可能已经猜到，溯因推理是我们在安全调查中最终最常使用的推理方式。溯因推理在某些方面是另外两种推理的结合（也是福尔摩斯实际所指的推理方式）。溯因推理是获取可用信息、应用过去的规则和事实，并以此推导出一组合理原因的过程。这与归纳法不同，归纳法旨在创建这些基本规则而非应用它们；也与演绎法不同，演绎法是获取一组案例和规则并用它们来预测结果。


    溯因推理始终是思考调查的最佳方式，因为与归纳法和演绎法不同，它考虑到我们很少拥有完美信息，也很难基于现有信息得出普适规则。此外，我们调查的通常目标是发现原因。例如，如果你说“我们的网站因流量过大而瘫痪”（一个结果）和“勒索性
    DDoS 是流量过大的常见原因”（一条规则），那么你可以推导出原因“我们正遭受勒索性 DDoS 攻击”。


    ## 为什么要谈论推理？


    网络安全中许多最常见的问题和挑战，归根结底都是对问题的错误推理和错误的基本假设。一个例子是将恶意软件归因于特定的威胁行为体。多年来，WINNTI 恶意软件家族通常被认为仅由单一威胁行为体使用，威胁行为体与恶意软件被混为一谈，这在本例中是一条错误规则。这本身就是归纳法出错的一个例子。结果，这条错误规则被多次应用，导致对真正攻击组织的对手产生困惑，因为对手的行为与原始
    WINNTI 威胁行为体不符，该规则导致了混淆。如果你查看 MITRE ATT&CK WINNTI 组，混淆显而易见，因为他们指出了与 Axiom、APT17
    和 Ke3chang 的重叠。


    简而言之，如果你不知道自己是如何处理问题以及为何以那种方式处理，就很容易引入错误，导致后续出现困惑甚至分析失败。最先发现 WINNTI 恶意软件并将其与单一行为体关联的分析师可能并没有错，但这种关联被广泛接受的方式后来成了许多组织的问题。关键假设检查结构化分析技术旨在帮助你质疑并避免这类错误，但最好的做法是从一开始就考虑如何构建你的思维框架，在问题出现前就避免它们！


    # 案例研究：OPM 入侵事件


    至今仍可能影响无数个人和实体的最重大入侵事件之一，是 [美国人事管理办公室 (OPM) 遭遇的入侵](http://bit.ly/2uI6oD1)，该事件导致超过
    2000 万接受过安全许可背景调查的个人的个人高敏感信息泄露。除了被盗信息的规模和敏感性外，OPM 入侵事件之所以引人注目，是因为错失了多次识别和阻止攻击的机会。此次入侵是一场跨越数年的复杂行动，包括窃取
    IT 手册和网络拓扑图、攻陷两家拥有 OPM 网络访问权限的承包商，以及直接攻陷 OPM 本身。即使单个入侵事件被发现，也没人将这些点串联起来，以识别出需要应对更大的威胁。


    甚至在攻击者发起行动之前，就已存在机会，利用我们对攻击者及其行动方式的了解，识别出：一个掌握所有持有安全许可的美国人高度敏感、高度可操作的个人信息的政府机构，是国家级攻击者的高价值目标。


    入侵的完整时间线是一堂课，展示了如果分析得当且及时，如何能防止或减轻成功行动的毁灭性影响。它还展示了当事件响应人员、管理者和高管未能串联线索、洞察全局时，后果有多严重。OPM
    入侵事件是一个经典且令人沮丧的例子，即使所有信息都可用，却仍未能进行分析。


    # 分析流程与方法


    在事件响应中，网络、入侵和其他网络安全基础方面的经验，是快速准确决策、识别恶意活动模式并确定缓解措施的关键。正如我们在“发现、定位、终结”章节所学，使用杀伤链和钻石模型等模型，可以帮助我们组织思路和事件相关数据。在分析中，我们依赖一套独立的技能，这些技能与网络入侵和网络安全的知识经验相关，但属于情报分析独有。这些可以被视为支撑任何特定内容专业领域的认知技能。认知技能包括记忆、认知加工、逻辑推理、注意力和认知灵活性。这些技能——在生活各方面都有帮助——也由一套流程和框架支持，帮助将它们应用于特定主题。在情报驱动的事件响应中，我们使用结构化分析技术和分析框架，如目标中心分析和受害者中心分析，来指导我们的流程（详见下文）。


    本节描述的流程和方法是常见的分析方法，可单独使用或组合使用。在情报分析中，起决定性作用的不是对特定主题的经验，而是对开展情报分析整体流程的经验。


    ## 结构化分析技术


    关于结构化分析技术 (SATs) 最好的入门读物之一是 Randolph Pherson 和 Richards Heuer Jr 合著的 *Structured
    Analytic Techniques for Intelligence Analysis*，目前已出到第三版。虽然 SATs 适用于所有类型的情报分析，但有些技术更适用于情报驱动的事件响应，因此我们将重点关注这些技术。


    使用结构化分析技术的目标是为分析师提供一种（或多或少）分步骤的方法，该方法可重复、可向参与分析过程的其他人解释，并可被他人复现或回溯步骤。SATs 专门设计用于对抗本章开头提到的“系统
    1”缺陷类型：认知偏见和错误应用的心智模型。《情报分析结构化技术》将 SATs 分为六大类：


    ### 整理组织


    这一类技术帮助分析师在分析过程开始时，面对一堆数据却无从下手的情况。包括排序、排名和清单等方法。幸运的是，在情报驱动的事件响应中，你不是从白板开始——你在整个事件响应过程中一直在收集、排序和组织数据，通常不是从零开始。然而，如果你决定花时间梳理未充分分析的旧事件数据，从这一类方法入手可能会很有用。


    ### 探索技术


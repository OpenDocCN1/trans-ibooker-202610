  trans: '

    用于入侵分析的`Diamond Model`（钻石模型）是一种广泛使用的可靠方法，用于分析对手活动；然而，它将捕获不同信息的格式和方法留给了模型的使用者。近年来，出现了用于标准化和捕获对手战术及基础设施使用信息的方法。其中两个框架，`ATT&CK`和`D3FEND`，基本上已成为行业标准。无论是与`Diamond
    Model`结合使用还是独立使用，这些框架在入侵分析过程中都非常有用。


    # ATT&CK 与 D3FEND


    `MITRE Corporation`（米特公司，通常简称为`MITRE`）是一家美国联邦资助的研究与开发中心，发布了多种有用的网络安全框架，可独立使用或与其他模型结合使用。这两个模型的关注点不同：一个侧重于帮助理解和分类对手行为，另一个侧重于防御方可使用的对抗措施。这两个框架都值得深入探索；不过，这里我们简要概述这些方法如何增强`IDIR`过程中有用的其他模型。


    ## ATT&CK


    `Kill Chain`（杀伤链）和用于入侵分析的`Diamond Model`是你可能会频繁使用的两个模型示例，无论是显式使用还是作为思维模型。分析师工具箱中另一个较新的成员是`MITRE
    ATT&CK Framework`，它增强并扩展了传统的杀伤链。`ATT&CK`代表“Adversary Tactics, Techniques, and
    Common Knowledge”（对手战术、技术与通用知识）（是的，如果你在疑惑，那个“&”符号只是为了读音方便）。`ATT&CK`是一个基于真实观察的对手战术和技术知识库。它被组织成涵盖各种平台的矩阵（例如企业、移动、ICS）。该框架帮助分析师理解对手*在做什么*以及*为什么这么做*，超越简单的妥协指标（IOC），转向行为分析。


    ## D3FEND


    `D3FEND`是`ATT&CK`的互补框架，由`MITRE`在`National Security Agency`（NSA，国家安全局）的赞助下开发。`ATT&CK`侧重于进攻（对手做什么），而`D3FEND`侧重于防御（防御者能做什么）。它提供了一个防御对抗措施知识库。`D3FEND`将对抗措施组织为战术（战略目标）和技术（具体的技术实现）。`D3FEND`的目标是将特定的防御技术映射到`ATT&CK`中发现的特定进攻技术。结合使用这两个模型，*应该*可以从特定的攻击者（例如`G0032
    - Lazarus Group`）一路推导到你应该采取的具体系统加固步骤以阻止他们，以及发现他们所需的检测类型。


    这行得通吗？目前下结论可能还为时过早。`ATT&CK`在最初几年发展缓慢，所以`D3FEND`有可能会加速发展。这正好引出了我们的下一个话题。


    # 主动防御


    关于情报驱动的事件响应周期，最受热议却又最不被理解的概念之一就是主动防御的理念。


    主动防御经常被等同于“*反向入侵*”的想法，即直接攻击恶意行为者。虽然这符合主动防御的一个方面，但其他五个有用的主动防御要素要常见得多。这种混淆源于对主动防御目的的根本误解。


    大多数尝试或请求某种形式反向入侵的人，脑子里想的是一种幼稚的、校园霸凌式的报复。这很自然。你被打了；你想打回去。我们之所以摒弃这些幼稚战术，是有原因的。首先，在网络入侵中，我们往往难以知晓对手的身份，导致归因错误，从而发动错误的攻击。很难确定某个技术资产是对手的财产，还是他们从供应商处购买的服务（没错，对手和你的
    DevOps 团队一样爱用云）、对手利用的免费服务，甚至是被盗资产（意味着攻击可能不仅针对对手，还可能针对无辜的合法所有者）。其次，对于以防御为导向的组织来说，相称性回应很难做到。第三，除了报复和惩罚的快感外，这通常服务于有限的目的。第四，视对手而定，反向入侵可能导致他们对反向入侵进行报复。最后，也是或许最重要的，在大多数国家，未经许可或没有执法和军事组织拥有的适当法律授权（理论上受严格监督）而试图入侵计算机系统是非法的。简而言之，你大概率做不了。


    ### 注


    旁注：你可能会坐在那里说“但那些拥有权限和情报进行反向入侵的人怎么办？好吧，事实证明这开始发生了。2021 年底，`Cyber Command`（网络司令部）负责人兼`National
    Security Agency`（国家安全局）局长 Paul Nakasone 上将在接受`New York Times`（纽约时报）采访时^(2)承认，“我们已经采取了行动，并让勒索软件操作者付出了代价”。从长远来看这有多有效，还有待观察。

    '

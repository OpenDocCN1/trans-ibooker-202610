    ## Intelligence Cycle


    The intelligence cycle, pictured in [Figure 2-3](#ch02.html#figure_2_3_the_intelligence_cycle),
    is the formal process for generating and evaluating intelligence. The cycle begins
    where the last intelligence process ended and continues to build off itself. The
    intelligence cycle doesn’t need to be followed to the letter. In fact, processes
    explored later in this book will build upon it. You do have to be careful not
    to omit critical steps, however. If you start skipping entire steps, you run the
    risk of ending up with more data and questions instead of intelligence.


    ![](assets/image-to-come.png)


    To properly utilize the intelligence cycle, you need to know what is involved
    in the steps, which we will dive into next.


    ### Direction


    The first step in the intelligence cycle is direction - also known as requirements.
    *Direction* is the process of establishing the question that the intelligence
    is meant to answer. This question can be delivered from an outside source, developed
    by the intelligence team itself, or developed by stakeholders and the intelligence
    team. (This is sometimes called the *RFI process*, which we’ll discuss in Chapter
    4, Find. The ideal outcome of this process is a clear, concise question whose
    answer the stakeholders will find usable.


    Much intelligence work is based around requirements. In the intelligence community,
    any work done or reports circulated needs to be tied directly to an intelligence
    requirement, either standing (long term) or priority (urgent and time sensitive)
    requirements.


    ### Collection


    The next step is collection of the data necessary to answer the question. This
    is a wide-ranging exercise that should focus on gathering as much data as possible
    from many sources. Redundant information adds value here, because corroboration
    is often important.


    This leads to a key idea of developing an effective intelligence program: building
    a collection capability. It’s difficult to know exactly what data might eventually
    prove useful, so building a broad capability to collect a wide variety of information
    is important. This includes tactical information such as infrastructure, malware,
    and exploits, as well as operational strategic information such as attacker goals,
    social media monitoring, news monitoring, and high-level document exploitation
    (identifying reports, such as those that vendors release about groups, and gathering
    information from them). Be sure to document the sources and take care: news stories
    often republish or reference the same original material, making it difficult to
    know what’s corroboration and what’s just a rehash of the same material. If it
    is impossible to determine the source of a particular data set, you may want to
    avoid using it as a collection source.


    Collection is a process, not a one-time action. Using information from the first
    round of collection (such as gathering IP addresses) leads to a second round (such
    as using reverse DNS to find domains related to those IP addresses), which leads
    to a third round (using WHOIS to gather information about those domains). This
    exploitation becomes exponential as it builds upon itself. The focus at this point
    is not understanding how the data relates but simply developing as much information
    as possible. Combining it comes later. Also, don’t forget to consider internal
    sources, such as an incident-management system. It’s common for organizations
    to discover actors or attacks they’re already intimately familiar with.


    ### Processing


    Data is not always immediately usable in its raw format or in the format in which
    it was collected. In addition, data from different sources may come in different
    formats, and it is necessary to get it into the same format so it can be analyzed
    together. The *processing* necessary to make data usable is often an overlooked
    task, but without it, generating intelligence would be nearly impossible. In the
    traditional intelligence cycle, processing is part of collection. However, when
    dealing with the types of data and organizations involved in incident response,
    it may be useful to consider processing separately. Here are some of the most
    common ways to process data related to cyber threats.


    #### Normalization


    Processing includes normalizing collected data into uniform formats for analysis.
    The collection process will generate nearly every conceivable kind of data result.
    Intelligence data comes in a variety of formats, from JSON to XML to CSV to plain
    text from email. Vendors share information on websites in blog posts or tables,
    but also in PDF-based reports or even YouTube videos. At the same time, organizations
    tend to store data in different formats. Some organizations use a purpose-built
    threat-intelligence platform, while other organizations build customized solutions
    from wikis or internal applications.


    #### Indexing


    Large volumes of data need to be made searchable. Whether dealing with observables
    such as network addresses and mutexes or operational data such as forum posts
    and social media, analysts need to be able to search quickly and efficiently.


    #### Translation


    In some cases, regional analysts may provide human translation of source documents,
    but this is generally not feasible for most organizations dealing with information
    from all over the world. Machine translation, while imperfect, usually provides
    sufficient value so that analysts can find items of interest. If necessary, they
    can then be escalated to specialists for a more accurate translation.


    #### Enrichment


    Providing additional metadata for a piece of information is important. For example,
    domain addresses need to be resolved to IP addresses, and WHOIS registration data
    fetched. Google Analytics tracking codes should be cross-referenced to find other
    sites using the same code. This enrichment process should be done automatically
    so that the relevant data is immediately available to analysts.


    #### Filtering


    Not all data provides equal value, and analysts can be overwhelmed when presented
    with endless streams of irrelevant data. Algorithms can filter out information
    known to be useless (though it may still be searchable) and bubble up the most
    useful and relevant data.


    #### Prioritization


    The data that has been collected may need to be ranked so that analysts can allocate
    resources to the most important items. Analyst time is valuable and should be
    focused correctly for maximum benefit to the intelligence product.


    #### Visualization


    Data visualization has advanced significantly. While many analysts fear vendor
    dashboards because of the clutter they typically contain, designing a visualization
    based on what analysts need (rather than what marketing and executives think looks
    good) can assist in reducing cognitive load.


    Taking the time to process data effectively enables and improves future intelligence
    efforts.


    ### Analysis


    *Analysis*, as much an art as it is a science, seeks to answer the questions that
    were identified in the Direction phase. In intelligence analysis, data that has
    been collected is characterized and considered against other available data, and
    an assessment is made as to its meanings and implications. Predictions are often
    made as to future implications. There are various methods for conducting analysis,
    but the most common is to use analytic models to evaluate and structure the information,
    identify connections, and make assessments about their implications. In addition
    to preexisting models, which we cover later in this chapter, it is also common
    for analysts to develop their own models that work with their particular data
    sets or way of interpreting information.


- raw: '7.  Report your conclusions on the likelihood of all the hypotheses, not just
    the most likely one. It is important to record and report all the hypotheses that
    were considered, as well as the evidence that led to the final judgement. This
    is especially important if the analysis is going to go through a red cell analysis
    process, which we will discuss later in this chapter. It can also help to identify
    whether the analysis needs to be reevaluated if new information is provided, which
    brings us to the final step of the ACH process.


    8.  Identify situations in which the analysis would need to be reevaluated. Richard
    Heuer writes that all analysis should be considered tentative, and that it is
    always possible for new evidence to be presented that will require a new analysis.
    If any intelligence gaps are identified or any information that you know is currently
    missing but has the potential to change the judgment, these should be documented
    to assist in future analysis. An example in the Road Runner intrusion would be
    the addition of information from another organization that experienced a similar
    intrusion, or information that the attacker’s activity was detected in the future
    due to additional security measures that were put in place. In those situations,
    you would have access to new log information. If either of these things happened,
    we would need to revisit the judgment.


    The concept of setting predetermined criteria on when a judgement should be reviewed
    and potentially revised is a core component of the final core SAT that we will
    discuss next in this chapter.


    ### Indicator Generation, Validation, and Evaluation


    In traditional cyber threat intelligence vernacular, indicators are equated with
    Indicators of Compromise, or IOCs, which we covered quite a bit in the first half
    of this book. In structured analysis, indicator does not just mean an IOC, although
    in some cases they are useful in this technique. Instead, indicator in this context
    refers to a set of observations that are used to track events, identify trends,
    or provide warning that something unexpected is occurring, or about to occur.
    In fact, there is an entire discipline around this called Indications and Warnings
    Intelligence, which is worth studying on its own if you find yourself frequently
    leveraging this structured analytic technique. 


    #### Prepare an indicator list


    The first step in this technique is to generate a list of the indicators that
    are used to identify that patterns that indicate a particular activity is or is
    not occurring. With Road Runner, we can capture the list of behaviors that, when
    combined, show us that our organization is being targeted. 


    *   We are engaged in an activity that has historically been targeted by a variety
    of malicious actors


    *   Malicious emails are identified that mimic activities unique to our operations,
    such as offering donations or volunteer support


    *   Adversaries rely on exploit mechanisms that require user-interaction 


    *   Members of our organization who are publicly identified are targeted more
    heavily


    *   Similar tactics that we have seen are also used against other organizations
    similar to ours 


    *   We receive warnings from government and other sharing groups about targeting


    This list of indicators describes the status quo for our current operations, and
    a change in any of these behaviors could mean a change in the threats that we
    are facing. For example, a change in the type of suspicious or malicious emails
    we receive could indicate that something in the threat landscape has changed,
    either our adversaries are switching to a new tactic that we should be on the
    lookout for, or we are being targeted by different actors which we should strive
    to understand. 


    For each indication demonstrating the status quo, it is possible to generate an
    indicator that would let you know that something is changing, either with you
    or with an adversary. These would be indicators we would actively look for. As
    an example, our indicator list could look like this:


    *   The campaign ends and we are no longer engaged in an activity that is heavily
    targeted


    *   Malicious emails are identified with novel subject matter


    *   Adversaries we have seen targeting us begin leveraging vulnerabilities that
    do not require user interaction


    *   We see more widespread targeting of employees, including those who are not
    publicly affiliated with us


    *   Other organizations, governments, or sharing groups begin reporting novel
    tactics and targeting we have not previously identified


    This list can be as detailed as you would like it to be, and can include specific
    tactics being used or vulnerabilities being exploited, as long as you have a plan
    to monitor for them. In fact, an added bonus of generating an indicator list is
    that it can help to establish collection requirements for future monitoring efforts.
    Regardless of whether you prefer to monitor for the status quo remaining the same
    or for direct indications of things changing, the indicators that you generate
    need to be validated and evaluated before operationalizing them. 


    #### Validating and Evaluating Indicators


    One area where Indications and Warning style indicators and IOCs overlap is in
    the validation phase. The criteria of what makes a good indicator are relatively
    the same between the two. The indications need to be something that can be observed,
    either directly or indirectly, otherwise they will only be useful retrospectively.
    The indication needs to be reliable as a sign that something is either remaining
    consistent or is changing. If it’s presence or absence can be influenced by various
    unrelated factors then it is probably not a good thing to monitor. Finally, it
    should be specific and point to one thing that can be monitored or observed, rather
    than a combination of factors which may change independently. For example, in
    our indicator list above we listed out the fact that malicious emails mimic expected
    campaign activities as one indicator, and then the fact that the exploitation
    requires user interaction as a separate indicator. While these two indicators
    both describe the phishing emails that we received, they are two different factors
    that could change independently and should be monitored individually. 


    Similar to ACH, indicators can be evaluated by the criteria above and categorized
    as either ideal indicators that are highly likely to identify activity in the
    situation or scenario that they were designed for, and are highly unlikely to
    indicate alternate activities, or non-diagnostic indicators which could be observed
    in many different unrelated scenarios. Many indicators will fall somewhere in
    between, and alternate scenarios or possibilities should be carefully captured
    and recorded to support analysis if needed. 


    After you have done all of the indicator generation, validation, and evaluation,
    it is important to remember that you are NOT DONE. You need a develop a process
    to monitor for these indicators on a regular basis, whether that is weekly, monthly,
    or some other regular interval. As with all of the core techniques we have covered,
    you should also schedule some time to evaluate your findings regularly, ensuring
    that it remains valid and useful. When reevaluating, it can be helpful to leverage
    some of the structured analytic techniques specifically designed to test previously
    established findings and seek to disprove them. When you have already established
    a viewpoint on something you may need some additional tools to avoid biases and
    remain objective, and contrarian techniques provide those tools.   


    ### Contrarian Techniques'

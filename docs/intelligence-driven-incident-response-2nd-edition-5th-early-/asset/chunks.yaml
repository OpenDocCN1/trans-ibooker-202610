- raw: "Sherman Kent, often referred to as the father of intelligence analysis, wrote\
    \ an essay in 1964 called “Words of Estimative Probability,” which describes various\
    \ qualitative ways to describe confidence in an analyst’s judgment. In that essay,\
    \ Kent shares one of the charts that he and his team use to assign and describe\
    \ confidence (shown in [Figure 2-4](#ch02.html#figure_2_4_sherman_kents_chart_on_estimative_probability))\
    \ but also writes that other terms may be used in their place as long as the meaning\
    \ is understood and the terms are used consistently.\n\n![](assets/image-to-come.png)\n\
    \n# Conclusion\n\nIntelligence has a long and fascinating history and is a field\
    \ that has adapted time and time again to changes in technology and to the growing\
    \ complexities of the world. At its foundation are principles that are part of\
    \ human nature - curiosity, assessing situations for danger, making connections.\
    \ These foundations have been built upon with structured processes and models\
    \ that make these often instinctive mental processes more academically rigorous\
    \ and defensible. Biases, which humans cannot completely escape, can influence\
    \ analysis and need to be identified and countered in analysis to avoid inaccurate\
    \ assessments.\n\nIntelligence is also a critical component of incident response,\
    \ and many processes can be used to integrate intelligence principles into incident\
    \ response investigations. It is important to understand the sources of intelligence\
    \ that you will be relying on; there is a big difference in the way that you treat\
    \ intelligence that came from a previous IR investigation in your network and\
    \ the way you treat information that comes from a honeypot. Both types of information\
    \ are valuable; they just have different applications. The next chapter dives\
    \ into the specifics of incident response and the models that help analysts implement\
    \ intelligence-driven incident response.\n\n^([1](#ch02.html#idm46530565004560-marker))\
    \ https://www.history.com/news/russia-georgia-war-military-nato\n\n# Chapter 3.\
    \ Basics of Incident Response\n\n> “It is a fairly open secret that almost all\
    \ systems can be hacked, somehow. It is a less spoken secret that such hacking\
    \ has actually gone quite mainstream.”\n\n> \n\n> Dan Kaminsky\n\nIntelligence\
    \ is only one half of the intelligence-driven incident-response puzzle. While\
    \ computer incident response isn’t nearly as old as the art of espionage, in the\
    \ last 40 years it has rapidly evolved into a major industry. *Incident response*\
    \ encompasses the entire process of detecting intrusions (whether against a single\
    \ system or an entire network), developing the information necessary to fully\
    \ understand them, developing and executing the plans to remove the intruders,\
    \ and recording information for follow up actions (such as legal actions, regulatory\
    \ reporting, or intelligence operations).\n\nIntrusion detection and incident\
    \ response share many characteristics. Both are abstract. Both complicated topics,\
    \ and as a result people have sought to simplify them by abstracting them into\
    \ cycles or models. These models make understanding the complex interplay between\
    \ defender and adversary possible and form the basis for planning how to undertake\
    \ responding to these incidents. Just like intelligence models, they are rarely\
    \ perfect and can’t always be followed explicitly, but they provide a framework\
    \ for understanding the adversaries’ intrusion and the defenders’ response processes\
    \ and allow multiple responders to work together to understand an intrusion using\
    \ the same terminology and methodology. The combination of shared vocabulary and\
    \ thought processes helps make these complex events less fraught and far more\
    \ likely to succeed.\n\nJust like the exploration of intelligence, this chapter\
    \ starts with overarching theory and then moves to more specific applications\
    \ and models. Afterward we’ll dig into common defensive techniques and finish\
    \ with the integrated intelligence and operations models we’ll use for the rest\
    \ of the book.\n\n# Incident-Response Cycle\n\nIn the same way that we need a\
    \ standard language for discussing intelligence concepts, we need a language to\
    \ discuss detecting and responding to incidents. This process can be viewed from\
    \ both the defender’s perspective and the adversary’s perspective. Let’s start\
    \ with the defenders.\n\nThe *incident-response cycle* is made up of the major\
    \ steps taken in intrusion detection and incident response. The goal of this model\
    \ is to be agnostic to the type of attack (phishing, strategic web compromise,\
    \ service compromise, etc.) and generalize the steps that are generic to all of\
    \ those attacks (and many others). [Figure 3-1](#ch03.html#fig_1_the_incident_response_cycle)\
    \ illustrates this cycle.\n\n![](assets/image-to-come.png)\n\nThere’s some argument\

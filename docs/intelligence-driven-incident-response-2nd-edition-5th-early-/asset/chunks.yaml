    often step-by-step methods for working through different analytic problems. Just
    like the different models we have presented throughout this book; they can be
    leveraged on their own on alongside other analytic methodologies. We will detail
    another methodology that is useful in intelligence-driven incident response, target-centric
    analysis.


    In the book *Intelligence Analysis, a Target-Centric Approach*, Robert Clark identifies
    a new take on the traditional intelligence cycle that focuses on analyst-customer
    and analyst-collector relationships. By emphasizing these relationships, the process
    attempts to build and maintain a collective mental model of the situation to make
    it easy for customers to ask questions and easy for analysts to provide actionable
    intelligence.


    Clark writes that, "the target-centric process outlines a collaborative approach
    for intelligence collectors, analysts, and customers to operate cohesively against
    increasingly complex opponents. We cannot simply provide more intelligence to
    customers; they already have more information than they can process, and information
    overload encourages intelligence failures." He further articulates that recent
    intelligence failures are rarely failures of not having the right information,
    they are primarily the result of failure to share information, failure to analyze
    information objectively, and failure of customers to act once intelligence has
    been shared. Most analysts have experienced each of these three at some time in
    their lives, and they tend to leave a lasting impression. Target-centric intelligence
    aims to address these failures by removing silos between roles and reducing the
    time in between each step of the traditional intelligence.


    An example of the target-centric intelligence analysis process is shown in [Figure
    5-4](#ch05.html#fig_4_).


    ![](assets/analyze_837710_04.png)


    Unlike Structured Analytic Techniques which detail specific methodologies, at
    its core, target-centric analysis is a conceptual model built around an entity
    that is being analyzed. A *conceptual model* is a representation of a system that
    helps others understand what the system entails and how it operates - many of
    the models that we discussed in Find, Fix, and Finish are conceptual models, including
    the `Kill Chain` and the `Diamond Model`. The goal of a conceptual model is to
    build an accepted representation of what is being modeled so that it can be discussed
    among different stakeholders and support collaboration. Since those are two of
    the primary goals of target-centric analysis, the model becomes a key part of
    the process.


    There are a few steps that can help you get started with target-centric analysis:


    **Step 1**


    : Get buy-in from the other stakeholders for changing the way that things are
    done. If you have typically operated in a different fashion with little direct
    collaboration between roles, then this will be a significant change. Since effective
    target-centric intelligence involves input from decisions makers, take the time
    to outline the business case for why you are starting a new approach and how it
    will benefit the organization. You can use the example of how more consistent
    collaboration between incident responders and threat intelligence analysts has
    supported an effective incident response process, and how this new approach to
    intelligence will help to extend that even further.


    **Step 2**



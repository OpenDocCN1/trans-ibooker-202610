    > Abduction: a syllogism in which the major premise is evident but the minor premise
    and therefore the conclusion only probable.

    >

    > [Merriam Webster, ‘Deduction’ vs. ‘Induction’ vs. ‘Abduction’](https://www.merriam-webster.com/words-at-play/deduction-vs-induction-vs-abduction)


    # Abductive Reasoning in Security Investigations


    At this point, you might have guessed that abductive reasoning is what we end
    up using most often in security investigations. Abductive reasoning is in some
    ways a combination of the other two (and mostly what Sherlock Holmes is actually
    referring to). Abduction is the process of taking information that’s available,
    applying past rules and facts, and using that to come up with a plausible set
    of causes. This differs from induction where we’re trying to create these basic
    rules, rather than apply them, and differs from deduction, where you’re taking
    a set of cases and rules and using them to predict an effect.


    Abduction is always the best way to think about our investigations because unlike
    both induction and deduction it takes into account that we rarely have perfect
    information and can rarely come up with universal rules based on the information
    we do have. In addition, our usual goal in investigation is to discover the cause.
    For example, if you said “Our website is down with too much traffic” (An effect)
    and “DDoS for ransom is a common reason for too much traffic” (A rule) then you
    could come up with a cause “We’re being DDoS’d for a ransom”.


    ## What’s the Reasoning for Talking About Reasoning?


    Many of our most common issues and challenges within cyber security come down
    to bad reasoning about problems and bad fundamental assumptions. One example is
    attribution of malware to specific threat actors. For many years the WINNTI malware
    family was commonly treated as being used by only a single threat actor, and the
    threat actors and malware were used interchangeably, in this case a bad rule.
    This itself is an example of induction gone wrong. As a result, this bad rule
    was applied many times and led to confusion around who was really attacking an
    organization, as the adversaries’ actions didn’t match the original WINNTI threat
    actor, and the rule led to confusion. If you look at the MITRE ATT&CK WINNTI Group
    the confusion is clear as they call out overlaps with Axiom, APT17, and Ke3chang.


    In short, if you don’t know how you’re approaching a problem and why you’re approaching
    it that way, it’s easy to introduce mistakes that could lead to confusion or even
    failed analysis farther down the line. The first analyst who saw the WINNTI malware
    and associated it with a single actor may not have been wrong, but the way that
    became accepted became a problem for many organizations later on. The Key Assumption
    Check structured analytic technique is meant to help you challenge and avoid these
    kinds of mistakes, but the best thing possible is to consider how you’re framing
    your thoughts to begin with and avoid them before it becomes a problem!


    # Case Study: The OPM Breach


    One of the most significant breaches that is likely still impacting countless
    people and entities today was the [breach of the United State’s Office of Personnel
    Management (OPM)](http://bit.ly/2uI6oD1), which resulted in the loss of personal,
    highly sensitive information about more than 20 million individuals who had undergone
    a background investigation for a security clearance. In addition to the size and
    sensitivity of the information that was stolen, the OPM breach is notable because
    of the multiple, missed opportunities for the attack to be identified and prevented.
    The intrusion was a complex campaign that spanned years and included the theft
    of IT manuals and network maps, the compromise of two contractors with access
    to OPM’s networks, as well as OPM directly. Even when the individual intrusions
    were identified, no one connected the dots to identify that a larger threat needed
    to be addressed.


    Even before the attackers began their campaign, opportunities existed to take
    what we know about attackers and how they operate and to identify that a government
    agency with access to highly sensitive, highly actionable personal information
    on every American with a security clearance was a high-value target for nation-state
    attackers.


    The complete timeline of the breach is a lesson in how analysis, if done properly
    and in a timely fashion, can prevent or reduce the devastating impact of a successful
    campaign. It also shows just how bad it can be when incident responders, managers,
    and executives fail to connect the dots and see the bigger picture. The OPM breach
    was a classic and disheartening example of a failure to analyze, even when all
    of the information was available.


    # Analytic Processes and Methods


    In incident response, experience with networking, intrusions, and other cyber
    security fundamentals are key to making quick and accurate decisions, recognizing
    patterns of malicious activity, and identifying how to mitigate them. As we learned
    in the chapters on Find, Fix, and Finish, using models such as the kill chain
    and the diamond model, can help us organize both our thoughts and the data surrounding
    an incident. With analysis, we rely on a separate set of skills that tie into
    the knowledge and experience around network intrusions and cybersecurity, but
    are unique to intelligence analysis. These can be thought of as cognitive skills
    that underpin any particular area of content-based expertise. Cognitive skills
    include memory, cognitive processing, logic and reasoning, attention, and cognitive
    flexibility. These skills - which are helpful in all aspects of life - are also
    supported by a set of processes and frameworks that can help apply them to a given
    subject. In intelligence-driven incident response we use Structured Analytic Techniques
    and Analytic Frameworks such as Target-centric analysis and Victim-centric analysis
    to help guide our processes (more on these below).


    The processes and methods described in this section are common approaches to analysis
    and can be used on their own or combined. In intelligence analysis, it is not
    experience with a particular subject that will make the most difference, but experience
    with the overall process of conducting intelligence analysis.


    ## Structured Analytic Techniques


    One of the best primers on Structured Analytic Techniques (SATs) is the book *Structured
    Analytic Techniques for Intelligence Analysis* by Randolph Pherson and Richards
    Heuer Jr, currently on its third edition. While SATs are relevant for all types
    of intelligence analysis, there are some techniques that are more applicable to
    intelligence-driven incident response, so we will focus on those.


    The goal of using Structured Analytic Techniques is to give analysts a (more or
    less) step-by-step approach that is repeatable, explainable to others participating
    in the analytic process, and can be reproduced or the steps retraced by others.
    SATs are specifically designed to counter the type of “system 1” flaw we called
    out at the beginning of the chapter; cognitive biases and misapplied mental models.
    *Structured Analytic Techniques for Intelligence Analysis* breaks SATs into six
    families:


    ### Getting Organized


    Techniques in this family help an analyst at the beginning of the analytic process,
    when they are staring at a pile of data without a solid idea of where to begin.
    It includes methods such as sorting, ranking, and checklists. Fortunately, with
    intelligence-driven incident response you are not starting from a blank slate
    - you have been gathering, sorting, and organizing data throughout the incident
    response process and are often not starting from zero. If, however, you decide
    to spend some time going through old incident data that had not been fully analyzed,
    it could be useful to begin with methods from this family.


    ### Exploration Techniques


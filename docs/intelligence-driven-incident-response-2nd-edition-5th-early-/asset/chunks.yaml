    > 它包含事实的收集。……它包含在这些事实基础上形成假设，检验这些假设中自己无知或偏见的痕迹，并尽可能加以纠正。目标是建立比现有假设更好的假设，并将其确立为相对更真实的假设：即揭示发生了什么的更清晰图景，并比任何人迄今所设计的都更接近实际。


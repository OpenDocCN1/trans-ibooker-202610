    ## STIX 2


    STIX 2 was introduced with several improvements that made its adoption easier
    for many practitioners. One major change was that STIX 2 used JSON format rather
    than XML. STIX 2 also reduced the complexity by merging the two data standards
    (CybOX and STIX) into one standard, called STIX Cyber observables. STIX2 also
    introduced two top-level Relationship objects, “Relationship” and “Sightings”,
    which more clearly define the association between different observables. <ref
    [https://oasis-open.github.io/cti-documentation/stix/compare]>


    When STIX, or any standard, is used fully, it can be a great tool for analysis,
    but just remember that work is required to get all of the information captured!
    STIX is built into many cyber threat intelligence platforms, making it easier
    to use, however it is still important to have a solid process for determining
    what gets captured in this format, and making sure that information on insights
    from an incident is not lost because it never makes it out of the notebook and
    into the platform.


    ### TAXII


    TAXII is a transportation and sharing framework and comprises four services: discovery,
    poll, inbox, and feed management. TAXII is the way that STIX is shared between
    entities or organizations. TAXII has three primary transport and sharing models:


    **Subscriber**: In this model, one central organization shares information with
    partner organizations, without the partner organizations sending any information
    back. This is the model that is most commonly seen with threat-intelligence providers,
    either commercial or open source, who send information to customers.


    **Hub and spoke**: One organization or source serves as the central authority
    for information sharing. It pushes information to other organizations, and when
    those organizations want to share back, they send information to the central organization,
    which redistributes the information to the group.


    **Peer to peer**: This model can be used by any two or more organizations that
    want to share information directly without going through a centralized organization.
    Several mesh networks utilize this model as well.


    In most cases TAXII is used as a top down distribution model, such as from an
    ISAC, which means the Subscriber model. If the others are in use, we haven’t seen
    them.


    ### MILE Working Group


    In addition to the Oasis Suite, another set of data standards is actively maintained
    and updated by the Managed Incident Lightweight Exchange (MILE) Working Group,
    which includes the following:


    #### Incident Object Definition and Exchange Format (IODEF)


    [RFC 5070](https://www.ietf.org/rfc/rfc5070.txt), first published in 2007 defines
    IODEF as “a data representation that provides a framework for sharing information
    commonly exchanged by Computer Security Incident Response Teams (CSIRT) about
    computer security incidents.” IODEF is an XML-based standard, and is used by groups
    such as the anti-phishing working group and ArcSite. It includes tags for sensitivity
    and confidence level. [#iodef_scanning_event](https://atlas.oreilly.com/oreillymedia2/intelligence-driven-incident-response/editor/master/07-exploit.html#iodef_scanning_event)
    shows an example of the IODEF format capturing information on scanning from the
    original RFC.


    #### IODEF scanning event


    Real-time Inter-network Defense (RID). Just as STIX has TAXII to facilitate the
    exchange of information in STIX format, IODEF and IODEF-SCI have RID. The goal
    of RID is to allow different organizations with incident data to share that information
    in a secure, easy-to-manage fashion. RID is defined in [RFC 6545](https://tools.ietf.org/html/rfc6545),
    and RID over HTTPS is defined in [RFC 6546](https://tools.ietf.org/html/rfc6546).
    Similar to TAXII, RID has several options for information-exchange models, including
    direct peer-to-peer and mesh peer-to-peer and client-to-subscriber.


    #### IODEF—Structured Cybersecurity Information (IODEF-SCI)


    This extension to IODEF provides a framework for capturing additional context
    around incident data. [RFC 7203](https://tools.ietf.org/html/rfc7203) defines
    the standards for IODEF-SCI and was first published in 2014. IODEF-SCI provides
    a structure for embedded additional contextual information into IODEF documents,
    including Mitre’s Common Attack Pattern Enumeration and Classification (CAPEC),
    Common Vulnerabilities and Exposures (CVE), Common Vulnerabilities Scoring System
    (CVSS), and several other standards.


    ### OpenIOC


    As we discussed previously, the term *IOC*, or indicator of compromise, was popularized
    by Mandiant. In addition to coining the term, Mandiant developed a standard for
    capturing IOCs, which is called OpenIOC. *OpenIOC* is an XML-based schema (you
    may have picked up on a trend here) that is designed to capture and categorize
    forensic artifacts from compromised hosts as well network indicators related to
    malicious communications or other malicious activity. Mandiant identified over
    500 possible artifacts that can be documented using OpenIOC. However, the framework
    also allows for customization and the creation of new fields as needed by organizations
    using OpenIOC. OpenIOC is interoperable with STIX, and documentation has been
    published on [how to transfer between the two standards.](https://github.com/STIXProject/openioc-to-stix)


    You will likely find yourself needing to convert data from one standard to another
    as you share and receive both threat data and intelligence. It is important to
    be aware of the various fields and components of the standards, because as you
    move between them (for example, from STIX to OpenIOC), you could lose or gain
    certain data fields. If you are unaware of the differences between the standards,
    you may find yourself searching for something that you *know* you had captured,
    but did not make it across in the conversion. When converting from one data standard
    to another, be sure to identify the important fields within the current standard,
    and then identify the equivalent field in the standard to which it will be converted.


    While OpenIOC was an ambitious program is has largely been deprecated at this
    point, as Mandiant merged with FireEye, combined tech stacks, and broke them up
    again as the companies separated. Beyond Mandiant, OpenIOC never really gained
    traction enough to become an industry standard, and eventually lost out to STIX2.


    ## Data Standards and Formats for Strategic Information


    As we mentioned earlier, indicators that can be captured using the preceding formats
    are only half of the picture that you want to capture. Indicators are extremely
    useful for detection and response, but it is also important to gather other contextual
    information that will support strategic analysis. Although that information can
    be stored by using formats such as STIX, standards for capturing technical information
    are not often the best fit. Often such information ends up being stored in documents
    or Powerpoint slides, if it is captured at all. Not as many options exist for
    storing strategic information as for storing technical information, but frameworks
    can be utilized to avoid losing this critical component of incident information.
    We will explore three of the primary standards for storing strategic information:
    ATT&CK, VERIS, and CAPEC.


    ### ATT&CK


    We have mentioned ATT&CK several times already in this book because it truly has
    taken the threat intelligence community by storm over the past few years. As the
    cry was made to move on from just IOCs to actor tactics (and thus up the Pyramid
    of Pain) and techniques became louder and louder starting around 2018, Mitre’s
    ATT&CK was ready to answer the call.

    '
  trans: '


    ## STIX 2


    STIX 2 引入了多项改进，使其更易于许多从业者采用。一项重大变更是 STIX 2 使用 JSON 格式而非 XML。STIX 2 还通过将两个数据标准（CybOX
    和 STIX）合并为一个名为 STIX 网络可观测对象的标准，降低了复杂性。STIX 2 还引入了两个顶层关系对象——“Relationship”（关系）和“Sightings”（目击），它们更清晰地定义了不同可观测对象之间的关联。
    <ref [https://oasis-open.github.io/cti-documentation/stix/compare]>


    当 STIX 或任何标准被充分使用时，它可以成为分析的绝佳工具，但请记住，需要付出努力才能捕获所有信息！STIX 内置于许多网络威胁情报平台中，使其更易于使用，但拥有一个可靠的流程来决定以这种格式捕获什么内容，并确保事件中的洞察信息不会因为从未从笔记本进入平台而丢失，这一点仍然至关重要。


    ### TAXII


    TAXII 是一个传输和共享框架，包含四项服务：发现、轮询、收件箱和源管理。TAXII 是实体或组织之间共享 STIX 的方式。TAXII 有三种主要的传输和共享模型：


    **订阅者**：在该模型中，一个中心组织向合作伙伴组织共享信息，而合作伙伴组织不回传任何信息。这也是威胁情报提供商（无论是商业还是开源）向客户发送信息时最常见的模型。


    **中心辐射型**：一个组织或来源作为信息共享的中央权威机构。它向其他组织推送信息，当这些组织想要共享回传时，它们将信息发送给中央组织，由后者重新分发给群组。


    **对等互联**：该模型可供任意两个或更多希望直接共享信息而无需通过中心化组织的组织使用。一些网状网络也采用此模型。


    在大多数情况下，TAXII 被用作自上而下的分发模型，例如来自 ISAC（信息共享与分析中心），这意味着采用订阅者模型。如果使用其他模型，我们尚未见过。


    ### MILE 工作组


    除了 OASIS 套件外，另一组数据标准由托管事件轻量级交换（MILE）工作组积极维护和更新，其中包括以下内容：


    #### 事件对象定义和交换格式 (IODEF)


    [RFC 5070](https://www.ietf.org/rfc/rfc5070.txt) 于 2007 年首次发布，将 IODEF 定义为“一种数据表示，为计算机安全事件响应小组（CSIRT）常交换的关于计算机安全事件的信息提供共享框架。”IODEF
    是基于 XML 的标准，被反钓鱼工作组和 ArcSite 等团体使用。它包含用于敏感度和置信度的标签。[#iodef_scanning_event](https://atlas.oreilly.com/oreillymedia2/intelligence-driven-incident-response/editor/master/07-exploit.html#iodef_scanning_event)
    展示了一个 IODEF 格式捕获原始 RFC 中扫描信息的示例。


    #### IODEF 扫描事件


    实时互联网络防御 (RID)。正如 STIX 有 TAXII 来促进 STIX 格式信息的交换一样，IODEF 和 IODEF-SCI 有 RID。RID
    的目标是允许拥有事件数据的不同组织以安全、易于管理的方式共享该信息。RID 定义于 [RFC 6545](https://tools.ietf.org/html/rfc6545)，基于
    HTTPS 的 RID 定义于 [RFC 6546](https://tools.ietf.org/html/rfc6546)。与 TAXII 类似，RID
    有多种信息交换模型选项，包括直接对等、网状对等和客户端到订阅者。


    #### IODEF—结构化网络安全信息 (IODEF-SCI)


    该 IODEF 扩展为捕获事件数据周围的额外上下文提供了框架。[RFC 7203](https://tools.ietf.org/html/rfc7203)
    定义了 IODEF-SCI 的标准，于 2014 年首次发布。IODEF-SCI 为将额外上下文信息嵌入 IODEF 文档提供了结构，包括 Mitre 的通用攻击模式枚举与分类
    (CAPEC)、通用漏洞披露 (CVE)、通用漏洞评分系统 (CVSS) 以及其他多个标准。


    ### OpenIOC


    正如我们之前讨论的，*IOC*（入侵指标）一词由 Mandiant 推广。除了创造该术语外，Mandiant 还开发了一种捕获 IOC 的标准，称为 OpenIOC。*OpenIOC*
    是一种基于 XML 的模式（你可能已经注意到这一趋势了），旨在捕获和分类来自受损主机的取证工件，以及与恶意通信或其他恶意活动相关的网络指标。Mandiant
    确定了 500 多种可使用 OpenIOC 记录的可能工件。然而，该框架也允许自定义和根据使用 OpenIOC 的组织需求创建新字段。OpenIOC 与 STIX
    互操作，并已发布了关于[如何在两个标准之间转换](https://github.com/STIXProject/openioc-to-stix)的文档。


    你很可能会发现自己需要在共享和接收威胁数据及情报时，将数据从一种标准转换为另一种标准。了解各种标准的字段和组件非常重要，因为当你在它们之间转换时（例如从 STIX
    转到 OpenIOC），可能会丢失或增加某些数据字段。如果你不了解标准之间的差异，可能会发现自己在寻找一些你*知道*已经捕获的东西，但它们却未能在转换过程中保留下来。在将一种数据标准转换为另一种时，请务必确定当前标准中的重要字段，然后确定目标标准中对应的等效字段。


    虽然 OpenIOC 曾是一个雄心勃勃的项目，但到目前为止它已基本被弃用，因为 Mandiant 与 FireEye 合并、合并技术栈，随后又在公司分拆时将其拆分。除了
    Mandiant 之外，OpenIOC 从未真正获得足够的关注成为行业标准，最终输给了 STIX2。


    ## 战略信息的数据标准和格式


    正如我们之前提到的，使用上述格式捕获的指标只是你想要捕获的全貌的一半。指标对于检测和响应极其有用，但收集其他将支持战略分析的上下文信息也很重要。虽然这些信息可以使用
    STIX 等格式存储，但用于捕获技术信息的标准往往并不适合存储战略信息。通常，如果此类信息被捕获的话，最终往往存储在文档或 PowerPoint 幻灯片中。用于存储战略信息的选项不如存储技术信息的多，但可以利用框架来避免丢失事件信息的这一关键组成部分。我们将探讨三种用于存储战略信息的主要标准：ATT&CK、VERIS
    和 CAPEC。


    ### ATT&CK


    我们在本书中已经多次提到 ATT&CK，因为它在过去几年里确实席卷了威胁情报社区。随着从仅关注 IOC 转向关注行动者战术（从而沿着痛苦金字塔向上）以及关注技术的呼声从
    2018 年左右开始变得越来越响亮，Mitre 的 ATT&CK 已准备好回应这一号召。


    '

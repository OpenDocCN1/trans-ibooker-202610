- raw: 'In addition to internal information about an incident we can also gather considerable
    information about adversaries from external sources. While you are a beautiful
    and unique organization your adversaries probably aren’t brand new and just focused
    on you exclusively. Chances are you’re not the first organization that they have
    targeted, or the first organization to share information about tactics, techniques,
    or other organizations that were targeted. While it is important to remember that
    attribution based off of things that “seem similar” is often not useful for creating
    an exact roadmap of what your organization should do or how you should respond
    to an incident, it can help provide additional context or situational awareness.
    It can help to understand what is similar with other known incidents and what
    is different, where different actions or analysis may need to be made. In this
    sense, it can be similar to a literature review in academic research. A literature
    review involves researchers looking at what previous studies, papers, or analyses
    have been conducted, what conclusions they drew, where they are similar and where
    they are not similar to your own research. The goal of a literature review is
    two-fold - to identify the unique aspects of your research that fill in gaps in
    previous research as well as to build upon and further the overall understanding
    of a topic. In intelligence-driven incident response we want to build upon our
    own knowledge, and if sharing is possible, further the collective understanding
    of threats to help the entire community grow stronger and more resilient to threats.
    Whatever the scope of your knowledge-furthering, it is important to understanding
    what has been reported externally about the actors, indicators of compromise,
    or other information related to your own incident. However, like with a literature
    review, remember that information found during this process should not be directly
    mixed with your own data and findings without a clear citation. In many cases,
    this “literature review” should be kept in a separate section and referred back
    to during the next step of F3EAD, the analysis phase.


    # Extracting and Storing Threat Data


    At the end of an investigation—whether immediately following or six months after
    the fact—you will likely have a plethora of data. Your task in the Exploit phase
    is to take that information, whatever it may look like, and structure it into
    a format that can be analyzed and used moving forward. While there are many different
    ways that an organization may go about this task, we have found that they typically
    fall into two categories - mostly manual, and platform-based. We will walk through
    these two different approaches using two specialized tools - the common spreadsheet,
    and the more exotic graph-based centralized intelligence platform, but first let’s
    talk about standards. 


    ## Standards for Storing Threat Data


    No discussion of threat intelligence would be complete without a discussion of
    the various data standards. Many debates have been had - both over Twitter and
    in hallways around different security conventions - about which standards are
    the best, which are just fads, and which ones are experiencing “a come back.”
    These debates aside, the standards you choose are more than anything based on
    the unique needs of your organization and what you choose may look different than
    what someone else does. We are about to dive into the details of the various data
    standards that may make you never want to talk about them again, but please stick
    with us. Data standards will make your life a lot easier once you find the one
    that works for you - if it helps, think of yourself as a chef planning out your
    *mise* *en* *plate,* determining which style of knife cut and which containers
    are going to make for the easiest meal service. 


    ## Data Standards and Formats for Indicators


    There are several groupings of data standards that are commonly used to store
    and share technical threat data. No one magical standard rules them all - despite
    the industry’s best efforts - so the best approach is to understand what standards
    exist and determine whether one of them will work for you. For example, if you
    are part of sharing organizations that utilize STIX/TAXII to share data, that
    may be a good choice for you to store your own data. If your organization has
    already invested in security tools that use a specific format such as OpenIOC,
    that may work best. If there is more than one standard that you need to work with
    (which we see quite often), the next best approach is to make sure that you understand
    the fundamentals of the various standards and be prepared to do data-field mapping,
    because you likely will be dealing with information in one of these data formats
    at some point.


    ### OASIS Suite - aka STIX/TAXII


    STIX was initially created in 2010 as way to standardize the information that
    was captured about cyber incidents, and to facilitate the automated sharing of
    information between organizations. It was originally maintained by the MITRE Corporation
    on behalf of the Department of Homeland Security. The Oasis Cyber Threat Intelligence
    CT, a component of the Oasis open standards organization, took over MITRE’s role
    in supporting the CyBox, STIX, and TAXII data formats. These standards are some
    of the more well-known standards, in part because of US government adoption of
    this suite. Because of this, many of the Threat Intelligence Platforms have integrated
    STIX - either STIX1 or STIX2.X, along with TAXII, the transport mechanism for
    STIX data. 


    #### STIX 1


    The original version of Structured Threat Information eXpression (STIX 1) was
    built with building blocks called “CybOX”, aka Cyber Observable eXpression. CybOX
    is made up of observables, which are *defined objects with stateful and measurable
    properties.* There are multiple use cases for CybOX, ranging from event management
    to malware analysis and information sharing. There are a large number of CybOX
    objects for capturing observables, although not all of them are directly relevant
    to incident response. <ref [https://stixproject.github.io/getting-started/whitepaper/](https://stixproject.github.io/getting-started/whitepaper/)\>


    In STIX v1, CybOX are the basic units, however the “STIX” portion of the standard
    allows for more contextual detail to be added to the CybOX objects. This enables
    further analysis and is a huge benefit when sharing threat data. These additional
    context fields include Threat Actors, Campaigns, Victim Targets, and TTPs. This
    allows you to take individual observables that are captured through CybOX and
    chain them together and add more context. This is when threat data can truly begin
    to become threat intelligence. Although it is good to know that a certain file
    is malicious, it is more useful from an analytic perspective to know that the
    file was used in a particular campaign targeting victims in a specific sector,
    and that after execution of the file, the actors attempted to exfiltrate intellectual
    property. 


    While it is interesting to look back on STIX 1 as a way to see how systems developed,
    one key component is that STIX 1 wasn’t really meant for people to use it, but
    instead to be tightly integrated with a specific set of tools. As the need for
    information exchange and sharing expanded beyond just a small group of similarly-minded
    organizations, the standard needed to evolve as well. And evolve it did.


    #### STIX 2.X'

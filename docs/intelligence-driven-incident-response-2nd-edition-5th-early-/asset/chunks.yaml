    \ to be more closely studied. A frame often provides a visual means of identifying\
    \ the individual parts of an issue so that they can be viewed independently. In\
    \ this sense, we can think of many of the models we covered in Chapters 4 and\
    \ 8 as analytic frames. With strategic intelligence, however, it is even more\
    \ crucial that our frames be based on both analysis and synthesis. In addition\
    \ to strategic analysis - or breaking down large-scale concepts into their individual\
    \ parts so that they can be understood, we also need to think critically about\
    \ *strategic synthesis -* or understanding how different pieces work together\
    \ in a complex system. As Josh Korbel explains in his paper “[The US Intelligence\
    \ Community’s Creativity Challenge](https://nationalinterest.org/feature/the-us-intelligence-communitys-creativity-challenge-11451)”,\
    \ complex environments are defined not just by their parts, but how those parts\
    \ interact in often unpredictable and unanticipated ways. In complex situations,\
    \ analysis alone will not help understand the situation in a complex system. For\
    \ a truly complex system, in addition to breaking down an issue into parts, framing\
    \ must also include information on how the different parts interact and under\
    \ what circumstance will the parts impact other parts. This process is called\
    \ synthesis, and is a crucial part of framing for strategic intelligence in an\
    \ increasingly complex world. In fact, synthesis is one of the primary reasons\
    \ that it is so important to include intelligence-driven incident response findings\
    \ into strategic intelligence - it helps identify and call out those relationships\
    \ between parts of the system and highlight the changing nature of the landscape\
    \ in which an organization or business is operating.\n\nFrames can be either mental\
    \ frameworks for approaching problems, a descriptive way that the problem is presented\
    \ to others, or as mentioned above, a visual representation of a system or situation.\
    \ With strategic intelligence which is used by many people in many different roles\
    \ ranging from analyst to CEO, a documented, often visual, frame is one of the\
    \ best ways to keep all necessary parties aligned. In the next sections we will\
    \ cover a few of the models that can help with framing in strategic intelligence.\n\
    \n### Models for Strategic Intelligence\n\nIn *Psychology of Intelligence Analysis*,\
    \ Richards Heuer points towards models as a key method to overcome several shortcomings\
    \ analysts face, including the limitations of working memory and the ability to\
    \ clearly recall multiple details, their connections, and their often complex\
    \ context at any given point in time. We have used models in several different\
    \ ways throughout this book precisely because they are such good tools to support\
    \ analysis. With strategic intelligence, we will use models primarily as a way\
    \ to create a detailed visual representation of a problem to assist with framing,\
    \ analysis, and synthesis.\n\n#### Target models"

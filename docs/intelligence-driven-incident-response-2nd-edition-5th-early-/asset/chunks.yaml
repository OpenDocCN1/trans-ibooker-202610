    ## Contrarian Methods


    The final type of structured analytic technique to cover includes several methods
    that are considered to be *contrarian*, meaning they seek to go against the existing
    standards or norms by providing a different view of the situation. In some cases,
    the initial analysis is conducted using contrarian methods, whereas in others
    contrarian techniques are used to question an existing judgment to ensure the
    analysis stands up in all possible situations. This type of analysis is not required
    in every case, but is strongly recommended for analysis for which a wrong judgment
    would have serious consequences, or where the judgment is expected to be contested.


    ### Devil''s Advocate


    Devil''s advocate is used to challenge a widely accepted analysis of a situation
    by taking an opposing viewpoint and evaluating whether the available evidence
    truly disproves the alternative point of view. The devil''s advocate approach
    does not truly intend to prove that the alternative viewpoint is correct and the
    accepted analysis is wrong. Instead, it looks to expose any weaknesses in the
    original analysis, uncover any biases that were not accounted for, and help the
    original analysis stand up to intense scrutiny.


    [Add Example]


    ### "What If" Analysis


    This type of analysis attempts to introduce new variables into the situation to
    see how that would change the analysis. For example, "What if this key piece of
    evidence is part of a deception campaign by the adversary?" or "What if this log
    data has been tampered with?" Again, this type of analysis does not attempt to
    directly disprove a hypothesis, and in fact can help with assessing confidence
    in an overall judgment by determining whether the analysis is sound even when
    certain pieces of intelligence are called into question. This technique can be
    useful in step 6 of the `ACH` process, as the analyst determines how much of the
    analysis relies on one or two pieces of evidence.


    ### Red Team Analysis


    This technique seeks to analyze how an adversary would think or act in the given
    situation. The analyst tries to put themselves in the mindset of the attacker
    and asks questions such as, "What is important to me in this situation?" and "What
    actions would cause me to deviate from the plan?" When conducting red team analysis,
    it is critical that an analyst take on an adversary''s persona. This technique
    can help counter mirror-imaging or mirroring bias by forcing an analyst to identify
    when an adversary''s mindset would differ from their own. Red teaming helps to
    identify additional factors that an analyst may not have initially considered.


    Red teaming is a well-known concept in the information security industry, and
    it is important to know that this type of analysis relies on an understanding
    of an adversary, including basing the decision on the adversary''s social, political,
    and cultural tendencies, as opposed to some red team exercises that take a "just
    do whatever works" approach.


    ## Futures Wheel


    A professor of mine described history as "And one thing led to another". It''s
    a simple way to think about it, but has a lot of elegance to it. In most cases
    a decision doesn''t just have a singular outcome, but leads to multiple other
    outcomes. The Futures Wheel technique is a forecasting technique aimed at not
    just asking "What are the possibilities?" but asking "What could happen if this
    happens?" It works by creating an outline from an event, real or predicted, and
    then create a set of branches off of that of hypothetical possibilities. The key
    though is to consider what each of those possibilities entail and restart the
    process, taking each possibility and creating a new set of hypothetical possibilities.
    This spanning lets you see how one set of decisions could lead to unexpected possibility
    and better choose your decision consider 3rd, 4th, or nth level effects!



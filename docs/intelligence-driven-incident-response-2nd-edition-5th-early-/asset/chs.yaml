- '# 第 2 章 情报基础


  > 它包含事实的收集。……它包含在这些事实基础上形成假设，检验这些假设中自己无知或偏见的痕迹，并尽可能加以纠正。目标是建立比现有假设更好的假设，并将其确立为相对更真实的假设：即揭示发生了什么的更清晰图景，并比任何人迄今所设计的都更接近实际。

  >

  > — Sherman Kent





  情报分析是人类历史上最古老、最恒久的概念之一。每天清晨，人们打开新闻或在手机上浏览信息流，寻找有助于规划一天行程的信息。天气预报如何？这对当天的活动有何影响？交通状况如何？他们是否需要预留额外时间才能到达目的地？外部信息与内部的经验和优先级设定进行比较，并对目标主体——即当事人——产生的影响做出评估。


  这就是情报的基本前提：从多种来源获取外部信息，并针对现有需求进行分析，以提供影响决策的评估。这一过程发生在个人层面，也发生在更高层面；同样的流程每天都在群体、组织和政府层面实施。但有一个巨大的陷阱——与许多日常分析形式不同，情报分析涉及试图了解一个非常想对你保持隐蔽的对手。天气预报——尽管偶尔不准——并非故意诱骗你把伞落在家里，让你淋成落汤鸡。因此，情报分析几乎总是涉及某种程度的保密性。即使它不属于机密政府项目，也涉及一个不想让你掌握全貌的实体。同样，你也不希望该实体知道你对它的了解程度，否则它可能会改变战术，导致你不得不从头开始。事实上，情报工作中一个重要的辩论围绕着情报得失的概念展开（我们将在第
  $ 章深入探讨），分析师必须确定：采取某个会警告对手其存在、战术或工具已被识别的行动，会损失多少情报价值。


  尽管传统政府和军事领域内外的情报培训项目日益增多，但许多个人目前仍在没有正式培训的情况下自行开展某种形式的情报分析，许多安全团队在进行调查时也遵循类似流程，却未意识到他们实际上正在从事情报分析。虽然直觉分析对安全项目有益，但当利用流程和模型等基本结构来简化情报工作、消除偏见，并使分析判断具有可辩护性和可重复性时，其效用更大。


  当企业和政府开展情报行动时，其依据是多年来形成的正式化流程和教条。此外，还存在专门针对信息安全和应急响应中的情报行动而定制的正式化流程。本章将梳理关键概念，有的源自情报学，有的源自安全学，还有一些两者兼具。我们将从主要源自情报教条的抽象概念入手，逐步过渡到可直接应用于您的应急响应调查的更具体概念。


  ## 情报与研究


  情报作为一门学科，遵循与其他应用研究类型相同的基本原则，但存在几个显著差异：保密性、时效性和不可复现性。第一点正如我们上面简要提到的，即理解情报往往处理主体或目标主动试图隐瞒的事项。研究人员无法去档案馆或搜索在线资源库找到他们所需的*所有*信息。他们或许能找到大量相关信息，但始终存在一个不言而喻的共识：关键信息被故意排除在公开信息之外。


  第二个差异在于，时效性在情报分析中比在其他研究形式中重要得多。如果信息未能在决策者需要之前完成分析并呈报，那么它很可能已不再相关。第三个差异是，由于前两个原则，可复现性——即复现发现的能力——往往无法实现。大多数分析师无法获取完全相同的信息来对分析判断进行外部验证，而情报产品所要求的时效性意味着同行评审在该领域极为罕见，通常只在情报失败事后才会进行。


  ## 数据与情报


  在处理其他问题之前，理清本讨论中最重要的区别之一至关重要：信息、数据与情报的区别。这些都是安全社区的重要术语，遗憾的是常被混用，以至于许多从业者难以清晰阐述它们之间的差异。


  《联合出版物 2-0》（"Joint Publication 2-0"）是美军主要的联合情报教条，是当今使用的基础性情报文件之一。其引言指出：“信息本身对指挥官可能有用，但当它与作战环境的其他信息相关联，并结合过往经验加以考量时，会产生对该信息的新理解，这可称为情报。”


  数据是一条信息、一个事实或一个统计数字。数据描述的是客观存在的事物。在我们之前的天气预报示例中，温度就是一条数据。它是一个事实，通过经过验证且可重复的过程测得。知道温度很重要，但为了对决策有用，必须结合当天发生的其他情况进行情境分析。在信息安全领域，IP
  地址或域名都是数据。在没有任何额外分析提供上下文的情况下，它们仅仅是事实。当收集各种数据点并加以分析以满足特定需求并提供洞察时，它就变成了情报。


  情报源自收集、处理和分析数据的过程。一旦分析完成，必须进行传播才能发挥作用。情报不仅需要传播，还需及时触达预期受众。未能送达正确受众的情报就是被浪费的情报。研究和平与冲突的瑞典作家、历史学家威廉·阿格雷尔曾名言道：“情报分析融合了新闻业的动态性与科学的问题解决能力。”


  数据与真正情报的区别在于分析。情报要求基于一系列需求进行分析，旨在回答与决策者相关的问题。没有分析，安全行业产生的大多数数据仅仅是数据。然而，一旦这些数据针对需求得到妥善分析，就成为情报，因为它现在包含回答问题和支持决策所需的适当上下文。


  ## 来源与方法


  既然我们已理清信息、数据与情报的区别，下一个自然而然的问题就是：“我应该从哪里获取这些数据，以便分析并生成情报？”


  传统情报来源通常围绕“情种”（INTs）展开，它们描述了数据的收集渠道：


  **人力情报（HUMINT）**：





  ## 情报收集学科


  ## HUMINT（人力情报）


  人力情报源于人类，无论是通过秘密或隐蔽方法，还是通过公开收集（如来自外交官）。人力情报是最古老的情报收集形式。关于网络威胁情报是否可以从 HUMINT 中获取，存在严肃的争论，然而越来越多的证据表明
  HUMINT 可以成为故事中至关重要的一部分。一个例子是对涉入入侵事件或拥有入侵第一手知识的个人进行访谈或交谈，例如当 `Kaspersky Labs` 的研究人员设法联系上一名系统管理员，其网络作为
  `Moonlight Maze` 行动的一部分被攻陷。这位系统管理员不仅提供了只有经历过入侵的人才能拥有的内部信息和视角，还提供了入侵期间使用的一台服务器的访问权限——那台服务器一直放在他的桌子底下——HUMINT
  往往能引出额外的数据收集。另一个常被描述为 HUMINT 的例子是通过受限或仅限会员的在线论坛与个人互动获得的信息。这种情报收集类型也可被视为 SIGINT，因为它源于电子通信。


  ## SIGINT（信号情报）


  信号情报包括通过拦截信号获得的情报，包括通信情报（COMINT）、电子情报（ELINT）和外国仪器信号情报（FISINT）。大多数技术情报收集都属于 SIGINT
  范畴，因为毕竟，计算机通过电子信号运作，所以源自计算机或其他网络设备的任何东西都可被视为 SIGINT。


  ## OSINT（开源情报）


  开源情报从公开可用的来源收集，包括新闻、社交媒体和商业数据库，以及各种其他非机密来源。我们之前讨论过，情报分析（包括网络威胁情报）涉及某种程度的保密性。然而，这并不意味着*所有*情报来源都必须是秘密的。关于网络安全威胁的公开报告是一种
  OSINT，在情报分析中非常有用。在处理政府支持的行为体时，详细描述该政府进攻性网络部队组织架构的出版物能提供大量知识。OSINT 还能帮助揭示公开可访问的技术细节，如
  IP 地址或域名；例如，详细记录谁注册了恶意域名的 `WHOIS` 查询。


  ## IMINT（影像情报）


  影像情报从视觉表现中收集，包括摄影和雷达。IMINT 通常不是网络威胁情报的来源，但总会有视觉表现能提供关键信息的情况，例如在大规模、政府支持的拒绝服务攻击期间监控部队调动的能力，正如之前在俄罗斯和格鲁吉亚冲突中所见。[¹]


  ## MASINT（测量与特征情报）


  测量与特征情报通过技术手段收集，不包括信号和影像。MASINT 通常包括核、光学、射频、声学和地震特征。由于 MASINT 专门排除了信号情报，它也不是典型的网络威胁情报来源。


  ## GEOINT（地理空间情报）


  地理空间情报从地理空间数据中收集，包括卫星和侦察影像、地图、`GPS` 数据以及其他与位置相关的数据源。一些组织认为 IMINT 是 GEOINT 的一部分，而另一些则认为它是一个独立的学科。与
  IMINT 类似，GEOINT 不是典型的网络威胁情报来源，但它可以提供关于威胁的背景信息，帮助你理解攻击者如何利用网络领域实现其目标。


  ## 其他情报学科


  此时，许多人会提出多年来出现的各种其他 INT，包括 `CYBINT`、`TECHINT`、`FININT`，以及我们发现的最新一个——`CyberHumint`——但这些新术语大多已被其他情报收集方法涵盖。例如，网络情报主要源自
  `ELINT` 和 `SIGINT`。争论现存 INT 的数量并不重要；重要的是理解数据的来源。归根结底，如果将特定收集类型称为其自己的 INT 有助于工作，那就尽管用吧；只需准备好应对该领域常出现的术语冲突即可。


  ## 网络威胁情报特定收集方法


  除了此处列出的传统情报收集学科外，一些收集方法常专门用于网络威胁情报。深入了解这些特定威胁数据的来源非常有用：


  ### 事件与调查


  这些数据源自对数据泄露和事件响应活动的调查。这通常是网络威胁情报中使用的最丰富数据集之一，因为调查人员能够识别威胁的多个方面，包括所使用的工具和技术，且通常能识别入侵背后的意图和动机。


  ### 蜜罐与蜜网


  这些设备被设置为模拟单台机器或整个网络，并收集关于与这些设备交互的信息。蜜罐有多种类型：低交互、高交互、内部蜜罐和公共互联网上的蜜罐。只要你知道蜜罐的类型、它们监控的内容以及交互的性质，蜜罐信息就很有用。从捕获漏洞利用尝试或在系统上安装恶意软件尝试的蜜罐收集的流量，在分析中比扫描或网页抓取流量要有用得多。


  ### 论坛与网站


  各种公司声称拥有深网或暗网收藏。在许多情况下，这些公司指的是访问受限、无法从互联网轻易访问的论坛和聊天室。在这些论坛和网站上，个人经常交换经过分析后很有价值的信息。这类网站数量众多，几乎不可能让任何一家公司完全覆盖
  `the dark net`，因此要意识到收集范围通常有限，且会与其他声称拥有类似数据的公司有所不同。


  即使这些技术也是过去常用技术的新迭代。随着技术演进，故者常新，情报亦不例外。哲学家乔治·桑塔亚那关于遗忘过去的警示一如既往地真实。


  ## 模型


  ## 模型的作用


  模型是分析师工具箱中的关键工具。没有模型，许多分析师将无法应对世界上存在的海量数据，或应对要求他们赋予这些数据意义的需求。他们将难以综合刚才讨论的所有各种来源收集的信息，并产出与决策者相关的意义和洞察。


  ## 模型类型：心智模型与概念模型


  关于情报用途模型的最佳工作定义之一来自《定量情报分析》一书——“模型是指对系统、实体、现象或过程的认知、概念、数学、物理或其他逻辑表征。”网络威胁情报中最常用的两种模型是心智模型和概念模型。心智模型是持有分析师现实感知的认知模型。即使分析师接受过相似的正规培训，由于个体感知和处理信息的多样化方式，他们的心智模型可能截然不同。


  [¹]: 1





  另一方面，概念模型是显性知识的表现，通常是基于已编码化的心智模型进行情报综合的结果。一些最有用的模型源于分析师捕捉并编码化了他们直观解决或思考问题的方式。一个例子是用于入侵分析的钻石模型，我们将在第
  3 章“事件响应基础”中深入介绍。该模型的创建者之一塞尔吉奥·卡尔特格里奥内将新模型的生成描述为“一个漫长的过程，即理解我们反复进行的工作，直到我们足够了解它以便将其抽象化。一旦抽象化，它就变得无限地更有用，因为我们随后可以向[模型]提出新问题。”塞尔吉奥还将模型描述为公式——在完全利用它们之前，你必须理解其组成部分及其关系。


  编码化概念模型的目标是能够构建信息结构，以便对其进行分析和采取行动。情报分析中常用的许多模型（包括钻石模型）将在第[3](https://atlas.oreilly.com/oreillymedia2/intelligence-driven-incident-response/editor/master/02-basics-of-intelligence.html#basics_of_incident_response)章（事件响应基础）和第
  7 章（分析）中进一步介绍。


  ## 使用模型进行协作


  使用显性概念模型（而非仅使用心智模型）的主要好处之一是它能促进协作。情报协作被比作“公开思考”，因为它要求分析师口头表达或以其他方式阐述难以描述的分析和综合心智过程。模型对分析协作至关重要，并将产出更高质量的情报，因此值得投入时间，确保团队成员了解常用的不同概念模型，并理解编码化他们在分析中常用的心智模型的过程。


  ## 过程模型


  模型可分为两大类：代表我方与对方行动互动的模型——“首先我做 X，然后他们做 Y，接着我……”——但在现实中，很难知道对手将如何应对。在应对可能不可预测行动的人类对手时，总会存在一定程度的不确定性，这会让厌恶风险的人不敢采取任何行动。如有疑虑，请回顾你的需求，甚至进一步回顾你团队或项目的目标和使命。你的任务是保卫网络吗？还是保护用户数据或公共安全？确保这些需求和使命包含在定向阶段，这有助于在决定最佳行动方案时避免决策瘫痪。


  ![](img/image-to-come.png)





  ## 情报周期


  情报周期如图 2-3 所示，是生成和评估情报的正式流程。该周期始于上一个情报流程结束之处，并在此基础上持续构建。情报周期不必严格遵循每一个细节。事实上，本书后面探讨的流程将在此基础上构建。然而，你必须小心，不可遗漏关键步骤。如果你开始跳过整个步骤，就会面临最终得到更多数据和问题而非情报的风险。


  ![](img/image-to-come.png)


  要妥善利用情报周期，你需要了解各步骤涉及的内容，我们将在接下来深入探讨。


  ### 方向


  情报周期的第一步是方向——也称为需求。*方向*是确定情报旨在回答的问题的过程。该问题可以来自外部来源，由情报团队自身制定，或由利益相关者和情报团队共同制定。（这有时称为
  *RFI 流程*，我们将在第 4 章“查找”中讨论。该过程的理想结果是一个清晰、简洁的问题，其答案为利益相关者所可用。


  大量情报工作围绕需求展开。在情报界，任何开展的工作或流传的报告都需要直接关联到某项情报需求，无论是常设（长期）需求还是优先（紧急且时效性强）需求。


  ### 收集


  下一步是收集回答问题所需的数据。这是一项广泛的工作，应侧重于从多个来源收集尽可能多的数据。冗余信息在此处增加价值，因为佐证往往很重要。


  这引出了建立有效情报计划的一个关键理念：建立收集能力。很难确切知道哪些数据最终可能被证明有用，因此建立广泛的能力以收集各类信息非常重要。这包括战术信息，如基础设施、恶意软件和漏洞利用，以及作战战略信息，如攻击者目标、社交媒体监控、新闻监控和高层文档开发（识别报告，如供应商发布的关于团体的报告，并从中收集信息）。请务必记录来源并谨慎对待：新闻故事往往转载或引用相同的原始材料，导致难以分辨什么是佐证，什么只是对同一材料的重述。如果无法确定特定数据集的来源，你可能需要避免将其用作收集来源。


  收集是一个过程，而非一次性行动。利用第一轮收集的信息（如收集 IP 地址）引出第二轮（如使用反向 DNS 查找与这些 IP 地址相关的域名），进而引出第三轮（使用
  WHOIS 收集关于这些域名的信息）。这种开发利用随着自身的构建而呈指数级增长。此时的重点不是理解数据如何关联，而只是尽可能开发更多信息。关联分析留待后续进行。此外，别忘了考虑内部来源，如事件管理系统。组织发现其早已熟知的行为体或攻击的情况很常见。


  ### 处理


  数据并不总是能以其原始格式或收集时的格式直接使用。此外，不同来源的数据可能采用不同格式，有必要将其转换为统一格式，以便共同分析。使数据可用所需的*处理*往往是一项被忽视的任务，但没有它，生成情报几乎是不可能的。在传统情报周期中，处理是收集的一部分。然而，在处理事件响应中涉及的数据类型和组织时，单独考虑处理可能更有用。以下是处理与网络威胁相关数据的一些最常见方式。


  #### 标准化


  处理包括将收集的数据标准化为统一格式以供分析。收集过程将产生几乎所有可想象的数据结果。情报数据采用多种格式，从 JSON、XML、CSV 到电子邮件中的纯文本。供应商在网站的博客文章或表格中共享信息，也以基于
  PDF 的报告甚至 YouTube 视频的形式共享。同时，组织倾向于以不同格式存储数据。一些组织使用专门构建的威胁情报平台，而其他组织则从维基或内部应用程序构建定制解决方案。


  #### 索引


  大量数据需要可搜索。无论处理网络地址和互斥体等可观测指标，还是论坛帖子和社交媒体等作战数据，分析师都需要能够快速高效地搜索。


  #### 翻译


  在某些情况下，地区分析师可能提供源文档的人工翻译，但对于处理来自世界各地信息的大多数组织来说，这通常不可行。机器翻译虽不完美，但通常提供足够的价值，使分析师能找到感兴趣的项目。如有必要，随后可升级给专家进行更准确的翻译。


  #### 丰富


  为一条信息提供额外的元数据很重要。例如，域名地址需要解析为 IP 地址，并获取 WHOIS 注册数据。Google Analytics 跟踪代码应交叉引用以查找使用相同代码的其他网站。此丰富过程应自动完成，以便相关数据立即可供分析师使用。


  #### 过滤


  并非所有数据提供同等价值，当面对无尽的无关数据流时，分析师可能不堪重负。算法可以过滤掉已知无用的信息（尽管仍可搜索），并将最有用和相关的数据浮现出来。


  #### 优先级排序


  收集到的数据可能需要排序，以便分析师将资源分配给最重要的项目。分析师的时间宝贵，应正确聚焦以最大化情报产品的效益。


  #### 可视化


  数据可视化已显著进步。虽然许多分析师因供应商仪表盘通常包含的杂乱内容而畏惧它们，但基于分析师需求（而非市场和高管认为好看的东西）设计可视化，有助于降低认知负荷。


  花时间有效处理数据能赋能并改进未来的情报工作。


  ### 分析


  *分析*既是一门艺术也是一门科学，旨在回答方向阶段确定的问题。在情报分析中，收集到的数据被表征并与其他可用数据对照考量，并对其含义和影响做出评估。通常会对未来影响做出预测。进行分析有多种方法，但最常见的是使用分析模型来评估和构建信息、识别关联，并对其影响做出评估。除了我们将在本章后面介绍的预存模型外，分析师开发适合其特定数据集或解读信息方式的自有模型也很常见。





  ## 情报周期


  ## 分析阶段


  分析阶段的目标是回答情报周期中方向阶段确定的问题。答案的类型将由问题的性质决定。在某些情况下，分析可能会生成一种新的情报产品，形式为报告；也可能简单到只是一个是/否的答案，通常伴随着一个置信度值。在开始分析之前，了解输出内容将是什么非常重要。


  分析不是一门完美的科学，通常必须在信息不完整和不确定性的情况下进行。分析师识别并清楚地说明其分析中的任何信息缺口非常重要，以便决策者能够了解分析中潜在的盲点。信息缺口还可以驱动收集过程，以识别新来源来减少这些缺口。如果缺口大到分析师认为凭借当前信息无法完成分析，则可能有必要返回收集阶段并收集更多数据。推迟最终分析总比提供分析师明知有缺陷的评估要好得多。


  重要的是要注意，所有情报分析都是由人生成的。如果是自动化的，那实际上是处理，这是情报周期中的关键步骤，但本身不构成分析。


  ## 传播


  此时，流程已生成真正的情报：对方向阶段提出问题的情境化回答。一份包含答案的报告，在共享给相关利益相关者（即能够使用该情报的人）之前是毫无用处的。在许多有据可查的情报失败案例中，分析非常准确，但传播却失败了。必须以利益相关者认为最有用的形式与他们共享情报。这使得传播取决于受众。如果产品面向高管，考虑篇幅和措辞很重要。如果面向技术系统实施（如
  IDS 或防火墙），这可能需要特定供应商的编程格式。无论如何，情报必须可被相关利益相关者使用。


  ## 反馈


  反馈阶段常被遗忘，但它是持续情报工作的关键。反馈阶段询问生成的情报是否成功回答了方向要求。这会导致两种结果之一：


  **成功**


  : 如果情报流程回答了问题，周期可能就结束了。不过在许多情况下，成功的情报流程会根据新问题或基于给定答案采取的行动，引出对更多情报的请求。


  **失败**


  : 在某些情况下，情报流程失败了。在这种情况下，反馈阶段应重点关注识别原始方向中未得到妥善回答的方面。后续的方向阶段应特别注意解决失败的原因。这通常归结为：结构不佳的方向阶段未能充分缩小目标；或不完整的收集阶段无法收集足够数据来回答问题；或不当的分析未能从可用数据中提取正确（或至少有用）的答案。


  ## 使用情报周期


  让我们考虑如何利用情报周期开始了解一个新的对手。


  首席信息安全官（通常缩写为 CISO）最常问的问题之一（希望在别人问她之前）是：“我们对这个我听说的威胁组织了解多少？”CISO 将希望基本了解某组织的能力和意图，以及其与特定组织的相关性评估。那么在这种情况下，情报流程是什么样的呢？以下是情报周期各步骤为满足
  CISO 需求所涉及内容的示例：


  ## 方向


  这来自关键利益相关者：CISO。“我们对 `X` 威胁组织了解多少？”真正寻求的答案是一个目标包，我们稍后将详细探讨。


  ## 收集


  从原始来源开始，最可能是新闻文章或报告。该文档通常将为开始收集提供至少一些背景。如果源材料包含关于特定入侵或攻击的信息，了解更多关于被攻击实体的情况，并识别入侵的潜在动机或目标，会很有帮助。如果存在指标（IP、URL
  等），请通过关联和丰富尽可能深入地探索它们。来源本身可能指向包含 IOC、战术、技术和程序 (TTP) 或其他分析的额外报告。


  ## 处理


  这非常依赖于工作流/组织。将所有收集到的信息放入一个可以最有效使用的地方，可能只是简单地将所有信息放入单个文本文档，也可能需要将所有信息导入分析框架。可以使用与该组织相关的技术细节进行额外的丰富。此外，可能需要翻译报告或其他文档。


  ## 分析


  利用收集到的信息，分析师将首先尝试回答关键问题：


  * 这些攻击者对什么感兴趣？

  * 他们通常使用什么战术和工具？

  * 防御者如何检测这些工具或战术？

  * 这些攻击者是谁？（虽然这始终是一个问题，但并不总是值得花时间去回答。）


  ## 传播


  对于这种有特定请求者（CISO）的产品，一封简单的电子邮件可能就足够了。虽然在某些情况下将回复限制在此范围内是合理的，但用于主动分发给他人的真正产品几乎总是能创造更大的价值。


  ## 反馈


  关键问题：CISO 对结果满意吗？这是否会引出其他问题？这些反馈有助于闭环，并可能开启新一轮收集。


  情报周期是一个通用模型，可用于回答大大小小的问题。然而，重要的是要注意，遵循这些步骤不会自动产生良好的情报。


  ## 良好情报的特质


  情报的质量主要依赖于两件事：收集来源和分析。在网络威胁情报中，我们很多时候最终处理的是我们自己并未收集的数据，因此我们必须尽可能多地了解该信息，这至关重要。当我们自己生成情报时，也需要确保我们了解收集来源，并解决分析中的偏见。以下是应考虑的一些事项，以确保产出高质量情报：


  ## 收集方法


  了解信息主要是从事件或调查中收集，还是从蜜罐或网络传感器等自动化收集系统中收集，这很重要。虽然了解收集的确切细节并非绝对必要——一些提供商倾向于保密其来源——但可以在不损害收集资源的前提下，基本了解数据来源。你掌握的关于信息收集方式的细节越多，你对该信息的分析就会越好。例如，知道数据来自蜜罐是好的；但知道它来自一个配置为识别针对远程
  Web 管理工具暴力破解尝试的蜜罐会更好。


  ## 收集日期




  ## 网络威胁数据的易失性


  所收集的大多数网络威胁数据都是易失的。该数据的生命周期从几分钟到潜在的几个月甚至几年不等，但总有一段时间是该信息相关的。了解数据收集的时间可以帮助防御者理解如何对其采取行动。如果不知道数据何时被收集，就很难正确分析或利用任何数据。


  ## 背景


  收集方法和日期都能为数据提供一定程度的背景，但可用的背景信息越多，分析起来就越容易。背景可以包括额外细节，例如与信息相关的具体活动以及信息片段之间的关系。


  ## 解决分析中的偏见


  所有分析师都有偏见，识别并抵消这些偏见以使其不影响分析，是高质量情报的关键组成部分。分析师应力求避免的偏见包括*确认偏误*，即寻找支持先前得出结论的信息；以及*锚定偏误*，即导致分析师过度关注单条信息而忽视其他可能更有价值的信息。我们在第
  7 章“分析”中深入探讨偏见。


  ## 情报层级


  我们迄今为止研究的情报模型侧重于信息通过某种分析管道的逻辑流向。但正如事件分析一样，这种方法并非建模信息的唯一途径。我们可以从不同抽象层级来思考情报，范围从高度具体（战术）到后勤/作战层面（作战）再到非常笼统（战略）。在审视这些情报层级时，请记住该模型代表一个连续的光谱，中间存在灰色地带，而非离散的桶。


  ## 战术情报


  **战术情报**是支持安全运营和事件响应的低层级、高度易失性信息。战术情报的客户包括安全运营中心（SOC）分析师和计算机事件响应团队（CIRT）调查员。在军事领域，这一层级的情报支持小分队行动。在网络威胁情报（CTI）中，这通常包括
  IOC 和可观测对象，以及高度细粒度的 TTP，精确描述对手如何部署特定能力。战术情报使防御者能够直接应对威胁，方法包括在网络中搜寻对手活动的迹象、根据活跃利用报告确定关键补丁的优先级，或向员工发布针对其组织的活跃网络钓鱼活动信息。


  战术情报的一个例子是与新发现漏洞利用相关的 IOC。这些战术层面的 IOC 包括执行扫描搜索漏洞的 IP 地址、托管恶意软件的域名（如果利用成功，恶意软件将被下载到主机），以及在利用和恶意软件安装过程中生成的各种基于主机的工件。这种战术情报将使安全运营团队能够有效地在网络中搜寻恶意活动，同时采取具体措施缓解任何未来的利用。


  ## 作战情报


  在军事领域，**作战情报**比战术情报高一个层级。该信息支持后勤并分析地形和天气对大规模行动的影响——换句话说，它涉及的背景远超当前的战术任务。在 CTI 中，这通常包括关于活动和高阶
  TTP 的信息，以及预期的对手响应和这些行动可能如何影响其他行动。它还可能包括特定攻击者归因、能力和意图的信息。作战情报的客户包括高级数字取证和事件响应（DFIR）分析师以及其他
  CTI 团队。


  这是许多分析师难以处理的情报层级之一，因为它有时感觉太笼统而不像战术情报，又太具体而不像战略情报。作战情报需要在一定程度上紧急采取行动，然而任何采取的行动都可能产生深远影响，因此
  OODA 循环中的“观察”和“定向”阶段包含更多组件和复杂性。此外，处理数据的分析师和位于高管层的决策者对做出决策并采取行动的必要性感受不同，后者可能希望花费大量时间权衡最佳行动方案。


  承接前文关于漏洞活跃利用战术指标的示例，作战层面的情报将包括利用范围有多广、是定向还是机会主义、还有谁被攻击、正在安装的恶意软件的目的，以及实施攻击的攻击者的任何细节。了解这些细节可以支持后续情报的生成，包括可能观察到的其他行动，并应包含威胁严重性信息以帮助规划响应。


  ## 战略情报


  在军事或政府领域，**战略情报**处理国家和政策层面的信息，通常是多年分析工作的积累，旨在提供态势的全貌。在 CTI 中，我们认为这是支持高管和董事会在风险评估、资源分配和组织战略方面做出重大决策。该信息包括威胁趋势和攻击者动机，以及与组织相关的其他信息。在前面的示例中，战略情报将包括攻击者动机的信息，特别是当活动表明存在新的或先前未识别的威胁时，以及任何表明新战术或攻击者目标可能需要更高层面响应的信息，例如新政策或架构变更。


  ## 置信度


  如前所述，情报通常具有不同的关联置信度。这些置信度反映了分析师对信息正确性和准确性的信任程度。对于某些类型的数据，这种置信度可能基于数值量表（例如 0 到 100）并使用传统统计方法计算，而在其他情况下，置信度评估由分析师基于定性、主观基础直接提供。重要的是要在两个关键领域确定置信度：对信息来源的置信度，以及对分析师结论的置信度。


  描述来源可靠性的一种常见方法是 `FM 2-22.3` (`https://fas.org/irp/doddir/army/fm2-22-3.pdf`) 中的海军部代码或北约体系。这包含两个量表。第一个基于以往信息评估来源可靠性，范围从
  A（可靠）到 E（不可靠）。第二个量表评估对信息内容本身的置信程度，范围从 1（已确认）到 5（不可能）。这两个分数根据来源和具体内容针对特定信息进行组合，因此来自有效信息历史来源的已知真实信息可能被评为
  B1，但来自无效信息历史来源的不可能信息将被评为 E5。



  '
- '# 第 3 章 事件响应基础


  > “几乎所有系统都能以某种方式被攻破，这算是个公开的秘密。而这种攻击行为已然成为主流，却是个鲜少人提的秘密。”

  >

  > Dan Kaminsky


  情报只是情报驱动型事件响应拼图的一半。虽然计算机事件响应的历史远不如间谍艺术悠久，但在过去 40 年里，它已迅速发展成为一个主要产业。*事件响应*涵盖了检测入侵（无论是针对单个系统还是整个网络）、收集充分了解入侵所需的信息、制定并执行清除入侵者的计划，以及记录信息以供后续行动（如法律诉讼、监管报告或情报行动）的整个过程。


  入侵检测和事件响应有许多共同特征。两者都是抽象的。两者都是复杂的主题，因此人们试图通过将它们抽象为周期或模型来简化它们。这些模型使理解防御者与攻击者之间复杂的相互作用成为可能，并构成了规划如何应对这些事件的基础。就像情报模型一样，它们很少是完美的，并不总能被显式遵循，但它们提供了一个框架，用于理解攻击者的入侵和防御者的响应流程，并允许多个响应人员使用相同的术语和方法协同理解一次入侵。共享词汇和思维过程的结合有助于降低这些复杂事件的风险，并大大提高成功的可能性。


  就像对情报的探讨一样，本章从宏观理论入手，随后转向更具体的应用和模型。之后我们将深入探讨常见的防御技术，最后介绍本书其余部分将使用的综合情报与运营模型。


  ## 事件响应周期


  正如我们需要一种标准语言来讨论情报概念一样，我们也需要一种语言来讨论检测和响应事件。这一过程既可以从防御者的角度来看，也可以从攻击者的角度来看。让我们先从防御者开始。


  *事件响应周期*由入侵检测和事件响应中采取的主要步骤组成。该模型的目标是与攻击类型（网络钓鱼、战略性网站入侵、服务入侵等）无关，并将所有这些攻击（以及其他许多攻击）通用的步骤进行泛化。图
  3-1 展示了该周期。


  ![](img/image-to-come.png)


  关于事件响应周期概念的起源存在一些争议。最早的参考似乎来自美国国家标准与技术研究院（NIST）关于事件响应的奠基性文件——`NIST 800-61 计算机安全事件处理指南`
  ([`http://bit.ly/2tGfwUz`](http://bit.ly/2tGfwUz))。该文件现已修订至第二版，是美国政府机构处理事件的基础。尽管该指南引入了大量关键概念，但其中最重要的之一是对事件响应周期的描述，它提供了一个以防御者为中心的事件响应流程视角。该过程包含五个阶段：


  *   准备

  *   识别

  *   遏制

  *   根除

  *   恢复


  周期的每个阶段都有其特定目的，且对整个周期的成功至关重要。在开始流程之前，了解整个周期的目的以及每个阶段的细节非常重要。因此，我们将在下文深入探讨这些阶段。


  ### 准备


  从防御者的角度来看，事件的第一阶段发生在攻击开始之前：*准备阶段*。准备阶段是防御者通过强化资产、部署检测能力、创建和更新特征码、了解基线系统和网络活动来抢在攻击者前面的机会。这是网络安全架构和安全运营的结合。许多步骤超出了安全团队的范围，影响并受通用网络运营、网络架构、系统管理，甚至服务台和支持的影响。


  准备工作应重点关注五个关键要素，三个技术层面，两个非技术层面：


  **攻击面测绘**


  : 防御未知系统极其困难。在当今影子 IT、云服务提供商和快速原型开发的世界里，几乎不可能完全了解网络中的每个系统，更别提建立资产清单了。然而，如果没有这种了解，或者无法尽可能接近这种了解，防御就仍然是一场猜谜游戏。


  **遥测数据**


  : 看不见就无法发现。事件响应人员需要专用系统来识别和调查入侵。这些系统涵盖网络层到主机层，应提供在多个层面调查各种活动的能力。


  **加固**


  : 比快速识别入侵更好的唯一事情是入侵根本不发生。准备阶段是确保补丁已部署、配置已锁定、限制攻击的工具（如虚拟专用网络（`VPNs`）和防火墙）已就位的阶段。


  **流程与文档**


  : 在非技术层面，流程是可以提前准备好的第一道防线。事件发生时，最糟糕的事情莫过于在处理过程中才摸索该做什么。除了流程（如事件响应计划、通知计划和沟通计划），准备好常见问题的文档（如网络配置、系统配置和系统负责人）也能加快响应速度。


  **演练**


  :





  ## 准备


  准备工作最后允许的是练习计划的机会。这将加快未来事件的处理速度，并发现可纠正的问题（我们将在“经验教训”中更多地涉及这一点）。最优秀的事件响应团队是那些共同经历过事件的团队，而实现这一点的最佳方式就是练习。


  在讨论计算机网络防御时，许多人（大多持悲观态度）会迅速指出对手拥有的所有优势。这些优势大多归结为**突袭**：在计算机网络攻击中，对手可以选择攻击的地点和时间。许多人没有考虑到的是防御者的关键优势：即通过控制环境来为攻击做准备的能力。对手可以进行侦察，但在许多情况下，他们攻击的是一个“黑盒”，在攻击开始前并不完全了解目标。防御者可以利用这一点，通过充分准备，最大化其“主场”优势。


  ## 识别


  `Identification phase`（识别阶段）是防御者识别出对手正在影响其环境的时刻。这可以通过多种方法发生：


  - 识别对手进入网络，例如服务器攻击或传入的钓鱼邮件

  - 发现受感染主机发出的命令与控制流量

  - 看到对手开始外泄数据时巨大的流量峰值

  - 接到当地 FBI 现场办公室特工的拜访

  - 所有网络设备突然显示屏幕，宣告你已遭受勒索软件攻击。


  无论对手采取什么行动，`Identification phase`（识别阶段）都从你首次察觉到针对你资源的对手活动时开始。在该模型中，`Identification
  phase`（识别阶段）是整个入侵检测阶段，略过了一个复杂主题中的许多细节（我们稍后将深入研究专门针对该阶段的其他模型）。这显然是一种过度简�化，但考虑到该周期关注的是事件响应的总体端到端流程，而非挖掘每个阶段的细节，这是合理的。`Identification
  phase`（识别阶段）通常会引出调查，在直接开始响应之前，发现有关事件和对手的更多信息。威胁情报的关键目标之一是增强 `Identification phase`（识别阶段），提高识别对手的方法的准确性和数量，从而更早地发现对手。


  从事件响应的角度来看，`Identification`（识别）不仅仅是听说发生了一次攻击，或了解到一个新的对手。`Identification`（识别）始于对你的用户、系统或资源产生直接影响时。要成为一起事件，必须有影响。


  另一方面，如果对手具备能力、意图和机会，该对手确实构成威胁。这不是事件周期的开始，而是情报周期的开始。只有在对手在你的环境中被识别出后，事件才应开始。


  ## 遏制


  周期的前两个阶段主要可被视为被动阶段，侧重于信息收集。实际响应的第一个阶段——意味着针对特定攻击采取具体行动——是 `Containment`（遏制阶段）。`Containment`（遏制）是试图减轻对手行动的初步尝试，在短期内止损，同时为长期响应做准备。这些短期响应可能无法使攻击变得不可能，但会大幅降低对手继续实现目标的能力。这些行动应以快速但受控的方式采取，以限制对手的反应机会。


  常见的 `Containment`（遏制）选项如下：


  - 禁用特定系统连接的网络交换机端口

  - 阻止访问恶意网络基础设施，如 `IPs`（在防火墙处）和域名或特定 `URLs`（通过网络代理）

  - 临时锁定入侵者控制的用户账户

  - 禁用对手正在利用的系统服务或软件


  在许多事件响应中，防御者可能选择完全跳过 `Containment`（遏制）阶段。`Containment`（遏制）冒着在对手仍可能拥有控制权时改变环境，从而打草惊蛇的风险。直接跳到根除阶段，也可能让将
  `Containment`（遏制）单独视为权宜之计的高管们感到安心。


  ## 根除


  `Eradication`（根除阶段）由旨在将对手从环境中清除并永久防止其再次进入的长期缓解措施组成，这与 `Containment`（遏制）阶段的临时措施不同。这些行动应经过周密计划，并可能需要大量时间和资源来部署。`Eradication`（根除）行动侧重于在将对手踢出网络后，彻底消除其重新获得访问权限的能力。这不仅包括针对最初允许其获得访问权限的具体战术，还包括基于对对手目标和战术、技术与流程（TTP）的了解，对网络进行额外加固。


  常见的 `Eradication`（根除）行动如下：


  - 清除对手安装的所有恶意软件和工具（参见侧边栏“擦除重装与清除对比”）

  - 重置并修复所有受影响的用户和服务账户

  - 重新创建对手可能访问过的秘密，如共享密码、证书和令牌

  - 针对事件的用户教育和意识培训，以减少未来的社会工程学攻击

  - 修补软件漏洞并更改脆弱配置


  响应人员通常会采取 `scorched-earth`（焦土）式的 `Eradication`（根除）方法。在这些情况下，响应人员会对没有妥协指标的资源采取补救措施；例如，在对手访问了一台
  `VPN` 服务器后，重新生成所有 `VPN` 证书。`Scorched-earth`（焦土）方法能有效缓解 `unknown unknown`（未知的未知）情况，即无法
  100% 确定对手做了什么，但代价是可能需要付出巨大努力来进行这些更改。


  所需努力因所涉服务或信息的类型而异。在 `Active Directory` 管理的 `Windows` 环境中强制全面重置密码相对容易。在主流浏览器中重新生成并重新部署带有域名固定的
  `EV` `TLS` 证书则很难。事件响应团队需要与企业风险管理团队以及系统/服务所有者团队协作，以确定在这些情况下该走多远。


  例如，2015 年春，宾夕法尼亚州立大学因遭到入侵（`http://bit.ly/2u7R5Bu`），将其整个工程网络离线了三天。之后，它不得不将网络恢复上线并恢复正常服务。这样的恢复需要从系统中清除恶意软件，重置密码和证书等凭据，修补软件，以及许多其他旨在彻底将对手从网络中清除并限制其返回能力的更改。在这种情况下，缓解措施——使整个网络离线（可能是为了在补救阶段限制对手进行更改的能力）——先于补救行动。在处理持久性对手时，这是一种常见模式。一方面，它降低了对手对缓解和补救措施做出反应的能力（除非通过预先计划或自动化手段），但另一方面，它向对手发出了明确信号，表明响应正在进行，并对使用该网络的任何人造成重大负面影响。


  ## 恢复






  ## 恢复


  遏制和根除通常需要采取严厉措施。`Recovery`（恢复）是指回到非事件状态的过程。在某些方面，恢复更多是针对事件响应人员采取的行动，而非攻击本身。


  例如，如果一台受损系统被从用户手中拿走进行取证分析，恢复阶段包括将系统归还或更换给用户，以便用户恢复其业务功能。如果整个网络都受损，恢复阶段涉及撤销攻击者在整个网络中采取的任何行动，这可能是一个漫长且复杂的过程，有时甚至包括重建整个网络。云服务带来了各种利弊；一方面，它们可能难以追踪影子
  IT，另一方面，在许多情况下，这些网络是确定性的（使用配置管理工具构建），这使得重置和重建变得更容易。


  此阶段取决于前两个阶段采取的行动、攻击者的手段以及受损的资源。它通常需要与其他团队协调，例如桌面管理员和网络工程师。


  事件响应始终是一项团队运动，需要各种安全和非安全团队采取行动，但在事件的任何部分中，这一点都不像在恢复阶段那样显而易见。安全团队可能会对系统恢复的方式设定特定要求（其中大部分将在根除阶段进行），但在事件响应团队给出“一切安全”许可后，恢复工作主要由
  IT 和系统所有者处理。弄清如何协作并有效配合是关键，这通常既需要实践也需要经验（尽管良好的文档也有帮助）。没有什么比 IT 在 IR 团队彻底根除威胁之前就开始恢复更能破坏响应工作的了。


  ## 经验总结


  事件周期的最后阶段，类似于许多其他安全和情报周期，包括花时间评估过去的决策，并学习如何在未来改进。


  此阶段可以称为多种名称，如事后行动报告、热洗或回顾会。无论叫什么，**经验总结**阶段都会评估团队在事件每个步骤中的表现。基本上，这需要拿出事件报告并回答一些基本问题：


  1.  发生了什么？

  2.  我们做得好的地方是什么？

  3.  我们本可以做得更好的地方是什么？

  4.  下次我们会有什么不同做法？


  作为一项练习，这往往令人望而生畏。许多团队抵制回顾经验总结或进行事后审查。原因多种多样，从担心错误被凸显（从而归咎于 IR 团队），到仅仅因为新事件或正在进行的事件导致没有足够时间。无论原因是什么，没有什么比跳过经验总结更能阻碍事件响应团队进步的了。经验总结阶段的目标是发现如何让下一次事件响应更快、更顺畅，或者理想情况下根本不再发生。没有这一关键步骤，IR
  团队（以及与他们协作的团队）将重蹈覆辙，遭受相同的阻碍，并无法发现改进之处。


  虽然它很重要，但开展经验总结阶段不必令人畏惧；事实上，应该恰恰相反。一次良好的事后复盘不需要花费数小时，也不需要所有参与事件响应的人员都到场。以下是一些详细的入门问题，您在经验总结过程中评估每个阶段时都应该提出：


  **准备**


  *   我们本可以如何完全避免该事件？这包括网络架构变更、系统配置变更、用户培训，甚至政策变更。

  *   哪些政策或工具可以改进整个流程？


  **识别**


  *   哪些遥测来源（IDS、网络流量、DNS 等）能让识别此攻击变得更容易或更快？

  *   哪些特征码或威胁情报能提供帮助？


  **遏制**


  *   哪些遏制措施有效？

  *   哪些无效？

  *   如果其他遏制措施更容易部署，它们会有用吗？


  **根除**


  *   哪些根除步骤进展顺利？

  *   哪些本可以做得更好？


  **恢复**


  *   是什么拖慢了恢复速度？(`Hint:` 重点关注沟通，因为这是恢复中最难做好的部分之一。)

  *   对恢复的响应告诉了我们关于攻击者的哪些信息？


  **经验总结**


  *   不想过于元认知，但甚至要评估经验总结流程本身如何能更有效地进行；例如，如果响应人员在整个过程中记笔记会有帮助吗？你们等待太久导致事情丢失或被遗忘了吗？


  经验总结也可以演练（就像事件响应流程的任何其他部分一样）。不要只针对实际事件进行经验总结，还要花时间为红队演练和桌面推演建立并遵循经验总结流程。事实上，将经验总结纳入桌面推演至关重要。


  归根结底，经验总结的关键在于理解：虽然早期的经验总结会很痛苦，但它们会带来改进——这才是重点。早期的经验总结练习会暴露缺陷、缺失的技术、缺失的团队成员、糟糕的流程和错误的假设。这个过程伴随成长的烦恼很常见，但请花时间咬牙坚持下来。没有什么比几次艰难的经验总结会议能更快地提升
  IR 团队和 IR 能力。此外，记录这些经验并与领导层及相关团队分享。虽然这看起来像是在指出团队的缺陷，但在许多情况下，这些报告为做出改进事件响应能力的变更提供了具体理由。


  事件响应周期是事件响应人员学习的第一批模型之一，这是有充分理由的：它简洁地描述了调查的生命周期。它之所以成为关键，是因为花时间评估团队在每个阶段（从准备到经验总结）的执行能力。与情报工作一样，有几种模型和框架可以帮助事件响应周期。


  ## 杀伤链


  另一个进入网络威胁情报术语的军事概念是 `kill chain`（杀伤链）。事实上，它变得如此流行，以至于由于信息安全用例和营销的大量信息，很难找到关于原始杀伤链的信息。虽然这个概念在边缘徘徊了多年，但洛克希德·马丁公司的研究人员
  Eric M. Hutchins 等人发表的一篇题为[“基于对抗活动和入侵杀伤链分析的情报驱动计算机网络防御”](http://lmt.co/2miXqrZ)的论文，通过将最常见的入侵模式形式化映射为一个正式的杀伤链，将这一概念带入了信息安全主流。


  自该报告以来，杀伤链已成为网络威胁情报的首选模型，几乎被每个供应商引用，并成为防御团队的指导性流程主食。杀伤链为攻击者利用目标时所经历的阶段提供了重要的抽象，特别是涉及网络钓鱼攻击的场景。


  但什么是杀伤链？以最简单的形式来看，`kill chain` 是攻击者为实现目标必须执行的一系列步骤（参见图 3-2）。在我们的案例中，我们讨论的是计算机网络攻击者，但它适用于许多对抗性活动。这意味着对事件过程进行抽象，但事件周期关注的是*防御者*的行动，而杀伤链关注的是*攻击者*的行动。


  ![](img/image-to-come.png)






  ## 杀伤链


  杀伤链是抽象对手 TTP（战术、技术与过程）的好方法。它提供了一种结构来理解攻击的抽象动作。


  尽管杀伤链的早期阶段，特别是目标确定和侦察，有时对防御者来说是不透明的，通常难以检测且依赖具体情境，但它们值得理解。防御者倾向于认为对手每次都能零成本成功。这与事实相去甚远。事实上，我们稍后破坏这些入侵前阶段的能力，可能是防御者拥有的最强优势之一。


  ## 目标确定


  在杀伤链正式开始之前，对手必须决定攻击什么（例如，潜在目标是谁）。在许多情况下，这发生在与某种形式的发起方或利益相关者协商过程中，通常作为其自身情报或作战需求的一部分。作为防御者，我们通常将目标视为受害组织，但在许多情况下，这不如被瞄准的信息或能力重要。


  目标确定是杀伤链中一个有趣的方面，因为它关乎动机，从而揭示了对手的大类（尽管不一定是具体的身份识别或归因）。例如，想要窃取资金的对手需要去有钱的地方。了解被瞄准的内容有助于洞察对手的企图（对手的最终目标），并可能带来更好的防御技术（稍后在“主动防御”中讨论）。


  ## 侦察


  在决定*什么*和*谁*是目标后，对手开始进行侦察。在*侦察*阶段（或简称为*侦察*），对手尽可能多地收集关于计划受害者的信息。根据所寻求的数据类型（硬数据与软数据）和收集方法（被动与主动），侦察可分为多个类别。


  ### 硬数据与软数据


  正如我们在第 2 章讨论的那样，情报界有多种基于主题（SIGINT 信号情报、TECHINT 技术情报等）划分信息的方式，但对于计算机网络行动，我们可以考虑得更简单一些。


  *硬数据* 包括关于网络技术层面及其连接系统的信息。对于对手（以及调查对手的防御者）来说，这通常包括开源情报：


  *   目标网络的足迹绘制或枚举

  *   DNS 信息，如反向 DNS

  *   操作系统和应用程序版本

  *   系统配置信息

  *   安全系统信息


  *软数据* 包括网络及其系统背后的组织信息：


  *   组织架构图、公共关系和其他层级文档

  *   业务计划和目标

  *   招聘信息，这往往会泄露正在使用的技术等信息

  *   员工的职业和个人信息，用于社会工程学攻击


  ### 主动与被动收集方法


  对手可能使用不同的信息收集方法。我们可以将这些方法分为*主动*或*被动*：


  *主动方法* 需要直接与目标交互。主动硬情报收集示例是直接对系统进行端口扫描。主动软收集示例是发起社会工程学攻击以收集内部层级和联系信息。


  *被动方法* 基于在不直接与目标交互的情况下收集信息，通常通过从第三方信息服务（如 DNS 或 WHOIS）收集信息。被动硬收集可能利用公共服务的域信息。软被动收集从
  LinkedIn 等网站收集组织信息，人们在那里经常分享大量信息（甚至包括不该分享的信息）。


  防御者检测这种侦察活动的能力差异巨大。例如，主动方法比被动方法更容易检测，大多数网络防御者对硬信息的控制比软信息更多。以端口扫描形式检测主动硬收集，比以阅读描述组织使用特定技术的职位发布形式检测软被动收集要容易。在某些情况下，对手可以通过公共服务代理或反弹其侦察活动，其中一些服务应用用户请求执行主动方法，如网络扫描或
  DNS 询问。这种匿名性或隐藏在噪音中的优势，对防御者和对手都有利，因为许多此类工具双方都在使用。


  ## 武器化


  如果所有安全控件，或一般所有软件，都能按预期工作（即按设计者设想的方式工作，而非构建出来的样子），那么对手几乎总会失败。因此，对手的目标是找到意图与实现不匹配的地方——漏洞。然后必须可靠地利用该漏洞，并将其打包成可交付给目标的形式（例如恶意文档或漏洞利用工具包）。寻找漏洞、制作漏洞利用代码并将其与载荷结合的过程称为*武器化*。


  ### 漏洞挖掘


  鉴于武器化的漏洞子阶段对可攻击目标的影响，它尤为有趣。这迫使对手做出决定。某些广泛部署的软件几乎存在于任何环境中，例如 Adobe Acrobat 和 Reader
  或 Microsoft Windows 和 Office。这意味着针对它们的漏洞利用具有广泛的适用性。然而，这些软件已遭受多年攻击，其相关公司已投入大量精力识别和缓解漏洞。另一种选择是攻击更冷门的软件，这类软件可能防护较弱，但部署也不广泛。这限制了对手的使用范围。这一过程可与网络杀伤链的*侦察*阶段联系起来。对手愿意投入的精力也可能受其自身指令和情报需求影响。


  作为这种权衡的一个例子，考虑“震网”事件，未经证实的对手使伊朗纳坦兹核设施内的离心机瘫痪。其中部分内容包括针对西门子设备中可编程逻辑控制器（PLC）部署漏洞利用。虽然这种设备在大多数组织中并不广泛部署，但它存在于目标环境中。这些
  PLC 中的漏洞因此为对手执行任务提供了载体。


  作为防御者，我们通过使用以开发为中心的安全方法不断破坏这一过程。良好的开发实践，如 [Microsoft 安全开发生命周期](https://www.microsoft.com/en-us/sdl/)，可减少成为漏洞的不匹配的引入。应用安全团队和相关审查不断在源代码中搜寻这些漏洞。强大的补丁管理有助于消除环境中的旧漏洞。


  每修补一个漏洞，就能在一定程度上限制对手，迫使他们寻找新的漏洞利用。这是一个耗时且昂贵的过程。漏洞在野外存在的时间越长，因其更长的有效生命周期，对对手的价值就越大。反过来，破坏漏洞的投资回报率（ROI）就能带来防御价值。


  想象一下，对手拥有一个 Windows 95 的提权漏洞。对手使用了多年，直到 Windows 7 才最终修复。这意味着对手可以跨多个版本使用该漏洞利用多年。持续时间越长，对手从漏洞挖掘和漏洞利用创建工作中获得的投资回报率就越高。





  同样的对手后来发现了一个 Internet Explorer 11 代码执行漏洞，并将其用于一系列攻击中。然而，三个月后，防御者发现并修补了该漏洞。对手从该漏洞中获取投资回报（ROI）的时间更少，这迫使他重返起点，寻找一个新的漏洞。这需要为一个更小的有效时间窗口分配额外的资源。


  ## 可利用性


  漏洞只是盔甲上的裂缝。需要实际的利用代码来利用该裂缝。可利用性过程旨在寻找一种触发漏洞的方法，并将其转化为对程序执行的实际控制。就像漏洞挖掘一样，这一阶段可能有其自己的专家，或者与其他利用阶段结合发生。这是一个独立的主题，Jon
  Erickson 所著的《[黑客攻防技术宝典：渗透测试实战指南](https://www.nostarch.com/hacking2.htm)》（No Starch
  Press, 2008）对此有很好的阐述。


  在利用代码编写完成后，对手必须使其可靠。这可能很复杂，因为利用代码并不总是有效，鉴于语言包和特定防御措施的存在，例如微软的增强缓解体验工具包（EMET）或 Linux
  的地址空间布局随机化（ASLR）。此外，导致目标代码或系统崩溃的利用代码会引起注意。


  然而，利用代码只是打开了大门，给了对手一种访问目标（或至少是中间目标）的方法。对于下一步，对手将需要一个植入程序。


  ## 植入程序开发


  通常，利用代码的目标包括传递某种有效载荷，以便对手随后用于推进其目标（如数据窃取）。植入程序将允许对手持续访问被利用的系统，而无需持续利用该设备，因为持续利用可能很嘈杂，而且如果系统被修补，将完全消除利用的可能性。因此，植入程序开发遵循许多与传统软件开发相同的流程，但重点在于隐蔽性（以避免检测）和能力（以允许对手实现其目标）。因此，如果对手想要监听受感染系统范围内的对话，植入程序需要具备激活麦克风、录制所听到的内容并传输生成的音频文件的能力，且不触发用户或任何正在运行的安全软件的怀疑。


  植入程序主要有两种类型。第一种是信标植入程序，它会呼叫命令与控制（C2）服务器并接收在目标系统上执行的命令。第二种是不发送信标的植入程序，它等待接收命令，然后开始与命令与控制服务器通信。植入程序开发通常由网络拓扑和设备类型决定。有时可以使用先前开发的植入程序，但在其他情况下，对手将需要专门为目标网络开发新的植入程序。


  尽管许多计算机网络行动仍严重依赖对手保持持久性并通过植入程序安装能力，但越来越多的行为体寻求在不安装任何植入程序的情况下实现其目标。希拉里·克林顿竞选主席 John
  Podesta 邮箱的泄露就是在从未部署植入程序的情况下进行的，仅通过窃取他的密码。在许多方面，这种攻击风格对调查人员来说更难，因为没有植入程序，就少了一个需要分析的工件。无植入攻击是另一个案例，了解对手的目标将有助于将其技术置于具体情境中。


  ## 测试


  利用代码和植入程序随后都会作为武器化阶段的一部分进行广泛测试。就像软件开发一样，测试可能只是简单的抽查，也可能意味着由单独的质量保证团队进行广泛测试。对于恶意代码，测试阶段侧重于两个方面：*功能性*
  和 *可检测性*。


  功能性方面与任何其他软件开发项目非常相似；测试团队需要确保软件执行其设计功能。如果目的是窃取文件，植入程序必须能够从目标主机的文件系统读取；找到正确的文件组；通常将它们打包、加密和压缩；然后将其窃取到对手控制的系统中。这看似容易，但存在各种各样的变量，开发团队可能并不总能控制，因此需要对其进行测试。


  可检测性方面不同于正常软件开发中见到的任何内容。测试团队将尝试验证其软件无法被目标环境中可能遇到的安全工具（如防病毒软件或其他端点软件）检测到。这直接关系到功能性方面，因为许多基于启发式的安全系统会寻找恶意代码为实现其目标所需的特定行为，例如设置注册表键以维持持久性。这些可检测性要求可能基于假设，或者对于特别难攻克的目标，基于侦察阶段收集的信息。


  ## 基础设施开发


  虽然基础设施开发不严格属于武器化阶段，但它是对手在攻击前需要完成的另一个关键准备任务。大多数攻击依赖基础设施来支持部署在受害者机器上的恶意代码。需要命令与控制服务器来指导攻击行动。需要窃取点来上传并随后检索被盗数据。需要跳板点，以便对手在其他基础设施被攻陷时通过它们进行跳转以隐藏其真实位置。对手需要各种各样的基础设施来执行其行动的各个阶段：


  ### 证书


  首先，区分入侵中使用的两种最常见证书类型很重要。


  *   **代码签名证书**，由 Apple 和 Microsoft 等操作系统构建者提供，是在不绕过安全控制的情况下运行新应用程序所必需的。没有代码签名证书，用户通常需要经过多个步骤才能执行未签名的程序。这些证书很难获取，尤其是通过欺诈手段（公司努力工作使这种情况难以发生）。

  *   **传输层安全（TLS）证书** 加密与网站的通信，保持网络流量私密。没有这些证书，大多数浏览器会抛出错误，警告用户其通信不安全。更糟糕的是证书与域名不匹配，这会抛出更严重的错误。这些证书过去很难获取，但得益于
  Let''s Encrypt 等服务，最近变得容易得多。


  对手希望同时拥有代码签名和 TLS 证书，用于现代攻击以避免这些浏览器和操作系统级别的保护。一些对手则试图诱导用户绕过安全控制，但这有风险，既因为用户更有可能不予理会，也因为用户更有可能意识到似乎有什么不对劲（并希望将其报告给他们勇敢的安全团队）。


  ### 服务器


  像大多数基于互联网的活动一样，大多数对手在其攻击的一个或多个阶段依赖服务器。这包括投递阶段，要么托管下载文件（用于网络钓鱼邮件中的链接），要么托管浏览器漏洞利用代码。在后期阶段，服务器可用于命令与控制通信，或作为上传被盗文件或凭证的目标。这些可能是对手自有和运营的（裸金属），但像许多组织一样，许多对手已转向使用云服务器，甚至直接使用公共
  Web 服务。这两者的优势都是融入其中。





  ## 域名


  极少数网络连接直接指向 IP 地址，因此大多数攻击者使用域名。某些域名被选作特定的诱饵或用于迷惑分析师，旨在模仿或看起来与其他可识别的域名相似（例如使用同形异义攻击，如用小写字母
  l 代替大写字母 I）。


  ## 电子邮件地址


  网络钓鱼是攻击者利用电子邮件的首要且最明显的方式。这些电子邮件地址通常构建为一次性或限时使用，并且像域名一样可能模仿相关域名甚至特定人物。电子邮件地址也是建立其他基础设施、嵌入证书，甚至关联加密货币等支付收发方式所必需的。


  ## 投递


  一旦攻击者收集了足够的信息来构建攻击，杀伤链的下一阶段就是投递。常见的投递场景包括但不限于以下内容：


  ### 定向钓鱼


  攻击者通过直接通信（通常是电子邮件）向特定目标发送武器化的漏洞利用代码，形式为附件或链接。该通信通常经过精心设计，使其看起来合法，从而降低目标用户的戒备心理。近年来，攻击者还利用即时通讯平台和短信向用户发送包含恶意链接的通信。


  ### 服务漏洞利用


  2000 年代初常见的一类直接利用面向 Web 的服务的攻击向量再次抬头。在这些情况下，攻击者发现面向 Web 的服务（如 Web 应用程序或虚拟专用网络）中的漏洞，并直接发起攻击。在许多情况下，这些是通用系统（例如中国关联攻击者入侵
  Pulse VPN - <https://www.mandiant.com/resources/suspected-apt-actors-leverage-bypass-techniques-pulse-secure-zero-day>）。虽然其中一些攻击高度定向，但像
  Shellshock 和 Log4J 这样的漏洞已被广泛利用。


  ### 战略性网站入侵（水坑攻击）


  在一种两阶段攻击中，通常基于之前的服务漏洞利用场景，攻击者首先入侵一个次级资源（通常是预期目标可能会使用的网站），并在其上植入浏览器或媒体漏洞利用代码。其假设是目标（通常针对整个群体而非特定个人）会访问该网站，从而被攻陷。


  投递的关键在于其简单性：仅仅是将有效载荷传递给受害者。这种简单性掩盖了该阶段的重要性。投递是攻击者对受害者采取的第一个必然的主动阶段。虽然之前的阶段（在目标选择和侦察的情况下）可以是主动的，但投递是攻击者*必须*主动的第一种情况，这往往会导致受害者（无论是预期目标还是安全团队）能够检测到的痕迹。这意味着投递是受害者保证拥有妥指标和攻击者战术、技术与流程以供分析的第一种情况。在定向钓鱼的情况下，这可能是邮件头和电子邮件地址等邮件工件，而对于
  SQL 注入，这可能是发起 Web 服务器/数据库连接的 IP 地址。


  ## 漏洞利用


  理解投递和漏洞利用之间的区别可能具有挑战性。在投递开始之前，攻击者未与目标有过直接交互，也不控制目标系统。即使在定向钓鱼邮件的情况下，安全措施也可能阻止成功投递，因此即使发生了投递，也未发生实际的漏洞利用。漏洞利用是攻击者获得代码执行控制权并开始执行其自身代码的时刻。


  在水坑攻击中，这发生在受害者访问受感染页面的那一刻。对于定向钓鱼攻击，这是受害者点击恶意附件或链接的时刻。从这一点开始，攻击者控制了目标系统上至少一个进程。这个立足点是攻击者横向移动进入网络的起点。


  漏洞利用本身就是一个庞大的主题，以至于拥有自己的专家（甚至拥有自己的公司、市场和经济体系）。如需深入了解，请参阅：


  - [The Shellcoder''s Handbook - 2+ Edition](https://www.goodreads.com/book/show/1174511.The_Shellcoder_s_Handbook?ac=1&from_search=true&qid=bOCHnNGKPA&rank=1)
  by Jack Koziol, Chris Anley, and John Heasman

  - [The Ida Pro Book](https://www.goodreads.com/book/show/3004460-the-ida-pro-book?from_search=true&from_srp=true&qid=SrY3kR5hSP&rank=1)
  by Chris Eagle

  - [Real World Bug Hunting](https://www.goodreads.com/book/show/35545851-real-world-bug-hunting?from_search=true&from_srp=true&qid=DF9uclWR3D&rank=1)
  by Peter Yaworski

  - [A Guide to Kernel Exploitation](https://www.goodreads.com/book/show/9224826-a-guide-to-kernel-exploitation?from_search=true&from_srp=true&qid=LMXQzQLd7c&rank=1)
  by Enrico Perla and Massimiliano Oldani


  ## 安装


  获得初始执行通常很困难，也不是攻击者愿意重复多次的事情。一旦攻击者获得代码执行权限，他们的第一步通常是通过创建永久立足点来巩固访问权限。洛克希德·马丁杀伤链论文对此描述如下：“在受害者系统上安装远程访问木马或后门，允许攻击者在环境中保持持久性。”虽然这是攻击者在此阶段通常所做的，但我们发现将这些行为视为建立系统或网络持久性很有用（在许多情况下，攻击者两者都会做，但分别考虑它们仍然有帮助）。


  ### 系统持久性


  此时，攻击者在单个系统上获得了代码执行权限，且可能仅限于单个进程。这是一个有用的开端，但无法在重启后持久存在。受损应用程序的关闭甚至可能移除他们的访问权限。


  大多数攻击者首先通过部署 Rootkit 或远程访问木马（RAT）风格的植入程序，来巩固他们对少量主机的控制。Rootkit 建立对系统的内核级访问，一旦安装，允许攻击者规避底层操作系统的许多检测方法。RAT
  是一种远程控制软件，旨在持久化以度过重启，且不依赖特定漏洞。这使攻击者能够在单个主机上持久化。


  ### 网络持久性


  绝大多数攻击者不满足于建立单系统立足点。相反，他们想要建立更深层的持久性。为此，他们通常会建立更广泛的足迹，使用以下两种技术中的一种（或两者兼用）：


  #### 在多个系统上建立系统持久性


  这意味着使用窃取的凭证，在其他系统上安装 RAT 或类似的访问方法。攻击者有多种选择，从定制软件到原生工具，如 Windows 中的 `PsExec` 或 \*nix
  环境中的 `SSH`。


  #### 收集凭证以实现广泛的网络资源访问


  这通常意味着 VPN、云服务或其他面向互联网的系统，如 Web 邮箱。这在许多情况下降低了被检测的风险，且不需要恶意软件形式，而是使用原生工具。


  这些技术可以单独使用，也可以组合使用。这种技术组合通常是大多数攻击者的标志性技术集。


  ## 命令与控制





  ## 命令与控制 (C2) 通信


  一旦攻击者建立了持久化，特别是如果他们选择了 RAT 路线，他们就需要一种传递命令的方法（无论是推送还是拉取）。命令与控制 (C2) 通信通过多种方法进行，并可利用不同的端口、协议和服务。攻击者在建立
  C2 进程方面以极具创造力著称。一个著名的例子是 Turla，该组织以在命令与控制通道上进行创新而闻名。在一次事件中，他们使用了一种植入程序，通过流行歌手布兰妮·斯皮尔斯
  Instagram 评论中的编码命令进行通信。过去，许多恶意软件，特别是分布式拒绝服务 (DDoS) 工具，通过加入 IRC 频道或向攻击者控制的服务器发起 HTTP
  调用进行通信。[注释组](http://symc.ly/2tHeLKX) 这个绰号源于他们利用看似无害的网页上的 HTML 注释进行命令与控制。一些攻击者使用多种方法，包括
  DNS 查询、社交媒体或流行的云应用程序。


  攻击者专注于确保其通信通道不被发现，并提供足够的带宽以满足攻击者的需求。在某些情况下，恶意软件可能每天仅使用几行文本进行通信，而其他恶意软件则包含完整的虚拟桌面功能。


  ## 目标行动


  在大多数情况下，所有这些并非最终目标，而只是铺垫。攻击者经历建立访问权限的过程，以赋予自己以一种以前没有的方式影响目标的能力。我们称这种新能力为*目标行动*。


  虽然最早的许多目标行动仅限于探索，但自 1990 年代中期以来，最常见的目标行动一直是收集并窃取目标系统上的信息。从某种简单的角度来看，这很合理：计算机归根结底是用于处理信息的。据传臭名昭著的银行劫匪威利·萨顿曾被问及为何抢劫银行。萨顿回答：“因为钱在那里。”在现代社会，金钱即数据（作为账本或区块链中的
  0 和 1），下一代军事技术的计划存储在企业服务器的计算机辅助设计和开发文件中，政治情报存储为 PDF 或 Excel 电子表格，数据窃取成为主要的目标行动，这有什么好奇怪的吗？


  除了数据窃取，最常见的目标行动，且与安装阶段的网络持久化相辅相成的，是跳板攻击。在许多情况下，攻击者真正追求的目标无法直接攻击。人们不应该从存放其最宝贵计划的
  FTP 服务器打开钓鱼邮件（不幸的是他们经常这么做），也不应该从存放所有客户数据的系统浏览可疑网站（他们也这么做），但在遵循这些做法的情况下，攻击者通常会攻击可能促进进一步访问的相关系统，以达到最终目标。在许多情况下，攻击者甚至不知道他们最终针对的是哪个系统，而是攻击任何可用的系统，建立持久化，并进行跳板攻击；本质上是重新开始整个入侵过程（杀伤链中的杀伤链）。一种常见的入侵模式是：初始系统相当无害且无关紧要（例如攻击者针对可能启用了
  Microsoft Office 宏的招聘人员或会计师），通过破解安全账户管理器 (SAM) 文件获取管理员凭证，跳板攻击到域控制器，再次窃取 SAM 文件。现在攻击者拥有了全网范围的管理员凭证，可以直接追踪其最终目标。


  除了信息窃取和跳板攻击，攻击者对目标（不仅限于计算机）最常见的行动被美国空军归类如下（我们稍后将详细讨论这些内容，涉及防御者可以采取哪些措施来应对攻击者）：


  ### 销毁


  攻击者销毁物理或虚拟项目。这可能意味着销毁数据、覆盖或删除文件，或以其他方式使系统不可用，直到完全重建。这也可能意味着销毁物理对象，尽管这在计算机攻击中很少见，例如震网病毒摧毁伊朗离心机。^(1)


  ### 拒绝


  攻击者拒绝目标使用资源（如基础设施或特定能力），例如拒绝服务攻击不允许访问站点。近年来受到关注的另一个例子是勒索软件，它加密用户数据，并要求付款后攻击者才会（理论上）解密数据以供再次使用。


  ### 降级


  攻击者降低目标基础设施或能力的效用。这通常指目标控制和指挥基础设施的能力，例如禁用网络服务。一个稍微不那么细微的版本，具有简单的杀伤链，是分布式拒绝服务。


  ### 破坏


  通过中断信息流，攻击者可以破坏目标执行正常操作的能力。


  ### 欺骗


  攻击者试图让目标相信虚假信息。在这种情况下，攻击者可能会将虚假信息插入工作流以重定向资产或信息，或导致目标采取有利于攻击者的行动。


  这些大多表面上看起来简单直接。然而，攻击者将这些组合在一起的方式至关重要，往往直接反映了攻击者的身份和目标。攻击者通常可以隐藏恶意软件、混淆命令与控制等；但最终，目标行动无法被混淆、编码或保护。要窃取信息，攻击者必须窃取文件。要执行
  DoS 攻击，攻击者必须利用受感染的主机发送大量网络流量。简而言之，目标行动阶段无法伪造。


  同样重要的是要理解，攻击者可能会结合多种行动和载体，包括物理/非网络行动。这可能包括从招募内部人员泄露战略信息到*动能行动*（例如轰炸地理位置）的任何事情。


  正如您在图 3-3 中所见，攻击者的杀伤链保持严格定义，而事件响应周期必须对其做出反应，这始于识别阶段。识别可能发生在杀伤链的识别阶段和目标行动阶段之间的任何位置，并导致截然不同的事件响应。在投递阶段识别到的事件是理想的。防御者可以在电子邮件或
  Web 代理处阻止攻击，防止攻击执行。在后期阶段（如命令与控制或目标行动）检测到的攻击可能会很痛苦，涉及许多受感染资源，并需要昂贵且漫长的事件响应调查。


  ![](img/image-to-come.png)


  ## 杀伤链示例


  为了说明杀伤链，想象一个代号为“灰刺”的虚构攻击组织发起的一系列攻击。该组织对多个国家进行政治情报收集。最近的报告表明，他们一直在针对美国和英国的竞选活动。他们寻求获取候选人在经济、外交政策和军事问题上的立场信息。以下是他们的策略所包含的内容：


  ### 目标定向


  “灰刺”不自行选择目标，而是从国家决策者那里接收任务（情报术语，指他们被指示针对的数据和组织）。该任务描述了具体的目标国家和候选人以及感兴趣的关键词。


  ### 侦察




  Grey Spike 通过了解其目标的网络足迹（包括域名、邮件服务器、关键技术、Web 和移动应用程序）开始行动。该组织还收集关键人员的信息，例如竞选管理人员、社交媒体经理以及竞选团队聘请的技术咨询公司。


  ## 武器化


  Grey Spike 获得季度资源分配，其中包括零日漏洞，但通常倾向于在没有其他攻击向量可用时才使用这些漏洞。在本案例中，该行动者拥有一套下载宏，将其作为植入有效载荷植入文档中，这些文档由其情报机构内其他部门借调的区域和文化专家用目标语言专门撰写。此外，用于
  C2 和投递的基础设施（即专用服务器）以空壳公司的名义从全球各地的提供商处租用。


  ## 投递


  操作人员将武器化的文档发送给竞选团队中的关键管理人员。每份文档都专门针对该管理人员撰写，内容包括提供资金资助和背书。由于竞选活动节奏快，目标以很高的成功率打开这些文档，从而允许攻击者的植入程序在其笔记本电脑上运行。


  ## 利用


  植入代码以文档宏的形式运行，该宏运行一个针对竞选团队使用的 PDF 阅读器的旧版漏洞利用。尽管该漏洞的补丁已可用一段时间，但竞选工作人员冻结了所有更新，因为高级工作人员认为这可能会在不合适的时间导致中断。


  ## 投递


  漏洞利用代码是一个下载器，随后联系位于知名 ISP 共享托管环境中的恶意软件投递服务器，在目标系统上安装远程访问木马 (RAT)。随后，RAT 联系位于第三国家防弹
  ISP 的 C2 服务器。


  ## 命令与控制


  Grey Spike 通过 C2 信道向 RAT 发送命令，在本例中通过编码的 DNS 查询进行。利用其隐蔽信道，他们搜索目标的电子邮件和相关文档。除了获取部分受命获取的信息外，他们还发现了记录共享账户的电子邮件，其中包括密码，随后可利用这些密码在整个网络中扩大访问权限。


  ## 目标行动


  在本场景中，Grey Spike 的具体任务仅限于信息检索。决策者不希望直接干预竞选活动，主要是出于对政治后果的担忧，尽管他们有技术能力摧毁大多数候选人的数据和在线基础设施。


  攻击链有助于以一种方式组织事件响应数据，使您能够直观地了解攻击发生时的样子，并有助于识别活动中的模式。实现这一点的另一种方法是钻石模型，我们将在接下来讨论。


  ## 钻石模型


  用于入侵分析的钻石模型（图 3-4）在许多方面不同于攻击链，尽管稍后在本节中我们将讨论它们如何相互补充。该模型最初由 Christopher Betz、Sergio
  Caltagirone 和 Andrew Pendergast 在一篇开创性的论文中讨论，他们总结该模型如下：“一个*对手*通过某些*基础设施*针对一个*受害者*部署一种*能力*。这些活动被称为*事件*……事件按对手-受害者对进行阶段排序，形成*活动线程*，代表对手行动的流向。”归根结底，它是一种理解各方行动者（对手和受害者）以及对手工具（基础设施和能力）之间相互作用的范式。


  ![](img/image-to-come.png)


  钻石模型是分析和理解入侵的一个极其强大的工具，值得花时间了解如何在入侵分析中使用和扩展该模型。


  ## 钻石模型基础


  一个***对手***是一个有意图收集信息或危害信息系统的智能方（行动者）。我们可以进一步将其分解为执行行动的*操作员*和从行动中受益的*客户*。同一个人可能同时扮演这两个角色（如在小型雇佣兵或经济动机的对手团体中），但并非总是如此（例如在国家信号情报机构中，客户和操作员可能来自不同的机构，更不用说不同的团队了）。对手将有一个意图，这可能像“通过信用卡欺诈赚钱”一样笼统，也可能像“获取特定人员关于特定感兴趣主题的通信”一样具体。


  对手拥有一组可部署以实现其目标的漏洞利用和技术，称为***能力***。这包括攻击链中讨论的武器化软件和植入程序，但也可能包括实施社会工程攻击的能力，或在某些情况下部署某种物理能力，无论是用于收集信息还是破坏系统。


  对手使用一组通信系统和协议，称为***基础设施***，来投递或控制能力，或在受害者身上造成某种结果。这包括对手直接拥有的系统（例如，其物理占有的台式机和网络设备）以及被攻陷并重新利用的系统（例如，僵尸网络中的终端用户系统）。


  对手以一个***受害者***为目标，针对其部署能力以试图实现特定意图。受害者包括人员和资产，两者均可被单独针对。并且如前所述，受害者系统随后可能被用作针对另一个受害者的基础设施。


  所有四个要素同时存在的每一次发生（对手跨基础设施针对受害者使用能力）代表单个事件。相互关联的事件随后被分析为*活动线程*，我们可以进一步将这些线程收集为*活动组*（可能并行运行或不一定线性流动的相关线程）。


  ## 扩展模型


  模型开始展现其威力的方式之一，来自于观察钻石对角线上的轴线。连接对手和受害者的“南北”轴代表一种社会政治关系。对手对受害者有某种兴趣，无论是作为一类（信用卡号）还是具体目标（为实施欺诈性电汇而成为定向钓鱼目标的
  CEO）。对该轴的分析可以揭示对手的动机，并可能有助于归因，或协助入侵检测和事件响应的作战及战略规划。


  正如本节开头所述，钻石模型补充了攻击链，事实上两者结合得很好。钻石模型中的每个事件都可以根据其在攻击链中的阶段进行分类。这使分析师能够更深入地理解事件之间的关系，并考虑调查和记录以前可能忽略的阶段。（也就是说，并非攻击链的每个阶段都会出现在每个事件中。）


  该模型还被扩展为一种聚类机制，分析师尝试将多个攻击链进行比较以寻找相似性，并将它们归类为战役和行动者（我们稍后将讨论这一点。




  用于入侵分析的`Diamond Model`（钻石模型）是一种广泛使用的可靠方法，用于分析对手活动；然而，它将捕获不同信息的格式和方法留给了模型的使用者。近年来，出现了用于标准化和捕获对手战术及基础设施使用信息的方法。其中两个框架，`ATT&CK`和`D3FEND`，基本上已成为行业标准。无论是与`Diamond
  Model`结合使用还是独立使用，这些框架在入侵分析过程中都非常有用。


  ## ATT&CK 与 D3FEND


  `MITRE Corporation`（米特公司，通常简称为`MITRE`）是一家美国联邦资助的研究与开发中心，发布了多种有用的网络安全框架，可独立使用或与其他模型结合使用。这两个模型的关注点不同：一个侧重于帮助理解和分类对手行为，另一个侧重于防御方可使用的对抗措施。这两个框架都值得深入探索；不过，这里我们简要概述这些方法如何增强`IDIR`过程中有用的其他模型。


  ## ATT&CK


  `Kill Chain`（杀伤链）和用于入侵分析的`Diamond Model`是你可能会频繁使用的两个模型示例，无论是显式使用还是作为思维模型。分析师工具箱中另一个较新的成员是`MITRE
  ATT&CK Framework`，它增强并扩展了传统的杀伤链。`ATT&CK`代表“Adversary Tactics, Techniques, and Common
  Knowledge”（对手战术、技术与通用知识）（是的，如果你在疑惑，那个“&”符号只是为了读音方便）。`ATT&CK`是一个基于真实观察的对手战术和技术知识库。它被组织成涵盖各种平台的矩阵（例如企业、移动、ICS）。该框架帮助分析师理解对手*在做什么*以及*为什么这么做*，超越简单的妥协指标（IOC），转向行为分析。


  ## D3FEND


  `D3FEND`是`ATT&CK`的互补框架，由`MITRE`在`National Security Agency`（NSA，国家安全局）的赞助下开发。`ATT&CK`侧重于进攻（对手做什么），而`D3FEND`侧重于防御（防御者能做什么）。它提供了一个防御对抗措施知识库。`D3FEND`将对抗措施组织为战术（战略目标）和技术（具体的技术实现）。`D3FEND`的目标是将特定的防御技术映射到`ATT&CK`中发现的特定进攻技术。结合使用这两个模型，*应该*可以从特定的攻击者（例如`G0032
  - Lazarus Group`）一路推导到你应该采取的具体系统加固步骤以阻止他们，以及发现他们所需的检测类型。


  这行得通吗？目前下结论可能还为时过早。`ATT&CK`在最初几年发展缓慢，所以`D3FEND`有可能会加速发展。这正好引出了我们的下一个话题。


  ## 主动防御


  关于情报驱动的事件响应周期，最受热议却又最不被理解的概念之一就是主动防御的理念。


  主动防御经常被等同于“*反向入侵*”的想法，即直接攻击恶意行为者。虽然这符合主动防御的一个方面，但其他五个有用的主动防御要素要常见得多。这种混淆源于对主动防御目的的根本误解。


  大多数尝试或请求某种形式反向入侵的人，脑子里想的是一种幼稚的、校园霸凌式的报复。这很自然。你被打了；你想打回去。我们之所以摒弃这些幼稚战术，是有原因的。首先，在网络入侵中，我们往往难以知晓对手的身份，导致归因错误，从而发动错误的攻击。很难确定某个技术资产是对手的财产，还是他们从供应商处购买的服务（没错，对手和你的
  DevOps 团队一样爱用云）、对手利用的免费服务，甚至是被盗资产（意味着攻击可能不仅针对对手，还可能针对无辜的合法所有者）。其次，对于以防御为导向的组织来说，相称性回应很难做到。第三，除了报复和惩罚的快感外，这通常服务于有限的目的。第四，视对手而定，反向入侵可能导致他们对反向入侵进行报复。最后，也是或许最重要的，在大多数国家，未经许可或没有执法和军事组织拥有的适当法律授权（理论上受严格监督）而试图入侵计算机系统是非法的。简而言之，你大概率做不了。


  ### 注


  旁注：你可能会坐在那里说“但那些拥有权限和情报进行反向入侵的人怎么办？好吧，事实证明这开始发生了。2021 年底，`Cyber Command`（网络司令部）负责人兼`National
  Security Agency`（国家安全局）局长 Paul Nakasone 上将在接受`New York Times`（纽约时报）采访时^(2)承认，“我们已经采取了行动，并让勒索软件操作者付出了代价”。从长远来看这有多有效，还有待观察。




  ## 主动防御与 D5 模型


  然而，除了“反向入侵”，主动防御还包含其他几个有效且有用的要素。Wendi Rafferty 在 2015 年 SANS DFIR 峰会上将主动防御的目标描述为试图打乱对手的节奏。Mandiant
  的 Andrew Thompson 使用了与 Nakasone 将军相同的措辞，将其描述为“施加成本”。就像侦探一样，事件响应人员的目标是抓住对手的失误，从而获得暴露他们的机会。主动防御为防御者提供了一种手段，通过迫使对手犯错来加速这一过程，通常是在对手应对事件响应团队设置的路障时。


  正如之前针对对手所讨论的，防御者拥有拒绝、破坏、降级、欺骗和摧毁的选项（因此我们称此模型为防御的 `D5 模型`）。该模型最初是作为 `计算机网络攻击 (CNA)`
  所期望的一系列能力而开发的，结果证明相同的 `D5 模型` 为主动防御提供了一份极佳的能力清单。


  ## 拒绝


  拒绝对手这一想法非常直接且常见，以至于大多数组织甚至不会想象这是一种主动防御类型，大多数组织都在定期主动实施拒绝式行动。不过，如果我们遵循打乱对手节奏这一传统定义，这便是一个完美的例子。拒绝可以很简单，例如实施一条新的防火墙规则以阻断对手的命令与控制、为漏洞应用系统补丁，或关闭被攻陷电子邮件账户的访问权限。拒绝的关键在于*预先将某种能力或基础设施从恶意行为者那里排除在外*。


  拒绝迫使对手偏离其计划，并寻找不同的方式来达成目标。如果对手在继续行动前没有更改每一个单一的入侵指标 (`IOC`)，你就能迫使他们暴露 `TTPs`（战术、技术与过程），并将调查重心转向他们的新活动。此外，许多拒绝行动可能被解读为单纯的巧合，例如用户因密码过期要求而重置密码，而非遵循事件响应团队的指令。


  ## 破坏


  如果拒绝行动是预先将某种能力或基础设施从恶意行为者那里排除在外，那么破坏则是*主动将某种资源从恶意行为者那里排除在外*。在大多数情况下，破坏需要对对手进行主动观察，以了解其何时活跃，从而能够实时实施破坏。这可能意味着在命令与控制信道被使用时将其切断，或中断大型归档文件的数据窃取过程。


  ## 降级


  降级与破坏和拒绝对手密切相关，其重点在于*在对手主动使用资源时对其进行边际削减*。一个容易理解的例子是在数据窃取期间限制对手的带宽，导致大文件在极长的时间内缓慢上传。这种访问降级试图让对手感到沮丧，希望促使他们尝试以不同方式访问数据，从而暴露额外的基础设施、工具或
  `TTPs`。


  破坏和降级为网络防御团队带来了有趣但危险的机会。虽然拒绝行动可能被解释为巧合或正常的被动防御操作，但破坏和降级显然是主动的。它们开始与对手建立一种“对话”，向对手表明防御者正在刻意响应。处于这种情况中的对手可能会采取各种行动。他们可能会通过投入高级能力来加快攻击节奏和严重程度，也可能走向另一个极端，完全停止行动，等待风头过去。这就是这类主动防御的风险，实施时需要谨慎和准备。


  ## 欺骗


  欺骗无疑是可用技术中最先进的，该主动防御行动基于反情报概念，即*故意向对手提供虚假信息*，希望他们将其视为真实并据此做出决策。这范围从植入包含错误值的虚假文档，到托管蜜罐系统甚至整个网络。


  欺骗行动需要深入了解对手的目标、方法甚至心理，以及自身的资源。制造对手愿意接受为真实的欺骗材料极其困难，因为熟练的对手会尝试用其他来源佐证他们发现的任何材料。话虽如此，欺骗技术已引起供应商关注，他们销售的工具从简单的蜜罐或诱饵（被动欺骗方法），一直到模拟整个网络并监控对手横向移动的高级欺骗套件（主动欺骗）。


  ## 摧毁


  摧毁行动会对对手的工具、基础设施或操作人员造成实际伤害，无论是物理上的还是虚拟的。在大多数情况下，这属于执法、情报或军事操作人员的职权范围（在美国，这些是 `Title
  10` 和 `Title 50` 组织），他们拥有实施此类行为的法律授权。商业或私人组织实施此类行为不仅普遍被认为是非法的，而且很危险。他们不太可能拥有工具、方法论和操作人员来开展成功的
  `计算机网络攻击`，且可能产生严重的意外后果。这些资源最好分配给改进防御行动。


  主动防御适合你吗？主动防御是个热门话题，但组织应该将其纳入安全计划吗？正如几乎所有关于复杂主题的简单问题一样，答案是“视情况而定”。主动防御不必完全实施。拒绝对手属于任何组织都能做到的范畴，事实上大多数组织可能已经在做了，无论他们知不知道。破坏和降级需要成熟度。欺骗是一项高回报但也高风险的先进战术，仅建议最先进的安全团队使用。正如我们刚才所说，摧毁主动防御行动需要非政府组织所不具备的特殊法律地位。


  ## F3EAD


  最后要介绍的主要循环将情报循环的情报生成方面与事件循环和杀伤链循环的以行动为中心的方面相结合。`F3EAD` 是作为一种目标制定方法论为在现场与情报分析小组协作的特种作战团队而构建的，它解决了前两个循环各自的两个关键问题：


  *   情报循环不应仅产生更多情报：而应通向有意义的行动。在我们的案例中，这意味着威胁情报不应仅引导我们获得更多威胁情报，而应通向积极的事件响应行动。

  *   行动循环不应在目标完成后就结束。任何行动中获得的信息都应开始反哺一个新的情报循环。在我们的案例中，当事件响应结束时，期间产生的信息应输入情报机制，以开始开发新情报、从以往事件中吸取教训，并为未来的入侵尝试做好更充分的准备。


  因此，这两个循环——行动与情报——是*相互反哺*的，而不是仅反哺自身（图 3-5。


  ![](img/image-to-come.png)




  ## F3EAD：情报驱动的事件响应循环


  为了促进这一过程，F3EAD 使用了联合情报与行动循环的修改版本：Find（发现）、Fix（锁定）、Finish（终结）、Exploit（开发利用）、Analyze（分析）、Disseminate（传播）。正如你将看到的，这意味着要经历事件响应循环，将结果反馈到情报循环中，然后将这些结果再连接回一个新的事件响应循环。


  ## Find


  **Find（发现）** 阶段包含行动的 *targeting（目标确定）* 阶段，即确定你将应对的威胁。这可以来自许多来源，例如供应商情报或开源情报。理想情况下，你自己之前的情报循环也应该反哺这一过程。根据行动或投资的不同，该阶段可能由
  IR 团队自身决定，配合情报团队，甚至与这些团队之外的群体合作，如 SOC 或管理层。这与事件响应循环的 Preparation（准备）阶段相呼应。


  ## Fix


  基于 Find 阶段的信息，**Fix（锁定）** 阶段建立遥测数据，确定对手在网络中的位置以及我们能检测到的任何外部存在。澄清一下，*fix* 并不意味着修复（我们最初也困惑过！）；它指的是识别对手在网络中的作战存在。这涉及获取可用信息，弄清对手可能攻陷了哪些系统、服务或资源，他们的通信渠道是什么，以及他们如何在你的网络中横向移动。我们可以将其视为事件响应循环的
  Identification（识别）阶段。


  ## Finish


  **Finish（终结）** 阶段包含实际的事件响应行动（这与该流程最初军事版本中预期的更具动能和致命性的行动形成对比——请勿执行那些行动）。这是你对对手采取决定性行动的时刻，执行事件响应循环中的
  Containment（遏制）、Mitigation（缓解）和 Eradication（根除）阶段。


  F3EAD 的主要转变在于 IR 行动的结束并不代表循环的终结。无论组织是在团队间转移资源和职责，还是同一团队改变自身活动重心，Finish 阶段的结束都标志着
  Exploit 阶段的开始。F3EAD 流程的情报半程由此启动。


  ## Exploit


  **Exploit（开发利用）** 阶段大致对应情报循环的 Collection（收集）阶段，主要区别在于该阶段激光聚焦于循环作战阶段从对手处收集的信息。对于情报驱动的事件响应，以下信息特别有用：


  - 任何指标（IOC），包括 IP 地址、URL、哈希值和电子邮件地址

  - IOC 的自动化扩充（如获取给定 IP 的反向 DNS 或收集 WHOIS 数据）

  - 漏洞利用投递样本

  - 恶意软件样本

  - 常见漏洞与暴露（CVE）及漏洞利用代码

  - 用户和事件报告

  - 对手的通信记录

  - 先前已识别的 TTP

  - 对手的目标、意图和动机


  不可能列出所有可能有用的内容，但分析师应尽可能收集关于攻击各个阶段的更多信息。结合 Kill Chain（杀伤链）思考，并尝试在可能的情况下收集每个阶段的信息。


  ## Analyze


  **Analyze（分析）** 阶段映射到（毫不意外）情报循环的 Analyze 阶段。此阶段的目标是评估收集的信息对短期和长期活动影响的启示。这通过以下几种方法实现：


  - 总结战术、技术与程序（TTP）

  - 将数据放入模型或框架中以便进一步分析

  - 解读时间线和杀伤链以得出可执行的建议


  与通用情报阶段一样，Analyze 阶段本身也是循环的。恶意软件分析可能产生更多 IOC，这些 IOC 本身可以被扩充，并可能导致发现更多恶意软件。总体目标是建立对行动者及其
  TTP 的完整图景，重点关注如何检测、缓解和修复其行动。


  ## Disseminate


  只有在正确的时间、以正确的格式将情报传递给正确的受众，使其有足够时间吸收并采取行动，情报才有用。传播不仅仅是推送信息——它是识别决策者所需的信息，以他们可消费的方式交付，并随时准备回答问题或接受后续信息请求。情报传播主要关注受众，而非个人分析师偏好的工作方式。因此，理解受众至关重要，受众通常分为以下类别：


  **Tactical（战术层面）**

  : 情报最直接的受众是事件响应团队，反馈到下一个 F3EAD 循环的开端。他们关注 IOC 和汇总的 TTP。


  **Strategic（战略层面）**

  : 通常只需一次重大事件，管理层就会开始对 IR 和威胁情报团队产生强烈投入和兴趣。他们的兴趣在于高度概括的 TTP（更关注战役而非单一事件）和目标行动。此情报应为未来的资源分配和更大规模的业务规划提供决策支持（例如，为风险评估提供依据）。


  **Third party（第三方）**

  : 许多组织参与某种形式的威胁情报共享小组。每个组织必须确定自己的参与交战规则。与领导层和法务团队合作，确定最佳执行方式。根据目标和合作意愿，这可能包含任何抽象层级的情报。


  无论情报层级或受众如何，你都希望传播的信息清晰、简洁、准确且可执行。


  ## Using F3EAD


  F3EAD 是可以实施的最强大概念之一，能同时改进安全运营的威胁情报和事件响应两侧。它也是最困难的概念之一。很难解释为什么一个大多数人甚至不知道如何发音的晦涩特种部队首字母缩写，应该成为
  IT 部门标准操作程序的一部分，但它提供了一个关键的缺失拼图：行动如何产出更好的情报，反之亦然。


  在思考其具体形态时，不要纠结于细节，而应关注整体概念：安全运营和事件响应成为威胁情报的输入，威胁情报成为安全运营和事件响应的输入。每当安全运营团队的任何部分（无论是
  SOC、CIRT 还是个人工程师）完成一次事件响应，其所有输出、文档、笔记、取证工件、恶意软件和研究都应传递给情报团队。随后，情报团队开发利用并分析这些信息。基于该事件的输出应反馈给运营团队，循环由此持续。这最终形成了一种安全运营/威胁情报
  OODA 循环——Observe（观察）、Orient（判断）、Decide（决策）、Act（行动）。安全运营团队利用情报的速度越快，完成运营任务的速度就越快，进而驱动更多情报产出。




  这些操作 + 情报模型不必局限于安全运营中心（SOC）和情报团队。同样的流程也可用于漏洞管理和应用安全（AppSec）团队。例如，当应用安全团队发现新漏洞时，该漏洞可被视为一条情报。无法保证应用安全工程师是发现该漏洞的第一人。因此，AppSec
  团队会向 SOC 提供尽可能多的信息，SOC 随即开始寻找针对该漏洞的过往攻击迹象。


  ## 选择合适的模型


  模型的目的是提供一个框架，用于解读信息并生成情报。请记住乔治·博克斯的名言：“所有模型都是错的，但有些是有用的。”有数百种可用于情报分析的模型，还可以从其他学科（如军事冲突理论和执法^(4)）中引入更有用的模型。其中一些模型旨在通用，另一些则是为个人或特定用例开发的。在决定使用哪种模型时，有几个因素需要牢记。可用的分析时间有助于确定哪种模型合适。如果有时间进行深入分析或事件分析，钻石入侵分析模型可能效果很好。如果有时间限制，可以使用
  OODA 循环等模型来驱动决策。信息类型也可能决定哪种模型最合适，因为某些模型是为特定数据源（如 NetFlow 或端点数据）设计的。最后，可能取决于分析师的偏好。如果分析师发现某个模型在其流程中效果良好，则完全可以继续使用该模型。甚至可能会出现开发新模型成为最佳选择的情况。


  ## 场景：ROAD RUNNER（大路奔跑者）


  现在我们已经学习了许多关键模型，你需要了解情报驱动的事件响应。我们即将深入事件响应、网络威胁情报的实际核心细节，以及它们如何协同工作以帮助你保卫组织。


  本书其余部分将采用联合行动/情报模型 F3EAD，并辅以特别适合情报驱动型事件响应的额外分析模型和框架进行编排。在演示此过程时，我们将使用我们对 Road Runner
  的自行调查，这是我们在本章前面首次了解到的以选举为重点的活动的代号。我们认为这是威胁主体 Grey Spike（灰色尖刺）的最新任务，且他们正积极以我们的组织及其他组织为目标。利用该对手及相关活动，我们将贯穿
  F3EAD 流程。


  ## Find（发现）


  下一章将介绍我们如何主动和被动地锁定对手，以收集支持 F3EAD 流程其余部分所需的信息。我们将评估我们从以往组织内部事件以及外部共享信息中了解到的关于 Road
  Runner 的情况。


  ## Fix（锁定）


  此阶段可视为调查阶段，涉及在受害者环境中追踪对手。在此，我们将在网络中主动狩猎 Road Runner 活动，谁知道呢，我们甚至可能发现之前未知的其他对手迹象！


  ## Finish（终结）


  一旦识别出所有对手活动，终结阶段将把对手从环境中清除。


  ## Exploit（开发利用）


  事件响应流程结束后，我们将开始开发源自我们事件响应流程的数据，以便汲取经验教训和洞见。我们已经知道 Road Runner 行动是由资金充足且持久的对手实施的，我们需要积极努力防止他们重新获取对我们信息的访问权限。这始于尽可能多地了解他们的活动。


  ## Analyze（分析）


  接下来，我们将把这些数据转化为情报，以便在未来保护我们的组织，并帮助可能面临类似入侵或相同对手的其他人。


  ## Disseminate（分发）


  开发出情报后，我们将其制作成多种实用格式，面向多类受众，以便从该流程中获得最大可能的效用。


  最后，我们将形成一套完整的产品，深度拆解名为 Road Runner 的活动。


  ## 结论


  事件响应等复杂流程通常受益于模型的使用，模型为流程提供结构，并可定义任务完成所需的必要步骤。确定应使用哪些模型取决于具体情况、可用数据，在许多情况下还取决于分析师的偏好。你对这些模型及其应用越熟悉，就越容易针对不同事件确定应使用哪些模型。


  现在，让我们深入 Find 阶段！



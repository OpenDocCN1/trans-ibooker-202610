- '# 第 1 章 简介


  > 但我认为真正的张力在于你可能称之为追踪者与其猎物之间的关系，无论那是作家还是间谍。

  >

  > 约翰·勒卡雷


  情报曾被局限于国家安全和军事行动的隐秘领域，现已成为全球众多组织日常运作的基础。其核心在于为决策者提供在任何特定情况下做出正确选择所需的信息。


  过去，决策者因信息不足而面临巨大的不确定性，难以做出正确决策。如今，他们同样可能感到信息过载，却依然面临同等程度的模糊性和不确定性。网络安全领域尤为如此，因为鲜有传统迹象表明重大行动即将发生。为了就是如何准备和应对网络安全事件做出决策，决策者需要既懂情报基础、又了解网络入侵细微差别，并能将两者结合，对形势及其对整个组织的影响做出准确评估的分析师。简而言之，他们需要能够开展情报驱动的事件响应的分析师。


  在深入探讨情报驱动的事件响应应用之前，了解网络安全事件及其响应的演变历程，以及为何这在该领域如此重要，至关重要。本章涵盖网络威胁情报的基础知识，包括其历史、近期活动和未来发展方向，为本书后续讨论的概念奠定基础。


  ## 作为事件响应一部分的情报


  只要存在冲突，就总有人在观察、分析并报告关于敌人的情报。战争的胜负取决于理解敌人的思维和行动方式、洞悉其动机并识别其战术，以及基于这种理解做出大大小小决策的能力。无论冲突类型如何，无论是国家间的战争还是针对敏感网络的隐蔽入侵，情报都在指引着双方。掌握情报的艺术与科学、分析对手意图、能力和机会的信息，并能据此采取行动的一方，几乎总能获胜。


  ### 网络威胁情报的历史


  理解情报在事件响应中作用的最佳途径之一，是研究该领域的历史。下文列举的每个事件都足以（且常常确实）填满整本书。从经典著作《布谷鸟蛋》到数十年前入侵事件“月光迷宫”的最新披露，网络威胁情报的历史引人入胜，为当今从业者提供了诸多教训。


  #### 首次入侵


  1986 年，Cliff Stoll 是加利福尼亚州劳伦斯伯克利国家实验室计算机实验室的一名博士生，他发现账单上有 75 美分的差额，表明有人在未付费的情况下使用实验室的计算机系统。我们现代以网络安全为中心的大脑看到此情景会尖叫“未经授权的访问！”，但在
  1986 年，鲜有管理员会得出这一结论。网络入侵并非每日新闻，也没有数百万甚至数十亿美元被盗的说法；连接“互联网”的大多数计算机属于政府和研究机构，而非普通用户，因此很容易假设使用系统的每个人都是友好的。网络防御常用工具
  `tcpdump` 还要一年才开始开发。常见的网络发现工具如 `Nmap` 要十年后才会出现，利用框架如 `Metasploit` 则要 15 年后才会问世。这种差额被认为是软件漏洞或记账错误的可能性，与单纯有人未付费的可能性差不多大。


  事实并非如此。正如 Stoll 所发现的，他面对的不是计算机故障，也不是贪图便宜的用户。他在追踪一名“狡猾的黑客”，后者利用伯克利的网络作为跳板，访问白沙导弹靶场和国家安全局（NSA）等敏感政府计算机。Stoll
  利用打印机将大量数据包打印在纸上以保存记录，监控传入的网络流量，并开始为首例有记录的网络间谍案件的入侵者建立画像。他掌握了攻击者活跃的典型时段，监控其为穿越互联网络而运行的命令，并观察其他活动模式。他发现攻击者最初是通过利用
  GNU Emacs 中 `movemail` 函数的漏洞进入伯克利网络的，Stoll 将这一战术比作布谷鸟将蛋产在别的鸟巢中孵化，这也启发了他描写此次入侵的书名《布谷鸟蛋》。





  ## 理解攻击者


  理解攻击者意味着可以保护网络免遭进一步利用，识别其下一步可能的攻击目标，并能做出响应，无论是在微观层面（识别实施攻击的个人）还是宏观层面（意识到国家正在其传统情报收集武器库中采用新战术，并改变政策以应对这一变化）。共享这种理解最终被证明不仅是保护劳伦斯伯克利国家实验室的关键，也是保护许多其他政府机构的关键。


  ### 破坏性攻击


  1988 年，康奈尔大学学生罗伯特·T·莫里斯闯入麻省理工学院（MIT）的一个计算机实验室，并释放了一个计算机程序，该程序旨在在不被检测的情况下尽可能多地复制自身到其他计算机上。它通过利用互联网电子邮件投递系统中的一个后门以及识别网络用户的
  *finger* 程序中的一个缺陷来实现这一点。这可能只是一个无害的实验——或者正如一些人所描述的，只是一个恶作剧，鲜为人知，然而它并没有完全按照莫里斯的意图运行，从而成为了网络历史的一部分（这就像普通历史，但更酷）。该蠕虫最终导致
  6000 台计算机瘫痪，约占当时互联网规模的 10%，受害者包括哈佛、普林斯顿、斯坦福、约翰霍普金斯、美国国家航空航天局（NASA）和劳伦斯利弗莫尔国家实验室等众多机构。联邦调查局（FBI）的调查人员在检查活动时举步维艰，不确定这是停机事故还是攻击，这时莫里斯给两个朋友打电话，承认是他制造了该蠕虫。其中一位朋友致电《纽约时报》，这最终导致莫里斯因违反
  1986 年新颁布的《计算机欺诈和滥用法案》（CFAA）而被识别并定罪。


  虽然该蠕虫背后没有恶意意图——它实际上只是程序并不总是完全按照其创建者的意图运行的另一个例子——但它产生了深远的影响，至今仍清晰可见。随着互联网对运营变得越来越关键，能够快速识别和修复其他入侵或破坏性攻击变得愈发重要。计算机应急响应小组（CERT）在卡内基梅隆大学成立，作为一个专业、受过训练的响应团队，负责为网络攻击提供评估和解决方案。这也凸显了为什么有时归因攻击很重要——1988
  年冷战显著“缓和”，里根和戈尔巴乔夫在莫斯科会晤，苏联军队开始从阿富汗撤军。如果该蠕虫被错误地归咎于苏联活动——这实际上正是“布谷鸟蛋”事件中活动的归因情况——可能会显著改变历史进程。


  ### “月光迷宫”


  在 1986 年“布谷鸟蛋”事件和 1988 年“莫里斯蠕虫”事件之后的十年里，应急响应领域得到了改善，不仅因为 CERT 的成立，还因为该领域本身在政府、军队和私营部门实现了专业化。此外，适当的网络监控工具的出现意味着防御者不再依赖散落在地下室的打印机来识别恶意网络活动。这种能力的增强是幸运的，因为入侵不仅持续发生，而且在范围和复杂性上不断增长。1998
  年，美国政府发现了据信迄今为止规模最大、持续时间最长的政府网络入侵事件——代号为“月光迷宫”。


  1998 年 3 月，美国政府在多个敏感和受限网络中发现了异常活动，包括五角大楼、美国国家航空航天局（NASA，显然 NASA 一直以来都是入侵者的高优先级目标）和能源部（DOE）。进一步分析在几所大学中发现了相同的恶意活动，并确认该活动至少已持续了两年。这种持续性质不同于之前已知的任何入侵，后者似乎更具针对性且昙花一现。与那些实例不同，对手在网络的不同部分留下了战略性后门，以便随时返回。信息从许多通常看似无关的地点被收集。


  我们有幸与直接支持“月光迷宫”事件调查和响应的人员密切合作，无论是在 1990 年代还是今天，因为关于此次入侵仍有许多未知之处和许多有待发掘的见解。与这些人交谈并阅读大量关于该入侵的报告，深刻地说明了情报工作对事件响应至关重要，特别是网络威胁情报填补了国家利益与外国对手在战略层面发生的事情，以及这些对手的目标和行动如何在计算机网络上显现之间的空白。美国拥有全方位的情报机构积极搜寻和监听外国干预的迹象，但最大规模的网络攻击却直到“意外”被发现才被察觉，因为情报工作尚未完全调整以应对针对网络的行动。


  “月光迷宫”将网络威胁情报能力推向了现代。计算机网络不再是可能偶尔受到影响的对象，这些网络现在因其持有的信息和访问权限而成为直接攻击目标。计算机网络成为了情报收集的一部分，情报也需要在其防御中发挥作用。


  ## 现代网络威胁情报


  几十年来，威胁不断增长和演变。对手不再仅仅是外国政府或好奇的学生。有组织犯罪分子、身份窃贼、诈骗者、意识形态驱动的活动家以及其他具有各种动机的人，都意识到当他们的活动针对数字目标而非物理目标时，能产生多大的影响。这些对手使用不断扩大的工具和战术集来攻击受害者，并主动试图逃避检测。与此同时，我们对网络的依赖不断增加，使得事件的影响更大。理解攻击者变得更加复杂，但并不减少其重要性。


  理解如何识别攻击者活动以及如何利用这些信息保护网络，是事件响应者工具箱中一个较新成员——网络威胁情报——背后的基本概念。*威胁情报*是对对手的分析——他们的能力、动机和目标，而*网络威胁情报*（CTI）是对对手如何利用网络领域实现其目标的分析。请参阅图
  1-1，了解这些攻击层级如何相互关联。


  ![](img/image-to-come.png)


  最初，情报分析师是在像“月光迷宫”这样的入侵事件发生后才介入，以了解整体入侵事件告诉我们关于对手的什么信息。他们的目标、动机、能力、组织架构——所有这些对于战略理解和长期规划都很重要，但对于那些试图防御当下、明天、甚至有时是上周攻击的人来说，并不能立即提供价值。网络威胁情报开始更多地关注更具即时可操作性的战术和技术细节，在此过程中了解在不同情况下哪些类型的信息最有价值。网络威胁情报分析师不仅带来数据，还带来洞察。





  在信息安全领域，我们传统上关注可观测的概念；我们偏好那些可测试、可复现的事物。而网络威胁情报则处于观测与解读之间的领域。我们可能无法**确定**某对手会企图访问员工财务记录，但我们可以对过往入侵数据以及我们网络外部成功攻击者的数据进行分析，并就可能需要额外防护的系统和数据类型提出建议。我们不仅需要能够解读信息，还需要能够以一种对目标受众有意义的方式传达它，以帮助他们做出决策。回顾他对《布谷鸟的蛋》中入侵事件的历史性分析，Cliff
  Stoll 将“讲故事的必要性”视为他从整个经历中获得的关键教训之一。“我以为我只需向人们展示数据，他们就会理解，”他说，“但我错了。你需要讲一个故事。”（SANS
  CTI Summit 2017）


  ## 前进之路


  新技术让我们获得了更多关于攻击者行为的信息，也提供了基于这些信息采取行动的更多方式。然而，我们发现，随着每一项新技术或概念的实施，对手也在适应；拥有字母汤般名字的蠕虫和病毒变种的速度比我们的设备识别它们的速度还快，而资金充足、技术成熟的攻击者往往比许多网络防御者更有组织、更有动机。临时性和凭直觉的情报工作将不足以让防御者保持在威胁之前。分析也必须随之进化，变得正式且结构化。范围必须扩大，目标必须变得更具雄心。


  除了检测针对组织往往模糊且短暂的边界的威胁外，分析师还需要深入其网络内部，寻找那些突破防线的攻击，一直追踪到单个用户系统和服务器本身，同时还要向外看向第三方服务，以更好地了解可能针对他们的攻击者。信息需要被分析并理解其含义，随后必须采取行动，以更好地预防、检测和根除威胁。为更好地了解对手而采取的行动需要成为一个正式流程，并成为信息安全运营的关键部分：威胁情报。


  ## 情报驱动的事件响应


  *情报*通常被定义为经过提炼和分析、能够使利益相关者做出更好决策的数据。因此，情报需要数据。在情报驱动的事件响应中，有多种方式收集可被分析并用于支持事件响应的信息。但重要的是要注意，事件响应本身也会生成网络威胁情报。传统情报周期——我们将在
  [`#basics_of_intelligence`](https://atlas.oreilly.com/oreillymedia2/intelligence-driven-incident-response/editor/master/01-introduction.html#basics_of_intelligence)
  中深入探讨——涉及指导、收集、处理、分析、传播和反馈。情报驱动的事件响应包含所有这些组成部分，并有助于为威胁情报的其他应用（如网络防御、安全软件开发和用户安全意识培训）中的指导、收集和分析提供信息。情报驱动的事件响应并不在入侵被理解和修复时结束；它生成的信息将持续反哺情报周期。


  无论入侵是成功还是失败，对其进行分析都能提供各种信息，用于更好地理解环境面临的整体威胁。入侵的根因和初始访问向量可以被分析，以告知组织其网络防御中的弱点或攻击者可能滥用的策略。在系统上发现的恶意软件有助于识别攻击者用于规避传统安全措施（如防病毒软件或基于主机的入侵检测工具）的战术，以及他们可用的能力。攻击者在网络中横向移动的方式可以被分析，并用于创建监控网络中攻击者活动的新方法。攻击者执行的最终动作（如窃取信息或更改系统功能），无论是否成功，都能帮助分析师了解敌人的动机和目标，从而指导整体安全工作。事件响应工作中基本没有哪个部分不能用于更好地理解组织面临的威胁，并改进未来的防御和响应。


  因此，本书中概述的各种流程和周期旨在确保情报驱动的事件响应支持整体情报行动。虽然它们为在事件响应中利用网络威胁情报提供了具体指导，但请记住，随着情报能力的扩展，可以有更广泛的应用。


  ## 什么是情报驱动的事件响应？


  网络威胁情报并非新概念，只是给一个旧方法起了个新名字：应用结构化分析流程来理解攻击及其背后的对手。将威胁情报应用于网络安全是较近期的事，但基础没有变。网络威胁情报涉及应用情报流程和概念——一些最古老的概念——并使其成为整体信息安全流程的一部分。威胁情报有许多应用，但其最基本的利用方式之一是作为入侵检测和事件响应流程不可或缺的一部分。我们称之为*情报驱动的事件响应*，并认为这是每个安全团队都能做到的，无论是否有大量资本投入。它与工具关系不大，尽管工具有时确实有帮助，而更多的是关于我们处理事件响应流程方式的转变。情报驱动的事件响应不仅有助于识别、理解和根除网络中的威胁，还能强化整个信息安全流程，以改进未来的响应。


  ## 为什么需要情报驱动的事件响应？


  在过去几十年里，我们的世界变得日益互联，无论是字面上还是隐喻上，这使得攻击者能够以过去针对单个实体所需的相同精力，对多个组织发动复杂的战役和入侵。我们早已过了可以自动假设入侵是孤立事件的阶段——事实上，虽然我们过去常因发现入侵之间的重叠和关联而震惊，但现在如果我们*没*看到重叠，反而会感到怀疑。当我们更好地了解对手时，就能更容易地捕捉到显示入侵共性的模式。情报驱动的事件响应确保我们以一种有助于更快识别和响应这些模式的方式收集、分析和共享情报。


  ## SMN 行动


  一个很好的例子是对 Axiom 组织的分析，该组织是在 2014 年作为协同恶意软件根除（CME）活动的一部分被识别并披露的，该活动称为 [Operation
  SMN.](http://www.novetta.com/wp-content/uploads/2014/11/Executive_Summary-Final_1.pdf)





  ## Axiom Group 和 SolarWinds 案例研究


  六年多来，一个被称为 Axiom Group 的攻击者组织隐蔽地瞄准、渗透并窃取了财富 500 强企业、记者、非政府组织以及各类其他组织的信息。该组织使用复杂的工具，攻击者不遗余力地在受害者网络中维持并扩大访问权限。随着恶意软件被检测到，各受害组织启动了事件响应流程，对该组织使用的恶意软件家族之一进行的协同研究表明，问题远比最初想象的更为复杂。随着更多行业合作伙伴参与并交换信息，出现了一些模式，这些模式不仅显示了恶意软件的行为，还显示了一个在明确指导下工作的威胁行为者组织的行为。战略情报也随之被识别出来，包括被瞄准的地区和行业。


  这是情报周期在事件响应场景中发挥作用的一个绝佳例子。信息不仅被收集、处理和分析，还以一种能够产生新需求和反馈的方式进行传播，从而再次启动流程，直到分析师得出可靠结论并能果断行动，在报告发布时根除了
  43,000 个恶意软件安装实例。发布的报告也是传播阶段的一部分，使事件响应人员能够更好地了解该行为者组织的战术和动机。


  ## SolarWinds


  2020 年 12 月，位于德克萨斯州的 SolarWinds 公司发生大规模入侵事件的消息传出。该公司生产用于监控和管理 IT 网络的软件，是许多大型网络（包括网络安全公司、政府机构和财富
  500 强企业）中非常流行的工具。该活动是在网络安全公司 FireEye（SolarWinds 的客户）发现其网络遭到入侵、其开发的一套用于识别入侵的工具被未知实体访问后被检测到的。他们对自身网络入侵事件的调查使他们确定
  SolarWinds 是入侵源头。


  他们的分析表明，SolarWinds 的网络在 2019 年底已被攻破，其软件被篡改，导致推送给所有客户的软件更新包含一个后门，允许对手访问这些客户的网络。这并非首例基于软件的供应链攻击；但其规模和范围引人注目——据估计，超过
  18,000 家 SolarWinds 客户受到影响。其响应方式也引人注目，在 Moonlight Maze 事件 20 年后，展示了网络威胁情报作为一门学科已经取得了多大进步。一旦被识别，FireEye
  发布了包含事件细节和供他人检测网络活动方法的博客文章。其他团队迅速加入，分析其网络上的活动，并继续公开或通过既定的威胁共享小组共享指标和发现，从而迅速勾勒出整体攻击的全貌。国土安全部发布了关于供应链攻击的指导，将响应从仅对单一孤立事件做出反应的心态，转变为如何不仅帮助直接受影响的组织，还能为其他组织揭示重要经验教训。


  Axiom Group 的攻击和 SolarWinds 软件供应链入侵均属于寻求信息、与间谍活动相关的攻击，但国家资助的攻击者并非事件响应人员唯一需要担心的威胁。以经济利益为目的的犯罪活动也在演变，这些行为者也在努力保持在防御者和事件响应人员之前。近年来，以经济利益为目的的罪犯最重大的战术变化之一是转向勒索软件。勒索软件攻击使用工具加密网络上的数据，然后索要赎金以换取解密密钥。勒索软件的概念已存在数十年；然而，自
  2012 年以来，其使用量急剧增加，影响力也随之增大。尽管勒索软件攻击并不总是涉及针对多个组织的战略性和协同攻击，但实施勒索软件攻击的团体通常使用相同的战术、工具集，甚至往往共享目标情报来攻击不同受害者。针对这些以经济利益为目的的攻击，防御者也可以利用情报驱动的事件响应，在实际加密过程开始前，识别出其网络已被这些行为者攻破的早期迹象。


  ## 结论


  尽管计算机安全领域取得了诸多进步，攻击者仍在不断适应——但他们不必超越防御者。情报驱动的事件响应使我们能够从攻击者身上学习；识别他们的动机、流程和行为；即使他们试图智取我们的防御和检测方法，也能识别他们的活动。我们对攻击者了解得越多，就能更好地预防、检测和响应他们的行动。


  我们已达到这样一个阶段：在事件响应流程中实施情报，需要一个结构化且可重复的过程，而本书旨在为该过程提供洞见。全书中，我们提供了各种模型和方法，它们可被视为情报驱动事件响应的基石，以及这些模型为何有益于事件响应并能与之融合的背景知识。没有放之四海而皆准的方法。在许多情况下，具体的事件或组织将决定哪种特定的模型和方法组合最为适用。理解情报和事件响应的基本原则，以及将二者融合的具体方法，将使您能够构建一个适合您的情报驱动事件响应流程，并开发该流程以满足组织的需求。



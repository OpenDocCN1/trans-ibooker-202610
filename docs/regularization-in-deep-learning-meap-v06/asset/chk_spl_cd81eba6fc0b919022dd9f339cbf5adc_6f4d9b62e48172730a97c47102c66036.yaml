  overturn_probability: 0.96
  alternative: 正文小标题（前言内部欢迎语标题）
  counter_evidence:
  - 格式特征：该行使用二级标题标记“##”，而非全书最高层级的一级标题“#”，不符合只划分最高层级大章的编号与格式规则。
  - 语义特征：“‘欢迎’仅是前言内部的引导性小标题，不具备统领后续书籍内容的概括性，无法作为独立章节标题。
  - 上下文特征：其前一行为图书总标题，后文为“感谢您购买……”、“本书以独特的方式……”等前言正文，根据规则前言、致谢等正文之前材料应统一划分为一章，不应在前言内部另起新章。
  - 内容特征：该行后 1~3 行是前言段落，而非章节概述或子节标题，不满足章标题后应跟概述段落的上下文特征。

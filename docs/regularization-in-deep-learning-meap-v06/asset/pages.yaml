    # 1.3 Understanding underfitting and overfitting


    Underfitting refers to poor performance in training and test sets due to the trained
    model

    being too simple or the training data being too insufficient. Overfitting means
    the trained

    model performs well on the training set, a specific subset of the overall population,
    but does

    not generalize well to other test sets from the same population. In other words,
    the

    generalization error resulting from predicting the test set, or the generalization
    gap between

    the training set performance and the test set performance, is pretty big. However,
    why do

    we care so much about model generalizability, i.e., its predictive performance
    on the future

    unseen test set? To answer this question, let us go back to the exam example earlier.
    This

    time, we will use the amount of effort to proxy the model complexity; the harder
    we study,

    the more complex our mental model will be.


    It helps to observe the evolution of model performance in both training and final
    exams.

    As shown in figure 1.7, as we spend more hours studying and honing our mental
    model, we

    improve our problem-solving skills and get better scores in both training (practice)
    and test

    (final) exams. We may also notice that moving from 60 to 70 marks is much easier
    than

    from 80 to 90, or even 100; the amount of effort needed exponentially increases
    for the

    same unit improvement in exam marks.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '![](img/ee98e91e6845f41077b163bec833ee40_15_0.png)


    Figure 1.7 The evolution of training and test performances as more efforts are
    invested in exam preparation. We start in the underfitting region, where training
    and test performances improve as the mental problem-solving model becomes powerful.
    The model starts to overfit after passing the sweet spot, as reflected by the
    decreasing test performance. When being in the overfitting region, it is essential

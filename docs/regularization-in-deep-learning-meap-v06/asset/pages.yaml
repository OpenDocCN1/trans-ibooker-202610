  md: 'In order to calculate the derivative \(\frac{\partial f_L}{\partial \mathbf{w}}\)
    of function \(f_L\) with respect to the weights \(\mathbf{w}\), we would start
    by calculating the intermediate derivative \(\frac{\partial f_L}{\partial f_{L-1}}\)
    of \(f_L\) with respect to the previous layer’s prediction function \(f_{L-1}\),
    treating the whole chunk of \(f_{L-1}(\cdots f_1(\mathbf{w}))\) as a single entity.
    Equivalently, we can interpret \(\frac{\partial f_L}{\partial f_{L-1}}\) as \(\frac{\partial
    f_L(x)}{\partial x}\), where \(x=f_{L-1}(\cdots f_1(\mathbf{w}))\).


    We would proceed similarly by calculating the intermediate derivative \(\frac{\partial
    f_{L-2}}{\partial f_{L-1}}\) of \(f_{L-1}\) with respect to its previous layer’s
    function \(f_{L-2}\), and so on. This process of deriving the intermediate derivatives
    continues until reaching the first (i.e., inner most) function \(f_1\), where
    we multiply the last derivative \(\frac{\partial f_1}{\partial \mathbf{w}}\).
    Finally, these intermediate derivatives are multiplied together. In other words,
    \(\frac{\partial f_L}{\partial \mathbf{w}}\) can be calculated as follows:


    \(\frac{\partial f_L}{\partial \mathbf{w}} = \frac{\partial f_L}{\partial f_{L-1}}
    \frac{\partial f_{L-1}}{\partial f_{L-2}} \frac{\partial f_{L-2}}{\partial f_{L-3}}
    \cdots \frac{\partial f_2}{\partial f_1} \frac{\partial f_1}{\partial \mathbf{w}}\).


    Figure 4.13 illustrates the process of calculating the derivative of the final-layer
    prediction function \(f_L\) with respect to the weights \(\mathbf{w}\) of the
    initial hidden layer. We would first follow the forward propagation process to
    generate a series of embedded predictions for the weights. Then the backward propagation
    kicks in and generates a series of intermediate derivatives for each pair of adjacent
    layers. Finally, the gradient of the outermost function \(f_L\) with respect to
    the weights \(\mathbf{w}\) is derived by multiplying the intermediate derivatives.
    These calculations are performed via the automatic differentiation functionality
    in most popular deep learning frameworks such as PyTorch.'

- pgno: 148
  md: '# 5.1.1 Data augmentation


    Data augmentation essentially contributes to the diversity of the training data
    exposed to the model by introducing noise to the existing data (input, output,
    or both) and generating additional artificial data points, thus presenting new
    data that are different but similar to the original data. They could help alleviate
    some of the challenges on distributional inconsistency and insufficient representativeness
    of the training data. By increasing and augmenting the diversity of the training
    data, the model is forced to perform well on a broad spectrum of data points,
    making it less likely to experience a high variance over the original dataset
    and more likely to generalize to the test set.


    Some of the most popular applications of data augmentation include image classification
    and object recognition in computer vision. For example, when training a model
    to classify digits based on image data, we could harvest more training data under
    the same category by making slight changes to the input images such as cropping,
    zooming/in/out, rotation, flipping, or adjusting the brightness. The introduced
    variety helps the model learn the consistent structure from different perspectives
    instead of overfitting and memorizing the original training data. Data augmentation
    has become a de facto data pre-processing step applied in most computer vision
    tasks, saving the need to gather more training data manually.


    However, proper caution should be exercised when applying transformations to image
    data. For example, it is easy to confuse the digit “6” with “9” when rotating
    an image, as well as the letter “b” with “d” when flipping an image. The interested
    object may also be accidentally cropped out of the image. Since we would expect
    these newly created images obtained by transforming the existing ones still belong
    to the same category, the random noise introduced should not change the meaning
    of the original image data.


    Figure 5.2 illustrates the augmentation process for image data under the same
    class label, where we project the images to points within a two-dimensional coordinate
    system for ease of visualization. Note that the concept of projection is central
    to deep neural networks, where easy layer is a sort of project from the last layer
    in some sense and the projected features are supposed to be more meaningful and
    informative through learning. In fact, we could even generate additional data
    at a certain hidden layer by interpolating among the hidden features. Such interpolation
    within the hidden layer could generate better-quality data since the hidden features
    are more linearized and uncorrelated deep in the network. This particular technique
    was recently proposed by Wang et al. in a 2019 NeurIPS paper titled "Implicit
    Semantic Data Augmentation for Deep Networks". We will learn more about this technique
    in a later chapter on regularization via objective function as the authors beautifully
    converted the augmentation task to a modified cost function, thus achieving implicit
    data augmentation.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '![](img/ee98e91e6845f41077b163bec833ee40_149_0.png)


    Figure 5.2 Data augmentation process in image classification task.


    It should be noted that these data augmentation techniques are empirically tested
    to be helpful in *some* cases only, in particular computer vision tasks. Given
    our observation on sample non-monotonicity, more training data may sometimes hurt
    test performance.


    Our eventual goal is to increase the generalizability of the trained model. How
    does creating more (artificial) training data serve as a regularization technique
    and help contribute to this goal? The model is constantly presented with new and
    slightly modified data by introducing random noises and perturbations to the original
    training data. The model is more likely to learn robust features when the dataset
    is sufficiently diverse. These additional data points reflect our prior belief
    or inductive bias as we know introducing slight transformations to an image does
    not change its class label. In other words, we use data augmentation to increase
    the size of the training dataset and regularize the model training process so
    that the trained model will have low variance and is more likely to generalize
    well to the test set.


    Data augmentation contributes to the generalization performance of the trained
    model by adding more plausible and realistic versions of training data so as to
    improve the test set performance. It is considered an *implicit regularization*
    technique, which is in contrast to *explicit regularization* techniques such as
    penalizing the norm of the weights.


    Note that data augmentation does not apply to the test set; it is merely a preprocessing
    technique to augment the training dataset before the start of each training iteration.
    However, despite the tendency to increase the test set performance of the model,
    we *may* observe a decrease in the training set performance.


    Now let us look at label smoothing, a slick technique that tweaks the target label
    to achieve regularization.'

    # Removing some weights using individual weight-level sparsity, i.e., Lasso regularization


    # Removing a hidden node/feature (along with all connecting weights) using group-level
    sparsity, i.e., group Lasso regularization


    # Inducing both weight-level and node-level sparsity using elastic net regularization


    Figure 6.11 Sparsity-inducing learning in a simple FCN. The top-left figure is
    the original FCN, where all weights are learned and retained. The top-right figure
    is an example of using Lasso to disable certain connecting weights (denoted by
    the dashed line) by setting their value to zero. The bottom-left figure uses group
    Lasso to remove a node (denoted by the dashed circle and lines) by setting all
    incoming and outgoing weights to zero. The bottom-right figure applies the elastic
    net regularization to combine both Lasso and group Lasso and achieve weight-level
    and node-level sparsity.


    The side-effect of promoting sparsity via dropout is similar to using group Lasso
    in the node-level selection, although dropout does not involve an explicit regularization
    term on the nodes.


    In the next section, we will look at implementing the dropout operation from scratch,
    and apply it in both FCN and CNN using the MNIST dataset.


    # 6.2.3 Dropout in action


    The dropout operation consists of dropping some nodes according to a preset probability
    and scaling up the weights of the rest of the nodes. Here, we specify the probability
    of dropping nodes (which is also a hyper-parameter) and not the probability of
    keeping nodes. This applies to both the example we will cover in the following
    and the dropout layer available in PyTorch.


    When implementing dropout, the first part involves generating an indicator list
    of Boolean numbers to be multiplied with the nodes within the layer of assessment,
    be it the input layer or hidden layer. When a node is multiplied by zero, or equivalently
    a `FALSE` value in Python, the resulting feature value of the node will become
    zero and flow into the following operation, which amounts to dropping out or masking
    this node. It also ensures that no error gradients will flow back during backpropagation
    to the neurons that were dropped. The list of'
  merge: -1
  img_proc: true
- pgno: 194
  md: "Booleans has the same length as the number of nodes and is generated by comparing\
    \ a list of random numbers with the preset dropout probability, where the random\
    \ numbers follow a uniform distribution between 0 and 1\n\nThe second part is\
    \ to scale up the feature value of the nodes, which is equivalent to scaling up\
    \ their outgoing weights. The reason is that after dropping out some nodes, the\
    \ rest of the nodes need to be scaled up in value in order to compensate for those\
    \ dropped nodes. In particular, suppose the dropout ratio is _p_, then each of\
    \ the remaining nodes will be multiplied by 1/(1 - _p_).\n\nThe following code\
    \ listing implements the dropout class that can be applied to the input layer\
    \ or any hidden layer. Upon instantiating the class, it accepts a default dropout\
    \ ratio of 0.5, which usually vary in the range of 0.5 to 1. The scaling factor\
    \ is also calculated and stored as an attribute when the __init__() function is\
    \ triggered automatically. Next, the forward() function specifies how the dropout\
    \ operation is performed and is automatically triggered when applying this class.\
    \ Specifically, we first create an indicator list called `selected_ind` to determine\
    \ which nodes to mask/mute. The list of Boolean numbers is created by comparing\
    \ a list of uniformly generated numbers in the range of 0 and 1 to the preset\
    \ dropout_rate. The indicator list is later converted to a floating data type\
    \ and wrapped in a variable, whose gradient propagation is disabled as there is\
    \ no learning involved. Finally, we mask the nodes according to the indicator\
    \ list and scale up the rest of the survivor nodes.\n\n# Listing 6.1 Defining\
    \ a customized dropout class\n\n```\nclass Dropout(nn.Module):\n    def __init__(self,\
    \ dropout_rate=0.5):\n        super(Dropout, self).__init__()\n        self.dropout_rate\
    \ = dropout_rate\n        if self.dropout_rate < 1: #A\n            self.scaling_fct\
    \ = 1.0 / (1.0-dropout_rate) #A\n        else: #A\n            self.scaling_fct\
    \ = 0.0 #A\n\n    def forward(self, input):\n        if not self.training: #B\n\
    \            return input\n\n        selected_ind = torch.Tensor(input.shape).uniform_(0,1)\
    \ > self.dropout_rate #C\n        if input.is_cuda: #D\n            selected_ind\
    \ = Variable(selected_ind.type(torch.cuda.FloatTensor),\n                requires_grad=False)\
    \ #D\n        else: #D\n            selected_ind = Variable(selected_ind.type(torch.FloatTensor),\n\
    \                requires_grad=False) #D\n\n        return torch.mul(selected_ind,\
    \ input) * self.scaling_fct #E\n```\n\n+   - #A define the scaling factor to remaining\
    \ nodes to compensate for dropped nodes\n+   - #B only apply dropout during training\
    \ mode\n+   - #C indicator tensor of same size to label the selected nodes\n+\
    \   - #D use GPU if available\n+   - #E drop out some nodes and scale up the rest"

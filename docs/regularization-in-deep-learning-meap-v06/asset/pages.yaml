    to a regularizing effect via the data or the model. We will cover more details
    on bootstrap and ensembling in later chapters.


    # 2.6.4 Reduced generalization with high model complexity


    The classical view on generalization essentially states that the two reducible
    sources of error, namely the bias and the variance, cannot be reduced simultaneously.
    When the bias is high and the variance is low, the model is relatively simple
    and tends to underfit the training data, which often happens at the initial stage
    of training. In this scenario, a common direction towards empirical risk minimization
    is to train a more complex model. Increasing model complexity often leads to relatively
    large decrease in the bias and a slight increase in the variance term, thus reducing
    the overall combined cost. This increased bias means that our model will be biased
    and off-target in expectation. However, the overall benefit in empirical risk
    minimization still outweighs the downside from a possibly biased estimation when
    building a generalizable model.


    The classical view on generalization also indicates that a high-variance model
    is less likely to generalize to the future test set. When a model becomes arbitrarily
    complex, it tends to overfit the training data and even has the potential to perfectly
    interpolate the training data, resulting in zero training error. However, such
    a model tends to have a high variance as it also fits the noise in the training
    data. Therefore, when using the model to score new data points, a slight change
    in these data points would result in a very different output, making the prediction
    sensitive and unstable. In contrast, a good model reaches a proper tradeoff between
    the bias and the variance, avoiding potential underfitting or overfitting. The
    model'

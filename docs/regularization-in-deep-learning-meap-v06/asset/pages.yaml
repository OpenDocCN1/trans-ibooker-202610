  md: 'error obtained under the classical generalization theory forms the upper bound
    of all possible test errors for a given level of model complexity due to overfitting.
    The increasing test error shows the importance of regularizing the (effective)
    model complexity to control for the excessive sensitivity during model fitting.
    The lower bound is the empirically observed best global minimum across different
    levels of model complexity. We can obtain the lower bound using implicit regularization
    (i.e., SGD), explicit regularization (i.e., penalizing the norm of the weights),
    or both. We also notice that the gap between the upper and lower bound of the
    possible test errors increases as the model becomes complex.


    ![](img/ee98e91e6845f41077b163bec833ee40_143_0.png)


    Figure 4.23 The worst and best global minimum across different levels of model
    complexity. The upper bound is the worst global minima obtained under classical
    generalization theory when no regularization mechanism is used. The lower bound
    serves as the best obtainable global minima under the modern generalization theory.
    The gap between the upper bound and the lower bound increases as the model becomes
    complex.


    When the model is less complex and small in size, we will obtain a unique or very
    similar global minimum in the test error as the model is trained to minimize the
    training error. However, the gap increases between the best and worst global minimum
    as the model becomes flexible and complex. It is thus essential to apply proper
    regularization for large and complex models such as deep neural networks to obtain
    the best possible global minimum and generalize well to the future unseen test
    set.'

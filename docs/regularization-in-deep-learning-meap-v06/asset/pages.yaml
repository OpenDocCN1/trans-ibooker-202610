  md: "On the other hand, the original LeNet has 541,094 parameters. The relative\
    \ ratio in the number of parameters between these two networks is about 1/200,\
    \ which is similar to the one used in the original paper. By creating a much larger\
    \ fully connected network in size, we hope that LeNet_FC subsumes LeNet in terms\
    \ of expressive capability and approximating power. We could then compare their\
    \ optimization speed to reduce population loss in the ideal world while keeping\

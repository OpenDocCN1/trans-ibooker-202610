    # 6.1.3 Understanding the convolution operator


    The convolution operator is one of the main drivers for achieving the translational
    invariance property. Recall the convolution workflow figure in chapter 4, which
    is also shown in figure 6.5 here for ease of reference. The key takeaway is that
    we define a kernel/filter to sequentially convolve with different input patches
    and produce the resulting features in the feature map. Every single convolution
    consists of element-wise multiplications between the kernel and the input patch,
    followed by a summation operation.'

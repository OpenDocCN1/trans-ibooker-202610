- pgno: 87
  md: "$J(\\mathbf{w}) = \\sum_{q=2}^p \\sum_{r=2}^q \\beta_{q,r} w_q w_r$\n\nwhere\
    \ $\\beta_{q,r}$ represents the elements of $\\mathbf{\\Omega}$ and calculated\
    \ as follows:\n\n$\\beta_{q,r} = \\frac{(q-1)q(r-1)r}{q+r-3}$\n\nThe following\
    \ function performs coefficient estimation by performing the aforementioned steps\
    \ for solving the smoothing splines problem using the new normal equations. Note\
    \ that we use the `np.linalg.lstsq` procedure to solve for the least squares solution\
    \ as it handles under-, well- and over-determined equations.\n\n# Listing 3.3\
    \ Solving for the closed-form solution of the smoothing spline model\n\n```\n\
    ```python\ndef estimate_coef(X, y, num_basis): #A\n    Phi = polynomial(X, num_basis=num_basis)\
    \ #B\n    q = np.arange(2, num_basis).reshape(1, -1) #C\n    r = q.reshape(-1,\
    \ 1) #C\n    omega = np.zeros((num_basis, num_basis)) #C\n    omega[2:, 2:] =\
    \ (q - 1) * q * (r - 1) * r / (q+r-3) #C\n    values, vectors = np.linalg.eig(omega)\
    \ #D\n    beta = vectors @ np.diag(values.clip(min = 0) ** 0.5) #D\n    y_star\
    \ = np.concatenate((y, np.zeros(omega.shape[0])).reshape(-1,1)), axis=0) #E\n\
    \    Phi_star = np.concatenate((Phi, math.sqrt(rho) * beta.T), axis=0) #E\n  \
    \  w_star = np.linalg.lstsq(Phi_star, y_star, rcond=None)[0] #F\n    return w_star\n\
    ```\n```\n\n#A Function to estimate the model coefficients\n#B Expand the original\
    \ design matrix by adding polynomials\n#C Approximate the penalty term using the\
    \ omega matrix\n#D Generate the square root of omega matrix into beta matrix after\
    \ clipping non-negative values\n#E Create the elongated design matrix and outcome\
    \ variable respectively\n#F Solve for the optimal weight vector using the least\
    \ squares procedure from numpy\n\nNext, we create a function to calculate the\
    \ empirical risk, i.e., the mean squared error for a given dataset and set of\
    \ coefficients.\n\n# Listing 3.4 Calculating the mean squared error\n\n```\n```python\n\
    def calculate_mse(X, y, coef, num_basis):\n    Phi = polynomial(X, num_basis=num_basis)\
    \ #A\n    f_star = Phi@coef #B\n    resid = y - f_star #C\n    Q = np.dot(resid.T,\
    \ resid).mean() #D\nreturn Q\n```\n```\n\n#A Expand the original design matrix\
    \ by adding polynomials\n#B Generate the model prediction\n#C Calculate the residuals\n\
    #D Cost with the optimal weight\n\nNote that even when the model is complex enough\
    \ to perfectly interpolate the training data, the exact MSE loss will not be reflected\
    \ as zero during computation. Rather, it will be a very small number, such as\
    \ 10^-8, which can be assumed to be zero."

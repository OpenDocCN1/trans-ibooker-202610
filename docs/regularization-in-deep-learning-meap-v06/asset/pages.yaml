    regime to either the under-parameterized regime or the over-parameterized regime,
    both of which have a low test risk, although the latter seems more approachable
    and simpler by simply adding more parameters in the neural network.


    # 3.1.3 Extending the “double descent” phenomenon


    The “double descent” risk curve is widely observed in training machine learning
    and deep learning models as a function of model complexity. So far, the model
    complexity has been focusing on the model’s size, i.e., the number of parameters
    used. It was later discovered that this phenomenon also exists as a function of
    training iterations for deep neural networks. This means that when the model architecture
    is fixed, training the network using SGD also exhibits a “double descent” test
    risk as the parameters converge through iterations.'

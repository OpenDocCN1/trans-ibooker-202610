    used in the current iterate will determine the exact location. As the random noises
    accumulate due to the stochastic nature of SGD, the circles (distributions of
    possible places) will become bigger and bigger due to a larger space of possible
    results in future steps. The right panel represents the mean iterate of these
    circles using SGD.


    Figure 8.5 Comparing the paths of weight updates for different gradient descent
    algorithms. The left plot shows the path using the full-batch gradient descent
    algorithm, the middle plot shows the distribution of paths using different mini-batches
    in each update using SGD, and the right plot shows the mean iterate using SGD.


    The distributions of possible paths make it difficult to analyze the behavior
    of SGD, and one of the main highlights of this paper is to focus on the mean iterate
    at each timestep to characterize its expected behavior. Plotting out the mean
    iterate, as shown in the right panel of figure 8.5, makes the path non-stochastic
    and deterministic, thus ignoring the randomness along each timestep and making
    it easier to analyze the mean value only.


    Mathematically, recall that the SGD update algorithm takes the following form:


    ```

    w_{t+1} = w_t - \eta \nabla_w Q(w_t, D_t)

    ```


    By treating w_t as a random variable, we can analyze its mean/expected value by
    taking the expectation with respect to all possible random mini-batches of the
    training set, giving:


    ```

    \mu_t = \mathbb{E}_{D_t}[w_t]

    ```'

- pgno: 11
  md: 'This is an overly complex model that clearly overfits the training data


    This is still the true function the model is trying to approximate


    Figure 1.5 An example of overfitting due to an excessively complex model. The
    model perfectly fits all dots, giving zero error rate in training set. However,
    the wiggly curve comes at a price of generalizability - the model''s predictions
    for new input data will be far off from the truth. In other words, it fails to
    generalize to future unseen data in the test set. The excessive complexity leads
    to a large generalization gap.


    Regularization helps build simpler and more robust models that are generalizable
    to the test set. Just as Occam''s razor principle recommends: the simplest models
    tend to perform better. For example, deep neural networks are very good at obtaining
    a very low training error due to their sufficient representational capacity. The
    model with a low variance is selected among multiple over-parameterized and interpolating
    candidates, i.e., the simplest model with equally good performance. Since the
    actual level of complexity is unknown to us in advance, it is often impossible
    to jump to the right amount of model complexity during the training stage. One
    of the remedies is to regularize the process before or during model training.
    Regularization aims to penalize the unnecessary complexity of the model for reducing
    the generalization gap and obtaining a good performance in the test set. It helps
    us pick the right amount of model complexity needed to approximate the actual
    underlying pattern and remain robust to noise.'
  merge: -1

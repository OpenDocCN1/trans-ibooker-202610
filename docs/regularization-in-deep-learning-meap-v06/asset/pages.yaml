  md: 'independence means any row (column) in the matrix \(\Phi^T\Phi\) cannot be
    a result of linear combination from other rows (columns) in \(\Phi^T\Phi\). That
    closed-form solution will break down if we have more linearly independent features
    than linearly independent observations, i.e., \(d > n\), since there will be more
    than one solution and the system of normal equations is underdetermined. In other
    words, the matrix \(\Phi^T\Phi\) is not invertible when \(d > n\) in the unregularized
    linear regression setting.


    We have an advantage by adding a regularization term here. However, notice that
    the linear models'' coefficients are often used for inference. Adding a regularization
    term makes inferential questions hard to ascertain as the algorithm now is trying
    to simultaneously optimize parameter values and perform variable selection.


    By adding the additional term \(\lambda I\), we are essentially adding a scalar
    value \(\lambda\) to all the diagonal elements of \(\Phi^T\Phi\). This makes the
    new matrix (\(\Phi^T\Phi + \lambda I\)) invertible now, even when we have more
    features than observations, i.e., \(d > n\). This is an important property when
    we have a lot of features in the dataset; by penalizing the magnitude of the weights,
    we are able to learn from all features in a high-dimensional setting. The extra
    term \(\lambda I\) makes the matrix (\(\Phi^T\Phi + \lambda I\)) more regular
    and invertible, thus the linear model using ridge penalty is regularized.


    It should be noted that both \(\mathbf{w}^{LS}\) and \(\mathbf{w}^{ridge}\) require
    \(O(d^3)\) of work when calculating the matrix inverse; that is, the amount of
    computation is cubic in the number of features we have. Obviously, when \(d\)
    is large, calculating the close-form solution using the analytic expression will
    be computationally prohibitive. Now that we have a way to work with high-dimensional
    data by using the ridge penalty, how can we obtain the solution more efficiently?
    The answer is that we would need a more computationally efficient algorithm, which
    seems to be a good job for the gradient descent algorithm.


    # 7.2.2 Using gradient descent algorithm


    Instead of using the closed-form solution which is computationally demanding,
    we can resort to the gradient descent algorithm to leverage its computational
    efficiency. Since we have a total of \(d\) features and each feature is updated
    independently, let us focus on the update procedure for the \(j^{th}\) feature.


    Recall that the gradient of the cost function in ridge regression is \(\nabla
    Q(\mathbf{w}) = -2\Phi^T(\mathbf{y} - \Phi\mathbf{w}) + 2\lambda\mathbf{w}\).
    When taking the gradient with respect to the \(j^{th}\) feature, the partial derivative
    of \(Q(\mathbf{w})\) with respect to \(w_j\) can be written as \(\partial Q(\mathbf{w})
    / \partial w_j = -2\Phi_j^T(\mathbf{y} - \Phi\mathbf{w}) + 2\lambda w_j\), where
    the only change is the second term. The first term is the same as the term in
    the gradient descent update using least squares, while the second term adds information
    on the relative magnitude of the current weight during the gradient descent update.
    We can also write it as \(\partial Q(\mathbf{w}) / \partial w_j = -2 \sum_{i=1}^n
    \Phi_{ij}(y_i - \sum_{k=1}^d \Phi_{ik} w_k) + 2\lambda w_j\), where the summation
    across all observations is shown explicitly.


    When plugging in the coordinate-wise gradient descent algorithm, covered in chapter
    4, we have \(w_j^{(t+1)} := w_j^{(t)} - \eta[-2 \sum_{i=1}^n \Phi_{ij}(y_i - \sum_{k=1}^d
    \Phi_{ik} w_k^{(t)}) + 2\lambda w_j^{(t)}]\) for all weights, where \(w_j^t\)
    is the value of \(w_j\) at the \(t^{th}\) iteration, \(w_j^{(t+1)}\) is its updated
    value at the next iteration, and \(\eta\) is the learning rate. The := sign means
    \(w_j^{(t+1)}\) is defined as the expression on the right. Equivalently,'

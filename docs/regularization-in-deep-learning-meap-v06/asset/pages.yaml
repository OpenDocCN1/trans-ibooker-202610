  md: '\(\mathbb{E}[Q(\mathbf{w}, D_t)] = Q(\mathbf{w}, D)\)


    This property says that the empirical risk when using mini-batch SGD and given
    a sufficiently small learning rate, does not increase in expectation compared
    to full-batch GD. And it follows intuition. SGD uses the average loss of a random
    subset of the training data to perform the gradient descent update. Since the
    expectation operator empirically corresponds to an average, these average losses
    \(\{Q(\mathbf{w}, D_t)\}^{t=1}_B\) (with a total of \(B\) mini-batches) are then
    averaged to approximate \(Q(\mathbf{w}, D)\). Moreover, since the expectation
    operator involves integrating the randomness in \(D_t\), the unbiasedness property
    essentially says that the expected average mini-batch loss in \(Q(\mathbf{w},
    D_t)\) is thus equal to the average loss \(Q(\mathbf{w}, D)\) based on the whole
    training set.


    The unbiasedness property of the SGD estimator is an important property to ensure
    the convergence of SGD, despite the random gradient estimates at each step. To
    prove the convergence of SGD, we rely on Doob’s martingale convergence theorem,
    which states that any super-martingale satisfying a specific boundedness condition
    must converge. We know that the loss function will be lower bound by zero; that
    is, the loss function we choose for either regression (i.e., mean squared error)
    and classification (i.e., cross-entropy loss) cannot be negative. Now the question
    is whether the sequence of random variables, namely the mini-batch loss term \(Q(\mathbf{w}_t,
    D_t)\), is a super-martingale.


    Let us first introduce what is a martingale. A martingale refers to a stochastic
    process with a sequence of random variables, where the conditional expectation
    of the next value in the sequence is equal to the present value, regardless of
    all previous values. In other words, a martingale does not grow or shrink in expectation.
    On the other hand, the sequence of random variables observed in the form of loss
    iterates using SGD will be a super-martingale, which states that the future expected
    value is no bigger than the current value. Mathematically, we have:


    \(\mathbb{E}[Q(\mathbf{w}_{t+1}, D) \mid \mathbf{w}_t, \mathbf{w}_{t-1}, ...,
    \mathbf{w}_0] \le Q(\mathbf{w}_t, D)\)


    Here, we condition the expected loss of the next iterate on the history of past
    iterates from \(\mathbf{w}_0\) to \(\mathbf{w}_t\). In other words, the stochastic
    gradient descent update algorithm could reduce the cost on average by making the
    average loss of the next iteration smaller than the current loss, when the loss
    iterates follow a super-martingale. Intuitively, this makes sense since in every
    single step of SGD update, the stochastic gradient vector \(\nabla_w Q(\mathbf{w}_t,
    D_t)\) points to the steepest descent of the current mini-batch loss function;
    we know that the expected loss at the next iterate \(Q(\mathbf{w}_{t+1}, D_t)\)
    based on different mini-batches will be no bigger than the current loss \(Q(\mathbf{w}_t,
    D)\) based on the whole training set \(D\).


    Now let us look at a simple one-dimensional example to show that the sequence
    \(\{Q(\mathbf{w}_t, D)\}\) is indeed a super-martingale, where you will find that
    the unbiasedness property of the SGD estimator plays a big role. In the following
    figure, we plot the loss function \(Q(\mathbf{w}, D)\) using MSE for a scalar
    weight \(\mathbf{w}_t \in \mathbb{R}\) and training set \(D\). For the next iterate
    \(\mathbf{w}_{t+1}\) that is not too far away from \(\mathbf{w}_t\), we can use
    the first-order Taylor expansion to approximate the value of \(Q(\mathbf{w}_{t+1},
    D)\) based on the current loss value \(Q(\mathbf{w}_t, D)\) and the linear approximation,
    as indicated by the dashed line. This gives us the following:'

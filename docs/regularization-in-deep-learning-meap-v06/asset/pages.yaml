- pgno: 63
  md: '# 2.6 Empirical risk minimization


    So far we have assumed that the available data set (**X**,**y**) is a collection
    of i.i.d. samples generated from 𝕡(**x**,**y**), the underlying joint probability
    distribution that is unknown to us. The goal of model development is to iteratively
    train a model *f*₩ using the dataset (**X**,**y**) and ultimately identify the
    optimal model *f*⁕₩ from the total class of candidate models *F*₩. The optimality
    is identified when the model trained using the training subset (**X**,**y*)ᵗᵉˢᵗ
    results in a minimal cost *Q*(**w**) on the test subset (**X**,**y*)ᵗᵉˢᵗ, where
    (**X**,**y*)ᵗᵉˢᵗ is used as a proxy to the future unseen data.


    The test set error is a more indicative reflection of the mode''s generalization
    error. The model will produce a low or even zero training error when its complexity
    increases. Although using techniques such as feature engineering enhances the
    model''s flexibility to fit the training set better, the actual impact still needs
    to be assessed using the test set. The toy example we have been studying so far
    only focuses on the training set error. The trained model still needs to rely
    on a separate test set for a more objective performance assessment.


    The model cost *Q*(**w**) on the test set tells us how far off our prediction
    is compared to the true outcome. However, the test set (**X**,**y*)ᵗᵉˢᵗ is only
    one of the many possible realizations that could from 𝕡(**x**,**y**). What we
    really want is to build is a model that produces the minimal expected cost across
    all different variations of (**X**,**y*)ᵗᵉˢᵗ.


    The term expectation means we need to consider all possible realizations from
    𝕡(**x**,**y**) when assessing the cost *Q*(**w**) from the model *f*₩. For now,
    we will write *Q*(**w**) as L(*y*,*f*₩(**x**)) to highlight the fact that the
    cost now is also a function of the random input data pair (**x**,**y**), which
    may vary due to the random sampling from 𝕡(**x**,**y**). The expected cost is
    also called the *risk*, which measures the true generalization error of the model
    *f*₩ over all possible future (**X**,**y**). Mathematically, the risk for model
    *f*₩ is denoted as:


    ```

    $R(f_\mathbf{w}) = \mathbb{E}[Q(\boldsymbol{w})] = \mathbb{E}[\mathrm{L}(y, f_\mathbf{w}(\boldsymbol{x}))]
    = \int \mathrm{L}(y, f_\mathbf{w}(\boldsymbol{x})) \mathrm{d}\mathrm{P}(\boldsymbol{x},
    y)$

    ```


    where the expectation is expanded as an integral over all possible realizations
    of data based on the joint probability distribution 𝕡(**x**,**y**). In linear
    regression, the risk takes the form of the expected squared error R(*f*₩) = 𝔼[**y**
    − *f*₩(**X**)]² for all possible variations of (**X**,**y**).


    Minimizing the expected risk would produce an optimal model that generalizes best
    to future test set on average. However, since the joint data distribution 𝕡(**x**,**y**)
    is unknown, the true risk is instead approximated via an empirical risk term,
    i.e., the mean squared error based on the pre-allocated test set (**X**,**y*)ᵗᵉˢᵗ:


    ```

    $R_{\text{empirical}}(f_\mathbf{w}) = \frac{1}{n} \sum_{i=1}^{n} L\left(y_i, f_\mathbf{w}(\mathbf{x}_i)\right)
    = \frac{1}{n} \sum_{i=1}^{n} \left(y_i - f_\mathbf{w}(\mathbf{x}_i)\right)^2$

    ```


    Where *n* refers to the number of examples in the test set. The empirical risk
    minimization then states that the optimal model *f*⁕₩ is the one that minimizes
    the empirical risk:'

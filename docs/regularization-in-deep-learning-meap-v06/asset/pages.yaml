- pgno: 202
  md: 'In the following section, we will visit another type of generalization-inducing
    model architecture: multi-task learning.


    # 6.3 Implicit regularization in multi-task learning


    Up till now, we have been focusing on optimizing over a single particular metric,
    such as the mean squared error. This involves training a single model or an ensemble
    of models for the specific task at hand, often through many rounds of fine-tuning
    and estimation. However, when we are exposed to more than one task, this approach
    would ignore the potentially useful information from other related tasks. In this
    case, we can consider building shared representations among these similar tasks
    using multi-task learning (MTL) in order to improve the generalization performance
    on the original task. In other words, the domain-specific characteristics embedded
    in related tasks could help the model trained by MTL generalize better.


    MTL refers to a learning paradigm where multiple tasks are learned in parallel
    as opposed to being treated as independent tasks using a single-task approach.
    When simultaneously learning multiple tasks, the knowledge and experiences acquired
    in one task could (hopefully) be shared and transferred to other similar tasks,
    which is one of the fundamentals in human learning process. Indeed, we as humans
    often apply the knowledge acquired through related tasks when learning a new task.
    As a dedicated field in machine learning, MTL offers benefits in terms of learning
    efficiency and predictive accuracy. By leveraging the information embedded in
    the signals of auxiliary tasks, MTL could exploit the similarities and relations
    among multiple learning problems and thus contribute to test set generalization.
    The improved generalization performance is a result of the implicitly induced
    regularization effect when optimizing the model’s performance over all learning
    tasks.


    MTL can also viewed as a form of overlaying inductive bias, causing the model
    to prefer certain hypotheses (a set of models in the entire space of all possible
    models) over others. The inductive bias is provided by the joint training of the
    auxiliary tasks, since a model trained using MTL is tilted towards hypotheses
    that are able to explain more than one task, thus leading to better generalization.
    By biasing the model to favor representations which other tasks also prefer, it
    will also help the model generalize well to new tasks outside the training data,
    as long as the tasks are similar in nature and originate from the same data generating
    process.


    In addition, MTL can be considered as a form of implicit data augmentation, which
    effectively increases the sample size used in the training procedure. This interpretation
    comes from the fact that all the learning tasks are often perturbed by different
    levels of noise. When training a model on one task, the ultimate goal in a typical
    single-task training process is to learn a good enough representation that ignores
    the data-dependent noise and captures the underlying pattern, which helps it generalize
    well to the test set. Since different tasks are exposed to different noises, jointly
    learning two tasks will allow the model to acquire a more general representation
    and overcome task-specific noises. By lowering the risk of overfitting to a single
    learning task, simultaneously learning more than one task allows the model to
    average out the noise patterns and thus generalize better to both tasks.


    Another added benefit is called eavesdropping, where the model boosts its preference
    over certain features that are difficult to be learned in one task but easily
    identified in'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'another task. When learning one task, the potentially complex dependence structure
    in the feature space may impede the model from spotting certain important features,
    which may stand out when learning another related task. By learning these two
    tasks together, the model eavesdrops in a way from the other task and utilizes
    this outside knowledge in the current learning task, thus boosting its learning
    performance. See the review paper “An Overview of Multi-Task Learning in Deep
    Neural Networks” by Sebastian Ruder for a more detailed review on the use of MTL
    in deep learning.


    Figure 6.14 for a summary on the benefits of MTL.


    ![](img/ee98e91e6845f41077b163bec833ee40_203_0.png)


    Figure 6.14 Summarizing the multiple interpretations of and benefits from multi-task
    learning.


    It should be noted that most MLT deep learning models assume that the tasks come
    from the same data generating process. Although this assumption benefits the sharing
    nature among multiple related tasks, it may not always hold in practice. It becomes
    a challenge to build a robust MTL model when the learning tasks are unrelated
    or merely loosely related to each other. Part of this challenge can be addressed
    by allowing the MTL model to learn what to share, such as the cross-stitch networks
    introduced later. Besides the level of sharing, allowing the model to automatically
    learn the hierarchical structure with levels of granularities also helps improving
    the model’s generalization performance. Even if our goal is to learn one task
    only, leveraging on the knowledge of other tasks, even sometimes adversarial,
    could often help deliver a better predictive performance.


    Let us look at two popular approaches of training MTL models in the context of
    deep neural networks.


    # 6.3.1 Two MTL approaches in deep neural networks


    There are two main approaches when performing MTL using deep neural networks:
    hard parameter sharing that enforces all tasks to share a common set of weights,
    and soft parameter sharing that encourages different tasks to learn a similar
    representation, often'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'achieved by imposing certain constraints on the corresponding weights. Let
    us look at them in detail.


    As the most popular sharing scheme in neural networks, hard parameter sharing
    encourages different tasks to learn a common representation by enforcing them
    to completely share a set of weights in the hidden layers among all tasks, while
    maintaining a few task-specific layers in the final output. This common set of
    weights are then used to combine with downstream task-specific layers, which are
    independently learned for each task. By imposing a representation that supports
    all tasks, hard parameter sharing induces an implicit regularization effect and
    reduces the chance of overfitting. In other words, by asking the model to learn
    multiple tasks jointly, our model is forced to find a representation that captures
    all jointly learned tasks and this reduces the chance of overfitting the original
    single task. In particular, when these tasks are believed to share a certain level
    of commonality, such as predicting gender and age from the same human face, we
    could impose such inductive bias in the model by enforcing a common backbone architecture
    for all tasks.


    Figure 6.15 illustrates the hard parameter sharing scheme. We start with a sequential
    block that covers all the shared layers across the three tasks. These shared layers
    are designed to learn the commonalities among all tasks, i.e., the set of features
    that are task-wide predictive. Upon reaching the last shared layer, the network
    expands to three branches, dedicated to each task respectively. These task-specific
    layers are responsible for learning within-task characteristics which are considered
    to be unique to the specific learning task. Compared with having three separate
    networks for each learning task, the hard parameter sharing architecture is more
    computationally efficient due to fewer learnable parameters, besides the added
    benefit of less overfitting and better generalization performance.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '![](img/ee98e91e6845f41077b163bec833ee40_205_0.png)


    Figure 6.15 Illustrating the hard parameter sharing scheme for three tasks. The
    architecture starts with a common set of shared layers used by all tasks for common
    representation learning, then branches into three separate sequences of layers
    for task-specific learning. When all learning tasks are related to each other,
    such architecture offers better generalization performance (with fewer parameters
    and thus lower risk of overfitting) as well as higher learning efficiency (again,
    with fewer learnable parameters compared with three separate networks). Note that
    the individual task-specific losses could be combined directly via using a weighting
    scheme following some prior preference or using an adaptive approach.


    On the other hand, the soft parameter sharing scheme adds a soft constraint to
    encourage a similar representation among related weights of all learning tasks,
    instead of enforcing them to adopt the exact same value. The constraint often
    takes the form of a distance-based penalty measure among the model weights, such
    as the l1 norm as in the Lasso penalty and l2 norm as in the ridge penalty. Regularizing
    the distance among the weights of the model encourages these weights to be similar
    in value. This scheme thus offers more flexibility for the architectural design
    each learning task as it only loosely couples the shared feature representations.
    See figure 6.16 for an illustration, where the soft constraints, as indicated
    by the double arrows, are applied to encourage a similar representation among
    the corresponding features.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '![](img/ee98e91e6845f41077b163bec833ee40_206_0.png)


    Figure 6.16 Illustrating the soft parameter sharing scheme for three tasks. The
    architecture consists of three dedicated sequences of network for each task respectively.
    The same input data is fed into the network three times as in the case of single
    task learning. However, the network applies a soft constraint (i.e., lasso or
    ridge penalty as indicated by the double arrows in between sequences) on the parameters
    of certain hidden layers so as to encourage a similar representation when jointly
    learning all three tasks.


    The hard parameter sharing scheme is intuitive to implement as we only need to
    modify the model''s architecture as a tree structure, consisting of a trunk and
    a few branches. The soft parameter sharing, however, requires modifying the loss
    function to overlay the soft constraints. Let us look at how this could be achieved.


    # 6.3.2 Modifying the loss function to achieve soft parameter sharing


    Assume that we have three learnings tasks: A, B, and C. Denote the $i^{th}$ layer''s
    weights of task $j$ by $W_i^{(j)}$, where $j \in \{A,B,C\}$. One way to impose
    the soft constraint on the similarities among corresponding weights is to augment
    the cost function with an additional term: the sum of squared Frobenius norm (also
    called the Euclidean norm) across all shared layers. As shown in figure 6.17,
    assuming a regression task, we would use the mean squared error as the base loss
    and add the layer-wise sum of squared Frobenius norm across all shared'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'layers. The balance factor \(\lambda_i\) for the \(i^{th}\) layer could be
    set the same across all shared layers, and \(||\cdot||_F^2\) denotes the squared
    Frobenius norm.


    ![](img/ee98e91e6845f41077b163bec833ee40_207_0.png)


    Figure 6.17 Modifying the cost function to achieve soft parameter sharing, where
    we add the layer-wise sum of squared Frobenius norm across all shared layers to
    the mean squared error to obtain the final cost. Note that the balancing factor
    could be set to the same value across all shared layers.


    Note that this approach of augmenting the cost function by regularizing the consistency
    of corresponding positional weights is also considered as regularization via the
    objective function, a topic to be entertained in the next chapter. Indeed, many
    regularization techniques fall into more than one category, and the boundary will
    only become less clear as more exciting approaches get proposed. Among the many
    regularization techniques that promote the model’s generalization performance,
    we intend to cover the most popular and methodologically interesting ones.


    One interesting approach is called cross-stitch networks, originally proposed
    by Misra et al. in their 2016 paper named “Cross-stitch Networks for Multi-task
    Learning”, where the so-called cross-stitch units are used to allow the model
    to automatically learn and determine how task-specific networks leverage the knowledge
    from other auxiliary tasks. As shown in figure 6.18, a cross-stitch unit is linear
    combination of the outputs from the previous layer, which can be a pooling layer
    or a fully-connected layer. By learning the extent of linear combinations across
    all shared layers, the cross-stitch network is able to automatically identify
    the layer-specific sharing scheme and determine the sharing of representations
    across all the tasks.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '![](img/ee98e91e6845f41077b163bec833ee40_208_0.png)


    Figure 6.18 Illustrating the cross-stitch network, where the orange boxes represent
    cross-stitch units that linearly transform the outputs from the previous layers.
    By treating the level of linear transformation as a learnable parameter, the network
    is able to automatically determine the optimal sharing of representations across
    all shared layers.


    In the following section, we will look at implementing an MTL model using the
    hard parameter sharing architecture using PyTorch.


    # 6.3.3 MTL in action


    In order to perform learning over multiple tasks, we will use the Standard cars
    dataset, which consists of 16,185 images of 196 classes of cars along with the
    corresponding metadata such as the make, model, and year. These multiple categories
    of labels allow us to apply an MTL model for joint estimation.


    Before we dive into the specifics, it is important to understand the differences
    between MTL and the typical binary-class classification, as well as multi-class
    classification. Binary-class classification is the simplest case, where we aim
    at predicting one of the two possible outcomes in a single task, i.e., predicting
    whether it is a red car or not. Multi-class classification involves a single target
    variable, still a single task, that assumes more than two possible values, such
    as the brand of the car. Multi-task learning could be a combination of'
  merge: -1
  img_proc: true

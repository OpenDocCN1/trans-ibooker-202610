    # 4.4 More on generalization


    Earlier, we mentioned that the SGD is widely used in deep neural network models
    due to its good generalization performance. We did not explicitly use any regularization
    in the process. Thus, the SGD algorithm seems to pose an implicit regularization
    effect, apart from the broad model class of neural networks and the particular
    input data type (i.e., structured image data). The implicit regularization from
    SGD would promise a further decrease in test error even when the training error
    reaches zero, thus leading to the “double descent” in the test loss curve. The
    effect of implicit regularization is recently studied by Smith et al. (2021) in
    their paper “On the Origin of Implicit Regularization in Stochastic Gradient Descent”,
    which we will discuss in a later chapter.



- pgno: 12
  md: '# 1.2 Curse of dimensionality


    Why is a modern machine learning model easily over-parameterized and prone to
    overfitting? The answer has to do with the rise of Big Data. Recent years have
    witnessed a significant increase in the four Vs. of Big Data: volume, the scale
    of data; velocity, streaming data at high frequency; variety, different forms
    of data; and veracity, the uncertainty of data. The four Vs. are primarily driven
    by advances in modern data collection touchpoints: live-streaming surveillance
    video cameras, tons of web searches and conversations, and ongoing business transactions
    of all sorts. Together, they present unprecedented and exciting challenges to
    both storage and modeling approaches.


    One immediate challenge is the high dimensionality. The multitudes of features
    in the data also present the curse of dimensionality challenge to modelling, making
    it difficult to design an algorithm that can effectively learn the underlying
    pattern in high dimensions. Traditional statistical approaches such as linear
    regression work best when dealing with a small set of features. In the presence
    of high dimensionalities, such as image data that easily contain tens of thousands
    of features, it requires much more complex algorithms to identify, extract, and
    transform essential features and make good predictions. Figure 1.6 shows an example
    of image data.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '![](img/ee98e91e6845f41077b163bec833ee40_13_0.png)


    Figure 1.6 Example image taken at the CBD area of Singapore. A typical colour
    image like this one has shape (400, 225, 3), where 400 denotes the width, 225
    denotes the height, and 3 means the number of colour channels, i.e., red, green
    and blue. This results in a total of 400*225*3=270,000 pixel values, i.e., features
    in a single image.


    Similar challenges exist for text data as well. For instance, a document consists
    of a multitude of words, each of which could express a different meaning depending
    on the context. To effectively learn from text data and identify consistent patterns,
    the model needs to be able to derive word importance and their interaction effect.
    This process could easily result in tens of thousands of features.


    Specific regularization approaches can effectively tackle the challenge of high
    dimensionality. For example, sparse learning aims to learn a small subset of significant
    features and discard the others. Such an approach essentially assumes that only
    a small subset of features is predictive, and the rest are removed by setting
    the coefficient to zero. Standard sparse learning techniques include Lasso and
    its variants, which work by adding a penalty on the magnitude of the coefficients,
    besides minimizing training error. For example, if we want to build a model to
    classify if the previous picture to be either country or city area, the features
    representing the tall buildings are more likely to be predictive than others.
    Using the sparsity constraints could help silence the irrelevant features by setting
    their resulting coefficient to zero, giving more focused attention to predictive
    features.


    This type of regularization could be interpreted in multiple ways. For example,
    from a geometric perspective, adding such a penalty introduces a specific geometric
    constraint to'
  merge: -1
  img_proc: true

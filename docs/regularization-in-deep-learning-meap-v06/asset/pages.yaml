- pgno: 221
  md: '# # 7


    Regularization via Objective Function


    # ### This chapter covers


    +   - Norm-based penalties and their use in regularizing a model estimation process

    +   - L2-norm-based penalty in ridge regression and its implementation

    +   - L1-norm-based penalty in LASSO regression and its implementation

    +   - Derivation of closed-form solutions for both ridge and LASSO regression

    +   - Empirical analysis on the effect of different regularization schemes in
    training feed-forward neural networks


    The objective function is the final stop of the forward pass when training a neural
    network. Also referred to as the cost function, the objective function determines
    the quality of prediction based on the current parameter configuration of the
    network. It guides the weight updates in the next iteration via gradient descent.
    By summarizing the prediction quality for all observations, the objective function
    offers a single metric that summarizes the amount of error for downstream optimization.
    That single metric is small in value if the predictions are close to the target
    values (on average) and large otherwise.


    The directionality of the objective function applies to both regression and classification
    settings. We know that mean squared error (MSE) and cross-entropy loss (CEL) are
    popular choices of metric for regression and classification, respectively. MSE
    is lowered bounded by zero, and we get a zero MSE when the algorithm perfectly
    interpolates all training data points. However, getting an exact zero CEL is impossible
    since the SoftMax operation is used. Minimizing these empirical loss functions
    in both situations keeps the optimization iterations running. When using big neural
    networks, we often run the optimization until the model'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'interpolates the training set, and we accompany the process with some form
    of regularization to increase the likelihood of generalizing to the test set.


    Recall the overall model training workflow shown in figure 7.1. The primary role
    of the objective function is to compare the model prediction with the corresponding
    target label, taking a classification setting, for example, without loss of generality.
    It provides a direct scalar value, often in the form of a cost to be minimized,
    to summarize the predictiveness of the current model. When the goal of the optimization
    procedure is to build an accurate model that performs well in the training set,
    optimizing the objective function means minimizing the prediction error by continuously
    changing the weights to the point that the prediction error is zero. In other
    words, the final state of maximizing the prediction accuracy _alone_ in the objective
    function is a model that perfectly interpolates the training dataset.


    ![](img/ee98e91e6845f41077b163bec833ee40_222_0.png)


    Figure 7.1 The overall model training workflow. The objective function is the
    last stop of the forward propagation, after which the optimization procedure,
    such as gradient descent, will kick off to optimize the parameters of the pre-specified
    model architecture.


    However, a complex model is prone to overfitting irregardless of whether it exhibits
    perfect interpolation in the training dataset. Such complexity often leads to
    unstable predictions for a new test set with a slight variation. It turns out
    that we can include more than one metric in the objective function. For example,
    instead of optimizing the prediction accuracy alone, we can introduce an additional
    penalty term on the complexity of the model so that the resulting model is expected
    to trade off between prediction accuracy and model complexity. In other words,
    a complex and likely overfitting model will obtain a low prediction cost but at
    the same time, incur a significant penalty on the model complexity, causing the
    total value of the objective function to be high. On the other hand, a simple
    model gives a low value on the penalty term but lacks predictive power, leading
    to a high value of the objective function.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'In this chapter, we will uncover different forms of penalty terms in the objective
    function. The penalty term serves as an explicit regularizer that induces a desired
    property of the resulting estimator (i.e., the weight configuration), such as
    sparsity via $l^1$-norm-based (only a subset of features is selected in the final
    model) and $l^2$-norm-based regularity (a small weight is preferred over a large
    weight). Devising a composite objective function with novel and domain-specific
    penalty terms is an exciting research field. We aim to lay the foundation for
    readers in terms of common approaches currently used in training deep neural networks.


    # 7.1 Introducing the regularization term


    In the context of a deep neural network, we encountered sparsity as a form of
    regularization in the previous chapter. For example, when using the dropout technique
    during training, a sparse network is obtained by randomly disabling specific nodes
    in a neural network. The weight-sharing property in the convolution operation
    also plays the same role as having a sparse network. By reducing the number of
    parameters as a form of regularization, the algorithm is less likely to select
    an overly complex model and, therefore less prone to overfitting.


    A sparse neural network is also computationally faster and more scalable. For
    example, although fruit flies or ants have roughly 250K neurons in their brains,
    they can still perform complex tasks such as motion sensing and food seeking.
    A neural network of this size is barely mid-sized in the modern deep-learning
    era. However, we would need a much bigger network to achieve a similar task, as
    shown by the increasingly complex models in autonomous robots. The neuron-level
    sparsity, i.e., each neuron is only connected to a subset of downstream neurons,
    is becoming an essential property in robust neural networks. When recognizing
    a face, only a specific part of our brain is activated, and the rest remains inactive.
    It is thus essential to channel the input signal to the right regions in a neural
    network and avoid redundant computations that contribute little to the correct
    prediction.


    Similarly, of all the 86 billion neurons in a human brain, a typical neuron is
    only connected to dozens of thousands of other neurons on average. Such a sparse
    connection also manifests in a convolutional neural network, where each neuron
    of the current layer only receives input information from a small patch in the
    previous layer. As shared in the last chapter, the sparse connection in CNN is
    essentially a fully connected network (FCN) with zero weights in most of the connections.
    However, designing an architecturally sparse and efficient network is better than
    starting with an FCN and learning the nonzero weights since we can avoid multiplying
    the zero weights with the input matrix and summing up all the zeros for follow-up
    non-linear transformation.


    A sparse representation is even more advantageous in the case of high-dimensional
    problems. For example, when treating each pixel as a separate feature in an image
    recognition task, there are as many weights to be estimated as the number of pixels
    when using a simple linear regression model. These weights are likely to be correlated,
    especially when physically close to each other. When one weight increases in value,
    the nearby weight may either go up (causing overfitting) or down (compensating
    for the increase). Therefore, we need to enforce certain conditions on the weights
    so as to induce a preference for a simple and parsimonious model.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'Before we introduce the regularization term in the objective function to control
    the magnitude and/or sparsity of the estimated coefficients, let us revisit the
    linear regression setting where we aim to minimize the residual sum of squares
    (RSS).


    # 7.1.1 The unregularized linear regression


    To start, let us express the objective function as the cost function Q(w); that
    is, for a given set of weights w, there is a corresponding scalar cost value Q(w).
    In the context of linear regression, imagine we are given a training set { (xi,
    yi) }i=1n, where xi denotes the list of input features for the ith observation,
    yi is the corresponding scalar target, and there are a total of n observations
    in the dataset. Given a set of weights w, the linear regression model can make
    a prediction f(xi; w) for the ith observation, after which the predicted value
    f(xi; w) will be compared with the corresponding target value yi to indicate the
    quality of the prediction. The quality of all individual predictions will then
    be aggregated into a single evaluation metric, Q(w).


    As covered in chapter 2, the cost function Q(w) can be expressed as the residual
    sum of squared error: Q(w) = Σi=1n(yi − f(xi; w))2 , where the squaring operation
    unifies both positive and negative errors, and larger errors incur a bigger cost
    than smaller ones. Alternatively, we can also express it as Q(w) = Σi=1n(yi −
    f w (xi))2 , where f w (xi) represents the prediction for xi given weights w.
    This is the most widely used cost metric for regression problems.


    We can also rewrite the RSS Q(w) using matrix notation, a more compact way to
    represent the joint cost for all n observations. This gives Q(w) = ||y − Φw||2
    , where Φ denotes the new design matrix after transforming the original design
    matrix X. Such notation is more general since Φ = X if there is no transformation
    to the input matrix. The RSS cost Q(w) is based on the linear model y = Φw + ϵ,
    where y is the target variable manifested in an n × 1 vector, Φ is an n × d design
    matrix, w is a d × 1 vector of weights, and ϵ is an n × 1 vector of random errors.
    We can equivalently express the RSS as Q(w) = Σi=1n(yi − φ(xi)T w)2 = (y − Φw)T
    (y − Φw). See figure 7.2 for an illustration on the linear model and the RSS objective
    function.'

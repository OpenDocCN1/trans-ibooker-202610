  md: 'In addition to the functional norm, other techniques can also be used to control
    the smoothness of the model. For example, stochastic gradient descent is an implicit
    regularizer that prefers a smooth and low-variance model out of many perfectly
    interpolating models. Averaging techniques such as bagging (bootstrap aggregation,
    to be covered in a later chapter) also plays some regularization effect on the
    smoothness of the fitted curve.


    When multiple models give zero training error, stochastic gradient descent prefers
    a model with low variance, as represented by a small norm of the weights. While
    a model with a smaller norm gets selected when living in the over-capacitated
    region with a large function class, the resulting “simple” model also has a lower
    variance in the model predictions. The smaller-variance model is due to the implicit
    regularization effect when training deep neural networks using the stochastic
    gradient descent algorithm. There is an ongoing research direction that focuses
    on understanding this specific algorithm itself. We will discuss more on this
    in later sections on regularization using optimization.


    **Norms**


    A norm can be considered as a real number that measures the magnitude of the weight
    vector W. One of the most commonly used norm is the lp norm, which is defined
    as lp = (ΣD j=1 |wj|p)1/p for a weight vector WT = [w1, w2, ..., wD]. For example,
    when p = 1, we have l1 = |w1| + |w2| + ··· + |wD|, a form of penalty used in Lasso
    regression. When p = 2, we have ε2 = √w12 + w22 + ··· + wD2 , a form of penalty
    used in Ridge regression. Different norms have different regularizing impact on
    the model, which will be covered in a later chapter on regularization via model
    cost.


    To better understand this phenomenon, let us bring back figure 1.15 and zoom in

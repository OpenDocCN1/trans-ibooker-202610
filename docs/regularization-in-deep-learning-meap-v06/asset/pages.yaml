    Note that rotational and scaling invariance properties can also be learned using
    the max pooling operation in CNN. For example, when the input image contains different
    degrees of rotation or scales, different filters in the hidden layer will get
    activated in terms of outputting a relatively large value. The max pooling layer
    will select the maximal activation from all filters, thus displaying invariance
    to possible rotation or scaling in the input image. Following the same reasoning,

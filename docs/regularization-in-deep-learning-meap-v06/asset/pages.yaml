  md: "# Listing 5.9 Build a custom tensor dataset that supports transform operations\n\
    \n```\nclass CustomTensorDataset(torch.utils.data.Dataset):\n    def __init__(self,\
    \ tensors, transform=None):\n        self.tensors = tensors\n        self.transform\
    \ = transform\n\n    def __getitem__(self, index):\n        x = self.tensors[0][index]\n\
    \        if self.transform:\n            x = self.transform(x)\n        y = self.tensors[1][index]\n\
    \        return x, y\n\n    def __len__(self):\n        return self.tensors[0].size(0)\n\
    ```\n\nSince the files end with `.npz` and are stored as `numpy` format, we can\
    \ load them and convert\nto `tensor` format so as to build the data loader. Each\
    \ input image tensor is changed\nfrom channel-last to channel-first format via\

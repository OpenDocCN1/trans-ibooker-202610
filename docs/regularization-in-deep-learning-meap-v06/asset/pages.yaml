    such as convolutional neural networks. As the model increases complexity in the
    underparameterized region, the test risk will decrease in the first descent and
    increase later on, following the U-shaped curve that highlights the bias-variance
    tradeoff. As the model becomes sufficiently complex to interpolate the training
    data, increasing the model complexity will enter the over-parameterized region
    and incur a second descent.


    However, it remains an uncharted and exciting area of research as to why this
    almost universal phenomenon occurs. Things become counter-intuitive when models

  md: 'noise, which is considered to be irreducibl. Note that it is totally fine to
    skip the derivation and jump to the outcome of the decomposition process. The
    main takeaway is that the risk can be decomposed into these three different pieces.
    Figure 2.22 illustrates the derivation process.


    ```

    R(f) = E[(y - f(X_new))^2 | x = X_new]

    = E[(y - f)^2]

    = E[(y - g + g - f)^2]

    = E[(y - g)^2] + E[(g - f)^2] + 2E[(y - g)(g - f)]

    = E[(g + \epsilon - g)^2] + E[(g - f)^2] + 2E[(gy - fy - g^2 + fg)]

    = E[\epsilon^2] + E[(g - f)^2] + {2(g^2 - gE[f] - g^2 + gE[f])}

    = \sigma^2 + E[(g - E[f] + E[f] - f)^2]

    = \sigma^2 + E[(g - E[f])^2] + E[(f - E[f])^2]

    = [\sigma^2] + [Bias^2[f] + Var[f]]


    Box 1: We are using a trick here by adding and subtracting an additional term

    Box 2: Plugging in the definition of y gives the variance of the noise

    Box 3: This is the irreducible part due to measurement error or other underlying
    and unknown sources of error

    Box 4: All terms get cancelled out after introducing the expectation; a result
    of using the trick

    Box 5: Another use of the same trick

    Box 6: Details omitted as it involves the same derivation process as above

    Box 7: This is the definition of the bias and variance for the model; the reducible

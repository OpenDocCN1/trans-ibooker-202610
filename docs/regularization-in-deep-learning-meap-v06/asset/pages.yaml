    # Figure 8.9 Illustrating the adaptive changes in momentum and Adam.


    Overall, Adam estimates the gradient vector’s first and second moments (mean and
    variance) to update the weights. Since the norm of the gradient vector is estimated
    and smoothed, the updates will be much less sensitive to the value of the learning
    rate. And because of this, Adam is a widely used optimizer and converges relatively
    quickly. However, as later pointed out by Wilson et al. in their 2017 Neurips
    paper titled “The Marginal Value of Adaptive Gradient Methods in Machine Learning”,
    adaptively changing the gradients, as in Adam and despite their faster optimization
    nature, often harms the generalization performance as compared to stochastic methods
    like SGD. It turns out that such stochasticity is a blessing rather than a curse;
    it enables SGD to deal with tricky situations, such as preferring a low-variance
    flat minima region over a high-variance sharp minima region.


    As an accelerated gradient-based method, Adam serves as an off-the-shelf optimizer
    when training deep neural networks. Many practitioners use Adam to train neural
    networks as this optimizer is not sensitive to how we set the hyperparameters,
    including the learning rate and the initial weights of the network. Using SGD,
    however, requires some amount of fine-tuning for these hyperparameters. Adam converges
    much faster than SGD, thus being a better optimizer from an optimization perspective.
    However, it suffers from poor generalization performance, a more critical pursuit
    when training models. As discussed in chapter 5, good offline generalization performance
    correlates with fast online optimization performance (i.e., converges fast) with
    an unlimited flow of new data. Since the training dataset is almost always limited
    in practical scenarios, we may not want to seek fast convergence as the only goal.


    In summary, the gradient noise in SGD is an essential feature in the stochastic
    optimization process rather than a disadvantage. By steering away from regions
    with high gradient noise, SGD delivers better generalization performance than
    accelerated methods such as momentum and Adam. It is, therefore, essential to
    keep stochasticity as one of the magic ingredients to obtain a good generalization
    performance.'

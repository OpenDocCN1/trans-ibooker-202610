- pgno: 76
  md: 'help the model learn. Understanding the model performance via the “double descent”
    phenomenon delineates the boundary of the classical statistical view. It sets
    the stage for further research on the statistical and computational aspects of
    model development, assessment, and selection in machine learning and deep learning
    models.


    It is also important to note that each point on the risk curve represents a fully
    trained model using a particular algorithm such as stochastic gradient descent.
    Suppose we take a vertical cut at a specific model complexity. In that case, the
    training risk denotes the training performance of the best-trained model obtained
    with this particular model complexity. The test risk represents the corresponding
    risk at the test set using the best-trained model. Each level of complexity corresponds
    to multiple potential models, and the risk curves only show the performance of
    the best-trained model for each level of complexity.


    # 3.1.2 Behind the “double descent” phenomenon


    Despite excessive model complexity and near-perfect fit to the training data,
    increasing the model complexity after the interpolation threshold generates a
    low error in the test set. This empirical observation has guided the training
    of deep neural networks in practice: a large enough neural network is preferred
    to allow easy interpolation of the training dataset and thus result in good generalization
    performance in the test dataset. The preference over large and complex network
    architecture also stands even when the training data is corrupted with high noise
    levels.


    The “double descent” risk curve is a framework that reconciles the over-parameterization
    scenario and subsumes the classical U-shaped risk curve on the bias-variance tradeoff.
    It reflects the modern interpolation regime instead of the classical regime separated
    by the interpolation threshold, i.e., the model that gives zero training error.
    The risk curve still follows the classical regime that balances underfitting and
    overfitting when the representational capacity is below the interpolation threshold.
    However, as the model increases capacity after the interpolation threshold, the
    test risk will enter the modern interpolation zone and decrease as the model becomes
    more and more complex.


    Note that the representational capacity or complexity is represented by the number
    of parameters in the model. A more complex model means more parameters are used
    in the model architecture. As we increase the representational capacity by involving
    more parameters in the model architecture, we will observe a decreasing test risk
    even below the best risk achieved at the “sweet spot” in the classical regime.
    However, why is that the case? Why are larger models suddenly performing better
    even though they are overfitting?


    One of the most widely accepted explanations lies in Occam’s razor mentioned in
    chapter 1: the simplest and smoothest model should be preferred when multiple
    models fit the data equally well. One way to measure model’s smoothness is the
    norm of the parameters. A model with a smaller norm in its weights is considered
    to be more regular and smoother. Such regularity and smoothness assumed in the
    model represent important inductive bias that complex models try to match. Therefore,
    when multiple models give zero training error, which could indicate equally good
    local (also global) minima, the model with the smallest norm in its weights will
    be selected. Such inductive bias is introduced when choosing a model from many
    potential candidate functions that fit the training data exactly.'

  md: 'Therefore, the backward-mode multiplication is generally more computationally
    efficient in most cases when doing automatic differentiation.


    The backward-mode multiplication in automatic differentiation is also called _backpropagation_.
    Specifically, the series of matrix multiplication starts at the last layer, followed
    by multiplying the matrices of partial derivatives in previous layers until reaching
    the initial weights. Despite the faster computation than the forward mode, the
    backward mode requires more memory size to store the intermediate matrices of
    partial derivatives in each hidden layer. However, running the forward mode would
    compute these gradients of the current layer in the same order as the forward
    pass of the prediction function, and the gradients are discarded when moving to
    the next layer.



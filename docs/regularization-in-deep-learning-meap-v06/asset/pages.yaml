  md: '# 2.4.2 The closed-form solution of linear regression


    In order to find the stationary points of the cost function, we could solve for
    the weight vector when setting the partial derivatives in the gradient vector
    to zero:


    ```

    -2Φᵀy + 2ΦᵀΦw = 0

    ```


    where 0 contains a vector of zeros corresponding to each entry in the system of
    equations. Rearranging the equation gives us the following normal equations:


    ```

    ΦᵀΦw = Φᵀy

    ```


    This leads to the closed solution for the optimal weight vector w* = (ΦᵀΦ)⁻¹Φᵀy,
    assuming ΦᵀΦ is invertible. Although expressing w* in this way makes it mathematically
    easier to follow, computing the matrix inverse term (ΦᵀΦ)⁻¹ is intensive as it
    requires an additional algorithm itself. Plus, such computation also introduces
    a potential numerical stability issue. Therefore, solving the system of linear
    equations for w based on the form of ΦᵀΦw = Φᵀy is often preferred in practice.


    Back to our example on the univariate linear regression, the optimal weight vector
    w* at the stationary point could be solved by the linalg.solve function in numpy.
    In the code listing below, we provide the left-hand side and right-hand side components
    of the normal equations to the optimization procedure and then calculate the new
    total cost.


    ```

    Listing 2.6 Solving the for optimal weight vector via closed-form solution


    w_star = np.linalg.solve(X_new.T@X_new, X_new.T@y) #A

    f_star = X_new@w_star #B

    resid = y - f_star #C

    Q = np.dot(resid.T, resid) #D

    >> Q

    array([[6.33963636]])

    ```


    #A Solve for the optimal weight vector

    #B Generate model prediction

    #C Calculate the residuals

    #D Calcluate the cost with the optimal weight


    The closed-form solution stored in w_star could then be used to make a new set
    of predictions and calculate the new cost, which is as low as 6.3, a big improvement
    over the initial cost based on the random weight vector.


    We can plot the new fitted line alongside the actual data points via the following
    code snippet. As shown in figure 2.11, the fit is now closer in general to the
    training points.


    ```

    y_vals = X_vals_new@w_star

    fig, ax = plt.subplots()

    ax.scatter(X, y, c=''black'')

    ax.set_xlabel(''x'', fontsize=25)

    ax.set_ylabel(''y'', fontsize=25)

    ax.plot(X_vals, y_vals, linewidth=2)

    plt.show()

    ```'

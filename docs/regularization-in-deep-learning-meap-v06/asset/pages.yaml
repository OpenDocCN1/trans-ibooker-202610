- pgno: 284
  md: 'SGD iterations grows. The proof is based on a few assumptions, and readers
    who prefer less theoretical properties can safely skip this section.


    The first assumption is on the Lipschitz smoothness of the gradient \(\nabla f(x)\),
    where \(f\) is a general function and can be interpreted as the cost function
    \(Q\). In other words, the function \(f\) has Lipschitz continuous gradient, whose
    definition takes the following form:


    ```

    \nabla f (x) - \nabla f (y) \leq L \|x-y\|

    ```


    We can set \(x = \mathbf{w}_t\) and \(y = \mathbf{w}_{t+1}\) to characterize the
    distance in the gradients of two consecutive SGD iterates and use \(Q(x)\) instead
    of \(f(x)\), giving us the following:


    ```

    \|\nabla Q(\mathbf{w}_t) - \nabla Q(\mathbf{w}_{t+1})\| \leq L \|\mathbf{w}_t
    - \mathbf{w}_{t+1}\|

    ```


    Since the cost function \(Q(\mathbf{w})\) is convex for both the case of regression
    using MSE (mean squared error) or classification using CEL (cross entropy loss),
    we can additionally obtain the following quadratic upper bound:


    ```

    Q(\mathbf{w}_{t+1}) \leq Q(\mathbf{w}_t) + \nabla Q(\mathbf{w}_t)^T(\mathbf{w}_{t+1}
    - \mathbf{w}_t) + \frac{L}{2}\|\mathbf{w}_{t+1} - \mathbf{w}_t\|^2

    ```


    Since \(\mathbf{w}_{t+1} = \mathbf{w}_t - \eta_t \nabla Q(w_t, D_{(t)}) = \mathbf{w}_t
    - \eta_t \nabla Q_t(\mathbf{w}_t)\), plugging in the previous inequality gives
    the following:


    ```

    Q(\mathbf{w}_{t+1}) \leq Q(\mathbf{w}_t) - \eta_t \nabla Q(\mathbf{w}_t)^T \nabla
    Q_t(\mathbf{w}_t) + \frac{L}{2} \eta_t^2 \|\nabla Q_t(\mathbf{w}_t)\|^2

    ```


    Since we are interested in the average behavior of SGD iterates, we can take the
    expectation of both sides as follows:


    ```

    \mathbb{E}[Q(\mathbf{w}_{t+1})] \leq \mathbb{E}[Q(\mathbf{w}_t)] - \mathbb{E}[\eta_t
    \nabla Q(\mathbf{w}_t)^T \nabla Q_t(\mathbf{w}_t)] + \mathbb{E}[\frac{L}{2} \eta_t^2
    \|\nabla Q_t(\mathbf{w}_t)\|^2]

    ```


    As the expectation is taken with respect to randomness in the sampling of a single
    observation (with replacement) at each SGD iteration, we can move the constants
    outside the expectation operator and apply the expectation operator to each term
    due to linearity:


    ```

    \mathbb{E}[Q(\mathbf{w}_{t+1})] \leq \mathbb{E}[Q(\mathbf{w}_t)] - \eta_t \mathbb{E}[\nabla
    Q(\mathbf{w}_t)^T] \mathbb{E}[\nabla Q_t(\mathbf{w}_t)] + \frac{L}{2} \eta_t^2
    \mathbb{E}[\|\nabla Q_t(\mathbf{w}_t)\|^2]

    ```


    Now we introduce two additional assumptions to proceed. The first one is the unbiasedness
    of SGD compared to GD updates, i.e., \(\mathbb{E}[\nabla Q(\mathbf{w}_t)] = \mathbb{E}[\nabla
    Q(\mathbf{w}_t)]\). This is not a strict assumption since the SGD iterates will
    always get closer to GD as the number of iterations grows, given the law of large
    numbers. The second assumption requires us to bound the norm of the SGD gradient
    by a constant \(G\), namely \(\|\nabla Q(\mathbf{w}_t)\| \ G\). Bounding the gradient
    ensures that the shape of the function \(Q(\mathbf{w})\) will not be too wiggly.
    Applying these two properties gives us the following:


    ```

    \mathbb{E}[Q(\mathbf{w}_{t+1})] \leq \mathbb{E}[Q(\mathbf{w}_t)] - \eta_t \mathbb{E}[\|\nabla
    Q(\mathbf{w}_t)\|^2] + \frac{L}{2} \eta_t^2 G^2

    ```'
  merge: -1

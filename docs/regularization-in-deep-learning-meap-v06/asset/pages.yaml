    number of epochs. In practice, data augmentation is *almost always* used when
    the training set contains a limited number of images. After all, the bootstrapped
    images can serve as additional training data to improve the model''s generalization
    performance. What if we push the data augmentation to the limit, where we have
    access to all possible variations of images in a fictional ideal world? This is
    an interesting question that we will approach in the following section.


    # 5.3 The deep bootstrap framework


    The previous example shows that having additional augmented training data could
    help the model better generalize, as indicated by a lower empirical loss. We managed
    to regularize the trained model by providing more data with slight variations,
    which better describes and approximates the true data generating distribution
    if appropriately done, i.e., 6 is not inverted to the extent that it is considered
    a 9. After all, the training task is easier if the training dataset is more comprehensive,
    covering more variations that lead to a more robust model.


    What if we have access to the entire universe of the training dataset? This would
    be an extreme case where the training paradigm shifts from a limited training
    dataset to an unlimited one. In other words, we would like to observe the model''s
    generalization performance given a theoretically complete training dataset. When
    provided with an unlimited supply of new data, the training procedure becomes
    an online learning problem where convergence rate (i.e., how long the training
    procedure requires for the model to converge) is widely studied in the optimization
    community. This is an exciting angle to study the generalization performance of
    deep learning models by comparing the offline'

    # 7.2 L2 regularization in ridge regression


    The ridge regression measures the magnitude of the weight vector using the squared
    \( L2 \) norm; that is, \( \|\mathbf{w}\|_2 = w_1^2 + w_2^2 + \cdots + w_d^2 =
    \sum_{i=1}^d w_i^2 \). We can also write this norm using vector notation, giving
    \( \|\mathbf{w}\|_2 = \mathbf{w}^t \mathbf{w} \). To see this, recall that \(\mathbf{w}\)
    is a \( d \times 1 \) vector and \(\mathbf{w}^t\) is a \( 1 \times d \) vector.
    Multiplying the two, \(\mathbf{w}^t \mathbf{w}\) will be a \( 1 \times 1 \) scalar
    value, which measures the magnitude of the model weights. See figure 7.4 for an
    illustration.'

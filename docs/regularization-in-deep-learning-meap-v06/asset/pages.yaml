    itself. However, we would easily train a good model in the second case, since
    we could simply keep generating different versions of the training data and feed
    to the model; the prediction problem could be easily solved even with a simple
    model.


    # 2.1.2 The train-test split


    The main objective of a machine learning model is to produce good prediction results
    on a future unseen dataset, called test set. However, the test set is unavailable
    to us, and the dataset (X,y) is all we have. To better gauge the model’s predictive
    performance on the test set, a common practice is to allocate a small portion
    of (X,y), denoted as (X,y)test, as a proxy for future unknown test set. This has
    two flavors of meaning. First, (X,y)test will not be used to train the model.
    In fact, we should not expose any of (X,y)test to the model during training; doing
    so would risk peeking into the future. Second, (X,y)test serves as a proxy for
    the model’s generalization performance on the future, possibly different test
    sets. This means that (X,y)test may or may not be a good proxy due to possible
    data drift, i.e., distributional difference in the datasets, leaving us an additional
    level of uncertainty in addition to model estimation.'

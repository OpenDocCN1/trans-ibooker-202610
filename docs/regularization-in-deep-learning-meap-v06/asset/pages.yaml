  md: '![](img/ee98e91e6845f41077b163bec833ee40_248_0.png)


    Figure 7.17 Training and validation error curves for different values of the hyperparameter
    $\lambda$. As $1/\lambda$ goes from small to big, the validation error curve will
    display a typical U-shaped curve that transitions from underfitting to overfitting
    in a typical linear regression problem. The optimal $\lambda$ is selected by minimizing
    the validation error.


    Again, not all values of $\lambda$ lead to a sparse solution. When $\lambda$ is
    relatively small, the resulting weights are still likely to be all non-zero. A
    sparse solution will occur when $\lambda$ increases to a specific value, whose
    increase will incur further sparsity in the resulting weights. Let us revisit
    the same contour plot in a slightly different context to better appreciate the
    geometric interpretation behind the LASSO-induced sparsity. This time, we will
    assume a general setting with many observations instead of one in the previous
    example. We will still use two weights for illustration purposes.


    As shown in figure 7.18, the objective function consists of the RSS term $\sum_{i=1}^N
    (y_i - w_0 \phi_{i0} - w_1 \phi_{i1})^2$ and the $L1$ norm of the weights $(|w_0|
    + |w_1|)$, weighted by the hyperparameter $\lambda$. When $\lambda = 0$, the solution
    is least squares as denoted by the solid dot on the left plot. When $\lambda \rightarrow
    \infty$, the solution is the origin, denoted by the solid dot on the right plot.
    The left contour plot consists of ellipses representing different level sets for
    the weights. For example, when setting the RSS term to a specific constant, we
    have $\sum_{i=1}^N y_i^2 + w_0^2 \sum_{i=1}^N \phi_{i0}^2 + w_1^2 \sum_{i=1}^N
    \phi_{i1}^2 + cross terms = constant$, which is exactly the expression of an ellipse
    on a plot. A bigger constant corresponds to a bigger ellipse. Similarly, we can
    visualize the level sets as diamonds for the $L1$ norm. Graphically, LASSO regression
    is thus a weighted combination of an ellipse and a diamond.'

  md: '# # Fundamentals of Training Deep Neural Networks


    # ## This chapter covers


    +   - The functional approximating power of perceptron network using ReLU activation
    function

    +   - Introduction of the auto-differentiation mechanism used by PyTorch

    +   - Step by step implementation of a convolutional neural network to predict

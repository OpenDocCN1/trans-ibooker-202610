    framework, we would posit that a model with a low test-set error in the real world,
    i.e., good offline generalization, would correspond to a fast converging model
    in the ideal world that quickly reaches a low test set error. Similarly, a model
    that generalizes poorly in the empirical loss would correspond to an online learner
    that converges slowly in the population loss. Let us look at an example of this.


    # ## 5.3.8 Implicit bias in convolutional neural networks


    When comparing a convolutional neural network and its equivalent fully connected
    counterpart in terms of network expressivity, i.e., a fully connected network
    that is capable of representing all functions a convolutional network can represent,
    empirical evidence shows that the convolutional network tends to obtain a lower
    empirical loss and thus generalizes better. A popular explanation is that SGD
    induces an implicit bias in the convolutional network by landing in a flat local
    minimum region instead of a sharp valley when the network starts to interpolate.
    Such a flat region happens to be a generalizable region. This is an important
    perspective on (implicit) regularization using optimization, which we will analyze
    more in a later chapter.


    We can additionally obtain another perspective using the alternate decomposition
    framework. Instead of assessing the (implicit) quality of empirical minima obtained
    using SGD for convolutional and fully connected networks, we can also characterize
    the generalization performance by studying how quickly SGD (explicitly) optimizes
    over the population loss.


    In the following code listing, we build a fully connected network class called
    `LeNet_FC`, which consists of five fully connected layers and contains a total
    of 95,748,510 parameters.'

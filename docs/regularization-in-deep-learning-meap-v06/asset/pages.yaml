    when optimizing using SGD, where the mini-batch loss curves (solid curves) are
    similar in shape to the loss curve using full-batch GD (dashed curve). Based on
    the unbiasedness property of SGD, the full-batch loss curve is the average of
    the four mini-batch loss curves.


    Figure 8.3 Visualizing the loss curves using full-batch GD and mini-batch SGD,
    where the latter curves are similar in shape and close to the former.


    Using these individual mini-batches of the training set, we obtain a good estimate
    of the average loss curve based on the full-batch GD. In other words, each of
    these mini-batch loss curves could tell us something about where the optimal weight
    **w** lies, and the local minima from these mini-batch loss curves are within
    a close neighborhood of **w***. In each round of updates using SGD, we choose
    a random subset and (therefore) direct the next update of the weights based on
    the corresponding mini-batch loss curve. Almost all these mini-batch loss curves
    point us in the same direction using SGD, and there is little variance in terms
    of the update direction; SGD and GD will perform similarly in this situation.


    Let us look at another scenario where the same average loss curve based on full-batch

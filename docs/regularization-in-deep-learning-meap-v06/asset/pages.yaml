    ```

    \(Q(\mathbf{w}) = ||\mathbf{y} - \Phi\mathbf{w}||^2 + \lambda \mathbf{w}^T \Omega
    \mathbf{w} = ||\mathbf{y}_* - \Phi_* \mathbf{w}||^2\)

    ```


    This form looks similar to the original linear regression setting. Setting the
    gradient of \(Q(\mathbf{w})\) to zero gives the following normal equations:


    ```

    \((\Phi_*^T \Phi_*) \mathbf{w} = \Phi_*^T \mathbf{y}_*\)

    ```


    This could be solved using the same procedure as in the previous chapter. Note
    that the new output variable \(\mathbf{y}_*\) contains an additional list of zeros
    compared with \(\mathbf{y}\), thus the right hand side of the equation above is
    still equal to \(\Phi^T \mathbf{y}\). On the left hand side, an additional term
    \(\lambda \Omega\) is added to the original \(\Phi^T \Phi\), resulting in the
    new normal equations as follows:


    ```

    \((\Phi^T \Phi + \lambda \Omega) \mathbf{w} = \Phi^T \mathbf{y}\)

    ```


    Introducing \(\Phi_*\) and \(\mathbf{y}_*\) has multiple benefits in the derivation.
    Besides being more conceptually economical under the typical framework of solving
    least squares problems, it also helps extending to a new geometric view on the
    effect of the penalty term. Compared with \(\Phi\), the augmented design matrix
    \(\Phi_*\) has an enlarged column space that is extended from \(\mathbb{R}^n\)
    to \(\mathbb{R}^{n+p}\). Note that the penalty matrix \(\Omega\) will go through
    a certain transformation, such as eigen-decomposition, to ensure its column vectors
    are mutually orthogonal. Therefore, the lengthened column vectors in \(\Phi_*\)
    will not suffer from collinearity any more, if'

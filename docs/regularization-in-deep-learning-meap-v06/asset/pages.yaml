    +   - When the target label does not belong to the \(k^{th}\) class (i.e., \(y_{i,k}
    = 0\)) and the predicted probability for the \(k^{th}\) class is very weak (i.e.,
    \(p_{i,k} \approx 0\)), the cost should be low.


    To calculate the total cost, we would simply sum individual costs, leading to
    \(Q(\mathbf{w}) = -\sum_{i=1}^N \sum_{k=1}^C y_{i,k} \log(p_{i,k})\). Figure 4.19
    summarizes above discussion on the cross entropy loss.i


    \(Q(\mathbf{w}) = - \sum_{i=1}^N \sum_{k=1}^C y_{i,k} \log(p_{i,k})\)


    | | | |

    |---|---|---|

    | Low | 1 | ≈1 |

    | High | 1 | ≈0 |

    | High | 0 | ≈1 |

    | Low | 0 | ≈0 |


    Figure 4.19 Cross entropy loss and its intuition behind. To calculate the CEL,
    we first calculate the weighted sum between the vector of binary labels and the
    vector of predicted probabilities across all classes for each observation. The
    results of all observations are added together, followed by a minus sign to reverse
    the cost to a positive number. The CEL is designed to match the intuition for
    the cost: the cost would be low when the prediction and the target closely match
    and high otherwise.


    Note that the last two scenarios do not contribute at all to the loss calculation
    since the target value is equal to zero; any value multiplied by zero becomes
    zero. Also, observe that the predicted probabilities of a specific observation
    for these two classes need to add up to one, making it sufficient to only focus
    on the predicted probability of one class (mostly class 1).


    The function to calculate CEL, as defined below, takes in two inputs: the one-hot
    encoded target array and the predicted probability array, both of which have the
    same length as the number of classes.'

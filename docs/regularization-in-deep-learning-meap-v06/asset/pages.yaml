    plugging the input-output pairs in the closed-form solution, which may not always
    be available due to reasons such as matrix singularity.


    Model training essentially means iteratively updating the weight vector following
    a particular algorithm. Such iteration is not necessary when a closed-form solution
    is available since we can directly compute the optimal parameters in one shot.
    In this case, the optimization only involves a one-step calculation. In most cases,
    however, we do not have access to a closed-form solution due to the cost function’s
    highly complex and possibly non-convex structure.



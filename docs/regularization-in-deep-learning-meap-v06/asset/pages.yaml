- pgno: 282
  md: 'the true gradient of the loss function at that particular point. Such movement
    can be characterized by two distinct types of behaviors in the two regions, namely
    the far-out region and the region of confusion.


    When the SGD optimizer is located within the far-out region, i.e., w < L or w
    > U, both the single-observation gradient ∇wQ(w) and the full-batch gradient ∇wQ(w)
    will take the same sign. In other words, SGD will take the same direction of travel
    as GD, and each GD update corresponds to a total of N updates in SGD. The SGD
    will move towards the region of confusion. This explains the good and fast progress
    at the initial training stage, as shown in figure 8.10.


    However, when the SGD optimizer enters the region of confusion, the uniform sign
    is no longer guaranteed. Depending on the specific observation used in gradient
    calculation, the SGD optimizer will instead bounce around within the region of
    confusion due to stochasticity in the direction of travel. This explains the oscillations
    at the later stage of training, also shown previously in figure 8.10.


    Let us do a bit of visualization to put things in perspective. Recall the multiple
    mini-batch loss curves in figure 8.3 and figure 8.4. We can plot a loss curve
    for each example used in SGD, and each loss curve will be U-shaped due to being
    quadratic in w. As shown in figure 8.13, we plot out the upper bound U and lower
    bound L for the region of confusion, as indicated by the two dashed lines. The
    SGD optimizer will make good progress in the two surrounding far-out regions and
    move towards the region of confusion. Upon entering the region of confusion, however,
    the optimizer starts to fluctuate and jumps back and forth, forever. This explains
    why early stopping is a practically useful technique in training neural networks.'

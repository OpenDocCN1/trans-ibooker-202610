- pgno: 60
  md: 'the model. However, this needs to be appropriately calibrated using the validation
    set and assessed using the test set.


    # 2.5.1 Augmented representation via feature engineering


    Since the weight vector **w** only contains two elements corresponding to the
    intercept and slope, the fitted line will struggle to match a potentially nonlinear
    pattern in the data. However, a linear model is still preferred in some cases
    due to its direct explainability: change in the prediction is directly and linearly
    reflected from a change in the input feature. An explainable model can tell us
    what drives the prediction result we are seeing. Such direct interpretability
    is not offered by powerful but black-box models such as neural networks. The model
    is no longer linear in its weights when using neural networks due to the nonlinear
    transformation introduced on the weights (more on this chapter 4). From the model''s
    predictive performance perspective, the nonlinear transformations in neural networks
    tend to land in better and more disentangled representations of the original feature
    space, which is not readily achievable if we are limited to a linear class of
    models.


    However, what if we want to keep the explainability of a linear model but still
    boost its predictive power? A typical approach employs feature engineering, which
    generates an additional set of features based on the original ones. Additional
    features such as higher-degree polynomials could introduce a certain degree of
    curvature to the fitted line. In that case, the model will have the flexibility
    to be more expressive and learn a potentially nonlinear pattern. The more artificial
    features of different degrees of the polynomial we introduce, the more flexible
    the model.


    Polynomial is a form of the **basis function** that can transform the original
    feature into another feature space. In the toy example, we only have one original
    feature in **X**. Adding additional polynomial terms will enlarge the feature
    space, leading to a model prediction based on more than one feature. With more
    polynomial features generated, the model''s predictive power could be potentially
    boosted.


    # 2.5.2 Quadratic basis function


    Since the raw relationship between the input data and the target value in figure
    2.5 looks quadratic, we will use the quadratic basis function to augment the feature
    space. The quadratic basis function transforms the original one-dimensional input
    space into a new space consisting of three basis functions from the zeroth degree
    up to the second degree of polynomial. Note that the zeroth degree corresponds
    to the vector of ones added using the bias trick and plays the intercept role
    in the linear model.


    By introducing the polynomial transformation, the prediction function now becomes
    \(\hat{\mathbf{y}} = \mathbf{\Phi}(\mathbf{X})\mathbf{w}\), where the new design
    matrix becomes \(\mathbf{\Phi}(\mathbf{X}) = [\mathbf{1} \mathbf{x} \mathbf{x}^2]\)

  md: '# 2


    # Generalization: A Classical View


    # This chapter covers


    +   - Step by step implementation of training a linear regression model

    +   - Key mathematical concepts in a typical model training workflow, highlighting
    data, model, cost, and optimization

    +   - The classical view on generalization in statistical modeling and machine
    learning

    +   - A closer look at crucial generalization concepts, including empirical risk
    minimization, bias-variance trade-off, and underfitting versus overfitting


    This chapter examines the typical training process for one of the most fundamental
    models in supervised learning: linear regression, which develops a linear model
    that maps the input features to the output target. By going over the process of
    training a simple linear regression model, we will better understand the different
    training components, including data, model, cost, and optimization. We will cover
    the mathematical intuition in each part, which is essential to understand various
    modeling operations. We will also put these concepts in a proper context to motivate
    their usage, as we believe effective learning starts with understanding the context.
    We will also accompany the math with just enough implementation details to better
    put things in perspective and appreciate both theory and practice at the same
    time. After going over the building blocks, we will introduce the classical view
    on generalization, covering key concepts such as empirical risk minimization and
    bias-variance decomposition. The necessary foundational knowledge in machine learning
    models will help us transition into the modern view on generalization covered
    in the next chapter.


    The main goal of building machine learning models is to emulate and automate a
    specific manual process. Examples include predicting the housing price or forecasting
    future temperature. *Supervised learning* is a type of machine learning tasks
    that focuses on the mapping relationship between the input data and the target
    output created in advance based on manual annotation. Such mapping is achieved
    by learning a mathematical function that'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'specifies the underlying pattern, mapping the input to the output based on
    a set of parameters that govern the mapping function. The specific mathematical
    function represents our _inductive bias_, a prior belief on the properties of
    the function, in the form of a hypothesis. In this process of learning from examples,
    the model parameters are optimized so that the shape of the learned function becomes
    more representative of the real one. A supervised learning model could then take
    in new input data and predict the corresponding output. Instead of explicitly
    programming the mapping rule, the model automatically learns the mapping logic,
    thus being more intelligent than traditional rule-based software engineering practices.
    As long as the proper input and output are provided, we can outsource the whole
    mapping and rule identification task to the supervised learning algorithm, which
    is very useful, especially in the presence of complex processes.


    It is important to note that a model essentially represents a simplifying assumption
    to represent the underlying data generating process. The assumption is often accompanied
    by an _inductive bias_, such as the smoothness of the data generating function:
    one value should smoothly transition to another without sudden jumps. The pre-specified
    inductive bias, when properly used, could introduce a surprising generalization
    effect. The hypothesis on the true function could also come from our prior belief
    about the underlying data generating processes, such as regularities or other
    properties we wish to borrow from similar tasks via the transfer learning framework.


    To better examine the details of model development via supervised learning, we
    will revisit the four components that comprise the model training workflow introduced
    in chapter 1, namely data, model, cost, and optimization. This time, we will introduce
    some mathematical notations to more precisely explain the concepts. Do not worry
    if you are not familiar with linear algebra or multivariate calculus; these will
    be adequately annotated and explained with intuition and examples. Even if you
    are familiar with these concepts, it is a good opportunity to revisit them also.



  md: 'grows exponentially as it is an NP-hard problem. This contrasts our previous
    approach, where we set the gradient to zero and obtained the globally optimal
    solution using convex optimization. Recall that convex optimization seeks the
    global minimum of a convex function, a topic covered in chapter 2.


    How can we obtain a sparse solution while scaling the same approach to large problems
    with high-dimensional datasets? This is where the L1 norm comes in, which allows
    us to achieve a sparse solution in a convex manner and scale to bigger problems
    more efficiently. By penalizing the L1 norm, the model will tend to generate a
    sparse solution by setting some weights to zero.


    # ## 7.3.3 Introducing the L1 norm


    The L1-norm-based linear regression, or LASSO regression, can handle high-dimensional
    problems and implicitly produce a sparse set of weights in a computationally efficient
    way. The L1 norm over the weights is defined as ||w||1 = Σi=12 |wi| = |w1| + |w2|.
    In our running example, by minimizing the RSS of the fit along with the (scaled)
    L1 norm of the weights, the model estimation process will arrive at a unique solution
    (out of infinitely many solutions) that has the minimal L1 norm.


    Let us visualize the estimation process graphically. As shown in figure 7.16,
    the L1 norm is expressed as a diamond, which means that all weights on the same
    diamond share the same value of L1 norm. To see this, let us set the L1 norm to
    an arbitrary constant C, namely |w1| + |w2| = C. Considering the modulus operation
    (taking the absolute value) on the weights, there are a total of four different
    combinations: w1 ≥ 0 & w2 ≥ 0, w1 ≥ 0 & w2 < 0, w1 < 0 & w2 ≥ 0, and w1 < 0 &
    w2 < 0. This gives four different linear equations, namely w1 + w2 = C, w1 – w2
    = C, –w1 + w2 = C and –w1 – w2 = C. Jointly, these four equations (lines) form
    a diamond. All points on the diamond share the same L1 norm. All points on the
    diamond are also referred to as the level set.'

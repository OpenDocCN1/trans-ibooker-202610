    # 8.2.3 SGD: past, present, and future


    SGD has been proposed for more than 70 years. Despite its remarkably simple rule,
    it remains the most widely used optimization procedure in training large neural
    networks. One of the biggest reasons goes to its better generalization performance
    on the test set than other alternatives, and understanding such generalization
    performance from a theoretical perspective is an active area of research. As we
    mentioned earlier, noise, or stochasticity, is typically bad for the optimization
    community but a good thing for generalization in the machine learning community.


    We also discussed the gap in the theoretical analysis of SGD versus its practical
    usage on how data is randomly sampled in a mini-batch. Theoretical analysis sits
    on top of the assumption that each data point is randomly sampled with replacement
    to ensure the i.i.d conditions (independently and identically distributed). However,
    most deep learning toolkits provide procedures to randomly shuffle the entire
    training dataset and divide it into different mini-batches in advance, where the
    samples within these mini-batches stay fixed in later gradient calculations.


    There have also been many revisions to SGD. Other than the popular “improved”
    optimizers like momentum and Adam, techniques such as gradient clipping and weight
    averaging are good tricks to improve the test set performance in most cases. Again,
    understanding the theoretical drivers remains an open research problem. If you
    have managed to reach this junction of the book, chances are you have used SGD
    in previous occasions and are as excited about its mystery and potential as the
    author.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# 8.3 Summary


    +   - SGD provides an implicit regularization effect that helps improving the
    generalization performance of the neural network in the test set

    +   - Both GD and SGD minimize the empirical risk when training a deep neural
    network, with SGD taking on stochasticity in the gradient based on a mini-batch
    (one observation)

    +   - SGD provides an unbiased estimator to GD and enjoys convergence property
    for both convex and nonconvex function approximators at a sublinear rate (under
    certain assumptions on the gradient norm)

    +   - The implicit regularization property allows the SGD optimizer to prefer
    a region with a low variance of the gradient norm; this variance becomes an explicit
    penalty term when viewing SGD mean iterates as a gradient flow

    +   - SGD variants such as momentum and Adam help accelerate optimization but
    hurt generalization compared with vanilla SGD; faster convergence is not preferred
    in nonconvex optimization of deep neural networks

    +   - SGD exhibits fast progress in descending the loss in the far-out zone but
    starts to fluctuate and oscillate once it enters the region of confusion in a
    univariate linear regression setting with provable theoretical analysis

    +   - SGD’s convergence in expectation shows that the expected variance of the
    gradient norm gets smaller as the number of iterations increases

    +   - Theoretical understanding of SGD’s generalization performance remains an
    open problem and an active area of research'

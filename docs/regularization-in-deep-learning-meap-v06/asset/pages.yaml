    # 3.3 Summary


    +   - The "double descent" curve, a widely observed phenomenon in training machine
    learning and deep learning models, subsumes the classical U-shaped curve on bias-variance
    tradeoff

    +   - The twofold descent curve exists as a function of either model complexity
    or training iteration

    +   - The problem of overfitting could be resolved by either increasing the number
    of parameters, which moves into the over-parameterization regime and implicitly
    regularizes the model using stochastic gradient descent, or reducing the model
    capacity by a proper and explicit regularization technique

    +   - The effective model complexity is a recently proposed notion to denote the
    maximum number of samples on which a training procedure achieves close to zero
    training error on average

    +   - More training data may not necessarily boost the model performance due to
    sample non-monotonicity

    +   - The second derivative could be used as a measure of roughness of the fitted
    polynomial model and combined with MSE via a weighting factor to form the overall
    cost'

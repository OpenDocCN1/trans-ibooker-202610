    follow the style of forward propagation, i.e., multiplying in a *forward mode*,
    the sequence of multiplications as separated by the brackets will look like this:


    ```

    \frac{\partial f_L}{\partial \mathbf{w}} = \frac{\partial f_L}{\partial f_{L-1}}
    \left( \frac{\partial f_{L-1}}{\partial f_{L-2}} \left( \frac{\partial f_{L-2}}{\partial
    f_{L-3}} \dots \left( \frac{\partial f_3}{\partial f_2} \left( \frac{\partial
    f_2}{\partial f_1} \frac{\partial f_1}{\partial \mathbf{w}} \right) \right) \dots
    \right) \right).

    ```


    As shown in figure 4.14, the second layer of multiplication, i.e., \frac{\partial
    f_2}{\partial f_1} \frac{\partial f_1}{\partial \mathbf{w}}, would continue and
    result in a matrix of shape $p3 \times p0$ and incur a total of $p3p2p0$ operations.
    This process of multiplying with the outer layer matrix continue until reaching
    the last layer. The total number of operations involved, which is an indicator
    of the computational cost in forward-mode multiplication, would thus become:


    ```

    p_2 p_1 p_0 + p_3 p_2 p_0 + \dots + p_L p_{L-1} p_0 = p_0 \sum_{l=2}^L p_l p_{l-1}.

    ```



    Setting a reasonable learning rate is both art and science. It is usually one
    of the top hyper-parameters tuned in deep neural networks. A more dynamic tuning
    schedule for the learning rate could be in between: setting a relatively large
    learning rate at the initial training stage for faster convergence and gradually
    reducing it as the training reaches convergence. Besides, a large initial learning
    rate also has an implicit regularization effect. We will explore more on this

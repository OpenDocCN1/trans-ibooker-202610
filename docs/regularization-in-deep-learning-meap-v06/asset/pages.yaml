  md: '# # Regularization via Optimization


    # ## This chapter covers


    +   - The implicit regularization effect of SGD and recent theoretical analysis
    using mean iterates of SGD gradient flow

    +   - SGD convergence in expectation

    +   - Popular SGD variants such as momentum and Adam which do not necessarily
    generalize better than vanilla SGD

    +   - Theoretical analysis of SGD’s convergence behavior in a univariate linear
    regression setting


    The regularization techniques we have covered so far, including regularization
    via data, model, and objective function, involve additional treatments to the
    model training process in order to achieve a regularization effect. For example,
    we can regularize an overfit model by augmenting the training data, adding a dropout
    layer to the neural network, or penalizing the magnitude of the weights in the
    objective function. However, the optimization algorithm, the last component in
    the model training process and the topic of this chapter, can introduce an implicit
    regularization effect without any additional treatment. In other words, we reap
    the benefit of regularization while optimizing the model as usual.


    The specific optimization algorithm that can simultaneously optimize and (implicitly)
    regularize a neural network model is stochastic gradient descent (SGD), an ancient
    yet the most widely used algorithm for training large-scale deep neural networks.
    We have encountered SGD quite a few times in the previous chapters, using this
    specific algorithm to optimize several neural networks. This chapter will examine
    its implicit regularization behavior by analyzing its theoretical properties and
    empirical performances. Our understanding of its contribution to generalization
    is still growing, as shown by recent research papers in this field. We hope to
    bring some of the latest findings about its regularizing attribute in this chapter.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# 8.1 Stochastic optimization


    Generalization in deep learning is a unique and mysterious cuisine with multiple
    ingredients, with stochastic optimization serving as a major ingredient. Compared
    with deterministic optimization, stochastic optimization highlights the stochasticity
    component during the optimization process. Such stochasticity, or noise, may not
    necessarily be a bad thing. In fact, the stochastic behavior could often drive
    the optimizer toward a better solution compared with a deterministic optimizer,
    as shown by models trained using SGD versus full batch gradient descent algorithm.


    Let us revisit the empirical risk minimization framework and analyze the gradient
    descent family of algorithms in this context.


    # 8.1.1 Empirical risk minimization via gradient descent


    Our journey in training deep neural networks boils down to an optimization problem:
    locating the solution in the parameter space that delivers the best generalization
    performance. Mathematically, for the loss function Q(w, D) that returns the loss
    given the current weight w and training dataset D, our objective is to find its
    (global, hopefully) minimum:


    ```

    min_w Q(w, D) = min_w \sum_{i=1}^n Q_i(w, D_i)

    ```


    Where the loss function is a sum of all individual losses, a finite sum problem.
    When n : , we have a stochastic optimization problem.


    Now recall the formulation of the gradient descent update algorithm covered in
    chapter 2, also shown here for ease of reference. In the following equation on
    one iteration of gradient descent update, we obtain the weight value of the next
    iterate w_t+1 based on the current weight w_t, the gradient vector of partial
    derivatives ∇_w Q(w_t, D) (calculated by differentiating the current loss with
    respect to the weight), and a small learning rate ''.


    ```

    w_{t+1} = w_t - \eta \nabla_w Q(w_t, D)

    ```


    Here, Q(w_t, D) is our empirical loss function based on the training dataset D
    and current weight vector w_t. For now, we assume it is the direct loss term,
    such as the mean squared error (MSE), although it can include additional regularity
    terms, such as the L1 or L2 norm of the weights. The negative sign here suggests
    that w_t is moving toward the direction of the fastest descent of the loss function.
    We would then keep iterating the gradient descent update until this process converges
    (indicated by a minimal change in w_t) or the performance metric (i.e., MSE) on
    the holdout validation set (which approximates the unseen test set) no longer
    decreases.


    Let us talk about the challenges of this gradient descent update. First, we need
    to use all observations in the training set D and sum up individual losses to
    obtain the total loss Q(w_t, D). When the number of observations in the training
    set becomes large, iterating through all the observations to calculate the individual
    loss would be time-consuming. Second, it is challenging to calculate Q(w_t, D)
    on a GPU instance with limited memory since we would need to fit all the data
    in the GPU memory to calculate the total loss and perform back-'

    also contributes to translational invariance in CNN.


    To achieve these desired properties, we need to constrain the connections in the
    FCN in a way that facilitates the network to learn local structures and pick up
    invariance properties. Specifically, we would like to embed relational inductive
    biases specific to different types of layers in a neural network. On the one hand,
    we exploit the locality of geometric objects in the input data so that the resulting
    CNN model is invariant to spatial translations. On the other hand, the sequentiality
    of objects (e.g., tokens in natural language processing, observations in a time
    series) is exploited in a recurrent neural network (RNN) so that the resulting
    model is invariant to temporal translations.



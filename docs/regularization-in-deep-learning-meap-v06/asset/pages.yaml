    is equal to the number of observations. The perfect interpolation continues with
    p > n when the system of equations becomes underdetermined and over-parameterized,
    leading to infinitely many solutions that correspond to models of arbitrary shape.
    All these models pass through the observed data points and thus give zero training
    error.


    Therefore, if we stretch the graph towards the right, i.e., keep increasing the
    model complexity, the training risk will continue to remain zero beyond the perfect
    interpolation point. What about the test risk? According to the classical view
    on generalization, the test risk will continue to shoot up when the model becomes
    even more complex. However, what is observed in practice is the "double descent"
    phenomenon on the test risk shown in figure 3.3, where the test risk starts to
    drop at some point even below the best risk obtained at the "sweet spot".'

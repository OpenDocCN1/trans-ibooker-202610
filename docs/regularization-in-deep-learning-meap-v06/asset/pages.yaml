    # ## 4.3 Training a simple CNN using MNIST


    Now let us look at some practical examples to appreciate the actual training process
    in codes. We will train an image classifier using the MNIST dataset. The MNIST
    dataset (Modified National Institute of Standards and Technology database) is
    a database of handwritten digits widely used for experimenting, prototyping, and
    benchmarking machine learning and deep learning models. It consists of 60,000
    training images and 10,000 testing images which are normalized and center-cropped.
    They can be accessed via the `torch.datasets` class without separate downloading.


    **torch, torchvision and torchtext**


    The `torch` package consists of all the core classes and methods needed to implement
    neural networks of various architectures. `torchvision` is a supporting package
    that provides popular datasets, model architectures, and image transformation
    pipelines standard in computer vision tasks. `torchtext`, as the name suggests,
    is a package that provides utility functions for natural language processing tasks.


    This example will cover the step-by-step implementation of training a simple CNN
    model using MNIST. We will start with data loading and preprocessing using the
    `datasets` and `dataloader` subclass in PyTorch `torchvision` package. Using these
    utility functions could significantly accelerate the model development process
    since it offers consistent handling and preprocessing of the input data. Then,
    we will define the model architecture, the cost, and the optimization function.
    Finally, we will train the model using the training set and test its predictive
    performance using the test set.



  md: 'rows from the penalty term: $\Phi_* = \binom{*}{\lambda \mathbf{B}}$, where
    $\mathbf{B}^T\mathbf{B} = \Omega$. Since $\Omega$ is a \( p \times p \) symmetric
    (square) matrix, this step essentially concatenates an additional \( p \) rows
    to $\Phi$. Note that since \(\lambda\) is a positive constant, it is fine to scale
    $\Omega$ by \(\sqrt{\lambda}\).


    Similarly, the output vector \(\mathbf{y}\) is also extended with \( p \) zeros
    at the end, forming a new output variable \(\mathbf{y}_* = \binom{\mathbf{y}}{\mathbf{0}}\).
    Based on the original normal equations \(\Phi\mathbf{w} = \mathbf{y}\), we can
    construct a new set of normal equations: \(\Phi_*\mathbf{w} = \mathbf{y}_* = \binom{\mathbf{y}}{\mathbf{0}}\).
    We can then multiply both sides by \(\Phi_*^T\) and continue the derivation process:


    ```

    \(\Phi_*^T\Phi_*\mathbf{w} = \Phi_*^T \binom{\mathbf{y}}{\mathbf{0}}\)


    \((\Phi^T \sqrt{\lambda} \mathbf{B}^T) \begin{pmatrix} \Phi \\ \sqrt{\lambda}
    \mathbf{B} \end{pmatrix} \mathbf{w} = (\Phi^T \sqrt{\lambda} \mathbf{B}^T) \binom{\mathbf{y}}{\mathbf{0}}\)


    \((\Phi^T \Phi + \lambda \mathbf{B}^T \mathbf{B}) \mathbf{w} = (\Phi^T \sqrt{\lambda}
    \mathbf{B}^T) \binom{\mathbf{y}}{\mathbf{0}}\)


    \((\Phi^T \Phi + \lambda \Omega) \mathbf{w} = \Phi^T \mathbf{y}\)


    \n$$\\mathbb{E}[\\|\\nabla Q(\\mathbf{w}_t)\\|^2] \\le \\frac{1}{\\eta_t}\\mathbb{E}[Q(\\\
    mathbf{w}_t) - Q(\\mathbf{w}_{t+1})] + \\frac{L}{2}\\eta_t G^2$$\n\nNow we choose\
    \ $\\eta_t=c/\\sqrt{T}$ so that the learning rate decrease as the total number\

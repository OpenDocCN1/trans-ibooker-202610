    ```


    Figure 2.22 Decomposing the risk into the irreducible part, i.e. the variance
    of the error term, and the reducible part, i.e. the squared bias and variance
    of the model. Note that the trick of adding and subtracting an additional term
    while expanding the squares is used twice in the derivation.


    The above derivation has used the fact that [g] = g as g is deterministic and
    non-random, along with E[y] = f and [\epsilon] = 0, where y is the observed targeted
    for x_new. In addition, E[f y] = E[f] E[y] = E[f] E[g + \epsilon] = E[f] (E[g]
    + E[\epsilon]) = g E[f].


    Minimizing the risk essentially boils down to reducing one or more of the three
    sources of error. Since random noise is not something we can control, it is an
    irreducible source of error. Bias and variance, however, are reducible elements
    controlled by the training procedure. A simple model tends to have a high bias
    and low variance, while a complex model is typically associated with low bias
    and high variance. This corresponds to the classical statistical view on bias
    and variance tradeoff: we can only strive to reduce one at a specific cost of
    the other. This tradeoff essentially limits a model’s capability to generalize
    to the future test set by minimizing the two sources of error simultaneously.
    These three sources of error also jointly form a lower bound on the expected error
    for a future unseen dataset.


    However, as we will learn in later chapters, over-parameterized models such as
    smoothing spline and neural networks can continue lowering the variance even when
    the bias is zero, which seems to contradict the statistical view.'

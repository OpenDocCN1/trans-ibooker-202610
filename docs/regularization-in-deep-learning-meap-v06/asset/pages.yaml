    cost derived earlier suggest that the forward mode relies on the constant multiplier
    p_0 and the backward mode relies on p_L. In a typical model training process,
    a scalar cost is often selected as the performance metric based on the current
    model''s prediction. The single-valued cost indicates that p_L = 1. On the other

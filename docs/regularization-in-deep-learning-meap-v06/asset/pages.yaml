  md: '# 7.2.1 Using the analytic solution


    To facilitate working with matrix notations and combine like terms, let us introduce
    an identity matrix to the second term, giving \(\nabla Q(w) = 2\Phi^T(y - \Phi
    w) + 2\lambda Iw\). The identity matrix is a special type of matrix that is square
    and has a value of one on the main diagonal and a value of zero elsewhere. It
    has a few useful properties. For example, for an arbitrary matrix A of size \(n
    \times m\), we have an \(n \times n\) identity matrix \(I_n\) that gives \(IA
    = A\). When \(m = 1\), we have \(Iw = w\), which is the change in the second term.
    Setting \(\nabla Q(w^*) = 0\) gives \(2\Phi^T(y - \Phi w^*) + 2\lambda Iw^* =
    0\), which further simplifies to \((\Phi^T\Phi + \lambda I)w^* = \Phi^T y\). Now,
    we can pre-multiply both sides by \((\Phi^T\Phi + \lambda I)^{-1}\) to get the
    ridge estimator \(w^{ridge} = w^* = (\Phi^T\Phi + \lambda I)^{-1}\Phi^T y\). Figure
    7.5 summarizes this derivation process.


    ![](img/ee98e91e6845f41077b163bec833ee40_228_0.png)


    Figure 7.5 Deriving the closed-form solution of the ridge estimator in linear
    regression.


    Now, let us analyze this closed-form solution and verify if it makes sense intuitively.
    When setting \(\lambda = 0\), we have \(w^{ridge} = (\Phi^T\Phi)^{-1}\Phi^T y
    = w^{LS}\), which is the same as the un-penalized least squares estimator. In
    this case, the model tends to overfit and end up with a large magnitude in the
    resulting weights. When setting \(\lambda = \infty\), we have \(w^{ridge} = 0\)
    since the solution involves dividing an infinitely big number for each weight.
    In this case, the model is over simplistic and just a straight line, exhibiting
    a severe underfitting phenomenon. In practice, \(\lambda\) is a positive number
    determined via cross-validation or other model selection techniques based on the
    input dataset at hand.


    When contrasting with the closed-form solution of least squares, the net impact
    is the additional term \(\lambda I\) added to \(\Phi^T\Phi\) before taking its
    inverse. An underlying assumption when calculating \((\Phi^T\Phi)^{-1}\) is that
    the number of linearly independent observations \(n\) is bigger than the number
    of (again, linearly independent) features \(d\) in the design matrix \(\Phi\).
    Here, linear'

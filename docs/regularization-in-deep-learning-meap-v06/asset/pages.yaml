    So far, we have been dealing with the approximating power of the model to the
    true underlying function by adding more features and controlling the model complexity.
    For example, in the previous chapter, we learned that the polynomial function’s
    approximation capacity increases when more higher-degree polynomial terms are
    present. Such model fitting process essentially amounts to functional approximation,
    where we approximate a complex function using a combination of simpler ones. Our
    goal is thus to build a good machine learning model that is expressive enough
    to approximate the true underlying function.


    In general, adding more parameters can lead to over-parameterization, a situation
    often avoided in the classical regime but somehow encouraged in the modern interpolation
    regime. For the case of neural networks, it is interesting to look at what underlying
    functions could be modeled and approximated. On this front, the universal approximation
    theorem, originally established in the paper “Multilayer Feedforward Networks
    are Universal Approximators” by'

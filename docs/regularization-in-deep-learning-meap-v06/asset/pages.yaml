  md: '# 6.1.4 Weight sharing in the convolution operation


    Consider a 2x2 kernel matrix used to convolve with a 4x4 input matrix using no
    padding (also called *valid padding*) and a stride of 2. Using such parameterization,
    the kernel will convolve with four input patches, which are mutually exclusive
    and collectively exhaustive of the full input matrix. See figure 6.8 for an illustration.


    ![](img/ee98e91e6845f41077b163bec833ee40_188_0.png)


    Figure 6.8 Convolving a 2x2 kernel with a 4x4 input matrix using no padding and
    a stride of 2. The four input patches are color-coded and labeled by the multiplication
    between the corresponding weights and inputs for clarity. The output is a 2x2
    feature map, where we show the result of summing the element-wise multiplication
    between the kernel and the input patch for the top left cell.


    In this figure, we have explicitly labeled the input matrix with the corresponding
    weights to be multiplied with. All input patches convolve with the *same* kernel
    matrix, whose weights are shared across the corresponding input entries. For example,
    w<sub>1</sub> is shared across the upper-left entries of all four input patches.
    Instead of paring each input entry with the respective unique weight as in FCN,
    the convolution operation shares weights across multiple input entries.


    Let us visualize the weight-sharing mechanism in the context of FCN. In figure
    6.9, we draw the same convolution operation as in figure 6.9, although using a
    flattened feed-forward fashion as in FCN. Note that the conversion in this figure
    contains quite some information that needs to be unpacked. First, we color-code
    the four input patches in the input matrix, which corresponds to the four features
    (of the same color) in the output feature map. Next, we flatten all these components
    (input layer, kernel, and output layer) in a feed-forward manner as in a typical
    FCN. For the input matrix, each entry is sequentially mapped to the corresponding
    node in the input layer, starting from left to right, from top to bottom. For
    example, the upper-left entry is mapped to the first input node, as shown by the
    dash-dotted line in the figure. The same positional mapping applies to the output
    layer. Finally, the kernel manifests as connecting lines representing the weights
    of the network. Each weight assumes a different type of line for differentiation,
    avoiding the already congested color space.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '![](img/ee98e91e6845f41077b163bec833ee40_189_0.png)



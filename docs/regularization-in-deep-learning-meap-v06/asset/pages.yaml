  md: 'Since SGD converges relatively slowly due to the stochastic noise, a natural
    question is if we can do something to suppress such stochasticity and (expectedly)
    accelerate its convergence. This question brings a series of SGD variants, with
    momentum and Adam being the most popular choices of optimizers in the community.


    # 8.1.5 SGD variants: better or worse?


    We have used the Adam optimizer to train a multi-class model in chapter 6. We
    also mentioned in chapter 2 that it could accelerate learning but may only sometimes
    result in good generalization performance. Should we stick to either Adam or SGD
    when training a deep neural network? Not necessarily. Many practitioners start
    the training process using Adam as it is less sensitive to the choice of the learning
    rate (more on this later) and switch to SGD after a while to gain good generalization
    performance. Combining a short-term myopic reward (as in the case of Adam) with
    a long-term non-myopic gain (as in the case of SGD) is a popular choice in the
    design of many policies, such as in the field of reinforcement learning and Bayesian
    optimization.


    As a variate of SGD, Adam sits on two key aspects: smoothed updates using momentum
    and scaled learning rate using gradient norm. Let us illustrate the idea of momentum
    as a start. Imagine we are dealing with a two-dimensional parameter space where
    the loss function to be minimized is narrow, as shown by the elongated ellipses
    (level sets) in figure 8.8. Imagine the optimizer seeking a narrow valley’s trough
    (local minimum) (loss function). Due to a sharp slope along the direction perpendicular
    to the path toward the local minimum, the partial derivatives at the current location,
    as indicated by the solid dot, are very different in magnitude. Specifically,
    the partial derivative g2 will be much larger than g1 on the left panel, leading
    to oscillations across each update given a high learning rate and likely divergence
    from the local optimum.


    Figure 8.8 SGD updates with oscillating trajectories due to unproportionate partial
    derivatives and a high learning rate on the left, and slow progress due to a small
    learning rate on the right.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'On the other hand, decreasing the learning rate to a very small number eases
    the oscillations to some extent but, instead, leads to slow convergence; SGD will
    take a very long time to show decent progress toward the local minimum. In both
    cases, the actual convergence performance is highly sensitive to the learning
    rate hyperparameter.


    One of the early approaches to tackle this problem is called momentum, which uses
    the moving average of the gradient in each SGD update and thus alleviates the
    high-variance problem in the gradients of SGD. Denote the original gradient vector
    as gt = ∇wQ(w, Dt) and its moving average as mt. The current moving average mt
    is calculated based on the following relationship:


    mt = β1 · mt−1 + (1 − β1)gt


    Where β1 is a hyperparameter that controls the weighting between the previous
    moving average and the current gradient, element-wise. The corresponding SGD update
    rule with a running average of gradients thus becomes:


    wt+1 = wt − ηmt


    Running the iterative updates using the averaged gradients will smooth out the
    trajectories since gradients of opposite directions will cancel out due to the
    averaging effect. Momentum thus smooths the stochasticity along the directions
    perpendicular toward the local minimum.


    As a further improvement, the Adam optimizer uses an adaptive step size to estimate
    the norm of the gradients. As shown in the left panel of figure 8.8, the optimizer
    tends to move more in the direction of g2 since it is much larger than g1. The
    goal of Adam is thus to rescale the norm of the gradients so that each partial
    derivative in the gradient vector has a similar scale. Specifically, the running
    average of the gradient norm vector vt is defined as the following:


    vt = β2vt−1 + (1−β2)gt²


    Where gt² means squaring each element (partial derivative) in the gradient vector
    gt, and β2 is another preset hyperparameter. Once we have the mean gradient and
    its moving average norm, we can use the following update rule to choose the next
    weight value:


    wt+1 = wt − η * mt / sqrt(vt + ε)


    Where we take the square root of vt: to convert it to the same unit as the weights
    and use a small constant ε to avoid dividing by zero. The adaptive step size is
    indicated by η/(√(vt) + ε), where the new learning rate is different to each parameter
    instead of having a uniform learning rate for all the parameters; after all, some
    parameters tend to be more sensitive to a high learning rate than others. Figure
    8.9 summarizes these two adaptive changes over SGD.'

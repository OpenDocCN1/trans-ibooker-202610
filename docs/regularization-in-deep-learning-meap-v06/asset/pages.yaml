    Since SGD requires w_{t+1} = w_t - \nabla_w Q(w_t, D_t), we have w_{t+1} - w_t
    = - \nabla_w Q(w_t, D_t). Plugging back to the previous equation gives the following:


    Q(w_{t+1}, D) \approx Q(w_t, D) - \eta \nabla_w Q(w_t, D_t) \nabla_w Q(w_t, D)


    As we are interested in the average-case behavior of SGD updates, we apply the

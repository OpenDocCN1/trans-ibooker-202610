    \ - Q(\\mathbf{w}_{t+1})] + \\frac{L}{2}\\frac{c}{\\sqrt{T}}G^2$$\n\nNote that\
    \ the term on the left hand side represents the variance of the gradient norm.\n\
    \nWe can add the previous inequalities from $t=1$ to $t=T$ on both sides, giving:\n\
    \n$$\\sum_{t=1}^T \\mathbb{E}[\\|\\nabla Q(\\mathbf{w}_t)\\|^2] \\le \\frac{\\\
    sqrt{T}}{c}\\mathbb{E}[Q(\\mathbf{w}_1) - Q(\\mathbf{w}_{T+1})] + \\frac{LC\\\
    sqrt{T}}{2}G^2\\\\\n \\le \\frac{\\sqrt{T}}{c}(Q(\\mathbf{w}_1) - Q^*(\\mathbf{w}))\
    \ + \\frac{LC\\sqrt{T}}{2}G^2$$\n\nWhere the second inequality follows as $Q^*(\\\
    mathbf{w})$ represents the (constant) global minimum and thus the expectation\
    \ operator is removed.\n\nLastly, we divide both sides by $T$ to get the average\
    \ behavior of the variance of the gradient norm:\n\n$$\\frac{1}{T} \\sum_{t=1}^T\
    \ \\mathbb{E}[\\|\\nabla Q(\\mathbf{w}_t)\\|^2] \\le \\frac{1}{c\\sqrt{T}}(Q(\\\
    mathbf{w}_1) - Q^*(\\mathbf{w})) + \\frac{Lc}{2\\sqrt{T}}G^2 = \\frac{1}{\\sqrt{T}}\\\
    left(\\frac{Q(\\mathbf{w}_1) - Q^*(\\mathbf{w})}{c} + \\frac{Lc}{2}G^2\\right)\\\
    \\\n = \\frac{C}{\\sqrt{T}}$$\n\nWhere we use $C$ to lump together the constants\
    \ on the right-hand side.\n\nIn essence, we have proved that the variance of the\
    \ gradient norm decreases on average as the number of SGD iterations increases.\
    \ This means that the SGD trajectory will become more stable and less volatile\
    \ as iteration proceeds, all the way until reaching a steady state, which we call\
    \ convergence, at a sublinear rate of $1/\\sqrt{T}$. Figure 8.14 summarizes the\

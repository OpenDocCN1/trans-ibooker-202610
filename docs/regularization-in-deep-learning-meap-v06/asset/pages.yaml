    As it turns out, a fully-connected network (FCN) has very little inductive bias
    in terms of how data flows between layers. When the input features go into a fully-connected
    network, we place little assumption on how they should interact with the weights
    other than a multiplication operation that traverses all elements. This leads
    to its flexible and expressive design and approximating capability, which is also
    backed by the universal approximation theorem introduced in chapter 4; by extending
    the number of nodes in the hidden layers to an arbitrary extent, a fully-connected
    neural network could approximate functions of any shape.


    However, there are still some inductive biases we placed when designing the model
    architecture of a typical neural network in terms of its structure and optimization.
    Architecturally, the nodes within the same layer are assumed never to interact
    with each other. The feature maps in the hidden layers contain standalone features
    that only engage in the forward and backward propagations but never talk to their
    neighbors in the same hidden layer. Besides, a typical neural network takes the
    form of a directed acyclic graph, such as the one in figure 6.3, where inputs
    are processed from left to right until reaching the final layer for cost calculation.
    These architectural preferences constitute our implicit inductive bias in many
    types of neural networks used in day-to-day development.


    From an optimization perspective, gradient descent has become the de facto optimization
    method when training a neural network, exhibiting an inductive bias for models
    that are easily trainable by gradient-based methods. In particular, the stochastic
    (mini-batch) gradient descent algorithm is a popular choice due to its simple
    and fast training time as well as the implicit regularization effect, inducing
    models that exhibit robustness in the location of optima across different batches
    (more on this in a later chapter on regularization via'

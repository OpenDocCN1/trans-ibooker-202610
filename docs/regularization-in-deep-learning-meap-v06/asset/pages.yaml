    of a higher degree. For example, if we are going to learn a model of the form
    $f(x) = w_0 + w_1x + w_2x^2 + w_3x^3$, an inductive bias that favors a linear
    straight-line fit in the face of extremely limited training set would allow us
    to set $w_2 = w_3 = 0$ directly. In other words, we specify a linear model in
    our design in the first place.


    In addition to the assumption on the functional form of the model, a linear model
    also assumes normality on the errors. That is, the resulting errors from the linear
    regression fit are normally distributed with a zero mean and constant variance.
    Such assumption allows the linear regression model to be optimal, in the sense
    that it is provably unbiased of minimum variance.


    Inductive bias also plays an important role in _Bayesian inference_, a particular
    field in statistics that studies the posterior distribution of a given parameter
    of interest based on a prior distribution and observed likelihood of the data.
    If we were to estimate a parameter $w$, Bayesian statistics put a distribution
    to $w$ as a form of probabilistic belief about its likely'

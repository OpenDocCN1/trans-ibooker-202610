    Figure 4.21 Illustrating the two types of global minima. On the left shows a sharp
    valley where the error curve changes drastically upon reaching the bottom of the
    valley. On the right shows a set of equally good global minima along a flat basin
    where the error changes slowly.


    These two distinct error profiles are commonly encountered in many deep learning
    problems. The overall recommendation is to train models that reach the flat area
    with many equally good global minima or basin of attraction. They tend to be more
    regularized and generalize better to the unseen test set (see figure 4.22). Despite
    similar error in the training set, as represented by zero misclassification rate
    due to multiple global minima, the corresponding test error may vary depending
    on the specific solution zone. Specifically, a wide and flat area has a lower
    test error than the one obtained at the sharp zone. One particular approach brought
    up recently is stochastic weight averaging, which averages a few “sharp” solution
    weights to arrive at a final “flat” solution within the basin zone. This technique
    belongs to ensemble learning, where multiple versions of models are used to generate
    the final prediction. We will cover a specific ensembling technique called bootstrap
    in a later section on regularization via data.'

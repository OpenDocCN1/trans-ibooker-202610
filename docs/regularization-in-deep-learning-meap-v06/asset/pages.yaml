    \ iteration. The cost function then takes the prediction and the target label\
    \ to calculate a cost. The optimization step derives the gradient of the cost\
    \ for each weight and updates all the weights using the gradient descent type\
    \ of algorithm. This process repeats until convergence, i.e., the weights or cost\
    \ remain largely the same and do not change much as the training iteration proceeds.\n\

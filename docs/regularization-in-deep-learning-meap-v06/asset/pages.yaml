    Out of infinitely many solutions on the straight line, we are interested in the
    unique solution that produces the minimal L1 norm: the point on the straight line
    with the minimal diamond size. This solution is represented by the bolded dot
    on the figure, which also happens to be a sparse solution (w1 = 0). This is not
    coincident; the LASSO penalty introduces an additional preference over sparse
    solutions. Therefore, the L1 norm promotes sparse solutions for the under-determined
    system, especially in a high-dimensional setting with many more free parameters
    than observations.


    # 7.3.4 Understanding LASSO


    LASSO regression produces a sparse solution and an interpretable model that is
    less likely to overfit. Robert Tibshirani introduced it in 1996 in his paper titled
    “Regression Shrinkage and Selection via the Lasso”. Since then, the LASSO penalty
    has taken off and seen wide applications in many domains that require an interpretable
    model. Interpretability is an important consideration in the adoption of a functioning
    model. When trying to understand the decision-making process of a model, we often
    prefer a less complex model with a relatively small number of factors to help
    explain the logic and trace the information flow. This is one of the main reasons
    behind its popularity.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'Note that LASSO regression applies to both under-determined and over-determined
    problems. An under-determined problem refers to the case when there are more free
    variables (thus weights) than observations when solving a system of linear equations,
    and an over-determined system is the opposite: more observations than variables.
    In both cases, we may wish to obtain a sparse solution with minimal selected features
    yet maintain good predictive accuracy.


    When dealing with high-dimensional problems, optimizing using the least squares
    essentially assumes that all factors are important and, thus, should remain in
    the final model. When using LASSO, we lift this assumption by keeping only a subset
    of the original features, assuming that not all variables are relevant. Minimizing
    the L1 norm of the weights promotes sparsity by highlighting only a few entries
    in the weight vector besides generating a good fit. For example, suppose we have
    one model with 50 features and another with 5 features, both of which have the
    same level of predictive accuracy. We would definitely prefer the second model
    as it is more interpretable and communicable. Building on the principle of parsimony,
    we would go with the simplest model that decently describes our data. A sparse
    model is also more robust as it is less likely to overfit the data.


    The hyperparameter lambda controls the sparsity level when minimizing the regularized
    objective function Q(w) = RSS(w) + λ||w||1. When λ = 0, it recovers the least
    squares solution that gives the best linear fit to the training data but is likely
    to overfit the test data. When λ is pretty big, the model is over-parsimonious
    and performs badly in both training and test set. Selecting a proper λ is often
    performed using cross-validation, where a validation set is used to serve as the
    test set and approximate the generalization error of the model. As shown in figure
    7.17, when plotting out the training and validation set error (i.e., MSE) across
    a sequence of λ, and each λ often corresponds to several folds of validation (called
    K-fold cross-validation), the λ value with the lowest validation error is selected.
    Note that the optimal λ selected using the cross-validation procedure tends to
    produce a less sparse solution than the optimal choice for a sparse solution as
    the former focuses more on predictive accuracy. Also, note that the x-axis uses
    the inverse of λ so that the left end indicates a large λ and the right end indicates
    a small (all the way to zero) λ.'
  merge: -1
  img_proc: true

    Note that not all estimators are unbiased. In fact, we rarely manage to have an
    unbiased estimator when using complex learners such as neural networks. However,
    things still work out quite nicely in practice. When the optimizer struggles due
    to high variance, we could improve such a situation by introducing a little bit
    of bias while greatly easing the high-variance issue, a topic on bias-variance
    tradeoff covered in chapter 2. There are many examples where we can obtain a good
    model using biased but lower-variance estimators, such as adding the LASSO penalty
    to the loss function covered in chapter 7. Note that having a biased estimator
    may not converge to a stationary point in a limited training time.


    Now that we know SGD is a computationally economical algorithm that converges
    to a local minimum, the next question we would like to ask is how good the quality
    of the solution is. Is it the same quality as the one from the full-batch gradient
    descent algorithm, or better? As it turns out, SGD often delivers better solutions
    than GD because the resulting model generalizes better to the future unseen test
    set. Such generalization performance comes from the implicit regularization effect
    from SGD, as discussed in the following section.'

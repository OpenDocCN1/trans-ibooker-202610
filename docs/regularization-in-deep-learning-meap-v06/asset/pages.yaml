- pgno: 50
  md: 'could be calculated by summing the squared errors \(Q(w_0, w_1) = \sum_{i=1}^n
    (y_i - w_0 - w_1 x_i)^2\). We then calculate the gradient of the cost function
    with respect to each parameter \(w_0\) and \(w_1\) and use the gradients for iterative
    update. Figure 2.13 summarizes the derivation process for univariate linear regression.


    Current weights \(\mathbf{w}^\top = [w_0, w_1]\)


    Randomly initialized model weights


    \(\hat{y}_i = w_0 + w_1 x_i, i = 1, \dots n\)


    Calculate the model prediction for each observation


    \(Q(w_0, w_1) = \sum_{i=1}^n (y_i - w_0 - w_1 x_i)^2\)


    Calculate the current cost


    \(\frac{\partial Q(w_0, w_1)}{\partial w_0} = \sum_{i=1}^n (-2)(y_i - w_0 - w_1
    x_i)\)

    \(\frac{\partial Q(w_0, w_1)}{\partial w_1} = \sum_{i=1}^n (-2x_i)(y_i - w_0 -
    w_1 x_i)\)


    Derive the partial derivative of the cost function with respect to each weight


    \(w_0 \leftarrow w_0 - \eta \frac{\partial Q(w_0, w_1)}{\partial w_0}\)

    \(w_1 \leftarrow w_1 - \eta \frac{\partial Q(w_0, w_1)}{\partial w_1}\)


    Perform the gradient descent update


    # Figure 2.13 Deriving the system of equations for updating model parameters using
    the gradient descent algorithm in linear regression.


    At a high level, each set of weights corresponds to a particular cost, and gradient
    descent algorithm works by iteratively adjusting the weights in search of a minimal
    cost. In linear regression, such relationship could be plotted as a 3D mountain,
    where the x-axis and y-axis represent the weights \(w_0\) and \(w_1\) respectively,
    and the z-axis shows the cost as the height of the mountain. The gradient descent
    algorithm essentially changes the weights to descend the cost to the valley of
    the mountain. We can visualize the hill using a contour plot, where a circle suggests
    that all points along the circle have an equal cost. Our goal is thus to adjust
    the current weights in the direction along the steepest descent towards the center
    point, i.e., the stationary point with the lowest cost in the region.


    The code listing below first creates a list of candidate values for both \(w_0\)
    and \(w_1\), followed by calculating the cost for each unique combination of parameters,
    as well as the partial derivatives at the initial starting point.'

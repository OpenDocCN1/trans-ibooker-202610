    # ## 5.3.4 Constructing the ideal world with CIFAR-5m


    How could we construct the ideal world with infinite data feed? Recall that the
    earlier example used 10,000 training images from the CIFAR10 dataset and trained
    for 100 epochs, totalling 5 million images used for training, along with 10,000
    images allocated for the test set. If we were to simulate an ideal world while
    maintaining the same training-test ratio, it would require a total of 5 million
    different images for training and 1 million different images for testing. These
    5 million images will serve as the fresh samples for the model to learn in the
    ideal world in one epoch.


    To this end, the authors in the paper constructed a synthetic CIFAR10-like dataset
    called CIFAR-5m that contains 6 million images in total. The dataset is produced
    by sampling from the CIFAR10 dataset using a generative model and is released
    at `gs://gresearch/cifar5m/part{i}.npz` for `i` in `(0,..,5)`, with each file
    occupying around 3GB disk space; we are now living in the big data regime. These
    files are downloaded via the `gsutil` command to the current directory of the

    \ points, however, may not be unique. Depending on the shape of the cost function,\
    \ there may exist multiple stationary points with zero gradients. Among these\
    \ target candidate points, three scenarios may occur:\n\n+   1. This stationary\
    \ point is the unique solution we seek. It is a global optimum whose cost is minimal\
    \ of all. Optimizing towards this point is easily achievable when the cost function\
    \ is convex with regard to the weights.\n+   \n+   2. It is a local optimum in\
    \ a regional valley. Although other valleys may have a lower cost, the minimal\
    \ regional cost is derived only concerning its neighborhood. In the face of multiple\
    \ valleys or local minima, it is difficult to identify the global minimum without\
    \ comparing it against all the local minima.\n+   \n+   3. The point may happen\
    \ to live in a flat region, where all points within this region show zero gradients.\

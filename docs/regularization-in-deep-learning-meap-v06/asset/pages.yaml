- pgno: 81
  md: '# A brief history of the “double descent” phenomenon


    The “double descent” phenomenon has primarily been overlooked historically and
    only started to surface in recent years, largely due to the typical workflow on
    how classical models are trained in the past. The linear and parametric models
    often assume a fixed and limited capacity level given that only a few features
    are used. The number of features is often much less than the number of observations
    in the dataset. Powerful models such as the non-parametric family of models use
    smoothing and regularization techniques to control model complexity. In particular,
    regularization shrinks the effective capacity of the model and avoids interpolation,
    thus obscuring the occurrence of the “double descent” phenomenon.


    The understanding of the “double descent” phenomenon was promoted by a few notable
    papers in this area. For example, Belkin et al. formally discussed the modern
    interpolation regime in their thought-provoking paper titled “reconciling modern
    machine learning practice and the bias-variance trade-off” in 2018. They provided
    evidence for the existence and ubiquity of the “double descent” phenomenon for
    a wide range of high-complexity models. In the following year, Nakkiran et al.
    studied this phenomenon in deep neural networks in their published paper titled
    “deep double descent: where bigger models and more data hurt,” which provided
    additional evidence on the doubly decreasing risk curve as a function of model
    size as well as training iterations. Besides, the authors also discovered the
    sample non-monotonicity phenomenon: having more training data may hurt test performance.
    This will be covered in a later section.


    # 3.2 Double Descent in Polynomial Regression


    In the previous chapter, we looked at fitting a nonlinear relationship between
    the univariate predictor X and outcome variable y using polynomial regression,
    where y is modelled using a certain degree of polynomial of X. In other words,
    we assume the model takes the form of y = fw(X) + ε, where fw(X) = Φ(X)w = Σp
    i=0 wiXi = w0 + w1X +···+wpXp is a polynomial function up to the pth degree of
    polynomial, and ε is an independent random variable with zero mean and constant
    variance. For example, when using up to the 2nd degree of polynomial, the prediction
    function takes the form of fw(X) = w0 + w1X + w2X2.


    Training the model requires identifying the correct functional form of the predictor
    that best fits the training dataset. Increasing the degree of polynomial alone,
    however, will generate a wiggly fit with high variance. It would be good if we
    could generate an accurate fit using a high degree of polynomial, but at the same
    time control the wiggliness of the model by adjusting the smoothness of the fitted
    curve. In other words, a model that fits the training well should also be simple
    and smooth.


    The answer is smoothing spline, which adds an explicit smoothness constraint when
    fitting the polynomial regression model. In the following section, we will first
    introduce the modeling details of the smoothing spline, followed by its implementation
    to connect to the “double descent” phenomenon.


    # 3.2.1 Smoothing spline


    The term ‘spline’ originally refers to a tool used to craft smooth curves. In
    classical statistics, splines have been widely used to generate flexible shapes
    by first identifying the knots that connect two smooth curves and fitting the
    curve between two consecutive knots. When'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'fitting the curve, an additional constraint on the derivatives of a particular
    order is often imposed to ensure the smoothness and continuity of the curve. A
    common choice is to use the second derivative of the fitted function and penalize
    the integrated squared second derivatives while minimizing the *residual sum of
    squares* (RSS) between the model prediction and the target outcome. Denote the
    penalty on the second derivative as $J(\mathbf{w}) = \int f''''_w(x)^2 dx$. $J(\mathbf{w})$
    will be used to control the curvature of the model. In this case, the resulting
    model, which is called the smoothing spline, has the following cost function:


    $Q(\mathbf{w}) = \sum^n_{i=1} \left(y_i - f_w(\mathbf{x}_i)\right)^2 + \lambda
    \int f''''_w(x)^2 dx$


    where $\lambda$ is a weighting factor that controls the tradeoff between the goodness
    of fit to the training data and the roughness of the resulting functional form.
    This is a hyper-parameter that is often selected based on cross validation procedure.
    A large $\lambda$ generates a smooth curve while a small $\lambda$ results in
    a rough curve. As $\lambda$ approaches zero, the cost function will be RSS driven,
    leading to an interpolating spline that produces zero training error but takes
    a wiggly shape. When $\lambda$ approaches infinity, the roughness penalty based
    on the second derivative of the model becomes paramount, which constrains the
    form of the model to be linear. Figure 3.6 summarizes the two opposing forces
    in the penalized cost function.


    ![](img/ee98e91e6845f41077b163bec833ee40_82_0.png)


    Figure 3.6 Penalized cost function for the smoothing spline model. Besides the
    original residual sum of squares, an additional roughness penalty is added to
    encourage a smooth form of the model, controlled by a hyper-parameter.


    Note that the first derivative indicates the slope of the fitted curve, and the
    second derivative denotes the rate of change of the slope. The second derivative
    is a measure of the roughness of the curve and acts as a penalization term in
    the cost function. More roughness in the curve will result in a higher penalty
    in the cost function. Besides, this roughness penalty also saves the trouble of
    deciding how many knots to use when fitting the model.


    # 3.2.2 Rewriting the smoothing spline cost function


    Recall that the closed-form solution for the linear regression can be derived
    by setting the gradient of $Q(\mathbf{w})$ to zero and solving a system of normal
    equations: $\Phi^T \Phi \mathbf{w} = \Phi^T \mathbf{y}$. To derive'

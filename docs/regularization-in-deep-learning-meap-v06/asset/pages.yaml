    # 1.6 Understanding the model training process


    A typical model training process starts with some training data. In supervised
    learning tasks, the training data consists of input-output pairs. Each input entry
    could contain multiple features that describe one observation from different perspectives.
    The corresponding output contains the true target, acting as the correct answer
    to guide the training process. Model training aims to generate a mapping function,
    a model, that correctly maps a given input to the corresponding output.


    A trained model consists of two parts: *parameters* and *architecture*. Parameters
    are the integral components of a model, and the architecture specifies how these
    components interact with the input data to produce the final prediction output.
    This predicted value is then compared with the ground truth''s target output to
    produce an error metric jointly. Here, the error indicates the current cost on
    how close or far away it is between the prediction and the actual value. Following
    a particular optimization procedure, the training process adjusts the model parameters
    and sometimes the architecture to reduce the training cost. After adjusting the
    weights, the new error is calculated again, forming a feedback loop. The whole
    model training process is depicted in figure 1.16 below.


    ![](img/ee98e91e6845f41077b163bec833ee40_25_0.png)


    **Figure 1.16** Example of a typical model training process. The workflow starts
    with the available training data and gradually tunes a model. The tuning process
    requires matching the model prediction to the target output, where the gap is
    measured by a particular cost function and used as feedback for the next round
    of tuning. Each tuning produces a new model, and we want to look for the model
    that minimizes the cost.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'There are four components highlighted in figure 1.16: training data, model,
    cost, and optimization. Any or more of these components can be used as the touchpoint
    of regularization. For example, data augmentation, a widely used technique to
    train object detection algorithms, is a regularization technique that operates
    on the data. By adding random noise to input image data, such as shearing and
    rotation, a new and diverse set of images gets generated in various forms, which
    are then added to the original training set and exposed to the model for more
    robust training. Diversity in the training data helps generalization. We will
    share more details on how and why it works well for (typically) image classification
    tasks in the later section.


    # 1.7 The many faces of regularization


    There have been many different techniques proposed to play the role of regularization,
    focusing on data, model, cost, optimization, or some combination. Although being
    problem-specific, specific techniques tend to work better and give immediate improvement
    than others. The challenge, however, is that the existing literature on different
    techniques is very scrambled and primarily studied in separation from each other.
    This book intends to bridge this gap. By introducing popular techniques together
    in a unified framework, we hope to make the learning journey smooth and comprehensive
    via lots of practical and intuitive explanations and examples on the theory and
    practice.


    Based on the previous model training workflow in figure 1.16, training a neural
    network starts with flowing the data into the model architecture, interacting
    with model parameters, outputting the prediction, calculating the error, and propagating
    the error feedback back to the model weights for iterative updates. This process
    naturally becomes the focus area of the book, covering regularization techniques
    on data, model architecture, cost function, and optimization procedure. Figure
    1.17 demonstrates the overall categorization of regularization techniques from
    a model training perspective.


    | Data | Model | Cost | Optimization |

    |---|---|---|---|

    | Data augmentation<br>Noise injection<br>Bootstrap<br>etc. | Pooling<br>Dropout<br>Weight
    sharing<br>etc. | Ridge<br>Lasso<br>Entropy<br>etc. | SGD<br>Weight initialization<br>Early
    stopping<br>etc. |


    Figure 1.17 Categorizing regularization techniques based on data, model, cost
    and optimization.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'In addition, regularization can also be categorized as implicit or explicit.
    Implicit regularization refers to a particular operation that indirectly plays
    a regularizing role. For example, stochastic gradient descent (SGD) is a typical
    optimizer used to train deep learning models. By optimizing the model based on
    one or a small batch of data points in each iteration, the model is exposed to
    more diverse data variations and thus learns to be more robust by considering
    these variations. By decorrelating the nearby updates, SGD could indirectly regularize
    the model to be generalizable to the test set. On the other hand, explicit regularizers
    specifically target tweaking specific components during model training, such as
    controlling model complexity. Figure 1.18 lists some standard implicit and explicit
    regularization techniques. One particular technique is Dropout, which acts both
    as an implicit and explicit regularizer. We will delve into this technique in
    a later section.


    ![](img/ee98e91e6845f41077b163bec833ee40_27_0.png)


    Figure 1.18 Categorizing regularization techniques as implicit or explicit.


    Lastly, as shown in figure 1.19, regularization can also be categorized as strong
    or weak, depending on its effect. For example, explicit regularizers such as Lasso
    directly remove unimportant features by setting their coefficients to zero. This
    could be considered as having a strong regularizing effect. On the other hand,
    techniques such as data augmentation aim to provide different versions of the
    same dataset, hoping that the model could learn from the similarities and become
    robust to the variations in between, resulting in a more gentle, indirect, and
    thus weak regularizing effect.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '![](img/ee98e91e6845f41077b163bec833ee40_28_0.png)


    Figure 1.19 Categorizing regularization techniques as strong or weak.


    # ## 1.8 Summary


    +   - Regularization includes a suite of techniques used to generalize the trained
    model to the unseen test set

    +   - Regularization can be applied across the four components of a model training
    pipeline: data, model, cost and optimization; it can be explicit or implicit,
    strong or weak

    +   - Underfitting refers to an under-capacitated model that suffers from a high
    bias and fails to capture the underlying pattern, and overfitting refers to an
    over-capacitated model that suffers from a high variance and may accidentally
    learn a spurious relationship

    +   - Model training needs to balance the bias and the variance and arrive at
    the right level of model complexity'

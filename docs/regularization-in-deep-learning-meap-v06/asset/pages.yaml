- pgno: 190
  md: '# # 6.2 Regularizing deep neural networks via dropout


    Recall that we briefly mentioned *ensemble learning* in the previous chapter,
    which is a form of aggregating multiple models developed based on multiple bootstrapped
    datasets for the sake of building a more generalized model. It turns out that
    we can also keep the same dataset unchanged and tweak the model architecture multiple
    times, each ending up with a different model and collectively aggregated to produce
    a final output. This is the idea of *dropout*, where we randomly (and temporarily)
    disable/remove certain nodes in a layer along with all the associated incoming
    and outgoing connected weights, according to a specific schedule and only during
    the *training* stage. The connected weights is often happens in the hidden layer,
    although one can also apply it at the input layer.


    By ensembling different model configurations, dropout leads to training multiple
    models, which contributes to reducing overfitting and improving the generalization
    performance. It can be considered as injecting random noises into the model architecture
    as a form of regularization. Plus, probabilistically dropping out random nodes
    in the network also accelerates computation during training.


    One analogy on the dropout operation is as follows. In a classroom a teacher asks
    some questions, but the same two kids are always answering. The teacher asks them
    to stay quiet for some time and let other students participate. This way, other
    students get to learn better. Maybe they give the wrong answers, but the teacher
    (loss function) can correct them (weight updates using back propagation). By temporarily
    silencing a few extremely active students (nodes with high activation outputs),
    the whole class (layer) learns better about the topic.


    Let us look at the dropout operation in detail.


    # ## 6.2.1 Introducing dropout


    Dropout was originally introduced by Srivastava et. al (2014) in their seminal
    paper titled “Dropout: A Simple Way to Prevent Neural Networks from Overfitting”.
    The central idea of dropout is to approximate the ensemble learning as if we were
    to train many different models and average their predictions, since explicitly
    building multiple models is computationally expensive when the dataset gets large
    and the model gets complex. The approximation happens by randomly disabling certain
    nodes in the network (multiplied by zero), making it look like a different model
    for the current training iteration. Doing so will prevent the model from developing
    too much reliance on a particular node (as represented by its large weights),
    since it may just randomly get dropped out of the network. When a seemingly important
    node is dropped out, the other adjacent nodes will assume the additional shared
    responsibility for the current training task and learn to be more robust and less
    prone to *co-adaptation*, where adjacent nodes exhibit similar behavior and thus
    hurt generalization performance due to the high correlation.


    Consider the training process of a simple network consisting of two hidden layers
    in figure 6.10. At the first training iteration, the second node at the first
    hidden layer along with its associated incoming and outgoing weights are disabled.
    The same operation happens for the first node of the second hidden layer at the
    second training iteration. Note that both nodes are only temporarily omitted from
    the network and are restored upon training finishes. At the'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'test stage, all nodes are present as in the original network and used for inference
    with scaled outputs.


    In practice, the random disabling effect happens based on a preset probability
    upon defining the network architecture. In addition, we would obtain the same
    network architecture as the original version and would not apply dropout during
    the test stage.


    ![](img/ee98e91e6845f41077b163bec833ee40_191_0.png)


    Figure 6.10 Illustrating the dropout operation when training a simple fully-connected
    neural network with two hidden layers. The probabilistic removal of hidden nodes
    happens during the training iterations. For example, the second node of the first
    hidden layer is removed at iteration 1, and the first node of the second hidden
    layer is removed at iteration 2. Note that muting a node also means silencing
    (setting to zero) all the connecting weights, as represented by the dashed line.
    We would end up with the same network architecture as the original version since
    the dropout operation only happens during training iterations.


    Randomly dropping out nodes can also be considered as sampling a thinned network
    from the original network, achieved by cutting all incoming and outgoing connections
    of a particular node. Since most of the nodes are present across multiple sampled
    networks, or sub-models, the dropout process allows weight sharing among these
    thin networks across different iterations, transferring and communicating the
    weights across multiple sub-models. This weight-sharing scheme is in a similar
    vein to multi-task learning, a topic we will cover shortly in a later section
    of the chapter.


    Note that dropout can be enabled at the test stage, whereby each prediction is
    generated by a slightly different sampled model, for a collection of predictions.
    These multiple predictions can then form a distribution, which is then used to
    quantify the uncertainty of the'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'prediction using statistics such as the mean and the variance of the distribution,
    which approximates Bayesian inference that accounts for model uncertainty.


    Besides offering an improved generalization performance by reducing overfitting,
    the dropout technique also brings the side effect of encouraging sparse representation
    in the hidden layer, instead of relying on explicit weight regularization added
    in the model''s cost function.


    Additionally, dropout will help keep the weights in the network small since the
    weight updates are spread out. Small weights are desirable since the model is
    less sensitive to small changes to the input features. We will cover more on regularization
    via the objective function in a later chapter, where penalties such as l1 and
    l2 norms play an explicit role in regularizing the model weights, keeping them
    small or even zero in value.


    # 6.2.2 Inducing a sparse representation


    CNNs are extremely good at learning geometric structures from image data. That
    is, good feature representations are automatically extracted and learned to capture
    the structural patterns at different levels. Among the many equally good feature
    representations, a sparse one is often preferred due to advantages such as improved
    robustness (i.e., fewer features selected) and faster computation (fewer weights
    are involved in model inference). Sparsity in feature representation is thus another
    inductive bias we place in the model, where only a subset of the original features
    (at the input or the hidden layers) is important. Hence, at the input level, sparsity
    can also be interpreted as an implicit feature selection mechanism.


    There are many techniques that induce sparse learning, with Lasso regularization
    being the most prominent example. Lasso is a penalty term added to the objective
    cost function of the model so that only a subset of the original features will
    be selected in the final model. Such feature selection is achieved by setting
    the weights of unimportant features to zero.


    There are two more commonly used Lasso variants: group Lasso and elastic net.
    The group Lasso assumes a group membership of certain weights, selecting or dropping
    the whole group of weights. The elastic net linearly combines Lasso and group
    Lasso, performing sparse learning at both individual weight level and the aggregate
    group level.


    We will dive more into this particular technique in a later chapter on regularization
    via objective function. For now, let us put sparse learning in the context of
    a simple FCN. Figure 6.11 illustrates the effect of different sparsity-inducing
    techniques in feature representation. Without using any sparsity-inducing regularizer,
    the FCN as represented by the top-left figure will learn all the weights and keep
    all the resulting hidden features/nodes in the final model, which could be demanding
    in storage and time-consuming in inference in practical applications. A sparse
    model can often be learned to deliver the same predictive performance while remaining
    a much small size. Sparsity can take the form of weight-level selection using
    Lasso as shown by the top-right figure, or group-level selection of nodes using
    group Lasso as in the bottom-left figure, or a combination of both using the so-called
    elastic net regularization in the bottom-right figure.'
  merge: -1
  img_proc: true

- pgno: 73
  md: '# 3.1.1 Beyond perfect interpolation


    Complex models such as neural networks and nonlinear class of models tend to have
    very low, or even zero training cost. The zero training cost occurs when the model
    becomes sufficiently complex to interpolate the training data, as shown by the
    rightmost dot in figure 3.1. Perfect prediction in the training data happens when
    the number of weights p used by the model is precisely equal to the number of
    obsertions n in the training data. In the case of linear regression, when p =
    n, we solve a system of linear equations where the number of free variables, whose
    optimal values we are solving for, is equal to the number of linear equations
    in the system.


    A simple example is a two-dimensional training set with two observation points
    on a coordinate system. When only one parameter is available, the model is reflected
    as a straight horizontal line in the coordinate system. This univariate model
    is too simple to fit these two points unless they happen to live along the fitted
    line. The resulting system of equations is said to be overdetermined and under-parameterized
    since we have more linear equations than the unknown variables in the system.


    When we have two parameters to fit the model, the problem becomes solvable with
    a exact solution: two linear equations and two unknowns, a straightforward exercise
    in high school. We can fit a line anywhere in the coordinate system by adjusting
    its intercept and slope. The problem thus becomes fitting a line that passes through
    the two points. We can train a model that passes through the two points and produces
    zero training error, thus interpolating between these two points.


    When there are more than two unknown variables, say we have three weights in the
    model, the problem becomes underdetermined and over-parameterized. The solution,
    when solvable, will be infinite. Having more than two parameters corresponds to
    fitting two points with a curved line. Any curve that passes through the two points
    produces zero training error, yet the curve can be arbitrarily wiggly and complex
    depending on the number of parameters used. Figure 3.2 summarizes these three
    scenarios.'

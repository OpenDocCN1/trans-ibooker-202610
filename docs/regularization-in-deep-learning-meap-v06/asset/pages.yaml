    # ## 2.6.1 More on the model


    So far, we have been using \(f_w\) to denote the model \(f\) we are trying to
    develop based on a set of weights **w**. For now, we will use \(f\) to denote
    the model for a more general discussion. The choice of a model can be linear or
    nonlinear, parametric or non-parametric. In linear regression, the model \(f\)
    is a linear model parameterized by **w**.


    Model training means building a model that represents the real mapping relationship
    between the input variable **x** and output variable y. Denote the real mapping
    function as \(g\), which is non-random, consistent and contains the true relationship
    between **x** and y; this is exactly the relationship we want our model to estimate.
    Assuming an additive random noise \(\epsilon\) in the data generating process,
    we can then express the underlying process as \(y = g(\mathbf{x}) + \epsilon\),
    where \(\epsilon\) is an additive random noise that assumes a normal distribution
    with a zero mean and fixed variance \(\sigma^2\).


    Note that the random variable \(\epsilon\) represents errors due to measurement
    error or other sources of error in the real world, and is assumed to be independence
    of the random variable **x** in the regression setting. The goal of linear regression
    is thus to build a linear model \(f\) that approximates the real function \(g\)
    as close as possible in the presence of an additive, independent and random noise.
    Considering the limited representativeness of the available dataset **(x,y)**
    for all different variations of datasets from \(\mathbb{P}(\mathbf{x},\mathbf{y})\),
    we would want to build a model \(f\) whose expected output matches that of \(g\).
    Mathematically, we would choose a model \(f\) such that \(\mathbb{E}[f(\mathbf{X})]
    = \mathbb{E}[y|\mathbf{x} = \mathbf{X}] = \mathbb{E}[g(\mathbf{X}) + \epsilon|\mathbf{x}
    = \mathbf{X}] = \mathbb{E}[g(\mathbf{X})] + \mathbb{E}(\epsilon) = g(\mathbf{X})\).


    # ## 2.6.2 Bias and variance decomposition


    As introduced in chapter 1, when training a model \(f\), there are two sources
    of error to be balanced off: bias and variance. The bias refers to the error due
    to the model''s insufficient capacity to perfectly fit \(g\); this is the underfitting
    scenario. For example, fitting a nonlinear quadratic pattern \(g\) using a linear
    model \(f\). The variance refers to the error due to fitting a spurious relationship
    that is corrupted by the random noise \(\epsilon\) in the data; this is the overfitting
    scenario. For example, fitting a linear pattern \(g\) with a linear model \(f\),
    yet \(f \neq g\).


    Following the discussion on the true statistical risk, we now look at ways to
    decompose the expected risk for a new unseen input \(\mathbf{X}_{new}\). For notational
    simplicity, we will denote \(f(\mathbf{X}_{new}) = f\) and \(g(\mathbf{X}_{new})
    = g\). Using some mathematical derivation, the expected squared error can now
    be decomposed into three components: the squared bias and the variance of the
    model, which are considered to be reducible by the training process, plus the
    variance of the'

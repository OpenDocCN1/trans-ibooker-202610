  md: '# 7.4 Summary


    +   - Regularization via the objective function refers to any regularization/penalty
    term added to the original unregularized loss term, where the regularization term
    is designed to penalize the magnitude of the model weights

    +   - Common norm-based regularization terms include the LASSO penalty (L1 norm),
    ridge penalty (L2 norm), or the elastic net (a weighted combination of LASSO and
    ridge)

    +   - When seeking the optimal weights, one can derive the closed-form solution
    and directly calculate the solution; when the closed-form solution is not available,
    we often resort to iterative procedures such as (stochastic) gradient descent
    or alternative optimization procedures such as coordinate descent

    +   - The bias term is often not penalized and only the weights associated with
    the features are penalized in terms of the norm-based magnitude

    +   - LASSO-based penalties tends to generate a sparse solution by setting some
    weight to zero and the rest towards zero based on the soft thresholding rule

    +   - Both LASSO and ridge penalties have a nice geometric interpretation in terms
    of the regularization effect

    +   - There is more than one way to implement the norm-based penalty, both from
    the ground up and off-the-shelf

    +   - Tuning the hyperparameter for the regularization term(s) requires rounds
    of trial and error'

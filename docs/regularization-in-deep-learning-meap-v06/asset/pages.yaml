    However, if we continue to invest more hours into the study and aim for perfect
    scores in the practice exam, we may risk overfitting our mental model. At some
    point, we may start to memorize the solution to each training question, especially
    when we cannot work out an immediate solution. Given limited study time, perfectly
    memorizing the answers can directly get us full marks in the practice exam. Unfortunately,
    pushing too hard does not guarantee an equal payoff. Our test performance will
    start to drop due to a lack of generalization capacity, and the generalization
    gap will grow. Besides, given so many practice questions in the market, who knows
    the answers provided are noise-free and 100% correct? The point is, beware of
    lower test performance if we only focus on getting the correct answers instead
    of learning the patterns.


    Remember, our goal is to train a good enough mental model through the practice
    exam and use the trained mental model to obtain high marks in the final test exam
    hopefully. A model that generalizes well to the test set means the complexity
    of the model is good enough, and the core problem-solving patterns learned can
    be well applied to new questions in the final exam. We wish to reduce the generalization
    gap between training and test performances as much as possible. However, a higher
    model complexity does not necessarily translate to a smaller generalization gap.


    There is often a sweet spot that represents the best performance in the final
    exam, and it often is associated with good enough training performance in the
    practice exam. Generalizability starts to decrease after the sweet spot, leading
    us to the overfitting region. It is thus the sweet spot that we wish to reach.
    In modeling terms, the sweet spot represents'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'the optimal model complexity, i.e., the weight configuration, which will expectedly
    lead to the lowest test error and best generalize to the unseen test set. The
    optimal model avoids underfitting and overfitting: it is complex enough to learn
    the underlying pattern in the training data and simple enough to avoid fitting
    spurious patterns due to data noise.


    # 1.4 Understanding bias-variance trade-off


    Underfitting and overfitting, as separated by the sweet spot in figure 1.7, are
    closely connected to the concept of bias-variance trade-off that occurs in regression,
    classification and reinforcement learning tasks. In regression setting, bias refers
    to how close the model prediction is to the target value, on average. The term
    average is very much related to expectation. In this case, we are using bias to
    describe the expected average distance between prediction and target. We want
    the model to have a low bias as much as possible, thus being close to the actual
    target value on average. A model with a high bias means it fails to capture the
    underlying pattern in the data and only generates a biased, off-target prediction.
    The trained model, if too simple, will likely end up underfitting the training
    data. In our exam case, both practice and final exam marks will likely be low
    if our problem-solving mental model is not honed to be accurate enough.


    On the other hand, we may also suffer from high variance, a symptom of overfitting.
    Variance measures the variability of the model prediction; it shows how wide or
    narrow the range of model predictions could be. We want the model to have a variance
    as low as possible, thus producing more stable and reliable results. A model with
    high variance often results from too much focus on fitting the training data well,
    even to the point of exactly matching its predictions to the target labels. When
    overfitting occurs, the model performs very well on the training data but has
    a significant error on test data. In our exam example, overfitting could come
    from perfect data memorization to correctly answer every practice question. In
    the presence of potentially wrong answers in the practice exams and lack of generalizable
    and transferrable problem-solving skills, the trained mental model will likely
    generate inaccurate, unstable, and very different answers for a slight change
    in the test question. The significant fluctuation in model predictions, or high
    variance, is an obvious sign of overfitting.


    Both bias and variance are two sources of error that we hope to minimize when
    training a model. However, it is not easy to reduce both at the same time. On
    the one hand, reducing bias will often make the model more complex, which increases
    the chance of overfitting and thus leads to high variance. On the other hand,
    reducing variance often comes with lower model complexity and likely leads to
    a high bias when ending up with a simple model. It is difficult to improve one
    while leaving the other uncompromised, let alone improving both together. This
    is the so-called bias-variance trade-off.


    To further aid our understanding, let us look at figure 1.8, which contains four
    different scenarios based on both sources of error.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/ee98e91e6845f41077b163bec833ee40_17_0.png)


    Figure 1.8 Four possible bias-variance scenarios. The first region has high bias
    and low variance, due to the trained model being too simple and possibly underfitting.
    The second region is the ideal state, with bias and variance both being low. The
    third region has high bias and variance, suggesting that the model deserves further
    training to learn the underlying pattern. The fourth region indicates an overfitting
    model that has low bias but high variance.


    In figure 1.8, the first and fourth regions correspond to underfitting and overfitting,
    respectively. When training a model, we usually start from the third region, where
    both errors are high. As the model gradually improves and becomes more complex,
    we will come across the first region due to better pattern recognition - the model''s
    predictions become more stable by learning the underlying patterns. Now, if we
    are lucky, we may reach the second region, where both errors are low, without
    much trouble. However, it is more common in practical model training to see excessively
    trained and overly complex models that may get stuck in the fourth region.


    Proper regularization could help us reach the target region, namely the low bias
    and low variance region, in multiple ways. As shown in figure 1.9, example training
    paths could follow 3 -> 1-> 2, 3 -> 1 -> 4 -> 2, or others, depending on the specific
    regularization strategies used.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '![](img/ee98e91e6845f41077b163bec833ee40_18_0.png)


    Figure 1.9 Example model training paths using proper regularization. There are
    multiple ways to build a generalizable model with low bias and variance as in
    region 2. Depending on the similarity between the training set and the test set,
    as well as the model class and training strategy used, the model training path
    could travel in multiple ways. With proper regularization, the final trained model
    will hopefully reach region 2.


    In order to reach a good balance between bias and variance, the model needs not
    be too simple or complex, assuming a decent amount of data that encompasses sufficient
    variability for the model to learn. In other words, it should not be underfitting
    or overfitting. In practice, we want to minimize the total error, consisting of
    both bias and variance. We will formalize the formulation of the total error in
    Chapter 2. Using proper regularization, we could reduce the model variance at

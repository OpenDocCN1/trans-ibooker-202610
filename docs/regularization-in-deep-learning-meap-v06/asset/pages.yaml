    gradient descent, implicitly regularize the model estimation process and thus
    are more likely to generalize to the test set. We will cover the “double descent”
    phenomenon in chapter 3 and the implicit regularization effect of the stochastic
    gradient algorithm in the later chapters.


    # ## 1.5 More on the model training path


    Let us dive slightly deeper into the model training path. The typical machine
    learning pipeline starts with the objective of minimizing a given loss function,
    typically the training set error, hoping that the trained model also performs
    well in the future test set. Similar to the exam case, four possible scenarios
    come out of this. First, both training set error and test set error are high.
    This means that the model has not been able to pick up the patterns from the training
    dataset, and requires further improvement by either training longer, adjusting
    other hyperparameters, or changing to another model class. This is the case of
    underfitting.'

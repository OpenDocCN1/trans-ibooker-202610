    # 4.2.3 Different modes of multiplication


    So far, we have been looking at how to calculate the gradient of a multilayer
    neural network with respect to the weights in the first hidden layer. It is also
    straightforward to generalize to the weights for other layers. The gradient of
    the final cost with respect to the weights at the first layer can be derived by
    multiplying these intermediate derivatives of the middle layers. However, each
    pair of layers results in a matrix of partial derivatives whose element corresponds
    to each unique pair of nodes in both layers, and multiplying multiple matrices,
    if not properly planned, could take a long time to compute.


    Let us focus on the multiplication of the first two matrices: $\frac{\partial
    \mathbf{f}_1}{\partial \mathbf{w}}$ and $\frac{\partial \mathbf{f}_2}{\partial
    \mathbf{f}_1}$. Assume $\mathbf{w}$ is a $p_0$ -dimensional vector and $\mathbf{f}_1$
    is a $p_1$ -dimensional vector. Taking the partial derivative of each function
    in $\mathbf{f}_1$ against each weight in $\mathbf{w}$ gives us a matrix $\frac{\partial
    \mathbf{f}_1}{\partial \mathbf{w}}$ of dimension $p_1 \times p_0$. Similarly,
    $\frac{\partial \mathbf{f}_2}{\partial \mathbf{f}_1}$ will be a $p_2 \times p_1$
    matrix. Based on our previous introduction on matrix multiplication, when two
    matrices multiply with each other, the inner dimension should match each other
    and the outer dimension will form the resulting shape of the output. In this case,
    $\frac{\partial \mathbf{f}_2}{\partial \mathbf{f}_1} \frac{\partial \mathbf{f}_1}{\partial
    \mathbf{w}}$ will be a $p_2 \times p_0$ matrix. In addition, from a computational
    perspective, multiplying $\frac{\partial \mathbf{f}_1}{\partial \mathbf{w}}$ and
    $\frac{\partial \mathbf{f}_2}{\partial \mathbf{f}_1}$ will need a total of $p_2
    p_1 p_0$ operations. The number of operations indicates how long the multiplication
    will take.'

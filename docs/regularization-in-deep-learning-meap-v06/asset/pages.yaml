    Recall that our goal is to calculate the gradient vector that contains the partial
    derivatives of the model''s cost with respect to each weight. Due to the large
    size of modern neural networks and the many rounds of optimization involved, we
    would hope to calculate the gradient efficiently. Therefore, we need to analyze
    and compare the computational cost of forward mode and backward mode multiplication
    and go with the faster option.



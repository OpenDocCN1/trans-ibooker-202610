    # 2.4.6 The impact of the learning rate


    The learning rate used in the gradient descent family of algorithms is a crucial
    hyper-parameter. The hyper-parameter is usually determined manually or through
    some heuristics before training starts and stays fixed during model training.
    For each round of parameter updates using a batch of training data, the learning
    rate remains fixed, changing only the parameters. However, the learning rate between
    different rounds of parameter updates may differ and could be designed to change
    following a pre-allocated schedule.


    The learning rate \(\eta\) determines the step size of parameter update. If \(\eta\)
    is too small, each update will only slightly nudge the parameters towards the
    optimum, leading to a slow convergence. However, when \(\eta\) is too large, the
    optimization process may diverge, leading to parameter updates that diverge away
    from the optimum. Figure 2.18 demonstrates these two scenarios.'
  merge: -1
  img_proc: true

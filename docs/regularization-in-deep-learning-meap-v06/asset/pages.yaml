    Figure 7.4 Illustrating the squared L2 norm using vector notation.


    Adding the squared l2 norm, the objective function now becomes \( Q(\mathbf{w})
    = RSS(\mathbf{w}) + \lambda\|\mathbf{w}\|_2 \), where \( \lambda \) is a hyperparameter
    that controls the goodness of fit (the RSS term) and the magnitude of the resulting
    weights (the ridge penalty term). We often choose the optimal \( \lambda \) using
    cross-validation, a technique that splits the dataset into several folds and uses
    different folds for training and test purposes, similar to the train-test split
    section covered in chapter 2. We can also use matrix notation to express the objective
    function as \( Q(\mathbf{w}) = (\mathbf{y} - \Phi\mathbf{w})^T(\mathbf{y} - \Phi\mathbf{w})
    + \lambda\mathbf{w}^T\mathbf{w} \).


    In order to obtain the optimal weight vector \( \mathbf{w}^* \) that minimizes
    the objective function \( Q(\mathbf{w}) \), we can either analytically solve for
    \( \mathbf{w}^* \) or resort to an iterative optimization procedure such as gradient
    descent, both of which require the calculation of the gradient vector \( \nabla
    Q(\mathbf{w}) = \nabla[RSS(\mathbf{w}) + \lambda\|\mathbf{w}\|_2] = \nabla[(\mathbf{y}
    - \Phi\mathbf{w})^T(\mathbf{y} - \Phi\mathbf{w}) + \lambda\mathbf{w}^T\mathbf{w}]
    \). Note that since \( Q(w) \) is quadratic in \( \mathbf{w} \), we can simply
    set its gradient to zero in order to obtain the minimizer. Since the gradient
    operation distributes across the sum, we have \( \nabla Q(\mathbf{w}) = \nabla[(\mathbf{y}
    - \Phi\mathbf{w})^T(\mathbf{y} - \Phi\mathbf{w})] + \lambda\nabla[\mathbf{w}^T\mathbf{w}]
    \). Further taking the derivative with respect to \( \mathbf{w} \) gives \( \nabla
    Q(\mathbf{w}) = -2\Phi^T(\mathbf{y} - \Phi\mathbf{w}) + 2\lambda\mathbf{w} \).
    Let us start with the analytic approach.'

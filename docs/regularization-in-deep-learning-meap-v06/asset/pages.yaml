    # 4.4.2 Best versus worst global minimum


    We have learned so far regarding the solution space (model weights upon convergence)
    that there are multiple global minima when the model is trained to interpolate
    the training data given a fixed model complexity and across different levels of
    model complexity. Out of these many equally good solutions, some tend to generalize
    well to the test set, for example, via implicit regularization when using SGD.
    Some tend to generalize poorly due to overfitting. Suppose we were to characterize
    the solution space of global minima for a fixed level of model complexity. In
    that case, we can obtain an upper bound (i.e., worst global minimum) and a lower
    bound (i.e., best global minimum). The upper bound would be the subject of study
    under the classical generalization theory that highlights a high test error due
    to overfitting. On the other hand, the lower bound reflects the modern generalization
    theory that highlights a low test error due to implicit or explicit regularization.


    Let us look at this perspective more closely. Figure 4.23 illustrates the upper
    and lower bound of the test error as a function of the model complexity, plus
    the training error as a reference. The training error decreases as the model becomes
    complex under both classical and modern generalization views. However, the behaviors
    differ in the test error. The test'

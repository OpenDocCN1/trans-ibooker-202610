  md: 'Next, we will look at automatic differentiation, the essential mechanism embedded
    in modern deep learning frameworks that provides automatic gradient calculations,
    thus enabling fast and efficient development of large neural networks.


    # 4.2 Automatic differentiation


    The strong approximation capacity of a deep neural network makes it a powerful
    and expressive type of model. However, we still need to employ an optimization
    technique to search for optimal weights for given network architecture. In the
    previous chapters, we covered the gradient descent family of methods. The procedure
    to optimize a neural network model is to iteratively calculate the gradient of
    the current model cost concerning model weights and then apply the gradient to
    update the weights.


    Such gradient-based optimization is also one of the reasons behind the great success
    of neural networks. In particular, neural networks trained using stochastic gradient
    descent algorithm tend to end up with low empirical risk and generalize well to
    the future unseen test sets. One distinguishing feature of the algorithm lies
    in the stochasticity of the gradient, where the gradient is calculated based on
    a single or a mini-batch of examples and is thus noisy compared to an averaged
    gradient based on a large batch of examples. The test performance starts to suffer
    when the noise reduces using the full gradient descent procedure that uses all
    examples for gradient calculation. Part of the reason is that SGD with a small
    batch size enables the optimizer to jump out of sharp local optima and move towards
    more flat optima that generalize better to the test set. The generalization capacity
    of neural networks is thus related to the specific algorithm and its configuration
    used along with the model complexity and sample size.


    We will cover more on the regularization from the optimization perspective later.
    For now, let us look closely into the details of gradient-based optimization,
    especially when we have multiple weights to update in each iteration.


    # 4.2.1 Gradient-based optimization


    Let us revisit the entire model training process and refresh our memory on the
    mathematical operations in each link. As shown in figure 4.10, the model training
    process starts by dividing the original dataset into a training set and a test
    set. The training set serves to develop an optimal model, and the test set measures
    the generalization performance of the trained model. Two essential functions are
    used in the training process: prediction function and cost function. The prediction
    function takes the (fixed) input features and (changing) model weights as input
    and generates a set of predictions.


    In contrast, the cost function summarizes the quality of these predictions into
    one single scalar value by calculating the total (or average) distance between
    the predictions with the target labels. The cost is then passed to an optimization
    procedure such as gradient descent to update the model weights and minimize the
    cost. Once the training process completes, the optimal set of weights based on
    the training set is used to get another final prediction set based on the test
    set features. These test set predictions are compared with the corresponding labels
    to produce a final cost (such as the mean squared error) for the test set. The
    test set performance is the empirical risk covered in chapter 2, which serves
    as a'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'proxy to the true risk and measures how well the model performs on average
    for a given new test set. This process continues for many epochs until we have
    a model that minimizes the empirical risk.


    ![](img/ee98e91e6845f41077b163bec833ee40_112_0.png)


    Figure 4.10 Recapping the model training process. We start by allocating the majority
    of the dataset for training and the rest for testing. After choosing a specific
    model family, we can generate predictions and measure the cost, a scalar value
    indicating how well the current model is doing. The optimization procedure then
    adjusts the model weights so that the model cost decreases to a minimum. When
    an optimal set of weights based on the training set is identified, the model is
    then used to generate predictions for the test set and calculate the corresponding
    cost, which takes the form of mean squared error for continuous output. The test
    set cost is the empirical risk to approximate the true risk and indicates how
    well the model generalizes to the unseen future dataset. After repeating the process
    for many rounds (epochs) until the training process has converged, we will finally
    choose a model that minimizes the empirical risk


    Note that the optimization happens upon updating the weights based on the gradient
    of the current cost with respect to the current set of weights. The gradient descent
    algorithm thus requires us to be able to calculate the gradient vector $\nabla_w
    Q(w_t)$ that contains the partial derivatives of the cost with respect to each
    weight in w at timestamp t; in this case of neural networks, the weights in each
    layer.


    Now, recall the functional form of the multilayer perceptron:


    ```

    $f_L(x) = \phi(b_L + W_L \phi(b_{L-1} + W_{L-1} \phi(\cdots \phi(b_1 + W_1 x)\cdots)))$

    ```


    The final prediction $f_L(x)$ can be considered as a multi-layered composite function
    of the initial input weights $W_1$ and $b_1$ at the first hidden layer. When the
    cost is calculated, we need to cascade it all the weights for gradient calculation,
    including those early in the layers such'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'as **W**<sub>1</sub> and **b**<sub>1</sub>. To simplify the discussion, we
    will use **w** to represent all the beginning weights in the network (i.e. **W**<sub>1</sub>
    and **b**<sub>1</sub>), and see how to calculate the *Jacobian* (i.e., first order
    partial derivatives of the cost for each weight). In other words, the nested prediction
    function based on the multilayer perceptron now becomes:


    ```

    f<sub>l</sub>(f<sub>l-1</sub>(⋯f<sub>1</sub>(**w**)))

    ```


    where for each *l<sup>th</sup>* layer out of total *L* layers, the function *f<sub>l</sub>*
    is a differentiable multivariate function that maps the input vector of *p<sub>l-1</sub>*
    dimensions to the output vector of *p<sub>l</sub>* dimensions. The differentiability
    in the intermediate functions is essential to the gradient-based optimization.
    When these functions are not differentiable, we cannot calculate the gradient,
    let alone proceed with gradient descent update.


    # ## 4.2.2 The chain rule with partial derivatives


    When a function is composite, such as the multilayer perceptron prediction function,
    we can generally represent it *f(g(x))*, where *f* is a function of another function
    *g* (and so on). To calculate the derivative of a composite function, we would
    rely on the *chain rule*, which essentially passes down the derivative operation
    through each intermediate function until the raw input. Specifically, the chain
    rule says that the composite function could be differentiated as the following:


    ```

    \frac{d}{dx}[f(g(x))] = f''(g(x))g''(x)

    ```


    The above formula corresponds to a direct backward execution of differentiation.
    In order to calculate the derivative of the (two-layer) composite function with
    respect to the raw input, we would first calculate the derivative of the outer
    function *f* with respect to the entire inner function *g(x)* as a whole, giving
    *f''(g(x))*. Then we continue the calculation at the inner function *g*, resulting
    in *g''(x)*. Finally, these intermediate derivatives are multiplied together.
    The derivative calculation step passes backwards through all composing functions.


    More generally, to calculate the partial derivatives of the composite multilayer
    perceptron function for each weight in the neural network, we would rely on the
    chain rule to pass through the derivative calculation through all hidden layers
    in a backward fashion. This process also corresponds to the forward propagation
    in prediction followed by the backward propagation in the derivative calculation
    when training neural networks. In the forward propagation, we use the prediction
    function to sift through essential signals by repeated matrix multiplication and
    nonlinear transformation, resulting in a set of predictions which are then summarized
    into a single metric via the cost function. In the backward propagation, the cost
    is back-propagated to the last hidden layer to calculate the partial derivative
    for each weight in that hidden layer. This process continues for the second last
    hidden layer and repeats to the first hidden layer.


    To augment the understanding of these two propagations, we can look at a simple
    neural network that has two hidden layers with two nodes each, two input nodes
    and one output'

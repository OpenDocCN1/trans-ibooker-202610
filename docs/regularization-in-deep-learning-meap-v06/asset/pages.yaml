- pgno: 79
  md: 'One attempt that unifies the dependence of the “double descent” phenomenon
    is the notion of effective model complexity (EMC), which is defined as the maximum
    number of samples on which a training procedure can achieve close to zero training
    error on average. In the context of training deep neural networks, a training
    procedure specifies the size/complexity of the model and the number of epochs
    or complete passes of a given training set.


    Given a specific training procedure, there are two types of “double descent” curves
    empirically observed:


    +   - Complexity-wise “double descent”, where the doubly decreasing test risk
    curve is observed as the model uses more parameters and becomes more complex;

    +   - Epoch-wise “double descent”, where for a model of fixed complexity, overfitting
    is initially observed as training iteration proceeds and later corrected by sufficient
    training epochs.


    In addition, both curves are characterized by three different regimes by comparing
    EMC with the size of the training set:


    +   - When EMC is sufficiently smaller than the training sample size, we are in
    an under-parameterized regime where the model underfits the training data. With
    a small number of features, each feature captures some information about the underlying
    pattern. Enhancing the training procedure in either the model size or the training
    epoch will lower both the training and the test risk. However, optimization is
    hard in this regime due to many local minima.

    +   - When EMC is sufficiently larger than the training sample size, we are in
    an over-parameterized regime where the model interpolates the training data. Enhancing
    the training procedure in either the model size or the training epoch will lower
    the test risk. Optimization is relatively easy with more parameters than samples,
    since there are multiple interpolating solutions and some of the local minima
    obtained at these solutions are equally good global minima. This is similar to
    the underdetermined case when there are more unknown variables than the number
    of equations.

    +   - When EMC is comparable to the number of examples in the training set, we
    are in a critically parameterized regime. Changing the training procedure may
    either increase or decrease the test risk. The fit for each feature becomes less
    reliable, which is atypical compared with the former two regimes.


    Above is the informal generalized “double descent” hypothesis recently proposed
    in the research community. Under this hypothesis, the previous “double descent”
    risk curve in figure 3.3 could now be visualized with a new zoning approach that
    consists of three different regimes: the under-parameterized regime, the critical
    regime and the over-parameterized regime. As shown in figure 3.5, the under-parameterized
    regime indicates a model with a low EMC and a relatively big dataset; further
    exploitation such as increasing model complexity is needed to reduce the test
    risk. The same monotonic relationship between the model’s EMC and the test risk
    remains the same in the over-parameterized regime. The critical regime, however,
    does not guarantee a lower test risk when enhancing the model’s training procedure.'
  merge: -1
  img_proc: true

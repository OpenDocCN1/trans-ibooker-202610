- pgno: 162
  md: 'generalization performance with limited training data from the real world with
    the convergence rate of online optimization when training with unlimited new data
    in the ideal world.


    In this section, we will delve into this potential connection, which was initially
    proposed by a recent ICLR conference paper by Nakkiran et al., 2021: “The Deep
    Bootstrap Framework: Good online Learners Are Good Offline Generalizers.” Besides
    covering the main framework and associated concepts in this paper, we will also
    experiment with different model architectures to reproduce similar results as
    represented in the paper.


    # 5.3.1 Insufficiency of classical generalization framework


    The classical generalization framework studies how to minimize the test set error
    by breaking it into two parts: the training set error and the difference between
    the two, where the latter measures the generalization gap of the model. Mathematically,
    the breakdown for a model _f_ is expressed as:


    TestError(_f_) = TrainError(_f_) + [TestError(_f_) − TrainError(_f_)]


    These two components are then studied separately. As the effective model complexity
    increases and the training set error continues to reduce, the generalization gap
    between the test and training errors will follow a double descent phenomenon for
    a modern deep neural network model fully trained with mini-batch SGD. The implicit
    regularization effect of SGD algorithm will be covered in a later chapter on regularization
    via optimization.


    However, the classical framework to understanding the generalization performance
    of deep neural networks suffers from a significant weakness. When a fully trained
    neural network starts to interpolate the training data and produces a near-zero
    training set error, i.e., TrainError ≈ 0, the breakdown will equate to the test
    set error itself, i.e., TestError = 0 + TestError, which brings us to the starting
    point and offers no further insight on the test set performance.


    A new perspective on the decomposition of test set error proposed by the paper
    is to introduce the corresponding performance of the model from an ideal world
    that provides a constant stream of new data to support optimization via online
    learning. In the sections below, we will first cover the concept of online optimization
    and then introduce the alternate decomposition approach.


    # 5.3.2 Online optimization


    *Online optimization* is an optimization scheme that iteratively updates the model
    parameters given a new training data set. One example is the mini-batch SGD algorithm
    that operates on a new batch of training data to perform weight updates without
    accessing future data in an online setting. It is a widely studied area in optimization
    and is often compared with the performance of the offline optimal optimization
    strategy that has complete knowledge of the future data.


    There are many scenarios where future data flows in from the external environment
    like a stream. For example, an airline company may need to constantly adjust its
    pricing strategy given the latest profile of its customers, competitors, and other
    external factors. Due to'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'potential data shifts, a model trained with historical data may no longer apply
    today. Such a scenario requires an online learning strategy that constantly iterates
    and evolves based on both historical data and current new data. In this regard,
    online optimization is a popular field of study when knowledge on future data
    is unavailable. It only assumes the future data are revealed incrementally, which
    contrasts to *stochastic optimization* that assigns probabilistic distributions
    to characterize the uncertainty of future data and *robust optimization* that
    uses set membership to capture the uncertainty.


    Online optimization is well studied for convex functions and is an active research
    area for non-convex functions. It analyses how quickly the optimization strategy
    reaches a *relatively* small loss over the whole population of data. In most cases,
    such relativity is quantified with reference to another offline optimization strategy
    that has access to the whole population of data. The difference in the final solutions
    (upon convergence) between the online optimizer with incrementally revealed data
    and the offline optimizer using the complete data is called *regret*. The goal
    of online optimization is thus to obtain a small regret as fast as possible. Figure
    5.9 summarizes the nature of online optimization.


    ![](img/ee98e91e6845f41077b163bec833ee40_163_0.png)


    Figure 5.9 Comparing online optimization with other types of optimization procedures.
    The online optimization only assumes the future data is revealed incrementally
    and focuses on how fast the optimizer reaches a solution and how good the solution
    is compared with an offline optimizer.


    # 5.3.3 Connecting online optimization with offline generalization


    Online optimization essentially switches the training data from a real-world scenario
    with limited data feed to an ideal world with an unlimited data flow. After plugging
    in the test error from online optimization in an ideal world, we can then formulate
    an alternate decomposition of the real-world test error as follows:


    TestError(f_real world) = TestError(f_ideal world) + [TestError(f_real world)
    – TestError(f_ideal world)]'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Here, both $f_{\text{real world}}$ and $f_{\text{ideal world}}$ share the same
    model architecture and training procedure. The only difference is that the $f_{\text{real
    world}}$ is trained to minimize the empirical loss of the available test set in
    the real world, and $f_{\text{ideal world}}$ is trained to minimize the population
    loss of the test set in the hypothetical ideal world where training data is unlimited.


    In this alternate decomposition scheme, the first component TestError($f_{\text{ideal
    world}}$) measures the performance of the online optimizer in terms of how quickly
    it can achieve a low population loss on the test set in the ideal world. Since
    the whole population of data is exposed to the learner, a good online optimizer
    will learn fast and quickly converge to reach a low population loss on the test
    set. The second component TestError($f_{\text{real world}}$) — TestError($f_{\text{ideal
    world}}$) measures the *bootstrap error*, the difference between the empirical
    loss from the real world and the population loss from the ideal world due to finite-sample
    approximation. Such approximation happens when we reuse existing samples to train
    the neural network repeatedly across different epochs.


    Through this alternate decomposition, analysis on the test set performance could
    be decoupled into the convergence speed of the online optimizer of the ideal world
    and the bootstrap error between the real world and the ideal world. Figure 5.10
    illustrates the alternate decomposition scheme and its comparison with the traditional
    scheme.


    ![](img/ee98e91e6845f41077b163bec833ee40_164_0.png)


    Under the alternate decomposition framework, the test set performance of the model
    will be primarily driven by the convergence rate of the corresponding online optimizer
    when the bootstrap error is small. For example, convolutional neural networks
    (CNN) are often better at generalizing to future data than fully connected networks
    (FCN) of similar approximation capacity. When the bootstrap error is negligible,
    we could analyze generalization differently: CNN optimizes faster than FCN in
    the online ideal world and thus generalizes better in the offline real world.'
  merge: -1
  img_proc: true

    require expensive computation. For example, $\Phi^T\Phi$ could be a vast and dense
    matrix, making it infeasible to store and reliably compute the solution (especially
    the matrix inverse) in one shot. Second, the closed-form solution itself may not
    always be available, especially for most nonlinear regression problems. In such
    cases, a common approach uses iterative methods such as gradient descent, which
    is much more computationally efficient.


    # 2.4.3 The gradient descent algorithm


    Gradient descent is an algorithm that works on a differentiable cost function
    and iteratively updates the weight vector towards a stationary point or a local
    minimum of the function. Although using gradient descent sometimes lands in a
    local minimum or a saddle point instead of the global minimum, it is still the
    most widely used algorithm in the field of deep learning. As mentioned earlier,
    the gradient is a collection of partial derivatives of the cost function to the
    current value of the respective weight in the weight vector. These partial derivatives
    measure the sensitivity of the current weights to the change in the cost function.
    When a specific entry in the gradient vector is big, the cost changes a lot given
    a slight change in that weight entry.


    When plotting the cost as a function of the weights, the gradient vector indicates
    the direction of the steepest descent towards a local minimum in its neighborhood.
    In the case of a single entry in the weight vector, the gradient would correspond
    to the slope of the cost function at the current weight. This means that the gradient
    vector provides two types of information regarding the next iteration: the direction
    to change the weights and the'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'magnitude of the change. To utilize these two types of information, the gradient
    descent algorithm adopts the following scheme to iteratively update the weights:


    ```

    w ← w - η∇Q(w)

    ```


    where the ← sign indicates assigning the value on the right-hand side to the left
    hand side. Using this formula, a new weight vector **w** gets calculated by plugging
    the current value of **w** in **w** - η∇Q(**w**). η is a small positive number
    that is often called the learning rate or the step size. It is a hyper-parameter
    used to control the magnitude of each update. Since the objective is to minimize
    the cost function, the direction of travel is corrected by the minus sign in the
    equation. Using this update scheme, the next iteration would always move towards
    a local optimum. This intuition is conveyed in figure 2.12, which shows the cost
    function used in the linear regression with respect to a single parameter, each
    with a different starting point.


    ![](img/ee98e91e6845f41077b163bec833ee40_49_0.png)


    Figure 2.12 Visualizing the gradient descent update algorithm in the univariate
    linear regression. Due to the design of the update equation, the new weight vector
    will always move towards the optimal weight vector, given a proper step size in
    each update. In other words, the process is iteratively looking for a better model
    that is closer to the best one.


    In the case of the univariate linear regression, the gradient descent update will
    involve two parameters to form a straight-line model: the intercept or offset
    term w₀ and the slope term w₁. Following our previous process on model training,
    we will first generate a prediction ŷᵢ = w₀ + w₁xᵢ for the iᵗʰ observation based
    on a randomly initialized set of weights, followed by comparing with the true
    target value yᵢ to produce an error term eᵢ = yᵢ - ŷᵢ. The cost function'

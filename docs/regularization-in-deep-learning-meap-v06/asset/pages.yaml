  md: "added to the first fully connected layer to improve the training performance.\
    \ See figure 5.6 for an illustration. Also, note that `RELU` and `DROPOUT` layers\
    \ are not physical layers as they do not contain any weight.\n\n![](img/ee98e91e6845f41077b163bec833ee40_156_0.png)\n\
    \n# Figure 5.6 Illustrative architecture of the LeNet variant model.\n\nThe following\
    \ code listing shows the implementation of the network as a class. We double the\
    \ depth of feature maps for each `CONV` layer as a common practice on parameter\
    \ setting for `CONV` layers. Such an operation could increase the expressive power\
    \ of the network to learn features from different perspectives. As the feature\
    \ maps become deep, the 2x2 `MAXPOOLING` layer further halves the width and height\
    \ of each feature map to reduce its spacial dimension. The final output is the\
    \ ten output nodes of the last fully connected layer corresponding to the ten\
    \ classes of objects.\n\n# Listing 5.6 Implement the LeNet architecture\n\n```\n\
    class LeNet(nn.Module):\n    def __init__(self):\n        super().__init__()\n\
    \        self.conv1 = nn.Conv2d(in_channels=3, out_channels=16, kernel_size=3,\n\
    \                                stride=1, padding=1) #A\n        self.conv2 =\
    \ nn.Conv2d(16, 32, 3, 1, 1, padding=1)\n        self.conv3 = nn.Conv2d(32, 64,\
    \ 3, 1, 1, padding=1)\n        self.fc1 = nn.Linear(4*4*64, 500) #B\n        self.dropout1\
    \ = nn.Dropout(0.5)\n        self.fc2 = nn.Linear(500, 10) #C\n\n    def forward(self,\
    \ x):\n        x = F.relu(self.conv1(x)) #D\n        x = F.max_pool2d(x, 2, 2)\
    \ #E\n        x = F.relu(self.conv2(x))\n        x = F.max_pool2d(x, 2, 2)\n \
    \       x = F.relu(self.conv3(x))\n        x = F.max_pool2d(x, 2, 2)\n       \
    \ x = F.view(-1, 4*4*64) #F\n        x = F.relu(self.fc1(x))\n        x = self.dropout1(x)\n\

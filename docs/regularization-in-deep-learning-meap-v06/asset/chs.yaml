  \ `criterion()` 函数，用于计算预测的总损失作为各任务特定损失的总和。然后在 `training()` 中，我们使用 Adam 优化器，因为它对学习率设置不太敏感，并对每个单独损失应用交叉熵损失。训练在每个\
  \ epoch 的每个批次中以嵌套循环方式执行，其中我们应用在之前示例中见过的常规训练流程。最后，我们返回每个 epoch 的最终组合损失。我们在单个 GPU\
  \ 实例上运行总共 10 个 epoch 的训练流程，大约需要半小时。所以，在等待训练完成时，不妨拿杯咖啡。\n\n### 清单 6.10 训练 MTL 模型\n\
  \n```\ndef criterion(loss_func, outputs, pictures):\n    losses = 0\n    for i,\
  \ key in enumerate(outputs): #A\n        losses += loss_func(outputs[key], pictures['labels'][f'label_{key}'].to(device))\n\
  \    return losses\n\ndef training(model, device, lr_rate, num_epochs, train_loader):\n\

  \ `Dataset` 类，该类在实例化时可以接受输入张量和转换作为参数。在下面的代码清单中，我们定义了一个名为 `CustomTensorDataset` 的类，它继承自\
  \ `torch.utils.data.Dataset` 类，并包含三个内置函数：`__init__` 函数在实例化时存储输入数据和转换，`__getitem__`\
  \ 用于通过索引检索样本，`__len__` 函数返回数据集的大小。\n\n### 清单 5.9 构建支持转换操作的自定义张量数据集\n\n```\nclass\
  \ CustomTensorDataset(torch.utils.data.Dataset):\n    def __init__(self, tensors,\
  \ transform=None):\n        self.tensors = tensors\n        self.transform = transform\n\
  \n    def __getitem__(self, index):\n        x = self.tensors[0][index]\n      \
  \  if self.transform:\n            x = self.transform(x)\n        y = self.tensors[1][index]\n\
  \        return x, y\n\n    def __len__(self):\n        return self.tensors[0].size(0)\n\
  ```\n\n由于文件以 `.npz` 结尾并以 `numpy` 格式存储，我们可以加载它们并转换为 `tensor` 格式，从而构建数据加载器。每个输入图像张量在传递给\
  \ `CustomTensorDataset` 之前，都会通过 `permute` 函数从通道后置格式更改为通道前置格式。我们还将保持与之前示例相同的配置，例如批次大小、学习率和基本转换，前提是输入图像首先转换为\

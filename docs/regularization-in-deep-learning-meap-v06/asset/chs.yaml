  ### 5.3.6 模型测试\n\n模型测试涉及与训练类似的流程：我们需要构建一个自定义数据加载器，它提供测试数据的批次，以及预定义的转换。在此示例中，我们使用最后一个文件（`part5.npz`）作为测试集，并采用相同的批次大小和转换配置。\n\
  \n随后，我们遍历所有 100 个模型，并将每个模型循环遍历整个测试集，以计算并存储相应的性能指标。以下代码清单包含测试过程。有关完整详细信息，请参阅位于 https://github.com/jackliu333/regularization_in_deep_learning/blob/main/Chapter_5_1.ipynb\
  \ 的伴随笔记本。\n\n### 代码清单 5.11 测试模型性能\n\n```\ntest_loss_history_5m = []\ntest_error_history_5m\
  \ = []\ntest_softerror_history_5m = []\ntest_loss = 0.0\ntest_accuracy = 0.0\ntest_error\
  \ = 0.0\ntest_softerror = 0.0\nfor i in range(1,101):\n    filename = f'models/model_{i}.pkl'\
  \ #A\n    model = pickle.load(open(filename, 'rb'))\n    with torch.no_grad(): #B\n\
  \        for idx, (inputs, labels) in enumerate(test_loader):\n            inputs\
  \ = inputs.to(device)\n            labels = labels.to(torch.int64).to(device)\n\
  \            outputs = model(inputs).to(device)\n            loss = criterion(outputs,\
  \ labels)\n            _, preds = torch.max(outputs, 1)\n            correct_class_prob\
  \ = torch.exp(outputs[torch.arange(len(outputs)),\n            labels.data]) / \\\
  \n            torch.sum(torch.exp(outputs), 1) #C\n            test_loss += loss.item()\n\
  \            test_accuracy += torch.sum(preds == labels.data)\n            test_softerror\
  \ += torch.sum(correct_class_prob)\ntest_loss = test_loss/len(test_loader)\ntest_error\
  \ = 1 - test_accuracy/(len(test_loader)*100) #D\ntest_softerror = 1 - test_softerror/(len(test_loader)*100)\n\
  test_accuracy = test_accuracy.float()/((len(test_loader))*100)\ntest_loss_history_5m.append(test_loss.item())\n\
  test_error_history_5m.append(test_error.item())\ntest_softerror_history_5m.append(test_softerror.item())\n\
  print(f\"====== model {i} ======\")\nprint(\"Test loss: {:.4f}, accuracy: {:.4f},\
  \ error {:.4f}, softerror {:.4f}\".format(\n      test_loss, test_accuracy.item(),\
  \ test_error.item(), test_softerror.item()))\ntest_loss = 0.0 #E\ntest_accuracy\
  \ = 0.0 #E\ntest_error = 0.0 #E\ntest_softerror = 0.0 #E\n```\n\n#A 加载当前模型检查点\n\
  #B 在整个测试集上评分\n#C 获取当前批次的 softmax 概率\n#D 计算测试集中错误预测的比例\n#E 重置模型级指标\n\n同样，如以下代码片段所示，我们将测试集上的所有性能指标存储在名为\
  \ `stats_cifar10_5m_test.pkl` 的字典中，并将其下载到本地驱动器。主要原因是，此操作在单个 GPU 实例上运行需要 _小时_。通过在测试集评分代码后立即执行下载操作，我们可以确保结果立即保存到本地磁盘，保持浏览器打开，并偶尔回来检查状态，而无需过于担心会话超时。使用\
  \ Google Colab 只是让编码环境更加便捷的一种方式；如果我们有本地 GPU 实例来运行代码，事情会变得容易得多。\n\n```\nstats_cifar10_5m_test\
  \ = {\"test_loss_history_5m\":test_loss_history_5m,\n \"test_error_history_5m\"\
  :test_error_history_5m,\n \"test_softerror_history_5m\":test_softerror_history_5m}\n\
  stats_name = \"stats_cifar10_5m_test.pkl\"\nwith open(stats_name, 'wb') as file:\n\
  \    pickle.dump(stats_cifar10_5m_test, file)\nfiles.download(\"/content/stats_cifar10_5m_test.pkl\"\
  )\n```\n\n### 5.3.7 现实世界与理想世界之间的 Bootstrap 误差\n\n我们现在可以可视化现实世界与理想世界之间相同数量的 SGD 迭代过程中的训练和测试集性能。请注意，我们在整个训练和测试过程中只取\
  \ 100 个快照；中间的间隔会由绘图函数自动平滑插值。然而，在原始论文中，每个 SGD 迭代都映射到一个模型检查点，并针对测试集进行评分，这需要大得多的计算能力。因此，我们的实验作为更精细版本的近似。\n\
  \n### 代码清单 5.12 绘制 CIFAR10 与 CIFAR-5m 之间的训练和测试损失曲线\n\n```\nListing 5.12 Plot training\
  \ and test loss curves between CIFAR10 and CIFAR-5m\nstats_cifar10 = pickle.load(open(\"\
  stats_cifar10.pkl\", 'rb'))\nstats_cifar10_5m_training = pickle.load(open(\"stats_cifar10_5m_training.pkl\"\
  , 'rb'))\nstats_cifar10_5m_test = pickle.load(open(\"stats_cifar10_5m_test.pkl\"\
  , 'rb'))\nplt.rcParams[\"figure.figsize\"] = (15,6)\nfig=plt.figure()\nplt.subplot(121)\n\
  plt.plot(stats_cifar10['training_loss_history'], label='training loss - CIFAR10')\n\
  plt.plot(stats_cifar10_5m_training['training_loss_history_5m'], label='training\
  \ loss - CIFAR-5m')\nplt.legend()\nplt.subplot(122)\nplt.plot(stats_cifar10['test_loss_history'],\
  \ label='test loss - CIFAR10')\nplt.plot(stats_cifar10_5m_test['test_loss_history_5m'],\
  \ label='test loss - CIFAR-5m')\nplt.legend()\n```\n\n输出如图 5.11 所示，其形状与使用数据增强进行训练时的情况相似。具体而言，当使用\
  \ CIFAR10 时，我们在大约第 50 个 epoch 之后看到测试损失增加，这表明出现了过拟合的迹象。然而，使用 CIFAR-5m 训练的模型会继续改进，因为它们观察到了源源不断的新样本。\n\
  \n\n\n\n\n![](img/ee98e91e6845f41077b163bec833ee40_172_0.png)\n\n![](img/ee98e91e6845f41077b163bec833ee40_172_1.png)\n\
  \n图 5.11 比较训练损失和测试损失曲线。使用 CIFAR-10 训练的模型在第 50 个 epoch 后出现过拟合，而使用 CIFAR-5m 中新样本训练的模型继续改进。\n\
  \n让我们来看看（硬）分类误差。如图 5.12 所示，向模型暴露新数据确实可以支持持续学习，这从使用 CIFAR-5m 训练时测试误差的下降中可以看出。由于 CIFAR-10\
  \ 数据有限，模型最终开始对训练集进行插值，并在测试集准确率方面趋于平稳。\n\n![](img/ee98e91e6845f41077b163bec833ee40_172_2.png)\n\
  \n![](img/ee98e91e6845f41077b163bec833ee40_172_3.png)\n\n图 5.12 比较硬分类误差曲线。\n\n现在我们来看看软分类误差，这是我们对引导误差诊断的主要关注点。如图\
  \ 5.13 所示，测试集的软误差起初很小，然后略微增加，直到达到一个相对稳定的值，这从两条曲线之间的差距（约 0.05）可以看出。尽管这个差距不如原论文中那么可以忽略不计，但它仍然是一个较小且稳定的差距。确实，作者提到了这种方法的局限性，即并非所有模型架构都能产生较小的引导误差。仍有多种因素决定两个世界之间的差距，这仍然是一个令人兴奋的研究领域。\n\
  \n![](img/ee98e91e6845f41077b163bec833ee40_173_0.png)\n\n图 5.13 比较软分类误差曲线。\n\n我们已经表明，我们的\
  \ LeNet 模型的引导误差相对较小，并在整个训练过程中保持稳定。在替代分解框架下，我们假设，现实世界中测试集误差较低的模型，即离线泛化性能良好的模型，将对应于理想世界中快速收敛的模型，该模型能迅速达到较低的测试集误差。同样，在经验损失中泛化性能差的模型，将对应于在总体损失中收敛缓慢的在线学习者。让我们看一个这样的示例。\n\
  \n### 5.3.8 卷积神经网络中的隐式偏差\n\n在比较卷积神经网络及其等效全连接网络的网络表达能力时，即一个能够表示卷积网络所能表示的所有函数的全连接网络，经验证据表明卷积网络倾向于获得较低的经验损失，从而泛化得更好。一个常见的解释是，当网络开始对训练集进行插值时，SGD\
  \ 通过落入平坦的局部极小值区域而非陡峭的山谷，在卷积网络中诱导了一种隐式偏差。这样一个平坦区域碰巧是一个可泛化区域。这是一种使用优化进行（隐式）正则化的重要视角，我们将在后续章节中进一步分析。\n\
  \n我们还可以使用替代分解框架获得另一种视角。与其评估使用 SGD 对卷积网络和全连接网络所获得的经验极小值的（隐式）质量，不如通过研究 SGD（显式）优化总体损失的速度来表征泛化性能。\n\
  \n在以下代码清单中，我们构建了一个名为 `LeNet_FC` 的全连接网络类，它包含五个全连接层，总共包含 95,748,510 个参数。\n\n另一方面，原始\
  \ LeNet 有 541,094 个参数。这两个网络之间参数数量的相对比率约为 1/200，这与原论文中使用的比率相似。通过创建一个大得多的全连接网络，我们希望\
  \ LeNet_FC 在表达能力和近似能力方面涵盖 LeNet。然后，我们可以在保持所有其他训练配置相同的同时，比较它们在理想世界中减少总体损失的优化速度。\n\
  \n清单 5.13 构建 LeNet 的全连接版本\n\n```\nclass LeNet_FC(nn.Module):\n    def __init__(self):\n\
  \        super().__init__()\n        self.fc1 = nn.Linear(32*32*3, 10000) #A\n \
  \       self.fc2 = nn.Linear(10000, 5000)\n        self.fc3 = nn.Linear(5000, 2500)\n\
  \        self.fc4 = nn.Linear(2500, 1000)\n        self.fc5 = nn.Linear(1000, 10)\
  \ #B\n        self.dropout1 = nn.Dropout(0.5)\n\n    def forward(self, x):\n   \
  \     x = x.reshape(-1, 32*32*3) #C\n        x = F.relu(self.fc1(x))\n        x\
  \ = F.relu(self.fc2(x))\n        x = F.relu(self.fc3(x))\n        x = F.relu(self.fc4(x))\n\
  \        x = self.dropout1(x)\n        x = self.fc5(x)\n        return x\n```\n\n\
  A 输入是 32×32 通道在后的彩色图像\nB 10 个输出节点，映射到 10 个类别\nC 在开始时将图像展平为全连接层的一维输入\n\n在接收到通道在后的彩色图像后，LeNet_FC\
  \ 首先会将其重塑为数组，并应用一系列全连接层，其大小大约每次减半，直到最后一层。然后，我们可以使用 CIFAR-5m 遵循相同的训练和测试流程，并获得一系列作为\
  \ pickle 对象保存到磁盘的性能指标。同样，当我们在 Google Colab Pro 上使用单个 GPU 实例执行随附笔记本中的完整代码时，预计需要几个小时的运行时间。\n\
  \n图 5.14 显示了使用 CIFAR-5m 的两种架构的训练损失和测试损失曲线。LeNet_FC 优化训练损失更快，但在测试损失上收敛较慢，尽管它比 LeNet\
  \ 具有更高的表达能力。\n\n![](img/ee98e91e6845f41077b163bec833ee40_175_0.png)\n\n图 5.14 比较在\
  \ CIFAR-5m 上训练的 LeNet 和 LeNet_FC 的训练集和测试集损失曲线。\n\n我们可以通过绘制硬分类和软分类误差来进一步证实这一观察，如图\
  \ 5.15 和 5.16 所示。这两个图都表明，LeNet 的卷积特性比 LeNet_FC 更快地优化总体损失。\n\n![](img/ee98e91e6845f41077b163bec833ee40_175_1.png)\n\
  \n图 5.15 比较使用 CIFAR-5m 训练的 LeNet 和 LeNet_FC 的训练集和测试集硬分类曲线。\n\n![](img/ee98e91e6845f41077b163bec833ee40_176_0.png)\n\
  \n图 5.16 比较使用 CIFAR-5m 训练的 LeNet 和 LeNet_FC 的训练集和测试集软分类曲线。\n\n## 5.4 总结\n\n- 通过数据进行正则化是指一系列有助于构建正则化模型的基于数据的方法\n\
  - 对数据的变换可以应用于输入矩阵、输出、深度神经网络中的隐藏层激活值以及这些组件的组合\n- 为正则化目的转换输入矩阵时，水平处理包括手动特征工程和自动特征提取，垂直处理包括重复采样（引导法和过采样）和数据增强\n\
  - 标签平滑是一种技术，它将“硬”的独热编码目标平滑为由受均匀分布噪声扰动的“软”目标，该噪声由权衡超参数控制\n- 数据增强旨在通过对原始数据应用轻微变换来生成人工样本；它是现代计算机视觉任务中事实上的数据预处理步骤\n\
  - 数据增强有助于正则化模型训练过程，并在使用 CIFAR-10 的图像分类中构建更具泛化能力的模型\n- 深度引导框架通过将现实世界中的离线泛化性能与理想世界中的在线优化速度相联系，为泛化提供了另一种视角\n"
- "# 通过模型进行正则化\n\n## 本章内容\n\n- 归纳偏差及其在卷积神经网络中的应用\n- 将 dropout 应用为正则化技术以改善模型性能\n- 使用多任务学习进行隐式正则化\n\
  \n当使用深度神经网络等过参数化模型时，无论是显式还是隐式正则化，都对实现良好的泛化性能至关重要。如前一章所述，数据增强在图像分类等视觉识别任务中有望带来性能提升。然而，使用可用的训练数据集生成有价值的人工数据集，仍然取决于在数据多样性方面对总体数据的良好覆盖。当训练集极其有限时，我们可增强的内容不多。\n\
  \n例如，考虑图 6.1 中最小训练集的情况，这也是我们在第 1 章中遇到的同一张图。真实的底层函数是一条曲线，对我们不可用。在这种情况下，我们会避免模型中不必要的复杂性，因为它很容易过拟合包含六个数据点的训练数据集。当训练数据进一步减少时，同样的推理也适用。在极端不确定性下，最好保持保守并避免不必要的复杂性。\n\
  \n\n\n\n\n> 面对极端不确定性时仍偏好的同一线性回归模型\n\n> 这仍是我们想要学习的真实函数\n\n图 6.1 在仅有六个数据点可用时呈现相同场景。简单线性回归模型优于过于复杂的模型，如深度神经网络。\n\
  \n上面的例子很好地体现了引入_归纳偏置_，这是模型在训练过程中所做的一组隐式或显式假设。通过将模型限制为简单线性模型，我们剥离了更高阶多项式等不必要的复杂性，最终构建了一个不那么复杂的模型。例如，如果我们要学习形式为\
  \ $f(x) = w_0 + w_1x + w_2x^2 + w_3x^3$ 的模型，在训练集极其有限时偏好线性直线拟合的归纳偏置将允许我们直接设置 $w_2\
  \ = w_3 = 0$。换句话说，我们在设计之初就指定了一个线性模型。\n\n除了对模型函数形式的假设外，线性模型还假设误差服从正态分布。也就是说，线性回归拟合产生的误差服从均值为零、方差恒定的正态分布。这种假设使线性回归模型达到最优，即它可证明是无偏的且方差最小。\n\
  \n归纳偏置在_贝叶斯推断_中也起着重要作用，后者是统计学的一个特定领域，根据先验分布和数据的观测似然来研究感兴趣参数的后验分布。如果要估计参数 $w$，贝叶斯统计为\
  \ $w$ 赋予一个分布，作为对其可能值的概率性信念，这与试图为 w 估计单一最佳值的原生神经网络不同。在观察任何数据之前，我们会为 w 假设一个特定的先验分布（及其控制参数），这可能是一个简单的标准正态分布\
  \ w~N(0,1)，或者基于我们对研究系统的先验知识或领域专业知识的其他形式。\n\n为 w 假设特定先验分布后，我们将根据观测到的数据（特别是我们可用数据的似然）更新该先验分布，形成后验分布。例如，使用贝叶斯法则，观察一些数据后，w\
  \ 的更新后验分布可能为 N(0.2,0.9)。因此，先验分布作为一种有帮助的归纳偏置，用于热启动估计过程，该过程会以由观测数据校准的后验分布形式进行迭代更新。因此，拥有一个良好的先验分布可以极大地加速找到最佳后验分布的过程。图\
  \ 6.2 说明了这个例子。\n\n![](img/ee98e91e6845f41077b163bec833ee40_179_0.png)\n\n图 6.2 使用贝叶斯法则更新参数的先验分布，并在观察一些数据后获得后验分布。在观察任何数据之前，先验分布作为一种重要的归纳偏置，可以极大地加速获得最佳后验分布的过程。\n\
  \n本章将重点介绍典型卷积神经网络中使用的不同类型的归纳偏置。我们将先介绍模型架构中引入的归纳偏置所带来的平移不变性和权重共享等属性，接着详细讨论一种常用的正则化技术——丢弃法（dropout），它促进稀疏表示。我们还将在本章第二部分将讨论扩展到多任务学习，展示详细示例和实现细节，说明如何从模型设计角度实现正则化。\n\
  \n## 6.1 卷积神经网络中的归纳偏置\n\n归纳偏置是一种基于领域专业知识的假设，用于推广模型在测试集上的预测性能。多个领域特定的应用在模型开发过程中需要专家输入。例如，法官将公平与正义融入司法模型（用于预测法院量刑）中，医生在使用模型自动化诊断决策时会强调\
  \ X 光图像中的特定区域或模式。\n\n这也被称为_人机回路_模型开发，领域专家密切参与不同的建模阶段，例如建模前的偏好设置或建模后的调整。Liu 等人在其题为“Limousine\
  \ Service Management: Capacity Planning with Predictive Analytics and Optimization”的论文中的一项最新工作表明，让领域专家参与数据驱动建模可以显著提高最终生产模型的有效性，并带来更高的满意度和运营效率。\n\
  \n请回顾统计学中的老格言：所有模型都是错的，但有些是有用的。由于模型本质上是我们假设用于近似底层数据生成函数的假设，因此归纳偏置存在于所有模型中，以显式或隐式的形式表达。例如，线性模型假设权重的线性性，而非线性模型根据所用模型应用非线性变换。因此，归纳偏置使我们能够从现实世界或基于过去经验为模型注入充分的外部知识，特别是在训练数据不足以支持适当训练过程时。\n\
  \n让我们重新审视全连接神经网络的结构，特别是我们在任何神经网络设计中所放置的归纳偏置。\n\n### 6.1.1 重新审视全连接网络\n\n考虑我们在第 4\
  \ 章中讨论过的同一个两层全连接网络。如图 6.3 所示，该网络具有一个包含五个节点的隐藏层，每个节点对先前输入特征进行加权求和，然后通过指定激活函数进行非线性变换。这通过放大隐藏层中第一个节点的操作来阐明，生成\
  \ \\( f^1_1 = \\phi(b^1_1 + w^1_1 x) \\)。\n\n![](img/ee98e91e6845f41077b163bec833ee40_181_0.png)\n\
  \n图 6.3 一个包含一个输入节点、五个隐藏节点和一个输出节点的两层全连接神经网络。隐藏层中的每个节点执行加权求和，随后进行非线性变换，这通过放大隐藏层中第一个节点来表示。\n\
  \n事实证明，全连接网络（FCN）在层间数据流动方面具有很少的归纳偏置。当输入特征进入全连接网络时，我们几乎不假设它们应如何与权重交互，除了遍历所有元素的乘法操作外。这导致了其灵活且富有表现力的设计和近似能力，这也得到了第\
  \ 4 章中介绍的通用逼近定理的支持；通过将隐藏层中的节点数扩展到任意程度，全连接神经网络可以逼近任意形状的函数。\n\n但是，在典型神经网络的结构和优化方面，设计模型架构时我们仍然放置了一些归纳偏置。从架构上讲，假设同一层内的节点永不相互交互。隐藏层中的特征图包含独立特征，这些特征仅参与前向和后向传播，但绝不与同一隐藏层中的邻居交谈。此外，典型神经网络采用有向无环图的形式，如图\
  \ 6.3 所示，输入从左到右处理，直到到达最终层进行成本计算。这些架构偏好构成了我们在日常开发中使用的许多类型神经网络中的隐式归纳偏置。\n\n从优化角度来看，梯度下降已成为训练神经网络时事实上的优化方法，表现出对易于基于梯度的方法训练的模型的归纳偏置。特别是，随机（小批量）梯度下降算法是一种流行的选择，因为它具有简单快速的训练时间以及隐式正则化效应，诱导出在不同批次中对最优解位置表现出鲁棒性的模型（关于此将在后续正则化章节中进一步讨论，通过\n\
  \n\n优化）。此外，在训练网络前初始化权重时，大多数情况下我们会选择流行的权重初始化器，例如“He initialization”。这些经验最佳实践构成了我们在模型训练过程中所放置的归纳偏置。\n\
  \n### 6.1.2 卷积神经网络中的平移不变性\n\n卷积是一种独特的操作，旨在有效地从图像数据的几何结构中学习，假设为2D或3D卷积操作。卷积层使用的参数比全连接层少得多，并享有跨不同输入特征的权重共享优势。也就是说，多个特征共享相同的权重，从而显著减少神经网络所使用的有效权重数量。具体而言，卷积是一种数学操作，其中将一个函数传递到一系列值上，这个过程称为对函数进行卷积。它也适用于一维输入，例如序列数据，其中可以使用1D卷积来捕捉数据内部的依赖关系。让我们重新审视卷积操作，并讨论它如何在图像识别任务中超越全连接层。\n\
  \n事实证明，我们可以使用特定类型的归纳偏置（即卷积神经网络中的卷积和池化操作）来调整香草全连接神经网络的设计考量，这在处理图像数据及其他领域时被证明非常有效。调整设计考量会限制神经网络表现出特定的期望属性，例如平移不变性，即无论图像中特定对象位于何处或被移动到何处，网络都能识别它。换句话说，网络对输入图像中对象的位置平移具有不变性，并可以获得相同的分类结果。这是卷积神经网络的关键优势之一，基于这样一个强先验假设：对象的位置对最终分类结果无关紧要。\n\
  \n图6.4说明了在MNIST数据集上具有高准确率的训练有素的CNN的平移不变性属性。当暴露于数字8位于不同位置的图像时，像CNN这样的平移不变模型会生成相同的类别标签8。这意味着，对于FCN来说，要正确分类包含数字8的图像，FCN模型在初始训练过程中必须遇到过相似位置的相似数字8，尽管经过足够长时间训练的FCN\
  \ *可能* 会发现位置不变性属性。另一方面，CNN在设计上对数字的位置不敏感。这主要归功于局部滤波器（也称为内核），它们能够捕捉并利用数字8上的基本信号，无论其位于何处。然而，像FCN这样的平移变体模型不一定会产生相同的分类结果。这意味着，以一致的方式打乱图像数据中的像素，由于其无结构感知特性，最终会得到相同的基于FCN的模型。由于未能捕捉图像上数字8的空间关系，FCN将难以识别同一对象，直到经过足够长时间的训练以发展有意义的表示，并自行\
  \ *学习* 该属性。\n\n![](img/ee98e91e6845f41077b163bec833ee40_183_0.png)\n\n图6.4 典型的卷积神经网络对输入图像中不同位置上的对象（数字8）的平移具有不变性。它可以将数字8识别为相同的标签，而在训练基于FCN的模型时，这不容易实现。前馈架构不理解其输入中的结构或顺序。因此，当向前馈网络展示一组图像及其关联标签并进行训练时，如果我们以一致的方式打乱图像中的像素值后再进行训练，我们也会得到相同的结果。结构感知仅在基于CNN的模型中构建。\n\
  \n因此，在不改变分类结果的情况下移动对象是卷积神经网络中表现出的一种基本归纳偏置。无论对象位于何处，一组滤波器都会在整个图像上移动（从左到右，从上到下）以执行卷积操作。当遇到特定的类似边缘的区域或其他感兴趣的形状时，滤波器中的特定节点会被激活，产生较大的值，在池化操作后“击败”其邻居。因此，特定激活发生的位置（如果有）并不重要，因为它最终会被池化到下一层。只要特定节点被触发，经过充分训练的CNN就能捕捉此类激活，并意识到噪声是由于随机平移引起的。因此，平移不变性是CNN中嵌入的自然属性。\n\
  \n除了平移不变性，我们还可以通过将同一对象旋转一定角度来促进CNN中旋转不变性的学习。只要旋转对象的新图像仍然属于同一类别，我们就可以生成更多人工且有用的图像，供模型学习并掌握所需的旋转不变性属性。事实上，第5章中涵盖的所有不同的数据增强技术，都是为了在识别对象时赋予模型某种不变性和鲁棒性。这些归纳偏置是重要的加速器，可帮助模型理解对象的不同空间连接以及当前对象识别任务特有的其他视觉属性。其他不变性属性，例如尺度不变性和光照不变性，也可以通过数据增强提供相应的增强训练数据，在结果模型中以类似方式发展。\n\
  \n请注意，旋转和尺度不变性属性也可以使用CNN中的最大池化操作来学习。例如，当输入图像包含不同程度的旋转或尺度时，隐藏层中不同的滤波器会被激活，从而输出较大的值。最大池化层将从所有滤波器中选择最大激活值，从而对输入图像中的可能旋转或尺度显示出不变性。遵循相同的推理，最大池化连同即将讨论的卷积操作，也对CNN的平移不变性有所贡献。\n\
  \n为了实现这些期望的属性，我们需要以一种方式限制FCN中的连接，以便使网络能够学习局部结构并掌握不变性属性。具体而言，我们希望在神经网络中嵌入针对不同类型层的关系性归纳偏置。一方面，我们利用输入数据中几何对象的局部性，使得结果CNN模型对空间平移具有不变性。另一方面，在循环神经网络（RNN）中利用对象的顺序性（例如，自然语言处理中的标记、时间序列中的观测值），使得结果模型对时间平移具有不变性。\n\
  \n在深入探讨如何限制FCN以显示期望属性之前，让我们更详细地了解卷积操作。事实上，正如您将在下一节中看到的那样，由于卷积操作，CNN是一种特殊类型的受限FCN。\n\
  \n### 6.1.3 理解卷积算子\n\n卷积算子是实现平移不变性属性的主要驱动力之一。回顾第4章中的卷积工作流程图，这里也在图6.5中展示以方便参考。关键要点是，我们定义一个内核/滤波器与不同的输入补丁依次进行卷积，并在特征图中生成结果特征。每一次卷积都由内核与输入补丁之间的逐元素乘法组成，随后进行求和操作。\n\
  \n\n\n\n![](img/ee98e91e6845f41077b163bec833ee40_185_0.png)\n\n图 6.5 卷积操作示意图。\n\n\
  我们也可以用类似下面的方式来表达 3x3 卷积核的整体卷积运算，这描述了互相关运算的机制，互相关运算是另一种与卷积运算高度相似的操作，有助于说明数学运算。唯一的区别是，CNN\
  \ 会在水平和垂直方向上翻转滤波器，导致 $IN_{i+x,j+y}$ 变为 $IN_{i-x,j-y}$。\n\n$Out_{i,j} = b + \\sum_{x=0}^2\
  \ \\sum_{y=0}^2 IN_{i+x,j+y} W_{x,y}$\n\n在这个表达式中，$IN` 表示输入矩阵，$W` 表示权重的卷积核矩阵，$Out`\
  \ 表示结果特征图，该特征图再次作为后续层的输入矩阵。有两组从零开始的索引：$(i,j)$ 作为在输入补丁上移动的全局索引，$(x,y)$ 作为在输入补丁元素上移动的局部索引。$(i,j)$\
  \ 唯一地定位特征图 $Out` 中的每个特征，如图 6.5 中的卷积示例所示，$Out_{0,0} = 3$。由于 $IN` 是 6x6，$W` 是 3x3，如果卷积核依次与每个输入补丁进行卷积，即使用步长为\
  \ 1，则结果输出 $Out` 是 4x4，使得 $i` 和 $j` 都在 0 到 3 的范围内。我们将稍后讨论维度的变化。\n\n对于每次卷积操作，$x` 和\
  \ $y` 都在 0 到 2 之间变化，总共产生 9 种组合，即输入补丁和卷积核矩阵之间进行 9 次逐元素乘法。因此，索引对 $(x,y)$ 唯一地标识输入条目\
  \ $IN_{i+x,j+y}$（在全局输入补丁索引 $(i,j)` 之上）和权重条目 $W_{x,y}$，执行逐元素乘法 $IN_{i+x,j+y}W_{x,y}`\
  \ 和求和 $\\sum_{x=0}^2 \\sum_{y=0}^2 IN_{i+x,j+y}W_{x,y}$。我们还注意到，偏置项 $b` 作为输出特征的全局调整被加入。\n\
  \n有几个超参数我们可以针对卷积算子进行设置，以决定卷积核如何与输入补丁进行卷积。具体来说，我们可以改变步长以控制滤波器在图像上移动的幅度。例如，前一个示例使用步长为\
  \ 1，因为卷积核每次移动一个像素（从左到右，从上到下）。通过将步长参数设置为 2，卷积核将跳过下一个像素并“跳”到再下一个像素。更大的步长会导致更小的特征图，因为卷积核与输入补丁之间的逐元素乘法数量减少。\n\
  \n此外，由于图像边缘的像素仅与卷积核卷积一次，我们可以调整填充参数来解决这个问题，并确保所有像素与卷积核的交互次数相同。例如，我们可以在输入图像边缘周围添加一层值全为零的额外像素。这称为零填充，或同尺寸填充，它在输入图像外部添加一圈零填充，如果我们希望在结果输出特征图中保留输入图像的形状/维度，以便捕获输入图像边缘沿线的信息，则这特别有用。填充在边缘周围引入零，以扩大输入矩阵的虚拟大小。\n\
  \n请注意，填充的另一个优势是图像的维度从一层到下一层都被保留，我们不必过分担心张量的维度。\n\n图 6.6 说明了这两个调整参数，其中我们设置填充为 1，步长为\
  \ 2。这些参数在定义卷积层时预先设置。它们本质上影响结果输出数组的形状，并属于神经网络中不断增长的超参数列表。虽然获得最佳超参数配置是一个需要试错的繁琐过程，但我们通常会选择在许多领域似乎效果良好的设置。例如，在早期隐藏层中学习低级局部结构时，使用\
  \ 3x3 卷积核、零填充和步长为 1。\n\n![](img/ee98e91e6845f41077b163bec833ee40_186_0.png)\n\n\
  图 6.6 在卷积算子中调整填充和步长参数。\n\n如何确定卷积层的输出维度？为了实现这一点，我们需要知道输入数组和卷积核的大小，以及其填充和步长的参数设置。计算输出形状\
  \ $D_{out}$ 的一个有用公式如下所示：\n\n$D_{out} = \\lfloor(D_{in} - k + 2p)/s\\rfloor + 1$\n\
  \n其中，$D_{in}$ 表示输入图像的宽度或高度（假设为方阵），$k` 是卷积核的宽度或高度，$p` 是输入图像水平或垂直边界上的填充，$s` 是卷积核的步长。结果随后使用地板运算符\
  \ $\\lfloor \\rfloor$ 向下舍入到最接近的整数，然后加一。欢迎将此公式代入上述示例中进行验证，看看是否正确。\n\n让我们将此公式应用于前一个示例，以更好地理解输入和输出之间的维度转换。如图\
  \ 6.6 中的示例所示，我们有输入大小 $D_{in} = 5$，卷积核大小 $k = 3$，填充大小 $p = 1$，步长 $s = 2$。应用公式可得 $D_{out}\
  \ = 3$，输出为一个 3x3 特征图。请参见图 6.7，了解输入和输出之间维度变化的示意图。\n\n![](img/ee98e91e6845f41077b163bec833ee40_187_0.png)\n\
  \n图 6.7 卷积操作示意图。使用 3x3 卷积核、填充为 1、步长为 2，5x5 输入矩阵被转换为 3x3 特征图。因此，公式使我们能够根据卷积操作在输入矩阵上的参数化方式来获取输出的维度。\n\
  \n结果表明，卷积操作对应于一种采用权重共享的特殊 FCN，我们将在下一节中展示这一点。\n\n### 6.1.4 卷积操作中的权重共享\n\n考虑一个 2x2\
  \ 卷积核矩阵，用于与 4x4 输入矩阵进行卷积，不使用填充（也称为 *有效填充*）且步长为 2。使用这种参数化，卷积核将与四个输入补丁进行卷积，这些补丁互斥且共同覆盖完整的输入矩阵。请参见图\
  \ 6.8 了解示意图。\n\n![](img/ee98e91e6845f41077b163bec833ee40_188_0.png)\n\n图 6.8 在不使用填充且步长为\
  \ 2 的情况下，将 2x2 卷积核与 4x4 输入矩阵进行卷积。为了清晰起见，四个输入补丁采用颜色编码，并标记为相应权重和输入之间的乘积。输出是一个 2x2\
  \ 特征图，其中我们展示了左上角单元格中卷积核与输入补丁之间逐元素乘法求和的结果。\n\n在这个图中，我们明确标记了输入矩阵及其将与之相乘的相应权重。所有输入补丁都与\
  \ *相同* 的卷积核矩阵进行卷积，其权重在相应的输入条目之间共享。例如，$w_1$ 在所有四个输入补丁的左上角条目之间共享。与 FCN 中将每个输入条目与各自唯一的权重配对不同，卷积操作在多个输入条目之间共享权重。\n\
  \n让我们在 FCN 的背景下可视化权重共享机制。在图 6.9 中，我们绘制了与图 6.9 中相同的卷积操作，尽管使用类似于 FCN 的扁平化前馈方式。请注意，这个图中的转换包含大量需要拆解的信息。首先，我们对输入矩阵中的四个输入补丁进行颜色编码，这对应于输出特征图中的四个特征（相同颜色）。接下来，我们以典型\
  \ FCN 的方式将所有这些组件（输入层、卷积核和输出层）按前馈方式展平。对于输入矩阵，每个条目按顺序映射到输入层中的相应节点，从左到右，从上到下。例如，左上角条目映射到第一个输入节点，如图中的点划线所示。相同的位置映射也适用于输出层。最后，卷积核表现为表示网络权重的连接线。每个权重假设不同类型的线条以区分开来，避免已拥挤的颜色空间。\n\
  \n\n\n\n![](img/ee98e91e6845f41077b163bec833ee40_189_0.png)\n\n图 6.9 使用前馈式风格表示卷积操作。方阵中的输入条目按顺序映射到输入层的节点中，从左到右，从上到下。我们给出了两个示例，其中\
  \ w1 在图中被映射到。同样，输出特征图也被展平为由四个节点组成的直线层。我们使用颜色编码来区分四个输入补丁和产生的输出特征，以及每个节点和权重的相应符号。权重使用不同类型的线条绘制以便区分，其中每个单一权重在四个输入节点中重复/共享四次，连接数量显著少于典型\
  \ FCN 中的数量。\n\n尤其是观察权重如何连接输入和输出节点很有趣。一方面，与需要 16x4=64 个权重的典型 FCN 相比，现在使用的权重数量要少得多。更少的权重既减轻了计算负担，也减轻了训练负担。另一方面，权重共享明确地强制应用于特定的输入节点。考虑图中由实线表示的\
  \ w1。所有四种不同颜色的节点共享相同的权重，并最终进入不同的输出节点。这种安排有助于学习几何结构（边缘、形状等），而这些结构在典型 FCN 中使用独立的权重很难捕捉。因此，在网络架构设计中引入归纳偏置对决定模型的学习能力起着重要作用。\n\
  \n请注意，最大池化或平均池化等池化操作也是模型设计中引入归纳偏置的示例，尽管该操作中不涉及可学习的权重。\n\n在了解了 CNN 的核心操作后，让我们转换方向，关注模型架构中的另一种归纳偏置：脱校法。\n\
  \n## 6.2 通过脱校法对深度神经网络进行正则化\n\n请回顾，我们在前一章中简要提及了*集成学习*，它是一种基于多个自助采样数据集开发的多个模型进行聚合，以构建更泛化模型的方法。事实证明，我们也可以保持数据集不变，多次调整模型架构，每次都得到一个不同的模型，然后集体聚合以产生最终输出。这就是*脱校法*的理念，即按照特定的计划，仅在*训练*阶段随机（暂时）禁用/移除某一层中的某些节点以及所有关联的入站和出站连接权重。这通常发生在隐藏层中，尽管也可以将其应用于输入层。\n\
  \n通过集成不同的模型配置，脱校法导致训练多个模型，这有助于减少过拟合并提高泛化性能。它可以被视为将随机噪声注入模型架构作为一种正则化形式。此外，在网络中以概率方式随机脱校节点也能加快训练期间的计算速度。\n\
  \n脱校法操作的一个类比如下。在课堂上，老师提出一些问题，但总是同两个孩子在回答。老师让他们安静一段时间，让其他学生参与进来。这样，其他学生就能学得更好。也许他们会给出错误的答案，但老师（损失函数）可以纠正他们（使用反向传播进行权重更新）。通过暂时让几个异常活跃的学生（具有高激活输出的节点）保持安静，整个班级（层）对该主题的学习效果更好。\n\
  \n让我们详细了解脱校法操作。\n\n### 6.2.1 引入脱校法\n\n脱校法最初由 Srivastava 等人（2014 年）在其里程碑式论文“脱校法：防止神经网络过拟合的一种简单方法”中提出。脱校法的核心思想是近似集成学习，仿佛我们要训练许多不同的模型并平均它们的预测，因为当数据集变大且模型变复杂时，显式构建多个模型在计算上非常昂贵。这种近似是通过随机禁用网络中的某些节点（乘以零）来实现，使其看起来像是当前训练迭代的一个不同模型。这样做将防止模型对某个特定节点（由其大权重表示）产生过度依赖，因为它可能只是随机地被脱校出网络。当一个看似重要的节点被脱校时，其他相邻节点将承担当前训练任务的额外共享责任，并学习变得更加健壮，不易发生*共适应*，即相邻节点表现出相似的行为，并因高相关性而损害泛化性能。\n\
  \n考虑图 6.10 中包含两个隐藏层的简单网络的训练过程。在第一次训练迭代中，第一个隐藏层的第二个节点及其关联的入站和出站权重被禁用。在第二次训练迭代中，第二个隐藏层的第一个节点也会发生同样的操作。请注意，这两个节点只是暂时从网络中省略，并在训练结束后恢复。在测试阶段，所有节点都像原始网络中一样存在，并用于带有缩放输出的推理。\n\
  \n在实践中，随机禁用效果是在定义网络架构时基于预设概率发生的。此外，我们会得到与原始版本相同的网络架构，并且在测试阶段不会应用脱校法。\n\n![](img/ee98e91e6845f41077b163bec833ee40_191_0.png)\n\
  \n图 6.10 说明了在训练具有两个隐藏层的简单全连接神经网络时的脱校法操作。隐藏节点的概率性移除发生在训练迭代期间。例如，第一个隐藏层的第二个节点在迭代 1\
  \ 被移除，第二个隐藏层的第一个节点在迭代 2 被移除。请注意，让一个节点静默也意味着将所有连接权重静默（设置为零），由虚线表示。由于脱校法仅在训练迭代期间发生，我们最终会得到与原始版本相同的网络架构。\n\
  \n随机脱校节点也可以被视为从原始网络中采样一个精简网络，通过切断特定节点的所有入站和出站连接来实现。由于大多数节点出现在多个采样网络或子模型中，脱校过程允许这些精简网络在不同迭代之间共享权重，在多个子模型之间传输和通信权重。这种权重共享方案与多任务学习不谋而合，我们将在本章后面部分简要介绍。\n\
  \n请注意，脱校法可以在测试阶段启用，此时每个预测由略有不同的采样模型生成，从而得到一组预测。这些多个预测可以形成一个分布，然后使用统计量（如分布的均值和方差）来量化预测的不确定性，这近似于考虑模型不确定性的贝叶斯推断。\n\
  \n除了通过减少过拟合来提供更好的泛化性能外，脱校法还带来了在隐藏层中鼓励稀疏表示的副作用，而不是依赖添加到模型损失函数中的显式权重正则化。\n\n此外，脱校法有助于保持网络中的权重较小，因为权重更新被分散了。较小的权重是可取的，因为模型对输入特征的小变化不那么敏感。我们将在后面的章节中详细介绍通过目标函数进行正则化，其中\
  \ l1 和 l2 范数等惩罚项在正则化模型权重方面起着显著作用，使权重保持较小甚至为零。\n\n### 6.2.2 诱导稀疏表示\n\nCNN 在从图像数据中学习几何结构方面非常擅长。也就是说，良好的特征表示会被自动提取和学习，以捕捉不同层次上的结构模式。在许多同样良好的特征表示中，稀疏表示通常更受青睐，因为它具有提高鲁棒性（即选取的特征更少）和加快计算（模型推理中涉及的权重更少）等优势。因此，特征表示中的稀疏性是我们置于模型中的另一种归纳偏置，即只有原始特征的一个子集（在输入层或隐藏层中）是重要的。因此，在输入层面上，稀疏性也可以被视为一种隐式特征选择机制。\n\
  \n有许多诱导稀疏学习的技术，其中 Lasso 正则化是最突出的示例。Lasso 是添加到模型目标损失函数中的一个惩罚项，以便在最终模型中仅选取原始特征的一个子集。这种特征选择是通过将不重要特征的权重设置为零来实现的。\n\
  \n还有两种更常用的 Lasso 变体：组 Lasso 和弹性网。组 Lasso 假设某些权重的组成员资格，选择或丢弃整个权重组。弹性网将 Lasso 和组 Lasso\
  \ 线性结合起来，在单个权重层面和聚合组层面都执行稀疏学习。\n\n我们将在关于通过目标函数进行正则化的后面章节中更深入地探讨这种特定技术。目前，让我们将稀疏学习置于简单\
  \ FCN 的背景下。图 6.11 说明了不同稀疏诱导技术在特征表示中的效果。如果不使用任何稀疏诱导正则化器，如左上图所示的 FCN 将学习所有权重，并在最终模型中保留所有生成的隐藏特征/节点，这在实际应用中可能存储要求高且推理耗时。通常可以学习一个稀疏模型，在保持更小尺寸的同时提供相同的预测性能。稀疏性可以采用\
  \ Lasso 的权重级选择形式，如右上图所示，或采用组 Lasso 的节点组级选择，如左下图所示，或两者的结合，即所谓的弹性网正则化，如右下图所示。\n\n\n\
  \n\n\n### 带有所有已学习和保留的权重和特征的原始模型\n### 使用个体权重级稀疏性（即 Lasso 正则化）移除某些权重\n### 使用组级别稀疏性（即组\
  \ Lasso 正则化）移除隐藏节点/特征（以及所有连接权重）\n### 使用弹性网正则化诱导权重级和节点级的稀疏性\n\n图 6.11 简单 FCN 中诱导稀疏性的学习。左上图是原始\
  \ FCN，其中所有权重都已学习和保留。右上图是使用 Lasso 通过将其值设置为零来禁用某些连接权重（由虚线表示）的示例。左下图使用组 Lasso 通过将所有输入和输出权重设置为零来移除一个节点（由虚线圆和线条表示）。右下图应用弹性网正则化来结合\
  \ Lasso 和组 Lasso，实现权重级和节点级的稀疏性。\n\n通过 Dropout 促进稀疏性的副作用与在节点级选择中使用组 Lasso 相似，尽管 Dropout\
  \ 不涉及对节点的显式正则化项。\n\n在下一节中，我们将探讨从零实现 Dropout 操作，并使用 MNIST 数据集在 FCN 和 CNN 中应用它。\n\n\
  ### 6.2.3 Dropout 实战\n\nDropout 操作包括根据预设概率丢弃一些节点，并放大其余节点的权重。在这里，我们指定丢弃节点的概率（这也是一个超参数），而不是保留节点的概率。这既适用于下文将要介绍的示例，也适用于\
  \ PyTorch 中提供的 Dropout 层。\n\n实现 Dropout 时，第一部分涉及生成一个布尔数值的指示列表，用于与待评估层中的节点相乘，无论是输入层还是隐藏层。当一个节点乘以零，或者等价于\
  \ Python 中的 `FALSE` 值时，该节点的结果特征值将变为零，并流入后续操作，这相当于丢弃或掩码该节点。它还确保在反向传播过程中，不会有误差梯度流回被丢弃的神经元。布尔列表的长度与节点数量相同，它是通过将一组随机数与预设的\
  \ Dropout 概率进行比较生成的，这些随机数服从 0 到 1 之间的均匀分布。\n\n第二部分是放大节点的特征值，这等同于放大它们的输出权重。原因是丢弃一些节点后，其余节点需要在值上进行放大，以补偿被丢弃的节点。具体来说，假设\
  \ Dropout 比率为 p，那么每个剩余节点将乘以 1/(1 - p)。\n\n以下代码清单实现了一个 Dropout 类，可以应用于输入层或任何隐藏层。实例化该类时，它接受默认\
  \ Dropout 比率为 0.5，通常在 0.5 到 1 的范围内变化。当 `__init__()` 函数自动触发时，缩放因子也会被计算并存储为属性。接下来，`forward()`\
  \ 函数指定如何执行 Dropout 操作，并在应用此类时自动触发。具体来说，我们首先创建一个名为 `selected_ind` 的指示列表，以确定要掩码/屏蔽哪些节点。布尔数值列表是通过将\
  \ 0 到 1 范围内的一组均匀生成的数字与预设的 `dropout_rate` 进行比较来创建的。指示列表随后被转换为浮点数据类型，并包装在一个变量中，其梯度传播被禁用，因为不涉及学习。最后，我们根据指示列表掩码节点，并放大其余的幸存节点。\n\
  \n### 清单 6.1 定义自定义 Dropout 类\n\n```\nclass Dropout(nn.Module):\n    def __init__(self,\
  \ dropout_rate=0.5):\n        super(Dropout, self).__init__()\n        self.dropout_rate\
  \ = dropout_rate\n        if self.dropout_rate < 1: #A\n            self.scaling_fct\
  \ = 1.0 / (1.0-dropout_rate) #A\n        else: #A\n            self.scaling_fct\
  \ = 0.0 #A\n\n    def forward(self, input):\n        if not self.training: #B\n\
  \            return input\n\n        selected_ind = torch.Tensor(input.shape).uniform_(0,1)\
  \ > self.dropout_rate #C\n        if input.is_cuda: #D\n            selected_ind\
  \ = Variable(selected_ind.type(torch.cuda.FloatTensor),\n                requires_grad=False)\
  \ #D\n        else: #D\n            selected_ind = Variable(selected_ind.type(torch.FloatTensor),\n\
  \                requires_grad=False) #D\n\n        return torch.mul(selected_ind,\
  \ input) * self.scaling_fct #E\n```\n\n- #A 为剩余节点定义缩放因子，以补偿被丢弃的节点\n- #B 仅在训练模式下应用\
  \ Dropout\n- #C 相同大小的指示张量，用于标记所选节点\n- #D 如果可用则使用 GPU\n- #E 丢弃一些节点并放大其余节点\n\n接下来，我们将\
  \ FCN 模型定义为名为 `MLP()` 的类。如以下代码清单所示，我们使用 PyTorch 的 sequential 容器，通过其 `add_module()`\
  \ 函数将多个层串联在一起。`dropout_rates` 参数是一个包含两个条目的列表，分别对应输入层和所有隐藏层的 Dropout 概率。在指定输入层与第一个隐藏层之间的连接后，所有剩余层都在\
  \ `for` 循环中配置，这使得扩展到具有不同完全连接隐藏层配置的架构变得方便。由于我们使用 MNIST 数据集，我们的网络从 1x28x28 像素的输入维度和\
  \ 10 个类别的输出维度开始。\n\n### 清单 6.2 定义 FCN 模型\n\n```\nclass MLP(nn.Module):\n    def\
  \ __init__(self, hidden_layers=[800, 800], dropout_rates=[0, 0]):\n        super(MLP,\
  \ self).__init__()\n        self.model = nn.Sequential()\n        self.model.add_module(\"\
  input\", nn.Linear(28*28, hidden_layers[0]))\n        self.model.add_module(\"dropout_input\"\
  , Dropout(dropout_rate=dropout_rates[0]))\n        self.model.add_module(\"tanh\"\
  , nn.Tanh())\n        # add hidden layers\n        for i, d in enumerate(hidden_layers[:-1]):\n\
  \            self.model.add_module(\"dropout_hidden_\"+str(i+1),\n            Dropout(dropout_rate=dropout_rates[1]))\n\
  \            self.model.add_module(\"hidden_\"+str(i+1), nn.Linear(hidden_layers[i],\n\
  \            hidden_layers[i+1]))\n            self.model.add_module(\"tanh_hidden_\"\
  +str(i+1), nn.Tanh())\n        self.model.add_module(\"final\", nn.Linear(hidden_layers[-1],\
  \ 10))\n\n    def forward(self, x):\n        # flatten to one-dimensional array\n\
  \        x = x.view(x.size()[0], 28*28)\n        x = self.model(x)\n        return\
  \ x\n```\n\n请注意，我们在非线性激活函数生效之前使用了 Dropout，这在计算效率上提供了 slight 提升。然而，在实践中，Dropout 层通常放置在激活层之后。\n\
  \n我们可以实例化一个示例模型，并按以下代码片段检查其架构。\n\n```\n>>> model = MLP()\n>>> print(model)\nMLP(\n\
  \  (model): Sequential(\n    (input): Linear(in_features=784, out_features=800,\
  \ bias=True)\n    (dropout_input): Dropout()\n    (tanh): Tanh()\n    (dropout_hidden1):\
  \ Dropout()\n    (hidden_1): Linear(in_features=800, out_features=800, bias=True)\n\
  \    (tanh_hidden_1): Tanh()\n    (final): Linear(in_features=800, out_features=10,\
  \ bias=True)\n  )\n)\n```\n\n接下来，我们将构建一个 `MLPClassifier` 类，以更好地管理训练流水线中的各个组件，包括数据加载、模型训练和结果保存。如以下代码清单所示，我们首先创建在实例化时稍后使用的几个实用变量。这些包括用于在\
  \ GPU 环境中启动 MLP 模型的隐藏层和 Dropout 配置（`hidden_layers` 和 `dropout_rates`）、训练批量大小（`batch_size`）、最大训练轮数（`max_epoch`）、损失函数（`criterion`）和优化例程（`optimizer`），以及用于保存模型性能指标（`loss`\
  \ 和 `test_accuracy`）的变量。\n\n### 清单 6.3 定义模型训练的包装器\n\n```\nclass MLPClassifier:\n\
  \    def __init__(self, hidden_layers=[800, 800], dropout_rates=[0, 0], batch_size=128,\
  \ \\\n        max_epoch=10, lr=0.1):\n        self.hidden_layers = hidden_layers\n\
  \        self.dropout_rates = dropout_rates\n        self.batch_size = batch_size\n\
  \        self.max_epoch = max_epoch\n        self.model = MLP(hidden_layers=hidden_layers,\
  \ dropout_rates=dropout_rates)\n        self.model.cuda()\n        self.criterion\
  \ = nn.CrossEntropyLoss().cuda()\n        self.optimizer = optim.SGD(self.model.parameters(),\
  \ lr=lr)\n        self.loss = []\n        self.test_accuracy = []\n```\n\n然后，我们将向类添加一个\
  \ `fit()` 函数来处理训练过程。如以下代码片段所示，我们首先使用 `dataloader` 类加载训练集和测试集，其中训练集分批次提供，测试集一次性全部提供，用于每隔\
  \ `test_score_freq` 个轮次进行一次评分。在每个训练迭代中，我们遵循同样的熟悉流水线：准备批量训练数据（`X_train` 和 `y_train`）、清除当前梯度以避免梯度累积、使用当前模型进行预测（存储在\
  \ `y_pred` 中）、计算当前损失（`loss`）、将损失反向传播以计算偏导数梯度，最后执行一步梯度下降更新以获得新模型。我们使用 `running_loss`\
  \ 监控不同轮次中每个批次的平均损失。默认情况下，每隔五个轮次对测试集进行一次评分，模型会对测试集中的所有 10,000 张图像进行预测以计算预测准确率。\n\n\
  \n\n\n\n```\ndef fit(self, trainset, testset, verbose=True, test_score_freq=5):\n\
  \    trainloader = torch.utils.data.DataLoader(trainset, batch_size=self.batch_size,\n\
  \    shuffle=True) #A\n    testloader = torch.utils.data.DataLoader(testset, batch_size=len(testset),\n\
  \    shuffle=False) #A\n    X_test, y_test = iter(testloader).next() #A\n    X_test\
  \ = X_test.cuda() #A\n    for epoch in range(self.max_epoch): #B\n        running_loss\
  \ = 0\n        for i, training_batch in enumerate(trainloader, 0):\n           \
  \ X_train, y_train = training_batch\n            X_train, y_train = Variable(X_train).cuda(),\
  \ Variable(y_train).cuda()\n            self.optimizer.zero_grad() #C\n        \
  \    y_pred = self.model(X_train) #D\n            loss = self.criterion(y_pred,\
  \ y_train) #E\n            loss.backward() #F\n            self.optimizer.step()\
  \ #G\n            running_loss += loss.item() #H\n    self.loss.append(running_loss\
  \ / len(trainloader)) #I\n    if verbose:\n        print('{Epoch {} loss: {}}'.format(epoch+1,\
  \ self.loss[-1]))\n    if (epoch+1) % test_score_freq == 0:\n        y_test_pred\
  \ = self.predict(X_test).cpu() #J\n        self.y_test_pred = y_test_pred\n    \
  \    self.y_test = y_test\n        self.test_accuracy.append(np.mean((y_test ==\
  \ y_test_pred).numpy())) #K\n        if verbose:\n            print('Test accuracy:\
  \ {}'.format(self.test_accuracy[-1]))\n    return self\n```\n\n- #A 准备训练集和测试集\n\
  - #B 启动训练过程，最好在 GPU 上运行\n- #C 清除梯度\n- #D 进行预测\n- #E 计算当前批次的损失\n- #F 执行反向传播以自动计算梯度\n\
  - #G 更新权重\n- #H 将同一时期内不同批次的损失相加\n- #I 存储所有时期每批次的平均损失\n- #J 获取测试集的预测结果\n- #K 存储测试集准确率\n\
  \n在对整个测试集进行预测时，我们使用了类中的 predict() 方法。这是一个自定义的预测函数，它将概率模型输出转换为类别分配，如下面的代码片段所示。\n\n\
  ```\ndef predict(self, x):\n    model = self.model.eval()\n    outputs = model(Variable(x))\n\
  \    _, pred = torch.max(outputs.data, 1)\n    model = self.model.train()\n    return\
  \ pred\n```\n\n最后，我们可以在 MNIST 数据集上测试分类器。在下面的代码清单中，我们测试了三种不同的模型：不带任何 dropout 的原始\
  \ FCN、隐藏层中带有 50% dropout 的 FCN，以及隐藏层中带有 50% dropout 且输入层中带有 20% dropout 的 FCN。FCN\
  \ 包含两个隐藏层，每个隐藏层由 300 个隐藏节点组成。我们对所有三种模型总共训练 500 个时期，并每 5 个时期记录一次测试集准确率。所有模型都包含在 `model_list`\
  \ 中。此外，由于在单个 GPU 上运行此代码清单大约需要 5 小时，我们将模型和性能指标离线保存，以便稍后绘图。\n\n### 清单 6.4 在 MNIST\
  \ 数据集上训练三个 FCN\n\n```\ntransform = transforms.Compose([transforms.ToTensor(),\n\
  \ transforms.Normalize([0.5], [0.5])]) #A\ntrainset = datasets.MNIST(root='data/',\
  \ train=True, download=True, transform=transform) #A\ntestset = datasets.MNIST(root='data/',\
  \ train=False, transform=transform) #A\nhidden_layers = [300, 300] #B\nmodel_list\
  \ = [MLPClassifier(hidden_layers, dropout_rates=[0, 0], max_epoch=500),\n MLPClassifier(hidden_layers,\
  \ dropout_rates=[0, 0.5], max_epoch=500),\n MLPClassifier(hidden_layers, dropout_rates=[0.2,\
  \ 0.5], max_epoch=500)] #B\n[tmp_model.fit(trainset, testset, verbose=True) for\
  \ tmp_model in model_list] #C\nfor ind, tmp_model in enumerate(model_list): #D\n\
  \    torch.save(tmp_model, 'mnist_mlp_'+str(ind)+'.pth')\n    tmp_model.test_accuracy\
  \ = list(map(str, tmp_model.test_accuracy))\nfrom google.colab import files\nopen(\"\
  mlp_test_accuracy.txt\", \"w\").write('\\\\n'.join(['.'.join(tmp_model.test_accuracy)\
  \ for tmp_model in model_list])) #E\nfiles.download('mlp_test_accuracy.txt')\n```\n\
  \n- # A 加载并转换 MNIST\n- # B 定义三个 FCN 模型\n- # C 开始训练\n- # D 保存 torch 模型\n- # E 保存测试准确率\n\
  \n训练完成后，我们可以加载测试集准确率的保存文件，并以步长为 5 的训练迭代次数为函数将其绘制出来。绘图详情请参见下面的代码片段。\n\n```\nimport\
  \ matplotlib.pyplot as plt\nmlp_test_accuracy = [accuracy_array.split(',') for accuracy_array\
  \ in\n open(\"mlp_test_accuracy.txt\", \"r\").read().split('\\\\n')]\nmlp_test_accuracy\
  \ = np.array(mlp_test_accuracy, dtype='f')\nlabels = ['MLP no dropout',\n      \
  \    'MLP 50% dropout in hidden layers',\n          'MLP 50% dropout in hidden layers\
  \ + 20% in input layer']\nplt.figure(figsize=(8, 7))\nfor i, r in enumerate(mlp_test_accuracy):\n\
  \    plt.plot(np.array(range(1, len(r)+1))*5, r, '.-', label=labels[i], alpha=0.6);\n\
  plt.legend(loc=4);\nplt.xlabel('Epochs');\nplt.ylabel('Accuracy in test set');\n\
  plt.show()\n```\n\n运行上述代码将生成图 6.12。在这种情况下，在第二个和第三个模型中添加 dropout 明显提高了测试集性能。在实践中，常观察到\
  \ dropout 对模型泛化性能有显著贡献，这甚至比显式正则化权重范数更加明显。此外，对输入层应用 dropout（程度较小）进一步提升了测试集性能。\n\n\
  ![](img/ee98e91e6845f41077b163bec833ee40_199_0.png)\n\n图 6.12 比较三种不同模型的测试集准确率。将\
  \ dropout 作为模型架构的正则化添加有助于提高测试集的泛化性能，正如后两个模型具有更高的测试集准确率所示。在输入层之后进一步应用 dropout 层也有助于提高测试性能，正如第三个模型略高的曲线所示。\n\
  \n在下一节中，我们将使用 LeNet 对 CNN 应用 dropout，LeNet 是我们在第 5 章中遇到的典型模型架构。在使用 CNN 时，每个输入图像都是一个三维张量对象，并将使用卷积操作进行处理。我们将使用\
  \ nn.Dropout2d() 函数，它等效于我们之前定义的 Dropout 层，只是它专门用于二维 dropout 操作（沿图像的宽度和高度），并提供更好的处理效率。\n\
  \n### 6.2.4 在 CNN 中应用 dropout\n\n对 LeNet 应用 dropout 遵循与之前相似的流程。首先，我们定义模型架构。如下面的代码清单所示，该模型由两个\
  \ CONV + DROPOUT + MAX POOLING 操作块组成，随后是两个 FC + RELU 操作级别，然后到达最终输出层。我们对所有 dropout\
  \ 层使用默认的 50% dropout 概率。\n\n### 清单 6.5 定义 LeNet\n\n```\nclass LeNet(nn.Module):\n\
  \    def __init__(self, dropout_rate=0.5):\n        super(LeNet, self).__init__()\n\
  \        self.model = nn.Sequential()\n        self.model.add_module('conv1', nn.Conv2d(1,\
  \ 20, kernel_size=5, padding=2))\n        self.model.add_module('dropout1', nn.Dropout2d(p=dropout_rate))\n\
  \        self.model.add_module('maxpool1', nn.MaxPool2d(2, stride=2))\n        self.model.add_module('conv2',\
  \ nn.Conv2d(20, 50, kernel_size=5, padding=2))\n        self.model.add_module('dropout2',\
  \ nn.Dropout2d(p=dropout_rate))\n        self.model.add_module('maxpool2', nn.MaxPool2d(2,\
  \ stride=2))\n        self.model.add_module('flatten', Flatten())\n        self.model.add_module('dense3',\
  \ nn.Linear(50*7*7, 500))\n        self.model.add_module('relu3', nn.ReLU())\n \
  \       self.model.add_module('dropout3', nn.Dropout(p=dropout_rate))\n        self.model.add_module('final',\
  \ nn.Linear(500, 10))\n\n    def forward(self, x):\n        return self.model(x)\n\
  ```\n\n请注意，卷积操作产生的二维特征图需要转换或展平为一维数组，以便与另一个线性层连接。这是通过下面代码片段中定义的另一个 Flatten 类实现的。\n\
  \n```\nclass Flatten(nn.Module):\n    def __init__(self):\n        super(Flatten,\
  \ self).__init__()\n\n    def forward(self, x):\n        x = x.view(x.size(0), -1)\n\
  \        return x\n```\n\n我们还可以打印模型架构，以了解所涉及的不同类型的层。\n\n```\n>>> model = LeNet()\n\
  >>> print(model)\nLeNet(\n  (model): Sequential(\n    (conv1): Conv2d(1, 20, kernel_size=(5,\
  \ 5), stride=(1, 1), padding=(2, 2))\n    (dropout1): Dropout2d(p=0.5, inplace=False)\n\
  \    (maxpool1): MaxPool2d(kernel_size=2, stride=2, padding=0, dilation=1, ceil_mode=False)\n\
  \    (conv2): Conv2d(20, 50, kernel_size=(5, 5), stride=(1, 1), padding=(2, 2))\n\
  \    (dropout2): Dropout2d(p=0.5, inplace=False)\n    (maxpool2): MaxPool2d(kernel_size=2,\
  \ stride=2, padding=0, dilation=1, ceil_mode=False)\n    (flatten): Flatten()\n\
  \    (dense3): Linear(in_features=2450, out_features=500, bias=True)\n    (relu3):\
  \ ReLU()\n    (dropout3): Dropout(p=0.5, inplace=False)\n    (final): Linear(in_features=500,\
  \ out_features=10, bias=True)\n  )\n)\n```\n\n\n\n\n\n模型训练和测试的其余代码大体遵循与之前相同的结构。有关完整代码集，请参阅随附的笔记本，网址为\
  \ https://github.com/jackliu333/regularization_in_deep_learning/blob/main/Chapter_6_1.ipynb。\n\
  \n训练完成后，我们可以在图 6.13 中一起绘制所有性能指标。总体而言，两个基于 CNN 的 LeNet 模型在测试集性能上相对于其他基于 FCN 的模型具有显著优势。这主要归功于卷积操作中更优越的归纳偏置。观察两个\
  \ LeNet 模型，我们发现添加 Dropout 操作可以进一步提高测试集准确率。未使用 Dropout 的 LeNet 模型曲线表明，从大约第 100 次迭代开始，测试集准确率略有下降，这很可能是由于过拟合造成的。当使用\
  \ Dropout 时，过拟合现象消失，模型显示出持续改进的测试集性能。\n\n![](img/ee98e91e6845f41077b163bec833ee40_201_0.png)\n\
  \n图 6.13 比较所有五个模型的测试集准确率。基于 CNN 的模型在图像相关任务上通常表现更好，这从两个 LeNet 模型的更高准确率中可以看出。应用 Dropout\
  \ 可以进一步提高泛化性能并减少过拟合，这似乎发生在第四个模型上，正如略有下降的准确率曲线所显示的那样。\n\n## 6.3 多任务学习中的隐式正则化\n\n\
  在接下来的章节中，我们将探讨另一种诱导泛化的模型架构：多任务学习。\n\n迄今为止，我们一直专注于优化单一特定指标，例如均方误差。这涉及为手头的特定任务训练单个模型或模型集成，通常需要经过多轮微调和估计。然而，当我们面对多于一个任务时，这种方法会忽略其他相关任务中可能有用的信息。在这种情况下，我们可以考虑使用多任务学习（MTL）在这些相似任务之间构建共享表示，以提高原始任务的泛化性能。换句话说，相关任务中嵌入的特定领域特征可以帮助通过\
  \ MTL 训练的模型更好地泛化。\n\nMTL 是指一种学习范式，其中多个任务并行学习，而不是使用单任务方法将其视为独立任务。当同时学习多个任务时，一个任务中获得的知识和经验可以（希望地）共享并转移到其他相似任务，这是人类学习过程的基础之一。确实，作为人类，我们在学习新任务时通常会应用通过相关任务获得的知识。作为机器学习的一个专门领域，MTL\
  \ 在学习效率和预测准确性方面提供了好处。通过利用辅助任务信号中嵌入的信息，MTL 可以挖掘多个学习问题之间的相似性和关系，从而有助于测试集泛化。改进的泛化性能是在优化模型在所有学习任务上的表现时隐式诱导的正则化效应的结果。\n\
  \nMTL 也可以被视为一种叠加归纳偏置的形式，导致模型偏好某些假设（所有可能模型整个空间中的一组模型）而非其他假设。这种归纳偏置由辅助任务的联合训练提供，因为使用\
  \ MTL 训练的模型倾向于能够解释多个任务的假设，从而带来更好的泛化。通过偏向模型偏好其他任务也偏好的表示，它还将帮助模型很好地泛化到训练数据之外的新任务，只要这些任务在性质上相似且源自相同的数据生成过程。\n\
  \n此外，MTL 可以被视为一种隐式数据增强形式，这有效增加了训练过程中使用的样本量。这种解释来自这样一个事实：所有学习任务通常都受到不同级别噪声的干扰。在单个任务上训练模型时，典型单任务训练过程的最终目标是学习一个足够好的表示，忽略依赖于数据的噪声并捕捉基础模式，这有助于它在测试集上很好地泛化。由于不同任务暴露于不同的噪声，联合学习两个任务将使模型能够获得更通用的表示并克服特定于任务的噪声。通过降低对单个学习任务过拟合的风险，同时学习多个任务允许模型平均化噪声模式，从而更好地对两个任务进行泛化。\n\
  \n另一个额外的好处称为“窃听”，其中模型增强了对某些特征的偏好，这些特征在一个任务中难以学习但在另一个任务中容易识别。在学习一个任务时，特征空间中潜在的复杂依赖结构可能会阻碍模型发现某些重要特征，这些特征在学习另一个相关任务时可能会凸显出来。通过共同学习这两个任务，模型在某种程度上从另一个任务“窃听”并将此外部知识应用于当前学习任务，从而提升其学习性能。有关在深度学习中使用\
  \ MTL 的更详细综述，请参阅 Sebastian Ruder 撰写的综述论文“An Overview of Multi-Task Learning in Deep\
  \ Neural Networks”。\n\n图 6.14 对 MTL 的好处进行了总结。\n\n![](img/ee98e91e6845f41077b163bec833ee40_203_0.png)\n\
  \n图 6.14 总结了多任务学习的多种解释和好处。\n\n应当注意的是，大多数 MTL 深度学习模型假设任务来自相同的数据生成过程。尽管这一假设有利于多个相关任务之间的共享特性，但在实践中可能并不总是成立。当学习任务之间不相关或仅松散相关时，构建稳健的\
  \ MTL 模型成为一项挑战。这一挑战的一部分可以通过允许 MTL 模型学习共享什么来解决，例如后面将介绍的跨缝合网络。除了共享层级之外，允许模型自动学习具有不同粒度层级的层次结构也有助于提高模型的泛化性能。即使我们的目标是只学习一个任务，利用其他任务的知识（有时甚至是对抗性任务）也通常有助于提供更好的预测性能。\n\
  \n### 6.3.1 深度神经网络中的两种 MTL 方法\n\n使用深度神经网络进行 MTL 时有两种主要方法：硬参数共享，它强制所有任务共享一组共同的权重；以及软参数共享，它鼓励不同任务学习相似的表示，通常通过对相应权重施加某些约束来实现。让我们详细了解一下。\n\
  \n作为神经网络中最流行的共享方案，硬参数共享通过强制所有任务在隐藏层中完全共享一组权重，同时在最终输出中保留少数特定于任务的层，来鼓励不同任务学习共同的表示。然后使用这一共同权重组与下游特定于任务的层相结合，这些层分别针对每个任务独立学习。通过强加一个支持所有任务的表示，硬参数共享诱导隐式正则化效应并减少过拟合的可能性。换句话说，通过要求模型联合学习多个任务，我们的模型被迫找到一个捕捉所有联合学习任务的表示，这减少了对原始单任务过拟合的可能性。特别是，当这些任务被认为共享一定程度的共性时，例如从同一个人脸中预测性别和年龄，我们可以通过为所有任务强制执行共同的骨干架构来在模型中强加这种归纳偏置。\n\
  \n图 6.15 说明了硬参数共享方案。我们从一个涵盖三个任务中所有共享层的顺序块开始。这些共享层旨在学习所有任务之间的共性，即在所有任务中都具有预测性的特征集。到达最后一个共享层后，网络扩展为三个分支，分别专门用于每个任务。这些特定于任务的层负责学习被认为特定于特定学习任务的任务内特征。与为每个学习任务拥有三个独立网络相比，硬参数共享架构由于可学习参数更少而计算效率更高，除此之外，还有过拟合更少和泛化性能更好的额外好处。\n\
  \n\n\n\n\n![](img/ee98e91e6845f41077b163bec833ee40_205_0.png)\n\n图 6.15 三任务的硬参数共享方案示意图。该架构以所有任务共用的公共层集合开始，用于共同的表示学习，然后分支为三组独立的层序列，用于任务特定的学习。当所有学习任务彼此相关时，这种架构能够提供更好的泛化性能（参数更少，因此过拟合风险更低）以及更高的学习效率（同样，与三个独立网络相比，可学习参数更少）。请注意，各个任务特定的损失可以通过遵循某种先验偏好的加权方案，或采用自适应方法，直接组合在一起。\n\
  \n另一方面，软参数共享方案添加了一个软约束，以鼓励所有学习任务中相关权重之间的表示相似，而不是强制它们采用完全相同的值。该约束通常采用模型权重之间基于距离的惩罚度量形式，例如\
  \ Lasso 惩罚中的 l1 范数和脊惩罚中的 l2 范数。对模型权重之间距离进行正则化会鼓励这些权重在数值上相似。因此，该方案为每个学习任务的架构设计提供了更多灵活性，因为它仅松散地耦合了共享的特征表示。请参见图\
  \ 6.16 了解示例，其中软约束（由双箭头指示）应用于鼓励对应特征之间的相似表示。\n\n![](img/ee98e91e6845f41077b163bec833ee40_206_0.png)\n\
  \n图 6.16 三任务的软参数共享方案示意图。该架构由针对每个任务的三个专用网络序列组成。与单任务学习的情况相同，相同的输入数据会被输入到网络三次。然而，网络对某些隐藏层的参数应用软约束（即序列间由双箭头指示的\
  \ lasso 或脊惩罚），以便在联合学习所有三个任务时鼓励相似的表示。\n\n硬参数共享方案实现直观，因为我们只需将模型架构修改为由主干和几个分支组成的树形结构。然而，软参数共享需要修改损失函数以叠加软约束。让我们看看如何实现这一点。\n\
  \n### 6.3.2 修改损失函数以实现软参数共享\n\n假设我们有三个学习任务：A、B 和 C。用 $W_i^{(j)}$ 表示任务 $j$ 的第 $i$\
  \ 层权重，其中 $j \\in \\{A,B,C\\}$。对应权重之间相似性施加软约束的一种方法是，在代价函数中添加一个额外项：所有共享层上平方 Frobenius\
  \ 范数（也称为欧氏范数）之和。第 $i$ 层的平衡因子 \\(\\lambda_i\\) 可以在所有共享层上设置为相同值，而 $||\\cdot||_F^2$\
  \ 表示平方 Frobenius 范数。\n\n![](img/ee98e91e6845f41077b163bec833ee40_207_0.png)\n\n\
  图 6.17 修改代价函数以实现软参数共享，其中我们将所有共享层上的逐层平方 Frobenius 范数之和加到均方误差中，以获得最终代价。请注意，平衡因子可以在所有共享层上设置为相同值。\n\
  \n请注意，通过对应位置权重的一致性进行正则化来增强代价函数的这种方法，也被视为通过目标函数进行正则化，这是一个将在下一章讨论的主题。确实，许多正则化技术属于多个类别，随着更多激动人心的方法被提出，界限只会变得更加模糊。在众多促进模型泛化性能的正则化技术中，我们打算涵盖最流行且在方法论上最有趣的技术。\n\
  \n一个有趣的方法称为交叉缝合网络（cross-stitch networks），最初由 Misra 等人在其 2016 年论文《面向多任务学习的交叉缝合网络》中提出，其中所谓的交叉缝合单元用于允许模型自动学习和确定任务特定网络如何利用其他辅助任务的知识。如图\
  \ 6.18 所示，交叉缝合单元是前一层输出的线性组合，前一层可以是池化层或全连接层。通过学习所有共享层上的线性组合程度，交叉缝合网络能够自动识别层特定的共享方案，并确定所有任务之间的表示共享。\n\
  \n![](img/ee98e91e6845f41077b163bec833ee40_208_0.png)\n\n图 6.18 交叉缝合网络示意图，其中橙色框代表交叉缝合单元，它们线性地转换前一层的输出。通过将线性转换的程度视为可学习参数，网络能够自动确定所有共享层之间表示共享的最佳方案。\n\
  \n在下一节中，我们将探讨使用 PyTorch 实现基于硬参数共享架构的 MTL 模型。\n\n### 6.3.3 MTL 实战\n\n为了进行多任务学习，我们将使用标准汽车数据集（Standard\
  \ cars dataset），该数据集包含 196 类汽车的 16,185 张图像以及相应的元数据，如制造商、型号和年份。这些多类别标签使我们能够应用 MTL\
  \ 模型进行联合估计。\n\n在深入细节之前，理解 MTL 与典型的二元分类以及多类分类之间的区别非常重要。二元分类是最简单的情况，即在单个任务中预测两种可能结果中的一种，例如预测是否为红色汽车。多类分类涉及单个目标变量，仍然是单个任务，但假设有两个以上的可能值，例如汽车的品牌。多任务学习可能是两者的结合，其目标是同时预测汽车的颜色（红色或非红色）和品牌（BMW、Audi、Mercedes\
  \ 等）。我们还可以将 MTL 重新命名为多标签多类分类，因为它涉及预测不止一个标签，每个标签包含两个或更多可能值。请参见图 6.19 了解示例。\n\n| 任务\
  \ | 类型 | 可能结果 | 示例预测 |\n| --- | --- | --- | --- |\n| 红色或非红色 | 二元分类 | [是或否] | 是 |\n\
  | 品牌 | 多类分类 | [BMW、Audi、Mercedes 等] | BMW |\n| 两者 | 多任务学习（多标签多类分类） | [是或否] & [BMW、Audi、Mercedes\
  \ 等] | 红色 BMW |\n\n图 6.19 不同类型学习任务的比较。\n\n现在，让我们创建两个函数来下载汽车数据集及其元数据，如以下代码清单所示。\n\
  \n```\nListing 6.6 Downloading cars dataset and its metadata\ndef getting_data(url,\
  \ path):\n    data = urllib2.urlopen(url)\n    tar_package = tarfile.open(fileobj=data,\
  \ mode='r:gz')\n    tar_package.extractall(path)\n    tar_package.close()\n    print(\"\
  Data extracted and saved.\")\n\ndef getting_metadata(url, filename):\n    labels\
  \ = urllib2.urlopen(url)\n    file = open(filename, 'wb')\n    file.write(labels.read())\n\
  \    file.close()\n    print(\"Metadata downloaded and saved.\")\n```\n\n然后，我们可以传入相应汽车数据集和元数据的\
  \ URL 以完成下载，如以下代码片段所示。\n\n```\n>>> getting_data(\"http://ai.stanford.edu/~jkrause/car196/car_ims.tgz\"\
  , \"./\")\n>>> getting_metadata(\"http://ai.stanford.edu/~jkrause/car196/cars_annos.mat\"\
  ,\n                     \"car_metadata.mat\")\n```\n\n运行上述代码将把汽车数据集和元数据下载到当前目录。\n\
  \n接下来，我们将创建三个目标标签：品牌、类型和队列标记，其中最后一个是通过将输入年份作为阈值（例如 2009）进行比较生成的。让我们\n\n\n看一个具体示例。假设我们有一个关于汽车元数据的条目，名为“Audi\
  \ RS 4 Convertible 2008”。然后将根据该字符串派生出三个目标标签，生成“Audi”、“Convertible”和“0”，其中最后一个标签为\
  \ 0 表示汽车在 2009 年阈值之前生产。然后我们将前两个标签映射为基于整数的索引以方便模型训练，生成最终输出集合为 [0, 0, 0]，其中“Audi”和“Convertible”分别是各自映射字典中的第一个条目。\n\
  \n在以下代码清单中，我们定义一个名为 MetaParsing 的类来处理元数据，并使用字符串匹配从汽车名称中提取所需的标签。请注意，一个输入参数指定为 *args，用于保存两个映射字典。\n\
  \n### 清单 6.7 解析元数据\n\n```\nclass MetaParsing():\n    def __init__(self, path, *args,\
  \ year=None):\n        self.mat = scipy.io.loadmat(path) #A\n        self.year =\
  \ year #B\n        self.args = args #C\n        self.annotations = np.transpose(self.mat['annotations'])\n\
  \        self.file_names = [annotation[0][0][0].split('/')[-1] for annotation in\n\
  \                           self.annotations] #D\n        self.label_indices = [annotation[0][5][0][0]\
  \ for annotation in self.annotations] #E\n        self.car_names = [x[0] for x in\
  \ self.mat['class_names'][0]] #F\n        self.translated_car_names = [self.car_names[x-1]\
  \ for x in self.label_indices] #G\n\n    def brand_types(self, base_dict, x):\n\
  \        y = list(base_dict.keys())[-1]\n        for k,v in base_dict.items(): #H\n\
  \            if v in x:\n                y=k\n        return y\n\n    def parsing(self):\n\
  \        result = []\n        for arg in self.args: #I\n            temp_list =\
  \ [self.brand_types(arg, x) for x in self.translated_car_names]\n            result.append(temp_list)\n\
  \        if self.year != None: #J\n            years_list = [0 if int(x.split(\"\
  \ \")[-1]) <= self.year else 1 for x in\n                          self.translated_car_names]\n\
  \            result.append(years_list)\n        return result, self.file_names,\
  \ self.translated_car_names\n```\n\n- #A 加载 MATLAB 格式的元数据\n- #B 用于创建队列标志\n- #C 保存两个映射字典\n\
  - #D 提取每个样本的文件名\n- #E 提取每个样本的标签索引\n- #F 将汽车名称提取为字符串\n- #G 为每个样本创建汽车名称列表\n- #H 执行基于字符串的匹配\n\
  - #I 检索车辆品牌和类型的索引\n- #J 检索队列标记标志\n\n然后我们可以创建两个自定义映射字典，如以下代码片段所示，实例化此类并按需解析元数据。\n\
  \n```\n>>> brand_dict = {0: 'Audi', 1: 'BMW', 2: 'Chevrolet', 3: 'Dodge', 4: 'Ford',\
  \ 5: 'Other'}\n>>> vehicle_types_dict = {0: 'Convertible', 1: 'Coupe', 2: 'SUV',\
  \ 3: 'Van', 4: 'Other'}\n>>> results, file_names, translated_car_names = MetaParsing(\"\
  ./car_metadata.mat\",\nbrand_dict, vehicle_types_dict, year=2009).parsing()\n```\n\
  \n让我们对品牌和车辆类型的计数进行一些合理性检查。在以下代码片段中，我们定义一个函数来遍历两个映射字典的不同键，并统计早先解析的 `results` 中的出现次数。\n\
  \n```\ndef count_classes(base_dict, base_list):\n    for i in range(len(list(base_dict.keys()))):\n\
  \        print(\"{}: {}\".format(base_dict[i], str(base_list.count(i))))\n>>> count_classes(brand_dict,\
  \ results[0]) #A count of brand names\n>>> count_classes(vehicle_types_dict, results[1])\
  \ #B count of type of vehicle\n```\n\n如下结果所示，几乎所有品牌和车辆类型在数据集中均占用超过 1000 张图像。\n\n\
  ```\nAudi: 1169\nBMW: 1055\nChevrolet: 1799\nDodge: 1253\nFord: 1035\nOther: 9874\n\
  Convertible: 1907\nCoupe: 2143\nSUV: 2855\nVan: 832\nOther: 8448\n```\n\n接下来，我们将创建一个自定义\
  \ `Dataset` 类并将其传递给 PyTorch 的 `DataLoader` 函数，以便按批次一致地提供数据，这遵循与前一章相同的流水线。在以下代码清单中，我们定义一个名为\
  \ `CarDataset` 的类，将图像数据、解析后的元数据以及数据转换（如果有）组合在一起。\n\n### 清单 6.8 定义自定义数据集类\n\n```\n\
  from torch.utils.data import Dataset, DataLoader\nclass CarDataset(Dataset):\n \
  \   def __init__(self, car_path, transform, mapping_dict):\n        self.path =\
  \ car_path\n        self.folder = [x for x in listdir(car_path)]\n        self.transform\
  \ = transform\n        self.mapping_dict = mapping_dict\n\n    def __len__(self):\n\
  \        return len(self.folder)\n\n    def __getitem__(self, idx):\n        img_loc\
  \ = os.path.join(self.path, self.folder[idx])\n        image = Image.open(img_loc).convert('RGB')\n\
  \        single_img = self.transform(image)\n        label1 = mapping_dict[self.folder[idx]][0]\
  \ #A\n        label2 = mapping_dict[self.folder[idx]][1] #A\n        label3 = mapping_dict[self.folder[idx]][2]\
  \ #A\n        sample = {'image':single_img, 'labels': {'label_brand':label1,\n \
  \       'label_vehicle_type':label2, 'label_cohort':label3}}\n        return sample\n\
  ```\n\n- #A 检索对应的标签\n\n然后可以通过传入图像数据目录、转换操作（调整大小、转换为张量和归一化）以及将每个文件名映射到三个目标标签的总体映射字典\
  \ `mapping_dict` 来实例化此类。数据集还被分为训练集（80%）和测试集（20%），在提供给模型时，每个数据集的批次大小均为 16 并传递给 DataLoader\
  \ 函数。请注意，`CarDataset` 类在向模型提供样本时需要将三个标签与输入图像一起返回。如果剩余样本数少于预设的批次大小，我们还会丢弃最后一个批次。请参见下面的代码片段。\n\
  \n```\nmapping_dict = dict(zip(file_names,list(zip(results[0],results[1],results[2]))))\
  \ #A\ndata_transforms = transforms.Compose([ #B\n    transforms.Resize((224,224)),\n\
  \    transforms.ToTensor(),\n    transforms.Normalize((0.5,0.5,0.5), (0.5,0.5,0.5))\n\
  ])\ncardata = CarDataset(\"./car_ims\", transform=data_transforms, mapping_dict=mapping_dict)\
  \ #C\ntrain_len = int(cardata.__len__()*0.8) #D\ntest_len = int(cardata.__len__()*0.2)\
  \ #D\ntrain_set, val_set = torch.utils.data.random_split(cardata, [train_len, test_len])\n\
  train_loader = DataLoader(train_set, batch_size=16, shuffle=True, num_workers=2,\n\
  \    drop_last=True) #E\ntest_loader = DataLoader(val_set, batch_size=16, shuffle=False,\
  \ num_workers=2,\n    drop_last=True) #E\n```\n\n- #A 创建总体映射字典\n- #B 定义预处理转换链\n\
  - #C 创建自定义数据集实例\n- #D 将数据分为训练集和测试集\n- #E 为每个数据集创建数据加载器\n\n让我们从训练数据加载器中获取一个示例以检查其内容。在以下代码片段中，我们获取一个批次的数据存储在\
  \ `sample` 中，并打印出其键和与品牌相关的内容。\n\n```\n>>> sample = next(iter(train_loader))\n>>>\
  \ print(\"Keys in the current batch: {}\".format(sample.keys()))\n>>> print(\"Size\
  \ for the images in the current batch: {}\".format(sample['image'].shape))\n>>>\
  \ print(\"Size for the brand target in the current batch: {}\".format(sample['labels']['label_brand'].shape))\n\
  >>> print(\"Brand indexes in the current batch: {}\".format(sample['labels']['label_brand']))\n\
  Keys in the current batch: dict_keys(['image', 'labels'])\nSize for the images in\
  \ the current batch: torch.Size([16, 3, 224, 224])\nSize for the brand target in\
  \ the current batch: torch.Size([16])\nBrand indexes in the current batch: tensor([2,\
  \ 4, 5, 5, 5, 3, 5, 3, 2, 5, 5, 3, 5, 1, 5, 5])\n```\n\n现在让我们定义模型架构。这次，我们将利用一个名为\
  \ resnet 的预训练模型，这是一种特殊的架构，特别擅长建模序列数据。由于典型的基于 resnet 的架构通常模型体积较大，从头开始手动定义模型结构将是一项相当艰巨的工作。为了避免繁重的工作，我们将求助于\
  \ `torchvision.models` 子包，它为包括 resnet 在内的许多流行模型架构提供了预训练权重。在以下代码片段中，我们首先通过设置 `pretrained=True`\
  \ 下载预训练模型，然后打印出模型架构的最后三层。\n\n\n\n\n```\n>>> import torchvision.models as models\n\
  >>> resnet = models.resnet34(pretrained=True) #A\n>>> list(resnet.children())[:-3]\
  \ #B\nDownloading: \"https://download.pytorch.org/models/resnet34-b627a593.pth\"\
  \ to\n/root/.cache/torch/hub/checkpoints/resnet34-b627a593.pth\n\n100%\n83.3M/83.3M\
  \ [00:00<00:00, 163MB/s]\n[Sequential(\n  (0): BasicBlock(\n    (conv1): Conv2d(256,\
  \ 512, kernel_size=(3, 3), stride=(2, 2), padding=(1, 1),\n       bias=False)\n\
  \    (bn1): BatchNorm2d(512, eps=1e-05, momentum=0.1, affine=True,\n       track_running_stats=True)\n\
  \    (relu): ReLU(inplace=True)\n    (conv2): Conv2d(512, 512, kernel_size=(3, 3),\
  \ stride=(1, 1), padding=(1, 1),\n       bias=False)\n    (bn2): BatchNorm2d(512,\
  \ eps=1e-05, momentum=0.1, affine=True,\n       track_running_stats=True)\n    (downsample):\
  \ Sequential(\n      (0): Conv2d(256, 512, kernel_size=(1, 1), stride=(2, 2), bias=False)\n\
  \      (1): BatchNorm2d(512, eps=1e-05, momentum=0.1, affine=True,\n         track_running_stats=True)\n\
  \    )\n  )\n  (1): BasicBlock(\n    (conv1): Conv2d(512, 512, kernel_size=(3, 3),\
  \ stride=(1, 1), padding=(1, 1),\n       bias=False)\n    (bn1): BatchNorm2d(512,\
  \ eps=1e-05, momentum=0.1, affine=True,\n       track_running_stats=True)\n    (relu):\
  \ ReLU(inplace=True)\n    (conv2): Conv2d(512, 512, kernel_size=(3, 3), stride=(1,\
  \ 1), padding=(1, 1),\n       bias=False)\n    (bn2): BatchNorm2d(512, eps=1e-05,\
  \ momentum=0.1, affine=True,\n       track_running_stats=True)\n  )\n  (2): BasicBlock(\n\
  \    (conv1): Conv2d(512, 512, kernel_size=(3, 3), stride=(1, 1), padding=(1, 1),\n\
  \       bias=False)\n    (bn1): BatchNorm2d(512, eps=1e-05, momentum=0.1, affine=True,\n\
  \       track_running_stats=True)\n    (relu): ReLU(inplace=True)\n    (conv2):\
  \ Conv2d(512, 512, kernel_size=(3, 3), stride=(1, 1), padding=(1, 1),\n       bias=False)\n\
  \    (bn2): BatchNorm2d(512, eps=1e-05, momentum=0.1, affine=True,\n       track_running_stats=True)\n\
  \  ),\n),\nAdaptiveAvgPool2d(output_size=(1, 1)),\nLinear(in_features=512, out_features=1000,\
  \ bias=True)]\n```\n\n#A 下载 resnet34 模型架构的预训练权重\n#B 访问包括最后分类头在内的所有层\n\n请注意，我们使用了\
  \ `children()` 函数来访问 resnet 中的所有层。观察输出，我们可以发现倒数第三层是一个复杂的层：一个由三个基本构建块组成的序列块，每个块包含一系列卷积层、批归一化层和\
  \ ReLU 层。最后一层是一个具有 512 个输入特征和 1,000 个输出特征的线性层，对应于 ImageNet 中的 1,000 个类别，ImageNet\
  \ 是一个常用的大规模数据集，用于训练 resnet 并生成我们正在下载的权重。由于我们的学习任务不同，可以移除最后的全连接层，仅保留之前的层，作为支持三个学习任务硬参数共享的骨干网络。\n\
  \n```\nmodel_wo_fc = nn.Sequential(*[list(resnet.children())[:-1]])\n```\n\n让我们尝试将前一批图像传入模型，并观察输出的张量形状。如以下代码片段所示，输出包含\
  \ 16 张图像，每张图像具有 512 个特征/节点。由于未使用通道维度，输出可以展平以移除/平滑不必要的维度。\n\n```\noutput_sample =\
  \ model_wo_fc(sample['image'])\n>>> print(output_sample.shape)\n>>> print(torch.flatten(output_sample,\
  \ 1).shape)\ntorch.Size([16, 512, 1, 1])\ntorch.Size([16, 512])\n```\n\n我们可以插入一个自定义的最终层（也称为分类头）以满足当前的训练需求。以品牌任务为例，以下代码片段为当前批次的\
  \ 16 张图像生成 6 维输出。输出显示批次中每个样本有 6 个 logits，这正是我们期望的。\n\n```\noutput_sample_flatten\
  \ = torch.flatten(output_sample, 1) #A\nbrand = nn.Sequential( #B\n    nn.Dropout(p=0.2),\n\
  \    nn.Linear(in_features=512, out_features=6)\n)\n>>> brand(output_sample_flatten).shape\n\
  torch.Size([16, 6])\n```\n\n#A 展平输出\n#B 添加另一个全连接层\n\n现在我们可以总结上述代码，为多标签分类器定义一个自定义类。如以下代码清单所示，我们保留\
  \ resnet34 骨干架构作为三个任务之间的共享层（在移除其最后的全连接层之后），接着扩展为三个分支，每个分支由一个 Dropout 层和一个具有相应输出形状的全连接层组成。\n\
  \n### 清单 6.9 定义多类分类器\n\n```\nclass MultilabelClassifier(nn.Module):\n    def __init__(self,\
  \ n_brand, n_vehicle_type, n_cohort):\n        super().__init__()\n        self.resnet\
  \ = models.resnet34(pretrained=True) #A\n        self.model_wo_fc = nn.Sequential(*(list(self.resnet.children())[:-1]))\
  \ #B\n        self.brand = nn.Sequential( #C\n            nn.Dropout(p=0.2),\n \
  \           nn.Linear(in_features=512, out_features=n_brand)\n        )\n      \
  \  self.vehicle_type = nn.Sequential( #D\n            nn.Dropout(p=0.2),\n     \
  \       nn.Linear(in_features=512, out_features=n_vehicle_type)\n        )\n   \
  \     self.cohort = nn.Sequential( #E\n            nn.Dropout(p=0.2),\n        \
  \    nn.Linear(in_features=512, out_features=n_cohort)\n        )\n\n    def forward(self,\
  \ x): #F\n        x = self.model_wo_fc(x)\n        x = torch.flatten(x, 1)\n   \
  \     return {\n            'brand': self.brand(x),\n            'vehicle_type':\
  \ self.vehicle_type(x),\n            'cohort': self.cohort(x)\n        }\n```\n\n\
  #A 下载骨干架构\n#B 移除最后的全连接层\n#C 定义品牌分类的分支头\n#D 定义车辆类型分类的分支头\n#E 定义队列分类的分支头\n#F 定义模型的前向流\n\
  \n如以下代码片段所示，我们可以基于每个目标标签的预定类别数实例化模型对象，并在可用时将其移至 GPU 以进行加速训练。\n\n```\ndevice = torch.device('cuda'\
  \ if torch.cuda.is_available() else 'cpu')\nmodel = MultilabelClassifier(6, 5, 2).to(device)\n\
  ```\n\n图 6.20 可视化了模型的整体架构。我们使用 resnet34（移除最后的全连接层后）作为三个任务共享的骨干网络。resnet34 的最终输出有\
  \ 512 个节点，它分支为三个独立的分类头，均由全连接线性层组成。\n\n![](img/ee98e91e6845f41077b163bec833ee40_217_0.png)\n\

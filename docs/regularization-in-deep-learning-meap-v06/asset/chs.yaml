  training_loader = torch.utils.data.DataLoader(training_dataset, batch_size=100)\n\
  del train_X, train_Y, training_dataset #C\n```\n\n#A 对输入图像张量应用的转换  \n#B 张量转换为 torch\
  \ 张量  \n#C 通过删除不必要的对象来节省一些 RAM 空间  \n\n请注意，我们需要删除不必要的对象以节省一些 RAM 空间，因为这些操作及后续操作非常占用内存。如果不执行此步骤，在使用\

- "# 2\n\n# 广义化：经典视角\n\n## 本章内容\n\n- 训练线性回归模型的逐步实现\n- 典型模型训练工作流中的关键数学概念，重点介绍数据、模型、代价和优化\n\
  - 统计建模和机器学习中关于广义化的经典视角\n- 对关键广义化概念的深入探讨，包括经验风险最小化、偏差-方差权衡以及欠拟合与过拟合\n\n本章探讨了监督学习中最基础模型之一的典型训练过程：线性回归，它构建一个将输入特征映射到输出目标的线性模型。通过回顾训练简单线性回归模型的过程，我们将更好地理解不同的训练组件，包括数据、模型、代价和优化。我们将介绍每个部分的数学直觉，这对于理解各种建模操作至关重要。我们还将把这些概念放在适当的背景下来说明其用途，因为我们认为有效的学习始于对背景的理解。我们还将配以恰当的实现细节来辅助数学内容，以便更好地把握整体并同时欣赏理论与实践。在介绍完基础模块后，我们将介绍广义化的经典视角，涵盖经验风险最小化和偏差-方差分解等关键概念。机器学习模型所需的基础知识将帮助我们过渡到下一章中介绍的广义化现代视角。\n\
  \n构建机器学习模型的主要目标是模拟并自动化特定的手动流程。示例包括预测房价或预测未来气温。*监督学习*是机器学习任务的一种类型，专注于基于手动标注预先创建的输入数据与目标输出之间的映射关系。这种映射是通过学习一个数学函数来实现的，该函数指定底层模式，根据一组控制映射函数的参数将输入映射到输出。特定的数学函数代表了我们的\
  \ _归纳偏差_，即以假设形式对函数属性的事先信念。在从示例中学习的过程中，模型参数被优化，使学习函数的形状更具代表性，更接近真实函数。然后，监督学习模型可以接受新的输入数据并预测相应的输出。与显式编程映射规则不同，模型会自动学习映射逻辑，因此比传统的基于规则的软件工程实践更具智能性。只要提供适当的输入和输出，我们就可以将整个映射和规则识别任务外包给监督学习算法，这非常有用，尤其是在存在复杂流程时。\n\
  \n需要注意的是，模型本质上代表了对底层数据生成过程的简化假设。这种假设通常伴随着 _归纳偏差_，例如数据生成函数的平滑性：一个值应该平滑地过渡到另一个值，而不会出现突然的跳跃。预设的归纳偏差在恰当使用时，可能会产生令人惊讶的广义化效果。对真实函数的假设也可能源于我们对底层数据生成过程的事先信念，例如我们希望通过迁移学习框架从类似任务中借用的规律或其他属性。\n\
  \n为了更好地考察通过监督学习进行模型开发的细节，我们将回顾第 1 章中介绍的构成模型训练工作流的四个组件，即数据、模型、代价和优化。这次，我们将引入一些数学符号来更精确地解释这些概念。如果您不熟悉线性代数或多元微积分，请不要担心；这些内容将配合直觉和示例进行充分的标注和解释。即使您熟悉这些概念，这也是一个重温它们的好机会。\n\
  \n## 2.1 数据\n\n所有机器学习模型都始于给定的训练数据。在监督学习中，训练数据由输入-输出对组成。假设总共有 _n_ 对，我们关注第 _i_ 对数据，表示为\
  \ (**x**<sub>_i_</sub>, _y<sub>i</sub>_)。括号意味着训练集中的每个条目都必须是一对，包含输入 **x**_<sub>i</sub>_\
  \ 和输出 _y<sub>i</sub>_。输入向量 **x**_<sub>i</sub>_ 是一个一维数组，使用粗体以突出其包含一个或多个特征。模型使用 **x**_<sub>i</sub>_\
  \ 中的输入特征作为预测器，为第 _i_ 个观测值生成一个标量预测 $\\hat{y}_i$（单维，因此未加粗）。\n\n### 常见术语\n\n表达 X_i\

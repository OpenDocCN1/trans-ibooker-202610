  整体类别性能: 90.8 %\nAudi 的准确率: 83.6 %\nBMW 的准确率: 89.6 %\nChevrolet 的准确率: 78.6 %\nDodge\
  \ 的准确率: 84.3 %\nFord 的准确率: 75.7 %\nOther 的准确率: 96.2 %\n----------------------------------------\n\
  整体类别性能: 87.8 %\nConvertible 的准确率: 85.0 %\nCoupe 的准确率: 67.0 %\nSUV 的准确率: 91.9 %\n\
  Van 的准确率: 85.1 %\nOther 的准确率: 92.4 %\n----------------------------------------\n\
  整体类别性能: 90.6 %\n2009 年及以前的准确率: 88.6 %\n2010 年及以后的准确率: 91.4 %\n\n结果表明，该模型在品牌和时代标记分类任务上均可实现超过\
  \ 90% 的整体准确率，且仅需训练十个时代。这些相似任务之间的协同效应帮助 MTL 模型在有限的训练预算内获得良好的性能。\n\n## 6.4 总结\n\n\
  - 归纳偏置是在模型训练过程中引入的一种先验假设，用于提升其预测性能，例如卷积神经网络中的平移不变性\n- 卷积算子通过特殊的卷积层强制执行权重共享\n- Dropout\
  \ 随机禁用某些节点以促进稀疏表示\n- 多任务学习 (MTL) 是一种同时学习多个任务的训练框架\n- MTL 对更具可推广性的假设引入了归纳偏置，并为相关任务执行隐式数据增强\n\
  - 深度神经网络中流行的 MTL 框架包括硬参数共享和软参数共享，其中前者是最主流的方法，后者在研究界正获得日益关注\n"
- "# 7 通过目标函数进行正则化\n\n## 本章内容\n\n- 基于范数的惩罚及其在模型估计过程中的正则化应用\n- 岭回归中的基于 L2 范数的惩罚及其实现\n\
  - LASSO 回归中的基于 L1 范数的惩罚及其实现\n- 岭回归和 LASSO 回归封闭式解的推导\n- 前馈神经网络训练中不同正则化方案效果的实证分析\n\
  \n在训练神经网络时，目标函数是前向传播的终点。目标函数也称为代价函数，它根据网络当前的参数配置来确定预测质量。它通过梯度下降指导下一次迭代中的权重更新。通过汇总所有观测值的预测质量，目标函数提供了一个单一指标来总结下游优化的误差量。如果预测值与目标值（平均而言）接近，该单一指标的值较小，否则较大。\n\
  \n目标函数的方向性同时适用于回归和分类场景。我们知道，均方误差 (MSE) 和交叉熵损失 (CEL) 分别是回归和分类的常用指标。MSE 的下界为零，当算法完美拟合所有训练数据点时，MSE\
  \ 为零。然而，由于使用了 SoftMax 操作，要得到精确的零 CEL 是不可能的。在两种情况下，最小化这些经验损失函数都能保持优化迭代继续进行。在使用大型神经网络时，我们通常会运行优化直到模型拟合训练集，并在此过程中配合某种形式的正则化，以提高模型在测试集上泛化的可能性。\n\
  \n回顾图 7.1 中所示的整体模型训练工作流。目标函数的主要作用是将模型预测与相应的目标标签进行比较，以分类场景为例（不失一般性）。它提供一个直接的标量值，通常以待最小化的代价形式，来总结当前模型的预测能力。当优化过程的目标是构建一个在训练集上表现良好的准确模型时，优化目标函数意味着通过不断更改权重将预测误差最小化，直到预测误差为零。换言之，目标函数中仅最大化预测准确率\
  \ _单独_ 的最终状态是一个完美拟合训练数据集的模型。\n\n![](img/ee98e91e6845f41077b163bec833ee40_222_0.png)\n\
  \n图 7.1 整体模型训练工作流。目标函数是前向传播的最后一站，之后诸如梯度下降之类的优化过程将启动，以优化预设模型架构的参数。\n\n然而，无论模型在训练数据集上是否表现出完美的拟合，复杂模型都容易过拟合。这种复杂性通常会导致对新测试集（即使只有轻微变化）的不稳定预测。事实证明，我们可以在目标函数中包含多个指标。例如，我们可以不再单独优化预测准确率，而是引入一个针对模型复杂度的额外惩罚项，使得得到的模型在预测准确率和模型复杂度之间进行权衡。换言之，一个复杂且可能过拟合的模型将获得较低的预测代价，但同时会因模型复杂度而承受显著的惩罚，导致目标函数的总值较高。另一方面，简单模型在惩罚项上具有较低值，但缺乏预测能力，导致目标函数值较高。\n\
  \n\n\n\n在本章中，我们将揭示目标函数中不同形式的惩罚项。惩罚项充当显式正则化器，诱导所得估计器（即权重配置）的期望属性，例如通过基于$l^1$范数的稀疏性（仅在最终模型中选择一部分特征）和基于$l^2$范数的规范性（偏好小权重而非大权重）。设计带有新颖且特定于领域的惩罚项的复合目标函数是一个令人兴奋的研究领域。我们旨在为读者打下基础，涵盖目前在训练深度神经网络中常用的方法。\n\
  \n## 7.1 引入正则化项\n\n在深度神经网络的背景下，我们在前一章中已经遇到了作为一种正则化形式的稀疏性。例如，在训练期间使用脱校技术时，通过随机禁用神经网络中的特定节点来获得稀疏网络。卷积运算中的权重共享属性也起着与拥有稀疏网络相同的作用。通过将减少参数数量作为一种正则化形式，算法不太可能选择过于复杂的模型，因此也不太容易过拟合。\n\
  \n稀疏神经网络在计算上也更快、可扩展性更强。例如，虽然果蝇或蚂蚁的大脑中大约有250K个神经元，但它们仍能执行运动感应和觅食等复杂任务。在现代深度学习时代，这个规模的神经网络勉强算是中等规模。然而，如自主机器人中越来越复杂的模型所示，要完成类似任务，我们需要一个大得多的网络。神经元级稀疏性，即每个神经元仅连接到下游神经元的一个子集，正在成为稳健神经网络的基本属性。在识别面孔时，只有大脑的特定部分被激活，其余部分保持不活跃。因此，将输入信号引导至神经网络中的正确区域，并避免对正确预测贡献甚微的冗余计算，至关重要。\n\
  \n同样，在人脑的860亿个神经元中，一个典型的神经元平均仅连接到数万个其他神经元。这种稀疏连接也表现在卷积神经网络中，其中当前层的每个神经元仅接收来自前一层小块的输入信息。如上一章所介绍，CNN中的稀疏连接本质上是一个大多数连接权重为零的完全连接网络（FCN）。然而，从一开始就设计架构稀疏且高效的网络，比先从FCN开始再学习非零权重更好，因为我们可以避免将零权重与输入矩阵相乘，并为后续非线性变换对所有零求和。\n\
  \n在高维问题的情况下，稀疏表示甚至更有优势。例如，在图像识别任务中，如果将每个像素视为一个独立特征，那么使用简单线性回归模型时，需要估计的权重数量与像素数量一样多。这些权重很可能相关，尤其是在物理上彼此靠近时。当一个权重值增加时，附近的权重可能会上升（导致过拟合）或下降（补偿增加）。因此，我们需要对权重强制执行某些条件，以诱导对简单且简洁模型的偏好。\n\
  \n在我们将正则化项引入目标函数以控制估计系数的大小和/或稀疏性之前，让我们先回顾一下旨在最小化残差平方和（RSS）的线性回归设置。\n\n### 7.1.1\
  \ 未正则化的线性回归\n\n首先，让我们将目标函数表示为代价函数Q(w)；即，对于给定的权重集w，存在相应的标量代价值Q(w)。在线性回归的背景下，假设我们得到一个训练集\
  \ {(xi, yi)}i=1n，其中xi表示第i个观测值的输入特征列表，yi是相应的标量目标，数据集中总共有n个观测值。给定一组权重w，线性回归模型可以对第i个观测值进行预测f(xi;\
  \ w)，之后，预测值f(xi; w)将与相应的目标值yi进行比较，以指示预测的质量。然后将所有单独预测的质量汇总为单一评估指标Q(w)。\n\n如第2章所述，代价函数Q(w)可以表示为残差平方和：Q(w)\
  \ = Σi=1n(yi − f(xi; w))2，其中平方运算统一了正负误差，且较大误差产生的代价大于较小误差。或者，我们也可以将其表示为 Q(w) = Σi=1n(yi\
  \ − fw(xi))2，其中fw(xi)表示给定权重w时对xi的预测。这是回归问题中最广泛使用的代价指标。\n\n我们也可以使用矩阵表示法重写RSS Q(w)，这是一种更紧凑的方式来表示所有n个观测值的联合代价。这给出了\
  \ Q(w) = ||y − Φw||2，其中Φ表示转换原始设计矩阵X后的新设计矩阵。这种表示法更通用，因为如果输入矩阵没有变换，则Φ = X。RSS代价Q(w)基于线性模型\
  \ y = Φw + ϵ，其中y是以n × 1向量形式体现的目标变量，Φ是n × d设计矩阵，w是d × 1权重向量，ϵ是n × 1随机误差向量。我们可以等价地将RSS表示为\
  \ Q(w) = Σi=1n(yi − φ(xi)T w)2 = (y − Φw)T (y − Φw)。有关线性模型和RSS目标函数的图示，请参见图7.2。\n\
  \n![](img/ee98e91e6845f41077b163bec833ee40_225_0.png)\n\n图7.2 使用残差平方和（RSS）说明线性回归模型和目标函数。我们在后续分析中使用矩阵表示法以方便起见。\n\
  \n未正则化线性回归模型的最小化器可以通过将\\(Q(\\mathbf{w})\\)的梯度设置为零来获得，因为\\(Q(\\mathbf{w})\\)是\\(\\\
  mathbf{w}\\)的二次函数。我们可以得到解析梯度向量\\(\\nabla Q(\\mathbf{w}) = -2\\mathbf{\\Phi}^T(\\\
  mathbf{y} - \\mathbf{\\Phi w})\\)。将梯度向量设置为零，得出与第2章相同的正规方程：\\(\\mathbf{\\Phi}^T\\\
  mathbf{\\Phi w}^* = \\mathbf{\\Phi}^T\\mathbf{y}\\)。在等式两边开头乘以\\((\\mathbf{\\Phi}^T\\\
  mathbf{\\Phi})^{-1}\\)，可产生最小二乘估计量\\(\\mathbf{w}^{LS} = \\mathbf{w}^* = (\\mathbf{\\\
  Phi}^T\\mathbf{\\Phi})^{-1}\\mathbf{\\Phi}^T\\mathbf{y}\\)的闭式解。\n\n### 7.1.2 基于范数的惩罚\n\
  \n基于范数的惩罚是一种常用技术，旨在鼓励模型偏好更小权重的解，从而避免过拟合。\n\n如第3章所述，我们将添加一个惩罚项\\(J(\\mathbf{w}) =\
  \ \\int f''_w(x)^2 dx\\)来控制模型的曲率，从而防止过拟合。这种正则化项通常由超参数\\(\\lambda\\)乘以，以在训练数据的拟合优度和所得模型的粗糙度之间进行权衡。因此，惩罚代价函数变为\
  \ \\(Q(\\mathbf{w}) = \\sum_{i=1}^n (y_i - f_w(\\mathbf{x}_i))^2 + \\lambda \\int\
  \ f''_w(x)^2 dx\\)，所得模型称为平滑样条线。\n\n此外，我们在第二章也提到了岭回归，其中惩罚项变为 \\(J(\\mathbf{w}) =\
  \ \\|\\mathbf{w}\\|_2^2 = \\sum_{i=1}^d w_i^2\\)，其中\\(d\\)是数据集中特征的总数，\\(\\|\\mathbf{w}\\\
  |_2 = \\sqrt{\\sum_{i=1}^d w_i^2}\\)。这是\\(L^2\\)范数的平方，用于衡量估计权重的大小。相应地，使用\\(L^1\\\
  )范数的惩罚函数是 \\(J(\\mathbf{w}) = \\|\\mathbf{w}\\|_1 = \\sum_{i=1}^p |w_i|\\)，它还作为特征选择的额外好处给出稀疏解。\\\
  (L^1\\)范数和\n\n\n\n$L^2$ 范数是更一般的 $L^p$ 范数的示例，其中惩罚函数现在变为 \\( J(\\mathbf{w}) = \\|\\\
  mathbf{w}\\|_p = \\left( \\sum_{i=1}^d |w_i|^p \\right)^{1/p} \\)。所有形式的 \\( L^p\
  \ \\) 范数都使用正标量来测量权重向量 \\(\\mathbf{w}\\) 的大小，并且每个范数测量大小的方式略有不同。使用这些正则化术语，权重的高值会导致高成本；因此，优化过程被激励保持这些权重的值较小。\n\
  \nFigure 7.3 illustrates the regularized linear regression model using different\
  \ forms of penalty. Note that the sum of squared errors between the predictions\
  \ and the target values can also be interpreted as the squared \\( L^2 \\) norm\
  \ of the prediction errors.\n\n```\n\\( Q(\\mathbf{w}) = \\sum_{i=1}^n \\left( y_i\
  \ - f(\\mathbf{x}_i; \\mathbf{w}) \\right)^2 \\) \\<-- The objective/cost function\
  \ in unregularized linear regression\n\n\\( Q(\\mathbf{w}) = \\sum_{i=1}^n \\left(\
  \ y_i - f(\\mathbf{x}_i; \\mathbf{w}) \\right)^2 + \\lambda \\int f''_{\\mathbf{w}}(x)^2\
  \ dx \\) \\<-- Penalizing the second derivative to control the curvature of the\
  \ model using smoothing splines\n\n\\( Q(\\mathbf{w}) = \\sum_{i=1}^n \\left( y_i\
  \ - f(\\mathbf{x}_i; \\mathbf{w}) \\right)^2 + \\lambda \\|\\mathbf{w}\\|_2^2 \\\
  ) \\<-- \\( L^2 \\) norm in ridge regression\n\n\\( Q(\\mathbf{w}) = \\sum_{i=1}^n\
  \ \\left( y_i - f(\\mathbf{x}_i; \\mathbf{w}) \\right)^2 + \\lambda \\|\\mathbf{w}\\\
  |_1 \\) \\<-- \\( L^1 \\) norm in lasso regression\n```\n\nFigure 7.3 Different\
  \ forms of regularization in linear regression.\n\nIn the next section, we will\
  \ review the mechanism of obtaining a regularized model using the \\( L^2 \\)-norm-based\
  \ penalty in the context of polynomial regression.\n\n## 7.2 L2 regularization in\
  \ ridge regression\n\nThe ridge regression measures the magnitude of the weight\
  \ vector using the squared \\( L2 \\) norm; that is, \\( \\|\\mathbf{w}\\|_2 = w_1^2\
  \ + w_2^2 + \\cdots + w_d^2 = \\sum_{i=1}^d w_i^2 \\). We can also write this norm\
  \ using vector notation, giving \\( \\|\\mathbf{w}\\|_2 = \\mathbf{w}^t \\mathbf{w}\
  \ \\). To see this, recall that \\(\\mathbf{w}\\) is a \\( d \\times 1 \\) vector\
  \ and \\(\\mathbf{w}^t\\) is a \\( 1 \\times d \\) vector. Multiplying the two,\
  \ \\(\\mathbf{w}^t \\mathbf{w}\\) will be a \\( 1 \\times 1 \\) scalar value, which\
  \ measures the magnitude of the model weights. See figure 7.4 for an illustration.\n\
  \n![](img/ee98e91e6845f41077b163bec833ee40_227_0.png)\n\nFigure 7.4 Illustrating\
  \ the squared L2 norm using vector notation.\n\nAdding the squared L2 norm, the\
  \ objective function now becomes \\( Q(\\mathbf{w}) = RSS(\\mathbf{w}) + \\lambda\\\
  |\\mathbf{w}\\|_2^2 \\), where \\( \\lambda \\) is a hyperparameter that controls\
  \ the goodness of fit (the RSS term) and the magnitude of the resulting weights\
  \ (the ridge penalty term). We often choose the optimal \\( \\lambda \\) using cross-validation,\
  \ a technique that splits the dataset into several folds and uses different folds\
  \ for training and test purposes, similar to the train-test split section covered\
  \ in chapter 2. We can also use matrix notation to express the objective function\
  \ as \\( Q(\\mathbf{w}) = (\\mathbf{y} - \\Phi\\mathbf{w})^T(\\mathbf{y} - \\Phi\\\
  mathbf{w}) + \\lambda\\mathbf{w}^T\\mathbf{w} \\).\n\nIn order to obtain the optimal\
  \ weight vector \\( \\mathbf{w}^* \\) that minimizes the objective function \\(\
  \ Q(\\mathbf{w}) \\), we can either analytically solve for \\( \\mathbf{w}^* \\\
  ) or resort to an iterative optimization procedure such as gradient descent, both\
  \ of which require the calculation of the gradient vector \\( \\nabla Q(\\mathbf{w})\
  \ = \\nabla[RSS(\\mathbf{w}) + \\lambda\\|\\mathbf{w}\\|_2] = \\nabla[(\\mathbf{y}\
  \ - \\Phi\\mathbf{w})^T(\\mathbf{y} - \\Phi\\mathbf{w}) + \\lambda\\mathbf{w}^T\\\
  mathbf{w}] \\). Note that since \\( Q(w) \\) is quadratic in \\( \\mathbf{w} \\\
  ), we can simply set its gradient to zero in order to obtain the minimizer. Since\
  \ the gradient operation distributes across the sum, we have \\( \\nabla Q(\\mathbf{w})\
  \ = \\nabla[(\\mathbf{y} - \\Phi\\mathbf{w})^T(\\mathbf{y} - \\Phi\\mathbf{w})]\
  \ + \\lambda\\nabla[\\mathbf{w}^T\\mathbf{w}] \\). Further taking the derivative\
  \ with respect to \\( \\mathbf{w} \\) gives \\( \\nabla Q(\\mathbf{w}) = -2\\Phi^T(\\\
  mathbf{y} - \\Phi\\mathbf{w}) + 2\\lambda\\mathbf{w} \\). Let us start with the\
  \ analytic approach.\n\n### 7.2.1 Using the analytic solution\n\nTo facilitate working\
  \ with matrix notations and combine like terms, let us introduce an identity matrix\
  \ to the second term, giving \\(\\nabla Q(w) = 2\\Phi^T(y - \\Phi w) + 2\\lambda\
  \ Iw\\). The identity matrix is a special type of matrix that is square and has\
  \ a value of one on the main diagonal and a value of zero elsewhere. It has a few\
  \ useful properties. For example, for an arbitrary matrix A of size \\(n \\times\
  \ m\\), we have an \\(n \\times n\\) identity matrix \\(I_n\\) that gives \\(IA\
  \ = A\\). When \\(m = 1\\), we have \\(Iw = w\\), which is the change in the second\
  \ term. Setting \\(\\nabla Q(w^*) = 0\\) gives \\(2\\Phi^T(y - \\Phi w^*) + 2\\\
  lambda Iw^* = 0\\), which further simplifies to \\((\\Phi^T\\Phi + \\lambda I)w^*\
  \ = \\Phi^T y\\). Now, we can pre-multiply both sides by \\((\\Phi^T\\Phi + \\lambda\
  \ I)^{-1}\\) to get the ridge estimator \\(w^{ridge} = w^* = (\\Phi^T\\Phi + \\\
  lambda I)^{-1}\\Phi^T y\\). Figure 7.5 summarizes this derivation process.\n\n![](img/ee98e91e6845f41077b163bec833ee40_228_0.png)\n\
  \nFigure 7.5 Deriving the closed-form solution of the ridge estimator in linear\
  \ regression.\n\nNow, let us analyze this closed-form solution and verify if it\
  \ makes sense intuitively. When setting \\(\\lambda = 0\\), we have \\(w^{ridge}\
  \ = (\\Phi^T\\Phi)^{-1}\\Phi^T y = w^{LS}\\), which is the same as the un-penalized\
  \ least squares estimator. In this case, the model tends to overfit and end up with\
  \ a large magnitude in the resulting weights. When setting \\(\\lambda = \\infty\\\
  ), we have \\(w^{ridge} = 0\\) since the solution involves dividing an infinitely\
  \ big number for each weight. In this case, the model is over simplistic and just\
  \ a straight line, exhibiting a severe underfitting phenomenon. In practice, \\\
  (\\lambda\\) is a positive number determined via cross-validation or other model\
  \ selection techniques based on the input dataset at hand.\n\nWhen contrasting with\
  \ the closed-form solution of least squares, the net impact is the additional term\
  \ \\(\\lambda I\\) added to \\(\\Phi^T\\Phi\\) before taking its inverse. An underlying\
  \ assumption when calculating \\((\\Phi^T\\Phi)^{-1}\\) is that the number of linearly\
  \ independent observations \\(n\\) is bigger than the number of (again, linearly\
  \ independent) features \\(d\\) in the design matrix \\(\\Phi\\). Here, linear independence\
  \ means any row (column) in the matrix \\(\\Phi^T\\Phi\\) cannot be a result of\
  \ linear combination from other rows (columns) in \\(\\Phi^T\\Phi\\). That closed-form\
  \ solution will break down if we have more linearly independent features than linearly\
  \ independent observations, i.e., \\(d > n\\), since there will be more than one\
  \ solution and the system of normal equations is underdetermined. In other words,\
  \ the matrix \\(\\Phi^T\\Phi\\) is not invertible when \\(d > n\\) in the unregularized\
  \ linear regression setting.\n\nWe have an advantage by adding a regularization\
  \ term here. However, notice that the linear models' coefficients are often used\
  \ for inference. Adding a regularization term makes inferential questions hard to\
  \ ascertain as the algorithm now is trying to simultaneously optimize parameter\
  \ values and perform variable selection.\n\nBy adding the additional term \\(\\\
  lambda I\\), we are essentially adding a scalar value \\(\\lambda\\) to all the\
  \ diagonal elements of \\(\\Phi^T\\Phi\\). This makes the new matrix (\\(\\Phi^T\\\
  Phi + \\lambda I\\)) invertible now, even when we have more features than observations,\
  \ i.e., \\(d > n\\). This is an important property when we have a lot of features\
  \ in the dataset; by penalizing the magnitude of the weights, we are able to learn\
  \ from all features in a high-dimensional setting. The extra term \\(\\lambda I\\\
  ) makes the matrix (\\(\\Phi^T\\Phi + \\lambda I\\)) more regular and invertible,\
  \ thus the linear model using ridge penalty is regularized.\n\nIt should be noted\
  \ that both \\(\\mathbf{w}^{LS}\\) and \\(\\mathbf{w}^{ridge}\\) require \\(O(d^3)\\\
  ) of work when calculating the matrix inverse; that is, the amount of computation\
  \ is cubic in the number of features we have. Obviously, when \\(d\\) is large,\
  \ calculating the closed-form solution using the analytic expression will be computationally\
  \ prohibitive. Now that we have a way to work with high-dimensional data by using\
  \ the ridge penalty, how can we obtain the solution more efficiently? The answer\
  \ is that we would need a more computationally efficient algorithm, which seems\
  \ to be a good job for the gradient descent algorithm.\n\n### 7.2.2 Using gradient\
  \ descent algorithm\n\nInstead of using the closed-form solution which is computationally\
  \ demanding, we can resort to the gradient descent algorithm to leverage its computational\
  \ efficiency. Since we have a total of \\(d\\) features and each feature is updated\
  \ independently, let us focus on the update procedure for the \\(j^{th}\\) feature.\n\
  \nRecall that the gradient of the cost function in ridge regression is \\(\\nabla\
  \ Q(\\mathbf{w}) = -2\\Phi^T(\\mathbf{y} - \\Phi\\mathbf{w}) + 2\\lambda\\mathbf{w}\\\
  ). When taking the gradient with respect to the \\(j^{th}\\) feature, the partial\
  \ derivative of \\(Q(\\mathbf{w})\\) with respect to \\(w_j\\) can be written as\
  \ \\(\\partial Q(\\mathbf{w}) / \\partial w_j = -2\\Phi_j^T(\\mathbf{y} - \\Phi\\\
  mathbf{w}) + 2\\lambda w_j\\), where the only change is the second term. The first\
  \ term is the same as the term in the gradient descent update using least squares,\
  \ while the second term adds information on the relative magnitude of the current\
  \ weight during the gradient descent update. We can also write it as \\(\\partial\
  \ Q(\\mathbf{w}) / \\partial w_j = -2 \\sum_{i=1}^n \\Phi_{ij}(y_i - \\sum_{k=1}^d\
  \ \\Phi_{ik} w_k) + 2\\lambda w_j\\), where the summation across all observations\
  \ is shown explicitly.\n\nWhen plugging in the coordinate-wise gradient descent\
  \ algorithm, covered in chapter 4, we have \\(w_j^{(t+1)} := w_j^{(t)} - \\eta[-2\
  \ \\sum_{i=1}^n \\Phi_{ij}(y_i - \\sum_{k=1}^d \\Phi_{ik} w_k^{(t)}) + 2\\lambda\
  \ w_j^{(t)}]\\) for all weights, where \\(w_j^t\\) is the value of \\(w_j\\) at\
  \ the \\(t^{th}\\) iteration, \\(w_j^{(t+1)}\\) is its updated value at the next\
  \ iteration, and \\(\\eta\\) is the learning rate. The := sign means \\(w_j^{(t+1)}\\\
  ) is defined as the expression on the right. Equivalently,\n\n\n我们可以将更新规则表示为 $w_j^{(t+1)}\
  \ := (1 - 2\\eta\\lambda)w_j^{(t)} + 2\\eta \\sum_{i=1}^n \\Phi_{ij}(y_i - \\sum_{k=1}^d\
  \ \\Phi_{ik}w_k^{(t)})$。图 7.6 说明了使用梯度下降法的岭回归更新规则。\n\n![](img/ee98e91e6845f41077b163bec833ee40_230_0.png)\n\
  \n图 7.6 使用梯度下降算法说明了坐标式更新规则。与仅使用 RSS 的最小二乘更新规则相比，岭回归在经过相同更新之前会先将原始权重缩小。\n\n需要注意的是，与未正则化的最小二乘更新规则相比，唯一的变化在于第一项的乘数\
  \ $(1 - 2\\eta\\lambda)$，这实际上会缩小原始 $w_j$ 的规模。要理解这一点，请回顾 $\\eta$ 和 $\\lambda$ 都是手动选择的正数，通常从小值开始。当\
  \ $2\\eta\\lambda < 1$ 时，该乘数本质上会按一定比例缩小 $w_j^{(t)}$，随后跟随来自未正则化 RSS 的相同更新项。当我们为 $\\\
  eta$ 或 $\\lambda$ 设置较大值，使得 $2\\eta\\lambda > 1$ 时，这种解释不一定成立。\n\n让我们可视化岭回归中的缩小效应。图\
  \ 7.7 展示了从 $w_j^{(t)}$ 到 $w_j^{(t+1)}$ 的一个示例更新路径。在岭回归中使用梯度下降更新时，第一步操作是缩小当前权重，以控制权重幅度方面的模型复杂度。这种操作有助于减少过拟合。之后，更新继续基于模型与数据之间的拟合优度。然而，使用最小二乘的未正则化线性回归模型只关注在每次迭代中将模型拟合到数据，这增加了出现过拟合的机会。\n\
  \n![](img/ee98e91e6845f41077b163bec833ee40_231_0.png)\n\n图 7.7 比较了使用坐标式梯度下降算法的最小二乘更新和岭回归更新。\n\
  \n使用坐标式梯度下降的整体优化算法（每次更新都使用所有观测值来计算梯度）可以描述如下。首先，我们会在优化开始时为权重向量初始化一个起始点。这可以通过设置 w\
  \ = 0 或随机初始化来完成。然后，我们遍历每个权重/坐标，应用岭回归的更新规则。这完成了一轮优化。此过程重复，直到 RSS 梯度的 L1 范数或其百分比变化小于预设参数\
  \ r（例如 0.01%）。我们也可以使用其他标准来判断优化过程是否已收敛。图 7.8 描述了完整的优化流程。\n\nInitialize $\\mathbf{w}^t$\
  \ at the beginning of optimization when $t = 0$\nWhile $\\| \\nabla RSS(\\mathbf{w}^t)\
  \ \\|_1 > \\tau$:\nFor each $j$ in $[1, ..., d]$:\n$$ w_j^{(t+1)} \\leftarrow (1\
  \ - 2\\eta\\lambda)w_j^{(t)} + 2\\eta \\sum_{i=1}^n \\mathbf{\\Phi}_{ij} \\left(\
  \ y_i - \\sum_{k=1}^d \\mathbf{\\Phi}_{ik} w_k^{(t)} \\right) $$\n$t \\leftarrow\
  \ t + 1$\n\n图 7.8 岭回归的坐标式梯度下降优化算法。\n\n在深入实现之前，让我们再看一个重要细节：处理偏置项。\n\n### 7.2.3 处理偏置项\n\
  \n偏置项（也称为截距项）是指模型中不乘以任何特征的权重，它充当水平偏移。添加偏置项后，对于第 \\(i\\) 个观测值，模型变为 $y_i = \\sum_{j=0}^d\
  \ w_j \\mathbf{\\Phi}_{ij} + \\epsilon_i = w_0 \\mathbf{\\Phi}_{i0} + w_1 \\mathbf{\\\
  Phi}_{i1} + \\dots + w_d \\mathbf{\\Phi}_{id} + \\epsilon_i$，其中 \\(\\mathbf{\\Phi}_{i0}\
  \ = 1\\) 是根据第 2 章介绍的偏置技巧手动添加的值为 1 的条目，权重向量 \\(\\mathbf{w}\\) 开头对应有一个新的条目 \\(w_0\\\
  )。\n\n基于岭回归目标函数的表达式，总代价现在变为 \\(Q(\\mathbf{w}) = RSS(\\mathbf{w}) + \\lambda ||\\\
  mathbf{w}||_2\\)，其中第一个条目 \\(w_0\\) 也受到惩罚，并被鼓励幅度较小。然而，不建议对偏置项施加惩罚，因为它并不影响模型的过拟合行为。\n\
  \n对偏置项有两种变通方法。我们可以选择不对偏置项施加惩罚，使 \\(Q(\\mathbf{w}) = RSS(w_0, w_{rest}) + \\lambda\
  \ ||w_{rest}||_2\\)，其中平方 \\(L2\\) 范数包括除第一个条目外的所有权重。要在岭回归的闭式解中实现这一点，即 \\(\\mathbf{w}^{ridge}\
  \ = (\\mathbf{\\Phi}^T \\mathbf{\\Phi} + \\lambda \\mathbf{I})^{-1} \\mathbf{\\\
  Phi}^T \\mathbf{y}\\)，我们可以将单位矩阵 \\(\\mathbf{I}\\) 的第一个条目设为零，从而得到修改后的单位矩阵 \\(\\mathbf{I}^{modified}\\\
  ) 及其对应的解析形式 \\(\\mathbf{w}^{ridge} = (\\mathbf{\\Phi}^T \\mathbf{\\Phi} + \\lambda\
  \ \\mathbf{I}^{modified})^{-1} \\mathbf{\\Phi}^T \\mathbf{y}\\)。至于梯度下降算法，我们可以简单地为\
  \ \\(w_0\\) 添加一个特例，使其遵循仅基于 RSS 的更新规则，即 \\(w_0^{(t+1)} \\leftarrow w_0^{(t)} + 2\\\
  eta \\sum_{i=1}^n \\mathbf{\\Phi}_{ij} (y_i - \\sum_{k=1}^d \\mathbf{\\Phi}_{ik}\
  \ w_k^{(t)})\\)。请参见图 7.9，了解闭式解和迭代优化计划中相关变化的说明。\n\n解析闭式解\n\n梯度下降\n\n$$ \\mathbf{w}^{ridge}\
  \ = (\\mathbf{\\Phi}^T\\mathbf{\\Phi} + \\lambda \\mathbf{I}^{modified})^{-1} \\\
  mathbf{\\Phi}^T \\mathbf{y} $$\n\n![](img/ee98e91e6845f41077b163bec833ee40_233_0.png)\n\
  \nWhile \\(\\|\\nabla RSS(\\mathbf{w}^t)\\|_1 > \\tau\\):\nFor each \\(j\\) in \\\
  ([1, ..., d]\\):\n\nLeast squares update\n\nIf \\(j == 0\\):\n\n$$ w_0^{(t+1)} \\\
  leftarrow w_0^{(t)} + 2\\eta \\sum_{i=1}^n \\Phi_{ij} \\left( y_i - \\sum_{k=1}^d\
  \ \\Phi_{ik} w_k^{(t)} \\right) $$\n\nElse:\n\nRidge regression update\n\n$$ w_j^{(t+1)}\
  \ \\leftarrow (1 - 2\\eta\\lambda)w_j^{(t)} + 2\\eta \\sum_{i=1}^n \\Phi_{ij} \\\
  left( y_i - \\sum_{k=1}^d \\Phi_{ik} w_k^{(t)} \\right) $$\n\n$$ t \\leftarrow t\
  \ + 1 $$\n\n图 7.9 说明在不对偏置项施加惩罚时，闭式解和梯度下降算法的相关变化。\n\n如果你不想更改任何一种算法，一种方法是通过将目标向量 y\
  \ 居中来转换数据。将目标变量居中可确保其均值为零，因此是否对幅度施加惩罚区别不大。换句话说，我们可以在岭回归中运行闭式解或常规梯度下降更新，而无需区分偏置项的权重。\n\
  \n因此，岭回归使我们能够在标准线性回归设置中处理许多特征。它给了我们一个控制手段（超参数 \\(\\lambda\\)）来平衡偏差和方差。在下一节中，我们将深入探讨从零开始实现以及使用\
  \ PyTorch 的自动微分机制进行实现。\n\n### 7.2.4 L2 正则化实战\n\n在本节中，我们将演示在目标函数中使用基于 L2 范数的惩罚来控制最终估计系数的幅度。首先，让我们通过以下代码清单加载必要的包，其中我们使用\
  \ `datasets` 类在线性回归设置中创建一个虚拟数据集，并通过 `SEED` 参数控制后续代码的随机性。\n\n### 清单 7.1 加载必要的包\n\n\
  ```\nimport math, argparse\nimport numpy as np\nfrom numpy import random\nimport\
  \ torch\nimport torch.nn as nn\nfrom sklearn import datasets\nfrom sklearn.model_selection\
  \ import train_test_split\nimport matplotlib.pyplot as plt\n\nSEED = 8 #A\nrandom.seed(SEED)\n\
  torch.manual_seed(SEED)\nnp.random.seed(SEED)\n```\n\n#A 设置随机种子以确保可重复性\n\n接下来，我们生成一个包含\
  \ 100 个观测值和 20 个特征的虚拟数据集，噪声为 80，作为应用于输出的高斯噪声的标准差，使用 `make_regression()` 函数。请注意，该函数有一个名为\
  \ `n_informative` 的参数，表示用于生成输出的有价值特征的数量。该参数的默认值为 10。由于我们正在创建一个包含 20 个特征的数据集，这实际上意味着只有其中一半特征是有用的。\n\
  \n然后，我们应用偏置技巧，使用 `np.c_()` 函数在设计矩阵 `X` 中添加一列 1。随后，使用 `sklearn` 中的 `train_test_split()`\
  \ 函数将数据集分为训练集和测试集。观测值和特征维度分别存储在 `n_samples` 和 `n_features` 中。\n\n### 清单 7.2 生成虚拟数据集\n\
  \n```\nX, y = datasets.make_regression(n_samples=100, n_features=20, noise=80, random_state=SEED)\
  \ #A\nX = np.c_[np.ones(X.shape[0]), X] #B\nX_train, X_test, y_train, y_test = train_test_split(X,\
  \ y, test_size=0.2, random_state=SEED) #C\nn_samples, n_features = X_train.shape\n\
  ```\n\n#A 准备虚拟数据\n#B 应用偏置技巧\n#C 划分训练集和测试集\n\n在实现的第一部分中，我们将专注于之前提到的坐标式梯度下降方法。我们将查看普通最小二乘的结果，然后将其与使用岭回归的同一模型的正则化版本进行比较。\n\
  \n### 使用坐标式梯度下降的线性回归\n\n首先，让我们创建一个名为 `GD_regression` 的类，用于托管模型估计所需的一系列属性和方法。在以下代码清单中，我们在初始化方法中包含了学习率\
  \ `lr`、训练轮数 `num_epochs` 以及 `l2` 惩罚的缩放因子 `l2_penalty` 等输入参数。我们还包含两个数组，分别用于存储不同轮次下的训练集和测试集损失。\n\
  \n\n\n\n### 清单 7.3 使用梯度下降创建未正则化线性回归的类\n\n```\nclass GD_regression:\n    def __init__(self,\
  \ lr=1e-3, num_epochs=1000, l2_penalty=0):\n        self.lr = lr\n        self.num_epochs\
  \ = num_epochs\n        self.l2_penalty = l2_penalty\n        self.train_loss =\
  \ []\n        self.test_loss = []\n```\n\n接下来，我们将定义两个实用函数来支持坐标式梯度下降算法。在以下代码片段中，我们定义函数\
  \ `calculate_mse()` 来计算均方误差，以及 `feature_derivative_ridge()` 函数以获取每个特征的导数。`calculate_mse()`\
  \ 是我们在上一章中使用的同一实用函数，我们首先生成存储在 `f_star` 中的预测列表，计算 `resid` 中的残差，最后返回 `Q` 中的总均方误差。`feature_derivative_ridge()`\
  \ 函数实现了前面讨论的精确解析式导数解，其中我们将第一个偏置项的权重情况单独分离，因为它不受惩罚。请注意，这两个函数都包含在 `GD_regression`\
  \ 类的方法中。\n\n### 清单 7.4 计算 MSE 和导数的类方法\n\n```\ndef calculate_mse(self, X, y, weights):\
  \ #A\n    f_star = X@weights #B\n    resid = y - f_star #C\n    Q = np.dot(resid.T,\
  \ resid).mean() #D\n    return Q\n\ndef feature_derivative_ridge(self, errors, feature,\
  \ weight, l2_penalty,\n    feature_is_constant): #E\n    if feature_is_constant\
  \ == True: #F\n        derivative = np.dot(feature, errors) * 2\n    elif feature_is_constant\
  \ == False: #G\n        derivative = np.dot(feature, errors) * 2 + 2*l2_penalty*weight\n\
  \    else:\n        derivative = 'derivative not exist!!!'\n    return derivative\n\
  ```\n\n- # A 计算均方误差的函数\n- # B 生成模型预测\n- # C 计算残差\n- # D 作为最终代价的 MSE\n- # E 计算特征级解析式导数的函数\n\
  - # F 计算对应偏置项权重的导数\n- # G 计算所有其他权重的导数\n\n最后，我们将定义 `fit()` 方法来执行拟合和估计过程。如以下代码片段所示，我们首先初始化存储在\
  \ `weights` 中的零数组，并开始由输入参数 `num_epochs` 指定的总轮数的优化循环。这与基于特征规范 RSS 的停止条件不同，这里出于方便而使用。我们在每个\
  \ epoch 中计算所有观测值的预测和误差，然后进入对所有权重的循环以执行坐标式梯度下降更新。接着，我们使用训练集和测试集对当前权重进行评分，并将结果分别存储在\
  \ train_loss 和 test_loss 中。\n\n### 清单 7.5 模型拟合的类方法\n\n```python\ndef fit(self, X_train,\
  \ y_train, X_test, y_test): #A\n    weights = np.zeros(X_train.shape[1]) #B\n  \
  \  epoch = 0 #C\n    while epoch < self.num_epochs: #D\n        epoch += 1 #E\n\
  \        predictions = np.dot(X_train, weights) #F\n        errors = predictions.reshape(-1,1)\
  \ - y_train.reshape(-1,1) #G\n        for i in range(len(weights)): #H\n       \
  \     if i == 0: #I\n                derivative = self.feature_derivative_ridge(errors,\n\
  \                X_train[:,i].reshape(1,-1), weights[i], self.l2_penalty, True)\
  \ #J\n            else:\n                derivative = self.feature_derivative_ridge(errors,\n\
  \                X_train[:,i].reshape(1,-1), weights[i], self.l2_penalty, False)\
  \ #K\n                weights[i] = weights[i] - self.lr * derivative #L\n\n    \
  \    self.train_loss.append(self.calculate_mse(X_train, y_train, weights)) #M\n\
  \        self.test_loss.append(self.calculate_mse(X_test, y_test, weights)) #M\n\
  \        # store the final weights\n        self.weights = weights\n    return self\n\
  ```\n\n- #A 估计模型系数的函数\n- #B 将权重初始化为零数组\n- #C 迭代计数器\n- #D 当未达到最大迭代次数时\n- #E 递增迭代计数器\n\
  - #F 基于当前权重计算预测值\n- #G 将误差计算为预测值 – 输出\n- #H 对每个权重执行坐标式梯度下降\n- #I 计算第 i 个权重的导数\n\
  - #J 当 i=0 时计算常量权重的导数\n- #K 计算所有其他权重的导数\n- #L 对每个坐标/权重执行梯度下降更新\n- #M 使用训练集和测试集进行评分\n\
  \n让我们训练模型 100 个 epoch 并观察训练损失和测试损失的变化。在以下代码清单中，我们使用 num_epochs=100 实例化一个 GD_regression\
  \ 类并将其存储在 model 对象中，随后调用 fit() 方法使用训练集和测试集训练和评估模型。然后我们绘制两条损失曲线。\n\n### 清单 7.6 模型训练与结果可视化\n\
  \n```python\nmodel = GD_regression(num_epochs=100)\nmodel.fit(X_train, y_train,\
  \ X_test, y_test)\nx_axis = list(range(model.num_epochs))\nplt.plot(x_axis, model.train_loss,\
  \ label = \"train\")\nplt.plot(x_axis, model.test_loss, ':', label = \"test\")\n\
  plt.legend()\nplt.show()\n```\n\n运行上述命令生成图 7.10，两条曲线在第 20 个 epoch 左右趋于稳定。请注意，训练集占总数据集的\
  \ 80%，因此在相同的线性模型下，其 MSE 高于测试集。随着底层模型变得非线性且更加复杂，当模型进入临界和超参数化模式时，我们预期训练损失将低于测试损失，这是第\
  \ 3 章涵盖的主题。\n\n![](img/ee98e91e6845f41077b163bec833ee40_237_0.png)\n\n### 图 7.10\
  \ 不同 epoch 的训练集和测试集 MSE 损失。\n\n让我们向目标函数激活 $L_2$ 范数惩罚，并观察其对模型估计的影响。这次，我们在创建模型类时设置\
  \ `l2_penalty=10`，并将四条损失曲线一起绘制，如以下代码清单所示。\n\n### 清单 7.7 带 l2 惩罚的模型训练\n\n```\nmodel_ridge\
  \ = GD_regression(num_epochs=100, l2_penalty=10)\nmodel_ridge.fit(X_train, y_train,\
  \ X_test, y_test)\nx_axis = list(range(model.num_epochs))\nplt.plot(x_axis, model.train_loss,\
  \ label = \"train-without-ridge\")\nplt.plot(x_axis, model.test_loss, ':', label\
  \ = \"test-without-ridge\")\nplt.plot(x_axis, model_ridge.train_loss, '--', label\
  \ = \"train-with-ridge\")\nplt.plot(x_axis, model_ridge.test_loss, '-.', label =\
  \ \"test-with-ridge\")\nplt.legend()\nplt.show()\n```\n\n运行上述命令生成图 7.11，其中 $L_2$\
  \ 范数惩罚略微增加了训练集和测试集的损失。这来自岭回归所鼓励的收缩权重。\n\n![](img/ee98e91e6845f41077b163bec833ee40_238_0.png)\n\
  \n### 图 7.11 未正则化回归与岭回归的训练集和测试集损失比较。\n\n我们可以通过查看结果权重的 $L_2$ 范数来进一步验证收缩效果。如以下代码片段所示，我们使用\
  \ `numpy` 中的 `norm` 函数来计算两个模型权重向量的 $L_2$ 范数。结果表明，与未正则化模型相比，岭回归在估计权重中具有较低的 $L_2$\
  \ 范数。\n\n```\n>>> from numpy import linalg as LA\n>>> print(LA.norm(model.weights,\
  \ 2))\n>>> print(LA.norm(model_ridge.weights, 2))\n187.12047119912242\n164.13282992694337\n\
  ```\n\n我们将在下一节中使用神经网络实现相同的线性回归模型。当只有一个输入层和一个输出层（也称为单层神经网络）时，神经网络模型本质上等价于线性回归模型。这是基于这样一个事实：输入层和输出层之间的矩阵乘法步骤（第\
  \ 4 章涵盖的主题，且没有激活步骤）恢复了线性回归操作。\n\n### 使用单层神经网络的线性回归\n\n为了学习线性回归模型，让我们定义一个单层全连接网络（FCN）。输入大小等于特征数量，输出大小为一，因为每个输入观测值只有一个标量输出。在以下代码清单中，我们定义一个名为\
  \ FCN_regression 的类来存储必要的属性和方法。初始化时，该类需要几个输入参数：input_size 中的输入特征数量，lr 中的 SGD 学习率，num_epochs\
  \ 中的 epoch 数量，以及 l2_penalty 中 L2 惩罚的标量超参数大小。我们还将模型架构定义为存储在 model 中的单个线性层，将 nn.MSELoss()\
  \ 作为存储在 criterion 中的损失函数，并将 SGD 作为存储在 optimizer 中的优化器。\n\n### 清单 7.8 创建单层 FCN 的类\n\
  \n```\nclass FCN_regression:\n    def __init__(self, input_size, lr=1e-3, num_epochs=1000,\
  \ l2_penalty=0):\n        self.lr = lr\n        self.num_epochs = num_epochs\n \
  \       self.l2_penalty = l2_penalty\n        self.train_loss = []\n        self.test_loss\
  \ = []\n        self.model = nn.Linear(input_size, 1)\n        self.criterion =\
  \ nn.MSELoss()\n        self.optimizer = torch.optim.SGD(self.model.parameters(),\
  \ lr=self.lr)\n```\n\n接下来，我们将在类中创建一个 fit() 方法来执行模型估计任务。如以下代码片段所示，我们将训练集和测试集作为训练和评分的输入，由于我们使用\
  \ PyTorch，因此需要将其转换为张量格式。沿用相同的零初始化策略，我们执行与第 4 章中训练典型神经网络相同的训练过程。具体来说，我们执行前向传播以获取训练集的模型预测\
  \ y_predicted，计算 loss_train 中的损失，如有需要则添加 L2 惩罚，清除相关变量中的历史梯度，通过反向传播自动计算当前梯度，最后执行由\
  \ num_epochs 指定的总 epoch 数的随机梯度下降更新。此外，我们还在每一轮训练后在无梯度设置下计算测试集 MSE。\n\n```\ndef fit(self,\
  \ X_train, y_train, X_test, y_test):\n    weights = np.zeros(X_train.shape[1]) #A\n\
  \    epoch = 0 #B\n    X_train = torch.from_numpy(X_train).float() #C\n    X_test\
  \ = torch.from_numpy(X_test).float() #C\n    y_train = torch.from_numpy(y_train).float()\
  \ #C\n    y_test = torch.from_numpy(y_test).float() #C\n\n    for epoch in range(self.num_epochs):\n\
  \        y_predicted = self.model(X_train) #D\n        loss_train = self.criterion(y_predicted,\
  \ y_train) #E\n        self.train_loss.append(loss_train.item())\n```\n\n\n\n```\n\
  l2_norm = sum(p.pow(2.0).sum() for p in self.model.parameters()) #F\nloss_train\
  \ = loss_train + self.l2_penalty * l2_norm #F\nself.optimizer.zero_grad() #G\nloss_train.backward()\
  \ #G\nself.optimizer.step() #G\nwith torch.no_grad(): #H\n    y_test_pred = self.predict(X_test)\n\
  \    loss_test = self.criterion(y_test_pred, y_test)\n    self.test_loss.append(loss_test.item())\n\
  \nreturn self\n```\n\n```\n#A Initialize weights to be an array of zeros\n#B Iteration\
  \ counter\n#C convert to tensor\n#D forward pass to calculate prediction\n#E get\
  \ current MSE loss\n#F add L2 penalty\n#G backward pass to perform SGD\n#H calculate\
  \ and store test loss without gradient\n```\n\n请注意，我们为测试集额外提供了一个 `predict()` 函数。这是与上一章中使用的相同的函数，该函数首先将模型转换为评估模式，执行评分，然后将模式切换回训练模式。\n\
  \n```\ndef predict(self, x):\n    model = self.model.eval()\n    outputs = model(x)\n\
  \    model = self.model.train()\n    return outputs\n```\n\n让我们在训练集和测试集上测试该类。在下面的代码清单中，我们实例化了一个学习率为\
  \ 0.001、训练轮数总计 10,000 的 `FCN_regression` 类。迭代次数远多于之前，因为与之前的全批量梯度下降更新相比，SGD 由于其随机性需要更多的迭代才能收敛。接着我们调用\
  \ `fit()` 方法训练模型，并绘制训练集和测试集上的 MSE 结果。\n\n### 代码清单 7.9 FCN 模型的模型训练与结果可视化\n\n```\n\
  model = FCN_regression(input_size=X_train.shape[1], lr=1e-3, num_epochs=10000)\n\
  model.fit(X_train, y_train, X_test, y_test)\nx_axis = list(range(model.num_epochs))\n\
  plt.plot(x_axis, model.train_loss, label = \"train\")\nplt.plot(x_axis, model.test_loss,\
  \ ':', label = \"test\")\nplt.legend()\nplt.show()\n```\n\n运行上述命令生成图 7.12。随着训练损失逐渐收敛，我们对测试集\
  \ MSE 有一个有趣的观察：一条典型的从欠拟合到过拟合的 U 形曲线。然而，测试集 MSE 在第 4000 轮之后趋于稳定。这可能与 SGD 算法本身带来的隐式正则化效应有关（下一章将详细介绍），因为模型训练过程中并未使用任何显式正则化技术。\n\
  \n![](img/ee98e91e6845f41077b163bec833ee40_241_0.png)\n\n图 7.12 使用单层 FCN 模型的训练集和测试集\
  \ MSE。\n\n现在，让我们通过将 L2 惩罚设置为 0.1 来激活它并观察其影响。欢迎调整此超参数，并使用附带的笔记本 https://github.com/jackliu333/regularization_in_deep_learning/blob/main/Chapter_7.ipynb\
  \ 探索结果。如图 7.13 所示，添加 L2 惩罚对训练损失曲线没有明显变化，但导致不同轮次下测试集 MSE 显著降低。因此，对模型权重的大小进行控制有助于模型在测试集上泛化得更好。\n\
  \n![](img/ee98e91e6845f41077b163bec833ee40_242_0.png)\n\n图 7.13 使用单层 FCN 模型对比未正则化和岭回归的训练及测试集损失。\n\
  \n在下一节中，我们将探讨另一种常用的正则化项：$L1$ 惩罚，也称为 LASSO。\n\n## 7.3 通过 LASSO 进行稀疏估计\n\n基于 l1 范数的惩罚也称为\
  \ LASSO，即最小绝对收缩与选择算子（Least Absolute Shrinkage and Selection Operator）。对权重绝对值之和进行惩罚时，我们实际上同时进行了变量选择和模型估计。变量选择是\
  \ LASSO 的自然副产品：使用权重的绝对值对其大小进行惩罚时，某些权重将被设为零，从而相当于从完整特征空间中丢弃这些不重要的特征。最终模型中保留下来的特征被认为更为重要，得到的模型也更加简洁。因此，对权重的\
  \ l1 范数进行正则化有助于促进线性方程组的稀疏解。\n\n在探讨使用 l1 范数的稀疏性驱动因素之前，让我们从几何角度重新审视 l2 范数，并以此为基础建立对基于\
  \ LASSO 的稀疏性的直觉。\n\n### 7.3.1 岭回归的几何解释\n\n岭回归通过对权重的 L2 范数进行惩罚，使我们能够求解欠定方程组。也就是说，当方程组中未知变量的数量多于方程数量时，岭惩罚可以产生一个具有最小\
  \ L2 范数权重的唯一解。相比之下，若不对权重使用任何惩罚，欠定方程组则有无穷多个解。\n\n让我们来看一个简单的线性方程案例，包含两个输入变量、一个输出变量和一个单一观测值。换句话说，我们希望在\
  \ y = x^T w = x1w1 + x2w2 中求解 w = [w1, w2]。由于只有一个可用观测值，满足该方程的 w 解有无穷多个。从图形上看，我们可以代入观测值\
  \ (x, y)，在以 w1 和 w2 为坐标轴的坐标系中得到一条直线。这条直线表示线性方程所施加的约束下所有可能的（无穷多个）解，直线上的每一点都代表一个解。请参见图\
  \ 7.14 的示意图。\n\n![](img/ee98e91e6845f41077b163bec833ee40_243_0.png)\n\n图 7.14 岭回归几何解释的可视化。所有可能的解共同构成这条直线。使用\
  \ L2 范数在直线与圆的交点处给出一个唯一解，此时半径最小。任何其他点都将对应更大的半径，因此也有更大的 L2 范数。\n\n在此过程中，我们不断从原点绘制圆并增大半径，直到与直线相交。这个交点即代表优化问题的解。虽然直线是无数个同样优良解的集合，但使用\
  \ L2 范数强制在众多圆中选取半径最小的那个唯一解，每个圆对应一个不同的 L2 范数。为了看出 L2 范数与圆半径之间的对应关系，请注意 ||w||_2 =\
  \ sqrt(w1^2 + w2^2)。因此，圆上的所有点（解）共享相同的 L2 范数。\n\n### 7.3.2 引入 L0 范数\n\n在某些情况下，我们也希望得到一个满足线性方程且尽可能多权重为零的解，即稀疏解。一种直接的方法是对权重的\
  \ L0 范数进行惩罚，以得到一些权重为零的稀疏解。\n\nL0 范数定义为向量中非零元素的个数。在我们的语境中，||w||0 = #{i | wi != 0}，其中\
  \ i ∈ {1, 2}。对 L0 范数进行惩罚意味着寻找非零元素数量最少的最稀疏解，这是一个 NP-hard 问题，需要评估所有可能的特征子集。图 7.15\
  \ 说明了在 L0 范数约束下求解线性方程的场景，其中解必须位于任意一条坐标轴上，以便只有一个权重为零。请注意，我们依然在寻找具有最小 L0 范数的解；因此，任何从交点延伸出来的解都被排除。在此情况下，加粗的点表示最优解，它通过将\
  \ w2 = 0 给出一个稀疏解。\n\n![](img/ee98e91e6845f41077b163bec833ee40_244_0.png)\n\n图 7.15\
  \ 基于 L0 范数惩罚求解线性方程的几何解释。虽然所有解都必须位于直线上，但 L0 惩罚只要求解位于任意一条坐标轴上即可产生稀疏解。在 L0 惩罚约束下求解线性方程是一项\
  \ NP-hard 任务，因为此前常用的凸优化技术（将梯度设为零）在此情况下失效。\n\n仅有两个权重的情况很简单。然而，想象一下有几十个权重需要共同学习。在这种情况下，快速弄清楚哪些权重应该为零就成为一项非平凡的任务。换句话说，使用\
  \ L0 范数求解此问题的复杂度\n\n\n呈指数增长，因为这是一个 NP-hard 问题。这与我们之前的方法形成对比，之前的方法是将梯度设为零，并使用凸优化获得全局最优解。请回顾，凸优化寻求凸函数的全局最小值，这一主题在第\
  \ 2 章中有所涉及。\n\n我们如何在将相同方法扩展到高维数据集的大规模问题时获得稀疏解？L1 范数正是为此而来，它允许我们以凸的方式实现稀疏解，并更高效地扩展到更大规模的问题。通过惩罚\
  \ L1 范数，模型会倾向于通过将一些权重设为零来生成稀疏解。\n\n### 7.3.3 引入 L1 范数\n\n基于 L1 范数的线性回归，即 LASSO 回归，可以处理高维问题，并以计算高效的方式隐式生成一组稀疏权重。权重上的\
  \ L1 范数定义为 ||w||₁ = Σ|wᵢ| = |w₁| + |w₂|。在我们的贯穿示例中，通过最小化拟合的 RSS 与权重的（缩放的）L1 范数，模型估计过程将得出一个唯一解（在无数解中），该解具有最小的\
  \ L1 范数。\n\n让我们以图形方式可视化估计过程。如图 7.16 所示，L1 范数表示为菱形，这意味着同一菱形上的所有权重具有相同的 L1 范数值。为了说明这一点，让我们将\
  \ L1 范数设为任意常数 C，即 |w1| + |w2| = C。考虑对权重进行模运算（取绝对值），总共有四种不同的组合：w1 ≥ 0 & w2 ≥ 0、w1\
  \ ≥ 0 & w2 < 0、w1 < 0 & w2 ≥ 0 和 w1 < 0 & w2 < 0。这给出了四个不同的线性方程，即 w1 + w2 = C、w1\
  \ – w2 = C、–w1 + w2 = C 和 –w1 – w2 = C。这四个方程（直线）共同构成一个菱形。菱形上的所有点共享相同的 L1 范数。菱形上的所有点也被称为水平集。\n\
  \n- 菱形表示具有相等 L1 范数的权重\n- 通过惩罚 L1 范数获得的唯一最优解\n- 每个菱形表示 |w1| + |w2| = C 的图形，其中 C 是任意常数\n\
  - 不同的菱形表示具有不同 L1 范数的不同解\n\n![](img/ee98e91e6845f41077b163bec833ee40_246_0.png)\n\
  \n图 7.16 基于 L1 范数惩罚求解线性方程的几何解释。虽然直线上有无数个解，但引入 LASSO 惩罚可以唯一确定一个具有最小 L1 范数的解，如加粗的点所示，该点很可能也是稀疏解（在此例中，w1\
  \ = 0）。\n\n在直线上的无数解中，我们关注的是产生最小 L1 范数的那个唯一解：即直线上菱形大小最小的点。这个解由图中的加粗点表示，该点也恰好是一个稀疏解（w1\
  \ = 0）。这并非巧合；LASSO 惩罚引入了对稀疏解的额外偏好。因此，L1 范数为欠定系统促进稀疏解，尤其是在自由参数远多于观测值的高维环境中。\n\n###\
  \ 7.3.4 理解 LASSO\n\nLASSO 回归产生稀疏解和可解释模型，且不易过拟合。Robert Tibshirani 在 1996 年的一篇题为“通过\
  \ Lasso 进行回归收缩与选择”的论文中提出了该方法。此后，LASSO 惩罚开始流行，并在许多需要可解释模型的领域得到广泛应用。可解释性是采用可运行模型时的重要考量因素。在试图理解模型的决策过程时，我们通常更倾向于使用因子数量相对较少、复杂度较低的模型，以帮助解释逻辑并追踪信息流。这正是其受欢迎的主要原因之一。\n\
  \n请注意，LASSO 回归适用于欠定问题和过定问题。欠定问题指的是在求解线性方程组时，自由变量（因此也包括权重）的数量多于观测值的情况，而过定系统则正好相反：观测值多于变量。在这两种情况下，我们可能希望获得一个选取的特征最少的稀疏解，同时保持良好的预测精度。\n\
  \n在处理高维问题时，使用最小二乘法进行优化本质上假设所有因素都很重要，因此应保留在最终模型中。使用 LASSO 时，我们通过仅保留原始特征的一个子集来打破这一假设，并假设并非所有变量都相关。最小化权重的\
  \ L1 范数通过在权重向量中仅突出少量条目（同时生成良好的拟合）来促进稀疏性。例如，假设我们有一个具有 50 个特征的模型和另一个具有 5 个特征的模型，两者的预测精度相同。我们肯定会更倾向于选择第二个模型，因为它更具可解释性和可传达性。基于简约原则，我们会选择能够较好描述数据的最简单模型。稀疏模型也更稳健，因为它不太可能对数据过拟合。\n\
  \n超参数 lambda 控制在最小化正则化目标函数 Q(w) = RSS(w) + λ||w||₁ 时的稀疏程度。当 λ = 0 时，它恢复最小二乘解，该解对训练数据给出最佳线性拟合，但可能会对测试数据过拟合。当\
  \ λ 非常大时，模型过度简约，在训练集和测试集上的表现都很差。选择合适的 λ 通常通过交叉验证进行，其中验证集用作测试集并近似模型的泛化误差。如图 7.17\
  \ 所示，在绘制一系列 λ 下的训练集和验证集误差（即 MSE）时，每个 λ 通常对应多个验证折叠（称为 K 折交叉验证），选择验证误差最低的 λ 值。请注意，使用交叉验证程序选择的最优\
  \ λ 倾向于产生比稀疏解的最优选择更不稀疏的解，因为前者更关注预测精度。此外，请注意 x 轴使用 λ 的倒数，因此左端表示较大的 λ，右端表示较小的 λ（一直到零）。\n\
  \n![](img/ee98e91e6845f41077b163bec833ee40_248_0.png)\n\n图 7.17 不同超参数 $\\lambda`\
  \ 值下的训练误差和验证误差曲线。随着 $1/\\lambda` 从小变大，验证误差曲线将呈现典型的 U 形曲线，在典型的线性回归问题中从欠拟合过渡到过拟合。最优\
  \ $\\lambda` 是通过最小化验证误差来选择的。\n\n同样，并非所有 $\\lambda` 值都会导致稀疏解。当 $\\lambda` 相对较小时，得到的权重仍可能全部非零。当\
  \ $\\lambda` 增加到特定值时，将出现稀疏解，其增加会导致得到的权重进一步稀疏。让我们在略有不同的背景下重新审视相同的轮廓图，以更好地欣赏 LASSO\
  \ 诱导稀疏性背后的几何解释。这次，我们将假设一个包含许多观测值的一般设置，而不是像之前示例中那样只有一个观测值。我们仍将使用两个权重进行说明。\n\n如图 7.18\
  \ 所示，目标函数由 RSS 项 $\\sum_{i=1}^N (y_i - w_0 \\phi_{i0} - w_1 \\phi_{i1})^2` 和权重的\
  \ $L1` 范数 $(|w_0| + |w_1|)$ 组成，并由超参数 $\\lambda` 加权。当 $\\lambda = 0` 时，解为最小二乘法，如左图中的实心点所示。当\
  \ $\\lambda \\rightarrow \\infty` 时，解为原点，如右图中的实心点所示。左侧轮廓图由表示不同权重水平集的椭圆组成。例如，当将 RSS\
  \ 项设为特定常数时，我们有 $\\sum_{i=1}^N y_i^2 + w_0^2 \\sum_{i=1}^N \\phi_{i0}^2 + w_1^2 \\\
  sum_{i=1}^N \\phi_{i1}^2 + cross terms = constant`，这正是图上椭圆的表达式。常数越大，椭圆越大。同样，我们可以将\
  \ $L1` 范数的水平集可视化为菱形。因此，从图形上看，LASSO 回归是椭圆和菱形的加权组合。\n\n\n\n\n![](img/ee98e91e6845f41077b163bec833ee40_249_0.png)\n\
  \n图 7.18 LASSO 回归中 RSS 与 L1 范数的几何解释。\n\n现在，在最小化 LASSO 正则化的目标函数时，我们实质上是在图中寻找一个解点，该点对应于椭圆（RSS\
  \ 项）与菱形（L1 范数）的交点，超参数 lambda 控制每个形状的大小。交点倾向于出现在菱形的尖角处（有一定概率），如图 7.19 所示。在高维设置中，这种概率甚至更高，解很可能会命中其中一个高维角点。\n\
  \n![](img/ee98e91e6845f41077b163bec833ee40_250_0.png)\n\n图 7.19 固定 \\(\\lambda\\\
  ) 值下的 LASSO 解可视化。\n\n### 7.3.5 软阈值法则\n\n迄今为止，我们一直在探讨如何利用目标函数的梯度信息来获取最优权重，无论是在推导解析解（将一阶导数设为零）还是在迭代梯度下降算法中。然而，LASSO\
  \ 回归中目标函数 \\(Q(\\mathbf{w}) = RSS(\\mathbf{w}) + \\lambda \\|\\mathbf{w}\\|_1\\\
  ) 的梯度无法直接使用。\n\n具体来说，对于权重向量 \\(\\mathbf{w}\\) 中的每个 \\(w_j\\)，我们需要计算 \\(|w_j|\\)\
  \ 对 \\(w_j\\) 的导数，即 \\(d|w_j|/dw_j\\)。当 \\(w_j > 0\\) 时，有 \\(|w_j| = w_j\\)，其导数为\
  \ 1。相应地，如果 \\(w_j < 0\\)，导数为 -1。然而，在 \\(w_j = 0\\) 处不存在导数，这一问题点排除了使用解析解和基于梯度的优化算法的可能性。关于\
  \ \\(|w_j|\\) 在不同 \\(w_j\\) 值处的图像及其导数，请参见图 7.20。\n\n![](img/ee98e91e6845f41077b163bec833ee40_251_0.png)\n\
  \n图 7.20 不同 $w_j$ 值处 $|w_j|$ 导数的示意图。\n\n为了求解最优权重向量，我们可以使用另一种称为坐标下降的迭代优化过程，它一次只更新一个坐标/权重，同时保持其他所有权重固定。具体来说，该算法在\
  \ $w_j = 0$ 时依赖 $|w_j|$ 的次梯度。尽管坐标下降算法不是我们的重点，但理解其推导过程有助于我们更深入地了解 LASSO 如何获得稀疏解，即使用软阈值法则，这是每个坐标\
  \ $w_j$ 的更新规则。让我们来看看该规则是如何推导的。\n\n回顾一下，LASSO 目标函数为 $Q(\\mathbf{w}) = RSS(\\mathbf{w})\
  \ + \\lambda||\\mathbf{w}||_1 = \\sum_{i=1}^N (y_i - \\sum_{k=0}^d \\Phi_{ik} w_k)\
  \ + \\lambda \\sum_{k=0}^d |w_k|$。在使用坐标下降算法时，假设我们专注于更新第 $j$ 个权重 $w_j$，并保持其他所有权重\
  \ $\\mathbf{w}_{-j}$ 固定，将第一阶偏导数 $\\frac{\\partial Q(\\mathbf{w})}{\\partial w_j}$\
  \ 设为零，以求得当前坐标 $w_j$ 的解析式更新。图 7.21 展示了第一项 $RSS(\\mathbf{w})$ 偏导数的推导过程。与之前的推导过程相比，关键区别在于我们将涉及\
  \ $w_j$ 的项与其余部分分开，其余部分被假设保持固定，因此偏导数为零。需要注意的是，$\\rho_j$ 可以被视为设计矩阵与不含 $w_j$ 的预测误差之间的相关性。\n\
  \n$$\\frac{\\partial}{\\partial w_j} RSS(\\mathbf{w}) = -2\\Phi_j^T (\\mathbf{y}\
  \ - \\Phi \\mathbf{w})$$\n$$= -2 \\sum_{i=1}^n \\Phi_{ij} \\left( y_i - \\sum_{k=1}^d\
  \ \\Phi_{ik} w_k \\right)$$\n[将 \\( w_j \\) 与其他固定项分开]\n$$= -2 \\sum_{i=1}^n \\Phi_{ij}\
  \ \\left( y_i - \\sum_{k \\neq j} \\Phi_{ik} w_k - \\Phi_{ij} w_j \\right)$$\n[将\
  \ \\( w_j \\) 表示为独立项]\n$$= -2 \\sum_{i=1}^n \\Phi_{ij} \\left( y_i - \\sum_{k \\\
  neq j} \\Phi_{ik} w_k \\right) + 2w_j \\sum_{i=1}^n \\Phi_{ij}^2$$\n[为记号方便重新表示]\n\
  $$= -2\\rho_j + 2w_j z_j$$\n\n其中 \\(\\rho_j = \\sum_{i=1}^n \\Phi_{ij} (y_i - \\\
  sum_{k \\neq j} \\Phi_{ik} w_k)\\) 和 \\(z_j = \\sum_{i=1}^n \\Phi_{ij}^2\\)\n\n\
  图 7.21 关于单个权重 \\( w_j \\) 的 RSS 一阶偏导数推导。\n\n接下来，让我们计算 LASSO 惩罚项关于 \\( w_j \\) 的偏导数。由于当\
  \ \\( w_j = 0 \\) 时 \\(|w_j|\\) 没有梯度，我们可以求助于次梯度的表示法，它将梯度推广到不可微点，并指所有对原始函数（在此例中为\
  \ \\(|w_j|\\)）构成下界的平面（候选集合）。从图示角度看，如图 7.22 所示，原点处（不可微点）的次梯度是位于函数 \\(|w_j|\\) 下方的所有虚线的集合。将次梯度记为\
  \ \\(V\\)，当 \\(w_j = 0\\) 时，有 \\(V \\in [-1,1]\\)。\n\n![](img/ee98e91e6845f41077b163bec833ee40_253_0.png)\n\
  \n图 7.22 引入原点处的次梯度。\n\n因此，我们可以将 \\(\\lambda|w_j|\\) 关于 \\(w_j\\) 的偏导数表示为三种不同情况。当\
  \ \\(w_j < 0\\) 时，LASSO 惩罚项的偏导数为 \\(\\lambda \\partial_{w_j}|w_j| = -\\lambda\\\
  )。当 \\(w_j > 0\\) 时，有 \\(\\lambda \\partial_{w_j}|w_j| = \\lambda\\)。当 \\(w_j =\
  \ 0\\) 时，有 \\(\\lambda \\partial_{w_j}|w_j| = [-\\lambda, \\lambda]\\)。\n\n综上所述，目标函数关于单个权重\
  \ \\(w_j\\) 的偏导数也可以表示为三种情况。即，当 \\(w_j < 0\\) 时，\\(\\lambda \\partial_{w_j} Q(\\\
  mathbf{w}) = 2z_j w_j - 2\\rho_j - \\lambda\\)；当 \\(w_j = 0\\) 时，\\(\\lambda \\\
  partial_{w_j} Q(\\mathbf{w}) = [-2\\rho_j - \\lambda, -2\\rho_j + \\lambda]\\)；当\
  \ \\(w_j > 0\\) 时，\\(\\lambda \\partial_{w_j} Q(\\mathbf{w}) = 2z_j w_j - 2\\rho_j\
  \ + \\lambda\\)。图 7.23 总结了次梯度的表达式。\n\n\\(\\lambda \\partial_{w_j} |w_j| = \\begin{cases}\
  \ -\\lambda, & w_j < 0 \\\\ [-\\lambda, \\lambda], & w_j = 0 \\\\ \\lambda, & w_j\
  \ > 0 \\end{cases}\\)\n\nLASSO 惩罚项的次梯度\n\n加上 \\(\\frac{\\partial}{\\partial w_j}\
  \ RSS(\\mathbf{w}) = -2\\rho_j + 2w_j z_j\\)\n\n\\(\\lambda \\partial_{w_j} Q(\\\
  mathbf{w}) = \\begin{cases} 2w_j z_j - 2\\rho_j - \\lambda, & w_j < 0 \\\\ [-2\\\
  rho_j - \\lambda, -2\\rho_j + \\lambda], & w_j = 0 \\\\ 2w_j z_j - 2\\rho_j + \\\
  lambda, & w_j > 0 \\end{cases}\\)\n\n目标函数的次梯度\n\n图 7.23 LASSO 惩罚项和目标函数次梯度的表达式。\n\
  \n为了获得最优解，我们接着令 \\(\\lambda \\partial_{w_j} Q(\\mathbf{w}) = 0\\)，这同样要求我们考虑三种不同情况。当\
  \ \\(w_j < 0\\) 时，有 \\(2z_j w_j - 2\\rho_j - \\lambda = 0\\)，由此得 \\(w_j = (\\rho_j\
  \ + \\lambda/2)/z_j\\)，并要求 \\(\\rho_j < -\\lambda/2\\)（因为 \\(z_j > 0\\)）。当 \\(w_j\
  \ = 0\\) 时，我们要求区间 \\([-2\\rho_j - \\lambda, -2\\rho_j + \\lambda]\\) 包含零，这意味着 \\\
  (-2\\rho_j - \\lambda \\le 0\\) 和 \\(-2\\rho_j + \\lambda \\ge 0\\) 需同时满足。由此得到 \\\
  (-\\lambda/2 \\le \\rho_j \\le \\lambda/2\\)。当 \\(w_j > 0\\) 时，有 \\(2z_j w_j - 2\\\
  rho_j + \\lambda = 0\\)，由此得 \\(w_j = (\\rho_j - \\lambda/2)/z_j\\)，并要求 \\(\\rho_j\
  \ > \\lambda/2\\)。这也被称为软阈值法则，其中一些权重被设为零，其他权重则被缩小到零方向（缩小量为 \\(\\lambda/2z_j\\)）。\n\
  \n换句话说，当 \\(\\rho_j \\in [-\\lambda/2, \\lambda/2]\\) 时，权重 \\(w_j\\) 被缩小到零。当 \\\
  (\\rho_j < -\\lambda/2\\) 或 \\(\\rho_j > \\lambda/2\\) 时，我们添加偏置项 \\(\\lambda/2\\\
  ) 以减小 \\(w_j\\) 最小二乘解的幅度；也就是说，当 \\(\\lambda = 0\\) 时，最小二乘解为 \\(w_j = \\rho_j / z_j\\\
  )。图 7.24 总结了使用次梯度得到的 \\(w_j\\) 的解析解，以及软阈值法则与最小二乘解的图形比较。\n\n![](img/ee98e91e6845f41077b163bec833ee40_255_0.png)\n\
  \n图 7.24 软阈值法则示意图。\n\n在下一节中，我们将探讨 LASSO 惩罚项的实现，并将其与普通回归和岭回归进行比较。\n\n### 7.3.6 LASSO\
  \ 实战\n\n在本节中，我们将基于 MNIST 数据集训练一个简单的前馈神经网络，并观察添加不同类型正则化项（如岭惩罚、LASSO 惩罚以及弹性网惩罚，即岭回归和\
  \ LASSO 的加权组合）时的影响。首先，让我们构建一个包含训练神经网络所需逻辑的类。\n\n在以下代码清单中，我们构建一个名为 `MLP()` 的类，它包含与之前相同的初始化参数。我们在\
  \ `nn.Sequential()` 函数中定义了一个 FCN，该函数在将图像数据展平为数组后包含三个线性层。\n\n\n\n\n\n### 代码清单 7.10\
  \ 构建用于不同正则化类型训练 FCN 的类\n\n```\nclass MLP:\n    def __init__(self, lr=1e-3, num_epochs=10,\
  \ l1_weight=0, l2_weight=0):\n        self.lr = lr\n        self.num_epochs = num_epochs\n\
  \        self.l1_weight = l1_weight\n        self.l2_weight = l2_weight\n      \
  \  self.train_loss = []\n        self.test_accuracy = []\n        self.model = nn.Sequential(\n\
  \            nn.Flatten(),\n            nn.Linear(28 * 28 * 1, 64),\n          \
  \  nn.ReLU(),\n            nn.Linear(64, 32),\n            nn.ReLU(),\n        \
  \    nn.Linear(32, 10)\n        )\n        self.model.cuda()\n        self.criterion\
  \ = nn.CrossEntropyLoss().cuda()\n        self.optimizer = torch.optim.SGD(self.model.parameters(),\
  \ lr=self.lr)\n```\n\n接下来，我们构建一个 fit() 方法来执行模型训练。以下代码片段显示，该方法需要两个输入参数：训练集和测试集的数据加载器。对于每个\
  \ epoch，我们首先提取训练数据集的当前批次，并执行常规前向传播以获得预测值和相应的损失。如果 LASSO 或岭回归惩罚的权重被激活，我们会将额外的惩罚项添加到当前损失中。为了计算这些惩罚项，我们首先使用\
  \ self.model.parameters() 获取模型的所有参数，然后将其存储在列表中以供后续计算。这些惩罚项使用函数 compute_l1_loss()\
  \ 和 compute_l2_loss() 进行计算，这两个函数将在稍后介绍。在对损失进行反向传播并更新权重后，我们还会在每个 epoch 结束时在测试集上对模型进行评分。每次迭代的训练损失和每个\
  \ epoch 的测试集准确率分别存储在属性 train_loss 和 test_accuracy 中。\n\n### 代码清单 7.11 模型拟合的类方法\n\
  \n```\ndef fit(self, trainloader, testloader):\n    for epoch in range(self.num_epochs):\
  \ #A\n        print(f'Starting epoch {epoch+1}')\n        for i, data in enumerate(trainloader,\
  \ 0):\n            X_train, y_train = data #B\n            X_train, y_train = Variable(X_train).cuda(),\
  \ Variable(y_train).cuda() #C\n            self.optimizer.zero_grad() #D\n     \
  \       y_predicted = self.model(X_train) #E\n            loss_train = self.criterion(y_predicted,\
  \ y_train) #F\n\n            if self.l1_weight != 0: #G\n                l1_parameters\
  \ = []\n                for parameter in self.model.parameters():\n            \
  \        l1_parameters.append(parameter.view(-1))\n                l1 = self.l1_weight\
  \ * self.compute_l1_loss(torch.cat(l1_parameters))\n                loss_train +=\
  \ l1\n\n            if self.l2_weight != 0: #H\n                l2_parameters =\
  \ []\n                for parameter in self.model.parameters():\n              \
  \      l2_parameters.append(parameter.view(-1))\n                l2 = self.l2_weight\
  \ * self.compute_l2_loss(torch.cat(l2_parameters))\n                loss_train +=\
  \ l2\n\n            loss_train.backward() #I\n            self.optimizer.step()\
  \ #J\n            self.train_loss.append(loss_train.item()) #K\n\n            with\
  \ torch.no_grad(): #L\n                X_test, y_test = iter(testloader).next()\n\
  \                X_test = X_test.cuda()\n                y_test_pred = self.predict(X_test.cpu())\
  \ #M\n                self.test_accuracy.append(np.mean((y_test == y_test_pred).numpy()))\
  \ #N\n                print('Test accuracy: {}'.format(self.test_accuracy[-1]))\n\
  \n        return self\n```\n\n- #A 遍历训练数据的 DataLoader\n- #B 获取输入\n- #C 如果可用，发送到\
  \ GPU\n- #D 将梯度归零\n- #E 执行前向传播\n- #F 计算损失\n- #G 添加 L1 损失分量\n- #H 添加 L2 损失分量\n- #I\
  \ 执行后向传播\n- #J 执行优化\n- #K 添加训练损失\n- #L 获取测试集性能\n- #M 获取测试集预测\n- #N 存储测试集准确率\n\n\
  类中还有几个其他函数。首先，`predict()` 函数用于在评估模式下对测试集数据进行评分，具体是通过设置 `self.model.eval()` 来实现；每个观测值的最终预测是通过\
  \ `torch.max(outputs.data, 1)` 命令，在所有数字类别中选择 logit 最大的那个。有关 `predict()` 函数的代码片段如下，它与我们在前一章中介绍的函数相同。\n\
  \n### 代码清单 7.12 模型预测的类方法\n\n```\ndef predict(self, x):\n    model = self.model.eval()\n\
  \    outputs = model(Variable(x))\n    _, pred = torch.max(outputs.data, 1)\n  \
  \  model = self.model.train()\n    return pred\n```\n\n接下来，让我们看看 `compute_l1_loss()`\
  \ 和 `compute_l2_loss()`。如以下代码片段所示，这两个函数都执行逐元素操作（LASSO 取绝对值，岭回归对权重取平方），然后对所有权重求和，以产生一个标量的数值。\n\
  \n```\ndef compute_l1_loss(self, w):\n    return torch.abs(w).sum()\n\ndef compute_l2_loss(self,\
  \ w):\n    return torch.square(w).sum()\n```\n\n我们现在可以准备训练和测试数据集了。在以下代码清单中，我们首先下载\
  \ MNIST 数据集，然后分别将其加载到 `trainloader` 和 `testloader` 中。`trainloader` 的批量大小为 128，而\
  \ `testloader` 的批量大小为测试集的总大小；我们希望一次性对所有测试集观测值进行评分。\n\n### 代码清单 7.13 准备训练集和测试集\n\n\
  ```\ntransform = transforms.Compose([transforms.ToTensor(), transforms.Normalize([0.5],\
  \ [0.5])])\ntrainset = MNIST(root='data/', train=True, download=True, transform=transform)\n\
  testset = MNIST(root='data/', train=False, transform=transform)\ntrainloader = torch.utils.data.DataLoader(trainset,\
  \ batch_size=128, shuffle=True)\ntestloader = torch.utils.data.DataLoader(testset,\
  \ batch_size=len(testset), shuffle=False)\n```\n\n现在我们已准备好初始化模型并使用数据集进行训练。在以下代码清单中，我们指定设备为\
  \ GPU（如果可用），并准备训练总共四个不同的模型：未正则化模型、LASSO 正则化模型、岭回归正则化模型以及采用组合正则化方案的模型。我们通过在列表推导式中调用\
  \ `fit()` 方法来训练每个模型。\n\n### 代码清单 7.14 训练四个 MLP 模型\n\n```\ndevice = torch.device('cuda'\
  \ if torch.cuda.is_available() else 'cpu') #A\nmodel_list = [MLP(num_epochs=50,\
  \ l1_weight=0, l2_weight=0),\n    MLP(num_epochs=50, l1_weight=0.001, l2_weight=0),\n\
  \    MLP(num_epochs=50, l1_weight=0, l2_weight=0.001),\n    MLP(num_epochs=50, l1_weight=0.001,\
  \ l2_weight=0.001)] #B\n[tmp_model.fit(trainloader, testloader) for tmp_model in\
  \ model_list] #C\n```\n\n```\n# A set optimization device\n# B model configuration\
  \ and initialization\n# C start training\n```\n\n在 Google Colab 的单个 GPU 实例上，对四个模型各训练\
  \ 50 个 epoch，整个过程大约需要 1 小时。为了防止会话超时，保存输出也可能有所帮助。有关完整的训练代码，请查看附带的笔记本：https://github.com/jackliu333/regularization_in_deep_learning/blob/main/Chapter_7_2.ipynb\n\
  \n请注意，采用组合正则化方案的模型称为弹性网（elastic net），它是指在目标函数中将系数的 L1 范数和 L2 范数的加权和作为联合惩罚项。如果我们的目标仅是约束模型权重，可以只正则化\
  \ L2 范数；如果我们希望同时进行特征选择和模型估计，可以只正则化 L1 范数；如果两者都想实现，则应用弹性网惩罚。\n\n训练完成后，我们可以比较四个模型的预测性能。在以下代码清单中，我们绘制了四个模型在不同迭代次数下的训练损失曲线。\n\
  \n### 代码清单 7.15 绘制训练损失曲线\n\n```\nmlp_train_loss = np.array([tmp_model.train_loss\
  \ for tmp_model in model_list])\nlabels = ['MLP no regularization',\n          'MLP\
  \ with L1 regularization',\n          'MLP with L2 regularization',\n          'MLP\
  \ with both L1 and L2']\nstyles = ['-', '-.', '--', ':']\nplt.figure(figsize=(8,\
  \ 7))\nfor i, r in enumerate(mlp_train_loss):\n    plt.plot(np.array(range(1, len(r)+1)),\
  \ r, styles[i], label=labels[i], alpha=0.6);\nplt.legend(loc=4);\nplt.xlabel('Iterations');\n\
  plt.ylabel('Loss in training set');\nplt.show()\n```\n\n运行上述代码会生成图 7.25。该图表明，所有损失曲线都相对颠簸，这是使用\
  \ SGD 作为优化器时的典型特征。如果切换到 Adam 优化器，损失曲线会更平滑。此外，未正则化模型在各次迭代中的训练损失最低，与其他模型的较高损失曲线相比，这可能是过拟合的迹象。在超参数\
  \ λ 取相同值的情况下，L1 范数模型相比 L2 范数模型具有相对更强的正则化效果。\n\n\n\n\n\n![](img/ee98e91e6845f41077b163bec833ee40_260_0.png)\n\
  \n图 7.25 四个模型在不同训练迭代中的训练损失曲线可视化。\n\n让我们绘制四个模型在不同训练轮次上的测试集准确率。如图 7.26 所示，四个模型在测试集上都表现出相近的预测准确率。未正则化模型和岭正则化模型的准确率最高。在实践中，手动调整超参数\
  \ lambda 是一个需要多次尝试的迭代过程，以在预测准确率和稀疏性之间取得平衡。网格搜索、随机搜索或贝叶斯优化等自动化过程是超参数搜索中的常见替代方案。\n\
  \n![](img/ee98e91e6845f41077b163bec833ee40_261_0.png)\n\n图 7.26 四个模型在不同训练轮次上的测试集准确率曲线可视化。\n\
  \n在结束本章之前，需要注意的是，正则化项可以应用于网络中特定的参数组/层，而不仅仅是所有参数。此外，实现正则化项的方法有多种。例如，在使用 SGD 定义优化器时，有一个名为\
  \ weight_decay 的参数，我们可以用它来指定 L2 惩罚项的权重。\n\n将正则化作为额外的损失项添加到目标函数中是一个活跃的研究领域。希望你在阅读本章后能有一个良好的起点，并在未来的探索之旅中继续研究更多令人兴奋且特定于领域的正则化项。\n\
  \n## 7.4 总结\n\n- 通过目标函数进行的正则化是指向原始未正则化损失项添加的任何正则化/惩罚项，其中正则化旨在惩罚模型权重的大小\n- 常见的基于范数的正则化项包括\
  \ LASSO 惩罚（L1 范数）、岭惩罚（L2 范数）或弹性网（LASSO 与岭的加权组合）\n- 在寻求最优权重时，可以推导闭式解并直接计算解；当闭式解不可用时，我们通常采用迭代方法（如（随机）梯度下降）或替代优化程序（如坐标下降）\n\
  - 偏置项通常不受惩罚，仅与特征相关的权重会根据基于范数的大小受到惩罚\n- 基于 LASSO 的惩罚倾向于根据软阈值规则将部分权重设为零、其余权重趋近于零，从而生成稀疏解\n\
  - LASSO 和岭惩罚在正则化效果方面都具有良好的几何诠释\n- 实现基于范数的惩罚不止一种方式，既可以从头开始实现，也可以使用现成工具\n- 调整正则化项的超参数需要多次尝试和错误\n"
- "# 通过优化实现的正则化\n\n## 本章内容\n\n- SGD 的隐式正则化效应及利用 SGD 梯度流的平均迭代进行的近期理论分析\n- SGD 在期望下的收敛性\n\
  - 流行的 SGD 变体，如动量（momentum）和 Adam，它们并不一定比标准 SGD 具有更好的泛化性能\n- 一元线性回归设置下 SGD 收敛行为的理论分析\n\
  \n迄今我们所涵盖的正则化技术（包括通过数据、模型和目标函数进行的正则化）都涉及对模型训练过程的额外处理，以实现正则化效果。例如，我们可以通过扩充训练数据、在神经网络中添加丢弃层或在目标函数中惩罚权重大小来对过拟合模型进行正则化。然而，作为模型训练过程的最后一个组件以及本章主题的优化算法，无需任何额外处理即可引入隐式正则化效应。换言之，我们在常规优化模型的同时即可获得正则化的好处。\n\
  \n能够同时优化并（隐式地）正则化神经网络模型的特定优化算法是随机梯度下降（SGD），这是一种古老却最广泛用于训练大型深度神经网络的算法。我们在之前的章节中多次遇到\
  \ SGD，并使用该算法优化了多个神经网络。本章将通过分析其理论特性和实证表现来考察其隐式正则化行为。我们对其对泛化性能贡献的理解仍在不断加深，该领域的近期研究论文也印证了这一点。本章希望介绍关于其正则化属性的一些最新发现。\n\
  \n## 8.1 随机优化\n\n深度学习中的泛化性能是一道独具神秘色彩的菜肴，包含多种配料，随机优化是主要成分之一。与确定性优化相比，随机优化强调优化过程中的随机性成分。这种随机性（或噪声）未必是坏事。事实上，随机行为往往能驱动优化器找到比确定性优化器更好的解，使用\
  \ SGD 训练的模型与使用全批量梯度下降算法训练的模型对比便可见一斑。\n\n让我们重新审视经验风险最小化框架，并在此背景下分析梯度下降算法族。\n\n###\
  \ 8.1.1 通过梯度下降实现经验风险最小化\n\n训练深度神经网络的旅程归结为一个优化问题：在参数空间中定位能实现最佳泛化性能的解。在数学上，对于给定当前权重\
  \ w 和训练数据集 D 时返回损失的损失函数 Q(w, D)，我们的目标是找到其（全局，希望如此）最小值：\n\n```\nmin_w Q(w, D) = min_w\
  \ \\sum_{i=1}^n Q_i(w, D_i)\n```\n\n此处损失函数是所有个体损失的总和，属于有限求和问题。当 n → ∞ 时，我们得到一个随机优化问题。\n\
  \n现在回顾第 2 章介绍的梯度下降更新算法公式，此处也予以展示以便参考。在下一次梯度下降更新迭代的方程中，我们根据当前权重 w_t、偏导数的梯度向量 ∇_w\
  \ Q(w_t, D)（通过对当前损失关于权重求导计算得出）和一个较小的学习率 η，获得下一次迭代的权重值 w_{t+1}。\n\n此处，Q(w_t, D) 是基于训练数据集\
  \ D 和当前权重向量 w_t 的经验损失函数。目前，我们假设它是直接的损失项，如均方误差（MSE），尽管它可以包含其他正则化项，例如权重的 L1 或 L2 范数。此处的负号表明\
  \ w_t 沿着损失函数下降最快的方向移动。然后，我们将继续迭代梯度下降更新，直到该过程收敛（w_t 变化极小）或保留验证集（用于近似未见测试集）上的性能指标（即\
  \ MSE）不再下降。\n\n让我们讨论一下此梯度下降更新面临的挑战。\n\n首先，我们需要使用训练集 D 中的所有观测值并将个体损失相加以获得总损失 Q(w_t,\
  \ D)。当训练集中的观测数量变得很大时，遍历所有观测值以计算个体损失将非常耗时。\n\n其次，在内存有限的 GPU 实例上计算 Q(w_t, D) 具有挑战性，因为我们需要将所有数据装入\
  \ GPU 内存以计算总损失并执行反向传播更新。GPU 内存的硬件限制要求在计算过程中处理合理数量的数据。\n\n第三，无需使用所有观测值来计算平均损失 Q(w,\
  \ D)。由于中心极限定理适用，我们只需使用 D 的一部分来计算平均损失项 MSE，它在合理数量的迭代后将收敛到整个数据集的 MSE。\n\n出于这些考虑，通常使用基于\
  \ D 子集的随机梯度下降更新规则。如下一个更新方程所示，我们用 D_t 表示 D 的随机子集（也称为小批量）。在每次迭代中，我们随机采样一个子集 D_t 并用它执行一次梯度下降更新。该更新规则也称为小批量\
  \ SGD（minibatch-SGD），如第 2 章所述。\n\n```\nw_{t+1} = w_t - \\eta \\nabla_w Q(w_t, D_t)\n\
  ```\n\n随机子集 D_t 可以被视为一个随机变量，在每次更新中由 D 中的一组随机观测值组成。然而，在实践中，我们通常将原始训练集 D 预先划分为不同的子集（称为小批量\
  \ mini-batches），在内层循环中对不同的小批量执行梯度下降更新，并在外层循环中多次重复该过程（称为轮次）。\n\n需要注意的是，在数学分析中我们将小批量\
  \ D_t 视为随机变量，以确保不同小批量之间相互独立。为实现这一点，我们会求助于随机数生成器并生成随机索引以获取小批量中的观测值，其大小也取决于 D 的大小。\n\
  \n此外，使用随机梯度下降算法并不保证我们能在每一步都降低损失函数。由于子集的随机性，我们甚至可能在特定步骤中增加损失值，但整体过程将随机地朝局部最优解移动。\n\
  \n在每次梯度下降更新中切换到小批量有助于在 D 相当大时促进模型训练。然而，我们可能会问小批量梯度下降更新算法是否收敛到代价函数的局部最小值，或者是否在损失曲面上不断游荡。让我们在下一节中查看\
  \ SGD 的收敛性。\n\n### 8.1.2 SGD 的收敛性\n\n为了让一个算法取得成功并获得普及，我们通常会询问该算法是否收敛到某个解，以及如果收敛，收敛速度如何。对于标准梯度下降，我们知道在选择合适的学习率时，该算法总是会收敛到某个特定的局部最小解。尽管该解在泛化性能方面可能并不理想，但它仍会收敛到权重空间中的一个临界点（更具体地说，梯度向量等于零的点）。\n\
  \n但是，由于使用随机小批量 D_t，在每次 SGD 更新中都随机走一步，我们是否仍能得到同样的保证，即该过程会导致某个特定解？换句话说，我们想知道 SGD 是否仍然收敛。\n\
  \n我们将使用 SGD 估计器 Q(w, D_t) 的无偏性性质。无偏估计器意味着估计器在期望上等于被估计的目标。也就是说，如果以下条件成立，我们的 SGD 估计器\
  \ Q(w, D_t) 就是原始损失项 Q(w, D) 的无偏估计器：\n\n\n\n\\(\\mathbb{E}[Q(\\mathbf{w}, D_t)] =\
  \ Q(\\mathbf{w}, D)\\)\n\n该属性表明，在使用小批量SGD且给定足够小学习率时，经验风险在期望意义下不会相对于全批量GD而增加。这也符合直觉。SGD使用训练数据随机子集的平均损失来执行梯度下降更新。由于期望运算符在经验上对应于平均值，这些平均损失\
  \ \\( \\{Q(\\mathbf{w}, D_t)\\}^{t=1}_B \\)（共有 \\( B \\) 个小批量）随后被平均以近似 \\( Q(\\\
  mathbf{w}, D) \\)。此外，由于期望运算符涉及对 \\( D_t \\) 中的随机性进行积分，无偏性属性本质上表明 \\( Q(\\mathbf{w},\
  \ D_t) \\) 中的期望平均小批量损失因此等于基于整个训练集的平均损失 \\( Q(\\mathbf{w}, D) \\)。\n\nSGD估计器的无偏性属性是确保SGD收敛的重要属性，尽管每个步骤都有随机梯度估计。为了证明SGD的收敛性，我们依赖于Doob的鞅收敛定理，该定理指出任何满足特定有界性条件的超鞅都必须收敛。我们知道损失函数将被零下界界定；也就是说，我们为回归（即均方误差）和分类（即交叉熵损失）选择的损失函数不能为负。现在的问题是，随机变量序列，即小批量损失项\
  \ \\( Q(\\mathbf{w}_t, D_t) \\)，是否是一个超鞅。\n\n让我们先介绍一下什么是鞅。鞅是指具有一系列随机变量的随机过程，其中序列中下一个值的条件期望等于当前值，与所有先前值无关。换句话说，鞅在期望意义下既不增长也不收缩。另一方面，使用SGD以损失迭代形式观察到的随机变量序列将是一个超鞅，它表明未来的期望值不大于当前值。从数学上讲，我们有：\n\
  \n\\(\\mathbb{E}[Q(\\mathbf{w}_{t+1}, D) \\mid \\mathbf{w}_t, \\mathbf{w}_{t-1},\
  \ ..., \\mathbf{w}_0] \\le Q(\\mathbf{w}_t, D)\\)\n\n在此，我们将下一次迭代的期望损失以从 \\( \\mathbf{w}_0\
  \ \\) 到 \\( \\mathbf{w}_t \\) 的过去迭代历史作为条件。换句话说，当损失迭代遵循超鞅时，随机梯度下降更新算法可以通过使下一次迭代的平均损失小于当前损失来平均降低成本。从直觉上讲，这是有道理的，因为在SGD更新的每个步骤中，随机梯度向量\
  \ \\( \\nabla_w Q(\\mathbf{w}_t, D_t) \\) 指向当前小批量损失函数的最陡下降方向；我们知道，基于不同小批量的下一次迭代的期望损失\
  \ \\( Q(\\mathbf{w}_{t+1}, D_t) \\) 不大于基于整个训练集 \\( D \\) 的当前损失 \\( Q(\\mathbf{w}_t,\
  \ D) \\)。\n\n现在让我们看一个简单的一维示例，以表明序列 \\( \\{Q(\\mathbf{w}_t, D)\\} \\) 确实是一个超鞅，您会发现SGD估计器的无偏性属性起着重要作用。在下图中，我们为标量权重\
  \ \\( \\mathbf{w}_t \\in \\mathbb{R} \\) 和训练集 \\( D \\) 绘制了使用MSE的损失函数 \\( Q(\\mathbf{w},\
  \ D) \\)。对于与 \\( \\mathbf{w}_t \\) 不相距太远的下一次迭代 \\( \\mathbf{w}_{t+1} \\)，我们可以使用一阶泰勒展开来基于当前损失值\
  \ \\( Q(\\mathbf{w}_t, D) \\) 和线性近似（如虚线所示）近似 \\( Q(\\mathbf{w}_{t+1}, D) \\) 的值。这给出了以下内容：\n\
  \nQ(w_{t+1}, D) \\approx Q(w_t, D) + (w_{t+1} - w_t) \\nabla_w Q(w_t, D)\n\nFigure\
  \ 8.1 Approximating the loss value at the next iterate using first-order Taylor\
  \ expansion.\n\n由于SGD要求 \\( w_{t+1} = w_t - \\nabla_w Q(w_t, D_t) \\)，因此有 \\( w_{t+1}\
  \ - w_t = - \\nabla_w Q(w_t, D_t) \\)。将其代回上式可得：\n\nQ(w_{t+1}, D) \\approx Q(w_t,\
  \ D) - \\eta \\nabla_w Q(w_t, D_t) \\nabla_w Q(w_t, D)\n\n由于我们关注SGD更新的平均情况行为，我们对两边应用期望运算符，得到：\n\
  \nE[Q(w_{t+1}, D)] \\approx Q(w_t, D) - \\eta E[\\nabla_w Q(w_t, D_t)] \\nabla_w\
  \ Q(w_t, D)\n\n这里我们使用了 \\( E[Q(w_t, D)] = Q(w_t, D) \\) 的事实，因为历史更新中没有随机性。\n\n现在让我们引入SGD估计器的无偏性属性，即\
  \ \\( E[Q(w, D_t)] = Q(w, D) \\)。由于期望运算符和梯度运算符可交换，我们有：\n\nE[\\nabla_w Q(w_t, D_t)]\
  \ = \\nabla_w E[Q(w_t, D_t)] = \\nabla_w Q(w_t, D)\n\n将前面的泰勒展开近似代入得到：\n\nE[Q(w_{t+1},\
  \ D)] \\approx Q(w_t, D) - \\eta \\nabla_w Q(w_t, D) \\nabla_w Q(w_t, D) = Q(w_t,\
  \ D) - \\eta [\\nabla_w Q(w_t, D)]^2\n\n由于 \\([\\nabla_w Q(\\boldsymbol{w}_t, D)]^2\
  \ \\to 0\\) 且 \\(\\eta > 0\\)，我们有 \\(\\mathbb{E}[Q(\\boldsymbol{w}_{t+1}, D)] \\\
  le Q(\\boldsymbol{w}_t, D)\\)，从而证明了损失迭代序列是一个超鞅。根据Doob的鞅收敛定理，它最终会收敛到局部极小值中的一个稳定点。尽管下一次迭代的损失并不总是下降，并且由于子集\
  \ \\( D_t \\) 中的随机性有时可能会增加，但我们可以保证，平均而言，它会随时间下降。期望风险在期望意义下不会增加。Figure 8.2 summarizes\
  \ the sketch of the proof of SGD convergence.\n\nFigure 8.2 Sketch of proof on the\
  \ convergence of the SGD algorithm.\n\n请注意，并非所有估计器都是无偏的。实际上，在使用神经网络等复杂学习器时，我们很少能获得无偏估计器。然而，在实践中，情况仍然相当不错。当优化器由于高方差而困难时，我们可以通过引入少量偏差来改善这种情况，同时大大缓解高方差问题，这是第2章中涵盖的偏差-方差权衡话题。有许多示例，我们可以使用有偏但低方差的估计器获得良好的模型，例如在第7章中涵盖的在损失函数中添加LASSO惩罚项。请注意，使用有偏估计器可能无法在有限训练时间内收敛到稳定点。\n\
  \n既然我们知道SGD是一种收敛到局部极小值的计算经济型算法，接下来我们想问的是解的质量如何。它与全批量梯度下降算法的质量相同，还是更好？事实证明，SGD通常比GD提供更好的解，因为由此得到的模型对未来未见测试集的泛化性能更好。这种泛化性能来自SGD的隐式正则化效应，将在下一节中讨论。\n\
  \n### 8.1.3 SGD的隐式正则化\n\n为了观察小批量SGD和全批量GD之间学习行为的差异，让我们看一个涉及两种情况的简单示意图示例。如图8.3所示，我们将Q(**w**，D)（假设为MSE，并由虚线曲线表示）的平均损失曲线绘制为权重向量**w**的函数，为简化起见假设其为一维。我们将使用基于全批量训练集的梯度下降更新来减少MSE，最终收敛到最优**w***。我们还将使用SGD进行优化时不同小批量的损失曲线绘制出来，其中小批量损失曲线（实线曲线）在形状上与使用全批量GD的损失曲线（虚线曲线）相似。基于SGD的无偏性属性，全批量损失曲线是四个小批量损失曲线的平均值。\n\
  \nFigure 8.3 Visualizing the loss curves using full-batch GD and mini-batch SGD,\
  \ where the latter curves are similar in shape and close to the former.\n\n使用训练集的这些单个小批量，我们获得了基于全批量GD的平均损失曲线的良好估计。换句话说，这些小批量损失曲线中的每一条都能告诉我们最优权重**w**所在的位置，并且这些小批量损失曲线的局部极小值都在**w***的一个接近邻域内。在使用SGD的每一轮更新中，我们选择一个随机子集并（因此）根据相应的小批量损失曲线指导下一次权重更新。几乎所有这些小批量损失曲线都使用SGD将我们指向同一方向，并且在更新方向上方差很小；在这种情况下，SGD和GD的表现将相似。\n\
  \n让我们来看另一种场景，其中基于全批量GD的相同平均损失曲线是将若干差异很大的小批量SGD损失曲线平均得到的结果。如图8.4所示，所有小批量损失曲线都有一个陡峭的局部极小值，这不是一个理想的解，用于\n\
  \n\n\n推广到测试集（回顾我们在第 4 章中讨论过的偏好宽盆地而非陡峭山谷的问题）。所有局部极小值位置各不相同，并且这些极小值在其邻域内伴随着损失的突变（即大梯度）。\n\
  \n图 8.4 使用全批量 GD 和小批量 SGD 可视化损失曲线，后者曲线形状不一，且与前者相距较远。\n\n一组形状不一的陡峭小批量损失曲线会使 SGD 难以收敛。例如，基于某个小批量的损失曲线可能会将优化器引向与基于另一小批量的另一条损失曲线完全不同的方向。在存在高方差的尖锐损失曲线时，SGD\
  \ 难以收敛，因为大梯度很可能导致优化器发散并跳出包含 w* 的区域。\n\n因此，我们预期 SGD 会偏好第一种情景，即损失曲线组较为一致且方差较小，而非第二种情景，即损失曲线组不一且方差较高。在第一种情景下，SGD\
  \ 收敛相对容易实现。关键在于，如果 SGD 更新对当前使用的训练集中的哪个小批量非常敏感，那么它很可能对未来的测试集也非常敏感，从而难以很好地泛化。当训练集中的小批量之间存在较大差异时（如图\
  \ 8.4 所示），训练集与测试集之间的差异可能较高，从而导致泛化性能较差。因此，SGD 偏好第一种情景，并利用其随机性来诱导更好的泛化性能。\n\n### 8.1.4\
  \ 分析平均迭代\n\n一篇捕捉这一直觉的近期论文有助于揭示 SGD 在偏好小批量间方差较小的损失曲线区域方面的作用。正如 Samuel Smith 等人在题为《随机梯度下降中隐式正则化的起源》的论文中所介绍的，作者使用修改后的损失来近似使用\
  \ SGD 的梯度流路径的平均迭代。该调整后的损失包含一个关于全批量 GD 和小批量 SGD 之间损失方差的显式项，可以解释 SGD 对低方差区域的偏好。\n\n\
  让我们更详细地看一下这个视角。如图 8.5 所示（从原论文重新绘制），我们绘制了使用全批量 GD 和小批量 SGD 对二维损失函数进行权重更新的示例路径。左侧面板显示了使用全批量\
  \ GD 算法的确定性梯度下降并收敛到一个静态点。中间面板显示了每一步的随机梯度集合，其中每个圆代表由于 SGD 中使用的不同小批量而导致的当前步骤之前的所有可能权重值。当前迭代中使用的随机小批量将确定确切位置。由于\
  \ SGD 的随机性，随机噪声会累积，圆（可能位置的分布）会变得越来越大，因为未来步骤的可能结果空间更大。右侧面板代表使用 SGD 的这些圆的平均迭代。\n\n\
  图 8.5 比较不同梯度下降算法的权重更新路径。左图显示了使用全批量梯度下降算法的路径，中间图显示了使用 SGD 在每次更新中使用不同小批量的路径分布，右图显示了使用\
  \ SGD 的平均迭代。\n\n可能路径的分布使得分析 SGD 的行为变得困难，该论文的主要亮点之一是专注于每个时间步的平均迭代来表征其预期行为。绘制平均迭代（如图\
  \ 8.5 右侧面板所示）使路径变得非随机和确定性，从而忽略了每个时间步沿线的随机性，并使仅分析平均值变得更加容易。\n\n从数学上讲，回顾 SGD 更新算法采用以下形式：\n\
  \n```\nw_{t+1} = w_t - \\eta \\nabla_w Q(w_t, D_t)\n```\n\n通过将 w_t 视为随机变量，我们可以通过对训练集的所有可能随机小批量取期望来分析其均值/预期值，得到：\n\
  \n```\n\\mu_t = \\mathbb{E}_{D_t}[w_t]\n```\n\n这里，我们对子集 \\(D_t\\) 中的随机性进行积分消去，以呈现每个时间步的预期权重值。该操作因此给出了时间步\
  \ \\(t\\) 的平均迭代，并在不同时间步上累积平均迭代，从而得到图 8.5 中的右侧面板图。\n\n接下来，我们将平均迭代视为遵循连续梯度流 \\(\\\
  mathcal{Q}\\)，即 \\(\\mu_t = \\mathcal{Q}(t)\\)，其中时间步 \\(t\\) 现在是连续的，而不是以离散方式在参数空间中跳跃。连续近似函数以时间变量（也是连续的）作为输入，并输出特定时间步的对应平均迭代。因此，平均迭代的\
  \ SGD 更新算法变为：\n\n```\n\\(\\mathcal{Q}_1 = \\mathcal{Q} - \\eta \\nabla_{\\mathbf{w}}\
  \ \\hat{Q}_{SGD}(\\mathcal{Q}, D)\\)\n```\n\n其中，\\(\\hat{Q}_{SGD}(\\mathcal{Q},\
  \ D)\\) 是一个修改后的损失函数（不同于经验损失函数 \\(Q(\\mathbf{w}_t, D_t)\\)），\\(\\nabla_{\\mathbf{w}}\
  \ \\hat{Q}_{SGD} (\\mathcal{Q}, D)\\) 表示新损失函数相对于权重的梯度，以当前平均迭代 \\(\\mu_t\\) 和训练集\
  \ \\(D\\) 作为输入。平均迭代的近似更新现在基于以全批量方式使用的修改后的损失函数 \\(\\hat{Q}_{SGD}(\\mathcal{Q}, D)\\\
  )，关于小批量子集 \\(D_t\\) 的信息现在编码在 \\(\\mu_t\\) 中。\n\n如下所示，修改后的损失函数可以让我们更接近 SGD 的低方差特性。修改后的损失函数\
  \ \\(\\hat{Q}_{SGD}(\\mathbf{w}, D)\\) 现在由两部分组成：不带任何梯度噪声的全批量损失函数 \\(Q(\\mathbf{w},\
  \ D)\\)，以及小批量 SGD 和全批量 GD 之间梯度的方差 \\(\\mathbb{E} \\| \\nabla_{\\mathbf{w}} Q(\\\
  mathbf{w}, D_t) - \\nabla_{\\mathbf{w}} Q(\\mathbf{w}, D) \\|^2\\)，乘以常数 \\((\\eta/4)\\\
  )。第二项本质上是 \\(\\nabla_{\\mathbf{w}} Q(\\mathbf{w}, D_t)\\)（即 SGD 的梯度）与其平均值 \\(\\\
  nabla_{\\mathbf{w}} Q(\\mathbf{w}, D)\\) 之间差异的（L2）范数，基于无偏性质。这一项使 SGD 的隐式正则化效应显式化：运行小批量\
  \ SGD 算法等同于运行全批量 GD 并添加一个针对其梯度方差的额外正则化项。\n\n```\n\\(\\hat{Q}_{SGD}(\\mathbf{w},\
  \ D) = Q(\\mathbf{w}, D) + \\frac{\\eta}{4} \\mathbb{E} \\| \\nabla_{\\mathbf{w}}\
  \ Q(\\mathbf{w}, D_t) - \\nabla_{\\mathbf{w}} Q(\\mathbf{w}, D) \\|^2\\)\n```\n\n\
  该正则化项也依赖于数据。根据参数空间中的特定位置和所使用的数据集，SGD 算法在最小化修改后的损失函数时会避开梯度方差较高的区域。高方差区域对应于先前的图 8.4，SGD\
  \ 算法难以收敛到静态解。当方差较小时（如图 8.3 所示），SGD 将更容易收敛。图 8.6 总结了 SGD 中隐式正则化效应的直觉，即偏好参数空间中相对较宽的极小值（而非狭窄极小值）的区域，这些区域对梯度方差不敏感。因此，SGD\
  \ 倾向于得到更具泛化性的模型权重。\n\n图 8.6 通过修改后的损失函数说明 SGD 的隐式正则化效应。\n\n然而，基于平均迭代的此类分析也有其局限性。例如，当损失函数是双峰的时（如图\
  \ 8.7 所示），轨迹在后续更新中不一定会显示出更大的方差。相反，更新会逐渐收敛到这两个极小值中的一个。\n\n图 8.7 带有双峰损失函数的 SGD 更新轨迹。随着\
  \ SGD 算法收敛到其中一个局部极小值，方差会减小。\n\n因此，平均迭代分析是隐式正则化效应的良好指示性解释，但不适用于所有情况。\n\n\n\n\n由于SGD因随机噪声而收敛相对较慢，一个自然的问题是：我们是否可以做些什么来抑制这种随机性，并（预期地）加速其收敛？这个问题催生了一系列SGD变体，其中动量和Adam是社区中最受欢迎的优化器选择。\n\
  \n### 8.1.5 SGD变体：更好还是更差？\n\n我们在第6章中使用Adam优化器训练了一个多分类模型。我们在第2章中也提到过，它可以加速学习，但并不一定总能获得良好的泛化性能。在训练深度神经网络时，我们应该坚持使用Adam还是SGD？不一定。许多实践者在训练开始时使用Adam，因为它对学习率的选择不太敏感（稍后会详细介绍），然后过一段时间后切换到SGD，以获得良好的泛化性能。将短期近视奖励（如Adam的情况）与长期非近视收益（如SGD的情况）相结合，是许多策略设计中的流行选择，例如在强化学习和贝叶斯优化领域。\n\
  \n作为SGD的一种变体，Adam基于两个关键方面：使用动量的平滑更新和使用梯度范数的缩放学习率。让我们先阐述动量的概念。假设我们正在处理一个二维参数空间，其中要最小化的损失函数很窄，如图8.8所示的细长椭圆（级集）所示。想象优化器正在寻找狭窄山谷的底部（局部最小值）（损失函数）。由于垂直于通往局部最小值路径的方向上有陡峭的斜坡，当前位置的偏导数（由实心点指示）在幅度上差异很大。具体来说，左侧面板中的偏导数g2将远大于g1，在给定较高学习率的情况下，这会导致每次更新时出现震荡，并可能偏离局部最优解。\n\
  \n图8.8 左侧：由于偏导数不成比例和较高的学习率，SGD更新轨迹出现震荡；右侧：由于学习率较小，进展缓慢。\n\n另一方面，将学习率降低到很小的数值在一定程度上可以缓解震荡，但反而会导致收敛缓慢；SGD需要很长时间才能朝着局部最小值显示出不错的进展。在这两种情况下，实际的收敛性能对学习率超参数都非常敏感。\n\
  \n解决这一问题的早期方法之一称为动量，它在每次SGD更新中使用梯度的移动平均值，从而缓解了SGD梯度中的高方差问题。将原始梯度向量表示为gt = ∇wQ(w,\
  \ Dt)，其移动平均值表示为mt。当前移动平均值mt基于以下关系计算：\n\nmt = β1 · mt−1 + (1 − β1)gt\n\n其中β1是一个超参数，用于控制先前移动平均值与当前梯度之间的权重（逐元素）。带有梯度运行平均值的相应SGD更新规则因此变为：\n\
  \nwt+1 = wt − ηmt\n\n使用平均梯度进行迭代更新将平滑轨迹，因为相反方向的梯度会因平均效应而相互抵消。因此，动量平滑了通往局部最小值的垂直方向上的随机性。\n\
  \n作为进一步的改进，Adam优化器使用自适应步长来估计梯度的范数。如图8.8左侧面板所示，优化器倾向于在g2方向上移动更多，因为它远大于g1。因此，Adam的目标是重新缩放梯度的范数，使得梯度向量中的每个偏导数都具有相似的规模。具体来说，梯度范数向量vt的运行平均值定义如下：\n\
  \nvt = β2vt−1 + (1−β2)gt²\n\n其中gt²表示对梯度向量gt中的每个元素（偏导数）求平方，β2是另一个预设的超参数。一旦我们有了平均梯度及其移动平均范数，就可以使用以下更新规则来选择下一个权重值：\n\
  \nwt+1 = wt − η * mt / sqrt(vt + ε)\n\n这里我们对vt开平方根：将其转换为与权重相同的单位，并使用一个小常数ε以避免除以零。自适应步长由η/(√(vt)\
  \ + ε)表示，其中新的学习率对每个参数都不同，而不是对所有参数使用统一的学习率；毕竟，有些参数往往对高学习率更敏感。图8.9总结了相对于SGD的这两项自适应变化。\n\
  \n### 动量\n\n$$\\mathbf{m}_t = \\beta_1 \\mathbf{m}_{t-1} + (1 - \\beta_1)\\mathbf{g}_t$$\n\
  \n$$\\mathbf{w}_{t+1} = \\mathbf{w}_t - \\eta \\mathbf{m}_t$$\n\n通过移动平均值使用梯度向量中平滑的偏导数向量\n\
  \n### Adam\n\n$$\\mathbf{v}_t = \\beta_2 \\mathbf{v}_{t-1} + (1 - \\beta_2)\\mathbf{g}_t^2$$\n\
  \n$$\\mathbf{w}_{t+1} = \\mathbf{w}_t - \\eta \\frac{\\mathbf{m}_t}{\\sqrt{\\mathbf{v}_t\
  \ + \\epsilon}}$$\n\n在迭代更新策略中平滑梯度的一阶（均值）和二阶（方差）矩\n\n图8.9 说明动量和Adam中的自适应变化。\n\n总的来说，Adam估计梯度向量的一阶和二阶矩（均值和方差）来更新权重。由于梯度向量的范数被估计和平滑，更新将对学习率的值不那么敏感。正因为如此，Adam是一种广泛使用的优化器，并且收敛相对较快。然而，如Wilson等人在其2017年NeurIPS论文《机器学习中自适应梯度方法的边际价值》中后来指出的那样，像Adam这样自适应地改变梯度，尽管其优化性质更快，但通常会损害与SGD等随机方法相比的泛化性能。事实证明，这种随机性是一种福音而非诅咒；它使SGD能够处理棘手的情况，例如偏好低方差平坦极小区域而非高方差尖锐极小区域。\n\
  \n作为一种加速的基于梯度的方法，Adam在训练深度神经网络时充当开箱即用的优化器。许多实践者使用Adam训练神经网络，因为该优化器对我们如何设置超参数（包括学习率和网络的初始权重）不敏感。然而，使用SGD需要对这些超参数进行一定程度的微调。Adam收敛速度远快于SGD，因此从优化角度来看是更好的优化器。然而，它存在泛化性能差的问题，这是训练模型时更关键的追求。如第5章所讨论的，良好的离线泛化性能与在无限新数据流下的快速在线优化性能（即快速收敛）相关。由于实际场景中训练数据集几乎总是有限的，我们可能不希望将快速收敛作为唯一目标。\n\
  \n总结来说，SGD中的梯度噪声是随机优化过程中的一个基本特征，而非劣势。通过避开高梯度噪声区域，SGD相比动量和Adam等加速方法能够提供更好的泛化性能。因此，保持随机性作为获得良好泛化性能的神奇要素之一至关重要。\n\
  \n在下一节中，我们将基于一元单样本线性回归模型，对SGD的收敛特性进行更详细的分析。\n\n## 8.2 更多关于SGD收敛的内容\n\nSGD的理论分析要求每个小批量都有放回地抽样；也就是说，一个样本*可以*在下一个小批量中重复。让我们用*t*表示第*t*次迭代，并用*i(t)*表示第*k*次迭代用于SGD更新的随机样本的索引，每个小批量使用单个样本。在每次迭代中，*i(t)*\
  \ = {1, 2, ..., *N*}可以是训练集中的任何样本。因此，我们在迭代*t*中使用单个观测值的SGD更新规则变为：\n\n**w**<sub>*t*+1</sub>=**w**<sub>*t*</sub>\
  \ - \\(\\eta_t\\) \\(\\nabla_w Q(\\mathbf{w}_t, D_{i(t)})\\)\n\n其中*D*<sub>(*t*)</sub>表示当前采样的单个观测值，*η<sub>t</sub>_是作为时间步函数的学习率。处理单个观测值使更新速度快*N_倍，其中*N_在现代应用中轻松可达数百万。这一理念——在每一轮梯度更新中使用单个随机观测值而非整个训练集——最初由Robbins和Monro在其1951年论文《随机逼近方法》中提出，并且至今仍是现代神经网络中的主流优化方法。\n\
  \n在单样本SGD更新中观察到的一个有趣现象是，在初始阶段下降通常很快且稳定，如相对平滑的轨迹所示，随后在特定区域内出现随机震荡。此类波动是由随机小批量（单个样本）中的随机性以及对学习率的高度敏感性共同造成的。\n\
  \n图8.10说明了这种行为。在左侧面板中，我们绘制了使用单观测SGD的典型轨迹。请注意，前四个迭代（由数字1-4指示）在右侧区域向局部最优解取得了相对较快的进展，这限制了后续的波动更新。Suvrit\
  \ Sra（他在其关于SGD的YouTube教程中讨论了这种现象）将第一个区域称为“远外区域”，将第二个区域称为“混乱区域”，表明优化器现在正遭受随机波动的困扰。这里我们使用相同的名称。\n\
  \n\n\n\n### 使用单样本SGD的典型轨迹\n\n![](img/ee98e91e6845f41077b163bec833ee40_278_0.png)\n\
  \n图 8.10 说明了单样本SGD的典型轨迹（左侧）及其对应的损失曲线（右侧）。两者都包含两个区域：远离区域，当前迭代点远离损失最优解；以及混淆区域，当前迭代点位于最优解附近。\n\
  \n右侧面板进一步体现了这种行为：在远离区域初期损失迅速下降，进入混淆区域后则出现随机震荡。\n\n需要注意的是，即使每一步都使用极小学习率进行SGD更新，仍可能产生稳定轨迹，如图\
  \ 8.11 所示。对学习率的敏感性仅在学习率较大时才会体现。\n\n### 每次SGD更新使用极小学习率的稳定轨迹\n\n![](img/ee98e91e6845f41077b163bec833ee40_279_0.png)\n\
  \n图 8.11 每次更新使用充分小学习率的稳定轨迹。\n\n### 8.2.1 一元线性回归中的SGD\n\n我们可以从一个简单的框架中进一步了解SGD的收敛特性：即采用单样本SGD更新规则的一元模型。因此，我们需要最小化的目标函数变为：\n\
  \n$$Q(\\mathbf{w}) = \\frac{1}{2} \\sum_{i=1}^n (y_i - f(\\mathbf{x}_i; \\mathbf{w}))^2\
  \ = \\frac{1}{2} \\sum_{i=1}^n (y_i - x_i w)^2$$\n\n此处乘以 1/2 是为了便于后续的数学分析。由于这一单维优化问题的目标函数是凸函数，我们可以对其求导并将梯度设为零，从而得到局部最小值处的解，这对于当前的随机样本\
  \ $(x_i, y_i)$ 来说也是全局最小值。现在所有变量均为一维，因此易于分析，于是将 $Q(\\mathbf{w})$ 写作 $Q(w)$。\n\n由于代价函数\
  \ $Q(w)$ 关于 $w$ 是二次函数，我们可以令其梯度为零，从而得到最优解 $w^*$ 的解析表达式，如下所示。\n\n$$\\nabla_w Q(w)\
  \ = \\sum_{i=1}^n (y_i - x_i w)x_i = 0$$\n\n$$w^* = \\frac{\\sum_{i=1}^n x_i y_i}{\\\
  sum_{i=1}^n x_i^2}$$\n\n在SGD的语境下，梯度将基于第 $i$ 个单一样本的代价计算，即，\n\n$$Q_i(w) = \\frac{1}{2}(y_i\
  \ - x_i w)^2$$\n\n同样，令梯度为零可得到第 $i$ 个单一样本的最优解 $w^*$：\n\n$$\\nabla_w Q_i(w) = (y_i\
  \ - x_i w)x_i = 0$$\n\n$$w_i^* = \\frac{x_i y_i}{x_i^2} = \\frac{y_i}{x_i}$$\n\n\
  基于 $N$ 个随机选取的单一样本，我们共有 $N$ 个最优解 $\\{w^*\\}_{i=1}^N$。在这组最优解中，我们可以得到其最高和最低候选值，即 $\\\
  max_i\\{w_i^*\\}$ 和 $\\min_i\\{w_i^*\\}$。一个有趣的问题随之出现：全批量解 $w^*$ 与 $\\min_i\\{w_i^*\\\
  }$ 和 $\\max_i\\{w_i^*\\}$ 相比如何？\n\n为便于分析，我们假设所有输入观测值均为正，即对所有 $i \\in \\{1,...,N\\\
  }$ 均有 $x_i > 0$。这并非一个过于强的假设，因为我们可以将所有观测值同时平移一个常数，直至它们变为正数。我们进一步记 $U = \\max_i\\\
  {w_i^*\\}$ 和 $L = \\min_i\\{w_i^*\\}$。我们可以根据以下观察进行推导：\n\n$$\\frac{y_i}{x_i} \\le\
  \ U = \\frac{y_U}{x_U}$$\n\n此处我们用 $(x_U, y_U)$ 表示给出最大解 $\\max_i\\{w_i^*\\}$ 的样本。重整各项并两边同时乘以\
  \ $x_i$，我们得到：\n\n$$x_U y_i \\le x_i y_U$$\n$$x_U x_i y_i \\le x_i^2 y_U$$\n\n现在，对所有\
  \ $i \\in \\{1,...,N\\}$ 求和并互换各项，得到：\n\n$$\\sum_{i=1}^N x_U x_i y_i \\le \\sum_{i=1}^N\
  \ x_i^2 y_U$$\n$$x_U \\sum_{i=1}^N x_i y_i \\le y_U \\sum_{i=1}^N x_i^2$$\n$$w^*\
  \ = \\frac{\\sum_{i=1}^N x_i y_i}{\\sum_{i=1}^N x_i^2} \\le \\frac{y_U}{x_U} = U$$\n\
  \n这意味着，使用全批量得到的最优解被单样本解的最大值所上界限。\n\n我们可以用类似的方法进一步证明下界，如下所示：\n\n$$\\frac{y_i}{x_i}\
  \ \\ge L = \\frac{y_L}{x_L}$$\n\n$$x_L y_i \\ge x_i y_L$$\n$$x_L x_i y_i \\ge x_i^2\
  \ y_L$$\n$$\\sum_{i=1}^N x_L x_i y_i \\ge \\sum_{i=1}^N x_i^2 y_L$$\n$$x_L \\sum_{i=1}^N\
  \ x_i y_i \\ge y_L \\sum_{i=1}^N x_i^2$$\n$$w^* = \\frac{\\sum_{i=1}^N x_i y_i}{\\\
  sum_{i=1}^N x_i^2} \\ge \\frac{y_L}{x_L} = L$$\n\n因此，我们有 $w^* \\in [L, U]$。这就是真实最小值所在的区域。图\
  \ 8.12 总结了推导过程。\n\n### 一元线性回归中真实最优解的界定\n\n### 全批量梯度下降\n\n### 小批量（单样本）SGD\n\n$$Q(w)\
  \ = \\frac{1}{2} \\sum_{i=1}^n (y_i - x_i w)^2$$\n$$w^* = \\frac{\\sum_{i=1}^n x_i\
  \ y_i}{\\sum_{i=1}^n x_i^2}$$\n\n$$Q_i(w) = \\frac{1}{2} (y_i - x_i w)^2$$\n$$w_i^*\
  \ = \\frac{y_i}{x_i}$$\n\n$$\\frac{y_i}{x_i} \\le U = \\frac{y_U}{x_U}$$\n$$x_U\
  \ \\sum_{i=1}^N x_i y_i \\le y_U \\sum_{i=1}^N x_i^2$$\n\n$$\\frac{y_i}{x_i} \\\
  ge L = \\frac{y_L}{x_L}$$\n$$x_L \\sum_{i=1}^N x_i y_i \\ge y_L \\sum_{i=1}^N x_i^2$$\n\
  \n$$w^* \\in [L, U]$$\n\n图 8.12 利用不等式推导了一元线性回归模型真实最优解的上界和下界。全批量GD解被小批量SGD解所上界和下界限。\n\
  \n让我们重新审视GD及其SGD对应项的梯度，如下所示。\n\n$$\\nabla_w Q(w) = \\sum_{i=1}^n (y_i - x_i w)x_i$$\n\
  $$\\nabla_w Q_i(w) = (y_i - x_i w)x_i$$\n\n根据前面的讨论，我们知道小批量SGD优化器将向全批量GD优化器给出的解移动，因为它是该特定点上损失函数真实梯度的无偏估计量。这种移动在两个区域中表现出两种截然不同的行为，即远离区域和混淆区域。\n\
  \n当SGD优化器位于远离区域内，即 $w < L$ 或 $w > U$ 时，单样本梯度 $\\nabla_w Q_i(w)$ 和全批量梯度 $\\nabla_w\
  \ Q(w)$ 将取相同的符号。换句话说，SGD将与GD采取相同的移动方向，且每次GD更新对应SGD中的 $N$ 次更新。SGD将朝向混淆区域移动。这解释了初始训练阶段良好且快速的进展，如图\
  \ 8.10 所示。\n\n然而，当SGD优化器进入混淆区域时，统一的符号不再保证。取决于梯度计算中使用的具体观测值，SGD优化器将因移动方向的随机性而在混淆区域内来回弹跳。这解释了训练后期的震荡，如前面在图\
  \ 8.10 中所示。\n\n让我们做一些可视化以便更好地理解。回顾图 8.3 和图 8.4 中的多个小批量损失曲线。我们可以为SGD中使用的每个样本绘制一条损失曲线，由于关于\
  \ $w$ 是二次函数，每条损失曲线都将是U形的。如图 8.13 所示，我们绘制了混淆区域的上界 $U$ 和下界 $L$，由两条虚线指示。SGD优化器将在两个周围的远离区域取得良好进展并向混淆区域移动。然而，一旦进入混淆区域，优化器便开始波动并永远地来回跳跃。这解释了为什么早期停止是训练神经网络中一种实用的技术。\n\
  \n图 8.13 说明了使用SGD的一元线性回归模型中的远离区域和混淆区域。\n\n需要注意的是，落入混淆区域未必是坏事。在使用真实数据训练大型神经网络时，损失曲线通常是高维且强非凸的。震荡会将SGD从尖锐最小值推开，并向梯度范数较小的区域移动，这是前一节介绍的隐式正则化的一种特性。然而，从优化角度来看，由于这些震荡，SGD并不是一个好的优化器。\n\
  \n### 8.2.2 SGD的期望收敛性\n\nSGD优化器是一个极佳工具，它允许我们使用随机小批量对大型数据集进行优化，同时在平均上仍能得到相同的真实梯度（即无偏性特性）。然而，仅拥有一个无偏估计量是不够的，因为一个估计量可能会遭受高方差问题，但仍表现出无偏性。因此，我们希望拥有一个无偏估计量，它能在平均上以高概率获得低方差。当估计量的方差趋向于零时，我们说该估计量已经收敛。\n\
  \nSuvrit Sra 给出了关于任意目标函数SGD期望收敛性的一般证明，其中预期梯度范数随着...趋向于零\n\n\n\n随着 SGD 迭代次数的增长。该证明基于少量假设，偏好较少理论属性的读者可以安全地跳过本节。\n\
  \n第一个假设涉及梯度 \\(\\nabla f(x)\\) 的 Lipschitz 光滑性，其中 \\(f\\) 是一般函数，可解释为代价函数 \\(Q\\\
  )。换句话说，函数 \\(f\\) 具有 Lipschitz 连续梯度，其定义形式如下：\n\n$$\n\\|\\nabla f(x) - \\nabla f(y)\\\
  | \\leq L \\|x-y\\|\n$$\n\n我们可以令 \\(x = \\mathbf{w}_t\\) 且 \\(y = \\mathbf{w}_{t+1}\\\
  )，以表征两个连续 SGD 迭代之间梯度的距离，并用 \\(Q(x)\\) 代替 \\(f(x)，从而得到如下结果：\n\n$$\n\\|\\nabla Q(\\\
  mathbf{w}_t) - \\nabla Q(\\mathbf{w}_{t+1})\\| \\leq L \\|\\mathbf{w}_t - \\mathbf{w}_{t+1}\\\
  |\n$$\n\n由于代价函数 \\(Q(\\mathbf{w})\\) 在使用 MSE（均方误差）进行回归或使用 CEL（交叉熵损失）进行分类时均为凸函数，我们还可以得到以下二次上界：\n\
  \n$$\nQ(\\mathbf{w}_{t+1}) \\leq Q(\\mathbf{w}_t) + \\nabla Q(\\mathbf{w}_t)^T(\\\
  mathbf{w}_{t+1} - \\mathbf{w}_t) + \\frac{L}{2}\\|\\mathbf{w}_{t+1} - \\mathbf{w}_t\\\
  |^2\n$$\n\n由于 \\(\\mathbf{w}_{t+1} = \\mathbf{w}_t - \\eta_t \\nabla Q(w_t, D_{(t)})\
  \ = \\mathbf{w}_t - \\eta_t \\nabla Q_t(\\mathbf{w}_t)\\)，将上述不等式代入可得：\n\n$$\nQ(\\\
  mathbf{w}_{t+1}) \\leq Q(\\mathbf{w}_t) - \\eta_t \\nabla Q(\\mathbf{w}_t)^T \\\
  nabla Q_t(\\mathbf{w}_t) + \\frac{L}{2} \\eta_t^2 \\|\\nabla Q_t(\\mathbf{w}_t)\\\
  |^2\n$$\n\n由于我们关注 SGD 迭代的平均行为，可以对两边取期望，如下所示：\n\n$$\n\\mathbb{E}[Q(\\mathbf{w}_{t+1})]\
  \ \\leq \\mathbb{E}[Q(\\mathbf{w}_t)] - \\mathbb{E}[\\eta_t \\nabla Q(\\mathbf{w}_t)^T\
  \ \\nabla Q_t(\\mathbf{w}_t)] + \\mathbb{E}[\\frac{L}{2} \\eta_t^2 \\|\\nabla Q_t(\\\
  mathbf{w}_t)\\|^2]\n$$\n\n由于期望是针对每次 SGD 迭代中单个样本（有放回）抽样的随机性而取的，我们可以根据线性性质将常数移出期望算子，并对每一项应用期望算子：\n\
  \n$$\n\\mathbb{E}[Q(\\mathbf{w}_{t+1})] \\leq \\mathbb{E}[Q(\\mathbf{w}_t)] - \\\
  eta_t \\mathbb{E}[\\nabla Q(\\mathbf{w}_t)^T] \\mathbb{E}[\\nabla Q_t(\\mathbf{w}_t)]\
  \ + \\frac{L}{2} \\eta_t^2 \\mathbb{E}[\\|\\nabla Q_t(\\mathbf{w}_t)\\|^2]\n$$\n\
  \n现在我们引入两个额外假设以继续推导。第一个是与 GD 更新相比 SGD 的无偏性，即 \\(\\mathbb{E}[\\nabla Q_t(\\mathbf{w}_t)]\
  \ = \\nabla Q(\\mathbf{w}_t)\\)。这并非严格假设，因为根据大数定律，随着迭代次数的增长，SGD 迭代将始终趋近于 GD。第二个假设要求我们将\
  \ SGD 梯度的范数由常数 \\(G\\) 界限，即 \\(\\|\\nabla Q(\\mathbf{w}_t)\\| \\leq G\\)。对梯度进行界限可以确保函数\
  \ \\(Q(\\mathbf{w})\\) 的形状不会过于起伏。应用这两个性质可得：\n\n$$\n\\mathbb{E}[Q(\\mathbf{w}_{t+1})]\
  \ \\leq \\mathbb{E}[Q(\\mathbf{w}_t)] - \\eta_t \\mathbb{E}[\\|\\nabla Q(\\mathbf{w}_t)\\\
  |^2] + \\frac{L}{2} \\eta_t^2 G^2\n$$\n\n移项并两边同时除以 \\(\\eta_t\\) 得：\n\n$$\\mathbb{E}[\\\
  |\\nabla Q(\\mathbf{w}_t)\\|^2] \\le \\frac{1}{\\eta_t}\\mathbb{E}[Q(\\mathbf{w}_t)\
  \ - Q(\\mathbf{w}_{t+1})] + \\frac{L}{2}\\eta_t G^2$$\n\n现在我们选取 \\(\\eta_t=c/\\\
  sqrt{T}\\)，使得学习率随总迭代次数 \\(T\\) 的增加而降低，其中 \\(c\\) 为常数。这可得：\n\n$$\\mathbb{E}[\\|\\\
  nabla Q(\\mathbf{w}_t)\\|^2] \\le \\frac{\\sqrt{T}}{c}\\mathbb{E}[Q(\\mathbf{w}_t)\
  \ - Q(\\mathbf{w}_{t+1})] + \\frac{L}{2}\\frac{c}{\\sqrt{T}}G^2$$\n\n需要注意的是，左侧项表示梯度范数的方差。\n\
  \n我们可以将 $t=1$ 到 $t=T$ 的前述不等式两边相加，得到：\n\n$$\\sum_{t=1}^T \\mathbb{E}[\\|\\nabla Q(\\\
  mathbf{w}_t)\\|^2] \\le \\frac{\\sqrt{T}}{c}\\mathbb{E}[Q(\\mathbf{w}_1) - Q(\\\
  mathbf{w}_{T+1})] + \\frac{Lc\\sqrt{T}}{2}G^2\\\\\n \\le \\frac{\\sqrt{T}}{c}(Q(\\\
  mathbf{w}_1) - Q^*(\\mathbf{w})) + \\frac{Lc\\sqrt{T}}{2}G^2$$\n\n第二个不等式成立是因为 \\\
  (Q^*(\\mathbf{w})\\) 表示（常数）全局最小值，因此去除了期望算子。\n\n最后，两边同时除以 \\(T\\) 以得到梯度范数方差的平均行为：\n\
  \n$$\\frac{1}{T} \\sum_{t=1}^T \\mathbb{E}[\\|\\nabla Q(\\mathbf{w}_t)\\|^2] \\\
  le \\frac{1}{c\\sqrt{T}}(Q(\\mathbf{w}_1) - Q^*(\\mathbf{w})) + \\frac{Lc}{2\\sqrt{T}}G^2\
  \ = \\frac{1}{\\sqrt{T}}\\left(\\frac{Q(\\mathbf{w}_1) - Q^*(\\mathbf{w})}{c} +\
  \ \\frac{Lc}{2}G^2\\right)\\\\\n = \\frac{C}{\\sqrt{T}}$$\n\n此处使用 \\(C\\) 将右侧的常数合并在一起。\n\
  \n实质上，我们已经证明，随着 SGD 迭代次数的增加，梯度范数的方差平均呈下降趋势。这意味着，随着迭代的进行，SGD 轨迹将变得更加稳定、波动更小，一直持续到达到我们称为收敛的稳态，其收敛速率为次线性速率\
  \ $1/\\sqrt{T}$。图 8.14 总结了推导过程。\n\n图 8.14 SGD 期望收敛性证明图解。\n\n### 8.2.3 SGD：过去、现在与未来\n\
  \nSGD 已被提出超过 70 年。尽管其规则极为简单，但它仍然是训练大型神经网络中最广泛使用的优化算法。其中最大的原因之一是，其在测试集上的泛化性能优于其他替代方案，而从理论角度理解这种泛化性能是一个活跃的研究领域。如前所述，噪声（或随机性）对优化界通常是不利的，但对机器学习界的泛化而言却是好事。\n\
  \n我们还讨论了 SGD 理论分析与其实际用法在小批量随机采样方式上的差距。理论分析基于每个数据点都有放回地随机采样以确保 i.i.d 条件（独立同分布）的假设。然而，大多数深度学习工具包会预先对整个训练数据集进行随机打乱并划分为不同的小批量，这些小批量内的样本在后续梯度计算中保持固定。\n\
  \nSGD 也有许多改进版本。除了动量（momentum）和 Adam 等流行的“改进型”优化器外，梯度裁剪和权重平均等技术在大多数情况下都是改善测试集性能的好方法。同样，理解其理论驱动因素仍然是一个开放的研究问题。如果你能读到本书的这一章节，很可能你之前已经使用过\
  \ SGD，并且和作者一样对它的奥秘和潜力感到兴奋。\n\n## 8.3 小结\n\n- SGD 提供隐式正则化效应，有助于提升神经网络在测试集上的泛化性能。\n\
  - GD 与 SGD 在训练深度神经网络时均最小化经验风险，区别在于 SGD 基于小批量（单个样本）在梯度中引入随机性。\n- SGD 为 GD 提供无偏估计量，并对凸和非凸函数逼近器都具有次线性速率的收敛性（在梯度范数的某些假设下）。\n\
  - 隐式正则化特性使 SGD 优化器偏好梯度范数方差较低的区域；当将 SGD 平均迭代视为梯度流时，该方差将成为显式罚项。\n- 动量和 Adam 等 SGD\
  \ 变体有助于加速优化，但与原生 SGD 相比会损害泛化性能；在深度神经网络的非凸优化中，更快的收敛并非首选。\n- SGD 在远离区域快速降低损失，但一旦进入一元线性回归设置中的混乱区域，就会开始波动和震荡，这一过程有可证明的理论分析支持。\n\
  - SGD 的期望收敛性表明，随着迭代次数的增加，梯度范数的期望方差会变小。\n- 对 SGD 泛化性能的理论理解仍然是一个开放问题和活跃的研究领域。\n\n"

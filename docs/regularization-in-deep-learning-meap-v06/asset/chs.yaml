  \ %\")\n        for k in range(len(class_list[i])):\n            acc = 100.0 * n_class_correct[i][k]\
  \ / n_class_samples[i][k]\n            print(f'Accuracy of {class_list[i][k]}: {round(acc,1)}\
  \ %')\n    print(\"---\")\n```\n\n#A 在嵌套列表中获取目标输出\n#B 获取批次中所有样本的最大 logit 对应的预测类别\n\

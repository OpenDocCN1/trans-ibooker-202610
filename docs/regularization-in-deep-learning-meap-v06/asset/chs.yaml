  \ X_i 的所有特征统称为一次观测，所有观测共同构成设计矩阵。模型有时也称为（映射）函数、假设或分类器（更常用于分类任务）。\n\n值得注意的是，在机器学习社区中，向量默认表示为列向量。对于包含总共\

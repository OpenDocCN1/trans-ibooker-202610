  \ lr=lr_rate)\n    n_total_steps = len(train_loader)\n    loss_func = nn.CrossEntropyLoss()\n\
  \    for epoch in range(num_epochs): #B\n        for i, pictures in enumerate(train_loader):\n\
  \            images = pictures['image'].to(device) #C\n            outputs = model(images)\
  \ #D\n            loss = criterion(loss_func, outputs, pictures) #E\n          \
  \  losses.append(loss.item())\n            optimizer.zero_grad() #F\n          \
  \  loss.backward() #G\n            optimizer.step() #H\n\n        if (i+1) % (n_total_steps)\
  \ == 0:\n            checkpoint_loss = torch.tensor(losses).mean().item()\n    \
  \        checkpoint_losses.append(checkpoint_loss)\n            print(f'Epoch [{epoch+1}/{num_epochs}],\
  \ Step [{i+1}/{n_total_steps}], Loss: {checkpoint_loss:.4f}')\n    return checkpoint_losses\n\
  \ncheckpoint_losses = training(model, device, 0.0001, 10, train_loader)\n```\n\n\
  - #A 汇总所有单独损失\n- #B 在嵌套循环中启动模型训练\n- #C 获取输入图像\n- #D 获得模型预测\n- #E 计算当前损失\n- #F 清除历史梯度\n\
  - #G 应用自动微分\n- #H 执行梯度下降更新\n\n现在让我们使用之前分配的测试集来测试模型性能。在以下代码清单中，我们定义一个 `validation()`\
  \ 函数来计算三个学习任务中的整体准确率和类别准确率。然后通过 `class_acc()` 函数打印这些结果。\n\n\n\n\n### 清单 6.11 检查测试集性能\n\
  \n```\ndef validation(model, dataloader, *args):\n    all_predictions = torch.tensor([]).to(device)\n\
  \    all_true_labels = torch.tensor([]).to(device)\n\n    with torch.no_grad():\n\

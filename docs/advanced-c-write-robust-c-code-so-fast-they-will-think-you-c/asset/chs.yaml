  ## 单元测试和模拟测试\n\n当开发人员开始编写代码时，他们需要确保代码在单元级别得到正确测试。可能会发生边界条件被遗漏的情况，并且代码在客户端站点运行时可能会中断。为了避免这种情况，通常最好对代码进行单元测试。单元测试是在代码的单元级别或基础级别执行的测试，在那里开发人员可以在隔离的环境中测试他们的代码，假设已满足运行代码功能的必要设置。通常，将模块分解为小的函数并分别测试每个函数是良好的实践。\n\
  \n例如，假设部分功能是读取配置文件并使用来自配置文件的参数设置环境。我们可以创建一个专用函数来编写此功能。因此，为了测试此函数，我们可以创建一个单元测试用例集，它将检查可能失败或行为不正确的各种组合。一旦确定了这些测试用例，开发人员就可以编写代码来覆盖该功能并确保它通过所有单元测试用例。这是在开发过程中良好的实践，你首先不断添加测试用例，然后相应地添加代码，然后运行该函数的全部测试用例并确保它们表现得当。\n\
  \n有许多工具可用于为项目编写和集成单元测试用例。其中一些是 **cppunit、Google Test、Microsoft Unit Testing Framework**\
  \ 和 **catch**。为我们的示例目的，我们将使用 **Google Test 框架**。它是免费提供的，可以与项目集成。它使用 **xUnit 测试框架**\
  \ 并有一组断言，可用于测试测试用例的条件。在下一节中，我们将解决一个练习，在其中我们将创建我们的第一个单元测试用例。\n\n### 练习 4：创建我们的第一个单元测试用例\n\
  \n在本练习中，我们将使用上一节讨论的相同场景，其中开发人员被要求编写一个函数来解析 **配置文件**。在配置文件中传递不同的有效参数，例如 **产品可执行名称、版本号、数据库连接信息、连接到服务器的\
  \ IP 地址** 等。假设开发人员将解析文件并设置和测试各个属性的参数的所有此功能分解到单独的函数中。在我们的例子中，我们假设开发人员正在编写功能，他们已将\
  \ **IP 地址** 解析为 **字符串**，并希望推断 **字符串** 是否为有效的 **IP 地址**。目前，使 IP 地址有效需要满足以下条件：\n\n\
  -   - **字符串** 不应为空。\n-   - **字符串** 不应包含超过 16 个字符\n-   - **字符串** 应采用 `XXX.XXX.XXX.XXX`\
  \ 格式，其中 X 必须是 0–9 的数字。\n\n执行以下步骤来实现此练习：\n\n-   1. 创建 **CheckIp.h** 头文件并在其中写入以下代码：\n\
  \n```\n```cpp\n#ifndef _CHECK_IP_H_\n#define _CHECK_IP_H_\n#include <iostream>\n\
  #include <cstring>\nusing namespace std;\nbool checkValidIp(const char *);\n#endif\n\
  ```\n```\n\n在前面的代码中，我们编写了一个名为 **checkValidIp()** 的函数来检查 **IP 地址** 是否有效。同样，只是为了理解\
  \ **Google 单元测试**，我们将编写最少的代码来理解该功能。\n\n2. 创建一个 **CheckIp.cpp** 文件并写入以下代码，其中我们将检查\
  \ ip 是否为 **非 NULL** 且长度小于 16：\n\n```\n```cpp\n#include \"CheckIp.h\"\n#include<string>\n\
  #include<sstream>\nbool checkValidIp(const char * ip){\n    if(ip == NULL){\n  \
  \      cout << \"Error : IP passes is NULL \" << endl;\n        return false;\n\
  \    }\n    if(strlen(ip) > 15){\n        cout << \"Error: IP size is greater than\
  \ 15\" << endl;\n        return false;\n    }\n    cout << \"strlen: \" << strlen(ip)\
  \ << endl;\n    return true;\n}\n```\n```\n\n在前面的代码中，如果两个条件都失败，函数返回 **false**。\n\
  \n3. 调用 **checkValidIp()** 函数创建一个名为 **MainIp.cpp** 的新文件。该文件通常将包含项目的 main 流程，但对于我们的练习目的，我们只是调用我们的\
  \ **checkValidIP()** 函数。在其中添加以下代码：\n\n```\n```cpp\n#include\"CheckIp.h\"\n\nint\
  \ main(){\n    const char * ip;\n    //ip = \"111.111.111.111\";\n    ip = \"111.111.111.11111\"\
  ;\n\n    if (checkValidIp(ip))\n        cout << \"IP address is correctly validated\"\
  \ << endl;\n    else {\n        /// work on error condition\n        // if needed\
  \ exit program gracefully.\n        cout << \" Got error in valid ip \" << endl;\n\
  \        return -1;\n    }\n    return 0;\n}\n```\n```\n\n4. 为了创建测试代码，我们将创建我们的第一个\
  \ .cpp 文件，即 TestCases.cpp。它将包含我们 checkValidIp 函数的测试用例。在其中写入以下代码：\n\n```\n#include\"\
  CheckIp.h\"\n#include<gtest/gtest.h>\nusing namespace std;\nconst char * testIp;\n\
  TEST(CheckIp, testNull){\n    testIp=NULL;\n    ASSERT_FALSE(checkValidIp(testIp));\n\
  }\nTEST(CheckIp, BadLength){\n    testIp = \"232.13.1231.1321.123\";\n    ASSERT_FALSE(checkValidIp(testIp));\n\
  }\n```\n\n在前面的代码第二行中，我们包含了 gtest.h 文件。我们还使用 TEST 函数调用测试用例，它接受两个参数：第一个是测试套件名称，第二个是测试用例名称。对于我们的情况，我们创建了\
  \ TestSuite CheckIp。在 TEST 块中，你会看到我们有 Google 测试定义了一个断言称为 ASSERT_FALSE，它将检查条件是否为\
  \ false。如果不是，它将使测试用例失败并在结果中显示相同。\n\n## 注意\n\n通常，对于 Google 测试用例和测试套件，你可以将它们分组到一个公共命名空间中并调用\
  \ RUN_ALL_TESTS 宏，该宏运行附加到测试二进制文件的所有测试用例。对于每个测试用例，它调用 SetUp 函数进行初始化（如类中的构造函数），然后它调用实际的测试用例，最后它调用\
  \ TearDown 函数（如类中的析构函数）。除非你需要为测试用例初始化某些内容，否则不必编写 SetUp 和 TearDown 函数。\n\n5. 现在，为了运行测试用例，我们将为测试用例创建\
  \ main .cpp 文件并调用 RUN_ALL_TESTS 宏。或者，我们可以通过链接 Google Test 库创建可执行文件来调用 RUN_ALL_TESTS。对于我们的情况，我们将采用后者。打开终端并运行以下命令来创建测试运行二进制文件：\n\
  \n```\ng++ -c CheckIp.cpp\n```\n\n这将包含 CheckIp.cpp 的对象文件，因为 CheckValidIp 函数在其中定义。\n\
  \n\n\n\n\n- 6. 现在，输入以下命令，以添加创建二进制文件所需链接的库：\n\n```\ng++ CheckIp.o TestCases.cpp -lgtest\
  \ -lgtest_main -pthread -o TestRun\n```\n\n- 7. 现在，使用以下命令运行二进制文件：\n\n```\n./TestRun\n\
  ```\n\n这将显示 CheckIp 测试套件中两个已通过的测试用例。第一个测试用例 CheckIp.testNull 被调用并成功通过。第二个测试用例 CheckIp.BadLength\
  \ 被调用并成功通过。下面的截图中可以看到这一结果：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_517_0.png)\n\
  \n*图 7.11：编译并执行测试用例*\n\n> **注意**\n>\n> 在 Google Test 中，我们也可以使用其他断言，但对于我们的测试用例来说，使用\
  \ ASSERT_FALSE 就足够了，因为我们只需要检查传入的 IP 地址对应的条件是否为 false。\n\n- 8. 现在，我们将添加更多测试用例，以使代码更加健壮。通常，这是编写代码的良好实践。首先，创建测试用例，并确保代码对于新测试用例和旧测试用例都能正确运行，同时保持代码功能正确。要添加更多测试用例，请将以下代码添加到\
  \ **TestCases.cpp** 文件中：\n\n```cpp\nTEST(CheckIp, WrongTokenCount){\n    testIp\
  \ = \"22.13111.11\";\n    ASSERT_FALSE(checkValidIp(testIp));\n}\nTEST(CheckIp,\
  \ WrongTokenEmpty){\n    testIp = \"22.131..11\";\n    ASSERT_FALSE(checkValidIp(testIp));\n\
  }\nTEST(CheckIp, WrongTokenStart){\n    testIp = \".2.1.31.11\";\n    ASSERT_FALSE(checkValidIp(testIp));\n\
  }\nTEST(CheckIp, WrongTokenEnd){\n    testIp = \"2.13.11.1.\";\n    ASSERT_FALSE(checkValidIp(testIp));\n\
  }\nTEST(CheckIp, SpaceToken){\n    testIp = \"2.13.11. 1\";\n    ASSERT_FALSE(checkValidIp(testIp));\n\
  }\nTEST(CheckIp, NonDigit){\n    testIp = \"2.13.b1.A1\";\n    ASSERT_FALSE(checkValidIp(testIp));\n\
  }\nTEST(CheckIp, NonValidDigit){\n    testIp = \"2.13.521.61\";\n    ASSERT_FALSE(checkValidIp(testIp));\n\
  }\nTEST(CheckIp, CorrectIp){\n    testIp = \"232.13.123.1\";\n    ASSERT_TRUE(checkValidIp(testIp));\n\
  }\n```\n\n在上述代码中，第一个和第二个用例应因令牌（token）不正确而失败。第三个用例应在 IP 以“.”开头时失败。第四个用例应在 IP 以“.”结尾时失败。第五个用例应在\
  \ IP 中间包含空格时失败。第六个用例应在 IP 包含任何非数字字符时失败。第七个用例应在 IP 中的某个令牌值小于 0 或大于 255 时失败。最后一个用例应在\
  \ IP 有效时通过。\n\n- 9. 现在，在 **CheckIp.cpp** 文件的 **CheckValidIp()** 函数内部添加以下代码。这段代码用于处理新的测试用例：\n\
  \n```cpp\nif(ip[strlen(ip)-1] == '.'){\n    cout<<\"ERROR : Incorrect token at end\"\
  <<endl;\n    return false;\n}\nistringstream istrstr(ip);\nvector<string> tokens;\n\
  string token;\nregex expression(\"[^0-9]\");\nsmatch m;\nwhile(getline(istrstr,\
  \ token, '.')){\n    if(token.empty()){\n        cout<<\"ERROR : Got empty token\"\
  <<endl;\n        return false;\n    }\n    if(token.find(' ') != string::npos){\n\
  \        cout<<\"ERROR : Space character in token\"<<endl;\n        return false;\n\
  \    }\n    if(regex_search(token,m,expression)){\n        cout<<\"ERROR : NonDigit\
  \ character in token\"<<endl;\n        return false;\n    }\n    int val = atoi(token.c_str());\n\
  \    if(val<0 || val>255){\n        cout<<\"ERROR : Invalid digit in token\"<<endl;\n\
  \        return false;\n    }\n    tokens.push_back(token);\n}\nif(tokens.size()!=4){\n\
  \    cout<<\"ERROR : Incorrect IP tokens used\"<<endl;\n    return false;\n}\ncout<<\"\
  strlen: \"<<strlen(ip)<<endl;\nreturn true;\n}\n```\n\n- 10. 打开终端，输入以下命令来运行二进制文件：\n\
  \n```\n./TestRun\n```\n\n所有测试用例都已执行，如下面的截图所示：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_520_0.png)\n\
  \n*图 7.12：测试用例运行的输出*\n\n上述截图显示，CheckIp 测试套件中有 10 个测试用例，并且所有测试用例都运行正常。在下一节中，我们将学习如何使用模拟对象进行单元测试。\n\
  \n## 使用模拟对象进行单元测试\n\n当开发人员进行单元测试时，可能会遇到这样的场景：某些接口是在具体操作执行之后才被调用的。例如，正如我们在前面的场景中讨论过的，假设项目是这样设计的：在执行之前，它会从数据库中获取所有的配置信息。它查询数据库以获得特定参数，例如\
  \ Web 服务器的 IP 地址、用户名和密码。然后，它会尝试连接 Web 服务器（也许还有另一个模块处理与网络相关的任务），或者开始处理实际项目所需的事项。此前，我们测试了\
  \ IP 地址的有效性。现在，我们将更进一步。假设 IP 地址是从数据库中获取的，并且我们有一个工具类负责处理数据库连接和 IP 地址查询。\n\n现在，要测试\
  \ IP 地址的有效性，我们需要假设数据库连接已经建立。这意味着应用程序可以正确查询数据库并获取查询结果，其中之一就是 IP 地址。只有这样，我们才能测试 IP\
  \ 地址的有效性。为了执行此类测试，我们必须假设所有必要的活动都已完成，并且我们有了一个 IP 地址可供测试。这时，模拟对象登场了，它的行为类似于真实对象。它为单元测试提供了便利，使应用程序认为\
  \ IP 地址已经从数据库中获取，但实际上，我们只是模拟了它。要创建模拟对象，我们需要从它要模拟的类中继承。在下一节中，我们将通过一个练习来更好地理解模拟对象。\n\
  \n### 练习 5：创建模拟对象\n\n在本练习中，我们将假设所有接口都按预期工作，从而创建模拟对象。使用这些对象，我们将测试一些功能，例如验证 IP 地址、检查数据库连接，以及检查用户名和密码的格式是否正确。一旦所有测试都通过，我们将确认应用程序，并为\
  \ QA 做好准备。执行以下步骤来实现本练习：\n\n- 1. 创建一个名为 Misc.h 的头文件，并包含必要的库：\n\n```cpp\n#include<iostream>\n\
  #include<string>\n#include<sstream>\n#include<vector>\n#include<iterator>\n#include<regex>\n\
  using namespace std;\n```\n\n- 2. 创建一个名为 ConnectDatabase 的类，它将连接到数据库并返回查询结果。在该类中，声明\
  \ Dbname、user 和 passwd 变量。同时，声明一个构造函数和两个虚函数。在这两个虚函数中，第一个必须是析构函数，第二个必须是 getResult()\
  \ 函数，它从数据库返回查询结果。添加以下代码来实现：\n\n```cpp\nclass ConnectDatabase{\n    string DBname;\n\
  \    string user;\n    string passwd;\n\npublic:\n    ConnectDatabase() {}\n   \
  \ ConnectDatabase(string _dbname, string _uname, string _passwd) :\n        DBname(_dbname),\
  \ user(_uname), passwd(_passwd) { }\n\n    virtual ~ConnectDatabase() {}\n    virtual\
  \ string getResult(string query);\n};\n```\n\n- 3. 创建另一个名为 WebServerConnect 的类。在类内部声明三个字符串变量，即\
  \ Webserver、uname 和 passwd。创建构造函数和两个虚函数。在这两个虚函数中，第一个必须是析构函数，第二个必须是 getRequest()\
  \ 函数。添加以下代码来实现：\n\n```cpp\nclass WebServerConnect{\n    string Webserver;\n    string\
  \ uname;\n    string passwd;\n\n    public :\n    WebServerConnect(string _sname,\
  \ string _uname, string _passwd) :\n        Webserver(_sname), uname(_uname), passwd(_passwd)\
  \ { }\n\n    virtual ~WebServerConnect() {}\n    virtual string getRequest(string\
  \ req);\n};\n```\n\n> **注意**\n>\n> 我们需要 **虚函数**，因为我们将从上述类中创建一个 Mock 类并调用这些函数。\n\n\
  - 4. 创建一个名为 App 的类。创建构造函数和析构函数，并调用所有函数。添加以下代码来实现：\n\n```cpp\nclass App {\n    ConnectDatabase\
  \ *DB;\n    WebServerConnect *WB;\n\n    public :\n        App():DB(NULL), WB(NULL)\
  \ {}\n        ~App() {\n            if ( DB ) delete DB;\n            if ( WB )\
  \ delete WB;\n        }\n        bool checkValidIp(string ip);\n        string getDBResult(string\
  \ query);\n        string getWebResult(string query);\n```\n\n\n\n\n\n```\nvoid\

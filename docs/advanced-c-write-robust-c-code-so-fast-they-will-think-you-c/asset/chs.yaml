  \n- 3. 现在，使用以下命令将记录的数据可视化：\n\n```\n`$ perf report`\n```\n\n执行上一条命令后，一个基于控制台的 GUI\
  \ 会显示以下数据：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_582_0.png)\n\n图 8.22：使用 perf\
  \ 命令分析 Snippet2.cpp 中的代码\n\n你可以上下移动光标以选择函数，然后按 *Enter* 获取选项列表。\n\n- 4. 突出显示 **testMul**，按\
  \ *Enter*，然后在结果列表中选择 **Annotate testMul**。随后会显示汇编代码列表，并带有描述每行代码执行时间百分比的注释，如下所示：\n\

  \ 项目。我们首先学习了如何创建 CMake 项目并将其导入 Eclipse CDT，从而可以选择使用命令行或 IDE。本章的其余部分专注于消除项目中的各种问题。首先，我们学习了如何向项目添加单元测试并使用它们来确保代码按预期工作。我们继续讨论了代码所经历的编译和链接步骤，并观察了目标文件的内容，以更好地理解可执行文件。然后，我们学习了如何在\
  \ IDE 中以可视化方式调试代码以消除运行时错误。我们最后讨论了一些经验法则，有助于创建可读、易懂且可维护的代码。这些方法将在你的 C++ 之旅中派上用场。在下一章中，我们将学习更多关于\
  \ C++ 的类型系统和模板。\n\n## Introduction\n\nC++ 是一种强类型、静态类型语言。编译器使用变量的类型信息及其使用上下文来检测和防止某些类别的编程错误。这意味着每个对象都有一个类型，并且该类型永远不会改变。相比之下，像\
  \ Python 和 PHP 这样的动态类型语言会将这种类型检查推迟到运行时（也称为后期绑定），并且变量的类型可能在应用程序执行期间发生变化。这些语言使用鸭子测试而不是变量的类型——也就是说，“如果它走路和说话都像鸭子，那么它一定就是鸭子。”\
  \ 像 C++ 这样的静态类型语言依赖于类型来确定变量是否可用于特定目的，而动态类型语言则依赖于某些方法和属性的存在来确定其适用性。\n\nC++ 最初被描述为“带类的\
  \ C”。这是什么意思？基本上，C 提供了一组内置的基本类型——int、float、char 等——以及这些项目的指针和数组。你使用 struct 将它们聚合为相关项目的结构。C++\
  \ 将其扩展为类，以便你可以完全定义自己的类型以及可用于操作它们的运算符，从而使它们成为语言中的一等公民。自从它诞生以来，C++ 已经发展成为远不止“带类的 C”，因为它现在可以表达面向对象范式（封装、多态、抽象和继承）、函数式范式以及通用编程（模板）。\n\
  \n在本书中，我们将重点关注 C++ 支持面向对象范式意味着什么。随着你作为开发者的经验增长，并接触到 Clojure、Haskell、Lisp 等函数式语言，它们将帮助你编写健壮的\
  \ C++ 代码。像 Python、PHP 和 Ruby 这样的动态类型语言已经影响了我们编写 C++ 代码的方式。随着 C++17 的到来，引入了 std::variant\
  \ 类——一个在编译时保存我们选择的任何类型的类，其行为类似于动态语言中的变量。\n\n在上一章中，我们学习了如何使用 CMake 创建可移植且可维护的 C++\
  \ 项目。我们学习了如何在项目中加入单元测试以帮助编写正确的代码，以及在出现问题时如何调试问题。我们学习了工具链如何将我们的代码通过一系列程序的管道处理以生成可执行文件。我们最后总结了一些经验法则，有助于我们创建可读、易懂且可维护的代码。\n\
  \n在本章中，我们将对 C++ 类型系统进行一次快速浏览，在此过程中声明和使用我们自己的类型。\n\n\n\n\n\n## C++ 类型\n\n作为一门强类型且静态类型的语言，C++\
  \ 提供了多种基本类型，并允许定义自己的类型，且可以根据当前问题的需要赋予其或多或少的特性。本节首先介绍基本类型、初始化它们、声明变量以及将类型与之关联。然后，我们将探讨如何声明和定义一个新类型。\n\
  \n### C++ 基本类型\n\nC++ 包含几种*基本类型*，也就是*内置类型*。C++ 标准定义了每种类型在内存中的最小大小以及它们之间的相对大小。编译器识别这些基本类型，并具有内置规则来定义可以对它们执行哪些操作以及不能执行哪些操作。还存在类型之间隐式转换的规则；例如，从\
  \ int 类型到 float 类型的转换。\n\n> **注意**\n>\n> 关于所有内置类型的简要描述，请参阅 https://en.cppreference.com/w/cpp/language/types\
  \ 上的 **基本类型** 部分。\n\n### C++ 字面量\n\nC++ 字面量用于在声明变量或为其赋值时，告诉编译器你希望与该变量关联的值。上一节中的每种内置类型都有一种与之关联的字面量形式。\n\
  \n> **注意**\n>\n> 关于每种类型字面量的简要描述，请参阅 https://en.cppreference.com/w/cpp/language/expressions\
  \ 上的 **字面量** 部分。\n\n### 指定类型——变量\n\n由于 C++ 是一种静态类型语言，声明变量时必须指定其类型。声明函数时，必须指定返回类型和传递给函数的参数类型。声明变量时，指定类型有两种选择：\n\
  \n-   **显式指定**：作为程序员，你精确地指定类型是什么。\n-   **隐式指定**（使用 auto）：你告诉编译器查看用于初始化变量的值并确定其类型。这称为（auto）类型推导。\n\
  \n标量变量声明的一般形式如下：\n\n```\ntype-specifier var;                 // 1. Default-initialized\
  \ variable\ntype-specifier var = init-value;    // 2. Assignment initialized variable\n\
  type-specifier var{init-value};     // 3. Brace-initialize variable\n```\n\n**类型说明符（type-specifier）**表示你希望与\
  \ **var** 变量关联的类型（基本类型或用户定义类型）。这三种形式都会让编译器分配一些存储空间来保存值，之后所有对 **var** 的引用都将指向该位置。**初始值（init-value）**用于初始化该存储位置。默认初始化对内置类型不执行任何操作；对于用户定义类型，则会根据函数重载解析调用其构造函数来初始化存储。\n\
  \n编译器必须知道要分配多少内存，并提供了一个运算符来确定类型或变量的大小——**sizeof**。\n\n根据声明，编译器会在计算机内存中留出空间来存储变量所引用的数据项。请看以下声明：\n\
  \n```\nint value = 42;      // declare value to be an integer and initialize to\
  \ 42\nshort a_value{64};   // declare a_value to be a short integer and initialize\n\
  \                     //     to 64\nint bad_idea;        // declare bad_idea to\
  \ be an integer and DO NOT\n                     // initialize it. Use of this variable\
  \ before setting\n                     // it is UNDEFINED BEHAVIOUR.\nfloat pi =\
  \ 3.1415F;  // declare pi to be a single precision floating point\n            \
  \         // number and initialize it to pi.\n```\n\n```\ndouble e{2.71828};  //\
  \ declare e to be a double precision floating point\n// number and initialize it\
  \ to natural number e.\nauto title = \"Sir Robin of Loxley\"; // Let the compiler\
  \ determine the type\n```\n\n如果这些变量声明在函数作用域内，编译器会从所谓的栈（stack）中为它们分配内存。其内存布局可能类似于下图：\n\
  \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_97_0.png)\n\n图 2A.1：变量的内存布局\n\n编译器会按照我们声明变量的顺序分配内存。出现未使用的内存，是因为编译器分配内存时，会确保基本类型通常以原子方式访问，并为了效率而按适当的内存边界对齐。请注意，title\
  \ 的类型是 const char *，这是一个指针，我们将在下一节与 const 一起讨论。“Sir Robin of Loxley”字符串将存储在另一部分内存中，这部分内存在程序加载时完成初始化。我们稍后将讨论程序内存。\n\
  \n对标量声明语法稍作修改，即可得到声明值数组的语法：\n\n```\ntype-specifier ary[count];                 \
  \        // 1. Default-initialized\ntype-specifier ary[count] = {comma-separated\
  \ list}; // 2. Assignment initialized\ntype-specifier ary[count]{comma-separated\
  \ list};     // 3. Brace-initialized\n```\n\n多维数组也可以这样声明：\n\n```\ntype-specifier\
  \ ary2d[countX][countY];\ntype-specifier ary3d[countX][countY][countZ];\n// etc...\n\
  ```\n\n请注意，上述声明中的 **count**、**countX** 等项必须在编译时求值为常量，否则会导致错误。此外，逗号分隔的初始化列表中的元素个数必须小于或等于\
  \ **count**，否则也会产生编译错误。在下一节中，我们将把目前所学的概念应用到一个练习中。\n\n> **注意**\n>\n> 在解决本章的任何实操练习之前，请下载本书的\

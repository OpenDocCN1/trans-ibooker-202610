  \n现在，比较结果。可以看到，输出完全相同。通过这个操作，我们确认了这些函数是可以互换的。\n\n### 用于浮点格式化的 I/O 操纵器\n\n在 **<ios>**\
  \ 头文件中，声明了用于更改浮点数字格式化的函数：**std::fixed**、**std::scientific**、**std::hexfloat** 和\
  \ **std::defaultfloat**。它们不带参数调用，并分别将 **floatfield** 设置为 fixed、scientific、fixed\
  \ 和 scientific，以及默认值。还有 **std::showpoint** 和 **std::noshowpoint** 函数，它们控制浮点数字的显示。它们只影响输出。**std::noshowpoint**\
  \ 函数只影响没有小数部分的浮点数字。\n\n在 **<iomanip>** 头文件中，声明了一个 **std::setprecision** 函数，该函数调用时传入一个表示精度的数字。当小数点右侧的数字被舍去时，结果会四舍五入。如果数字太大而无法以正常方式表示，则精度设置会被忽略，数字会以更便于显示的方式呈现。你只需设置一次精度，并且只在需要不同精度时才更改它。当你选择一种数据类型来存储浮点变量时，应该注意一些技巧。在\
  \ C++ 中，有三种可以表示浮点值的数据类型：float、double 和 long double。\n\n\n\n\nfloat 通常为 4 字节，double\
  \ 为 8 字节，long double 为 8、12 或 16 字节。因此，它们的精度都是有限的。float 类型最多可以容纳 6–9 位有效数字，double\
  \ 类型最多可以容纳 15–18 位有效数字，long double 类型最多可以容纳 33–36 位有效数字。如果你想比较它们之间的差异，请看下表：\n\n\
  | 类型 | 内存大小 | 有效数字位数 |\n|---|---|---|\n| float | 4 字节 | 6–9 |\n| double | 8 字节 |\
  \ 15–18 |\n| long double | 8、12、16 字节 | 33–36 |\n\n**图 6.11：浮点类型比较表**\n\n> **注意**\n\
  > \n> 当你需要的精度超过 6 位有效数字时，请优先使用 double，否则你会得到意想不到的结果。\n\n让我们完成一个练习，学习如何在实践中使用它们。\n\
  \n#### 练习 5：以不同格式显示输入的浮点数\n\n在本练习中，我们将编写一个应用程序，在无限循环中要求用户输入一个浮点数。读取输入后，它会以不同的格式类型显示该数字。要完成本练习，请执行以下步骤：\n\
  \n- 1. 包含 `<iostream>` 头文件以支持流操作，包含 `<iomanip>` 头文件以支持 `std::setprecision`：\n\n\
  ```cpp\n#include <iostream>\n#include <iomanip>\n```\n\n2. 接下来，声明一个模板 **formattingPrint**\
  \ 函数，它有一个名为 **FloatingPoint** 的模板参数，并接收一个该类型的参数变量。接着，通过调用 **std::cout** 对象中的 **precision()**\
  \ 函数，将之前的精度存储到一个 auto 变量中。然后，在终端中以不同格式显示给定的数字：带小数点、不带小数点，以及 fixed、scientific、hexfloat\
  \ 和 defaultfloat 格式。接下来，在 for 循环中，从 0 到 22，以循环计数器的值作为精度显示给定的数字。循环退出后，用我们之前存储的值恢复精度：\n\
  \n```cpp\ntemplate< typename FloatingPoint >\nvoid formattingPrint(const FloatingPoint\
  \ number)\n{\n    auto precision = std::cout.precision();\n    std::cout << \"Default\
  \ formatting with point: \"\n              << std::showpoint << number << std::endl\n\
  \              << \"Default formatting without point: \"\n              << std::noshowpoint\
  \ << number << std::endl\n              << \"Fixed formatting: \"\n            \
  \  << std::fixed << number << std::endl\n              << \"Scientific formatting:\
  \ \"\n              << std::scientific << number << std::endl\n              <<\
  \ \"Hexfloat formatting: \"\n              << std::hexfloat << number << std::endl\n\
  \              << \"Defaultfloat formatting: \"\n              << std::defaultfloat\
  \ << number << std::endl;\n\n    for (int i = 0; i < 22; i++)\n    {\n        std::cout\
  \ << \"Precision: \" << i\n                  << \", number: \" << std::setprecision(i)\n\
  \                  << number << std::endl;\n    }\n    std::cout << std::setprecision(precision);\n\
  }\n```\n\n3. 进入 main 函数。声明一个名为 floatNum 的 float 变量、一个名为 doubleNum 的 double 变量，以及一个名为\
  \ longDoubleNum 的 long double 变量。然后，在无限 while 循环中，要求用户输入一个浮点数，将输入读取到 longDoubleNum，并将其传递给\
  \ formattingPrint 函数。接下来，使用 longDoubleNum 的值初始化 doubleNum，并将其传递给 formattingPrint\
  \ 函数。接下来，使用 longDoubleNum 的值初始化 floatNum，并将其传递给 formattingPrint 函数：\n\n```cpp\n\
  int main(int argc, char **argv)\n{\n    float floatNum;\n    double doubleNum;\n\
  \    long double longDoubleNum;\n\n    while(true)\n    {\n        std::cout <<\
  \ \"Enter the floating-point digit: \";\n        std::cin >> std::setprecision(36)\
  \ >> longDoubleNum;\n\n        std::cout << \"long double output\" << std::endl;\n\
  \        formattingPrint(longDoubleNum);\n\n        doubleNum = longDoubleNum;\n\
  \n        std::cout << \"double output\" << std::endl;\n        formattingPrint(doubleNum);\n\
  \n        floatNum = longDoubleNum;\n\n        std::cout << \"float output\" <<\
  \ std::endl;\n        formattingPrint(floatNum);\n    }\n\n    return 0;\n}\n```\n\
  \n4. 构建并运行应用程序。根据输出提示输入一个具有 22 位有效数字的浮点值，例如，0.2222222222222222222222。我们将得到一长串输出。现在，我们需要将其拆分以供分析。以下是\
  \ long double 值输出部分的截图：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_442_0.png)\n\
  \n图 6.12：执行练习 5 的结果（第 1 部分）\n\n在这里，我们可以看到格式化结果相同，但精度结果不同。不准确的输出从精度 17 开始。这意味着，在我们的系统上，double\
  \ 的最大精度是 16 位有效数字。现在，让我们分析 float 值的输出：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_444_0.png)\n\
  \n图 6.14：执行练习 5 的结果（第 3 部分）\n\n在这里，我们可以看到格式化结果相同，但精度结果不同。不准确的输出从精度 8 开始。这意味着，在我们的系统上，float\
  \ 的最大精度是 8 位有效数字。不同系统上的结果应该会有所不同。对它们的分析将帮助你为应用程序选择正确的数据类型。\n\n注意\n切勿使用 float 数据类型来表示货币或汇率；你可能会得到错误的结果。\n\
  \n### 用于布尔格式化的 I/O 操纵符\n\n在 `<ios>` 头文件中，声明了用于更改布尔格式的函数：std::boolalpha 和 std::noboolalpha。它们无需参数即可调用，并允许我们分别以文本或数字方式显示布尔值。它们同时用于输入和输出操作。让我们看一个使用这些\
  \ I/O 操纵符进行输出操作的示例。我们将同时以文本和数字形式显示布尔值：\n\n```\nstd::cout << \"Default formatting\
  \ of bool variables: \"\n    << \"true: \" << true\n    << \", false: \" << false\
  \ << std::endl;\n```\n\n```\nstd::cout << \"Formatting of bool variables with boolalpha\
  \ flag is set: \"\n    << std::boolalpha\n    << \"true: \" << true\n    << \",\
  \ false: \" << false << std::endl;\n```\n\n```\nstd::cout << \"Formatting of bool\
  \ variables with noboolalpha flag is set: \"\n    << std::noboolalpha\n    << \"\
  true: \" << true\n    << \", false: \" << false << std::endl;\n```\n\n编译并运行此示例后，你将获得以下输出：\n\
  \n```\nDefault formatting of bool variables: true: 1, false: 0\nFormatting of bool\
  \ variables with boolalpha flag is set: true: true, false: false\nFormatting of\
  \ bool variables with noboolalpha flag is set: true: 1, false: 0\n```\n\n如你所见，布尔变量的默认格式化是通过\
  \ **std::noboolalpha** 标志执行的。要在输入操作中使用这些函数，我们需要一个包含 true/false 单词或 0/1 符号的源字符串。输入操作中的\
  \ **std::boolalpha** 和 **std::noboolalpha** 函数调用如下：\n\n```\nbool trueValue, falseValue;\n\
  ```\n\n```\nstd::istringstream iss(\"false true\");\niss >> std::boolalpha >> falseValue\
  \ >> trueValue;\nstd::istringstream iss(\"0 1\");\niss >> std::noboolalpha >> falseValue\
  \ >> trueValue;\n```\n\n如果随后输出这些变量，你会看到它们通过读取布尔值被正确初始化。\n\n### 用于字段宽度和填充控制的 I/O\
  \ 操纵符\n\n在标准库中，还有一些函数用于操作输出字段的宽度，当宽度大于输出数据时应使用哪些字符，以及这些填充字符应插入的位置。当你希望将输出向左或向右对齐，或者希望用其他符号替换空格时，这些函数将非常有用。例如，假设你需要以两列格式打印价格。如果使用标准格式，你将得到以下输出：\n\
  \n```\n2.33 3.45\n2.2 4.55\n3.67 3.02\n```\n\n这看起来不太好，而且难以阅读。如果我们应用格式化，输出将如下：\n\n\
  ```\n2.33    3.45\n2.2     4.55\n3.67    3.02\n```\n\n\n\n\n这样看起来更好。不过，你可能还是想检查一下，哪些字符是用来填充空白位置的，哪些是你实际在数字之间插入的空格。例如，让我们将填充字符设为\
  \ \"*\"。你将得到以下输出：\n\n```\n2.33* 3.45*\n2.2** 4.55*\n3.67* 3.02*\n```\n\n现在，你可以看到空白处已经用星号填满了。既然我们已经考虑了在输出中设置宽度和填充字符的用途，接下来看看如何使用\
  \ I/O 操作符做到这一点。`std::setw` 和 `std::setfill` 函数在 `<iomanip>` 头文件中声明。`std::setw` 接受一个整数值作为参数，并将流的宽度设置为正好\
  \ n 个字符。在少数情况下，宽度会被设置为 0，具体如下：\n\n-   当移位运算符与 `std::string` 或 `char` 一起使用时\n-  \
  \ 当调用 `std::put_money()` 函数时\n-   当调用 `std::quoted()` 函数时\n\n在 `<ios>` 头文件中，声明了用于更改填充字符插入位置的函数：`std::internal`、`std::left`\
  \ 和 `std::right`。它们仅用于输出操作，并且只影响整数、浮点数和货币值。\n\n现在，让我们看一个将所有这些一起使用的示例。我们以宽度 10 输出正数、负数、浮点数和十六进制值，并将填充字符替换为\
  \ \"#\"：\n\n```\nstd::cout << \"Internal fill: \" << std::endl\n    << std::setfill('#')\n\
  \    << std::internal\n    << std::setw(10) << -2.38 << std::endl\n    << std::setw(10)\
  \ << 2.38 << std::endl\n    << std::setw(10) << std::hex << std::showbase << 0x4b\
  \ << std::endl;\n```\n\n```\nstd::cout << \"Left fill: \" << std::endl\n    << std::left\n\
  \    << std::setw(10) << -2.38 << std::endl\n    << std::setw(10) << 2.38 << std::endl\n\
  \    << std::setw(10) << std::hex << std::showbase << 0x4b << std::endl;\n```\n\n\
  ```\nstd::cout << \"Right fill: \" << std::endl\n    << std::right\n    << std::setw(10)\
  \ << -2.38 << std::endl\n    << std::setw(10) << 2.38 << std::endl\n    << std::setw(10)\
  \ << std::hex << std::showbase << 0x4b << std::endl;\n```\n\n构建并运行此示例后，你将得到以下输出：\n\
  \n```\nInternal fill:\n-#####2.38\n######2.38\n0x######4b\n```\n\n```\nLeft fill:\n\
  -2.38#####\n2.38#####\n0x4b######\n```\n\n```\nRight fill:\n#####-2.38\n######2.38\n\
  ######0x4b\n```\n\n### 用于其他数字格式化的 I/O 操作符\n\n如果需要输出带 \"+\" 号的正数值，可以使用 `<ios>` 头文件中的另一个\
  \ I/O 操作符——`std::showpos` 函数。同样也存在意义相反的操作符——`std::noshowpos` 函数。它们都会对输出产生影响，用法非常简单。让我们看下面的示例：\n\
  \n```\nstd::cout << \"Default formatting: \" << 13 << \" \" << 0 << std::endl;\n\
  std::cout << \"showpos flag is set: \" << std::showpos << 13 << \" \" << 0 <<\n\
  std::endl;\nstd::cout << \"noshowpos flag is set: \" << std::noshowpos << 13 <<\
  \ \" \" << 0 <<\nstd::endl;\n```\n\n这里，我们先以默认格式输出，然后设置 `std::showpos` 标志，最后设置 `std::noshowpos`\
  \ 标志。如果你构建并运行这个小示例，你会看到默认情况下设置的是 `std::noshowpos` 标志。查看执行结果：\n\n```\nDefault formatting:\
  \ 13 0\nshowpos flag is set: +13 +0\nnoshowpos flag is set: 13 0\n```\n\n你可能还希望以大写字母输出浮点数或十六进制数字，这时可以使用\
  \ `<ios>` 头文件中的函数：`std::uppercase` 和 `std::nouppercase`。它们只影响输出。让我们看一个小示例：\n\n```\n\
  std::cout << \"12345.0 in uppercase with precision 4: \"\n    << std::setprecision(4)\
  \ << std::uppercase << 12345.0 << std::endl;\nstd::cout << \"12345.0 in no uppercase\
  \ with precision 4: \"\n    << std::setprecision(4) << std::nouppercase << 12345.0\
  \ <<\nstd::endl;\n\nstd::cout << \"0x2a in uppercase: \"\n    << std::hex << std::showbase\
  \ << std::uppercase << 0x2a <<\nstd::endl;\nstd::cout << \"0x2a in nouppercase:\
  \ \"\n    << std::hex << std::showbase << std::nouppercase << 0x2a <<\nstd::endl;\n\
  ```\n\n这里，我们分别使用和不使用 `std::uppercase` 标志输出浮点数和十六进制数字。默认情况下，设置的是 `std::nouppercase`\
  \ 标志。查看执行结果：\n\n```\n12345.0 in uppercase with precision 4: 1.234E+004\n12345.0\
  \ in no uppercase with precision 4: 1.234e+004\n0x2a in uppercase: 0X2A\n0x2a in\
  \ nouppercase: 0x2a\n```\n\n### 用于空白处理的 I/O 操作符\n\n标准库中有用于处理空白的函数。`<istream>` 头文件中的\
  \ `std::ws` 函数只适用于输入流，用于丢弃开头的空白字符。`<ios>` 头文件中的 `std::skipws` 和 `std::noskipws`\
  \ 函数用于控制读取和写入开头的空白字符。它们同时适用于输入流和输出流。当设置 `std::skipws` 标志时，流会忽略字符序列输入前面的空白字符。默认情况下，`std::skipws`\
  \ 标志是设置的。让我们看一个使用这些 I/O 操作符的示例。首先，我们以默认格式读取输入，并输出所读取的内容。接下来，我们清空字符串，并通过 `std::noskipws`\
  \ 标志读取数据：\n\n```\nstd::string name;\n\nstd::string surname;\n\nstd::istringstream(\"\
  Peppy Ping\") >> name >> surname;\n\nstd::cout << \"Your name: \" << name << \"\
  , your surname: \" << surname <<\nstd::endl;\n\nname.clear();\n\nsurname.clear();\n\
  \nstd::istringstream(\"Peppy Ping\") >> std::noskipws >> name >> surname;\nstd::cout\
  \ << \"Your name: \" << name << \", your surname: \" << surname <<\nstd::endl;\n\
  ```\n\n构建并运行此示例后，我们将得到以下输出：\n\n```\nYour name: Peppy, your surname: Ping\n\nYour\
  \ name: Peppy, your surname:\n```\n\n从前面的输出可以看出，如果我们设置了 `std::noskipws` 标志，也会读取空白字符。\n\
  \n在 `<iomanip>` 头文件中，声明了一个对这个头文件来说不同寻常的操作符：`std::quoted`。当此函数应用于输入时，它会将给定的字符串用引号括起来，并对特殊字符进行转义。如果输入的字符串已经包含转义后的引号，它也会一并读取。为了理解这一点，让我们看一个小示例。我们将用一个没有引号的文本来初始化一个源字符串，用带转义引号的文本初始化另一个字符串。接下来，我们不设置任何标志，使用\
  \ `std::ostringstream` 读取它们，并通过 `std::cout` 提供输出。请看以下示例：\n\n```\nstd::string str1(\"\
  String without quotes\");\nstd::string str2(\"String with quotes \\\"right here\\\
  \"\");\n\nstd::ostringstream ss;\nss << str1;\nstd::cout << \"[\" << ss.str() <<\
  \ \"]\" << std::endl;\nss.str(\"\");\n\nss << str2;\nstd::cout << \"[\" << ss.str()\
  \ << \"]\" << std::endl;\n```\n\n结果，我们将得到以下输出：\n\n```\n[String without quotes]\n\
  [String with quotes \"right here\"]\n```\n\n现在，让我们做同样的输出，但使用 `std::quoted` 调用：\n\
  \n```\nstd::string str1(\"String without quotes\");\nstd::string str2(\"String with\
  \ quotes \\\"right here\\\"\");\n\nstd::ostringstream ss;\nss << std::quoted(str1);\n\
  std::cout << \"[\" << ss.str() << \"]\" << std::endl;\nss.str(\"\");\n\nss << std::quoted(str2);\n\
  std::cout << \"[\" << ss.str() << \"]\" << std::endl;\n```\n\n现在，我们会得到不同的结果：\n\n\
  ```\n[\"String without quotes\"]\n[\"String with quotes \\\"right here\\\"\"]\n\
  ```\n\n你是否注意到，第一个字符串被引号括了起来，而第二个字符串中的子字符串 \"right here\" 在存储时带有转义字符？\n\n现在，你已经知道如何将任意字符串用引号括起来。你甚至可以编写自己的包装器，以减少使用\
  \ `std::quoted()` 时的代码行数。例如，我们将流相关操作移到了一个单独的函数中：\n\n```\nstd::string quote(const\
  \ std::string& str)\n{\n    std::ostringstream oss;\n    oss << std::quoted(str);\n\
  \    return oss.str();\n}\n```\n\n然后，在需要调用我们的包装器时，我们执行以下操作：\n\n```\nstd::string\
  \ str1(\"String without quotes\");\nstd::string str2(\"String with quotes \\\"right\
  \ here\\\"\");\n\nstd::cout << \"[\" << quote(str1) << \"]\" << std::endl;\nstd::cout\
  \ << \"[\" << quote(str2) << \"]\" << std::endl;\n```\n\n现在，它看起来好多了。第一个主题到此结束，让我们回顾一下刚刚学到的内容。在实践中，我们了解了预定义流对象的使用、带内部存储的文件\
  \ I/O 操作、I/O 格式化以及用户自定义类型的 I/O。现在，我们已经完整理解了如何在 C++ 中使用 I/O 库，接下来我们将考虑当标准流不够用时该怎么办。\n\
  \n## 创建额外的流\n\n当流提供的接口不足以解决你的任务时，你可能需要创建一个额外的流，并复用一个现有接口。你可能需要从特定的外部设备输出或提供输入，或者你可能需要添加调用\
  \ I/O 操作的线程 ID。有几种方法可以做到这一点。你可以创建一个新类，将现有的某个流作为私有成员聚合起来。它将通过已有的流函数实现所有需要的功能，例如移位运算符。另一种方法是继承现有类之一，并按你需要的方式覆盖所有虚函数。\n\
  \n\n\n\n首先，你必须选择要使用的合适的类。你的选择应取决于你想要添加的修改。选择 `std::basic_istream`、`std::basic_ostream`\
  \ 和 `std::basic_iostream` 如果你需要修改输入或输出操作。选择 `std::ios_base` 如果你想要修改状态信息、控制信息、私有存储等等。选择\
  \ `std::basic_ios` 如果你想要修改与流缓冲区相关的内容。在你选择正确的基类后，继承上述其中一个类来创建一个附加流。\n\n还有一件事你必须知道——如何正确初始化标准流。就文件流或字符串流以及基本流类的初始化而言，存在一些很大的差异。让我们回顾一下它们。要初始化派生自文件流类的对象的实例，你需要传递文件名。要初始化派生自字符串流类的对象的实例，你需要调用默认构造函数。它们各自都有自己的流缓冲区，因此在初始化时不需要额外的操作。要初始化派生自基本流类的对象的实例，你需要传递一个指向流缓冲区的指针。你可以创建一个缓冲区的变量，或者你可以使用预定义流对象的缓冲区，例如\
  \ `std::cout` 或 `std::cerr`。\n\n让我们详细回顾这两种创建附加流的方法。\n\n### 如何制作附加流 – 组合\n\n组合意味着你在类的私有部分声明一些标准流对象作为类的成员。当你选择合适的标准流类时，前往其头文件并注意它有哪些构造函数。然后，你需要在你类的构造函数中正确初始化该成员。为了将你的类用作流对象，你需要实现基本的函数，例如移位运算符、`str()`\
  \ 等等。正如你可能记得的，每个流类都为内置类型重载了移位运算符。它们也为预定义函数重载了移位运算符，例如 `std::endl`。你需要能够将你的类用作真正的流对象。不要声明全部\
  \ 18 个重载的移位运算符，我们只需要创建一个模板。此外，为了允许使用预定义的操纵符，我们必须声明一个接受指向函数的指针的移位运算符。\n\n这看起来并不很难，所以让我们尝试为\
  \ `std::ostream` 对象实现这样一个“包装器”。\n\n#### 练习 6：在用户定义类中组合标准流对象\n\n在本练习中，我们将创建一个自己的流对象，它包装\
  \ `std::ostream` 对象并添加额外的功能。我们将创建一个名为 extendedOstream 的类，它将数据输出到终端，并在每段输出前面插入以下数据：日期和时间以及线程\
  \ ID。为了完成本练习，请执行以下步骤：\n\n- 1. 包含所需的头文件：<iostream> 用于 std::endl 支持，<sstream> 用于 std::ostream\
  \ 支持，<thread> 用于 std::this_thread::get_id() 支持，<chrono> 用于 std::chrono::system_clock::now()，以及\
  \ <ctime> 用于将时间戳转换为可读表示：\n\n注意\n不要忘记在 Eclipse 项目设置中添加 pthread 链接器标志以获得线程支持：Project\
  \ -> Properties -> C/C++ Build -> Settings -> G++ Linker -> Miscellaneous -> Linker\
  \ flags 输入 '-pthread'。此路径适用于 Eclipse 版本：3.8.1；对于不同版本可能有所不同。\n\n```\n#include <iostream>\n\
  #include <sstream>\n#include <thread>\n#include <chrono>\n#include <ctime>\n```\n\
  \n- 2. 接下来，声明 extendedOstream 类。声明名为 m_oss 的 std::ostream 变量和名为 writeAdditionalInfo\
  \ 的 bool 变量。此 bool 变量将用于指示是否应打印扩展数据：\n\n```\nclass extendedOstream\n{\nprivate:\n\
  \    std::ostream& m_oss;\n    bool writeAdditionalInfo;\n};\n```\n\n3. 接下来，在 public\
  \ 部分，定义默认构造函数并用 std::cout 初始化 m_oss 以将输出重定向到终端。将 writeAdditionalInfo 初始化为 true：\n\
  \n```\nextendedOstream()\n    : m_oss(std::cout)\n    , writeAdditionalInfo(true)\n\
  {\n}\n```\n\n4. 定义一个模板重载的左移运算符 <<，它返回 extendedOstream 的引用并接受名为 value 的模板参数。然后，如果\
  \ writeAdditionalInfo 为 true，则输出时间、线程 ID 和给定的 value，然后将 writeAdditionalInfo 设置为\
  \ false。如果 writeAdditionalInfo 为 false，则仅输出给定的 value。此函数将用于所有内置类型的输出：\n\n```\ntemplate<typename\
  \ T>\nextendedOstream& operator<<(const T& value)\n{\n    if (writeAdditionalInfo)\n\
  \    {\n        std::string time = fTime();\n        auto id = threadId();\n   \
  \     m_oss << time << id << value;\n        writeAdditionalInfo = false;\n    }\n\
  \    else\n    {\n        m_oss << value;\n    }\n    return *this;\n}\n```\n\n\
  5. 定义另一个重载的左移运算符，它接受指向函数的指针作为参数并返回对 std::ostream 的引用。在函数体中，将 writeAdditionalInfo\
  \ 设置为 true，调用给定的函数并将 m_oss 作为参数传递。此重载运算符将用于预定义函数，例如 std::endl：\n\n```\nextendedOstream&\n\
  operator<<(std::ostream& (*pfn)(std::ostream&))\n{\n    writeAdditionalInfo = true;\n\
  \    pfn(m_oss);\n    return *this;\n}\n```\n\n6. 在 private 部分，定义 fTime 函数，它返回 std::string。它获取系统时间。将它格式化为可读表示并返回它：\n\
  \n```\nstd::string fTime()\n{\n    auto now = std::chrono::system_clock::now();\n\
  \    std::time_t time = std::chrono::system_clock::to_time_t(now);\n    std::ostringstream\
  \ oss;\n    std::string strTime(std::ctime(&time));\n    strTime.pop_back();\n \
  \   oss << \"[\" << strTime << \"]\";\n    return oss.str();\n}\n```\n\n7. 在 private\
  \ 部分，定义 threadId() 函数，它返回一个字符串。获取当前线程的 id，对其进行格式化并返回它：\n\n```\nstd::string threadId()\n\
  {\n    auto id = std::this_thread::get_id();\n    std::ostringstream oss;\n    oss\
  \ << \"[\" << std::dec << id << \"]\";\n    return oss.str();\n}\n```\n\n- 8. 输入\
  \ **main** 函数。为了测试我们的流对象的工作方式，创建一个名为 **oss** 的 **extendedOstream** 类型的对象。输出不同的数据，例如整数、浮点数、十六进制和布尔值：\n\
  \n```\nextendedOstream oss;\noss << \"Integer: \" << 156 << std::endl;\noss << \"\
  Float: \" << 156.12 << std::endl;\noss << \"Hexadecimal: \" << std::hex << std::showbase\n\
  \    << std::uppercase << 0x2a << std::endl;\noss << \"Bool: \" << std::boolalpha\
  \ << false << std::endl;\n```\n\n- 9. 然后，创建一个线程，用 lambda 函数初始化它，并在 lambda 中放入相同的输出。不要忘记加入线程：\n\
  \n```\nstd::thread thr1([]()\n{\n    extendedOstream oss;\n    oss << \"Integer:\
  \ \" << 156 << std::endl;\n    oss << \"Float: \" << 156.12 << std::endl;\n    oss\
  \ << \"Hexadecimal: \" << std::hex << std::showbase\n        << std::uppercase <<\
  \ 0x2a << std::endl;\n    oss << \"Bool: \" << std::boolalpha << false << std::endl;\n\
  });\nthr1.join();\n```\n\n- 10. 现在，构建并运行应用程序。你将得到以下输出：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_457_0.png)\n\
  \n考虑输出的每一行。你可以看到输出的下一个格式：“[日期和时间][线程 ID]输出数据。” 确保线程 ID 从线程到线程不同。然后，数据以预期的格式输出。所以，正如你所见，使用标准流的组合实现自己的\
  \ I/O 流对象并不太难。\n\n输入操作的缓冲字符传输如下工作：\n\n- 1. **sgetc()** 函数从内部缓冲区读取字符。\n- 2. **sgetc()**\
  \ 函数调用 **s ungetc()** 函数，使已消耗的字符再次可用。\n- 3. 如果内部缓冲区为空，**sgetc()** 函数调用 **underflow()**\
  \ 函数。\n- 4. **underflow()** 函数从外部设备读取字符到内部缓冲区。\n\n**sgetc()** 和 **underflow()**\
  \ 函数始终返回相同的字符。为了每次读取不同的字符，我们还有另一对函数：**sbumpc()** 和 **uflow()**。使用它们的读取字符算法是相同的：\n\
  \n- 1. **sbumpc()** 函数从内部缓冲区读取字符。\n- 2. **sbumpc()** 函数调用 **sputbackc()** 函数，使下一个字符可用于输入。\n\
  - 3. 如果内部缓冲区为空，**sbumpc()** 函数调用 **uflow()** 函数。\n- 4. **uflow()** 函数从外部设备读取字符到内部缓冲区。\n\
  \n输入操作的非缓冲字符传输如下工作：\n\n- 1. **sgetc()** 函数调用一个受保护的虚成员，即 **underflow()**。\n- 2. **underflow()**\
  \ 函数从外部设备读取字符到内部缓冲区。\n- 3. **sbumpc()** 函数调用一个受保护的虚成员，即 **uflow()**。\n- 4. **uflow()**\
  \ 函数从外部设备读取字符到内部缓冲区。\n\n在任何错误的情况下，受保护的虚成员 **pbackfail()** 都会被调用，它处理错误情况。所以，正如你所见，要重写\
  \ **std::basic_streambuf** 类，我们需要重写与外部设备工作的虚成员。对于输入 **streambuf**，我们应该重写 **underflow()**、**uflow()**\
  \ 和 **pbackfail()** 成员。对于输出 **streambuf**，我们应该重写 **overflow()** 和 **sync()** 成员。\n\
  \n让我们更详细地考虑所有这些步骤。\n\n\n\n\n\n### 练习 7：继承标准流对象\n\n在本练习中，我们将创建一个名为 **extended_streambuf**\
  \ 的类，它继承自 **std::basic_streambuf**。我们将使用 **std::cout** 流对象的缓冲区，并重写 overflow() 函数，以便将数据写入外部设备（stdout）。接下来，我们将编写一个继承自\
  \ **std::basic_ostream** 类的 **extended_ostream** 类，并将流缓冲区设置为 **extended_streambuf**。最后，我们会对包装类做一些小改动，并将\
  \ **extended_ostream** 用作私有流成员。请按以下步骤完成本练习：\n\n- 1. 包含所需的头文件：用于支持 std::endl 的 <iostream>，用于支持\
  \ std::ostream 和 std::basic_streambuf 的 <sstream>，用于支持 std::this_thread::get_id()\
  \ 的 <thread>，用于支持 std::chrono::system_clock::now() 的 <chrono>，以及用于将时间戳转换为可读格式的 <ctime>。\n\
  - 2. 创建一个名为 **extended_streambuf** 的模板类，使其继承自 **std::basic_streambuf** 类。重写一个名为\
  \ **overflow()** 的公有成员函数，该函数将字符写入输出流，并返回 EOF 或写入的字符：\n\n```\ntemplate< class CharT,\
  \ class Traits = std::char_traits<CharT> >\nclass extended_streambuf : public std::basic_streambuf<\
  \ CharT, Traits >\n{\npublic:\n    int overflow( int c = EOF ) override\n    {\n\
  \        if (!Traits::eq_int_type(c, EOF))\n        {\n            return fputc(c,\
  \ stdout);\n        }\n        return Traits::not_eof(c);\n    }\n};\n```\n\n```\n\
  {\n    if (writeAdditionalInfo)\n    {\n        std::string time = fTime();\n  \
  \      auto id = threadId();\n        m_log << time << id << value;\n        writeAdditionalInfo\
  \ = false;\n    }\n    else\n    {\n        m_log << value;\n    }\n    return *this;\n\
  }\n\nlogger&\noperator<<(std::ostream& (*pfn)(std::ostream&))\n{\n    writeAdditionalInfo\
  \ = true;\n    pfn(m_log);\n    return *this;\n}\n\nprivate:\n    std::string fTime()\n\
  \    {\n        auto now = std::chrono::system_clock::now();\n        std::time_t\
  \ time = std::chrono::system_clock::to_time_t(now);\n        std::ostringstream\
  \ log;\n        std::string strTime(std::ctime(&time));\n        strTime.pop_back();\n\
  \        log << \"[\" << strTime << \"]\";\n        return log.str();\n    }\n\n\
  \    std::string threadId()\n    {\n        auto id = std::this_thread::get_id();\n\
  \        std::ostringstream log;\n```\n\n```\nlog << \"[\" << std::dec << id <<\
  \ \"]\";\nreturn log.str();\n}\n\nprivate:\n    extended_ostream<char> m_log;\n\
  \    bool writeAdditionalInfo;\n};\n```\n\n- 5. 进入 **main** 函数，将 **extendedOstream**\
  \ 对象改为 **logger** 对象。其余代码保持不变。现在，构建并运行本练习。你会看到与上一练习相同的输出，但这次我们使用了自己的流缓冲区、自己的流对象，以及一个能向输出添加额外信息的包装类。请查看以下屏幕截图中的执行结果，并与上一练习的结果进行比较。确保两者相似。如果相似，就说明我们做得不错，继承的类也按预期工作：\n\
  \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_463_0.png)\n\n本节中，我们完成了很多内容，并学习了如何以不同方式创建额外的流。我们考察了适合继承的各类，以及针对不同需求应使用哪个类。我们还学习了如何继承基本的\
  \ streambuf 类，以实现与外部设备的交互。现在，我们将学习如何以异步方式使用 I/O 流。\n\n## 利用异步 I/O\n\n在许多情况下，I/O\
  \ 操作可能耗时很长，例如创建备份文件、搜索大型数据库、读取大型文件等。你可以使用线程执行 I/O 操作，从而避免阻塞应用程序的执行。但对于某些应用程序而言，这并不是处理耗时\
  \ I/O 的合适方式，例如每秒可能发生数千次 I/O 操作的情况。在这些情况下，C++ 开发人员会使用异步 I/O。它可以节省线程资源，并确保执行线程不会被阻塞。下面我们来了解同步\
  \ I/O 和异步 I/O。\n\n你可能还记得第 5 章“哲学家晚餐——线程与并发”中的内容：同步操作意味着某个线程发起操作并等待其完成。应用程序可以是单线程的，也可以是多线程的。关键在于，线程会等待\
  \ I/O 操作完成。\n\n异步执行是指某项操作不会阻塞工作线程的执行。执行异步 I/O 操作的线程会发送异步请求，然后继续执行其他任务。操作完成后，初始线程会收到完成通知，并可按需处理结果。\n\
  \n由此看来，异步 I/O 似乎比同步 I/O 好得多，但这取决于具体情况。如果需要执行大量快速 I/O 操作，那么考虑到处理内核 I/O 请求和信号的开销，采用同步方式可能更合适。因此，在为应用程序设计架构时，需要考虑所有可能的场景。\n\
  \n标准库不支持异步 I/O 操作。因此，要使用异步 I/O，我们需要考虑使用其他库，或者自行实现。首先，我们来看看依赖平台的实现，然后再了解跨平台库。\n\n\
  ### Windows 平台上的异步 I/O\n\nWindows 支持对多种设备执行 I/O 操作，包括文件、目录、驱动器、端口、管道、套接字、终端等。通常，我们对这些设备使用相同的\
  \ I/O 接口，但不同设备的某些设置有所不同。下面我们来看看在 Windows 中对文件执行的 I/O 操作。\n\n在 Windows 中，我们需要打开设备并获取其句柄。不同设备的打开方式各不相同。要打开文件、目录、驱动器或端口，我们使用\
  \ `<Windows.h>` 头文件中的 `CreateFile` 函数。要打开管道，我们使用 `CreateNamedPipe` 函数。要打开套接字，我们使用\
  \ socket() 和 accept() 函数。要打开终端，我们使用 `CreateConsoleScreenBuffer` 和 `GetStdHandle`\
  \ 函数。这些函数都会返回一个设备句柄，之后对该设备的所有操作都会使用这个句柄。\n\n`CreateFile` 函数有七个参数，用于控制打开设备后的操作。函数声明如下：\n\
  \n```\nHANDLE CreateFile( PCTSTR pszName,\n                   DWORD dwDesiredAccess,\n\
  \                   DWORD dwShareMode,\n                   PSECURITY_ATTRIBUTES\
  \ psa,\n                   DWORD dwCreationDisposition,\n                   DWORD\
  \ dwFlagsAndAttributes,\n                   HANDLE hFileTemplate);\n```\n\n第一个参数是\
  \ `pszName`——文件路径。第二个参数名为 `dwDesiredAccess`，用于控制对设备的访问权限。它可以取以下值之一：\n\n```\n0 //\
  \ 仅用于更改配置\nGENERIC_READ // 仅用于读取\nGENERIC_WRITE // 仅用于写入\nGENERIC_READ | GENERIC_WRITE\
  \ // 同时用于读取和写入\n```\n\n第三个参数 `dwShareMode` 用于控制当文件已经打开时，操作系统应如何处理所有新的 `CreateFile`\
  \ 调用。它可以取以下值之一：\n\n```\n0 // 同一时间只能有一个应用程序打开该设备\nFILE_SHARE_READ // 允许多个应用程序同时读取\n\
  FILE_SHARE_WRITE // 允许多个应用程序同时写入\nFILE_SHARE_READ | FILE_SHARE_WRITE // 允许多个应用程序同时读取和写入\n\
  FILE_SHARE_DELETE // 允许多个应用程序同时移动或删除\n```\n\n第四个参数 psa 通常设为 NULL。第五个参数 dwCreationDisposition\
  \ 用于控制打开文件还是创建文件。它可以取以下值之一：\n\n```\nCREATE_NEW // 创建新文件；如果文件已存在则失败\nCREATE_ALWAYS\
  \ // 创建新文件；如果文件已存在则覆盖\nOPEN_EXISTING // 打开文件；如果文件不存在则失败\nOPEN_ALWAYS // 打开或创建文件\n\
  TRUNCATE_EXISTING // 打开现有文件并截断；如果文件不存在则失败\n```\n\n第六个参数 dwFlagsAndAttributes 用于控制缓存或文件操作。管理缓存时，它可以取以下值之一：\n\
  \n```\nFILE_FLAG_NO_BUFFERING // 不使用缓存\nFILE_FLAG_SEQUENTIAL_SCAN // 告知操作系统将按顺序读取文件\n\
  FILE_FLAG_RANDOM_ACCESS // 告知操作系统不会按顺序读取文件\nFILE_FLAG_WRITE_THROUGH // 写入时不使用缓存，读取时使用缓存\n\
  ```\n\n管理文件操作时，它可以取以下值之一：\n\n```\nFILE_FLAG_DELETE_ON_CLOSE // 关闭后删除文件（用于临时文件）\n\
  FILE_FLAG_BACKUP_SEMANTICS // 用于备份和恢复程序\nFILE_FLAG_POSIX_SEMANTICS // 创建或打开文件时用于设置区分大小写\n\
  FILE_FLAG_OPEN_REPARSE_POINT // 允许以不同方式打开、读取、写入和关闭文件\nFILE_FLAG_OPEN_NO_RECALL //\
  \ 防止系统从归档介质中恢复文件内容\nFILE_FLAG_OVERLAPPED // 允许以异步方式操作设备\n```\n\n作为文件属性时，它可以取以下值之一：\n\
  \n```\nFILE_ATTRIBUTE_ARCHIVE // 应删除文件\nFILE_ATTRIBUTE_ENCRYPTED // 文件已加密\nFILE_ATTRIBUTE_HIDDEN\
  \ // 文件为隐藏文件\nFILE_ATTRIBUTE_NORMAL // 未设置其他属性\nFILE_ATTRIBUTE_NOT_CONTENT_INDEXED\
  \ // 文件正在由索引服务处理\n```\n\n\n\n\n\nFILE_ATTRIBUTE_OFFLINE // 文件已传输到归档介质\nFILE_ATTRIBUTE_READONLY\
  \ // 仅读访问\nFILE_ATTRIBUTE_SYSTEM // 系统文件\nFILE_ATTRIBUTE_TEMPORARY // 临时文件\n\n最后一个参数\
  \ hFileTemplate 接受一个打开文件的句柄或 NULL 作为参数。如果传递了文件句柄，CreateFile 函数会忽略所有属性和标志，并使用打开文件的属性和标志。\n\
  \n关于 CreateFile 参数就这些了。如果它无法打开设备，则返回 INVALID_HANDLE_VALUE。以下示例演示如何打开文件进行读取：\n\n\
  ```\n#include <iostream>\n#include <Windows.h>\n\nint main()\n{\n    HANDLE hFile\
  \ = CreateFile(TEXT(\"Test.txt\"), GENERIC_READ,\n                            FILE_SHARE_READ\
  \ | FILE_SHARE_WRITE,\n                            NULL, OPEN_ALWAYS, FILE_ATTRIBUTE_NORMAL,\n\
  NULL);\n\n    if (INVALID_HANDLE_VALUE == hFile)\n        std::cout << \"Failed\
  \ to open file for reading\" << std::endl;\n    else\n        std::cout << \"Successfully\
  \ opened file for reading\" << std::endl;\n\n    CloseHandle(hFile);\n\n    return\
  \ 0;\n}\n```\n\n接下来，要执行输入操作，我们使用 **ReadFile** 函数。它将文件描述符作为第一个参数，源缓冲区作为第二个参数，要读取的最大字节数作为第三个参数，读取字节数作为第四个参数，以及用于同步执行时的\
  \ **NULL** 值或指向有效且唯一的 OVERLAPPED 结构的指针作为最后一个参数。如果操作成功，**ReadFile** 返回 true，否则返回\
  \ false。以下示例演示如何从之前打开的用于读取的文件中输入：\n\n```\nBYTE pb[20];\n\nDWORD dwNumBytes;\n\n\
  ReadFile(hFile, pb, 20, &dwNumBytes, NULL);\n```\n\n要执行输出操作，我们使用 **WriteFile** 函数。它的声明与\
  \ **ReadFile** 相同，但第三个参数设置要写入的字节数，第五个参数是已写入的字节数。以下示例演示如何向之前打开的用于写入的文件输出：\n\n```\n\
  BYTE pb[20] = \"Some information\\0\";\n\nDWORD dwNumBytes;\n\nWriteFile(hFile,\
  \ pb, 20, &dwNumBytes, NULL);\n```\n\n要将缓存的数据写入设备，请使用 **FlushFileBuffer** 函数。它接受一个参数——文件描述符。让我们转向异步\
  \ I/O。为了让操作系统知道你计划异步地与设备工作，你需要使用 **FILE_FLAG_OVERLAPPED** 标志打开它。现在，为写入或读取打开文件如下所示：\n\
  \n```\n#include <iostream>\n\n#include <Windows.h>\n\nint main()\n{\n    HANDLE\
  \ hFile = CreateFile(TEXT(\"Test.txt\"), GENERIC_READ,\n                       \
  \     FILE_SHARE_READ | FILE_SHARE_WRITE,\n                            NULL, OPEN_ALWAYS,\
  \ FILE_FLAG_OVERLAPPED,\nNULL);\n\n    if (INVALID_HANDLE_VALUE == hFile)\n    \
  \    std::cout << \"Failed to open file for reading\" << std::endl;\n    else\n\
  \        std::cout << \"Successfully opened file for reading\" << std::endl;\n\n\
  \    CloseHandle(hFile);\n\n    return 0;\n}\n```\n\n我们使用相同的操作来执行文件的读取或写入，即 **ReadFile**\
  \ 和 **WriteFile**，唯一的区别是读取或写入的字节数设置为 NULL，并且我们必须传递一个有效且唯一的 **OVERLAPPED** 对象。让我们考虑\
  \ OVERLAPPED 对象的结构是什么：\n\n```\ntypedef struct _OVERLAPPED {\nDWORD Internal; //\
  \ for error code\nDWORD InternalHigh; // for number of read bytes\nDWORD Offset;\n\
  DWORD OffsetHigh;\nHANDLE hEvent; // handle to an event\n} OVERLAPPED, *LPOVERLAPPED;\n\
  ```\n\nInternal 成员设置为 **STATUS_PENDING**，这意味着操作尚未开始。读取或写入的字节数将写入 **InternalHigh**\
  \ 成员。**Offset** 和 **OffsetHigh** 在异步操作中被忽略。**hEvent** 成员用于接收关于异步操作完成的事件。\n\n> **Note**\n\
  > \n> I/O 操作的顺序不能保证，因此你不能依赖它。如果你计划在一个地方写入文件，在另一个地方从文件读取，你不能依赖顺序。\n\n在异步模式下使用 **ReadFile**\
  \ 和 **WriteFile** 时有一个不寻常的事情。它们在 I/O 请求同步执行时返回非零值。如果它们返回 **FALSE**，你需要调用 **GetLastError**\
  \ 函数来检查为什么返回了 **FALSE**。如果错误代码是 **ERROR_IO_PENDING**，这意味着 I/O 请求已成功处理，处于挂起状态，将在以后执行。\n\
  \n你应该记住的最后一件事是，在 I/O 操作完成之前，你不能移动或删除 **OVERLAPPED** 对象或包含数据的缓冲区。对于每个 I/O 操作，你应该创建一个新的\
  \ **OVERLAPPED** 对象。\n\n最后，让我们考虑系统通知我们 I/O 操作完成的方式。有几种这样的机制：释放设备、释放事件、产生警报和使用 I/O\
  \ 端口。\n\n**“糟糕”的方法：** **WriteFile** 和 **ReadFile** 函数将设备设置为“占用”状态。当 I/O 操作完成时，驱动程序将设备设置为“空闲”状态。我们可以检查完成的\
  \ I/O 操作是否调用 **WaitForSingleObject** 或 **WaitForMultipleObject** 函数。以下示例演示了这种方法：\n\
  \n```\n```cpp\n#include <Windows.h>\n\n#include <WinError.h>\n\nint main()\n{\n\
  \    HANDLE hFile = CreateFile(TEXT(\"Test.txt\"), GENERIC_READ,\n             \
  \                  FILE_SHARE_READ | FILE_SHARE_WRITE,\n    NULL,\n            \
  \                   OPEN_ALWAYS, FILE_FLAG_OVERLAPPED,\n    NULL);\n\n    BYTE bBuffer[100];\n\
  \    OVERLAPPED o = { 0 };\n    BOOL bResult = ReadFile(hFile, bBuffer, 100, NULL,\
  \ &o);\n    DWORD dwError = GetLastError();\n\n    if (bResult && (dwError == ERROR_IO_PENDING))\n\
  \    {\n        WaitForSingleObject(hFile, INFINITE);\n        bResult = TRUE;\n\
  \    }\n\n    CloseHandle(hFile);\n\n    return 0;\n}\n```\n```\n\n这是检查 I/O 操作是否已完成的最简单方法。但这种方法使调用线程在\
  \ `WaitForSingleObject` 调用上等待，因此它成为同步调用。此外，你可以为该设备启动多个 I/O 操作，但你不能确定线程会在设备释放的所需时刻唤醒。\n\
  \n**有点好，但不是最好的方法：** 你还记得重叠结构的最后一个成员吗？你通过调用 `CreateEvent` 函数创建一个事件并将其设置为 `OVERLAPPED`\
  \ 对象。然后，当 I/O 操作完成时，系统通过调用 `SetEvent` 函数释放此事件。接下来，当调用线程需要获取正在执行的 I/O 操作的结果时，你调用\
  \ `WaitForSingleObject` 并传递此事件的描述符。以下示例演示了这种方法：\n\n```\n```c\n#include <Windows.h>\n\
  #include <synchapi.h>\n\nint main()\n{\n    HANDLE hFile = CreateFile(TEXT(\"Test.txt\"\
  ), GENERIC_READ,\n                              FILE_SHARE_READ | FILE_SHARE_WRITE,\n\
  \                              NULL, OPEN_ALWAYS, FILE_FLAG_OVERLAPPED,\n    NULL);\n\
  \n    BYTE bInBuffer[10];\n    OVERLAPPED o = { 0 };\n    o.hEvent = CreateEvent(NULL,TRUE,FALSE,\"\
  IOEvent\");\n    ReadFile(hFile, bInBuffer, 10, NULL, &o);\n\n    ///// do some\
  \ work\n\n    HANDLE hEvent = o.hEvent;\n\n    WaitForSingleObject(hEvent, INFINITE);\n\
  \n    CloseHandle(hFile);\n\n    return 0;\n}\n```\n```\n\n如果你希望通知调用线程 I/O 操作的结束，这是一个相当简单的方法。但这不是理想的方法，因为当有大量此类操作时，你需要为每个操作创建一个事件对象。\n\
  \n**另一种不是最好的方法：** 可警报的 I/O 工作方式如下。我们调用 **ReadFileEx** 和 **WriteFileEx** 进行输入/输出。它们与标准的\
  \ **ReadFile** 和 **WriteFile** 类似，但我们不传递存储读取或写入字符数的变量，并传递回调函数的地址。此回调函数称为完成例程，其声明如下：\n\
  \n```\n```cpp\nVOID WINAPI\n\nCompletionRoutine(DWORD dwError,\n               \
  \   DWORD dwNumBytes,\n                  OVERLAPPED* po);\n```\n```\n\n**ReadFileEx**\
  \ 和 **WriteFileEx** 将回调函数的地址传递给设备驱动程序。当设备上的操作完成时，驱动程序将回调函数的地址添加到 APC 队列并指向 OVERLAPPED\
  \ 结构的指针。然后，操作系统调用此函数并传递读取或写入的字节数、错误代码和指向 OVERLAPPED 结构的指针。\n\n这种方法的主要缺点是编写回调函数并使用大量全局变量，因为回调函数在上下文中只有少量信息。另一个不使用这种方法的原因是，只有调用线程可以接收关于完成的通知。\n\
  \n\n\n\n\n现在我们已经讨论了不好的做法，让我们来看一下处理 I/O 结果的最佳方法 – I/O 端口。I/O 完成端口是为与线程池一起使用而开发的。要创建这样一个端口，我们使用\
  \ CreateIoCompletionPort。该函数的声明如下：\n\n```\nHANDLE\nCreateIoCompletionPort(HANDLE\
  \ hFile,\n    HANDLE hExistingCompletionPort,\n    ULONG_PTR CompletionKey,\n  \
  \  DWORD dwNumberOfConcurrentThreads);\n```\n\n该函数创建一个 I/O 完成端口并将设备与此端口关联。要完成此操作，我们需要调用它两次。要创建新的完成端口，我们调用\
  \ CreateIoCompletionPort 函数并将 INVALID_HANDLE_VALUE 作为第一个参数传递，将 NULL 作为第二个参数传递，将\
  \ 0 作为第三个参数传递，并传递此端口的线程数。将第四个参数传递为 0 将使线程数等于处理器数量。\n\n> Note\n> \n> 对于 I/O 完成端口，建议使用的线程数等于处理器数量的两倍。\n\
  \n接下来，我们需要将此端口与输入/输出设备关联。因此，我们第二次调用 CreateIoCompletionPort 函数并传递设备的描述符、已创建完成端口的描述符、将指示对设备进行读写操作的常量，以及\
  \ 0 作为线程数。然后，当我们需要获取完成结果时，我们从端口描述符调用 GetQueuedCompletionStatus。如果操作完成，函数会立即返回结果。如果没有，则线程等待完成。以下示例演示了这种方法：\n\
  \n```\n#include <Windows.h>\n\n#include <synchapi.h>\n\nint main()\n{\n    HANDLE\
  \ hFile = CreateFile(TEXT(\"Test.txt\"), GENERIC_READ,\n        FILE_SHARE_READ\
  \ | FILE_SHARE_WRITE,\n```\n\n```\nNULL, OPEN_ALWAYS, FILE_FLAG_OVERLAPPED,\nNULL);\n\
  \n    HANDLE m_hIOcp = CreateIoCompletionPort(INVALID_HANDLE_VALUE, NULL, 0, 0);\n\
  \    CreateIoCompletionPort(hFile, m_hIOcp, 1, 0);\n\n    BYTE bInBuffer[10];\n\
  \    OVERLAPPED o = { 0 };\n    ReadFile(hFile, bInBuffer, 10, NULL, &o);\n\n  \
  \  DWORD dwNumBytes;\n    ULONG_PTR completionKey;\n    GetQueuedCompletionStatus(m_hIOcp,\
  \ &dwNumBytes, &completionKey, (OVERLAPPED**) &o, INFINITE);\n\n    CloseHandle(hFile);\n\
  \n    return 0;\n}\n```\n\n### Asynchronous I/O on Linux Platforms\n\nLinux 平台上的异步\
  \ I/O 支持对不同设备（如套接字、管道和 TTY）进行输入和输出，除了文件。是的，这很奇怪，但 Linux 开发者决定文件 I/O 操作已经足够快了。\n\n\
  要打开一个 I/O 设备，我们使用 open() 函数。它的声明如下：\n\n```\nint open (const char *filename, int\
  \ flags[, mode_t mode])\n```\n\n第一个参数是文件名，而第二个参数是一个位掩码，控制文件应如何打开。如果系统无法打开设备，open()\
  \ 返回 -1 的值。成功时，它返回设备描述符。open 模式的可能标志为 O_RDONLY、O_WRONLY 和 O_RDWR。\n\n要执行输入/输出操作，我们使用名为\
  \ aio 的 POSIX 接口。它们有一组定义的函数，如 aio_read、aio_write、aio_fsync 等。它们用于启动异步操作。要获取执行结果，我们可以使用信号通知或线程的实例化。或者，我们也可以选择完全不接收通知。它们都声明在\
  \ <aio.h> 头文件中。\n\n几乎所有这些都以 aiocb 结构（异步 IO 控制块）作为参数。它控制 IO 操作。此结构的声明如下：\n\n```\n\
  struct aiocb\n{\n    int aio_fildes;\n    off_t aio_offset;\n    volatile void *aio_buf;\n\
  \    size_t aio_nbytes;\n    int aio_reqprio;\n    struct sigevent aio_sigevent;\n\
  \    int aio_lio_opcode;\n};\n```\n\naio_fildes 成员是打开设备的描述符，而 aio_offset 成员是设备中应进行读或写操作的偏移量。aio_buf\
  \ 成员是指向要读写缓冲区的指针。aio_nbytes 成员是缓冲区的大小。aio_reqprio 成员是此 IO 操作执行的优先级。aio_sigevent\
  \ 成员是一个结构，指出调用线程应如何被通知完成。aio_lio_opcode 成员是 I/O 操作的类型。以下示例演示如何初始化 aiocb 结构：\n\n\
  ```\nstd::string fileContent;\n\nconstexpr int BUF_SIZE = 20;\n\nfileContent.resize(BUF_SIZE,\
  \ 0);\n\naiocb aiocbObj;\n\naiocbObj.aio_fildes = open(\"test.txt\", O_RDONLY);\n\
  if (aiocbObj.aio_fildes == -1)\n{\n```\n\n```\n#include <unistd.h>\n#include <iostream>\n\
  #include <chrono>\n#include <thread>\n```\n\n2. 创建一个名为 **isDone** 的 bool 变量，它将指示操作是否已完成：\n\
  \n```\nbool isDone{};\n```\n\n3. 定义函数作为我们的信号处理程序，即 **aioSigHandler**。当异步操作完成时它将被调用。信号处理程序应具有以下签名：\n\
  \n```\nvoid name(int number, siginfo_t* si, void* additional)\n```\n\n4. 第一个参数是信号号，第二个参数是包含信号生成原因信息的结构，最后一个参数是附加信息。它可以转换为\
  \ **ucontext_t** 结构的指针，以便我们接收被此信号中断的线程上下文。在 **aioSigHandler** 中，检查与异步 I/O 操作相关的信号是否使用\
  \ **SI_ASYNCIO** 为常量。如果是，则输出一条消息。接下来，将 **isDone** 设置为 **true**：\n\n```\nvoid\naioSigHandler(int\
  \ no, siginfo_t* si, void*)\n{\n    std::cout << \"Signo: \" << no << std::endl;\n\
  \    if (si->si_code == SI_ASYNCIO)\n    {\n        std::cout << \"I/O completion\
  \ signal received\" << std::endl;\n    }\n    isDone = true;\n}\n```\n\n5. 定义另一个帮助函数名为\
  \ **initSigAct**。它将初始化 **sigaction** 结构。此结构定义了在 I/O 操作完成时将发送哪个信号以及应调用哪个处理程序。这里，我们选择了\
  \ **SIGUSR1** – 一个用户定义的信号。在 **sa_flags** 中，设置我们希望此信号在操作重启或接收信息时被传递：\n\n```\nbool\n\
  initSigAct(struct sigaction& item)\n{\n    item.sa_flags = SA_RESTART | SA_SIGINFO;\n\
  \    item.sa_sigaction = aioSigHandler;\n```\n\n- 8. 创建一个名为 **fileName** 的变量，它保存一个名为\

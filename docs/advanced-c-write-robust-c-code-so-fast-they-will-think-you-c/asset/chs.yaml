  \n图 3.33：unique_ptr 中数组的管理\n\n15. 打开编辑器并找到 `testArrays()` 方法：\n\n```cpp\nvoid testArrays()\n\
  {\n    std::unique_ptr<int[]> board = std::make_unique<int[]>(8 * 8);\n\n    for\
  \ (int i = 0; i < 8; i++)\n        for (int j = 0; j < 8; j++)\n            board[i\
  \ * 8 + j] = 10 * (i + 1) + j + 1;\n\n    for (int i = 0; i < 8; i++)\n    {\n \
  \       char sep{' '};\n        for (int j = 0; j < 8; j++)\n            std::cout\

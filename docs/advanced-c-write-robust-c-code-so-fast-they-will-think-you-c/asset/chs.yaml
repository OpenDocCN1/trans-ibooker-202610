  \ `tests/SumFuncTest.cpp` 文件中进行以下更改：\n\n```\nTEST_F(SumFuncTest, CanSumCorrectly)\
  \ {\n    EXPECT_EQ(7, sum(3, 4));\n}\n\n// add this test\nTEST_F(SumFuncTest, CanSumAbsoluteValues)\
  \ {\n    EXPECT_EQ(6, sum(3, -3));\n}\n```\n\n注意，这个测试假设输入值的绝对值相加，但这是不正确的。此调用的结果是\
  \ 0，但在该示例中期望是 6。这是我们在项目中添加此测试所需做的唯一更改。\n\n6. 现在，构建项目并运行测试。你应该会看到以下报告：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_51_0.png)\n\
  \n如上图所示，前两个测试通过了，最后一个测试失败了。当我们看到这个输出时，有两种可能：要么我们的项目代码有误，要么测试有误。在这种情况下，我们的测试有误。这是因为我们的\
  \ `CanSumAbsoluteValues` 测试用例期望 6 等于 `sum(3, -3)`。这是因为我们假设该函数将提供的整数的绝对值相加。但事实并非如此。我们的函数只是简单地将给定的数字相加，无论它们是正数还是负数。因此，这个测试的假设有误，所以失败了。\n\
  \n7. 让我们修改测试并修正它。更改测试，使其期望 -3 和 3 的和为 0。重命名测试以反映该测试的实际功能：\n\n```\nTEST_F(SumFuncTest,\
  \ CanSumCorrectly) {\n    EXPECT_EQ(7, sum(3, 4));\n}\n```\n\n```\n// change this\
  \ part\nTEST_F(SumFuncTest, CanUseNegativeValues) {\n    EXPECT_EQ(0, sum(3, -3));\n\
  }\n```\n\n## 理解编译、链接和目标文件内容\n\n使用 C++ 的主要原因之一是效率。C++ 让我们能够控制内存管理，这就是为什么了解对象在内存中的布局方式很重要。此外，C++\
  \ 源文件和库会被编译为目标硬件对应的目标文件，然后链接在一起。C++ 程序员经常需要处理链接器问题，这就是为什么理解编译步骤并能调查目标文件很重要。另一方面，大型项目是由团队在很长一段时间内开发和维护的，因此编写干净且易于理解的代码非常重要。与其他任何软件一样，C++\
  \ 项目中也会出现错误，需要通过观察程序行为仔细地识别、分析和解决。因此，学习如何调试 C++ 代码也很重要。在下一节中，我们将学习如何编写高效、能与其他代码良好协作且易于维护的代码。\n\
  \n## 编译和链接步骤\n\n一个 C++ 项目由一组源代码文件和项目配置文件组成，这些文件组织源代码和库依赖关系。在编译步骤中，这些源文件首先被转换为目标文件。在链接步骤中，这些目标文件被链接在一起，形成项目最终输出的可执行文件。项目使用的库也会在此步骤中链接。\n\
  \n在接下来的练习中，我们将使用现有项目来观察编译和链接阶段。然后，我们将手动重新创建这些阶段，以便更详细地查看整个过程。\n\n### 练习 7：识别构建步骤\n\
  \n你一直在构建项目，但没有调查构建操作的细节。在本练习中，我们将调查项目构建步骤的详细信息。执行以下操作以完成练习：\n\n- 1. 打开终端。\n- 2.\
  \ 输入以下命令，导航到存放我们 **Makefile** 文件的 **build** 文件夹：\n\n```\ncd build/Debug\n```\n\n\
  3. 使用以下命令清理项目并以 VERBOSE 模式运行构建：\n\n```\nmake clean\nmake VERBOSE=1 all\n```\n\n\

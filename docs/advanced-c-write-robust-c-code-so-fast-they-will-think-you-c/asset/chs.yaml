  \ 方法使其如下所示：\n\n```\nconst_reference top() const\n{\n```\n\n指针可能指向静态变量、全局变量，或从堆分配的内存，以确保指向的对象在异常被处理时仍然存在。现在，我们已经解决了保持异常对象存活的问题。但当处理程序处理完它之后，捕获者会对其做什么呢？\n\
  \n异常的捕获者并不了解异常对象的创建方式（**global**、**static** 或 **heap**），因此它不知道是否应该删除接收到的指针。因此，通过指针抛出异常并不是推荐的抛出异常方法。\n\
  \n抛出的对象将被复制到创建的临时异常对象中并交给处理程序。当异常被处理后，临时对象将简单地被销毁，程序将继续执行。对其的处理没有任何歧义。因此，最佳实践是按\
  \ **值** 抛出异常。\n\n## 标准库异常\n\nC++ 标准库将 **std::exception** 定义为所有标准库异常的基类。标准定义了以下 **exceptions/errors**\
  \ 的第一级层次结构（括号中的数字表示从该类派生的异常数量）：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_235_0.png)\n\
  \n图 3.17：标准库异常层次结构（两级）\n\n这些异常在 C++ 标准库包括 STL 中使用。当创建自己的异常类时，最佳实践是从标准异常之一派生它。正如我们接下来将看到的，你的特殊异常可以被标准异常之一的处理程序捕获。\n\
  \n## 捕获异常\n\n在讨论异常的必要性时，我们介绍了抛出异常的想法，但并没有真正查看 C++ 如何支持捕获异常。异常处理过程从将一段代码包装在 try 块中开始，以将其置于异常检查之下。try\
  \ 块后面跟着一个或多个 catch 块，它们是异常处理程序。当在 try 块内部执行的代码发生异常情况时，会抛出异常，控制权转移到异常处理程序。如果没有抛出异常，则所有异常处理程序都会被跳过，try\
  \ 块中的代码完成，正常执行继续。让我们用代码片段表达这些概念：\n\n```\nvoid SomeFunction()\n{\n    try {\n   \
  \     // code under exception inspection\n    }\n    catch(myexception e)      \
  \  // first handler - catch by value\n    {\n        // some error handling steps\n\
  \    }\n    catch(std::exception* e)    // second handler - catch by pointer\n \
  \   {\n        // some other error handling steps\n    }\n    catch(std::runtime_error&\
  \ e) // third handler - catch by reference\n    {\n        // some other error handling\
  \ steps\n    }\n    catch(...)                  // default exception handler - catch\
  \ any exception\n    {\n        // some other error handling steps\n    }\n    //\
  \ Normal programming continues from here\n}\n```\n\n前面的片段显示了必要的关键字 – try 和 catch\
  \ 并介绍了三种不同的 catch 模式（不包括默认处理程序）：\n\n- **按值捕获异常**：这是一种昂贵的方法，因为异常处理程序像任何其他函数一样被处理。按值捕获意味着必须创建异常对象的副本然后传递给处理程序。第二个副本的创建减慢了异常处理过程。此类型也可能遭受对象切片，其中抛出子类，而\
  \ catch 子句是超类。catch 子句然后只会接收超类对象的副本，从而丢失原始异常对象的属性。因此，我们应避免按值捕获异常的处理程序。\n- **按指针捕获异常**：如在讨论按值抛出时所述，使用这种异常处理程序样式，只能捕获通过指针抛出的异常。由于我们只想按值抛出，因此应避免按指针捕获异常的处理程序。\n\
  - **按引用捕获异常**：这是推荐的异常处理程序样式，因为它不会遭受按值捕获和按指针捕获相关的问题。由于向处理程序传递的是引用，因此不会创建异常对象的第二个副本。切片不会发生，因为引用仍然引用最初抛出的异常对象。而且由于异常是按值抛出的，临时异常对象将在我们使用完它后自动销毁。\n\
  \n> **Note**\n> 处理异常时，应为 **throw-by-value** 和 **catch-by-reference**。\n\n当有多个 catch\
  \ 块时，异常对象类型用于按指定的顺序匹配处理程序。一旦找到匹配的处理程序，它将被执行，其余的异常处理程序将被忽略。这与函数解析不同，后者编译器会找到与参数的最佳匹配。因此，异常处理程序（catch\
  \ 块）应从更具体到更一般进行定义。例如，默认处理程序（**catch(...)**）应始终在定义中最后出现。\n\n\n\n\n\n### 练习 2：实现异常处理器\n\
  \n在本练习中，我们将实现一个异常处理器层次结构来管理异常的处理方式。按照以下步骤实现本练习：\n\n+   1. 在 Eclipse 中打开 **Lesson3**\
  \ 项目。然后在 **Project Explorer** 中展开 **Lesson3** 然后 **Exercise02** 并双击 **exceptions.cpp**\
  \ 以在编辑器中打开该练习的文件。此文件包含以下代码：\n\n```\n```cpp\n#include <exception>\n#include <iostream>\n\
  \nvoid run_exceptions()\n{\n    try\n    {\n        throw std::domain_error(\"We\
  \ got one!!!!\");\n    }\n    catch(...)\n    {\n        std::cout << \"Exception\
  \ caught by default handler\\n\";\n    }\n    catch(const std::exception& e)\n \
  \   {\n        std::cout << \"Exception '\" << e << \"' caught by std::exception\
  \ handler\\n\";\n    }\n    catch(const std::logic_error& e)\n    {\n        std::cout\
  \ << \"Exception '\" << e << \"' caught by std::logic_error handler\\n\";\n    }\n\
  \    catch(const std::domain_error& e)\n    {\n        std::cout << \"Exception\
  \ '\" << e << \"' caught by std::domain_error handler\\n\";\n    }\n}\n\nint main()\n\
  {\n    std::cout << \"\\n\\n------ Exercise 2 ------\\n\";\n    run_exceptions();\n\
  ```\n\n```\nstd::cout << \"Complete.\\n\";\nreturn 0;\n}\n```\n\n> **注意**\n> \n\

  \n  *图 6.7：执行练习 2 的结果*\n\n正如你所见，我们轻松地从一个文件中读写自定义格式的数据。我们创建了自己的自定义类型，使用 `std::ofstream`\
  \ 类将其写入文件，并检查所有内容都已成功写入。然后，我们使用 `std::ifstream` 类将这些数据从文件读取到自定义变量中，将其输出到控制台，并确保所有内容都被正确读取。通过这样做，我们学会了如何使用\
  \ I/O 标准库向文件读写数据。现在，让我们继续学习 I/O 库的内存部分。\n\n## 字符串 I/O 实现\n\nI/O 标准库不仅允许与文件等设备进行输入输出，还允许与内存进行输入输出，特别是与\
  \ `std::string` 对象。在这种情况下，字符串既可以是输入操作的源，也可以是输出操作的目标。在 `<sstream>` 头文件中，声明了管理字符串输入输出的流类。与文件流一样，它们也提供了实现\
  \ RAII 的接口——字符串在流创建时打开以供读取或写入，并在流销毁时关闭。它们在标准库中由以下类表示：`basic_stringbuf`（实现原始字符串接口）、`basic_istringstream`（用于输入操作）、`basic_ostringstream`（用于输出操作）以及\
  \ `basic_stringstream`（用于输入和输出操作）。标准库还为 `char` 和 `wchar_t` 类型提供了 typedef：`istringstream`、`ostringstream`\
  \ 和 `stringstream`，以及带有 `w` 前缀的宽字符版本。\n\n要创建 `std::istringstream` 类的对象，我们应该将初始字符串作为构造函数参数传递，或者稍后使用\
  \ `str()` 函数设置它：\n\n```cpp\nstd::string track(\"ABBA 1967 Vule\");\nstd::istringstream\
  \ iss(track);\n```\n\n或者，我们可以这样做：\n\n```cpp\nstd::string track(\"ABBA 1967 Vule\"\
  );\nstd::istringstream iss;\niss.str(track);\n```\n\n接下来，要从流中读取值，请使用右移运算符 `>>`，它为所有内置类型重载：\n\
  \n```cpp\nstd::string group;\nstd::string name;\nint year;\n\niss >> group >> year\
  \ >> name;\n```\n\n要创建 `std::ostringstream` 类的对象，我们只需声明一个该类型的变量：\n\n```cpp\nstd::ostringstream\
  \ oss;\n```\n\n接下来，要向字符串写入数据，请使用左移运算符 `<<`，它为所有内置类型重载：\n\n```cpp\nstd::string group(\"\
  ABBA\");\nstd::string name(\"Vule\");\nint year = 1967;\n```\n\n```cpp\noss << group\
  \ << std::endl\n    << name << std::endl\n    << year << std::endl;\n```\n\n要获取结果字符串，请使用\
  \ `str()` 函数：\n\n```cpp\nstd::cout << oss.str();\n```\n\n`std::stringstream` 对象是双向工作的，因此它既有默认构造函数，也有接受字符串的构造函数。我们可以通过声明该类型的变量来创建默认的\
  \ `std::stringstream` 对象，然后将其用于读取和写入：\n\n```cpp\nstd::stringstream ss;\nss << \"\
  45\";\nint count;\nss >> count;\n```\n\n此外，我们可以使用带有字符串参数的构造函数创建 `std::stringstream`。然后，我们可以像平常一样将其用于读取和写入：\n\
  \n```cpp\nstd::string employee(\"Alex Ismailow 26\");\nstd::stringstream ss(employee);\n\
  ```\n\n或者，我们可以创建一个默认的 `std::stringstream` 对象，并通过 `str()` 函数设置字符串来初始化它：\n\n```cpp\n\
  std::string employee(\"Charlz Buttler 26\");\nstd::stringstream ss;\nss.str(employee);\n\
  ```\n\n接下来，我们可以使用 `ss` 对象进行读取和写入：\n\n```cpp\nstd::string name;\nstd::string surname;\n\
  int age;\n```\n\n```cpp\nss >> name >> surname >> age;\n```\n\n我们还可以为这些类型的流应用打开模式。它们的功能与文件流类似，但略有不同。在处理字符串流时，`ios_base::binary`\
  \ 无关紧要，而 `ios_base::trunc` 会被忽略。因此，我们可以以四种模式打开任何字符串流：`ios_base::app`、`ios_base::ate`、`ios_base::in`\
  \ 和 `ios_base::out`。\n\n### 练习 3：创建替换字符串中单词的函数\n\n在这个练习中，我们将实现一个函数，该函数解析给定的字符串并将给定的单词替换为另一个单词。为了完成此练习，我们创建一个可调用类，它接受三个参数：原始字符串、要替换的单词和用于替换的单词。结果应返回新字符串。执行以下步骤以完成此练习：\n\
  \n- **1.** 包含所需的头文件：用于终端输出的 `<iostream>` 和用于字符串 I/O 支持的 `<sstream>`：\n\n  ```cpp\n\
  \  #include <sstream>\n  #include <iostream>\n  ```\n\n- **2.** 实现名为 `Replacer`\
  \ 的可调用类。它只有一个函数——一个重载的括号运算符 `()`，它返回一个字符串并接受三个参数：原始字符串、要替换的单词和用于替换的单词。函数声明如下所示：\n\
  \n  ```cpp\n  std::string operator()(const std::string& originalString,\n      const\
  \ std::string& wordToBeReplaced,\n      const std::string& wordReplaceBy);\n  ```\n\
  \n- **3.** 接下来，创建 `istringstream` 对象，即 `iss`，并将 `originalString` 变量设置为输入源：\n\n \
  \ ```cpp\n  std::istringstream iss(originalString);\n  ```\n\n- **4.** 创建 `ostringstream`\
  \ 对象，即 `oss`，它将保存转换后的字符串：\n\n  ```cpp\n  std::ostringstream oss;\n  ```\n\n- **5.**\
  \ 然后，在循环中，只要还能输入，就将下一个单词读入 `word` 变量。检查该单词是否等于 `wordToBeReplaced` 变量。如果是，则将其替换为\
  \ `wordReplaceBy` 变量并写入 `oss` 流。如果不等，则将原始单词写入 `oss` 流。在每个单词后添加一个空格字符，因为 `iss` 流会截断它们。最后，返回结果。完整的类如下：\n\
  \n  ```cpp\n  class Replacer\n  {\n  public:\n      std::string operator()(const\
  \ std::string& originalString,\n                              const std::string&\
  \ wordToBeReplaced,\n                              const std::string& wordReplaceBy)\n\
  \      {\n          std::istringstream iss(originalString);\n          std::ostringstream\
  \ oss;\n\n          std::string word;\n          while (iss >> word)\n         \
  \ {\n              if (0 == word.compare(wordToBeReplaced))\n              {\n \
  \                 oss << wordReplaceBy << \" \";\n              }\n            \
  \  else\n              {\n                  oss << word << \" \";\n            \
  \  }\n          }\n\n          return oss.str();\n      }\n  };\n  ```\n\n\n\n\n\
  \n6. 进入 main 函数。创建一个名为 worker 的 Replacer 类实例。定义 foodList 变量，并用一个包含食物列表的字符串对其进行初始化；其中一些条目应当重复。定义\
  \ changedList 字符串变量，并用 worker() 函数的返回值对其进行初始化。使用 std::cout 在终端中显示结果：\n\n```\nint\
  \ main()\n{\n    Replacer worker;\n\n    std::string foodList(\"coffee tomatoes\
  \ coffee cucumbers sugar\");\n    std::string changedList(worker(foodList, \"coffee\"\
  , \"chocolate\"));\n\n    std::cout << changedList;\n    return 0;\n}\n```\n\n7.\
  \ 编译、构建并运行该练习。结果将得到以下输出：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_433_0.png)\n\
  \n图 6.8：执行练习 3 的结果\n\n做得好！在这里，我们学会了如何使用字符串流来格式化输入和输出。我们创建了一个能够轻松替换句子中单词的应用程序，巩固了所学知识；现在，我们准备学习\
  \ I/O 操纵器，以进一步提高处理流的技能。\n\n## I/O 操纵器\n\n到目前为止，我们学习了使用流进行简单输入和输出的方法，但在许多情况下这还不够。为了实现更复杂的\
  \ I/O 数据格式化，标准库提供了大量的 I/O 操纵器。这些函数专门与移位运算符（左移 `<<` 和右移 `>>`）配合使用，以控制流的行为。I/O 操纵器分为两类——一类不带参数调用，另一类需要参数。其中一些同时适用于输入和输出。让我们简要了解一下它们的含义和用法。\n\
  \n### 用于更改流数值进制的 I/O 操纵器\n\n在 `<ios>` 头文件中，声明了用于更改流数值进制的函数：`std::dec`、`std::hex`\
  \ 和 `std::oct`。它们不带参数调用，分别将流的数值进制设置为十进制、十六进制和八进制。在 `<iomanip>` 头文件中，声明了 `std::setbase`\
  \ 函数，该函数使用以下参数调用：8、10 和 16。它们可以互换，并且既适用于输入操作也适用于输出操作。\n\n在 `<ios>` 头文件中，还有 `std::showbase`\
  \ 和 `std::noshowbase` 函数，它们控制着流数值进制的显示。它们只影响十六进制和八进制整数的输出（零值除外），以及货币的输入和输出操作。让我们完成一个练习，学习如何在实际中使用它们。\n\
  \n#### 练习 4：以不同数值进制显示输入的数字\n\n在本练习中，我们将开发一个应用程序，它在无限循环中要求用户以以下数值进制之一输入整数：十进制、十六进制或八进制。读取输入后，它会以其他数值表示形式显示该整数。要完成本练习，请执行以下步骤：\n\
  \n- 1. 包含 `<iostream>` 头文件以支持流式输入输出。声明一个名为 `BASE` 的枚举，并定义三个值：`DECIMAL`、`OCTAL` 和\
  \ `HEXADECIMAL`：\n\n```\n#include <iostream>\n\nenum BASE\n{\n    DECIMAL,\n   \
  \ OCTAL,\n    HEXADECIMAL\n};\n```\n\n2. 声明一个名为 displayInBases 的函数，该函数接受两个参数——整数和进制。接下来，定义\
  \ switch 语句，它测试接收到的数值进制，并以另外两种数值表示形式显示给定整数：\n\n```\nvoid displayInBases(const int\
  \ number, const BASE numberBase)\n{\n    switch(numberBase)\n    {\n    case DECIMAL:\n\
  \        std::cout << \"Your input in octal with base: \"\n                  <<\
  \ std::showbase << std::oct << number\n                  << \", without base: \"\
  \n                  << std::noshowbase << std::oct << number << std::endl;\n   \
  \     std::cout << \"Your input in hexadecimal with base: \"\n                 \
  \ << std::showbase << std::hex << number\n                  << \", without base:\
  \ \"\n                  << std::noshowbase << std::hex << number << std::endl;\n\
  \        break;\n    case OCTAL:\n        std::cout << \"Your input in hexadecimal\
  \ with base: \"\n                  << std::showbase << std::hex << number\n    \
  \              << \", without base: \"\n                  << std::noshowbase <<\
  \ std::hex << number << std::endl;\n        std::cout << \"Your input in decimal\
  \ with base: \"\n                  << std::showbase << std::dec << number\n    \
  \              << \", without base: \"\n                  << std::noshowbase <<\
  \ std::dec << number << std::endl;\n        break;\n    case HEXADECIMAL:\n    \
  \    std::cout << \"Your input in octal with base: \"\n                  << std::showbase\
  \ << std::oct << number\n                  << \", without base: \"\n           \
  \       << std::noshowbase << std::oct << number << std::endl;\n        std::cout\
  \ << \"Your input in decimal with base: \"\n                  << std::showbase <<\
  \ std::dec << number\n                  << \", without base: \"\n              \
  \    << std::noshowbase << std::dec << number << std::endl;\n        break;\n  \
  \  }\n}\n```\n\n3. 进入 **main** 函数，并定义一个用于读取用户输入的整数变量：\n\n```\nint integer;\n```\n\
  \n4. 创建一个无限 while 循环。在循环内，要求用户输入一个十进制值。将输入作为十进制整数读取。将其传递给 **displayInBases** 函数。接着，要求用户输入一个十六进制值。将输入作为十六进制整数读取。将其传递给\
  \ **displayInBases** 函数。最后，要求用户输入一个八进制值。将输入作为八进制整数读取。将其传递给 **displayInBases** 函数：\n\
  \n```\nint main(int argc, char **argv)\n{\n    int integer;\n\n    while(true)\n\
  \    {\n        std::cout << \"Enter the decimal value: \";\n        std::cin >>\
  \ std::dec >> integer;\n        displayInBases(integer, BASE::DECIMAL);\n\n    \
  \    std::cout << \"Enter the hexadecimal value: \";\n        std::cin >> std::hex\
  \ >> integer;\n        displayInBases(integer, BASE::HEXADECIMAL);\n\n        std::cout\
  \ << \"Enter the octal value: \";\n        std::cin >> std::oct >> integer;\n  \
  \      displayInBases(integer, BASE::OCTAL);\n    }\n\n    return 0;\n}\n```\n\n\
  5. 构建并运行应用程序。按照输出提示，以不同的数值表示形式输入，例如 12。输出应如下所示：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_437_0.png)\n\
  \n图 6.9：执行练习 4 第 1 部分的结果\n\n6. 现在，让我们将 `std::setbase()` 函数中的 `std::dec`、`std::oct`\
  \ 和 `std::hex` 替换掉，以检查输出是否相同。首先，添加 `<iomanip>` 头文件以支持 `std::setbase()`。接下来，在 main\
  \ 函数的循环中，将 `std::dec` 替换为 `std::setbase(10)`，将 `std::hex` 替换为 `std::setbase(16)`，将\
  \ `std::oct` 替换为 `std::setbase(8)`：\n\n```\nint main(int argc, char **argv)\n{\n\
  \    int integer;\n\n    while(true)\n    {\n        std::cout << \"Enter the decimal\
  \ value: \";\n        std::cin >> std::setbase(10) >> integer;\n        displayInBases(integer,\
  \ BASE::DECIMAL);\n\n        std::cout << \"Enter the hexadecimal value: \";\n \
  \       std::cin >> std::setbase(16) >> integer;\n        displayInBases(integer,\
  \ BASE::HEXADECIMAL);\n\n        std::cout << \"Enter the octal value: \";\n   \
  \     std::cin >> std::setbase(8) >> integer;\n        displayInBases(integer, BASE::OCTAL);\n\
  \    }\n\n    return 0;\n}\n```\n\n7. 再次构建并运行应用程序。按照输出提示，以不同的数值表示形式输入同一个整数（12）。输出应如下所示：\n\

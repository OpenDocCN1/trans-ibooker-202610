  \n## CMake 生成器表达式\n\n在使用 **CMake** 时，有时需要调整变量的值。**CMake** 是一个构建生成系统，可以为许多构建工具和编译器工具链生成构建文件。由于这种灵活性，如果你想在编译器中启用某个功能，只需将其应用于特定类型即可。这是因为不同厂商之间的命令行选项不同。例如，启用\
  \ g++ 编译器 C++17 支持的命令行选项是 **-std=c++17**，但对于 **msvc** 则是 **/std:c++17**。如果打开 **CMakeLists.txt**\
  \ 文件并定位 **L3Exercise2 add_executable**，则其后会有以下行：\n\n```\ntarget_compile_options(L3Exercise2\
  \ PRIVATE $<$<CXX_COMPILER_ID:GNU>:-fpermissive>)\n```\n\n这使用了 **$<CXX_COMPILER_ID:GNU>**\
  \ 变量查询来检查是否为 GCC 编译器。如果是，则生成 1（真），否则为 0（假）。它还使用了 **$<condition:true_string>** 条件表达式，仅为\
  \ **L3Exercise2** 目标的 gcc 编译器将 **-fpermissive** 添加到编译器选项中。这些可以为每种编译器类型分别通过对 **target_compile_options**\
  \ 的调用添加，也可以通过一次调用完成。\n\n> **注意**\n> \n> 有关生成器表达式的更多信息，请查看以下链接：https://cmake.org/cmake/help/v3.15/manual/cmake-generator-expressions.7.html。\n\
  \n## 异常使用指南\n\n在使用 C++ 代码中的异常时，请记住以下几点：\n\n+   - 原则：**按值抛出，按引用捕获**\n+   - **不要使用异常进行正常程序流程。**\
  \ 如果函数遇到异常条件且无法满足其（功能）义务，则仅在此时才抛出异常。如果函数可以解决异常条件并履行其义务，则这不是异常。它们被称为异常是有原因的，如果你不使用它们，就不会产生任何处理开销。\n\
  +   - **不要在析构函数中抛出异常。** 请记住，由于栈展开，局部变量析构函数将被执行。如果在栈展开过程中调用析构函数并抛出异常，则程序将终止。\n+ \
  \  - **不要吞掉异常。** 不要使用默认的 catch 处理器而不对异常做任何处理。异常被抛出是为了指示存在问题，你应该对此采取行动。忽略异常可能导致以后难以排查的故障。这是因为吞掉的异常会真正丢失任何有用的信息。\n\
  +   - **异常对象是从 throw 处复制的。**\n\n## 资源管理（在异常世界中）\n\n到目前为止，我们已经研究了局部变量作用域，以及当变量超出作用域时\
  \ `automatic` 和 `dynamic lifetime variables` 如何被处理 – 自动生命周期变量（放置在栈上的变量）会被完全析构，而\
  \ `dynamic lifetime variables`（由程序员分配到堆上的变量）不会被析构：我们只是丢失了对它们的访问。我们还看到，当抛出异常时，会找到最近匹配的处理程序，并且在抛出点和处理程序之间的所有局部变量都将通过栈展开过程被析构。\n\
  \n我们可以利用这一知识编写健壮的资源管理类，使我们无需跟踪资源（动态生命周期变量、文件句柄、系统句柄等），以确保在我们使用完后将其释放（归还）。用于在正常操作和异常情况下管理资源的技巧被称为\
  \ **资源获取即初始化（RAII）**。\n\n// 响应异常\n}\n}\n\n这段代码显示了资源管理存在的两个潜在问题：\n\n+   - 最重要的是，在打开和关闭文件之间发生异常会导致资源泄漏。如果这是系统资源，许多此类泄漏可能导致系统不稳定或应用程序性能受损，因为资源被耗尽。\n\
  +   - 此外，在一个方法中管理多个资源可能导致因错误处理而产生深层嵌套子句。这不利于代码的可读性，从而影响其理解和可维护性。很容易忘记释放资源，尤其是在存在多个退出点时。\n\
  \n那么，我们如何管理资源以获得异常安全且更简单的代码？这个问题并不独特于 C++，不同语言以不同方式处理它。Java、C# 和 Python 使用垃圾回收方法，在对象不再被引用时对其进行清理。但\
  \ C++ 没有垃圾回收，那么解决方案是什么？\n\n考虑以下类：\n\n```\nclass File {\npublic:\n    File(const\
  \ char* name, const char* access) {\n        m_file = fopen(name, access);\n   \
  \     if (m_file == nullptr) {\n            throw std::ios_base::failure(\"failed\
  \ to open file\");\n        }\n    }\n\n    ~File() {\n        fclose(m_file);\n\
  \    }\n\n    operator FILE*() {\n        return m_file;\n```\n\n\n\n\n\n```\n}\n\
  \nprivate:\n    FILE* m_file{};\n};\n```\n\n该类实现了以下特性：\n\n+   - 构造函数获取资源。\n+   -\
  \ 如果构造函数中未能获取资源，则抛出异常。\n+   - 当类被销毁时，释放资源。\n\n如果我们在 **do_something()** 方法中使用这个类，代码将如下所示：\n\
  \n```\nvoid do_something()\n{\n    try\n    {\n        File in(\"input.txt\", \"\
  r\");\n        File out(\"output.txt\", \"w\");\n\n        // Do some work\n   \
  \ }\n    catch(std::exception& e)\n    {\n        // Respond to the exception\n\
  \    }\n}\n```\n\n如果在执行此操作时发生异常，C++ 保证所有基于栈的对象都会调用其析构函数（**栈展开**），从而确保文件被关闭。这解决了因异常而发生资源泄漏的问题，因为资源现在会被自动清理。此外，这种方法非常易于阅读，我们无需担心错误处理就能理解逻辑流程。\n\
  \n该技术利用 File 对象的生命周期来获取和释放资源，确保资源不会泄漏。资源在管理类的构造（初始化）期间获取，并在管理类析构期间释放。正是这种作用域绑定资源的行为，催生了“资源获取即初始化”这一名称。\n\
  \n前面的示例处理的是作为系统资源的文件句柄的管理。它适用于任何需要在使用前获取、使用后释放的资源。RAII 技术可广泛应用于多种资源——打开的文件、打开的管道、分配的堆内存、打开的套接字、执行线程、数据库连接、互斥锁/临界区的锁定——基本上涵盖了宿主系统中稀缺且需要管理的任何资源。\n\
  \n### 练习 3：为内存和文件句柄实现 RAII\n\n在本练习中，我们将实现两个不同的类，使用 RAII 技术来管理内存或文件。请按照以下步骤完成本练习：\n\

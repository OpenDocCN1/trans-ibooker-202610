  \n现在你已经检查了构建过程的细节并自行重现了它们，在下一节中，让我们探索链接过程。\n\n## 链接步骤\n\n在本节中，让我们看一下两个源文件之间的连接以及它们如何最终进入同一个可执行文件。查看以下图中的\
  \ sum 函数：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_61_0.png)\n\n图 1.43：链接过程\n\
  \nsum 函数的函数体在 SumFunc.cpp 中定义。它在 SumFunc.h 中有前向声明。这样，想要使用 sum 函数的源文件就可以知道其签名。一旦它们知道签名，它们就可以调用它并信任实际的函数定义会在运行时存在，而无需与\
  \ SumFunc.cpp 产生任何实际交互，而函数就在那里定义。\n\n编译后，调用 sum 函数的 CxxTemplate.cpp 会将其调用带入其目标文件。仍然，它不知道函数定义在哪里。SumFunc.cpp\
  \ 的目标文件有该定义，但它与 CxxTemplate.o 尚无关系。\n\n在链接步骤中，链接器将 CxxTemplate.o 中的调用与 SumFunc.o\
  \ 中的定义匹配。因此，调用在可执行文件中正常工作。如果链接器找不到 sum 函数的定义，它将给出链接错误。\n\n链接器通过其名称和参数查找 sum 函数。这称为解析符号。对象文件中定义的类、函数和变量被放置在符号表中，每个符号的引用都通过在此表中的查找来解析。当符号不存在时，你会收到符号无法解析错误。\n\
  \n这带我们经历了构建过程的两个阶段：**编译**和**链接**。请注意，与我们手动编译源代码时相比，我们使用了更简单的命令。随时键入 `man g++` 以查看其中的所有选项。后来，我们讨论了链接以及如何解析符号。我们还谈到了链接步骤中可能出现的问题。在下一节中，我们将学习有关对象文件的内容。\n\
  \n## 深入：查看对象文件\n\n为了使链接步骤无错误地工作，我们需要使所有符号引用与符号定义匹配。大多数时候，我们只需查看源文件就可以分析事物将如何被解析。有时，在复杂的情况下，我们可能很难理解为什么某个符号无法被解析。在这种情况下，查看对象文件的内容以调查引用和定义可能有助于解决问题。除了链接错误之外，了解对象文件内容以及链接的一般工作原理对\
  \ C++ 程序员也很有用。了解幕后发生的事情可以帮助程序员更好地理解整个过程。\n\n当我们的源代码编译为对象文件时，我们的语句和表达式会被转换为汇编代码，即\
  \ CPU 理解的低级语言。汇编中的每条指令都包含一个操作，后跟操作数，它们是 CPU 的寄存器。有指令将数据加载到寄存器中、从寄存器中加载数据以及对寄存器中的值进行操作。Linux\
  \ 中的 `objdump` 命令可以帮助我们查看这些对象文件的内容。\n\n> **注意**\n> \n> 我们将使用 Compiler Explorer，这是一个更易于使用的在线工具，你可以在左侧窗口编写代码，右侧可以看到编译后的汇编代码。以下是\
  \ Compiler Explorer 的链接：https://godbolt.org。\n\n虽然不是很清楚，但你或多或少可以看出它在做什么。我们不会深入汇编代码的细节，但我们将重点关注链接器阶段期间如何解析符号。现在让我们关注以下几行：\n\
  \n```\nsum(int, int):\n```\n\n```\n...\n```\n\n```\ncallSum():\n```\n\n```\n...\n\
  \    call  sum(int, int)\n```\n\n```\n...\n```\n\n**call sum(int, int)** 行按预期执行：它调用前面的\
  \ **sum** 函数并将参数放在某些寄存器中。这里的重要一点是，函数通过其名称及其参数的类型按顺序标识。链接器会查找具有此签名的适当函数。请注意，返回值不是签名的一部分。\n\

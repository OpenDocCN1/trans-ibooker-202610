  > **注意**\n>\n> 此活动的解决方案位于第 681 页。\n\n## 总结\n\n在本章中，我们学习了如何使用 C++ 标准库所支持的线程。这是编写健壮、快速且清晰的多线程应用程序的基础。\n\
  \n我们首先了解了与并发相关的一般概念——并行执行、并发执行、同步执行、异步执行和线程执行分别是什么。清楚地理解这些概念，有助于我们理解多线程应用程序的架构设计。\n\
  \n接下来，我们研究了开发多线程应用程序时遇到的各种问题，例如数据危险、竞态条件和死锁。理解这些问题有助于我们为项目构建清晰的同步架构。我们结合一些现实生活中的例子研究了同步概念，从而更好地理解编写线程应用程序时可能面临的挑战。\n\
  \n随后，我们尝试使用标准库中不同的同步原语。我们尝试了解如何处理竞态条件，并实现了基于事件的同步和基于数据的同步示例。接下来，我们讨论了移动语义如何应用于多线程。我们学习了线程支持库中的哪些类不可复制但可以移动。我们还研究了移动语义在多线程闭包中的工作方式。最后，我们学习了如何从独立线程接收结果，以及如何使用\
  \ future、promise 和 async 同步线程。\n\n我们通过构建艺术画廊模拟器，将所有这些新技能付诸实践。我们构建了一个包含一个主线程和四个子线程的多线程应用程序。我们使用条件变量实现了它们之间的通信，并使用互斥锁保护共享数据。总之，我们运用了本章中学到的所有知识。\n\
  \n下一章，我们将更深入地了解 C++ 中的 I/O 操作和类。我们将首先研究标准库提供的 I/O 支持。然后，我们将继续学习流和异步 I/O 操作。接下来，我们将了解线程与\
  \ I/O 之间的交互。我们还将编写一个活动，帮助我们掌握在 C++ 中进行 I/O 操作的技能。\n"
- "# 6. 流与 I/O\n\n## 学习目标\n\n完成本章后，你将能够：\n\n- 使用标准 I/O 库向文件或控制台写入数据，以及从文件或控制台读取数据\n\
  - 使用内存 I/O 接口格式化和解析数据\n- 为用户定义类型扩展标准 I/O 流\n- 开发使用多线程标准 I/O 库的应用程序\n\n在本章中，我们将使用标准\
  \ I/O 库开发灵活且易于维护的应用程序，学习如何使用流，了解 I/O 库如何应用于多线程应用程序，并最终学习如何使用标准库格式化和解析数据。\n\n## 简介\n\
  \n在上一章中，我们介绍了 C++ 中最具挑战性的主题之一——并发。我们研究了多线程的主要概念，并区分了 C++ 中的同步执行、异步执行和线程执行。我们学习了同步、数据危险和竞态条件的关键知识。最后，我们研究了如何在现代\
  \ C++ 中使用线程。在本章中，我们将进一步深入，学习如何在多线程应用程序中处理 I/O。\n\n本章专门介绍 C++ 中的**流**和 **I/O**。I/O\
  \ 是输入和输出操作的统称。标准库这一部分的主要目的是提供清晰的数据输入和输出接口。但这并不是唯一的目标。在许多情况下，I/O 都能帮助我们开发应用程序。很难想象有什么应用程序不会将错误或异常情况写入日志文件，以便发送给开发团队进行分析。在\
  \ GUI 应用程序中，我们经常需要格式化显示的信息或解析用户输入。在复杂且大型的应用程序中，我们通常需要记录内部数据结构，等等。在所有这些情况下，我们都会使用**标准库**中的\
  \ I/O 部分。\n\n我们将以标准库输入/输出部分的简要介绍开始本章。我们将了解 I/O 并探索其主要概念和术语。然后，我们将研究默认支持哪些类型，以及如何为用户定义类型扩展流。接下来，我们将学习\
  \ I/O 库的结构，并检查可供我们使用的头文件和类。最后，我们将研究如何使用流、读写文件、创建执行输入和输出操作的多线程应用程序，以及如何格式化和解析文本数据。\n\
  \n本章将以一个具有挑战性且令人兴奋的活动作为结尾。在该活动中，我们将改进上一章中的**艺术画廊模拟器**项目，并创建一个健壮、清晰、多线程且易于使用的**日志记录器**。我们将开发一个具有清晰接口的类，使项目中的任何位置都能访问它。接下来，我们将调整它，使其能够与多个线程协同工作。最后，我们将把这个健壮的日志记录器集成到艺术画廊模拟器项目中。\n\
  \n让我们首先了解 C++ 标准库中的 I/O 部分，学习这组工具为我们提供了哪些机会。\n\n### 复习标准库的 I/O 部分\n\n在计算机科学中，I/O\
  \ 是指程序、设备、计算机等之间通信的术语。在 C++ 中，我们使用标准输入和标准输出这两个术语来描述 I/O 过程。标准输入是传入程序的数据流。为了获取这些数据，程序应执行读取操作。标准输出是从程序传输到外部设备的数据流，例如文件、显示器、套接字、打印机等。为了输出这些数据，程序应执行写入操作。标准输入流和标准输出流继承自主进程，并且所有子线程共享这些流。请查看下图，以便更好地理解上述术语：\n\
  \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_415_0.png)\n\n*显示器、打印机、程序、键盘、文件*\n\n\
  **图 6.1：设备之间的 I/O 通信**\n\n在 C++ 标准库中，大多数 I/O 类都是通用的类模板。它们在逻辑上分为两类——抽象和实现。我们已经熟悉抽象类，并且知道可以将它们用于不同目的，而无需重新编译代码。I/O\
  \ 库也是如此。在这里，有六个抽象类构成了 C++ 中 I/O 操作的基础。我们不会深入探讨这些接口。通常，我们会使用更高级别的类来执行操作，只有在需要实现自己的派生类时才会使用这些接口。\n\
  \n\n\n\n\n**ios_base** 抽象类负责管理流状态标志、格式化标志、回调以及私有存储。**basic_streambuf** 抽象类为缓冲输入或输出操作提供接口，并提供对输入源（如文件、套接字）或输出接收端（如字符串或向量）的访问。**basic_ios**\
  \ 抽象类实现了与派生自 **basic_streambuf** 接口的派生类协同工作的设施。**basic_ostream**、**basic_istream**\
  \ 和 **basic_iostream** 抽象类是派生自 **basic_streambuf** 接口的派生类的包装器，分别提供高级输入/输出接口。让我们简要地考虑它们及其关系，如下图所示类图所示。你可以看到，除了\
  \ **ios_base** 之外，它们都是模板类。在每个类的名称下，你可以找到定义该类的文件名：\n\n> **注意**\n>\n> 在 UML 记法中，我们使用\
  \ <<interface>> 关键字来表示该类是一个抽象类。\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_416_0.png)\n\
  \n**图 6.2：** I/O 抽象接口的类图\n\n实现类在逻辑上分为以下几类：**文件 I/O**、**字符串 I/O**、**同步 I/O**、**I/O\
  \ 操作符**，以及预定义的标准流对象。它们都派生自上述提到的抽象类。让我们在接下来的章节中详细考虑它们。\n\n## 预定义的标准流对象\n\n我们将从已经熟悉的来自\
  \ `<iostream>` 头文件的 **std::cout** 类开始认识 I/O 标准库。我们用它向终端输出数据。你可能也知道用于读取用户输入的 **std::cin**\
  \ 类——但并非每个人都知道 **std::cout** 和 **std::cin** 是预定义的标准流对象，用于格式化向终端的输入和输出。`<iostream>`\
  \ 头文件还包含 **std::cerr** 和 **std::clog** 流对象，用于记录错误。像往常一样，还有它们用于宽字符的类似物，带有 \"w\" 前缀：**wcout**、**wcin**、**wcerr**\
  \ 和 **wclog**。所有这些对象都在系统启动时自动创建并初始化。虽然可以安全地从多个线程使用这些对象，但输出可能会混合。让我们回顾一下如何使用它们。由于它们仅为内置类型重载，我们应该为用户定义的类型编写自己的重载。\n\
  \n**std::cout** 流对象经常与 **std::endl** 操作符一起使用。它在输出序列中插入换行字符并刷新它。以下是使用它们的示例：\n\n```\n\
  std::string name(\"Marilyn Monroe\");\n\nint age = 18;\n\nstd::cout << \"Name: \"\
  \ << name << \", age: \" << age << std::endl;\n```\n\n最初，**std::cin** 对象逐字符读取所有输入字符序列。但它为内置类型提供了重载，可以读取诸如\
  \ **数字**、**字符串**、**字符** 等值。读取字符串时有一个小技巧；**std::cin** 读取字符串直到下一个空白或换行符。因此，如果你需要它读取一个字符串，你必须在循环中读取它，逐词读取，或使用\
  \ **std::getline()** 函数，该函数将 **std::cin** 对象作为第一个参数，目标字符串作为第二个参数。\n\n> **注意**\n\
  >\n> **std::cin** 流对象的右移运算符 `>>` 仅从一行中读取一个词。使用 **std::getline(std::cin, str)** 来读取整行。\n\
  \n以下是使用 **std::cin** 处理不同类型的示例：\n\n```\nstd::string name;\nstd::string sex;\nint\
  \ age;\n\nstd::cout << \"Enter your name: \" << std::endl;\nstd::getline(std::cin,\
  \ name);\nstd::cout << \"Enter your age: \" << std::endl;\nstd::cin >> age;\nstd::cout\
  \ << \"Enter your sex (male, female):\" << std::endl;\nstd::cin >> sex;\nstd::cout\
  \ << \"Your name is \" << name << \", your age is \" << age << \", your sex is \"\
  \ << sex << std::endl;\n```\n\n正如你所见，这里，我们使用 **std::getline()** 函数读取姓名，因为用户可以输入两个或三个词。我们还使用右移运算符\
  \ **>>** 读取年龄然后读取性别，因为我们只需要读取一个词。然后我们将读取的数据打印出来以确保一切顺利。\n\n**std::cerr** 和 **std::clog**\
  \ 流对象只有一点不同——**std::cerr** 立即刷新输出序列，而 **std::clog** 缓冲它，仅在缓冲区满时才刷新。就使用而言，它们与 **std::cout**\
  \ 非常相似。唯一的区别是 **std::cerr** 和 **std::clog** 的消息在大多数 IDE 中颜色为红色。\n\n在下面的屏幕截图中，你可以看到这些流对象的输出：\n\
  \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_418_0.png)\n\n**图 6.3：** std::cerr 和\
  \ std::clog 流对象的输出\n\n现在，让我们做一个练习来巩固我们所学的一切。\n\n### 练习 1：为用户定义类型重载左移运算符，<<\n\n在这个练习中，我们将编写一段非常有用的代码，你可以在任何地方使用它来输出用户定义的类型。首先，我们将创建一个名为\

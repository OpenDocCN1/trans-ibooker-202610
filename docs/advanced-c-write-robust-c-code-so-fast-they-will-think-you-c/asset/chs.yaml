  \ 页找到。\n\n## 总结\n\n在本章中，我们实现了一种数据和方法隐藏的设计方法——PIMPL，它还有一个额外的好处，即减少依赖并缩短构建时间。随后，我们以自定义类的形式直接实现了函数对象，之后又以\

  ## 断点、监视点和数据可视化\n\n在上一节中，我们讨论了单元测试需要在开发人员将代码检入到仓库分支之前完成，并且可以让其他团队成员看到，以便他们能够将其与其他模块集成。尽管单元测试完成得很好，开发人员也检入了代码，但在代码被集成且\
  \ QA 团队开始测试时，仍然有可能在代码中发现错误。通常，在这种情况下，错误可能在一个模块中被抛出，而这可能是由于另一个模块中的更改引起的。团队可能很难找到此类问题的真正原因。在这种情况下，调试就应运而生了。它确切地告诉我们代码的行为方式，开发人员可以获得代码执行的详细信息。开发人员可以看到函数接收了什么参数以及它返回了什么值。它可以确切地告诉变量或指针被赋了什么值，或者内存中的内容是什么。这对开发人员识别问题出在代码的哪个部分非常有帮助。在下一节中，我们将实现一个栈并对其执行一些操作。\n\
  \n\n\n\n\n## 使用栈数据结构\n\n假设有一个场景，开发人员被要求开发自己的栈结构，该结构可以接受任何参数。在这里，栈结构必须遵循后进先出（LIFO）原则，元素彼此堆叠，当它们从栈中移除时，最后一个元素应先被移除。它应具有以下函数：\n\
  \n- **push()** 将新元素置于栈顶\n- **top()** 显示栈顶元素（如果有）\n- **pop()** 从栈中移除最后插入的元素\n- **is_empty()**\
  \ 检查栈是否为空\n- **size()** 显示栈中元素的数量\n- **clean()** 如果栈中有元素则清空栈\n\n以下代码行展示了如何在 **Stack.h**\
  \ 头文件中包含必要的库：\n\n```\n#ifndef STACK_H__\n#define STACK_H__\n#include<iostream>\n\
  using namespace std;\n```\n\n正如我们所知，栈由各种操作组成。为了定义这些函数，我们将编写以下代码：\n\n```\ntemplate<typename\
  \ T>\nstruct Node{\n    T element;\n    Node<T> *next;\n};\n\ntemplate<typename\
  \ T>\nclass Stack{\n    Node<T> *head;\n    int sz;\n\npublic :\n    Stack():head(nullptr),\
  \ sz(0){}\n    ~Stack();\n\n    bool is_empty();\n    int size();\n    T top();\n\
  \    void pop();\n    void push(T);\n    void clean();\n};\n\ntemplate<typename\
  \ T>\nStack<T>::~Stack(){\n    if ( head ) clean();\n}\n\ntemplate<typename T>\n\
  void Stack<T>::clean(){\n    Node<T> *tmp;\n    while( head ){\n        tmp = head;\n\
  \        head = head -> next;\n        delete tmp;\n        sz--;\n    }\n}\n\n\
  template<typename T>\nint Stack<T>::size(){\n    return sz;\n}\n\ntemplate<typename\
  \ T>\nbool Stack<T>::is_empty(){\n    return (head == nullptr) ? true : false;\n\
  }\n```\n\n```\ntemplate<typename T>\nT Stack<T>::top(){\n    if ( head == nullptr){\n\
  \        // throw error ...\n        throw(string(\"Cannot see top of empty stack\"\
  ));\n    }else {\n        return head -> element;\n    }\n}\n\ntemplate<typename\
  \ T>\nvoid Stack<T>::pop(){\n    if ( head == nullptr ){\n        // throw error\n\
  \        throw(string(\"Cannot pop empty stack\"));\n    }else {\n        Node<T>\
  \ *tmp = head ;\n        head = head -> next;\n        delete tmp;\n        sz--;\n\
  \    }\n}\n\ntemplate<typename T>\nvoid Stack<T>::push(T val){\n    Node<T> *tmp\
  \ = new Node<T>();\n    tmp -> element = val;\n    tmp -> next = head;\n    head\
  \ = tmp;\n    sz++;\n}\n\n// Miscellaneous functions for stack..\ntemplate<typename\
  \ T>\nvoid displayStackStats(Stack<T> st){\n    cout << endl << \"--------------------------------\"\
  \ << endl;\n    cout << \"Showing Stack basic Stats ...  \" << endl;\n    cout <<\
  \ \"Stack is empty : \" << (st.is_empty() ? \"true\" : \"false\") << endl;\n   \
  \ cout << \"Stack size :\" << st.size() << endl;\n    cout << \"-----------------------------\"\
  \ << endl << endl;\n}\n\n#endif\n```\n\n到目前为止，我们已经看到了如何使用单链表实现栈。每当在 Stack 中调用 push\
  \ 时，都会创建一个具有给定值的新元素并附加到栈的开头。我们称之为 head 成员变量，head 将指向栈中的下一个元素，依此类推。当调用 pop 时，head\
  \ 将从栈中移除并指向栈的下一个元素。\n\n让我们在 Main.cpp 文件中编写之前创建的 Stack 的实现。main 函数包含一个 try 块，该块创建了一个整数栈和一个字符栈。对两者都进行了几次\
  \ push 和 pop 操作，中间调用栈顶以显示最新元素。对于整数栈，开始时有三次 push：22、426 和 57。当调用 displayStackStats()\
  \ 函数时，它应将栈的大小声明为 3。然后，我们从栈中弹出 57，栈顶元素必须显示为 426。我们将对字符栈执行相同的操作。以下是栈的完整实现：\n\n```\n\
  #include \"Stack.h\"\nint main(){\n    try {\n        Stack<int> si;\n        displayStackStats<int>(si);\n\
  \        si.push(22);\n        si.push(426);\n        cout << \"Top of stack contains\
  \ \" << si.top() << endl;\n        si.push(57);\n        displayStackStats<int>(si);\n\
  ```\n\n前面的命令生成以下输出：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_537_0.png)\n\n图\
  \ 7.15：使用 Stack 类的 main 函数\n\n在前面的输出中，第二次调用统计函数时的红色墨水显示了 int 栈中包含三个元素的正确信息。然而，int\
  \ 栈顶的红色墨水调用显示了随机或垃圾值。如果再次运行程序，它将显示其他随机数字，而不是预期的 57 和 426 的值。同样，对于字符栈，用红色墨水突出显示的部分，即字符栈顶，显示了垃圾值而不是预期值，即\
  \ “I”。后来，执行显示了 double free or corruption 的错误，这意味着 free 被再次调用到同一个内存位置。最后，可执行文件导致了\
  \ core dump。程序没有按预期执行，并且从显示中可能不清楚实际错误所在。为了调试 Main，我们将编写以下命令：\n\n```\ngdb ./Main\n\
  ```\n\n前面的命令生成以下输出：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_538_0.png)\n\n图\
  \ 7.16：调试器显示 – I\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_541_0.png)\n\n图 7.18：调试器显示\
  \ – III\n\n按 Enter 后，你会看到 displayStackStats 在第 11 行被调用。在 Main.cpp 程序中，下一个命令显示栈顶元素，该命令在第\
  \ 12 行被调用。然而，显示的值为 0，而不是预期的 57 值。这是一个我们仍无法弄清楚的错误——值是如何改变的？然而，很明显，值可能在 main 函数的前几次调用中发生了变化。所以，这可能不会让我们对继续调试感兴趣。然而，我们需要继续并从头开始调试。\n\
  \n以下屏幕截图显示了用于调试代码的命令：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_542_0.png)\n\n\
  图 7.19：调试器显示 - IV\n\n要从头重新运行程序，我们必须按 r，并为确认和继续按 y，这意味着我们从头重新运行程序。它会要求确认；按 y 继续。所有这些命令在前面的屏幕截图中以蓝色突出显示。在第\
  \ 7 行执行时，我们需要运行 'display *si.head' 命令，这将在执行每条语句后持续显示 si.head 内存位置的内容。如红色墨水所示，在将\
  \ 22 压入栈后，head 会更新为正确的值。同样，对于值 426 和 57，当使用 push 插入到栈中时，对 head 的调用也会正确更新。\n\n后来，当调用\
  \ **displayStackStats** 时，它显示了正确的 **size** 为 3。但当调用 top 命令时，head 中显示的值错误。这在红色墨水中突出显示。现在，top\
  \ 命令的代码不会改变 head 的值，所以很明显，错误发生在执行的上一条语句中，即在 **displayStackStats** 处。\n\n因此，我们已经缩小了可能存在问题的代码范围。我们可以运行调试器指向\
  \ **displayStackStats** 并进入 **displayStackStats** 以找到导致 Stack 中的值被更改的原因。以下是同一屏幕截图，其中用户需要从头开始调试器：\n\
  \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_543_0.png)\n\n图 7.20：调试器显示 – IV\n\n从头重新启动调试器并来到第\
  \ 11 行执行点处调用 `displayStackStats` 时，我们需要逐步进入。流程是进入 `displayStackStats` 函数的开始处。并且我们需要执行下一条语句。由于函数中的初始检查是清晰的，它们不会改变\
  \ head 的值，我们可以按 Enter 执行下一步。当我们怀疑下一步可能会改变我们正在查找的变量的值时，我们需要逐步进入。这在前面的快照中以红色突出显示。随后的执行来到第\
  \ 97 行，即 `displayStackStats` 函数的最后一行。\n\n在输入 s 后，执行移动到 Stack 的析构函数并在第 81 行调用 clean\
  \ 函数。此 clean 命令删除 `tmp` 变量，其值与 head 相同。该函数清空了栈，而这本不应该运行。调用和执行 `displayStackStats`\
  \ 函数本应最终返回到 main 函数。但由于函数中超出作用域的局部变量，可能会调用析构函数。在这里，局部变量是作为参数声明给 `displayStackStats`\
  \ 函数的变量，在第 92 行。当调用 `displayStackStats` 函数时，main 函数中的 `si` 变量的本地副本被创建。当该变量超出作用域时，它调用了\
  \ Stack 的析构函数。现在，`si` 变量的指针已被复制到临时变量，并在最后错误地删除了指针。这不是开发者的意图。因此，在代码执行结束时，报告了 double\
  \ free 错误。`si` 变量必须在超出作用域时调用 Stack 析构函数，因为它将再次尝试释放相同的内存。为了解决这个问题，很明显，`displayStackStats`\
  \ 函数必须作为引用传递参数调用。为此，我们必须更新 `Stack.h` 文件中 `displayStackStats` 函数的代码：\n\n```\ntemplate<typename\
  \ T>\n\nvoid displayStackStats(Stack<T> &st){\n    cout << endl << \"------------------------------\"\
  \ << endl;\n\n    cout << \"Showing Stack basic Stats ...  \" << endl;\n\n    cout\
  \ << \"Stack is empty : \" << (st.is_empty() ? \"true\" : \"false\") << endl;\n\n\
  \    cout << \"Stack size :\" << st.size() << endl;\n\n    cout << \"------------------------------\"\
  \ << endl << endl;\n}\n```\n\n现在，当我们保存并编译 **Main.cpp** 文件时，二进制文件将被生成：\n\n```\n./Main\n\
  ```\n\n\n\n上述命令将在终端中生成以下输出：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_545_0.png)\n\
  \n图7.21：调试器显示 – IV\n\n从前面的截图中，我们可以看到期望值57和426显示在堆栈顶部。`displayStackStats`函数还能够正确显示`int`类型和`char`类型栈的信息。最后，我们使用调试器定位并修复了错误。在下一节中，我们将解决一个活动，其中我们将开发用于解析文件的函数，并编写测试用例来检查这些函数的准确性。\n\
  \n### 活动1：使用测试用例检查函数的准确性并理解测试驱动开发（TDD）\n\n在本活动中，我们将开发函数来解析文件，然后编写测试用例以检查所开发函数的正确性。\n\

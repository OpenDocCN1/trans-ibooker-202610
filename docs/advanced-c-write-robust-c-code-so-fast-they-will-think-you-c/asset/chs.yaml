  \ 最终会为字符串分配一个新的缓冲区并复制内容。我们如何消除这个 push_back() 调用？我们在末尾附加了一个空格，以便能够一致地统计最后一个单词（如果有的话），因为我们的算法统计的是单词的结尾。有三种方法可以避免这种情况：统计单词的开头而不是结尾；单独统计最后一个单词（如果有的话）；以及使用\
  \ c_str() 函数，这样末尾就会有一个 NUL 字符。现在让我们依次尝试每一种方法。\n\n- 17. 首先，编写不使用 push_back 的 main\

  \n**图 1.46：编译版本**\n\n调试器是处理运行时错误的更好工具。调试器可以让你逐行运行代码，继续运行并在想要的行上暂停，调查内存的值，并在错误时暂停，等等。这让你可以观察程序运行时内存中到底发生了什么，并识别导致不需要行为的代码行。\n\
  \ngdb 是可以调试 C++ 程序的经典命令行调试器。然而，使用起来可能很困难，因为调试本质上是一个视觉任务——你希望能够同时查看代码行、变量值和程序输出。幸运的是，Eclipse\

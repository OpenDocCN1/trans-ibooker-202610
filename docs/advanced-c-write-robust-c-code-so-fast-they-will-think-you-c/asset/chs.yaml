  \n1. 定义并实现 `Person` 类，该类除了打印日志外不执行任何操作。\n2. 创建一个线程安全的 `Person` 存储结构，对 `std::vector`\
  \ 类进行封装。\n3. 实现 `PersonGenerator` 类，使其在不同线程中的无限循环内创建和移除访客，并通知 `Watchman` 类。\n4.\
  \ 创建 `Watchman` 类，使其在独立线程中的无限循环内，在收到 `PersonGenerator` 类的通知后，将访客从一个队列移动到另一个队列。\n\

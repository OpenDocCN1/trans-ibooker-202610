  \ Snippet4.cpp 代码的输出\n\n通过使用 **reserve()** 方法，我们可以避免这些多次分配和复制。当我们知道一个向量将包含多少元素时，调用\
  \ **reserve()** 方法预分配存储空间会产生很大的不同。让我们在下一节中实现一个练习来优化向量的增长。\n\n### 练习 7：优化向量增长\n\n\
  在本练习中，我们将分别对循环中调用和不调用 reserve 方法时的 **push_back** 方法进行计时。首先，我们将把前面章节中使用的 **Timer**\
  \ 类提取到一个单独的头文件和实现文件中——这样我们就可以将它作为所有后续代码片段的公共代码来使用。执行以下步骤完成本练习：\n\n- 1. 创建一个名为 **Timer.h**\
  \ 的头文件。\n- 2. 包含必要的头文件：\n\n```\n#include <map>\n#include <string>\n#include <chrono>\n\
  #include <cstdint>\n```\n\n- 3. 创建一个名为 **Timer** 的类。在 **Timer** 类中，声明四个变量，即 **ms_Counts**、**ms_Times**、**m_tmStart**\
  \ 和 **m_sName**。声明构造函数、析构函数和 **dump()** 方法。添加以下代码来实现这一点：\n\n```\nclass Timer\n{\n\
  \    static std::map<std::string, int64_t> ms_Counts;\n    static std::map<std::string,\
  \ int64_t> ms_Times;\n    std::string m_sName;\n    std::chrono::time_point<std::chrono::high_resolution_clock>\
  \ m_tmStart;\npublic:\n    // When constructed, save the name and current clock\
  \ time\n    Timer(std::string sName);\n    // When destroyed, add the time elapsed\
  \ and also increment the count under this name\n    ~Timer();\n    // Print out\
  \ the stats for each measured block/function\n    static void dump();\n};\n```\n\
  \n\n+   4. 定义一个名为 **TIME_IT** 的辅助宏，用于对函数计时，编写以下代码：\n\n```\n```cpp\n// Helper macro\
  \ to time functions\n#define TIME_IT Timer t(__func__)\n```\n```\n\n+   5. 创建头文件后，新建一个名为\
  \ **Timer.cpp** 的文件，并在其中包含 **Timer.h** 文件。同时，在 **Timer.cpp** 文件中为构造函数、析构函数和 `dump()`\
  \ 方法编写实际实现。编写以下代码来实现：\n\n```\n```cpp\n#include <string>\n#include <iostream>\n#include\
  \ <cstdint>\n#include \"Timer.h\"\n\nusing std::map;\nusing std::string;\nusing\
  \ std::cerr;\nusing std::endl;\n\n// When constructed, save the name and current\
  \ clock time\nTimer::Timer(string sName): m_sName(sName)\n{\n    m_tmStart = std::chrono::high_resolution_clock::now();\n\
  }\n// When destroyed, add the time elapsed and also increment the count under\n\
  // this name\nTimer::~Timer()\n{\n    auto tmNow = std::chrono::high_resolution_clock::now();\n\
  \    auto msElapsed = std::chrono::duration_cast<std::chrono::milliseconds>(tmNow\
  \ - m_tmStart);\n    ms_Counts[m_sName]++;\n    ms_Times[m_sName] += msElapsed.count();\n\
  }\n// Print out the stats for each measured block/function\nvoid Timer::dump()\n\
  {\n    cerr << \"Name\\t\\t\\tCount\\t\\t\\tTime(ms)\\t\\tAverage(ms)\\n\";\n  \
  \  cerr << \"-------------------------------------------------------------\\n\"\
  ;\n    for(const auto& it: ms_Times)\n```\n\n正如我们所看到的，调用 **reserve()** 的效果使得执行时间提升了约\
  \ 4%。在长时间运行的大型程序中，系统内存常常变得非常碎片化。在这种情况下，通过 **reserve()** 预分配内存所带来的改进可能会更好。一般来说，预先保留内存通常比在运行时逐步分配更快。即使是\
  \ Java 虚拟机，出于性能原因，也会在启动时预先分配一大块内存。\n\n## 短路逻辑运算符\n\n&& 和 || 逻辑运算符是**短路**的，这意味着：\n\
  \n- 如果 || 运算符左侧为 **true**，则不计算右侧。\n- 如果 && 运算符左侧为 **false**，则不计算右侧。\n\n通过把更不可能成立（或开销更小）的表达式放在左侧，我们可以减少需要完成的工作量。在下一节中，我们将解决一个练习，学习如何最优地编写逻辑表达式。\n\
  \n### 练习 8：优化逻辑运算符\n\n在本练习中，我们将研究在逻辑运算符中使用条件表达式时，排列顺序所产生的影响。执行以下步骤以完成本练习：\n\n+ \
  \  1. 创建一个名为 **Snippet6.cpp** 的新文件。\n+   2. 通过编写以下代码，包含必要的库以及我们在前面练习中创建的 Timer.h\
  \ 文件：\n\n```\n#include <vector>\n#include <string>\n#include <iostream>\n#include\
  \ <random>\n\n#include \"Timer.h\"\n\nusing std::vector;\nusing std::cerr;\nusing\
  \ std::endl;\n```\n\n3. 定义一个名为 sum1() 的函数，计算 0 到 N 之间整数的和。只有当每个数字满足两个特定条件之一时，才会将其相加。第一个条件是数字必须小于\
  \ N/2。第二个条件是数字除以 3 后的余数必须为 2。这里，我们将 N 设置为 100,000,000，以便代码能够消耗可测量的时间。编写以下代码来实现：\n\
  \n```\nconst uint64_t N = 100000000;\n\nuint64_t sum1()\n{\n    TIME_IT;\n    uint64_t\
  \ ret = 0;\n    for(uint64_t b=0; b < N; ++b)\n    {\n        if(b % 3 == 2 || b\
  \ < N/2)\n        {\n            ret += b;\n        }\n    }\n\n    return ret;\n\
  }\n```\n\n4. 现在，定义另一个名为 sum2() 的函数。它的逻辑必须与之前为 sum1() 编写的逻辑相同。这里唯一的改动是我们反转 if 语句中条件表达式的顺序。编写以下代码来实现：\n\
  \n```\nuint64_t sum2()\n{\n    TIME_IT;\n    uint64_t ret = 0;\n    for(uint64_t\
  \ b=0; b < N; ++b)\n    {\n        if(b < N/2 || b % 3 == 2)\n        {\n      \
  \      ret += b;\n        }\n    }\n\n    return ret;\n}\n```\n\n注意，在 sum2 函数中，b\
  \ < N/2 条件有一半的时间会求值为 true。因此，第二个条件，即 b % 3 == 2，只有一半的迭代会被求值。为简单起见，如果假设两个条件表达式各占用\
  \ 1 个单位时间，则 sum2() 的总耗时为 N/2 + (2 * N/2) = N * 3/2。对于 sum1() 函数，左侧的条件表达式只有 33% 的时间会求值为\
  \ true，而其余 66% 的时间两个条件都会被求值。因此，估计耗时为 N/3 + (2 * N * 2/3) = N * 5/3。我们预计 sum1 与 sum2\
  \ 函数的时间比应为 5/3 比 3/2，也就是说，sum1 慢了 11%。\n\n5. 在 main 函数中添加以下代码：\n\n```\nint main()\n\
  {\n    volatile uint64_t dummy = 0;\n    for(int i = 0; i < 100; ++i)\n    {\n \
  \       dummy = sum1();\n    }\n    for(int i = 0; i < 100; ++i)\n    {\n      \
  \  dummy = sum2();\n    }\n    Timer::dump();\n}\n```\n\n6. 保存文件并打开终端。通过编写以下命令，编译并计时上面的程序以及\
  \ Timer.cpp 文件：\n\n```\n$ g++ -O3 Snippet6.cpp Timer.cpp\n$ ./a.out\n```\n\n输出如下：\n\
  \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_597_0.png)\n\n图 8.32：Snippet6.cpp 中代码的输出，展示了优化布尔条件的效果\n\
  \n从前面的输出可以看出，我们最终获得了约 38% 的速度提升，这远远超出了预期。为什么会发生这种情况？答案是 % 运算符会执行整数除法，这远比一次比较代价高昂，但编译器不会为\
  \ N/2 表达式生成除法指令，因为它是一个常量值。\n\n对于第一个函数，外层循环在退出时仅发生一次分支预测失败，但内层循环每次退出时都会发生分支预测失败，共\
  \ **100,000,000** 次。对于第二个函数，外层循环同样只在退出时发生一次分支预测失败，但内层循环每次退出时发生分支预测失败，共 100 次。**1,000,000**\
  \ 倍的预测失败次数差异将导致第一个函数比第二个慢。执行以下步骤来完成本练习：\n\n+   1. 创建一个名为 **Snippet7.cpp** 的文件，并包含必要的库：\n\
  \n```\n```cpp\n#include <vector>\n#include <string>\n#include <iostream>\n#include\
  \ <random>\n#include \"Timer.h\"\n\nusing std::vector;\nusing std::cerr;\nusing\
  \ std::endl;\n```\n```\n\n+   2. 定义一个名为 **sum1()** 的函数，其中包含一个嵌套循环。外层 for 循环应循环 N\
  \ 次，而内层 for 循环应迭代 100 次。将 **N 的值设为 100000000**。编写以下代码来实现：\n\n```\n```cpp\nconst\
  \ uint64_t N = 100000000;\nuint64_t sum1()\n{\n    TIME_IT;\n    uint64_t ret =\
  \ 0;\n    for(int i = 0; i < N; ++i)\n    {\n        for(int j = 0; j < 100; ++j)\n\
  \        {\n            ret += i ^ j;\n        }\n    }\n    return ret;\n}\n```\n\
  ```\n\n如果我们假设处理器会预测循环中的分支（从统计上看，循环末尾的分支指令更有可能跳转到循环开头，而不是不跳转），那么当 j 达到 100 时，每次都会出现预测错误——换句话说，共\
  \ N 次。\n\n3. 定义一个新函数 sum2()，其中包含一个嵌套循环。这里唯一的改动是必须将内层循环计数设置为 N，外层循环计数设置为 100。添加以下代码来实现：\n\
  \n```\nuint64_t sum2()\n{\n    TIME_IT;\n    uint64_t ret = 0;\n    for(int i =\
  \ 0; i < 100; ++i)\n    {\n        for(int j = 0; j < N; ++j)\n        {\n     \
  \       ret += i ^ j;\n        }\n    }\n    return ret;\n}\n```\n\n4. 在 main 函数中添加以下代码：\n\
  \n```\nint main()\n{\n    volatile uint64_t dummy;\n    dummy = sum1();\n    dummy\
  \ = sum2();\n    Timer::dump();\n}\n```\n\n5. 保存文件并打开终端。使用以下命令编译上面的程序以及 Timer.cpp\
  \ 文件，并对它们进行计时。请记住，你需要在同一目录中具有之前创建的 Timer.cpp 和 Timer.h 文件：\n\n```\n$ g++ -O3 Snippet7.cpp\
  \ Timer.cpp\n$ ./a.out\n```\n\n执行上述命令的输出如下：\n\n| 名称 | 次数 | 时间(ms) | 平均(ms) |\n|------|-------|----------|-------------|\n\
  | sum1 | 1 | 2442 | 2442 |\n| sum2 | 1 | 2377 | 2377 |\n\n图 8.33：Snippet7.cpp 中代码的输出，展示了分支预测优化的效果\n\
  \n\n\n\n从前面的输出可以看出，处理器对分支预测能力更好，使得 sum2 函数大约有 2% 的小幅但显著的加速。在下一节中，我们将探索更多优化技术。\n\n\
  ## 进一步优化\n\n在编码时可以实现多种其他技术；其中有些并不能保证产生更好的代码，但只需付出很少的努力就能改变编码习惯，使其成为本能。它们几乎不花费成本，但可能带来收益。其中一些技术如下：\n\
  \n- 在可能的情况下，将非原始类型的参数按 const 引用传递。即使移动构造函数可以使复制变得廉价，但它们仍然比使用 const 引用涉及更多的开销。\n\
  - 使用前置递增 (++i) 或前置递减 (--i) 运算符，而不是后缀版本。对于简单的类型如整数，这通常没有用处，但对于具有自定义递增运算符的复杂类型可能有用。养成写\
  \ ++i 而不是 i++ 的习惯是良好的做法，除非后缀递增确实是期望的行为。除了性能优势外，这种代码通过使用正确的运算符更清晰地声明了意图。\n- 尽可能晚地声明变量——在\
  \ C 中在函数顶部声明所有变量很常见，但在 C++ 中，由于变量可能具有非平凡的构造函数，因此最好只在实际使用它们的块中声明它们。\n- 就循环提升而言，如果循环中存在不随循环迭代而改变的代码或计算，则最好将其移出循环之外。这包括在循环体中创建对象。通常，更有效的做法是在循环外部一次性声明它们。现代编译器会自动执行此操作，但自己动手也不需要额外精力。\n\
  - 尽可能使用 const。它不会改变代码的含义，但它使编译器能够对代码做出更强的假设，从而可能带来更好的优化。除此之外，使用 const 使代码更具可读性和合理性。\n\
  - 整数除法、取模和乘法（尤其是乘以非 2 的幂的数）在 X86 硬件上是一些最慢的操作之一。如果需要在循环中执行此类操作，也许可以通过一些代数运算来消除它们。\n\
  \n- 3. 创建一个常量整数变量 N，并将其值设为 100000：\n\n    ```\n    const int N = 100000;\n    ```\n\
  \n- 4. 初始化一个随机数生成器并创建一个从 0 到 N 的分布范围。添加以下代码来实现此功能：\n\n    ```\n    std::random_device\
  \ dev;\n    std::mt19937 rng(dev());\n    std::uniform_int_distribution<std::mt19937::result_type>\
  \ dist(0,N);\n    ```\n\n- 5. 创建一个名为 insertRandom() 的方法，并以随机位置将元素从 0 到 N 插入到容器中。添加以下代码来实现此功能：\n\
  \n    ```\n    template<class C> void insertRandom(C &l)\n    {\n        // insert\
  \ one element to initialize\n        l.insert(l.end(), 0);\n        for(int i =\
  \ 0; i < N; ++i)\n        {\n            int pos = dist(rng) % l.size();\n     \
  \       auto it = l.begin();\n            advance(it, pos);\n            l.insert(it,\
  \ i);\n        }\n    }\n    ```\n\n- 6. 创建一个名为 insertStart() 的方法，并将元素从 0 到 N 插入到容器的开头。添加以下代码来实现此功能：\n\
  \n    ```\n    template<class C> void insertStart(C &l)\n    {\n        for(int\
  \ i = 0; i < N; ++i)\n        {\n            l.insert(l.begin(), i);\n        }\n\
  \    }\n    ```\n\n- 7. 创建一个名为 **insertEnd()** 的方法，并将元素从 **0** 到 **N** 插入到容器的末尾。添加以下代码来实现此功能：\n\
  \n    ```\n    template<class C> void insertEnd(C &l)\n    {\n        for(int i\
  \ = 0; i < N; ++i)\n        {\n            l.insert(l.end(), i);\n        }\n  \
  \  }\n    ```\n\n- 8. 在 **main** 方法中编写以下代码：\n\n    ```\n    int main()\n    {\n\
  \        std::list<int> l;\n        std::vector<int> v;\n        // list\n     \
  \   {\n            Timer t(\"list random\");\n            insertRandom(l);\n   \
  \     }\n\n        {\n            Timer t(\"list end\");\n            insertEnd(l);\n\
  \        }\n        {\n            Timer t(\"list start\");\n            insertStart(l);\n\
  \        }\n        // vector\n        {\n            Timer t(\"vect random\");\n\
  \            insertRandom(v);\n        }\n\n        {\n            Timer t(\"vect\
  \ end\");\n            insertEnd(v);\n        }\n        {\n            Timer t(\"\
  vect start\");\n    ```\n\n历史上，处理器在 1980 年到 2010 年间速度提高了约 16,000 倍。与此同时，RAM 速度的提升要小一个数量级——不到\
  \ 100 倍。因此，指令对 RAM 的单次访问可能导致 CPU 等待大量时钟周期。这将是不可接受的性能下降，因此出现了许多技术来缓解此问题。在我们探索这个问题之前，让我们在下一个练习中测量内存访问的影响。\n\
  \n### 练习 11：测量内存访问的影响\n\n在本练习中，我们将检查随机访问内存的性能影响。执行以下步骤来完成此练习：\n\n- 1. 创建一个名为 Snippet9.cpp\
  \ 的新文件。\n\n- 2. 包含必要的库以及 Timer.h 头文件。创建两个常量整数变量 SIZE 和 N，并将其值设为 100000000。另创建一个随机数生成器和一个从\
  \ 0 到 N-1 的分布范围。编写以下代码来实现此功能：\n\n    ```\n    #include <vector>\n    #include <list>\n\
  \    #include <algorithm>\n    #include <string>\n    #include <iostream>\n    #include\
  \ <random>\n    #include \"Timer.h\"\n\n    using std::vector;\n    using std::list;\n\
  \    using std::cerr;\n    using std::endl;\n\n    const int SIZE = 100'000'000;\n\
  \    const int N = 100'000'000;\n\n    std::random_device dev;\n    std::mt19937\
  \ rng(dev());\n\n    std::uniform_int_distribution<std::mt19937::result_type> dist(0,SIZE-1);\n\
  \    ```\n\n- 3. 创建 getPRIIndex() 函数，该函数返回介于 0 和 SIZE-1 之间的伪随机索引，其中 SIZE 是数组中的元素数。编写以下代码来实现此功能：\n\
  \n    > Note\n    > 我们稍后会讨论为什么使用随机数。\n\n    ```\n    uint64_t getPRIIndex(uint64_t\
  \ i)\n    {\n        return (15485863 * i) % SIZE;\n    }\n    ```\n\n- 4. 编写一个名为\
  \ sum1() 的函数，该函数随机访问大型数据数组并对这些元素求和：\n\n    ```\n    uint64_t sum1(vector<int> &v)\n\
  \    {\n        TIME_IT;\n        uint64_t sum = 0;\n        for(int i = 0; i <\
  \ N; ++i)\n        {\n            sum += v[getPRIIndex(i)];\n        }\n       \
  \ return sum;\n    }\n    ```\n\n- 5. 编写一个名为 sum2() 的函数，该函数对随机数求和而没有任何内存访问：\n\n\
  \    ```\n    uint64_t sum2()\n    {\n        TIME_IT;\n        uint64_t sum = 0;\n\
  \        for(int i = 0; i < N; ++i)\n        {\n            sum += getPRIIndex(i);\n\
  \        }\n        return sum;\n    }\n    ```\n\n## 缓存\n\n现代处理器在处理器寄存器和 RAM 之间具有多层缓存内存。这些缓存被标记为\
  \ L1、L2、L3、L4 等，其中 L1 最接近处理器，L4 最远。每层缓存都比其下层更快（通常也更小）。以下是 Haswell 系列处理器缓存/内存大小和延迟的示例：\n\
  \n| Cache/Memory | Size | Latency |\n| --- | --- | --- |\n| L1 | 32 KB | 4 cycles\
  \ |\n| L2 | 256 KB | 12 cycles |\n| L3 | 6 MB | 20 cycles |\n| L4 | 128 MB | 58\
  \ cycles |\n| RAM | many GB | 115 cycles |\n\n缓存工作以帮助性能的简单模型如下：当访问内存地址时，会在 L1 缓存中查找——如果找到，则从那里检索。如果没有找到，则在\
  \ L2 缓存中查找，如果仍未找到，则查找 L3 缓存，依此类推——如果在任何缓存中都未找到，则从内存中获取。当从内存中获取时，它会被存储在每一层缓存中以便以后更快访问。这种方法本身几乎没用，因为它只有在我们一遍又一遍地访问同一个内存地址时才会提高性能。第二方面，称为预取，是使缓存真正发挥作用的机制。\n\
  \n### 预取\n\n预取是一个过程，即在执行内存访问时，附近的数据也会被提取到缓存中，即使它没有被直接访问。预取的第一方面与内存总线粒度有关——可以认为“RAM\
  \ 子系统可以向处理器发送的最小数据量是多少？”。在大多数现代处理器中，这是 64 位——换句话说，无论你从内存中请求单个字节还是 64 位值，包含该地址的整个\
  \ 64 位机器字都会从 RAM 中读取。这些数据存储在每一层缓存中以便以后更快访问。显然，这会立即改善内存性能——假设我们读取地址 0x1000 处的内存字节；我们还将该地址之后的其他\
  \ 7 个字节带入缓存。如果我们随后访问地址 0x1001 处的字节，它将来自缓存，避免了昂贵的 RAM 访问。\n\n\n\n\n\n预取的第二个方面在此基础上更进一步——当读取某个地址的\
  \ RAM 内容时，处理器不仅读取该内存字，还会读取更多内容。在 x86 系列处理器上，这在 32 到 128 字节之间。这被称为 **缓存行** 大小——处理器总是以该大小的块来读写内存。当\
  \ CPU 硬件检测到内存以线性方式被访问时，它会根据对随后可能被访问的地址的预测，将内存预取到一个缓存行中。\n\nCPU 在检测正向和反向的规律访问模式方面非常聪明，并且会高效地进行预取。你也可以使用特殊指令向处理器提供提示，使其根据程序员的指示预取数据。这些指令在大多数编译器中作为内在函数提供，以避免使用内联汇编语言。当读取或写入的内存地址不在缓存中时，被称为\
  \ **缓存未命中**，这是一个非常昂贵的事件，必须不惜一切代价避免。CPU 硬件会尽力减轻缓存未命中的影响，但程序员可以分析和修改数据访问模式以最大程度地减少缓存未命中。此处对缓存的描述是一个简化的教学模型——实际上，CPU\
  \ 具有用于指令和数据的 L1 缓存、多个缓存行，以及非常复杂的机制来确保多个处理器能够保持其各自缓存的同步。\n\n> **注意**\n> \n> 关于缓存实现（以及有关内存子系统的大量其他信息）的全面描述，可以在以下著名的在线文章中找到：\n\
  > https://lwn.net/Articles/250967/。\n\n## 缓存对算法的影响\n\n了解了缓存之后，我们现在可以解释为什么我们第一个关于向量与列表的示例显示出令人惊讶的结果——从计算机科学的角度来看，以下是正确的：\n\
  \n**对于列表：**\n\n- 迭代到第 N 个位置的复杂度为 N 阶。\n- 插入或删除一个元素的复杂度为 1 阶。\n\n### 对于数组（或向量）：\n\
  \n- 迭代到第 N 个位置的复杂度为 1 阶。\n- 在位置 N 插入或删除一个元素的复杂度与 (S - N) 成正比，其中 S 为数组的大小。\n\n然而，对于现代架构，内存访问的成本极高，但随后访问相邻地址的成本几乎为\
  \ 0，因为它很可能已经在缓存中。这意味着 std::list 中位于内存中非顺序位置的元素在迭代时很可能总是导致缓存未命中，从而导致性能缓慢。另一方面，由于数组或\
  \ std::vector 的元素总是相邻的，缓存和预取会将复制 (S-N) 个元素到新位置的总体成本降低非常大的幅度。因此，传统上对这两种数据结构的分析，即列表在随机插入时表现更好，虽然在技术上是正确的，但在实践中并不成立，尤其是在考虑到现代\
  \ CPU 硬件明显复杂的缓存行为的情况下。当我们的程序受数据限制时，算法复杂度的分析必须通过对数据局部性的理解来补充。\n\n数据局部性可以简单地定义为刚刚访问的内存地址与之前访问的内存地址之间的平均距离。换句话说，在相距很远的地址之间进行内存访问会造成严重的减速，因为更接近的地址的数据很可能已被预取到缓存中。当数据已存在于缓存中时，被称为“热”；否则，被称为“冷”。利用缓存的代码被称为缓存友好。另一方面，缓存不友好的代码会导致缓存行被浪费地重新加载（称为缓存失效）。在本节的剩余部分，我们将研究如何编写缓存友好代码的策略。\n\
  \n## 优化缓存友好性\n\n在过去，代码优化涉及尝试最小化代码中的机器指令数量，使用更高效的指令，甚至重新排序指令以使流水线保持满载。到了今天，编译器会以大多数程序员无法达到的水平执行上述所有优化——尤其是考虑到编译器可以在数亿条指令的整个程序中进行优化。即使现在，程序员仍然坚定地负责优化数据访问模式以利用缓存。\n\
  \n任务非常简单——确保内存的访问接近之前访问的内存——但实现这一目标的方法可能需要大量努力。\n\n> **注意**\n> \n> 著名的游戏程序员和代码优化大师\
  \ Terje Mathisen 在 90 年代据称说过：“所有编程都是缓存练习。” 今天，在 2019 年，这一说法在编写快速代码这一子领域中比以往任何时候都更适用。\n\
  \n提高缓存友好性的一些基本经验法则是：\n\n- 栈总是“热”的，因此我们应尽可能使用局部变量。\n- 动态分配的对象很少彼此具有数据局部性——避免它们或使用预分配的对象池，使它们在内存中顺序排列。\n\
  - 基于指针的数据结构，如树——尤其是列表——由多个在堆上分配的节点组成，是非常不利于缓存的。\n- OO 代码中虚拟函数的运行时分派会使指令缓存失效——在性能关键代码中避免动态分派。\n\
  \n在下一节中，我们将探讨堆分配的成本。\n\n### 练习 12：探索堆分配的成本\n\n在本练习中，我们将检查动态分配内存的性能影响，并检查堆内存如何影响代码的性能。执行以下步骤来完成此练习：\n\
  \n- 1. 创建一个名为 **Snippet11.cpp** 的文件。\n- 2. 添加以下代码以包含必要的库：\n\n```\n#include <string>\n\
  #include <iostream>\n#include <random>\n#include \"Timer.h\"\n\nusing std::string;\n\
  using std::cerr;\nusing std::endl;\n```\n\n- 3. 声明一个常量变量 N 和一个名为 fruits 的字符数组。为它们赋值：\n\
  \n```\n```cpp\nconst int N = 10'000'000;\nconst char* fruits[] =\n{\"apple\", \"\
  banana\", \"cherry\", \"durian\", \"guava\", \"jackfruit\", \"kumquat\",\n\"mango\"\
  , \"orange\", \"pear\"};\n```\n```\n\n- 4. 创建一个名为 **fun1()** 的函数，该函数仅遍历 fruits 中的每个字符串，将其复制到一个字符串，并对该字符串的字符求和：\n\
  \n```\n```cpp\nuint64_t fun1()\n{\n    TIME_IT;\n    uint64_t sum = 0;\n    string\
  \ s1;\n    for(uint64_t i = 0; i < N; ++i)\n    {\n        s1 = fruits[i % 10];\n\
  \        for(int k = 0; k < s1.size(); ++k) sum += s1[k];\n    }\n    return sum;\n\
  }\n```\n```\n\n- 5. 创建另一个名为 **sum2()** 的函数，该函数使用局部声明的字符数组而不是字符串和循环进行复制：\n\n```\n\
  ```cpp\nuint64_t fun2()\n{\n    TIME_IT;\n    uint64_t sum = 0;\n    char s1[32];\n\
  \n    for(uint64_t i = 0; i < N; ++i)\n    {\n        char *ps1 = s1;\n        const\
  \ char *p1 = fruits[i % 10];\n        do { *ps1++ = *p1; } while(*p1++);\n     \
  \   for(ps1 = s1, *ps1; ++ps1) sum += *ps1;\n    }\n    return sum;\n}\n```\n```\n\
  \n6. 在 main() 函数内编写以下代码：\n\n```\nint main()\n{\n    for(int i = 0; i < 10; ++i)\n\
  \    {\n        volatile uint64_t asum1 = fun1();\n        volatile uint64_t asum2\
  \ = fun2();\n    }\n    Timer::dump();\n}\n```\n\n7. 保存文件并打开终端。编译并运行程序：\n\n```\n\
  $ g++ -O3 Snippet11.cpp Timer.cpp\n$ ./a.out\n```\n\n前述命令生成以下输出：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_615_0.png)\n\
  \n图 8.37：Snippet11.cpp 中代码的输出，显示堆分配对时间的影响\n\n从前述输出中，注意到 fun2() 的速度几乎是 fun1() 的两倍。\n\
  \n8. 现在，使用 perf 命令进行分析：\n\n```\n$ perf record ./a.out\n```\n\n前述命令生成以下输出：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_615_1.png)\n\
  \n图 8.38：使用 perf 命令分析 Snippet11.cpp 中代码的输出\n\n9. 现在，我们可以使用以下代码检查性能报告：\n\n```\n$\
  \ perf report\n```\n\n\n\n我们收到以下输出：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_616_0.png)\n\
  \n图 8.39：Snippet11.cpp 中代码的 perf 命令时序报告输出\n\n在前面的输出中，注意到约 33% 的执行时间被 std::string\
  \ 构造函数、strlen() 和 memmove() 占用。所有这些都与 fun1() 中使用的 std::string 相关。尤其是堆分配是最慢的操作。\n\
  \n## Struct of Arrays Pattern\n\n在许多程序中，我们经常使用相同类型的对象数组——这些可能代表数据库中的记录、游戏中的实体等等。一种常见模式是遍历一个大型结构体数组并对某些字段执行操作。即使结构体在内存中是顺序的，如果我们只访问少数几个字段，更大的结构体大小会使缓存效果变差。\n\
  \n处理器可能会预取多个结构体到缓存中，但程序只访问了该缓存数据的一部分。由于它没有使用每个结构体的每个字段，大部分缓存数据都被丢弃。为了避免这种情况，可以使用另一种数据布局——而不是使用数组的数组\
  \ AoS 模式，我们使用结构体数组 SoA 模式。在下一节中，我们将解决一个练习，其中我们将检查使用 SoA 模式与 AoS 模式的性能优势。\n\n###\
  \ Exercise 13: Using the Struct of Arrays Pattern\n\n在本练习中，我们将检查使用 SoA 与 AoS 模式的性能优势。执行以下步骤来完成此练习：\n\
  \n- 1. 创建一个名为 Snippet12.cpp 的文件。\n- 2. 包含必要的库以及 Timer.h 头文件。初始化一个随机数生成器并创建一个从 1\
  \ 到 N-1 的分布范围。创建一个常量整数变量 N 并将其初始化为 100,000,000。添加以下代码来实现此功能：\n\n```\n#include <vector>\n\
  #include <list>\n#include <algorithm>\n#include <string>\n```\n\n```\n#include <iostream>\n\
  #include <random>\n#include \"Timer.h\"\n\nusing std::vector;\nusing std::list;\n\
  using std::cerr;\nusing std::endl;\n\nconst int N = 100'000'000;\n\nstd::random_device\
  \ dev;\nstd::mt19937 rng(dev());\n\nstd::uniform_int_distribution<std::mt19937::result_type>\
  \ dist(1,N-1);\n```\n\n3. 编写两种不同的数据表示方式——结构体数组和结构体数组。使用六个 uint64_t 字段，以便我们可以模拟一个更大的结构，这更能代表真实世界的程序：\n\
  \n```\nstruct Data1\n{\n    uint64_t field1;\n    uint64_t field2;\n    uint64_t\
  \ field3;\n    uint64_t field4;\n    uint64_t field5;\n    uint64_t field6;\n};\n\
  struct Data2\n{\n    vector<uint64_t> field1;\n    vector<uint64_t> field2;\n  \
  \  vector<uint64_t> field3;\n    vector<uint64_t> field4;\n    vector<uint64_t>\
  \ field5;\n    vector<uint64_t> field6;\n};\n```\n\n- 5. 在 `main` 函数内编写以下代码：\n\n\
  ```\n```cpp\nint main()\n{\n    vector<Data1> arrOfStruct;\n    Data2 structOfArr;\n\
  \n    // Reserve space\n    structOfArr.field1.reserve(N);\n    structOfArr.field2.reserve(N);\n\
  \    structOfArr.field3.reserve(N);\n    arrOfStruct.reserve(N);\n    // Fill random\
  \ values\n    for(int i = 0; i < N; ++i)\n    {\n        Data1 temp;\n        temp.field1\
  \ = dist(rng);\n        temp.field2 = dist(rng);\n        temp.field3 = dist(rng);\n\

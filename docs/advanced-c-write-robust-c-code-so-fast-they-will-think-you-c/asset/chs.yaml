  \ SumFuncTest: public ::testing::Test {};\n\nTEST_F(SumFuncTest, CanSumCorrectly)\
  \ {\n    EXPECT_EQ(7, sum(3, 4));\n}\n}\n```\n\n请注意，这里没有 `main()` 函数，因为 CanTest.cpp\
  \ 中有一个，它们将被链接在一起。其次，注意这里包含了项目 src 文件夹中的 `SumFunc.h`，并在测试中作为 `sum(3, 4)` 使用。这就是我们在测试中使用项目代码的方式。\n\
  \n- 3. 在 `tests/CMakeLists.txt` 文件中进行以下更改，以构建测试：\n\n```\ninclude(GoogleTest)\nadd_executable(tests\
  \ CanTest.cpp SumFuncTest.cpp ../src/SumFunc.cpp) # added files here\ntarget_link_libraries(tests\
  \ GTest::GTest)\ngtest_discover_tests(tests)\n```\n\n注意，我们将测试（`SumFuncTest.cpp`）和它测试的代码（`../src/SumFunc.cpp`）都添加到了可执行文件中，因为我们的测试代码使用了实际项目中的代码。\n\

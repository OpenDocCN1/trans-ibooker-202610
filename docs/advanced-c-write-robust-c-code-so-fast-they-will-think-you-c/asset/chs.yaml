- "# 管理 C++ 项目\n\n在 C++ 世界中，我们有多个工具可以帮助管理项目源代码及其依赖项。例如，**pkg-config, Autotools, make,**\
  \ 和 **CMake** 是社区中最著名的工具。与其他高级语言的工具相比，这些工具使用起来复杂得多。**CMake** 在其中脱颖而出，成为管理 C++ 项目及其依赖项的事实标准。与\
  \ **make** 相比，它更具主观性，并且被大多数 IDE（集成开发环境）接受为直接项目格式。\n\n虽然 **CMake** 有助于管理项目及其依赖项，但体验仍然远不及高级语言，在高级语言中，您列出想要使用的库及其版本，其余一切都为您处理好。使用\
  \ CMake，您仍然有责任在开发环境中正确安装库，并且您需要使用每个库的兼容版本。在具有广泛包管理器的流行 Linux 发行版中，您可以轻松安装大多数流行库的二进制版本。然而，有时您可能必须自行编译和安装库。这是整个\
  \ C++ 开发者体验的一部分，您将通过了解您选择的开发平台而积累。在这里，我们将更专注于如何正确设置我们的 CMake 项目，包括理解和解决与库相关的问题。\n\
  \n## 代码-构建-测试-运行循环\n\n为了让我们的讨论建立在坚实的基础上，我们将立即从一个实际示例开始。我们将从一个 C++ 代码库模板开始，您可以将其用作自己项目的起点。我们将看到如何使用命令行上的\
  \ CMake 构建和编译它。我们还将为 C/C++ 开发者设置 Eclipse IDE 并导入我们的 CMake 项目。使用 IDE 将为我们提供便于创建源代码的设施，并使我们能够逐行调试程序，以查看程序执行期间到底发生了什么，并以知情的方式而非试错和迷信的方式纠正我们的错误。\n\
  \n\n\n\n\n## 构建 CMake 项目\n\n对于 C++ 项目而言，使用 CMake 来组织和构建项目是事实上的标准做法。在这里，我们将使用一个基础模板项目作为起点。以下是一个示例模板的文件夹结构：\n\
  \n```\nREADME.md\nCMakeLists.txt\ninclude/CxxTemplatePublic.h\nsrc/CxxTemplate.cpp\n\
  src/CxxTemplate.h\n.gitignore\nLICENSE\ncmake/modules/DumpVariables.cmake\ncmake/modules/DumpProps.cmake\n\
  ```\n\n图 1.1：示例模板的文件夹结构\n\n在上图中，.gitignore 文件列出了不应添加到 git 版本控制系统中的文件模式。这些被忽略的文件包括构建过程的输出，它们是在本地创建的，不应在计算机之间共享。\n\
  \ninclude 和 src 文件夹中的文件是实际的 C++ 源文件，而 CMakeLists.txt 文件是 CMake 脚本文件，它通过处理源编译规则、库依赖项和其他项目设置将项目粘合在一起。CMake\
  \ 规则是高级的平台无关规则。CMake 使用它们为不同平台创建各种类型的 make 文件。\n\n使用 CMake 构建项目是一个两步过程。首先，我们让 CMake\
  \ 为将编译和构建项目的原生构建系统生成平台相关的配置文件。然后，我们将使用生成的文件来构建项目。CMake 可以为其生成配置文件的平台相关构建系统包括 UNIX\
  \ Makefiles、Ninja 构建文件、NMake Makefiles 和 MinGW Makefiles。这里的选择取决于所使用的平台、这些工具的可用性以及个人偏好。UNIX\
  \ Makefiles 是 Unix 和 Linux 的事实标准，而 NMake 是其在 Windows 和 Visual Studio 中的对应物。另一方面，MinGW\
  \ 是 Windows 中的类 Unix 环境，其中也使用 Makefile。Ninja 是一个现代构建系统，与其他构建系统相比提供了卓越的速度，同时具有多平台支持，我们在这里选择使用它。此外，除了这些命令行构建系统之外，我们还可以为\
  \ Visual Studio、Xcode、Eclipse CDT 等生成 IDE 项目，并在 IDE 内构建我们的项目。因此，CMake 是一个元工具，它将为另一个实际构建项目的系统创建配置文件。在下一节中，我们将解决一个练习，其中我们将使用\
  \ CMake 生成 Ninja 构建文件。\n\n### 练习 1：使用 CMake 生成 Ninja 构建文件\n\n在本练习中，我们将使用 **CMake**\
  \ 生成 **Ninja 构建文件**，用于构建 C++ 项目。我们将首先从 **git** 仓库下载源代码，并使用 CMake 和 Ninja 来构建它。本练习的目标是使用\
  \ CMake 生成 Ninja 构建文件，构建项目，然后运行它们。\n\n> **注意**\n> \n> GitHub 仓库的链接可以在这里找到：https://github.com/TrainingByPackt/Advanced-CPlusPlus/tree/master/Lesson1/Exercise01/project。\n\
  \n执行以下步骤来完成练习：\n\n- 1. 在终端窗口中，输入以下命令将 **CxxTemplate** 仓库从 GitHub 下载到本地系统：\n\n```\n\
  git clone https://github.com/TrainingByPackt/Advanced-CPlusPlus/tree/master/Lesson1/Exercise01/project\n\
  ```\n\n前一个命令的输出类似于以下内容：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_27_0.png)\n\n\
  现在你已在 **CxxTemplate** 文件夹中有了源代码。\n\n- 2. 通过在终端中输入以下命令进入 **CxxTemplate** 文件夹：\n\n\
  ```\ncd CxxTemplate\n```\n\n- 3. 现在你可以通过输入以下命令列出项目中的所有文件：\n\n```\nfind .\n```\n\n\
  4. 在 CxxTemplate 文件夹中使用 cmake 命令生成我们的 Ninja 构建文件。为此，写下以下命令：\n\n```\ncmake -Bbuild\
  \ -H. -GNinja\n```\n\n前一个命令的输出如下：\n\n```\n-- The C compiler identification is GNU\
  \ 7.4.0\n-- The CXX compiler identification is GNU 7.4.0\n-- Check for working C\
  \ compiler: /usr/bin/cc\n-- Check for working C compiler: /usr/bin/cc -- works\n\
  ... (more lines)\n-- Configuring done\n-- Generating done\n-- Build files have been\
  \ written to:\n/home/username/code/CxxTemplate/build\n```\n\n图 1.3：生成 Ninja 构建文件\n\
  \n让我们解释前一个命令的各个部分。使用 -Bbuild，我们告诉 CMake 使用 build 文件夹来生成构建产物。由于此文件夹不存在，CMake 将创建它。使用\
  \ -H.，我们告诉 CMake 使用当前文件夹作为源。通过使用单独的构建文件夹，我们将保持源文件干净，所有构建产物都将存放在 build 文件夹中，该文件夹由于我们的\
  \ .gitignore 文件而被 Git 忽略。使用 -GNinja，我们告诉 CMake 使用 Ninja 构建系统。\n\n5. 运行以下命令列出项目文件并检查\
  \ build 文件夹内创建的文件：\n\n```\nls\nls build\n```\n\n前一个命令将在终端中显示以下输出：\n\n```\n-- Build\
  \ files have been written to: /home/gazihan/CxxTemplate/build\ngazihan@ubuntu:~/CxxTemplate$\
  \ ls\nbuild cmake CMakeLists.txt include LICENSE README.md src\ngazihan@ubuntu:~/CxxTemplate$\
  \ ls build\nbuild.ninja CMakeCache.txt CMakeFiles cmake_install.cmake rules.ninja\n\
  gazihan@ubuntu:~/CxxTemplate$\n```\n\n图 1.4：build 文件夹中的文件\n\n- 8. 在终端中，输入以下命令运行\
  \ **CxxTemplate** 可执行文件：\n\n```\n```bash\n./CxxTemplate\n```\n```\n\n终端中前一个命令将提供以下输出：\n\
  \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_30_0.png)\n\n图 1.7：运行可执行文件\n\n以下来自 `src/CxxTemplate.cpp`\
  \ 文件的行负责写入之前的输出：\n\n```\n```cpp\nstd::cout << \"Hello CMake.\" << std::endl;\n```\n\
  ```\n\n现在你已成功在 Linux 中构建了一个 CMake 项目。Ninja 和 CMake 配合得很好。你只需要运行一次 CMake，Ninja 就会检测是否需要再次调用\
  \ CMake 并为你调用。例如，即使你向 `CMakeLists.txt` 文件添加了新的源文件，你也只需在终端中输入 `ninja` 命令，它就会自动为你运行\

- "# 8\n\n# Need for Speed – Performance and Optimization\n\n## Learning Objectives\n\
  \n本章结束时，你将能够：\n\n+   - 手动计时代码性能\n+   - 使用源代码检测来测量代码执行时间\n+   - 使用 perf 工具分析程序性能\n\
  +   - 使用 godbolt 编译器资源管理器工具分析编译器生成的机器代码\n+   - 使用编译器标志生成更好的代码\n+   - 应用导致性能的代码惯用法\n\
  +   - 编写缓存友好的代码\n+   - 对现实世界问题应用算法级优化\n\n在本章中，我们将探索概念，这些概念将使我们能够在一般情况下编写快速代码，以及特别适用于\
  \ C++ 的几种实用技术。\n\n## Introduction\n\n在当今极其庞大和复杂的软件系统世界中，**稳定性**和**可维护性**通常被认为是对大多数软件项目的主要目标，而自\
  \ 2000 年代以来，优化并没有被广泛视为一个值得的目标。这是因为硬件技术的快速加速定期超过了软件需求。\n\n多年来，似乎硬件改进将继续跟上软件性能需求，但应用程序继续变得更大、更复杂。与\
  \ C 和 C++ 等低级原生编译语言相比，**Python** 或 **Ruby** 等性能较低但更易于使用的解释型语言的流行度下降。\n\n然而，到 2000\
  \ 年代末，CPU 晶体管数量（和性能）每 18 个月翻一番的趋势（**摩尔定律**的结果）已经停止，性能改进趋于平稳。由于物理和制造成本的限制，广泛提供 5\
  \ 到 10 GHz 处理器的预期从未实现。然而，移动设备的快速采用和数据科学和机器学习的高性能计算应用的兴起，突然使对快速高效代码的需求复苏。每瓦性能已成为新的目标指标，因为大型数据中心消耗了巨大的电力。例如，2017\
  \ 年美国的 Google 服务器使用的电力超过了整个英国国家。\n\n到目前为止，在本书中，我们了解到 C++ 语言在易用性方面是如何发展的，而不会牺牲相对于传统语言如\
  \ C 的任何性能潜力。这意味着我们可以在不 necessarily 牺牲可读性或稳定性的情况下用 C++ 编写快速代码。在下一节中，我们将学习性能测量的概念。\n\
  \n## Performance Measurement\n\n优化最重要的方面是**代码执行时间的测量**。除非我们使用各种输入数据集测量应用程序的性能，否则我们将不知道哪一部分花费了最多时间，我们的优化工作将盲目进行，没有保证结果。有几种测量方法，其中一些列在这里：\n\
  \n+   - 运行时检测或分析\n+   - 源代码检测\n\n\n\n\n+   - 手动计时执行\n+   - 研究生成的汇编代码\n+   - 通过研究代码和所用算法进行手动估算\n\
  \n上述列表按测量准确度排序（最准确的方法排在最前面）。然而，这些方法各有优势。选择哪种方法取决于优化工作的目标和范围。如果全力以赴追求尽可能快的实现，则可能需要用到所有这些方法。我们将在接下来的章节中逐一探讨这些方法。\n\
  \n### 手动估算\n\n性能提升的最大可能出现在我们用更优的算法替换原有算法时。例如，考虑一个对从 1 到 n 的整数求和的小函数的两个版本：\n\n```\n\
  int sum1(int n)\n{\n    int ret = 0;\n    for(int i = 1; i <= n; ++i)\n    {\n \
  \       ret += i;\n    }\n    return ret;\n}\nint sum2(int n)\n{\n    return (n\
  \ * (n + 1)) / 2;\n}\n```\n\n第一个函数 sum1 使用简单的循环来计算总和，其运行时复杂度与 n 成正比；而第二个函数 sum2\
  \ 使用代数求和公式，所需时间与 n 无关，是常数时间。在这个相当刻意设计的示例中，我们仅通过运用基础的代数知识就优化了一个函数。\n\n对于每一种能想到的操作，都有许多已被证明是最优的著名算法。让代码尽可能快速运行的最佳方式就是使用算法。\n\
  \n掌握算法词汇至关重要。我们不必成为算法专家，但至少需要知晓各个领域中高效算法的存在，即使我们无法从零开始实现它们。对算法稍作深入了解，将有助于我们发现程序中与知名算法执行相似（即便不完全相同）计算的部分。某些代码特征，如嵌套循环或线性扫描数据，通常都是明显的改进候选对象——前提是我们能确认这些结构位于代码的热点区域。**热点**是指运行非常频繁且对性能有显著影响的代码段。C++\
  \ 标准库包含大量基本算法，可以作为构建块来提高许多常见操作的效率。\n\n### 研究生成的汇编代码\n\n**汇编语言**是实际在处理器上执行的二进制机器码的人类可读表示。对于任何认真使用\
  \ C++ 等编译型语言的程序员来说，汇编语言的基本知识都是一笔巨大的财富。\n\n研究程序生成的汇编代码，可以让我们深入了解编译器的工作方式，并帮助评估代码效率。在许多情况下，这是确定效率瓶颈的唯一可行方法。\n\
  \n此外，汇编语言的基本知识对于调试 C++ 代码也是必不可少的，因为一些最难捕获的 bug 恰恰与底层生成的代码有关。\n\n一个非常强大且流行的在线工具是**Compiler\
  \ Explorer**，它用于分析编译器生成的代码，本章我们将使用它。\n\n> **注意**\n> \n> **Godbolt compiler explorer**\
  \ 可以在 https://godbolt.org 找到。\n\n在上面的截图中，前几行被称为**函数序言**，也就是用于设置**栈帧**和局部变量的指令。栈帧表示函数中的局部数据，包括参数和局部变量。当函数返回时，栈帧被丢弃。**mov**\
  \ 指令用常量值初始化寄存器或内存位置。这里的汇编语法称为**Intel 语法**。这种语法的约定是目标操作数总是第一个。例如，**MOV RAX, RBX**\
  \ 汇编代码表示将 **RBX** 寄存器中的值移动到 **RAX** 寄存器。\n\n> **注意**\n> \n> 汇编语言通常不区分大小写，因此 **EAX**\
  \ 和 **eax** 含义相同。\n\n汇编中的 **DWORD PTR [rbp-8]** 表达式等价于 C 表达式 **(*(DWORD*)(rbp -\
  \ 8))**。换句话说，内存地址 **rbp-8** 被当作一个 4 字节的 **DWORD**（内存中的一个双字——32 位）来访问。汇编代码中的方括号表示解引用，就像\
  \ C/C++ 中的 * 运算符一样。**rbp** 寄存器是基址指针，它始终保存当前执行函数栈基址的地址。我们不必确切了解栈帧是如何工作的，但要记住：由于栈从较高的地址开始并向下增长，因此函数参数和局部变量的地址是相对于\
  \ **rbp** 的负偏移。如果你看到某个从 **rbp** 开始的负偏移，它引用的就是局部变量或参数。\n\n在上面的截图中，第一条 **mov** 指令将\
  \ **edi** 寄存器中的值放入栈中——在本例中，它表示传入的 **n** 参数。最后两条 **mov** 指令分别将我们代码中的 **ret** 变量和\
  \ **i** 循环变量初始化为 **0** 和 **1**。\n\n现在，查看紧跟序言和初始化之后的汇编代码快照——这就是我们的 **for()** 循环：\n\
  \n```\n·L3:\n    mov     eax, DWORD PTR [rbp-8]\n    cmp     eax, DWORD PTR [rbp-20]\n\
  \    jg      .L2\n```\n\n**图 8.5：for 循环的汇编代码**\n\n在上面的截图中，带冒号的字符串行称为**标签**。它们与 **BASIC**、**C/C++**\
  \ 或 **Pascal** 等编程语言中的标签非常相似，并被用作**跳转**指令（相当于 goto 语句的汇编形式）的目标。\n\nx86 汇编中以 J 开头的指令都是跳转指令，例如\
  \ JMP、JG、JGE、JL、JLE、JE、JNE 等。跳转指令是有条件或无条件的分支。在上面的截图中，mov 指令将变量 i 的值从内存加载到 eax 寄存器。然后使用\
  \ cmp 指令将其与内存中的 n 值进行比较。\n\n> 注意\n> 这里的 JG 指令表示“如果大于则跳转”。\n\n如果比较结果为大于，则执行跳转到 .L2\
  \ 标签（位于循环外部）。如果不是，则继续执行下一条指令，如下所示：\n\n```\nmov eax, DWORD PTR [rbp-8]\nadd DWORD\
  \ PTR [rbp-4], eax\nadd DWORD PTR [rbp-8], 1\njmp .L3\n```\n\n图 8.6：下一条指令的汇编代码\n\
  \n这里，i 的值再次被加载到 eax 中，这看起来似乎没有必要。但请记住，这段汇编代码未经优化，因此编译器生成的代码可能不是最优的，并且可能包含不必要的工作。然后，eax\
  \ 中的值被加到 ret 上，之后 i 自增 1。最后，执行跳回 .L3 标签。位于 .L2 和 .L3 标签之间的这些指令构成了执行 for 循环并累加从 1\
  \ 到 n 的整数序列的代码，如下所示：\n\n```\n.L2:\nmov eax, DWORD PTR [rbp-4]\npop rbp\nret\n```\n\
  \n图 8.7：for 循环的汇编代码\n\n这称为函数尾声。首先，要返回的值 ret 被移入 eax 寄存器——这里通常是存放函数返回值的寄存器。然后，栈帧被重置，最后\
  \ ret 从 sum() 函数返回。\n\n> 注意\n> 上述汇编列表中的 “ret” 是 RETURN 指令的助记符，不应与我们 C++ 代码示例中的 “ret”\
  \ 变量混淆。\n\n要弄清一段汇编指令序列的作用并非易事，但通过观察以下几点，可以大致了解源代码与指令之间的映射关系：\n\n+   - 代码中的常量值可以在汇编中直接识别出来。\n\
  +   - 诸如 add、sub、imul、idiv 等算术运算可以被识别。\n+   - 条件跳转对应于循环和条件语句。\n+   - 函数调用可以直接读出（函数名称会出现在汇编代码中）。\n\
  \n现在，让我们观察一下，如果在右上角的编译器选项字段中添加一个优化编译标志，代码会产生什么效果：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_566_0.png)\n\
  \n图 8.8：添加优化编译标志\n\n在上面的截图中，O3 表示最大优化。其他标志，如 -mno-avx、-mno-sse 和 -mno-sse2，用于防止编译器生成与当前示例无关的向量指令。我们可以看到，编译器不再访问内存，而只使用寄存器。注意这一行\
  \ xor eax, eax，其效果是将 0 存入 eax——这比从内存中加载常量 0 到寄存器更高效。由于访问内存需要数个时钟周期（从 5 到 100 个时钟周期不等），仅使用寄存器本身就能带来巨大的加速。\n\
  \n\n\n\n\n当下拉菜单中的编译器更改为 x86-64 clang 8.0.0 时，汇编代码发生了变化，可以在下面的截图中看到：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_567_0.png)\n\
  \n**Figure 8.9:** 使用新编译器的汇编代码\n\n在前面的汇编列表中，注意到没有以 J 开头的指令（用于跳转）。因此，根本没有循环结构！让我们来看看编译器是如何计算\
  \ 1 到 n 的和的。如果 n 的值 <= 0，则它会跳转到 .LBB0_1 标签处退出，返回 0。让我们分析以下指令：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_567_1.png)\n\
  \n**Figure 8.10:** 使用新编译器的汇编代码\n\n以下代码是前面指令的 C 等价物。请记住 n 在 EDI 寄存器中（因此也在 RDI 寄存器中，因为它们重叠）：\n\
  \n```\neax = n - 1;\necx = n - 2;\nrcx *= rax;\nrcx >>= 1;\neax = rcx + 2 * n;\n\
  eax--;\nreturn eax;\n```\n\n或者，如果我们将其写成一行，它看起来像这样：\n\n```\nreturn ((n-1) * (n-2)\
  \ / 2) + (n * 2) - 1;\n```\n\n如果我们简化这个表达式，我们得到以下内容：\n\n```\n((n^2 - 3n + 2) / 2)\
  \ + 2n - 1\n```\n\n或者，我们可以按以下格式编写：\n\n```\n((n^2 - 3n + 2) + 4n - 2) / 2\n```\n\n\
  这可以简化为以下内容：\n\n```\n(n^2 + n) / 2\n```\n\n或者，我们可以写成以下形式：\n\n```\n(n * (n+1)) / 2\n\
  ```\n\n这是从 1 到 n 包含求和的闭式方程，也是计算它的最快方法。编译器非常聪明——它不仅仅逐行查看我们的代码，而是推断出我们循环的效果是计算和，并且自行推导出代数。它没有推导出最简单的可能表达式，而是推导出一个等价的、需要额外几次操作的表达式。尽管如此，去除循环使此函数非常优化。\n\
  \n如果我们修改 for 循环中 i 变量的初始值或最终值以创建不同的求和，编译器仍然能够执行必要的代数操作来推导出不需要循环的闭式解。\n\n这只是编译器变得极其高效且几乎显得智能的一个例子。然而，我们必须明白，这种对求和的特定优化是专门编程到\
  \ clang 编译器中的。它并不意味着编译器可以对任何可能的循环计算都做这种技巧——这实际上需要编译器具备通用人工智能，以及世界上所有的数学知识。\n\n让我们探索另一个通过生成的汇编代码进行的编译器优化示例。看下面的代码：\n\
  \n```\n#include <vector>\n\nint three()\n{\n    const std::vector<int> v = {1, 2};\n\
  \    return v[0] + v[1];\n}\n```\n\n在编译器选项中，如果我们选择 x86-64 clang 8.0.0 编译器并添加 -O3\
  \ -stdlib=libc++，则会生成以下汇编代码：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_569_0.png)\n\
  \n**Figure 8.11:** 使用新编译器生成的汇编代码\n\n正如你在前面的截图中看到的，编译器正确地决定向量与函数无关并移除了所有负担。它还在编译时完成了加法并直接使用结果\
  \ 3 作为常量。从本节中需要带走的主要内容如下：\n\n- 在正确的选项下，编译器在优化代码时可以极其聪明。\n- 研究生成的汇编代码对于高层次估计执行复杂度非常有用。\n\
  - 任何 C++ 程序员都很有价值地具备机器代码如何工作的基本理解。\n\n在下一节中，我们将学习手动执行计时。\n\n## Manual Execution\
  \ Timing\n\n这是快速计时小型程序的最简单方法。我们可以使用命令行工具来测量程序执行所需的时间。在 Windows 7 及以上版本中，可以使用以下 PowerShell\
  \ 命令：\n\n```\npowershell -Command \"Measure-Command {<your program and arguments\
  \ here>}\"\n```\n\n在 **Linux**、**macOS** 和其他 **UNIX-like** 系统上，可以使用 `time` 命令：\n\
  \n`time <your program and arguments here>`\n\n在下一节中，我们将实现一个小型程序并检查关于一般计时程序执行的一些注意事项。\n\
  \n### Exercise 1: Timing a Program's Execution\n\n在本练习中，我们将编写一个程序对数组进行求和。这里的想法是计时求和函数。当我们希望在隔离状态下测试一个函数时，此方法很有用。因此，测试程序的唯一目的是执行单个函数。由于计算非常简单，我们需要多次运行该函数才能获得可测量的执行时间。在这种情况下，我们只需从\
  \ `main()` 函数调用 `sumVector()` 函数，并传递一个随机整数的 `std::vector`。\n\n> **Note**\n>\n> 一个旨在测试单个函数的程序有时被称为\
  \ **driver program**（不要与设备驱动程序混淆）。\n\n执行以下步骤完成此练习：\n\n1. 创建一个名为 **Snippet1.cpp**\
  \ 的文件。\n2. 定义一个名为 `sumVector` 的函数，在循环中对每个元素求和：\n\n```\nint sumVector(std::vector<int>\
  \ &v)\n{\n    int ret = 0;\n    for(int i: v)\n    {\n        ret += i;\n    }\n\
  \n    return ret;\n}\n```\n\n从前面的输出来看，它似乎仍然花费完全相同的时间。这似乎不可能，但实际上发生的是，由于我们从未在程序中引起任何副作用，例如打印和，编译器可以自由地将我们的代码替换为空程序。在功能上，根据\
  \ C++ 标准，此程序和空程序是相同的，因为运行它没有任何副作用。\n\n8. 打开 Compiler Explorer 并粘贴整个代码。将编译器选项设置为\
  \ **-O3** 并观察生成的代码：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_573_0.png)\n\n**Figure\
  \ 8.15:** Compiler Explorer 中的 Snippet1.cpp 代码\n\n正如你在前面的截图中看到的，**for** 循环内的行没有颜色编码，并且没有为它们生成汇编代码。\n\
  \n9. 修改代码以确保必须执行求和，通过打印依赖于计算的值的以下行：\n\n```\nstd::cout<<\"Total:\"<<total<<std::endl;\n\
  ```\n\n10. 在这里，我们只是多次将 `sumVector()` 的结果求和到一个虚拟的 double 值并打印它。修改代码后，打开终端并写入以下命令：\n\
  \n```\n$ g++ -O3 Snippet1.cpp\n$ time ./a.out\n```\n\n前一个命令的输出如下：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_574_0.png)\n\
  \n**Figure 8.16:** 使用打印值的副作用计时 Snippet1.cpp 代码的输出\n\n在前面的输出中，我们可以看到程序实际上执行了计算，而不是作为空程序运行。将总和打印到\
  \ `cout` 是一个副作用，会导致编译器不省略代码。引起一个依赖于代码执行的副作用（例如打印结果）是防止编译器优化器删除代码的一种方法。在下一节中，我们将学习如何在没有副作用的情况下计时程序。\n\
  \n### Timing Programs without Side Effects\n\n正如前面的练习所示，我们需要在程序中创建一个副作用（使用 `cout`），以便编译器不会忽略我们编写的所有代码。另一种让编译器相信某段代码具有副作用的技术是将结果赋给一个\
  \ volatile 变量。volatile 限定符告诉编译器：“此变量必须始终从内存中读取并写入内存，而不是从寄存器中读取。” volatile 变量的主要目的是访问设备内存，而此类设备内存访问必须遵循上述规则。有效地，编译器将\
  \ volatile 变量视为可能因当前程序之外的效果而改变，因此永远不会被优化。我们将在即将到来的章节中使用此技术。\n\n还有更高级的方法可以绕过此问题，即通过指定特殊的汇编代码指令给编译器而不是使用副作用。但它们超出了本入门材料的范围。对于以下示例，我们将始终添加代码以确保函数的结果在副作用中使用或被赋给\
  \ volatile 变量。在未来的章节中，我们将学习如何检查编译器生成的汇编代码并检测编译器为优化目的省略代码的实例。\n\n\n\n\n# 源代码插桩\n\n\
  **插桩**（Instrumentation）是一个术语，指的是在不改变程序行为的前提下，向程序中添加额外代码，并在程序执行时捕获信息的过程。这可能包括性能计时（以及其他测量，如内存分配或磁盘使用模式）。在源代码插桩的情况下，我们手动添加代码来对程序执行进行计时，并在程序结束时记录这些数据以供分析。这种方法的优点是它具有可移植性，并且无需任何外部工具。它还允许我们选择性地将计时添加到我们选择的任何代码部分。\n\
  \n### 练习 2：编写代码计时器类\n\n在本练习中，我们将创建一个 **RAII** 类，用于测量各个代码块的执行时间。我们将在后续练习中将其作为代码的主要计时机制。它不如其他性能测量方法复杂，但更易于使用，并能满足大多数需求。我们类的基本要求如下：\n\
  \n- 我们需要能够记录一个代码块所花费的累计时间。\n- 我们需要能够记录它被调用的次数。\n\n执行以下步骤以完成本练习：\n\n1. 创建一个名为 **Snippet2.cpp**\
  \ 的文件。\n2. 包含以下头文件：\n\n```\n#include <map>\n#include <string>\n#include <chrono>\n\
  #include <iostream>\n#include <cstdint>\n\nusing std::map;\nusing std::string;\n\
  using std::cerr;\nusing std::endl;\n```\n\n3. 通过编写以下代码来定义 **Timer** 类及类的成员函数：\n\n\
  ```\nclass Timer\n{\n    static map<string, int64_t> ms_Counts;\n    static map<string,\
  \ int64_t> ms_Times;\n    const string &m_sName;\n    std::chrono::time_point<std::chrono::high_resolution_clock>\
  \ m_tmStart;\n```\n\n如前面的代码所示，类成员由一个名称、一个起始时间戳和两个**静态映射**组成。此类的每个实例都用于对某个代码块进行计时。该代码块可以是函数作用域，也可以是任何其他由花括号分隔的块。用法模式是在代码块顶部定义一个\
  \ **Timer** 类的实例，同时传入一个名称（可以是函数名或其他方便的标签）。实例化时，会记录当前时间戳；当代码块退出时，此类的析构函数会记录该代码块累计经过的时间，以及该代码块执行的次数。时间和次数分别存储在静态映射\
  \ **ms_Times** 和 **ms_Counts** 中。\n\n4. 通过编写以下代码来定义 **Timer** 类的构造函数：\n\n```\npublic:\n\
  \    // When constructed, save the name and current clock time\n    Timer(const\
  \ string &sName): m_sName(sName)\n    {\n        m_tmStart = std::chrono::high_resolution_clock::now();\n\
  \    }\n```\n\n5. 通过编写以下代码来定义 **Timer** 类的析构函数：\n\n```\n// When destroyed, add the\
  \ time elapsed and also increment the count under this name\n~Timer()\n{\n    auto\
  \ tmNow = std::chrono::high_resolution_clock::now();\n    auto msElapsed = std::chrono::duration_cast<std::chrono::milliseconds>(tmNow\
  \ - m_tmStart);\n    ms_Counts[m_sName]++;\n    ms_Times[m_sName] += msElapsed.count();\n\
  }\n```\n\n在前面的代码中，经过的时间以毫秒为单位计算。然后，我们将其累加到该代码块名称对应的累计经过时间中，并增加该代码块被执行的次数计数。\n\n\
  6. 定义一个名为 dump() 的静态函数，用于打印计时结果的摘要：\n\n```\n// Print out the stats for each measured\
  \ block/function\nstatic void dump()\n{\n    cerr << \"Name\\t\\t\\tCount\\t\\t\\\
  tTime(ms)\\t\\tAverage(ms)\\n\";\n    cerr << \"-------------------------------------------------------------------------------\\\
  n\";\n    for(const auto& it: ms_Times)\n    {\n        auto iCount = ms_Counts[it.first];\n\
  \        cerr << it.first << \"\\t\\t\\t\" << iCount << \"\\t\\t\\t\" << it.second\
  \ << \"\\t\\t\\t\" << it.second / iCount << \"\\n\";\n    }\n};\n```\n\n在前面的代码中，名称、执行次数、总时间和平均时间以表格形式打印。我们在字段名称和字段值之间使用多个制表符，以使它们在控制台上垂直对齐。这个函数可以根据我们的需要修改。例如，我们可以修改这段代码，将输出转储为\
  \ CSV 文件，以便将其导入电子表格进行进一步分析。\n\n7. 最后，定义静态成员以完成该类：\n\n```\n// Define static members\n\
  map<string, int64_t> Timer::ms_Counts;\nmap<string, int64_t> Timer::ms_Times;\n\
  const int64_t N = 1'000'000'000;\n```\n\n8. 既然我们已经定义了 Timer 类，现在定义两个简单的函数作为示例来进行计时。一个函数执行加法，另一个执行乘法。由于这些操作很简单，我们将循环\
  \ 10 亿次，以便获得一些可测量的结果。\n\n### 注意\n\nC++ 14 及更高版本允许我们在整数常量中使用单引号以提高可读性；例如，我们可以写 1'000'000\
  \ 而不是 1000000。\n\n编写加法和乘法函数。这两个函数分别对从 1 到 N 的整数进行加法和乘法：\n\n```\nunsigned int testMul()\n\
  {\n    Timer t(\"Mul\");\n\n    unsigned int x = 1;\n    for(int i = 0; i < N; ++i)\n\
  \    {\n        x *= i;\n    }\n\n    return x;\n}\n```\n\n```\nunsigned int testAdd()\n\
  {\n    Timer t(\"Add\");\n\n    unsigned int x = 1;\n    for(int i = 0; i < N; ++i)\n\
  \    {\n        x += i;\n    }\n\n    return x;\n}\n```\n\n在前面的代码中，我们对反复进行加法/乘法的变量使用了\
  \ unsigned int。我们使用无符号类型是为了确保算术运算中的溢出不会导致未定义行为。如果我们使用有符号类型，程序将具有未定义行为，并且无法保证以任何方式正常工作。其次，我们从\
  \ testAdd() 和 testMul() 函数返回计算值，以确保编译器不会删除代码（因为没有副作用）。为了对这些函数进行计时，我们只需在函数开头声明一个带有适当标签的\
  \ Timer 类实例即可。计时在 Timer 对象实例化时立即开始，并在该对象超出作用域时停止。\n\n在前面的输出中，请注意现在打印的是实际函数名。使用这个宏的另一个优点是，我们可以默认将其添加到所有可能耗时的函数中，并在生产构建中通过简单地将定义改为空操作来禁用它，这样计时代码将永远不会运行——从而避免了大量编辑代码的需要。在接下来的练习中，我们将使用这个相同的\
  \ Timer 类对代码进行计时。\n\n## 运行时性能分析\n\n**性能分析**（Profiling）是一种非侵入式地测量程序中函数性能的方法。分析器通过频繁地采样程序当前的执行地址（每秒数百次）并记录当时正在执行的函数来工作。这是一种具有合理准确度的统计采样方法。不过，有时结果可能会令人困惑，因为程序可能会在属于操作系统内核的函数上花费大量时间。Linux\
  \ 上最流行的运行时分析工具是 **perf**。在下一节中，我们将使用 perf 来分析我们的程序。\n\n### 练习 3：使用 perf 分析程序\n\n\
  **perf** 可以通过以下方式安装在 **Ubuntu** 上：\n\n```\napt-get install linux-tools-common linux-tools-generic\n\
  ```\n\n为了熟悉使用 **perf** 的基础知识，我们将借助 **perf** 工具对上一个练习中的程序进行分析。执行以下步骤以完成本练习：\n\n1.\
  \ 打开我们在上一个练习中创建的 **Snippet2.cpp** 文件，并从两个函数中移除 **TIME_IT** 宏。\n2. 打开终端，使用 **-O3**\
  \ 标志重新编译代码，然后使用 **perf** 创建性能分析数据样本，如下所示：\n\n```\n$ g++ -O3 Snippet2.cpp\n$ perf\
  \ record ./a.out\n```\n\n前一个命令的输出如下：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_581_0.png)\n\

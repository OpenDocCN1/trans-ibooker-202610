  - 2. 编写一个基本的词计数函数。逻辑非常简单——对于字符串中的每个字符，如果该字符不是空白且下一个是，则它是单词的结尾，应计数。由于我们的样板代码已添加了空格，任何最终单词都将被计数。此函数定义在\
  \ Snippet13.cpp 中：\n\n```\nint wordCount(const std::string &s)\n{\n    int count\
  \ = 0;\n    for(int i = 0, j = 1; i < s.size() - 1; ++i, ++j)\n    {\n        if(!isspace(s[i])\
  \ && isspace(s[j]))\n        {\n            ++count;\n        }\n    }\n    return\
  \ count;\n}\n```\n\n- 3. 让我们编译、运行并了解性能。我们将通过将我们的代码结果与标准 wc 程序的结果进行比较来验证其是否正确：\n\n\

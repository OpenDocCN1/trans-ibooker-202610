  \n图 5.10：存在竞争条件时的练习执行結果\n\n在此练习中，我们考虑了“检查后执行”类型的竞争条件。我们为线程设置了睡眠时间以模拟操作系统中断，但在真实程序中，这种情况可能发生也可能不发生。一切都取决于操作系统及其调度程序。这使得调试和修复竞争条件变得异常困难。为了避免此示例中的竞争条件，我们可以采取几种方式：\n\
  \n+   - 将变量的副本传递给线程函数，而不是传递引用。\n+   - 使用标准库原语同步线程之间对共享变量的访问。\n+   - 在主线程将 dividend\
  \ 值更改为 0 之前加入子线程。\n\n让我们再看看几种修复此竞争条件的方法。它们都取决于你尝试实现的一个任务。在下一节中，我们将考虑 C++ 标准库提供的同步原语。\n\
  \n如果线程 B 先执行，会出现困难。它会导致线程 B 在线程 A 读取之前更改值。线程执行的顺序应严格保证。线程 B 只有在线程 A 读取其值之后才能将新值写入变量。以下图表将帮助你澄清导致数据危险的\
  \ RAW 数据依赖：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_370_0.png)\n\n图 5.12：两个线程之间的\
  \ WAR 数据依赖\n\n## WAW Dependency\n\nWAW 依赖发生在多个线程更改同一变量的值，并且某些线程为其计算而读取时。例如，线程 A\
  \ 执行其工作并将结果写入变量。线程 B 读取变量的值并执行其工作。线程 C 执行其工作并将结果写入同一变量。用伪代码表示如下：\n\n```\nThread\
  \ A: a = doSomeStuff();\nThread B: b = a - doOtherStuff();\nThread C: a = doNewStuff();\n\
  ```\n\n如果 **Thread C** 在线程 A 和 B 之前执行，会出现困难。这导致 **Thread B** 读取了它不期望读取的值。线程执行的顺序应严格保证。**Thread\
  \ C** 必须在 **Thread A** 写入其值并且 **Thread B** 已读取它之后，才能将新值写入变量。以下图表将帮助你澄清导致数据危险的 WAW\
  \ 数据依赖：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_371_0.png)\n\n图 5.13：两个线程之间的\
  \ WAW 数据依赖\n\n## Resource Synchronization\n\n为防止竞争和数据危险，存在一种共享数据锁定机制，其中一个流打算更改或读取这些数据。该机制称为\
  \ **resource synchronization**。对于同步，我们需要分配更改或读取共享资源的代码块。这样的代码块称为 **critical sections**。同步包括在其中一个线程进入时阻塞关键区。其他也打算执行此关键区代码的线程将被阻塞。当执行关键区的线程离开时，锁将被释放。然后，故事将与下一个线程重复。\n\
  \n\n\n\n\n## 事件同步\n\n线程工作同步还有另一种机制——事件同步。这意味着线程工作的同步，其中一个线程在另一个线程发出某个事件的信号之前暂停其工作。例如，有线程\
  \ A，它从另一个进程接收消息。它将消息写入队列并等待新消息。还有另一个线程，线程 B，处理这些消息。它从队列中读取消息并对其执行某些操作。当没有消息时，线程\
  \ B 处于休眠状态。当线程 A 收到新消息时，它唤醒线程 B 并处理它。下面的图表清晰地说明了两个线程的事件同步：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_374_0.png)\n\
  \n图 5.15：两个线程的事件同步\n\n然而，即使在同步代码中，另一个导致竞态条件的原因也可能出现——类的有缺陷的接口。为了理解这是什么，让我们考虑以下示例：\n\
  \n```\nclass Messages\n{\n    public:\n    Messages(const int& size)\n    : ArraySize(size)\n\
  \    , currentIdx(0)\n```\n\n```\n}\n\n}));\n\nthr1.detach();\nthr2.detach();\n\
  using namespace std::chrono_literals;\nstd::this_thread::sleep_for(2s);\nreturn\
  \ 0;\n}\n```\n\n这里，我们创建了一个 **msgs** 变量，然后创建了第一个线程，该线程向 **msgs** 推送值。然后，我们创建了第二个线程，该线程从数组中弹出值并将其分离。即使我们使用锁定机制保护所有函数，其中一个线程也可以检查数组的大小并被操作系统中断。此时，另一个线程可以更改数组。当第一个线程继续其工作时，它可能尝试向已满的数组推送或从空数组弹出。因此，同步仅在与良好的设计配对时才有效。\n\
  \n## 死锁\n\n还有一个同步问题。让我们回到哲学家就餐的例子。原始问题是其中一位哲学家只有一根筷子。因此，他们可以通过相互分享筷子一口一口地吃寿司。虽然他们完成寿司需要很长时间，但他们都会吃饱。但是如果他们同时拿起一根筷子并且不愿意分享第二根筷子，他们将无法吃寿司，因为他们每个人都在永远等待第二根筷子。这导致了\
  \ **死锁**。这发生在两个线程都在等待另一个线程继续其工作时。死锁的原因之一是当一个线程加入另一个线程时，但另一个线程加入第一个线程。因此，当两个线程相互加入时，它们都无法继续工作。让我们考虑以下死锁示例：\n\
  \n```\n#include <thread>\n\nstd::thread* thr1;\n\nstd::thread* thr2;\n\nvoid someStuff()\n\
  {\n    thr1->join();\n```\n\n```\nstd::thread thr5(someFunc);\n\nthr1.join();\n\n\
  thr2.join();\nthr3.join();\nthr4.join();\nthr5.join();\n```\n\n但更方便的是将一堆线程存储在 STL\
  \ 容器中，例如线程的 vector：\n\n```\nstd::vector<std::thread> threads;\n```\n\nSTL 容器不能与不支持复制语义的对象一起使用。得益于移动语义，我们可以将具有移动构造函数和移动赋值运算符的不可复制对象存储在容器中。然后，我们可以使用\
  \ std::move() 函数使用线程的 vector。要在容器中初始化线程，我们可以做如下操作：\n\n```\nfor (int i = 0; i < 10;\
  \ i++)\n{\n    auto t = std::thread([i]()\n    {\n        std::cout << \"thread:\
  \ \" << i << \"\\n\";\n    });\n    threads.push_back(std::move(t));\n}\n```\n\n\
  然后，我们可以加入或分离它们全部：\n\n```\nfor (auto& thr: threads)\n{\n    if (thr.joinable())\n\
  \    {\n        thr.join();\n    }\n}\n```\n\n移动语义在我们将 std::thread 对象存储为类成员时也很有用。在这种情况下，我们应该仔细设计我们的类，删除复制构造函数和赋值运算符，并实现新的移动构造函数和移动赋值运算符。让我们考虑以下此类类的代码示例：\n\
  \n```\nclass Handler\n{\n    std::thread threadHandler;\n\npublic:\n    Handler(const\
  \ Handler&) = delete;\n    Handler& operator=(const Handler&) = delete;\n\n    Handler(Handler\
  \ && obj)\n    : threadHandler(std::move(obj.threadHandler))\n    {}\n    Handler\
  \ & operator=(Handler && obj)\n    {\n        if (threadHandler.joinable())\n  \
  \      {\n            threadHandler.join();\n        }\n        threadHandler =\
  \ std::move(obj.threadHandler);\n        return *this;\n    }\n    ~Handler()\n\
  \    {\n        if (threadHandler.joinable())\n        {\n            threadHandler.join();\n\
  \        }\n    }\n};\n```\n\n```\nstd::cout << \"Handler& operator=(const Handler&)\"\
  \ << std::endl;\n    return *this;\n}\nHandler(Handler && obj)\n{\n    std::cout\
  \ << \"Handler(Handler && obj)\" << std::endl;\n}\nHandler & operator=(Handler &&\
  \ obj)\n{\n    std::cout << \"Handler & operator=(Handler && obj)\" << std::endl;\n\
  \    return *this;\n}\n~Handler()\n{\n    std::cout << \"~Handler()\" << std::endl;\n\
  }\n};\n```\n\n3. 实现 doSomeJob() 函数，它在这里实际上什么都不做，只是打印日志消息：\n\n```\nvoid doSomeJob(Handler&&\
  \ h)\n{\n    std::cout << \"I'm here\" << std::endl;\n}\n```\n\n4. 进入 main() 函数并创建\
  \ Handler 类型的 handler 变量。创建 thr1，传递 doSomeJob() 函数，并移动 handler 变量：\n\n```\nHandler\
  \ handler;\nstd::thread thr1(doSomeJob, std::move(handler));\n```\n\n5. 分离 thr1\
  \ 线程并为主线程添加少量休眠以避免关闭应用程序。我们将能够看到来自分离线程的输出：\n\n```\nthr1.detach();\nusing namespace\
  \ std::chrono_literals;\nstd::this_thread::sleep_for(5s);\n```\n\n6. 在你的编辑器中运行此代码。在终端日志中，从默认构造函数，你将看到来自移动运算符的两个日志，一个来自析构函数的日志，来自\
  \ doSomeJob() 函数的消息，最后来自析构函数的另外两个日志消息。我们可以看到移动构造函数被调用了两次。\n\n你将得到以下输出：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_383_0.png)\n\
  \n图 5.16：练习执行的結果\n\n正如你所见，Handler 对象被移动到线程函数中。尽管如此，所有未使用 std::ref() 函数传递的参数都被复制到线程的内存中。\n\
  \n让我们考虑一个有趣的问题。正如你可能记得的，当我们初始化 std::thread 时，所有构造函数参数都被复制到线程内存中，包括可调用对象——lambda、函数或\
  \ std::function。但如果我们的可调用对象不支持复制语义会怎样？例如，我们创建了一个类，它只有移动构造函数和移动赋值运算符：\n\n```\nclass\
  \ Converter\n{\n    public:\n\n    Converter(Converter&&)\n    {\n    }\n\n    Converter&\
  \ operator=(Converter&&)\n    {\n        return *this;\n    }\n\n    Converter()\

  \n## 单元测试\n\n单元测试是编程中的重要组成部分。基本上，单元测试是使用我们的类在各种场景下使用预期结果的小程序，位于项目中平行的文件层次结构中，并且不会最终进入实际的可执行文件，而是在开发过程中由我们单独执行，以确保我们的代码以预期方式运行。我们应该为我们的\
  \ C++ 程序编写单元测试，以确保它们在每次更改后按预期运行。\n\n## 为单元测试做准备\n\n我们可以使用 CMake 使用多个 C++ 测试框架。我们将使用\
  \ Google Test，它相对于其他选项有几个好处。在下一个练习中，我们将使用 Google Test 为项目准备单元测试。\n\n6. 创建一个 tests/CanTest.cpp\
  \ 文件。添加此代码以简单地验证测试正在运行，而不实际测试我们实际项目中的任何内容：\n\n```\n#include \"gtest/gtest.h\"\n\n\
  namespace {\n\nclass CanTest: public ::testing::Test {};\n\nTEST_F(CanTest, CanReallyTest)\
  \ {\n    EXPECT_EQ(0, 0);\n}\n\n}\n\nint main(int argc, char **argv) {\n    ::testing::InitGoogleTest(&argc,\
  \ argv);\n    return RUN_ALL_TESTS();\n}\n```\n\nTEST_F 行是一个单独的测试。现在，EXPECT_EQ(0,\
  \ 0) 正在测试零是否等于零，如果我们确实可以运行测试，这将始终成功。我们稍后将在这里添加我们自己的类的结果以针对各种值进行测试。现在我们已在项目中为 Google\
  \ Test 做好了必要的设置。接下来，我们将构建和运行这些测试。\n\n## 构建、运行和编写单元测试\n\n现在，我们将讨论如何构建、运行和编写单元测试。我们到目前为止的示例是一个简单的虚拟测试，准备好构建和运行。稍后，我们将添加更有意义的测试并查看通过和失败测试的输出。在以下练习中，我们将为我们在上一个练习中创建的项目构建、运行和编写单元测试。\n\

  \ 用于 I/O 文件库支持：\n\n```\n```cpp\n#include <fstream>\n#include <iostream>\n#include\
  \ <string>\n```\n```\n\n- 2. 实现 **Book** 类，表示书店中的图书。在私有部分，定义四个具有自解释名称的变量：**m_Name**、**m_Author**、**m_Year**\

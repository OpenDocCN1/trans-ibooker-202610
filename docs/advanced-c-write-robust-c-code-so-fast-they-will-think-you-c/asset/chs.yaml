  \        structOfArr.field2.push_back(temp.field2);\n        structOfArr.field3.push_back(temp.field3);\n\
  \    }\n    Sum s1 = sumAOS(arrOfStruct);\n    Sum s2 = sumSOA(structOfArr);\n \

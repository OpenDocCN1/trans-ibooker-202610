  \n图 1.52：带有新表达式的表达式视图\n\n你可以在工具栏中按下红色方块或选择 **Run | Terminate** 来随时停止调试。另一个功能是断点，它告诉调试器在执行到标记有断点的行时暂停。到目前为止，我们是一行一行地逐步执行代码，这在大型项目中可能非常耗时。相反，你通常希望继续执行，直到到达你感兴趣的代码。\n\

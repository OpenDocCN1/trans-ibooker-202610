  \n图 8.48：Snippet16.cpp 中代码在并行化标准库下的输出\n\n这个版本也能看到类似的改进。我们完成了吗？还是可以更快？著名游戏程序员 Michael\
  \ Abrash 提出了缩写词 TANSTAAFC——它代表\"There ain't no such thing as the fastest code\"\
  （不存在最快的代码）。他的意思是，只要付出足够的努力，代码总是有可能变得更快。这似乎不可能，但人们一次又一次地找到了越来越快的计算方法——我们的代码也不例外，我们还可以更进一步。我们可以为优化做出的一种权衡是降低代码的通用性——我们已经对代码施加了一些约束——例如，我们只处理\
  \ ASCII 英文文本。通过对输入数据添加更多约束，我们可以做得更好。假设文件中没有不可打印字符。对于我们的输入数据来说，这是一个合理的假设。如果我们这样假设，那么就可以简化检测空白的条件——由于所有空白字符都大于或等于\
  \ ASCII 32，我们可以完全省去查找表。\n\n- 13. 让我们基于之前的想法实现代码（完整代码可在 Snippet18.cpp 中找到）：\n\n```cpp\n\
  int wordCount(const std::string &s)\n{\n    auto isWordEnd = [&](char a, char b)\n\
  \    {\n        return a > 32 & b < 33;\n    };\n    return std::inner_product(s.begin(),\
  \ s.end()-1, s.begin()+1, 0,\n    std::plus<int>(), isWordEnd);\n}\n```\n\n- 14.\

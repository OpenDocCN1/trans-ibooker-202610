  在此练习中，我们练习了如何创建仅可移动对象的 STL 容器。我们还考虑了如何将不可复制的对象传递给线程构造函数。这些知识将在下一节帮助我们学习如何从线程获取结果。\n\
  \n## Futures、Promises 和 Async\n\n在上一节中，我们学习了几乎所有使用线程所需的内容。但我们仍有一些有趣的内容需要考虑，即使用未来结果同步线程。当我们考虑条件变量时，我们没有涵盖使用未来结果的第二种同步类型。现在是学习的时候了。\n\
  \n假设存在一种情况，我们运行某个线程并继续其他工作。当我们需要结果时，我们停止并检查它是否已准备好。这种情况描述了实际使用未来结果的工作方式。在 C++ 中，我们有一个名为\
  \ <future> 的头文件，其中包含两个表示未来结果的模板类：std::future<> 和 std::shared_future<>。我们使用 std::future<>\
  \ 当我们需要单个未来结果时，使用 std::shared_future<> 当我们需要多个有效副本时。我们可以将它们与 std::unique_ptr 和 std::shared_ptr\
  \ 进行比较。\n\n为了使用未来结果，我们需要一种特殊机制在后台运行任务并稍后接收结果：std::async() 模板函数。它接收一个可调用对象作为参数，以及启动模式\
  \ – deferred 或 async，以及可调用对象的参数。启动模式 std::launch::async 和 std::launch::deferred\
  \ 表示如何执行任务。当我们传递 std::launch::async 时，我们期望该函数在单独的线程中执行。当我们传递 std::launch::deferred\
  \ 时，函数调用将被延迟，直到我们请求结果。我们也可以同时传递两者，例如 std::launch::deferred|std::launch::async。这意味着运行模式将取决于实现。\n\
  \n现在，让我们考虑使用 std::future 与 std::async 的示例。我们有一个 toUppercase() 函数，将给定的字符串转换为大写：\n\
  \n```\nstd::string toUppercase(const std::string& bufIn)\n{\n    std::string bufferOut;\n\
  \    for (std::string::const_iterator iter = bufIn.begin(); iter != bufIn.end();\
  \ iter++)\n    {\n        if (*iter >= 97 && *iter <= 122)\n        {\n        \
  \    bufferOut += static_cast<char>(static_cast<int>(*iter) - 32);\n```\n```\n}\n\
  else\n{\n    bufferOut += *iter;\n}\n}\nreturn bufferOut;\n}\n```\n\n然后，在 main()\
  \ 函数中，我们创建一个名为 result 的 std::future 变量，并使用 std::async() 的返回值进行初始化。然后，我们通过 result\
  \ 对象的 get() 函数获取结果：\n\n```\n#include <iostream>\n#include <future>\n\nint main()\n\
  {\n    std::future<std::string> result = std::async(toUppercase, \"please, make\
  \ it uppercase\");\n    std::cout << \"Main thread isn't locked\" << std::endl;\n\
  \    std::cout << \"Future result = \" << result.get() << std::endl;\n    return\
  \ 0;\n}\n```\n\n实际上，这里我们创建了一个 future 对象：\n\n```\nstd::future<std::string> result\
  \ = std::async(toUppercase, \"please, make it uppercase\");\n```\n\n正如你所见，我们没有向\
  \ std::async() 函数传递启动模式，这意味着将使用默认模式：std::launch::deferred | std::launch::async。你可以显式地这样做：\n\
  \n```\nstd::future<std::string> result = std::async(std::launch::async, toUppercase,\
  \ \"please, make it uppercase\");\n```\n\n我们也可以使用 **std::future** 对象的 **share()**\
  \ 成员函数创建共享 future 对象：\n\n```\nstd::future<std::string> result = std::async(toUppercase,\
  \ \"please, make it uppercase\");\nstd::cout << \"Main thread isn't locked\" <<\
  \ std::endl;\n```\n\n```\nauto sharedResult = result.share();\nstd::cout << \"Future\
  \ result = \" << sharedResult.get() << std::endl;\n```\n\n请注意，在这两种情况下，**std::future**\
  \ 对象都变得无效。\n\n另一种从单独线程获取未来结果的方法是使用 **std::packaged_task<>** 模板类。我们如何使用它们？\n\n+ \
  \  1. 我们创建一个新的 **std::packaged_task** 并声明可调用函数的签名：\n+      ```\n+      std::packaged_task<std::string(const\
  \ std::string&)> task(toUppercase);\n+      ```\n+   2. 然后，我们将未来结果存储在 **std::future**\
  \ 变量中：\n+      ```\n+      auto futureResult = task.get_future();\n+      ```\n\
  +   3. 接下来，我们在单独的线程中运行此任务或将其作为函数调用：\n+      ```\n+      std::thread thr1(std::move(task),\
  \ \"please, make it uppercase\");\n+      thr1.detach();\n+      ```\n+   4. 最后，我们等待未来结果准备就绪：\n\
  +      ```\n+      std::cout << \"Future result = \" << futureResult.get() << std::endl;\n\
  +      ```\n\n> **注意**\n> \n> **std::packaged_task** 是不可复制的。因此，要在单独的线程中运行它，请使用 **std::move()**\
  \ 函数。\n\n\n\n\n还有一件重要的事情需要注意。如果你不想要线程的任何结果，而是希望等待线程完成其工作，你可以使用 **std::future<void>**。现在，当你调用\
  \ **future.get()** 时，当前线程将在此处等待。让我们看一个示例：\n\n```\n#include <iostream>\n#include\
  \ <future>\n\nvoid toUppercase(const std::string& bufIn)\n{\n    std::string bufferOut;\n\
  \    for (std::string::const_iterator iter = bufIn.begin(); iter != bufIn.end();\
  \ iter++)\n    {\n        if (*iter >= 97 && *iter <= 122)\n        {\n        \
  \    bufferOut += static_cast<char>(static_cast<int>(*iter) - 32);\n        }\n\
  \        else\n        {\n            bufferOut += *iter;\n        }\n    }\n  \
  \  using namespace std::chrono_literals;\n    std::this_thread::sleep_for(2s);\n\
  \    std::cout << bufferOut << std::endl;\n}\n\nint main()\n{\n    std::packaged_task<void(const\
  \ std::string&)> task(toUppercase);\n    auto futureResult = task.get_future();\n\
  \    std::thread thr1(std::move(task), \"please, make it uppercase\");\n```\n\n\
  使用 promise 获取结果的完整示例如下：\n\n```\n#include <iostream>\n#include <future>\n\nvoid toUppercase(const\
  \ std::string& bufIn, std::promise<std::string> result)\n{\n    std::string bufferOut;\n\
  \    for (std::string::const_iterator iter = bufIn.begin(); iter != bufIn.end();\
  \ iter++)\n    {\n        if (*iter >= 97 && *iter <= 122)\n        {\n        \
  \    bufferOut += static_cast<char>(static_cast<int>(*iter) - 32);\n        }\n\
  \        else\n        {\n            bufferOut += *iter;\n        }\n    }\n\n\
  \    result.set_value(bufferOut);\n}\n\nint main()\n{\n    std::promise<std::string>\
  \ stringInUpper;\n    std::future<std::string> futureRes = stringInUpper.get_future();\n\
  \    std::thread thr(toUppercase, \"please, make it uppercase\", std::move(stringInUpper));\n\
  ```\n\n```\nthr.detach();\nstd::cout << \"Main thread is not blocked here\" << std::endl;\n\
  futureRes.wait();\n\nstd::cout << \"Result = \" << futureRes.get() << std::endl;\n\
  return 0;\n}\n```\n\n所以，我们几乎涵盖了编写多线程应用程序所需的所有内容，除了一件重要的事情——如果在单独的线程中抛出异常会发生什么？例如，你在线程中传递一个函数，它抛出了一个异常。在这种情况下，将为该线程调用\
  \ std::terminate()。其他线程将继续执行它们的工作。让我们考虑一个简单的示例。\n\n我们有一个 getException() 函数，它生成一条包含线程\
  \ ID 的消息，并抛出 std::runtime_error：\n\n```\n#include <sstream>\n#include <exception>\n\
  #include <iostream>\n#include <future>\n\nstd::string getException()\n{\n    std::stringstream\
  \ ss;\n    ss << \"Exception from thread: \";\n    ss << std::this_thread::get_id();\n\
  \    throw std::runtime_error(ss.str());\n}\n```\n\n我们还有一个 toUppercase() 函数。它将给定的字符串转换为大写，并调用\
  \ getException() 函数，该函数会抛出异常：\n\n```\nstd::string toUppercase(const std::string&\
  \ bufIn)\n{\n    std::string bufferOut;\n    for (std::string::const_iterator iter\
  \ = bufIn.begin(); iter != bufIn.end(); iter++)\n```\n\n```\n{\n    if (*iter >=\
  \ 97 && *iter <= 122)\n    {\n        bufferOut += static_cast<char>(static_cast<int>(*iter)\
  \ - 32);\n    }\n    else\n    {\n        bufferOut += *iter;\n        getException();\n\
  \    }\n}\n\n    return bufferOut;\n}\n```\n\n下面是 main() 函数，我们在 try-catch 块中创建了一个新线程\
  \ thr。我们捕获异常并将消息打印到终端：\n\n```\nint main()\n{\n    try\n    {\n        std::thread\
  \ thr(toUppercase, \"please, make it uppercase\");\n        thr.join();\n    }\n\
  \    catch(const std::exception& ex)\n    {\n        std::cout << \"Caught an exception:\
  \ \" << ex.what() << std::endl;\n    }\n    return 0;\n}\n```\n\n如果你在 IDE 中运行这段代码，你将看到以下输出：\n\
  \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_399_0.png)\n\n图 5.19：示例执行的结果\n\n我们可以看到，在抛出异常后调用了\
  \ std::terminate()。当你的程序中有很多线程时，很难找到线程被终止的正确位置。幸运的是，我们有几种机制可以从另一个线程捕获异常。让我们逐一考虑。\n\
  \nstd::async 函数使用 future 结果将异常传递给调用线程。它将 std::exception_ptr 存储在 future 结果中，并设置 ready\
  \ 标志。然后，当你调用 get() 时，std::future 会检查是否存储了任何 std::exception_ptr，并重新抛出异常。我们需要做的就是在\
  \ try-catch 块中放置一个 get() 调用。让我们看一个示例。我们将使用前面示例中的两个辅助函数，即 getException() 和 toUppercase()。它们保持不变。在\
  \ main() 函数中，我们创建一个名为 result 的 std::future 对象，并使用 std::async() 函数运行 toUppercase()\
  \ 函数。然后，我们在 try-catch 块中调用 result 对象的 get() 函数并捕获异常：\n\n```\n#include <iostream>\n\
  \n#include <future>\n\nint main()\n{\n    std::future<std::string> result = std::async(toUppercase,\
  \ \"please, make it uppercase\");\n    try\n    {\n        std::cout << \"Future\
  \ result = \" << result.get() << std::endl;\n    }\n    catch(const std::exception&\
  \ ex)\n```\n\n```\n```cpp\n{\n    std::cout << \"Caught an exception: \" << ex.what()\
  \ << std::endl;\n}\nreturn 0;\n}\n```\n```\n\n如果你在 IDE 中运行上述代码，你将获得以下输出：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_400_0.png)\n\
  \n图 5.20：示例执行的结果\n\n正如你所看到的，我们捕获了一个异常，现在我们可以以某种方式处理它。**std::packaged_task<>** 类以同样的方式处理异常——它将\
  \ **std::exception_ptr** 存储在 future 结果中，设置 ready 标志，然后 **std::future** 在 **get()**\
  \ 调用中重新抛出异常。让我们考虑一个小示例。我们将使用前面示例中的两个辅助函数——**getException()** 和 **toUppercase()**。它们保持不变。在\
  \ **main()** 函数中，我们创建一个名为 **task** 的 **std::packaged_task** 对象。通过使用我们的 **toUppercase()**\
  \ 函数的类型，它返回一个整数并接受两个整数作为参数。我们将 **toUppercase()** 函数传递给 **task** 对象。然后，我们创建一个名为 **result**\
  \ 的 **std::future** 对象，并使用 **get_future()** 函数从 task 对象获取结果。最后，我们在新线程 **thr** 中运行\
  \ task 对象，并在 **try-catch** 块中调用 **result** 变量的 **get()** 函数：\n\n```\n```cpp\n#include\
  \ <iostream>\n\n#include <future>\n\nint main()\n{\n    std::packaged_task<std::string(const\
  \ std::string&)> task(toUppercase);\n    auto result = task.get_future();\n    std::thread\
  \ thr(std::move(task), \"please, make it uppercase\");\n    thr.detach();\n```\n\
  \n```\ntry\n{\n    std::cout << \"Future result = \" << result.get() << std::endl;\n\
  }\ncatch(const std::exception& ex)\n{\n    std::cout << \"Caught an exception: \"\
  \ << ex.what() << std::endl;\n}\nreturn 0;\n}\n```\n\n如果你在 IDE 中运行这段代码，你将获得以下输出：\n\
  \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_401_0.png)\n\n图 5.21：此示例执行的结果\n\n**std::promise<>**\
  \ 类以另一种方式处理异常。它允许我们使用 set_exception() 或 set_exception_at_thread_exit() 函数手动存储异常。要在\
  \ std::promise 中设置异常，我们必须捕获它。如果我们没有捕获异常，在 std::promise 的析构函数中，将在 future 结果中设置一个错误，即\
  \ std::future_errc::broken_promise。当你调用 get() 函数时，将重新抛出异常。让我们考虑一个示例。我们将使用前面示例中的辅助函数——getException()。它保持不变。但是，我们将更改\
  \ toUppercase() 函数并添加第三个参数 std::promise。现在，我们将在 try 块中调用 getException() 函数，捕获异常，并将其设置到\
  \ std::promise 值中：\n\n```\nvoid toUppercase(const std::string& bufIn, std::promise<std::string>\
  \ result)\n{\n    std::string bufferOut;\n    try\n    {\n```\n\n\n\n\n\n```\nfor\
  \ (std::string::const_iterator iter = bufIn.begin(); iter != bufIn.end(); iter++)\n\
  {\n    if (*iter >= 97 && *iter <= 122)\n    {\n        bufferOut += static_cast<char>(static_cast<int>(*iter)\
  \ - 32);\n    }\n    else\n    {\n        bufferOut += *iter;\n        getException();\n\
  \    }\n}\n}\ncatch(const std::exception& ex)\n{\n    result.set_exception(std::make_exception_ptr(ex));\n\
  }\n\nresult.set_value(bufferOut);\n}\n```\n\n## 注意\n\n有几种方法可以将异常设置到 promise 中。首先，我们可以捕获\
  \ std::exception，并使用 std::make_exception_ptr() 函数将其转换为 std::exception_ptr。还可以使用\
  \ std::current_exception() 函数，该函数会返回 std::exception_ptr 对象。\n\n如果你在 IDE 中运行此代码，你将获得以下输出：\n\
  \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_404_0.png)\n\n图5.22：此示例执行的结果\n\n以上就是多线程应用程序中处理异常的全部内容。如你所见，这与我们在单线程中所做的非常相似。现在，让我们将所学知识付诸实践，编写一个简单的应用程序示例，演示如何使用不同的\
  \ future 结果进行同步。\n\n### 练习5：使用 future 结果进行同步\n\n在本练习中，我们将编写一个简单应用程序，演示如何使用 future\
  \ 结果从各个线程接收值。我们将运行 ToUppercase() 可调用对象三次。第一个任务使用 std::async() 函数执行，第二个任务使用 std::packaged_task<>\
  \ 模板类执行，最后一个任务使用 std::thread 和 std::promise 执行。\n\n执行以下步骤以完成此练习：\n\n+   1. 包含线程支持的头文件\
  \ <thread>、流支持的头文件 <iostream>，以及用于 future 结果支持的 <future>：\n\n```\n#include <iostream>\n\
  #include <thread>\n#include <future>\n```\n\n+   2. 实现一个 ToUppercase 类，用于将给定字符串转换为大写。它有两个重载的\
  \ operator() 运算符。第一个 operator() 接受要转换的字符串并返回大写的结果值。第二个 operator() 接受要转换的字符串和一个 std::promise，并将返回值存储在\
  \ promise 中：\n\n```\nclass ToUppercase\n{\n    public:\n    std::string operator()(const\
  \ std::string& bufIn)\n```\n\n```\n{\n    std::string bufferOut;\n    for (std::string::const_iterator\
  \ iter = bufIn.begin(); iter != bufIn.end(); iter++)\n    {\n        if (*iter >=\
  \ 97 && *iter <= 122)\n        {\n            bufferOut += static_cast<char>(static_cast<int>(*iter)\
  \ - 32);\n        }\n        else\n        {\n            bufferOut += *iter;\n\
  \        }\n    }\n    return bufferOut;\n}\n\nvoid operator()(const std::string&\
  \ bufIn, std::promise<std::string> result)\n{\n    std::string bufferOut;\n    for\
  \ (std::string::const_iterator iter = bufIn.begin(); iter != bufIn.end(); iter++)\n\
  \    {\n        if (*iter >= 97 && *iter <= 122)\n        {\n            bufferOut\
  \ += static_cast<char>(static_cast<int>(*iter) - 32);\n        }\n        else\n\
  \        {\n            bufferOut += *iter;\n        }\n    }\n    result.set_value(bufferOut);\n\
  };\n```\n\n+   3. 现在，创建一个 **ToUppercase** 对象，即 **ptConverter**，并创建一个 **std::packaged_task**，即\
  \ **upperCaseResult1**，它将 **ptConverter** 对象作为参数。创建一个 **std::future** 值，并从 **upperCaseResult1**\
  \ 中获取它。在单独的线程中运行此任务：\n\n```cpp\nToUppercase ptConverter;\nstd::packaged_task<std::string(const\
  \ std::string&)>\nupperCaseResult1(ptConverter);\nstd::future<std::string> futureUpperResult1=\
  \ upperCaseResult1.get_\nfuture();\nstd::thread thr1(std::move(ptConverter), \"\
  This is a string for the first\nasynchronous task\");\nthr1.detach();\n```\n\n+\
  \   4. 现在，创建第二个 **ToUppercase** 对象，即 **fConverter**。创建一个名为 **futureUpperResult2**\
  \ 的 **std::future** 对象，并从 **std::async()** 中获取它：\n\n```cpp\nToUppercase fConverter;\n\
  std::future<std::string> futureUpperResult2 = std::async(fConverter, \"This\nis\
  \ a string for the asynchronous task\");\n```\n\n+   5. 现在，创建第三个 **ToUppercase**\
  \ 对象，即 **pConverter**。创建一个名为 **promiseResult** 的 **std::promise** 值。然后，创建一个名为 **futureUpperResult3**\
  \ 的 **std::future** 值，并从 **promiseResult** 中获取它。接下来，在单独的线程中运行 pConverter 任务，并将 **promiseResult**\
  \ 作为参数传递：\n\n```cpp\nToUppercase pConverter;\nstd::promise<std::string> promiseResult;\n\
  std::future<std::string> futureUpperResult3 = promiseResult.get_future();\nstd::thread\
  \ thr2(pConverter, \"This is a string for the task that returns a\npromise\", std::move(promiseResult));\n\
  thr2.detach();\n```\n\n+   6. 现在，要接收所有线程的结果，请等待 **futureUpperResult3** 就绪，然后获取全部三个结果并打印：\n\
  \n```cpp\nfutureUpperResult3.wait();\nstd::cout << \"Converted strings:\"\n    \
  \      << futureUpperResult1.get() << std::endl\n          << futureUpperResult2.get()\
  \ << std::endl\n          << futureUpperResult3.get() << std::endl;\n```\n\n7. 在编辑器中运行此代码。你将看到来自全部三个线程的转换后的字符串。\n\
  \n你将获得以下输出：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_407_0.png)\n\n图5.23：此练习执行的结果\n\
  \n那么，我们在这里做了什么？我们将大型计算拆分成较小的部分，并在单独的线程中运行它们。对于长时间计算，这将提高性能。在本练习中，我们学习了如何从线程接收结果。在本节中，我们还学习了如何将在单独线程中抛出的异常传递给调用线程。我们还学习了如何通过事件来同步多个线程的工作，不仅使用条件变量，还使用\
  \ future 结果。\n\n### 活动1：创建模拟器来模拟美术馆的运作\n\n在本活动中，我们将创建一个模拟器来模拟美术馆的运作。我们为美术馆设置了访客人数限制——馆内最多只能有\
  \ 50 人。要实现此模拟，我们需要创建一个 Person 类，用于表示美术馆中的人。此外，我们还需要一个 Persons 类，它是线程安全的人员容器。我们还需要一个\
  \ Watchman 类，用于控制馆内的人数。如果人数超过了 Watchman 设定的限制，我们会将所有新来者放入等待列表。最后，我们还需要一个 Generator\
  \ 类，它有两个线程——一个用于创建新访客，另一个用于通知我们有人必须离开美术馆。因此，我们将涵盖线程、互斥量、条件变量、lock_guard 和 unique_lock\
  \ 的使用。该模拟器将让我们能够运用本章所学的技术。因此，在尝试此活动之前，请确保你已完成本章前面的所有练习。\n\n我们有以下类：\n\n| 类名 | 描述\
  \ |\n|---|---|\n| Person | 表示美术馆访客的类。 |\n| Persons | 存储 Person 类对象的线程安全容器。 |\n|\
  \ PersonGenerator | 负责以不同间隔创建新的 Person 类对象的类。这模拟了美术馆的新访客。它还负责模拟人们离开美术馆的时间。为此，它会以不同间隔触发移除事件。\
  \ |\n| Watchman | 负责控制进入美术馆的人员的类。每当有新访客时，它都会检查美术馆中的人数，如果人数少于 50，它会将一个 Person 放入美术馆内的人员列表中。如果人数超过限制，它会将该访客放入等待列表。它还会使用由\
  \ PersonGenerator 类触发的移除事件，将访客从美术馆内的人员列表中移除。每次移除后，它都会检查等待列表中是否有访客。如果有，它会检查美术馆中的人数。如果人数少于\
  \ 50，它就会从人员列表中取出一个 Person，放入美术馆。 |\n\n图5.24：本活动中使用的类的说明\n\n\n\n\n\n让我们在开始实现之前先创建类图。前面提到的所有类及其关系如下图所示：\n\

- "# 编写可读的代码\n\n虽然可视化调试器对于识别和消除运行时错误或非预期的程序行为非常有用，但更好的做法是编写一开始就更不容易出现问题的代码。做到这一点的一种方法是努力编写更易于阅读和理解的代码。这样，在代码中查找问题就更像是识别英文句子之间的矛盾，而不是解决神秘的谜题。当你以易于理解的方式编写代码时，你的错误往往在你犯下时就会显现出来，并且在你回来解决遗漏的问题时也更容易发现。\n\
  \n经过一些不愉快的维护经历后，你会意识到你编写的程序的主要目的不是让计算机按你想要的方式工作，而是告诉读者程序运行时计算机将做什么。这通常意味着你需要输入更多内容，而\
  \ IDE 可以帮助你做到这一点。这也可能意味着你有时会编写在执行时间或内存使用方面不是最优的代码。如果这与你所学的内容相悖，请考虑你可能用微不足道的效率换取了出错的风险。凭借我们可用的庞大处理能力和内存，你可能会在追求效率的徒劳尝试中让代码变得不必要地晦涩难懂且可能出现错误。在下一节中，我们将列出一些有助于你编写更具可读性的代码的经验法则。\n\
  \n## 缩进和格式\n\nC++ 代码，如许多其他编程语言一样，由程序块组成。函数有一组语句构成其主体块。循环的块语句将在迭代中执行。**if** 语句的块在给定条件为真时执行，而对应的\
  \ **else** 语句的块在条件为假时执行。\n\n大括号，或单语句块中缺少大括号，告知计算机，而以空白形式出现的缩进则告知人类读者块结构。缺乏缩进或误导性缩进会使读者非常难以理解代码的结构。因此，我们应努力保持代码良好的缩进。请考虑以下两个代码块：\n\
  \n```\n// Block 1\nif (result == 2)\nfirstFunction();\nsecondFunction();\n```\n\n\
  ```\n// Block 2\nif (result == 2)\n    firstFunction();\nsecondFunction();\n```\n\
  \n从执行角度看它们是相同的，但在第二个中，**firstFunction()** 仅在 **result** 为 2 时执行这一点要清晰得多。现在考虑以下代码：\n\
  \n```\nif (result == 2)\n    firstFunction();\n    secondFunction();\n```\n\n这纯粹具有误导性。如果读者不够仔细，他们很容易假设\
  \ **secondFunction()** 仅在 **result** 为 2 时执行。然而，从执行角度看，这段代码与前两个示例是相同的。\n\n如果你觉得纠正缩进会减慢你的速度，可以使用编辑器的格式化功能来帮助你。在\
  \ Eclipse 中，你可以选择一段代码并使用 **Source | Correct Indentation** 来修复该选择的缩进，或使用 **Source\
  \ | Format** 来修复代码的其他格式问题。\n\n除了缩进之外，其他格式规则，如将大括号放在正确的行、在二元运算符周围插入空格、在每个逗号后插入空格等，也是非常重要的格式规则，你应遵守这些规则以保持代码格式良好且易于阅读。\n\
  \n\n\n在Eclipse中，你可以按工作区在**窗口 | 首选项 | C/C++ | 代码风格 | 格式化器**中设置格式化规则，也可以按项目在**项目 |\
  \ 属性 | C/C++ 常规 | 格式化器**中设置。你可以选择行业标准风格（如K&R或GNU），也可以修改它们并创建自己的风格。当你使用**源代码 | 格式化**来格式化代码时，这一点尤其重要。例如，如果你选择使用空格缩进，但Eclipse的格式化规则设置为制表符，那么你的代码就会变成制表符和空格的混合体。\n\
  \n## 使用有意义的名称作为标识符\n\n在我们的代码中，我们使用标识符来命名许多事物——变量、函数、类名、类型等等。对于计算机来说，这些标识符仅仅是一串字符，用于彼此区分。然而，对于读者来说，它们远不止于此。标识符应该完整且无歧义地描述它所代表的事物。同时，它不应过长。此外，它应该遵守当前正在使用的风格标准。\n\
  \n考虑以下代码：\n\n```\nstudentsFile File = runFileCheck(\"students.dat\");\n\nbool flag\
  \ = File.check();\n\nif (flag) {\n    int Count_Names = 0;\n\n    while (File.CheckNextElement()\
  \ == true) {\n        Count_Names += 1;\n    }\n\n    std::cout << Count_Names <<\
  \ std::endl;\n}\n```\n\n虽然这是一段完全有效的C++代码，但读起来相当困难。让我们列出它的问题。首先，让我们看看标识符的风格问题。**studentsFile**\
  \ 类名以小写字母开头，本应大写。**File** 变量本应以小写字母开头。**Count_Names** 变量本应以小写字母开头，并且不应该包含下划线。**CheckNextElement**\
  \ 方法本应以小写字母开头。虽然这些规则看起来是任意的，但在命名上保持一致会携带关于名称的额外信息——当你看到一个以大写字母开头的单词时，你会立刻明白它必须是类名。此外，拥有不符合当前标准的名称只会分散注意力。\n\
  \n现在，让我们超越风格，审视名称本身。第一个有问题的名称是 **runFileCheck** 函数。方法是一个返回值的动作：它的名称应该清楚地解释它做什么以及返回什么。“Check”是一个过度使用的词，在大多数情况下过于模糊。是的，我们检查了，它在那里——那么我们该怎么办呢？在这种情况下，似乎我们实际上是读取文件并创建一个\
  \ **File** 对象。既然如此，**runFileCheck** 应该改为 **readFile**。这清楚地解释了正在执行的动作，返回值也是你所期望的。如果你想更具体地说明返回值，**readAsFile**\
  \ 可以是另一个选择。类似地，**check** 方法很模糊，应该改为 **exists**。**CheckNextElement** 方法也很模糊，应该改为\
  \ **nextElementExists**。\n\n另一个过度使用的模糊词是 **flag**，它常用于布尔变量。这个名称暗示了一种开/关状态，但没有提供其值含义的任何线索。在这种情况下，它的\
  \ **true** 值意味着文件存在，**false** 值意味着文件不存在。命名布尔变量的技巧是设计一个在变量值为 **true** 时正确的问题或陈述。在这个例子中，**fileExists**\
  \ 和 **doesFileExist** 是两个不错的选择。\n\n我们下一个命名不当的变量是 **Count_Names**，或者使用正确大小写的 **countNames**。对于整数来说，这是一个糟糕的名字，因为这个名字并不表示一个数字——它暗示了一个导致数字的动作。相反，像\
  \ **numNames** 或 **nameCount** 这样的标识符会清楚地传达内部数字的含义。\n\n```\nsum += input[i];\n}\n\
  ```\n\n```\nint minVal = 0;\nfor (int i = 0; i < length; ++i) {\n    if (i == 0\
  \ || minVal > input[i]) {\n        minVal = input[i];\n    }\n}\n```\n\n```\nfor\
  \ (int i = 0; i < length; ++i) {\n    if (input[i] < 0) {\n        input[i] *= -1;\n\
  \    }\n}\n```\n\n现在一切清晰多了。第一个循环计算输入的总和，第二个循环找到最小元素，第三个循环找到每个元素的绝对值。虽然它更加清晰和易于理解，但你可能觉得自己在运行三个循环，因此浪费了CPU资源。创建更高效代码的动力可能会促使你合并这些循环。请注意，你在这里获得的效率提升微乎其微；程序的时间复杂度仍然是O(n)。\n\
  \n在编写代码时，可读性和效率是两个经常相互竞争的约束条件。如果你想开发可读且可维护的代码，你应该始终优先考虑可读性。然后，你应该努力开发出同样高效的代码。否则，可读性低的代码可能难以维护，更糟糕的是，可能存在难以识别和修复的bug。当你的程序产生错误结果或添加新功能的成本过高时，其高效率将毫无意义。\n\

- "# 3 不允许泄漏——异常与资源\n\n## 学习目标\n\n学完本章后，你将能够：\n\n- 开发管理资源的类\n- 开发异常健壮的代码，通过RAII确保资源不泄漏\n\
  - 实现能够通过移动语义转移资源所有权的类\n- 实现控制隐式转换的类\n\n在本章中，你将学习如何使用类来管理资源、防止泄漏，以及避免复制大量数据。\n\n\
  ## 引言\n\n在*第2A章：禁止鸭子——类型与推导*中，我们简单接触了一些概念，例如智能指针和移动语义。在本章中，我们将进一步探讨它们。事实证明，这些主题与资源管理和编写健壮代码（能够长时间频繁运行而不出问题的代码）密切相关。\n\
  \n为了理解会发生什么，我们将探讨变量在内存中的位置，以及它们超出作用域时的时间和发生的事情。\n\n我们将查看编译器为我们的输入生成的汇编代码，并探讨当异常发生时这一切会受到怎样的影响。\n\
  \n### 变量作用域与生命周期\n\n在*第2B章：禁止鸭子——模板与推导*中，我们讨论了变量作用域和生命周期。让我们快速回顾它们的不同类型：\n\n**作用域：**\n\
  \n- **局部作用域**（也称为**块作用域**）：适用于在花括号（`{}`）包围的块内声明的任何内容。\n- **全局/文件作用域**：适用于在普通函数或类之外声明的变量，也适用于普通函数。\n\
  \n**生命周期：**\n\n- **自动生命周期**：局部变量在声明时创建，离开所在作用域时销毁。它们由栈管理。\n- **永久生命周期**：全局变量和静态局部变量具有永久生命周期。\n\
  - **动态生命周期**：变量由程序员根据需要创建和销毁（使用`new`和`delete`运算符）。这些变量的内存从堆中分配。\n\n我们将使用以下程序来清晰地说明**局部变量**的行为——包括具有**自动生命周期**的变量和具有**动态生命周期**的变量：\n\
  \n```\n 1: #include <iostream>\n 2:\n 3: struct Int\n 4: {\n 5:     Int(int value)\
  \ : m_value(value)\n 6:     {\n 7:         std::cout << \"Int(\" << m_value << \"\
  ) @\" << this << \" - IntCon\\n\";\n 8:     };\n 9:     Int() : m_value(0)\n10:\
  \     {\n11:         std::cout << \"Int(\" << m_value << \") @\" << this << \" -\
  \ DefCon\\n\";\n12:     };\n13:     ~Int()\n14:     {\n15:         std::cout <<\
  \ \"~Int()  @\" << this << \"\\n\";\n16:     };\n17:     Int(const Int& rhs) : m_value(rhs.m_value)\n\
  18:     {\n19:         std::cout << \"Int(\" << m_value << \") @\" << this << \"\
  \ - CopyCon\\n\";\n20:     };\n21:     int m_value;\n22: };\n23:\n24: Int add(Int\
  \ a, Int b)\n25: {\n26:     return a.m_value + b.m_value;\n27: }\n28:\n29: Int subtract(Int\
  \ a, Int b)\n30: {\n31:     return a.m_value - b.m_value;\n32: }\n33:\n34: void\
  \ calculate()\n35: {\n36:     Int a{25};\n37:     Int b{50};\n38:\n39:     {\n40:\
  \         Int c = add(a, b);\n41:         Int d = subtract(a, b);\n42:     }\n43:\
  \     Int* e = new Int(add(subtract(a, b), a));\n44: }\n45:\n46: int main()\n47:\
  \ {\n48:     calculate();\n49: }\n```\n\n图3.1：用于测试变量作用域和生命周期的程序\n\n这些抽象概念有助于我们解释幕后发生的事情。PC栈（程序计数器栈）用于保存程序计数器的值（一个指向下一条需要执行指令的寄存器），而数据栈保存我们正在操作的值或地址。虽然它们是两个独立的栈，但在真实的CPU上，很可能实现为一个栈。让我们看看下面的表格，其中我们使用缩写OLn来指代前面程序输出中的行号：\n\
  \n| 代码行 | 发生什么 | PC栈 | 数据栈 |\n|---|---|---|---|\n| 第48行 | 将第49行的地址压入PC栈，程序跳转到calculate()。\
  \ | 第49行 | – |\n| 第36行 | 变量a以值25构造 – OL1。 | 第49行 | a = 25 |\n| 第37行 | 变量b以值50构造\
  \ – OL2。 | 第49行 | a = 25<br>b = 50 |\n| 第40行 | b的副本复制构造 – OL3并压入栈。<br>a的副本复制构造 –\
  \ OL4并压入栈。 | 第49行 | a = 25<br>b = 50<br>b = 50<br>a = 25 |\n| 第40行 | 将第40行的地址压入PC栈，程序跳转到add()。\
  \ | 第49行<br>第40行 | a = 25<br>b = 50<br>b = 50<br>a = 25 |\n| 第26行 | 计算a和b的和。然后，用结果构造一个新的临时Int对象（OL5）并将其压入栈。\
  \ | 第49行<br>第40行 | a = 25<br>b = 50<br>b = 50<br>a = 25<br>temp = 75 |\n| 第26行 |\
  \ 从PC栈弹出PC，并返回到我们跳转位置之后的下一条指令。 | 第49行 | a = 25<br>b = 50<br>b = 50<br>a = 25<br>temp\
  \ = 75 |\n\n图3.3：测试程序执行的详细分析（第1部分）\n\n下面是测试程序执行详细分析的第二部分：\n\n| 代码行 | 发生什么 | PC栈\
  \ | 数据栈 |\n|---|---|---|---|\n| 第40行 | 用临时值初始化变量c，并清理压入栈的a和b的副本（OL6–7）。 | 第49行 |\
  \ a = 25<br>b = 50<br>c = 75 |\n| 第41行 | 使用subtract重复这些操作并创建d（OL8–12）。 | 第49行 |\
  \ a = 25<br>b = 50<br>c = 75<br>d = 25 |\n| 第42行 | 作用域结束。清理c和d变量（OL13–14）。 | 第49行\
  \ | a = 25<br>b = 50 |\n| 第43行 | 为e分配足够的内存（new Int），然后根据计算出的值构造它。如下图所示： | 第49行 |\
  \ a = 25<br>b = 50<br>e = 指向堆中Int的指针 |\n\n图3.4：测试程序执行的详细分析（第2部分）\n\n下面是测试程序执行详细分析的第三部分：\n\
  \n| 代码行 | 发生什么 | PC栈 | 数据栈 |\n|---|---|---|---|\n| **第43行** | 计算：将a和b的副本压入栈（OL15–16），调用subtract得到临时值（OL17），将a压入栈（OL18），调用add得到传递给构造函数的0结果（OL19）。清理副本和临时值（OL20–23）。\
  \ | 第49行 | a = 25<br>b = 50<br>e = 指向Int的指针（值 = 0） |\n| **第44行** | 作用域结束。清理a、b和e（OL24–25）。如下图所示：<br><br>*[示意图，展示栈和堆，包含三个栈条目和一个`Int\
  \ (0)`堆对象]* | 第49行 | – |\n| **第44行** | 从PC栈弹出PC，并返回到我们跳转后（第49行）的下一条指令。 | – | – |\n\
  | **第49行** | 程序退出。 |  |  |\n\n图3.5：测试程序执行的详细分析（第3部分）\n\n从这个简单程序中，我们了解到一些重要事实：\n\n\
  - 当我们按值传递时，会调用复制构造函数（正如本例中所做的那样）。\n- 返回一个类型只导致调用一个构造函数（而不是两个构造函数——一个用于创建返回对象，一个用于存储返回数据的变量）——C++称之为**复制省略**，现在这在标准中是强制性的。\n\
  \n```\nif (is_valid(buffer))\n    return FileCheckStatus::InvalidContents;\n\nreturn\
  \ FileCheckStatus::Good;\n}\n```\n\n前面的函数使用一种称为**状态**或**错误码**的技术来报告操作的结果。这是C风格编程中使用的方法，用于处理与**POSIX\
  \ API**和**Windows API**相关的错误。\n\n> **注意**\n>\n> **POSIX** 代表**可移植操作系统接口**。它是IEEE标准，用于Unix变体和其他操作系统之间的软件兼容性。\n\
  \n这意味着方法的调用者必须检查返回值，并为每种错误类型采取适当的措施。当你能推断代码将产生的错误类型时，这种方法效果很好。但情况并不总是如此。例如，输入程序的数据可能存在问题。这会导致程序进入无法处理的异常状态。处理错误的逻辑代码与检测问题的代码被分离开来。\n\
  \n虽然编写处理此类问题的代码是可能的，但它增加了处理所有错误条件的复杂性，从而使程序难以阅读，难以推断函数应该做什么，因此非常难以维护。\n\n对于错误处理，异常相比错误码具有以下优势：\n\
  \n- 错误码可以被忽略——异常强制处理错误（否则程序终止）。\n- 异常可以沿着栈向上传播到最适合响应错误的方法。错误码则需要通过每个中间方法进行传播。\n\
  - 异常将错误处理与主程序流程分离，从而使软件易于阅读和维护。\n- 异常将检测错误的代码与处理错误的代码分离开来。\n\n\n\n\n\n只要遵循最佳实践并将异常用于异常情况，使用异常就不会有（时间）开销。这是因为一个实现良好的编译器会提供\
  \ C++ 的格言——你不为未使用的功能付费。它可能会占用一些内存，你的代码可能会大一点，但运行时间应该不受影响。\n\nC++ 使用异常来处理运行时异常。通过使用异常，我们可以检测到错误，抛出异常，并且错误会向后传播到可以处理它的位置。让我们修改之前的程序来引入\
  \ `divide()` 函数，并更改 `calculate()` 函数使其调用它。我们还将在 `main()` 函数中添加日志，以便我们可以探索异常的行为：\n\
  \n```\n```cpp\nInt divide(Int a, Int b )\n{\n    return a.m_value/b.m_value;\n}\n\
  \nvoid calculate()\n{\n    Int a{25};\n    Int b{50};\n    Int c{0};\n\n    {\n\
  \        auto result1 = divide(b, a);\n        // auto result2 = divide(a, c);\n\
  \    }\n    auto sum = add(a,b);\n}\n\nint main()\n{\n    std::cout << \"Enter main\\\
  n\";\n    calculate();\n    std::cout << \"Exit main\\n\";\n}\n```\n```\n\n图 3.6：用于研究异常的修改后的测试程序\n\
  \n当我们编译并运行前面的程序时，会生成以下输出：\n\n```\n+-------- Program Output --------+\n|        \
  \                       |\nuser@linux:~$ ./except\nEnter main\nInt(25) @0xffffffcbe\
  \ c - intCon          - calculate: Int a{25}\nInt(50) @0xffffffcbe8 - intCon   \
  \       - calculate: Int b{50}\nInt(0) @0xffffffcbe4 - intCon           - calculate:\
  \ Int c{0}\nInt(25) @0xffffffcbf0 - CopyCon         - copy a for call to divide()\n\
  Int(50) @0xffffffcbf4 - CopyCon         - copy b for call to divide()\nInt(2) @0xffffffc\
  \ bdc - intCon          - result of divide (50/25) to result1\n~Int() @0xffffffcbf4\
  \                     - destroy copy of b for call to divide()\n~Int() @0xffffffcbf0\
  \                     - destroy copy of a for call to divide()\n~Int() @0xffffffc\
  \ bdc                    - end of scope destroy result1\nInt(50) @0xffffffcbf8 -\
  \ CopyCon         - copy b for call to add()\nInt(25) @0xffffffcbfc - CopyCon  \
  \       - copy a for call to add()\nInt(75) @0xffffffcbe0 - intCon          - result\
  \ of add(25,50) to sum\n~Int() @0xffffffcbfc                     - destroy copy\
  \ of a for call to add()\n~Int() @0xffffffcbf8                     - destroy copy\
  \ of b for call to add()\n~Int() @0xffffffcbe0                     - end of calculate()\
  \ scope destroy sum\n~Int() @0xffffffcbe4                     - end of calculate()\
  \ scope destroy c\n~Int() @0xffffffcbe8                     - end of calculate()\
  \ scope destroy b\n~Int() @0xffffffcbe c                    - end of calculate()\
  \ scope destroy a\nExit main\nuser@linux:~$\n```\n\n图 3.7：测试程序的输出\n\n在前面的代码中，你可以看到注释被添加到右侧。现在，我们删除程序中\
  \ result2 行的注释，重新编译程序并重新运行它。生成的新的输出如下所示：\n\n```\nuser@linux:~$ ./except\nEnter main\n\
  Int(25) @0xffffffcbe4 - intCon          - calculate: Int a{25}\nInt(50) @0xffffffcbe0\
  \ - intCon          - calculate: Int b{50}\nInt(0) @0xffffffc bdc - intCon     \
  \     - calculate: Int c{0}\nInt(25) @0xffffffcbe8 - CopyCon         - copy a for\
  \ call to divide()\nInt(50) @0xffffffcbe c - CopyCon        - copy b for call to\
  \ divide()\nInt(2) @0xffffffcbd4 - intCon           - result of divide (50/25) to\
  \ result1\n~Int() @0xffffffcbe c                   - destroy copy of b for call\
  \ to divide()\n~Int() @0xffffffcbe8                   - destroy copy of a for call\
  \ to divide()\nInt(0) @0xffffffcbf0 - CopyCon          - copy c for call to divide()\n\
  Int(25) @0xffffffcbf4 - CopyCon         - copy a for call to divide()\nFloating\
  \ point exception (core dumped)\nuser@linux:~$\n```\n\n图 3.8：测试程序的输出 – result2\n\
  \n通过比较输出，我们可以看到每个输出的前八行是相同的。前一个输出的接下来的两行被添加，因为 `divide()` 函数被调用了两次。最后一行表明抛出了一个异常并且程序被终止了。\n\
  \n我们的代码已将程序控制转移到 `main()` 函数中的 `catch()` 语句，并已执行在 `try` 子句中调用时在栈上构造的所有变量的析构函数。\n\
  \n## 栈展开\n\n销毁所有局部函数变量的过程，由 C++ 语言保证，被称为栈展开。当异常存在时栈展开时，C++ 使用其明确定义的规则销毁作用域中的所有对象。\n\
  \n当发生异常时，函数调用栈从当前函数开始线性搜索回调用它的函数，再到调用它的那个函数，依此类推，直到找到匹配该异常的异常处理程序（由 catch 块表示）。\n\
  \n如果找到异常处理程序，则会发生栈展开，销毁栈中所有函数的所有局部变量。对象以与创建顺序相反的顺序销毁。如果没有找到处理程序来处理抛出的异常，则程序终止（通常不会警告用户）。\n\
  \n### 练习 1：在 Fraction 和 Stack 中实现异常\n\n在本练习中，我们将回到我们在第 2A 章《No Ducks Allowed – Types\

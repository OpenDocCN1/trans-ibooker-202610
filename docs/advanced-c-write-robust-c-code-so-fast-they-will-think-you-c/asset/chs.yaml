  \ monitor 报告没有泄漏：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_248_0.png)\n\n图 3.22：无泄漏——无论是内存还是文件\n\
  \n**File** 和 **CharPointer** 的实现体现了 RAII 设计方法，但在设计这些类时还有其他考虑因素。例如，我们是否需要复制构造函数或复制赋值函数？在这两种情况下，简单地将资源从一个对象复制到另一个对象都可能成为问题，因为这可能导致两次尝试关闭文件句柄或删除内存。通常，这会导致未定义行为。接下来，我们将结合实现资源管理对象（如\
  \ **File** 或 **CharPointer**）来重新审视特殊成员函数。\n\n## 特殊编码技术\n\n练习 3（*为内存和文件句柄实现 RAII*）的代码经过特殊编写，以便我们可以监控内存和文件句柄的使用情况，并在退出时报告任何泄漏。请查看\
  \ **monitor.h** 和 **monitor.cpp** 文件，并检查用于实现该 monitor 的两种技术：\n\n+   - **预处理器宏**：这是预处理器宏的特殊用法，用于演示泄漏，不应在生产代码中使用，即通过文本替换来替代函数。\n\
  +   \n+   如果你使用 Windows API 编程，偶尔可能会遇到方法名与 Microsoft 为其 API 方法定义的宏冲突的情况。例如，如果你包含了\
  \ **windows.h**，则不要将任何方法命名为 **SendMessage**。如果你这样做了，那么根据你构建的是 ASCII 模式还是 Unicode\
  \ 模式，它将被分别替换为 **SendMessageA** 或 **SendMessageW**。\n+   - **自定义我们自己的 new 处理器**：这是一种高级技术，除非你编写嵌入式代码，否则不太可能需要它。\n\
  \n### C++ 不需要 finally\n\n其他支持异常抛出机制的语言（**C#**、**Java** 和 **Visual Basic.NET**）具有\
  \ **try/catch/finally** 范式，其中 **finally** 块中的代码在退出 try 块时被调用——无论是正常退出还是因异常退出。C++\
  \ 没有 **finally** 块，因为它拥有一种更好的机制，可以确保我们不会忘记释放资源——RAII。由于资源由局部对象表示，局部对象的析构函数将释放资源。\n\
  \n这种设计模式的另一个优点是，如果管理了大量资源，那么 **finally** 块将相应地变得很大。RAII 消除了对 finally 的需求，并带来了更易于维护的代码。\n\
  \n### RAII 与 STL\n\n标准模板库（STL）在其许多模板和类中使用了 RAII。例如，C++11 中引入的智能指针，即 **std::unique_ptr**\
  \ 和 **std::shared_ptr**，通过确保内存在使用完毕后被释放，或确保内存在其他地方使用时不被释放，从而避免了许多问题。STL 中的其他示例包括\
  \ **std::string**（内存）、**std::vector**（内存）和 **std::fstream**（文件句柄）。\n\n### 谁拥有这个对象？\n\
  \n通过前面 **File** 和 **CharPointer** 的实现，我们已经测试了使用 RAII 进行资源管理。让我们进一步探索。首先，我们将定义一个不只拥有一种资源的类：\n\
  \n```\nclass BufferedWriter\n{\npublic:\n```\n\n\n\n\n\n```\nBufferedWriter(const\
  \ char* filename);\n~BufferedWriter();\n\nbool write(const char* data, size_t length);\n\
  \nprivate:\n    const size_t BufferSize{4096};\n    FILE* m_file{nullptr};\n   \
  \ size size_t m_writePos{0};\n    char* m_buffer{new char[BufferSize]};\n};\n```\n\
  \n该类用于缓冲对文件的写入。\n\n> Note\n> 使用派生自 iostream 的类时通常不需要此操作，因为它们本身已提供缓冲。\n\n每次调用 write()\
  \ 函数时，数据都会被添加到分配的缓冲区中，直到达到 BufferSize 时，数据才会被真正写入文件，并且缓冲区会被重置。\n\n但如果我们想将这个 BufferedWriter\
  \ 实例赋值给另一个实例或复制它呢？正确的行为是什么？\n\n如果我们只是让默认的拷贝构造函数/拷贝赋值按其方式执行，我们会得到成员逐个的拷贝。这意味着我们有两个\
  \ BufferedWriter 实例，它们持有对同一文件的句柄和指向缓冲区的指针。当第一个对象实例被销毁时，作为优秀的程序员，我们会清理文件并关闭它，并通过删除来释放内存。第二个实例现在拥有一个已失效的文件句柄和指向我们已告知操作系统为下一个用户回收的内存的指针。任何尝试使用这些资源的行为，包括销毁它们，都会导致未定义行为，并且很可能导致程序崩溃。默认的拷贝构造函数/拷贝赋值运算符执行的是所谓的浅拷贝——也就是说，它按位逐位复制所有成员，但不复制它们所引用的内容。\n\
  \n我们拥有的两个资源可以被不同地处理。首先，只应有一个类拥有 m_buffer。有两种处理方式：\n\n- 阻止类的拷贝，从而阻止内存的拷贝\n- 执行深拷贝，其中第二个实例中的缓冲区由构造函数分配，并且第一个缓冲区的內容被复制\n\
  \n其次，只应有一个类拥有文件句柄 m_file。有两种处理方式：\n\n- 阻止类的拷贝，从而阻止文件句柄的拷贝\n- 将所有权从原始实例转移到第二个实例，并将原始实例标记为无效或空\n\
  \n实现深拷贝很容易，但我们如何转移资源的所有权？要回答这个问题，我们需要再次查看临时对象和值类别。\n\n## Temporary Objects\n\n临时对象是在表达式的结果被存入变量之前，或被遗忘之前，用于存储表达式的中间结果。表达式是返回值的任何代码，包括按值传递给函数、从函数返回值、隐式转换、字面量和二元运算符。临时对象是右值表达式，它们为表达式结果提供了一个临时分配的内存位置。在\
  \ C++11 之前，正是临时对象的创建以及数据在它们之间的拷贝导致了一些性能问题。为了解决这个问题，C++11 引入了右值引用，以实现所谓的移动语义。\n\n\
  ## Move Semantics\n\n右值引用（用双与号 '&&' 表示）是一种仅被赋予右值的引用，它会延长右值的生命周期，直到右值引用使用完毕。因此，右值可以活得比定义它的表达式更久。有了右值引用，我们现在可以通过移动构造函数和移动赋值运算符来实现移动语义。移动语义的目的是从被引用的对象窃取资源，从而避免昂贵的拷贝操作。移动完成后，被引用的对象必须被置于稳定状态。换句话说，被移动的对象必须被置于一种状态，在销毁时不会导致任何未定义行为或程序崩溃，并且不应影响从其窃取的资源。\n\
  \n```\nsmart_ptr(const smart_ptr& a)\n{\n    m_ptr = new T;\n    *m_ptr = *a.m_ptr;\
  \      // use operator=() to do deep copy\n}\n\n// Copy assignment --> Do deep copy\n\
  smart_ptr& operator=(const smart_ptr& a)\n{\n    // Self-assignment detection\n\
  \    if (&a == this)\n        return *this;\n\n    // Release any resource we're\
  \ holding\n    delete m_ptr;\n\n    // Copy the resource\n    m_ptr = new T;\n \
  \   *m_ptr = *a.m_ptr;\n\n    return *this;\n}\n\nT& operator*() const { return\
  \ *m_ptr; }\nT* operator->() const { return m_ptr; }\nbool is_null() const { return\
  \ m_ptr == nullptr; }\nprivate:\n    T* m_ptr{nullptr};\n};\n\nclass Resource\n\
  ```\n\n```\n{\npublic:\n    Resource() { std::cout << \"Resource acquired\\n\";\
  \ }\n    ~Resource() { std::cout << \"Resource released\\n\"; }\n};\n```\n\n```\n\
  smart_ptr<Resource> createResource()\n{\n    smart_ptr<Resource> res(new Resource);\
  \                     // Step 1\n    return res; // return value invokes the copy\
  \ constructor      // Step 2\n}\n```\n\n```\nint main()\n{\n    smart_ptr<Resource>\
  \ the_res;\n    the_res = createResource(); // assignment invokes the copy assignment\
  \ Step 3/4\n\n    return 0; // Step 5\n}\n```\n\n运行此程序时，生成以下输出：\n\n```\n$ ./smart_ptr.exe\n\
  Resource acquired\nResource acquired\nResource released\nResource released\n$\n\
  ```\n\nFigure 3.23: Smart Pointer Program output\n\n对于这样一个简单的程序，资源的获取和释放次数很多。让我们拆解一下：\n\
  \n- 1. createResource() 内部的局部变量 res 被创建并在堆上初始化（动态生命周期），导致第一个 \"Resource acquired\"\
  \ 消息。\n\n- 2. 编译器可能会为返回值创建另一个临时对象。然而，编译器已执行 **copy elision** 以移除拷贝（也就是说，它能够直接在调用函数分配的栈位置上构建对象）。编译器具有\
  \ **Return-Value-Optimization (RVO)** 和 **Named- Return-Value-Optimization (NRVO)**\
  \ 优化，在 C++17 下在某些情况下这些优化是强制性的。\n\n- 3. 临时对象通过拷贝赋值被赋给 main() 函数中的 `the_res` 变量。由于拷贝赋值执行深拷贝，又获取了资源的另一个拷贝。\n\
  \n- 4. 当赋值完成后，临时对象超出作用域，我们得到第一个 \"Resource released\" 消息。\n\n- 5. 当 main() 函数返回时，`the_res`\
  \ 超出作用域，从而释放第二个 Resource。\n\n因此，如果资源很大，我们在 main() 中创建 **the_res** 局部变量的方法非常低效，因为由于拷贝赋值中的深拷贝，我们在创建和拷贝大块内存。然而，我们知道当\
  \ **createResource()** 创建的临时变量不再需要时，我们就会丢弃它并释放其资源。在这些场景下，将资源从临时对象转移（或移动）到类型的另一个实例会更高效。移动语义使得我们可以重写\
  \ **smart_ptr** 模板，使其不执行深拷贝而是转移资源。\n\n让我们为 **smart_ptr** 类添加移动语义：\n\n// Move constructor\
  \ --> transfer resource\nsmart_ptr(smart_ptr&& a) : m_ptr(a.m_ptr)\n{\n    a.m_ptr\
  \ = nullptr;    // Put into safe state\n}\n\n// Move assignment --> transfer resource\n\
  smart_ptr& operator=(smart_ptr&& a)\n{\n    // Self-assignment detection\n    if\
  \ (&a == this)\n        return *this;\n\n    // Release any resource we're holding\n\
  \n```\ndelete m_ptr;\n\n// Transfer the resource\nm_ptr = a.m_ptr;\na.m_ptr = nullptr;\
  \  // Put into safe state\nreturn *this;\n}\n```\n\n重新运行程序后，我们得到以下输出：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_256_0.png)\n\
  \nFigure 3.24: Smart pointer program output using move semantics\n\n现在，由于移动赋值可用，编译器在以下行使用它：\n\
  \n```\nthe_res = createResource(); // assignment invokes the copy assignment Step\
  \ 3/4\n```\n\n步骤 3 现在被移动赋值取代，意味着深拷贝已被移除。\n\n步骤 4 不再释放资源，因为带有注释 \"//\" 的行将其置于安全状态——它不再拥有资源，因为所有权已被转移。\n\
  \n移动构造函数和移动赋值的一个需要注意的点是，与其拷贝版本的参数为 const 不同，它们的移动版本参数为非 const。这被称为所有权的转移，这意味着我们需要修改传入的参数。\n\
  \n移动构造函数的另一种实现可能如下所示：\n\n// Move constructor --> transfer resource\nsmart_ptr(smart_ptr&&\
  \ a)\n{\n    std::swap(this->m_ptr, a.m_ptr);\n}\n\n本质上，我们正在交换资源，并且 C++ STL 对 swap\
  \ 提供了模板支持并有许多特化。这之所以可行，是因为我们使用成员初始化将 m_ptr 设置为 nullptr。因此，我们正在交换一个 nullptr 与 a 中存储的值。\n\
  \n\n\n\n既然我们已经修复了不必要的深拷贝问题，我们实际上可以从 smart_ptr() 中移除拷贝操作，因为我们真正想要的是所有权转移。如果我们将一个非临时\
  \ smart_ptr 实例拷贝到另一个非临时 smart_ptr 实例，那么我们将得到两个对象，它们会在离开作用域时删除资源，这不是期望的行为。为了移除（深）拷贝操作，我们按如下方式修改成员函数的定义：\n\
  \n```\nsmart_ptr(const smart_ptr& a) = delete;\n\nsmart_ptr& operator=(const smart_ptr&\
  \ a) = delete;\n```\n\n我们在第2A章《禁止鸭子——类型与推导》中看到的 = delete 后缀告诉编译器，对具有该原型函数的访问尝试现在不再是有效代码，并会导致错误。\n\
  \n## STL 智能指针\n\n与其编写我们自己的 smart_ptr，STL 提供了我们可以用来在对象上实现 RAII 的类。最初的版本是 std::auto_ptr()，它在\
  \ C++ 11 中被弃用，并在 C++ 17 中被移除。它是在右值引用支持之前创建的，并且因为它使用拷贝来实现移动语义而导致问题。C++ 11 引入了三个新模板来管理资源的生命周期和所有权：\n\
  \n- **std::unique_ptr**：通过指针拥有并管理单个对象，并在 unique_ptr 离开作用域时销毁该对象。它有两个版本：用于单个对象（使用\
  \ new 创建）和用于对象数组（使用 new[] 创建）。unique_ptr 与直接使用底层指针一样高效。\n- **std::shared_ptr**：通过指针保留对象的共享所有权。它通过引用计数器来管理资源。每次将\
  \ shared_ptr 赋值给另一个 shared_ptr 的拷贝操作都会更新引用计数。当引用计数归零时，意味着没有所有者了，资源被释放/销毁。\n- **std::weak_ptr**：提供与\
  \ shared_ptr 相同的资源接口，但不修改计数器。可以检查资源是否仍然存在，但它不会阻止资源被销毁。如果你确定资源仍然存在，那么可以使用它来获取指向该资源的\
  \ shared_ptr。它的一个用例是多个 shared_ptr 最终形成循环引用的场景。循环引用会阻止资源的自动释放。weak_ptr 用于打破循环，并允许资源在应该释放时被释放。\n\
  \n### std::unique_ptr\n\n`std::unique_ptr()` 在 C++ 11 中引入，用于替代 `std::auto_ptr()`，它提供了\
  \ `smart_ptr` 所具备的一切（甚至更多）。我们可以将 `smart_ptr` 程序重写如下：\n\n```\n```cpp\n#include <iostream>\n\
  \n#include <memory>\n\nclass Resource\n{\npublic:\n    Resource() { std::cout <<\
  \ \"Resource acquired\\n\"; }\n    ~Resource() { std::cout << \"Resource released\\\
  n\"; }\n};\n\nstd::unique_ptr<Resource> createResource()\n{\n    std::unique_ptr<Resource>\
  \ res(new Resource);\n    return res;\n}\n\nint main()\n{\n    std::unique_ptr<Resource>\
  \ the_res;\n    the_res = createResource(); // assignment invokes the copy assignment\n\
  \    return 0;\n}\n```\n```\n\n我们还可以更进一步，因为 C++ 14 引入了一个辅助方法，以确保在处理 `unique_ptr`\
  \ 时的异常安全：\n\n```\n```cpp\nstd::unique_ptr<Resource> createResource()\n{\n    return\
  \ std::make_unique<Resource>();\n}\n```\n```\n\n为什么这有必要？考虑下面的函数调用：\n\n```\n```cpp\n\
  some_function(std::unique_ptr<T>(new T), std::unique_ptr<U>(new U));\n```\n```\n\
  \n问题在于，编译器可以自由选择实参列表中操作的执行顺序。它可能先调用 **new T**，然后调用 **new U**，接着调用 **std::unique_ptr<T>()**，最后调用\
  \ **std::unique_ptr<U>()**。这个序列的问题是，如果 **new U** 抛出异常，那么由 **new T** 调用分配的资源还没有被放入\
  \ **unique_ptr**，也不会被自动清理。使用 **std::make_unique<>()** 可以保证调用顺序，使资源的构造和 **unique_ptr**\
  \ 的构造一起发生，从而不会泄漏资源。在 C++17 中，由于这些情况下的求值顺序规则已经收紧，**make_unique** 的需求已被移除。然而，仍然建议使用\
  \ **make_unique<T>()** 方法，因为将来转换为 **shared_ptr** 会更容易。\n\n**unique_ptr** 这个名称使得模板的意图很清晰，即它是其所指向的对象的唯一所有者。这在\
  \ **auto_ptr** 中并不明显。同样，**shared_ptr** 清楚地表明它是为了共享资源。**unique_ptr** 模板提供以下操作符：\n\
  \n- **T* get()：** 返回指向所托管资源的指针。\n- **operator bool()：** 如果实例管理着一个资源，则返回 **true**。（**get()\
  \ != nullptr**）。\n- **T& operator\\*()：** 所托管资源的左值引用。同 **\\*get()**。\n- **T* operator->()：**\
  \ 指向所托管资源的指针。同 **get()**。\n- **T& operator[](size_t index)：** 对于 **unique_ptr(new\
  \ [])**，它像原生数组一样提供对所托管数组的访问。返回 **左值** 引用，以便可以设置和获取值。\n\n### std::shared_ptr\n\n\
  当你想要共享资源的所有权时，可以使用共享指针。为什么要这样做？有几种场景非常适合资源共享，例如在 GUI 程序中，你可能希望共享字体对象、位图对象等。**GoF\
  \ 享元设计模式**是另一个例子。\n\n**std::shared_ptr** 提供了与 **std::unique_ptr** 相同的所有功能，但开销更大，因为它现在需要跟踪对象的引用计数。为\
  \ **std::unique_ptr** 描述的所有操作符也都可以用于 **std::shared_ptr**。一个区别是，创建 **std::shared_ptr**\
  \ 的推荐方法是调用 **std::make_shared<>()**。\n\n在编写库或工厂时，库的作者并不总能知道用户将如何使用已创建的对象，因此建议从工厂方法返回\
  \ **unique_ptr<T>**。原因在于用户可以通过赋值轻松地将 **std::unique_ptr** 转换为 **std::shared_ptr**：\n\
  \n```\nstd::unique_ptr<MyClass> unique_obj = std::make_unique<MyClass>();\nstd::shared_ptr<MyClass>\
  \ shared_obj = unique_obj;\n```\n\n这将转移所有权，并让 **unique_obj** 变为空。\n\n> **注意**\n\
  > \n> 一旦资源被设为共享资源，就不能再恢复为独占对象。\n\n### std::weak_ptr\n\n弱指针是共享指针的一种变体，但它不持有资源的引用计数。因此，当计数归零时，它不会阻止资源被释放。考虑下面的程序结构，它可能出现在普通的图形用户界面（GUI）中：\n\
  \n```\n#include <iostream>\n\n#include <memory>\n\nstruct ScrollBar;\n\nstruct TextWindow;\n\
  \nstruct Panel\n{\n    ~Panel() {\n        std::cout << \"--Panel destroyed\\n\"\
  ;\n    }\n\n    void setScroll(const std::shared_ptr<ScrollBar> sb) {\n        m_scrollbar\
  \ = sb;\n    }\n\n    void setText(const std::shared_ptr<TextWindow> tw) {\n   \
  \     m_text = tw;\n```\n\n```\npanel->setScroll(scrollbar);\n    panel->setText(textwindow);\n\
  }\nint main()\n{\n    std::cout << \"Starting app\\n\";\n    run_app();\n    std::cout\
  \ << \"Exited app\\n\";\n    return 0;\n}\n```\n\n执行时，它输出以下内容：\n\n```\n$ ./weak_ptr.exe\n\
  Starting app\n--ScrollBar destroyed\nExited app\n$\n```\n\n图 3.25：弱指针程序输出\n\n这表明\
  \ panel 和 textwindow 在应用退出时没有被销毁。这是因为它们彼此都持有对方的 shared_ptr，因此两者的引用计数都不会归零，也就不会触发析构。如果我们用图示来描绘这一结构，就可以看到它有一个\
  \ shared_ptr 循环：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_262_0.png)\n\n图 3.26：weak_ptr\
  \ 和 shared_ptr 循环\n\n\n\n\n\n## 智能指针与函数调用\n\n既然我们已经可以管理资源了，那么如何使用它们呢？我们是否要传递智能指针？当我们拥有一个智能指针（`unique_ptr`\
  \ 或 `shared_ptr`）时，调用函数时有四种选择：\n\n- 按值传递智能指针\n- 按引用传递智能指针\n- 按指针传递被管理的资源\n- 按引用传递被管理的资源\n\
  \n这并不是一个详尽的列表，但这些是需要考虑的主要选项。我们如何传递智能指针或其资源，取决于我们对函数调用的意图：\n\n- 函数的意图是否只是使用资源？\n\
  - 函数是否接管资源的所有权？\n- 函数是否替换被管理的对象？\n\n如果函数只是要使用资源，那么它甚至不需要知道它被传递的是一个被管理的资源。它只需要使用它，并且应该通过指针或引用（甚至按值）调用：\n\
  \n```cpp\ndo_something(Resource* resource);\ndo_something(Resource& resource);\n\
  do_something(Resource resource);\n```\n\n如果你想将资源的所有权传递给函数，那么按值传递智能指针并使用 `std::move()`\
  \ 调用函数：\n\n```cpp\ndo_something(std::unique_ptr<Resource> resource);\nauto res =\
  \ std::make_unique<Resource>();\ndo_something(std::move(res));\n```\n\n当 `do_something()`\
  \ 返回时，`res` 变量将为空，资源现在由 `do_something()` 拥有。\n\n如果你想替换被管理的对象（该过程称为重新定位），那么按引用传递智能指针：\n\
  \n```cpp\ndo_something(std::unique_ptr<Resource>& resource);\n```\n\n下面的程序将所有内容结合起来，演示每种场景以及如何调用函数：\n\
  \n```cpp\n#include <iostream>\n#include <memory>\n#include <string>\n#include <sstream>\n\
  \nclass Resource\n{\npublic:\n    Resource() { std::cout << \"+++Resource acquired\
  \ [\" << m_id << \"]\\n\"; }\n    ~Resource() { std::cout << \"---Resource released\
  \ [\" << m_id << \"]\\n\"; }\n    std::string name() const {\n        std::ostringstream\
  \ ss;\n        ss << \"the resource [\" << m_id << \"]\";\n        return ss.str();\n\
  \    }\n    int m_id{++m_count};\n    static int m_count;\n};\n\nint Resource::m_count{0};\n\
  \nvoid use_resource(Resource& res)\n{\n    std::cout << \"Enter use_resource\\n\"\
  ;\n    std::cout << \"...using \" << res.name() << \"\\n\";\n    std::cout << \"\
  Exit use_resource\\n\";\n}\n\nvoid take_ownership(std::unique_ptr<Resource> res)\n\
  {\n    std::cout << \"Enter take_ownership\\n\";\n    if (res)\n        std::cout\
  \ << \"...taken \" << res->name() << \"\\n\";\n    std::cout << \"Exit take_ownership\\\
  n\";\n}\n\nvoid reseat(std::unique_ptr<Resource>& res)\n{\n    std::cout << \"Enter\
  \ reseat\\n\";\n    res.reset(new Resource);\n    if (res)\n        std::cout <<\
  \ \"...reseated \" << res->name() << \"\\n\";\n    std::cout << \"Exit reseat\\\
  n\";\n}\n\nint main()\n{\n    std::cout << \"Starting...\\n\";\n    auto res = std::make_unique<Resource>();\n\
  \n    // Use - pass resource by reference\n    use_resource(*res);\n    if (res)\n\
  \        std::cout << \"We HAVE the resource \" << res->name() << \"\\n\\n\";\n\
  \    else\n        std::cout << \"We have LOST the resource\\n\\n\";\n\n    // Pass\
  \ ownership - pass smart pointer by value\n    take_ownership(std::move(res));\n\
  \    if (res)\n        std::cout << \"We HAVE the resource \" << res->name() <<\
  \ \"\\n\\n\";\n    else\n        std::cout << \"We have LOST the resource\\n\\n\"\
  ;\n\n    // Replace (reseat) resource - pass smart pointer by reference\n    reseat(res);\n\
  \    if (res)\n        std::cout << \"We HAVE the resource \" << res->name() <<\
  \ \"\\n\\n\";\n    else\n        std::cout << \"We have LOST the resource\\n\\n\"\
  ;\n\n    std::cout << \"Exiting...\\n\";\n    return 0;\n}\n```\n\n当我们运行此程序时，我们得到以下输出：\n\
  \n```text\n$ ./pass_smart\nStarting...\n+++Resource acquired [1]\nEnter use_resource\n\
  ...using the resource [1]\nExit use_resource\nWe HAVE the resource the resource\
  \ [1]\n\nEnter take_ownership\n...taken the resource [1]\nExit take_ownership\n\
  ---Resource released [1]\nWe have LOST the resource\n\nEnter reseat\n+++Resource\
  \ acquired [2]\n...reseated the resource [2]\nExit reseat\nWe HAVE the resource\
  \ the resource [2]\n\nExiting...\n---Resource released [2]\n$\n```\n\n图 3.27：所有权传递程序输出\n\
  \n## 注意\n\nC++ 核心准则对资源管理、智能指针以及如何使用它们有一个完整的章节：http://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#S-resource。我们只触及了准则中涵盖的最重要方面。\n\

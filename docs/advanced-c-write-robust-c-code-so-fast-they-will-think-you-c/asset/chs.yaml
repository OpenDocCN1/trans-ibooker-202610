  这段代码中有几件事需要注意。首先，类型声明为 `int[]`。我们为本次练习选择了 `int`，但它可以是几乎任何类型。其次，当 **unique_ptr**（以及从\
  \ C++17 开始的 **shared_ptr**）用于管理数组时，**operator[]** 被定义。因此，我们通过从二维索引计算一维索引来模拟二维数组：**board[i\
  \ * 8 + j]**。\n\n16. 编辑该方法的第一行并声明 **auto** 类型：\n\n```cpp\nauto board = std::make_unique<int[]>(8\
  \ * 8);\n```\n\n17. 单击 **Run** 按钮编译并运行程序——输出将与之前的运行结果相同。这是一个 `auto` 非常有帮助的案例，因为你不再需要在类型声明中输入所有细节，也不需要在\
  \ `make_unique()` 调用中重复。\n\n在本练习中，我们实现了一个工厂函数，使用 `unique_ptr` 来管理传感器的生命周期。我们随后实现了代码，将其从\
  \ `unique_ptr` 更改为共享给多个对象。最后，我们开发了一种 `unique_ptr` 技术，使用一维数组来管理多维数组。\n\n## Rule of\
  \ Zero/Five – A Different Perspective\n\n当我们引入 **BufferedWriter** 时，它管理着两种资源：内存和文件。我们随后讨论了默认编译器生成的拷贝操作是所谓的浅拷贝。我们谈到了如何以不同的方式管理资源——停止拷贝、执行深拷贝或转移所有权。我们在这些情况下所做的决定被称为资源管理策略。你选择的策略会影响你执行\
  \ **Rule of Zero/Five** 的方式。\n\n就资源管理而言，一个类可以不管理任何资源、管理可以拷贝但不能移动的资源、管理可以移动但不能拷贝的资源，或管理不应被拷贝也不应被移动的资源。以下类展示了这些可能的表现形式：\n\
  \n```cpp\nstruct NoResourceToManage\n{\n    // use compiler-generated copy & move\
  \ constructors and operators\n};\n```\n\n```cpp\nstruct CopyOnlyResource\n{\n  \
  \  ~CopyOnlyResource()                                   {/* defined */ }\n    CopyOnlyResource(const\
  \ CopyOnlyResource& rhs)          {/* defined */ }\n    CopyOnlyResource& operator=(const\
  \ CopyOnlyResource& rhs) {/* defined */ }\n    CopyOnlyResource(CopyOnlyResource&&\
  \ rhs) = delete;\n    CopyOnlyResource& operator=(CopyOnlyResource&& rhs) = delete;\n\
  ```\n\n### Activity 1: Implementing Graphics Processing with RAII and Move\n\n在第\
  \ 2A 章 No Ducks Allowed – Types and Deduction 中，你的团队努力工作并完成了 Point3d 和 Matrix3d\
  \ 的实现。现在，你的公司希望推广该库，在推广之前需要进行两项重大改进：\n\n- 类必须位于我们公司的命名空间中，即 Advanced C Plus Plus\
  \ Inc。因此，图形的命名空间为 `accp::gfx`。\n- Point3d 和 Matrix3d 中矩阵的存储是类的内在组成部分，因此它是从栈分配而不是堆分配。随着库矩阵支持的演进，我们需要从堆分配内存。随着我们为未来版本实现更大矩阵的目标，我们还希望在我们的类中引入移动语义。\n\
  \n按照以下步骤实现此目标：\n\n1. 以我们当前版本的库为起点（可在 Lesson3/Activity01 文件夹中找到），将我们所有的类都放入 `accp::gfx`\
  \ 命名空间中。\n2. 修复因更改而导致的所有失败的测试。（失败可能意味着编译失败，而不仅仅是测试运行失败。）\n3. 在 Matrix3d 中，将矩阵直接在类中声明的方式改为堆分配内存用于存储。\n\
  4. 通过实现拷贝构造函数的深拷贝实现和拷贝赋值运算符来修复失败的测试。进行必要的其他更改以适应新的内部表示。注意，你不需要修改任何测试即可使它们通过；它们只访问公共接口，这意味着我们可以更改内部结构而不影响客户端。\n\
  5. 通过在返回语句中使用 `std::move` 强制在 `CreateTranslationMatrix()` 中调用移动构造函数来触发另一个失败。在 Matrix3d\
  \ 类中引入所需的移动操作以使测试编译并通过。\n6. 对 Point3d 重复步骤 3 到 4。\n\n实现上述步骤后，预期的输出应与开始时保持不变：\n\n\
  ```text\n------ Activity 1 ------\nThe point [ 1, 1, 1, 1 ]\n...rotated around X\
  \ by 90 degrees\n...rotated around Y by 90 degrees\n...rotated around Z by 90 degrees\n\
  moves to [ 1, 1, -1, 1 ]\n...scaled by x=2, y = 3, z = 4\nmoves to [ 2, 3, -4, 1\
  \ ]\n...translated by dx=-2, dy = 1, dz = -3\nmoves to [ 0, 4, -7, 1 ]\n\nComplete.\n\
  ```\n\n图 3.34：成功转换为使用 RAII 后的活动 1 输出\n\n> **Note**\n>\n> 本活动的解决方案可在第 657 页找到。\n\n\
  ## When Is a Function Called?\n\nC++ 程序执行的所有操作本质上都是函数调用（尽管编译器可能会将它们优化为内联的操作序列）。然而，由于\
  \ **syntactic sugar** 的存在，可能并不明显你正在进行函数调用。Syntactic sugar 是编程语言中的语法，使其更易于阅读或表达。例如，当你写\
  \ **a = 2 + 5** 时，你本质上是在调用 **operator=(&a, operator+(2, 5))**。只是语言允许我们写第一种形式，但第二种形式允许我们重载运算符并将这些功能扩展到用户定义的类型。\n\
  \n以下机制会导致函数调用：\n\n- 显式调用函数。\n- 所有运算符，如 +, -, *, /, % 等，以及 `new`/`delete`。\n- 变量声明——如果存在初始化值，将导致使用参数调用构造函数。\n\
  - 用户定义字面量——我们尚未处理这些，但本质上，我们为类型 `operator \"\" name(argument)` 定义重载。然后我们可以写诸如 `10_km`，这使我们的代码更易于理解，因为它携带了语义信息。\n\
  - 从一种值到另一种值的转换（`static_cast<>`、`const_cast<>`、`reinterpret_cast<>` 和 `dynamic_cast<>`）。同样，我们有另一个运算符重载，允许我们将一种类型转换为另一种类型。\n\
  - 在函数重载期间，可能需要将一种类型转换为另一种类型以使其匹配函数原型。它可以通过使用正确参数类型的构造函数创建临时对象来实现，也可以通过隐式调用的转换运算符来实现。\n\
  \n每一个都会导致编译器确定必须调用一个函数。确定需要调用函数后，它必须找到与名称和参数匹配的函数。这就是我们将在下一节中讨论的内容。\n\n## Which\
  \ Function to Call\n\n在第 2A 章 No Ducks Allowed – Types and Deduction 中，我们看到函数重载解析按如下方式执行：\n\
  \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_276_0.png)\n\n\n\n\n我们真正没有深入探讨的是名称查找的概念。在某个时刻，编译器会遇到对\
  \ func 函数的以下调用：\n\n```\nfunc(a, b);\n```\n\n此时，它必须将该名称与引入它的声明关联起来。这个过程称为**名称查找**。名称查找适用于程序中的全部项（变量、命名空间、类、函数、函数模板和模板）。程序要成功编译，变量、命名空间和类的名称查找过程必须产生唯一的声明。然而，对于函数和函数模板，编译器可能会将同一个名称与多个声明关联起来——这主要是通过函数重载实现的，而且由于**实参依赖查找（ADL）**，还可能进一步扩展以考虑额外的函数。\n\
  \n## 标识符\n\n根据 C++ 标准的定义，**标识符**是由大写和小写拉丁字母、数字、下划线以及大多数 Unicode 字符组成的序列。有效的标识符必须以非数字字符开头，长度任意，并且区分大小写。每个字符都是有意义的。\n\
  \n## 名称\n\n**名称**用于指代实体或标签。名称有以下形式之一：\n\n- 标识符\n- 函数表示法中的重载运算符名称（例如 operator-、operator\
  \ delete）\n- 模板名称后跟其参数列表（vector<int>）\n- 用户定义的转换函数名称（operator float）\n- 用户定义的字面量运算符名称（operator\
  \ \"\"_ms）\n\n每个实体及其名称都由声明引入，而标签名称则由 **goto** 语句或带标签的语句引入。名称可以在一个文件（或翻译单元）中多次使用，以根据作用域指代不同的实体。名称也可以跨多个文件（翻译单元）指代同一个实体，也可能指代不同的实体，具体取决于链接性。编译器通过**名称查找**将引入名称的声明与程序中的未知名称关联起来。\n\
  \n## 名称查找\n\n名称查找过程分为两种，具体根据上下文选择：\n\n- **限定名称查找**：名称出现在作用域解析运算符 `::` 的右侧，或者可能出现在\
  \ `::` 之后并跟着 **template** 关键字。限定名称可以引用命名空间成员、类成员或枚举器。`::` 运算符左侧的名称定义了进行查找的作用域。如果没有名称，则使用全局命名空间。\n\
  - **非限定名称查找**：其他所有情况。在这种情况下，名称查找会检查当前作用域以及所有外围作用域。\n\n如果非限定名称位于函数调用运算符 `()` 的左侧，则使用实参依赖查找。\n\
  \n## 实参依赖查找\n\n用于查找非限定函数名称的规则集合称为**实参依赖查找**（简称 ADL），或 **Koenig 查找**（以 Andrew Koenig\
  \ 的名字命名，他是该规则的提出者，也是 C++ 标准委员会的长期成员）。非限定函数名称既可以出现在函数调用表达式中，也可以作为重载运算符的隐式函数调用的一部分。\n\
  \nADL 的基本含义是：除了非限定名称查找期间考虑的作用域和命名空间之外，还会考虑所有实参和模板参数的“关联命名空间”。请看以下代码：\n\n```\n#include\
  \ <iostream>\n\n#include <string>\n\nint main()\n{\n    std::string welcome{\"Hello\
  \ there\"};\n    std::cout << welcome;\n    endl(std::cout);\n}\n```\n\n## 买者自负\n\
  \n我们已经看到，ADL 通过包含与函数实参类型相关的命名空间，让程序员的生活变得更轻松。然而，这种查找能力并非没有风险，尽管在大多数情况下我们可以将风险降到最低。请考虑以下示例代码：\n\
  \n```\n#include <iostream>\n\nnamespace mylib\n{\nvoid is_substring(std::string\
  \ superstring, std::string substring)\n{\n    std::cout << \"mylib::is_substring()\\\
  n\";\n}\n\nvoid contains(std::string superstring, const char* substring) {\n   \
  \ is_substring(superstring, substring);\n}\n}\n\nint main() {\n    mylib::contains(\"\
  Really long reference\", \"included\");\n}\n```\n\n当我们编译并运行上述程序时，会得到预期的输出：\n\n```\n\
  $ ./adl_caveat.exe\nmylib::is_substring()\n$\n```\n\n图 3.36：ADL 示例程序的输出\n\n然后 C++\
  \ 标准委员会决定引入一个 **is_substring()** 函数，如下所示：\n\n```\nnamespace std {\n    void is_substring(std::string\
  \ superstring, const char* substring)\n    {\n        std::cout << \"std::is_substring()\\\
  n\";\n    }\n}\n```\n\n如果我们将这个函数添加到文件顶部，编译并重新运行，现在会得到以下输出：\n\n```\n$ ./adl_caveat.exe\n\
  std::is_substring()\n$\n```\n\n图 3.37：ADL 问题程序的输出\n\n由于 ADL，（下一个 C++ 标准的）编译器选择了另一个实现，认为它更适合对\
  \ **is_substring()** 的非限定函数调用。而且由于实参的隐式转换，它不会产生会导致歧义和编译错误的冲突。它只是静默地采用新方法，如果实参顺序不同，这可能导致难以发现的细微\
  \ bug。编译器只能检测类型和语法上的差异，无法检测语义上的差异。\n\n**注意**\n\n为了演示 ADL 的工作原理，我们将函数添加到了 std 命名空间中。命名空间的目的是分离关注点，而添加到他人命名空间，尤其是**标准库命名空间（std）**，并不是好的做法。\n\
  \n那么，为什么是买者自负（买家当心）呢？如果你在开发中使用第三方库（包括 C++ 标准库），那么在升级库时，你需要确保接口的更改不会因为 ADL 而给你带来问题。\n\
  \n### 练习 5：实现模板以避免 ADL 问题\n\n在本练习中，我们将演示 C++17 STL 中一个不兼容的更改，该更改在实际使用中可能引发问题。C++11\
  \ 引入了 `std::begin(type)` 及相关函数的模板。作为开发人员，这是通用接口的一种很有吸引力的表达方式，你可能已经编写了自己的 size(type)\
  \ 和 empty(type) 版本。请按照以下步骤完成本练习：\n\n- 1. 在 Eclipse 中打开 **Lesson3** 项目。然后在**项目资源管理器**中展开\
  \ **Lesson3**，再展开 **Exercise05**，双击 **Exercise5.cpp** 在编辑器中打开本练习的文件。\n- 2. 单击**启动配置**下拉菜单，选择**新启动配置...**。从“搜索项目”菜单中配置\
  \ **L3Exercise5** 应用程序，使其以名称 **L3Exercise5** 运行。\n- 3. 单击**运行**按钮运行练习 5。这将产生以下输出：\n\
  \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_282_0.png)\n\n图 3:38：练习 5 执行成功\n- 4.\
  \ 检查代码可以发现两个辅助模板：\n\n```\ntemplate<class T>\nbool empty(const T& x)\n{\n    return\
  \ x.empty();\n}\n\ntemplate<class T>\nint size(const T& x)\n{\n    return x.size();\n\
  }\n```\n\n## 隐式转换\n\n在确定图 3.36 中的函数候选集（即函数重载解析）时，编译器必须检查名称查找过程中找到的所有可用函数，并确定实参的数量和类型是否与调用点匹配。在确定类型是否匹配时，它还会检查所有可用的转换，以确定是否存在从类型\
  \ T1（传入实参的类型）到类型 T2（函数参数指定的类型）的转换机制。如果所有实参都能从 T1 转换为 T2，那么该函数就会被添加到候选集。\n\n这种从类型\
  \ T1 到类型 T2 的转换称为隐式转换，当某个类型 T1 被用于不接受该类型但接受另一个类型 T2 的表达式或上下文时，就会发生这种转换。这种情况发生在以下上下文中：\n\
  \n- 调用以 T2 为参数声明的函数时，T1 作为实参传递。\n- T1 用作期望 T2 的运算符的操作数。\n- T1 用于初始化 T2 的新对象（包括 return\
  \ 语句）。\n- T1 用于 switch 语句中（在这种情况下，T2 是 int）。\n- T1 用于 if 语句或 do-while 或 while 循环中（在这种情况下，T2\
  \ 是 bool）。\n\n如果存在从 T1 到 T2 的无歧义转换序列，那么程序将能够编译。内置类型之间的转换通常由通常的算术转换决定。\n\n## 显式——防止隐式转换\n\
  \n隐式转换是一个非常出色的特性，它使程序员能够表达自己的意图，而且在大多数情况下都能正常工作。然而，编译器无需程序员提供提示就能将一种类型转换为另一种类型，这种能力并不总是可取的。请考虑下面这个小程序：\n\
  \n```\n#include <iostream>\n```\n\n```\nclass Real\n{\npublic:\n```\n\n\n```cpp\n\
  Real(double value) : m_value{value} {}\n\noperator float() { return m_value; }\n\
  \nfloat getValue() const { return m_value; }\n\nprivate:\n    double m_value {0.0};\n\
  };\n\nvoid test(bool result)\n{\n    std::cout << std::boolalpha;\n    std::cout\
  \ << \"Test => \" << result << \"\\n\";\n}\n\nint main()\n{\n    Real real{3.14159};\n\
  \n    test(real);\n\n    if ( real )\n    {\n        std::cout << \"true: \" <<\
  \ real.getValue() << \"\\n\";\n    }\n    else\n    {\n        std::cout << \"false:\
  \ \" << real.getValue() << \"\\n\";\n    }\n}\n```\n\n当我们编译并运行前面的程序时，我们得到以下输出：\n\
  \n```\n$ ./implicit.exe\nTest => true\ntrue: 3.14159\n$\n```\n\nFigure 3.40: Implicit\
  \ conversion sample program output\n\n嗯，这可能有点出乎意料，因为它编译了并且确实产生了输出。real 变量的类型是 Real，它有一个转换为\
  \ float 的转换运算符 – operator float()。test() 函数接受一个 bool 作为参数，而 if 条件也必须产生一个 bool。编译器会将任何数值类型转换为布尔类型，如果值为零则为\
  \ false，如果值不为零则为 true。但如果这不是我们想要的行为，我们可以通过在函数声明前加上 explicit 关键字来阻止它。假设我们将该行更改为如下所示：\n\
  \n```\nexplicit operator float() {return m_value;}\n```\n\n如果我们现在尝试编译它，我们会得到两个错误：\n\
  \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_286_0.png)\n\nFigure 3.41: Compile errors\
  \ because implicit conversion was removed.\n\n两者都与无法将 Real 类型转换为 bool 有关 – 首先，在调用\
  \ test() 的位置，然后在 if 条件中。\n\n现在，让我们引入一个 bool 转换运算符来修复这个问题。\n\n```\noperator bool()\
  \ {return m_value == 0.0;}\n```\n\n我们现在可以再次构建程序。我们将收到以下输出：\n\n```\n$ ./implicit.exe\n\
  Test => false\nfalse: 3.14159\n$\n```\n\nFigure 3.42: Introducing the bool operator\
  \ replaces implicit conversion\n\n布尔值现在为 false，而之前为 true。这是因为 float 转换返回的值的隐式转换不为零，然后被转换为\
  \ true。\n\n自 C++ 11 以来，所有构造函数（复制和移动构造函数除外）都被视为转换构造函数。这意味着如果它们没有用 explicit 声明，则可用于隐式转换。同样，任何未声明为\
  \ explicit 的强制转换运算符都可用于隐式转换。\n\nC++ 核心指南有两个与隐式转换相关的规则：\n\n- C.46: 默认情况下，将单参数构造函数声明为\
  \ explicit\n- C.164: 避免隐式转换运算符\n\n## Contextual Conversion\n\n如果我们现在对小程序再做一个更改，我们就可以进入所谓的上下文转换。让我们使\
  \ bool 运算符变为 explicit 并尝试编译程序：\n\n```\nexplicit operator bool() {return m_value\
  \ == 0.0;}\n```\n\n我们将收到以下输出：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_287_0.png)\n\
  \nFigure 3.43: Compile errors with explicit bool operator\n\n这次我们在调用 **test()**\
  \ 的位置只有一个错误，但 if 条件没有错误。我们可以通过使用 C 风格的 case (bool) 或 C++ **static_cast<bool>(real)**\
  \ 来修复此错误（这是首选方法）。当我们添加强制转换时，程序会编译并再次运行。\n\n那么，如果 bool 强制转换是显式的，为什么 if 表达式的条件不需要强制转换呢？\n\
  \nC++ 标准允许在某些期望 **bool** 类型且存在 bool 转换声明（无论是否标记为 explicit）的上下文中进行隐式转换。如果发生这种情况，则允许隐式转换。这被称为\
  \ **上下文转换为 bool**，可以发生在以下上下文中：\n\n- **if**、**while**、**for** 的条件（或控制表达式）\n- 内置逻辑运算符\
  \ **!**（非）、**&&**（与）和 **||**（或）的操作数\n- 三元（或条件）运算符 **?:** 的第一个操作数\n\n### Exercise\
  \ 6: Implicit and Explicit Conversions\n\n在本练习中，我们将通过调用函数、隐式转换、阻止它们以及启用它们来实验。按照以下步骤实现此练习：\n\
  \n- 1. 在 Eclipse 中打开 **Lesson3** 项目。然后在 **Project Explorer** 中展开 **Lesson3** 然后\

  \ **Exercise02** 并双击 **Exercise2.cpp** 以在编辑器中打开此练习的文件。\n- 2. 单击 **Launch Configuration**\
  \ 下拉菜单并选择 **New Launch Configuration...**\n- 3. 配置 **Exercise2** 以使用名称 **Exercise2**\
  \ 运行。完成后，它将成为当前选定的 Launch Configuration。\n\n\n\n\n\n+   4. 点击**运行**按钮。练习 2 将运行并产生以下输出：\n\
  \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_111_0.png)\n\n图 2A.17：exercise2 程序的输出\n\
  \n+   5. 进入编辑器，通过移动 `gcd` 函数使其位于 `main` 之后来修改代码。修改后的代码应该如下所示：\n\n```\n```cpp\nint\
  \ main(int argc, char**argv)\n{\n    std::cout << \"\\n\\n----- Exercise 2 -----\\\
  n\";\n    std::cout << \"The greatest common divisor of 44 and 121 is \" <<\n  \
  \  gcd(44, 121) << \"\\n\";\n    std::cout << \"Complete.\\n\";\n    return 0;\n\
  }\n\nint gcd(int x, int y)\n{\n    while(y!=0)\n    {\n        auto c{x%y};\n  \
  \      x = y;\n        y = c;\n    }\n    return x;\n}\n```\n```\n\n+   6. 再次点击**运行**按钮。当**工作区中存在错误**对话框出现时，点击**取消**。在\
  \ **CDT 构建控制台 [Lesson2A]** 中，我们将看到失败的原因：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_112_0.png)\n\
  \n*图 2A.18：由于未定义函数导致的构建失败*\n\n这一次，编译器不知道如何处理对 gcd() 函数的调用。在需要调用该函数的位置，编译器对它一无所知，即使它定义在同一个文件中，只是在调用之后。\n\
  \n+   7. 在编辑器中，将前向声明放在 main 函数定义之前。并在末尾添加一个分号 (;)：\n\n```\n```cpp\nint gcd(int x,\
  \ int y);\n```\n```\n\n+   8. 再次点击**运行**按钮。这一次，程序编译成功，之前的输出得以恢复。\n\n在本练习中，我们学习了如何前向声明函数，以及如何排查因函数在使用前未声明而出现的编译器错误。\n\
  \n在早期版本的 C 编译器中，这是可以接受的。程序会假定该函数存在并返回一个 int。函数的参数可以从调用中推断出来。然而，在现代 C++ 中情况并非如此，因为在使用函数、类、变量等之前必须先声明它们。在下一节中，我们将学习指针类型。\n\
  \n## 指针类型\n\n由于起源于 C 语言，即编写优化高效的系统并直接访问硬件，C++ 允许将变量声明为指针类型。其格式如下：\n\n```\n```cpp\n\
  type-specifier* pvar = &var;\n```\n```\n\n这与之前的写法相同，但有两处不同：\n\n-   使用特殊的声明符星号 (*)\
  \ 来表示名为 pvar 的变量指向内存中的一个位置或地址。\n-   它使用特殊的 & 运算符（与号）进行初始化，在这种上下文中，& 告诉编译器返回 var\
  \ 变量的地址。\n\n由于 C 是一种高级语言，但具有低级访问能力，指针允许用户直接访问内存，这在希望向硬件提供输入/输出并因此控制硬件时很有帮助。指针的另一个用途是，让函数能够访问公共数据项，并省去调用函数时复制大量数据的需要，因为默认情况下是按值传递。要访问指针所指向的值，需要使用特殊的星号运算符\
  \ (*) 来**解引用**该位置：\n\n```\nint five = 5;             // declare five and initialize\
  \ it\n\nint *pvalue = &five;       // declare pvalue as pointer to int and have\
  \ it\n                           // point to the location of five\n\n*pvalue = 6;\
  \               // Assign 6 into the location five.\n```\n\n下图展示了编译器如何分配内存。**pvalue**\
  \ 需要内存来存储指针，而 **five** 需要内存来存储整数值 5：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_113_0.png)\n\
  \n**图 2A.19：指针变量的内存布局**\n\n当通过指针访问用户自定义类型时，还有第二个特殊运算符 (->) 也用于解引用成员变量和函数。在现代 C++\
  \ 中，这些指针被称为**原始指针**，其使用方式已经发生了显著变化。在 C 和 C++ 中使用指针一直对程序员来说具有挑战性，错误地使用指针是许多问题的根源，其中最常见的是资源泄漏。资源泄漏是指程序为了使用而占用了一个资源（内存、文件句柄或其他系统资源），但在使用完后未能释放它。这些资源泄漏可能导致性能问题、程序故障，甚至系统崩溃。在现代\
  \ C++ 中，使用原始指针来管理资源的所有权现在已被弃用，因为 C++11 引入了智能指针。智能指针（在 STL 中作为类实现）现在负责进行所需的资源管理，以成为宿主系统中的“良好公民”。关于这一点的更多内容将在*第\
  \ 3 章：能与应该之间的距离——对象、指针和继承*中介绍。\n\n在前面的代码中，当声明 **pvalue** 时，编译器只分配内存来存储它将引用的内存地址。与其他变量一样，你应该始终确保指针在使用前被初始化，因为解引用未初始化的指针会导致未定义的行为。到底分配多少内存来存储指针，取决于编译器所针对的系统以及处理器支持的位数。但所有指针的大小都是相同的，无论它们指向什么类型。\n\
  \n指针也可以传递给函数。这允许函数访问所指向的数据，并可能修改它。考虑下面 swap 的实现：\n\n```\nvoid swap(int* data1, int*\
  \ data2)\n{\n    int temp{*data1};      // Initialize temp from value pointed to\
  \ by\ndata1\n    *data1 = *data2;       // Copy data pointed to by data2 into location\n\
  \                          // pointed to by data1\n    *data2 = temp;         //\
  \ Store the temporarily cached value from\ntemp\n                          // into\
  \ the location pointed to by data2\n}\n```\n\n这展示了如何将指针声明为函数的参数，如何使用解引用运算符 * 从指针获取值，以及如何通过解引用运算符设置值。\n\
  \n下面的示例使用 new 运算符从宿主系统分配内存，并使用 delete 运算符将其释放回宿主系统：\n\n```\nchar* name = new char[20];\
  \   // Allocate 20 chars worth of memory and\nassign it\n\n                    \
  \      // to name.\n\n    Do something with name\n\ndelete [] name;\n```\n\n在前面的代码中，第一行使用\
  \ new 运算符的数组分配形式创建了一个包含 20 个字符的数组。它调用宿主系统为我们分配 20 * sizeof(char) 字节的内存。到底分配多少内存由宿主系统决定，但保证至少为\
  \ 20 * sizeof(char) 字节。如果无法分配所需内存，则会发生以下两种情况之一：\n\n-   它将抛出异常\n-   它将返回 `nullptr`。这是\
  \ C++11 中引入的一个特殊字面量。更早之前，C++ 使用 0 或 NULL 来表示无效指针。C++11 也将其变成了强类型值。\n\n在大多数系统上，结果是第一种情况，你需要处理该异常。第二种情况可能出现在两种场景中——调用\
  \ new 的 nothrow 变体，即 `new(std::nothrow) int [250]`，或者在异常处理开销不够确定的嵌入式系统上。\n\n最后，请注意对\
  \ delete 的调用使用了 delete 运算符的数组形式，即使用方括号 []。确保 new 和 delete 运算符使用相同的形式非常重要。当 new 用于用户自定义类型（将在下一节讨论）时，它做的不仅仅是分配内存：\n\
  \n```\nMyClass* object = new MyClass;\n```\n\n在前面的代码中，对 new 的调用分配了足够的内存来存储 MyClass，如果成功，它接着调用构造函数来初始化数据：\n\
  \n```\nMyClass* objects = new MyClass[12];\n```\n\n在前面的代码中，对 new 的调用分配了足够的内存来存储\
  \ 12 个 MyClass 对象，如果成功，它接着调用构造函数 12 次来初始化每个对象的数据。\n\n请注意，在前面代码片段中声明的 **object**\
  \ 和 **objects** 具有**相同的类型**。严格来说，**objects** 应该是指向 MyClass 数组的指针，但它实际上是指向 MyClass\
  \ 实例的指针。**objects** 指向 MyClass 数组中的第一个实例。\n\n考虑以下代码片段：\n\n```\nvoid printMyClasses(MyClass*\
  \ objects, size_t number)\n{\n    for( auto i{0U} ; i<number ; i++ ) {\n       \
  \ std::cout << objects[i] << \"\\n\";\n    }\n}\n```\n\n\n\n\n\n```cpp\n}\n\nvoid\
  \ process()\n{\n    MyClass objects[12];\n\n    // Do something with objects\n \
  \   printMyClasses(objects, sizeof(objects)/sizeof(MyClass));\n}\n```\n\n在 `process()`\
  \ 函数中，`objects` 的类型是“包含 12 个 `MyClass` 项的数组”，但当它被传递给 `printMyClasses()` 时，它会被编译器转换为“指向\
  \ `MyClass` 的指针”类型。这是按设计进行的（继承自 C），被称为数组衰减，并且可能是新手程序员出错的原因。我们可以尝试按如下方式声明 `printMyClasses()`：\n\
  \n```cpp\nvoid printMyClasses(MyClass objects[12], size_t number);\n```\n\n这仍然会遭受数组衰减，因为编译器将参数对象更改为\
  \ `MyClass*`；在此情况下它不会保留维度信息。数组衰减就是我们需要将 `number` 传递给 `printMyClasses()` 函数的原因：这样我们才知道数组中有多少项。C++\
  \ 提供了两种处理数组衰减的机制：\n\n- 使用迭代器将范围传递给方法。STL 容器（参见第 2B 章《No Ducks Allowed – Templates\
  \ and Deduction》中的 C++ 预打包模板部分）提供 `begin()` 和 `end()` 方法，以便我们可以获取迭代器，让算法遍历数组或其一部分。\n\
  \n> **注意：** 对于 C++20，ISO 标准委员会正在考虑纳入一种称为 Ranges 的概念，它将允许 `begin` 和 `end` 迭代器被捕获在一个对象中。\n\
  \n- 使用模板（参见第 2B 章《No Ducks Allowed – Templates and Deduction》中的非类型模板参数部分）。\n\n###\

  \n  *图 6.6：用户自定义类型输出到文件的结果*\n\n- **9.** 现在，让我们将这些数据读取到变量中。创建一个 `std::ifstream` 类的实例。打开名为\
  \ `pricesFile` 的文件。检查流是否已成功打开，如果没有则打印错误消息：\n\n  ```cpp\n  std::ifstream inFile(pricesFile);\n\

  \ 练习 5：使用配置文件引导优化\n\n在本练习中，我们将在上一个练习的代码上使用配置文件引导优化。我们将了解如何将配置文件引导优化与 gcc 编译器一起使用。\n\
  \n执行以下步骤完成本练习：\n\n- 1. 打开终端，并在启用性能分析（profiling）的情况下编译上一个练习中的代码。加上我们需要的其他优化标志（此处为\
  \ -O3）。编写以下代码来实现这一点：\n\n  $ g++ -O3 -fprofile-generate Snippet3.cpp\n\n- 2. 现在，通过编写以下命令来运行已生成性能分析数据的代码版本：\n\

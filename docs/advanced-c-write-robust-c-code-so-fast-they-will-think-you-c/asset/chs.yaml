  \ 代码的计时统计信息\n\n请注意，**整数乘法（IMUL）**指令（整数乘法）占用了超过 **99%** 的执行时间。传统上，在 **x86** 架构上，整数乘法运算始终代价高昂，即使在最新一代\
  \ CPU 中也是如此。该注释视图会在每条跳转或分支指令旁显示箭头；当高亮显示时，它会用线条图显示该指令关联的比较指令以及跳转到的地址。你可以按左箭头键返回到上一个视图，并使用\
  \ *q* 键退出程序。\n\n尽管现代处理器通过**分支预测**和**推测执行**电路减轻了分支开销，但循环展开仍然能带来性能收益。在 **gcc** 和 **clang**\

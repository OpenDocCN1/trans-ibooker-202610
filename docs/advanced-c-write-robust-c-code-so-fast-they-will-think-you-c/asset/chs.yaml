  \ 的性能提升如此微不足道？\n  `std::unordered_set` 执行一次哈希操作，然后可能进行几次内存访问即可到达存储的值。我们使用的 Bloom\
  \ filter 执行三次哈希操作和三次内存访问。因此，本质上，Bloom filter 所做的工作比哈希表更多。由于我们的词典中只有 31,870 个单词，Bloom\
  \ filter 的缓存优势就丧失了。这又是传统数据结构分析与现实结果不符的另一个案例，因为缓存的原因。\n- 使用更大或更小的容量 Bloom filter\
  \ 的效果是什么？\n  当使用更大的容量时，哈希冲突和误报会减少，但缓存行为会变差。相反，当使用更小的容量时，哈希冲突和误报会增加，但缓存行为会改善。\n-\
  \ 使用更少或更多的哈希函数会发生什么？\n  使用的哈希函数越多，误报越少，反之亦然。\n- 在什么条件下，这个版本会比 Speller2.cpp 中的版本快得多？\n\
  \  Bloom filter 在测试几个位成本低于在哈希表中访问值的成本时效果最好。这只有在 Bloom filter 位完全适合缓存且词典不适合时才成立。\n\

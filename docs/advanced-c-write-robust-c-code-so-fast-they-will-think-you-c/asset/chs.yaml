- '# 前言


  **关于本节**


  本节简要介绍作者、本书涵盖的内容、你开始学习所需的技术技能，以及完成所有活动和练习所需的硬件和软件要求。


  ## 关于本书


  C++ 是使用最广泛的编程语言之一，应用于从游戏到**图形用户界面（GUI）**编程甚至操作系统的各个领域。如果你希望拓展职业机会，掌握 C++ 的高级特性是关键。


  本书从高级 C++ 概念开始，帮助你解读复杂的 C++ 类型系统，并理解编译的各个阶段如何将源代码转换为目标代码。然后，你将学习如何识别用于控制执行流程、捕获数据和传递数据的工具。通过创建小型模型，你甚至会发现如何在
  C++ 中使用高级 lambda 和捕获，并表达常见的 API 设计模式。在后续章节中，你将通过学习内存对齐、缓存访问以及程序运行时间来探索优化代码的方法。最后一章将通过理解现代
  CPU 分支预测以及如何让你的代码对缓存友好，帮助你最大化性能。


  读完本书后，你将掌握令你从其他 C++ 程序员中脱颖而出的编程技能。



  \ 696 页找到。\n\n## 摘要\n\n在本章中，我们学习了 C++ 中的 I/O 操作。我们探讨了 I/O 标准库，它为同步 I/O 操作提供了接口。此外，我们还考虑了用于异步\
  \ I/O 的依赖于平台的原生工具，以及用于跨平台异步 I/O 操作的 Boost.Asio 库。我们还学习了如何在多线程应用程序中使用 I/O 流。\n\n\
  我们首先了解了标准库为 I/O 操作提供的基本特性。我们学习了预定义的流对象，例如 std::cin 和 std::cout。在实践中，我们学习了如何使用标准流并重载移位运算符，以便轻松读写自定义数据类型。\n\
  \n接下来，我们练习了如何创建额外的流。我们从基础的流类继承，实现了我们自己的流缓冲区类，并在练习中实践了它们的用法。我们了解了最适合继承的流类，并考虑了它们的优缺点。\n\
  \n然后，我们探讨了在不同操作系统上进行异步 I/O 操作的方法。我们简要考虑了使用名为 Boost.Asio 的跨平台 I/O 库，它为同步和异步操作都提供了接口。\n\
  \n最后，我们学习了如何在多线程应用程序中执行 I/O 操作。我们通过构建一个多线程日志记录器将所有新技能付诸实践。我们创建了一个日志记录器抽象，并将其应用于艺术画廊模拟器中。最终，我们创建了一个简单、清晰且健壮的日志系统，使我们可以轻松地使用日志调试应用程序。总之，我们运用了本章所学的所有知识。\n\
  \n在下一章中，我们将深入了解应用程序的测试与调试。我们将从学习断言和安全网（异常处理）开始。然后，我们将练习为接口编写单元测试和模拟（mock）。之后，我们将在\
  \ IDE 中练习调试应用程序：使用断点、监视点和数据可视化。最后，我们将编写一个活动来掌握我们的代码测试技能。\n\n## 引言\n\n在**软件开发生命周期（SDLC）**中，一旦需求收集阶段完成，通常就会进入设计与架构阶段，在此阶段定义项目的高层流程，并将其分解为更小的模块组件。当项目中有许多团队成员时，有必要明确分配每个团队成员负责模块的特定部分，并让他们了解自己的需求。这样，他们就可以在隔离的环境中独立编写自己的代码部分，并确保其正常运行。一旦他们的工作部分完成，他们就可以将自己的模块与其他开发者的模块集成，并确保整个项目按照需求执行。\n\
  \n这个概念也适用于小型项目，开发者完全专注于一个需求，将其分解为更小的组件，在隔离的环境中开发组件，确保其按计划执行，集成所有小模块以完成项目，最后进行测试以确保整个项目运行良好。\n\
  \n当整个项目集成并执行时，需要进行大量的测试。可能会有一个专门的团队（称为**质量保证**，即**QA**）来执行此任务。与其在项目级别发现问题，不如在每个隔离阶段测试代码，这是一个很好的策略。这种测试需要由负责该模块的开发者来执行。这种类型的测试称为单元测试。在这里，开发者可以模拟运行该模块所需的环境，并确保测试模块中编写的特定功能部分。\n\
  \n例如，假设在一个大型项目中，有一个小模块的功能是解析配置文件并获取设置环境所需的参数。如果解析文件的代码部分将**IP 地址**作为**字符串**，那么开发者需要确保其格式为**XXX.XXX.XXX.XXX**，其中**X**是**0–9**之间的数字。字符串的长度必须是有限的。\n\
  \n在这里，开发者可以创建一个测试程序来执行他们的代码部分：解析文件，将**IP 地址**提取为字符串，并测试其格式是否正确。类似地，如果配置中还有其他需要解析的参数，并且它们需要采用特定格式，例如**用户\
  \ ID / 密码**、日志文件位置或挂载点等，那么所有这些都将属于该模块单元测试的一部分。在本章中，我们将解释**断言、安全网（异常处理）、单元测试、模拟、断点、监视点和数据可视化**等技术，以查明错误根源并限制其蔓延。在下一节中，我们将探讨断言技术。\n\
  \n## 断言\n\n针对上述场景使用测试条件将有助于项目更好地发展，因为缺陷将在基础层面被发现，而不是在之后的 QA 层面。在某些场景中，即使在编写了单元测试用例并成功执行代码之后，仍可能会发现问题，例如应用程序崩溃、程序意外退出或行为不符合预期。为了应对这些场景，开发者通常会使用调试模式的二进制文件来重现问题。断言用于确保条件得到检查，否则程序执行将被终止。\n\
  \n这样，问题就可以被快速追踪。此外，在调试模式下，开发者可以逐行遍历程序的实际执行过程，并检查代码流程是否符合预期，或者变量是否按预期设置并正确访问。有时，如果指针变量没有指向有效的内存位置，访问它们会导致意外行为。\n\
  \n在编写代码时，我们可以检查必要条件是否得到满足。如果没有满足，程序员可能不希望继续执行代码。使用断言可以轻松完成这一操作。断言是一个宏，用于检查特定条件，如果不满足条件，则会调用\
  \ abort（程序执行停止）并将错误消息作为标准错误输出。这通常是运行时断言。也可以在编译时进行断言。我们稍后会讨论这一点。在下一节中，我们将解决一个练习，在其中编写并测试我们的第一个断言。\n\
  \n### 练习 1：编写并测试我们的第一个断言\n\n在本练习中，我们将编写一个函数来解析 IP 地址并检查其是否有效。作为需求的一部分，IP 地址将以**XXX.XXX.XXX.XXX**格式的字符串字面量传入。在此格式中，X\
  \ 代表 0-9 之间的数字。因此，作为测试的一部分，为了检查被解析的字符串是否正确，我们需要确保字符串不为空且长度小于 16。按照以下步骤实现此练习：\n\n\
  - 1. 创建一个名为 `AssertSample.cpp` 的新文件。\n\n- 2. 打开文件并编写以下代码以包含头文件：\n\n```\n#include<iostream>\n\
  #include<cassert>\n#include<cstring>\n\nusing std::cout;\nusing std::endl;\n```\n\
  \n在上述代码中，`#include<cassert>` 表示我们需要包含定义了 assert 的 cassert 文件。\n\n- 3. 创建一个名为 `checkValidIp()`\
  \ 的函数，该函数将 IP 地址作为输入，如果 IP 地址满足我们的要求，则返回 true。编写以下代码来定义该函数：\n\n```\nbool checkValidIp(const\
  \ char * ip){\n    assert(ip != NULL);\n    assert(strlen(ip) < 16);\n    cout <<\
  \ \"strlen: \" << strlen(ip) << endl;\n    return true;\n}\n```\n\n在这里，`assert(ip\
  \ != NULL)` 表示使用 assert 宏来检查传入的 \"ip\" 变量是否为非 NULL。如果它为 NULL，则会中止并显示错误消息。此外，`assert(strlen(ip)\
  \ < 16)` 表示使用 assert 来检查 \"ip\" 是否为 16 个字符或更少。如果不是，则会中止并显示错误消息。\n\n- 4. 现在，创建一个主函数，将不同的字符串字面量传递给我们的\
  \ `checkValidIp()` 函数，并确保它可以被适当地测试。为主函数编写以下代码：\n\n```\nint main(){\n    const char\
  \ * ip;\n    ip = NULL;\n    bool check = checkValidIp(ip);\n    cout << \" IP address\
  \ is validated as :\" << (check ? \"true\" : \"false\") << endl;\n    return 0;\n\
  }\n```\n\n在上述代码中，我们故意将 NULL 传递给 ip 变量，以确保 assert 被调用。\n\n- 5. 打开命令提示符，进入存储 `AssertSample.cpp`\
  \ 文件的位置。通过输入以下命令使用 g++ 编译器编译它：\n\n```\ng++ AssertSample.cpp\n```\n\n使用此命令，将生成 a.out\
  \ 二进制文件。\n\n\n\n\n\n在前面的截图中，断言抛出错误，因为传入的 **ip** 长度大于 **16**。\n\n- 8. 现在，为了满足 **assert**\
  \ 条件使二进制程序正常运行，我们需要在 **main** 函数中更新 **ip** 的值。编写以下代码来实现此操作：\n\n```\nip = \"111.111.111.111\"\
  ;\n```\n\n再次打开编译器，编译 **.cpp** 文件，并运行生成的二进制文件。编译器中显示以下输出：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_504_0.png)\n\
  \n图 7.3：在命令提示符上运行断言二进制文件\n\n**注意：** 由于我们只是处理 **assert**，因此我们没有向我们的 **checkValidIP()**\
  \ 函数添加任何额外功能。但是，我们将在 *异常处理* 和 *单元测试* 部分使用相同的示例，在其中我们将为我们的函数添加更多功能。\n\n- 9. 如果我们不希望在生产或发布环境中由于断言而导致可执行文件中止，请从代码中删除\
  \ **assert** 宏调用。首先，我们将更新长度大于 **16** 的 **ip** 值。向文件添加以下代码：\n\n```\nip = \"111.111.111.11111\"\
  ;\n```\n\n- 10. 现在，在编译期间，传递 **-DNDEBUG** 宏。这将确保断言不会在二进制文件中被调用。在终端中编写以下命令来编译我们的 **.cpp**\
  \ 文件：\n\n```\ng++ -DNDEBUG AssertSample.cpp\n```\n\n之后，当我们执行二进制文件时，会生成以下输出：\n\n\
  ![](img/6507d435e2edfa3c00c220d0ccfcaf94_505_0.png)\n\n**图 7.4：在命令提示符上运行断言二进制文件**\n\
  \n在前面的截图中，由于未调用 **assert**，它将显示字符串长度为 **17**，并且 **true** 值将验证 IP 地址。在本练习中，我们看到在执行二进制文件时调用了断言。我们也可以在代码编译期间进行断言。这是在\
  \ C++11 中引入的。它被称为 **静态断言**，我们将在下一节中探索它。\n\n## 静态断言\n\n有时，我们可以在编译时进行条件检查以避免任何未来的错误。例如，在一个项目中，我们可能会使用一个第三方库，其中声明了一些数据结构。我们可以从其头文件中得知该结构信息，例如其大小和\
  \ **成员变量**。利用这些信息，我们可以正确地分配或释放内存，以及操作其成员变量。该结构属性可能会在第三方库的不同版本中发生变化。但是，如果我们的项目代码仍在使用早期版本的结构，那么在使用它时就会出现问题。我们可能在运行二进制文件时在后期阶段遇到错误。我们可以使用\
  \ **静态断言** 在编译时本身捕获此错误。我们可以比较静态数据，例如库的版本号，从而确保我们的代码不会遇到任何问题。在下一节中，我们将基于此解决一个练习。\n\
  \n### 练习 2：测试静态断言\n\n在本练习中，我们将通过进行静态断言来比较两个头文件的版本号。如果版本号小于 1，则会抛出静态断言错误。执行以下步骤来实现此练习：\n\
  \n- 1. 创建一个名为 PersonLibrary_ver1.h 的头文件并添加以下代码：\n\n```\n#ifndef __PERSON_H__\n#define\
  \ __PERSON_H__\n\n#include<string>\n\nusing std::string;\n\n#define PERSON_LIB_VERSION\
  \ 1\n\nstruct person{\n    string name;\n    int age;\n    string address;\n};\n\
  \n#endif\n```\n\n在前面的代码中，struct person 被定义并包含以下属性：name、age 和 address。它还具有版本号 1。\n\
  \n- 2. 创建另一个名为 PersonLibrary_ver2.h 的头文件并添加以下代码：\n\n```\n#ifndef __PERSON_H__\n\
  #define __PERSON_H__\n\n#include<string>\n\nusing std::string;\n\n#define PERSON_LIB_VERSION\
  \ 2\n\nstruct person{\n    string name;\n    int age;\n    string address;\n   \
  \ string Mobile_No;\n};\n\n#endif\n```\n\n在前面的代码中，struct person 被定义并包含以下属性：name、age、address\
  \ 和 Mobile_No。它还具有版本号 2。现在，版本 1 是旧版本，版本 2 是新版本。以下是两个头文件并排显示的截图：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_507_0.png)\n\
  \n图 7.5：具有不同版本的库文件\n\n- 3. 创建一个名为 StaticAssertionSample.cpp 的文件并添加以下代码：\n\n```\n\
  #include<iostream>\n#include\"PersonLibrary.h\"\n\nvoid doSanityCheck(){\n    static_assert(PERSON_LIB_VERSION\
  \ > 1 , \"PERSON LIBRARY VERSION not greater than 1\");\n    // Do any more sanity\
  \ check before starting app ...\n}\n\nint main(){\n    doSanityCheck();\n    return\
  \ 0;\n}\n```\n\n在前面的代码中，我们在构建和执行项目之前对其进行健全性检查。我们创建了一个名为 doSanityCheck() 的函数来执行库的版本检查。它使用静态断言完成，并在编译时执行。代码的第二行显示包含\
  \ PersonLibrary.h 文件。在 doSanityCheck() 函数内部，static_assert() 函数检查此库版本是否大于 1。\n\n\
  **注意：** 如果你的项目需要在版本 2 或更高版本的库中定义 person 结构体才能正确执行它，我们需要匹配版本 2 的文件，即 PERSON_LIB_VERSION\
  \ 至少应设置为 2。如果开发人员获取了库的版本 1 并尝试为项目创建二进制文件，它可能会在执行时造成问题。为了避免这种情况，在项目的 main 代码中，我们在构建和执行之前对项目进行健全性检查。\n\
  \n- 4. 要在我们的 .cpp 文件中包含库的版本 1，请打开终端并编写以下命令：\n\n```\nln -s PersonLibrary_ver1.h PersonLibrary.h\n\
  ```\n\n前面的命令将创建一个名为 PersonLibrary.h 的 PersonLibrary_ver1.h 文件的软链接。这就像模拟使用版本 1 的\
  \ PersonLibrary.h 的环境。\n\n- 5. 使用终端中的以下命令编译我们的 .cpp 文件：\n\n```\ng++ StaticAssertionSample.cpp\n\
  ```\n\n以下是终端中生成的输出：\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_508_0.png)\n\n图\
  \ 7.6：看到静态错误\n\n在前面的截图中，有三个区域用红色圈出。第一个给出创建软链接的命令。第二个命令显示我们创建的 **PersonLibrary.h**\
  \ 文件。第三个区域显示由于库版本不匹配而抛出的 **static_assert** 错误。\n\n- 6. 现在，为了正确编译程序，请删除 **PersonLibrary**\
  \ 的软链接并创建一个新的软链接指向 **版本 2**，然后再次编译。这次它将编译正常。在终端中输入以下命令以删除软链接：\n\n```\nrm PersonLibrary.h\n\

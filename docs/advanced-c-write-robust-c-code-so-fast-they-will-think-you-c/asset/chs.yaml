  ```\n\n- 3. 现在是练习中最困难的部分：为 Track 类型编写重载函数。这是一个模板函数，具有两个类型参数：charT 和 Traits：\n\n\
  ```\ntemplate <typename charT, typename Traits>\n```\n\n- 4. 我们将此函数设为内联，以便编译器知道我们希望它对该函数进行优化。此函数的返回类型是对\
  \ std::basic_ostream<charT, Traits> 类的引用。该函数的名称是 operator <<。此函数接受两个参数：第一个是对 std::basic_ostream<charT,\
  \ Traits> 类的引用，第二个是 Track 变量的拷贝。完整的函数声明如下：\n\n```\ntemplate <typename charT, typename\
  \ Traits>\ninline std::basic_ostream<charT, Traits>&\noperator<<(std::basic_ostream<charT,\
  \ Traits>& os, Track trackItem);\n```\n\n- 5. 现在，添加函数定义。使用 os 变量，就像我们使用 std::cout\
  \ 对象一样，并按你希望的方式格式化输出。然后，从函数返回 os 变量。重载运算符 << 的完整代码如下：\n\n```\ntemplate <typename\
  \ charT, typename Traits>\ninline std::basic_ostream<charT, Traits>&\noperator<<(std::basic_ostream<charT,\
  \ Traits>& os, Track trackItem)\n{\n    os << \"Track information: [\"\n       <<\
  \ \"Name: \" << trackItem.getName()\n       << \", Singer: \" << trackItem.getSinger()\n\
  \       << \", Date of creation: \" << trackItem.getDate()\n       << \", Length\
  \ in seconds: \" << trackItem.getLength()\n       << \"]\";\n    return os;\n}\n\

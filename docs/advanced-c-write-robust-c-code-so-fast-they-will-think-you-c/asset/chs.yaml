  \ int 参数类型的异常。该抛出会被正确的 catch 捕获，匹配的参数为 (int 或 const char *)。两个异常都返回 false 并附带一些错误信息。或者，在\
  \ catch 块中，你可以执行额外的步骤，如果需要清理，或者使用在异常中用于比较的变量的默认值。\n\n> **注意**\n> \n> 有一个默认异常；例如，如果有嵌套函数抛出带有不同参数的错误，它可以用更高级别的函数捕获，参数如\
  \ catch(...)。同样，在通用的 catch 中，你可以为异常处理创建默认行为。\n\n-   4. 创建 main() 函数并在其中写入以下代码：\n\

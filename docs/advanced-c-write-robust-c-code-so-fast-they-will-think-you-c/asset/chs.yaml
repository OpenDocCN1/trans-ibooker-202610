  \ 的文件，并定义所有工具函数。编写以下代码来定义 trim() 函数：\n\n```\n#include<CommonHeader.h>\n\n// Utility\
  \ function to remove spaces and tabs from start of string and end of string..\n\
  string trim (string &str) { // remove space and tab from string.\n    string res(\"\
  \");\n    if ((str.find(' ') != string::npos) || (str.find(' ') != string::npos)){\n\
  // if space or tab found..\n        size_t begin, end;\n        if ((begin = str.find_first_not_of(\"\

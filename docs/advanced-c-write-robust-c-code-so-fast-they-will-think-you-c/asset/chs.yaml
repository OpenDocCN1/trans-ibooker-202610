  \n在编程中使用的一个常见模式，特别是在实现基于事件的处理时，例如异步输入和输出，是使用 **callback**。客户端注册他们希望在事件发生时收到通知（例如：有数据可读，或数据传输完成）。这种模式被称为\
  \ **Observer pattern** 或 **Subscriber-Publisher pattern**。C++ 支持多种提供回调机制的技术。\n\n\
  ### Function Pointers\n\n第一个机制是使用 **function pointers**。这是一个从 C 语言继承的遗留特性。以下程序展示了函数指针的示例：\n\
  \n```cpp\n#include <iostream>\n\nusing FnPtr = void (*)(void);\n\nvoid function1()\n\
  {\n    std::cout << \"function1 called\\n\";\n}\nint main()\n{\n    std::cout <<\
  \ \"\\n\\n----- Function Pointers -----\\n\";\n    FnPtr fn{function1};\n\n    fn();\n\
  \n    std::cout << \"Complete.\\n\";\n    return 0;\n}\n```\n\n该程序在编译和执行后，产生以下输出：\n\
  \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_313_0.png)\n\nFigure 4.7: Function Pointer\
  \ Program output\n\n严格来说，代码应修改如下：\n\n```cpp\nFnPtr fn{&function1};\n\nif(fn != nullptr)\n\
  \    fn();\n```\n\n首先需要注意的是，应使用取地址符 (`&`) 来初始化指针。其次，我们应该在调用它之前检查指针是否有效。\n\n```cpp\n\
  #include <iostream>\n\nusing FnPtr = void (*)(void);\n\nstruct foo\n{\n    void\
  \ bar() { std::cout << \"foo::bar called\\n\"; }\n};\n\nint main()\n{\n    std::cout\
  \ << \"\\n\\n----- Function Pointers -----\\n\";\n    foo object;\n\n    FnPtr fn{&object.bar};\n\
  \n    fn();\n\n    std::cout << \"Complete.\\n\";\n    return 0;\n}\n```\n\n当我们尝试编译此程序时，会收到以下错误：\n\
  \n```\n/usr/bin/make all\nScanning dependencies of target Pimpl\n[ 33%] Building\
  \ CXX object CMakeFiles/Pimpl.dir/main.cpp.o\n/home/brian/Documents/advanced/Lesson04/main.cpp:\
  \ In function 'int main()':\n/home/brian/Documents/advanced/Lesson04/main.cpp:92:22:\
  \ error: ISO C++ forbids taking the address of a bound member function to form a\
  \ pointer\n    FnPtr fn{&object.bar};\n/home/brian/Documents/advanced/Lesson04/main.cpp:92:25:\
  \ error: cannot convert 'void (foo::*)()' to 'FnPtr {aka void (*)()}' in initialization\n\
  \    FnPtr fn{&object.bar};\nCMakeFiles/Pimpl.dir/build.make:62: recipe for target\
  \ 'CMakeFiles/Pimpl.dir/main.cpp.o' failed\nmake[2]: *** [CMakeFiles/Pimpl.dir/main.cpp.o]\
  \ Error 1\nmake[1]: *** [CMakeFiles/Pimpl.dir/all] Error 2\nCMakeFiles/Makefile2:72:\
  \ recipe for target 'CMakeFiles/Pimpl.dir/all' failed\nMakefile:94: recipe for target\
  \ 'all' failed\n\"/usr/bin/make all\" terminated with exit code 2. Build might be\
  \ incomplete.\n```\n\nFigure 4.8: Errors compiling function pointer program\n\n\
  第一个错误的文本是 **ISO C++ forbids taking the address of a bound member function to form\
  \ a pointer to member function. Say '&foo::bar'**。它告诉我们应使用不同形式来获取函数地址。真正错误的是第二个错误信息：**error:\
  \ cannot convert 'void (foo::*)()' to 'FnPtr {aka void (*)()}' in initialization**。真正的问题是非静态成员函数在被调用时接受一个隐藏参数\
  \ – this 指针。\n\n\n\n\n通过将上述程序修改为以下内容：\n\n```cpp\n#include <iostream>\n\nusing FnPtr\
  \ = void (*)(void);\n\nstruct foo\n{\n    static void bar() { std::cout << \"foo:bar\
  \ called\\n\"; }\n};\n\nint main()\n{\n    std::cout << \"\\n\\n----- Function Pointers\
  \ -----\\n\";\n\n    FnPtr fn{&foo::bar};\n\n    fn();\n\n    std::cout << \"Complete.\\\
  n\";\n    return 0;\n}\n```\n\n它可以成功编译并运行：\n\n```\n----- Function Pointers -----\n\
  foo:bar called\nComplete.\n```\n\n图 4.9：使用静态成员函数的函数指针程序\n\n函数指针技术常用于与使用回调的 C 库以及同样支持回调的操作系统通知进行交互。在这两种情况下，回调通常会接受一个参数，该参数是一个指向用户注册的数据块（data\
  \ blob）指针的 `void *`。这个数据块指针可以是一个类的 `this` 指针，然后被解引用，并将回调转发到成员函数中。\n\n在其他语言（如 Python\
  \ 和 C#）中，捕获函数指针时也会捕获调用该函数所需的足够数据（例如：**self** 或 **this**），这是语言的一部分。C++ 可以通过函数调用运算符使任何对象可调用，我们将在接下来介绍。\n\
  \n### 什么是函数对象？\n\nC++ 允许重载函数调用运算符 **operator()**。这使得任何对象都可以变得**可调用**。可调用的对象称为**函数对象**。以下程序中的\
  \ **Scaler** 类实现了一个**函数对象**。\n\n```cpp\nstruct Scaler\n{\n    Scaler(int scale)\
  \ : m_scale{scale} {};\n\n    int operator()(int value)\n    {\n        return m_scale\
  \ * value;\n    }\n\n    int m_scale{1};\n};\n\nint main()\n{\n    std::cout <<\
  \ \"\\n\\n------ Functors ------\\n\";\n    Scaler timesTwo{2};\n    Scaler timesFour{4};\n\
  \n    std::cout << \"3 scaled by 2 = \" << timesTwo(3) << \"\\n\";\n    std::cout\
  \ << \"3 scaled by 4 = \" << timesFour(3) << \"\\n\";\n\n    std::cout << \"Complete.\\\
  n\";\n    return 0;\n}\n```\n\n程序中创建了两个 **Scaler** 类型的对象，它们被用作生成输出的代码行中的函数。上述程序产生以下输出：\n\
  \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_317_0.png)\n\n图 4.10：函数对象程序输出\n\n与函数指针相比，**函数对象**的一个优势是它们可以包含状态，无论是作为对象还是跨所有实例。另一个优势是它们可以传递给期望函数（例如\
  \ `std::for_each`）或运算符（例如 `std::transform`）的 STL 算法。\n\n此类用法的一个示例如下：\n\n```cpp\n\
  #include <iostream>\n#include <vector>\n#include <algorithm>\n\nstruct Scaler\n\
  {\n    Scaler(int scale) : m_scale{scale} {};\n\n    int operator()(int value)\n\
  \    {\n        return m_scale * value;\n    }\n\n    int m_scale{1};\n};\n\nvoid\
  \ PrintVector(const char* prefix, std::vector<int>& values)\n{\n    const char*\
  \ sep = \"\";\n    std::cout << prefix << \" = [\";\n    for(auto n : values)\n\
  \    {\n        std::cout << sep << n;\n        sep = \", \";\n    }\n    std::cout\
  \ << \"]\\n\";\n}\n\nint main()\n{\n    std::cout << \"\\n\\n------ Functors with\
  \ STL ------\\n\";\n    std::vector<int> values{1,2,3,4,5};\n\n    PrintVector(\"\
  Before transform\", values);\n    std::transform(values.begin(), values.end(), values.begin(),\
  \ Scaler(3));\n    PrintVector(\"After transform\", values);\n\n    std::cout <<\
  \ \"Complete.\\n\";\n    return 0;\n}\n```\n\n如果我们运行这个程序，产生的输出将如下所示：\n\n```\n------\
  \ Functors with STL ------\nBefore transform = [1, 2, 3, 4, 5]\nAfter transform\
  \ = [3, 6, 9, 12, 15]\nComplete.\n```\n\n图 4.11：显示 Scaler 变换向量的程序输出\n\n使用\n\n```cpp\n\
  \    std::cout << \"Average of [\";\n    std::for_each(values.begin(), values.end(),\
  \ Printer());\n    std::cout << \"] = \";\n```\n\n- 7. 单击**运行**按钮。该练习将运行并产生以下输出：\n\

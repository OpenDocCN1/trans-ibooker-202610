  ```cpp\nif(is_valid(buffer))\n    return -3;\nreturn 0;\n}\n```\n\n这类似于许多 C 库函数返回的状态码，您需要查阅手册页才知道它们的含义。在前面的代码中，-1、-2、-3\
  \ 和 0 被称为魔数。您需要阅读代码才能理解每个数字的含义。现在，考虑以下版本的代码：\n\n```cpp\nFileCheckStatus check_file(const\
  \ char* name)\n{\n    FILE* fptr{fopen(name,\"r\")};\n    if ( fptr == nullptr)\n\
  \        return FileCheckStatus::NotFound;\n    char buffer[30];\n    auto numberRead\
  \ = fread(buffer, 1, 30, fptr);\n    fclose(fptr);\n    if (numberRead != 30)\n\
  \        return FileCheckStatus::IncorrectSize;\n    if(is_valid(buffer))\n    \
  \    return FileCheckStatus::InvalidContents;\n    return FileCheckStatus::Good;\n\
  }\n```\n\n这使用枚举类来传达结果并将含义附加到值的名称上。函数的用户现在可以使用枚举，因为代码更容易理解和使用。因此，与状态相关的魔数已被具有描述性标题的枚举值所取代。让我们通过参考以下代码片段来了解\
  \ FileCheckStatus 的声明：\n\n```cpp\nenum FileCheckStatus            // Old-style enum\
  \ declaration\n{\n    Good,                       // = 0 - Value defaults to 0\n\
  \    NotFound,                   // = 1 - Value set to one more than previous\n\
  \    IncorrectSize,              // = 2 - Value set to one more than previous\n\
  \    InvalidContents,            // = 3 - Value set to one more than previous\n\
  };\n```\n\n如果我们想使用魔数中的值，那么我们将像这样声明它们：\n\n```cpp\nenum FileCheckStatus          \
  \   // Old-style enum declaration\n{\n    Good = 0,\n    NotFound = -1,\n    IncorrectSize\
  \ = -2,\n    InvalidContents = -3,\n};\n```\n\n或者，通过反转顺序，我们可以设置第一个值，编译器将完成其余部分：\n\
  \n```cpp\nenum FileCheckStatus             // Old-style enum declaration\n{\n  \
  \  InvalidContents = -3,          // Force to -3\n    IncorrectSize,           \
  \      // set to -2(=-3+1)\n    NotFound,                      // Set to -1(=-2+1)\n\
  \    Good,                          // Set to  0(=-1+1)\n};\n```\n\n前面的函数也可以写成如下形式：\n\
  \n```cpp\nFileCheckStatus check_file(const char* name)\n{\n    FILE* fptr{fopen(name,\"\
  r\")};\n\n    if ( fptr == nullptr)\n        return NotFound;\n\n    char buffer[30];\n\
  \    auto numberRead = fread(buffer, 1, 30, fptr);\n    fclose(fptr);\n    if (numberRead\
  \ != 30)\n        return IncorrectSize;\n    if(is_valid(buffer))\n        return\
  \ InvalidContents;\n    return Good;\n}\n```\n\n请注意，作用域指令 **FileCheckStatus::**\
  \ 在代码中缺失，但它仍然可以编译并工作。这引发了作用域的问题，我们将在 *第 2B 章《No Ducks Allowed – Templates and Deduction》*\
  \ 的可见性、生命周期和访问部分详细讨论它。目前，请知道每种类型和变量都有作用域，而旧式枚举的问题在于它们的枚举数被添加到与枚举相同的范围内。假设我们有如下定义的两个枚举：\n\
  \n```cpp\nenum Result\n{\n    Pass,\n    Fail,\n    Unknown,\n};\n\nenum Option\n\
  {\n    Keep,\n    Discard,\n    Pass,\n    Play\n};\n```\n\n我们现在遇到一个问题，即 **Pass**\
  \ 枚举数被定义了两次并且有两个不同的值。旧式枚举还允许我们编写对编译器有效但显然毫无意义的代码，例如以下内容：\n\n```cpp\nOption option{Keep};\n\
  Result result{Unknown};\nif (option == result)\n```\n\n顾名思义，**作用域枚举** 将枚举数置于枚举名称的作用域内。此外，作用域枚举将不再隐式转换为整数（因此\
  \ if 语句将无法编译）。您仍然可以将枚举数转换为整数，但需要进行强制转换：\n\n```cpp\nint value = static_cast<int>(Option::Play);\n\

  \ 我们优化的第一个策略是看看是否可以用更好的方式实现 isspace()。不用函数，我们可以使用一个查找表来判断一个字符是否为空白（此代码可在 Snippet14.cpp\
  \ 中找到）：\n\n```\nint wordCount(const std::string &s)\n{\n    // Create a lookup table\n\
  \    bool isSpace[256];\n    for(int i = 0; i < 256; ++i)\n    {\n        isSpace[i]\
  \ = isspace((unsigned char)i);\n    }\n    int count = 0;\n    int len = s.size()\
  \ - 1;\n    for(int i = 0, j = 1; i < len; ++i, ++j)\n    {\n        count += !isSpace[s[i]]\
  \ & isSpace[s[j]];\n    }\n    return count;\n}\n```\n\n```\nint idx = j + i * 256;\n\
  table[idx] = !isspace(j) && isspace(i);\n}\n```\n\n用于计数单词的循环变为如下所示（完整代码可在 Snippet15.cpp\
  \ 中找到）：\n\n```\nint count = 0;\nfor(int i = 0; i < s.size() - 1; ++i)\n{\n    //\
  \ grab the 2 bytes at s[i] as a 16 bit value\n    unsigned short idx;\n    memcpy(&idx,\
  \ &s[i], 2);\n    count += table[idx];\n}\n```\n\n我们将字符串的每个字符作为单个 16 位值读取。直接将指针从\
  \ char* 强制转换为另一种类型并解引用它是未定义行为——正确的方法是使用 memcpy()。编译器足够智能，可以使用 CPU 内存访问指令而不是实际调用\
  \ memcpy() 处理 2 字节。我们最终得到一个循环中不包含条件语句，这应该使其更快。记住 X86 架构是小端——因此从字符数组读取的 16 位值将第一个字符作为其\
  \ LSB，第二个作为 MSB。\n\n- 7. 现在，计时我们编写的代码：\n\n```\n$ g++ -O3 Snippet15.cpp SnippetWC.cpp\
  \ Timer.cpp\n$ ./a.out data.txt\n```\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_625_0.png)\n\
  \n图 8.44：Snippet15.cpp 中代码的输出\n\n这个更大的查找表使 wordCount() 的速度提高了 1.8 倍。让我们退一步从另一个角度来看，以便我们可以有效地使用现有的标准库。其优点是两方面的——首先，代码出错的可能性更小，其次，我们可以利用某些编译器提供的并行化。\n\
  \n\n\n\n\n## 追求速度——性能与优化\n\n让我们使用标准算法重写使用 **isspace** 查找表的程序版本。如果观察统计单词数量的主循环，我们会取出两个字符，并根据某些逻辑将\
  \ 1 或 0 累加到 **count** 变量中。这是许多代码中常见的模式：\n\n```\nX OP (a[0] OP2 b[0]) OP (a[1] OP2\
  \ b[1]) OP (a[2] OP2 b[2]) ... OP (a[N] OP2 b[N])\n```\n\n这里，**a** 和 **b** 是大小为\
  \ **N** 的数组，**X** 是初始值，**OP** 和 **OP2** 是运算符。有一个封装了这种模式的标准算法，名为 **std::inner_product**——它接收两个序列，对每对元素之间应用一个运算符（OP2），并在这些结果之上应用另一个运算符（OP），起始值为初始值\
  \ X。\n\n- 8. 我们可以按如下方式编写该函数（完整代码可在 **Snippet16.cpp** 中找到）：\n\n```cpp\nint wordCount(const\
  \ std::string &s)\n{\n    // Create a lookup table for every char\n    bool table[256];\n\
  \    for(int i = 0; i < 256; ++i)\n    {\n        table[i] = isspace((unsigned char)i)\
  \ ? 1 : 0;\n    }\n\n    auto isWordEnd = [&](char a, char b)\n    {\n        return\
  \ !table[a] & table[b];\n    };\n\n    return std::inner_product(s.begin(), s.end()-1,\
  \ s.begin()+1, 0,\n    std::plus<int>(), isWordEnd);\n}\n```\n\n这个 **inner_product()**\
  \ 调用会对每对 **s[n]** 和 **s[n+1]** 应用 **isWordEnd()** lambda，并在这些结果之间应用标准加法函数。实际上，当\
  \ **s[n]** 和 **s[n+1]** 构成单词结尾时，我们就会向总数加 1。\n\n> **注意**\n>\n> 尽管这看起来像是许多嵌套函数调用，但编译器会内联所有内容，不会产生任何开销。\n\
  \n- 11. 编译并计时运行代码：\n\n```bash\n$ g++ -O3 Snippet17.cpp SnippetWC.cpp Timer.cpp\n\
  $ ./a.out data.txt\n```\n\n我们得到以下输出：\n\n| 名称 | 次数 | 时间(ms) | 平均(ms) |\n|---|---:|---:|---:|\n\
  | 文件读取 | 1 | 1016 | 1016 |\n| 单词统计 | 1 | 251 | 251 |\n| 总时间 | 1 | 1308 | 1308 |\n\
  \n图 8.46：Snippet17.cpp 中代码的输出\n\n这段代码不如我们在 **Snippet15.cpp** 中基于 loop() 的版本那么快。原因在于，在循环版本中，我们将\
  \ 2 个字节合并为一个 **short** 来获取索引，这不需要任何计算；但在这里，我们通过位运算将 2 个字节读入一个 **short**。\n\n- 12.\
  \ 现在我们的代码中大部分工作由标准库函数完成，我们可以免费获得自动并行化——编译并测试如下：\n\n```bash\n$ g++ -O3 -fopenmp -D_GLIBCXX_PARALLEL\

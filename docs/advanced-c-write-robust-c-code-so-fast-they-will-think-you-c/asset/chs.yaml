  ## 引言


  C++ 是最古老且最流行的语言之一，可用于编写高效代码。它既“接近金属”，像 C 一样，又具有像 Java 一样的高级面向对象特性。作为一种高效的低级语言，C++
  成为游戏、模拟和嵌入式系统等效率至关重要的领域的首选语言。同时，作为一种具有泛型、引用等高级特性的面向对象语言，它也适用于由多人开发和维护的大型项目。


  几乎任何编程经验都涉及组织代码库和使用他人编写的库。C++ 也不例外。除非您的程序很简单，否则您需要将代码分布到多个文件中进行组织，并使用各种库来完成任务，通常比您自己的代码更高效、更健壮。不使用任何第三方库的
  C++ 项目是边缘情况，并不代表大多数使用大量库的项目。这些项目及其库需要在不同的硬件架构和操作系统上运行。因此，如果您要用 C++ 开发任何有意义的东西，投入时间进行项目设置并了解用于管理依赖项的工具是很重要的。


  大多数现代流行的高级语言都有标准的工具来维护项目、构建它们并处理其库依赖项。其中许多都有托管库和工具的存储库，可自动从这些存储库下载并使用库。例如，Python
  有 **pip**，它负责下载和使用程序员想要使用的库的适当版本。类似地，JavaScript 有 **npm**，Java 有 **maven**，Dart
  有 **pub**，C# 有 **NuGet**。在大多数这些语言中，您列出想要使用的库的名称和版本，工具就会自动下载并使用库的兼容版本。这些语言受益于程序在受控环境中构建和运行的事实，其中满足了一定水平的硬件和软件要求。另一方面，C++
  预计能在各种环境中工作，具有不同的架构，包括非常原始的硬件。因此，与构建程序和执行依赖管理相比，C++ 程序员得到的“宠爱”较少。


  \n## Troubleshooting Compiler Errors\n\n正如前面的练习所示，编译器可以从一个错误生成非常大量的错误和警告消息。这就是为什么建议找到第一个错误并先修复它的原因。在\
  \ IDE 中开发或使用能够着色错误代码的构建系统可以使这变得更容易。\n\n## Structures and Classes\n\n枚举是用户定义类型的第一个，但它们并没有真正扩展语言，以便我们在适当的抽象级别上表达我们问题的解决方案。结构体和类则允许我们捕获和分组数据，然后将方法关联到以一致且有意义的方式操作该数据。\n\
  \n如果我们考虑两个矩阵 A（m x n）和 B（n x p）的乘法，结果为矩阵 C（m x p），那么 C 的第 i 行第 j 列的方程如下：\n\ncᵢⱼ\
  \ = Σₖ₌₁ⁿ aᵢₖ bₖⱼ\n\nFigure 2A.31: Equation of ith row and jth column\n\n如果我们每次希望乘以两个矩阵时都必须编写它，我们最终会得到许多嵌套的\
  \ for 循环。但如果我们可以将矩阵抽象为一个类，那么我们就可以像表达两个整数或两个浮点数的乘法一样简单地表达它：\n\n```\nMatrix a;\n\n\
  Matrix b;\n\n// Code to initialize the matrices\n\nauto c = a * b;\n```\n\n这就是面向对象设计的美妙之处\
  \ – 数据封装和概念的抽象以我们能够轻松理解程序试图实现什么而不被细节淹没的水平来解释。一旦我们确定矩阵乘法已正确实现，那么我们就可以自由地在更高级别上专注于解决我们的问题。\n\
  \n下面讨论的内容指的是类，但它同样适用于结构体，并且在很大程度上适用于联合体。我们将在学习如何定义和使用类之后概述类、结构体和联合体之间的差异。\n\n###\
  \ Fraction Class\n\n为了向你展示如何定义和使用类，我们将致力于开发 Fraction 类来实现有理数。定义后，我们可以像使用任何其他内置类型一样使用\
  \ Fraction（加、减、乘、除）而无需担心细节 – 这就是抽象。我们现在可以只在更高级别，即抽象级别上思考和推理分数。\n\nFraction 类将执行以下操作：\n\
  \n- 包含两个整数成员变量，m_numerator 和 m_denominator\n- 提供方法来复制自身、分配给它、乘法、除法、加法和减法\n- 提供一个方法将输出写入输出流\n\
  \n为了实现上述目标，我们有以下定义：\n\nAddition  a/b + c/d = (a.d + b.c)/(b.d)  Multiplication \
  \ a/b × c/d = (a.c)/(b.d)\nSubtraction  a/b - c/d = (a.d - b.c)/(b.d)  Division\
  \  a/b ÷ c/d = a/b × d/c = (a.d)/(b.c)\n\nFigure 2A.32: Definitions of operations\n\
  \n此外，我们执行的操作需要通过将其简化为最低项来规范化分数。为此，分子和分母都除以它们的最大公约数（GCD）。\n\n## Constructors, Initialization,\
  \ and Destructors\n\n类定义，如 C++ 代码中表达的那样，是用于在内存中创建对象并通过其方法操作对象的模式。我们需要做的第一件事是告诉编译器我们希望声明一个新类型\
  \ – 一个类。要声明 Fraction 类，我们从以下内容开始：\n\n```\nclass Fraction\n{\n};\n```\n\n我们将其放在头文件\
  \ Fraction.h 中，因为我们希望在代码的其他区域重用此类规范。\n\n接下来我们需要做的是引入要在类中存储的数据，在本例中为 m_numerator\
  \ 和 m_denominator。它们都是 int 类型：\n\n```\nclass Fraction\n{\n    int m_numerator;\n\
  \    int m_denominator;\n};\n```\n\n我们现在声明了要存储的数据，并为它们命名，任何熟悉数学的人都会理解每个成员变量存储的内容：\n\
  \nfraction = numerator / denominator\n\nFigure 2A.33: Formula of fraction\n\n首先，默认构造函数是一个特殊的成员函数。它是许多可能的构造函数之一，其中三个被认为是特殊成员函数。构造函数可以用零个、一个或多个参数声明，就像任何其他函数一样，但它们不指定返回类型。构造函数具有初始化所有成员变量以将对象置于良好定义状态的特殊目的。如果成员变量本身是一个类，则可能不需要指定如何初始化变量。如果成员变量是内置类型，则我们需要为其提供初始值。\n\
  \n### Class Special Member Functions\n\n当我们定义一个新类型（结构体或类）时，编译器将为我们创建多达六个（6 个）特殊成员函数：\n\
  \n- **Default Constructor** (`Fraction::Fraction()`): 这是在未提供参数时调用的（例如在前一节中）。这可以通过为构造函数没有参数列表或为所有参数定义默认值来实现，例如\
  \ `Fraction(int numerator=0, denominator=1)`。编译器提供一个 **隐式内联** 默认构造函数，该构造函数执行成员变量的默认初始化\
  \ – 对于内置类型，这意味着不执行任何操作。\n- **Destructor** (`Fraction::~Fraction()`): 这是一个在对象生命周期结束时调用的特殊成员函数。其目的是释放对象在其生命周期期间分配并保留的任何资源。编译器提供一个\
  \ **公共内联** 成员函数，该函数调用成员变量的析构函数。\n- **Copy Constructor** (`Fraction::Fraction(const\
  \ Fraction&)`): 这是另一个构造函数，其中第一个参数是 `Fraction&` 的形式并且没有其他参数，或者其余参数具有默认值。第一个参数的形式是\
  \ `Fraction&, const Fraction&, volatile Fraction&,` 或 `const volatile Fraction&`\
  \ 之一。我们稍后会处理 `const`，但在本书中不会处理 `volatile`。编译器提供一个 **非显式公共内联** 成员函数，通常形式为 `Fraction::Fraction(const\
  \ Fraction&)`，它按初始化顺序复制每个成员变量。\n- **Copy Assignment** (`Fraction& Fraction::operator=(Fraction&)`):\
  \ 这是一个名称为 `operator=` 的成员函数，第一个参数是值或类的任何引用类型，在本例中为 `Fraction, Fraction&, const Fraction&,\
  \ volatile Fraction&,` 或 `const volatile Fraction&`。编译器提供一个 **公共内联** 成员函数，通常形式为\
  \ `Fraction::Fraction(const Fraction&)`，它按初始化顺序复制每个成员变量。\n\n\n\n\n-   **移动构造函数**（`Fraction::Fraction(Fraction&&)`）：这是C++11中引入的一种新类型的构造函数，其第一个参数是**Fraction&&**的一种形式，且没有其他参数，或者其余参数都有默认值。第一个参数的形式可以是**Fraction&&**、**const\
  \ Fraction&&**、**volatile Fraction&&**或**const volatile Fraction&&**。编译器会提供一个**非显式公有内联**（non-explicit\
  \ public inline）成员函数，通常形式为**Fraction::Fraction(Fraction&&)**，它按初始化顺序移动每个成员变量。\n\n\
  -   **移动赋值运算符**（`Fraction& Fraction::operator=(Fraction&&)`）：这是C++11中引入的一种新类型的赋值运算符，是一个名为**operator=**的成员函数，其第一个参数可以是移动构造函数所允许的任何形式。编译器会提供一个**公有内联**（public\
  \ inline）成员函数，通常形式为**Fraction::operator=(Fraction&&)**，它按初始化顺序移动每个成员变量。\n\n除默认构造函数外，这些函数负责管理该类所拥有的资源——即如何复制/移动它们以及如何处置它们。另一方面，默认构造函数更像其他接受值的构造函数——它只负责初始化资源。\n\
  \n我们可以声明这些特殊函数中的任意一个，强制它们为默认版本（即让编译器生成默认版本），或强制它们不被创建。此外，还有一些规则决定了在其他特殊函数存在时，这些函数何时会被自动生成。前四个函数在概念上相对简单，但两个“移动”特殊成员函数需要额外说明。我们将在第3章《能与应该之间的距离——对象、指针与继承》中详细讨论所谓的移动语义，但现在只需知道它本质上正如其名——将某个东西从一个对象移动到另一个对象。\n\
  \n### 隐式构造函数与显式构造函数\n\n前述内容提到了编译器生成隐式或非显式构造函数。如果存在一个可以用一个参数调用的构造函数，例如复制构造函数或移动构造函数，那么在默认情况下，编译器允许在必要时调用它，以便将一种类型转换为另一种类型，从而使表达式、函数调用或赋值能够被编码。但这并不总是我们所期望的行为，我们可能希望阻止这种隐式转换，并确保如果类的用户确实需要这种转换，他们必须在程序中显式写出来。为此，我们在构造函数声明前加上**explicit**关键字，如下所示：\n\
  \n```\nexplicit Fraction(int numerator, int denominator = 1);\n```\n\nexplicit关键字也可以应用于其他运算符，这些运算符可能会被编译器用于类型转换。\n\
  \n### 类的特殊成员函数——编译器生成规则\n\n首先，如果我们声明了任何其他形式的构造函数——默认、复制、移动或用户自定义的构造函数，**默认构造函数**将不会被生成。其他特殊成员函数都不会影响它的生成。\n\
  \n其次，如果声明了析构函数，**析构函数**将不会被生成。其他特殊成员函数都不会影响它的生成。\n\n其他四个特殊函数的生成取决于析构函数或其他特殊函数是否被声明，如下表所示：\n\
  \n| 如果用户声明了 | 复制构造函数 | 复制赋值运算符 | 移动构造函数 | 移动赋值运算符 |\n|---|---|---|---|---|\n| 复制构造函数\
  \ | 否——用户已定义 | 是 | 否 | 否 |\n| 复制赋值运算符 | 是 | 否——用户已定义 | 否 | 否 |\n| 移动构造函数 | 已删除 |\
  \ 已删除 | 否——用户已定义 | 否 |\n| 移动赋值运算符 | 已删除 | 已删除 | 否 | 否——用户已定义 |\n| 析构函数 | 是 | 是 |\
  \ 否 | 否 |\n\n*图2A.34：特殊成员函数生成规则*\n\n### 默认化与删除特殊成员函数\n\n在C++11之前，如果我们想阻止复制构造函数或复制赋值成员函数被使用，就必须将函数声明为私有，并且不提供函数定义：\n\
  \n```\nclass Fraction\n{\npublic:\n    Fraction();\n\nprivate:\n    Fraction(const\
  \ Fraction&);\n    Fraction& operator=(const Fraction&);\n};\n```\n\n通过这种方式，我们确保如果有人试图从类外部访问复制构造函数或复制赋值运算符，编译器就会生成错误，指出该函数不可访问。但这仍会声明这些函数，并且它们可以从类内部访问。这是一种有效但并不完美的手段，用来禁止这些特殊成员函数被使用。\n\
  \n但我们可以做得更好，因为C++11引入了两种新的声明形式，允许我们覆盖上述规则中定义的编译器默认行为。\n\n首先，我们可以通过使用`= delete`后缀来声明该方法，从而强制编译器不生成它，如下所示：\n\
  \n```\nFraction(const Fraction&) = delete;\n```\n\n> **注意**\n>\n> 如果参数未被使用，我们可以省略其名称。这对任何函数或成员函数都适用。事实上，根据编译器设置的警告级别，它甚至可能生成一个警告，提示该参数未被使用。\n\
  \n或者，我们可以通过使用`= default`后缀，强制编译器生成特殊成员函数的默认实现，如下所示：\n\n```\nFraction(const Fraction&)\
  \ = default;\n```\n\n如果这只是函数的声明，我们也可以省略参数的名称。不过，良好的实践要求我们为参数命名以表明其用途。这样，我们类的用户就无需查看函数调用的实现。\n\
  \n> **注意**\n>\n> 就前述规则而言，使用default后缀声明的特殊成员函数被视为用户自定义成员函数。\n\n### 三/五法则和零法则\n\n\
  正如我们之前讨论的，除默认构造函数外，特殊成员函数都涉及管理该类所拥有的资源的语义——即如何复制/移动它们以及如何处置它们。这引出了C++社区中关于处理特殊函数的两个“法则”。\n\
  \n在C++11之前，有三法则，它涉及复制构造函数、复制赋值运算符和析构函数。它基本上指出，我们需要实现这三者中的某一个，因为所封装资源的管理并非微不足道。\n\
  \n随着C++11中移动构造函数和移动赋值运算符的引入，这一法则扩展为五法则。法则的本质并没有改变，只是特殊成员函数的数量增加到了五个。记住编译器生成的规则，还有一个额外的理由来确保所有五个特殊方法都被实现（或通过`=\
  \ default`强制实现），那就是：如果编译器无法访问移动语义函数，它将尝试使用复制语义函数，而这可能并不是我们想要的。\n\n> **注意**\n>\n\
  > 更多细节，请参阅C++核心指南中的“C.ctor：构造函数、赋值和析构函数”一节，可在此处找到：http://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines。\n\
  \n## 构造函数——初始化对象\n\n构造函数的主要任务是将对象置于稳定状态，以便通过其成员函数对对象执行或由对象执行的任何操作都能产生一致且定义明确的行为。虽然前述说法对复制构造函数和移动构造函数同样适用，但它们是经由不同的语义（从另一个对象复制或移动）来实现这一点的。\n\
  \n我们有四种不同的机制可用于控制对象的初始状态。C++对此类情况下使用哪种初始化有大量规则。我们不会深入讨论C++标准的默认初始化、零初始化、值初始化、常量初始化等细节。只需知道，最明智的做法是明确地对变量进行初始化。\n\
  \n\n\n\n\n# 禁止鸭子——类型与推导\n\n**第一种**也是最不推荐的初始化机制是在构造函数体内给成员变量赋值，如下所示：\n\n```\nFraction::Fraction()\n\
  {\n    this->m_numerator = 0;\n    this->m_denominator = 1;\n}\n```\n\n```\nFraction::Fraction(int\
  \ numerator, int denominator)\n{\n    m_numerator = numerator;\n    m_denominator\
  \ = denominator;\n}\n```\n\n可以清楚看出用于初始化变量的值。严格来说，这并不算类的初始化——根据标准，构造函数体被调用时初始化才算完成。这种写法易于维护，尤其是在这个类中。对于拥有多个构造函数和许多成员变量的较大类来说，这可能成为维护问题。如果你修改一个构造函数，就需要修改所有构造函数。此外，如果成员变量是引用类型（我们稍后会讨论），则无法在构造函数体内进行初始化。\n\
  \n默认构造函数使用 **this** 指针。每个成员函数，包括构造函数和析构函数，在调用时都带有一个隐式参数（即使从未声明）——即 **this** 指针。**this**\
  \ 指向对象的当前实例。`->` 运算符是另一种解引用运算符，在这里是简写形式，即 **(*this).m_numerator**。**this->** 的使用是可选的，可以省略。其他语言（如\
  \ Python）要求声明并使用隐式指针/引用（Python 中的惯例是将其命名为 self）。\n\n**第二种**机制是使用成员初始化列表，但使用起来有一个注意事项。对于我们的\
  \ Fraction 类，我们有以下代码：\n\n```\nFraction::Fraction() : m_numerator(0), m_denominator(1)\n\
  {\n}\n```\n\n```\nFraction::Fraction(int numerator, int denominator) :\n    m_numerator(numerator),\
  \ m_denominator(denominator)\n{\n}\n```\n\n在冒号（`:`）之后、左花括号（`{`）之前的代码段，即 `m_numerator(0),\
  \ m_denominator(1)` 和 `m_numerator(numerator), m_denominator(denominator)`，就是成员初始化列表。我们可以在成员初始化列表中初始化引用类型。\n\
  \n> **成员初始化列表的顺序**\n>\n> 无论你在成员初始化列表中按什么顺序放置成员，编译器都会按照成员在类中声明的顺序来初始化它们。\n\n**第三种也是推荐使用**的初始化方式是在\
  \ C++11 中引入的默认成员初始化。我们可以在声明变量时通过赋值或花括号初始化器来定义默认初始值：\n\n```\nclass Fraction\n{\n\
  public:\n    int m_numerator = 0;    // equals initializer\n    int m_denominator{1};\
  \   // brace initializer\n};\n```\n\n如果构造函数没有定义成员变量的初始值，那么将使用此默认值来初始化变量。这样做的优点是确保所有构造函数产生相同的初始化结果，除非在构造函数的定义中显式修改了它们。\n\
  \nC++11 还引入了第四种初始化风格，称为构造函数委托。它是成员初始化列表的一种变体，不过不是列出成员变量及其初始值，而是调用另一个构造函数。下面的例子是人为构造的，你不会用这种方式编写类，但它展示了构造函数委托的语法：\n\
  \n```\nFraction::Fraction(int numerator) : m_numerator(numerator), m_denominator(1)\n\
  {\n}\n```\n\n```\nFraction::Fraction(int numerator, int denominator) : Fraction(numerator)\n\
  {\n    auto factor = std::gcd(numerator, denominator);\n    m_numerator /= factor;\n\
  \    m_denominator = denominator / factor;\n}\n```\n\n你从带两个参数的构造函数中调用单个参数的构造函数。\n\
  \n### 练习5：声明并初始化分数\n\n在本练习中，我们将使用可用的不同技术来实现类成员初始化，包括构造函数委托。让我们开始吧：\n\n- 1. 在 Eclipse\
  \ 中打开 Lesson2A 项目，然后在 Project Explorer 中展开 Lesson2A，接着展开 Exercise05，并双击 Exercise5.cpp\
  \ 在编辑器中打开本练习的文件。\n- 2. 点击 Launch Configuration 下拉菜单，选择 New Launch Configuration...。将\
  \ Exercise5 配置为以名称 Exercise5 运行。\n- 3. 完成上述操作后，它将成为当前选中的 Launch Configuration。\n\
  - 4. 点击 Run 按钮。练习5将运行，并产生类似于以下输出的结果：\n\n  ![](img/6507d435e2edfa3c00c220d0ccfcaf94_140_0.png)\n\
  \n  图 2A.35：练习5的典型输出\n\n  报告出的分数值是因为完全没有初始化成员变量。如果你再次运行，很可能会得到不同的分数。\n\n- 5. 多次点击\
  \ Run 按钮。你会看到分数发生了变化。\n\n- 10. 点击 **Run** 按钮并观察输出：\n\n  ![](img/6507d435e2edfa3c00c220d0ccfcaf94_142_0.png)\n\
  \n  图 2A.37：构造函数委托示例\n\n在本练习中，我们使用成员初始化列表和构造函数委托实现了成员变量初始化。我们将在练习7“为 Fraction 类添加运算符”中再次回到分数。\n\
  \n## 值与引用及 const\n\n到目前为止，我们只处理了值类型，也就是说，变量保存的是对象的值。指针保存的是我们感兴趣的对象的值（即对象的地址）（或者\
  \ nullptr）。但这可能导致效率低下以及资源管理方面的问题。我们将在本文中讨论如何解决效率低下的问题，但资源管理问题将在第3章“能与应之间的距离——对象、指针和继承”中处理。\n\
  \n考虑下面的问题。我们有一个 10×10 的 double 类型矩阵，想为它编写一个求逆函数。该类声明如下：\n\n```\nclass Matrix10x10\n\
  {\nprivate:\n    double m_data[10][10];\n};\n```\n\n如果取 `sizeof(Matrix10x10)`，我们会得到\
  \ `sizeof(double)` x 10 x 10 = 800 字节。现在，如果要为其实现一个矩阵求逆函数，其签名可能如下所示：\n\n```\nMatrix10x10\
  \ invert(Matrix10x10 lhs);\n```\n\n```\nMatrix10x10 mat;\n\n// set up mat\n\nMatrix10x10\
  \ inv = invert(mat);\n```\n\n首先，这意味着编译器需要将 `mat` 保存的值传递给 `invert()` 函数，并将这 800 字节复制到栈上。然后，该函数执行求逆所需的操作（如\
  \ L-U 分解、计算行列式——无论实现者选择哪种方法），再将 800 字节的结果复制回 `inv` 变量。在栈上传递大值从来都不是一个好主意，原因有二：\n\n\
  - 栈是宿主操作系统分配给程序的有限资源。\n- 在系统中复制大值的效率很低。\n\n这种方法称为按值传递。也就是说，我们希望处理的条目的值会被复制到函数中。\n\
  \n在 C（以及 C++）中，这种限制通过指针的使用得以解决。前面的代码可能会变成下面这样：\n\n```\nvoid invert(Matrix10x10*\
  \ src, Matrix10x10* inv);\n```\n\n```\nMatrix10x10 mat;\n\nMatrix10x10 inv;\n\n\
  // set up mat\n\ninvert(&mat, &inv);\n```\n\n在这里，我们只需将 src 和逆结果目标的地址作为两个指针传递（这只需要少量字节）。不幸的是，这会导致函数内部的代码在每次使用\
  \ src 或 inv 时都必须使用解引用运算符 (*)，从而使代码更难阅读。此外，指针的使用也引发了许多问题。\n\nC++ 引入了一种更好的方法——变量别名或引用。引用类型使用与号（&）运算符声明。因此，我们可以将\
  \ invert 方法声明如下：\n\n```\nvoid invert(Matrix10x10& src, Matrix10x10& inv);\n```\n\
  \n```\nMatrix10x10 mat;\nMatrix10x10 inv;\n// set up mat\ninvert(mat, inv);\n```\n\
  \n注意，调用该方法时不需要特殊运算符来传递引用。从编译器的角度来看，引用仍然是指针，但有一个限制——它不能持有 nullptr。从程序员的角度来看，引用让我们能够更清晰地思考代码，而不必担心在正确的位置使用正确的解引用运算符。这种方法称为按引用传递。\n\
  \n我们看到了传递给复制构造函数和复制赋值方法的引用。当引用用于对应的移动操作时，其类型称为右值引用运算符，这将在第3章“能与应之间的距离——对象、指针和继承”中解释。\n\
  \n按值传递的一个优点是，我们不会无意中修改传递给方法的变量的值。现在，如果按引用传递，我们就无法再保证所调用的方法不会修改原始变量。为了解决这个问题，我们可以将\
  \ invert 方法的签名改为如下：\n\n```\nvoid invert(const Matrix10x10& src, Matrix10x10& inv);\n\
  ```\n\nconst 关键字告诉编译器，在处理 invert() 函数的定义时，为 src 所引用值的任何部分赋新值都是非法的。如果该方法确实试图修改 src，编译器将生成错误。\n\
  \n在“指定类型——变量”一节中，我们发现 `auto title` 的声明导致 title 具有 `const char *` 类型。现在，我们可以解释 const\
  \ 部分了。\n\ntitle 变量是指向常量字符的指针。换句话说，我们不能更改所指向内存中存储的数据值。因此，我们不能执行以下操作：\n\n```\n*title\
  \ = 's';\n```\n\n\n\n通过检查代码并将其与输出进行比较，我们会发现 **rvalue** 变量允许我们操作（从中读取和写入）存储在 **value**\
  \ 变量中的数据。我们有一个对 **value** 变量的引用，**rvalue**。我们还可以看到，**a** 和 **b** 变量中存储的值已通过 **swap()**\
  \ 函数交换。\n\n- 5. 在编辑器中，修改 swap 的函数定义：\n\n```\nvoid swap(const int& lhs, const int&\
  \ rhs)\n```\n\n- 6. 单击 **Run** 按钮。当出现 Errors in Workspace 对话框时，单击 **Cancel**。编译器报告的第一个错误如下所示：\n\
  \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_146_0.png)\n\n图 2A.39：赋值时只读错误\n\n通过将参数从\
  \ **int& lhs** 改为 **const int& lhs**，我们告诉编译器这些参数不应在此函数内部被更改。而由于我们在函数中对 lhs 进行了赋值，编译器会生成关于\
  \ lhs 为只读的错误并终止。\n\n## 实现标准运算符\n\n要像内置类一样使用分数，我们需要让它们能够与标准数学运算符（+、-、*、/）及其赋值对应运算符（+=、-=、*=、/=）一起工作。如果你不熟悉赋值运算符，那么请考虑以下两个表达式——它们产生相同的输出：\n\
  \n```\na = a + b;\na += b;\n```\n\n为 Fraction 声明这两个运算符的语法如下：\n\n```\n// 成员函数声明\n\
  Fraction& operator+=(const Fraction& rhs);\nFraction operator+(const Fraction& rhs)\
  \ const;\n```\n\n```\n// operator+ 的普通函数声明\nFraction operator+(const Fraction& lhs,\
  \ const Fraction& rhs);\n```\n\n由于 operator+= 方法会修改左值变量的内容（将 a 加到 b 上然后再存回 a），因此建议将其实现为成员函数。在这种情况下，由于我们没有创建新值，我们只需返回对现有\
  \ lhs 的引用即可。\n\n另一方面，operator+ 方法不应修改 lhs 也不应修改 rhs，而应返回一个新对象。实现者可以自由地将其实现为成员函数或自由函数。上述代码中展示了这两种方式，但只能存在其中一种。有趣的是要注意成员函数实现末尾的\
  \ const 关键字。这告诉编译器在调用此成员函数时，它不会修改对象的内部状态。虽然两种方法都有效，但如果可能，operator+ 应该实现为普通函数，在类之外。\n\
  \n对于其他运算符 -（减法）、*（乘法）和 /（除法）也可以使用相同的方法。上述方法实现了标准数学运算符的语义，并使我们的类型像内置类型一样工作。\n\n###\
  \ 实现输出流运算符（<<）\n\nC++ 将输入/输出（I/O）抽象为标准库中的流类层次结构（我们将在第 2B 章 No Ducks Allowed - Templates\
  \ and Deduction 中讨论）。在练习 5，Declaring and Initializing Fractions 中，我们看到可以将分数插入输出流如下：\n\
  \n```\nstd::cout << \"fraction = \" << fraction.getNumerator() << \"/\" << fraction.getDenominator()\
  \ << \"\\n\";\n```\n\n到目前为止，对于我们的 Fraction 类，我们是通过使用 getNumerator() 和 getDenominator()\
  \ 方法从外部访问数据值来写出分子和分母值，但有更好的方法。作为使我们的类成为 C++ 中的一等公民的一部分，在有意义的地方，我们应该重载 I/O 运算符。在本章中，我们只会查看输出运算符\
  \ <<，也称为插入运算符。这样，我们就可以用更简洁的版本替换之前的代码：\n\n```\nstd::cout << \"fraction = \" << fraction\
  \ << \"\\n\";\n```\n\n我们可以将运算符重载为友元函数或普通函数（如果类提供了我们需要插入的数据的 getter 函数）。为我们的目的，我们将其定义为普通函数：\n\
  \n```\ninline std::ostream& operator<< (std::ostream &out, const Fraction &rhs)\n\
  {\n    out << rhs.getNumerator() << \" / \" << rhs.getDenominator();\n    return\
  \ out;\n}\n```\n\n## 组织我们的代码\n\n在深入到实现运算符并将我们的 Fraction 变成 C++ 世界中的完整类型的练习之前，我们需要简要讨论一下我们将类的各个部分——声明和定义——放在哪里。声明是我们类的蓝图，指示它需要什么数据存储以及它将实现的方法。定义是每个方法的实际实现细节。\n\
  \n在 Java 和 C# 等语言中，声明和定义是同一个东西，它们必须存在于一个文件中（Java）或跨多个文件（C# 局部类）。在 C++ 中，根据类的情况以及你希望向其他类公开多少内容，声明\
  \ 必须 出现在头文件中（该头文件可以 #include 到其他文件中使用），而定义可以出现在三个地方之一——内联在定义中、内联在与定义相同的源文件中，或在单独的实现文件中。\n\
  \n头文件通常以 .hpp 扩展名命名，而实现文件通常是 *.cpp 或 *.cxx。实现文件也称为翻译单元。通过将函数定义为 inline，我们允许编译器以一种方式优化代码，使得该函数可能甚至不存在于最终程序中——它已将我们放入函数中的步骤替换为我们从中调用函数的位置。\n\

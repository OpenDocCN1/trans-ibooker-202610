- pgno: 434
  md: "# I/O Manipulators\n\nSo far, we've learned about simple input and output using\
    \ streams, but they are not sufficient in many cases. For more complex I/O data\
    \ formatting, the Standard Library has a big set of I/O manipulators. They are\
    \ functions that have been developed to work with shift operators, both left (`<<`)\
    \ and right (`>>`), to control how streams behave. I/O manipulators are divided\
    \ into two types – those that are invoked without arguments and those that needs\
    \ arguments. Some of them work both for input and output. Let's briefly consider\
    \ their meaning and usage.\n\n# I/O Manipulators for Changing the Numeric Base\
    \ of the Stream\n\nIn the `<ios>` header, there are declared functions for changing\
    \ the numeric base of the stream: `std::dec`, `std::hex`, and `std::oct`. They\
    \ are invoked without arguments and set the numeric base of the stream to decimal,\
    \ hexadecimal, and octal, respectively. In the `<iomanip>` header, the `std::setbase`\
    \ function is declared, which is invoked with the following arguments: 8, 10,\
    \ and 16. They are interchangeable and work for both input and output operations.\n\
    \nIn the `<ios>` header, there is also the `std::showbase` and `std::noshowbase`\
    \ functions, which control displaying the numeric base of the stream. They only\
    \ affect hexadecimal and octal integer output, except the zero value, and monetary\
    \ input and output operations. Let's complete an exercise and learn how to use\
    \ them in practice.\n\n# Exercise 4: Displaying Entered Numbers in Different Numeric\
    \ Bases\n\nIn this exercise, we will develop an application that, in the infinite\

  md: '```

    std::cout << "Starting program\n";

    hello_world();

    std::cout << "Exiting program\n";

    return 0;

    }

    ```


    Two functions have been declared in the preceding example – hello_world() and
    main(). The main() function is the entry point to every C++ program ever written
    and it returns an int value that is passed into the host system. It is known as
    the exit code.


    Everything from the declaration of the return type up to the opening brace ({)
    is known as the function prototype. It defines three things, namely the return
    type, the name of the function, and the number and types of an argument.


    For the first function, the return type is void – that is, it returns no value;
    it has a name of hello_world and takes no arguments:


    ![](img/6507d435e2edfa3c00c220d0ccfcaf94_109_0.png)


    Figure 2A.15: Declaration of a function that takes no arguments and returns nothing


    The second function returns an int value, has the name of main, and takes two
    arguments. These arguments are argc and argv and have the int and pointer to a
    pointer of char types, respectively:


    ![](img/6507d435e2edfa3c00c220d0ccfcaf94_109_1.png)


    Figure 2A.16: Declaration of a function that takes two arguments and returns an
    int


    Everything after the function prototype is known as the function body. The function
    body contains variable declarations and the statements to execute.'

  md: "+   - **Preprocessor macros**: This is the special use of a preprocessor macro\
    \ to demonstrate the leaks and should not be used in production code, that is,\
    \ replacing a function by text substitution.\n+   \n+   If you program to the\
    \ Windows API, you may occasionally be caught with your method names clashing\
    \ with the macros Microsoft uses for its API methods. For example, do not call\
    \ any of your methods **SendMessage** if you include **windows.h**. If you do,\
    \ then depending on whether you are building ASCII mode or Unicode mode, it will\
    \ be substituted with **SendMessageA** or **SendMessageW** respectively.\n+  \
    \ - **Defining our own new handler**: This is an advanced technique and unless\
    \ you write embedded code, it's unlikely you will need it.\n\n# C++ doesn't Need\
    \ finally\n\nOther languages (**C#**, **Java**, and **Visual Basic.NET**) that\
    \ support an exception throwing mechanism have a **try/catch/finally** paradigm\
    \ where the code in the **finally** block is called on exit from the try block\
    \ – either normally or by exception. C++ has no **finally** block because it has\
    \ access to a better mechanism that ensures that we cannot forget to release a\
    \ resource – RAII. Since the resource is represented by a local object, the local\
    \ object's destructor will free the resource.\n\nThe added advantage of this design\
    \ pattern is that if a lot of resources are being managed, then the **finally**\
    \ block is proportionally large. RAII removes the need for finally and leads to\
    \ code that is easier to maintain.\n\n# RAII and the STL\n\nThe Standard Template\
    \ Library (STL) utilizes RAII in many of its templates and classes. For example,\
    \ the smart pointers that were introduced in C++11, that is **std::unique_ptr**\
    \ and **std::shared_ptr**, help avoid many problems by ensuring that memory is\
    \ deallocated when it has been finished with, or by ensuring that the memory is\
    \ not deallocated if it is used elsewhere. Other examples in the STL include **std::string**\
    \ (memory), **std::vector** (memory), and **std::fstream** (file handles).\n\n\
    # Who Owns This Object?\n\nWith the preceding implementations of **File** and\
    \ **CharPointer**, we have tested Resource Management with RAII. Let's explore\
    \ it further. Firstly, we will define a class that has more than just one resource:\n\
    \n```\nclass BufferedWriter\n{\npublic:\n```"

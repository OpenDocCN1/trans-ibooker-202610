  md: "3. Define a function named sum1() that computes the sum of the integers between\
    \ 0 and N. Each number is summed only if it meets either or of two specific criteria.\
    \ The first condition is that the number must be less than N/2. The second condition\
    \ is that the number, when divided by 3, must return 2 as a remainder. Here, we\
    \ set N to 100,000,000 so we have some measurable time taken by the code. Write\
    \ the following code to implement this:\n\n```\nconst uint64_t N = 100000000;\n\
    \nuint64_t sum1()\n{\n    TIME_IT;\n    uint64_t ret = 0;\n    for(uint64_t b=0;\
    \ b < N; ++b)\n    {\n        if(b % 3 == 2 || b < N/2)\n        {\n         \
    \   ret += b;\n        }\n    }\n\n    return ret;\n}\n```\n\n4. Now, define another\
    \ function named sum2(). It must contain the same logic that we wrote for the\
    \ previous function, sum1(). The only change here is that we reverse the order\
    \ of the conditional expression of the if statement. Write the following code\
    \ to implement this:\n\n```\nuint64_t sum2()\n{\n    TIME_IT;\n    uint64_t ret\
    \ = 0;\n    for(uint64_t b=0; b < N; ++b)\n    {\n        if(b < N/2 || b % 3\
    \ == 2)\n        {\n            ret += b;\n        }\n    }\n\n    return ret;\n\
    }\n```"

- pgno: 135
  md: "The explicit keyword can be applied to other operators as well, where the compiler\
    \ may use it for type conversion.\n\n# Class Special Member Functions – Compiler\
    \ Generation Rules\n\nFirstly, the **Default Constructor** will not be generated\
    \ if we declare any other form of constructor – default, copy, move, or user-defined.\
    \ None of the other special member functions affect its generation.\n\nSecondly,\
    \ a **Destructor** will not be generated if a destructor is declared. None of\
    \ the other special member functions affect its generation.\n\nThe generation\
    \ of the other four special functions is dependent on the presence of the declaration\
    \ of the destructor or one of the other special functions, as shown in the following\
    \ table:\n\n| If the user declares | Copy Constructor | Copy assignment | Move\
    \ Constructor | Move assignment |\n|---|---|---|---|---|\n| Copy Constructor |\
    \ No - user defined | Yes | No | No |\n| Copy assignment | Yes | No - user defined\
    \ | No | No |\n| Move Constructor | Deleted | Deleted | No - user defined | No\
    \ |\n| Move assignment | Deleted | Deleted | No | No - user defined |\n| Destructor\
    \ | Yes | Yes | No | No |\n\n**Figure 2A.34: Special Member Function Generation\
    \ Rules**\n\n# Defaulting and Deleting Special Member Functions\n\nPrior to C++11,\
    \ if we wanted to prevent the use of a copy constructor or copy assignment member\
    \ function, then we had to declare the function as private and not provide a definition\
    \ of the function:\n\n```\nclass Fraction\n{\npublic:\n    Fraction();\n\nprivate:\n\
    \    Fraction(const Fraction&);\n```"
  merge: -1
  img_proc: true
- pgno: 136
  md: "```\nFraction& operator=(const Fraction&);\n\n};\n```\n\nIn this manner, we\
    \ ensured that if anyone tried to access the copy constructor or copy assignment\
    \ from outside the class, then the compiler would generate an error stating that\
    \ the function is not accessible. This still declares the functions, and they\
    \ are accessible from within the class. It is an effective means, but not perfect,\
    \ to remove these special member functions from use.\n\nBut we can do better since\
    \ C++11 introduced two new declaration forms that allow us to override the default\
    \ behavior of the compiler, as defined in the preceding rules.\n\nFirstly, we\
    \ can force the compiler to not generate the method by declaring it with the `=\
    \ delete` suffix, like so:\n\n```\nFraction(const Fraction&) = delete;\n```\n\n\
    > **Note**\n> \n> We can omit the name of the parameter if it is not used. This\
    \ is true for any function or member function. In fact, depending on the warning\
    \ level that's been set for the compiler, it may even generate a warning that\
    \ the argument is not being used.\n\nAlternatively, we can force the compiler\
    \ to generate its default implementation of a special member function by using\
    \ the `= default` suffix, like so:\n\n```\nFraction(const Fraction&) = default;\n\
    ```\n\nIf this is only the declaration of the function, then we can also omit\
    \ the name of the argument. Although, good practice dictates that we should name\
    \ the argument to indicate its use. That way, the users of our classes do not\
    \ need to look at the implementation of calling the function.\n\n> **Note**\n\
    > \n> Declaring a special member function using the default suffix is deemed to\
    \ be a user-defined member function for the purpose of the aforementioned rules."

- pgno: 424
  md: "To write to the file, we can use the overloaded left shift operator, `<<`,\
    \ for general formatted output, the **put()** function to write a single character,\
    \ or the **write()** function to write a block of characters. Using the left shift\
    \ operator is the most convenient way to write data to file as you can pass any\
    \ built-in type as an argument:\n\n```\noutFile << \"This is line No \" << 1 <<\
    \ std::endl;\n```\n\nThe **put()** and **write()** functions can only be used\
    \ with character values.\n\nTo read from a file, we can use the overloaded right\
    \ shift operator, `>>`, or use a set of functions for reading characters, such\
    \ as **read()**, **get()**, and **getline()**. The right shift operator is overloaded\
    \ for all built-in types and we can use it like this:\n\n```\nstd::ifstream inFile(filename);\n\
    ```\n\n```\nstd::string str;\n```\n\n```\nint num;\n```\n\n```\nfloat floatNum;\n\
    ```\n\n```\n// for data: \"book 3 24.5\"\n```\n\n```\ninFile >> str >> num >>\
    \ floatNum;\n```\n\nFinally, the file stream is closed when the execution leaves\
    \ the scope of visibility, so we don't need to perform any additional actions\
    \ to close the file.\n\n> **Note**\n> \n> Be attentive while reading data from\
    \ a file. The right shift operator, `>>`, only reads a string until a whitespace\
    \ or newline character. To read the full string, you could use a loop or read\
    \ each word in a separate variable, like we did in *Exercise 1, Overriding the\
    \ Left Shift Operator, <<, for User-Defined Types*.\n\nNow, let's practice reading\
    \ and writing data to a file using the C++ IO Standard Library."
  merge: -1
  img_proc: true

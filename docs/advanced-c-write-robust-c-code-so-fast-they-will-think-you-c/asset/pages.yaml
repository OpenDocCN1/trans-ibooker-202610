    # Struct of Arrays Pattern


    In many programs, we often use an array of objects of the same type – these could
    represent records from a database, entities in a game, and so on. A common pattern
    is to iterate through a large array of structures and perform an operation on
    some fields. Even though the structs are sequential in memory, if we access only
    a few of fields, a larger size structure will make caching less effective.


    The processor may prefetch several structs into cache, but the program only accesses
    a fraction of that cached data. Since it is not using every field of each struct,
    most of the cached data is discarded. To avoid this, another kind of data layout
    can be used – instead of using an array of structs (AoS) pattern, we use a struct
    of arrays (SoA) pattern. In the next section, we''ll solve an exercise wherein
    we''ll examine the performance benefit of using the SoA pattern versus the AoS
    pattern.



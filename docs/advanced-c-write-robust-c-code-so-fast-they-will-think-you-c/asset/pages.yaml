  md: "```\nm_numerator(numerator), m_denominator(denominator)\n{\n}\n```\n\nThe sections\
    \ of code after the colon, :, and before the opening brace, {, in (m_numerator(0),\
    \ m_denominator(1) and m_numerator(numerator), m_denominator(denominator) are\
    \ the member initialization lists. We can initialize a reference type in the member\
    \ initialization list.\n\n> **Member Initialization List Order**\n> \n> Regardless\
    \ of the order in which you place the members in the member initialization list,\
    \ the compiler will initialize the members in the order that they are declared\
    \ in the class.\n\nThe **third and recommended** initialization is the default\
    \ member initialization that was introduced in C++11. We define default initial\
    \ values when the variable is declared either using assignment or the brace initializer:\n\
    \n```\nclass Fraction\n{\npublic:\n    int m_numerator = 0;    // equals initializer\n\
    \    int m_denominator{1};   // brace initializer\n};\n```\n\nIf the constructor\
    \ does not define the initial value of the member variable, then this default\
    \ value will be used to initialize the variable. This has the advantage of ensuring\
    \ that all the constructors produce the same initialization unless they have been\
    \ explicitly modified in the definition of the constructor.\n\nC++11 also introduced\
    \ a fourth style of initialization, known as constructor delegation. It is a modification\
    \ of the Member Initialization List where, instead of listing the member variables\
    \ and their initial values, another constructor is called. The following example\
    \ is contrived, and you would not write a class this way, but it shows the syntax\
    \ for the constructor delegation:\n\n```\nFraction::Fraction(int numerator) :\
    \ m_numerator(numerator), m_denominator(1)\n{\n}\n```"

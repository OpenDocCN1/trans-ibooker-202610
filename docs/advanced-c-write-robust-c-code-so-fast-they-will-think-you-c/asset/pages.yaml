- pgno: 179
  md: "+   - **C++: std::sort()** is a function provided in its standard library,\
    \ where one of its signatures is as follows:\n+   \n+   ```\n+   template< class\
    \ RandomIt > void sort( RandomIt first, RandomIt last );\n+   ```\n+   \n+   In\
    \ this case, the details of the type are captured in the iterator type called\
    \ **RandomIt** and passed to the method when compiled.\n\nIn the next section,\
    \ we will briefly define generic programming, show how C++ implements them through\
    \ templates, highlight what the language already provides, and discuss how the\
    \ compiler deducts the types so that they can be used for the template.\n\n# What\
    \ is Generic Programming?\n\nWhen you developed a sort algorithm, you may have\
    \ originally focused on just sorting plain numbers. But once that is established,\
    \ you could then abstract that to any type, provided that the type exhibits certain\
    \ attributes such as total ordered set (that is, the comparison operator, <, has\
    \ meaning between all the elements in the domain we are sorting over). So, to\
    \ express an algorithm in terms of generic programming, we define a placeholder\
    \ in the algorithm for the type that needs to be manipulated by that algorithm.\n\
    \n**Generic programming** is the development of a type-agnostic general algorithm.\
    \ The algorithm can be reused by passing types as arguments. In this way, algorithms\
    \ are abstracted and allow the compiler to optimize based on types.\n\nIn other\
    \ words, generic programming is an approach to programming where an algorithm\
    \ is defined with types as parameters that are specified when the algorithm is\
    \ instantiated. Many languages provide support for generic programming with different\
    \ names. In C++, generic programming is supported through the language feature\
    \ known as templates.\n\n# Introducing C++ Templates\n\nTemplates are C++'s support\
    \ for generic programming. Think of a template as a cookie cutter, and the type\
    \ that we give it as a parameter as cookie dough (which can be chocolate brownie,\
    \ ginger snap, or some other delicious flavor). When we apply the cookie cutter,\
    \ we end up with instances of cookies that are in the same form but have different\
    \ flavors. So, a template captures the definition of a generic function or class\
    \ and when specified with types as arguments, the compiler goes to work to write\
    \ the class or function for us as if the type was hand-coded by us. It has several\
    \ advantages, such as the following:\n\n+   - You only need to develop the class\
    \ or algorithm once and evolve it.\n+   - You can apply it to many types."
  merge: -1
  img_proc: true
- pgno: 180
  md: "+   - You can hide complex details behind a simple interface and the compiler\
    \ can apply optimizations to the generated code, based on the type.\n\nSo, how\
    \ do we write a template? Let's start with a template that will allow us to clamp\
    \ a value within a range from **lo** to **hi** and be able to use it on **int**,\
    \ **float**, **double**, or any other built-in type:\n\n```\ntemplate <class T>\n\
    T clamp(T val, T lo, T hi)\n{\n    return (val < lo) ? lo : (hi < val) ? hi :\
    \ val;\n}\n```\n\nLet's break this down:\n\n+   - **Line 1:** `template <class\
    \ T>` declares what follows to be a template and uses one type, which has a placeholder\
    \ of **T** in the template.\n\n+   - **Line 2:** Declares the prototype for this\
    \ function when **T** is substituted. It declares that the function clamp takes\
    \ three arguments of type **T** and returns a value of type **T**.\n\n+   - **Line\
    \ 4:** This is the beauty of templates – provided that the type that's passed\
    \ in has a < operator, then we can perform a clamp on the three values so that\
    \ **lo <= val <= hi**. This algorithm is valid for all the types that can be ordered.\n\
    \nLet's say we use it in the following program:\n\n```\n#include <iostream>\n\
    ```\n\n```\nint main()\n{\n    std::cout << clamp(5, 3, 10) << \"\\n\";\n    std::cout\
    \ << clamp(3, 5, 10) << \"\\n\";\n    std::cout << clamp(13, 3, 10) << \"\\n\"\
    ;\n    std::cout << clamp(13.0, 3.0, 10.1) << \"\\n\";\n    std::cout << clamp<double>(13.0,\
    \ 3, 10.2) << \"\\n\";\n    return 0;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 181
  md: 'We will get the following expected output:


    ```

    $ ./a.out

    5

    5

    10

    10.1

    10.2

    ```


    Figure 2B.12: Clamp program output


    In the last call to clamp, we have passed the template the double type between
    < and >. But we haven''t followed the same for the other four calls. Why? It turns
    out that the compiler is getting smarter as it gets older. With every release
    of the standard, they improve what is known as type deduction. Because the compiler
    is able to deduce the type, we do not need to tell it what type to use. The reason
    for this is that the three arguments to the class without the template parameter
    have the same type – the first three are all int while the fourth one is double.
    But we had to tell the compiler which type to use for the final one because it
    has two doubles and an int as arguments, which resulted in a compilation error
    saying no function found. But then, it gave us information about why the template
    could not be used. This form, where you force the types, is known as explicit
    template argument specification.


    # C++ Pre-Packaged Templates


    The C++ Standard is comprised of two major parts:


    +   - The language definition, that is, the keywords, syntax, lexical definitions,
    structures, and so on.

    +   - The Standard Library, that is, all the pre-written general-purpose functions
    and classes to be provided by the compiler vendor. A subset of this library is
    implemented using templates and is known as the Standard Template Library (STL).


    The STL has origins in the generics provided in the Ada language that was developed
    by David Musser and Alexander Stepanov. Stepanov was a strong advocate for the
    use of generic programming as the basis for software development. In the 90s,
    he saw the opportunity to do this with the new language C++ to influence mainstream
    development, and proposed to the ISO C++ committee that the STL should be included
    as part of the language. The rest is history.'
  merge: -1
  img_proc: true
- pgno: 182
  md: "The STL is comprised of four categories of predefined generic algorithms and\
    \ classes:\n\n+   - **Containers**: General sequence (vector, list, deque) and\
    \ associative containers (set, multiset, map)\n+   - **Iterators**: A set of classes\
    \ to traverse across containers and define the extent of the container (ranges\
    \ expressed as **begin()** and **end()**). Note that one fundamental design choice\
    \ in the STL is that **end()** points to a position one after the last item –\
    \ mathematically, that is [**begin()**, **end()**).\n+   - **Algorithms**: Over\
    \ 100 different algorithms covering sorting, searching, set operations, and others.\n\
    +   - **Functions**: Support for functors (function objects where objects can\
    \ be called like functions). One use is for predicates in template algorithms\
    \ such as **find_if()**.\n\nThe clamp function template that we implemented previously\
    \ is simplistic and while it would work for any type that supports the less than\
    \ operator, it would not be very efficient – it could result in very large copies\
    \ if the type has a large size. Since C++17, the STL includes a **std::clamp()**\
    \ function that is declared more like this:\n\n```\n#include <cassert>\n\ntemplate<class\
    \ T, class Compare>\nconst T& clamp( const T& v, const T& lo, const T& hi, Compare\
    \ comp )\n{\n    return assert( !comp(hi, lo) ),\n        comp(v, lo) ? lo : comp(hi,\
    \ v) ? hi : v;\n}\n\ntemplate<class T>\nconst T& clamp( const T& v, const T& lo,\
    \ const T& hi )\n{\n    return clamp( v, lo, hi, std::less<>() );\n}\n```\n\n\
    As we can see, it uses references for the arguments and the return value. Changing\
    \ the arguments to use references reduces what has to be passed on and returned\
    \ on the stack. Also, note that the designers have worked to produce a more general\
    \ version of the template so that we are not reliant on the < operator that exists\
    \ for the type. However, we can define the ordering by passing comp."
  merge: -1
  img_proc: true
- pgno: 183
  md: "From the preceding examples, we have seen that, like functions, templates can\
    \ take multiple comma-separated parameters.\n\n# Type Aliases – typedef and using\n\
    \nIf you have used the std::string class, then you have been using an alias. There\
    \ are a few template classes related to strings that need to implement the same\
    \ functionality. But the type representing a character is different. For example,\
    \ for std::string, the representation is char, while std::wstring uses wchar_t.\
    \ There are several others for char16_t and char32_t. Any variation in the functionality\
    \ will be managed through traits or template specialization.\n\nPrior to C++11,\
    \ this would have been aliased from the std::basic_string base class, as follows:\n\
    \n```\nnamespace std {\n    typedef basic_string<char> string;\n}\n```\n\nThis\
    \ does two main things:\n\n+   - Reduces the amount of typing required to declare\
    \ the variable. This is a simple case, but when you declare a unique pointer to\
    \ a map of strings to object, it can get very long and you will make errors:\n\
    +     typedef std::unique_ptr<std::map<std::string,myClass>> UptrMapStrToClass;\n\
    \n+   - Improves the readability as you now conceptually think of it as a string\
    \ and do not need to worry about the details.\n\nBut C++11 introduced a better\
    \ way – alias declarations – which utilizes the using keyword. The preceding code\
    \ can be implemented like so:\n\n```\nnamespace std {\n    using string = basic_string<char>;\n\
    }\n```\n\nThe preceding example is simple and the alias, either typedef or using,\
    \ is not too hard to grok. But when the alias involves more complicated expressions,\
    \ they too can be a little unreadable – particularly function pointers. Consider\
    \ the following code:\n\n```\ntypedef int (*FunctionPointer)(const std::string&,\
    \ const Point&);\n```\n\nNow, consider the following code:\n\n```\nusing FunctionPointer\
    \ = int (*)(const std::string&, const Point&);\n```"

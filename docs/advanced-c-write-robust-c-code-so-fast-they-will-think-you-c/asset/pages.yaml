  md: "When writing libraries or factories, the author of the library will not always\
    \ know how a user will want to use the objects that have been created, so the\
    \ recommendation is to return **unique_ptr<T>** from your factory methods. The\
    \ reason for this is that the user can easily convert a **std::unique_ptr** into\
    \ a **std::shared_ptr** by assignment:\n\n```\nstd::unique_ptr<MyClass> unique_obj\
    \ = std::make_unique<MyClass>();\nstd::shared_ptr<MyClass> shared_obj = unique_obj;\n\
    ```\n\nThis will transfer ownership and leave **unique_obj** empty.\n\n> **Note**\n\
    > \n> Once a resource has been made a shared resource, it cannot be reverted into\
    \ a unique object.\n\n# std::weak_ptr\n\nA weak pointer is a variant of a shared\
    \ pointer, but it doesn't hold a reference count to the resource. So, it does\
    \ not prevent it from being released when the count goes to zero. Consider the\
    \ following program structure, which may occur within a normal graphical user\
    \ interface (GUI):\n\n```\n#include <iostream>\n\n#include <memory>\n\nstruct\
    \ ScrollBar;\n\nstruct TextWindow;\n\nstruct Panel\n{\n    ~Panel() {\n      \
    \  std::cout << \"--Panel destroyed\\n\";\n    }\n\n    void setScroll(const std::shared_ptr<ScrollBar>\
    \ sb) {\n        m_scrollbar = sb;\n    }\n\n    void setText(const std::shared_ptr<TextWindow>\
    \ tw) {\n        m_text = tw;\n```"

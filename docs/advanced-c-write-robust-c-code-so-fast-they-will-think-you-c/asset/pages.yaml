  md: "# Classes, Structs, and Unions Revisited\n\nPreviously, we discussed that the\
    \ difference between a class and a struct was the default access modifier – private\
    \ for class and public for struct. This difference goes one step further – it\
    \ applies to the base class if it does not specify anything:\n\n```\n```cpp\n\
    class DerivedC : Base  // inherits as if \"class DerivedC : private Base\" was\
    \ used\n{\n};\n```\n```\n\n```\n```cpp\nstruct DerivedS : Base // inherits as\
    \ if \"struct DerivedS : public Base\" was used\n{\n};\n```\n```\n\nIt should\
    \ be noted that a union can neither be a base class nor be derived from a base\
    \ class. If there is essentially no difference between a struct and a class, then\
    \ which type should we use? Essentially, it is one of convention. A **struct**\
    \ is used to bundle together several related elements, while a **class** can do\
    \ things and has responsibilities. An example of a struct is as follows:\n\n```\n\
    ```cpp\nstruct Point    // A point in 3D space\n{\n    double m_x;\n    double\
    \ m_y;\n    double m_z;\n};\n```\n```\n\nIn the preceding code, we can see that\
    \ it groups together three coordinates so that we can reason about a point in\
    \ a 3D space. This structure can be passed as a coherent dataset to methods that\
    \ need points, rather than three separate arguments per point. A class, on the\
    \ other hand, models an object that can perform actions. Take a look at the following\
    \ example:\n\n```\n```cpp\nclass Matrix\n{\npublic:\n    Matrix& operator*(const\
    \ Matrix& rhs)\n    {\n```\n```"

  md: "```\nint idx = j + i * 256;\ntable[idx] = !isspace(j) && isspace(i);\n}\n```\n\
    \nThe loop to count the words becomes the following (the full code can be found\
    \ in Snippet15.cpp):\n\n```\nint count = 0;\nfor(int i = 0; i < s.size() - 1;\
    \ ++i)\n{\n    // grab the 2 bytes at s[i] as a 16 bit value\n    unsigned short\
    \ idx;\n    memcpy(&idx, &s[i], 2);\n    count += table[idx];\n}\n```\n\nWe read\
    \ each character of the string as a single 16-bit value. Directly casting a pointer\
    \ from char* to another type and dereferencing it is undefined behavior - the\
    \ correct way to do this is to use memcpy(). The compiler is smart enough to use\
    \ the CPU memory access instructions rather than actually call memcpy() for 2\
    \ bytes. We have ended up with the loop containing no conditional statement, which\
    \ should make it much faster. Remember that X86 architecture is little-endian\
    \ - so a 16-bit value read from a character array will have the first character\
    \ as its LSB and the second as the MSB.\n\n+   7. Now, time the code we wrote:\n\
    \n```\n$ g++ -O3 Snippet15.cpp SnippetWC.cpp Timer.cpp\n$ ./a.out data.txt\n```\n\
    \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_625_0.png)\n\nFigure 8.44: Output of\
    \ the code in Snippet15.cpp\n\nThis larger lookup table resulted in a 1.8x speed\
    \ improvement for wordCount(). Let's step back and look at this from another angle\
    \ so that we can use existing the standard library effectively. The advantages\
    \ of this are two-fold - firstly, the code is less prone to errors, and secondly,\
    \ we could take advantage of the parallelization available with some compilers."

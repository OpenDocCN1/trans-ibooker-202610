  md: "This technique uses the lifetime of the File objects to acquire and release\
    \ the resource, ensuring that the resources do not leak. The resource is acquired\
    \ during the construction (initialization) of the management class and released\
    \ during the destruction of the management class. It is this behavior of scope-bound\
    \ resources that gives rise to the name Resource Acquisition Is Initialization.\n\
    \nThe preceding example deals with managing file handles that are system resources.\
    \ It applies to any resources that are required to be acquired before use, and\
    \ then relinquished when finished. The RAII technique can be applied to a wide\
    \ range of resources – open files, open pipes, allocated heap memory, open sockets,\
    \ threads of execution, database connections, locking of mutexes/critical sections\
    \ – basically any resource that is in short supply in the host system and needs\
    \ to be managed.\n\n# Exercise 3: Implementing RAII for Memory and File Handles\n\

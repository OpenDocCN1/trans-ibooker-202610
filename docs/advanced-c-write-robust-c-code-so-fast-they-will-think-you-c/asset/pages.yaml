- pgno: 164
  md: "We have come across access modifiers such as **public**, **protected** and\
    \ **private** before. They control how we have access to the base classes' members.\
    \ The Motorcycle class will be derived as follows:\n\n```\nclass Motorcycle :\
    \ public Vehicle\n{\npublic:\n    Motorcycle(int engineSize) : Vehicle(2, engineSize)\
    \ {};\n};\n```\n\nIn this case, the Vehicle class is referred to as the **base\
    \ class** or the **super class**, while the Motorcycle class is referred to as\
    \ the **derived class** or **subclass**. Graphically, we can represent this as\
    \ follows, where the arrows point from the derived class to the base class:\n\n\
    ![](img/6507d435e2edfa3c00c220d0ccfcaf94_164_0.png)\n\nFigure 2B.2: Vehicle class\
    \ hierarchy\n\nBut a motorcycle drives differently from a generic vehicle. So,\
    \ we need to modify the **Motorcycle** class so that it behaves differently. The\
    \ updated code will be as follows:\n\n```\nclass Motorcycle : public Vehicle\n\
    {\npublic:\n    Motorcycle(int engineSize) : Vehicle(2, engineSize) {};\n\n  \
    \  void Drive()\n    {\n        std::cout << \"Motorcycle::Drive\\n\";\n    };\n\
    };\n```"

- pgno: 464
  md: '# Leveraging Asynchronous I/O


    There are a lot of cases where I/O operations can take a lot of time, for example,
    creating a backup file, searching a huge database, reading large files, and so
    on. You can use threads to execute I/O operations without blocking the application''s
    execution. But for some applications, it''s not a suitable way to handle long
    I/O, for example, when there can are thousands of I/O operations per second. In
    those cases, C++ developers use asynchronous I/O. It saves thread resources and
    ensure that the thread of the execution cannot be blocked. Let''s consider what
    synchronous and asynchronous I/O is.


    As you may recall from Chapter 5, The Philosophers'' Dinner – Threads and Concurrency,
    synchronous operation means that some thread invokes the operation and waits for
    it to complete. It may be a single-threaded or multi-threaded application. The
    main point is that the thread is waiting for the I/O operation to complete.


    The asynchronous execution takes place when an operation does not block the execution
    of the working thread. The thread that performs the asynchronous I/O operation
    sends an asynchronous request and continues with another task. When the operation
    has finished, the initial thread will be notified about the finish and it can
    handle the results as necessary.


    From this, it looks like asynchronous I/O is much better than synchronous, but
    it depends on the situation. If you need to perform lots of fast I/O operations,
    it would be more suitable to follow the synchronous way due to the overhead of
    processing kernel I/O requests and signals. Thus, you need to consider all possible
    scenarios while developing an architecture for your application.


    The Standard Library doesn''t support asynchronous I/O operations. So, to leverage
    asynchronous I/O, we need to consider alternative libraries or write our own implementations.
    First, let''s consider platform-dependent implementations. Then, we will look
    at cross-platform libraries.


    # Asynchronous I/O on Windows Platforms


    Windows supports I/O operations for a variety of devices: files, directories,
    drives, ports, pipes, sockets, terminals, and so on. In general, we use the same
    interface for I/O for all of these devices, but some settings differ from device
    to device. Let''s consider an I/O operation on a file in Windows.'
  merge: -1
  img_proc: true
- pgno: 465
  md: 'So, in Windows, we need to open a device and get a Handler for it. Different
    devices open in different ways. To open a file, directory, drive, or port, we
    use the `CreateFile` function from the `<Windows.h>` header. To open a pipe, we
    use the `CreateNamedPipe` function. To open a socket, we use the socket() and
    accept() functions. To open a terminal, we use the `CreateConsoleScreenBuffer`
    and `GetStdHandle` functions. All of them return a device handler that is used
    in all the functions for work with that device.


    The `CreateFile` function takes seven parameters that manage the work with the
    opened device. The function declaration looks as follows:


    ```

    HANDLE CreateFile( PCTSTR pszName,\n                   DWORD dwDesiredAccess,\n                   DWORD
    dwShareMode,\n                   PSECURITY_ATTRIBUTES psa,\n                   DWORD
    dwCreationDisposition,\n                   DWORD dwFlagsAndAttributes,\n                   HANDLE
    hFileTemplate);

    ```


    The first parameter is `pszName` – the path to the file. The second parameter
    calls `dwDesiredAccess` and manages access to the device. It can take one of the
    following values:


    ```

    0 // only for configuration changing\nGENERIC_READ // only reading\nGENERIC_WRITE
    // only for writing\nGENERIC_READ | GENERIC_WRITE // both for reading and writing

    ```


    The third parameter, `dwShareMode`, manages how the OS should handle all the new
    `CreateFile` invocations when the file is already open. It can take one of the
    following values:


    ```

    0 // only one application can open device simultaneously\nFILE_SHARE_READ // allows
    reading by multiple applications simultaneously\nFILE_SHARE_WRITE // allows writing
    by multiple applications simultaneously\nFILE_SHARE_READ | FILE_SHARE_WRITE //
    allows both reading and writing by multiple applications simultaneously\nFILE_SHARE_DELETE
    // allows moving or deleting by multiple applications simultaneously

    ```'
  merge: -1
  img_proc: true
- pgno: 466
  md: 'The fourth parameter, psa, is usually set to NULL. The fifth parameter, dwCreationDisposition,
    manages whether the file be opened or created. It can take one of the following
    values:


    ```

    CREATE_NEW // creates new file or fails if it is existing

    CREATE_ALWAYS // creates new file or overrides existing

    OPEN_EXISTING // opens file or fails if it is not exists

    OPEN_ALWAYS // opens or creates file

    TRUNCATE_EXISTING // opens existing file and truncates it or fails if it is not
    exists

    ```


    The sixth parameter, dwFlagsAndAttributes, manages the cache or work with the
    file. It can take one of the following values for managing caching:


    ```

    FILE_FLAG_NO_BUFFERING // do not use cache

    FILE_FLAG_SEQUENTIAL_SCAN // tells the OS that you will read the file sequentially

    FILE_FLAG_RANDOM_ACCESS // tells the OS that you will not read the file in sequentially

    FILE_FLAG_WRITE_THROUGH // write without cache but read with

    ```


    It can take one of the following values for managing work with files:


    ```

    FILE_FLAG_DELETE_ON_CLOSE // delete file after closing (for temporary files)

    FILE_FLAG_BACKUP_SEMANTICS // used for backup and recovery programs

    FILE_FLAG_POSIX_SEMANTICS // used to set case sensitive when creating or opening
    a file

    FILE_FLAG_OPEN_REPARSE_POINT // allows to open, read, write, and close files differently

    FILE_FLAG_OPEN_NO_RECALL // prevents the system from recovering the contents of
    the file from archive media

    FILE_FLAG_OVERLAPPED // allows to work with the device asynchronously

    ```


    It can take one of the following values for file attributes:


    ```

    FILE_ATTRIBUTE_ARCHIVE // file should be deleted

    FILE_ATTRIBUTE_ENCRYPTED // file is encrypted

    FILE_ATTRIBUTE_HIDDEN // file is hidden

    FILE_ATTRIBUTE_NORMAL // other attributes are not set

    FILE_ATTRIBUTE_NOT_CONTENT_INDEXED // file is being processed by the indexing
    service

    ```'

    \ It is easy to forget to release a resource, especially when there are multiple\
    \ exit points.\n\nSo, how can we manage the resource so that we have exception-safe\
    \ and simpler code? This problem is not unique to C++ and different languages\
    \ manage it differently. Java, C#, and Python use a garbage collection approach\
    \ that sweeps through created objects and cleans them up when they are no longer\
    \ referenced. But C++ does not have garbage collection, so what is the solution?\n\
    \nConsider the following class:\n\n```\nclass File {\npublic:\n    File(const\
    \ char* name, const char* access) {\n        m_file = fopen(name, access);\n \

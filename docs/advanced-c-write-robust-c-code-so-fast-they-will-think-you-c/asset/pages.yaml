    # Visibility, Lifetime, and Access


    We have talked about creating our own types and declaring variables and functions
    while mainly focusing on simple functions and a single file. We will now look
    at what happens when there are multiple source files (translation units) that
    contain classes and function definitions. Also, we''ll check which variables and
    functions can be visible from the other parts of the source files, how long the
    variables live, and look at the difference between internal and external linkage.
    In *Chapter 1, Anatomy of Portable C++ Software*, we saw how the toolchain works
    to compile the source files and produce the object files and that the linker puts
    it all together to form an executable program.


    When a compiler processes a source file, it generates an object file that contains
    the translated C++ code and enough information for the linker to resolve any references
    from the compiled source file to another source file. In *Chapter 1, Anatomy of
    Portable C++ Software*, **CxxTemplate.cpp** called **sum()**, which is defined
    in the **SumFunc.cpp** file. When the compiler constructs an object file, it creates
    the following segments:


    +   - **Code segment** (also known as text): This is the translation of the C++
    functions into the target machine instructions.

    +   - **Data segment**: This contains all the variables and data structures that
    are declared in the program, not local or allocated off the heap or stack, and
    are initialized.

    +   - **BSS segment**: This contains all the variables and data structures that
    are declared in the program, not local or allocated off the heap or stack, and
    are not initialized (but will be initialized to zero).

    +   - **Database of exported symbols**: A list of variables and functions that
    are in this object file and their location.'
  merge: -1
  img_proc: true
- pgno: 175
  md: "+   - **Database of referenced symbols:** A list of variables and functions\
    \ this object file needs from outside itself and where they are used.\n\n> **Note**\n\
    > \n> BSS is used to name the uninitialized data segment and its name is historically\
    \ derived from Block Started by Symbol.\n\nThe linker then collects all the code\
    \ segments, data segments, and **BSS** segments together to form the program.\
    \ It uses the information in the two databases (DB) to resolve all the referenced\
    \ symbols to the exported symbols list and patch the code segments with this information\
    \ so that they can operate correctly. Graphically, this is depicted as follows:\n\
    \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_175_0.png)\n\n**Figure 2B.10: Parts\
    \ of the object files and the executable file**"
  merge: -1
  img_proc: true
- pgno: 176
  md: 'For the purposes of the discussion that follows, BSS and data segments will
    be referred to simply as data segment (the only difference being that BSS is not
    initialized). When a program is executed, it is loaded into memory and its memory
    looks a bit like the executable file layout – it contains the text segment, data
    segment, BSS segment, and free memory allocated by the host system, which contains
    what is known as the stack and the heap. The stack typically starts at the top
    of the memory and grows down, while the heap starts where BSS finishes and grows
    up, toward the stack:


    ![](img/6507d435e2edfa3c00c220d0ccfcaf94_176_0.png)


    Figure 2B.11: CxxTemplate runtime memory map


    The section of the program in which a variable or identifier is accessible is
    known as the scope. There are two broad categories of scope:


    +   - **Local scope** (also known as **block scope**): This applies to anything
    declared within a block that is enclosed with curly braces ({}). The variable
    can be accessed inside the curly braces. Just like blocks can be nested, so can
    the scope of the variable. This typically includes local variables and function
    parameters, and these are generally stored in the stack.


    +   - **Global / file scope**: This applies to variables declared outside a normal
    function or class, as well as to the normal functions. The variable can be accessed
    anywhere in the file and possibly from other files (global) if the linkage is
    correct. These variables are allocated memory by the linker in the data segment.
    The identifiers are placed into the global namespace, which is the default namespace.'
  merge: -1
  img_proc: true
- pgno: 177
  md: "# Namespaces\n\nWe can think of a namespace as a dictionary of names of variables,\
    \ functions, and user-defined types. For small programs, it is ok to use the global\
    \ namespace as there is very little chance of you creating multiple variables\
    \ with the same name and getting name clashes. As programs get larger, and more\
    \ third-party libraries are included, the chance of name clashes increases. Therefore,\
    \ library writers will put their code into a namespace (that is hopefully unique).\
    \ This allows the programmer to control access to the identifiers in the namespace.\
    \ By using the standard library, we have already been using the std namespace.\
    \ A namespace is declared like so:\n\n```\n```cpp\nnamespace name_of_namespace\
    \ {\n    // put declarations in here\n}\n```\n```\n\nIt is usual for `name_of_namespace`\
    \ to be short, and namespaces can be nested.\n\n> **Note**\n> \n> A good use of\
    \ namespaces can be seen in the boost libraries here: [https://www.boost.org/](https://www.boost.org/).\n\
    \nA variable has another attribute, that of **lifetime**. There are three fundamental\
    \ lifetimes; two that are managed by the compiler and one that the programmer\
    \ chooses:\n\n+   - **Automatic lifetime:** Local variables are created when they\
    \ are declared and are destroyed upon exiting the scope that they are in. These\
    \ are managed by the stack.\n+   - **Permanent lifetime:** Global variables and\
    \ static local variables. The compiler causes global variables to be created when\
    \ the program begins (before entering the `main()` function) and causes static\
    \ local variables to be created when they are first accessed. In both cases, the\
    \ variable is destroyed when the program exits. These variables are placed in\
    \ the data segments by the linker.\n+   - **Dynamic lifetime:** Variables are\
    \ created and destroyed by request of the programmer (through the use of `new`\
    \ and `delete`). These variables have their memory allocated from the heap."
  merge: -1
  img_proc: true
- pgno: 178
  md: "The final attribute of a variable we will consider is **linkage**. Linkage\
    \ indicates what the compiler and linker will do if they encounter variables and\
    \ functions that have the same name (or identifier). For a function, its actually\
    \ what is known as the mangled name – the compiler uses the name of the function,\
    \ its return type, and its argument types to produce a mangled name. There are\
    \ three types of linkage:\n\n+   - **No linkage**: This means that the identifier\
    \ only refers to itself and applies to local variables and locally defined user\
    \ types (that is, inside a block).\n\n+   - **Internal linkage**: This means that\
    \ the identifier can be accessed anywhere in the file in which it is declared.\
    \ This applies to static global variables, const global variables, static functions,\
    \ and any variables or functions declared in an anonymous namespace within the\
    \ file. An anonymous namespace is a namespace with no stated name.\n\n+   - **External\
    \ linkage**: This means that, with the right forward declarations, it can be accessed\
    \ from within all files. This includes normal functions, non-static global variables,\
    \ extern const global variables, and user-defined types.\n\nWhile these are termed\
    \ linkages, only the last one actually involves the linker. The other two are\
    \ achieved by the compiler excluding information from the DB of exported identifiers.\n\
    \n# Templates – Generic Programming\n\nAs a computer scientist, or as a programming\
    \ enthusiast, at some point in time, you probably had to write one (or more) sort\
    \ algorithms. When discussing the algorithm, you were not particularly concerned\
    \ about the type of data being sorted, just that the two objects of that type\
    \ could be compared and that the domain is a totally ordered set (that is, if\
    \ one object is compared with any other, you can determine which comes first).\
    \ Different programming languages provide different solutions to this problem:\n\
    \n+   - **Python**: A dynamic language with built-in function sort and member\
    \ functions on list. As a dynamic language, it does not need to concern itself\
    \ with the type if it can call the comparison operator and a **swap** function.\n\
    \n+   - **C**: This has a function in its standard library called qsort that has\
    \ the following signature:\n\n```\nvoid qsort (void* base, size_t num, size_t\
    \ size,\n    int (*compare)(const void*,const void*));\n```\n\nThis deals with\
    \ different types as base is a **void pointer**. **size_t** size defines how big\
    \ each object is, while the **compare()** function defines how to compare the\
    \ two objects."

    \nNow, let's learn about what we can use for cross-platform applications.\n\n\
    # Asynchronous Cross-Platform I/O Libraries\n\nWe've already considered the platform-specific\
    \ decision for asynchronous I/O. Now, to write a cross-platform application, you\
    \ can use these platform-specific approaches and use them with preprocessor directives;\
    \ for example:\n\n```\n```cpp\n#ifdef WIN\n\n#include <WinAIO.hpp>\n\n#else\n\n\
    #include <LinAIO.hpp>\n\n#endif\n```\n```\n\nIn both the headers, you can declare\
    \ the same interface for platform-specific implementations. You can also implement\
    \ your own AIO library, which will use some state machines or queue in the separate\
    \ thread. Also, you can use some of the free libraries that implement the necessary\
    \ features. The most popular library is **Boost.Asio**. It provides a lot of interfaces\
    \ for asynchronous work, such as the following:\n\n+   - Concurrency without threads\n\
    +   - Threads\n+   - Buffers\n+   - Streams\n+   - Coroutines\n+   - TCP, UDP,\
    \ and ICMP\n+   - Sockets\n+   - SSL\n+   - Timers\n+   - Serial ports"

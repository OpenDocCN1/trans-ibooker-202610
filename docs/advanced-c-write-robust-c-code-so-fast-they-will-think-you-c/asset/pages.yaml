    +   5. Rebuild and run the tests – they should now all pass.

    +   6. Add the following test:

    +   ```

    +   TEST_F(DateTest, Constructor1970Jan2)

    +   {

    +       Date dt(2, 1, 1970);

    +       VerifyDate(dt, 1970, 1, 2);

    +   }

    +   ```'

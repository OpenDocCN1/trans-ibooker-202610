- pgno: 16
  md: '# About the Book


    C++ is one of the most widely used programming languages and is applied in a variety
    of domains, right from gaming to **graphical user interface (GUI)** programming
    and even operating systems. If you''re looking to expand your career opportunities,
    mastering the advanced features of C++ is key.


    The book begins with advanced C++ concepts by helping you decipher the sophisticated
    C++ type system and understand how various stages of compilation convert source
    code to object code. You''ll then learn how to recognize the tools that need to
    be used in order to control the flow of execution, capture data, and pass data
    around. By creating small models, you''ll even discover how to use advanced lambdas
    and captures and express common API design patterns in C++. As you cover later
    chapters, you''ll explore ways to optimize your code by learning about memory
    alignment, cache access, and the time a program takes to run. The concluding chapter
    will help you to maximize performance by understanding modern CPU branch prediction
    and how to make your code cache-friendly.


    By the end of this book, you''ll have developed programming skills that will set
    you apart from other C++ programmers.


    # About the Authors


    **Gazihan Alankus** holds a PhD in computer science from Washington University
    in St. Louis. Currently, he is an assistant professor at the Izmir University
    of Economics in Turkey. He teaches and conducts research on game development,
    mobile application development, and human-computer interaction. He is a Google
    developer expert in Dart and develops Flutter applications with his students in
    his company Gbot, which he founded in 2019.


    **Olena Lizina** is a software developer with 5 years experience in C++. She has
    practical knowledge of developing systems for monitoring and managing remote computers
    with a lot of users for an international product company. For the last 4 years,
    she has been working for international outsourcing companies on automotive projects
    for well-known automotive concerns. She has been participating in the development
    of complex and highly performant applications on different projects, such as **HMI
    (Human Machine Interface)**, navigation, and applications for work with sensors.


    **Rakesh Mane** has over 18 years experience in the software industry. He has
    worked with proficient programmers from a variety of regions: India, the US, and
    Singapore. He has mostly worked in C++, Python, shell scripting, and database.
    In his spare time, he likes to listen to music and travel. Also, he likes to play
    with, experiment with, and break things using software tools and code.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '**Vivek Nagarajan** is a self-taught programmer who started out in the 1980s
    on 8-bit systems. He has worked on a large number of software projects and has
    14 years of professional experience with C++. Aside from this, he has worked on
    a wide variety of languages and frameworks across the years. He is an amateur
    powerlifter, DIY enthusiast, and motorcycle racer. He currently works as an independent
    software consultant.


    **Brian Price** has over 30 years experience working in a variety of languages,
    projects, and industries, including over 20 years experience in C++. He was worked
    on power station simulators, SCADA systems, and medical devices. He is currently
    crafting software in C++, CMake, and Python for a next-generation medical device.
    He enjoys solving puzzles and the Euler project in a variety of languages.


    # Learning Objectives


    By the end of this book, you will be able to:


    +   - Delve into the anatomy and workflow of C++

    +   - Study the pros and cons of different approaches to coding in C++

    +   - Test, run, and debug your programs

    +   - Link object files as a dynamic library

    +   - Use templates, SFINAE, constexpr if expressions and variadic templates

    +   - Apply best practice to resource management


    # Audience


    If you have worked in C++ but want to learn how to make the most of this language,
    especially for large projects, this book is for you. A general understanding of
    programming and knowledge of using an editor to produce code files in project
    directories is a must. Some experience with strongly typed languages, such as
    C and C++, is also recommended.


    # Approach


    This fast-paced book is designed to teach you concepts quickly through descriptive
    graphics and challenging exercises. The book will have "call-outs," with key take
    away points and the most common pitfalls to keep you interested, while breaking
    up the topics into manageable sections.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Hardware Requirements


    For the optimal student experience, we recommend the following hardware configuration:


    +   - Any entry-level PC/Mac with Windows, Linux, or macOS will suffice

    +   - Processor: Dual core or equivalent

    +   - Memory: 4 GB RAM (8 GB preferred)

    +   - Storage: 35 GB of available space


    # Software Requirements


    You''ll also need the following software installed in advance:


    +   - Operating system: Windows 7 SP1 32/64-bit, Windows 8.1 32/64-bit, or Windows
    10 32/64-bit, Ubuntu 14.04 or later, or macOS Sierra or later

    +   - Browser: Google Chrome or Mozilla Firefox


    # Installation and Setup


    Before you embark on this book, you will need to install the following libraries
    used in this book. You will find the steps to install these here.


    # Installing CMake


    We will use CMake version 3.12.1 or later. We have two options for installation.


    Option 1:


    If you are using Ubuntu 18.10, you can install CMake globally using the following
    command:


    ```

    sudo apt install cmake

    ```


    When you run the following command:


    ```

    cmake -version

    ```


    You should see the following output:


    ```

    cmake version 3.12.1


    CMake suite maintained and supported by Kitware (kitware.com/cmake).

    ```


    If the version you see here is lower than 3.12.1 (for example, 3.10), you should
    install CMake locally using the following instructions.


    Option 2:'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'If you are using an older Linux version, you may get a CMake version that is
    lower than 3.12.1. Then, you need to install it locally. Use the following commands:


    ```

    wget \

    https://github.com/Kitware/CMake/releases/download/v3.15.1/cmake-3.15.1-Linux-x86_64.sh


    sh cmake-3.15.1-Linux-x86_64.sh

    ```


    When you see the software license, type y and press Enter. When asked about the
    installation location, type y and press Enter again. This should install it to
    a new folder in your system.


    Now, we will add that folder to our path. Type the following. Note that the first
    line is a bit too long and the line breaks in this document. You should write
    it as a single line, as follows:


    ```

    echo "export PATH=\"$HOME/cmake-3.15.1-Linux-x86_64/bin:$PATH\"" >> .bash_profile


    source .profile

    ```


    Now, when you type the following:


    ```

    cmake -version

    ```


    You should see the following output:


    ```

    cmake version 3.15.1


    CMake suite maintained and supported by Kitware (kitware.com/cmake).

    ```


    3.15.1 is the current latest release at the time of writing this document. Since
    it is newer than 3.12.1, this will suffice for our purposes.


    # Installing Git


    Test the current installation by typing the following:


    ```

    git --version

    ```


    You should see a line such as the following:


    ```

    git version 2.17.1

    ```


    If you see the following line instead, you need to install git:


    ```

    command ''git'' not found

    ```'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'Here is how you can install **git** in Ubuntu:


    ```

    sudo apt install git

    ```


    # Installing g++


    Test the current installation by typing the following:


    ```

    g++ --version

    ```


    You should see an output such as the following:


    ```

    g++ (Ubuntu 7.4.0-1ubuntu1~18.04) 7.4.0


    Copyright (C) 2017 Free Software Foundation, Inc.


    This is free software; see the source for copying conditions. There is NO

    warranty; not even for MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.

    ```


    If it is not installed, type the following code to install it:


    ```

    sudo apt install g++

    ```


    # Installing Ninja


    Test the current installation by typing the following:


    ```


  md: "# Event Synchronization\n\nThere is another mechanism for synchronizing the\
    \ work of threads – event synchronization. This means the synchronization of the\
    \ work of the threads when one of them suspends its work until the other thread\
    \ signals the occurrence of some event. For example, there's Thread A, which receives\
    \ a message from another process. It writes the message to the queue and waits\
    \ for new messages. There is another thread, Thread B, that processes these messages.\
    \ It reads messages from the queue and performs some actions on them. When there\
    \ are no messages, Thread B is sleeping. When Thread A receives a new message,\
    \ it wakes up Thread B and processes it. The following diagram provides a clear\
    \ understanding of the event synchronization of two threads:\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_374_0.png)\n\
    \nFigure 5.15: Event synchronization of two threads\n\nHowever, even in synchronized\
    \ code can appear another reason for a race conditions – a flawed interface of\
    \ a class. To get an understanding of what this is, let’s consider the following\

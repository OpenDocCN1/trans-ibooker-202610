- pgno: 143
  md: 'If we were to take **sizeof(Matrix10x10)**, we would get **sizeof(double)**
    x 10 x 10 = 800 bytes. Now, if we were to implement an inversion matrix function
    for this, its signature might look like this:


    ```

    Matrix10x10 invert(Matrix10x10 lhs);

    ```


    ```

    Matrix10x10 mat;


    // set up mat


    Matrix10x10 inv = invert(mat);

    ```


    Firstly, this means that the compiler would need to pass the value held by **mat**
    to the **invert()** function and copy the 800 bytes onto the stack. The function
    then does whatever it needs to do to invert the matrix (an L-U decomposition,
    calculation of the determinant – whatever approach the implementer chooses) and
    then copy the 800-byte result back to the **inv** variable. Passing large values
    on the stack is never a good idea, for two reasons:


    +   - The stack is a finite resource that''s given to our program by the host
    operating system.

    +   - Copying large values around the system is inefficient.


    This approach is known as pass-by-value. That is, the value of an item we wish
    to process is copied to the function.


    In C (and C++), this limitation is addressed by the use of pointers. The preceding
    code may become the following:


    ```

    void invert(Matrix10x10* src, Matrix10x10* inv);

    ```


    ```

    Matrix10x10 mat;


    Matrix10x10 inv;


    // set up mat


    invert(&mat, &inv);

    ```


    Here, we just pass the address of the src and target for the inverse result as
    two pointers (which is a small number of bytes). Unfortunately, this results in
    code inside the function that has to use the dereference operator (*) every time
    we use src or inv, making the code more difficult to read. In addition, the use
    of pointers has led to many problems.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'C++ introduced a better approach – the variable alias or reference. A reference
    type is declared with the ampersand (&) operator. So, we can declare the invert
    method as follows:


    ```

    void invert(Matrix10x10& src, Matrix10x10& inv);

    ```


    ```

    Matrix10x10 mat;

    Matrix10x10 inv;

    // set up mat

    invert(mat, inv);

    ```


    Note that calling the method requires no special operator to pass the reference.
    From the compiler''s viewpoint, a reference is still a pointer with one limitation
    – it cannot hold a nullptr. From the programmer''s viewpoint, a reference allows
    us to reason about our code without having to worry about having the right dereference
    operator in the right place. This is known as pass-by-reference.


    We saw references being passed to the copy constructor and the copy assignment
    method. The types of references, when used for their move equivalents, are known
    as rvalue reference operators and will be explained in Chapter 3, The Distance
    Between Can and Should – Objects, Pointers, and Inheritance.


    One advantage of pass-by-value was that we cannot inadvertently modify the value
    of the variable that''s passed into a method. Now, if we pass-by-reference, we
    can no longer guarantee that the method we are calling will not modify the original
    variable. To address this, we can change the signature of the invert method to
    read as follows:


    ```

    void invert(const Matrix10x10& src, Matrix10x10& inv);

    ```


    The const keyword tells the compiler that, when it is processing the definition
    of the invert() function, it is illegal to assign a new value to any part of the
    value referenced by src. If the method does attempt to modify src, the compiler
    will generate an error.


    In the Specifying Types – Variables section, we found that the declaration of
    auto title resulted in title being of the const char * type. Now, we can explain
    the const part.


    The title variable is a pointer to a char that is constant. In other words, we
    cannot change the value of the data stored in the memory that we are pointing
    to. Therefore, we cannot do the following:


    ```

    *title = ''s'';

    ```'

- pgno: 337
  md: "```\nT summer(T first, Args... args) {\n    if constexpr(sizeof...(args) >\
    \ 0)\n        return first + summer(args...);\n    else\n        return first;\n\
    }\n```\n\nIn the above code:\n\n+   - `typename... Args` declares Args as a **template\
    \ parameter pack**.\n+   - `Args... args` is a **function parameter pack**, that\
    \ is a bag of parameters whose types are given by Args.\n+   - `sizeof...(args)`\
    \ returns the number of pack elements in args. It is a special form of pack expansion.\n\
    +   - `args...` expands the pack in the recursive call to `summer()`.\n\nAlternatively,\
    \ you can think of the template as effectively the equivalent of:\n\n```\ntemplate<typename\
    \ T, typename T1, typename T2, ..., typename Tn>\nT summer(T first, T1 t1, T2,\
    \ ..., Tn tn) {\n    if constexpr(sizeof...( t1, t2, ..., tn) > 0)\n        return\
    \ first + summer(t1, t2, ..., tn);\n    else\n        return first;\n}\n```\n\n\
    When the compiler processes `summer(1, 3, 5, 7, 9, 11)` in the sample program,\
    \ it performs the following:\n\n+   - It deduces that T is int and Args... is\
    \ our parameter pack with <int, int, int, int, int>.\n+   - As there are more\
    \ than zero args in the pack, the compiler generates `first + summer(args...)`\
    \ with the ellipsis unpacking the template argument transforming `summer(args...)`\
    \ into `summer(3,5,7,9,11)`."

- pgno: 263
  md: '# Smart Pointers and Calling Functions


    Now that we can manage our resources, how do we use them? Do we pass around the
    smart pointers? When we have a smart pointer (unique_ptr or shared_ptr), we have
    four options when calling a function:


    +   - Pass the smart pointer by value

    +   - Pass the smart pointer by reference

    +   - Pass the managed resource by pointer

    +   - Pass the managed resource by reference


    This is not an exhaustive list but are the main ones to consider. The answer to
    how we pass the smart pointer, or its resource, depends on our intent with the
    call to the function:


    +   - Is the intend of the function to just use the resource?

    +   - Does the function take ownership of the resource?

    +   - Does the function replace the managed object?


    If the function is just going to use the resource, then it does not even need
    to know that it is being handed a managed resource. It simply needs to use it
    and should be called using the resource by pointer, or resource by reference (or
    even resource by value):


    ```

    do_something(Resource* resource);

    do_something(Resource& resource);

    do_something(Resource resource);

    ```


    If you want to pass the ownership of the resource to the function, then the function
    should be called by smart pointer by value and called using std::move():


    ```

    do_something(std::unique_ptr<Resource> resource);

    auto res = std::make_unique<Resource>();

    do_something (std::move(res));

    ```


    When do_something() returns, the res variable will be empty, and the resource
    is now owned by do_something().


    If you want to replace the managed object (a process known as reseating), then
    you pass the smart pointer by reference:


    ```

    do_something(std::unique_ptr<Resource>& resource);

    ```'

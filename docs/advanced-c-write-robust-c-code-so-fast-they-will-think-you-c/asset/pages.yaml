  md: "The first template for **enable_if** will result in the definition of an empty\
    \ struct (or class). The second template for **enable_if** is a specialization\
    \ for true as a first template argument that will result in the class with a typedef\
    \ definition. The definition of **enable_if_t** is a helper template that removes\
    \ the need for us to enter `::type` on the end of the template when we use it.\
    \ So, how does this work? Consider the following code:\n\n```\n```cpp\ntemplate\
    \ <typename T, std::enable_if_t<condition, int> = 0>\n\nvoid print(T val) { …\
    \ }\n```\n```\n\nIf the condition that is evaluated at compile time results in\
    \ **true**, then the **enable_if_t** template will result in a template that looks\
    \ like this:\n\n```\n```cpp\ntemplate <typename T, int = 0>\n\nvoid print(T val)\
    \ { … }\n```\n```\n\nThis is valid syntax and the function is added to the symbol\
    \ table as a candidate function. If the condition that is calculated at compile\
    \ time results in **false**, then the **enable_if_t** template will result in\
    \ a template that looks like this:\n\n```\n```cpp\ntemplate <typename T, = 0>\n\
    \nvoid print(T val) { … }\n```\n```\n\nThis is **malformed code** which is now\
    \ discarded – SFINAE at work.\n\n**std::is_floating_point_v<T>** is another helper\
    \ class that accesses the `::value` member of the **std::is_floating_point<T>**\
    \ template. Its name says it all – it will be true if T is a floating-point type\
    \ (float, double, long double); otherwise, it will be false. If we make this change,\
    \ then the compiler (GCC) generates the following error:\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_188_0.png)\n\
    \n*Figure 2B.15: Compiler error for the modified print template program*\n\nThe\
    \ problem now is that we have two templates that can satisfy when the type is\
    \ a float:\n\n```\n```cpp\ntemplate <typename T, std::enable_if_t<sizeof(T) ==\
    \ sizeof(int), int> = 0>\n\nvoid print(T val)\n{\n    printf(\"%d\\n\", val);\n\
    }\n```\n```"

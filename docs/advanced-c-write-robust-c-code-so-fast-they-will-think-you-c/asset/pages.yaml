  md: "To perform input/output operations, we use the POSIX interface called aio.\
    \ They have a defined set of functions such as aio_read, aio_write, aio_fsync,\
    \ and so on. They are used to initiate the asynchronous operations. To get the\
    \ result of execution, we can use signal notification or the instantiation of\
    \ a thread. Alternatively, we can choose not to be notified at all. All of them\
    \ are declared in the <aio.h> header.\n\nAlmost all of these take the aiocb structure\
    \ (asynchronous IO control block) as a parameter. It controls the IO operations.\
    \ The declaration of this structure looks as follows:\n\n```\nstruct aiocb\n{\n\
    \    int aio_fildes;\n    off_t aio_offset;\n    volatile void *aio_buf;\n   \
    \ size_t aio_nbytes;\n    int aio_reqprio;\n    struct sigevent aio_sigevent;\n\
    \    int aio_lio_opcode;\n};\n```\n\nThe aio_fildes member is a descriptor to\
    \ the opened device, while the aio_offset member is an offset in the device where\
    \ read or write operations should be done. The aio_buf member is a pointer to\
    \ the buffer to read or write from. The aio_nbytes member is the size of the buffer.\
    \ The aio_reqprio member is the priority of the execution of this IO operation.\
    \ The aio_sigevent member is a structure that points out how the calling thread\
    \ should be notified about the finish. The aio_lio_opcode member is a type of\
    \ I/O operation. The following example demonstrates how to initialize the aiocb\
    \ structure:\n\n```\nstd::string fileContent;\n\nconstexpr int BUF_SIZE = 20;\n\
    \nfileContent.resize(BUF_SIZE, 0);\n\naio cb aiocbObj;\n\naio cbObj.aio_fildes\
    \ = open(\"test.txt\", O_RDONLY);\nif (aiocbObj.aio_fildes == -1)\n{\n```"

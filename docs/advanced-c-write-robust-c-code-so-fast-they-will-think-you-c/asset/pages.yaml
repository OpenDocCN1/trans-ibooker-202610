  md: 'In the exercise, we learned how much simpler and compact our templates can
    be when using the new `constexpr if` construct in C++17.


    # Function Overloading Revisited


    When we first discussed function overloading, we only considered the scenarios
    where the name of the function came from the list of functions that we wrote by
    hand. Now, we need to update this. We can also write templated functions that
    can have the same name. Like we did previously, when the compiler meets the line
    `print(55)`, it needs to work out which of the previously defined functions to
    call. So, it performs the following process (grossly simplified):


    ![](img/6507d435e2edfa3c00c220d0ccfcaf94_196_0.png)


    # Template Type Deduction


    When we first introduced templates, we touched on Template type deduction. Now,
    we are going to explore this further. We will start by considering the general
    declaration for a function template:


    ```

    ```cpp

    template<typename T>


    void function(ParamType parameter);

    ```

    ```


    The call for this might look like this:


    ```

    ```cpp

    function(expression);              // deduce T and ParamType from expression

    ```

    ```


    When the compiler reaches this line, it must now deduce two types related to the
    template – T and **ParamType**. These are often different due to qualifiers and
    other attributes attached to the T in the ParamType (for example pointer, reference,
    const, and so on). The types are related but the deduction progresses differently,
    depending on the form of **expression** used.'

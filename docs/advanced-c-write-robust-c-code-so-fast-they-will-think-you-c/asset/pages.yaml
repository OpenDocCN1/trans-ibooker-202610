- pgno: 259
  md: 'The problem with this is that the compiler is free to order the sequence of
    operations in the argument list in any order it likes. It could call **new T**,
    then **new U**, then **std::unique_ptr<T>()**, and finally **std::unique_ptr<U>()**.
    The problem with this sequence is that if **new U** were to throw an exception,
    then the resource allocated by the call to **new T** has not been placed in a
    **unique_ptr** and will not be cleaned up automatically. The use of **std::make_unique<>()**
    guarantees the order of calls so that the construction of the resource and the
    construction of **unique_ptr** will occur together and not leak resources. The
    need for **make_unique** has been removed in C++17 where the rules around the
    order of evaluation in these circumstances have been tightened. However, it is
    still probably a good idea to use the **make_unique<T>()** approach as any future
    conversion to a **shared_ptr** will be easier.


    The name **unique_ptr** makes the intent of the template clear, that is, it is
    the only owner of the object that it points to. This was not obvious from **auto_ptr**.
    Likewise, **shared_ptr** is clear in that it intends to share the resource. The
    **unique_ptr** template provides access to the following operators:


    +   - **T* get():** Returns the pointer to the hosted resource.

    +   - **operator bool():** Returns **true** if the instance manages a resource.
    (**get() != nullptr**).

    +   - **T& operator*():** A lvalue reference to the hosted resource. Same as **\*get()**.

    +   - **T* operator->():** A pointer to the hosted resource. Same as **get()**.

    +   - **T& operator[](size_t index):** For **unique_ptr(new [])**, it provides
    access to the hosted array as if it were natively an array. Returns an **lvalue**
    reference so that the value can be set and get.


    # std::shared_ptr


    A shared pointer is used when you want to share the ownership of a resource. Why
    would you do this? Several scenarios would lend themselves well to the sharing
    of resources, such as in the case of a GUI program, where you would probably want
    to share the font objects, bitmap objects, and so on. The **GoF flyweight design
    pattern** would be another example.


    **std::shared_ptr** provides all of the same facilities as **std::unique_ptr**,
    but with more overhead because it now has to track a reference count for the object.
    All of the operators described for **std::unique_ptr** are available for use on
    **std::shared_ptr**. One difference is that the recommended method to create a
    **std::shared_ptr** is to call **std::make_shared<>()**.'

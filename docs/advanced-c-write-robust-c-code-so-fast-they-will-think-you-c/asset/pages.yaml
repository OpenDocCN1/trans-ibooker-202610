  md: "```\nBufferedWriter(const char* filename);\n~BufferedWriter();\n\nbool write(const\
    \ char* data, size_t length);\n\nprivate:\n    const size_t BufferSize{4096};\n\
    \    FILE* m_file{nullptr};\n    size_t m_writePos{0};\n    char* m_buffer{new\
    \ char[BufferSize]};\n};\n```\n\nThe class is used for buffering the writing to\
    \ the file.\n\n> Note\n> This is not usually necessary when using iostream derived\
    \ classes as they already provide buffering.\n\nEach call to the write() function\
    \ will add data into the allocated buffer until it reaches the BufferSize at which\
    \ point the data is actually written to the file and the buffer is reset.\n\n\
    But what if we wanted to assign this instance of BufferedWriter to another instance\
    \ or copy it? What is the right behavior?\n\nIf we just let the default copy constructor/copy\
    \ assignment do its their thing we get a member-wise copy of the items. This would\
    \ mean that we have two instances of BufferedWriter that hold the same handle\
    \ to the file and the pointer to the buffer. When the first instance of the object\
    \ is destroyed, being the good programmers that we are, we will clean up the file\
    \ by closing it and the memory by deleting it. The second instance now has a file\
    \ handle that is defunct and a pointer to memory that we have told the operating\
    \ system to recover for the next user. Any attempt to use these resources, including\
    \ destroying them, will result in undefined behavior and mostly likely a program\
    \ crash. The default copy constructor/copy-assignment operators execute what is\
    \ known as a shallow copy – that is, it copies all the members as they are, bit\
    \ by bit (but not what they refer to)."

- pgno: 577
  md: "In the preceding code, the elapsed time is calculated in milliseconds. Then,\
    \ we add that to the cumulative elapsed time for this block name and increment\
    \ the count of how many times this block was executed.\n\n6. Define a static function\
    \ named dump() that prints out the summary of the timed results:\n\n```\n// Print\
    \ out the stats for each measured block/function\nstatic void dump()\n{\n    cerr\
    \ << \"Name\\t\\t\\tCount\\t\\t\\tTime(ms)\\t\\tAverage(ms)\\n\";\n    cerr <<\
    \ \"-------------------------------------------------------------------------------\\\
    n\";\n    for(const auto& it: ms_Times)\n    {\n        auto iCount = ms_Counts[it.first];\n\
    \        cerr << it.first << \"\\t\\t\\t\" << iCount << \"\\t\\t\\t\" << it.second\
    \ << \"\\t\\t\\t\" << it.second / iCount << \"\\n\";\n    }\n};\n```\n\nIn the\
    \ preceding code, the name, execution count, total time, and average time is printed\
    \ in a tabular form. We use multiple tabs between the field names and field values\
    \ to make them line up vertically on a console. This function can be modified\
    \ as we wish. For example, we can modify this code to dump the output as a CSV\
    \ file, so that it can be imported into a spreadsheet for further analysis.\n\n\
    7. Finally, define the static members to complete the class:\n\n```\n// Define\
    \ static members\nmap<string, int64_t> Timer::ms_Counts;\nmap<string, int64_t>\
    \ Timer::ms_Times;\nconst int64_t N = 1'000'000'000;\n```\n\n8. Now that we have\
    \ defined the Timer class, define two simple functions that we will time as an\
    \ example. One will add and the other will multiply. Since these operations are\
    \ trivial, we will loop 1 billion times so that we can have some measurable result.\n\
    \n# Note\n\nC++ 14 and above let us use the single-quote symbol within integer\
    \ constants for readability; for example, we can write 1'000'000 rather than 1000000."

    # I/O Manipulators for Floating-Point Formatting


    In the **<ios>** header, there are declared functions for changing floating-point
    digit formatting: **std::fixed**, **std::scientific**, **std::hexfloat**, and
    **std::defaultfloat**. They are invoked without arguments and set **floatfield**
    to fixed, scientific, fixed and scientific, and default values, respectively.
    There is also the **std::showpoint** and **std::noshowpoint** functions, which
    control displaying floating-point digits. They only affect the output. The **std::noshowpoint**
    function only affects floating-point digits without the fractional part.


    In the **<iomanip>** header, there is a declared **std::setprecision** function
    that is invoked with a number that represents precision. When the digits to the
    right of the point are dropped, the result is rounded off. If the number is too
    big to be represented in the normal way, the precision specification is ignored,
    and the number is displayed in a more convenient way. You only need to set precision
    once and change it only when you need another precision. When you choose a data
    type to store a floating-point variable, you should notice some tricks. In C++,
    there are three data types that can represent floating-point values: float, double,
    and long double.'
  merge: -1
  img_proc: true
- pgno: 439
  md: "The float is usually 4 bytes, double is 8 bytes, and long double is 8, 12,\
    \ or 16 bytes. So, the precision of each of those is limited. The float type can\
    \ accommodate a maximum of 6–9 significant digits, the double type can accommodate\
    \ a maximum of 15–18 significant digits, and the long double type can accommodate\
    \ a maximum of 33–36 significant digits. Take a look at the following table if\
    \ you wish to compare the difference between them:\n\n| Type | Size in memory\
    \ | Number of significant digits |\n|---|---|---|\n| float | 4 bytes | 6–9 |\n\
    | double | 8 bytes | 15–18 |\n| long double | 8, 12, 16 bytes | 33–36 |\n\n**Figure\
    \ 6.11: Comparison table of the floating-point types**\n\n> **Note**\n> \n> When\
    \ you need precision for more than six significant digits, favor double, otherwise\
    \ you will get unexpected results.\n\nLet's complete an exercise and learn how\
    \ to use them in practice.\n\n# Exercise 5: Displaying Entered Floating-Point\
    \ Numbers with Different Formatting\n\nIn this exercise, we will write an application\

- pgno: 193
  md: "But wouldn't it be better if we could just call the following?\n\n```\nauto\
    \ total = sum(data);\n```\n\nWe can do it by making changes to the template, like\
    \ in the following code:\n\n```\ntemplate <class T, std::size_t size>\nT sum(T\
    \ (&data)[size])\n{\n    T total = 0;\n    for(auto i=0U ; i< size; i++)\n   \
    \ {\n        total += data[i];\n    }\n    return total;\n}\n```\n\nHere, we changed\
    \ the data to be a reference to an array of a certain size – a size that is passed\
    \ to the template – and so the compiler figures it out. We no longer need the\

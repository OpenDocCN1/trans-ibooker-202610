- pgno: 277
  md: 'What we really did not dig into was the concept of name lookup. At some point
    the compiler will encounter the following call to the func function:


    ```

    func(a, b);

    ```


    When this happens, it must associate its name with the declaration that introduced
    it. This process is called **name lookup**. This name lookup is true for all the
    items in the program (variables, namespaces, classes, functions, function templates,
    and templates). For the program to compile, the name lookup process for variables,
    namespaces and classes must produce a single declaration. However, for functions
    and function templates the compiler may associate multiple declarations with the
    same name – mainly through function overloads which may be extended to consider
    additional functions due to **Argument-dependent Lookup (ADL)**.


    # Identifiers


    As defined in the C++ standard, an **identifier** is a sequence of uppercase and
    lowercase Latin letters, digits, underscores, and most Unicode characters. A valid
    identifier must begin with a non-digit character and is arbitrarily long and case-sensitive.
    Every character is significant.


    # Names


    A **name** is used to refer to an entity or to a label. A name is of one of the
    following forms:


    +   - An identifier

    +   - An overloaded operator name in function notation (e.g. operator-, operator
    delete)

    +   - A template name followed by its argument list (vector<int>)

    +   - A user-defined conversion function name (operator float)

    +   - A user-defined literal operator name (operator ""_ms)


    Every entity and its name is introduced by a declaration while a name for a label
    is introduced by either a **goto** statement or by a labeled statement. A name
    can be used multiple times in one file (or translation unit) to refer to different
    entities depending on the scope. A name may also be used to refer to the same
    entity across multiple files (translation units), or different entities, depending
    upon the linkage. The compiler uses name lookup to associate a declaration that
    introduces a name with an unknown name in the program through **name lookup**.'
  merge: -1
  img_proc: true
- pgno: 278
  md: "# Name lookup\n\nThe name lookup process is one of two and is – selected based\
    \ on the context:\n\n+   - **Qualified name lookup**: The name appears to the\
    \ right of the scope resolution operator, `::`, or possibly after `::`, followed\
    \ by the **template** keyword. A qualified name may refer to a namespace member,\
    \ class member or enumerator. The name to the left of the `::` operator defines\
    \ the scope to lookup the name from. If there is no name, then the global namespace\
    \ is used.\n+   - **Unqualified name lookup**: Everything else. In this case,\
    \ name lookup examines the current scope and all enclosing scopes.\n\nIf the unqualified\
    \ name is left of the function-call operator, `()` then it uses Argument-Dependent\
    \ Lookup.\n\n# Argument-Dependent Lookup\n\nThe set of rules for looking up unqualified\
    \ function names is called **Argument-dependent lookup** (known as ADL), or **Koenig\
    \ lookup** (named after Andrew Koenig, who defined it and is a longtime member\
    \ of the C++ standards committee). Unqualified function names can appear as either\
    \ a function-call expression or as part of an implicit function call to an overloaded\
    \ operator.\n\nADL basically says that in addition to the scopes and namespaces\
    \ considered during unqualified name lookup, the \"associated namespaces\" of\
    \ all the arguments and template parameters are also considered. Consider the\
    \ following code:\n\n```\n#include <iostream>\n\n#include <string>\n\nint main()\n\
    {\n    std::string welcome{\"Hello there\"};\n    std::cout << welcome;\n    endl(std::cout);\n\
    }\n```"

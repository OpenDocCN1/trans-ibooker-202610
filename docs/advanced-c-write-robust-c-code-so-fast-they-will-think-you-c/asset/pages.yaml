- pgno: 470
  md: "There is one unusual thing in working with **ReadFile** and **WriteFile** in\
    \ asynchronous mode. They return a non-zero value if the I/O request was performed\
    \ synchronously. If they return **FALSE**, you need to invoke the **GetLastError**\
    \ function to check why **FALSE** was returned. If the error code is **ERROR_IO_PENDING**,\
    \ this means that the I/O request was successfully handled, is in a pending state,\
    \ and will be performed later.\n\nThe last thing that you should remember is that\
    \ you can't move or remove the **OVERLAPPED** object or buffer with data until\
    \ the I/O operation finishes. For each I/O operation, you should create a new\
    \ **OVERLAPPED** object.\n\nFinally, let's consider the ways in which the system\
    \ notifies us about completing the I/O operation. There are a few such mechanisms:\
    \ releasing the device, releasing the event, producing an alert, and using I/O\
    \ ports.\n\n**The \"bad\" approach:** The **WriteFile** and **ReadFile** functions\
    \ set a device to the \"occupied\" state. When the I/O operation is finished,\
    \ the driver sets a device to the \"free\" state. We can check if the finished\
    \ I/O operation is invoking the **WaitForSingleObject** or **WaitForMultipleObject**\
    \ functions. The following example demonstrates this approach:\n\n```\n```cpp\n\
    #include <Windows.h>\n\n#include <WinError.h>\n\nint main()\n{\n    HANDLE hFile\
    \ = CreateFile(TEXT(\"Test.txt\"), GENERIC_READ,\n                           \
    \    FILE_SHARE_READ | FILE_SHARE_WRITE,\n    NULL,\n                        \
    \       OPEN_ALWAYS, FILE_FLAG_OVERLAPPED,\n    NULL);\n\n    BYTE bBuffer[100];\n\
    \    OVERLAPPED o = { 0 };\n    BOOL bResult = ReadFile(hFile, bBuffer, 100, NULL,\
    \ &o);\n    DWORD dwError = GetLastError();\n\n    if (bResult && (dwError ==\
    \ ERROR_IO_PENDING))\n    {\n        WaitForSingleObject(hFile, INFINITE);\n```\n\
    ```"

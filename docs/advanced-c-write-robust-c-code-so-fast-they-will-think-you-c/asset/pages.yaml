  md: "4. To create test code, we'll create our first .cpp file, that is, TestCases.cpp.\
    \ This will contain test cases for our checkValidIp function. Write the following\
    \ code inside it:\n\n```\n#include\"CheckIp.h\"\n#include<gtest/gtest.h>\nusing\
    \ namespace std;\nconst char * testIp;\nTEST(CheckIp, testNull){\n    testIp=NULL;\n\
    \    ASSERT_FALSE(checkValidIp(testIp));\n}\nTEST(CheckIp, BadLength){\n    testIp\
    \ = \"232.13.1231.1321.123\";\n    ASSERT_FALSE(checkValidIp(testIp));\n}\n```\n\
    \nIn the second line of the preceding code, we're including the gtest.h file.\
    \ We're also calling test cases using the TEST function, which takes two parameters:\
    \ the first is the testsuite name and the second is the testcase name. For our\
    \ case, we have created TestSuite CheckIp. In the TEST block, you will see that\
    \ we have the Google test define an assert called ASSERT_FALSE that will check\
    \ if the condition is false. If it's not, it will fail the test case and show\
    \ the same in the results.\n\n# Note\n\nGenerally, for a Google test case and\
    \ test suite, you can group them in a common namespace and call the RUN_ALL_TESTS\
    \ macro, which runs all the test cases attached to test binary. For each test\
    \ case, it calls the SetUp function to initialize (like constructor in class),\
    \ then it calls the actual test case, and finally, it calls the TearDown function\
    \ (like destructor in class). It is not necessary to write the SetUp and TearDown\
    \ functions unless you have to initialize something for the test cases.\n\n5.\
    \ Now, to run the test cases, we will create the main .cpp file for the test cases\
    \ and call the RUN_ALL_TESTS macro. Alternatively, we can create an executable\
    \ by linking the Google Test library that invokes RUN_ALL_TESTS. For our case,\
    \ we will do the latter. Open the terminal and run the following command to create\
    \ a test run binary:\n\n```\ng++ -c CheckIp.cpp\n```\n\nThis will include the\
    \ object file of CheckIp.cpp since the CheckValidIp function is defined in it."

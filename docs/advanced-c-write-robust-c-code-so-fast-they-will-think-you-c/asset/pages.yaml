    bool checkValidIp(const char *);

    #endif

    ```

    ```


    In the preceding code, we wrote a function named **checkValidIp()** to check if
    the **IP address** is valid. Again, just to understand the **Google unit test**,
    we will write minimal code to understand the feature.'

  md: '# Activity 1: Graphics Processing


    In a modern computing environment, matrices are used everywhere to solve various
    problems – to solve simultaneous equations, to analyze electricity power grids
    or electric circuits, to perform manipulations on objects for graphics rendering,
    and to deliver implementations of machine learning. In the world of graphics,
    whether two-dimensional (2D) or three-dimensional (3D), all the operations that
    you would want to perform on your objects can be done with the help of matrix
    multiplication. Your team has been tasked with developing a representation of
    points, transformation matrices, and the operations that you might want to perform
    on them. Follow these steps to achieve this:


    +   1. Load the prepared project from the **Lesson2A/Activity01** folder.

    +   2. Create a class called **Point3d** that can be constructed by default to
    be the origin, or using an initializer list of three or four values (data is stored
    directly in the class).

    +   3. Create a class called **Matrix3d** that can be constructed by default to
    an identity matrix, or using a nested initializer list to provide all the values
    (data is stored directly in the class).

    +   4. On **Point3d**, overload **operator()** so that it takes the **(index)**
    argument in order to return the value at **x(0), y(1), z(2), and w(3)**.

    +   5. On **Matrix3d**, overload **operator()** to take **(row, col)** arguments
    so that it returns the value.

    +   6. Add the unit tests to verify all of the aforementioned features.

    +   7. Add **operator*=(const Matrix3d&)** and **operator==(const Matrix3d&)**
    to the **Matrix3d** class, as well as the unit tests for them.

    +   8. Add free functions for multiplying two **Matrix3d** objects and a **Matrix3d**
    object by a **Point3d** object with unit tests.

    +   9. Add standalone methods for creating a matrix to translate, scale, and rotate
    (around the x, y, z axes) and their unit tests.'

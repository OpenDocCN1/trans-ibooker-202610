    \nSo, the type is deduced to be **int**. Likewise, we get exactly the same error\
    \ if we declare the following:\n\n```\nconst int x = 42;\n\nfunction(x);\n```\n\
    \nThe same will happen if we declare this version:\n\n```\nint x = 42;\n\nconst\
    \ int& rx = x;\n\nfunction(rx);\n```\n\nIn all three cases, the deduced type is\
    \ **int**, as per the rules stated previously.\n\n# Case 2: ParamType is pass-by-reference\

- pgno: 191
  md: "# Constexpr if Expressions\n\nC++17 introduced the constexpr if expression\
    \ to the language, which simplifies template writing greatly. We can rewrite the\
    \ preceding three templates that use SFINAE as one simpler template:\n\n```\n\
    #include <iostream>\n\n#include <type_traits>\n\ntemplate <typename T>\nvoid print(T\
    \ val)\n{\n    if constexpr(sizeof(T)==1) {\n        printf(\"%c\",val);\n   \
    \ }\n    else if constexpr(std::is_integral_v<T>) {\n        printf(\"%d\",val);\n\
    \    }\n    else if constexpr(std::is_floating_point_v<T>) {\n        printf(\"\
    %f\",val);\n    }\n    printf(\"\\n\");\n}\n\nint main(int argc, char** argv)\n\
    {\n    print('c');\n    print(55);\n    print(32.1F);\n    print(77.3);\n}\n```"

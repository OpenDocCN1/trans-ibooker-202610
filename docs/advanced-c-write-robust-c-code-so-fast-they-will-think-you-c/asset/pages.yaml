  md: "# I/O Manipulators for Boolean Formatting\n\nIn the <ios> header, there are\
    \ declared functions for changing boolean formatting: std::boolalpha and std::noboolalpha.\
    \ They are invoked without arguments and allow us to display boolean values in\
    \ textual or digital ways, respectively. They are used for both input and output\
    \ operations. Let's consider an example of using these I/O manipulators for output\
    \ operations. We will display the Boolean both as text and as a digit:\n\n```\n\
    std::cout << \"Default formatting of bool variables: \"\n    << \"true: \" <<\
    \ true\n    << \", false: \" << false << std::endl;\n```\n\n```\nstd::cout <<\
    \ \"Formatting of bool variables with boolalpha flag is set: \"\n    << std::boolalpha\n\
    \    << \"true: \" << true\n    << \", false: \" << false << std::endl;\n```\n\
    \n```\nstd::cout << \"Formatting of bool variables with noboolalpha flag is set:\
    \ \"\n    << std::noboolalpha\n    << \"true: \" << true\n    << \", false: \"\
    \ << false << std::endl;\n```\n\nAfter compiling and running this example, you\
    \ will get the following output:\n\n```\nDefault formatting of bool variables:\
    \ true: 1, false: 0\nFormatting of bool variables with boolalpha flag is set:\
    \ true: true, false: false\nFormatting of bool variables with noboolalpha flag\
    \ is set: true: 1, false: 0\n```"

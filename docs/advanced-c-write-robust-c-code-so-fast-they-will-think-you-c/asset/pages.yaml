  md: "```\ndelete m_ptr;\n\n// Transfer the resource\nm_ptr = a.m_ptr;\na.m_ptr =\
    \ nullptr;  // Put into safe state\nreturn *this;\n}\n```\n\nAfter re-running\
    \ our program, we get the following output:\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_256_0.png)\n\
    \nFigure 3.24: Smart pointer program output using move semantics\n\nNow, because\
    \ move assignment is now available, the compiler uses it on this line:\n\n```\n\
    the_res = createResource(); // assignment invokes the copy assignment Step 3/4\n\
    ```\n\nStep 3 is now replaced with move assignment, meaning the deep copy has\
    \ now been removed.\n\nStep 4 no longer frees the resource because the line with\
    \ the comment \"//\" puts into a safe state – it no longer has a resource to free\
    \ because its ownership was transferred.\n\nAnother point to note with the move\
    \ constructor and move assignment is that where the arguments were const for their\
    \ copy versions, they were non-const for their move versions. This is called the\
    \ transfer of ownership, which means that we need to modify the parameter that\
    \ is passed in.\n\nAn alternative implementation of the move constructor may look\
    \ like the following:\n\n```\n// Move constructor --> transfer resource\nsmart_ptr(smart_ptr&&\
    \ a)\n{\n    std::swap(this->m_ptr, a.m_ptr);\n}\n```\n\nEssentially, we are swapping\
    \ the resource, and the C++ STL has support for swap as a template with many specializations.\
    \ This works because we used member initialization to set m_ptr to nullptr. So,\
    \ we are swapping a nullptr with the value stored in a."

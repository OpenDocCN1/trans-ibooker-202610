  md: 'If we consider the multiplication of two matrices, A (m x n) and B (n x p),
    which results in matrix C (m x p), then the equation for the ith row and jth column
    of C is as follows:


    cᵢⱼ = Σₖ₌₁ⁿ aᵢₖ bₖⱼ


    Figure 2A.31: Equation of ith row and jth column


    If we had to write it every time we wished to multiply two matrices, we would
    end up with many nested for loops. But if we could abstract a matrix into a class,
    then we could express it as simple as we express the multiplication of two integers
    or two floating-point numbers:


    ```

    Matrix a;


    Matrix b;


    // Code to initialize the matrices


    auto c = a * b;

    ```


    This is the beauty of object-oriented design – data encapsulation and the abstraction
    of concepts are explained at such a level that we can easily understand what the
    program is trying to achieve without getting buried in the details. Once we have
    established that the matrix multiplication is correctly implemented, then we are
    free to focus on solving our problem at a higher level.


    The discussion that follows refers to classes, but it applies equally to structs
    and, mostly, to unions. We will outline the differences between classes, structs,
    and unions after we learn how to define and use a class.


    # Fraction Class


    To show you how to define and use a class, we will work on developing the Fraction
    class to implement rational numbers. When defined, we can use Fraction like any
    other built-in type (add, subtract, multiply, divide) without worrying about the
    details – this is abstraction. We can now just think and reason about a fraction
    at a higher level, that is, an abstract level.


    The Fraction class will do the following:


    +   - Contain two integer member variables, m_numerator and m_denominator

    +   - Provide methods to copy itself, assign to it, multiply, divide, add, and
    subtract

    +   - Provide a method to write to an output stream'

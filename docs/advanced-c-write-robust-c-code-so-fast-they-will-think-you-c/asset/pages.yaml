  md: "Now that we've gone over the bad, let's look at the best approach for handling\
    \ I/O results – I/O ports. The I/O completion ports are developed to be used with\
    \ thread pools. To create such a port, we use CreateIoCompletionPort. The declaration\
    \ of this function looks as follows:\n\n```\nHANDLE\nCreateIoCompletionPort(HANDLE\
    \ hFile,\n    HANDLE hExistingCompletionPort,\n    ULONG_PTR CompletionKey,\n\
    \    DWORD dwNumberOfConcurrentThreads);\n```\n\nThis function creates an I/O\
    \ completion port and associates the device with this port. To complete this action,\
    \ we need to call it twice. To create the new completion port, we invoke the CreateIoCompletionPort\
    \ function and pass INVALID_HANDLE_VALUE as the first parameter, NULL as a second\
    \ parameter, 0 as a third parameter, and pass the number of the threads for this\
    \ port. Passing 0 as the fourth parameter will set the number of threads equal\
    \ to the number of processors.\n\n> Note\n> \n> For the I/O completion port, it\
    \ is recommended to use the number of threads that is equal to the number of processors,\
    \ multiplied twice.\n\nNext, we need to associate this port with the input/output\
    \ device. So, we invoke the CreateIoCompletionPort function for the second time\
    \ and pass a descriptor of the device, a descriptor of the created completion\
    \ port, the constant that will indicate reading or writing to the device, and\
    \ 0 as the number of threads. Then, when we need to get the result of completion,\
    \ we call GetQueuedCompletionStatus from our port descriptor. If the operation\
    \ completes, the function returns a result immediately. If it doesn't, then the\
    \ thread waits to complete. The following example demonstrates this approach:\n\
    \n```\n#include <Windows.h>\n\n#include <synchapi.h>\n\nint main()\n{\n    HANDLE\
    \ hFile = CreateFile(TEXT(\"Test.txt\"), GENERIC_READ,\n        FILE_SHARE_READ\
    \ | FILE_SHARE_WRITE,\n```"

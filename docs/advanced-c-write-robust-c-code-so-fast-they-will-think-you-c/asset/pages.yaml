  md: '# Activity 1: Checking the Accuracy of the Functions Using Test Cases and Understanding
    Test-Driven Development (TDD)


    In this activity, we''ll be developing functions so that we can parse files and
    then write test cases to check the correctness of the functions we''ve developed.


    An IT team in a big retail organization wants to keep track of product sales by
    storing Product details and Customer details in its database as part of its reconciliation.
    On a periodic basis, the sales department will provide this data to the IT team
    in a simple text format. As the developer, you need to ensure that the basic sanity
    checking of data is done and that all the records are parsed correctly before
    the company stores records in the database. The sales department will provide
    two text files that hold Customer information and Currency information for all
    the sales transactions. You need to write parsing functions to process these files.
    The two files are RecordFile.txt and CurrencyConversion.txt. The RecordFile.txt
    file contains details of the customer, the products they have purchased, and the
    total price in regional currency and foreign currency. The CurrencyConversion.txt
    file contains two fields, namely Currency and ConversionRatio.


    All the necessary information for the environment''s setup for this project is
    kept in the Configuration file. This will also hold filenames, along with other
    parameters (such as DB, RESTAPI, and so on) and variable values in a file called
    parse.conf. It will contain two fields per line separated by the "=" delimiter.
    The first line will be a header that states "CONFIGURATION_FILE". For the Record
    file, the variable name is recordFile and similarly for the Currency file, the
    variable name is currencyFile.


    The following are the test conditions we''ll be writing to check the accuracy
    of the function that''s used to parse the CurrencyConversion.txt file:


    +   - The first line should be the header line and its first field should contain
    the "Currency" string.

    +   - The Currency field should be made up of three characters. For example: "USD",
    "GBP" is valid.

    +   - The ConversionRatio field should be made of floating-point numbers. For
    example, 1.2, 0.06 is valid.

    +   - There should be exactly two fields for each line.

    +   - The delimiter that''s used for the record is "|".'

  md: "# Exercise 2: Reading and Writing User-Defined Data Types to a File\n\nIn this\
    \ exercise, we'll write a piece of code for a book shop. We need to store information\
    \ about book prices in a file and then read that information from a file when\
    \ needed. To implement this, we will create a class that represents a book with\
    \ a name, author, year of publishing, and a price. Next, we will create an instance\
    \ of this class and write it to a file. Later, we will read the information about\
    \ the book from the file into the instance of the book class. Perform the following\
    \ steps to complete this exercise:\n\n+   1. Include the required headers: **`<iostream>`**\
    \ for output to a console, **`<string>`** for string support, and **`<fstream>`**\
    \ for I/O file library support:\n\n```\n```cpp\n#include <fstream>\n#include <iostream>\n\
    #include <string>\n```\n```\n\n+   2. Implement the **Book** class, which represents\
    \ the book in a book shop. In the private section, define four variables with\
    \ self-explanatory names: **m_Name**, **m_Author**, **m_Year**, and **m_Price**.\
    \ In the public section, define a constructor with parameters, which initializes\
    \ all class members. Also, in the **public** section, define getters for all the\
    \ class members:\n\n```\n```cpp\nclass Book\n{\npublic:\n    Book(const std::string&\
    \ name,\n         const std::string& author,\n         const int year,\n     \
    \    const float price)\n        : m_Name(name)\n        , m_Author(author)\n\
    \        , m_Year(year)\n        , m_Price(price) {}\n\n    std::string getName()\
    \ const { return m_Name; }\n    std::string getAuthor() const { return m_Author;\
    \ }\n    int getYear() const { return m_Year; }\n```\n```"

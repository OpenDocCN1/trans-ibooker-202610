- pgno: 148
  md: "So far, for our Fraction class, we have written out the numerator and denominator\
    \ values by accessing the data values from outside using the getNumerator() and\
    \ getDenominator() methods, but there is a better way to do this. As part of making\
    \ our classes first-class citizens in C++, where it makes sense, we should overload\
    \ the I/O operators. In this chapter, we will only look at the output operator,\
    \ <<, also known as the insertion operator. That way, we can replace the previous\
    \ code with a much cleaner version:\n\n```\nstd::cout << \"fraction = \" << fraction\
    \ << \"\\n\";\n```\n\nWe can overload the operator as either a friend function\
    \ or a normal function (if the class provides getter functions of the data that\
    \ we need to insert). For our purpose, we define it as a normal function:\n\n\
    ```\ninline std::ostream& operator<< (std::ostream &out, const Fraction &rhs)\n\
    {\n    out << rhs.getNumerator() << \" / \" << rhs.getDenominator();\n    return\
    \ out;\n}\n```\n\n# Structuring Our Code\n\nBefore we delve into the exercise\
    \ where we implement the operators and turn our Fraction into a full-blown type\
    \ in the C++ world, we need to have a brief discussion about where we put the\
    \ bits and pieces of our class – the declaration and the definition. The declaration\
    \ is the blueprint for our class that indicates what data storage it requires\
    \ and the methods that it will implement. The definition is the actual implementation\
    \ details of each of the methods.\n\nIn languages such as Java and C#, the declaration\
    \ and the definition are one and the same and they must exist in one file (Java)\
    \ or across multiple files (C# partial classes). In C++, depending on the class\
    \ and how much you wish to expose to other classes, the declaration MUST appear\
    \ in a header file (which can be #included in other files for use) and the definition\
    \ can appear in one of three places – inline in the definition, inline in the\
    \ same file as the definition, or in a separate implementation file.\n\nThe header\
    \ file is usually named with the .hpp extension, while the implementation file\
    \ is typically one of *.cpp or *.cxx. The implementation file is also known as\
    \ a translation unit. By defining a function as inline, we allow the compiler\
    \ to optimize the code in a way that the function may not even exist in the final\
    \ program – it has substituted the steps we put into the function into the locations\
    \ that we call the function from."
  merge: -1

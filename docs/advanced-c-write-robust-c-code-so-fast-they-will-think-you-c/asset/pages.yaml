- pgno: 371
  md: 'Difficulties will arise if **Thread C** executes before threads A and B. This
    leads to **Thread B** reads the value that it is not expected to be read. The
    order of the execution of threads should be strictly guaranteed. **Thread C**
    must write a new value to a variable, but only after **Thread A** has written
    its value and **Thread B** has read it. The following diagram will help you clarify
    the WAW data dependency that leads to data hazards:


    ![](img/6507d435e2edfa3c00c220d0ccfcaf94_371_0.png)


    Figure 5.13: WAW data dependency between two threads


    # Resource Synchronization


    To prevent races and data hazards, there is a shared data locking mechanism where
    one of the streams intends to change or read these data. This mechanism is called
    **resource synchronization**. For synchronization, we need to allocate pieces
    of code that change or read shared resources. Such pieces of code are called **critical
    sections**. Synchronization consists of blocking critical sections when one of
    the threads enters it. Other threads that also intend to execute the code of this
    critical section will be blocked. When the thread executing the critical section
    leaves it, the lock is released. Then, the story will repeat with the next thread.'

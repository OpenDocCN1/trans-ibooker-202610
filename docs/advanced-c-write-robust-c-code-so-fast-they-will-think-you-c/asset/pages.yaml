- pgno: 258
  md: "# std::unique_ptr\n\n`std::unique_ptr()` was introduced in C++ 11 to replace\
    \ `std::auto_ptr()` and gives us everything that `smart_ptr` does (and more).\
    \ We can re-write our `smart_ptr` program as follows:\n\n```\n```cpp\n#include\
    \ <iostream>\n\n#include <memory>\n\nclass Resource\n{\npublic:\n    Resource()\
    \ { std::cout << \"Resource acquired\\n\"; }\n    ~Resource() { std::cout << \"\
    Resource released\\n\"; }\n};\n\nstd::unique_ptr<Resource> createResource()\n\
    {\n    std::unique_ptr<Resource> res(new Resource);\n    return res;\n}\n\nint\
    \ main()\n{\n    std::unique_ptr<Resource> the_res;\n    the_res = createResource();\
    \ // assignment invokes the copy assignment\n    return 0;\n}\n```\n```\n\nWe\
    \ can go one step further than this, because C++ 14 introduced a helper method\
    \ to ensure exception safety when dealing with `unique_ptr`s:\n\n```\n```cpp\n\
    std::unique_ptr<Resource> createResource()\n{\n    return std::make_unique<Resource>();\n\
    }\n```\n```\n\nWhy is this necessary? Consider the following function call:\n\n\
    ```\n```cpp\nsome_function(std::unique_ptr<T>(new T), std::unique_ptr<U>(new U));\n\
    ```\n```"
  merge: -1

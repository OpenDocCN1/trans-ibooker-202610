- pgno: 251
  md: 'The two resources that we have can be treated differently. Firstly, there should
    only be one class that owns the m_buffer. There are two options in dealing with
    this:


    +   - Prevent the copy of the class and hence the memory

    +   - Perform a deep copy where the buffer in the second instance has been allocated
    by the constructor and the contents of the first buffer is copied


    Secondly, there should only be one class that owns the file handle (m_file). There
    are two options in dealing with this:


    +   - Prevent the copy of the class and hence the file handle

    +   - Transfer the ownership from the original instance to the second instance
    and mark the original as invalid or empty (whatever that means)


    It is easy enough to implement a deep copy, but how do we transfer ownership of
    a resource? To answer this question, we need to look at temporary objects and
    value categories again.


    # Temporary Objects


    A temporary object is created to store the intermediate results of an expression
    before the result is deposited into a variable (or just forgotten). An expression
    is any code that returns a value, including passing by value to a function, returning
    a value from a function, implicit conversion, literals, and binary operators.
    Temporary objects are rvalue expressions and they have memory, temporarily allocated
    for them as a location, to place the expression result. It is this creation of
    temporaries and copying data between them that caused some performance issues
    prior to C++11. To address this issue, C++11 introduced rvalue references to enable
    what is known as move semantics.


    # Move Semantics


    An rvalue reference (denoted by a double ampersand, ''&&'') is a reference that
    is only assigned an rvalue that will extend the rvalue''s lifetime until the rvalue
    reference is done with it. So, rvalues can live beyond the expression that defined
    it. With rvalue references, we can now implement move semantics through the move
    constructor and move assignment operators. The purpose of move semantics is to
    steal resources from the referenced object and thus avoid the expensive copy operations.
    When the move is complete, the referenced object must be left in a stable state.
    In other words, the object that was moved from must be left in a state that will
    not cause any undefined behavior or a program crash when it is destroyed, nor
    should it affect the resources that were stolen from it.'

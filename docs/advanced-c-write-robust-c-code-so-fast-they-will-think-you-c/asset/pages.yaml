- pgno: 276
  md: 'The following mechanisms result in calls to a function:


    +   - Explicit call to a function.

    +   - All operators such as +, -, *, /, %, and so on along with new/delete.

    +   - Declaration of variables – will result in a call to the constructors with
    arguments if the initialization values are present.

    +   - User-defined literals – We have not dealt with these, but essentially, we
    define an overload for the type operator "" name(argument). We can then write
    things such as 10_km, which make our code easier to understand as it carries semantic
    information.

    +   - Casting from one value to another (static_cast<>, const_cast<>, reinterpret_cast<>,
    and dynamic_cast<>). Again, we have another operator overload which allows us
    to convert from one type into another.

    +   - During function overload, it may be necessary to convert one type into another
    so that it matches the function prototype. It can do this by either calling a
    constructor with the right argument type to create a temporary or through a cast
    operator that''s called implicitly.


    Each and every one of these results in the compiler determine that a function
    must be called. Having determined that a function needs to be called, it must
    find the function that matches the name and arguments. This is what we''ll be
    discussing in the next section.


    # Which Function to Call


    In Chapter 2A, No Ducks Allowed – Types and Deduction, we saw that function overload
    resolution was performed as follows:


    ![](img/6507d435e2edfa3c00c220d0ccfcaf94_276_0.png)'

  md: "# Function Overloading\n\nC++ supports a feature known as function overloading,\
    \ which is where two or more functions have the same name, but their argument\
    \ list is different. The number of arguments can be the same, but at least one\
    \ of the argument types has to be different. Alternatively, they may have a different\
    \ number of arguments. So, the function prototype for the multiple functions are\
    \ different. However, two functions cannot have the same function name, the same\
    \ argument types, and a different return type. The following is an example of\
    \ overloading:\n\n```\nstd::ostream& print(std::ostream& os, int value) {\n  \
    \  os << value << \" is an int\\n\";\n    return os;\n}\n\nstd::ostream& print(std::ostream&\
    \ os, float value) {\n    os << value << \" is a single precision float\\n\";\n\
    \    return os;\n}\n\nstd::ostream& print(std::ostream& os, double value) {\n\
    \    os << value << \" is a double precision float \\n\";\n    return os;\n}\n\
    \n// The next function causes the compiler to generate an error\n// as it only\
    \ differs by return type.\nvoid print(std::ostream& os, double value) {\n    os\
    \ << value << \" is a double precision float!\\n\";\n}\n```"
  merge: -1
  img_proc: true

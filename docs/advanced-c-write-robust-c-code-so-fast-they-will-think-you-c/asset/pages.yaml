    \ &o, INFINITE);\n\n    CloseHandle(hFile);\n\n    return 0;\n}\n```\n\n# Asynchronous\
    \ I/O on Linux Platforms\n\nThe asynchronous I/O on Linux supports input and output\
    \ to different devices such as sockets, pipes, and TTYs, except files. Yes, this\
    \ is pretty strange, but Linux developers decided that I/O operations with files\
    \ are fast enough.\n\nTo open an I/O device, we use the open() function. It has\
    \ the following declaration:\n\n```\nint open (const char *filename, int flags[,\
    \ mode_t mode])\n```\n\nThe first parameter is a filename, while the second parameter\
    \ is a bitmask that controls how the file should be opened. If the system cannot\
    \ open the device, open() returns a value of -1. In the case of success, it returns\
    \ a device descriptor. The possible flags for open mode are O_RDONLY, O_WRONLY,\
    \ and O_RDWR."

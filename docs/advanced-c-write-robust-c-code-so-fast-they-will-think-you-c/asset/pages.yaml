- pgno: 197
  md: "# Displaying the Deduced Types\n\nBefore we look into the different forms,\
    \ it might be useful if we could get the compiler to tell us the types that it\
    \ has deduced. We have a few options here, including the IDE editors showing types,\
    \ the compiler generating errors, and runtime support (which, due to the C++ standard,\
    \ is not necessarily effective). We will use the compiler errors to help us explore\
    \ some of the type deductions.\n\nWe can achieve a type displayer by declaring\
    \ a template without a definition. Any attempt to instantiate the template will\
    \ cause the compiler to generate an error message as there is no definition, along\
    \ with the type information that it is trying to instantiate:\n\n```\n```cpp\n\
    template<typename T>\nstruct TypeDisplay;\n```\n```\n\nLet's attempt to compile\

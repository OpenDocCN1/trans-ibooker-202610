  img_proc: true
- pgno: 95
  md: "# C++ Types\n\nAs a strongly and statically typed language, C++ provides several\
    \ fundamental types and the ability to define their own types with as much or\
    \ as little functionality as needed to solve the problem at hand. This section\
    \ will start by introducing the fundamental types, initializing them, declaring\
    \ a variable, and associating a type with it. We will then explore how to declare\
    \ and define a new type.\n\n# C++ Fundamental Types\n\nC++ includes several *fundamental\
    \ types*, or *built-in types*. The C++ standard defines the minimum size in memory\
    \ for each type and their relative sizes. The compiler recognizes these fundamental\
    \ types and has built-in rules that define what operations can and cannot be performed\
    \ on them. There are also rules for implicit conversions between types; for example,\
    \ conversion from an int type to a float type.\n\n> **Note**\n> \n> See the **Fundamental\
    \ Types** section at https://en.cppreference.com/w/cpp/language/types for a brief\
    \ description of all the built-in types.\n\n# C++ Literals\n\nC++ literals are\
    \ used to tell the compiler the values that you wish to associate with a variable\
    \ either when you declare it or when you assign to it. Each of the built-in types\
    \ in the previous section has a form of literal associated with it.\n\n> **Note**\n\
    > \n> See the **Literals** section at https://en.cppreference.com/w/cpp/language/expressions\
    \ for a brief description of the literals for each type."
  merge: -1
  img_proc: true
- pgno: 96
  md: "# Specifying Types – Variables\n\nAs C++ is a statically typed language, it\
    \ is necessary to specify the type of a variable when it is declared. When you\
    \ declare a function, it is necessary to specify the return type and the types\
    \ of arguments that are being passed to it. There are two choices for specifying\
    \ the type to a variable when you declare it:\n\n+   - **Explicitly**: You, as\
    \ the programmer, are dictating exactly what the type is.\n+   - **Implicitly**\
    \ (using auto): You are telling the compiler to look at the value that was used\
    \ to initialize the variable and determine its type. This is known as (auto) type\
    \ deduction.\n\nThe general form of declaration for a scalar variable is one of\
    \ the following:\n\n```\ntype-specifier var;                 // 1. Default-initialized\
    \ variable\ntype-specifier var = init-value;    // 2. Assignment initialized variable\n\
    type-specifier var{init-value};     // 3. Brace-initialize variable\n```\n\n**type-specifier**\
    \ indicates what type (fundamental or user-defined) you wish to associate with\
    \ the **var** variable. All three forms result in the compiler allocating some\
    \ storage to hold the value in, and all future references to **var** will refer\
    \ to that location. **init-value** is used to initialize the storage location.\
    \ Default initialization does nothing for built-in types and will call the constructor\
    \ of a user-defined type according to the function overloading resolution to initialize\
    \ the storage.\n\nThe compiler must know how much memory to allocate and provides\
    \ an operator to determine how large a type or variable is – **sizeof**.\n\nBased\
    \ on our declarations, the compiler will set aside space in the computer's memory\
    \ to store the data item that the variable refers to. Consider the following declarations:\n\
    \n```\nint value = 42;      // declare value to be an integer and initialize to\
    \ 42\nshort a_value{64};   // declare a_value to be a short integer and initialize\n\
    \                     //     to 64\nint bad_idea;        // declare bad_idea to\
    \ be an integer and DO NOT\n                     // initialize it. Use of this\
    \ variable before setting\n                     // it is UNDEFINED BEHAVIOUR.\n\
    float pi = 3.1415F;  // declare pi to be a single precision floating point\n \
    \                    // number and initialize it to pi.\n```"
  merge: -1
  img_proc: true
- pgno: 97
  md: '```

    double e{2.71828};  // declare e to be a double precision floating point

    // number and initialize it to natural number e.

    auto title = "Sir Robin of Loxley"; // Let the compiler determine the type

    ```


    If these are declared within the scope of a function, then the compiler allocates
    the memory for them from what is known as the stack. The memory layout for this
    may look something like the following:


    ![](img/6507d435e2edfa3c00c220d0ccfcaf94_97_0.png)


    Figure 2A.1: Memory layout of variables


    The compiler will allocate the memory in the order we declare the variables. The
    unused memory occurs because the compiler allocates the memory so that the fundamental
    types are generally accessed atomically and are aligned to the appropriate memory
    boundaries for efficiency. Note that title is of the const char * type, which
    is a pointer that we''ll discuss next, along with const. The "Sir Robin of Loxley"
    string will be stored in a different part of memory that is initialized when the
    program is loaded. We will discuss program memory later.


    A slight modification of the scalar declaration syntax gives us the syntax for
    declaring arrays of values:


    ```

    type-specifier ary[count];                         // 1. Default-initialized

    type-specifier ary[count] = {comma-separated list}; // 2. Assignment initialized

    type-specifier ary[count]{comma-separated list};     // 3. Brace-initialized

    ```


    This can be done for multi-dimensional arrays like so:


    ```

    type-specifier ary2d[countX][countY];

    type-specifier ary3d[countX][countY][countZ];

    // etc...

    ```'

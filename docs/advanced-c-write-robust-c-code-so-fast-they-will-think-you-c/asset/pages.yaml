- pgno: 423
  md: 'Input, output, and bidirectional file streams can also be opened in different
    modes by using flags. They are declared in the ios_base namespace. Besides the
    ios_base::in and ios_base::out flags, we also have the ios_base::ate, ios_base::app,
    ios_base::trunc, and ios_base::binary flags. The ios_base::trunc flag removes
    the content of the file. The ios_base::app flag always writes the output to the
    end of the file. Even if you decide to change the position in the file, you cannot
    do this. The ios_base::ate flag sets the position of the file descriptor to the
    end of the file but allows you to modify the position later. Finally, the ios_base::binary
    flag suppresses any formatting of the data so that it''s read or wrote in "raw"
    format. Let''s consider all the possible combinations of open modes.


    By default, std::ofstream is opened in ios_base::out mode, std::ifstream is opened
    in ios_base::in mode, and std::fstream is opened in ios_base::in|ios_base::out
    mode. The ios_base::out|ios_base::trunc mode creates the file if it doesn''t exist
    or removes all the content from the existing file. The ios_base::out|ios_base::app
    mode creates the file if it doesn''t exist or opens the existing file and allows
    you to write only at the end of the file. Both of the aforementioned modes can
    be combined with the ios_base::in flag, so the file will be opened in read and
    write mode simultaneously.


    Here is an example of how to open the file using the aforementioned modes:


    ```

    std::ofstream outFile(filename, std::ios_base::out|std::ios_base::trunc);

    ```


    You can also do the following:


    ```

    std::ofstream outFile;


    outFile.open(filename, std::ios_base::out|std::ios_base::trunc);

    ```


    After we''ve opened the file stream in the required mode, we can start reading
    or writing to a file. The file streams allow us to change our position in the
    file. Let''s consider how we can do this. To get the current file''s position,
    we can call the tellp() function in ios_base::out mode and the tellg() function
    in ios_base::in mode. It can be used later so that we can return to this position
    if needed. We can also find the exact position in a file by using the seekp()
    function in ios_base::out mode and the seekg() function in ios_base::in mode.
    It takes two parameters: the number of characters to shift and from which file
    position it should count. There are allowed three types of positions to seek:
    std::ios_base::beg, that is, the beginning of file, std::ios_base::end, that is,
    the end of file, and std::ios_base::cur, that is, the current position. Here is
    an example of calling the seekp() function:


    ```

    outFile.seekp(-5, std::ios_base::end);

    ```


    As you can see, we ask to set the current file''s position at the fifth character
    from the end of the file.'

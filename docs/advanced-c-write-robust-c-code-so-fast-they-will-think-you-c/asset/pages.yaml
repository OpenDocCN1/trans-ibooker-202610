  md: "If you run this code in your IDE, you will see the following output:\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_399_0.png)\n\
    \nFigure 5.19: The result of an example's execution\n\nWe can see that std::terminate()\
    \ was called after throwing an exception. When you have lots of threads in your\
    \ program, it's very hard to find the right place where the thread was terminated.\
    \ Fortunately, we have a few mechanisms for catching an exception from another\
    \ thread. Let's consider them all.\n\nThe std::async function uses future results\
    \ for transferring exceptions to the calling thread. It stores std::exception_ptr\
    \ in the future result and sets the ready flag. Then, when you call get(), std::future\
    \ checks if there any std::exception_ptr stored and rethrows the exception. All\

  md: '# Introduction


    In *Chapter 2A, No Ducks Allowed – Types, and Deduction*, we briefly touched on
    some concepts, such as smart pointers and move semantics. In this chapter, we''ll
    be exploring them further. It turns out that these topics are very closely related
    to resource management and writing robust code (code that will run often and for
    long periods without problems).


    To understand what happens, we are going to explore where variables get placed
    in memory, as well as when and what happens when they go out of scope.


    We will look at what the compiler generates as assembler code for what we enter,
    and we will explore how all of this is affected when an exception occurs.


    # Variable Scope and Lifetime


    In *Chapter 2B, No Ducks Allowed – Templates, and Deduction*, we discussed variable
    scope and lifetimes. Let''s quickly go through their different types:


    # Scope:


    +   - **Local scope** (also known as **block scope**): This applies to anything
    that''s declared within a block that is enclosed within curly braces (`{}`).

    +   - **Global / file scope**: This applies to variables declared outside a normal
    function or a class, and also to the normal functions.


    # Lifetime:


    +   - **Automatic lifetime**: Here, the local variables are created when they
    are declared, and destroyed when they exit the scope that they are in. These are
    managed by the stack.

    +   - **Permanent lifetime**: Here, the global and static local variables have
    a permanent lifetime.

    +   - **Dynamic lifetime**: Here, the variables are created and destroyed at the
    request of the programmer (using the `new` and `delete operators`). These variables
    have their memory allocated from the heap.'

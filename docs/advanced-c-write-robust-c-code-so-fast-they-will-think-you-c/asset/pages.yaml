- pgno: 429
  md: '# String I/O Implementation


    The I/O Standard Library allows input and output – not only to devices such as
    files but also to memory, in particular, to the std::string objects. In this case,
    the string can be a source for input operations as well as a sink for output operations.
    In the <sstream> header file, stream classes are declared that manage input and
    output to strings. They, like the file streams, also provides an interface that
    implements RAII – the string opens for reading or writing upon the stream''s creation
    and closes on its destruction. They are represented in the Standard Library by
    the following classes: basic_stringbuf, which implements a raw string interface,
    basic_istringstream for input operations, basic_ ostringstream for output operations,
    and basic_stringstream for both input and output operations. The Standard Library
    also provides typedefs for char and wchar_t types: istringstream, ostringstream,
    and stringstream and the same names with the "w" prefix for wide characters.


    To create an object of the std::istringstream class, we should pass the initializer
    string as a constructor parameter or set it later using the str() function:


    ```

    std::string track("ABBA 1967 Vule");

    std::istringstream iss(track);

    ```


    Alternatively, we can do the following:


    ```

    std::string track("ABBA 1967 Vule");

    std::istringstream iss;

    iss.str(track);

    ```


    Next, to read values from the stream, use the right shift operator, >>, which
    is overloaded for all built-in types:


    ```

    std::string group;

    std::string name;

    int year;


    iss >> group >> year >> name;

    ```


    To create an object of the std::ostringstream class, we just declare a variable
    of its type:


    ```

    std::ostringstream oss;

    ```'

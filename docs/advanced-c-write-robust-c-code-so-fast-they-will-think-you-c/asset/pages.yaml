    Since C++ 11, all constructors (except copy and move constructors) have been considered
    to be conversion constructors. This means that if they are not declared with explicit,
    then they are available for implicit conversion. Likewise, any casting operator
    that is not declared explicit is available for implicit conversion.


    The C++ Core Guidelines has two rules related to implicit conversion:


    +   - C.46: By default, declare single-argument constructors as explicit

    +   - C.164: Avoid implicit conversion operators



  md: '9. Run this code in your editor. You will see that the main thread goes to
    sleep for 1s. Then, the child thread enters the if condition and goes to sleep
    for 2s, which means that it validates a dividend and it is not equal to 0. Then,
    the main thread wakes up and sets a dividend variable to 0. Then, the child thread
    wakes up and performs the division. But because the dividend is equal to 0 now,
    the application crashes. If you run this example in Debug mode, you will see a
    SIGFPE exception with a message: "Arithmetic exception". You will get the following
    output:


    ![](img/6507d435e2edfa3c00c220d0ccfcaf94_367_0.png)


    Figure 5.10: The result of the exercise''s execution with race conditions


    In this exercise, we considered "check then act" kinds of race conditions. We''ve
    set periods of sleep for threads to emulate the OS interruption, but in real-world
    programs, this situation may well happen but may not. It all depends on the OS
    and its scheduler. This makes it enormously difficult to debug and fix race conditions.
    To avoid race conditions in this example, we can act in a few ways:


    +   - Pass copies of variables to the threaded function instead of passing references.

    +   - Synchronize access to the shared variables between threads using Standard
    Library primitives.

    +   - Join child thread before the main thread changes a dividend value to 0.


    Let''s look at a few more ways to fix this race condition. All of them depend
    on a task that you try to implement. In the next section, we will consider synchronization
    primitives that are provided by the C++ Standard Library.'

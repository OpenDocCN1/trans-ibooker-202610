- pgno: 61
  md: '# The Linking Step


    In this section, let''s look at a connection between two source files and how
    they end up in the same executable. Look at the sum function in the following
    figure:


    ![](img/6507d435e2edfa3c00c220d0ccfcaf94_61_0.png)


    Figure 1.43: The linking process


    The sum function''s body is defined in SumFunc.cpp. It has a forward declaration
    in SumFunc.h. This way, the source files that want to use the sum function can
    know about its signature. Once they know its signature, they can call it and trust
    that the actual function definition will be there during runtime, without actually
    having any interaction with SumFunc.cpp where the function is defined.


    After compilation, CxxTemplate.cpp, which calls the sum function, carries that
    call into its object file. Still, it does not know where the function definition
    is. The object file of SumFunc.cpp has that definition, but it has nothing to
    do with CxxTemplate.o, yet.


    During the linking step, the linker matches the call in CxxTemplate.o with the
    definition in SumFunc.o. The call works fine in the executable as a result. Had
    the linker not found the definition of the sum function, it would have given a
    linker error.


    The linker finds the sum function by its name and parameters. This is called resolving
    a symbol. The classes, functions, and variables defined in object files are placed
    in a symbol table and each reference to a symbol is resolved via a lookup at this
    table. When the symbol is not there, you receive a symbol could not be resolved
    error.'
  merge: -1
  img_proc: true
- pgno: 62
  md: "This took us through the two stages of the build process: **compilation** and\
    \ **linking**. Notice that we used rather simpler commands compared to that of\
    \ CMake, when we compiled our sources manually. Feel free to type `man g++` to\
    \ see all the options there. Later, we discussed linking and how symbols are resolved.\
    \ We also talked about possible issues with the linking step. In the next section,\
    \ we will learn about object files.\n\n# Diving Deeper: Viewing Object Files\n\
    \nFor the linking step to work without errors, we need to have all our symbol\
    \ references match our symbol definitions. Most of the time, we can analyze how\
    \ things will be resolved just by looking at the source files. Sometimes, in complex\
    \ situations, we may have a difficult time understanding why a symbol is not being\
    \ resolved. In such situations, looking at the contents of object files to investigate\
    \ references and definitions can be useful to resolve the problem. Besides linker\
    \ errors, understanding object file contents and how linking works in general\
    \ is useful for a C++ programmer. Knowing what is happening under the hood may\
    \ help programmers understand the whole process in a better way.\n\nWhen our source\
    \ code is compiled to object files, our statements and expressions are converted\
    \ to assembly code, which is the low-level language that the CPU understands.\
    \ Each instruction in assembly contains an operation, followed by operators, which\
    \ are registers of the CPU. There are instructions to load data to and from registers\
    \ and operate on values in registers. The `objdump` command in Linux helps us\
    \ view the contents of these object files.\n\n> **Note**\n> \n> We will utilize\
    \ Compiler Explorer, a nice online tool that is easier to use, where you can write\
    \ code on the window to the left, and on the right, you can see the compiled assembly\
    \ code. Here is the link to the Compiler Explorer: https://godbolt.org."

- pgno: 199
  md: "Let's say that the call looks like this:\n\n```\nfunction(expression);    //\
    \ deduce T and ParamType from expression\n```\n\nType deduction proceeds differently\
    \ depending on the form of ParamType used:\n\n+   - **ParamType is a value (T)**:\
    \ Pass-by-value function call\n+   - **ParamType is a reference or pointer (T&\
    \ or T*)**: Pass-by-reference function call\n+   - **ParamType is a rvalue reference\
    \ (T&&)**: Pass-by-reference function call or something else\n\n# Case 1: ParamType\
    \ is pass-by-value (T)\n\n```\ntemplate<typename T>\nvoid function(T parameter);\n\
    ```\n\nAs a pass-by-value call, this means that the parameter will be a copy of\
    \ whatever is passed in. Because this is a new instance of the object, the following\
    \ rules are applied to the expression:\n\n+   - If the expression's type is a\
    \ reference, then ignore the reference part.\n+   - If, after step 1, the remaining\
    \ type is const and/or volatile, then ignore those as well.\n\nWhat's left is\
    \ T. Let's attempt to compile the following file code:\n\n```\ntemplate<typename\
    \ T>\nclass TypeDisplay;\n\ntemplate<typename T>\nvoid function(T parameter)\n\
    {\n    TypeDisplay<T> type;\n}\n\nvoid types()\n{\n    int x = 42;\n    function(x);\n\
    }\n```"
  merge: -1
  img_proc: true

  md: "10. Click on the **Run** button and observe the output:\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_142_0.png)\n\
    \nFigure 2A.37: Example of constructor delegation\n\nIn this exercise, we implemented\

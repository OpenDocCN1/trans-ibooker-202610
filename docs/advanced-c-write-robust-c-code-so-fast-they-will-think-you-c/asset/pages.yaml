  md: "```\n```c\nbResult = TRUE;\n}\n\nCloseHandle(hFile);\n\nreturn 0;\n}\n```\n\
    ```\n\nThis is the easiest way to check if the I/O operation has finished. But\
    \ this approach makes the calling thread wait on the `WaitForSingleObject` call,\
    \ so it becomes a synchronous call. Moreover, you can initiate a few I/O operations\
    \ for this device, but you cannot be sure that the thread will wake up on the\
    \ needed release of the device.\n\n**A little bit better, but not the best approach:**\
    \ Do you remember the last member of the overlapped structure? You create an event\
    \ by invoking the `CreateEvent` function and set it to the `OVERLAPPED` object.\
    \ Then, when the I/O operation has finished, the system releases this event by\
    \ calling the `SetEvent` function. Next, when the calling thread needs to get\
    \ the result of an executing I/O operation, you invoke `WaitForSingleObject` and\
    \ pass the descriptors for this event. The following example demonstrates this\
    \ approach:\n\n```\n```c\n#include <Windows.h>\n#include <synchapi.h>\n\nint main()\n\
    {\n    HANDLE hFile = CreateFile(TEXT(\"Test.txt\"), GENERIC_READ,\n         \
    \                     FILE_SHARE_READ | FILE_SHARE_WRITE,\n                  \
    \            NULL, OPEN_ALWAYS, FILE_FLAG_OVERLAPPED,\n    NULL);\n\n    BYTE\
    \ bInBuffer[10];\n    OVERLAPPED o = { 0 };\n    o.hEvent = CreateEvent(NULL,TRUE,FALSE,\"\
    IOEvent\");\n    ReadFile(hFile, bInBuffer, 10, NULL, &o);\n\n    ///// do some\
    \ work\n```\n```"

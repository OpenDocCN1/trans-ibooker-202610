  md: "# Parallelism\n\n**Parallelism** occurs when several tasks are performed simultaneously.\
    \ The tasks work in parallel due to hardware capabilities. The best example of\
    \ parallelism is a multi-core processor. For parallel execution, the tasks are\
    \ divided into completely independent subtasks that are performed in different\
    \ processors' cores. After that, the result of the execution can be combined.\
    \ Look at the following diagram to understand the concept of parallelism:\n\n\
    ![](img/6507d435e2edfa3c00c220d0ccfcaf94_346_0.png)\n\n**Figure 5.2:** The abstraction\
    \ of the parallelism - all of the tasks are executed by different people; they\
    \ don't interact with each other\n\nIn the preceding diagram, there are three\
    \ people working at the same time on their own computers – well, they're working\
    \ in parallel.\n\n> **Note**\n> \n> **Concurrency** and **parallelism** are not\
    \ the same thing. **Parallelism** supplements concurrency. It tells us how tasks\
    \ are performed: they are independent of each other and run in different computational\
    \ units, that is, processors or cores."

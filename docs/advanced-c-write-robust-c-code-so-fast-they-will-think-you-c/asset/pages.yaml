  md: "```\nif(is_valid(buffer))\n    return FileCheckStatus::InvalidContents;\n\n\
    \    return FileCheckStatus::Good;\n}\n```\n\nThe preceding function uses a technique\
    \ known as **status** or **error codes** to report the outcome of the operation.\
    \ This is the approach that's used for C-style programming, wherein errors related\
    \ to the **POSIX API** and **Windows API** are handled.\n\n> **Note**\n> \n> **POSIX**\
    \ stands for **Potable Operating System Interface**. It is an IEEE standard for\
    \ software compatibility between variants of Unix and other operating systems.\n\
    \nThis means that, the caller of the method must check the return value and take\
    \ the appropriate action for each error type. This approach works well when you\
    \ can reason about the types of errors that the code will generate. This is not\
    \ always true. For example, there may be a problem with the data that is fed to\
    \ the program. This leads to an abnormal state in the program that cannot be handled.\
    \ The part of the code that has the logic to deal with the error is removed from\
    \ the section of code that detects the problem.\n\nWhile it is possible to write\
    \ code that deals with such a problem, it increases the complications of dealing\
    \ with all error conditions, thereby making the program hard to read, hard to\
    \ reason about what the function is supposed to do, and thus very hard to maintain.\n\
    \nFor error handling, exceptions provide the following benefits over error codes:\n\
    \n+   - Error codes can be ignored – exceptions force the error to be dealt with\
    \ (or the program terminates).\n+   - Exceptions can flow up the stack to the\
    \ best method to respond to the error. Error codes would require propagation out\
    \ of each intermediate method.\n+   - Exceptions separate the handling of errors\
    \ from the main program flow, leading to easy readability and maintainability\
    \ of the software.\n+   - Exceptions separate the code that detects the error,\
    \ from the code that handles the error."
  merge: -1

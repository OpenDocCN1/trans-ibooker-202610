- pgno: 564
  md: "In the preceding screenshot, the first few lines are called a **function prologue**,\
    \ that is, the instructions that are used to set up the **stack frame** and local\
    \ variables. A stack frame represents the localized data in a function that includes\
    \ the arguments and the local variables. When the function returns, the stack\
    \ frame is discarded. The **mov** instruction initializes a register or memory\
    \ location with a constant value. The syntax of the assembly code here is called\
    \ **Intel syntax**. The convention with this syntax is that the destination operand\
    \ is always the first one. For example, the **MOV RAX, RBX** assembly code means\
    \ move the value in the **RBX** register to the **RAX** register.\n\n> **Note**\n\
    > \n> Assembly language is usually not case-sensitive, so **EAX** and **eax**\
    \ mean the same thing.\n\nThe **DWORD PTR [rbp-8]** expression in assembly is\
    \ equivalent to the **(*(DWORD*)(rbp - 8))** C expression. In other words, the\
    \ memory address **rbp-8** is accessed as a 4 byte **DWORD** (a double word of\
    \ memory – 32 bits). The square brackets in assembly code represent dereferencing,\
    \ much like the * operator in C/C++. The **rbp** register is the base pointer\
    \ that always contains the address of the base of the currently executing function's\
    \ stack. It is not essential to know how exactly this stack frame works but remember\
    \ that since the stack starts at a higher address and moves down, function arguments\
    \ and local variables have addresses as negative offsets from **rbp**. If you\
    \ see some negative offset from **rbp**, it refers to a local variable or argument.\n\
    \nIn the preceding screenshot, the first **mov** instruction puts the value from\
    \ the **edi** register onto the stack—in this case, it represents the **n** argument\
    \ that was passed in. The last two **mov** instructions initialize the **ret**\
    \ variable and the **i** loop variable in our code to **0** and **1**, respectively.\n\
    \nNow, examine the snapshot of the assembly code that follows the prologue and\
    \ initialization – this is our **for()** loop:\n\n```\n·L3:\n    mov     eax,\
    \ DWORD PTR [rbp-8]\n    cmp     eax, DWORD PTR [rbp-20]\n    jg      .L2\n```\n\
    \n**Figure 8.5: Assembly code of the for loop**\n\nIn the preceding screenshot,\
    \ the lines that have a string followed by a colon are called **labels**. They're\
    \ very similar to labels in programming languages such as **BASIC**, **C/C++**,\
    \ or **Pascal** and are used as targets of **jump** instructions (the assembly\
    \ language equivalent of goto statements)."
  merge: -1
  img_proc: true
- pgno: 565
  md: 'Instructions starting with J on x86 assembly are all jump instructions, such
    as JMP, JG, JGE, JL, JLE, JE, JNE, and so on. Jump instructions are conditional
    or unconditional gotos. In the preceding screenshot, the mov instruction loads
    the value of the i variable from memory to the eax register. Then, it is compared
    against the n value in memory with the cmp instruction.


    > Note

    > The JG instruction here means jump if greater.


    If the comparison was greater, then the execution jumps to the .L2 label (which
    is outside the loop). If not, the execution continues with the next instruction,
    like so:


    ```

    mov eax, DWORD PTR [rbp-8]

    add DWORD PTR [rbp-4], eax

    add DWORD PTR [rbp-8], 1

    jmp .L3

    ```


    Figure 8.6: Assembly code of the next instruction


    Here, the value of i is reloaded again into eax, which seems unnecessary. But
    remember that this assembly code is not optimized, so the compiler has generated
    code that would be suboptimal and may include unnecessary work. Then, the value
    in eax is added to ret, after which 1 is added to i. Finally, the execution jumps
    back to the .L3 label. These instructions between the .L2 and .L3 labels form
    the code that executes the for loop and sums up the sequence of integers up to
    n, like so:


    ```

    .L2:

    mov eax, DWORD PTR [rbp-4]

    pop rbp

    ret

    ```


    Figure 8.7: Assembly code of the for loop


    This is called the function epilog. First, the value to be returned, ret, is moved
    into the eax register – this is typically the register where the return value
    of a function is stored. Then, the stack frame is reset and finally ret returns
    from the sum() function.


    > Note

    > The "ret" in the above assembly listing is the mnemonic for the RETURN instruction
    and should not be confused with the "ret" variable in our C++ code example.'
  merge: -1
  img_proc: true
- pgno: 566
  md: 'It is not a simple job to figure out what a sequence of assembly instructions
    does, but a general idea of the mapping between the source code and instructions
    can be gained by observing the following points:


    +   - Constant values in code can be directly recognized in the assembly.

    +   - Arithmetic operations such as add, sub, imul, idiv, and many others can
    be recognized.

    +   - Conditional jumps map to loops and conditionals.

    +   - Function calls can be directly read (the function name appears in the assembly
    code).


    Now, let''s observe the effect of the code if we add a compiler flag for optimization
    in the compiler options field at the top-right:


    ![](img/6507d435e2edfa3c00c220d0ccfcaf94_566_0.png)


    Figure 8.8: Adding a compiler flag for optimization


    In the preceding screenshot, O3 stands for maximum optimization. The other flags,
    such as -mno-avx, -mno-sse, and -mno-sse2, are used to prevent the compiler from
    generating vector instructions that are not relevant to the current example. We
    can see that the compiler is no longer accessing memory and only working with
    registers. Notice the line xor eax, eax, which has an effect of storing 0 in eax—this
    is more efficient than loading a constant 0 from memory into the register. Since
    memory takes several clock cycles to access (anywhere from 5 to 100 clock cycles),
    using registers alone will itself produce a massive speedup.'
  merge: -1
  img_proc: true
- pgno: 567
  md: 'When the compiler in the dropdown is changed to x86-64 clang 8.0.0, the assembly
    code is changed, which can be seen in the following screenshot:


    ![](img/6507d435e2edfa3c00c220d0ccfcaf94_567_0.png)


    Figure 8.9: Assembly code with the new compiler


    In the preceding assembly listing, observe that there is no instruction starting
    with J (for jump). Thus, there is no looping construct at all! Let''s examine
    how the compiler is calculating the sum of 1 to n. If the value of n is <= 0,
    then it jumps to the .LBB0_1 label where it exits, returning 0. Let''s analyze
    the following instructions:


    ![](img/6507d435e2edfa3c00c220d0ccfcaf94_567_1.png)


    Figure 8.10: Assembly code with the new compiler


    The following code is the C equivalent of the previous instructions. Remember
    that n is in the EDI register (and hence also in the RDI register, since they
    overlap):


    ```

    eax = n - 1;


    ecx = n - 2;


    rcx *= rax;


    rcx >>= 1;

    ```'

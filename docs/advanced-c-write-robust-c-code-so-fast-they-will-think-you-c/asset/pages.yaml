- pgno: 205
  md: "# SFINAE Expression and Trailing Return Types\n\nC++11 introduced a feature\
    \ called **trailing return types** to provide a mechanism for templates so that\
    \ they can generalize the return type. A simple example is as follows:\n\n```\n\
    template<class T>\n\nauto mul(T a, T b) -> decltype(a * b)\n{\n    return a *\
    \ b;\n}\n```\n\nHere, **auto** is used to indicate that a trailing return type\
    \ is defined. The trailing return type starts with the -> pointer and in this\
    \ case, the return type is the type that's returned by multiplying **a** and **b**.\
    \ The compiler will process the content of the decltype and, if it is malformed,\
    \ it will remove the definition from the function name's lookup, as per usual.\
    \ This capability opens up many possibilities as the comma operator, \",\", can\
    \ be used inside **decltype** to check for certain attributes.\n\nIf we want to\
    \ test that a class implements a method or contains a type then we can place this\
    \ inside the decltype by converting it into a void (in case the comma operator\
    \ has been overloaded) and then define an object of the real return type at the\
    \ end of the comma operator. An example of this is shown in the following program:\n\
    \n```\n#include <iostream>\n\n#include <algorithm>\n\n#include <utility>\n\n#include\
    \ <vector>\n\n#include <set>\n\ntemplate<class C, class T>\nauto contains(const\
    \ C& c, const T& x)\n    -> decltype((void)(std::declval<C>().find(std::declval<T>())),\n\
    true)\n{\n    return end(c) != c.find(x);\n}\n\nint main(int argc, char**argv)\n\
    {\n```"
  merge: -1

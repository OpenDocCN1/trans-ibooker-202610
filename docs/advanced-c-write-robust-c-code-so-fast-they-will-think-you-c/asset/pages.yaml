- pgno: 482
  md: 'Let''s briefly consider its interface for I/O operations. We can use the interface
    of the **Asio** library for synchronous and asynchronous operations. All of the
    I/O operations start from the **io_service** class, which provides core I/O functionality.
    It is declared in the **<boost/asio/io_service.hpp>** header file. The synchronous
    I/O invokes the **run()** function of the **io_service** object for a single operation
    that blocks the calling thread until the job is done. The asynchronous I/O uses
    the **run()**, **run_one()**, **poll()**, and **poll_one()** functions. The **run()**
    function runs the event loop to process request handlers. The **run_one()** function
    does the same, but the event loop should process only one handler. The **poll()**
    function runs the event loop to execute all the ready handlers. **poll_one()**
    does the same but only for one handler. The following example demonstrates the
    usage of all these functions:


    ```

    boost::asio::io_service io_service1;


    io_service1.run();


    boost::asio::io_service io_service2;


    io_service2.run_one();


    boost::asio::io_service io_service3;


    io_service3.poll();


    boost::asio::io_service io_service4;


    io_service4.poll_one();

    ```


    It''s possible to run the event handler before the actual I/O operations are called.
    Use the working class with the **io_service** class to implement this feature
    in your code. The work class guarantees that the run function will not return
    until you''ve decided that there will not be any future I/O operations. For example,
    you can make the working class a member of another class and remove it from the
    destructor. So, during the lifetime of your class, **io_service** will be running:


    ```

    boost::asio::io_service io_service1;

    boost::asio::io_service::work work(io_service1);

    io_service1.run();


    boost::asio::io_service io_service2;

    boost::asio::io_service::work work(io_service2);

    io_service2.poll();

    ```'

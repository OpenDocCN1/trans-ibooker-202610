- pgno: 280
  md: "# Caveat Emptor\n\nWe have seen how ADL makes life easier for the programmer\
    \ by including namespaces related to the function argument types. However, this\
    \ lookup capability does not come without risk which, for the most part we can\
    \ minimize. Consider the following sample code:\n\n```\n#include <iostream>\n\n\
    namespace mylib\n{\nvoid is_substring(std::string superstring, std::string substring)\n\
    {\n    std::cout << \"mylib::is_substring()\\n\";\n}\n\nvoid contains(std::string\
    \ superstring, const char* substring) {\n    is_substring(superstring, substring);\n\
    }\n}\n\nint main() {\n    mylib::contains(\"Really long reference\", \"included\"\
    );\n}\n```\n\nWhen we compile and run the preceding program, we get the expected\
    \ output:\n\n```\n$ ./adl_caveat.exe\nmylib::is_substring()\n$\n```\n\nFigure\
    \ 3.36: ADL Sample program output"

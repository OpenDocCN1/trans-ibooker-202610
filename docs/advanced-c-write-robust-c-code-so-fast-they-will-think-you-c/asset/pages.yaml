  md: '# Activity 2: Implementing classes for Date Calculations


    In this activity, we will implement two classes, Date and Days that will make
    it very easy for us to work with dates and the time differences between them.
    Let''s get started:


    +   1. Load the prepared project from the Lesson3/Activity02 folder and configure
    the Current Builder for the project to be CMake Build (Portable). Build and configure
    the launcher and run the unit tests. We recommend that the name that''s used for
    the tests runner is L3A2datetests. The project has dummy files and one failing
    test.

    +   2. Open the date.hpp file in the editor and add the following lines inside
    the basic Date class to allow access to the stored values:

    +   ```

    +   int Day() const {return m_day;}

    +   int Month() const {return m_month;}

    +   int Year() const {return m_year;}

    +   ```

    +   3. Open the dateTests.cpp file and add the following code to the DateTest
    class:

    +   ```

    +   void VerifyDate(const Date& dt, int yearExp, int monthExp, int dayExp) const

    +   {

    +       ASSERT_EQ(dayExp, dt.Day());

    +       ASSERT_EQ(monthExp, dt.Month());

    +       ASSERT_EQ(yearExp, dt.Year());

    +   }

    +   ```

    +   Normally, you would refactor this test as the tests develop, but we will pull
    it out up front.

    +   4. Replace ASSERT_FALSE() in the existing test with the following test:

    +   ```


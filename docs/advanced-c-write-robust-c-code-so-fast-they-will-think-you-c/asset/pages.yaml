- pgno: 236
  md: "# Catching Exceptions\n\nWhile discussing the need for exceptions, we introduced\
    \ the idea of throwing the exceptions but did not really look at how C++ supports\
    \ catching the exception. The process of exception handling starts with a section\
    \ of code being wrapped in a try block to place it under exception inspection.\
    \ The try block is followed by one or more catch blocks, which are the exception\
    \ handlers. When an exceptional circumstance occurs while executing the code inside\
    \ the try block, an exception is thrown, and control is transferred to the exception\
    \ handlers. If no exceptions are thrown, then all the exception handlers are skipped,\
    \ the code in the try block completes, and normal execution continues. Let's express\
    \ these concepts in a code snippet:\n\n```\nvoid SomeFunction()\n{\n    try {\n\
    \        // code under exception inspection\n    }\n    catch(myexception e) \
    \       // first handler - catch by value\n    {\n        // some error handling\
    \ steps\n    }\n    catch(std::exception* e)    // second handler - catch by pointer\n\
    \    {\n        // some other error handling steps\n    }\n    catch(std::runtime_error&\
    \ e) // third handler - catch by reference\n    {\n        // some other error\
    \ handling steps\n    }\n    catch(...)                  // default exception\
    \ handler - catch any exception\n    {\n        // some other error handling steps\n\
    \    }\n    // Normal programming continues from here\n}\n```"
  merge: -1
  img_proc: true
- pgno: 237
  md: 'The preceding snippet shows the necessary keywords – try, and catch and introduces
    the three different types of catch pattern (excluding the default handler):


    +   - **Catch exception by value**: This is a costly mechanism as the exception
    handler is processed like any other function. Catch-by-value means that a copy
    of the exception object must be created and then passed to the handler. The creation
    of the second copy slows down the exception handling process. This type can also
    suffer from object slicing where a subclass is thrown, and the catch clause is
    a super class. The catch clause will then only receive a copy of the super-class
    object that loses the attributes of the original exception object. Therefore,
    we should avoid catch-by-value exception handlers.

    +   - **Catch exception by pointer**: As discussed when looking at throw-by-value,
    with throw-by-pointer, this style of exception handler can only catch exceptions
    thrown by the pointer. As we only want to throw by value, we should avoid catch-by-pointer
    exception handlers.

    +   - **Catch expression by reference**: This is the recommended style of exception
    handler as it does not suffer from the issues related to catch-by-value and catch-by-pointer.
    As a reference is passed to the handler, no second copy of the exception object
    is made. Splicing does not occur because the reference still refers to the originally
    thrown exception object. And since the exception was thrown by value, the temporary
    exception object will be destroyed automatically when we are done with it.


    > **Note**

    > When dealing with exceptions, it is **throw-by-value** and **catch-by-reference**.


    When there are multiple catch blocks, the exception object type is used to match
    the handlers in the order that they are specified. Once a handler is found to
    match, it is executed, and the remaining exception handlers are ignored. This
    is different to function resolution, where the compiler will find the best match
    to the arguments. Thus, the exception handlers (catch blocks) should be defined
    from the more specific to the more general. For example, the default handler (**catch(...)**)
    should always come last in the definition.'
  merge: -1

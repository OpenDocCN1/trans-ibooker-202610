  md: '# Activity 1: Implement a multicast event handler


    Microsoft first introduced the Microsoft Foundation Class (MFC) in 1992 when C++
    was in its infancy. This means that many of the design choices around the classes
    were restricted. For example, the handlers for events are typically routed through
    OnEventXXX() methods. These are usually configured using macros as part of a class
    derived from the MFC classes. Your team has been tasked with implementing multicast
    event handler more like delegates available in C# using templates that embody
    function objects and lead to variadic templates to achieve the variable argument
    lists.


    In C#, you declare a delegate as follows:


    ```

    delegate int Handler(int parameter);

    ```


    This makes Handler a type that can be assigned a value which can be called. This
    is essentially what std::function<> delivers us in C++ except for the ability
    to multi-cast. Your team is asked to develop a template class Delegate that can
    perform the same way as the C# delegate.


    +   - The delegate will take a variable list of arguments but only return void

    +   - The operator+= will be used to add new callbacks to the delegate

    +   - It will be called either using either syntax delegate.Notify(...) or delegate(...)


    Follow these steps to develop the Delegate template:


    +   1. Load the prepared project from the Lesson4/Activity01 folder and configure
    the Current Builder for the project to be CMake Build (Portable).

    +   2. Build the project, configure the launcher and run the unit tests (which
    fail the one dummy test). Recommend that the name used for the tests runner is
    L4delegateTests.

    +   3. Implement a Delegate class that can wrap a single handler with all the
    required methods and supports a single int parameter for the callback.

    +   4. Update the template class to support multi-casting.

    +   5. Convert the Delegate class to a template that can take a single template
    argument that defines the argument type used by the callbacks.

    +   6. Convert the Delegate template to a variadic template that can take zero
    or more arguments that define the types passed to the callbacks.'

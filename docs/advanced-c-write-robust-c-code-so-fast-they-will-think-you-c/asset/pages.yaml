  md: "If we compile the program now, it completes the compilation and links the program.\
    \ If we run it, it now produces the following (expected) output:\n\n```\nC\n55\n\
    32.099998\n77.300000\n```\n\n**Figure 2B.17: Corrected print template program\
    \ output**\n\n# Floating-Point Representations\n\nShouldn't that **32.099998**\
    \ be **32.1**? That is what was passed to the function. The problem with performing\
    \ floating-point operations on a computer is that the representation automatically\
    \ introduces an error. Real numbers form a continuous (infinite) domain. If you\
    \ consider the numbers 1 and 2 in the real domain, then there is an infinite amount\
    \ of real numbers between them. Unfortunately, a computer's representation of\
    \ floating-point numbers quantizes the values and cannot represent all of the\
    \ infinite number of numbers. The bigger the number of bits used to store the\
    \ number, the better the representation of the value is on the real domain. So,\
    \ long double is better than double is better than float. It really depends on\
    \ your problem domain as to what is appropriate for storing the data. Back to\
    \ **32.099998**. The computer stores the single precision numbers as the sum of\
    \ powers of 2 and then shifts them by a power factor. Integral numbers are usually\
    \ easy as they can be easily represented by the sum of **2^n powers (n>=0)**.\
    \ The fractional part, which in this case is 0.1, has to be expressed as the sum\
    \ of **2^(-n) (n>0)**. We add more power−2 fractions to attempt to get the number\
    \ closer to the target until we have used up the 24 bits that we have for precision\
    \ in a single precision floating-point number.\n\n> **Note**\n> \n> If you want\
    \ to know more about how computers store floating-point numbers, research the\
    \ IEEE 754 standard that defines it."

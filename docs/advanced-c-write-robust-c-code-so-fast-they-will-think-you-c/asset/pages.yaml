- pgno: 137
  md: "# Rule of Three/Five and Rule of Zero\n\nAs we discussed previously, with the\
    \ exception of the default constructor, the special member functions deal with\
    \ the semantics of managing the resources owned by this class – that is, how to\
    \ copy/move them and how to dispose of them. This leads to two \"rules\" within\
    \ the C++ community about dealing with the special functions.\n\nPrior to C++11,\
    \ there was the Rule of Three, which dealt with the copy constructor, copy assignment\
    \ operator, and the destructor. It basically states that we need to implement\
    \ one of these methods since the management of the encapsulated resource is non-trivial.\n\
    \nWith the introduction of the move constructor and move assignment operator in\
    \ C++11, this rule was expanded to the Rule of Five. No changes were made to the\
    \ essence of the rule. Simply, the number of special member functions increased\
    \ to five. Remembering the rules for compiler generation, there is an additional\
    \ reason for ensuring all five special methods are implemented (or forced via\
    \ = default), and that is, if the compiler does not have access to a move-semantic\
    \ function, it will attempt to use a copy-semantic function, and this may not\
    \ be what is desired.\n\n> Note\n> \n> For more details, see the C.ctor: Constructors,\
    \ assignments, and destructors section of the C++ Core Guidelines, which can be\
    \ found here: http://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines.\n\n\
    # Constructors – Initializing the Object\n\nThe main task of a constructor is\
    \ to put the object into a stable state so that any operations performed on or\
    \ by the object through its member functions result in a consistent defined behavior.\
    \ While the previous statement is true of the copy and move constructors, they\
    \ achieve this by different semantics (copying or moving from another object).\n\
    \nThere are four different mechanisms available for us to control the initial\
    \ state of an object. C++ has a lot of rules for which initialization is used\
    \ in such a case. We will not go into the details of the C++ standard's default\
    \ initialization, zero initialization, value initialization, constant initialization,\
    \ and so on. Just know that the best approach is to be explicit about the initialization\
    \ of your variables."
  merge: -1
  img_proc: true
- pgno: 138
  md: "# No Ducks Allowed – Types and Deduction\n\nThe **first** and least preferred\
    \ initialization mechanism is to assign values to the member variables in the\
    \ body of the constructor, like so:\n\n```\nFraction::Fraction()\n{\n    this->m_numerator\
    \ = 0;\n    this->m_denominator = 1;\n}\n```\n\n```\nFraction::Fraction(int numerator,\
    \ int denominator)\n{\n    m_numerator = numerator;\n    m_denominator = denominator;\n\
    }\n```\n\nIt is clear what values are used to initialize the variables. Strictly\
    \ speaking, this is not the initialization of the class – according to the standard,\
    \ initialization is complete when the body of the constructor is called. This\
    \ is simple to maintain, particularly in this class. For larger classes that have\
    \ multiple constructors and many member variables, it can be a maintenance problem.\
    \ If you change one constructor, you will need to change them all. It also has\
    \ the problem that if the member variable is of a reference type (which we'll\
    \ talk about later), then it cannot be done in the body of the constructor.\n\n\
    The default constructor uses the **this** pointer. Every member function, including\
    \ constructors and destructors, are called with one implicit argument (even though\
    \ it is never declared) – the **this** pointer. **this** points to the current\
    \ instance of the object. The -> operator is another dereference operator and\
    \ is shorthand in this case, that is, **\\*(this).m_numerator**. The use of **this->**\
    \ is optional and can be omitted. Other languages, such as Python, require the\
    \ implicit pointer/reference to be declared and used (the convention in Python\
    \ is to call self).\n\nThe **second** mechanism is the use of a member initialization\
    \ list, which has a caveat in its use. For our Fraction class, we have the following:\n\
    \n```\nFraction::Fraction() : m_numerator(0), m_denominator(1)\n{\n}\n```\n\n\
    ```\nFraction::Fraction(int numerator, int denominator) :\n```"

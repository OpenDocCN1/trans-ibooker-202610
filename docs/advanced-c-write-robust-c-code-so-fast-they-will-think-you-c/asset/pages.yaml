  md: 'If we multiply the 4 x 1 matrix (point) by a 4 x 4 matrix (transformation),
    we can manipulate the point. If Ti represents a transformation, then we can multiply
    the transformations together to achieve some manipulation of the point:


    ```

    T₁ × T₂ × T₃ × ⋯ × Tₙ = Tₜ

    ```


    # Figure 2A.48: Multiplying transformations


    To multiply a transformation matrix, A x P = B, we do the following:


    ```

    [a₁₁ a₁₂ a₁₃ a₁₄; a₂₁ a₂₂ a₂₃ a₂₄; a₃₁ a₃₂ a₃₃ a₃₄; a₄₁ a₄₂ a₄₃ a₄₄] × [x; y;
    z; 1] = [a₁₁x + a₁₂y + a₁₃z + a₁₄; a₂₁x + a₂₂y + a₂₃z + a₂₄; a₃₁x + a₃₂y + a₃₃z

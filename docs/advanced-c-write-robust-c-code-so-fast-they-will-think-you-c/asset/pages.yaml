- pgno: 28
  md: '4. Generate our Ninja build file using the cmake command in the CxxTemplate
    folder. To do that, write the following command:


    ```

    cmake -Bbuild -H. -GNinja

    ```


    The output of the preceding command is as follows:


    ```

    -- The C compiler identification is GNU 7.4.0

    -- The CXX compiler identification is GNU 7.4.0

    -- Check for working C compiler: /usr/bin/cc

    -- Check for working C compiler: /usr/bin/cc -- works

    ... (more lines)

    -- Configuring done

    -- Generating done

    -- Build files have been written to:

    /home/username/code/CxxTemplate/build

    ```


    Figure 1.3: Generating the Ninja build file


    Let''s explain parts of the preceding command. With -Bbuild, we are telling CMake
    to use the build folder to generate build artifacts. Since this folder does not
    exist, CMake will create it. With -H., we are telling CMake to use the current
    folder as the source. By using a separate build folder, we will keep our source
    files clean and all the build artifacts will live in the build folder, which is
    ignored by Git thanks to our .gitignore file. With -GNinja, we are telling CMake
    to use the Ninja build system.


    5. Run the following commands to list the project files and to check the files
    that were created inside the build folder:


    ```

    ls

    ls build

    ```


    The preceding command will show the following output in the terminal:


    ```

    -- Build files have been written to: /home/gazihan/CxxTemplate/build

    gazihan@ubuntu:~/CxxTemplate$ ls

    build cmake CMakeLists.txt include LICENSE README.md src

    gazihan@ubuntu:~/CxxTemplate$ ls build

    build.ninja CMakeCache.txt CMakeFiles cmake_install.cmake rules.ninja

    gazihan@ubuntu:~/CxxTemplate$

    ```


    Figure 1.4: Files in the build folder'

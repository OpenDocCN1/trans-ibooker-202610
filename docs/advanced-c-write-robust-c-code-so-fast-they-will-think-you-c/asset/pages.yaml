  md: "Move semantics can also be useful when we store an std::thread object as a\
    \ class member. In this case, we should design our class carefully, delete the\
    \ copy constructor and assignment operator, and implement a new move constructor\
    \ and move assignment operator. Let's consider the following code example of such\
    \ a class:\n\n```\nclass Handler\n{\n    std::thread threadHandler;\n\npublic:\n\
    \    Handler(const Handler&) = delete;\n    Handler& operator=(const Handler&)\
    \ = delete;\n\n    Handler(Handler && obj)\n    : threadHandler(std::move(obj.threadHandler))\n\
    \    {}\n    Handler & operator=(Handler && obj)\n    {\n        if (threadHandler.joinable())\n\
    \        {\n            threadHandler.join();\n        }\n        threadHandler\
    \ = std::move(obj.threadHandler);\n        return *this;\n    }\n    ~Handler()\n\
    \    {\n        if (threadHandler.joinable())\n        {\n            threadHandler.join();\n\
    \        }\n    }\n};\n```"

    In this exercise, we learned how to forward declare functions and troubleshoot
    compiler errors that occur when a function is not declared before it is used.


    In the early versions of C compilers, this was acceptable. The program would assume
    that the function existed and returned an int. The functions'' arguments could
    be inferred from the call. However, this is not true in the case of modern C++
    as you must declare a function, class, variable, and so on before using it. In
    the next section, we''ll learn about pointer types.


    # Pointer Types


    Because of its origins in the C language, that is, writing optimally efficient
    systems and having direct access to hardware, C++ allows you to declare a variable
    as a pointer type. It is of the following format:


    ```

    ```cpp

    type-specifier* pvar = &var;

    ```

    ```'

- pgno: 298
  md: "These relationships between entities (files, classes, and so on) are known\
    \ as **coupling**. A file/class is **highly coupled** to another file/class if\
    \ changes to the file/class result in changes to the other file/class. A file/class\
    \ is **loosely coupled** to another file/class if changes to the file/class do\
    \ not result in changes to the other file/class.\n\nHighly coupled code (files/classes)\
    \ introduce problems into a project. Highly coupled code is hard to change (inflexible),\
    \ hard to test and hard to understand. Loosely coupled code on the other hand\
    \ is easier to change (only modify one class), highly testable (only need the\
    \ class being tested) and easier to read and understand. Coupling reflects, and\
    \ is related to, the logical and physical dependencies.\n\n# The Pointer to Implementation\
    \ (PIMPL) Idiom\n\nOne solution to this problem with coupling is to use the \"\
    **Pimpl Idiom**\" (which stands for **Pointer to Implementation Idiom**). This\
    \ is also referred to as an opaque pointer, the compiler firewall idiom or even\
    \ **Cheshire Cat technique**. Consider the **Qt library**, in particular, the\
    \ **Qt Platform Abstraction (QPA)**. It is an abstraction layer that hides the\
    \ details of the Operating Systems and/or platforms that the Qt application is\
    \ hosted on. One method to implement such a layer is to use the PIMPL idiom where\
    \ the common interface is exposed to the application developer, but the implementation\
    \ of how the functionality is delivered is hidden. Qt actually uses a variant\
    \ of PIMPL known as d-pointer.\n\nFor example, one feature of a GUI is the use\
    \ of a dialog that is a popup window that displays information or prompts for\
    \ user input. It could be declared in **dialog.hpp** as follows:\n\n> **Note**\n\
    > \n> For more information about QT Platform Abstraction (QPA), visit the following\
    \ link:\n> https://doc.qt.io/qt-5/qpa.html#\n\n```\n#pragma once\n\nclass Dialog\n\
    {\npublic:\n    Dialog();\n    ~Dialog();\n```"

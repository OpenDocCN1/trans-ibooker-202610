    ```\n```\n\nHere, we used lambda functions as callbacks for async I/O operations.\n\
    \n> **Note**\n> \n> The **Boost.Asio** is well-documented at https://www.boost.org/doc/libs/1_63_0/doc/html/boost_asio.html.\
    \ There are lots of examples with different IO devices and different approaches.\
    \ You can refer to this documentation if you decide to use **Boost.Asio** in your\

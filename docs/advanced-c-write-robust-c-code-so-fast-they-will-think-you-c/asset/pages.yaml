- pgno: 281
  md: "The C++ standards committee then decides that it should introduce an **is_substring()**\
    \ function that looks like this:\n\n```\nnamespace std {\n    void is_substring(std::string\
    \ superstring, const char* substring)\n    {\n        std::cout << \"std::is_substring()\\\
    n\";\n    }\n}\n```\n\nIf we add this to the top of our file, compile it and re-run\
    \ it, we now get the following output:\n\n```\n$ ./adl_caveat.exe\nstd::is_substring()\n\
    $\n```\n\nFigure 3.37: ADL issue program output\n\nThanks to ADL, the (next C++\
    \ standard) compiler has picked up a different implementation as a better fit\
    \ for the unqualified function call of **is_substring()**. And because of implicit\
    \ conversion of arguments it does not clash which would cause an ambiguity and\
    \ a compiler error. It just silently adopts to the new method which could lead\
    \ to subtle and hard to find bugs if the argument order is different. The compiler\
    \ can only detect type and syntactic differences, not semantic ones.\n\n**Note**\n\
    \nFor the purposes of demonstrating how ADL works, we have added our function\
    \ to the std namespace. Namespaces serve a purpose of separating concerns, and\
    \ to add into someone else's namespace, in particular, the **Standard Library\
    \ namespace (std)** is not good practice.\n\nSo, why caveat emptor (buyer beware)?\
    \ If you use third-party libraries for your development (and that includes the\
    \ C++ Standard Library), then when you upgrade the library, you need to ensure\
    \ that changes to the interface are not going to cause you problems because of\
    \ ADL."

- pgno: 418
  md: 'Here is an example of using **std::cin** with different types:


    ```

    std::string name;

    std::string sex;

    int age;


    std::cout << "Enter your name: " << std::endl;

    std::getline(std::cin, name);

    std::cout << "Enter your age: " << std::endl;

    std::cin >> age;

    std::cout << "Enter your sex (male, female):" << std::endl;

    std::cin >> sex;

    std::cout << "Your name is " << name << ", your age is " << age << ", your sex
    is " << sex << std::endl;

    ```


    As you can see, here, we read the name using the **std::getline()** function because
    the user can input two or three words. We also read the age and then read the
    sex using the right shift operator, **>>**, because we need to read only a single
    word. We then print the read data to ensure that everything went well.


    The **std::cerr** and **std::clog** stream objects differ in only one way – **std::cerr**
    immediately flushes the output sequence, while **std::clog** buffers it and flushes
    only when the buffer is full. When it comes to usage, they are very similar to
    **std::cout**. The only difference is that the messages from **std::cerr** and
    **std::clog** (in most of the IDEs) are red in color.


    In the following screenshot, you can see the output from these stream objects:


    ![](img/6507d435e2edfa3c00c220d0ccfcaf94_418_0.png)


    **Figure 6.3:** The output from the std::cerr and std::clog stream objects'

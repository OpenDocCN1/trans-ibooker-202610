  md: '# Exercise 5: Using Profile Guided Optimization


    In this exercise, we will use profile guided optimization on the code from the
    previous exercise. We''ll understand how to use profile guided optimization with
    the gcc compiler.


    Perform these steps to complete this exercise:


    +   1. Open the terminal and compile the code from the previous exercise with
    profiling enabled. Include any other optimization flags that we need (in this
    case, -O3). Write the following code to implement this:

    +      $ g++ -O3 -fprofile-generate Snippet3.cpp


    +   2. Now, run the profiled version of the code by writing the following command:

    +      $ ./a.out


    The program runs normally and prints the result, and no other output is seen -
    but it generates a file containing data that will help the compiler in the following
    step. Note that with profiling enabled, the program executes several times slower
    than it would normally. This is something to keep in mind with large programs.
    After executing the previous command, a file called Snippet3.gcda will be generated,
    which contains profile data. When doing this with large, complex applications,
    it is important to run the program with the datasets and workflows that it will
    most commonly encounter in the production environment. By choosing the data correctly
    here, the eventual performance gain will be higher.


    +   3. Recompile with the PGO optimization flags, that is, -fprofile-use and -fprofile-correction,
    as illustrated in the following code:

    +      $ g++ -O3 -fprofile-use -fprofile-correction Snippet3.cpp


    Note that other than the profile-related compiler options, the other options must
    be exactly the same as the ones in the previous compilation step.


    +   4. Now, if we time the executable, we will see a large performance improvement:


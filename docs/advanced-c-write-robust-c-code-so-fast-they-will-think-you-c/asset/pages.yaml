    # Activity 1: Developing a Generic "contains" Template Function


    The programming language Python has a membership operator called "in" that can
    be used on any sequence, that is, list, sequence, set, string, and so on. Even
    though C++ has over 100 algorithms, it does not have an equivalent method to achieve
    the same. C++ 20 introduced the contains() method on std::set, but that is not
    enough for us. We need to create a contains() template function that works with
    std::set, std::string, std::vector, and any other container that provides iterators.
    This is determined by the ability to call end() on it. We are aiming for best
    performance, so we will call the find() member method on any container that has
    one (it will be the most efficient) and otherwise fall back to using std::end()
    on the container. We also need to treat std::string() differently as its find()
    method returns a special value.


    We could implement this using a general template and two specializations, but
    this activity is being used to get it working using the techniques of SFINAE and
    if constexpr. In addition, this template must only work on a class that supports
    end(C). Follow these steps to implement this activity:


    +   1. Load the prepared project from the Lesson2B/Activity01 folder.


    +   2. Define the helper template functions and class to detect the std::string
    case using the npos member.'

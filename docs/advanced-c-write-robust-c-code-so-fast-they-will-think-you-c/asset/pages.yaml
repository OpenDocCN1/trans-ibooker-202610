  md: "In this exercise, we practiced how to create an STL container of move-only\
    \ objects. We also considered how to pass non-copiable objects to a thread constructor.\
    \ This knowledge will help us in the next section when we learn how to get the\
    \ result from the thread.\n\n# Futures, Promises, and Async\n\nIn the previous\
    \ section, we learned almost all that we need to work with threads. But we still\
    \ have something interesting to consider, that is, synchronizing threads using\
    \ future results. When we considered condition variables, we didn't cover the\
    \ second type of synchronization with future results. Now, it's time to learn\
    \ about that.\n\nSuppose there is a situation wherein we run some thread and continue\
    \ with other work. When we need a result, we stop and check if it is ready. This\
    \ situation describes the actual work with future results. In C++, we have a header\
    \ file called <future> that contains two template classes which represent future\
    \ results: std::future<> and std::shared_future<>. We use std::future<> when we\
    \ need a single future result and use std::shared_future<> when we need multiple\
    \ valid copies. We can compare them with std::unique_ptr and std::shared_ptr.\n\
    \nTo work with future results, we need a special mechanism to run the task in\
    \ the background and to receive the result later: the std::async() template function.\
    \ It takes a callable as a parameter and the launch mode – deferred or async and,\
    \ sure, parameters for the callable. The launch modes std::launch::async and std::launch::deferred\
    \ indicate how to execute task. When we pass std::launch::async, we expect that\
    \ function to be executed in a separate thread. When we pass std::launch::deferred,\
    \ the function call will be deferred until we ask for the results. We can also\
    \ pass both of them, for example, std::launch::deferred|std::launch::async. This\
    \ means that the run mode will depend on the implementation.\n\nNow, let's consider\
    \ an example of usage std::future with std::async. We have a toUppercase() function,\
    \ that converts the given string into uppercase:\n\n```\nstd::string toUppercase(const\
    \ std::string& bufIn)\n{\n    std::string bufferOut;\n    for (std::string::const_iterator\
    \ iter = bufIn.begin(); iter != bufIn.end(); iter++)\n    {\n        if (*iter\
    \ >= 97 && *iter <= 122)\n        {\n            bufferOut += static_cast<char>(static_cast<int>(*iter)\
    \ - 32);\n```"

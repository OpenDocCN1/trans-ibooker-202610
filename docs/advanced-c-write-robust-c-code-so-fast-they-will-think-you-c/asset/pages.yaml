    \ Now that we know how to leverage asynchronous I/O, let's learn how to use I/O\
    \ in multithreaded applications.\n\n# Interaction of Threads and I/O\n\nThe I/O\
    \ Standard Library is not thread-safe. In the documentation of the Standard Library,\

  md: "We can create a file stream in two ways. The first way is to do this in one\
    \ line, that is, to open a file and connect a stream to a file by just passing\
    \ the filename to a constructor:\n\n```\nstd::ofstream outFile(filename);\nstd::ifstream\
    \ outFile(filename);\nstd::fstream outFile(filename);\n```\n\nAnother way is creating\
    \ an object and then calling the open() function:\n\n```\nstd::ofstream outFile;\n\
    outFile.open(filename);\n```\n\n> **Note**\n> \n> IO streams have bool variables:\
    \ a **goodbit**, an **eofbit**, a **failbit**, and a **badbit**.\n> They are used\
    \ to check the state of the stream after each operation and indicate which error\
    \ happened on the stream.\n\nAfter the object's creation, we can check the stream\
    \ status by checking the failbit or checking the stream associated with the open\
    \ file. To check a failbit, call the fail() function on the file stream:\n\n```\n\
    if (outFile.fail())\n{\n    std::cerr << filename << \" file couldn't be opened\"\
    << std::endl;\n}\n```\n\nTo check whether the stream is associated with the open\
    \ file, call the is_open() function:\n\n```\nif (!outFile.is_open())\n{\n    std::cerr\
    \ << filename << \" file couldn't be opened\"<< std::endl;\n}\n```"

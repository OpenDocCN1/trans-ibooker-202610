- pgno: 165
  md: "If we think about object-oriented design, this is about modeling a problem\
    \ space in terms of objects that collaborate. These objects communicate with each\
    \ other through messages. Now, we have two classes that respond to the same message\
    \ (the Drive() method) in different ways. The sender of the message has no knowledge\
    \ of what will happen and doesn't really care, and this is the essence of polymorphism.\n\
    \n> **Note**\n> \n> Polymorphism comes from the Greek words poly and morph, where\
    \ **poly** means many and **morph** means form. So, polymorphism means **having\
    \ many forms.**\n\nWe can now use these classes to try out polymorphism:\n\n```\n\
    #include <iostream>\n\nint main()\n{\n    Vehicle vehicle;\n    Motorcycle cycle{1500};\n\
    \    Vehicle* myVehicle{&vehicle};\n\n    myVehicle->StartEngine();\n    myVehicle->Drive();\n\
    \    myVehicle->ApplyBrakes();\n    myVehicle->StopEngine();\n\n    myVehicle\
    \ = &cycle;\n    myVehicle->StartEngine();\n    myVehicle->Drive();\n    myVehicle->ApplyBrakes();\n\
    \    myVehicle->StopEngine();\n\n    return 0;\n}\n```"

- pgno: 459
  md: 'The buffered characters transport for input operations works as follows:


    +   1. The **sgetc()** function reads the character from the internal buffer.

    +   2. The **sgetc()** function invokes the **s ungetc()** function, which makes
    the consumed character available again.

    +   3. If the internal buffer is empty, the **sgetc()** function invokes the **underflow()**
    function.

    +   4. The **underflow()** function reads characters from the external device
    to the internal buffer.


    The **sgetc()** and **underflow()** functions always return the same character.
    To read different characters each time, we have another pair of functions: **sbumpc()**
    and **uflow()**. The algorithm of reading characters with them is the same:


    +   1. The **sbumpc()** function reads the character from the internal buffer.

    +   2. The **sbumpc()** function invokes the **sputbackc()** function, which makes
    the next character available for input.

    +   3. If the internal buffer is empty, the **sbumpc()** function invokes the
    **uflow()** function.

    +   4. The **uflow()** function reads characters from the external device to the
    internal buffer.


    The unbuffered characters transport for input operations works as follows:


    +   1. The **sgetc()** function invokes a protected virtual member known as **underflow()**.

    +   2. The **underflow()** function reads characters from the external device
    to the internal buffer.

    +   3. The **sbumpc()** function invokes a protected virtual member known as **uflow()**.

    +   4. The **uflow()** function reads characters from the external device to the
    internal buffer.


    In the case of any errors, the protected virtual member known as **pbackfail()**
    is invoked, which handles error situations. So, as you can see, to override the
    **std::basic_streambuf** class, we need to override the virtual members that work
    with external devices. For the input **streambuf**, we should override the **underflow()**,
    **uflow()**, and **pbackfail()** members. For the output **streambuf**, we should
    override the **overflow()** and **sync()** members.


    Let''s consider all of these steps in more detail.'
  merge: -1

- pgno: 113
  md: "This is the same as before, except for two things:\n\n+   - Use of the special\
    \ declarator asterisk (*) to indicate that the variable named pvar points to a\
    \ location or address in memory.\n+   - It is initialized using the special operator\
    \ ampersand (&), which in this context tells the compiler to return the address\
    \ of the var variable.\n\nAs C is a high-level language, but with low-level access,\
    \ pointers allow users to access memory directly, which is helpful when we wish\
    \ to provide input/output to hardware and thus control it. Another use of pointers\
    \ is to allow functions to be provided with access to common data items and remove\
    \ the need to copy large amounts of data when calling functions as it defaults\
    \ to passing by value. To access the value that's being pointed to by the pointer,\
    \ the special operator asterisk (*) is used to **dereference** the location:\n\
    \n```\nint five = 5;             // declare five and initialize it\n\nint *pvalue\
    \ = &five;       // declare pvalue as pointer to int and have it\n           \
    \                // point to the location of five\n\n*pvalue = 6;            \
    \   // Assign 6 into the location five.\n```\n\nThe following diagram shows how\
    \ the compiler allocates the memory. **pvalue** requires memory to store the pointer,\
    \ while **five** needs memory to store the integer value of 5:\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_113_0.png)\n\
    \n**Figure 2A.19: Memory layout for pointer variables**\n\nWhen accessing a user-defined\
    \ type via a pointer, there is a second special operator (->) that is also used\
    \ for dereferencing member variables and functions. In modern C++, these pointers\
    \ are referred to as **raw pointers** and the way in which they are used has changed\
    \ significantly. Working with pointers in C and C++ has always proved challenging\
    \ for programmers, and their incorrect use is the source of many problems, the\
    \ most common being resource leaks. A resource leak is a scenario where a program\
    \ has grabbed a resource (a memory, a file handle, or other system resource) for\
    \ its use and fails to let it go when it's finished with it. These resource leaks\
    \ can lead to performance issues, program failures, and even system crashes. The\
    \ use of raw pointers in modern C++ to manage the ownership of a resource is now\
    \ deprecated since smart pointers arrived in C++11. Smart pointers (implemented\
    \ as classes in the STL) now do the housekeeping required to be a good citizen\
    \ in your host system. More about this will be covered in *Chapter 3, The Distance\
    \ Between Can and Should – Objects, Pointers, and Inheritance.*"
  merge: -1
  img_proc: true
- pgno: 114
  md: "In the preceding code, when **pvalue** is declared, the compiler allocates\
    \ memory to store only the address of the memory it will be referring to. Like\
    \ other variables, you should always ensure that a pointer is initialized before\
    \ it is used as dereferencing an uninitialized pointer results in an undefined\
    \ behavior. Exactly how much memory is allocated to store a pointer is dependent\
    \ upon the system that the compiler is designed for and how many bits the processor\
    \ supports. But all pointers will be of the same size, regardless of what type\
    \ they point to.\n\nA pointer can also be passed to a function. This allows the\
    \ function to access the data being pointed to and possibly modify it. Consider\
    \ the following implementation of swap:\n\n```\nvoid swap(int* data1, int* data2)\n\
    {\n    int temp{*data1};      // Initialize temp from value pointed to by\ndata1\n\
    \    *data1 = *data2;       // Copy data pointed to by data2 into location\n \
    \                         // pointed to by data1\n    *data2 = temp;         //\
    \ Store the temporarily cached value from\ntemp\n                          //\
    \ into the location pointed to by data2\n}\n```\n\nThis shows how to declare pointers\
    \ as arguments to a function, how to get the value from the pointer by using the\
    \ dereferencing operator *, as well as how to set a value through the dereference\
    \ operator.\n\nThe following example allocates memory from the host system using\
    \ the new operator and releases it back to the host system using the delete operator:\n\
    \n```\nchar* name = new char[20];   // Allocate 20 chars worth of memory and\n\
    assign it\n\n                          // to name.\n\n    Do something with name\n\
    \ndelete [] name;\n```"
  merge: -1
  img_proc: true
- pgno: 115
  md: "In the preceding code, the first line creates an array of 20 characters using\
    \ the array allocation form of the new operator. It makes a call to the host system\
    \ to allocate 20 * sizeof(char) bytes of memory for our use. Exactly how much\
    \ memory is allocated is up to the host system, but it is guaranteed to be at\
    \ least 20 * sizeof(char) bytes. If it fails to allocate the required memory,\
    \ then one of two things will happen:\n\n+   - It will throw an exception\n+ \
    \  - It will return `nullptr`. This is a special literal that was introduced in\
    \ C++11. Earlier, C++ used 0 or NULL to indicate a non-valid pointer. C++11 made\
    \ this a strongly typed value as well.\n\nOn most systems, the first outcome will\
    \ be the result, and you will need to deal with the exception. The second outcome\
    \ is possible from two scenarios – calling the nothrow variant of new, that is,\
    \ `new(std::nothrow) int [250]`, or on embedded systems where the overhead of\
    \ exception processing is not sufficiently deterministic.\n\nFinally, note that\
    \ the call to delete uses the array form of the delete operator, that is, with\
    \ square brackets, []. It is important to ensure that the same form is used with\
    \ the new and delete operators. When new is used on a user-defined type (which\
    \ will be discussed in the next section), it does more than just allocate memory:\n\
    \n```\nMyClass* object = new MyClass;\n```\n\nIn the preceding code, the call\
    \ to new allocates sufficient memory to store MyClass and, if successful, it then\
    \ proceeds to call the constructor to initialize the data:\n\n```\nMyClass* objects\
    \ = new MyClass[12];\n```\n\nIn the preceding code, the call to new allocates\
    \ sufficient memory to store 12 copies of MyClass and, if successful, it then\
    \ proceeds to call the constructor 12 times to initialize the data for each object.\n\
    \nNote that **object** and **objects**, which were declared in the preceding snippets\
    \ of code, have the **same type**. Strictly speaking, **objects** should be a\
    \ pointer to an array of MyClass, but it is actually a pointer to an instance\
    \ of MyClass. **objects** points to the first instance in the array of MyClass.\n\
    \nConsider the following excerpt of code:\n\n```\nvoid printMyClasses(MyClass*\
    \ objects, size_t number)\n{\n    for( auto i{0U} ; i<number ; i++ ) {\n     \
    \   std::cout << objects[i] << \"\\n\";\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 116
  md: "```\n}\n\nvoid process()\n{\n    MyClass objects[12];\n\n    // Do something\
    \ with objects\n    printMyClasses(objects, sizeof(objects)/sizeof(MyClass));\n\
    }\n```\n\nIn the process() function, objects is of the \"array of 12 MyClass items\"\
    \ type, but when it is passed to printMyClasses(), it is converted (by the compiler)\
    \ into the \"a pointer to MyClass\" type. This is by design (inherited from C)\
    \ and is known as array decay and can be the cause of errors by new programmers.\
    \ We could attempt to declare printMyClasses() as follows:\n\n```\nvoid printMyClasses(MyClass\
    \ objects[12], size_t number)\n```\n\nThis would still suffer from array decay\
    \ as the compiler changes the argument object to MyClass*; it does not keep the\
    \ dimension information in this case. Array decay is the reason that we need to\
    \ pass number to the printMyClasses() function: so that we know how many items\
    \ are in the array. C++ provides two mechanisms for dealing with array decay:\n\
    \n+   - Use of iterators to pass a range into the method. STL containers (see\
    \ the C++ Pre-Packaged Templates section in Chapter 2B, No Ducks Allowed – Templates\
    \ and Deduction) offer the begin() and end() methods so that we can obtain iterators\
    \ that allow algorithms to traverse an array or part thereof.\n\nNote\nFor C++20,\
    \ the ISO standard committee is considering the inclusion of a concept known as\
    \ Ranges that will allow both the begin and end iterators to be captured in one\
    \ object.\n\n+   - Use of templates (see the Non-Type Template Arguments section\
    \ in Chapter 2B, No Ducks Allowed – Templates and Deduction)."

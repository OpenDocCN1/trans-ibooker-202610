- pgno: 133
  md: 'Firstly, the default constructor is a special member function. It is one of
    the many possible constructors, three of which are deemed special member functions.
    Constructors can be declared with zero, one, or more arguments, just like any
    other function, but they do NOT specify a return type. Constructors serve the
    special purpose of initializing all the member variables to place the object into
    a well-defined state. If the member variables are themselves a class, then it
    may not be necessary to specify how to initialize the variable. It the member
    variable is of a built-in type, then we will need to provide the initial values
    for them.


    # Class Special Member Functions


    When we define a new type (struct or class), the compiler will create up to six
    (6) special member functions for us:


    +   - **Default Constructor** (`Fraction::Fraction()`): This is called when no
    arguments are provided (such as in the preceding section). This can be achieved
    by either having no argument list for the constructor or by defining a default
    value for all the arguments, such as `Fraction(int numerator=0, denominator=1)`.
    The compiler provides an **implicit inline** default constructor that performs
    the default initialization of member variables – for built-in types, this means
    do nothing.

    +   - **Destructor** (`Fraction::~Fraction()`): This is a special member function
    that is called when the object''s lifetime ends. Its purpose is to release any
    resources that were allocated and kept by the object during its lifetime. The
    compiler provides a **public inline** member function that calls the destructors
    of the member variables.

    +   - **Copy Constructor** (`Fraction::Fraction(const Fraction&)`): This is another
    constructor where the first parameter is a form of `Fraction&` and there are no
    other arguments, or the remainder of the arguments have default values. The form
    of the first argument is one of `Fraction&, const Fraction&, volatile Fraction&,`
    or `const volatile Fraction&`. We will deal with `const` later but not with `volatile`
    in this book. The compiler provides a **non-explicit public inline** member function,
    usually with the form of `Fraction::Fraction(const Fraction&)`, that copies each
    of the member variables in the order of initialization.

    +   - **Copy Assignment** (`Fraction& Fraction::operator=(Fraction&)`): This is
    a member function with the name `operator=` and the first argument is either a
    value or any of the reference types of the class, in this case, `Fraction, Fraction&,
    const Fraction&, volatile Fraction&,` or `const volatile Fraction&`. The compiler
    provides a **public inline** member function, usually with the form of `Fraction::Fraction(const
    Fraction&)`, that copies each of the member variables in the order of initialization.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '+   - **Move Constructor** (`Fraction::Fraction(Fraction&&)`): This is a new
    type of constructor that was introduced in C++11 where the first parameter is
    a form of **Fraction&&** and there are no other arguments, or the remainder of
    the arguments have default values. The form of the first argument is one of **Fraction&&**,
    **const Fraction&&**, **volatile Fraction&&**, or **const volatile Fraction&&**.
    The compiler provides a **non-explicit public inline** member function, usually
    with the form of **Fraction::Fraction(Fraction&&)**, that moves each of the member
    variables in the order of initialization.

    +   - **Move Assignment** (`Fraction& Fraction::operator=(Fraction&&)`): This
    is a new type of assignment operator that was introduced in C++11 and is a member
    function with the name **operator=**, and the first argument is any of the forms
    that are allowed for the move constructor. The compiler provides a **public inline**
    member function, usually with the form of **Fraction::Fraction(Fraction&&)**,
    that copies each of the member variables in the order of initialization.


    Except for the default constructor, these functions deal with managing the resources
    owned by this class – that is, how to copy/move them and how to dispose of them.
    On the other hand, the default constructor is more like any other constructor
    that takes values – it only initializes the resources.


    We can declare any of these special functions, force them to be defaulted (that
    is, have the compiler generate the default version), or force them to not be created.
    There are also rules about when these are automatically generated in the presence
    of the other special functions. The first four functions are relatively straightforward
    conceptually, but the two "move" special member functions take some additional
    explanation. We will deal with what is known as move semantics in detail in Chapter
    3, *The Distance Between Can and Should – Objects, Pointers, and Inheritance*,
    but for now it is essentially what it indicates – it moves something from one
    object to the other.


    # Implicit Versus Explicit Constructors


    The preceding description talks about the compiler generating implicit or non-explicit
    constructors. If a constructor exists that can be called with one argument, for
    example, a Copy Constructor, or a Move Constructor, by default, the compiler is
    allowed to invoke it if necessary so that it can convert it from one type to another
    type, allowing an expression, function call, or assignment to be encoded. This
    is not always a desired behavior, and we may wish to prevent the implicit conversion
    and ensure that if the user of our class really wants that conversion, then they
    have to write it out in the program. To achieve this, we prefix the declaration
    of the constructor with the **explicit** keyword, like so:


    ```

    explicit Fraction(int numerator, int denominator = 1);

    ```'

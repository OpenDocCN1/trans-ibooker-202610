    # Writing Readable Code


    While visual debuggers are quite useful to identify and eliminate runtime errors
    or unintended program behavior, it is a better idea to write code that is less
    likely to have problems to begin with. One way to do that is to strive to write
    code that is easier to read and to understand. Then, finding problems in code
    becomes more like identifying contradictions between English sentences and less
    like solving cryptic puzzles. When you are writing code in a way that is understandable,
    your mistakes will often be apparent as you are making them and will be easier
    to spot when you come back to solve problems that slipped through.


    After some unenjoyable maintenance experiences, you realize that the primary purpose
    of the programs that you write is not to make the computer do what you want to,
    but to tell the reader what the computer will do when the program runs. This usually
    means that you need to do more typing, which IDEs can help with. This may also
    mean that you sometimes write code that is not the most optimal in terms of execution
    time or memory used. If this goes against what you have learned, consider that
    you may be trading a minuscule amount of efficiency for the risk of being incorrect.
    With the vast processing power and memory at our disposal, you may be making your
    code unnecessarily cryptic and possibly buggy in the vain quest for efficiency.
    In the next sections, we will list some rules of thumb that may help you write
    code that is more readable.


    # Indentation and Formatting


    C++ code, as in many other programming languages, is composed of program blocks.
    A function has a set of statements that form its body as a block. A loop''s block
    statements will execute in iterations. An **if** statement''s block executes if
    the given condition is true and the corresponding **else** statement''s block
    executes otherwise.'
  merge: -1
  img_proc: true
- pgno: 79
  md: "Curly braces, or lack thereof for single-statement blocks, inform the computer,\
    \ whereas indentation in the form of white space informs the human reader about\
    \ the block structure. The lack of indentation, or misleading indentation, can\
    \ make it very difficult for the reader to understand the structure of the code.\
    \ Therefore, we should strive to keep our code well-indented. Consider the following\
    \ two code blocks:\n\n```\n// Block 1\nif (result == 2)\nfirstFunction();\nsecondFunction();\n\
    ```\n\n```\n// Block 2\nif (result == 2)\n    firstFunction();\nsecondFunction();\n\
    ```\n\nWhile they are identical in terms of execution, it is much clearer in the\
    \ second one that **firstFunction()** is executed only if **result** is 2. Now\
    \ consider the following code:\n\n```\nif (result == 2)\n    firstFunction();\n\
    \    secondFunction();\n```\n\nThis is simply misleading. If the reader is not\
    \ careful, they might easily assume that **secondFunction()** is executed only\
    \ if **result** is 2. However, this code is identical to the two previous examples\
    \ in terms of execution.\n\nIf you feel like correcting indentation is slowing\
    \ you down, you can use your editor's formatting facilities to help you. In Eclipse,\
    \ you can select a block of code and use **Source | Correct Indentation** to fix\
    \ the indentation of that selection, or use **Source | Format** to also fix other\
    \ formatting issues with code.\n\nBeyond indentation, other formatting rules such\
    \ as placing the curly brace at the correct line, inserting spaces around binary\
    \ operators, and inserting a space after each comma are also very important formatting\
    \ rules that you should abide by to keep your code well-formatted and easy to\
    \ read."
  merge: -1
  img_proc: true
- pgno: 80
  md: "In Eclipse, you can set formatting rules per-workspace in **Window | Preferences\
    \ | C/C++ | Code Style | Formatter** or per-project in **Project | Properties\
    \ | C/C++ General | Formatter**. You can either select one of the industry-standard\
    \ styles such as K&R or GNU, or you can modify them and create your own. This\
    \ becomes especially important when you use **Source | Format** to format your\
    \ code. For example, if you choose to use spaces for indentation but Eclipse's\
    \ formatting rules are set to tabs, your code would become a mixture of tabs and\
    \ spaces.\n\n# Use Meaningful Names as Identifiers\n\nIn our code, we use identifiers\
    \ to name many items–variables, functions, class names, types, and so on. For\
    \ the computer, these identifiers are merely a sequence of characters to distinguish\
    \ them from one another. However, for the reader, they're much more. The identifier\
    \ should completely and unambiguously describe the item that it represents. At\
    \ the same time, it should not be overly long. Furthermore, it should abide by\
    \ the style standards that are in use.\n\nConsider the following code:\n\n```\n\
    studentsFile File = runFileCheck(\"students.dat\");\n\nbool flag = File.check();\n\
    \nif (flag) {\n    int Count_Names = 0;\n\n    while (File.CheckNextElement()\
    \ == true) {\n        Count_Names += 1;\n    }\n\n    std::cout << Count_Names\
    \ << std::endl;\n}\n```"

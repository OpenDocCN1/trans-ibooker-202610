- pgno: 558
  md: '# Introduction


    In today''s world of extremely large and complicated software systems, **stability**
    and **maintainability** are usually considered the major goals for most software
    projects, whereas optimization has not been widely seen as a worthwhile goal since
    the 2000s. This is because of the rapid acceleration of hardware technology that
    overtook software demands on a regular schedule.


    For many years, it seemed like the hardware improvements would continue to keep
    up with the performance demands of software, but applications continued to grow
    larger and more complex. Low-level native-compiled languages such as C and C++
    dropped in popularity compared to less performant but easier to use interpreted
    languages such as **Python** or **Ruby**.


    By the late 2000s, though, the trend of CPU transistor count (and performance)
    doubling every 18 months (a consequence of **Moore''s Law**) had stopped, and
    performance improvements had flattened out. The expectation of 5 to 10 GHz processors
    being widely available by the 2010s never materialized due to limitations of physics
    and manufacturing costs. However, the rapid adoption of mobile devices and the
    rise of high-performance computing applications for data science and machine learning,
    suddenly resurrected the demand for fast and efficient code. Performance per watt
    has become the new metric to aim for as large data centers consume enormous amounts
    of power. For example, Google servers in the US used more power than the entire
    nation of the UK in 2017.


    So far in this book, we''ve learned how the C++ language has evolved in terms
    of ease of use, without sacrificing any performance potential over a traditional
    language such as C. This means we can write fast code in C++ without necessarily
    sacrificing readability or stability. In the next section, we will learn about
    the concept of performance measurement.


    # Performance Measurement


    The most important aspect of optimization is the **measurement of code execution
    time**. Unless we measure our application''s performance with a wide range of
    input datasets, we will have no clue as to which part takes the most time and,
    our optimization efforts will be shot in the dark, with no guarantee of a result.
    There are several approaches for measurement, and some of them are listed here:


    +   - Runtime instrumentation or profiling

    +   - Source code instrumentation'
  merge: -1
  img_proc: true
- pgno: 559
  md: "+   - Manual execution timing\n+   - Studying generated assembly code\n+  \
    \ - Manual estimation by studying the code and algorithms used\n\nThe preceding\
    \ list is ordered in terms of how accurate the measurement is (with the most accurate\
    \ one first). However, each of these methods has different advantages. The choice\
    \ of which approach to adopt depends on the goals and scope of the optimization\
    \ effort. In an all-out effort to get the fastest possible implementation, all\
    \ of these may be required. We will examine each of these approaches in the following\
    \ sections.\n\n# Manual Estimation\n\nThe biggest possible improvement in performance\
    \ occurs when we replace an algorithm with a superior one. For example, consider\
    \ the two versions of a trivial function that sums the integers from 1 to n:\n\
    \n```\nint sum1(int n)\n{\n    int ret = 0;\n    for(int i = 1; i <= n; ++i)\n\
    \    {\n        ret += i;\n    }\n    return ret;\n}\nint sum2(int n)\n{\n   \
    \ return (n * (n + 1)) / 2;\n}\n```\n\nThe first function, sum1, uses a simple\
    \ loop to calculate the sum and has a runtime complexity that is proportional\
    \ to n, whereas the second function, sum2, uses the algebraic summation formula\
    \ and takes constant time independent of n. In this quite contrived example, we\
    \ have optimized a function simply by using the basic knowledge of algebra.\n\n\
    There are many well-known algorithms for every conceivable operation that have\
    \ been proven to be the most optimal. The best way to make our code run as fast\
    \ as possible is by using algorithms."
  merge: -1
  img_proc: true
- pgno: 560
  md: "It is essential to have a vocabulary of algorithms. We do not need to be an\
    \ algorithm expert, but we need to at least be aware of the existence of efficient\
    \ algorithms in various domains, even if we are not capable of implementing them\
    \ from scratch. A slightly deeper knowledge of algorithms will help us find parts\
    \ of our program that perform similar, if not exactly the same, computations as\
    \ well-known algorithms. Certain code features such as nested loops or linear\
    \ scanning of data are often obvious candidates for improvement, provided we can\
    \ verify that these constructs are within hotspots in the code. A **hotspot**\
    \ is a section of code that runs very often and affects performance significantly.\
    \ The C++ standard library includes a lot of basic algorithms that can be used\
    \ as building blocks to improve the efficiency of many common operations.\n\n\
    # Studying Generated Assembly Code\n\n**Assembly language** is a human readable\
    \ representation of the binary machine code that actually executes on the processor.\
    \ For any serious programmer of a compiled language such as C++, a basic understanding\
    \ of assembly language is a great asset.\n\nStudying the generated assembly code\
    \ for a program can give us some good insights into how the compiler works and\
    \ estimates of code efficiency. There are many cases where this is the only approach\
    \ possible to determine efficiency bottlenecks.\n\nApart from this, a basic knowledge\
    \ of assembly language is essential to be able to debug C++ code since some of\
    \ the most difficult bugs to catch are those related to the low-level generated\
    \ code.\n\nA very powerful and popular online tool that's used for analyzing compiler-generated\
    \ code is the **Compiler Explorer** that we will be using in this chapter.\n\n\
    > **Note**\n> \n> The **Godbolt compiler explorer** can be found at https://godbolt.org."

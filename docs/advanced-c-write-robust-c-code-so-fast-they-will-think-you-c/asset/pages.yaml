  md: 'As we can see, the effect of calling **reserve()** has resulted in an improvement
    of about 4% in execution time. In a larger program that has run for a long time,
    the system memory often becomes very fragmented. In such cases, the improvement
    by pre-allocating memory with **reserve()** could be much better. In general,
    it is usually faster to reserve memory beforehand, rather than doing it incrementally
    on the fly. Even the Java Virtual Machine, for performance reasons, uses this
    technique of allocating a huge chunk of memory upfront when starting up.


    # Short-Circuit Logical Operators


    The && and || logical operators are **short-circuited**, which means that the
    following:


    +   - If the left-hand side of the || operator is **true**, the right-hand side
    is not evaluated.

    +   - If the left-hand side of the && operator is **false**, the right-hand side
    is not evaluated.


    By keeping the more unlikely (or less expensive) expression on the left-hand side,
    we can reduce the amount of work that needs to be done. In the next section, we''ll
    solve an exercise and learn how to write logical expressions optimally.


    # Exercise 8: Optimizing Logical Operators



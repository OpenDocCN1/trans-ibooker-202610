- pgno: 110
  md: 'A function must be declared before it is used – that is, the compiler needs
    to know its arguments and its return type. If the function is defined in the file
    that it is to be used in after the call to it, then you can solve this problem
    by providing a forward declaration of the function before it is used.


    A forward declaration is made by placing the function prototype that was terminated
    by a semicolon in the file before it is called. For `hello_world()`, this would
    be done as follows:


    ```

    void hello_world();

    ```


    For the main function, this would be done as follows:


    ```

    int main(int, char**);

    ```


    A function prototype does not need the names of the arguments, only the types.
    However, to help the users of the function, it is a good idea to keep them.


    In C++, the definition of the function can be in one file and needs to be called
    from a different file. So, how does the second file know the prototype of the
    function it wishes to call? This is achieved by placing the forward declarations
    into a separate file known as a header file and including it in the second file.


    # Exercise 2: Declaring Functions


    In this exercise, we will test what the compiler needs to know when it encounters
    a function call and implements a forward declaration to resolve an unknown function.
    Let''s get started.


    +   1. Open the **Lesson2A** project in Eclipse, and then, in the **Project Explorer**,
    expand **Lesson2A**, then **Exercise02** and double-click on **Exercise2.cpp**
    to open the file for this exercise into the editor.

    +   2. Click on the **Launch Configuration** drop-down menu and select **New Launch
    Configuration...**

    +   3. Configure **Exercise2** to run with the name **Exercise2**. When that is
    complete, it will be the currently selected Launch Configuration.'

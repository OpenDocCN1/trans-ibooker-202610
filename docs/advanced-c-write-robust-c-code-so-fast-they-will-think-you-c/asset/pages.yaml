- pgno: 338
  md: "+   - The compiler then generates the code for `summer(3,5,7,9,11)`. Again,\
    \ resulting in `first + summer(args...)` being applied where `summer(5,7,9,11)`.\n\
    +   - This process is repeated until the compiler has to generate code for `summer(11)`.\
    \ In this case, the else clause of the `constexpr if` statement is triggered which\
    \ simply returns `first`.\n\nAs the types are determined by the arguments to the\
    \ template, we are not restricted to the arguments having the same type. We have\
    \ already met a couple of variadic templates in the STL – `std::function` and\
    \ `std::bind`.\n\nThere is another type of variadic template, one which forwards\
    \ its arguments onto another function or template. This kind of template does\
    \ little on its own but provides a standard approach to things. One example is\
    \ the `make_unique` template which could be implemented as:\n\n```\ntemplate<typename\
    \ T, typename... Args>\nunique_ptr<T> make_unique(Args&&... args)\n{\n    return\
    \ unique_ptr<T>(new T(std::forward<Args>(args)...));\n}\n```\n\n`make_unique`\
    \ has to call the new operator to allocate memory and then call the appropriate\
    \ constructor for the type. The number of arguments required to call the constructor\
    \ can vary greatly. This form of variadic template introduces some addition pack\
    \ expansions:\n\n+   - `Args&&...` means we have a list of forwarding references.\n\
    +   - `std::forward<Args>(args)...` which contains to parameter packs that are\
    \ expanded together and must have the same number of elements – Args the template\
    \ parameter pack and args the function parameter pack.\n\nThis pattern is used\
    \ whenever we need to forward a function call to another function call in a variadic\
    \ template."

- pgno: 358
  md: "# The Philosophers' Dinner – Threads and Concurrency\n\nLet's revise what we\
    \ have learned about concurrency concepts using an example from daily life. Here\
    \ is a background wherein you've to write an application and provide all the documentation\
    \ and architectural concepts related to it:\n\n+   - **Single-threaded work:**\
    \ You write it yourself.\n+   \n+   - **Multi-threaded work:** You invite your\
    \ friends and write a project together. Somebody writes an architectural concept,\
    \ somebody takes care of documentation work, and you focus on the coding part.\
    \ All participants communicate with each other to clarify any questions and share\
    \ documentation, such as questions about specifications.\n+   \n+   - **Parallel\
    \ work:** The tasks are divided. Someone writes the documentation for the project,\
    \ someone designs the diagrams, someone writes the test cases, and you work independently.\
    \ Participants don't communicate at all.\n+   \n+   - **Synchronized work:** In\
    \ this case, each of you are unable to understand what they are supposed to do.\
    \ Thus, you all decide to work one after the other. When the architectural work\
    \ is finished, the developer starts to write the code. Then, when the development\
    \ work is finished, someone starts to write the documentation.\n+   \n+   - **Asynchronous\
    \ work:** In this case, you hire an outsource company to complete the project.\
    \ While they are developing the project, you'll be engaged in some other task.\n\
    \nNow, let's apply our knowledge in practice and solve an exercise to see how\
    \ all it works.\n\n# Exercise 1: Creating Threads in a Different Way\n\nIn this\
    \ exercise, we'll write a simple application that creates four threads; two of\
    \ them will work in a synchronized way and two of them will work asynchronously.\
    \ All of them will print some symbols to the terminal, so that we can see how\
    \ the operating system switches thread execution.\n\n> **Note**\n> \n> Add the\
    \ pthread linker flag in your project settings to let the compiler know that you\
    \ will use threading libraries. For Eclipse IDE you can do this following this\
    \ path: **Project -> Properties -> C/C++ Build -> Settings -> G++ Linker -> Miscellaneous\
    \ -> Linker flags enter '-pthread'.** This path is valid for **Eclipse Version:\
    \ 3.8.1**, it may vary in different versions."
  merge: -1
  img_proc: true

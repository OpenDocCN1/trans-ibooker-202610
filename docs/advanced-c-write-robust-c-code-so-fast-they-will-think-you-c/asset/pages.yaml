  md: "Write the functions for addition and multiplication. Both functions simply\
    \ add and multiply the integers 1 to N, respectively:\n\n```\nunsigned int testMul()\n\
    {\n    Timer t(\"Mul\");\n\n    unsigned int x = 1;\n    for(int i = 0; i < N;\
    \ ++i)\n    {\n        x *= i;\n    }\n\n    return x;\n}\n```\n\n```\nunsigned\
    \ int testAdd()\n{\n    Timer t(\"Add\");\n\n    unsigned int x = 1;\n    for(int\
    \ i = 0; i < N; ++i)\n    {\n        x += i;\n    }\n\n    return x;\n}\n```\n\
    \nIn the preceding code, we used unsigned int for the variable that we repeatedly\
    \ add/multiply. We used an unsigned type so that overflow during arithmetic does\
    \ not result in undefined behavior. Had we used a signed type, the program would\
    \ have undefined behavior and not be guaranteed to work in any way. Secondly,\
    \ we return the calculated value from the testAdd() and testMul() functions so\
    \ that we can ensure that the compiler does not remove the code (because of the\
    \ lack of side effects). In order to time each of these functions, we need to\
    \ simply declare an instance of a Timer class with a suitable label at the start\
    \ of the function. The timing is started as soon as the Timer object is instantiated\
    \ and stopped when that object goes out of scope."

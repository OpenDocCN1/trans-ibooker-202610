  md: '# Introduction


    During the **Software Development Life Cycle (SDLC)**, once the requirement gathering
    phase is complete, then generally comes the Design and Architecture phase, wherein
    the high-level flow of the project is defined and broken down into smaller components
    of modules. When there are many team members in a project, it is necessary that
    each team member is clearly assigned a specific part of the module and that they
    are aware of their requirements. This way, they can independently write their
    part of the code in an isolated environment and make sure it works fine. Once
    their part of the work is complete, they can integrate their module with the other
    developer''s modules and make sure the overall project is executing as per the
    requirements.


    This concept can be applied to small projects too, where the developer is completely
    working on a requirement, breaking it down into smaller components, developing
    components in an isolated environment, making sure it executes as per the plan,
    integrating all the small modules to complete the project, and finally testing
    it to ensure that the overall project is working fine.


    There is a good amount of testing required when the whole project is integrated
    and executed. There may be a separate team (known as **Quality Assurance**, that
    is, **QA**) dedicated to performing this task. Rather than finding issues at the
    project level, it is a good strategy to test the code at each isolated stage.
    This testing needs to be performed by the developer who''s responsible for that
    module. This type of testing is known as unit testing. Here, a developer can simulate
    the environment that''s needed to run that module and make sure they test a specific
    part of functionality written in a module. For example, let''s assume that, in
    a big project, there is a small module whose functionality is to parse the configuration
    file and get the parameters that are needed to set up the environment. If part
    of the code that parses the file takes an **IP address** as a **string**, then
    the developer needs to ensure it is in the format **XXX.XXX.XXX.XXX**, where **X**
    is a digit from **0–9**. The length of the string must be of limited size.


    Here, the developer can create a test program that executes their part of the
    code: parsing the file, extracting the **IP address** as a string, and testing
    if it is in the correct format. Similarly, if the configuration has other parameters
    to be parsed and they need to be in a specific format such as **userid / password**,
    file location for the log or mount point, and so on, then all these will be part
    of the unit testing for that module. In this chapter, we''ll explain techniques
    such as **assertions, safety nesting (exception handling), unit testing, mocking,
    breakpoints, watchpoints, and data visualization** to pinpoint the source of errors
    and limit their growth. In the next section, we''ll explore the assertion technique.'
  merge: -1
  img_proc: true
- pgno: 501
  md: '# Assertions


    Using testing condition for the aforementioned scenario will help the project
    develop in a better way as the flaws will be caught at a base level rather than
    at the later QA level. There may be scenarios wherein even after writing the unit
    test cases and successful execution of the code, issues may be found sch as the
    application crashing, the program exiting unexpectedly, or the behavior is not
    as expected. To overcome such scenarios, generally, a developer uses a debug mode
    binary to recreate the problem. Asserts are used to ensure that the conditions
    are checked, otherwise the program''s execution is terminated.


    This way, the problem can be traced fast. Also, in Debug Mode, the developer can
    traverse the actual execution of the program line by line and check if the flow
    of code is as expected or if the variables are set as expected and accessed correctly.
    Sometimes, accessing pointer variables causes unexpected behaviors if they are
    not pointing to a valid memory location.


    When writing code, we can check if the necessary condition is satisfied. If not,
    then the programmer may not want to execute the code further. This can be easily
    done using an assertion. An assertion is a macro where the specific condition
    is checked and if it doesn''t meet the criteria, abort is called (program execution
    is stopped) and an error message is printed as a standard error. This is generally
    a runtime assertion. There can also be an assertion done at compile time. We will
    talk about this later. In the next section, we''ll solve an exercise wherein we''ll
    be writing and testing our first assertion.


    # Exercise 1: Writing and Testing Our First Assertion


    In this exercise, we''ll write a function to parse an IP address and check if
    it''s valid. As part of our requirements, the IP address will be passed as a string
    literal in the XXX.XXX.XXX format. In this format, X represents a digit from 0-9.
    So, as part of testing to check whether the string being parsed is correct or
    not, we need to ensure that the string is not null and has a length that''s less
    than 16. Follow these steps to implement this exercise:


    +   1. Create a new file named AssertSample.cpp.


    +   2. Open the file and write the following code to include the header files:


    ```

    #include<iostream>

    #include<cassert>

    #include<cstring>


    using std::cout;

    using std::endl;

    ```'

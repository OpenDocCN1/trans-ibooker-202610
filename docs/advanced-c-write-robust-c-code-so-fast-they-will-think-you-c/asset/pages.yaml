  md: "In the header file, we add the following declarations:\n\n```\nDialog(const\
    \ Dialog& rhs);\n```\n\n```\nDialog& operator=(const Dialog& rhs);\n```\n\nAnd\
    \ the implementation would look like:\n\n```\nDialog::Dialog(const Dialog& rhs)\
    \ : m_pImpl(nullptr)\n{\n    if (this == &rhs)    // do nothing on copying self\n\
    \        return;\n    if (rhs.m_pImpl)    // rhs has something -> clone it\n \
    \       m_pImpl = std::make_unique<DialogImpl>(*rhs.m_pImpl);\n}\n```\n\n```\n\
    Dialog& Dialog::operator=(const Dialog& rhs)\n{\n    if (this == &rhs)    // do\
    \ nothing on assigning to self\n        return *this;\n    if (!rhs.m_pImpl) \
    \   // rhs is empty -> delete ours\n    {\n        m_pImpl.reset();\n    }\n \
    \   else if (!m_pImpl)    // ours is empty -> clone rhs\n    {\n        m_pImpl\
    \ = std::make_unique<DialogImpl>(*rhs.m_pImpl);\n    }\n    else // use copy of\
    \ DialogImpl\n    {\n        *m_pImpl = *rhs.m_pImpl;\n    }\n}\n```"

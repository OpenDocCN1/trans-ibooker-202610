  img_proc: true
- pgno: 81
  md: 'While this is a perfectly valid piece of C++ code, it is quite difficult to
    read. Let''s list the problems with it. First of all, let''s look at the style
    problems of the identifiers. The **studentsFile** class name starts with a lowercase
    letter, which should have been uppercase instead. The **File** variable should
    have started with a lowercase letter. The **Count_Names** variable should have
    started with a lowercase letter and should not have had an underscore in it. The
    **CheckNextElement** method should have started with a lowercase letter. While
    these may seem arbitrary rules, being consistent in naming carries extra information
    about the name—when you see a word that starts with an uppercase letter, you immediately
    understand that it must be a class name. Furthermore, it is simply a distraction
    to have names that do not obey the standard in use.


    Now, let''s look beyond the style and inspect the names themselves. The first
    problematic name is the **runFileCheck** function. A method is an action that
    returns a value: its name should both clearly explain what it does as well as
    what it returns. "Check" is an overused word that is too vague for most situations.
    Yes, we checked it, it''s there—what should we do with it then? In this case,
    it seems we actually read the file and create a **File** object. In that case,
    **runFileCheck** should have been **readFile** instead. This clearly explains
    the action being taken, and the return value is what you would expect. If you
    wanted to be more specific about the return value, **readAsFile** could be another
    alternative. Similarly, the **check** method is vague and should be **exists**
    instead. The **CheckNextElement** method is also vague and should be **nextElementExists**
    instead.


    Another overused vague word is **flag**, which is often used for Boolean variables.
    The name suggests an on/off situation but gives no clue as to what its value would
    mean. In this case, its **true** value means that the file exists, and the **false**
    value means that the file does not exist. The trick for naming Boolean variables
    is to devise a question or statement that is correct when the value of the variable
    is **true**. In this example, **fileExists** and **doesFileExist** are two good
    choices.


    Our next misnamed variable is **Count_Names**, or **countNames** with its correct
    capitalization. This is a bad name for an integer because the name does not suggest
    a number—it suggests an action that results in a number. Instead, an identifier
    such as **numNames** or **nameCount** would clearly communicate what the number
    inside means.'

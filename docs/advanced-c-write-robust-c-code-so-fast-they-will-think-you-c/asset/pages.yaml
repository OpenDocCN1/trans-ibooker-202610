  md: "There is one more important thing to take note of. If you don't want any results\
    \ from the thread and would prefer to wait until the thread finishes its work,\
    \ you can use **std::future<void>**. Now, when you call **future.get()**, your\
    \ current thread will wait at this point. Let's consider an example:\n\n```\n\
    ```cpp\n#include <iostream>\n#include <future>\n\nvoid toUppercase(const std::string&\
    \ bufIn)\n{\n    std::string bufferOut;\n    for (std::string::const_iterator\
    \ iter = bufIn.begin(); iter != bufIn.\nend(); iter++)\n    {\n        if (*iter\
    \ >= 97 && *iter <= 122)\n        {\n            bufferOut += static_cast<char>(static_cast<int>(*iter)\
    \ - 32);\n        }\n        else\n        {\n            bufferOut += *iter;\n\
    \        }\n    }\n    using namespace std::chrono_literals;\n    std::this_thread::sleep_for(2s);\n\
    \    std::cout << bufferOut << std::endl;\n}\n\nint main()\n{\n    std::packaged_task<void(const\
    \ std::string&)> task(toUppercase);\n    auto futureResult = task.get_future();\n\
    \    std::thread thr1(std::move(task), \"please, make it uppercase\");\n```\n\
    ```"

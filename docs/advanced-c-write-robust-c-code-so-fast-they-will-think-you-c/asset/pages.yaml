  md: '10. Here, we are just summing the result of sumVector() to a dummy double value
    many time and printing it. After you make the changes in the code, open the Terminal
    and write the following commands:


    ```

    $ g++ -O3 Snippet1.cpp

    $ time ./a.out

    ```


    The output of the previous commands is as follows:


    ![](img/6507d435e2edfa3c00c220d0ccfcaf94_574_0.png)


    Figure 8.16: Output of timing the Snippet1.cpp code with a side effect of printing
    the value


    In the preceding output, we can see that the program actually performed the computation
    instead of just running as an empty program. Printing the total to cout is a side
    effect that causes the compiler not to elide the code. Causing a side effect (such
    as printing a result) that depends on the code''s execution is one way to prevent
    the compiler optimizer from removing code. In the next section, we''ll learn how
    to time programs without side effects.


    # Timing Programs without Side Effects


    As seen in the previous exercise, we needed to create a side effect (using cout)
    in our program so that the compiler did not ignore all the code we wrote. Another
    technique to make the compiler believe that a piece of code has a side effect
    is to assign its result to a volatile variable. The volatile qualifier tells the
    compiler: "This variable must always be read from memory and written to memory,
    and not from a register." The main purpose of a volatile variable is to access
    device memory, and such device memory access must follow the rule mentioned above.
    Effectively, volatile variables are considered by the compiler as if they could
    change from effects outside of the current program, and thus will never be optimized.
    We will use this technique in the upcoming sections.


    There are more advanced ways to bypass this problem, that is, by specifying special
    assembly code directives to the compiler rather than using side effects. But they
    are outside the scope of this introductory material. For the examples that follow,
    we''ll always add code that ensures that a function''s result is used in a side
    effect or is assigned to a volatile variable. In future sections, we''ll learn
    how to examine the compiler generated assembly code and detect instances when
    the compiler elides code for optimization purposes.'

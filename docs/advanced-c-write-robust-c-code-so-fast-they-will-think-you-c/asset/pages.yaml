  md: "Even though modern processors mitigate the overhead of branching by means of\
    \ **branch prediction** and **speculative execution** circuits, loop unrolling\
    \ still produces performance benefits. Loop unrolling optimizations can be enabled\
    \ on the **gcc** and **clang** family of compilers with the **-funroll-loops**\
    \ command-line flag. In the next section, we'll test the performance of a program\
    \ with and without loop unrolling enabled.\n\n# Exercise 4: Using Loop Unrolling\
    \ Optimizations\n\nIn this exercise, we'll write a simple program that uses nested\
    \ loops and test its performance with and without loop unrolling enabled. We'll\
    \ understand the way compilers implement the automatic unrolling of loops.\n\n\
    Perform these steps to complete this exercise:\n\n+   1. Create a file named **Snippet3.cpp**.\n\
    +   2. Write a program that takes the first **10,000** numbers and prints out\
    \ how many of these are factors of each other (the full code can be found in **Snippet3.cpp**):\n\
    +   3. Save the program and open the terminal. Compile the program with the **-O3**\
    \ flag first and time it using the following command:\n\n```\n# include <iostream>\n\
    int main()\n{\n    int ret = 0;\n    for(size_t i = 1; i < 10000; ++i)\n    {\n\
    \        for(size_t j = 1; j < 10000; ++j)\n        {\n            if(i % j ==\
    \ 0)\n            {\n                ++ret;\n            }\n        }\n    }\n\
    \n    std::cout << \"Result: \" << ret << std::endl;\n}\n```\n\n```\n$ g++ -O3\
    \ Snippet3.cpp\n$ time ./a.out\n```"

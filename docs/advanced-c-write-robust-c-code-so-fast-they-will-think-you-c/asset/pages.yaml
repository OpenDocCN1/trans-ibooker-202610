- pgno: 626
  md: "Let's rewrite the version of the program that uses the lookup table for **isspace**\
    \ using the standard algorithms. If we look at the main loop that counts the words,\
    \ we are taking 2 characters, and depending on some logic, we are accumulating\
    \ 1 or 0 into the **count** variable. This is a common pattern seen in a lot of\
    \ code:\n\n```\nX OP (a[0] OP2 b[0]) OP (a[1] OP2 b[1]) OP (a[2] OP2 b[2]) ...\
    \ OP (a[N] OP2 b[N])\n```\n\nHere, **a** and **b** are arrays of size **N**, **X**\
    \ is an initial value, and **OP** and **OP2** are operators. There is a standard\
    \ algorithm that encapsulates this pattern called **std::inner_product** – it\
    \ takes two sequences, applies an operator (OP2) between each pair of elements,\
    \ and applies another operator (OP) across these, starting with an initial value\
    \ X.\n\n# 8. We can write the function as follows (the full code can be found\
    \ in **Snippet16.cpp**):\n\n```\nint wordCount(const std::string &s)\n{\n    //\
    \ Create a lookup table for every char\n    bool table[256];\n    for(int i =\
    \ 0; i < 256; ++i)\n    {\n        table[i] = isspace((unsigned char)i) ? 1 :\
    \ 0;\n    }\n\n    auto isWordEnd = [&](char a, char b)\n    {\n        return\
    \ !table[a] & table[b];\n    };\n\n    return std::inner_product(s.begin(), s.end()-1,\
    \ s.begin()+1, 0,\n    std::plus<int>(), isWordEnd);\n}\n```\n\nThis **inner_product()**\
    \ call applies the **isWordEnd()** lambda on every **s[n]** and **s[n+1]** and\
    \ applies the standard addition function between the results of these. In effect,\
    \ we are adding 1 to the total when **s[n]** and **s[n+1]** are on a word ending.\n\
    \n> **Note**\n> \n> Even though this looks like a number of nested function calls,\
    \ the compiler inlines everything and there is no overhead."

  md: "# Introduction\n\nIn the previous chapter, we learned how to develop our own\
    \ types (classes) with the help of unit tests and made them behave like built-in\
    \ types. We were introduced to function overloading, Rule of Three/Five, and Rule\
    \ of Zero.\n\nIn this chapter, we will learn how to extend the type system even\
    \ further. We'll learn how to create functions and classes using templates and\
    \ revisit function overloading since it's impacted by the use of templates. We'll\
    \ be introduced to a new technology, SFINAE, and use it to control the parts of\
    \ our templates that are included in the generated code.\n\n# Inheritance, Polymorphism,\
    \ and Interfaces\n\nSo far in our journey of object-oriented design and C++, we\
    \ have focused on abstraction and data encapsulation. We will now turn our attention\
    \ to inheritance and polymorphism. What is inheritance? What is polymorphism?\
    \ Why do we need it? Consider the following three objects:\n\n![](img/6507d435e2edfa3c00c220d0ccfcaf94_162_0.png)\n\
    \nIn the preceding diagram, we can see that there are three very different objects.\
    \ They have some things in common. They all have wheels (a different number),\
    \ an engine (different size, power, or configuration), start engine, drive, apply\
    \ brakes, stop engine, and so on, using which we can do something.\n\nSo, we can\
    \ abstract them into something called a vehicle that demonstrates these attributes\
    \ and general behaviors. If we express this as a C++ class, it might look like\
    \ the following:\n\n```\nclass Vehicle\n{\npublic:\n    Vehicle() = default;\n\
    \    Vehicle(int numberWheels, int engineSize) :\n        m_numberOfWheels{numberWheels},\
    \ m_engineSizeCC{engineSize}\n    {\n    }\n\n```"

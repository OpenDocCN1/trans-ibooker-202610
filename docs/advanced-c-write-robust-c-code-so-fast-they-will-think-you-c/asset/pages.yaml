- pgno: 432
  md: "+   4. Create the ostringstream object, that is, oss, that will hold the converted\
    \ string:\n+       std::ostringstream oss;\n\n+   5. Then, in the loop, while\
    \ there is possible input, perform a read of the word to the word variable. Check\
    \ if this word is equal to the wordToBeReplaced variable. If so, replace it with\
    \ the wordReplaceBy variable and write to the oss stream. If they are unequal,\
    \ write the original word to the oss stream. After each word, add a whitespace\
    \ character since the iss stream truncates them. Finally, return the result. The\
    \ complete class is as follows:\n\n```\nclass Replacer\n{\npublic:\n    std::string\
    \ operator()(const std::string& originalString,\n                            const\
    \ std::string& wordToBeReplaced,\n                            const std::string&\
    \ wordReplaceBy)\n    {\n        std::istringstream iss(originalString);\n   \
    \     std::ostringstream oss;\n\n        std::string word;\n        while (iss\
    \ >> word)\n        {\n            if (0 == word.compare(wordToBeReplaced))\n\
    \            {\n                oss << wordReplaceBy << \" \";\n            }\n\
    \            else\n            {\n                oss << word << \" \";\n    \
    \        }\n        }\n\n        return oss.str();\n    }\n};\n```"

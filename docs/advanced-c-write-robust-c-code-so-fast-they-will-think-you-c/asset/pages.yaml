    # Structures and Classes


    Enumerations are the first of the user-defined types, but they do not really extend
    the language so that we can express the solutions to our problems at the appropriate
    level of abstraction. Structs and classes, however, allow us to capture and group
    the data and then associate methods to manipulate that data in a consistent and
    meaningful manner.'

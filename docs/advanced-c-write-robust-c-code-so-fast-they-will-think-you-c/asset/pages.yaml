  md: "Everything after **[captures]** is the same as for a normal function definition,\
    \ except that the name is missing. Lambdas are a convenient way of defining a\
    \ short method (just a few lines) at the location it will be used. The lambda\
    \ is often passed as an argument and will typically not be re-used. It should\
    \ also be noted that a lambda can be assigned to a variable (usually declared\
    \ with auto).\n\nWe can re-write the previous program where we used a **Scaler**\
    \ class to use a lambda to achieve the same outcome:\n\n```\n#include <iostream>\n\

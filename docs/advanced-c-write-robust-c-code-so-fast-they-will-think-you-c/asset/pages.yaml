  md: "So far, the multiple constructors on **Fraction** and the overloaded arithmetic\
    \ operators are all examples of overloaded functions that the compiler has to\
    \ refer to when it meets one of these functions. Consider the following code:\n\
    \n```\nint main(int argc, char** argv) {\n    print(42);\n}\n```\n\nWhen the compiler\
    \ meets the line **print(42)**, it needs to work out which of the previously defined\
    \ functions to call, so it performs the following process (grossly simplified):\n\
    \n![](img/6507d435e2edfa3c00c220d0ccfcaf94_154_0.png)\n\nFigure 2A.44: Function\
    \ overload resolution (simplified)\n\nThe C++ standard defines rules for how the\
    \ compiler determines the best candidate function based on how it has to manipulate\
    \ (that is, convert) the arguments to get a match. If no conversions are required,\
    \ then that function is the best match.\n\n# Classes, Structs, and Unions\n\n\
    When you define a class and do not specify an access modifier (public, protected,\
    \ private), all the members will be private by default:\n\n```\nclass Fraction\n\
    {\n    Fraction() {};        // All of these are private\n    int m_numerator;\n\
    \    int m_denominator;\n};\n```"

  md: "To attain the preceding objective, we have the following definitions:\n\nAddition\
    \  a/b + c/d = (a.d + b.c)/(b.d)  Multiplication  a/b × c/d = (a.c)/(b.d)\nSubtraction\
    \  a/b - c/d = (a.d - b.c)/(b.d)  Division  a/b ÷ c/d = a/b × d/c = (a.d)/(b.c)\n\
    \nFigure 2A.32: Definitions of operations\n\nIn addition, the operations that\
    \ we perform will need to normalize the fraction by reducing it to the lowest\
    \ terms. To do this, the numerator and the denominator are both divided by their\
    \ greatest common divisor (GCD).\n\n# Constructors, Initialization, and Destructors\n\
    \nA class definition, as expressed in C++ code, is the pattern that's used for\
    \ creating objects in memory and manipulating objects through their methods. The\
    \ first thing that we need to do is tell the compiler that we wish to declare\
    \ a new type – a class. To declare the Fraction class, we start with the following:\n\
    \n```\nclass Fraction\n{\n};\n```\n\nWe place this in a header file, Fraction.h,\
    \ as we wish to reuse this class specification in other areas of our code.\n\n\
    The next thing we need to do is introduce the data to be stored in the class,\
    \ which in this case are m_numerator and m_denominator. These are both of the\
    \ int type:\n\n```\nclass Fraction\n{\n    int m_numerator;\n    int m_denominator;\n\
    };\n```\n\nWe have now declared the data to be stored and given them names that\
    \ anyone familiar with mathematics would understand regarding what each member\
    \ variable stores:\n\nfraction = numerator / denominator\n\nFigure 2A.33: Formula\
    \ of fraction"

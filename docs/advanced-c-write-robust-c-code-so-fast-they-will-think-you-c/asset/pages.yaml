- pgno: 575
  md: '# Source Code Instrumentation


    **Instrumentation** is a term that refers to the process of adding extra code
    to a program, without changing its behavior, and capturing the information as
    it executes. This may include performance timing (and possibly other measurements
    such as memory allocation, or disk usage patterns). In the case of source code
    instrumentation, we manually add code to time the execution of our program and
    log that data when the program ends, for analysis. The advantage of this approach
    is its portability and avoidance of any external tools. It also allows us to selectively
    add the timing to any part of the code we choose.


    # Exercise 2: Writing a Code Timer Class


    In this exercise, we’ll create an **RAII** class that allows us to measure the
    execution time of individual blocks of code. We will use this as the primary timing
    mechanism for the code in the exercises that follow. It is not as sophisticated
    as other methods of performance measurement but is much easier to use and serves
    most purposes. The basic requirement of our class is as follows:


    +   - We need to be able to record the cumulative time taken by a block of code.

    +   - We need to be able to record the number of times it is invoked.


    Perform the following steps to complete this exercise:


    +   1. Create a file named **Snippet2.cpp**.

    +   2. Include the following headers:


    ```

    #include <map>

    #include <string>

    #include <chrono>

    #include <iostream>

    #include <cstdint>


    using std::map;

    using std::string;

    using std::cerr;

    using std::endl;

    ```'
  merge: -1
  img_proc: true
- pgno: 576
  md: "+   3. Define the **Timer** class and the class member functions by writing\
    \ the following code:\n\n```\nclass Timer\n{\n    static map<string, int64_t>\
    \ ms_Counts;\n    static map<string, int64_t> ms_Times;\n    const string &m_sName;\n\
    \    std::chrono::time_point<std::chrono::high_resolution_clock> m_tmStart;\n\
    ```\n\nAs you can see from the preceding code, the class members consist of a\
    \ name, a starting timestamp, and two **static maps**. Every instance of this\
    \ class is meant to time a certain block of code. The block can be a function\
    \ scope or any other block delimited by curly braces. The usage pattern is to\
    \ define an instance of the **Timer** class at the top of the block while passing\
    \ in a name (can be a function name or some other convenient label). When instantiated,\
    \ the current timestamp is recorded, and when the block exits, the destructor\
    \ of this class records the cumulative time elapsed for this block, as well as\
    \ the count of the number of times this block executed. The times and counts are\
    \ stored in the static maps **ms_Times** and **ms_Counts**, respectively.\n\n\
    +   4. Define the constructor of the **Timer** class by writing the following\
    \ code:\n\n```\npublic:\n    // When constructed, save the name and current clock\
    \ time\n    Timer(const string &sName): m_sName(sName)\n    {\n        m_tmStart\
    \ = std::chrono::high_resolution_clock::now();\n    }\n```\n\n+   5. Define the\
    \ destructor of the **Timer** class by writing the following code:\n\n```\n//\
    \ When destroyed, add the time elapsed and also increment the count under this\
    \ name\n~Timer()\n{\n    auto tmNow = std::chrono::high_resolution_clock::now();\n\
    \    auto msElapsed = std::chrono::duration_cast<std::chrono::milliseconds>(tmNow\
    \ - m_tmStart);\n    ms_Counts[m_sName]++;\n    ms_Times[m_sName] += msElapsed.count();\n\
    }\n```"

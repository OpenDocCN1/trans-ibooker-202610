  md: "```\nif(is_valid(buffer))\n    return -3;\n    return 0;\n}\n```\n\nThis is\
    \ typical of many C library functions where a status code is returned and you\
    \ need the main page to know what they mean. In the preceding code, -1, -2, -3,\

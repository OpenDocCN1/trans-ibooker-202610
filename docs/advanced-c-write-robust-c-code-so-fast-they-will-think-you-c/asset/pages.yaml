- pgno: 302
  md: '# Advantages and Disadvantages of PIMPL


    The biggest advantage in the use of PIMPL is that it breaks the compile-time dependencies
    between the clients of a class and its implementation. This allows for faster
    build times because PIMPL eliminates a large number of #include directives in
    the definition (header) file, instead pushing them to only be necessary in the
    implementation file.


    It also decouples the implementation from the clients. We are now free to change
    the implementation of the PIMPL class and only that file needs recompilation.
    This prevents compilation cascades where changes to hidden members trigger the
    rebuilding of clients. This is called a compilation-firewall.


    Some other advantages of the PIMPL idiom are as follows:


    +   - **Data Hiding** – the internal details of implementation are truly isolated
    in the implementation class. If this is part of a library, then it can be used
    to prevent the disclosure of information, such as Intellectual property.

    +   - **Binary Compatibility** – the binary interface of the class is now independent
    of the private fields. This means we can add fields to the implementation without
    affecting the client. It also means we could deploy the Implementation class in
    a shared library (DLL, or .so file) and be free to change it without affecting
    the client code.


    Such advantages come at a cost. The disadvantages are as follows:


    +   - **Maintenance Effort** – there is additional code in the visible class that
    forwards the calls to the Implementation class. This adds a level of indirection
    with a minor increase in complexity.

    +   - **Memory Management** – the addition of a pointer for the implementation
    now requires us to manage the memory. It also requires additional storage to hold
    the pointer and, in a memory constrained system (For example: Internet of Things
    device) this may be critical.


    # Implementing PIMPL with unique_ptr<>


    Our current implementation of Dialog uses a raw pointer to hold the PIMPL implementation
    reference. In Chapter 3, The Distance between Can and Should - Objects, Pointers
    and Inheritance, we discussed ownership of objects and introduced smart pointers
    and RAII. The hidden object pointed to by the PIMPL pointer is a resource to be
    managed and should be executed using RAII and std::unique_ptr. As we shall see,
    there are some caveats for implementing PIMPL with std::unique_ptr.'

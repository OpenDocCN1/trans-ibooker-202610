- pgno: 472
  md: "```\n```cpp\nHANDLE hEvent = o.hEvent;\n\nWaitForSingleObject(hEvent, INFINITE);\n\
    \nCloseHandle(hFile);\n\nreturn 0;\n}\n```\n```\n\nIt's a pretty easy approach\
    \ if you wish to notify the calling thread about the end of the I/O operation.\
    \ But this is not the ideal way to do this because when there are a lot of these\
    \ operations, you need to create an event object for each of them.\n\n**One more\
    \ approach that's not the best:** The alertable I/O works in the following way.\
    \ We call **ReadFileEx** and **WriteFileEx** to the input/output. They are similar\
    \ to the standard **ReadFile** and **WriteFile**, but we don't pass the variable\
    \ that stores the number of read or write characters and we pass an address of\
    \ the callback function. This callback function is called a completion routine\
    \ and has the following declaration:\n\n```\n```cpp\nVOID WINAPI\n\nCompletionRoutine(DWORD\
    \ dwError,\n                  DWORD dwNumBytes,\n                  OVERLAPPED*\
    \ po);\n```\n```\n\n**ReadFileEx** and **WriteFileEx** pass the address of the\
    \ callback function to the device driver. When the operation has finished on the\
    \ device, the driver adds the address of the callback function to the APC queue\
    \ and the pointer to the OVERLAPPED structure. Then, the OS invokes this function\
    \ and passes the number of read or write bytes, error code, and pointer to the\
    \ OVERLAPPED structure.\n\nThe main cons of this approach are writing callback\
    \ functions and using a lot of global variables because callback functions have\
    \ a small amount of information in the context. Another reason not to use this\
    \ approach is that only the calling thread can receive the notification regarding\
    \ completion."

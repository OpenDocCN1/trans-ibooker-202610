    \ the function that will be our signal handler, that is, **aioSigHandler**. It\
    \ will be called when the async operation is done. Signal handlers should have\
    \ the following signature:\n\n```\nvoid name(int number, siginfo_t* si, void*\
    \ additional)\n```\n\n4. The first parameter is a signal number, the second parameter\
    \ is a structure that contains information about why the signal was generated,\
    \ and the last parameter is additional information. It can be cast to a pointer\
    \ of the **ucontext_t** structure so that we can receive the thread context that\

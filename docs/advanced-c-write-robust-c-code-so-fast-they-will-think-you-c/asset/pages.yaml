  md: "```\n}\n\nprivate:\n    FILE* m_file{};\n};\n```\n\nThis class implements the\
    \ following characteristics:\n\n+   - The constructor acquires the resource.\n\
    +   - If the resource is not acquired in the constructor, then an exception is\
    \ thrown.\n+   - When the class is destroyed, the resource is released.\n\nIf\
    \ we use this class in the **do_something()** method, it then looks like this:\n\
    \n```\nvoid do_something()\n{\n    try\n    {\n        File in(\"input.txt\",\
    \ \"r\");\n        File out(\"output.txt\", \"w\");\n\n        // Do some work\n\
    \    }\n    catch(std::exception& e)\n    {\n        // Respond to the exception\n\
    \    }\n}\n```\n\nIf an exception occurs while doing this, then C++ guarantees\
    \ that all stack-based objects will have their destructors called (**stack unwinding**),\
    \ thus ensuring that the files are closed. This solves the problem of resources\
    \ leaking with the occurrence of an exception as the resources are now automatically\
    \ cleaned up. In addition, this method is extremely easy to read so that we can\
    \ understand the logic flow without having to worry about error handling."

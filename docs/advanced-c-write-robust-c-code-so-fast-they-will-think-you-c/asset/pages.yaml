    \    if (si->si_code == SI_ASYNCIO)\n    {\n        std::cout << \"I/O completion\
    \ signal received\" << std::endl;\n    }\n    isDone = true;\n}\n```\n\n5. Define\
    \ another helping function called **initSigAct**. It will initialize the **sigaction**\
    \ structure. This structure defines which signal will be sent on the I/O operation's\
    \ finish and which handler should be called. Here, we chose **SIGUSR1** – a user-defined\
    \ signal. In **sa_flags**, set that we want this signal to be delivered on action\
    \ restart or information received:\n\n```\nbool\ninitSigAct(struct sigaction&\
    \ item)\n{\n    item.sa_flags = SA_RESTART | SA_SIGINFO;\n    item.sa_sigaction\
    \ = aioSigHandler;\n```"

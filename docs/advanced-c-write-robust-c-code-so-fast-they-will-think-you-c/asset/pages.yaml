  md: "We can also create the shared future object using the **share()** member function\
    \ of the **sdt::future** object:\n\n```\nstd::future<std::string> result = std::async(toUppercase,\
    \ \"please, make it uppercase\");\nstd::cout << \"Main thread isn't locked\" <<\
    \ std::endl;\n```\n\n```\nauto sharedResult = result.share();\nstd::cout << \"\
    Future result = \" << sharedResult.get() << std::endl;\n```\n\nPay attention that,\
    \ in both cases, the **std::future** object becomes invalid.\n\nAnother way we\
    \ can get a future result from a separate thread is by using the **std::packaged_task<>**\
    \ template class. How do we work with them?\n\n+   1. We create a new **std::packaged_task**\
    \ and declare the callable function signature:\n+      ```\n+      std::packaged_task<std::string(const\
    \ std::string&)> task(toUppercase);\n+      ```\n+   2. Then, we store the future\
    \ result in the **std::future** variable:\n+      ```\n+      auto futureResult\
    \ = task.get_future();\n+      ```\n+   3. Next, we run this task in a separate\
    \ thread or call it as a function:\n+      ```\n+      std::thread thr1(std::move(task),\
    \ \"please, make it uppercase\");\n+      thr1.detach();\n+      ```\n+   4. Finally,\
    \ we wait until the future results are ready:\n+      ```\n+      std::cout <<\
    \ \"Future result = \" << futureResult.get() << std::endl;\n+      ```\n\n> **Note**\n\
    > \n> **std::packaged_task** is non-copyable. So, to run it in the separate thread,\
    \ use the **std::move()** function."

- pgno: 168
  md: '# Inheritance and Access Specifiers


    As we mentioned previously, the general form of inheriting one subclass from a
    super class is as follows:


    ```

    class DerivedClassName : access_modifier BaseClassName

    ```


    When we derived Motorcycle class from Vehicle class, we use the following code:


    ```

    class Motorcycle : public Vehicle

    ```


    The access modifier is optional and is one of the ones that we have met before:
    public, protected, and private. In the following table, you can see the accessibility
    of the base classes'' members. If access_modifier is omitted, then the compiler
    assumes private was specified.


    | Access specifier In Base Class | Effective Access specifier in Derived Class
    when |  |  |

    |---|---|---|---|

    |  | public Base class | protected Base class | private Base class |

    | public | public | protected | private |

    | protected | protected | protected | private |

    | private | inaccessible | inaccessible | inaccessible |


    Figure 2B.5: Accessibility of base class members in derived classes


    # Abstract Classes and Interfaces


    All the classes that we have talked about up until now are concrete class – they
    can be instantiated as a type for a variable. There is another type of class –
    an abstract class – that contains at least one pure virtual member function. A
    pure virtual function is a virtual function that has no definition (or implementation)
    in the class. And because it has no implementation, the class is malformed (or
    abstract) and cannot be instantiated. If you attempt to create a variable of an
    abstract type, then the compiler will generate an error.


    To declare a pure virtual member function, end the function prototype declaration
    with = 0. To make Drive() a pure virtual function in the Vehicle class, we would
    declare it as follows:


    ```

    virtual void Drive() = 0;

    ```


    Now, to be able to use a derived class as a variable type (for example, the Motorcycle
    class), it must define an implementation of the Drive() function.


    You can, however, declare a variable to be either a pointer to the abstract class
    or a reference to the abstract class. In either case, it must point to, or reference,
    some non-abstract class derived from the abstract class.'

- pgno: 751
  md: 'Here are the answers to these questions:


    +   - Why is the improvement in performance so meager with the Bloom Filter?

    +     `std::unordered_set` performs one hash operation and perhaps a couple of
    memory accesses before reaching the value that''s stored. The Bloom filter we
    use performs three hash operations and three memory accesses. So, in essence,
    the work that''s done by the bloom filter is more than the hash table. Since there
    are only 31,870 words in our dictionary, the cache benefits of the Bloom filter
    are lost. This is another case where the traditional analysis of data structures
    does not correspond to real-life results because of caching.

    +   - What is the effect of using a larger or smaller capacity Bloom filter?

    +     When a larger capacity is used, the number of hash collisions reduce, along
    with false positives, but the caching behavior worsens. Conversely, when a smaller
    capacity is used, the hash collisions and the false positives increase, but the
    caching behavior improves.

    +   - What happens when fewer or more hash functions are used?

    +     The more hash functions are used, the fewer the false positives, and vice
    versa.

    +   - Under what conditions would this version be much faster than the one in
    Speller2.cpp?

    +     Bloom filters work best when the cost of testing a few bits is less than
    the cost of accessing the value in the hash table. This only becomes true when
    the Bloom filter bits fit completely within the cache and the dictionary does
    not.'

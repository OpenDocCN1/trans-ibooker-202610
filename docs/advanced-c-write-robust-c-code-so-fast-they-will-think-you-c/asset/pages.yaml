- pgno: 257
  md: 'Now that we have fixed the unnecessary deep copy problem, we can actually remove
    the copy operations from smart_ptr() as the transfer of ownership is actually
    what we want. If we were to copy an instance of a non-temporary smart_ptr to another
    instance of a non-temporary instance of smart_ptr, then we would have two objects
    that would delete the resource when they go out of scope, and this is not the
    desired behavior. To remove the (deep) copy operations we change the definition
    of our member functions, as follows:


    ```

    smart_ptr(const smart_ptr& a) = delete;


    smart_ptr& operator=(const smart_ptr& a) = delete;

    ```


    The postfix of = delete which we looked at in Chapter 2A, No Ducks Allowed – Types
    and Deduction, tells the compiler that an attempt to access a function with that
    prototype is now not valid code and causes an error.


    # STL Smart Pointers


    Instead of having to write our own smart_ptr, the STL provides classes that we
    can use to implement RAII on our objects. The original was std::auto_ptr(), which
    was deprecated in C++ 11 and removed in C++ 17. It was created before rvalue reference
    support and caused problems because it implemented move semantics using copy.
    C++ 11 introduced three new templates to manage lifetime and ownership of resources:


    +   - **std::unique_ptr**: Owns and manages a single object via a pointer and
    destroys that object when unique_ptr goes out of scope. It has two versions: for
    single objects (created using new) and for array of objects (created using new[]).
    unique_ptr is as efficient as using the underlying pointer directly.

    +   - **std::shared_ptr**: Retains shared ownership of an object through a pointer.
    It manages the resource through the use of a reference counter. Every copy of
    shared_ptr that''s assigned to shared_ptr updates the reference count. When the
    reference count goes to zero, this means that there are no owners left and the
    resource is released/destroyed.

    +   - **std::weak_ptr**: Provides an interface to the same resource as shared_ptr,
    but does not modify the counter. It can be checked to see if the resource still
    exists, but it will not prevent the resource from being destroyed. If you determine
    that the resource still exists, then it can be used to obtain a shared_ptr to
    the resource. One use case for it is a scenario where multiple shared_ptrs end
    in cyclic references. A cyclic reference would prevent the auto releasing of resources.
    weak_ptr is used to break the loop and allow the resources to be freed when they
    should be.'
  merge: -1

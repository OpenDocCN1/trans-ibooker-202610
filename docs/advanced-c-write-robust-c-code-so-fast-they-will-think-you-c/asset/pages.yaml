  md: 'Difficulties will arise if Thread B executes first. It will lead to Thread
    B changing the value before Thread A reads it. The order of the execution of threads
    should be strictly guaranteed. Thread B should write the new value to a variable
    only after Thread A reads its value. The following diagram will help you clarify
    the RAW data dependency that leads to data hazards:


    ![](img/6507d435e2edfa3c00c220d0ccfcaf94_370_0.png)


    Figure 5.12: WAR data dependency between two threads


    # WAW Dependency


    A WAW dependency occurs when several threads change the value of the same variable,
    and some thread reads for its calculations. For example, Thread A executes its
    job and writes the results to a variable. Thread B reads the value of the variable
    and executes its job. Thread C executes its job and writes the results to the
    same variable. In pseudocode, this looks as follows:


    ```

    Thread A: a = doSomeStuff();

    Thread B: b = a - doOtherStuff();

    Thread C: a = doNewStuff();

    ```'

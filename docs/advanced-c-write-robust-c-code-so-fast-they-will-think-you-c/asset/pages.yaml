- pgno: 610
  md: '# Caching


    Modern processors have multiple layers of cache memory between the processor registers
    and the RAM. These caches are labeled L1, L2, L3, L4, and so on, where L1 is closest
    to the processor and L4 is the furthest. Every cache layer is faster (and usually
    smaller) than the level below it. Here is an example of the cache/memory sizes
    and latencies for a Haswell family processor:


    +   - L1: 32 KB, 4 cycles

    +   - L2: 256 KB, 12 cycles

    +   - L3: 6 MB, 20 cycles

    +   - L4: 128 MB, 58 cycles

    +   - RAM: many GB, 115 cycles


    A simple model of how caches work to help performance is as follows: when a memory
    address is accessed, it is looked up in the L1 cache – if found, it is retrieved
    from there. If not, it is looked up in the L2 cache, if not found, then the L3
    cache and so on – if it wasn''t found in any of the caches, it is fetched from
    memory. When fetched from memory, it is stored in each of the caches for faster
    access later. This method in itself would be fairly useless because it would only
    improve performance if we accessed the same memory address again and again.

    The second aspect, called prefetching, is the mechanism that can make caches really
    pay off.


    # Prefetching


    Prefetching is a process where, when memory access is performed, nearby data is
    also fetched into caches, even though it was not accessed directly. The first
    aspect of prefetching is related to memory bus granularity – it can be thought
    of as "What is the minimum amount of data that the RAM subsystem can send to the
    processor?". In most modern processors, this is 64 bits – in other words, whether
    you ask for a single byte or a 64-bit value from memory, the entire machine word
    of 64 bits that includes that address is read from RAM. This data is stored in
    each layer of cache for faster access later. Obviously, this would immediately
    improve memory performance – say we read a byte of memory at address 0x1000; we
    also get the 7 other bytes after that address into the caches. If we then access
    the byte at address 0x1001, it comes from the cache, avoiding expensive RAM access.'
  merge: -1
  img_proc: true
- pgno: 611
  md: "The second aspect of prefetch takes this one step further – when the contents\
    \ of the RAM at an address is read, the processor reads not only that memory word,\
    \ but much more. On the x86 family of processors, this is between 32 and 128 bytes.\
    \ This is called the **cache line** size – the processor always writes and reads\
    \ memory in chunks of that size. When the CPU hardware detects that memory is\
    \ being accessed in a linear fashion, it prefetches memory into one cache line,\
    \ based on its prediction of what addresses are likely to be accessed subsequently.\n\
    \nCPUs are very clever in detecting regular access patterns both forwards and\
    \ backwards, and will prefetch efficiently. You can also provide hints to the\
    \ processor using special instructions to make it prefetch data according to the\
    \ programmer's direction. These instructions are provided as intrinsic functions\
    \ on most compilers in order to avoid the use of inline assembly language. When\
    \ a memory address is read or written that is not in a cache, it is termed a **cache\
    \ miss**, and is a very expensive event and to be avoided at all costs. The CPU\
    \ hardware tries its best to mitigate cache misses, but the programmer can analyze\
    \ and modify the data access patterns to reduce cache misses maximally. The description\
    \ of caching here is a simplified model for instructional purposes – in reality,\
    \ CPUs have L1 caches for instructions as well as data, multiple cache lines,\
    \ and very complex mechanisms to make sure that multiple processors can keep their\
    \ separate caches in synchronization.\n\n> **Note**\n> \n> A comprehensive description\
    \ of cache implementations (and lots of other information about memory subsystems)\
    \ can be found in this famous online article:\n> https://lwn.net/Articles/250967/.\n\
    \n# Effects of Caching on Algorithms\n\nHaving learned about caches, we can now\
    \ reason why our first example of vector versus list showed surprising results\
    \ – from a computer science perspective, the following is true:\n\n**For a list:**\n\
    \n+   - Iterating to the Nth position is order N complexity.\n+   - Inserting\
    \ or deleting an element is an order 1 complexity."
  merge: -1
  img_proc: true
- pgno: 612
  md: '# For an array (or vector):


    +   - Iterating to the Nth position is order 1 complexity.

    +   - Inserting or deleting an element at location N has complexity proportional
    to (S - N), where S is the size of the array.


    However, for modern architectures, the cost of a memory access is extremely high,
    but the cost of accessing an adjacent address subsequently is almost 0 because
    it would already be in the cache. This means that the iteration upon elements
    in a std::list that are located non-sequentially in memory are likely to always
    cause a cache miss, causing slow performance. On the other hand, since the elements
    of an array or std::vector are always adjacent, caching and prefetching would
    reduce the overall cost of copying (S-N) elements to a new location by a very
    large margin. Hence, the traditional analysis of the two data structures that
    declares that lists work better for random insertions, while technically correct,
    is not practically true, especially given the clearly sophisticated caching behavior
    of modern CPU hardware. When our programs are data bound, the analysis of algorithm
    complexity has to be augmented by understanding of what is known as data locality.


    Data locality can be defined simply as the average distance from the memory address
    that was just accessed to the one that was accessed previously. In other words,
    making memory access across addresses that are far from each other is a severe
    slowdown, since data from closer addresses are likely to have been prefetched
    into the caches. When data is already present in the cache(s), it is termed "hot";
    otherwise, it is termed "cold". Code that takes advantage of the cache is termed
    cache friendly. Cache-unfriendly code, on the other hand would cause the cache
    lines to be wastefully reloaded (termed cache invalidation). In the remainder
    of this section, we will look at strategies regarding how to write cache-friendly
    code.


    # Optimizing for Cache-Friendliness


    In the old days, optimization of code involved trying to minimize the number of
    machine instructions in code, using more efficient instructions, and even reordering
    instructions to allow pipelines to remain full. As of this day and age, compilers
    perform all the aforementioned optimization to a level that most programmers would
    be unable to – especially considering that compilers can do it across entire programs
    of hundreds of millions of instructions. What remains firmly the responsibility
    of the programmer even now is the ability to optimize data access patterns to
    take advantage of caching.'
  merge: -1
  img_proc: true
- pgno: 613
  md: "The task is very simple – make sure that memory is accessed close to the memory\
    \ that was accessed before – but the methodology to achieve this can require lots\
    \ of effort.\n\n> **Note**\n> \n> The famous game programmer and code optimization\
    \ guru Terje Mathisen, in the 90s, is claimed to have said: \"All programming\
    \ is an exercise in caching.\" Today, in 2019, this statement applies more than\
    \ ever in this sub-domain of trying to write fast code.\n\nThere are some basic\
    \ rules of thumb for increasing cache-friendliness:\n\n+   - The stack is always\
    \ \"hot\", and so we should use local variables as much as possible.\n+   - Dynamically\
    \ allocated objects rarely have data locality with each other – avoid them or\
    \ use a preallocated pool of objects so they are in sequential in memory.\n+ \
    \  - Pointer-based data structures such as trees – and especially lists – consist\
    \ of multiple nodes allocated on the heap, and are very cache unfriendly.\n+ \
    \  - Runtime dispatch of virtual functions in OO code invalidates the instruction\
    \ cache – avoid a dynamic dispatch in performance-critical code.\n\nIn the next\
    \ section, we'll explore the cost of heap allocations.\n\n# Exercise 12: Exploring\
    \ the Cost of Heap Allocations\n\nIn this exercise, we will examine the performance\
    \ impact of dynamically allocated memory and examine how heap memory affects the\
    \ code's performance. Perform these steps to complete this exercise:\n\n+   1.\
    \ Create a file named **Snippet11.cpp**.\n+   2. Add the following code to include\

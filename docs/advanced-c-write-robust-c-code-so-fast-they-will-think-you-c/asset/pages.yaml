    # Activity 1: Creating a Simulator to Model the Work of the Art Gallery


    In this activity, we are going to create a simulator to model the working of an
    Art Gallery. We have set a limit of visitors to the Gallery – only 50 people can
    be inside. To implement this simulation, we need to create a Person class that
    will represent people in the Art Gallery. Also, we need a Persons class, which
    is a thread-safe container for people. We also need a Watchman class that controls
    how many people are inside it. If the limit exceeds the Watchman, we put all the
    newcomers into a waiting list. Finally, we need a Generator class that has two
    threads – one for creating new visitors and another for notifying us that somebody
    has to leave the Gallery. Thus, we will cover working with threads, mutexes, condition
    variables, lock_guards, and unique_locks. This simulator will allow us to utilize
    the techniques that we''ve covered in this chapter. Thus, before attempting this
    activity, ensure that you have completed all the previous exercises in this chapter.'

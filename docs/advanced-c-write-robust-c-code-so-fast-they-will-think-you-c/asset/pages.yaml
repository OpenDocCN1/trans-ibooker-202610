  md: "# Exercise 7: Inheriting the Standard Stream Object\n\nIn this exercise, we\
    \ will create a class called **extended_streambuf** that inherits from **std::basic_streambuf**.\
    \ We will use a buffer of the **std::cout** stream object and override the overflow()\
    \ function so that we can write data to an external device (stdout). Next, we\
    \ will write an **extended_ostream** class that inherits from the **std::basic_ostream**\
    \ class and set a stream buffer to **extended_streambuf**. Finally, we will make\
    \ minor changes to our wrapper class and use **extended_ostream** as a private\
    \ stream member. To complete this exercise, perform the following steps:\n\n+\
    \   1. Include the required headers: <iostream> for std::endl support, <sstream>\
    \ for std::ostream and std::basic_streambuf support, <thread> for std::this_thread::get_id()\
    \ support, <chrono> for std::chrono::system_clock::now(), and <ctime> for converting\
    \ timestamps into a readable state.\n+   2. Create a template class called **extended_streambuf**\
    \ that inherits from the **std::basic_streambuf** class. Override a public member\
    \ called **overflow()** that writes a character to the output stream and returns\
    \ the EOF or the written character:\n\n```\ntemplate< class CharT, class Traits\
    \ = std::char_traits<CharT> >\nclass extended_streambuf : public std::basic_streambuf<\
    \ CharT, Traits >\n{\npublic:\n    int overflow( int c = EOF ) override\n    {\n\
    \        if (!Traits::eq_int_type(c, EOF))\n        {\n            return fputc(c,\
    \ stdout);\n        }\n        return Traits::not_eof(c);\n    }\n};\n```"

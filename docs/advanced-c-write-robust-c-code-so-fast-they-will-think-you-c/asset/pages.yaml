    \ So, synchronization is only effective in a pair with a good design.\n\n# Deadlock\n\
    \nThere is one more synchronization issue. Let's go back to the philosophers'\
    \ dinner example. The original issue was that one philosopher has only one chopstick.\
    \ So, they can eat their sushi one by one by sharing chopsticks with each other.\
    \ Although it will take a long time for them to finish their sushi, all of them\
    \ will be well-fed. But if each of them grabs a chopstick at the same time and\
    \ doesn't want to share the second chopstick, they won't be able to eat their\
    \ sushi as each of them will be waiting for the second chopstick forever. This\
    \ leads to a **deadlock**. This happens when two threads are waiting for another\
    \ thread to continue its job. One of the causes of deadlocks is when one thread\
    \ joins another thread, but another thread joins the first thread. So, when both\
    \ threads are joined to each other, none of them can continue their job. Let's\
    \ consider the following example of a deadlock:\n\n```\n#include <thread>\n\n\
    std::thread* thr1;\n\nstd::thread* thr2;\n\nvoid someStuff()\n{\n    thr1->join();\n\
    ```"

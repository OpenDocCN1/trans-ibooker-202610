  md: 'In this line, we see that **std::cout** is called once, but each call to the
    shift operator is actually a different call to the **std::cout** object. So, we
    can rewrite this line as follows:


    ```

    ```cpp

    std::cout << "Counter: ";

    std::cout << counter;

    std::cout << std::endl;

    ```

    ```


    This code does exactly the same as the previous single line, that is, if you call
    this single line from the different threads, your output will be mixed and unclear.
    You can modify it to make it really thread-safe like so:


    ```

    ```cpp

    std::stringstream ss;

    ss << "Counter: " << counter << std::endl;

    std::cout << ss.str();

    ```

    ```


    So, if you output to the Terminal using the second method, your output will be
    clear and thread-safe. This behavior can vary, depending on the compiler or std
    library version. You also have to know that **std::cout** and **std::cin** are
    synchronized among them. This means that invoking **std::cout** always flushes
    the **std::cin** stream and the invocation of **std::cin** always flushes the
    **std::cout** stream.


    The best approach is to wrap all I/O operations in a guard class that will control
    access to the stream using mutexes. If you need to output to the Terminal from
    multiple threads using **std::cout**, you can implement a very simple class that
    does nothing but lock the mutex and invoke **std::cout**. Let''s complete an exercise
    and create such class.



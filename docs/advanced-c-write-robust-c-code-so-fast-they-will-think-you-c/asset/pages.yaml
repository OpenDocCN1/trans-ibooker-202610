  md: "+   2. It is possible for the compiler to create another temporary to return\
    \ the value. However, the compiler has executed **copy elision** to remove the\
    \ copy (that is, it is able to build the object directly onto a position in the\
    \ stack allocated by the calling function). The compiler has **Return-Value-Optimization\
    \ (RVO)** and **Named- Return-Value-Optimization (NRVO)** optimizations that it\
    \ can apply and, under C++17 these have been made mandatory in certain circumstances.\n\
    +   \n+   3. The temporary object is assigned to the `the_res` variable in the\
    \ `main()` function by copy assignment. Since copy assignment is doing a deep\
    \ copy, another copy of the resource is acquired.\n+   \n+   4. When the assignment\
    \ completes, the temporary object goes out of scope and we get the first \"Resource\
    \ released\" message.\n+   \n+   5. When the `main()` function returns, `the_res`\
    \ goes out of scope, which releases the second Resource.\n\nSo, if the resource\
    \ is large, we have a very inefficient method of creating the **the_res** local\
    \ variable in **main()** as we are creating and copying around large chunks of\
    \ memory because of the deep copy in the copy assignment. However, we know that\
    \ when the temporary variable created by **createResource()** is no longer needed,\
    \ then we are going to throw it away and release its resource. It would be more\
    \ efficient in these scenarios to transfer (or move) the resource from the temporary\
    \ to the other instance of the type. Move semantics makes it possible to rewrite\
    \ our **smart_ptr** template to not do the deep copy but transfer the resource.\n\
    \nLet's add move semantics to our **smart_ptr** class:\n\n```\n// Move constructor\
    \ --> transfer resource\nsmart_ptr(smart_ptr&& a) : m_ptr(a.m_ptr)\n{\n    a.m_ptr\
    \ = nullptr;    // Put into safe state\n}\n\n// Move assignment --> transfer resource\n\
    smart_ptr& operator=(smart_ptr&& a)\n{\n    // Self-assignment detection\n   \
    \ if (&a == this)\n        return *this;\n\n    // Release any resource we're\
    \ holding\n```"

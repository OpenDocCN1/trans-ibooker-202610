- "# 第 2 章. 智能体式 AI 的商业案例\n\n毋庸置疑，ChatGPT 和大型语言模型（LLMs）以前所未有的方式提高了人们对 AI 的认知，这得益于自然语言交互的便捷性以及它们在按键之间即可生成令人印象深刻（尽管有时不完美）的输出。\n\
  \n然而，这种认可很快就被三类广泛的担忧所跟进。首先，偏见和幻觉削弱了最初看起来引人注目的输出的 perceived 质量。其次，运行这些模型所需的计算能力引发了对其环境影响的质疑。第三，金融分析师强调了在\
  \ LLM 生态系统中投入巨额投资的回报存在不确定性。换句话说，也许并不公平，围绕 LLM 的最初兴奋和好奇心已经让位于对大规模、经济上合理的企业采用潜力的怀疑。虽然智能体式\
  \ AI 依赖 LLM 来进行例如文档处理、数据检索、工作流指令、API 管理和合规跟踪等工作——并且因为它不仅需要效率，还需要准确性和合规性——智能体式 AI\
  \ 必须通过护栏、治理和系统设计来缓解 LLM 的缺陷，以实现更优越、以目标为导向的结果。\n\n因此，智能体式 AI 已迅速超越“有趣”阶段，成为一项具有战略紧迫性和重要性的技术，这是由市场成熟度和竞争压力共同推动的。它正在将\
  \ AI 从战术性自动化转变为更具战略性、价值创造的能力。这反过来要求企业迅速评估其在组织和技术层面上对智能体式 AI 的准备情况，如果他们想抓住其带来的益处。\n\
  \n## 市场成熟度和竞争驱动因素\n\n三种相互交织的力量使现在成为智能体式 AI 的正确战略时机，并将曾经的尖端实验转变为主流使能者：技术进步、经济压力和组织成熟度。\n\
  \n首先，智能体式 AI 的底层技术已经跨越了明显的拐点。基础模型和编排层已证明智能体能够在客户服务、供应链和物流以及合规等多个领域自主运行。这种成熟度得到了以下事实的佐证：智能体已在保险（理赔、承保）和银行等高度监管行业中运行关键流程，而这些行业的监管机构对保护客户利益和避免系统性风险要求严格。与此同时，更广泛的智能体式\
  \ AI 基础设施以创纪录的速度成熟——通过云原生 API、安全模型托管以及相关能力——使精明的组织确信采用将符合其专业和监管标准。两个现实案例浮现出来，展示了智能体式\
  \ AI 在大规模部署于关键任务流程时所具有的变革力量。以安联合作伙伴为例，据报道他们已与 Otera 的智能体式工作流一起扩展了自主 AI——从概念验证迈向真正的运营支柱，合格理赔的自动化率高达\
  \ 90%，理赔结算时间从约 30 天缩短至 3–4 天，据其首席数据官称，盈利路径从 3 亿欧元提升至 2030 年的 10 亿欧元。另一家金融服务领导者富兰克林邓普顿在与\
  \ Wand AI 合作下报告了对其核心业务的类似量级影响。引用该合作的新闻稿：“在过去一年中，富兰克林邓普顿深化了与 Wand AI 的合作，从试点项目发展到在多个部门全面部署智能体。初始实施聚焦于投资团队内的优先用例。到\
  \ 2026 年，Wand 驱动的智能体预计将被用于关键企业工作流——支持投资研究、运营效率和数字化转型——所有这些都以严格的治理和控制框架为支撑。”\n\n\
  其次，从经济角度来看，智能体式 AI 的时机也恰到好处。在过去几十年里，大多数企业和公共部门组织经历了多轮通过各种 IT 系统和解决方案实现的自动化。在智能体式\
  \ AI 之前最近的一波浪潮聚焦于专门的机器人流程自动化（RPA），它擅长以僵硬的方式自动化脚本化、基于规则的重复性任务。一些 RPA 领导者甚至将某些解决方案品牌化为与人类代理在特定任务上协同工作的“智能体”。然而，这些早期的\
  \ RPA 解决方案存在明显的局限性，而智能体式 AI 正在解决这些局限：真正以目标为导向（决定*如何*实现目标）、展现实现目标所需的自主性和适应性水平、对复杂性进行分级（在适当时升级给人类），以及协调与其他智能体和系统的交互以达成结果。例如，安联合作伙伴美国分公司已使用\
  \ RPA 超过十年以更迅速地处理理赔，却在 2024 年用能够自动支付合适理赔的 AI 驱动技术取代了其 RPA，而安联集团正在部署多智能体系统（例如在 Project\
  \ Nemo 下），该系统端到端编排承保检查、天气数据、欺诈分析和赔付。RPA 自动化了步骤，而智能体式 AI 现在自动化的是结果。\n\n虽然聚焦的 RPA\
  \ 实施最终耗尽了边际效率提升的机会，但智能体式 AI 通过引入决策速度为问题解决注入了新的动力——以高度自主的方式协调多个杠杆。这种新动力已转化为大型全球组织在其最重要的中后台流程中实现令人印象深刻的双位数成本节约，如上所示。\n\
  \n然而，前台任务，例如潜在客户开发，也正在被智能体式 AI 解决方案重塑，这些解决方案推动了显著的收入改善，这预示着更强劲和更可持续的投资回报率。以总部位于旧金山的初创公司\
  \ Artisan.AI 为例，它开发了一种智能体式销售开发代表（SDR），可通过大规模查找、研究和优先排序 B2B 潜在客户来自动化外向型开发。它持续扫描公司相关的上下文信号——例如其行业、使用的软件、近期招聘模式或新融资轮次——以在任何人类销售人员介入之前识别出更有可能准备购买的账户，然后运行个性化、多步骤的电子邮件和社交推广，使销售团队获得源源不断的温暖、信息丰富的潜在客户，而不是冷名单。\n\
  \n\n\n\n\n第三，组织意识和采用准备度已显著提高。在大型语言模型（LLM）出现并在各行业员工和管理者中引发最初的“惊叹效应”之后，“我们到底该如何使用它？”这个问题迅速上升到高级领导层的议程。在许多组织中，LLM\
  \ 的采用一直较为谨慎——起初持“观望”态度，直到其影响得到更好理解，随后又出现了一波概念验证，但其中许多并未投入生产。然而，这一时期并非浪费：人工智能不可避免的观念已在领导层中成形，并且许多组织利用这一探索阶段在数据和治理方面建立了基础能力（`MLOps`、`data\
  \ governance`），为 Agentic AI 生根创造了肥沃土壤。\n\n最终，企业领导者之间日益认识到，Agentic AI 不仅仅是一种边缘工具。引用\
  \ Allianz Partners 的首席数据官对其部署 Agentic AI 的说法：“我们没有时间做概念验证、玩弄生成式 AI，而是将其视为我们组织骨干的一部分来执行任务、做出决策\
  \ […] 这是真正可以把决策完全移交出去的第一次。一旦我们推出 `Otera` 代理……这真的是整个公司意识到自主 AI 时代已经到来的时刻。”\n\n##\
  \ 战略价值 vs. 战术自动化\n\n鉴于自动化技术多年来一直被用于商业，问 Agentic AI 真正增加价值之处在哪里是合理的。一种有用的回答方式是对两种自动化原型进行对比：战术自动化和战略（智能体）自动化。\n\
  \n战术自动化假设流程是线性的、决策基于规则。它主要被用来通过在中后台流程中取代重复的人力来降低成本。一旦这些流程完全自动化，额外收益的空间往往有限并呈现递减回报。\n\
  \n相比之下，战略（智能体）自动化是非线性的和自适应的。这里的价值来自决策杠杆——自主决策将大量工作从人类身上卸下，人类仅在例外情况下才被纳入循环。在此模式中，投资回报率由智能体发现运营环境、决定“下一步最佳行动”的能力以及构建一种涌现式认知来支持自适应个性化和持续优化的能力所驱动。\n\
  \n例如，考虑一个处理航班预订请求的 AI 智能体。如果航空公司网站返回错误信息，传统系统往往会停滞，但智能体可以决定下一步做什么：尝试同一网站的另一条路径，切换到另一家航空公司，或更改日期或机场等参数——而不会卡住。这说明了目标导向的自动化与狭窄任务执行之间的区别。\n\
  \n这引出了自动化价值的有用三层视图：\n\n* Value layer 1 – Operational productivity\n  Value from\
  \ automating tasks and speeding up execution – productivity gains (tasks are completed\
  \ faster and at lower unit cost),\n* Value layer 2 – Outcome quality and resilience\n\
  \  Additional value from agentic coordination across domains, leveraging autonomous\
  \ decision-making towards achieving an overall goal – better outcomes (decisions\
  \ are more consistent, better-informed, and more robust across scenarios),\n* Value\
  \ layer 3 – Adaptive, enterprise-wide systems\n  Further value from enterprise-wide\
  \ adaptive systems that learn in context – adaptiveness gains (new business models\
  \ emerge and tap new value pools).\n\n在第 3 层，完全新的模式可能出现。例如在消费零售中，智能体商务平台可能将 AI 购物智能体视为主要的“客户”，而非人类买家，这迫使产品提供商重新思考他们如何向机器营销、定位和定价其产品，而不仅仅是面向人。\n\
  \n在此背景下，智能体系统在某些类型的用例中尤其适合且能创造价值，例如：\n\n* Customer support, where agents proactively\
  \ resolve issues instead of reactive chatbots simply escalating frustrated users\
  \ to a human,\n* Supply chain optimization, where agents dynamically reroute shipments\
  \ and adjust inventory levels,\n* Compliance, where agents monitor regulatory changes\
  \ and continuously self-audit the organization against updated rules.\n\n相反，在某些情况下，智能体系统可能创造的价值较少——或引入不可接受的风险，例如：\n\
  \n* Environments where human judgment is highly subjective and individualized (“I\
  \ like this jacket, but I want the fabric to feel softer”),\n* Scenarios where critical\
  \ information is tacit, fragmented, or impossible to fully encode for an agent,\
  \ such as complex M&A negotiations, major credit decisions on opaque counterparties,\
  \ or crisis-management situations where material facts reside in people’s heads\
  \ or informal networks rather than in systems of record,\n* High-stakes contexts\
  \ where the cost of a mistake outweighs operational benefits (for example, misinterpreting\
  \ a compliance rule that could trigger a multi-million-dollar fine, or altering\
  \ settings on a life-support device).\n\n## 组织和技术准备度\n\n智能体系统在价值创造方面前景强劲，并在“价值层\
  \ 3”层面通过新商业模式打开了重大的市场和竞争颠覆之门。企业领导者应将这些机遇——以及被颠覆的相应风险——视为加速其组织和技术准备度的警钟，而这正是 Agentic\
  \ AI 商业案例的关键驱动因素。\n\n这种准备度可围绕六个维度展开：\n\n1. Leadership alignment\n   * Do we, as\
  \ a leadership team, understand the core agentic concepts and their strategic implications\
  \ – both as opportunities and as threats?\n   * Have we clearly identified the business\
  \ pain points or opportunities that are worth addressing with Agentic AI?\n   *\
  \ For those areas, have we defined clear boundaries between agent autonomy and necessary\
  \ human intervention?\n\n2. Technical infrastructure\n   * Do we have the necessary\
  \ infrastructure – data, `MLOps`, APIs – to support our Agentic AI agenda?\n   *\
  \ To what extent can we still move forward if parts of our infrastructure are not\
  \ yet ideal, and where are the non-negotiable gaps?\n\n3. Governance and risk\n\
  \   * Are we equipped with documented principles to guide our stance on Agentic\
  \ AI – for example, how to balance autonomy with augmentation of human agents?\n\
  \   * How will we ensure these principles are implemented, monitored, and enforced?\n\
  \   * What existing or new committees should oversee these questions, and who is\
  \ accountable when agents act autonomously?\n\n4. Architecture\n   * How will we\
  \ design modular systems and their orchestration, while ensuring seamless interaction\
  \ with legacy systems?\n   * How will we prioritize which systems to modernize first,\
  \ and which can wait, given budget and resource constraints?\n\n5. Technical resources\
  \ availability\n   * Do we have the right technical skills in-house to design solutions,\
  \ learn from feedback, and iterate effectively?\n   * Do we have the skillsets needed\
  \ to understand the underlying models and deploy agentic scenarios in a friction-free\
  \ manner?\n\n6. Change management\n   * Do we have the right talent, cultural agility,\
  \ and risk appetite to take advantage of Agentic AI?\n   * Are we prepared to evolve\
  \ roles, skills, and ways of working as agents become part of core processes?\n\
  \   * What does it mean for our organization to manage both humans and machine-based\
  \ agents as a unified “workforce”?\n\n\n\n\n\n对于每个维度，领导者可以使用简单的 `RAG`（Red/Amber/Green\
  \ – not to be confused with Retrieval-Augmented Generation）评估——Red（我们落后了），Amber（我们正在进展但尚未达成），以及\
  \ Green（我们已掌握此项，或处于领先）——来衡量当前的成熟度。这有助于以务实、以业务为导向的方式确定优先事项并规划投资顺序。\n\n## Agentic\
  \ Systems – What is the Payoff?\n\n最终，Agentic AI 的商业案例可以概括为以下关键点。\n\n### Maturity\n\
  \nAgentic AI 技术已达到成熟水平，可以作为主流业务使能器，而非实验性附加组件。\n\n### Opportunity\n\nAgentic 系统创造了战略性而非仅仅是战术性的影响机会，将焦点从增量效率转向变革性有效性和适应性。\n\
  \n因此，企业领导者必须迅速评估采用——或选择不采用——此类技术可能带来的机会（或负面发展）。\n\n评估组织和技术准备度应以务实的思维进行：把握节奏，明确 Agentic\
  \ AI 能在何处以及如何惠及企业，并确定适当的护栏。随着这些技术快速演进，培养企业范围内的认知能力和敏捷性，能够在创造价值的同时保持对未来的战略选择。\n\n"

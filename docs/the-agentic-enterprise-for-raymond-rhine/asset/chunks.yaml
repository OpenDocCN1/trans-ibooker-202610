  trans: '


    # 单一 LLM 代理的局限与多代理系统的必要性


    OpenAI 等公司也迅速指出了 `LLMs` 的一种有趣行为：虚构。 这些模型似乎会编造东西，这通常被称为“幻觉”。 这一点，再加上 `LLM` 模型从概率分布中提取，因此行为不一致，引起了希望部署
    AI 的企业们的诸多担忧。 由于最强大的 `LLMs` 由 OpenAI、Google 和 Anthropic 等商业实体托管，因此还存在数据安全方面的考虑。
    OpenAI 宣布将存储用户查询并用于改进其 AI（后来他们撤回了这一声明）也无助于缓解担忧。


    因此，企业最初主要集中在低风险、高回报的用例上，最终只是触及了适用性的表面。 除个人员工生产力之外，两个主要的应用领域是基于 `RAG` 的信息检索，以及编码助手（即
    copilots）。


    对 AI 有很高的期望，但用例有限，这意味着最初预期的基于 `LLM` 的 AI 部署的投资回报率未能实现。


    ## 从通用模型到工程化定制


    除应用领域有限之外，另一个因素是对 AI 系统的期望，即由于其具有通用智能，因此可以开箱即用，几乎无需任何定制。 这被进一步加剧，因为大多数 AI 实验室的成立和获得资金是为了生产
    `AGI`（通用人工智能），这意味着一个单一的、一刀切的 AI 模型。 世界花了一年或两年才意识到，应用型 AI 应该针对用例进行工程化和定制。


    今天，仍然有理由说明为什么我们应该构建多代理系统，而不是依赖单一的基于 `LLM` 的代理来完成所有事情。


    首先，单代理系统通过在思维链推理 (`CoT`) 上进行微调的方式，对某些需要推理或编码的代理任务是有用的，但它似乎会将代理绑定到某种平均推理行为，从而降低其通用适用性。
    在使用推理模型进行编码时，这些系统经常陷入某种“思考”方式并开始重复自己。


    一旦我们从使用模型（例如 `LLMs`）转向使用基于 `LLM` 的代理，我们就进入了工程领域。 代理的职责和工具如何定义并针对用例进行定制，需要精心的设计和验证。
    这在设计多代理系统时更为重要，因为各种代理的互联和角色需要进行工程化。 对于相同的用例，代理系统的设计可以决定其是有效且安全，还是无效且有风险。 代理的工作描述，以及工具的选择和实现，很大程度上取决于用例。
    模块化及其带来的好处（重用、专业化以及分而治之）非常适合工程工作。


    没有一种适用于所有代理的万能 `LLM`。 考虑到使用更小、更专业的 `LLMs` 为更专业的代理服务的优势，这一点变得更加明显。 这使我们有机会在本地运行某些代理，例如在存在敏感数据考虑的环境中。


    鉴于我们对 `LLMs` 作为聊天机器人的经验，人们常常认为代理是事务性系统，除非被文本命令调用，否则不会做任何事情，并在响应后进入休眠状态。 然而，代理可以设置为在其他非用户事件上唤醒。
    一些代理会持续运行，检查其环境和上下文，主动与用户或其他代理进行通信，或执行长期探索、维护或改进任务。


    例如，编码代理可以打开拉取请求并对审查者评论或代码合并等事件做出反应。 在电信环境中，一些代理可能会在网络节点上持续运行，执行负载均衡和事件恢复任务。


    ## 多代理系统的实践优势


    使我们倾向于多代理系统的另一个实际考虑因素是互操作性。 许多企业都在推广自己的代理，而企业希望将这些代理相互连接，或在内部将专有的内部代理相互连接。


    您还可以根据它们在更大多代理系统中的工作描述来微调 `LLMs`。 只需收集并标记特定于代理行为的数据，并为每个代理分别进行微调。 如果有一个旨在做所有事情的单一代理，你会如何做到这一点？


    上下文大小仍然是 `LLMs` 的限制因素。 即使对于可以接受相对大量 token 作为输入的 `LLMs` 来说，忠实于上下文中所述的所有内容也是一项挑战。
    在代理系统中，系统提示、对话历史、记忆和工具描述都会占用宝贵的上下文 token。 当我们在多代理系统中限制和聚焦单个代理的职责时，所有这些元素都会减少。
    如果我们明智地使用记忆和对话历史，我们就可以更具选择性和针对性地使用代理的上下文，从而使代理的行为更可靠、更可预测。


    然后是性能问题。 单个 `LLM`-Agent 是否比等效的多代理系统更高效？ 一篇最近的立场论文论证了如何将任务更精细地分解为代理对于（至少）大规模效率至关重要
    [`http://arxiv.org/abs/2502.04358`]。 甚至有一些证据表明，与神经网络中导致 `LLMs` 中惊人涌现行为的缩放定律类似的缩放定律也在多代理系统中体现出来，我们在这里谈论的是超过
    1000 个代理之间的合作 [`https://arxiv.org/abs/2406.07155`]。


    ## 控制权与根本局限


    最后，在人类工程化的 AI 代理系统与自主 AI 工程化系统之间做出选择背后，还有一个更根本的问题：我们作为人类，在哪里施加我们的控制和设计？ 还是我们只是表达意图，然后将剩下的部分留给
    `LLM`？


    答案并不像我们的直觉那样明显。 我们正在构建越来越智能的系统，它们在许多方面已经比我们更聪明。 我们是否宁愿让一个不太智能的系统（我们人类）来设计和设置更智能的系统（AI
    代理）？ 我们已经看到大型推理模型在许多我们很难通过的基准测试上取得了惊人的表现。 是不是时候让我们将这些模型作为处理系统运营各个方面的“人工大脑”而 defer
    了？ 让我们只是把系统的所有 `APIs` 交给一个单一的非常强大的 `LLM`，让它决定如何以及何时使用它们。 毕竟，我们仍然掌控着大局，因为我们将我们的意图作为输入表达给代理。


    别急。 最先进的 AI 存在根本性的局限性，这应该让我们三思。 我们的 `LLMs` 很难知道它们不知道什么（同样，它们也很难知道它们知道什么）。 换句话说，它们缺乏元认知，这似乎对我们来说很自然，也许是因为我们的大脑与前馈、训练一次、多次运行的
    `LLM` 的布线方式不同。


    此外，虽然看到 AI 生成的艺术作品、散文甚至诗歌确实展示了 `LLMs` 的惊人创造力，但我们最近合著的一篇论文表明，当前的机器学习和强化学习方法很难处理创造性行为的意外影响，或通常所称的“未知未知”
    [`https://arxiv.org/abs/2501.13075`]。


    除非我们重新思考我们对 AI 的方法，或取得一些重大突破，否则这些局限性并不容易克服。


    '

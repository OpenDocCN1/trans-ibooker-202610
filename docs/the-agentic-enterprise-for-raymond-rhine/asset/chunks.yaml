  trans: "\n\n第三，组织意识和采用准备度已显著提高。在大型语言模型（LLM）出现并在各行业员工和管理者中引发最初的“惊叹效应”之后，“我们到底该如何使用它？”这个问题迅速上升到高级领导层的议程。在许多组织中，LLM\
    \ 的采用一直较为谨慎——起初持“观望”态度，直到其影响得到更好理解，随后又出现了一波概念验证，但其中许多并未投入生产。然而，这一时期并非浪费：人工智能不可避免的观念已在领导层中成形，并且许多组织利用这一探索阶段在数据和治理方面建立了基础能力（`MLOps`、`data\
    \ governance`），为 Agentic AI 生根创造了肥沃土壤。\n\n最终，企业领导者之间日益认识到，Agentic AI 不仅仅是一种边缘工具。引用\
    \ Allianz Partners 的首席数据官对其部署 Agentic AI 的说法：“我们没有时间做概念验证、玩弄生成式 AI，而是将其视为我们组织骨干的一部分来执行任务、做出决策\
    \ […] 这是真正可以把决策完全移交出去的第一次。一旦我们推出 `Otera` 代理……这真的是整个公司意识到自主 AI 时代已经到来的时刻。”\n\n\
    # 战略价值 vs. 战术自动化\n\n鉴于自动化技术多年来一直被用于商业，问 Agentic AI 真正增加价值之处在哪里是合理的。一种有用的回答方式是对两种自动化原型进行对比：战术自动化和战略（智能体）自动化。\n\
    \n战术自动化假设流程是线性的、决策基于规则。它主要被用来通过在中后台流程中取代重复的人力来降低成本。一旦这些流程完全自动化，额外收益的空间往往有限并呈现递减回报。\n\
    \n相比之下，战略（智能体）自动化是非线性的和自适应的。这里的价值来自决策杠杆——自主决策将大量工作从人类身上卸下，人类仅在例外情况下才被纳入循环。在此模式中，投资回报率由智能体发现运营环境、决定“下一步最佳行动”的能力以及构建一种涌现式认知来支持自适应个性化和持续优化的能力所驱动。\n\
    \n例如，考虑一个处理航班预订请求的 AI 智能体。如果航空公司网站返回错误信息，传统系统往往会停滞，但智能体可以决定下一步做什么：尝试同一网站的另一条路径，切换到另一家航空公司，或更改日期或机场等参数——而不会卡住。这说明了目标导向的自动化与狭窄任务执行之间的区别。\n\
    \n这引出了自动化价值的有用三层视图：\n\n* Value layer 1 – Operational productivity\n  Value from\
    \ automating tasks and speeding up execution – productivity gains (tasks are completed\
    \ faster and at lower unit cost),\n* Value layer 2 – Outcome quality and resilience\n\
    \  Additional value from agentic coordination across domains, leveraging autonomous\
    \ decision-making towards achieving an overall goal – better outcomes (decisions\
    \ are more consistent, better-informed, and more robust across scenarios),\n*\
    \ Value layer 3 – Adaptive, enterprise-wide systems\n  Further value from enterprise-wide\
    \ adaptive systems that learn in context – adaptiveness gains (new business models\
    \ emerge and tap new value pools).\n\n在第 3 层，完全新的模式可能出现。例如在消费零售中，智能体商务平台可能将 AI\
    \ 购物智能体视为主要的“客户”，而非人类买家，这迫使产品提供商重新思考他们如何向机器营销、定位和定价其产品，而不仅仅是面向人。\n\n在此背景下，智能体系统在某些类型的用例中尤其适合且能创造价值，例如：\n\
    \n* Customer support, where agents proactively resolve issues instead of reactive\
    \ chatbots simply escalating frustrated users to a human,\n* Supply chain optimization,\
    \ where agents dynamically reroute shipments and adjust inventory levels,\n* Compliance,\
    \ where agents monitor regulatory changes and continuously self-audit the organization\
    \ against updated rules.\n\n相反，在某些情况下，智能体系统可能创造的价值较少——或引入不可接受的风险，例如：\n\n* Environments\
    \ where human judgment is highly subjective and individualized (“I like this jacket,\
    \ but I want the fabric to feel softer”),\n* Scenarios where critical information\
    \ is tacit, fragmented, or impossible to fully encode for an agent, such as complex\
    \ M&A negotiations, major credit decisions on opaque counterparties, or crisis-management\
    \ situations where material facts reside in people’s heads or informal networks\
    \ rather than in systems of record,\n* High-stakes contexts where the cost of\
    \ a mistake outweighs operational benefits (for example, misinterpreting a compliance\
    \ rule that could trigger a multi-million-dollar fine, or altering settings on\
    \ a life-support device).\n\n# 组织和技术准备度\n\n智能体系统在价值创造方面前景强劲，并在“价值层 3”层面通过新商业模式打开了重大的市场和竞争颠覆之门。企业领导者应将这些机遇——以及被颠覆的相应风险——视为加速其组织和技术准备度的警钟，而这正是\
    \ Agentic AI 商业案例的关键驱动因素。\n\n这种准备度可围绕六个维度展开：\n\n1. Leadership alignment\n   *\
    \ Do we, as a leadership team, understand the core agentic concepts and their\
    \ strategic implications – both as opportunities and as threats?\n   * Have we\
    \ clearly identified the business pain points or opportunities that are worth\
    \ addressing with Agentic AI?\n   * For those areas, have we defined clear boundaries\
    \ between agent autonomy and necessary human intervention?\n\n2. Technical infrastructure\n\
    \   * Do we have the necessary infrastructure – data, `MLOps`, APIs – to support\
    \ our Agentic AI agenda?\n   * To what extent can we still move forward if parts\
    \ of our infrastructure are not yet ideal, and where are the non-negotiable gaps?\n\
    \n3. Governance and risk\n   * Are we equipped with documented principles to guide\
    \ our stance on Agentic AI – for example, how to balance autonomy with augmentation\
    \ of human agents?\n   * How will we ensure these principles are implemented,\
    \ monitored, and enforced?\n   * What existing or new committees should oversee\
    \ these questions, and who is accountable when agents act autonomously?\n\n4.\
    \ Architecture\n   * How will we design modular systems and their orchestration,\
    \ while ensuring seamless interaction with legacy systems?\n   * How will we prioritize\
    \ which systems to modernize first, and which can wait, given budget and resource\
    \ constraints?\n\n5. Technical resources availability\n   * Do we have the right\
    \ technical skills in-house to design solutions, learn from feedback, and iterate\
    \ effectively?\n   * Do we have the skillsets needed to understand the underlying\
    \ models and deploy agentic scenarios in a friction-free manner?\n\n6. Change\
    \ management\n   * Do we have the right talent, cultural agility, and risk appetite\
    \ to take advantage of Agentic AI?\n   * Are we prepared to evolve roles, skills,\
    \ and ways of working as agents become part of core processes?\n   * What does\
    \ it mean for our organization to manage both humans and machine-based agents\
    \ as a unified “workforce”?\n\n"

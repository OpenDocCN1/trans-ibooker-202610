- raw: 'OpenAI, and others, were also quick to point out an interesting behavior of
    LLMs: confabulation. These models seemed to make things up, what is commonly known
    as ‘hallucination’. This, paired with the fact the LLM models pull from a probability
    distribution and are therefore inconsistent in their behavior, raised many flags
    with businesses looking to deploy AI. There was also a data security consideration
    due to the fact that the most powerful LLMs were hosted by commercial entities
    like OpenAI, Google, and Anthropic. It didn’t help that OpenAI announced it would
    store user queries and use them to improve its AI (they later retracted this).


    Businesses therefore initially mostly focused on low risk, high return use-cases,
    and ended up scratching the surface of applicability. The two main application
    areas outside of personal employee productivity, were RAG-based information retrieval,
    and coding companions (i.e., copilots).


    High expectations on AI, yet limited use-cases, meant that the initial expected
    ROI on LLM-based AI deployments went unmet.


    Another factor beyond the limited application areas was the expectation that AI
    systems, being generally intelligent, would be deployable out of the box, with
    very little if any customization. This is exacerbated by the fact that most AI
    labs were started and got their funding to produce AGI (Artificial General Intelligence),
    which implies a monolithic, one-size-fits-all AI model. It took the world a year
    or two to realize that applied AI should be engineered and customized to the use-case.


    Today, there is still a case to be made as to why we should engineer multi-agent
    systems versus relying on a single LLM-based agent to do everything.


    To start with, the manner by which single-agent systems are being fine-tuned on
    Chain of Thought reasoning (CoT) is useful for certain agentic tasks requiring
    reasoning or coding, but it does seem to bind the agent to a certain average reasoning
    behavior that reduces its general applicability. In using reasoning models for
    coding, these systems often get stuck into a certain manner of “thinking” and
    start repeating themselves.


    The moment we move from using models (e.g., LLMs) to using LLM-based Agents, we
    are entering engineering territory. The manner by which an agent’s responsibilities
    and tools are defined and customized for a use-case requires elaborate design
    and verification. This is all the more important when we are designing multi-agent
    systems as the interconnection and roles of the various agents needs to be engineered.
    For the same use-case, the design of an agentic system can make the difference
    between effective and safe versus ineffective and risky. The job description of
    the agent, and the selection and implementation of its tools depend very much
    on the use-case. Modularization, with its benefits (reuse, specialization, and
    divide and concur), is well suited for engineering work.


    There is no one-size-fits-all LLM for all agents. This becomes even clearer considering
    the advantages of using smaller, more specialized LLMs for more specialized agents.
    This gives us the option to run some agents on-prem, for example in settings where
    there are sensitive data considerations.


    Given our experience with LLMs as chatbots, it is often thought that agents are
    transactional systems that do not do anything until invoked by a text command,
    and go back to sleep after they have responded. Agents, however, can be set up
    to wake up on other non-user events. Some agents are run constantly, checking
    their environments and context, proactively communicating with users or other
    agents, or being on a long term mission of discovery, maintenance, or improvements.


    For example, coding agents can open pull requests and react to events like reviewer
    comments, or code merges. In a telco setting, some agents might be constantly
    running on network nodes on load balancing and incident recovery missions.


    Another practical consideration that makes us lean towards multi-agent systems
    is interoperability. Many businesses are promoting their own agents and enterprises
    will want to connect these agents to each other, or to internally connect proprietary
    ingrown agents with one another.


    You can also fine-tune LLMs depending on their job description within the larger
    multi-agent system. Simply collect and label data specific to an agent’s behavior
    and fine-tune for each agent separately. How would you do that with a single agent
    that is meant to do everything?


    Context size is still a limiting factor for LLMs. Even with LLMs that can take
    a relatively large number of tokens as input, staying faithful to everything that
    is stated in the context is a challenge. In agentic systems, the system prompt,
    dialog history, memory, and tool descriptions all take valuable context tokens.
    All these elements are reduced as we limit and focus the responsibility of individual
    agents within a multi-agent system. If we are smart about memory and dialog history,
    we can afford to be much more selective and specific about how we use an agent’s
    context, making agents more reliable and predictable in their behavior.


    Then there’s the question of performance. Is a single LLM-Agent more efficient
    than the equivalent multi-agent system? A recent position paper argued for how
    more refined decomposition into agents is critical for (at least) efficiency at
    scale \[[*http://arxiv.org/abs/2502.04358*](http://arxiv.org/abs/2502.04358)\].
    There’s even some evidence that scaling laws analogous to those in neural networks,
    which resulted in the amazing emergent behavior in LLMs, are also exhibited in
    multi-agent systems, and we are talking cooperation among more than 1000 agents
    here \[[*https://arxiv.org/abs/2406.07155*](https://arxiv.org/abs/2406.07155)\].


    Finally, there is a more fundamental question behind this choice between human
    engineered systems of AI Agents, versus autonomously AI-Engineered systems: Where
    do we, as humans, exert our control and design? Or are we just simply expressing
    intent and leaving the rest to the LLM?


    The answer is not as obvious as our initial intuition. We are building increasingly
    intelligent systems that, in many ways, are already smarter than us. Would we
    rather have a less intelligent system (us humans) design and set up more intelligent
    systems (AI Agents)? We are already seeing spectacular performance by large reasoning
    models on benchmarks many of us would have a very hard time acing. Isn’t it time
    for us to defer to these models as the artificial brains for handling all aspects
    of a system’s operations? Let’s just give all the APIs for a system to a single
    very powerful LLM and let it decide how and when to use them. Afterall, we are
    still in charge because we are expressing our intent as input to the agent.


    Not so fast. There are fundamental limitations to state of the art AI, which should
    give us pause here. Our LLMs have a hard time knowing what they don’t know (and
    for that matter, they also have a hard time knowing what they do know). In other
    words, they are lacking meta-cognition, something that seems to come quite naturally
    to us, perhaps because our brains are wired differently than a feed-forward, train-once,
    run many times, LLM.


    Also, while seeing AI generated artwork, prose, or even poetry does demonstrate
    incredible creativity by LLMs, another paper we recently coauthored shows how
    current ML and reinforcement learning methods have a hard time dealing with the
    unexpected effects of creative actions, or what is commonly referred to as ‘unknown
    unknowns’ \[[*https://arxiv.org/abs/2501.13075*](https://arxiv.org/abs/2501.13075)\].


    These limitations are not easy to overcome, unless we rethink our approach to
    AI or we have some major breakthroughs.'

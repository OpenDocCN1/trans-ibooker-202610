- raw: 'Multi-agent systems allow us to engineer safeguards for such limitations.
    Rather than potential magnification of risky behavior and inconsistencies due
    to relying solely on a single monolithic LLM-Agent, we can build resilience in
    distributed, modularized, redundant, multi-agent systems. These systems can have
    built-in agentic checks and balances as well as safeguards, including rule-based
    and human fallbacks. Additionally, the multi-agent approach allows us to build
    and extend systems incrementally, testing and fine-tuning various agents in isolation
    and within a sandboxed larger system, before plugging them into the live agent
    network. It also provides room for regulators of responsible AI to mandate the
    use of third-party agents for more critical and risky operations.


    # Chapter 2. The Business Case for Agentic AI


    Undeniably, ChatGPT and Large Language Models (LLMs) have raised awareness of
    AI in an unprecedented way, thanks to the ease of natural language interaction
    and the impressive (if sometimes imperfect) outputs they can generate at the touch
    of a button.


    However, this recognition has quickly been followed by three broad sets of concerns.
    First, bias and hallucinations have undermined the perceived quality of outputs
    that initially looked striking. Second, the compute power required to run these
    models has raised questions about their environmental impact. Third, financial
    analysts have highlighted uncertainties around the returns on the massive investments
    made in the LLM ecosystem. In other words, and perhaps unfairly, the initial excitement
    and curiosity around LLMs have given way to skepticism about the potential for
    large-scale, economically rational corporate adoption. While Agentic AI relies
    on LLMs for, for example, document processing, data retrieval, workflow instructions,
    API management, and compliance tracking – and because it requires not just efficiency
    but also accuracy and compliance – Agentic AI has had to mitigate LLMs’ flaws
    through guardrails, governance, and system design to achieve superior, goal-oriented
    outcomes.


    As a result, Agentic AI has moved quickly beyond the “interesting” stage to become
    a strategically urgent and important technology, driven by both market maturity
    and competitive pressure. It is transforming AI from tactical automation into
    a more strategic, value-creating capability. This, in turn, requires corporations
    to rapidly assess their organizational and technical readiness for Agentic AI
    if they want to capture its benefits.


    # Market maturity and competitive drivers


    Three converging forces make this the right strategic moment for Agentic AI and
    turn what was a bleeding-edge experiment into a mainstream enabler: advances in
    technology, economic pressure, and organizational maturity.


    Firstly, the underlying technologies for Agentic AI have already passed a clear
    inflection point. Foundation models and orchestration layers have demonstrated
    that agents can operate autonomously across a range of domains, such as customer
    service, supply chain and logistics, and compliance. This level of maturity is
    underscored by the fact that agents are already running key processes in highly
    regulated industries like insurance (claims, underwriting) and banking, where
    regulators are stringent about protecting customer interests and avoiding systemic
    risk. In parallel, the broader Agentic AI infrastructure has matured at record
    speed – through cloud-native APIs, secure model hosting, and related capabilities
    – giving sophisticated organizations confidence that adoption will meet their
    professional and regulatory standards. Two real-life examples come to mind that
    showcase the transformative power of Agentic AI implemented at scale for mission-critical
    processes. Take Allianz Partners, reporting that they have scaled autonomous AI
    with Otera’s agentic workflows – moving beyond PoCs to a true operational backbone
    with up to 90% automation of eligible claims, settlement times cut from around
    30 days to 3–4 days, and a path from €300M to €1B in profitability by 2030, according
    to their Chief Data Officer. Another financial-services leader, Franklin Templeton,
    reports a similar magnitude of impact on its core business in collaboration with
    Wand AI. Citing the press release on this collaboration: “Over the past year ,
    Franklin Templeton has deepened its collaboration with Wand AI, evolving from
    pilot programs to full-scale production deployments of intelligent agents across
    multiple departments. The initial implementation focused on priority use cases
    within the firm’s investment teams. By 2026, Wand-powered agents are expected
    to be used in key enterprise workflows – supporting investment research, operational
    efficiency, and digital transformation – all underpinned by rigorous governance
    and control frameworks.”


    Secondly, from an economic standpoint, the timing for Agentic AI is also right.
    Over the past decades, most corporations and public-sector organizations have
    undergone multiple waves of automation via various IT systems and solutions. The
    most recent waves before Agentic AI focused on specialized Robotic Process Automation
    (RPA), which excelled at automating scripted, rule-based, repetitive tasks but
    did so in a rigid manner. Some RPA leaders even branded certain solutions as “agents”
    working alongside human agents on specific tasks. Yet these early RPA solutions
    had clear limitations that Agentic AI is now addressing: being truly goal-oriented
    (deciding *how* to achieve a goal), demonstrating the level of autonomy and adaptability
    needed to do so, triaging complexity (and escalating to humans when appropriate),
    and orchestrating interactions with other agents and systems to reach an outcome.
    For example, Allianz Partners USA had used RPA for more than a decade to process
    its claims more swiftly, only to replace – in 2024 – its RPA with AI-powered technology
    capable of auto-paying suitable claims, while Allianz Group is deploying multi-agent
    systems (for example, under Project Nemo) that orchestrate coverage checks, weather
    data, fraud analysis, and payouts end-to-end. RPA automated steps, and Agentic
    AI now automates the outcome.


    While focused RPA implementations eventually exhausted their opportunities for
    marginal efficiency gains, Agentic AI injects new momentum into problem-solving
    by introducing decision velocity – coordinating multiple levers in a largely autonomous
    way. This new momentum has already translated into impressive double-digit cost
    savings for large global organizations, as shown above, across their most important
    middle- and back-office processes.


    However, front-office tasks, such as lead generation, are also being reshaped
    by Agentic AI solutions that drive significant revenue improvements, which bodes
    well for stronger and more sustainable ROIs. Take Artisan.AI, a San Francisco-based
    start-up that has developed an agentic Sales Development Representative (SDR)
    that automates outbound prospecting by finding, researching, and prioritizing
    B2B leads at scale. It continuously scans context signals about a company – such
    as its industry, the software it uses, recent hiring patterns, or new funding
    rounds – to identify accounts that are more likely to be ready to buy, before
    any human salesperson gets involved, then runs personalized, multi-step email
    and social outreach, so sales teams get a steady flow of warm, context-rich leads
    instead of cold lists.'

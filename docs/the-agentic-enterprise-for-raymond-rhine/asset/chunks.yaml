    \ retail, for instance, agentic commerce platforms may treat AI shopping agents\
    \ as the primary “client,” not the human buyer, forcing product providers to rethink\
    \ how they market, position, and price their offerings to machines as much as\
    \ to people.\n\nIn this context, agentic systems are particularly well-suited\
    \ and value-adding in certain types of use cases, such as:\n\n* Customer support,\
    \ where agents proactively resolve issues instead of reactive chatbots simply\
    \ escalating frustrated users to a human,\n* Supply chain optimization, where\
    \ agents dynamically reroute shipments and adjust inventory levels,\n* Compliance,\
    \ where agents monitor regulatory changes and continuously self-audit the organization\
    \ against updated rules.\n\nConversely, agentic systems may create less value\
    \ – or introduce unacceptable risk – in certain situations, for example:\n\n*\
    \ Environments where human judgment is highly subjective and individualized (“I\
    \ like this jacket, but I want the fabric to feel softer”),\n* Scenarios where\
    \ critical information is tacit, fragmented, or impossible to fully encode for\
    \ an agent, such as complex M&A negotiations, major credit decisions on opaque\
    \ counterparties, or crisis-management situations where material facts reside\
    \ in people’s heads or informal networks rather than in systems of record,\n*\
    \ High-stakes contexts where the cost of a mistake outweighs operational benefits\
    \ (for example, misinterpreting a compliance rule that could trigger a multi-million-dollar\
    \ fine, or altering settings on a life-support device).\n\n# Organizational and\
    \ technical readiness\n\nAgentic systems show strong prospects for value creation\
    \ and, at the “value layer 3” level, open the door to significant market and competitive\
    \ disruption through new business models. Business leaders should view these opportunities\
    \ – and the corresponding risk of being disrupted – as a wake-up call to accelerate\
    \ their organizational and technical readiness, which is a key driver of the business\
    \ case for Agentic AI.\n\nThis readiness can be framed across six dimensions:\n\
    \n1. Leadership alignment\n   * Do we, as a leadership team, understand the core\
    \ agentic concepts and their strategic implications – both as opportunities and\
    \ as threats?\n   * Have we clearly identified the business pain points or opportunities\
    \ that are worth addressing with Agentic AI?\n   * For those areas, have we defined\
    \ clear boundaries between agent autonomy and necessary human intervention?\n\n\
    2. Technical infrastructure\n   * Do we have the necessary infrastructure – data,\
    \ `MLOps`, APIs – to support our Agentic AI agenda?\n   * To what extent can we\
    \ still move forward if parts of our infrastructure are not yet ideal, and where\
    \ are the non-negotiable gaps?\n\n3. Governance and risk\n   * Are we equipped\
    \ with documented principles to guide our stance on Agentic AI – for example,\
    \ how to balance autonomy with augmentation of human agents?\n   * How will we\
    \ ensure these principles are implemented, monitored, and enforced?\n   * What\
    \ existing or new committees should oversee these questions, and who is accountable\
    \ when agents act autonomously?\n\n4. Architecture\n   * How will we design modular\
    \ systems and their orchestration, while ensuring seamless interaction with legacy\

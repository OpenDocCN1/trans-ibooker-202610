    Responsible design of multi-agent systems also calls for some critical implementations
    to be human-in-the-loop, or, for some systems that can afford to run with more
    autonomy, to operate in a human-on-the-loop mode, allowing humans oversight and
    the ability to intervene, as well as tasking with the agents to pull humans in
    when and wherever needed.


    Each of these aspects call for special UX considerations and best-practices. Ultimately,
    superior user experience in a multi-agentic enterprise should allow for easy and
    natural entry points and interaction modalities.


    ## Multiple entry points


    Regardless of whether the user persona is a customer, or an employee, a modern
    multi-agentic enterprise should allow access to agents from a variety of entry
    points and respect a variety of modalities. Users should be able to switch entry-points
    and mix modalities, and the system should be able to recognize the user intent
    and context through a combination of implied and expressed cues.


    ## Channel agnostic interactions


    Just as we are able to use various means to interact with our colleagues, interaction
    with the multi-agentic enterprise should also be channel agnostic, and users should
    be able to use a chatbot or search box on the application’s web page, a mobile
    app, or corporate chat apps like Slack and Teams. Often, the interactions are
    not chat-based at all. The context of applications, data inflows, and browser-based
    interactions could all be inputs to an agentic system, triggering various behavior
    and multi-agentic processes.


    ## Direct interaction with chosen agent


    Where possible, users should be allowed to initiate their interactions with the
    agent they think would be responsible for handling their request. For example,
    a corporate intranet consisting of agents for functions like HR, Finance, Legal,
    etc., should not only be able to handle queries and commands directed at the top
    agent, but it should also allow the user to go directly to the agent the user
    feels is the most relevant to the topic. If the user knows, for example, that
    their request is related to HR, they should be allowed to start their conversation
    with the HR agent.


    # Multi-Agent Organizations


    A multi-agent system representing an organization’s various workflows can have
    several significant advantages, including improved productivity, operational resilience,
    and improved robustness. For businesses that are rapidly moving to adopt single
    agent solutions multi-agent systems can appear to be an inevitable and quite disruptive
    future state.


    Why use multiple specialized agents communicating with one another, versus using
    a single all-powerful, know-it-all agent? Essentially, using multi-agents offers
    a number of benefits over using single agents: flexibility in incremental engineering
    of complex systems, ability to safeguard an agent’s behavior, improved agent’s
    reliability, and broader choice of LLMs to use:


    ## Flexibility in engineering


    From an engineering perspective encapsulating responsibilities and implementing
    a distributed inter-agent coordination mechanism e.g., `AAOSA` means that we can
    build these agent networks incrementally, plugging in new agent sub-networks without
    having to re-engineer existing agents.


    ## Safeguarding agent’s behavior


    Safeguarding an agent’s behavior is more effective when we pair the agent with
    a Safeguard agent, versus asking the agent to do something, but to be careful
    at the same time.


    ## Better agent reliability


    From a consistency and reliability perspective the approach assumes much more
    specialization for each agent, making agents much more reliable in their behavior
    and less prone to issues related to LLM confabulation and hallucination.


    ## Broader choice of LLMs to use


    This also means that the bar is a bit lower on what LLM to use depending on the
    agent. Larger more capable agents are expensive, slow, and mostly hosted, and
    being able to use smaller more specialized LLMs means you are paying less, getting
    quicker responses, and having the option to host agents that handle more sensitive
    data, and to have an easier time fine-tuning the LLMs, if needed. Moreover, and
    as LLM context is limited, even for more powerful models boasting millions of
    tokens as their input context, a single agent for all uses can hit limitations.
    On the other hand, if context is used wisely, each agent in a multi-agent setting
    remains much more focused and less reliant on recalling and respecting what it
    is asked.


    The same goes for output. If you ask an LLM to produce a complex output, it is
    likely to fail at producing everything you requested, whereas for an agent in
    a multi-agent setting, restricting responsibilities typically results in less
    output complexity requirements.


    However, it is important to note that the larger the number of agents, the more
    costly and slow the system, so there is a balance to be struck between modularity,
    robustness, and consistency on the one side, and cost and response time on the
    other. Care needs to be taken as to the granularity of the agentification, as
    well as the types of LLMs being used and when and how to fine-tune them to make
    them effective. The latter is an option, once an initial multi-agent system is
    in production or running in a sandbox, where usage data can be collected, labelled
    by human auditors as to acceptable or not, and this labelled data then used to
    fine-tune the LLMs behind various agents so as to make their behavior more acceptable.


    Given the power of multi-agent systems, one can expect that the fabric of future
    organizations will consist of interconnected agents; however, for the foreseeable
    future, and unless a seismic shift occurs in culture and society and agents are
    conferred some level of personhood, humans will remain the sole bearers of responsibility.
    This means that multi-agency should be controlled and designed with humans as
    the ultimate arbiter and approver of higher risk behavior.


    # Chapter 1. From Automation to Agents: The Evolution of Enterprise AI


    Most early enterprise applications of AI were rule-based expert systems, with
    human designed taxonomies helping with business decisions, and in the case of
    `RPA` Robotic Process Automation, automating some steps in a rigid process.


    With the advent of Deep Learning, large neural network models trained on data
    to help with classification and prediction problems, some experimentation and
    niche use-cases started, with the hopes that such models would uncover patterns
    in the data that had remained hidden to statistical analysis.


    It must be mentioned here that, prior to the introduction of LLMs, the field of
    applied AI had a much more diverse set of tools in deployment. These included
    symbolic regression, evolutionary optimization, predicate logic systems, random
    forest models, to name a few. Today, some of these approaches are not even recognized
    as AI, and applied AI is mostly LLM-based. Approaches such as Deep Learning are
    commonly referred to as ‘traditional’ ML models now and LLMs have overshadowed
    the variety of AI tools and approaches in the field.


    While we acknowledge the fact that the field of AI is much richer and wider than
    LLMs, in this book, we will define AI Agents using their more recent configuration,
    which always includes an LLM, wrapped in a program that actuates the LLM’s intent.


    November 2022 was a pivotal moment for AI. ChatGPT 3 was released and suddenly,
    a much wider audience got an idea for how profoundly powerful and generally applicable
    AI systems can be. With all its flaws, ChatGPT 3 was able to ‘understand’ any
    command or query, attempt to respond to it, and explain itself in clear natural
    language.


    The form by which this powerful AI was revealed has had a lasting effect on how
    it has been deployed: a chatbot interface for retrieving data and information,
    best suited for support calls, FAQs, knowledge repositories, and general help.

    '
  trans: '


    负责任的多智能体系统设计也要求某些关键实现采用人在回路（human-in-the-loop）方式，或者，对于能够承受更高自主性的系统，则以人在环（human-on-the-loop）模式运行，让人类能够进行监督并在需要时介入，以及与智能体协作，在必要时将人类拉入任务。


    这些方面中的每一个都需要特殊的 UX 考虑和最佳实践。最终，多智能体企业的卓越用户体验应提供简便自然的入口点和交互方式。


    ## 多重入口点


    无论用户角色是客户还是员工，现代多智能体企业都应允许用户从各种入口点访问智能体，并尊重各种交互方式。用户应能够切换入口点并混合使用交互方式，系统应能够通过暗示和明确的线索组合来识别用户意图和上下文。


    ## 通道无关的交互


    正如我们能够使用各种方式与同事互动一样，与多智能体企业的交互也应是通道无关的，用户应能够使用应用程序网页上的聊天机器人或搜索框、移动应用，或企业聊天应用如
    Slack 和 Teams。经常，交互根本就不是基于聊天的。应用程序的上下文、数据流入和基于浏览器的交互都可能成为智能体系统的输入，触发各种行为和多智能体流程。


    ## 与所选智能体的直接交互


    在可能的情况下，用户应被允许与其认为负责处理其请求 的智能体发起交互。例如，由 HR、财务、法务等职能的智能体组成的企业内网，不仅应能够处理发给顶层智能体的查询和命令，还应允许用户直接前往用户认为与主题最相关的智能体。如果用户知道，例如，其请求与
    HR 相关，他们应被允许从 HR 智能体开始对话。


    # 多智能体组织


    代表组织各种工作流程的多智能体系统可以具有若干显著优势，包括提高生产力、运营韧性和改进的稳健性。对于那些迅速转向采用单一智能体解决方案的企业而言，多智能体系统可能看起来是一个不可避免且相当具有颠覆性的未来状态。


    为什么要使用相互通信的多个专业智能体，而不是使用一个全能的、无所不知的单一智能体？本质上，使用多智能体相比使用单一智能体提供了诸多好处：复杂系统增量工程的灵活性、保护智能体行为的能力、智能体可靠性的提升，以及更广泛的
    LLM 选择：


    ## 工程灵活性


    从工程角度来看，封装职责并实现分布式智能体间协调机制，例如 `AAOSA` 意味着我们可以逐步构建这些智能体网络，在无需重新设计现有智能体的情况下插入新的智能体子网络。


    ## 保护智能体行为


    保护智能体行为在将智能体与安全防护智能体配对时更为有效，而不是要求智能体去做某事，同时又要小心谨慎。


    ## 更好的智能体可靠性


    从一致性和可靠性角度来看，该方法假设每个智能体具有更高的专业化，使智能体在行为上更可靠，且不易出现与 LLM 臆造和幻觉相关的问题。


    ## 更广泛的 LLM 选择


    这也意味着在选择用于特定智能体的 LLM 时门槛会低一些。更大更强大的智能体成本高、速度慢，且大多托管，而能够使用更小更专业的 LLM 意味着你支付更少、获得更快的响应，并有选项托管处理更敏感数据的智能体，以及在需要时更容易微调
    LLM。此外，由于 LLM 上下文有限，即使是输入上下文可达数百万 token 的更强大模型，单一智能体也可能达到局限。另一方面，如果上下文被明智使用，多智能体设置中的每个智能体都保持更专注，且不那么依赖于回忆和尊重其被要求的内容。


    输出也同样如此。如果要求 LLM 生成复杂输出，它很可能无法完成你所要求的一切，而对于多智能体设置中的智能体，限制职责通常会导致输出复杂性要求降低。


    然而，需要注意的是，智能体数量越大，系统越昂贵且越慢，因此需要在模块化、稳健性和一致性与成本和响应时间之间取得平衡。需要谨慎考虑智能体化的粒度，以及所使用的
    LLM 类型，以及何时以及如何微调它们以使其有效。后者是一个选项，一旦初始多智能体系统投入生产或在沙箱中运行，就可以使用数据收集，并由人工审计员标记为可接受或不可接受，然后使用这些标记数据微调各种智能体背后的
    LLM，以使其行为更可接受。


    鉴于多智能体系统的强大能力，可以预期未来组织的架构将由互联的智能体构成；然而，在可预见的未来，除非文化和社会发生地震式转变并赋予智能体某种人格，否则人类仍将是责任的唯一承担者。这意味着多智能体应受控制并以人类作为高风险行为的最终裁决者和批准者来设计。


    # 第 1 章 从自动化到智能体：企业 AI 的演进


    大多数早期的企业 AI 应用是基于规则的专家系统，采用人类设计的分类法来帮助业务决策，而在 `RPA` 机器人流程自动化 的情况下，则自动化了刚性流程中的某些步骤。


    随着深度学习的出现，训练于数据以帮助分类和预测问题的庞大神经网络模型，一些实验和利基用例开始出现，希望此类模型能够发现统计分析尚未揭示的数据模式。


    必须在此提到，在 LLM 引入之前，应用 AI 领域在部署上拥有更多样化的工具集。这些包括符号回归、进化优化、谓词逻辑系统、随机森林模型等。如今，其中一些方法甚至不被视为
    AI，而应用 AI 大多基于 LLM。诸如深度学习等方法现在通常被称为“传统”机器学习模型，而 LLM 已 overshadowed 该领域中 AI 工具和方法的多样性。


    虽然我们承认 AI 领域远比 LLM 更丰富和更广阔，但在本书中，我们将使用其更近期的配置来定义 AI 智能体，该配置始终包含一个 LLM，被包裹在执行 LLM
    意图的程序中。


    2022 年 11 月是 AI 的关键时刻。ChatGPT 3 发布，突然间，更广泛的受众对 AI 系统可以多么强大且普遍适用有了概念。尽管存在各种缺陷，ChatGPT
    3 能够“理解”任何命令或查询，尝试对其作出响应，并在清晰的自然语言中解释自己。


    这种强大的 AI 所呈现的形式对其实装方式产生了持久影响：用于检索数据和信息的聊天机器人界面，最适合支持电话、常见问题解答、知识库和一般帮助。

    '

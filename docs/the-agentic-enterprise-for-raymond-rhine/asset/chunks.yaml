- raw: "Given their role, a level of autonomy is expected of an agent as it interacts\
    \ with the world using its tools. In some cases, like running code in a container,\
    \ the consequences can be controlled and contained. In others, scrutiny and care\
    \ needs to be applied to avoid undesirable consequences of an agent’s autonomous\
    \ behavior.\n\nThe fact that the ‘brain’ of an agent is an inherently opaque neural\
    \ network (i.e., an LLM) makes this more complex. LLM-based agents are also prone\
    \ to hallucinations or misunderstanding of inherently ambiguous natural language\
    \ communications, so what we gain in robustness we can lose in consistency.\n\n\
    Several mitigation strategies are available to reduce these risks, including implementing\
    \ rules for overriding or seeking human approval for certain agent decisions,\
    \ assessing uncertainty of agent behavior, and pairing agents with safeguard agents\
    \ that monitor and prevent potential harm. Let’s take them in turn.\n\nRules for\
    \ agent autonomy and control\n\n: \n\nAn agent can be wrapped into deterministic\
    \ programs that allow us to impose rules on conditions within which the agent\
    \ is allowed to make use of its LLM’s non-deterministic reasoning. The inverse\
    \ is also possible, where LLM reasoning supersedes rule-based behavior, and we\
    \ defer to the LLM on when to switch to human defined rule-based behavior.\n\n\
    Using LLM uncertainty\n\n: \n\nThere is a third option to determine when to defer\
    \ to the LLM’s reasoning versus rule-based behavior, or even to call a human to\
    \ make the decision on what to do. This requires an estimation of LLM uncertainty.\
    \ While LLMs are opaque or black-box models, which means it is very difficult\
    \ to determine why they behave the way they do, there are techniques to estimate\
    \ how confident they are in their own output. For example, it is possible to get\
    \ a sense of the range of different outputs an LLM is likely to produce for the\
    \ same input. This range can help us calculate an absolute value for the LLM’s\
    \ confidence for the various outputs it can produce for the same input. If we\
    \ then set a threshold on this confidence value, we will have a future-proof mechanism\
    \ to switch between deferring to the LLM, when its confidence is higher than the\
    \ threshold, and switching to predetermined rule-based behavior when the LLM’s\
    \ confidence does not meet the threshold.\n\nSafeguard Agents\n\n: \n\nOne or\
    \ more agents can be defined to be responsible to check the proposed behavior\
    \ of another agent and determine whether the behavior is acceptable or not.\n\n\
    Given the required oversight, we need a different testing regime for agent-based\
    \ systems that differs from what we are used to in traditional software. The good\
    \ news, however, is that we are used to testing such systems as we have been operating\
    \ human-driven organizations and workflows since the dawn of industrialization.\n\
    \nThe state of the art in Generative AI models prevents single agents from effectively\
    \ taking a large body of complex instructions and carrying out too many varied\
    \ and complex tasks. Given the limit on the size of an LLM’s input (i.e., context\
    \ window restrictions) as well as limitations in the power of reasoning of LLMs,\
    \ it is often more effective to break responsibilities down into multiple AI agents,\
    \ connected and coordinating to get work done. Just as we do not assign a single\
    \ software engineer the task of writing a fully-fledged CRM system, asking an\
    \ AI Agent to write code for a full CRM system may be a tall order, but having\
    \ a team of agents representing various responsibilities such as project management,\
    \ front-end and back-end engineering, and QA, working together is more likely\
    \ to get the job done successfully.\n\nA modern AI Agent consists of an LLM, and\
    \ some code. The code allows the LLM to actuate its intentions using the tools\
    \ we assign to it. Most systems facilitate the calls directly, with no intermediate\
    \ calls. For example, the Model Context Protocol (MCP), which has become a de\
    \ facto standard in defining and exposing API for agentic use, allows agents to\
    \ discover and call API without requiring manual integration. Some agentic systems\
    \ do allow developers the flexibility to extend the code part of an agent by writing\
    \ code that would run prior to calling tools (see [Figure I-10](#introduction01.html#ch00_figure_10_1771364788596797)).\n\
    \n![](assets/ch00_figure_10_1771364788596797.png)\n\nThis duality of LLM and code\
    \ is useful and, as an important step in our design of a multi-agentic system,\
    \ this allows us to think about what part of an agent’s behavior needs to be handled\
    \ by the LLM, and which part needs to be coded.\n\nThere is a tendency, sometimes,\
    \ to think of AI agents as we did of software modules and try to control them\
    \ and make them consistent. This is understandable, but defeats the whole purpose\
    \ of agentification, which requires ceding some control to agents, and accepting\
    \ some level of inconsistency, in exchange for robustness, efficiency and quality.\n\
    \nWhen dealing with an agent, we should always assume some autonomy of behavior.\
    \ An agent should be allowed, part of the time, to decide on its own which of\
    \ its tools to use, in what order, and how. If you determine that your agent is\
    \ not allowed any autonomy, then you should strongly consider replacing it with\
    \ a software module.\n\nTasks that require reasoning, robust understanding of\
    \ text or other unstructured input, or the generation of such unstructured data\
    \ as output should be delegated to the LLM. More rigid rules-based behavior that\
    \ requires consistency will have to be implemented in the code part of the agent.\n\
    \nIn other words, we should divide an agent’s responsibilities between those needing\
    \ an intelligent knowledge-worker-in-a-box and those requiring predefined rules\
    \ applied consistently. The former can be delegated to the agent’s LLM, and the\
    \ latter should be programmed into the coded part of the agent.\n\nAn essential\
    \ tool to help apply this division of labor to a multi-agent system is sly\\_data:\
    \ a data structure that can be operated upon by the code part of an agent, and\
    \ that is passed around between agents through code, and so is not necessarily\
    \ subject to LLM processing.\n\nWhat also appears clearly is that, beyond the\
    \ technical means (like sly\\_data) to orchestrate multi-agents in an enterprise,\
    \ a need is emerging to essentially define some sort of Governance of the agents\
    \ among themselves and of their interactions (or not) with humans. To some extent,\
    \ the orchestration of multi-agents mimics human enterprise organization rules\
    \ and how different specialized teams and units interact with each other.\n\n\
    # The Agentic User Experience\n\nAs Agentic AI straddles the concepts of autonomy\
    \ in automation and “human in the loop” control, we see three important considerations\
    \ in realizing the transformative potential of multi-agent systems when it comes\
    \ to user experience: first, perception of delay or latency in processing, second,\
    \ the multiplicity of interaction channels and choices for interactions, and third,\
    \ the need for allowing human intervention when required.\n\nDelay/Latency perception\n\
    \n: \n\nDespite the objective performance gains of multi-agent systems, their\
    \ intrinsic processing can create a perception of delay compared to the near-instantaneous\
    \ feedback of traditional software. Strategically reducing this perceived latency\
    \ is essential for frictionless user integration and the full realization of multi-agent\
    \ systems’ innovative potential.\n\nMultiplicity of interaction channels and choices\
    \ \n\n: \n\nMulti-agent systems offer new and expanded interactions choices: with\
    \ the advent of multi-modal LLMs as the brains behind the agents, multiple interaction\
    \ modalities are made possible. With multiple agents responsible for various domains\
    \ and functions within an enterprise, users can be offered a variety of choices\
    \ for interacting with different agents. These requests could be for asking for\
    \ updates and information, or in the form of commands to affect change.\n\nHuman-in-the\
    \ loop interventions\n\n: "
  fmt: '

    Given their role, a level of autonomy is expected of an agent as it interacts
    with the world using its tools. In some cases, like running code in a container,
    the consequences can be controlled and contained. In others, scrutiny and care
    needs to be applied to avoid undesirable consequences of an agent’s autonomous
    behavior.


    The fact that the ‘brain’ of an agent is an inherently opaque neural network (i.e.,
    an `LLM`) makes this more complex. `LLM`-based agents are also prone to hallucinations
    or misunderstanding of inherently ambiguous natural language communications, so
    what we gain in robustness we can lose in consistency.


    Several mitigation strategies are available to reduce these risks, including implementing
    rules for overriding or seeking human approval for certain agent decisions, assessing
    uncertainty of agent behavior, and pairing agents with safeguard agents that monitor
    and prevent potential harm. Let’s take them in turn.


    ## Rules for agent autonomy and control


    An agent can be wrapped into deterministic programs that allow us to impose rules
    on conditions within which the agent is allowed to make use of its `LLM`’s non-deterministic
    reasoning. The inverse is also possible, where `LLM` reasoning supersedes rule-based
    behavior, and we defer to the `LLM` on when to switch to human defined rule-based
    behavior.


    ## Using LLM uncertainty


    There is a third option to determine when to defer to the `LLM`’s reasoning versus
    rule-based behavior, or even to call a human to make the decision on what to do.
    This requires an estimation of `LLM` uncertainty. While `LLMs` are opaque or black-box
    models, which means it is very difficult to determine why they behave the way
    they do, there are techniques to estimate how confident they are in their own
    output. For example, it is possible to get a sense of the range of different outputs
    an `LLM` is likely to produce for the same input. This range can help us calculate
    an absolute value for the `LLM`’s confidence for the various outputs it can produce
    for the same input. If we then set a threshold on this confidence value, we will
    have a future-proof mechanism to switch between deferring to the `LLM`, when its
    confidence is higher than the threshold, and switching to predetermined rule-based
    behavior when the `LLM`’s confidence does not meet the threshold.


    ## Safeguard Agents


    One or more agents can be defined to be responsible to check the proposed behavior
    of another agent and determine whether the behavior is acceptable or not.


    Given the required oversight, we need a different testing regime for agent-based
    systems that differs from what we are used to in traditional software. The good
    news, however, is that we are used to testing such systems as we have been operating
    human-driven organizations and workflows since the dawn of industrialization.


    The state of the art in Generative AI models prevents single agents from effectively
    taking a large body of complex instructions and carrying out too many varied and
    complex tasks. Given the limit on the size of an `LLM`’s input (i.e., context
    window restrictions) as well as limitations in the power of reasoning of `LLMs`,
    it is often more effective to break responsibilities down into multiple AI agents,
    connected and coordinating to get work done. Just as we do not assign a single
    software engineer the task of writing a fully-fledged CRM system, asking an AI
    Agent to write code for a full CRM system may be a tall order, but having a team
    of agents representing various responsibilities such as project management, front-end
    and back-end engineering, and QA, working together is more likely to get the job
    done successfully.


    A modern AI Agent consists of an `LLM`, and some code. The code allows the `LLM`
    to actuate its intentions using the tools we assign to it. Most systems facilitate
    the calls directly, with no intermediate calls. For example, the Model Context
    Protocol (`MCP`), which has become a de facto standard in defining and exposing
    API for agentic use, allows agents to discover and call API without requiring
    manual integration. Some agentic systems do allow developers the flexibility to
    extend the code part of an agent by writing code that would run prior to calling
    tools (see [Figure I-10](#introduction01.html#ch00_figure_10_1771364788596797)).


    ![](assets/ch00_figure_10_1771364788596797.png)


    This duality of `LLM` and code is useful and, as an important step in our design
    of a multi-agentic system, this allows us to think about what part of an agent’s
    behavior needs to be handled by the `LLM`, and which part needs to be coded.


    There is a tendency, sometimes, to think of AI agents as we did of software modules
    and try to control them and make them consistent. This is understandable, but
    defeats the whole purpose of agentification, which requires ceding some control
    to agents, and accepting some level of inconsistency, in exchange for robustness,
    efficiency and quality.


    When dealing with an agent, we should always assume some autonomy of behavior.
    An agent should be allowed, part of the time, to decide on its own which of its
    tools to use, in what order, and how. If you determine that your agent is not
    allowed any autonomy, then you should strongly consider replacing it with a software
    module.


    Tasks that require reasoning, robust understanding of text or other unstructured
    input, or the generation of such unstructured data as output should be delegated
    to the `LLM`. More rigid rules-based behavior that requires consistency will have
    to be implemented in the code part of the agent.


    In other words, we should divide an agent’s responsibilities between those needing
    an intelligent knowledge-worker-in-a-box and those requiring predefined rules
    applied consistently. The former can be delegated to the agent’s `LLM`, and the
    latter should be programmed into the coded part of the agent.


    An essential tool to help apply this division of labor to a multi-agent system
    is `sly_data`: a data structure that can be operated upon by the code part of
    an agent, and that is passed around between agents through code, and so is not
    necessarily subject to `LLM` processing.


    What also appears clearly is that, beyond the technical means (like `sly_data`)
    to orchestrate multi-agents in an enterprise, a need is emerging to essentially
    define some sort of Governance of the agents among themselves and of their interactions
    (or not) with humans. To some extent, the orchestration of multi-agents mimics
    human enterprise organization rules and how different specialized teams and units
    interact with each other.


    # The Agentic User Experience


    As Agentic AI straddles the concepts of autonomy in automation and “human in the
    loop” control, we see three important considerations in realizing the transformative
    potential of multi-agent systems when it comes to user experience: first, perception
    of delay or latency in processing, second, the multiplicity of interaction channels
    and choices for interactions, and third, the need for allowing human intervention
    when required.


    ## Delay/Latency perception


    Despite the objective performance gains of multi-agent systems, their intrinsic
    processing can create a perception of delay compared to the near-instantaneous
    feedback of traditional software. Strategically reducing this perceived latency
    is essential for frictionless user integration and the full realization of multi-agent
    systems’ innovative potential.


    ## Multiplicity of interaction channels and choices


    Multi-agent systems offer new and expanded interactions choices: with the advent
    of multi-modal `LLMs` as the brains behind the agents, multiple interaction modalities
    are made possible. With multiple agents responsible for various domains and functions
    within an enterprise, users can be offered a variety of choices for interacting
    with different agents. These requests could be for asking for updates and information,
    or in the form of commands to affect change.


    ## Human-in-the loop interventions


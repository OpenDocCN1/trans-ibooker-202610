- raw: "Thirdly, organizational awareness and adoption readiness have increased markedly.\
    \ After the emergence of LLMs and the initial “wow effect” experienced by employees\
    \ and managers across industries, the question of “what should we actually do\
    \ with this?” quickly rose on senior leaders’ agendas. In many organizations,\
    \ LLM adoption has been cautious – starting with “wait and see” positions until\
    \ implications were better understood, followed by a flurry of proofs of concept\
    \ that often did not make it into production. Yet this period has not been wasted:\
    \ the idea that AI is inevitable has now crystallized in leadership circles, and\
    \ many organizations have used this exploratory phase to build foundational capabilities\
    \ in data and governance (MLOps, data governance) that create fertile ground for\
    \ Agentic AI to take root.\n\nUltimately, there is a growing recognition among\
    \ corporate leaders that Agentic AI is more than a marginal tool. Citing Allianz\
    \ Partners’ Chief Data Officer on their deployment of Agentic AI: “We didn’t have\
    \ time to do proof of concepts, play around with generative AI, but rather think\
    \ of this as part of our backbone in our organization to perform tasks, to make\
    \ decisions \\[…\\] This was the very first time you could really hand over decisions.\
    \ Once we launched the Otera agents… this was really a moment where I think the\
    \ whole company realized the autonomous AI era is here.”\n\n# Strategic value\
    \ vs. tactical automation\n\nGiven that automation technologies have been used\
    \ in business for years, it is legitimate to ask where Agentic AI truly adds value.\
    \ A useful way to answer this is to contrast two automation archetypes: tactical\
    \ automation and strategic (agentic) automation.\n\nTactical automation assumes\
    \ linear processes and rule-based decisions. It has been used primarily to reduce\
    \ costs by replacing repetitive human effort in middle- and back-office processes.\
    \ Once these processes have been fully automated, the scope for additional gains\
    \ tends to be limited and exhibits diminishing returns.\n\nStrategic (agentic)\
    \ automation, by contrast, is non-linear and adaptive. Here, value comes from\
    \ decision leverage – the fact that autonomous decision-making offloads a significant\
    \ amount of work from humans, who are brought into the loop only by exception.\
    \ In this model, ROI is driven by the agent’s ability to discover the operating\
    \ context, decide the “next best action,” and build an emergent form of cognition\
    \ that enables adaptive personalization and continuous optimization.\n\nFor example,\
    \ consider an AI agent handling a flight-booking request. If the airline website\
    \ returns an error message, a traditional system would often stall, but an agent\
    \ can decide what to do next: try another path on the same site, switch to a different\
    \ airline, or alter parameters such as dates or airports – without getting stuck.\
    \ This illustrates how goal-oriented automation differs from narrow task execution.\n\
    \nThis leads to a useful three-layer view of value in automation:\n\n*   Value\
    \ layer 1 – Operational productivity\n\n    Value from automating tasks and speeding\
    \ up execution – productivity gains (tasks are completed faster and at lower unit\
    \ cost),\n\n*   Value layer 2 – Outcome quality and resilience\n\n    Additional\
    \ value from agentic coordination across domains, leveraging autonomous decision-making\
    \ towards achieving an overall goal – better outcomes (decisions are more consistent,\
    \ better-informed, and more robust across scenarios),\n\n*   Value layer 3 – Adaptive,\
    \ enterprise-wide systems\n\n    Further value from enterprise-wide adaptive systems\
    \ that learn in context – adaptiveness gains (new business models emerge and tap\
    \ new value pools).\n\nIn layer 3, entirely new models can arise. In consumer\
    \ retail, for instance, agentic commerce platforms may treat AI shopping agents\
    \ as the primary “client,” not the human buyer, forcing product providers to rethink\
    \ how they market, position, and price their offerings to machines as much as\
    \ to people.\n\nIn this context, agentic systems are particularly well-suited\
    \ and value-adding in certain types of use cases, such as:\n\n*   Customer support,\
    \ where agents proactively resolve issues instead of reactive chatbots simply\
    \ escalating frustrated users to a human,\n\n*   Supply chain optimization, where\
    \ agents dynamically reroute shipments and adjust inventory levels,\n\n*   Compliance,\
    \ where agents monitor regulatory changes and continuously self-audit the organization\
    \ against updated rules.\n\nConversely, agentic systems may create less value\
    \ – or introduce unacceptable risk – in certain situations, for example:\n\n*\
    \   Environments where human judgment is highly subjective and individualized\
    \ (“I like this jacket, but I want the fabric to feel softer”),\n\n*   Scenarios\
    \ where critical information is tacit, fragmented, or impossible to fully encode\
    \ for an agent, such as complex M&A negotiations, major credit decisions on opaque\
    \ counterparties, or crisis-management situations where material facts reside\
    \ in people’s heads or informal networks rather than in systems of record,\n\n\
    *   High-stakes contexts where the cost of a mistake outweighs operational benefits\
    \ (for example, misinterpreting a compliance rule that could trigger a multi-million-dollar\
    \ fine, or altering settings on a life-support device).\n\n# Organizational and\
    \ technical readiness\n\nAgentic systems show strong prospects for value creation\
    \ and, at the “value layer 3” level, open the door to significant market and competitive\
    \ disruption through new business models. Business leaders should view these opportunities\
    \ – and the corresponding risk of being disrupted – as a wake-up call to accelerate\
    \ their organizational and technical readiness, which is a key driver of the business\
    \ case for Agentic AI.\n\nThis readiness can be framed across six dimensions:\n\
    \n1.  Leadership alignment\n\n    *   Do we, as a leadership team, understand\
    \ the core agentic concepts and their strategic implications – both as opportunities\
    \ and as threats?\n\n    *   Have we clearly identified the business pain points\
    \ or opportunities that are worth addressing with Agentic AI?\n\n    *   For those\
    \ areas, have we defined clear boundaries between agent autonomy and necessary\
    \ human intervention?\n\n2.  Technical infrastructure\n\n    *   Do we have the\
    \ necessary infrastructure – data, MLOps, APIs – to support our Agentic AI agenda?\n\
    \n    *   To what extent can we still move forward if parts of our infrastructure\
    \ are not yet ideal, and where are the non-negotiable gaps?\n\n3.  Governance\
    \ and risk\n\n    *   Are we equipped with documented principles to guide our\
    \ stance on Agentic AI – for example, how to balance autonomy with augmentation\
    \ of human agents?\n\n    *   How will we ensure these principles are implemented,\
    \ monitored, and enforced?\n\n    *   What existing or new committees should oversee\
    \ these questions, and who is accountable when agents act autonomously?\n\n4.\
    \  Architecture\n\n    *   How will we design modular systems and their orchestration,\
    \ while ensuring seamless interaction with legacy systems?\n\n    *   How will\
    \ we prioritize which systems to modernize first, and which can wait, given budget\
    \ and resource constraints?\n\n5.  Technical resources availability\n\n    * \
    \  Do we have the right technical skills in-house to design solutions, learn from\
    \ feedback, and iterate effectively?\n\n    *   Do we have the skillsets needed\
    \ to understand the underlying models and deploy agentic scenarios in a friction-free\
    \ manner?\n\n6.  Change management\n\n    *   Do we have the right talent, cultural\
    \ agility, and risk appetite to take advantage of Agentic AI?\n\n    *   Are we\
    \ prepared to evolve roles, skills, and ways of working as agents become part\
    \ of core processes?\n\n    *   What does it mean for our organization to manage\
    \ both humans and machine-based agents as a unified “workforce”?"
  fmt: "\nThirdly, organizational awareness and adoption readiness have increased\
    \ markedly. After the emergence of LLMs and the initial “wow effect” experienced\
    \ by employees and managers across industries, the question of “what should we\
    \ actually do with this?” quickly rose on senior leaders’ agendas. In many organizations,\
    \ LLM adoption has been cautious – starting with “wait and see” positions until\
    \ implications were better understood, followed by a flurry of proofs of concept\
    \ that often did not make it into production. Yet this period has not been wasted:\
    \ the idea that AI is inevitable has now crystallized in leadership circles, and\
    \ many organizations have used this exploratory phase to build foundational capabilities\
    \ in data and governance (`MLOps`, `data governance`) that create fertile ground\
    \ for Agentic AI to take root.\n\nUltimately, there is a growing recognition among\
    \ corporate leaders that Agentic AI is more than a marginal tool. Citing Allianz\
    \ Partners’ Chief Data Officer on their deployment of Agentic AI: “We didn’t have\
    \ time to do proof of concepts, play around with generative AI, but rather think\
    \ of this as part of our backbone in our organization to perform tasks, to make\
    \ decisions […] This was the very first time you could really hand over decisions.\
    \ Once we launched the `Otera` agents… this was really a moment where I think\
    \ the whole company realized the autonomous AI era is here.”\n\n# Strategic value\
    \ vs. tactical automation\n\nGiven that automation technologies have been used\
    \ in business for years, it is legitimate to ask where Agentic AI truly adds value.\
    \ A useful way to answer this is to contrast two automation archetypes: tactical\
    \ automation and strategic (agentic) automation.\n\nTactical automation assumes\
    \ linear processes and rule-based decisions. It has been used primarily to reduce\
    \ costs by replacing repetitive human effort in middle- and back-office processes.\
    \ Once these processes have been fully automated, the scope for additional gains\
    \ tends to be limited and exhibits diminishing returns.\n\nStrategic (agentic)\
    \ automation, by contrast, is non-linear and adaptive. Here, value comes from\
    \ decision leverage – the fact that autonomous decision-making offloads a significant\
    \ amount of work from humans, who are brought into the loop only by exception.\
    \ In this model, ROI is driven by the agent’s ability to discover the operating\
    \ context, decide the “next best action,” and build an emergent form of cognition\
    \ that enables adaptive personalization and continuous optimization.\n\nFor example,\
    \ consider an AI agent handling a flight-booking request. If the airline website\
    \ returns an error message, a traditional system would often stall, but an agent\
    \ can decide what to do next: try another path on the same site, switch to a different\
    \ airline, or alter parameters such as dates or airports – without getting stuck.\
    \ This illustrates how goal-oriented automation differs from narrow task execution.\n\
    \nThis leads to a useful three-layer view of value in automation:\n\n* Value layer\
    \ 1 – Operational productivity\n  Value from automating tasks and speeding up\
    \ execution – productivity gains (tasks are completed faster and at lower unit\
    \ cost),\n* Value layer 2 – Outcome quality and resilience\n  Additional value\
    \ from agentic coordination across domains, leveraging autonomous decision-making\
    \ towards achieving an overall goal – better outcomes (decisions are more consistent,\
    \ better-informed, and more robust across scenarios),\n* Value layer 3 – Adaptive,\
    \ enterprise-wide systems\n  Further value from enterprise-wide adaptive systems\
    \ that learn in context – adaptiveness gains (new business models emerge and tap\

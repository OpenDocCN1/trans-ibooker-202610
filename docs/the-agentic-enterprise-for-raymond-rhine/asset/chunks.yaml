    # Introduction


    Humans are Agents. When we say ‘we have agency’ we mean we are able to postulate
    a goal of our own making, devise an action plan, and execute to deliver on that
    goal. As agents we have the ability to organize and impact our world, get feedback
    from our actions, and modify our actions based on that feedback in order to improve.


    Machine intelligence has improved such that it is taking a greater share of our
    decision-making, complementing and augmenting our world as AI agents.


    Like AI itself, and most other modern digital technology, we owe the concept of
    AI Agents to Alan Turing. In his 1950 treatise on [Computing Machinery and Intelligence](https://www.edwardfrenkel.com/turing-intelligence.pdf),
    he described machines that perceive input and act toward goals. This definition
    is silent on the environment within which the agent is operating and perhaps,
    Turing’s idea was that the agent would be unconstrained to act in the world.


    Today, the world in which an AI agent can operate has vastly expanded. Not only
    do we have a virtual world in the shape of the internet to complement the real
    world, we can also define any manner of virtual world we can imagine and engineer
    it into existence through programming.


    So which world do AI agents operate in? Is it fair to assume that ultimately an
    AI agent is to be able to perceive any given environment, and act toward any given
    goal? Who defines the goals? Are agents autonomously to decide on which goals
    to pursue? While this is possible at lower levels, at some point in the hierarchy
    of agents there needs to be an uber-goal that directs the system and its highest
    order agents in how they define their goals.


    Even if we borrow from nature and define the higher level goal to be survival,
    we, as humans, are still engineering this into the AI agents.


    The same applies to inputs. Surely an AI agent cannot be perceiving the world
    in its entirety, and so we’d have to engineer sensors for it, designed based on
    what we believe to be the most important information it would need in its pursuit
    of its goals.


    So AI Agents are an engineering concept.


    Through the years, as computing, storage, and AI have progressed, this definition
    of an AI agent has been adopted, implemented and experimented on in a variety
    of ways.


    In the seventies and eighties, AI scientists started off thinking we could create
    a single entity that would be artificially intelligent with no need for constraints.
    This generally capable AI agent would primarily be able to operate in the real
    world, perceiving any input and acting towards any given goal. This ambitious
    definition failed, in part due to lack of compute and labeled data resources,
    and in part because the AI algorithms were simply not up for the job.


    In the mid-nineties, the problem of AI was simplified, by simplifying the world
    within which the intelligence would manifest itself. What if we build an intelligent
    agent, representing us, not in the complex world we live in, but in the simpler
    world of the internet, which back then, was mostly text and hyperlinks.


    Thus, Agent-based AI took center stage. A [popular AI textbook](https://www.academia.edu/download/82860922/artificial_intelligence_modern_approach.9780131038059.25368.pdf),
    published in the late nineties, was called “Artificial Intelligence: A modern
    Approach” and the modern approach was this new constrained agent-based definition
    of AI.


    Before long, people started wondering what would happen if your agent ran into
    someone else’s agent. Should they collaborate or compete? Would there be a common
    inter-agent language?


    Multi-Agent systems became a subfield of AI, with some, including the authors,
    suggesting a new software paradigm called Agent-oriented Software Engineering
    (see [Figure I-1](#introduction01.html#ch00_figure_1_1771364788596603)) as a follow
    on to the object-oriented movement.


    ![](assets/ch00_figure_1_1771364788596603.png)


    Fast forward to today: Generative AI has shown unexpected emergent capabilities,
    most important of which is the understanding of Natural Languages. LLMs are able
    to understand, translate, and even write code or produce images based on a natural
    language description. Natural Language Processing, Understanding, and translation,
    problems that were the first non-numerical application of computers, and considered
    very difficult to solve, have been effectively addressed through the use of LLMs
    now.


    What’s more, these AI models can express intent and context in natural language.
    The very human ability to put concepts together in order to form new concepts,
    describe new contexts, or express new meaning is now available in machines, which
    makes them much more robust than any artificial system ever made.

    '

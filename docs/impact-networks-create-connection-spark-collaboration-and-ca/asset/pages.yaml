- pgno: 91
  md: 'There is real power associated with the catalyst’s position, and that power
    needs to be explicitly acknowledged at the outset. This is not a role to be taken
    lightly. In particular, this power shows up through the initial articulation of
    the network’s purpose and in how people are invited to participate. One of the
    best ways to make the process of cultivating a new network more equitable is to
    share this power with others by forming a diverse *design team*.


    Design team members steward the development of a network in service of its purpose
    and of those who will come to participate in the future. They consist of representatives
    from different parts of the system who work to collectively clarify why a network
    is needed and who needs to be involved. This small, thoughtful group should be
    able to represent multiple viewpoints and speak from a range of perspectives.


    The first mandate for the design team is to take what they heard from the exploratory
    meeting and refine it into a cohesive narrative for the fledgling network. In
    the process, they can clarify a draft purpose. Though a network’s purpose—its
    reason for being—can evolve over time, getting people to come together in the
    first place usually requires an initial high-level statement of the challenge
    or opportunity they are being invited to address. The design team will also consider
    what type of network is needed and how network participation might be bounded.


    Most important, they will answer questions that are necessary to organize an initial
    convening: Who needs to be involved? How will we invite people to join? Where
    will the convening be held? What topics might we need to address at the convening?
    And who will design and facilitate the convening? They may also consider how the
    network might proceed after the convening, including how the network might be
    structured, what communication systems it could use, how it might be resourced,
    who might provide ongoing coordination, and so on.


    Like the purpose, each of these preliminary considerations will be refined when
    participants are brought together, but it’s helpful to have draft proposals ready
    that the network can respond to, rather than asking a nascent network to develop
    them from scratch. When the design team has done the thinking necessary to give
    the network a strong foundation for its launch, it is time to organize an initial
    convening.'

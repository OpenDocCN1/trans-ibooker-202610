  img_proc: true
- pgno: 107
  md: 'network begins a pruning process, shrinking until it reaches an equilibrium—the
    ideal size for the network at that time. Ultimately, as Jeff Stibel, author of
    *Breakpoint*, attests, the quality of a network’s connections is much more important
    than its size.⁶


    While size is less of a constraint in some learning networks, our experiences
    have taught us to start somewhere between twelve and twenty-four participants

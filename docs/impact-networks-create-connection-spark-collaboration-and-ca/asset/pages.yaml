- pgno: 186
  md: '+   - Follow the network’s lead

    +   - Engage as peers

    +   - Take the long view


    Each practice is described in more detail below.


    # Follow the Network’s Lead


    The primary challenge for funders is to support networks without restricting or
    controlling their path. On a conscious or subconscious level, some funders think
    they deserve more influence over the network’s direction than participants because
    they provided the money. Yet, by holding too tightly to control—by insisting on
    paying for a set of predefined outcomes, for instance—they risk stifling a network’s
    potential.


    The key for funders is to let the network lead so that participants are free to
    create the future *they* want—not the future that funders want *for them*. “Foundations
    should not be the leaders, but instead provide support,” notes Liz Wilson, a senior
    executive at Small Foundation.¹⁶ According to Jennifer Husbands, a senior program
    officer at the Bill & Melinda Gates Foundation, this requires that funders “understand
    how to walk a tightrope between providing structure and encouraging organic connections
    to develop and flourish.”¹⁷ As a network funder, be clear on what you are supporting:
    you are not funding the fulfillment of a production order or provision of services
    to a specific number of people; rather, you are supporting the capacity of an
    ecosystem to engage a spectrum of perspectives, learn together, and self-determine
    optimal responses to local challenges.


    # Engage as Peers


    When funders play a prominent role in an impact network’s formation, they are
    in danger of reinforcing unhealthy power dynamics. A core lesson for network funders,
    writes David Nee, former president of the Graustein Memorial Fund, is to “share
    power with communities and other stakeholders, working alongside their peers as
    equal partners.”¹⁸'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'In particular, network funders should carefully consider their role in decision-making
    to avoid having outsized influence. For example, soon after catalyzing the RE-AMP
    Network, the Garfield Foundation ensured that its formal decision-making power
    was relegated to a single vote, just like every other network member. “Garfield
    realized it was important for us to pull back our central role,” recalls Ruth
    Rominger, director of the collaborative networks program at the foundation. “Funders
    have a tendency to want to own, but we decided we wanted to take more of a partnership
    role, while continuing to fund the network.”¹⁹


    # Take the Long View


    Many funders expect their grantees to show outcomes within just a few years. “Given
    the complexity of many issues that may have their origin in centuries’ worth of
    root causes, this expectation is just plain crazy,” writes Edgar Villanueva in
    *Decolonizing Wealth*.²⁰ The report titled *Embracing Complexity*, from Ashoka
    and others, echoes this sentiment, emphasizing the importance of preparing “for
    long-term engagement by being realistic about the time it takes to achieve systems
    change, acknowledging that the path of the initiatives will change along the way
    and encouraging realistic ambitions.”²¹


    In the case of Sterling Network NYC, the outcomes and even the duration of the
    network are not fixed: participants recommit to the network on an annual basis,
    but the Robert Sterling Clark Foundation has committed to supporting the network
    for at least ten years. According to Li, who helped catalyze the network as president
    of the foundation, “One of the great gifts foundations can provide is to allow
    people to focus on experimenting and putting their heads to the issues that are
    being explored, rather than spending all their time finding funding to sustain
    the work.”²²


    # Investing in the Future


    Although many recognize the need for greater coordination between organizations,
    collaboration remains underresourced. As Susan Wolf Ditkoff and Abe Grindle write
    in *Harvard Business Review*, “So few philanthropists meaningfully support or
    engage in [collaboration], even'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'though most are frustrated with the inefficient proliferation of siloed change
    efforts.”<sup>23</sup>


    Some funders have the impression that networks are especially expensive or difficult
    to fund, but the truth is, they don’t need to be—not if you’re investing in the
    right things, and not if you simply get out of the way and let the network get
    to work. To get started, “find a partner you trust who can help manage the network
    and hold a mirror up to you if you are impeding the network’s development,” suggests
    Jennifer Husbands.<sup>24</sup> We also encourage funders to focus on investing
    in dedicated network leadership, with all the roles it entails—including catalyzing,
    facilitation, weaving, and coordination. Under-resourced leadership is one of
    the primary factors we have seen that cause impact networks to fail to live up
    to their potential.


    Ultimately, an investment in networks is an investment in our ability to work
    across silos and sectors to get things done. To tackle our most pressing challenges,
    we must collaborate—and impact networks provide the essential infrastructure that
    enables individuals and organizations to connect, learn, and work together for
    a better future. “Take a learning-by-doing approach, and take the first step,”
    encourages Liz Wilson.<sup>25</sup> It’s time for funders to embrace the way of
    the network.'

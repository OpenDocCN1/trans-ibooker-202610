- pgno: 139
  md: '# CHAPTER 8


    # Coordinate Actions


    > *What happens to one happens to us all.*

    > *We can starve together or feast together.*

    > *All flourishing is mutual.*


    > — ROBIN WALL KIMMERER, *Braiding Sweetgrass*


    People are often inspired by the big new idea they have yet to try—the moonshot
    investment that will make all the difference. Large-scale change is, after all,
    why many impact networks form in the first place. But the process of creating
    large-scale change is not fast or easy. It usually means engaging with the slow
    work of understanding what is, what we want, and how we will build something different
    together. It can take a substantial amount of time, energy, and trusting relationships
    to persevere despite disagreements and roadblocks and to shift persistent mindsets,
    structures, and habits.


    It’s common for people to want to jump immediately into ambitious plans to change
    the system. In their eagerness to “get to action,” they launch new projects before
    building on the work that’s already underway. And when they encounter inevitable
    challenges or failures, they become demoralized, and their enthusiasm for the
    network fades. When this happens, participants might question whether the time
    they’re putting into the network is worth their while, and many will choose to
    disengage. As a result, the network’s full potential is abandoned before it has
    a chance to mature.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'We recommend another approach. Before launching into grand new collaborations
    that will require significant resources to implement, first develop a shared understanding
    of what people are already doing and build on the work already underway. In other
    words, even if you have ambitions of forming an action network, start by cultivating
    a robust learning network. After all, the qualities of learning networks are foundational
    to action networks as well.


    A key aspect of developing a learning network, and therefore any impact network,
    is to accelerate the flow of information between participants and foster a culture
    of reciprocity. In doing so, people begin to coordinate their actions with one
    another: sharing promising practices, reducing unnecessary duplication, and finding
    quick wins that demonstrate the immediate value of the network.


    # Accelerating Flows


    If networks are as strong as the connections that hold them together, those connections
    are only as valuable as what’s flowing through them.¹ Energy grids, for instance,
    are useful only when they carry electricity to their intended destination. The
    internet is functional only when data is transferred from router to router. The
    same is true of impact networks—the most effective networks are the ones where
    information and resources flow consistently from person to person.


    Strong information flows in particular unlock many other essential capacities
    of networks. “Most of what goes wrong in systems goes wrong because of biased,
    late, or missing information,” writes Donella Meadows in Thinking in Systems.
    “Information holds systems together.”² A greater circulation of information means
    that more resources and expertise can be shared across the system. Learning increases
    as promising practices are disseminated, and unnecessary duplication is reduced
    as people learn what others are up to. Messaging comes into greater alignment,
    actions begin to reinforce each other, and as a result the whole system becomes
    more coordinated and coherent.


    Once people have identified a common purpose and built trust, they are far more
    likely to support each other’s work—but only if they know what'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'each other is working on and how they can help. One of the most critical capacities
    of network leaders—and coordinators in particular, whose role is described in
    more detail later in this chapter—is enabling and accelerating the flow of information
    between participants.


    # Enabling Information to Flow In, Out, and Across


    Impact networks can accelerate the flow of information in three primary ways:
    by bringing *information in* from the network as well as from outside sources,
    organizing and sending *information out* to participants and others who are interested,
    and creating pathways for participants to easily share *information across* the
    network with one another.


    The Fire Adapted Communities Learning Network (FAC Net) has advanced a variety
    of strategies to accelerate the exchange of information between communities and
    organizations to enhance the practice of fire adaptation around the United States.
    The network forms learning circles, organizes and creates resources, and maintains
    a communication system that each one of its 150 members engages in.


    The fruits of its labor paid off during the devastating 2020 wildfire season.
    “Getting through these wildfire crises immediately came down to relationships
    and our ability to share information,” reflects Emily Troisi, one of the network’s
    coordinators. “People were using our communication system to share requests, donation
    opportunities, and connections to outside resources. Every person was texting,
    calling, and emailing each other to say, ‘I’m here, let me know how I can support
    you.’”³ Thanks in large part to the work of FAC Net since its launch in 2013,
    what was once a fragmented field is now a vibrant learning ecosystem.


    Another example of a network with an information-rich ecosystem is the IMPT, a
    global learning network focused on advancing multipurpose prevention technologies
    (MPTs) for women, described in chapter 1. The IMPT has developed some specific
    techniques that coordinators can use to accelerate the flow of information in,
    out, and across a network, as described in more detail below.


    # Information In'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'The process of gathering information into a network begins with a clear and
    consistent practice of collecting relevant resources and data from participants,
    as well as from outside sources. That information can then be organized and made
    available to participants through tools such as asset maps, searchable directories,
    and online databases. An interactive asset map, for instance, provides members
    with an easy way to identify the available resources, areas of expertise, and
    geographic regions present across the network—while also helping them to immediately
    connect with each other to follow through on what they learned. Detailed instructions
    for


    🔗 **Building an Asset Map** that also functions as a network directory can be
    found in the Converge Network Toolkit.


    Specifically, the IMPT gathers information from its members through its online
    resource center. The resource center collects a wide range of resources from beyond
    the network, including articles, presentations, events, and funding opportunities
    related to the network’s purpose. Network coordinators help to organize the resources
    gathered from participants so they are up-to-date and easy to find. Coordinators
    also attend conferences, subscribe to listserv groups and alerts, and track all
    MPT products in development in order to collect information from the broader field
    in addition to its members.


    # Information Out


    Once collected, information is sent back out to participants through webinars,
    calls, emails, and other means of distribution. Electronic newsletters, when curated,
    can be effective at providing participants with a broad overview of what’s happening
    across the network in only a few minutes.


    In addition to its monthly newsletter, full of information relevant to the field,
    the IMPT hosts regular webinars, presents at conferences, and provides opportunities
    for participants to share their work and answer questions. The network also hosts
    a website, theimpt.org, to make information about MPTs available to the public.


    # Information Across'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'Impact networks also provide participants with multiple channels to connect
    with each other directly so that information can flow freely between them, unrestrained
    from the bottleneck of a central hub. Most networks set up an online communication
    system where members can share resources, opportunities, and requests. To create
    feedback loops for learning, it’s also good practice to establish simple network-wide
    practices for sharing real-time learnings related to the work that people are
    doing.


    The IMPT enables the flow of information across the MPT field by weaving connections
    between people and organizations who should know each other but do not. They do
    so by identifying people who are conducting complementary research and then actively
    making formal introductions between them, going so far as helping to schedule
    an initial call. Coordinators also organize meetings ranging in size from small
    workshops to large conferences and regularly convene a collaborative group of
    funders to prioritize funding needs and fill funding gaps.


    # Network Coordination


    The people who specialize in developing the network’s ability to share information,
    capture learnings, and coordinate actions are called *network coordinators*. Coordinators
    provide the operational support that impact networks need to sustain their activities
    over an extended period of time. In particular, coordinators have four primary
    responsibilities:


    +   - Keep the network on track

    +   - Establish and maintain network operations

    +   - Provide knowledge management

    +   - Assist network teams


    Each responsibility is summarized in brief below.


    # Keep the Network on Track'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'Coordinators are a critical hub in the middle of a network, helping to tie
    everything together. One way to think about coordinators is as air traffic controllers.
    Air traffic controllers see and understand how all the planes in a given airspace
    are flowing. They don’t fly the planes, but they are trusted to help each aircraft
    get to its destination. They regularly communicate with the pilots to understand
    their plans and needs, and they use that information to help guide the whole system.


    Similarly, coordinators have their finger on the pulse of nearly everything that’s
    happening across the network. They work to integrate many parts into a unified
    whole. Because of their unique position, coordinators are well equipped to identify
    and frame emerging issues, collect agenda topics, and support the design of convenings
    and calls. Embedding evaluation practices, such as those described in chapter
    10, helps coordinators to track the network’s development and identify emerging
    needs and opportunities.


    # Establish and Maintain Network Operations


    Coordinators are instrumental in setting up and maintaining a network’s online
    systems (explained in more detail below), guiding logistics for convenings and
    other events, tracking the network’s finances, and managing evaluation activities.
    Though coordinators may not lead bookkeeping or evaluation, they make sure these
    tasks are covered by others who know what they’re doing, and they ensure that
    important information is passed on to participants.


    # Provide Knowledge Management


    Coordinators act as knowledge managers who gather resources and learnings from
    network projects, organizing the information so that it can be easily accessed
    later. They also curate and share this information with participants through newsletters
    and other means. Coordinators make sure that people have the information they
    need to advance network activities while building on the work that came before.


    # Assist Network Teams'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'As networks develop, coordinators may also provide a wide range of support
    to network teams, including the core team, project teams, and learning circles
    (these teams were introduced in **chapter 3** and will be explained in more detail
    in **chapter 10**). Coordinators may assist network teams by offering thought
    partnership, helping with scheduling, and securing a meeting location.


    Although coordinators can be a valuable asset for the network’s teams, this doesn’t
    mean they should be tasked with carrying out the project work of the network.
    Research has shown that networks in which the coordinators perceived themselves
    as primarily responsible for carrying out the network’s actions had the lowest
    levels of implemented results.⁴ Rather than doing the work of the network, coordinators
    cultivate the conditions that enable network members to do *what they want to
    do*, in service of the network’s purpose and in alignment with its principles.


    # Tech Tools for Impact Networks


    Most impact networks will benefit from an assortment of simple and effective software
    tools for tasks such as written communication, audio and video conferencing, polling
    and group decision-making, ideating and whiteboarding, collaborative document
    and spreadsheet creation, file sharing, and scheduling, as well as asset mapping
    and social network analysis. The right set of tools can drastically amplify the
    network’s ability to stay connected and self-organize. Choose the wrong tools
    and you might be stuck with steep learning curves and annoying tech issues. Technology
    is always changing, so rather than sharing specific tools in this book, we have
    compiled our favorites online in a continually updated list. Visit the Converge
    Network Toolkit to see our favorite Tech Tools for Impact Networks.


    Regardless of the specific tools you choose, make sure they are easy to use. The
    specific use-case of each tool also needs to be clearly understood by the network.
    Tools are only good if people use them, and people will look for any reason not
    to use yet another tool.


    It’s also important to take the time to orient participants simultaneously on
    the use of a new tool. Whenever we launch a new tech tool into a'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'network, we take a few minutes during a convening or on a network call to introduce
    it, explain how it is intended to be used, and show the basics of what it can
    offer. If possible, we also allow a bit of hands-on time for participants to try
    it out.


    If network coordinators are relatively tech savvy, they can make themselves available
    to assist those who are not comfortable with a particular tool—walking through
    it in detail until people feel at ease. We also encourage matching up network
    members as tech buddies, connecting the people who have high comfort with a given
    tool with people who need to learn. This way, participants can reach out to one
    another for support, rather than requiring one person to be responsible for providing
    tech support to the entire network.


    # Practicing Reciprocity


    People join networks because they feel they can make a contribution and think
    the network can help them do something they can’t do on their own. But no matter
    how much they care about the issue at hand, the altruistic commitment of participants
    alone is rarely enough to sustain a network over time. More than likely, networks
    will need to serve the personal or organizational priorities of those involved
    to sustain their engagement over time. This reflects the dynamic tension of self-interest
    and shared interest.


    Taking the time to deliberately coordinate actions is a great way to serve the
    self-interests of participants. You can do so by providing space on calls and
    at convenings for people to share urgent needs and to connect with others who
    might be able to support their work. We call this activity Rapid Coordination,
    and we incorporate it into nearly every network convening we lead. The activity
    begins by inviting participants, one by one, to briefly share something they need
    help with or a potential collaboration they’d like to explore with others. After
    the first person shares what they need, others are invited to raise their hands
    if they believe they can help (by sharing information, having a follow-up conversation,
    or providing resources). The process continues until everyone has been given a
    chance to make a request.


    As we facilitate the exercise, we remind the group that this is the time for making
    connections, not for holding a conversation, so it tends to move quickly, requiring
    no more than thirty seconds per person at most. When'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'conducted early in a network’s formation, this exercise often provides the
    first tangible direct benefits that members receive from their participation,
    and it demonstrates the immense value that the network can provide to advance
    their existing work. Visit the Converge Network Toolkit to see complete instructions
    for leading Rapid Coordination.


    If performed with enough consistency, this activity helps create a culture of
    generalized reciprocity. Whereas reciprocity is the practice of exchanging value
    with another person, generalized reciprocity is the practice of exchanging value
    with the network. People who practice generalized reciprocity give their gifts
    without the expectation of immediate return; they give with a sense of trust that
    their actions will eventually be reciprocated in one form or another by others
    in the network, although it isn’t clear how or when.


    When generalized reciprocity becomes a consistent, network-wide practice, participants
    give and receive each other’s gifts with generous intent. In turn, this creates
    a virtuous cycle: giving gifts builds trust, and trust facilitates the giving
    of gifts. The practice also creates a greater sense of belonging among participants.
    We need to give our gifts in order to feel like we’re contributing to something
    greater than ourselves. Having consistent opportunities to share and receive each
    other’s gifts is a big part of why people will continue to show up time and time
    again.


    # Responding to Crisis


    With a culture of reciprocity, along with a robust communication infrastructure,
    networks are able to effectively respond to chaotic situations. As described in
    the introduction, chaotic situations are turbulent and rapidly evolving, and they
    cannot be accurately predicted or controlled. When one is faced with a moment
    of crisis, the first necessary step is to provide an emergency response—to quickly
    coordinate actions and distribute resources to where they are needed most. This
    is something that networks are uniquely positioned to do.


    When the COVID-19 pandemic hit, the Cancer Free Economy Network (CFEN) took immediate
    action to support its members. Organizations provided staff time to help each
    other through the process of applying for'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'SBA Paycheck Protection Program loans and other forms of government support.
    Coordinators led discussions and webinars to share vital information about how
    member organizations could help protect the large number of public health professionals
    and worker-safety trainers they worked with. Public health professionals in the
    network shared the best scientifically based information available so that members
    could share that information with the at-risk communities and frontline workers
    they supported. And an emergency response fund organized by CFEN quickly distributed
    $250,000 into the hands of organizations to help them make up for canceled fundraising
    events, support their move to virtual operations and services, and provide direct
    COVID-related support for frontline workers and for constituents who found themselves
    in dire financial situations due to the pandemic.⁵ With its foundation of trust
    and established channels for coordination already in place, CFEN was able to respond
    quickly and effectively to support its members and those they serve.⁶


    The critical importance of being able to coordinate actions quickly was also evident
    in the Santa Cruz Mountains region during the height of the 2020 wildfires. The
    CZU Lightning Complex wildfire took over a month to contain, during which time
    86,000 acres burned in San Mateo and Santa Cruz counties.⁷ As the fire raged,
    more forest was burning in Santa Cruz County than in San Mateo County. Because
    of this discrepancy, the San Mateo Resource Conservation District (RCD), a government
    agency usually constrained by jurisdictional boundaries, had a bit of extra capacity
    and immediately sent their staff across county lines to support Santa Cruz’s postfire
    recovery work. Recalling that experience, Kellyx Nelson, the executive director
    of the San Mateo RCD and a founding member of the Santa Cruz Mountains Stewardship
    Network (SCMSN), remembers thinking, “We’ll figure out the problems with county
    boundaries later; we’ll just find a way.”


    Meanwhile, the Santa Cruz RCD, another organizational member of the SCMSN, was
    so busy responding to the fire that they didn’t have the bandwidth to raise resources
    for their efforts. To provide help, San Mateo passed 80 percent of the funding
    they received from the USDA Natural Resources Conservation Service to Santa Cruz,
    with no assurance that funding would ever come back. “That wouldn’t have happened
    without the'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'kinds of relationships and conditions the network provides,” says Nelson. “The
    network makes us think about why it benefits all of us to work at a landscape
    scale, and to work across boundaries and across sectors, even if there isn’t an
    immediate return on that investment. We’re continually looking for how to make
    it work, instead of focusing on why it won’t.”⁸


    One of the most valuable qualities of impact networks is that many of their benefits
    are likely to endure even after the network’s formal life cycle ends. By engaging
    in a network, participants develop a greater awareness of the interconnectedness
    of the system of which they’re a part and a deeper appreciation for the needs
    of others. Even without continued engagement, that shift is likely to sustain.
    Likewise, though relationships may fade, the foundation of trust that bonds people
    together will never fully disappear. As a result, those involved in a network
    will often continue to call on each other for information, guidance, and support
    for years to come, and resources will continue to flow more freely than they did
    before. By strengthening the fabric of our social systems, we become more resilient
    to change and more responsive in times of urgent need.'
  merge: -1

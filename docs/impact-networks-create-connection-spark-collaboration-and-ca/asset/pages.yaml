- pgno: 74
  md: 'Deliberate strategies set their sights on accomplishing a series of planned
    actions to realize a set of well-defined outcomes. At the same time, strategy
    also tends to emerge over time as planned activities collide with reality and
    are then adapted to accommodate a changing experience. Emergent approaches to
    strategy recognize that we simply cannot predict the future, and that it is often
    necessary—particularly in the face of complexity—to learn your way into what needs
    to be done and how to do it.


    One may think about emergent strategy as the act of “crossing the river by feeling
    the stones,” as the Chinese saying goes. Or as E. L. Doctorow said about the process
    of writing a book, “It’s like driving a car at night. You never see further than
    your headlights, but you can make the whole trip that way.”⁸


    In the Western world in particular, we often assume that we know what needs to
    be done and how to do it. We have a tendency to focus on identifying strategic
    priorities and metrics and then driving activities to accomplish stated goals.
    In other words, the default mode is to be deliberate: we get organized and get
    things done. Yet, a purely deliberate approach is simply inadequate when it comes
    to addressing complex issues that are ambiguous, nonlinear, and constantly evolving.
    “Ironically, the act of predicting the path may be the obstacle to achieving the
    purpose,” writes Peter Block in *Community*.⁹


    Consider the difference between a map and a compass. A map provides a model of
    the terrain, with precise locations for the mountains and rivers, and a clear
    path through the landscape. But maps are useful only when someone has traveled
    the path before and, therefore, when they can give an accurate description of
    what lies ahead.


    When one is faced with new roads that have yet to be traveled, a compass is a
    much more useful tool. A good compass points toward a specific direction: your
    purpose, your North Star, the future you are creating. It does not tell you exactly
    how to get there, but it can help orient you when you’re faced with unexpected
    obstacles in a shifting terrain. When you’re unable to rely on a map to guide
    your route, the only option is to stay emergent, sensing into the world around
    you, taking it step by step, and adapting to what comes next.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'You can foster emergent ways of working by prioritizing connection, sensing
    for clues of how the future is unfolding, and engaging in experimentation to test
    hypotheses and iterate strategies as you move forward. Each of these three ingredients
    of emergence is discussed below.


    # Prioritize Connection


    The most vibrant conditions for creativity and new life are found in the places
    where different parts of a system intersect. The areas where ocean meets land
    in mangrove ecologies and where coral reefs meet ocean in reef ecologies are some
    of the most biodiverse natural ecosystems on the planet.[^10] In human communities,
    interactions between diverse actors yield new ideas and possibilities for action.
    One lesson we have learned is that instead of prioritizing the total number of
    connections, it is more worthwhile to focus on the diversity and quality of those
    connections. As activist and educator Grace Lee Boggs has said, “In this exquisitely
    connected world, it’s never a question of ‘critical mass.’ It’s always about critical
    connections.”[^11]


    # Sense into the Future


    Sensing means tuning your awareness into what is happening and what is wanting
    to emerge. The key to sensing well is to ask good questions and listen deeply.
    Questions spark creative conversations that can transform our understanding of
    the world. “Questions, more than answers, are the pathway to collective wisdom,”
    writes Daniel Christian Wahl in *Designing Regenerative Cultures*.[^12] Meanwhile,
    the quality of your listening changes the nature of the conversation. When people
    feel deeply heard, they are more likely to be open and share more nuanced and
    intimate perspectives. As a result, new meaning arises that can help guide the
    direction of the network. “Look and listen for cues the network is sending you,”
    suggests Yadira Huerta of the Justice in Motion Defender Network. “The network
    is always trying to tell you where it does and does not want to go.”[^13]


    # Engage in Experimentation'

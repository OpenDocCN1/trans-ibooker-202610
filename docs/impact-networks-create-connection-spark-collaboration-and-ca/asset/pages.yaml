- pgno: 37
  md: 'Relationships are at the heart of everything that impact networks accomplish.
    From two decades of research on networks and other multistakeholder collaborations,
    Jane Wei-Skillern of the Haas School of Business at the University of California,
    Berkeley, finds that “the single most important factor behind all successful collaborations
    is trust-based relationships among participants. Many collaborative efforts ultimately
    fail to reach their full potential because they lack a strong relational foundation.”¹¹


    While much energy is directed to make the individual parts of any system more
    effective, people often overlook the opportunity to strengthen the system as a
    whole through the webs of relationships that tie it together. It is quite common,
    for instance, for foundations to invest tremendous resources in individual organizations—and
    expect them to create an outsized impact—without investing in the collaborative
    infrastructure that allows multiple organizations to combine their efforts in
    powerful ways. Time and time again we see that a strong network of relationships
    between individuals and organizations is essential to create systems that are
    resilient, intelligent, and innovative. In the absence of relationships, effective
    collaboration is not possible.


    To better understand the degree of fragmentation that existed across the Santa
    Cruz Mountains region, we conducted an initial social network analysis (SNA) just
    prior to the network’s first convening and a second analysis six months later
    after its second convening. In a survey, participants were asked to confidentially
    assess the degree to which they were connected with every other person in the
    network (options included 0–No Connection, 1–Acquaintance, 2–Relationship, and
    3–Strong Relationship). As seen in figure 1.5, few relationships existed, particularly
    between leaders from different types of organizations. The nodes represent organizational
    leaders, the links indicate a relationship or strong relationship between two
    people, and the associated shades represent a particular organization type, such
    as government agency, land trust, or research institution (specific identifying
    information has been removed to protect personal privacy).'

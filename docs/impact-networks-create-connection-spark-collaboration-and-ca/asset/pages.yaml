    With a discrete set of priorities to focus on, all participants could start aiming
    their efforts—and their organizational resources—in the same direction; all their
    various efforts would finally become mutually reinforcing. Participants also began
    self-organizing into project teams to define and implement strategies for action.
    In one example, a project team took up the challenge of shifting states’ focus
    toward retention strategies, not just recruitment strategies as is most common,
    and providing school leaders with practices for improving workplace culture.


    Project teams were supported by the network and led by passionate participants.
    They provided a mechanism for bringing together actors from across the system
    to collaborate on specific, time-bound challenges. As one team leader expressed,
    “Before project teams, I didn’t know any other way to pull together people from
    across the nation that could have an impact on the teaching profession. I put
    my idea out there and ended up with lots of great partners.”⁸ Specific tips for
    forming and leading project teams are provided in chapter 10.


    The effort to identify leverage points also led to an unexpected result: a massive
    increase in participant engagement. “When, as a network, you can choose to focus
    on a few critical opportunities—not because you or I thought they were the right
    places to focus, or because a panel of experts thought they were the right places,
    but because the whole community came'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'together to identify them—it’s so mobilizing,” says Milgrom-Elcott. Today 100Kin10
    is on track to reach its goal of one hundred thousand excellent STEM teachers
    in ten years, and it has raised more than $130 million to support its participants
    in working toward significant reform of the system.


    # Creating Transformation


    In *Change for the Audacious*, Steve Waddell outlines three strategies to create
    change: incrementally, through reformation, and through transformation.[^9] Incremental
    change seeks to improve performance within the existing rules of the system. It
    involves building on the things that are already happening and sharing learnings,
    experiences, capacity, and expertise. This can be achieved by coordinating actions
    across a network, as outlined in the previous chapter.


    Fundamentally changing systems, however, requires reformation or transformation.
    Reformation aims to change the way a system works, altering its rules, structures,
    beliefs, and behaviors. Transformation is the work of creating a new system altogether.
    While identifying and acting on critical leverage points may chart a path toward
    reformation or transformation, there are two other particularly potent strategies
    that a network may pursue: shifting social norms and growing a movement. In both
    cases, impact networks are powerful catalysts.


    # Shifting Social Norms


    Social norms are the unspoken rules of behavior that keep the current system intact.
    On their own, most norms are not inherently good or bad. However, norms can be
    harmful if they are not explicitly named and proactively chosen.


    > As Kenneth Jones and Tema Okun write in their *Dismantling Racism* workbook,
    “Many of our organizations, while saying we want to be multicultural, really only
    allow other people and cultures to come in if they adapt or conform to already
    existing cultural norms. Being able to identify and name the cultural norms and
    standards you want is a first step to making room for a truly multicultural organization.”[^10]
    When norms remain unacknowledged, they reinforce aspects of the dominant culture
    that can'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'suppress diverse ways of knowing, inhibit expression, and violate the dignity
    of those from nondominant groups.


    For example, in the United States, as well as in many other parts of the world,
    dominant values born from a culture of white supremacy and capitalism, such as
    individualism, competition, and structure, lead to social norms such as dependence
    on a singular leader, emphasis on individual achievement, and reliance on predictable
    rules (written and unwritten).

    When these norms exist as the unexamined default for an organization or network,
    contrasting norms — such as lifting up collective efforts, promoting inclusive
    both-and thinking over polarizing either-or thinking, and embracing emergence
    — are minimized or excluded.


    An essential practice for impact networks, then, is to consciously choose and
    live into norms that reflect a network mindset and promote their values and principles.
    When this happens, it can change everything about how a system operates. “Shifting
    our way of being is our tangible outcome,” says Taj James of Movement Strategy
    Center. “Systems change comes from big groups making big shifts in being.”¹¹


    Early in its development, the leaders of Resonance Network made the decision not
    to replicate hierarchical ways of doing things. Dominant hierarchical norms were
    in direct conflict with its vision for a world rooted in deep relationship, vibrant
    community, and connection to the planet. The network way of working took some
    time for people to get used to, but it paid off in the end. “At first, people
    were looking for who’s in charge, looking for top-down decision-making,” remembers
    Alexis Flanagan, a leader of the network. “There were some trade-offs — we built
    more slowly and more intentionally than a lot of stakeholders would have liked
    us to — but it was necessary for us to establish the culture and the practices
    that have benefited us and gotten us to where we are right now.”


    Shifting more fully into new social norms requires ongoing attention. “We constantly
    come back to deep, deep reflection on habits, and what we can practice instead,”
    says Flanagan. “We believe that intentional practice is a way to interrupt these
    habits and transform them.”¹²


    Once a network has done the work of articulating and shifting its own social norms
    in practice, it can turn its attention toward helping replicate those new norms
    throughout the larger systems of which it is a part.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'Networks are perfectly positioned to do this, as they are “the primary pathways
    for the spread of new social norms,” according to Damon Centola, sociologist and
    author of *How Behavior Spreads*. ${}^{13}$


    When networks live the change they wish to see, they can create new patterns of
    behavior that spread outward like ripples on a pond. As new adopters join in,
    they align messaging and further reinforce the growing influence of the network,
    and as a result the change continues to replicate well beyond the initial group.
    Research shows that once 25 percent of the actors in a system have adopted a given
    norm, a tipping point is reached, triggering a shift in the rest of the population.
    ${}^{14}$


    Consider the norms that dictate how most hospital systems in the United States
    treat patients with serious illnesses. Seriously ill patients approaching the
    end of life are commonly categorized as requiring hospice, they are kept in the
    hospital as inpatients, and their physical pain is managed with medication until
    they pass away. This was the adopted norm at the UCSF Health system as well. That
    is, until new norms around palliative care were championed by Steve Pantilat,
    MD, and his colleagues.


    Pantilat, founding director of the UCSF Palliative Care Program and president
    of the board of the national Palliative Care Quality Collaborative, knew that
    palliative care involves addressing not only the physical pain that patients experience
    but also the social, emotional, psychological, and spiritual distress that come
    with serious illnesses. To help spread this new norm of care throughout UCSF Health,
    my colleague David Sawyer and I worked with Pantilat to catalyze the Coordination
    of Care Network, an action network that connected the system’s twelve sites and
    ten health disciplines interested in palliative care.


    The network convened dozens of leaders from across the system for the very first
    time. They worked together to build the case for palliative care by demonstrating
    that these new norms for treating seriously ill patients result in dramatically
    better outcomes for both the patients and the hospital system. The network also
    offered palliative care education to providers and identified champions who could
    help boost the profile of palliative care services. While the network was only
    one part of a comprehensive and multiyear effort by Pantilat and colleagues to
    spread palliative care throughout UCSF Health, it played an important role in
    helping to'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'coordinate messaging, engage a broad group of stakeholders, and build momentum.


    A few years after the formation of the Coordination of Care Network, UCSF established
    the Division of Palliative Medicine to provide a permanent hub that will continue
    to promote and coordinate palliative care across the health system. In addition
    to its palliative care services, the division provides educational programs for
    both students and clinicians, conducts research to improve the quality of care
    provided to seriously ill patients, and has become a key resource for teams that
    want to establish and grow their own palliative care services. Though there is
    still work to be done, “whole-person palliative care” is quickly becoming the
    norm at UCSF Health, transforming the health care experience of seriously ill
    patients and their families.¹⁵


    # Growing a Movement


    For generations, movements have adopted a network approach to maintain cohesion
    and scale their impact. Research from Leslie Crutchfield, author of *How Change
    Happens*, found that the most successful social movements incorporate a decentralized
    structure that fosters connection and coordination across the movement, rather
    than a top-down hierarchical structure that dictates the actions of its chapters.
    The organizations and leaders most central to the growth of these movements, writes
    Crutch-field, conceive of themselves “not as commander at the helm of an army,
    but rather a coordinator at the center of a network.”¹⁶ They “purposely push power
    out to the grassroots, vesting authority in local chapters rather than controlling
    from the top.”¹⁷


    This is the function of movement networks. Multiple learning and action networks
    (sometimes called *chapters*) work autonomously to create change locally, and
    they are connected together to facilitate communication, coordinate actions, and
    catalyze change on a broader scale. As a network-of-networks, the movement network
    maintains a greater reach and larger influence than most impact networks can achieve
    on their own.


    The California Landscape Stewardship Network (CLSN), for example, connects thirty
    environmental networks together to build collective power'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'and advocate for policy change at a statewide level. As is typical among movement
    networks, the CLSN relies on regional networks, such as the Santa Cruz Mountains
    Stewardship Network, the One Tam initiative, and the Orange Coast Collaborative,
    to make decisions and take action relevant to their local context. At the same
    time, the CLSN combines the forces of its members to advance statewide policy
    efforts such as the Cutting Green Tape initiative, which is removing counterproductive
    barriers to restoring, enhancing, and preserving natural resources across California.


    The success of the Otpor movement in Serbia provides a good case study in how
    social movements can adopt a network approach to bolster their efforts. Otpor
    was integral to the ouster of Serbia’s strongman ruler Slobodan Milosevic in 2000
    (Otpor means “resistance” in Serbian).


    Before Otpor was established, there were frequent mass protests attempting to
    overthrow Milosevic in the 1990s. Drawing more than one hundred thousand people
    to the streets, these demonstrations created a whirlwind of energy that seemed
    poised to create lasting change. At the time, however, the movement did not have
    an organizing structure that could gradually increase pressure over a sustained
    period of time. When Milosevic consolidated his power further and brutally punished
    those who opposed him, the movement faded.


    Learning from these setbacks, a group of activists who had participated in the
    earlier demonstrations formed Otpor. As a movement network, Otpor balanced cohesiveness

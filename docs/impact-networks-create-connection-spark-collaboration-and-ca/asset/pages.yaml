- pgno: 113
  md: 'organically emerge. As you plan out your convening, keep the following considerations
    in mind:


    **First, things will almost always take longer than you expect.** The more people
    there are, the longer things will take. Introductions will run long, conversations
    will run long, and breaks will most certainly run long. If they don’t, that’s
    great! You’ve found yourself a few extra minutes. But to be safe, assume that
    nearly every part of the agenda will require more time than you initially imagined,
    and plan accordingly.


    **Second, conversations need space to breathe.** Space for conflict, space for
    tension, space for people to introduce new perspectives. Create enough space so
    that every person who wants to speak their mind can do so, especially the introverts
    and people who are usually on the margins of conversations. Rushing a conversation
    to stay on time is an easy way to shut down creative thinking and frustrate a
    group. Few things are more annoying than a facilitator cutting off a conversation
    just as it was getting to the heart of the matter.


    **Third, magic happens in unstructured time.** Provide long breaks that allow
    participants to reflect and recharge. And create social spaces where participants
    can informally connect and have the conversations they need to have—on their own
    terms and in their own time. On countless occasions, we’ve seen the most memorable,
    productive, hilarious, and intimate moments of the day happen after the formal
    agenda has concluded.


    # Infuse Energy into the Network


    Each convening needs to be a unique and valuable experience. The moment when convenings
    turn into tedious affairs filled with updates, presentations, and procedural deliberations
    is the moment when participants start to lose interest and energy begins to fade.
    To make every convening special in its own way, frame conversations that get to
    the core of the network’s biggest challenges or growth areas, design interactive
    exercises that deepen relationships, and don’t be afraid to try something new.
    As a participant told us after a convening we led, “I’ll keep showing up just
    to see what happens next!”


    Another way to integrate a quality of aliveness into each convening is to cycle
    between different energetic frequencies throughout your time together, mirroring
    the ebb and flow of our breath or waves on the shore.'

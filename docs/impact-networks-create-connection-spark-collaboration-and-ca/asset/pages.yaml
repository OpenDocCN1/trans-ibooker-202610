- pgno: 53
  md: 'complex environments, coherent self-organization is a critical force, combining
    diverse perspectives and enabling widespread experimentation for a common good.


    Fundamentally, the role of network leaders is to help diverse groups find the
    shared purpose that unites them, to foster self-organization, and to coordinate
    the actions that emerge so that they inform and reinforce one another. We may
    not be able to predict how to best address complex challenges, but through the
    emergent and self-organizing capacity of networks, we can learn our way into the
    future, together.'

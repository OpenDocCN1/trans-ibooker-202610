- pgno: 97
  md: 'Foundation, Resonance Network has evolved to include a growing constellation
    of people committed to building a world without violence.


    In the initial stages of the network’s development, leaders recognized the need
    to have a clear picture of the world that they wanted to create. “An entirely
    new way of being is required to live in and into these times,” they wrote. “The
    art of creating new solutions and possibility begins with knowing how it is we
    want to live.”¹⁶


    At an early convening to clarify the network’s purpose, thirty leaders gathered
    in Boston for three days in a room filled with artwork, flip charts, and sticky
    notes. Throughout their time together, they explored a profound question, offered
    by political strategist and Zen priest Norma Wong: “In a world rooted in interdependence,
    belonging, and living in harmony with other people and the planet, what is your
    vision for this world we want in one hundred years?” To explore the question from
    multiple perspectives, they also asked follow-up questions, such as “How do we
    get our food?” “What’s our relationship with water?” “How do kids learn?” “How
    do we keep people safe?” “How are children born?” and “How do people die?”


    Participants began to sense into the future they hoped to see. They started ideating,
    drawing on flip charts, building off one another’s visions, and accentuating common
    threads. Facilitators then asked the group, “OK, if that’s what you see in one
    hundred years, where do we have to be in fifty years to make that hundred-year
    vision happen?” After more time for ideation, participants were asked to consider
    a shortened time horizon: “For that fifty-year vision to happen, where do we have
    to be in twenty-five years?”


    With each step, participants were challenged to bring their vision closer and
    closer to the present day, identifying potential strategies that could be transformational
    over the long term. Working backward in time, people were asked, “Where do we
    have to be in two years?” and finally, “Where do we have to be, right now?”


    “At first, people felt overwhelmed with how bold the vision was and how audacious
    it was that we were putting that vision on paper,” reflects Alexis Flanagan, co-director
    of the network. “Then people got energized. They saw what we needed to do right
    now in order to start to make all this happen.”¹⁷ At the end, participants stood
    back and looked at the work they'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'had done. The network’s reason for being became clear: to transform the roots
    of violence by building a world grounded in deep relationships, vibrant community,
    and connection to our planet.


    # Crafting a Collective Purpose


    The formation of the Santa Cruz Mountains Stewardship Network provides an example
    of how a group of diverse stakeholders can define a collective purpose. When over
    a dozen organizations originally came together to figure out how they could work
    together more effectively, there were significant questions about why the network
    was being created. People had concerns about hidden agendas, no single issue was
    of interest to everyone, and the attending organizations had very different short-term
    priorities.


    Before members could agree on their collective purpose, they first needed to clarify
    what was meant by “stewardship.” Defining key terms is a common early task for
    a new network—only by agreeing on what stewardship meant could participants begin
    to make it actionable.


    They also needed to develop a shared understanding of the system: the historical
    and present-day factors influencing stewardship in the region. They completed
    a historical analysis, examined external trends and forces through scenario planning,
    and identified hopes and concerns.


    Through many rich discussions, participants began to find common ground. Most
    people agreed that effective stewardship required a multifaceted, mosaic approach.
    They recognized threats from development and climate change. And nearly every
    person agreed that strengthened connections and collaborative relationships would
    benefit their work and the region. While there were plenty of disagreements of
    how to most effectively steward the land, there was also plenty of agreement about
    why effective stewardship was important.


    Eventually, participants were ready to craft and refine their collective purpose.
    As the facilitators, we asked them to articulate the purpose of the network from
    their perspective by completing the phrase “How do we . . .” We then took what
    they shared and offered an initial version of a purpose for them to refine. We
    find that it is easier for large groups to improve upon a draft statement than
    it is for them to build one from scratch.'

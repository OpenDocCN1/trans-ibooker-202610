  img_proc: true
- pgno: 99
  md: 'Participants debated the draft in small groups and offered suggestions for
    improvement. Rather than holding a group wordsmithing exercise, which is rarely
    a good use of time, a team of volunteers agreed to take the network’s feedback
    and refine the statement during a break. Later in the day, the team shared their
    proposed purpose: “To cultivate a resilient, vibrant region where human and natural
    systems thrive for generations to come.” Using the consent-based decision-making
    process outlined in chapter 10, all participants agreed to formally adopt the
    sentence as the network’s purpose with the understanding that the network could
    revisit it at any time in the future if necessary. Over the course of the next
    six months, this purpose evolved into a more complete network charter, containing
    principles, participation agreements, and high-level priorities, which was ratified
    by the network’s twenty-one members at their third convening (network charters
    are explained in more detail later in this chapter).¹⁸


    # Defining Shared Principles


    Whereas values are fundamental beliefs about what a network holds as important,
    principles are corresponding guidelines to inform decisions and actions. Principles
    operationalize values. Therefore, principles are the ultimate articulation of
    what the network stands for and how it will show up in the world. When created
    collectively, they provide a powerful touchstone that enables participants to
    hold themselves and each other accountable for walking their talk in how they
    work together to advance the network’s purpose. Having clear principles means
    that “as conditions change, there is a common understanding of what matters, a
    way to return to shared practice and behavior,” writes adrienne maree brown, author
    of *Emergent Strategy*.¹⁹


    When I worked with colleagues and partners to help launch the LISTEN network (which
    stands for Leaders in Science and Technology Engagement Networks), we spent much
    of the first year engaging with representatives from dozens of different networks,
    national organizations, and scientific societies to define a purpose and a set
    of principles that would reflect their shared aspirations for the future. The
    purpose, “To nurture relationships among all people and science,” has given the
    network a compelling focus to orient around, and its principles have been critical
    in guiding conversations'

  md: '![](img/4854536a9a7bcce4fd5250605cae8350_44_0.png)


    **FIGURE 2.2.** A hierarchical structure, drawn as a hub-and-spoke network.


    Being near the top of a hierarchy (or the center of a rigid hub-and-spoke network)
    has its benefits—you have more control and are more likely to be needed. It also
    has its costs. The more you control, the less people are able to self-organize
    to advance work on their own. The more you are needed, the less resilient the
    system is in the event that you are unavailable. The more you preserve the hierarchical
    structure, the more you create a bottleneck and constrict the free flow of information.
    Being critically needed and in control is a double-edged sword.


    This is a big part of why hierarchies have a hard time adapting quickly to changing
    circumstances. When the organizing structure is predefined and inflexible, there
    is little room for collective discovery, spontaneous collaboration, and unforeseen
    innovation. Hierarchies are good at achieving the specific ends they were set
    up to achieve, but they are not well suited to addressing complex issues that
    have no readily apparent solution.


    For these reasons, hierarchical structures are a poor choice for multistakeholder
    collaborations. By holding on to control, the people at the'

- pgno: 102
  md: 'they still resonate. When the RE-AMP Network did so years after its launch,
    significant revisions resulted.


    The RE-AMP Network started in 2004 when the Garfield Foundation convened a group
    of advocates and funders to advance clean energy initiatives in the Midwest. After
    analyses were conducted to identify potential areas for action, it became clear
    that even if they made tremendous progress on advancing clean energy in the region,
    the results would come nowhere close to what was necessary to fundamentally shift
    the system. Consequently, they expanded their focus to reduce greenhouse gas pollutants
    in multiple ways, including advancing clean energy and energy efficiency, shutting
    down coal plants, and capping carbon.


    Early on, RE-AMP was extremely successful, passing energy-efficiency policies
    in multiple states and preventing the buildout of coal plants that had previously
    been seen as inevitable. These successes led to the rapid growth of the network.
    But in years five through seven, between 2008 and 2010, the effort hit a roadblock.
    The Great Recession devastated local economies, a new wave of politicians in the
    region stalled the network’s policy work, and eventually some of RE-AMP’s biggest
    funders decided to end their support. “At this time the network started to wonder,
    ‘What’s next?’” recalls Ruth Rominger, director of the collaborative networks
    program at the Garfield Foundation. “So, it was a logical moment to revisit the
    original analysis and purpose of RE-AMP.”24


    The period of growth had attracted new people who saw the value in the way RE-AMP
    worked. These members steadfastly maintained that climate change could not be
    addressed without tackling the racist, colonialist, and capitalist structures
    that allowed pollution to flourish. They also made clear that further progress
    would not be possible without challenging paradigms about who has power to make
    decisions. This group gradually grew and steadily gained influence.


    Over time, the network’s membership and leadership evolved. The new leadership
    eventually recognized a need to refresh the network’s systemic analysis and, this
    time, to recognize that climate change is at its core a symptom of social and
    political problems, rather than primarily a technical problem.'

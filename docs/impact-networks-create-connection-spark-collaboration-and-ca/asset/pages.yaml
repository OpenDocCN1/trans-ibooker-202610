    Instead, they lean into emergence, supporting the network to self-organize into
    a vibrant ecosystem—full of connection, learning, and collaborative action—without
    unilaterally controlling its path.


    Self-organizing happens when people are invited to notice and act on opportunities
    based on their own judgment. When people are free to try new things, initiate
    experiments, and connect and collaborate with others from across the system, networks
    become “leader-ful.”¹⁰ Whereas opportunities for leadership in a hierarchy correspond
    to one’s position in the structure, in a network, opportunities for leadership
    arise everywhere. Everyone has the agency to step in and advance projects they
    have energy for. As a result, responsibilities for the outcomes of the system
    are shared, and people recognize that they can have a hand in shaping the future.
    This is a big change from most hierarchical systems, where a small leadership
    group is entrusted to make sense of what is happening and plan out what comes
    next.


    There is a common misconception that self-organization means something like spontaneous
    self-generation, but self-organization does not happen randomly or by sheer luck.
    Instead, the self-organizing potential of a network is fostered by servant leaders
    (to borrow a term coined by Robert Greenleaf¹¹) who cultivate the conditions for
    connection, learning, and action to arise. These leaders also ensure that this
    all happens not in a vacuum but in relationship to a clear purpose that people
    can orient toward. As a result, while the actions of the group are likely to be
    quite varied in strategy and scope, they remain coherent and mutually reinforcing.
    In'
  merge: -1

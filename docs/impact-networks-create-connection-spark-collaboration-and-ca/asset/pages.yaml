  md: '# CHAPTER 3


    # Making Networks Work


    > > *There is immense power when a group of people with similar interests gets
    together to work toward the same goals.*

    > >

    > > —IDOWU KOYENIKAN, *Wealth for All*


    Networks are more than just a way of seeing or thinking about the systems around
    us; they are a way of organizing to meet the complexity of our world. Impact networks
    are a viable approach when two conditions are met: (1) you face a complex issue
    that you can’t solve on your own, and (2) greater levels of connectivity are needed
    between individuals and/or organizations to address the issue.[^1]


    Depending on their specific focus, impact networks may manifest in different forms,
    each with a distinct structure. As introduced in [chapter 1](#), the three primary
    forms of impact networks are learning networks, action networks, and movement
    networks. While we use these categories to distinguish important differences in
    focus and structure, in practice networks are so fluid and emergent that they
    rarely fall neatly into a single defined category. For instance, impact networks
    sometimes start out as a learning network but then evolve later into an action
    network as more structure is needed to collaborate around shared projects.


    This is not to say that becoming an action or movement network has to be the endgame
    for all impact networks in order to effect social change. Quite the contrary—every
    form has its place, and each may be the best approach, depending on the network’s
    purpose and context. If you are not sure which form will best suit your network,
    start by adopting the simplest'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'structure—a minimum viable structure—that serves its current needs. A little
    structure goes a long way, and you can always develop more later if needed.


    # Primary Forms of Impact Networks


    Learning networks are focused on both connection and learning. Action networks
    are focused on connection, learning, and action. Movement networks connect multiple
    learning or action networks together to coordinate a broader movement. An overview
    of each form is provided below.


    # Learning Networks


    There are countless examples of learning networks around the globe, though many
    use different terms to describe themselves, such as “communities of practice”
    or “knowledge networks,” among others. Learning networks are formed to facilitate
    the exchange of information, spark innovation, increase coordination, and bolster
    members’ ability to adapt knowledge to local challenges.² Sometimes they are also
    formed to provide peer support and to promote the individual development of their
    participants, as is the case with leadership networks and fellowships. Learning
    networks referenced in this book include the Initiative for Multipurpose Prevention
    Technologies, the Justice in Motion Defender Network, and the Fire Adapted Communities
    Learning Network.


    Going beyond the loose relational structure of a typical social network, as seen
    in figure 3.1, learning networks encourage the consistent flow of information
    between participants, as well as with outside groups, as seen in figure 3.2. Some
    learning networks are open, allowing anyone to join, but many are closed, only
    admitting participants who fit certain criteria (the process of determining participation
    criteria is known as bounding a network—see chapter 10 for more details). Participants
    may also form learning circles, gathering together to hold conversations, share
    knowledge, and collect information on a specific topic related to the network’s
    purpose.


    While participants in a typical learning network do not go as far as collaborating
    together directly—that is, working in partnership and making'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'shared decisions—their individual efforts become more closely connected as
    they learn from one another and find opportunities to support each other’s work.
    As a result, promising practices spread, resources are more easily distributed
    to where they are needed most, messaging comes into greater alignment, and the
    actions of those involved begin to reinforce one another. In this way, building
    a robust learning network can itself serve as an effective strategy for creating
    change, even without an emphasis on collaborative action.


    # Action Networks


    Action networks bring together actors from across systems to connect, learn, and
    collaborate together to address complex issues. Examples of action networks referenced
    in this book include the Santa Cruz Mountains Stewardship Network, the Clean Electronics
    Production Network, the UCSF Health Coordination of Care Network, the RE-AMP Network,
    and 100Kin10, among others.'
  merge: -1
  img_proc: true

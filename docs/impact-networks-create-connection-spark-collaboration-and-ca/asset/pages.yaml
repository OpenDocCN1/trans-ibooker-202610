  md: 'Trusting in each other and in the network helps people to be more comfortable
    with emergence—to explore, experiment, reflect, and self-correct in real time.
    People also become more willing to share information and take risks. Trust is
    the glue that keeps a network together as participants develop additional structures
    for organizing themselves.


    **Trust increases the network’s collective intelligence and avoids the pitfalls
    of conformism and groupthink.** Under the right conditions, networks are capable
    of thoughtful discernment and collective intelligence greater than that of any
    single individual. Lack of openness to others’ perspectives is arguably the greatest
    obstacle to a network’s ability to think and act intelligently. Our tendency,
    in the absence of trust, is to believe that our assumptions and projections are
    valid, that we know what others are thinking and feeling without asking them,
    and that maybe we are the only sane person in the room. Trust increases the likelihood
    that participants will listen with care, try on new perspectives, and engage with
    people they might consider to be very different from themselves.


    **Trust expands the range of possible conversations.** People who trust each other
    are more forthright, more likely to share information, and more likely to show
    creativity in how they collaborate.¹ With sufficient trust, people are better
    able to navigate through uncomfortable conversations and test each other’s assumptions
    without fear of harm. As a result, new perspectives are considered, and conflict
    becomes generative rather than destructive. The network’s ability to engage in
    constructive dialogue and make informed decisions grows as people feel free to
    speak their mind and acknowledge difficult realities or controversial points of
    view.



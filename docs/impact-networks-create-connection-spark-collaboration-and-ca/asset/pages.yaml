    # Embrace the Magic of Small Groups


    For people to engage most fully, they need to be in small enough groups that they
    can see and interact with each other simultaneously. Small groups are uniquely
    powerful as sites of practice; they function as fractals, microcosms of the whole.
    As Peter Block writes, “The small group is the unit of transformation and the
    container for the experience of belonging.”¹²


    Small groups give everyone a chance to speak and be heard, while also warming
    them up and making it easier for them to speak in the full group later. As a general
    guideline, think of the full group as a place for framing and summarizing, and
    use small groups to dig into content and discussions.


    # Focus on the Framing Questions


    Like the network itself, a convening design should provide just enough structure
    and no more. Getting the framing questions right is the key to this equation.
    The right questions help groups focus their attention on what matters most. Otherwise,
    conversations might range widely from group to group, creating a lack of cohesion
    across the convening. We spend as much time in our designs crafting thoughtful
    framing questions as anything else.


    The best questions get to the heart of the matter. They invite people to bring
    their own meaning forward, based on their own experiences. They have an edge that
    creates palpable energy when people offer their response. Often the most important
    piece of the design is to get the questions right, put them in the right sequence,
    and then pair each question with a group size and amount of time to do it justice.


    One of our favorite techniques is to rotate people through a series of quick pairs
    or small groups with a set of framing questions. At the beginning of a session,
    questions such as “Why does this work matter to you?” and “What are your hopes
    for our time today?” help to set the context for the work ahead. At the end of
    a session, questions like “What is something important you learned at this convening?”
    and “What is one thing we absolutely must keep in mind moving forward?” provide
    closure'

- pgno: 79
  md: 'Upon seeing the map, the school district first recognized that it needed to
    do everything it could to retain the critical staff member. Second, the school
    district committed to increasing the diversity of connections between staff members
    and Hmong parents—to create what’s known as a *wide bridge*. Creating redundancies
    in networks through wide bridges allows resources and information to continue
    flowing even when certain individuals are unresponsive or unavailable.


    # Hold Dynamic Tensions


    As impact networks evolve, they are bound to face a number of dynamic tensions:
    “dynamic” because they are always in flux, “tensions” to signify a relationship
    between ideas or qualities with seemingly conflicting demands or implications.
    If managed effectively, these tensions, also known as *polarities*, can be a powerful
    source of energy. Having “no tension in a system signifies no aliveness, no learning,
    no evolution,” write Giles Hutchins and Laura Storm in *Regenerative Leadership*.


    Hundreds, or even thousands, of different tensions could arise as networks develop,
    but we have seen six in particular that show up time and time again:


    +   - Building trust and taking action

    +   - Participation and pace

    +   - Self-interest and shared interest

    +   - The parts and the whole

    +   - Planning and emergence

    +   - Divergence and convergence


    When faced with polarities like these, the human brain likes to simplify things
    and see them as separate. The dissonance of holding seemingly opposing ideas at
    the same time is difficult. This is zero-sum thinking: for'

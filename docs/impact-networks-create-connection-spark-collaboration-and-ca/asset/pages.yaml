- pgno: 150
  md: "# CHAPTER 9\n\n# Collaborate for Systems Change\n\n> *Making systems work—whether\
    \ in health care, education, climate change, making a pathway out of poverty—is\
    \ the greatest task of our generation.*\n> \n> — ATUL GAWANDE, “How Do We Heal\
    \ Medicine?,” TED2012\n\nThe systemic challenges we face call for a systemic approach,\
    \ in which we address issues from many angles, simultaneously, as part of a coordinated\
    \ effort. It is simply not enough to scale the work of individual leaders, programs,\
    \ or organizations. Creating change at the rate we need is going to require a\
    \ whole new level of planetary collaboration.\n\n*Systems change* is the process\
    \ of reforming or transforming the structures, relationships, policies, power\
    \ dynamics, narratives, and norms in a given system in order to create positive\
    \ social or environmental results. A system is a group of interacting or interdependent\
    \ elements forming a unified whole.¹ Systems may overlap—for instance, in the\
    \ connections between health care and housing. And systems can be nested within\
    \ other systems—a classroom is nested within a school, which is nested within\
    \ a school district, which is nested within a state’s education system.\n\nIn\
    \ *Who Do We Choose to Be?*, Margaret Wheatley shares that she’s basically given\
    \ up on wholesale global systems change. The scale and complexity of the issues\
    \ we face are overwhelming, and changemakers are burning out in droves. So, she\
    \ reframed her aspiration, and so have we. Wheatley wants to create what she calls\
    \ “islands of sanity that evoke and rely on our best human qualities to create,\
    \ relate, and persevere.”² Instead of islands of sanity, I like to think of them\
    \ as *pockets of possibility*. These"
  merge: -1
  img_proc: true
- pgno: 151
  md: 'are the places all around the world where people are coming together to plant
    seeds for a positive future.


    We may not be able to change the whole system all at once. But we can create positive
    changes locally. And when those local changes are connected together through networks—when
    they are coordinated, learn from one another, and reinforce one another—change
    can happen at larger and larger scales.


    # Making Sense of the System


    In any complex system, there are underlying structures, norms, and beliefs responsible
    for creating the presenting symptoms we see every day—the events and crises that
    flood the news and occupy most of our attention. More often than not, these underlying
    issues are intimately intertwined with structural racism, sexism, and other oppressive
    dynamics. Therefore, it is critical that any effort to create systems change aim
    “to transform the underlying power dynamics, narratives, and histories that built
    these structures and enable them to thrive,” states the social change group Change
    Elemental.³ Otherwise, if they do not, efforts are likely to reinforce existing
    inequities or merely replace one form of inequity with another.


    In the absence of a deliberate process to make sense of the system it seeks to
    change, a network might inadvertently maintain most of its focus on the most obvious
    symptoms and miss important details about what is causing those symptoms in the
    first place. An essential step to creating systemic change, then, is to develop
    a deep, nuanced, and meaningful understanding of the past, present, and potential
    future states of the system, as well as the root causes that are driving the system’s
    behavior.⁴ This involves surfacing diverse perspectives, developing a broader
    understanding of the actors and organizations involved, and examining external
    trends and forces. It also involves considering the local context, learning about
    the histories of the place or system, identifying political and power dynamics,
    and unveiling hardwired assumptions. In the process, lots of questions are asked
    and answered, and patterns are surfaced. Relevant actors, forces, and flows are
    identified. Participants share their piece of the puzzle, and the big picture
    comes into view, illuminating new connections and opportunities to create change.'

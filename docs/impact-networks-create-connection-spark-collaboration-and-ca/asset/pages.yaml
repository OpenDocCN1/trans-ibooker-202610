- pgno: 183
  md: '![](img/4854536a9a7bcce4fd5250605cae8350_183_0.png)


    A critical purpose of collecting and compiling this information is to reflect
    the network’s actions and accomplishments back to participants in an efficient
    way. Doing so provides participants with real-time knowledge of what is happening
    in the network and supports their ability to find ways to plug in if they notice
    that a project is related to their work.


    Given their role, network coordinators in particular should be aware of new developments,
    including projects and partnerships among participants. We advise coordinators
    to record this information and ensure that it is updated regularly. They may collect
    this information informally by talking with participants on a regular schedule,
    leading an interactive activity at a convening, or including questions about these
    activities on a regular survey. Once it is gathered, coordinators can compile
    the information into a dashboard or document that participants can access to stay
    updated on network activities and opportunities to engage.


    # More Extensive Evaluation


    Beyond these four fundamental evaluation components, networks that have the capacity
    and resources for more comprehensive evaluation activities may also consider organizing
    participant interviews or focus groups and conducting a qualitative analysis of
    this data. They may also assess the impacts of one or more collaborative projects
    undertaken by participants or analyze available regional or epidemiological data
    related to the network’s purpose to illustrate changes over time. More extensive
    evaluation practices can require substantial time and expertise and are often
    most effectively undertaken in close partnership with a professional evaluator.


    Developmental evaluation,¹³ an approach applied to environments that benefit from
    quick, strategic learnings to inform innovation, seems'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'particularly well suited for the emergence of impact networks. However, this
    approach is technical, requiring an evaluator with an extensive research skill
    set, and time intensive, requiring an evaluator to become active in the network’s
    leadership to closely track progress and continuously implement measurement methods
    that best fit its needs. While many networks do not have the resources to accommodate
    such an intensive process, understanding the benefits of different types of evaluation
    can help network leaders develop their own evaluation protocols to meet their
    network’s needs.


    # Resourcing Networks


    The resources that support impact networks to launch and grow take many forms.
    Resources are needed to provide meeting space and food for convenings, to compensate
    network leaders, and to support projects emerging from the network. Impact networks
    are typically resourced through one or more of the following sources:


    +   - Philanthropic funding

    +   - Organizational resources

    +   - In-kind contributions

    +   - Participant dues

    +   - Earned revenue from network projects


    Each source is summarized in brief below.


    **Philanthropic funding** has played a critical role in developing impact networks
    around the world. Foundations and philanthropists have resources to support the
    operational costs associated with collaborative efforts. With a systems-level
    view of complex issues, some are also well positioned to identify opportunities
    to catalyze new networks. The unique role of network funders is examined in more
    detail later in this chapter.'

- pgno: 103
  md: 'This recognition led to a convening that the organizers called “the equitable
    deep decarbonization summit.” This summit brought together seemingly the most
    diverse group that RE-AMP had ever had, and “it fundamentally changed some people’s
    awareness of what the network was all about,” reflects Jessica Conrad, who formerly
    served on the network’s staff.25


    At the summit, activists explored how a commitment to center the needs of the
    most impacted communities could transform how the network understood its work.
    “It was a great moment of humility, which is so important in systems change work,”
    says Gail Francis, the network’s strategic director. “Many people realized just
    how much they had to learn.”26 Following these discussions, the network began
    developing a set of principles to provide benchmarks for what equitable decarbonization
    looks like in practice and to establish the intention that an analysis of equitable
    decarbonization would be incorporated into each action advanced by the network.27


    “As we were tearing stuff off the wall and closing up the summit, I remember saying
    to my colleagues, ‘RE-AMP is never going back to how it was,’” says Francis. “It
    was a watershed moment that challenged a lot of our default ways of thinking about
    how we address the climate crisis.” Within a year, the network had formally revised
    its purpose to “equitably eliminate greenhouse gas emissions in the Midwest by
    2050.”


    These conversations would not have been possible without the right people in the
    room. It was only by including a more diverse group of advocates that RE-AMP could
    evolve in a way that would most benefit the whole system. It was also only by
    convening together, with thoughtful design and skilled facilitation, that the
    network could have the conversations it needed to have as a full group. Networks
    are nothing without the right people, and convenings are the moments that create
    collective transformation.'

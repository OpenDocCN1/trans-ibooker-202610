- pgno: 104
  md: '# CHAPTER 6


    # Convene the People


    > The world doesn’t change one person at a time. It changes as networks of relationships
    form among people who discover they share a common cause and vision of what’s
    possible.


    > —MARGARET WHEATLEY AND DEBORAH FRIEZE, “Using Emergence to Take Social Innovations
    to Scale”


    Convening the people means bringing together whoever is needed to advance the
    network’s purpose. People often join a network because they are inspired by its
    purpose, but they stay because of who is involved. Who is part of a network may
    be just as important, if not more important, than why the network exists.


    # Inviting Co-creation


    When you bring people together in an impact network, you’re inviting them into
    co-creation—into the collective discovery of what the network is and what it can
    become. Networks are not owned by anyone; they are shared by everyone. Established
    members and newcomers alike are free to self-organize to advance the network’s
    purpose in alignment with its principles. As new people contribute, new possibilities
    emerge.


    A network’s purpose and principles may be well defined by an initial group before
    new members arrive. This can be quite helpful—it gives people a sense of whether
    the network is something they’d like to contribute to, and it helps ensure that
    the network’s actions stay coherent as'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'it grows. Then, purpose and principles are likely to be refined as new members
    join the conversation.


    Convening people doesn’t mean inviting them into “your thing”; it means inviting
    them into co-creating what is possible, now that they are part of the group. Every
    person who joins an impact network has the opportunity, and the responsibility,
    to contribute to its development.


    # Identifying Who to Convene


    Who to invite into an impact network depends on its purpose, context, timing,
    and scope. When considering who to engage, we include people “for a lot of the
    wrong reasons—obligation, guilt, representation . . . even love,” notes adrienne
    maree brown. Instead, bring together those who


    +   - are directly impacted by the issue,

    +   - are doing compelling work on the issue, and

    +   - can move the work forward.¹


    Make it a priority to convene a diverse set of participants from the very beginning,
    not later after the effort has already been defined. Whoever is invited to join
    a network first is likely to significantly impact the makeup of the resulting
    group, as the social structures that are present at a group’s founding are likely
    to be retained over time.² This may require seeking out people who have different
    backgrounds, disciplines, ways of thinking, and experiences. A design team that
    includes people from many different parts of the system can play a central role
    in crafting a well-considered selection process or invite list for the launch
    of a new network.


    Otherwise, if diversity is not prioritized, relationship-centered systems can
    easily become exclusive communities, as people are naturally drawn to connect
    only with those who look, think, and act like them, writes Vu Le, author of the
    popular Nonprofit AF blog. “Marginalized people and communities don’t have the
    same access to relationships: Relationships are not equitably distributed.”³ Therefore,
    one important step that network leaders—and catalysts in particular—can take to
    avoid replicating patterns'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'of inequity is to center people who are affected by the issue at hand, as well
    as those who typically are excluded from networks—from the very beginning. This
    doesn’t mean “letting them participate,” it means listening and following *their*
    leadership. Because some people have more barriers than others when it comes to
    participating fully (such as time, money, distance, ability, and childcare responsibilities),
    deliberate efforts must also be made to ensure accessibility.


    If your network has already launched, it’s not too late. The approach to inclusion
    that Food Solutions New England (FSNE) took is a good example. FSNE is an action
    network working to create a more equitable and resilient regional food system
    across six states. A short while after the network initially formed, participants
    realized that race was a significant predictor of food-related disparities in
    the region.⁴ They also realized that their predominantly white membership did
    not reflect the diversity of the communities impacted by its work.


    To rectify this issue, the network appointed a group of participants—and provided
    them with stipends—to make meaningful connections with new partners. These “network
    ambassadors,” as they call them, have been instrumental in engaging under-represented
    communities in the network, including communities of color, young people, and
    food chain workers. Meanwhile, the network also created space for more racially
    diverse leadership and improved coordination between community efforts and the
    regional work of the network.


    # Deciding How Many to Convene


    Impact networks range drastically in size according to their purpose, context,
    and type. Some may assume that bigger is always better—that because more people
    mean more connections, it must also mean greater potential for impact. Indeed,
    “the network effect” tells us that networks become more valuable as more people
    are connected to them.⁵ But this phenomenon holds up only to a point. Human and
    biological networks (like the networks of neurons in our brains) in particular
    have been shown to have a “breakpoint,” above which the network effect no longer
    rings true. This is the point at which further growth is no longer beneficial
    and the'

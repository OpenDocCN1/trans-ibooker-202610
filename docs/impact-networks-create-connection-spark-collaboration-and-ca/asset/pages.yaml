    # Put Relationships First


    Many believe that meetings are not worthwhile unless they result in tangible outcomes
    and plans for the future. But progress is about so much more than just defining
    strategies and clarifying next steps. In the world of impact networks, building
    relationships is the work.


    Forward motion happens when people have conversations they don’t normally have,
    with people they don’t normally have them with. It happens when people learn more
    about their differences and find places where they agree. It also happens when
    participants foster a sense of belonging, together.


    Far too many meetings are designed primarily around content. But the most valuable
    resource at any gathering is the people who attend. The rare opportunity of having
    people together at one time is too often wasted with presentations that could
    be recorded and broadcast online instead.


    We recommend moving far away from the “sage on the stage” approach, where so-called

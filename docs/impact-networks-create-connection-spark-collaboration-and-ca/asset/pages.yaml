- pgno: 101
  md: 'Charters serve as the culmination of a network’s initial exploration into why
    it exists and how it will work together. They can be helpful in establishing the
    basis upon which a network will evolve. Charters also provide an orienting device
    that members can reference when considering possible paths forward, when onboarding
    new members into the network, and when introducing the network to new audiences.


    Of course, words on a page are not nearly as important as the conversations that
    led to the charter. Still, witnessing participants’ commitments with one another
    is usually an exciting and inspiring moment. And perhaps even more significant,
    making public commitments, whether by signing a charter or through some other
    practice, goes a long way toward holding people accountable.²³


    As networks are constantly changing and evolving, any charter should be viewed
    as a living document, detailed enough to capture the network’s initial agreements
    and guide its present direction, but also flexible enough to adapt with the network
    as it evolves. Just as the network’s purpose should be revisited from time to
    time, so too should the charter.


    Charters typically include context for why the network was formed, the network’s
    purpose and principles, and a high-level summary of who is involved. Charters
    may also include the network’s priorities or focus areas. Additional operating
    agreements can be captured in a corresponding document, including governance and
    decision-making processes, operational structure, and participation agreements
    (see chapter 10 for more information on establishing participation agreements).
    Visit the Converge Network Toolkit to access a Network Charter Template containing
    section headings, sample content, and prompts for developing a charter.


    # Evolving Purpose and Principles


    Purpose and principles often evolve over time as people share why they have joined,
    what they care about, and what they hope will happen. Clarifying purpose and principles
    is an active, iterative process. As with an orchestra collectively tuning its
    instruments before each performance, it’s good practice to revisit purpose and
    principles every so often to ensure that'

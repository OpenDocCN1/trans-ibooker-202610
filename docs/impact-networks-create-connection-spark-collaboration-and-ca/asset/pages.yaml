  md: 'generate impact through collaboration. This way of thinking and working is
    absolutely crucial for our ability to engage effectively with complexity. The
    potential for impact increases significantly when all types of resources—leadership,
    money, and talent—are leveraged across systems toward a common purpose.


    The network mindset is captured most succinctly by four principles championed
    by Jane Wei-Skillern.³ Leaders who have adopted a network mindset focus on the
    following:


    +   - Scaling impact, not growing their organization or function

    +   - Being part of an interconnected system, not the center of it

    +   - Sharing leadership and credit with peers, not hoarding power or trying to
    be a hero

    +   - Building trust-based relationships, not systems of control


    When you embrace a network mindset, you stop working in isolation. Instead, you
    turn your focus toward cultivating connections, strengthening flows, and sharing
    resources to do more together than is possible alone.


    # The Hierarchical Mindset


    The dominant organizational framework in the world today is a hierarchical, command-and-control
    model where decisions are made by a small group of leaders and passed along to
    those lower in the chain of command. Hierarchies, defined as “a system or organization
    in which people or groups are ranked one above the other according to status or
    authority,”⁴ have an extraordinary capability to efficiently pursue and accomplish
    specific, well-defined ends, such as producing goods and services. They are most
    effective when addressing what Ron Heifetz calls “technical challenges”—those
    in which the problem definition, solution, and implementation are clear.⁵


    Hierarchies are preferred by many for their predictability and stability—workers
    and leaders know what they can expect, and activities can be'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'forecast well in advance. On the other hand, hierarchical structures are limited
    in their ability to address complex and multifaceted issues. Whereas networks
    work from the inside out, with ideas and actions emerging from the conversations
    happening between individuals, hierarchical structures operate from the top down,
    with powerful leaders sending instructions and resources to those lower in the
    hierarchy through layers of management. In the face of complexity, this structure
    turns into a bottleneck.


    While a hierarchy is usually depicted as a pyramid, as seen in figure 2.1, we
    can also visualize it as a rigid hub-and-spoke network, as shown in figure 2.2.
    Imagine the CEO as the central node, with the links representing their relationships
    to their direct reports and their direct reports having links to additional direct
    reports, and so on. With each link, you move farther away from the central hub.


    ![](img/4854536a9a7bcce4fd5250605cae8350_43_0.png)


    **FIGURE 2.1.** A hierarchical structure, as is typically depicted as a pyramid.'

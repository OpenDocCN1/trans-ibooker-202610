  md: 'closed off from hearing new perspectives and are unlikely to collaborate with
    those from outside their bubble. Systems can overcome these issues by intentionally
    forming a network to strengthen the connections between clusters. This involves
    creating opportunities where people can come together to build relationships and
    learn about each other’s work.


    In the case of the IMPT, Holt was the catalyst that brought participants together
    for the first time. When this happened, the network entered Stage 2, Hub and Spoke,
    shown in figure 1.2, with Holt as the central hub (hubs are highly connected nodes
    in a network). This was an improvement from when the field was completely siloed
    into scattered fragments. But staying at this stage too long has its shortcomings.
    The central hub becomes a gatekeeper and often creates a bottleneck, slowing the
    rate at which information flows. When connections are made only through a central
    hub, it limits the kind of spontaneous collaboration that happens when people
    form direct, personal relationships with one another.


    Critically, Holt did not try to hoard these relationships for herself; instead,
    she saw her role as facilitating connections and communication across the system.⁵
    As relationships formed, the IMPT evolved into a Stage 3, Multi-Hub network, shown
    in figure 1.3. Key actors from the MPT field were no longer dependent on any single
    individual to stay connected. In our experience, impact networks that do not evolve
    beyond the hub-and-spoke stage are significantly limited in what they can accomplish.
    Reaching the multi-hub stage is a necessary step toward unlocking the special
    qualities that make networks a powerful force for change.


    Over time, the IMPT grew into a Stage 4, Core/Periphery network as shown in figure
    1.4. At this stage, there is a highly interconnected group of participants in

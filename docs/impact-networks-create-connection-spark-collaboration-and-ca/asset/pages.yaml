  md: 'easy to get caught up in daily responsibilities and forget to take the time
    to build relationships, even if it’s obvious conceptually that relationships are
    central to the work. Convenings encourage people to get away from their email
    inboxes and to focus instead on connecting with others, not just as organizational
    representatives but as human beings.


    **Convenings advance learning and action.** They provide an opportunity for participants
    to share what they’ve learned from their recent work and to plan for the work
    ahead. The gaps between convenings (usually ranging from four to six months, or
    a year at most) may provide a good length of time to implement a project or test
    an idea in the real world. Learnings can then be shared—and plans revised—at the
    next convening. This cycle of planning and iteration allows networks to integrate
    both deliberate and emergent strategies for action.


    **Convenings create energy.** They maintain momentum over the course of a network’s
    formation. Picture the network as a basketball spinning on a finger. The longer
    it spins without an infusion of energy, the more it starts to lose its center
    of gravity and risk falling over. We regularly see a spike in communication between
    participants just after convenings are held. This level of activity slowly dissipates
    as we get further and further away from the last time people were in a room together
    (virtual or in person). Convenings keep the ball spinning.


    The cadence and format of convenings differ based on the type of network. We have
    found that learning networks convene one to two times per year on average, while
    action networks convene one to four times per year on average. Some networks may
    only ever convene remotely—because of distance, cost, and accessibility—while
    others mostly convene in person. Regardless of the specific cadence or format,
    effective network convenings tend to be fairly similar in their overall approach.
    Below is a set of key lessons we have learned from our collective experiences
    leading network convenings online and in person.



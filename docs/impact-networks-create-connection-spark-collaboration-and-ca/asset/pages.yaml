  md: 'especially important to consider other cultural frames in the meeting design
    phase as well as in real time during a convening. Otherwise, you run the risk
    of unconsciously reinforcing dominant group norms that can alienate or even cause
    harm to some members of the network.


    When facilitators are too passive, they fail to fulfill some of the critical responsibilities
    of the role. “Far from purging a gathering of power,” passivity creates a power
    vacuum that others can fill “in a manner inconsistent with your gathering’s purpose,”
    writes Priya Parker.¹⁹ Instead, we recommend practicing what Parker calls “generous
    authority”: lead the meeting confidently but also with humility, owning the power
    you’ve been entrusted with while using that power in service to others and to
    the network as a whole. Rather than using power over others to shut people down
    or control the conversation, emphasize power with, among, and within, to increase
    shared leadership across the group and guide the meeting toward life-affirming
    outcomes.


    # Attending to Power Dynamics


    Far too often, power is exercised in unhealthy ways. When structures concentrate
    power in the hands of a few, as in a hierarchy, individuals are prone to seek
    power over others as a means of regaining agency and avoiding being told what
    to do. This zero-sum construct pits people against each other, which traps energy
    in power struggles and rules out the potential for synergy.


    Impact networks shift this understanding of power to foster equity and inspire
    collaboration. In healthy networks, power is not used over or against others to
    force a decision or to gain superior status. Instead, power is used with and among,
    in support of others and in the pursuit of a common purpose. Power is also accessed
    within, such that participants feel able to speak, act, and show up as their whole
    selves.


    In an impact network, no one has formal power to dictate the actions of others,
    and no one has to be empowered to demonstrate leadership. But this doesn’t mean
    that equity is anywhere close to being assured. Power dynamics are inherent within
    any group. For example, some organizations will be better funded than others,
    some people will have more connections'

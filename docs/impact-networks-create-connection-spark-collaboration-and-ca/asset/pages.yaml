- pgno: 232
  md: '# About the Author


    ![](img/4854536a9a7bcce4fd5250605cae8350_232_0.png)


    **David Ehrlichman** is cofounder and coordinator of Converge ([converge.net](http://converge.net)).
    With his colleagues, he has supported the development of dozens of impact networks
    taking action on issues as diverse as economic mobility, human rights, access
    to science, and health care reform.


    Prior to catalyzing Converge, David was a consultant with Monitor Institute, where
    he was first introduced to the power of networks. He lives near Seattle, Washington,
    on the traditional land of the Coast Salish peoples, specifically the Stillaguamish
    and Suquamish.


    When he’s not writing or working with networks, you can usually find him spending
    time with family and friends, out in nature, or playing music. He lives with his
    wife, Nabetse; two goofy dogs; and his newborn daughter —three months old at the
    time of this book’s publication.


    You can reach David at **ehrlichman@converge.net**.'

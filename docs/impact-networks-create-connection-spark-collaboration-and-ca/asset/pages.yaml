- pgno: 174
  md: 'collectively will save time, build morale, and, best of all, result in excellent
    choices.


    In hierarchical systems, decisions are typically made by those at the top and
    instructions for implementation are passed down. Not only does this structure
    minimize input, but it normalizes power imbalances that eliminate the potential
    for people to make decisions about things that directly affect their lives. Simply
    stated, “Power is participation in decision-making,” writes Cyndi Suarez in *The
    Power Manual.*¹⁰


    In impact networks, decision-making—like leadership—is distributed. This does
    not mean that everyone will agree with every decision—in many cases, that simply
    isn’t realistic. It does mean, however, that all participants are invited to shape
    proposals and share perspectives, while demonstrating a genuine consideration
    of each other’s circumstances, benefits, and burdens. As long as decision-making
    is inclusive, transparent, and intended to serve the well-being of the whole,
    people are usually able to live with a decision, even if they disagree—and they
    are grateful for a process that results in forward motion.


    In situations where the network needs to make a collective decision, such as defining
    its participation agreements, achieving full consensus demonstrates coherence
    within the system. Yet consensus decision-making has major limitations—it can
    be slow, it can drain the network’s energy when action is stalled, and it can
    restrict experimentation.


    We prefer an alternative approach: consent-based decision-making, which allows
    actions in the best interest of the whole to proceed without unanimous agreement.
    This approach is rooted in the “range of tolerance” principle borrowed from ecosystem
    science: when organisms find themselves in contexts that are too hot or too cold,
    some parts of the system die because the temperature is out of their range of
    tolerance. With consent-based decision-making, we find a decision that everyone
    can live with, even if it’s not their top preference. As questions or objections
    arise, participants take the time to hear each other’s honest concerns, and they
    work together to refine the final proposal so that it lands within everyone’s
    range of tolerance.


    # A Process for Consent-Based Decision-Making'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'The consent-based decision-making process has three phases: context, clarification,
    and call for consent:


    **Context** frames the decision to be made: What are the relevant factors? What
    are the pros and cons that have been considered? What conversations have already
    taken place? And finally, what is the recommendation moving forward? Context is
    presented by those who took part in discussions to formulate the proposal.


    **Clarification** allows for any further questions or clarity needed by network
    members prior to voting. Facilitators should help ensure that the conversation
    doesn’t veer toward evaluation of ideas but stays with clarity on what is being
    recommended. Participants are encouraged to consider whether proposals are consistent
    with the network’s purpose and principles, and to think in terms of what’s in
    the best interest of the network as a whole, as opposed to what’s in the best
    interest for “me” as an individual or as a representative of an organization or
    special interest.


    **Call for consent** uses a 0 to 5 voting framework when the full group is ready
    to make a decision or assess the level of support and need for further discussion.
    First, the facilitator restates the proposal and asks participants to vote. Then,
    the participants respond with a number from 0 to 5 (using fingers, pen and paper,
    or other means) corresponding to their level of support. The process can also
    be completed digitally with polling tools if confidentiality is required, if voting
    with fingers or paper isn’t practical, or if detailed records need to be captured.


    When voting, participants are invited to choose from one of the following options:


    +   - **5—Lead:** The proposal serves our network well, and I would like to be
    one of the leaders in implementing it.

    +   - **4—Partner:** The proposal serves our network well, and I will partner
    to support the leaders in implementing it.

    +   - **3—Follow:** The proposal may serve our network, but I can’t offer any
    capacity toward implementation.

    +   - **2—Concern:** I have concerns about the proposal and will be tracking as
    implementation moves forward.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '+   - **1—Caution:** I have major concerns about the proposal creating harm
    and would like to discuss further.

    +   - **0—Oppose:** The proposed course of action is outside a range of tolerance
    and requires changes before any action is taken.


    The proposal goes forward as outlined if there are only 2s and above. If there
    are 0s or 1s, options include having real-time discussions to resolve objections
    or scheduling time for the 0s and 1s to meet with the 4s and 5s to resolve issues
    and find a way to move forward.


    When we use consent-based decision-making, proposals are encouraged to proceed
    as long as they are consistent with the network’s purpose and principles and are
    unlikely to cause harm. Consequently, the process gives autonomy to those who
    volunteered to lead the implementation of an idea they’re excited about. This
    creates a bias toward action, with a responsibility to consider the impact of
    the whole. Consent thus encourages people across the network to step into leadership
    roles and pursue their varied, creative interests. This kind of diversity of action
    fosters a culture of experimentation and empowerment, and it makes the network
    a much more fun and innovative place to be.


    # Embedding Evaluation


    Evaluation is central to good network leadership. Any impact network will benefit
    from embedding evaluation practices, as the data collected will generate valuable
    learnings and help guide its evolution. Therefore, evaluation should be incorporated
    from the very start, not later after the network has begun to advance specific
    projects.¹¹


    A good evaluation protocol provides regular assessments of the network’s health
    and functioning, including opportunities for participant feedback. This data helps
    network leaders highlight areas of strength and opportunities for improvement,
    guide collective decision-making, and inform the design of network activities
    and convenings. In addition, the data is likely to help make the case that the
    network is progressing, even before tangible project outcomes have been realized.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'Given the emergent nature of networks, longer-term impacts often cannot be
    well defined at the beginning. In fact, determining long-term outcomes before
    participants have had a chance to think and work together is likely to stifle
    their ability to self-organize around what they think is most important. Therefore,
    efforts to assess long-term impacts require a thoughtful evaluation approach that
    allows for this flexibility over time; approaches that rely largely on predetermined
    and static metrics are generally not a good fit.


    At the same time, healthy impact networks share a set of short-term and intermediate-term
    outcomes that are definable, including markers of network connectivity and demonstrated
    value for participants. These are important to document, in terms of actionable
    data to inform network development, as well as to demonstrate forward motion to
    funders and participants alike. Because the aspects of network health are relatively
    universal, they can be identified in advance and assessed with fairly standardized
    (yet customizable) tools. This is why we are able to offer the following structured
    evaluation approach, which will be useful for almost any impact network.


    # Four Fundamentals of Network Evaluation


    We propose four basic components of network evaluation, explained in more detail
    below, to help ensure that your network is continually learning and evolving in
    a positive direction:


    +   - Collaborative infrastructure

    +   - Network connectivity

    +   - Participant experience

    +   - Emergent activity


    # Collaborative Infrastructure


    Assessing collaborative infrastructure involves tracking fundamental information
    about network participation and activities. To assess'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'participation, network leaders can track network size (how many members there
    are at each tier of participation), representativeness (which groups or interests
    that current members represent), and growth/turnover (how many people and organizations
    joined the network and how many left the network in the past year).


    To assess network activities, network leaders can track convenings, including
    frequency and attendance, as well as other significant functions as applicable,
    such as participation on calls and subscriptions to the network newsletter. It
    is also helpful to cross-reference this information against specific participant
    characteristics (for example, sector, region, and demographic characteristics)
    to ascertain whether engagement varies across participants and where adjustments
    might be beneficial to engage all members.


    # Network Connectivity


    Network connectivity reflects how well relationships are forming across a network.
    As the effectiveness of any network depends fundamentally on the strength of the
    connections between the participants, network connectivity is often the primary
    means of assessing progress in the early days of its formation.


    Social network analysis (SNA), also known as network mapping, is the most effective
    method currently available for visualizing and evaluating that connectivity. SNA
    offers an empirical way to represent the patterns of connection and disconnection
    among participants at a given moment in time. This provides important clues about
    where clusters are forming, how information is flowing, and how best to weave
    relationships.¹²


    SNA can be used to capture the degree to which participants have formed relationships
    with one another as well as whether or not they are communicating (sharing information,
    ideas, or data), coordinating (their efforts are closely connected, but they maintain
    separate resources and responsibilities), or collaborating (working in partnership,
    sharing resources, and making shared decisions). We aim to gather this information
    before the first network convening to get baseline data, and then again after
    major convenings or at regular intervals (for instance, every six months) thereafter
    to assess change over time.'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'SNA can support a network’s development in several ways, such as the following:


    +   - Assessing the network’s growth, as shown in figure 10.1

    +   - Identifying key influencers and those who are least engaged

    +   - Highlighting opportunities for intervention and weaving

    +   - Revealing patterns of connection and disconnection


    To help you map and analyze your network’s connectivity as it evolves, we have
    developed examples of how we have applied SNA in practice, along with a survey
    template you can adapt to capture the data needed to construct a network map.
    Visit the Converge Network Toolkit to learn the process of Conducting a Social
    Network Analysis.


    # Participant Experience


    Evaluating network health involves assessing the degree to which the network is
    cohering around shared goals and developing a positive culture of collaboration.
    The key factors highlighted below are especially critical to the long-term success
    of impact networks and their ability to keep participants engaged.


    A healthy network is one where participants feel they have clarified a shared
    purpose and a set of shared principles. The network includes a broad cross section
    of participants who are well suited to address the network’s purpose and actively
    contribute to its development. Those participants are developing relationships
    of trust, and they feel they are able to engage in and resolve conflicts with
    one another.


    The network has defined whatever structures and agreements are necessary to organize
    the work and make good decisions. These structures and agreements should be flexible
    enough to allow the network to stay responsive to changes in the environment without
    feeling unnecessarily burdensome.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Healthy networks have ample *coordination* such that necessary operational
    responsibilities are well accounted for. Relevant *information* is easily accessible
    and freely shared. Participants also feel that the network has adequate *resources*
    to sustain its activities and that funders are supporting the network without
    controlling its path.


    And last but not least, participants in healthy networks feel that they are receiving
    good *value* from the time they are investing. They feel that they are benefiting
    personally and professionally as individuals and that their organizations are
    benefiting from their involvement in the network as well.


    Administering participant surveys at regular intervals provides a good assessment
    of the core indicators of network health. They offer a regular space for participants
    to provide feedback, supporting equity and ensuring that network leaders have
    a good understanding of participants’ perceptions of the network. The survey results
    help illuminate areas of strength as well as areas that would benefit from additional
    attention or support. Participant surveys can also help capture details related
    to a range of outcomes providing value for participants, such as growth in skills,
    knowledge, meaningful relationships, and professional effectiveness, as well as
    value for their respective organizations, such as amplified reach or impact. These
    outcomes enable members to justify their participation to their organizations,
    and they support the network as a whole to justify its work to funders. Visit
    the Converge Network Toolkit to access a comprehensive list of Indicators of Network
    Health to track, along with a generic Network Participant Survey.


    # Emergent Activity


    While some network outcomes are predictable (including increased connectivity
    and value from participation), many are not. The magic of networks lies in their
    emergent outcomes, which cannot be defined in advance, will not be the same across
    networks, and therefore cannot be measured with standardized tools. Although the
    precise nature of these outcomes cannot be predicted in advance, it is still valuable
    to track them as they emerge. Specifically, tracking the coordinated work and
    collaborative projects that are sparked among participants is essential to understanding'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'how the network is impacting the broader system. This information will help
    network leaders and participants advance promising opportunities and potential
    innovations, as well as tell the story of the network’s influence on the broader
    system. It will also highlight any particularly exciting projects that could be
    the subject of a more detailed case study.


    FIGURE 10.1. (facing page) Sterling Network NYC—a network of cross-sector leaders
    working to advance economic mobility across New York City —has conducted SNA at
    regular intervals to assess change in the network over time and to identify opportunities
    to provide support. Two analyses of the Sterling Network show a significant increase
    in collaborative activity among participants over its first sixteen months. The
    initial analysis was conducted just prior to the network’s first convening in
    January 2018, providing a baseline assessment (above), and the second analysis
    was conducted in April 2019 (below). Each node represents an individual participant,
    and a link between two people indicates that they are collaborating with one another,
    based on self-reported survey data (when links are not mutual, it is most often
    due to missing survey responses, as well as differences in how participants interpret
    the survey).'

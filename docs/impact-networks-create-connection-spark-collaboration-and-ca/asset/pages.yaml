    # Frame the Context


    Imagine the very beginning of a network convening. Everyone is gathered together,
    some for the first time. There you stand, ready to begin the session. What are
    the first words you will say? Think carefully, as they are vitally important.
    While it may be tempting to jump into the work of the day and blow by the opening,
    we advise you not to miss this powerful moment. The opening to a convening is
    not a mere formality. “When we optimally prepare people for the form, function,
    and purpose of our gathering, they will be present in a way that greatly improves
    the chances of our purpose being actualized,” write Craig Neal and Patricia Neal
    in *The Art of Convening*.$^{14}$


    Though the opening is a particularly significant moment, it’s also necessary to
    frame the context throughout the convening, including whenever you launch groups
    into a new activity or discussion, as well as at the end of each day. Think of
    framing as the essential practice of clarifying the state of the moment and preparing
    the network for the work ahead. The best frames integrate what you heard from
    participants and contextualize the purpose of the convening or a particular session
    in a way that will increase engagement in the activities that follow.


    # Hold Space


    There will inevitably be moments in network convenings when the temperature in
    the room starts to rise. These are times when the conversation gets tense, people
    feel on edge, and nobody wants to openly acknowledge it. At this moment, many
    people will be tempted to retreat into what Robert Solomon and Fernando Flores
    call “cordial hypocrisy”—nice, polite conversations where real issues are swept
    under the rug.$^{15}$


    The facilitator’s role here is to acknowledge what’s happening, invite people
    to take a breath, and then hold space so that the real issues can be worked through.
    Acknowledging what is happening can take the sting out'

  md: 'of it, reducing the anxiety that the discomfort brings. Reminding people to
    stay present in the conversation may help them avoid falling into a stress response
    of “fight, flight, or freeze.” These are the moments of truth in networks, the
    times when groups can either fall back into what’s comfortable or sit in the tension
    long enough to acknowledge unspoken realities and address critical issues.


    # Invite Divergence


    Network facilitators invite divergent perspectives, rather than avoid them. This
    is what enables participants to think creatively together, even when they disagree.
    When addressing an important issue, people may make statements so emotionally
    charged that they risk being isolated or labeled by others. At that moment, facilitators
    may feel the urge to move past the dissenting input and get back to the task at
    hand. What happens next can change the course of the network’s culture.


    As a facilitator, instead of avoiding the disruption, turn to that person with
    your full attention and ask them to elaborate. Then, check to see if others feel
    similarly. If nobody does, you still need to validate that person’s perspective.
    It doesn’t matter if you agree or disagree with their opinion; what matters is
    making the room a safe place for different perspectives to be shared and honored.
    We learned this practice from Marvin Weisbord and Sandra Janoff, creators of the
    Future Search process, and it’s served us more than a few times. By validating
    that person’s perspective, you make them feel heard, which allows the person to
    relax and rejoin the flow of the conversation.


    Then, consider inviting people to share their own perspectives. This opens the
    space for people to offer contrasting opinions in a way that is respectful. These
    moments can dramatically shift the way in which participants interact with one
    another by creating a sense of psychological safety and appreciation for diverse
    points of view.


    If you become stuck when something is going on in the room and you’re not sure
    what to do, put your faith in small groups or pairs. Quickly break the participants
    into groups of two to four, and ask them to discuss what’s happening in the room

- pgno: 25
  md: "# CHAPTER 1\n\n# The Web of Change\n\n> > *We are caught in an inescapable\
    \ network of mutuality,*  \n> > *tied in a single garment of destiny.*  \n> >\
    \ *Whatever affects one directly, affects all indirectly.*\n> >\n> > —MARTIN LUTHER\

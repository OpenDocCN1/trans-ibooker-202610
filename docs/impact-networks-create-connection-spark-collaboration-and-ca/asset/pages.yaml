    # Appreciation


    To appreciate one another is to accept people as they are and to value different
    ways of being, knowing, and doing. People often come to networks with very different
    backgrounds, identities, experiences, and beliefs. A prerequisite to building
    trust between diverse groups is that diversity is recognized as a critical part
    of what makes networks thrive; after all, so much of the potential of network
    building comes from bridging connections across divides.


    In practice, a culture of appreciation is one where many different styles and
    skills are valued and integrated. Deep trust is possible only when people are
    able to bring their whole selves to the network and contribute their gifts in
    whatever way they choose. To create a space where all participants are able to
    contribute fully, it is necessary to ensure that the dominant culture’s norms
    are not centered to the exclusion of others—in the United States, this means decentering
    whiteness such that other ways of being, knowing, and doing can flourish.


    At an individual level, sharing appreciations also helps to get people out of
    their heads and into a heart-centered space, creating room for deeper connections
    to form. This is why we often have people offer appreciations at the end of a
    convening, asking them to reflect on “who or what are you appreciating right now?”
    Sharing appreciations in this way serves to reinforce the prosocial behaviors
    that the network wants to promote.


    # Sharing Stories


    The most dependable way to build trust and set the stage for courageous conversations
    is to take the time to understand each other’s *internal context*. We typically
    only get to see each other’s *external context*: what people look like, what they
    say or do, their title and organization, and their online persona. But in order
    to form a deeper connection with other people, it is necessary to take the time
    to get to know their internal context: the *why* behind their actions, their underlying
    values and motivations, and the'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'experiences that make them who they are. Without taking the time to understand
    a person’s internal context, it is far too easy to make biased assumptions about
    their intentions.¹⁶


    One of the most intimate things that participants can do to reveal their internal
    context is to share personal stories. Stories deepen the listener’s understanding
    and appreciation of who the storyteller is—as a person, as a soul—rather than
    seeing the person only in the context of their work. We know almost nothing about
    another person without taking the time to hear their story. We judge people we
    only just met. We make assumptions. “We think we can easily see into the hearts
    of others based on the flimsiest of clues,” writes Malcolm Gladwell in *Talking
    to Strangers*. But in truth we’re quite bad at judging other people’s character.¹⁷
    Stories have a way of opening people up and connecting them together.


    One storytelling tool we have found to be particularly effective is called True
    Stories, adapted from a practice used by Dorothy Stoneman, the founder of YouthBuild.
    We’ve led this exercise hundreds of times in a wide variety of contexts, from
    Montgomery, Alabama, to Nairobi, Kenya, to Shanghai, China. Every single time,
    it dramatically shifts the dynamics in the room.


    In this exercise, participants are evenly distributed into groups of three to
    five people. They are then asked to sit facing each other and invited to recount
    a life experience that made them who they are. The particular framing question
    can be adapted to fit the context. For example, people might be asked to share
    the story of a particular period of their life, the story of a mentor who had
    a big influence on them, or the story of how they came to do the work they’re
    doing today. Each person has a specific amount of time to tell their story, during
    which they will be the only one speaking (we usually provide four to seven minutes
    per story, depending on how much time we have for the exercise). We challenge
    participants to go as deep as they can without feeling like they’re oversharing.
    Then, for the next two minutes, listeners offer their reflections on that story—what
    resonated with them, what surprised them, and what stood out. Once the first person
    has finished telling their story and received feedback from their group, the next
    person tells their story, and the process continues. In total, the exercise'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'takes about 45 minutes. You can access the full instructions for [True Stories](#)
    in the Converge Network Toolkit.


    One important consideration in choosing a storytelling activity, as noted above,
    is to remember that some participants have experienced significant trauma and
    oppression in their lives. As changemakers and facilitators, we must balance the
    desire to promote openness among participants with the potential for triggering
    trauma. In the containers we create, participants always have the option to pass
    and to choose how deep they go in sharing a personal story.


    # Listening with Care


    Sharing stories is as much about listening as it is about storytelling. Trust
    develops when participants deeply hear and empathize with each other, holding
    each other’s story with respect.


    Merely listening attentively is insufficient, because it means you are staying
    in your own frame of reference, hearing the other person’s words as colored by
    your own filters and inferences. Instead, *empathetic listening* is what’s needed
    to hold your own biases at bay (as much as possible) and to more fully understand
    the world as another person sees it.[^18] When you listen empathetically, the
    mirror neurons in your brain light up such that you physiologically experience
    the things the storyteller is describing.[^19]


    Meanwhile, listening with great care also has the power to create safety and change
    the conversation itself. Good listening affects not only the listener but also
    what the speaker shares. When people feel heard and held, they are more likely
    to feel comfortable in showing vulnerability, which can open the door for a deeper
    connection. The experience of understanding more about another person’s inner
    context through empathetic listening, and simultaneously the experience of being
    fully heard, bonds people together like almost nothing else.


    # Holding Courageous Conversations


    Trust creates a foundation of mutual respect upon which participants can hold
    whatever conversations they need to have to begin working together.'

- pgno: 69
  md: '# CHAPTER 4


    # Network Leadership


    > The true network leader is able to say and demonstrate,

    > “It’s not about me.” And then, it isn’t about them. It’s about something much
    bigger that encompasses all.


    —DAVID HASKELL, INTERVIEW WITH THE AUTHOR


    Network leadership is rooted in trusting relationships, collaboration, and shared
    power; it is adaptive, facilitative, and grounded in the wisdom of living systems.
    Network leadership is also distributed—anyone can demonstrate network leadership,
    from wherever they are, in many different ways. This more inclusive understanding
    of leadership inspires self-organization and provides a source of creative potential
    that makes networks such a powerful vehicle for innovation and change.


    That said, there are always certain individuals who willingly take on a greater
    level of responsibility to tend the network, on behalf of its purpose and for
    those who have chosen to participate. These individuals seed a vision for change
    and inspire new networks to form. They help the network to clarify its purpose
    and principles and to cultivate relationships of trust. They manage the network’s
    operations and maintain its online communication systems. Most important, they
    demonstrate an extraordinary degree of care for the network, nurturing its growth
    and constantly anticipating its needs and challenges. The people who cultivate
    the conditions for networks to thrive are called network leaders.


    Network leaders connect diverse stakeholders and foster learning and action to
    advance a shared purpose. They are there not to tell people what to'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'do but to support them to discover what they can accomplish together. Rather
    than defining rigid structures and rules, network leaders nurture a culture of
    reciprocity. Instead of command and control, network leaders seek to connect and
    collaborate. In contrast to the heroic style of individual leadership often featured
    on magazine covers, network leaders demonstrate great humility, sharing credit
    and acting in service of the whole. In short, they are stewards of the network
    and its purpose. Network leadership is the fine art of taking responsibility for
    an endeavor while sharing that responsibility completely with others.


    # Network Leadership Roles


    Network leadership takes many forms. In particular, we see four primary leadership
    roles that appear at different moments in a network’s life cycle: catalyzing,
    facilitation, weaving, and coordination:


    +   - **Catalyzing** is the art of crafting a vision and inspiring action. Catalysts
    are particularly instrumental in forming new networks: they bring people together
    for the first time to explore the potential and get the effort off the ground.
    Once a network is launched, catalyzing continues to be needed to organize new
    project teams, raise resources, and foster new opportunities to expand the network’s
    impact.

    +   - **Facilitation** is about guiding participants through group processes to
    find common ground and collaborate with one another. Facilitators design and lead
    convenings, hold space for different points of view, and help conversations flow.

    +   - **Weaving** involves fostering new connections and deepening relationships.
    Weavers engage with participants to gather input, introduce participants to each
    other to inspire self-organization, and build bridges with new communities to
    help the network grow.

    +   - **Coordination** is the work of organizing the network’s internal systems
    and structures to enable participants to share information and advance'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'collective work. Coordinators establish and maintain network operations, support
    knowledge management, and assist network teams.


    In some instances, a single person is responsible for tending to each of these
    four roles. In most cases, however, different people are likely to step into each
    of these roles at different moments in the network’s evolution, any and all participants
    can demonstrate network leadership by leaning into any of these roles. It takes
    a village to manage complexity, so it helps if leadership is distributed.


    Each of these four roles is explained in more detail in the chapters ahead: catalyzing
    is described in **chapter 5**, “Clarify Purpose and Principles”; facilitation
    appears in **chapter 6**, “Convene the People”; weaving takes center stage in
    **chapter 7**, “Cultivate Trust”; and coordination is integral to **chapter 8**,
    “Coordinate Actions.”


    # ## Principles of Network Leadership


    Just as every complex issue is unique—involving different people, organizations,
    and dynamics—so is every network. While it would be impossible to develop a precise
    instruction manual for cultivating impact networks, it is possible for network
    leaders to tap into powerful principles that are at work in all living systems—including
    human systems. Following are four principles of network leadership we have experienced
    and observed across impact networks at every scale:


    +   - Foster self-organization

    +   - Promote emergence

    +   - Embrace change

    +   - Hold dynamic tensions


    Each principle is described in more detail below.


    # ## Foster Self-Organization'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'In 2012, Hurricane Sandy left hundreds dead and thousands in the United States
    without food, housing, or power. In the days immediately following this devastating
    disaster, a network of tens of thousands of volunteers calling themselves “Occupy
    Sandy” quickly stepped in to distribute food and supplies to communities in need.
    What resulted was one of the fastest and most effective responses seen anywhere
    in the wake of a hurricane. Perhaps the most incredible part of this story is
    that Occupy Sandy didn’t even exist in the days prior.


    Occupy Sandy was catalyzed by six volunteers who had met in the Occupy Wall Street
    movement. When the storm hit, they began delivering food to parts of New York
    that were being overlooked by other aid organizations, including the American
    Red Cross. As they got to work, they called upon members of the Occupy Wall Street
    network for support. An estimated sixty thousand responded.¹


    Participants quickly self-organized to identify the urgent needs of specific communities
    and organizations and to help get resources to the right places. Those who could
    not be there in person helped out by purchasing essential items through wedding
    registries set up by Occupy Sandy volunteers, contributing over $700,000 in donated
    goods.²

    Information flowed quickly through the network’s online channels, and resources
    of all kinds—human, financial, material—were coordinated at speeds that would
    not have been possible under the oversight of a centrally controlled system. The
    effort was so successful that the American Red Cross began delivering supplies
    directly to Occupy Sandy for distribution.³


    The success of Occupy Sandy demonstrates the immense potential of a self-organizing
    network. Self-organization is what allows networks to evolve into new forms and
    adapt to changing conditions. It also amplifies the gifts and creative potential
    of each person involved, which, in turn, increases their intrinsic motivation
    for the work. Self-organization is what gives networks a sense of aliveness. The
    capacity of self-organizing systems to combine the wisdom of large, diverse groups
    has led June Holley to assert that self-organization is “without a doubt, the
    aspect of networks that is most likely to bring transformation.”⁴


    In a self-organizing system, leadership is distributed—it can come from anywhere,
    from anyone, at any time, manifesting in ways that may stretch'

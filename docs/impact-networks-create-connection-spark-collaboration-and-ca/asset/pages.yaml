- pgno: 77
  md: 'mortgage crisis when the failures of just a few major banks and financial institutions
    threatened the collapse of the entire financial system.


    Networks that have not moved past a hub-and-spoke structure, as defined in chapter
    1, are also at risk of collapse if the central hub were to disappear. To avoid
    this risk and increase resilience, seek to move past the hub-and-spoke stage as
    quickly as possible. Focus on fostering strong relationships and decentralizing
    connections so that the network is not dependent on any one person (including
    yourself).


    # Create Redundancies


    Redundancy is usually cast as negative, seen as a superfluous or unnecessary waste
    of resources that should be designed out. “Yet in living systems,” writes Wahl
    in Designing Regenerative Cultures, “redundancies at and across multiple scales
    are vital, as they decentralize important functions by distributing them across
    the system as a whole and thereby make the overall system more resilient.”16


    Forests remain resilient to disturbances by maintaining a dynamic diversity of
    development stages within their ecosystem: some parts of the forest are in mature
    stages, while others are in earlier phases of growth. Even machines are built
    with redundant components as fail-safes for crucial tasks. Most airplanes have
    three different flight computers that function independently, each manufactured
    by a different company and containing a different processor. If any one component
    fails, the redundant components immediately take over to keep the plane in the
    air and on course.


    When I was contracted to map the connections between staff members of a large
    school district and its network of parent volunteers, using social network analysis,
    the importance of redundancies became abundantly clear. One of the most important
    insights that the network map shown in figure 4.1 revealed was the degree to which
    the school district’s connections with an important minority community, Hmong
    Americans, were due to a single staff member. While this staff member created
    an essential bridge with the community, it was a particularly narrow bridge given
    its dependence on a single node. If this person were to leave the school district
    or become unavailable, the district would be at risk of losing many critical relationships.'

    # **FIGURE 1.4.** Stage 4—Core/Periphery


    Clusters are an extremely common phenomenon in networks, forming quite naturally
    as people gravitate toward those with whom they share similarities. People in
    distinct clusters tend to be more like-minded, have shared language, have similar
    conversations, and be located in the same region. Network limitations arise when
    clusters remain separated without a bridge to connect them. Bridges are essential
    links between two parts of a system that would otherwise be disconnected (the
    people responsible for creating bridges have been called *bridgers, boundary spanners,*
    and *brokers*).


    Without a bridge to connect clusters together, information fails to flow between
    them, creating echo chambers—spaces where people merely reinforce each other’s
    beliefs. Locked in their echo chamber, people remain'

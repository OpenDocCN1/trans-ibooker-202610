- pgno: 80
  md: 'every winner there must be a loser; for every right there must be a wrong;
    there is only this or that with no gray area in between.


    A more nuanced perspective is to embrace the duality of life by choosing *both-and*
    thinking instead of *either-or* thinking. Every aspect of life consists of interactions
    between seemingly opposing yet complementary forces. This inherent duality of
    life, called *yin and yang* in ancient Chinese philosophy, can be found in the
    reality that there can be no light without darkness, no up without down, no life
    without death, and that we must breathe in and out to survive.


    With each dynamic tension, two perspectives that seem to contradict each other
    are both true and valuable. For instance, both trust *and* action are important,
    and we care about individuals’ needs *and* shared interests. An essential role
    of network leaders, then, is to sense and acknowledge polarities as they arise,
    to hold the tension between seemingly opposite paths, and to embrace both-and
    thinking when making decisions about what to do next. Dynamic tensions aren’t
    problems to be solved; they are polarities to be aware of, integrated, and held
    with care throughout the life cycle of a network. Six dynamic tensions that are
    common in impact networks are discussed in more detail below.


    # Building Trust and Taking Action


    As previously discussed in chapter 1, trust is the single most important ingredient
    of successful collaboration. Even still, many people think of trust as merely
    the soft stuff, something that is nice but not necessary. They come to the network
    with an urgency to identify and execute on a project immediately, to get to work.


    What they fail to recognize is that building trust *is* the work. Nearly every
    instance of collaboration will result in some disagreement about the right thing
    to do or some miscommunication that can damage the relationship. If a basic level
    of trust hasn’t yet been established, those moments can derail the entire effort.


    When enough trust is established before actions are taken, participants are more
    likely to assume positive intent and continue working together even if they disagree.
    At the same time, working together—even in small ways—*also* promotes greater
    levels of trust. Trust develops as people tackle'

- pgno: 85
  md: 'creates flexible strength that allows networks to manage pressure without breaking.
    Tension doesn’t exist solely as an indicator of discord. Instead, it offers an
    opportunity to shift from zero-sum thinking into a network mindset, where structure
    comes from trust and diversity engenders innovation. In healthy networks, tension
    fortified by trust creates a durable alloy.¹⁹


    One dynamic tension that we have not yet discussed is the tension between stepping
    into leadership and engaging as a participant. You may be uncertain about leading
    and wonder: Am I really the right person to take on the responsibility of cultivating
    a network? I’ve had these doubts as well. But the simple fact that you’re asking
    the question is a sign that you might be the right person after all. To quote
    the prolific writer Seth Godin, “You are more prepared than you realize. You probably
    aren’t ready, and you can’t be ready, not if you’re doing something worthwhile.”²⁰


    You may be hoping that people will spontaneously self-organize, but the reality
    is that leadership always matters. Leadership is needed to catalyze a new network,
    to facilitate conversations, to weave connections, and to coordinate actions.
    Leadership is needed at every stage of a network’s evolution; it’s just a different
    kind of leadership than we usually see in hierarchical environments.


    The world needs more network leaders who inspire people to come together, who
    promote self-organization, who foster emergence, and who put purpose above profit
    or status. Network leadership is about leading in partnership with others and
    in service of the collective. Leading in ways large and small. Leading to lift
    others up so they may lead in the future. This is how network leaders cultivate
    networks that contribute to a world that works for all. If you’re willing to try,
    part 2 will show you how.'

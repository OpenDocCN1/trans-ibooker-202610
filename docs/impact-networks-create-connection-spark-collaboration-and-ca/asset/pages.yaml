- pgno: 47
  md: 'the specific outcomes that networks can achieve, they provide organizations
    with a means to unlock the creativity and engagement of their people. They do
    so in large part by offering meaningful opportunities for employees to contribute
    to something they care about but that falls outside the scope of their day-to-day
    responsibilities.


    As the examples above illustrate, networks and hierarchies are not at odds with
    one another. They can work alongside each other in harmony. Although we are distinguishing
    the network mindset from the hierarchical mindset, in practice hierarchies and
    networks overlap and interact in important ways. All organizations—even hierarchical
    organizations—contain organic and informal networks that connect people and departments
    together. These networks are “intricately intertwined with an organization’s performance,
    the way it develops and executes strategy, and its ability to innovate,” write
    Rob Cross and Andrew Parker in *The Hidden Power of Social Networks*. Their research
    shows that “well managed network-connectivity is critical to performance, learning,
    and innovation.”


    Likewise, all networks contain natural hierarchies. Rather than having a single
    hierarchy dictate authority, networks have multiple flexible hierarchies that
    arise according to the specific context. This is what’s known as a *heterarchical*
    structure. In a heterarchy, formal power and decision-making is distributed—nobody
    has a baked-in, structural advantage over others. At the same time, some people
    may have more influence than others on specific issues based on their knowledge,
    experience, or role.


    In my work with Sterling Network NYC, an action network working to advance economic
    mobility across the five boroughs of New York City, I noticed how one participant
    was a particularly trusted source for information about public housing because
    of their expertise and history as a leader in the sector. They were at the top
    of the public housing expertise hierarchy but lower on others. Another person
    was a skilled social justice lawyer and was influential on the topic of criminal
    justice reform. Meanwhile, a tech-savvy participant was the most influential on
    the question of what tech tools the network should adopt. By allowing multiple,
    natural hierarchies to emerge—rather than having a single power hierarchy dictating
    authority—impact networks unleash the many gifts that people bring to the group.'

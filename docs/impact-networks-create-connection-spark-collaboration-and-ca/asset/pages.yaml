  img_proc: true
- pgno: 126
  md: 'The act of weaving together a community — of stitching together individual
    parts into a larger whole — is the work of everyone in a network. All network
    participants have the opportunity and responsibility to weave new connections.
    This can be accomplished by taking the time to get to know people, introducing
    people to each other, listening deeply, and inviting others to collaborate in
    a variety of ways.


    Still, it is especially important for network leaders — and specifically, for
    those fulfilling the weaver role — to maintain a deliberate focus on creating
    connections across the whole network. By first connecting with participants, and
    then connecting participants with one another, weavers sense and anticipate the
    energy of the group while fostering greater levels of self-organizing.


    # Connecting with Participants


    Network weavers aim to connect with as many participants as possible, as frequently
    as is needed. The purpose of these interactions is to learn more about all of
    the participants, including what they care about, what they’re working on, how
    they’d like to communicate, and how they’d like to contribute to the network.
    These conversations build trust while surfacing opportunities to connect participants
    together to advance shared learning or action. They also help leaders and participants
    alike to develop a more holistic awareness about what’s happening across the network
    and to highlight issues that require special attention. Visit the Converge Network
    Toolkit for a list of Network Weaving Questions that weavers can use in their
    conversations with participants.


    Defining a regular cadence of connection will go a long way toward maintaining
    a consistent practice of weaving. Sharon Farrell, a leader of the California Landscape
    Stewardship Network, has adopted the habit of holding time on her calendar on
    two days each week to call network participants she hasn’t spoken with in a while:
    “I’m a firm believer that if you create time for conversation, one that is an
    exchange and not just directed in one way, trust begins to build,” says Farrell.⁵


    In smaller networks, it may be possible for weavers to connect with every participant
    at regular intervals. In larger networks, this is usually not'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'practical; even so, it’s important to talk regularly with a good cross section
    of the network. In these cases, we recommend that weavers be both strategic and
    random with respect to who they talk to, and that they also provide avenues for
    participants to reach out to them directly.


    A helpful strategy in large networks is to split up the list of participants between
    multiple weavers. This ensures that each participant has a designated person they
    can contact at any time with questions or concerns. Each member of the Fire Adapted
    Communities Learning Network has a specific point person (called their “network
    liaison”) who is responsible for checking in with them at least every few months
    and who they can reach out to at any time. “We rely on this practice as an important
    feedback loop for sensing in a complex domain,” shares Michelle Medley-Daniel,
    a leader and liaison in the network. “We adapt network values and offerings based
    on member feedback, and also adapt our understanding of the complex fire systems
    and ways to change them based on the information we get through these trusted
    relationships.”⁶


    # Connecting Participants with One Another


    The second essential activity of network weaving is connecting participants with
    one another. Weavers are “skilled at discovering the needs of people in their
    networks,” observes Holley, “and then linking them to others in the network who
    can work with them to have those needs met.”⁷ Weavers connect participants together
    who are likely to benefit from the relationship, such as those who are working
    on similar issues or have resources or expertise that could support each other’s
    work. The key is to go the extra mile and help set the context for the conversation,
    explaining why you think they should know each other. Mapping the network with
    social network analysis (SNA), as described in chapter 10, will help weavers discover
    opportunities to build connectivity across the network most quickly and to identify
    people who perhaps should be connected but do not yet have a relationship.


    As described above, while weaving is a central role of network leadership, weaving
    can also be carried out by anyone who notices opportunities to make introductions,
    deepen relationships, and bridge'

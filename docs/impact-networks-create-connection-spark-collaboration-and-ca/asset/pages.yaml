  img_proc: true
- pgno: 73
  md: 'beyond some people’s narrow definition of the word. Entrepreneurial actions
    to advance the work of the network are celebrated, as long as they are done transparently,
    collaboratively, and in alignment with purpose and principles. As a result, each
    person who participates in a network has shared opportunity—and shared responsibility—for
    supporting its development. This level of agency is particularly important in
    complex and chaotic environments when it’s unclear which action will make the
    most difference.


    One of the primary responsibilities of network leaders, then, is to cultivate
    the conditions for greater levels of self-organization to arise. Network leaders
    have the humility to step back and follow the lead of others. In Converge we follow
    the maxim of the Enspiral network: “No one should lead all the time, and everyone
    should lead some of the time.”⁵ This is what distributed leadership is all about.


    # Promote Emergence


    Murmurations of starlings, schools of fish, and swarms of insects swoop and swirl
    seemingly in unison. There are no instructions or control mechanisms dictating
    the movements of these groups. The patterns of their movement are emergent.


    In the case of the starlings, mathematical models have demonstrated that their
    cohesion is due to each bird taking cues from six or seven of its closest neighbors.⁶
    When a predator arrives and disturbs the flock, one bird initiates action and
    the other members of the group respond. The leader changes based on who knows
    what to do next. Meanwhile, the whole group stays connected through communication.


    This is the magic of emergence. When it comes to engaging with complex issues,
    we may not be able to accurately predict what happens next. What we can do is
    connect with one another and stay in close communication so that we can move together
    and adapt quickly to changing circumstances—adjusting as we learn. In other words,
    we can stay emergent.


    To understand why embracing emergence is so important, it’s helpful to think about
    it in the context of strategy. Management theorist Henry Mintzberg writes that
    all strategy is both deliberate and emergent.⁷'

  md: '![](img/4854536a9a7bcce4fd5250605cae8350_52_0.png)


    FIGURE 2.3. With a hierarchical mindset, your organization is at the center of
    your focus. With a network mindset, you place the purpose at the center of your
    focus and see your organization as one part of a larger, interconnected system.

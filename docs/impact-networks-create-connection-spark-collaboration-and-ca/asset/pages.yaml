- pgno: 49
  md: '# *Distinctions between the hierarchical mindset and the network mindset.*


    One of the main implications of shifting to a network mindset is in how we think
    about leadership. Hierarchical leadership is directive and consolidates control.
    Power is centralized and is to be sought or guarded. In contrast, network leadership
    is facilitative, generating connections between others and decentralizing power
    such that people can organize without a top leader. While hierarchical leaders
    focus on the quantity and quality of *their own* relationships with others, network
    leaders focus on increasing the quantity and quality of relationships *between*
    others.


    Similarly, it''s common for hierarchical leaders to think of themselves (or their
    organizations) as the sun, sitting at the center of their universe with all the
    other actors floating around them like orbiting planets. They are the hero of
    their own story, with others relegated to secondary roles. Leaders who have adopted
    a network mindset, however, recognize that they are part of a larger interconnected
    system. Rather than only looking inward, with an intense focus on internal metrics
    and financial goals, they look outward, beyond the walls of their organization.
    They act with an awareness of the whole system, becoming intimately connected
    with other groups who share their concerns. They put the pursuit of purpose at
    the center of their focus, rather than the growth of their own organization. This
    shift is reflected in figure 2.3.


    The shift from a hierarchical mindset to a network mindset also changes the way
    we think about strategy. Hierarchical systems commonly adopt plan-and-deliver
    strategies. This can be seen in the ritual of developing long and detailed strategic
    plans. But complex situations defy the cause-and-effect relationships that strategic
    plans specialize in. Addressing complex issues requires experimentation, learning,
    and flexibility. Deliberate *and* emergent strategies are both necessary to balance
    planning with adaptation.


    When groups of people share their different perspectives and blend their ideas
    together, new possibilities arise that could not have been predicted. Just as
    our brains exhibit extraordinary characteristics far beyond what we could predict
    from studying the electrical impulses of their individual neurons, and in the
    same way that the many surprising properties of water could not be predicted or
    understood by only looking at hydrogen and'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'oxygen molecules on their own, networks cannot be understood by looking merely
    at their individual parts. It is in the interactions between the parts that something
    new is created. This process is, in a word, *emergence*. Emergence is the magical
    quality that gives networks their exponential potential for impact.


    To tap into the boundless creativity that emerges when people from different parts
    of a system interact with one another, network leaders avoid the pull of authoritative
    decision-making.'
  merge: -1
  img_proc: true

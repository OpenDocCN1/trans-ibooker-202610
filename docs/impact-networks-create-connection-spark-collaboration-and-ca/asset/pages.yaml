- pgno: 93
  md: 'The network’s purpose—*why it exists*—is what inspires people to show up. The
    purpose should be ambitious enough to inspire, clear enough to identify who to
    convene, and specific enough to focus the energy of the participants. The best
    purposes galvanize connection, learning, and action. People are far more likely
    to reach out and engage with one another when they share a compelling vision to
    which they feel they can make a meaningful contribution.


    Without a common purpose to rally around, people will tend to connect with those
    who seem most similar to them. This is the network phenomenon known as *homophily*,
    the principle behind the adage, “Birds of a feather flock together.” Homophily
    is “the conscious or unconscious tendency to associate with people who resemble
    us (the word literally means ‘love of being alike’),” write Nicholas Christakis
    and James Fowler in *Connected*.[^5]


    Yet there is so much more that connects us beneath the surface, beyond what we
    can immediately perceive. By clarifying shared purpose, we explore the deeper
    commonalities that can bind us together. In the process, something in us shifts,
    and we begin to see ourselves as part of a larger “we.” As referenced earlier
    in [chapter 2](#chapter-2), we evolve from an egocentric focus to an ecosystem
    consciousness. We relate to each other not just as individuals but also as part
    of a community.[^6]


    Network purposes are usually focused on a combination of an issue, geography,
    and/or population. For example, the purpose of Sterling Network NYC is to “advance
    economic mobility across the five boroughs” of New York City.[^7] 100Kin10’s purpose
    is to “prepare and support 100,000 excellent STEM teachers in America’s classrooms.”[^8]
    The purpose of the Justice in Motion Defender Network is to “protect migrant rights
    by ensuring justice across borders.”[^9]


    A network’s purpose can be well defined or kept broad. Both approaches can be
    valid. The more tightly focused a purpose is, the easier it is to identify and
    recruit the people necessary to address it. On the other hand, broader purposes
    can help encourage the participation of a more diverse set of actors and provide
    them with greater flexibility to define what the network will ultimately focus
    on.


    The objective of clarifying a common purpose is not to force agreement but to
    legitimize difference, and through that exploration of divergent'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'perspectives to discover the places where values converge. When people recognize
    the nature of their interconnected aspirations, their perceived differences shift
    from barriers to gifts. “Because we know in essence that we want the same things,
    our differences cease to be obstacles,” writes Peggy Holman in *Engaging Emergence*.
    “They become creative pathways to unexpected innovations that contain what is
    vital to each of us and all of us.”¹⁰


    In our polarized world, it is easy to forget that there’s actually much common
    ground we share. We want safety for ourselves and our families. We want to be
    free of suffering and worry. We want clean air and fresh water. And we want to
    feel love and a sense of connection with others. Though we may have different
    ideas on how to get there, if we dig deep enough, we can find the shared whys
    that unite us and create a foundation upon which we can connect, learn, and work
    together to achieve those ends.


    # Integrating Multiple Levels of Purpose


    As people come to networks of their own accord, it’s important to recognize that
    they are motivated by multiple, overlapping purposes:


    +   - **Personal purpose:** The internal drivers for why people do what they do


    +   - **Professional purpose:** Professional or organizational motivations for
    joining the network


    +   - **Collective purpose:** The shared purpose that binds the network together


    Altruistic interests alone are unlikely to sustain someone’s engagement in the
    network. In order to be fully committed and participate in a meaningful way, their
    individual or professional purposes must be served as well. This is reflective
    of the dynamic tension of self-interest and shared interest. In the process of
    clarifying a network’s purpose, look for the intersection of individual passions,
    professional motivations, and collective aspirations.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'Sharing personal motivations also helps to humanize participants when they
    are used to seeing each other in a purely professional context. One particular
    exercise we use to accomplish this is called Purpose Stands. In this exercise,
    each participant delivers a one-minute timed speech that answers a central question:
    Why do I do what I do? This question reveals a person’s mission in the world,
    which may or may not align with the responsibilities of their day job. These one-minute
    speeches don’t focus on the practical *what* but on the personal *why* that defines
    one’s work. The full instructions for leading **Purpose Stands** can be found
    online in the Converge Network Toolkit (visit converge.net to access this and
    other tools referenced in the pages ahead).


    # Shifting Focus from Problems to Possibilities


    Exploring shared purpose is more about exploring shared possibilities than it
    is about defining shared problems. Instead of giving a network something to work
    on, give it something to work *toward*.[^11]


    People often approach social issues with two main questions, notes Holman: “What’s
    the problem?” and “How do we fix it?” These questions are backward looking, focused
    on restoring the system to an ideal or imagined past state. On the other hand,
    when guiding questions are future oriented, as in “What’s possible?” and “How
    do we create it?” people are mobilized to focus on more transformational change.[^12]
    Focusing on problems is limiting; focusing on possibilities is liberating.


    Consider the work of Smile Spokane, an action network consisting of more than
    a dozen organizations and supported by Arcora Foundation, which is working to
    improve oral health in Spokane County, Washington. If participants in the network
    focused on “the problem,” they would surely recognize that six in ten third graders
    in Spokane County have experienced tooth decay. Research shows that poor oral
    health has other significant ramifications that extend well beyond the mouth—for
    example, children with poor oral health are nearly three times more likely to
    miss school and four times more likely to earn lower grades.[^13]


    A focus on the problem might therefore articulate the network’s purpose as “reducing
    tooth decay in all Spokane County residents.” As a result, this'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'might have led the network to focus primarily on a strategy of increasing school
    tooth sealant programs—a worthy pursuit given its effectiveness in reducing tooth
    decay. Yet, presenting problems are usually just the most visible symptoms of
    a broken system. More than likely there are deeper root causes, including underlying
    systemic inequities, that are keeping things the way they are. Focusing on the
    problem might have caused the network to miss higher- leverage opportunities to
    create impact.


    Instead, Smile Spokane articulated its aspiration for the future: “To create a
    healthier Spokane by improving oral health for all.”14 With this future-oriented
    purpose, the network identified strategies to affect underlying issues, including
    increasing access to oral health care among vulnerable populations, integrating
    oral health care into primary care, and providing care navigators to link oral
    health care with other services related to behavioral health and substance use
    disorder. Each of these strategies aimed at creating a new system of care in order
    to consistently produce better outcomes for residents over the long term.


    Of course, taking a forward-looking approach does not mean abandoning present-day
    issues. It only means that those pressing issues can be seen in the larger context
    of the future you want to create. Even as it advances longer-term changes, Smile
    Spokane is working to expand the school sealant programs so badly needed in the
    short term. Before the network launched, there was only one school-based sealant
    program in the city, serving only a small fraction of the population. Today, because
    of partnerships cultivated through the network, sealant programs are in place
    in nearly 100 percent of schools with a majority of low-income students.15


    # Envisioning the Future


    Envisioning what you want to bring into reality is about dreaming, sharing aloud
    what you hope to see (through dialogue, art, and other means), and co-creating
    an image of the future. Envisioning the future together inspires energy and creativity
    to help a network clarify its purpose.


    Resonance Network provides an example of how to use a compelling vision to bring
    people together and chart a course for the work ahead. Emerging from Move to End
    Violence, a ten-year program of the NoVo'

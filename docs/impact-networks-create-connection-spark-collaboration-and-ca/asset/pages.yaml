    # Exploring the Potential for a Network


    If it appears that greater levels of connectivity are needed between individuals
    and organizations to make progress on a complex issue, you can advance through
    the following steps to catalyze a new impact network:


    # 1. Make Sense of the System, and Build on What Already Exists


    Start by doing your homework to understand what’s really going on. This means
    having conversations with lots of different people who are engaged in the issue.
    Where is there common ground? Where is there disagreement? Is there a shared purpose
    that can bring people together? Do the people doing the work see the need or opportunity
    for greater connectivity and collaboration? Examine the work through an equity
    lens. Why is the system the way it is? Who has power, and who doesn’t? What needs
    to be centered in this work? Which people and perspectives are historically or
    currently underrepresented or marginalized?


    Before doing anything to start a new network, look to support and build on the
    work already underway. Rather than creating something new and duplicative, follow
    the leadership of potential participants. Networks can be harmful when they are
    forced from the top down with no recognition of existing initiatives and when
    they fail to include the people on the ground doing the work.


    # 2. Organize an Exploratory Gathering


    If there is a clear need for increased connection, coordination, and collaboration,
    and there is not already a viable effort underway that you can partner with, the
    next step is to invite people from across the system to explore the potential
    of an impact network. The Stewardship Network (not to be confused with the Santa
    Cruz Mountains Stewardship Network), a movement network that helps catalyze other
    stewardship-focused networks in communities around the United States, organizes
    one-day “exploring'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'possibilities workshops” to determine if there’s a need and desire for a new
    network. Though it is sometimes appropriate to organize such a gathering by invitation,
    it can also be quite powerful at this stage to put out an open invitation to anyone
    who is interested. “Making space at the table is so much a part of what we do,”
    says Lisa Brush, founder of The Stewardship Network. “Over time a main group of
    people keep showing up, and the group starts to coalesce.”²


    At that exploratory gathering, discuss the following questions:³


    +   - Why should we start this network?

    +   - Why should we *not* start this network?

    +   - What are the possible issues we would work on?

    +   - Who else should be at the table?


    Then, toward the end of the gathering, ask:


    +   - Should we proceed?

    +   - If so, to what degree are you interested in participating? (See chapter
    10 for four levels of engagement that people can choose from.)


    If there doesn’t seem to be much energy or interest, creating an impact network
    probably isn’t the right approach at this time. Still, even in the absence of
    an organized impact network, you can continue doing whatever you can to foster
    connection across the system. You can introduce people who are working on similar
    issues or create new communication channels where people can share information.
    Strengthening the underlying network of connections that exists within any human
    system is almost always a worthy exercise. In many cases, it is wise to start
    by strengthening connections informally, and gauging people’s interest to engage
    further, before spending additional resources to build a formal network.


    # 3. Form a Design Team'

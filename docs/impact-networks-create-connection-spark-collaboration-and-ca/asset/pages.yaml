- pgno: 65
  md: 'When relationships deepen to a point of mutual confidence, where two people
    feel they can count on each other to act in service to the purpose—even if they
    might disagree—we call that *trust*. Trust is the fundamental element that establishes
    a culture of openness, commitment, and collaboration.


    Importantly, trust should not be confused with liking or agreement. To work together,
    people do not need to like each other. And they certainly do not need to agree
    with each other on every issue. When I talk about trust here, I mean trust *for
    impact*. This is the type of trusting relationship that allows people to hold
    the tension through disagreement and conflict, find common ground, and work together
    to achieve mutual goals.


    Although it is widely accepted that trusting relationships are beneficial when
    it comes to collaboration, the common assumption is that trust is a by-product
    of other activities and that it takes a long time to develop. Rather than deliberately
    building trust, the norm is to focus on getting to action and letting relationships
    develop naturally over time. However, we have consistently found that trust is
    the single most important factor behind successful impact networks; networks move
    at the speed of trust.[^4]


    Therefore, trust should be deliberately nurtured from the outset of a network’s
    development. [Chapter 7](#) is focused on how to cultivate relationships of trust.


    # IV. Coordinate Actions


    If networks are as strong as the connections that hold them together, connections
    are only as valuable as what’s moving *through* them. Connections are not just
    about relationships; they are also about flows—of information, knowledge, and
    resources. To truly grasp what’s happening in a network, it’s just as important
    (if not more important) to understand what’s flowing across the network, from
    node to node, as it is to understand how those nodes are connected.


    When flows are accelerated across networks, new opportunities arise for data,
    expertise, and capacity to be distributed quickly to where they’re needed most.
    As a result, people are better able to coordinate their efforts.'
  merge: -1
  img_proc: true
- pgno: 66
  md: "Specific practices for accelerating flows and coordinating actions are detailed\
    \ in [chapter 8](#).\n\n# V. Collaborate for Systems Change\n\nIncreasing connections\
    \ and flows across networks creates many positive benefits. But if the goal is\
    \ to spark more substantial collaboration and create system-wide change, the network\
    \ will need to dive deeper into an exploration of possible leverage points. These\
    \ are places in a system where, as Donella Meadows put it, “a small shift in one\
    \ thing can produce big changes in everything.”⁵ Then, networks can take action\
    \ on opportunities where people and organizations can have greater impact by working\
    \ together than is possible alone.\n\nWhen identifying opportunities to create\
    \ change, it’s necessary to first make sense of what’s happening in the system\
    \ from many different perspectives. People and organizations are usually focused\
    \ on a particular piece of the puzzle, and for good reason—each piece is important,\
    \ and it takes focus to develop deep expertise and experience on a particular\
    \ issue. But if they continue to work in isolation, they will be limited in their\
    \ understanding of the whole.\n\nThe puzzle metaphor exemplifies three conditions\
    \ that make a network approach so valuable:\n\n+   - **Local knowledge:** People\
    \ are engaged with different parts of the system, with expertise in their piece\
    \ of the puzzle.\n+   \n+   - **Separation:** People are disconnected and unable\
    \ or unwilling to share knowledge and resources with one another.\n+   \n+   -\
    \ **Complexity:** The system is more complex than anyone can grasp on their own.\
    \ Only by bringing the pieces together can groups make sense of the whole puzzle.\n\
    \nWithout seeing the whole system, we have little chance of creating the systemic\
    \ changes we wish to see in the world. Meaningfully addressing complex issues\
    \ thus requires bringing people together who collectively hold"

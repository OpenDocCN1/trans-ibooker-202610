- pgno: 165
  md: '# CHAPTER 10


    # The Enabling Infrastructure


    > As for the future, your task is not to foresee it, but to enable it.


    > —ANTOINE DE SAINT-EXUPÉRY, *The Wisdom of the Sands*


    To enable participants to work together effectively over time, impact networks
    require an adaptive infrastructure that grows along with the network. A good organizing
    structure allows a network to effectively channel the creative impulses of its
    participants, while too much structure risks stifling individual initiative. We
    recommend that networks adopt a minimum viable structure—the simplest possible
    structure that will effectively serve its needs, and one that can evolve as the
    network develops.


    The work of urbanist Jane Jacobs highlights the folly of over-structuring in a
    different kind of living system—the cities of the United States. In the 1950s,
    US cities were designed such that people lived in one part of the city, worked
    in another, and shopped in yet another. In most cities this is still the case,
    and it has led to widespread social fragmentation and lengthy daily commutes.
    As Jacobs observed, this occurred because urban planners designed for what they
    thought *should* happen, neglecting the way that humans naturally organize themselves
    based on their daily lives. A better approach would have been to “acknowledge
    the city as a living organism in constant mutation, a highly complex network involving
    a vast number of variables . . . an open space bursting with overlap and spontaneity,
    where the natural conditions for creativity, recreation, and cooperation can easily
    prosper,” writes Manuel Lima in *Visual Complexity*, referencing Jacobs.¹'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'We can apply these insights to impact networks as well. Impact networks are
    living systems, not machines; we cannot know in advance exactly how they will
    evolve. Therefore, it would be wise to avoid defining their structures too rigidly
    as they form. Doing so can only limit their ultimate potential.


    The Cancer Free Economy Network, for example, didn’t define specific governance
    agreements until four years after the network’s launch. They simply weren’t needed.
    Defining them much earlier in the process would have merely added unnecessary
    rigidity. Only when the network started to grow significantly did it become obvious
    that well-documented agreements were necessary. By that point, participants also
    had a much better understanding of how the network would function and what governance
    agreements would best serve their collaborative work.²


    When developing a network’s structure, let form follow function. Let the energies
    and interests of participants lead the way. Let the network’s natural evolution
    define its structure according to what it needs most in any given moment. “Collaborative
    networks don’t require building any structural elements or operational agreements
    until they are absolutely useful,” writes Ruth Rominger, a catalyst of the RE-AMP
    Network. “Putting just enough in place will keep the network connected yet flexible
    enough to adapt.”³


    The enabling infrastructure of an impact network consists of a collection of teams
    formed to support learning, action, or governance; a set of shared participation
    agreements; a clear decision-making process; embedded evaluation practices; and
    flexible resources. This chapter will explore each of these components in turn.


    # Organizing into Teams


    Impact networks are commonly organized through four types of teams, each of which
    appears only when needed. Design teams form to help catalyze a new network and
    organize network convenings; core teams form to provide governance and advisory
    support; project teams form to advance collaborative work; and learning circles
    form to hold conversation and gather information on a topic of interest. While
    design teams were'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'described earlier in [chapter 5], the basic functions of core teams, project
    teams, and learning circles are summarized below.


    # Core Team


    The leadership function for the network as a whole is served by a core team (sometimes
    called a *leadership team, network council, governance circle,* or *steering committee*).
    Core teams coordinate the work, activities, and resources of the network in partnership
    with other network leaders. Because they are not always necessary, core teams
    should be created only if a network is sufficiently complex that an additional
    layer of governance is needed to support greater contributions and aligned action
    among participants.


    Core teams may appear to be an unusually hierarchical feature of impact networks
    at first glance, and indeed they do tend to have some influence on the network’s
    decisions. The primary difference from a traditional power hierarchy, however,
    is that core teams do not hold formal authority over other network members. Core
    teams make recommendations, but final decisions ultimately rest with the network
    as a whole. Another difference from traditional hierarchies is that core teams
    rotate their members regularly. They usually consist of four to seven people,
    each representing a different participating organization or part of the network,
    who volunteer for the core team for a specific period of time (often from one
    convening to the next).


    Core teams have wide-ranging roles, depending on what the network needs most at
    any given time, including but not limited to the following:


    +   - Providing advisory support to other network leaders, such as those leading
    project teams and learning circles

    +   - Working to ensure that the network’s stated principles are infused in the
    network’s practices

    +   - Making recommendations on important decisions for the network to consider'
  merge: -1
  img_proc: true
- pgno: 168
  md: '+   - Weaving the network by acting as liaisons between leaders, project teams,
    and the full network, including being available to hear and consider ideas and
    concerns raised by participants

    +   - Representing the network in public settings

    +   - Supporting the selection and onboarding of new participants

    +   - Advancing efforts to resource the network


    # ### Project Teams


    Project teams (sometimes called *working groups, task forces,* and *action circles*)
    are organized by participants to advance a body of work related to the network’s
    purpose. When it comes to forming project teams, what participants think should
    happen is less important than what they will do. As Marvin Weisbord and Sandra
    Janoff advise, set priorities “based on willing actors rather than good ideas.”4


    Early on in a network’s formation, project teams are most often focused internally
    to build the network itself. Internally focused project teams might be tasked
    with determining decision-making processes, securing funding, clarifying communications
    strategies, or developing an asset map. As the network evolves, project teams
    increasingly focus externally, advancing work in the community or broader system.


    Project teams aim to break down the complexity that the network is trying to address
    into discrete, short-term tasks that can be deliberately planned and advanced.
    Accordingly, they are the perfect place to flex project management muscles. To
    balance deliberate and emergent strategy, project teams can develop plans of action
    only from one convening to the next, or over the course of a few months, whichever
    is shorter. Then, when they’ve completed their task, they can assess what they’ve
    learned, report their progress back to the network, and plan out the next phase
    of work, if necessary. This cyclical process allows project teams to assign responsibilities
    and make consistent progress, while also staying emergent and open to input and
    support from the network.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# Learning Circles


    Learning circles form to combine knowledge, gather information, and generate learning
    on a specific topic of interest. They might aim to conduct research that can help
    the network identify critical points of leverage or simply foster conversation
    without a specific end goal in mind. For example, Sterling Network NYC has organized
    learning circles to support participants through professional transitions, to
    think creatively about how to reimagine and strengthen organized labor, and to
    engage in intimate conversations about race and identity using questions developed
    by the People’s Supper.⁵


    Learning circles usually exist only for short time periods, disappearing after
    they share what they have learned with the rest of the network. In some cases,
    learning circles evolve into project teams as they shift from gathering information
    to taking action.


    # Leading Network Teams


    Like the network as a whole, teams benefit greatly from good leadership. Core
    teams are typically led by one of the network’s primary coordinators as part of
    their normal responsibilities, while project teams and learning circles are typically
    led by participants who step up into a leadership role.


    Ideal team leaders are those who have a strong interest or stake in the outcome
    of the team. When self-interest and shared interest are aligned, leaders are better
    able to commit the time necessary to help move the work forward. Team leaders
    should not be expected to singlehandedly do the work of the group. Rather, they
    are facilitative leaders who support the team to advance its purpose. Following
    are a list of questions to consider when forming a new team, along with key responsibilities
    of team leaders.


    **Questions to form a new team:** Anytime a project team or learning circle is
    formed, it may begin by answering the following questions:


    +   - What is the purpose of this team?

    +   - Who is involved?'
  merge: -1
  img_proc: true
- pgno: 170
  md: '+   - Who will lead this team at least until the next convening?

    +   - What tasks are required between now and the next convening?

    +   - Who is taking responsibility for each task, and by when?

    +   - What do we need from the network, if anything?


    **Team leadership responsibilities:** Those who step up to lead a project team
    or learning circle may provide the following types of support:


    +   - Scheduling and facilitating conference calls or in-person meetings as needed

    +   - Project management, including ensuring that each task is assigned to a specific
    person and with a specific due date

    +   - Keeping network leaders and the core team updated with the team’s progress

    +   - Reporting progress back to the network, sharing team needs and learnings,
    and providing opportunities for other participants to contribute


    # Bounding Participation


    Engaged participants are the lifeblood of networks. When participants are engaged,
    they are showing up, saying yes, and contributing to the network and its purpose.


    Over the course of a network’s development, it is normal and expected that participants’
    available time, energy, and attention will rise and fall with changing circumstances.
    Meanwhile, some new people may join the network, and others will choose to leave
    it entirely. By offering different ways to plug in, networks provide people with
    the flexibility to decide how and where they would like to participate.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'We have found it useful to offer four primary levels of engagement to choose
    from: lead, partner, follow, and honor. These levels of participation can apply
    to the network as a whole, as well as to specific project teams:


    +   - **Lead:** “I will take responsibility for making this network/team happen.”

    +   - **Partner:** “I will actively work with the leaders to make this network/team
    happen.”

    +   - **Follow:** “I would like to stay informed about how this network/team is
    progressing.”

    +   - **Honor:** “Although I appreciate what you are proposing, this network/team
    is not of particular interest to me at this time.”


    When a network is just getting started, we ask participants to share their preferred
    level of engagement with the network as a whole, to get a better sense of who
    would like to attend future convenings and be kept in the loop with network communications.
    *Leaders* are those who would like to be particularly engaged in the work of cultivating
    the network—for instance, by helping to coordinate the network, participating
    on the core team, or leading a project team. Network *partners* are actively engaged
    in the work of the network and committed to attending convenings and participating
    in network activities. *Followers* want to be kept in the loop but cannot be actively
    engaged at the present time. People who choose *honor* are respectfully declining
    to participate and are therefore removed from network communications. As the network
    evolves, we ask participants to clarify their intended level of engagement annually
    to help leaders with planning, coordination, and budgeting.


    Be sure not to overlook the followers. Anyone who has seen Derek Sivers’s YouTube
    video “First Follower: Leadership Lessons from Dancing Guy” knows the power that
    followers have to inspire and advance the work of others. “If the leader is the
    flint,” he says, “the follower is the spark that really makes the fire.”⁶ Followers
    should be kept in the loop with updates on future opportunities to engage with
    and support the work of the network.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Over time, they may shift to become partners or leaders as their interests
    and capacity change—it''s common for people to move between different levels of
    engagement over the course of a network''s life cycle.


    One of the responsibilities of network leaders is to provide many different opportunities
    for leadership, partnership, and followership to emerge, and to allow people to
    decline altogether. Trust that participants will self-organize to place their
    energy where they are most inspired to contribute and where they are most needed.


    # Establishing Participation Agreements


    Network participation is not a one-size-fits-all proposition. Participation in
    networks may be open (anyone can join), closed (participants agree to fulfill
    certain criteria to join and stay engaged), or tiered (the network provides multiple
    ways for participants to engage, each with distinct criteria and responsibilities).
    Networks will need to decide what participation agreements are necessary to maintain
    continuity as they evolve.


    While it may be tempting to keep participation open to avoid complications around
    defining criteria and excluding some people, open participation comes with its
    own challenges. In The Art of Community, Charles Vogl identifies “clear boundaries”
    as one of the core principles of belonging. Vogl notes that for a strong community
    to develop, people often need to know that being a part of the community *means
    something* and that not just anyone can join in on a whim. In other words, boundaries
    are less about exclusion and more about fostering greater inclusion within the
    network.^7


    The Enspiral network learned this lesson the hard way. Enspiral is a community
    of more than 150 freelancers and activists located primarily in Europe and New
    Zealand who work collaboratively to create positive social impact through their
    ventures. At first, Enspiral was an open network, with few boundaries on participation.
    While this worked at first, over time the lack of boundaries created an unhealthy
    work environment when some people abused the high-trust atmosphere. As a result,
    Enspiral was forced to develop clearer agreements for participation, which they
    captured in their open-source “Handbook.”^8 One of the key insights they took
    from the'

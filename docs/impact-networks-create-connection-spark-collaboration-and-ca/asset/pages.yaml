  img_proc: true
- pgno: 81
  md: 'challenges together, find common ground, and support each other’s work.

    Trust and action are two sides of the same coin.


    We integrate trust and action by using the mantra “Go slow now to go fast later.”
    In other words, we take the time to build deeper levels of trust early in a network’s
    formation in order to speed the rate of action down the road. Meanwhile, as relationships
    are developing, we also look for small, short-term ways that participants can
    support each other’s work. Trust and action, when advanced in tandem, become a
    virtuous cycle.


    # Participation and Pace


    Networks are at their best when they engage a broad spectrum of stakeholders.
    However, including more people may mean that things move at a slower pace (at
    least initially) than they would with a smaller group. It takes time to share
    current thinking, develop common language, evolve collective understandings of
    challenges, and determine a course of action. It also takes more time to develop
    trusting relationships without the same level of intimacy felt in small groups.


    The larger that networks are, the more time it may take to build trust and get
    to action. On the other hand, quick actions pushed forward by only a few are less
    likely to succeed. Network leaders have an important role to play in ensuring
    robust participation while maintaining a workable pace that results in forward
    motion.


    # Self-Interest and Shared Interest


    Because of the drive to take action together, participants will often default
    to spending the majority of their time figuring out their collective purpose and
    then working together on behalf of those shared interests. However, altruistic
    concerns alone are rarely enough to justify participants’ continued engagement
    in a network, given busy schedules and competing priorities. For people to continue
    participating over the long term, the network will also need to advance their
    self-interests in some way—for instance, by facilitating valuable connections,
    generating new learnings, or advancing individual and organizational priorities.


    People are sometimes reticent to explicitly state their self-interests out of
    fear that they will appear selfish. Network members need to be able to be'

  ### 明确目标与原则


  > *目标不是具体的客观指标，也不是使命宣言——目标是人们共同希望成为什么样的一种清晰表达。而原则也不是老生常谈——它是关于你打算如何行事以实现该目标的基本信念……*

  >

  > *在多大程度上你共同秉持目标与原则，就能在多大程度上摆脱指挥与控制。*

  >

  > ——迪·霍克（DEE HOCK），*EnlightenNext* 采访


  培育影响力网络的第一步，是明确该网络是否应该存在以及为何存在。有时这种需求显而易见，特别是对于那些在该领域工作了多年的人来说。但其他时候可能需要一些调查。无论哪种情况，都需要特殊的人或群体来识别网络的潜力，并投入时间和资源帮助其形成。我们将这些人称为*网络催化剂*。催化剂是那些推动新网络启动的远见者。


  ### 催化新网络


  催化剂形式多样。以第一章中描述的圣克鲁斯山脉管护网络（Santa Cruz Mountains Stewardship Network）为例，最初的催化剂是加利福尼亚州最古老土地信托机构的执行主任、Sempervirens基金会的里德·霍尔曼（Reed
  Holderman）。凭借多年的实地工作，霍尔曼认识到地区性组织在土地管理和管护活动方面需要更紧密的合作。在退休前的最后行动中，他召集了一个由领导组成的初始团队，探讨他们的组织如何能在该区域更有效地协作。霍尔曼还筹集了足够的种子资金，帮助启动该网络。


  第一章中同样提到的多功能预防技术倡议（IMPT），最初是由贝萨尼·扬·霍尔特（Bethany Young Holt）催化的，她是一位非营利领导者，受连接碎片化的MPT（多功能预防技术）领域的需求所启发。霍尔特组织了一次利益相关者会议，参与者从事HIV预防、性传播疾病（STI）预防以及避孕药具研发工作，随后利用其组织CAMI
  Health的资源，帮助他们相互分享信息和协调行动。


  对于第二章中提到的谷歌食品实验室（Food Lab at Google），主要的催化剂是米歇尔·巴克尔（Michiel Bakker），他是一位组织新成员，看到了调动谷歌内部及外部行动者以解决复杂粮食系统问题的机会。在另一个例子中（第九章描述），UCSF
  Health姑息治疗项目主任史蒂夫·潘提拉特（Steve Pantilat）催化了护理协调网络（Coordination of Care Network），以连接12个站点和10个医疗学科，从而为整个医疗系统中的重症患者提供更全面、协调的姑息治疗。


  基金会有时也处于有利位置，能够助力点燃新网络。例如，加菲尔德基金会（Garfield Foundation）通过召集一群资助者和倡导者，采取系统性方法解决中部的环境问题，从而催化了RE-AMP网络。同样，罗伯特·斯特林·克拉克基金会（Robert
  Sterling Clark Foundation）催化了斯特林纽约市网络（Sterling Network NYC），支持公共、私营和社会部门的领导者共同合作，以提高该市五个行政区的经济流动性。


  几乎任何人都可以是催化剂——只要他们拥抱网络思维。践行网络思维意味着分享领导权而非寻求控制事务，展现谦逊，并表现出对网络目标的真诚承诺。这一点尤为重要。如果催化剂未能获得足够的信任和对该事业的承诺，参与者就会质疑他们是在“为影响力组织还是为自我”，正如危机行动组织（Crisis
  Action）的尼克·马特卢（Nick Martlew）所言，该组织是一个由多个机构共同合作以保护平民免受武装冲突影响的催化剂和协调者。¹ 催化剂赢得参与者信任的最清晰方式是将其焦点保持在目标中心，而非其自身利益。受信任的催化剂是深思熟虑且高诚信的人——他们
  consistently 分享权力、将功劳让给他人，并提升他人。


  ### 探索网络的潜力


  如果看起来需要提高个人和组织之间的连接水平以推进复杂问题的解决，你可以通过以下步骤催化一个新的影响力网络：


  ### 1. 理解系统，并在现有基础上建设


  首先，通过研究来理解真正发生的事情。这意味着与许多参与该问题的不同人群进行对话。哪里有共同点？哪里有分歧？是否有共同的目标能将人们凝聚在一起？从事这项工作的人是否看到了加强连接和合作的需求或机会？通过公平性视角审视这项工作。系统为何是现在的样子？谁拥有权力，谁没有？这项工作应该以什么为中心？哪些人和观点在历史上或当前处于代表不足或被边缘化的状态？


  在着手启动新网络之前，应着眼于支持和建立在开展工作。与其创造新的、重复的东西，不如跟随潜在参与者的领导。当网络自下而上地强加，忽视现有举措，且未能纳入基层工作时，网络可能会带来危害。


  ### 2. 组织一次探索性聚会


  如果明显需要增加联系、协调和合作，且目前没有可行的工作可供你合作，下一步是邀请来自系统各处的人探索影响力网络的潜力。管护网络（Stewardship Network，注意不要与圣克鲁斯山脉管护网络混淆）是一个运动网络，帮助催化美国各地社区中以管护为重点的其他网络，它组织为期一天的“探索可能性研讨会”，以确定是否有对新网络的需求和愿望。虽然有时通过邀请组织此类聚会是合适的，但在此阶段，向任何感兴趣的人发出公开邀请也可能非常有力。“在桌上留出空间是我们工作的重要组成部分，”管护网络创始人丽莎·布拉什（Lisa
  Brush）说。“随着时间的推移，主要的一群人不断出现，群体开始凝聚。”²


  在那次探索性聚会上，讨论以下问题：³


  - 我们为什么要启动这个网络？

  - 我们为什么*不*应该启动这个网络？

  - 我们可以处理哪些可能的问题？

  - 还有哪些人应该参与？


  然后，在聚会接近尾声时，询问：


  - 我们是否应该继续？

  - 如果是，你有多大兴趣参与？（请参阅第十章了解人们可选择的四个参与层级。）


  如果似乎没有太多能量或兴趣，此时创建影响力网络可能不是正确的做法。尽管如此，即使没有组织化的影响力网络，你仍可以继续努力促进系统内的连接。你可以介绍从事类似问题的人，或创建新的沟通渠道，让人们分享信息。加强任何人类系统中存在的潜在连接网络几乎总是一项值得的练习。在许多情况下，明智的做法是先非正式地加强联系，并衡量人们进一步参与的意愿，然后再投入额外资源建立正式网络。


  ### 3. 组建设计团队


  催化剂职位伴随着真实的权力，这种权力需要在初始阶段得到明确承认。这不是一个可以轻视的角色。特别是，这种权力体现在对网络目标的初步表述以及邀请人们参与的方式中。使培育新网络的过程更加公平的最佳方式之一，是通过组建多元化的*设计团队*与他人分享这种权力。


  设计团队成员致力于服务于网络目标及未来参与者的利益，负责管理网络的发展。他们由来自系统不同部分的代表组成，共同明确为何需要网络以及需要涉及谁。这个小而深思熟虑的群体应能代表多种观点，并从不同视角发声。


  设计团队的首要任务是将从探索性会议中听到的内容提炼为新网络的连贯叙事。在此过程中，他们可以明确目标草案。虽然网络的目标——其存在的原因——可能会随时间演变，但最初将人们聚集在一起通常需要一个高级别的初始声明，说明他们被邀请解决的问题或机遇。设计团队还将考虑需要什么类型的网络，以及网络参与可能如何限定。


  最重要的是，他们将回答组织初步聚会所需的问题：谁需要参与？我们如何邀请人们加入？聚会将在哪里举行？我们在聚会上可能需要处理哪些主题？谁将设计和引导聚会？他们还可能考虑聚会后网络如何推进，包括网络如何结构化、可使用何种沟通系统、如何获得资源、谁可能提供持续协调等。


  与目标一样，这些初步考虑将在参与者聚集时得到完善，但准备好草案供网络响应比让新兴网络从头开始开发要有帮助。当设计团队完成了为网络启动打下坚实基础所需的思考工作后，就是组织初步聚会的时候了。






  ## 4. 组织初次召集，并开始循环推进“五个C”


  最后一步，与设计团队合作，是组织一次或多次召集会议，并邀请人们开始循环推进“五个C”。虽然许多网络会以单次召集会议来判断兴趣，但考虑到日程繁忙，从一开始就安排一系列召集会议可能是明智之举。


  在这些初次召集会议上，催化剂可以提供引导，也可以找其他人来承担这一关键角色。无论如何，初始目标始终相同：将人们聚集在一起，使整个系统更加互联；寻找共同点，确定人们可以合作的地方——即使他们在某些问题上存在分歧；花时间建立信任关系；并找到分享信息与资源的方式，以支持彼此的工作。


  在早期阶段，Jane Wei-Skillern鼓励道：“从小处着手，让它自然成长。分享资源，分担基础设施成本，参与那些让人们看到益处的小型合作。网络应该让每个人的工作和生活变得更轻松。如果它们不能服务于这个目的，就不应该存在。”⁴
  我们曾建议许多雄心勃勃的网络领导者，在直接采取行动之前，先着手培育一个强大的学习型网络。拥有一个充满活力的学习型网络，远比一个平庸的行动型网络要好得多，而且学习型网络日后总能发展为行动型网络。随着时间的推移，人们可能会发现合作的机会——共同完成比单打独斗更多的事情——此时，催化剂可以帮助创建新的结构，并投入额外资源来支持这项共同的事业。


  随着网络的发展，催化剂可能会继续参与并帮助领导网络，也可能像其他人一样成为普通参与者。无论哪种情况，一旦网络已经凝聚起来，并且拥有足够的领导力、资源和清晰的方向来继续面向未来演进，催化剂的角色就已经完成。


  ## 寻找共同目标


  网络的目标——*它为何存在*——是激励人们参与的动力。目标应当足够宏大以激发热情，足够清晰以确定召集对象，并且足够具体以聚焦参与者的能量。最好的目标能够激发连接、学习和行动。当人们共享一个令人信服的愿景，并感到自己能为之做出有意义的贡献时，他们更有可能主动联系并相互参与。


  如果没有一个可以凝聚的共同目标，人们往往会与那些看起来最像自己的人建立联系。这就是被称为*同质性*的网络现象，也是“物以类聚，人以群分”这句谚语背后的原理。尼古拉斯·克里斯塔基斯和詹姆斯·福勒在《大连接》中写道，同质性是指“有意或无意地倾向于与和我们相似的人交往的倾向（这个词的字面意思是‘喜欢相像’）”。[^5]


  然而，在表象之下，我们之间的联系远比我们当下能感知到的要多得多。通过明确共同目标，我们能够探索更深层次的共性，这些共性可以将我们凝聚在一起。在这个过程中，我们内心会有所转变，开始将自己视为一个更大的“我们”的一部分。如前文[第2章](#chapter-2)所述，我们从以自我为中心的关注，进化为生态系统意识。我们不仅作为个体，也作为社区的一部分相互关联。[^6]


  网络的目标通常聚焦于议题、地域和/或人群的组合。例如，Sterling Network NYC的目标是“推动纽约市五个行政区的经济流动性”。[^7] 100Kin10的目标是“在美国课堂中培养和支持10万名优秀的STEM教师”。[^8]
  Justice in Motion Defender Network的目标是“通过确保跨境正义来保护移民权利”。[^9]


  网络的目标可以定义得很明确，也可以保持宽泛。这两种方法都可行。目标越聚焦，就越容易识别和招募解决问题所需的人员。另一方面，更宽泛的目标有助于鼓励更多元化的参与者加入，并为他们提供更大的灵活性，以决定网络最终聚焦的方向。


  明确共同目标的目的不是强迫达成一致，而是让差异合法化，并通过探索不同视角，发现价值观交汇之处。当人们认识到彼此交织的愿望的本质时，他们感受到的差异便会从障碍转变为礼物。佩吉·霍尔曼在《涌现参与》中写道：“因为我们本质上知道自己想要的是同样的东西，所以我们的差异不再成为障碍。它们变成了通往意外创新的创造性路径，其中包含对每个人和所有人至关重要的事物。”¹⁰


  在我们这个两极分化的世界里，我们很容易忘记我们其实共享着许多共同点。我们希望自己和家人安全。我们希望摆脱痛苦和忧虑。我们希望有清洁的空气和淡水。我们希望感受到爱和与他人的联系。尽管我们对于如何实现这些目标可能有不同的想法，但如果我们挖掘得足够深，就能找到将我们团结在一起的共同初衷，并以此为基础，让我们能够连接、学习并共同努力实现这些目标。


  ## 整合多层次目标


  人们自愿加入网络时，重要的是要认识到他们受到多重且相互重叠的目标驱动：


  - **个人目标：** 驱动人们做其所做之事的内部动机

  - **职业目标：** 加入网络的专业或组织动机

  - **集体目标：** 将网络凝聚在一起的共同目标


  仅凭利他主义的兴趣不太可能维持一个人在网络中的参与。为了让他们全身心投入并以有意义的方式参与，他们的个人或职业目标也必须得到满足。这反映了自身利益与共同利益之间的动态张力。在明确网络目标的过程中，要寻找个人热情、职业动机和集体愿望的交汇点。


  分享个人动机也有助于让参与者更加人性化，尤其是当他们习惯于在纯粹的职业背景下看待彼此时。我们使用的一个特定练习叫做“目标宣言”。在这个练习中，每位参与者发表一段一分钟的限时演讲，回答一个核心问题：我为什么做我所做的事？这个问题揭示了一个人在世界上的使命，这未必与其日常工作的职责一致。这些一分钟演讲不聚焦于实际的*做什么*，而是聚焦于定义一个人工作的个人*为什么*。带领**目标宣言**的完整说明可以在
  Converge 网络工具包中在线找到（访问 converge.net 获取此工具以及后续页面中提到的其他工具）。


  ## 将焦点从问题转向可能性


  探索共同目标，更多地是探索共同的可能性，而不是定义共同的问题。与其给网络一个要处理的事情，不如给它一个要*朝向*的目标。[^11]


  霍尔曼指出，人们通常以两个主要问题来对待社会议题：“问题是什么？”和“我们如何解决它？”这些问题面向过去，着眼于将系统恢复到理想或想象中的过去状态。另一方面，当引导性问题面向未来时，例如“什么是可能的？”和“我们如何创造它？”人们就会被动员起来，专注于更具变革性的改变。[^12]
  关注问题是局限性的；关注可能性则是解放性的。


  以 Smile Spokane 为例，这是一个由十多个组织组成的行动网络，由 Arcora 基金会支持，致力于改善华盛顿州斯波坎县的口腔健康。如果网络参与者专注于“问题”，他们肯定会认识到斯波坎县三年级学生中有十分之六经历过蛀牙。研究表明，口腔健康状况不佳还有其他显著影响，远远超出口腔本身——例如，口腔健康状况不佳的儿童缺课的可能性是其他儿童的近三倍，成绩较低的可能性是其四倍。[^13]


  因此，对问题的关注可能会将网络的目标表述为“减少斯波坎县所有居民的蛀牙”。结果，这




  可能导致网络主要专注于增加学校牙齿密封剂项目这一策略——鉴于其在减少蛀牙方面的有效性，这是一项值得追求的目标。然而，呈现的问题通常只是破碎系统最可见的症状。更有可能的是，存在更深层次的根本原因，包括潜在的系统性不平等，正在维持现状。专注于问题可能会导致网络错过创造影响力的更高杠杆机会。


  相反，Smile Spokane 阐明了其对未来的愿景：“通过改善所有人的口腔健康，创造一个更健康的 Spokane。”14 凭借这一面向未来的目的，网络确定了影响根本问题的策略，包括增加弱势群体获得口腔健康护理的机会、将口腔健康护理整合到初级护理中，以及提供护理导航员，将口腔健康护理与行为健康和物质使用障碍相关的其他服务联系起来。这些策略中的每一种都旨在创造一种新的护理系统，以便从长远来看持续为居民带来更好的结果。


  当然，采取前瞻性的方法并不意味着放弃当下的议题。它只意味着这些紧迫的问题可以在你想要创造的更大未来的背景下被看到。即使在推进长期变革的同时，Smile Spokane
  也正在努力扩大短期内迫切需要的学校密封剂项目。在网络启动之前，城市中只有一个基于学校的密封剂项目，仅服务于一小部分人口。今天，由于通过网络培养的合作伙伴关系，密封剂项目已在几乎
  100% 拥有多数低收入学生的学校中开展。15


  ## 设想未来


  设想你想要实现的现实是关于梦想、分享你希望看到的东西的声音表达（通过对话、艺术和其他方式），以及共同创造一个未来的形象。共同设想未来能激发能量和创造力，帮助网络明确其目的。


  Resonance Network 提供了如何利用引人注目的愿景将人们聚集在一起并为未来的工作规划方向的示例。Resonance Network 源自 NoVo
  基金会的为期十年的 Move to End Violence 项目，已发展成为一个不断壮大的致力于建设一个没有暴力的世界的人群的集合。


  在网络发展的初始阶段，领导者们认识到需要对他们想要创造的世界有一个清晰的图景。“为了生活在这些时代并融入其中，需要一种全新的存在方式，”他们写道。“创造新解决方案和可能性的艺术始于我们知道我们想要如何生活。”16


  在一个为明确网络目的而召开的早期会议上，三十位领导者在波士顿聚集了三天，房间里充满了艺术作品、翻页纸和便利贴。在他们共度的时光里，他们探讨了一个深刻的问题，由政治战略家和禅宗僧侣
  Norma Wong 提出：“在一个根植于相互依存、归属以及与他人和地球和谐共处的世界里，你对我们想要的一百年后的这个世界有何愿景？”为了从多个角度探讨这个问题，他们还提出了后续问题，例如“我们如何获取食物？”“我们与水的关系是什么？”“孩子们如何学习？”“我们如何让人们安全？”“孩子们如何出生？”以及“人们如何死亡？”


  参与者开始感知他们希望看到的未来。他们开始构思，在翻页纸上作画，在彼此的愿景基础上构建，并突出共同的主题。随后，引导者向小组提问：“好吧，如果那是你在一百年后看到的，我们必须在五十年内处于什么位置才能实现这一百年愿景？”经过更多构思时间后，参与者被要求考虑一个缩短的时间范围：“为了实现这一五十年愿景，我们必须在二十五年内处于什么位置？”


  随着每一步的推进，参与者被挑战将他们的愿景一步步拉近到当下，确定可能在长期产生变革性影响的潜在策略。逆向工作，人们被问到：“我们必须在两年内处于什么位置？”最后，“我们现在必须处于什么位置？”


  “起初，人们对愿景的宏大以及我们将愿景写在纸上的大胆感到不知所措，”网络联合主任 Alexis Flanagan 回忆道。“然后人们变得充满活力。他们看到了我们现在需要做什么才能开始实现这一切。”17
  会议结束时，参与者退后一步，审视他们所做的工作。网络存在的理由变得清晰：通过建立一个根植于深厚关系、充满活力的社区以及与我们星球的联系的世界，来转变暴力的根源。


  ## 制定集体目的


  Santa Cruz Mountains Stewardship Network 的形成提供了一个关于一群不同利益相关者如何定义集体目的的示例。当十多个组织最初聚集在一起，思考如何更有效地合作时，关于网络为何成立存在重大疑问。人们担心存在隐藏议程，没有单一议题能引起每个人的兴趣，而参会的组织有着截然不同的短期优先事项。


  在成员能够就其集体目的达成一致之前，他们首先需要明确“管理”一词的含义。定义关键术语是新网络常见的早期任务——只有在就管理意味着什么达成一致后，参与者才能开始使其付诸行动。


  他们还需要对系统形成共同理解：影响该地区管理的历史和现实因素。他们完成了历史分析，通过情景规划审视外部趋势和力量，并确定希望和担忧。


  通过多次丰富的讨论，参与者开始找到共同点。大多数人同意，有效的管理需要多方面、马赛克式的方法。他们认识到开发和气候变化带来的威胁。而且几乎每个人都同意，加强联系和协作关系将有利于他们的工作和该地区。虽然人们对如何最有效地管理土地存在很多分歧，但人们对为什么有效管理很重要也有很多共识。


  最终，参与者准备好制定和完善他们的集体目的。作为引导者，我们要求他们通过完成短语“我们如何……”来阐述网络的目的。我们随后根据他们分享的内容提供了一个初步版本，供他们完善。我们发现，让大群体改进一份草案声明，比让他们从零开始构建一份声明更容易。


  参与者在小组中辩论草案并提出改进建议。与其进行小组文字润色练习——这很少是时间的有效利用——一支志愿者团队同意在休息期间根据网络的反馈完善声明。当天晚些时候，该团队分享了他们提出的宗旨：“培育一个充满韧性、充满活力的地区，让人类和自然系统世代繁荣。”使用第十章中概述的基于同意的决策过程，所有参与者都同意正式采纳该句子作为网络的目的，并理解如果必要，网络可以在未来任何时候重新审视它。在接下来的六个月里，这一目的演变成一份更完整的网络章程，其中包含原则、参与协议和高层级优先事项，该章程在网络第三次会议上由网络的二十一位成员批准（网络章程将在本章后面更详细地解释）。18


  ## 定义共同原则


  价值观是网络认为重要的基本信念，而原则则是相应的指导决策和行动的准则。原则使价值观具体化。因此，原则是对网络所代表的内容以及它将在世界中如何展现的最终表述。当集体创建时，它们提供了一个强大的基石，使参与者能够要求自己和彼此对其言行负责，以共同推进网络的目的。拥有明确的原则意味着“随着条件的改变，存在对什么重要的共同理解，有一种方式可以回到共同的实践和行为”，*Emergent
  Strategy* 的作者 adrienne maree brown 写道。19


  当我与同事和合作伙伴一起帮助启动 LISTEN 网络（代表 Leaders in Science and Technology Engagement Networks，科学与技术参与网络领导者）时，我们在第一年花费了大量时间与来自数十个不同网络、全国性组织和科学学会的代表互动，以定义一个目的和一套原则，这些将反映他们对未来的共同愿景。目的“培育所有人与科学之间的关系”已为网络提供了一个引人注目的焦点来围绕其展开，而其原则在指导对话方面至关重要




  and actions. 例如，网络的五项原则之一规定参与者相互承诺“尊重社区的优先事项”。²⁰ 正如你可能想象的那样，对于一个历史上优先事项一直由主要机构决定的领域来说，这是一个巨大的转变。LISTEN
  的目的和原则在其网络章程中有所体现，该章程是一份正式但不具有法律约束力的文件，由每位参与者共同商定。


  根据网络唯一协调员 Erica Kimmerling 的说法，将明确的原则写入章程给了她“突破边界并让网络对其认为重要的事情负责”的许可。当乔治·弗洛伊德被谋杀引发了关于反黑人种族主义的全国性对话时，Kimmerling
  回顾了章程以及他们承认“除非我们明确指出并挑战排斥的系统性结构……我们的工作将强化它们”。在这种情况下，她能够召集网络讨论科学参与中的系统性种族主义问题。因为网络已经完成了界定其原则的艰难工作，Kimmerling
  能够提出一个需要进一步工作的领域。²¹


  可以通过多种方法来明确网络的原则并就其达成共识。对于现有网络，以下方法效果很好。²² 首先，分享并深入倾听“你何时看到或经历过我们的网络发挥最佳状态”的故事。然后进行对话，找出从故事中浮现的主题，并尝试命名几项核心价值观及其相关原则。也许
  *学习* 作为共同价值观脱颖而出。你随后会问：“你在哪里听到与 *学习* 相关的实践和行为？” 回答可能包括，例如，“倾听以理解多种观点，愿意尝试，或在条件变化时迅速适应。”
  通过这一过程，你可以基于参与者的亲身经历提炼出网络的原则。如果网络刚刚形成，可以使用修改后的流程，将讲故事的提示重新表述为“你何时经历或看到一个协作努力非常成功”。


  ## 在章程中记录协议


  章程标志着网络对其存在原因和协作方式进行初步探索的 culmination。它们有助于建立网络演进的基础。章程还提供了一个定位工具，成员在考虑前进方向时、在向网络吸纳新成员时，以及在向新受众介绍网络时都可以参考。


  当然，纸上的文字远不如导致章程形成的对话重要。尽管如此，见证参与者彼此的承诺通常是一个令人兴奋和鼓舞人心的时刻。而且或许更重要地，通过签署章程或其他实践方式做出公开承诺，在很大程度上有助于让人们承担责任。²³


  由于网络不断变化和发展，任何章程都应被视为一份活文档，详细程度足以记录网络的初始协议并指导其当前方向，但也足够灵活以便随着网络的演变而适应。就像网络的目的应不时重新审视一样，章程也应如此。


  章程通常包括网络成立的背景、网络的目的和原则，以及参与者情况的高层次概述。章程还可能包括网络的优先事项或重点领域。额外的运营协议可以记录在相应的文件中，包括治理和决策流程、运营结构以及参与协议（有关建立参与协议的更多信息，请参阅第
  10 章）。访问 Converge Network Toolkit 以获取包含章节标题、示例内容和制定章程提示的网络章程模板。


  ## 演进的目的和原则


  目的和原则往往随着人们分享加入的原因、他们关心的事情以及他们希望发生的事情而随时间演进。明确目的和原则是一个积极的、迭代的过程。就像管弦乐队在每次演出前集体调音一样，定期重新审视目的和原则以确保其仍然产生共鸣是良好的做法。当
  RE-AMP Network 在启动多年后这样做时，产生了重大修订。


  RE-AMP Network 成立于 2004 年，当时 Garfield Foundation 召集了一群倡导者和资助者，以推动中西部清洁能源倡议。在进行分析以确定潜在行动领域后，很明显，即使他们在推动该地区清洁能源方面取得巨大进展，结果也远不能达到从根本上改变系统所需的程度。因此，他们将重点扩大到以多种方式减少温室气体污染，包括推动清洁能源和能源效率、关闭燃煤电厂以及限制碳排放。


  早期，RE-AMP 取得了极大的成功，在多个州通过了节能政策，并阻止了此前被视为不可避免的燃煤电厂建设。这些成功导致网络迅速发展。但在第五至七年，即 2008
  年至 2010 年间，该工作遇到了障碍。金融危机摧毁了当地经济，该地区新一波政治家阻碍了网络的政策工作，最终 RE-AMP 的一些最大资助者决定终止支持。Garfield
  Foundation 协作网络项目主任 Ruth Rominger 回忆道：“此时网络开始思考，‘下一步是什么？’” “因此，重新审视 RE-AMP 的原始分析和目的是一个合乎逻辑的时机。”24


  增长期吸引了看到 RE-AMP 工作方式价值的新人。这些成员坚定地认为，如果不解决允许污染滋生的种族主义、殖民主义和资本主义结构，就无法应对气候变化。他们还明确表示，如果不挑战关于谁有权做出决定的范式，就不可能取得进一步进展。这个群体逐渐壮大并稳步获得影响力。


  随着时间的推移，网络的成员和领导层发生了演变。新领导层最终认识到需要更新网络的系统性分析，并且这次要认识到气候变化在其核心是社会和政治问题的症状，而不仅仅是技术问题。


  这一认识促成了一次组织者称之为“公平深度脱碳峰会”的会议。这次峰会聚集了 RE-AMP 有史以来似乎最多样化的群体，前网络工作人员 Jessica Conrad
  反思道，“它从根本上改变了一些人对网络宗旨的认识”。25


  在峰会上，活动人士探讨了将以服务最受影响社区需求为中心作为承诺，如何能改变网络对其工作的理解。网络战略总监 Gail Francis 说：“这是一个谦卑的伟大时刻，这在系统变革工作中非常重要。”
  “许多人意识到他们有多少东西需要学习。”26 经过这些讨论后，网络开始制定一套原则，为公平脱碳在实践中是什么样提供基准，并确立将公平脱碳分析纳入网络推动的每项行动的意图。27


  Francis 说：“当我们把东西从墙上撕下来，结束峰会时，我记得对同事说，‘RE-AMP 再也不会回到过去的样子了。’” “这是一个分水岭时刻，挑战了我们许多默认的关于如何应对气候危机的思维方式。”
  一年之内，网络正式修订了其宗旨为“到 2050 年公平地消除中西部温室气体排放”。


  如果没有合适的人在场，这些对话就不可能实现。只有通过纳入更多元化的倡导者群体，RE-AMP 才能以最有利于整个系统的方式演进。只有通过精心设计和熟练的引导而共同召集，网络才能作为一个整体进行所需的对话。没有合适的人，网络就一无所有，而集会则是创造集体转型的时刻。





  '
- '## 第六章


  ## 召集人们


  > 世界并不是一次改变一个人而改变的。它随着人们之间关系的网络形成而改变，当人们发现他们拥有共同的事业和对可能性的共同愿景时。


  > ——玛格丽特·惠特利和黛博拉·弗里兹，《利用涌现将社会创新扩展》


  召集人们意味着召集推进网络目的所需的人。人们常常因为被网络的宗旨所激励而加入网络，但他们之所以留下，是因为参与其中的人是谁。一个网络中是谁，可能与网络为何存在一样重要，甚至更为重要。


  ## 邀请共同创造


  当你在影响网络中召集人们时，你就是邀请他们参与共同创造——参与集体探索网络是什么以及它可以成为什么。网络不属于任何人；它们由每个人共享。无论是资深成员还是新成员，都可以自由自组织，以符合其原则的方式推进网络的宗旨。随着新人的贡献，新的可能性就会涌现。


  网络的宗旨和原则可能在新成员到来之前就由初始团体明确定义。这可能非常有帮助——它让人们感受到网络是否是他们愿意贡献的，以及它在成长过程中行动保持连贯。随后，随着新成员加入对话，宗旨和原则很可能会被完善。


  召集人们并不意味着邀请他们加入“你的东西”；它意味着邀请他们共同创造在他们成为团体一部分之后可能实现的事情。每个加入影响网络的人都有机会，也有责任为其发展做出贡献。


  ## 确定召集谁


  邀请谁加入影响网络取决于其宗旨、背景、时机和范围。在考虑要接触谁时，我们往往“出于很多错误的原因——义务、内疚、代表……甚至爱”，adrienne maree
  brown 指出。相反，应召集那些


  - 直接受到该问题影响的人，

  - 在该问题上开展引人注目的工作的人，以及

  - 能推动工作向前发展的人。¹


  从一开始就优先召集多样化的参与者，而不是在努力已经定义之后再进行。谁最先被邀请加入网络，很可能会显著影响最终群体的构成，因为团体成立时存在的社会结构很可能随着时间的推移而保留下来。²
  这可能需要寻找具有不同背景、学科、思维方式和经历的人。一个由系统各部分不同人员组成的设计团队可以在为新网络启动制定周密的遴选流程或邀请名单方面发挥核心作用。


  否则，如果多样性未被优先考虑，以关系为中心的系统很容易变成排他性社区，正如《Nonprofit AF》博客的热门作者 Vu Le 所写，人们自然倾向于只与那些外表、思维和行为与自己相似的人建立联系。“边缘化的人和社区并没有同等的获取关系的机会：关系并非公平分配。”³
  因此，网络领导者——尤其是催化者——可以采取的重要一步，以避免复制不平等模式，就是从一开始就以受问题影响的人为中心，以及那些通常被排除在网络之外的人。这并不意味着“让他们参与”，而是倾听并追随*他们*的领导。因为有些人在充分参与方面面临更多障碍（如时间、金钱、距离、能力以及育儿责任），因此还必须做出有意的努力来确保可及性。


  如果你的网络已经启动，还不算太晚。Food Solutions New England（FSNE）采取的包容性做法就是一个很好的例子。FSNE 是一个行动网络，致力于在六个州范围内打造一个更公平、更有韧性的区域粮食系统。网络最初成立后不久，参与者意识到种族是该地区粮食相关差异的显著预测因素。⁴
  他们还意识到，其主要由白人组成的成员构成并未反映其工作所影响社区的多样性。


  为纠正这一问题，网络任命了一组参与者——并为他们提供津贴——以与新合作伙伴建立有意义的联系。他们自称为“网络大使”，在让代表性不足的社区参与网络方面发挥了关键作用，包括有色人种社区、年轻人以及食品链工人。与此同时，网络还为更多种族多样化的领导创造了空间，并改善了社区努力与网络区域工作之间的协调。


  ## 决定召集多少人


  影响网络的规模因其宗旨、背景和类型而大相径庭。有些人可能认为越大越好——因为人越多，连接就越多，也就意味着影响潜力越大。事实上，“网络效应”告诉我们，随着更多人连接到网络，网络变得更有价值。⁵
  但这一现象只在一定程度上成立。人类和生物网络（比如我们大脑中的神经元网络）尤其被证明存在“断点”，超过该点后网络效应不再成立。这是进一步增长不再有益，网络开始修剪过程、缩小直到达到平衡点的时刻——即该时期的理想规模。最终，正如《Breakpoint》一书的作者
  Jeff Stibel 所证明的那样，网络连接的质量远比其规模重要。⁶


  虽然规模在某些学习网络中不是太大限制，但我们的经验表明，大多数新行动网络启动时应从十二到二十四名参与者开始。我们发现，大多数团体能够进行一次最多约二十四人的对话，尽管这需要周密的设计、精心规划的房间布置和熟练的引导。其他领域专家也持相同观点：“12
  人足够大，可以提供多样化的意见，也足够大，可以容纳一定的神秘感和趣味性，以及建设性的陌生感，”Priya Parker 在《The Art of Gathering》中写道。⁷
  与此同时，adrienne maree brown 使用的指导原则是，有意义的全员对话所需的时间约为每人五分钟。⁸ 鉴于普通人一次只能集中注意力约 90 到 120
  分钟，然后眼睛就会完全呆滞，⁹ 二十四人每人五分钟正好达到上限。


  起初规模较小有助于形成一个更容易就网络形成的关键问题进行审议的团体规模，同时为每个人贡献提供足够的空间。然后，随着网络成形并获得动力，如果需要，它可以变得大得多。RE-AMP
  Network 由十五个组织启动，包括一个基金会，此后已发展到超过 140 个组织，其中包括近二十四个基金会。100Kin10 起初有二十八个合作组织，现在已超过三百个。另一方面，如果网络已经产生你所寻求的影响，可能就不需要变得更大。¹⁰
  Santa Cruz Mountains Stewardship Network 起初有十九个组织，六年内仅增加了少数成员——即使其影响力仍在不断扩大。


  这并不是说一开始就无法以较大团体启动，但这样做时要认识到会有权衡：人越多，建立信任关系所需的时间就越长。这涉及到参与与节奏的动态张力。在某些情况下，推进网络的宗旨必然需要接触大量的人




  人们，以及因此相关的挑战是值得承担的。然而，网络如果增长过度，可能会失去亲密感，并需要太多资源来维持。“如果包容是聚会的宗旨和身份，那么开放的边界是可以的，甚至可能是必要的，”帕克写道。“但具有许多其他、完全值得称赞目的的聚会可能会因过度包容而受损。”如果你不确定该如何进行，不妨问自己：“这个网络首先是为谁服务的？”¹¹


  ## 设计有意义的聚会


  影响力网络为人们相互连接创造了许多不同的方式。沟通平台为参与者提供空间进行对话、分享活动和机会、提出请求并保持彼此更新。网络领导者（尤其是编织者）通过直接引荐和为对话设定背景，将人们联系起来。以及一系列面对面和在线活动为人们围绕共同兴趣进行互动提供了空间，例如网络电话和网络研讨会、实地考察、学习之旅、围绕对话主题组织的餐会、专业发展机会以及同伴协助。网络领导者始终在寻找促进连接和加速信息流动的机会。


  尽管如此，在培育影响力网络方面，无论是线上还是线下，聚会都是不可替代的。聚会将所有参与者聚集在一起，同时建立关系、相互学习并为未来做出决策。它们是里程碑式的时刻，可以推动网络向前发展，既作为紧密的社区，也作为创造变革的载体。具体而言，聚会承担四个主要功能：


  **聚会将整个系统聚集在一起。** 它们为参与者创造了独特的机遇，让他们认识到自己工作的相互关联性。当人们听到彼此对某个问题的不同观点时，他们开始对*整个*系统产生更深入的理解。这种对大局的认识会永久性地改变人们对待工作的态度。


  **聚会为关系提供空间。** 它们让人们聚在一起认识尚未了解的人，并加深与之前已认识的人之间的信任。很容易被日常责任占据而忘记花时间建立关系，即使在概念上很明显关系是工作的核心。聚会鼓励人们远离电子邮件收件箱，转而专注于与他人建立联系，不仅仅是作为组织代表，更是作为人类个体。


  **聚会推动学习和行动。** 它们为参与者提供了分享近期工作所学经验并为未来的工作做计划的机会。聚会之间的间隔（通常为四到六个月，最多一年）可能为实施项目或在现实世界中测试想法提供了足够的时间。学习成果随后可以在下一次聚会上分享——计划也可在此时修订。这种规划与迭代的循环使网络能够整合行动的既定策略和涌现策略。


  **聚会创造能量。** 它们在网络形成过程中保持势头。想象网络是一颗在手指上旋转的篮球。旋转时间越长而没有能量补充，它就越开始失去重心并有倾倒的风险。我们经常看到聚会举行后参与者之间的沟通出现激增。随着时间推移，距离上一次人们在同一房间（虚拟或面对面）相聚的时间越远，这种活跃程度会逐渐消退。聚会让球保持旋转。


  聚会的节奏和形式因网络类型而异。我们发现，学习型网络平均每年聚会一到两次，而行动型网络平均每年聚会一到四次。有些网络可能永远只在线上聚会——由于距离、成本和可及性——而另一些则主要面对面聚会。无论具体的节奏或形式如何，有效的网络聚会在其整体方法上往往相当相似。下面是我们从集体经验中总结出的关于线上和线下领导网络聚会的关键经验。


  ## 设计聚会的关键考量


  引导往往获得成功聚会的大部分功劳；引导者在其角色中如此显眼，以至于难以被遗忘。但我们坚信，设计——包括议程和结构——对聚会最终的成功负有更大的责任。尽管每个聚会都应根据网络的具体背景进行定制，但我们在每个设计中都遵循了一些关键经验：


  - 优先考虑关系

  - 拥抱小团体的魔力

  - 聚焦框架性问题

  - 培育更深层次的体验

  - 融入空间感

  - 为网络注入能量


  ### 优先考虑关系


  许多人认为，除非会议产生有形成果和未来计划，否则就不值得召开。但进展远不止定义策略和明确下一步。 在影响力网络的世界里，建立关系就是工作本身。


  前进的动力来自于人们与不常交流的人进行不常进行的对话。它发生在人们了解彼此差异更多并找到共同点的地方。它也发生在参与者培养归属感的时候。


  太多会议的设计主要围绕内容展开。但任何聚会中最宝贵的资源都是出席的人。人们同时聚在一起的难得机会，往往被浪费在那些本可以录制并在线播放的演讲上。


  我们建议远离“讲台上的智者”模式，即所谓的专家是唯一发言者，其他人被动倾听。认识到房间里的每个人都是某种方面的专家。每个人都有贡献。利用群体的智慧，创造人们定期相互互动、相互学习并找到支持彼此工作方式的空间。


  ### 拥抱小团体的魔力


  要让人们充分参与，他们需要处于足够小的团体中，以便能够同时看到彼此并互动。小团体作为实践场所具有独特的强大力量；它们充当分形，是整体的微观世界。正如彼得·布洛克所写，“小团体是转化的单元，也是归属感体验的容器。”¹²


  小团体让每个人都有机会发言并被听见，同时也让他们热身，使他们之后在全体组中发言更容易。作为一般指导原则，将全体组视为框架和总结的场所，并利用小团体深入探讨内容和讨论。


  ### 聚焦框架性问题


  与网络本身一样，聚会设计应提供恰到好处的结构，不多也不少。把握好框架性问题是这一等式的关键。正确的问题有助于团体将注意力集中在最重要的事情上。否则，对话可能会在各组之间广泛分散，导致聚会缺乏凝聚力。我们在设计中花费与其它任何事情一样多的时间来精心打造深思熟虑的框架性问题。


  最好的问题直击核心。它们邀请人们基于自身经验带出自己的意义。它们具有一种棱角，能在人们给出回应时产生可感知的能量。设计中最重要的部分往往是把问题提对、按正确顺序排列，然后为每个问题配上合适的团体规模和时间以使其发挥作用。


  我们最喜欢的技术之一是让人们围绕一系列框架性问题在快速的配对或小团体中轮换。在会议开始时，“你为什么认为这项工作重要？”和“你对我们今天的时间有什么期望？”等问题有助于为未来的工作设定背景。在会议结束时，“你在本次聚会中学到了什么重要内容？”和“我们今后绝对必须牢记的一件事是什么？”等问题提供了收尾




  to the gathering. Visit the Converge Network Toolkit to access a list of our favorite
  Framing Questions for Small Group Conversations.


  ## Create Deeper Experiences


  Most professional meetings tend to be action oriented, and the social norms of professionalism
  usually mean that people are expected to leave emotion at the door. This lack of
  personal intimacy is a huge impediment to building trust. In order to create deeper
  connections, we need to disrupt these norms and create experiences that feel markedly
  different from typical meetings. When we invite people into a space that feels distinct
  from their usual professional contexts, it completely changes what’s possible. New
  topics are broached, broadening the scope of what can be discussed. Emotion is unleashed,
  creating *energy in motion*. Displays of openness yield greater levels of trust.


  Create a different experience by inviting people to share a personal story or meaningful
  moment in their lives. Incorporate rituals—elements that are repeated at each convening—to
  bring groups together into a deeper space at a certain moment of every gathering.
  Use art, humor, and creative room setups to create a sense that this is *different*.


  With a bit of nudging, people will move beyond the kind of surface-level interactions
  they’re used to in professional spaces, opening the door for deeper connections
  (specific practices for developing deeper connections are discussed in the next
  chapter). Once participants engage on a more personal level, their relationships
  will never be the same.


  ## Incorporate Space


  Because convenings are relatively rare events, there’s usually a lot to get to.
  As a designer you may feel pressure to fit everything in. The hardest part about
  designing agendas is in deciding not what to include, but rather what to exclude.


  Oversaturating an agenda with activity after activity is a common mistake. When
  agendas are overplanned, with activities filling every second of the day, they stifle
  the possibility for new ideas and conversations to organically emerge. As you plan
  out your convening, keep the following considerations in mind:


  **First, things will almost always take longer than you expect.** The more people
  there are, the longer things will take. Introductions will run long, conversations
  will run long, and breaks will most certainly run long. If they don’t, that’s great!
  You’ve found yourself a few extra minutes. But to be safe, assume that nearly every
  part of the agenda will require more time than you initially imagined, and plan
  accordingly.


  **Second, conversations need space to breathe.** Space for conflict, space for tension,
  space for people to introduce new perspectives. Create enough space so that every
  person who wants to speak their mind can do so, especially the introverts and people
  who are usually on the margins of conversations. Rushing a conversation to stay
  on time is an easy way to shut down creative of “fight, flight, or freeze.” These
  are the moments of truth in networks, the times when groups can either fall back
  into what’s comfortable or sit in the tension long enough to acknowledge unspoken
  realities and address critical issues.


  ## Invite Divergence


  Network facilitators invite divergent perspectives, rather than avoid them. This
  is what enables participants to think creatively together, even when they disagree.
  When addressing an important issue, people may make statements so emotionally charged
  that they risk being isolated or labeled by others. At that moment, facilitators
  may feel the urge to move past the dissenting input and get back to the task at
  hand. What happens next can change the course of the network’s culture.


  As a facilitator, instead of avoiding the disruption, turn to that person with your
  full attention and ask them to elaborate. Then, check to see if others feel similarly.
  If nobody does, you still need to validate that person’s perspective. It doesn’t
  matter if you agree or disagree with their opinion; what matters is making the room
  a safe place for different perspectives to be shared and honored. We learned this
  practice from Marvin Weisbord and Sandra Janoff, creators of the Future Search process,
  and it’s served us more than a few times. By validating that person’s perspective,
  you make them feel heard, which allows the person to relax and rejoin the flow of
  the conversation.


  Then, consider inviting people to share their own perspectives. This opens the space
  for people to offer contrasting opinions in a way that is respectful. These moments
  can dramatically shift the way in which participants interact with one another by
  creating a sense of psychological safety and appreciation for diverse points of
  view.


  If you become stuck when something is going on in the room and you’re not sure what
  to do, put your faith in small groups or pairs. Quickly break the participants into
  groups of two to four, and ask them to discuss what’s happening in the room and
  what they think needs to happen next. Reflections can then be shared in the full
  group, which may give you a clue





  至于如何进行（当你迅速重新设计议程时，这可能是休息的好时机！）。这是彼得·布洛克最喜欢的策略之一。“这样做，”他写道，“我们要求社区为这次聚会的成功承担责任，并对他们的善意表达信心，即使他们对正在发生的事情感到沮丧……这样做是对关键智慧存在于社区之中的承认。”¹⁷


  ## 有意识地保持涌现


  没有哪个议程能在与现实接触后幸存下来。作为网络引导者，你必须随时准备随机应变，感知能量所在以及下一步需要发生什么。同时，网络引导也不应松散到让对话支离破碎。这是一种微妙的平衡：既要对涌现保持开放，又要审慎地结束对话以推动事情向前发展。


  在*《参与式决策引导指南》*中，山姆·卡纳指出，对话中的群体通常需要先经历一个产生发散性和创造性想法的过程，然后才能收敛并到达决策点。¹⁸ 作为引导者，我们给予群体空间去感知这些对话的脉络，并赋予他们从一个对话转换到另一个对话的自主权。但在转向新话题之前，我们会检查第一个对话是否能够被清晰地结束——而这可能仅仅意味着明确一个下一步。如果一个对话无法结束，我们让群体承认他们是有意转移讨论焦点的。


  ## 以谦逊引导


  引导者的角色本身就带有权力。引导者通常对议程有最终决定权，他们编排对话的流程，并能影响谁何时发言。引导的行为本身就是行使权力的行为。网络引导者审慎地运用这种权力，使聚会尽可能热情、公平，并对共同领导开放。


  作为引导者，首先要审视自身的特权和隐含偏见，并承认这一角色所带来的权力。然后，邀请参与者在发现有机会让空间更具包容性时提供坦诚的反馈。如果你来自主导文化群体，那么在会议设计阶段以及会议进行期间实时考虑其他文化框架尤为重要。否则，你可能会无意中强化主导群体的规范，从而疏远甚至伤害网络中的某些成员。


  当引导者过于被动时，他们就没有履行这一角色的一些关键责任。普里亚·帕克写道：“远非消除聚会中的权力，”被动会造成一种权力真空，他人可能会“以与你的聚会目的不符的方式”填补这一真空。¹⁹
  相反，我们建议实践帕克所称的“慷慨的权威”：自信地主持会议，同时保持谦逊，拥有你所被托付的权力，并将这种权力用于服务他人和整个网络。与其利用凌驾于他人之上的权力来压制他人或控制对话，不如强调与他人的权力、群体间的权力和内部的权力，以增强整个群体的共同领导力，并引导会议走向肯定生命的成果。


  ## 关注权力动态


  很多时候，权力以不健康的方式被行使。当结构将权力集中在少数人手中时，例如在等级制度中，个体往往会寻求对他人的权力，以此重新获得自主权并避免被支配。这种零和结构让人们相互对立，将能量困在权力斗争之中，并排除了协同作用的可能性。


  影响力网络改变了这种对权力的理解，以促进公平并激发合作。在健康的网络中，权力不会被用来凌驾于他人之上或对抗他人，以强迫做出决定或获得优越地位。相反，权力被用来与他人协同、在彼此之间流动，以支持他人并追求共同目标。权力也可以从内部获取，使参与者感到能够以完整的自我去表达、行动和呈现。


  在影响力网络中，没有人拥有支配他人行动的正式权力，也没有人必须被授权才能展现领导力。但这并不意味着公平已得到保障。权力动态在任何群体中都固有存在。例如，一些组织会比其他组织获得更多资金，一些人会比其他人拥有更多关系，一些参与者会比其他人有更多时间和资源可以贡献。此外，网络的社会规范可能更有利于来自主导文化群体的人，而不是来自社会动态完全不同社区的人。人们也可能对所使用的主导语言感到不同程度的适应，以及面临影响他们参与的身体挑战等等。


  对所有网络领导者，尤其是引导者的要求是，要理解社会压迫和不平等在网络中存在，并有意识地努力在群体内部增强权力。辛迪·苏亚雷斯在*《权力手册》*中断言：“摆脱支配性权力关系并掌握权力动态，或许是所有领域寻求在世界上引发积极变革的变革推动者最基本的技能。”^20


  网络领导者可以利用自身的权力来确保网络的决策过程中促进更大的公平，并为来自代表性不足或边缘化社区的人们创造参与和领导的空间。即使公平仍然是一个持续进行的工作——一个可能永远无法完美实现的目标——网络也可以优先考虑在参与者之间公平分配利益和负担。社会变革互动研究所的辛西娅·席尔瓦·帕克、凯利·贝茨和柯蒂斯·奥格登写道：“权力不是一块有限的馅饼。相反，它可以是无限的、可扩展的，并可在人们和领导者之间共享。”^21


  以下是基于帕克、贝茨和奥格登的工作，关于关注网络中权力动态的一些建议。^22


  - **在网络发展之初共同制定群体协议。** 与群体共同承担监督协议并定期更新的责任（群体协议将在下一章详细描述）。

  - **确保各种形式的可及性，包括视觉、听觉、语言、身体和技术方面。** 确保每个人都拥有贡献所需的信息、资源和空间。

  - **将资助者作为参与者而非主办方或设计者纳入。** 在具有显著组织动态的聚会中，你也可以尝试从名牌上去掉所属机构信息。人们以后总能弄清楚彼此的工作。让他们首先作为个体建立联系。

  - **将关于权力的讨论和承认常态化。** 权力存在于所有群体中，无论你是否谈论它，回避这个问题会制造信任障碍。在网络中公开承认权力动态，并共同思考权力问题可能出现的方式以及网络将如何解决它们。

  - **注意是否某些人总是第一个发言。** 如果其他人感到有表达的冲动，邀请他们发言。在休息期间，与发言最多的人交流，鼓励他们为他人留出空间；也要与最安静的人交流，看看是否有他们想分享但尚未能分享的内容，或者作为引导者你是否可以做一些事情来支持他们。

  - **在网络聚会中安排多名引导者，以便更好地观察现场并注意到群体的模式和能量。** 同样，指定一个特定的人负责记录，以便主要引导者能够将全部注意力集中在房间内的人身上。

  - **承认自己的错误。** 作为引导者，当你出现失误时，尽快纠正。展现你对反馈的开放态度有助于为所有人营造安全的空间。


  凭借精心的设计和良好的引导，聚会会创造出一种服务于共同目标的团结感。它们注入新的能量，激发自组织。从聚会中产生对整个系统的更深刻认识、对他人所做工作的全新欣赏，以及未来几个月的行动计划。最重要的是，聚会创造了连接并加深了信任。网络的力量取决于将它们编织在一起的连接，而信任关系正是使网络所有其他优点成为可能的基础。





  ## Movement Network


  FIGURE 3.4. The basic structure of a movement network, featuring multiple impact
  networks that are connected together through a core network to build relationships,
  share information, coordinate actions, and catalyze systemic change.


  ## Core Activities of Impact Networks


  Impact networks are driven by a common set of activities. While the why (the purpose)
  and the what (the actions) of networks differ widely, the how (the major activities
  involved in forming them) is remarkably consistent.

  The work of cultivating and sustaining impact networks involves five core activities.
  For ease of reference, they are referred to as the “Five Cs”:


  - Clarify purpose and principles

  - Convene the people

  - Cultivate trust

  - Coordinate actions

  - Collaborate for systems change


  While learning networks focus primarily on the first four activities (from clarify
  purpose and principles through coordinate actions), action and movement networks
  incorporate all five (including collaborate for systems change).


  These five activities are dynamic and interdependent. Never fully complete and not
  strictly linear, they loop back and forth on each other as the network evolves,
  and they will be revisited over and over throughout a network’s life cycle. While
  it is impossible to know exactly what is going to happen until people start talking
  together, the purpose of the Five Cs is to outline the aspects of the network cultivation
  process that can be intentionally designed and facilitated.


  An overview of each activity follows. In part 2 of this book, each activity is explained
  in depth, with practical exercises you can use to put the whole framework into practice.


  ## I. Clarify Purpose and Principles


  The network’s purpose is an articulation of its reason for being, the point of alignment
  that brings disparate parts of a system together. Purpose inspires people to join
  and contribute their time and energy. Clarifying a common purpose is an essential
  early step in an impact network’s formation. Due to their self-organizing nature,
  impact networks cannot be *controlled*. They can, however, be *oriented* toward
  a shared purpose. This is how they stay coherent even as they grow. Purpose is “the
  invisible leader,” writes Samantha Slade, author of *Going Horizontal*.³


  When relationships deepen to a point of mutual confidence, where two people feel
  they can count on each other to act in service to the purpose—even if they might
  disagree—we call that *trust*. Trust is the fundamental element that establishes
  a culture of openness, commitment, and collaboration.


  Importantly, trust should not be confused with liking or agreement. To work together,
  people do not need to like each other. And they certainly do not need to agree with
  each other on every issue. When I talk about trust here, I mean trust *for impact*.
  This is the type of trusting relationship that allows people to hold the tension
  through disagreement and conflict, find common ground, and work together to achieve
  mutual goals.


  Although it is widely accepted that trusting relationships are beneficial when it
  comes to collaboration, the common assumption is that trust is a by-product of other
  activities and that it takes a long time to develop. Rather than deliberately building
  trust, the norm is to focus on getting to action and letting relationships develop
  naturally over time. However, we have consistently found that trust is the single
  most important factor behind successful impact networks; networks move at the speed
  of trust.[^4]


  Therefore, trust should be deliberately nurtured from the outset of a network’s
  development. [Chapter 7](#) is focused on how to cultivate relationships of trust.


  ## IV. Coordinate Actions


  If networks are as strong as the connections that hold them together, connections
  are only as valuable as what’s moving *through* them. Connections are not just about
  relationships; they are also about flows—of information, knowledge, and resources.
  To truly grasp what’s happening in a network, it’s just as important (if not more
  important) to understand what’s flowing across the network, from node to node, as
  it is to understand how those nodes are connected.


  When flows are accelerated across networks, new opportunities arise for data, expertise,
  and capacity to be distributed quickly to where they’re needed most. As a result,
  people are better able to coordinate their efforts.


  Specific practices for accelerating flows and coordinating actions are detailed
  in [chapter 8](#).


  ## V. Collaborate for Systems Change


  Increasing connections and flows across networks creates many positive benefits.
  But if the goal is to spark more substantial collaboration and create system-wide
  change, the network will need to dive deeper into an exploration of possible leverage
  points. These are places in a system where, as Donella Meadows put it, “a small
  shift in one thing can produce big changes in everything.”⁵ Then, networks can take
  action on opportunities where people and organizations can have greater impact by
  working together than is possible alone.


  When identifying opportunities to create change, it’s necessary to first make sense
  of what’s happening in the system from many different perspectives. People and organizations
  are usually focused on a particular piece of the puzzle, and for good reason—each
  piece is important, and it takes focus to develop deep expertise and experience
  on a particular issue. But if they continue to work in isolation, they will be limited
  in their understanding of the whole.


  The puzzle metaphor exemplifies three conditions that make a network approach so
  valuable:


  - **Local knowledge:** People are engaged with different parts of the system, with
  expertise in their piece of the puzzle.

  - **Separation:** People are disconnected and unable or unwilling to share knowledge
  and resources with one another.

  - **Complexity:** The system is more complex than anyone can grasp on their own.
  Only by bringing the pieces together can groups make sense of the whole puzzle.


  Without seeing the whole system, we have little chance of creating the systemic
  changes we wish to see in the world. Meaningfully addressing complex issues thus
  requires bringing people together who collectively hold


  the pieces needed to engage the issue from many angles at once. We can then begin
  to recognize the bigger picture and make decisions that benefit the whole system,
  not just one part of it. [Chapter 9](#) offers potential pathways that networks
  can take to make sense of complex systems and create systemic change.


  ## Cultivating the Conditions for Networks to Thrive


  How does one help guide a network through each of the Five Cs? To answer this question,
  it’s helpful to think of networks as like a garden. Unlike machines, which can be
  built to exact specifications, gardens cannot be forced to grow in a certain way.
  No two gardens are exactly the same, because every plant grows in relationship with
  its neighbors, soil, and climate. It’s also not possible to grow a garden overnight:
  it takes time for the plants to develop, no matter how much attention you give them.


  You can, however, cultivate a garden, providing the nutrients, water, and sunlight
  that plants need to grow and thrive. You can tend to the garden, providing pollinators,
  using fertilizer, and pulling weeds, adapting your focus to attend to whatever the
  garden needs most in that moment. You can provide some structure in the form of
  stakes or trellises to give plants support as they grow.


  Like gardens, impact networks are living systems—they have a life of their own.
  This is precisely why we think of *cultivating* networks as opposed to *building*
  them. *Cultivate*, an agricultural term, means “to nurture and help grow.”[^6] It
  implies that you’re creating the right conditions for something to emerge and flourish,
  just as you would cultivate the land so that crops could grow, rather than building
  a structure, brick-by-brick, based on a predetermined blueprint.


  The individuals who support networks to grow—the gardeners, in this metaphor—are
  network leaders. Individual leaders who steward the development of impact networks
  with humility and care are an indispensable aspect of what makes networks thrive.
  Those who take on the responsibility of leading a network need to be prepared to
  put in months or even years of work before their efforts consistently bear fruit.
  While network leaders may notice and nurture early learnings and collaborations,






  我们可能无法知道一个网络是一个对话还是距离一次非凡的“登月计划”尚有多远。然而，如果眼前的挑战值得投入，接下来的章节将帮助你通过实验的方式去引领和培育具有影响力的网络。


- '# 影响网络：建立联系、激发协作并催化系统性变革


  *献给 Nabetse，她教会了我连接的真实含义；*

  *献给我的家人，他们向我展示了信任的力量；*

  *以及献给世界各地的变革者，他们*

  *对使命的承诺激励着我。*


  ## **在社区中创造**


  这本书是我与 Converge 的同事们合作开发的——Converge 是一个由系统战略家、设计师、引导者、教育者和评估者组成的网络，他们与个人、组织和网络合作，共同创造积极的影响力。我无限感激他们的贡献和支持。


  请访问 [converge.net](http://converge.net) 了解更多关于 Converge 的信息，并获取与本书相关的免费工具库和引导指南。


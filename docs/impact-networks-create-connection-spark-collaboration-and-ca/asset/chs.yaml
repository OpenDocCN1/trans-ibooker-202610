- '# **前言**


  无论你是否意识到，网络无处不在。网络影响着你与谁建立联系、你的信息获取渠道以及工作完成的方式。如果我告诉你，通过学习如何培育和维持某些网络，你将有机会解锁协作、解开压迫性系统并创造前所未有的价值，你会怎么想？如果我告诉你，你可以创建一个可持续的组织结构，这种结构减少了推力的需求，引入了更多的拉力和自主流动，你会怎么想？当你开始通过网络视角来观察和参与世界时，新的机遇、洞察和视角便会随之而来。


  网络自古以来就存在。但直到最近，我们才能够利用多个领域——包括网络科学、社区建设、系统思维和组织发展——以及一系列协作软件工具，有意识地创建网络，不仅用于社会连接，还用于集体行动。网络不仅是我们自然形成的有机社会结构；它们可以被培育，以加速学习、激发协作并催化系统性变革。


  网络是连接人或事物关系网。当它们旨在解决社会和环境问题时，被称为影响力网络。这种特殊类型的网络基于共同目的，将个人和组织聚集在一起进行学习和协调行动。影响力网络提供了一种变革性的合作方式，跨越那些常常阻碍我们的典型界限。它们为更公平、相互依存的世界提供了协作基础设施。作为一个强大且灵活的组织系统，能够跨越地区、组织和各种孤岛，影响力网络支撑着全球一些最引人注目和大规模的变革努力。


  本书探讨如何培育影响力网络，使不同群体能够在组织内部和跨组织之间建立连接、协调和协作，从而共同完成单凭自身无法实现的工作。鉴于我们社会及所面临问题的日益复杂性，我们通过网络形成、成长和工作能力比以往任何时候都更加至关重要。


  •••


  这本书是为所有认识到比以往任何时候都更需要协作的人而写的，为那些正在解决任何个人或组织都无法独自解决的重大问题的人而写的，以及为那些寻找方法与多样化的利益相关者协作以应对我们时代棘手挑战的变革者而写的。


  这本书也适合任何对协作网络感兴趣、参与或领导此类网络的人，包括那些协调、编织和引导网络的人；那些资助和支持网络的人；以及所有与他人协作以完成任务的人。协作网络可能被称为许多种名称：协会、联盟、联合、协作、集体影响力倡议、联合体等。无论它们叫什么，网络协作方法与许多层级组织中看到的命令与控制方法有着根本的不同。同样，引导网络所需的领导形式也与世界上仍然普遍存在的专制领导形式有很大不同。如果你正在支持或与一组参与者合作以解决复杂问题并推进共同目标，那么这本书就是为你写的。


  我写这本书是因为我坚信影响力网络的力量，它有助于创造一个适合所有人发展的未来。网络方法在隔阂之间架起桥梁，优先基于信任的关系，分享领导力，并承认我们生活和工作中的固有相互联系。网络是让当今社会运作的组织系统，也能使我们未来蓬勃发展。


  我第一次接触到网络的潜力是在 Monitor Institute 工作时，这是一家全球管理咨询公司的社会部门分支。在此之前，我只在层级环境中工作过：在服务




  industry, in a nonprofit, in a large corporation, and with a small start-up. Every
  organization where I had worked had a pyramid structure—there was always a boss
  and a clear chain of command to indicate authority. Decisions were mostly made at
  the top and passed down to employees. Information was shared on a need-to-know basis.
  But Monitor Institute was, at that time, exploring and writing about working through
  networks.


  There, I was introduced to *Building Smart Communities through Network Weaving*,
  by Valdis Krebs and June Holley, a white paper about how we can strengthen our communities
  by recognizing and cultivating the networks of connections that underlie them. I
  also read the handbook *Net Gains*, by Peter Plastrik and Madeleine Taylor, an early
  resource for network builders seeking social change. I was moved by case studies
  written by my Monitor Institute colleagues on the work of the RE-AMP Network, a
  massive collaboration of more than one hundred organizations working to reduce greenhouse
  gas emissions across the midwestern United States;¹ by Lawrence CommunityWorks,
  a citywide network that engages thousands of residents to improve their community;
  and by KABOOM!, a nonprofit that uses a network approach to mobilize low-income
  communities to build their own playgrounds.²


  The initiatives documented in these resources brought people together from across
  sectors to tackle common challenges. They spanned organizational boundaries. Rather
  than building bigger and bigger organizations, leaders increased their impact through
  networks of peers. I saw how these network-based approaches wielded collaboration
  to create outsized impacts, and I was blown away. Inspired by these examples, I
  left Monitor Institute to work with networks exclusively. Since then, I have spent
  nearly every working day over the past decade focused on learning and practicing
  the art and science of cultivating collaborative networks.


  My first real foray into the field of networks was in Fresno, California, where
  I worked for three years as a coordinator for the Fresno New Leadership Network.
  Funded by the James Irvine Foundation, this initiative brought together more than
  forty leaders from across sectors to work together in new ways to help revitalize
  their community. It was there that I first witnessed the power of networks to connect
  people across boundaries on behalf of a common purpose. Environmental activists
  found common ground with developers. The school superintendent worked side by side
  with nonprofit leaders. A partnership between leaders representing Habitat for Humanity
  and Kaiser Permanente led to a $400,000 grant to build a neighborhood playground
  in West Fresno—an area of the city with particularly high rates of poverty and childhood
  obesity. The county librarian teamed up with a Spanish-language radio host and the
  Fresno State business school to offer free citizenship academies in county libraries.
  A youth group joined forces with both a gang-prevention organization and the school
  district’s office of community and family services to advance discipline and restorative
  justice reforms.


  I also witnessed the true power of relationships. Built on a foundation of trust,
  the network changed the way people engaged with one another. Two advocates, one
  promoting charter schools and the other supporting public schools, came into the
  network seeing each other as the opposition. But after taking time to hear one another’s
  motivations, they began to have more honest and open conversations about their vision
  for Fresno. “We now have a willingness to talk about where we disagree, and a willingness
  to talk about how to do this better,” said the charter school advocate. “We’re creating
  a new way of relating and working with each other.”³


  Since my time in Fresno, I have had the privilege of working with dozens of other
  impact networks in a variety of roles, including coordination, weaving, design,
  facilitation, evaluation, and everything in between. Along the way, I catalyzed
  the Converge network with my close friend David Sawyer, a former Monitor Institute
  colleague and longtime change leader. We partnered in Fresno and together felt a
  deep calling to spread the network approach more broadly. Converge has since grown
  into a network of systems strategists, designers, facilitators, educators, and evaluators
  who work together to support networks around the globe to create social and environmental
  impact. To put it succinctly, we are a network of practitioners who help cultivate
  impact networks. When I use the we pronoun in this book, I am often referring to
  the combined perspectives of Converge.


  Our work has spanned rural to urban and local to global, bringing together diverse
  stakeholders from government agencies, nonprofits, businesses, academic institutions,
  community groups, and more. We have been fortunate to partner with more than fifty
  different impact networks in the past ten years, and through these experiences we
  started to notice consistent patterns among networks, even when their context and
  focus varied widely. While the *whys* and *whats* were unique to each network, the
  *hows*—the principles and processes used to create them—were quite consistent. These
  approaches to network cultivation and leadership became the basis for this book.


  At the same time, the content of this book comes not only from my own experiences
  or those of Converge, but also from the experiences of thinkers and changemakers
  in many different fields. I have learned so much working alongside network leaders
  and participating in numerous gatherings of practitioners. Here, I have drawn from
  case studies; the wisdom of many books, including those listed in the bibliography;
  and resources that other groups have developed, including NetworkWeaver, Interaction
  Institute for Social Change, Monitor Institute, Change Elemental, CoCreative, and
  many more. I also owe a huge debt of gratitude to all the network leaders, participants,
  and funders that I interviewed and have consulted with in the formation of this
  book. I am grateful for everyone who has contributed to this growing field and shared
  their wisdom openly with a generosity of spirit.


  In the pages ahead, I share what I have learned from a place of curiosity and commitment.
  I feel a great sense of humility in how much I have learned through researching
  this book. As someone from a dominant cultural background, a white male born in
  the United States, no doubt I have many blind spots when it comes to assuming power
  and asserting particular ways of knowing. I have shared a draft version of this
  book with many people I respect to help reveal those areas, and I suspect there
  are likely many more to uncover. As you read this book, I invite your feedback,
  with gratitude.


  My greatest hope is that the concepts, stories, quotes, and resources contained
  here will support you and your work to create positive impact through networks.
  This book aims to illuminate the intricacies of how we can be more effective together
  amid the immense complexity of our world. Thank you for picking up this text and
  investigating its contents. May you find it valuable in ways large and small.

  '
- "## Introduction\n\n> *The only lasting truth is Change.*\n> \n> —OCTAVIA E. BUTLER,\
  \ *Parable of the Sower*\n\nWe live on an amazingly rare and beautiful planet spinning\
  \ around a midsize sun on the outer arm of a spiral galaxy in a boundless universe.\
  \ Our vast, living world is incredibly complex.\n\nAcross the globe, we face extraordinary\
  \ challenges: climate change; lack of affordable shelter; food insecurity; racism;\
  \ sexism; social inequities; large-scale displacement, migration, and resettlement;\
  \ biodiversity loss, habitat degradation, and animal abuse; continuing violence;\
  \ and declining mental health. Just to name a few.\n\nNot only are these challenges\
  \ complex; they are systemic and structural. They are constantly changing and evolving.\
  \ A variety of actors, organizations, and institutions are involved, each bringing\
  \ their own motivations, priorities, and entrenched thinking and practices. These\
  \ issues are so tangled up, so nonlinear and volatile, that they have no obvious\
  \ answers or straightforward solutions.\n\nYet, despite these challenges, I believe\
  \ we also live in a time of unparalleled possibility for change. Mass social movements\
  \ are arising all over the planet, systems of oppression are becoming exposed, and\
  \ our collective capacity for sharing information and knowledge is at an all-time\
  \ high. Even though in some ways it seems we have never been more divided, it also\
  \ has never been more possible for individuals and organizations to work together\
  \ across boundaries and create change.\n\n\n\n\n\n“变化即将到来，无论你喜欢与否，”气候行动主义者格蕾塔·通贝里警告道。$^1$\
  \ 巨大的不确定性在于，世界的另一面将会是什么样子。\n\n## 我们的复杂世界\n\n思考多维度、系统性问题（无论是应对气候变化、社区健康还是无家可归问题）的一种方式是：它们不仅仅是**复杂的**——它们是**错综复杂的（*complex*）**。Cynefin框架有助于区分简单、复杂、错综复杂（*complex*）和混乱的问题：$^2$\n\
  \n**简单问题**可以有明确的解决方案，有清晰的起点和终点，例如做一顿饭。\n\n**复杂问题**涉及许多活动的部分，但它们可以被定义和理解。它们是技术性的，具有可预测的解决方案，可以由具备相应专业知识的人有效实施。$^3$\
  \ 为活动策划和实施后勤运营是复杂的，但不是错综复杂的。\n\n**错综复杂（*complex*）的问题**很难定义，因为它们没有明确的起点或终点。它们也没有显而易见的解决方案，我们无法准确预测前方的道路。因此，我们必须能够适应不断变化的环境，并随着我们了解什么有效和什么无效来修改策略。一个错综复杂的挑战的例子是在一个大区域公平地消除温室气体排放。我们将在后面回到这个问题。\n\
  \n**混乱的问题**，与其错综复杂的同类一样，无法被准确预测或控制。它们也是动荡的、危险的且快速演变的。混乱的情况——例如人道主义灾难——通常需要我们迅速行动，以挽救生命或处理紧急情况，然后再努力建立某种秩序。它们要求快速响应，将信息和资源分配到最需要的地方，然后再解决根本问题。\n\
  \n在相当大程度上，人类已经掌握了简单问题，组织和机构通过其高效和可靠的结构在解决复杂问题方面表现出色。然而，在这个“复杂世纪”中，$^{3,4}$ 我们用来解决简单和复杂问题的方法在处理错综复杂（和混乱）的问题时正在力不从心。让我们走到今天的方法，并不能把我们带到我们需要去的地方。因此，“需要一种新的思维方式”。\n\
  \n*为了应对我们时代的挑战，我们必须接受复杂性，并在不同利益相关者的系统中协作工作，即使尤其是在前进道路不明确的时候。* 说文明和地球的未来取决于此，并不为过。\n\
  \n大多数人喜欢协作的*理念* . . . 只要它承诺能完全按照他们想要的方式行事。但这并不是协作的工作方式。协作（如我们所讨论的）不是强迫或胁迫。它要求你放弃控制。而且，因为它不是预先确定的，它要求你放弃确定性。\n\
  \n与他人合作迫使我们让假设受到挑战，耐心受到考验。它常常导致关于正确做法的个人和专业分歧。它可能需要跨越哲学分歧建立联盟。它推动我们对模糊性感到自在。它不仅可能涉及与个人合作，还涉及与其组织和机构合作，这些组织和机构有自己的利益需要保护，还有层级结构需要管理。\n\
  \n在我们这个复杂的时代，我们需要跨越传统界限的合作方式。我们需要灵活到能在瞬间转变的协作结构，需要足够坚韧以抵御动荡和破坏的结构，需要让人以平等身份聚在一起共享领导和决策的结构。\n\
  \n幸运的是，无论我们是否意识到，我们已经发展出了一种协调许多不同利益相关群体行动的方法。从这本书的标题，你可能已经猜到了它们是什么。网络！\n\n## 为复杂性而组织\n\
  \n人类总是形成网络。我们的社交网络每次我们互相介绍朋友、搬到新城市或围绕共同的一组信念聚集时都会增长。社交网络塑造了历史的进程。历史学家尼尔·弗格森（Niall\
  \ Ferguson）指出，历史上许多最大的变化都是由网络催化的——部分原因是网络已被证明比等级制度更具创造性和适应性。⁶\n\n弗格森接着声称：“问题在于网络不容易被引导向共同的目标.\
  \ . . . 网络可能是自发具有创造力的，但它们不是战略性的。”⁷ 这是我们所不同意的地方。虽然网络本身不是战略性的，但它们可以被*设计*得具有战略性。\n\n\
  当有意识地培养时，网络可以跨越鸿沟建立联系，传播信息和知识，并激发协作行动。因此，它们可以“以没有任何单一组织能够做到的方式处理广泛的问题，努力寻求能够规模化的创新解决方案，”Monitor\
  \ Institute by Deloitte的Anna Muoio和Kaitlin Terry Canver写道。⁸ 网络可以成为创造变革的有力载体。\n\n\
  当然，网络既有积极也有消极的影响。经济不平等以及社会阶层、种族、族裔、性别和个人身份其他方面的优势和劣势，在很大程度上是网络效应的结果：某些类型的人形成的纽带增加了他们的社会资本，通常是以其他群体巨大的社会代价为代价的。世界许多地方已经敏锐地意识到社交媒体和互联网带来的有害网络效应。包括在线回音室的泛滥，这些回音室喂给人们他们想听的东西，即使这意味着迅速传播错误信息。\n\
  \n在我们全球互联和相互依存的社会中，我们必须了解影响我们生活的网络动态，以便我们能够创建新的网络来促进一个更具韧性和公平的世界。我们面前的选择很明确：要么我们可以让网络根据现有的社会、政治和经济模式形成，这很可能让我们面临更多的同等不平等和破坏性行为，要么我们可以\n\
  \n有意识地在战略上催化新的网络，以*转变*我们生活和工作的系统。\n\n一个典型的例子是RE-AMP网络，这是一个由140多个组织和基金会组成的集合，跨部门工作，旨在到2050年公平地消除九个中西部州的温室气体排放。自2015年成立以来，RE-AMP帮助退役了150多座燃煤电厂，实施了严格的可再生能源和交通标准，并重新拨款超过2500万美元以支持中西部地区的战略气候行动。RE-AMP的工作部分是必要的，因为其他强大的网络也在发挥作用，以维持现状或丰富从污染和不平等中获利的力量。\n\
  \n我们可以从教育领域寻找另一个网络创造重大影响的例子。100Kin10是一项大规模的协作努力，正在将300多家学术机构、非营利组织、基金会、企业和政府机构联系起来，在十年内培训和美国各地的十万名科学、技术、工程和数学（STEM）教师。100Kin10成立于2011年，正顺利实现其雄心勃勃的目标，并扩展其目标以应对STEM教育中更长期的系统性挑战。\n\
  \nJustice in Motion Defender Network是一个由墨西哥、危地马拉、洪都拉斯、萨尔瓦多和尼加拉瓜的人权捍卫者和组织组成的集合，它们联合起来帮助移民快速在边境获得法律援助。在特朗普政府期间美国移民政策造成的持续家庭分离危机中，该网络在定位被驱逐至中美洲偏远地区的父母并协调与其子女团聚方面至关重要。\n\
  \n或者考虑一个影响遍及全球的网络，清洁电子产品生产网络（CEPN）。CEPN将世界顶级技术供应商和品牌与劳工和环保倡导者、政府和其他领先专家联系起来，以推动消除电子产品生产中工人接触有毒化学物质的风险。自2016年成立网络以来，已确定共同承诺，开发了减少工人\n\
  \n\n\n接触有毒化学品，并规范了化学品使用数据的收集流程。\n\n像RE-AMP、100Kin10、捍卫者网络（Defender Network）和CEPN这样的网络——以及你将在本书中了解到的许多其他网络——并非自发或偶然形成；相反，它们是在明确的意图下建立的。这些网络有意将人们和组织连接起来，以促进围绕共同关注议题的学习和行动。我们称它们为*影响力网络*，以强调其有意的设计和明确的目标，并与我们社交生活中自然形成的有机网络形成对比。9\n\
  \n我们认为影响力网络是活跃社区与健康组织的结合体。它们以关系为核心，但同时又有结构；既富有创造力，又具有战略性。影响力网络建立在社区的生命力之上——共同原则、韧性、自组织和信任——同时利用有效组织的优势，包括共同目标、运营支柱和行动倾向。通过这种独特的品质融合，影响力网络增加了信息流动，减少了浪费，并在整个系统中统一战略——同时释放了在不同规模上运作的多个行动者的能量。\n\
  \n在世界各地，人们正在培育影响力网络，以应对医疗保健、教育、科学、技术、环境、经济正义、艺术、人权等领域中的复杂问题。它们标志着人类在组织方式上迈向有意义的变革的下一轮演进。\n\
  \n## 在接下来的篇章中\n\n本书深入探讨了影响力网络是什么、它们如何运作，以及培育和维持它们需要什么。本书适合从头到尾阅读，因为其中的概念和引用是相互衔接的。话虽如此，如果你对某一部分特别感兴趣，也可以随意跳读；大多数情况下，每个部分都相对独立成篇。\n\
  \n在阅读过程中，你会看到各种免费工具和资源的引用，这些资源可以帮助你的网络成长，以**粗体**标示并附有此处显示的符号。你可以在Converge网络工具包中找到所有这些内容及更多资源，该工具包位于[converge.net](https://converge.net)。在那里，你将找到免费工具和引导指南的库、本书所含网络地图的彩色版本、学习体验的邀请，以及与其他网络领导者联系和分享的机会。\n\
  \n以下是接下来各章节内容的简要概述：**第1部分**“通过网络开展工作”概述了网络是什么以及它们如何运作。**第1章**“变革之网”介绍了影响力网络的不同形式，并探讨了两个案例研究，说明网络如何随着时间发展并扩大其影响力。**第2章**“网络思维”定义了网络方法的核心原则、网络与层级结构如何既不同又相互关联，以及通过网络开展工作如何改变我们对领导和战略的思考方式。**第3章**“让网络发挥作用”进一步详细阐述了影响力网络的主要形式，并用图表解释了它们是如何构建的。它还总结了培育影响力网络的过程，概述了在**第2部分**中详细展开的五项核心活动。**第4章**“网络领导力”描述了四种网络领导角色以及网络领导力的四项基本原则：促进自组织、推动涌现、拥抱变化和保持动态张力。\n\
  \n**第2部分**“培育影响力网络”深入探讨了影响力网络的五项核心活动，为网络领导者提供了实用指南。**第5章**“明确目标与原则”描述了如何催化一个新的影响力网络、找到共同目标，并定义指导网络发展的共同原则。**第6章**“召集人员”探讨了应该把哪些人聚集在一起，并为设计和促进变革性的网络聚会提供了关键考量。**第7章**“培育信任”提供了编织联系、加深信任和进行勇敢对话的实践方法。**第8章**“协调行动”包含了加速信息在网络中流动、实践互惠以及应对危机时刻的策略。**第9章**“为系统变革而协作”描述了理解系统和识别高潜力行动领域的实践方法。它还提出了催化系统性变革的路径，包括转变社会规范和推动运动。第10章“赋能基础设施”以实用的建议作为全书正文的结尾，涉及如何构建影响力网络、如何制定参与协议、如何集体决策、如何嵌入评估以生成关键学习成果来指导网络发展，以及如何为网络提供资源，包括网络资助者的关键实践。\n"
- '## 第一部分


  ## 通过网络开展工作

  '
- "## 第1章\n\n## 变革之网\n\n> > *我们陷入了一个无法逃避的相互依存之网，*  \n> > *被束缚在命运的单一件外衣之中。*  \n> >\
  \ *任何直接影响他人的事物，都会间接影响所有人。*\n> >\n> > ——马丁·路德·金，《伯明翰监狱来信》\n\n网络无处不在，但它们常常隐藏于众目睽睽之下。在最基本的层面上，网络是关系的网状结构。有生物网络，如我们大脑中的神经网络；技术网络，如高速公路系统和电网；以及人类网络，如社交网络和专业网络。正如弗里特约夫·卡普拉所说，网络是“生命统一的基本模式”。¹\n\
  \n构成我们组织、社会和地球系统基础的网络，对这些系统最终的健康和有效性有着巨大的影响。将树木和真菌连接在一起的广泛网络就是一个典型例子。在森林地表之下，菌丝体（真菌的营养部分，由称为菌丝的网状线体组成）为土壤中不同生命形式之间的交流和资源共享提供了途径。森林中的树木和真菌存在共生关系——树木需要真菌能够接触到而树木本身无法获得的养分，而真菌需要树木提供的碳。菌丝体连接在一起，构成了所谓的*菌根网络*。正如森林生态学家苏珊娜·西马德所说，这些网络提供了“地下超级高速公路”，将树木连接在一个巨大的资源共享社区中。²\
  \ 阳光充足的树木与需要碳的正在生长的树木分享碳，而养分则传递给受到入侵物种或疾病损害的树木。\n\n自人类出现以来，我们也一直以网络的形式组织起来——为了保护、相互支持和分享资源。一个人可能同时与许多不同的网络相连接，例如家庭网络、朋友网络、专业网络、学校网络、社区网络、宗教网络和在线社交网络。网络可以是松散和无结构的，就像大多数社交网络那样；也可以是为了实现特定功能和推进特定目标而形成的，就像影响力网络那样。正如引言中所述，影响力网络是一种特殊类型的网络，它将个人和组织连接起来，以推进共同目标下的学习和行动。社交网络往往随着人们因邻近或共同兴趣而彼此连接而自然形成，而影响力网络则需要更高程度的有意性来推动其发展。\n\
  \n影响力网络有三种主要形式：学习网络、行动网络和运动网络。每种形式最适合特定的功能。\n\n**学习网络**专注于连接*和*学习。它们旨在促进信息或知识的流动，以推进在特定议题上的集体学习。\n\
  \n**行动网络**专注于连接、学习*和*行动。它们旨在促进连接和学习，以服务于协调行动。\n\n**运动网络**将许多其他学习网络和行动网络连接在一起，形成一个网络中的网络。虽然它们在核心上通常很像学习网络或行动网络，但运动网络还促进信息共享，并协调多个不同网络为共同目标采取行动。一些运动网络还帮助催化和支持新的影响力网络，这些新网络通常聚焦于特定地区或运动整体目标中较窄的方面。\n\
  \n学习网络、行动网络和运动网络都通过不同的方式被有意培育以创造影响力。没有哪种形式天生优于另一种，每种形式都可能因情境不同而最为合适。它们共同提供了一种变革性的方法来创造\n\
  \n\n\nconnection, sparking collaboration, and catalyzing systemic change. More details\
  \ on the structures and functions of each form can be found in [第三章](#)。\n\nImpact\
  \ networks provide value in many ways: they coordinate work among different actors\
  \ and across organizations and silos without being controlling or directive; they\
  \ are resilient to disruption, given their decentralized structures; they respond\
  \ to urgent opportunities at a moment’s notice; and they integrate diverse perspectives\
  \ to create new possibilities. By strengthening connection and collaboration across\
  \ divides, impact networks are an essential way of organizing to meet the complexity\
  \ of our world.\n\nThroughout the remainder of [第一章](#), we will explore two case\
  \ studies in detail to illuminate what impact networks are and why they matter.\
  \ Then, as you progress through the rest of part 1, you will discover the fundamentals\
  \ of what it takes to make impact networks thrive.\n\n## Networks for Impact\n\n\
  To illustrate how impact networks develop and create change over time, we look to\
  \ two examples: the Initiative for Multipurpose Prevention Technologies, a global\
  \ learning network focused on reproductive health; and the Santa Cruz Mountains\
  \ Stewardship Network, a cross-sector action network dedicated to protecting the\
  \ ecological and cultural heritage of a 500,000-acre region in California.\n\n##\
  \ A Global Learning Network to Advance Sexual and Reproductive Health\n\nThe Initiative\
  \ for Multipurpose Prevention Technologies (IMPT) brings together researchers, product\
  \ developers, funders, policy makers, and advocates to advance sexual and reproductive\
  \ health for women and girls worldwide through the development of multipurpose prevention\
  \ technologies, or MPTs. MPTs are an innovative class of combination products designed\
  \ to simultaneously prevent HIV, other sexually transmitted infections (STIs), and/or\
  \ pregnancy.\n\nPrior to the network’s formation, work on broad-spectrum sexual\
  \ and reproductive health was fragmented. To connect the field, the nonprofit organization\
  \ CAMI Health convened stakeholders working on HIV prevention, STI prevention, and\
  \ contraceptive development for the first time (convenings are gatherings that bring\
  \ all network members together simultaneously). The founding participants of the\
  \ IMPT realized that there was an opportunity to develop single products that could\
  \ address multiple risks concurrently by building upon decades of work in these\
  \ traditionally siloed but interlinked areas.\n\nAt the time, “MPTs were a budding\
  \ idea gaining some conversational interest, particularly in the microbicide and\
  \ family planning fields,” says Bethany Young Holt, executive director and founder\
  \ of CAMI Health. “But there was no organizing body poised to move MPTs from a concept\
  \ to a reality.” As a result of the 2009 convening, the IMPT network was launched\
  \ to help facilitate the progress of the MPT field.³\n\nAs a learning network, the\
  \ IMPT focuses primarily on connecting participants and accelerating the flow of\
  \ information in, out, and across the network to facilitate learning. The network\
  \ gathers relevant information in from participants and a variety of external sources,\
  \ using a shared database to organize field-relevant data. It then organizes and\
  \ distributes that information back out to participants through a newsletter, publications,\
  \ webinars, social media, and network calls. It also enables the flow of information\
  \ across the network, directly from person to person, by organizing meetings, facilitating\
  \ conversations on specific topics, and maintaining an online communication system.\
  \ Through these multiple channels, researchers and advocates from around the world\
  \ are sharing critical research, learning from one another’s work, and coordinating\
  \ their efforts to advance the development of MPTs.\n\nThe IMPT grew through the\
  \ four stages illustrated in figures 1.1 through 1.4. These stages, first defined\
  \ by June Holley and Valdis Krebs in their seminal paper Building Smart Communities\
  \ Through Network Weaving, and re-created by Kumu, a data visualization platform\
  \ specializing in network mapping, represent how connections proliferate during\
  \ a network’s formation.⁴\n\nWhen systems are disconnected, they resemble Stage\
  \ 1, Scattered Fragments, shown in figure 1.1. In this stage, some people know and\
  \ interact with each other, but overall the whole system remains fragmented. People\
  \ are represented by nodes (also known as elements or actors), and the connections\
  \ between them are represented through links (also known as edges or ties). The\
  \ groups within which some connections do exist are called clusters (also known\
  \ as communities). Clusters are groups of people that are much more connected with\
  \ each other than they are with those from other parts of the system.\n\n![](img/4854536a9a7bcce4fd5250605cae8350_29_0.png)\n\
  \nFIGURE 1.1. Stage 1—Scattered Fragments\n\n![](img/4854536a9a7bcce4fd5250605cae8350_30_0.png)\n\
  \nFIGURE 1.2. Stage 2—Hub and Spoke\n\n![](img/4854536a9a7bcce4fd5250605cae8350_31_0.png)\n\
  \nFIGURE 1.3. Stage 3—Multi-Hub\n\n![](img/4854536a9a7bcce4fd5250605cae8350_32_0.png)\n\
  \n**FIGURE 1.4.** Stage 4—Core/Periphery\n\nClusters are an extremely common phenomenon\
  \ in networks, forming quite naturally as people gravitate toward those with whom\
  \ they share similarities. People in distinct clusters tend to be more like-minded,\
  \ have shared language, have similar conversations, and be located in the same region.\
  \ Network limitations arise when clusters remain separated without a bridge to connect\
  \ them. Bridges are essential links between two parts of a system that would otherwise\
  \ be disconnected (the people responsible for creating bridges have been called\
  \ *bridgers, boundary spanners,* and *brokers*).\n\nWithout a bridge to connect\
  \ clusters together, information fails to flow between them, creating echo chambers—spaces\
  \ where people merely reinforce each other’s beliefs. Locked in their echo chamber,\
  \ people remain closed off from hearing new perspectives and are unlikely to collaborate\
  \ with those from outside their bubble. Systems can overcome these issues by intentionally\
  \ forming a network to strengthen the connections between clusters. This involves\
  \ creating opportunities where people can come together to build relationships and\
  \ learn about each other’s work.\n\nIn the case of the IMPT, Holt was the catalyst\
  \ that brought participants together for the first time. When this happened, the\
  \ network entered Stage 2, Hub and Spoke, shown in figure 1.2, with Holt as the\
  \ central hub (hubs are highly connected nodes in a network). This was an improvement\
  \ from when the field was completely siloed into scattered fragments. But staying\
  \ at this stage too long has its shortcomings. The central hub becomes a gatekeeper\
  \ and often creates a bottleneck, slowing the rate at which information flows. When\
  \ connections are made only through a central hub, it limits the kind of spontaneous\
  \ collaboration that happens when people form direct, personal relationships with\
  \ one another.\n\nCritically, Holt did not try to hoard these relationships for\
  \ herself; instead, she saw her role as facilitating connections and communication\
  \ across the system.⁵ As relationships formed, the IMPT evolved into a Stage 3,\
  \ Multi-Hub network, shown in figure 1.3. Key actors from the MPT field were no\
  \ longer dependent on any single individual to stay connected. In our experience,\
  \ impact networks that do not evolve beyond the hub-and-spoke stage are significantly\
  \ limited in what they can accomplish. Reaching the multi-hub stage is a necessary\
  \ step toward unlocking the special qualities that make networks a powerful force\
  \ for change.\n\nOver time, the IMPT grew into a Stage 4, Core/Periphery network\
  \ as shown in figure 1.4. At this stage, there is a highly interconnected group\
  \ of participants in the network’s core, as well as a large and diverse periphery\
  \ that serves as a source of new ideas and new connections to other networks. Less-active\
  \ participants on the periphery may move into the network’s core over time as they\
  \ become more engaged in its activities. Today, more than two hundred active participants\
  \ make up the IMPT core, and more than two thousand individuals on the periphery\
  \ receive its communications.⁶\n\nNearly a decade after the network’s founding,\
  \ more than two dozen MPT products are in development, and MPTs have become widely\
  \ recognized as a new class of comprehensive prevention products in sexual and\n\
  \n\n生殖健康。通过首次连接系统各地的个人和组织，IMPT 使网络成员能够以过去从未可能的方式相互联系和学习。MPT 领域绝不可能在没有 CAMI Health\
  \ 的催化领导和 IMPT 网络的成长的情况下取得如此大的进展，或如此迅速的进展。\n\n## 一个跨部门行动网络来守护土地\n\n2014 年底，圣克鲁斯山脉地区主要土地所有者和土地管理组织的一群领导人意识到，尽管他们都致力于保护该地区\
  \ 50 万英亩的自然资源，但他们并未以足以让景观长期繁荣的规模开展合作。为提高区域协调，他们成立了圣克鲁斯山脉管理网络 Santa Cruz Mountains\
  \ Stewardship Network, SCMSN，并聘请 Converge 指导网络的发展、促进其首次聚会，并聘请并培训一名全职协调员，以支持网络的未来发展。\n\
  \n如今，SCMSN 是一个行动网络，连接了二十多个团体，包括政府机构、土地信托、非营利组织、研究机构、木材公司和一个美洲原住民部落。这些团体共同拥有或管理该地区大部分土地，他们围绕着共同的宗旨走到了一起，即帮助“培育一个充满韧性、充满活力的地区，让人类和自然系统世代繁荣”。⁷\n\
  \n作为一个行动网络，SCMSN 融合并发展了学习网络的特质，促进组织之间信息流动和知识共享。同时，它还支持成员之间相互协作，以影响整个地区的保护成果。例如，该网络推进了一个数百万美元的植被测绘项目，为土地管理者提供宝贵数据，帮助指导其管理工作。SCMSN\
  \ 引发的另一项协作努力，并由其所属的更大运动网络加州景观管理网络 California Landscape Stewardship Network 推进，已导致一项重大的“剪掉绿色胶带”倡议，极大地改善了全州生态修复项目的许可和资金效率。然而，在\
  \ SCMSN 能够以这种规模开始协作之前，参与者首先需要澄清他们共同持有的目的，并建立有意义的信任关系。\n\n建立信任关系的能力远非理所当然。在网络启动前夕，我们对参与者进行的初步访谈中了解到该地区的社会分裂和紧张历史。自\
  \ 1960 年代以来，环保主义者和以土地为生计的圣克鲁斯县居民一直陷入一种典型的冲突，争论如何照顾该地区的红杉森林。几十年来，环保团体和土地信托一直追求保护主义使命，限制该地区的木材采伐并“拯救红杉”。木材公司自二十世纪中叶以来一直使用可持续的择伐技术，反对这种保护主义做法。\n\
  \n土地信托与木材公司之间的冲突因圣克鲁斯山脉两侧社区的差异而进一步复杂化。东侧的圣克拉拉县是硅谷所在地，拥有经济实力和政治影响力。西侧的圣克鲁斯县，人们大多生活在农村环境中，有些人靠土地为生。该地区最大的土地信托主要位于圣克拉拉县，而木材公司及其员工则倾向于生活和工作在圣克鲁斯县。\n\
  \n与此同时，我们访谈的一些领导人表达了对问题权力动态的担忧，小型保护组织不断被资金充足的土地信托 overshadow。其他人则对彼此怀有数年的怨恨，因为他们觉得自己在之前的合作中没有得到公平对待。还有其他人担心网络会被劫持以服务于私人利益。\n\
  \n与其最初关注网络成员将一起做什么，这在缺乏信任的情况下会遇到严重阻碍，我们专注于澄清他们共同持有的愿景和原则。我们还专注于培养能够促进长期创造性思考和合作的关系。\n\
  \n在网络第一年举行的三次聚会中，参与者了解了彼此的价值观和动机，并辩论了良好管理的实践应如何体现。尽管观点不同，他们发现自己都热爱这片土地。他们分享了关于祖先的故事、他们如何来到圣克鲁斯山脉地区生活，以及他们如何首次爱上当地的树木、动物、河流和山脉的故事。他们设想了他们想要的区域未来，并澄清了团结他们组织的共同愿景。他们建立了新的关系，并加深了与已认识的人的联系。到第三次聚会结束时，参与者制定了一份共同章程，定义了网络的目的、他们对良好管理的集体理解，以及他们将协调努力的具体优先领域。制定章程是一个具有里程碑意义的时刻，但这也只是个开始。\n\
  \n网络继续发展，增加了新成员并激发了新的合作。两名成员，如《水星新闻 Mercury News》所描述的，“在许多问题上传统上并不一致”——当地环保组织半岛开放空间信托\
  \ Peninsula Open Space Trust 和一家家族经营的木材公司 Big Creek Lumber——合作保护了近一千英亩的红杉森林，这是近十年来最大规模的交易之一。⁸\
  \ 单独一项，Amah Mutsun 部落、加州州立公园和 San Mateo 资源保护区之间的合作正在努力恢复 Quiroste Valley 的生态活力。该努力在第\
  \ 7 章中有更详细的描述，由部落成员领导，他们采用祖先的管理实践，在过程中修复伤害并缓慢地与州机构建立信任。⁹\n\n虽然成果令人鼓舞，但最值得关注的是关系。关系是网络得以运作的核心。“我们害怕说关系和信任有多重要，”San\
  \ Mateo 资源保护区的执行主任 Kellyx Nelson 说，“但关系建设正是魔法的发生之处。关系引导我们去寻找‘可以’。”¹⁰\n\n## 关系：网络的核心\n\
  \n关系是影响网络取得一切成就的核心。从对网络和其他多利益相关方协作长达二十年的研究来看，加州大学伯克利分校哈斯商学院的 Jane Wei-Skillern 发现，“所有成功协作背后最重要的单一因素是参与者之间基于信任的关系。许多协作努力最终未能充分发挥潜力，因为它们缺乏坚实的\
  \ relational 基础。”¹¹\n\n虽然大量精力被投入到使任何系统的各个部分更有效，但人们常常忽视通过将系统联系在一起的关系网络来加强整个系统的机会。例如，基金会经常在单个组织上投入大量资源——并期望它们产生超大影响——却没有投资于协作基础设施，使多个组织能够以强大的方式结合其努力。一次又一次我们看到，个人和组织之间牢固的关系网络对于创造具有韧性、智能和创新性的系统至关重要。没有关系，有效的协作是不可能的。\n\
  \n为了更好地了解圣克鲁斯山脉地区存在的分裂程度，我们在网络首次聚会前进行了初步社会网络分析 Social Network Analysis, SNA，并在第二次聚会后六个月进行了第二次分析。在调查中，参与者被要求保密评估他们与网络中每个人的联系程度\
  \ 选项包括 0–无联系、1–熟人、2–关系、3–牢固关系。如图 1.5 所示，关系很少存在，尤其是在不同类型组织的领导者之间。节点代表组织领导人，链接表示两个人之间存在关系或牢固关系，相关色调代表特定组织类型，如政府机构、土地信托或研究机构\
  \ 为保护个人隐私，已删除具体识别信息。\n\n\n\n\n\n![](img/4854536a9a7bcce4fd5250605cae8350_38_0.png)\n\
  \n图1.5. 圣克鲁斯山脉管护网络首次召集前的网络图。每个节点代表参与网络的一个组织领导者，连线代表关系，节点的颜色深浅代表组织类型。该地图的彩色版本可在 converge.net\
  \ 上的 Converge Network Toolkit 中找到。\n\n我们将生成的地图分享给网络成员，以突出系统目前碎片化的状态。我们还利用这些数据，在原本没有关系的人们之间建立联系，并组织对话小组，让他们了解彼此的价值观、动机和工作。当我们进行第二次分析时，网络已经变得更加互联，不同类型组织之间的联系也更加多样化，如图1.6所示（我们建议影响力网络定期进行SNA，以帮助评估网络的成长，并揭示支持其发展的机会——更多关于社会网络分析的信息见第10章）。\n\
  \n![](img/4854536a9a7bcce4fd5250605cae8350_39_0.png)\n\n**图1.6.** 圣克鲁斯山脉管护网络启动六个月后的网络图。\n\
  \n回顾圣克鲁斯山脉管护网络的发展，网络协调员兼唯一全职员工迪伦·斯凯布鲁克（Dylan Skybrook）认为，关系是其成功的基础。斯凯布鲁克说，关系的力量最明显地体现在网络就争议话题展开对话、以及人们不遗余力地支持彼此工作的时候，但最重要的也许是，关系现在已经成为一种常态：“我认为人们甚至不再注意到他们彼此信任并建立了关系；事情本来就是这样的。每个人都在不断互动，寻找合作的方式。这在整个地区形成了一张无形的网，促进更好的土地管护。”¹²\n\
  \n正因为这些关系，整个系统现在才能协同运作。信息在组织、机构和政府机构之间自由共享。一位网络成员惊讶地表示，当他们对另一个组织的运作方式有意见时，现在可以“直接拿起电话沟通”。其他人则表示，新的关系拓展了他们的视野，使他们在臆测他人意图之前会先停下来思考。没有信任关系，网络的影响力是不可能实现的。\n"
- "## 第2章\n\n### 网络思维\n\n> 你无法通过对抗现有现实来改变事物。要改变某些东西，就建立一个让现有模式过时的新模式。\n> \n> ——巴克敏斯特·富勒，《富勒视野》\n\
  \n一旦你开始认识到构成我们世界的关系网络，你就再也回不去了。这就是我们所说的网络思维转变。采用网络思维，就是接受万物互联的现实——个人、组织和部门的行为会以深刻且往往出人意料的方式相互影响。最重要的是，网络思维的特点是“一种看待世界的方式，一种视角的转变……以关系性的眼光看待世界”，克里斯托弗·维塔莱在《网络学》中写道。¹\
  \ 实现这种思维转变，是通过网络进行思考、学习并创造变革的旅程中至关重要的一步。\n\n那些接受了网络思维的人，将自己视为更大活动网络的一部分——是系统中的众多节点之一，而不是中心枢纽。这样，网络思维转变也可以被描述为焦点从“我”到“我们”的演变，或者如奥托·夏默和凯特琳·考费尔在《从未来领导》中所说，从“自我系统意识”到“生态系统意识”的演变。²\
  \ 随着这种转变，领导者变得善于注意自己的努力与他人的关系，因此更容易发现合作的机会。他们不是试图扩大单个组织、建造一台越来越庞大高效的机器，而是寻求向外扩展，通过协作发展更强的联系来产生影响力。这种思考和工作方式对于我们有效应对复杂性至关重要。当各种资源——领导力、资金和人才——被跨系统地用于共同目标时，影响力的潜力会显著增加。\n\
  \n简·韦-斯基勒恩倡导的四项原则最简洁地概括了网络思维。³ 采用网络思维的领导者关注以下内容：\n\n- 扩大影响力，而不是壮大自己的组织或职能\n- 成为互联系统的一部分，而不是系统的中心\n\
  - 与同伴分享领导权和功劳，而不是囤积权力或试图成为英雄\n- 建立基于信任的关系，而不是控制体系\n\n当你拥抱网络思维时，你就不再孤立地工作。相反，你开始专注于培养联系、加强流动、共享资源，从而共同完成比单打独斗更多的事情。\n\
  \n### 层级思维\n\n当今世界占主导地位的组织框架是一种层级的、命令-控制模式，决策由少数领导者做出，然后传递给指挥链中较低层级的人。层级制被定义为“一种人或群体按地位或权力高低排列的系统或组织”⁴，它具有高效追求并实现特定、明确目标的非凡能力，例如生产商品和服务。在应对罗恩·海费茨所说的“技术性挑战”时，层级制最为有效——这类挑战的问题定义、解决方案和实施路径都很清晰。⁵\n\
  \n许多人偏爱层级制，因为它具有可预测性和稳定性——员工和领导者都知道自己可以期待什么，而且活动可以提前很好地预测。另一方面，层级结构在应对复杂而多面的问题时能力有限。网络是从内向外运作，想法和行动源于个体之间的对话；而层级结构则是自上而下运作，强大的领导者通过层层管理向下级发送指令和资源。面对复杂性时，这种结构就会变成瓶颈。\n\
  \n虽然层级结构通常被描绘成金字塔，如图2.1所示，但我们也可以把它看作一个刚性的枢纽-辐射网络，如图2.2所示。想象CEO是中心节点，连线代表他们与直接下属的关系，直接下属又连接到更下一级的直接下属，以此类推。每经过一个连接，你就离中心枢纽更远一步。\n\
  \n![](img/4854536a9a7bcce4fd5250605cae8350_43_0.png)\n\n**图2.1.** 层级结构，通常被描绘成金字塔。\n\
  \n![](img/4854536a9a7bcce4fd5250605cae8350_44_0.png)\n\n**图2.2.** 层级结构，以枢纽-辐射网络的形式绘制。\n\
  \n身处层级结构的顶端（或刚性枢纽-辐射网络的中心）有其好处——你拥有更多控制权，也更容易被人需要。但这也是有代价的。你控制得越多，人们就越难以自行组织推进工作。你越被人需要，当你不在了的时候系统就越缺乏韧性。你越是维持层级结构，就越会造成瓶颈，限制信息的自由流动。被人极度需要并掌握控制权是一把双刃剑。\n\
  \n这在很大程度上解释了为什么层级制难以迅速适应不断变化的环境。当组织结构被预先定义且缺乏灵活性时，集体发现、自发协作和意外创新的空间就很小。层级制擅长实现其设立之初要达成的特定目标，但并不适合解决那些没有显而易见解决方案的复杂问题。\n\
  \n由于这些原因，层级结构对于多利益相关方合作来说是一个糟糕的选择。通过紧握控制权，处于……\n\n\n\n顶层等级制度限制了系统其余部分的自我组织潜力。通过维持一种将某些人置于他人之上的僵化结构，等级制度造成了获取信息和权力的不平等，从而侵蚀信任。而在协作环境中，往往没有中央权威或共享的治理机构能够指导涉及的众多多元利益相关者群体。更糟糕的是，存在一个单一的指挥中心，其响应施加了过多的官僚主义，并且未能纳入应对复杂性所需的各种观点。\n\
  \n我们见过的最有效的协作努力都围绕着共同目的和关系构建了一个高度互联的网络，并且在网络的结构中嵌入了灵活性。建立蓬勃发展的多利益相关方协作，看起来与其说是建立模仿等级制组织的结构，不如说是培育动态且相互连接的网络。\n\
  \n## 网络与等级制度，共存\n\n在许多情况下，消除现有的等级结构是不可能或不明智的。等级制度之所以存在是有原因的。它们是可预测且可靠的，并且在明确需要做什么时非常擅长执行战略。因此，与其改变其内部结构，一些组织支持网络与现有等级制度并行运作。如前所述，影响力网络特别适合解决复杂或系统性问题，这些问题没有明确的解决方案，以及追求需要站点或部门之间、或与外部利益相关者之间更高程度协作的机会。这些条件正是激发了\
  \ Google 食品实验室的启动。\n\n当 Michiel Bakker 第一次作为食品团队的负责人来到 Google 时，他发现这是一个非常内向的组织。为了对\
  \ Google 关心的大多数最复杂的问题产生更广泛的影响，Bakker 看到需要促进 Google 系统内部以及与外部人士之间的联系。\n\n在 Bakker\
  \ 的领导下，Google 于 2012 年启动了食品实验室，以解决关键的粮食系统问题，并激励其员工培养更可持续的生活方式。此后，食品实验室将来自 Google\
  \ 组织各层级的人们以及外部\n\n具体网络能够实现的结果而言，它们为组织提供了一种释放员工创造力和参与度的方式。很大程度上是通过为员工提供有意义的机会，让他们为自己关心但超出日常职责范围的事情做出贡献来实现的。\n\
  \n正如上面的例子所说明的，网络和等级制度并不相互对立。它们可以和谐地并行运作。虽然我们将网络思维与等级制度思维区分开来，但在实践中，等级制度和网络以重要方式重叠和互动。所有组织——即使是等级制组织——都包含将人员和部门连接起来的有机和非正式网络。罗布·克罗斯和安德鲁·帕克在《社会网络的隐藏力量》中写道，这些网络“与组织的绩效、其制定和执行战略的方式以及其创新能力紧密交织”。他们的研究表明，“良好管理的网络连通性对绩效、学习和创新至关重要。”\n\
  \n同样，所有网络都包含自然的等级制度。与其由单一等级制度决定权威，网络拥有根据特定情境而产生的多重灵活等级制度。这就是所谓的*异构*结构。在异构结构中，正式权力和决策是分散的——没有人拥有与生俱来的结构性优势。与此同时，某些人在特定问题上可能比其他人更有影响力，这基于他们的知识、经验或角色。\n\
  \n在我与 Sterling Network NYC 的工作中，这是一个致力于推进纽约市五大行政区经济流动性的行动网络，我注意到一位参与者因其在该领域的专业知识和作为领导者的历史，成为关于公共住房信息的特别值得信赖的来源。他们在公共住房专业知识等级制度中处于顶端，但在其他方面则较低。另一位人士是一名擅长社会正义的律师，在刑事司法改革问题上具有影响力。与此同时，一位精通技术的参与者在网络应采用何种技术工具的问题上最具影响力。通过允许多种自然等级制度出现——而不是由单一权力等级制度决定权威——影响力网络释放了人们为团体带来的诸多才能。\n\
  \n## *等级制度思维与网络思维的区别。*\n\n转向网络思维的主要影响之一在于我们如何思考领导力。等级制度领导是指令性的并集中控制。权力是集中的，应被追求或守护。相比之下，网络领导是促进性的，在他人之间建立联系并分散权力，使人们无需顶层领导即可组织起来。虽然等级制度领导者关注的是他们*自身*与其他人关系的数量和质量，但网络领导者关注的是增加*他人之间*关系的数量和质量。\n\
  \n同样，等级制度领导者常将自己（或其组织）视为太阳，坐在其宇宙的中心，所有其他行为者像绕行的行星一样围绕其旋转。他们是自己故事的主角，其他人则被 relegated\
  \ 到次要角色。然而，采用了网络思维的领导者认识到他们是更大相互连接系统的一部分。与其只向内看，专注于内部指标和财务目标，他们向外看，超越组织的围墙。他们以对整个系统的意识行事，与有共同关切的其他团体建立紧密联系。他们将目的的追求置于自身组织的成长之上为中心。这种转变在图\
  \ 2.3 中有所体现。\n\n从等级制度思维转向网络思维也改变了我们对战略的思考方式。等级制度通常采用计划并交付的战略。这可以在制定冗长详细的战略计划的仪式中看到。但复杂情况违背了战略计划所擅长的因果关系。应对复杂问题需要实验、学习和灵活性。刻意的*和*涌现的战略都是必要的，以在规划与适应之间取得平衡。\n\
  \n当人们分享不同的观点并将想法融合在一起时，会产生无法预测的新可能性。就像我们的大脑表现出远超从研究其单个神经元的电脉冲所能预测的非凡特征一样，与水所具有的许多令人惊讶的特性无法通过仅单独观察氢和氧分子来预测或理解一样，网络也不能仅通过观察其各个部分来理解。正是部分之间的互动创造了新的事物。这个过程用一句话来说就是*涌现*。涌现是赋予网络指数级影响力潜力的神奇品质。\n\
  \n为了利用人们来自系统不同部分相互作用时所产生的无尽创造力，网络领导者避免了权威决策的诱惑。\n\n## 以组织为中心\n\n## 以目的为中心\n\n![](img/4854536a9a7bcce4fd5250605cae8350_51_0.png)\n\
  \n![](img/4854536a9a7bcce4fd5250605cae8350_52_0.png)\n\n图 2.3. 采用等级制度思维时，你的组织是你关注的中心。采用网络思维时，你将目的置于关注的中心，并将你的组织视为更大相互连接系统的一部分的一个部分。此图形基于\
  \ Jane Wei-Skillern 和 Marty Kooistra 开发的图表。\n\n相反，他们拥抱涌现，支持网络自我组织成一个充满活力的生态系统——充满连接、学习和协作行动——而不单方面控制其发展路径。\n\
  \n自我组织发生在人们被邀请根据自己的判断注意到并抓住机会时。当人们可以自由尝试新事物、发起实验并与系统各地的他人建立联系和协作时，网络变得“领导力充沛”。¹⁰\
  \ 在等级制度中，领导机会对应于其在结构中的位置，而在网络中，领导机会无处不在。每个人都有能力介入并推进他们有热情的项目。因此，系统结果的责任是共享的，人们认识到他们可以参与塑造未来。这与大多数等级制度形成鲜明对比，在大多数等级制度中，一个小领导群体被委托去理解正在发生的事情并规划下一步。\n\
  \n有一个常见的误解认为自我组织意味着某种自发的自我生成，但自我组织并非随机发生或纯属运气。相反，网络的自我组织潜力是由仆人式领导者（借用罗伯特·格林利夫创造的术语¹¹）所培育的，他们培养连接、学习和行动出现的条件。这些领导者还确保这一切不是在真空中发生，而是在与人们可以导向的明确目的的关系中发生。因此，虽然群体的行动在战略和范围上可能相当多样，但它们仍然保持连贯和相互强化。在\n\
  \n\n在复杂的环境中，连贯的自组织是一股关键力量，它汇聚多元视角，并为共同利益促成广泛的实验。\n\n从根本上说，网络领导者的角色是帮助不同的群体找到将他们团结在一起的共同目标，促进自组织，并协调由此涌现的行动，使它们相互启发、相互加强。我们或许无法预测如何最好地应对复杂挑战，但借助网络的涌现性和自组织能力，我们可以共同学习，走向未来。\n"
- '## 第三章


  ## 让网络发挥作用


  > > *当一群兴趣相投的人为了共同目标而聚在一起时，会产生巨大的力量。*

  > >

  > > ——伊多乌·科耶尼坎，《全民财富》


  网络不仅仅是一种观察或思考我们周围系统的方式；它们也是一种组织方式，以应对我们这个世界的复杂性。当两个条件得到满足时，影响力网络是一种可行的方法：（1）你面临一个自己无法解决的复杂问题，（2）需要个人和/或组织之间更高水平的连接来解决这个问题。[^1]


  根据其具体关注点的不同，影响力网络可能以不同的形式呈现，每种形式都有独特的结构。正如[第1章](#)所介绍的，影响力网络的三种主要形式是学习网络、行动网络和运动网络。虽然我们用这些类别来区分关注点和结构上的重要差异，但在实践中，网络是如此流动和涌现，以至于它们很少能完全归入某一明确定义的类别。例如，影响力网络有时一开始是学习网络，但随着围绕共享项目进行协作需要更多结构，后来会演变为行动网络。


  这并不是说，为了产生社会变革，成为行动网络或运动网络必须是所有影响力网络的最终目标。恰恰相反——每种形式都有其用武之地，而每一种都可能是最佳方法，具体取决于网络的目的和背景。如果你不确定哪种形式最适合你的网络，可以先采用最简单的结构——最小可行结构——来满足其当前需求。一点点结构就能发挥很大作用，如果需要的话，你以后随时可以发展出更多结构。


  ## 影响力网络的主要形式


  学习网络侧重于连接和学习。行动网络侧重于连接、学习和行动。运动网络将多个学习网络或行动网络连接起来，以协调更广泛的运动。下面概述每种形式。


  ## 学习网络


  全球有无数的学习网络例子，尽管许多网络使用不同的术语来描述自己，例如“实践社区”或“知识网络”等。学习网络的建立是为了促进信息交流、激发创新、增加协调，并增强成员将知识应用于本地挑战的能力。²
  有时，它们也是为了提供同伴支持并促进参与者的个人发展，如领导力网络和奖学金项目。本书中提到的学习网络包括多用途预防技术倡议、司法动态捍卫者网络和适应火灾社区学习网络。


  如图3.1所示，学习网络超越了典型社交网络的松散关系结构，鼓励信息在参与者之间以及与外部群体之间的持续流动，如图3.2所示。一些学习网络是开放的，允许任何人加入，但许多是封闭的，只接纳符合特定标准的参与者（确定参与标准的过程称为网络边界设定——详见第10章）。参与者还可以组成学习圈，聚在一起进行对话、分享知识，并收集与网络目的相关的特定主题信息。


  虽然典型学习网络中的参与者不会直接合作——也就是说，建立伙伴关系并做出共同决策——但随着他们相互学习并寻找支持彼此工作的机会，他们的个人努力会变得更加紧密相连。因此，有前景的做法得以传播，资源更容易流向最需要的地方，信息传达更加一致，参与者的行动也开始相互加强。这样，建立一个强大的学习网络本身就可以成为创造变革的有效策略，即使不强调协作行动。


  ## 行动网络


  行动网络将来自不同系统的行动者聚集在一起，进行连接、学习和协作，以应对复杂问题。本书中提到的行动网络例子包括圣克鲁斯山脉管理网络、清洁电子产品生产网络、加州大学旧金山分校健康协调护理网络、RE-AMP网络和100Kin10等。


  ## 社交网络


  ![](img/4854536a9a7bcce4fd5250605cae8350_57_0.png)


  图3.1. 一个基本的社交网络，由一组个体（用节点表示）之间的一系列关系（用链接表示）构成。


  ## 学习网络


  图3.2. 学习网络的基本结构，具有有界的参与、学习圈以及信息流入、流出和跨网络流动的持续特征。


  行动网络在学习网络的所有特征基础上，加速信息流入、流出和跨网络流动，同时也迈出下一步，积极激发协作。它们促进协作的方式之一是通过项目团队（有时称为工作组或特别行动组），如图3.3所示。项目团队的存在是为了推进与网络目的相关的特定工作领域。一些学习网络也会组建项目团队——如前所述，影响力网络的形式往往是流动的——但这不太常见。学习网络和行动网络之间的区别与其说在于结构，不如说在于其主要关注点：是像学习网络那样促进信息和知识的流动，还是像行动网络那样推进协作行动。


  行动网络还可能发展额外的参与式治理结构来指导集体活动。大多数行动网络（和一些学习网络）建立的这样一种治理结构是*核心团队*。核心团队（有时称为*领导团队*、*指导委员会*或*治理委员会*）由一组志愿者或被选举出来指导网络工作和活动的参与者组成。关于核心团队、项目团队和学习圈功能的更多细节，请参见第10章。


  行动网络有许多名称，包括*联盟*、*联合体*、*集体影响倡议*、*联盟体*、*创新网络*等等。它们的结构程度可能各不相同：有些是松散的协作体，将各团体聚集在一起为一个事业而奋斗。另一些，如集体影响倡议，则是高度结构化的努力，强调以数据驱动的共享测量系统来确保活动相互加强。


  它们的目标范围也可能大不相同。例如，联盟通常会寻求实现特定成果，比如通过一项新政策。一旦实现了该成果，联盟通常会解散。然而，本书中提到的大多数行动网络会同时采取许多行动来应对复杂的、系统性的问题，这些问题没有明确的终点。


  （有时称为*分会*或*附属机构*）以半自主的方式运作，同时为了共同目标并遵循共同的原则而相互分享信息和协调。与此同时，核心网络的角色是促进信息共享，放大和支持其成员的工作，并在更广泛的范围内催化行动。就像行动网络的核心团队一样，核心网络提供领导角色来管理更大的整体。


  农业企业市场生态系统联盟（AMEA）是一个在全球和地方层面同时运作的运动网络例子，旨在加速专业农民组织的发展，惠及八十个国家的数百万小农户。AMEA的核心网络由二十七个成员组织组成，包括国际小母牛组织、国际美慈组织和雨林联盟，它们正在合作实现农业部门的系统性变革。同时，核心网络也催化并支持区域网络，为农业企业利益相关者创造繁荣的地方生态系统。AMEA目前包括五个区域网络，分别设在埃塞俄比亚、肯尼亚、乌干达、科特迪瓦和洪都拉斯，并计划在未来几年支持拉丁美洲和西非更多网络的发展。区域网络可以自由地在当地背景下做出决策和采取行动，前提是他们同意一套指导整个运动网络的共同原则。







- '## 第7章

  ## 培育信任


  > 一个社区是精神和心灵层面的状态，知道这个地方是共享的，而分享这个地方的人定义并限制了彼此生活的可能性。它是人们彼此之间的了解，他们对彼此的关心，他们彼此之间的信任，他们在彼此之间自由往来的自由。

  >

  > —— 温德尔·贝里，《未来的丧失》


  信任已成为一种流行语。大多数人会承认它很重要，但许多人却将其视为其他活动的副产品，而非应该刻意培育的东西。相反，参与者之间发展起来的联系网络是影响网络得以维系的无形结构，而未能培育信任关系正是许多网络表现不佳之处。信任是使网络所有其他美德和成就成为可能的要素。具体而言：


  **信任在网络的更正式结构和流程形成过程中创造凝聚力。** 鉴于随着网络的发展而定义影响网络的结构所带来的好处（与在层级结构中预先定义其结构相比），网络在其演进的早期阶段不太可能拥有许多正式协议。在此期间，一些参与者可能难以忍受这种模糊性。


  彼此信任以及信任网络，有助于人们更适应涌现——实时地探索、实验、反思和自我纠正。人们也更愿意分享信息并承担风险。信任是网络保持凝聚力的粘合剂，因为参与者为自己制定额外的组织结构。


  **信任提升了网络的集体智慧，避免了趋同和群体思维的陷阱。** 在合适的条件下，网络能够进行深思熟虑的辨别，其集体智慧超过任何个人。缺乏对他人观点的开放性， arguably
  是网络思考和行动智能的最大障碍。在没有信任的情况下，我们倾向于相信我们的假设和预测是有效的，我们认为自己知道他人在想什么和感受什么而无需询问他们，也许我们是房间里唯一理智的人。信任增加了参与者会细心倾听、尝试新视角，并与他们认为与自己非常不同的人互动的可能性。


  **信任扩展了可能对话的范围。** 彼此信任的人更坦率，更可能分享信息，也更可能在协作方式上展现创造力。¹ 在信任充足的情况下，人们更能 navigating  through
  不舒服的对话，并在不担心受到伤害的情况下检验彼此的假设。结果是，新观点被考虑，冲突变得具有生成性而非破坏性。随着人们感到可以自由表达自己的想法并承认困难的现实或有争议的观点，网络进行建设性对话和做出明智决策的能力得以增强。


  这一转变对清洁电子生产网络（CEPN）的成功至关重要，CEPN 是 Green America 可持续解决方案中心的项目，得到了 Converge 和 CoCreative
  咨询公司的支持。CEPN 的参与者包括许多主要科技品牌和环境非政府组织，他们正在共同解决任何单一组织都无法单独解决的问题：使电子制造过程中工人对有毒化学品的接触趋于零。电子品牌与非政府组织之间的关系在
  2016 年网络启动时最初很紧张。但在过去几年里，“成员们已经达到一个程度，他们拥有足够的信任，愿意分享什么有效、什么无效以及他们需要帮助的地方，”CEPN 主任
  Pamela Brody-Heine 分享道。² “关系已经转变，他们之间的沟通也更加富有成效。”


  在通过网络工作时，你花费在培育信任关系上的时间是你能做的最大投资——将其视为“关系的回报”。但在人们能够建立信任之前，他们首先需要建立联系。新的联系可以通过编织的实践来促进。


  ### 编织联系


  有句老话说：“最好的肥料是农夫的脚步。” 换句话说，正是农夫在田间不断的在场才带来一切不同。网络也是如此。领导者通过直接与参与者建立联系并将参与者相互连接来照料网络。这就是
  *network weaving* 的实践。就像蜘蛛网的丝或挂毯的线一样，网络需要被编织在一起，以发展出能够抵御变化季节的强大连接组织。网络编织的概念具有原住民根源。安第斯原住民理解我们生活在一个“我们都是相互交织的线和针脚”的世界里，“当我们不强加、控制或支配，而是尊重地允许他人的表达……我们编织在一起，同时不停止成为我们自己，现在作为
  *jaqui*：伙伴、社区。”³


  致力于在网络间培育关系的人被称为 *network weavers*。*Network Weaver Handbook* 的作者 June Holley 将网络编织者定义为那些明确致力于使他们周围的网络更健康、更具包容性的人，“通过帮助人们识别他们的兴趣和挑战，在有互惠互利潜力时进行战略性地连接人们，并作为自我组织的催化剂”⁴。


  编织一个社区的行动——将个体部分缝合为更大的整体——是网络中每个人的工作。所有网络参与者都有机会和责任编织新的联系。这可以通过花时间了解人们、互相介绍、深度倾听以及以各种方式邀请他人协作来实现。


  尽管如此，对于网络领导者——尤其是履行编织者角色的人——来说，始终保持对在整个网络中建立联系的刻意关注尤为重要。通过先与参与者建立联系，然后将参与者相互连接，编织者感知并预见群体的能量，同时促进更高水平的自我组织。


  ### 与参与者建立联系


  网络编织者旨在尽可能频繁地与尽可能多的参与者建立联系。这些互动的目的是了解更多关于所有参与者的信息，包括他们关心什么、他们正在做什么、他们希望如何沟通以及他们希望如何为网络做出贡献。这些对话在建立信任的同时，也揭示了将参与者连接起来以推进共同学习或行动的机会。它们也有助于领导者和参与者共同发展对网络中正在发生的事情的更整体的认识，并突出需要特别关注的问题。访问
  Converge Network Toolkit 以获取网络编织问题清单，编织者可以在与参与者的对话中使用。


  定义定期的联系节奏将极大地有助于保持编织的一致实践。加州景观管理网络的领导者 Sharon Farrell 已经养成了每周两天在日历上安排时间给一段时间未联系的网络参与者打电话的习惯：“我坚信，如果你为对话创造时间，而这是一种交流而不是单向的，信任就开始建立起来了，”Farrell
  说。⁵


  在较小的网络中，编织者可能能够在定期间隔内与每个参与者建立联系。在较大的网络中，这通常不是




  practical; even so, it’s important to talk regularly with a good cross section of
  the network. In these cases, we recommend that weavers be both strategic and random
  with respect to who they talk to, and that they also provide avenues for participants
  to reach out to them directly.


  A helpful strategy in large networks is to split up the list of participants between
  multiple weavers. This ensures that each participant has a designated person they
  can contact at any time with questions or concerns. Each member of the Fire Adapted
  Communities Learning Network has a specific point person (called their “network
  liaison”) who is responsible for checking in with them at least every few months
  and who they can reach out to at any time. “We rely on this practice as an important
  feedback loop for sensing in a complex domain,” shares Michelle Medley-Daniel, a
  leader and liaison in the network. “We adapt network values and offerings based
  on member feedback, and also adapt our understanding of the complex fire systems
  and ways to change them based on the information we get through these trusted relationships.”⁶


  ## Connecting Participants with One Another


  The second essential activity of network weaving is connecting participants with
  one another. Weavers are “skilled at discovering the needs of people in their networks,”
  observes Holley, “and then linking them to others in the network who can work with
  them to have those needs met.”⁷ Weavers connect participants together who are likely
  to benefit from the relationship, such as those who are working on similar issues
  or have resources or expertise that could support each other’s work. The key is
  to go the extra mile and help set the context for the conversation, explaining why
  you think they should know each other. Mapping the network with social network analysis
  (SNA), as described in chapter 10, will help weavers discover opportunities to build
  connectivity across the network most quickly and to identify people who perhaps
  should be connected but do not yet have a relationship.


  As described above, while weaving is a central role of network leadership, weaving
  can also be carried out by anyone who notices opportunities to make introductions,
  deepen relationships, and bridge


  - Appreciation


  ## Reliability


  Choosing to trust people is, in part, a judgment that they will be true to their
  word and follow through on their commitments. Trust grows through action. When people
  help each other by offering support or contributing to a project, it builds a foundation
  of goodwill. And when people prove their reliability time and time again by continuing
  to show up, stick around, and follow through, trust grows to a level of resilience
  that can withstand significant disruption.


  Reliability doesn’t mean that people always have to respond positively to a request
  for support. It’s important that people feel free to decline when they don’t have
  the ability or capacity to help. Without space for “no,” there is no weight behind
  “yes.” Being reliable just means that when you say “yes,” you will do your best
  to follow through and keep others informed if something goes wrong. On the flip
  side, reliability also means that when you decline, others will respect and hold
  you accountable to that “no” as well.


  ## Openness


  Inevitably, in any relationship, miscommunications and moments of tension will arise.
  People may strongly disagree with one another about what to do next. Without sufficient
  trust, these disruptions can derail the relationship and stall action. Overcoming
  these rocky periods requires openness—the willingness to be honest and share what’s
  on your mind, as well as the ability to listen deeply and consider new perspectives.


  In the absence of openness, our true emotions and opinions are often guarded or
  hidden under a professional mask. We also remain closed to new information, stubbornly
  holding on to past beliefs and closing off new possibilities. To be open is to be
  willing to share honest thoughts and feelings, even if it’s uncomfortable. By being
  open, we acknowledge interdependence and invite reciprocity. It’s sometimes assumed
  that being open with one another comes later, after trust has been developed, but
  openness is also a great catalyst of trust.


  At times, being open may simply be too risky. This is particularly true for those
  who have been oppressed or experienced significant trauma. They know firsthand that
  people can and do use their power to exploit others for personal gain rather than
  collective good. For this reason, make sure to allow people the space they need
  to engage *or not*, and to honor distance where appropriate. When openness is not
  yet possible, a mutual commitment to care may be a first step.


  ## Care


  For many, trust does not come easily, because past transgressions have revealed
  time and time again that people are not to be trusted. Often, the first step toward
  choosing trust comes when people recognize that others hold a mutual concern for
  something they care about. Even if it’s hard to trust another person directly, it
  might be easier to trust the love that someone has for their community or region,
  or for the network.


  Critically, demonstrating care also involves acknowledging and then repairing harm.
  This may mean creating opportunities for those who have been harmed to share their
  experiences of past harms, and for those who have historically benefited from resources,
  unjust laws, and the displacement of others to listen, acknowledge the reality of
  those harmed, take action to repair the harm, and be accountable for doing whatever
  is necessary to ensure that harm will not be committed again.¹⁰


  I saw this process in action when working with Valentin Lopez, chairman of the Amah
  Mutsun Tribal Band and a founding member of the Santa Cruz Mountains Stewardship
  Network. The Amah Mutsun Tribe occupied the San Juan Valley for thousands of years
  before Spanish colonizers arrived in the late 1700s and forcibly removed them from
  their land. The Amah Mutsun were further persecuted in the 1800s by state-sanctioned
  violence conducted by the US government and the State of California. Then, in the
  early 1900s, the Amah Mutsun Tribal Band’s federal recognition was not granted,
  based on a report from the California Bureau of Indian Affairs that stated, “These
  Indians have been well cared for by Catholic priests and no land is required.”¹¹


  Despite generations of oppression, the Amah Mutsun Tribal Band lives on as a community
  of nearly six hundred members, and they continue to be active in stewarding their
  native land using practices handed down from their ancestors. In 2013, they formally
  established the Amah Mutsun Land Trust, one of the first of its kind, to care for
  the land and restore access to their ancestral territory for stewardship, ceremony,
  and learning.[^12]


  It would be entirely understandable if the Amah Mutsun chose not to trust the large
  and wealthy organizations that now inhabit the region. When Lopez engaged with other
  organizational leaders in the network, however, he recognized the care that others
  felt for the land. That mutual care was the first step toward building a relationship
  of trust regarding stewardship of the region. “We’ve always had a hard time trusting
  institutions,” Lopez says. “By being a part of this network, and through the collaborative
  efforts we’ve been a part of, I now have relationships with all the groups here.
  And I recognize that people in conservation share the Native Americans’ love for
  the land and want to take care of it, although we are still cautious. We are learning
  to trust. That’s a change for me.”[^13]


  As the network was forming, it was essential for other leaders in the region to
  listen to Lopez’s account of the experiences of the Amah Mutsun, to acknowledge
  the harms of the past and present, and to take steps to ensure that the harms would
  not be replicated in the future. In one example, Lopez and the Amah Mutsun Land
  Trust began working closely with California State Parks and the San Mateo Resource
  Conservation District to develop a proposal to restore the ecological vitality of
  the Quiroste Valley. Critically, the project was to be led by trained stewards from
  the Amah Mutsun Tribe, who would apply the stewarding techniques of their ancestors.
  While the Parks Department and the Resource Conservation District provided valuable
  support, the Amah Mutsun held final decision-making authority to guide the effort.[^14]


  Early on in the project, it appeared that the work might be stalled. The proposal
  had been blocked in the California Coastal Commission’s approval process. At first
  it was unclear whether the project would be allowed to proceed, but in a matter
  of days, many influential organizations in the network reached out to the Coastal
  Commission with their support. With so many advocates championing the cause, the
  final permit was approved in 2018. The result for the Amah Mutsun “was more than
  a homecoming,” writes Lexi Pandell of *Bay Nature* magazine. “It was a return to
  a spiritual




  呼吁关爱土地，并以此修复殖民造成的部分创伤，重拾一个民族的认同。”¹⁵


  ## 欣赏


  欣赏他人，就是接纳人们本来的样子，珍视不同的存在、认知与实践方式。人们往往带着截然不同的背景、身份、经历和信念进入网络。在多元群体之间建立信任的前提，是认识到多样性正是网络蓬勃发展的关键所在；毕竟，网络建设的巨大潜力很大程度上来自于跨越分歧搭建连接。


  在实践中，欣赏的文化是一种珍视并融合多种风格与技能的文化。只有当人们能够将完整的自我带入网络，并以自己选择的方式贡献才能时，深度信任才可能实现。为了创造一个让所有参与者都能充分贡献的空间，必须确保主流文化的规范不会排斥其他文化——在美国，这意味着去中心化白人文化，让其他存在、认知与实践方式得以兴盛。


  在个人层面，分享欣赏之情也有助于让人们摆脱头脑的局限，进入以心灵为中心的空间，为更深层的连接创造机会。这就是为什么我们经常在会议结束时请大家表达欣赏，请他们反思“此刻你想欣赏谁或什么？”以这种方式分享欣赏，有助于强化网络想要倡导的亲社会行为。


  ## 分享故事


  建立信任并为勇敢对话奠定基础的最可靠方式，是花时间去理解彼此的*内在背景*。我们通常只能看到彼此的*外在背景*：人们的外貌、言行、头衔与所属机构，以及他们的网络形象。但要与他人建立更深的连接，就必须花时间去了解他们的内在背景：行为背后的*原因*、深层的价值观与动机，以及塑造他们的经历。如果不花时间去理解一个人的内在背景，我们就极易对他的意图做出带有偏见的猜测。¹⁶


  参与者能够揭示自己内在背景的最亲密方式之一，就是分享个人故事。故事能加深倾听者对讲述者作为一个人、一个灵魂的理解与欣赏，而不是仅仅将对方置于工作语境中来看待。如果不花时间去聆听他人的故事，我们几乎对对方一无所知。我们会对刚认识的人妄加评判。我们会做出各种假设。马尔科姆·格拉德威尔在《与陌生人交谈》中写道：“我们以为仅凭最细微的线索就能轻易看透他人的内心。”但事实上，我们很不擅长判断他人的品格。¹⁷
  故事有一种力量，能够打开人们的心扉，将他们连接在一起。


  我们发现一个特别有效的讲故事工具叫做“真实故事”（True Stories），改编自YouthBuild创始人多萝西·斯托内曼使用的一种实践。我们已经在各种不同的场合多次带领这个练习，从阿拉巴马州蒙哥马利到肯尼亚内罗毕，再到中国上海。每一次，它都极大地改变了房间里的氛围。


  在这个练习中，参与者被均匀分成三到五人一组。然后请他们面对面坐下，并邀请他们讲述一段塑造了自己的生活经历。具体的提问框架可以根据情境调整。例如，人们可能会被要求分享他们生命中某个特定时期的故事、一位对他们产生重大影响的导师的故事，或者他们如何走上今天所从事工作的故事。每个人有特定的时间讲述自己的故事，期间只有他一个人发言（我们通常根据练习时间，给每个故事四到七分钟）。我们鼓励参与者尽可能深入，但又不要让人觉得他们过度分享。然后，在接下来的两分钟里，倾听者分享对那个故事的反思——什么引起了他们的共鸣，什么让他们感到惊讶，什么让他们印象深刻。当第一个人讲完故事并收到小组反馈后，下一个人讲述自己的故事，过程如此继续。整个练习大约需要45分钟。你可以在“汇聚网络工具包”中获取[真实故事](#)的完整说明。


  如上所述，选择讲故事活动时一个重要的考虑因素是，要记住有些参与者经历过严重的创伤和压迫。作为变革推动者和引导者，我们必须在促进参与者开放与触发创伤的可能性之间取得平衡。在我们创造的容器中，参与者始终可以选择跳过，也可以选择在分享个人故事时深入到什么程度。


  ## 用心倾听


  分享故事既关乎讲述，也关乎倾听。当参与者深入地聆听并相互共情，以尊重之心对待彼此的故事时，信任便会发展。


  仅仅专注地倾听是不够的，因为那意味着你停留在自己的参照系中，听到的他人之言会带有你自己的过滤和推论色彩。相反，*共情式倾听*才是所需的——它尽可能抑制你自己的偏见，更充分地理解另一个人眼中的世界。¹⁸
  当你共情式倾听时，大脑中的镜像神经元会被激活，使你在生理上体验讲述者所描述的事情。¹⁹


  与此同时，用心倾听也有力量创造安全感并改变对话本身。良好的倾听不仅影响倾听者，也影响讲述者所分享的内容。当人们感到被倾听、被接纳时，他们更可能愿意展现脆弱，这能为更深层的连接打开大门。通过共情式倾听更加了解他人的内在世界，同时体验自己被完全聆听的感觉，这种经历几乎比其他任何方式都更能将人们紧密联结在一起。


  ## 开展勇敢的对话


  信任奠定了相互尊重的基础，参与者可以在此基础上进行任何为开始合作所需的对话。


  在建立网络时，我们建立信任并不是为了让人们互相喜欢或彼此认同。相反，我们建立信任是为了让人们能够彼此意见不同，却仍然有效地化解冲突。


  生成性冲突——即建设性而非破坏性的冲突——是进步的核心。优秀的团队、关系、组织和网络会创造一种尊重的文化，让人们可以安全地表达不同意见。想一想你自己大脑中如何解决问题——很可能涉及权衡相互竞争的想法以得出最优解。当群体掌握了以尊重的方式明确考虑问题多个方面的能力时，结果就是更快的学习和更好的决策。


  体现这种心态的一个网络是“无癌经济网络”（Cancer Free Economy Network，CFEN）。CFEN由四十个成员组织和十二位来自环境与社会正义、健康、科学、政策、法律、劳工、商业和传播部门的个人成员组成。他们共同扩大保护人们免受有害化学物质伤害的运动，将癌症预防带入许多领先癌症和健康组织的前沿。该网络之所以有效，在于“这个群体随着时间的推移建立起来的信任、相互尊重和理解水平，”该网络战略总监黛布拉·埃尔贝内格说。“参与者在生活经历、背景、工作以及看待世界的方式上都存在非常真实的差异。但人们走到了一起，并就共同目标达成一致。他们真诚地希望听取彼此的观点，相互学习。他们并不总是意见一致，但他们能够尊重地表达分歧，并以一种非常特别的方式推动事情前进。”²⁰


  随着网络的发展，参与者可能会面临许多关于网络战略、优先事项和活动的重要且可能引起争议的对话。对参与者来说，真相时刻在于他们是否足够信任彼此，能够表达愤怒或沮丧，以及满足和喜悦，而不必担心被嘲笑或受到群体报复。²¹


  已经引入了许多有用的术语来使冲突正常化，使其成为被接受而非回避的事物。“守护网络”的首席执行官兼创始人丽莎·布拉什使用了“冲突智慧”这一表达。²² 杰里



  Hirshberg，日产设计国际公司的创始人兼总裁，创造了“创造性摩擦”这一说法。²³ Priya Parker 使用了“良性争议”一词，提醒我们“和谐未必是聚集中最高，当然也未必是唯一的价值。”良性争议促使群体突破现状，推动创造性思维，并帮助网络成长。拥抱良性争议并不容易，需要勇气。“但当它发挥作用时，它会带来澄清与净化——并且是抵御胡言乱语的强力解药，”Parker
  写道。²⁴


  以尊重和坦诚进行勇敢的对话，是网络协作中不可或缺的一部分。对话不应仅仅因为困难而被回避。如果参与者无法或感到不安全去讨论具有挑战性的问题，信任就会受阻，决策会被拖延，网络也会陷入困境。正如作家、诗人和社会活动家
  James Baldwin 所理解的那样：“并非所有面对的事情都能改变；但任何事情，只有面对了才能改变。”²⁵


  ## 建立团体共识


  在进行勇敢对话之前，一个早期的步骤是首先建立团体共识。当这些共识被用心制定时，它们有助于营造一个欢迎的空间，让每位参与者都能投入其中。


  为了生成一份可能的共识清单，可以考虑请参与者思考以下问题：“为了让你能够充分参与，你需要这个群体中的其他人提供什么？”²⁶ 首先留出时间进行个人反思，然后邀请参与者分享想法，先在小范围内，再在全体范围内。人们可能会提出诸如“我需要知道我分享的内容会被保密”之类的陈述。相应的关于保密的团体共识可能是：“带走经验，留下细节。”其他人可能会说他们很难长时间坐着，需要能够休息一下。相应的团体共识可能是：“照顾好自己。”


  可以考虑在已有的、在多元文化环境中行之有效的团体准则基础上进行构建，例如《杰梅斯民主组织原则》²⁷、《勇敢空间对话指南》²⁸、《客厅对话协议》²⁹，或 VISIONS
  公司的准则。

  '
- '## 第 8 章


  ## 协调行动


  > *发生在一个人身上的事，也发生在我们所有人身上。*

  > *我们可以一起挨饿，也可以一起丰盛。*

  > *一切繁荣都是相互的。*


  > —— 罗宾·沃尔·基默尔，《编织甜草》


  人们常常受到尚未尝试的重大新想法的启发——那种能带来巨大改变的投资。毕竟，大规模变革正是许多影响力网络最初形成的原因。但创造大规模变革的过程并不快速或容易。它通常意味着投入缓慢的工作，去理解现状是什么、我们想要什么，以及我们将如何共同建设不同的东西。这可能需要大量的时间、精力和信任关系，才能在分歧和障碍面前坚持下去，并转变根深蒂固的心态、结构和习惯。


  人们常常想要立即跳入雄心勃勃的计划来改变系统。在他们急于“采取行动”的热情中，他们在尚未基于已经进行的工作之上推进时，就启动了新项目。当他们遇到不可避免的挑战或失败时，他们会变得士气低落，对网络的热情也会消退。当这种情况发生时，参与者可能会质疑他们投入网络的时间是否值得，许多人会选择退出。结果，网络的全部潜力在有机会成熟之前就被放弃了。


  我们推荐另一种方法。在启动需要大量资源来实施的宏大新合作之前，首先要对人们已经在做的事情形成共同理解，并在已经进行的工作基础上继续推进。换句话说，即使你有组建行动网络的雄心，也要从培养一个强大的学习网络开始。毕竟，学习网络的特质也是行动网络的基础。


  发展学习网络（因此也是任何影响力网络）的一个关键方面，是加速参与者之间的信息流动，并培养互惠的文化。这样做，人们开始相互协调行动：分享有前景的做法，减少不必要的重复，并找到能证明网络即时价值的速赢机会。


  ## 加速流动


  如果网络的强度取决于连接其成员的关系，那么这些连接的价值也取决于流经它们的内容。¹ 例如，电网只有在将电力输送到预定目的地时才有用。互联网只有在数据从路由器传输到路由器时才起作用。影响力网络也是如此——最有效的网络是那些信息和资源持续在人与人之间流动的网络。


  强大的信息流尤其能解锁网络许多其他基本能力。“系统中大部分出错的地方，都是因为信息有偏、滞后或缺失，”Donella Meadows 在《系统之美》中写道。“信息将系统维系在一起。”²
  更大的信息流通意味着更多的资源和专业知识可以在整个系统中共享。随着有前景的做法被传播，学习得以增加；随着人们了解他人在做什么，不必要的重复得以减少。信息传递更加一致，行动开始相互强化，结果整个系统变得更加协调和连贯。


  一旦人们确定了共同目标并建立了信任，他们就更有可能支持彼此的工作——但前提是他们知道彼此在做什么以及自己能如何提供帮助。网络领导者——尤其是协调员（其角色将在本章后面详细描述）——最关键的能力之一，就是促成并加速参与者之间的信息流动。


  ## 让信息流入、流出和横向流动


  影响力网络可以通过三种主要方式加速信息流动：从网络内部和外部来源引入*信息*，将*信息*整理并发送给参与者和其他感兴趣的人，以及创建路径让参与者轻松地在网络内*横向*分享信息。


  适应火灾社区学习网络（FAC Net）推进了多种策略，以加速社区和组织之间的信息交流，从而提升美国各地的火灾适应实践。该网络组建学习圈，组织和创建资源，并维护一个由其150名成员共同参与的沟通系统。


  在毁灭性的2020年野火季节，其努力的成果得到了回报。“度过这些野火危机，最终归结为人际关系和我们分享信息的能力，”该网络的一位协调员 Emily Troisi
  反思道。“人们使用我们的沟通系统来分享请求、捐赠机会和外部资源的联系。每个人都在发短信、打电话、发邮件互相说：‘我在这里，告诉我怎么支持你。’”³ 很大程度上得益于
  FAC Net 自2013年启动以来的工作，曾经零散的领域如今已变成一个充满活力的学习生态系统。


  另一个拥有信息丰富生态系统的网络例子是 IMPT，这是一个专注于推进女性多功能预防技术（MPTs）的全球学习网络，在第1章中已有描述。IMPT 开发了一些具体技巧，协调员可以用这些技巧来加速信息在网络中的流入、流出和横向流动，下文将更详细地描述。


  ## 信息流入





  将信息汇聚到网络的过程始于一种清晰且一致的实践，即从参与者及外部来源收集相关资源和数据。随后，这些信息可以通过资产地图、可搜索目录和在线数据库等工具进行组织，并向参与者提供。例如，交互式资产地图为成员提供了一种简单的方式来识别网络中现有的可用资源、专业领域和地理区域——同时帮助他们立即彼此联系，以跟进所学内容。有关如何构建一个兼具**资产地图**和**网络目录**功能的详细说明，可在“汇聚网络工具包”（Converge
  Network Toolkit）中找到。


  具体而言，IMPT（国际多党派转型网络）通过其在线资源中心收集来自成员的信息。该资源中心从网络之外收集广泛多样的资源，包括与网络宗旨相关的文章、演示文稿、活动和资助机会。网络协调员协助整理从参与者那里收集到的资源，确保它们是最新的且易于查找。协调员还参加会议、订阅邮件列表组及警报，并跟踪所有正在开发中的MPT（多党派转型）产品，以便在成员之外从更广泛的领域收集信息。


  ## 信息输出


  信息收集完成后，通过网络研讨会、电话、电子邮件和其他传播方式发送回给参与者。经过精心策划的电子通讯，可以在短短几分钟内有效地为参与者提供跨网络发生的动态概览。


  除了月度通讯（其中包含大量与该领域相关的信息）外，IMPT还定期举办网络研讨会，在会议上发表演讲，并为参与者提供机会分享他们的工作并回答问题。该网络还托管了一个网站
  theimpt.org，以便向公众提供关于MPT的信息。


  ## 信息横向流动


  影响型网络还为参与者提供多种渠道，使他们能够直接彼此联系，从而让信息在他们之间自由流动，不受中心枢纽瓶颈的限制。大多数网络都会建立一个在线通信系统，成员可以在其中分享资源、机会和请求。为了创建学习反馈循环，建立简单的全网络实践来分享与工作相关的实时学习成果，也是一种良好的做法。


  IMPT通过编织那些应当认识但彼此并不认识的人和组织之间的联系，促进了MPT领域的信息横向流动。他们通过识别正在进行互补性研究的人员，然后主动在双方之间进行正式引荐，甚至帮助安排初次通话，来实现这一目标。协调员还组织各种规模的会议，从小型研讨会到大型会议不等，并定期召集一个由资助方组成的协作小组，以确定资助需求的优先级并填补资金缺口。


  ## 网络协调


  那些专门致力于开发网络分享信息、捕捉学习成果和协调行动能力的人被称为*网络协调员*。协调员提供了影响型网络在很长一段时间内维持其活动所需的操作支持。具体而言，协调员有四项主要职责：


  - 保持网络正轨

  - 建立并维护网络运营

  - 提供知识管理

  - 协助网络团队


  下面简要总结了每项职责。


  ## 保持网络正轨


  协调员是网络中的一个关键枢纽，有助于将一切联系在一起。理解协调员的一种方式是将他们比作空中交通管制员。空中交通管制员能够看到并理解特定空域内所有飞机的流动情况。他们不驾驶飞机，但受托帮助每架飞机到达目的地。他们定期与飞行员沟通，以了解其计划和需求，并利用这些信息来指导整个系统。


  同样，协调员时刻关注着网络中几乎正在发生的每件事。他们致力于将许多部分整合为一个统一的整体。由于其独特的位置，协调员非常有能力识别和界定新兴问题、收集议程议题，并支持会议和通话的设计。嵌入评估实践，如第10章所述，有助于协调员跟踪网络的发展，并识别新兴的需求和机会。


  ## 建立并维护网络运营


  协调员在建立和维护网络的在线系统（下文将详细解释）、指导会议及其他活动的后勤工作、跟踪网络财务以及管理评估活动方面起着关键作用。虽然协调员可能不直接负责记账或评估，但他们确保这些任务由知道如何执行的人负责，并确保重要信息传递给参与者。


  ## 提供知识管理


  协调员充当知识管理者，收集网络项目的资源和经验教训，组织信息以便日后易于访问。他们还通过通讯和其他渠道向参与者策划和分享这些信息。协调员确保人们拥有推进网络活动所需的信息，同时建立在先前工作的基础上。


  ## 协助网络团队


  随着网络的发展，协调员也可能为网络团队提供广泛的支持，包括核心团队、项目团队和学习圈（这些团队在**第3章**中介绍，并将在**第10章**中更详细地解释）。协调员可以通过提供思想伙伴支持、协助安排日程以及确定会议地点来协助网络团队。


  虽然协调员可以是网络团队的宝贵资源，但这并不意味着他们应该负责执行网络的项目工作。研究表明，当协调员认为自己主要对执行网络行动负责时，这些网络的实施结果水平最低。⁴
  相反，协调员应培育环境，使网络成员能够*做他们想做的事*，以服务网络宗旨并与其原则保持一致。


  ## 影响型网络的技术工具


  大多数影响型网络都会受益于一系列简单有效的软件工具，用于书面通信、音视频会议、投票和群体决策、创意构思和白板、协作文档和电子表格创建、文件共享以及日程安排，以及资产映射和社会网络分析等任务。正确的工具集可以极大地增强网络保持联系和自组织的能力。选错工具可能会让你陷入陡峭的学习曲线和令人烦恼的技术问题。由于技术始终在变化，因此书中不分享具体的工具，而是将我们的favorites（最爱）整理成一份在线持续更新的列表。请访问“汇聚网络工具包”（Converge
  Network Toolkit）查看我们推荐的影响型网络技术工具。


  无论选择什么具体工具，请确保它们易于使用。每个工具的具体用例也需要被网络清晰地理解。只有当人们使用工具时，它们才起作用，而人们总是寻找理由不去使用另一个新工具。


  同样重要的是，要花时间同时向参与者介绍新工具的使用。每当我们在网络中引入新的技术工具时，我们会在会议或网络通话中花几分钟时间介绍它，解释其预期用途，并展示其基本功能。如果可能，我们也会允许参与者花一点时间亲手尝试。


  如果网络协调员对技术比较精通，他们可以主动提供帮助给那些对特定工具感到不熟悉的人——详细演示直到人们感到舒适为止。我们还鼓励将网络成员配对为“技术伙伴”，将熟悉某工具的人与需要学习的人联系起来。这样，参与者可以彼此提供支持，而不是要求一个人负责为整个网络提供技术支持。


  ## 练习互惠性


  人们加入网络是因为他们觉得可以做出贡献，并认为网络可以帮助他们完成单凭自己无法完成的事情。但无论他们对当前问题多么关心，仅靠参与者的利他主义承诺通常不足以使网络长期维持下去。更可能的是，网络需要服务于相关人员的个人或组织优先事项，以维持其长期参与度。这反映了自利与共同利益之间的动态张力。


  花时间去有意识地协调行动是服务参与者自利的一种好方法。你可以在通话和会议上提供空间，让人们分享紧急需求，并与其他可能支持其工作的人建立联系。我们将此活动称为“快速协调”（Rapid
  Coordination），并将其融入我们领导的大多数网络会议中。该活动始于邀请参与者逐一简要分享他们需要帮助的事情，或希望与他人探索的潜在合作。在第一个分享其需求的人之后，其他人被邀请举手，如果他们认为自己可以提供帮助（通过分享信息、进行后续对话或提供资源）。该过程持续进行，直到每个人都有机会提出请求。


  在引导这一练习时，我们提醒小组这是建立联系的时间，而不是进行对话的时间，因此进展通常很快，每人最多只需三十秒。当



  conducted early in a network’s formation, this exercise often provides the first
  tangible direct benefits that members receive from their participation, and it demonstrates
  the immense value that the network can provide to advance their existing work. Visit
  the Converge Network Toolkit to see complete instructions for leading Rapid Coordination.


  If performed with enough consistency, this activity helps create a culture of generalized
  reciprocity. Whereas reciprocity is the practice of exchanging value with another
  person, generalized reciprocity is the practice of exchanging value with the network.
  People who practice generalized reciprocity give their gifts without the expectation
  of immediate return; they give with a sense of trust that their actions will eventually
  be reciprocated in one form or another by others in the network, although it isn’t
  clear how or when.


  When generalized reciprocity becomes a consistent, network-wide practice, participants
  give and receive each other’s gifts with generous intent. In turn, this creates
  a virtuous cycle: giving gifts builds trust, and trust facilitates the giving of
  gifts. The practice also creates a greater sense of belonging among participants.
  We need to give our gifts in order to feel like we’re contributing to something
  greater than ourselves. Having consistent opportunities to share and receive each
  other’s gifts is a big part of why people will continue to show up time and time
  again.


  ## Responding to Crisis


  With a culture of reciprocity, along with a robust communication infrastructure,
  networks are able to effectively respond to chaotic situations. As described in
  the introduction, chaotic situations are turbulent and rapidly evolving, and they
  cannot be accurately predicted or controlled. When one is faced with a moment of
  crisis, the first necessary step is to provide an emergency response—to quickly
  coordinate actions and distribute resources to where they are needed most. This
  is something that networks are uniquely positioned to do.


  When the COVID-19 pandemic hit, the Cancer Free Economy Network (CFEN) took immediate
  action to support its members. Organizations provided staff time to help each other
  through the process of applying for SBA Paycheck Protection Program loans and other
  forms of government support. Coordinators led discussions and webinars to share
  vital information about how member organizations could help protect the large number
  of public health professionals and worker-safety trainers they worked with. Public
  health professionals in the network shared the best scientifically based information
  available so that members could share that information with the at-risk communities
  and frontline workers they supported. And an emergency response fund organized by
  CFEN quickly distributed $250,000 into the hands of organizations to help them make
  up for canceled fundraising events, support their move to virtual operations and
  services, and provide direct COVID-related support for frontline workers and for
  constituents who found themselves in dire financial situations due to the pandemic.⁵
  With its foundation of trust and established channels for coordination already in
  place, CFEN was able to respond quickly and effectively to support its members and
  those they serve.⁶


  The critical importance of being able to coordinate actions quickly was also evident
  in the Santa Cruz Mountains region during the height of the 2020 wildfires. The
  CZU Lightning Complex wildfire took over a month to contain, during which time 86,000
  acres burned in San Mateo and Santa Cruz counties.⁷ As the fire raged, more forest
  was burning in Santa Cruz County than in San Mateo County. Because of this discrepancy,
  the San Mateo Resource Conservation District (RCD), a government agency usually
  constrained by jurisdictional boundaries, had a bit of extra capacity and immediately
  sent their staff across county lines to support Santa Cruz’s postfire recovery work.
  Recalling that experience, Kellyx Nelson, the executive director of the San Mateo
  RCD and a founding member of the Santa Cruz Mountains Stewardship Network (SCMSN),
  remembers thinking, “We’ll figure out the problems with county boundaries later;
  we’ll just find a way.”


  Meanwhile, the Santa Cruz RCD, another organizational member of the SCMSN, was so
  busy responding to the fire that they didn’t have the bandwidth to raise resources
  for their efforts. To provide help, San Mateo passed 80 percent of the funding they
  received from the USDA Natural Resources Conservation Service to Santa Cruz, with
  no assurance that funding would ever come back. “That wouldn’t have happened without
  the kinds of relationships and conditions the network provides,” says Nelson. “The
  network makes us think about why it benefits all of us to work at a landscape scale,
  and to work across boundaries and across sectors, even if there isn’t an immediate
  return on that investment. We’re continually looking for how to make it work, instead
  of focusing on why it won’t.”⁸


  One of the most valuable qualities of impact networks is that many of their benefits
  are likely to endure even after the network’s formal life cycle ends. By engaging
  in a network, participants develop a greater awareness of the interconnectedness
  of the system of which they’re a part and a deeper appreciation for the needs of
  others. Even without continued engagement, that shift is likely to sustain. Likewise,
  though relationships may fade, the foundation of trust that bonds people together
  will never fully disappear. As a result, those involved in a network will often
  continue to call on each other for information, guidance, and support for years
  to come, and resources will continue to flow more freely than they did before. By
  strengthening the fabric of our social systems, we become more resilient to change
  and more responsive in times of urgent need.


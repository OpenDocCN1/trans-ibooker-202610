    structure—a minimum viable structure—that serves its current needs. A little structure
    goes a long way, and you can always develop more later if needed.


    # Primary Forms of Impact Networks


    Learning networks are focused on both connection and learning. Action networks
    are focused on connection, learning, and action. Movement networks connect multiple
    learning or action networks together to coordinate a broader movement. An overview
    of each form is provided below.


    # Learning Networks


    There are countless examples of learning networks around the globe, though many
    use different terms to describe themselves, such as “communities of practice”
    or “knowledge networks,” among others. Learning networks are formed to facilitate
    the exchange of information, spark innovation, increase coordination, and bolster
    members’ ability to adapt knowledge to local challenges.² Sometimes they are also
    formed to provide peer support and to promote the individual development of their
    participants, as is the case with leadership networks and fellowships. Learning
    networks referenced in this book include the Initiative for Multipurpose Prevention
    Technologies, the Justice in Motion Defender Network, and the Fire Adapted Communities
    Learning Network.


    Going beyond the loose relational structure of a typical social network, as seen
    in figure 3.1, learning networks encourage the consistent flow of information
    between participants, as well as with outside groups, as seen in figure 3.2. Some
    learning networks are open, allowing anyone to join, but many are closed, only
    admitting participants who fit certain criteria (the process of determining participation
    criteria is known as bounding a network—see chapter 10 for more details). Participants
    may also form learning circles, gathering together to hold conversations, share
    knowledge, and collect information on a specific topic related to the network’s
    purpose.


    While participants in a typical learning network do not go as far as collaborating
    together directly—that is, working in partnership and making'
  - '[PAGE 56]


    shared decisions—their individual efforts become more closely connected as they
    learn from one another and find opportunities to support each other’s work. As
    a result, promising practices spread, resources are more easily distributed to
    where they are needed most, messaging comes into greater alignment, and the actions
    of those involved begin to reinforce one another. In this way, building a robust
    learning network can itself serve as an effective strategy for creating change,
    even without an emphasis on collaborative action.


    # Action Networks


    Action networks bring together actors from across systems to connect, learn, and
    collaborate together to address complex issues. Examples of action networks referenced
    in this book include the Santa Cruz Mountains Stewardship Network, the Clean Electronics
    Production Network, the UCSF Health Coordination of Care Network, the RE-AMP Network,
    and 100Kin10, among others.'

    For as long as we have been around, humans have also organized in networks—for
    protection, for mutual support, and to share resources. A single person might
    be connected to many different networks all at once, such as family networks,
    friend networks, professional networks, school networks, community networks, religious
    networks, and online social networks. Networks can be loose and unstructured,
    as most social networks are, or they can be formed to fulfill specific functions
    and advance a specific aim, as impact networks are. As described in the introduction,
    impact networks are a special kind of network that connect individuals and organizations
    together to advance learning and action for a common purpose. Whereas social networks
    often form naturally as people become connected with one another through proximity
    or shared interests, impact networks require greater levels of intentionality
    to fuel their development.


    Impact networks take three primary forms: learning networks, action networks,
    and movement networks. Each form is best suited for a particular function.


    **Learning networks** are focused on connection *and* learning. They are formed
    to facilitate the flow of information or knowledge to advance collective learning
    on a particular issue.


    **Action networks** are focused on connection, learning, *and* action. They are
    formed to facilitate connection and learning in service of coordinated action.


    **Movement networks** link many other learning and action networks together, creating
    a network-of-networks. While they often function much like a learning or action
    network at their core, movement networks also facilitate information sharing and
    coordinate actions among multiple different networks for a common aim. Some movement
    networks also help to catalyze and support new impact networks, which are usually
    focused on a specific region or on a narrower aspect of the movement’s overall
    purpose.


    Learning, action, and movement networks are each intentionally cultivated to create
    impact through different means. No form is inherently better than another, and
    each may be most appropriate, depending on the context. Together, they provide
    a transformational approach to creating'

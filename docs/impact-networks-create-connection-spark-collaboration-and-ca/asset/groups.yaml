    tension, space for people to introduce new perspectives. Create enough space so
    that every person who wants to speak their mind can do so, especially the introverts
    and people who are usually on the margins of conversations. Rushing a conversation
    to stay on time is an easy way to shut down creative of “fight, flight, or freeze.”
    These are the moments of truth in networks, the times when groups can either fall
    back into what’s comfortable or sit in the tension long enough to acknowledge
    unspoken realities and address critical issues.



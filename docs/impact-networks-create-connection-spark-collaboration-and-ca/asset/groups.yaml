    # **Preface**


    Networks are all around you, whether you are aware of them or not. Networks influence
    who you are connected to, where you get your information, and how work gets done.
    What if I told you that by learning how to cultivate and maintain certain networks,
    you would have the opportunity to unlock collaboration, unravel oppressive systems,
    and create unprecedented value? What if I told you that you could create a sustainable
    structure of organizing that would demand less pushing and introduce more pull
    and autonomous flow? New opportunities, insights, and perspectives become available
    when you start to see and engage in your world through networks.


    Networks have been around forever. But only recently have we been able to draw
    on a variety of fields—including network science, community building, systems
    thinking, and organizational development—as well as a range of collaborative software
    tools to intentionally create networks not just for social connection but also
    for collective action. Not only are networks the organic social structures that
    we naturally form; they can be cultivated to accelerate learning, spark collaboration,
    and catalyze systemic change.


    Networks are webs of relationships connecting people or things. When they seek
    to address social and environmental issues, they are called impact networks. This
    special type of network brings individuals and organizations together for learning
    and coordinated action, based on a shared purpose. Impact networks provide a transformational
    way of working together across the typical boundaries that often hold us back.
    They offer a collaborative infrastructure for a more equitable, interdependent
    world. As a powerful and flexible organizing system that can span regions, organizations,
    and silos of all kinds, impact networks underlie some of the most impressive and
    large-scale efforts to create change across the globe.'
  - '[PAGE 12]


    This book is about how to cultivate impact networks that enable diverse groups
    of people to connect, coordinate, and collaborate within and across organizations
    to do more together than is possible alone. Given the increasing complexity of
    our society and the issues we face, our ability to form, grow, and work through
    networks has never been more essential.


    •••


    This book is for all those who recognize the need to work together more than ever
    before, for those who are addressing issues bigger than any individual or organization
    can solve on its own, and for changemakers who are looking for ways to collaborate
    across a diversity of stakeholders to navigate the wicked challenges of our time.


    This book is also for anyone who is curious about, participating in, or leading
    collaborative networks, including those who coordinate, weave, and facilitate
    networks; those who fund and support networks; and all those who work in collaboration
    with others to get things done. Collaborative networks may be called many things:
    associations, alliances, coalitions, collaborations, collective impact initiatives,
    consortia, and more. Whatever they are called, the network approach to collaboration
    is profoundly different from the command-and-control approaches seen in many hierarchical
    organizations. Likewise, the form of leadership required to guide networks is
    substantially different from the autocratic forms of leadership that remain prevalent
    throughout the world. If you are supporting or working with a constellation of
    actors to address complex issues and advance common goals, this book is for you.


    I wrote this book because I believe deeply in the power of impact networks to
    contribute to a future that works for all. The network approach builds bridges
    across divides, prioritizes trust-based relationships, shares leadership, and
    recognizes the inherent interconnectedness of our lives and work. Networks are
    the organizing systems that allow our society to function today and can enable
    us to flourish in the future.


    I was first exposed to the potential of networks while working at Monitor Institute,
    the social sector wing of a global management consulting firm. Up to that point,

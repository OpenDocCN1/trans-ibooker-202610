    ## 欣赏


    欣赏他人，就是接纳人们本来的样子，珍视不同的存在、认知与实践方式。人们往往带着截然不同的背景、身份、经历和信念进入网络。在多元群体之间建立信任的前提，是认识到多样性正是网络蓬勃发展的关键所在；毕竟，网络建设的巨大潜力很大程度上来自于跨越分歧搭建连接。


    在实践中，欣赏的文化是一种珍视并融合多种风格与技能的文化。只有当人们能够将完整的自我带入网络，并以自己选择的方式贡献才能时，深度信任才可能实现。为了创造一个让所有参与者都能充分贡献的空间，必须确保主流文化的规范不会排斥其他文化——在美国，这意味着去中心化白人文化，让其他存在、认知与实践方式得以兴盛。


    在个人层面，分享欣赏之情也有助于让人们摆脱头脑的局限，进入以心灵为中心的空间，为更深层的连接创造机会。这就是为什么我们经常在会议结束时请大家表达欣赏，请他们反思“此刻你想欣赏谁或什么？”以这种方式分享欣赏，有助于强化网络想要倡导的亲社会行为。


    ## 分享故事


    建立信任并为勇敢对话奠定基础的最可靠方式，是花时间去理解彼此的*内在背景*。我们通常只能看到彼此的*外在背景*：人们的外貌、言行、头衔与所属机构，以及他们的网络形象。但要与他人建立更深的连接，就必须花时间去了解他们的内在背景：行为背后的*原因*、深层的价值观与动机，以及塑造他们的经历。如果不花时间去理解一个人的内在背景，我们就极易对他的意图做出带有偏见的猜测。¹⁶


    参与者能够揭示自己内在背景的最亲密方式之一，就是分享个人故事。故事能加深倾听者对讲述者作为一个人、一个灵魂的理解与欣赏，而不是仅仅将对方置于工作语境中来看待。如果不花时间去聆听他人的故事，我们几乎对对方一无所知。我们会对刚认识的人妄加评判。我们会做出各种假设。马尔科姆·格拉德威尔在《与陌生人交谈》中写道：“我们以为仅凭最细微的线索就能轻易看透他人的内心。”但事实上，我们很不擅长判断他人的品格。¹⁷
    故事有一种力量，能够打开人们的心扉，将他们连接在一起。


    我们发现一个特别有效的讲故事工具叫做“真实故事”（True Stories），改编自YouthBuild创始人多萝西·斯托内曼使用的一种实践。我们已经在各种不同的场合多次带领这个练习，从阿拉巴马州蒙哥马利到肯尼亚内罗毕，再到中国上海。每一次，它都极大地改变了房间里的氛围。


    在这个练习中，参与者被均匀分成三到五人一组。然后请他们面对面坐下，并邀请他们讲述一段塑造了自己的生活经历。具体的提问框架可以根据情境调整。例如，人们可能会被要求分享他们生命中某个特定时期的故事、一位对他们产生重大影响的导师的故事，或者他们如何走上今天所从事工作的故事。每个人有特定的时间讲述自己的故事，期间只有他一个人发言（我们通常根据练习时间，给每个故事四到七分钟）。我们鼓励参与者尽可能深入，但又不要让人觉得他们过度分享。然后，在接下来的两分钟里，倾听者分享对那个故事的反思——什么引起了他们的共鸣，什么让他们感到惊讶，什么让他们印象深刻。当第一个人讲完故事并收到小组反馈后，下一个人讲述自己的故事，过程如此继续。整个练习大约需要45分钟。你可以在“汇聚网络工具包”中获取[真实故事](#)的完整说明。


    如上所述，选择讲故事活动时一个重要的考虑因素是，要记住有些参与者经历过严重的创伤和压迫。作为变革推动者和引导者，我们必须在促进参与者开放与触发创伤的可能性之间取得平衡。在我们创造的容器中，参与者始终可以选择跳过，也可以选择在分享个人故事时深入到什么程度。


    ## 用心倾听


    分享故事既关乎讲述，也关乎倾听。当参与者深入地聆听并相互共情，以尊重之心对待彼此的故事时，信任便会发展。


    仅仅专注地倾听是不够的，因为那意味着你停留在自己的参照系中，听到的他人之言会带有你自己的过滤和推论色彩。相反，*共情式倾听*才是所需的——它尽可能抑制你自己的偏见，更充分地理解另一个人眼中的世界。¹⁸
    当你共情式倾听时，大脑中的镜像神经元会被激活，使你在生理上体验讲述者所描述的事情。¹⁹


    与此同时，用心倾听也有力量创造安全感并改变对话本身。良好的倾听不仅影响倾听者，也影响讲述者所分享的内容。当人们感到被倾听、被接纳时，他们更可能愿意展现脆弱，这能为更深层的连接打开大门。通过共情式倾听更加了解他人的内在世界，同时体验自己被完全聆听的感觉，这种经历几乎比其他任何方式都更能将人们紧密联结在一起。


    ## 开展勇敢的对话


    信任奠定了相互尊重的基础，参与者可以在此基础上进行任何为开始合作所需的对话。


    在建立网络时，我们建立信任并不是为了让人们互相喜欢或彼此认同。相反，我们建立信任是为了让人们能够彼此意见不同，却仍然有效地化解冲突。


    生成性冲突——即建设性而非破坏性的冲突——是进步的核心。优秀的团队、关系、组织和网络会创造一种尊重的文化，让人们可以安全地表达不同意见。想一想你自己大脑中如何解决问题——很可能涉及权衡相互竞争的想法以得出最优解。当群体掌握了以尊重的方式明确考虑问题多个方面的能力时，结果就是更快的学习和更好的决策。


    体现这种心态的一个网络是“无癌经济网络”（Cancer Free Economy Network，CFEN）。CFEN由四十个成员组织和十二位来自环境与社会正义、健康、科学、政策、法律、劳工、商业和传播部门的个人成员组成。他们共同扩大保护人们免受有害化学物质伤害的运动，将癌症预防带入许多领先癌症和健康组织的前沿。该网络之所以有效，在于“这个群体随着时间的推移建立起来的信任、相互尊重和理解水平，”该网络战略总监黛布拉·埃尔贝内格说。“参与者在生活经历、背景、工作以及看待世界的方式上都存在非常真实的差异。但人们走到了一起，并就共同目标达成一致。他们真诚地希望听取彼此的观点，相互学习。他们并不总是意见一致，但他们能够尊重地表达分歧，并以一种非常特别的方式推动事情前进。”²⁰


    随着网络的发展，参与者可能会面临许多关于网络战略、优先事项和活动的重要且可能引起争议的对话。对参与者来说，真相时刻在于他们是否足够信任彼此，能够表达愤怒或沮丧，以及满足和喜悦，而不必担心被嘲笑或受到群体报复。²¹


    已经引入了许多有用的术语来使冲突正常化，使其成为被接受而非回避的事物。“守护网络”的首席执行官兼创始人丽莎·布拉什使用了“冲突智慧”这一表达。²² 杰里



  - '[PAGE 147]


    conducted early in a network’s formation, this exercise often provides the first
    tangible direct benefits that members receive from their participation, and it
    demonstrates the immense value that the network can provide to advance their existing
    work. Visit the Converge Network Toolkit to see complete instructions for leading
    Rapid Coordination.


    If performed with enough consistency, this activity helps create a culture of
    generalized reciprocity. Whereas reciprocity is the practice of exchanging value
    with another person, generalized reciprocity is the practice of exchanging value
    with the network. People who practice generalized reciprocity give their gifts
    without the expectation of immediate return; they give with a sense of trust that
    their actions will eventually be reciprocated in one form or another by others
    in the network, although it isn’t clear how or when.


    When generalized reciprocity becomes a consistent, network-wide practice, participants
    give and receive each other’s gifts with generous intent. In turn, this creates
    a virtuous cycle: giving gifts builds trust, and trust facilitates the giving
    of gifts. The practice also creates a greater sense of belonging among participants.
    We need to give our gifts in order to feel like we’re contributing to something
    greater than ourselves. Having consistent opportunities to share and receive each
    other’s gifts is a big part of why people will continue to show up time and time
    again.


    # Responding to Crisis


    With a culture of reciprocity, along with a robust communication infrastructure,
    networks are able to effectively respond to chaotic situations. As described in
    the introduction, chaotic situations are turbulent and rapidly evolving, and they
    cannot be accurately predicted or controlled. When one is faced with a moment
    of crisis, the first necessary step is to provide an emergency response—to quickly
    coordinate actions and distribute resources to where they are needed most. This
    is something that networks are uniquely positioned to do.


    When the COVID-19 pandemic hit, the Cancer Free Economy Network (CFEN) took immediate
    action to support its members. Organizations provided staff time to help each
    other through the process of applying for'
  - '[PAGE 148]


    SBA Paycheck Protection Program loans and other forms of government support. Coordinators
    led discussions and webinars to share vital information about how member organizations
    could help protect the large number of public health professionals and worker-safety
    trainers they worked with. Public health professionals in the network shared the
    best scientifically based information available so that members could share that
    information with the at-risk communities and frontline workers they supported.
    And an emergency response fund organized by CFEN quickly distributed $250,000
    into the hands of organizations to help them make up for canceled fundraising
    events, support their move to virtual operations and services, and provide direct
    COVID-related support for frontline workers and for constituents who found themselves
    in dire financial situations due to the pandemic.⁵ With its foundation of trust
    and established channels for coordination already in place, CFEN was able to respond
    quickly and effectively to support its members and those they serve.⁶


    The critical importance of being able to coordinate actions quickly was also evident
    in the Santa Cruz Mountains region during the height of the 2020 wildfires. The
    CZU Lightning Complex wildfire took over a month to contain, during which time
    86,000 acres burned in San Mateo and Santa Cruz counties.⁷ As the fire raged,
    more forest was burning in Santa Cruz County than in San Mateo County. Because
    of this discrepancy, the San Mateo Resource Conservation District (RCD), a government
    agency usually constrained by jurisdictional boundaries, had a bit of extra capacity
    and immediately sent their staff across county lines to support Santa Cruz’s postfire
    recovery work. Recalling that experience, Kellyx Nelson, the executive director
    of the San Mateo RCD and a founding member of the Santa Cruz Mountains Stewardship
    Network (SCMSN), remembers thinking, “We’ll figure out the problems with county
    boundaries later; we’ll just find a way.”


    Meanwhile, the Santa Cruz RCD, another organizational member of the SCMSN, was
    so busy responding to the fire that they didn’t have the bandwidth to raise resources
    for their efforts. To provide help, San Mateo passed 80 percent of the funding
    they received from the USDA Natural Resources Conservation Service to Santa Cruz,
    with no assurance that funding would ever come back. “That wouldn’t have happened
    without the'
  - '[PAGE 149]


    kinds of relationships and conditions the network provides,” says Nelson. “The
    network makes us think about why it benefits all of us to work at a landscape
    scale, and to work across boundaries and across sectors, even if there isn’t an
    immediate return on that investment. We’re continually looking for how to make
    it work, instead of focusing on why it won’t.”⁸


    One of the most valuable qualities of impact networks is that many of their benefits
    are likely to endure even after the network’s formal life cycle ends. By engaging
    in a network, participants develop a greater awareness of the interconnectedness
    of the system of which they’re a part and a deeper appreciation for the needs
    of others. Even without continued engagement, that shift is likely to sustain.
    Likewise, though relationships may fade, the foundation of trust that bonds people
    together will never fully disappear. As a result, those involved in a network
    will often continue to call on each other for information, guidance, and support
    for years to come, and resources will continue to flow more freely than they did
    before. By strengthening the fabric of our social systems, we become more resilient
    to change and more responsive in times of urgent need.'
  - "[PAGE 150]\n\n# CHAPTER 9\n\n# Collaborate for Systems Change\n\n> *Making systems\
    \ work—whether in health care, education, climate change, making a pathway out\
    \ of poverty—is the greatest task of our generation.*\n> \n> — ATUL GAWANDE, “How\
    \ Do We Heal Medicine?,” TED2012\n\nThe systemic challenges we face call for a\
    \ systemic approach, in which we address issues from many angles, simultaneously,\
    \ as part of a coordinated effort. It is simply not enough to scale the work of\
    \ individual leaders, programs, or organizations. Creating change at the rate\
    \ we need is going to require a whole new level of planetary collaboration.\n\n\
    *Systems change* is the process of reforming or transforming the structures, relationships,\
    \ policies, power dynamics, narratives, and norms in a given system in order to\
    \ create positive social or environmental results. A system is a group of interacting\
    \ or interdependent elements forming a unified whole.¹ Systems may overlap—for\
    \ instance, in the connections between health care and housing. And systems can\
    \ be nested within other systems—a classroom is nested within a school, which\
    \ is nested within a school district, which is nested within a state’s education\
    \ system.\n\nIn *Who Do We Choose to Be?*, Margaret Wheatley shares that she’s\
    \ basically given up on wholesale global systems change. The scale and complexity\
    \ of the issues we face are overwhelming, and changemakers are burning out in\
    \ droves. So, she reframed her aspiration, and so have we. Wheatley wants to create\
    \ what she calls “islands of sanity that evoke and rely on our best human qualities\
    \ to create, relate, and persevere.”² Instead of islands of sanity, I like to\
    \ think of them as *pockets of possibility*. These"
  - '[PAGE 151]


    are the places all around the world where people are coming together to plant
    seeds for a positive future.


    We may not be able to change the whole system all at once. But we can create positive
    changes locally. And when those local changes are connected together through networks—when
    they are coordinated, learn from one another, and reinforce one another—change
    can happen at larger and larger scales.


    # Making Sense of the System


    In any complex system, there are underlying structures, norms, and beliefs responsible
    for creating the presenting symptoms we see every day—the events and crises that
    flood the news and occupy most of our attention. More often than not, these underlying
    issues are intimately intertwined with structural racism, sexism, and other oppressive
    dynamics. Therefore, it is critical that any effort to create systems change aim
    “to transform the underlying power dynamics, narratives, and histories that built
    these structures and enable them to thrive,” states the social change group Change
    Elemental.³ Otherwise, if they do not, efforts are likely to reinforce existing
    inequities or merely replace one form of inequity with another.


    In the absence of a deliberate process to make sense of the system it seeks to
    change, a network might inadvertently maintain most of its focus on the most obvious
    symptoms and miss important details about what is causing those symptoms in the
    first place. An essential step to creating systemic change, then, is to develop
    a deep, nuanced, and meaningful understanding of the past, present, and potential
    future states of the system, as well as the root causes that are driving the system’s
    behavior.⁴ This involves surfacing diverse perspectives, developing a broader
    understanding of the actors and organizations involved, and examining external
    trends and forces. It also involves considering the local context, learning about
    the histories of the place or system, identifying political and power dynamics,
    and unveiling hardwired assumptions. In the process, lots of questions are asked
    and answered, and patterns are surfaced. Relevant actors, forces, and flows are
    identified. Participants share their piece of the puzzle, and the big picture
    comes into view, illuminating new connections and opportunities to create change.'

    生殖健康。通过首次连接系统各地的个人和组织，IMPT 使网络成员能够以过去从未可能的方式相互联系和学习。MPT 领域绝不可能在没有 CAMI Health
    的催化领导和 IMPT 网络的成长的情况下取得如此大的进展，或如此迅速的进展。


    ## 一个跨部门行动网络来守护土地


    2014 年底，圣克鲁斯山脉地区主要土地所有者和土地管理组织的一群领导人意识到，尽管他们都致力于保护该地区 50 万英亩的自然资源，但他们并未以足以让景观长期繁荣的规模开展合作。为提高区域协调，他们成立了圣克鲁斯山脉管理网络
    Santa Cruz Mountains Stewardship Network, SCMSN，并聘请 Converge 指导网络的发展、促进其首次聚会，并聘请并培训一名全职协调员，以支持网络的未来发展。


    如今，SCMSN 是一个行动网络，连接了二十多个团体，包括政府机构、土地信托、非营利组织、研究机构、木材公司和一个美洲原住民部落。这些团体共同拥有或管理该地区大部分土地，他们围绕着共同的宗旨走到了一起，即帮助“培育一个充满韧性、充满活力的地区，让人类和自然系统世代繁荣”。⁷


    作为一个行动网络，SCMSN 融合并发展了学习网络的特质，促进组织之间信息流动和知识共享。同时，它还支持成员之间相互协作，以影响整个地区的保护成果。例如，该网络推进了一个数百万美元的植被测绘项目，为土地管理者提供宝贵数据，帮助指导其管理工作。SCMSN
    引发的另一项协作努力，并由其所属的更大运动网络加州景观管理网络 California Landscape Stewardship Network 推进，已导致一项重大的“剪掉绿色胶带”倡议，极大地改善了全州生态修复项目的许可和资金效率。然而，在
    SCMSN 能够以这种规模开始协作之前，参与者首先需要澄清他们共同持有的目的，并建立有意义的信任关系。


    建立信任关系的能力远非理所当然。在网络启动前夕，我们对参与者进行的初步访谈中了解到该地区的社会分裂和紧张历史。自 1960 年代以来，环保主义者和以土地为生计的圣克鲁斯县居民一直陷入一种典型的冲突，争论如何照顾该地区的红杉森林。几十年来，环保团体和土地信托一直追求保护主义使命，限制该地区的木材采伐并“拯救红杉”。木材公司自二十世纪中叶以来一直使用可持续的择伐技术，反对这种保护主义做法。


    土地信托与木材公司之间的冲突因圣克鲁斯山脉两侧社区的差异而进一步复杂化。东侧的圣克拉拉县是硅谷所在地，拥有经济实力和政治影响力。西侧的圣克鲁斯县，人们大多生活在农村环境中，有些人靠土地为生。该地区最大的土地信托主要位于圣克拉拉县，而木材公司及其员工则倾向于生活和工作在圣克鲁斯县。


    与此同时，我们访谈的一些领导人表达了对问题权力动态的担忧，小型保护组织不断被资金充足的土地信托 overshadow。其他人则对彼此怀有数年的怨恨，因为他们觉得自己在之前的合作中没有得到公平对待。还有其他人担心网络会被劫持以服务于私人利益。


    与其最初关注网络成员将一起做什么，这在缺乏信任的情况下会遇到严重阻碍，我们专注于澄清他们共同持有的愿景和原则。我们还专注于培养能够促进长期创造性思考和合作的关系。


    在网络第一年举行的三次聚会中，参与者了解了彼此的价值观和动机，并辩论了良好管理的实践应如何体现。尽管观点不同，他们发现自己都热爱这片土地。他们分享了关于祖先的故事、他们如何来到圣克鲁斯山脉地区生活，以及他们如何首次爱上当地的树木、动物、河流和山脉的故事。他们设想了他们想要的区域未来，并澄清了团结他们组织的共同愿景。他们建立了新的关系，并加深了与已认识的人的联系。到第三次聚会结束时，参与者制定了一份共同章程，定义了网络的目的、他们对良好管理的集体理解，以及他们将协调努力的具体优先领域。制定章程是一个具有里程碑意义的时刻，但这也只是个开始。


    网络继续发展，增加了新成员并激发了新的合作。两名成员，如《水星新闻 Mercury News》所描述的，“在许多问题上传统上并不一致”——当地环保组织半岛开放空间信托
    Peninsula Open Space Trust 和一家家族经营的木材公司 Big Creek Lumber——合作保护了近一千英亩的红杉森林，这是近十年来最大规模的交易之一。⁸
    单独一项，Amah Mutsun 部落、加州州立公园和 San Mateo 资源保护区之间的合作正在努力恢复 Quiroste Valley 的生态活力。该努力在第
    7 章中有更详细的描述，由部落成员领导，他们采用祖先的管理实践，在过程中修复伤害并缓慢地与州机构建立信任。⁹


    虽然成果令人鼓舞，但最值得关注的是关系。关系是网络得以运作的核心。“我们害怕说关系和信任有多重要，”San Mateo 资源保护区的执行主任 Kellyx
    Nelson 说，“但关系建设正是魔法的发生之处。关系引导我们去寻找‘可以’。”¹⁰


    ## 关系：网络的核心


    关系是影响网络取得一切成就的核心。从对网络和其他多利益相关方协作长达二十年的研究来看，加州大学伯克利分校哈斯商学院的 Jane Wei-Skillern 发现，“所有成功协作背后最重要的单一因素是参与者之间基于信任的关系。许多协作努力最终未能充分发挥潜力，因为它们缺乏坚实的
    relational 基础。”¹¹


    虽然大量精力被投入到使任何系统的各个部分更有效，但人们常常忽视通过将系统联系在一起的关系网络来加强整个系统的机会。例如，基金会经常在单个组织上投入大量资源——并期望它们产生超大影响——却没有投资于协作基础设施，使多个组织能够以强大的方式结合其努力。一次又一次我们看到，个人和组织之间牢固的关系网络对于创造具有韧性、智能和创新性的系统至关重要。没有关系，有效的协作是不可能的。


    为了更好地了解圣克鲁斯山脉地区存在的分裂程度，我们在网络首次聚会前进行了初步社会网络分析 Social Network Analysis, SNA，并在第二次聚会后六个月进行了第二次分析。在调查中，参与者被要求保密评估他们与网络中每个人的联系程度
    选项包括 0–无联系、1–熟人、2–关系、3–牢固关系。如图 1.5 所示，关系很少存在，尤其是在不同类型组织的领导者之间。节点代表组织领导人，链接表示两个人之间存在关系或牢固关系，相关色调代表特定组织类型，如政府机构、土地信托或研究机构
    为保护个人隐私，已删除具体识别信息。



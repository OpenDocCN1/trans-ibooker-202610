    ecological restoration projects across the state. Before the SCMSN could begin
    working collaboratively at this scale, however, participants first needed to clarify
    the purpose they held in common and to develop meaningful relationships of trust.


    The ability to develop trusting relationships was far from a foregone conclusion.
    In our initial interviews with participants, conducted just before the network’s
    launch, we learned of the area’s social fragmentation and history of tensions.
    Since at least the 1960s, environmentalists and Santa Cruz County residents who
    worked the land for their livelihood had been pitted against one another in an
    archetypal conflict over how to care for the region’s redwood forests. For decades,
    environmental groups and land trusts had pursued a preservationist mission to
    restrict timber harvest throughout the region and “save the redwoods.” The timber
    companies, which had used sustainable techniques of selective harvesting since
    the mid-twentieth century, opposed this preservationist approach.


    The conflict between the land trusts and the timber companies was further complicated
    by the differences between communities on two sides of the Santa Cruz Mountains.
    Santa Clara County on the east side is home to Silicon Valley, with its economic
    power and political influence. In Santa Cruz County on the west side, people live
    in mostly rural settings, some making their living off the land. The region’s
    biggest land trusts are primarily located in Santa Clara County, while timber
    companies and their employees tend to live and work in Santa Cruz County.


    Meanwhile, some of the leaders we interviewed shared concerns about problematic
    power dynamics, with smaller conservation organizations constantly overshadowed
    by well-funded land trusts. Others harbored years of resentment for one another,
    as they felt they had not received fair treatment in previous partnerships. Still
    others were worried that the network would be hijacked to serve private interests.


    Rather than focusing initially on what network members would do together, which
    would have faced serious roadblocks given the lack of trust, we focused on clarifying
    the aspirations and principles they held in common. We also focused on cultivating
    relationships that would foster creative thinking and cooperation over the long
    term.'

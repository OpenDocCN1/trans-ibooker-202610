    large and wealthy organizations that now inhabit the region. When Lopez engaged
    with other organizational leaders in the network, however, he recognized the care
    that others felt for the land. That mutual care was the first step toward building
    a relationship of trust regarding stewardship of the region. “We’ve always had
    a hard time trusting institutions,” Lopez says. “By being a part of this network,
    and through the collaborative efforts we’ve been a part of, I now have relationships
    with all the groups here. And I recognize that people in conservation share the
    Native Americans’ love for the land and want to take care of it, although we are
    still cautious. We are learning to trust. That’s a change for me.”[^13]


    As the network was forming, it was essential for other leaders in the region to
    listen to Lopez’s account of the experiences of the Amah Mutsun, to acknowledge
    the harms of the past and present, and to take steps to ensure that the harms
    would not be replicated in the future. In one example, Lopez and the Amah Mutsun
    Land Trust began working closely with California State Parks and the San Mateo
    Resource Conservation District to develop a proposal to restore the ecological
    vitality of the Quiroste Valley. Critically, the project was to be led by trained
    stewards from the Amah Mutsun Tribe, who would apply the stewarding techniques
    of their ancestors. While the Parks Department and the Resource Conservation District
    provided valuable support, the Amah Mutsun held final decision-making authority
    to guide the effort.[^14]


    Early on in the project, it appeared that the work might be stalled. The proposal
    had been blocked in the California Coastal Commission’s approval process. At first
    it was unclear whether the project would be allowed to proceed, but in a matter
    of days, many influential organizations in the network reached out to the Coastal
    Commission with their support. With so many advocates championing the cause, the
    final permit was approved in 2018. The result for the Amah Mutsun “was more than
    a homecoming,” writes Lexi Pandell of *Bay Nature* magazine. “It was a return

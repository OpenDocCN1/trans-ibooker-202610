    The Initiative for Multipurpose Prevention Technologies (IMPT), also described
    in chapter 1, was first catalyzed by Bethany Young Holt, a nonprofit leader inspired
    by the need to connect the fragmented MPT field. Holt organized a meeting of stakeholders
    working on HIV prevention, STI prevention, and contraceptive development, and
    then used the resources of her organization, CAMI Health, to help them share information
    and coordinate actions with one another.


    For the Food Lab at Google, described in chapter 2, the primary catalyst was Michiel
    Bakker, someone new to the organization who saw the opportunity to engage actors
    from within and beyond Google to address complex food system issues. In another
    example, described in chapter 9, Steve Pantilat, director of the Palliative Care
    Program at UCSF Health, catalyzed the Coordination of Care Network to connect
    twelve sites and ten health disciplines to provide more comprehensive and coordinated
    palliative care to people with serious illness across the health system.


    Foundations are also sometimes in a good position to help spark a new network.
    For instance, the Garfield Foundation catalyzed the RE-AMP Network when they convened
    a group of funders and advocates to take a systemic approach to addressing climate
    issues in the Midwest. Similarly, the Robert Sterling Clark Foundation catalyzed
    Sterling Network NYC to support leaders from the public, private, and social sectors
    to work together to increase economic mobility across the city’s five boroughs.


    Almost anyone can be a catalyst—as long as they embrace a network mindset. Walking
    the talk of the network mindset means sharing leadership rather than seeking to
    control the effort, showing humility, and demonstrating a genuine commitment to
    the purpose of the network. This last point is particularly important. If catalysts
    are not sufficiently trusted and committed to the cause, participants will question
    whether they are “organizing for impact or for ego,” according to Nick Martlew
    of Crisis Action, a catalyst and coordinator for organizations working together
    to protect civilians from armed conflict.¹ The clearest way for catalysts to earn
    the trust of participants is to keep the purpose at the center of their focus,'

    environmental networks together to build collective power and advocate for policy
    change at a statewide level. As is typical among movement networks, the CLSN relies
    on regional networks, such as the Santa Cruz Mountains Stewardship Network, the
    One Tam initiative, and the Orange Coast Collaborative, to make decisions and
    take action relevant to their local context. At the same time, the CLSN combines
    the forces of its members to advance statewide policy efforts such as the Cutting
    Green Tape initiative, which is removing counterproductive barriers to restoring,
    enhancing, and preserving natural resources across California.



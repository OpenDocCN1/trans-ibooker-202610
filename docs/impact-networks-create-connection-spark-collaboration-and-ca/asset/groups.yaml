    ## Create Deeper Experiences


    Most professional meetings tend to be action oriented, and the social norms of
    professionalism usually mean that people are expected to leave emotion at the
    door. This lack of personal intimacy is a huge impediment to building trust. In
    order to create deeper connections, we need to disrupt these norms and create
    experiences that feel markedly different from typical meetings. When we invite
    people into a space that feels distinct from their usual professional contexts,
    it completely changes what’s possible. New topics are broached, broadening the
    scope of what can be discussed. Emotion is unleashed, creating *energy in motion*.
    Displays of openness yield greater levels of trust.


    Create a different experience by inviting people to share a personal story or
    meaningful moment in their lives. Incorporate rituals—elements that are repeated
    at each convening—to bring groups together into a deeper space at a certain moment
    of every gathering. Use art, humor, and creative room setups to create a sense
    that this is *different*.


    With a bit of nudging, people will move beyond the kind of surface-level interactions
    they’re used to in professional spaces, opening the door for deeper connections
    (specific practices for developing deeper connections are discussed in the next
    chapter). Once participants engage on a more personal level, their relationships
    will never be the same.


    ## Incorporate Space


    Because convenings are relatively rare events, there’s usually a lot to get to.
    As a designer you may feel pressure to fit everything in. The hardest part about
    designing agendas is in deciding not what to include, but rather what to exclude.


    Oversaturating an agenda with activity after activity is a common mistake. When
    agendas are overplanned, with activities filling every second of the day, they
    stifle the possibility for new ideas and conversations to organically emerge.
    As you plan out your convening, keep the following considerations in mind:


    **First, things will almost always take longer than you expect.** The more people
    there are, the longer things will take. Introductions will run long, conversations
    will run long, and breaks will most certainly run long. If they don’t, that’s
    great! You’ve found yourself a few extra minutes. But to be safe, assume that
    nearly every part of the agenda will require more time than you initially imagined,
    and plan accordingly.



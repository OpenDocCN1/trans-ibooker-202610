    \ learnings that will inform the network’s development, and how to resource networks,\
    \ including pivotal practices for network funders.\n\n## PART ONE\n\n## working\
    \ through networks\n\n## CHAPTER 1\n\n## The Web of Change\n\n> > *We are caught\

    # Acknowledgments


    First, I’d like to thank my longtime friend and Converge co-catalyst David Sawyer.
    We started on this journey together long ago, and he has been a constant supporter
    and mentor ever since—thank you for seeing and believing in me from the first
    day we met. My deep gratitude also goes out to the whole Converge network for
    wide-ranging support throughout the development of this book. Thank you to those
    who read numerous early drafts and provided thoughtful feedback and critical edits
    that made the book so much better, most especially Gabriel Grant, Paula Manley,
    Carri Munn, and Amelia Pape, as well as Elsa Henderson, Kelly Jarvis, Mina Lee,
    and Ying Liu. Special shout-out to Zach Anderson and Nick Viele for all the legendary
    whiteboard sessions and consistent friendship and thought partnership throughout
    it all. And a special thank-you to Matthew Spence for invaluable writing counsel
    on nearly everything I have published over the years.


    I’m sincerely grateful for my Berrett-Koehler editor, Anna Leinberger, for incredibly
    valuable advice that improved the organization of this book tremendously, and,
    most especially, for believing in this book and helping turn it into a reality.
    Thank you to everyone at Berrett-Koehler and in my book team who contributed to
    the development of this book and who were essential in bringing it into the world.
    Thanks also to reviewers Sadia Hassan, Susan Hopp, Michael McNair, Sue Muehlbach,
    and Nigel Wylie for their valuable feedback.


    Thank you to my family for all their endless love and support. Without you, this

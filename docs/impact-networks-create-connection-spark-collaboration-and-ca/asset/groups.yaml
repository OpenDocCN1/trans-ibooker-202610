    ## 第7章

    ## 培育信任


    > 一个社区是精神和心灵层面的状态，知道这个地方是共享的，而分享这个地方的人定义并限制了彼此生活的可能性。它是人们彼此之间的了解，他们对彼此的关心，他们彼此之间的信任，他们在彼此之间自由往来的自由。

    >

    > —— 温德尔·贝里，《未来的丧失》


    信任已成为一种流行语。大多数人会承认它很重要，但许多人却将其视为其他活动的副产品，而非应该刻意培育的东西。相反，参与者之间发展起来的联系网络是影响网络得以维系的无形结构，而未能培育信任关系正是许多网络表现不佳之处。信任是使网络所有其他美德和成就成为可能的要素。具体而言：


    **信任在网络的更正式结构和流程形成过程中创造凝聚力。** 鉴于随着网络的发展而定义影响网络的结构所带来的好处（与在层级结构中预先定义其结构相比），网络在其演进的早期阶段不太可能拥有许多正式协议。在此期间，一些参与者可能难以忍受这种模糊性。


    彼此信任以及信任网络，有助于人们更适应涌现——实时地探索、实验、反思和自我纠正。人们也更愿意分享信息并承担风险。信任是网络保持凝聚力的粘合剂，因为参与者为自己制定额外的组织结构。


    **信任提升了网络的集体智慧，避免了趋同和群体思维的陷阱。** 在合适的条件下，网络能够进行深思熟虑的辨别，其集体智慧超过任何个人。缺乏对他人观点的开放性，
    arguably 是网络思考和行动智能的最大障碍。在没有信任的情况下，我们倾向于相信我们的假设和预测是有效的，我们认为自己知道他人在想什么和感受什么而无需询问他们，也许我们是房间里唯一理智的人。信任增加了参与者会细心倾听、尝试新视角，并与他们认为与自己非常不同的人互动的可能性。


    **信任扩展了可能对话的范围。** 彼此信任的人更坦率，更可能分享信息，也更可能在协作方式上展现创造力。¹ 在信任充足的情况下，人们更能 navigating  through
    不舒服的对话，并在不担心受到伤害的情况下检验彼此的假设。结果是，新观点被考虑，冲突变得具有生成性而非破坏性。随着人们感到可以自由表达自己的想法并承认困难的现实或有争议的观点，网络进行建设性对话和做出明智决策的能力得以增强。


    这一转变对清洁电子生产网络（CEPN）的成功至关重要，CEPN 是 Green America 可持续解决方案中心的项目，得到了 Converge 和 CoCreative
    咨询公司的支持。CEPN 的参与者包括许多主要科技品牌和环境非政府组织，他们正在共同解决任何单一组织都无法单独解决的问题：使电子制造过程中工人对有毒化学品的接触趋于零。电子品牌与非政府组织之间的关系在
    2016 年网络启动时最初很紧张。但在过去几年里，“成员们已经达到一个程度，他们拥有足够的信任，愿意分享什么有效、什么无效以及他们需要帮助的地方，”CEPN
    主任 Pamela Brody-Heine 分享道。² “关系已经转变，他们之间的沟通也更加富有成效。”


    在通过网络工作时，你花费在培育信任关系上的时间是你能做的最大投资——将其视为“关系的回报”。但在人们能够建立信任之前，他们首先需要建立联系。新的联系可以通过编织的实践来促进。


    ### 编织联系


    有句老话说：“最好的肥料是农夫的脚步。” 换句话说，正是农夫在田间不断的在场才带来一切不同。网络也是如此。领导者通过直接与参与者建立联系并将参与者相互连接来照料网络。这就是
    *network weaving* 的实践。就像蜘蛛网的丝或挂毯的线一样，网络需要被编织在一起，以发展出能够抵御变化季节的强大连接组织。网络编织的概念具有原住民根源。安第斯原住民理解我们生活在一个“我们都是相互交织的线和针脚”的世界里，“当我们不强加、控制或支配，而是尊重地允许他人的表达……我们编织在一起，同时不停止成为我们自己，现在作为
    *jaqui*：伙伴、社区。”³


    致力于在网络间培育关系的人被称为 *network weavers*。*Network Weaver Handbook* 的作者 June Holley 将网络编织者定义为那些明确致力于使他们周围的网络更健康、更具包容性的人，“通过帮助人们识别他们的兴趣和挑战，在有互惠互利潜力时进行战略性地连接人们，并作为自我组织的催化剂”⁴。


    编织一个社区的行动——将个体部分缝合为更大的整体——是网络中每个人的工作。所有网络参与者都有机会和责任编织新的联系。这可以通过花时间了解人们、互相介绍、深度倾听以及以各种方式邀请他人协作来实现。


    尽管如此，对于网络领导者——尤其是履行编织者角色的人——来说，始终保持对在整个网络中建立联系的刻意关注尤为重要。通过先与参与者建立联系，然后将参与者相互连接，编织者感知并预见群体的能量，同时促进更高水平的自我组织。


    ### 与参与者建立联系


    网络编织者旨在尽可能频繁地与尽可能多的参与者建立联系。这些互动的目的是了解更多关于所有参与者的信息，包括他们关心什么、他们正在做什么、他们希望如何沟通以及他们希望如何为网络做出贡献。这些对话在建立信任的同时，也揭示了将参与者连接起来以推进共同学习或行动的机会。它们也有助于领导者和参与者共同发展对网络中正在发生的事情的更整体的认识，并突出需要特别关注的问题。访问
    Converge Network Toolkit 以获取网络编织问题清单，编织者可以在与参与者的对话中使用。


    定义定期的联系节奏将极大地有助于保持编织的一致实践。加州景观管理网络的领导者 Sharon Farrell 已经养成了每周两天在日历上安排时间给一段时间未联系的网络参与者打电话的习惯：“我坚信，如果你为对话创造时间，而这是一种交流而不是单向的，信任就开始建立起来了，”Farrell
    说。⁵


    在较小的网络中，编织者可能能够在定期间隔内与每个参与者建立联系。在较大的网络中，这通常不是



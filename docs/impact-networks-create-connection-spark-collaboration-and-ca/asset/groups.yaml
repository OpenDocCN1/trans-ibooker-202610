    the power that comes with the role. Then, invite participants to provide candid
    feedback if they recognize opportunities to make the space more inclusive. If
    you come from a dominant cultural group, it is especially important to consider
    other cultural frames in the meeting design phase as well as in real time during
    a convening. Otherwise, you run the risk of unconsciously reinforcing dominant
    group norms that can alienate or even cause harm to some members of the network.



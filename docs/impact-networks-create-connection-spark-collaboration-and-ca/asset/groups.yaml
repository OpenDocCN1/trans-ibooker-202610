    Through three convenings held over the course of the network''s first year, participants
    learned about each other''s values and motivations and debated what good stewardship
    looked like in practice. Despite their different perspectives, they discovered
    that they each held a love for the land. They shared stories about their ancestors,
    about how they had come to live in the Santa Cruz Mountains region, and about
    how they first fell in love with the local trees, animals, rivers, and mountains.
    They envisioned the future they wanted for their region, and they clarified the
    common aspirations that united their organizations. They developed new relationships
    and deepened connections with people they already knew. By the end of the third
    convening, participants had developed a shared charter that defined the purpose
    of the network, their collective understanding of good stewardship, and specific
    priority areas where they would coordinate efforts. Establishing the charter was
    a momentous occasion, but it was also just the beginning.


    The network continued to develop, adding new members and sparking new collaborations.
    Two members who, as the *Mercury News* describes, “haven’t traditionally agreed
    on many issues”—the Peninsula Open Space Trust, a local environmental organization,
    and Big Creek Lumber, a family-run timber company—partnered to preserve almost
    one thousand acres of redwood forests in the largest transaction of its kind in
    nearly a decade.⁸ Separately, a collaboration between the Amah Mutsun Tribal Band,
    California State Parks, and the San Mateo Resource Conservation District is working
    to restore the ecological vitality of the Quiroste Valley. The effort, described
    in more detail in chapter 7, is led by tribal members who are employing the stewardship
    practices of their ancestors, repairing harm and building trust with state institutions,
    however slowly, in the process.⁹


    While the outcomes are inspiring, it’s the relationships that deserve the most
    attention. Relationships have been central to what has made the network work.
    “We’re afraid to say how important relationships and trust are,” says Kellyx Nelson,
    executive director of the San Mateo Resource Conservation District, “but the relationship
    building is where the magic happens. The relationships lead us to look for the
    ‘yes.’”¹⁰



    # 4. Organize an Initial Convening, and Begin Cycling through the Five Cs


    The last step, in partnership with the design team, is to organize one or more
    convenings and invite people to begin cycling through the Five Cs. While many
    networks will start with a single convening to gauge interest, it can be prudent
    to schedule a set of convenings from the outset in anticipation of busy calendars.


    At these initial convenings, the catalyst might provide facilitation, or they
    might find someone else to fill this critical role. Regardless, the initial objectives
    are always the same: bring people together so that the whole system becomes more
    connected; look for common ground and identify the places where people can work
    together—even if they disagree on some issues; take time to develop relationships
    of trust; and find ways to share information and resources to support each other’s
    work.


    In the early days, “start small and let it grow,” encourages Jane Wei-Skillern.
    “Share resources, share infrastructure costs, and engage in small collaborations
    where people see the benefit. Networks should be making everyone’s work and lives
    easier. If they’re not serving that purpose, they should not exist.”⁴ We have
    advised many ambitious network leaders to start by cultivating a strong learning
    network before jumping straight to action. It’s far better to have a vibrant learning
    network than a middling action network, and learning networks can always evolve
    into action networks later. Over time, people may discover opportunities to collaborate—to
    do more together than is possible alone—at which point, catalysts can help create
    new structures and dedicate additional resources to support that shared work.


    As the network develops, catalysts might stay involved to continue to help lead
    the network, or they may become a participant like everyone else. In either case,
    the catalyst role is fulfilled once the network has been brought together and
    has enough leadership, resources, and clarity of direction to continue evolving
    into the future.



    百年时间尺度，“因为根源条件如此深远，而创伤如此古老，以至于它不可能一夜之间愈合。我持开放态度，但我并不指望它会发生，”他说。[^21]


    面对我们所面临的挑战的令人望而生畏的规模，有必要在许多人渴望立即改变事物的紧迫感与认识到创造系统性变革是一场马拉松而非短跑的耐心之间取得平衡。温德尔·贝里在
    *A Country of Marriage* 中写道：“投资千年。”“种植红杉。说你的主要作物是你没有种植的森林，你将无法活到收获的那一天。”[^22]


    网络引发的变革乍看之下可能很缓慢，或几乎不可见，因为它们发生在人们内部并通过他们之间的联系发生。进步的最初迹象可能看起来只像是新的关系、新的对话，以及一个人以看似微小、一次性方式帮助另一个人的服务时刻。有时网络的早期实验可能看起来微不足道，不太可能带来任何重大转变。


    但往往被忽视的是，在培育网络的过程中，系统实际上正在发生转变。当网络得到培育时，人们和组织开始以新的方式相互接触。信息和资源开始以前所未有的方式流动。来自问题对立面的不同的人找到了创造性合作的方式。一个曾经支离破碎的系统变得相互连接，能够迅速应对危机。新的领导者涌现。更健康的规范开始形成并传播。而地方行动可能发展成为一场运动，创造一个全新的系统。


    自然界中的分形为我们提供了关于小型实验如何扩散成更大干预的线索。分形是重复形成更大结构的模式。我们在雪花构成的重复形状、蕨类植物叶片中一致的图案以及鹦鹉螺壳的螺旋设计中看到分形。分形教会我们从小处着手，从微观到宏观层面发展，创造随着成长而越来越大的模式。


    同样，网络可以成为你正在创造的未来的模型，一个可以通过更大系统复制的实验性分形。adrienne maree brown 写道：“我们在小规模上实践的东西可以回响到最大规模。”²³“我们必须创造向上循环的模式。”²⁴


    影响力网络不仅仅催化变革；它们*就是*变革。每当我们努力弥合分歧并为共同目的建立联系时，我们就播下了可能在许多世代中成长的种子。我们可以实践我们希望看到的改变，而网络掌握着关键。


    ## CHAPTER 10


    ### The Enabling Infrastructure


    > As for the future, your task is not to foresee it, but to enable it.


    > —ANTOINE DE SAINT-EXUPÉRY, *The Wisdom of the Sands*


    为了使参与者在一段时间内能够有效合作，影响力网络需要一个能够随网络一起成长的适应性基础设施。良好的组织结构可以让网络有效地引导参与者的创造力，而结构过多则可能扼杀个人主动性。我们建议网络采用最小可行结构——最简单且能有效满足其需求的结构，并且该结构能够随着网络的发展而演变。


    城市规划者简·雅各布斯关于过度结构化的弊端的研究突出了另一种生命系统——美国城市的愚蠢。在 1950 年代，美国城市的设计使人们住在城市的一个部分、工作在另一个部分、购物在又一个部分。在大多数城市中这种情况仍然存在，这导致了广泛的社会碎片化和漫长的日常通勤。正如雅各布斯所观察到的，这发生的原因是城市规划者为他们认为*应该*发生的事情进行设计，忽视了人类基于日常生活自然组织自己的方式。更好的做法本应是“承认城市是一个不断变异的活有机体，一个涉及大量变量的高度复杂的网络……一个充满重叠和自发性的开放空间，在那里创造力、休闲和合作的自然条件可以轻松繁荣”，曼努埃尔·利马在
    *Visual Complexity* 中写道，引用了雅各布斯。¹


    我们可以将这些见解同样应用于影响力网络。影响力网络是活的系统，而不是机器；我们无法提前完全知道它们将如何演变。因此，在网络形成时避免对其结构进行过于僵化的定义是明智的。这样做只会限制其最终潜力。


    例如，Cancer Free Economy Network 在网络启动四年后才定义了具体的治理协议。它们当时根本不需要。过早定义只会增加不必要的僵化。只有当网络开始显著增长时，才明显需要有完善的协议。到了那时，参与者对网络将如何运作以及哪些治理协议最能支持他们的协作工作也有了更深入的了解。²


    在制定网络结构时，让形式追随功能。让参与者的能量和兴趣引领方向。让网络的自然演变根据其在任何给定时刻最需要的东西来定义其结构。RE-AMP Network
    的催化者 Ruth Rominger 写道：“协作网络不需要在它们绝对有用之前建立任何结构要素或运营协议。”“放置足够的东西将使网络保持连接，同时保持足够的灵活性以适应变化。”³


    影响力网络的赋能基础设施由一组为支持学习、行动或治理而组建的团队、共享参与协议、明确的决策流程、嵌入式评估实践以及灵活资源组成。本章将依次探讨这些组成部分。


    ### Organizing into Teams


    影响力网络通常通过四种类型的团队组织，每种团队仅在需要时出现。设计团队形成以帮助催化新网络并组织网络聚会；核心团队形成以提供治理和咨询支持；项目团队形成以推进协作工作；学习圈形成以就感兴趣的话题进行对话并收集信息。虽然设计团队已在
    [chapter 5] 中描述过，但核心团队、项目团队和学习圈的基本职能总结如下。


    ### Core Team


    网络整体的领导职能由核心团队承担，有时称为 *leadership team, network council, governance circle,* 或
    *steering committee*。核心团队与网络其他领导者合作协调网络的工作、活动和资源。由于它们并不总是必要，只有当网络足够复杂，需要额外的治理层来支持参与者做出更大贡献和协调行动时，才应创建核心团队。


    乍一看，核心团队似乎是影响力网络中异常等级化的特征，事实上它们确实倾向于对网络的决策产生一定影响。然而，与传统权力等级制的主要区别在于，核心团队不对其他网络成员拥有正式权威。核心团队提出建议，但最终决策最终由整个网络做出。与传统等级制另一个不同之处在于，核心团队会定期轮换成员。它们通常由四到七人组成，每人代表不同的参与组织或网络的一部分，他们自愿在特定时期担任核心团队成员，通常是从一次聚会到下一次聚会。


    核心团队的角色范围很广，取决于网络在任何给定时间最需要什么，包括但不限于以下内容：


    - 为其他网络领导者提供咨询支持，例如领导项目团队和学习圈的人

    - 努力确保网络的既定原则融入网络的实践中

    - 就网络需要考虑的重要决策提出建议



    **杠杆点：** 针对性干预能够在整个系统中产生超额影响的地方。


    **韧性：** 抵御干扰并随着条件变化而适应的能力。


    **系统：** 一组相互作用或相互依存的部分，共同构成一个更大的整体。


    **系统变革：** 改革或转型给定系统中结构、关系、政策、权力动态、叙事和规范的过程，以创造积极的社会或环境效应。



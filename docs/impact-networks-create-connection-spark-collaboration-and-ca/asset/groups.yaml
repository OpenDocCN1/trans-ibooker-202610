    +   - **Include funders as participants, not as hosts or designers.** In gatherings
    with significant organizational dynamics, you can also try removing professional
    affiliations from nametags. People can always figure out where they work later.
    Let them connect as individuals first.

    +   - **Normalize discussion and acknowledgment of power.** Power exists in all
    groups, whether or not you talk about it, and avoiding the issue creates a barrier
    to trust. Acknowledge power dynamics openly in the network, and think together
    about what issues of power might play out and how the network will work to resolve
    them.


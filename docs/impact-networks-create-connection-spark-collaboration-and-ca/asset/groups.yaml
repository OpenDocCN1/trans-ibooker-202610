    collectively, they provide a powerful touchstone that enables participants to
    hold themselves and each other accountable for walking their talk in how they
    work together to advance the network’s purpose. Having clear principles means
    that “as conditions change, there is a common understanding of what matters, a
    way to return to shared practice and behavior,” writes adrienne maree brown, author
    of *Emergent Strategy*.¹⁹



    # Crafting a Collective Purpose


    The formation of the Santa Cruz Mountains Stewardship Network provides an example
    of how a group of diverse stakeholders can define a collective purpose. When over
    a dozen organizations originally came together to figure out how they could work
    together more effectively, there were significant questions about why the network
    was being created. People had concerns about hidden agendas, no single issue was
    of interest to everyone, and the attending organizations had very different short-term
    priorities.


    Before members could agree on their collective purpose, they first needed to clarify
    what was meant by “stewardship.” Defining key terms is a common early task for
    a new network—only by agreeing on what stewardship meant could participants begin
    to make it actionable.


    They also needed to develop a shared understanding of the system: the historical
    and present-day factors influencing stewardship in the region. They completed
    a historical analysis, examined external trends and forces through scenario planning,
    and identified hopes and concerns.


    Through many rich discussions, participants began to find common ground. Most
    people agreed that effective stewardship required a multifaceted, mosaic approach.
    They recognized threats from development and climate change. And nearly every
    person agreed that strengthened connections and collaborative relationships would
    benefit their work and the region. While there were plenty of disagreements of
    how to most effectively steward the land, there was also plenty of agreement about
    why effective stewardship was important.


    Eventually, participants were ready to craft and refine their collective purpose.
    As the facilitators, we asked them to articulate the purpose of the network from
    their perspective by completing the phrase “How do we . . .” We then took what
    they shared and offered an initial version of a purpose for them to refine. We
    find that it is easier for large groups to improve upon a draft statement than
    it is for them to build one from scratch.'

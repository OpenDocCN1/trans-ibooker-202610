    ## CHAPTER 7

    ## Cultivate Trust


    > A community is the mental and spiritual condition of knowing that the place
    is shared, and that the people who share the place define and limit the possibilities
    of each other’s lives. It is the knowledge that people have of each other, their
    concern for each other, their trust in each other, the freedom with which they
    come and go among themselves.

    >

    > — WENDELL BERRY, “THE LOSS OF THE FUTURE”


    Trust has become something of a buzzword. Most people will acknowledge that it’s
    important, yet many see it as a by-product of other activities, rather than something
    that should be cultivated deliberately. On the contrary, the web of connections
    that develops between participants is the invisible structure that holds impact
    networks together, and a failure to cultivate trusting relationships is where
    many networks fall short. Trust is the element that makes possible all of a network’s
    other virtues and accomplishments. Specifically:


    **Trust creates cohesion while a network’s more formal structures and processes
    are being formed.** Given the benefits of defining an impact network’s structure
    as it develops (as opposed to defining its structure in advance, as in a hierarchy),
    networks are unlikely to have many formal agreements in the early stages of their
    evolution. During this time, it may be difficult for some participants to sit
    with the ambiguity.


    Trusting in each other and in the network helps people to be more comfortable
    with emergence—to explore, experiment, reflect, and self-correct in real time.
    People also become more willing to share information and take risks. Trust is
    the glue that keeps a network together as participants develop additional structures
    for organizing themselves.


    **Trust increases the network’s collective intelligence and avoids the pitfalls
    of conformism and groupthink.** Under the right conditions, networks are capable
    of thoughtful discernment and collective intelligence greater than that of any
    single individual. Lack of openness to others’ perspectives is arguably the greatest
    obstacle to a network’s ability to think and act intelligently. Our tendency,
    in the absence of trust, is to believe that our assumptions and projections are
    valid, that we know what others are thinking and feeling without asking them,
    and that maybe we are the only sane person in the room. Trust increases the likelihood
    that participants will listen with care, try on new perspectives, and engage with
    people they might consider to be very different from themselves.


    **Trust expands the range of possible conversations.** People who trust each other
    are more forthright, more likely to share information, and more likely to show
    creativity in how they collaborate.¹ With sufficient trust, people are better
    able to navigate through uncomfortable conversations and test each other’s assumptions
    without fear of harm. As a result, new perspectives are considered, and conflict
    becomes generative rather than destructive. The network’s ability to engage in
    constructive dialogue and make informed decisions grows as people feel free to
    speak their mind and acknowledge difficult realities or controversial points of
    view.


    This shift has been critical to the success of the Clean Electronics Production
    Network (CEPN), a program of Green America’s Center for Sustainability Solutions,
    which has been supported by both Converge and the CoCreative consulting group.
    Participants of the CEPN include many major technology brands and environmental
    NGOs that are working together to address an issue that no single organization
    can solve on its own: moving toward zero exposure of workers to toxic chemicals
    in the electronics manufacturing process. Relationships between the electronics
    brands and NGOs were initially tense when the network launched in 2016. But over
    the past few years, “members have gotten to a point where they have enough trust
    to where they’re willing to share what’s working, what’s not working, and where
    they need help,” shares Pamela Brody-Heine, director of the CEPN. “Relationships
    have been transformed, and the communication between them is much more productive.”²


    When working through networks, the time you spend cultivating relationships of
    trust is the greatest investment you can make—consider it a “return on relationships.”
    But before people are able to develop trust, they first need to be connected.
    New connections can be fostered through the practice of weaving.


    ### Weaving Connections


    There is an old saying, “The best fertilizer is the footsteps of the farmer.”
    In other words, it is the farmer’s constant presence in the field that makes all
    the difference. The same is true for networks. Leaders tend to a network by connecting
    directly with participants and connecting participants with one another. This
    is the practice of *network weaving*. Like the silk of a spider’s web or the threads
    of a tapestry, networks need to be woven together to develop a strong connective
    tissue that can weather the seasons of change. The concept of network weaving
    has Indigenous roots. The native Andeans understood that we live in a world “where
    we are all interwoven threads and stitches,” and “when we do not impose, control,
    or dominate, but when we allow, respectfully, the expression of the other . .
    . we weave together, without ceasing to be ourselves, now as *jaqui*: partner,
    community.”³


    The people who work to foster relationships across networks are called *network
    weavers*. June Holley, author of *Network Weaver Handbook*, defines network weavers
    as those who explicitly work to make the networks around them healthier and more
    inclusive “by helping people identify their interests and challenges, connecting
    people strategically where there’s potential for mutual benefit, and serving as
    a catalyst” of self-organization.⁴


    The act of weaving together a community — of stitching together individual parts
    into a larger whole — is the work of everyone in a network. All network participants
    have the opportunity and responsibility to weave new connections. This can be
    accomplished by taking the time to get to know people, introducing people to each
    other, listening deeply, and inviting others to collaborate in a variety of ways.


    Still, it is especially important for network leaders — and specifically, for
    those fulfilling the weaver role — to maintain a deliberate focus on creating
    connections across the whole network. By first connecting with participants, and
    then connecting participants with one another, weavers sense and anticipate the
    energy of the group while fostering greater levels of self-organizing.


    ### Connecting with Participants


    Network weavers aim to connect with as many participants as possible, as frequently

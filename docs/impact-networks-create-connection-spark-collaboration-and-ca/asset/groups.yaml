    **Leverage points:** Places where targeted intervention can produce outsized impacts
    throughout a system.


    **Resilience:** The ability to withstand disruption and adapt as conditions change.


    **System:** A group of interacting or interdependent parts that together form
    a larger whole.


    **Systems change:** The process of reforming or transforming the structures, relationships,
    policies, power dynamics, narratives, and norms in a given system to create positive
    social or environmental effects.



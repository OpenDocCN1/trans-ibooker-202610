    # Creating Transformation


    In *Change for the Audacious*, Steve Waddell outlines three strategies to create
    change: incrementally, through reformation, and through transformation.[^9] Incremental
    change seeks to improve performance within the existing rules of the system. It
    involves building on the things that are already happening and sharing learnings,
    experiences, capacity, and expertise. This can be achieved by coordinating actions
    across a network, as outlined in the previous chapter.


    Fundamentally changing systems, however, requires reformation or transformation.
    Reformation aims to change the way a system works, altering its rules, structures,
    beliefs, and behaviors. Transformation is the work of creating a new system altogether.
    While identifying and acting on critical leverage points may chart a path toward
    reformation or transformation, there are two other particularly potent strategies
    that a network may pursue: shifting social norms and growing a movement. In both
    cases, impact networks are powerful catalysts.


    # Shifting Social Norms


    Social norms are the unspoken rules of behavior that keep the current system intact.
    On their own, most norms are not inherently good or bad. However, norms can be
    harmful if they are not explicitly named and proactively chosen.


    > As Kenneth Jones and Tema Okun write in their *Dismantling Racism* workbook,
    “Many of our organizations, while saying we want to be multicultural, really only
    allow other people and cultures to come in if they adapt or conform to already
    existing cultural norms. Being able to identify and name the cultural norms and
    standards you want is a first step to making room for a truly multicultural organization.”[^10]
    When norms remain unacknowledged, they reinforce aspects of the dominant culture
    that can'
  - '[PAGE 158]


    suppress diverse ways of knowing, inhibit expression, and violate the dignity
    of those from nondominant groups.


    For example, in the United States, as well as in many other parts of the world,
    dominant values born from a culture of white supremacy and capitalism, such as
    individualism, competition, and structure, lead to social norms such as dependence
    on a singular leader, emphasis on individual achievement, and reliance on predictable
    rules (written and unwritten).

    When these norms exist as the unexamined default for an organization or network,
    contrasting norms — such as lifting up collective efforts, promoting inclusive
    both-and thinking over polarizing either-or thinking, and embracing emergence
    — are minimized or excluded.


    An essential practice for impact networks, then, is to consciously choose and
    live into norms that reflect a network mindset and promote their values and principles.
    When this happens, it can change everything about how a system operates. “Shifting
    our way of being is our tangible outcome,” says Taj James of Movement Strategy
    Center. “Systems change comes from big groups making big shifts in being.”¹¹


    Early in its development, the leaders of Resonance Network made the decision not
    to replicate hierarchical ways of doing things. Dominant hierarchical norms were
    in direct conflict with its vision for a world rooted in deep relationship, vibrant
    community, and connection to the planet. The network way of working took some
    time for people to get used to, but it paid off in the end. “At first, people
    were looking for who’s in charge, looking for top-down decision-making,” remembers
    Alexis Flanagan, a leader of the network. “There were some trade-offs — we built
    more slowly and more intentionally than a lot of stakeholders would have liked
    us to — but it was necessary for us to establish the culture and the practices
    that have benefited us and gotten us to where we are right now.”


    Shifting more fully into new social norms requires ongoing attention. “We constantly
    come back to deep, deep reflection on habits, and what we can practice instead,”
    says Flanagan. “We believe that intentional practice is a way to interrupt these
    habits and transform them.”¹²


    Once a network has done the work of articulating and shifting its own social norms
    in practice, it can turn its attention toward helping replicate those new norms
    throughout the larger systems of which it is a part.'

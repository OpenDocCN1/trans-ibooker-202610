    \ Kimmerling、Marty Kooistra、Allen Kwabena Frimpong、Jeff Leitner、Philip Li、Valentin\
    \ Lopez、Michelle Medley-Daniel、Talia Milgrom-Elcott、Kellyx Nelson、Curtis Ogden、Steve\
    \ Pantilat、Arlene Rodriguez、Ruth Rominger、Dylan Skybrook、Chris Spohrer、Emily Troisi、Jane\
    \ Wei-Skillern、Liz Wilson 和 Bethany Young Holt。\n\n最后，感谢所有通过他们的工作和著作教给我很多的领导者和变革者。其中一些人列在书目中，书目中也列出了我在本书开发过程中主要参考的作品。当然，也感谢亲爱的读者抽时间阅读。我希望你未来多年都能继续从中受益。\n\

    that even if they made tremendous progress on advancing clean energy in the region,
    the results would come nowhere close to what was necessary to fundamentally shift
    the system. Consequently, they expanded their focus to reduce greenhouse gas pollutants
    in multiple ways, including advancing clean energy and energy efficiency, shutting
    down coal plants, and capping carbon.


    Early on, RE-AMP was extremely successful, passing energy-efficiency policies
    in multiple states and preventing the buildout of coal plants that had previously
    been seen as inevitable. These successes led to the rapid growth of the network.
    But in years five through seven, between 2008 and 2010, the effort hit a roadblock.

    organization can solve on its own: moving toward zero exposure of workers to toxic
    chemicals in the electronics manufacturing process. Relationships between the
    electronics brands and NGOs were initially tense when the network launched in
    2016. But over the past few years, “members have gotten to a point where they
    have enough trust to where they’re willing to share what’s working, what’s not
    working, and where they need help,” shares Pamela Brody-Heine, director of the
    CEPN. “Relationships have been transformed, and the communication between them
    is much more productive.”²


    When working through networks, the time you spend cultivating relationships of
    trust is the greatest investment you can make—consider it a “return on relationships.”
    But before people are able to develop trust, they first need to be connected.
    New connections can be fostered through the practice of weaving.


    # Weaving Connections


    There is an old saying, “The best fertilizer is the footsteps of the farmer.”
    In other words, it is the farmer’s constant presence in the field that makes all
    the difference. The same is true for networks. Leaders tend to a network by connecting
    directly with participants and connecting participants with one another. This
    is the practice of *network weaving*. Like the silk of a spider’s web or the threads
    of a tapestry, networks need to be woven together to develop a strong connective
    tissue that can weather the seasons of change. The concept of network weaving
    has Indigenous roots. The native Andeans understood that we live in a world “where
    we are all interwoven threads and stitches,” and “when we do not impose, control,
    or dominate, but when we allow, respectfully, the expression of the other . .
    . we weave together, without ceasing to be ourselves, now as *jaqui*: partner,
    community.”³



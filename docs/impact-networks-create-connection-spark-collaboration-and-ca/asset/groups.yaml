    The act of weaving together a community — of stitching together individual parts
    into a larger whole — is the work of everyone in a network. All network participants
    have the opportunity and responsibility to weave new connections. This can be
    accomplished by taking the time to get to know people, introducing people to each
    other, listening deeply, and inviting others to collaborate in a variety of ways.


    Still, it is especially important for network leaders — and specifically, for
    those fulfilling the weaver role — to maintain a deliberate focus on creating
    connections across the whole network. By first connecting with participants, and
    then connecting participants with one another, weavers sense and anticipate the
    energy of the group while fostering greater levels of self-organizing.


    # Connecting with Participants


    Network weavers aim to connect with as many participants as possible, as frequently
    as is needed. The purpose of these interactions is to learn more about all of
    the participants, including what they care about, what they’re working on, how
    they’d like to communicate, and how they’d like to contribute to the network.
    These conversations build trust while surfacing opportunities to connect participants
    together to advance shared learning or action. They also help leaders and participants
    alike to develop a more holistic awareness about what’s happening across the network
    and to highlight issues that require special attention. Visit the Converge Network
    Toolkit for a list of Network Weaving Questions that weavers can use in their
    conversations with participants.



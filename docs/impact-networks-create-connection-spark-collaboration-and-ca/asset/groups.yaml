    ## 第二部分

    ## 培育影响力网络


    ## 第五章

    ### 明确目标与原则


    > *目标不是具体的客观指标，也不是使命宣言——目标是人们共同希望成为什么样的一种清晰表达。而原则也不是老生常谈——它是关于你打算如何行事以实现该目标的基本信念……*

    >

    > *在多大程度上你共同秉持目标与原则，就能在多大程度上摆脱指挥与控制。*

    >

    > ——迪·霍克（DEE HOCK），*EnlightenNext* 采访


    培育影响力网络的第一步，是明确该网络是否应该存在以及为何存在。有时这种需求显而易见，特别是对于那些在该领域工作了多年的人来说。但其他时候可能需要一些调查。无论哪种情况，都需要特殊的人或群体来识别网络的潜力，并投入时间和资源帮助其形成。我们将这些人称为*网络催化剂*。催化剂是那些推动新网络启动的远见者。


    ### 催化新网络


    催化剂形式多样。以第一章中描述的圣克鲁斯山脉管护网络（Santa Cruz Mountains Stewardship Network）为例，最初的催化剂是加利福尼亚州最古老土地信托机构的执行主任、Sempervirens基金会的里德·霍尔曼（Reed
    Holderman）。凭借多年的实地工作，霍尔曼认识到地区性组织在土地管理和管护活动方面需要更紧密的合作。在退休前的最后行动中，他召集了一个由领导组成的初始团队，探讨他们的组织如何能在该区域更有效地协作。霍尔曼还筹集了足够的种子资金，帮助启动该网络。


    第一章中同样提到的多功能预防技术倡议（IMPT），最初是由贝萨尼·扬·霍尔特（Bethany Young Holt）催化的，她是一位非营利领导者，受连接碎片化的MPT（多功能预防技术）领域的需求所启发。霍尔特组织了一次利益相关者会议，参与者从事HIV预防、性传播疾病（STI）预防以及避孕药具研发工作，随后利用其组织CAMI
    Health的资源，帮助他们相互分享信息和协调行动。


    对于第二章中提到的谷歌食品实验室（Food Lab at Google），主要的催化剂是米歇尔·巴克尔（Michiel Bakker），他是一位组织新成员，看到了调动谷歌内部及外部行动者以解决复杂粮食系统问题的机会。在另一个例子中（第九章描述），UCSF
    Health姑息治疗项目主任史蒂夫·潘提拉特（Steve Pantilat）催化了护理协调网络（Coordination of Care Network），以连接12个站点和10个医疗学科，从而为整个医疗系统中的重症患者提供更全面、协调的姑息治疗。


    基金会有时也处于有利位置，能够助力点燃新网络。例如，加菲尔德基金会（Garfield Foundation）通过召集一群资助者和倡导者，采取系统性方法解决中部的环境问题，从而催化了RE-AMP网络。同样，罗伯特·斯特林·克拉克基金会（Robert
    Sterling Clark Foundation）催化了斯特林纽约市网络（Sterling Network NYC），支持公共、私营和社会部门的领导者共同合作，以提高该市五个行政区的经济流动性。


    几乎任何人都可以是催化剂——只要他们拥抱网络思维。践行网络思维意味着分享领导权而非寻求控制事务，展现谦逊，并表现出对网络目标的真诚承诺。这一点尤为重要。如果催化剂未能获得足够的信任和对该事业的承诺，参与者就会质疑他们是在“为影响力组织还是为自我”，正如危机行动组织（Crisis
    Action）的尼克·马特卢（Nick Martlew）所言，该组织是一个由多个机构共同合作以保护平民免受武装冲突影响的催化剂和协调者。¹ 催化剂赢得参与者信任的最清晰方式是将其焦点保持在目标中心，而非其自身利益。受信任的催化剂是深思熟虑且高诚信的人——他们
    consistently 分享权力、将功劳让给他人，并提升他人。


    ### 探索网络的潜力


    如果看起来需要提高个人和组织之间的连接水平以推进复杂问题的解决，你可以通过以下步骤催化一个新的影响力网络：


    ### 1. 理解系统，并在现有基础上建设


    首先，通过研究来理解真正发生的事情。这意味着与许多参与该问题的不同人群进行对话。哪里有共同点？哪里有分歧？是否有共同的目标能将人们凝聚在一起？从事这项工作的人是否看到了加强连接和合作的需求或机会？通过公平性视角审视这项工作。系统为何是现在的样子？谁拥有权力，谁没有？这项工作应该以什么为中心？哪些人和观点在历史上或当前处于代表不足或被边缘化的状态？


    在着手启动新网络之前，应着眼于支持和建立在开展工作。与其创造新的、重复的东西，不如跟随潜在参与者的领导。当网络自下而上地强加，忽视现有举措，且未能纳入基层工作时，网络可能会带来危害。


    ### 2. 组织一次探索性聚会


    如果明显需要增加联系、协调和合作，且目前没有可行的工作可供你合作，下一步是邀请来自系统各处的人探索影响力网络的潜力。管护网络（Stewardship Network，注意不要与圣克鲁斯山脉管护网络混淆）是一个运动网络，帮助催化美国各地社区中以管护为重点的其他网络，它组织为期一天的“探索可能性研讨会”，以确定是否有对新网络的需求和愿望。虽然有时通过邀请组织此类聚会是合适的，但在此阶段，向任何感兴趣的人发出公开邀请也可能非常有力。“在桌上留出空间是我们工作的重要组成部分，”管护网络创始人丽莎·布拉什（Lisa
    Brush）说。“随着时间的推移，主要的一群人不断出现，群体开始凝聚。”²


    在那次探索性聚会上，讨论以下问题：³


    - 我们为什么要启动这个网络？

    - 我们为什么*不*应该启动这个网络？

    - 我们可以处理哪些可能的问题？

    - 还有哪些人应该参与？


    然后，在聚会接近尾声时，询问：


    - 我们是否应该继续？

    - 如果是，你有多大兴趣参与？（请参阅第十章了解人们可选择的四个参与层级。）


    如果似乎没有太多能量或兴趣，此时创建影响力网络可能不是正确的做法。尽管如此，即使没有组织化的影响力网络，你仍可以继续努力促进系统内的连接。你可以介绍从事类似问题的人，或创建新的沟通渠道，让人们分享信息。加强任何人类系统中存在的潜在连接网络几乎总是一项值得的练习。在许多情况下，明智的做法是先非正式地加强联系，并衡量人们进一步参与的意愿，然后再投入额外资源建立正式网络。


    ### 3. 组建设计团队


    催化剂职位伴随着真实的权力，这种权力需要在初始阶段得到明确承认。这不是一个可以轻视的角色。特别是，这种权力体现在对网络目标的初步表述以及邀请人们参与的方式中。使培育新网络的过程更加公平的最佳方式之一，是通过组建多元化的*设计团队*与他人分享这种权力。


    设计团队成员致力于服务于网络目标及未来参与者的利益，负责管理网络的发展。他们由来自系统不同部分的代表组成，共同明确为何需要网络以及需要涉及谁。这个小而深思熟虑的群体应能代表多种观点，并从不同视角发声。


    设计团队的首要任务是将从探索性会议中听到的内容提炼为新网络的连贯叙事。在此过程中，他们可以明确目标草案。虽然网络的目标——其存在的原因——可能会随时间演变，但最初将人们聚集在一起通常需要一个高级别的初始声明，说明他们被邀请解决的问题或机遇。设计团队还将考虑需要什么类型的网络，以及网络参与可能如何限定。


    最重要的是，他们将回答组织初步聚会所需的问题：谁需要参与？我们如何邀请人们加入？聚会将在哪里举行？我们在聚会上可能需要处理哪些主题？谁将设计和引导聚会？他们还可能考虑聚会后网络如何推进，包括网络如何结构化、可使用何种沟通系统、如何获得资源、谁可能提供持续协调等。


    与目标一样，这些初步考虑将在参与者聚集时得到完善，但准备好草案供网络响应比让新兴网络从头开始开发要有帮助。当设计团队完成了为网络启动打下坚实基础所需的思考工作后，就是组织初步聚会的时候了。



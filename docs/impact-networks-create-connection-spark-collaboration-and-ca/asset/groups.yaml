    # Stay Emergent with Intention


    No agenda is likely to survive contact with reality. As a network facilitator,
    you have to be ready to adapt on your feet, sensing into where the energy is and
    what needs to happen next. At the same time, network facilitation shouldn’t be
    so loose that conversations are scattered. It’s a delicate balance of being open
    to emergence while being deliberate about closing conversations to move things
    forward.


    In *Facilitator’s Guide to Participatory Decision-Making*, Sam Kaner points out
    that groups in conversation typically need to move through a process of generating
    divergent and creative ideas before converging and arriving at a decision point.¹⁸
    As facilitators, we give groups the space to sense their way through these conversations
    and the autonomy to shift from one conversation to the next. But before moving
    on to a new topic, we check to see if the first conversation can be closed with
    clarity—which may simply be a next step. If a conversation cannot be closed, we
    have the group acknowledge that they are purposefully shifting the focus of the
    discussion.


    # Lead with Humility


    The role of the facilitator has inherent power. Facilitators usually have the
    final say over the agenda, they orchestrate the flow of the conversation, and
    they can influence who speaks and when. The act of facilitating is an act of exercising
    power. Network facilitators use that power thoughtfully to make the gathering
    as welcoming, equitable, and open to shared leadership as possible.


    As a facilitator, first examine your own privilege and implicit biases and acknowledge
    the power that comes with the role. Then, invite participants to provide candid
    feedback if they recognize opportunities to make the space more inclusive. If
    you come from a dominant cultural group, it is'

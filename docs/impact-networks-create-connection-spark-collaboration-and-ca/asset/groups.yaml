    # A Cross-Sector Action Network to Steward the Land


    In late 2014, a group of leaders from major land-owning and land-managing organizations
    in the Santa Cruz Mountains region realized that although they were all committed
    to caring for the area’s natural resources, spanning 500,000 acres, they were
    not working together on a scale that would be necessary for the landscape to thrive
    over time. With the mission of increasing coordination across the region, they
    launched the Santa Cruz Mountains Stewardship Network (SCMSN) and hired Converge
    to guide the network’s development, facilitate its initial convenings, and hire
    and train a full-time coordinator who could support the network into the future.


    Today the SCMSN is an action network connecting more than twenty groups, including
    government agencies, land trusts, nonprofits, research institutes, timber companies,
    and a Native American tribal band. These groups, who collectively own or manage
    the majority of land across the region, have come together around a shared purpose
    of helping to “cultivate a resilient, vibrant region where human and natural systems
    thrive for generations to come.”7


    As an action network, the SCMSN incorporates and builds on the qualities of a
    learning network by facilitating the flow of information and knowledge sharing
    between organizations. At the same time, it also supports members’ collaboration
    with one another to influence conservation outcomes throughout the region. For
    example, the network has advanced a multimillion-dollar vegetation mapping project,
    providing land managers with valuable data to help direct their stewardship efforts.
    Another collaborative effort sparked by the SCMSN, and advanced by an even larger
    movement network of which it is a part (called the California Landscape Stewardship
    Network), has led to a major “cutting green tape” initiative that is substantially
    improving permitting and efficiencies in funding for'

    # 关于作者


    ![](img/4854536a9a7bcce4fd5250605cae8350_232_0.png)


    **David Ehrlichman** 是 Converge ([converge.net](http://converge.net)) 的联合创始人和协调人。与他的同事们一起，他支持了数十个影响力网络的发展，这些网络在经济流动性、人权、科学获取和医疗保健改革等多样化议题上采取行动。


    在催生 Converge 之前，David 是 Monitor Institute 的顾问，在那里他首次认识到网络的力量。他居住在华盛顿州西雅图附近，位于海岸萨利什人的传统土地上，具体为
    Stillaguamish 和 Suquamish 部落。


    当他不写作或与网络合作时，你通常会发现他与家人朋友共度时光、在大自然中，或演奏音乐。他与妻子 Nabetse、两只傻狗和他刚出生的女儿一起生活——在他出版本书时女儿三个月大。


    你可以通过 **ehrlichman@converge.net** 联系 David。


    # 关于 Converge


    ![](img/4854536a9a7bcce4fd5250605cae8350_233_0.png)


    **Converge** 是一个由系统战略家、设计师、促进者、教育者和评估者组成的网络，致力于共同创造积极影响。我们专门支持有使命感的个人和组织，通过网络方法实现协作。


    作为一个网络，我们本身就是致力于网络领导力的实践者活实验室。为了了解我们最新的文章、资源和学习机会，欢迎访问 converge.net 并订阅我们的邮件列表，获取免费工具和促进指南库，以支持您的网络。


    如需与 Converge 联系，请写信至 connect@converge.net。我们很乐意了解网络的鼓舞人心的案例、您工作中使用的美好实践，以及我们如何帮助传播影响力网络的力量。


    ![](img/4854536a9a7bcce4fd5250605cae8350_234_0.png)


    **Berrett-Koehler** 是一家独立出版商，致力于一个雄心勃勃的使命：*连接人与思想，创造一个对所有人都有效运作的世界。*


    我们的出版物涵盖多种格式，包括印刷、数字、音频和视频。我们还提供在线资源、培训和聚会。我们将继续扩展我们的产品和服务以推进我们的使命。


    我们相信，世界问题的解决方案将来自我们所有人，在各个层面共同努力：在我们的社会、我们的组织和我们自己的生活中。我们的出版物和资源为创造一个更公正、更公平、更可持续的社会提供了途径。它们帮助人们使自己的组织更具人性化、民主化、多元化和有效性（我们认为这之间没有任何矛盾）。它们指导人们在自己的生活中创造积极变化，并使个人实践与对更好世界的愿望保持一致。


    我们力求身体力行，这就是我们所说的“BK 之道”。这种方法的核心是*管理*，即对为所有利益相关者群体谋福利而管理公司承担深切责任，包括作者、客户、员工、投资者、服务提供商、销售合作伙伴以及我们周围的社区和环境。我们所做的一切都围绕着管理以及我们的其他核心价值观*质量、合作、包容*和*可持续性*构建。


    这就是为什么 Berrett-Koehler 是第一家既是 B 机构（严格认证）又是公益公司（营利性法律地位）的图书出版公司，这两者共同要求我们遵守最高的企业、社会和环境绩效标准。这也是为什么我们建立了许多开创性实践（您可以在
    www.bkconnection.com 了解），包括 Berrett-Koehler 宪法、BK 作者权利与责任宣言，以及我们独特的作者日。


    我们感谢我们的读者、作者和其他朋友对我们使命的支持。我们请您在 www.bkconnection.com/impact 与我们分享 BK 出版物和资源如何在您的生活、组织和社区中产生影响的例子。


    亲爱的读者，


    感谢您拿起这本书，欢迎加入全球 BK 社区！您加入了一个特殊的群体，他们共同努力在自己的生活、组织和社区中创造积极变化。


    # BK 到底是什么？


    我们的使命是连接人与思想，创造一个对所有人都有效运作的世界。


    为什么？我们的社区、组织和生活被自私、排斥、等级和特权的旧范式所困住。但我们相信情况可以改变。这就是为什么我们寻找这些挑战的领先专家——并与您分享他们的可操作想法。



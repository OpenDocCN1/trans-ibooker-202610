    # ## Networks for Impact


    To illustrate how impact networks develop and create change over time, we look
    to two examples: the Initiative for Multipurpose Prevention Technologies, a global
    learning network focused on reproductive health; and the Santa Cruz Mountains
    Stewardship Network, a cross-sector action network dedicated to protecting the
    ecological and cultural heritage of a 500,000-acre region in California.


    # ## A Global Learning Network to Advance Sexual and Reproductive Health


    The Initiative for Multipurpose Prevention Technologies (IMPT) brings together
    researchers, product developers, funders, policy makers, and advocates to advance
    sexual and reproductive health for women and girls worldwide through the development
    of multipurpose prevention technologies, or MPTs. MPTs are an innovative class
    of combination products designed to simultaneously prevent HIV, other sexually
    transmitted infections (STIs), and/or pregnancy.'
  - '[PAGE 28]


    Prior to the network’s formation, work on broad-spectrum sexual and reproductive
    health was fragmented. To connect the field, the nonprofit organization CAMI Health
    convened stakeholders working on HIV prevention, STI prevention, and contraceptive
    development for the first time (convenings are gatherings that bring all network
    members together simultaneously). The founding participants of the IMPT realized
    that there was an opportunity to develop single products that could address multiple
    risks concurrently by building upon decades of work in these traditionally siloed
    but interlinked areas.


    At the time, “MPTs were a budding idea gaining some conversational interest, particularly
    in the microbicide and family planning fields,” says Bethany Young Holt, executive
    director and founder of CAMI Health. “But there was no organizing body poised
    to move MPTs from a concept to a reality.” As a result of the 2009 convening,
    the IMPT network was launched to help facilitate the progress of the MPT field.³


    As a learning network, the IMPT focuses primarily on connecting participants and
    accelerating the flow of information in, out, and across the network to facilitate
    learning. The network gathers relevant information in from participants and a
    variety of external sources, using a shared database to organize field-relevant
    data. It then organizes and distributes that information back out to participants
    through a newsletter, publications, webinars, social media, and network calls.
    It also enables the flow of information across the network, directly from person
    to person, by organizing meetings, facilitating conversations on specific topics,
    and maintaining an online communication system. Through these multiple channels,
    researchers and advocates from around the world are sharing critical research,
    learning from one another’s work, and coordinating their efforts to advance the
    development of MPTs.


    The IMPT grew through the four stages illustrated in figures 1.1 through 1.4.
    These stages, first defined by June Holley and Valdis Krebs in their seminal paper
    Building Smart Communities Through Network Weaving, and re-created by Kumu, a
    data visualization platform specializing in network mapping, represent how connections
    proliferate during a network’s formation.⁴'
  - '[PAGE 29]


    When systems are disconnected, they resemble Stage 1, Scattered Fragments, shown
    in figure 1.1. In this stage, some people know and interact with each other, but
    overall the whole system remains fragmented. People are represented by nodes (also
    known as elements or actors), and the connections between them are represented
    through links (also known as edges or ties). The groups within which some connections
    do exist are called clusters (also known as communities). Clusters are groups
    of people that are much more connected with each other than they are with those
    from other parts of the system.



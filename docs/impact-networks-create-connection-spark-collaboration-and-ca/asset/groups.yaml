    # Listening with Care


    Sharing stories is as much about listening as it is about storytelling. Trust
    develops when participants deeply hear and empathize with each other, holding
    each other’s story with respect.


    Merely listening attentively is insufficient, because it means you are staying
    in your own frame of reference, hearing the other person’s words as colored by
    your own filters and inferences. Instead, *empathetic listening* is what’s needed
    to hold your own biases at bay (as much as possible) and to more fully understand
    the world as another person sees it.[^18] When you listen empathetically, the
    mirror neurons in your brain light up such that you physiologically experience
    the things the storyteller is describing.[^19]


    Meanwhile, listening with great care also has the power to create safety and change
    the conversation itself. Good listening affects not only the listener but also
    what the speaker shares. When people feel heard and held, they are more likely
    to feel comfortable in showing vulnerability, which can open the door for a deeper
    connection. The experience of understanding more about another person’s inner
    context through empathetic listening, and simultaneously the experience of being
    fully heard, bonds people together like almost nothing else.



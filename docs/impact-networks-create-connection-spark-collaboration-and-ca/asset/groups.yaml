  - '[PAGE 17]


    “Change is coming whether you like it or not,” cautions climate activist Greta
    Thunberg.$^1$ The great uncertainty is what the world will look like on the other
    side.


    # Our Complex World


    One way to think about multifaceted and systemic issues, whether addressing climate
    change, community health, or homelessness, is that they are not merely complicated—they
    are *complex*. The Cynefin framework is helpful in differentiating simple, complicated,
    complex, and chaotic issues:$^2$


    **Simple issues** can be definitively solved, with a clear beginning and end,
    such as cooking a meal.


    **Complicated issues** involve many moving parts, but they can be defined and
    understood. They are technical in nature, with predictable solutions that can
    be implemented effectively by people with the right expertise.$^3$ Planning and
    implementing the logistical operations for an event is complicated but not complex.


    **Complex issues** are difficult to define, as they have no clear beginning or
    end. They also have no readily apparent solution, and we cannot accurately predict
    the path ahead. Consequently, we have to be able to adapt to changing circumstances
    and modify strategies as we learn what works and what does not. An example of
    a complex challenge is equitably eliminating greenhouse gas emissions across a
    large region. We will return to this issue later.


    **Chaotic issues**, like their complex counterparts, cannot be accurately predicted
    or controlled. They are also turbulent, dangerous, and rapidly evolving. Chaotic
    situations—such as a humanitarian disaster—often require that we act quickly to
    save lives or tend to emergencies before working to establish some sense of order.
    They call for a rapid response to distribute information and resources to where
    they are needed most, before addressing the underlying issues.


    To a large extent, humans have mastered simple issues, and organizations and institutions
    have excelled at addressing complicated issues with their efficient and reliable
    structures. However, in this “century of complexity,”$^{3,4}$ the approaches we
    have used to address simple and complicated issues are falling short when it comes
    to dealing with complex (and chaotic) issues. What got us here is not going to
    get us to where we'
  - '[PAGE 18]


    need to go. “A new type ofs accordingly.


    *To address the challenges of our time, we must embrace complexity and work collaboratively
    across systems of diverse stakeholders, even and especially when the path forward
    is unclear.* It is not an overstatement to say the future of civilization and
    the planet depends on it.


    Most people love the *idea* of collaboration . . . as long as it promises to do
    exactly what they want it to do. But that is not how collaboration works. Collaboration
    (as we talk about it) is not forced or coerced. It requires you to give up control.
    And because it’s not predetermined, it requires you to give up certainty.


    Working with others forces us to have our assumptions challenged and our patience
    tested. It often leads to personal and professional disagreements about the right
    thing to do. It may require forging alliances across philosophical divides. It
    pushes us to be comfortable with ambiguity. It can involve partnering not just
    with individuals but with their organizations and institutions, which have their
    own self-interest to protect and layers of hierarchy to manage.


    In our era of complexity, we need ways of working together that span our traditional
    boundaries. We need collaborative structures that are flexible enough to shift
    on a moment’s notice, that are resilient enough to withstand turbulence and disruption,
    and that bring people together as equals to share leadership and decision-making.


    Fortunately, whether we are aware of it or not, we have already evolved methods
    of coordinating actions across many different stakeholder groups. From the title
    of the book, you can probably guess what they are. Networks!'
  - '[PAGE 19]


    # Organizing for Complexity


    Humans have always formed networks. Our social networks grow whenever we introduce
    our friends to each other, when we move to a new town, or when we congregate around
    a shared set of beliefs. Social networks have shaped the course of history. Historian
    Niall Ferguson has noted that many of the biggest changes in history were catalyzed
    by networks—in part, because networks have been shown to be more creative and
    adaptable than hierarchical systems.⁶


    Ferguson goes on to assert that “the problem is that networks are not easily directed
    towards a common objective. . . . Networks may be spontaneously creative but they
    are not strategic.”⁷ This is where we disagree. While networks are not inherently
    strategic, they can be *designed* to be strategic.


    When deliberately cultivated, networks can forge connections across divides, spread
    information and learning, and spark collaborative action. As a result, they can
    “address sprawling issues in ways that no individual organization can, working
    toward innovative solutions that are able to scale,” write Anna Muoio and Kaitlin
    Terry Canver of Monitor Institute by Deloitte.⁸ Networks can be powerful vehicles
    for creating change.


    Of course, networks can have positive as well as negative effects. Economic inequality
    and the advantages and disadvantages of social class, race, ethnicity, gender,
    and other aspects of individual identity are in large part the result of network
    effects: certain types of people form bonds that increase their social capital,
    typically at significant social expense to those in other groups. Much of the
    world has become acutely aware of the harmful network effects arising from social
    media and the internet. This includes the proliferation of online echo chambers
    that feed people what they want to hear, even when it means rapidly spreading
    misinformation.


    In our globally connected and interdependent society, it is imperative that we
    understand the network dynamics that influence our lives so that we can create
    new networks to foster a more resilient and equitable world. The choice in front
    of us is clear: either we can let networks form according to existing social,
    political, and economic patterns, which will likely leave us with more of the
    same inequities and destructive behaviors, or we can'
  - '[PAGE 20]


    deliberately and strategically catalyze new networks to *transform* the systems
    in which we live and work.


    A case in point is the RE-AMP Network, a collection of more than 140 organizations
    and foundations working across sectors to equitably eliminate greenhouse gas emissions
    across nine midwestern states by 2050. From the time it was formed in 2015, RE-AMP
    has helped retire more than 150 coal plants, implement rigorous renewable energy
    and transportation standards, and re-grant over $25 million to support strategic
    climate action in the Midwest. RE-AMP’s work is necessary in part because other
    powerful networks are also at play to maintain the status quo or to enrich the
    forces that profit from pollution and inequality.


    We can look to the field of education for another example of a network creating
    significant impact. 100Kin10 is a massive collaborative effort that is bringing
    together more than three hundred academic institutions, nonprofits, foundations,
    businesses, and government agencies to train and support one hundred thousand
    science, technology, engineering, and math (STEM) teachers across the United States
    in ten years. Founded in 2011, 100Kin10 is well on track to achieve its ambitious
    goal and has expanded its aim to take on the longer-term systemic challenges in
    STEM education.


    The Justice in Motion Defender Network is a collection of human rights defenders
    and organizations in Mexico, Guatemala, Honduras, El Salvador, and Nicaragua that

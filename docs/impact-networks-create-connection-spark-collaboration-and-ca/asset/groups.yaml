    and actions. For example, one of the network’s five principles states participants’
    mutual commitment to “honor communities’ priorities.”²⁰ As you might imagine,
    this is a big shift for a field whose priorities have historically been determined
    by major institutions. LISTEN’s purpose and principles are captured in its network
    charter, a formal but not legally binding document that is agreed upon by each
    participant.


    According to Erica Kimmerling, the network’s sole coordinator, having clear principles
    captured in a charter gave her “permission to push the edge and hold the network
    accountable to the things it agreed were important.” When the murder of George
    Floyd sparked a national conversation on anti-Black racism, Kimmerling referenced
    back to the charter and their acknowledgment “that unless we explicitly name and
    challenge systemic structures of exclusion . . . our work will reinforce them.”
    In this context, she was able to convene the network to discuss issues of systemic
    racism in science engagement. Because the network had already done the hard work
    of defining its principles, Kimmerling could raise up an area where additional
    work needed to be done.²¹


    Many approaches may be used to clarify and build agreement around a network’s
    principles. For an existing network, the following approach works well.²² First,
    share and listen deeply to stories of “a time you saw or experienced our network
    operating at its best.” Then enter into a dialogue to identify themes that bubbled
    up from the stories, and see if you can name a handful of values and associated
    principles. Perhaps *learning* stood out as a shared value. You would then ask,
    “Where did you hear practices and behaviors associated with *learning*?” Responses
    may include, for example, “listening to understand many points of view, being
    willing to experiment, or adapting quickly when conditions changed.” Through this
    process, you can tease out the network’s principles based on participants’ lived
    experiences. A modified process can be used if the network is just forming, reframing
    the story-sharing prompt to elicit “a time you experienced or saw a collaborative
    effort that worked very well.”



    is trust-based relationships among participants. Many collaborative efforts ultimately
    fail to reach their full potential because they lack a strong relational foundation.”¹¹


    While much energy is directed to make the individual parts of any system more
    effective, people often overlook the opportunity to strengthen the system as a
    whole through the webs of relationships that tie it together. It is quite common,
    for instance, for foundations to invest tremendous resources in individual organizations—and
    expect them to create an outsized impact—without investing in the collaborative
    infrastructure that allows multiple organizations to combine their efforts in
    powerful ways. Time and time again we see that a strong network of relationships
    between individuals and organizations is essential to create systems that are
    resilient, intelligent, and innovative. In the absence of relationships, effective
    collaboration is not possible.



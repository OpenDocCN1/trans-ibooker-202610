    Impact networks provide value in many ways: they coordinate work among different
    actors and across organizations and silos without being controlling or directive;
    they are resilient to disruption, given their decentralized structures; they respond
    to urgent opportunities at a moment’s notice; and they integrate diverse perspectives
    to create new possibilities. By strengthening connection and collaboration across
    divides, impact networks are an essential way of organizing to meet the complexity
    of our world.


    Throughout the remainder of [chapter 1](#), we will explore two case studies in

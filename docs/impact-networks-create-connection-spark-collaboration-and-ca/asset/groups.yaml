    In forming a network, we don’t build trust so that people will like each other
    or agree with each other. Rather, we build trust so that people can disagree and
    still effectively work through conflict.


    Generative conflict—conflict that is constructive rather than destructive—is central
    to progress. Great teams, relationships, organizations, and networks create a
    culture of respect that allows people to safely express disagreement. Think about
    how you solve problems in your own brain—it probably involves weighing competing
    ideas in order to come up with an optimal solution. When groups master the ability
    to explicitly consider multiple sides of an issue in a respectful way, the result
    is faster learning and better decisions.


    One network that embodies this mindset is the Cancer Free Economy Network (CFEN).
    CFEN consists of forty member organizations and a dozen individual members from
    across the environmental and social justice, health, science, policy, legal, labor,
    business, and communications sectors. Together, they are collectively expanding
    the movement to protect people from harmful chemicals, bringing cancer prevention
    to the forefront for many leading cancer and health organizations. What makes
    the network work is “the level of trust and mutual respect and understanding that
    this group has built up over time,” says Debra Erbenerg, the network’s strategic
    director. “There are some very real differences between people who participate
    in terms of their lived experience, their background, their jobs, and the way
    they see the world. But people have come together and agreed on a common goal.
    They genuinely want to hear each other’s perspectives and learn from one another.
    They don’t always agree, but they can respectfully disagree and move things forward
    in a way that is really special.”<sup>20</sup>


    As networks evolve, participants are likely to face a number of important and
    potentially contentious conversations about the network’s strategy, priorities,
    and activities. The moment of truth for participants is whether or not they trust
    each other enough to express feelings of anger or frustration, as well as satisfaction
    and joy, without fear of ridicule or group reprisal.<sup>21</sup>


    Many helpful terms have been introduced to normalize conflict and make it something
    that is accepted, not avoided. Lisa Brush, CEO and founder of the Stewardship
    Network, uses the expression “conflict wisdom.”<sup>22</sup> Jerry'

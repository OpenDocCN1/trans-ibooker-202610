    their heads and into a heart-centered space, creating room for deeper connections
    to form. This is why we often have people offer appreciations at the end of a
    convening, asking them to reflect on “who or what are you appreciating right now?”
    Sharing appreciations in this way serves to reinforce the prosocial behaviors
    that the network wants to promote.



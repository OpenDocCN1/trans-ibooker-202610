    To integrate planning and emergence, we encourage network leaders to remember
    the motto “Deliberate process, emergent results.” Activities can and should be
    intentionally planned, but at the same time we can allow the outcomes of those
    activities to emerge organically. Navigating these two polarities results in what
    we call *planning for emergence*—sensing into the past, present, and future to
    identify and pursue high-potential opportunities while maintaining a spirit of
    experimentation in order to adapt quickly to new information.


    # Divergence and Convergence


    It’s natural for network leaders to focus much of their attention on finding ground
    where people can agree and work together. This is the process of *convergence*—the
    act of bringing ideas together, finding overlapping perspectives, and making selections
    and decisions. But creating space for disagreement is central to generating new
    insights. This is the process of *divergence*—the act of differentiating, of asserting
    independence, and of expressing multiple points of view.


    Entrepreneur and author Margaret Heffernan asks a provocative question: How do
    groups think together? For the most part they don’t, she says. “And it isn’t because
    they don’t want to—it’s really because they can’t, because the people inside of
    them are too afraid of conflict.”¹⁸ In a culture that avoids conflict, dissent
    is discouraged and new ideas are stifled. Only when people are willing to express
    different points of view (divergence) can the full spectrum of insights come to
    light. From this place, groups can begin to see how their ideas fit together (convergence).
    This act of convergence causes new possibilities to arise (emergence) that did
    not previously exist. Divergence allows for convergence, which leads to emergence,
    as shown in [figure 4.2](#figure-4.2). This cycle of divergence and convergence
    is central to how groups come up with ideas, weigh options, and make decisions.
    It is how networks *think*.'

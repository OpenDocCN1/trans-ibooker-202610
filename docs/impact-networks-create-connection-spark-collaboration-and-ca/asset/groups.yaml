    Networks are perfectly positioned to do this, as they are “the primary pathways
    for the spread of new social norms,” according to Damon Centola, sociologist and
    author of *How Behavior Spreads*.^13^


    When networks live the change they wish to see, they can create new patterns of
    behavior that spread outward like ripples on a pond. As new adopters join in,
    they align messaging and further reinforce the growing influence of the network,
    and as a result the change continues to replicate well beyond the initial group.
    Research shows that once 25 percent of the actors in a system have adopted a given
    norm, a tipping point is reached, triggering a shift in the rest of the population.^14^


    Consider the norms that dictate how most hospital systems in the United States
    treat patients with serious illnesses. Seriously ill patients approaching the
    end of life are commonly categorized as requiring hospice, they are kept in the
    hospital as inpatients, and their physical pain is managed with medication until
    they pass away. This was the adopted norm at the UCSF Health system as well. That
    is, until new norms around palliative care were championed by Steve Pantilat,
    MD, and his colleagues.


    Pantilat, founding director of the UCSF Palliative Care Program and president
    of the board of the national Palliative Care Quality Collaborative, knew that
    palliative care involves addressing not only the physical pain that patients experience
    but also the social, emotional, psychological, and spiritual distress that come
    with serious illnesses. To help spread this new norm of care throughout UCSF Health,
    my colleague David Sawyer and I worked with Pantilat to catalyze the Coordination
    of Care Network, an action network that connected the system’s twelve sites and
    ten health disciplines interested in palliative care.


    The network convened dozens of leaders from across the system for the very first
    time. They worked together to build the case for palliative care by demonstrating
    that these new norms for treating seriously ill patients result in dramatically
    better outcomes for both the patients and the hospital system. The network also
    offered palliative care education to providers and identified champions who could
    help boost the profile of palliative care services. While the network was only
    one part of a comprehensive and multiyear effort by Pantilat and colleagues to
    spread palliative care throughout UCSF Health, it played an important role in
    helping to coordinate messaging, engage a broad group of stakeholders, and build
    momentum.


    A few years after the formation of the Coordination of Care Network, UCSF established
    the Division of Palliative Medicine to provide a permanent hub that will continue
    to promote and coordinate palliative care across the health system. In addition
    to its palliative care services, the division provides educational programs for
    both students and clinicians, conducts research to improve the quality of care
    provided to seriously ill patients, and has become a key resource for teams that
    want to establish and grow their own palliative care services. Though there is
    still work to be done, “whole-person palliative care” is quickly becoming the
    norm at UCSF Health, transforming the health care experience of seriously ill
    patients and their families.^15^



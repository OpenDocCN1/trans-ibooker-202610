    ## Reliability


    Choosing to trust people is, in part, a judgment that they will be true to their
    word and follow through on their commitments. Trust grows through action. When
    people help each other by offering support or contributing to a project, it builds
    a foundation of goodwill. And when people prove their reliability time and time
    again by continuing to show up, stick around, and follow through, trust grows
    to a level of resilience that can withstand significant disruption.


    Reliability doesn’t mean that people always have to respond positively to a request
    for support. It’s important that people feel free to decline when they don’t have
    the ability or capacity to help. Without space for “no,” there is no weight behind
    “yes.” Being reliable just means that when you say “yes,” you will do your best
    to follow through and keep others informed if something goes wrong. On the flip
    side, reliability also means that when you decline, others will respect and hold
    you accountable to that “no” as well.


    ## Openness


    Inevitably, in any relationship, miscommunications and moments of tension will
    arise. People may strongly disagree with one another about what to do next. Without
    sufficient trust, these disruptions can derail the relationship and stall action.
    Overcoming these rocky periods requires openness—the willingness to be honest
    and share what’s on your mind, as well as the ability to listen deeply and consider
    new perspectives.


    In the absence of openness, our true emotions and opinions are often guarded or
    hidden under a professional mask. We also remain closed to new information, stubbornly
    holding on to past beliefs and closing off new possibilities. To be open is to
    be willing to share honest thoughts and feelings, even if it’s uncomfortable.
    By being open, we acknowledge interdependence and invite reciprocity. It’s sometimes
    assumed that being open with one another comes later, after trust has been developed,
    but openness is also a great catalyst of trust.


    At times, being open may simply be too risky. This is particularly true for those
    who have been oppressed or experienced significant trauma. They know firsthand
    that people can and do use their power to exploit others for personal gain rather
    than collective good. For this reason, make sure to allow people the space they
    need to engage *or not*, and to honor distance where appropriate. When openness
    is not yet possible, a mutual commitment to care may be a first step.



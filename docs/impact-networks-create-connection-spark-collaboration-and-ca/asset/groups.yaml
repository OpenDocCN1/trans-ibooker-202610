    ## 第六章


    ## 召集人们


    > 世界并不是一次改变一个人而改变的。它随着人们之间关系的网络形成而改变，当人们发现他们拥有共同的事业和对可能性的共同愿景时。


    > ——玛格丽特·惠特利和黛博拉·弗里兹，《利用涌现将社会创新扩展》


    召集人们意味着召集推进网络目的所需的人。人们常常因为被网络的宗旨所激励而加入网络，但他们之所以留下，是因为参与其中的人是谁。一个网络中是谁，可能与网络为何存在一样重要，甚至更为重要。


    ## 邀请共同创造


    当你在影响网络中召集人们时，你就是邀请他们参与共同创造——参与集体探索网络是什么以及它可以成为什么。网络不属于任何人；它们由每个人共享。无论是资深成员还是新成员，都可以自由自组织，以符合其原则的方式推进网络的宗旨。随着新人的贡献，新的可能性就会涌现。


    网络的宗旨和原则可能在新成员到来之前就由初始团体明确定义。这可能非常有帮助——它让人们感受到网络是否是他们愿意贡献的，以及它在成长过程中行动保持连贯。随后，随着新成员加入对话，宗旨和原则很可能会被完善。


    召集人们并不意味着邀请他们加入“你的东西”；它意味着邀请他们共同创造在他们成为团体一部分之后可能实现的事情。每个加入影响网络的人都有机会，也有责任为其发展做出贡献。


    ## 确定召集谁


    邀请谁加入影响网络取决于其宗旨、背景、时机和范围。在考虑要接触谁时，我们往往“出于很多错误的原因——义务、内疚、代表……甚至爱”，adrienne maree
    brown 指出。相反，应召集那些


    - 直接受到该问题影响的人，

    - 在该问题上开展引人注目的工作的人，以及

    - 能推动工作向前发展的人。¹


    从一开始就优先召集多样化的参与者，而不是在努力已经定义之后再进行。谁最先被邀请加入网络，很可能会显著影响最终群体的构成，因为团体成立时存在的社会结构很可能随着时间的推移而保留下来。²
    这可能需要寻找具有不同背景、学科、思维方式和经历的人。一个由系统各部分不同人员组成的设计团队可以在为新网络启动制定周密的遴选流程或邀请名单方面发挥核心作用。


    否则，如果多样性未被优先考虑，以关系为中心的系统很容易变成排他性社区，正如《Nonprofit AF》博客的热门作者 Vu Le 所写，人们自然倾向于只与那些外表、思维和行为与自己相似的人建立联系。“边缘化的人和社区并没有同等的获取关系的机会：关系并非公平分配。”³
    因此，网络领导者——尤其是催化者——可以采取的重要一步，以避免复制不平等模式，就是从一开始就以受问题影响的人为中心，以及那些通常被排除在网络之外的人。这并不意味着“让他们参与”，而是倾听并追随*他们*的领导。因为有些人在充分参与方面面临更多障碍（如时间、金钱、距离、能力以及育儿责任），因此还必须做出有意的努力来确保可及性。


    如果你的网络已经启动，还不算太晚。Food Solutions New England（FSNE）采取的包容性做法就是一个很好的例子。FSNE 是一个行动网络，致力于在六个州范围内打造一个更公平、更有韧性的区域粮食系统。网络最初成立后不久，参与者意识到种族是该地区粮食相关差异的显著预测因素。⁴
    他们还意识到，其主要由白人组成的成员构成并未反映其工作所影响社区的多样性。


    为纠正这一问题，网络任命了一组参与者——并为他们提供津贴——以与新合作伙伴建立有意义的联系。他们自称为“网络大使”，在让代表性不足的社区参与网络方面发挥了关键作用，包括有色人种社区、年轻人以及食品链工人。与此同时，网络还为更多种族多样化的领导创造了空间，并改善了社区努力与网络区域工作之间的协调。


    ## 决定召集多少人


    影响网络的规模因其宗旨、背景和类型而大相径庭。有些人可能认为越大越好——因为人越多，连接就越多，也就意味着影响潜力越大。事实上，“网络效应”告诉我们，随着更多人连接到网络，网络变得更有价值。⁵
    但这一现象只在一定程度上成立。人类和生物网络（比如我们大脑中的神经元网络）尤其被证明存在“断点”，超过该点后网络效应不再成立。这是进一步增长不再有益，网络开始修剪过程、缩小直到达到平衡点的时刻——即该时期的理想规模。最终，正如《Breakpoint》一书的作者
    Jeff Stibel 所证明的那样，网络连接的质量远比其规模重要。⁶


    虽然规模在某些学习网络中不是太大限制，但我们的经验表明，大多数新行动网络启动时应从十二到二十四名参与者开始。我们发现，大多数团体能够进行一次最多约二十四人的对话，尽管这需要周密的设计、精心规划的房间布置和熟练的引导。其他领域专家也持相同观点：“12
    人足够大，可以提供多样化的意见，也足够大，可以容纳一定的神秘感和趣味性，以及建设性的陌生感，”Priya Parker 在《The Art of Gathering》中写道。⁷
    与此同时，adrienne maree brown 使用的指导原则是，有意义的全员对话所需的时间约为每人五分钟。⁸ 鉴于普通人一次只能集中注意力约 90 到
    120 分钟，然后眼睛就会完全呆滞，⁹ 二十四人每人五分钟正好达到上限。


    起初规模较小有助于形成一个更容易就网络形成的关键问题进行审议的团体规模，同时为每个人贡献提供足够的空间。然后，随着网络成形并获得动力，如果需要，它可以变得大得多。RE-AMP
    Network 由十五个组织启动，包括一个基金会，此后已发展到超过 140 个组织，其中包括近二十四个基金会。100Kin10 起初有二十八个合作组织，现在已超过三百个。另一方面，如果网络已经产生你所寻求的影响，可能就不需要变得更大。¹⁰
    Santa Cruz Mountains Stewardship Network 起初有十九个组织，六年内仅增加了少数成员——即使其影响力仍在不断扩大。


    这并不是说一开始就无法以较大团体启动，但这样做时要认识到会有权衡：人越多，建立信任关系所需的时间就越长。这涉及到参与与节奏的动态张力。在某些情况下，推进网络的宗旨必然需要接触大量的人



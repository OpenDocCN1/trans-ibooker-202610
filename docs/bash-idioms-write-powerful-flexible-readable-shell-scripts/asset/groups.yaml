    \ width (user-supplied values)\n    Output \"_+${text}+_\"\n;;\nsub|subscript\
    \ )     # Inline subscript\n    Output \"~${text}~\"\n;;\nsup|superscript )  \
    \ # Inline superscript\n    Output \"^${text}^\"\n;;\nfoot )              # Create\
    \ a footnote\n    Output \"footnote:[${text}]\"\n;;\nurl|link )          # Create\
    \ a URL with alternate text\n    Output \"link:\\${\\$text\\$\\$[]\"   # URL[link\
    \ shows as]\n;;\nesc|escape )        # Escape a character (esp. *)\n    Output\
    \ \"\\$\\$${text}\\$\\$\"  # $*$ $\n;;\n\n#####################################################\n\
    # Tools\n\nid )                ## Convert a hack/recipe name to an ID\n    #us_text=${text//\
    \ /_}  # Space to '_'\n    #lc_text=${us_text,,}  # Lowercase; bash 4+ only!\n\
    \    # Initial `tr -s ' ' ' ' to preserve _ in case we process an ID\n    # twice\
    \ (like from \"xref\")\n    # Also note you can break long lines with a trailing\
    \ |\n    Output $(echo $text | tr -s '_' ' ' | tr '[:upper:]' '[:lower:]' \\\n\
    \    | tr -d '[:punct:]' | tr -s ' ' '_')\n;;\n\nindex )             ## Creates\
    \ 'index.txt' in AsciiDoc dir\n    # Like:\n        # ch02.asciidoc== The Text\
    \ Utils\n        # ch02.asciidoc=== Common Text Utils and similar tools\n```"
  md: "\n![](img/553ffa1bc15093729b691f706befc0ac_36_0.png)\n\n## Not RegEx\n\nThe\
    \ pattern matching used in the case statement is not regular expressions. There\
    \ is only one place in bash where regular expressions (regex or regexp) are allowed,\
    \ and that’s in the if statement using the =~ comparison operator. If you really\
    \ need to use regex, then you need to use a series of if/then/else statements\
    \ instead of case.\n\n## A Realistic Use Case\n\nCode that parses command line\
    \ options is a common place to find a case statement. Let’s look at a simple but\
    \ somewhat realistic script that makes good use of a case statement.\n\n## Motivation\n\
    \nIf you’ve ever used Linux or Unix, you’ve likely made extensive use of the ls\
    \ command to list out filenames and related information. Some options to ls are\
    \ quite handy at giving more information or sorting it in certain ways. You might\
    \ develop certain habits of how you use ls or the options you use most frequently.\
    \ As a result, you might create some aliases or even entire scripts to make it\
    \ easier to use your favorite combinations. But then you end up with several distinct\
    \ scripts. They’re all related in functionality but all distinct. How might we\
    \ combine them all into one script?\n\nConsider a familiar example, the popular\
    \ source control software called Git. It has several related but distinct functions,\
    \ all invoked with the one command name git but each distinguished by a separate\
    \ second keyword, for example, git clone, git add, git commit, git push, and so\
    \ forth.\n\n## Our Script\n\nWe can apply this “subcommand” approach to our situation.\
    \ Let’s consider a few ls-related functions that we’d like to use: listing the\
    \ files in order of filename length (along with the length), listing just the\
    \ longest filename, listing the last few most recently modified files, and listing\
    \ filenames with color coding indicating file type—a standard feature of ls but\
    \ one that requires a few hard-to-remember options.\n\nOur script will be named\
    \ list, but there will be a second word to specify one of these functions. That\
    \ word could be color, last, length, or long. Example 3-1 contains a script that\
    \ does that.\n\n## Example 3-1. Simple wrapper script using case\n\n```\n#!/usr/bin/env\
    \ bash\n# list.sh: A wrapper script for ls-related tools & simple `case..esac`\
    \ demo\n# Original Author & date: _bash Idioms_ 2022\n# bash Idioms filename:\
    \ examples/ch03/list.sh\n# ----------------------------------------------------------------------------\n\
    VERSION='v1.2b'\n\nfunction Usage_Exit {\n    echo \"$0 [color|last|len|long]\"\
    \n    exit\n}\n\n# Show each filename preceded by the length of its name, sorted\
    \ by filename\n# length. Note '-' is valid but uncommon in function names, but\
    \ it is not\n# valid in variable names. We don't usually use it, but you can.\n\
    function Ls-Length {\n    ls -1 \"$@\" | while read fn; do\n        printf '%3d\
    \ %s\\n' ${#fn} ${fn}\n    done | sort -n\n}\n\n(( $# < 1 )) && Usage_Exit\nsub=$1\n\
    shift\n\ncase $sub in\n    color)\n        ls -N --color=tty -T 0 \"$@\"    #\
    \ Colorized ls\n    ;;\n    last | latest)\n        ls -lrt | tail \"-n${1:-5}\"\
    \     # Latest files\n    ;;\n    len*)\n        Ls-Length \"$@\"            \
    \     # Files with name lengths\n    ;;\n    long)\n        Ls-Length \"$@\" |\
    \ tail -1       # File with longest name\n    ;;\n    *)\n        echo \"unknown\
    \ command: $sub\"    # Default\n        Usage_Exit\n    ;;\nesac\n```\n\nWe won’t\
    \ explain all the parts of this script here, though by the end of this book, you\
    \ will have learned about all the features used. We want to focus mainly on the\
    \ case statement:\n\n+   1. Do you recognize the non-if if logic? If not, (re)read\
    \ Chapter 1.\n+   2. This is a simple “or” choice between two words.\n+   3. Use\
    \ tail -n5 as the default if a value is not given in $1; see “Default Values”\
    \ on page 38.\n+   4. This pattern will match any word that begins with “len,”\
    \ so either “len” or “length” with match, but so will “lenny” and “lens.” It then\
    \ calls the Ls-Length function (which we defined in the script), passing it all\
    \ the command line arguments (if any) supplied to this script.\n\n## Wrapper Scripts\n\
    \nEveryone has a lot going on, and a lot to remember, so when you can automate\
    \ or write a script to remember details for you, that’s a win. We showed one way\
    \ to do a “wrapper script” in Example 3-1, but there are a number of interesting\
    \ variations and tricks that you can use depending on the complexity of the problem\
    \ you are solving or details you are “remembering.” In Example 3-1, we called\
    \ a function or just put the code inline. That works best with very short code\
    \ blocks, which in our experience are quite common in these kinds of wrapper scripts.\
    \ If you have a more complicated solution, or you are working with existing tools,\
    \ you can call those or a sub-script instead, though you need to tweak the error-checking\
    \ and possibly usage options. You can also combine that with “Drop-in Directories”\
    \ on page 93 and source all the “modules” from a directory, perhaps to delegate\
    \ maintenance of parts of the code to other people or teams.\n\nThis larger example\
    \ is actually a simplified and excerpted version of a script we used while writing\
    \ this book. AsciiDoc is cool, but we work with a lot of markup languages and\
    \ they all blur together, so we can write a tool to remember things for us, shown\
    \ in Example 3-2.\n\n## Example 3-2. Complex wrapper script using case\n\n```\n\
    #!/usr/bin/env bash\n# wrapper.sh: Simple \"wrapper\" script demo\n# Original\
    \ Author & date: _bash Idioms_ 2022\n# bash Idioms filename: examples/ch03/wrapper.sh\n\
    #_____________________________________________________________________________\n\
    # Trivial Sanity Checks\n```\n\n```\n[ -n \"$BOOK_ASC\" ] || {\n    echo \"FATAL:\
    \ export \\$BOOK_ASC to the location of the Asciidoc files!\"\n    exit 1\n}\n\
    \\cd \"$BOOK_ASC\" || {\n    echo \"FATAL: can't cd to '$BOOK_ASC'!\"\n    exit\
    \ 2\n}\n\nSELF=\"$0\"\naction=\"$1\"\nshift\n[ -x /usr/bin/xsel -a $# -lt 1 ]\
    \ && {\n    # Read/write the clipboard on Linux\n    text=$(xsel -b)\n    function\
    \ Output {\n        echo -en \"$*\" | xsel -bi\n    }\n} || {\n    # Read/write\
    \ STDIN/STDOUT\n    text=$*\n    function Output {\n        echo -en \"$*\"\n\
    \    }\n}\n\ncase \"$action\" in\n\n########################################\n\
    # Content/Markup\n\n### Headers\n h1 )\n        # Inside chapter heading 1 (really\
    \ AsciiDoc h3)\n        Output \"[[${$SELF id $text}]]\\n=== $text\"\n    ;;\n\
    \ h2 )\n        # Inside chapter heading 2 (really AsciiDoc h4)\n        Output\
    \ \"[[${$SELF id $text}]]\\n==== $text\"\n    ;;\n h3 )\n        # Inside chapter\
    \ heading 3 (really AsciiDoc h5)\n        Output \"[[${$SELF id $text}]]\\n=====\
    \ $text\"\n    ;;\n\n### Lists\n bul|bullet )\n        # Bullet list (** = level\
    \ 2, + = multiline element)\n        Output \"* $text\"\n    ;;\n nul|number|order*\
    \ )\n        # Numbered/ordered list (.. = level 2, + = multiline)\n        Output\
    \ \". $text\"\n    ;;\n term )\n        # Terms\n        Output \"term_here::\\\
    n  $text\"\n\n```\n\n```\n;;\n\n### Inline\nbold )\n    # Inline bold (O'Reilly\
    \ prefers italics to bold)\n    Output \"*${text}*\"\n;;\ni|italic|itl )     \
    \ # Inline italics (O'Reilly prefers italics to bold)\n    Output \"_${text}_\"\
    \n;;\nc|constant|cons )   # Inline constant width (command, code, keywords, more)\n\
    \    Output \"+${text}+\"\n;;\ntype|constantbold ) # Inline bold constant width\
    \ (user types literally)\n    Output \"*+${text}+*\"\n;;\nvar|constantitalic )\
    \ # Inline italic constant width (user-supplied values)\n    Output \"_+${text}+_\"\
    \n;;\nsub|subscript )     # Inline subscript\n    Output \"~${text}~\"\n;;\nsup|superscript\
    \ )   # Inline superscript\n    Output \"^${text}^\"\n;;\nfoot )             \
    \ # Create a footnote\n    Output \"footnote:[${text}]\"\n;;\nurl|link )     \
    \     # Create a URL with alternate text\n    Output \"link:\\${\\$text\\$\\$[]\"\
    \   # URL[link shows as]\n;;\nesc|escape )        # Escape a character (esp. *)\n\
    \    Output \"\\$\\$${text}\\$\\$\"  # $*$ $\n;;\n\n#####################################################\n\
    # Tools\n\nid )                ## Convert a hack/recipe name to an ID\n    #us_text=${text//\
    \ /_}  # Space to '_'\n    #lc_text=${us_text,,}  # Lowercase; bash 4+ only!\n\
    \    # Initial `tr -s ' ' ' ' to preserve _ in case we process an ID\n    # twice\
    \ (like from \"xref\")\n    # Also note you can break long lines with a trailing\
    \ |\n    Output $(echo $text | tr -s '_' ' ' | tr '[:upper:]' '[:lower:]' \\\n\
    \    | tr -d '[:punct:]' | tr -s ' ' '_')\n;;\n\nindex )             ## Creates\
    \ 'index.txt' in AsciiDoc dir\n    # Like:\n        # ch02.asciidoc== The Text\
    \ Utils\n        # ch02.asciidoc=== Common Text Utils and similar tools\n```\n"
  mdcn: "\n\n![](img/553ffa1bc15093729b691f706befc0ac_36_0.png)\n\n## 非正则表达式\n\ncase\
    \ 语句中使用的模式匹配不是正则表达式。在 bash 中，唯一允许使用正则表达式（regex 或 regexp）的地方是在 if 语句中使用 =~ 比较运算符。如果确实需要使用正则表达式，那么你需要使用一系列\
    \ if/then/else 语句而不是 case。\n\n## 一个现实的使用案例\n\n解析命令行选项的代码是常见的使用 case 语句的地方。让我们来看一个简单但相当现实的脚本，它很好地利用了\
    \ case 语句。\n\n## 动机\n\n如果你曾经使用过 Linux 或 Unix，你很可能大量使用了 ls 命令来列出文件名和相关信息。ls 的一些选项在提供更多信息或以特定方式排序时非常方便。你可能会养成使用\
    \ ls 或最常使用的选项的某些习惯。因此，你可能会创建一些别名甚至整个脚本来更方便地使用你喜欢的组合。但随后你最终会拥有多个不同的脚本。它们在功能上都相关但各不相同。我们如何将它们全部合并到一个脚本中？\n\
    \n考虑一个熟悉的例子，名为 Git 的流行源代码控制软件。它有几个相关但不同的功能，所有功能都使用同一个命令名 git 调用，但每个功能都由第二个不同的关键字区分，例如\
    \ git clone、git add、git commit、git push 等等。\n\n## 我们的脚本\n\n我们可以将这种“子命令”方法应用于我们的情况。让我们考虑一些我们想要使用的\
    \ ls 相关功能：按文件名长度顺序列出文件（连同长度），仅列出最长的文件名，列出最近修改的最后几个文件，以及使用颜色编码按文件类型列出文件名——这是 ls\
    \ 的标准功能，但需要一些难以记住的选项。\n\n我们的脚本将命名为 list，但会有第二个词来指定其中一个功能。那个词可以是 color、last、length\
    \ 或 long。示例 3-1 包含一个执行此操作的脚本。\n\n## 示例 3-1. 使用 case 的简单包装脚本\n\n```\n#!/usr/bin/env\
    \ bash\n# list.sh: A wrapper script for ls-related tools & simple `case..esac`\
    \ demo\n# Original Author & date: _bash Idioms_ 2022\n# bash Idioms filename:\
    \ examples/ch03/list.sh\n# ----------------------------------------------------------------------------\n\
    VERSION='v1.2b'\n\nfunction Usage_Exit {\n    echo \"$0 [color|last|len|long]\"\
    \n    exit\n}\n\n# Show each filename preceded by the length of its name, sorted\
    \ by filename\n# length. Note '-' is valid but uncommon in function names, but\
    \ it is not\n# valid in variable names. We don't usually use it, but you can.\n\
    function Ls-Length {\n    ls -1 \"$@\" | while read fn; do\n        printf '%3d\
    \ %s\\n' ${#fn} ${fn}\n    done | sort -n\n}\n\n(( $# < 1 )) && Usage_Exit\nsub=$1\n\
    shift\n\ncase $sub in\n    color)\n        ls -N --color=tty -T 0 \"$@\"    #\
    \ Colorized ls\n    ;;\n    last | latest)\n        ls -lrt | tail \"-n${1:-5}\"\
    \     # Latest files\n    ;;\n    len*)\n        Ls-Length \"$@\"            \
    \     # Files with name lengths\n    ;;\n    long)\n        Ls-Length \"$@\" |\
    \ tail -1       # File with longest name\n    ;;\n    *)\n        echo \"unknown\
    \ command: $sub\"    # Default\n        Usage_Exit\n    ;;\nesac\n```\n\n我们不会在这里解释这个脚本的所有部分，尽管到本书结束时，你将学到所使用的所有功能。我们主要想关注\
    \ case 语句：\n\n+   1. 你能认出非 if 的 if 逻辑吗？如果不能，请（重新）阅读第 1 章。\n+   2. 这是两个词之间的简单“或”选择。\n\
    +   3. 如果 $1 中未给出值，则使用 tail -n5 作为默认值；请参阅第 38 页的“默认值”。\n+   4. 此模式将匹配以“len”开头的任何词，因此“len”或“length”都会匹配，但“lenny”和“lens”也会匹配。它随后调用\
    \ Ls-Length 函数（我们在脚本中定义），并将传递给此脚本的所有命令行参数（如果有）传递给它。\n\n## 包装脚本\n\n每个人都有很多事情要做，很多需要记住的事情，所以当你可以自动化或编写脚本为你记住细节时，这就是胜利。我们在示例\
    \ 3-1 中展示了一种“包装脚本”的方法，但根据你解决的问题的复杂性或你“记住”的细节，你可以使用许多有趣的变化和技巧。在示例 3-1 中，我们调用了一个函数或只是内联放置代码。对于非常短的代码块来说，这效果最好，在我们的经验中，这些在这种类型的包装脚本中非常常见。如果你有更复杂的解决方案，或者你正在使用现有工具，你可以调用那些工具或子脚本，不过你需要调整错误检查和可能的用法选项。你还可以将它与第\
    \ 93 页的“Drop-in Directories”结合使用，并从目录中 source 所有“模块”，也许可以将代码部分的维护委托给其他人或团队。\n\n\
    这个更大的例子实际上是我们编写本书时使用的脚本的简化版和摘录。AsciiDoc 很酷，但我们使用很多标记语言，它们都混在一起了，所以我们可以编写一个工具来为我们记住事情，如示例\
    \ 3-2 所示。\n\n## 示例 3-2. 使用 case 的复杂包装脚本\n\n```\n#!/usr/bin/env bash\n# wrapper.sh:\
    \ Simple \"wrapper\" script demo\n# Original Author & date: _bash Idioms_ 2022\n\
    # bash Idioms filename: examples/ch03/wrapper.sh\n#_____________________________________________________________________________\n\
    # Trivial Sanity Checks\n```\n\n```\n[ -n \"$BOOK_ASC\" ] || {\n    echo \"FATAL:\
    \ export \\$BOOK_ASC to the location of the Asciidoc files!\"\n    exit 1\n}\n\
    \\cd \"$BOOK_ASC\" || {\n    echo \"FATAL: can't cd to '$BOOK_ASC'!\"\n    exit\
    \ 2\n}\n\nSELF=\"$0\"\naction=\"$1\"\nshift\n[ -x /usr/bin/xsel -a $# -lt 1 ]\
    \ && {\n    # Read/write the clipboard on Linux\n    text=$(xsel -b)\n    function\
    \ Output {\n        echo -en \"$*\" | xsel -bi\n    }\n} || {\n    # Read/write\
    \ STDIN/STDOUT\n    text=$*\n    function Output {\n        echo -en \"$*\"\n\
    \    }\n}\n\ncase \"$action\" in\n\n########################################\n\
    # Content/Markup\n\n### Headers\n h1 )\n        # Inside chapter heading 1 (really\
    \ AsciiDoc h3)\n        Output \"[[${$SELF id $text}]]\\n=== $text\"\n    ;;\n\
    \ h2 )\n        # Inside chapter heading 2 (really AsciiDoc h4)\n        Output\
    \ \"[[${$SELF id $text}]]\\n==== $text\"\n    ;;\n h3 )\n        # Inside chapter\
    \ heading 3 (really AsciiDoc h5)\n        Output \"[[${$SELF id $text}]]\\n=====\
    \ $text\"\n    ;;\n\n### Lists\n bul|bullet )\n        # Bullet list (** = level\
    \ 2, + = multiline element)\n        Output \"* $text\"\n    ;;\n nul|number|order*\
    \ )\n        # Numbered/ordered list (.. = level 2, + = multiline)\n        Output\
    \ \". $text\"\n    ;;\n term )\n        # Terms\n        Output \"term_here::\\\
    n  $text\"\n\n```\n\n```\n;;\n\n### Inline\nbold )\n    # Inline bold (O'Reilly\
    \ prefers italics to bold)\n    Output \"*${text}*\"\n;;\ni|italic|itl )     \
    \ # Inline italics (O'Reilly prefers italics to bold)\n    Output \"_${text}_\"\
    \n;;\nc|constant|cons )   # Inline constant width (command, code, keywords, more)\n\
    \    Output \"+${text}+\"\n;;\ntype|constantbold ) # Inline bold constant width\
    \ (user types literally)\n    Output \"*+${text}+*\"\n;;\nvar|constantitalic )\
    \ # Inline italic constant width (user-supplied values)\n    Output \"_+${text}+_\"\
    \n;;\nsub|subscript )     # Inline subscript\n    Output \"~${text}~\"\n;;\nsup|superscript\
    \ )   # Inline superscript\n    Output \"^${text}^\"\n;;\nfoot )             \
    \ # Create a footnote\n    Output \"footnote:[${text}]\"\n;;\nurl|link )     \
    \     # Create a URL with alternate text\n    Output \"link:\\${\\$text\\$\\$[]\"\
    \   # URL[link shows as]\n;;\nesc|escape )        # Escape a character (esp. *)\n\
    \    Output \"\\$\\$${text}\\$\\$\"  # $*$ $\n;;\n\n#####################################################\n\
    # Tools\n\nid )                ## Convert a hack/recipe name to an ID\n    #us_text=${text//\
    \ /_}  # Space to '_'\n    #lc_text=${us_text,,}  # Lowercase; bash 4+ only!\n\
    \    # Initial `tr -s ' ' ' ' to preserve _ in case we process an ID\n    # twice\
    \ (like from \"xref\")\n    # Also note you can break long lines with a trailing\
    \ |\n    Output $(echo $text | tr -s '_' ' ' | tr '[:upper:]' '[:lower:]' \\\n\
    \    | tr -d '[:punct:]' | tr -s ' ' '_')\n;;\n\nindex )             ## Creates\

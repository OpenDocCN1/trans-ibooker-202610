  - '[PAGE 110]


    We recommend either #!/bin/bash - or #!/usr/bin/env bash. We strongly discourage
    #!/bin/sh unless you are deliberately restricting your code to Bourne shell compatibility,
    in other words not using “bashisms.” You used to be able to get away with that
    on Linux, but many Linux distributions switched to using the Debian Almquist shell
    or dash for /bin/sh because it was much smaller and faster than bash for running
    scripts, like all the scripts used to boot the system. But it’s a bad idea to
    use sh when you really mean bash because, as we just noted, it’s fragile and obscures
    programmer intent.


    #!/usr/bin/env bash is much more portable, because as long as bash is in the $PATH,
    it will go find it. That’s great when bash is not in /bin/, which is the case
    on BSD, Solaris, and other non-Linux systems. The only problem is that the overhead
    of spawning env, then searching the $PATH, then replacing itself with bash is
    slower. With the resources in modern computers, that almost never matters, but
    if you are developing on a constrained system or running a lot of scripts or instances
    in a short time, that overhead adds up (Example 9-11).


    # Example 9-11. Shebang speed test


    ```

    $ head examples/ch09/shebang*

    ==> examples/ch09/shebang-bash.sh <==

    #!/bin/bash -

    :


    ==> examples/ch09/shebang-env.sh <==

    #!/usr/bin/env bash

    :


    $ time for ((i=0; i<1000; i++)); do examples/ch09/shebang-bash.sh; done

    real    0m3.279s

    user    0m1.273s

    sys     0m0.915s


    $ time for ((i=0; i<1000; i++)); do examples/ch09/shebang-env.sh; done

    real    0m4.291s

    user    0m1.313s

    sys     0m1.425s

    ```


    The other detail to mention is the trailing - we’ve shown. That’s there to prevent
    a very old interpreter spoofing attack; see section 4.7 of the Unix FAQs for details.
    The Linux kernel (but not other kernels!) treats everything after the first “word”
    (in this case /bin/bash) as a single argument, so we “use up” that argument with
    the “end of arguments” dash. Note that this is not needed in #!/usr/bin/env bash
    because the bash part itself is the argument.'
  - '[PAGE 111]


    # Unofficial bash Strict Mode


    Perl has a use strict pragma to “restrict unsafe constructs” that causes a syntax
    check or run time error if you do not declare and initialize variables before
    using them, among other things. The unofficial bash strict mode article makes
    the argument that the following does the same (in spirit) in bash:


    ```

    set -euo pipefail

    IFS=$''\n\t''

    ```


    We don’t quite agree on changing $IFS like that because that will break a lot
    of bash idioms (see “Fiddling with $IFS for Fun and Profit, to Read Files” on
    page 89). The author makes a good argument, but it might be a large effort to
    migrate legacy code for that. The set commands are great, though:


    +   - -e will exit the entire script at the first error.

    +   - -u will exit the entire script if you use an unset variable.

    +   - -o pipefail will fail pipelines if any command, not just the last one, exits
    with nonzero.


    Adding -u will break a lot of existing scripts, but the fixes will be pretty easy,
    and you may find some variable name typos you didn’t know you had, which is the
    whole point. -eo pipefail will probably break less up front, and when that does
    “break” a script, it was probably already broken, but the error was masked and
    these options just unmasked the problem.


    This is definitely worth considering and perhaps adding to your templates and
    style guide.


    See also:


    +   - http://redsymbol.net/articles/unofficial-bash-strict-mode

    +   - help set

    +   - https://perldoc.perl.org/strict


    # Exit Codes


    Unless told otherwise, your bash script will exit with the exit (or return) code
    of the last command run. Sometimes that’s fine, and other times you may need to
    exit earlier after failing a sanity check or for some other condition.'

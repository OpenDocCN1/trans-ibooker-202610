    \ %s\\n' '-1' 'Your log message here'\n2021-08-13 12:48:33 -0400: Your log message\
    \ here\n```\n\n```\n### 1628873101 是什么时候？\n$ printf '%(%F %T)T = %s\\n' '1628873101'\
    \ 'Epoch 1628873101 to human readable'\n2021-08-13 12:45:01 = Epoch 1628873101\
    \ to human readable\n```\n\n![](img/553ffa1bc15093729b691f706befc0ac_72_0.png)\n\
    \n## 将 printf 输出到变量\n\n如果你查看了 help printf，你可能会注意到 -v var 选项，它将输出分配给变量而不是显示它，类似于\
    \ C 中的 sprintf。我们接下来会看到它的用途。\n\n有关此主题的更多详细信息，请参阅第 111 页的“Using logger from bash”。\n\
    \n我们更喜欢 bash 内置的 printf，但有一件事 GNU¹ 版本的 date 仍然比 printf %(datefmt)T 做得更好，那就是显示其他时间的日子，比如\
    \ date -d '2 months ago' '+%B'，它告诉我们两个月前的月份名称，例如：\n\n```\n$ date -d '2 months\
    \ ago' '+%B'\nAugust\n```\n\n![](img/553ffa1bc15093729b691f706befc0ac_72_1.png)\n\
    \n## Mac 上的默认 bash 太旧了\n\n请注意，printf %(datefmt)T 至少需要 bash 4.2，推荐 4.3+，因此这在 Mac\
    \ 上较旧但非常有用的默认 bash 3.2 上不起作用！请参阅第 ix 页的“bash on Mac”。\n\n1 GNU 是一个递归缩写，代表“GNU’s\
    \ Not Unix。”\n\n## printf 用于复用或调试\n\nBash help 说“%q 以可重新用作 shell 输入的方式引用参数”，我们将在第\
    \ 7 章中使用它来显示“shell 引用的”字符串，但这里有一个简单示例：\n\n```\n$ printf '%q' \"This example is\
    \ from $today\\n\"\nThis\\ example\\ is\\ from\\ 2021-08-13\\\\n\n```\n\n这对于在其他地方复用输出、创建格式化输出（另请参阅第\
    \ 38 页的“Comma-Separated Lists”）以及在需要能够看到隐藏或控制字符或字段的调试中很有用。另请参阅第 120 页的“bash Debugging”。\n\
    \n## 风格和可读性：回顾\n\nbash 中的函数非常类似于内部 shell 脚本。它们的调用方式非常类似于运行任何命令，它们的参数引用方式也与任何 shell\
    \ 脚本的参数相同（$1、$2 等）。你需要在脚本前面放置函数，以便在对函数进行任何调用之前看到其定义。如同任何语言一样，函数应保持简短且主要为单一目的。对函数使用单个\
    \ I/O 重定向可以帮助你避免重复的重定向。也许函数最大的危险是变量引用。函数可以通过变量或通过写入 STDOUT 并让调用者将函数的输出管道传输到下一个命令来返回值。你可能需要引用（全局）变量来从函数返回值，但有一些变量你希望避免更改。使用\

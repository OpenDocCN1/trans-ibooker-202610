    \ && 的优先级高于 || 运算符，但事实并非如此。它们只是从左到右进行分组。bash 的语法规定 && 和 || 运算符具有相同的优先级并且是左结合的。需要说服力吗？看这些例子：\n\
    \n```\n$ echo 1 && echo 2 || echo 3\n1\n2\n$\n```\n\n但也有：\n\n```\n$ echo 1 ||\
    \ echo 2 && echo 3\n1\n3\n$\n```\n\n注意它总是评估最左边的运算符，无论是 AND 还是 OR；决定求值顺序的不是运算符优先级，而是简单的左结合性。\n\
    \n## 不要这样做\n\n既然我们谈到了 if 语句（或如何不使用它们），这里有一个你可能会在旧脚本中经常看到的显式 if 示例。我们在这里展示它是为了解释这种惯用法，但也强烈建议你永远不要模仿这种风格。这是代码：\n\
    \n```\n### 不要这样写 if 语句来检查\nif [ $VAR\"X\" = X ]; then\n    echo empty\nfi\n```\n\
    \n```\n### 或者这样\nif [ \"x$VAR\" == x ]; then\n    echo empty\nfi\n```\n\n```\n\
    ### 或者这种主题的其他变体\n```\n\n不要这样做。这段代码在做什么？它们在检查变量 VAR 是否为空。它们通过给 VAR 的值追加一个字符（这里是\
    \ X）来实现。如果 resulting 字符串仅匹配该字母本身，则变量为空。不要这样做。\n\n有更好的方法来进行此检查。这里有一个简单的替代方案：\n\n\
    ```\n# 变量的长度是否为零？即为空或空值\nif [[ -z \"$VAR\" ]]; then\n    echo empty\nfi\n```\n\
    \n![](img/553ffa1bc15093729b691f706befc0ac_21_0.png)\n\n## 单括号与双括号\n\n这个不该做的例子使用了单括号\
    \ [ 和 ] 来包围它们正在测试的条件。这不是我们要你避免的。我们要你避免的是字符串追加和比较；相反，使用 -z 或 -n 来进行这些测试。那么为什么我们的示例都使用双括号\
    \ [[ 和 ]] 来编写我们的 if（和非 if）语句呢？它们是 bash 的新增功能（不在原始 sh 命令中），并且避免了单括号所表现出的一些令人困惑的边缘情况行为（变量是否在引号内）。我们用单括号展示这个例子是因为这种类型的比较在旧脚本中经常出现。你可能需要坚持使用单括号，如果你的目标是在各种平台和/或非\
    \ bash 平台（例如 dash）之间保持可移植性。作为旁注，双括号是关键字，而左单括号是内置命令，这种差异可能解释了一些细微的行为差异。我们的建议是除非不可避免，否则使用双括号语法。\n\
    \n你可以通过使用 -n 选项或直接引用变量来检查相反的情况，即检查字符串长度是否非零：\n\n```\n# 这检查长度是否非零，即不为空，不为空值\nif\
    \ [[ -n \"$VAR\" ]]; then\n    echo \"VAR has a value:\" $VAR\nfi\n```\n\n```\n\
    # 同样在这里\nif [[ \"$VAR\" ]]; then\n    echo even easier this way\nfi\n```\n\n所以你可以看到没有必要使用那种在旧版\
    \ test 命令（\"[\"）中必要的方法，而这种命令现在很少使用。我们认为你应该看到它，这样你就能在旧脚本中识别它。现在你也知道更好的写法了。\n\n\
    ## 风格和可读性：回顾\n\n在本章中，我们研究了一种特定的 bash 惯用法——“无 if” if 语句。它看起来不像传统的 if/then/else，但行为完全可以一样。除非你能识别它，否则你阅读的一些脚本可能会仍然晦涩。这种惯用法也值得用来检查在执行命令之前是否满足必要的先决条件，或在不打断脚本主要逻辑流程的情况下进行简短的错误检查。\n\
    \n通过使用 && 和 || 运算符，你可以编写 if/then/else 逻辑，而无需使用那些熟悉的关键字。但 bash 确实有 if、then 和 else\
    \ 作为关键字。那么什么时候使用它们，什么时候使用简写？答案取决于可读性。\n\n对于复杂逻辑，使用熟悉的关键字更有意义。但对于带单个操作的简单测试和检查情况，使用\
    \ && 和 || 运算符非常方便，并且不会分散主要逻辑流程的注意力。使用 help test 来提醒你可以使用哪些测试，例如 -n -r，并考虑将帮助文本复制到注释中以供将来参考。\n\
    \n无论是熟悉的 if 语句还是惯用的“无 if”语句，我们都鼓励使用双括号语法。\n\n现在你已经深入了解了一种 bash 惯用法，让我们看看其他惯用法，并真正提升你的\
    \ bash 水平。\n\n## 循环术语\n\n不只是 C 风格的 for 循环——bash 包含其他语法和风格；有些对 Python 程序员更熟悉，但每种都有其用途。有一种\
    \ for 循环没有明显的参数，可用于脚本和函数内部。还有一种类似迭代器的 for 循环，具有显式值和可以来自其他命令的值。\n\n## 循环结构\n\n\
    循环结构在编程语言中很常见。自 C 语言发明以来，许多编程语言都采用了 C 风格的 for 循环。因为它将初始化代码、终止条件和迭代代码都集中在一个地方，所以它是一个功能强大且可读的构造。例如，在\
    \ C（或 Java，或...）中：\n\n```\n/* NOT bash */\nfor (i=0; i<10; i++) {\n    printf(\"\
    %d\\n\", i);\n}\n```\n\nbash 在只有少量语法差异的情况下遵循了几乎相同的方法：\n\n```\nfor ((i=0; i<10;\
    \ i++)); do\n    printf '%d\\n' \"$i\"\ndone\n```\n\n请特别注意双圆括号的使用。与大括号不同，bash\
    \ 使用 do 和 done 来包含循环的语句。与 C/C++ 一样，for 循环的惯用用法是空的 for 循环，产生有意的无限循环（你也会看到 while\
    \ true; do）：\n\n"

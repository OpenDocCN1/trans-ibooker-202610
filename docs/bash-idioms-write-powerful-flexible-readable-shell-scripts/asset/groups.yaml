    \ $1、$2 等是传递给该函数的参数，而不是传递给外部 shell 脚本的参数。因此，在函数定义内部，for 循环会遍历传递给该函数的参数。\n\n这种极简的\
    \ for 循环遍历的是一个隐含的值列表——传递给脚本或函数的参数。当在脚本主体中使用时，它遍历传递给脚本的参数；当在 shell 函数内部使用时，它遍历传递给该函数\
    \ 的参数。\n\n这绝对是 bash 中晦涩的习惯用法之一。你需要知道如何阅读它，但我们会在后面的章节中讨论如何编写它（剧透：正如 Python 所说，显式优于隐式）。\n\
    \n我们可能想要一个同样简单的循环，但使用我们自己选择的显式值，而不是局限于参数——bash 正好有这个功能。\n\n## Explicit Values\n\
    \n在 bash 中，for 循环可以被赋予一个要遍历的值列表，像这样：\n\n```\nfor num in 1 2 3 4 5; do\n    echo\
    \ \"$num\"\ndone\n```\n\n由于 bash 处理的是字符串，我们并不局限于数字：\n\n```\nfor person in Sue\
    \ Neil Pat Harry; do\n    echo $person\ndone\n```\n\n当然，值列表可以同时包含变量和字面量：\n\n```\n\
    for person in $ME $3 Pat ${RA[2]} Sue; do\n    echo $person\ndone\n```\n\nfor\
    \ 循环的另一个值来源可以来自其他命令，要么是单个命令，要么是命令管道：\n\n```\nfor arg in $(some cmd or other |\
    \ sort -u)\n```\n\n这种类型的例子有：\n\n```\nfor arg in $(cat /some/file)\nfor arg in\
    \ $(</some/file)    # Faster than shelling out to cat\nfor pic in $(find . -name\
    \ '*.jpg')\nfor val in $(find . -type d | LC_ALL=C sort)\n```\n\n一个常见的用法，尤其是在旧脚本中，是这样的：\n\
    \n```\nfor i in $(seq 1 10)\n```\n\n因为 seq 命令会生成一系列数字。这种情况可以被认为等价于：\n\n```\nfor\
    \ ((i = 1; i <= 10; i++))\n```\n\n后者的 for 更高效，也更易读。（请注意，循环结束后，i 的值在这两种形式之间会不同\
    \ [10 与 11]，不过通常我们不会在循环外部使用该值。）\n\n还有这种变体，但它有 bash 版本的可移植性问题，因为大括号展开是在 v3.0 中引入的，而展开的数值值的零填充则是在\
    \ v4.0 中引入的：\n\n```\nfor i in {01..10}; do echo \"$i\"; done\n```\n\n![](img/553ffa1bc15093729b691f706befc0ac_27_0.png)\n\
    \n## Leading Zeros\n\n当 {start..end..inc} 大括号展开中的前两个项之一以零开头时，它会强制每个输出值具有相同的宽度——在\
    \ bash v4.0 或更新版本中使用零在左侧填充它们。因此 {098..100} 会得到：098 099 100，而 {98..0100} 会填充到四个字符，结果为：0098\
    \ 0099 0100。\n\n这种大括号展开构造在你希望生成的数字成为更大字符串的一部分时尤其有用。你只需将大括号构造作为字符串的一部分。例如，如果你想生成五个类似\

    \ home shell; \\\n  echo \"$user | $shadow | $uid | $gid | $gecos | $home | $shell\"\
    \ \\\n}\nnobody | x | 65534 | 65534 | nobody | /nonexistent | /usr/sbin/nologin\n\
    ```\n\nSee also “Fiddling with $IFS for Fun and Profit, to Read Files” on page\
    \ 89.\n\n![](img/553ffa1bc15093729b691f706befc0ac_101_0.png)\n\n# lastpipe\n\n\
    If you are running bash 4+, you can set shopt -s lastpipe, which will run the\
    \ last command of a pipeline in the current shell so your script can see the environment.\
    \ Note that this only works if job control is disabled, which is the default in\
    \ scripts but not in interactive sessions. You can disable job control using set\
    \ +m, but that disables CTRL-C, CTRL-Z, fg, and bg, so we don’t recommend doing\
    \ that.\n\n# mapfile\n\nmapfile is also known as readarray, but they are the same\
    \ command. Added in bash v4, mapfile reads a file into an array (list) and has\
    \ options to read only -n count lines at a time, skip -s count lines, display\
    \ a progress indicator (-c/-C), and more. This is much easier to use than other\
    \ methods.\n\nThe simple use is, well, simple, and it “slurps” the entire file\
    \ into memory, as shown in Example 9-1.\n\nExample 9-1. Simple mapfile\n\n```\n\
    mapfile -t nodes < /path/to/list/of/hosts  # -t removes newlines\n```\n\n```\n\
    # Loop around the nodes\nfor node in ${nodes[@]}; do\n  ssh $node 'echo -e \"\
    $HOSTNAME:\\t$(uptime)\"'\ndone\n```\n\nUsing -n is a bit more complicated, because\
    \ while mapfile will continue to read nothing, so you have to check to see if\
    \ it actually got data (${#nodes[@]} is nonzero) or you’ll create an infinite\
    \ loop (Example 9-2)."
  - "[PAGE 102]\n\n# Example 9-2. Batch mapfile example\n\n```\nBATCH=10\n# While\
    \ we're reading data...   && there is still data there!\nwhile mapfile -t -n $BATCH\
    \ nodes && (( ${#nodes[@]} )); do\n    for node in ${nodes[@]}; do\n        ssh\
    \ $node 'echo -e \"$HOSTNAME:\\t$(uptime)\"'\n    done\ndone < /path/to/list/of/hosts\n\
    ```\n\nOf course, you can get fancier, and add some runtime user feedback. You\
    \ might also need to throttle your process for various reasons, so you can do\

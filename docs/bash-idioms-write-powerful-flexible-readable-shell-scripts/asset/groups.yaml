    \ for 循环形式。下面是 shell 脚本中常见的一种习惯用法：\n\n```\nfor value; do\n    echo \"$value\"\n\
    \    # Do more stuff with $value...\ndone\n```\n\n这看起来好像少了点什么，对吧？value 的值从哪里来？在命令行中这样使用不会对你产生任何作用，但如果在\
    \ shell 脚本中使用，那么 for 循环就会遍历脚本的参数。也就是说，它会依次使用 $1，然后是 $2，然后是 $3，等等，作为 value 的值。\n\
    \n把这个 for 循环放在一个名为 myloop.sh 的文件中，然后你可以这样运行它，看看会打印出三个参数（“-c”、“17”和“core”）：\n\n\
    ```\n$ bash myloop.sh -c 17 core\n-c\n17\ncore\n$\n```\n\n这种简写的 for 循环在函数定义中也很常见：\n\
    \n```\nfunction Listen {\n    for arg; do\n        echo \"arg to func: '$arg'\"\

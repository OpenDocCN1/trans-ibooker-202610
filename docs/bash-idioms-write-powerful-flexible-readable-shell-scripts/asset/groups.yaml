    # Expressions and Arithmetic


    Bash offers many different ways to do the same thing—and some almost-identical
    syntax to do very different things. Often, it’s just the difference of a few special
    characters. We’ve already seen ${VAR} and ${#VAR}, where the first expression
    returns the value of the variable but the second returns its string length (“Variable
    Reference” on page 31). Or ${VAR[@]} and ${VAR[*]} with their quoting differences
    (“Quotes and Spaces” on page 14).


    Other bash idioms might make you wonder: when should you use two or just one set
    of square brackets? Or even none? What, if any, is the difference between (( ...
    )) and $(( ... )) ? Usually there is some common meaning in the symbols across
    their various uses that hints at some semblance of reason behind the syntax. Sometimes
    the choice of expression was more for historical reasons. Let’s take a look and
    see if we can explain some of these idiomatic pattern and arithmetic expressions.'
  - '[PAGE 59]


    ![](img/553ffa1bc15093729b691f706befc0ac_59_0.png)


    # Integer Only


    The bash shell uses only integer arithmetic. Its main purpose is for counting
    things: iterations, numbers of files, sizes in bytes. What if you want or need
    a floating point calculation? After all, the sleep command now allows a fractional
    value: sleep 0.25 will sleep for a quarter of a second. What if you want to sleep
    multiples of a quarter of a second? You’d like to write sleep $(( 6 * 0.25 )),
    but that won’t work.


    The easiest solution is to do the calculation using another program like bc or
    awk. For example, here’s a script called fp that you could put in your ~/bin directory
    or somewhere else on your PATH (and give it execute permissions):


    ```

    # /bin/bash -

    # fp - provide floating point, via awk

    # usage: fp "expression"


    awk "BEGIN { print $* }"

    ```


    With that in place, you could then write sleep $(fp "6 * 0.25") to get the desired
    floating point calculation. It may not be bash doing the calculation, but it is
    bash helping you get the calculation done.


    # Arithmetic


    Although bash is largely a string-oriented language, whenever you see double parentheses
    in bash, it means that arithmetic evaluation is going on—arithmetic with integers,
    not strings. This is familiar to you from the for loop variation that uses double
    parens:


    ```

    for ((i=0; i<size; i++))

    ```


    Notice that we don’t have to use the $ in front of variable names inside the double
    parens. That is true whenever we use double parens in bash. So where else do we
    find double parens in use?


    First, we can use a dollar sign and double parens to do an arithmetic calculation
    to create a value for a shell variable, like these:


    ```

    max=$( ( intro + body + outro - 1 ) )

    median_loc=$( ( len / 2 ) )

    ```


    Again, notice that the variables don’t need the dollar sign reference in front
    of them when they are used inside of double parens.'
  - "[PAGE 60]\n\nSecond, consider this use of double parens:\n\n```\nif (( max -\
    \ 3 > x * 4 )) ; then\n    # Do something here\nfi\n```\n\nThis time we are using\
    \ double parens without a leading dollar sign. Why? What’s different?\n\nIn the\
    \ first case, for variable assignments, we want the value of the expression, so\
    \ just like with variables, the dollar sign indicates that we want the value.\
    \ In the second case, an if statement, we don’t use the dollar sign because we\
    \ only need the true/false Boolean value to make our decision. If the expression\
    \ inside the double parens (without a dollar sign) is a nonzero value, then the\
    \ return status of the parenthesized expression is 0—which is considered “true”\
    \ in bash. Otherwise, the return status is 1 (which, in bash, is “false”).\n\n\
    Notice that we said “return status?” That’s because the double parens with no\
    \ dollar sign is used, syntactically, as if you were executing one or more commands.\
    \ It doesn’t return a value that you could use to assign to a variable. However,\
    \ you can use it to assign a new value to a variable in certain cases since bash\
    \ supports some C language-style assignment operators. Here are a few examples.\
    \ These are complete bash statements, one per line:\n\n```\n(( step++ ))\n(( median_loc\
    \ = len / 2 ))\n(( dist *= 4 ))\n```\n\nEach statement is performing an arithmetic\
    \ evaluation, but in each case, there is an assignment of a value that also occurs\
    \ as part of that evaluation. No value is returned from the expression, only the\
    \ return status—which you could examine in the $? variable after each statement\
    \ executes.\n\nCould you write those three calculations from the preceding example\
    \ using the dollar-sign-double-paren syntax? It may look more familiar to write:\n\
    \n```\nstep=$(( step + 1 ))\nmedian_loc=$(( len / 2 ))\ndist=$(( dist * 4 ))\n\
    ```\n\nWe don’t want to write $((step++)) on a line by itself because that expression\
    \ will return a numeric value—which the shell will then take as the name of a\
    \ command to be executed. If step++ evaluated to 3, the shell would subsequently\
    \ look for a command named 3."

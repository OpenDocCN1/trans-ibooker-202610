    希望这些提示和技巧在你日常的 bash 工作中以及在规划未来增长以保持尽可能简单和灵活时会有用。如果你喜欢这一章，你也会喜欢 bash Cookbook，它有超过
    600 页的、嗯、像这样的有用食谱。



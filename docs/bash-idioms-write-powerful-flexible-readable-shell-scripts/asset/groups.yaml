  - '[PAGE 125]


    # Local Variables


    We talked about this in “Local Variables” on page 54, but to recap, the local
    command may only be used inside a function to declare a variable local to that
    function. That’s a good programming practice, but if you need a “local” scope
    outside of a function, there is a way to do that, and a common variable to work
    with is the internal field separator $IFS. Normally you don’t want to change $IFS,
    because if you do, all kinds of expected behaviors fail. But every once in a while,
    you do want to change it, usually only locally, and you can do that (even outside
    a function) by prefixing a variable assignment before a command, like this read
    command we’ll talk about next:


    ```

    IFS='':'' read ...

    ```


    See also “Fiddling with $IFS for Fun and Profit, to Read Files” on page 89.


    # Readline Hacks


    Readline is the library bash uses to read and edit command lines. It may be used
    by other programs, but you can easily access it using read -e in your scripts.
    It has a lot of options you can change to tweak its behavior, and it seems many
    users are not aware of them.


    You can explore creating a ~/.inputrc file (see the bind -f command), but just
    to play, you can add these to a ~/.bashrc file (Example 10-13).


    Example 10-13. Readline tweaks


    ```

    bind ''"\e[A": history-search-backward''   # Like CTRL-R but right on the CLI  ①

    bind ''"\e[B": history-search-forward''   # Same except forward  ②

    bind ''"\C-i": menu-complete''            # Cycle through possible completions  ③

    bind ''set completion-ignore-case on''      # Ignore case in completions  ④


    # These are bash, but feel related to "CLI behavior tweaks"

    export HISTCONTROL=''erasedups:ignoredups:ignorespace''+

    export HISTIGNORE=''&: [ ]*'' # bash >= 3, omit dups & lines starting w/ space+  ⑤
    ⑥

    ```


    ① Binds the “up arrow” to history-search-backward, which means if you start typing
    a command, then hit “up arrow,” it will search for that string in your history.
    You can do something similar with CTRL-R, but “up arrow” is faster and more intuitive.
    However, CTRL-R will find strings in the middle of the command, whereas this feature
    is limited to the beginning of the line.


    ② Binds the “down arrow” to history-search-forward, which is the same as item
    1 except forward in your history.'
  - '[PAGE 126]


    ③ Instead of beeping and just sitting there when you hit TAB and the completion
    is ambiguous, start cycling through the options to complete.


    ④ Ignore case in completions for filenames and commands.


    ⑤ In saving your history, erasedups removes all previous lines matching your current
    line before saving history. ignoredups prevents saving previous duplicate lines,
    and ignorespace prevents commands that start with a leading space from being saved
    in your history. The end result of this is your history is much cleaner, because
    you don’t have duplication, but you also lose any sense of the order and sequence
    of commands, since duplicate commands are removed or never saved. You can also
    omit commands from being saved in your history, say if they contain sensitive
    data, but note that they will still be visible in the process list!


    ⑥ The same as previous, for backward compatibility with really old bash, just
    in case.


    # Using logger from bash


    The logger tool (man logger) is great for sending logs right into syslog, but
    we would argue that it has a bug, in that the -t or --tag argument is not mandatory,
    and the default is just the username. We recommend what is shown in Example 10-14.


    Example 10-14. logger tags


    ```

    logger --tag "$0[$$]" <msg>

    logger --tag "$PROGRAM[$$]" <msg>

    logger --tag "${0##*/}[$$]" <msg>

    ```


    ① The simplest case is using $0 for the name of the script and $$ for its PID.
    The problem with $0 is that it will vary depending on how the script was called,
    and that’s both noisy and inconsistent. We’d rather use the basename.


    ② If you are already using something like $PROGRAM to get the basename (Example
    8-3), then use that with logger also.


    ③ If you have not set something like $PROGRAM to the basename of your script,
    you can do it right in the logger tag. That’s starting to get a little obscure,
    but it will work. Try echo "${0##*/}[$$]" to see, but it’s a bit less interesting
    from the command line.


    If you are doing your own logging, see printf and time in “Getting or Using the
    Date and Time” on page 57.'
  - "[PAGE 127]\n\n# Handling JSON with jq\n\njq is not bash, but we want to cover\
    \ this because JSON is very common, especially when working with cloud infrastructure,\
    \ and we’ve seen some awful code out there using tools like awk, grep, and sed\
    \ to try to handle parsing JSON. Use jq instead, if possible.\n\n![](img/553ffa1bc15093729b691f706befc0ac_127_0.png)\n\
    \n# jq Is Not Always There\n\nUnfortunately, despite how common JSON has become,\
    \ jq is not always installed by default the way awk, grep, and sed are. It is\
    \ not included with Git Bash for Windows either, which does include awk, sed,\
    \ cut, grep, tr, etc.\n\nSometimes you can dodge the bullet. For example, for\
    \ AWS you can use --output=text, then use the usual tools. Otherwise, you can\
    \ install jq in your default builds or find hack-arounds using Python or other\
    \ tools, which is outside the scope of this book.\n\nThe source code for this\
    \ book includes an atlas.json file, so we can use that for some examples. If we’d\
    \ like to find the title of this book, we can do that:\n\n```\n$ jq '.title' atlas.json\n\
    \"bash Idioms\"\n$ jq -r '.title' atlas.json  # \"Raw\" mode, without the quotes\n\
    bash Idioms\n\n### But `grep` also works...sort of\n$ grep 'title' atlas.json\n\
    \  \"titlepage.html\",\n  \"title\": \"bash Idioms\",\n```\n\nWhat if we want\
    \ to know if syntax highlighting is enabled in various output formats? That’s\
    \ trickier with grep but simple with jq:\n\n```\n### What do we have?\n$ jq '.formats\
    \ | keys' atlas.json\n[\n  \"epub\",\n  \"html\",\n  \"mobi\",\n  \"pdf\"\n]\n\
    \n### Bad; this has no context and is useless\n$ grep 'syntaxhighlighting' atlas.json\n\
    \  \"syntaxhighlighting\": true,\n  \"syntaxhighlighting\": true,\n  \"syntaxhighlighting\"\
    : true,\n  \"syntaxhighlighting\": true,\n```"
  - '[PAGE 128]


    ```

    ### Good; this tells us that PDF output does have syntax highlighting

    $ jq ''.formats.pdf.syntaxhighlighting'' atlas.json

    true

    ```


    ```

    ### Better, but very confusing, show formats and syntax value, see jq docs

    $ jq -r ''.formats | keys[] as $k | "\($k), \(.[$k] \

    | .syntaxhighlighting)"'' atlas.json

    epub, true

    html, true

    mobi, true

    pdf, true

    ```


    ![](img/553ffa1bc15093729b691f706befc0ac_128_0.png)


    # Read JSON in Firefox


    Firefox has an awesome built-in JSON viewer that can really help you get a handle
    on what you are looking at and how to get jq to cough it up. Simply save your
    JSON output as myfile.json, then open file:///path/to/myfile.json in Firefox.


    # Grepping the Process List


    When you grep the process list, one of the processes in that list is your grep
    command, but that''s not what you are looking for, so you''ll see the idiom in
    Example 10-15 to remove the grep line.


    Example 10-15. Don''t do this


    ```

    ps auxw | grep ''proggy'' | grep -v ''grep''

    ```


    We think that solution is just ugly and inefficient, and we like Example 10-16
    better.


    Example 10-16. Do this


    ```

    ps auxw | grep ''[p]roggy''

    ```


    This works because the string “[p]roggy” in the process list does not match the
    regular expression /[p]roggy/ that really means “proggy”. In other words, “[p]roggy”
    != “proggy”.


    Or, you can just use pgrep -fl, or worst case, the old pidof.'
  - '[PAGE 129]


    # Rotating Old Files


    Logging is good, and archives are good, but at some point you need to “rotate”
    or delete old files. There are many idiomatic ways to do that, so we’ll talk about
    a few and make some suggestions.


    Many approaches to rotating old files involve the excellent find utility, but
    a large number of those also use -exec and/or xargs, and with modern versions
    of GNU find, those are unnecessary. The old idioms are:


    ```

    find /path/to/files -name ''some-pattern'' -a -mtime 5 -exec rm -f \{\} \;

    ```


    ```

    find /path/to/files -name ''some-pattern'' -a -mtime 5 | xargs rm -f

    ```


    ```

    find /path/to/files -name ''some-pattern'' -a -mtime 5 -print0 | xargs -0 rm -f

    ```


    ① This is extremely inefficient because it calls a new instance of rm for each
    file.


    ② This is more efficient because it will batch up files (xargs), but it will break
    and do unexpected things if filenames contain spaces.


    ③ This can also handle spaces, but it’s still more complicated than you need.


    It’s much simpler, if you are using GNU find and do not have portability concerns,
    to use the code in Example 10-17.


    Example 10-17. Delete old files using find


    ```

    find /path/to/files \( -type f -a -name ''some-pattern'' -a -mtime 5 \) -delete

    ```


    Here are some things to keep in mind:


    +   - See man find and search for atime and mtime. -mtime +5 means the file was
    last modified at least five days ago, but the “five” is not exact; see the man
    page for a discussion of the details.

    +   - For testing, use -ls or -print instead of -delete! But don’t forget to change
    it when done.

    +   - Be aware that find will recurse into any/all subdirs under the path, unless
    you limit that using -maxdepth.

    +   - You want to use the ( ) for grouping (find just these things that match
    all criteria…then delete them), but you have to escape them to prevent the shell
    from interpreting them itself.

    +   - An -a “and” operator is assumed between options in the expression; you can
    also use -o for “or” if needed. We like adding the -a anyway, because explicit
    is better than implicit.'

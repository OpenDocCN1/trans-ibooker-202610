  - "[PAGE 100]\n\n# Files and More\n\nWhat makes a plain old file a shell script,\
    \ and how do you emit exit codes? How do you read files? We’ll talk about all\
    \ that—and more—in this chapter.\n\n# Reading Files\n\nThere are three main idiomatic\
    \ ways to read files into a bash script. Some of them “slurp” the entire file\
    \ into memory, and others work one line at a time.\n\n# read\n\nWe’ve already\
    \ used read for processing key/value pairs in Chapter 2, and we’ll see it again\
    \ in “Getting User Input” on page 104, but the other major use is reading files\
    \ and parsing input one line at a time:\n\n```\n$ grep 'nobody' /etc/passwd |\
    \ read -d':' user shadow uid gid gecos home shell\n\n$ echo \"$user | $shadow\
    \ | $uid | $gid | $gecos | $home | $shell\"\n```\n\nWait, what happened? Where’s\
    \ my data? Well, that’s a gotcha—it went into the subshell created by the pipe\
    \ (|), and it never came out. What about this?\n\n```\n$ grep 'nobody' /etc/passwd\
    \ | { \\\n    read -d':' user shadow uid gid gecos home shell; \\\n    echo \"\
    $user | $shadow | $uid | $gid | $gecos | $home | $shell\" \\\n}\nnobody | | |\
    \ | | |\n```"

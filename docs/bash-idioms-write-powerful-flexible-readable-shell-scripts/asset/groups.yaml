  mdcn: "\n要提取的内容。 由于这是一个偏移量，从字符串的第一个字符开始计数为 0。 接下来，放置另一个冒号和你想要的子字符串的长度。 如果省略这个第二个冒号和长度，则会得到从该点开始的字符串的剩余全部内容。\
    \ 这里有几个例子：\n\n| shell 变量 FN 中的值 | 表达式 | 返回结果 |\n|---|---|---|\n| /home/bin/util.sh\
    \ | ${FN:0:1} | / |\n| /home/bin/util.sh | ${FN:1:1} | h |\n| /home/bin/util.sh\
    \ | ${FN:3:2} | me |\n| /home/bin/util.sh | ${FN:10:4} | util |\n| /home/bin/util.sh\
    \ | ${FN:10} | util.sh |\n\n示例 4-1 展示了使用参数扩展从某些输入中解析数据，以创建并处理用于自动创建防火墙规则配置时使用的特定字段。\
    \ 我们还在代码中加入了 bash 参数扩展的更大表格，就像本书中经常做的那样，作为“真实代码可读性”示例。 输出在示例 4-2 中。\n\n## 示例 4-1.\
    \ 使用参数扩展进行解析：代码\n\n```\n#!/usr/bin/env bash\n# parameter-expansion.sh: parameter\
    \ expansion for parsing, and a big list\n# Original Author & date: _bash Idioms_\
    \ 2022\n# bash Idioms filename: examples/ch04/parameter-expansion.sh\n# ______________________________________________________________\n\
    # Does not work on Zsh 5.4.2!\n\ncustomer_subnet_name='Acme Inc subnet 10.11.12.13/24'\n\
    \necho ''\necho \"Say we have this string: $customer_subnet_name\"\n\ncustomer_name=${customer_subnet_name%subnet*}\
    \    # Trim from 'subnet' to end\nsubnet=${customer_subnet_name##* }         \
    \      # Remove leading 'space*'\nipa=${subnet%/*}                           \
    \      # Remove trailing '/*'\ncidr=${subnet#*/}                             \
    \   # Remove up to '/*'\nfw_object_name=${customer_subnet_name// /_}      # Replace\
    \ space with '_'\nfw_object_name=${fw_object_name//-/}             # Replace '/'\
    \ with '-'\nfw_object_name=${fw_object_name,,}               # Lowercase\n\necho\
    \ ''\necho 'When the code runs we get:'\necho ''\necho \"Customer name: $customer_name\"\
    \necho \"Subnet:        $subnet\"\necho \"IPA            $ipa\"\necho \"CIDR mask:\
    \     $cidr\"\n```\n\n```\necho \"FW Object:    $fw_object_name\"\n```\n\n## bash\
    \ Shell Parameter Expansion: https://oreil.ly/Af8lw\n\n# ${var#pattern}      \
    \    Remove shortest (nongreedy) leading pattern\n# ${var##pattern}         Remove\
    \ longest (greedy) leading pattern\n# ${var%pattern}          Remove shortest\
    \ (nongreedy) trailing pattern\n# ${var%%pattern}         Remove longest (greedy)\
    \ trailing pattern\n\n# ${var/pattern/replacement}   Replace first +pattern+ with\
    \ +replacement+\n# ${var//pattern/replacement}   Replace all +pattern+ with +replacement+\n\
    \n# ${var^pattern}      Uppercase first matching optional pattern\n# ${var^^pattern}\
    \      Uppercase all matching optional pattern\n# ${var,pattern}       Lowercase\
    \ first matching optional pattern\n# ${var,,pattern}      Lowercase all matching\
    \ optional pattern\n\n# ${var:offset}          Substring starting at +offset+\n\
    # ${var:offset:length}    Substring starting at +offset+ for +length+\n\n# ${var:-default}\
    \        Var if set, otherwise +default+\n# ${var:=default}        Assign +default+\
    \ to +var+ if +var+ not already set\n# ${var:?error_message}   Barf with +error_message+\
    \ if +var+ not set\n# ${var:+replaced}        Expand to +replaced+ if +var+ _is_\
    \ set\n\n# ${#var}                Length of var\n# ${!var[*]}             Expand\
    \ to indexes or keys\n# ${!var[@]}              Expand to indexes or keys, quoted\n\
    \n# ${!prefix*}            Expand to variable names starting with +prefix+\n#\
    \ ${!prefix@}            Expand to variable names starting with +prefix+, quoted\n\
    \n# ${var@Q}               Quoted\n# ${var@E}               Expanded (better than\
    \ `eval`!)\n# ${var@P}               Expanded as prompt\n# ${var@A}          \
    \     Assign or declare\n# ${var@a}               Return attributes\n\n## 示例 4-2.\
    \ 使用参数扩展进行解析：输出\n\nSay we have this string: Acme Inc subnet 10.11.12.13/24\n\n\
    When the code runs we get:\n\n```\nCustomer name: Acme Inc\nSubnet:        10.11.12.13/24\n\
    IPA            10.11.12.13\nCIDR mask:     24\nFW Object:     acme_inc_subnet_10.11.12.13-24\n\
    ```\n\n## 条件替换\n\n其中一些变量替换是条件性的，即只有在满足某些条件时才会发生。 你可以使用围绕赋值的 if 语句来实现同样的效果，但这些习惯用法对于某些常见情况可以使代码更简短。\
    \ 这些条件替换在这里以冒号后跟另一个特殊字符显示：减号、加号或等号。 它们检查的条件是：变量是否为空或未设置？ 空变量是其值为 null 字符串的变量。\
    \ 未设置变量是指尚未分配或已明确使用 unset 命令取消设置（想想“丢弃”）的变量。 对于位置参数（如 $1、$2 等），如果用户未在该位置提供参数，则它们未设置。\n\
    \n如果你在这些条件替换中不包含冒号，则它们只考虑未设置变量的情况；空值将原样返回。\n\n## 默认值\n\n一个常见场景是脚本有一个可选的单个参数。 如果在调用脚本时未提供该参数，则应使用默认值。\
    \ 在 bash 中，我们可能会这样写：\n\n```\nLEN=${1:-5}\n```\n\n这将设置变量 LEN 为第一个参数 ($1) 的值——如果提供了参数——否则为值\
    \ 5。 这里有一个示例脚本：\n\n```\nLEN=\"${1:-5}\"\ncut -d',' -f2-3 /tmp/megaraid.out | sort\
    \ | uniq -c | sort -rn | head -n \"$LEN\"\n```\n\n它从名为 /tmp/megaraid.out 的逗号分隔值文件中取出第二和第三个字段，对这些值进行排序，提供每个值对出现的次数计数，然后显示列表中的前\
    \ 5 个。 你只需将该计数指定为脚本的唯一参数，即可覆盖默认值 5 并显示前 3 个或 10 个（或你想要的任意数量）。\n\n## 逗号分隔列表\n\n\
    另一个条件替换，使用加号，也会检查变量是否有值，如果有，则是否会返回不同的值。 也就是说，只有当变量不为空时，才返回指定的不同值。 是的，这听起来很奇怪；如果它有值，为什么要返回不同的值？\n\
    \n这种看似奇怪的逻辑的一个方便用途是构造逗号分隔列表。 你通常通过对每个值重复追加 “，value” 或 “value，” 来构造这样的列表。 在这样做时，你通常需要一个\
    \ if 语句来避免在列表的前面或后面出现多余的逗号——但在使用此连接习惯用法时不需要：\n\n```\nfor fn in * ; do\n    S=${LIST:+,}\
    \        # S for separator\n    LIST=\"${LIST}${S}${fn}\"\ndone\n```\n\n另见示例 7-1。\n\
    \n## 修改后的值\n\n到目前为止，这些替换都没有修改变量的底层值。 然而，有一个会修改。 如果我们写 ${VAR:=value}，它将与我们之前默认值的习惯用法非常相似，但有一个很大的例外。\
    \ 如果 VAR 为空或未设置，它将把该值分配给变量（因此，等号），并返回该值。 （如果 VAR 已设置，它将简单地返回其现有值。）请注意，此赋值对于位置参数（如\
    \ $1）不起作用，这就是为什么你几乎看不到它被使用的原因。\n\n## $RANDOM\n\nBash 有一个非常方便的 $RANDOM 变量。 正如 Bash\
    \ 参考手册中“Bash Variables”部分所述：\n\n> 每次引用此参数时，都会生成一个介于 0 和 32767 之间的随机整数。 给此变量赋值会为随机数生成器设置种子。\n\
    \n虽然这不适合加密功能，但它对于掷骰子或在否则过于可预测的操作中添加一点噪声很有用。 我们在第 69 页的“一个简单的词数示例”中稍后会使用它。\n\n\
    如示例 4-3 所示，你可以从列表中挑选一个随机元素。\n\n示例 4-3. 挑选一个随机列表元素\n\n```\ndeclare -a mylist\n\
    mylist=(foo bar baz one two \"three four\")\n\nrange=${#mylist[@]}\nrandom=$(($RANDOM\
    \ % $range))  # 0 to list length count\necho \"range = $range, random = $random,\
    \ choice = ${mylist[$random]}\"\n\n# Shorter but less readable 6 months from now:\n\
    # echo \"choice = ${mylist[$(($RANDOM % ${#mylist[@]}))]}\"\n```\n\n你也可能会看到类似这样的内容：\n\
    \n```\nTEMP_DIR=\"$TMP/myscript.$RANDOM\"\n[ -d \"$TEMP_DIR\" ] || mkdir \"$TEMP_DIR\"\
    \n```\n\n"

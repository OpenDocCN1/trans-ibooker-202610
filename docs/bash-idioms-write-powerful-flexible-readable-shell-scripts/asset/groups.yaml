  - "[PAGE 34]\n\nMany programming languages provide a “switch” or “match” statement,\
    \ an n-way branch, used as an alternative to a string of if/then/else clauses.\
    \ There is a similar construct in bash: the case statement. It comes with powerful\
    \ pattern matching and is very useful in scripting.\n\n# Make Your Case\n\nThe\
    \ keywords case and in delineate the value you want to compare against various\
    \ patterns. Here’s a simple example:\n\n```\ncase \"$var\" in\n  yes ) echo \"\
    glad you agreed\" ;;\n  no )\n    echo \"sorry; good bye\"\n    exit\n  ;;\n \
    \ * ) echo \"invalid answer. try again\" ;;\nesac\n```\n\n...which you can probably\
    \ figure out. It checks to see if the value in $var is “yes” or “no” and executes\
    \ the corresponding statement(s). It even has a default action. The end of the\
    \ case statement is marked by esac, which is case spelled backward. This example\
    \ is pretty readable, but it just scratches the surface. You’ll also note that\
    \ you used two different block styles, a “one-liner” for yes and a more typical\
    \ block (closed by ;;...more on that later) for no. Which you use depends on what\
    \ you are doing and how the code lines up for readability."
  - "[PAGE 35]\n\n![](img/553ffa1bc15093729b691f706befc0ac_35_0.png)\n\n# ( in case\n\
    \nThe syntax for the case statement includes an optional “(” to match the “)”\
    \ in the example. For example, we could have written (\"yes\") instead of just\
    \ \"yes\") and similarly for the other items. We’ve rarely seen this used, though.\
    \ After all, who wants to type an extra character?\n\nThe real power of the case\
    \ statement, and the most idiomatic appearance, comes from using the shell’s pattern\
    \ matching for the various possible value comparisons:\n\n```\ncase \"$var\" in\n\
    \  [Nn][Oo]* )\n    echo \"Fine. Leave then.\"\n    exit\n  ;;\n  [Yy]?? | [Ss]ure\
    \ | [Oo][Kk]* )\n    echo \"OK. Glad we agree.\"\n  ;;\n  * ) echo 'Try again.'\n\
    \    continue\n  ;;\nesac\n```\n\nHere is a quick review of bash pattern matching,\
    \ which you are probably familiar with as command line wildcards (or globs). There\
    \ are three special characters to watch for: ? matches a single character, * matches\
    \ any number of characters (including none), and brackets, [], match any of the\
    \ characters included between the brackets.\n\nIn our example, the construct [Yy]\
    \ matches either uppercase Y or lowercase y. The construct [Nn][Oo]* matches either\
    \ upper- or lowercase N, followed by either upper- or lowercase O, followed by\
    \ any number of any other characters. The pattern matches the following words\
    \ (and others, too): no, No, nO, NO, noway, Not Ever, and nope. It will not be\
    \ a match if the value of $var is the word never.\n\nCan you guess some possible\
    \ values for the affirmative case? The vertical bar separates different patterns\
    \ that would all lead to the same result. (Think “OR” but not the || or.) The\
    \ words Yes, yes, YES, yEs, yES, yup, Sure, sure, OK, ok, and OKfine and “OK why\
    \ not” would all work. But these words would not: ya, SURE, oook, and many more.\n\
    \nThe default case isn’t special syntax—it’s just a pattern—but this pattern would\
    \ match anything. If no other previous pattern has produced a match, then we know\
    \ that this one will—it matches any number of any characters. Therefore, bash\
    \ script writers put this one last in the list if they want to catch a default\
    \ case."

    \ integer. Or in other words, an array is a variable containing a list instead\
    \ of a scalar or single value. An associative array is a type of list that is\
    \ indexed by a string instead of an integer. So it’s a list of key-value pairs,\
    \ that basically forms a dictionary or look-up table, where internally the key\
    \ is hashed to form a memory location. More or less.\n\nThe bash documentation\
    \ uses the terms *array* and *associative arrays*, but depending on your background,\
    \ *lists* and *hashes*, or possibly *dictionaries* or *dicts*, may be more familiar,\
    \ and they are certainly easier to type and say. The bash documentation also uses\
    \ *subscript* where other people might say *index*. We usually follow the bash\
    \ docs for consistency, but for these we’re going to use the more common and understandable\
    \ *list*, *hash*, and *subscript* terms.\n\nEven though lists (arrays) came first,\
    \ hashes (associative arrays) are slightly simpler because there is never any\
    \ question about supplying the index (subscript), because it’s required. The integer\
    \ index of a list may be implied, and while it’s not really complicated, there\
    \ are operations that work for them that make no sense for a hash.\n\nAs the bash\
    \ reference says, “Bash provides one-dimensional indexed and associative array\
    \ variables.” While it’s possible to create really ugly multidimensional structures,\
    \ doing so in bash will probably end in tears. If you really need to do that,\
    \ consider doing it in a different language.\n\n![](img/553ffa1bc15093729b691f706befc0ac_75_0.png)\n\
    \n## Watch Out for bash Versions with Hashes\n\nYou really need to be careful\
    \ about your bash version here. As we just said, bash didn’t get hashes (i.e.,\
    \ associative arrays) until version 4.0, and it took a couple of versions to sort\
    \ out some details, like allowing $list[-1] to refer to the last integer element\
    \ (v4.3), instead of needing $mylist[${#mylist[*]}-1] (where ${#mylist[*]} is\
    \ the element count). Ouch.\n\nAs we said in “bash on Mac” on page ix, watch out\
    \ for stock bash on a Mac; it’s quite old. You’ll find newer versions in MacPorts,\
    \ Homebrew, or Fink.\n\n![](img/553ffa1bc15093729b691f706befc0ac_75_1.png)\n\n\
    ## Not POSIX\n\nAlso, arrays (lists and hashes) are not specified by POSIX, so\
    \ if portability beyond bash is a concern, you’ll need to be very careful using\
    \ them because they might not work. For example, the Zsh syntax is a bit different,\
    \ so these examples won’t work on that on a Mac either.\n\n## Commonalities\n\n\
    Lists and hashes are very similar in bash, so we’re going to start with what they\
    \ have in common, then get to where they are different. In fact, you can treat\
    \ lists as a subset of hashes that simply happen to have ordered integer indexes.\
    \ We don’t think you should do that, but you can.\n\nLists are inherently ordered,\
    \ whereas hashes are inherently unordered, so there are operations like shift\
    \ or push that only make sense for an ordered list. On the other hand, you would\
    \ never need to sort the keys in an ordered list, but you might for a hash.\n\n\
    ![](img/553ffa1bc15093729b691f706befc0ac_75_2.png)\n\n## Accidental Assignment\n\
    \nAn accidental assignment without a subscript will affect element zero, so myarray=foo\
    \ results in creating or overwriting $myarray[0] with foo, even if it’s a hash!\n\
    \nFrom the bash docs:\n\nIf the subscript is @ or *, the word expands to all members\
    \ of the array name. These subscripts differ only when the word appears within\
    \ double quotes. If the word is double-quoted, \"${name[*]}\" expands to a single\
    \ word with the value of each array member separated by the first character of\
    \ the IFS variable (see “Fiddling with $IFS for Fun and Profit, to Read Files”\
    \ on page 89), whereas \"${name[@]}\" expands each element of name to a separate\
    \ word.\n\nThat’s a mouthful isn’t it? We’ve already talked about that in “Quotes\
    \ and Spaces” on page 14, but it’s important because, as we’ll show, if you get\
    \ it wrong you can hurt yourself. We’ve used printf \"%q\" with a pipe (|) delimiter\
    \ in Example 7-1 to show “shell quoted” strings (technically “words”) in a way\
    \ that is visible in the output on the screen or on this page. The quoting rules\
    \ are actually the same as we cover in Chapter 2, just in the context of a list\
    \ or hash.\n\n## Lists\n\nAs we said, arrays, also known as lists, are variables\
    \ containing multiple elements that are indexed or referred to by an integer.\n\
    \nIn bash they start from zero and may be declared using declare -a, local -a,\
    \ readonly -a, or by just assigning to a new variable like mylist[0]=foo or mylist=()\
    \ (empty list). Once a variable is declared as a list, a simple assignment like\
    \ mylist+=(bar) is the same as a push, which adds an item to the end of the list,\
    \ but note the + and (), both of which are critical. See Table 7-1 for an example.\n\
    \nTable 7-1. Sample bash list\n\n| Element | Value |\n|---|---|\n| mylist[0] |\
    \ foo |\n| mylist[1] | bar |\n| mylist[2] | baz |\n\nThe common operations on\
    \ an array or list are:\n\n- Declare a variable as a list\n- Assign one or more\
    \ values to it\n- If treating it as a stack (think plates in a cafeteria; FIFO:\
    \ first on, first off, or first in, first out):\n  - push\n  - pop\n- Display\
    \ (dump) all values for debugging or reuse\n- Reference one or all values (for,\
    \ or for each)\n- Reference a subset (slice) of values\n- Delete one or more values\n\
    - Delete the entire list\n\nRather than talk about all of that, we’re going to\
    \ show you instead, and you can just pick out the idioms you need when you need\
    \ them (Example 7-1).\n\n## Example 7-1. bash list example: code\n\n```\n#!/usr/bin/env\
    \ bash\n# lists.sh: bash list example code\n# Original Author & date: _bash Idioms_\
    \ 2022\n# bash Idioms filename: examples/ch07/lists.sh\n# ______________________________________________________________________________\n\
    # Does not work on Zsh 5.4.2!\n\n# Books are not as wide as some screens!\nFORMAT='fmt\
    \ --width 70 --split-only'\n\n# Declare a list\n# declare -a mylist   # Can do\
    \ this, or `local -a` or `readonly -a` or:\nmylist[0]='foo'      # This both declares\
    \ and assigns to mylist[0]\n\n# OR Both declares & assigns:\n#mylist=(foo bar\
    \ baz three four \"five by five\" six)\n\n# Push or assign, note the += and ()\n\
    ###mylist=(bar)          # Would overwrite mylist[0]\nmylist+=(bar)          #\
    \ mylist[1]\nmylist+=(baz)          # mylist[2]\nmylist+=(three four)   # mylist[3]\
    \ AND mylist[4]\nmylist+=(\"five by five\")  # mylist[5] Note spaces and quotes\n\
    mylist+=(\"six\")       # mylist[6]\n\n# OR APPEND, note the \"+\" and we're assuming\
    \ foo was already assigned\n#mylist+=(bar baz three four \"five by five\" six)\n\
    \n# Display or dump the values\necho -e \"\\nThe element count is: ${#mylist[@]}\"\
    \necho -e \"\\nThe length of element [4] is: ${#mylist[4]}\"\n\necho -e \"\\nDump\
    \ or list:\"\ndeclare -p mylist | $FORMAT\necho -n \"  ${mylist[@]}  = \"; printf\
    \ \"%q|\"  ${mylist[@]}\necho -en \"\\n${mylist[*]}  = \"; printf \"%q|\"  ${mylist[*]}\n\
    echo -en \"\\n\\n${mylist[@]}\\\" = \"; printf \"%q|\" \"${mylist[@]}\"\necho\
    \ -en \"\\n\\\"${mylist[*]}\\\" = \"; printf \"%q|\" \"${mylist[*]}\"\n```\n\n\
    ```\necho -e \"  # Broken!\"  # Previous line is bad and no newline\n# See `help\
    \ printf` or chapter 6 \"printf for reuse or debugging\", we need\n# this to show\
    \ the correct words:\n# %q quote the argument in a way that can be reused as shell\
    \ input\n\n# \"Join\" the values\nfunction Join { local IFS=\"$1\"; shift; echo\
    \ \"$*\"; } # One character delimiter!\n# Note that the Join above requires \"\
    $*\" and not \"${0}\"!\necho -en \"\\nJoin ',' ${mylist[@]} = \"; Join ',' \"\
    ${mylist[@]}\"\nfunction String_Join {\n    local delimiter=\"$1\"\n    local\
    \ first_element=\"$2\"\n    shift 2\n    printf '%s ' \"$first_element\" \"${@/#/$delimiter}\"\
    \n    # Print first element, then reuse the '%s' format to display the rest of\n\
    \    # the elements (from the function args $@), but add a prefix of $delimiter\n\
    \    # by \"replacing\" the leading empty pattern (/#) with $delimiter.\n}\necho\
    \ -n \"String_Join '<>' ${mylist[@]} = \" ; String_Join '<>' \"${mylist[@]}\"\n\
    \n# Iterate over the values\necho -e \"\\nforeach \\\"\\${!mylist[@]}\\\":\"\n\
    for element in \"${!mylist[@]}\"; do\n    echo -e \"\\tElement: $element; value:\
    \ ${mylist[$element]}\"\ndone\n\necho -e \"\\nBut don't do this: ${mylist[*]}\"\
    \nfor element in ${mylist[*]}; do\n    echo -e \"\\tElement: $element; value:\
    \ ${mylist[$element]}\"\ndone\n\n# Handle slices (subsets) of the list, shift\
    \ and pop\necho -e \"\\nStart from element 5 and show a slice of 2 elements:\"\
    \nprintf \"%q \" \"${mylist[@]:5:2}\"\necho ''  # No newline in above\n\necho\
    \ -e \"\\nShift FIRST element [0] (dumped before and after):\"\ndeclare -p mylist\
    \ | $FORMAT      # Display before\nmylist=(\"${mylist[@]:1}\")        # First\
    \ element, needs quotes\n#mylist=(\"${mylist[@]:$count}\")  # First #count elements\n\
    declare -p mylist | $FORMAT      # Display after\n\necho -e \"\\nPop LAST element\
    \ (dumped before and after):\"\ndeclare -p mylist | $FORMAT\nunset -v 'mylist[-1]'\
    \            # bash v4.3+\n#unset -v \"mylist[${#mylist[*]}-1]\"  # Older\ndeclare\
    \ -p mylist\n\n# Delete slices\necho -e \"\\nDelete element 2 using unset (dumped\
    \ before and after):\"\ndeclare -p mylist\nunset -v 'mylist[2]'\n```\n"
  mdcn: "\n\n## 列表和哈希处理\n\n我们所知道的，计算机非常擅长计数和组织数据。我们可以使用代码来计数和组织数据，使用 *数据结构*，而这些的构建块是\
    \ *数组*。Bash 从一开始就有了数组，并在 4.0 版本中加入了 *关联数组*。你在 Bash 数组中会遇到难以阅读的代码，部分原因是 Bash 有很多历史和向后兼容性需要维护，正如我们之前提到的，但也因为一些开发者倾向于过度复杂化。数组实际上并不难实现，只要稍加思考，你就可以清晰地书写它们。\n\
    \n作为复习，在计算机科学和编程中，数组是包含多个元素并由整数索引或引用的变量。或者说，数组是一个包含列表而不是标量或单个值的变量。关联数组是一种由字符串而不是整数索引的列表类型。所以它是一个键值对列表，基本上形成了一个字典或查找表，其中内部将键哈希以形成内存位置。大致如此。\n\
    \nBash 文档使用 *数组* 和 *关联数组* 术语，但根据你的背景，*列表* 和 *哈希*，或者可能是 *字典* 或 *dict*，可能更熟悉，而且它们肯定更容易输入和说。Bash\
    \ 文档还使用 *下标*，而其他人可能会说 *索引*。我们通常为了保持一致而遵循 Bash 文档，但对于这些，我们将使用更常见、更易于理解的 *列表*、*哈希*\
    \ 和 *下标* 术语。\n\n即使列表（数组）出现得更早，哈希（关联数组）稍微简单一些，因为永远不会有关于提供索引（下标）的疑问，因为它是必需的。列表的整数索引可能是隐含的，虽然它并不复杂，但有一些操作适用于它们，而对哈希来说毫无意义。\n\
    \n正如 Bash 参考手册所说，“Bash 提供一维索引和关联数组变量。” 虽然可以创建非常丑陋的多维结构，但在 Bash 中这样做很可能会以眼泪告终。如果你真的需要这样做，请考虑在另一种语言中实现。\n\
    \n![](img/553ffa1bc15093729b691f706befc0ac_75_0.png)\n\n## 使用哈希时注意 Bash 版本\n\n\
    你在这里真的需要小心你的 Bash 版本。正如我们刚才所说，Bash 直到 4.0 版本才获得哈希（即关联数组），并且花了几个版本才理清一些细节，比如允许\
    \ $list[-1] 引用最后一个整数元素（v4.3），而不是需要 $mylist[${#mylist[*]}-1]（其中 ${#mylist[*]} 是元素计数）。太糟糕了。\n\
    \n正如我们在第 ix 页“Mac 上的 bash”中所说，要注意 Mac 上的库存 bash；它相当老旧。你可以在 MacPorts、Homebrew 或\
    \ Fink 中找到更新的版本。\n\n![](img/553ffa1bc15093729b691f706befc0ac_75_1.png)\n\n## 非\
    \ POSIX\n\n此外，数组（列表和哈希）未被 POSIX 指定，因此如果可移植性超出 Bash 的范围是一个问题，你在使用它们时需要非常小心，因为它们可能无法工作。例如，Zsh\
    \ 的语法有点不同，所以这些示例在 Mac 上在该 shell 上也无法工作。\n\n## 共同点\n\n在 Bash 中，列表和哈希非常相似，所以我们将从它们共同的部分开始，然后再谈到它们不同的地方。事实上，你可以将列表视为哈希的一个子集，只是恰好具有有序整数索引。我们不认为你应该这样做，但你可以。\n\
    \n列表本质上是有序的，而哈希本质上是无序的，因此像 shift 或 push 这样的操作只对有序列表有意义。另一方面，你永远不需要对有序列表的键进行排序，但对哈希可能需要。\n\
    \n![](img/553ffa1bc15093729b691f706befc0ac_75_2.png)\n\n## 意外赋值\n\n没有下标的意外赋值会影响零号元素，因此\
    \ myarray=foo 会导致创建或覆盖 $myarray[0] 为 foo，即使它是一个哈希！\n\n来自 Bash 文档：\n\nIf the subscript\
    \ is @ or *, the word expands to all members of the array name. These subscripts\
    \ differ only when the word appears within double quotes. If the word is double-quoted,\
    \ \"${name[*]}\" expands to a single word with the value of each array member\
    \ separated by the first character of the IFS variable (see “Fiddling with $IFS\
    \ for Fun and Profit, to Read Files” on page 89), whereas \"${name[@]}\" expands\
    \ each element of name to a separate word.\n\n这不是一句话吗？我们已经在第 14 页的“引号和空格”中谈到过这个问题，但它很重要，因为，正如我们将展示的，如果你做错了，你可能会伤害自己。我们已在示例\
    \ 7-1 中使用 printf \"%q\" 和管道（|）分隔符来显示“shell 引用”的字符串（技术上是“单词”），以便在屏幕输出或本页上可见。引用规则实际上与我们在第\
    \ 2 章中介绍的相同，只是放在列表或哈希的上下文中。\n\n## 列表\n\n正如我们所说，数组，也称为列表，是包含多个元素并由整数索引或引用的变量。\n\
    \n在 Bash 中，它们从零开始，可以使用 declare -a、local -a、readonly -a 声明，或通过直接分配给新变量如 mylist[0]=foo\
    \ 或 mylist=()（空列表）来声明。一旦变量被声明为列表，像 mylist+=(bar) 这样的简单赋值就等同于 push，它将项目添加到列表末尾，但请注意\
    \ + 和 ()，两者都很关键。表 7-1 给出了一个示例。\n\n表 7-1. 示例 bash 列表\n\n| 元素 | 值 |\n|---|---|\n\
    | mylist[0] | foo |\n| mylist[1] | bar |\n| mylist[2] | baz |\n\n数组或列表的常见操作是：\n\
    \n- 声明变量为列表\n- 为其分配一个或多个值\n- 如果将其视为栈（想想自助餐厅的盘子；FIFO：先进先出，或先入先出）：\n  - push\n \
    \ - pop\n- 显示（转储）所有值以供调试或重用\n- 引用一个或所有值（for，或 for each）\n- 引用值的一个子集（切片）\n- 删除一个或多个值\n\
    - 删除整个列表\n\n与其谈论所有这些，我们将向你展示，你可以根据需要挑选所需的习惯用法（示例 7-1）。\n\n## 示例 7-1. bash 列表示例：代码\n\
    \n```\n#!/usr/bin/env bash\n# lists.sh: bash list example code\n# Original Author\
    \ & date: _bash Idioms_ 2022\n# bash Idioms filename: examples/ch07/lists.sh\n\
    # ______________________________________________________________________________\n\
    # Does not work on Zsh 5.4.2!\n\n# Books are not as wide as some screens!\nFORMAT='fmt\
    \ --width 70 --split-only'\n\n# Declare a list\n# declare -a mylist   # Can do\
    \ this, or `local -a` or `readonly -a` or:\nmylist[0]='foo'      # This both declares\
    \ and assigns to mylist[0]\n\n# OR Both declares & assigns:\n#mylist=(foo bar\
    \ baz three four \"five by five\" six)\n\n# Push or assign, note the += and ()\n\
    ###mylist=(bar)          # Would overwrite mylist[0]\nmylist+=(bar)          #\
    \ mylist[1]\nmylist+=(baz)          # mylist[2]\nmylist+=(three four)   # mylist[3]\
    \ AND mylist[4]\nmylist+=(\"five by five\")  # mylist[5] Note spaces and quotes\n\
    mylist+=(\"six\")       # mylist[6]\n\n# OR APPEND, note the \"+\" and we're assuming\
    \ foo was already assigned\n#mylist+=(bar baz three four \"five by five\" six)\n\
    \n# Display or dump the values\necho -e \"\\nThe element count is: ${#mylist[@]}\"\
    \necho -e \"\\nThe length of element [4] is: ${#mylist[4]}\"\n\necho -e \"\\nDump\
    \ or list:\"\ndeclare -p mylist | $FORMAT\necho -n \"  ${mylist[@]}  = \"; printf\
    \ \"%q|\"  ${mylist[@]}\necho -en \"\\n${mylist[*]}  = \"; printf \"%q|\"  ${mylist[*]}\n\
    echo -en \"\\n\\n${mylist[@]}\\\" = \"; printf \"%q|\" \"${mylist[@]}\"\necho\
    \ -en \"\\n\\\"${mylist[*]}\\\" = \"; printf \"%q|\" \"${mylist[*]}\"\n```\n\n\
    ```\necho -e \"  # Broken!\"  # Previous line is bad and no newline\n# See `help\
    \ printf` or chapter 6 \"printf for reuse or debugging\", we need\n# this to show\
    \ the correct words:\n# %q quote the argument in a way that can be reused as shell\
    \ input\n\n# \"Join\" the values\nfunction Join { local IFS=\"$1\"; shift; echo\
    \ \"$*\"; } # One character delimiter!\n# Note that the Join above requires \"\
    $*\" and not \"${0}\"!\necho -en \"\\nJoin ',' ${mylist[@]} = \"; Join ',' \"\
    ${mylist[@]}\"\nfunction String_Join {\n    local delimiter=\"$1\"\n    local\
    \ first_element=\"$2\"\n    shift 2\n    printf '%s ' \"$first_element\" \"${@/#/$delimiter}\"\
    \n    # Print first element, then reuse the '%s' format to display the rest of\n\
    \    # the elements (from the function args $@), but add a prefix of $delimiter\n\
    \    # by \"replacing\" the leading empty pattern (/#) with $delimiter.\n}\necho\
    \ -n \"String_Join '<>' ${mylist[@]} = \" ; String_Join '<>' \"${mylist[@]}\"\n\
    \n# Iterate over the values\necho -e \"\\nforeach \\\"\\${!mylist[@]}\\\":\"\n\
    for element in \"${!mylist[@]}\"; do\n    echo -e \"\\tElement: $element; value:\
    \ ${mylist[$element]}\"\ndone\n\necho -e \"\\nBut don't do this: ${mylist[*]}\"\
    \nfor element in ${mylist[*]}; do\n    echo -e \"\\tElement: $element; value:\
    \ ${mylist[$element]}\"\ndone\n\n# Handle slices (subsets) of the list, shift\
    \ and pop\necho -e \"\\nStart from element 5 and show a slice of 2 elements:\"\
    \nprintf \"%q \" \"${mylist[@]:5:2}\"\necho ''  # No newline in above\n\necho\
    \ -e \"\\nShift FIRST element [0] (dumped before and after):\"\ndeclare -p mylist\
    \ | $FORMAT      # Display before\nmylist=(\"${mylist[@]:1}\")        # First\
    \ element, needs quotes\n#mylist=(\"${mylist[@]:$count}\")  # First #count elements\n\
    declare -p mylist | $FORMAT      # Display after\n\necho -e \"\\nPop LAST element\
    \ (dumped before and after):\"\ndeclare -p mylist | $FORMAT\nunset -v 'mylist[-1]'\
    \            # bash v4.3+\n#unset -v \"mylist[${#mylist[*]}-1]\"  # Older\ndeclare\
    \ -p mylist\n\n# Delete slices\necho -e \"\\nDelete element 2 using unset (dumped\
    \ before and after):\"\ndeclare -p mylist\nunset -v 'mylist[2]'\n```\n\n"

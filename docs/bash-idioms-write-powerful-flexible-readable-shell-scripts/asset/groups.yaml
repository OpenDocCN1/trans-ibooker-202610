    \ 被调用的时间”。你可以提供一个可选的纪元秒时间整数来显示其他时间，这对于将纪元秒转换为人类可读时间非常方便。我们建议如果你指的是“现在”，请使用 -1\
    \ 以保持一致性和意图清晰：\n\n```\n### 使用 -v 设置 $today 变量\n$ printf -v today '%(%F)T' '-1'\n\

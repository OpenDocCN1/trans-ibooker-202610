    # Style and Readability: Recap


    In this chapter, we’ve demystified bash array (list and hash) handling and showed
    idiomatic solutions for the common use cases. While outside the scope of this
    book, there’s much more to say about lists and hashes in bash. To learn more,
    see the following resources:


    +   - https://www.gnu.org/software/bash/manual/html_node/Arrays.html#Arrays

    +   - http://wiki.bash-hackers.org/syntax/arrays

    +   - http://tldp.org/LDP/Bash-Beginners-Guide/html/sect_10_02.html

    +   - https://learning.oreilly.com/library/view/bash-cookbook-2nd/9781491975329

    +   - man uniq

    +   - man sort


    When you get the data structure correct, the rest of the code practically writes
    itself. When you get the data structure wrong, everything is a struggle. Bash
    has the building blocks for simple data structures, and once you get used to a
    little extra punctuation, they’re not that hard to use and read. Just remember:
    you almost always want [@] and not [*], and refer back to our cheat sheet examples
    in this chapter when you need to.'

    \n```\n$ grep '^nobody' /etc/passwd | { \\\n  read -d':' user shadow uid gid gecos\
    \ home shell; \\\n  echo \"$user | $shadow | $uid | $gid | $gecos | $home | $shell\"\
    \ \\\n}\nnobody | x | 65534 | 65534 | nobody | /nonexistent | /usr/sbin/nologin\n\
    ```\n\n另见第 89 页的“Fiddling with $IFS for Fun and Profit, to Read Files”。\n\n![](img/553ffa1bc15093729b691f706befc0ac_101_0.png)\n\
    \n### lastpipe\n\n如果你运行的是 bash 4+，可以设置 shopt -s lastpipe，这将使管道的最后一个命令在当前 shell\
    \ 中运行，以便你的脚本可以看到环境。请注意，这仅在作业控制被禁用时才有效，而这是在脚本中默认的，但在交互式会话中不是。你可以使用 set +m 禁用作业控制，但这会禁用\
    \ CTRL-C、CTRL-Z、fg 和 bg，所以我们不建议这样做。\n\n### mapfile\n\nmapfile 也称为 readarray，但它们是同一个命令。添加到\
    \ bash v4 中，mapfile 将文件读入数组（列表）并具有选项可一次读取仅 -n count 行、跳过 -s count 行、显示进度指示器（-c/-C）等。这比其他方法更容易使用。\n\
    \n简单的用法，嗯，很简单，它会将整个文件“slurp”到内存中，如示例 9-1 所示。\n\nExample 9-1. Simple mapfile\n\n\
    ```\nmapfile -t nodes < /path/to/list/of/hosts  # -t removes newlines\n```\n\n\
    ```\n# Loop around the nodes\nfor node in ${nodes[@]}; do\n  ssh $node 'echo -e\
    \ \"$HOSTNAME:\\t$(uptime)\"'\ndone\n```\n\n使用 -n 会稍微复杂一些，因为虽然 mapfile 会继续读取无内容，所以你必须检查它是否真的获取了数据（${#nodes[@]}\
    \ 非零），否则你会创建一个无限循环（示例 9-2）。\n\n### Example 9-2. Batch mapfile example\n\n```\n\
    BATCH=10\n# While we're reading data...   && there is still data there!\nwhile\
    \ mapfile -t -n $BATCH nodes && (( ${#nodes[@]} )); do\n    for node in ${nodes[@]};\
    \ do\n        ssh $node 'echo -e \"$HOSTNAME:\\t$(uptime)\"'\n    done\ndone <\
    \ /path/to/list/of/hosts\n```\n\n当然，你可以做得更花哨，并添加一些运行时用户反馈。你可能还需要出于各种原因限制你的进程，所以你可以做类似示例\
    \ 9-3 中的代码。\n\n### Example 9-3. Fancy mapfile example: code\n\n```\n#!/usr/bin/env\
    \ bash\n# fancy_mapfile.sh: Fancy `mapfile` example\n# Original Author & date:\
    \ _bash Idioms_ 2022\n# bash Idioms filename: examples/ch09/fancy_mapfile.sh\n\
    # ----------------------------------------------------------------------------\n\
    # Does not work on Zsh 5.4.2!\n\nHOSTS_FILE='/tmp/nodes.txt'\n\n# Create test\
    \ file\n> $HOSTS_FILE\nfor n in node{0..9}; do echo \"$n\" >> $HOSTS_FILE; done\n\
    \n### ADJUSTABLE VARIABLES\n#BATCH_SIZE=0  # Do the entire file at once (default);\
    \ watch out for memory\nBATCH_SIZE=4\nSLEEP_SECS_PER_NODE=1     # Can set to 0\n\
    SLEEP_SECS_PER_BATCH=1    # Set to zero if `BATCH_SIZE=0`!\n\n# Display runtime\
    \ feedback to STDERR (so STDOUT can go into `tee` or a file)\nnode_count=\"$(cat\
    \ $HOSTS_FILE | wc -l)\"\nbatch_count=\"$(( node_count / BATCH_SIZE ))\"\necho\
    \ '' 1>&2\necho \"Nodes to process:          $node_count\" 1>&2\necho \"Batch\
    \ size and count:      $BATCH_SIZE / $batch_count\" 1>&2\necho \"Sleep seconds\
    \ per node:    $SLEEP_SECS_PER_NODE\" 1>&2\necho \"Sleep seconds per batch:  \
    \ $SLEEP_SECS_PER_BATCH\" 1>&2\necho '' 1>&2\n\nnode_counter=0\nbatch_counter=0\n\
    # While we're reading data...   && there is still data in $HOSTS_FILE\nwhile mapfile\
    \ -t -n $BATCH_SIZE nodes && (( ${#nodes[@]} )); do\n    for node in ${nodes[@]};\
    \ do\n        echo \"node $(( node_counter++ )): $node\"\n```\n```\nsleep $SLEEP_SECS_PER_NODE\n\
    done\n(( batch_counter++ ))\n# Don't get stuck here AFTER the last (partial) batch...\n\
    [ \"$node_counter\" -lt \"$node_count\" ] && {\n    # You can also use `mapfile\
    \ -C Call_Back -c $BATCH_SIZE` for feedback but\n    # it runs the callback up\
    \ front too, so if you have a delay you'll\n    # have to wait for that\n    echo\
    \ \"Completed $node_counter of $node_count nodes;\" \\\n        \"batch $batch_counter\
    \ of $batch_count;\" \\\n        \"sleeping for $SLEEP_SECS_PER_BATCH seconds...\"\
    \ 1>&2\n    sleep $SLEEP_SECS_PER_BATCH\n}\ndone < $HOSTS_FILE\n```\n\n- 1. 为此示例创建一个简单的测试文件。\n\
    - 2. 这不是“无用的 cat 使用”。通常 wc -l 输出为 <行数> <文件名>，但我们只想要 <行数>，而没有该选项。当从 STDIN 读取时，wc\
    \ 不会显示文件名，这正是我们想要的。\n- 3. 请记住，bash 仅做整数运算，因此批次数可能会有截断错误。\n- 4. 仅整数运算；参见之前的说明。\n\
    - 5. 你注意到我们在 for 循环中懒惰地没有对 ${nodes[@]} 加引号了吗？我们可以用它，因为我们读取的是主机名，它们不允许空格。但最好养成一致的习惯并使用引号。\n\
    \n输出如示例 9-4 所示。\n\n### Example 9-4. Fancy mapfile example: output\n\n```\nNodes\
    \ to process:      10\nBatch size and count:  4 / 2\nSleep seconds per node: 1\n\
    Sleep seconds per batch: 1\n\nnode 0: node0\nnode 1: node1\nnode 2: node2\nnode\
    \ 3: node3\nCompleted 4 of 10 nodes; batch 1 of 2; sleeping for 1 seconds...\n\
    node 4: node4\nnode 5: node5\n```\n```\nnode 6: node6\nnode 7: node7\nCompleted\
    \ 8 of 10 nodes; batch 2 of 2; sleeping for 1 seconds...\nnode 8: node8\nnode\
    \ 9: node9\n```\n\n另见：\n\n- - help mapfile.\n- - 或 help readarray，但它只会指向 mapfile。\n\
    - - 关于使用 mapfile 清理 AWS S3 存储桶的一个不错用例，请参阅 https://oreil.ly/xie4t。\n\n### Brute\
    \ Force\n\n示例 9-5 显示了整个文件如何被“slurp”到内存中。\n\nExample 9-5. Brute force file reading\
    \ examples\n\n```\nfor word in $(cat file); do\n  echo \"word: $word\"\ndone\n\
    ```\n\n```\n### Or, remove the \"useless use of cat\"\nfor word in $(< file);\
    \ do\n  echo \"word: $word\"\ndone\n```\n\n### Fiddling with $IFS for Fun and\
    \ Profit, to Read Files\n\n$IFS 是“内部字段分隔符”，用于所有单词分割。默认是 <空格><制表符><换行符>，或使用 $'\
    \ ' ANSI C 引号机制的 IFS='$' \\t\\n'，这对 bash 习语至关重要。如果你更改 $IFS 而不真正理解自己在做什么，可能会出现奇怪的事情。特别是\
    \ $IFS 的第一个字符，默认是空格，也用于单词扩展，如果你更改它，可能会导致混乱。如果你真的认为需要更改 $IFS 的值，要么在函数中使用 local，要么将其本地化到命令（参见第\
    \ 110 页的“Local Variables”）。示例 9-6 说明了这一点。\n\nExample 9-6. Changing IFS for read\
    \ example: code\n\n```\n#!/usr/bin/env bash\n# fiddle-ifs.sh: Fiddling with $IFS\
    \ for fun and profit, to read files\n# Original Author & date: _bash Idioms_ 2022\n\
    # bash Idioms filename: examples/ch09/fiddle-ifs.sh\n#_______________________________________________________________\n\
    ```\n"

    ![](img/553ffa1bc15093729b691f706befc0ac_36_0.png)


    # Not RegEx


    The pattern matching used in the case statement is not regular expressions. There
    is only one place in bash where regular expressions (regex or regexp) are allowed,
    and that’s in the if statement using the =~ comparison operator. If you really
    need to use regex, then you need to use a series of if/then/else statements instead
    of case.


    # A Realistic Use Case


    Code that parses command line options is a common place to find a case statement.
    Let’s look at a simple but somewhat realistic script that makes good use of a
    case statement.


    # Motivation


    If you’ve ever used Linux or Unix, you’ve likely made extensive use of the ls
    command to list out filenames and related information. Some options to ls are
    quite handy at giving more information or sorting it in certain ways. You might
    develop certain habits of how you use ls or the options you use most frequently.
    As a result, you might create some aliases or even entire scripts to make it easier
    to use your favorite combinations. But then you end up with several distinct scripts.
    They’re all related in functionality but all distinct. How might we combine them
    all into one script?


    Consider a familiar example, the popular source control software called Git. It
    has several related but distinct functions, all invoked with the one command name
    git but each distinguished by a separate second keyword, for example, git clone,
    git add, git commit, git push, and so forth.


    # Our Script


    We can apply this “subcommand” approach to our situation. Let’s consider a few
    ls-related functions that we’d like to use: listing the files in order of filename
    length (along with the length), listing just the longest filename, listing the
    last few most recently modified files, and listing filenames with color coding
    indicating file type—a standard feature of ls but one that requires a few hard-to-remember
    options.


    Our script will be named list, but there will be a second word to specify one
    of these functions. That word could be color, last, length, or long. Example 3-1
    contains a script that does that.'
  - "[PAGE 37]\n\n# Example 3-1. Simple wrapper script using case\n\n```\n#!/usr/bin/env\
    \ bash\n# list.sh: A wrapper script for ls-related tools & simple `case..esac`\
    \ demo\n# Original Author & date: _bash Idioms_ 2022\n# bash Idioms filename:\
    \ examples/ch03/list.sh\n# ----------------------------------------------------------------------------\n\
    VERSION='v1.2b'\n\nfunction Usage_Exit {\n    echo \"$0 [color|last|len|long]\"\
    \n    exit\n}\n\n# Show each filename preceded by the length of its name, sorted\
    \ by filename\n# length. Note '-' is valid but uncommon in function names, but\
    \ it is not\n# valid in variable names. We don't usually use it, but you can.\n\
    function Ls-Length {\n    ls -1 \"$@\" | while read fn; do\n        printf '%3d\
    \ %s\\n' ${#fn} ${fn}\n    done | sort -n\n}\n\n(( $# < 1 )) && Usage_Exit\nsub=$1\n\
    shift\n\ncase $sub in\n    color)\n        ls -N --color=tty -T 0 \"$@\"    #\
    \ Colorized ls\n    ;;\n    last | latest)\n        ls -lrt | tail \"-n${1:-5}\"\
    \     # Latest files\n    ;;\n    len*)\n        Ls-Length \"$@\"            \
    \     # Files with name lengths\n    ;;\n    long)\n        Ls-Length \"$@\" |\
    \ tail -1       # File with longest name\n    ;;\n    *)\n        echo \"unknown\
    \ command: $sub\"    # Default\n        Usage_Exit\n    ;;\nesac\n```"
  - '[PAGE 38]


    We won’t explain all the parts of this script here, though by the end of this
    book, you will have learned about all the features used. We want to focus mainly
    on the case statement:


    +   1. Do you recognize the non-if if logic? If not, (re)read Chapter 1.

    +   2. This is a simple “or” choice between two words.

    +   3. Use tail -n5 as the default if a value is not given in $1; see “Default
    Values” on page 38.

    +   4. This pattern will match any word that begins with “len,” so either “len”
    or “length” with match, but so will “lenny” and “lens.” It then calls the Ls-Length
    function (which we defined in the script), passing it all the command line arguments
    (if any) supplied to this script.


    # Wrapper Scripts


    Everyone has a lot going on, and a lot to remember, so when you can automate or
    write a script to remember details for you, that’s a win. We showed one way to
    do a “wrapper script” in Example 3-1, but there are a number of interesting variations
    and tricks that you can use depending on the complexity of the problem you are
    solving or details you are “remembering.” In Example 3-1, we called a function
    or just put the code inline. That works best with very short code blocks, which
    in our experience are quite common in these kinds of wrapper scripts. If you have
    a more complicated solution, or you are working with existing tools, you can call
    those or a sub-script instead, though you need to tweak the error-checking and
    possibly usage options. You can also combine that with “Drop-in Directories” on
    page 93 and source all the “modules” from a directory, perhaps to delegate maintenance
    of parts of the code to other people or teams.


    This larger example is actually a simplified and excerpted version of a script
    we used while writing this book. AsciiDoc is cool, but we work with a lot of markup
    languages and they all blur together, so we can write a tool to remember things
    for us, shown in Example 3-2.


    Example 3-2. Complex wrapper script using case


    ```

    #!/usr/bin/env bash

    # wrapper.sh: Simple "wrapper" script demo

    # Original Author & date: _bash Idioms_ 2022

    # bash Idioms filename: examples/ch03/wrapper.sh

    #_____________________________________________________________________________

    # Trivial Sanity Checks

    ```'

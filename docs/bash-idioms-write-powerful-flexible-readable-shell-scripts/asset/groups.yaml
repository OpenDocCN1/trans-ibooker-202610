  - "[PAGE 69]\n\nSo how is the script writer supposed to get any useful results back\
    \ from a bash function? There are two typical approaches. One way is to treat\
    \ the function just like you would any shell script—have its output be the return\
    \ values. You might pipe that output into the next part of your script that needs\
    \ the results from the function, or you might capture that output using $() notation.\
    \ The $() will run the function in a subshell and you can assign the result (the\
    \ function’s output) to a variable, and then use that variable on another command\
    \ line.\n\nAnother way to return results from a function in a shell script is\
    \ to use something not available to an external script—global variables.\n\n#\
    \ Local Variables\n\nConsider a function that has some looping inside it, done\
    \ by using a for loop, and that for loop uses an index variable i to count the\
    \ iterations. Now consider what would happen if the function itself were called\
    \ from within the body of a for loop, a loop that also happened to be controlled\
    \ using i as an index variable. Since bash variables are global, then the (inner)\
    \ function will affect the outer loop index. Not good. What to do?\n\nBash provides\
    \ a syntax to let you declare variables as “local” so that they are not seen outside\
    \ the function. Variables like i in a for loop should be declared as local variables:\n\
    \n```\nfunction Summer {\n    local i\n    SUM=0\n    for((i=0; i<$1; i++)) {\n\
    \        let SUM+=i;\n    }\n}\n```\n\nProblem solved. It might be even better\
    \ to use local -i i or declare -i i to declare i as an integer value, avoiding\
    \ conversions to/from string. The declare inside a function acts just like the\
    \ local in hiding any global variable by that name. The use of the -i option (in\
    \ either case) allows you to specify the integer aspect of the variable.\n\nThe\
    \ variable SUM in this example is not declared local because that is how the result\
    \ of the function call is being returned to the caller. Should all variables in\
    \ a function be declared local unless they are needed outside the script? Quite\
    \ possibly, but since there is no way to enforce it, few programmers are that\
    \ thorough. If you are writing functions that you expect to be shared and portable,\
    \ then it is well worth the effort and will avoid unexpected side effects."

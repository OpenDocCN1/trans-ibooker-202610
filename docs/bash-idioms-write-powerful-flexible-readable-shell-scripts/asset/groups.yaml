  - "[PAGE 44]\n\nHere’s an example of that behavior that provides details about the\
    \ path in $filename:\n\n```\ncase $filename in\n  ./*) echo -n \"local \"    \
    \      # Begins with ./\n      ;&                           # Fall through!\n\
    \  [^/]*) echo -n \"relative \"      # Starts w/ anything but a slash\n      ;;&\
    \                          # Look for other matches\n  /*) echo -n \"absolute\
    \ \"         # Begins with a slash\n      ;&                           # Fall\
    \ through\n  */*) echo \"pathname\"            # A slash anywhere\n      ;;  \
    \                         # Done\n  *) echo \"filename\"              # All other\n\
    \      ;;                           # Done\nesac\n```\n\nThe patterns will be\
    \ compared, in order, to the value in $filename. The first pattern is two literal\
    \ characters—a period and a slash—followed by any characters. If that matches\
    \ (e.g., if the value of $filename was ./this/file), then the script will print\
    \ “local” but without the newline at the end. The next line is ;&, which tells\
    \ bash to “fall through” and execute the command(s) associated with the next pattern\
    \ (without even checking for a match). So it will also print “relative.” Unlike\
    \ the previous pattern, this section of code ends with ;;&, which tells bash to\
    \ try other patterns (going forward, in order) for a match, too.\n\nSo now it\
    \ will check the next pattern, looking for a leading slash. If that doesn’t match,\
    \ the next one might. It looks for a slash anywhere in the string (any—zero or\
    \ more—characters, then a slash, then any characters). If that matches (and it\
    \ would in our example), it will print the word pathname. The ;; indicates that\
    \ no more patterns need to be examined, and it would be done.\n\n# Style and Readability:\
    \ Recap\n\nIn this chapter, we described the case statement, an n-way branch in\
    \ the flow of execution. Its pattern-matching feature makes it very useful in\
    \ scripting, though a common use is a simple, literal match of particular words.\n\
    \nThe variations ;;, ;;&, and ;& provide some useful functionality but can be\
    \ tricky. It might be better to structure such logic using if/then/else rather\
    \ than a case statement.\n\nThese symbols are so subtly different that it can\
    \ be easy to overlook what happens at each step. The control flow after a match\
    \ is made can be different for each case: to fall through executing more code,\
    \ to try to match another pattern, or to be done. Therefore we strongly encourage\
    \ you to comment on your choices in your scripts to avoid confusion or misunderstanding."

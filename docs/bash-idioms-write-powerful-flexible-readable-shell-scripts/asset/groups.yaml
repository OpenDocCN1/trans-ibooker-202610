    \ can explore creating a ~/.inputrc file (see the bind -f command), but just to\
    \ play, you can add these to a ~/.bashrc file (Example 10-13).\n\n### Example\
    \ 10-13. Readline tweaks\n\n```\nbind '\"\\e[A\": history-search-backward'   #\
    \ Like CTRL-R but right on the CLI  ①\nbind '\"\\e[B\": history-search-forward'\
    \   # Same except forward  ②\nbind '\"\\C-i\": menu-complete'            # Cycle\
    \ through possible completions  ③\nbind 'set completion-ignore-case on'      #\
    \ Ignore case in completions  ④\n\n# These are bash, but feel related to \"CLI\
    \ behavior tweaks\"\nexport HISTCONTROL='erasedups:ignoredups:ignorespace'\nexport\
    \ HISTIGNORE='&: [ ]*' # bash >= 3, omit dups & lines starting w/ space+  ⑤ ⑥\n\
    ```\n\n① Binds the “up arrow” to history-search-backward, which means if you start\
    \ typing a command, then hit “up arrow,” it will search for that string in your\
    \ history. You can do something similar with CTRL-R, but “up arrow” is faster\
    \ and more intuitive. However, CTRL-R will find strings in the middle of the command,\
    \ whereas this feature is limited to the beginning of the line.\n\n② Binds the\
    \ “down arrow” to history-search-forward, which is the same as item 1 except forward\
    \ in your history.\n\n③ Instead of beeping and just sitting there when you hit\
    \ TAB and the completion is ambiguous, start cycling through the options to complete.\n\
    \n④ Ignore case in completions for filenames and commands.\n\n⑤ In saving your\
    \ history, erasedups removes all previous lines matching your current line before\
    \ saving history. ignoredups prevents saving previous duplicate lines, and ignorespace\
    \ prevents commands that start with a leading space from being saved in your history.\
    \ The end result of this is your history is much cleaner, because you don’t have\
    \ duplication, but you also lose any sense of the order and sequence of commands,\
    \ since duplicate commands are removed or never saved. You can also omit commands\
    \ from being saved in your history, say if they contain sensitive data, but note\
    \ that they will still be visible in the process list!\n\n⑥ The same as previous,\
    \ for backward compatibility with really old bash, just in case.\n\n## Using logger\
    \ from bash\n\nThe logger tool (man logger) is great for sending logs right into\
    \ syslog, but we would argue that it has a bug, in that the -t or --tag argument\
    \ is not mandatory, and the default is just the username. We recommend what is\
    \ shown in Example 10-14.\n\n### Example 10-14. logger tags\n\n```\nlogger --tag\
    \ \"$0[$$]\" <msg>\nlogger --tag \"$PROGRAM[$$]\" <msg>\nlogger --tag \"${0##*/}[$$]\"\
    \ <msg>\n```\n\n① The simplest case is using $0 for the name of the script and\
    \ $$ for its PID. The problem with $0 is that it will vary depending on how the\
    \ script was called, and that’s both noisy and inconsistent. We’d rather use the\
    \ basename.\n\n② If you are already using something like $PROGRAM to get the basename\
    \ (Example 8-3), then use that with logger also.\n\n③ If you have not set something\
    \ like $PROGRAM to the basename of your script, you can do it right in the logger\
    \ tag. That’s starting to get a little obscure, but it will work. Try echo \"\
    ${0##*/}[$$]\" to see, but it’s a bit less interesting from the command line.\n\
    \nIf you are doing your own logging, see printf and time in “Getting or Using\
    \ the Date and Time” on page 57.\n\n## Handling JSON with jq\n\njq is not bash,\
    \ but we want to cover this because JSON is very common, especially when working\
    \ with cloud infrastructure, and we’ve seen some awful code out there using tools\
    \ like awk, grep, and sed to try to handle parsing JSON. Use jq instead, if possible.\n\
    \n![](img/553ffa1bc15093729b691f706befc0ac_127_0.png)\n\n### jq Is Not Always\
    \ There\n\nUnfortunately, despite how common JSON has become, jq is not always\
    \ installed by default the way awk, grep, and sed are. It is not included with\
    \ Git Bash for Windows either, which does include awk, sed, cut, grep, tr, etc.\n\
    \nSometimes you can dodge the bullet. For example, for AWS you can use --output=text,\
    \ then use the usual tools. Otherwise, you can install jq in your default builds\
    \ or find hack-arounds using Python or other tools, which is outside the scope\
    \ of this book.\n\nThe source code for this book includes an atlas.json file,\
    \ so we can use that for some examples. If we’d like to find the title of this\
    \ book, we can do that:\n\n```\n$ jq '.title' atlas.json\n\"bash Idioms\"\n$ jq\
    \ -r '.title' atlas.json  # \"Raw\" mode, without the quotes\nbash Idioms\n```\n\
    \n#### But `grep` also works...sort of\n```\n$ grep 'title' atlas.json\n  \"titlepage.html\"\
    ,\n  \"title\": \"bash Idioms\",\n```\n\nWhat if we want to know if syntax highlighting\
    \ is enabled in various output formats? That’s trickier with grep but simple with\
    \ jq:\n\n```\n### What do we have?\n$ jq '.formats | keys' atlas.json\n[\n  \"\
    epub\",\n  \"html\",\n  \"mobi\",\n  \"pdf\"\n]\n\n### Bad; this has no context\
    \ and is useless\n$ grep 'syntaxhighlighting' atlas.json\n  \"syntaxhighlighting\"\
    : true,\n  \"syntaxhighlighting\": true,\n  \"syntaxhighlighting\": true,\n  \"\
    syntaxhighlighting\": true,\n```\n\n```\n### Good; this tells us that PDF output\
    \ does have syntax highlighting\n$ jq '.formats.pdf.syntaxhighlighting' atlas.json\n\
    true\n```\n\n```\n### Better, but very confusing, show formats and syntax value,\
    \ see jq docs\n$ jq -r '.formats | keys[] as $k | \"\\($k), \\(.[$k] \\\n| .syntaxhighlighting)\"\
    ' atlas.json\nepub, true\nhtml, true\nmobi, true\npdf, true\n```\n\n![](img/553ffa1bc15093729b691f706befc0ac_128_0.png)\n\
    \n## Read JSON in Firefox\n\nFirefox has an awesome built-in JSON viewer that\
    \ can really help you get a handle on what you are looking at and how to get jq\
    \ to cough it up. Simply save your JSON output as myfile.json, then open file:///path/to/myfile.json\
    \ in Firefox.\n\n## Grepping the Process List\n\nWhen you grep the process list,\
    \ one of the processes in that list is your grep command, but that's not what\
    \ you are looking for, so you'll see the idiom in Example 10-15 to remove the\
    \ grep line.\n\n### Example 10-15. Don't do this\n\n```\nps auxw | grep 'proggy'\
    \ | grep -v 'grep'\n```\n\nWe think that solution is just ugly and inefficient,\
    \ and we like Example 10-16 better.\n\n### Example 10-16. Do this\n\n```\nps auxw\
    \ | grep '[p]roggy'\n```\n\nThis works because the string “[p]roggy” in the process\
    \ list does not match the regular expression /[p]roggy/ that really means “proggy”.\
    \ In other words, “[p]roggy” != “proggy”.\n\nOr, you can just use pgrep -fl, or\
    \ worst case, the old pidof.\n\n## Rotating Old Files\n\nLogging is good, and\
    \ archives are good, but at some point you need to “rotate” or delete old files.\
    \ There are many idiomatic ways to do that, so we’ll talk about a few and make\
    \ some suggestions.\n\nMany approaches to rotating old files involve the excellent\
    \ find utility, but a large number of those also use -exec and/or xargs, and with\
    \ modern versions of GNU find, those are unnecessary. The old idioms are:\n\n\
    ```\nfind /path/to/files -name 'some-pattern' -a -mtime 5 -exec rm -f \\{\\} \\\
    ;\n```\n\n```\nfind /path/to/files -name 'some-pattern' -a -mtime 5 | xargs rm\
    \ -f\n```\n\n```\nfind /path/to/files -name 'some-pattern' -a -mtime 5 -print0\
    \ | xargs -0 rm -f\n```\n\n① This is extremely inefficient because it calls a\
    \ new instance of rm for each file.\n\n② This is more efficient because it will\
    \ batch up files (xargs), but it will break and do unexpected things if filenames\
    \ contain spaces.\n\n③ This can also handle spaces, but it’s still more complicated\
    \ than you need.\n\nIt’s much simpler, if you are using GNU find and do not have\
    \ portability concerns, to use the code in Example 10-17.\n\n### Example 10-17.\
    \ Delete old files using find\n\n```\nfind /path/to/files \\( -type f -a -name\
    \ 'some-pattern' -a -mtime 5 \\) -delete\n```\n\nHere are some things to keep\
    \ in mind:\n\n- See man find and search for atime and mtime. -mtime +5 means the\
    \ file was last modified at least five days ago, but the “five” is not exact;\
    \ see the man page for a discussion of the details.\n- For testing, use -ls or\
    \ -print instead of -delete! But don’t forget to change it when done.\n- Be aware\
    \ that find will recurse into any/all subdirs under the path, unless you limit\
    \ that using -maxdepth.\n- You want to use the ( ) for grouping (find just these\
    \ things that match all criteria…then delete them), but you have to escape them\
    \ to prevent the shell from interpreting them itself.\n- An -a “and” operator\
    \ is assumed between options in the expression; you can also use -o for “or” if\
    \ needed. We like adding the -a anyway, because explicit is better than implicit.\n"
  mdcn: "\n\n## 局部变量\n\n我们在第 54 页的“Local Variables”中谈到过这个问题，但简单回顾一下，local 命令只能在函数内部使用，用来声明对该函数而言是局部的变量。这是一种良好的编程实践，但如果你需要在函数之外拥有“局部”作用域，也有一个办法，而且常用的变量是内部字段分隔符\
    \ $IFS。通常你不想更改 $IFS，因为一旦更改，许多预期行为都会失效。但偶尔你确实想更改它，通常只在局部更改，你可以做到（即使在函数之外），方法是像下面我们将要谈到的\
    \ read 命令那样，在命令前加上变量赋值：\n\n```\nIFS=':' read ...\n```\n\n另请参阅第 89 页的“Fiddling\
    \ with $IFS for Fun and Profit, to Read Files”。\n\n## Readline 技巧\n\nReadline\
    \ 是 bash 用来读取和编辑命令行行的库。它可能被其他程序使用，但你可以在脚本中很容易地通过 read -e 来访问它。它有很多选项可以调整其行为，似乎许多用户并不了解它们。\n\
    \n你可以探索创建 ~/.inputrc 文件（参见 bind -f 命令），但只是为了好玩，你可以把下面这些添加到 ~/.bashrc 文件中（示例 10-13）。\n\
    \n### 示例 10-13. Readline 调整\n\n```\nbind '\"\\e[A\": history-search-backward'\
    \   # Like CTRL-R but right on the CLI  ①\nbind '\"\\e[B\": history-search-forward'\
    \   # Same except forward  ②\nbind '\"\\C-i\": menu-complete'            # Cycle\
    \ through possible completions  ③\nbind 'set completion-ignore-case on'      #\
    \ Ignore case in completions  ④\n\n# These are bash, but feel related to \"CLI\
    \ behavior tweaks\"\nexport HISTCONTROL='erasedups:ignoredups:ignorespace'\nexport\
    \ HISTIGNORE='&: [ ]*' # bash >= 3, omit dups & lines starting w/ space+  ⑤ ⑥\n\
    ```\n\n① 将“上箭头”绑定到 history-search-backward，这意味着如果你开始输入一个命令，然后按“上箭头”，它会在你的历史记录中搜索该字符串。你可以用\
    \ CTRL-R 做类似的事情，但“上箭头”更快更直观。然而，CTRL-R 会在命令中间找到字符串，而此功能仅限于行首。\n\n② 将“下箭头”绑定到 history-search-forward，这与第\
    \ 1 项相同，只是向前查找历史记录。\n\n③ 当你按 TAB 且补全存在歧义时，不再只是蜂鸣并停在那里，而是开始循环遍历可用的补全选项。\n\n④ 在文件名和命令补全时忽略大小写。\n\
    \n⑤ 在保存历史记录时，erasedups 会在保存历史记录前删除与当前行匹配的所有先前行。ignoredups 防止保存先前的重复行，而 ignorespace\
    \ 防止以前导空格开头的命令被保存到历史记录中。其结果是你的历史记录会更干净，因为没有重复，但你也会失去命令的顺序和序列感，因为重复命令会被删除或从未保存。你也可以选择不将某些命令保存到历史记录中，例如包含敏感数据的命令，但请注意它们仍会在进程列表中可见！\n\
    \n⑥ 与上一个相同，为了与非常旧的 bash 保持向后兼容，以防万一。\n\n## 使用 logger\n\nlogger 工具（man logger）非常适合将日志直接发送到\
    \ syslog，但我们认为它有一个 bug，即 -t 或 --tag 参数不是强制性的，默认只是用户名。我们推荐示例 10-14 中所示的方法。\n\n\
    ### 示例 10-14. logger 标签\n\n```\nlogger --tag \"$0[$$]\" <msg>\nlogger --tag \"\
    $PROGRAM[$$]\" <msg>\nlogger --tag \"${0##*/}[$$]\" <msg>\n```\n\n① 最简单的情况是使用\
    \ $0 作为脚本名称，$$ 作为其 PID。$0 的问题在于它会根据脚本的调用方式而变化，这既嘈杂又不一致。我们更愿意使用 basename。\n\n②\
    \ 如果你已经像 $PROGRAM 这样使用 basename（示例 8-3），那么也可以在 logger 中使用它。\n\n③ 如果你没有为脚本的 basename\
    \ 设置类似 $PROGRAM 的变量，你可以在 logger 标签中直接完成。这开始有点晦涩，但它会起作用。尝试 echo \"${0##*/}[$$]\"\
    \ 来查看，但从命令行来看它没那么有趣。\n\n如果你要自行记录日志，请参阅“Getting or Using the Date and Time”第 57\
    \ 页中的 printf 和 time。\n\n## 使用 jq 处理 JSON\n\njq 不是 bash，但我们想涵盖它，因为 JSON 非常常见，尤其是在处理云基础设施时，我们见过一些使用\
    \ awk、grep 和 sed 等工具来尝试解析 JSON 的糟糕代码。尽可能使用 jq 代替。\n\n![](img/553ffa1bc15093729b691f706befc0ac_127_0.png)\n\
    \n### jq 并非总是可用\n\n不幸的是，尽管 JSON 已变得非常普遍，但 jq 并非像 awk、grep 和 sed 那样默认安装。它也不包含在\
    \ Windows 的 Git Bash 中，而 Git Bash 包含 awk、sed、cut、grep、tr 等。\n\n有时你可以避开这个问题。例如，对于\
    \ AWS，你可以使用 --output=text，然后使用常规工具。否则，你可以在默认构建中安装 jq，或使用 Python 等工具寻找变通方法，这超出了本书的范围。\n\
    \n本书的源代码包含一个 atlas.json 文件，因此我们可以将其用于一些示例。如果我们想找到本书的标题，可以这样做：\n\n```\n$ jq '.title'\
    \ atlas.json\n\"bash Idioms\"\n$ jq -r '.title' atlas.json  # \"Raw\" mode, without\
    \ the quotes\nbash Idioms\n```\n\n#### 但 `grep` 也能工作...有点\n```\n$ grep 'title'\
    \ atlas.json\n  \"titlepage.html\",\n  \"title\": \"bash Idioms\",\n```\n\n如果我们想知道各种输出格式是否启用了语法高亮呢？用\
    \ grep 做起来比较棘手，但用 jq 很简单：\n\n```\n### What do we have?\n$ jq '.formats | keys'\
    \ atlas.json\n[\n  \"epub\",\n  \"html\",\n  \"mobi\",\n  \"pdf\"\n]\n\n### Bad;\
    \ this has no context and is useless\n$ grep 'syntaxhighlighting' atlas.json\n\
    \  \"syntaxhighlighting\": true,\n  \"syntaxhighlighting\": true,\n  \"syntaxhighlighting\"\
    : true,\n  \"syntaxhighlighting\": true,\n```\n\n```\n### Good; this tells us\
    \ that PDF output does have syntax highlighting\n$ jq '.formats.pdf.syntaxhighlighting'\
    \ atlas.json\ntrue\n```\n\n```\n### Better, but very confusing, show formats and\
    \ syntax value, see jq docs\n$ jq -r '.formats | keys[] as $k | \"\\($k), \\(.[$k]\
    \ \\\n| .syntaxhighlighting)\"' atlas.json\nepub, true\nhtml, true\nmobi, true\n\
    pdf, true\n```\n\n![](img/553ffa1bc15093729b691f706befc0ac_128_0.png)\n\n## 在\
    \ Firefox 中读取 JSON\n\nFirefox 拥有出色的内置 JSON 查看器，可以帮助你更好地了解所看到的内容以及如何让 jq 输出它。只需将你的\
    \ JSON 输出保存为 myfile.json，然后在 Firefox 中打开 file:///path/to/myfile.json 即可。\n\n##\
    \ Grepping 进程列表\n\n当你 grep 进程列表时，列表中的一个进程就是你的 grep 命令本身，但那不是你要找的，所以你会在示例 10-15\
    \ 中看到一种习惯用法来移除 grep 行。\n\n### 示例 10-15. 不要这样做\n\n```\nps auxw | grep 'proggy'\
    \ | grep -v 'grep'\n```\n\n我们认为这种解决方案既丑陋又低效，我们更喜欢示例 10-16。\n\n### 示例 10-16. 这样做\n\
    \n```\nps auxw | grep '[p]roggy'\n```\n\n这之所以有效，是因为进程列表中的字符串 “[p]roggy” 与正则表达式\
    \ /[p]roggy/ 不匹配，而该正则表达式实际上表示 “proggy”。换句话说，“[p]roggy” != “proggy”。\n\n或者，你可以直接使用\
    \ pgrep -fl，或者最坏情况下，使用旧的 pidof。\n\n## 轮转旧文件\n\n日志记录很好，归档也很好，但总有一天你需要“轮转”或删除旧文件。有很多惯用的方法可以做到这一点，我们将讨论其中几种并提出一些建议。\n\
    \n许多轮转旧文件的方法都涉及出色的 find 工具，但其中很大一部分还使用了 -exec 和/或 xargs，而在现代版本的 GNU find 中，这些是不必要的。旧的习惯用法是：\n\
    \n```\nfind /path/to/files -name 'some-pattern' -a -mtime 5 -exec rm -f \\{\\\
    } \\;\n```\n\n```\nfind /path/to/files -name 'some-pattern' -a -mtime 5 | xargs\
    \ rm -f\n```\n\n```\nfind /path/to/files -name 'some-pattern' -a -mtime 5 -print0\
    \ | xargs -0 rm -f\n```\n\n① 这极其低效，因为它为每个文件调用一次新的 rm 实例。\n\n② 这更高效，因为它会批量处理文件（xargs），但如果文件名包含空格就会中断并产生意外的行为。\n\
    \n③ 这也可以处理空格，但它仍然比你需要的更复杂。\n\n如果你使用 GNU find 且不担心可移植性，使用示例 10-17 中的代码会简单得多。\n\n\
    ### 示例 10-17. 使用 find 删除旧文件\n\n```\nfind /path/to/files \\( -type f -a -name 'some-pattern'\
    \ -a -mtime 5 \\) -delete\n```\n\n请记住以下几点：\n\n- 请参阅 man find 并搜索 atime 和 mtime。-mtime\
    \ +5 表示文件至少在五天前最后修改过，但“五”并不精确；请参阅手册页了解细节讨论。\n- 为了测试，使用 -ls 或 -print 而不是 -delete！但完成后不要忘记更改它。\n\
    - 请注意，find 会递归进入路径下任何/所有子目录，除非你使用 -maxdepth 来限制它。\n- 你想要使用 ( ) 来分组（find 仅匹配所有条件的东西…然后删除它们），但你必须转义它们以防止\
    \ shell 自己解释它们。\n- 表达式中选项之间假定有 -a “与” 运算符；如果需要，也可以使用 -o 表示“或”。我们喜欢加上 -a，因为显式优于隐式。\n\
    \n"

    # Names


    Naming is *important*. We can’t stress that enough. The difference between `$file`
    and `$critical_process_daily_log_file` doesn’t seem like anything except some
    extra typing *now*, when all the details are in your head. But we guarantee if
    you take the extra time to really think about what you are naming and how it will
    read in the code, that will pay off soon, by reducing coding errors, and in the
    future when rereading, debugging, and enhancing. Following are style guidelines
    related to names:


    +   - Good names are critical!

    +   - Global variables and constants are in UPPER case.

    +     - Prefer not to make changes to global variables, but sometimes that’s just
    much simpler (KISS).

    +     - Use `readonly` or `declare -r` for constants.

    +   - Other variables are in lowercase.

    +   - Functions are in Mixed_Case.

    +   - Use "_", not CamelCase, in place of space (remember, "-" is not allowed
    in variable names).

    +   - Use bash arrays carefully; they can be hard to read (see Chapter 7). `for
    var in $regular_var` often works as well.

    +   - Replace $1, $2, .. $N with readable names ASAP.

    +     - That makes everything much more debuggable and readable, but it also makes
    it easy to have defaults and add or rearrange arguments.

    +   - Distinguish between types of referents, like $input_file versus $input_dir.'
  - '[PAGE 143]


    +   - Use consistent “FIXME” and “TODO” labels, with names and ticket numbers
    if appropriate.


    Consider how easy it would be to confuse these and use (or make an off-by-one
    typo) the wrong one:


    ```

    file1=''/path/to/input''

    file2=''/path/to/output''

    ```


    This is much more intuitive to read and harder to type wrong:


    ```

    input_file=''/path/to/input''

    output_file=''/path/to/output''

    ```


    Also, don’t leave out two characters to save typing; just spell out $filename
    so you don’t get it wrong later. Was it $filenm or $flname or $flnm or what?


    # Functions


    Following are style guidelines related to functions:


    +   - *Always use a header.*

    +   - Good names are critical!

    +   - Functions must be defined before they are used.

    +     — Group them at the top, and use two blank lines and a function separator
    between each function.

    +     — Do *not* intersperse code between functions!

    +   - Use Camel_Case and “_” to make function names stand out from variable names.

    +   - Use function My_Func_Name { instead of My_Func_Name() { because it’s clearer
    and easier to grep -P ''^\s*function ''.

    +   - Each function should have comments defining what it does, inputs (including
    GLOBALS), and outputs.

    +   - When you have useful, standalone pieces of code, or any time you use the
    same (or substantially similar) block of code more than once, make them into functions.
    If they are very common, like logging or emailing, consider creating a “library,”
    that is, a single common file you can source as needed.

    +     — Prefix “library” functions with “_”, like _Log or some other prefix.

    +   - Consider using “filler” words for readability in arguments if it makes sense,
    then define them as local junk1="$2" # Unused filler, e.g.:

    +     — _Create_File_If_Needed "/path/to/$file" containing *important value*'
  - '[PAGE 144]


    +   - Do use the local builtin when setting variables in functions.

    +     — But be aware that successfully being “local,” it will mask a failed return
    code, so declare and assign it on separate lines if using command substitution,
    like local my_input and then my_input="$(some-command)".

    +   - For any function longer than about 25 lines, close it with } # End of function
    MyFuncName to make it easier to track where you are in the code on your screen.
    For functions shorter than 25 lines, this is optional but encouraged unless it
    gets too cluttered.

    +   - Don’t use a main function; it’s almost always just an unnecessary layer.

    +     — That said, using “main” makes sense to Python and C programmers, or if
    the code is also used as a library, and it may be required if you do a lot of
    unit testing.

    +   - Consider using two blank lines and a main separator above the main section,
    especially when you have a lot of functions and definitions at the top.


    Also, define a single logging function in your library (e.g., _Log), and use it!
    Otherwise you’ll end up with a wild mix of logging functions, styles, and destinations.
    Ideally, as we said previously, log to syslog and let the OS worry about final
    destination(s), log rotation, etc.


    # Quoting


    Quoting is pretty simple, until it’s not, and then you get a headache. We know
    how this works, and we still end up doing trial-and-error sometimes, especially
    when trying to create a one-liner to run as another user via sudo or on another
    node via ssh. Add some echo lines, and be careful. Following are style guidelines
    related to quoting:


    +   - Do put quotes around variables and strings because it makes them stand out
    a little and clarifies your intent.

    +     — Unless it gets too cluttered.

    +     — Or they need to be unquoted for expansion.

    +   - Don’t quote integers.

    +   - Use single quotes unless interpolation is required.

    +   - Don’t use ${var} unless needed; it’s too cluttered.

    +     — But that is needed sometimes, like ${variable}_suffix or ${being_lower_cased,,}.

    +   - Do quote command substitutions, like var="$(command)".'

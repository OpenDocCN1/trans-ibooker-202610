    or empty.

    +     — Or echo "cd to [$DIR] failed." as you like.

    +     — If using set -u, you will get an error if the variable is not defined—but
    not if it is defined but is just unexpectedly empty.


    +   - Prefer single quotes around printf formats (see “POSIX Output” on page 56
    and the rest of “Time for printf” on page 55).


    # Layout


    +   - Line things up! Multiple spaces almost never matter in bash (except around
    =), and lining up similar commands makes it easier to read and to see both the
    similarities and differences.


    +   - Do not allow trailing white space! This will later cause noise in the VCS
    (version control system) when removed.


    +   - Indent using four spaces, but use TAB with here-documents as needed.


    +   - Break long lines at around 78 columns, indent line continuations two spaces,
    and break just before | or > so those parts jump out as you scan down the code.


    +   - The code to open a block goes on one line, like:


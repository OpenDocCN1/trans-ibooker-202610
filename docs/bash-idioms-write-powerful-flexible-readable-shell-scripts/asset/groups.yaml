    \  4) github.com          6) kitchen\nSSH to> 1\n\n$ examples/ch10/select-ssh.sh\n\
    1) Exit              3) gitlab.com          5) mythtv-be01\n2) git.atlas.oreilly.com\
    \  4) github.com          6) kitchen\nSSH to> 6\nssh kitchen\n```\n\n## 别名\n\n\
    既然你正在阅读本书，你可能已经知道 alias 和 unalias 命令，但我们想涵盖几个重要点。首先，最佳安全做法是在需要删除别名时使用 \\unalias。开头的\
    \ \\ 会抑制别名扩展，从而防止恶意的 unalias alias 造成混乱。\n\n其次，一些 Linux 发行版喜欢为 root 或所有用户设置“有帮助”的别名，因此你需要探索你发行版和环境中的默认值。特别是，你会看到\
    \ alias rm=rm -i 以及 cp 和 mv 的类似别名，你可能觉得这些别名可取也可能不可取。\n\n示例 10-9 和 10-10 显示了两组你可能考虑使用的别名，或许放在你的\
    \ ~/.bashrc 文件中。将其中一些或全部放入你主目录的 .bashrc 文件中。\n\n## 示例 10-9.  trivial DOS/Windows\
    \ “兼容”\n\n```\nalias cls='clear'          # DOS-ish for clear\nalias copy='cp'\
    \            # DOS-ish for cp\nalias del='rm'             # DOS-ish for rm\nalias\
    \ dir='ls'             # DOS-ish for ls\nalias ipconfig='ifconfig'  # Windows-ish\
    \ for ifconfig\nalias md='mkdir'           # DOS-ish for mkdir\nalias move='mv'\
    \            # DOS-ish for mv\nalias rd='rmdir'           # DOS-ish for rmdir\n\
    alias ren='mv'             # DOS-ish for mv/rename\nalias tracert='traceroute'\
    \ # DOS-ish for traceroute\n```\n\n## 示例 10-10. 示例别名\n\n```\n# Install `xclip`\
    \ or `xsel` for Linux copy and paste\nalias gc='xsel -b'        # \"GetClip\"\
    \ get stuff from right \"X\" clipboard\nalias pc='xsel -bi'       # \"PutClip\"\
    \ put stuff to right \"X\" clipboard\n# Or Mac: pbcopy/pbpaste\n# Or Windows:\
    \ gclip.exe/pclip.exe or getclip.exe/putclip.exe\n\n# Cleaner `df`\nalias df='df\
    \ --print-type --exclude-type=tmpfs --exclude-type=devtmpfs'\nalias diff='diff\
    \ -u'      # Make unified diffs the default\nalias locate='locate -i'  # Case-insensitive\
    \ locate\nalias ping='ping -c4'     # Only 4 pings by default\nalias vzip='unzip\
    \ -lVm'   # View contents of ZIP file\nalias lst='ls -lrt | tail -5' # Show this\
    \ dir's 5 most recently modified files\n\n# Tweaked from\n# https://oreil.ly/1SUg7\n\
    ```\n\n```\nalias randomwords=\"shuf -n102 /usr/share/dict/words | perl -ne 'print\
    \ qq(\\u$\\_);' \\\n| column\"\n```\n\n有时让同一命令在不同主机上工作方式不同会很有用。你可以用 case 语句轻松做到这一点（示例\
    \ 10-11）。\n\n## 示例 10-11. 不同主机的不同别名\n\n```\ncase \"$HOSTNAME\" in\n  host1* )\
    \  # Linux, but only has `xclip`\n    alias gc='xclip -out'      # Send X selection\
    \ to STDOUT\n    alias pc='xclip -in'       # Send STDIN to X selection\n  ;;\n\
    \n  host2* )  # Mac\n    alias gc='pbpaste'         # Send Paste Buffer to STDOUT\n\
    \    alias pc='pbcopy'          # Send STDIN to Paste Buffer\n  ;;\n\n  * )  \
    \     # Linux default\n    alias gc='xsel -b'        # Send X clipboard to STDOUT\n\
    \    alias pc='xsel -bi'       # Send STDIN to X clipboard\n  ;;\nesac\n```\n\n\
    ## 函数\n\n别名无法将参数传递到别名中间，但函数可以做到这一点，正如我们在第 6 章中介绍的那样。我们开始有点脱离习惯用法而更偏向配方，但我们无法抗拒示例\
    \ 10-12 中展示的方便的小函数。\n\n## 示例 10-12. 函数 mcd\n\n```\nfunction mcd {\n  \\mkdir -p\
    \ \"$1\"\n  \\cd \"$1\"\n}\n```\n\n当然，这非常 trivial，并且不做健全性或错误检查，也不允许设置权限（-m mode），但即使这个版本也是一个很好的节省时间工具，如果你经常创建目录。注意开头的\
    \ \\ 会抑制别名扩展，因此我们确保获得纯粹的 bash 内置。我们把扩展它作为读者的练习。\n\n"

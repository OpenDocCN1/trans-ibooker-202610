    \n如果你通过包系统安装，请记住版本可能相当旧。Linux 版本是一个包含单个编译二进制文件的 tarball，所以很容易将当前版本放到你的路径中的某个位置。\n\
    \n## 总结\n\n希望，这本书能让你更好地理解如何阅读和编写“bashy”代码，并且本章为你提供了开始定义适合你的风格（和指南）的地方。\n\nHappy\
    \ bashing!\n\n## The bash Idioms Style Guide\n\n这是第 11 章要点的副本，但没有评论和示例。示例目录中还有一个\
    \ Markdown 文件，因此你可以下载并按需调整，然后使用 pandoc 或其他工具进行渲染或包含。从书的 GitHub 页面获取代码。\n\n![](img/553ffa1bc15093729b691f706befc0ac_152_0.png)\n\
    \n## The bash Idioms Style Guide Is Not Portable\n\n此 bash Idioms 风格指南专门针对 bash，因此不能移植到\
    \ POSIX、Bourne、Dash 或其他 shell。如果你需要为这些 shell 编写代码，你将需要测试和调整本指南以考虑这些 shell 支持的语法和功能。\n\
    \n在 Docker 或其他容器中，/bin/sh 不是 bash 且 /bin/bash 可能甚至不存在时尤其要小心！这适用于物联网和其他受限环境，例如工业控制器。参见第\
    \ ix 页的“bash in Containers”和第 94 页的“ Shebang!”。\n\n## 可读性\n\n代码的可读性很重要！或者正如 Python\
    \ 所说，可读性很重要。你只写一次，但你（和其他人）可能会阅读很多次。花额外的几秒钟或几分钟思考明年试图阅读代码的可怜的糊涂的人……很可能就是你。抽象（不要重复自己）和可读性之间存在平衡和张力：\n\
    \n- KISS (Keep It Simple, Stupid!)。\n- 可读性：不要“聪明”，要清晰。\n- 好的名称至关重要！\n- *始终使用头部。*\n\
    - 如果可能的话，为 -h、--help 和错误参数发出有用的内容！\n  — 优先使用“here”文档（带前导制表符）而不是一堆 echo 行，因为以后需要更新和重新换行时摩擦更少。\n\
    - 使用 `source`（而不是 .，它很容易被忽略且更难搜索）来包含配置文件，这些文件应以 .cfg（或 .conf 或你标准的任何名称）结尾。\n-\
    \ 如果可能的话，对所有内容都使用 ISO-8601 日期。\n- 如果可能的话，保持事物列表按字母顺序排列；这可以防止重复并使添加或删除项目更容易。示例包括\
    \ IP 地址（使用 GNU `sort -V`），主机名，要安装的软件包，`case` 语句，以及变量或数组/列表的内容。\n- 如果可能，使用命令的长参数以提高可读性，例如，使用\
    \ `diff --quiet` 而不是 `diff -q`，不过要注意对非 GNU/Linux 系统的可移植性。\n  — 如果任何选项很短或晦涩，请添加注释。\n\
    \  — 强烈考虑记录你选择或需要选项的原因，甚至记录你考虑过但出于某种原因未使用的选项。\n  — 务必记录任何可能看起来像个好主意但实际上可能导致问题的选项，尤其是如果你在其他地方经常使用它们。\n\
    \n## 注释\n\n- *始终使用头部。*\n- 为一年后团队中的新人写注释。\n- 对你的函数进行注释。\n- 不要对你做了什么进行注释。对你为什么做或不做某事进行注释。\n\
    \  — 例外：当 bash 本身晦涩时，注释你做了什么。\n- 考虑添加关于外部程序选项的注释，尤其是当它们很短或晦涩时。\n- 在注释的第一词使用首字母大写，但在注释超过一句话时省略结束标点。\n\
    \n"

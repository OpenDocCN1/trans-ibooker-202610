    \ Bethel University 所说，是为了上帝的荣耀和邻舍的益处。\n\n## From JP\n\n感谢 Carl 的所有工作；我们似乎又一次安排了互补的日程。感谢\
    \ Mike 再次推动事情启动，以及 Nicole 保持其运转并对我们的工作、生活和时间管理问题保持耐心。\n\n本书献给我妻子 Karen，她是负责所有事情的执行副总裁，没有她我的生活就无法运转。感谢你的难以置信的支持、耐心和理解。最后，感谢\
    \ Kate 和 Sam，感谢你们把“除非你流血或着火，否则我有书要做”当作答案。\n\n## A Big “if” Idiom\n\n为了让你开始理解 bash\
    \ 习惯用法，我们将介绍一个 bash 构造，它允许你用更简洁的语法做你可能通常用 if/then/else 构造做的事情。我们将在本章中向你展示的习惯用法有一些真正的优势——主要是简洁性——也有一些需要避免的陷阱。但如果你不了解\
    \ bash 习惯用法，你可能无法识别或意识到正在发生的事情。\n\n看看这段代码：\n\n```\n[[ -n \"$DIR\" ]] && cd \"\
    $DIR\"\n```\n\n你觉得这看起来像一个 if 语句吗？如果你熟悉 bash，你会认识到它在功能上是相同的；你会把它理解为一个 if 语句，即使代码中没有出现\
    \ if 关键字。\n\n发生了什么？\n\n## The Big “if”\n\n为了解释这个习惯用法，让我们先看一个类似但更简单的例子：\n\n```\n\
    cd tmp && rm scratchfile\n```\n\n这也是，实际上，是一个 if 语句。如果 cd 命令成功，则（并且仅在成功时）执行 rm\
    \ 命令。这里的“习惯用法”是使用双与号（&&），通常读作“和”，来分隔两个命令。\n\n逻辑或哲学课程教授规则：“A AND B” 的表达式当且仅当 A\
    \ 和 B 都为真时为真。因此如果 A 为假，就没有必要考虑 B 的值。例如，考虑“我有一只狗 AND 我有一只猫”。如果我没有狗，那么对我来说这个复合表达式为假，无论我的猫情况如何。\n\
    \n让我们将其应用于 bash。记住 bash 的基本功能是执行程序。语句的第一部分执行 cd 命令。类似于 AND 的逻辑，如果第一个命令失败，bash\
    \ 将不会费心执行第二部分，即 rm 命令。\n\n使用 && 的目的是提醒你 AND 行为。Bash 并不是真正对这两个结果执行“AND”操作。（如果这是\
    \ C/C++，那就是另一回事了，尽管条件执行是相同的。）然而，这个 bash 习惯用法确实提供了第二个命令的条件执行——如果第一个命令失败，它就不会运行。\n\
    \n让我们回到并查看我们给出的原始示例，即这个表达式：\n\n```\n[[ -n \"$DIR\" ]] && cd \"$DIR\"\n```\n\n\

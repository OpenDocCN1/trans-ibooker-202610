    \ file\n> $HOSTS_FILE\nfor n in node{0..9}; do echo \"$n\" >> $HOSTS_FILE; done\n\
    \n### ADJUSTABLE VARIABLES\n#BATCH_SIZE=0  # Do the entire file at once (default);\
    \ watch out for memory\nBATCH_SIZE=4\nSLEEP_SECS_PER_NODE=1     # Can set to 0\n\

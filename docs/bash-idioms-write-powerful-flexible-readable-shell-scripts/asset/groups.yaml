    \ feedback to STDERR (so STDOUT can go into `tee` or a file)\nnode_count=\"$(cat\
    \ $HOSTS_FILE | wc -l)\"\nbatch_count=\"$(( node_count / BATCH_SIZE ))\"\necho\
    \ '' 1>&2\necho \"Nodes to process:          $node_count\" 1>&2\necho \"Batch\

    Write Powerful, Flexible, Readable Shell Scripts


    ![](img/553ffa1bc15093729b691f706befc0ac_0_0.png)


    Carl Albing & JP Vossen'
  - '[PAGE 1]


    # bash Idioms


    Shell scripts are everywhere, especially those written in bash-compatible syntax.
    But these scripts can be complex and obscure. Complexity is the enemy of security,
    but it’s also the enemy of readability and understanding. With this practical
    book, you’ll learn how to decipher old bash code and write new code that’s as
    clear and readable as possible.


    Authors Carl Albing and JP Vossen show you how to use the power and flexibility
    of the shell to your advantage. You may know enough bash to get by, but this book
    will take your skills from manageable to magnificent. Whether you use Linux, Unix,
    Windows, or a Mac, you’ll learn how to read and write scripts like an expert.
    Your future you will thank you.


    You’ll explore the clear idioms to use and obscure ones to avoid, so that you
    can:


    +   - Write useful, flexible, and readable bash code with style

    +   - Decode bash code such as `${MAKEMELC,,}` and `${PATHNAME##*/}`

    +   - Save time and ensure consistency when automating tasks

    +   - Discover how bash idioms can make your code clean and concise


    Carl Albing, PhD, is a professor, researcher, and software engineer with a breadth
    of industry experience. Coauthor of bash Cookbook and Cybersecurity Ops with bash,
    and author of the Great bash video (all O’Reilly), Carl is currently on the faculty
    at Bethel University in St. Paul, MN.


    JP Vossen has been in the IT industry since the early ’90s, specializing in information
    security since the late ’90s. He’s also written for Infosecurity Magazine, SearchSecurity,
    and other publications. When he’s not in front of a computer, JP is usually taking
    something apart, putting something together, or both.


    > "bash Idioms not only furnishes the reader with many practical tips and techniques
    that will help make their scripts more robust and readable, but also gives them
    the background needed to understand why this venerable language is such a powerful
    tool in every experienced engineer’s toolbox."

    > —Ian Miell

    > Cloud Native Consultant, Container Solutions


    > "It delivers on the promise to ‘up your bash game.’"

    > —Douglas McIlroy

    > Adjunct Professor, Dept. of Computer Science, Dartmouth College

    > (and inventor of Unix pipes and shell pipelining)'

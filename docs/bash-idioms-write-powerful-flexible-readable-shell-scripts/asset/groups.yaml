    \ in Perl, it opens a bunch of unmanaged terminals in windows.\n- **mssh (MultiSSH)**\n\
    \  GTK+-based multi-SSH client in a single GUI window.\n- **mussh**\n  MUltihost\
    \ SSH Wrapper shell script.\n- **pconsole**\n  Intended for tiling window managers,\
    \ spawns a terminal per host.\n- **multixterm**\n  Written in Expect & Tk, drives\
    \ multiple xterms.\n- **PAC Manager**\n  A Perl SecureCRT-like GUI on Linux.\n\
    \n## while and until\n\nWe mentioned while in passing previously, and it works\
    \ as you’d expect—“execute block while criteria exit status is zero”:\n\n```\n\
    while <CRITERIA>; do <BLOCK>; done\n```\n\nIt’s often used in reading files; see\
    \ several examples in Chapter 9. For argument parsing, see “Parsing Options” on\
    \ page 75.\n\nUnlike other languages, in bash until is just ! while, or “execute\
    \ block while criteria exit status is not zero”:\n\n```\nuntil <CRITERIA>; do\
    \ <BLOCK>; done\n### Same:\n! while <CRITERIA>; do <BLOCK>; done\n```\n\nThis\
    \ is really handy for something like waiting for a node to be created or rebooted\
    \ (Example 2-2).\n\n### Example 2-2. Wait for reboot\n\n```\nuntil ssh user@10.10.10.10;\
    \ do sleep 3; done\n```\n\n## Style and Readability: Recap\n\nIn this chapter,\
    \ we first took a quick look at the C/C++ style numerical for loop. Then we went\
    \ further. Bash is very string oriented and has some other styles of for loops\
    \ worth knowing. Its minimalist loop for variable provides implicit (and arguably\
    \ obscure) iteration over the arguments to a script or a function. An explicit\
    \ list of values, string or otherwise, provided to the for loop also gives us\
    \ the perfect mechanism for iterating over all the elements of a list or over\
    \ all keys in a hash.\n\nWe now know that both ${namelist[@]} and ${namelist[*]}\
    \ show all the values of the list, but if they are enclosed in double quotes,\
    \ the result is different: separate strings versus one large string. The same\
    \ is true for the special shell variables $@ and $*. They both represent the list\
    \ of all the arguments to the script (i.e., $1, $2, etc.). When enclosed in double\
    \ quotes, though, they also result in either multiple strings or a single string.\
    \ Why bring that up now? Only to circle back to our simplest for loop:\n\n```\n\
    for param\n```\n\nand say that this is equivalent to:\n\n```\nfor param in \"\
    $@\"\n```\n\nWe argue that the second form is better because it shows more explicitly\
    \ which values are being iterated over. However, there is a counterargument that\
    \ the $@ variable name itself and the necessity of the quotes are both specialized\
    \ knowledge that is no more obvious to the naive reader than just the first, simple\
    \ form. If you really prefer the first form, simply add a comment:\n\n```\nfor\
    \ param    # Iterate over all the script arguments\n```\n\nWhen looping over a\
    \ sequence of integer values, the C-style for loop with double parentheses is\
    \ probably the most readable as well as the most efficient. (If efficiency is\
    \ a big concern, be sure to use declare -i i early in your script to make your\
    \ variable \"i\" an explicit integer, avoiding conversion to/from a string.)\n\
    \nKnowing that you have all these values readily available, what might you do\
    \ with them? What goes on inside the loop, making use of these values? Decisions\
    \ must be made about the values encountered, and decision-making brings us to\
    \ another important feature in bash: its supercharged and superflexible case statement,\
    \ the topic of the next chapter.\n\nfor commands are extremely useful but can\
    \ be tricky to develop. Start simple and use echo until you’re sure your command\
    \ is working as intended. And remember the “syntactic sugar” while and until commands\
    \ for readability where useful.\n\n## Make Your Case\n\nMany programming languages\
    \ provide a “switch” or “match” statement, an n-way branch, used as an alternative\
    \ to a string of if/then/else clauses. There is a similar construct in bash: the\
    \ case statement. It comes with powerful pattern matching and is very useful in\
    \ scripting.\n\nThe keywords case and in delineate the value you want to compare\
    \ against various patterns. Here’s a simple example:\n\n```\ncase \"$var\" in\n\
    \  yes ) echo \"glad you agreed\" ;;\n  no )\n    echo \"sorry; good bye\"\n \
    \   exit\n  ;;\n  * ) echo \"invalid answer. try again\" ;;\nesac\n```\n\n...which\
    \ you can probably figure out. It checks to see if the value in $var is “yes”\
    \ or “no” and executes the corresponding statement(s). It even has a default action.\
    \ The end of the case statement is marked by esac, which is case spelled backward.\
    \ This example is pretty readable, but it just scratches the surface. You’ll also\
    \ note that you used two different block styles, a “one-liner” for yes and a more\
    \ typical block (closed by ;;...more on that later) for no. Which you use depends\
    \ on what you are doing and how the code lines up for readability.\n\n![](img/553ffa1bc15093729b691f706befc0ac_35_0.png)\n\
    \n## ( in case\n\nThe syntax for the case statement includes an optional “(” to\
    \ match the “)” in the example. For example, we could have written (\"yes\") instead\
    \ of just \"yes\") and similarly for the other items. We’ve rarely seen this used,\
    \ though. After all, who wants to type an extra character?\n\nThe real power of\
    \ the case statement, and the most idiomatic appearance, comes from using the\
    \ shell’s pattern matching for the various possible value comparisons:\n\n```\n\
    case \"$var\" in\n  [Nn][Oo]* )\n    echo \"Fine. Leave then.\"\n    exit\n  ;;\n\

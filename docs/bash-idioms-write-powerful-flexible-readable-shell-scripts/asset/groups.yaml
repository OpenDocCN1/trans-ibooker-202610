    \n## 再加一个转折\n\n在与每个模式关联的每段代码的末尾，我们都以双分号结束。在本章开头的第一个示例中，我们写道：\n\n```\n\"yes\")\
    \ echo \"glad you agreed\" ;;\n```\n\n在 echo 命令之后，我们放置了 ;;，这表示不应再执行任何操作。执行将在 esac\

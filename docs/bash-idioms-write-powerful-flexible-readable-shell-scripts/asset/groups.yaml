    # Example 10-1. Example bash pre-execution prompt


    ```

    PS0=''Start: \D{%Y-%m-%d_%H:%M:%S_%Z}\n''

    ```


    ```

    ### Note the difference between the prompt time and the start time

    [user@hostname:T2:L1:C5289:J0:2021-08-27_17:46:04_EDT]

    /home/user/bash-idioms$ ls -1 ch*

    Start: 2021-08-27_18:47:37_EDT

    ch01.asciidoc

    ...

    ```


    # PS1


    This is the main bash prompt, inherited from the Bourne shell, and it’s where
    you spend almost all your interactive time with bash, so it’s well worth understanding
    and tweaking. The prompt shown in Example 10-2 drives some people crazy, but it’s
    useful because it gives you all the information you can possibly need, making
    it great to copy and paste into documentation or trouble tickets. There is one
    catch, though. The date/time are displayed when the prompt is displayed, and if
    that was hours or days ago, that can be confusing. You can hack around that problem
    by just being aware of it and hitting enter a time or two before you start a new
    command or session. Or, if you have bash v4.4+, you can use PS0, as in the previous
    example. Note that the C5275 command history number is great when you fat-finger
    a password into your bash history. Just history -d 5275 and you’re all set. (See
    help history, and bonus points for omitting the history command itself with a
    leading space, per Example 10-13.)


    # Example 10-2. Example bash primary prompt


    ```

    export PS1=''\n[\u@\h:T\l:$SHLVL:C\! :J\j :D{%Y-%m-%d_%H:%M:%S_%Z}]\n$PWD\$ ''

    ```


    ```

    [user@hostname:T2:L1:C5275:J0:2021-08-27_16:51:20_EDT]

    /home/user/bash-idioms$

    ```


    # PS2


    This is the prompt you see when you hit enter but have not completed the command,
    possibly because you have not closed a quote or here-document.


    # PS3


    The prompt used by the select builtin; see “select” on page 107.


    # PS4


    This is the debug prompt, or maybe prefix is a better word, for when set -x is
    active. Note that the first character is duplicated as necessary to show the shell
    nesting level, so you want that to be clear. + is a good choice; see also “bash
    Debugging” on page 120. Example 10-3 is arguably busy, but it’s informative.'
  - '[PAGE 119]


    # Example 10-3. Example bash debug prompt


    ```

    export PS4=''+xtrace $BASH_SOURCE:$LINENO:$FUNCNAME: ''

    ```


    # PROMPT_COMMAND


    Example 10-4 shows a command to run just before $PS1 is evaluated and displayed.
    It’s used for all kinds of things like updating the window title for GUI terminals;
    displaying dynamic details about your environment, like what Git branch you’re
    in; or even doing some very primitive and insecure logging.


    # Example 10-4. Example bash PROMPT_COMMAND for logging


    ```

    ### This should be one line; it is broken to fit the page

    export PROMPT_COMMAND=''logger -p local1.notice -t "bashlog[$S]" \

    "SSH=$SSH_CONNECTION; USER=$USER; PATH=$PWD; COMMAND=$(fc -ln -1)"''

    ```


    # bash Time Zone


    This isn’t really a bash idiom, but it’s a neat prompt hack. The bash prompt defaults
    to displaying the date and time in the system time zone, but you can export TZ=UTC
    or some other time zone to change that. That’s useful if you prefer to keep your
    GUI in your local time zone but would rather have bash display UTC for documentation
    purposes, or to have local bash time displays match server displays. Note that
    the prompt TZ will not change until after you run an external command; just hitting
    enter or running a bash builtin will not cause it to update.


    See also “Time for printf” on page 55 for more date and time handling.


    # Getting User Input


    Most of the time, bash scripts get user input via command line arguments, but
    sometimes you might need to ask for input as well. The two common ways to do that
    are the read and select builtins.


    See also:


    +   - help read

    +   - help select


    # read


    read reads a line from STDIN or a file descriptor and assigns the words to a list
    of variables, or into an array (list) variable, and it has a number of really
    useful options (shown in Example 10-5).'

    \ And come to think of it, even that single task script probably wants -h (or\
    \ even --help). Let’s take a look at how to parse those arguments and still have\
    \ a readable, maintainable script.\n\n### Your First Argument\n\nIf your script\
    \ just wants a single parameter, you can reference that in your script as $1.\
    \ You might have statements like echo $1 or cat $1 as part of your script. We\
    \ don’t recommend using $1 throughout your script as it doesn’t tell the reader\
    \ anything about this parameter. It’s better, for readability’s sake, if you assign\
    \ this parameter to a variable with an informative name. If the parameter is meant\
    \ to be a filename, then choose a variable name like in_file or pathname or similar\
    \ and assign it right away, early in the script. As we saw in “Default Values”\
    \ on page 38, we can even supply a default value:\n\n```\nfilename=${1:-favorite.txt}\
    \    # Or maybe use /dev/null as the default?\n```\n\nIf the user doesn’t supply\
    \ any parameter when invoking your script, $1 will be unset. In the preceding\
    \ example, the shell will assign favorite.txt as the value when parameter one\
    \ is unset.\n\nNeed a second or third parameter or more? As you might have guessed,\
    \ those would be $2, $3, and so on. They would be unset if no such parameter is\
    \ supplied when invoking the script.\n\nBut what if you don’t have good default\
    \ values? Or what if you don’t want to proceed when the user doesn’t supply the\
    \ correct number of arguments? Your script can check to make sure that the user\
    \ has supplied the correct number of arguments by checking the $# variable. It\
    \ holds the number of arguments supplied. If $# is 0, then the user invoked the\
    \ script with no arguments. If $# is 1 but you wanted two arguments, then don’t\
    \ proceed. Issue an error message and exit (see “Exit Codes” on page 96):\n\n\
    ```\nif (($# != 2)); then\n    echo \"usage: $0 file1 file2\"    # $0 is the script's\
    \ name, as invoked\n    exit\nfi\n```\n\nWe’re only looking here at how to know\
    \ that you’ve got the right number of arguments to your script. How you use all\
    \ these arguments within the script is quite varied. We looked at some of those\
    \ in Chapter 2.\n\nTraditionally, when you wanted a list of all the arguments,\
    \ you might have used $* to write something like echo $*, which works fine for\
    \ this simple output. But once spaces were allowed as part of a filename, a slightly\

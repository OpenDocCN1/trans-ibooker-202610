    \ one at index zero). That’s useful in a debugging prompt; see Example 10-3.\n\
    \nThe following function will echo out the two parameters passed in to the function:\n\
    \n```\nfunction See2it {\n  echo \"First arg: $1\"\n  echo \"Second arg: $2\"\n\

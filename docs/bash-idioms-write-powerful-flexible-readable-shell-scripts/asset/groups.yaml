  - '[PAGE 138]


    # Developing Your Style Guide


    The overarching theme of this book is writing idiomatic, yet readable, bash code
    in a consistent style, and we hope we’ve provided the tools you need to do that.
    Style is just another way to say “how we write things.” Find some style guidelines,
    write ’em down, and stick to ’em. We’ve covered a number of important style considerations
    in this book, and there are some other guidelines we’d like to mention as well,
    things to keep in mind when designing systems and writing code. You can use this
    chapter as a starting point for your own style guide or just adopt it as is if
    you like it. The Appendix is the same material without the talking points, to
    use as a “cheat sheet,” and you can get the Markdown or HTML code from this book’s
    GitHub page.


    Keep the following high-level principles in mind:


    +   - Above all: KISS—Keep It Simple, Stupid! Complexity is the enemy of security,¹
    but it’s also the enemy of readability and understanding. Sure, modern systems
    and circumstances are complex, so try hard not to make it any worse than it already
    is.

    +   - The corollary, as Brian Kernighan famously said, is that debugging is twice
    as hard as writing the code in the first place, so if your code is as clever as
    you can make it, you are—by definition—not smart enough to debug it.

    +   - Try not to reinvent the wheel. Whatever you are trying to do has probably
    been done before, and there’s likely a tool or library for it. If that tool is
    already installed, just use it. No matter how hard you try, you are never going
    to be able to match the effort and testing that went into rsync, so just use it.
    If you find random code on the internet…well, think about that one for a bit.


    1 Really: “Complexity is the worst enemy of security” (see https://oreil.ly/zMJLF).'
  - '[PAGE 139]


    +   - Plan ahead for special cases or overrides, since they will happen. Take
    a page out of Linux distribution packaging systems and provide an `/etc/things/global.cfg`
    for defaults that you can blindly overwrite, then allow for overrides in `/etc/things/config.d/`
    or similar. See “Drop-in Directories” on page 93.

    +   - If it’s not in revision control, it doesn’t exist! (And sooner or later,
    it will be lost and then *really* won’t exist.)

    +   - Document everything. (But you don’t have to write a book about it…oh wait…)
    Write your code, your comments, and your docs for the new person who will join
    the team a year from now, when you’ve forgotten *why* you did it *that* way. Document
    what *didn’t* work, and maybe why, and cross-reference things, especially things
    that you can predict can hurt you. (Yes, `rm -rf /$undefined_variable` turned
    out to be a *really bad idea*!)

    +   - Keep your code and documentation DRY: Don’t Repeat Yourself. As soon as
    you end up with more than one copy, it’s guaranteed they will get out of sync
    sooner or later—the only question is when. Use functions and libraries; don’t
    be WET (We Enjoy Typing).


    “The Zen of Python” mostly applies to bash as well, and it’s not a bad place to
    start. Try `python -c "import this"` or see the Python documentation.


    ![](img/553ffa1bc15093729b691f706befc0ac_139_0.png)


    # The bash Idioms Style Guide Is Not Portable


    This *bash Idioms* style guide is specifically for bash, so it is not portable
    to POSIX, Bourne, Dash, or other shells. If you need to write for those shells,
    you will need to test and tweak this guide to account for the supported syntax
    and feature of those shells.


    Be especially careful in Docker or other containers where `/bin/sh` is not bash
    and `/bin/bash` may not even exist! This applies to Internet of Things and other
    constrained environments such as industrial controllers. See “bash in Containers”
    on page ix and “Shebang!” on page 94.


    Getting down into more detail, what types of things should be captured in your
    style guide? We’ll cover some of them in the following sections.


    # Readability


    Readability of your code is important! Or as Python says, *readability counts*.
    You only write it once, but you (and others) will probably read it many times.
    Spend the extra few seconds or minutes thinking about the poor clueless person
    trying to read the code next year…it’s very likely to be you. There’s a balance
    and a tension between abstraction (Don’t Repeat Yourself) and readability:'
  - '[PAGE 140]


    +   - KISS (Keep It Simple, Stupid!).

    +   - *Readability:* don’t be “clever,” be clear.

    +   - Good names are critical!

    +   - *Always use a header.*

    +   - If at all possible, emit something useful for -h, --help, and incorrect
    arguments!

    +     - Prefer using a “here” document (with leading tabs) rather than a bunch
    of echo lines because there’s less friction when you need to update and probably
    rewrap it later.

    +   - Use source (instead of ., which is easy to miss seeing and harder to search
    for) to include config files, which should end in .cfg (or .conf or whatever your
    standard is).

    +   - If at all possible, use ISO-8601 dates for everything.

    +   - If at all possible, keep lists of things in alphabetical order; this prevents
    duplication and makes it easier to add or remove items. Examples include IP addresses
    (use GNU sort -V), hostnames, packages to install, case statements, and contents
    of variables or arrays/lists.

    +   - If possible, use long arguments to commands for readability, e.g., use diff
    --quiet instead of diff -q, though watch out for portability to non-GNU/Linux
    systems.

    +     - If any options are short or obscure, add comments.

    +     - Strongly consider documenting why you chose or needed the options you
    chose, and even options you considered but didn’t use for some reason.

    +     - Definitely document any options that might seem like a good idea but that
    actually can cause problems, especially if you commonly use them elsewhere.


    For variable naming, watch out for generic variable names like:


    ```

    `${GREP} ${pattern} ${file}`

    ```


    That’s very abstracted out, and maybe reusable, but it’s also pretty context free.
    We’ve replaced the older `` with newer and more readable (we think), and definitely
    more nestable $(), but more importantly, the variables are less noisy because
    we omitted unnecessary ${} and have meaningful names:


    ```

    $($GREP "$re_process_errors" $critical_process_daily_log_file)

    ```


    After a while, you’ll see that you and your team find certain (dare we say it)
    idiomatic ways to express concepts and operations you often face. That’s when
    it’s time to write a style guide, if you don’t already have one.'
  - '[PAGE 141]


    On the other hand, if you are submitting a patch or maintaining code, it’s best
    to follow the conventions of that code unless you’re going to restyle and possibly
    refactor the whole thing.


    # Comments


    A lot has been written about comments: what, when, where, and so on. Following
    are style guidelines related to comments:


    +   - *Always use a header.*

    +   - Write your comments for the new person on the team a year from now.

    +   - Comment your functions.

    +   - Do not comment on what you did. Comment on why you did, or did not do, something.

    +     — Exception: comment on what you did when bash itself is obscure.

    +   - Consider adding comments about external program options, especially if they
    are short or obscure.

    +   - Use an initial capital on the first word of the comment, but omit ending
    punctuation unless the comment is more than one sentence.


    Add *useful* comments that explain *why* you did something and your intent! For
    example:


    ```

    continue # To the next file in for loop

    ```


    In theory it should not be necessary to explain *what* something does if you write
    clear code. But sometimes bash itself is just convoluted or obscure, e.g., variable
    substitution (see “Path or Prefix Removal” on page 33), like:


    ```

    PROGRAM=${0##*/}  # Basename in bash

    ```


    Separators are often useful for delimited logical blocks of code. But don’t add
    a closing separator at the bottom to “box” it out; that just adds clutter and
    reduces your on-screen lines of code by 1. Whatever you do, do *not* build boxes
    with characters on the righthand side! It’s totally unnecessary, and you’ll waste
    a lot of time getting it to “look right” up front. What’s worse is that it’s a
    strong disincentive to fixing or updating comments later, because then you have
    to go fix the box again.



- raw:
  - "[PAGE 94]\n\n6 Then we also need to “shift” $OPTIND since we’ve now handled it.\n\
    \nThe rest of the script is as we’ve covered previously.\n\n# HELP!\n\nThere is\
    \ a glaring omission in the preceding examples; do you need help to spot it? (That’s\
    \ a hint.) Right, -h and/or --help are missing. We strongly encourage emitting\
    \ some kind of usage or help message on demand; it’s discoverable and consistent\
    \ with how most other tools work, and it’s easy once you know how.\n\nIf you have\
    \ a very simple script, Example 8-3 shows a quick-and-dirty solution.\n\n# Example\
    \ 8-3. Quick-and-dirty help\n\n```\nPROGRAM=$({0##*/})  # bash version of `basename`\n\
    if [ $# -lt 2 -o \"$1\" = '-h' -o \"$1\" = '--help' ]; then\n  # Tab indents below,\
    \ starting after the EoH (End-of-Help) line!\n  cat <<-EoH\n    This script does\
    \ nothing but show help; a real script should be more exciting.\n    usage: $0\
    \ <foo> <bar> (<baz>)\n\n    As you can see, there are two required arguments,\
    \ +foo+ and +bar+, and one\n    optional argument, +baz+.\n    e.g.\n    usage:\
    \ $PROGRAM foo bar\n    usage: $PROGRAM foo bar baz\n\n    You can put more detail\
    \ here if you need to.\n  EoH\n  # Tab indents above!\n  exit 1\nfi\n```\n\n1\
    \ We talked about this in “Shorthand for basename” on page 32.\n\n2 If the $#\
    \ (argument count) is -lt (less than) 2, or the first argument is -h, or the first\
    \ argument is --help, then use a here-document to display a help and usage message.\
    \ (We discuss these in “Here-Documents and Here-Strings” on page 98.)\n\n3 Start\
    \ a << (here-document) until we get to the EoH, which is end-of-help but could\
    \ be EOF or anything else you prefer. It contains a -, so strip leading tabs (but\
    \ not spaces) from the block, which allows you to indent in the code without indenting\
    \ in the output."
  - "[PAGE 95]\n\n4 The end-of-help marker is also indented with a tab to match the\
    \ rest of the contents.\n\n5 We can debate if exit code (“Exit Codes” on page\
    \ 96) exit 0 for success or exit 1 (really anything greater than zero) for failure\
    \ is correct there. If we asked for help, then we just got it, and it worked,\
    \ so exit 0. But if we failed to provide the correct arguments, then we failed,\
    \ so exit 1. Also, the script failed to actually do anything useful beyond showing\
    \ a message, so that’s arguably an exit 1 fail. Pick a standard and go with it,\
    \ but exit 1 is a better fail-safe.\n\nWe’ve also inlined the help/usage message\
    \ here, but it sometimes makes sense for that to be its own function so you can\
    \ call it from other places if needed, as we’ll see in Example 8-4.\n\n# Example\
    \ 8-4. getopts argument parsing: long with help\n\n```\n#!/usr/bin/env bash\n\
    # parselonghelp.sh: Use getopts to parse these arguments, including long & help\n\
    # Original Author & date: _bash Idioms_ 2022\n# bash Idioms filename: examples/ch08/parselonghelp.sh\n\
    #\n# Long arguments: --amode and --help\n#                 and --outfile filename\
    \ or --outfile=filename\n\nPROGRAM=${0##*/}  # bash version of `basename`\nVERSION=\"\
    $PROGRAM v1.2.3\"\n\nVERBOSE=':'   # Default is off (no-op)\nDEBUG=':'     # Default\
    \ is off (no-op)\n\nfunction Display_Help {\n    # Tab indents below, starting\
    \ after the EoN (End-of-Note) line!\n    cat <<-EoN\nThis script does nothing\
    \ but show help; a real script should be\nmore exciting.\n        usage: $PROGRAM\
    \ (options)\n\nOptions:\n    -a | --amode    = Enable \"amode\", default is off\n\
    \    -d | --debug    = Include debug output, default is off\n    -h | --help \
    \    = Show this help message and exit\n    -o | --outfile  = Send output to file\
    \ instead of STDOUT\n    -v | --verbose  = Include verbose output, default is\
    \ off\n    -V | --version  = Show the version and exit\n\nYou can put more detail\
    \ here if you need to.\nEoN\n    # Tab indents above!\n    # If we have this next\
    \ line, the script will always exit after calling\n```"
  - "[PAGE 96]\n\n```\n# Display_Help. You may or may not want that...you decide.\n\
    # exit 1 # If you use this, remove the other exits after the call!\n} # end of\
    \ function Display_Help\n\nwhile getopts ':-adho:vV' VAL ; do\ncase $VAL in\n\
    # If you keep options in lexical order, they are easier to find and\n# you reduce\
    \ the chances of a collision\na ) AMODE=1 ;;\nd ) DEBUG='echo' ;;\nh ) Display_Help\
    \ ; exit 1 ;;        # We violated our style here\no ) OFILE=\"$OPTARG\" ;;\n\

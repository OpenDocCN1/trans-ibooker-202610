    \ bash builtin printf, but one thing the GNU¹ version of date still does better\
    \ than printf %(datefmt)T is showing dates for other times, like date -d '2 months\
    \ ago' '+%B', which tells us the name of the month from two months ago, like:\n\
    \n```\n$ date -d '2 months ago' '+%B'\nAugust\n```\n\n![](img/553ffa1bc15093729b691f706befc0ac_72_1.png)\n\
    \n## Default bash on Mac Is Too Old\n\nNote that printf %(datefmt)T requires at\
    \ least bash 4.2, 4.3+ preferred, so this won’t work in the older, but otherwise\
    \ quite useful, default bash 3.2 on a Mac! See “bash on Mac” on page ix.\n\n1\
    \ GNU is a recursive acronym that stands for “GNU’s Not Unix.”\n\n## printf for\
    \ Reuse or Debugging\n\nBash help says “%q quote the argument in a way that can\
    \ be reused as shell input,” and we will use that in Chapter 7 to show “shell\
    \ quoted” strings, but here’s a simple example:\n\n```\n$ printf '%q' \"This example\
    \ is from $today\\n\"\nThis\\ example\\ is\\ from\\ 2021-08-13\\\\n\n```\n\nThis\
    \ can be useful for reusing output elsewhere, creating formatted output (see also\
    \ “Comma-Separated Lists” on page 38), and debugging where you need to be able\
    \ to see hidden or control characters or fields. See also “bash Debugging” on\
    \ page 120.\n\n## Style and Readability: Recap\n\nFunctions in bash are very much\
    \ like internal shell scripts. Their invocation is very much like running any\
    \ command, and their parameters are referenced like any shell script’s parameters\
    \ ($1, $2, etc.) You will need to put your functions at the front of the script\
    \ so that their definition is seen before any call to the function. As in any\
    \ language, functions should be kept short and be largely single-purpose. Using\
    \ a single I/O redirection on a function can help you avoid repetitive redirections.\
    \ Perhaps the biggest danger with functions is the variable references. Functions\
    \ can return values via variables or by writing to STDOUT and having the caller\
    \ pipe the function’s output into some next command. You may need to refer to\
    \ (global) variables to return values from a function, but there are some variables\
    \ you want to avoid altering. Using local can help with that, but beware of dynamic\
    \ typing—those local variables don’t stay local if you call another function.\
    \ Be sure to document this sort of thing in the function’s opening comments.\n\
    \nThe printf builtin behaves much like the familiar function from other languages.\
    \ In addition to the standard formats, bash’s printf has some useful idiomatic\
    \ extensions. We especially appreciate not having to create a subshell to run\
    \ the date command just to find out what time it is, especially if you are calling\
    \ it frequently for logging.\n"
  mdcn: "\n\n![](img/553ffa1bc15093729b691f706befc0ac_70_0.png)\n\n## 动态作用域\n\n如果你在一个函数中声明一个局部变量，然后该函数调用另一个函数，第二个函数会看到第一个函数的局部变量，而不会看到同名全局变量。如果你从脚本的主体部分调用第二个函数，它会看到并使用全局变量。欢迎来到动态作用域的危险之处，这也是保持脚本简洁且文档完善的另一个原因。\n\
    \n## 函数特殊情况\n\n请记住，函数定义必须在其被调用之前出现。\n\n如果你在函数定义中使用括号（与我们推荐的风格不同），那么你可以用任何复合语句语法选项来包含函数体。你可以使用双括号进行算术求值，或使用双方括号如果你的函数只是想做条件表达式求值。但这些用法极不可能出现。\n\
    \n你可以在函数定义上放置一个 I/O 重定向。它在调用该函数时生效。以下是该功能的一个常见用法，可轻松将整个使用信息重定向到 STDERR（通过 1>&2）：\n\
    \n```\nfunction Usage_Message {\n    echo \"usage: $0 value pathname\"\n    echo\
    \ \"where value must be positive\"\n    echo \"and pathname must be an existing\
    \ file\"\n    echo \"for example: $0 25 /tmp/scratch.csv\"\n} 1>&2\n```\n\n当脚本检查发现未提供正确数量的参数或提供的文件名不存在时，可能会调用此函数（我们将在第\
    \ 79 页的“HELP!”中更详细地讨论这个问题）。需要注意的重要一点是，输出被重定向到 STDERR，但重定向不必放在脚本的每一行上——只需一次，放在包围的大括号之外即可。这可以为你节省大量输入，并且在修改脚本时无需记住为任何行添加额外的重定向。\n\
    \n请注意，为了清晰起见并逐步引入，我们分解了一些关于函数的风格建议；有关详细信息，请参阅第 128 页的“Functions”。\n\n## 是时候使用\
    \ printf 了\n\n如果你从 C 和 Java 等语言中了解 printf，那么你就有了先发优势。我们认为在这一章关于函数的章节中介绍它是有意义的，因为虽然它在\
    \ bash 中不是函数而是内置命令，但感觉足够熟悉，可以像对待函数一样对待它。\n\n*Print formatted*，或 `printf`，在 bash\
    \ 中被低估了，因为大多数人只是使用 echo，但 bash 内置版本有一些惯用的扩展，你需要能够阅读和编写。它也在 POSIX 中定义，与 bash 内置版本的\
    \ echo 不同，因此如果你的脚本在非 Linux 系统上运行，它的可移植性更强。\n\n我们只会讨论 bash 内置版本，但你可能有一个与 bash 无关的外部二进制文件，并且选项不会相同：\n\
    \n```\n$ type -a printf\nprintf is a shell builtin\nprintf is /usr/bin/printf\n\
    ```\n\n除非你使用完整路径（/usr/bin/printf）或在前面加上 env，否则会使用 bash `printf`。比较 `printf --help`\
    \ 和 `env printf --help` 以查看差异。\n\n我们也不会列出标准 `printf` 格式的长列表；这些在许多其他地方都有介绍，包括 *bash\

    \n```\nfor word in $(cat file); do\n  echo \"word: $word\"\ndone\n```\n\n```\n\
    ### Or, remove the \"useless use of cat\"\nfor word in $(< file); do\n  echo \"\
    word: $word\"\ndone\n```\n\n# Fiddling with $IFS for Fun and Profit, to Read Files\n\
    \n$IFS is the “internal field separator,” used in all word splitting. The default\
    \ is <space><tab><newline>, or IFS='$' \\t\\n' using the $' ' ANSI C quoting mechanism,\
    \ and this is fundamental to bash idioms. If you change $IFS without really understanding\

    \n![](img/553ffa1bc15093729b691f706befc0ac_17_0.png)\n\n## bash Help\n\nbash help\
    \ 命令对于任何内置命令都很好，但 help test 提供了关于 test 表达式的特别有帮助的线索，比如 -n。你也可以查看 man bash，但如果你这样做，你需要搜索“conditional\
    \ expressions”。bash 手册页非常长；help thing 有更短、更集中的主题。如果你不确定所讨论的命令是否是 bash 内置命令，只需用\
    \ help 命令尝试一下，或使用 type -a thing 来查找。\n\n承认一下，知道 help test 会告诉你 -n 的含义是棘手的，但然后，你足够聪明买了这本书，所以现在你知道了。这里还有一个微妙的小技巧；去试试这个：help\
    \ [。\n你受宠若惊。\n\n## Or ELSE...\n\n使用 || 字符分隔 bash 列表中的两个项目也有一个类似的习惯用法。读作“或”，第二部分仅在第一部分失败时执行。这是为了提醒你“OR”的逻辑规则，即：A\
    \ OR B。整个表达式为真，如果 A 为真或 B 为真。换句话说，如果 A 为真，B 为真或假并不重要。例如，考虑短语“我有一只狗 OR 我有一只猫”。如果我确实有一只狗，那么对我来说这个表达式为真，无论我的猫情况如何。\n\
    \n将其应用于 bash：\n\n```\n[[ -z \"$DIR\" ]] || cd \"$DIR\"\n```\n\n你觉得你能解释这个吗？如果变量长度为零，则第一部分为“真”，因此没有必要执行后半部分；不会运行\
    \ cd 命令。但如果 $DIR 的长度非零，测试将返回“假”，只有在这种情况下我们才会运行 cd 命令。\n\n你可以把这行 bash 读作“要么 $DIR\
    \ 为零长度，要么我们尝试 cd 到该目录。”\n\n将其写成显式的 if 语句有点奇怪，因为没有 then 操作要执行。|| 后的代码就像 else 子句：\n\
    \n```\nif [[ -z \"$DIR\" ]]; then\n  :\nelse\n  cd \"$DIR\"\nfi\n```\n\n“：” 是\
    \ shell 中的空语句——在这种情况下什么也不做。\n\n总之：用 && 分隔的两个命令就像 if 及其 then 子句；用 || 分隔的两个命令就像\

  - "[PAGE 25]\n\n```\nfor ((;;)); do\n    printf 'forever'\ndone\n```\n\nBut that's\
    \ not the only kind of for loop in bash. Here's a common idiom in shell scripts:\n\
    \n```\nfor value; do\n    echo \"$value\"\n    # Do more stuff with $value...\n\
    done\n```\n\nThis looks like something is missing, doesn't it? Where does value\
    \ get its values? This won't do anything for you on the command line, but if you\
    \ use this in a shell script, then the for loop will iterate over the parameters\
    \ to the script. That is, it will use $1, then $2, then $3, and so on, as the\
    \ values for value.\n\nPut that for loop in a file called myloop.sh, then you\
    \ can run it like this and see the three arguments (\"-c\", \"17\", and \"core\"\
    ) printed out:\n\n```\n$ bash myloop.sh -c 17 core\n-c\n17\ncore\n$\n```\n\nThis\
    \ abbreviated for loop is also very often found in function definitions:\n\n```\n\
    function Listen {\n    for arg; do\n        echo \"arg to func: '$arg'\"\n   \
    \ done\n    echo \"Inside func: \\$0 is still: '$0'\"\n}\n```\n\nInside a function\
    \ definition, the parameters $1, $2, etc., are the parameters to the function\
    \ and not parameters to the enclosing shell script. Therefore, inside the function\
    \ definition, the for loop will iterate over the parameters passed to the function.\n\
    \nThis minimalist for loop iterates over an implied list of values—the parameters\
    \ passed either to the script or the function. When used in the main body of a\
    \ script, it iterates over the parameters that were passed to the script; when\
    \ used inside a shell function, it iterates over the parameters that were passed\
    \ to that function.\n\nThis is definitely one of the obscure bash idioms. You\
    \ need to know how to read it, but we'll circle back to debate how to write it\
    \ in a later section (spoiler alert: like Python says, explicit is better than\
    \ implicit).\n\nWe might like a similarly simple loop but one with explicit values\
    \ of our own choosing not limited to the parameters—bash has just the thing."
  - "[PAGE 26]\n\n# Explicit Values\n\nIn bash, the for loop can be given a list of\
    \ values to loop over, like this:\n\n```\nfor num in 1 2 3 4 5; do\n    echo \"\
    $num\"\ndone\n```\n\nSince bash is dealing with strings, we aren’t restricted\
    \ to numbers:\n\n```\nfor person in Sue Neil Pat Harry; do\n    echo $person\n\
    done\n```\n\nOf course, the list of values can include variables as well as literals:\n\
    \n```\nfor person in $ME $3 Pat ${RA[2]} Sue; do\n    echo $person\ndone\n```\n\
    \nAnother source of values for the for loop can come from other commands, either\
    \ a single command or a pipeline of commands:\n\n```\nfor arg in $(some cmd or\
    \ other | sort -u)\n```\n\nExamples of this kind are:\n\n```\nfor arg in $(cat\
    \ /some/file)\nfor arg in $(</some/file)    # Faster than shelling out to cat\n\
    for pic in $(find . -name '*.jpg')\nfor val in $(find . -type d | LC_ALL=C sort)\n\
    ```\n\nA common use, especially in older scripts, is something like this:\n\n\
    ```\nfor i in $(seq 1 10)\n```\n\nbecause the seq command will generate a sequence\
    \ of numbers. This case could be considered equivalent to:\n\n```\nfor ((i = 1;\
    \ i <= 10; i++))\n```\n\nThis latter for is more efficient and probably more readable.\
    \ (Note that after the loop terminates, however, the value of i will differ between\
    \ those two forms [10 versus 11], though generally one doesn’t use the value outside\
    \ of the loop.)\n\nThere’s also this variation, but it has bash version portability\
    \ issues because the brace expansion was introduced in v3.0 and zero-padding of\
    \ expanded numeric values was introduced in v4.0:\n\n```\nfor i in {01..10}; do\
    \ echo \"$i\"; done\n```"
  - "[PAGE 27]\n\n![](img/553ffa1bc15093729b691f706befc0ac_27_0.png)\n\n# Leading\
    \ Zeros\n\nWhen either of the first two terms starts with a zero in a {start..end..inc}\
    \ brace expansion, it will force each output value to be the same width—using\
    \ zeros to pad them on the left side in bash v4.0 or newer. So {098..100} will\
    \ result in: 098 099 100, whereas {98..0100} will pad to four characters, resulting\
    \ in: 0098 0099 0100.\n\nThis brace expansion construct can be especially useful\
    \ when you want the numbers that are being generated to be part of a larger string.\
    \ You simply put the brace construct as part of the string. For example, if you\
    \ want to generate five filenames like log01.txt through log05.txt, you could\
    \ write:\n\n```\nfor filename in log{01..5}.txt ; do\n  # Do something with the\
    \ filenames here\n  echo $filename\ndone\n```\n\n![](img/553ffa1bc15093729b691f706befc0ac_27_1.png)\n\
    \n# Braces Versus printf -v\n\nYou could also do this with a numeric for loop\
    \ and then a printf -v to construct the filename from the numbers, but the brace\
    \ expansion seems a bit simpler. Use the numeric for loop and printf when you\
    \ need the numeric values for something else in addition to the filenames.\n\n\
    The seq command, though, can still be very useful for generating a sequence of\
    \ floating-point style numbers. You specify an increment between the starting\
    \ and ending values:\n\n```\nfor value in $(seq 2.1 0.3 3.2); do\n  echo $value\n\
    done\n```\n\nwould yield:\n\n+   2.1\n+   2.4\n+   2.7\n+   3.0\n\nJust remember\
    \ that bash doesn’t do floating point arithmetic. You may want to generate these\
    \ values to pass to some other program from within your script."
  - "[PAGE 28]\n\n# Similar to Python\n\nHere’s another common phrase seen in for\
    \ loops in bash:\n\n```\nfor person in ${name_list[@]}; do\n  echo $person\ndone\n\
    ```\n\nwhich might produce output like this:\n\n```\nArthur\nAnn\nHenry\nJohn\n\
    ```\n\nLooking at that example, you might be tempted to think that this bash for\
    \ loop is like Python, where it can iterate over values returned by an iterator\
    \ object. Well, bash is iterating over a series of values in this example, but\
    \ those values don’t come from an iterator object. Instead the names are all spelled\
    \ out before the looping begins.\n\nThe construct ${name_list[@]} is bash syntax\
    \ for listing all the values of a bash array, henceforth called a list. (See the\
    \ terminology discussion in the introduction to Chapter 7. In this example, the\
    \ list is called name_list.) A substitution is made by bash as it prepares the\
    \ command to be run. So the for loop doesn’t see the list syntax; the substitution\
    \ happens first. What the for loop gets looks just as if we typed the values explicitly:\n\
    \n```\nfor person in Arthur Ann Henry John\n```\n\nWhat about dictionaries? What\
    \ Python calls “dictionaries,” bash refers to as “associative arrays” and what\
    \ others call “key/value pairs” or “hashes” (again, see the introduction to Chapter\
    \ 7). The construct ${hash[@]} works fine for the values of the key/value pairs.\
    \ To loop over the keys (i.e., indices) of the hash, add an exclamation point.\
    \ The construct ${!hash[@]} can be used, as shown in this code snippet:\n\n```\n\
    # We want a hash (i.e., key/value pairs)\ndeclare -A hash\n# Read in our data\n\
    while read key value; do\n  hash[$key]=\"$value\"\ndone\n# Show us what we've\
    \ got, though they won't\n# likely be in the same order as read\nfor key in \"\
    ${!hash[@]}\"; do\n  echo \"key $key === value ${hash[$key]}\"\ndone\n```"
  - "[PAGE 29]\n\nHere’s an alternate example:\n\n```\n# We want a hash (i.e., key/value\
    \ pairs)\ndeclare -A hash\n# Read in our data: word and # of occurrences\nwhile\
    \ read word count; do\n  let hash[$word]+=\"$count\"\ndone\n# Show us what we’ve\
    \ got, though the order\n# is based on the hash, i.e., we don’t control it\nfor\
    \ key in \"${!hash[@]}\";do\n  echo \"word $key count = ${hash[$key]}\"\ndone\n\
    ```\n\nThis chapter is more about looping constructs like for, but if you want\
    \ more details and examples about lists and hashes, see Chapter 7.\n\n# Quotes\
    \ and Spaces\n\nThere is one more important aspect to consider about this for\
    \ loop. Did you catch our inconsistent use of quotes in the preceding example?\
    \ If the values in the list have spaces in them (for example, if each entry had\
    \ a first and last name), then our example for loop:\n\n```\nfor person in ${namelist[@]};\
    \ do\n  echo $person\ndone\n```\n\nmight produce output like this:\n\n```\nArt\n\
    Smith\nAnn\nArundel\nHank\nTill\nJohn\nJakes\n```\n\nThe for loop prints out eight\
    \ different values for the four names in our list. Why? How? The answer lies in\
    \ the substitution that bash makes for ${namelist[@]}. It just puts those names\
    \ in place of the variable expression. That leaves eight words in the list, like\
    \ this:\n\n```\nfor person in Art Smith Ann Arundel Hank Till John Jakes\n```\n\
    \nThe for loop is just given a list of words. It doesn’t know where they came\
    \ from.\n\nThere is bash syntax to solve this dilemma: put quotes around the list\
    \ expression and each value will be quoted.\n\n```\nfor person in \"${namelist[@]}\"\
    \n```"

    # Aliases


    Since you are reading this book, you probably already know about the alias and
    unalias command, but we want to cover a few important points. First, best security
    practice is to use \unalias when you need to remove an alias. The leading \ inhibits
    alias expansion, thus preventing a malicious unalias alias from causing havoc.


    Second, some Linux distributions like to set “helpful” aliases for root or all
    users, so you’ll want to explore the defaults in your distribution(s) and environment(s).
    In particular, you will see alias rm=rm -i and similar aliases for cp and mv,
    which you may or may not find desirable.


    Examples 10-9 and 10-10 show two sets of aliases that you might consider using,
    perhaps in your ~/.bashrc file. Put some or all of them in your .bashrc file in
    your home directory.


    # Example 10-9. Trivial DOS/Windows “compatibility”


    ```

    alias cls=''clear''          # DOS-ish for clear

    alias copy=''cp''            # DOS-ish for cp

    alias del=''rm''             # DOS-ish for rm

    alias dir=''ls''             # DOS-ish for ls

    alias ipconfig=''ifconfig''  # Windows-ish for ifconfig

    alias md=''mkdir''           # DOS-ish for mkdir

    alias move=''mv''            # DOS-ish for mv

    alias rd=''rmdir''           # DOS-ish for rmdir

    alias ren=''mv''             # DOS-ish for mv/rename

    alias tracert=''traceroute'' # DOS-ish for traceroute

    ```


    # Example 10-10. Example aliases


    ```

    # Install `xclip` or `xsel` for Linux copy and paste

    alias gc=''xsel -b''        # "GetClip" get stuff from right "X" clipboard

    alias pc=''xsel -bi''       # "PutClip" put stuff to right "X" clipboard

    # Or Mac: pbcopy/pbpaste

    # Or Windows: gclip.exe/pclip.exe or getclip.exe/putclip.exe


    # Cleaner `df`

    alias df=''df --print-type --exclude-type=tmpfs --exclude-type=devtmpfs''

    alias diff=''diff -u''      # Make unified diffs the default

    alias locate=''locate -i''  # Case-insensitive locate

    alias ping=''ping -c4''     # Only 4 pings by default

    alias vzip=''unzip -lVm''   # View contents of ZIP file

    alias lst=''ls -lrt | tail -5'' # Show this dir''s 5 most recently modified files


    # Tweaked from

    # https://oreil.ly/1SUg7

    ```'
  - "[PAGE 124]\n\n```\nalias randomwords=\"shuf -n102 /usr/share/dict/words | perl\
    \ -ne 'print qq(\\u$\\_);' \\\n| column\"\n```\n\nSometimes it’s useful to have\
    \ the same command work differently on different hosts. You can easily do that\
    \ with a case statement (Example 10-11).\n\n# Example 10-11. Different aliases\
    \ for different hosts\n\n```\ncase \"$HOSTNAME\" in\n  host1* )  # Linux, but\
    \ only has `xclip`\n    alias gc='xclip -out'      # Send X selection to STDOUT\n\
    \    alias pc='xclip -in'       # Send STDIN to X selection\n  ;;\n\n  host2*\
    \ )  # Mac\n    alias gc='pbpaste'         # Send Paste Buffer to STDOUT\n   \
    \ alias pc='pbcopy'          # Send STDIN to Paste Buffer\n  ;;\n\n  * )     \
    \  # Linux default\n    alias gc='xsel -b'        # Send X clipboard to STDOUT\n\
    \    alias pc='xsel -bi'       # Send STDIN to X clipboard\n  ;;\nesac\n```\n\n\
    # Functions\n\nOne thing you can’t do with aliases is pass arguments into the\
    \ middle of the alias, but you can do that with functions, as we covered in Chapter\
    \ 6. We’re starting to get out of idioms and more into recipes here, but we can’t\
    \ resist the handy little function shown in Example 10-12.\n\n# Example 10-12.\
    \ function mcd\n\n```\nfunction mcd {\n  \\mkdir -p \"$1\"\n  \\cd \"$1\"\n}\n\
    ```\n\nOf course, that’s very trivial, and doesn’t do sanity or error checking,\
    \ and doesn’t allow for setting permissions (-m mode), but even this version is\
    \ a great time-saver if you make a lot of directories. Note the leading \\ inhibits\
    \ alias expansion so we’re sure to get the plain bash builtin. We’ll leave expanding\
    \ it as an exercise for the reader."

    \ diff --quiet 而不是 diff -q，但要注意对非 GNU/Linux 系统的可移植性。\n  - 如果任何选项简短或晦涩，请添加注释。\n\
    \  - 强烈考虑记录你选择或需要选项的原因，甚至记录你考虑过但因某种原因未使用的选项。\n  - 一定要记录任何看起来像个好主意但实际上可能导致问题的选项，尤其是你在其他地方常用到的。\n\
    \n对于变量命名，要注意像这样的通用变量名：\n\n```\n`${GREP} ${pattern} ${file}`\n```\n\n这很抽象，也许可复用，但也很缺乏上下文。我们已将旧的\
    \ `` 替换为更新且更易读（我们认为）的 $()，而且肯定更易嵌套，但更重要的是，变量噪音更少，因为我们省略了不必要的 ${} 并使用了有意义的名称：\n\
    \n```\n$($GREP \"$re_process_errors\" $critical_process_daily_log_file)\n```\n\
    \n过了一段时间，你和你的团队会发现某些（我们敢说）惯用的方式来表达你经常面对的概念和操作。那时就是写风格指南的时候了，如果你还没有的话。\n\n另一方面，如果你正在提交补丁或维护代码，最好遵循该代码的约定，除非你要对整个代码进行重排和可能的重构。\n\
    \n## 注释\n\n关于注释的写法、时机、位置等已经写了很多。以下是与注释相关的风格指南：\n\n- *始终使用头部。*\n- 为一年后加入团队的新人写注释。\n\
    - 对你的函数进行注释。\n- 不要注释你做了什么。注释你为什么做或不做某事。\n  - 例外：当 bash 本身晦涩时，注释你做了什么。\n- 考虑添加关于外部程序选项的注释，尤其是当它们简短或晦涩时。\n\
    - 在注释的第一词开头使用大写字母，但除非注释超过一句话，否则省略结束标点。\n\n添加 *有用* 的注释来解释 *为什么* 你做某事以及你的意图！例如：\n\
    \n```\ncontinue # To the next file in for loop\n```\n\n理论上，如果你写出清晰的代码，就不需要解释 *某物*\
    \ 做什么。但有时 bash 本身就很繁琐或晦涩，例如变量替换（参见第 33 页的“Path or Prefix Removal”），像：\n\n```\n\
    PROGRAM=${0##*/}  # Basename in bash\n```\n\n分隔符对于分隔代码的逻辑块通常很有用。但不要在底部添加结束分隔符来“框”住它；这只会增加混乱并减少你屏幕上的代码行数\
    \ 1 行。不管怎样，*绝对不要* 在右侧用字符构建框！完全没有必要，你会浪费大量时间让它“看起来正确”。更糟的是，这会强烈阻碍以后修复或更新注释，因为你又得重新修复框。\n\
    \n不要这样做：\n\n"

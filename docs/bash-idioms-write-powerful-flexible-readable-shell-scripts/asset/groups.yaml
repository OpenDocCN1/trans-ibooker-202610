    # Style and Readability: Recap


    In this chapter, we first took a quick look at the C/C++ style numerical for loop.
    Then we went further. Bash is very string oriented and has some other styles of
    for loops worth knowing. Its minimalist loop for variable provides implicit (and
    arguably obscure) iteration over the arguments to a script or a function. An explicit
    list of values, string or otherwise, provided to the for loop also gives us the
    perfect mechanism for iterating over all the elements of a list or over all keys
    in a hash.


    We now know that both ${namelist[@]} and ${namelist[*]} show all the values of
    the list, but if they are enclosed in double quotes, the result is different:
    separate strings versus one large string. The same is true for the special shell
    variables $@ and $*. They both represent the list of all the arguments to the
    script (i.e., $1, $2, etc.). When enclosed in double quotes, though, they also
    result in either multiple strings or a single string. Why bring that up now? Only
    to circle back to our simplest for loop:


    ```

    for param

    ```


    and say that this is equivalent to:


    ```

    for param in "$@"

    ```


    We argue that the second form is better because it shows more explicitly which
    values are being iterated over. However, there is a counterargument that the $@
    variable name itself and the necessity of the quotes are both specialized knowledge
    that is no more obvious to the naive reader than just the first, simple form.
    If you really prefer the first form, simply add a comment:


    ```

    for param    # Iterate over all the script arguments

    ```'

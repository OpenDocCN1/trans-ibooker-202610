    \n## bash Idioms 风格指南不可移植\n\n本 *bash Idioms* 风格指南专门针对 bash，因此不能移植到 POSIX、Bourne、Dash\
    \ 或其他 shell。如果你需要为这些 shell 编写代码，你需要测试并调整本指南以适应这些 shell 支持的语法和功能。\n\n在 Docker 或其他容器中尤其要小心，其中\

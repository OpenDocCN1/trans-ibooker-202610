  - "[PAGE 55]\n\nHowever, that is subject to race conditions, and is obviously a\
    \ simple pattern. It is also partly predictable, but sometimes you want to have\
    \ a clue as to what code is cluttering up $TMP. Don’t forget to set a trap (see\
    \ “It’s a Trap!” on page 97) to clean up after yourself. We recommend you consider\
    \ using mktemp, though that’s a large issue outside the scope of bash idioms.\n\
    \n![](img/553ffa1bc15093729b691f706befc0ac_55_0.png)\n\n# $RANDOM and dash\n\n\
    $RANDOM is not available in dash, which is /bin/sh in some Linux distributions.\
    \ Notably, current versions of Debian and Ubuntu use dash because it is smaller\
    \ and faster than bash and thus helps to boot faster. But that means that /bin/sh,\
    \ which used to be a symlink to bash, is now a symlink to dash instead, and various\
    \ bash-specific features will not work. It does work in Zsh though.\n\n# Command\
    \ Substitution\n\nWe’ve already used command substitution quite a bit in Chapter\
    \ 2, but we haven’t talked about it. The old Bourne way to do it is `` (backticks/backquotes),\
    \ but we prefer the more readable POSIX $( ) instead. You will see a lot of both\
    \ forms, because it’s how you pull output into a variable; for example:\n\n```\n\
    unique_lines_in_file=\"$(sort -u \"$my_file\" | wc -l)\"\n```\n\nNote that these\
    \ are the same, but the second one is internal and faster:\n\n```\nfor arg in\
    \ $(cat /some/file)\nfor arg in $(</some/file)    # Faster than shelling out to\
    \ cat\n```\n\n![](img/553ffa1bc15093729b691f706befc0ac_55_1.png)\n\n# Command\
    \ Substitution\n\nCommand substitution is critical to cloud and other DevOps automation\
    \ because it allows you to gather and use all the IDs and details that only exist\
    \ at runtime; for example:\n\n```\ninstance_id=$(aws ec2 run-instances --image\
    \ $base_ami_id ... \\\n    --output text --query 'Instances[*].InstanceId')\n\
    ```\n\n```\nstate=$(aws ec2 describe-instances --instance-ids $instance_id \\\n\
    \    --output text --query 'Reservations[*].Instances[*].State.Name')\n```"
  - '[PAGE 56]


    ![](img/553ffa1bc15093729b691f706befc0ac_56_0.png)


    # Nesting Command Substitution


    Nesting command substitution using `` gets very ugly, very fast, because you must
    escape the inner backticks in each nesting layer. It''s much easier to use $(
    ) if you can, as shown:


    ```

    ### Just Works

    $ echo $(echo $(echo $(echo inside)))

    inside

    ```


    ```

    ### Broken

    $ echo `echo `echo `echo inside```

    echo inside

    ```


    ```

    ### "Works" but very ugly

    $ echo `echo \`echo \\\`echo inside\\\`\`

    inside

    ```


    Thanks to our reviewer Ian Miell for pointing this out and providing the example.


    # Style and Readability: Recap


    When referencing a variable in bash, you have the opportunity to edit the value
    as you set or retrieve it. A few special characters at the end of the variable
    reference can remove characters from the front or end of the string value, alter
    its characters to upper- or lowercase, substitute characters, or give you just
    a substring of the original value. Common use of these handy features results
    in idioms for default values, basename and dirname substitutes, and the creation
    of a comma-separated list without using an explicit if statement.


    Variable substitutions are a great feature in bash, and we recommend making good
    use of them. However, we also strongly recommend that you comment those statements
    to make it clear what sort of substitution you are attempting. The next reader
    of your code will thank you.'

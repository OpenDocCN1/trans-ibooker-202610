    \n- *Always use a header.*\n- Write your comments for the new person on the team\
    \ a year from now.\n- Comment your functions.\n- Do not comment on what you did.\
    \ Comment on why you did, or did not do, something.\n  — Exception: comment on\
    \ what you did when bash itself is obscure.\n- Consider adding comments about\
    \ external program options, especially if they are short or obscure.\n- Use an\

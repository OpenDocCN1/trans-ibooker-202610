  mdcn: "\n\n# O’REILLY®\n\n# bash Idioms\n\n编写强大、灵活、可读的 Shell 脚本\n\n![](img/553ffa1bc15093729b691f706befc0ac_0_0.png)\n\
    \nCarl Albing & JP Vossen\n\n# bash Idioms\n\nShell 脚本无处不在，尤其是使用 bash 兼容语法的脚本。但这些脚本可能复杂且晦涩。复杂性是安全的敌人，但它也是可读性和理解性的敌人。本实践书籍将教你如何解读旧的\
    \ bash 代码，并编写尽可能清晰易读的新代码。\n\n作者 Carl Albing 和 JP Vossen 展示了如何利用 shell 的强大功能和灵活性为己所用。你可能已经掌握足够的\
    \ bash 知识来应付日常工作，但本书将把你的技能从可管理提升到卓越。无论你使用 Linux、Unix、Windows 还是 Mac，你都将学会像专家一样阅读和编写脚本。未来的你会感谢现在的你。\n\
    \n你将探索应使用和应避免的清晰惯用法，以便：\n\n- 以优雅的风格编写实用、灵活且可读的 bash 代码\n- 解码 bash 代码，例如 `${MAKEMELC,,}`\
    \ 和 `${PATHNAME##*/}`\n- 在自动化任务时节省时间并确保一致性\n- 发现 bash 惯用法如何让你的代码更简洁干净\n\nCarl\
    \ Albing 博士是一位教授、研究员和软件工程师，拥有丰富的行业经验。bash Cookbook 和 Cybersecurity Ops with bash\
    \ 的合著者，以及 Great bash 视频的作者（均为 O’Reilly），Carl 目前在明尼苏达州圣保罗的 Bethel University 任教。\n\
    \nJP Vossen 自 90 年代初起就在 IT 行业工作，自 90 年代末起专注于信息安全。他还为 Infosecurity Magazine、SearchSecurity\
    \ 等出版物撰稿。当他不在电脑前时，JP 通常在拆解某物、组装某物，或两者兼顾。\n\n> “bash Idioms 不仅为读者提供了许多实用技巧和技术，帮助使他们的脚本更健壮、更易读，还提供了必要的背景知识，以理解为什么这种久经考验的语言是每位经验丰富的工程师工具箱中的强大工具。”\n\
    > —Ian Miell\n> 云原生顾问，Container Solutions\n\n> “它兑现了‘提升你的 bash 水平’的承诺。”\n> —Douglas\
    \ McIlroy\n> 达特茅斯学院计算机科学系兼职教授\n> （Unix 管道和 shell 管道线的发明者）\n\n# bash Idioms\n\n\

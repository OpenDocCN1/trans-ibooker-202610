    \ ;;& 和 ;& 来表示这些变体。\n\n以下是提供有关 $filename 中路径的详细信息的这种行为的示例：\n\n```\ncase $filename\
    \ in\n  ./*) echo -n \"local \"          # Begins with ./\n      ;&          \
    \                 # Fall through!\n  [^/]*) echo -n \"relative \"      # Starts\
    \ w/ anything but a slash\n      ;;&                          # Look for other\
    \ matches\n  /*) echo -n \"absolute \"         # Begins with a slash\n      ;&\
    \                           # Fall through\n  */*) echo \"pathname\"         \
    \   # A slash anywhere\n      ;;                           # Done\n  *) echo \"\
    filename\"              # All other\n      ;;                           # Done\n\
    esac\n```\n\n模式将按顺序与 $filename 中的值进行比较。第一个模式是两个字面字符——句点和斜杠——后跟任意字符。如果匹配（例如，如果\
    \ $filename 的值为 ./this/file），则脚本将打印“local”但末尾没有换行。下一行是 ;&，它告诉 bash “贯穿”并执行下一个模式相关联的命令（甚至不检查匹配）。因此它也会打印“relative”。与前一个模式不同，此代码段以\
    \ ;;& 结束，它告诉 bash 尝试匹配其他模式（按顺序向前）。\n\n所以现在它将检查下一个模式，寻找前导斜杠。如果不匹配，下一个可能匹配。它在字符串中寻找任何位置的斜杠（任意——零个或多个字符，然后是斜杠，然后是任意字符）。如果匹配（在我们的示例中会匹配），它将打印单词\
    \ pathname。;; 表示不需要再检查其他模式，操作完成。\n\n## 风格和可读性：回顾\n\n在本章中，我们描述了 case 语句，即执行流程中的\
    \ n 路分支。它的模式匹配功能使其在脚本中非常有用，尽管常见的用法是对特定单词进行简单的字面匹配。\n\n变体 ;;、;;& 和 ;& 提供了一些有用的功能，但可能很棘手。最好使用\
    \ if/then/else 而不是 case 语句来构建此类逻辑。\n\n这些符号如此细微地不同，以至于很容易忽略每一步发生的事情。匹配后控制流可能因每个\

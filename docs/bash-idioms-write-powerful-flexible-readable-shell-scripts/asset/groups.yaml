    \n## Table 7-2. Sample bash hash\n\n| Element | Value |\n|---|---|\n| myhash[oof]\
    \ | foo |\n| myhash[rab] | bar |\n| myhash[zab] | baz |\n\n关联数组或哈希或字典的常见操作是：\n\
    \n- 声明一个变量为关联数组（我们在这里说关联数组而不是“哈希”，因为标志是 -A）\n- 为其分配一个或多个值\n- 显示（转储）所有值用于调试或重用\n\
    - 引用一个或所有值（for，或 for each）\n- 引用特定值（查找）\n- 删除一个或多个值\n- 删除整个哈希\n\n再次，我们不打算讨论所有这些，我们只是在示例\
    \ 7-3 中向你展示，所以挑选出你需要的习惯用法。\n\n## Example 7-3. bash hash example: code\n\n```\n\
    #!/usr/bin/env bash\n# hashes.sh: bash Hash example code\n# Original Author &\
    \ date: _bash Idioms_ 2022\n# bash Idioms filename: examples/ch07/hashes.sh\n\
    # ----------------------------------------------------------------------------\n\
    # Does not work on Zsh 5.4.2!\n\n# Books are not as wide as some screens!\nFORMAT='fmt\
    \ --width 70 --split-only'\n\n# Declare a hash\ndeclare -A myhash  # MUST do this,\
    \ or `local -A` or `readonly -A`\n\n# Assign to it, note no \"+\"\n##myhash=(bar)\
    \        # Error: needs subscript when assigning associative array\nmyhash[a]='foo'\
    \      # Insertion 1, not 0...sort of\nmyhash[b]='bar'      # Insertion 2\nmyhash[c]='baz'\
    \      # Insertion 3\nmyhash[d]='three'    # 4 Different than our list example\n\
    myhash[e]='four'     # Insertion 5, note, not 4\nmyhash[f]='five by five'  # 6\
    \ Note spaces\nmyhash[g]='six'      # Insertion 7\n```\n\n```\n# OR\n#myhash=([a]=foo\
    \ [b]=bar [c]=baz [d]=\"three\" [e]=\"four\" [f]=\"five by five\" [g]=\"six\"\
    )\n\n# Display or dump the details and values\necho -e \"\\nThe key count is:\
    \ ${#myhash[@]} or ${#myhash[*]}\"\n\necho -e \"\\nThe length of the value of\
    \ key [e] is: ${#myhash[e]}\"\n\necho -e \"\\nDump or list:\"\ndeclare -p myhash\
    \ | $FORMAT\necho -n \"${myhash[@]}\" = ; printf \"%q\" ${myhash[@]}\necho -en\
    \ \"\\n${myhash[*]}\" = ; printf \"%q\" ${myhash[*]}\necho -en \"\\n\\[${myhash[@]}\\\
    ] =\" ; printf \"%q\" \"${myhash[@]}\"\necho -en \"\\n\\[${myhash[*]}\\] =\" ;\
    \ printf \"%q\" \"${myhash[*]}\"\necho -e \"\"  # Broken!  # Previous line is\
    \ bad and no newline\n# See 'help printf' or chapter 6 \"printf for reuse or debugging\"\
    , we need\n# this to show the correct words:\n# %q    quote the argument in a\
    \ way that can be reused as shell input\n\n# \"Join\" the values\nfunction Join\
    \ { local IFS=\"$1\"; shift; echo \"$*\"; } # One character delimiter!\n# Note\
    \ the Join above requires \"$*\" and not \"$@\"!\necho -en \"\\nJoin ',' ${myhash[@]}\
    \ = \" ; Join ',' \"${myhash[@]}\"\nfunction String_Join {\n    local delimiter=\"\
    $1\"\n    local first_element=\"$2\"\n    shift 2\n    printf '%s' \"$first_element\"\
    \ \"${@/#/$delimiter}\"\n    # Print first element, then reuse the '%s' format\
    \ to display the rest of\n    # the elements (from the function args $@), but\
    \ add a prefix of $delimiter\n    # by \"replacing\" the leading empty pattern\
    \ (/#) with $delimiter.\n}\necho -n \"String_Join '<>' ${myhash[@]} = \" ; String_Join\
    \ '<>' \"${myhash[@]}\"\n\n# Iterate over the keys and values\necho -e \"\\nforeach\
    \ \\\"${!myhash[@]}\\\":\"\nfor key in \"${!myhash[@]}\"; do\n    echo -e \"\\\
    tkey: $key; value: ${myhash[$key]}\"\ndone\n\necho -e \"\\nBut don't do this:\
    \ ${myhash[*]}\"\nfor key in ${myhash[*]}; do\n    echo -e \"\\tkey: $key; value:\
    \ ${myhash[$key]}\"\ndone\n\n# Handle slices (subsets) of the hash\necho -e \"\
    \\nStart from hash insertion element 5 and show a slice of 2 elements:\"\nprintf\
    \ \"%q\" \"${myhash[@]:5:2}\"\necho ''  # No newline in above\necho -e \"\\nStart\
    \ from hash insertion element 0 (huh?) and show a slice of 3 elements:\"\nprintf\
    \ \"%q\" \"${myhash[@]:0:3}\"\n```\n\n```\necho ' ' # No newline in above\necho\
    \ -e \"\\nStart from hash insertion element 1 and show a slice of 3 elements:\"\
    \nprintf \"%q\\n\" \"${myhash[@]:1:3}\"\necho ' ' # No newline in above\n```\n\
    \n```\n#echo -e \"\\nShift FIRST key [@]:\"   = makes no sense in a hash!\n#echo\
    \ -e \"\\nPop LAST key:\"          = makes no sense in a hash!\n```\n\n```\n#\
    \ Delete keys\necho -e \"\\nDelete key c using unset (dumped before and after):\"\
    \ndeclare -p myhash | $FORMAT\nunset -v 'myhash[c]'\ndeclare -p myhash | $FORMAT\n\
    ```\n\n```\n# Delete the entire hash\nunset -v myhash\n```\n\n- 1. 声明一个哈希（必需）。\n\
    - 2. 为哈希赋值。\n- 3. 显示或转储详细信息和值；参见示例 4-1。\n- 4. 两种不同的连接函数；另请参阅第 38 页的“逗号分隔列表”。\n\
    - 5. 遍历键和值；另请参阅第 38 页的“逗号分隔列表”。\n- 6. 处理哈希的切片（子集），这有点奇怪，因为下标不是有序的整数列表。\n- 7. 删除键。\n\
    - 8. 删除整个哈希。注意 unset，因为有一个微妙的陷阱。如果你恰好有一个与变量同名的文件，globbing 会伤害你，并且你可能会破坏意外的东西。为避免这种情况，最好引用你的变量。使用\
    \ -v 更安全，以强制 unset 将你的参数视为 shell 变量，如 unset -v 'list'。\n\n运行它看起来像示例 7-4。\n\n##\
    \ Example 7-4. bash hash example: output\n\nThe key count is: 7 or 7\n\nThe length\
    \ of the value of key [e] is: 4\n\nDump or list:\n\n```\ndeclare -A myhash=([a]=\"\
    foo\" [b]=\"bar\" [c]=\"baz\" [d]=\"three\"\n```\n"

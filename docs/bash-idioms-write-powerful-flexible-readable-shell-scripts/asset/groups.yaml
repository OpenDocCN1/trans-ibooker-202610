    # Variable Vernacular


    It is not uncommon to see an error message or an assignment statement that contains
    the idiom ${0##*/}, which looks to be some sort of reference to $0, but something
    more is going on. Let’s take a closer look at variable references and what some
    of these extra characters do for us. What we’ll find is a whole array of string
    manipulations that give you quite a bit of power in a few special characters.


    # Variable Reference


    Referencing a variable’s value is very straightforward in most programming languages.
    You either just use the name of the variable or add a character to the name to
    explicitly say that you want to retrieve the value. That’s true with bash: you
    assign to the variable by name, VAR=something, and you retrieve the value with
    a dollar-sign prefix: $VAR. If you’re wondering why we need the dollar sign, consider
    that bash deals largely with strings, so:


    ```

    MSG="Error: FILE not found"

    ```


    will give you a simple literal string of the four words shown, whereas:


    ```

    MSG="Error: $FILE not found"

    ```


    will replace the $FILE with the value of that variable (which, presumably, would
    hold the name of the file that it was looking for).


    ![](img/553ffa1bc15093729b691f706befc0ac_46_0.png)


    # Variable Interpolation


    Be sure to use double quotes if you want this string substitution to occur. Using
    single quotes takes all characters literally, and no substitutions happen.'

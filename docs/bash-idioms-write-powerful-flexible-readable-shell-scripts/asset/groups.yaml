  - "[PAGE 107]\n\nSee also:\n\n+   - “Local Variables” on page 110\n+   - “Reading\
    \ Files” on page 85\n+   - “ANSI-C Quoting” on the bash man page\n\n# Pretend\
    \ Files\n\nWe all know that UNIX, Linux, and (of course) bash expect everything\
    \ to be a file, right? Everything is a file. That is The Way. But what happens\
    \ if you need to process only part of the file? Perhaps you have a number of nodes\
    \ that report statistics every time period, and you want to diff them to see if\
    \ any nodes have appeared or dropped. Let’s assume the files are tab delimited\
    \ and have multiple records from each node with the node name as the first field,\
    \ but you aggregate them over an hour, or day, or whatever.\n\nYou could use temp\
    \ files, though that is pretty tedious:\n\n```\ncut -f1 /path/to/previous-report.log\
    \ | sort -u > /tmp/previous-report.log\ncut -f1 /path/to/current-report.log |\
    \ sort -u > /tmp/current-report.log\ndiff /tmp/previous-report.log /tmp/current-report.log\n\
    rm /tmp/previous-report.log /tmp/current-report.log\n```\n\nInstead you can use\
    \ these “pretend files” to do the same thing:\n\n```\ndiff <(cut -f1 /path/to/previous-report.log\
    \ | sort -u) \\\n    <(cut -f1 /path/to/current-report.log | sort -u)\n```\n\n\
    OK, it’s really called process substitution (illustrated in Example 9-8), but\
    \ we thought pretend files sounded like more fun.\n\nExample 9-8. Simple process\
    \ substitution example\n\n```\n$ head *report.log\n==> current-report.log <==\n\
    always-talking\nalways-talking\nalways-talking\nalways-talking\n\n==> previous-report.log\
    \ <==\nalways-talking\ngoing-away\nalways-talking\ngoing-away\nalways-talking\n\
    going-away\nalways-talking\ngoing-away\n```"
  - "[PAGE 108]\n\n```\n$ diff -u <(cut -f1 previous-report.log | sort -u) \\\n<(cut\
    \ -f1 current-report.log | sort -u)\n--- /dev/fd/63 2022-01-09 20:01:37.857658587\
    \ -0500\n+++ /dev/fd/62 2022-01-09 20:01:37.857658587 -0500\n@@ -1,2 +1 @@\nalways-talking\n\
    -going-away\n```\n\n# Drop-in Directories\n\nAn idiom that you see in a lot of\
    \ different contexts is a directory into which you can add or remove a file to\
    \ achieve some effect. This is very handy for Linux distributions that use package\
    \ management systems like RPM (Red Hat Package Manager) or Debian APT (Advanced\
    \ Package Tool) because a package can add a file on install or remove a file on\
    \ uninstall without having to programmatically edit files. /etc/cron.d/ is a perfect\
    \ example; packages can easily add cron jobs when installed and remove those jobs\
    \ when uninstalled and not affect anything else.\n\nWe’re big fans of this technique\
    \ for configuration files, if supported. For example, you can have an /etc/syslog-ng/syslog-ng.conf\
    \ file containing @include \"/etc/syslog-ng/syslog-ng.local.d\", then you can\
    \ drop files into /etc/syslog-ng/syslog-ng.local.d/ to adjust the configuration\
    \ as needed for a particular node.\n\nIt’s very easy to do that in your bash code\
    \ as well (Example 9-9).\n\nExample 9-9. Include drop-in files\n\n```\n# Source\
    \ local overrides IF any exist AND are executable\nfor config in /etc/myscript.cfg.d/*;\
    \ do\n  # Override files MUST be EXECUTABLE or they will be ignored, which makes\n\
    \  # it easy to disable them.\n  [ -x \"$config\" ] && source \"$config\"\n  #\
    \ Or change `-x` to `-r` to use readable instead of executable\ndone\n```\n\n\
    This idea builds on the “Wrapper Scripts” on page 23, so you can build simple,\
    \ extensible, and yet powerful tools for yourself or your users. You write a simple\
    \ skeleton script with some logic to look an “action” command up in a directory,\
    \ and some glue code to pull those commands together and provide usage or help.\
    \ You then add a “template” for new modules or actions, and you or your users\
    \ just copy the template and fill in the details to easily add a new feature."
  - "[PAGE 109]\n\n# Using a Library\n\nIf you have a lot of code you use frequently,\
    \ perhaps a Log function using printf %(datefmt)T (see “Getting or Using the Date\
    \ and Time” on page 57), it can make sense to put it in a library to reduce “WET”¹\
    \ code and maintenance. Of course, as soon as you do, you run into the usual library\
    \ issues: deployment and calling it. Deployment is up to you and your general\
    \ process and practices, but we can help with calling it.\n\nIronically, you will\
    \ have duplicate “boilerplate” code to call your library, and you can’t extract\
    \ that into a library or the import process becomes circular. But since you have\
    \ a template for header comments and such (right?), you can just add the code\
    \ shown in Example 9-10.\n\n# Example 9-10. Sourcing a bash library\n\n```\n#\
    \ Source our library\nsource /path/to/global/bash-library.lib || {\n    echo \"\
    FATAL: $0 can't source '/path/to/global/bash-library.lib'\"\n    exit 1\n}\n```\n\
    \nWe could have defined GLOBAL_LIBRARY=/path/to/global/bash-library.lib, but for\
    \ two uses in boilerplate code, it didn’t seem worth it. If you’re really clever,\
    \ you’ll build a global configuration of variables into that library, and you’ll\
    \ allow overrides for variables and maybe library functions using node-local drop-in\
    \ directories (see “Drop-in Directories” on page 93).\n\n# Shebang!\n\nWhat makes\
    \ a plain old file a shell script? Shebang!\n\nWe think “shebang” sounds like\
    \ a spell, and it is, in fact, a magical incantation to tell the kernel (not the\
    \ daemons) what to do with your code. We’re taking about that #!/bin/bash or possibly\
    \ #!/bin/sh first line of your script, of course. #! cleverly acts as both a comment\
    \ and a magic number to tell the kernel to look for an interpreter, in this case\
    \ bash.\n\nThe most common bash shebang on Linux is #!/bin/bash, but you will\
    \ often see #!/bin/sh and #!/bin/bash -, and you may see #!/usr/bin/env bash,\
    \ #!/usr/bin/bash, or other paths.\n\n1 WET: We Enjoy Typing, the opposite of\
    \ DRY: Don’t Repeat Yourself."

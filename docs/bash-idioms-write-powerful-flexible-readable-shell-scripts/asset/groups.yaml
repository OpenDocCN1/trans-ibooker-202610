    \ --help`\n- `man 1 printf`\n- 可能 `/usr/bin/printf --help` 或 `env printf --help`\n\
    \n## POSIX 输出\n\n如果你的脚本将在 Linux 以外的操作系统上运行，你应考虑使用 `printf` 而不是 echo 以保持一致性。它很简单，但比使用\
    \ echo 需要更多的输入，而且与 echo 不同，不会自动包含尾随换行符：\n\n```\nprintf '%s\\n'   # 简单字符串，换行符不会自动包含\n\
    printf '%b\\n'   # 还会展开转义字符\n```\n\n你可以在 `printf` 格式周围使用单引号或双引号，这些引号将遵循通常的变量插值规则（单引号不会插值；双引号会），但像\
    \ \\n 这样的转义在两种类型的引号内都有效。如我们在其他地方所讨论的，我们更喜欢单引号来显示程序员的意图并防止插值，除非你需要在格式中插值变量，这可能表明你做错了什么。\n\
    \n有关此主题的更多信息，请参阅：\n\n- https://unix.stackexchange.com/a/65819\n- https://www.in-ulm.de/~mascheck/various/echo+printf\n\
    \n## 获取或使用日期和时间\n\nBash 4.2 添加了 printf %(datefmt)T，但默认输出是 Unix 纪元（1970-01-01 00:00:00\

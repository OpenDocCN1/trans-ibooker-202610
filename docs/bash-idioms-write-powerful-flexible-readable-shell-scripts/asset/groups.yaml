  - "[PAGE 97]\n\n```\n$DEBUG 'Example DEBUG message...'\n\necho \"End of $PROGRAM\
    \ run.\"\n```\n\nWe’ve packed a lot into this example, but you’ve already seen\
    \ most of it. We’ve built on the long arguments example to add help, but we also\
    \ added a simple way to have debug and verbose flags and output. We now have a\
    \ function for Display_Help because we need to call it from at least two places:\
    \ short- and long-option handling. That should be pretty clear.\n\nWe also violated\
    \ our case..esac style guideline for “one-liners” since the exit command makes\
    \ it a multiline block. We could just as easily have expanded it (as we did in\
    \ the long options section), but we’ve gone from one line to four lines for…no\
    \ gain in clarity and a loss of three vertical lines on your screen that might\
    \ better display more important code:\n\n```\nh ) Display_Help ; exit 1 ;;\n#\
    \ Versus\nh )\n    Display_Help\n    exit 1\n;;\n```\n\n# Debug and Verbose\n\n\
    In Example 8-4, we set a colon as the default value for the variable VERBOSE.\
    \ That may seem an odd value, but consider the example use of that variable later\
    \ in the script:\n\n```\n$VERBOSE 'Example verbose message...'\n```\n\nIn the\
    \ default case (if the user does not specify verbose mode), then, to execute that\
    \ line, $VERBOSE is replaced by a :; the no-op (no operation) or null command\
    \ (which does nothing, ignores its arguments, and is always true). Thus no message\
    \ would be printed. But if the user invokes the script with a -v or --verbose,\
    \ then $VERBOSE is replaced with an echo, and the line to be executed would now,\
    \ in effect, be this:\n\n```\necho 'Example verbose message...'\n```\n\nand the\
    \ message will be printed for the user to see.\n\nThis idiom for conditional messages\
    \ is simple code that’s easy to write, easy to read, and even easy to grep for\
    \ when writing documentation. You can use the same thing for DEBUG as needed."
  - "[PAGE 98]\n\n# Version\n\nJust like -h and/or --help, a version command can be\
    \ useful. First, though, is -v version or verbose? We prefer -V for version and\
    \ -v for verbose (if applicable). Second, do you need a version? Not as much as\
    \ you need help, so it really depends. The gen2 version-control systems like CVS\
    \ and SVN made version easy—just use keyword expansion like VERSION=$Id$. But\
    \ the gen3 systems like Git don’t support that, so you’re back to a manually updated\
    \ variable, or some kind of build-time or CI (continuous integration) incrementer.\
    \ For larger or public scripts, it makes sense; for smaller personal scripts,\
    \ it might not. Your call.\n\nYou implement version by VERSION=something and display\
    \ it the same way as help. Choosing the exit code (“Exit Codes” on page 96) of\
    \ this is easier since you get the version output only if you asked for it, so\
    \ exit 0 clearly makes sense.\n\nWhat you set $VERSION to is up to you:\n\n+ \
    \  - VERSION=$Id$ for CVS or SVN\n+   - VERSION=v1.2.3\n+   - VERSION=\"$PROGRAM\
    \ v1.2.3\"\n+   - VERSION=\"$0 v1.2.3\" # Probably not, since $0 varies\n+   -\
    \ VERSION=12\n\n# Style and Readability: Recap\n\nIn this chapter, we discussed\
    \ CLI options, arguments, and usage. We showed a simple way to parse a single\
    \ argument and how not to proceed with insufficient arguments by checking $#.\
    \ We then described the bash builtin getopts as a good way to parse both short-\
    \ and long-format options.\n\nA script that has any significant amount of argument\
    \ parsing should make an effort to keep that code separate from the core function\
    \ of the script. That is often best accomplished by setting flag variables in\
    \ the case statement(s) that can be referenced later in the script where the functionality\
    \ is implemented. You can make a big improvement in readability for your script\
    \ by making the parsing of arguments a separate function in your script. Wrap\
    \ Example 8-4 in a function definition:\n\n```\n# Called like: parseargs \"${@}\"\
    \nfunction parseargs {\n  ...\n}\n```\n\nthen call it with parseargs \"${@}\"\
    , and the remainder of your script can follow, using the flags set in the parseargs\
    \ function."
  md: "\n6 Then we also need to “shift” $OPTIND since we’ve now handled it.\n\nThe\
    \ rest of the script is as we’ve covered previously.\n\n## HELP!\n\nThere is a\
    \ glaring omission in the preceding examples; do you need help to spot it? (That’s\
    \ a hint.) Right, -h and/or --help are missing. We strongly encourage emitting\
    \ some kind of usage or help message on demand; it’s discoverable and consistent\
    \ with how most other tools work, and it’s easy once you know how.\n\nIf you have\
    \ a very simple script, Example 8-3 shows a quick-and-dirty solution.\n\n### Example\
    \ 8-3. Quick-and-dirty help\n\n```\nPROGRAM=$({0##*/})  # bash version of `basename`\n\
    if [ $# -lt 2 -o \"$1\" = '-h' -o \"$1\" = '--help' ]; then\n  # Tab indents below,\
    \ starting after the EoH (End-of-Help) line!\n  cat <<-EoH\n    This script does\
    \ nothing but show help; a real script should be more exciting.\n    usage: $0\
    \ <foo> <bar> (<baz>)\n\n    As you can see, there are two required arguments,\
    \ +foo+ and +bar+, and one\n    optional argument, +baz+.\n    e.g.\n    usage:\
    \ $PROGRAM foo bar\n    usage: $PROGRAM foo bar baz\n\n    You can put more detail\
    \ here if you need to.\n  EoH\n  # Tab indents above!\n  exit 1\nfi\n```\n\n1\
    \ We talked about this in “Shorthand for basename” on page 32.\n\n2 If the $#\
    \ (argument count) is -lt (less than) 2, or the first argument is -h, or the first\
    \ argument is --help, then use a here-document to display a help and usage message.\
    \ (We discuss these in “Here-Documents and Here-Strings” on page 98.)\n\n3 Start\
    \ a << (here-document) until we get to the EoH, which is end-of-help but could\
    \ be EOF or anything else you prefer. It contains a -, so strip leading tabs (but\
    \ not spaces) from the block, which allows you to indent in the code without indenting\
    \ in the output.\n\n4 The end-of-help marker is also indented with a tab to match\
    \ the rest of the contents.\n\n5 We can debate if exit code (“Exit Codes” on page\
    \ 96) exit 0 for success or exit 1 (really anything greater than zero) for failure\
    \ is correct there. If we asked for help, then we just got it, and it worked,\
    \ so exit 0. But if we failed to provide the correct arguments, then we failed,\
    \ so exit 1. Also, the script failed to actually do anything useful beyond showing\
    \ a message, so that’s arguably an exit 1 fail. Pick a standard and go with it,\
    \ but exit 1 is a better fail-safe.\n\nWe’ve also inlined the help/usage message\
    \ here, but it sometimes makes sense for that to be its own function so you can\
    \ call it from other places if needed, as we’ll see in Example 8-4.\n\n### Example\
    \ 8-4. getopts argument parsing: long with help\n\n```\n#!/usr/bin/env bash\n\
    # parselonghelp.sh: Use getopts to parse these arguments, including long & help\n\
    # Original Author & date: _bash Idioms_ 2022\n# bash Idioms filename: examples/ch08/parselonghelp.sh\n\
    #\n# Long arguments: --amode and --help\n#                 and --outfile filename\
    \ or --outfile=filename\n\nPROGRAM=${0##*/}  # bash version of `basename`\nVERSION=\"\
    $PROGRAM v1.2.3\"\n\nVERBOSE=':'   # Default is off (no-op)\nDEBUG=':'     # Default\
    \ is off (no-op)\n\nfunction Display_Help {\n    # Tab indents below, starting\
    \ after the EoN (End-of-Note) line!\n    cat <<-EoN\nThis script does nothing\
    \ but show help; a real script should be\nmore exciting.\n        usage: $PROGRAM\
    \ (options)\n\nOptions:\n    -a | --amode    = Enable \"amode\", default is off\n\
    \    -d | --debug    = Include debug output, default is off\n    -h | --help \
    \    = Show this help message and exit\n    -o | --outfile  = Send output to file\
    \ instead of STDOUT\n    -v | --verbose  = Include verbose output, default is\
    \ off\n    -V | --version  = Show the version and exit\n\nYou can put more detail\
    \ here if you need to.\nEoN\n    # Tab indents above!\n    # If we have this next\
    \ line, the script will always exit after calling\n```\n\n```\n# Display_Help.\
    \ You may or may not want that...you decide.\n# exit 1 # If you use this, remove\
    \ the other exits after the call!\n} # end of function Display_Help\n\nwhile getopts\
    \ ':-adho:vV' VAL ; do\ncase $VAL in\n# If you keep options in lexical order,\
    \ they are easier to find and\n# you reduce the chances of a collision\na ) AMODE=1\
    \ ;;\nd ) DEBUG='echo' ;;\nh ) Display_Help ; exit 1 ;;        # We violated our\
    \ style here\no ) OFILE=\"$OPTARG\" ;;\nv ) VERBOSE='echo' ;;\nV ) echo \"$VERSION\"\
    \ && exit 0 ;;   # We violated our style here too\n#-------------------------------------------------------------\n\
    - ) # This section added to support long arguments\n    case $OPTARG in\n    \
    \    amode      ) AMODE=1 ;;\n        debug      ) DEBUG='echo' ;;\n        help\
    \       )\n            Display_Help\n            exit 1\n            ;;\n    \
    \    outfile=* ) OFILE=\"${OPTARG#*=}\" ;;\n        outfile    )\n           \
    \ OFILE=\"${!OPTIND}\"\n            let OPTIND++\n            ;;\n        verbose\
    \    ) VERBOSE='echo' ;;\n        version    )\n            echo \"$VERSION\"\n\
    \            exit 0\n            ;;\n        * )\n            echo \"unknown long\
    \ argument: $OPTARG\"\n            exit\n            ;;\n    esac\n    ;;\n#-------------------------------------------------------------\n\
    : ) echo 'error: no argument supplied' ;;\n* )\n    echo \"error: unknown option\
    \ $OPTARG\"\n    echo \"  valid options are: aov\"\n    ;;\nesac\ndone\nshift\
    \ $((OPTIND -1))\n\necho \"Code for $0 goes here.\"\n\n$VERBOSE 'Example verbose\
    \ message...'\n\n```\n\n```\n$DEBUG 'Example DEBUG message...'\n\necho \"End of\
    \ $PROGRAM run.\"\n```\n\nWe’ve packed a lot into this example, but you’ve already\
    \ seen most of it. We’ve built on the long arguments example to add help, but\
    \ we also added a simple way to have debug and verbose flags and output. We now\
    \ have a function for Display_Help because we need to call it from at least two\
    \ places: short- and long-option handling. That should be pretty clear.\n\nWe\
    \ also violated our case..esac style guideline for “one-liners” since the exit\
    \ command makes it a multiline block. We could just as easily have expanded it\
    \ (as we did in the long options section), but we’ve gone from one line to four\
    \ lines for…no gain in clarity and a loss of three vertical lines on your screen\
    \ that might better display more important code:\n\n```\nh ) Display_Help ; exit\
    \ 1 ;;\n# Versus\nh )\n    Display_Help\n    exit 1\n;;\n```\n\n## Debug and Verbose\n\
    \nIn Example 8-4, we set a colon as the default value for the variable VERBOSE.\
    \ That may seem an odd value, but consider the example use of that variable later\
    \ in the script:\n\n```\n$VERBOSE 'Example verbose message...'\n```\n\nIn the\
    \ default case (if the user does not specify verbose mode), then, to execute that\
    \ line, $VERBOSE is replaced by a :; the no-op (no operation) or null command\
    \ (which does nothing, ignores its arguments, and is always true). Thus no message\
    \ would be printed. But if the user invokes the script with a -v or --verbose,\
    \ then $VERBOSE is replaced with an echo, and the line to be executed would now,\
    \ in effect, be this:\n\n```\necho 'Example verbose message...'\n```\n\nand the\
    \ message will be printed for the user to see.\n\nThis idiom for conditional messages\
    \ is simple code that’s easy to write, easy to read, and even easy to grep for\
    \ when writing documentation. You can use the same thing for DEBUG as needed.\n\
    \n## Version\n\nJust like -h and/or --help, a version command can be useful. First,\
    \ though, is -v version or verbose? We prefer -V for version and -v for verbose\
    \ (if applicable). Second, do you need a version? Not as much as you need help,\
    \ so it really depends. The gen2 version-control systems like CVS and SVN made\
    \ version easy—just use keyword expansion like VERSION=$Id$. But the gen3 systems\
    \ like Git don’t support that, so you’re back to a manually updated variable,\
    \ or some kind of build-time or CI (continuous integration) incrementer. For larger\
    \ or public scripts, it makes sense; for smaller personal scripts, it might not.\
    \ Your call.\n\nYou implement version by VERSION=something and display it the\
    \ same way as help. Choosing the exit code (“Exit Codes” on page 96) of this is\
    \ easier since you get the version output only if you asked for it, so exit 0\
    \ clearly makes sense.\n\nWhat you set $VERSION to is up to you:\n\n- VERSION=$Id$\
    \ for CVS or SVN\n- VERSION=v1.2.3\n- VERSION=\"$PROGRAM v1.2.3\"\n- VERSION=\"\
    $0 v1.2.3\" # Probably not, since $0 varies\n- VERSION=12\n\n## Style and Readability:\
    \ Recap\n\nIn this chapter, we discussed CLI options, arguments, and usage. We\
    \ showed a simple way to parse a single argument and how not to proceed with insufficient\
    \ arguments by checking $#. We then described the bash builtin getopts as a good\
    \ way to parse both short- and long-format options.\n\nA script that has any significant\
    \ amount of argument parsing should make an effort to keep that code separate\
    \ from the core function of the script. That is often best accomplished by setting\
    \ flag variables in the case statement(s) that can be referenced later in the\
    \ script where the functionality is implemented. You can make a big improvement\
    \ in readability for your script by making the parsing of arguments a separate\
    \ function in your script. Wrap Example 8-4 in a function definition:\n\n```\n\
    # Called like: parseargs \"${@}\"\nfunction parseargs {\n  ...\n}\n```\n\nthen\
    \ call it with parseargs \"${@}\", and the remainder of your script can follow,\
    \ using the flags set in the parseargs function.\n"
  mdcn: "\n\n6 然后我们还需要“移动” $OPTIND，因为我们已经处理过它了。\n\n其余脚本与我们之前介绍的一样。\n\n## HELP!\n\n\
    前面的示例中有一个明显的遗漏；你需要帮忙找出它吗？（那是个提示。）对，-h 和/或 --help 缺失了。我们强烈建议按需输出某种使用说明或帮助信息；它易于发现，与大多数其他工具的工作方式一致，而且一旦你知道方法就很容易实现。\n\
    \n如果你有一个非常简单的脚本，示例 8-3 显示了一个快速而粗糙的解决方案。\n\n### Example 8-3. Quick-and-dirty help\n\
    \n```\nPROGRAM=$({0##*/})  # bash version of `basename`\nif [ $# -lt 2 -o \"$1\"\
    \ = '-h' -o \"$1\" = '--help' ]; then\n  # Tab indents below, starting after the\
    \ EoH (End-of-Help) line!\n  cat <<-EoH\n    This script does nothing but show\
    \ help; a real script should be more exciting.\n    usage: $0 <foo> <bar> (<baz>)\n\
    \n    As you can see, there are two required arguments, +foo+ and +bar+, and one\n\
    \    optional argument, +baz+.\n    e.g.\n    usage: $PROGRAM foo bar\n    usage:\
    \ $PROGRAM foo bar baz\n\n    You can put more detail here if you need to.\n \
    \ EoH\n  # Tab indents above!\n  exit 1\nfi\n```\n\n1 我们在第 32 页的“Shorthand for\
    \ basename”中谈到过这个。\n\n2 如果 $#（参数计数）是 -lt（小于）2，或者第一个参数是 -h，或者第一个参数是 --help，则使用一个\
    \ here-document 来显示帮助和使用信息。（我们在第 98 页的“Here-Documents and Here-Strings”中讨论了这些。）\n\
    \n3 启动一个 <<（here-document）直到我们到达 EoH，即 end-of-help，但也可以是 EOF 或你喜欢的任何其他名称。它包含一个\
    \ -，因此会剥离块中开头的制表符（但不剥离空格），这允许你在代码中缩进而不在输出中缩进。\n\n4 end-of-help 标记也用制表符缩进以匹配其余内容。\n\
    \n5 我们可以争论在那里 exit code（“Exit Codes” 第 96 页）exit 0 表示成功还是 exit 1（实际上大于零的任何值）表示失败是否正确。如果我们请求帮助，那么我们刚刚得到了它，并且它成功了，所以\
    \ exit 0。但如果我们没有提供正确的参数，那么我们就失败了，所以 exit 1。此外，脚本除了显示消息之外未能真正做任何有用的事情，所以这也可以算作\
    \ exit 1 失败。选择一个标准并坚持下去，但 exit 1 是一个更好的 fail-safe。\n\n我们还在这里内联了 help/usage 消息，但有时让它成为自己的函数是有意义的，这样如果需要你就可以从其他地方调用它，正如我们在示例\
    \ 8-4 中看到的那样。\n\n### Example 8-4. getopts argument parsing: long with help\n\n\
    ```\n#!/usr/bin/env bash\n# parselonghelp.sh: Use getopts to parse these arguments,\
    \ including long & help\n# Original Author & date: _bash Idioms_ 2022\n# bash\
    \ Idioms filename: examples/ch08/parselonghelp.sh\n#\n# Long arguments: --amode\
    \ and --help\n#                 and --outfile filename or --outfile=filename\n\
    \nPROGRAM=${0##*/}  # bash version of `basename`\nVERSION=\"$PROGRAM v1.2.3\"\n\
    \nVERBOSE=':'   # Default is off (no-op)\nDEBUG=':'     # Default is off (no-op)\n\
    \nfunction Display_Help {\n    # Tab indents below, starting after the EoN (End-of-Note)\
    \ line!\n    cat <<-EoN\nThis script does nothing but show help; a real script\
    \ should be\nmore exciting.\n        usage: $PROGRAM (options)\n\nOptions:\n \
    \   -a | --amode    = Enable \"amode\", default is off\n    -d | --debug    =\
    \ Include debug output, default is off\n    -h | --help     = Show this help message\
    \ and exit\n    -o | --outfile  = Send output to file instead of STDOUT\n    -v\
    \ | --verbose  = Include verbose output, default is off\n    -V | --version  =\
    \ Show the version and exit\n\nYou can put more detail here if you need to.\n\
    EoN\n    # Tab indents above!\n    # If we have this next line, the script will\
    \ always exit after calling\n```\n\n```\n# Display_Help. You may or may not want\
    \ that...you decide.\n# exit 1 # If you use this, remove the other exits after\
    \ the call!\n} # end of function Display_Help\n\nwhile getopts ':-adho:vV' VAL\
    \ ; do\ncase $VAL in\n# If you keep options in lexical order, they are easier\
    \ to find and\n# you reduce the chances of a collision\na ) AMODE=1 ;;\nd ) DEBUG='echo'\
    \ ;;\nh ) Display_Help ; exit 1 ;;        # We violated our style here\no ) OFILE=\"\
    $OPTARG\" ;;\nv ) VERBOSE='echo' ;;\nV ) echo \"$VERSION\" && exit 0 ;;   # We\
    \ violated our style here too\n#-------------------------------------------------------------\n\
    - ) # This section added to support long arguments\n    case $OPTARG in\n    \
    \    amode      ) AMODE=1 ;;\n        debug      ) DEBUG='echo' ;;\n        help\
    \       )\n            Display_Help\n            exit 1\n            ;;\n    \
    \    outfile=* ) OFILE=\"${OPTARG#*=}\" ;;\n        outfile    )\n           \
    \ OFILE=\"${!OPTIND}\"\n            let OPTIND++\n            ;;\n        verbose\
    \    ) VERBOSE='echo' ;;\n        version    )\n            echo \"$VERSION\"\n\
    \            exit 0\n            ;;\n        * )\n            echo \"unknown long\
    \ argument: $OPTARG\"\n            exit\n            ;;\n    esac\n    ;;\n#-------------------------------------------------------------\n\
    : ) echo 'error: no argument supplied' ;;\n* )\n    echo \"error: unknown option\
    \ $OPTARG\"\n    echo \"  valid options are: aov\"\n    ;;\nesac\ndone\nshift\
    \ $((OPTIND -1))\n\necho \"Code for $0 goes here.\"\n\n$VERBOSE 'Example verbose\
    \ message...'\n\n```\n\n```\n$DEBUG 'Example DEBUG message...'\n\necho \"End of\
    \ $PROGRAM run.\"\n```\n\n我们把很多内容都打包到这个示例中，但你已经见过其中的大部分。我们在 long arguments 示例的基础上添加了\
    \ help，但我们还添加了一种简单的方法来拥有 debug 和 verbose 标志和输出。我们现在为 Display_Help 创建了一个函数，因为我们需要从至少两个地方调用它：短选项和长选项处理。这应该很清楚。\n\
    \n我们还违反了我们关于“one-liners”的 case..esac 风格指南，因为 exit 命令使其成为多行块。我们完全可以像在长选项部分那样将其展开，但我们从一行变成了四行……对清晰度没有提升，反而损失了三行垂直空间，而这些空间可能更适合显示更重要的代码：\n\
    \n```\nh ) Display_Help ; exit 1 ;;\n# Versus\nh )\n    Display_Help\n    exit\
    \ 1\n;;\n```\n\n## Debug and Verbose\n\n在示例 8-4 中，我们将冒号设为变量 VERBOSE 的默认值。这可能看起来是个奇怪的值，但考虑一下脚本后面对该变量的示例用法：\n\
    \n```\n$VERBOSE 'Example verbose message...'\n```\n\n在默认情况下（如果用户未指定 verbose 模式），执行该行时，$VERBOSE\
    \ 会被替换为 :；即 no-op（无操作）或 null 命令（什么都不做，忽略其参数，并且始终为真）。因此不会打印任何消息。但如果用户使用 -v 或 --verbose\
    \ 调用脚本，则 $VERBOSE 会被替换为 echo，而要执行的行在效果上现在是这样的：\n\n```\necho 'Example verbose message...'\n\
    ```\n\n消息将被打印给用户查看。\n\n这种用于条件消息的习惯用法是简单易写、易读的代码，甚至在编写文档时也很容易 grep。你可以根据需要对 DEBUG\
    \ 使用相同的方法。\n\n## Version\n\n就像 -h 和/或 --help 一样，version 命令也很有用。首先，不过是 -v 表示 version\
    \ 还是 verbose？我们更喜欢 -V 表示 version，-v 表示 verbose（如果适用）。其次，你需要 version 吗？没有 help\
    \ 那么重要，所以这真的取决于情况。像 CVS 和 SVN 这样的 gen2 版本控制系统让 version 变得容易——只需使用类似 VERSION=$Id$\
    \ 的关键字扩展。但像 Git 这样的 gen3 系统不支持这一点，所以你又回到了手动更新变量，或某种构建时或 CI（持续集成）递增器。对于较大或公开的脚本，这是有意义的；对于较小的个人脚本，可能就不需要了。由你决定。\n\
    \n你通过 VERSION=something 实现 version 并以与 help 相同的方式显示它。选择这个的 exit code（“Exit Codes”\
    \ 第 96 页）更容易，因为你只有在请求时才会得到 version 输出，所以 exit 0 显然是有意义的。\n\n你将 $VERSION 设为什么取决于你：\n\
    \n- VERSION=$Id$ 用于 CVS 或 SVN\n- VERSION=v1.2.3\n- VERSION=\"$PROGRAM v1.2.3\"\
    \n- VERSION=\"$0 v1.2.3\" # 可能不合适，因为 $0 会变化\n- VERSION=12\n\n## Style and Readability:\
    \ Recap\n\n在本章中，我们讨论了 CLI 选项、参数和使用方法。我们展示了如何解析单个参数以及如何通过检查 $# 来在参数不足时不继续执行。然后我们描述了\
    \ bash 内置的 getopts 作为解析短格式和长格式选项的好方法。\n\n任何具有一定数量参数解析的脚本都应努力将该代码与脚本的核心功能分开。这通常最好通过在\
    \ case 语句中设置标志变量来实现，这些标志变量可以在脚本后面在功能实现的地方引用。通过将参数解析作为脚本中的一个单独函数，你可以极大地提高脚本的可读性。将示例\
    \ 8-4 包裹在一个函数定义中：\n\n```\n# Called like: parseargs \"${@}\"\nfunction parseargs\
    \ {\n  ...\n}\n```\n\n然后用 parseargs \"${@}\" 调用它，你的脚本其余部分就可以跟随，使用 parseargs 函数中设置的标志。\n\
    \n"

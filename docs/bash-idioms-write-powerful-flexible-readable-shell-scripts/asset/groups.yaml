  md: "\nWe recommend either #!/bin/bash - or #!/usr/bin/env bash. We strongly discourage\
    \ #!/bin/sh unless you are deliberately restricting your code to Bourne shell\
    \ compatibility, in other words not using “bashisms.” You used to be able to get\
    \ away with that on Linux, but many Linux distributions switched to using the\
    \ Debian Almquist shell or dash for /bin/sh because it was much smaller and faster\
    \ than bash for running scripts, like all the scripts used to boot the system.\
    \ But it’s a bad idea to use sh when you really mean bash because, as we just\
    \ noted, it’s fragile and obscures programmer intent.\n\n#!/usr/bin/env bash is\
    \ much more portable, because as long as bash is in the $PATH, it will go find\
    \ it. That’s great when bash is not in /bin/, which is the case on BSD, Solaris,\
    \ and other non-Linux systems. The only problem is that the overhead of spawning\
    \ env, then searching the $PATH, then replacing itself with bash is slower. With\
    \ the resources in modern computers, that almost never matters, but if you are\
    \ developing on a constrained system or running a lot of scripts or instances\
    \ in a short time, that overhead adds up (Example 9-11).\n\n### Example 9-11.\
    \ Shebang speed test\n\n```\n$ head examples/ch09/shebang*\n==> examples/ch09/shebang-bash.sh\
    \ <==\n#!/bin/bash -\n:\n\n==> examples/ch09/shebang-env.sh <==\n#!/usr/bin/env\
    \ bash\n:\n\n$ time for ((i=0; i<1000; i++)); do examples/ch09/shebang-bash.sh;\
    \ done\nreal    0m3.279s\nuser    0m1.273s\nsys     0m0.915s\n\n$ time for ((i=0;\
    \ i<1000; i++)); do examples/ch09/shebang-env.sh; done\nreal    0m4.291s\nuser\
    \    0m1.313s\nsys     0m1.425s\n```\n\nThe other detail to mention is the trailing\
    \ - we’ve shown. That’s there to prevent a very old interpreter spoofing attack;\
    \ see section 4.7 of the Unix FAQs for details. The Linux kernel (but not other\
    \ kernels!) treats everything after the first “word” (in this case /bin/bash)\
    \ as a single argument, so we “use up” that argument with the “end of arguments”\
    \ dash. Note that this is not needed in #!/usr/bin/env bash because the bash part\
    \ itself is the argument.\n\n## Unofficial bash Strict Mode\n\nPerl has a use\
    \ strict pragma to “restrict unsafe constructs” that causes a syntax check or\
    \ run time error if you do not declare and initialize variables before using them,\
    \ among other things. The unofficial bash strict mode article makes the argument\
    \ that the following does the same (in spirit) in bash:\n\n```\nset -euo pipefail\n\
    IFS=$'\\n\\t'\n```\n\nWe don’t quite agree on changing $IFS like that because\
    \ that will break a lot of bash idioms (see “Fiddling with $IFS for Fun and Profit,\
    \ to Read Files” on page 89). The author makes a good argument, but it might be\
    \ a large effort to migrate legacy code for that. The set commands are great,\
    \ though:\n\n- -e will exit the entire script at the first error.\n- -u will exit\
    \ the entire script if you use an unset variable.\n- -o pipefail will fail pipelines\
    \ if any command, not just the last one, exits with nonzero.\n\nAdding -u will\
    \ break a lot of existing scripts, but the fixes will be pretty easy, and you\
    \ may find some variable name typos you didn’t know you had, which is the whole\
    \ point. -eo pipefail will probably break less up front, and when that does “break”\
    \ a script, it was probably already broken, but the error was masked and these\
    \ options just unmasked the problem.\n\nThis is definitely worth considering and\
    \ perhaps adding to your templates and style guide.\n\nSee also:\n\n- http://redsymbol.net/articles/unofficial-bash-strict-mode\n\
    - help set\n- https://perldoc.perl.org/strict\n\n## Exit Codes\n\nUnless told\
    \ otherwise, your bash script will exit with the exit (or return) code of the\
    \ last command run. Sometimes that’s fine, and other times you may need to exit\
    \ earlier after failing a sanity check or for some other condition.\n\nIn bash,\
    \ zero means *success* and nonzero means failure. This is the opposite of many\
    \ other languages, but it’s this way because there is only one way to succeed\
    \ but many ways to fail, and you might need to represent which way you failed,\
    \ like:\n\n```\nif grep --quiet \"$HOSTNAME\" /etc/hosts; then ...\n```\n\nThe\
    \ bash exit code is only eight bits, so the maximum value is 255, but you want\
    \ your return code values to stay at or below 125 because 126 and above are taken,\
    \ as shown in Table 9-1.\n\n### Table 9-1. bash exit/return codes\n\n| Exit/return\
    \ code | Use/description |\n|---|---|\n| 0 | Success |\n| 1–125 | User-defined\
    \ failure |\n| 2 | bash builtins incorrect usage |\n| 126 | Command found but\
    \ not executable |\n| 127 | Command not found |\n| 128–255 | Command exited with\
    \ signal N-128 |\n\nSee also the GNU documentation about exit status.\n\nThe command\
    \ to exit the entire script with an “exit code” is, wait for it, exit n. The command\
    \ to return from a function is, again, wait for it, return n, where “n” is an\
    \ optional argument as defined previously. Remember that return returns an exit\
    \ code, not values. The “n” can be any shell expression like 5 or $val or something\
    \ more complex. Remember if “n” is not given, status is that of the last command\
    \ run.\n\nSee also our discussion about exit 0 or exit 1 for help and usage in\
    \ “HELP!” on page 79.\n\n## It’s a Trap!\n\nThe trap builtin (help trap) allows\
    \ you to execute code when the script receives a signal, which includes when it\
    \ exits. That is a great place to have “cleanup” code that will work even if someone\
    \ CTRL-Cs (but not if they kill -9) the script. You can also use it to run debugging\
    \ code, but for this simple case, just use set -x or run under bash -x. Run trap\
    \ -l to list all the signals your system supports or trap -p <signal> to show\
    \ the trap commands associated with that signal.\n\nThe typical use of trap is\
    \ to clean up after your script, as noted. The syntax is trap [-lp] [[arg] signal_spec\
    \ ...], and while that arg can be self-contained code, it’s probably cleaner to\
    \ just define and then call a function instead. That looks something like Example\
    \ 9-12 (output shown in Example 9-13).\n\n### Example 9-12. Trivial trap example:\
    \ code\n\n```\n#!/usr/bin/env bash\n# trivial_trap.sh: Trivial bash trap example\n\
    # Original Author & date: _bash Idioms_ 2022\n# bash Idioms filename: examples/ch09/trivial_trap.sh\n\
    # --------------------------------------------------------------------------------\n\
    # Does not work on Zsh 5.4.2!\n\nfunction Cleanup {\n    echo \"$FUNCNAME was\
    \ triggered!  Cleaning up...\"\n}\n\necho \"Starting script $0...\"\n\necho 'Setting\
    \ the trap...'\n# Will call Cleanup on any of these 6 signals\ntrap Cleanup ABRT\
    \ EXIT HUP INT QUIT TERM\n\necho 'About to exit...'\n```\n\n### Example 9-13.\
    \ Trivial trap example: output\n\n```\nStarting script examples/ch09/trivial_trap.sh...\n\
    Setting the trap...\nAbout to exit...\nCleanup was triggered!  Cleaning up...\n\
    ```\n\nSee also the GNU documentation about trap and “bash Debugging” on page\
    \ 120.\n\n## Here-Documents and Here-Strings\n\nOther languages have similar constructs,\
    \ like C’s /* ... */ , and Python’s ''' ... ''' , but bash has some interesting\
    \ idiomatic features for here-documents and here-strings. We used a here-document\
    \ in Example 8-3, but there is more to talk about and decode.\n\nHere-documents\
    \ are used to contain and often display blocks of text without needing a lot of\
    \ delimiters and commands.\n\nHere-document syntax is [fd]<<[-][\"'\"]word[\"\
    '\"] , where “fd” is an optional (and rarely used) file descriptor, - is a flag\
    \ that means “strip leading tabs but not spaces,” and optional quotes mean “do\
    \ not interpolate the contents.” The word itself is not subject to parameter,\
    \ variable, arithmetic, or filename expansion, or command substitution. Among\
    \ other things, that means it can’t be a variable. If any part of word is quoted,\
    \ interpolation is not performed on the document. We recommend using only single\
    \ quotes since they prevent interpolation elsewhere in bash so the meaning is\
    \ consistent, unlike using double quotes.\n\nIn practice, using - means you can\
    \ indent the here-document in your code (but only using tabs) while not having\
    \ that indent present in the document itself later, and not quoting means you\
    \ can use variables in it. As we saw in Example 8-3, that’s great for displaying\
    \ a usage message that includes the name and path of the script, without a lot\
    \ of echo or printf lines and quotes. We also use it later for “Embedded Documentation”\
    \ on page 115.\n\nHere-strings look like [fd]<<word, which seems similar, but\
    \ in this case the word itself is subject to parameter, variable, and arithmetic\
    \ expansion; command substitution; and quote removal. They are essentially a simpler\
    \ here-document without a delimiter that results in a string, with a newline appended.\n\
    \nSee the GNU documentation on here-documents and here-strings.\n\n## Are We Interactive?\n\
    \nSometimes your code needs to know whether or not it is running in an interactive\
    \ session. It may need to know because it will change behavior, like asking for\
    \ input, or perhaps you only want to set certain configuration options for interactive\
    \ shells.\n\nThe GNU documentation on interactive shells says to use one of the\
    \ following, so you will see these or variations a lot:\n\n```\ncase \"$ -\" in\n\
    \  *i*) echo This shell is interactive ;;\n  *)   echo This shell is not interactive\
    \ ;;\nesac\n```\n\nor:\n\n```\nif [ -z \"$PS1\" ]; then\n  echo This shell is\
    \ not interactive\nelse\n  echo This shell is interactive\nfi\n```\n\nYou can\
    \ also consider the -t FD test, which is true if the file descriptor is opened\
    \ on a terminal. If you do not specify a file descriptor, 0 (STDIN) is used. You\
    \ can combine that with another test, say for bash itself, such as:\n\n```\n#\
    \ Only if bash in a terminal!\nif [ -t 1 -a -n \"$BASH_VERSION\" ]; then\n  echo\
    \ 'bash in a terminal'\nelse\n  echo 'NOT bash in a terminal'\nfi\n```\n"
  mdcn: "\n\n我们建议使用 #!/bin/bash - 或 #!/usr/bin/env bash。我们强烈不建议使用 #!/bin/sh，除非你是有意将代码限制在\
    \ Bourne shell 兼容性上，换句话说不使用“bashism”。过去在 Linux 上这样做是可以的，但许多 Linux 发行版已改用 Debian\
    \ Almquist shell 或 dash 作为 /bin/sh，因为它比 bash 更小更快，运行脚本时速度更快，就像系统启动时使用的所有脚本一样。但当你真正需要\
    \ bash 时使用 sh 是一个坏主意，因为正如我们刚才所说，它很脆弱并且掩盖了程序员的意图。\n\n#!/usr/bin/env bash 可移植性更高，因为只要\
    \ bash 在 $PATH 中，它就会去找到它。当 bash 不在 /bin/ 中时，这非常有用，这在 BSD、Solaris 和其他非 Linux 系统上就是这种情况。唯一的问题是，生成\
    \ env，然后搜索 $PATH，然后用 bash 替换自身的开销更慢。有了现代计算机的资源，这几乎从不重要，但如果你在受限系统上开发或在短时间内运行大量脚本或实例，这种开销会累积起来（示例\
    \ 9-11）。\n\n### 示例 9-11. Shebang 速度测试\n\n```\n$ head examples/ch09/shebang*\n\
    ==> examples/ch09/shebang-bash.sh <==\n#!/bin/bash -\n:\n\n==> examples/ch09/shebang-env.sh\
    \ <==\n#!/usr/bin/env bash\n:\n\n$ time for ((i=0; i<1000; i++)); do examples/ch09/shebang-bash.sh;\
    \ done\nreal    0m3.279s\nuser    0m1.273s\nsys     0m0.915s\n\n$ time for ((i=0;\
    \ i<1000; i++)); do examples/ch09/shebang-env.sh; done\nreal    0m4.291s\nuser\
    \    0m1.313s\nsys     0m1.425s\n```\n\n需要提到的另一个细节是我们展示的尾随 -。这是为了防止非常古老的解释器欺骗攻击；有关详细信息，请参阅\
    \ Unix FAQ 的第 4.7 节。Linux 内核（但其他内核不这样做！）将第一个“单词”之后的所有内容（在本例中为 /bin/bash）视为单个参数，因此我们用“结束参数”的连字符“使用”该参数。请注意，这在\
    \ #!/usr/bin/env bash 中不需要，因为 bash 部分本身就是参数。\n\n## 非官方 bash 严格模式\n\nPerl 有一个 use\
    \ strict 指令，用于“限制不安全构造”，如果未在之前使用变量声明和初始化变量等，它会触发语法检查或运行时错误。非官方 bash 严格模式文章认为以下内容在\
    \ bash 中做了同样的事情（在精神上）：\n\n```\nset -euo pipefail\nIFS=$'\\n\\t'\n```\n\n我们并不完全同意那样更改\
    \ $IFS，因为这会破坏很多 bash 习惯用法（参见第 89 页的“为乐趣和利润而摆弄 $IFS，以读取文件”）。作者提出了很好的论点，但这可能需要大量工作来迁移遗留代码。set\
    \ 命令非常好：\n\n- -e 将在第一次出错时退出整个脚本。\n- -u 将在你使用未设置变量时退出整个脚本。\n- -o pipefail 将在管道中任何命令，而不仅仅是最后一个命令，以非零退出时使管道失败。\n\
    \n添加 -u 会破坏很多现有脚本，但修复起来会很容易，而且你可能会发现一些你不知道的变量名拼写错误，这正是重点所在。-eo pipefail 最初可能破坏得更少，而当它确实“破坏”脚本时，该脚本可能早已损坏，但错误被掩盖了，这些选项只是揭露了问题。\n\
    \n这绝对值得考虑，也许可以添加到你的模板和风格指南中。\n\n另请参阅：\n\n- http://redsymbol.net/articles/unofficial-bash-strict-mode\n\
    - help set\n- https://perldoc.perl.org/strict\n\n## 退出代码\n\n如果没有特别说明，你的 bash 脚本将以最后运行的命令的退出（或返回）代码退出。有时这没问题，有时你可能需要在执行健全性检查失败后或出于其他条件提前退出。\n\
    \n在 bash 中，零表示 *成功*，非零表示失败。这与许多其他语言相反，但原因是有一种成功方式但有许多失败方式，你可能需要表示失败的方式，例如：\n\n\
    ```\nif grep --quiet \"$HOSTNAME\" /etc/hosts; then ...\n```\n\nbash 退出代码只有八位，因此最大值是\
    \ 255，但你希望返回代码值保持在 125 及以下，因为 126 及以上已被占用，如表 9-1 所示。\n\n### 表 9-1. bash 退出/返回代码\n\
    \n| Exit/return code | Use/description |\n|---|---|\n| 0 | Success |\n| 1–125\
    \ | User-defined failure |\n| 2 | bash builtins incorrect usage |\n| 126 | Command\
    \ found but not executable |\n| 127 | Command not found |\n| 128–255 | Command\
    \ exited with signal N-128 |\n\n另请参阅 GNU 文档关于退出状态。\n\n用于以“退出代码”退出整个脚本的命令是，等一下，exit\
    \ n。用于从函数返回的命令是，再次，等一下，return n，其中“n”是之前定义的可选参数。请记住 return 返回的是退出代码，而不是值。“n”可以是任何\
    \ shell 表达式，如 5 或 $val 或更复杂的表达式。请记住如果未给出“n”，状态为最后运行命令的状态。\n\n另请参阅我们在第 79 页“HELP!”中关于\
    \ exit 0 或 exit 1 的帮助和用法讨论。\n\n## 这是个陷阱！\n\ntrap 内置命令（help trap）允许你在脚本接收到信号时执行代码，其中包括脚本退出时。这是一个很好的地方放置“清理”代码，即使有人\
    \ CTRL-C（但不是 kill -9）脚本也能工作。你也可以用它运行调试代码，但对于这种简单情况，只需使用 set -x 或在 bash -x 下运行即可。运行\
    \ trap -l 列出系统支持的所有信号，或 trap -p <signal> 显示与该信号关联的 trap 命令。\n\ntrap 的典型用途是清理脚本，如前所述。语法是\
    \ trap [-lp] [[arg] signal_spec ...]，而 arg 可以是自包含的代码，但最好只是定义一个函数然后调用它会更清晰。这看起来像示例\
    \ 9-12（输出显示在示例 9-13 中）。\n\n### 示例 9-12. 临时 trap 示例：代码\n\n```\n#!/usr/bin/env bash\n\
    # trivial_trap.sh: Trivial bash trap example\n# Original Author & date: _bash\
    \ Idioms_ 2022\n# bash Idioms filename: examples/ch09/trivial_trap.sh\n# --------------------------------------------------------------------------------\n\
    # Does not work on Zsh 5.4.2!\n\nfunction Cleanup {\n    echo \"$FUNCNAME was\
    \ triggered!  Cleaning up...\"\n}\n\necho \"Starting script $0...\"\n\necho 'Setting\
    \ the trap...'\n# Will call Cleanup on any of these 6 signals\ntrap Cleanup ABRT\
    \ EXIT HUP INT QUIT TERM\n\necho 'About to exit...'\n```\n\n### 示例 9-13. 临时 trap\
    \ 示例：输出\n\n```\nStarting script examples/ch09/trivial_trap.sh...\nSetting the\
    \ trap...\nAbout to exit...\nCleanup was triggered!  Cleaning up...\n```\n\n另请参阅\
    \ GNU 文档关于 trap 和第 120 页的“bash 调试”。\n\n## Here-Documents 和 Here-Strings\n\n其他语言有类似的构造，比如\
    \ C 的 /* ... */，和 Python 的 ''' ... '''，但 bash 有一些有趣的习惯用法用于 here-documents 和 here-strings。我们在示例\
    \ 8-3 中使用过 here-document，但还有更多需要讨论和解码的内容。\n\nHere-documents 用于在不需要大量分隔符和命令的情况下包含并经常显示文本块。\n\
    \nHere-document 语法是 [fd]<<[-][\"'\"]word[\"'\"]，其中“fd”是可选的（且很少使用）文件描述符，- 是一个表示“删除前导制表符但不删除空格”的标志，可选引号表示“不插值内容”。word\
    \ 本身不受参数、变量、算术或文件名扩展或命令替换的影响。举例来说，这意味着它不能是变量。如果 word 的任何部分被引用，则不会对文档进行插值。我们建议只使用单引号，因为它们在\
    \ bash 中防止其他地方的插值，因此含义一致，而使用双引号则不然。\n\n实际上，使用 - 意味着你可以在代码中缩进 here-document（但只能使用制表符），同时在文档本身中不保留该缩进，而不加引号意味着你可以在其中使用变量。正如我们在示例\
    \ 8-3 中看到的那样，这对于显示包含脚本名称和路径的用法消息非常有用，而无需大量 echo 或 printf 行和引号。我们在后面也将其用于第 115\
    \ 页的“嵌入式文档”。\n\nHere-strings 看起来像 [fd]<<word，这似乎相似，但在这种情况下 word 本身会受到参数、变量和算术扩展的影响；命令替换；和引号删除。它们本质上是一个没有分隔符的更简单的\
    \ here-document，结果是一个字符串，并附加换行符。\n\n参见 GNU 文档关于 here-documents 和 here-strings。\n\
    \n## 我们是交互式的吗？\n\n有时你的代码需要知道它是否在交互式会话中运行。它可能需要知道这一点，因为它会改变行为，比如请求输入，或者你可能只想为交互式\
    \ shell 设置某些配置选项。\n\nGNU 文档关于交互式 shell 说要使用以下其中一种，因此你会经常看到这些或其变体：\n\n```\ncase\
    \ \"$ -\" in\n  *i*) echo This shell is interactive ;;\n  *)   echo This shell\
    \ is not interactive ;;\nesac\n```\n\n或：\n\n```\nif [ -z \"$PS1\" ]; then\n  echo\
    \ This shell is not interactive\nelse\n  echo This shell is interactive\nfi\n\
    ```\n\n你也可以考虑 -t FD 测试，如果文件描述符打开在终端上则为真。如果未指定文件描述符，则使用 0（STDIN）。你可以将其与其他测试结合，比如\
    \ bash 本身，例如：\n\n```\n# Only if bash in a terminal!\nif [ -t 1 -a -n \"$BASH_VERSION\"\
    \ ]; then\n  echo 'bash in a terminal'\nelse\n  echo 'NOT bash in a terminal'\n\
    fi\n```\n\n"

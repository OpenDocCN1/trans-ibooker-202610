    To avoid confusion over where the variable name ends (the spaces make it easy
    in this example), a more complete syntax for variable reference uses braces around
    the variable name ${FILE}, and could have been used in our example.


    This syntax, with the braces, is the foundation for much special syntax around
    variable references. For example, we can put a hash sign in front of a variable
    name ${#VAR}, to return not its value but the string length of the value.


    | ${VAR} | ${#VAR} |

    |---|---|

    | oneword | 7 |

    | /usr/bin/longpath.txt | 21 |

    | many words in one string | 24 |

    | 3 | 1 |

    | 2356 | 4 |

    | 1427685 | 7 |


    But bash can do more than simply retrieve the value or its length.


    # Parameter Expansion


    When retrieving the value of a variable, certain substitutions or edits can be
    specified, affecting the value that is returned (though not the value in the variable—except
    in one case). The syntax involves special sequences of characters inside the braces
    used to delineate the variable''s name, like the characters inside these braces:
    ${VAR##*/}. Here are a few such expansions worth knowing.


    # Shorthand for basename


    When you invoke a script, you might use just its filename as the command to invoke
    the script, but that assumes that the script has execute permissions and is in
    a directory located in one of the directories in your PATH variable. You might
    invoke the script with ./scriptname if the script is in your current directory.
    You might invoke it with a full pathname, /home/smith/utilities/scriptname, or
    even a relative pathname if your current working directory is nearby.


    Whichever way you invoke the script, $0 will contain the sequence of characters
    that you used to invoke the script—relative path or absolute path, however you
    expressed it.


    When you want to print that script''s name out in a usage message, you likely
    want just the basename, the name of the file itself, not any of the path that
    got you there:


    ```

    echo "usage: ${0##*/} namesfile datafile"

    ```'

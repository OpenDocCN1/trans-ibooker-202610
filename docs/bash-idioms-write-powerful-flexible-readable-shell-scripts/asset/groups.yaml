    \n我们将简要介绍不同的提示符，因为有一些新颖且鲜为人知的功能，如表 10-1 所示。\n\nTable 10-1. bash prompts\n\n| Prompt\
    \ | Use | Default |\n|---|---|---|\n| PS0 | bash v4.4+ pre-execution prompt |\
    \ None |\n| PS1 | Bourne/bash primary prompt | '\\s-\\v\\$ ' |\n| PS2 | Bourne/bash\
    \ secondary prompt | '> ' |\n| PS3 | bash select prompt | '#? ' |\n| PS4 | bash\
    \ debug parameter | '+ ' |\n| PROMPT_COMMAND | command before $PS1 | None |\n\n\
    ### PS0\n\n此提示符由交互式 shell 在你按下回车执行命令后，但在命令运行前显示。它可用于在命令运行前显示“开始时间”或其他标记（参见示例 10-1）。\n\
    \n### Example 10-1. Example bash pre-execution prompt\n\n```\nPS0='Start: \\D{%Y-%m-%d_%H:%M:%S_%Z}\\\
    n'\n```\n\n```\n### Note the difference between the prompt time and the start\
    \ time\n[user@hostname:T2:L1:C5289:J0:2021-08-27_17:46:04_EDT]\n/home/user/bash-idioms$\
    \ ls -1 ch*\nStart: 2021-08-27_18:47:37_EDT\nch01.asciidoc\n...\n```\n\n### PS1\n\
    \n这是继承自 Bourne shell 的主要 bash 提示符，你在 bash 中几乎所有交互时间都花在这里，因此值得理解和调整。示例 10-2 中显示的提示符让一些人抓狂，但它很有用，因为它提供了你可能需要的所有信息，非常适合复制粘贴到文档或故障单中。不过有一个问题。日期/时间是在提示符显示时显示的，如果那是几小时或几天前，就会令人困惑。你可以通过意识到这个问题并在开始新命令或会话前按几次回车来解决这个问题。或者，如果你使用\
    \ bash v4.4+，你可以使用 PS0，如前例所示。请注意，C5275 命令历史编号在你把密码误输入 bash 历史记录时非常有用。只需 history\
    \ -d 5275 就搞定了。（参见 help history，并为使用前导空格省略历史命令本身而加分，参见示例 10-13。）\n\n### Example\
    \ 10-2. Example bash primary prompt\n\n```\nexport PS1='\\n[\\u@\\h:T\\l:$SHLVL:C\\\
    ! :J\\j :D{%Y-%m-%d_%H:%M:%S_%Z}]\\n$PWD\\$ '\n```\n\n```\n[user@hostname:T2:L1:C5275:J0:2021-08-27_16:51:20_EDT]\n\
    /home/user/bash-idioms$\n```\n\n### PS2\n\n当你按下回车但尚未完成命令时会出现此提示，可能因为你尚未关闭引号或 here-document。\n\
    \n### PS3\n\nselect 内置命令使用的提示符；参见第 107 页的“select”。\n\n### PS4\n\n当 set -x 激活时，这是调试提示符，或许前缀更合适。注意第一个字符会根据\
    \ shell 嵌套级别重复，因此你希望它清晰可见。+ 是一个不错的选择；另见第 120 页的“bash Debugging”。示例 10-3 或许有点繁忙，但信息丰富。\n\
    \n### Example 10-3. Example bash debug prompt\n\n```\nexport PS4='+xtrace $BASH_SOURCE:$LINENO:$FUNCNAME:\
    \ '\n```\n\n### PROMPT_COMMAND\n\n示例 10-4 显示了一个在 $PS1 被求值并显示之前运行的命令。它用于各种用途，如更新\
    \ GUI 终端的窗口标题；显示有关环境的动态细节，例如你所在的 Git 分支；甚至进行一些非常原始且不安全的日志记录。\n\n### Example 10-4.\
    \ Example bash PROMPT_COMMAND for logging\n\n```\n### This should be one line;\
    \ it is broken to fit the page\nexport PROMPT_COMMAND='logger -p local1.notice\
    \ -t \"bashlog[$S]\" \\\n\"SSH=$SSH_CONNECTION; USER=$USER; PATH=$PWD; COMMAND=$(fc\
    \ -ln -1)\"'\n```\n\n### bash Time Zone\n\n这并不是真正的 bash 惯用法，但这是一个不错的提示符技巧。bash\
    \ 提示符默认以系统时区显示日期和时间，但你可以 export TZ=UTC 或其他时区来更改它。如果你更喜欢将 GUI 保持在本地时区，但希望 bash\
    \ 显示 UTC 以用于文档目的，或使本地 bash 时间显示与服务器显示匹配，这很有用。请注意，提示符 TZ 不会在你运行外部命令之前更改；仅按回车或运行\
    \ bash 内置命令不会导致它更新。\n\n另见第 55 页的“Time for printf”了解更多日期和时间处理。\n\n### Getting User\
    \ Input\n\n大多数时候，bash 脚本通过命令行参数获取用户输入，但有时你也可能需要询问输入。做到这一点有两种常见方法，即 read 和 select\
    \ 内置命令。\n\n另见：\n\n- help read\n- help select\n\n### read\n\nread 从 STDIN 或文件描述符读取一行并将单词分配给变量列表，或分配到数组（列表）变量中，并且它有许多非常有用的选项（示例\
    \ 10-5 所示）。\n\n"

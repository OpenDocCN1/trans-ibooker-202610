- pgno: 98
  md: "# Version\n\nJust like -h and/or --help, a version command can be useful. First,\
    \ though, is -v version or verbose? We prefer -V for version and -v for verbose\
    \ (if applicable). Second, do you need a version? Not as much as you need help,\
    \ so it really depends. The gen2 version-control systems like CVS and SVN made\
    \ version easy—just use keyword expansion like VERSION=$Id$. But the gen3 systems\
    \ like Git don’t support that, so you’re back to a manually updated variable,\
    \ or some kind of build-time or CI (continuous integration) incrementer. For larger\
    \ or public scripts, it makes sense; for smaller personal scripts, it might not.\
    \ Your call.\n\nYou implement version by VERSION=something and display it the\
    \ same way as help. Choosing the exit code (“Exit Codes” on page 96) of this is\
    \ easier since you get the version output only if you asked for it, so exit 0\
    \ clearly makes sense.\n\nWhat you set $VERSION to is up to you:\n\n+   - VERSION=$Id$\
    \ for CVS or SVN\n+   - VERSION=v1.2.3\n+   - VERSION=\"$PROGRAM v1.2.3\"\n+ \
    \  - VERSION=\"$0 v1.2.3\" # Probably not, since $0 varies\n+   - VERSION=12\n\
    \n# Style and Readability: Recap\n\nIn this chapter, we discussed CLI options,\
    \ arguments, and usage. We showed a simple way to parse a single argument and\
    \ how not to proceed with insufficient arguments by checking $#. We then described\
    \ the bash builtin getopts as a good way to parse both short- and long-format\
    \ options.\n\nA script that has any significant amount of argument parsing should\
    \ make an effort to keep that code separate from the core function of the script.\
    \ That is often best accomplished by setting flag variables in the case statement(s)\
    \ that can be referenced later in the script where the functionality is implemented.\
    \ You can make a big improvement in readability for your script by making the\
    \ parsing of arguments a separate function in your script. Wrap Example 8-4 in\
    \ a function definition:\n\n```\n# Called like: parseargs \"${@}\"\nfunction parseargs\
    \ {\n  ...\n}\n```\n\nthen call it with parseargs \"${@}\", and the remainder\
    \ of your script can follow, using the flags set in the parseargs function."

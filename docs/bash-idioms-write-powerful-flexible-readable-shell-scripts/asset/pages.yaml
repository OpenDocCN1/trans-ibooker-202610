  md: '![](img/553ffa1bc15093729b691f706befc0ac_49_0.png)


    # Shell Patterns, Not Regular Expressions


    The patterns used in parameter expansion are not regular expressions. They are
    only shell pattern matching, where * matches 0 or more characters, ? matches a
    single character, and [chars] matches any one of the characters inside the braces.


    # Shorthand for dirname or Suffix Removal


    Similar to how # will remove a prefix, that is, remove from the lefthand side,
    we can remove a suffix, that is, from the righthand side, by using %. A double
    percent sign indicates removing the longest possible match. Here are some examples
    that show how to remove a suffix. The first examples show a variable $FN, which
    holds the name of an image file. It might end in .jpg or .jpeg or .png or .gif.
    See how the different patterns remove various parts of the righthand side of the
    string. The last few examples show how to get something similar to dirname from
    the $0 parameter:


    | Value in shell variable | Expression | Result returned |

    |---|---|---|

    | img.1231.jpg | ${FN%.*} | img.1234 |

    | img.1231.jpg | ${FN%%.*} | img |

    | ./ascript | ${0%/*} | . |

    | ./ascript | ${0%%/*} | . |

    | /home/guy/bin/ascript | ${0%/*} | /home/guy/bin |

    | /home/guy/bin/ascript | ${0%%/*} |  |


    This parameter substitution for dirname isn’t an exact replica of the output from
    the command. It differs in the case where the path is /file because dirname would
    return just a slash, whereas our parameter substitution would remove it all. You
    can check for this if you want with some additional logic in your script, you
    could ignore this case if you don’t expect to see it, or you can just add a slash
    to the end of the parameter, as in ${0%/*}/, so that all results would end in
    a slash.


    ![](img/553ffa1bc15093729b691f706befc0ac_49_1.png)


    # Prefix and Suffix Removal


    You can remember that # removes the left part and % the right part because, at
    least on a standard US keyboard, # is shift-3, which is to the left of % at shift-5.


    # Other Modifiers


    More than just # and %, there are a few other modifiers that can alter a value
    via parameter expansion. You can convert either the first character or all characters
    in a'

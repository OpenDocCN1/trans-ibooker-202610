- pgno: 63
  md: 'We use either single- or double-bracket syntax to do some logic and comparisons,
    that is, conditional expressions. We use them for checking the state of things,
    like if a file exists or has certain permissions, or if a shell variable has a
    value or not. See the bash man page under “Conditional Expressions” for a full
    list of the tests and checks you can make, and help test for quick reminders.


    Our preceding example is checking to see if the DIR variable has a non-null value.
    Another way to write this would be:


    ```

    if [[ -n "$DIR" ]]; then ...

    ```


    to see if the value is not null, that is, has a nonzero length. Conversely, to
    see if the variable’s value is zero length, i.e., unset or null, use:


    ```

    if [[ -z "$DIR" ]]; then ...

    ```


    So are there differences between the single- and double-bracket tests? Just a
    few, but they can be significant.


    Perhaps the biggest difference is that the double-bracket syntax supports an additional
    comparison operator, =~, which allows the use of regular expressions:


    ```

    if [[ "$FILE_NAME" =~ .*xyzZ*.*jpg ]]; then ...

    ```


    ![](img/553ffa1bc15093729b691f706befc0ac_63_0.png)


    # Regular Expressions


    This is the one and only place in bash where you will find regular expressions!
    And remember: do not put your regular expression in quotes or you will be matching
    those characters verbatim and not as a regular expression.


    Another difference between single and double brackets is more stylistic, but one
    that will affect portability. These two forms do the same thing:


    ```

    if [[ $VAR == "literal" ]]; then ...

    ```


    ```

    if [ $VAR = "literal" ]; then ...

    ```


    The use of the single equals sign for comparison may seem unnatural for C and
    Java programmers, but when used in bash conditional expressions, both = and ==
    mean the same thing. The single equals sign is preferred in the single bracket
    syntax for POSIX compliance (so says the bash man page).'
  merge: -1
  img_proc: true
- pgno: 64
  md: '![](img/553ffa1bc15093729b691f706befc0ac_64_0.png)


    # A Subtle Sort of Difference


    Within the double square brackets, the < and > operators compare “lexicographically
    using the current locale,” whereas test (and [ ) compare using simple ASCII ordering.


    You will also likely need to escape these operators (like this: if [ $x \> $y
    ]) when using single brackets, otherwise they will be taken to mean redirection.
    Why? Because the single bracket, like the test command, is a builtin command not
    a keyword, so bash sees it as running a command—and you can redirect I/O when
    running a command. However, when bash sees the double brackets, a keyword, it
    knows to expect such operators and doesn’t treat them as redirection. Therefore,
    of the two syntax forms, we much prefer the double-bracket syntax.


    Both single- and double-bracket expressions can use an older, more Fortran-like
    syntax for their numeric comparisons. For example, they use -le for less-than-or-equal-to
    comparison. Here’s where another difference between the two arises. The arguments
    to either side of this operator must be simple integers in the single bracket
    expression. Using double brackets, each operand can be a larger arithmetic expression,
    though without spaces unless quoted. For example:


    ```

    if [[ $OTHERVAL*10 -le $VAL/5 ]] ; then ...

    ```


    A better choice if you’re doing arithmetic expressions and comparisons is to use
    the double-parentheses syntax. That gives you the more familiar C/Java/Python-like
    comparison operators and more freedom regarding spacing:


    ```

    if (( OTHERVAL * 10 <= VAL / 5 )) ; then ...

    ```


    # Style and Readability: Recap


    With so many variations to choose from, which if statement style do you choose?
    We choose the style that best fits the calculation under consideration.


    When it is a mathematical expression, we use the double parentheses. As a rule,
    in bash, double parens indicate arithmetic is going on. The dollar sign indicates
    that you want the value of the expression returned, otherwise you just get a success/fail
    result status. But operator-rich bash makes it possible to do similar things using
    either the double-paren syntax or the let builtin. Since the $ isn’t needed on
    variables to get their values inside double parentheses, we try to omit them consistently.


    For arithmetic expressions, some people may prefer the double parentheses around
    the expression, consistent with the if statements. However, for others the simple
    let builtin command reads cleanly and simply. You can live dangerously and skip
    the double parens by declaring your variables as integers, but we cannot recommend'

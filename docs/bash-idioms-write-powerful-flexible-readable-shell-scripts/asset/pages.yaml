  img_proc: true
- pgno: 92
  md: "The convention is that the long options begin with two dashes. (In this example,\
    \ we would write --last to specify the long option.)\n\nTo use getopts to parse\
    \ long options, we add a minus sign and colon to the option list, then add another\
    \ case statement to recognize each of the long arguments. We include the colon\
    \ even if our long option takes no arguments. (We'll explain that in the sections\
    \ that follow.)\n\nExample 8-2 shows the previous example, which parsed a set\
    \ of options, expanded to include a couple of long arguments. The two long arguments\
    \ that this will handle are --amode, which will be the same as the shorter -a\
    \ option; and --outfile, which, like -o, takes an argument. For long options,\
    \ the option and its corresponding argument can be provided one of two ways: as\
    \ a single word using the equals sign or as two words. For example, when invoking\
    \ the script, you can write either outfile=file.txt or outfile file.txt to specify\
    \ the output file option. getopts and this second case statement can handle either\
    \ format.\n\n# Example 8-2. getopts argument parsing: long\n\n```\n#!/usr/bin/env\
    \ bash\n# parselong.sh: Use getopts to parse these arguments, including long ones\n\
    # Original Author & date: _bash Idioms_ 2022\n# bash Idioms filename: examples/ch08/parselong.sh\n\
    #\n# Long arguments: --amode\n#               and --outfile filename or --outfile=filename\n\
    \nVERBOSE=':'  # Default is off (no-op)\n\nwhile getopts ':-:ao:v' VAL ; do\n\
    \  case $VAL in\n    a ) AMODE=1 ;;\n    o ) OFILE=\"$OPTARG\" ;;\n    v ) VERBOSE='echo'\
    \ ;;\n#--------------------------------------------------------------------\n\
    \    - ) # This section added to support long arguments\n      case $OPTARG in\n\
    \        amode ) AMODE=1 ;;\n        outfile=* ) OFILE=\"${OPTARG#*=}\" ;;\n \
    \       outfile )\n                  OFILE=\"${!OPTIND}\"\n                  let\
    \ OPTIND++\n                  ;;\n        verbose ) VERBOSE='echo' ;;\n      \
    \  * )\n          echo \"unknown long argument: $OPTARG\"\n          exit\n  \
    \        ;;\n      esac\nesac\n```"
  merge: -1
  img_proc: true
- pgno: 93
  md: "```\n#- --------------------------------------------------\n    ;; \n    :\
    \ ) echo \"error: no argument supplied\" ;;\n    * ) \n    echo \"error: unknown\
    \ option $OPTARG\"\n    echo \"      valid options are: aov\"\n    ;;\nesac\n\
    done\nshift $((OPTIND -1))\n```\n\nHow does this support long-format options?\
    \ What’s really going on here?\n\n+   1. Consider that getopts was designed to\
    \ handle single-character options (e.g., -a). Adding the minus sign to the option\
    \ list means that -- will be recognized as a valid option.\n\n+   2. Any remaining\
    \ characters after the two minus signs are considered the “argument” to the --\
    \ option and are put in the $OPTARG variable. We can use our inner case statement\
    \ to match the value of $OPTARG to the long option names that we want to implement.\n\
    \n+   3. What happens, then, for the options, like --outfile, that need a user-supplied\
    \ argument? If the argument is supplied with the equals sign syntax (e.g., --outfile=my.txt),\
    \ then getopts assigns that entire string (after the --) to OPTARG. We can extract\
    \ the argument from the option string using bash’s parameter expansion string\
    \ manipulation (see “Parameter Expansion” on page 32), removing (\\#) all of the\
    \ characters (\\*) up to, and including, the equals sign (=) via the expression\
    \ that uses all of these symbols. That leaves us with just the characters after\
    \ the equals sign, which would be the argument that we’re after. We might also\
    \ have coded it to be more literal with the string we want to remove by coding\
    \ it as OFILE=\"${OPTARG#outfile=}\" to remove that text from the front of OPTARG.\n\
    \n+   4. When the argument is supplied as a separate word, the second outfile\
    \ pattern in our case statement will be taken. Here we make use of a variable,\
    \ $OPTIND, that getopts uses to keep track of its parsing. The filename argument\
    \ is retrieved indirectly using ${!OPTIND}. How does that work?\n\n+   5. When\
    \ using getopts, the shell variable $OPTIND holds the index of the next argument\
    \ to be processed by getopts. The ! says to use indirection—take the value of\
    \ $OPTIND and use that as the name of the variable to retrieve. For example, if\
    \ --output was the third argument encountered by getopts, then, at that point,\
    \ $OPTIND would have the value 4, and, therefore, ${!OPTIND} would return the\
    \ value of ${4}, which would be the next argument, the filename."
  merge: -1

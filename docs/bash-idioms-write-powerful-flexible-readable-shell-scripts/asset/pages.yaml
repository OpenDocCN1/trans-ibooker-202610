    # No Trailing Slash


    Note that there is no trailing slash like you would find in other similar commands
    like sed or vi. The closing brace ends the substitution.


    Why not always use this substitution mechanism? Why bother with # or % substitution
    from the ends of the string? Consider this filename: frank.gifford.gif, and suppose
    you wanted to change this filename to a jpg file using Image Magick’s convert

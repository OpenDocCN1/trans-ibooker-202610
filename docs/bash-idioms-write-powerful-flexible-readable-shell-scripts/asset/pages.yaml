  md: "4 The end-of-help marker is also indented with a tab to match the rest of the\
    \ contents.\n\n5 We can debate if exit code (“Exit Codes” on page 96) exit 0 for\
    \ success or exit 1 (really anything greater than zero) for failure is correct\

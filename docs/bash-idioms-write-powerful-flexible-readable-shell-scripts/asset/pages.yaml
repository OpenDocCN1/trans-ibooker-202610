  md: '![](img/553ffa1bc15093729b691f706befc0ac_61_0.png)


    # A Reminder About Spaces


    In a bash variable assignment, no spaces are allowed around the equals sign. For
    variable assignment, syntactically, it all must be one “word” of text. However,
    inside the parentheses, spaces are OK since the parens define the boundary for
    that “word.”


    Now there is just one more arithmetic variation—probably for historical reasons.
    You can use the shell builtin let to act like the double parens without the dollar
    sign. So compare these equivalent statements:


    ```

    (( step++ ))  # Is the same as:

    let "step++"


    (( median_loc = len / 2 ))  # Is the same as:

    let "median_loc = len / 2"


    (( dist *= 4 ))  # Is the same as:

    let "dist*=4"

    ```


    But be careful—if you don’t use quotes (single or double) around the let expression,
    then you better not have any spaces in that expression at all. (The first let
    in our example doesn’t need the quotes, but it’s a good habit to always use them.)
    Spaces will divide your command into separate words, and let only takes a single
    word, so you’ll get a syntax error if there is more than one word.


    # No Parentheses Needed


    We said that bash is a string-oriented language, but there is a way to make an
    exception. You can declare a variable as an integer like this: declare -i MYVAR,
    and having done so, you can do arithmetic to assign it a value without using double
    parentheses and without the $ in front of variable names. Here’s an example, a
    script seesaw.sh:


    ```

    declare -i SEE

    X=9

    Y=3

    SEE=X+Y        # Only this one will be arithmetic

    SAW=X+Y        # This is just a literal string

    SUM=$X+$Y      # This is string concatenation

    echo "SEE = $SEE"

    echo "SAW = $SAW"

    echo "SUM = $SUM"

    ```


    What you get if you run these statements shows how bash is mostly string oriented.
    The values of SAW and SUM are formed by string operations. Only SEE is given its
    value by doing arithmetic:'

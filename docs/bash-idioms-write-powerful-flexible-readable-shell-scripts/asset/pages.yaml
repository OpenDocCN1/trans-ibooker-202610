- pgno: 129
  md: '# Rotating Old Files


    Logging is good, and archives are good, but at some point you need to “rotate”
    or delete old files. There are many idiomatic ways to do that, so we’ll talk about
    a few and make some suggestions.


    Many approaches to rotating old files involve the excellent find utility, but
    a large number of those also use -exec and/or xargs, and with modern versions
    of GNU find, those are unnecessary. The old idioms are:


    ```

    find /path/to/files -name ''some-pattern'' -a -mtime 5 -exec rm -f \{\} \;

    ```


    ```

    find /path/to/files -name ''some-pattern'' -a -mtime 5 | xargs rm -f

    ```


    ```

    find /path/to/files -name ''some-pattern'' -a -mtime 5 -print0 | xargs -0 rm -f

    ```


    ① This is extremely inefficient because it calls a new instance of rm for each
    file.


    ② This is more efficient because it will batch up files (xargs), but it will break
    and do unexpected things if filenames contain spaces.


    ③ This can also handle spaces, but it’s still more complicated than you need.


    It’s much simpler, if you are using GNU find and do not have portability concerns,
    to use the code in Example 10-17.


    Example 10-17. Delete old files using find


    ```

    find /path/to/files \( -type f -a -name ''some-pattern'' -a -mtime 5 \) -delete

    ```


    Here are some things to keep in mind:


    +   - See man find and search for atime and mtime. -mtime +5 means the file was
    last modified at least five days ago, but the “five” is not exact; see the man
    page for a discussion of the details.

    +   - For testing, use -ls or -print instead of -delete! But don’t forget to change
    it when done.

    +   - Be aware that find will recurse into any/all subdirs under the path, unless
    you limit that using -maxdepth.

    +   - You want to use the ( ) for grouping (find just these things that match
    all criteria…then delete them), but you have to escape them to prevent the shell
    from interpreting them itself.

    +   - An -a “and” operator is assumed between options in the expression; you can
    also use -o for “or” if needed. We like adding the -a anyway, because explicit
    is better than implicit.'
  merge: -1
  img_proc: true

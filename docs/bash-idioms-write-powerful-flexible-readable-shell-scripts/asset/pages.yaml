- pgno: 71
  md: '*Print formatted*, or `printf`, is underutilized in bash since most people
    just use echo, but the bash builtin has a few idiomatic extensions that you''ll
    want to be able to read and write. It is also defined in POSIX, unlike the bash
    builtin version of echo, so it is more portable if your script runs on non-Linux
    systems.


    We''re only going to talk about the bash builtin version, but you probably have
    an external binary that is not connected to bash and will not have the same options:


    ```

    $ type -a printf

    printf is a shell builtin

    printf is /usr/bin/printf

    ```


    The bash `printf` will be used unless you use the full path (/usr/bin/printf)
    or prefix it with env. Compare `printf --help` and `env printf --help` to see
    the differences.


    We''re also not going to go into a long list of standard `printf` formats; those
    are covered in many other places, including Appendix A of *bash Cookbook*.


    For more details on your printf versions, see:


    +   - `help printf` or `printf --help`

    +   - `man 1 printf`

    +   - Possibly `/usr/bin/printf --help` or `env printf --help`


    # POSIX Output


    If your script will run on operating systems other than Linux, you should consider
    using `printf` instead of echo for consistency. It''s simple but involves more
    typing than using echo, and unlike echo, does not automatically include a trailing
    newline:


    ```

    printf ''%s\n''   # Simple string, newline NOT automatically included

    printf ''%b\n''   # Also expand escape characters

    ```


    You can use either single or double quotes around the `printf` format, and those
    quotes will follow the usual variable interpolation rules (single will not interpolate;
    double will), but escapes like \n will work inside both types of quotes. As we
    discuss elsewhere, we prefer single quotes to show programmer intent and prevent
    interpolation, unless you need to interpolate a variable inside the format, which
    may indicate you are doing something wrong.


    For much more on this topic, see:


    +   - https://unix.stackexchange.com/a/65819

    +   - https://www.in-ulm.de/~mascheck/various/echo+printf'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Getting or Using the Date and Time


    Bash 4.2 added printf %(datefmt)T, but the default output was the Unix Epoch (1970-01-01
    00:00:00 -0000), which is probably not what you wanted. The default changed to
    “now” in bash 4.3, which makes more sense. There are two special arguments, -1,
    which means “now,” and “-2,” which means “the time the shell was invoked.” You
    can provide an optional Epoch seconds time integer to display some other time,
    which is handy for translating Epoch seconds to human-readable time. We recommend
    using -1 for consistency and clarity of intent if you mean “now”:


    ```

    ### Set a $today variable using -v

    $ printf -v today ''%(%F)T'' ''-1''

    $ echo $today

    2021-08-13

    ```


    ```

    ### Trivial logging (these are the same)

    $ printf ''%(%Y-%m-%d %H:%M:%S %z)T: %s\n'' ''-1'' ''Your log message here''

    $ printf ''%(%F %T %z)T: %s\n'' ''-1'' ''Your log message here''

    2021-08-13 12:48:33 -0400: Your log message here

    ```


    ```

    ### When was 1628873101?

    $ printf ''%(%F %T)T = %s\n'' ''1628873101'' ''Epoch 1628873101 to human readable''

    2021-08-13 12:45:01 = Epoch 1628873101 to human readable

    ```


    ![](img/553ffa1bc15093729b691f706befc0ac_72_0.png)


    # printf into a Variable


    If you looked at help printf you may have noticed the -v var option, which assigns
    the output into a variable rather than displaying it, similar to sprintf in C.
    We’ll see a use for that next.


    For more details on this topic, see “Using logger from bash” on page 111.


    We much prefer the bash builtin printf, but one thing the GNU¹ version of date
    still does better than printf %(datefmt)T is showing dates for other times, like
    date -d ''2 months ago'' ''+%B'', which tells us the name of the month from two
    months ago, like:


    ```

    $ date -d ''2 months ago'' ''+%B''

    August

    ```


    ![](img/553ffa1bc15093729b691f706befc0ac_72_1.png)


    # Default bash on Mac Is Too Old


    Note that printf %(datefmt)T requires at least bash 4.2, 4.3+ preferred, so this
    won’t work in the older, but otherwise quite useful, default bash 3.2 on a Mac!
    See “bash on Mac” on page ix.


    1 GNU is a recursive acronym that stands for “GNU’s Not Unix.”'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# printf for Reuse or Debugging


    Bash help says “%q quote the argument in a way that can be reused as shell input,”
    and we will use that in Chapter 7 to show “shell quoted” strings, but here’s a
    simple example:


    ```

    $ printf ''%q'' "This example is from $today\n"

    This\ example\ is\ from\ 2021-08-13\\n

    ```


    This can be useful for reusing output elsewhere, creating formatted output (see
    also “Comma-Separated Lists” on page 38), and debugging where you need to be able
    to see hidden or control characters or fields. See also “bash Debugging” on page
    120.


    # Style and Readability: Recap


    Functions in bash are very much like internal shell scripts. Their invocation
    is very much like running any command, and their parameters are referenced like
    any shell script’s parameters ($1, $2, etc.) You will need to put your functions
    at the front of the script so that their definition is seen before any call to
    the function. As in any language, functions should be kept short and be largely
    single-purpose. Using a single I/O redirection on a function can help you avoid
    repetitive redirections. Perhaps the biggest danger with functions is the variable
    references. Functions can return values via variables or by writing to STDOUT
    and having the caller pipe the function’s output into some next command. You may
    need to refer to (global) variables to return values from a function, but there
    are some variables you want to avoid altering. Using local can help with that,
    but beware of dynamic typing—those local variables don’t stay local if you call
    another function. Be sure to document this sort of thing in the function’s opening
    comments.


    The printf builtin behaves much like the familiar function from other languages.
    In addition to the standard formats, bash’s printf has some useful idiomatic extensions.
    We especially appreciate not having to create a subshell to run the date command
    just to find out what time it is, especially if you are calling it frequently
    for logging.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# List and Hash Handling


    Computers, as we know, are very good at counting and organizing data. We can use
    code to count and organize data by using a *data structure*, and the building
    blocks for those are *arrays*. Bash has had arrays since the beginning and added
    *associative arrays* in version 4.0. You will run into hard-to-read code for bash
    arrays out there, partly because bash has a lot of history and backward compatibility
    to maintain, as we mentioned earlier, but also because some developers tend to
    overcomplicate things. Arrays are actually not that hard to implement, and you
    can write about them clearly with a little thought.


    As a refresher, in computer science and programming, arrays are variables containing
    multiple elements that are indexed or referred to by an integer. Or in other words,
    an array is a variable containing a list instead of a scalar or single value.
    An associative array is a type of list that is indexed by a string instead of
    an integer. So it’s a list of key-value pairs, that basically forms a dictionary
    or look-up table, where internally the key is hashed to form a memory location.
    More or less.


    The bash documentation uses the terms *array* and *associative arrays*, but depending
    on your background, *lists* and *hashes*, or possibly *dictionaries* or *dicts*,
    may be more familiar, and they are certainly easier to type and say. The bash
    documentation also uses *subscript* where other people might say *index*. We usually
    follow the bash docs for consistency, but for these we’re going to use the more
    common and understandable *list*, *hash*, and *subscript* terms.


    Even though lists (arrays) came first, hashes (associative arrays) are slightly
    simpler because there is never any question about supplying the index (subscript),
    because it’s required. The integer index of a list may be implied, and while it’s
    not really complicated, there are operations that work for them that make no sense
    for a hash.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'As the bash reference says, “Bash provides one-dimensional indexed and associative
    array variables.” While it’s possible to create really ugly multidimensional structures,
    doing so in bash will probably end in tears. If you really need to do that, consider
    doing it in a different language.


    ![](img/553ffa1bc15093729b691f706befc0ac_75_0.png)


    # Watch Out for bash Versions with Hashes


    You really need to be careful about your bash version here. As we just said, bash
    didn’t get hashes (i.e., associative arrays) until version 4.0, and it took a
    couple of versions to sort out some details, like allowing $list[-1] to refer
    to the last integer element (v4.3), instead of needing $mylist[${#mylist[*]}-1]
    (where ${#mylist[*]} is the element count). Ouch.


    As we said in “bash on Mac” on page ix, watch out for stock bash on a Mac; it’s
    quite old. You’ll find newer versions in MacPorts, Homebrew, or Fink.


    ![](img/553ffa1bc15093729b691f706befc0ac_75_1.png)


    # Not POSIX


    Also, arrays (lists and hashes) are not specified by POSIX, so if portability
    beyond bash is a concern, you’ll need to be very careful using them because they
    might not work. For example, the Zsh syntax is a bit different, so these examples
    won’t work on that on a Mac either.


    # Commonalities


    Lists and hashes are very similar in bash, so we’re going to start with what they
    have in common, then get to where they are different. In fact, you can treat lists
    as a subset of hashes that simply happen to have ordered integer indexes. We don’t
    think you should do that, but you can.


    Lists are inherently ordered, whereas hashes are inherently unordered, so there
    are operations like shift or push that only make sense for an ordered list. On
    the other hand, you would never need to sort the keys in an ordered list, but
    you might for a hash.


    ![](img/553ffa1bc15093729b691f706befc0ac_75_2.png)


    # Accidental Assignment


    An accidental assignment without a subscript will affect element zero, so myarray=foo
    results in creating or overwriting $myarray[0] with foo, even if it’s a hash!'

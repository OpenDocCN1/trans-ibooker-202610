    # bash Debugging


    We’ve talked about adding debugging statements to your code in “Debug and Verbose”
    on page 82, displaying values for debugging in “printf for Reuse or Debugging”
    on page 58 and in Example 10-3, but we haven’t talked about interpreter-level
    debugging until now.


    First, you can get a gross syntax check by running bash -n /path/to/script. Technically,
    bash -n means “read commands but do not execute them” (see help set), and it’s
    similar to perl -c. This will not tell you about runtime errors, incorrect logic,
    incorrect options to external commands, and such. But it will tell you about unbalanced
    quotes, parentheses, and brackets; invalid syntax for bash builtins; and so on.
    This is a great command to run early and often when writing or changing your script.


    There’s a similar bash -v or set -v command that is “print shell input lines as
    they are read,” but in practice that’s not as useful as it sounds because it displays
    before shell interpolation, so you just get your source code spit back at you.'

- pgno: 125
  md: '# Local Variables


    We talked about this in “Local Variables” on page 54, but to recap, the local
    command may only be used inside a function to declare a variable local to that
    function. That’s a good programming practice, but if you need a “local” scope
    outside of a function, there is a way to do that, and a common variable to work
    with is the internal field separator $IFS. Normally you don’t want to change $IFS,
    because if you do, all kinds of expected behaviors fail. But every once in a while,
    you do want to change it, usually only locally, and you can do that (even outside
    a function) by prefixing a variable assignment before a command, like this read
    command we’ll talk about next:


    ```

    IFS='':'' read ...

    ```


    See also “Fiddling with $IFS for Fun and Profit, to Read Files” on page 89.


    # Readline Hacks


    Readline is the library bash uses to read and edit command lines. It may be used
    by other programs, but you can easily access it using read -e in your scripts.
    It has a lot of options you can change to tweak its behavior, and it seems many
    users are not aware of them.


    You can explore creating a ~/.inputrc file (see the bind -f command), but just
    to play, you can add these to a ~/.bashrc file (Example 10-13).


    Example 10-13. Readline tweaks


    ```

    bind ''"\e[A": history-search-backward''   # Like CTRL-R but right on the CLI  ①

    bind ''"\e[B": history-search-forward''   # Same except forward  ②

    bind ''"\C-i": menu-complete''            # Cycle through possible completions  ③

    bind ''set completion-ignore-case on''      # Ignore case in completions  ④


    # These are bash, but feel related to "CLI behavior tweaks"

    export HISTCONTROL=''erasedups:ignoredups:ignorespace''+

    export HISTIGNORE=''&: [ ]*'' # bash >= 3, omit dups & lines starting w/ space+  ⑤
    ⑥

    ```


    ① Binds the “up arrow” to history-search-backward, which means if you start typing
    a command, then hit “up arrow,” it will search for that string in your history.
    You can do something similar with CTRL-R, but “up arrow” is faster and more intuitive.
    However, CTRL-R will find strings in the middle of the command, whereas this feature
    is limited to the beginning of the line.


    ② Binds the “down arrow” to history-search-forward, which is the same as item
    1 except forward in your history.'
  merge: -1

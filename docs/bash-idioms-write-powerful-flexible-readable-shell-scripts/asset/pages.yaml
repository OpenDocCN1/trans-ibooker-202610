    \n# Brute Force\n\nExample 9-5 shows how the entire file is “slurped” into memory.\n\
    \nExample 9-5. Brute force file reading examples\n\n```\nfor word in $(cat file);\
    \ do\n  echo \"word: $word\"\ndone\n```\n\n```\n### Or, remove the \"useless use\
    \ of cat\"\nfor word in $(< file); do\n  echo \"word: $word\"\ndone\n```\n\n#\
    \ Fiddling with $IFS for Fun and Profit, to Read Files\n\n$IFS is the “internal\
    \ field separator,” used in all word splitting. The default is <space><tab><newline>,\
    \ or IFS='$' \\t\\n' using the $' ' ANSI C quoting mechanism, and this is fundamental\
    \ to bash idioms. If you change $IFS without really understanding what you’re\
    \ doing, odd things may happen. In particular, the first character of $IFS, which\
    \ is space by default, is also used in word expansion, and if you change that,\
    \ chaos may ensue. If you really think you need to change the value of $IFS, either\
    \ do it in a function using local or do it local to the command (see “Local Variables”\
    \ on page 110). Example 9-6 illustrates this.\n\nExample 9-6. Changing IFS for\
    \ read example: code\n\n```\n#!/usr/bin/env bash\n# fiddle-ifs.sh: Fiddling with\
    \ $IFS for fun and profit, to read files\n# Original Author & date: _bash Idioms_\
    \ 2022\n# bash Idioms filename: examples/ch09/fiddle-ifs.sh\n#_______________________________________________________________\n\
    ```"

  md: "+   - `-type f` means *type* of ordinary file, so it will ignore directories,\
    \ links, etc.\n+   - `-name` is obvious but case sensitive. You can use `-iname`\
    \ for case insensitive if needed.\n\n# Embedded Documentation\n\nProgrammers have\
    \ a reputation for not liking to write or update documentation. Sometimes that’s\
    \ true, and sometimes you have programmers like, well, us. But clearly, the more\
    \ friction involved in writing or updating documentation, the less likely it is\
    \ to happen. Your team’s definition of friction and how to reduce it will vary,\
    \ but one possible way to help is to embed the documentation in the code. Various\
    \ languages have found different ways to do that, and you can do it in bash too.\n\
    \nYou can always have comments, and we’ve shown some ways to use comments as part\
    \ of usage or help documentation (see “HELP!” on page 79). And it’s easy enough\
    \ to have documentation next to your code, say myscript.sh and myscript.asciidoc.\
    \ But you can embed real documentation, in wiki or markup language, inside the\
    \ same file as your code, as shown in Example 10-18.\n\nNote that this example\
    \ is a mishmash of Perl POD (Plain Old Documentation) and generic markup; you\
    \ should normally pick just one. POD is old and feels very clunky compared to\
    \ Markdown, Textile, etc., but it has some nice conversion tools, especially for\
    \ man pages, and may still be a good fit if you use Perl and/or those tools. For\
    \ other markup, Pandoc is a great converter—for example, pandoc README.md > /tmp/README.html\
    \ && firefox file:///tmp/README.html.\n\nBe sure to read the example or output\
    \ because we’ve, well, embedded some more discussion and tips. Also, the callouts\
    \ will look off and out of order in the source code, because they only make sense\
    \ in the final output. Just keep reading.\n\nExample 10-18. bash embedded documentation\
    \ example: code\n\n```\n#!/usr/bin/env bash\n# embedded-docs.sh: Example of bash\
    \ code with various kinds of embedded docs\n# Original Author & date: _bash Idioms_\
    \ 2022\n# bash Idioms filename: examples/ch10/embedded-docs.sh\n# ----------------------------------------------------------------------------\n\
    # Does not work on Zsh 5.4.2!\n\n[[ \"$1\" == '--emit-docs' ]] && {\n  # Use the\
    \ Perl \"range\" operator to print only the lines BETWEEN the bash\n  # here-document\
    \ \"DOCS\" markers, excluding when we talk about this code\n  # below in the docs\
    \ themselves. See the output for more.\n  perl -ne \"s/^\\t+//; print if m/DOCS'?\\\
    $/ .. m/^\\s*'?DOCS'?\\$/ \\\n    and not m/DOCS'?\\$/;\" $0\n  exit 0\n}\n```"

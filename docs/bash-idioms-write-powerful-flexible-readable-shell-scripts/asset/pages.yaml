    You might want to take a look at “Unofficial bash Strict Mode” on page 96, which
    could unmask subtle problems when added later or prevent them when added at write
    time.


    ![](img/553ffa1bc15093729b691f706befc0ac_136_0.png)


    # Dumping Your Environment


    It is often helpful to log or dump your environment when running from cron, continuous
    integration, or other circumstances where the environment may change or differ
    from what you expect. You will see the external env or printenv used for this,
    but the bash internal set command will give you much more information, including
    functions. On the other hand, it’s a lot noisier, so check them all out and decide
    which is best for you.'

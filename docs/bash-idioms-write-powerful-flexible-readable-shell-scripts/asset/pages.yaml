- pgno: 155
  md: "functions. If they are very common, like logging or emailing, consider creating\
    \ a “library,” that is, a single common file you can source as needed.\n\n+  \
    \ - Prefix “library” functions with “_”, like _Log or some other prefix.\n+  \
    \ - Consider using “filler” words for readability in arguments if it makes sense,\
    \ then define them as `local junk1=\"$2\" # Unused filler`, e.g.:  \n+     — `_Create_File_If_Needed\
    \ \"/path/to/$file\" containing important value`\n+   - Do use the `local` builtin\
    \ when setting variables in functions.  \n+     — But be aware that successfully\
    \ being “local,” it will mask a failed return code, so declare and assign it on\
    \ separate lines if using command substitution, like `local my_input` and then\
    \ `my_input=\"$(some-command)\"`.\n+   - For any function longer than about 25\
    \ lines, close it with `} # End of function MyFuncName` to make it easier to track\
    \ where you are in the code on your screen. For functions shorter than 25 lines,\
    \ this is optional but encouraged unless it gets too cluttered.\n+   - Don’t use\
    \ a `main` function; it’s almost always just an unnecessary layer.  \n+     —\
    \ That said, using “main” makes sense to Python and C programmers, or if the code\
    \ is also used as a library, and it may be required if you do a lot of unit testing.\n\
    +   - Consider using two blank lines and a main separator above the main section,\
    \ especially when you have a lot of functions and definitions at the top.\n\n\
    # Quoting\n\n+   - Do put quotes around variables and strings because it makes\
    \ them stand out a little and clarifies your intent.  \n+     — Unless it gets\
    \ too cluttered.  \n+     — Or they need to be unquoted for expansion.\n+   -\
    \ Don’t quote integers.\n+   - Use single quotes unless interpolation is required.\n\
    +   - Don’t use `${var}` unless needed; it’s too cluttered.  \n+     — But that\
    \ is needed sometimes, like `${variable}_suffix` or `${being_lower_cased,,}`.\n\
    +   - Do quote command substitutions, like `var=\"$(command)\"`.\n+   - *Always*\
    \ quote both sides of any test statement, like `[[ \"$foo\" == 'bar' ]]`.  \n\
    +     — Unless one side is an integer."

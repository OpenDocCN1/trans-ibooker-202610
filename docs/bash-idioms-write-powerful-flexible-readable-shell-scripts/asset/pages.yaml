  md: "You might also notice that these function calls are not returning a value that\
    \ can be assigned to another variable. More on that in the following sections.\
    \ First, let’s look at how we define functions and their parameters.\n\n# Defining\
    \ Functions\n\nThe syntax for bash includes some optional elements. Let’s say,\
    \ for example, that you want to define a function called helper. Here are three\
    \ different ways to begin that definition:\n\n```\nfunction Helper ()\nfunction\
    \ Helper\nHelper ()\n```\n\nAll three are equivalent. The reserved word function\
    \ is optional, but if you do use it, then the parentheses are optional. We prefer\
    \ to use the simple two-word version: function and then the name of our function.\
    \ Not only does it clearly state what we’re doing, but it reminds us that, unlike\
    \ other languages, our functions parameters are not put in parentheses. And it’s\
    \ quite easy to grep for.\n\nThe body of the function follows this defining of\
    \ the function’s name, usually enclosed in braces:\n\n```\nfunction Say_So {\n\
    \    echo 'Here we are in the function named Say_So'\n}\n```\n\n# Function Parameters\n\
    \nHow are parameters defined for a bash function? They are not. Instead, when\
    \ you call a bash function (described in the following paragraphs), you can supply\
    \ as many parameters as you want. Typically you have a certain fixed set of parameters\
    \ in mind and will write your function accordingly, but there’s nothing special\
    \ that you would need to do to have a variable number of arguments.\n\nThe arguments,\
    \ however many are provided, are available to the function as $1, $2, $3, and\
    \ so forth, using the same syntax used for parameters to the bash script itself.\
    \ Since these parameters don’t have names but only their order number, it is a\
    \ very good idea to put a comment at the head of the function to document what\
    \ parameters the function expects and in what order. It is also quite common to\
    \ see, in the first few lines of a script, that these positional parameters are\
    \ assigned to variables with more descriptive names.\n\nSince the function’s parameters\
    \ are using the $1, etc., names, you may be wondering what happens to the shell\
    \ script’s parameters that are referenced using that same syntax. Calling the\
    \ function doesn’t change the script’s parameters; the script’s"

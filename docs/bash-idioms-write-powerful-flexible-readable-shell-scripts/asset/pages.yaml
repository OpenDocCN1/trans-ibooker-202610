- pgno: 127
  md: "# Handling JSON with jq\n\njq is not bash, but we want to cover this because\
    \ JSON is very common, especially when working with cloud infrastructure, and\
    \ we’ve seen some awful code out there using tools like awk, grep, and sed to\
    \ try to handle parsing JSON. Use jq instead, if possible.\n\n![](img/553ffa1bc15093729b691f706befc0ac_127_0.png)\n\
    \n# jq Is Not Always There\n\nUnfortunately, despite how common JSON has become,\
    \ jq is not always installed by default the way awk, grep, and sed are. It is\
    \ not included with Git Bash for Windows either, which does include awk, sed,\
    \ cut, grep, tr, etc.\n\nSometimes you can dodge the bullet. For example, for\
    \ AWS you can use --output=text, then use the usual tools. Otherwise, you can\
    \ install jq in your default builds or find hack-arounds using Python or other\
    \ tools, which is outside the scope of this book.\n\nThe source code for this\
    \ book includes an atlas.json file, so we can use that for some examples. If we’d\
    \ like to find the title of this book, we can do that:\n\n```\n$ jq '.title' atlas.json\n\
    \"bash Idioms\"\n$ jq -r '.title' atlas.json  # \"Raw\" mode, without the quotes\n\
    bash Idioms\n\n### But `grep` also works...sort of\n$ grep 'title' atlas.json\n\
    \  \"titlepage.html\",\n  \"title\": \"bash Idioms\",\n```\n\nWhat if we want\
    \ to know if syntax highlighting is enabled in various output formats? That’s\
    \ trickier with grep but simple with jq:\n\n```\n### What do we have?\n$ jq '.formats\
    \ | keys' atlas.json\n[\n  \"epub\",\n  \"html\",\n  \"mobi\",\n  \"pdf\"\n]\n\
    \n### Bad; this has no context and is useless\n$ grep 'syntaxhighlighting' atlas.json\n\
    \  \"syntaxhighlighting\": true,\n  \"syntaxhighlighting\": true,\n  \"syntaxhighlighting\"\
    : true,\n  \"syntaxhighlighting\": true,\n```"

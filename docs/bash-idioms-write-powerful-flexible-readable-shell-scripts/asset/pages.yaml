- pgno: 107
  md: "See also:\n\n+   - “Local Variables” on page 110\n+   - “Reading Files” on\
    \ page 85\n+   - “ANSI-C Quoting” on the bash man page\n\n# Pretend Files\n\n\
    We all know that UNIX, Linux, and (of course) bash expect everything to be a file,\
    \ right? Everything is a file. That is The Way. But what happens if you need to\
    \ process only part of the file? Perhaps you have a number of nodes that report\
    \ statistics every time period, and you want to diff them to see if any nodes\
    \ have appeared or dropped. Let’s assume the files are tab delimited and have\
    \ multiple records from each node with the node name as the first field, but you\
    \ aggregate them over an hour, or day, or whatever.\n\nYou could use temp files,\
    \ though that is pretty tedious:\n\n```\ncut -f1 /path/to/previous-report.log\
    \ | sort -u > /tmp/previous-report.log\ncut -f1 /path/to/current-report.log |\
    \ sort -u > /tmp/current-report.log\ndiff /tmp/previous-report.log /tmp/current-report.log\n\
    rm /tmp/previous-report.log /tmp/current-report.log\n```\n\nInstead you can use\
    \ these “pretend files” to do the same thing:\n\n```\ndiff <(cut -f1 /path/to/previous-report.log\
    \ | sort -u) \\\n    <(cut -f1 /path/to/current-report.log | sort -u)\n```\n\n\
    OK, it’s really called process substitution (illustrated in Example 9-8), but\
    \ we thought pretend files sounded like more fun.\n\nExample 9-8. Simple process\
    \ substitution example\n\n```\n$ head *report.log\n==> current-report.log <==\n\
    always-talking\nalways-talking\nalways-talking\nalways-talking\n\n==> previous-report.log\
    \ <==\nalways-talking\ngoing-away\nalways-talking\ngoing-away\nalways-talking\n\
    going-away\nalways-talking\ngoing-away\n```"
  merge: -1

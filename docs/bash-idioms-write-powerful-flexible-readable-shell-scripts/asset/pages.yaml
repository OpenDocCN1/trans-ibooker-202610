  md: "```\n$DEBUG 'Example DEBUG message...'\n\necho \"End of $PROGRAM run.\"\n```\n\
    \nWe’ve packed a lot into this example, but you’ve already seen most of it. We’ve\
    \ built on the long arguments example to add help, but we also added a simple\
    \ way to have debug and verbose flags and output. We now have a function for Display_Help\
    \ because we need to call it from at least two places: short- and long-option\
    \ handling. That should be pretty clear.\n\nWe also violated our case..esac style\
    \ guideline for “one-liners” since the exit command makes it a multiline block.\
    \ We could just as easily have expanded it (as we did in the long options section),\
    \ but we’ve gone from one line to four lines for…no gain in clarity and a loss\
    \ of three vertical lines on your screen that might better display more important\
    \ code:\n\n```\nh ) Display_Help ; exit 1 ;;\n# Versus\nh )\n    Display_Help\n\
    \    exit 1\n;;\n```\n\n# Debug and Verbose\n\nIn Example 8-4, we set a colon\
    \ as the default value for the variable VERBOSE. That may seem an odd value, but\
    \ consider the example use of that variable later in the script:\n\n```\n$VERBOSE\
    \ 'Example verbose message...'\n```\n\nIn the default case (if the user does not\
    \ specify verbose mode), then, to execute that line, $VERBOSE is replaced by a\
    \ :; the no-op (no operation) or null command (which does nothing, ignores its\
    \ arguments, and is always true). Thus no message would be printed. But if the\
    \ user invokes the script with a -v or --verbose, then $VERBOSE is replaced with\
    \ an echo, and the line to be executed would now, in effect, be this:\n\n```\n\
    echo 'Example verbose message...'\n```\n\nand the message will be printed for\
    \ the user to see.\n\nThis idiom for conditional messages is simple code that’s\
    \ easy to write, easy to read, and even easy to grep for when writing documentation.\
    \ You can use the same thing for DEBUG as needed."

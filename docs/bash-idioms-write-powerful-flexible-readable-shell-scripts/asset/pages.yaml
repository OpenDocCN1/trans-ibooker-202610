    $ bash seesaw.sh

    SEE = 12

    SAW = X+Y

    SUM = 9+3

    $

    ```


    This shows that you can do arithmetic without the need for double parentheses—but
    we usually avoid this, as it requires that you declare as an integer the variable
    to which you are assigning things. If you forget the declare statement or if you
    assign such an expression to a variable not so declared, you won’t get any error
    message—just an unwanted result.


    # Compound Commands


    You are probably very familiar with seeing a single command on a line by itself
    in a script. You may also be familiar with using a single command in an if statement’s
    condition to see if the command succeeded, and taking action depending on the
    result. If you’ve read Chapter 1, you’ve seen the “no-if” if statement idiom,
    too. Now let’s take a look at the simple one-command if statement, one that looks
    like this:


    ```

    if cd $DIR ; then # Do something ...

    ```


    But what about these:


    ```

    if [ $DIR ]; then # Do something ...

    if [[ $DIR ]]; then # Do something ...

    ```


    Why the brackets in these two lines and not in the first example? Is there a difference?
    What about one versus two brackets; which should you use and when/why?


    Without any brackets, what is happening is the execution of a command (cd in our
    example). The success or failure of that command is returned as, in effect, a
    true or false for the if to use in its decision branching between the then or
    the else (should there be one). In bash, you can put an entire pipeline of commands
    (e.g., cmd | sort | wc ) in an if statement. It is the return status of the last
    command in the pipeline that determines whether the if statement is true or false.
    (And that can mask errors that are very hard to find; see set -o pipefail in “Unofficial
    bash Strict Mode” on page 96.)


    The single bracket syntax is actually also running a command, the shell builtin
    test command. The single left bracket is a shell builtin for the same thing, the
    test command, but with one difference: a required final argument of ]. The double-bracket
    syntax is, technically, a bash keyword, one that indicates a compound command,
    whose behavior is very similar, though not identical, to the single bracket and
    test command.'

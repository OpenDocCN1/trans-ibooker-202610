- pgno: 111
  md: '# Unofficial bash Strict Mode


    Perl has a use strict pragma to “restrict unsafe constructs” that causes a syntax
    check or run time error if you do not declare and initialize variables before
    using them, among other things. The unofficial bash strict mode article makes
    the argument that the following does the same (in spirit) in bash:


    ```

    set -euo pipefail

    IFS=$''\n\t''

    ```


    We don’t quite agree on changing $IFS like that because that will break a lot
    of bash idioms (see “Fiddling with $IFS for Fun and Profit, to Read Files” on
    page 89). The author makes a good argument, but it might be a large effort to
    migrate legacy code for that. The set commands are great, though:


    +   - -e will exit the entire script at the first error.

    +   - -u will exit the entire script if you use an unset variable.

    +   - -o pipefail will fail pipelines if any command, not just the last one, exits
    with nonzero.


    Adding -u will break a lot of existing scripts, but the fixes will be pretty easy,
    and you may find some variable name typos you didn’t know you had, which is the
    whole point. -eo pipefail will probably break less up front, and when that does
    “break” a script, it was probably already broken, but the error was masked and
    these options just unmasked the problem.


    This is definitely worth considering and perhaps adding to your templates and
    style guide.


    See also:


    +   - http://redsymbol.net/articles/unofficial-bash-strict-mode

    +   - help set

    +   - https://perldoc.perl.org/strict


    # Exit Codes


    Unless told otherwise, your bash script will exit with the exit (or return) code
    of the last command run. Sometimes that’s fine, and other times you may need to
    exit earlier after failing a sanity check or for some other condition.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'In bash, zero means *success* and nonzero means failure. This is the opposite
    of many other languages, but it’s this way because there is only one way to succeed
    but many ways to fail, and you might need to represent which way you failed, like:


    ```

    if grep --quiet "$HOSTNAME" /etc/hosts; then ...

    ```


    The bash exit code is only eight bits, so the maximum value is 255, but you want
    your return code values to stay at or below 125 because 126 and above are taken,
    as shown in Table 9-1.


    # Table 9-1. bash exit/return codes


    | Exit/return code | Use/description |

    |---|---|

    | 0 | Success |

    | 1–125 | User-defined failure |

    | 2 | bash builtins incorrect usage |

    | 126 | Command found but not executable |

    | 127 | Command not found |

    | 128–255 | Command exited with signal N-128 |


    See also the GNU documentation about exit status.


    The command to exit the entire script with an “exit code” is, wait for it, exit
    n. The command to return from a function is, again, wait for it, return n, where
    “n” is an optional argument as defined previously. Remember that return returns
    an exit code, not values. The “n” can be any shell expression like 5 or $val or
    something more complex. Remember if “n” is not given, status is that of the last
    command run.


    See also our discussion about exit 0 or exit 1 for help and usage in “HELP!” on
    page 79.


    # It’s a Trap!


    The trap builtin (help trap) allows you to execute code when the script receives
    a signal, which includes when it exits. That is a great place to have “cleanup”
    code that will work even if someone CTRL-Cs (but not if they kill -9) the script.
    You can also use it to run debugging code, but for this simple case, just use
    set -x or run under bash -x. Run trap -l to list all the signals your system supports
    or trap -p <signal> to show the trap commands associated with that signal.


    The typical use of trap is to clean up after your script, as noted. The syntax
    is trap [-lp] [[arg] signal_spec ...], and while that arg can be self-contained
    code, it’s probably cleaner to just define and then call a function instead. That
    looks something like Example 9-12 (output shown in Example 9-13).'
  merge: -1
  img_proc: true
- pgno: 113
  md: "# Example 9-12. Trivial trap example: code\n\n```\n#!/usr/bin/env bash\n# trivial_trap.sh:\
    \ Trivial bash trap example\n# Original Author & date: _bash Idioms_ 2022\n# bash\
    \ Idioms filename: examples/ch09/trivial_trap.sh\n# --------------------------------------------------------------------------------\n\
    # Does not work on Zsh 5.4.2!\n\nfunction Cleanup {\n    echo \"$FUNCNAME was\
    \ triggered!  Cleaning up...\"\n}\n\necho \"Starting script $0...\"\n\necho 'Setting\
    \ the trap...'\n# Will call Cleanup on any of these 6 signals\ntrap Cleanup ABRT\
    \ EXIT HUP INT QUIT TERM\n\necho 'About to exit...'\n```\n\n# Example 9-13. Trivial\
    \ trap example: output\n\n```\nStarting script examples/ch09/trivial_trap.sh...\n\
    Setting the trap...\nAbout to exit...\nCleanup was triggered!  Cleaning up...\n\
    ```\n\nSee also the GNU documentation about trap and “bash Debugging” on page\
    \ 120.\n\n# Here-Documents and Here-Strings\n\nOther languages have similar constructs,\
    \ like C’s /* ... */ , and Python’s ''' ... ''' , but bash has some interesting\
    \ idiomatic features for here-documents and here-strings. We used a here-document\
    \ in Example 8-3, but there is more to talk about and decode.\n\nHere-documents\
    \ are used to contain and often display blocks of text without needing a lot of\
    \ delimiters and commands.\n\nHere-document syntax is [fd]<<[-][\"'\"]word[\"\
    '\"] , where “fd” is an optional (and rarely used) file descriptor, - is a flag\
    \ that means “strip leading tabs but not spaces,” and optional quotes mean “do\
    \ not interpolate the contents.” The word itself is not subject to parameter,\
    \ variable, arithmetic, or filename expansion, or command substitution. Among\
    \ other things, that means it can’t be a variable. If any part of word is quoted,\
    \ interpolation is not performed on the document. We recommend using only single\
    \ quotes since they prevent interpolation elsewhere in bash so the meaning is\
    \ consistent, unlike using double quotes."
  merge: -1
  img_proc: true
- pgno: 114
  md: "In practice, using - means you can indent the here-document in your code (but\
    \ only using tabs) while not having that indent present in the document itself\
    \ later, and not quoting means you can use variables in it. As we saw in Example\
    \ 8-3, that’s great for displaying a usage message that includes the name and\
    \ path of the script, without a lot of echo or printf lines and quotes. We also\
    \ use it later for “Embedded Documentation” on page 115.\n\nHere-strings look\
    \ like [fd]<<word, which seems similar, but in this case the word itself is subject\
    \ to parameter, variable, and arithmetic expansion; command substitution; and\
    \ quote removal. They are essentially a simpler here-document without a delimiter\
    \ that results in a string, with a newline appended.\n\nSee the GNU documentation\
    \ on here-documents and here-strings.\n\n# Are We Interactive?\n\nSometimes your\
    \ code needs to know whether or not it is running in an interactive session. It\
    \ may need to know because it will change behavior, like asking for input, or\
    \ perhaps you only want to set certain configuration options for interactive shells.\n\
    \nThe GNU documentation on interactive shells says to use one of the following,\
    \ so you will see these or variations a lot:\n\n```\ncase \"$ -\" in\n  *i*) echo\
    \ This shell is interactive ;;\n  *)   echo This shell is not interactive ;;\n\
    esac\n```\n\nor:\n\n```\nif [ -z \"$PS1\" ]; then\n  echo This shell is not interactive\n\
    else\n  echo This shell is interactive\nfi\n```\n\nYou can also consider the -t\
    \ FD test, which is true if the file descriptor is opened on a terminal. If you\
    \ do not specify a file descriptor, 0 (STDIN) is used. You can combine that with\
    \ another test, say for bash itself, such as:\n\n```\n# Only if bash in a terminal!\n\
    if [ -t 1 -a -n \"$BASH_VERSION\" ]; then\n  echo 'bash in a terminal'\nelse\n\
    \  echo 'NOT bash in a terminal'\nfi\n```"
  merge: -1
  img_proc: true
- pgno: 115
  md: "or:\n\n```\n# Only if *interactive* bash in a terminal!\nif [ -t 1 -a -n \"\
    $PS1\" -a -n \"SBASH_VERSION\" ]; then\n  echo 'Interactive bash in a terminal'\n\
    else\n  echo 'NOT interactive bash in a terminal'\nfi\n```\n\nNote that we deliberately\
    \ used [] (test) instead of the [[]] (bash conditional) because part of the point\
    \ is that this code might run on something that is not bash and thus does not\
    \ support [[]] (e.g., dash).\n\n# Summary\n\nThis chapter is about the idioms\
    \ that sometimes aren’t pretty that you need to know anyway. There are a lot of\
    \ ways to work with files in bash, often involving redirection and/or pipelines,\
    \ so we’ve shown some typical bashy patterns. Bash scripts are also files, so\
    \ we talked about the magic incantation to make the file into an executable script\
    \ or library, how to exit out and clean up, and other useful idioms. And while\
    \ “here-documents” aren’t exactly files, they often take the place of a separate\
    \ file of text, or a files-within-a-file, and we’ve used them elsewhere, so here\
    \ they are."

- pgno: 108
  md: "```\n$ diff -u <(cut -f1 previous-report.log | sort -u) \\\n<(cut -f1 current-report.log\
    \ | sort -u)\n--- /dev/fd/63 2022-01-09 20:01:37.857658587 -0500\n+++ /dev/fd/62\
    \ 2022-01-09 20:01:37.857658587 -0500\n@@ -1,2 +1 @@\nalways-talking\n-going-away\n\
    ```\n\n# Drop-in Directories\n\nAn idiom that you see in a lot of different contexts\
    \ is a directory into which you can add or remove a file to achieve some effect.\
    \ This is very handy for Linux distributions that use package management systems\
    \ like RPM (Red Hat Package Manager) or Debian APT (Advanced Package Tool) because\
    \ a package can add a file on install or remove a file on uninstall without having\
    \ to programmatically edit files. /etc/cron.d/ is a perfect example; packages\
    \ can easily add cron jobs when installed and remove those jobs when uninstalled\
    \ and not affect anything else.\n\nWe’re big fans of this technique for configuration\
    \ files, if supported. For example, you can have an /etc/syslog-ng/syslog-ng.conf\
    \ file containing @include \"/etc/syslog-ng/syslog-ng.local.d\", then you can\
    \ drop files into /etc/syslog-ng/syslog-ng.local.d/ to adjust the configuration\
    \ as needed for a particular node.\n\nIt’s very easy to do that in your bash code\
    \ as well (Example 9-9).\n\nExample 9-9. Include drop-in files\n\n```\n# Source\
    \ local overrides IF any exist AND are executable\nfor config in /etc/myscript.cfg.d/*;\
    \ do\n  # Override files MUST be EXECUTABLE or they will be ignored, which makes\n\
    \  # it easy to disable them.\n  [ -x \"$config\" ] && source \"$config\"\n  #\
    \ Or change `-x` to `-r` to use readable instead of executable\ndone\n```\n\n\
    This idea builds on the “Wrapper Scripts” on page 23, so you can build simple,\
    \ extensible, and yet powerful tools for yourself or your users. You write a simple\
    \ skeleton script with some logic to look an “action” command up in a directory,\
    \ and some glue code to pull those commands together and provide usage or help.\
    \ You then add a “template” for new modules or actions, and you or your users\
    \ just copy the template and fill in the details to easily add a new feature."

    \    echo \"$arg\"\n  done\n}\n\nTell_All 47 tree /tmp\n```\n\nWhen that script\
    \ is run, here is what the output looks like:\n\n```\nYou called Tell_All\nThe\
    \ 3 args supplied are:\n47\ntree\n/tmp\n```\n\n# Function Return Values\n\nHere,\
    \ too, bash functions are more like scripts than they are like your typical computer\
    \ language functions. The return value from bash functions is really just an exit\
    \ status, the value that you can check using $? after calling the function. Just\
    \ as you might check $? after calling another script or an executable, so, too,\

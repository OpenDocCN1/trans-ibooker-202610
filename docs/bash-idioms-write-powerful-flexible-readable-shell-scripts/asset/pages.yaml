    +   - Use [[ expression ]] && block or [[ expression ]] || block when it is simple\
    \ and readable to do so. Do not use [[ expression ]] && block || block because\
    \ that doesn’t do what you think it does; use if .. then .. (elif ..) else ..\
    \ fi for that.\n+   - Consider using “Unofficial bash Strict Mode” (see “Unofficial\
    \ bash Strict Mode” on page 96).\n+     — set -euo pipefail will prevent or unmask\
    \ many simple errors.\n+     — Watch out for this one, and use it carefully (if\

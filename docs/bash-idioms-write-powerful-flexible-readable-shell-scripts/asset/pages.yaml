    Up to now, none of these substitutions have modified the underlying value of the\
    \ variable. There is, however, one that does. If we write ${VAR:=value}, it will\
    \ act much like our preceding default value idiom, but with one big exception.\
    \ If VAR is empty or unset, it will assign that value to the variable (hence,\
    \ the equal sign) and return that value. (If VAR is already set, it will simply\
    \ return its existing value.) Note, however, that this assigning of a value does\
    \ not work for positional parameters (like $1), which is why you don’t see it\
    \ used nearly as often.\n\n# $RANDOM\n\nBash has a very handy $RANDOM variable.\
    \ As the “Bash Variables” section in the Bash Reference Manual says:\n\n> Each\
    \ time this parameter is referenced, a random integer between 0 and 32767 is generated.\
    \ Assigning a value to this variable seeds the random number generator.\n\nWhile\
    \ this is not suitable for cryptographic functions, it’s useful for rolling the\
    \ dice or adding a bit of noise into otherwise too-predictable operations. We\
    \ use this later in “A Simple Word Count Example” on page 69.\n\nAs shown in Example\
    \ 4-3, you can pick a random element out of a list.\n\nExample 4-3. Pick a random\

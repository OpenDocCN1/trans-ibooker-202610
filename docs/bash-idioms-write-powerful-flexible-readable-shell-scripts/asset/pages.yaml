- pgno: 126
  md: '③ Instead of beeping and just sitting there when you hit TAB and the completion
    is ambiguous, start cycling through the options to complete.


    ④ Ignore case in completions for filenames and commands.


    ⑤ In saving your history, erasedups removes all previous lines matching your current
    line before saving history. ignoredups prevents saving previous duplicate lines,
    and ignorespace prevents commands that start with a leading space from being saved
    in your history. The end result of this is your history is much cleaner, because
    you don’t have duplication, but you also lose any sense of the order and sequence
    of commands, since duplicate commands are removed or never saved. You can also
    omit commands from being saved in your history, say if they contain sensitive
    data, but note that they will still be visible in the process list!


    ⑥ The same as previous, for backward compatibility with really old bash, just
    in case.


    # Using logger from bash


    The logger tool (man logger) is great for sending logs right into syslog, but
    we would argue that it has a bug, in that the -t or --tag argument is not mandatory,
    and the default is just the username. We recommend what is shown in Example 10-14.


    Example 10-14. logger tags


    ```

    logger --tag "$0[$$]" <msg>

    logger --tag "$PROGRAM[$$]" <msg>

    logger --tag "${0##*/}[$$]" <msg>

    ```


    ① The simplest case is using $0 for the name of the script and $$ for its PID.
    The problem with $0 is that it will vary depending on how the script was called,
    and that’s both noisy and inconsistent. We’d rather use the basename.


    ② If you are already using something like $PROGRAM to get the basename (Example
    8-3), then use that with logger also.


    ③ If you have not set something like $PROGRAM to the basename of your script,
    you can do it right in the logger tag. That’s starting to get a little obscure,
    but it will work. Try echo "${0##*/}[$$]" to see, but it’s a bit less interesting
    from the command line.


    If you are doing your own logging, see printf and time in “Getting or Using the
    Date and Time” on page 57.'

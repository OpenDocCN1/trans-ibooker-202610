    # bash Linter


    Using a linter instead of or in addition to a style guide can also be handy. To
    be honest, we don’t use one, but we thought we should cover it. The one we know
    about is shellcheck, and we have mixed feelings about the results; it’s especially
    picky about quoting, and we don’t always agree with its suggestions on quoting
    or in general, but those things are somewhat adjustable. That said, it’s still
    very cool, and worth checking out.


    +   - bash linter: https://www.shellcheck.net

    +     - https://github.com/koalaman/shellcheck (Haskell)

    +     - History: https://www.vidarholen.net/contents/blog/?p=859

    +     - Checks: https://github.com/koalaman/shellcheck/wiki/Checks

    +     - Tweaking: https://github.com/koalaman/shellcheck/wiki/Directive

    +     - Ignoring errors: https://github.com/koalaman/shellcheck/wiki/Ignore

    +     - Note, Eol (2020) CentOS-6 is too old: https://github.com/koalaman/shellcheck/wiki/CentOS6


    If you install through your package system, remember that the version may be quite
    old. The Linux version is a tarball containing a single compiled binary, though,
    so it’s easy to drop a current version in your path somewhere.'

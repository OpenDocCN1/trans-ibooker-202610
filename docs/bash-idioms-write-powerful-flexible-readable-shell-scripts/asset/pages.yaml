- pgno: 100
  md: "# Files and More\n\nWhat makes a plain old file a shell script, and how do\
    \ you emit exit codes? How do you read files? We’ll talk about all that—and more—in\
    \ this chapter.\n\n# Reading Files\n\nThere are three main idiomatic ways to read\
    \ files into a bash script. Some of them “slurp” the entire file into memory,\
    \ and others work one line at a time.\n\n# read\n\nWe’ve already used read for\
    \ processing key/value pairs in Chapter 2, and we’ll see it again in “Getting\
    \ User Input” on page 104, but the other major use is reading files and parsing\
    \ input one line at a time:\n\n```\n$ grep 'nobody' /etc/passwd | read -d':' user\
    \ shadow uid gid gecos home shell\n\n$ echo \"$user | $shadow | $uid | $gid |\
    \ $gecos | $home | $shell\"\n```\n\nWait, what happened? Where’s my data? Well,\
    \ that’s a gotcha—it went into the subshell created by the pipe (|), and it never\
    \ came out. What about this?\n\n```\n$ grep 'nobody' /etc/passwd | { \\\n    read\
    \ -d':' user shadow uid gid gecos home shell; \\\n    echo \"$user | $shadow |\
    \ $uid | $gid | $gecos | $home | $shell\" \\\n}\nnobody | | | | | |\n```"
  merge: -1
  img_proc: true
- pgno: 101
  md: "That’s slightly better, but where’s the rest of it? Well, -d is the end-of-line\
    \ delimiter, not the field separator ($IFS). One more try:\n\n```\n$ grep 'ˆnobody'\
    \ /etc/passwd | { \\\n  read -d':' user shadow uid gid gecos home shell; \\\n\
    \  echo \"$user | $shadow | $uid | $gid | $gecos | $home | $shell\" \\\n}\nnobody\
    \ | x | 65534 | 65534 | nobody | /nonexistent | /usr/sbin/nologin\n```\n\nSee\
    \ also “Fiddling with $IFS for Fun and Profit, to Read Files” on page 89.\n\n\
    ![](img/553ffa1bc15093729b691f706befc0ac_101_0.png)\n\n# lastpipe\n\nIf you are\
    \ running bash 4+, you can set shopt -s lastpipe, which will run the last command\
    \ of a pipeline in the current shell so your script can see the environment. Note\
    \ that this only works if job control is disabled, which is the default in scripts\
    \ but not in interactive sessions. You can disable job control using set +m, but\
    \ that disables CTRL-C, CTRL-Z, fg, and bg, so we don’t recommend doing that.\n\
    \n# mapfile\n\nmapfile is also known as readarray, but they are the same command.\
    \ Added in bash v4, mapfile reads a file into an array (list) and has options\
    \ to read only -n count lines at a time, skip -s count lines, display a progress\
    \ indicator (-c/-C), and more. This is much easier to use than other methods.\n\
    \nThe simple use is, well, simple, and it “slurps” the entire file into memory,\
    \ as shown in Example 9-1.\n\nExample 9-1. Simple mapfile\n\n```\nmapfile -t nodes\
    \ < /path/to/list/of/hosts  # -t removes newlines\n```\n\n```\n# Loop around the\
    \ nodes\nfor node in ${nodes[@]}; do\n  ssh $node 'echo -e \"$HOSTNAME:\\t$(uptime)\"\
    '\ndone\n```\n\nUsing -n is a bit more complicated, because while mapfile will\
    \ continue to read nothing, so you have to check to see if it actually got data\
    \ (${#nodes[@]} is nonzero) or you’ll create an infinite loop (Example 9-2)."
  merge: -1
  img_proc: true
- pgno: 102
  md: "# Example 9-2. Batch mapfile example\n\n```\nBATCH=10\n# While we're reading\
    \ data...   && there is still data there!\nwhile mapfile -t -n $BATCH nodes &&\
    \ (( ${#nodes[@]} )); do\n    for node in ${nodes[@]}; do\n        ssh $node 'echo\
    \ -e \"$HOSTNAME:\\t$(uptime)\"'\n    done\ndone < /path/to/list/of/hosts\n```\n\
    \nOf course, you can get fancier, and add some runtime user feedback. You might\
    \ also need to throttle your process for various reasons, so you can do something\
    \ like the code in Example 9-3.\n\n# Example 9-3. Fancy mapfile example: code\n\
    \n```\n#!/usr/bin/env bash\n# fancy_mapfile.sh: Fancy `mapfile` example\n# Original\
    \ Author & date: _bash Idioms_ 2022\n# bash Idioms filename: examples/ch09/fancy_mapfile.sh\n\
    # ----------------------------------------------------------------------------\n\
    # Does not work on Zsh 5.4.2!\n\nHOSTS_FILE='/tmp/nodes.txt'\n\n# Create test\
    \ file\n> $HOSTS_FILE\nfor n in node{0..9}; do echo \"$n\" >> $HOSTS_FILE; done\n\
    \n### ADJUSTABLE VARIABLES\n#BATCH_SIZE=0  # Do the entire file at once (default);\
    \ watch out for memory\nBATCH_SIZE=4\nSLEEP_SECS_PER_NODE=1     # Can set to 0\n\
    SLEEP_SECS_PER_BATCH=1    # Set to zero if `BATCH_SIZE=0`!\n\n# Display runtime\
    \ feedback to STDERR (so STDOUT can go into `tee` or a file)\nnode_count=\"$(cat\
    \ $HOSTS_FILE | wc -l)\"\nbatch_count=\"$(( node_count / BATCH_SIZE ))\"\necho\
    \ '' 1>&2\necho \"Nodes to process:          $node_count\" 1>&2\necho \"Batch\
    \ size and count:      $BATCH_SIZE / $batch_count\" 1>&2\necho \"Sleep seconds\
    \ per node:    $SLEEP_SECS_PER_NODE\" 1>&2\necho \"Sleep seconds per batch:  \
    \ $SLEEP_SECS_PER_BATCH\" 1>&2\necho '' 1>&2\n\nnode_counter=0\nbatch_counter=0\n\
    # While we're reading data...   && there is still data in $HOSTS_FILE\nwhile mapfile\
    \ -t -n $BATCH_SIZE nodes && (( ${#nodes[@]} )); do\n    for node in ${nodes[@]};\
    \ do\n        echo \"node $(( node_counter++ )): $node\"\n```"

- pgno: 88
  md: '# Arguing


    Some scripts are meant to do a single task; they need no variations. Many others,
    though, take arguments: one or more filenames, or options to provide variations
    on their behavior. Once you have more than a single option (or maybe two), you
    need to parse those arguments in an orderly fashion to be sure that you’ve covered
    all the possible ways that a user of that script might order those arguments.
    And come to think of it, even that single task script probably wants -h (or even
    --help). Let’s take a look at how to parse those arguments and still have a readable,
    maintainable script.


    # Your First Argument


    If your script just wants a single parameter, you can reference that in your script
    as $1. You might have statements like echo $1 or cat $1 as part of your script.
    We don’t recommend using $1 throughout your script as it doesn’t tell the reader
    anything about this parameter. It’s better, for readability’s sake, if you assign
    this parameter to a variable with an informative name. If the parameter is meant
    to be a filename, then choose a variable name like in_file or pathname or similar
    and assign it right away, early in the script. As we saw in “Default Values” on
    page 38, we can even supply a default value:


    ```

    filename=${1:-favorite.txt}    # Or maybe use /dev/null as the default?

    ```


    If the user doesn’t supply any parameter when invoking your script, $1 will be
    unset. In the preceding example, the shell will assign favorite.txt as the value
    when parameter one is unset.


    Need a second or third parameter or more? As you might have guessed, those would
    be $2, $3, and so on. They would be unset if no such parameter is supplied when
    invoking the script.'
  merge: -1
  img_proc: true
- pgno: 89
  md: "But what if you don’t have good default values? Or what if you don’t want to\
    \ proceed when the user doesn’t supply the correct number of arguments? Your script\
    \ can check to make sure that the user has supplied the correct number of arguments\
    \ by checking the $# variable. It holds the number of arguments supplied. If $#\
    \ is 0, then the user invoked the script with no arguments. If $# is 1 but you\
    \ wanted two arguments, then don’t proceed. Issue an error message and exit (see\
    \ “Exit Codes” on page 96):\n\n```\nif (($# != 2)); then\n    echo \"usage: $0\
    \ file1 file2\"    # $0 is the script's name, as invoked\n    exit\nfi\n```\n\n\
    We’re only looking here at how to know that you’ve got the right number of arguments\
    \ to your script. How you use all these arguments within the script is quite varied.\
    \ We looked at some of those in Chapter 2.\n\nTraditionally, when you wanted a\
    \ list of all the arguments, you might have used $* to write something like echo\
    \ $*, which works fine for this simple output. But once spaces were allowed as\
    \ part of a filename, a slightly different syntax became the better choice.\n\n\
    Quotes are needed around a filename with embedded spaces in the name (e.g., “my\
    \ file”), otherwise the shell sees that as two separate words. To refer to all\
    \ the arguments to a script and have each one quoted, we use \"$@\" (string) or\
    \ \"${@}\" (list). If we use \"$*\", that will give us one large quoted string\
    \ containing all the arguments. For example, if we invoke a script like this:\n\
    \n```\nmyscript file1.dat \"alt data\" \"local data\" summary.txt\n```\n\nthen\
    \ \"$*\" would result in the single value “file1.dat alt data local data summary.txt,”\
    \ whereas \"$@\" would result in four separate words: file1.dat \"alt data\" \"\
    local data\" summary.txt.\n\nYes, we know we talked about this in “Quotes and\
    \ Spaces” on page 14 and then kept harping on it again in Chapter 7. It’s just\
    \ tricky and bears repeating.\n\n# Having Options\n\nOptions are ways to vary\
    \ (slightly?) the behavior of a command. The classic (idiomatic?) way to specify\
    \ options to a Unix or Linux command is with a single letter preceded by a -,\
    \ called a minus, a dash, or a tack. For example, to have a command produce its\
    \ long-form output, you might specify that with -l. Similarly, to have a command\
    \ run in a more quiet mode (less output), you might specify -q right after the\
    \ command name.\n\nNot every command or script has these options, and not every\
    \ command or script that has, for example, a -q option uses that option to specify\
    \ a “quiet” output format."
  merge: -1
  img_proc: true
- pgno: 90
  md: "It may mean “quick” in another command. It may not be a valid option at all\
    \ in another command. These are conventions based on existing commands—tradition,\
    \ so to speak.\n\nIt is worthwhile adhering to tradition, absent a compelling\
    \ reason to abandon it. Among other reasons, it reduces the learning curve. What\
    \ you learn about running some commands or scripts carries over into other commands.\
    \ It also means that you can use the same technique for parsing options that others\
    \ use.\n\n# Parsing Options\n\nUse the getopts builtin command to parse the options\
    \ to your shell script. It is called repeatedly (usually via a while loop) until\
    \ all the options have been found. It assumes that all the options appear before\
    \ any other arguments. It can recognize separate options (-a -v) as well as options\
    \ that are bunched together (-av). You can specify that an option must provide\
    \ an additional parameter. For example, you may want a -o option to specify an\
    \ output file, so the user would invoke it with -o filename or -ofilename, both\
    \ of which are supported by getopts.\n\nLet’s take a look at Example 8-1, which\
    \ handles these kind of options.\n\nExample 8-1. getopts argument parsing: simple\n\
    \n```\n#!/usr/bin/env bash\n# parseit.sh: Use getopts to parse these arguments\n\
    # Original Author & date: _bash Idioms_ 2022\n# bash Idioms filename: examples/ch08/parseit.sh\n\
    #___________________________________________________________________________\n\
    \nwhile getopts ':ao:v' VAL ; do\n  case $VAL in\n    a ) AMODE=1 ;;\n    o )\
    \ OFILE=\"$OPTARG\" ;;\n    v ) VERBOSE=1 ;;\n    : ) echo \"error: no arg supplied\
    \ to $OPTARG option\" ;;\n    * ) echo \"error: unknown option $OPTARG\"\n   \
    \     echo \"  valid options are: aov\"\n  ;;\n  esac\ndone\nshift $((OPTIND -1))\n\
    ```\n\n① We wrote while getopts because we want to call getopts repeatedly, and\
    \ the getopts command will return true when it finds an option (a dash followed\
    \ by any letter, valid or not) and false when it reaches the end of the options.\
    \ The getopts builtin needs to be given two words. The first is the list of options,\
    \ and"
  merge: -1
  img_proc: true
- pgno: 91
  md: 'the second is the name of the variable into which it will put the option that
    it finds when parsing the command line. It will find only one option each time
    it is invoked, so we call it repeatedly via the while loop. In our example ('':ao:v''),
    we want to support options a, o, and v. The leading colon tells getopts not to
    report error messages but rather to leave that to our script. The colon after
    the o character indicates that the o option has an argument that goes with it.
    VAL is the name of the variable that will be assigned if an option is found.


    2 Once getopts has been called, we can use the case statement to see which option
    was found. (See Chapter 3 for more about the case statement.)


    3 As for error handling, since we’ve asked getopts not to issue error messages,
    we need two cases to handle the errors. The first occurs if there is no argument
    supplied with the -o option. We have told getopts to expect an argument by putting
    the “:” after the o in '':ao:v''. If no argument is given when the script is invoked,
    then bash will set $VAL to be a colon, and it will set $OPTARG to be the character
    whose argument we couldn’t find (in this situation, an o).


    4 Second, if the user supplies an option not in our list of valid options, then
    $VAL will be assigned the value of ''?'' (a question mark character), and it sets
    the shell variable $OPTARG to the option character it didn’t recognize. We handle
    this with the wildcard pattern (*) in the case statement.


    5 There’s one more important step to take when getopts is done and the while loop
    exits. The getopts builtin keeps track of its location in the command line arguments
    as it parses its way along, looking for options. $OPTIND is where it keeps the
    index of the next argument to be considered. Now that all those arguments have
    been parsed, we add a shift $OPTIND -1 to remove all the option-related arguments
    from further consideration.


    Whether you invoke a script with myscript -a -o xout.txt -v file1 or just myscript
    file1, after the shift has done its work, $1 will thereafter refer to file1 because
    the intervening option arguments have been removed. The script’s arguments are
    now just the remaining (nonoption) arguments.


    # Long Arguments


    For some folks, a single letter isn’t enough. They want full words or even phrases
    to describe the option they are invoking. The getopts builtin supports these,
    too.


    We need to distinguish a long option from several single-letter options strung
    together (e.g., does -last mean -l -a -s -t, or is it a long option, the word
    last?).'

- pgno: 152
  md: '# The bash Idioms Style Guide


    This is a copy of the points in Chapter 11 but without the commentary and examples.
    There’s also a Markdown file in the examples directory so you can download and
    tweak it as desired, then render or include it as needed using pandoc or some
    other tool. Get the code from the book’s GitHub page.


    ![](img/553ffa1bc15093729b691f706befc0ac_152_0.png)


    # The bash Idioms Style Guide Is Not Portable


    This bash Idioms style guide is specifically for bash, so it is not portable to
    POSIX, Bourne, Dash, or other shells. If you need to write for those shells, you
    will need to test and tweak this guide to account for the supported syntax and
    feature of those shells.


    Be especially careful in Docker or other containers where /bin/sh is not bash
    and /bin/bash may not even exist! This applies to Internet of Things and other
    constrained environments such as industrial controllers. See “bash in Containers”
    on page ix and “Shebang!” on page 94.


    # Readability


    Readability of your code is important! Or as Python says, readability counts.
    You only write it once, but you (and others) will probably read it many times.
    Spend the extra few seconds or minutes thinking about the poor clueless person
    trying to read the code next year...it’s very likely to be you. There’s a balance
    and a tension between abstraction (Don’t Repeat Yourself) and readability:


    +   - KISS (Keep It Simple, Stupid!).

    +   - Readability: don’t be “clever,” be clear.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '+   - Good names are critical!

    +   - *Always use a header.*

    +   - If at all possible, emit something useful for -h, --help, and incorrect
    arguments!

    +     — Prefer using a “here” document (with leading tabs) rather than a bunch
    of echo lines because there’s less friction when you need to update and probably
    rewrap it later.

    +   - Use `source` (instead of ., which is easy to miss seeing and harder to search
    for) to include config files, which should end in .cfg (or .conf or whatever your
    standard is).

    +   - If at all possible, use ISO-8601 dates for everything.

    +   - If at all possible, keep lists of things in alphabetical order; this prevents
    duplication and makes it easier to add or remove items. Examples include IP addresses
    (use GNU `sort -V`), hostnames, packages to install, `case` statements, and contents
    of variables or arrays/lists.

    +   - If possible, use long arguments to commands for readability, e.g., use `diff
    --quiet` instead of `diff -q`, though watch out for portability to non-GNU/Linux
    systems.

    +     — If any options are short or obscure, add comments.

    +     — Strongly consider documenting why you chose or needed the options you
    chose, and even options you considered but didn’t use for some reason.

    +     — Definitely document any options that might seem like a good idea but that
    actually can cause problems, especially if you commonly use them elsewhere.


    # Comments


    +   - *Always use a header.*

    +   - Write your comments for the new person on the team a year from now.

    +   - Comment your functions.

    +   - Do not comment on what you did. Comment on why you did, or did not do, something.

    +     — Exception: comment on what you did when bash itself is obscure.

    +   - Consider adding comments about external program options, especially if they
    are short or obscure.

    +   - Use an initial capital on the first word of the comment, but omit ending
    punctuation unless the comment is more than one sentence.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Names


    +   - Good names are critical!

    +   - Global variables and constants are in UPPER case.

    +     - Prefer not to make changes to global variables, but sometimes that’s just
    much simpler (KISS).

    +     - Use `readonly` or `declare -r` for constants.

    +   - Other variables are in lowercase.

    +   - Functions are in Mixed_Case.

    +   - Use “_”, not CamelCase, in place of space (remember, “-” is not allowed
    in variable names).

    +   - Use bash arrays carefully; they can be hard to read (see Chapter 7). `for
    var in $regular_var` often works as well.

    +   - Replace $1, $2, .. $N with readable names ASAP.

    +     - That makes everything much more debuggable and readable, but it also makes
    it easy to have defaults and add or rearrange arguments.

    +   - Distinguish between types of referents, like $input_file versus $input_dir.

    +   - Use consistent “FIXME” and “TODO” labels, with names and ticket numbers
    if appropriate.


    # Functions


    +   - *Always use a header.*

    +   - Good names are critical!

    +   - Functions must be defined before they are used.

    +     - Group them at the top, and use two blank lines and a function separator
    between each function.

    +     - Do *not* intersperse code between functions!

    +   - Use Camel_Case and “_” to make function names stand out from variable names.

    +   - Use `function My_Func_Name {` instead of `My_Func_Name() {` because it’s
    clearer and easier to `grep -P ''^\s*function ''`.

    +   - Each function should have comments defining what it does, inputs (including
    GLOBALS), and outputs.

    +   - When you have useful, standalone pieces of code, or any time you use the
    same (or substantially similar) block of code more than once, make them into'
  merge: -1

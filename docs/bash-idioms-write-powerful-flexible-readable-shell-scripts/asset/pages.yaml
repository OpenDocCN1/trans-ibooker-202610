- pgno: 53
  md: '# Conditional Substitutions


    Some of these variable substitutions are conditional, that is, they happen only
    if certain conditions are met. You could accomplish the same thing using if statements
    around the assignments, but these idioms make for shorter code for certain common
    cases. These conditional substitutions are shown here with a colon and then another
    special character: a minus, plus, or equal sign. The condition that they check
    for is this: is the variable null or unset? A null variable is a variable whose
    value is the null string. An unset variable is one that hasn’t yet been assigned
    or was explicitly unset (think “discarded”) with the unset command. With positional
    parameters (like $1, $2, etc.), they are unset if the user doesn’t supply a parameter
    in that position.


    If you don’t include the colon in these conditional substitutions, then they only
    consider the case of an unset variable; null values are returned as is.


    # Default Values


    A common scenario is a script with a single, optional parameter. If the parameter
    isn’t supplied when the script is invoked, then a default value should be used.
    In bash, we might write something like this:


    ```

    LEN=${1:-5}

    ```


    This will set the variable LEN either to the value of the first parameter ($1)—if
    one was supplied—or else to the value 5. Here is an example script:


    ```

    LEN="${1:-5}"

    cut -d'','' -f2-3 /tmp/megaraid.out | sort | uniq -c | sort -rn | head -n "$LEN"

    ```


    It takes the second and third fields from a comma-separated values file called
    /tmp/megaraid.out, sorts those values, provides a count of the number of occurrences
    of each value pair, then shows the top 5 from the list. You can override the default
    value of 5 and show the top 3 or 10 (or however many you want) simply by specifying
    that count as the sole parameter to the script.


    # Comma-Separated Lists


    Another conditional substitution, using the plus sign, also checks to see if the
    variable has a value and if so, if it will return a different value. That is,
    it returns the specified different value only if the variable is not null. Yes,
    that does sound strange; if it has a value, why return a different value?


    A handy use for this seemingly odd logic is to construct a comma-separated list.
    You typically construct such a list by repeatedly appending “,value” or “value,”
    for every value. When doing so, you usually need an if statement to avoid having
    an extra comma on the front or end of this list—but not when you use this join
    idiom:'
  merge: -1
  img_proc: true

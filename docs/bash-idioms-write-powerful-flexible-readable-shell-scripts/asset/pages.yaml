- pgno: 69
  md: "So how is the script writer supposed to get any useful results back from a\
    \ bash function? There are two typical approaches. One way is to treat the function\
    \ just like you would any shell script—have its output be the return values. You\
    \ might pipe that output into the next part of your script that needs the results\
    \ from the function, or you might capture that output using $() notation. The\
    \ $() will run the function in a subshell and you can assign the result (the function’s\
    \ output) to a variable, and then use that variable on another command line.\n\
    \nAnother way to return results from a function in a shell script is to use something\
    \ not available to an external script—global variables.\n\n# Local Variables\n\
    \nConsider a function that has some looping inside it, done by using a for loop,\
    \ and that for loop uses an index variable i to count the iterations. Now consider\
    \ what would happen if the function itself were called from within the body of\
    \ a for loop, a loop that also happened to be controlled using i as an index variable.\
    \ Since bash variables are global, then the (inner) function will affect the outer\
    \ loop index. Not good. What to do?\n\nBash provides a syntax to let you declare\
    \ variables as “local” so that they are not seen outside the function. Variables\
    \ like i in a for loop should be declared as local variables:\n\n```\nfunction\
    \ Summer {\n    local i\n    SUM=0\n    for((i=0; i<$1; i++)) {\n        let SUM+=i;\n\
    \    }\n}\n```\n\nProblem solved. It might be even better to use local -i i or\
    \ declare -i i to declare i as an integer value, avoiding conversions to/from\
    \ string. The declare inside a function acts just like the local in hiding any\
    \ global variable by that name. The use of the -i option (in either case) allows\
    \ you to specify the integer aspect of the variable.\n\nThe variable SUM in this\
    \ example is not declared local because that is how the result of the function\
    \ call is being returned to the caller. Should all variables in a function be\
    \ declared local unless they are needed outside the script? Quite possibly, but\
    \ since there is no way to enforce it, few programmers are that thorough. If you\
    \ are writing functions that you expect to be shared and portable, then it is\
    \ well worth the effort and will avoid unexpected side effects."
  merge: -1
  img_proc: true
- pgno: 70
  md: "![](img/553ffa1bc15093729b691f706befc0ac_70_0.png)\n\n# Dynamic Scoping\n\n\
    If you declare a local variable in a function and then that function calls another\
    \ function, the second function will see the first function’s local variable and\
    \ not the global variable of the same name. If you call that second function from\
    \ the main part of your script, it will see (and use) the global variable. Welcome\
    \ to the dangers of dynamic scoping, another reason to keep your scripts simple\
    \ and well documented.\n\n# Function Special Cases\n\nRemember that the function\
    \ definition must occur before it is called.\n\nIf you use parentheses in your\
    \ function definition (unlike our preferred style), then you can enclose your\
    \ function body in any of the compound statement syntax choices. You can use double\
    \ parens for an arithmetic evaluation or double brackets if you want your function\
    \ to do just a conditional expression evaluation. But these uses are highly unlikely.\n\
    \nYou can put an I/O redirection on your function definition. It takes effect\
    \ when you call that function. Here’s a common use of that feature to easily redirect\
    \ the entire usage message to STDERR (via 1>&2):\n\n```\nfunction Usage_Message\
    \ {\n    echo \"usage: $0 value pathname\"\n    echo \"where value must be positive\"\
    \n    echo \"and pathname must be an existing file\"\n    echo \"for example:\
    \ $0 25 /tmp/scratch.csv\"\n} 1>&2\n```\n\nThis function might be called when\
    \ the script checks and finds that the correct number of arguments have not been\
    \ supplied or that the supplied filename doesn’t exist (we’ll talk about that\
    \ more in “HELP!” on page 79). The important thing to note is that the output\
    \ gets redirected to STDERR, but the redirection doesn’t have to be put on every\
    \ line of the script—only once, outside the enclosing braces. That can save you\
    \ a lot of typing, and you don’t need to remember to add another redirect to any\
    \ lines when you revise the script.\n\nNote that for the sake of clarity and easing\
    \ into it, we’ve broken down some of our style recommendations for functions;\
    \ see “Functions” on page 128 for details.\n\n# Time for printf\n\nIf you know\
    \ printf from languages like C and Java, you’ve got a head start. We thought we’d\
    \ cover it in this chapter on functions because, while not a function in bash\
    \ but a builtin, it feels familiar enough to treat it like one."

    \ qq(\\u$\\_);' \\\n| column\"\n```\n\nSometimes it’s useful to have the same\
    \ command work differently on different hosts. You can easily do that with a case\
    \ statement (Example 10-11).\n\n# Example 10-11. Different aliases for different\
    \ hosts\n\n```\ncase \"$HOSTNAME\" in\n  host1* )  # Linux, but only has `xclip`\n\
    \    alias gc='xclip -out'      # Send X selection to STDOUT\n    alias pc='xclip\
    \ -in'       # Send STDIN to X selection\n  ;;\n\n  host2* )  # Mac\n    alias\
    \ gc='pbpaste'         # Send Paste Buffer to STDOUT\n    alias pc='pbcopy'  \
    \        # Send STDIN to Paste Buffer\n  ;;\n\n  * )       # Linux default\n \
    \   alias gc='xsel -b'        # Send X clipboard to STDOUT\n    alias pc='xsel\
    \ -bi'       # Send STDIN to X clipboard\n  ;;\nesac\n```\n\n# Functions\n\nOne\
    \ thing you can’t do with aliases is pass arguments into the middle of the alias,\
    \ but you can do that with functions, as we covered in Chapter 6. We’re starting\
    \ to get out of idioms and more into recipes here, but we can’t resist the handy\
    \ little function shown in Example 10-12.\n\n# Example 10-12. function mcd\n\n\
    ```\nfunction mcd {\n  \\mkdir -p \"$1\"\n  \\cd \"$1\"\n}\n```\n\nOf course,\
    \ that’s very trivial, and doesn’t do sanity or error checking, and doesn’t allow\
    \ for setting permissions (-m mode), but even this version is a great time-saver\
    \ if you make a lot of directories. Note the leading \\ inhibits alias expansion\
    \ so we’re sure to get the plain bash builtin. We’ll leave expanding it as an\
    \ exercise for the reader."

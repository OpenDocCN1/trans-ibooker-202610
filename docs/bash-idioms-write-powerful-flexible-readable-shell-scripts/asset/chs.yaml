  \ ${myhash[*]}\necho -en \"\\n\\[${myhash[@]}\\] =\" ; printf \"%q\" \"${myhash[@]}\"\
  \necho -en \"\\n\\[${myhash[*]}\\] =\" ; printf \"%q\" \"${myhash[*]}\"\necho -e\
  \ \"\"  # Broken!  # Previous line is bad and no newline\n# See 'help printf' or\

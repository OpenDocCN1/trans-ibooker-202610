  six\" )\ndeclare -A myhash=([a]=\"foo\" [b]=\"bar\" [d]=\"three\" [e]=\"four\" [f]=\"\
  five by five\" [g]=\"six\" )\n\n## A Simple Word Count Example\n\nAs we said, one\
  \ of the most common uses of a hash is to count and/or “uniq” items, so Example\
  \ 7-5 is a simple but concrete example.\n\n### Example 7-5. bash word count example:\
  \ code\n\n```\n#!/usr/bin/env bash\n# word-count-example.sh: More examples for bash\
  \ lists and hashes, and $RANDOM\n##### Original Author & date: _bash Idioms_ 2022\n\
  # bash Idioms filename: examples/ch07/word-count-example.sh\n##### ----------------------------------------------------------------------------\n\
  # Does not work on Zsh 5.4.2!\n# See also: `man uniq`\n\nWORD_FILE='/tmp/words.txt'\n\
  > $WORD_FILE\ntrap \"rm -f $WORD_FILE\" ABRT EXIT HUP INT QUIT TERM\n\ndeclare -A\
  \ myhash\n\necho \"Creating & reading random word list in: $WORD_FILE\"\n\n# Create\
  \ a list of words to use for the hash example\nmylist=(foo bar baz one two three\
  \ four)\n\n# Loop, and randomly pick elements out of the list\nrange=\"${#mylist[@]}\"\
  \nfor ((i=0; i<35; i++)); do\n    random_element=\"$(( $RANDOM % $range ))\"\n \
  \   echo \"${mylist[$random_element]}\" >> $WORD_FILE\ndone\n\n# Read the word list\
  \ into a hash\nwhile read line; do\n    (( myhash[$line]++ ))\ndone < $WORD_FILE\n\
  \necho -e \"\\nUnique words from: $WORD_FILE\"\nfor key in \"${!myhash[@]}\"; do\n\
  \    echo \"$key\"\ndone | sort\n\necho -e \"\\nWord counts, ordered by word, from:\
  \ $WORD_FILE\"\nfor key in \"${!myhash[@]}\"; do\n    printf \"%s\\t%d\\n\" $key\
  \ ${myhash[$key]}\ndone | sort\n\necho -e \"\\nWord counts, ordered by count, from:\
  \ $WORD_FILE\"\nfor key in \"${!myhash[@]}\"; do\n    printf \"%s\\t%d\\n\" $key\
  \ ${myhash[$key]}\ndone | sort -k2,2n\n```\n\n1 我们将创建一个临时文件并设置一个 trap（第 97 页的“It's\

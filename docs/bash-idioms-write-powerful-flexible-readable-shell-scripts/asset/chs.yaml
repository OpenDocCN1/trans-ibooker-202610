- '## 制定你的风格指南


  本书的核心主题是编写符合惯用法且可读性强的 bash 代码，并保持一致的风格，我们希望已经提供了你所需的工具。风格只是“我们如何书写”的另一种说法。找到一些风格指南，写下来，然后坚持执行。本书涵盖了许多重要的风格考量，还有一些其他指南我们也想提及，在设计系统和编写代码时需要牢记的事情。你可以将本章作为你自己的风格指南的起点，也可以如果喜欢就直接采用。附录是去掉讲解点的相同材料，可用作“速查表”，你可以在本书的
  GitHub 页面获取 Markdown 或 HTML 代码。


  请牢记以下高层原则：


  - 首先：KISS——Keep It Simple, Stupid！复杂性是安全的敌人，¹ 但它也是可读性和理解性的敌人。当然，现代系统和环境本身就很复杂，所以请尽力不要让情况变得更糟。

  - 其推论，正如 Brian Kernighan  famously 所说，调试的难度是最初编写代码的两倍，所以如果你的代码已经聪明到你能做到的程度，那么——按定义——你就聪明不到足以调试它。

  - 尽量不要重新发明轮子。你想做的事情很可能已经被做过，并且很可能有工具或库可用。如果该工具已经安装，就直接使用。无论你多努力，你都不可能匹配 rsync 所投入的努力和测试，所以就用它吧。如果你在互联网上找到随机代码……嗯，先想想这个问题吧。


  1 实际上是：“复杂性是安全的最大敌人”（参见 https://oreil.ly/zMJLF）。


  - 提前为特殊情况或覆盖做好计划，因为它们一定会发生。向 Linux 发行版打包系统学习，提供一个 `/etc/things/global.cfg` 用于可盲目覆盖的默认值，然后允许在
  `/etc/things/config.d/` 或类似位置进行覆盖。参见第 93 页的“Drop-in Directories”。

  - 如果不在版本控制中，就不存在！（而且迟早会丢失，然后 *真的* 不存在了。）

  - 记录一切。（但你不必为此写一本书……哦等等……）为一年后加入团队的新人编写你的代码、注释和文档，那时你已经忘记了 *为什么* 要 *那样* 做。记录什么 *没*
  起作用，以及可能的原因，并交叉引用，尤其是那些你能预见会伤害你的东西。（是的，`rm -rf /$undefined_variable` 证明是一个 *非常糟糕的主意*！）

  - 保持代码和文档 DRY：Don’t Repeat Yourself。一旦你有了不止一个副本，它们迟早会不同步——唯一的问题是何时。用函数和库；不要 WET（We
  Enjoy Typing）。


  “Python 之禅”在很大程度上也适用于 bash，这是一个不错的起点。尝试 `python -c "import this"` 或查看 Python 文档。


  ![](img/553ffa1bc15093729b691f706befc0ac_139_0.png)


  ## bash Idioms 风格指南不可移植


  本 *bash Idioms* 风格指南专门针对 bash，因此不能移植到 POSIX、Bourne、Dash 或其他 shell。如果你需要为这些 shell
  编写代码，你需要测试并调整本指南以适应这些 shell 支持的语法和功能。


  在 Docker 或其他容器中尤其要小心，其中 `/bin/sh` 不是 bash，而 `/bin/bash` 可能甚至不存在！这适用于物联网和其他受限环境，例如工业控制器。参见第
  ix 页的“bash in Containers”和第 94 页的“Shebang！”。


  深入细节，你的风格指南中应包含哪些类型的内容？我们将在以下各节中介绍其中的一些。

  '
- "## 可读性\n\n代码的可读性很重要！或者正如 Python 所说，*readability counts*。你只写一次，但你（和其他人）很可能会读很多次。花额外几秒或几分钟思考明年试图阅读代码的可怜糊涂的人……很可能就是你。抽象（Don’t\
  \ Repeat Yourself）和可读性之间存在平衡和张力：\n\n- KISS（Keep It Simple, Stupid！）。\n- *可读性：* 不要“聪明”，要清晰。\n\
  - 良好的命名至关重要！\n- *始终使用头部。*\n- 如果可能，对 -h、--help 和错误参数发出有用的信息！\n  - 优先使用“here”文档（带前导\
  \ tab）而不是一堆 echo 行，因为以后需要更新和重新换行时摩擦更小。\n- 使用 source（而不是 .，后者容易看不见且更难搜索）来包含配置文件，后者应以\
  \ .cfg（或 .conf 或你标准的任何名称）结尾。\n- 如果可能，对所有内容都使用 ISO-8601 日期。\n- 如果可能，保持事物列表按字母顺序排列；这可以防止重复并使添加或删除项目更容易。示例包括\
  \ IP 地址（使用 GNU sort -V）、主机名、要安装的包、case 语句，以及变量或数组/列表的内容。\n- 如果可能，使用命令的长参数以提高可读性，例如使用\
  \ diff --quiet 而不是 diff -q，但要注意对非 GNU/Linux 系统的可移植性。\n  - 如果任何选项简短或晦涩，请添加注释。\n \
  \ - 强烈考虑记录你选择或需要选项的原因，甚至记录你考虑过但因某种原因未使用的选项。\n  - 一定要记录任何看起来像个好主意但实际上可能导致问题的选项，尤其是你在其他地方常用到的。\n\
  \n对于变量命名，要注意像这样的通用变量名：\n\n```\n`${GREP} ${pattern} ${file}`\n```\n\n这很抽象，也许可复用，但也很缺乏上下文。我们已将旧的\
  \ `` 替换为更新且更易读（我们认为）的 $()，而且肯定更易嵌套，但更重要的是，变量噪音更少，因为我们省略了不必要的 ${} 并使用了有意义的名称：\n\n\
  ```\n$($GREP \"$re_process_errors\" $critical_process_daily_log_file)\n```\n\n过了一段时间，你和你的团队会发现某些（我们敢说）惯用的方式来表达你经常面对的概念和操作。那时就是写风格指南的时候了，如果你还没有的话。\n\
  \n另一方面，如果你正在提交补丁或维护代码，最好遵循该代码的约定，除非你要对整个代码进行重排和可能的重构。\n"
- "## 注释\n\n关于注释的写法、时机、位置等已经写了很多。以下是与注释相关的风格指南：\n\n- *始终使用头部。*\n- 为一年后加入团队的新人写注释。\n\
  - 对你的函数进行注释。\n- 不要注释你做了什么。注释你为什么做或不做某事。\n  - 例外：当 bash 本身晦涩时，注释你做了什么。\n- 考虑添加关于外部程序选项的注释，尤其是当它们简短或晦涩时。\n\
  - 在注释的第一词开头使用大写字母，但除非注释超过一句话，否则省略结束标点。\n\n添加 *有用* 的注释来解释 *为什么* 你做某事以及你的意图！例如：\n\n\
  ```\ncontinue # To the next file in for loop\n```\n\n理论上，如果你写出清晰的代码，就不需要解释 *某物*\
  \ 做什么。但有时 bash 本身就很繁琐或晦涩，例如变量替换（参见第 33 页的“Path or Prefix Removal”），像：\n\n```\nPROGRAM=${0##*/}\
  \  # Basename in bash\n```\n\n分隔符对于分隔代码的逻辑块通常很有用。但不要在底部添加结束分隔符来“框”住它；这只会增加混乱并减少你屏幕上的代码行数\
  \ 1 行。不管怎样，*绝对不要* 在右侧用字符构建框！完全没有必要，你会浪费大量时间让它“看起来正确”。更糟的是，这会强烈阻碍以后修复或更新注释，因为你又得重新修复框。\n\
  \n不要这样做：\n\n\n\n\n\n##################################################\n# 请不要像这样构建框！\
  \            #\n#                                                #\n# 这样做在以后编辑注释时会非常痛苦，因为\
  \ #\n# 现在你必须担心右侧的结束字符。 这个例子还不算太糟糕，但很快就会 #\n# 失控。                           #\n##################################################\n\
  \n这样做：\n\n##################################################\n# 请像这样构建框！\n#\n# 这样更容易编辑，因为虽然你仍然需要担心文本换行，但它只是一个简单的行首\
  \ \"#\" 当\n# 你重新换行时。\n"
- "## 名称\n\n命名 *很重要*。我们不能再强调这一点。`$file` 和 `$critical_process_daily_log_file` 之间的区别现在看起来除了多打字之外什么都不是\
  \ *现在*，当所有细节都在你脑海中时。但我们保证，如果你花额外的时间真正思考你命名的含义以及它在代码中读起来的样子，这很快就会得到回报，减少编码错误，并且在将来重读、调试和增强时也会有回报。以下是与名称相关的风格指南：\n\
  \n- 好的名字至关重要！\n- 全局变量和常量使用大写。\n  - 尽量不要更改全局变量，但有时这样做要简单得多（KISS）。\n  - 对常量使用 `readonly`\
  \ 或 `declare -r`。\n- 其他变量使用小写。\n- 函数使用 Mixed_Case。\n- 使用 \"_\" 而不是 CamelCase 来代替空格（记住，“-”\
  \ 不能用于变量名）。\n- 谨慎使用 bash 数组；它们可能难以阅读（参见第 7 章）。`for var in $regular_var` 通常也同样有效。\n\
  - 尽快用可读的名称替换 $1, $2, .. $N。\n  - 这样会使一切更易于调试和阅读，但也使设置默认值和添加或重新排列参数变得容易。\n- 在指代类型之间进行区分，例如\
  \ $input_file 与 $input_dir。\n- 使用一致的“FIXME”和“TODO”标签，如有必要加上名称和工单号。\n\n考虑一下将这些混淆并使用（或出现差一错误）错误的一个有多容易：\n\
  \n```\nfile1='/path/to/input'\nfile2='/path/to/output'\n```\n\n这更直观易读，也更难打错：\n\n\
  ```\ninput_file='/path/to/input'\noutput_file='/path/to/output'\n```\n\n另外，不要为了省打字而省略两个字符；请完整拼写出\
  \ $filename，以免以后出错。它是 $filenm 还是 $flname 还是 $flnm 还是别的什么？\n"
- "## 函数\n\n以下是与函数相关的风格指南：\n\n- *始终使用头部。*\n- 好的名字至关重要！\n- 函数必须在被使用前定义。\n  - 将它们分组放在顶部，并在每个函数之间使用两行空白和一个函数分隔符。\n\
  \  - 不要在函数之间穿插代码！\n- 使用 Camel_Case 和“_”使函数名与变量名区分开来。\n- 使用 function My_Func_Name\
  \ { 而不是 My_Func_Name() { 因为它更清晰，也更容易 grep -P '^\\s*function '。\n- 每个函数都应有注释，定义它做什么，输入（包括\
  \ GLOBALS）和输出。\n- 当你有有用的、独立的代码片段，或任何时候你使用相同（或基本相似）的代码块超过一次时，将它们做成函数。如果它们很常见，比如日志记录或邮件发送，请考虑创建一个“库”，即一个你可以按需\
  \ source 的单一公共文件。\n  - 为“库”函数加上前缀“_”，如 _Log 或其他前缀。\n- 如果有意义，请考虑在参数中使用“填充”词以提高可读性，然后将其定义为本地\
  \ junk1=\"$2\" # 未使用的填充，例如：\n  - _Create_File_If_Needed \"/path/to/$file\" containing\
  \ *important value*\n- 在函数中设置变量时请使用 local 内置命令。\n  - 但要注意，由于成功“本地化”，它会掩盖失败的返回码，因此如果使用命令替换，请将声明和赋值分开写，例如\
  \ local my_input 然后 my_input=\"$(some-command)\"。\n- 对于大约 25 行以上的任何函数，用 } # End\
  \ of function MyFuncName 关闭它，以便在屏幕上更容易跟踪你在代码中的位置。对于少于 25 行的函数，这不是必须的，但鼓励这样做，除非变得过于杂乱。\n\
  - 不要使用 main 函数；它几乎总是多余的一层。\n  - 话虽如此，使用“main”对 Python 和 C 程序员来说是有意义的，或者如果代码也用作库，并且如果你做大量单元测试时可能需要它。\n\
  - 考虑在主部分上方使用两行空白和一个主分隔符，尤其是在顶部有大量函数和定义时。\n\n另外，在你的库中定义一个单一的日志函数（例如，_Log），并使用它！否则你最终会得到各种各样的日志函数、样式和目的地。理想情况下，正如我们之前所说，将日志记录到\
  \ syslog，让操作系统担心最终目的地、日志轮转等。\n"
- "## 引用\n\n引用很简单，直到它变得不简单，然后你就会头疼。我们知道这是怎么回事，有时我们仍然会做试错，尤其是尝试创建一行代码以 sudo 作为另一个用户运行或通过\
  \ ssh 在另一节点上运行时。添加一些 echo 行，小心行事。以下是与引用相关的风格指南：\n\n- 请对变量和字符串加上引号，因为它使它们稍微突出并澄清了你的意图。\n\
  \  - 除非变得过于杂乱。\n  - 或它们需要不加引号以便展开。\n- 不要引用整数。\n- 除非需要插值，否则使用单引号。\n- 不要使用 ${var}\
  \ 除非需要；它太杂乱了。\n  - 但有时确实需要，例如 ${variable}_suffix 或 ${being_lower_cased,,}。\n- 请引用命令替换，例如\
  \ var=\"$(command)\"。\n- *始终* 对任何测试语句的两侧都加引号，例如 [[ \"$foo\" == 'bar' ]]。\n  - 除非一侧是整数。\n\
  \  - 并且除非你使用 ~=，在这种情况下你不能引用正则表达式！\n- 考虑在 echo 语句中对变量使用单引号，例如 echo \"cd to '$DIR'\
  \ failed.\" 因为当变量意外未定义或为空时它会很明显。\n  - 或 echo \"cd to [$DIR] failed.\" 随你喜欢。\n  -\
  \ 如果使用 set -u，当变量未定义时你会收到错误——但如果变量已定义但只是意外为空则不会。\n- 优先在 printf 格式周围使用单引号（参见第 56\
  \ 页的“POSIX Output”和第 55 页的“Time for printf”其余部分）。\n"
- "## 布局\n\n以下是与布局相关的风格指南：\n\n- 对齐！bash 中多个空格几乎无关紧要（= 两侧除外），并且对齐相似的命令使阅读更容易，也更容易看到相似性和差异。\n\
  - *不要允许尾随空白！* 这以后会在 VCS（版本控制系统）中造成噪音，当被移除时。\n- 使用四个空格缩进，但在 here-documents 中根据需要使用\
  \ TAB。\n- 在大约 78 列处断开长行，续行缩进两个空格，并在 | 或 > 之前断开，以便这些部分在向下扫描代码时突出。\n- 打开块的代码放在一行中，例如：\n\
  \  - if expression; then\n  - for expression; do\n- case..esac 中的列表元素缩进四个空格，关闭的\
  \ ;; 与该缩进级别相同。每个项目的块也缩进四个空格。\n  - 一行元素应与 ;; 在同一行关闭。\n  - 尽量对齐每个元素中的 )，除非变得杂乱或失控。\n\
  \  - 请参阅示例代码中的 Example 8-4。\n\n有人认为不必费心在 70–80 列处断行，这假设每个人都使用宽的图形终端和 IDE。首先，这取决于团队和个人，可能并非如此，其次，即使是这样，当它\
  \ *真的*\n\n中断并且你不得不在 80 × 24 控制台上的 vi 中在火线调试时，你不会欣赏 200+ 列的代码。\n\n断开你的行。\n\n在重要部分之前断开它们，这样当你向下扫描列的左侧时，续行会跳出来。我们也喜欢对断开的行使用通常缩进的一半。我们无法在此书中做一个好的（坏的？）长行示例，因为它只会在奇怪的地方断开。但我们可以提供一个简单、我们认为可读的示例：\n\
  \n```\n... Lots of code, indented a ways...\n    /long/path/to/some/interesting/command\
  \ \\\n    | grep \"$re_stuff_we_care_about\" \\\n    | grep -v \"$re_stuff_to_ignore\"\
  \ \\\n    | /path/to/email_or_log_command ...\n...more code\n```\n"
- "## 语法\n\n以下是与语法相关的风格指南：\n\n- 编写 bash 代码时使用 #!/bin/bash - 或 #!/usr/bin/env bash，而不是\
  \ #!/bin/sh。\n- 除非你非常确定需要 $*，否则使用 $@。\n- 使用 == 而不是 = 进行相等比较，以减少与赋值的混淆。\n- 使用 $(\
  \ ) 而不是 `` 反引号/反引号。\n- 使用 [[ 而不是 [（除非你需要 [ 用于可移植性，例如 dash）。\n- 根据需要使用 (( )) 和 $((\
  \ )) 进行整数运算；避免使用 let 和 expr。\n- 当简单且可读时，使用 [[ expression ]] && block 或 [[ expression\
  \ ]] || block。不要使用 [[ expression ]] && block || block，因为它不做你认为它做的事情；对于这种情况，使用 if\
  \ .. then .. (elif ..) else .. fi。\n- 考虑使用“非官方 bash 严格模式”（参见第 96 页的“Unofficial bash\
  \ Strict Mode”）。\n  - set -euo pipefail 将防止或暴露许多简单错误。\n  - 注意这一点，并谨慎使用它（如果你使用它）：IFS=$'\\\
  n\\t'。\n\n\n\n\n"
- '## 其他


  其他指南：


  - 对于“system”脚本，记录到 syslog，让操作系统处理最终目的地、日志轮转等。

  - 错误信息应发送到 STDERR，如 echo ''A Bad Thing happened'' 1>&2。

  - 使用 [ -x /path/to/tool ] || { ...error code block... } 来检查外部工具是否可用。

  - 失败时提供有用的信息。

  - 设置退出代码，尤其是在失败时。

  '
- "## 脚本模板\n\n这是一个示例骨架或模板脚本，你可以复制它作为提醒，并在创建新脚本时节省一些（好吧，也许相当多的）输入：\n\n```\n#!/bin/bash\
  \ -\n# 或可能是： #!/usr/bin/env bash\n# <Name>: <description>\n# Original Author & date:\n\
  # Current maintainer?\n# Copyright/License?\n# Where this code belongs? (Hosts,\
  \ paths, etc.)\n# Project/repo?\n# Caveats/gotchas?\n# Usage? (Better to have `-h`\
  \ and/or `--help` options!)\n# $URL$  # If using SVN\nID=''  # If using SVN\n#\n\
  PROGRAM=${0##*/}  # bash version of `basename`\n\n# Unofficial bash Strict Mode?\n\
  #set -euo pipefail\n### CAREFUL: IFS=$'\\n\\t'\n\n# GLOBAL and constant variables\
  \ are in UPPER case\nLOG_DIR='/path/to/log/dir'\n\n### Consider adding argument\
  \ handling to YOUR template; see:\n# examples/ch08/parseit.sh\n# examples/ch08/parselong.sh\n\
  # examples/ch08/parselonghelp.sh\n\n# Functions are in Mixed Case\n######################################################################\n\
  ```\n\n```\n# Define functions\n\n#-------------------------------------------------------------------------------\n\
  # Example function\n# Globals: none\n# Input:  nothing\n# Output: nothing\nfunction\
  \ Foo {\n    local var1=\"$1\"\n    ...\n} # End of function foo\n\n#-------------------------------------------------------------------------------\n\
  # Another example function\n# Globals: none\n# Input:  nothing\n# Output: nothing\n\
  function Bar {\n    local var1=\"$1\"\n    ...\n} # End of function bar\n\n###############################################################################\n\
  # Main\n\n# Code...\n```\n"
- "## 其他风格指南\n\n我们强烈建议你制定一份风格指南并使用它！如果你不喜欢我们的，并且你也不想自己修改，你可以从别处偷一个：\n\n- The Google\
  \ Shell Style Guide\n\n虽然我们对其中一些有不同的看法和分歧，但它非常好且相当全面。最好的情况是，你可以直接使用它，最坏的情况是，它是一个起点。有很多值得喜欢的地方，你可以做得更差（比如什么都没有），而且很多其他项目都采用了它，所以……\n\
  \n除其他事项外，我们不同意：\n\n- 百行限制。我们看到了这一点，尤其是在 Google 这样的环境中，但我们有很多超过该限制的脚本，它们“主要是调用其他实用程序并且数据操作相对较少。”\n\
  - “缩进两个空格”对我们来说有点浅；我们喜欢对续行使用两个空格，其他情况使用四个空格。\n- “${var}”太忙了。我们在可能的情况下更喜欢 \"$var\"\
  。\n\n— function cleanup() {? Ouch, no.\n\n— ;; 关闭 case..esac 块，应与块的开头保持相同的缩进，而不是与块中的代码保持相同的缩进。\n\
  \n- 以下还有其他你可以参考的指南：\n  - https://linuxcommand.org/lc3_adv_standards.php\n  - https://www.ovirt.org/develop/infra/infra-bash-style-guide.html\n\
  \  - https://wiki.bash-hackers.org/scripting/style\n  - http://mywiki.wooledg.org/BashGuide/Practices\n\
  \    - Great info: http://mywiki.wooledg.org/BashPitfalls\n\n- 或在网上搜索：\n  - \"Shell\
  \ Style Guide\"\n  - \"Bash Style Guide\"\n  - \"Shell script coding standards\"\
  \n"
- "## bash Linter\n\n使用 linter 代替风格指南或作为补充也可能很方便。说实话，我们不用，但我们认为应该涵盖一下。我们知道的是 shellcheck，我们对结果有复杂的感受；它对引号特别挑剔，我们并不总是同意它关于引号或一般方面的建议，但这些东西或多或少是可以调整的。话虽如此，它仍然非常酷，值得一看。\n\
  \n- bash linter: https://www.shellcheck.net\n  - https://github.com/koalaman/shellcheck\
  \ (Haskell)\n  - History: https://www.vidarholen.net/contents/blog/?p=859\n  - Checks:\
  \ https://github.com/koalaman/shellcheck/wiki/Checks\n  - Tweaking: https://github.com/koalaman/shellcheck/wiki/Directive\n\
  \  - Ignoring errors: https://github.com/koalaman/shellcheck/wiki/Ignore\n  - Note,\
  \ Eol (2020) CentOS-6 is too old: https://github.com/koalaman/shellcheck/wiki/CentOS6\n\
  \n如果你通过包系统安装，请记住版本可能相当旧。Linux 版本是一个包含单个编译二进制文件的 tarball，所以很容易将当前版本放到你的路径中的某个位置。\n"
- '## 总结


  希望，这本书能让你更好地理解如何阅读和编写“bashy”代码，并且本章为你提供了开始定义适合你的风格（和指南）的地方。


  Happy bashing!


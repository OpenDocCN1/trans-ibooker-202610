  \n+   3 获取元素的计数，或我们想要的随机数的范围。\n\n+   4 使用 bash $RANDOM 变量来挑选列表中的随机元素（示例 4-3）。\n\n\
  +   5 将随机单词回显到临时文件中。我们用了三行（标注 ③、④ 和 ⑤）来做一件本可以用一行完成的事情，比如 echo \"${mylist[$[$RANDOM\

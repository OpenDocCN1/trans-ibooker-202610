  \n与列表不同，这些必须使用 declare -A、local -A 或 readonly -A 声明，并且下标始终是必需的；参见表 7-2 中的示例。\n\n\
  ## Table 7-2. Sample bash hash\n\n| Element | Value |\n|---|---|\n| myhash[oof]\
  \ | foo |\n| myhash[rab] | bar |\n| myhash[zab] | baz |\n\n关联数组或哈希或字典的常见操作是：\n\n\

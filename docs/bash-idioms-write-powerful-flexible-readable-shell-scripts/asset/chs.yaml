- "## The bash Idioms Style Guide Is Not Portable\n\n此 bash Idioms 风格指南专门针对 bash，因此不能移植到\
  \ POSIX、Bourne、Dash 或其他 shell。如果你需要为这些 shell 编写代码，你将需要测试和调整本指南以考虑这些 shell 支持的语法和功能。\n\
  \n在 Docker 或其他容器中，/bin/sh 不是 bash 且 /bin/bash 可能甚至不存在时尤其要小心！这适用于物联网和其他受限环境，例如工业控制器。参见第\
  \ ix 页的“bash in Containers”和第 94 页的“ Shebang!”。\n\n## 可读性\n\n代码的可读性很重要！或者正如 Python\
  \ 所说，可读性很重要。你只写一次，但你（和其他人）可能会阅读很多次。花额外的几秒钟或几分钟思考明年试图阅读代码的可怜的糊涂的人……很可能就是你。抽象（不要重复自己）和可读性之间存在平衡和张力：\n\
  \n- KISS (Keep It Simple, Stupid!)。\n- 可读性：不要“聪明”，要清晰。\n- 好的名称至关重要！\n- *始终使用头部。*\n\
  - 如果可能的话，为 -h、--help 和错误参数发出有用的内容！\n  — 优先使用“here”文档（带前导制表符）而不是一堆 echo 行，因为以后需要更新和重新换行时摩擦更少。\n\
  - 使用 `source`（而不是 .，它很容易被忽略且更难搜索）来包含配置文件，这些文件应以 .cfg（或 .conf 或你标准的任何名称）结尾。\n- 如果可能的话，对所有内容都使用\
  \ ISO-8601 日期。\n- 如果可能的话，保持事物列表按字母顺序排列；这可以防止重复并使添加或删除项目更容易。示例包括 IP 地址（使用 GNU `sort\
  \ -V`），主机名，要安装的软件包，`case` 语句，以及变量或数组/列表的内容。\n- 如果可能，使用命令的长参数以提高可读性，例如，使用 `diff --quiet`\
  \ 而不是 `diff -q`，不过要注意对非 GNU/Linux 系统的可移植性。\n  — 如果任何选项很短或晦涩，请添加注释。\n  — 强烈考虑记录你选择或需要选项的原因，甚至记录你考虑过但出于某种原因未使用的选项。\n\
  \  — 务必记录任何可能看起来像个好主意但实际上可能导致问题的选项，尤其是如果你在其他地方经常使用它们。\n\n## 注释\n\n- *始终使用头部。*\n\
  - 为一年后团队中的新人写注释。\n- 对你的函数进行注释。\n- 不要对你做了什么进行注释。对你为什么做或不做某事进行注释。\n  — 例外：当 bash 本身晦涩时，注释你做了什么。\n\
  - 考虑添加关于外部程序选项的注释，尤其是当它们很短或晦涩时。\n- 在注释的第一词使用首字母大写，但在注释超过一句话时省略结束标点。\n\n\n\n\n\n\
  ## 名称\n\n- 好的名称至关重要！\n- 全局变量和常量使用大写。\n  - 尽量不要修改全局变量，但有时这样做更简单（KISS）。\n  - 对常量使用\
  \ `readonly` 或 `declare -r`。\n- 其他变量使用小写。\n- 函数使用 Mixed_Case。\n- 用 “_” 代替空格（记住，“-”\
  \ 不能用于变量名）。\n- 谨慎使用 bash 数组；它们可能难以阅读（参见第 7 章）。`for var in $regular_var` 通常也能工作。\n\
  - 尽快用可读的名称替换 $1, $2, .. $N。\n  - 这样会让一切更易调试和阅读，同时也便于设置默认值和增删或重新排列参数。\n- 区分引用类型的不同，例如\
  \ $input_file 与 $input_dir。\n- 使用一致的 “FIXME” 和 “TODO” 标签，如有需要加上名称和工单号。\n\n## 函数\n\
  \n- *始终使用头部注释。*\n- 好的名称至关重要！\n- 函数必须在被使用前定义。\n  - 将它们分组放在顶部，并在每个函数之间使用两行空白和函数分隔符。\n\
  \  - 不要在函数之间穿插代码！\n- 使用 Camel_Case 和 “_” 使函数名与变量名区分开来。\n- 使用 `function My_Func_Name\
  \ {` 而不是 `My_Func_Name() {`，因为它更清晰，也更容易 `grep -P '^\\s*function '`。\n- 每个函数都应有注释说明其作用、输入（包括\
  \ GLOBALS）和输出。\n- 当你有有用的独立代码片段，或任何在多次使用相同（或基本相同）的代码块时，都应将其做成函数。如果它们很常见，如日志或邮件发送，请考虑创建一个“库”，即一个可按需\
  \ source 的单一公共文件。\n- 为“库”函数加上前缀 “_”，如 _Log 或其他前缀。\n- 如有意义，可考虑为可读性在参数中使用“填充”词，然后将其定义为\
  \ `local junk1=\"$2\" # Unused filler`，例如：\n  - `_Create_File_If_Needed \"/path/to/$file\"\
  \ containing important value`\n- 在函数中设置变量时请使用 `local` 内置命令。\n  - 但要注意，一旦“局部化”成功，它会掩盖失败的返回码，因此在使用命令替换时请分开声明和赋值，如\
  \ `local my_input` 然后 `my_input=\"$(some-command)\"`。\n- 对于超过约 25 行的任何函数，用 `} #\
  \ End of function MyFuncName` 关闭它，以便在屏幕上更容易追踪代码位置。对于少于 25 行的函数，这不是必须的但推荐，除非会显得杂乱。\n\
  - 不要使用 `main` 函数；它几乎总是多余的一层。\n  - 尽管如此，对 Python 和 C 程序员来说使用“main”是有意义的，或如果代码也用作库，并且如果你做大量单元测试时可能需要。\n\
  - 考虑在主部分上方使用两行空白和主分隔符，尤其是在顶部有大量函数和定义时。\n\n## 引号\n\n- 对变量和字符串加上引号，因为它能让它们更突出并明确你的意图。\n\
  \  - 除非变得过于杂乱。\n  - 或它们需要不加引号以便展开。\n- 不要给整数加引号。\n- 除非需要插值，否则使用单引号。\n- 不要使用 `${var}`\
  \ 除非必要；它太杂乱了。\n  - 但有时是需要的，例如 `${variable}_suffix` 或 `${being_lower_cased,,}`。\n\
  - 对命令替换加引号，如 `var=\"$(command)\"`。\n- *始终* 对任何测试语句的两边都加引号，如 `[[ \"$foo\" == 'bar'\
  \ ]]`。\n  - 除非其中一边是整数。\n- 并且除非你使用 ~=，在这种情况下你不能给正则表达式加引号！\n- 考虑在 echo 语句中对变量使用单引号，如\
  \ echo \"cd to '$DIR' failed.\" 因为当变量意外未定义或为空时它会很明显。\n  - 或 echo \"cd to [$DIR]\
  \ failed.\" 随你喜欢。\n  - 如果使用 set -u，变量未定义时会报错——但如果变量已定义只是意外为空则不会。\n- 在 printf 格式中优先使用单引号（参见第\
  \ 56 页的“POSIX Output”以及第 55 页的“Time for printf”其余部分）。\n\n## 布局\n\n- 对齐！bash 中多余的空格几乎无关紧要（=\
  \ 两侧除外），对齐相似的命令使阅读更容易，也能看出相似性和差异。\n- 不要允许尾随空白！这会在 VCS（版本控制系统）中在后续删除时产生噪音。\n- 使用四个空格缩进，但在\
  \ here-documents 需要时使用 TAB。\n- 在约 78 列处断开长行，续行缩进两个空格，并在 | 或 > 之前断开，这样在扫描代码时这些部分会突出。\n\
  - 打开块的代码放在一行，如：\n  - if expression; then\n  - for expression; do\n- case..esac 中的列表元素缩进四个空格，关闭的\
  \ ;; 与该缩进级别相同。每个项目的块也缩进四个空格。\n  - 单行元素应在同一行用 ;; 关闭。\n  - 尽量对齐每个元素中的 )，除非变得杂乱或失控。\n\
  \  - 参见示例 8-4 中的示例代码。\n\n## 语法\n\n- 编写 bash 代码时使用 #!/bin/bash - 或 #!/usr/bin/env\
  \ bash，不要使用 #!/bin/sh。\n- 除非你确定需要 $*，否则使用 $@。\n- 为减少与赋值的混淆，使用 == 而不是 = 进行相等比较。\n\
  - 使用 `$( )` 而不是 `` 反引号/反单引号。\n- 使用 [[ 而不是 [（除非你需要 [ 用于可移植性，例如 dash）。\n- 根据需要使用 ((\
  \ )) 和 $(( )) 进行整数运算；避免使用 let 和 expr。\n- 当简单且可读时，使用 [[ expression ]] && block 或\
  \ [[ expression ]] || block。不要使用 [[ expression ]] && block || block，因为它不按你想的那样工作；对于这种情况请使用\
  \ if .. then .. (elif ..) else .. fi。\n- 考虑使用“非官方 bash 严格模式”（参见第 96 页的“Unofficial\
  \ bash Strict Mode”）。\n  - set -euo pipefail 将防止或暴露许多简单错误。\n  - 注意这一点，并谨慎使用（如果你使用的话）：IFS=$'\\\
  n\\t'。\n\n## 其他\n\n- 对于“系统”脚本，记录到 syslog，让操作系统处理最终目标、日志轮转等。\n- 错误信息应发送到 STDERR，如\
  \ echo 'A Bad Thing happened' 1>&2。\n- 使用 [ -x /path/to/tool ] || { ...error code\
  \ block... } 检查外部工具是否可用。\n- 失败时提供有用的信息。\n- 设置退出码，尤其是在失败时。\n\n## 脚本模板\n\n```\n#!/bin/bash\
  \ -\n# Or possibly: #!/usr/bin/env bash\n# <Name>: <description>\n# Original Author\
  \ & date:\n# Current maintainer?\n# Copyright/License?\n# Where this code belongs?\
  \  (Hosts, paths, etc.)\n# Project/repo?\n# Caveats/gotchas?\n# Usage?  (Better\
  \ to have `-h` and/or `--help` options!)\n# $URL  # If using SVN\nID=\"\"  # If\
  \ using SVN\n#\nPROGRAM=${0##*/}  # bash version of `basename`\n\n# Unofficial bash\
  \ Strict Mode?\n#set -euo pipefail\n### CAREFUL: IFS=$'\\n|\\t'\n\n# GLOBAL and\
  \ constant variables are in UPPER case\nLOG_DIR='/path/to/log/dir'\n\n### Consider\
  \ adding argument handling to YOUR template; see:\n# examples/ch08/parseit.sh\n\
  # examples/ch08/parselong.sh\n# examples/ch08/parselonghelp.sh\n\n# Functions are\
  \ in Mixed Case\n#############################################################\n\
  # Define functions\n\n#------------------------------------------------------------\n\
  # Example function\n# Globals: none\n# Input:  nothing\n# Output: nothing\nfunction\
  \ Foo {\n    local var1=\"$1\"\n    ...\n} # End of function foo\n\n#------------------------------------------------------------\n\
  # Another example function\n# Globals: none\n# Input:  nothing\n# Output: nothing\n\
  function Bar {\n    local var1=\"$1\"\n    ...\n} # End of function bar\n\n#############################################################\n\
  # Main\n\n# Code...\n```\n\n\n\n"

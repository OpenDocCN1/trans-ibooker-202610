  \ for each）\n- 引用特定值（查找）\n- 删除一个或多个值\n- 删除整个哈希\n\n再次，我们不打算讨论所有这些，我们只是在示例 7-3 中向你展示，所以挑选出你需要的习惯用法。\n\

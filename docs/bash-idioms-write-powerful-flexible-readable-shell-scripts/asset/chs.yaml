  four     3\nfoo      4\nthree    4\none      5\nbaz      6\ntwo      6\nbar    \
  \  7\n```\n\n#### Style and Readability: Recap\n\nIn this chapter, we’ve demystified\
  \ bash array (list and hash) handling and showed idiomatic solutions for the common\
  \ use cases. While outside the scope of this book, there’s much more to say about\
  \ lists and hashes in bash. To learn more, see the following resources:\n\n- https://www.gnu.org/software/bash/manual/html_node/Arrays.html#Arrays\n\
  - http://wiki.bash-hackers.org/syntax/arrays\n- http://tldp.org/LDP/Bash-Beginners-Guide/html/sect_10_02.html\n\
  - https://learning.oreilly.com/library/view/bash-cookbook-2nd/9781491975329\n- man\
  \ uniq\n- man sort\n\nWhen you get the data structure correct, the rest of the code\
  \ practically writes itself. When you get the data structure wrong, everything is\
  \ a struggle. Bash has the building blocks for simple data structures, and once\
  \ you get used to a little extra punctuation, they’re not that hard to use and read.\
  \ Just remember: you almost always want [@] and not [*], and refer back to our cheat\
  \ sheet examples in this chapter when you need to.\n"
- "## Arguing\n\nSome scripts are meant to do a single task; they need no variations.\
  \ Many others, though, take arguments: one or more filenames, or options to provide\
  \ variations on their behavior. Once you have more than a single option (or maybe\
  \ two), you need to parse those arguments in an orderly fashion to be sure that\
  \ you’ve covered all the possible ways that a user of that script might order those\
  \ arguments. And come to think of it, even that single task script probably wants\
  \ -h (or even --help). Let’s take a look at how to parse those arguments and still\
  \ have a readable, maintainable script.\n\n### Your First Argument\n\nIf your script\
  \ just wants a single parameter, you can reference that in your script as $1. You\
  \ might have statements like echo $1 or cat $1 as part of your script. We don’t\
  \ recommend using $1 throughout your script as it doesn’t tell the reader anything\
  \ about this parameter. It’s better, for readability’s sake, if you assign this\
  \ parameter to a variable with an informative name. If the parameter is meant to\
  \ be a filename, then choose a variable name like in_file or pathname or similar\
  \ and assign it right away, early in the script. As we saw in “Default Values” on\
  \ page 38, we can even supply a default value:\n\n```\nfilename=${1:-favorite.txt}\
  \    # Or maybe use /dev/null as the default?\n```\n\nIf the user doesn’t supply\
  \ any parameter when invoking your script, $1 will be unset. In the preceding example,\
  \ the shell will assign favorite.txt as the value when parameter one is unset.\n\
  \nNeed a second or third parameter or more? As you might have guessed, those would\
  \ be $2, $3, and so on. They would be unset if no such parameter is supplied when\
  \ invoking the script.\n\nBut what if you don’t have good default values? Or what\
  \ if you don’t want to proceed when the user doesn’t supply the correct number of\
  \ arguments? Your script can check to make sure that the user has supplied the correct\
  \ number of arguments by checking the $# variable. It holds the number of arguments\
  \ supplied. If $# is 0, then the user invoked the script with no arguments. If $#\
  \ is 1 but you wanted two arguments, then don’t proceed. Issue an error message\
  \ and exit (see “Exit Codes” on page 96):\n\n```\nif (($# != 2)); then\n    echo\
  \ \"usage: $0 file1 file2\"    # $0 is the script's name, as invoked\n    exit\n\
  fi\n```\n\nWe’re only looking here at how to know that you’ve got the right number\
  \ of arguments to your script. How you use all these arguments within the script\
  \ is quite varied. We looked at some of those in Chapter 2.\n\nTraditionally, when\
  \ you wanted a list of all the arguments, you might have used $* to write something\
  \ like echo $*, which works fine for this simple output. But once spaces were allowed\
  \ as part of a filename, a slightly different syntax became the better choice.\n\
  \nQuotes are needed around a filename with embedded spaces in the name (e.g., “my\
  \ file”), otherwise the shell sees that as two separate words. To refer to all the\
  \ arguments to a script and have each one quoted, we use \"$@\" (string) or \"${@}\"\
  \ (list). If we use \"$*\", that will give us one large quoted string containing\
  \ all the arguments. For example, if we invoke a script like this:\n\n```\nmyscript\
  \ file1.dat \"alt data\" \"local data\" summary.txt\n```\n\nthen \"$*\" would result\
  \ in the single value “file1.dat alt data local data summary.txt,” whereas \"$@\"\
  \ would result in four separate words: file1.dat \"alt data\" \"local data\" summary.txt.\n\
  \nYes, we know we talked about this in “Quotes and Spaces” on page 14 and then kept\
  \ harping on it again in Chapter 7. It’s just tricky and bears repeating.\n\n###\
  \ Having Options\n\nOptions are ways to vary (slightly?) the behavior of a command.\
  \ The classic (idiomatic?) way to specify options to a Unix or Linux command is\
  \ with a single letter preceded by a -, called a minus, a dash, or a tack. For example,\
  \ to have a command produce its long-form output, you might specify that with -l.\
  \ Similarly, to have a command run in a more quiet mode (less output), you might\
  \ specify -q right after the command name.\n\nNot every command or script has these\
  \ options, and not every command or script that has, for example, a -q option uses\
  \ that option to specify a “quiet” output format.\n\n\n\n\n\n它可能在另一个命令中表示“快速”。在另一个命令中它可能根本不是一个有效选项。这些都是基于现有命令的约定——可以说是传统。\n\
  \n除非有令人信服的理由放弃它，否则遵守传统是值得的。原因之一是它降低了学习曲线。你在运行某些命令或脚本时学到的知识可以迁移到其他命令中。它还意味着你可以使用他人使用的相同技术来解析选项。\n\
  \n## 解析选项\n\n使用 getopts 内置命令来解析 shell 脚本的选项。它会被重复调用（通常通过 while 循环），直到找到所有选项。它假定所有选项都出现在其他参数之前。它可以识别单独的选项\
  \ (-a -v) 以及组合在一起的选项 (-av)。你可以指定某个选项必须提供额外的参数。例如，你可能希望 -o 选项指定输出文件，因此用户会使用 -o filename\
  \ 或 -ofilename 调用它，这两种格式都由 getopts 支持。\n\n让我们看一下示例 8-1，它处理了这类选项。\n\n### 示例 8-1.\
  \ getopts 参数解析：简单\n\n```\n#!/usr/bin/env bash\n# parseit.sh: Use getopts to parse\
  \ these arguments\n##### Original Author & date: _bash Idioms_ 2022\n# bash Idioms\
  \ filename: examples/ch08/parseit.sh\n#___________________________________________________________________________\n\
  \nwhile getopts ':ao:v' VAL ; do\n  case $VAL in\n    a ) AMODE=1 ;;\n    o ) OFILE=\"\
  $OPTARG\" ;;\n    v ) VERBOSE=1 ;;\n    : ) echo \"error: no arg supplied to $OPTARG\
  \ option\" ;;\n    * ) echo \"error: unknown option $OPTARG\"\n        echo \" \
  \ valid options are: aov\"\n  ;;\n  esac\ndone\nshift $((OPTIND -1))\n```\n\n1.\
  \ 我们编写 while getopts 是因为我们希望重复调用 getopts，而 getopts 命令在找到选项时（一个破折号后跟任意字母，无论是否有效）会返回\
  \ true，并在到达选项末尾时返回 false。getopts 内置命令需要给出两个词。第一个是选项列表，第二个是它将在解析命令行时找到的选项将被放入其中的变量名。它每次调用只会找到一个选项，因此我们通过\
  \ while 循环重复调用它。在我们的示例（':ao:v'）中，我们希望支持选项 a、o 和 v。开头的冒号告诉 getopts 不要报告错误消息，而是留给我们的脚本处理。o\
  \ 字符后的冒号表示 o 选项有一个随之而来的参数。VAL 是如果找到选项将被赋值的变量名。\n\n2. 一旦调用了 getopts，我们就可以使用 case\
  \ 语句查看找到的是哪个选项。（有关 case 语句的更多信息，请参见第 3 章。）\n\n3. 关于错误处理，由于我们要求 getopts 不要发出错误消息，我们需要两个\
  \ case 来处理错误。第一个情况是如果 -o 选项没有提供参数。我们已通过在 ':ao:v' 中在 o 后放置“：”来告诉 getopts 预期一个参数。如果在脚本调用时未给出参数，则\
  \ bash 会将 $VAL 设置为冒号，并将 $OPTARG 设置为我们找不到其参数的字符（在这种情况下为 o）。\n\n4. 其次，如果用户提供了一个不在我们有效选项列表中的选项，则\
  \ $VAL 将被赋值为 '?'（问号字符），并且它将 shell 变量 $OPTARG 设置为它无法识别的选项字符。我们使用 case 语句中的通配符模式 (*)\
  \ 处理这种情况。\n\n5. 当 getopts 完成且 while 循环退出时，还有一个重要的步骤要执行。getopts 内置命令在解析过程中沿着命令行参数移动时，会跟踪其在命令行参数中的位置。$OPTIND\
  \ 是它保存下一个要考虑的参数的索引的位置。现在所有这些参数都已解析，我们添加 shift $OPTIND -1 以将所有与选项相关的参数从进一步考虑中移除。\n\
  \n无论你使用 myscript -a -o xout.txt -v file1 还是仅使用 myscript file1 调用脚本，在 shift 完成其工作后，$1\
  \ 之后将引用 file1，因为中间的选项参数已被移除。脚本的参数现在只是剩余的（非选项）参数。\n\n## 长参数\n\n对于一些人来说，单个字母是不够的。他们希望使用完整的单词甚至短语来描述他们调用的选项。getopts\
  \ 内置命令也支持这些。\n\n我们需要区分长选项和串联在一起的多个单字母选项（例如，-last 是指 -l -a -s -t，还是指长选项 last？）。\n\
  \n约定是长选项以两个破折号开头。（在此示例中，我们将写 --last 来指定长选项。）\n\n要使用 getopts 解析长选项，我们在选项列表中添加一个减号和冒号，然后添加另一个\
  \ case 语句来识别每个长参数。我们即使在长选项不带参数的情况下也包含冒号。（我们将在后面的章节中解释原因。）\n\n示例 8-2 显示了之前的示例，该示例解析了一组选项，并扩展为包含几个长参数。这将处理的两个长参数是\
  \ --amode，它将与较短的 -a 选项相同；以及 --outfile，它像 -o 一样需要参数。对于长选项，选项及其对应参数可以通过两种方式提供：使用等号作为单个词，或作为两个词。例如，在调用脚本时，你可以写\
  \ outfile=file.txt 或 outfile file.txt 来指定输出文件选项。getopts 和这个第二个 case 语句可以处理这两种格式。\n\
  \n### 示例 8-2. getopts 参数解析：长\n\n```\n#!/usr/bin/env bash\n# parselong.sh: Use getopts\
  \ to parse these arguments, including long ones\n##### Original Author & date: _bash\
  \ Idioms_ 2022\n# bash Idioms filename: examples/ch08/parselong.sh\n#\n# Long arguments:\
  \ --amode\n#               and --outfile filename or --outfile=filename\n\nVERBOSE=':'\
  \  # Default is off (no-op)\n\nwhile getopts ':-:ao:v' VAL ; do\n  case $VAL in\n\
  \    a ) AMODE=1 ;;\n    o ) OFILE=\"$OPTARG\" ;;\n    v ) VERBOSE='echo' ;;\n#--------------------------------------------------------------------\n\
  \    - ) # This section added to support long arguments\n      case $OPTARG in\n\
  \        amode ) AMODE=1 ;;\n        outfile=* ) OFILE=\"${OPTARG#*=}\" ;;\n   \
  \     outfile )\n                  OFILE=\"${!OPTIND}\"\n                  let OPTIND++\n\
  \                  ;;\n        verbose ) VERBOSE='echo' ;;\n        * )\n      \
  \    echo \"unknown long argument: $OPTARG\"\n          exit\n          ;;\n   \
  \   esac\nesac\n```\n```\n#- --------------------------------------------------\n\
  \    ;; \n    : ) echo \"error: no argument supplied\" ;;\n    * ) \n    echo \"\
  error: unknown option $OPTARG\"\n    echo \"      valid options are: aov\"\n   \
  \ ;;\nesac\ndone\nshift $((OPTIND -1))\n```\n\n这如何支持长格式选项？这里到底发生了什么？\n\n- 1. 考虑\
  \ getopts 是为处理单字符选项（例如 -a）而设计的。将减号添加到选项列表意味着 -- 将被识别为有效选项。\n\n- 2. 两个减号后的任何剩余字符都被视为\
  \ -- 选项的“参数”，并放入 $OPTARG 变量中。我们可以使用内部 case 语句将 $OPTARG 的值与我们想要实现的长度选项名称进行匹配。\n\n\
  - 3. 那么，对于需要用户提供参数的选项，例如 --outfile，会发生什么？如果参数使用等号语法提供（例如 --outfile=my.txt），则 getopts\
  \ 会将整个字符串（-- 之后的部分）分配给 OPTARG。我们可以使用 bash 的参数扩展字符串操作（参见第 32 页的“参数扩展”）从选项字符串中提取参数，使用\
  \ (#) 删除所有字符 (*) 直到且包括等号 (=) 的表达式。那就只剩下等号后的字符，这就是我们想要的参数。我们也可以更字面地编码要删除的字符串，例如使用\
  \ OFILE=\"${OPTARG#outfile=}\" 来从 OPTARG 前面删除该文本。\n\n- 4. 当参数作为单独的词提供时，我们 case 语句中的第二个\
  \ outfile 模式将被采用。这里我们使用了一个变量 $OPTIND，getopts 用它来跟踪其解析。文件名参数使用 ${!OPTIND} 间接检索。它是如何工作的？\n\
  \n- 5. 使用 getopts 时，shell 变量 $OPTIND 保存 getopts 下一个要处理的参数的索引。! 表示使用间接引用——取 $OPTIND\
  \ 的值并将其用作要检索的变量的名称。例如，如果 --output 是 getopts 遇到的第三个参数，则此时 $OPTIND 将具有值 4，因此 ${!OPTIND}\
  \ 将返回 ${4} 的值，即下一个参数，即文件名。\n\n\n\n\n\n6 然后我们还需要“移动” $OPTIND，因为我们已经处理过它了。\n\n其余脚本与我们之前介绍的一样。\n\
  \n## HELP!\n\n前面的示例中有一个明显的遗漏；你需要帮忙找出它吗？（那是个提示。）对，-h 和/或 --help 缺失了。我们强烈建议按需输出某种使用说明或帮助信息；它易于发现，与大多数其他工具的工作方式一致，而且一旦你知道方法就很容易实现。\n\
  \n如果你有一个非常简单的脚本，示例 8-3 显示了一个快速而粗糙的解决方案。\n\n### Example 8-3. Quick-and-dirty help\n\
  \n```\nPROGRAM=$({0##*/})  # bash version of `basename`\nif [ $# -lt 2 -o \"$1\"\
  \ = '-h' -o \"$1\" = '--help' ]; then\n  # Tab indents below, starting after the\
  \ EoH (End-of-Help) line!\n  cat <<-EoH\n    This script does nothing but show help;\
  \ a real script should be more exciting.\n    usage: $0 <foo> <bar> (<baz>)\n\n\
  \    As you can see, there are two required arguments, +foo+ and +bar+, and one\n\
  \    optional argument, +baz+.\n    e.g.\n    usage: $PROGRAM foo bar\n    usage:\
  \ $PROGRAM foo bar baz\n\n    You can put more detail here if you need to.\n  EoH\n\
  \  # Tab indents above!\n  exit 1\nfi\n```\n\n1 我们在第 32 页的“Shorthand for basename”中谈到过这个。\n\
  \n2 如果 $#（参数计数）是 -lt（小于）2，或者第一个参数是 -h，或者第一个参数是 --help，则使用一个 here-document 来显示帮助和使用信息。（我们在第\
  \ 98 页的“Here-Documents and Here-Strings”中讨论了这些。）\n\n3 启动一个 <<（here-document）直到我们到达\
  \ EoH，即 end-of-help，但也可以是 EOF 或你喜欢的任何其他名称。它包含一个 -，因此会剥离块中开头的制表符（但不剥离空格），这允许你在代码中缩进而不在输出中缩进。\n\
  \n4 end-of-help 标记也用制表符缩进以匹配其余内容。\n\n5 我们可以争论在那里 exit code（“Exit Codes” 第 96 页）exit\
  \ 0 表示成功还是 exit 1（实际上大于零的任何值）表示失败是否正确。如果我们请求帮助，那么我们刚刚得到了它，并且它成功了，所以 exit 0。但如果我们没有提供正确的参数，那么我们就失败了，所以\
  \ exit 1。此外，脚本除了显示消息之外未能真正做任何有用的事情，所以这也可以算作 exit 1 失败。选择一个标准并坚持下去，但 exit 1 是一个更好的\
  \ fail-safe。\n\n我们还在这里内联了 help/usage 消息，但有时让它成为自己的函数是有意义的，这样如果需要你就可以从其他地方调用它，正如我们在示例\
  \ 8-4 中看到的那样。\n\n### Example 8-4. getopts argument parsing: long with help\n\n```\n\
  #!/usr/bin/env bash\n# parselonghelp.sh: Use getopts to parse these arguments, including\
  \ long & help\n##### Original Author & date: _bash Idioms_ 2022\n# bash Idioms filename:\
  \ examples/ch08/parselonghelp.sh\n#\n# Long arguments: --amode and --help\n#   \
  \              and --outfile filename or --outfile=filename\n\nPROGRAM=${0##*/}\
  \  # bash version of `basename`\nVERSION=\"$PROGRAM v1.2.3\"\n\nVERBOSE=':'   #\
  \ Default is off (no-op)\nDEBUG=':'     # Default is off (no-op)\n\nfunction Display_Help\
  \ {\n    # Tab indents below, starting after the EoN (End-of-Note) line!\n    cat\
  \ <<-EoN\nThis script does nothing but show help; a real script should be\nmore\
  \ exciting.\n        usage: $PROGRAM (options)\n\nOptions:\n    -a | --amode   \
  \ = Enable \"amode\", default is off\n    -d | --debug    = Include debug output,\
  \ default is off\n    -h | --help     = Show this help message and exit\n    -o\
  \ | --outfile  = Send output to file instead of STDOUT\n    -v | --verbose  = Include\
  \ verbose output, default is off\n    -V | --version  = Show the version and exit\n\
  \nYou can put more detail here if you need to.\nEoN\n    # Tab indents above!\n\
  \    # If we have this next line, the script will always exit after calling\n```\n\
  \n```\n# Display_Help. You may or may not want that...you decide.\n# exit 1 # If\
  \ you use this, remove the other exits after the call!\n} # end of function Display_Help\n\
  \nwhile getopts ':-adho:vV' VAL ; do\ncase $VAL in\n# If you keep options in lexical\
  \ order, they are easier to find and\n# you reduce the chances of a collision\n\
  a ) AMODE=1 ;;\nd ) DEBUG='echo' ;;\nh ) Display_Help ; exit 1 ;;        # We violated\
  \ our style here\no ) OFILE=\"$OPTARG\" ;;\nv ) VERBOSE='echo' ;;\nV ) echo \"$VERSION\"\
  \ && exit 0 ;;   # We violated our style here too\n#-------------------------------------------------------------\n\
  - ) # This section added to support long arguments\n    case $OPTARG in\n      \
  \  amode      ) AMODE=1 ;;\n        debug      ) DEBUG='echo' ;;\n        help \
  \      )\n            Display_Help\n            exit 1\n            ;;\n       \
  \ outfile=* ) OFILE=\"${OPTARG#*=}\" ;;\n        outfile    )\n            OFILE=\"\
  ${!OPTIND}\"\n            let OPTIND++\n            ;;\n        verbose    ) VERBOSE='echo'\
  \ ;;\n        version    )\n            echo \"$VERSION\"\n            exit 0\n\
  \            ;;\n        * )\n            echo \"unknown long argument: $OPTARG\"\
  \n            exit\n            ;;\n    esac\n    ;;\n#-------------------------------------------------------------\n\
  : ) echo 'error: no argument supplied' ;;\n* )\n    echo \"error: unknown option\
  \ $OPTARG\"\n    echo \"  valid options are: aov\"\n    ;;\nesac\ndone\nshift $((OPTIND\
  \ -1))\n\necho \"Code for $0 goes here.\"\n\n$VERBOSE 'Example verbose message...'\n\
  \n```\n\n```\n$DEBUG 'Example DEBUG message...'\n\necho \"End of $PROGRAM run.\"\
  \n```\n\n我们把很多内容都打包到这个示例中，但你已经见过其中的大部分。我们在 long arguments 示例的基础上添加了 help，但我们还添加了一种简单的方法来拥有\
  \ debug 和 verbose 标志和输出。我们现在为 Display_Help 创建了一个函数，因为我们需要从至少两个地方调用它：短选项和长选项处理。这应该很清楚。\n\
  \n我们还违反了我们关于“one-liners”的 case..esac 风格指南，因为 exit 命令使其成为多行块。我们完全可以像在长选项部分那样将其展开，但我们从一行变成了四行……对清晰度没有提升，反而损失了三行垂直空间，而这些空间可能更适合显示更重要的代码：\n\
  \n```\nh ) Display_Help ; exit 1 ;;\n# Versus\nh )\n    Display_Help\n    exit 1\n\
  ;;\n```\n\n## Debug and Verbose\n\n在示例 8-4 中，我们将冒号设为变量 VERBOSE 的默认值。这可能看起来是个奇怪的值，但考虑一下脚本后面对该变量的示例用法：\n\
  \n```\n$VERBOSE 'Example verbose message...'\n```\n\n在默认情况下（如果用户未指定 verbose 模式），执行该行时，$VERBOSE\
  \ 会被替换为 :；即 no-op（无操作）或 null 命令（什么都不做，忽略其参数，并且始终为真）。因此不会打印任何消息。但如果用户使用 -v 或 --verbose\
  \ 调用脚本，则 $VERBOSE 会被替换为 echo，而要执行的行在效果上现在是这样的：\n\n```\necho 'Example verbose message...'\n\
  ```\n\n消息将被打印给用户查看。\n\n这种用于条件消息的习惯用法是简单易写、易读的代码，甚至在编写文档时也很容易 grep。你可以根据需要对 DEBUG\
  \ 使用相同的方法。\n\n## Version\n\n就像 -h 和/或 --help 一样，version 命令也很有用。首先，不过是 -v 表示 version\
  \ 还是 verbose？我们更喜欢 -V 表示 version，-v 表示 verbose（如果适用）。其次，你需要 version 吗？没有 help 那么重要，所以这真的取决于情况。像\
  \ CVS 和 SVN 这样的 gen2 版本控制系统让 version 变得容易——只需使用类似 VERSION=$Id$ 的关键字扩展。但像 Git 这样的\
  \ gen3 系统不支持这一点，所以你又回到了手动更新变量，或某种构建时或 CI（持续集成）递增器。对于较大或公开的脚本，这是有意义的；对于较小的个人脚本，可能就不需要了。由你决定。\n\
  \n你通过 VERSION=something 实现 version 并以与 help 相同的方式显示它。选择这个的 exit code（“Exit Codes”\
  \ 第 96 页）更容易，因为你只有在请求时才会得到 version 输出，所以 exit 0 显然是有意义的。\n\n你将 $VERSION 设为什么取决于你：\n\
  \n- VERSION=$Id$ 用于 CVS 或 SVN\n- VERSION=v1.2.3\n- VERSION=\"$PROGRAM v1.2.3\"\n\
  - VERSION=\"$0 v1.2.3\" # 可能不合适，因为 $0 会变化\n- VERSION=12\n\n#### Style and Readability:\
  \ Recap\n\n在本章中，我们讨论了 CLI 选项、参数和使用方法。我们展示了如何解析单个参数以及如何通过检查 $# 来在参数不足时不继续执行。然后我们描述了\
  \ bash 内置的 getopts 作为解析短格式和长格式选项的好方法。\n\n任何具有一定数量参数解析的脚本都应努力将该代码与脚本的核心功能分开。这通常最好通过在\
  \ case 语句中设置标志变量来实现，这些标志变量可以在脚本后面在功能实现的地方引用。通过将参数解析作为脚本中的一个单独函数，你可以极大地提高脚本的可读性。将示例\
  \ 8-4 包裹在一个函数定义中：\n\n```\n# Called like: parseargs \"${@}\"\nfunction parseargs\
  \ {\n  ...\n}\n```\n\n然后用 parseargs \"${@}\" 调用它，你的脚本其余部分就可以跟随，使用 parseargs 函数中设置的标志。\n\
  \n\n\n\n\n添加大量条件调试信息或扩展（详细）输出会在这些语句被 if 语句包裹时削弱简洁性和整体可读性。它们会使代码逻辑变得杂乱和复杂。我们展示了一种习语，提供相同的输出选择，但避免了使用\
  \ if 语句的需求，使编码风格更简单，可读性更高。\n\n## Files and More\n\n是什么让一个普通的旧文件成为 shell 脚本，以及你如何发出退出码？你如何读取文件？我们将在本章中讨论所有这些内容——以及更多。\n\
  \n## Reading Files\n\n将文件读入 bash 脚本有三种主要惯用方法。其中一些会将整个文件“slurp”到内存中，而其他方法则一次处理一行。\n\
  \n### read\n\n我们已经在第 2 章中使用 read 处理键/值对，并在第 104 页的“Getting User Input”中再次看到它，但另一个主要用途是逐行读取文件并解析输入：\n\
  \n```\n$ grep 'nobody' /etc/passwd | read -d':' user shadow uid gid gecos home shell\n\
  \n$ echo \"$user | $shadow | $uid | $gid | $gecos | $home | $shell\"\n```\n\n等等，发生了什么？我的数据去哪了？好吧，这是一个陷阱——它进入了由管道\
  \ (|) 创建的子 shell，并且再也没有出来。那这个呢？\n\n```\n$ grep 'nobody' /etc/passwd | { \\\n   \
  \ read -d':' user shadow uid gid gecos home shell; \\\n    echo \"$user | $shadow\
  \ | $uid | $gid | $gecos | $home | $shell\" \\\n}\nnobody | | | | | |\n```\n\n好一点，但剩下的去哪了？好吧，-d\
  \ 是行尾分隔符，而不是字段分隔符 ($IFS)。再试一次：\n\n```\n$ grep '^nobody' /etc/passwd | { \\\n  read\
  \ -d':' user shadow uid gid gecos home shell; \\\n  echo \"$user | $shadow | $uid\
  \ | $gid | $gecos | $home | $shell\" \\\n}\nnobody | x | 65534 | 65534 | nobody\
  \ | /nonexistent | /usr/sbin/nologin\n```\n\n另见第 89 页的“Fiddling with $IFS for Fun\
  \ and Profit, to Read Files”。\n\n![](img/553ffa1bc15093729b691f706befc0ac_101_0.png)\n\
  \n### lastpipe\n\n如果你运行的是 bash 4+，可以设置 shopt -s lastpipe，这将使管道的最后一个命令在当前 shell 中运行，以便你的脚本可以看到环境。请注意，这仅在作业控制被禁用时才有效，而这是在脚本中默认的，但在交互式会话中不是。你可以使用\
  \ set +m 禁用作业控制，但这会禁用 CTRL-C、CTRL-Z、fg 和 bg，所以我们不建议这样做。\n\n### mapfile\n\nmapfile\
  \ 也称为 readarray，但它们是同一个命令。添加到 bash v4 中，mapfile 将文件读入数组（列表）并具有选项可一次读取仅 -n count\
  \ 行、跳过 -s count 行、显示进度指示器（-c/-C）等。这比其他方法更容易使用。\n\n简单的用法，嗯，很简单，它会将整个文件“slurp”到内存中，如示例\
  \ 9-1 所示。\n\nExample 9-1. Simple mapfile\n\n```\nmapfile -t nodes < /path/to/list/of/hosts\
  \  # -t removes newlines\n```\n\n```\n# Loop around the nodes\nfor node in ${nodes[@]};\
  \ do\n  ssh $node 'echo -e \"$HOSTNAME:\\t$(uptime)\"'\ndone\n```\n\n使用 -n 会稍微复杂一些，因为虽然\
  \ mapfile 会继续读取无内容，所以你必须检查它是否真的获取了数据（${#nodes[@]} 非零），否则你会创建一个无限循环（示例 9-2）。\n\n\
  ### Example 9-2. Batch mapfile example\n\n```\nBATCH=10\n# While we're reading data...\
  \   && there is still data there!\nwhile mapfile -t -n $BATCH nodes && (( ${#nodes[@]}\
  \ )); do\n    for node in ${nodes[@]}; do\n        ssh $node 'echo -e \"$HOSTNAME:\\\
  t$(uptime)\"'\n    done\ndone < /path/to/list/of/hosts\n```\n\n当然，你可以做得更花哨，并添加一些运行时用户反馈。你可能还需要出于各种原因限制你的进程，所以你可以做类似示例\
  \ 9-3 中的代码。\n\n### Example 9-3. Fancy mapfile example: code\n\n```\n#!/usr/bin/env\
  \ bash\n# fancy_mapfile.sh: Fancy `mapfile` example\n##### Original Author & date:\
  \ _bash Idioms_ 2022\n# bash Idioms filename: examples/ch09/fancy_mapfile.sh\n#####\
  \ ----------------------------------------------------------------------------\n\
  # Does not work on Zsh 5.4.2!\n\nHOSTS_FILE='/tmp/nodes.txt'\n\n# Create test file\n\
  > $HOSTS_FILE\nfor n in node{0..9}; do echo \"$n\" >> $HOSTS_FILE; done\n\n### ADJUSTABLE\
  \ VARIABLES\n#BATCH_SIZE=0  # Do the entire file at once (default); watch out for\
  \ memory\nBATCH_SIZE=4\nSLEEP_SECS_PER_NODE=1     # Can set to 0\nSLEEP_SECS_PER_BATCH=1\
  \    # Set to zero if `BATCH_SIZE=0`!\n\n# Display runtime feedback to STDERR (so\
  \ STDOUT can go into `tee` or a file)\nnode_count=\"$(cat $HOSTS_FILE | wc -l)\"\
  \nbatch_count=\"$(( node_count / BATCH_SIZE ))\"\necho '' 1>&2\necho \"Nodes to\
  \ process:          $node_count\" 1>&2\necho \"Batch size and count:      $BATCH_SIZE\
  \ / $batch_count\" 1>&2\necho \"Sleep seconds per node:    $SLEEP_SECS_PER_NODE\"\
  \ 1>&2\necho \"Sleep seconds per batch:   $SLEEP_SECS_PER_BATCH\" 1>&2\necho ''\
  \ 1>&2\n\nnode_counter=0\nbatch_counter=0\n# While we're reading data...   && there\
  \ is still data in $HOSTS_FILE\nwhile mapfile -t -n $BATCH_SIZE nodes && (( ${#nodes[@]}\
  \ )); do\n    for node in ${nodes[@]}; do\n        echo \"node $(( node_counter++\
  \ )): $node\"\n```\n```\nsleep $SLEEP_SECS_PER_NODE\ndone\n(( batch_counter++ ))\n\
  # Don't get stuck here AFTER the last (partial) batch...\n[ \"$node_counter\" -lt\
  \ \"$node_count\" ] && {\n    # You can also use `mapfile -C Call_Back -c $BATCH_SIZE`\
  \ for feedback but\n    # it runs the callback up front too, so if you have a delay\
  \ you'll\n    # have to wait for that\n    echo \"Completed $node_counter of $node_count\
  \ nodes;\" \\\n        \"batch $batch_counter of $batch_count;\" \\\n        \"\
  sleeping for $SLEEP_SECS_PER_BATCH seconds...\" 1>&2\n    sleep $SLEEP_SECS_PER_BATCH\n\
  }\ndone < $HOSTS_FILE\n```\n\n- 1. 为此示例创建一个简单的测试文件。\n- 2. 这不是“无用的 cat 使用”。通常 wc\
  \ -l 输出为 <行数> <文件名>，但我们只想要 <行数>，而没有该选项。当从 STDIN 读取时，wc 不会显示文件名，这正是我们想要的。\n- 3. 请记住，bash\
  \ 仅做整数运算，因此批次数可能会有截断错误。\n- 4. 仅整数运算；参见之前的说明。\n- 5. 你注意到我们在 for 循环中懒惰地没有对 ${nodes[@]}\
  \ 加引号了吗？我们可以用它，因为我们读取的是主机名，它们不允许空格。但最好养成一致的习惯并使用引号。\n\n输出如示例 9-4 所示。\n\n### Example\
  \ 9-4. Fancy mapfile example: output\n\n```\nNodes to process:      10\nBatch size\
  \ and count:  4 / 2\nSleep seconds per node: 1\nSleep seconds per batch: 1\n\nnode\
  \ 0: node0\nnode 1: node1\nnode 2: node2\nnode 3: node3\nCompleted 4 of 10 nodes;\
  \ batch 1 of 2; sleeping for 1 seconds...\nnode 4: node4\nnode 5: node5\n```\n```\n\
  node 6: node6\nnode 7: node7\nCompleted 8 of 10 nodes; batch 2 of 2; sleeping for\
  \ 1 seconds...\nnode 8: node8\nnode 9: node9\n```\n\n另见：\n\n- - help mapfile.\n\
  - - 或 help readarray，但它只会指向 mapfile。\n- - 关于使用 mapfile 清理 AWS S3 存储桶的一个不错用例，请参阅\
  \ https://oreil.ly/xie4t。\n\n### Brute Force\n\n示例 9-5 显示了整个文件如何被“slurp”到内存中。\n\n\
  Example 9-5. Brute force file reading examples\n\n```\nfor word in $(cat file);\
  \ do\n  echo \"word: $word\"\ndone\n```\n\n```\n### Or, remove the \"useless use\
  \ of cat\"\nfor word in $(< file); do\n  echo \"word: $word\"\ndone\n```\n\n###\
  \ Fiddling with $IFS for Fun and Profit, to Read Files\n\n$IFS 是“内部字段分隔符”，用于所有单词分割。默认是\
  \ <空格><制表符><换行符>，或使用 $' ' ANSI C 引号机制的 IFS='$' \\t\\n'，这对 bash 习语至关重要。如果你更改 $IFS\
  \ 而不真正理解自己在做什么，可能会出现奇怪的事情。特别是 $IFS 的第一个字符，默认是空格，也用于单词扩展，如果你更改它，可能会导致混乱。如果你真的认为需要更改\
  \ $IFS 的值，要么在函数中使用 local，要么将其本地化到命令（参见第 110 页的“Local Variables”）。示例 9-6 说明了这一点。\n\
  \nExample 9-6. Changing IFS for read example: code\n\n```\n#!/usr/bin/env bash\n\
  # fiddle-ifs.sh: Fiddling with $IFS for fun and profit, to read files\n##### Original\
  \ Author & date: _bash Idioms_ 2022\n# bash Idioms filename: examples/ch09/fiddle-ifs.sh\n\
  #_______________________________________________________________\n```\n\n\n\n\n\
  # 创建测试文件（不拼写出“word”以保持输出 < 80 列）\nIFS_TEST_FILE='/tmp/ifs-test.txt'\ncat <<'EoF'\
  \ > $IFS_TEST_FILE\nline1 wd1 wd2 wd3\nline2 wd1 wd2 wd3\nline3 wd1 wd2 wd3\nEoF\n\
  \n#-------------------------------------------------------------------------------\n\
  echo 'Normal $IFS and `read` operation; split into words:'\nprintf 'IFS before:\
  \ %q\\n' \"$IFS\"\nwhile read line w1 w2 w3; do\n    printf 'IFS during: %q\\nline\
  \ = %q, w1 = %q, w2 = %q, w3 = %q\\n' \\\n        \"$IFS\" \"$line\" \"$w1\" \"\
  $w2\" \"$w3\"\ndone < $IFS_TEST_FILE\nprintf 'IFS after: %q\\n' \"$IFS\"\n\n#-------------------------------------------------------------------------------\n\
  echo ''\necho 'Temporary $IFS change for `read` inline:'\necho 'Words are NOT split,\
  \ yet $IFS appears unchanged, because only the read'\necho 'line has the changed\
  \ $IFS. We also shortened \"line\" to \"ln\" to make'\necho 'it fit a book page.'\n\
  printf 'IFS before: %q\\n' \"$IFS\"\nwhile IFS='' read line w1 w2 w3; do\n    printf\
  \ 'IFS during: %q\\nln = %q, w1 = %q, w2 = %q, w3 = %q\\n' \\\n        \"$IFS\"\
  \ \"$line\" \"$w1\" \"$w2\" \"$w3\"\ndone < $IFS_TEST_FILE\nprintf 'IFS after: %q\\\
  n' \"$IFS\"\n\n#-------------------------------------------------------------------------------\n\
  function Read_A_File {\n    local file=\"$1\"\n    local IFS=''\n\n    while read\
  \ line w1 w2 w3; do\n    printf 'IFS during: %q\\nline = %q, w1 = %q, w2 = %q, w3\
  \ = %q\\n' \\\n        \"$IFS\" \"$line\" \"$w1\" \"$w2\" \"$w3\"\n    done < $IFS_TEST_FILE\n\
  }\n\necho ''\necho 'Temporary $IFS change for `read` in a function; NOT split, $IFS\
  \ changed:'\nprintf 'IFS before: %q\\n' \"$IFS\"\nRead_A_File\nprintf 'IFS after:\
  \ %q\\n' \"$IFS\"\n\n#-----------------------------\necho ''\necho 'But you may\
  \ not need to change $IFS at all... See `help read` and'\necho 'note the parts about:'\n\
  echo '    ...leftover words assigned to the last NAME'\necho '    ...[read line\
  \ until] DELIM is read, rather than newline'\necho 'Normal $IFS and `read` operation\
  \ using only 1 variable:'\nprintf 'IFS before: %q\\n' \"$IFS\"\nwhile read line;\
  \ do\n    printf 'IFS during: %q\\tline = %q\\n' \"$IFS\" \"$line\"\ndone < $IFS_TEST_FILE\n\
  printf 'IFS after: %q\\n' \"$IFS\"\n\nThe output is shown in Example 9-7.\n\n# Example\
  \ 9-7. Changing IFS for read example: output\n\n```\nNormal $IFS and `read` operation;\
  \ split into words:\n$IFS before: $' \\t\\n'\nIFS during: $' \\t\\n'      line =\
  \ line1, w1 = wd1, w2 = wd2, w3 = wd3\nIFS during: $' \\t\\n'      line = line2,\
  \ w1 = wd1, w2 = wd2, w3 = wd3\nIFS during: $' \\t\\n'      line = line3, w1 = wd1,\
  \ w2 = wd2, w3 = wd3\nIFS after:  $' \\t\\n'\n```\n\nTemporary $IFS change for `read`\
  \ inline:\nWords are NOT split, yet $IFS appears unchanged, because only the read\
  \ line has the changed $IFS. We also shortened \"line\" to \"ln\" to make it fit\
  \ a book page.\n\n```\nIFS before: $' \\t\\n'\nIFS during: $' \\t\\n'      ln =\
  \ line1\\ wd1\\ wd2\\ wd3, w1 = '', w2 = '', w3 = ''\nIFS during: $' \\t\\n'   \
  \   ln = line2\\ wd1\\ wd2\\ wd3, w1 = '', w2 = '', w3 = ''\nIFS during: $' \\t\\\
  n'      ln = line3\\ wd1\\ wd2\\ wd3, w1 = '', w2 = '', w3 = ''\nIFS after:  $'\
  \ \\t\\n'\n```\n\nTemporary $IFS change for `read` in a function; NOT split, $IFS\
  \ changed:\n\n```\nIFS before: $' \\t\\n'\nIFS during: '' line = line1\\ wd1\\ wd2\\\
  \ wd3, w1 = '', w2 = '', w3 = ''\nIFS during: '' line = line2\\ wd1\\ wd2\\ wd3,\
  \ w1 = '', w2 = '', w3 = ''\nIFS during: '' line = line3\\ wd1\\ wd2\\ wd3, w1 =\
  \ '', w2 = '', w3 = ''\nIFS after:  $' \\t\\n'\n```\n\nBut you may not need to change\
  \ $IFS at all... See `help read` and note the parts about:\n    ...leftover words\
  \ assigned to the last NAME\n    ...[read line until] DELIM is read, rather than\
  \ newline\nNormal $IFS and `read` operation using only 1 variable:\n\n```\nIFS before:\
  \ $' \\t\\n'\nIFS during: $' \\t\\n'      line = line1\\ wd1\\ wd2\\ wd3\nIFS during:\
  \ $' \\t\\n'      line = line2\\ wd1\\ wd2\\ wd3\nIFS during: $' \\t\\n'      line\
  \ = line3\\ wd1\\ wd2\\ wd3\nIFS after:  $' \\t\\n'\n```\n\nSee also:\n\n+   - “Local\
  \ Variables” on page 110\n+   - “Reading Files” on page 85\n+   - “ANSI-C Quoting”\
  \ on the bash man page\n"
- "## Pretend Files\n\n我们都知道 UNIX、Linux 以及当然的 bash 认为一切都是文件，对吧？一切都是文件。那就是 The Way。但如果您只需要处理文件的一部分会怎样？也许您有一组节点定期报告统计信息，您想通过\
  \ diff 查看是否有节点出现或消失。让我们假设文件是制表符分隔的，并且每个节点有多条记录，节点名称作为第一个字段，但您按小时、天或任意时间聚合它们。\n\n\
  您可以使用临时文件，尽管这很繁琐：\n\n```\ncut -f1 /path/to/previous-report.log | sort -u > /tmp/previous-report.log\n\
  cut -f1 /path/to/current-report.log | sort -u > /tmp/current-report.log\ndiff /tmp/previous-report.log\
  \ /tmp/current-report.log\nrm /tmp/previous-report.log /tmp/current-report.log\n\
  ```\n\n相反，您可以使用这些“假文件”来做同样的事情：\n\n```\ndiff <(cut -f1 /path/to/previous-report.log\
  \ | sort -u) \\\n    <(cut -f1 /path/to/current-report.log | sort -u)\n```\n\n好吧，它其实叫做进程替换（在示例\
  \ 9-8 中说明），但我们觉得假文件听起来更有趣。\n\nExample 9-8. Simple process substitution example\n\
  \n```\n$ head *report.log\n==> current-report.log <==\nalways-talking\nalways-talking\n\
  always-talking\nalways-talking\n\n==> previous-report.log <==\nalways-talking\n\
  going-away\nalways-talking\ngoing-away\nalways-talking\ngoing-away\nalways-talking\n\
  going-away\n```\n\n```\n$ diff -u <(cut -f1 previous-report.log | sort -u) \\\n\
  <(cut -f1 current-report.log | sort -u)\n--- /dev/fd/63 2022-01-09 20:01:37.857658587\
  \ -0500\n+++ /dev/fd/62 2022-01-09 20:01:37.857658587 -0500\n@@ -1,2 +1 @@\nalways-talking\n\
  -going-away\n```\n"
- "## Drop-in Directories\n\n在很多不同的上下文中都能看到的一种习惯用法就是一个目录，您可以向其中添加或删除文件以实现某种效果。这对于使用\
  \ RPM（Red Hat Package Manager）或 Debian APT（Advanced Package Tool）等包管理系统 Linux 发行版来说非常方便，因为包可以在安装时添加文件或在卸载时删除文件，而无需以编程方式编辑文件。/etc/cron.d/\
  \ 就是一个完美的例子；包可以在安装时轻松添加 cron 作业，并在卸载时删除这些作业，而不影响其他任何东西。\n\n如果支持，我们非常喜欢这种技术用于配置文件。例如，您可以有一个\
  \ /etc/syslog-ng/syslog-ng.conf 文件，其中包含 @include \"/etc/syslog-ng/syslog-ng.local.d\"\
  ，然后您可以将文件放入 /etc/syslog-ng/syslog-ng.local.d/ 以根据特定节点的需求调整配置。\n\n您也可以在 bash 代码中非常容易地做到这一点（示例\
  \ 9-9）。\n\nExample 9-9. Include drop-in files\n\n```\n# Source local overrides IF\
  \ any exist AND are executable\nfor config in /etc/myscript.cfg.d/*; do\n  # Override\
  \ files MUST be EXECUTABLE or they will be ignored, which makes\n  # it easy to\
  \ disable them.\n  [ -x \"$config\" ] && source \"$config\"\n  # Or change `-x`\
  \ to `-r` to use readable instead of executable\ndone\n```\n\n这个想法建立在第 23 页的“Wrapper\
  \ Scripts”之上，因此您可以为自己或用户构建简单、可扩展且功能强大的工具。您编写一个简单的骨架脚本，其中包含一些逻辑来在目录中查找“action”命令，以及一些胶水代码来将这些命令组合在一起并提供使用或帮助。然后您添加一个新模块或操作模板，您或您的用户只需复制模板并填写详细信息即可轻松添加新功能。\n"
- "## Using a Library\n\n如果您有大量经常使用的代码，也许是一个使用 printf %(datefmt)T 的 Log 函数（参见第 57\
  \ 页的“Getting or Using the Date and Time”），将其放入库中以减少“WET”¹ 代码和维护是有意义的。当然，一旦这样做，您就会遇到通常的库问题：部署和调用它。部署取决于您自己的通用流程和实践，但我们可以帮助调用它。\n\
  \n具有讽刺意味的是，您将有重复的“样板”代码来调用您的库，并且您无法将其提取到库中，否则导入过程会变得循环。但由于您有用于头注释等的模板（对吧？），您可以只添加示例\
  \ 9-10 中显示的代码。\n\n# Example 9-10. Sourcing a bash library\n\n```\n# Source our library\n\
  source /path/to/global/bash-library.lib || {\n    echo \"FATAL: $0 can't source\
  \ '/path/to/global/bash-library.lib'\"\n    exit 1\n}\n```\n\n我们本可以定义 GLOBAL_LIBRARY=/path/to/global/bash-library.lib，但对于样板代码中的两次使用，似乎不值得。如果您足够聪明，您会将一组全局配置变量构建到该库中，并且您将允许使用节点本地\
  \ drop-in 目录（参见第 93 页的“Drop-in Directories”）覆盖变量甚至库函数。\n"
- '## Shebang!


  是什么让一个普通的旧文件成为 shell 脚本？Shebang！


  我们认为“shebang”听起来像是一个咒语，事实上它是一个神奇的咒语，告诉内核（而不是守护进程）如何处理您的代码。我们说的是脚本的第一行 #!/bin/bash
  或可能是 #!/bin/sh，当然。#! 巧妙地充当注释和魔数，告诉内核查找解释器，在本例中为 bash。


  Linux 上最常见的 bash shebang 是 #!/bin/bash，但您经常会看到 #!/bin/sh 和 #!/bin/bash -，您可能会看到
  #!/usr/bin/env bash、#!/usr/bin/bash 或其他路径。


  1 WET: We Enjoy Typing，与 DRY: Don’t Repeat Yourself 相反。






  我们建议使用 #!/bin/bash - 或 #!/usr/bin/env bash。我们强烈不建议使用 #!/bin/sh，除非你是有意将代码限制在 Bourne
  shell 兼容性上，换句话说不使用“bashism”。过去在 Linux 上这样做是可以的，但许多 Linux 发行版已改用 Debian Almquist
  shell 或 dash 作为 /bin/sh，因为它比 bash 更小更快，运行脚本时速度更快，就像系统启动时使用的所有脚本一样。但当你真正需要 bash 时使用
  sh 是一个坏主意，因为正如我们刚才所说，它很脆弱并且掩盖了程序员的意图。


  #!/usr/bin/env bash 可移植性更高，因为只要 bash 在 $PATH 中，它就会去找到它。当 bash 不在 /bin/ 中时，这非常有用，这在
  BSD、Solaris 和其他非 Linux 系统上就是这种情况。唯一的问题是，生成 env，然后搜索 $PATH，然后用 bash 替换自身的开销更慢。有了现代计算机的资源，这几乎从不重要，但如果你在受限系统上开发或在短时间内运行大量脚本或实例，这种开销会累积起来（示例
  9-11）。


  ### 示例 9-11. Shebang 速度测试


  ```

  $ head examples/ch09/shebang*

  ==> examples/ch09/shebang-bash.sh <==

  #!/bin/bash -

  :


  ==> examples/ch09/shebang-env.sh <==

  #!/usr/bin/env bash

  :


  $ time for ((i=0; i<1000; i++)); do examples/ch09/shebang-bash.sh; done

  real    0m3.279s

  user    0m1.273s

  sys     0m0.915s


  $ time for ((i=0; i<1000; i++)); do examples/ch09/shebang-env.sh; done

  real    0m4.291s

  user    0m1.313s

  sys     0m1.425s

  ```


  需要提到的另一个细节是我们展示的尾随 -。这是为了防止非常古老的解释器欺骗攻击；有关详细信息，请参阅 Unix FAQ 的第 4.7 节。Linux 内核（但其他内核不这样做！）将第一个“单词”之后的所有内容（在本例中为
  /bin/bash）视为单个参数，因此我们用“结束参数”的连字符“使用”该参数。请注意，这在 #!/usr/bin/env bash 中不需要，因为 bash
  部分本身就是参数。

  '
- '## 非官方 bash 严格模式


  Perl 有一个 use strict 指令，用于“限制不安全构造”，如果未在之前使用变量声明和初始化变量等，它会触发语法检查或运行时错误。非官方 bash 严格模式文章认为以下内容在
  bash 中做了同样的事情（在精神上）：


  ```

  set -euo pipefail

  IFS=$''\n\t''

  ```


  我们并不完全同意那样更改 $IFS，因为这会破坏很多 bash 习惯用法（参见第 89 页的“为乐趣和利润而摆弄 $IFS，以读取文件”）。作者提出了很好的论点，但这可能需要大量工作来迁移遗留代码。set
  命令非常好：


  - -e 将在第一次出错时退出整个脚本。

  - -u 将在你使用未设置变量时退出整个脚本。

  - -o pipefail 将在管道中任何命令，而不仅仅是最后一个命令，以非零退出时使管道失败。


  添加 -u 会破坏很多现有脚本，但修复起来会很容易，而且你可能会发现一些你不知道的变量名拼写错误，这正是重点所在。-eo pipefail 最初可能破坏得更少，而当它确实“破坏”脚本时，该脚本可能早已损坏，但错误被掩盖了，这些选项只是揭露了问题。


  这绝对值得考虑，也许可以添加到你的模板和风格指南中。


  另请参阅：


  - http://redsymbol.net/articles/unofficial-bash-strict-mode

  - help set

  - https://perldoc.perl.org/strict

  '
- '## 退出代码


  如果没有特别说明，你的 bash 脚本将以最后运行的命令的退出（或返回）代码退出。有时这没问题，有时你可能需要在执行健全性检查失败后或出于其他条件提前退出。


  在 bash 中，零表示 *成功*，非零表示失败。这与许多其他语言相反，但原因是有一种成功方式但有许多失败方式，你可能需要表示失败的方式，例如：


  ```

  if grep --quiet "$HOSTNAME" /etc/hosts; then ...

  ```


  bash 退出代码只有八位，因此最大值是 255，但你希望返回代码值保持在 125 及以下，因为 126 及以上已被占用，如表 9-1 所示。


  ### 表 9-1. bash 退出/返回代码


  | Exit/return code | Use/description |

  |---|---|

  | 0 | Success |

  | 1–125 | User-defined failure |

  | 2 | bash builtins incorrect usage |

  | 126 | Command found but not executable |

  | 127 | Command not found |

  | 128–255 | Command exited with signal N-128 |


  另请参阅 GNU 文档关于退出状态。


  用于以“退出代码”退出整个脚本的命令是，等一下，exit n。用于从函数返回的命令是，再次，等一下，return n，其中“n”是之前定义的可选参数。请记住 return
  返回的是退出代码，而不是值。“n”可以是任何 shell 表达式，如 5 或 $val 或更复杂的表达式。请记住如果未给出“n”，状态为最后运行命令的状态。


  另请参阅我们在第 79 页“HELP!”中关于 exit 0 或 exit 1 的帮助和用法讨论。

  '
- "## 这是个陷阱！\n\ntrap 内置命令（help trap）允许你在脚本接收到信号时执行代码，其中包括脚本退出时。这是一个很好的地方放置“清理”代码，即使有人\
  \ CTRL-C（但不是 kill -9）脚本也能工作。你也可以用它运行调试代码，但对于这种简单情况，只需使用 set -x 或在 bash -x 下运行即可。运行\
  \ trap -l 列出系统支持的所有信号，或 trap -p <signal> 显示与该信号关联的 trap 命令。\n\ntrap 的典型用途是清理脚本，如前所述。语法是\
  \ trap [-lp] [[arg] signal_spec ...]，而 arg 可以是自包含的代码，但最好只是定义一个函数然后调用它会更清晰。这看起来像示例\
  \ 9-12（输出显示在示例 9-13 中）。\n\n### 示例 9-12. 临时 trap 示例：代码\n\n```\n#!/usr/bin/env bash\n\
  # trivial_trap.sh: Trivial bash trap example\n##### Original Author & date: _bash\
  \ Idioms_ 2022\n# bash Idioms filename: examples/ch09/trivial_trap.sh\n# --------------------------------------------------------------------------------\n\
  # Does not work on Zsh 5.4.2!\n\nfunction Cleanup {\n    echo \"$FUNCNAME was triggered!\
  \  Cleaning up...\"\n}\n\necho \"Starting script $0...\"\n\necho 'Setting the trap...'\n\
  # Will call Cleanup on any of these 6 signals\ntrap Cleanup ABRT EXIT HUP INT QUIT\
  \ TERM\n\necho 'About to exit...'\n```\n\n### 示例 9-13. 临时 trap 示例：输出\n\n```\nStarting\
  \ script examples/ch09/trivial_trap.sh...\nSetting the trap...\nAbout to exit...\n\
  Cleanup was triggered!  Cleaning up...\n```\n\n另请参阅 GNU 文档关于 trap 和第 120 页的“bash\
  \ 调试”。\n"
- '## Here-Documents 和 Here-Strings


  其他语言有类似的构造，比如 C 的 /* ... */，和 Python 的 '''''' ... ''''''，但 bash 有一些有趣的习惯用法用于 here-documents
  和 here-strings。我们在示例 8-3 中使用过 here-document，但还有更多需要讨论和解码的内容。


  Here-documents 用于在不需要大量分隔符和命令的情况下包含并经常显示文本块。


  Here-document 语法是 [fd]<<[-]["''"]word["''"]，其中“fd”是可选的（且很少使用）文件描述符，- 是一个表示“删除前导制表符但不删除空格”的标志，可选引号表示“不插值内容”。word
  本身不受参数、变量、算术或文件名扩展或命令替换的影响。举例来说，这意味着它不能是变量。如果 word 的任何部分被引用，则不会对文档进行插值。我们建议只使用单引号，因为它们在
  bash 中防止其他地方的插值，因此含义一致，而使用双引号则不然。


  实际上，使用 - 意味着你可以在代码中缩进 here-document（但只能使用制表符），同时在文档本身中不保留该缩进，而不加引号意味着你可以在其中使用变量。正如我们在示例
  8-3 中看到的那样，这对于显示包含脚本名称和路径的用法消息非常有用，而无需大量 echo 或 printf 行和引号。我们在后面也将其用于第 115 页的“嵌入式文档”。


  Here-strings 看起来像 [fd]<<word，这似乎相似，但在这种情况下 word 本身会受到参数、变量和算术扩展的影响；命令替换；和引号删除。它们本质上是一个没有分隔符的更简单的
  here-document，结果是一个字符串，并附加换行符。


  参见 GNU 文档关于 here-documents 和 here-strings。

  '
- "## 我们是交互式的吗？\n\n有时你的代码需要知道它是否在交互式会话中运行。它可能需要知道这一点，因为它会改变行为，比如请求输入，或者你可能只想为交互式 shell\
  \ 设置某些配置选项。\n\nGNU 文档关于交互式 shell 说要使用以下其中一种，因此你会经常看到这些或其变体：\n\n```\ncase \"$ -\"\
  \ in\n  *i*) echo This shell is interactive ;;\n  *)   echo This shell is not interactive\
  \ ;;\nesac\n```\n\n或：\n\n```\nif [ -z \"$PS1\" ]; then\n  echo This shell is not\
  \ interactive\nelse\n  echo This shell is interactive\nfi\n```\n\n你也可以考虑 -t FD 测试，如果文件描述符打开在终端上则为真。如果未指定文件描述符，则使用\
  \ 0（STDIN）。你可以将其与其他测试结合，比如 bash 本身，例如：\n\n```\n# Only if bash in a terminal!\nif\
  \ [ -t 1 -a -n \"$BASH_VERSION\" ]; then\n  echo 'bash in a terminal'\nelse\n  echo\
  \ 'NOT bash in a terminal'\nfi\n```\n\n\n\nor:\n\n```\n# Only if *interactive* bash\
  \ in a terminal!\nif [ -t 1 -a -n \"$PS1\" -a -n \"SBASH_VERSION\" ]; then\n  echo\
  \ 'Interactive bash in a terminal'\nelse\n  echo 'NOT interactive bash in a terminal'\n\
  fi\n```\n\n注意我们故意使用了 []（test）而不是 [[]]（bash 条件），因为其要点之一是此代码可能在非 bash 环境中运行，而该环境不支持\
  \ [[]]（例如 dash）。\n\n## Summary\n\n本章介绍的是那些并不漂亮但你终究需要知道的惯用法。有很多种方法可以在 bash 中处理文件，通常涉及重定向和/或管道，因此我们展示了一些典型的\
  \ bash 模式。Bash 脚本本身也是文件，因此我们谈到了将文件变成可执行脚本或库的魔法咒语，如何退出并清理，以及其他有用的惯用法。虽然“here-documents”并不完全是文件，但它们经常取代单独的文本文件，或文件中的文件，我们在别处使用过它们，所以这里也有。\n"
- '## Beyond Idioms: Working with bash


  代码往往会增长。复杂性往往会增长。跟我们一起说：“‘临时’解决方案比任何东西都更永久！” 把这句话刻在石头上，并在你编写代码、思考编写代码以及当你想“嘿，我想我可以把这个自动化”时牢记在心。提前规划。保持灵活。保持简单。对你自己和他人都使其易于使用。


  好吧，但……什么？


  本章收集了一些我们想谈论的额外有用材料，但它们无处可放。我们或许可以说这里已经超出了纯“惯用法”的范畴，但这一切都是关于每天在 bash 提示符下完成工作的。


  当你编写那个“一次性”脚本时，花几分钟额外时间使用良好的名称并添加注释。最后，再花几分钟思考环境和代码可能如何演变，以及可能需要哪些更改或例外。在所有细节都清晰地记在脑海中时添加功能和灵活性，比六个月后要容易得多。这个代码真的“一次适合所有”（哈哈！），还是可能存在例外？case
  语句能否根据 $HOSTNAME 处理一些调整，或者你是否必须询问用户问题？你的脚本需要参数还是临时文件？也许它需要做一些 $RANDOM 选择？继续阅读。


  如今生活相当忙碌，工作更是如此。你能做些什么让它更简单？你能将源代码仓库结构与部署目标匹配起来，使其更容易映射事物去向吗？你能编写新的命令（脚本）来记住选项和细节吗？你能自动化原本繁琐的手动任务吗？很可能。我们希望我们在前几章中已经给你提供了很多工具来做所有这些，但在我们结束之前，我们还有一些想法可以增强灵活性和生活质量要谈论。

  '
- '## Prompts


  bash 提示符其实并没有真正的惯用法。你默认得到的提示符取决于你的 bash 来自何处以及配置文件如何被调整，每个用户都喜欢不同的提示符设置。但有一些事情需要注意。


  我们不会详细介绍如何控制提示符——这在 bash 文档、*bash Cookbook*（配方 16.2 及其他地方）以及网络上都有涵盖。请参阅以下内容：


  - https://www.gnu.org/software/bash/manual/html_node/Controlling-the-Prompt.html

  - http://www.bashcookbook.com/bashinfo/source/bash-4.2/examples/scripts.noah/prompt.bash

  - https://www.tldp.org/HOWTO/Bash-Prompt-HOWTO/index.html

  - https://sourceforge.net/projects/bashish


  我们将简要介绍不同的提示符，因为有一些新颖且鲜为人知的功能，如表 10-1 所示。


  Table 10-1. bash prompts


  | Prompt | Use | Default |

  |---|---|---|

  | PS0 | bash v4.4+ pre-execution prompt | None |

  | PS1 | Bourne/bash primary prompt | ''\s-\v\$ '' |

  | PS2 | Bourne/bash secondary prompt | ''> '' |

  | PS3 | bash select prompt | ''#? '' |

  | PS4 | bash debug parameter | ''+ '' |

  | PROMPT_COMMAND | command before $PS1 | None |


  ### PS0


  此提示符由交互式 shell 在你按下回车执行命令后，但在命令运行前显示。它可用于在命令运行前显示“开始时间”或其他标记（参见示例 10-1）。


  ### Example 10-1. Example bash pre-execution prompt


  ```

  PS0=''Start: \D{%Y-%m-%d_%H:%M:%S_%Z}\n''

  ```


  ```

  ### Note the difference between the prompt time and the start time

  [user@hostname:T2:L1:C5289:J0:2021-08-27_17:46:04_EDT]

  /home/user/bash-idioms$ ls -1 ch*

  Start: 2021-08-27_18:47:37_EDT

  ch01.asciidoc

  ...

  ```


  ### PS1


  这是继承自 Bourne shell 的主要 bash 提示符，你在 bash 中几乎所有交互时间都花在这里，因此值得理解和调整。示例 10-2 中显示的提示符让一些人抓狂，但它很有用，因为它提供了你可能需要的所有信息，非常适合复制粘贴到文档或故障单中。不过有一个问题。日期/时间是在提示符显示时显示的，如果那是几小时或几天前，就会令人困惑。你可以通过意识到这个问题并在开始新命令或会话前按几次回车来解决这个问题。或者，如果你使用
  bash v4.4+，你可以使用 PS0，如前例所示。请注意，C5275 命令历史编号在你把密码误输入 bash 历史记录时非常有用。只需 history -d
  5275 就搞定了。（参见 help history，并为使用前导空格省略历史命令本身而加分，参见示例 10-13。）


  ### Example 10-2. Example bash primary prompt


  ```

  export PS1=''\n[\u@\h:T\l:$SHLVL:C\! :J\j :D{%Y-%m-%d_%H:%M:%S_%Z}]\n$PWD\$ ''

  ```


  ```

  [user@hostname:T2:L1:C5275:J0:2021-08-27_16:51:20_EDT]

  /home/user/bash-idioms$

  ```


  ### PS2


  当你按下回车但尚未完成命令时会出现此提示，可能因为你尚未关闭引号或 here-document。


  ### PS3


  select 内置命令使用的提示符；参见第 107 页的“select”。


  ### PS4


  当 set -x 激活时，这是调试提示符，或许前缀更合适。注意第一个字符会根据 shell 嵌套级别重复，因此你希望它清晰可见。+ 是一个不错的选择；另见第 120
  页的“bash Debugging”。示例 10-3 或许有点繁忙，但信息丰富。


  ### Example 10-3. Example bash debug prompt


  ```

  export PS4=''+xtrace $BASH_SOURCE:$LINENO:$FUNCNAME: ''

  ```


  ### PROMPT_COMMAND


  示例 10-4 显示了一个在 $PS1 被求值并显示之前运行的命令。它用于各种用途，如更新 GUI 终端的窗口标题；显示有关环境的动态细节，例如你所在的 Git
  分支；甚至进行一些非常原始且不安全的日志记录。


  ### Example 10-4. Example bash PROMPT_COMMAND for logging


  ```

  ### This should be one line; it is broken to fit the page

  export PROMPT_COMMAND=''logger -p local1.notice -t "bashlog[$S]" \

  "SSH=$SSH_CONNECTION; USER=$USER; PATH=$PWD; COMMAND=$(fc -ln -1)"''

  ```


  ### bash Time Zone


  这并不是真正的 bash 惯用法，但这是一个不错的提示符技巧。bash 提示符默认以系统时区显示日期和时间，但你可以 export TZ=UTC 或其他时区来更改它。如果你更喜欢将
  GUI 保持在本地时区，但希望 bash 显示 UTC 以用于文档目的，或使本地 bash 时间显示与服务器显示匹配，这很有用。请注意，提示符 TZ 不会在你运行外部命令之前更改；仅按回车或运行
  bash 内置命令不会导致它更新。


  另见第 55 页的“Time for printf”了解更多日期和时间处理。

  '
- "### Getting User Input\n\n大多数时候，bash 脚本通过命令行参数获取用户输入，但有时你也可能需要询问输入。做到这一点有两种常见方法，即\
  \ read 和 select 内置命令。\n\n另见：\n\n- help read\n- help select\n\n### read\n\nread 从\
  \ STDIN 或文件描述符读取一行并将单词分配给变量列表，或分配到数组（列表）变量中，并且它有许多非常有用的选项（示例 10-5 所示）。\n\n\n\n\n\
  \n## 示例 10-5. bash 中 read 的帮助\n\n```\n$ bash --version\nGNU bash, version 4.4.20(1)-release\
  \ (x86_64-pc-linux-gnu)\n...\n```\n\n```\n$ help read\nread: read [-ers] [-a array]\
  \ [-d delim] [-i text] [-n nchars] [-N nchars] [-p prompt] [-t timeout] [-u fd]\
  \ [name ...]\nRead a line from the standard input and split it into fields.\n```\n\
  \n从标准输入读取一行，或如果提供了 -u 选项则从文件描述符 FD 读取。该行会被像词分割一样拆分为字段，第一字段分配给第一个 NAME，第二字段分配给第二个\
  \ NAME，依此类推，剩余的词分配给最后一个 NAME。只有 $IFS 中找到的字符才会被识别为词分隔符。\n\n如果没有提供 NAME，则读取的行会存储在\
  \ REPLY 变量中。\n\n### 选项：\n\n+   -a array    将读取的词按顺序分配给数组变量 ARRAY 的索引，从零开始\n+   -d\
  \ delim    继续读取直到读取到 DELIM 的第一个字符，而不是换行符\n+   -e          在交互式 shell 中使用 Readline\
  \ 获取该行\n+   -i text     使用 TEXT 作为 Readline 的初始文本\n+   -n nchars   读取 NCHARS 个字符后返回，而不是等待换行符，但在读取到分隔符之前如果字符少于\
  \ NCHARS 则仍会遵守分隔符\n+   -N nchars   仅在读取到恰好 NCHARS 个字符后返回，除非遇到 EOF 或 read 超时，忽略任何分隔符\n\
  +   -p prompt   在尝试读取之前输出字符串 PROMPT 且不带尾随换行符\n+   -r          不允许反斜杠转义任何字符\n+  \
  \ -s          不回显来自终端的输入\n+   -t timeout  如果在 TIMEOUT 秒内未读取到完整的输入行，则超时并返回失败。TMOUT\
  \ 变量的值是默认超时。TIMEOUT 可以是小数。如果 TIMEOUT 为 0，read 会立即返回，不尝试读取任何数据，仅在指定文件描述符上已有输入可用时返回成功。退出状态大于\
  \ 128 表示超时已超出\n+   -u fd       从文件描述符 FD 而不是标准输入读取\n\n### 退出状态：\n\n返回代码为零，除非遇到文件结束、read\
  \ 超时（此时大于 128）、变量赋值错误，或作为 -u 参数提供的无效文件描述符。\n\n一个非常有用的选项组合是 -eip，它允许你提示输入数据（-p），同时提供预填充的默认值（-i），并允许使用\
  \ Readline 功能（如箭头键；参见示例 10-13）来在接受之前编辑默认值（参见示例 10-6）。\n\n## 示例 10-6. 为用户输入提供可编辑的默认值\n\
  \n```\n$ read -ei 'default value' -p 'Enter something: '\nEnter something: default\
  \ value\n### Then we use readline features, like arrow keys, to change it\nEnter\
  \ something: changed: default value\n\n$ echo $REPLY\nchanged: default value\n```\n\
  \n另一个方便的选项是 -s，用于在输入密码时不显示密码（示例 10-7）。\n\n## 示例 10-7. 提示输入密码\n\n```\n$ read -sp\
  \ 'Enter the secret password: ' ; \\\necho -e \"\\n\\nShhhh, the password is: ~$REPLY~\"\
  \nEnter the secret password:\n\nShhhh, the password is: ~super secret~\n```\n\n\
  对于你的临时脚本，你也可以这样做，但请记住，没有什么比“临时”解决方案更永久的了：\n\n```\nread -n1 -p 'CTRL-C to abort or\
  \ any other key to continue...'\n```\n\n超时功能也很棒，用于请求可选输入但不会在无人时完全挂起脚本（参见示例 10-8）。\n\
  \n## 示例 10-8. 带超时的输入提示\n\n```\n$ time read -t 4 -p \"Are you there?\"\nAre you there?\n\
  real    0m4.000s\nuser    0m0.000s\nsys     0m0.000s\n```\n\nread 也用于读取文件和解析输入，正如我们在第\
  \ 85 页“read”中讨论的那样。\n\n## pause\n\n这主要是为了好玩，但如果你记得旧的 DOS/Windows pause 命令，在 bash\
  \ 中你这样做：\n\n```\n$ read -n1 -p 'Press any key to continue...'\nPress any key to\
  \ continue...\n```\n\n## select\n\n顾名思义，select 创建一个简单的菜单并允许你选择一个选项。是否要创建退出或中止选项，由你决定。类似的工具\
  \ dialog 拥有更多功能，但那不是 bash 的习惯用法，所以我们不涵盖它。\n\n一个简单的例子：\n\n```\n#!/usr/bin/env bash\n\
  # select-ssh.sh: Create a menu from ~/.ssh/config to set ssh_target,\n# then SSH\
  \ to it\n##### Original Author & date: _bash Idioms_ 2022\n# bash Idioms filename:\
  \ examples/ch10/select-ssh.sh\n##### ----------------------------------------------------------------------------\n\
  \n#ssh_config=\"$HOME/.ssh/config\"  # Real one\n# Replace the trailing 'select-ssh.sh'\
  \ with 'ssh_config'\nssh_config=\"${0%/*}/ssh_config\"  # Idioms test file\n\nPS3='SSH\
  \ to> '\nselect ssh_target in Exit \\\n  $(egrep -i '^Host \\w+' \"$ssh_config\"\
  \ | cut -d' ' -f2-); do\n  case $REPLY in\n    1|q|x|quit|exit) exit 0\n    ;;\n\
  \    *) break\n    ;;\n  esac\ndone\n\n# This is only an example, so echo what we\
  \ would have done\necho ssh $ssh_target\n```\n\n运行时看起来像这样：\n\n```\n$ examples/ch10/select-ssh.sh\n\
  1) Exit              3) gitlab.com          5) mythtv-be01\n2) git.atlas.oreilly.com\
  \  4) github.com          6) kitchen\nSSH to> 1\n\n$ examples/ch10/select-ssh.sh\n\
  1) Exit              3) gitlab.com          5) mythtv-be01\n2) git.atlas.oreilly.com\
  \  4) github.com          6) kitchen\nSSH to> 6\nssh kitchen\n```\n"
- "## 别名\n\n既然你正在阅读本书，你可能已经知道 alias 和 unalias 命令，但我们想涵盖几个重要点。首先，最佳安全做法是在需要删除别名时使用\
  \ \\unalias。开头的 \\ 会抑制别名扩展，从而防止恶意的 unalias alias 造成混乱。\n\n其次，一些 Linux 发行版喜欢为 root\
  \ 或所有用户设置“有帮助”的别名，因此你需要探索你发行版和环境中的默认值。特别是，你会看到 alias rm=rm -i 以及 cp 和 mv 的类似别名，你可能觉得这些别名可取也可能不可取。\n\
  \n示例 10-9 和 10-10 显示了两组你可能考虑使用的别名，或许放在你的 ~/.bashrc 文件中。将其中一些或全部放入你主目录的 .bashrc 文件中。\n\
  \n## 示例 10-9.  trivial DOS/Windows “兼容”\n\n```\nalias cls='clear'          # DOS-ish\
  \ for clear\nalias copy='cp'            # DOS-ish for cp\nalias del='rm'       \
  \      # DOS-ish for rm\nalias dir='ls'             # DOS-ish for ls\nalias ipconfig='ifconfig'\
  \  # Windows-ish for ifconfig\nalias md='mkdir'           # DOS-ish for mkdir\n\
  alias move='mv'            # DOS-ish for mv\nalias rd='rmdir'           # DOS-ish\
  \ for rmdir\nalias ren='mv'             # DOS-ish for mv/rename\nalias tracert='traceroute'\
  \ # DOS-ish for traceroute\n```\n\n## 示例 10-10. 示例别名\n\n```\n# Install `xclip` or\
  \ `xsel` for Linux copy and paste\nalias gc='xsel -b'        # \"GetClip\" get stuff\
  \ from right \"X\" clipboard\nalias pc='xsel -bi'       # \"PutClip\" put stuff\
  \ to right \"X\" clipboard\n# Or Mac: pbcopy/pbpaste\n# Or Windows: gclip.exe/pclip.exe\
  \ or getclip.exe/putclip.exe\n\n# Cleaner `df`\nalias df='df --print-type --exclude-type=tmpfs\
  \ --exclude-type=devtmpfs'\nalias diff='diff -u'      # Make unified diffs the default\n\
  alias locate='locate -i'  # Case-insensitive locate\nalias ping='ping -c4'     #\
  \ Only 4 pings by default\nalias vzip='unzip -lVm'   # View contents of ZIP file\n\
  alias lst='ls -lrt | tail -5' # Show this dir's 5 most recently modified files\n\
  \n# Tweaked from\n# https://oreil.ly/1SUg7\n```\n\n```\nalias randomwords=\"shuf\
  \ -n102 /usr/share/dict/words | perl -ne 'print qq(\\u$\\_);' \\\n| column\"\n```\n\
  \n有时让同一命令在不同主机上工作方式不同会很有用。你可以用 case 语句轻松做到这一点（示例 10-11）。\n\n## 示例 10-11. 不同主机的不同别名\n\
  \n```\ncase \"$HOSTNAME\" in\n  host1* )  # Linux, but only has `xclip`\n    alias\
  \ gc='xclip -out'      # Send X selection to STDOUT\n    alias pc='xclip -in'  \
  \     # Send STDIN to X selection\n  ;;\n\n  host2* )  # Mac\n    alias gc='pbpaste'\
  \         # Send Paste Buffer to STDOUT\n    alias pc='pbcopy'          # Send STDIN\
  \ to Paste Buffer\n  ;;\n\n  * )       # Linux default\n    alias gc='xsel -b' \
  \       # Send X clipboard to STDOUT\n    alias pc='xsel -bi'       # Send STDIN\
  \ to X clipboard\n  ;;\nesac\n```\n"
- "## 函数\n\n别名无法将参数传递到别名中间，但函数可以做到这一点，正如我们在第 6 章中介绍的那样。我们开始有点脱离习惯用法而更偏向配方，但我们无法抗拒示例\
  \ 10-12 中展示的方便的小函数。\n\n## 示例 10-12. 函数 mcd\n\n```\nfunction mcd {\n  \\mkdir -p\
  \ \"$1\"\n  \\cd \"$1\"\n}\n```\n\n当然，这非常 trivial，并且不做健全性或错误检查，也不允许设置权限（-m mode），但即使这个版本也是一个很好的节省时间工具，如果你经常创建目录。注意开头的\
  \ \\ 会抑制别名扩展，因此我们确保获得纯粹的 bash 内置。我们把扩展它作为读者的练习。\n\n\n\n\n\n## 局部变量\n\n我们在第 54 页的“Local\
  \ Variables”中谈到过这个问题，但简单回顾一下，local 命令只能在函数内部使用，用来声明对该函数而言是局部的变量。这是一种良好的编程实践，但如果你需要在函数之外拥有“局部”作用域，也有一个办法，而且常用的变量是内部字段分隔符\
  \ $IFS。通常你不想更改 $IFS，因为一旦更改，许多预期行为都会失效。但偶尔你确实想更改它，通常只在局部更改，你可以做到（即使在函数之外），方法是像下面我们将要谈到的\
  \ read 命令那样，在命令前加上变量赋值：\n\n```\nIFS=':' read ...\n```\n\n另请参阅第 89 页的“Fiddling with\
  \ $IFS for Fun and Profit, to Read Files”。\n\n## Readline 技巧\n\nReadline 是 bash\
  \ 用来读取和编辑命令行行的库。它可能被其他程序使用，但你可以在脚本中很容易地通过 read -e 来访问它。它有很多选项可以调整其行为，似乎许多用户并不了解它们。\n\
  \n你可以探索创建 ~/.inputrc 文件（参见 bind -f 命令），但只是为了好玩，你可以把下面这些添加到 ~/.bashrc 文件中（示例 10-13）。\n\
  \n### 示例 10-13. Readline 调整\n\n```\nbind '\"\\e[A\": history-search-backward'  \
  \ # Like CTRL-R but right on the CLI  ①\nbind '\"\\e[B\": history-search-forward'\
  \   # Same except forward  ②\nbind '\"\\C-i\": menu-complete'            # Cycle\
  \ through possible completions  ③\nbind 'set completion-ignore-case on'      # Ignore\
  \ case in completions  ④\n\n# These are bash, but feel related to \"CLI behavior\
  \ tweaks\"\nexport HISTCONTROL='erasedups:ignoredups:ignorespace'\nexport HISTIGNORE='&:\
  \ [ ]*' # bash >= 3, omit dups & lines starting w/ space+  ⑤ ⑥\n```\n\n① 将“上箭头”绑定到\
  \ history-search-backward，这意味着如果你开始输入一个命令，然后按“上箭头”，它会在你的历史记录中搜索该字符串。你可以用 CTRL-R\
  \ 做类似的事情，但“上箭头”更快更直观。然而，CTRL-R 会在命令中间找到字符串，而此功能仅限于行首。\n\n② 将“下箭头”绑定到 history-search-forward，这与第\
  \ 1 项相同，只是向前查找历史记录。\n\n③ 当你按 TAB 且补全存在歧义时，不再只是蜂鸣并停在那里，而是开始循环遍历可用的补全选项。\n\n④ 在文件名和命令补全时忽略大小写。\n\
  \n⑤ 在保存历史记录时，erasedups 会在保存历史记录前删除与当前行匹配的所有先前行。ignoredups 防止保存先前的重复行，而 ignorespace\
  \ 防止以前导空格开头的命令被保存到历史记录中。其结果是你的历史记录会更干净，因为没有重复，但你也会失去命令的顺序和序列感，因为重复命令会被删除或从未保存。你也可以选择不将某些命令保存到历史记录中，例如包含敏感数据的命令，但请注意它们仍会在进程列表中可见！\n\
  \n⑥ 与上一个相同，为了与非常旧的 bash 保持向后兼容，以防万一。\n"
- '## 使用 logger


  logger 工具（man logger）非常适合将日志直接发送到 syslog，但我们认为它有一个 bug，即 -t 或 --tag 参数不是强制性的，默认只是用户名。我们推荐示例
  10-14 中所示的方法。


  ### 示例 10-14. logger 标签


  ```

  logger --tag "$0[$$]" <msg>

  logger --tag "$PROGRAM[$$]" <msg>

  logger --tag "${0##*/}[$$]" <msg>

  ```


  ① 最简单的情况是使用 $0 作为脚本名称，$$ 作为其 PID。$0 的问题在于它会根据脚本的调用方式而变化，这既嘈杂又不一致。我们更愿意使用 basename。


  ② 如果你已经像 $PROGRAM 这样使用 basename（示例 8-3），那么也可以在 logger 中使用它。


  ③ 如果你没有为脚本的 basename 设置类似 $PROGRAM 的变量，你可以在 logger 标签中直接完成。这开始有点晦涩，但它会起作用。尝试 echo
  "${0##*/}[$$]" 来查看，但从命令行来看它没那么有趣。


  如果你要自行记录日志，请参阅“Getting or Using the Date and Time”第 57 页中的 printf 和 time。

  '
- "## 使用 jq 处理 JSON\n\njq 不是 bash，但我们想涵盖它，因为 JSON 非常常见，尤其是在处理云基础设施时，我们见过一些使用 awk、grep\
  \ 和 sed 等工具来尝试解析 JSON 的糟糕代码。尽可能使用 jq 代替。\n\n![](img/553ffa1bc15093729b691f706befc0ac_127_0.png)\n\
  \n### jq 并非总是可用\n\n不幸的是，尽管 JSON 已变得非常普遍，但 jq 并非像 awk、grep 和 sed 那样默认安装。它也不包含在 Windows\
  \ 的 Git Bash 中，而 Git Bash 包含 awk、sed、cut、grep、tr 等。\n\n有时你可以避开这个问题。例如，对于 AWS，你可以使用\
  \ --output=text，然后使用常规工具。否则，你可以在默认构建中安装 jq，或使用 Python 等工具寻找变通方法，这超出了本书的范围。\n\n本书的源代码包含一个\
  \ atlas.json 文件，因此我们可以将其用于一些示例。如果我们想找到本书的标题，可以这样做：\n\n```\n$ jq '.title' atlas.json\n\
  \"bash Idioms\"\n$ jq -r '.title' atlas.json  # \"Raw\" mode, without the quotes\n\
  bash Idioms\n```\n\n#### 但 `grep` 也能工作...有点\n```\n$ grep 'title' atlas.json\n  \"\
  titlepage.html\",\n  \"title\": \"bash Idioms\",\n```\n\n如果我们想知道各种输出格式是否启用了语法高亮呢？用\
  \ grep 做起来比较棘手，但用 jq 很简单：\n\n```\n### What do we have?\n$ jq '.formats | keys' atlas.json\n\
  [\n  \"epub\",\n  \"html\",\n  \"mobi\",\n  \"pdf\"\n]\n\n### Bad; this has no context\
  \ and is useless\n$ grep 'syntaxhighlighting' atlas.json\n  \"syntaxhighlighting\"\
  : true,\n  \"syntaxhighlighting\": true,\n  \"syntaxhighlighting\": true,\n  \"\
  syntaxhighlighting\": true,\n```\n\n```\n### Good; this tells us that PDF output\
  \ does have syntax highlighting\n$ jq '.formats.pdf.syntaxhighlighting' atlas.json\n\
  true\n```\n\n```\n### Better, but very confusing, show formats and syntax value,\
  \ see jq docs\n$ jq -r '.formats | keys[] as $k | \"\\($k), \\(.[$k] \\\n| .syntaxhighlighting)\"\
  ' atlas.json\nepub, true\nhtml, true\nmobi, true\npdf, true\n```\n\n![](img/553ffa1bc15093729b691f706befc0ac_128_0.png)\n\
  \n## 在 Firefox 中读取 JSON\n\nFirefox 拥有出色的内置 JSON 查看器，可以帮助你更好地了解所看到的内容以及如何让 jq 输出它。只需将你的\
  \ JSON 输出保存为 myfile.json，然后在 Firefox 中打开 file:///path/to/myfile.json 即可。\n"
- '## Grepping 进程列表


  当你 grep 进程列表时，列表中的一个进程就是你的 grep 命令本身，但那不是你要找的，所以你会在示例 10-15 中看到一种习惯用法来移除 grep 行。


  ### 示例 10-15. 不要这样做


  ```

  ps auxw | grep ''proggy'' | grep -v ''grep''

  ```


  我们认为这种解决方案既丑陋又低效，我们更喜欢示例 10-16。


  ### 示例 10-16. 这样做


  ```

  ps auxw | grep ''[p]roggy''

  ```


  这之所以有效，是因为进程列表中的字符串 “[p]roggy” 与正则表达式 /[p]roggy/ 不匹配，而该正则表达式实际上表示 “proggy”。换句话说，“[p]roggy”
  != “proggy”。


  或者，你可以直接使用 pgrep -fl，或者最坏情况下，使用旧的 pidof。

  '
- '## 轮转旧文件


  日志记录很好，归档也很好，但总有一天你需要“轮转”或删除旧文件。有很多惯用的方法可以做到这一点，我们将讨论其中几种并提出一些建议。


  许多轮转旧文件的方法都涉及出色的 find 工具，但其中很大一部分还使用了 -exec 和/或 xargs，而在现代版本的 GNU find 中，这些是不必要的。旧的习惯用法是：


  ```

  find /path/to/files -name ''some-pattern'' -a -mtime 5 -exec rm -f \{\} \;

  ```


  ```

  find /path/to/files -name ''some-pattern'' -a -mtime 5 | xargs rm -f

  ```


  ```

  find /path/to/files -name ''some-pattern'' -a -mtime 5 -print0 | xargs -0 rm -f

  ```


  ① 这极其低效，因为它为每个文件调用一次新的 rm 实例。


  ② 这更高效，因为它会批量处理文件（xargs），但如果文件名包含空格就会中断并产生意外的行为。


  ③ 这也可以处理空格，但它仍然比你需要的更复杂。


  如果你使用 GNU find 且不担心可移植性，使用示例 10-17 中的代码会简单得多。


  ### 示例 10-17. 使用 find 删除旧文件


  ```

  find /path/to/files \( -type f -a -name ''some-pattern'' -a -mtime 5 \) -delete

  ```


  请记住以下几点：


  - 请参阅 man find 并搜索 atime 和 mtime。-mtime +5 表示文件至少在五天前最后修改过，但“五”并不精确；请参阅手册页了解细节讨论。

  - 为了测试，使用 -ls 或 -print 而不是 -delete！但完成后不要忘记更改它。

  - 请注意，find 会递归进入路径下任何/所有子目录，除非你使用 -maxdepth 来限制它。

  - 你想要使用 ( ) 来分组（find 仅匹配所有条件的东西…然后删除它们），但你必须转义它们以防止 shell 自己解释它们。

  - 表达式中选项之间假定有 -a “与” 运算符；如果需要，也可以使用 -o 表示“或”。我们喜欢加上 -a，因为显式优于隐式。






  +   - `-type f` 表示 *type* 为普通文件，因此它会忽略目录、链接等。

  +   - `-name` 很明显但区分大小写。如果需要不区分大小写，可以使用 `-iname`。

  '
- "## 嵌入式文档\n\n程序员有不喜欢编写或更新文档的名声。有时确实如此，有时你遇到的程序员就像……嗯，就是我们。但很明显，编写或更新文档涉及的摩擦越多，发生的可能性就越小。你的团队对摩擦的定义以及如何减少它会有所不同，但一个可能有帮助的方法是将文档嵌入代码中。各种语言找到了不同的方式来实现这一点，你也可以在\
  \ bash 中做到。\n\n你总可以有注释，我们已经展示了一些将注释用作使用或帮助文档的一部分的方法（参见第 79 页的“HELP!”）。并且很容易将文档放在代码旁边，比如\
  \ myscript.sh 和 myscript.asciidoc。但你可以将真正的文档，以 wiki 或标记语言的形式，嵌入到与代码相同的文件中，如示例 10-18\
  \ 所示。\n\n请注意，此示例是 Perl POD（Plain Old Documentation）和通用标记的拼凑物；你通常应该只选其一。POD 很老，与\
  \ Markdown、Textile 等相比感觉非常笨拙，但它有一些不错的转换工具，特别是对于 man 页面，如果你使用 Perl 和/或这些工具，它可能仍然是不错的选择。对于其他标记，Pandoc\
  \ 是一个很棒的转换器——例如，pandoc README.md > /tmp/README.html && firefox file:///tmp/README.html。\n\
  \n请务必阅读示例或输出，因为我们……嗯，嵌入了一些更多的讨论和提示。另外，标注在源代码中看起来会很奇怪且顺序不对，因为它们只有在最终输出中才有意义。继续阅读即可。\n\
  \n### Example 10-18. bash embedded documentation example: code\n\n```\n#!/usr/bin/env\
  \ bash\n# embedded-docs.sh: Example of bash code with various kinds of embedded\
  \ docs\n##### Original Author & date: _bash Idioms_ 2022\n# bash Idioms filename:\
  \ examples/ch10/embedded-docs.sh\n##### ----------------------------------------------------------------------------\n\
  # Does not work on Zsh 5.4.2!\n\n[[ \"$1\" == '--emit-docs' ]] && {\n  # Use the\
  \ Perl \"range\" operator to print only the lines BETWEEN the bash\n  # here-document\
  \ \"DOCS\" markers, excluding when we talk about this code\n  # below in the docs\
  \ themselves. See the output for more.\n  perl -ne \"s/^\\t+//; print if m/DOCS'?\\\
  $/ .. m/^\\s*'?DOCS'?\\$/ \\\n    and not m/DOCS'?\\$/;\" $0\n  exit 0\n}\n```\n\
  \n```\n}\necho 'Code, code, code... <2>'\necho 'Code, code, code...'\n: << 'DOCS'\n\
  ```\n\n# === Docs for My Script ⑦\n\nIgnore the callout in this title; it only makes\
  \ sense in the output later.\n\nDocs can be Markdown, AsciiDoc, Textile, whatever.\
  \ This block is generic markup.\n\nWe've wrapped them using the no-op ':' operator\
  \ and a here-doc, but you have to remember, it's not bash that's processing the\
  \ here-docs, so using <<-DOC for indenting will not work. Not quoting your marker\
  \ will not allow variable interpolation either, or rather, it will, but that won't\
  \ affect your documentation output. So always quote your here-doc marker so your\
  \ docs do not interfere with your script (e.g., via the backticks we'll use below).\n\
  \nAll of your docs could be grouped near the top of the file, like this, for discoverability.\
  \ Or they could all be at the bottom, to stay grouped but out of the way of the\
  \ code. Or they could be interspersed to stay near the relevant code. Do whatever\
  \ makes sense to you and your team.\n\n```\nDOCS\necho 'More code, code, code...\
  \ <3>'\necho 'More code, code, code...'\n: << 'DOCS'\n```\n\n# =head1 POD Example\
  \ ⑧\n\nIgnore the callout in this title; it only makes sense in the output later.\n\
  \nThis block is Perl POD (Plain Old Documentation).\n\nIf you use POD, you can then\
  \ use `perldoc` and the various `pod2*` tools, like `pod2html`, that handle that.\
  \ But you can't indent if using POD, or Perl won't see the markup, unless you preprocess\
  \ the indent away before feeding the POD tools.\n\nAnd don't forget the `=cut` line!\n\
  \n```\n=cut\n```\n\n```\nDOCS\necho 'Still more code, code, code... <4>'\necho 'Still\
  \ more code, code, code...'\n: << 'DOCS'\n```\n\n# Emitting Documentation ⑨\n-------------------\n\
  \nIgnore the callout in this title; it only makes sense in the output later.\n\n\
  This could be POD or markup, whatever.\n\nThis section uses a TAB indented here-doc,\
  \ just because we can, but we handle that in the Perl post processor, not via bash.\
  \ :-/\n\nYou should add a \"handler\" to your argument processing/help options to\
  \ emit your docs. If you use POD, use those tools, but make sure they are installed!\
  \ If you use some other markup, you have to extract it yourself somehow.\n\nWe know\
  \ this is a bash book, but this Perl one-liner using regular expressions and the\
  \ range operator is really handy:\n    perl -ne \"s/^\\t+//; print if m/DOCS'?\\\
  $/ .. m/^\\s*'?DOCS'?\\$/ \\n    and not m/DOCS'?;/\" $0\n\nThat will start printing\
  \ lines when it matches the regular expression m/DOCS'?$/, and stop printing when\
  \ it matches m/^\\s*'?DOCS'?$/, except that it won't print the actual line containing\
  \ m/DOCS/ at all.\n\nAdd that to your argument processing as \"emit documentation.\"\
  \n\nDOCS\n\n```\necho 'End of code... <5>'\n```\n\n```\nexit 0  # Unless we already\
  \ exited >0 above\n```\n\n```\n: << 'DOCS'\nh2. More Docs AFTER the code ⑩\n```\n\
  \nIgnore the callout in this title; it only makes sense in the output later.\n\n\
  This block is back to generic markup. We do *not* recommend mixing and matching\
  \ like we've done here! Pick a markup and some tools and stick to them. If in doubt,\
  \ GitHub has made Markdown _very_ popular.\n\nDocs can just go *after* the end of\
  \ the code. There's an argument for putting all the docs together in one place at\
  \ the top or bottom of the script. This makes the bottom easy. On the other hand,\
  \ there's an argument for keeping the docs _close_ to the relevant code, especially\
  \ for functions. So...your call.\n\nBut if this section only has an `exit 0` above\
  \ it and is not wrapped in a bogo-here-doc, this might cause some syntax highlighters\
  \ to be unhappy, and our Perl doc emitter will miss it, so you have to find a different\
  \ way to display the docs.\nDOCS\n\nAnd that looks like Example 10-19.\n\n# Example\
  \ 10-19. bash embedded documentation example: output\n\n### Running looks like this\
  \ (`./embedded-docs.sh`): ①\nCode, code, code... ②\n\nCode, code, code...\nMore\
  \ code, code, code... ③\nMore code, code, code...\nStill more code, code, code...\
  \ ④\nStill more code, code, code...\nEnd of code... ⑤\n\n# ### Emitting (un-rendered)\
  \ docs looks like this (`./embedded-docs.sh --emit-docs`): ⑥\n\n# === Docs for My\
  \ Script ⑦\n\nIgnore the callout in this title; it only makes sense in the output\
  \ later.\n\nDocs can be Markdown, AsciiDoc, Textile, whatever. This block is generic\
  \ markup.\n\nWe’ve wrapped them using the no-op ‘:’ operator and a here-doc, but\
  \ you have to remember, it’s not bash that’s processing the here-docs, so using\
  \ <<-DOC for indenting will not work. Not quoting your marker will not allow variable\
  \ interpolation either, or rather, it will, but that won’t affect your documentation\
  \ output. So always quote your here-doc marker so your docs do not interfere with\
  \ your script (e.g., via the backticks we’ll use below).\n\nAll of your docs could\
  \ be grouped near the top of the file, like this, for discoverability. Or they could\
  \ all be at the bottom, to stay grouped but out of the way of the code. Or they\
  \ could be interspersed to stay near the relevant code. Do whatever makes sense\
  \ to you and your team.\n\n# =head1 POD Example ⑧\n\nIgnore the callout in this\
  \ title; it only makes sense in the output later.\n\nThis block is Perl POD (Plain\
  \ Old Documentation).\n\nIf you use POD, you can then use `perldoc` and the various\
  \ `pod2*` tools, like `pod2html`, that handle that. But you can’t indent if using\
  \ POD, or Perl won’t see the markup, unless you preprocess the indent away before\
  \ feeding the POD tools.\n\nAnd don’t forget the `=cut` line!\n\n=cut\n\n# Emitting\
  \ Documentation ⑨\n\n---------------------\n\nIgnore the callout in this title;\
  \ it only makes sense in the output later.\n\nThis could be POD or markup, whatever.\n\
  \nThis section uses a TAB indented here-doc, just because we can, but we handle\
  \ that in the Perl post processor, not via bash. :-/\n\n\n\n\n\n你应该在你的参数处理/帮助选项中添加一个“handler”来输出你的文档。如果你使用\
  \ POD，就使用那些工具，但确保它们已安装！如果你使用其他标记，你必须以某种方式自行提取它。\n\n我们知道这是一本 bash 书，但这个使用正则表达式和范围运算符的\
  \ Perl 单行命令非常方便：\n\n```\nperl -ne \"s/^\\t+//; print if m/DOCS'?'\\$/ .. m/^\\s*'?DOCS'?'\\\
  $/ \\\nand not m/DOCS'?'\\$/;\" $0\n```\n\n它会在匹配正则表达式 m/DOCS'?$/ 时开始打印行，并在匹配 m/^\\\
  s*'?DOCS'?$/ 时停止打印，但它根本不会打印包含 m/DOCS/ 的实际行。\n\n将其添加到你的参数处理中作为“emit documentation”。\n\
  \n## More Docs AFTER the code\n\n忽略此标题中的标注；它只在后面的输出中才有意义。\n\n此块恢复为通用标记。我们*不*推荐像我们在这里所做的那样混合搭配！选择一种标记和一些工具并坚持使用。如果不确定，GitHub\
  \ 已使 Markdown _非常_流行。\n\n文档可以*在*代码结束之后。把所有文档放在脚本顶部或底部的同一个地方是有道理的。这使得底部变得容易。另一方面，保持文档\
  \ _靠近_ 相关代码是有道理的，尤其是对于函数。所以……由你决定。\n\n但如果此部分上方只有 `exit 0` 并且未包装在 bogo-here-doc 中，这可能会导致某些语法高亮器不满意，并且我们的\
  \ Perl 文档发射器会遗漏它，因此你必须找到另一种方式来显示文档。\n\n- 1. 当我们使用嵌入式文档正常运行脚本时，运行的就是代码，正如我们所期望和期望的那样。\n\
  - 2. 这代表一个将被运行的代码块。请注意，块之后的嵌入式文档将被忽略。\n- 3. 另一个代码块；块之前和之后的嵌入式文档将被忽略。\n- 4. 你能猜到吗？\n\
  - 5. 这是代码的结尾，之前的嵌入式文档如上所述被忽略，但我们现在退出脚本，因此此点之后的文档技术上不需要 here-document，但为了保持一致性并使语法高亮器满意，最好还是使用一个。\n\
  \n⑥ 现在我们正在发出文档！在这种情况下，我们有一个 --emit-docs 选项，但你也可以使用其他工具来提取和处理文档。\n\n⑦ 这是通用标记。它可以是\
  \ Markdown、Textile，等等。\n\n⑧ 这是 Perl POD，并通过各种 pod2* 工具处理。\n\n⑨ 此块可能是 POD 或通用；重点是它被缩进了，因此我们需要在处理工具中处理这种情况。\n\
  \n⑩ 正如我们在 ⑤ 中讨论的那样，这是在代码结束之后。\n\n参见以下内容：\n\n- - https://en.wikipedia.org/wiki/Pandoc\n\
  - - https://en.wikipedia.org/wiki/Plain_Old_Documentation\n- - https://en.wikipedia.org/wiki/Markdown\n\
  - - https://en.wikipedia.org/wiki/Textile_(markup_language)\n- - https://en.wikipedia.org/wiki/Asciiidoc\n\
  - - https://en.wikipedia.org/wiki/Comparison_of_document_markup_languages\n- - https://en.wikipedia.org/wiki/Lightweight_markup_language\n"
- '## bash Debugging


  我们已经在“Debug and Verbose”第 82 页讨论过在代码中添加调试语句、“printf for Reuse or Debugging”第 58
  页和示例 10-3 中显示调试值，但我们直到现在才谈到解释器级别的调试。


  首先，你可以通过运行 bash -n /path/to/script 来进行粗略的语法检查。技术上，bash -n 表示“读取命令但不执行它们”（参见 help
  set），它类似于 perl -c。这不会告诉你运行时错误、错误逻辑、外部命令的错误选项等。但它会告诉你引号、括号和方括号不平衡；bash 内置的无效语法；等等。这是在编写或更改脚本时早期和经常运行的一个很棒的命令。


  有一个类似的 bash -v 或 set -v 命令，表示“打印 shell 输入行，因为它们被读取”，但实际上它没有听起来那么有用，因为它在 shell 插值之前显示，所以你只是得到源代码被吐回给你。


  bash -x（xtrace），另一方面，表示“打印命令及其参数，因为它们被执行”，非常有用，这是调试的下一步。运行 bash -x /path/to/script，并准备好面对大量输出。参见示例
  10-3，了解使该输出更有用的方法之一。你也可以在代码中间使用 set -x 打开 xtrace，然后稍后使用 set +x 关闭它（是的，这也让我们头疼了一点，但一旦你使用
  - 打开它，使用 + 关闭它至少是可记忆的）。示例 10-20 说明了这一点。


  ### Example 10-20. Simple debug example


  ```

  ### Without debugging

  $ examples/ch10/select-ssh.sh

  1) Exit          3) gitlab.com      5) mythtv-be01

  2) git.atlas.oreilly.com  4) github.com      6) kitchen

  SSH to> 1

  ```


  ```

  ### With debugging (2 lone lines broken to fit)

  $ bash -x examples/ch10/select-ssh.sh

  +xtrace examples/ch10/select-ssh.sh:9:: ssh_config=examples/ch10/ssh_config

  +xtrace examples/ch10/select-ssh.sh:11:: PS3=''SSH to> ''

  +xtrace examples/ch10/select-ssh.sh:12:: Select ssh_target in Exit $(egrep \

  -i ''Host \w+'' "$ssh_config" | cut -d '' '' -f2-)

  ++xtrace examples/ch10/select-ssh.sh:12:: egrep -i ''^Host \w+'' \

  examples/ch10/ssh_config

  ++xtrace examples/ch10/select-ssh.sh:12:: cut ''-d '' -f2-

  1) Exit          3) gitlab.com      5) mythtv-be01

  2) git.atlas.oreilly.com  4) github.com      6) kitchen

  SSH to> 1

  +xtrace examples/ch10/select-ssh.sh:13:: case $REPLY in

  +xtrace examples/ch10/select-ssh.sh:14:: exit 0

  ```


  你可能想看看第 96 页的“Unofficial bash Strict Mode”，它可以在稍后添加时揭露微妙问题，或在编写时防止它们出现。


  ![](img/553ffa1bc15093729b691f706befc0ac_136_0.png)

  '
- '## Dumping Your Environment


  当从 cron、持续集成或其他环境可能发生变化或与你期望的不同之处运行时，记录或转储你的环境通常很有帮助。你会看到外部 env 或 printenv 用于此目的，但
  bash 内部的 set 命令会给你更多信息，包括函数。另一方面，它嘈杂得多，所以全部检查一下并决定哪个最适合你。


  ![](img/553ffa1bc15093729b691f706befc0ac_137_0.png)


  ## Environment Information Leaks


  如果你记录或转储你的环境，请注意它通常会包含敏感信息，例如用户名、密码、API 密钥等等！你可能希望修改你的转储命令以删除数据，也许使用 sed 或 Perl
  单行命令：


  ```

  set | perl -pe ''s/^(SECRET=).*\/1<REDACTED>/g;''

  ```


  从 bash v3.0 开始，有一个 --debugger 标志和 shopts extdebug 选项，但在这里我们必须诚实地说我们从未使用过这些选项；set
  -x 一直足够。运行 bash --debugger -- /path/to/script 很可能会导致：


  /path/to/script: /usr/share/bashdb/bashdb-main.inc: No such file or directory

  /path/to/script: warning: cannot start debugger; debugging mode disabled


  如果你看到这个，你需要查看 Bash Debugger Project，它是“一个遵循 gdb 命令语法的 bash 源代码调试器”。它是 bash 版本相关的，所以确保为你的系统获取正确的版本。


  另请参阅：


  - - http://bashdb.sourceforge.net

  - - Example 10-3

  - - “bash Linter”第 134 页

  - - “Debug and Verbose”第 82 页

  - - “printf for Reuse or Debugging”第 58 页

  - - “Unofficial bash Strict Mode”第 96 页

  '
- '## bash Unit Testing


  在 GitHub 上，有一个“Bourne-based shell 脚本的单元测试框架，它的设计方式与 JUnit、PyUnit 等类似”……以及第 134 页的“bash
  Linter”，我们将在第 11 章讨论，这两者都很有趣。


  ## Summary


  希望这些提示和技巧在你日常的 bash 工作中以及在规划未来增长以保持尽可能简单和灵活时会有用。如果你喜欢这一章，你也会喜欢 bash Cookbook，它有超过
  600 页的、嗯、像这样的有用食谱。






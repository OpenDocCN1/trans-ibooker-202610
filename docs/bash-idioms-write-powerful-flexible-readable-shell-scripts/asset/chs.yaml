- "## Acknowledgments\n\n## bash\n\n感谢 GNU 软件基金会和 Brian Fox 编写了 bash。非常感谢 Chet Ramey，他从\
  \ 20 世纪 90 年代初到中期大约从 1.14 版开始一直维护和改进 bash。你（复数）给了我们一个伟大的工具，在很多方面都帮助了我们。\n\n## Reviewers\n\
  \n非常感谢我们的审阅者 Doug McIlroy、Ian Miell、Curtis Old 和 Paul Troncone！他们都提供了宝贵的反馈、建议，有时还提供了替代方案，指出我们忽略的问题，总的来说极大地改进了本书。本书中的任何错误或遗漏都是我们自己的，不是他们的。\n\
  \n## O’Reilly\n\n感谢 O’Reilly 的整个团队，没有他们这本书就不复存在（出于很多原因）——如果有的话，内容也不会或看起来不会像现在这样好！\n\
  \n感谢 Mike Loukides 提出最初的想法，并请我们信任我们去实现它。感谢 Suzanne “Zan” McQuade 帮助完善它。非常感谢 Nicole\
  \ Taché 在漫长的写作过程中进行编辑、 sanity 检查，并总体上容忍我们，以及 Kristen Brown 在制作过程中做同样的事情。特别感谢 Tools\
  \ 部门的 Nick Adams 修复我们众多的（极其严重的）AsciiDoc 错误，并提供超出职责范围的工具链帮助。还要感谢 Kim Sandoval（校对）、Cheryl\
  \ Lenser（索引）、Liz Wheeler（校对）、David Futato（内页设计）、Karen Montgomery（封面设计）以及 O’Reilly\
  \ 的其他优秀团队。\n\n## From Carl\n\n感谢 JP 在此书上的所有工作，他的彻底性、细节关注以及愿意容忍我。感谢所有 O’Reilly 的人帮助将其实现。\n\
  \n我在这本书上的工作献给我妻子 Cynthia，她在我写作时忍受我奇怪的工作时间，并令人信服地假装对我写的内容感兴趣。我在这本书上的工作如我们在 Bethel\
  \ University 所说，是为了上帝的荣耀和邻舍的益处。\n\n## From JP\n\n感谢 Carl 的所有工作；我们似乎又一次安排了互补的日程。感谢\
  \ Mike 再次推动事情启动，以及 Nicole 保持其运转并对我们的工作、生活和时间管理问题保持耐心。\n\n本书献给我妻子 Karen，她是负责所有事情的执行副总裁，没有她我的生活就无法运转。感谢你的难以置信的支持、耐心和理解。最后，感谢\
  \ Kate 和 Sam，感谢你们把“除非你流血或着火，否则我有书要做”当作答案。\n\n## A Big “if” Idiom\n\n为了让你开始理解 bash\
  \ 习惯用法，我们将介绍一个 bash 构造，它允许你用更简洁的语法做你可能通常用 if/then/else 构造做的事情。我们将在本章中向你展示的习惯用法有一些真正的优势——主要是简洁性——也有一些需要避免的陷阱。但如果你不了解\
  \ bash 习惯用法，你可能无法识别或意识到正在发生的事情。\n\n看看这段代码：\n\n```\n[[ -n \"$DIR\" ]] && cd \"$DIR\"\
  \n```\n\n你觉得这看起来像一个 if 语句吗？如果你熟悉 bash，你会认识到它在功能上是相同的；你会把它理解为一个 if 语句，即使代码中没有出现 if\
  \ 关键字。\n\n发生了什么？\n\n## The Big “if”\n\n为了解释这个习惯用法，让我们先看一个类似但更简单的例子：\n\n```\ncd tmp\
  \ && rm scratchfile\n```\n\n这也是，实际上，是一个 if 语句。如果 cd 命令成功，则（并且仅在成功时）执行 rm 命令。这里的“习惯用法”是使用双与号（&&），通常读作“和”，来分隔两个命令。\n\
  \n逻辑或哲学课程教授规则：“A AND B” 的表达式当且仅当 A 和 B 都为真时为真。因此如果 A 为假，就没有必要考虑 B 的值。例如，考虑“我有一只狗\
  \ AND 我有一只猫”。如果我没有狗，那么对我来说这个复合表达式为假，无论我的猫情况如何。\n\n让我们将其应用于 bash。记住 bash 的基本功能是执行程序。语句的第一部分执行\
  \ cd 命令。类似于 AND 的逻辑，如果第一个命令失败，bash 将不会费心执行第二部分，即 rm 命令。\n\n使用 && 的目的是提醒你 AND 行为。Bash\
  \ 并不是真正对这两个结果执行“AND”操作。（如果这是 C/C++，那就是另一回事了，尽管条件执行是相同的。）然而，这个 bash 习惯用法确实提供了第二个命令的条件执行——如果第一个命令失败，它就不会运行。\n\
  \n让我们回到并查看我们给出的原始示例，即这个表达式：\n\n```\n[[ -n \"$DIR\" ]] && cd \"$DIR\"\n```\n\n你现在觉得你“明白”了吗？第一个表达式测试名为\
  \ DIR 的变量的值的长度是否非零。如果它有值，也就是说如果其长度非零——并且仅在非零时——cd 命令将尝试更改到由 DIR 值命名的目录。\n\n我们本可以将其写成显式的\
  \ if 语句：\n\n```\nif [[ -n \"$DIR\" ]]; then\n  cd \"$DIR\"\nfi\n```\n\n对于不太熟悉 bash\
  \ 的人来说，这种后一种格式肯定更易读、更容易理解。但 then 子句中几乎没有发生什么，只是 cd 命令，所以在语法上显得有点“臃肿”。你必须根据你的读者可能是谁以及\
  \ then 子句中是否可能添加其他命令来决定使用哪一种。我们将在后面的章节中就此话题提供更多意见。\n\n![](img/553ffa1bc15093729b691f706befc0ac_17_0.png)\n\
  \n## bash Help\n\nbash help 命令对于任何内置命令都很好，但 help test 提供了关于 test 表达式的特别有帮助的线索，比如\
  \ -n。你也可以查看 man bash，但如果你这样做，你需要搜索“conditional expressions”。bash 手册页非常长；help thing\
  \ 有更短、更集中的主题。如果你不确定所讨论的命令是否是 bash 内置命令，只需用 help 命令尝试一下，或使用 type -a thing 来查找。\n\n\
  承认一下，知道 help test 会告诉你 -n 的含义是棘手的，但然后，你足够聪明买了这本书，所以现在你知道了。这里还有一个微妙的小技巧；去试试这个：help\
  \ [。\n你受宠若惊。\n\n## Or ELSE...\n\n使用 || 字符分隔 bash 列表中的两个项目也有一个类似的习惯用法。读作“或”，第二部分仅在第一部分失败时执行。这是为了提醒你“OR”的逻辑规则，即：A\
  \ OR B。整个表达式为真，如果 A 为真或 B 为真。换句话说，如果 A 为真，B 为真或假并不重要。例如，考虑短语“我有一只狗 OR 我有一只猫”。如果我确实有一只狗，那么对我来说这个表达式为真，无论我的猫情况如何。\n\
  \n将其应用于 bash：\n\n```\n[[ -z \"$DIR\" ]] || cd \"$DIR\"\n```\n\n你觉得你能解释这个吗？如果变量长度为零，则第一部分为“真”，因此没有必要执行后半部分；不会运行\
  \ cd 命令。但如果 $DIR 的长度非零，测试将返回“假”，只有在这种情况下我们才会运行 cd 命令。\n\n你可以把这行 bash 读作“要么 $DIR\
  \ 为零长度，要么我们尝试 cd 到该目录。”\n\n将其写成显式的 if 语句有点奇怪，因为没有 then 操作要执行。|| 后的代码就像 else 子句：\n\
  \n```\nif [[ -z \"$DIR\" ]]; then\n  :\nelse\n  cd \"$DIR\"\nfi\n```\n\n“：” 是 shell\
  \ 中的空语句——在这种情况下什么也不做。\n\n总之：用 && 分隔的两个命令就像 if 及其 then 子句；用 || 分隔的两个命令就像 if 及其 else\
  \ 子句。\n\n## More than One\n\n你可能想在 || 之后的这个类似 else 的子句中做不止一件事（或在 && 之后的类似 then 的子句中），而这就存在危险。可能会诱惑你写这样的东西：\n\
  \n```\n### Caution: not what you might think!\ncd /tmp || echo \"cd to /tmp failed.\"\
  \ ;  exit\n```\n\n“或”连接告诉我们，如果 cd 失败，我们将执行 echo 命令，告诉用户 cd 失败。但这里有个陷阱：exit 将无论如何都会发生。不是你期望的，对吧？\n\
  \n\n\n\n\n把分号看作等同于换行符，整个逻辑就会变得清晰得多（并且更明显地不是你想要的）：\n\n```\ncd /tmp || echo \"cd to\
  \ /tmp failed.\"\nexit\n```\n\n我们如何得到想要的行为？我们可以将 echo 和 exit 组合在一起，使它们作为一个整体成为“或”右侧的子句，像这样：\n\
  \n```\n### 成功执行 cd 或输出消息后退出\ncd /tmp || { echo \"cd to /tmp failed.\" ; exit ; }\n\
  ```\n\n大括号是 bash 中复合命令的语法，即将语句分组在一起。你可能见过使用圆括号的类似写法，但使用圆括号会在子 shell 中执行语句，也称为子进程。这会带来我们不需要的开销，而且在子\
  \ shell 内部执行的 exit 也不会起到多大作用。\n\n![](img/553ffa1bc15093729b691f706befc0ac_19_0.png)\n\
  \n#### 关闭复合命令\n\nbash 的一个怪癖要求复合命令的关闭语法必须特定。它必须在闭合大括号前以分号或换行符结束。如果你使用分号，则需要在大括号前留有空白，以便大括号能被识别为保留字（否则它会被误认为\
  \ shell 变量语法中的闭合大括号，例如 ${VAR}）。这就是前面的示例以看似多余的分号结尾的原因：{ echo \"...\" ; exit ; }。使用换行符时，最后的分号就不需要了：\n\
  \n```\n### 成功执行 cd 或输出消息后退出\ncd /tmp || { echo \"cd to /tmp failed.\" ; exit\n}\n\
  ```\n\n但这样可能读起来不够清晰。在左侧边缘，它显得位置很奇怪；加上缩进后逻辑分组更合理，但看起来却很单薄。\n\n我们建议你坚持使用额外的分号，并且不要忘记它与闭合大括号之间的空格。\n\
  \n#### 再来一次，多于一个\n\n如果需要更复杂的逻辑怎么办？如果有多重 AND 和 OR 构造又如何？它们是如何处理的？你认为下面这行代码会做什么？\n\
  \n```\n[ -n \"$DIR\" ] && [ -d \"$DIR\" ] && cd \"$DIR\" || exit 4\n```\n\n如果 DIR\
  \ 变量不为空并且 DIR 变量指定的文件是一个目录，那么它会 cd 到该目录；否则脚本会退出并返回 4。\n\n这做出了你可能期望的结果——但也许不是你想的那种原因。你可能会从这个例子中推断出\
  \ && 的优先级高于 || 运算符，但事实并非如此。它们只是从左到右进行分组。bash 的语法规定 && 和 || 运算符具有相同的优先级并且是左结合的。需要说服力吗？看这些例子：\n\
  \n```\n$ echo 1 && echo 2 || echo 3\n1\n2\n$\n```\n\n但也有：\n\n```\n$ echo 1 || echo\
  \ 2 && echo 3\n1\n3\n$\n```\n\n注意它总是评估最左边的运算符，无论是 AND 还是 OR；决定求值顺序的不是运算符优先级，而是简单的左结合性。\n\
  \n#### 不要这样做\n\n既然我们谈到了 if 语句（或如何不使用它们），这里有一个你可能会在旧脚本中经常看到的显式 if 示例。我们在这里展示它是为了解释这种惯用法，但也强烈建议你永远不要模仿这种风格。这是代码：\n\
  \n```\n##### 不要这样写 if 语句来检查\nif [ $VAR\"X\" = X ]; then\n    echo empty\nfi\n```\n\
  \n```\n##### 或者这样\nif [ \"x$VAR\" == x ]; then\n    echo empty\nfi\n```\n\n```\n\
  ##### 或者这种主题的其他变体\n```\n\n不要这样做。这段代码在做什么？它们在检查变量 VAR 是否为空。它们通过给 VAR 的值追加一个字符（这里是\
  \ X）来实现。如果 resulting 字符串仅匹配该字母本身，则变量为空。不要这样做。\n\n有更好的方法来进行此检查。这里有一个简单的替代方案：\n\n\
  ```\n### 变量的长度是否为零？即为空或空值\nif [[ -z \"$VAR\" ]]; then\n    echo empty\nfi\n```\n\
  \n![](img/553ffa1bc15093729b691f706befc0ac_21_0.png)\n\n#### 单括号与双括号\n\n这个不该做的例子使用了单括号\
  \ [ 和 ] 来包围它们正在测试的条件。这不是我们要你避免的。我们要你避免的是字符串追加和比较；相反，使用 -z 或 -n 来进行这些测试。那么为什么我们的示例都使用双括号\
  \ [[ 和 ]] 来编写我们的 if（和非 if）语句呢？它们是 bash 的新增功能（不在原始 sh 命令中），并且避免了单括号所表现出的一些令人困惑的边缘情况行为（变量是否在引号内）。我们用单括号展示这个例子是因为这种类型的比较在旧脚本中经常出现。你可能需要坚持使用单括号，如果你的目标是在各种平台和/或非\
  \ bash 平台（例如 dash）之间保持可移植性。作为旁注，双括号是关键字，而左单括号是内置命令，这种差异可能解释了一些细微的行为差异。我们的建议是除非不可避免，否则使用双括号语法。\n\
  \n你可以通过使用 -n 选项或直接引用变量来检查相反的情况，即检查字符串长度是否非零：\n\n```\n### 这检查长度是否非零，即不为空，不为空值\nif\
  \ [[ -n \"$VAR\" ]]; then\n    echo \"VAR has a value:\" $VAR\nfi\n```\n\n```\n\
  ### 同样在这里\nif [[ \"$VAR\" ]]; then\n    echo even easier this way\nfi\n```\n\n所以你可以看到没有必要使用那种在旧版\
  \ test 命令（\"[\"）中必要的方法，而这种命令现在很少使用。我们认为你应该看到它，这样你就能在旧脚本中识别它。现在你也知道更好的写法了。\n\n####\
  \ 风格和可读性：回顾\n\n在本章中，我们研究了一种特定的 bash 惯用法——“无 if” if 语句。它看起来不像传统的 if/then/else，但行为完全可以一样。除非你能识别它，否则你阅读的一些脚本可能会仍然晦涩。这种惯用法也值得用来检查在执行命令之前是否满足必要的先决条件，或在不打断脚本主要逻辑流程的情况下进行简短的错误检查。\n\
  \n通过使用 && 和 || 运算符，你可以编写 if/then/else 逻辑，而无需使用那些熟悉的关键字。但 bash 确实有 if、then 和 else\
  \ 作为关键字。那么什么时候使用它们，什么时候使用简写？答案取决于可读性。\n\n对于复杂逻辑，使用熟悉的关键字更有意义。但对于带单个操作的简单测试和检查情况，使用\
  \ && 和 || 运算符非常方便，并且不会分散主要逻辑流程的注意力。使用 help test 来提醒你可以使用哪些测试，例如 -n -r，并考虑将帮助文本复制到注释中以供将来参考。\n\
  \n无论是熟悉的 if 语句还是惯用的“无 if”语句，我们都鼓励使用双括号语法。\n\n现在你已经深入了解了一种 bash 惯用法，让我们看看其他惯用法，并真正提升你的\
  \ bash 水平。\n\n#### 循环术语\n\n不只是 C 风格的 for 循环——bash 包含其他语法和风格；有些对 Python 程序员更熟悉，但每种都有其用途。有一种\
  \ for 循环没有明显的参数，可用于脚本和函数内部。还有一种类似迭代器的 for 循环，具有显式值和可以来自其他命令的值。\n\n#### 循环结构\n\n\
  循环结构在编程语言中很常见。自 C 语言发明以来，许多编程语言都采用了 C 风格的 for 循环。因为它将初始化代码、终止条件和迭代代码都集中在一个地方，所以它是一个功能强大且可读的构造。例如，在\
  \ C（或 Java，或...）中：\n\n```\n/* NOT bash */\nfor (i=0; i<10; i++) {\n    printf(\"\
  %d\\n\", i);\n}\n```\n\nbash 在只有少量语法差异的情况下遵循了几乎相同的方法：\n\n```\nfor ((i=0; i<10; i++));\
  \ do\n    printf '%d\\n' \"$i\"\ndone\n```\n\n请特别注意双圆括号的使用。与大括号不同，bash 使用 do 和 done\
  \ 来包含循环的语句。与 C/C++ 一样，for 循环的惯用用法是空的 for 循环，产生有意的无限循环（你也会看到 while true; do）：\n\n\
  \n\n```\nfor ((;;)); do\n    printf 'forever'\ndone\n```\n\n但这并不是 bash 中唯一的 for\
  \ 循环形式。下面是 shell 脚本中常见的一种习惯用法：\n\n```\nfor value; do\n    echo \"$value\"\n    #\
  \ Do more stuff with $value...\ndone\n```\n\n这看起来好像少了点什么，对吧？value 的值从哪里来？在命令行中这样使用不会对你产生任何作用，但如果在\
  \ shell 脚本中使用，那么 for 循环就会遍历脚本的参数。也就是说，它会依次使用 $1，然后是 $2，然后是 $3，等等，作为 value 的值。\n\n\
  把这个 for 循环放在一个名为 myloop.sh 的文件中，然后你可以这样运行它，看看会打印出三个参数（“-c”、“17”和“core”）：\n\n```\n\
  $ bash myloop.sh -c 17 core\n-c\n17\ncore\n$\n```\n\n这种简写的 for 循环在函数定义中也很常见：\n\n\
  ```\nfunction Listen {\n    for arg; do\n        echo \"arg to func: '$arg'\"\n\
  \    done\n    echo \"Inside func: \\$0 is still: '$0'\"\n}\n```\n\n在函数定义内部，参数 $1、$2\
  \ 等是传递给该函数的参数，而不是传递给外部 shell 脚本的参数。因此，在函数定义内部，for 循环会遍历传递给该函数的参数。\n\n这种极简的 for 循环遍历的是一个隐含的值列表——传递给脚本或函数的参数。当在脚本主体中使用时，它遍历传递给脚本的参数；当在\
  \ shell 函数内部使用时，它遍历传递给该函数 的参数。\n\n这绝对是 bash 中晦涩的习惯用法之一。你需要知道如何阅读它，但我们会在后面的章节中讨论如何编写它（剧透：正如\
  \ Python 所说，显式优于隐式）。\n\n我们可能想要一个同样简单的循环，但使用我们自己选择的显式值，而不是局限于参数——bash 正好有这个功能。\n\n\
  #### Explicit Values\n\n在 bash 中，for 循环可以被赋予一个要遍历的值列表，像这样：\n\n```\nfor num in 1\
  \ 2 3 4 5; do\n    echo \"$num\"\ndone\n```\n\n由于 bash 处理的是字符串，我们并不局限于数字：\n\n```\n\
  for person in Sue Neil Pat Harry; do\n    echo $person\ndone\n```\n\n当然，值列表可以同时包含变量和字面量：\n\
  \n```\nfor person in $ME $3 Pat ${RA[2]} Sue; do\n    echo $person\ndone\n```\n\n\
  for 循环的另一个值来源可以来自其他命令，要么是单个命令，要么是命令管道：\n\n```\nfor arg in $(some cmd or other |\
  \ sort -u)\n```\n\n这种类型的例子有：\n\n```\nfor arg in $(cat /some/file)\nfor arg in $(</some/file)\
  \    # Faster than shelling out to cat\nfor pic in $(find . -name '*.jpg')\nfor\
  \ val in $(find . -type d | LC_ALL=C sort)\n```\n\n一个常见的用法，尤其是在旧脚本中，是这样的：\n\n```\n\
  for i in $(seq 1 10)\n```\n\n因为 seq 命令会生成一系列数字。这种情况可以被认为等价于：\n\n```\nfor ((i = 1;\
  \ i <= 10; i++))\n```\n\n后者的 for 更高效，也更易读。（请注意，循环结束后，i 的值在这两种形式之间会不同 [10 与 11]，不过通常我们不会在循环外部使用该值。）\n\
  \n还有这种变体，但它有 bash 版本的可移植性问题，因为大括号展开是在 v3.0 中引入的，而展开的数值值的零填充则是在 v4.0 中引入的：\n\n```\n\
  for i in {01..10}; do echo \"$i\"; done\n```\n\n![](img/553ffa1bc15093729b691f706befc0ac_27_0.png)\n\
  \n#### Leading Zeros\n\n当 {start..end..inc} 大括号展开中的前两个项之一以零开头时，它会强制每个输出值具有相同的宽度——在\
  \ bash v4.0 或更新版本中使用零在左侧填充它们。因此 {098..100} 会得到：098 099 100，而 {98..0100} 会填充到四个字符，结果为：0098\
  \ 0099 0100。\n\n这种大括号展开构造在你希望生成的数字成为更大字符串的一部分时尤其有用。你只需将大括号构造作为字符串的一部分。例如，如果你想生成五个类似\
  \ log01.txt 到 log05.txt 的文件名，你可以写：\n\n```\nfor filename in log{01..5}.txt ; do\n\
  \  # Do something with the filenames here\n  echo $filename\ndone\n```\n\n![](img/553ffa1bc15093729b691f706befc0ac_27_1.png)\n\
  \n#### Braces Versus printf -v\n\n你也可以用一个数值 for 循环然后用 printf -v 来从数字构造文件名，但大括号展开似乎更简单。当你除了文件名之外还需要数值时，使用数值\
  \ for 循环和 printf。\n\nseq 命令对于生成浮点样式的数字序列仍然非常有用。你在起始值和结束值之间指定一个增量：\n\n```\nfor value\
  \ in $(seq 2.1 0.3 3.2); do\n  echo $value\ndone\n```\n\n会产生：\n\n+   2.1\n+   2.4\n\
  +   2.7\n+   3.0\n\n只要记住 bash 不做浮点运算。你可能希望生成这些值以便在脚本内部传递给其他程序。\n\n#### Similar to\
  \ Python\n\n下面是在 bash 的 for 循环中看到的另一个常见短语：\n\n```\nfor person in ${name_list[@]};\
  \ do\n  echo $person\ndone\n```\n\n它可能会产生如下输出：\n\n```\nArthur\nAnn\nHenry\nJohn\n\
  ```\n\n看到这个例子，你可能会想，这个 bash for 循环就像 Python，可以遍历迭代器对象返回的值。好吧，在这个例子中 bash 确实在遍历一系列值，但这些值并不是来自迭代器对象。相反，名称在循环开始前就全部列出。\n\
  \n构造 ${name_list[@]} 是 bash 用于列出 bash 数组所有值的语法，此后称为列表。 （参见第 7 章引言中的术语讨论。在此示例中，列表称为\
  \ name_list。）bash 在准备运行命令时进行替换。因此 for 循环看不到列表语法；替换先发生。for 循环得到的内容就好像我们显式输入了值：\n\n\
  ```\nfor person in Arthur Ann Henry John\n```\n\n字典呢？Python 所称的“字典”，bash 称之为“关联数组”，其他人称之为“键/值对”或“哈希”（再次参见第\
  \ 7 章引言）。构造 ${hash[@]} 对于键/值对的值来说是可以的。要遍历哈希的键（即索引），请添加一个感叹号。构造 ${!hash[@]} 可以使用，如以下代码片段所示：\n\
  \n```\n### We want a hash (i.e., key/value pairs)\ndeclare -A hash\n### Read in\
  \ our data\nwhile read key value; do\n  hash[$key]=\"$value\"\ndone\n### Show us\
  \ what we've got, though they won't\n### likely be in the same order as read\nfor\
  \ key in \"${!hash[@]}\"; do\n  echo \"key $key === value ${hash[$key]}\"\ndone\n\
  ```\n\n这里有一个替代示例：\n\n```\n### We want a hash (i.e., key/value pairs)\ndeclare -A\
  \ hash\n### Read in our data: word and # of occurrences\nwhile read word count;\
  \ do\n  let hash[$word]+=\"$count\"\ndone\n### Show us what we’ve got, though the\
  \ order\n### is based on the hash, i.e., we don’t control it\nfor key in \"${!hash[@]}\"\
  ;do\n  echo \"word $key count = ${hash[$key]}\"\ndone\n```\n\n本章更多是关于 for 等循环结构，但如果你想要关于列表和哈希的更多细节和示例，请参见第\
  \ 7 章。\n\n#### Quotes and Spaces\n\n关于这个 for 循环，还有一个重要的方面需要考虑。你注意到我们在前面示例中引号使用不一致吗？如果列表中的值包含空格（例如，如果每个条目都有名字和姓氏），那么我们的示例\
  \ for 循环：\n\n```\nfor person in ${namelist[@]}; do\n  echo $person\ndone\n```\n\n\
  可能会产生如下输出：\n\n```\nArt\nSmith\nAnn\nArundel\nHank\nTill\nJohn\nJakes\n```\n\nfor\
  \ 循环为我们列表中的四个名字打印出八个不同的值。为什么？怎么会这样？答案在于 bash 对 ${namelist[@]} 的替换。它只是把那些名字放在变量表达式的位置。那就留下八个词的列表，像这样：\n\
  \n```\nfor person in Art Smith Ann Arundel Hank Till John Jakes\n```\n\nfor 循环只是得到一个词列表。它不知道它们来自哪里。\n\
  \nbash 有语法可以解决这个难题：给列表表达式加上引号，每个值都会被引用。\n\n```\nfor person in \"${namelist[@]}\"\
  \n```\n\n\n\nwill be translated to:\n\n```\nfor person in \"Art Smith\" \"Ann Arundel\"\
  \ \"Hank Till\" \"John Jakes\"\n```\n\nand that will yield the desired result:\n\
  \nArt Smith\nAnn Arundel\nHank Till\nJohn Jakes\n\nIf your for loop is going to\
  \ iterate over a list of filenames, then you should be sure to use the quotation\
  \ marks, since filenames might have a space in them.\n\nThere is one last twist\
  \ to all this. The list syntax can use either * or @ to list all the elements of\
  \ the list: ${namelist[*]} works just as well...except when put inside quotes. The\
  \ expression:\n\n```\n\"${namelist[*]}\"\n```\n\nwill be evaluated with all of the\
  \ values inside of a single string. In this example:\n\n```\nfor person in \"${namelist[*]}\"\
  ; do\n  echo $person\ndone\n```\n\nwould result in a single line of output, like\
  \ this:\n\nArt Smith Ann Arundel Hank Till John Jakes\n\nThough a single string\
  \ might be useful in some contexts, it is especially pointless in a for loop—there\
  \ would be only one iteration. We recommend using @ unless you are positive that\
  \ you need *.\n\nSee also “Quoting” on page 129.\n\n#### Developing and Testing\
  \ for Loops\n\nIt turns out that “for list do something” loops are extremely useful\
  \ in all kinds of ways. Let’s take two simple examples: running SSH commands on\
  \ a list of servers and renaming files, like for file in *.JPEG; do mv -v $file\
  \ ${file/JPEG/jpg}; done. But how do you develop and test a script or even a simple\
  \ for command? The same way you develop anything else: start simple and go one step\
  \ at a time. But in particular, you use echo (see Example 2-1). Note that the bash\
  \ builtin echo has a number of interesting options, but is not POSIX (see “POSIX\
  \ Output” on page 56). The most interesting and often used are -e (to enable interpretation\
  \ of backslash escapes) and -n (to suppress the automatic trailing newline).\n\n\
  #### Example 2-1. File rename—test version\n\n```\n##### Building and testing a\
  \ rename command, note the echo\nfor file in *.JPEG; do echo mv -v $file ${file/JPEG/jpg};\
  \ done\n```\n\n```\n##### Simple multi-node SSH, note the 1st echo (can do on 1\
  \ line, broken for book)\nfor node in web-server{00..09}; do\necho ssh $node 'echo\
  \ -e \"$HOSTNAME\\t$(date \"%F\") $(uptime)\"';\ndone\n```\n\nOnce it’s working\
  \ as expected, remove that leading echo and go. Of course, if you are using redirection\
  \ in the block, you have to be careful about that, perhaps changing | to .p., >\
  \ to .gt., and so on until you get each stage working.\n\n![](img/553ffa1bc15093729b691f706befc0ac_31_0.png)\n\
  \n#### Execute the Same Command Across Multiple Hosts\n\nThis is way out of scope\
  \ for this book, but if you need to run the same command on many hosts, you should\
  \ probably be using Ansible, Chef, Puppet, or a similar tool. Sometimes you have\
  \ a really quick and dirty need, and one of these tools might be useful:\n\n- **clusterssh**\n\
  \  Written in Perl, it opens a bunch of unmanaged terminals in windows.\n- **mssh\
  \ (MultiSSH)**\n  GTK+-based multi-SSH client in a single GUI window.\n- **mussh**\n\
  \  MUltihost SSH Wrapper shell script.\n- **pconsole**\n  Intended for tiling window\
  \ managers, spawns a terminal per host.\n- **multixterm**\n  Written in Expect &\
  \ Tk, drives multiple xterms.\n- **PAC Manager**\n  A Perl SecureCRT-like GUI on\
  \ Linux.\n\n#### while and until\n\nWe mentioned while in passing previously, and\
  \ it works as you’d expect—“execute block while criteria exit status is zero”:\n\
  \n```\nwhile <CRITERIA>; do <BLOCK>; done\n```\n\nIt’s often used in reading files;\
  \ see several examples in Chapter 9. For argument parsing, see “Parsing Options”\
  \ on page 75.\n\nUnlike other languages, in bash until is just ! while, or “execute\
  \ block while criteria exit status is not zero”:\n\n```\nuntil <CRITERIA>; do <BLOCK>;\
  \ done\n##### Same:\n! while <CRITERIA>; do <BLOCK>; done\n```\n\nThis is really\
  \ handy for something like waiting for a node to be created or rebooted (Example\
  \ 2-2).\n\n##### Example 2-2. Wait for reboot\n\n```\nuntil ssh user@10.10.10.10;\
  \ do sleep 3; done\n```\n\n#### Style and Readability: Recap\n\nIn this chapter,\
  \ we first took a quick look at the C/C++ style numerical for loop. Then we went\
  \ further. Bash is very string oriented and has some other styles of for loops worth\
  \ knowing. Its minimalist loop for variable provides implicit (and arguably obscure)\
  \ iteration over the arguments to a script or a function. An explicit list of values,\
  \ string or otherwise, provided to the for loop also gives us the perfect mechanism\
  \ for iterating over all the elements of a list or over all keys in a hash.\n\n\
  We now know that both ${namelist[@]} and ${namelist[*]} show all the values of the\
  \ list, but if they are enclosed in double quotes, the result is different: separate\
  \ strings versus one large string. The same is true for the special shell variables\
  \ $@ and $*. They both represent the list of all the arguments to the script (i.e.,\
  \ $1, $2, etc.). When enclosed in double quotes, though, they also result in either\
  \ multiple strings or a single string. Why bring that up now? Only to circle back\
  \ to our simplest for loop:\n\n```\nfor param\n```\n\nand say that this is equivalent\
  \ to:\n\n```\nfor param in \"$@\"\n```\n\nWe argue that the second form is better\
  \ because it shows more explicitly which values are being iterated over. However,\
  \ there is a counterargument that the $@ variable name itself and the necessity\
  \ of the quotes are both specialized knowledge that is no more obvious to the naive\
  \ reader than just the first, simple form. If you really prefer the first form,\
  \ simply add a comment:\n\n```\nfor param    # Iterate over all the script arguments\n\
  ```\n\nWhen looping over a sequence of integer values, the C-style for loop with\
  \ double parentheses is probably the most readable as well as the most efficient.\
  \ (If efficiency is a big concern, be sure to use declare -i i early in your script\
  \ to make your variable \"i\" an explicit integer, avoiding conversion to/from a\
  \ string.)\n\nKnowing that you have all these values readily available, what might\
  \ you do with them? What goes on inside the loop, making use of these values? Decisions\
  \ must be made about the values encountered, and decision-making brings us to another\
  \ important feature in bash: its supercharged and superflexible case statement,\
  \ the topic of the next chapter.\n\nfor commands are extremely useful but can be\
  \ tricky to develop. Start simple and use echo until you’re sure your command is\
  \ working as intended. And remember the “syntactic sugar” while and until commands\
  \ for readability where useful.\n\n#### Make Your Case\n\nMany programming languages\
  \ provide a “switch” or “match” statement, an n-way branch, used as an alternative\
  \ to a string of if/then/else clauses. There is a similar construct in bash: the\
  \ case statement. It comes with powerful pattern matching and is very useful in\
  \ scripting.\n\nThe keywords case and in delineate the value you want to compare\
  \ against various patterns. Here’s a simple example:\n\n```\ncase \"$var\" in\n\
  \  yes ) echo \"glad you agreed\" ;;\n  no )\n    echo \"sorry; good bye\"\n   \
  \ exit\n  ;;\n  * ) echo \"invalid answer. try again\" ;;\nesac\n```\n\n...which\
  \ you can probably figure out. It checks to see if the value in $var is “yes” or\
  \ “no” and executes the corresponding statement(s). It even has a default action.\
  \ The end of the case statement is marked by esac, which is case spelled backward.\
  \ This example is pretty readable, but it just scratches the surface. You’ll also\
  \ note that you used two different block styles, a “one-liner” for yes and a more\
  \ typical block (closed by ;;...more on that later) for no. Which you use depends\
  \ on what you are doing and how the code lines up for readability.\n\n![](img/553ffa1bc15093729b691f706befc0ac_35_0.png)\n\
  \n#### ( in case\n\nThe syntax for the case statement includes an optional “(” to\
  \ match the “)” in the example. For example, we could have written (\"yes\") instead\
  \ of just \"yes\") and similarly for the other items. We’ve rarely seen this used,\
  \ though. After all, who wants to type an extra character?\n\nThe real power of\
  \ the case statement, and the most idiomatic appearance, comes from using the shell’s\
  \ pattern matching for the various possible value comparisons:\n\n```\ncase \"$var\"\
  \ in\n  [Nn][Oo]* )\n    echo \"Fine. Leave then.\"\n    exit\n  ;;\n  [Yy]?? |\
  \ [Ss]ure | [Oo][Kk]* )\n    echo \"OK. Glad we agree.\"\n  ;;\n  * ) echo 'Try\
  \ again.'\n    continue\n  ;;\nesac\n```\n\nHere is a quick review of bash pattern\
  \ matching, which you are probably familiar with as command line wildcards (or globs).\
  \ There are three special characters to watch for: ? matches a single character,\
  \ * matches any number of characters (including none), and brackets, [], match any\
  \ of the characters included between the brackets.\n\nIn our example, the construct\
  \ [Yy] matches either uppercase Y or lowercase y. The construct [Nn][Oo]* matches\
  \ either upper- or lowercase N, followed by either upper- or lowercase O, followed\
  \ by any number of any other characters. The pattern matches the following words\
  \ (and others, too): no, No, nO, NO, noway, Not Ever, and nope. It will not be a\
  \ match if the value of $var is the word never.\n\nCan you guess some possible values\
  \ for the affirmative case? The vertical bar separates different patterns that would\
  \ all lead to the same result. (Think “OR” but not the || or.) The words Yes, yes,\
  \ YES, yEs, yES, yup, Sure, sure, OK, ok, and OKfine and “OK why not” would all\
  \ work. But these words would not: ya, SURE, oook, and many more.\n\nThe default\
  \ case isn’t special syntax—it’s just a pattern—but this pattern would match anything.\
  \ If no other previous pattern has produced a match, then we know that this one\
  \ will—it matches any number of any characters. Therefore, bash script writers put\
  \ this one last in the list if they want to catch a default case.\n\n\n\n\n\n![](img/553ffa1bc15093729b691f706befc0ac_36_0.png)\n\
  \n#### 非正则表达式\n\ncase 语句中使用的模式匹配不是正则表达式。在 bash 中，唯一允许使用正则表达式（regex 或 regexp）的地方是在\
  \ if 语句中使用 =~ 比较运算符。如果确实需要使用正则表达式，那么你需要使用一系列 if/then/else 语句而不是 case。\n\n#### 一个现实的使用案例\n\
  \n解析命令行选项的代码是常见的使用 case 语句的地方。让我们来看一个简单但相当现实的脚本，它很好地利用了 case 语句。\n\n#### 动机\n\n\
  如果你曾经使用过 Linux 或 Unix，你很可能大量使用了 ls 命令来列出文件名和相关信息。ls 的一些选项在提供更多信息或以特定方式排序时非常方便。你可能会养成使用\
  \ ls 或最常使用的选项的某些习惯。因此，你可能会创建一些别名甚至整个脚本来更方便地使用你喜欢的组合。但随后你最终会拥有多个不同的脚本。它们在功能上都相关但各不相同。我们如何将它们全部合并到一个脚本中？\n\
  \n考虑一个熟悉的例子，名为 Git 的流行源代码控制软件。它有几个相关但不同的功能，所有功能都使用同一个命令名 git 调用，但每个功能都由第二个不同的关键字区分，例如\
  \ git clone、git add、git commit、git push 等等。\n\n#### 我们的脚本\n\n我们可以将这种“子命令”方法应用于我们的情况。让我们考虑一些我们想要使用的\
  \ ls 相关功能：按文件名长度顺序列出文件（连同长度），仅列出最长的文件名，列出最近修改的最后几个文件，以及使用颜色编码按文件类型列出文件名——这是 ls 的标准功能，但需要一些难以记住的选项。\n\
  \n我们的脚本将命名为 list，但会有第二个词来指定其中一个功能。那个词可以是 color、last、length 或 long。示例 3-1 包含一个执行此操作的脚本。\n\
  \n#### 示例 3-1. 使用 case 的简单包装脚本\n\n```\n#!/usr/bin/env bash\n##### list.sh: A wrapper\
  \ script for ls-related tools & simple `case..esac` demo\n##### Original Author\
  \ & date: _bash Idioms_ 2022\n##### bash Idioms filename: examples/ch03/list.sh\n\
  ##### ----------------------------------------------------------------------------\n\
  VERSION='v1.2b'\n\nfunction Usage_Exit {\n    echo \"$0 [color|last|len|long]\"\n\
  \    exit\n}\n\n##### Show each filename preceded by the length of its name, sorted\
  \ by filename\n##### length. Note '-' is valid but uncommon in function names, but\
  \ it is not\n##### valid in variable names. We don't usually use it, but you can.\n\
  function Ls-Length {\n    ls -1 \"$@\" | while read fn; do\n        printf '%3d\
  \ %s\\n' ${#fn} ${fn}\n    done | sort -n\n}\n\n(( $# < 1 )) && Usage_Exit\nsub=$1\n\
  shift\n\ncase $sub in\n    color)\n        ls -N --color=tty -T 0 \"$@\"    # Colorized\
  \ ls\n    ;;\n    last | latest)\n        ls -lrt | tail \"-n${1:-5}\"     # Latest\
  \ files\n    ;;\n    len*)\n        Ls-Length \"$@\"                 # Files with\
  \ name lengths\n    ;;\n    long)\n        Ls-Length \"$@\" | tail -1       # File\
  \ with longest name\n    ;;\n    *)\n        echo \"unknown command: $sub\"    #\
  \ Default\n        Usage_Exit\n    ;;\nesac\n```\n\n我们不会在这里解释这个脚本的所有部分，尽管到本书结束时，你将学到所使用的所有功能。我们主要想关注\
  \ case 语句：\n\n+   1. 你能认出非 if 的 if 逻辑吗？如果不能，请（重新）阅读第 1 章。\n+   2. 这是两个词之间的简单“或”选择。\n\
  +   3. 如果 $1 中未给出值，则使用 tail -n5 作为默认值；请参阅第 38 页的“默认值”。\n+   4. 此模式将匹配以“len”开头的任何词，因此“len”或“length”都会匹配，但“lenny”和“lens”也会匹配。它随后调用\
  \ Ls-Length 函数（我们在脚本中定义），并将传递给此脚本的所有命令行参数（如果有）传递给它。\n\n#### 包装脚本\n\n每个人都有很多事情要做，很多需要记住的事情，所以当你可以自动化或编写脚本为你记住细节时，这就是胜利。我们在示例\
  \ 3-1 中展示了一种“包装脚本”的方法，但根据你解决的问题的复杂性或你“记住”的细节，你可以使用许多有趣的变化和技巧。在示例 3-1 中，我们调用了一个函数或只是内联放置代码。对于非常短的代码块来说，这效果最好，在我们的经验中，这些在这种类型的包装脚本中非常常见。如果你有更复杂的解决方案，或者你正在使用现有工具，你可以调用那些工具或子脚本，不过你需要调整错误检查和可能的用法选项。你还可以将它与第\
  \ 93 页的“Drop-in Directories”结合使用，并从目录中 source 所有“模块”，也许可以将代码部分的维护委托给其他人或团队。\n\n\
  这个更大的例子实际上是我们编写本书时使用的脚本的简化版和摘录。AsciiDoc 很酷，但我们使用很多标记语言，它们都混在一起了，所以我们可以编写一个工具来为我们记住事情，如示例\
  \ 3-2 所示。\n\n#### 示例 3-2. 使用 case 的复杂包装脚本\n\n```\n#!/usr/bin/env bash\n##### wrapper.sh:\
  \ Simple \"wrapper\" script demo\n##### Original Author & date: _bash Idioms_ 2022\n\
  ##### bash Idioms filename: examples/ch03/wrapper.sh\n#_____________________________________________________________________________\n\
  ##### Trivial Sanity Checks\n```\n\n```\n[ -n \"$BOOK_ASC\" ] || {\n    echo \"\
  FATAL: export \\$BOOK_ASC to the location of the Asciidoc files!\"\n    exit 1\n\
  }\n\\cd \"$BOOK_ASC\" || {\n    echo \"FATAL: can't cd to '$BOOK_ASC'!\"\n    exit\
  \ 2\n}\n\nSELF=\"$0\"\naction=\"$1\"\nshift\n[ -x /usr/bin/xsel -a $# -lt 1 ] &&\
  \ {\n    # Read/write the clipboard on Linux\n    text=$(xsel -b)\n    function\
  \ Output {\n        echo -en \"$*\" | xsel -bi\n    }\n} || {\n    # Read/write\
  \ STDIN/STDOUT\n    text=$*\n    function Output {\n        echo -en \"$*\"\n  \
  \  }\n}\n\ncase \"$action\" in\n\n########################################\n#####\
  \ Content/Markup\n\n###### Headers\n h1 )\n        # Inside chapter heading 1 (really\
  \ AsciiDoc h3)\n        Output \"[[${$SELF id $text}]]\\n=== $text\"\n    ;;\n h2\
  \ )\n        # Inside chapter heading 2 (really AsciiDoc h4)\n        Output \"\
  [[${$SELF id $text}]]\\n==== $text\"\n    ;;\n h3 )\n        # Inside chapter heading\
  \ 3 (really AsciiDoc h5)\n        Output \"[[${$SELF id $text}]]\\n===== $text\"\
  \n    ;;\n\n###### Lists\n bul|bullet )\n        # Bullet list (** = level 2, +\
  \ = multiline element)\n        Output \"* $text\"\n    ;;\n nul|number|order* )\n\
  \        # Numbered/ordered list (.. = level 2, + = multiline)\n        Output \"\
  . $text\"\n    ;;\n term )\n        # Terms\n        Output \"term_here::\\n  $text\"\
  \n\n```\n\n```\n;;\n\n###### Inline\nbold )\n    # Inline bold (O'Reilly prefers\
  \ italics to bold)\n    Output \"*${text}*\"\n;;\ni|italic|itl )      # Inline italics\
  \ (O'Reilly prefers italics to bold)\n    Output \"_${text}_\"\n;;\nc|constant|cons\
  \ )   # Inline constant width (command, code, keywords, more)\n    Output \"+${text}+\"\
  \n;;\ntype|constantbold ) # Inline bold constant width (user types literally)\n\
  \    Output \"*+${text}+*\"\n;;\nvar|constantitalic ) # Inline italic constant width\
  \ (user-supplied values)\n    Output \"_+${text}+_\"\n;;\nsub|subscript )     #\
  \ Inline subscript\n    Output \"~${text}~\"\n;;\nsup|superscript )   # Inline superscript\n\
  \    Output \"^${text}^\"\n;;\nfoot )              # Create a footnote\n    Output\
  \ \"footnote:[${text}]\"\n;;\nurl|link )          # Create a URL with alternate\
  \ text\n    Output \"link:\\${\\$text\\$\\$[]\"   # URL[link shows as]\n;;\nesc|escape\
  \ )        # Escape a character (esp. *)\n    Output \"\\$\\$${text}\\$\\$\"  #\
  \ $*$ $\n;;\n\n#####################################################\n# Tools\n\n\
  id )                ## Convert a hack/recipe name to an ID\n    #us_text=${text//\
  \ /_}  # Space to '_'\n    #lc_text=${us_text,,}  # Lowercase; bash 4+ only!\n \
  \   # Initial `tr -s ' ' ' ' to preserve _ in case we process an ID\n    # twice\
  \ (like from \"xref\")\n    # Also note you can break long lines with a trailing\
  \ |\n    Output $(echo $text | tr -s '_' ' ' | tr '[:upper:]' '[:lower:]' \\\n \
  \   | tr -d '[:punct:]' | tr -s ' ' '_')\n;;\n\nindex )             ## Creates 'index.txt'\
  \ in AsciiDoc dir\n    # Like:\n        # ch02.asciidoc== The Text Utils\n     \
  \   # ch02.asciidoc=== Common Text Utils and similar tools\n```\n\n\n\n\n\n# ch02.asciidoc:===\
  \ Finding data\negrep '^===' ch*.asciidoc | egrep -v '^ch00.asciidoc' \\\n> $BOOK_ASC/index.txt\
  \ && {\n    echo \"Updated: $BOOK_ASC/index.txt\"\n    exit 0\n} || {\n    echo\
  \ \"FAILED to update: $BOOK_ASC/index.txt\"\n    exit 1\n}\n;;\n\nrerun )      \
  \      ## Run examples to re-create (existing!) output files\n    # Only re-run\
  \ for code that ALREADY HAS a *.out file...not ALL *.sh code\n    for output in\
  \ examples/*/*.out; do\n        code=${output/out/sh}\n        echo \"Re-running\
  \ code for: $code > $output\"\n        $code > $output\n    done\n;;\n\ncleanup\
  \ )           ## Clean up all the xHTML/XML/PDF cruft\n    rm -fv {ch??,app?}.{pdf,xml,html}\
  \ book.{xml,html} docbook-xsl.css\n;;\n\n* )\n    \\cd -  # UGLY cheat to revert\
  \ the 'cd' above...\n    ( echo \"Usage:\"\n    egrep '\\()[[:space:]]+#+ '  $0\n\
  \    echo ''\n    egrep '\\()[[:space:]]+## ' $0\n    echo ''\n    egrep '\\()[[:space:]]+###\
  \ ' $0 ) | grep \"$S{1:-.}\" | more\n;;\nesac\n\n我们在这段代码中有很多内容，所以让我们逐一拆解：\n\n+ \
  \  1. 实际的脚本对本书的 AsciiDoc 源代码执行了大量操作，因此最好确保我们处于正确的位置，并且有一个方便的环境变量设置。\n\n+   2. 我们通常使用\
  \ $PROGRAM 来保存 bash 基名，但在这种情况下我们会递归调用此脚本很多次，所以 $SELF 似乎更直观。\n\n+   3. 正如我们在第 11\
  \ 章中会更详细讨论的那样，使用有意义的变量名而不是位置参数是一个好主意，所以让我们这样做。\n\n4 一旦我们捕获了操作，就不再需要旧的 $1 了，但可能还有更多选项，所以将\
  \ $1 移开。\n\n5 如果 /usr/bin/xsel 存在且可执行，并且如果没有更多选项，我们就知道我们正在从 X Window 剪贴板读取和写入，否则我们从参数获取文本并将输出发送到\
  \ STDOUT。实际上，我们从编辑器复制，切换到命令行，运行工具，切换回来，然后粘贴。\n\n6 这里是我们开始真正做某事的地方——也就是说，弄清楚我们的“操作”是什么。\n\
  \n7 为了代码组织和可读性，将操作拆分为各个部分；另见 7。\n\n8 让我们从标题的标记开始。\n\n9 这行既是代码也是文档。$action 是我们想要一个顶级（对于本书代码）标题，h1。我们稍后会看到它如何也是文档。\n\
  \n10 执行工作。首先，调用我们自己为文本获取一个 AsciiDoc “ID”，然后输出该 ID 用双方括号括起来，后跟换行符，然后将文本缩进并用 === 表示标题级别，最后调用\
  \ Output 函数。希望剩下的代码很容易理解。\n\n11 为了代码组织和可读性，将操作拆分为各个部分；另见 7。\n\n12 你可以用尾随的 \\; 来换行；另见“布局”第\
  \ 130 页。\n\n13 在兜底部分变得有趣起来，它将帮助或用法与未知参数处理以及出色的“帮助中搜索”功能结合在一起。\n\n14 我们将拥有的任何输出包装到一个我们通过管道传输到\
  \ more 的子 shell 中，以防它很长。\n\n15 这里是我们谈到的“代码即文档”行，见注释 9。我们 grep 查找 case 语句的闭合括号 )，后跟空格，后跟单个注释标记\
  \ #。这给了我们第 1 级“内容/标记”操作。这会提取使 case 语句工作的实际代码行，但由于我们添加了注释，它也向你展示了它做了什么。\n\n16 这对第\
  \ 2 级“工具”部分做同样的事情。\n\n17 这将对处理 Git 操作的第 3 级做同样的事情，但我们在这里为了简单起见省略了该代码。但它也使用 grep\
  \ 和 ${1:-.} 来显示我们对 wrapper.sh help heading 之类的帮助，或全部内容（grep \".\"）。对于这么短的脚本，这可能看起来不算什么大问题，但随着时间的推移它会增长（而且会增长），这就变得非常方便了！\n\
  \ngrep 命令和之前提到的“级别”的结果是显示一个帮助消息，该消息已排序但分为“第 1 级”和“第 2 级”部分：\n\n```\n$ examples/ch03/wrapper.sh\
  \ help\nUsage:\n    h1 )                # Inside chapter heading 1 (really AsciiDoc\
  \ h3)\n    h2 )                # Inside chapter heading 2 (really AsciiDoc h4)\n\
  \    h3 )                # Inside chapter heading 3 (really AsciiDoc h5)\n    bul|bullet\
  \ )        # Bullet list (** = level 2, + = multiline element)\n    nul|number|order*\
  \ ) # Numbered/ordered list (.. = level 2, + = multiline)\n    term )          \
  \    # Terms\n    bold )              # Inline bold (ORA prefers italics to bold)\n\
  \    i|italic*|itl )     # Inline italics (ORA prefers italics to bold)\n    c|constant|cons\
  \ )   # Inline constant width (command, code, keywords, more)\n    type|constantbold\
  \ ) # Inline bold constant width (user types literally)\n    var|constantitalic\
  \ )# Inline italic constant width (user-supplied values)\n    sub|subscript )  \
  \   # Inline subscript\n    sup|superscript )   # Inline superscript\n    foot )\
  \              # Create a footnote\n    url|link )          # Create a URL with\
  \ alternate text\n    esc|escape )        # Escape a character (esp. *)\n    id\
  \ )                ## Convert a hack/recipe name to an ID\n    index )         \
  \    ## Creates 'index.txt' in AsciiDoc dir\n    rerun )             ## Run examples\
  \ to re-create (existing!) output files\n    cleanup )           ## Clean up all\
  \ the xHTML/XML/PDF cruft\n```\n\n```\n$ examples/ch03/wrapper.sh help heading\n\
  \    h1 )                # Inside chapter heading 1 (really AsciiDoc h3)\n    h2\
  \ )                # Inside chapter heading 2 (really AsciiDoc h4)\n    h3 )   \
  \             # Inside chapter heading 3 (really AsciiDoc h5)\n```\n\n## 再加一个转折\n\
  \n在与每个模式关联的每段代码的末尾，我们都以双分号结束。在本章开头的第一个示例中，我们写道：\n\n```\n\"yes\") echo \"glad you\
  \ agreed\" ;;\n```\n\n在 echo 命令之后，我们放置了 ;;，这表示不应再执行任何操作。执行将在 esac 关键字之后继续。\n\n但有时你不希望这种行为。在某些情况下，你可能希望\
  \ case 语句中的其他模式被检查，或执行其他操作。bash 的语法允许这样做，使用 ;;& 和 ;& 来表示这些变体。\n\n以下是提供有关 $filename\
  \ 中路径的详细信息的这种行为的示例：\n\n```\ncase $filename in\n  ./*) echo -n \"local \"       \
  \   # Begins with ./\n      ;&                           # Fall through!\n  [^/]*)\
  \ echo -n \"relative \"      # Starts w/ anything but a slash\n      ;;&       \
  \                   # Look for other matches\n  /*) echo -n \"absolute \"      \
  \   # Begins with a slash\n      ;&                           # Fall through\n \
  \ */*) echo \"pathname\"            # A slash anywhere\n      ;;               \
  \            # Done\n  *) echo \"filename\"              # All other\n      ;; \
  \                          # Done\nesac\n```\n\n模式将按顺序与 $filename 中的值进行比较。第一个模式是两个字面字符——句点和斜杠——后跟任意字符。如果匹配（例如，如果\
  \ $filename 的值为 ./this/file），则脚本将打印“local”但末尾没有换行。下一行是 ;&，它告诉 bash “贯穿”并执行下一个模式相关联的命令（甚至不检查匹配）。因此它也会打印“relative”。与前一个模式不同，此代码段以\
  \ ;;& 结束，它告诉 bash 尝试匹配其他模式（按顺序向前）。\n\n所以现在它将检查下一个模式，寻找前导斜杠。如果不匹配，下一个可能匹配。它在字符串中寻找任何位置的斜杠（任意——零个或多个字符，然后是斜杠，然后是任意字符）。如果匹配（在我们的示例中会匹配），它将打印单词\
  \ pathname。;; 表示不需要再检查其他模式，操作完成。\n\n#### 风格和可读性：回顾\n\n在本章中，我们描述了 case 语句，即执行流程中的\
  \ n 路分支。它的模式匹配功能使其在脚本中非常有用，尽管常见的用法是对特定单词进行简单的字面匹配。\n\n变体 ;;、;;& 和 ;& 提供了一些有用的功能，但可能很棘手。最好使用\
  \ if/then/else 而不是 case 语句来构建此类逻辑。\n\n这些符号如此细微地不同，以至于很容易忽略每一步发生的事情。匹配后控制流可能因每个 case\
  \ 而异：执行更多代码以贯穿、尝试匹配另一个模式，或完成。因此我们强烈建议你在脚本中对你的选择进行注释，以避免混淆或误解。\n\n\n\n\n"
- "## 变量俗语\n\n看到包含惯用语 `${0##*/}` 的错误信息或赋值语句并不罕见，它看起来像是某种对 `$0` 的引用，但实际上还有更多内容在发生。让我们更仔细地看看变量引用以及这些额外字符为我们做了什么。我们会发现一整套字符串操作，只用几个特殊字符就能提供相当大的能力。\n\
  \n### 变量引用\n\n在大多数编程语言中，引用变量的值非常直接。你要么直接使用变量名，要么在名称前加上一个字符以明确表示你想要检索值。在 bash 中也是如此：你通过名称赋值给变量，`VAR=something`，并通过美元符号前缀检索值：`$VAR`。如果你想知道为什么需要美元符号，请考虑\
  \ bash 大多处理字符串，所以：\n\n```\nMSG=\"Error: FILE not found\"\n```\n\n会给你一个由所示四个词组成的简单字面字符串，而：\n\
  \n```\nMSG=\"Error: $FILE not found\"\n```\n\n会将 `$FILE` 替换为该变量的值（该变量 presumably\
  \ 保存着它正在查找的文件名）。\n\n![](img/553ffa1bc15093729b691f706befc0ac_46_0.png)\n\n### 变量插值\n\
  \n请确保使用双引号以使这种字符串替换发生。使用单引号会将所有字符视为字面值，不会发生任何替换。\n\n为了避免变量名称何时结束的混淆（在这个例子中空格使其变得容易），变量引用的更完整语法使用大括号括住变量名\
  \ `${FILE}`，并且可以在我们的示例中使用。\n\n这种带大括号的语法是变量引用周围许多特殊语法的基础。例如，我们可以在变量名前加上井号 `${#VAR}`，以返回的不是其值而是值的字符串长度。\n\
  \n| ${VAR} | ${#VAR} |\n|---|---|\n| oneword | 7 |\n| /usr/bin/longpath.txt | 21\
  \ |\n| many words in one string | 24 |\n| 3 | 1 |\n| 2356 | 4 |\n| 1427685 | 7 |\n\
  \n但 bash 可以做的不止于简单地检索值或其长度。\n\n### 参数扩展\n\n在检索变量值时，可以指定某些替换或编辑，影响返回的值（除一种情况外，不会影响变量中的值）。语法涉及在大括号中界定变量名称的特殊字符序列，如这些大括号内的字符：`${VAR##*/}`。以下是一些值得了解的扩展。\n\
  \n### basename 的简写\n\n当你调用脚本时，你可能只使用其文件名作为调用脚本的命令，但这假设脚本具有执行权限并且位于你的 PATH 变量中目录之一的目录中。你可能使用\
  \ `./scriptname` 调用脚本，如果脚本在当前目录中。你可能使用完整路径名 `/home/smith/utilities/scriptname` 调用它，甚至如果当前工作目录在附近，可以使用相对路径名。\n\
  \n无论你以何种方式调用脚本，`$0` 都将包含你用来调用脚本的字符序列——相对路径或绝对路径，以你表达的方式为准。\n\n当你想在用法消息中打印该脚本的名称时，你可能只想要\
  \ basename，即文件本身的名称，而不是到达那里的任何路径：\n\n```\necho \"usage: ${0##*/} namesfile datafile\"\
  \n```\n\n你可能会在用法消息中看到它，告诉用户运行脚本的正确语法，或者它可能是赋值右侧的变量。在后一种情况下，我们希望变量被称为 `PROGRAM` 或\
  \ `SCRIPT` 之类的名称，因为这就是该表达式返回的内容——正在执行的脚本的名称。\n\n让我们更仔细地看看 `$0` 上的这个特定参数扩展，你可以用它来获取仅限\
  \ basename 而不带路径的其他部分。\n\n### 路径或前缀移除\n\n你可以从值的前面（前缀或左侧）或尾部（后缀或右侧）移除字符。要从字符串的左侧移除一组字符，你在参数引用上加上\
  \ # 和 shell 模式，该模式匹配你想要移除的字符。\n\n表达式 `${MYVAL#img_}` 会在 `MYVAL` 变量的字符串以 `img_` 开头时移除字符\
  \ `img_`。使用更复杂的模式，我们可以写 `${MYVAL#*_}`。这将移除到下划线为止的任何字符序列，包括下划线本身。（如果没有匹配的模式，则其完整值将保持不变返回。）\n\
  \n单个 # 表示它将使用可能的最短匹配（非贪婪）。双重 ## 表示使用可能的最长匹配（贪婪）。\n\n现在，也许你可以看出表达式 `${0#*/}` 会做什么？\n\
  \n它将从 `$0` 中的值开始，即用于调用脚本的路径名。然后，从值的左侧，它将移除任何数量的字符以斜杠结尾的最长匹配。因此，它正在移除调用脚本时使用的路径的所有部分，只留下脚本本身的名称。\n\
  \n以下是 `$0` 的一些可能值以及我们讨论的这个模式，以了解短 (#) 和长 (##) 匹配在结果上可能有何不同：\n\n| Value in $0 | Expression\
  \ | Result returned |\n|---|---|---|\n| ./ascript | ${0#*/} | ascript |\n| ./ascript\
  \ | ${0##*/} | ascript |\n| ../bin/ascript | ${0#*/} | bin/ascript |\n| ../bin/ascript\
  \ | ${0##*/} | ascript |\n| /home/guy/bin/ascript | ${0#*/} | home/guy/bin/ascript\
  \ |\n| /home/guy/bin/ascript | ${0##*/} | ascript |\n\n请注意，`*/` 的最短匹配模式可能只匹配斜杠本身。\n\
  \n![](img/553ffa1bc15093729b691f706befc0ac_49_0.png)\n\n### Shell 模式，而非正则表达式\n\n\
  参数扩展中使用的模式不是正则表达式。它们只是 shell 模式匹配，其中 * 匹配 0 个或多个字符，? 匹配单个字符，[chars] 匹配大括号内字符中的任意一个。\n\
  \n### dirname 或后缀移除的简写\n\n与 # 会移除前缀，即从左侧移除类似，我们可以通过使用 % 从右侧移除后缀，即从右侧移除。双百分号表示移除可能的最长匹配。以下是一些显示如何移除后缀的示例。第一个示例显示变量\
  \ `$FN`，它保存图像文件的名称。它可能以 .jpg 或 .jpeg 或 .png 或 .gif 结尾。看看不同的模式如何移除字符串右侧的各个部分。最后几个示例显示如何从\
  \ `$0` 参数获取类似于 dirname 的内容：\n\n| Value in shell variable | Expression | Result returned\
  \ |\n|---|---|---|\n| img.1231.jpg | ${FN%.*} | img.1234 |\n| img.1231.jpg | ${FN%%.*}\
  \ | img |\n| ./ascript | ${0%/*} | . |\n| ./ascript | ${0%%/*} | . |\n| /home/guy/bin/ascript\
  \ | ${0%/*} | /home/guy/bin |\n| /home/guy/bin/ascript | ${0%%/*} |  |\n\n这种用于 dirname\
  \ 的参数替换并不是命令输出的精确复制。它在路径为 /file 的情况下有所不同，因为 dirname 会返回仅一个斜杠，而我们的参数替换会将其全部移除。你可以在脚本中用一些额外的逻辑检查这种情况，如果你不期望看到这种情况可以忽略它，或者你可以简单地在参数末尾加上一个斜杠，如\
  \ `${0%/*}/`，这样所有结果都会以斜杠结尾。\n\n![](img/553ffa1bc15093729b691f706befc0ac_49_1.png)\n\
  \n### 前缀和后缀移除\n\n你可以记住 # 移除左侧部分而 % 移除右侧部分，因为至少在标准美国键盘上，# 是 shift-3，位于 % 的 shift-5\
  \ 的左侧。\n\n### 其他修饰符\n\n除了 # 和 % 之外，还有一些其他修饰符可以改变参数扩展的值。你可以通过 ^ 或 ^^ 分别将字符串中的第一个字符或所有字符转换为大写，或通过\
  \ , 或 ,, 转换为小写，如这些示例所示：\n\n| Value in shell variable TXT | Expression | Result returned\
  \ |\n|---|---|---|\n| message to send | ${TXT^} | Message to send |\n| message to\
  \ send | ${TXT^^} | MESSAGE TO SEND |\n| Some Words | ${TXT,} | some Words |\n|\
  \ Do Not YELL | ${TXT,,} | do not yell |\n\n你也可以考虑 `declare -u UPPER` 和 `declare\
  \ -l lower`，它们声明这些 shell 变量，使其内容在分配给这些变量的任何文本时转换为大写或小写。\n\n最灵活的修饰符是在字符串的任何位置进行替换，而不仅仅是在字符串的前端或尾部。类似于\
  \ sed 命令，它使用斜杠 / 来指示要匹配的模式和要替换它的值。单个斜杠表示单个替换（第一个出现）。使用两个斜杠表示替换所有出现。以下是一些示例：\n\n\
  | Value in shell variable FN | Expression | Result returned |\n|---|---|---|\n|\
  \ FN=\"my filename with spaces.txt\" | ${FN/ /_} | my_filename with spaces.txt |\n\
  | FN=\"my filename with spaces.txt\" | ${FN// /_} | my_filename_with_spaces.txt\
  \ |\n| FN=\"my filename with spaces.txt\" | ${FN// /} | myfilenamewithspaces.txt\
  \ |\n| FN=\"/usr/bin/filename\" | ${FN//\\/ } | usr bin filename |\n| FN=\"/usr/bin/filename\"\
  \ | ${FN//\\/ } | usr/bin/filename |\n\n![](img/553ffa1bc15093729b691f706befc0ac_50_0.png)\n\
  \n### 无尾部斜杠\n\n请注意，与 sed 或 vi 等其他类似命令中会找到的尾部斜杠不同。闭合大括号结束替换。\n\n为什么不总是使用这种替换机制？为什么还要费心使用\
  \ # 或 % 从字符串两端进行替换？考虑这个文件名：frank.gifford.gif，假设你想使用 Image Magick 的 convert 命令将此文件名更改为\
  \ jpg 文件（那是另一个故事）。使用 / 的替换没有办法将搜索锚定到字符串的一端或另一端。如果你读取了文件名并尝试将 .gif 替换为 .jpg，你最终会得到\
  \ frank.jpgford.gif。对于这种情况，从字符串末尾取值的 % 替换效果要好得多。\n\n另一个有用的修饰符将提取变量的子字符串。在变量名之后，放置一个冒号，然后是子字符串的第一个字符的偏移量\n\
  \n\n要提取的内容。 由于这是一个偏移量，从字符串的第一个字符开始计数为 0。 接下来，放置另一个冒号和你想要的子字符串的长度。 如果省略这个第二个冒号和长度，则会得到从该点开始的字符串的剩余全部内容。\
  \ 这里有几个例子：\n\n| shell 变量 FN 中的值 | 表达式 | 返回结果 |\n|---|---|---|\n| /home/bin/util.sh\
  \ | ${FN:0:1} | / |\n| /home/bin/util.sh | ${FN:1:1} | h |\n| /home/bin/util.sh\
  \ | ${FN:3:2} | me |\n| /home/bin/util.sh | ${FN:10:4} | util |\n| /home/bin/util.sh\
  \ | ${FN:10} | util.sh |\n\n示例 4-1 展示了使用参数扩展从某些输入中解析数据，以创建并处理用于自动创建防火墙规则配置时使用的特定字段。\
  \ 我们还在代码中加入了 bash 参数扩展的更大表格，就像本书中经常做的那样，作为“真实代码可读性”示例。 输出在示例 4-2 中。\n\n## 示例 4-1.\
  \ 使用参数扩展进行解析：代码\n\n```\n#!/usr/bin/env bash\n# parameter-expansion.sh: parameter\
  \ expansion for parsing, and a big list\n##### Original Author & date: _bash Idioms_\
  \ 2022\n# bash Idioms filename: examples/ch04/parameter-expansion.sh\n# ______________________________________________________________\n\
  # Does not work on Zsh 5.4.2!\n\ncustomer_subnet_name='Acme Inc subnet 10.11.12.13/24'\n\
  \necho ''\necho \"Say we have this string: $customer_subnet_name\"\n\ncustomer_name=${customer_subnet_name%subnet*}\
  \    # Trim from 'subnet' to end\nsubnet=${customer_subnet_name##* }           \
  \    # Remove leading 'space*'\nipa=${subnet%/*}                               \
  \  # Remove trailing '/*'\ncidr=${subnet#*/}                                # Remove\
  \ up to '/*'\nfw_object_name=${customer_subnet_name// /_}      # Replace space with\
  \ '_'\nfw_object_name=${fw_object_name//-/}             # Replace '/' with '-'\n\
  fw_object_name=${fw_object_name,,}               # Lowercase\n\necho ''\necho 'When\
  \ the code runs we get:'\necho ''\necho \"Customer name: $customer_name\"\necho\
  \ \"Subnet:        $subnet\"\necho \"IPA            $ipa\"\necho \"CIDR mask:  \
  \   $cidr\"\n```\n\n```\necho \"FW Object:    $fw_object_name\"\n```\n\n## bash\
  \ Shell Parameter Expansion: https://oreil.ly/Af8lw\n\n# ${var#pattern}        \
  \  Remove shortest (nongreedy) leading pattern\n# ${var##pattern}         Remove\
  \ longest (greedy) leading pattern\n# ${var%pattern}          Remove shortest (nongreedy)\
  \ trailing pattern\n# ${var%%pattern}         Remove longest (greedy) trailing pattern\n\
  \n# ${var/pattern/replacement}   Replace first +pattern+ with +replacement+\n# ${var//pattern/replacement}\
  \   Replace all +pattern+ with +replacement+\n\n# ${var^pattern}      Uppercase\
  \ first matching optional pattern\n# ${var^^pattern}      Uppercase all matching\
  \ optional pattern\n# ${var,pattern}       Lowercase first matching optional pattern\n\
  # ${var,,pattern}      Lowercase all matching optional pattern\n\n# ${var:offset}\
  \          Substring starting at +offset+\n# ${var:offset:length}    Substring starting\
  \ at +offset+ for +length+\n\n# ${var:-default}        Var if set, otherwise +default+\n\
  # ${var:=default}        Assign +default+ to +var+ if +var+ not already set\n# ${var:?error_message}\
  \   Barf with +error_message+ if +var+ not set\n# ${var:+replaced}        Expand\
  \ to +replaced+ if +var+ _is_ set\n\n# ${#var}                Length of var\n# ${!var[*]}\
  \             Expand to indexes or keys\n# ${!var[@]}              Expand to indexes\
  \ or keys, quoted\n\n# ${!prefix*}            Expand to variable names starting\
  \ with +prefix+\n# ${!prefix@}            Expand to variable names starting with\
  \ +prefix+, quoted\n\n# ${var@Q}               Quoted\n# ${var@E}              \
  \ Expanded (better than `eval`!)\n# ${var@P}               Expanded as prompt\n\
  # ${var@A}               Assign or declare\n# ${var@a}               Return attributes\n\
  \n## 示例 4-2. 使用参数扩展进行解析：输出\n\nSay we have this string: Acme Inc subnet 10.11.12.13/24\n\
  \nWhen the code runs we get:\n\n```\nCustomer name: Acme Inc\nSubnet:        10.11.12.13/24\n\
  IPA            10.11.12.13\nCIDR mask:     24\nFW Object:     acme_inc_subnet_10.11.12.13-24\n\
  ```\n\n## 条件替换\n\n其中一些变量替换是条件性的，即只有在满足某些条件时才会发生。 你可以使用围绕赋值的 if 语句来实现同样的效果，但这些习惯用法对于某些常见情况可以使代码更简短。\
  \ 这些条件替换在这里以冒号后跟另一个特殊字符显示：减号、加号或等号。 它们检查的条件是：变量是否为空或未设置？ 空变量是其值为 null 字符串的变量。 未设置变量是指尚未分配或已明确使用\
  \ unset 命令取消设置（想想“丢弃”）的变量。 对于位置参数（如 $1、$2 等），如果用户未在该位置提供参数，则它们未设置。\n\n如果你在这些条件替换中不包含冒号，则它们只考虑未设置变量的情况；空值将原样返回。\n\
  \n## 默认值\n\n一个常见场景是脚本有一个可选的单个参数。 如果在调用脚本时未提供该参数，则应使用默认值。 在 bash 中，我们可能会这样写：\n\n\
  ```\nLEN=${1:-5}\n```\n\n这将设置变量 LEN 为第一个参数 ($1) 的值——如果提供了参数——否则为值 5。 这里有一个示例脚本：\n\
  \n```\nLEN=\"${1:-5}\"\ncut -d',' -f2-3 /tmp/megaraid.out | sort | uniq -c | sort\
  \ -rn | head -n \"$LEN\"\n```\n\n它从名为 /tmp/megaraid.out 的逗号分隔值文件中取出第二和第三个字段，对这些值进行排序，提供每个值对出现的次数计数，然后显示列表中的前\
  \ 5 个。 你只需将该计数指定为脚本的唯一参数，即可覆盖默认值 5 并显示前 3 个或 10 个（或你想要的任意数量）。\n\n## 逗号分隔列表\n\n另一个条件替换，使用加号，也会检查变量是否有值，如果有，则是否会返回不同的值。\
  \ 也就是说，只有当变量不为空时，才返回指定的不同值。 是的，这听起来很奇怪；如果它有值，为什么要返回不同的值？\n\n这种看似奇怪的逻辑的一个方便用途是构造逗号分隔列表。\
  \ 你通常通过对每个值重复追加 “，value” 或 “value，” 来构造这样的列表。 在这样做时，你通常需要一个 if 语句来避免在列表的前面或后面出现多余的逗号——但在使用此连接习惯用法时不需要：\n\
  \n```\nfor fn in * ; do\n    S=${LIST:+,}        # S for separator\n    LIST=\"\
  ${LIST}${S}${fn}\"\ndone\n```\n\n另见示例 7-1。\n\n## 修改后的值\n\n到目前为止，这些替换都没有修改变量的底层值。\
  \ 然而，有一个会修改。 如果我们写 ${VAR:=value}，它将与我们之前默认值的习惯用法非常相似，但有一个很大的例外。 如果 VAR 为空或未设置，它将把该值分配给变量（因此，等号），并返回该值。\
  \ （如果 VAR 已设置，它将简单地返回其现有值。）请注意，此赋值对于位置参数（如 $1）不起作用，这就是为什么你几乎看不到它被使用的原因。\n\n## $RANDOM\n\
  \nBash 有一个非常方便的 $RANDOM 变量。 正如 Bash 参考手册中“Bash Variables”部分所述：\n\n> 每次引用此参数时，都会生成一个介于\
  \ 0 和 32767 之间的随机整数。 给此变量赋值会为随机数生成器设置种子。\n\n虽然这不适合加密功能，但它对于掷骰子或在否则过于可预测的操作中添加一点噪声很有用。\
  \ 我们在第 69 页的“一个简单的词数示例”中稍后会使用它。\n\n如示例 4-3 所示，你可以从列表中挑选一个随机元素。\n\n示例 4-3. 挑选一个随机列表元素\n\
  \n```\ndeclare -a mylist\nmylist=(foo bar baz one two \"three four\")\n\nrange=${#mylist[@]}\n\
  random=$(($RANDOM % $range))  # 0 to list length count\necho \"range = $range, random\
  \ = $random, choice = ${mylist[$random]}\"\n\n# Shorter but less readable 6 months\
  \ from now:\n# echo \"choice = ${mylist[$(($RANDOM % ${#mylist[@]}))]}\"\n```\n\n\
  你也可能会看到类似这样的内容：\n\n```\nTEMP_DIR=\"$TMP/myscript.$RANDOM\"\n[ -d \"$TEMP_DIR\" ]\
  \ || mkdir \"$TEMP_DIR\"\n```\n\n\n\n\n\n然而，这会受到竞态条件的影响，而且显然是一个简单的模式。它在某种程度上是可预测的，但有时你想知道是什么代码在污染\
  \ $TMP。不要忘记设置一个陷阱（参见第 97 页的“It’s a Trap!”）来清理你自己的残留物。我们建议你考虑使用 mktemp，不过这是一个超出 bash\
  \ 惯用法范围的大问题。\n\n![](img/553ffa1bc15093729b691f706befc0ac_55_0.png)\n\n## $RANDOM\
  \ 和 dash\n\n$RANDOM 在 dash 中不可用，而 dash 在某些 Linux 发行版中是 /bin/sh。值得注意的是，当前版本的 Debian\
  \ 和 Ubuntu 使用 dash，因为它比 bash 更小更快，从而有助于更快启动。但这意味着 /bin/sh，这个曾经是 bash 的符号链接，现在改为指向\
  \ dash，各种 bash 特定功能将无法工作。它在 Zsh 中是可以工作的。\n\n## 命令替换\n\n我们在第 2 章中已经大量使用了命令替换，但我们还没有谈论过它。旧的\
  \ Bourne 方式是使用 ``（反引号/反引号），但我们更喜欢更易读的 POSIX $( )。你会看到这两种形式很多，因为这就是你将输出拉入变量的方式；例如：\n\
  \n```\nunique_lines_in_file=\"$(sort -u \"$my_file\" | wc -l)\"\n```\n\n请注意，这两者是相同的，但第二个是内部的并且更快：\n\
  \n```\nfor arg in $(cat /some/file)\nfor arg in $(</some/file)    # Faster than\
  \ shelling out to cat\n```\n\n![](img/553ffa1bc15093729b691f706befc0ac_55_1.png)\n\
  \n## 命令替换\n\n命令替换对于云和其他 DevOps 自动化至关重要，因为它允许你收集并使用仅在运行时才存在的各种 ID 和详细信息；例如：\n\n```\n\
  instance_id=$(aws ec2 run-instances --image $base_ami_id ... \\\n    --output text\
  \ --query 'Instances[*].InstanceId')\n```\n\n```\nstate=$(aws ec2 describe-instances\
  \ --instance-ids $instance_id \\\n    --output text --query 'Reservations[*].Instances[*].State.Name')\n\
  ```\n\n![](img/553ffa1bc15093729b691f706befc0ac_56_0.png)\n\n## 嵌套命令替换\n\n使用 ``\
  \ 嵌套命令替换会变得非常丑陋，很快，因为你必须在每一层嵌套中转义内部的反引号。如果可以的话，使用 $( ) 会容易得多，如下所示：\n\n```\n### Just\
  \ Works\n$ echo $(echo $(echo $(echo inside)))\ninside\n```\n\n```\n### Broken\n\
  $ echo `echo `echo `echo inside```\necho inside\n```\n\n```\n### \"Works\" but very\
  \ ugly\n$ echo `echo \\`echo \\\\\\`echo inside\\\\\\`\\`\ninside\n```\n\n感谢我们的审阅者\
  \ Ian Miell 指出这一点并提供示例。\n\n#### 风格和可读性：回顾\n\n在 bash 中引用变量时，你有机会在设置或检索值时编辑该值。变量引用末尾的几个特殊字符可以从字符串值的开头或结尾删除字符，改变其字符为大写或小写，替换字符，或仅给你原始值的子字符串。这些方便功能的常见使用导致了默认值的惯用法，basename\
  \ 和 dirname 的替代，以及在不使用显式 if 语句的情况下创建逗号分隔列表。\n\n变量替换是 bash 中的一个很棒的功能，我们建议充分利用它们。然而，我们也强烈建议你对这些语句进行注释，以明确你试图进行的替换类型。你的代码的下一个阅读者会感谢你的。\n"
- "## 表达式和算术\n\nBash 提供了许多不同的做同一件事的方法——以及一些几乎相同的语法来做非常不同的事情。通常，这只是几个特殊字符的区别。我们已经看到\
  \ ${VAR} 和 ${#VAR}，其中第一个表达式返回变量的值，但第二个返回其字符串长度（“Variable Reference”第 31 页）。或 ${VAR[@]}\
  \ 和 ${VAR[*]} 及其引号差异（“Quotes and Spaces”第 14 页）。\n\n其他 bash 惯用法可能会让你想知道：什么时候应该使用两组或仅一组方括号？甚至不用？$((\
  \ ... )) 和 (( ... )) 有什么区别，如果有的话？通常，符号在其各种用途中都有某种共同含义，这暗示了语法背后的一定程度的合理性。有时表达式的选择更多是出于历史原因。让我们看一下，看看我们是否可以解释一些这些惯用模式和算术表达式。\n\
  \n![](img/553ffa1bc15093729b691f706befc0ac_59_0.png)\n\n## 仅限整数\n\nbash shell 仅使用整数算术。它的主要目的是计数：迭代次数、文件数量、字节大小。如果你想要或需要浮点计算怎么办？毕竟，sleep\
  \ 命令现在允许分数值：sleep 0.25 将休眠四分之一秒。如果你想休眠四分之一秒的倍数怎么办？你可能想写 sleep $(( 6 * 0.25 ))，但这行不通。\n\
  \n最简单的解决方案是使用 bc 或 awk 等其他程序进行计算。例如，这里有一个名为 fp 的脚本，你可以将其放在你的 ~/bin 目录或 PATH 上的其他位置（并赋予其执行权限）：\n\
  \n```\n# /bin/bash -\n# fp - provide floating point, via awk\n# usage: fp \"expression\"\
  \n\nawk \"BEGIN { print $* }\"\n```\n\n有了它，你就可以写 sleep $(fp \"6 * 0.25\") 来获得所需的浮点计算。它可能不是\
  \ bash 在做计算，但它是 bash 帮助你完成计算。\n\n## 算术\n\n虽然 bash 在很大程度上是一种面向字符串的语言，但每当你在 bash 中看到双括号时，就意味着正在进行算术求值——使用整数而不是字符串的算术。这对你来说很熟悉，来自使用双括号的\
  \ for 循环变体：\n\n```\nfor ((i=0; i<size; i++))\n```\n\n请注意，我们在双括号内使用变量名时不需要使用 $。这在\
  \ bash 中使用双括号时始终如此。那么我们还在哪里找到双括号的使用？\n\n首先，我们可以使用美元符号和双括号对 shell 变量执行算术计算以创建值，如下所示：\n\
  \n```\nmax=$( ( intro + body + outro - 1 ) )\nmedian_loc=$( ( len / 2 ) )\n```\n\
  \n再次注意，变量在双括号内使用时不需要美元符号引用。\n\n其次，考虑双括号的这种用法：\n\n```\nif (( max - 3 > x * 4 )) ;\
  \ then\n    # Do something here\nfi\n```\n\n这次我们使用的是没有前导美元符号的双括号。为什么？有什么不同？\n\n\
  在第一种情况下，对于变量赋值，我们想要表达式的值，所以就像使用变量一样，美元符号表示我们想要值。在第二种情况下，if 语句，我们不使用美元符号，因为我们只需要做出决定的\
  \ true/false 布尔值。如果双括号内（没有美元符号）的表达式是非零值，则括号表达式的返回状态为 0——在 bash 中被认为是“真”。否则，返回状态为\
  \ 1（在 bash 中为“假”）。\n\n请注意我们说“返回状态？”那是因为没有美元符号的双括号在语法上被使用，就好像你正在执行一个或多个命令一样。它不会返回一个值供你分配给变量。然而，你可以在某些情况下使用它为变量分配新值，因为\
  \ bash 支持一些 C 语言风格的赋值运算符。以下是一些示例。这些是完整的 bash 语句，每行一个：\n\n```\n(( step++ ))\n(( median_loc\
  \ = len / 2 ))\n(( dist *= 4 ))\n```\n\n每个语句都在执行算术求值，但在每种情况下，赋值也在求值的一部分中发生。表达式不会返回任何值，只有返回状态——你可以在每个语句执行后在\
  \ $? 变量中检查它。\n\n你能用美元符号-双括号语法写出前一个示例中的那三个计算吗？看起来更熟悉的写法是：\n\n```\nstep=$(( step +\
  \ 1 ))\nmedian_loc=$(( len / 2 ))\ndist=$(( dist * 4 ))\n```\n\n我们不想单独写一行 $((step++))，因为该表达式将返回一个数值——shell\
  \ 然后会将其视为要执行的命令的名称。如果 step++ 计算为 3，shell 随后会查找名为 3 的命令。\n\n\n\n\n\n![](img/553ffa1bc15093729b691f706befc0ac_61_0.png)\n\
  \n## 关于空格的提醒\n\n在 bash 变量赋值中，等号两边不允许有空格。对于变量赋值而言，从语法上讲，它必须全部是一个“单词”。不过，在括号内部，空格是可以的，因为括号定义了该“单词”的边界。\n\
  \n现在还有一个算术变体——可能是出于历史原因。你可以使用 shell 内置的 let 来像双括号那样工作，但不需要美元符号。比较下面这些等价的语句：\n\n\
  ```\n(( step++ ))  # Is the same as:\nlet \"step++\"\n\n(( median_loc = len / 2\
  \ ))  # Is the same as:\nlet \"median_loc = len / 2\"\n\n(( dist *= 4 ))  # Is the\
  \ same as:\nlet \"dist*=4\"\n```\n\n但要小心——如果你没有对 let 表达式使用引号（单引号或双引号），那么最好表达式中完全不要有空格。（我们示例中的第一个\
  \ let 不需要引号，但养成始终使用引号的好习惯。）空格会将你的命令分割成多个单词，而 let 只接受一个单词，所以如果有多于一个单词就会得到语法错误。\n\n\
  ## 不需要括号\n\n我们说过 bash 是一个面向字符串的语言，但有一种例外方式。你可以这样声明一个变量为整数：declare -i MYVAR，声明后，你就可以在不使用双括号且变量名前不加\
  \ $ 的情况下，对其进行算术赋值。这里有一个例子，脚本 seesaw.sh：\n\n```\ndeclare -i SEE\nX=9\nY=3\nSEE=X+Y\
  \        # Only this one will be arithmetic\nSAW=X+Y        # This is just a literal\
  \ string\nSUM=$X+$Y      # This is string concatenation\necho \"SEE = $SEE\"\necho\
  \ \"SAW = $SAW\"\necho \"SUM = $SUM\"\n```\n\n运行这些语句得到的结果显示了 bash 大多是面向字符串的。SAW\
  \ 和 SUM 的值是通过字符串操作形成的。只有 SEE 是通过算术运算赋值的：\n\n```\n$ bash seesaw.sh\nSEE = 12\nSAW\
  \ = X+Y\nSUM = 9+3\n$\n```\n\n这表明你可以在不需要双括号的情况下进行算术运算——但我们通常会避免这种做法，因为它要求你声明要赋值的变量为整数。如果你忘记了\
  \ declare 语句，或者将此类表达式赋给未声明的变量，不会得到任何错误信息——只会得到不想要的结果。\n\n## 复合命令\n\n你可能非常熟悉在脚本中看到一行单独的命令。你可能也熟悉在\
  \ if 语句的条件中使用单个命令来判断命令是否成功，并根据结果采取行动。如果你读过第 1 章，你也见过“无 if”的 if 语句惯用法。现在让我们来看一下简单的单命令\
  \ if 语句，它看起来像这样：\n\n```\nif cd $DIR ; then # Do something ...\n```\n\n那这些呢：\n\n\
  ```\nif [ $DIR ]; then # Do something ...\nif [[ $DIR ]]; then # Do something ...\n\
  ```\n\n为什么这两行里有方括号，而第一个例子中没有？它们之间有区别吗？单括号和双括号有什么区别，应该在什么时候使用？\n\n没有方括号时，发生的是命令的执行（我们示例中的\
  \ cd）。该命令的成功或失败会被返回，实际上作为 if 用于其决策分支的 true 或 false。如果有 else 分支的话。 在 bash 中，你可以在\
  \ if 语句中放置整个命令管道（例如 cmd | sort | wc）。是管道中最后一个命令的返回状态决定了 if 语句是真还是假。（这可能会掩盖很难找到的错误；请参阅第\
  \ 96 页的“非官方 bash 严格模式”中的 set -o pipefail。）\n\n单括号语法实际上也在运行一个命令，即 shell 内置的 test\
  \ 命令。左单括号是 shell 内置的 test 命令，但有一个区别：需要一个最终参数 ]。双括号语法在技术上是一个 bash 关键字，表示一个复合命令，其行为与单括号和\
  \ test 命令非常相似，但并不完全相同。\n\n我们使用单括号或双括号语法来进行逻辑和比较，即条件表达式。我们用它们来检查事物的状态，比如文件是否存在或具有某些权限，或\
  \ shell 变量是否有值。有关可以进行的完整测试和检查列表，请参阅 bash 手册页中的“Conditional Expressions”，以及 help\
  \ test 以快速回顾。\n\n我们之前的示例是在检查 DIR 变量是否具有非空值。另一种写法是：\n\n```\nif [[ -n \"$DIR\" ]];\
  \ then ...\n```\n\n以查看值是否非空，即长度不为零。相反，要查看变量的值长度是否为零，即未设置或为空，使用：\n\n```\nif [[ -z\
  \ \"$DIR\" ]]; then ...\n```\n\n那么单括号和双括号测试之间有什么区别呢？只有几处，但可能很显著。\n\n也许最大的区别是双括号语法支持额外的比较运算符\
  \ =~，它允许使用正则表达式：\n\n```\nif [[ \"$FILE_NAME\" =~ .*xyzZ*.*jpg ]]; then ...\n```\n\
  \n![](img/553ffa1bc15093729b691f706befc0ac_63_0.png)\n\n### 正则表达式\n\n这是 bash 中唯一能找到正则表达式的地方！记住：不要对正则表达式加引号，否则你将逐字匹配那些字符，而不是作为正则表达式。\n\
  \n单括号和双括号之间的另一个区别更偏向风格，但会影响可移植性。这两种形式做的是同一件事：\n\n```\nif [[ $VAR == \"literal\"\
  \ ]]; then ...\n```\n\n```\nif [ $VAR = \"literal\" ]; then ...\n```\n\n对于 C 和 Java\
  \ 程序员来说，使用单等号进行比较可能显得不自然，但在 bash 条件表达式中，= 和 == 含义相同。单等号在单括号语法中是首选，以符合 POSIX 规范（bash\
  \ 手册页如此说明）。\n\n![](img/553ffa1bc15093729b691f706befc0ac_64_0.png)\n\n### 一种微妙的差异\n\
  \n在双方括号内，< 和 > 运算符使用“当前区域设置进行词法比较”，而 test（和 [ ）使用简单的 ASCII 排序进行比较。\n\n你在使用单括号时也可能需要转义这些运算符（例如这样：if\
  \ [ $x \\> $y ]），否则它们会被当作重定向。为什么？因为单括号与 test 命令一样是内置命令而不是关键字，所以 bash 将其视为运行命令——而运行命令时可以重定向\
  \ I/O。然而，当 bash 看到双括号这个关键字时，它知道会期望此类运算符，不会将其视为重定向。因此，在这两种语法形式中，我们更偏爱双括号语法。\n\n单括号和双括号表达式都可以使用一种更旧、更像\
  \ Fortran 的语法来进行数值比较。例如，它们使用 -le 表示小于或等于比较。这里又出现了另一个区别。单括号表达式中该运算符两侧的参数必须是简单的整数。使用双括号时，每个操作数可以是一个更大的算术表达式，尽管如果不加引号则不能有空格。例如：\n\
  \n```\nif [[ $OTHERVAL*10 -le $VAL/5 ]] ; then ...\n```\n\n如果你要进行算术表达式和比较，更好的选择是使用双括号语法。这会给你更熟悉的\
  \ C/Java/Python 风格的比较运算符，并且对空格有更大的自由度：\n\n```\nif (( OTHERVAL * 10 <= VAL / 5 ))\
  \ ; then ...\n```\n\n#### 风格和可读性：回顾\n\n面对如此多的变体，我们应该选择哪种 if 语句风格？我们选择最适合所考虑计算的风格。\n\
  \n当它是数学表达式时，我们使用双括号。作为一条规则，在 bash 中，双括号表示正在进行算术运算。美元符号表示你想要返回表达式的值，否则你只会得到成功/失败的结果状态。但运算符丰富的\
  \ bash 使得使用双括号语法或 let 内置命令都能实现类似的功能。由于在双括号内部不需要在变量前加 $ 来获取其值，我们会尽量一致地省略它们。\n\n对于算术表达式，有些人可能更喜欢在表达式周围使用双括号，与\
  \ if 语句保持一致。然而，对于其他人来说，简单的 let 内置命令读起来更清晰简洁。你可以冒险跳过双括号，通过声明变量为整数来实现，但我们不能推荐\n\n\n\
  \nthat. It is too easy to mix and match variables, some of which may not have been\
  \ declared as integers. Confusion ensues. Putting the expression in double parentheses\
  \ (or using let) guarantees that it will remain an arithmetic evaluation.\n\nFor\
  \ text-heavy comparisons, we use the double brackets, especially because that lets\
  \ us use regular expressions.\n\nFor conditionals, the newer syntax of [[ is much\
  \ preferred over [. However, if your conditional is arithmetic comparisons, an even\
  \ better choice is the (( syntax.\n"
- "## Functional Framework\n\nThe two preceding chapters have described the bash idioms\
  \ in using variables and then combining those variables into expressions. The next\
  \ level up is grouping those expressions and statements into functions that can\
  \ be called from various locations within a bash shell script. Even though bash\
  \ does support the useful construct of functions, it does so in a very bashy way.\
  \ Let’s see how it differs from what you know from other languages.\n\n## Calling\
  \ Functions\n\nHere are three statements that are examples of calling bash functions\
  \ (which we are making up for this example):\n\n```\nDo_Something\nFind_File 25\
  \ $MPATH $ECODE\nShow_All $*\n```\n\nThose don’t look like function calls, you might\
  \ be thinking. They look just like any command line invocation of a command.\n\n\
  Exactly.\n\nIn other languages, you might say something like Find_File(25, MPATH,\
  \ ECODE), but that is not bash. In bash, a function is called much like any command;\
  \ you invoke it like you would invoke a command or a shell script. As with a bash\
  \ keyword or builtin, the shell doesn’t need to create a separate process to run\
  \ the function. That makes a function more efficient than calling a separate command\
  \ binary or shell script.\n\nYou might also notice that these function calls are\
  \ not returning a value that can be assigned to another variable. More on that in\
  \ the following sections. First, let’s look at how we define functions and their\
  \ parameters.\n\n## Defining Functions\n\nThe syntax for bash includes some optional\
  \ elements. Let’s say, for example, that you want to define a function called helper.\
  \ Here are three different ways to begin that definition:\n\n```\nfunction Helper\
  \ ()\nfunction Helper\nHelper ()\n```\n\nAll three are equivalent. The reserved\
  \ word function is optional, but if you do use it, then the parentheses are optional.\
  \ We prefer to use the simple two-word version: function and then the name of our\
  \ function. Not only does it clearly state what we’re doing, but it reminds us that,\
  \ unlike other languages, our functions parameters are not put in parentheses. And\
  \ it’s quite easy to grep for.\n\nThe body of the function follows this defining\
  \ of the function’s name, usually enclosed in braces:\n\n```\nfunction Say_So {\n\
  \    echo 'Here we are in the function named Say_So'\n}\n```\n\n## Function Parameters\n\
  \nHow are parameters defined for a bash function? They are not. Instead, when you\
  \ call a bash function (described in the following paragraphs), you can supply as\
  \ many parameters as you want. Typically you have a certain fixed set of parameters\
  \ in mind and will write your function accordingly, but there’s nothing special\
  \ that you would need to do to have a variable number of arguments.\n\nThe arguments,\
  \ however many are provided, are available to the function as $1, $2, $3, and so\
  \ forth, using the same syntax used for parameters to the bash script itself. Since\
  \ these parameters don’t have names but only their order number, it is a very good\
  \ idea to put a comment at the head of the function to document what parameters\
  \ the function expects and in what order. It is also quite common to see, in the\
  \ first few lines of a script, that these positional parameters are assigned to\
  \ variables with more descriptive names.\n\nSince the function’s parameters are\
  \ using the $1, etc., names, you may be wondering what happens to the shell script’s\
  \ parameters that are referenced using that same syntax. Calling the function doesn’t\
  \ change the script’s parameters; the script’s parameters simply are not visible\
  \ inside the function (unless, of course, you send them in as parameters to the\
  \ function).\n\nThere is one exception, however. The $0 parameter, the one that\
  \ holds the name of the script, is still there and still holds the name of the script,\
  \ however it was invoked. You can still find the name of the function, though. There\
  \ is an array variable named FUNCNAME that holds the call stack of the functions\
  \ that have been invoked. Element 0 is always the current function, so just use\
  \ $FUNCNAME (since using the array name without an index always returns the first\
  \ element, i.e., the one at index zero). That’s useful in a debugging prompt; see\
  \ Example 10-3.\n\nThe following function will echo out the two parameters passed\
  \ in to the function:\n\n```\nfunction See2it {\n  echo \"First arg: $1\"\n  echo\
  \ \"Second arg: $2\"\n}\n```\n\nIf insufficient arguments are supplied in calling\
  \ the function, the corresponding parameters are null.\n\nThis is a simple example\
  \ of echoing the parameters with which the function is called:\n\n```\nfunction\
  \ Tell_All {\n  echo \"You called $FUNCNAME\"\n  echo \"The $# args supplied are:\"\
  \n  for arg in \"$@\"; do\n    echo \"$arg\"\n  done\n}\n\nTell_All 47 tree /tmp\n\
  ```\n\nWhen that script is run, here is what the output looks like:\n\n```\nYou\
  \ called Tell_All\nThe 3 args supplied are:\n47\ntree\n/tmp\n```\n\n## Function\
  \ Return Values\n\nHere, too, bash functions are more like scripts than they are\
  \ like your typical computer language functions. The return value from bash functions\
  \ is really just an exit status, the value that you can check using $? after calling\
  \ the function. Just as you might check $? after calling another script or an executable,\
  \ so, too, does a bash function indicate the success or failure of the function.\
  \ It actually returns the exit status of the last command executed in the function.\n\
  \nSo how is the script writer supposed to get any useful results back from a bash\
  \ function? There are two typical approaches. One way is to treat the function just\
  \ like you would any shell script—have its output be the return values. You might\
  \ pipe that output into the next part of your script that needs the results from\
  \ the function, or you might capture that output using $() notation. The $() will\
  \ run the function in a subshell and you can assign the result (the function’s output)\
  \ to a variable, and then use that variable on another command line.\n\nAnother\
  \ way to return results from a function in a shell script is to use something not\
  \ available to an external script—global variables.\n\n## Local Variables\n\nConsider\
  \ a function that has some looping inside it, done by using a for loop, and that\
  \ for loop uses an index variable i to count the iterations. Now consider what would\
  \ happen if the function itself were called from within the body of a for loop,\
  \ a loop that also happened to be controlled using i as an index variable. Since\
  \ bash variables are global, then the (inner) function will affect the outer loop\
  \ index. Not good. What to do?\n\nBash provides a syntax to let you declare variables\
  \ as “local” so that they are not seen outside the function. Variables like i in\
  \ a for loop should be declared as local variables:\n\n```\nfunction Summer {\n\
  \    local i\n    SUM=0\n    for((i=0; i<$1; i++)) {\n        let SUM+=i;\n    }\n\
  }\n```\n\nProblem solved. It might be even better to use local -i i or declare -i\
  \ i to declare i as an integer value, avoiding conversions to/from string. The declare\
  \ inside a function acts just like the local in hiding any global variable by that\
  \ name. The use of the -i option (in either case) allows you to specify the integer\
  \ aspect of the variable.\n\nThe variable SUM in this example is not declared local\
  \ because that is how the result of the function call is being returned to the caller.\
  \ Should all variables in a function be declared local unless they are needed outside\
  \ the script? Quite possibly, but since there is no way to enforce it, few programmers\
  \ are that thorough. If you are writing functions that you expect to be shared and\
  \ portable, then it is well worth the effort and will avoid unexpected side effects.\n\
  \n\n\n\n\n![](img/553ffa1bc15093729b691f706befc0ac_70_0.png)\n\n## 动态作用域\n\n如果你在一个函数中声明一个局部变量，然后该函数调用另一个函数，第二个函数会看到第一个函数的局部变量，而不会看到同名全局变量。如果你从脚本的主体部分调用第二个函数，它会看到并使用全局变量。欢迎来到动态作用域的危险之处，这也是保持脚本简洁且文档完善的另一个原因。\n\
  \n## 函数特殊情况\n\n请记住，函数定义必须在其被调用之前出现。\n\n如果你在函数定义中使用括号（与我们推荐的风格不同），那么你可以用任何复合语句语法选项来包含函数体。你可以使用双括号进行算术求值，或使用双方括号如果你的函数只是想做条件表达式求值。但这些用法极不可能出现。\n\
  \n你可以在函数定义上放置一个 I/O 重定向。它在调用该函数时生效。以下是该功能的一个常见用法，可轻松将整个使用信息重定向到 STDERR（通过 1>&2）：\n\
  \n```\nfunction Usage_Message {\n    echo \"usage: $0 value pathname\"\n    echo\
  \ \"where value must be positive\"\n    echo \"and pathname must be an existing\
  \ file\"\n    echo \"for example: $0 25 /tmp/scratch.csv\"\n} 1>&2\n```\n\n当脚本检查发现未提供正确数量的参数或提供的文件名不存在时，可能会调用此函数（我们将在第\
  \ 79 页的“HELP!”中更详细地讨论这个问题）。需要注意的重要一点是，输出被重定向到 STDERR，但重定向不必放在脚本的每一行上——只需一次，放在包围的大括号之外即可。这可以为你节省大量输入，并且在修改脚本时无需记住为任何行添加额外的重定向。\n\
  \n请注意，为了清晰起见并逐步引入，我们分解了一些关于函数的风格建议；有关详细信息，请参阅第 128 页的“Functions”。\n\n## 是时候使用 printf\
  \ 了\n\n如果你从 C 和 Java 等语言中了解 printf，那么你就有了先发优势。我们认为在这一章关于函数的章节中介绍它是有意义的，因为虽然它在 bash\
  \ 中不是函数而是内置命令，但感觉足够熟悉，可以像对待函数一样对待它。\n\n*Print formatted*，或 `printf`，在 bash 中被低估了，因为大多数人只是使用\
  \ echo，但 bash 内置版本有一些惯用的扩展，你需要能够阅读和编写。它也在 POSIX 中定义，与 bash 内置版本的 echo 不同，因此如果你的脚本在非\
  \ Linux 系统上运行，它的可移植性更强。\n\n我们只会讨论 bash 内置版本，但你可能有一个与 bash 无关的外部二进制文件，并且选项不会相同：\n\
  \n```\n$ type -a printf\nprintf is a shell builtin\nprintf is /usr/bin/printf\n\
  ```\n\n除非你使用完整路径（/usr/bin/printf）或在前面加上 env，否则会使用 bash `printf`。比较 `printf --help`\
  \ 和 `env printf --help` 以查看差异。\n\n我们也不会列出标准 `printf` 格式的长列表；这些在许多其他地方都有介绍，包括 *bash\
  \ Cookbook* 的附录 A。\n\n有关你的 printf 版本的更多详细信息，请参阅：\n\n- `help printf` 或 `printf --help`\n\
  - `man 1 printf`\n- 可能 `/usr/bin/printf --help` 或 `env printf --help`\n\n## POSIX\
  \ 输出\n\n如果你的脚本将在 Linux 以外的操作系统上运行，你应考虑使用 `printf` 而不是 echo 以保持一致性。它很简单，但比使用 echo\
  \ 需要更多的输入，而且与 echo 不同，不会自动包含尾随换行符：\n\n```\nprintf '%s\\n'   # 简单字符串，换行符不会自动包含\n\
  printf '%b\\n'   # 还会展开转义字符\n```\n\n你可以在 `printf` 格式周围使用单引号或双引号，这些引号将遵循通常的变量插值规则（单引号不会插值；双引号会），但像\
  \ \\n 这样的转义在两种类型的引号内都有效。如我们在其他地方所讨论的，我们更喜欢单引号来显示程序员的意图并防止插值，除非你需要在格式中插值变量，这可能表明你做错了什么。\n\
  \n有关此主题的更多信息，请参阅：\n\n- https://unix.stackexchange.com/a/65819\n- https://www.in-ulm.de/~mascheck/various/echo+printf\n\
  \n## 获取或使用日期和时间\n\nBash 4.2 添加了 printf %(datefmt)T，但默认输出是 Unix 纪元（1970-01-01 00:00:00\
  \ -0000），这可能不是你想要的。默认在 bash 4.3 中改为“now”，这更有意义。有两个特殊参数，-1，表示“现在”，和“-2”，表示“shell\
  \ 被调用的时间”。你可以提供一个可选的纪元秒时间整数来显示其他时间，这对于将纪元秒转换为人类可读时间非常方便。我们建议如果你指的是“现在”，请使用 -1 以保持一致性和意图清晰：\n\
  \n```\n### 使用 -v 设置 $today 变量\n$ printf -v today '%(%F)T' '-1'\n$ echo $today\n\
  2021-08-13\n```\n\n```\n### 简单日志记录（两者相同）\n$ printf '%(%Y-%m-%d %H:%M:%S %z)T: %s\\\
  n' '-1' 'Your log message here'\n$ printf '%(%F %T %z)T: %s\\n' '-1' 'Your log message\
  \ here'\n2021-08-13 12:48:33 -0400: Your log message here\n```\n\n```\n### 1628873101\
  \ 是什么时候？\n$ printf '%(%F %T)T = %s\\n' '1628873101' 'Epoch 1628873101 to human readable'\n\
  2021-08-13 12:45:01 = Epoch 1628873101 to human readable\n```\n\n![](img/553ffa1bc15093729b691f706befc0ac_72_0.png)\n\
  \n## 将 printf 输出到变量\n\n如果你查看了 help printf，你可能会注意到 -v var 选项，它将输出分配给变量而不是显示它，类似于\
  \ C 中的 sprintf。我们接下来会看到它的用途。\n\n有关此主题的更多详细信息，请参阅第 111 页的“Using logger from bash”。\n\
  \n我们更喜欢 bash 内置的 printf，但有一件事 GNU¹ 版本的 date 仍然比 printf %(datefmt)T 做得更好，那就是显示其他时间的日子，比如\
  \ date -d '2 months ago' '+%B'，它告诉我们两个月前的月份名称，例如：\n\n```\n$ date -d '2 months ago'\
  \ '+%B'\nAugust\n```\n\n![](img/553ffa1bc15093729b691f706befc0ac_72_1.png)\n\n##\
  \ Mac 上的默认 bash 太旧了\n\n请注意，printf %(datefmt)T 至少需要 bash 4.2，推荐 4.3+，因此这在 Mac 上较旧但非常有用的默认\
  \ bash 3.2 上不起作用！请参阅第 ix 页的“bash on Mac”。\n\n1 GNU 是一个递归缩写，代表“GNU’s Not Unix。”\n\
  \n## printf 用于复用或调试\n\nBash help 说“%q 以可重新用作 shell 输入的方式引用参数”，我们将在第 7 章中使用它来显示“shell\
  \ 引用的”字符串，但这里有一个简单示例：\n\n```\n$ printf '%q' \"This example is from $today\\n\"\n\
  This\\ example\\ is\\ from\\ 2021-08-13\\\\n\n```\n\n这对于在其他地方复用输出、创建格式化输出（另请参阅第\
  \ 38 页的“Comma-Separated Lists”）以及在需要能够看到隐藏或控制字符或字段的调试中很有用。另请参阅第 120 页的“bash Debugging”。\n\
  \n#### 风格和可读性：回顾\n\nbash 中的函数非常类似于内部 shell 脚本。它们的调用方式非常类似于运行任何命令，它们的参数引用方式也与任何 shell\
  \ 脚本的参数相同（$1、$2 等）。你需要在脚本前面放置函数，以便在对函数进行任何调用之前看到其定义。如同任何语言一样，函数应保持简短且主要为单一目的。对函数使用单个\
  \ I/O 重定向可以帮助你避免重复的重定向。也许函数最大的危险是变量引用。函数可以通过变量或通过写入 STDOUT 并让调用者将函数的输出管道传输到下一个命令来返回值。你可能需要引用（全局）变量来从函数返回值，但有一些变量你希望避免更改。使用\
  \ local 可以帮助解决这个问题，但要警惕动态类型——那些局部变量在你调用另一个函数时不会保持局部。务必在函数的开头注释中记录此类内容。\n\nprintf\
  \ 内置命令的行为与其它语言中熟悉的函数非常相似。除了标准格式外，bash 的 printf 还有一些有用的惯用扩展。我们特别欣赏不必创建子 shell 来运行\
  \ date 命令只是为了知道现在几点钟，尤其是在你频繁调用它进行日志记录时。\n\n\n\n\n"
- "## 列表和哈希处理\n\n我们所知道的，计算机非常擅长计数和组织数据。我们可以使用代码来计数和组织数据，使用 *数据结构*，而这些的构建块是 *数组*。Bash\
  \ 从一开始就有了数组，并在 4.0 版本中加入了 *关联数组*。你在 Bash 数组中会遇到难以阅读的代码，部分原因是 Bash 有很多历史和向后兼容性需要维护，正如我们之前提到的，但也因为一些开发者倾向于过度复杂化。数组实际上并不难实现，只要稍加思考，你就可以清晰地书写它们。\n\
  \n作为复习，在计算机科学和编程中，数组是包含多个元素并由整数索引或引用的变量。或者说，数组是一个包含列表而不是标量或单个值的变量。关联数组是一种由字符串而不是整数索引的列表类型。所以它是一个键值对列表，基本上形成了一个字典或查找表，其中内部将键哈希以形成内存位置。大致如此。\n\
  \nBash 文档使用 *数组* 和 *关联数组* 术语，但根据你的背景，*列表* 和 *哈希*，或者可能是 *字典* 或 *dict*，可能更熟悉，而且它们肯定更容易输入和说。Bash\
  \ 文档还使用 *下标*，而其他人可能会说 *索引*。我们通常为了保持一致而遵循 Bash 文档，但对于这些，我们将使用更常见、更易于理解的 *列表*、*哈希*\
  \ 和 *下标* 术语。\n\n即使列表（数组）出现得更早，哈希（关联数组）稍微简单一些，因为永远不会有关于提供索引（下标）的疑问，因为它是必需的。列表的整数索引可能是隐含的，虽然它并不复杂，但有一些操作适用于它们，而对哈希来说毫无意义。\n\
  \n正如 Bash 参考手册所说，“Bash 提供一维索引和关联数组变量。” 虽然可以创建非常丑陋的多维结构，但在 Bash 中这样做很可能会以眼泪告终。如果你真的需要这样做，请考虑在另一种语言中实现。\n\
  \n![](img/553ffa1bc15093729b691f706befc0ac_75_0.png)\n\n## 使用哈希时注意 Bash 版本\n\n你在这里真的需要小心你的\
  \ Bash 版本。正如我们刚才所说，Bash 直到 4.0 版本才获得哈希（即关联数组），并且花了几个版本才理清一些细节，比如允许 $list[-1] 引用最后一个整数元素（v4.3），而不是需要\
  \ $mylist[${#mylist[*]}-1]（其中 ${#mylist[*]} 是元素计数）。太糟糕了。\n\n正如我们在第 ix 页“Mac 上的 bash”中所说，要注意\
  \ Mac 上的库存 bash；它相当老旧。你可以在 MacPorts、Homebrew 或 Fink 中找到更新的版本。\n\n![](img/553ffa1bc15093729b691f706befc0ac_75_1.png)\n\
  \n## 非 POSIX\n\n此外，数组（列表和哈希）未被 POSIX 指定，因此如果可移植性超出 Bash 的范围是一个问题，你在使用它们时需要非常小心，因为它们可能无法工作。例如，Zsh\
  \ 的语法有点不同，所以这些示例在 Mac 上在该 shell 上也无法工作。\n\n## 共同点\n\n在 Bash 中，列表和哈希非常相似，所以我们将从它们共同的部分开始，然后再谈到它们不同的地方。事实上，你可以将列表视为哈希的一个子集，只是恰好具有有序整数索引。我们不认为你应该这样做，但你可以。\n\
  \n列表本质上是有序的，而哈希本质上是无序的，因此像 shift 或 push 这样的操作只对有序列表有意义。另一方面，你永远不需要对有序列表的键进行排序，但对哈希可能需要。\n\
  \n![](img/553ffa1bc15093729b691f706befc0ac_75_2.png)\n\n## 意外赋值\n\n没有下标的意外赋值会影响零号元素，因此\
  \ myarray=foo 会导致创建或覆盖 $myarray[0] 为 foo，即使它是一个哈希！\n\n来自 Bash 文档：\n\nIf the subscript\
  \ is @ or *, the word expands to all members of the array name. These subscripts\
  \ differ only when the word appears within double quotes. If the word is double-quoted,\
  \ \"${name[*]}\" expands to a single word with the value of each array member separated\
  \ by the first character of the IFS variable (see “Fiddling with $IFS for Fun and\
  \ Profit, to Read Files” on page 89), whereas \"${name[@]}\" expands each element\
  \ of name to a separate word.\n\n这不是一句话吗？我们已经在第 14 页的“引号和空格”中谈到过这个问题，但它很重要，因为，正如我们将展示的，如果你做错了，你可能会伤害自己。我们已在示例\
  \ 7-1 中使用 printf \"%q\" 和管道（|）分隔符来显示“shell 引用”的字符串（技术上是“单词”），以便在屏幕输出或本页上可见。引用规则实际上与我们在第\
  \ 2 章中介绍的相同，只是放在列表或哈希的上下文中。\n\n## 列表\n\n正如我们所说，数组，也称为列表，是包含多个元素并由整数索引或引用的变量。\n\n\
  在 Bash 中，它们从零开始，可以使用 declare -a、local -a、readonly -a 声明，或通过直接分配给新变量如 mylist[0]=foo\
  \ 或 mylist=()（空列表）来声明。一旦变量被声明为列表，像 mylist+=(bar) 这样的简单赋值就等同于 push，它将项目添加到列表末尾，但请注意\
  \ + 和 ()，两者都很关键。表 7-1 给出了一个示例。\n\n表 7-1. 示例 bash 列表\n\n| 元素 | 值 |\n|---|---|\n|\
  \ mylist[0] | foo |\n| mylist[1] | bar |\n| mylist[2] | baz |\n\n数组或列表的常见操作是：\n\n\
  - 声明变量为列表\n- 为其分配一个或多个值\n- 如果将其视为栈（想想自助餐厅的盘子；FIFO：先进先出，或先入先出）：\n  - push\n  - pop\n\
  - 显示（转储）所有值以供调试或重用\n- 引用一个或所有值（for，或 for each）\n- 引用值的一个子集（切片）\n- 删除一个或多个值\n- 删除整个列表\n\
  \n与其谈论所有这些，我们将向你展示，你可以根据需要挑选所需的习惯用法（示例 7-1）。\n\n## 示例 7-1. bash 列表示例：代码\n\n```\n\
  #!/usr/bin/env bash\n# lists.sh: bash list example code\n##### Original Author &\
  \ date: _bash Idioms_ 2022\n# bash Idioms filename: examples/ch07/lists.sh\n# ______________________________________________________________________________\n\
  # Does not work on Zsh 5.4.2!\n\n# Books are not as wide as some screens!\nFORMAT='fmt\
  \ --width 70 --split-only'\n\n# Declare a list\n# declare -a mylist   # Can do this,\
  \ or `local -a` or `readonly -a` or:\nmylist[0]='foo'      # This both declares\
  \ and assigns to mylist[0]\n\n# OR Both declares & assigns:\n#mylist=(foo bar baz\
  \ three four \"five by five\" six)\n\n# Push or assign, note the += and ()\n###mylist=(bar)\
  \          # Would overwrite mylist[0]\nmylist+=(bar)          # mylist[1]\nmylist+=(baz)\
  \          # mylist[2]\nmylist+=(three four)   # mylist[3] AND mylist[4]\nmylist+=(\"\
  five by five\")  # mylist[5] Note spaces and quotes\nmylist+=(\"six\")       # mylist[6]\n\
  \n# OR APPEND, note the \"+\" and we're assuming foo was already assigned\n#mylist+=(bar\
  \ baz three four \"five by five\" six)\n\n# Display or dump the values\necho -e\
  \ \"\\nThe element count is: ${#mylist[@]}\"\necho -e \"\\nThe length of element\
  \ [4] is: ${#mylist[4]}\"\n\necho -e \"\\nDump or list:\"\ndeclare -p mylist | $FORMAT\n\
  echo -n \"  ${mylist[@]}  = \"; printf \"%q|\"  ${mylist[@]}\necho -en \"\\n${mylist[*]}\
  \  = \"; printf \"%q|\"  ${mylist[*]}\necho -en \"\\n\\n${mylist[@]}\\\" = \"; printf\
  \ \"%q|\" \"${mylist[@]}\"\necho -en \"\\n\\\"${mylist[*]}\\\" = \"; printf \"%q|\"\
  \ \"${mylist[*]}\"\n```\n\n```\necho -e \"  # Broken!\"  # Previous line is bad\
  \ and no newline\n# See `help printf` or chapter 6 \"printf for reuse or debugging\"\
  , we need\n# this to show the correct words:\n# %q quote the argument in a way that\
  \ can be reused as shell input\n\n# \"Join\" the values\nfunction Join { local IFS=\"\
  $1\"; shift; echo \"$*\"; } # One character delimiter!\n# Note that the Join above\
  \ requires \"$*\" and not \"${0}\"!\necho -en \"\\nJoin ',' ${mylist[@]} = \"; Join\
  \ ',' \"${mylist[@]}\"\nfunction String_Join {\n    local delimiter=\"$1\"\n   \
  \ local first_element=\"$2\"\n    shift 2\n    printf '%s ' \"$first_element\" \"\
  ${@/#/$delimiter}\"\n    # Print first element, then reuse the '%s' format to display\
  \ the rest of\n    # the elements (from the function args $@), but add a prefix\
  \ of $delimiter\n    # by \"replacing\" the leading empty pattern (/#) with $delimiter.\n\
  }\necho -n \"String_Join '<>' ${mylist[@]} = \" ; String_Join '<>' \"${mylist[@]}\"\
  \n\n# Iterate over the values\necho -e \"\\nforeach \\\"\\${!mylist[@]}\\\":\"\n\
  for element in \"${!mylist[@]}\"; do\n    echo -e \"\\tElement: $element; value:\

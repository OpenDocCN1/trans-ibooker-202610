  你可以看到三大云服务提供商的产品非常相似，期限长度和大小灵活性也相似。折扣产品之间的差异主要由其应用预留的具体方法和对折扣云资源的计费方式驱动。


  ## 亚马逊网络服务


  AWS 于 2009 年率先提供 RI。因此，他们拥有迄今为止最复杂的预留计划。然而，这也意味着 AWS 是最灵活和可配置的。预留适用于 EC2 实例、RDS
  数据库、Redshift 节点、ElastiCache 节点、OpenSearch 节点以及 DynamoDB 预留容量。


  DynamoDB 预留容量与其他预留不同。对于 DynamoDB，你预留对该服务的一定数量的读取和写入。剩余的预留类型各有略微不同的功能，但共同点是它们都以一年或三年为期限购买。你可以为预留支付零预付款、部分预付款或全额预付款，每增加一次预付款，就能获得几个百分点的额外折扣。在购买
  RI 时，你以 AWS 所称的租约形式购买一个或多个具有相同参数的预留。


  ![](img/4d4736bc293fd892d1da81802d0f9520_289_0.png)


  你可以将使用部分预付或零预付模式为 RI 覆盖的资源支付的总金额与全额预付模式之间的差额视为 AWS 向你出借预付款所收取的利息。通过计算出来（它因每个资源的
  RI 而异），你可以将此隐含利率与你的内部资本成本进行比较，看看是投资现金提前购买更好，还是接受较低的折扣并在前期支付更少（或不支付）更好。


  RI 的命名令人困惑，因为你实际上并没有预留特定实例。预留也不能保证应用于特定资源。请记住，RI 更像是你购买并非确定性地应用于相关资源的优惠券。


  RI 通常被认为是对资源成本应用的百分比折扣。然而，说 RI 具有固定费率，该费率在购买时比按需费率便宜一定金额也是正确的。虽然这听起来可能一样，但重要的是要理解，如果
  AWS 降低按需费率，你现有的 RI 费率在一年或三年的期限内保持不变。


  价格下降可能会影响你关于购买哪种 RI 配置的决定——我们将在本章后面讨论。值得注意的是，对 AWS 历史价格下降的分析显示，AWS 通常不会将按需费率降低到足以低于三年
  RI 价格的程度。


  ### RI 提供什么？


  AWS 预留有两个部分：费率降低优惠，以及在一种情况下，为特定可用区购买的资源类型的容量预留。大多数 RI 购买是为了获得费率降低。但一些公司也希望同时获得容量预留，确保它们在特定位置预留的特定类型资源数量在需要运行时可用。


  多年来，随着 AWS 扩展其基础设施，容量预留已成为 RI 购买中越来越不重要的方面。然而，一些运行庞大、弹性基础设施的客户仍在优化容量。最近，AWS 和 Azure
  推出了按需容量预留（ODCR），允许你单独于 RI 进行容量预留。Google Cloud 提供了一个类似的概念，称为 Compute Engine 区域资源，可为特定
  VM 类型提供极高的容量获取保障。请注意，当你将按需容量预留与 AWS RI 结合使用时，设置 RI 为区域级至关重要，以便 RI 可以折扣容量预留。




  ## AWS 承诺模型


  让我们更仔细地查看 AWS 提供的各种基于承诺的折扣形式。


  ![](img/4d4736bc293fd892d1da81802d0f9520_290_0.png)


  我们将更详细地介绍 AWS 承诺的工作方式，因为许多相同的概念和模式也适用于其他云服务提供商，而目前亚马逊在这一领域拥有最成熟和复杂的体系。


  ## AWS 预留实例


  您为特定区域中的特定资源类型购买 AWS RI。AWS 会在生成账单时根据这些标准将您购买的 RI 优惠券匹配到相关资源。


  主要参数如下：


  Region

  您的资源位于何处（例如 US-West-2 或 EU-West-1）？


  Scope

  您的预留是按可用区还是按区域？如果按可用区，则将匹配特定可用区的用量（例如 US-West-2A）。如果按区域，则 RI 将适用于该区域内的任何可用区（例如 US-West-2A
  或 US-West-2B）。请注意，只有按可用区的 RI 才会获得容量预留，但也可以购买按区域的 RI。


  Availability zone

  如果为按可用区的 RI，应适用于哪个具体的可用区（例如 US-West-2A）？


  Instance characteristics

  实例特征

  Type

  由实例族（例如 m5、c4、t3）和大小组成。实例大小因族而异，但通常具有值如 large、xlarge、2xlarge 等。

  Tenancy

  确定资源是共享还是专用。

  Operating system

  指定实例包含的操作系统和软件许可（Red Hat Enterprise Linux、Microsoft Windows 等）。


  如果您的 RI 参数与您正在运行的用量不完全匹配，则 RI 不会应用折扣。因此，确保以正确的参数购买预留至关重要。


  AWS 会以非确定性的方式将折扣应用于随机选择的资源，就像优惠券应用于相关资源一样。虽然 AWS 会从最小实例到最大实例进行应用，但目前没有办法确保折扣应用于特定资源而不是其他匹配的资源。


  ## 成员账户亲和性


  客户影响 RI 应用方式的一种方法是使用成员账户亲和性。AWS Organizations 提供名为合并计费的功能，允许账户成为成员并将成本合并到单个管理账户中（以前称为
  payer account）。在 AWS Organization 中只能有一个管理账户，且账户只能是某个 AWS Organization 的成员。当然，出于各种原因，您的企业中可能存在多个管理账户。


  当您购买 RI 时，可以在管理账户或任何成员账户中进行此购买。RI 可以在同一 AWS Organization 内的账户之间共享其提供的折扣。然而，它们对所属的本地账户具有亲和性，这意味着在特定账户中购买的
  RI 将首先提供给该账户中的资源。对于我们稍后讨论的 SP 也是同样的方式，但在本节中我们仅使用 RI 来描述账户亲和性的工作原理。


  如果本地账户没有 RI 的匹配用量，则该预留将对同一 AWS Organization 中任何其他 AWS 账户的匹配用量应用折扣。


  RI 共享可以按每个 AWS 账户禁用，但默认情况下是开启的。如果禁用 RI 共享，该账户内的任何 RI 都不会在账户外应用折扣，并且当 RI 与账户内的任何用量不匹配时，不会应用任何折扣，在
  FinOps 中我们称之为空置或预留浪费。禁用共享有效地将 RI 固定到成员账户，如果出于预算目的必须不共享的话。考虑在禁用共享时可能会导致浪费，因为未使用时折扣不会共享给他人。这似乎没有意义，通常确实如此，但在资金仅授权用于特定目的的情况下可能需要，例如在政府机构中资金的使用受到严格限制。此外，同一
  AWS Organization 中其他账户的 RI 不会对已禁用 RI 共享的任何账户应用折扣。


  人们通常对 RI 共享的工作方式存在误解。为了确保您理解正确，请查看图 17-2 中的示例。


  ![](img/4d4736bc293fd892d1da81802d0f9520_292_0.png)


  Figure 17-2. Discount interactions with RI sharing

  图 17-2. RI 共享的折扣交互


  Figure 17-2 shows a typical account structure: a management account with a handful
  of linked member accounts. You can see in the diagram there are three RI purchases:
  in the management account, in member account A, and in member account C. Account
  affinity will cause the RIs within the account to apply a discount to the local
  account first. If no usage matches the RI within the same account, then RIs may

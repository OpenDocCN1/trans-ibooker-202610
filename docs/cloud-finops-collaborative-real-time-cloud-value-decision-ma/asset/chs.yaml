  图 17-2 显示了一个典型的账户结构：一个管理账户和一些关联的成员账户。您可以在图中看到有三次 RI 购买：管理账户中、成员账户 A 中以及成员账户 C 中。账户亲和性会导致账户内的
  RI 首先对本地账户应用折扣。如果同一账户内没有匹配的 RI 用量，则 RI 可通过 RI 共享对另一个成员账户的用量应用折扣。


  In the example layout in Figure 17-2, the following may occur:

  在图 17-2 的示例布局中，可能出现以下情况：


  - RIs in the management account can apply to account A or B because they both have
  RI sharing enabled.

  - 管理账户中的 RI 可以应用于账户 A 或 B，因为它们都启用了 RI 共享。


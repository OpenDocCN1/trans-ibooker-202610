- "## Optimize Phase\n\n## 优化阶段\n\n在本部分，我们将介绍设置和跟踪目标以进行数据驱动决策从而优化组织云的流程。我们还将研究云服务提供商的折扣优惠和承诺策略，这些策略可以帮助降低云成本。\n\
  \n## Optimize Phase: Adjusting to Hit Goals\n\n## 优化阶段：调整以实现目标\n\n当你进入优化阶段时，你的重点转向近实时做出决策、识别异常并高效支出。你使用指标设定目标，以便组织了解其相对于既定期望的绩效如何。\n\
  \n在本章中，我们将扩展说明你为何需要目标、它们应在 FinOps 世界中如何实施以及如何设定它们。我们还将介绍成本优化的目标，这为优化阶段的其余部分奠定了基础。\n\
  \n## Why Do You Set Goals?\n\n## 为什么要设定目标？\n\n每一次进入云的旅程都讲述不同的故事。对于某些组织而言，所有服务部署到云的速度比成本更重要。对于其他组织而言，主要目标是放慢速度并确保整个过程中预算得到维持。其他组织可能已经在云中，并且发现自己花费的远超预期。他们理所当然地感到需要把事情控制住。\n\
  \n值得注意的是，大多数组织在团队层面同时进行着多个云故事。一些团队可能是云原生，旨在维持其成本。其他团队正在迁移或实施新项目，更关注交付时间而非花费的美元数。\n\
  \n通过在公司层面以及每个单独团队设定目标，你能够跟踪业务决策、设定期望，并识别云支出中哪些方面没有像你希望的那样运作。\n\n## The First Goal\
  \ Is Good Cost Allocation\n\n## 第一个目标是良好的成本分摊\n\n在设定进一步目标之前，你必须清楚了解当前状态。如果你实施清晰的标签和账户分离策略，随着在云中扩展资源，将更容易理解你所面对的情况以及如何最好地优化它。\n\
  \n每个组织都应按成本中心/业务单元跟踪支出。这不仅使每个团队能够了解其对整体云支出的影响，还允许企业确定哪些团队推动了任何成本变化。\n\n我们已经介绍过如何实施清晰的成本分摊策略，以帮助按成本中心识别支出。这些成本分摊策略需要保持一致。如果不一致，试图确定其历史云支出的团队将无法区分其成本变化与分摊策略将更多或更少的整体云支出分配给他们的差异。\n\
  \n按团队分解成本有助于突出变化发生的时间。如果没有单个团队级别的报告，数据可能会具有误导性。例如，如果一个团队优化其云支出，而另一个团队以相似规模扩大其占用，则整体成本可能看起来持平。如果团队对基础设施进行更改，而跟踪成本指标的图表没有相应变化，那么你跟踪的就是错误的指标。\n\
  \n## Is Savings the Goal?\n\n## 节省是目标吗？\n\n正如我们多次提到的那样，因为它非常重要，节省并不总是目标。许多 FinOps\
  \ 实践者起初专注于减少云账单的方法，这很好。但你必须始终记住，FinOps 是关于实现问责制、支出投资决策的所有权以及最终创新。在设定目标时，你应该问自己：我如何花费正确数量的金钱来为业务带来最大利益？我寻求的好处是什么？它们包括增加收入、更快项目交付、其他领域的成本效率，甚至只是更满意的客户吗？在这里多花钱能否在其他地方减少成本，例如劳动力？\n\
  \n一个组织可能需要在特定时间内搬出数据中心，错过该截止日期的成本远高于快速迁移到云的成本。或者在另一种情况下，企业可能需要在截止日期前交付功能，这需要使用 AWS\
  \ Aurora 等托管服务，而不是自行运行 MySQL。Aurora 的成本高于内部运行，但它带来了消除耗时管理任务的好处，例如硬件配置、数据库设置、修补和备份，这改变了\n\
  \nTCO（总拥有成本）对比并让企业有更多时间投入迁移。\n\n优化阶段是关于衡量你的支出与目标之间的差距，并确定现在可以做出的决策以及应安排在以后清理的行动。\n\
  \n为鼓励就目标应如何与节省成本与创新速度相平衡展开讨论，我们引入了铁三角。\n\n## 铁三角：好、快、便宜\n\n铁三角（或有人称之为“项目三角”），如图\
  \ 14-1 所示，是项目管理约束的模型：速度、成本和质量。常见的表述是：“好、快、便宜——任选其二。” 它认为项目经理可以在确定项目完成方式时在约束之间进行权衡。一个约束的改变需要其他约束做出相应调整以补偿。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_237_0.png)\n\n图 14-1. 铁三角\n\n例如，如果增加预算或削减范围，迁移项目可以更快完成。同样，增加范围可能需要预算和进度的相应增加。在不调整进度或范围的情况下削减预算将导致质量下降。\n\
  \n铁三角是可视化云决策过程中发生的完美隐喻——好、快、便宜之间往往存在权衡。团队越是与三角形的某一端保持一致，就越少关注其他领域。但这并不是坏事。你希望团队做出有意的选择，朝某一轴的某一端努力，以支持其业务目标。\n\
  \n- *Good* 衡量服务的质量。给云中运行的服务分配更多资源可以提高可用性、灾难就绪能力、性能和可扩展性。\n- *Fast* 衡量团队行动的速度。当你向客户推出最新更新或功能、快速将服务迁移到云中，或缩短新产品上市时间时，这种速度非常有价值。\n\
  - *Cheap* 衡量云支出金额。关注便宜（由于 COGS 限制或预算上限）将导致最低的云成本，但随之而来的是对质量和速度，即好与快的影响。\n\n这种在现实世界中的体现反映在\
  \ Atlassian 近期的一项项目中。一个团队过度配置资源以收集额外的性能数据，正如预期那样，这提高了迁移速度。如果团队停下来调整资源以节省成本，整个项目就会被延迟。交付速度比潜在节省金额更重要。项目交付后，关注点从速度转移，团队开始积极审查部署以发现可能的节省。\n\
  \n我们必须强调，铁三角并非仅用于组织层面。它也必须延伸到团队层面。对于一个成本意识强的组织来说，有一个团队和/或服务以速度为重点运营是常见且有用的。虽然总体上组织试图在云中保持或增加节省，但节省的增加可以再投资于团队，以便更快地开发组织的下一个竞争优势。\n\
  \n## 通过 OKR 实现目标\n\nOKR，即目标与关键结果，是一种定义和跟踪目标及其成果的框架。对于每个 OKR，都有一个需要实现的目标，以及一组称为关键结果的指标，用于衡量该目标的实现程度。OKR\
  \ 通常的有效期为一个季度。\n\n在一次 FinOps Foundation 的演讲中，前 Nationwide 云服务总监 Joe Daly 表示，“我们用\
  \ OKR 来明确目标并专注于结果，以提供清晰度、问责制和可衡量的成果。”\n\nDaly 还明确指出，使用 OKR 最重要的是关注结果。当企业迁移到云时，随着团队努力快速吸收大量新知识，可能会产生大量混乱。对于多年来以另一种方式做事的团队来说，这可能非常令人望而生畏。\n\
  \n### OKR 重点领域 #1：可信度\n\n当 Daly 在 Nationwide 的 FinOps 团队相对较新时，他提供了以下建议：“可信度可能是你在启动\
  \ FinOps 实践时最需要关注的领域。可信度等同于信任，如果你没有这种信任，你就会不断试图支撑你提供的服务。”\n\nDaly 通过从终端用户一直到代码的透明度来支持他的可信度目标。其关键部分是定期支出更新（每日、每周、每月），粒度取决于每个利益相关者的需求。这些更新必须简单易懂。数字还必须与他们的会计师在月底向他们报告的内容相一致。\n\
  \n### OKR 重点领域 #2：可维护性\n\n太多时候，新 FinOps 团队以不可维护的方式开展工作，例如不强制执行自动化标签。正如 Daly 所说，“有意义的数据需要由认为它有意义的人来管理。我们所做的是创建一个标签存储库，由应用产品经理和面向业务的人员维护，这样你就可以将所有应用数据和业务数据与资源关联起来，而无需依赖工程师，因为对他们来说数据没有那么有意义。”\n\
  \n他在该领域设定的关键结果的两个例子是能够将应用名称、应用所有者和业务组与每个资源关联起来，并自动化像计费回溯这样例行且耗时的任务。\n\n### OKR 重点领域\
  \ #3：控制\n\n这里的目标是在实现速度的同时建立控制。正如 Daly 所说，“我们将使用控制的责任推给应用/产品团队。”他们通过建立直接的计费回溯模型、分享知识并鼓励用户采用来实现这一点，同时确保实施政策以防止自动扩缩容的噩梦。\n\
  \n他在该领域设定的关键结果的一些例子是使标签合规率翻倍、为云和容器使用建立计费回溯，以及自动化合规政策。\n\n团队有不同的动机来推动支出和节省。工程师完全合理地围绕更高性能、更高可用性和更快部署新功能设定目标。财务团队适当地关注支出、节省和支出效率。而业务领导者可预测地仍然关注整体业务绩效。在为\
  \ FinOps 设定目标时，你不能只是让这些团队各自设定目标。不仅不会实现业务的正确结果，而且还会增加团队之间的摩擦。\n\n> *当工程和财务一起讨论时，你通常会得到一个对两个部门都有效的解决方案，而不是工程师只是在房间里想出一个仅适用于工程师的解决方案。同样，财务部门制定政策会让工程师的生活更困难。让人们共同合作制定更聚焦的\
  \ OKR 将为每个人带来更好的结果。*\n> \n> —Joe Daly，前 Nationwide 云服务总监\n\n业务领导者需要决定他们愿意花费多少，以及在速度利益下何时应放弃节省（甚至可能产生浪费）。但无论是尽快将\
  \ IT 从数据中心迁移出来，还是将新服务推向客户，都应始终有可追踪的支出预期。唯速度论只在支出没有增长到不可接受的程度之前有效。\n\n与其等待云成本突破不舒服的阈值然后再努力应对，不如在项目进展过程中设定早期预期并跟踪云支出，这将有助于避免账单冲击。工程师随后将在商定的成本范围内获得更多自由。FinOps\
  \ 团队可以帮助识别保持预算在轨的轻松获胜点，而财务和业务领导者能够重新评估预算和目标。\n\n> *在 FinOps 认证从业者培训课程中，关于 FinOps\
  \ 团队在优化阶段的角色的主题是帮助做出关于成本的重要决策，以保持支出在范围内（无论你试图多快），然后当理想的成本路径未被遵循时（由于速度或由于粗心、缺乏技能、追求更高质量等），能够识别出后期优化的地方。所以我们找到低垂的果实来清理，但我们也在流程早期注入一套重要的成本检查以进行治理。*\n\
  > \n> —Rob Martin，FinOps Foundation 学习总监\n\n整个业务需要在为技术团队提供足够支持的同时保持支出在可接受范围内。最终，你正在构建通往\
  \ FinOps 极乐世界的道路，在那里单位经济学将使你能够确定从云支出中获得的业务价值量。\n\n与其它组织的 FinOps 从业者讨论目标可以帮助你构建自己的目标。了解对他们重要的目标以及原因，可以帮助你确保设定正确的目标并与\
  \ FinOps 社区保持一致。\n\n## 来自云端的故事——FinOps 社区\n\n以下是 FinOps Foundation 迷你峰会电话会议中一位成员分享的一些示例目标：\n\
  \n我们今年有 $3m 的成本规避目标。我们计划通过将预留覆盖率提高到 80% 来实现。我们按预算区间分解预留覆盖率。随着我们继续购买预留实例，我们希望确保高\n\
  \n预留利用率。我们将预留利用率的目标设为 95%，并按预算分段进行跟踪。\n\n我们对标记有 KPI，因为它对我们的优化工作至关重要。应用所有者标签对我们围绕适度配置的工作至关重要。我们还跟踪适度配置的选择退出情况。我们跟踪谁选择接受或退出我们向他们提供的建议。我们的目标是将选择退出适度配置建议的比例降至仅\
  \ 25%。\n\n此外，我们在两个方面跟踪云提供商预算：（1）对提供商的承诺和（2）每个预算分段内的预算进度。最后，我们跟踪通过适度配置和预留覆盖所能实现的总体节省机会，以及该数字随时间的变化情况。我们为全年设定了目标，即希望将总体节省机会降至多低。\n\
  \n## 目标线作为目标\n\n目标不仅仅是一个单一数值——它们是随时间推移的趋势。如果你将目标设为每月 x 美元之类的单一数值，你必须等到月底才能看到进展情况。通过将该目标分解为每日数值，你可以在云支出图表上绘制目标线，从而实现接近实时的分析。目标线在以指标驱动的成本优化中至关重要，我们将在第\
  \ 22 章后面介绍。\n\n指标应始终具有目标线，以为数据提供更多上下文。目标线的设定位置将基于贵组织的云旅程、您在维持支出方面的积极程度，以及您认为为实现创新而多花钱的价值。\n\
  \n目前专注于铁三角“快速”角的组织可能会设定相当高的目标。超出目标仅具有信息性，并将导致预测上调。另一方面，谨慎的组织（专注于铁三角的“成本”角）会将目标设定得与其现有支出轨迹相当接近，而支出超出目标的情况将通过快速行动来恢复正轨。\n\
  \n如果你像图 14-2 那样随时间绘制支出图，可以确定一些基本信息：\n\n- 你目前每天的支出在 40 万美元到 53 万美元之间。\n- 总体而言，你的云支出正在增加。\n\
  - 上个月的支出增长速度比前几个月更陡峭。\n\n但这些关于云支出的基本事实只是数据点。从图表中无法确定任何绩效或业务预期。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_242_0.png)\n\
  \n图 14-2。数月内的每日支出图\n\n然而，如果像图 14-3 所示添加目标线，你可以确定更多信息：\n\n- 你的支出在历史上一直低于目标。\n- 上个月你超出了目标支出。\n\
  - 你在之前的几个月里没有修订目标。\n- 如果当前趋势不变，本月你将再次超出目标。\n\n添加目标线可以让你对图表中的数据点获得更多上下文。目标线并不总是需要是线性的；考虑一下先快速上升然后趋于平稳的目标，或延迟增长然后快速上升的目标。在可能的情况下，你应始终尝试在图表中包含目标线，以了解数据点对组织的影响。这与\
  \ FinOps 的语言相关，如第 4 章所述。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_243_0.png)\n\
  \n图 14-3。添加目标线后的数月内每日支出图\n\n## 预算差异\n\n通常，如果你的指标与目标存在显著差异，就存在问题。为了保持预算，团队应认真对待目标的突破，并在指标绩效发生变化时尽早做出反应。\n\
  \n虽然指标远低于目标时可能看似不重要，但你应始终努力将目标设定在预期水平。这将建立对所跟踪数字的信心，并确保所有细节都纳入目标设定阶段。\n\n有时团队需要做出选择，而这些选择会影响其预算。考虑这样一种情况：某个团队在项目上落后了。他们的计划是部署较小的云资源以保持成本低，但为了让项目重新回到正轨，他们决定部署更大的资源并更快完成工作。这将导致短期内超出目标，但会带来将项目按时交付的业务利益。我们将此归类为预期异常。事先做出决定，超出计划预算以实现期望的业务成果。\n\
  \n*意外的异常*发生在团队部署资源时预期保持预算，然后发现支出呈超预算趋势时。意外的异常通常意味着需要做出改变：要么是已部署的内容，要么是为团队设定的目标。\n\
  \n例如，假设你产品中的新功能可能会增加客户与服务的互动，从而增加成本。如果成本的增加也提高了你的收入，那么在云支出中看到这种异常就是好事。（我们将在第 26\
  \ 章讨论单位经济学，这是一种让你能够跟踪收入与成本的过程。）\n\n你还必须能够跟踪可能不会直接导致云支出变化的异常。如果你的某个团队开始使用新的云服务产品，取代通常使用的产品，你可以通过显示按云服务产品划分成本的异常报告得知此事。对于在安全或合规原因下使用新服务前需要批准的公司而言，该报告中的异常可能非常重大。\n\
  \n跟踪你的成本优化可以让你识别优化绩效的意外变化，这可能表明 FinOps 战略的某些部分未被正确执行。优化报告中的异常使 FinOps 团队能够及早做出反应，以保持组织已习惯的节省。使用基于自动化、机器学习的异常检测是快速找到云堆栈中的那些“针”的关键。\n\
  \n## 使用更少与支付更少\n\n当你知道实际支出与预期支出之间的差异时，下一个显而易见的问题是当支出超出预测时该怎么办。好吧，有两种方法可以降低你的云账单，为了更好地理解它们，让我们重新回顾云的计费方式。\n\
  \n我们在第 5 章介绍了云提供商如何向你收费。记住，云支出的基本公式是 *支出 = 使用量 × 费率*。要减少支出，你可以减少拥有的 *使用量*，或使用云服务提供商特定的产品来降低为资源支付的\
  \ *费率*。\n\n你可以通过减少已配置资源的规模（例如，配置更小的虚拟机，减少虚拟 CPU [vCPU] 和内存）或在不需要时关闭/移除它们来减少使用量。你通常通过在一段时间内向云服务提供商承诺一定量的使用量来获得费率降低。作为回报，他们会降低你为这些资源支付的费率。\n\
  \n我们将在第 15 章和第 16 章介绍针对这两个杠杆——使用量减少和费率减少的策略和战术。\n\n## 结论\n\nFinOps 生命周期中的告知阶段帮助你了解事物\
  \ *是* 什么样的。当你进入优化阶段时，你会设定关于事物 *期望处于* 何种状态的目标。利用这些目标使业务能够专注于需要关注的事项。\n\n总结如下：\n\n\
  - 优化阶段并不总是关于降低成本——而是关于高效支出。\n- 目标为指标提供上下文，使人们不仅能了解事物现状，还能了解事物应有的状态。\n- 早期检测到的异常可以迅速处理，避免账单意外。\n\
  - 你可以通过使用量减少或费率减少来降低成本。\n\n在减少云支出时，了解实际需求非常重要。以牺牲创新或影响重要项目为代价来减少支出应始终避免。降低云成本很复杂，但我们将在接下来的几章中帮助你逐步分解。\n\
  \n\n"
- "## 减少使用：使用优化\n\n在本章中，我们讨论 FinOps 生命周期中最具挑战性的部分之一。使用量减少在文化层面实施需要大量努力和时间。如果你的目标是快速节省成本，你会发现购买基于承诺的折扣——我们在第\
  \ 17 章中会介绍——是降低成本的更快途径。与购买预留实例不同，后者可以在无需任何工程操作的情况下带来显著的成本节约，使用量减少需要工程师将其优化工作纳入冲刺计划。这并不是说没有易于取得的成果——只是完成它需要付出更多努力。\n\
  \n云服务提供商向你推销“按需付费”的理念。然而，更准确的说法是，你为所配置的资源付费，无论是否使用。在本章中，我们将查看部署到你的云账户中的资源，这些资源要么未被使用，要么未被高效使用。\n\
  \n### 云消耗的冷酷现实\n\n当你开始关注使用优化时，如果听到类似以下的对话，请不要感到惊讶：\n\n**FinOps 实践者：** “嘿，看起来这里的这些资源没有被使用。你需要它们吗？”\n\
  \n**团队成员：** “哦，它们还在？我忘了！我现在就删除它们。”\n\n此时，你可能会情不自禁地用沮丧的手拍额头。你会很快意识到，如果你早点进行这场对话，或许就能节省数月为该资源付费的开销。\n\
  \n但事情并非如此简单。当你在云端大规模运营时，可以几乎肯定会有一些未充分利用或被遗忘的资源。面对云中看似无限的资源选择，许多工程师倾向于选择更大的资源选项。做出这种选择可以避免他们在半夜被叫醒处理问题。\n\
  \n然而，很难知道哪些资源需要审查。正如我们提到的，这要求团队拥有正确的指标来了解其应用的需求。团队还必须了解资源按此方式配置和运行的任何业务原因。FinOps\
  \ 在组织中如此有效，是因为它要求组织各方遵循一致的工作流程，并在将建议付诸实施时共同协作。\n\n然而，当你开展使用量减少工作流程时，你可以在之前因资源过大而浪费金钱的地方实现节约，并防止浪费在未来积累到你的云使用中。我们将探讨什么是浪费、如何检测需要调查的资源、减少使用的方法、如何让团队实施变更，以及正确跟踪进展的方式。\n\
  \n大规模的使用量减少需要文化转变。它不是一次性修复，而是一个持续循环，即选择合适大小的资源并消除过度配置。使用量减少要求工程师像思考内存或带宽一样思考成本：作为另一个部署\
  \ KPI。他们很快就会看到，将成本视为效率指标进行思考是值得付出的努力。\n\n将资源大小减半通常会节省 50% 的成本——或者在未使用资源（如未挂载的块存储卷或空闲实例）的情况下，节省\
  \ 100% 的成本。云的可变、按需特性带来的好处之一是，你可以随时自由调整任何资源的规模——或完全停止使用。关于正确配置且持续使用的资源，通过费率降低选项还能进一步节省成本，我们将在第\
  \ 17 章中介绍。\n\n最初，使用量减少往往是追溯性的。团队会清理基础设施，以确保资源集得到充分利用。在更成熟的做法中，工程师在部署前架构评审中会主动考虑成本，并在最初选择云资源时积极考虑成本。后续阶段会带来对应用的重构，以使用更多云原生服务。\n\
  \n目标不是做出完美的决策。而是在给定上下文和数据的情况下做出尽可能好的决策，然后经常重新评估。合适大小的资源不会永远保持如此，因为代码和负载会随时间演变。\n\
  \n### 云端故事——Mike\n\n在 Atlassian，Mike 自本书第一版以来看到了巨大转变：\n\n四年前，FinOps 被视为占用工程师时间并通常阻碍他们的工作。该实践已成熟，更多地与工程本身集成，因为它已成为在云中交付软件的核心部分。FinOps\
  \ 基金会也看到工程角色的成员在过去几年中大幅增长。在 FinOps 成为 established 术语之前，你会去找工程师说，“我们正在尝试做 FinOps\
  \ 或成本优化”，而他们真的不知道那是什么意思。现在他们通常已经听说过这些术语，并理解你试图实现的目标。有效的 FinOps 团队作为合作伙伴而非局外人出现。FinOps\
  \ 团队在软化语气方面做得更好，更倾向于与工程师协作，而不是仅仅指责浪费。\n\n在 Atlassian 的 FinOps 培训中，我们做了一个练习，比较两种不同的模式。首先，我们以要求苛刻、归咎于人的方式进行对话（即“你做错了”）。\
  \ alternatively，我们带着无指责的数据出现，并询问数据为何显示未充分利用的原因进行讨论。这个练习强调，问题不仅仅是找到浪费，而是工作和协作，首先寻求理解。\n\
  \n### 浪费从何而来？\n\n我们所称的 *浪费* 是指任何付费使用或付费使用的一部分，通过调整资源大小或减少资源数量以更好地满足应用需求本可以避免的。\n\
  \n当云资源首次部署时，其容量需求往往并不完全已知或被充分理解。在部署初期，这对几乎所有人都是如此。\n\n这种不确定性导致团队过度配置容量以确保不会出现性能问题。初始部署时过度配置资源并不是坏事。云的优势在于它让你能够快速部署，然后在过程中进行调整。你想要避免的是部署资源后不对其过度配置进行监控。那时你会发现自己在长期内为资源支付了超出应有的费用。\n\
  \n随着团队忽视基于利用率指标维护资源，浪费会增长。持续监控资源是否过大至关重要。因为今天正确使用资源的服务，在部署更高效的服务代码后，明天可能会过度分配。甚至客户行为的变化也可能导致容量需求降低。\n\
  \n### 通过移除/迁移减少使用\n\n研究表明，有两种类型的云团队：那些忘记了一些资源的人，以及那些撒谎说忘记了一些资源的人。换句话说，资源被遗忘并留在云账户中是非常常见的。当你在公司发现同样情况时，不要假设有恶意或粗心。工程工作有许多相互竞争的优先事项，而用于检测浪费的自动化工具并不总是被领导层优先考虑。换句话说，这对我们每个人都可能发生。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_250_0.png)\n\n通过查找成本非常稳定且使用过时资源的区域来发现浪费。“陈旧且不变”不是云应有的运作方式。如果它长时间未被触碰地闲置，很可能可以进行优化。\n\
  \n仅仅告诉团队不要忘记资源并不能涵盖所有情况。资源可能是由未配置为在指示时删除的自动化创建的。或者资源是团队故意留到未指定的稍后日期，但随着优先事项转移，未采取后续行动。此外，一些资源可以在其父资源被删除时配置为保留，例如附加到服务器的卷，并且在删除某些资源时，云服务提供商可以自动创建数据快照，无论你是否需要它都会保留。\n\
  \n丢失或被遗忘的资源是团队最容易处理的资源类型。在这种情况下，减少使用可能只需删除资源即可，节省该资源 100% 的成本。\n\n我们经常听到的另一个对话是关于需要在资源内保留数据的需求。通常，团队出于合规原因需要保留数据很长时间。\n\
  \n即使你出于此目的需要保留未使用的卷，也有办法减少支付费用。例如，云服务提供商提供多种存储层级，当你可以将其移至价格更低的“冷存储”资源（如 Azure Archive\
  \ 或 AWS Glacier 存储）时，为数据支付更高价格存储服务的费用毫无意义。\n\n考虑制定数据保留策略，明确团队需要保留哪些数据以及保留多长时间。一旦制定了保留策略，团队就可以自动将数据移至不同的存储服务，并在适当时删除。\n\
  \n\n\n## 通过调整规模降低使用量（Rightsizing）\n\n要调整资源大小，您需要了解资源利用率的可见性。这种可见性必须包括 CPU 使用率、已使用的内存、网络吞吐量和磁盘利用率。\n\
  \n进行 Rightsizing 时，您不仅仅是在优化成本节约。您还需要确保不会影响团队运营的服务。团队在管理服务时的主要目标是确保服务本身不会耗尽所需的运行容量。因此，他们抵制调整资源大小的想法并不罕见，尤其是支持生产应用的资源。\n\
  \n如果团队必须停止手头的工作来调查调整资源大小，交付计划可能会受到实际影响。在决定团队是否应专注于调整资源大小以降低成本时，应考虑这些影响。通常只有少数高成本资源和大量会节省很少的小资源。我们建议设定一个截止点（最低节省金额），在此之下可以忽略\
  \ Rightsizing 建议。此阈值应经常审查，以确保其仍然合理。目标是确保花费在 Rightsizing 上的时间能为企业带来实质性节约。\n\n为了防止在实施调整大小变更时对资源或自动化产生影响的担忧，了解\
  \ FinOps 团队在 Rightsizing 中发挥的作用非常重要。FinOps 是关于团队之间的协作，不应由 FinOps 从业者独立执行。这就是对话至关重要的原因，因为仅凭指标通常无法推断团队在确定资源大小时使用的方法。\n\
  \n中央 FinOps 团队负责运行资源使用的自动化分析，提供有关哪些资源似乎未充分利用的报告，并以编程方式提供替代的、更高效的配置。然后将建议提供给团队，以便他们调查资源，找出可能阻止调整大小以实现潜在成本节约的任何原因。工程组织必须理解，FinOps\
  \ 团队并非有意引入性能风险，而是专注于在不提供业务价值的地方安全地减少容量。\n\n必须提供多种能够适应资源上现有工作负载而不会影响工作负载性能的建议。多种建议使团队有机会在减少资源大小所涉及的风险与潜在节约之间取得平衡。原生、开源或第三方\
  \ FinOps 工具可以承担提供这些建议的重任，而工程团队可以使用应用性能监控工具进行进一步调查。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_252_0.png)\n\
  \nAWS 的产品经理 Rick Ochs 表示，确保 Rightsizing 建议具有高质量非常重要，这有助于工程团队避免花费数小时的验证工作来发现潜在风险，例如账户配额、附加限制或\
  \ CPU 速度差异。提供方向正确但过于简化的 Rightsizing 建议往往会导致工程团队花费更多时间拒绝建议，而非 Rightsizing 所能带来的收益。\n\
  \n通过使用高质量的 Rightsizing 建议——那些不仅使用 CPU 平均值，还包括 I/O、吞吐量、内存，并且不使用峰值或平均指标的建议——您可以降低所需的工作量并增加转化为实质性成本节约的建议数量。\n\
  \n每一条 Rightsizing 建议都是与某人进行讨论的机会。您必须充分了解对现有资源进行 Rightsizing 的总体工作量，并确保新应用从一开始就进行\
  \ Rightsizing。\n\n## 来自云端的故事——Benjamin Coles\n\nBenjamin Coles，Cupertino 的高级软件开发工程师，向他的工程合作伙伴提供了以下建议：\n\
  \n对于迁移而言，Lift-and-Shift 模式是一种快速而粗糙的方法，允许我们在不考虑需求的情况下尽可能多地将内容塞入云中。它本质上变成了推迟的技术债务；这是在我们不去检查是否可以进行调优的情况下把问题踢到路边的过程。\n\
  \n这不是理想的长期解决方案；如果我们有时间，我们会重构代码——我们会做对。在此期间，我们能做些什么小胜利来让迁移更易于承受？如果您为源实例（裸机或虚拟机 [VM]）开启了监控，请查看\
  \ CPU/内存并了解您的应用程序使用了多少。不要使用实例规格，您可以构建一个更接近实例性能要求的 EC2。\n\n为什么这很重要？从传统意义上讲，当您使用本地实例时，您只需支付一次费用，然后再也不用考虑它。在这个新的云世界中，他们将每个子系统都细化到了\
  \ CPU 和内存的成本。在云中，您会被收取存储和网络 I/O 以及您注册的每项其他服务的费用，导致千刀万剐。即使您只关注实例成本，忽略所有相关的子成本，也有很多钱可以潜在节省。\n\
  \n例如，如果您有 100 个系统，每个系统为 16 核 128 GB RAM——相当于 c6g.4xlarge，价格为每小时 0.544 美元，或约每年 47.6\
  \ 万美元。将实例大小减半将得到 c6g.2xlarge，价格为 0.272 美元，或每年运行费用 23.8 万美元。这种模式的优点是，您可以通过降低运营支出赢得财务团队的好感，甚至更好的是，如果您在触发重新部署时能再次做到这一点。\n\
  \nBenjamin 的故事尤其有意义，因为当我们在数据中心构建事物时，我们有意使基础设施过大，以便在它们服役的五到七年内工作负载能够增长。将物理硬件采购规模扩大被视为标准最佳实践，以避免因应用程序导致系统在硬件寿命中期就耗尽容量而不得不重新购买硬件的痛苦。这导致了物理数据中心硬件平均利用率非常低的个位数这一常见结果。如果我们通过完全匹配数据中心中的\
  \ CPU 和内存来进行 Lift-and-Shift，我们就在不知不觉中延续了这种过度配置。如果您无法立即查看利用率，一个替代方法是默认在云中选择稍小的规模，并在出现性能问题时解决这些问题。如果工程团队能够轻松识别性能问题但尚未看到成本，这种方法可以帮助提升迁移的成本效率。\n\
  \n## 常见的 Rightsizing 错误\n\nRightsizing 在初次考虑时很少像看起来那样简单明了。有大量细节需要考虑，许多常见错误会被云优化新手反复犯下。\n\
  \n### 依赖仅使用平均值或峰值的建议\n\n在查看资源（例如服务器实例）上的现有工作负载时，至关重要的是确保您不仅仅查看指标的平均值和峰值。如果使用平均值或峰值，您可能会被误导。\n\
  \n考虑利用率的波动和峰值然后应用统计模型来枚举最佳匹配的资源大小并非易事。我们见过的大多数工具都只基于时间序列的利用率平均值使用某种经验法则，然后推荐最紧密匹配的资源类型。其他工具会对它们看到的任何峰值都推荐升级，无论原因如何。\n\
  \n例如，当您比较图 15-1 中的两个使用图时，两者的平均 CPU 统计数据在每小时内均为 20% 利用率。然而，使用平均 CPU 使用率指标，您无法判断 CPU\
  \ 是否整整一个小时都保持在 20%（如右图所示），还是五分之一的时间接近最大 CPU，其余四分之五的时间接近最低（如左图所示）。将这些实例调整为 CPU 容量减半的服务器实例将影响左实例在\
  \ CPU 峰值使用期间的性能。无论您按天查看，还是按\n\n每小时，甚至每分钟。平均值并不能完整说明实例上正在发生的情况。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_254_0.png)\n\
  \n*图 15-1。显示两种 CPU 工作负载的图表：一种有短暂的 90%+ 峰值，然后在剩余时间内保持在 <10%，而另一种则稳定在 20%*\n\n仅使用利用率平均值可能导致两种结果。最常见的情况是，工程师意识到该建议完全不合理，成本节约举措随之结束。团队意识到他们浪费了大量时间，而他们的部署成本仍然高于应有水平。\n\
  \n另一种情况更糟。经验不足的工程师可能会照此执行建议的操作。在空闲时或甚至平均使用时，新资源配置可能仍然能正常运行。但当出现常规峰值或变化时，情况开始恶化。对资源的需求超出其承受能力。性能开始下降，甚至可能出现某种中断。任何潜在的成本节约都远不及对业务的风险。\n\
  \n> 将所有工作负载的大小调整为最大或峰值也可能是一个错误。在企业 VM 使用的典型月份中，这些工作负载上会发生各种活动：修补、维护、部署、备份等。虽然任何这些活动都可能导致\
  \ CPU 使用率飙升，但这并不意味着你应该立即升级，或信任总是将实例大小调整为覆盖峰值使用量的建议。即使是正常的 OS 重启也会使 CPU 利用率达到 100%。这就好比每次启动时\
  \ CPU 利用率达到 100% 就扔掉笔记本电脑并买一台更快的电脑。相反，使用一种能够从合理配置中剔除少量峰值的大小调整方法更为可取，其中由于修补、维护或其他行为导致的瞬时峰值不会驱动升级，而只有在一周内持续超过合理\
  \ 1% 或 5% 时间的利用率才会驱动升级。理想情况下，使用利用百分位计算来考虑这一点的合理配置建议。想象一下，如果你使用的是仅以峰值使用量为依据的合理配置产品，然后发现了一个需要对整个公司实例群进行大范围补丁安装的重大安全漏洞。你的合理配置建议会错误地告诉你升级所有内容。\n\
  > \n> —Rick Ochs，AWS 的首席产品经理\n\n## 未能在计算之外进行合理配置\n\n每个人都喜欢首先将精力集中在计算成本节约上，但合理配置需要扩展到计算之外，以便解决更大的云成本问题。你可以在各方面看到利用率问题，但值得提及的两个特定领域是数据库服务器，例如\
  \ RDS（关系数据库服务）、托管 SQL、Azure 托管磁盘、Cloud SQL，以及存储，例如 EBS（弹性块存储）和 Google Cloud 持久盘。如果你不查看数据库和存储等非计算服务，你就会错失大量潜在的节约机会。\n\
  \n## 未解决资源“形状”问题\n\n合理配置决策不应局限于单一计算族。每个云服务提供商都有多个专门的计算族，你应选择一个与工作负载资源形状相匹配的族。在 AWS\
  \ 和 Azure 中，这些族以固定形状提供，具有一定数量的 CPU 核心、一定量的内存，以及快速网络等其他功能。例如，你的工作负载可能需要四个核心和 3 GB\
  \ 内存，并且可能已迁移到云中运行在 AWS 上的 r6i.xlarge 实例上。这具有正确数量的核心，但内存却多得惊人。改为迁移到 c6i.xlarge 不仅可将成本降低一半以上，还能通过保持计算一致同时减少内存来使形状正确。Google\
  \ Cloud 计算的购买方式允许你选择 CPU 和内存组合，而不是从大量预定义实例配置中挑选。你可能还会发现某些实例族具有更快的 CPU，这有时可以让你降低核心数量，或者，另一些则提供更慢的\
  \ CPU，价格更低。通过深思熟虑你可以选择的实例族，你可以在仅仅选择正确的 CPU 和内存数量之外实现额外的节约。\n\n## 合理配置前未模拟性能\n\n\
  你的团队可能会担心削峰（在减少服务器资源时影响性能），这可能导致次优决策。但有了预测建议如何影响其基础设施的方法，他们就能做出更好的选择来优化云。在进行合理配置操作之前，你必须确保可视化每个选项的影响并考虑跨计算族的多个建议。这样，你就可以评估可能出现削峰的概率（参见图\
  \ 15-2），并在与将实现的节约相比时将该风险考虑在内。没有这一步，你的风险就是过于保守（节约有限）或过于激进（性能受损/中断）。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_256_0.png)\n\
  \n图 15-2。基于平均值调整大小会导致削峰\n\n## 因预留实例不确定性而犹豫\n\n团队常说：“我不想进行合理配置，因为它可能会影响我的承诺覆盖范围并造成浪费。”曾经这是一个合理的担忧，需要谨慎。但现在不再如此。所有三大云服务提供商现在都有许多选项，可提供更大的灵活性，让你能够自信地进行合理配置。当使用具有灵活性的预留时，如果你的使用量减少工作受到影响，你可以调整预留。我们将在第\
  \ 16 章和第 17 章中介绍这些灵活性概念。\n\n## 超越计算：控制云成本的技巧\n\n虽然计算资源在许多云账单中占云支出的绝大多数，但还有许多其他使用优化需要考虑，以涵盖可以优化的其他服务。在这里我们将看一些其他云服务关注领域的示例。\n\
  \n## 块存储\n\n与云计算实例密切相关的是附加在其上的块存储设备。查看三大主要云服务提供商，块存储服务包括 AWS 的 Elastic Block Store（EBS）、Azure\
  \ 托管磁盘和 Google Cloud 的 Persistent Disk。\n\n### 清理孤立卷\n\n块存储的主要特性是卷在计算实例停止后仍然存在。这对数据保留是有利的，但如果你为不再需要的存储付费则是不利的。未使用的卷称为未附加或孤立卷，如果你检查其状态，它们会被标记为可用。这些卷在没有附加计算实例的情况下无法接收任何流量，因此本身是无用的。节省开支的绝佳第一步就是将其删除。\n\
  \n一个选项就是直接终止未附加卷，但你只有在确信数据永远不需要时才应这样做。为了确定，你应该查看卷最后一次附加的时间。如果是几个月前，很可能你不再需要该卷。这对于非生产环境尤其如此。某些云服务提供商允许你在删除\
  \ Spot 计算实例时保留块存储可用，因此在采取行动之前，你应确保对这些数据没有数据保留需求。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_257_0.png)\n\
  \n有一个很好的故事，关于删除一个九年历史的未附加卷如何在 FinOpsPod 播客第 13 集的《FinOops: Lessons Learned the Hard\
  \ Way》中造成生产问题。务必在 Spotify 或 Apple Music 上查看。\n\n更谨慎的做法是先对卷进行快照，然后再终止它。快照始终比原始卷便宜。它们会丢弃空白空间、压缩数据，并存储在更便宜的存储层中，如\
  \ AWS 的 S3 或 Google Cloud 的 Cloud Storage。如果你确实需要恢复卷，可以从快照中恢复。\n\n### 专注于零吞吐量或零\
  \ IOPS\n\n清理完未附加卷后，你需要查找处于空闲状态的已附加卷。这些通常出现在相关实例已关闭且卷被遗忘时。要发现这些卷，你需要查看卷网络吞吐量和 IOPS（每秒输入/输出操作）。如果在过去\
  \ 10 天内没有任何吞吐量或磁盘操作，该卷可能未被使用。\n\n### 将块存储成本管理作为优先事项\n\n对于块存储卷，你需要为两个关键属性付费：存储和性能。存储按存储的每\
  \ GB 计费，费率基于位置和卷类型。对于性能，越好越贵，无论是 IOPS 还是吞吐量。令人惊讶的是，在优化云支出时，卷经常被忽略。\n\n\n\n\n## 减少高\
  \ IOPS 卷的数量\n\n具有更高 IOPS 保证的卷（例如 AWS 预置 IOPS 卷或 Azure 高级磁盘）并不便宜，而且相对容易更改。利用历史指标定位未充分利用的磁盘，并让工程师在可能的情况下进行更改，可以大幅降低磁盘成本。\n\
  \n## 利用弹性卷\n\n当您使用 AWS EBS 时，卷可以在使用中增加大小、调整性能或更改卷类型。这可以在应用程序 actively 向您的卷驱动 I/O\
  \ 时完成。无需维护窗口或停机。有很大的成本节约优势，因为您不再需要过度配置存储。通常工程组织会更愿意接受无需停机的建议，因为他们不必处理变更票据、停机窗口，或如果想恢复大小更改而需要额外停机的风险。\n\
  \n## 对象存储\n\n通常被称为无限存储，对象存储服务很可能是您数据主要存放的位置。对象存储服务包括 AWS 的 S3、Google Cloud 的 Cloud\
  \ Storage 存储桶以及 Azure 的 Blob Storage。\n\n## 实施数据保留策略\n\n将数据存储到对象存储服务中的便捷性以及这些数据存储在理论上是无限的这一事实，使得工程师很容易永久存储数据。在数据中心，可用磁盘空间是一个限制，必须实施数据保留策略以避免存储无界增长。迁移到云中消除了提供存储容量的挑战，但不应消除对数据保留策略的需求。\n\
  \n## 选择与数据匹配的存储层级/类别\n\n默认情况下，发送到对象存储服务的数据通常存储在标准/热存储类别中。标准存储通常是最昂贵的存储类别，但具有最高的可用性和耐久性。对数据进行分类并为数据类型选择合适的存储类别，可以在对象存储上为您节省大量费用。一些云服务提供商提供自动分类和数据类别选择，例如\
  \ AWS 的 Intelligent-Tiering。\n\n## 网络\n\n网络成本经常被忽视，可能由于网络流量不是像云计算实例或对象存储桶那样的命名资源。有几种方法可以优化网络成本，但其中许多需要与组织内部管理网络的团队进行紧密协作。\n\
  \n## 清理未使用的 IP 地址\n\n可以从云服务提供商处分配固定 IP 地址；当这些地址与正在运行的计算实例未关联时，它们通常会产生按小时计费。除非有业务原因保留未使用的\
  \ IP 地址，否则删除它们可以减少部分网络支出。\n\n## 优化网络路由\n\n一些云服务提供商提供网络构件（如 AWS VPC 端点），可在不使用公共 IP\
  \ 地址或通过网络地址转换（NAT）服务路由流量的情况下访问其服务 API。使用这些网络构件可以降低在应用程序与正在使用的云服务之间传输数据的成本。\n\n##\
  \ 通过重新设计减少使用量\n\n最复杂的使用量减少方法是重新设计服务本身。让工程团队改变软件的部署方式、重写应用程序，甚至完全更换软件，可以帮助您利用云原生产品。\n\
  \n## 扩展\n\n更改资源大小并不总是全部答案——资源在工作时间可能利用得非常好，但在工作时间之外则不然。当然，如果您将实例调整为更小，在工作时间它将被过度使用并可能导致性能问题。\n\
  \n团队可能能够将生产服务架构得更具云原生性，从而利用云的弹性。最常见的方法是在繁忙期间让服务水平扩展（即配置更多资源），然后在非高峰时段缩减规模。服务本身需要支持这种动态扩展，这可能需要重新设计应用程序代码。或者扩展可能完全不可行，尤其是在专有软件的情况下。\n\
  \n相较于单体应用程序，构建更具服务化、松耦合、模块化和无状态架构的应用程序的现代方法正在获得关注，这得益于其在云和容器环境中的支持，因此未来更多应用程序将具备扩展能力。\n\
  \n## 定时操作\n\n团队经常在睡觉时仍让开发和测试环境运行。考虑一个地理上集中的开发团队，他们每周使用资源 40–50 小时，而剩余的 118+ 小时完全不使用。如果他们能够在周的大约\
  \ 70% 时间内关闭开发资源，就能为组织创造巨大的节省。取决于分布式团队所在的位置，几乎总有 24 小时大家都应该在周末。通过允许工程团队将节省用于新项目或工程工作，激励他们在非工作时间关闭资源，可以帮助推动云支出方面的文化问责。\n\
  \n为团队提供在不需要时自动关闭资源的方式，是确保资源在非工作时间停止的最佳方法。我们将在 FinOps 生命周期中 operate 阶段的讨论中稍后介绍自动化。\n\
  \n## 对预留实例的影响\n\n我们经常被问到：“那我的所有预留怎么办？”如果存在诸如 Savings Plans（SP）、Committed Use Discounts（CUD）或\
  \ Reserved Instances（RI）等承诺预留，那么使用变化导致预留利用不足的担忧始终存在。通常，您可以通过在承诺像 RI 或 CUD 这样的费率优化之前先进行使用优化来避免这个问题。\n\
  \n实施使用量减少可能需要一些时间，通常比最初预期的要长得多。几乎每天我们都会听到有人说：“我在清理完基础设施后再做承诺。”我们发现 10 次中有 9 次，清理工作比预期花费更长时间——通常是数月——在此期间他们最终以更高的按需费率为过大资源付费。\n\
  \n> Rightsizing 是一件非常私密且漫长的过程。工程师们为自己的基础设施操心不已。不能简单地说“嗯，它应该在更大或更小的实例上”。进行这些更改需要测试周期和真正的努力。因此，我们的做法是，如果我们能够集中\
  \ RIs 和承诺、做出良好投资并以低 RI 空置[浪费]数为目标，那么 rightsizing 最终会赶上来的。\n> —Jason Fuller，HERE\
  \ Technologies\n\n优先级往往会发生变化，火灾也必须定期扑灭。您应该接受这些作为生活事实，并寻求一些基于承诺的折扣的即时覆盖，无论您认为浪费有多少。我们经常推荐的策略是从大约\
  \ 20%–25% 的覆盖率这样的小规模开始，然后随着清理工作的进行缓慢增长。关于创建有效的承诺策略，将在第 18 章中有更多介绍。\n\n除非您已承诺云使用的每一部分，否则使用优化仍然是可能的。展望未来，您在承诺费率优化之前应考虑组织可用的使用优化量。大多数云服务提供商允许一定程度地交换或更改承诺以匹配新的使用参数。通过一些规划，您可以避免被锁定在错误的承诺中，并在进行更改时通过修改费率优化来开始使用量减少工作。通过跨不同系列调整实例大小，您通常可以同时提高覆盖率并降低实例支出。您可以通过将更多实例装入已购买的\
  \ RI 和折扣中，以更优化的方式有效地“俄罗斯方块”化您的工作负载。调整大小并折扣工作负载（从而可能留下一些未使用的折扣容量）比因担心浪费折扣而忽略调整大小更具成本效益。\n\
  \n## 收益与投入\n\n当您查看使用量减少建议时，必须将可能的节省与工程投入和对生产服务的风险进行权衡。如果调查和实施更改所需的时间超过节省的收益，最好忽略这些建议。理想情况下，您应过滤掉低价值和/或高风险的建议。\n\
  \nFinOps Foundation 的其中一位成员让其团队以工程小时数来衡量云支出。他们考虑预期节省金额相当于多少工程小时。如果他们只需花费 3 个工程小时就能节省\
  \ 1,000 个工程小时，他们就会去做。如果只能节省 5 个工程小时，则吸引力就小得多。\n\n以工程小时数思考节省可以帮助团队将产生的节省视为团队中潜在的新工程师。节省的工程小时越多，获得额外人员编制批准的可能性就越大。\n\
  \n我们不建议在未先调查更改影响的情况下进行更改。有时团队在不了解其影响的情况下执行更改——更糟的是，设置自动化强制调整资源大小。这可能导致服务的生产问题。\n\
  \n\n\n在投入时间执行减少使用量的变更之前，团队应评估回滚变更的可能性。如果您预计未来几周的工作负载会增加，而实施缩减规模所需的时间意味着您几乎立即之后又必须将其扩大，那么这就不是时间的良好投资。此外，您还必须考虑其他项目，评估通过这些变更所能实现的收益。如果您在调整实例规模后仅几天就推出新服务，而这些实例随后又被替换，那么这段时间本可以用于其他地方，以更好地造福业务。\n\
  \n虽然节省看起来可能很小，尤其与整个云成本相比时，但重要的是要记住节省会随时间累积。通过移除不必要的资源，您可以避免在之后的每个月账单中继续为该资源付费。\n\
  \n## 无服务器计算\n\n*无服务器计算* 是一种模式，其中云提供商运行服务器并动态管理机器资源的分配。定价基于实际执行的活动，而非预先购买的容量单位。\n\
  \n这消除了本章前面讨论的许多未使用或未充分利用的问题。使用无服务器，您真正只为正在积极使用的资源付费。未使用的资源通常不容易闲置。相比在需要时启动新的服务器实例并部署软件，无服务器架构通常能够非常快速地准备好处理请求。\n\
  \n转向无服务器并非没有成本，也绝不是浪费问题的万灵药。FinOps Foundation 近期就如何预测和比较应用程序的无服务器成本与其当前计算密集型架构进行了健康的辩论。提出了几种出色的方法，最终讨论显示该实践仍在不断演进。\n\
  \n最终，构建任何向无服务器迁移计划的复杂性在于执行，与成本节省关系不大。建议从大型服务器实例迁移到许多并发的无服务器执行是毫无意义的，因为这样做相关的成本节省与实现所需的工程工作相比微不足道。对于大多数情况，担心无服务器的预测或优化意义不大，因为真正的成本不是云账单，而是应用程序的重构。简单来说：无服务器可能很便宜，但为无服务器进行重构并不便宜。因此，无服务器通常更适合全新项目，而非现有应用。\n\
  \n然而，有一个完全不同的视角可以评估无服务器：*总拥有成本*（TCO），即构建解决方案所需的工程团队成本，以及上市时间对服务成功和盈利能力的影响。请记住，无服务器允许您将大量责任委托给云提供商。DevOps\
  \ 工程师通常处理的职责（服务器管理、扩展、配置、修补等）成为 AWS、Google Cloud 或 Azure 的责任，这让开发团队可以更专注于更快地交付差异化功能。\n\
  \n太过频繁——即使在这本书中——关注点都放在基础设施本身的成本上。但软件开发中最大的成本通常是人力。请在审视无服务器论点的双方时仔细考虑这一点。人力成本（例如薪资）在您考虑从单体应用迁移到无服务器时可能会抵消任何基础设施节省。回到收益与投入的对比，您应考虑将服务重新设计为无服务器的总体成本与潜在降低成本之间的权衡。\n\
  \n但当您构建新的全新无服务器服务时，人力成本节省可能非常值得。记住，无服务器既可以加快上市时间（通过避免重建现成可用的功能），又能大幅降低持续运营需求。这些优势使您能够将资源重新导向产品构建，而非服务器维护。\n\
  \n关于无服务器的整个讨论——与所有 FinOps 相关事物一样——应以 FinOps 的目标为基础：它不是关于省钱；而是关于赚钱。在您的云账单上，无服务器对于某些应用可能最终更昂贵，或对其他应用节省大量资金。您为实现这些节省而产生的真实成本将是人力成本，但您从无服务器获得的真正收益可能是更短的上市时间。而在竞争优势方面，机会成本超过了许多实际成本。\n\
  \n## 并非所有浪费都是浪费\n\n如果您开始对拥有看起来过大资源的每个人大喊大叫，最终您的团队也会回喊。（当然，在进行 FinOps 时，您不必大喊，因为团队之间存在协作、信任和商定的流程。）成功的\
  \ FinOps 利用跨职能团队相互对话的价值。理解过度配置资源存在正当理由，可以改变您在适度配置周围使用的语言和语气。许多财务主管通过向高管提交一份过度配置资源清单，声称存在普遍且猖獗的浪费，从而与工程主管制造了紧张关系。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_264_0.png)\n\n修复低效并非总是最重要的事情。解决浪费与其它一切事情的优先级排序需要由工程领导层设定。做出这些决定的人应基于对云环境和业务优先级的扎实信息和理解。节省机会必须以允许与竞争优先事项进行同等条件下比较的方式进行传达。\n\
  \n在系统性浪费是经过有意识决定的情况下，力求有一种方法将其过滤掉（理想情况下带有一定的时间限制，以便日后重新审视），以免它们制造噪音，掩盖真正可解决的机会。排除项目审查的过程也应有监督。\n\
  \n在您获得负责该资源的团队确认之前，您无法确定不存在过度配置的正当理由。重要的是，有人花费一些时间调查资源为何过大，并要么调整其规模，要么提供该资源按此规模配置的背景。这就是为什么要将使用量减少下放到负责每个应用程序的团队。虽然中央\
  \ FinOps 团队可以帮助提供适度配置的建议和最佳实践，但最终行动必须落在应用程序或服务所有者身上。\n\n过度配置的一个正当理由是热/温灾难恢复。资源按规模配置以允许快速将生产流量转移到该资源上，满足团队服务的恢复时间目标。另一个可能适用于在故障情况下需要额外容量的服务。在正常日常运行期间，服务不需要额外的规模。然而，在故障情况下它需要它。\n\
  \n即使是完全优化的团队也可能感到惊讶。优化机会通常通过团队无法控制的外部因素出现。价格下降、性能提升、服务发布、架构变更或类似事件可能会触发优化或适度配置的需求。然而，团队几乎没有能力预见这些事件或为其计划。因此，由于外部因素导致的记分可能并不完全公平。\n\
  \n再次，FinOps 是关于团队之间的协作。在没有管理这些服务的团队的意见下调整资源规模，可能会导致服务问题以及未来的优化工作。\n\n\n\n![](img/4d4736bc293fd892d1da81802d0f9520_265_0.png)\n\
  \n除非优先考虑应用的健康状况和性能而非节省成本，工程团队往往会对资源优化配置持怀疑态度。一旦以性能为导向的资源优化配置建议可以被信任并接受，你会看到其接受度开始上升。\n\
  \n你的使用优化工作流程应允许跟踪这些原因。你可以使用工单系统来定义此工作流程——并记录沟通和调查。工单系统还允许你随时间跟踪操作，并弄清你有哪些未完成的任务及其当前状态。\n\
  \n当存在超配资源的商业理由时，它就不再被归类为浪费。一旦拥有该资源的小组为资源配置提供了有效理由，最好有一个流程来标记该已调查的资源，将节省建议从你的跟踪中移除。\n\
  \n请记住，即使只是对最终未执行或无法执行的节省机会进行调查，也可能是 FinOps 团队与产品和应用团队协作的重要机会，以了解更多关于应用环境的信息，并建立信任。\n\
  \n## 成熟的使用优化\n\n采用渐进式、增量改进策略是 FinOps 中的一个反复出现的主题，也适用于使用优化。你不应该试图一次性解决所有浪费的使用。你应该改为识别最有可能为组织节省资金的使用减少方法。而在早期阶段，这通常是空闲资源。\n\
  \n在这样做的同时，你会建立报告，向组织展示问题的规模和节省的潜力。然后你旨在优化列表上的前 10 项，并审查工程师工作效果的反馈。展示团队投入工作成果的反馈循环能够建立对流程的信任，并向组织表明持续努力是有益的。\n\
  \n从小处着手可降低对组织的风险，因为许多实现使用减少的策略都涉及更改资源和/或用于向客户提供服务的软件。减少同时进行的更改数量将降低这些更改可能严重影响业务的几率。\n\
  \n我们建议先从最低影响的建议开始，例如清理未使用的卷和 IP 地址。在非生产环境中测试资源优化配置建议，并让更广泛的组织习惯云通过其根据需求更改资源规模的能力所提供的可变使用优势。这种弹性为你的业务提供了巨大的好处，但前提是你的组织能够整合这种行为。执行块存储卷资源优化配置建议不需要停机且风险非常低，是进入资源优化配置世界的另一个绝佳切入点。记住\
  \ FinOps 原则 6，它提醒我们要*利用云的可变成本模式*。\n\n## 高级工作流程：自动退出式资源优化配置\n\n使用优化最困难的部分是让团队承担责任并执行所需的操作。仅靠建议并不会让你更高效——实施所需更改的工作流程和实践才是实现节省的地方。\n\
  \n## 云上的故事——FinOps 社区\n\n以下是财富 500 强生物技术公司如何实施其高级优化工作流程的真实案例。FinOps 团队负责领导向云计算的完整迁移（AWS\
  \ 和 Azure）以及云平台、FinOps 和本地计算服务及数据中心的全球责任。\n\n该团队每两周召开一次会议，审查各种优化任务的状态，讨论障碍及如何补救，并为未来优化制定计划，例如未来资源优化配置、RI\
  \ 购买、RI 转换等，这些计划安排在共享日历上，然后加载到其计划优化的进度跟踪器中。\n\n图 15-3 显示了按负责人分配的优化任务，并根据进度进行颜色编码。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_266_0.png)\n\n图 15-3. 优化任务的进度跟踪\n\n公司的资源优化配置流程是完全自动化的。起初，其\
  \ FinOps 团队启动与 FinOps 平台 API 链接的资源优化配置脚本。然后将建议查询到表中，并为所有非生产实例提交变更请求以供变更审查。如果变更获批，将向其应用负责人发送电子邮件，通知他们有资源优化配置节省机会。\n\
  \n已开发并在组织内广播了一个自动化工作流程（见图 15-4），让每个人对流程充满信心。如果应用负责人选择加入资源优化配置，它将在广播中指定的日期和时间自动执行。一旦该资源优化配置建议被执行，他们就会发布与之相关的成本规避。如果团队选择退出，该数据也会被查询到表中以创建他们所称的退出墙。然后他们会尝试更好地了解人们为何可能选择退出该流程。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_267_0.png)\n\n图 15-4. 自动资源优化配置工作流程\n\n\
  图 15-5 显示了应用负责人可能收到的电子邮件示例，当他们有资源优化配置候选实例时，其中包含实例信息、推荐更改和节省情况。\n\n你好，\n你的 AWS 实例已被确定为可能的资源优化配置候选。\n\
  实例 ID：i-09876543as\n名称：dev-test-01\n账户：1234-5678-9901\n当前实例类型：c5.16xlarge\n推荐实例类型：m5.xlarge\n\
  如果你不退出此更改，FinOps 团队将在 2009 年 9 月 23 日应用此资源优化配置建议。\n资源优化配置流程如下：\n- 停止实例\n  - 更改实例类型\n\
  - 启动实例\n如需退出，请访问以下链接：https://finops.internal.example.com/rightsizing/opt-out/?instanceID=i-09876543as\n\
  \n谢谢\n\n图 15-5. 自动资源优化配置的示例电子邮件通知\n\n将更改自动化到环境中是一种高级 FinOps 流程，建议用于成熟实践。至少，你应考虑跟踪你的建议并让团队手动实施所需的更改。\n\
  \n我们之前谈到过使用工单来跟踪资源优化配置建议，但它不仅仅是监控反馈。使用工单系统应能让你识别：\n- 对建议的调查数量\n- 调查中有多少最终产生节省，而有多少未采取行动\n\
  - 平均而言，你的建议在没有进展的情况下停留了多长时间\n- 有多少团队正在积极执行你推荐的更改\n- 建议反馈的类型，包括不进行资源优化配置的业务理由或技术理由\n\
  \n> 将工单驱动到团队并利用 JIRA，因为工程师就是这样进行规划的。所以如果你的优化在分配给团队 Y 的浪费工单类型 X 中，他们就必须为其规划或以惩罚的方式关闭它。\n\
  > ——Jason Fuller，HERE Technologies\n\n分配给负责所有者的工单总是效果更好。将工单分配给团队成员通常会让他们对成本浪费更有责任感。\n\
  \n> 对正在运行的资源进行一次性自动更改或调整资源规模通常不是成功的模式。在使用基础设施即代码的组织中，正确的方法是实际更改代码并重新部署环境，而不是在运行时玩打地鼠游戏，这在没有代码更新的情况下重新部署后会恢复到低效配置。\n\
  > ——Jason Rhoades，Intuit\n\n## 跟踪节省\n\n与费率优化不同，你的云账单中没有详细信息显示你通过使用优化获得的折扣或节省。除非你有一个流程能够直接将实例规模的变化归因于你的使用减少工作，否则所有这些辛苦工作的好处将难以跟踪。\n\
  \n使用优化也被称为成本规避，因为在账单上节省的唯一迹象是缺乏费用。查看账单时，你可能会注意到使用量减少，并诱使你将其总计为使用优化工作带来的节省。然而，仅因你建议团队研究调整资源规模，并不意味着他们基于该建议进行了更改。或者，你可能会看到资源使用量增加，即使团队可能正在实施你推荐的资源优化配置更改。更不用说，任何使用量的减少都可能被其他项目的新资源使用所掩盖。因此，试图在云资源中显示单独的节省变得非常困难。\n\
  \n> 我的 FinOps 团队使用“迷你商业案例”来记录他们识别的所有节省机会。这些可以是某种工单，最好是小文档，甚至是共享电子表格上的行。我们记录每个机会，无论是资源优化配置选项、闲置资源、虚拟机现代化、许可证转换等。我们记录它们并随时间跟踪，以创建一个我们推荐的机会清单，然后理想情况下跟踪哪些被执行。这是\
  \ FinOps 团队跟踪和量化其活动并在全年证明成本规避主张的关键方式。\n> ——Rob Martin，FinOps Foundation 学习总监\n\n\
  有些建议很容易跟踪其成本影响。例如，AWS r5 实例比 r3 实例便宜 45%。每天你运行 r3 而不采取行动，你就在浪费钱。然而，也有重要的技术原因可能阻止迁移到\
  \ r5 实例（例如，我们正在运行的 Amazon EMR [弹性 MapReduce] 版本的兼容性），因此除了机会价值之外，你还需要了解实施成本以及实施的技术障碍背景。\n\
  \n推荐的更改也可能有机会成本——例如需要正在从事其他项目的重要团队资源，或延迟将其他系统迁移到云。它们的后果可能使更改在财政上不可取。\n\n\n\n\n当团队从外部收到优化建议时，可能会产生防御心理。我们鼓励\
  \ FinOps 团队将这些建议作为开启对话的机会。你应该就其合理性和服务使用情况提出问题，而不是将其作为商业案例来呈现。正式的商业案例似乎能提供清晰且建设性的指导，但它会给团队带来很大压力，要求其为过去的行动和选择辩护。这可能会让人感觉你是在攻击商业案例的前提或内容，而非该机会本身。这些就是导致团队未来不愿与\
  \ FinOps 团队合作的经历类型。\n\n对于定期与各团队（或主要支出方）会面的 FinOps 团队而言，在每次会议中讨论推荐的优化措施是有效的。这样一来，它们可以在一次会议中被提出为潜在机会，团队可以调查哪些是可行/可取的，然后在当月与\
  \ FinOps 团队合作制定小型商业案例并安排活动。在后续会议中，他们可以汇报进展并报告团队的成本规避情况。这将节省（或未执行的原因）记录在 FinOps 账本和会议纪要中。它还为中央\
  \ FinOps 团队在评估承诺和折扣活动时提供信息。\n\n跟踪使用优化工作的另一种方式是查看正在做出的建议。如果你将今天实施所有建议所能带来的总潜在节省相加，然后将其与过去某个时间点本可节省的金额进行比较，就能判断组织是变得更优化还是更不优化。采用这一总潜在节省数字，并计算其相对于同一资源类型总支出的百分比，可以得出潜在节省百分比。\n\
  \n例如，假设你对服务器实例的总潜在节省建议为 $10,000。如果目前你在服务器实例上的支出为 $100,000，那么你的潜在节省率为 10%。如果将节省建议和总支出相除（使用第\
  \ 12 章中讨论的标签和账户分配策略），你就可以将一个团队与另一个团队进行比较。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_270_0.png)\n\
  \n计算潜在优化节省时，请考虑积极效果的持续时间。例如，如果你现在终止一个孤立对象，每月可节省 $1,000，你要把这 $1,000 计入多长时间？是本月剩余时间、季度还是全年？一种可能的答案是考虑“如果没有\
  \ FinOps 节约浪费计划，这件事本会持续多久”，并考虑修复时间与该时长之间的时间差。这些时间框架在不同类型的浪费和不同团队之间可能有所不同，因此没有一成不变的规则可循。\n\
  \n无论你如何决定计算节省并随时间跟踪，都要保持一致，记录你的假设并随时准备好。因为大多数 FinOps 从业者报告说，早晚 FinOps 团队的领导会来询问\
  \ FinOps 团队通过优化节省了多少钱，而且他们通常希望立即得到答案。\n\n有效的 FinOps 从业者关注潜在节省百分比最高的团队。他们协助这些团队理解建议，解释在合适的情况下如何选择退出建议，并提供有关调整资源规模影响的专业知识。\n\
  \n对优化工作进行游戏化，特别是在处于稳定状态或维护模式的团队中，可以成为行为驱动的良好因素。根据公司的文化，可能可以使用“最差违规者”名单，利用被冠以最浪费者的想法来促使团队更认真地审视建议。但负面的浪费指标，或点名违规者的指标，可能不会被很好地接受。(Total\
  \ Cost – Savings Opportunities) / Total Cost 公式是一个可以正面表述的百分比优化指标。如果你的构建是 100% 优化的，你的分数就是\
  \ 100。如果不是，则分数更低。你可以随时间跟踪累积未优化成本，但你希望同时鼓励优化工作和优化架构。\n\n影响积极行为的最佳方式之一是为每个组织提供一个节省累积图，汇总随时间采纳建议所实现的节省。由于节省可以累积，团队很快就会看到，他们越认真对待资源调整，节省图就会越累积，给他们带来每月令人印象深刻的类似冰球杆的增长轨迹。通过每月采纳\
  \ 10 条建议，到六个月结束时，他们将获得 60 条资源调整建议的累积收益。虽然最初几个月可能看起来像线性增长曲线，但随着时间的推移，节省数字会随着倍增而变得令人印象深刻。\n\
  \n## Conclusion\n\n使用优化通常比费率优化更困难，通常需要多个团队共同合作，确保正确的建议、调查和变更由正确的团队实施。通过使用优化可以实现的节省可能非常可观。\n\
  \nTo summarize:\n- 使用优化是指仅在工作负载需要运行时使用工作负载所需的资源。\n- 对浪费的可见性可以促进组织内部更精益的文化，因为团队对浪费的影响变得更加意识到。\n\
  - 使用高质量的资源调整建议，以避免任何资源调整计划停滞或引起不必要的工程阻力。\n- 以讨论和提问的方式而非强制命令的方式将优化选项带给工程团队，以便在掌握所有事实的情况下做出正确决策。\n\
  - 围绕使用优化的正式工作流程，特别是在结合自动化时，可以带来最佳结果。\n- 使用优化是降低云成本最困难的过程，应谨慎实施，采用逐步改进的方法。\n- 密切跟踪优化节省情况以展示\
  \ FinOps 工作的影响，并与团队定期协作调查机会，记住并非所有机会都可执行。\n\n使用优化可能会因根据建议而被（重新）移除的已承诺使用量导致费率优化问题。在进行费率优化时，务必将使用优化考虑在内，以避免对将会变化的使用量做出承诺。\n\
  \n现在我们已经介绍了使用优化，接下来我们将进行费率优化，通过降低你为云资源支付的费率来进一步节省成本。\n"
- '## Paying Less: Rate Optimization


  在第 5 章中，你了解到你的 *Cloud Cost = Rates × Usage*。上一章介绍了如何管理等式中的 *usage* 部分——按需使用所需大小的资源，并且仅在需要时使用。本章及接下来的两章将聚焦于该等式的另一半，并介绍如何优化费率，为你继续使用的资源支付更少的费用。


  这项工作主要由组织的集中式 FinOps 部门管理，该部门对组织的云使用情况有最高层面的视野，具备购买这些专业折扣所需的专业技能和知识，并负责管理业务各部门的云费率。


  到目前为止，你应该知道，在支付云费用时，一美元并不等于一美元。凭借多种采购选项、按不同时间和用量计费、各种付款结构和承诺选项，以及每个云提供商的独特差异，客户拥有多种采购选项，每种选项都有其独特的财务影响。本章介绍了用于管理费率的定价选项的基础知识。Reservations、Savings
  Plans (SPs)、Reserved Instances (RIs)、Committed Use Discounts (CUDs)、和 Flexible CUDs
  是调整许多服务费率的主要杠杆，但它们可能相当复杂，因此我们在第 17 章专门讨论这些内容。然后，在第 18 章中，我们将讨论你可以用来以整体方式整合所有费率优化工具的策略。


  ## Compute Pricing


  费率优化和使用优化通常都始于查看计算使用情况——我们在云中运行的 AWS EC2 实例、Google Compute Engine、Azure 虚拟机、托管容器或无服务器使用所支付的费用。这有两个关键原因。首先，对于大多数客户，compute
  costs


  是最大的单一成本类别，往往远远超过其他。其次，计算定价是云服务提供商最古老、最成熟的服务之一，并且在基于承诺获取费率折扣方面拥有最多的选择。


  根据云服务提供商和使用资源的不同，云资源可以按多种方式定价。不同的云服务提供商对类似的定价方案也使用不同的术语。首先，让我们快速看看表 16-1 中的三大主要提供商。


  表 16-1. 大三大云服务提供商预留选项比较


  |  | AWS | Google | Azure |

  |---|---|---|---|

  | 公开价格 | 按需 | 按需 | 按使用付费 |

  | 抢占式 | 抢占式 | 抢占式/可抢占 | 抢占式 VM |

  | 持续使用折扣 | N/A | 持续使用折扣 (SUDs)^a | N/A |

  | 预留 | RIs/SPs | CUDs/灵活 CUDs | 预留 VM 实例/SPs |

  | 批量折扣 | 批量折扣 | 批量折扣 | 批量折扣 |


  a SUDs 正在逐步淘汰新实例系列，因为客户更青睐 CUDs 的可预测性。


  ## 按需/按使用付费


  当你请求一个普通资源并在不做任何预先承诺（如预留）的情况下运行它时，你将按标价收取费用，即按需/按使用付费费率。这通常是你为资源支付的最高价格。它也是最灵活的，因为你可以在任何时候停止使用而不会产生罚金。


  ## 抢占式资源使用


  大多数云服务提供商都提供一种使用其云平台空闲容量运行资源的方式。使用抢占式定价，你通常会设定愿意为资源支付的最大价格，有时可能高于按需费率，但通常设定得要低得多。你将按该抢占式费率为抢占式资源付费，直到你的价格阈值被超过或没有可用的抢占式容量来满足你的请求为止，此时你将有短暂的时间停止使用资源，然后云服务提供商会收回资源。这些低费率之所以可能，是因为对本会闲置的云容量的机会性利用。


  这种定价相对于按需费率可提供显著节省（最高达 91%！），通常是运行资源最便宜的方法。然而，资源可能在任何时候丢失的风险意味着在抢占式资源上运行的服务需要能够处理资源可用性降低的情况。抢占式资源常见的用途是可恢复或重启的批处理，如果丢失资源可以重新开始。


  ## 基于承诺的折扣


  *基于承诺的折扣*是诸如预留、预留实例、节省计划、灵活 CUDs 或承诺使用折扣等费率折扣选项的一个很好的通用术语。一般来说，这些类型的折扣允许你向云服务提供商做出长期承诺，在一段时间内运行一定量的使用量（或在特定类型的云资源上花费一定金额）——例如计算、数据库、AI/ML（人工智能/机器学习）——有时在特定位置或具有特定参数。作为回报，云服务提供商会为该使用量或成本的设定金额提供正常按需费率的折扣。通常情况下，你的承诺越具体、承诺时间越长或预付费用越多，你的折扣就越大。如前所述，第
  17 章将深入详细地介绍基于承诺的折扣。


  ## 存储定价


  除了 Azure Storage 预留容量以降低存储费率外，所有主要云服务提供商都有一系列存储服务，提供不同级别的可用性、耐久性、性能和容量。一般来说，你的数据性能越好、耐久性越强、可用性越高，你支付的费用就越多。关键在于在价格、可用性和数据存储质量之间找到平衡。一般我们会将此视为使用优化，但在这种情况下，我们指的是你为不同存储层级支付的费率差异，而不是为了降低成本而减少存储量。


  ![](img/4d4736bc293fd892d1da81802d0f9520_275_0.png)


  你应根据存储数据的访问模式优化存储层级。这可以在无需减少存储量的情况下节省大量开支。每个主要云提供商都提供各种且经常不断发展的存储层级选项可供选择，具体取决于你是否频繁或不频繁地访问数据。


  考虑向客户提供服务的生产数据。这很可能需要存储在性能最强、高度可用的存储产品上。但该数据的备份可能不需要存储在同等的高成本产品上。随着备份的变老，它们不太可能在紧急情况下被需要，因此数据可以存储在性能最低、可用性低但仍具耐久性的存储层中。当你像这样移动数据时，就称为*数据生命周期管理。*


  一些云服务提供商的存储产品可以为你管理数据的生命周期。在 AWS 的 S3 中，数据可以根据规则迁移到可用性较低的存储层。例如，1 个月后，S3 可以将数据移动到可用性较低的存储，12
  个月后，它可以移动到一个非常便宜的“冷”存储产品 Glacier，该产品检索数据可能需要数小时。


  你对数据分类并将其定位到不同服务产品中投入的精力越多，数据存储成本节省就越多。利用云服务的内置功能自动执行数据生命周期可以降低管理开销。当然，非常重要的是，你的数据必须存储在正确的服务产品中，具有你所需的可用性和耐久性。


  ## 批量/分层折扣


  大多数云服务提供商针对其某些服务的内置定价计划会在使用量增加时降低成本。当你有大量使用量时，这些自动价格降低可以累积成可观的节省。一般来说，这些批量折扣要么基于使用量，要么基于时间。


  ![](img/4d4736bc293fd892d1da81802d0f9520_276_0.png)


  批量折扣可能在区域级别应用，这意味着跨区域的使用量不会合并以获得折扣。考虑将云资源整合到更少数量的区域，以充分利用批量折扣。


  批量折扣奖励大型云用户，确保在云服务提供商平台上增长对大型企业仍然有意义。为了在云平台上正确计算预计成本，你需要确定你获得的是哪种类型的批量折扣。在计算减少使用量带来的节省时，你必须了解适用于被减少使用量的定价层级。使用正确的定价层级的费率可以让你正确计算成本（和可能的节省）。


  请记住，批量折扣通常适用于超过指定使用量的使用量；它们通常不会改变低于折扣层级的使用量所支付的费率。


  ## 基于使用量


  当折扣基于总使用量而不是资源运行的时间长度时，我们称之为基于使用量的批量折扣。单小时内的使用量合并，然后对超过层级阈值的部分使用量应用费率折扣。


  当你查看图 16-1，即基于使用量的批量折扣的实际应用时，定价层级在 y 轴（使用量）上运行。当使用量超过第 2 层阈值（在任何设定小时内）时，所有超出该阈值的用量都将按第
  2 层定价收费。使用折扣每小时使用相同的计算方法应用。


  ![](img/4d4736bc293fd892d1da81802d0f9520_277_0.png)


  图 16-1. 基于使用量的批量折扣图


  免费层级是一种特殊的批量折扣，适用于少量云使用量。云服务提供商在其许多服务上提供这些免费层级，以使客户能够以较低成本尝试服务。一些免费层级优惠仅在短时间内可用，而其他则持续可用。对于拥有大型云环境的组织，免费层级产生的节省通常微不足道。


  ## 基于时间


  当资源在运行特定时间后按较低费率收费时，我们称之为基于时间的批量折扣。这种折扣类型的良好示例是 Google Cloud 持续使用折扣（SUD），其中计算使用量运行时间越长，收费费率越低。然而，值得注意的是，Google
  Cloud SUDs 正在逐步淘汰。一些基于时间的折扣适用于特定资源，一旦资源被移除就停止适用，而其他则匹配资源使用类型，可随时间应用于多个资源。请注意，基于时间的批量折扣不会与其他同时运行的资源合并。例如，同时运行
  100 个资源并不等同于一个资源运行 100 小时。


  在图 16-2 中，你可以可视化基于时间的批量折扣的工作方式。在第一个小时，使用了 10 个资源，因此启动了 10 个单独的批量折扣计数器。假设成本在前五小时的使用按第
  1 层定价收费，之后按第 2 层定价收费。与基于使用量的情况相比，重要的变化是批量折扣适用于 x 轴（时间），所以即使


  虽然你在第一个小时内有 10 个资源，但它们都按 Tier 1 价格计费。随着每个小时的推移，10 个计时器会根据资源使用量的多少而启动和停止。


  ![](img/4d4736bc293fd892d1da81802d0f9520_278_0.png)


  图 16-2. 基于时间的用量折扣图


  对于全天运行的资源 1 ——在图中五小时后你将获得 Tier 2 价格。然而对于资源 6 ——由于它会随时间停止和启动 ——在图中需要八小时才能达到 Tier
  2 定价。


  ## 谈判费率


  在某些情况下，你可能能够与云服务提供商、云转售商或市场供应商谈判以获得更优惠的价格。


  ## 自定义定价


  对于某些服务的较大用量级别，云厂商发布的定价页面建议你致电他们。在这些最高用量层级，云服务提供商可能愿意提供比公开提供的更好的价格。我们无法详细介绍这些交易，因为它们通常受保密协议约束。


  ![](img/4d4736bc293fd892d1da81802d0f9520_278_1.png)


  当你已超出已发布的用量折扣层级时，务必尽早与你的云提供商开始对话，以确定是否存在更深折扣的机会，无论是在整个云账单、某个区域还是服务级别。


  ## 卖方私有优惠


  当你在云中使用第三方软件时，必须签订许可协议，并且许可付款通常直接支付给该第三方。然后将许可应用于云服务器以运行软件。这导致你从云服务提供商处获得一笔用于运行软件资源的账单，以及从软件供应商处获得一笔单独的许可账单。随着
  AWS、Google Cloud 和 Azure 市场等服务的创建，第三方厂商现在可以通过这些渠道提供其软件。许可费和资源费直接在客户的云提供商账单上支付，而云提供商随后将许可费支付给第三方厂商。


  虽然市场减少了计算运行服务总成本的工作量，但你现在需按固定的公开费率支付许可成本。当你直接与第三方厂商组织许可时，你能够为组织谈判更优惠的费率。幸运的是，一些服务，例如
  AWS Marketplace，现在允许厂商拥有卖方私有优惠。客户与第三方谈判许可费率，并通过私有链接为该客户专门创建自定义市场列表。当组织直接从市场使用这些服务时，他们为许可支付自定义费率，并保持直接来自云提供商的单一计费来源便利。


  ## BYOL 考量


  一些云服务提供商允许你使用组织内可能已有的现有许可协议来降低云成本，这被称为 BYOL（“自带许可”）模式。一个例子是适用于 Windows Server 的
  Azure Hybrid Benefit。拥有现有 Software Assurance 或订阅许可（例如企业协议订阅 [EAS]）、Server Cloud
  Enrollment（SCE）订阅或 Windows Server 许可上的 Open Value Subscription 的组织，能够在将服务器部署到 Azure
  平台时重用许可。


  识别重用现有许可的机会 ——尤其是在从数据中心迁移到云时 ——可避免不必要的许可成本，从而为组织节省大量资金。


  将为非云购买的自有/永久许可或许可权用于云的用例极其复杂，并且通常受不断变化的规则和要求约束。如果你的组织使用大量许可软件或与打算在云中使用的其他软件厂商签订大量协议，我们强烈建议考虑
  BYOL 的影响，并让具有采购或软件资产管理视角的专业人士参与，以就如何最有效地在权限范围内使用这些权利提供建议。


  ## 结论


  通过改变服务性能、可用性和耐久性，云服务提供商能够以不同的费率提供类似的服务。有效的 FinOps 团队将此功能集中化，并让工程师专注于使用最适合其工作负载特征的服务产品。将使用优化和费率优化结合使用可以产生显著的节省。


  总结如下：


  - 费率优化是关于以更低的费率支付相同的资源。

  - 计算定价可以通过使用 Spot、随着时间的推移承诺使用量、达到用量折扣级别、谈判折扣或应用你已拥有的许可来降低。

  - 存储定价可以通过选择满足你需求的适当服务层级来降低。

  - 对于大量使用，你能够谈判更优惠的费率，无论是直接与云服务提供商还是与第三方软件许可厂商。


  重要的是要认识到，有多种方法可以降低你为相同的云资源支付的费率。接下来，我们将介绍最受欢迎的，也是 arguably 最复杂的费率降低机制：使用预留实例、节省计划、承诺使用折扣和灵活承诺使用折扣。

  '
- '## 理解基于承诺的折扣


  基于承诺的折扣是 FinOps 协作、数据驱动决策的完美示例。它们弥合了技术团队与财务团队之间的差距，需要难以实现的协调。然而，一旦达成协调，基于承诺的折扣可以带来显著的成本效率优势，表现为改进的云单位经济效益，让你以大幅折扣获得相同的计算能力。


  ![](img/4d4736bc293fd892d1da81802d0f9520_281_0.png)


  本章是最有可能过时的章节之一 ——可能在本书上市之前就会过时 ——因为云提供商的服务总是在更新。我们建议将本章中的细节与你的云服务提供商当前提供的服务进行核对。尽管如此也不必担心：虽然多年来服务发生了很多变化，但围绕预留的核心最佳实践保持一致。


  ## 基于承诺的折扣简介


  预留实例（RIs）、节省计划（SPs）、承诺使用折扣（CUDs）和灵活承诺使用折扣（Flexible CUDs），统称为基于承诺的折扣，是云服务提供商提供的最受欢迎和最重要的成本优化。这是因为基于承诺的折扣代表你在云中可以获得的最大百分比折扣，并且通常适用于账单中最大的云支出领域。


  ![](img/4d4736bc293fd892d1da81802d0f9520_282_0.png)


  本章主要关注计算服务的基于承诺的折扣。其他云服务，包括数据库和 AI/ML，也有折扣优惠。计算成本通常是大多数组织支出的最大领域。对于这些其他折扣优惠，这里有些概念可以应用，但你应查阅云服务提供商的文档。


  每个云服务提供商都有不同的优惠，其折扣提供有各自特定的规则。而且每个组织都可以根据其独特组织的实施模式和业务流程，以不同的方式利用各种基于承诺的折扣。


  基于承诺的折扣很棒。你承诺在一定时间内使用特定类型的资源，并获得可观的折扣。想法似乎很简单。但正如你将看到的，存在许多细微差别需要学习。


  几年前，在 AWS、Cloudability 和 Adobe 关于 RI 威力的网络研讨会上，Adobe 展示了图 17-1，表明该公司仅通过购买 RI 就将
  EC2 支出削减了 60%。


  ![](img/4d4736bc293fd892d1da81802d0f9520_282_1.png)


  图 17-1. 预留对云支出的影响


  通过将约 10% 的资金从按需费率支付转移到支付折扣预留费率，Adobe 能够提高其整体预留覆盖率，并实现其计算资源总体成本大幅下降 60%。像 Adobe 这样的成功案例使得利用预留/承诺的决定变得显而易见。然而，对于许多组织而言，从零
  RI 覆盖到良好覆盖的过程需要大量的组织教育和协调。




  ## Stories from the Cloud—J.R.


  我曾与一家英国富时100指数零售商合作，该公司每月在AWS上的云支出达数百万英镑，但RI为零。他们知道即使购买少量RI也能节省大量资金。事实上，与其团队密切合作分析公司基础设施后，我发现他们在未来三年中可以节省数百万英镑。由于他们是零售商，利润率很薄，RI的购买可以帮助他们实现领导层要求的关键成本削减目标。


  然而，尽管如此，他们仍花了整整九个月才购买第一批RI。发生了什么？为什么组织在激进的自上而下成本削减目标下，仍如此缓慢地采用这种显而易见的成本节约措施？答案是他们必须对组织中的许多利益相关者进行教育并使其达成一致，围绕购买RI的含义展开，并在过程中消除多年数据中心硬件采购期间形成的许多误解。


  首先，他们必须让财务团队接受如何对RI进行财务核算。RI的预付款可能看起来像是资本支出（CapEx），财务部门应将其作为实物资产进行折旧，因为其预付款。然而，RI是运营支出（OpEx）的无形预付款，需要在其使用期间进行摊销。


  接下来，他们必须让技术团队对承诺现有基础设施感到安心。云的优势在于你能够只使用所需资源，并根据工作负载的形状调整基础设施。然后你引入无服务器或容器化等新方法，以及在新的一套云服务上完全重构基础设施的承诺（或威胁）。改变基础设施的风险使团队不愿对其当前技术栈做出为期一年或三年的预留承诺。这些团队因其出于改善基础设施的
  admirable 计划而拖延，导致预留购买多次延迟。


  这类故事令人遗憾地很常见。随着公司实施首批预留，让所有团队达成一致可能需要很长时间，而节省机会的损失可能累积到数百万英镑。如果该零售商在那九个月的教育业务期间购买了一些RI，他们本可以实现显著节省——并避免数百万英镑不必要的按需支出。


  ## Commitment-Based Discount Basics


  虽然各云服务提供商的具体产品不同，但三大厂商都为你提供了在设定期间内承诺特定资源使用量的简单能力。你的承诺确保了云服务提供商的持续业务，作为回报，他们会以更低的费率奖励你的使用量（费率优化）。折扣可能相当可观——在某些情况下高达80%。


  在所有三大主要云提供商中，你实际上并没有预留特定的服务器实例或承诺特定的资源。请记住，你已经抛弃了数据中心命名服务器的概念。折扣由云服务提供商在计费时应用。事实上，预留本质上是一种计费构造。某些AWS
  RI可以在计费折扣之外提供一些容量预留功能——事实上，AWS Reserved Instances最初只提供容量预留，而非折扣。


  基于承诺的折扣最常以非确定性的方式应用于单个资源。以AWS SP和Azure SP为例，它们会应用于节省最大的地方，但你无法选择具体应用于哪些资源。Google
  Cloud允许你选择如何归属折扣积分和费用。他们提供三个选项：Unattributed、Proportional Attribution、或Prioritized
  Attributions。选择合适的归属模型取决于你的组织是以集中还是分散的方式购买和管理CUD。


  云服务提供商根据一套宽松的规则应用这些折扣，其去向的原因和位置细节相当不透明。除了在SP的情况下基于最高节省潜力进行优先排序外，提供商会将预留随机分配给购买该预留的账户、订阅或项目中的资源，然后任何剩余覆盖范围将流向其他账户、订阅或项目中的符合条件的资源（除非你告诉他们不要这样做）。随机应用折扣会带来许多策略和分摊考虑，我们将在第18章中讨论。对于提供资源级计费数据的云服务提供商，你可能看不到折扣直接应用于你的资源，或者至少不是你期望的资源。


  这里一个类比可能有助于你更好地理解预留/承诺。假设某家特定餐厅推出一项优惠，你购买一本优惠券册。每张优惠券可在该特定餐厅兑换一顿餐。册子包含一个月每天一张的优惠券。当你在指定餐厅用餐时，你用优惠券支付餐费。选择去别处用餐意味着你放弃当天的优惠券，并在另一家店以全价支付餐费。


  假设这本书的价格为$750，包含30张餐券，每张餐券可兑换一顿如果不使用优惠券需花费$50的餐食。算下来，那就是$25 per coupon for a $50
  meal，saving you $25 a day。如果你每天都在这家餐厅用餐，你节省50%，如果你只在其中一半天数用餐，你就没有任何节省。如果你使用超过一半的优惠券，购买这本书更划算。


  如果你将这个想法应用于RI，一旦你决定了想要预留的时间长度，你就可以从云服务提供商处购买预留（优惠券册），匹配特定资源类型和区域（特定地点的特定餐厅餐食）。此预留将允许你每小时（或每秒或毫秒）运行匹配的资源。如果你没有运行任何与预留匹配的资源，你将失去节省的机会。只要你在预留期限内有足够的资源使用量，你就能从折扣中受益——并节省资金。


  这里的关键要点是：

  - 你需要为基于承诺的折扣付费，无论它是否应用于资源。

  - 预留需要花费金钱，但它们抵消了账户中资源的成本。

  - 你不需要完全利用基于承诺的折扣就能节省资金。


  基于承诺的折扣的具体购买选项以及它们可应用于哪些资源因云服务提供商而异。某些产品适用于非常特定的使用；其他产品适用范围广泛。


  在整个基于承诺的折扣范围内，你可以选择许多选项：

  - An amount of *usage hours* (Reservations, CUDs) or *hourly spend* (SPs/Flexible
  CUDs)

  - Any of a variety of *compute* resources running anywhere

  - A specific type of *compute* or one of a list of other resources

  - With the right to convert to a different type of reservation or not

  - Running in a particular region or location

  - In a specific operating model (dedicated or shared)

  - Of a specific size (or of a flexible size—instance size flexibility)

  - Running a specific operating system or database type

  - In a very specific availability zone

  - For one or three years (or even five years, for some services)


  一般来说，你的承诺越具体，折扣就越高。换句话说，如果你愿意放弃灵活性，就能实现更高的节省。随着时间的推移，云服务提供商引入了多层次的灵活性，我们在这里总体介绍，并在各提供商的章节中更详细地介绍。


  ## Compute Instance Size Flexibility


  云服务提供商提供数百种不同的服务器实例类型或大小，通常按系列分组，你可以根据虚拟机（VM）或实例的名称区分出来。




  各提供商实例类型的示例：


  - *AWS 实例 m5.xlarge*：一个“m”系列实例，大小为“xlarge”，属于“第5代”

  - *Azure 实例 standard_D2_v5*：一个“D”系列 VM，大小为“2”，属于“第5代”

  - *Google Cloud 实例 n2-standard-128*：一个“N2”系列实例，大小为“standard”，配备“128 CPUs”


  许多基于承诺的折扣都是为了匹配特定资源类型的用量参数而购买的。这意味着你可能需要做出数百项具体的承诺来覆盖你使用的各种实例大小，即使你广泛使用同一系列的实例。为了简化这一过程，云服务提供商在其部分预留上提供实例大小灵活性（ISF）。


  在特定系列内，你可以从一系列服务器实例大小中选择（vCPU 和内存量不同），大小每增加一级，价格就成比例地更贵。例如，在 AWS 上，两个匹配的大型实例的价格与一个同类型超大实例相同（例如，两个
  m5.large 实例的费用与一个 m5.xlarge 实例相同）。因此，两个购买的大型 RI 可以将其折扣应用于一个超大服务器实例，反之亦然。


  这里唯一的例外在于软件许可费用：如果涉及软件许可费用，两个中等实例并不等同于一个大型实例。两个中等实例需要比一个大型实例多两倍的许可。因此，AWS 将 ISF
  从带有许可软件的服务器中排除，而 Azure 在预留中会单独收取软件许可费用（仅对计算小时应用折扣）。请注意，当你将预留与 Azure Hybrid Benefit
  搭配使用时，软件许可费用也会被抵消为零。


  由于 Google Cloud 的计费方式，他们自然通过将同一机器系列内所有实例的 vCPU 和内存计数合并来实现 ISF。CUD 应用于合并后的总计，而不是针对单个独立实例。


  ISF 对希望使用特定系列的计算或数据库服务但又希望随着工作负载需求变化而灵活调整所启动实例大小的工程团队非常有帮助。ISF 为这些团队提供了更大的灵活性，并大幅减轻了
  FinOps 团队的工作量，因为无需采取任何操作即可将覆盖范围转移到不同的实例大小——这一过程是自动完成的。


  ## 转换和取消


  一些基于承诺的折扣计划提供转换承诺或将其交换为其他类型的能力。AWS 可转换预留提供的折扣率低于不可交换的预留，但允许用户选择将预留交换为不同系列或不同大小（如果
  ISF 不适用）。转换预留的能力降低了最终获得与资源使用不匹配的预留的风险。如果资源更新后不再匹配，你可以将其交换为匹配的预留。交换或转换预留的能力通常仅限于最初购买的区域。


  请记住，将 RI 从一种类型转换为另一种类型需要 FinOps 团队进行分析和工作，因此在考虑你的选择时，请将此成本纳入整体考量。


  需要在此指出的是，截至本文撰写时，AWS SP 提供的折扣与 AWS RI 相同，但内置了可转换性。例如，计算 SP 可覆盖多个区域和任何系列的计算实例，无需任何分析和转换即可修改，折扣与在一个区域、一种系列类型的可转换
  RI 相同。SP 在 AWS 部分进一步讨论。


  Azure 不提供可转换的 RI，但允许用户每年取消并交换一定金额的预留。有时这会产生费用，通常还要求新预留从交换时间重新开始计时。Azure SP 现已作为预留的替代方案提供，其功能与
  AWS SP 类似，比 Azure RI 提供更大的灵活性。


  Google Cloud 提供拆分或合并承诺的能力。拆分允许你跨项目或组织重新分配资源。合并承诺使以单一实体和一个到期日期管理折扣变得更容易。Google Cloud
  现在还提供 Flexible CUDs，带来与 AWS 或 Azure 的 SP 类似的灵活性。


  通常，你进行的转换必须在价值和持续时间上相等或更大。因此，如果你降低了对云服务提供商的使用量，就不能交换预留，如果这样做会导致整体承诺降低。


  AWS 用户的另一个选择是能够在二级市场上出售剩余时间较长的某些类型预留。通常，这只能针对剩余寿命超过一半的标准或不可转换 RI 进行。



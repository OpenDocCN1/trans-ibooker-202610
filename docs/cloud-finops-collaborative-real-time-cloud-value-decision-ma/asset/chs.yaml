  ## AWS 节省计划


  2019 年底，Amazon Web Services 宣布了 Savings Plans，最初提供对 EC2 实例、Lambda 和 Fargate（Amazon
  专有容器服务的托管服务）的折扣。自首次发布以来，AWS 已增加一项额外的 SP 优惠，适用于 AWS 机器学习服务 SageMaker。机器学习 SP 的增加推动了
  AWS 客户对 AWS 发布更多 SP 以覆盖其他服务（如数据库和存储）的需求。基于此客户需求，我们预计在本书出版后会宣布更多优惠。您在此处关于 RI 学到的很多内容同样适用于
  SP。AWS 继续提供全额预付、部分预付和无预付付款以及一和三年期限的购买选项。


  然而，SP 与 RI 之间最大的区别在于，虽然 RI 承诺针对的是资源单位（特定大小的 EC2 实例数量），SP 承诺是货币性的（客户承诺在折扣计算或其他涵盖服务上花费的金额）。


  SP 提供三种计划类型：


  ### 计算 SP


  广泛适用于 EC2、Lambda 和 Fargate 计算，提供与 CRIs 相当的节省。此计划类型比 CRI 应用范围更广——包括任何区域的计算资源——这将降低维护高计划利用率所需的工作量。这些通常与
  CRIs 相同的节省率。


  ### EC2 实例 SP


  适用于单个区域中单个系列的 EC2 使用，无论大小或其他配置。虽然此计划类型比计算 SP 更受限制，但它提供更高的折扣，比 SRI 限制更少，同时提供与 SRI
  相同的折扣。


  ### 机器学习 SP


  坚持 SP 的每小时成本模式，SageMaker 的机器学习 SP 使 AWS 客户能够承诺在 SageMaker 上花费，以换取 SageMaker 组件成本的降低费率，包括那些在以下方面的成本：

  - Studio 和按需笔记本

  - 处理

  - Data Wrangler

  - 训练

  - 实时推理

  - 批量转换


  SP 将自动应用于任何 AWS 区域和实例计算系列中的 SageMaker 使用。


  然而，RI 与 SP 之间存在一些主要区别：

  - 与 RI 相比，折扣 EC2 实例的两种 SP 类型在应用折扣的计算方面提供更大的灵活性，无需考虑租用、操作系统、实例系列或实例大小。最重要的是，计算 SP
  跨所有区域应用，这将显著提高可覆盖的使用量。

  - 使用 RI，您购买与账户中实例匹配的预留数量。SP 以承诺的每小时支出购买。您承诺的支出金额为折扣后金额。例如，如果您运行每小时 100 美元的按需 EC2，而
  SP 提供 50% 折扣，您需要购买每小时 50 美元的 SP。

  - 与 RI 不同，SP 对 AWS Fargate 和 Lambda 使用提供折扣。这是 AWS 首个跨多个服务提供折扣的优惠。由于这些其他服务的折扣率差异很大，这也会影响您从
  SP 获得的整体收益，下一章将更详细讨论。

  - AWS SageMaker 没有等效的 RI 优惠。


  AWS 将 SP 覆盖应用于为您提供最大折扣的资源，这很好，因为并非所有类型的计算或实例的折扣金额相同。这也意味着，随着覆盖范围的增加，您获得的折扣百分比的增幅会变小。


  ## 节省捆绑包


  2021 年初，AWS 引入了一个名为 CloudFront Security Savings Bundle 的新概念。这是一种新型基于承诺的折扣，涵盖 CloudFront（AWS
  的内容分发服务）的使用，并允许客户承诺在该服务上的每小时支出水平，以换取 CloudFront 服务 30% 的折扣以及用于 WAF（AWS 的 Web 应用程序防火墙服务）的积分。客户承诺折扣后的支出水平，因此这与
  SP 非常相似，但免费 WAF 使用的捆绑使其成为一种不同类型的优惠，从而导致折扣有新的营销名称。


  可能还有其他经常一起使用的服务，未来可能会获得类似的节省捆绑包。再次强调，AWS 的所有这些基于承诺的折扣仅是计费结构，因此它们使 AWS 能够以一种认可这些使用模式并奖励能够有效预测并承诺长期使用的客户的方式，通过折扣奖励常规承诺使用。




  这是一个很好的理由，让你提升预测能力，并让工程团队参与提供其未来计划，以便 FinOps 团队能够在不过度采购的情况下获得最佳的费率优化覆盖范围。


  ## Microsoft Azure


  Azure 同时提供预留和 SP 方案。


  ## Azure 预留


  Azure 的预留选项在很大程度上遵循了 AWS 提供的基于承诺的折扣模式，但提供了额外的灵活性和可转换性或取消选项。


  截至 2022 年底，Azure 预留适用于 27 种不同的服务和资源类型，覆盖范围非常广泛。服务包括 VMs；blob、磁盘和文件存储；数据库，如 SQL 和
  Cosmos DB；分析服务，如 Azure Synapse Data Explorer；Azure App Service；Azure VMWare；Red
  Hat 和 SUSE Linux；等等。列表不断增长，因此请参阅 Azure 预留文档以获取最新列表。


  ![](img/4d4736bc293fd892d1da81802d0f9520_299_0.png)


  一些服务，如 Azure Databricks，与其他预留相比使用预留容量略有不同。对于 Azure Databricks，你预留一定数量的 Databricks
  单位（DBU），然后在整个期限内消耗。你不受严格的按小时承诺限制。


  Azure 预留是为覆盖特定 Azure 区域（适用时）、SKU 或大小以及期限（一年、三年或五年）的使用而购买的。与某些 AWS 产品相比，Azure VM
  预留对操作系统和可用区的要求没有那么具体。


  Azure RI 可以在工作负载或应用程序需要更改时在任何区域和任何系列之间交换。请注意，计算预留在 2024 年 1 月之后将无法交换。如果需要交换计算预留的选项，请从节省计划开始。非计算预留将继续支持交换。根据剩余小时数提供按比例退款，可用于交换中作为新
  RI 的部分。


  Azure RI 交换目标的价值必须等于或大于源 RI。没有“top-up”的概念，但如果新预留的价值更大，则需要超出抵免金额的额外投资。此外，“exchange”也可以简单地是全额取消
  RI 购买并支付费用。


  目前，如果购买的容量不再需要，可以取消 Azure 预留以获得调整后的退款。细则确实说明取消需支付 12% 的提前终止费，且取消费用每年最高为 50,000 美元。


  ![](img/4d4736bc293fd892d1da81802d0f9520_300_0.png)


  > 已宣布，2024 年 1 月之后将不再提供计算服务 Azure 预留的交换和退款；更灵活的 Azure SP 的引入有助于抵消这一变化。


  存在容量优先权，但没有保证。这意味着当资源请求不足以满足资源请求时，有预留的用户将优先获得容量。然而，由于没有保证，如果 Azure 该特定资源类型无容量，请求仍可能被拒绝。


  Azure RI 可以在企业协议计费账户（注册）、Microsoft 客户协议计费配置文件、管理组、订阅或资源组级别分配，因此你可以在组织、部门或应用程序级别管理
  RI 使用情况。与其他云提供商产品相比，这让你对如何应用 RI 以及谁受益拥有更多控制权。如果目标是在整个组织中节省资金，则 RI 可以简单地分配到计费账户或计费配置文件级别。


  如果某个业务部门只想为其自身使用购买预留，RI 可以分配给管理组、订阅或资源组，只有该组可以利用节省。这一功能的缺点是，未使用的 RI 不会供订阅外的机器使用，这可能导致比
  AWS 更大的浪费，在 AWS 中，如果购买账户未使用，RI 会自动级联到其他成员账户。购买后，可以根据需要更改在注册或订阅级别对 RI 的指定。


  Azure VM 预留仅覆盖计算成本，不包括软件许可费。由于按需（非预留）使用涵盖计算小时和软件许可费，预留使用在适用时会产生单独的软件许可费额外记录。请注意，通过使用
  Azure Hybrid Benefit 根据运行的核心数量将本地许可证分配给 VM 或 SQL 实例，Windows Server、Red Hat Linux、SUSE
  Linux 和 SQL Server 许可费也可以获得额外节省。


  Azure RI 适用于除 A 系列、A_v2 系列或 G 系列之外的所有 VM 系列，但在 VM 系列的所有区域中均不提供。请检查 Microsoft 的文档以验证你希望购买的
  RI 是否适用于你的 VM。


  Azure 预留可以采用预付或按月付款方式购买。预付付款选项的工作方式类似于 AWS 的 All upfront 选项，在开始时一次性支付整个期限的费用。按月付款在每月同一天处理，类似于
  AWS 的 No upfront 选项；然而，与 AWS 不同的是，预付与否折扣百分比没有差异。


  ## 实例大小灵活性


  Azure ISF 的工作方式几乎与 AWS 完全相同：只需将 Azure VM 的“size groups”替换为“instance families”，将“ratio
  unit”替换为“normalized unit”。


  同一大小系列组内的实例无论预留大小如何都可以应用预留。较小的预留大小可以对较大的实例应用部分折扣，而较大的预留可以折扣多个较小的实例。每个大小系列组都有每个特定大小实例的比率表。同样，它的工作方式与
  AWS 的标准化单位完全相同。使用这些比率单位，你可以确定需要多少单位来覆盖你的 VM 实例。


  让我们看一个示例来帮助澄清其工作原理（见表 17-3）。


  表 17-3. DSv3 系列实例的比率表


  | 大小 | 比率单位 | 大小 | 比率单位 |

  |---|---|---|---|

  | Standard_D2s_v3 | 1 | Standard_D16s_v3 | 8 |

  | Standard_D4s_v3 | 2 | Standard_D32s_v3 | 16 |

  | Standard_D8s_v3 | 4 | Standard_D64s_v3 | 32 |


  现在，如果你查看此特定大小系列在一段时间内 VM 实例的使用情况，你可以确定在此期间使用了多少比率单位（见图 17-5）。


  ![](img/4d4736bc293fd892d1da81802d0f9520_302_0.png)


  图 17-5. 具有大小灵活性的 Azure 实例大小转换为标准化大小


  从图 17-5 可以看出，你 100% 的时间都在使用 29 个比率单位的 VM 实例，并且基于此单位计数，你可以确定需要进行多少次预留。


  ## Azure 节省计划


  Azure SP 以一段时间内的使用小时折扣形式运作。你通过在一年或三年期限内承诺计算服务的固定每小时成本来节省资金。Azure 宣传的节省幅度最高可达按需付费价格的
  65%。折扣根据承诺期限（一或三年）而变化，而不是每小时支出承诺金额。


  Azure SP 对你每小时支出的影响取决于该小时内的支出金额以及你所做的承诺。图 17-6 位于 Azure SP 文档页面上，演示了计划在特定情况下如何应用：


  ### 小时 1


  使用量与节省计划金额完全匹配，从而使所有使用量都获得折扣价。


  ### 小时 2


  使用量低于承诺金额，未使用的节省计划将在折扣使用量之上收取。意味着你支付承诺的每小时费率。


  ### 小时 3


  使用量超过承诺金额。最高承诺金额的使用量享受折扣，超过承诺金额的使用量按按需付费价格收取。


  ![](img/4d4736bc293fd892d1da81802d0f9520_303_0.png)


  图 17-6. 显示欠用和超用小时的 SP（来源：Azure 文档）




  每小时，您的计算使用量在达到承诺额度之前都会享受折扣；超出部分的使用按即用即付费率计价。


  ![](img/4d4736bc293fd892d1da81802d0f9520_304_0.png)


  SP 承诺对 Microsoft Customer Agreement 和 Microsoft Partner Agreement 客户以美元计价，对 Enterprise
  Agreement 客户以当地货币计价。


  可以用一个或多个活跃预留来兑换新的 SP。当您为 SP 执行预留兑换时，预留将被取消，未使用预留权益的按比例计算的剩余价值将转换为 SP 的等效小时承诺。SP
  的价值不能低于剩余价值；不过，您可以增加其价值以满足需求。


  购买 SP 后，折扣会自动应用于匹配的资源。与预留一样，SP 提供账单折扣，不会影响资源的运行状态。


  您可以预付或按月支付 SP。无论是预付还是按月支付，SP 的成本相同；选择按月支付时不会收取额外费用。


  Azure SP 涵盖来自计算服务的使用，例如 VM、专用主机、容器实例、Azure Premium Functions 和 Azure App Services。


  ## Google Cloud

  Google Cloud 提供 Committed Use Discounts（CUDs），这是一种 Google Cloud 计费机制，以承诺使用量换取深度折扣，以及
  Flexible CUDs，我们将在本章后面讨论。


  ## Google Committed Use Discounts

  根据 Google Cloud 的说法，CUDs 提供一年或三年期限的合约，对于大多数（包括自定义）机器类型可享受高达 57% 的折扣，对于内存优化型机器可享受高达
  70% 的折扣。


  CUDs 在购买和消费方式上提供多种灵活性。首先，CUDs 不限于账户中任何特定的计算实例或形状，而是应用于整个月内特定区域中特定资源类型的总体合格累计使用量。CUDs
  可应用于不同 VM 形状、操作系统和租用类型之间的累计资源。此外，一种名为 Flexible CUDs 的新服务甚至允许承诺跨多个 VM 系列和区域延伸。CUDs
  也适用于区域内所有区域中的资源，这允许灵活的跨区域部署模型，同时利用 CUDs 提供的节省。承诺针对特定区域和特定项目。如果您在账户中启用 CUD 共享，它们也可以在计费账户中的项目之间共享。回顾第
  12 章，项目将所有 Google Cloud 资源组织成逻辑分组。与其他提供商不同，区域内的区域分配不是一个因素。


  ## Paying for Cores, Not Hours, in Google

  这可能看起来显而易见，但 Google Cloud 不按 VM 实例小时计费这一事实与其他云厂商相比是一个显著差异，并且有许多影响。Google 中的 VM 产品称为
  Google Compute Engine（GCE），其 SKU 针对 CPU 核心、RAM 和本地磁盘进行单独定价。这无疑源于您可以创建完全自定义的机器，CPU
  核心与内存的比例完全由您决定。以下是一些影响：


  - 当 Google 在账单数据中公开资源级信息时，您应预期实例每小时对应不同部分会有多行记录。这将提供汇总到实例级成本的能力。

  - 购买 CUDs 时，您 specifically 对 CPU 核心或内存（但不包括本地存储）做出承诺。由于购买是按您选择的比例（在一定范围内）进行的，很有可能无法覆盖相同数量的基础实例。例如，可能覆盖五个实例的
  CPU 核心，但仅覆盖四个实例的内存。因此，CUD 规划应针对核心与内存分别独立进行。


  这种明确的划分使容器资源和成本分配变得更简单，因为底层组件已经拆分。相比之下，当底层成本是 VM 实例（如 AWS 的情况）时，则需要特殊的计算来拆分成本。


  ## Google Billing and Sharing CUDs

  让我们看看 CUD 计费和应用如何在 Google 的组织、文件夹和项目概念中工作。图 17-7 显示了层级结构。


  这与 AWS 的管理账户结构概念相似。一旦您在账户上启用了 CUD 共享，计费账户就可以在所有连接的项目之间共享 CUD。这意味着 CUDs 既提供应用于各种机器类型的灵活性，也提供应用于多个项目的灵活性。


  ![](img/4d4736bc293fd892d1da81802d0f9520_306_0.png)


  图 17-7. Google 项目和文件夹层级结构


  与 AWS 不同，AWS 中 RIs 会自动在多个关联账户之间共享，而 CUDs 只有在您为计费账户启用该功能后才会共享。这让您可以选择对账户最重要的内容：更清晰的成本分摊或最大程度减少浪费。如果您想从特定项目分配资金来做出承诺，关闭
  CUD 共享将提供比 AWS 处理 RIs 方式更清晰的成本分摊选项。然而，打开 CUD 共享可能会减少浪费，因为未使用的承诺将在多个项目之间共享。


  CUDs 让您可以选择最适合您组织的共享模型。对于拥有大量项目的组织，打开共享功能可以让您利用整个组织的规模经济效益。


  ## Google Billing Account and Ownership

  两种类型的关系管理计费账户、组织和项目之间的交互：所有权和付款关联。


  图 17-8 显示了项目的所有权和付款关联关系。所有权是指从主组织继承的身份和访问管理（IAM）权限。付款关联定义了哪个计费账户为给定项目付款。在图中，组织拥有项目
  A、B 和 C 的所有权，计费账户负责支付这三个项目产生的费用。


  ![](img/4d4736bc293fd892d1da81802d0f9520_307_0.png)


  图 17-8. Google 计费账户和所有权


  ## Applying Google CUDs in a Project

  CUDs 不能用于覆盖短期使用高峰。如果您购买了 50 个 vCPU 的 CUDs，您不能在半个月内运行 100 个 vCPU 并获得全部折扣。重温优惠券类比，单张优惠券不能同时应用于多个资源。


  CUDs 是针对特定实例系列购买的，一种类型的 CUD 不能应用于其他资源使用类型。如果您购买 N2（通用型）CUDs，它们不会对 M1（内存优化型）实例提供折扣，反之亦然。


  您以一年或三年期限购买 CUDs，默认情况下不会自动续订。如果您希望承诺自动续订，必须手动在每个承诺上启用自动续订设置。CUDs 应用于 vCPU 和内存使用量的总和。4
  个 vCPU 的承诺可以对更多 vCPU 的实例应用部分折扣。例如，使用 16 个 vCPU 运行的实例将以 CUD 价格获得 4 个 vCPU，其余 12 个
  vCPU 按正常价格计费。


  最后，值得注意的是，CUDs 按非常特定的顺序分配给最昂贵的机器类型：


  - 1. 自定义机器类型

  - 2. 单租户节点组

  - 3. 预定义机器类型


  这确保了在应用时获得最佳可能的折扣。


  ## Google Flexible Committed Use Discounts

  在 2022 年底创建本书第二版的最后阶段，Google Cloud 发布了一种名为 Flexible Committed Use Discounts 的新承诺服务


  (灵活 CUD)。你在本文中关于 CUDs 学到的大量内容同样适用于灵活 CUD。


  与 AWS SP 类似，面向 GCE 的灵活 CUD 是一种基于支出的承诺，可在承诺在为期一年或三年的期限内达到 GCE 的特定每小时支出水平以换取大幅折扣。


  灵活 CUD 在标准 CUD 已提供的灵活性基础上增加了两个维度。与标准 CUD 一样，你可以更改实例使用的大小和区域。首先，灵活 CUD 还允许你在大多数通用型和计算优化型实例系列之间更改实例系列。其次，它们允许你更改虚拟机运行的区域。


  灵活 CUD 非常适合具有可预测云支出需求的客户，或需要灵活性来承诺云支出但又不想受限于单个区域或单个机器类型的客户。灵活 CUD 使你能够将云投资财务决策与特定工作负载的虚拟机选择解耦。


  客户承诺在为期一年或三年的期限内保持一致的支出水平，按等效按需支出的每小时美元计。在此基础上，他们可对承诺覆盖的适用用量享受折扣费率。


  你可以从任何账单账号购买 CUD，并且折扣可应用于该账单账号支付的项目中的任何符合条件的用量。虽然本章中的许多 CUD 技术将有助于你评估灵活 CUD 决策，但目前还为时过早，无法形成灵活
  CUD 的具体最佳实践。请继续关注 FinOps Foundation 的 Google 相关论坛，以跟上同行从业者关于最新最佳实践的讨论。


  ## 结论


  RIs、SPs、CUDs 和灵活 CUD 是云用户可用的最复杂的优化措施。通过运营成功的预留计划，可以获得可观的折扣。


  总结如下：


  - 三大主要云服务提供商均提供以换取大幅折扣的承诺能力。各家在功能、工作方式和提供的折扣方面存在差异。

  - 要充分利用预留的好处，你需要了解所有功能，包括大小灵活性以及购买后可以应用哪些修改。

  - 鉴于所有这些复杂性，如果集中管理 RIs、SPs 和 CUDs，将获得最佳效果，以便团队专注于减少使用量，而不必担心费率。


  - 对工程和财务等各种利益相关者团队进行教育是过程中的重要一步，因为 RIs 经常被误解。

  - 由于 RIs、SPs、CUDs、灵活 CUDs 以及其他折扣都是以承诺为交换，因此对未来希望覆盖的资源类型的清晰准确的持续使用预测至关重要。这需要工程团队与
  FinOps 团队之间保持良好的工作关系。


  现在你了解了预留的工作原理，我们将继续讨论在组织内部正确且最优地实施预留的策略和注意事项。

  '
- "## 构建基于承诺的折扣策略\n\n现在你已经理解了前两章所述的基于承诺折扣的基础知识，是时候提出一些艰难但重要的问题了：\n\n- 你应该承诺多少？\n-\
  \ 你应该承诺什么？\n- 何时承诺？\n- 流程中应涉及谁？\n- 如何知道你的承诺是否得到充分利用？\n- 如何知道何时重新购买？\n- 谁来支付？\n-\
  \ 如何在承诺期内分配成本和节省？\n\n不幸的是，没有确定的答案——只有在特定时间对公司而言正确的答案。随着你沿着 FinOps 成熟度曲线发展，随着云提供商更新其不断变化的承诺模式，以及随着公司现金储备的变化，这些答案可能会发生很大变化。\n\
  \n## 常见错误\n\n我们在公司使用基于承诺的折扣计划时看到许多错误。按任意顺序排列如下：\n\n- 过度推迟做出承诺\n- 做出过于保守的承诺\n- 基于唯一实例数量而不是水线进行承诺（本章后面会介绍）\n\
  - 购买后未管理承诺\n- 购买错误类型的承诺\n\n几乎每个人在早期策略的某个部分都会出错。这没关系。这是早期成熟阶段。你可以把它想象成学习骑自行车或编写第一段代码——这是一个学习过程，可能需要几次尝试才能做对。\n\
  \n> *失败很糟糕但能提供教训。发现有效的举措总是伴随着发现无效举措的发现。*\n> \n> —Bob Sutton, 斯坦福大学管理科学教授\n\n## 构建基于承诺的折扣策略的步骤\n\
  \n构建你的首个承诺策略有六个关键步骤：\n\n- 1. 学习每个计划的基础知识。\n- 2. 了解你对云服务提供商的承诺程度。\n- 3. 建立可重复的基于承诺的折扣流程。\n\
  - 4. 定期且频繁地购买。\n- 5. 衡量并迭代。\n- 6. 适当分配预付承诺成本。\n\n本节将依次介绍每个步骤。\n\n## 第 1 步：学习每个计划的基础知识\n\
  \n好消息！多亏了第 17 章，你对用于折扣计算的常见工具，如预留实例 (RIs)/节省计划 (SPs) 和承诺使用折扣 (CUDs)/灵活 CUD 的基础知识已经基本掌握。\n\
  \n然而，我们没有介绍几个概念。第一个是承诺计划的盈亏平衡点。如果你只记住本节的一件事，永远不要忘记这一点：\n\n你不需要使用 1 年承诺整整 12 个月就能省钱。\n\
  \n是的，你承诺在该期间支付费用，但你不需要在承诺期的每个小时都实际使用承诺，购买才在财务上合理。\n\n三年承诺即使对最忠诚的云用户来说也可能显得可怕。在某种程度上，它违背了你喜欢云的一切：即时、可扩展、按需使用。但对云提供商的一年或三年承诺可以节省大量资金，并彻底改变云在你有利的经济性。\n\
  \n1 年承诺可能在短短 4–6 个月内达到盈亏平衡，3 年承诺可能在 9–12 个月内达到盈亏平衡。在组织内分享这些盈亏平衡点的数据可以帮助缓解对所选云的承诺的担忧。让我们分解承诺盈亏平衡点的各个组成部分。\n\
  \n## 承诺盈亏平衡点的组成部分\n\n图 18-1 显示了在为期一年的期限内，资源的累计成本，按需费率和承诺费率均有体现。在示例中，承诺 upfront 成本超过\
  \ 300 美元，这就是为什么承诺线从 300 美元以上开始的原因。如果你使用的是无预付承诺，那么它将从按需线以下开始。如果使用的是全额预付承诺，则将以预付成本的价值绘制为一条水平线。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_313_0.png)\n\n图 18-1. 基于承诺的折扣现金流\n\n\
  现金流盈亏平衡点是承诺成本与按需费率使用成本相同之日。有些人出于明显原因称现金流盈亏平衡点为交叉点。在现金流盈亏平衡点，你不再为承诺支付自付费用。然而，你仍将继续支付承诺的持续（按小时）成本。如果你停止在现金流盈亏平衡点的使用，与按需费率相比，你将损失金钱。\n\
  \n总承诺成本盈亏平衡点是指资源使用的按需成本超过承诺总成本的位置。这是真正的盈亏平衡点，因为你可以停止运行任何与承诺匹配的使用，而不会比未承诺折扣计划时更糟。你支付的按需金额与承诺金额相同。盈亏平衡点之后，你将从承诺中实现节省。\n\
  \n按需线与总成本盈亏平衡点之间的差异是承诺带来的节省（或损失）。必须理解的是，使用此图表时，无论你是在整个 12 个月内运行一个与承诺匹配的资源，还是在此期间运行许多不同的匹配资源，都无关紧要。\n\
  \n如果你将所有适用承诺折扣的使用量加起来，然后可以将承诺的总成本与按需费率下相同使用量应支付的金额进行比较。此比较将为你提供何时达到盈亏平衡点以及已实现节省金额的指示。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_314_0.png)\n\n大多数情况下，规划良好的基于承诺的折扣计划将比你预期的更早达到盈亏平衡。就你的策略而言，真正的挑战通常不在于先买什么，而更多在于让组织就如何购买承诺达成一致。\n\
  \n## 承诺水线\n\n在继续该流程之前，还有一个我们在上一章未介绍的基础概念：承诺水线。正如你所知，你不会为特定实例购买承诺，也无法确定承诺折扣将应用于何处。承诺会非确定性地应用于符合你所选基于承诺折扣标准的资源。\n\
  \n如果你成功利用了云的弹性，你在一天/一周/一个月内的资源使用量会有所不同——在安静时段较少，在繁忙时段更多。\n\n图 18-2 显示了随时间变化的资源使用情况。该图中的单位不如概念重要。对于\
  \ AWS RIs，单位可能是与我们考虑购买的 RI 类型匹配的实例的单个运行实例小时数。对于\n\nSPs，其单位可能是已应用折扣的美元，或我们每小时花费的资金。但它们都是针对我们正在考虑的承诺的可互换承诺单位。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_315_0.png)\n\n### 图 18-2. 承诺利用率\n\n如果您购买了四个承诺单位，每个承诺的利用率将为\
  \ 100%；第五个承诺的利用率为 90%；第六个承诺为 80%；以此类推。如果承诺为您节省 25%，那么与按需成本相比节省费用，您需要将承诺利用率保持在 75%\
  \ 以上。\n\n知道这一点后，如果您承诺七个承诺，您为第七个承诺支付的费用将高于按需费率，因此超过六个承诺的任何使用都无法得到覆盖。\n\n在第 2 行以上的行中，一个承诺可以应用于不同的资源。此外，这些资源可能来自您云环境中的不同账户。正是因为资源的共享——以及随之而来的规模经济——使得集中化承诺购买成为\
  \ FinOps 最佳实践的核心原则。如果您仅从团队层面推动承诺采购，您可能会得到错误的承诺数量。我们发现，最好将费率优化与团队的日常工作分离，以便他们能够专注于优化资源利用率。\n\
  \n因为这张水线图仅适用于可能被我们正在考虑的承诺覆盖的事物，而且因为资源使用可能由多种承诺覆盖（例如 SRI、Compute SP、EC2 SP 等），我们的流程（在大多数情况下还有我们的自动化推荐工具）将查看一致使用的许多变化以及将为我们带来最大节省的覆盖率，并向\
  \ FinOps 团队提供其需要非常仔细考虑的选项。如今手工进行这种水线分析的情况很少见，但了解这种分析是如何进行的很重要，这样您才能平衡来自工具、供应商和团队的不同建议。\n\
  \n采购的新角色是成为战略采购部门，确保您的公司通过承诺和谈判价格获得所消耗资源的最佳可能费率。\n\n## 第 2 步：了解您对云服务提供商的承诺程度\n\n\
  无论您使用哪家云服务提供商，承诺的目标都是尽可能节省开支。在制定承诺策略之前，有几件事需要考虑。您公司的概况会影响承诺策略。您还需要考虑您对云服务提供商的整体承诺程度、可能需要在采购决策中考虑的谈判费率、付款流程、对成本分摊的影响，以及任何预付款的整体资本可用性。\n\
  \n当您与云服务提供商创建承诺时，可能存在预付费用和按小时费用。将整个期限内的所有费用合并后，您将得到总承诺成本——即您承诺在云服务提供商处花费的金额。\n\n\
  三大云服务提供商都允许您承诺一年或三年的承诺，期限越长节省越多。要在这两个选项之间做出决定，您需要考虑您对云服务提供商的承诺程度。在此期间您减少使用的可能性有多大？\n\
  \n假设您预测在未来 12 个月内，您不太可能离开当前的云服务提供商，但对未来三年的承诺却没那么有信心。在这种情况下，您不应承诺三年期的基于承诺的折扣计划。如果您在完整的三年期限结束前停止，您将无法实现额外的节省。\n\
  \n## 第 3 步：建立可重复的基于承诺的折扣流程\n\n构建承诺策略的第二步是建立一个您可以定期反复运行的流程，以便尽可能快速地做出正确的采购决策。为什么这很重要？因为云计算一切都关乎即时采购。您只在需要时启动资源。同样，您也应该在需要时购买承诺：不要太早，也不要太晚。\n\
  \n业务审批流程也可能导致承诺按不频繁的计划进行。如果业务流程需要数周才能获得批准，那么每月进行承诺就会很麻烦。这正是 FinOps 可以通过建立新的承诺执行流程来使业务受益的地方，因为改进流程可以为业务节省更多成本。\n\
  \n为此，您需要知道谁将参与流程，在承诺之前需要考虑哪些决策标准，以及签署流程是什么样。考虑将其写入公司政策，概述谁负责、审批如何进行，以及理想情况下针对设定承诺采购金额的预先批准流程。对政策设定边界，以便在影响承诺决策过程的重大事件（如新产品公告——例如新的\
  \ SP 方案）后重新评估。\n\n我们看到成功的公司会为 FinOps 团队分配季度承诺预算，只有当整体承诺超过该预算时才需要额外审批。利用预测来预测预期需要的额外承诺和现有承诺到期情况，您应该能够为财务团队提供未来\
  \ 12 个月承诺的预期支出。在大多数情况下，减少审批流程中涉及的人员数量和文书工作量会加快承诺频率。我们将在第 22 章更详细地讨论基于指标的成本优化，在那里我们将看到拥有预先批准的支出金额如何导致自动化的承诺采购。\n\
  \n您在云中的基础设施应该是灵活的：实例类型快速变化、迁移、弹性、使用高峰等等。您应该通过快速调整承诺以匹配这些变化来支持这些变化。您可能需要每月购买以跟上变化的速度，并且您几乎肯定会更频繁地对您的投资组合进行交换、修改和调整。\n\
  \n因此，您的 FinOps 团队负责承诺流程。他们需要深入了解承诺的工作方式（参见第 17 章），并对正在运行他们做出承诺的资源的团队的动机和未来计划保持敏感（参见第\
  \ 3 章）。他们需要与财务、技术和执行团队进行沟通，以推动承诺落地。\n\n为什么应该集中管理承诺？简单的答案是集中管理可以为您的公司节省 10%–40% 的云账单。更细致的答案是，当每个团队单独决定购买什么时，决定何时以及购买多少承诺的工作效率会更低。任何团队都很难在一天中的每个小时、持续一年或三年足够稳定地使用每种资源，以购买其所有资源的覆盖。波动或不一致的使用将无法得到覆盖，并以按需费率花费公司成本。如果将组织中每个团队的那一点按需空闲加起来，结果会导致效率降低\
  \ 10%–40%。\n\n此外，承诺采购通常由专注于高效运行资源的科技或运营团队执行得并不好。而且您不一定希望他们花费宝贵的时间去了解云服务提供商的基于承诺的折扣计划的细节。请记住，您希望建立职责分工，即\
  \ FinOps 团队执行 *费率优化*，而业务线团队执行 *使用优化*。\n\n中央 FinOps 职能可以查看整个组织的所有使用情况，并且可以通过不仅查看一个团队的水线使用情况，还查看所有团队的使用情况来最好地实现覆盖最大化。正如您在上一章所学，承诺优惠可以在账户、订阅或项目之间流动，因此您希望拥有对组织整体支出最佳可见性的人来负责。\n\
  \n如果您有采购承诺的决策策略，并且您的中央 FinOps 团队根据从工程或业务线团队获得的使用水线和计划的未来资源使用情况做出这些采购，那么您的下一个决定通常是您购买的承诺购买或附加在何处。\n\
  \n您在第 17 章学到，您可以在账户层级的不同级别购买承诺，以便它们以不同的方式应用于资源。例如，如果您运行的是 AWS 管理账户，并链接了三个成员账户，您可以选择在管理账户中购买承诺，或在其中一个成员账户中购买。\n\
  \n如果您假设管理账户中没有重要资源（这是一个很好的政策），那么在该账户内购买承诺将立即使其流向其他三个账户的资源，随机应用于这些其他账户中最小的（在基于 ISF\
  \ 的 RI 的情况下）或折扣最高的（在 SP 的情况下）资源。\n\n另一个选择是在其中一个拥有大量资源的成员账户内购买承诺。由于覆盖方式，AWS RI 或\
  \ SP 首先会应用于该账户内 *全部* 符合条件的资源，然后才开始应用于其他账户中的其他资源。如果您例如有一个生产账户，预计其资源运行最稳定，并且希望该生产账户中的所有资源首先得到覆盖，您可能会在该账户中购买承诺。或者您可能有一个团队已支付承诺的预付费用，并且希望其资源首先得到覆盖。\n\
  \n这里需要考虑的一个注意事项专门涉及 SPs。因为 SPs 唯一地适用于不同类型的服务（EC2、Fargate、Lambda），并且这些服务的折扣差异很大（EC2\
  \ 高达 75%，Lambda 为 17%），您应注意，如果您在同时拥有 EC2 和\n\nLambda 资源，该承诺将首先覆盖该账户中 *所有* 符合条件的用量。因此，你可能会发现你的\
  \ SP 在流向其他账户之前，已经覆盖了大量 Lambda 无服务器用量，而在这些账户中节省的比例会高得多（从而带来更多的货币节省）。\n\n所以你在何处购买承诺的策略应考虑这一点。\n\
  \n我们看到一些更先进的客户采用了这种方法，一些提供承诺管理 *作为服务* 的供应商也在使用，即所谓的 *侧车* 账户：专门的成员账户，其中 *仅* 包含承诺，完全没有用量。在专门指定的账户中购买承诺消除了\
  \ FinOps 团队访问管理账户的需求（再次强调，限制访问总是件好事），并使客户能够在组织单元之间移动承诺，从而使其在不同时间以不同的方式适用。\n\n这对于托管服务提供商或通过并购经常买卖业务部分的公司来说尤其有价值。作为一种方法。如果基于承诺的折扣附加到正在出售的系统的账户上，那么随着这些账户被移至其新环境中的新管理账户，包含承诺的\
  \ sidecar 账户就可以简单地在组织中重新定位。如果承诺是在这些账户中购买的，它们就会随资源一起转移。\n\n承诺可以全部购买在一个 sidecar 账户中，也可以购买在多个账户中，以帮助影响覆盖范围可能适用的位置。并非每个组织都需要获得这种程度的控制，但如果你需要，这可以成为你整体承诺策略的一个重要方面。\n\
  \n## 第 4 步：定期且频繁地购买\n\n云是为即时采购而设计的。你不应该以数据中心的方式运行基础设施或采购容量（即购买承诺）。\n\n多年前，AWS 在其主页上展示过类似图\
  \ 18-3 的图表。左边的图表显示了在数据中心和硬件世界中购买容量的方式，充满了限制和硬件的长时间交货期。右边的图表显示了在云中运行基础设施的理想方式：你只需在需要时启动它。购买承诺也是如此。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_320_0.png)\n\n图 18-3. AWS 曾在其网站上托管的图表\n\
  \n## 第 5 步：衡量并迭代\n\n我们听过许多公司错误购买承诺的可怕故事。为了降低这种常见错误的风险，请确保你的初始购买量很小。你应仔细设定带阈值的指标。这些可以从简单的衡量开始，例如应通过折扣覆盖的云支出百分比中有多少被折扣计划覆盖。相反，你应跟踪现有承诺的浪费（或空置）量，以确保它们得到最大程度的使用。有关管理承诺时使用的指标的更多信息，我们将在第\
  \ 22 章介绍以指标驱动的成本优化。\n\n过度购买承诺或错误购买的一个常见原因是推荐购买何种类型承诺的工具！承诺推荐，如 FinOps 工具和平台（来自云提供商或第三方）执行的任何自动化流程，主要基于对你过去用量的专家分析。在你的未来用量与过去用量完全相同的情况下（不太可能），这些预测可以非常准确。然而，你可以根据可变的时间段回溯来生成推荐。\n\
  \n一位贡献者告诉我们购买大量 AWS 预留实例以覆盖大量按需成本的故事。该购买立即开始产生可衡量的差异，业务也支持通过在仅两周后进行另一次增量的 RI 购买来增加覆盖范围。然而，用于生成推荐的工具的回溯期为\
  \ 30 天，因此它基于有新 RI 覆盖的两周和没有覆盖的两周生成推荐，这导致它在第二次购买时推荐了过多的 RI 购买。\n\n购买承诺是关于风险管理；你做出的承诺越多，未被充分利用的风险就越大。你的预测能力越好——参见第\
  \ 13 章——你就越能放心地安全地做出更大的承诺。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_321_0.png)\n\
  \n在购买承诺时有很多需要考虑的因素，因此请花时间分析购买的影响，并确保每一步向更高覆盖率的增量步骤。随着你对流程的经验和信心的增长，你可以增加购买的频率和规模。\n\
  \n## 第 6 步：适当分配预付承诺成本\n\n第 4 章介绍了配比原则，即费用应在收到价值的期间记录。在 AWS 中，当承诺预付时，即使部分预付，它也会在较长期间（一年或三年）内对你的用量应用折扣，你需要将预付款分摊到期限内。将预付款分摊称为摊销。在\
  \ AWS 中，你可以选择全额、部分或不预付。你预付越多，承诺的折扣越高。在 Azure 中，你可以选择预付或按月支付，价格没有区别。而在 Google Cloud\
  \ 中，你按月支付，因此无需跟踪摊销。\n\n是否预付需要考虑两个主要因素：\n\n### 会计\n\n首先是其对你的会计流程的影响。第 17 章强调，承诺折扣将随机应用于你的云用量。如果你需要将预付款的一部分分配给一个团队，另一部分分配给另一个团队，你将需要准确跟踪承诺折扣应用的位置，然后相应地进行摊销。\n\
  \n### 颗粒度\n\n你不能简单地将承诺分成相等的月度部分。并非所有承诺都从月初的第一小时开始，二月比三月短 10%，因此摊销需要更精细的方法。\n\n我们将在本章后面介绍谁为承诺买单。\n\
  \n虽然承诺可以省钱，但它们可能需要可用现金来支付预付费用。对于一些组织来说，这不是问题，而对于其他组织来说，这会阻碍业务活动。一些组织需要在特定时间段内花钱，例如在财政年度结束前必须消耗预算时。\n\
  \n在资金可用时，我们看到经验丰富的 FinOps 从业者会考虑加权平均资本成本（WACC）和现金的净现值（NPV）。这些计算决定将业务资本应用于预付承诺是否比其他可能的投资更具投资价值。虽然不预付会有较低的折扣，但在业务的其他地方投资一些资金可能会带来更好的财务结果。\n\
  \n把 AWS 对无预付和部分预付购买选项收取的溢价视为相当于供应商借出非预付部分购买款项的利息费用，并把该利息费用视为按年利率计算。我们称之为无预付或部分预付购买选项的隐含利率。\n\
  \n云资源消费者是否应选择全额预付或其他付款选项，取决于消费者的 WACC 是否低于或高于服务提供商为推迟承诺付款而收取的隐含利率。\n\n消费者的 WACC（有时称为内部资本成本）是云消费者财务资本的成本，以公司债务的利息成本和公司股权资本的成本形式体现。确定哪个成本更大的过程涉及分别计算全额预付和无预付情景下购买现金流的净现值。\n\
  \n该过程始于确定消费者的 WACC。大多数企业在财务部门为此类决策使用标准 WACC，通常你可以将该数字视为已知。\n\n如果使用 Excel 的目标求解等技术计算出的折扣率超过客户的\
  \ WACC，客户应购买全额预付承诺。如果该数字低于消费者的 WACC，则无预付承诺购买选项的隐含利率对消费者来说将比 AWS 的全额预付选项更便宜。\n\n\
  购买的承诺组合会改变每次购买的此推定利率，因此可以针对每次购买决策进行，或可以针对代表性购买进行，以帮助客户制定购买无预付、部分预付或全额预付预留实例或储蓄计划的政策，并仅偶尔重新审视。请注意，这仅适用于\
  \ AWS 承诺，因为它们是唯一在预付时折扣可变的承诺。\n\n\n\n## 如何管理承诺策略\n\n为了减少各团队自行管理其承诺的需求，FinOps 团队提供每个团队资源所适用的折扣以及整体节省情况的可见性非常重要。如果没有这种可见性，团队会倾向于自行承诺其用量以获得节省。在采用集中式承诺折扣模式时，让分布式团队购买承诺是危险的，因为你很可能会过度承诺。\n\
  \n集中式承诺折扣模式并不一定会阻止个人团队提供意见。FinOps 团队应记录运营团队计划实施的路线图项目，特别是这些变更会影响云上使用量的情况。当承诺可以转换或交换时，需要的个人团队意见较少，因为\
  \ FinOps 团队可以在需要时转换承诺。如果承诺无法修改，则应给拥有被覆盖资源使用量的个人团队机会对所做的承诺发表评论。让负责团队了解承诺及其对使用量的含义，可确保他们在未来规划任何资源使用量变更时都会考虑该承诺。\n\
  \n## 适时购买承诺\n\n我们听到了许多关于企业应如何安排承诺折扣购买时间的意见。了解过早承诺与过晚承诺的影响非常重要。如果你过早承诺，你将为承诺付费而账户上没有任何折扣适用。如果你承诺的用量超过实际需要，你可能需要为整个期限（一年或三年）支付承诺费用而没有任何节省。然而，如果你等待太久，你将按即用即付费率支付使用量，并错失本可通过更早承诺获得的节省。\n\
  \n为了帮助你更好地理解，图 18-4 显示了云账单中的某些资源使用量。如果你在一月份购买一年期承诺，你将为承诺支付三个月费用而得不到折扣，浪费了承诺的 25%（3\
  \ 个月 / 12 个月）。当使用量从四月开始时，你将立即为此使用量获得折扣费率直至年底。如果该承诺节省的金额不超过 25%，那么你年底支付的费用将超过根本不做承诺时的费用。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_324_0.png)\n\n图 18-4. 资源使用量从四月开始并持续九个月\n\
  \n反之，如果你等到九月才做承诺，你将按全额即用即付费率支付五个月，错失本可实现的节省。\n\n我们将在第 22 章介绍一种更成熟的仅在需要时进行承诺的模式。大多数公司起初按固定时间表进行承诺，例如每年、每季度或每月。当有固定时间表时，企业会倾向于过度承诺以在每个周期内获得最大节省。\n\
  \n例如，一家每年做承诺的公司可能会承诺比所需多 30% 的承诺。其想法是随着一年的进展，云支出会增加，多余的承诺将立即开始适用折扣。然而，在年初，公司为这些未适用折扣的额外承诺支付了过高费用。如前例所示，这些承诺永远不会应用的折扣超过未使用承诺成本的风险存在。\n\
  \n通过提高购买承诺的频率，你可以减少按全额即用即付费率收费的时间，同时消除过度承诺的诱惑。然而，以更高速度进行承诺也有一些障碍。分析你拥有的和需要的承诺数量所需的时间可能会降低进行承诺的频率。如果你的云服务提供商有内置服务来推荐应承诺的内容，这是一个很好的起点。随着\
  \ FinOps 团队的成熟，使用第三方工具和你自己构建的分析将有助于提高建议的质量并加快分析过程。\n\n## 何时进行优化配置规模与承诺\n\n你在第 15\
  \ 章看到了优化配置规模如何影响基于承诺的折扣计划。因此，许多人认为最好的方法是先进行优化配置规模再承诺。尽管这种方法听起来正确，但并不总是合适的。它不可避免地会导致因不必要的即用即付支出而损失节省机会。\n\
  \n使用优化和优化配置规模很困难，且需要很长时间才能减少债务并开始主动进行。它需要工程团队参与、接受成本教育并认同做出改变。这不会一蹴而就。团队通常专注于交付功能，无法立即投入使用优化。通常需要六个月或更长时间才能转变为工程师将成本视为效率指标的文化。在此期间，如果你不做任何承诺，你将不必要地长时间按即用即付付费。而且，当优化配置规模发生时，通常是渐进过程而非一次性大变革，因为工程师开始将其优化融入持续流程中。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_325_0.png)\n\n因此，将优化配置规模和承诺都视为优化整体支出的方式。这些概念似乎相互对立，但仅在整体上如此。对能产生最大影响的项目（并且你知道有可用的工程资源及时完成工作）进行少量优化配置规模，并对最稳定使用的资源进行少量承诺购买，然后反复进行，会产生一种棘轮效应，使业务逐步走向更好的成本优化。\n\
  \nFinOps 实践不成熟时，企业犯的最大错误之一是等待使用优化完成后再做任何承诺。记住，你会多次经历 FinOps 生命周期，每次都进行最关键的优化。我们不应该争论何时优化配置规模与承诺。几乎总是由公司目标驱动的费率优化与使用优化之间的平衡。\n\
  \n虽然我们主张集中管理承诺规划，但对正确资源的优化应分散进行并不断改进。最有效的 FinOps 实践更注重确保事情首先得到优化，而不是事后被动修复。将成本纳入你的工程流程。提前考虑资源的大小。然而，无论你做得多好，工作负载生命周期中总会有资源过大时。它今天可能合适，但五次部署后你变得更高效。你升级了库，现在它只使用一半内存。\n\
  \n没有“我们永远不需要优化配置规模；我们一开始就做对了”这种说法。这是迭代、演进等。\n\n在使用减少的早期阶段，你可能在清理未附加的存储卷，或关闭开发或暂存账户中\
  \ 100% 空闲的机器。费率降低的早期阶段可能是购买你的首批 10% 覆盖率（如果你使用 AWS，甚至可能是无预付费的预留实例）。在每个方面获得成熟度和复杂性都需要跨职能、跨团队协作和大量教育。\n\
  \n最好的路径是为两者设定保守目标并从一开始就启动并行流程。你的整个云计算支出中不太可能有很大比例被浪费从而可以调整大小。因此，你很可能可以安全地用基于承诺的折扣覆盖\
  \ 50% 的基础设施，特别是如果你的云使用量因迁移或新应用而随时间增长。\n\n起步时，你应设定一个较小的承诺覆盖目标，也许是 25%–30%，并承诺部分云资源，从而及早实现节省。随着你减少浪费，你新购买的承诺将适用于剩余使用量的更大比例。请记住，像实例大小灵活性（ISF）、AWS\
  \ 的可转换 RIs 以及 Azure 取消 RIs 的能力等计划，即使在你已承诺后仍能为优化基础设施使用提供空间。\n\n由于你能够衡量账户中未使用承诺的数量，你可以重新评估覆盖目标并理想地随时间增加。成熟的\
  \ FinOps 实践会让你建立定期购买承诺的节奏，而工程团队则定期清理未使用资源并对使用不足的资源进行优化配置规模。先进的实践将进入以指标驱动的成本优化（第\
  \ 22 章）。\n\n## 区域方法\n\n许多基于承诺的折扣计划不适用于全球，意味着它们仅适用于同一区域（在某些情况下，同一可用区）。此外，它们仅适用于与第\
  \ 17 章所述相同属性匹配的资源。考虑到这一点，基于承诺的折扣通常不会在低使用区域购买。在低使用区域的承诺存在未覆盖的风险，因此会给企业带来成本而不是节省。同样，针对旧一代实例类型的基于承诺的折扣也有类似风险。\n\
  \n当团队在低使用区域构建基础设施和/或使用被认为风险过高而无法承诺的实例类型时，他们将得不到任何折扣。HERE Technologies 的高级 DevOps\
  \ 经理 Dave Van Hoven 提出了一种方法来提高对不覆盖特定使用类型和/或位置的这些决策的可见性，从而使工程师能够就如何构建做出明智决策。\n\n\n\
  \n区域方法是在内部向业务发布信息，说明哪些位置和实例类型将被中央 FinOps 团队的承诺采购自动纳入考虑（允许区域），以及哪些位置和实例类型如果不向 FinOps\
  \ 团队询问就不会被承诺覆盖（受限区域）。\n\n## 允许区域\n\n允许区域是工程师最容易的区域。选择使用更新且常见的实例类型进行构建，然后部署到公司内更广泛采用的业务支持区域，使工程师能够在日常考虑中忽略基于承诺的折扣计划。该允许区域有助于推动工程决策进入业务最希望支持的领域。\n\
  \n## 受限区域\n\n受限区域要求工程师要么自行管理其承诺，要么与 FinOps 密切合作购买专用承诺。工程团队基础设施的任何变更都将始终要求他们考虑已做出的额外承诺，因为不太可能修改承诺以供另一团队使用。受限区域需要额外的工作，因此对工程团队来说吸引力下降。\n\
  \n## 阻止区域\n\n该概念的一个小延伸是阻止区域，它明确说明组织不批准购买的位置和类型的承诺。这可用于划定工程师不应构建基础设施的区域。\n\n区域方法使集中式承诺实践的工作方式更清晰。它向团队展示承诺不会自动适用于他们的区域，并定义了对模糊使用情况应用承诺的过程。应提供报告以突出显示不仅由集中式\
  \ FinOps 承诺流程（在允许区域中）而且由受限区域产生的效率和节省。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_327_0.png)\n\
  \n使用更灵活的承诺选项（如 SP 或 Flexible CUDs）来覆盖使用较少的区域中的资源，使 FinOps 团队能够覆盖在没有定期 RI 覆盖的区域中的杂项使用。这种承诺类型的混合类似于购买不同类型的投资以对冲各种风险敞口。在这种情况下，通过提供在任何区域都适用的更灵活（尽管折扣较少）的覆盖，可以减轻团队在较少使用的区域远离\
  \ RI 覆盖的风险。\n\n## 谁为承诺买单？\n\n批准 FinOps 团队 *购买* 基于承诺的折扣并不一定意味着他们将 *支付* 承诺费用。承诺的成本有两个主要组成部分：任何预付费用和按小时费用。一些基于承诺的折扣仅包含其中之一：*All\
  \ upfront* 和 *No upfront* 承诺。\n\n对于任何预付付款，成本应被 *amortized*，即应用于它最终为其提供折扣的资源每小时的成本，因为承诺会应用于您的云账单。承诺的任何未使用容量（在\
  \ FinOps 中我们称之为 *vacancy*）然后直接计入您的账单，并从初始预付费用中保持未摊销。该空置成本通常出现在您购买承诺的账户、订阅或项目中。\n\
  \n一旦在月底正确摊销成本，您将得到以下内容：\n\n- 剩余预付费用在未来月份摊销的预付费用应计\n- 当月发生的摊销云资源成本（成本通过标签、标签和账户分配）\n\
  - 未使用承诺的未摊销成本在计费数据中集中收取\n\n当批准 FinOps 团队在承诺采购上花费时，他们会向预付费用应计增加资金。就月度成本而言，这不是业务费用。在会计中，使用公认会计原则的配比原则时，业务预付费用被记录为资产，并在您将成本摊销到云成本时转为费用。因此，FinOps\
  \ 团队不会将承诺采购的预算报告为业务费用。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_328_0.png)\n\n\
  请与您的会计团队核实他们如何处理承诺的预付费用，并使报告与此保持一致。\n\n当成本摊销到您的云资源时，您可以根据成本分配策略，使用标签、标签和账户将其摊销包含在回溯报告中。您可以将承诺成本归因于您的回溯/分摊成本分配流程，并像处理所有其他云成本一样处理它们。\n\
  \n对于未使用的承诺，费用是集中计费的（计入购买承诺的账户），并且需要一个流程来适当分配它们。以下是我们见过的用于处理此未使用承诺成本的四种策略：\n\n###\
  \ 基于账户的归属\n\n如果承诺是在团队拥有的账户内购买——靠近其打算应用折扣的使用情况——则可以根据购买承诺的账户分配未使用的承诺成本。费用分配给拥有该账户的每个团队。\n\
  \n### 混合摊销\n\n将未使用的承诺成本添加到摊销率中，实际上会将未使用成本混合到每个人为该承诺覆盖的资源支付的费率中。我们所指的不是我们在第 4 章中讨论的\
  \ AWS 计费数据概念中的混合费率。这会使未覆盖的资源保持在正常的按需费率。承诺适用于哪些确切资源的差异意味着有时资源会获得折扣，而有时不会。这种折扣分配的差异会使跟踪团队成本变得更难以理解，因为由于团队本身无法控制的费率优化差异，可能会导致周期性成本出现差异。管理层和财务部门对此的认识至关重要，以便这些部门不会无理地批评工程团队因云提供商应用承诺覆盖方式而造成的这种差异。我们建议在执行回溯/分摊时使用资源混合费率，因为尽管存在这种差异，它反映了实际折扣的应用方式，并且将与云提供商工具的成本报告相匹配。\n\
  \n### 资源混合费率\n\n在这里，您通过混合账单中资源费率的总成本为承诺创建一个新费率。再次强调，这与您在 AWS 计费数据中看到的 AWS 混合费率不同。相反，这个概念采用所有与承诺匹配的使用量（按需和折扣），应用预付摊销和未使用承诺金额，然后在所有使用量上创建一个新费率。这意味着使用该类型使用量的每个人都将获得相同的费率，无论计费数据中是否应用了承诺。这本质上为每个资源类型创建了公司自己的平均费率——介于按需价和折扣价之间——该费率会随着承诺覆盖范围的变化而变化。它避免了在承诺适用的任何地方出现随机的赢家和输家。然而，以所有人都易于理解的方式制作这种报告模型是一项大量工作，并且它会在混合费率报告与用户在云提供商原生工具中看到的任何成本信息之间产生细微差异。\n\
  \n### 节省资金池\n\n与您的财务团队一起建立一个流程，将节省集中起来，所有报告、预算和预测均使用按需费率。工程团队无需考虑其使用量的正确 CUD 费率，承诺对使用量的不可预测应用也不再是问题。所有节省均集中报告给\
  \ FinOps 团队，从中扣除未使用的承诺成本。该节省金额作为反向预算运作，FinOps 团队预期有一定的节省金额，绩效根据其实现正确节省金额的接近程度来衡量。然后将此中央节省资金池以更可控和适当的方式分配给业务。这种方法效果很好，因为它可以消除覆盖方式的差异，并允许工程团队完全专注于使用优化。然而，这意味着工程师查看的是按需成本，而财务和产品团队可能需要查看混合摊销成本指标来正确计算实际产品利润。这也可能隐藏重要的支出方面，这可能会使工程团队能够更专注于优化那些未被承诺覆盖或无法被承诺覆盖的资源，因为他们无法看到哪些内容被覆盖和折扣。\n\
  \n您对承诺成本分配的方法将取决于您的业务流程，并且随着 FinOps 实践的成熟可能会随时间而变化。与云成本管理的许多方面一样，查看成本的方法多种多样，其中一些方法对某些团队和角色利益相关者来说似乎不公平、不公平、变化太大或极具惩罚性。但通过创建透明地代表您成本的方法，并让所有角色利益相关者参与成本分配结构的制定，您可以设定期望，即使某件事对一个团队来说似乎不公平，每个人都认识到它似乎是这样，并且可以在其回应中进行补偿或考虑这一点。\n\
  \n## 策略提示\n\n在构建基于承诺的折扣策略时，您可能会发现以下提示有用：\n\n### 首先建立可见性\n\n我们一次又一次听到的故事大致如下：“我购买了承诺，但我的账单却上涨了。”\
  \ 通常承诺是为遏制云成本增长而购买的，并且首先在组织内部云的增长阶段实施。很可能云增长大于承诺能够带来的节省，而如果没有关于承诺节省多少的任何可见性，您所拥有的只是不断增加的云支出。\n\
  \n### 了解承诺的工作原理\n\n从第 17 章您应该已经了解到基于承诺的折扣计划有多么复杂。人们在购买承诺时最常见的错误是不正确地理解它们，然后购买错误的承诺类型，或在错误的地方购买它们\n\
  \nlocations. 当承诺与您预期的使用情况不匹配时，可能导致成本大幅增加。\n\n## Get help\n\nFinOps 从业者并非通过单枪匹马完成一切来证明自己。FinOps\
  \ Foundation 中最成功的从业者都会使用某种外部帮助。FinOps Foundation 本身就是一个可供您协助的外部资源。\n\n通过向同行学习、参加培训课程、获得认证以及利用云服务提供商的支持渠道，您可以确保基于承诺的折扣计划最有可能成功。如果承诺对您的组织来说是新的，您应考虑使用经验丰富的顾问来启动。\n\
  \n请记住，如果您向云厂商支付支持费用，您也在为您的技术客户经理或 TAM 的时间付费。一些客户从未主动向其 TAM 寻求帮助，但承诺采购是让 TAM 验证的绝佳事项。事实上，让所有能验证承诺采购的人都参与进来是有价值的，因为人越多越好，而在采购前向每个人解释您的决策可以起到澄清作用。我们认识的几乎每位从业者都有因错误购买承诺而产生的故事，因此请特别在这一领域寻求帮助。\n\
  \n## Avoid going from zero to hero\n\n当您的实践成熟度还处于早期阶段时，我们建议只购买一个承诺。这使您能够通过低风险的采购来确认自己的知识。您可以在进行更大规模采购之前验证自己是否避免了所有常见错误。试图从“zero\
  \ to hero”往往会导致失败。您可以考虑我们之前讨论过的区域方法，识别出可从承诺中受益的最低风险使用情况，然后逐步增加采购量。这是一种建立对策略信心的绝佳方式，并且它使承诺的续期错开，从而在承诺到期时也能让您更逐步地调整承诺。\n\
  \n但您不应拖延。虽然我们建议从慢开始，但完全不开始是一个重大且常见的错误。通过不进行任何采购来避免错误会导致持续的过度支出。再次强调，找到并购买一些低风险的承诺，然后在开始看到这些节省的同时继续学习并完善您的报告流程。\n\
  \n当您刚开始时，我们建议将承诺目标设得较低。考虑在允许的区域内实现 25%–30% 的承诺覆盖率。随着信心的增长，相应上调目标。我们看到组织普遍期望的覆盖率是\
  \ 90% 的承诺覆盖率。\n\n## Consider the overall impact\n\n承诺将在云账单上以某种随机方式应用。因此，如果您已有成本报告并且团队密切跟踪支出，承诺采购可能会导致支出在一处下降而另一处未下降时产生混淆。沟通承诺的采购情况，并不断迭代企业使用的报告以准确反映其节省带来的影响，是避免混淆的关键。\n\
  \n我们认为这些提示是最重要的需要注意的事项；然而，为了获得最大支持，请与行业内的同行联系，使用经验丰富的承包商，并利用 FinOps 平台指导您进入基于承诺的折扣采购的第一步。\n\
  \n## Conclusion\n\n管理承诺的 FinOps 策略因组织而异。但有一些常见做法能带来高效且管理良好的承诺组合。由 FinOps 团队进行集中管理是最重要的之一。\n\
  \n总结如下：\n\n-   您应利用构建策略时可获得的所有帮助，避免单打独斗。\n-   您必须了解承诺的工作原理，并在进行承诺采购前花时间建立可见性。\n\
  -   您不应延迟购买承诺。首先购买低风险承诺，然后在流程上加以改进以提高覆盖率。\n-   沟通对整个组织都很重要，以避免对谁在做什么以及如何准确查看成本产生混淆。\n\
  -   您可能会使用各种类型和配置的承诺来实现整体承诺目标。\n-   从小开始，随着成熟度的提高、对策略信心的增强以及看到每项承诺的影响，逐步增加影响力。\n\
  \n正确实施的基于承诺的折扣策略将随着 FinOps 而发展和成熟，为组织节省大量资金。理想情况下，指标应用于所有 FinOps 流程中。\n\n在下一章中，我们将探讨可持续性以及\
  \ FinOps 如何推动一种名为 *GreenOps* 的新兴实践的增长。\n"
- "## Sustainability: FinOps Partnering with GreenOps\n\n可持续性：FinOps 与 GreenOps 合作\n\
  \n在过去几年里，围绕云消耗的可持续性关注度和认知度大幅提升，云提供商和各地的云团队突然开始谈论衡量和减少其云碳足迹。\n\n可持续性作为一门学科有三大支柱：环境、社会和经济。本章的重点将放在与云数据中心排放相关的环境支柱上。\n\
  \n我们将在本章后面介绍这对 FinOps 从业者为何重要，但首先考虑一下您的组织为何应该关心。组织对数字服务的碳足迹的更深入关注是由来自多个重要内部和外部利益相关者的压力驱动的：\n\
  \n-   投资者和股东正推动首席执行官和董事会成员对其整体排放负责，这是由 ESG（环境、社会和治理）举措以及公开报告的可持续性指标的影响所驱动的。\n- \
  \  政府正在收紧环境报告要求和法规，因此绿色漂洗（虚假声称或宣传公司比实际更环保）的空间更小，行动的重点更大。\n-   客户越来越多地基于道德原因做出购买决策，包括他们考虑的公司的可持续性实践。\n\
  -   员工要求自己的公司更具可持续性。员工在选择下一个就业地点时非常重视潜在雇主如何应对可持续性。\n\n这些压力的结合成功地提高了董事会内部对可持续性的关注度，增加了对可持续性目标和/或净零期限的关注，同时更加注重问责制、透明度以及可衡量改进的交付。\n\
  \n> *没有什么比影响他们奖金的事情更能激励 C-suite。 这意味着预算和时间等关键资源正被用于专注于可持续性。*\n> \n> —Posetiv Cloud\
  \ 的 Mark Butcher 在 FinOpsPod 播客第 8 集：FinOpsPod Voicemail: GreenOps 中说\n\n那么可持续性在云世界中为何重要？因为云服务产生的碳足迹规模巨大。直到最近，IT\
  \ 服务的碳足迹一直被 ESG 专业人士忽视，他们的关注点在业务的其他领域，尤其是与更直接污染的业务领域相比，IT 和云消耗被视为无关紧要。\n\n但随着云服务的增长，行业和媒体对数据中心的碳足迹变得更加直言不讳，关注点在于为看似\
  \ insatiable 的数据存储和计算需求提供多少电力和水。随着越来越多的公司关闭自己的小型数据中心并向云端集中，这种转变现在发生是有道理的。将许多小型设施的工作负载聚合到云提供商运营的庞大综合体中，使得云提供商实施的整体效率的微小提升也能产生更显著的影响，就像解决公用事业规模发电厂的排放比在单个工厂发电厂或备用发电机上做改变影响更大一样。\n\
  \n据报道，构成云的数据中心消耗了全球总能源的 1%–4%，预计这一数字在十年内将增长至高达 10%，超过航空等其他市场领域。此外，它们是水的大量消耗者，这会以水蒸气的形式产生排放。“典型的数据中心每天使用约\
  \ 3–5 百万加仑的水，与 30,000–50,000 人的城市用水量相同，”德克萨斯理工大学水资源中心教授兼主任 Venkatesh Uddameri 在\
  \ 2021 年 NBC News 采访中表示。\n\n根据 2022 年 Time 文章，“Google 认为其用水是专有商业机密，甚至禁止公众官员披露公司的消耗量。但信息已经泄露，有时是通过与当地公用事业和保护团体之间的法律斗争。仅在\
  \ 2019 年，Google 就申请或获得了超过 2.3\n\n根据网上公布的公开记录和法律文件，三个不同州的数据中心耗水量达数十亿加仑。”\n\n随着企业远离自有数据中心，推动云消费激增，可持续性措施也需要跟上。\n\
  \n## 云碳排放是什么？\n\n为了管理和减少你的数字碳足迹，所有相关人员都需要对碳排放是什么以及如何衡量有一个共同的理解。可持续性领域使用了许多特定领域的术语，其中大部分本书不会涉及。如果你正在寻找这些术语的列表及其含义的解释，可以在\
  \ FinOps Foundation 网站上找到。重要的是，本章你需要了解温室气体是什么以及碳报告中常见的计量单位：\n\n### 温室气体\n\n温室气体是大气中吸收并重新发射热量的气体。一般来说，大气中这些气体的含量越多，地球就会变得越热。温室气体包括二氧化碳（CO₂）、水蒸气、甲烷（CH₄）、一氧化二氮（N₂O）、臭氧等。\n\
  \n### CO₂e\n\n常常与二氧化碳（CO₂）的表示法混淆，CO₂e 是二氧化碳当量，它将所有温室气体作为一个标准化指标来包含。每种气体的全球变暖潜能值被用来将测量值转换为对环境产生等同\
  \ CO₂ 影响的量。CO₂e 为你提供了一个指标来代表所有气体综合的影响。\n\n你可能会以多种方式看到 CO₂e 的写法，例如：CO₂eq、CO₂-e、二氧化碳当量，或\
  \ CDE。\n\n### 净零\n\n用于描述一种结果，即组织的活动产生的总排放量已通过减少碳排放的项目得到抵消。排放应由组织减少、测量，然后再进行抵消。你可以在\
  \ Science Based Targets 网站上阅读更多关于净零的信息。\n\n组织所负责的总碳排放被细分为三个类别，即范围 1、2 和 3。三个范围是按公司在其自身运营及其更广泛价值链（即供应商和客户）中产生的不同类型排放进行分组的方式。名称来源于《温室气体核算体系》，它是全球使用最广泛的温室气体核算标准。\n\
  \n编制涵盖所有范围的完整温室气体排放清单使公司能够了解其整个价值链的排放情况，并将工作重点放在最大的减排机会上。做到这一点非常重要，因为 IT 行业在一定程度上存在只关注电力作为碳排放主要来源的过失，而忽视了来自三个范围排放的整体情况。\n\
  \n## 范围 1、2 和 3 排放\n\n从本质上讲，范围 1 和 2 是公司拥有或控制的排放，而范围 3 排放是公司活动的结果，但发生在公司不拥有或不控制的来源。\n\
  \n### 范围 1 排放\n来自组织直接拥有或控制的来源的排放——例如，在本地数据中心发电机中燃烧柴油。\n\n### 范围 2 排放\n组织在购买和使用的能源被生产时间接造成的排放。例如，对于本地数据中心，为数据中心供电的电力产生的排放就属于此类。\n\
  \n### 范围 3 排放\n排放并非由公司本身产生，也不是其拥有或控制的资产活动的结果，而是由其间接负责的实体产生的，来自公司价值链的上游和下游排放。一个例子是当你购买、使用和处置供应商的产品时。范围\
  \ 3 排放包括范围 1 和 2 边界之外的所有来源。范围 3 是你的云服务提供商 100% 排放被归类的所在。\n\n云服务提供商谈论他们自己的范围 1、2\
  \ 和 3 排放，容易让人对排放类别感到困惑。然而，为了简化，从云的角度（或任何外包服务）来看，提供商的范围 1、2 和 3 排放 100% 相加构成了你针对该提供商的范围\
  \ 3 总量。可以把它想象成套娃，如图 19-1 所示。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_337_0.png)\n\
  \n图 19-1. 随着价值链向上移动，不同范围排放如何堆叠并汇入范围 3 排放的可视化\n\n## 云服务提供商环保吗？\n\n可以从两个角度来看这个问题。一方面，云服务提供商本质上倾向于尽可能高效地运营，仅仅因为对他们来说效率等于最大利润，这本身并无问题。平均而言，云服务提供商的数据中心在各方面都优于几乎任何本地同类设施，使用最新最好的技术来控制电力和水等宝贵资源的使用。\n\
  \n大多数云服务提供商在可行时使用可再生能源，但这不足以对其整体排放产生重大影响。云服务提供商使用可再生能源本身并不意味着他们是绿色或净零。\n\n另一方面，许多云服务提供商主要关注范围\
  \ 1 和 2。范围 1 和 2 相关排放的问题在于它们只是总排放的一小部分。考虑到大得多的范围 3 排放，情况看起来完全不同，范围 3 通常远大于范围 1 和\
  \ 2。微软 2021 年白皮书“A New Approach for Scope 3 Emissions Transparency”报告称，其 2020 年\
  \ 1600 万吨排放中，1200 万吨为范围 3。\n\n直到云服务提供商开始提供关于所有三个范围碳排放更清晰、更全面的报告，很难真正回答云有多绿的问题。\n\
  \n主要云服务提供商在报告排放方面采取不同的方法，且成熟度各不相同。到目前为止，云可持续性报告的发展似乎走上了与第 5 章云计费数据简史中云计费数据相同的道路。它始于非常汇总、更新不频繁的报告，正向更细粒度、更新更频繁、更易访问的数据集发展。希望获取真正可持续性测量和优化所需的数据集不会花费类似数量的年数。\n\
  \n不幸的是，主要云服务提供商关于其碳排放的当前报告含糊不清，缺乏一致的方法论和完整性。例如，在本版发行时，AWS 和 Google 在该领域的报告仅涵盖其范围\
  \ 1 和 2 排放，忽略了范围 3。这使得 Azure 成为唯一在所有三个范围报告碳排放的提供商，所有提供商都大量使用平均值和不同年代的碳数据。\n\n如果你阅读主要云服务提供商最新的媒体发布，你会被原谅假设测量你的云碳足迹是一个已解决的问题，因为前三大云服务提供商现在提供某种形式的碳报告。虽然这是朝着正确方向迈出的一步，但仍有许多问题需要解决，才能理解你的云足迹的可持续性。\n\
  \n## 访问\n\n虽然顶级云服务提供商已发布可持续性工具和/或碳使用报告，但许多其他云服务提供商要么没有提供可持续性数据能力，要么要求其云消费者支付合同费用以进行某一时间点的审计。可持续性数据的更新频率从手动（按需）到每月不等。数据本身以\
  \ PDF 报告、通过云平台 Web 界面访问的自定义仪表板，或在有限情况下用于你自己的分析报告的 API 数据形式提供。\n\n可用数据和访问方法的缺乏标准化限制了第三方供应商平台提供的可持续性能力。开源领域的一个选择是名为\
  \ Cloud Carbon Footprint 的应用程序。Cloud Carbon Footprint 使用你的云服务提供商的计费数据和由你的云服务提供商提供的可持续性数据。根据收集的数据，为你的云使用生成碳足迹估算。这是对报告问题的创新方法，并提供有趣的可视化，但它依赖于可用数据的有效性和成熟度以及计算方法，包括云服务提供商提供的数据。\n\
  \n## 完整性\n\n你在尝试了解云服务提供商提供的可持续性数据的完整性时会遇到困难。理解数据的困难大多源于云服务提供商用于计算碳足迹的方法。之前提到过缺少范围\
  \ 3，但云服务提供商提供的并非所有服务都包含在其报告中，且计算中应用了大量平均值。平均值的挑战在于它可能为不同地区、数据中心或单个产品提供误导性的碳足迹。例如，低碳实例可能看起来\n\
  \n与相对低效、老旧的替代实例具有相同的足迹。一些云服务提供商目前建议将云支出作为碳影响的直接代理，这是不准确的——成本更高并不总是意味着排放更多。\n\n为了建立对所提供数据的信任，云服务提供商需要涵盖所有云服务，在计算方法和涵盖气体方面更加公开透明，并减少对平均值的依赖。\n\
  \n## Granularity\n\n云提供商提供的大多数数据都汇总到国家或地理区域，使得基于可持续性在不同云区域之间部署云服务的决策变得不可能。目前没有任何云提供商提供真正准确的云资源级别的碳数据，而是将数据汇总为每个云提供商服务的总碳排放量。没有资源级别的数据，就无法确定哪种资源类型比其他类型更高效。例如，在一个区域内无法识别出某个具体位置是否更可持续或碳效率更高，也无法在区域或位置之间以任何准确度比较实例或服务。\n\
  \n目前，云服务提供商不提供像云成本计算器那样的排放计算器。如果没有主动计算工作负载预期排放的方法，贵组织了解影响的唯一方式就是部署服务，然后等待更新的碳报告。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_339_0.png)\n\n> 不要让完美成为进步的敌人。虽然今天云服务提供商提供的可持续性数据仍有大量改进空间，但等待所有正确的数据只会阻止贵组织培养优化所需的文化和技能，并基于云部署的可持续性做出决策。\n\
  \n## Partnering with Engineers on Sustainability\n\n一种新兴趋势是相关但不同的实践——GreenOps。GreenOps\
  \ 的目标是建立一种让工程师参与其云可持续性的实践。GreenOps 用于描述组织推动其云部署以及数据中心、基础设施平台和软件开发等其他 IT 领域可持续性提升的实践。\n\
  \nAWS 对其 Well-Architected Framework 的最新扩展引入了可持续性支柱，其中概述了可持续性的共同责任模型。受此启发，图 19-2\
  \ 被创建以帮助解释两个关键领域之间的划分：云的可持续性和云中的可持续性，前者是提供商（即 Microsoft、Google 或 Amazon）的责任，后者则完全落在消费者身上。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_340_0.png)\n\n图 19-2. 云可持续性共同责任模型（由 Mark\
  \ Butcher 贡献）\n\n云中的可持续性是可持续云战略的关键组成部分，通常与 FinOps 原则直接一致。最简单地说，它反映了将可持续性作为非功能性需求（NFR）并将其嵌入整个\
  \ IT 组织的需求，使可持续性成为与可访问性、安全、性能、成本和可用性等其他领域并列的关键考量。\n\n在云中部署资源时可能并非总能做出最可持续的决策，但重要的是可持续性成为至少被考虑的关键标准，并且决策得到记录。正如我们在第\
  \ 1 章讨论的，Prius 效应帮助你在了解使用信息的情况下做出优化的良好决策，并允许你在合理时明确花费或使用更多资源。\n\n## FinOps and GreenOps\
  \ Better Together?\n\n在许多方面，可持续性需要在 FinOps 中已做的工作上增加一个指标。目标是以与引入成本相同的方式，将环境影响添加到贵组织做出的决策中。这并不是说\
  \ FinOps 从业者就是新的 GreenOps 从业者，而是将成本数据纳入决策过程的大部分工作都需要对 GreenOps 的碳数据重复进行。\n\n> 一个设计用于成本优化的精心编排的\
  \ FinOps 战略也将扩展 GreenOps。反之亦然；GreenOps 战略可以积极影响工作负载效率，从而带来成本节约。\n> \n> —Bindu Sharma，Guidewire\
  \ FinOps 高级经理，来自其 FinOps X 2022 演讲\n\n想象一下，当贵组织考虑在哪个区域构建灾难恢复环境时发生的决策过程。从工程师的角度来看，他们会考虑延迟、恢复点目标和恢复时间目标。工程指标考虑的是灾难发生时对客户的影响。FinOps\
  \ 引入了在不同区域运营的成本，以便企业做出考虑财务状况的决策，而现在 GreenOps 带来了所考虑区域的环境影响和碳成本，以帮助说明该决策如何影响组织的可持续性目标。\n\
  \nFinOps 在所有努力将成本数据纳入工程决策路径的方式中，GreenOps 需要对可持续性数据做同样的事情。与其让实施 GreenOps 的团队去摸索与谁合作以及如何对这些现有系统和流程实施所需变更，不如考虑与\
  \ FinOps 团队合作，共享知识并可能协助部署可持续性数据。\n\n让 FinOps 帮助 GreenOps 在贵组织中建立起来是互利的。许多员工非常关心环境，可持续性数据可以成为推动\
  \ FinOps 优化行动所需的激励因素——在第 3 章中有所介绍——从而推动行动。\n\n> 建立当前足迹的基准。记录您所做的任何假设并说明任何差距。考虑成立一个可持续性指导小组，帮助推动问责文化，围绕各团队行动如何影响组织的碳排放。一旦有了基线，您就可以开始评估潜在的碳节约机会。评估碳浪费的热点并建立补救文化，制定路线图开始做出改变。\n\
  > \n> —Mark Butcher，Posetiv Cloud 创始人，FinOps X 2022\n\n通常，可持续性会给公司带来额外成本，但有了成熟的\
  \ FinOps 实践，就可以在减少云支出同时减少云碳足迹。FinOps 和 GreenOps 世界之间存在明显的契合点，即通过减少不必要或未优化资源的用量来消除云浪费。随着云原生和第三方\
  \ SaaS FinOps 平台的不断进步，您可以轻易发现未充分利用的 EC2 实例。例如，更难看到的是 EC2 的部署方式不可持续。FinOps 可以与 GreenOps\
  \ 协同工作，优化使用云的流程和实践，而不仅仅是优化云中的资源。在部署工作负载时，选择区域或资源类型时，在成本、性能、安全等其他关键标准之外考虑可持续性非常重要。这可能需要查阅云提供商之外的信息来源，例如来自\
  \ Electricity Maps 等来源的碳强度指标，您可以在其中找到接近实时的碳强度数据点。\n\n至少，FinOps 团队可以帮助 GreenOps 团队建立起来并更好地与各种组织利益相关者建立联系，并可以共享现有的分类法、标记和报告结构。正如\
  \ FinOps 团队曾寻求帮助将报告集成到任何现有的 ITAM、软件资产管理（SAM）、安全或 TBM 团队中，现在它可以回馈这些帮助来推进 GreenOps。要开始与\
  \ GreenOps 团队协作，请参阅第 25 章，其中提供了与相关技术框架协作的一套指导原则。\n\n## GreenOps Remediations\n\n\
  从 FinOps 角度来看，在寻求成本节约时有一些众所周知的切入点，对 GreenOps 来说也是如此。以下列表并非详尽无遗，但对于任何希望确保其服务既具有成本效益又可持续的\
  \ FinOps 专业人士来说，是一个良好的起点：\n\n-  oversized 计算实例\n- 遗留运行的孤立实例\n- 运行在老旧、低效实例上的服务\n\
  - 尺寸不正确的微服务\n- 未终止的计算实例或仍在运行的开发环境\n- 存储快照过度保留\n- 数据存储在错误的存储层级\n- 运行在错误区域/可用区中的服务\n\
  \n现在，显然还有很多，这份列表只是冰山一角，但关键的第一步是评估当前状况，并基于实际指标为优化服务建立一些合理的时限 KPI。您还可以与工程团队合作优化代码，做出很多努力。这样做可以带来显著的益处，但显然需要大量的思考、规划和工程时间。自动化——在第\
  \ 22 章中讨论——可以帮助管理这些浪费领域，不仅有利于 FinOps，也有利于 GreenOps。\n\n\n\n## 避免 FinOps 与 GreenOps\
  \ 背道而驰\n\n并非所有 FinOps 能力都与 GreenOps 的目标保持一致，实际上其中一些甚至会积极地与 GreenOps 的目标相悖。例如，费率优化，通过承诺云资源来节省成本，这并不能帮助减少碳排放。成本和可持续性可能会朝着不同的方向发展。针对未充分利用资源的费率降低承诺会提高云成本效率，但也可能限制你减少云使用量的能力，进而限制减少碳排放的影响。你可能节省了资金，但对未使用资源的费率优化可能会鼓励你保留这些资源而不是将其关闭。这可能会阻止你减少那些你可能并不真正需要的云资源上的碳排放。\n\
  \n在比较运行云服务的区域时，成本并不总是与可持续性相匹配。表 19-1 显示了单个 e2-highcpu-32 计算资源在不同 Google Cloud 区域运行的比较。数据来源于\
  \ Google Cloud 定价页面和 Google Cloud 碳能源页面。仅基于价格比较表 19-1 中的区域，爱荷华州、南卡罗来纳州、哥伦布和俄勒冈州每月均为\
  \ $578，价格相等。当你同时考虑可持续性和成本时，区域选择对爱荷华州和俄勒冈州更为有利，而南卡罗来纳州的绿色能源使用量最低。该表还突出了使用全国平均值的弊端：绿色能源使用平均为\
  \ 54% 时，九个区域中有五个的绿色能源使用量实际上低于 54%。\n\n表 19-1. Google Cloud 中单个 e2-highcpu-32 实例的价格和所用绿色能源比较\n\
  \n| 区域 | 位置 | % 绿色能源 | 每月价格 |\n|---|---|---|---|\n| us-central1 | Iowa | 97% | $578\
  \ |\n| us-east1 | South Carolina | 25% | $578 |\n| us-east4 | Northern Virginia\
  \ | 64% | $651 |\n| us-east5 | Columbus | 64% | $578 |\n| us-south1 | Dallas | 40%\
  \ | $682 |\n| us-west1 | Oregon | 88% | $578 |\n| us-west2 | Los Angeles | 53% |\
  \ $694 |\n| us-west3 | Salt Lake City | 31% | $694 |\n| us-west4 | Las Vegas | 21%\
  \ | $651 |\n| 平均 |  | 54% | $631 |\n\n从全球角度来看，这种比较变得更加明显。截至撰写时，挪威电力碳强度为每千瓦时 31g\
  \ CO₂e，而美国弗吉尼亚州北部为 620g，相差 2,000%。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_344_0.png)\n\
  \n基于纯粹财务影响来决定运行服务的区域可能会对 GreenOps 的可持续性目标产生负面影响。在做出可持续性权衡时，力求就成本与可持续性的平衡达成共同协议。对齐各方将使他们与工程团队一起工作，避免冲突。\n\
  \n## 结论\n\n本章简要介绍了可持续性实践如 GreenOps 如何与 FinOps 相交。随着全球对可持续性的关注日益增长，我们相信 FinOps 与专注于云可持续性的团队之间的对齐将变得至关重要，而这两个学科之间的对齐将实现同时考虑支出金额和排放量的效率。\n\
  \n总结如下：\n\n- 可持续性已成为组织非常重要的议题，由政府、客户和员工等多个利益相关方推动。\n- 云比传统的本地平台更环保，但如果没有所有必需的数据，就无法确定其真正的可持续性程度。\n\
  - 现有的 FinOps 实践在组织内部处于有利位置，可以通过利用类似的补救步骤、报告模式和跨职能对齐来帮助 GreenOps 成功。\n- 可持续性数据的粒度将使\
  \ FinOps 能够帮助团队对其云部署做出更可持续的选择。\n- 接受当前可用数据的局限性并立即行动；避免在开始产生积极影响前等待完美。\n- 可持续性为 FinOps\
  \ 从业者提供了在组织内更广泛参与的机会，并可作为 FinOps 补救措施的额外杠杆。\n- 在 FinOps 讨论中将可持续性作为与成本并列的指标。\n- 在与\
  \ DevOps/工程等其他团队的对话中使用可持续性，以帮助推动效率和优化的文化。\n\n至此，本书的优化阶段结束。此时，你应该知道组织可用的优化措施，并应为希望实现的目标设定目标。第四部分将继续\
  \ FinOps 生命周期中的运行阶段，在那里你将建立实现目标所需的流程。\n"
- "## 第四部分\n\n## 运行阶段\n\n在本书记的最后一部分，我们进入生命周期的运行阶段，在此阶段通过实施流程和自动化采取行动。我们还深入探讨建立加速组织内\
  \ FinOps 的合作伙伴关系。最后，我们到达 FinOps 的终极状态：数据驱动的决策制定和 FinOps 成功的关键要素。\n\n## 运行：使团队与业务目标保持一致\n\
  \n没有行动流程，目标永远无法实现。当你进入 FinOps 的运行阶段时，你将致力于支持和加强前两个阶段中确定的要素。\n\n在本章中，我们更广泛地审视流程，以及它们如何不仅能够实现自动化，还能帮助组织实现\
  \ FinOps 目标。\n\n## 实现目标\n\n优化阶段设定目标，而运行阶段采取行动。这里不会设定新目标——这是基于商业案例和背景，对已设定的目标做出决策并制定计划的阶段。\n\
  \n让我们以在非工作时间关闭资源——当不需要时——的概念为例，并应用正确的操作顺序。在告知阶段，你识别出可能受益于关闭的资源。在优化阶段，你衡量潜在节省并根据这些指标设定希望节省的目标。在运行阶段，你定义资源开关的流程，并且可以启用自动化以提高资源应用新流程的可能性。这是引入可扩展性和复制性的阶段，通过定义可在整个组织中实施的流程来实现。\n\
  \n运行阶段并不总是导致行动。如果将优化阶段视为识别优化机会并为行动构建小型商业案例的阶段，那么运行阶段就是你决定是否采取行动的阶段。\n\n> 大多数信息都是无关的。知道忽略什么可以节省你的时间，减少压力，并改善你的决策。\n\
  > \n> —Shane Parrish, Farnam Street\n\n随着生命周期每次迭代，另一个目标会逐渐聚焦，并在此基础上构建新的流程和自动化以实现该目标。在构建流程时，你可能会发现更多想要实现的目标。当这种情况发生时，返回告知和优化阶段以正确衡量并为新流程设定目标。保持每次生命周期的迭代小而快，以便正确衡量每次更改。\n\
  \n## 人员配置与扩充 FinOps 团队\n\n随着时间的推移，大多数组织会聘请经验丰富的 FinOps 从业者来组建内部团队，正如我们在第 3 章中所讨论的那样。然而，近年来该领域的职位数量激增，超过了市场上经验丰富人才的供应。IDC\
  \ 在 2022 年估计，60% 的企业已经拥有或正在组建 FinOps 团队。人才竞争可能非常激烈。\n\n许多组织最初会转向 FinOps 顾问来扩充和启动其团队，同时在内部通过\
  \ FinOps 培训提升技能，并在外部吸引人才。所有主要全球咨询公司和大型会计公司现在都拥有 FinOps 实践，包括 Accenture、Deloitte、EY、KPMG、PWC\
  \ 等，以及系统集成商包括 HCL、SADA、SoftwareONE、Virtasant 等。\n\n然而，这些实践在成熟度和规模上差异很大，因此请务必确认他们是否为\
  \ FinOps 认证服务提供商，并核实他们配备的 FinOps 认证专业人员的数量。\n\n## 流程\n\n在生命周期循环的第一次，多数组织专注于了解当前成本。这包括围绕拥有哪些账户建立流程，识别账单的组织方式，并实施某种形式的支出分析工具，无论是直接来自云服务提供商还是来自第三方\
  \ FinOps 平台，以实现更高级别的能力，如完整的分摊计费或容器报告。\n\n在此之后，你的组织最重要的目标应驱动你构建的流程。成本敏感型组织会将成本效率作为最重要的目标，而专注于快速创新的组织则会选择专注于实现速度。\n\
  \n\n\nMany processes work together to formulate a successful FinOps practice. Automation\
  \ follows process.\n\n![](img/4d4736bc293fd892d1da81802d0f9520_351_0.png)\n\nBefore\
  \ you can build automation, you need to build out processes for that automation\
  \ to follow.\n\nIt’s important to define who is responsible for (or “owns”) the\
  \ process, what parts of the organization must follow the process, and to what goal\
  \ or goals the process contributes. A clearly defined operating model outlines expectations\
  \ for staff.\n\nWhen you adopt third-party automation tools—covered in Chapter 21—they\
  \ often dictate how the process must work. When using these tools, you may need\
  \ to adjust your defined processes to suit.\n\nStart by figuring out how items get\
  \ added to the new process (onboarding), what is expected from teams (responsibility),\
  \ how teams are informed about when the process should be followed and the outcomes\
  \ of following the process (visibility/alerting), and finally begin following the\
  \ process (action).\n\n## Onboarding\n\nCircumstances change, especially when you’re\
  \ using the cloud. Your organization might add to its existing cloud deployments\
  \ or go through a company merger. All processes should clearly define what changes\
  \ with cloud growth; otherwise, you end up with a process that works for the present\
  \ but not for the near future. Don’t just think about the now, think about what\
  \ the future may bring, and start thinking ahead about which parts of the process\
  \ will need to evolve so you’re setting yourself up for future changes and success.\
  \ Getting buy-in from the teams that will be actioning the process should happen\
  \ well before action needs to be taken, and setting expectations with them that\
  \ there will be changes as the practice matures. Convey to teams the goal and outcomes\
  \ that the new process is aiming to achieve.\n\n### Stories from the Cloud—Mike\n\
  \nAt Atlassian, there are specific processes for onboarding new cloud accounts.\
  \ These processes define how an account is added to the existing billing structures\
  \ and how FinOps tooling is added to the new account. Governance tooling is added\
  \ to the account, enabling idle resource management and rightsizing recommendations.\
  \ Any existing RIs in the account are merged into the centralized management by\
  \ the FinOps team. Having this governance builds a standard approach to account\
  \ management, removing the need for individual teams to manage their RIs, and allows\
  \ for more savings over time. The items being governed will evolve as the FinOps\
  \ practice matures, such as when we moved from using Trusted Advisor’s compute optimizations\
  \ to using Compute Optimizer’s recommendations. This allowed us to cover more cloud\
  \ services beyond the basic compute. The central team responsible for governance\
  \ is constantly working on providing better tooling to work with the next order\
  \ of magnitude of scale.\n\n## Responsibility\n\nEach process should be allocated\
  \ to an owner. Effective processes clearly define who does what, and when, and how\
  \ they do it. Do teams follow the process daily, weekly, monthly, or at some other\
  \ frequency? Remember some processes will be followed by the FinOps practitioner\
  \ (like buying commitments), while others are distributed (like rightsizing and\
  \ usage optimization).\n\nResponsibilities assigned to teams will grow as processes\
  \ mature. Regularly communicating any increases in expectations will reduce the\
  \ likelihood of teams claiming they were unaware of what they should have been doing\
  \ and when.\n\nThrough each iteration of the FinOps lifecycle, you build on these\
  \ processes. At the beginning of the cost visibility journey, for example, the only\
  \ expectation of a team when they receive a cost report might be to read it. Later,\
  \ teams might be asked to investigate and explain any costs over a certain threshold.\
  \ Even later, teams might be required to revise budgets and forecasts when projections\
  \ show goals won’t be met.\n\nOnce again, you’re gradually maturing FinOps. It’s\
  \ impossible to have teams investigate costs during the first time through the FinOps\
  \ lifecycle without first putting in place a well-developed cost allocation strategy\
  \ and correctly forecasted budgets. Instead, you minimize time through the loop,\
  \ because trying to build all the processes at once makes it impossible to track\
  \ the impacts of each process.\n\n![](img/4d4736bc293fd892d1da81802d0f9520_352_0.png)\n\
  \nIn photography studio and theater lighting design, there’s a maxim that reminds\
  \ the lighting technician to only move one light at a time—that way, they can see\
  \ the impact of each change before making additional adjustments. The same holds\
  \ true here: if you change processes related to your rightsizing or tagging and\
  \ to your reserved instance or savings plan management at the same time, you may\
  \ not be able to easily identify which change drove movement in your bill.\n\n##\
  \ Visibility\n\nBoth before and after an action is taken, you must build visibility.\
  \ In the operate phase, processes that enable visibility ensure that everyone is\
  \ aware of the changes required and those being made. The most common operational\
  \ processes for visibility send automatically generated reports or alerts to teams\
  \ to make them aware of events as they happen.\n\nReports should be clear and easy\
  \ to understand using the FinOps common language we defined in Chapter 4. Training\
  \ and documentation should be made available to ensure all staff are familiar with\
  \ this lexicon. Alerting and anomaly detection should occur on predictions based\
  \ on current metrics, allowing staff to respond before things are off track. Instead\
  \ of waiting for a target line to be breached, forecast the near term to identify\
  \ when action is required early. A good example of this is AWS Budgets, which allows\
  \ alert configuration based on predicted end-of-month spend.\n\nOver time, processes\
  \ and communication channels will grow in importance and sophistication. The FinOps\
  \ team can bring development teams, finance teams, and business teams to the table\
  \ to learn what information can help them plan and make decisions more effectively,\
  \ as well as to receive information about their plans. Over time, the amount and\
  \ variety of information provided will increase, and it will be critical for FinOps\
  \ practitioners to continuously improve how they communicate.\n\nMany FinOps teams\
  \ start by holding monthly or quarterly meetings with the technology teams building\
  \ and running applications. The first meetings can be awkward, uncomfortable, and\
  \ somewhat guarded, with neither side quite understanding what the other wants.\
  \ Over time, as these discussions continue, the FinOps team works with the IT teams\
  \ to advocate for them, to evangelize the good steps they are taking to understand\
  \ and control costs, and to provide them with a better understanding of business\
  \ goals and finance requirements. Records of these meetings show deeper conversations\
  \ about complex cloud decisions the team is considering, and participants begin\
  \ to come to the meeting prepared to talk about ideas to save costs, rather than\
  \ being dragged through their own cost data.\n\nCombining visibility with clear\
  \ responsibility and role definition breeds trust and leads to partnership in action.\
  \ Working with the various teams of your organization is one of the processes the\
  \ FinOps team needs to build. Be careful not to overlook the processes related to\
  \ operating a FinOps team successfully when building processes such as rightsizing\
  \ and commitment-based discount program planning, which are more focused on the\
  \ cloud providers.\n\n## Action\n\nThe action stage is where something actually\
  \ happens—processes involving activities that enable your organization to reach\
  \ its FinOps goals, from generating new reports to turning actual cloud resources\
  \ on and off. Action processes are often good candidates for automation. When we\
  \ discussed rightsizing in Chapter 15, we highlighted that recommendations are often\
  \ generated by the centralized FinOps team and then distributed to engineering teams\
  \ so they can investigate and adjust their resources where appropriate. Without\
  \ clear processes for how rightsizing recommendations are\n\n生成或关于对工程师期望的沟通不充分时，合理配置资源往往不会成功。\n\
  \nCentral FinOps 团队可以成为关于如何以不断提升的精细度执行各种 FinOps 能力的信息的绝佳来源。内部知识共享、流程库和工具对大型或复杂的组织而言可以带来巨大益处。脚本、流程文档和操作指南可以被收集供所有人使用，同时附带已采取行动或做出的决策的记录和日志。请记住，任何组织内的不同团队都处于不同的成熟度水平和\
  \ FinOps 生命周期阶段。他们应该有一个明确的地方去寻找行之有效的流程。\n\n直接行动可能并不总是你做出的决定。即使你有出色的合理配置资源的商业案例，如果关键员工需要专注于另一项战略举措，也可能不可行。你可能会将一项承诺采购推迟两周，以配合关于云架构的待定决策，而该决策可能会彻底改变所考虑服务的需求。并非每个优化机会都会导致行动或具体的节省。\n\
  \n然而，同样重要的是要记录这些决策及其制定理由，以提供行动记录并指导未来的决策。\n\n## How Do Responsibilities Help Culture?\n\
  \n定义哪些团队负责采取行动的流程也有助于建立不同团队协作的文化。团队应了解他们的贡献如何帮助组织实现目标。当团队看不到自己的努力如何产生贡献时，他们往往不会遵循流程。\n\
  \n## Carrot Versus Stick Approach\n\n有助于突出遵循流程积极影响的报告会鼓励团队付出努力以实现这些收益。跟踪并报告团队未遵循流程的地方以及衡量这些影响也很重要。建立最佳表现者和最差违规者名单可以帮助组织实现其目标。这些报告在组织内部的传播方式将由公司的文化决定。有些公司公开奖励成功并私下处理投入不足的团队，而其他公司则更喜欢公开的“最差违规者”榜单。\n\
  \n虽然传统的 IT 组织通常使用积极指标而非消极指标，但在公有云和 FinOps 的世界里有一个巨大的区别：团队有能力以他们在数据中心运行时从未有过的方式阻止浪费和负面行为。因团队在成本早已折旧的存储区域网络（SAN）上浪费存储容量而惩罚团队意义不大，但突出那些持续每小时花费公司金钱的未使用资源，尽管它们只需几次点击即可终止，这是有意义的。\n\
  \n在使用优化中，常见的问题是让团队实施变更。展示你的团队可以实现的总体节省以及其他团队已产生的节省，有助于说服团队参与流程。\n\n这里的偏好是使用胡萝卜的方式与工程师建立协作，避免制造我们对他们的环境。不幸的是，前述的胡萝卜并不总是足够，你需要与不遵循\
  \ FinOps 指导的团队合作。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_355_0.png)\n\n请记住，有些团队预计花费会显著高于其他团队。基于总支出的“最差违规者”名单不会有成效。虽然团队\
  \ A 花费比团队 B 多可能是个话题，但更重要的是知道团队 B 是否超预算而团队 A 是否达标。将对话集中在关键事项上，而不对不重要的事项浪费时间，这符合 FinOps\
  \ 的语言。\n\n## Handling Inaction\n\n对于执行团队而言，传播实现目标对整个组织成功的重要性信息很重要。当团队理解这一点时，他们会更关注对其整体绩效的报告。当团队想要以速度换取支出时，管理层需要批准。此例外应纳入预算考虑。\n\
  \n你很少会遇到不在乎组织超支的员工。因此，当我们发现团队不遵循 FinOps 团队的建议时，最常见的原因是他们有其他优先事项。了解这些优先事项是什么可以避免意见冲突。\n\
  \n团队可能会更关注执行速度而非成本。更早完成项目可能会给业务带来整体市场优势。如果团队在已部署的内容上遇到问题，为了省钱而阻止他们解决这个问题可能不符合业务利益。\n\
  \n如果团队成员因其他项目时间表而不愿分配时间来达成目标，那么负责路线图规划的管理层需要专门分配时间用于优化，或者预算负责人需要记录因未分配时间进行优化而导致的支出增加。\n\
  \n在有正当理由超出目标的情况下，目标设定阶段可能会遗漏细节。花更多时间进行目标设定可以防止团队出现在“最差违规者”名单中。\n\n当团队不优先处理其目标且不愿做出必要的变更时，你该怎么办？这时，FinOps\
  \ 实践者会告知业务部门的预算负责人哪些目标未达成以及有哪些机会可以帮助团队重回正轨。\n\n## Putting Operate into Action\n\n\
  让我们看一个通过移除闲置资源进行使用优化的例子。FinOps 团队定义了一个检测闲置资源并估算潜在节省的流程。在 FinOps 生命周期中的优化阶段，FinOps\
  \ 实践者衡量闲置资源的量。\n\n假设你有 $150,000 的潜在成本规避，其中设定目标为 $50,000。你定义一个流程，分配责任并明确说明对工程团队的期望、他们应多快响应建议，以及团队应如何将其资源排除在流程之外。你为这些闲置资源生成报告并发布给负责这些资源的团队。\n\
  \n随着团队移除闲置资源，可避免的成本金额从最初的 $150,000 下降。工程团队也会看到分配给他们的建议数量在下降。这两个结果都有助于展示团队努力的影响。\n\
  \n对于不遵循流程的团队，他们的建议和潜在节省不会改变，更糟的是，它们会增加。管理层应重申遵循移除闲置资源的流程的重要性，对未应用流程的团队施加压力。FinOps\
  \ 团队应与未达成目标的团队合作，确定如何协助他们。这在第 24 章中有更详细的介绍。\n\n当避免 $50,000 成本的目标达成后，可以定义新的——并且 hopefully\
  \ 更雄心勃勃——的目标。\n\n## Conclusion\n\n为了实现目标，每个组织都需要流程，明确规定谁在何时需要做什么。\n\nTo summarize:\n\
  \n- 在优化阶段设定目标，并在运营阶段建立流程以实现它们。\n- FinOps 成熟度方法适用于流程。不要试图一次实现所有目标。\n- 以小步增量开发流程可以让你衡量实现目标的进展。\n\
  - 管理层的支持可以帮助团队完成其必需任务。\n- 与组织外部的 FinOps 实践者合作，采用在其他组织中已证明有效的流程；考虑加入 FinOps Foundation，使用\
  \ FinOps 承包商，或聘请经验丰富的实践者。\n\n有许多流程适合自动化：报告生成和警报是两个主要候选。在下一章中，我们将讨论 FinOps 中的自动化应如何仅遵循明确定义的流程。\n\
  \n\n"
- '## 自动化成本管理


  当你有一个需要经常执行的重复性任务时，自动化可以消除工作量并保持一致性。在 FinOps 中，有很多自动化机会。在本章中，我们将介绍一些常见的 FinOps 自动化任务，以及自动化的好处和挑战。


  *FinOps 自动化* 作为一个术语可以指代许多不同的事物，从简单的账单处理到直接的基础设施管理，包括账单数据的处理、异常警报、报告交付和创建、预留实例或节省计划管理、标签/账户/订阅/项目创建和维护、用量优化和合理调整规模、按计划停止和启动资源、基于需求的预测自动扩缩容、部署时选择实例大小、在抢占式和按需之间迁移工作负载，或将云支出数据交付给外部系统等。


  你对自动化的定义将取决于你公司的云和 FinOps 成熟度、员工的技术能力，以及你将重复流程从人类转移到计算机的总体舒适程度。


  ## 是否自动化


  是否要自动化？这就是问题所在。你可以通过审视组织的两个方面来确定答案。首先，你必须概述希望通过自动化实现的结果。其次，你需要将自动化与组织内的手动跟踪流程进行比较，并确定自动化是否是实现你已识别的期望结果的更好方法。


  是否应该自动化？最终，答案是“视情况而定”，这通常就是情况。要回答这个问题，我们必须着眼于自动化所能带来的益处。


  ## 你想要实现什么结果？


  识别实际的业务成果很重要，而不仅仅是自动化实现该成果的方式。例如，如果你再看看空闲资源治理，你可能会认为目标是从云环境中*移除空闲资源*。但实际上，结果是你想要*消除这些资源的成本*，因为它们正在花费你的钱。这很重要，因为你使用此类目标来衡量自动化的性能。


  如果你衡量被关闭的资源的原始数量——因为它们被识别为空闲——你就看不到这对你的云账单的实际影响，而当你衡量关闭这些资源所避免的成本时则可以看到。如果你培养自动化的浪费用量的纪律，你就能在未来保护自己免受价格冲击。你还让组织养成健康的习惯，思考新云产品中浪费可能出现的地方。


  另一个例子，标签治理旨在推动遵守你的标签标准。它通过移除资源或在标签不符合你的标准时提醒你来实现这一点。你将通过跟踪随时间推移不符合标签标准的资源数量来衡量自动化的影响。


  对于计划性资源，你还希望通过减少非办公时间内的资源使用来降低成本。


  ## 自动化与手动任务


  表面上，这可能看起来像一个愚蠢的练习。毕竟，不是每个人都想自动化一切吗？


  不过，退一步从你试图实现的目标中抽离出来，并验证自动化是否是正确的解决方案是有好处的。如果你的目标是省钱，那么你应该花点时间比较拟议的自动化可能产生的潜在节省与购买或构建自动化的成本，同时密切关注使用外部工具的内部安全感知考虑以及维护内部工具的管理考虑。


  如果你打算使用第三方平台来自动化任务，你应该检查持续成本。如果计划的自动化在合理的时间范围内不会为你的组织省钱，或者维护自动化的成本将超过节省潜力，那么部署该自动化就没有可辨别的业务利益。


  请记住，有时我们自动化目标*不是*省钱。这在标签治理中经常是真的，在那里你希望推动标签标准的采用，并最终提高你的分摊准确性，实际上是为了推动团队对云支出的问责。


  在所有情况下，都要寻求验证自动化将有助于你实现目标。例如，如果对无效标签资源的警报没有与应对这些警报的公司政策相结合，那么你可能会决定自动化只是在给每个人的日常工作增加噪音，而没有实现提高合规性的目标。


  ![](img/4d4736bc293fd892d1da81802d0f9520_361_0.png)


  对于小规模或变化缓慢的云足迹，部署和管理一个用于自动化警报的工具可能比让某人遵循手动流程需要更多的工作。但随着你的云足迹增长和/或变得更加动态，自动化变得更加重要。请记住，随着你的团队需要交付的任务越来越多，手动流程往往会排到清单的后面或完全被遗忘。在这些情况下，自动化确保任务以相同的方式并按计划完成。


  有时自动化的工作量——可能超过手动执行任务的工作量——是值得的。人类会犯错误，自动化可以用来纠正它们。人类可能会误输入标签的大小写敏感的键/值对。自动化不会犯这个错误，并且还有减少团队工作量的额外好处。使用
  FinOps 自动化来减少错误和工作量的一个很好的例子是当你自动化向资源添加补充标签数据的过程时。团队可能会用简单的标识符标记资源，然后让自动化根据该标识符与外部数据源（如
  CMDB）之间的关联添加额外的澄清标签。团队通常会使用映射到成本中心的项目标识符，或者让项目标识符标签本身仅基于标识符从外部 CMDB 自动识别。自动化会找到该项目标识符，向资源添加额外的标签，将相关的云支出数据交付给该团队的系统以供显示或未来自动化，并为该团队生成云支出报告，例如异常警报。这减少了团队需要应用的标签数量，避免了人为错误，并确保额外的标签数据以一致的方式应用，然后将该数据传递到工程师在他们已在工作的场所需要看到它的路径中。


  能够与业务进行对话的能力不仅仅是关于如何使用自动化来实现成本节约等目标，还包括为什么自动化是解决问题的正确方式，这使你能够更彻底地权衡实施和维护自动化的成本。


  在 FinOps 生命周期中迭代循环时，重复重新评估自动化的收益和成本很重要：最初不值得自动化的东西一旦达到一定规模可能证明是值得的，或者相反，起初你自动化的某些东西可能比预期更复杂地管理或排查问题，导致暂时回到手动流程。随着你的云足迹增长，随着免费和开源工具变得更广泛可用，或随着你出于其他原因实施提供部分自动化的工具包，你可能会发现成本效益分析有利于增加自动化。


  ## 自动化工具


  当谈到任何业务工具时，不可避免的争论就开始了：买还是建。对于 FinOps，我们建议从第三方工具开始；最初这意味着云提供商的原生工具，后来在你的支出规模和复杂性证明需要时再使用
  SaaS 提供商。成功的自研工具通常需要来自于使用一系列可用商业解决方案所获得的对什么对你的组织有效、什么无效的深刻理解。


  当你开始 FinOps 自动化之旅时，你可能会重复许多人遵循的相同的学习过程。通过使用成熟的第三方工具，你可以避免一些常见陷阱，加快自动化的交付时间，然后培养对什么对组织有效、什么无效的理解。这都是我们在第
  8 章中介绍的构建与购买与原生同一对话的一部分。


  ![](img/4d4736bc293fd892d1da81802d0f9520_362_0.png)


  虽然构建与购买取决于公司，但我们也认为，你不应该在没有触及现有解决方案的极限之前尝试构建自己的 FinOps 解决方案，这段旅程使你能够理解 FinOps 流程及其久经考验的工具（无论是原生、第三方还是开源）固有的复杂性。根据我们的经验，无论你的团队的工程能力多么出色，作为新从业者构建新的
  FinOps 工具都是徒劳的。


  ## 成本


  思考成本与收益时，古老的格言“你不知道你不知道什么”绝对适用。有很多有知识的公司和承包商可以分享他们对 FinOps 自动化周围需要实施哪些实践和流程的见解。的确，他们可以指导你的整个组织实现他们提供的工具的最大收益。


  考虑你能构建什么与能购买什么相比时，保持现实也很重要。很容易陷入比较完成任务所需构建的最低限度要求的陷阱。然而，这会让你缺乏关于你构建的工具将如何运行的信息，以及当事情不如预期时它会产生什么影响。第三方工具很可能会准备好展示其


  收益和价值，并且它将拥有一支专注于维护和改进工具的团队——因此你的团队无需承担这些工作。


  ## 其他考虑因素


  成本不是，也不应是买与建之间权衡的全部内容。存在安全影响。此外，你可能会发现某个工具提供的功能与你的环境不兼容，或无法与你已在使用的系统集成，例如用于警报和通知的聊天和工单应用程序。某些行业甚至有特定的合规要求，如
  FedRAMP、HIPAA、SOC 2 或 PCI，而第三方工具提供商可能尚未持有相应的认证。找到具备正确认证组合的供应商，可以从合规角度让你的自动化流程更顺畅。


  能够审计自动化操作至关重要，尤其是在自动化与生产环境交互时。这种认知建立了透明度。


  第三方自动化工具通常文档完善，并提供员工学习的培训材料，因此在招聘新员工时，他们更有可能已熟悉这些工具。如果你自行构建自动化工具，你需要愿意并能够为现有和新团队成员提供持续培训，并且存在负责构建和维护工具的人员可能离开组织的风险。除非有超过少数几名员工熟悉工具及其实现方式，否则你会遇到“关键人员风险”。


  当你决定自行构建自动化工具而不是购买现成产品时，应以知情的方式进行。你必须始终将构建所有所需功能所需的投入——包括衡量工具有效性的方法、持续维护以及你需要实施的更新——与购买的解决方案进行比较。而且你应谨慎识别任何第三方供应商工具缺失的功能或合规要求。


  ## 工具部署选项


  与大多数软件一样，自动化工具的部署方式有几个需要考虑的因素，这会影响选型过程。


  ### 云原生


  在云账户内运行的自动化，脚本可以由云服务提供商或更广泛的社区提供。这些脚本在你的云账户内的 Function-as-a-Service 平台（如 AWS Lambda）中执行。


  ### 自建


  这是由你自己的员工构建和运行的软件。功能开发由内部团队负责。如果你组织内有多个不同的 DevOps 团队，你可能会发现他们各自使用自己的自动化版本解决相同问题。但最好由一个中央团队运行一个为整个云环境服务的自动化工具。集中管理工具将减少组织内的重复工作，但这也意味着你需要一个一刀切的解决方案。


  ### 第三方自托管


  就预建自动化解决方案而言，有免费和开源工具可用，也有付费软件许可选项。在这种部署模式下，团队使用第三方软件，但在自己的环境中运行并自行维护和管理服务。在开源领域，一个常被推荐的工具是由
  Capital One 团队创建的 Cloud Custodian 应用程序。你需要考虑运营和可能定制第三方自托管解决方案的成本。


  ### 第三方 SaaS


  此选项消除了运行和管理软件的需求。第三方托管软件解决方案可提供最简单的设置和可能最快的自动化时间。供应商通常会提供简单的工具来处理在你的云账户中所需的设置，以便供应商平台与你的环境集成。复杂的指标和配置已经开发完成，通常附带易于使用的仪表板和设置屏幕。你通常需要支付月费，这很容易与工具本身的收益进行衡量。这种模式确实会带来安全影响，我们稍后会介绍。


  ![](img/4d4736bc293fd892d1da81802d0f9520_364_0.png)


  并非总是简单的构建与购买；一些公司采用买入并增强的混合方法，即将现成工具的 API 数据或建议与其自己的内部自动化相结合，这样可以避免构建 FinOps 的数据摄取/管理能力，但可以拥有实际触及其基础设施的代码。


  HERE Technologies 的 Jason Fuller 分享说，虽然他使用供应商 FinOps 平台来驱动其报告和建议，但他依赖于基于开源工具 Cloud
  Custodian 的内部分支进行大量定制的内部自动化代码来实际在其环境中实施更改。这种构建与购买的混合实施是一种三管齐下（供应商 + 开源 + 自定义代码）的方法，他在四个大型云支出者处从事
  10 年 FinOps 后已将其打磨成熟。


  ## 自动化协同工作


  自动化工具很少孤立运行。随着时间的推移，尤其是在你的云足迹增长时，很可能有多个工具同时运行。


  ### 集成


  工具之间的集成非常强大，这是你应该寻找并利用的。避免使用许多各自做相同事情的独立工具。例如，如果你的组织已有现成的工单系统，你理想情况下应实施能够在该现有系统中为行动项目生成工单的
  FinOps 工具，而不是构建单独的任务跟踪系统。


  如果你选择的自动化工具没有与你的其他软件工具直接集成，自动化工具仍可能支持可扩展的事件处理。然后你可以接收自动化工具内部生成的事件通知，并构建一个扩展来将事件连接到你的其他软件包之一。这是一种扩展功能的好方法——例如，向你的聊天应用程序发送特定任务已完成的通知、在你的工单系统中为必要的后续任务生成工单，或根据检测结果实施你自己的自动化修复任务。


  ### 自动化冲突


  部署多个自动化工具时，你需要确保它们不会相互冲突。如果一个工具试图启动服务器而另一个试图关闭它，你可能会导致自动化相互对抗其操作。如果你为特定功能部署自动化工具，而该工具还有你不打算使用的其他功能，请考虑是否可以删除该服务对该停用功能执行云账户更改的权限。


  我们见过公司为其提供的不同功能部署不同的自动化工具，却发现两个工具都在尝试控制相同的资源。或者一个团队会实施与其现有自动化冲突的自己的自动化。


  这是一个更难解决的问题。为防止这种情况，你需要让整个组织了解已部署的自动化情况，并让团队共同工作以确保他们了解其云账户中任何计划自动化可能产生的影响。


  理想情况下，自动化应在与外部事物冲突时通知你。例如，如果自动化在短时间内停止服务器实例超过设定次数，它应发送警报并阻止任何进一步更改。


  有时自动化服务冲突的不是其他工具，而是人员。你可能有自动化会停止服务器实例，而你的团队成员需要访问该服务器。这可能导致团队成员启动实例，却看到自动化将其停止。同样，你应确保团队已得到充分教育，包括如何将资源从自动化中排除。


  ![](img/4d4736bc293fd892d1da81802d0f9520_366_0.png)


  曾任 Cardinal Health 和 Nationwide 云优化总监的 Joe Daly 讲述了他通过手动删除一个通过自动化与生产环境关联的非生产资源而意外导致生产环境宕机的故事。如前所述，组织内了解正在使用的自动化至关重要。如需听完整故事，请查看
  FinOpsPod 播客第 13 集，标题为“FinOops——惨痛的教训”。


  ## 安全与保障


  安全性是任何 FinOps 自动化工具的首要关注点。通常，FinOps 自动化需要对你的云环境拥有非常高的访问级别，无论只是描述账户中所有配置的方式，还是更改（启动/停止/删除）资源本身的能力。这种访问可能直接导致拒绝服务攻击、数据丢失、损坏或保密泄露。


  安全性经常被引用为组织内部不使用第三方工具的主要原因。让安全团队批准需要广泛访问云账户的第三方工具的使用确实很难。然而，仅因为你的团队编写了软件并不意味着它将绝对安全。你必须确保部署的所有自动化工具都具有执行所需任务的最小权限，同时保护软件免受外部威胁。


  很可能成功的第三方供应商已在安全方面投入了大量时间和精力。查看他们的文档和之前的任何安全公告将帮助你衡量该供应商对安全作为其产品一部分的重视程度。


  如果你参考 FinOps 成熟度模型，你可能会选择最初以只读模式集成第三方 SaaS 工具。你可以随后将该工具的通知作为输入，并使用自己的工具自动化修复操作。当你对供应商更有信心时，你可以开始允许他们代表你执行更多操作，直到启用所有所需功能。




  ## 如何开始


  你不应该试图一次性实施太多自动化。这不可避免地会导致问题，并让你难以确保所部署的自动化有效运行。以下是一些建议：


  ### 从简单开始


  从简单的工具和自动化目标组合开始。试图一次性构建非常复杂的自动化集合和/或协调多套工具，通常会导致不必要的挑战。


  ### 先以告知模式使用


  以告知模式启动初始自动化，自动化潜在问题的发现和告警，但不进行修复，这样可以让你知道如果启用更改功能它会做什么。


  ### 建立对自动化的信心


  了解某个自动化领域在启用后会采取哪些操作。通过与团队分享结果来建立信心，确保他们对引入自动化感到舒适。


  ### 充分测试


  一旦对自动化建立了信心，先在开发/测试账户中开始强制执行操作，然后再在小范围内测试，最后再推广到更广泛的用户群体。


  ### 不要全部自己构建


  依赖商业或开源工具。这不仅能节省时间，还能确保你获得最新的经过实战检验的解决方案。


  ### 衡量性能


  自动化应被衡量以确保其产生预期效果。随着自动化在业务中扩展，衡量性能不下降至关重要。


  我们再次建议加入像 FinOps Foundation 这样的组织，让你能与经验丰富的从业者建立联系。了解他们使用哪些工具以及获得的好处。


  ![](img/4d4736bc293fd892d1da81802d0f9520_367_0.png)


  > 我们无法过度强调从小开始的重要性。请记住 Gall 定律，其精辟地指出“所有有效运作的复杂系统，都是由曾经有效运作的更简单系统演化而来。”


  ## 要自动化的内容


  成功的 FinOps 从业者拥有多种自动化工具可供使用。某些自动化必须非常特定于其组织的运作方式。但我们看到一些常见的自动化解决方案被拥有成功 FinOps 实践的组织反复实施。


  ### 标签治理


  一旦为组织定义了标签标准，你就可以使用自动化来确保其得到遵循。你首先识别缺少标签或标签应用不正确的资源，然后让负责这些资源的团队处理标签违规行为。随后，你可以停止或阻止资源以迫使所有者采取行动，并可能朝着为这些资源制定删除/移除策略的方向努力。然而，删除资源是一种高影响的自动化，因此很少有公司达到这一水平。我们建议不要在未经过前期低影响的自动化层级的情况下，直接删除违规资源。


  ### 计划资源启动/停止


  资源管理和自动化使你能够在不使用时（例如在你离开办公室时）安排资源停止，然后在需要再次使用时将其重新上线。此自动化的目标是在团队影响最小化的同时，在资源关闭的时段实现大量节省。这种自动化通常部署在开发和测试环境中，在非工作时间资源缺失不会被注意到。你应确保实施方案允许团队成员跳过计划活动，以防他们在加班时需要保持服务器活跃。此外，取消计划任务不应将资源完全从自动化中移除，而应仅跳过当前执行。


  ### 使用量减少


  第 15 章涵盖了资源 rightsizing 和空闲资源检测等内容。减少类自动化可消除此类浪费，或至少向负责员工发送警报以推动更好的成本优化。让自动化从 Trusted
  Advisor（适用于 AWS）等服务、第三方成本优化平台或资源指标直接获取资源数据，可以轻松地向负责资源的团队成员发送警报以进行调查，或在某些环境中自动停止或调整资源大小。


  ## 结论


  自动化为你提供了提高流程可靠性和一致性的机会，对 FinOps 实践和流程进行检查和告警。了解你试图通过自动化实现真正的目标非常重要，并认识到自动化并非免费。


  总结如下：


  - 从小开始，衡量所实现的结果和收益，并缓慢迭代你的自动化，严格遵循 Gall 定律。

  - 自动化的成本来自软件的购买或构建；自动化本身消耗的资源；以及管理、维护和监控自动化的任何工作。

  - 通过明确你希望从自动化努力中实现的目标，你可以衡量自动化的成本与潜在的业务收益。

  - 在从零开始构建自动化之前，考虑从第三方 SaaS 或软件供应商处购买一个享有良好声誉的解决方案。

  - 然而，在实施外部解决方案之前，你必须考虑其对云环境的安全性和功能方面的影响。


  在下一章中，我们将探讨一种高级 FinOps 流程，该流程使用指标和警报实现即时优化。

  '
- "## 基于指标的成本优化\n\n*基于指标的成本优化*（MDCO）是衡量潜在优化并使用目标和目标线触发操作流程以执行它们的驱动因素。当你购买承诺时，你处于操作阶段。有了\
  \ MDCO，你可以使用指标阈值来精确确定何时采取这些行动。\n\nMDCO 也可以被描述为“懒人式云成本管理方法”。MDCO 的主要规则是：不要做任何事。也就是说，在你拥有衡量行动影响的指标之前，不要做任何事。如果你进行优化但没有指标来告诉你它们对支出的影响是积极还是消极，那么你就没有做\
  \ MDCO。\n\n到本章结束时，你将知道如何正确使用指标来驱动你的成本优化。\n\n### 核心原则\n\n有几个核心原则定义了 MDCO 实践：\n\n\
  - *自动化测量*\n- 由计算机执行测量，而不是人类。\n- \n- *目标*\n- 没有目标的指标只是漂亮的图表。\n- \n- *可实现的目标*\n- 你需要正确理解数据以确定现实的结果。\n\
  - \n- *数据驱动*\n- 行动不是驱动你的数据：数据驱动你采取行动。\n\n我们将在本章中解释这些原则的每一个。\n\n### 自动化测量\n\n加载账单数据、生成报告和生成优化建议都是应由自动化或通过\
  \ FinOps 平台完成的任务。当云服务提供商提供大量账单数据时，所有这些活动都需要自动启动。让 FinOps 从业者尝试运行临时数据处理和报告生成会减慢 MDCO\
  \ 的速度，并导致对异常的响应缓慢。\n\n可重复且可靠的数据处理让你能够专注于手头的真正任务：省钱。然后你可以花时间完善所遵循的流程，并深入了解成本优化计划以及它们如何在数据/指标中体现。\n\
  \n### 目标\n\n对于 MDCO，目标线至关重要。我们在第 14 章中写过目标线如何为图表提供更多上下文。我们一直坚信，没有目标线的图表是不完整的。没有它，你只能确定图表本身的基本信息，而不能确定图表对组织的意义。目标线创建了一个阈值，可据此得出警报和操作的触发点。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_372_0.png)\n\n人类很难理解非常大数字的规模，这就是为什么上下文目标如此重要。为了抵消这一点，Hans\
  \ Rosling 的书《Factfulness》（Flatiron Books, 2020）中的一个提示被 Spotify 的 Anders Hagman 在最近一次\
  \ FinOps Foundation 月度峰会上引用。在书中，Rosling 告诉读者“每当有人给你一个大数字时，就要求另一个数字”以便进行比较。在 MDCO\
  \ 中，要使你的指标提供价值，你需要一个可供衡量的目标。\n\n### 可实现的目标\n\n在成本优化计划中，有多个指标需要监控。正确跟踪每个指标可实现你的成本优化运营策略。每个单独的优化对实现的节省会产生不同的影响，因此不应将所有优化视为相同。在合并指标时，应根据优化的节省潜力对数据进行标准化。\n\
  \n最常见的测量不准确的指标之一，也是可以帮助你理解 MDCO 中可实现目标的指标之一，是承诺覆盖率。\n\n\n\n有多种衡量成本优化绩效的方法，每种方法都代表了对效率的一种特定视角。取决于所使用的方法，100%\
  \ 的优化可能无法实现。对于 MDCO，需要完全可实现度量来确定执行操作的最佳时机。\n\n让我们通过承诺覆盖率来更详细地解释这一点。\n\n## Commitment\
  \ coverage\n\n承诺覆盖率是衡量有多少使用量按即用即付费率计费、与按折扣费率计费的指标。通常，组织会设定一个目标覆盖率——常见的是 90%。让我们比较各种方法。\n\
  \n在传统模型中，你通过统计拥有的所有承诺小时数，然后用该数字除以该期间运行的总小时数来衡量覆盖率（见图 22-1）。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_373_0.png)\n\
  \n图 22-1. 通过原始小时数计算的承诺覆盖率\n\n即使图 22-1 中衡量覆盖率的方式是正确的，这可能也不是正确的做法。随着弹性基础设施的出现，资源频繁出现和消失，有些小时不应由承诺覆盖，因为在该时间段内使用量不足以证明其合理性。理想情况下，你不应包含所有低于盈亏平衡阈值的用量，低于该阈值承诺的成本会高于节省的费用。通过剔除这些不可覆盖的小时，你可以衡量可覆盖小时的覆盖率（见图\
  \ 22-2）。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_374_0.png)\n\n图 22-2. 通过可覆盖小时数计算的承诺覆盖率\n\
  \n如果你剔除图表峰值中不应被覆盖的不可覆盖小时（图 22-2 中标记为 H、F、G 和 E 的那些），你就能更清晰地了解真实的覆盖百分比。A 和 B 由承诺覆盖，剩余由资源\
  \ C、D 和 E 覆盖的小时仍按即用即付费率计费。购买额外的两个承诺可提供 100% 覆盖率，且这两个额外承诺将节省费用。\n\n到目前为止，你一直把图表中的单元格当作同一事物：B\
  \ 与 A 相同，与 C 相同。但实际上，每个单元格（或小时或秒）可能是完全不同规模的使用量。标记为 A 的使用量每小时可能超过 $1，而 B 可能每小时仅 $0.25。这样每个承诺的节省金额就会大不相同。主要是为了节省而购买承诺，因此当它们差异如此之大时，将其作为一致的块来衡量会产生误导性结果。目标是弄清楚你的覆盖率中有多少实际上在产生节省。\n\
  \n通过用承诺覆盖小时单元格将其转换为可能的节省额，可以清楚地显示承诺对云账单的影响。根据每种使用类型的相对节省额调整图表，你会得到一个截然不同的图景（见图 22-3）。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_375_0.png)\n\n图 22-3. 通过加权可覆盖小时数计算的承诺覆盖率\n\
  \n图 22-3 显示你实际上已接近 76% 的可实现节省。图 22-1 中的原始评估显示你处于非常低覆盖率的情况。但新的加权位置也剔除了不应实际承诺的小时，显示你的状况其实并不算糟糕。\n\
  \n关键要点是，承诺不同的资源会实现不同金额的节省。并非所有使用量都可覆盖，因此将所有使用量都纳入承诺覆盖率会导致更难以设定目标的指标。然而，通过以可实现覆盖率为思路，你可以更准确地确定如何以及在何处进行改进。\n\
  \n## Savings metrics that make sense for all\n\n汇总所有应被承诺项目的节省额，可得出总潜在节省的概念。例如，假设图\
  \ 22-3 中的所有单元格在用承诺覆盖后每年可节省 $102,000（总潜在节省）。因此，$102,000 的 76% 是当前已实现的节省额（已实现节省），剩余\
  \ 24% 未覆盖且仍按即用即付费率计费（未实现潜在节省）。\n\n这与 FinOps 的语言相呼应。当你从讨论使用小时数和承诺覆盖率转向“你目前已实现 $102,000\
  \ 总潜在节省的 76%”这样的对话时，这能让组织中的每个人都了解你目前的状况和可以去向。此外，它消除了对基于承诺折扣复杂性的深入理解需求，并促进组织内部的沟通。你已创建了一个共同的词汇以实现相互理解。\n\
  \n## Combining metrics\n\n要确定承诺的绩效指标，你需衡量在特定时间段内承诺被使用与未被使用的比例。这称为你的承诺利用率。在单个承诺层面，你按时间进行监控，衡量承诺对资源使用应用折扣的小时数（或秒数）与承诺无使用可折扣的小时数（或秒数）的比例。\n\
  \n然而，如果你将承诺利用率汇总以显示一个整体绩效指标，表现不佳的单个承诺可能会被掩盖。相反，你应衡量单个承诺，并在其单独表现不佳时发出警报。让我们在图 22-4\
  \ 中看一个例子。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_376_0.png)\n\n图 22-4. 随时间推移的承诺使用情况\n\
  \n你使用图 22-4 中的使用情况来确定你的承诺利用率，基于拥有七个承诺。你可以看到前四个承诺的利用率为 100%。第五个承诺的利用率为 90%，第六个为 80%，最后一个仅为\
  \ 50%。\n\n如果你只是将利用率平均（100% + 100% + 100% + 100% + 90% + 80% + 50%）/ 7，你会得到 88.5%\
  \ 的利用率。表面上 88% 的整体利用率看起来相当不错，不会引起担忧。如果你的目标利用率为 80%，MDCO 会反映无需更改。但请记住：有一个单个承诺的利用率仅为\
  \ 50%，这值得你的关注和可能的调整。\n\n## Data Driven\n\n多年来，团队一直使用指标来运营其服务，监控服务性能、资源使用率和请求率等项目作为早期预警系统，当阈值被超过或事件被触发且需要相应调整时提醒团队。\n\
  \n在没有指标的情况下运营 FinOps 优化，无法真正识别优化是否达到目标。事实上，没有指标你甚至无法设定目标。跟踪的指标建立在我们在第 9 章讨论的反馈循环之上。指标帮助你识别未优化或表现不佳的地方，以便进行改进。换句话说，指标帮助你衡量成本优化节省了多少。\n\
  \n将 MDCO 应用于 FinOps 使你能够衡量成本优化的预期成果。当指标显示某项更改未成功时，你可以将其作为早期预警，表明该更改需要进一步调整，或完全回滚。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_377_0.png)\n\n在 FinOpsPod 第 11 集，Box.com\
  \ 的 TJ Johnson 解释了 FinOps 中大多数可视化如何帮助你回答四个主要问题，这些问题与 MDCO 方法非常契合，尽管他使用了略有不同的术语：\n\
  \n- *到目前为止我做得怎么样？* 衡量你目前所处的位置。\n- *我如何变得更好？* 识别你可以进行的优化并帮助你选择想要处理的领域。\n- *我真的变得更好了吗？*\
  \ 衡量你随时间的改善情况，形成一组关键动量指标（KMI），帮助你监控你是否随时间变得更好或更差。\n- *我是否达到了目标？* 提供有关你何时完成先前设定的目标的反馈。\n\
  \n回答这四个问题的度量体现了 DevOps 思维，其中不断有数据流入，为应用团队、财务团队和业务的决策提供支持。收听该集节目，了解他在 Box.com 是如何做到的完整故事。\n\
  \n## Metric-Driven Versus Cadence-Driven Processes\n\n在第 18 章，我们讨论了围绕基于承诺折扣的策略。大多数公司在开始使用承诺时，会按计划（每月、每季度甚至每年）购买其承诺。我们称之为节奏驱动或计划驱动的成本优化。\n\
  \n\n\n如果您以缓慢的周期购买，最终会产生大量未覆盖的使用量。图 22-5 显示了随时间变化的使用情况，深灰色部分显示了您拥有的承诺覆盖率。可以从图表中看出，承诺的购买是在相对固定的周期内进行的，而在这几次购买之间，资源使用量持续增长。通过更频繁地购买承诺，您可以实现更大的节省。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_378_0.png)\n\n图 22-5. 执行不频繁时的承诺覆盖率\n\n\
  图 22-6 显示了一个更频繁的承诺购买计划。频率并不总是随时间保持一致，但由此产生的承诺覆盖率紧密跟随资源使用量的增长。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_378_1.png)\n\
  \n图 22-6. 执行频繁时的承诺覆盖率\n\n基于计划的成本优化对于入门来说是可以的，但继续缓慢地进行购买会让节省的机会流失。然而，过于频繁地查看承诺会导致时间浪费，因此您需要在两者之间取得平衡。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_378_2.png)\n\n通过使用设定目标的指标，您可以快速确定何时未达到目标。\n\
  \n指标会在需要时触发警报以执行优化。MDCO 可用于所有可用的优化措施。正确衡量指标至关重要，以便在正确的时间触发优化。设定可实现的目标也很重要。\n\n##\
  \ 设定目标\n\n对于某些指标，例如承诺覆盖率，我们建议首先设定一个保守的目标，然后逐步提高到 80% 等较高的目标。然而，对于利用率来说，设定较低的目标是没有意义的。将“从低开始”的模式应用于承诺利用率最终会花费比节省更多的成本。\n\
  \n> Stories from the Cloud—Mike\n> \n> 在 Atlassian，我的团队旨在将承诺的利用率达到 90%，以获得尽可能多的节省。当单个承诺的利用率降至\
  \ 90% 以下时，会触发计算机创建工单，通知我需要进行更改。此时，对受影响承诺的修改或交换会使利用率水平回升。此过程展示了正确衡量并采取行动的指标如何促进数据驱动的决策。\n\
  \n让我们看看如何将指标应用于使用量减少方法。删除未使用的资源和调整资源大小以适应未充分利用的资源也能产生节省。按成本百分比计算的总潜在节省被称为浪费百分比。每月花费\
  \ 100,000 美元且潜在节省为 5,000 美元的团队将被认为浪费率为 5%。相比之下，每月花费 10,000 美元且节省潜力为 2,000 美元的团队浪费率为\
  \ 20%。以这种方式衡量时，团队可以进行比较，并且可以为浪费设定通用目标。当浪费超过设定额度时，您可以专注于减少它。\n\n## 采取行动\n\n我们提到 MDCO\
  \ 涵盖了 FinOps 生命周期中的全部三个阶段。我们已展示如何使用这些数据来建立可见性、衡量潜在优化措施并根据这些数字设定目标，所有这些都是告知和优化阶段的任务，但我们仍将本章放在书籍的运营阶段部分。这是因为\
  \ MDCO 的成功取决于您在设置 MDCO 的报告和警报后以及这些警报触发时所采取的行动，需要您对优化绩效所需的变更做出响应。\n\n如前所述，如果没有明确定义的流程和工作流，您不太可能实现组织的\
  \ FinOps 目标。重要的是要明确谁负责处理 MDCO 警报，购买新承诺等事项的正确审批流程是什么，以及修改和/或交换现有承诺的正确操作顺序是什么。\n\n\
  在组织内部建立预先批准的承诺购买计划。给予 FinOps 团队根据需要购买承诺的自由——每月最高可达一定金额——可以减少承诺覆盖率警报与购买更多承诺以弥补短缺之间的滞后时间。改进流程有助于减少采取行动的延迟。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_380_0.png)\n\n主动和被动之间存在微妙的平衡。什么应该是被动的？什么应该是主动的？不要像基于节奏的成本优化那样对时间做出反应；应利用\
  \ MDCO 的能力对成本数据做出反应。利用这些数据更快地做出反应。诸如预测之类的功能可以帮助您在阈值被跨越之前预测何时会出现，从而使您能够主动应对。通过确保这种主动的数据驱动预测，您将能够快速应对可能对云账单产生巨大影响的现实成本情况。\n\
  \n## 将一切整合起来\n\nMDCO 让您确信指标会在需要时触发您进行调整。它使您从对日历上的任意计划（例如每月 RI 管理）做出反应，转变为对数据变化做出反应。但不要即兴做出反应；应为指标超出范围时将要执行的职能活动制定计划，例如购买额外的\
  \ RI 承诺。并确保计划好谁将执行哪些操作。\n\n前 Pearson 云 FinOps 总监 Ashley Hromatko 提出了这个示例——见表 22-1——说明她如何使用\
  \ MDCO（结合 FinOps Foundation 的 Finops Assessment 中的评估透镜）来定义谁将确定成本威胁所需的变更的明确流程，并通过自动化完成循环以在环境中执行变更，从而实现了显著的成本节省。\n\
  \n表 22-1. 为管理多部分上传而实施的策略变更和自动化流程\n\n| 阶段 | 视角 | 流程 | 操作 |\n|---|---|---|---|\n|\
  \ Inform | Knowledge | Awareness of impact for change | 800+ AWS accounts and no\
  \ lifecycle rule configured for S3 incomplete multipart uploads |\n| Inform | Process\
  \ | Who will make decisions | Spending 11K per month on incomplete multipart uploads,\
  \ no single account is exceeding more than 1K |\n| Optimize | Metrics | Baseline\
  \ KPIs for success | FinOps submit policy to Cloud Governance board for review,\
  \ vote to move to implement |\n| Optimize | Adoption | How will implementation be\
  \ communicated | Decision made for remediation after 14 days and ability to opt-out\
  \ |\n| Operate | Automation | Offload repetitive tasks to tooling | Cloud Custodian\
  \ policy created by Cloud Management engineering team |\n\n结果是一个流程，该流程将生命周期策略附加到所有\
  \ S3 存储桶，并在 14 天后自动删除未完成的多部分上传。正如图 22-7 所示，该策略在下个月带来了显著的自动化成本节省。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_381_0.png)\n\
  \n图 22-7. 实施多部分上传策略后的支出下降\n\n## 结论\n\n以指标驱动的成本优化涵盖了 FinOps 生命周期中的全部三个阶段，可见性和目标推动着成本优化流程。自动化在提供可重复且一致的流程方面发挥着重要作用。\n\
  \n总结如下：\n\n- 所有成本优化都由指标驱动，所有指标都需要可实现的目标。\n- 计算机应执行重复的数据分析，并在指标偏离目标时发出警报。\n- 所有正在进行的变更都应反映在指标中。最终节省应增加，成本优化效率应保持高位。\n\
  - MDCO 的关键在于准确知道执行优化流程的最佳时机。\n\n就在我们认为自己已经掌控了这个 FinOps 世界时，工程师们通过容器化在云之上引入了一个全新的世界。接下来，我们将探讨使用容器进行集群化的影响，以及如何利用现有的\
  \ FinOps 知识来解决由此产生的新问题。\n\n\n"
- "## 容器世界的 FinOps\n\n为了支持微服务架构的采用，容器获得了流行。过去几年里，组织运行的容器环境数量迅速增加。管理单个运行中的容器实例相当简单，但在众多服务器实例上运行数百、数千甚至数万个容器就变得困难了。因此出现了像\
  \ Kubernetes 这样的编排解决方案，使 DevOps 团队能够维护配置并编排容器舰队的部署和管理。\n\n由于容器和容器编排器正成为许多团队的热门选择，了解这些容器化工作负载对\
  \ FinOps 实践的根本影响至关重要。\n\n影响 FinOps 最重要的原因是大多数容器环境都是复杂的共享环境。像容器这样的共享资源——运行在共享的云计算实例上——会导致成本分配、成本可见性和资源优化方面的挑战。在容器化世界中，传统的\
  \ FinOps 成本分配方式与仅使用虚拟机 (VM) 时不同。你不能简单地将资源的成本分配到标签或标记上，因为每个云或本地资源可能都在运行不断变化的多个容器集合，每个容器支持不同的应用程序。它们也可能连接到组织内不同的成本中心。不过不用担心。在本章中，我们将探讨可以让你在容器世界中成功运营\
  \ FinOps 实践的变更和调整。\n\n## 容器 101\n\n让我们快速回顾一下容器基础知识，供不熟悉容器的人使用。这也有助于在整章中建立对这些组件的共同理解。\n\
  \n容器，简单来说，就是打包软件的一种方式。所有需求和设置都烘焙到可部署的镜像中。像 Kubernetes 这样的容器编排工具帮助工程师以可管理、可维护的方式将容器部署到服务器上。\n\
  \n本章中我们将使用以下几个关键术语：\n\n*镜像*\n一个包含需要运行的软件的容器快照。\n\n*容器*\n容器镜像的一个实例；你可以在同一时间运行同一镜像的多个副本。\n\
  \n*服务器实例/节点*\n服务器（例如，EC2 实例、VM、物理服务器）。\n\n*Pod*\n这是 Kubernetes 的概念。Pod 包含至少一个容器，但也可以包含一组容器，并将它们视为可在集群上调度和扩展的单个资源块。\n\
  \n*容器编排*\n编排器管理服务器实例集群，并维护容器/Pod 的生命周期。容器编排器的一部分是调度器，它将容器/Pod 调度到服务器实例上运行。示例包括 Kubernetes\
  \ 或 AWS Elastic Container Service (ECS)。\n\n*集群*\n由容器编排管理的服务器实例组。\n\n*命名空间*\n另一个\
  \ Kubernetes 概念，命名空间是在单个集群内隔离资源组的一种机制，其中 Pod/容器可以与其它命名空间分开部署。\n\nKubernetes 集群（见图\
  \ 23-1）由多个节点（服务器实例）组成，这些节点在 Pod 内运行容器。每个 Pod 可以由不同数量的容器组成。节点本身支持用于隔离 Pod 组的命名空间。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_385_0.png)\n\n图 23-1. Kubernetes 集群的基本视图\n\
  \n## 向容器编排的迁移\n\n工程师出于可用性、可靠性、可扩展性和易于管理等多种原因决定转向容器。请记住，FinOps 的目标是确保你为业务做最好的决策，在成本和技术需求之间持续平衡。成本并不是迁移到容器的唯一驱动因素，但能够在容器模型和\
  \ VM 模型中核算应用程序成本（包括双方的所有相关成本和影响）是有助于为业务提供的信息。\n\n当你从大量单独的云服务器实例转向像 Kubernetes 这样的集群编排解决方案时，通常会得到数量更少但更大的服务器。通过将多个容器工作负载打包到这些更大的服务器中（也称为装箱），你可以通过在同一节点上隔离运行许多容器来实现更好的资源利用率，从而获得效率。\n\
  \n一个类比可能有助于你理解这个概念：集群中的每个服务器实例就像一场俄罗斯方块游戏。容器是形状和大小各异的方块，而容器编排器试图将尽可能多的这些“方块”（容器）放置到服务器中。\n\
  \nKubernetes 等平台允许你设置不同的资源保证，从而允许你在服务器实例上打包更多容器，我们将在本章后面更深入地介绍这一点。\n\n当在单个服务器实例上运行多个容器时，你会失去对每个容器单独成本的可见性，因为云服务提供商只会提供底层服务器实例使用情况的计费数据。当服务器实例运行多个容器时，你需要更多信息来划分使用成本。\n\
  \n换句话说，每个由多个工作负载共享的云资源都需要有补充数据，以便显示每个工作负载使用了多少云资源。容器并不平等地消耗服务器。一些容器可以配置为使用比其他容器更多的服务器实例资源。一些容器运行数周或数月。但研究表明，大多数容器通常运行时间很短，平均不到\
  \ 12 小时，有些可能只运行几秒钟。由于不同大小的容器以不同的速率进出，不频繁地拍摄集群使用情况的快照无法提供你所需的详细成本分配的足够采样。跟踪所有容器进出的详细数据将帮助你确定单个服务器成本如何分摊，以及服务\
  \ A 的容器与服务 B 的容器各自使用了服务器的多少资源。你将在第 357 页的“容器比例”中看到这些数据是什么样子的。\n\n然而，收集这些数据的困难之一就是其庞大的数据量。云计费数据文件已经非常庞大，但你可能拥有的容器数量是\
  \ VM 的数倍，而且每个容器可能在资源之间多次迁移，每次迁移都会产生一条新的数据行。这是一个困难的挑战，如果你希望以详细和精细的方式解决它，就需要一些专门的工具。\n\
  \nFinOps 从业者需要为团队准备应对共享资源对成本可见性和成本分配流程的影响。清楚了解在容器世界中保持成功的 FinOps 实践所需的条件至关重要，并确保\
  \ DevOps 团队实施这些条件。\n\n## 容器 FinOps 生命周期\n\n当你审视容器化给 FinOps 带来的挑战——成本可见性、成本回溯/分摊和成本优化——你很快就会意识到你遇到了与迁移到云时相同的困难。容器代表了在云虚拟化之上又一层虚拟化，也称为容器化。虽然这可能感觉像是倒退，但请记住，你已经积累了解决这些挑战所需的所有知识、流程和实践。你只需要将方法建立在最初如何解决云问题的基础上。\n\
  \n因此，你可以将容器化 FinOps 挑战划分为与更广泛的云 FinOps 相同的 inform、optimize 和 operate 生命周期。\n\n##\
  \ 容器告知阶段\n\n你的首要关注点应该是生成报告，使你能够确定团队运营的集群上各个容器的成本。换句话说，你需要建立对容器支出的可见性。\n\n## 成本分配\n\
  \n你将被云服务提供商为构成集群的每个服务器实例收费。当容器部署到集群中时，它们会消耗集群的部分资源容量，例如 CPU、内存和存储。即使容器内的进程没有消耗为该容器预配的所有资源，在某些情况下它会阻止其他容器使用该容量，因此你必须为此付费。这就像你向云服务提供商预配服务器一样。无论你是否使用，你都必须为该服务器资源付费。来自服务和发往服务的网络流量成本本身就是一个挑战，也应包含在内。分配给单个节点或服务器实例的网络成本可能支持多个容器，相关成本需要按每个容器的使用情况进行拆分。网络成为一种需要公平分配模型的共享成本，理想情况下是通过评估每个容器的实际网络流量量并根据这些量分配网络成本。\n\
  \n要分配在集群上运行的容器的单独成本，你需要某种方法来确定单个容器消耗了底层服务器的多少资源。我们将在下一节更详细地介绍这一点。\n\n你还需要考虑运行集群的卫星成本。管理节点、用于跟踪集群状态的数据存储、软件许可、备份和灾难恢复成本都是你成本分配策略的一部分。这些间接成本都是运行集群的一部分，必须在成本分配策略中予以考虑。\n\
  \n## 容器比例\n\n管理集群的最大问题是你共享底层资源，因此仅凭云账单无法获得分配的完整可见性。请记住，云服务提供商只能观察 VM 超级管理程序提供的指标，而不能观察操作系统或进程，除非你使用他们的托管服务。这种可见性缺失意味着提供商无法跟踪你的容器以及它们使用了服务器的多少资源。因此，对于你的\
  \ FinOps 团队来说，要进行分摊\n\n为了将底层服务器的成本分摊到正确的团队和服务，需要运行容器集群的团队报告每个服务器实例上运行的容器。通过记录每个容器使用各服务器的比例，可以丰富你的云计费数据。\n\
  \n## 自定义容器比例\n\n测量底层云服务器实例被每个容器消耗的比例是一个复杂的过程。但你可以先从使用的 vCPU 和内存量开始。\n\n表 23-1 给出了一个示例，帮助你理解这些数据。\n\
  \n在表中，有一个服务器实例拥有四个 vCPU 和 8 GB 内存，成本为每小时 1 美元。该服务器是集群的一部分，在特定的一小时内运行容器 1–4。\n\n\
  表 23-1. 服务器实例上的示例容器分配\n\n| 服务器ID | 容器 ID | 服务标签 | vCPU | 内存 (GB) | 时间 (分钟) | 比例\
  \ |\n|---|---|---|---|---|---|---|\n| i-123456 | 1 | A | 1 | 2 | 60 | 25% |\n| i-123456\
  \ | 2 | A | 1 | 2 | 60 | 25% |\n| i-123456 | 3 | B | 0.5 | 1 | 60 | 12.5% |\n| i-123456\
  \ | 4 | C | 1 | 2 | 15 | 6.25% |\n\n比例计算在查看容器 1 和 2 时看起来相当简单。它们在整个计费小时内使用了四分之一的\
  \ vCPU 和内存，因此你分摊四分之一的服务器成本。由于这两个容器都运行在同一服务（A）上，你将 50% 的服务器成本分配给服务 A。\n\n容器 3 看起来也有类似的情况。然而，这次它使用的服务器资源更少。\n\
  \n当你查看容器 4 时，你会看到它使用了服务器实例的 25%，但这次只有一小时中的 15 分钟（25%）。当你将时间乘入时，其比例数据会降低：0.25 × 0.25\
  \ = 6.25%。\n\n在某些情况下，指标的比例与底层服务器并不完全对称，这在计算比例时会造成问题。我们见过解决此问题的两种主要方法：\n\n### 最具影响力的指标\n\
  \n如果容器使用的 vCPU 比内存多，则使用该比率来计算比例。\n\n### 加权指标\n\n先对指标（vCPU、内存等）进行加权，然后再用它们来计算比例。\n\
  \n虽然我们建议从 vCPU 和内存开始，但它们并不是确定容器比例时唯一可能重要的指标。你可能需要考虑其他指标，例如本地磁盘使用量、GPU 和网络带宽。根据调度到集群的工作负载类型，最相关的整体指标权重可能因集群而异。还需要注意的是，在\
  \ Kubernetes 中，请求的资源和消耗的资源之间存在差异。通常 Pod 使用的资源少于其请求，但相反的情况也可能发生。在测量使用比例时，我们建议你使用工作负载请求的资源和消耗的资源两者中的较大值。\n\
  \n即使你按上述方式分配集群的成本，仍然可能出现未分配的容量成本。运行中的容器不太可能在所有时间都 100% 使用或请求集群，这会留下未分配也未被使用的剩余容量。\n\
  \n图 23-2 显示了一个每小时成本为 40 美元的单个服务器实例。在此节点上运行着两个容器。团队 A 和团队 B 分别被分配 15 美元和 11 美元的成本，尽管它们容器内的一部分请求容量未使用，可被视为浪费。服务器实例上仍有\
  \ 14 美元的空闲节点容量（可分配容量）需要分配到某个人的预算中。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_389_0.png)\n\
  \n图 23-2. 服务器实例/节点上的未分配容量\n\n我们尚未看到分配多余、可分配节点容量的标准方法。一个选择是让管理服务器实例的团队自行承担成本；另一个选择是根据容器各自对整个节点的使用比例，按公平方式将可分配节点容量的成本分摊给节点内的所有容器。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_390_0.png)\n\n预留容量是软限制，如果节点内仍有额外的可分配容量，Pod\
  \ 能够超出其设定的限制。因此，Pod 消耗的容量可能超过其预留容量的 100%。这意味着在使用的期间，Pod 在整个节点成本中的份额会增加，未预留的节点容量剩余未使用的部分会更少。\n\
  \n这就留下了一个问题：谁应该为多余的容量付费：管理集群的团队，还是拥有在服务器实例上运行的工作负载的团队？\n\n在与成功分配容器成本的组织共事后，我们确定了在存在未分配成本时分配这些成本的两种主要策略：\n\
  \n## 将空闲成本分配给中央团队（推荐选项）\n\n由于你需要一种分配策略来确保集群成本能够 100% 分配，一些组织会将这些多余容量成本分配给运行集群的团队。这些团队拥有集群成本的预算和预测，因此通过将多余容量成本映射到他们身上，你可以激励该团队优化容器调度、在工作负载允许的情况下减小集群规模，并将集群浪费降至最低，从而减少这些多余容量成本。\n\
  \n> 运行和维护集群的团队可以在集群/节点级别看到可分配成本的可视性。在大多数情况下，通过部署的服务/Pod 的实际使用取决于实际用户设定的资源请求，例如为所有人运行平台服务的平台团队以及各自应用程序的开发团队。平台团队最适合调整集群规模、切换到其他实例类型，或设置集群自动扩缩器，通过更好地调整集群规模来总体降低可分配成本，从而提高集群资源的利用效率。\n\
  > \n> —David Sterz，Mindcurv，容器成本分配工作组负责人\n\n## 将空闲成本分摊给使用集群的团队（替代选项）\n\n第二种策略是将多余容量成本分摊给在集群上运行容器的团队。你使用分配容器成本时使用的相同比例数据来确定分配的内容和位置。\n\
  \n这种方法避免了为多余容量成本设立中央兜底预算的需要。\n\n在决定分配多余容量成本的方法之前，我们建议你同时与运行集群的团队和消费集群的团队沟通，以便就如何进行达成一致。\n\
  \n## Google Cloud 中的容器比例\n\n当你使用自定义机器类型时，Google Cloud 会分别对 vCPU 和内存收费，因此如果这些是你用于容器成本分配的指标，就不需要确定容器消耗的底层服务器的比例。如果你只记录分配给在集群上运行的每个容器的\
  \ vCPU 和内存，就可以使用正常的 Google Cloud 价格表为每个容器分配费用。你的总集群成本将表示为整体的 vCPU 和内存费用。当你从这些值中减去记录的容器成本时，剩下的就是未使用的集群成本。\n\
  \n然而，当你使用预定义机器类型时，你将需要为每个容器记录自定义比例数据，如前所述。\n\n## 标签、Label 和命名空间\n\n与服务器实例一样，没有任何标识符的容器使得从外部难以确定其用途。实际上，你可能会最终拥有数百甚至数千个小型容器。拥有标签/标注策略将使你能够对使用情况进行分类。请记住，你以与原生云相同的\
  \ FinOps 模式处理容器，我们希望你现在已经习惯了。因此，你的标准云标签策略能够很好地应用于容器也就不足为奇了。\n\n在容器世界中，你可以为容器打标签/标注。这些标签构成了你用于分配成本的标识。命名空间允许你在单个集群内对资源进行分组。为团队或特定服务创建命名空间，可以创建粗粒度的成本分配组。\n\
  \n容器或 Pod 本身在启动时也可以被标注，提供更细粒度的成本分配机制（如果需要），尽管查看这些标签并据此分摊成本的能力是通过云计费数据之外的工具实现的。\n\
  \n\n\n## 容器优化阶段\n\n与 inform 阶段类似，容器世界中的优化阶段是对为云平台构建的原始 FinOps 实践的直接改编。\n\n乍一看，似乎容器化解决了合理配置问题。毕竟，在同一台服务器实例上运行更多事物看起来更具成本效益。但正如你迄今所见，衡量是否从集群中获得节省是一项复杂任务。\n\
  \n我们听过 FinOps 从业者说，“现在你已迁移到容器，就不需要再进行合理配置了。” 或“空闲资源不再是问题。” 虽然这些说法有些真实成分，但并不能说明全部情况。让我们看看你的\
  \ FinOps 实践需要如何演进才能取得成功。\n\n## 集群部署\n\n如果你将所有容器都在一个集群内运行，可能无法针对不同环境优化集群。将开发容器运行在\
  \ spot 实例上，或运行在离开发者更近的区域，在它们运行在专用开发集群时更容易实现。此外，如果将此开发集群运行在与生产环境分离的开发账户中会更有帮助。\n\n\
  另一种选择是运行多个集群，但运行过多的集群难以管理且不具成本效益。每个集群都会带来管理开销，既包括云资源也包括人员时间需求。此外，当工作负载分散在多个集群上时，最大化集群利用率会更困难。容器分散在集群之间越多，容器填满运行中的服务器的机会就越小，这意味着利用率更低。\n\
  \n在这里找到平衡与我们之前讨论的云资源账户平衡同样重要。与管理和使用集群的团队协同工作，是在组织内找到小型特定领域集群与大型通用集群之间最佳平衡点的最佳方法。\n\
  \n## 容器使用优化\n\n现在我们将逐步调整 FinOps 生命周期更广泛的优化阶段中讨论的使用优化。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_393_0.png)\n\
  \n优化容器存在共享责任模型：运行集群的集中团队负责集群的规模，包括水平/垂直合理配置和工作负载放置，而在集群内运行容器的团队则负责设置并使用适当数量的请求或保证容量。\n\
  \n## 集中化集群的合理配置\n\n本节中的优化责任通常落在管理集群和服务器实例的集中团队身上。\n\n如果你发现集群不具成本效益，最可能的原因是调度不佳和集群资源利用不足。所有运行中的容器停止后仍在运行的集群实例，或大型集群实例上仅运行一个或几个容器，都意味着该实例大部分未被利用——导致每个集群的成本更高，需要进行合理配置。\n\
  \n在容器世界中，你的中央集群管理团队需要应用多种策略进行合理配置：\n\n## 水平合理配置\n\n这指的是你将容器打包到服务器实例上的程度。打包越紧密，在给定时间点需要运行的服务器实例就越少。当操作正确时，你的集群可以根据所需实例数量进行扩展，同时通过避免运行不需要的服务器实例实现成本节约。容器编排器应寻找重新定位容器的机会，以提高服务器实例的利用率，同时释放可在负载下降时——使用自动扩缩容——从集群中移除的服务器实例。随时间跟踪未使用的集群容量量，可让你衡量调度引擎的变化。如果随后更新/调整调度器，使其能够将容器打包到更少的服务器实例上，你就可以衡量效率的提升。\n\
  \n## 垂直合理配置\n\n这指的是更改服务器实例的大小。虽然你应期望容器编排器将容器尽可能打包到最少的服务器上，但还需考虑其他因素。为了高可用性，一些容器应在不同的底层服务器实例上运行。如果这导致服务器实例利用不足，调整服务器实例以使用更少的\
  \ vCPU 和内存将降低成本。\n\n## 工作负载匹配\n\n如果你的容器工作负载与 vCPU 与内存比率不匹配（例如使用更多内存而非 vCPU），那么当服务器\
  \ vCPU 空闲时，容器就没有内存可用。当你的数据告诉你服务器的 vCPU 与内存平衡与容器工作负载不匹配时，你可以运行更匹配的服务器实例类型（例如每 vCPU\
  \ 内存更多的实例），以降低的小时费率运行，从而降低成本。可以在集群中使用多种服务器配置的混合，并将工作负载分配给最匹配容器工作负载的服务器。\n\n## 容器/\
  \ Pod 的去中心化合理配置\n\n在 Pod 内运行容器的团队负责正确调整其从集群请求的容量大小。\n\n即使在已高效装箱的容器中，单独调度到集群上的容器仍可能处于非活动状态。正如你现在所知，容器会消耗集群资源的一部分，因此如果容器大于所需，其成本效益会更低。\n\
  \n而不是跟踪服务器利用率指标以查找空闲服务器实例，团队现在需要跟踪容器利用率指标以识别未使用的容器实例。再次，解决空闲服务器实例所使用的类似概念也适用于容器。\n\
  \n如 Kubernetes 之类的集群编排解决方案允许你请求对已调度容器进行的不同资源类别分配，称为服务质量（QoS）类别。每个 QoS 类别都带来不同的容量分配模型并影响相关的成本分配：\n\
  \n### 保证资源分配\n\n对于关键服务容器，你可能会使用保证资源分配，以确保 Pod 在任何时候都有固定数量的 vCPU 和内存可用。你可以将保证资源分配视为预留容量。容器的大小和形状不会改变。当设置为高而实际使用量低时，此类别对容器空闲成本的潜在影响最大。\n\
  \n### 可突发资源分配\n\n尖峰工作负载可以通过仅在需要时访问更多资源而受益，让 Pod 在底层服务器实例上有容量时使用比最初请求更多的资源。可突发资源分配更类似于某些云服务提供商提供的可突发服务器实例（可突发性能实例如\
  \ AWS 的 T3 或 Google Cloud 的 F4），它们提供基础性能水平，但在需要时允许 Pod 突发。虽然这是一种易于开始的方式，在资源请求低但无限制的情况下更具成本效益，但也可能导致尖峰不可预测的资源消耗，从而损害其他工作负载或因资源缺乏而导致服务性能下降。\n\
  \n### 最佳努力资源分配\n\n此外，开发/测试容器可以使用最佳努力资源分配，这允许 Pod 在有剩余容量时运行，但在没有容量时停止。此类别类似于 Google\
  \ Cloud 中的可抢占 VM 或 AWS 中的 spot 实例。从纯粹的成本效益角度来看，该类别是最好的，因为它没有空闲成本；然而，绝对没有任何保证资源会在任何时候可用，且应谨慎仅用于生产系统上的特定工作负载。\n\
  \n当容器编排器将具有不同资源分配保证的 Pod 混合分配到每个服务器实例时，你会获得更高的服务器实例利用率。你可以为固定资源 Pod 分配基础资源量，同时分配一些可能使用剩余服务器资源的突发\
  \ Pod，以及一些使用任何可用剩余容量的最佳努力 Pod。\n\n## 服务器实例费率优化\n\n除非你使用的是无服务器集群——我们接下来会探讨——你的集群由常规云服务器实例组成。\n\
  \n如果你的集群运行大量最佳努力或可重启 Pod，则可以选择使用 spot 实例运行集群的一部分。Spot 实例让你能够利用来自云服务提供商的可能巨大的节省。但在集群内部运行它们需要你考虑增加的风险，即你的服务器实例——以及它们运行的\
  \ Pod——可能在几乎没有通知的情况下被云服务提供商停止。\n\n这些服务器实例可以像任何其他实例一样被请求。仅仅因为你运行 Kubernetes 等集群编排软件并不意味着你应该将集群排除在正常的预留/承诺计划之外。我们经常看到容器化导致云服务器实例更稳定。容器可以来来去去，而不会改变你的云服务器整体。这可以意味着更简单的预留规划和整体更好的预留利用率。预留始终运行的实例可以带来超过\
  \ 50% 的节省，正如我们在第 17 章讨论的那样。\n\n## 容器运营阶段\n\n当你在本書这一部分经历更广泛的 FinOps 运营阶段时，你应考虑在云资源级别执行的许多操作中有多少可以应用于容器世界。按业务时间安排开发容器开启和关闭、查找并移除空闲容器、通过强制执行维护容器标签/标签等，只是你可以在更广泛的\
  \ FinOps 运营阶段中得出的逐一对应关系中的一些。\n\n\n\n## 无服务器容器\n\n由云服务提供商提供的无服务器容器，例如 AWS 的 Fargate，为您围绕容器的\
  \ FinOps 策略增添了有趣的变化。对于自管理的集群，您需要考虑运行更多集群的成本影响。每个集群的管理计算节点都存在额外的成本和维护要求，这可能导致工程团队选择在集中式账户中使用更少的集群。\n\
  \n由于集群管理层由云服务提供商管理，并且计算节点对您来说是抽象的，因此集中化工作负载的需求减少了。在无服务器世界中，跟踪调度程序的效率以及衡量容器在集群实例上的打包程度并不是问题。这一责任已转移给云服务提供商。然而，监控过度配置的容器仍然是必需的，因为当今的无服务器容器产品仅允许某些\
  \ vCPU 和内存组合。\n\n成本分配由云服务提供商为您完成，因为每个容器任务都由云服务提供商直接计费。这是因为他们现在可以看到服务器上运行的容器。因此，按比例分配成本和划分共享资源的问题被消除了。当容器在您账户内的服务器实例上运行时，删除容器会在集群上腾出空间，但除非完全从集群中删除计算节点，否则成本不会降低。对于无服务器容器，当它们被删除时，您就停止被收费。\n\
  \n这听起来像是好消息，但正如 FinOps 中的一切一样，存在多重考虑因素。例如，让云服务提供商管理集群意味着您的团队可以调整的配置项更少，这可能会使您无法为工作负载优化集群。\n\
  \n## 结论\n\n容器的问题与您最初迁移到云时面临的问题相似，因此您可以使用现有的 FinOps 实践来解决这些问题。\n\n总结如下：\n\n- 容器化并不会让您避免\
  \ FinOps，因为 FinOps 原则仍然适用，并且管理成本的需求对于容器化应用同样重要。\n- 除非您使用的是云服务管理的容器化平台，否则您需要收集有关运行容器如何使用服务器的补充数据。\n\
  - 跟踪容器消耗的服务器实例比例并将该信息与您的云账单配对，可实现真正的成本分配。\n- 容器化并不一定意味着高效：需要监控服务器使用情况并执行 rightsizing\
  \ 和调度优化。\n- 无服务器编排降低了成本分配的 FinOps 开销，但带来了成本大幅增加的高风险。\n\n下一章将深入探讨与工程团队建立合作伙伴关系的过程。\n"
- '## 与工程师合作以实现 FinOps


  FinOps 是一项团队运动，如果没有工程师，很少能取得进展。在本章中，我们将讨论如何通过培养工程师的成本效率动机，而不是下达强制性指令，来灌输 FinOps
  文化。强制性指令仅在领导层关注时提供短期行动。最终，强制性指令的压力会减弱，一切恢复正常，成本低效会重新出现。


  在本章中，我们将探讨软件工程师日常工作为何使成本优化考虑变得困难，并介绍工程师在开始将成本考虑整合到日常工作流程中时通常会经历的转变。


  许多工程师来自成本考虑 historically 从未成为他们工作一部分的世界。现在，在云中，他们被要求将成本视为新的约束。传达可变基础设施成本为何现在成为他们工作的重要组成部分以及对业务的影响的背景至关重要；否则，它可能会被降优先级。


  在成熟的实践中，工程师和开发人员处于 FinOps 长矛的最前线，他们的早期参与、一致性和认可对成功至关重要。


  ## 融合我们与他们


  重新审视本书的第一版时，我们注意到它在 FinOps 团队和工程团队之间使用了多少“我们与他们”的语气。一些措辞暗示工程师在某种程度上游离于 FinOps 工作之外，并且通常不关心成本。在云和
  FinOps 转型成熟的公司中，这与事实相去甚远。仅进行被动成本优化、参与度低的工程师反映了不成熟的 FinOps 实践和成熟度，其中低效率经常被嵌入到开发过程中，而
  FinOps 流程仅限于事后被动地清理浪费。相反，成熟的实践会在服务和架构设计早期就与工程师合作，以主动避免服务在云中部署方式上的低效率。


  推动 FinOps 的角色在过去几年发生了变化。在《2022 年 FinOps 状况》中，负责推动 FinOps 的团队 overwhelmingly 向 CTO
  或 CIO 汇报，并且由工程师 staffing——并且越来越多地由工程师领导。一旦成本意识文化得以建立，FinOps 本身的工作就由组织各地的工程师执行，从而让中央
  FinOps 团队更专注于其他职能。正如我们在第 15 章提到的，FinOps 的许多关键职能——如使用量减少和优化——通常不是由 FinOps 团队集中完成的；而是将这些责任直接分配给各个业务部门或组的工程团队。部署服务的工程师比任何人都更了解自己的基础设施，最适合对其进行优化。


  ## 工程师心中的想法？


  工程动机与财务团队动机形成鲜明对比。后者倾向于通过与预算和预测相比的支出金额的视角，关注业务可行性、毛利率以及业务的未来财务稳定。工程师的动机是创新，通过软件改进提供价值，并通常在包括安全、性能、正常运行时间和可靠性在内的多个领域提高效率。


  在第 3 章中，我们谈到了如何提高团队的动机并减少信任的丧失。回忆一下所引入的行动量表，其中动机与所需努力之间存在平衡。有时存在一种误解，即工程师没有动力关注成本效率；实际上，他们的
  FinOps 工作只是与其他关键约束和考虑因素竞争。


  为了平衡行动量表，FinOps 从业者需要与工程师（以及设定其目标和激励的工程领导层）合作，使成本效率成为与安全、性能、可靠性或可持续性（第 19 章讨论）同样重要的考虑因素。只关注单一成功衡量标准不是一个选项。


  工程师参与度不足的感知通常不是缺乏动机。由于他们负责的领域清单很长，因此必须定期做出权衡决策。如果 FinOps 需要大量或不明确的时间，则除非由领导层优先考虑，否则可能无法纳入工程日程。


  ## 云中的故事——Abuna Demoz


  Abuna Demoz 是一名软件工程师，曾领导 Google Cloud 和 Amazon Web Services 的大型工程团队，他分享了以下见解：


  您可以假设大多数工程师起初希望完成软件生命周期中尽可能多的任务，涵盖开发、文档、监控、告警、重构、扩展等。但随后他们会遇到在工作日或新功能目标发布日期内实际能完成的工作的限制。对于高级工程师来说尤其如此，他们的需求最高。他们被迫不断地优先排序，并在通常不允许任何超出关键要求之外的任务的时间范围内做出艰难选择。


  这就是组织奖励结构发挥作用的地方。大多数工程师会根据会得到奖励（薪水、奖金等）或认可（赞扬、领导层可见度、晋升等）的标准来优先排序。使用奖励和认可来驱动行为非常有效，但我们也必须理解其中产生的隐含权衡。


  例如，在大多数组织中，工程师因推出客户使用且理想情况下付费的新功能而获得奖励。这意味着当时间紧张时，很容易在可靠性、可维护性、可扩展性，尤其是成本方面投资不足。


  随着组织向 FinOps 转型，将成本指标和目标与工程师奖励挂钩是让每个人关注相同问题的绝佳方式。奖励可以与提高标签覆盖率、减少浪费和未使用情况、以及/或提高预测准确性挂钩。领导者对团队为实现这些目标所做工作的认可有助于强化其重要性。


  FinOps 必须寻找方法来减轻工程师的负担，尤其是在自动化方面。正如第 8 章所讨论的，将 FinOps 数据置于工程师的工作路径中将实现更快的决策，并减少因上下文切换而损失的认知负荷。我们不希望工程师花费大量时间（或脑力）来弄清他们的行动如何影响支出预测，这不仅会使他们远离其他优先事项，还会降低他们关注
  FinOps 责任的可能性。FinOps 报告应为工程师提供清晰的行动考虑大纲以及支持这些行动的确切数据，减少工程师考虑成本所需的工作量和时间投入。




  ## 约束与难题的解决


  人们不喜欢被约束。但创新需要约束。


  > 创造伟大事物需要两样东西，一个计划和时间稍显不足。

  > —L. Bernstein


  成本护栏常常会遇到这样的心态：“我们转向云是为了减少约束，现在你们又在给我增加约束。”我们从工程团队那里听到的另一个常见说法是“告诉我你要去哪里，但不要告诉我怎么去”。通过协作设定双方认可的成本护栏形式，即预算和预测——并向管理基础设施的团队提供可信赖的云支出和使用数据——FinOps
  可以为工程师提供所需的约束，告诉他们在成本方面需要达到的目标，同时将如何实现成本效率的创新留给他们。领导层向整个业务说明其成本效率工作的原因也会有所帮助。


  通过明确的一组约束来传达对期望成果的清晰愿景是目标。没有约束，开发过程可能过于自由化，最终可能无法与期望成果保持一致。相反，约束过多则没有足够的空间进行创造性工程，因为它不留创新余地。云效率的一些最佳解决方案来自于为工程师创新提供空间，同时保持清晰的成本约束，但不对实现方式做过度规定。


  与其让工程师选择任何可用的云架构然后再清理相关的成本低效问题，不如在早期设定成本约束可以减少不必要的浪费，并避免未来昂贵的——技术和成本——债务的清理需求。然而，即使一开始设计为成本高效的架构，随着代码效率的提升、新云功能的发布以及真实负载的演变，也几乎总能随着时间推移得到优化。


  工程师喜欢解决难题。这从你在主要云提供商年度大会上听到的工程成功案例数量就可以看出。这些演讲大多讲述公司如何利用云进行扩展、更具创新性、添加新功能并为组织引入全新的业务机会。


  > 在成本约束范围内构建云解决方案的工程师应被视为具有创新性。给工程师一个平台，让他们分享在满足成本约束方面通过创造性工程解决方案克服的技术困难。

  > —Benjamin Coles，苹果公司 FinOps 部门工程经理


  第 13 章探讨了云预算的不同层级，以及一些刚接触云的团队如何对预算概念提出异议。具有讽刺意味的是，大多数组织中一直都存在 IT 支出的预算以及相关的硬件约束，但这种支出通过有时提前数年采购的硬件被抽象掉了。美元本身正被引入作为新的约束，而不是历史上那样可用的计算能力的数量。


  ## 你是在打造保时捷还是丰田？


  创新可以在高价格和高品质下发生，也可以在低价格和低品质下发生。在你自己的团队中，考虑一下你是在打造云的保时捷还是云的丰田。两种方法都有效。保时捷工程师和丰田工程师接受过类似的培训，但面临不同的约束集。他们都必须不断在成本与价值之间权衡，但是在不同的约束下。你不必打造云的保时捷才能具有创新性。


  摩擦出现在一个团队（或团队成员）认为自己遵循保时捷模式，而实际上其他人遵循的是丰田模式。最优云与以巨大开销使用所有可能功能的云之间存在一个梯度。


  很多人认为工程师要做最好的工作，就必须打造云的保时捷。他们设计它以实现最高可用性、最高容错性和最高性能。打造云丰田的工程师构建在严格约束下运行的高效服务，在某些情况下，他们解决的工程问题可能比那些可以使用任何服务的保时捷工程师更困难。每当预算被压缩时，就会出现以创意方式优化的机会，例如使用抢占式实例、无服务器或新的系统设计以适应这些约束。这仍然是创新工程，只是基于良好、快速、便宜的铁三角的不同平衡。


  改编自 Gabe Hege 在 FinOps X 的演讲。Gabe 是库比蒂诺的一名高级软件工程师。


  ## 实现成本高效工程的原则


  在 FinOps X 2022 的演讲中介绍美元作为约束的概念以及丰田与保时捷的类比后，Gabe Hege 分享了一套在进行 FinOps 转型时业务和技术人员应记住的原则。Gabe
  是一家财富 100 强公司 FinOps 赋能团队中的工程师，但他向财务总监汇报，而财务总监最终向首席财务官汇报。


  作为一个警示故事，Gabe 戏谑地说：“云的唯一限制是你口袋有多深。但无限和免费之间有很大区别。大量使用便宜的东西也很昂贵。”


  以下各节总结了 Gabe 的六项原则，帮助 FinOps 团队更有效地与其工程合作伙伴合作。


  ### #1：最大化价值而非降低成本


  优化一切并不总是答案：你可能有局部优化机会，但对业务整体没有帮助。工程视角认为财务过度关注支出。如果财务能够将自身重新定位为关注业务价值，那么工程师就能更密切地产生共鸣，并更愿意进行符合
  FinOps 原则的交易对话，即决策由云的业务价值驱动。工程师习惯于权衡取舍——这是他们工作核心的一部分。


  Gabe 对此的看法是：“你希望让他们最大化价值。不仅仅是花得更少，而是花在正确的事情上。例如，在制造业的例子中，你可能会决定使用更昂贵的材料以获得更多收益。”


  努力向工程师展示他们如何为公司创造价值，然后通过让他们能够说“我们在推动成本下降的同时实现了性能提升”来确保他们因此获得认可。任何人都可以为性能挑战投入更多资金，但真正困难的问题是实现成本高效的性能。


  ### 质量方程


  20 世纪中期的著名工程教授 W. Edwards Deming 将成本牢牢地嵌入到质量方程的分母中：


  Quality = Results of work efforts / Total Costs


  质量工程——以及其所有同义词，如成本工程、财务工程等——是一种手段，目的在于业务价值。最终每个人都对价值负责，而不仅仅是一个团队或个人。Deming 的哲学在
  Wikipedia 上被总结如下：


  > > 通过采用适当的管理原则，组织可以提高质量并同时降低成本（通过减少浪费、返工、员工流失和诉讼，同时提高客户忠诚度）。关键是实践持续改进，并将制造视为一个系统，而不是零散的部分。


  ### #2：记住我们是一个团队


  FinOps 要蓬勃发展，团队需要密切协作。在他自己的组织中，Gabe 将这种合作伙伴关系比作保龄球类比：“财务是挡板，工程是保龄球。我们共同的目标是在最少的回合中击倒最多的瓶。”


  对于许多人来说，推动启动或加速 FinOps 采用的动力来自财务部门，他们推动工程 counterparts 关注成本并用报告追踪他们，要求人们减少浪费。太多的情况下这带有指责的语气，并且缺乏对云实际运作方式的足够理解，无法理解工程师做出选择的原因。


  ### #3：优先改善沟通


  Gabe 接着说：“财务中使用的许多术语工程师无法理解。同样，工程术语对财务人员来说也不易理解。非常重要的是站在工程师一边，而不是反对他们。我将 FinOps
  工作视为一种合作伙伴关系，我们也必须帮助非工程师，如财务人员，了解与工程合作是什么样的感觉。并帮助双方理解 FinOps 文化将如何融入他们的日常生活：FinOps
  不是一个单独的东西，它应该融入其中，直到成为一种习惯，就像安全工作必须嵌入到流程中一样。” FinOps 和云的共同语言的重要性在第 4 章中有所涉及。


  他建议组织考虑将一些工程人才调入财务，反过来让财务参与一些工程活动，以便他们更直接地了解工程在权衡对话中需要考虑的约束。


  ## 来自云端的故事——Benjamin Coles


  苹果公司的工程经理 Benjamin Coles 提供了以下建议：


  问责制听起来像是一个简单的术语，对吧？你编写代码，推送代码，一天结束时下班。当然，事实从来没有这么简单。理解和编写需求、测试版、错误、回归、停机以及不可避免出现且必须立即处理的一般性能问题都需要付出努力。而且在所有这些之上，有人告诉你你花了多少钱，并且你必须负责解决它。


  并行处理你正在进行的工作与他人的需求需要花费大量时间，而且似乎永远不会变得更容易。但这里有一个秘密：你在 FinOps 中交谈的人可能拥有你需要拉动的杠杆来让你的生活更轻松。他们正在努力实现一个目标——服务于公司——如果你仔细观察，你会发现它也有可能使你自己的工作受益。




  举例来说，假设 FinOps 表示做某件事会带来大量节省，但需要付出显著的努力。在这种情况下，首先确认工作量（LOE）不会超过潜在节省，然后说明所需的工作量，并请
  FinOps 与你的经理协商专门的时间。


  你可以为自己和团队认为重要的额外人力、额外项目和工作进行谈判。在许多情况下，中央 FinOps 团队会遇到阻力，但他们经常在问：“你能帮我帮你吗？”你可以用资源进行反谈判，或说：“我可以执行前五项建议，而不是整个建议清单吗？或者，我们能否将此任务推迟两个季度，以便更好地配合你们的日程？”


  你可能会说这些都是经理需要考虑的事情，但 FinOps 是一个新概念，FinOps 团队需要像你这样的倡导者来帮助向他们的经理解释。当然，我们知道我们被大量的任务清单淹没了，你最不想做的就是再往清单上添加更多项目。但要明白你的经理也一样，他们正在寻求你的帮助，以了解并评估团队如何推进。回报可能非常可观。不仅能帮助你自己的组织，而且你可以在另一家公司运用你在成本管理方面学到的技能——这有助于你的职业抱负。


  作为一名工程师，我建议你记录公司节省的成本明细。财务和业务团队已经在做这件事，但如果你跟踪这些数据，你可能会迅速成为该领域的领导者，因为为此而努力的工程师并不多。责任是双向的，所以要以你对自己的标准来要求他人。


  财务合作伙伴应该问工程师的关键问题是：“你需要的一切都有了吗？”工程师应该问业务或财务的关键问题是：“成本节约带来的变化是否会大于做出这些变化所需的工程工作成本？为了让它成功，我还能探索哪些其他选项？”


  你的工作是权衡成本与收益，然后做出决定。如果有人请你清理一些小问题，可以作为五分钟的好意付出完成。或者可能只是有人故意做出次优部署的决定，而这将在下一个版本中得到解决。无论你决定什么，都要负责任：始终尽你所能用行动兑现你的承诺。


  ## 4：尽早在产品开发中引入财务约束


  如果你在开发周期的末期才引入严格的财务约束，不要指望它们能在下一个版本中体现。快速胜利可能会朝正确方向推动指针，但不太可能让你达到长期目标（请参阅本书的后记，了解更多关于优先考虑长期收益而非短期胜利的内容）。财务约束需要时间实施，尤其是在游戏后期才引入时，因为它们可能与早期做出的基本选择不兼容，需要重新架构。与所需的工程时间和对其他版本交付计划的影响相比，重新架构的成本最终可能不值得云成本节省。正如
  Gabe 在他的 FinOps X 演讲中所说：“如果财务只在版本进入预发布或生产环境时才出现，那就太晚了。你需要在开始时就将成本约束融入其中，否则你经常是在要求工程团队构建一个新产品。”


  ## 5：赋能，而非控制


  需求是工程师主要关注的内容。他们的工 作首先是剔除需求中的噪音，以确定真正需要构建的内容。然后他们检查约束条件以确定如何构建。如果你有过于僵化的限制，你最终会得到
  Gabe 所称的 *technicians*：那些只被告知“把阀门转这么多”而不 ever 创新的技术人员。另一方面，你有 Gabe 所称的 *artists*，他们在打造手工且通常过于昂贵的解决方案时走得太远。在《辛普森一家》中有集经典剧集，荷马被赋予完全自由和无限预算来设计完美的汽车。最终出来的是一件昂贵的怪物。如果没有找到适当的成本
  guardrails 和其他约束的水平，创新实际上会受损。


  中间有足够的约束来激发创造力，但又不会僵化到找不到优雅的解决方案。简单的 guardrails，如总成本或批准的云服务 SKU 列表或批准的区域，可以创造创新。但如果你这样做，就需要提供工程师有灵活性的其他参数。例如，如果你在这个预算内，并避免这些服务或区域，那么你可以随意做任何事情。


  基于这一原则，Gabe 最后分享说：“我们非常担心艺术家，但我们也不想要技术人员。太多的约束会变成限制。让人们能够做出你想要的良好行为。并且记住，并非所有工程师都了解云的一切；教育是关键。”


  ## 6：领导支持不是有帮助的，它是必不可少的


  领导力是 FinOps 转变或任何组织变革成功的单一最重要的因素。如果你的工程和财务领导者对重要性和期望成果没有达成一致，那么文化变革注定会失败。再次强调，你需要的不是来自领导层的强制命令，而是需要领导者不断发出信号，表明成本——以及其最终的业务价值成果——在开发的各个阶段都很重要。信息不应该是“削减成本
  10%”之类的强制命令，而应是“成本效率始终很重要，并且是你的工作核心部分”的持续鼓点。


  在这里，Gabe 提到他以前作为安全工程师的工作，说：“你不能只做偶尔的安全冲刺；你必须始终将安全融入开发生命周期的每个部分。如果新功能破坏了你的成本约束，那就是一个
  bug，就像安全问题一样。你必须应用这种纪律水平。”


  ## 来自云端的故事——Mike


  多年来，我的中央 FinOps 团队不断发展其方法，以便与我们在 Atlassian 的数百名工程合作伙伴更紧密地合作。


  我们现在带着具体的请求去找他们，例如：“我们希望承诺一些 Savings Plans 或 Reserved Instances 来实现这一特定目标。以下是我们正在考虑的承诺，以下是我们期望它带来的价值，以下是它对业务的影响。你有任何阻碍我们推进的障碍吗？”


  多年来，随着我们变得更擅长专注于价值对话以及 FinOps 团队变得更加成熟，我们获得了更多的关注和时间。在开始时，我们只是专注于最佳实践。我花了很多时间试图非正式地说服人们更多地考虑成本。


  一旦我们以获得广泛领导支持的专职团队的身份确立下来，就让整个组织更明显地认识到 FinOps 对 Atlassian 来说不仅仅是一个次要想法，就像早期那样。他们看到我们的团队正被领导层作为关键投资进行资助，这有助于推动他们需要与我们合作的信息。


  与此同时，我们在试图实现的目标上保持谨慎。我们确保他们理解请求、需要做什么以及该工作的影响。


  更具挑战性的对话发生在团队做出预算承诺后却未能兑现时。在这种情况下，我们会提出以下问题：


  - 为什么我们没有实现承诺的内容？

  - 这是一次性情况吗？

  - 这是一种新趋势吗？


  我们通过提出以下问题来尝试与他们一起找到解决方案：


  - 你能改变其他一些事情以实现承诺吗？

  - 我们看到浪费建议在增加；我们能安排一些时间来清理它们吗？

  - 我们能改变什么来降低资源变成浪费的可能性？


  当我们需要扮演警察角色时，我们会带着证明有值得担忧的事情的信息或数据出现。异常支出、超出预算，或预测显示我们预计会大幅超出预算。我们会问这样的问题：这些数据表明有些不对劲，你能帮助我们理解吗？这慢慢建立了融洽关系，以至于——而不是预订会议——我们最终可以向团队发送一个快速的异步问题并得到合作的回应。




  > 我们仍然会在某些请求上遇到阻力，例如在感知到的时间价值不足时要求清理闲置资源。但这些会引发对话，而不是争论，因为我们建立了信任，并且得到了领导层的支持。


  ## 工程师路径上的数据


  工程师——尤其是开发人员——经常处于深度专注的循环中，通常被称为 *flow*。打断其中一个循环会极大地影响工程师的表现。正因如此，你只有在响应或行动的时机需要立即进行时才应打断工程师；使用实时沟通方式，如聊天、视频通话或当面走过去，会让工程师脱离思路并破坏其专注度。如果你需要他们采取的行动可以等待，那么请考虑如何以不会造成干扰的方式告知他们任务。


  回到第8章中引入的 *data in the path of the engineer* 概念，让 FinOps 数据存在于工程团队已在工作的场所，是减少工程师参与
  FinOps 所需努力的关键因素。与工程师现有流程集成，避免了他们打开新报告并围绕 FinOps 运行额外仪式所需的努力。然而，未经通知就将 FinOps 注入工程团队的报告和流程中应避免，因为这会真正打断工程团队仪式的流程。理想情况下，工程师应帮助指导在现有工作流程中何处插入
  FinOps 数据最能帮助他们。


  如果领导层要求工程师必须立即清理云浪费并削减10%的成本，他们很可能会看到快速成果。强制要求是让工程师采取行动的快速方式。但它们通常不可持续，并可能造成鞭打式的负面文化。一旦强制要求过时且不再得到领导层强化，它就会从工程团队的脑海中消失，他们会重新专注于交付和其他关键指标的优化。而对
  FinOps 的负面感受则是持久的。


  成本强制要求是点对点的影响，短期内可能有效，但随着时间的推移，你会再次遇到同样的不断增长的浪费。成本指标对业务很重要这一更广泛的信息应作为工程运作方式的一部分持续重申。


  当你在文化层面开始建立成本效率是核心价值时，它就成为服务工作流程的一部分。力求熟练练习并建立肌肉记忆。FinOps 成为整体故事的一部分。文化不会消失——它只是成为日常的一部分。


  ![](img/4d4736bc293fd892d1da81802d0f9520_410_0.png)


  与工程团队合作，了解其现有流程和报告，从他们那里获得反馈，了解 FinOps 数据在何处以及如何能带来最大益处。当工程师能够参与 FinOps 的实施方式时，他们更有可能帮助做出必要的改变。


  ## 与工程团队合作的模式


  每个 FinOps 团队都会以不同的方式与公司工程师合作，这取决于 FinOps 团队成员的知识和技能组合。


  ### 直接贡献


  具备工程技能的 FinOps 团队通常会采取更主动的方法，直接帮助工程师设计更高效的云服务并开发工具以避免前期产生浪费。这是建立工程师与 FinOps 团队之间协作环境的有力方法，可以更有效地将使用优化量保持在最低限度。对于非常大的公司，这种类型的合作可能会存在局限性，因为积极从事云工作的工程团队数量可能会超出
  FinOps 团队的承载能力。


  ### 间接协作


  并非所有 FinOps 团队都配备了工程师，但这并不意味着他们无法与周边的工程团队有效合作。这种类型的合作通常会看到 FinOps 团队与组织内的云卓越中心 CCoE
  或技术架构组 TAG 之间进行强有力的协作。依靠 TAG 和/或 CCoE 团队来推动所有工程团队更高效地设计，并利用他们深厚的云知识帮助 FinOps 了解当前云支出、预测未来成本，并明确识别优化机会。


  ### 具有针对性贡献的间接协作


  作为与工程团队合作的混合方法，采用间接协作模式，但利用 FinOps 团队成员的工程技能来针对业务的特定领域。FinOps 成员可以直接与支出最大的工程团队合作，或专注于组织内云成熟度最低的工程团队以提升其能力。执行这种直接协作的
  FinOps 团队成员可能会随着需求变化在组织中流动，或专属于某个工程领域。在 Atlassian，设有成本工程师嵌入其他团队执行此职能。


  选择建立合作的模式应首先评估 FinOps 团队中的技能、工程领域内 CCoE/TAG 团队的建立程度，以及组织内所有工程团队的云采用成熟度。选择一种模式并不意味着永远锁定这种合作方式，随着云足迹的扩展，混合模式变得越来越可能成为最终结果。


  ## 结论


  我们希望你对工程角色及其在 FinOps 中的核心作用有了更好的理解。来自各方的合作伙伴都需要倾听并分解不一定是工程特定性的挑战。我们不能把挑战抛过篱笆就期望它被推进完成。工程师
  juggling 着大量相互竞争的优先事项。当成本意识被引入时，会带来额外的认知负担。与工程师沟通的方法和时机可以极大地影响 FinOps 被视为合作伙伴关系还是强制要求。


  围绕成本效率改进所产生的摩擦通常来自以下几个方面：


  - 领导层设定的其他优先事项

  - 交付功能或服务的紧迫截止日期

  - 担心更改可能会对性能产生负面后果

  - 对工程师的期望不明确，或工作价值没有得到很好的传达


  总结如下：


  - 与工程师建立合作伙伴关系比完成一份 FinOps 任务清单更重要。

  - 成本节约不是合作伙伴关系的目标，而是花钱获得高效价值。

  - 在开发过程早期与工程团队就财务约束达成一致，以减少后期浪费的工作。

  - 领导层应避免强制要求，即短期成本关注期，而应鼓励团队将持续监控和管理 FinOps 的需求作为组织工作流程和文化的一部分。

  - 如果你的 FinOps 团队没有审查/推荐工程设计/更改的技能，请与组织内的架构团队协作。


  下一章将介绍组织中其他类型的合作伙伴关系，与管理其他 IT 框架的团队互动。

  '
- '## 与其他框架的连接


  除非你的公司诞生于云端并且大部分技术预算都在那里，否则 FinOps 很可能不会孤立存在，并且可能不是组织实践的唯一 IT 管理学科。


  大多数大型组织使用多种不同的 IT 管理学科来定义它们将如何交付技术服务、了解相关支出的价值、加速采用或交付曲线，并使组织免受各种风险的侵害。


  本章概述了如何与组织中使用其他 IT 和技术支出相关框架的团队合作的起点。重点将更少放在方法论之间的技术交叉点上，而更多放在与执行这些方法的人/团队合作的方式上。目标是成功地与这些其他框架和学科合作，以补充它们而不是重叠或与其竞争。太多时候我们看到学科或部门之间产生摩擦，因为每个部门都试图在组织内建立权力或创造影响力。FinOps
  并不是解决所有 IT 支出问题的万灵药，而是帮助组织内所有学科——包括其他 IT 管理职能和团队——更有效地管理云使用和成本。


  IT 相关框架的详尽列表很长——对我们中的许多人来说令人困惑。它们涵盖了广泛的 IT 管理领域，例如资产、许可、财务管理、安全、开发实践、架构流程等。


  以下是我们看到与 FinOps 并存的一些常见框架。它们通常以以下方式与 FinOps 交互：



  ## IT 管理学科


  FinOps 可以共享有关云环境中运行的内容、云资源配置方式以及其运行位置/区域等详细信息。第 12 章中涵盖的内容，包括成本分摊、账户层级和标签，在此非常重要。


  - IT 服务管理 (ITSM)

  - IT 基础设施库 (ITIL)

  - 配置管理 (CM)


  ## IT 财务学科


  FinOps 可以帮助对云账单中看到的各种云使用类型和类别进行分类。所需的分类也可能驱动你的标签策略。跟踪跨云环境的许可证使用情况以及资产的生命周期是重要概念。它们侧重于将云计费的深度数据与其它财务框架提供的现有
  IT 成本类别相匹配。


  - IT 财务管理 (ITFM)

  - 技术商业管理 (TBM)

  - 软件资产管理 (SAM)

  - IT 资产管理 (ITAM)


  ## 信息安全 / 网络安全


  FinOps 通常会共享异常检测数据，这可能有助于提醒安全团队关注问题领域。标签标准可以帮助安全团队在安全流程标记审查时，快速识别云资源的拥有者和预期用途。


  ## GreenOps


  此内容在第 19 章有详细说明。


  这些方法论、学科和实践可能在你使用公有云之前就已在组织内运行多年，以帮助管理 IT 交付的特定方面。一个常见的顿悟时刻是认识到这些其他学科实际上无法应对云的自助服务、按需和高度可变特性，也无法应对其产生的海量账单数据。FinOps
  并非要取代这些，而是帮助实现同样的总体目标：为每笔技术支出获得最大价值，但对云有深入的领域关注。


  你的组织可能正在采用或使用众多敏捷或 DevOps 框架的实现，以帮助加速和协调你的 IT 价值交付。你的组织可能有企业架构团队利用众多架构框架中的一种来驱动你开发和实施
  IT 解决方案的方式。你可能已经拥有一个云卓越中心 (CCoE) 或云平台团队，使用你所使用的云服务提供商提供的云采用框架或 Well-Architected
  框架中的一种。而且你肯定有一个信息安全团队，专注于确保每个产品和工程团队都高度关注网络安全要求和风险。


  ![](img/4d4736bc293fd892d1da81802d0f9520_415_0.png)


  > 安全是与 FinOps 团队的惊人平行：安全团队并非唯一负责确保组织内安全实践，而是提供指导、集中最佳实践，并加速业务线团队。


  并非每家公司都拥有所有这些其他团队。在成熟的组织中，FinOps 团队很可能是众多团队中最新的（除第 19 章中讨论的 GreenOps 外），以帮助改变组织的文化并提升
  IT 为整个组织带来的价值。


  ## 总拥有成本


  由于 FinOps 特别关注云，你需要与组织内的其他团队协作，以获得部分在云中、部分在本地部署的应用程序或投资组合的总拥有成本 (TCO)。所有那些你不通过云账单购买的其他成本——租金、人工、合同和部分许可证——因此通常不会出现在你的
  FinOps 报告中，都是 TCO 的一部分。了解 TCO 对于确定技术采购的价值并实现我们在第 26 章讨论的数据驱动决策制定这一理想状态至关重要。


  云的特殊性使得 FinOps 成为必要——你处理的数据量巨大、数据到达速度快、无限可用性创造了超支的机会——而 FinOps 恰好能够应对这些特殊性。如果你的财务团队已经在管理那些每月或固定的
  IT 成本，FinOps 团队可以将云成本以可用的格式融合进来，为组织提供按应用程序、按业务部门、按产品等的支出全景。FinOps 团队可以更深入地提供不仅是该支出的分配，还有其为何如此的故事，并释放需要比许多传统
  IT 管理学科更精细可见性的潜在优化机会，而这些学科需要继续使整体 IT 支出更有效。


  ## 与其他方法论和框架协作


  在开发 FinOps 时，你应采取一系列步骤，以避免与已建立的其他方法论或框架发生冲突。


  ![](img/4d4736bc293fd892d1da81802d0f9520_416_0.png)


  随着云成为大多数公司 IT 支出的主体，这些现有框架中的一些可能会整合为一个运作。及早认识到这一点并留意结合努力的机会，以便你的组织从长远来看获得最大利益。关注每个框架旨在实现的结果。


  ## 了解谁在那里


  FinOps 团队开始工作后一段时间才发现有其他团队运营其他 IT 框架的情况并不少见。这可能导致团队之间产生相互冲突或重复工作的认知。理想情况下，你应在实施
  FinOps 过程中尽早确定谁在运行哪些框架和职能。首先寻求了解每个团队做什么以及他们为业务提供的价值。去与他们交谈，了解他们试图完成什么以及他们的执行赞助人是谁，最重要的是，开始建立工作关系。


  ## 云端故事——Ashley Hromatko


  在她担任 Pearson 的 FinOps 领导期间，Ashley Hromatko 分享了以下故事，讲述她的团队如何与现有的 SAM 实践进行接触并建立合作实践：


  在我们数字化转型高峰期并将数百个工作负载迁移到云时，我们开始将第三方软件和服务的采购转移并简化到 AWS Marketplace。我们的组织有集中的采购和 SAM
  团队，但业务部门希望通过云中更快的采购来释放创新。这种敏捷性带来了风险，即业务部门可能在未经批准或谈判的情况下获取资金，在不知公司整体协议的情况下购买许可证，以及对供应商合同适当审查的担忧。


  我们的团队——体现了 FinOps 原则“团队需要协作”——着手了解现有的采购和 SAM 流程，并开始代表工程业务部门倡导效率、承诺优势和可获取的精细化跟踪的好处。


  这些团队共同能够建立一些规则，并联合建立了新的云第三方治理。这包括将 AWS Marketplace 访问权限锁定给授权负责人、创建在购买前需要 SAM 和财务参与的阈值入职指南、记录合格供应商名单、设置在购买前收集详细信息的流程、定期审计采购，以及新的摊销成本分摊输出。我们继续每年共同合作进行预测，并在下一年的第三方软件采购类型和预算阈值方面做出业务决策。


  ## 建立友谊并共享目标


  建立共同的理解，即不存在谁做得最好的竞争。拥有我们对他们 的态度（在第 24 章关于工程团队的讨论中提到）只会导致双方都不愿意协作，就像 FinOps 和工程或财务等其他团队将自己视为目标对立时一样。人们认为一方的成功往往以另一方的牺牲为代价。然而，共享的目标应该是组织使命的成功。


  团队之间存在重叠目标是预期的，因此明确定义这些目标将使共享路线图得以实现，避免重复或更糟的冲突。


  可以探索重叠目标的领域包括以下内容：


  - 谁提供做出及时决策所需的数据，以及该数据如何使企业能够衡量旨在最大化业务价值的权衡

  - 哪个团队负责 IT 支出和用量管理的每个部分

  - IT 支出应如何控制/治理以及谁来定义它

  - 各方法论提供的数据、报告和仪表板将如何生成和分发


  ![](img/4d4736bc293fd892d1da81802d0f9520_417_0.png)


  FinOps 并非包揽一切——也不是其本意——其他框架也一样。识别每个框架的优势和劣势将使你能够确定在更大的组织目标上如何互相帮助，一个框架的输出可以解决另一个框架的弱点。制定责任矩阵可以帮助整个组织了解各团队如何协同工作。


  以下是 FinOps 通常与其他框架不同的一些领域：


  ## 范围


  其他框架通常针对所有 IT 相关支出，例如员工成本、咨询合同、许可证管理和数据中心运营，而 FinOps 则专门针对具有可变支出成本的公有云和 SaaS 提供商。


  ## 输入规模


  其他框架通常使用大量来源输入，每个输入规模较小但复杂性和一致性各不相同。FinOps 依赖于有限数量的来源输入，其中包含极其庞大和复杂的数据集。




  ## 速度


  其他框架最适合在较长业务周期（月度、季度）上运行的传统成本要素。FinOps 设计为以尽可能快的行动周期（每小时、每天）执行，以应对云使用量的变化。


  稳固的框架组合可以形成 T 型技术价值交付方法。换句话说，它们共同提供广阔的可见性，通过像 ITFM 这样范围较宽（但颗粒度较低）的框架，以及通过像 FinOps
  这样范围较深（但较窄）的框架提供颗粒化的领域能力。


  ## Share Influence, Terminology, and Processes


  现有框架团队很可能已经对你引入 FinOps 时需要影响的相同角色拥有影响力，或者组织内对引入 FinOps 的日益增长的兴趣可能为现有框架团队提供放大其影响的机会，就像
  Ashley 关于与 SAM 团队互动的故事一样。拥有组织内现有关系的团队可以帮助引入 FinOps，并缩短 FinOps 在组织内成为已知实践的过程。在框架之间统一共同信息意味着你最终会拥有统一的声音。


  你们都在做以下事情：


  - *不是*组织的核心业务，即实施这些框架所花费的时间和精力是本应用于构建组织销售的产品的时间和精力

  - *需要工作*和公司各方人员的协作

  - *至关重要*于组织的成功，即如果没有这些框架，组织将面临会对其成功产生负面影响的挑战


  力求在公司内建立共同的影响力，既表达每个相关框架的重要性，又有助于说明为什么两者对组织的成功都是必需的。


  要实施这些框架中的任何一个，都需要数据集、报告以及领域特定术语的教育。在向组织实施新政策或标准之前，应确定可以重复使用或重新利用的现有政策和标准。需要一个标签计划？像
  ITFM、TBM、ITAM、DevOps 或你的 CCoE 这样的现有框架团队可能已经定义了一些分配规则。依靠组织内的现有流程和知识将使事情更简单，并加快建立成熟实践的过程。也许更重要的是，采用公司内部已知的术语和定义，比尝试为相似术语创建新的——并且可能冲突的——用法要容易得多。


  ## Share Infrastructure


  记住第 8 章中介绍的 *将数据置于每个角色路径中* 的概念。现有框架很可能已有工程师、财务和领导层正在使用的现有报告和仪表板。与其制作新的报告和仪表板，你应与拥有这些现有报告的团队保持一致，并添加
  FinOps 信息。如果 ITFM 报告已是你的高管报告流程的一部分，请努力通过你的 FinOps 实践向这些报告添加更深入的云数据。不要试图重新发明轮子。共享现有报告和仪表板既减少了建立
  FinOps 报告的工作量，也避免了组织内相关角色需要额外付出努力。


  ## Share Knowledge


  FinOps 是一个整合性学科，将组织内许多其他学科的工作联系起来，因此有几个关键学科与 FinOps 有关键相似之处。这些学科的从业者经常将 FinOps 描述为“我的学科，但针对云”。但云中存在重要差异，这就是为什么在大多数组织中
  FinOps 需要自己的重点。


  ![](img/4d4736bc293fd892d1da81802d0f9520_419_0.png)


  如果不了解我们在共享目标中讨论的现有框架的优势和劣势，很容易将每个框架及其能为组织带来的价值 trivialize。对 FinOps 来说，认为现有框架一无是处是一个错误。它们已在执行的许多活动将提供可被
  FinOps 利用的价值。共享教育计划、外联和布道活动建立了对彼此框架的共同理解；这将使所有团队都能对彼此的框架产生共同的欣赏。


  ## Conclusion


  FinOps 是关于建立桥梁，而非筑墙。所有 IT 管理方法论都有一个共同目标，即帮助企业从 IT 支出中获得最大价值，但它们从不同角度进行方法，并且有些专门针对特定类型的
  IT 支出。


  总结如下：


  - 努力识别组织内部运营其他框架的团队。

  - 努力与组织内管理其他框架的团队保持一致并互补。你们彼此都有可学习之处，并会找到可以相互支持的领域。

  - 共同工作以避免重复并增强彼此的目标。

  - 决定哪个团队负责重叠责任的每个组成部分。

  - 在组织内部围绕云支出和业务价值决策建立一致的信息传递。


  现在你已经了解如何建立关系并真正与工程师、财务以及 FinOps 团队将合作的许多其他团队协作。现在是让这些关系产生回报的时候了。


  这就引出了我们喜欢称之为 *FinOps 涅槃* 的阶段。倒数第二章将概括我们迄今为止讨论的所有内容，这些内容使你能够实现最终目标：实现数据驱动的决策。

  '
- '## FinOps Nirvana: Data-Driven Decision Making


  FinOps 涅槃阶段是指支出责任完全下放给工程团队，他们每天做出高效选择——不仅仅是在有指令时——在领导层的支持下，领导层已将成本与其它关键软件性能指标并列视为一等公民。


  目标是让你的组织能够基于业务价值对云支出做出持续的数据驱动决策。谁来做这些决策？


  - *架构师*，在设计基础设施时

  - *工程师*，在编写代码和部署服务时

  - *财务和采购团队*，在向云提供商做出承诺时

  - *领导层*，在推动技术战略时


  这是一项持续的协作工作，只有在发生 FinOps 文化转型时才能完全实现。


  迄今为止你所做的一切使你能够到达这里。你已分配支出、设定优化目标并实施程序以帮助团队实现这些目标。你持续践行 FinOps 生命周期，每次都完善分配策略、设定指标阈值，并提供对云使用情况日益精细的可见性。


  但仍存在差距。每次账单上涨时，关于支出是好是坏的争论就会重新展开，即支出水平是否适合你试图实现业务成果。账单上涨是因为业务增长吗？是因为云迁移加速吗？还是因为低效的使用模式重新渗入团队习惯而导致上涨？给出一个明确的答案非常困难，尤其是让高管们信服的答案。


  在本章中，你将开始将支出与业务价值联系起来，主要通过将单位指标应用于云成本分组来实现。这些指标帮助你识别允许一定支出以获取额外业务价值的价值、设定成本绩效目标，以及也许最重要的是，能够向高管证明工程团队做出的决策正在推动业务价值。


  ## Unit Economics and Metrics


  单位经济学的简单定义是与特定业务模式相关的直接收入或成本，具体以每单位为基础表示。对于面向客户的应用程序，该单位可能是用户或客户订阅；对于电子商务平台，可能是交易；对于航空公司，可能是座位英里数。


  基于 FinOps 基金会单位经济学同行工作组的成果，一个更长的单位经济学定义正在形成：


  Cloud Unit Economics is a system of profit maximization based on objective measurements
  of how well your organization is performing against not only its FinOps goals but
  as a business in the market. Cloud Unit Economics achieves these noble goals by
  leveraging the measurement of marginal cost (a.k.a., unit cost metrics) specific
  to the development and delivery of cloud-based software and marginal revenue (a.k.a.,
  unit revenue metrics).


  ![](img/4d4736bc293fd892d1da81802d0f9520_423_0.png)


  There is not a single metric that the whole organization should follow. You must
  aim to do unit economics at multiple levels across the organization, with many different
  inputs and granularities. You can do high-level unit economics with metrics like
  cloud cost per customer, but you can also do unit economics at an application level
  by doing things like cost per transaction, or even do unit economics on an individual
  service level like compute cost per execution of a microservice.


  ## 单位经济学不一定与收入有关


  We heard after the first edition of this book that some people thought that there
  needed to be a universal unit economic metric, a single north star metric for your
  organization to follow. This was not the intention then, nor is it the reality now.
  There isn’t a single north star metric, but rather a constellation of stars that
  together form a map allowing you to safely navigate the turbulent seas of your cloud
  adoption journey in pursuit of calmer shores.


  我们在本书第一版出版后听说，有些人认为需要一个通用的单位经济指标，即组织应遵循的单一北极星指标。当时并非如此意图，现在也并非现实。并没有单一的北极星指标，而是一组星群，共同构成一张地图，让您能够安全地航行于云采用之旅的动荡海域，追求更平静的彼岸。


  Don’t be discouraged if you’re unable to get to a top-line revenue metric related
  to cloud spend. Many organizations cannot, either because of the type of business
  they are in or because of their maturity. Unit economic metrics should function
  at multiple levels like a nesting doll. If you’re a portfolio manager, you might
  have operational activity–based unit economics for each of your applications, or
  you might have them for a whole business unit, or as the lead on an application
  you might have a set of measures that tell you how much it costs for your application
  to take an action that isn’t possible to tie back to revenue. Each may be very different
  and none may tell the complete picture of cloud value, but together they provide
  direction and can help you (and your executives) begin to trend your progress toward
  maximizing the value you are getting from cloud.


  如果您无法获得与云支出相关的顶层收入指标，请不要气馁。许多组织也无法做到，要么是因为其业务类型，要么是因为其成熟度。单位经济指标应像俄罗斯套娃一样在多层级发挥作用。如果您是投资组合经理，您可能为每个应用拥有基于运营活动的单位经济学，或为整个业务单元拥有，或作为应用负责人，您可能有一组衡量指标，告诉您应用执行某项无法关联到收入的动作的成本是多少。每项可能大不相同，也都无法完整呈现云价值的全貌，但合在一起可以提供方向，并帮助您（以及您的高管）开始追踪向最大化云价值所取得的进展。


  The important thing that unit economic metrics do is unlock the ability to talk
  about your cost in comparison to some value or business goal. They don’t need to
  be a panacea that aligns each dollar of spend to each dollar of revenue. They can
  happen at any level and with nearly any operational business metric, however specific
  or minute. They enable value maximization decisions based on objective measures
  of how well your organization’s cloud usage is performing.


  单位经济指标最重要的作用是解锁将成本与某种价值或业务目标进行比较的能力。它们不需要成为一种万灵药，将每一美元支出与每一美元收入对齐。它们可以在任何层级发生，并与几乎任何运营业务指标相关，无论多么具体或细微。它们基于对组织云使用表现的客观衡量来支持价值最大化决策。


  ## 计算单位经济指标


  In every cloud unit economics calculation, there is a numerator and denominator.
  You’re taking something (generally an activity or output metric) and dividing it
  by something else (generally a portion of cloud spend) to come up with a unit metric
  value.


  在每一次云单位经济学计算中，都有分子和分母。您取某样东西（通常是活动或产出指标）除以另一样东西（通常是云支出的某一部分）来得出单位指标值。


  The numerator is a cloud measurement of spend that quantifies the choices made by
  architecture and engineering teams. The denominator is either an engineering value
  measurement or financial value measurement or business value measurement that gives
  that spend important context. The outcome of that calculation is the cloud unit
  economics value measurement that you’re going to use to manage some part of your
  business, or to give insight into what changes you could consider making.


  分子是对支出的云度量，量化了架构和工程团队所做的选择。分母是工程价值度量、财务价值度量或业务价值度量，为该支出提供重要背景。该计算的结果是您将用来管理业务某部分或提供可考虑变更洞察的云单位经济学价值度量。


  Somewhere in the organization, some form of unit economics is already taking place.
  It may not be in your team or business unit. That’s one of the first things that
  Anthony “TJ” Johnson, Cloud Business Manager from Box, Inc., recommends: to search
  for allies who are managing to unit economic metrics already. Typically it’s someone
  in finance who may already be providing related data to a business unit owner measuring
  how well they’re utilizing a technology investment. That becomes a potential measurement
  for you to include cloud information infrastructure, especially if you are a cloud-first
  or a cloud native organization and you’re focused on that as a path for your future.
  Find the unit metric dashboard that the team is using, find out who makes that dashboard,
  and go talk to them about incorporating cloud spend data.


  在组织中的某个地方，已经在进行某种形式的单位经济学。它可能不在您的团队或业务单元中。Box, Inc. 的云业务经理 Anthony “TJ” Johnson
  推荐的第一件事之一就是：寻找已经按单位经济指标管理的盟友。通常是财务部门的人员，他们可能已经向业务单元负责人提供相关数据，用于衡量其技术投资的利用情况。这就成为您纳入云信息基础设施的潜在度量，特别是在您是云优先或云原生组织并将其作为未来发展路径时。找到团队正在使用的单位指标仪表板，弄清谁制作了该仪表板，并与他们讨论纳入云支出数据。


  ![](img/4d4736bc293fd892d1da81802d0f9520_424_0.png)


  Finding the correct unit to measure your business is a fine art, and it’s something
  you’ll likely change or update over time. Organizations with complex structures
  and many product offerings will often have many different unit economic metrics,
  each one relevant to a specific product, application, or service.


  找到衡量业务的正确单位是一门精细的艺术，并且您很可能会随着时间的推移而更改或更新它。结构复杂且产品众多组织的单位经济指标往往很多，每一个都与特定的产品、应用或服务相关。


  On Episode 11 of FinOpsPod, Anthony “TJ” Johnson, Cloud Business Manager from Box,
  Inc., shared how he looks at maturity as it relates to unit economics. Listen to
  his approach to maturing unit cost integration and budgeting, ultimately focusing
  on a cost-to-serve approach.


  在 FinOpsPod 第 11 集，Box, Inc. 的云业务经理 Anthony “TJ” Johnson 分享了他如何从单位经济学的角度看待成熟度。收听他关于单位成本整合和预算成熟的方法，最终聚焦于服务成本方法。


  ## 花钱可以，浪费不行


  Cast your mind back to the inform phase of the FinOps lifecycle. This phase focuses
  on surfacing cloud costs to build awareness and accountability for spending. Through
  this visibility into cloud spend, you’re able to determine trends and build forecasts
  for future costs. When cloud costs exceed your planned budgets, the next obvious
  step is to begin investigating the increase and explain what is happening. In the
  same way that other metrics give context to cost optimizations within the metric-driven
  cost optimizations of Chapter 22, a unit metric provides the critical business context
  to changes in cloud spend.


  请回想 FinOps 生命周期中的告知阶段。该阶段侧重于揭示云成本，以建立支出意识和问责制。通过对云支出的可见性，您能够确定趋势并为未来成本制定预测。当云成本超过计划预算时，下一步显而易见的是开始调查增长原因并解释发生了什么。就像其他指标为第
  22 章中的指标驱动成本优化中的成本优化提供背景一样，单位指标为云支出的变化提供了关键的业务背景。


  We sometimes see SaaS products start by using business revenue generated from products—run
  within the cloud—as a simple starting point. By dividing total cloud costs by the
  revenue generated, you’re able to determine if growth in cloud spending is increasing
  profits for the organization—and is therefore good spend.


  我们有时看到 SaaS 产品从使用在云中运行的产品产生的业务收入开始，作为简单的起点。通过将总云成本除以产生的收入，您能够判断云支出的增长是否在增加组织的利润——因此是良好的支出。


  By calculating cloud spend for total revenue, you can attach growth in cloud spending
  to your overall business growth. When these are in line, it makes sense that cloud
  spend isn’t wasted. When cloud spend is growing faster than the business, there
  may be cause for concern.


  通过计算总收入的云支出，您可以将云支出的增长与整体业务增长联系起来。当两者保持一致时，云支出未被浪费是合理的。当云支出增长快于业务时，可能存在担忧原因。


  Ideally, the metric you use for unit economics should have low volatility, where
  decisions in one part of the business do not affect the metrics used by others.
  Let’s take a look at an example.


  理想情况下，您用于单位经济学的指标应具有低波动性，即业务某一部分的决策不会影响他人使用的指标。让我们看一个例子。


  In Figure 26-1, your company is tracking total organization revenue over cloud spend.
  As long as these lines more or less remain consistent, your unit economics appear
  to be in order.


  在图 26-1 中，您的公司正在跟踪总组织收入与云支出的关系。只要这些线条基本保持一致，您的单位经济学看起来就正常。


  ![](img/4d4736bc293fd892d1da81802d0f9520_425_0.png)


  Figure 26-1. Company with stable revenue and cloud costs


  图 26-1. 收入和云成本稳定的公司


  In Figure 26-2, your business introduces a free tier to your cloud offering, allowing
  customers to sign up and use your service for free. The expectation is these free
  customers will eventually sign up for your paid offering and therefore increase
  overall revenue. However, when you introduce this new free offering, your cloud
  spend increases with no direct impact to revenue. Your unit economics have been
  affected.


  在图 26-2 中，您的业务在云产品中引入了免费层，允许客户免费注册和使用您的服务。预期这些免费客户最终会注册付费产品，从而增加整体收入。然而，当您推出这一新免费产品时，您的云支出增加，但对收入没有直接影响。您的单位经济学受到了影响。


  If your engineering teams are using this metric to gauge how well their infrastructure
  costs align with the business value, this has a negative effect. Of course, you
  could just tell your engineering teams to expect this change and continue on—that
  is, until six months from now when your marketing team runs an advertising operation
  to drive up adoption for your free tier and your unit metric is affected.


  如果您的工程团队使用此指标来衡量其基础设施成本与业务价值的契合度，这会产生负面影响。当然，您可以只是告诉工程团队预期这一变化并继续下去——也就是说，直到六个月后，当您的营销团队开展广告活动以推动免费层采用时，您的单位指标受到影响。


  ![](img/4d4736bc293fd892d1da81802d0f9520_426_0.png)


  Figure 26-2. Company revenue and cloud costs during the introduction of a free-tier
  offering


  图 26-2. 推出免费层产品期间的公司收入和云成本


  In Figure 26-3, you decide to measure cloud spend against monthly active users (MAU).
  As you increase your active users, your cloud spend is likely to increase as well.
  With the introduction of the free tier, both active users and cloud spend increase
  together and your metric remains consistent overall. In this case, if a future marketing
  campaign drives more customers, it would have a similar effect to the graph and
  remain consistent for engineering teams. They can see that an increase in active
  users increased cloud spend. In this metric, the business value (active users) is
  measured against the cloud spend.


  在图 26-3 中，您决定将云支出与月活跃用户（MAU）进行衡量。随着活跃用户增加，您的云支出也可能增加。随着免费层的引入，活跃用户和云支出一起增加，您的指标总体保持一致。在这种情况下，如果未来的营销活动带来更多客户，它将对图表产生类似影响，并对工程团队保持一致。他们可以看到活跃用户增加导致云支出增加。在此指标中，业务价值（活跃用户）与云支出进行衡量。




  ![](img/4d4736bc293fd892d1da81802d0f9520_427_0.png)


  Figure 26-3. Monthly active users and company cloud costs during the introduction
  of a free-tier offering

  图 26-3. 推出免费套餐期间的月活跃用户数和公司云成本


  Changing from corporate revenue to a unit like MAU, pages served, or API calls made
  will provide better context.

  从企业收入改为 MAU、服务页面数或 API 调用次数等单位指标将提供更好的上下文。


  Changes in the price charged to customers won’t change the unit metric value when
  you’re using a unit that’s not directly tied to the revenue of the organization.

  当使用与组织收入没有直接关联的单位指标时，客户收费价格的变化不会改变单位指标值。


  When you use these metrics, measuring the amount of business throughput created
  by the cloud platform—especially in relation to cloud spend—becomes the key element
  in making business decisions around cloud cost efficiency.

  使用这些指标时，衡量云平台创造的业务吞吐量——尤其是相对于云支出——成为在云成本效率方面做出业务决策的关键要素。


  Both of these unit economic metrics are useful for different purposes.

  这两种单位经济指标对于不同的目的都很有用。


  Figure 26-2 indicates the organization has some work to do in effecting conversion
  from free tier to paid—not something the engineering team is responsible for—while
  Figure 26-3 gives us information about how well the engineering team is controlling
  costs.

  图 26-2 表明组织在将免费套餐转换为付费套餐方面还有一些工作要做——这不是工程团队负责的——而图 26-3 为我们提供了有关工程团队控制成本效果的信息。


  These are both important for the business but highlight different decisions that
  need to be made by various parties influencing and relying on cloud spend.

  这两者对业务都很重要，但突出了由影响和依赖云支出的各方需要做出的不同决策。


  ## Activity-Based Costing

  ## 基于活动的成本核算


  You’re probably thinking: “Well, that sounds fine, but my business isn’t so simple
  that I can align cloud spend to revenue.”

  你可能在想：“听起来不错，但我的业务没那么简单，无法将云支出与收入对齐。”


  What type of unit metrics should you provide if your business model or structure
  makes tying revenue to cloud challenging or impossible?

  如果你的业务模式或结构使得将收入与云关联变得困难或不可能，你应该提供什么类型的单位指标？


  This is where another form of unit metrics called activity-based costing aims to
  look at the units of nonmonetary outputs that a set of cloud spend is creating.

  这就是另一种称为基于活动成本核算的单位指标形式旨在查看一组云支出所创造的非货币产出单位的地方。


  Look at what tasks each specific application or service is performing.

  查看每个特定应用程序或服务正在执行哪些任务。


  Is the application servicing API calls, is it returning a certain unit of data,
  or is it moving something from one place to another?

  该应用程序是否在提供 API 调用，是否返回特定单位的数据，或是否在将某物从一个地方移动到另一个地方？


  These measures are often even more effective than revenue in enabling data-driven
  decisions by the long tail of teams and applications in the cloud.

  这些衡量指标通常比收入更有效地使云中长尾团队和应用程序能够做出数据驱动的决策。


  Advanced practitioners will look at what it costs to perform specific tasks related
  to the underlying functions of the infrastructure.

  高级从业者会查看执行与基础设施底层功能相关的特定任务的成本。


  They budget with an understanding of the machine hours involved to accomplish the
  task: the cost per file created, cost per render, etc.

  他们在预算时了解完成任务所涉及的机器小时数：每个文件创建的成本、每个渲染的成本等。


  In Figure 26-4, you''re tracking the number of files being rendered by your service
  and the cloud costs involved in supporting it. As render jobs increase, so do the
  cloud costs.

  在图 26-4 中，你正在跟踪服务渲染的文件数量以及支持它所涉及的云成本。随着渲染作业的增加，云成本也在增加。


  ![](img/4d4736bc293fd892d1da81802d0f9520_428_0.png)


  Figure 26-4. Files rendered over the costs, increased rendering

  图 26-4. 渲染文件与成本，渲染量增加


  In Figure 26-5, you''re tracking the costs of rendering files. The cloud costs increase
  mid-month, but the number of rendered jobs does not.

  在图 26-5 中，你正在跟踪渲染文件的成本。云成本在月中增加，但渲染作业的数量并未增加。


  This highlights that something has changed. You''re now paying more to render a
  file than you were at the start of the month.

  这突出显示了一些变化。你现在渲染一个文件的费用比月初更高。


  This could be due to more resources being used or reservations no longer being applied
  to your cloud resources.

  这可能是由于使用了更多资源或预留不再应用于你的云资源。


  ![](img/4d4736bc293fd892d1da81802d0f9520_429_0.png)


  Figure 26-5. Files rendered over the costs, increased cost

  图 26-5. 渲染文件与成本，成本增加


  As we discussed in Chapter 5, the cloud bill is driven by the confluence of the
  usage multiplied by the rate.

  正如我们在第 5 章中所讨论的，云账单由使用量乘以费率的汇合驱动。


  So when you''re over budget, you can determine whether it''s about your resource
  usage or changes to your commitment-based discounts.

  因此，当你超出预算时，你可以确定这是关于你的资源使用情况还是基于承诺的折扣的变化。


  When you''re doing activity-based costing, you''re actively managing those cost
  drivers.

  当你进行基于活动的成本核算时，你正在积极管理这些成本驱动因素。


  ## Coming Back to the Iron Triangle

  ## 回到铁三角


  One of the best ways to enable your organization to make decisions is by using the
  Iron Triangle (i.e., balancing between good, fast, and cheap) discussed in Chapter
  14 to frame these decisions.

  使组织能够做出决策的最佳方式之一是使用第 14 章中讨论的铁三角（即在好、快、便宜之间取得平衡）来为这些决策提供框架。


  Unit metrics provide teams the data they need to measure how infrastructure changes
  will impact costs.

  单位指标为团队提供他们需要的数据来衡量基础设施变化将如何影响成本。


  Conversations between technical operations teams and finance become less about the
  technical details of the change and more about the impact they will have, freeing
  up engineers to focus on working within the unit metric-enabled financial constraints
  agreed with the business teams, as discussed in Chapter 26.

  技术运营团队与财务之间的对话不再关注变更的技术细节，而更多关注其影响，释放工程师专注于在与业务团队商定的、由单位指标支持的财务约束范围内工作，正如第 26 章所讨论的。


  This allows the business to make decisions that weigh the benefits of the change
  against the expected impact to the unit metrics, such as whether increasing the
  cost per active user by 2% might boost application performance by 10%, which could
  have positive business outcomes that make the additional investment worthwhile.

  这使企业能够做出权衡变更收益与对单位指标预期影响的决策，例如，将每个活跃用户的成本提高 2% 是否可能将应用程序性能提升 10%，这可能带来积极的业务成果，使额外投资物有所值。


  We hear of some FinOps practitioners choosing not to implement unit metrics or delaying
  them due to their complexity.

  我们听说一些 FinOps 从业者因其复杂性而选择不实施单位指标或推迟实施。


  Ultimately, the nirvana state of FinOps is for your organization to be making decisions
  on the value of the cloud spend, no matter what method you use to measure value
  and compare it to costs: deciding when to spend more in order to have a positive
  impact on the value you get from your cloud environment, and when to reduce cost
  is more appropriate.

  最终，FinOps 的极乐状态是你的组织能够根据云支出的价值做出决策，无论你使用什么方法来衡量价值并将其与成本进行比较：决定何时增加支出以对从云环境中获得的价值产生积极影响，以及何时减少成本更为合适。


  When you apply unit metrics to the optimize phase of the FinOps lifecycle, your
  goal setting matures from using only operational metrics, like hitting 90% commitment-based
  discount coverage, to using revenue-impacting goals like reducing cost per subscriber
  by 25%.

  当你将单位指标应用于 FinOps 生命周期中的优化阶段时，你的目标设定将从仅使用运营指标（如达到 90% 的基于承诺的折扣覆盖率）成熟为使用影响收入的目标，如将每个订阅者的成本降低
  25%。


  The former could help the business, but it can also be a distraction from what’s
  really important.

  前者可以帮助企业，但也可能分散对真正重要的事情的注意力。


  ## What’s Missing from the Equation?

  ## 方程中缺少什么？


  So far, you’ve been using cloud spend as the numerator; however, you will likely
  need to incorporate a number of other costs into the TCO.

  到目前为止，你一直将云支出用作分子；然而，你可能需要将许多其他成本纳入 TCO。


  After all, infrastructure costs often pale in comparison to labor costs.¹

  毕竟，基础设施成本通常与劳动力成本相比相形见绌。¹


  Unit metrics are most helpful when you have all the relevant cost data, including
  things like labor costs.

  当你拥有所有相关的成本数据（包括劳动力成本等）时，单位指标最有帮助。


  The successful FinOps stories we’ve shared so far focus purely on cloud costs.

  我们迄今为止分享的成功的 FinOps 案例纯粹关注云成本。


  Dividing the cloud spend alone by a unit provides limited context to the real cost
  per unit.

  仅将云支出除以一个单位为每个单位的实际成本提供了有限的上下文。


  In reality, a business has many other costs contributing to the total cost of generating
  revenue.

  实际上，企业有许多其他成本有助于产生收入的总成本。


  In Chapter 15, we discussed refactoring services into a serverless architectural
  model.

  在第 15 章中，我们讨论了将服务重构为无服务器架构模型。


  When deciding to rearchitect services, you should weigh the infrastructure charges
  and potential savings against the labor costs for refactoring.

  在决定重新架构服务时，你应该权衡基础设施费用和潜在节省与重构的劳动力成本。


  Also, once a service is running in a serverless architecture, the cost of the service
  can become less about the cost of the cloud resources being charged and more about
  the operational costs of labor.

  此外，一旦服务在无服务器架构中运行，服务的成本可能不再是所收取的云资源的成本，而是更多地关于劳动力的运营成本。


  Of course, you could extend FinOps itself to track costs from outside the cloud
  bill, like costs of the equipment still running in your data center or the added
  costs of software licensing.

  当然，你可以扩展 FinOps 本身来跟踪云账单之外的成本，例如仍在数据中心运行的设备的成本或软件许可的额外成本。


  However, in our opinion, it makes better sense for FinOps to work alongside existing
  financial models as we discussed in Chapter 25.

  然而，我们认为 FinOps 与我们第 25 章中讨论的现有财务模型一起工作更有意义。


  Working with these other frameworks, you can enrich the unit metrics you use to
  make decisions with the total cost, instead of one that includes only cloud spend.

  与这些其他框架一起工作，你可以用总成本丰富你用来做决策的单位指标，而不是仅包括云支出的指标。


  Using the FinOps maturity model as a guide, here are typical phases of bringing
  in noncloud costs to the unit economics denominator as laid out in the Introduction
  to Cloud Unit Economics paper from a recent FinOps Foundation working group:

  以 FinOps 成熟度模型作为指南，以下是根据 FinOps 基金会最近一个工作组发布的《云单位经济学导论》论文中概述的，将非云成本引入单位经济分母的典型阶段：


  1 Matt Asay, “Labor Costs Can Make Up 50% of Public Cloud Migration, Is It Worth
  It?” TechRepublic, May 9, 2016, https://oreil.ly/76m57.

  1 Matt Asay，《劳动力成本可能占公共云迁移的 50%，值得吗？》TechRepublic，2016 年 5 月 9 日，https://oreil.ly/76m57.


  ### Step 1: Cloud Costs Only

  ### 第 1 步：仅云成本


  Depending on the complexity of the application, this may also be done in multiple
  phases, where some cloud costs are handled initially as “direct” and others “shared.”

  根据应用程序的复杂性，这也可能分多个阶段进行，其中一些云成本最初被处理为“直接”成本，其他为“共享”成本。


  ### Step 2: Cloud + SaaS + Licensing Costs

  ### 第 2 步：云 + SaaS + 许可成本


  This could include things like Datadog, ServiceNow, or PagerDuty, or BYOL (“bring
  your own license”) like Windows or SQL Server, which are run on cloud infrastructure.

  这可能包括 Datadog、ServiceNow 或 PagerDuty 等，或 BYOL（“自带许可”）如 Windows 或 SQL Server，这些都在云基础设施上运行。


  Once you start bringing in SaaS tools or licenses, you may need to work with the
  team responsible for that product to understand the KPIs they care about and how
  they quantify time spent, such as the SAM or ITAM team.

  一旦你开始引入 SaaS 工具或许可，你可能需要与负责该产品的团队合作，以了解他们关心的 KPI 以及他们如何量化花费的时间，例如 SAM 或 ITAM 团队。


  ### Step 3: Cloud + SaaS + Human Capital + Hybrid Costs

  ### 第 3 步：云 + SaaS + 人力资本 + 混合成本


  This is bringing in costs like labor or even on-premises costs that support a particular
  product or service.

  这是引入支持特定产品或服务的成本，如劳动力甚至本地成本。


  The run phase is typically when a firm starts collecting more than one metric for
  various parts of a complex system getting more granular over time.

  运行阶段通常是企业开始为复杂系统的各个部分收集多个指标并随着时间的推移变得更精细的时候。


  When you begin including noncloud costs in your FinOps unit economics, such as labor
  and noncloud technology investments, you’re not managing simply cloud costs anymore;
  you’re managing the larger business.

  当你开始在 FinOps 单位经济中纳入非云成本（如劳动力和非云技术投资）时，你不再仅仅管理云成本；你在管理更大的业务。


  When the FinOps culture allows all your groups across the organization to collaboratively
  look at all of your cost data, compared to the value that your organization is providing
  or deriving from it, and make good decisions, that’s the nirvana state of unit economic
  data-driven cloud value decision making.

  当 FinOps 文化允许组织中的所有团队共同查看所有成本数据，与组织提供的或从中获得的价值进行比较并做出良好决策时，那就是单位经济数据驱动的云价值决策制定的极乐状态。


  It’s not something FinOps can do alone.

  这不是 FinOps 单独可以做到的。


  Cloud is increasingly becoming the driver of digital value in every organization
  of the future, so it is something that cannot be done without FinOps.

  云正在日益成为未来每个组织数字价值的驱动力，因此这是无法在没有 FinOps 的情况下完成的事情。


  ## When Have You Won at FinOps?

  ## 何时在 FinOps 中取得胜利？


  We want to highlight that there is no finish line when it comes to FinOps.

  我们想强调的是，FinOps 没有终点线。


  We can’t offer you the point beyond which you have no more to learn and nothing
  more to do.

  我们无法为你提供一个点，超过该点你就不再有东西可学，也没有更多事情可做。


  Practices continue to evolve, and cloud service providers constantly release updates
  to their offerings and related billing data.

  实践不断发展，云服务提供商不断发布其产品和相关计费数据的更新。


  In short, as long as cloud is evolving and changing, so will FinOps.

  简而言之，只要云在不断发展和变化，FinOps 也会如此。


  Companies implementing FinOps today—especially those early in their cloud journey—will
  derive the most value from their cloud investments by avoiding the bill shock moments
  and related innovation slowdown.

  今天实施 FinOps 的公司——尤其是那些处于云之旅早期的公司——将通过避免账单冲击时刻和相关的创新放缓，从其云投资中获得最大价值。


  FinOps in these organizations won’t be seen as a single role or small team that
  does FinOps; instead, all related personas inside the organization (from engineering
  to finance to procurement and business) will understand their role to play in the
  whole company doing FinOps.

  在这些组织中，FinOps 不会被视为执行 FinOps 的单一角色或小型团队；相反，组织内部的所有相关角色（从工程到财务到采购和业务）将理解他们在整个公司执行
  FinOps 中的作用。





  ## 当 FinOps 文化运行良好时：

  -   集中式的 FinOps 团队获得充分资助，以解决 FinOps 的集中职能活动，减少各团队的重复工作，并引导公司沿着不断提升的 FinOps 成熟度发展。

  -   所有团队在定期节奏中相互有效沟通，使用自动化、通用平台和共同的术语。

  -   云服务的持续更新、新服务推出，以及根据所创造价值定期创建和删除系统，在所有学科中都被从容应对。


  ## 对于工程师和产品负责人：

  -   架构由工程师从一开始就以成本为考量而创建。

  -   工程师将成本作为一级指标，不仅在构建决策中使用，也作为其核心 KPI 中的持续指标来优先安排开发工作。

  -   FinOps 认证和成熟度指标成为其工作要求、培训计划和激励计划的一部分。

  -   所有可扩展、弹性或依赖云服务的事项都迁移到云端。

  -   产品团队在产品定价和其他决策中考虑并定期查看成本。

  -   工程部门拥有完全面向云的开发平台，具有集成管道和 DevOps 方法。它仅通过自动化部署资源，并拥有完全标记的环境，采用与业务成果相一致的预算挂钩的一致账户和标签策略。


  ## 对于财务：

  -   财务已转向敏捷的预测和预算流程，在所有工程团队的赋能下，这些团队对其自身的预测和预算负责。

  -   之前用于数据中心的资产的开销被核销并消除。

  -   财务对运营分配要求提供持续输入，例如将现有会计结构叠加到应用程序上的标签前提条件，并提供敏捷预测和预算所需的数据导出访问权限。


  ## 对于领导层：

  -   管理层已完全接受基于云的运营模式。

  -   FinOps 只是管理层期望组织有效使用云的方式之一。向 FinOps 团队推销的日子已经一去不复返了。

  -   领导者对技术投资的回报有清晰的可见性，对预测支出中的常规波动有清晰的把握，并有响应迅速的路径来为未来投资提供战略指导。


  随着 FinOps 在组织内部成熟，FinOps 发生的边界已不清晰。组织各地的每个人都以自己的方式为云使用所产生的价值成功做出贡献。


  在理想世界中，FinOps 只是自然发生；每个人贡献出实现从云中获得最大价值目标所需的精确努力，且完美对齐。但我们知道，如果没有人协调这些努力，在组织内部实现这一目标的可能性很低。最初，FinOps
  从业者受雇于教育并建立流程，以实现和集中管理在组织内部单一节点运营更佳的 FinOps 元素。随着 FinOps 的流程和教育在组织内成熟，工程团队在浪费产生前就会考虑云浪费的可能性，财务团队与工程团队保持积极沟通，云支出的期望趋于一致，FinOps
  从业者为保持 FinOps 成功运行所需的时间和精力减少。


  将 FinOps 从业者想象成辐射 FinOps 温暖的加热器。随着从业者在组织内产生积极影响，他们提供温暖，以激励周围的人做好 FinOps。这些其他角色在为
  FinOps 做出贡献时也变得活跃，并温暖他们周围的人。最终，整个组织都温暖起来，FinOps 从业者需要提供的热量减少。


  问题随之而来，如果我们拿走 FinOps 能量的原始来源——FinOps 从业者——FinOps 是否仍会在组织内保持活跃？


  ## 结论


  你现在应该理解，你一路建立的 FinOps 流程如何使你能够开始衡量云支出与其带来的业务价值。你利用业务价值来设定优化目标，并使用指标来跟踪云成本的真正驱动因素。


  ## 总结：

  -   FinOps 的极乐阶段是达到组织基于业务价值对云支出做出持续、数据驱动决策的地步。

  -   谁做出这些决策？架构师在设计基础设施时，工程师在编写代码和部署服务时，财务和采购团队在向云提供商做出承诺时，以及领导者在推动技术战略时。

  -   这是一项持续的协作努力，只有在发生 FinOps 文化转型时才能实现。

  -   你的单位经济指标衡量云支出的业务价值并指导与其相关的持续决策。

  -   结构复杂且产品多样化的组织通常会有多个单位指标，每个指标都与特定的产品线、应用程序或服务相关。

  -   决策不再关注云的成本，而是基于云支出为组织带来的收益。


  在最后一章，我们将以讨论 FinOps 背后的引擎结束：*你*。

  '
- '## 你是秘诀所在


  借用《功夫熊猫》电影的话，FinOps 的秘诀在于 FinOps 并没有秘诀。成功的秘诀是你。也是你组织中影响云支出的每一个人。


  剧透警告：在电影中，主角 Po（一只可爱笨拙的大熊猫）旨在成为一名伟大的战士。他收到一卷神秘的卷轴，据说能为阅读者解锁无限力量。然而，当他最终打开它时，卷轴似乎是空白的，内部只有反射表面。沮丧之下，Po
  放弃了并回到他作为面条汤小贩的枯燥生活。Po 问他的父亲家族著名汤的秘诀是什么。他的父亲做出惊人的揭示：汤没有秘诀——秘诀是制作它的人。这是对 FinOps 的完美隐喻。我们无法告诉你如何成为
  FinOps 战士，但我们可以告诉你，如果你致力于学习、协作和改进，你的实践——以及你的职业生涯——将会蓬勃发展。


  如果你读到这里，你可能已经相当深入地走在 FinOps 工作或与其并行的工作道路上，或者正在认真考虑该领域的职业。截至 2022 年，60% 的企业已实施某种程度的
  FinOps 实践，但大多数尚未组建完整的团队，另外 40% 将迅速扩充人员。因为如果你在规模上使用云，你就需要做 FinOps。


  但问题在于：FinOps 需要人，而市场上根本没有足够的 FinOps 从业者来满足需求。是的，你可以——也应该——随着时间的推移尝试自动化尽可能多的重复性任务，但要发展、培训、推广和建立实践，需要一个
  FinOps 团队来传播最佳实践、标准和模式。随着其发展，实践需要深思熟虑的高管来推动自上而下的文化变革，深思熟虑的工程领导者开始将成本整合到团队的工作流程中，深思熟虑的财务领导者采用更敏捷的流程以更成功地与工程对应方合作，以及每个人都认识到赢得云价值游戏需要团队合作。


  ## 行动呼吁


  面临 FinOps 行业的最大挑战——可以说，云行业也是如此——是熟练 FinOps 从业者短缺。但他们不能一夜之间产生。像任何学科一样，成为 FinOps 精通需要数年时间，阅读本书不会神奇地让你达到——但这是一个很好的开始。


  > *The best time to plant a tree was 20 years ago. The second best time is now.*

  > —Chinese proverb


  我们对你的挑战是双重的。从这里继续前进并致力于学习。但也要开始为更大的社区做出贡献。第一部分帮助你和你的组织，而第二部分帮助每个人，这反过来也帮助你，因为一涨潮就浮起所有船。


  行业需要其从业者变得更加标准化、更加严谨，分享更多最佳实践，进行开源代码贡献，为培训做出贡献并鼓励他人参与，毫不松懈地专注于提升内部团队技能，并寻找机会为职业道路带来新鲜面孔。


  FinOps Foundation 为实践相关的各种角色提供培训，但这还不够。最终，我们需要共同努力，将云价值学习基础嵌入大学课程、代码学校，甚至高中计算机科学课程。会有
  FinOps 学士学位吗？也许不会，但我们相信在未来几年内，应在相关学位中增加专门的大学模块。


  你在近 450 页中阅读的概念必须开始进入常规教育项目，不仅是计算机科学相关学科，还包括会计、工商管理、金融、管理、项目管理以及最终成为 FinOps 实践关键利益相关者的相关学位。从这些项目毕业并进入依赖云的企业工作的学生——而世界上几乎每个企业都依赖云——将直接或间接参与
  FinOps 实践。


  会计、金融和计算机科学都有规范，允许这些领域的经验丰富的从业者快速融入不同公司的类似角色。这些相同的规范和原则，即 FinOps Foundation 多年来讨论的大部分内容——并在本书记载——必须向前推进，以帮助每个人更成功。




  ## 如何提供帮助：

  -   阅读在 *FinOps.org* 上发展的开源实践演进典范。

  -   找出你可以填补的空白：这能提高整体水平，同时也能提升你职业生涯的可见度。

  -   参加 FinOps 培训并反馈它还需要涵盖哪些内容或需要存在哪些新培训。

  -   加入一个工作组，与同行一起协作定义最佳实践。

  -   旁听——或主动在——FinOps 活动上发言。虚拟峰会、本地聚会和更大规模的线下活动一直在不断举行。

  -   通过在相关行业活动和出版物中引入 FinOps 概念来传播。


  需要更多想法？请参阅 FinOps Foundation 入门页面，了解根据成熟度阶段回馈社区的最新方式。你最初可能只以仅旁听模式开始，但随着时间的推移可以参与工作组，甚至有志于领导其中一个，直接塑造行业未来。


  公有云及其可变成本模式的采用肯定会继续增长。FinOps 必须与之同步发展，使组织能够在不支付因使用不当而可能产生的巨大罚金的情况下，享受使用云带来的好处。你是充满活力且不断成长的社区的一员，该社区将使数字转型的承诺成为世界各地许多人的现实，我们迫不及待想看看你下一步会做什么。


  我们期待在社区中见到你，在那里我们可以共同庆祝、共同奋斗、共同学习，并一起构建 FinOps。


  ## 后记：优先事项（来自 J.R.）


  在提交本书第一版初稿的截止日期十天后，我八岁的双胞胎儿子之一去世了。在他最后三个周末中的两个，我独自待在家庭办公室编辑，而我的妻子和孩子们则去俄勒冈海岸等地冒险。


  2019 年 7 月 26 日星期五，Mike 和我完成了那个截止日期。我感到自豪。我在家的白板上写下“FinOps 书于 7 月 26 日提交”来纪念这一日期。我在
  LinkedIn 上发布了它已提交的消息。Mike 也在里程碑上发帖，他也花了无数个晚上和周末离开家人来写这本书。


  第二天，星期六早上，我本应该和孩子们玩耍。但在数月的写作之后，在我全职以上的日间工作之上，我又回到家庭办公室处理邮件。我的双胞胎 Wiley 和 Oliver
  在我打字时顽皮地走进来。当我没有足够关注他们时，Wiley 修改了上述白板文字，使其读起来像这样：


  ![](img/4d4736bc293fd892d1da81802d0f9520_439_0.png)


  一周多一点后，Wiley 在睡梦中去世。伴随着痛苦和悲伤的是对与他共度的、因更不重要的事情而失去的时间的极度懊悔。我写了一篇关于他生平和去世——以及它对我的影响的长文。我相信它之所以走红，是因为它传达了珍惜和优先安排你所拥有的时间的讯息。我邀请你阅读它。


  虽然这本书旨在帮助你的 FinOps 实践，但不要让即将到期的承诺或规模调整冲刺阻止你在周五晚上回家，全身心地陪伴家人。即使该承诺购买能为你的公司节省 10 万美元。这也不值得失去的时间。周一再做。如果你的老板不喜欢，就联系
  FinOps Foundation 团体找另一份工作。那是一个既有专家又有好人的社区。


  你的团队不太可能一夜之间取得长期影响。找到良好的工作生活平衡。即使你的团队在周末对一切进行规模调整，这也只是一次性努力。如果没有建立全公司范围的文化、流程和实践来支持
  FinOps，这些一次性降本项目将是短暂的。用于工作的周末最终会在时间的沙滩上被冲刷掉。


  最后，FinOps 将会演进。它不仅随着云服务提供商不断创新而变化，也随着更多 FinOps 从业者分享他们的故事而变化。这本书不是定义 FinOps 的终点——它真的只是开始。如果你想为下一步做出贡献，请加入
  FinOps Foundation，成为故事的一部分。


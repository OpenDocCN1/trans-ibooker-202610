  - Because account C has RI sharing disabled, the RIs within that account will not
  apply a discount outside of account C and will go unused when no usage matches.

  - 由于账户 C 已禁用 RI 共享，该账户内的 RI 不会在账户 C 外应用折扣，并且在没有匹配用量时会未被使用。

  - Account D will not receive any RI discounts because it has RI sharing disabled
  and does not have any RIs purchased within the account.

  - 账户 D 不会收到任何 RI 折扣，因为它已禁用 RI 共享并且账户内未购买任何 RI。


  It’s worth taking a moment to reread this list. The majority of people we’ve met
  over the years commonly misunderstand some part of RIs, and this can lead to RIs
  not applying discounts where you expect them to. Knowing how to control where RIs
  apply and where they don’t allows you to choose the best strategy for where to buy
  reservations.

  值得花点时间重新阅读此列表。我们多年来遇到的大多数人通常都会误解 RI 的某些部分，这可能导致 RI 未在您期望的地方应用折扣。了解如何控制 RI 应用的位置以及不应用的位置，可以让您选择最佳的购买预留策略。


  ## 标准与可转换 RI


  当您从 AWS 购买 RI 时，可以作为单个租约的一部分同时购买多个 RI。标准预留实例 (SRI) 允许您在最初购买时设置参数。


  对于 SRI，可以修改其中一些参数，例如可用区和范围（区域与可用区）。对于 Linux/UNIX RI，同一 RI 租约的一部分可以拆分和合并（例如，两个 medium
  合并为一个 large）。然而，您无法修改许多其他参数，例如期限长度、操作系统、实例族（m5、c5）和租用类型（共享或专用）。一旦购买了标准 RI，您就承诺在
  RI 期限（一年或三年）内运行与这些参数匹配的资源。


  对于 EC2 实例，有一种更灵活的选择，即可转换预留实例 (CRI)。作为折扣百分比较低的回报，您可以在期限内将 RI 预留交换为不同的预留。交换仍有一些限制适用。


  无论如何，您都不能减少对 AWS 的整体承诺。例如，如果交换导致承诺降低，您就不能用更便宜的 RI 预留替换昂贵的 RI 预留。在这种情况下，需要进行补差费用，使修改包含更多
  RI 或更昂贵的参数。当 RI 交换导致费用增加时，AWS 将向您收取任何应付预付款的净差额。


  有一个流程允许您拆分 CRI 预留，以便您可以转换单个 RI 租约内部分 RI 而不是全部。同样，也有流程可以将多个 CRI 预留合并在一起，允许您将它们全部修改为一个新的
  CRI 预留。然而，在期限内无法修改 CRI 的某些参数：


  - CRI leases are purchased for a particular region and cannot be exchanged for another
  region.

  - CRI 租约是为特定区域购买的，不能交换到另一个区域。

  - CRI leases are for EC2 instances only and cannot be converted to other services;
  for example, if you move your database from an EC2 instance into RDS, you cannot
  exchange your CRI for an RDS RI.

  - CRI 租约仅适用于 EC2 实例，不能转换为其他服务；例如，如果您将数据库从 EC2 实例迁移到 RDS，则不能用 RDS RI 交换您的 CRI。

  - The term for CRIs cannot change, except that when joining CRIs you can sometimes
  extend the term from one to three years.

  - CRI 的期限不能更改，除非在合并 CRI 时有时可以将期限从一年延长到三年。


  除了这些限制外，总体而言 CRI 对组织的风险要低得多。除非您可能在期限内减少 EC2 的总使用量，否则您可以在期限内更改 EC2 使用参数并交换您的 CRI
  以匹配您的参数的预留。请记住，然而，分析


  确定要进行哪些转换以及手动执行转换所需的工作量，仍然需要 FinOps 团队花费时间和精力。


  EC2 预留实例 (RI) 还包含一项称为容量预留的功能。配置为区域 (zonal)（即它们适用于特定可用区中的资源）的 RI 将合同保证服务器容量。此容量仅对拥有该
  RI 的同一 AWS 账户可用，并且仅适用于所选可用区中的特定资源配置。如果账户中存在未使用的 RI，并且收到向 AWS 请求与该预留匹配的 EC2 实例的请求，则可以保证容量的可用性。与
  RI 折扣一样，您无法将容量预留分配给任何特定实例，因此该账户内运行的第一个匹配实例将消耗此容量预留。


  设置为区域的 EC2 RI 将对该区域内任何可用区中的任何资源应用折扣，但不会提供任何容量预留。然而，区域 RI 可以与相关的 AWS 服务按需容量预留 (ODCR)
  结合使用。ODCR 实例预留按即需费率计费，如同正在运行的 EC2 实例，但也可以由您拥有的 RI 覆盖，以在整个区域实现 RI 折扣并获得容量预留。


  ## 实例大小灵活性


  EC2 RI 是根据特定实例大小（small、medium、large、xlarge 等）购买的。RI 将对与其大小匹配的资源应用折扣。然而，对于区域 Linux/UNIX
  RI，您可以受益于前面提到的功能，即实例大小灵活性 (ISF)。您当前拥有或计划购买的属性为 Linux、区域和共享租用的预留将自动成为 ISF RI。


  ISF 允许 RI 对同一系列中的不同大小实例应用折扣（m5、c5、r4 等）。单个 large RI 可以对多个较小的实例应用折扣，而单个 small RI
  可以对大型实例应用部分折扣。ISF 提供了更改实例大小而不失去 RI 应用的折扣的灵活性。由于您无需指定 RI 的确切大小即可覆盖所有不同大小的实例，因此可以将
  RI 购买捆绑为参数的小变化。


  图 17-3 说明了如何应用 ISF 的一种思路。每一列代表在给定一小时内运行的实例。对于 r5 和 c5 实例，large (L) 是最小的实例大小。如果您在此示例中以
  100% 的 RI 利用率为目标，您将购买 29 个 large RI。可以将其视为以系列内的最小尺寸购买 LEGO 积木并将其组合以覆盖您实际运行的较大实例大小。这意味着您购买的
  RI 只有一种大小，与您的整体使用情况非常匹配。如果实例大小波动但归一化使用量保持不变或总体增加，您的 RI 将保持完美利用。


  ![](img/4d4736bc293fd892d1da81802d0f9520_295_0.png)


  ### 图 17-3. 将 AWS 实例大小转换为具有大小灵活性的归一化大小


  AWS 使用归一化因子来确定特定 RI 如何与 ISF 一起应用。使用它可以计算出特定大小实例具有多少归一化单位。RI 使用相同的归一化因子来确定每小时可以应用多少归一化单位的折扣。


  表 17-2 中的归一化因子显示了如何在系列内在实例大小之间转换。例如，如果您拥有的 RI 为 2xlarge（16 个单位），该 RI 也可以应用于两个 xlarge（每个
  8 个单位）或四个 large（每个 4 个单位）实例。您也可以使用 2xlarge（16 个单位）的 RI 应用于一个 xlarge（8 个单位）和两个 large（每个
  4 个单位）实例。



- "# Cloud FinOps：协作、实时云价值决策，第2版\n\n\n\n\n## 云 FinOps\n\nFinOps 为云的变动支出模式带来财务问责。该管理实践被全球大多数企业采用，已从边缘活动发展成为事实上的云支出管理学科。在本书中，作者\
  \ J.R. Storment 和 Mike Fuller 借鉴了大规模云支出者的现实成功与失败，概述了建立云 FinOps 文化的流程。\n\n工程和财务团队、高管以及\
  \ FinOps 从业者都将学习如何构建高效有效的 FinOps 体系，以实现数据驱动的云价值决策。本修订版第二版附带入门路线图，其中新增章节涵盖预测、可持续性以及与其他框架的连接。\n\
  \n您将学到：\n\n-   在高管支持下建立 FinOps 文化的路线图\n-   如何理解和预测您的云支出\n-   如何赋能工程与财务实现合作伙伴关系\n\
  -   创建云和容器支出问责制的成本分配策略\n-   来自云承诺的费率折扣策略\n-   何时以及如何实现重复成本任务的自动化\n-   如何赋能工程团队在成本效率方面的行动\n\
  -   如何使用单位经济学指导数据驱动的决策\n\n> “采用 FinOps 需要高层和基层的支持。本版 FinOps 权威指南详细说明了如何与工程团队建立合作伙伴关系、如何准确预测支出、如何利用其他框架的数据影响决策，以及文化变革最终如何胜过强制规定。”\n\
  > —Beth Marki\n> JPMorgan Chase 云财务管理执行董事\n\nJ.R. Storment 是 FinOps Foundation 的执行董事。他与全球最大的云消费者合作，通过社区、教育和标准提升其人才。\n\
  \nMike Fuller 是澳大利亚 Atlassian 云 FinOps 团队的主工程师，负责发展 FinOps 实践并使工程团队能够高效地保持对云支出的控制。\n\
  \n## 探索 VMware 云 FinOps 最佳实践如何让您的组织受益\n\n![](img/4d4736bc293fd892d1da81802d0f9520_2_0.png)\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_2_1.png)\n\n理解您的云数据\n\n![](img/4d4736bc293fd892d1da81802d0f9520_2_2.png)\n\
  \n优化并控制您的云支出\n\n![](img/4d4736bc293fd892d1da81802d0f9520_2_3.png)\n\n提升您的云管理实践\n\
  \n## 对《云 FinOps》的赞誉\n\n> 安全是第 0 项工作，FinOps 是第 0.5 项工作。正如安全是每个人的工作，FinOps 也是如此。《云\
  \ FinOps》第二版提供了 FinOps 成功的配方。\n>\n> —Marit Hughes，德勤\n\n> FinOps 将业务、财务和工程整合在一起，推动云支出管理的透明度和问责制文化。Google\
  \ Cloud 和 FinOps Foundation 正在共同努力开创开放的计费标准，以进一步提高透明度并加速云业务价值。本书综合了这些协作成果。\n>\n\
  > —Mich Razon，Google Cloud 商业平台负责人，副总裁兼总经理\n\n> 优化成本对云迁移和向消耗型模式的转变至关重要。云优化应成为公司的重点关注领域。《FinOps》一书概述了如何推动在云端大规模运行的企业技术、财务和业务组织所需的文化变革的路线图。\n\
  >\n> —Fred Delombaerde，Microsoft 核心商务副总裁\n\n> 如今，公有云成本管理超越了任何单个供应商。大型组织需要将各种供应商的成本和使用数据规范化并合并为单一视图，以便工程、业务和财务部门做出数据驱动的决策。FinOps\
  \ Foundation 持续迭代 FinOps 框架并促进创建开放标准至关重要，以便供应商能够一致地展示其成本和使用数据，从而支持 FinOps 从业者的工作。\n\
  >\n> —Udam Dewaraja，Citi 云财务管理负责人\n\n> 任何希望优化云成本的公司都应首先查阅 *云 FinOps* 书籍，其次是 FinOps\
  \ Foundation 的资料和社区。这两种资源共同帮助为 Target Corporation 的 FinOps 实践奠定了成功的基础。我们利用 FinOps\
  \ 领域和能力为领导者和工程师构建工具。凭借《云 FinOps》第二版中包含的七个新章节，包括“将数据置于工程师路径中”和利用“FinOps 的用户界面”等关键概念，我们将成熟我们的\
  \ FinOps 实践和采用，以用于我们的公有云和私有云使用。\n>\n> —Kim Wier，Target Corporation 工程总监\n\n> 作为一种理论，FinOps\
  \ 对一些高管来说可能难以理解。领导层更有可能支持已经显示出可证明、可量化的成功的努力。证明价值，您就会获得所需的支持。《FinOps》一书中的新章节，如“FinOps\
  \ 的用户界面”和“采用 FinOps”，提供了关于如何推动工程团队在成本效率方面的行动并获得高管支持的宝贵见解。\n>\n> —Jason Rhoades，Intuit\n\
  \n> 采用 FinOps 需要高层和基层的支持。本版 FinOps 权威指南详细说明了如何与工程团队建立合作伙伴关系、如何准确预测支出、如何利用其他框架的数据影响决策，以及文化变革最终如何胜过强制规定。\n\
  >\n> —Beth Marki，JPMorgan Chase 云财务管理执行董事\n\n> FinOps 已成为定义财务和技术团队未来合作方式的新模式。《云\
  \ FinOps》一书为那些希望在不减缓技术团队和创新的情况下发展云支出管理与优化方式的组织提供了路线图。这对财务和技术团队来说都是必读之作，以帮助他们了解自己在云财务管理世界中的角色！\n\
  >\n> —Keith Jarrett，云财务管理负责人\n\n\n\n\n## 献给我们的家人\n\n致 Triangle 的 Jessica 和 Oliver，感谢你们再次的耐心与支持。还有\

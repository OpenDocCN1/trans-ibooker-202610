  \ 你是秘密成分 405\n行动呼吁 406\n### 后记：优先考虑什么（来自 J.R.） 409\n### 索引 411\n亲爱的读者，\n\n我是 J.R.\
  \ 和 Mike，这本书的合著者。我们于 2022 年初开始了第二版的工作。当我们在 2019 年撰写本书第一版时，世界是不同的。COVID 大大加速了向云的迁移，打破了之前所有关于云支出增长的估计。在我们开始撰写这一版后，全球经济衰退迫使组织——包括主要的云服务提供商——将云支出效率的重要性提升到董事会层面的讨论。亚马逊的\
  \ CFO 已承诺帮助客户削减云账单，而微软的 CEO 表示，他们的首要任务是帮助客户用更少的资源做更多事情。\n\n## 世界颠倒了\n\nFinOps 作为一个概念，从一个晦涩的术语变成了业务必需。在\
  \ 2020 年之前的会议上，我们经常听到：“FinOps 到底是什么？”预计到 2023 年，使用云服务的 80% 组织将建立专门的 FinOps 部门。FinOps\
  \ 基金会从我们眼中的一丝火花发展成为一股全球力量，拥有近 10,000 名从业者，代表每个主要行业以及财富 500 强、富时 100 强和澳洲证券交易所 250\
  \ 强的大多数公司。FinOps 从一个边缘术语发展到获得的搜索流量和分析师提及量是大型云厂商如亚马逊网络服务推动的“云财务管理”称号的 10 倍。\n\n按需付费\
  \ 模式——也称为 *变量支出模型*——允许工程师快速获得基础设施，以便他们能够快速创新。我们听到的故事仍然是：工程团队仍在云中消耗资源，成本效率的优先级不足。财务团队难以理解并跟上团队的支出情况，并正确分配云投资。领导层仍然不知道该拉动哪些杠杆来实现\
  \ FinOps 转型并推动更多云支出投资指导。\n\n\n\n问题在过去三年中变得更加复杂。云服务提供商增加了数十万种额外的产品库存单位（SKU），由数千项新功能驱动。在本版出版前的几个月里，Google\
  \ Cloud 和 Azure 以 Azure Savings Plans 和 Google Flexible Committed Use Discounts（Flexible\
  \ CUDs）的形式提供了全新的折扣承诺方式，再次改变了游戏规则。\n\n在我们各自职业生涯的过去十年里，我们从从业者和高管那里听到了一个一致的主题：缺乏可用的云价值教育和知识。Mike\
  \ 在为 Atlassian 庞大的云部署运行云成本优化时听到了这一点。J.R. 在担任 Cloudability 云支出管理平台（2019 年被 Apptio\
  \ 收购）的联合创始人期间，从 2011 年到 2020 年指导全球最大的云支出者，后来作为 Linux Foundation 的员工担任 FinOps Foundation\
  \ 的执行董事时也听到了这一点。\n\n基于我们所有人都可以学习的资源的需求，以及有人正式定义 FinOps 的需求，我们于 2019 年初与行业中的 26 位专家从业者联手创建了\
  \ FinOps Foundation。\n\n来自 FinOps Foundation 的近 10,000 名从业者组成的社区提供了我们将在本书中介绍的大部分最佳实践。本书中的示例来自他们在各种社区论坛上分享的宝贵经验和实战故事。我们还融入了他们的引语，以帮助将内容与关于\
  \ FinOps 的真实想法和观点联系起来。\n\n## Who Should Read This Book\n\n任何在运行或有志于在公有云中运行的公司从事工程、财务、采购、产品所有权或领导工作的人员都将从本书中受益。随着组织了解\
  \ FinOps 中的角色，它可以将它们映射到业务各地的相关团队。\n\n工程师最可能不习惯将成本视为日常关注点。在云计算之前的日子里，他们主要关心的是与硬件相关的性能。受采购限制，无法在需要时随时获得更多服务器，他们必须提前很久规划。他们必须考虑基础设施选择的成本及其对业务的影响。起初，这可能会感觉陌生，与他们主要关注的产品和功能增强交付相冲突。随着时间的推移，他们将成本作为另一个效率指标来调整，以积极影响业务。\n\
  \n> *很多工程师会直接用硬件来解决问题。FinOps 要求工程师考虑成本和利润率。*\n> \n> —John Stuart，Jobvite 的副总裁，负责\
  \ DevOps、安全与 IT\n\n*财务* 传统上专注于按月或按季度进行的追溯性报告，基于很快就会过时的固定预算。现在这项工作已经演变，以帮助业务持续向前发展，并主动与技术和工程团队合作进行支出预测，基于工程师的行为（他们不习惯考虑这些成本）。换句话说，他们正从不透明且固定的资本支出（CapEx）报告转向透明且灵活的运营支出（OpEx）预测。作为这一角色的一部分，财务团队成为了解在数千种\
  \ SKU 中云支出驱动因素的工程团队合作伙伴。他们帮助从根本上重新构想财务职能的执行方式，同时重新思考如何向高管和投资者报告技术支出。\n\n*采购团队* 习惯于严格控制支出、仔细的费率谈判，并在供应商付款前行使采购订单的权力。现在采购团队成为战略采购。他们将所有违规支出整合到与云服务提供商的企业协议中，以获得工程师已在使用以创造价值的资源的最佳费率。\n\
  \n> *我们不是靠从云服务提供商身上削减几分钱获胜。我们靠向客户交付功能获胜。*\n> \n> —Alex Landis，Autodesk\n\n*产品负责人*\
  \ 负责其产品的定价和利润率，在云计算之前的世界里，他们很难理解为服务客户或运营商业产品而产生的全部成本。云计算让他们能够了解交付数字价值的全部或大部分成本，了解新功能对成本的影响，并了解客户使用案例如何造成应用程序成本的差异。这使得产品团队能够与开发产品的工程团队更有效地协作，更有效地预测收入和利润率，并更有效地针对客户需求。\n\
  \n*领导层*，C 级高管、副总裁、董事或管理团队预算的技术领导者，往往已失去对云支出决策的直接控制，现在依赖其团队在合理预算内运营。技术高管不再提前很久规划大额采购决策。相反，他们更关注如何预测和管理已经发生的支出。讨论已从确保服务有容量转变为确保他们为工作花费了合适的资金。他们希望对花费多少有更多控制，并对花费在何处有更强的战略影响力。\n\
  \n本书旨在通过制定共同的词汇表和一套最佳实践来遵循，打破这些角色之间的壁垒。\n\n## About This Book\n\n在接下来的章节中，我们将正式定义\
  \ FinOps。我们创建的定义是由地球上最有经验的云财务管理团队制定的，他们管理的云支出每年达数亿美元（在某些情况下为数十亿美元）。我们收集了他们实现云成功的共同做法，以及他们已识别并解决的一些陷阱。我们将展示有效的\
  \ FinOps 是什么样子的，以及如何在您的组织中启动 FinOps 转变。\n\n以前，获取这些知识的唯一途径是参加这些专家会展示其想法的公开活动。本书和\
  \ FinOps Foundation 通过充满活力的社区、深入的培训资源和标准化的最佳实践改变了这一点。\n\n在您阅读完本书后，我们鼓励您参与 FinOps\
  \ Foundation 的各种计划，作为继续磨练您的技能和职业生涯的途径。该基金会的使命是推进每一个管理云价值的个人。社区就在这里为您服务。我们希望本书中的现实策略、流程和故事能够激励每个人更好地控制云支出。在此过程中，我们可以使我们的组织以及我们自己的职业生涯更具竞争力。\n\
  \n## What You Need to Know Before Reading On\n\n在撰写本文时，我们假设读者至少对三大主要公有云提供商之一（Amazon\
  \ Web Services [AWS]、Azure 和 Google Cloud Platform [GCP]）有基础水平的了解。读者应了解云的工作原理以及资源计费方式。他们还应熟悉主要的资源类型，如计算和存储，以及更高级别的服务，例如托管数据库、队列和对象存储。\n\
  \n对于所需的 AWS 知识水平，一个良好的起点是 AWS Business Professional 培训，或更好的是 AWS Cloud Practitioner\
  \ 认证。两者都涵盖在 AWS 中运营的基础知识。对于 Google，请查看 GCP Cloud Digital Leader 课程。对于 Azure，请尝试\
  \ Azure Fundamentals 学习路径。这些通常可以在一天的工作坊中完成或通过在线培训完成。\n\n读者还应了解云计算的工作原理基础；了解其云提供商上的关键服务，包括其常见用例；并对按需消费模式中的计费和定价有基本了解。\n\
  \n例如：作为 AWS 用户，您应该已经知道 EC2（Elastic Compute Cloud）和 RDS（Relational Database Service）之间的区别。您应该了解为这些资源付费的不同方式，例如按需，\n\
  \n预留实例 (RIs)、节省计划 (SPs) 和 Spot。如果您不了解 RIs 或 SPs 的详细工作原理或如何为其制定采购策略也没关系——我们将对此进行介绍——但您应该已经明白它们可用于节省计算资源费用。\n\
  \n## FinOps 正在演进\n\n过去几年里，我们所称的 FinOps 发生了如此多的演进——而且它仍将继续演进。随着云服务提供商提供越来越多的服务，并继续提供优化其平台的不同方式，FinOps\
  \ 将不断适应。我们建议在阅读本书时始终确认我们探讨的云服务提供商提供的细节。如果本书中存在任何更正、不同意见或批评，我们鼓励读者与我们联系。毕竟，正是有勇于挑战现状的人们帮助制定了我们今天所拥有的成功的\
  \ FinOps 实践。\n\n## 本书使用的约定\n\n本书使用以下排版约定：\n\n*斜体*\n\n表示新术语、URL、电子邮件地址、文件名和文件扩展名。\n\

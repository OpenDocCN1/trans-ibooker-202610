  \ Smith 和 William Bryant。\n\n感谢本书中允许我们引用他们言论的每一个人。\n\n## 第一部分\n\n### 介绍 FinOps\n\
  \n在本书的第一部分，我们涵盖了许多基础知识，例如 FinOps 是什么、团队如何运作、FinOps 的语言、云服务的计费方式，以及在 FinOps Foundation\
  \ 框架指导下开始您自己的 FinOps 之旅的路线图。\n\n## FinOps 是什么？\n\n最简单地说，FinOps 将财务问责制带入云的可变支出模式。但这种描述仅暗示了结果。运行在云中的文化变革将技术和财务决策的所有权从采购转移到组织的边缘，转移到工程、架构和产品团队。它使技术、财务和业务专业人员能够以更高效的方式共同工作。\n\
  \n世界各地的组织都在积极转向云，无论它们是否准备好。就像从大型机到客户端/服务器、到网络或到移动的转变一样，向云的转变（以及从项目到产品）带来了传统业务职能需要核算、请求和管理技术成本方式的巨大变化。\n\
  \nFinOps 要求您承认，管理基础设施的旧方法不仅无效；它们会造成失控的云成本威胁业务的情况。虽然未来仍需要传统的基础设施管理方法来管理自有基础设施，但无论多么严格地遵守这些方法——它们对云的可变消费模式处理不佳——都无法让组织在没有引入\
  \ FinOps 的情况下有效管理云。\n\n### 定义“FinOps”一词\n\n截至 2023 年初，FinOps Foundation 对其的定义如下：\n\
  \n> FinOps 是一种不断发展的云财务管理学科和文化实践，通过帮助工程、财务、技术和业务团队就数据驱动的支出决策进行协作，使组织能够获得最大业务价值。\n\
  \n\n\n其核心，FinOps 是一种文化实践。它是团队管理云成本的方式，每个人都对其云使用负责，并得到中央最佳实践组的支持。工程、财务、产品、采购等跨职能团队共同协作，以实现更快的产品交付，同时获得更强的财务控制力和可预测性。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_32_0.png)\n\nFinOps 是 “Finance”（财务）和\
  \ “DevOps” 的混成词，强调业务团队与工程团队之间的沟通与协作。Cloud FinOps 有时会被错误地称为 “Cloud Financial Operations”（云财务运营），但该术语因其与财务中更传统的\
  \ “Financial Operations”（财务运营）角色存在歧义而逐渐不受青睐。该实践的其他同义词包括 “Cloud Financial Management”（云财务管理）、“Cloud\
  \ Financial Engineering”（云财务工程）、“Cloud Cost Management”（云成本管理）或 “Cloud Optimization”（云优化）。无论你如何称呼它，FinOps\
  \ 都是从云支出中获取最大业务价值的做法。\n\n本章讨论 FinOps 的核心原则、相关文化转型的开始过程，以及为什么每个组织都需要拥抱这一学科以实现云成功。\n\
  \n但首先，让我们通过一个典型从业者旅程的故事来为定义 FinOps 设定背景。\n\n## FinOps 英雄之旅\n\n当今的 FinOps 负责人通常来自管理、规划和核算传统\
  \ IT 和虚拟化服务器的世界。以下是一个典型的故事，是我们多年来听到的故事的综合。你可能即将踏上类似的旅程，正在其中，或已经完成了其中的部分。故事中的主角名叫\
  \ Finn。\n\n*对 Finn 来说，一切都相当直接：回顾性财务报告每季度完成一次，而容量规划意味着外推使用趋势，以猜测组织未来几个季度的生产需求，以满足其产品不断变化的需求。支出方面并没有太多意外。*\n\
  \n*然后 Finn 注意到越来越多的 AWS 或 Google Cloud 应付款项在没有采购订单的情况下到来。他的一位精通云的同事 Ana 解释了云高度可变的特点，以及它与本地数据中心相比确实、嗯、不同——并且有一种全新的管理方式，以及一种新兴的专业学科来做到这一点。*\n\
  \n*Finn 仔细考虑了 Ana 的话。听起来确实有趣，也很有吸引力。但随后 Finn 想起了他为组织 8,000 台本地服务器制定的流程工作得有多好。云不可能有那么大的不同。肯定如果他只是更勤勉地应用现有流程，云成本也能得到管理。*\n\
  \n下一季度，云支出意外翻倍，Finn 夹着尾巴回到 Ana 身边。他承诺尝试一套新的流程，更频繁地查看支出，并增加与产生支出的工程团队的沟通时间。\n\n突然间，之前从未关心云支出的财务负责人开始推动\
  \ Finn 回到季度报告，称他采用的实时方法与公司的其他流程不匹配。技术负责人则表示反对，称她无法同时考虑成本并满足产品交付期限。Finn 的执行团队鼓励采用自上而下的控制方法。Finn\
  \ 再次向 Ana 求助，她将他引向 FinOps Foundation 的同行旅者。通过学习他们的失误和成功，Finn 开始制定计划，如何重置公司的流程，并更雄心勃勃地推动文化变革。\n\
  \n时机已到。Finn 推出了新的云支出分配策略、标签指南、rightsizing（即调整云资源以更好地匹配工作负载需求）的标准，以及对云服务提供商的初始费率优化承诺。终于出现了一条前进的道路，似乎让他能够核算支出，同时团队能够无摩擦地获得所需的技术。云迁移开始激增。\n\
  \n就在事情似乎进展顺利时，一位新 CFO 上任，称云在规模上成本过高，主张广泛回归数据中心。这是 Finn 最大的考验：与他的精通云的同事合作，证明云不仅仅是一个成本中心。他们必须展示云如何以本地数据中心无法实现的方式推动创新和速度，为公司带来竞争优势。CEO\
  \ 看到了更大的图景并表示同意，为云优先战略铺平了道路。\n\n信心倍增，Finn 勇往直前，打破团队之间的壁垒，帮助推动组织实现真正的变革。但他面临最后一次战斗：云支出现在达到实质性水平，影响了底线。CFO\
  \ 介入，采取一切必要手段遏制上涨趋势，以确保组织的利润率不受影响。Finn 超越了仅关注云支出的单一维度视角，转向将支出与业务价值挂钩的单位经济模型，这使他能够清楚地证明云支出走在正确的道路上。\n\
  \n最终，Finn 意识到这段旅程只是开始。云在不断演进，FinOps 亦然。Finn 和 Ana 将通过帮助定义其最佳实践，在这个新领域产生最大影响，他们认为这是回馈帮助他们完成自身旅程的社区的关键方式。\n\
  \n这段旅程的某些方面可能与你产生共鸣，而其他方面可能在你未来的旅程中出现。现在你已经听过一个典型故事，让我们看看 FinOps 从何而来。\n\n## FinOps\
  \ 从何而来？\n\n像 Adobe 和 Intuit 这样的先行者，作为公共云的早期扩展者，早在 2012 年就在湾区向合著者展示了未来 FinOps 的第一个\
  \ glimpse。在 2010 年代中期，他们与像 GE 和 Nike 这样的大公司互动，因为这些公司开始了与云使用快速扩张相关的早期 FinOps 之旅。几年后，Mike\
  \ 看到澳大利亚的前瞻性企业，如他自己的 Atlassian 以及 Qantas 和 Tabcorp 等，开始了类似的做法。最后，在 J.R. 2017 年至\
  \ 2019 年在伦敦的两年任期内，他亲眼目睹了 BP、HSBC 和 Sainsbury’s 等企业如何在其公司文化中发展这种新方法。FinOps 缓慢而同时地在世界各地诞生，因为随着各个行业和地区开始采用实质性的云量，云的财务和问责挑战在全球范围内大规模出现。图\
  \ 1-1 追踪了该术语的日益普及。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_34_0.png)\n\n图 1-1.\
  \ 2018 年至 2022 年间 “FinOps” 术语的搜索请求（来源：speakeasystrategies.com）\n\n“FinOps” 是一个姗姗来迟的术语。在早期，公司\
  \ simply 将该实践称为 “cloud cost management”（云成本管理）。后来，“cloud cost optimization”（云成本优化）开始流行，尽管它没有涉及云的分配挑战。AWS\
  \ 和其他云服务提供商开始使用 “cloud financial management”（云财务管理）这一短语，这是一个总称标题，根据图中引用的搜索和分析师提及，正在越来越多地被\
  \ “FinOps” 取代。其他公司，如零售商 Target，将其内部实践称为 “Engineering Efficiency”（工程效率）。图 1-2 显示了行业分析师对\
  \ “FinOps” 提及的增长。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_35_0.png)\n\n图 1-2.\
  \ 分析师文章中 FinOps 不同名称的提及（来源：speakeasy-strategies.com）\n\n在图 1-2 中，你可以看到云分析师文章中最近使用\
  \ “FinOps” 术语来描述这一实践领域的增加，而像 “cloud financial management” 这样的旧术语在关注度上有所下降。选择这个刻意呼应\

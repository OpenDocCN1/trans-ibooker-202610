  \ DevOps 定义开始：\n\n> \"DevOps\" 一词通常指的是倡导开发与 IT 运维之间协作工作关系的[content]\n## LinkedIn（人员\
  \ #FinOps）\n\n![](img/4d4736bc293fd892d1da81802d0f9520_36_0.png)\n\n图 1-3. 在 LinkedIn\
  \ 上将 FinOps 列为技能集的人员数量\n\n\n\n- FinOps 报告应易于访问且及时。\n  - 尽早处理并共享成本数据，一旦数据可用即刻进行。\n\
  \  - 实时可见性可自主推动更好的云利用率。\n  - 快速反馈循环带来更高效的行为。\n  - 组织各层级均可获得对云支出的持续可见性。\n  - 创建、监控并改进实时财务预测和规划。\n\
  \  - 趋势和差异分析有助于解释成本为何增加。\n  - 内部团队基准测试推动最佳实践并庆祝成果。\n  - 行业同行水平基准测试评估贵公司绩效。\n- 集中化团队推动\
  \ FinOps。\n  - 中央团队在共享问责制模式下鼓励、推广并使最佳实践成为可能，类似于安全团队：设有中央团队，但每个人仍对其负责的部分负责。\n  -\
  \ 需要高层管理者对 FinOps 及其实践和流程的支持。\n  - 费率、承诺和折扣优化集中化，以利用规模经济。\n  - 消除工程师和运营团队需要考虑费率谈判的需求，使他们能够专注于自身环境的使用优化。\n\
  - 利用云的变动成本模式。\n  - 云的变动成本模式应被视为提供更多价值的机会，而非风险。\n  - 采用即时预测、规划和容量采购。\n  - 敏捷迭代规划优于静态长期计划。\n\
  \  - 采用主动系统设计，通过持续的云优化调整取代不频繁的被动清理。\n\n## 何时开始 FinOps？\n\n自本书第一版以来，确定何时开始 FinOps\
  \ 已发生了相当大的变化。几年前的实践通常是在公司出现 *spend panic* 时刻才开始，即无意中花费远超预算。该实践的采用现在已大幅提前到云成熟度生命周期的早期阶段。如今在云采用的最早期阶段就开始该实践的公司已很常见。这部分源于对云计费挑战的更好理解，也源于三大云服务提供商的大力推动，鼓励客户尽早解决任何成本问题。三家公司还积极完善了提供的成本工具和数据，以便工程师和架构师在设计云解决方案时尽早考虑成本。\n\
  \n不幸的是，许多人仍认为 FinOps 只是关于省钱或减少消耗；因此，这些人倾向于认为实施 FinOps 的合适时机应以其云支出金额来衡量。公平地说，这在某种程度上是有道理的。例如，大量使用云的公司可以立即发现大量潜在节省。然而，对云支出的问责制和完全分摊成本的能力是高效\
  \ FinOps 实践的关键组成部分，如果从追溯性省钱的角度思考，这些往往得不到实施。\n\n此外，FinOps 对工程团队和财务团队所需的文化和技能集变化可能需要数年时间才能实施。组织规模越大、环境越复杂，越早开始实践所获得的复合收益就越大。\n\
  \n成功的 FinOps 实践不需要大规模的云部署或数百万美元的云账单。尽早开始 FinOps 将使组织在运营刚刚开始扩展时也能更轻松地做出有关云支出的明智决策。因此，了解\
  \ FinOps 成熟度至关重要；创建 FinOps 实践的正确方法是组织从小开始，随着业务价值要求活动成熟而在规模、范围和复杂性上增长。\n\n正如你在第 6\
  \ 章将学到的那样，无论过去的经验如何，都不可能从零开始建立一个完整的 FinOps 实践。需要时间来改变工程师的工作方式、教育财务人员了解云的工作原理，并让高管了解使用云的正确理由。这是工作方式的文化变革，数据驱动的问责和决策能力必须随着时间的推移而培养。\n\
  \n没有一个团队单独做 FinOps；中央 FinOps 团队的工作是使组织内众多必须协同工作以管理云业务价值的团队得以实现。此外，大型组织中的各个团队在 FinOps\
  \ 之旅中可能长期处于非常不同的阶段，因为每个团队都会达到个体采用变得合理的临界点。\n\n尽管本书可以指导组织实现成功实践并帮助团队避免常见陷阱，但没有任何组织可以直接从零\
  \ FinOps 过渡到高效 FinOps。每个组织和团队都必须逐步实施 FinOps 流程，在过程中花时间相互学习。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_43_0.png)\n\
  \n如同之前的 DevOps 一样，FinOps 是一次文化转变，越早开始，组织受益越早。\n\n我们的经验表明，你应该从第一天起就做 FinOps，但在规模扩大时参与更多流程。多年来，我们看到公司在两种典型时间开始采用\
  \ FinOps：\n\n- 以前，最常见的方法是在事情失控时实施。在此场景中，支出达到某一点，执行者强制停止云增长并要求实施新的管理模式。尽管这是一个常见的驱动因素，但这并不是采用\
  \ FinOps 的理想方式。在这次执行层面的紧急处理期间，创新和迁移会放缓甚至暂时停止。\n- 更明智的做法是由见证过云之旅的执行者采用，并与 *FinOps.org*\
  \ 上的 FinOps 成熟度模型保持一致。FinOps 实践需要以与公司在 FinOps 成熟度周期中的位置以及公司整体云使用成熟度相匹配的速度发展。最初，可能会指派一个人来管理与云服务提供商的承诺。他们着手实施初始账户、标签和标签层级。从那里开始，随着实践规模扩大，每个流程部分都可以逐步扩展。我们现在看到大多数新从业者在加入\
  \ FinOps Foundation 时都采用这种采用故事。\n\n但无论公司如何决定实施 FinOps，第一步关键是及时向相关团队提供云支出的可见性，以便每个人开始了解正在发生的事情并确定如何在成本超支变得过大之前解决。在成熟的实践中，成本超支会在开始前就通过深思熟虑的架构设计得以预防。在实现这种可见性水平的同时，FinOps\
  \ 团队开始教育更大的业务利益相关者。随着跨职能团队共同工作，财务人员将学习更多云的语言，而工程师开始掌握相关的财务概念，业务人员可以对资源投资做出更好的决策。\n\
  \n尽早开始这种文化转变的价值不言而喻，FinOps 实践的益处几乎可以立即感受到和衡量。\n\n## 以终为始：数据驱动的决策制定\n\nFinOps 最重要的概念之一是使用单位经济指标使工程团队能够进行数据驱动的决策制定。其思想是衡量云支出与业务产出或价值指标，然后根据所提供的洞察采取行动。这就是实时反馈循环，即之前讨论的\
  \ Prius Effect 正在发挥作用。\n\n为基础设施的每个部分选择合适的业务指标是一个复杂的过程，这在第 26 章中有所介绍。目前要记住的主要一点是，提供单位经济指标以实现数据驱动的决策制定依赖于\
  \ FinOps 的几乎每个方面，包括标签、成本分摊、成本优化、与其他财务框架的连接以及 FinOps 运营。\n\n业务指标很重要，因为它使你能够将对话从仅仅关于支出金额转变为关于效率和云支出的价值。能够说“为带来\
  \ $Y 收入的客户提供服务花费 $X”提供了上下文，帮助你判断 $X 和 $Y 是否是对组织的合理投资。然后，随着产品演进或因新功能而完全改变，公司能够通过这些业务指标衡量这些变化的影响。\n\
  \n结果是可以确定好云支出和坏云支出的区别并随时间跟踪这些决策。你应该在整本书中以及在组织内部实施 FinOps 时始终牢记业务价值指标。\n\n我们正在构建的理想状态是，你的组织能够持续就从云支出中获得的价值做出数据驱动的业务决策。\n\
  \n## 云上的故事——Jason Fuller\n\nJason Fuller 负责 HERE Technologies 的云业务，HERE Technologies\
  \ 是一家提供全球地图服务的跨国组织，他在一次 FinOps Foundation 会议上分享了一个很好的故事：\n\n> 我们有一个团队严重超预算，每月使用\
  \ 90 亿个 lambda 函数。我无法直接影响这一点。但我能做的就是与团队坐下来，了解你在 lambda 中编写的算法质量，并判断它是否可以更精简。\n>\
  \ \n> 我们需要你提供的毫秒级精度吗？需要。好的。现在业务部门明白它如此有价值。\n\n\n\n> 现在我们可以来看一下销售该服务的定价模型。我们可以根据我们认为该产品有多有价值，以及在市场上作为产品实际能获得多少来做出业务决策。\n\
  > \n> 因此，我们不再为基础设施争吵——我们讨论的是其业务价值。\n\n## Conclusion\n\n本章中我们定义了 FinOps，并描述了指导任何组织开始实践的核心原则和价值观，以确保他们在\
  \ FinOps 转型的漫长旅程中不断成熟并取得成功。\n\nTo summarize:\n\n总结如下：\n\n- FinOps is a cultural\
  \ change that drives collaboration between all teams inside an organization.\n-\
  \ FinOps 是一种文化变革，推动组织内部各团队之间的协作。\n- Everyone has a part to play and should become\
  \ cost-aware: from engineers to finance to procurement to executives.\n- 每个人都有自己的角色，都应具备成本意识：从工程师到财务、采购再到高管。\n\
  - Real-time feedback loops on spending encourage continuous improvements to spend\
  \ efficiency.\n- 支出上的实时反馈循环鼓励持续改进支出效率。\n- Use unit economics and business value\
  \ metrics to move beyond talking just about the cost of cloud to making data-driven\
  \ decisions about cloud investments.\n- 使用单位经济和业务价值指标，超越仅讨论云成本的范畴，做出关于云投资的数据驱动决策。\n\
  - Implement FinOps in your organization as early as possible and grow incrementally.\n\
  - 尽早在组织中实施 FinOps 并逐步发展。\n\nNow that you have a basic understanding of what FinOps\
  \ is, let’s look at what the cloud enables inside organizations, and how you can\
  \ avoid implementing processes that will hamper the good results of a successful\
  \ FinOps practice.\n\n现在你对 FinOps 有了基本了解，让我们来看云在组织内部能实现什么，以及如何避免实施会阻碍成功 FinOps 实践良好成果的流程。\n\
  \n## Why FinOps?\n\nWhen you look at why organizations use the cloud and the benefits\
  \ they get by doing so, the importance and necessity of FinOps become obvious. A\
  \ successful FinOps practice expands and accelerates the business benefits made\
  \ possible by cloud. Cloud shouldn’t be viewed simply as a rehosting alternative\
  \ but rather as a business accelerator. In the same way, FinOps isn’t just about\
  \ cost optimization, it’s about maximizing value.\n\n当你审视组织使用云的原因及其带来的益处时，FinOps\
  \ 的重要性和必要性变得显而易见。成功的 FinOps 实践会扩展并加速云所带来的业务优势。云不应仅仅被视为再托管的替代方案，而应被视为业务加速器。同样，FinOps\
  \ 不仅仅是成本优化，而是关于最大化价值。\n\n## Use Cloud for the Right Reasons\n\nCost savings are\
  \ often touted as the primary benefit of the cloud. But the most successful cloud-first\
  \ companies have shown the world that scalability and innovation are the true advantages.\n\
  \n成本节约常被宣传为云的主要益处。但最成功的云优先公司向世界展示了可扩展性和创新才是真正的优势。\n\nConsider Spotify, which uses\
  \ the scale of the cloud to stream content directly to customers all over the world.\
  \ Or Flickr, which stores a massive amount of customer data safely in the cloud\
  \ for secure, fast access. Because of the cloud, these companies compete in a way\
  \ that they never could with their own data centers. Price is always a factor, but\
  \ it’s a distant third to scale and global availability.\n\n以 Spotify 为例，它利用云的规模直接向全球客户流媒体传输内容。或者\
  \ Flickr，它将大量客户数据安全地存储在云中以实现安全、快速访问。由于云的存在，这些公司能够以其自建数据中心永远无法实现的方式竞争。价格始终是一个因素，但它远次于规模和全球可用性。\n\
  \nUsing the cloud also gives enterprises the ability to move faster and grow their\
  \ revenue. Even businesses in “nontech” sectors, like financial services, airlines,\
  \ and retail companies, are turning to software and data to differentiate themselves\
  \ from competitors. In fact, the top industry represented in the 2022 State of FinOps\
  \ data was financial services and banks.\n\n使用云还使企业能够更快地发展并增长收入。即使是金融服务、航空公司和零售公司等“非技术”行业的企业，也正在转向软件和数据以区别于竞争对手。事实上，在\
  \ 2022 年 FinOps 状况数据中代表性最强的行业是金融服务和银行。\n\nSoftware helps connect businesses with\
  \ their customers, optimizes their physical assets, and monitors their factories.\
  \ It delivers the latest pop song, a retail package, and even people themselves\
  \ all over the globe.\n\n软件帮助企业与客户建立联系，优化其有形资产并监控其工厂。它在全球范围内提供最新的流行歌曲、零售包裹，甚至是人们本身。\n\
  \n> We're no longer an airline. We're a software company with wings.\n> —Veresh\
  \ Sita, CIO of Alaska Airlines¹\n> 我们不再是一家航空公司。我们是一家有翅膀的软件公司。\n> ——阿拉斯加航空公司首席信息官\
  \ Veresh Sita¹\n\nAs of early 2023, the majority of Fortune 500 companies are massive\
  \ consumers of public cloud and the big three cloud providers themselves all rank\
  \ in or near the top 15 most valuable companies in that list. Tech titans such as\
  \ Microsoft, Amazon, Alibaba, and Tencent sit alongside banking icons like JPMorgan\
  \ Chase, HSBC, and Bank of America, all using cloud as the primary way of connecting\
  \ to their customers. Even traditionally nontechnology companies on that list, ExxonMobil\
  \ and Johnson & Johnson, are accelerating their digital transformations to distinguish\
  \ themselves from their competitors.\n\n截至 2023 年初，财富 500 强公司的大多数都是公共云的巨量消费者，而三大云服务提供商本身也都位列该榜单最有价值公司前\
  \ 15 名之列。微软、亚马逊、阿里巴巴和腾讯等科技巨头与摩根大通、汇丰银行和美国银行等银行巨头并列，都将云作为连接客户的主要方式。即使是该榜单上传统上非技术公司埃克森美孚和强生也在加速其数字化转型以区别于竞争对手。\n\
  \nThe key components of success are now business agility and speed to innovation.\
  \ As companies move past thinking of cloud simply as a cost-avoidance strategy,\
  \ they’re increasingly looking toward cloud as their primary driver of innovation.\
  \ XaaS (anything as a service) allows companies to experiment with more technologies\
  \ more quickly, while IaaS (infrastructure as a service) provides computing resources\
  \ at speed and scale never before possible.\n\n成功的关键要素现在是业务敏捷性和创新的速度。随着公司超越将云仅仅视为成本规避策略的思维，他们越来越多地将云视为其创新的主要驱动力。XaaS（即服务的一切）使公司能够更快地尝试更多技术，而\
  \ IaaS（基础设施即服务）则以前所未有的速度和规模提供计算资源。\n\nRacking servers in a data center and working\
  \ to engineer already “solved problems” from the ground up is no longer how companies\
  \ differentiate themselves. Cloud has made the latest technology—scalable infrastructure,\
  \ machine learning, or IoT (Internet of Things)—available on demand for businesses\
  \ of all sizes. Complicating efforts to run on-premises data centers, traditional\
  \ enterprises struggle to compete against the technology scale of Google, AWS, and\
  \ Microsoft in running infrastructure and attracting the talent to support it.\n\
  \n在数据中心机架服务器并从头开始工程化已经“解决的问题”不再是公司实现差异化的方式。云使最新的技术——可扩展基础设施、机器学习或物联网（Internet of\
  \ Things）——能够按需为各规模的企业提供。复杂化本地数据中心的运营，传统企业在基础设施运营和吸引支持人才方面难以与 Google、AWS 和 Microsoft\
  \ 的技术规模竞争。\n\nThe enterprises that win align around empowering their engineers to\
  \ write better and faster code to deliver value to their customers. And those engineers\
  \ can increasingly get whatever they want, whenever they need it. The cloud has\
  \ fundamentally transformed their ability to deliver more competitive products.\n\
  \n获胜的企业围绕赋能工程师编写更好、更快的代码以向客户交付价值展开。而这些工程师可以越来越多地在需要时获得他们想要的任何东西。云从根本上改变了他们提供更具竞争力的产品的能力。\n\
  \nThe cloud value proposition shown in Figure 2-1 from the FinOps Foundation’s FinOps\
  \ Certified Professional course outlines the flywheel effect driving the organization’s\
  \ business outcomes. This is enticing to executives who may feel that their IT function\
  \ has the potential to drive the organization’s digital future and that adoption\
  \ of the public cloud is a key tool in enabling this vision.\n\nFinOps 基金会 FinOps\
  \ 认证专业课程中图 2-1 所示的云价值主张概述了推动组织业务成果的飞轮效应。这对可能认为其 IT 部门有潜力推动组织数字未来的高管具有吸引力，并且认为采用公共云是实现这一愿景的关键工具。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_49_0.png)\n\nFigure 2-1. Cloud value\
  \ proposition from the FinOps Certified Professional course\n\n图 2-1. 来自 FinOps\
  \ 认证专业课程的云价值主张\n\nCloud service providers have truly become a force multiplier for\
  \ innovation inside any organization—with almost limitless possibilities.\n\n云服务提供商已真正成为任何组织内部创新的力量倍增器——几乎拥有无限的可能性。\n\
  \n## Cloud Spend Keeps Accelerating\n\nWhen we wrote the first edition of the book,\
  \ cloud spending had begun to hit a tipping point. In 2019, Gartner had forecast\
  \ 2022 cloud spend to be around $360 billion, but actual spending in 2022 ended\
  \ up closer to $500 billion. The latest Gartner forecast predicts that more than\
  \ half of enterprise IT spending will shift to the cloud by 2025. That's $1.8 trillion\
  \ that could potentially be moved to the cloud. In our experience, organizations\
  \ chronically underestimate their cloud spend and industry forecasts are regularly\
  \ revised upward. Cloud is becoming a material part of organizational IT budgets,\
  \ impacting both the top and bottom lines for enterprise P&Ls (profit and loss statements).\
  \ Large enterprises commonly spend in the nine-figures-per-year territory, and we\
  \ know of a number of individual enterprises whose annual public cloud bills extend\
  \ beyond a billion dollars.\n\n当我们撰写本书第一版时，云支出已开始达到临界点。2019 年，Gartner 预测 2022 年云支出约为\
  \ 3600 亿美元，但 2022 年实际支出接近 5000 亿美元。最新的 Gartner 预测显示，到 2025 年，超过一半的企业 IT 支出将转向云。那是可能转移到云的\
  \ 1.8 万亿美元。根据我们的经验，组织经常低估其云支出，而行业预测也经常被上调。云正成为组织 IT 预算的重要组成部分，影响企业损益表（profit and\
  \ loss statements）的上行和下行。大型企业通常每年花费达九位数，我们知道一些企业的年度公共云账单超过十亿美元。\n\nWith all that\
  \ growth, the time-honored silos between tech, finance, procurement, and business\
  \ teams have become a problem. To understand why, let's look at our favorite definition\
  \ of cloud, by Dave Nielsen back in 2011 in his “Cloud Computing Is OSSM” talk.\
  \ To be called “cloud,” Dave said, an infrastructure provider had to be “OSSM”:\n\
  \n随着所有这些增长，技术、财务、采购和业务团队之间长期存在的壁垒已成为问题。为了理解原因，让我们来看一下 Dave Nielsen 在 2011 年其“Cloud\
  \ Computing Is OSSM”演讲中对云的定义。要被称为“云”，Dave 说，基础设施提供商必须为“OSSM”：\n\n- On-demand\n-\
  \ 按需\n- Scalable\n- 可扩展\n- Self-service\n- 自助服务\n- Measurable\n- 可衡量\n\nIn the public\
  \ cloud, the “OSS” in OSSM is what drives incredible innovation while at the same\
  \ time creating the need for FinOps. Being self-service, scalable, and on-demand\
  \ allows an engineer to spend company money with the click of a button or a line\
  \ of code, without going through traditional finance or procurement approval processes.\
  \ As a result, everyone’s role has shifted.\n\n在公共云中，OSSM 中的“OSS”推动了令人难以置信的创新，同时也创造了对\
  \ FinOps 的需求。具备自助服务、可扩展和按需的能力使工程师能够通过点击按钮或一行代码花费公司资金，而无需经过传统的财务或采购审批流程。因此，每个人的角色都发生了转变。\n\
  \nGone are the days of prepurchasing large amounts of equipment in three- to five-year\
  \ cycles. In the cloud, the new normal is buying very small units of resources for\
  \ pennies an hour, making traditional procurement and finance processes ineffective.\
  \ Engineers aren’t getting approval from central procurement teams for each individual\
  \ cloud resource, and the idea of trying to implement a micro-approval process threatens\
  \ to slow innovation, one of the main benefits of cloud.\n\n预先购买大量设备并在三到五年周期内进行的时代已经过去。在云中，新的常态是以每小时几美分的价格购买非常小的资源单元，使传统的采购和财务流程变得无效。工程师不会为每个单独的云资源获得中央采购团队的批准，而试图实施微审批流程的想法威胁到减缓创新，而创新是云的主要优势之一。\n\
  \nLet’s look back at the traditional processes for the data center:\n\n让我们回顾一下数据中心的传统流程：\n\
  \n- Equipment was intentionally oversized, with built-in spare capacity to ensure\
  \ that unexpected growth during the depreciation term could be accommodated.\n-\
  \ 设备故意过大，内置备用容量以确保在折旧期内意外增长能够得到容纳。\n- If one service used more capacity than was\
  \ reasonable, it wasn’t an issue unless capacity was running low.\n- 如果一项服务使用的容量超过合理范围，只要容量没有耗尽，就不是问题。\n\
  - Reducing resource usage wasn’t likely to result in any savings, and services that\
  \ consumed spare capacity often wouldn’t cost any more.\n- 减少资源使用不太可能带来任何节省，而消耗备用容量的服务通常不会花费更多。\n\
  - Capacity management was the major cost control used during equipment lifecycle.\
  \ When capacity was running low, the services resource allocation would be reviewed\
  \ and adjusted.\n- 容量管理是在设备生命周期中使用的主要成本控制手段。当容量不足时，会审查并调整服务的资源分配。\n- The cost of\
  \ the equipment was paid up front, with possible well-understood monthly costs like\
  \ data center fees, software licensing, and so on.\n- 设备成本预先支付，同时可能还有数据中心费用、软件许可等众所周知的月度成本。\n\
  - Costs were reported and reviewed monthly or even quarterly. Infrequent reporting\
  \ was acceptable, because the day-to-day costs of the data center did not vary.\n\
  - 成本每月甚至每季度报告和审查。不频繁的报告是可以接受的，因为数据中心的日常成本不会变化。\n\nAnd now let’s look at the cloud\
  \ in comparison:\n\n现在让我们比较一下云：\n\n- There is no up-front equipment to purchase,\
  \ and spare capacity is always available. Prepurchasing capacity isn’t usually required,\
  \ and companies can save by not paying for capacity when it isn’t needed.\n- 没有需要预先购买的设备，并且备用容量始终可用。通常不需要预先购买容量，公司可以通过在不需要时不支付容量费用来节省开支。\n\
  - When services use more resources than they need, the result is higher running\
  \ costs. Reducing the size of the resources allocated to services results in realized\
  \ cost reductions.\n- 当服务使用超出其需要的资源时，结果是运营成本更高。减少分配给服务的资源规模会带来实际的成本降低。\n- Due to\
  \ the availability of capacity from cloud service providers, capacity management\
  \ is not a major concern. Removing this process means services are no longer artificially\
  \ capped in resource availability.\n- 由于云服务提供商的容量可用性，容量管理不再是主要问题。取消这一流程意味着服务不再在资源可用性方面受到人为限制。\n\
  \n\n\n- 资源可以在繁忙时期被消耗，然后在较慢时期被移除。这种可变消耗模式导致运营成本降低，但也使成本预测变得困难。\n- 计费不再简单易懂，因为资源以微小金额单独计费。\n\
  \n按季度甚至每月审查成本时，往往会因意外或被遗忘的资源使用累积到账单中的实质性水平而感到震惊。\n\n从固定支出到可变支出的巨大转变改变了你必须报告成本的方式。一系列限制被移除，从根本上改变了公司构建和交付软件的方式，无论好坏。管理这种支出的可变性，与\
  \ IT 以可靠的固定成本运营业务时相比，今天是一项完全不同的工作。\n\n## 未采用 FinOps 的影响\n\n在数据中心，工程团队能够快速访问的可用容量存在人为限制。成本的增加受到严格控制，由用于审查和批准任何额外支出的业务流程控制。这限制了成本变化的速度以及团队实验和创新的速度。云消除了存储和计算可用性的限制，并使工程团队能够快速访问所需的资源。你的工程团队不可能调用一个\
  \ API 在数据中心配置数百台新服务器，然后你需要为此付费。在云中，工程师们经常这样做。\n\n当你专注于速度和创新时，云账单很容易飙升。作为回应，公司经常过度限制云使用，导致创新放缓，并威胁到它们的竞争力。\n\
  \n麦肯锡于 2020 年 9 月发布的研究 titled “How CIOs and CTOs Can Accelerate Digital Transformations\
  \ Through Cloud Platforms” 得出结论，从云平台中获益的公司将采用视为业务技术转型，通过以下三件事实现：\n\n- 将投资集中在云能够实现收入增长和利润率改善的业务领域\n\
  - 选择技术和采购模式，使其与业务战略和风险约束保持一致\n- 开发并实施以云为导向的运营模式\n\n然而，他们还发现，所需的云经济、技能、流程和组织变革过于复杂，涉及业务的太多不同部分，以至于基础设施负责人无法独自管理，导致绝大多数大型机构出现以下一种失败模式：\n\
  \n### 试点停滞\n\n初始云工作负载或迁移的价值证明不足，阻止了扩展云使用的成功商业案例。\n\n### 云僵局\n\n由于 IT 无法构建使用公共云平台服务所需的自动化或参考架构，以安全、弹性且合规的方式使用，导致云计划在队列中受阻。\n\
  \n### “迁移上云”缺乏价值\n\n在未利用云优化杠杆或原生技术的迁移之后，对云的支持会崩溃，导致成本回报不足。\n\n### 云混乱\n\n领导层缺乏指导，导致工程师自行配置云服务，从而导致成本、安全和合规问题。\n\
  \n麦肯锡得出结论，因此，尽管支出快速增长，但只有 10%–15% 的企业工作负载已成功从数据中心过渡到云。\n\n投资 FinOps 使 FinOps 能力得以发展，并带来更好的云服务财务管理。这确保云计划提供可衡量的业务价值，而每一项以价值驱动的计划都会为云价值飞轮提供另一推动。\n\
  \n通过添加 FinOps 扩展图 2-1 中的云价值主张，如图 2-2 所示。为了维持对 FinOps 的投资，必须展示云价值的可衡量改进。在组织对 FinOps\
  \ 和云的业务价值建立信心之前，需要快速见效。每当 FinOps 计划带来业务价值的改善时，只要将其传达给投资于云和 FinOps 的利益相关者，就会进一步推动云价值飞轮和\
  \ FinOps 价值飞轮。如果这些业务价值的改善未得到传达，它们就不存在，公司范围内的云采用可能会停滞。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_53_0.png)\n\
  \n图 2-2。组织应在其 FinOps 投资得到云业务价值改善证明的情况下持续投资（摘自 FinOps 认证专业课程）\n\n## 有意识的忽视：为什么现在就开始？\n\
  \n在讨论 FinOps 中的有意识忽视之前，让我们先谈谈简单忽视 FinOps。忽视发生在你不进行任何支出效率测量时。你（或你的领导层）已决定目前无需关注云成本。担忧是\
  \ FinOps 实践会减慢速度。你只需要完成迁移或发布一组功能，无论成本如何。\n\n这种情况通常是这样进行的：企业决定有大笔资金用于迁移，比如 $50 million。类似这样的说法会被抛出来：“Just\
  \ get the engineers to get it done and we’ll worry about cost later.” 业务领导者认为他们永远不会达到如此巨大的云支出数字，尤其是在开始时，当月账单从\
  \ $5,000 到 $50,000 到 $250,000 到 $1 million 时。与大型企业的其他 IT 成本相比，它们仍然是小数目。\n\n因此，工程师们继续努力进行迁移，期间积累了大量低效。在某个时候，成本将开始超过收益，并与企业的期望脱节。这是我们出版本书第一版时的常态，\
  \ invariably 公司只有在支出恐慌时刻被迫后才会开始 FinOps。\n\n值得庆幸的是，在过去几年中我们看到了转变，越来越多的知情从业者在向云过渡的同时建立了\
  \ FinOps 实践。在这些情况下，我们越来越多地看到有意识的忽视方法。重点是从一开始就了解成本，确保全面的成本分配策略到位，报告主要成本驱动因素，监控异常情况，并探索提高成本效率的机会。但在此期间不一定会采取降低成本的行动；相反，会进行主动监控和预测，以确保支出仍与业务期望一致。\n\
  \n相反，采用简单的 *ignoring* 方法时，除了付账单时，没有人密切关注支出。在 *informed ignoring* 方法中，企业有意识地观察成本的增加，预测其增长，并分析节省机会，以确定何时达到业务舒适度阈值，从而被迫采取行动采用\
  \ FinOps 实践的额外领域，例如使用或费率优化，如第三部分所述。\n\n至关重要的是，正在进行工作以让每个人做好积极 FinOps 的准备：报告和可见性正在建立，跨团队沟通策略正在实施，而工程师仍专注于不计成本的速度，同时复杂的流程如云支出预测也在不断完善。在某个时候，预测表明到某一天支出将超过舒适点，但在\
  \ *informed ignoring* 方法中，该日期在数月之后，留出时间温和地改变组织的进程，而非要求对云支出进行激进的限制，这最终可能阻碍云采用并破坏更大的业务目标。\n\
  \n这是 FinOps 的温和之手：让工程师保持意识，提升财务部门以应对新的复杂性，并在仍有时间时允许高管做出明智选择。有了这种可见性，工程师在部署基础设施时倾向于开始考虑成本。他们意识到如果浪费过高，企业最终会要求他们解决。支出效率的反馈循环开始萌芽。\n\
  \n在图 2-3 中，Forrest Brazeal 巧妙地说明了迁移上云的价值递减和危险增长。组织如果利用迁移上云的快速收益，但随后没有跟进向云原生迈进的步骤，就会发现迁移上云创造的积极价值被其负面副作用所淹没，云价值仅仅因时间的推移而被侵蚀。基于云支出带来的价值进行衡量和决策，有助于组织在投资降低云迁移风险的同时保持从云中获得的价值。\n\
  \n\n\n## LIFT+SHIFT 投篮计时钟\n@forrestbrazeal\n\n![](img/4d4736bc293fd892d1da81802d0f9520_55_0.png)\n\
  \n图 2-3. 由 Forrest Brazeal 绘制的 lift-and-shift 投篮计时钟插图，由 A Cloud Guru 于 2020 年 2\
  \ 月发布\n\n业务领导者做出的忽视机会的决定并非一次性做出，而是在您云端之旅持续进行的过程中反复出现。随着对支出水平或节约机会规模的舒适阈值变得显著，您的业务领导者可能会改变忽视的决定，开始将优先级分配给\
  \ FinOps 活动。如果您不让业务领导者了解支出规模和节约机会，他们将不受控制地增长，与预期脱节，最终成为意外之惊。\n\n有意识忽视的核心概念是，组织选择不花费时间减少云支出是可以的。但企业内部，尤其是财务和业务领导者之间，需要有意识才能决定忽视它们。\n\
  \n最后，有些决定永远不应被忽视。在您拥有数百万美元的云支出之后，再回头逆向工程一套全面的标签/标记/账户方法学是非常困难的——本书第二部分稍后会详细介绍。正如您在图\
  \ 2-4 中看到的，2022 年 State of FinOps 数据显示，成本分配被认为是最重要的 FinOps 能力。如果您绕过基础的分配能力，最终将无法构建能够让您首先进行有意识忽视的报告，留下简单忽视作为唯一选择。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_56_0.png)\n\n图 2-4. 按堆栈排名的 FinOps 框架顶级能力列表显示，成本分配、数据分析和回溯是\
  \ FinOps 实践中最重要的部分（来源：2022 State of FinOps 报告）\n\n即使您没有时间和资源实施主动的 FinOps 实践，也请现在就开始进行分配、跟踪和预测云支出的实践，以便在需要时做好优化准备。\n\
  \n## 结论\n\n云的主要优势是交付和创新的速度，而非成本节约。\n\n总结如下：\n\n- 云支出现在或很快将对组织资产负债表产生重大影响。\n- 早期缺乏对\
  \ FinOps 的投资可能导致云采用遇到阻力或停滞。\n- 采购团队不再控制支出。在云中，这一权力已下放到工程师手中。\n- FinOps 允许您以云的每秒速度运营，而非依赖传统的月度或季度支出审查，从而避免意外成本。\n\
  - 在准备好执行所有 FinOps 领域以进行主动 FinOps 实践之前，先采用 *有意识忽视* 方法。\n\nFinOps 对大多数公司而言是全新的，虽然不必一次性完成，但最终必须在整个组织中实施和采用才能成功。下一章将探讨\
  \ FinOps 的文化以及每个人必须扮演的角色，以在组织内部实现成功的 FinOps 实践。\n\n## 文化转变与 FinOps 团队\n\nFinOps\
  \ 不仅仅是交给团队的技术解决方案或清单。它是最大化云价值的一种生动方式。技术当然有助于解决诸如监控优化建议和检测异常支出等问题，但它无法就这些行动的业务价值进行对话。\n\
  \n在本章中，我们将探讨谁推动 FinOps 以及他们在组织中通常处于何处。我们将审视 FinOps 的角色和职能，因为最终是人让 FinOps 发挥作用。\n\
  \n组织中围绕支出的公司文化必须与工具和流程一起演进。实施成功的 FinOps 实践存在许多障碍和挑战。它们要么由人员和团队造成，要么由他们解决。最终，这取决于您。您的团队是否会开发和采用成功\
  \ FinOps 所需的正确原则和实践？\n\n## Deming 论业务转型\n\n在为本书第二版进行研究时，我们发现了著名工程和商业教授 W. Edwards\
  \ Deming 于 1982 年发表的管理业务转型的关键原则。FinOps 的许多关键点与 Deming 的原则相呼应，因此值得看看 Deming 的几个关键原则。\n\
  \nDeming 专注于目标的恒定性。他的观点是，推动公司实现长期成功的最佳方式是培养长期思维并不断实施持续改进。\n\n他还强调，所有参与转型的团队都需要作为一个整体单元工作，打破部门之间的壁垒，使整个组织能够及早发现问题并协作解决问题。同样，成功的云和\
  \ FinOps 转型要求每个参与云管理的团队都理解转型是每个人的工作。\n\n领导力和教育在 Deming 的原则中占有重要地位。他不建议领导主要通过目标和数字来管理，而是以一种让员工能够以对工作的自豪感做出贡献的方式管理系统。在第\
  \ 24 章，我们将讨论相关的概念，即领导层对 FinOps 的支持不是可选的，而设定任意目标的强制令最终会失败。相反，领导层需要支持并推动文化转变，使团队能够在权衡云的成本与价值之间做出决策。\n\
  \nDeming 还补充说，需要大规模培训来培养打破传统的勇气，并且每项活动和每份工作都是流程的一部分。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_60_0.png)\n\
  \n组织的 FinOps 转型与四十年后 Deming 的原则密切相似。我们鼓励您阅读 Out of the Crisis（MIT Press）中发表的所有 14\
  \ 条 Deming 原则。您可能会发现，在向组织推介 FinOps 时参考 Deming 的工作会有所帮助。\n\n## 谁来做 FinOps？\n\n从财务到运营到开发人员到架构师再到高管，组织中的每个人都有一部分要发挥。看看本书中引用的各种工作头衔，您就会明白我们的意思。\n\
  \n> 这是每个人帮助公司更快发展的职责。在敏捷的世界里，我们都是服务型领导者，帮助工程师交付他们正在做的事情。其他每个人都应该在那里以解除交付障碍。\n> —David\
  \ Andrews, Senior Technology Manager, Just Eat\n\n无论是只有少数员工部署云资源的初创企业，还是拥有数千名员工的大型企业，FinOps\
  \ 实践都可以并且应该在整个组织中实施，尽管在不同地点所需的工具和流程水平以及节奏不同，具体取决于每个地方提供的价值。\n\n那么 FinOps 团队需要具备哪些技能和角色？在本书中，随着我们逐步进行优化阶段，我们将介绍\
  \ FinOps 团队生成需要由更广泛组织考虑的建议的方式，例如更改资源配置或向云服务提供商做出承诺。虽然这些无疑会为组织节省资金，但产品、财务和工程之间需要信任才能执行。\n\
  \n为了尽快建立这种信任，FinOps 团队必须具备云专业知识。如果没有，推荐可能会完全错误，或者工程团队可能会浪费宝贵的开发时间，试图解释为何不进行必要的性能修改。具备云领域专业知识的\
  \ FinOps 团队建立了信任和信誉。\n\nFinOps 必须得到高层支持，能够分享最佳实践，并使用将学科联系起来的共同语言，正如我们将在下一章讨论的那样。这不仅有助于传播\
  \ FinOps 对公司重要的信息，而且还确保员工有时间分配来执行所需任务。做得好的话，FinOps 不会增加技术团队和业务团队之间的冲突。相反，这种冲突被消除。这是团队使用有助于围绕业务目标创造一致性的共同语言时实现的，从而确保每个人都理解并支持这些目标。\n\
  \n中央 FinOps 使能团队是推动整个组织 FinOps 思维的驱动力，倡导将成本考虑纳入开发计划的最佳实践。FinOps 实践者执行一些集中任务，如管理并向云提供商报告基于承诺的折扣，或集中报告以确保每个人查看的数字相同。这防止了其他团队重复造轮子，同时利用与承诺相关的规模经济。\n\
  \n然而，许多 FinOps 最佳实践的实际实施必须分散到公司各产品和应用团队内部的工程师。rightsizing 和空闲使用减少就是一个很好的例子。虽然中央\
  \ FinOps 团队可能在数据和目标设定方面提供帮助，但各业务线的工程师必须根据业务价值和工作量做出数据驱动的决策，决定何时对基础设施进行更改。\n\n> 当你能在\
  \ 24 小时内而不是一个季度后向财务发出支出激增的警报时，这会赢得很多信誉。如果花上数月时间才弄清楚导致超支的原因，财务将不会相信技术知道自己在做什么。\n\
  > —Joe Daly, formerly Director of Cloud Optimization, Nationwide\n\n中央 FinOps 团队的另一个重要角色是促进团队之间的对话并培养信任。财务团队必须与工程师合作，使用共享数据和报告，使每个人都能快速找到并解决需要处理的情况。\n\
  \n借助 FinOps 团队的报告和计费知识，工程师将能够展示计划或成本何时、为何超出预算。这种共享知识建立了信心、信任和效率。\n\n\n\n与其将重点放在集中化支出审批上，FinOps\
  \ 更注重向相关部门提供支出可见性以建立问责制。FinOps 团队的云感知专业知识使其他团队能够理解如何将每个具体的计费项目分配到分摊计费和回溯计费中。这些术语用于描述成本的展示和处理方式。我们将在第\
  \ 11 章更深入地探讨这一主题。\n\n## 为什么需要一个中央团队？\n\n我们迄今为止多次提到 FinOps 团队以及 FinOps 团队执行的集中化职能。这里值得指出的是，本书中我们将继续提及一个集中的\
  \ FinOps 团队，但实际上有多种可行的 FinOps 团队模式。FinOps 团队的结构很大程度上取决于组织的类型以及它如何支持 FinOps 团队所代表的跨学科协调机制。\n\
  \n虽然我们仍会提及 FinOps 团队，但请将其理解为推动 FinOps 最佳实践的协调机构，但要明白无论采用何种组织设计，FinOps 团队在组织范围内都应承担一些职责，以使转型尽可能成功。\n\
  \n这个公正的中央团队与业务领导者、工程团队和财务团队保持联系，分享客观的最佳实践和建议。该团队成员从不会被视为推动特定议程以谋取自身利益，这增强了他们建议的可信度。至关重要的是，他们还必须努力为每个云工作负载纳入业务目标。\n\
  \n当这个中央团队制定成本分摊规则并传达团队表现的清晰沟通时，每个人都会确信他们是按照相同标准进行管理和衡量的。如果由持有预算的团队主导流程——这种情况发生在某个团队负责绝大部分云支出时——就会引发对信息完整性的质疑。如果成本分摊由各团队独立完成，支出数据不可避免会出现重叠或缺口。无论哪种情况，怀疑都会滋生。而当团队对数据失去信任时，就无法对其负责。\n\
  \n当各团队尝试建立自己的云报告流程时，会出现关于成本归属的争议。组织范围内的 FinOps 团队解决了这一问题，促进了对支出数据正确性的共识，然后客观地将每项成本归属到适当的工程团队。\n\
  \n最后，中央团队定义组织使用的业务指标。事实上，这也是 FinOps 团队的关键早期任务。对于云支出而言，一美元并不仅仅是一美元。可以选择查看是否摊销的成本，以及是否应用或排除自定义费率。来自其他服务的应用程序的共享成本可能被包含或不可见。当跨团队使用的业务指标被明确定义时，每个人都使用相同的语言。在下一章中，我们将更深入地探讨\
  \ FinOps 的语言。\n\n## FinOps 团队不做 FinOps\n\n很容易认为 FinOps 的日常工作可以分配给一个中央团队并与业务其他部分隔离。但\
  \ FinOps 不仅发生在 FinOps 团队内部；他们主要是一个赋能团队，利用其在云计费数据和定价模型、集中化数据和报告、承诺管理以及相关职能方面的专业知识支持组织其他部分，同时帮助分布式的工程团队获取做出基础设施日常决策所需的数据。不应期望其成为管理基础设施或执行大部分优化活动的中央团队。这种责任被推给了最了解自身基础设施和业务目标的团队。FinOps\
  \ 团队旨在在整个组织中推广可重复的模式，以加速边缘的 FinOps 实践。\n\n> > 我们组织中的其他团队要求我向他们介绍 FinOps 并解释我们将如何保护他们免于超支。对此我会说，我不会，我会帮助你们保护自己。\n\
  > >\n> > —Alison McIntyre，Lloyds Banking Group 的云 FinOps，The FinOpsPod，2022\n\n\
  在组织云成熟度的早期，FinOps 团队会承担更多工作，因为每个人都在熟悉新的职责。但随着时间的推移，团队将变得更加自给自足，FinOps 团队将能够处理更少的例行任务，并专注于与云效率相关的更复杂项目。\n\
  \n> > 为什么需要云计费方面的专业知识？例如，AWS 的 S3 存储服务至少有 6 种不同的“操作”会产生费用——存储定价、请求和数据检索定价、数据传输和传输加速定价、数据管理和分析定价、复制定价，以及使用\
  \ S3 Object Lambda 处理数据的价格。此外，至少有 8 种不同的存储类型，从标准到低频访问再到 Glacier 到深度归档。这对于单一服务来说就是\
  \ 48 种定价选项的组合。亚马逊目前有数百种不同的服务，每种都有不同的定价选项。FinOps 团队的专业知识可以帮助应对这种复杂性。\n> >\n> > —Ashley\
  \ Hromatko，前 Pearson 云 FinOps 总监\n\n随着 FinOps 团队的成熟，他们也可能会承担更多自动化例行任务的责任，而这些任务并非工程团队效率低下所致。迁移到云时不可避免会产生一定技术债务，例如将存储放在比所需更昂贵的层级，或购买超出需求的更高服务层级，FinOps\
  \ 团队在建立足够信誉并与工程团队建立信任后，可能被授权自行修复这些问题。\n\n这种赋能模式并非新概念；请考虑云安全。它是一种共享责任模式。正如组织中的安全团队并非唯一负责安全一样，FinOps\
  \ 团队也不是为了优化所有事物而存在。它存在的目的是为最接近云资源的工程师提供资源，以便他们在正确的时间做出正确的优化决策，或使用第 2 章中介绍的 *知情忽略*\
  \ 来选择不进行优化。\n\n你中央 FinOps 团队所做的工作使组织能够更有效地使用云，并加速这一进程。它并不会取代其他工程团队和业务领导者持续优化自身基础设施的日常职责。\n\
  \n## FinOps 中各团队的角色\n\n图 3-1 展示了组织如何在 FinOps 模式下运作。跨职能团队，例如云卓越中心（CCoE），负责管理云战略、治理和最佳实践，然后与业务其他部分合作，改变云的使用方式。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_64_0.png)\n\n图 3-1. FinOps 周围的团队互动\n\n\
  组织中各个层级和各个领域的个人在 FinOps 实践中扮演不同的角色，包括以下内容。\n\n### 高管和领导层\n\n高管（例如基础设施副总裁/负责人、云卓越中心负责人、首席技术官或首席信息官）专注于推动问责制和建立透明度，确保团队高效运作且不超出预算。他们也是推动文化转变的推动者，帮助工程师开始将成本视为效率指标，详见第\
  \ 24 章。\n\n### 工程和开发人员\n\n工程师和运维团队成员——例如首席软件工程师、首席系统工程师、云架构师、服务交付经理、工程经理或平台工程总监——专注于为组织构建和支持服务。成本作为指标被引入，与其他性能指标的跟踪和监控方式相同。团队通过诸如\
  \ rightsizing（将云资源调整大小以更好地匹配工作负载需求的过程）、分配容器成本、查找未使用的存储和计算资源，以及识别支出异常是否预期等活动来考虑资源的高效设计和使用。\n\
  \n### 财务\n\n财务团队成员使用 FinOps 团队提供的报告进行会计和预测。他们与 FinOps 实践者密切合作，了解历史计费数据，以便构建更准确的成本模型。他们利用自己的预测和来自\
  \ FinOps 团队的专业知识，与云服务提供商进行费率谈判。\n\n### 采购和采购\n\n采购和采购人员管理企业与供应商（包括云服务提供商）的关系。这种关系可能与公司过去管理的其他\
  \ IT 服务关系非常不同，并且可能更复杂、变化更多。他们关注为公司对每个供应商做出的承诺获得最佳价格，并确保组织随着时间的推移获得其赞助和承诺带来的所有利益。\n\
  \n### 产品或业务团队\n\n产品团队成员，包括产品经理、产品负责人、投资组合负责人、服务负责人、应用负责人等，负责一项服务、产品或产品线。他们将与 FinOps\
  \ 团队密切合作，了解其产品或应用程序功能的运行总成本——这种了解方式在数据中心支持时往往无法实现。产品负责人关注为客户需求提供新功能，并能够利用 FinOps\
  \ 提供的数据了解产品盈利能力、指导成本效率工作，以及根据新功能发布更准确地预测成本。\n\n\n\n## FinOps 从业者\n\n> *财务人员把我看作技术人员。技术人员把我看作财务人员。*\n\
  > \n> —Ally Anderson, 商务运营经理, Neustar\n\nFinOps 从业者是 FinOps 实践的核心动力。他们理解不同的视角，具备跨职能的认知和专业知识。他们是推动最佳实践进入组织的中央团队（或个人），在各个所需层级提供云支出报告，并作为业务各部门之间的接口。他们可以是精通云的财务领导者，也可以是注重成本的工程师。\n\
  \n## 一种全新的协作方式\n\n每个之前的职能都需要前所未有的整合。有人说工程师需要更像财务人员那样思考，而财务人员需要开始像工程师那样思考。这是一个很好的开始，但整个组织需要从集中式的成本控制模式转向共同责任制。只有这样，中央\
  \ FinOps 团队才能赋能组织更快地移动和创新。\n\n这种文化转变也使领导层能够以目前尚未实现的方式参与决策。根据领导层的意见，团队可以就其是否仅专注于创新、交付速度或服务成本做出明智选择。一些团队会全力投入某一领域，采用不计成本增长的心态。最终云账单变得过大，他们就必须开始同时考虑增长和成本。例如，“快速推进，但保持我们每个客户交易的成本低于\
  \ 0.45 美元。”\n\n## 你的 FinOps 团队向谁汇报？\n\n通常情况下，FinOps 团队向技术领导者汇报，但它们也可以向财务或其他职能汇报。FinOps\
  \ 状态调查询问 FinOps 团队向谁汇报，正如你所见，图 3-2 的结果显示 FinOps 团队在不同组织中向多个部门汇报。最常见的是，FinOps 团队与技术团队保持一致或并列。\n\
  \n### 贵组织的 FinOps/云财务管理向谁汇报？\n\n（多选问题；答案总计超过 100%）\n\n![](img/4d4736bc293fd892d1da81802d0f9520_67_0.png)\n\
  \n图 3-2. 来自 2022 年 FinOps 状态报告的最常见的 FinOps 向高管汇报对象\n\n这意味着它通常是 CTO 或技术负责人职能的一部分。一些组织也将其置于\
  \ CIO 职能之下，尽管这种情况随着时间的推移正在下降。让技术领导层监督技术支出可能类似于让狐狸看守鸡舍，因为花钱的群体也是监督它的群体。然而，将 FinOps\
  \ 放在技术组织中具有诸多优势。最初，工程和技术运营团队会更重视其建议并赋予其可信度，而他们可能会对来自财务团队的建议持怀疑态度。最重要的是，技术团队最了解云的复杂性，能够最快建立管理高度可变云支出的实践。由财务驱动的\
  \ FinOps 通常最初会尝试应用现有的财务报告和预测系统，而这些系统并非为云账单设计，云账单每月可能有数百万笔单独费用，且每日按可变用量和费率变化。我们越来越多地看到一种混合职能的出现，即在\
  \ CTO 领导下设有技术 COO 或技术 CFO。Equifax 的一个案例在第 6 章中展示了这种结构。\n\n无论它们处于何处，中央 FinOps 团队都必须与财务和工程组织密切合作。小公司可能没有为\
  \ FinOps 团队在组织中设立专门的位置。在这种情况下，一个常见的模式是指定一个人或分配个人部分时间来在业务中实践和推广 FinOps。大型、复杂的支出方可能在中央\
  \ FinOps 团队中有 10 名或更多人员。\n\n## 理解动机\n\n> *信任通常在对他人问题领域产生共情时才会建立。*\n> —Sascha Curth,\
  \ OLX 云经济与治理负责人\n\n每当来自组织不同部门的一群聪明人聚集在一起时，必然会产生一些摩擦，主要是因为他们有不同的目标和指标。财务关注成本效率并确保预算目标不被超出，而运营团队则关注提供高质量服务并尽量减少服务问题和中断。\n\
  \n让我们更深入地了解参与 FinOps 的各种角色的动机。\n\n### 工程师\n\n- 希望从事有意义且富有挑战性的难题\n- 希望快速可靠地交付软件\n\
  - 厌恶低效，追求资源的高效利用\n- 保持对最新技术的了解\n- 以性能、正常运行时间和弹性作为衡量标准\n- 希望交付功能、修复错误并提升性能\n\n通常，工程师的激励是让最新的软件功能或错误修复交付给客户，而不是财务方面的工作。\n\
  \nFinOps 团队倾向于要求工程师帮助他们了解成本、审查其环境以寻找潜在优化机会，并确定其成本效率如何。\n\nHERE Technologies 的云负责人\
  \ Jason Fuller 就是这样与他的工程师合作的：\n\n> 让我的团队和 FinOps 组织来为你做这些。让我为你设置存储生命周期策略。你作为工程师认识到自己应该有这样一个策略，但它在\
  \ 100 项待办清单中排在第 100 位。所以我会来处理这件事。对他们最有效的策略是“让我来帮你。我会处理好这一切。让我来标准化和编写你的存储生命周期策略，这样你就不用操心了。”\n\
  \n在某些情况下，FinOps 从业者会与工程师合作花费时间执行这些重复性任务，突出数据以发现工程师能够优化的潜在领域，然后通过移除并标准化可以集中的流程来帮助他们。有时\
  \ FinOps 团队会推动工程尽早自行承担优化任务，而其他时候它有足够的信誉来为他们承担部分技术债务的自动化清理工作。\n\n### 财务人员\n\n- 希望准确预测和预估支出\n\
  - 希望能够回收费和/或分配 100% 的支出\n- 寻求将成本合理摊销给负责的团队\n- 希望拆分共享成本，如支持和共享服务\n- 希望控制和降低成本，同时保持质量/速度\n\
  - 希望帮助高管制定云战略\n- 希望提前了解预算风险\n\n当组织首次采用云时，财务人员可能会感到 sticker shock。支出审批流程的变化、从具有可预测折旧计划的资本支出转向运营支出、高度可变且难以预测的支出，以及成本和用量信息的冲击都可能令人迷惑。他们有时不确定如何跟上变化的速度，也不知道能否信任来自云提供商账单数据的数字。\n\
  \n因此，提醒传统财务团队云符合他们已理解的模型是很重要的。它只是一种基于消费的服务，如公用事业。它只是恰好拥有 100,000 个 SKU，按微秒移动，其支出可能在一周末内失控。当然，采购流程和粒度是不同的，但它仍然是相同的财务模型。然而，对于刚接触云的财务人员来说，很容易感到畏惧。\n\
  \n### 高管和领导层\n\n- 希望推动团队共同承担责任\n- 渴望实现数字化业务转型\n- 希望缩短新服务上市时间\n- 寻求竞争优势\n- 希望建立成功的云战略\n\
  - 需要定义和管理 KPI（关键绩效指标）\n- 必须证明技术投资的价值\n\n第 2 章展示了组织如何使用软件和互联网连接技术来区别于竞争对手。云是加速这种数字化变革的主要工具之一。高管正在设定他们的云优先战略并带领团队进入云。随着云支出在组织内变得重要，这些高管必须推动工程团队跟踪和平衡成本的重要性。高管支持\
  \ FinOps 从业者正在组织内实施的文化变革。从上而下，领导层提供有关好、快、便宜之间优先级平衡的指导。为了让 FinOps 发挥良好作用，领导者和高管还必须在跨学科和垂直层级上就云的目标及其使用控制达成一致。\n\
  \n### 采购和采购人员\n\n- 传统上以谈判中获得的折扣作为衡量标准\n- 希望确保支出符合供应商协议\n- 希望与战略供应商合作伙伴建立关系\n- 希望谈判和续签供应商合同\n\
  \n采购不再是 IT 支出的守门人。随着工程师直接设置云资源，采购已成为分布式责任的世界。保持对云支出的可见性并生成准确的预测变得更加重要，以便这些数据可用于推动供应商关系和合同谈判。随着采购团队拥抱\
  \ FinOps，他们不会对云支出施加微观审批流程。相反，他们选择帮助推动问责，同时使团队能够获得创新所需的资源。\n\n\n\n## FinOps 在整个组织中\n\
  \n不再允许团队只考虑自身优先事项。如果技术运营团队不考虑其云支出带来的影响，财务部门将面临预测和预算组织云支出的不可能挑战。相反，如果财务部门完全控制云支出并要求对每个资源进行审批，组织将难以利用可变支出资源和按需基础设施带来的速度和敏捷性。请记住，云的优势在于创新的速度。\n\
  \n## 云端故事——Rob Martin\n\nRob Martin，FinOps Foundation 学习总监，分享了来自近期 FinOps 认证从业者培训课程的一个匿名故事，讲述\
  \ FinOps 角色是如何协同工作的：\n\n随着问责制的 FinOps 文化在整个组织中建立起来，所有学科开始更紧密地协同工作。当产品经理确定一个新功能时，他们可以迅速识别提供该功能带来的收入或客户影响，以及他们需要承担的利润率。负责产品所在损益表的领导可以批准投资，并有灵活性调整开发团队的预算，因此他们会明确成功参数，预计成本和销售情况。这为工程领导层提供了明确的方向来制定计划，将工作安排到冲刺中以创建最小可行产品（MVP），并估算在构建期间的成本曲线，财务部门对此具有可见性。随着该计划的确定化，每个人都可以回头审视，预算会进行调整，资源会按我们共同参与的适当标签提出申请。在过去，这个流程需要数月时间来简报、协调和获得批准；现在我们可以在几天或几周内完成。\n\
  \n## 招聘 FinOps 人才\n\n需要注意的是，仅通过聘请从业者或引入承包商无法推动向 FinOps 的文化转变。在 FinOps 中，组织中的每个人都有各自的角色。应将\
  \ FinOps 要求添加到所有招聘中，从高管到财务再到运营，例如将 FinOps——更具体地说，云所产生的价值管理——列为每个职位描述的一部分，或在新员工入职时提供\
  \ FinOps 培训。询问工程师成本指标如何在良好的服务设计中发挥作用，并询问财务部门云的可变支出如何改变正常的财务实践。如果没有聘请具备 FinOps 理解力的人才，或对加入团队的新成员进行持续培训，你所建立的文化将逐渐被缺乏正确思维方式的新员工侵蚀。\n\
  \n角色将演变以满足 FinOps 的需求。拥有商业头脑的多技能员工，财务人员在 FinOps Foundation《2022 年 FinOps 状况》调查中显示，激励工程师是最大的挑战\n\
  \n## 云端故事——Mike\n\n我曾与一家大型科技公司内部的 FinOps 团队交谈过。话题转向如何激励工程师采取行动时，其中一名团队成员与我分享了一个故事。他的父亲在硅谷的科技行业工作了几十年，他正向父亲讲述自己在工作中遇到的挑战，即让工程师更改其云配置。在这次对话中，他的父亲笑着说了一些类似的话：“You\
  \ don’t have a new cloud problem. You have an age-old problem of motivating other\
  \ humans to do something you want.”\n\n\n\n很容易陷入认为这个问题独属于云的陷阱。作为 FinOps 实践者，你会识别优化机会并向工程团队报告这些机会。这些建议要求你的工程师花费时间审阅它们，然后对他们的云资源进行必要的更改。这些单独的建议详细说明了各种云资源如何计费和配置，以及可用的替代选项。你可以看到这个问题在个体层面看起来有多么云特定，以及向工程师突出需要跟进的机会这一做法有多新。\n\
  \n重要的是从云特定的概念中抽身，开始关注核心问题，即：你如何激励他人做出改变并将新事物纳入他们的工作流程？当你将挑战概括为“你需要工程师抽出一些时间执行建议的操作”这样简单时，请考虑你试图实现的目标。\n\
  \n如图 3-4 所示，行动量表可视化了工程师实施你的建议的可能性之间的平衡。该量表有许多因素会使天平倾向于行动或反对行动。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_75_0.png)\n\
  \n图 3-4. 行动量表\n\n## 有利于行动的因素\n\n在使量表倾向于行动的一侧，你有：\n\n### 兴趣\n\n你的工程师对该建议有多大兴趣？不要以“你需要审阅此建议”的方式提出建议，改为说“你知道是什么导致了此建议吗？”对建议的兴趣通常会导致动力增强。\n\
  \n### 动力\n\n你的工程师在与成本相关的成果方面受到衡量或奖金激励去处理给出的建议的动力越大，他们花费时间审阅和实施这些建议的可能性就越高。\n\n###\
  \ 理解\n\n为了让工程师采取行动，他们需要理解建议、建议是如何制定的、应如何审阅它们，以及完成必要更改需要什么。\n\n## 阻碍行动的因素\n\n与有利于行动的因素相对，你有以下阻碍因素在阻碍工程团队采取行动：\n\
  \n### 工作量和时间\n\n我们怀疑你的工程师有很多空闲时间。工程师实施建议更改所需花费的时间会降低采取行动的可能性。\n\n### 流程\n\n随着需要遵循的流程数量增加，尤其是手动步骤和审批，工程团队的动力会降低。\n\
  \n### 风险\n\n建议并非零风险。更改云资源的配置可能导致意外结果。一旦工程团队遇到问题或听说他人的失败，对建议的信任就会受到影响。\n\n## 使天平倾向于你\n\
  \n你可以用两种方式来应对推动行动的挑战：提高促进因素或对抗阻碍因素。实际上，你需要两者兼顾。\n\n## 提高动力\n\n与你的工程师互动，询问他们需要什么才能参与进来。指导他们处理工作的方式。然而，尽量不要过于规定性，允许他们自由决定工作如何完成。当团队参与到流程中时，向所有工程团队展示他们努力的成果以激励他人，最后，表达赞赏并奖励他们的努力。我们看到团队使用内部博客或在全员大会/全体会议上发表演讲来庆祝成功，这是一种很好的传播方式。为完成培训提供贴纸和\
  \ T 恤可以成为激励团队了解你的计划的绝佳方式。\n\n## 教育团队\n\n思考你如何解释需要工程师做什么。确保你的工程师理解为什么需要他们执行任务以及你期望他们在什么时间范围内完成。如果工程师不清楚如何完成任务或其益处，他们会忽略请求。提供培训、关于建议是如何制定的以及如何调整云资源设置的文档链接，并让自己随时待命回答问题。\n\
  \n## 减少工作量\n\n你花费在验证高质量建议上的时间越多，工程师审阅它们所需的时间就越少。与你的工程师合作，确定可以在请求时提供哪些信息。将相关信息汇总供工程师一次性使用，可减少收集工作量。自动化可以减少实施任务所需的时间和精力。\n\
  \n## 避免信任受损\n\n失败后，你需要了解任务为何未成功。删除高风险建议，并与工程团队分享他们如何更好地评估建议以避免再次发生事故。\n\n专注于建立一种公司文化，使财务能够与工程团队建立合作伙伴关系，并让他们理解彼此的动机并形成对组织目标的共同理解。为了影响变革，授权团队参与需要遵循的流程的创建，并确定能激发人们帮助兴趣的项目。\n\
  \n## 结论\n\n在本章中，我们强调每个团队都必须采用 FinOps 思维。你组织内的所有团队都能够与中央 FinOps 团队一起合作，以了解彼此的目标，而该团队正在帮助建立报告和实践以协助每个人实现目标。\n\
  \n总结如下：\n\n- 所有团队在 FinOps 中都有发挥作用。\n- 团队有不同的动机驱动支出和节省。\n- 团队需要以相互理解彼此目标的同理心平衡地合作。\n\
  - FinOps 实践者帮助团队与组织目标保持一致。\n- 激励工程师采取行动并不是一个新的云问题，而是人类长期面临的挑战。\n- 行动量表有助于可视化促使工程师采取行动的因素以及阻碍其行动的因素。\n\
  - 为了使行动量表倾向于行动，你需要实施计划来帮助促进因素并减少阻碍因素。\n\n在下一章中，我们将探讨团队如何相互交流。你会发现良好的协作需要的不仅仅是将团队放在同一个房间。财务语言可能与工程语言大不相同，因此每个人都必须拥抱共同的语言。\n\
  \n## FinOps 的语言\n\n你组织内的每个团队可能使用特定学科的术语，从不同角度查看云计费数据，并对想要实现的目标有不同的动机。本章讨论了你如何通过教育员工了解每个团队使用的特定术语并定义共同词汇表来促进团队更有效地协作，从而鼓励一致性和信任。\n\
  \n## 云上的故事——Mike\n\n在 Atlassian 开始 FinOps 实践之前，团队自行跟踪成本并使用自己的方法来决定哪些账单部分是他们的责任。我的第一步行动是创建报告并发送给业务团队。但我遗漏了一个关键步骤。团队像以往一样，从自己的角度阅读报告。我的报告没有澄清云支出——反而让它变得混乱。我使用的术语对每个人来说都不合理，因此不同团队对报告有效性产生了不同的看法。\n\
  \n看到这一切，我意识到我们需要一种共同语言。我需要创造对 FinOps 术语更广泛的理解，以及一套所有团队都可以使用来跟踪支出和优化的通用报告。我之前的报告充满了云特定基础设施语言，给财务团队造成了困惑和挫败感，就像关注云财务的报告给工程团队造成的困惑一样。\n\
  \n初创公司通常从简单的每日支出可见性开始，向团队展示各自的支出。然而，共同词汇表对于刚开始 FinOps 的人很重要，甚至对最精通 FinOps 实践的人也很重要。随着你在云中的成熟度提高，成本报告中使用的术语数量会增加。随着你在\
  \ FinOps 实践中继续增加能力领域，\n\n增加对额外云服务的消耗，并在报告中变得更加精细化，你最终会得到更多学科特定的术语。这增加了使用模糊（或重复）术语的可能性，这会造成混淆并削弱对数据的信任。一致性在后期阶段变得更加重要，以便更好地理解所有报告之间的关联并推动对各自团队的问责。尽量避免使用来自财务或工程领域的晦涩学科特定术语，并力求就标准化的词汇表达成一致。\n\
  \n## 定义通用词汇表\n\n强调通用词汇表的必要性很容易：只需请财务团队和工程团队各自描述一项服务即可。财务团队通常会考虑服务的成本和费率，而工程师则更关注其*服务可用性*、*可靠性*和*可用容量*。两者都正确。脱节之处在于这些团队尝试相互沟通时出现，而云计算迫使他们比数据中心时代更频繁地这样做。在那个不算遥远的过去，运营团队仅在提出新设备采购时才会与成本打交道。之后，他们的日常工作集中在服务的效率和性能上。与此同时，财务团队则关注已承诺的支出以及应计入哪些预算进行折旧。\n\
  \n当你在整个组织内分散技术采购权时，你需要确保所有团队在描述成本时使用相同的词汇——并且不要让术语对不同的人意味着不同的东西。当加入云服务提供商特定的术语时，语言变得更加复杂，随着你在多个云服务提供商及其供应商特定命名法之间切换，它很快就会变得难以理解。\n\
  \n如果你生成的每份报告都需要附带术语词典——更糟糕的是，有人必须坐下来教团队如何阅读报告——这会阻碍 FinOps 核心的跨团队协作。人们会拒绝花费理解报告所需的时间，而\
  \ FinOps 从业者很快就会耗尽带宽来让每个人保持知情。\n\n要在整个组织内建立共同语言，报告必须始终如一地使用特定术语，并且团队必须学会如何正确解读它们。虽然一个人可能理解*分摊成本*与*成本分配*含义相同，但在\
  \ FinOps 初期这不会成为常识。\n\n在可能的情况下，使用现有的语言结构比创造团队必须学习的全新术语更好。如果云服务提供商使用的术语与现有业务语言不一致，最好在向团队汇报前将其翻译过来。\n\
  \n## 定义基本术语\n\n当然，让每个人阅读本书也有助于建立对 FinOps 中使用的术语的共同理解。让我们定义行业中使用的一些术语：\n\n### 成本分配（或成本归因）\n\
  将云账单拆分并将成本关联到各个成本中心的过程。第 12 章更详细地介绍了这一过程。让团队了解成本是如何分配的，以及拥有集中、受控且一致的成本分配策略非常重要。\n\
  \n### 浪费的使用\n组织未积极使用的资源使用情况。如果资源已被配置，云服务提供商仍会对其收费——即使未使用。\n\n### 过大/过小配置\n当云资源配置的规模大于所需时，例如内存或计算能力过多，则被视为过大。值得注意的是，相反的情况也可能成立。对于配置不足的资源，如果增加规模能带来更多业务价值，则可以增大其规模。\n\
  \n### 适配化\n适配化是指将已配置资源的规模更改为更符合需求的规模。\n\n### 工作负载管理\n确保云中运行的资源仅在需要时运行的做法。它是工程师优化使用的一系列实践之一。\n\
  \n### 按需费率\n为云资源支付的正常或基础费率。这是云资源的公开定价。\n\n### 费率降低\n使用基于承诺的折扣，例如 Savings Plans（SPs）、Reserved\
  \ Instances（RIs）、Committed Use Discounts（CUDs）、Flexible CUDs，或组织与云服务提供商之间的商业协议，以获得所使用资源的更低费率。\n\
  \n### 成本规避\n通过减少资源使用，无论是通过完全移除资源还是对其进行适配化，你可以避免为本会产生费用的资源付费。这种降低云支出的方法将在第 15 章中介绍。请注意，账单数据中不会有实际追踪成本规避的内容；它通常被衡量为当月计费周期成本金额的减少。\n\
  \n### 成本节约\n通过降低你为资源支付的费率，你可以产生节约。与通过减少使用来规避成本不同，成本节约会反映在你的账单数据中。使用量仍然存在，但你为其支付的费率更低。通常你可以在账单数据中追踪节约，要么直接通过监控应用于账单的抵扣额，要么通过比较为资源支付的费率与正常公开价格。然而，工程师应与财务部门确认“节约”一词的任何用法含义，因为有些财务部门将节约解释为减少预算的能力。\n\
  \n### 已实现节约\n当节约应用于账单数据时，你能够追踪在云账单中产生的节约金额。通过将已实现节约与产生和维持它们的努力进行对比，你能够确定 FinOps\
  \ 实践的整体有效性。\n\n### 节约潜力\n在查看云账单预测时，你可以使用现有承诺和商业协议预测节约金额。但在这些节约应用于你的账户之前，这只是节约潜力。\n\
  \n### 基于承诺的折扣\n通过使用 SPs、RIs 或 CUDs 向云服务提供商预先承诺一定量的资源使用，你可以获得这些资源正常费率的降低。\n\n###\
  \ 未使用/未利用的承诺\n对于你承诺但未使用的每个资源使用小时，该预留就会未使用或未利用。另一种说法是预留空置。\n\n### 承诺浪费\n只要你获得的折扣大于未使用预留的成本，拥有一定程度未利用的预留并不是问题。当预留的成本超过你将节省的金额时——即其利用率不足以节省超过预留成本的金额——你称之为承诺浪费。\n\
  \n### 被覆盖的使用\n当资源费用因预留而获得折扣时，你称其为被覆盖。使用量由预留覆盖，结果是收费费率更低。\n\n### 可覆盖的使用\n并非所有云中的使用量都可以用承诺来覆盖。例如，如果你有在工作时间激增然后在工作时间后移除的资源使用量，做出承诺可能会导致承诺浪费且不会节省资金。然而，也有可能在日间使用量下降时开始一些夜间批处理工作，而承诺可以覆盖这两个工作负载，从而为两者节省资金。当用承诺覆盖使用量会产生节约时，将其归类为可覆盖。重要的是资源集合能够提供足够的稳定使用量以使承诺得到利用从而节省资金，而不是单个资源是否稳定运行。\n\
  \n### 未混合费率（AWS 特定）\n某些资源的使用量越多，收费费率越低。（有关批量折扣的更多信息，请参阅第 16 章。）这意味着随着你使用更多资源，或在当月更长时间内使用，你会被收取不同的费率。通过查看账单，你可以看到某些资源成本高于其他资源，即使是相同类型的资源或相同的资源。当费率以这种方式呈现时，在\
  \ AWS 用语中它们被称为未混合。\n\n### 混合费率（AWS 特定）\nAWS 在其账单数据中提供混合费率。这种混合费率通过将费用平均分配给每个资源来标准化你为同类型资源支付的费率，除非使用量由基于承诺的折扣覆盖。虽然\
  \ AWS 在其详细账单数据中提供这种混合费率，但成本的混合方式通常并不完全均匀，或者某些资源成本未被混合，因为它们由承诺覆盖，这可能导致对资源真实成本的混淆。在使用成本和使用报告（CUR）数据文件对账单进行核对时，混合费率仍有特定用途，但除此之外，混合费率很少有用。\n\
  \n### 摊销成本\n某些云资源和基于承诺的折扣可以预付费用购买。资源的摊销成本会考虑这笔初始付款并将其分摊，归因于每个计费小时（或秒，或毫秒）的按比例成本。例如，一年期全额预付的承诺工具（SPs、RIs\
  \ 或 Reservations）将在该承诺应用于资源的整个时间段内进行拆分。\n\n### 全面加载成本\n全面加载成本是摊销的，反映公司为云资源支付的实际折扣费率，公平地计入共享成本，并映射到企业的组织结构。本质上，它们显示了你的云的实际成本以及驱动因素。你的组织可能会根据你希望计入的折扣和成本组成部分以不同方式定义全面加载成本\n\
  \n包含。或者您可以在组织的报告中定义另一个术语来表示这一点。\n\n## 为云专业人员定义财务术语\n\n来自财务学科、工程师理解起来有帮助的一些术语包括：\n\
  \n### 配比原则\n\n费用应在收到价值的期间记录，而不一定是在云服务提供商开具发票的期间或付款时。配比原则适用于权责发生制会计，也是与现金制会计的主要区别。在\
  \ IaaS 计费中，您从云服务提供商处收到的（通常为每月）发票可能包含前期付款，这些付款将在承诺的较长期限（12 个月或 36 个月）内对资源提供优惠——折扣；前期付款的大部分利益并不在此会计期间。这意味着您应使用计费数据（例如\
  \ AWS 中的 Cost and Usage Reports、Azure 中的 Azure Billing File）来费用化支出，而不是使用提供商的发票。\n\
  \n### 资本成本/WACC/ICC\n\n资本成本是指企业将资金投入投资所需的成本。有时也称为内部资本成本（ICC）。在云中，资本成本在考虑为承诺如 RI\
  \ 支付前期费用以获得额外折扣时是一个重要因素。例如，如果一家公司以 8% 的利率借款，那么其资本成本就是 8%。这 8% 成为公司投资回报需要超过的门槛。然而，这个\
  \ 8% 的例子被大大简化了。实际上，大多数公司通过多种渠道获得资本。各种类型的债务和股权融资可能带来非常不同的利率。在这种情况下进行资本成本计算时，公司必须使用这些利率的混合，称为加权平均资本成本（WACC）。大多数财务团队会知道自己的\
  \ WACC，并在进行前期 RI 采购时必须考虑它。\n\n### 商品销售成本（COGS）\n\nCOGS 衡量在特定期间产生收入需要多少美元支出。例如，如果一家电力公司将煤炭从储存中运出并运入发电厂，它会记录被燃烧的煤炭成本。该成本没有未来利益，因此它将是可直接追溯到该期间收入的费用，使其成为\
  \ COGS 费用。COGS 的测试是：它们是否直接费用化并且与同一期间的收入直接相关？\n\n> 用于研发的托管成本可能比用于 COGS 的成本获得更优惠的税收待遇，因此能够清晰地区分两者是\
  \ FinOps 工作的一项潜在有价值的能力。\n> \n> —Jason Rhoades, Intuit\n\n对于一家软件公司，COGS 将是运营其软件的每月云账单、销售人员佣金和支持成本。值得注意的是，云是最具可变性且优化潜力最大的部分。由于通常不好的商业做法是拒绝您的销售佣金或解雇您的支持人员，这将聚光灯集中在优化云支出而不减少收入上。\n\
  \n### COGS 何时可成为资本化资产\n\n就费用如何使用而言，存在一个潜在的意外情况。假设一家电力公司将其部分煤炭用于制造钻石。如果它燃烧煤炭来发电并出售以获得收入，公司会将煤炭成本记为\
  \ COGS。但如果它用煤炭制造钻石，而这些钻石并未在该期间出售，而是存入库存以在未来某个期间出售，则煤炭的成本将是研发支出，因此被资本化为资产。然而，一旦这些钻石被出售，煤炭的成本就会在销售期间重新转为\
  \ COGS。\n\n为了说明这一点，我们之前看到一家正在开发新购物平台产品的零售商以有趣的方式应用 COGS。\n\n该公司将产品生成期间使用的云计算小时数记为资本化资产，在该期间未费用化。它能够这样做是因为正在开发的产品并未产生任何收入。零售商使用云计算小时数来创造将在未来期间产生收入的资产，就像电力公司用煤炭制造钻石而不是将其燃烧发电一样。\n\
  \n一旦该购物产品上线，资本化的计算成本就开始在产品开始产生收入的相关期间进行摊销。请注意，购物平台产品不是有形资产，因此被摊销而不是折旧。\n\n在云中，RI\
  \ 通常在为期一年或三年的使用期间内摊销到所使用的期间。\n\n### EBITDA\n\n息税折旧摊销前利润（EBITDA）是衡量企业盈利能力的广泛使用指标。该指标还通过将利息支出和税款加回收益来排除与债务相关的费用。\n\
  \n尽管如此，它是衡量企业绩效的更精确指标，因为它能够在会计和财务扣除的影响之前显示收益。EBITDA 可用于将公司相互比较以及与行业平均水平比较。EBITDA\
  \ 是衡量核心利润趋势的良好指标，因为它消除了一些外部因素并提供更准确的公司间比较。\n\n### 抽象有助于理解\n\n人类往往很难处理非常大和非常小的数字。例如，如果某物每小时花费\
  \ 1 美元，计算 10 美元可以获得多少小时相对简单。然而，如果资源每小时花费 0.0034 美元，计算 10 美元可以获得多少小时就需要计算器。数字格式也很重要。没有格式，100000000\
  \ 很难以阅读。大多数人需要数零并添加逗号才能确定其表示的金额。\n\n人类对大数字的另一个问题是我们往往会失去尺度感。当团队处理大额美元金额时，这可能成为一个问题，例如数千、数百万、数千万或更多。正如\
  \ Hans Rosling 在他的书《Factfulness》（Flatiron Books）中指出的那样，当人类处理非常大或非常小的数字时，大小直觉就会启动，您需要找出应对方法。\n\
  \n在一次 FinOps Foundation 会议上，其中一位成员展示了如何使用抽象来协助 FinOps。他通过指出一十亿和两十亿之间的差异听起来不大，但实际上是一个巨大的变化来加强他的观点。\n\
  \n许多拥有大量云支出的组织很难为其工程师提供有意义的支出指标。想象一个组织每年将在云上花费 1 亿美元。在这种规模下，所有人类都将难以理解所涉及数字的规模。而当您对规模感到困惑时，很难回答以下问题：\n\
  \n- 一个月 30,000 美元的优化是多一点还是少一点？\n- 值得投入多少精力来实现节省？\n- 这对业务真的很重要吗？\n- 是否有更重要的优先事项？\n\
  \n### 来自云的故事——J.R.\n\nJ.R. 与一家财富 50 强云支出者合作，该公司在一年多时间内拒绝采取每月 150 万美元的基于承诺的折扣。技术副总裁（也是\
  \ IT 组合的 COO）的常说的话是“我每年有二十亿美元的 IT 预算。鉴于采取这些优化所需的努力，这些优化对我来说没有推动作用。”他有更大的鱼要炸，这就是更紧迫的公司目标——尽快关闭数据中心。虽然看起来可能不是这样，但该副总裁仍在通过实践第\
  \ 2 章中介绍的 *informed ignoring* 概念进行 FinOps。他知道组织可用的优化以及实现它所需的努力；一旦这种价值与努力的方程式达到组织的阈值，就会采取行动。如果组织优先执行优化而不是专注于关闭其数据中心，所实现的节省与为与数据中心提供商谈判合同延期而产生的额外成本相比将是微不足道的。\n\
  \n保持问责文化，这对成功的 FinOps 实践至关重要，当数字变得太大而无法关联时变得越来越困难。\n\n为了帮助提供背景和理解，有时不使用通用词汇是有帮助的，因为花费或节省的具体美元数可能不是关键要点。如果对业务的支出或节省的影响可以用其他计量单位来表述，信息会传达得更清晰。\n\
  \n例如，一位 FinOps Foundation 成员将成本节省与啤酒相关联。如果团队采取某组行动，他表明他们可以节省相当于一千杯啤酒的费用。在本书第一版以来的几年里，同一位\
  \ *beer metric* 实践者已经能够将其报告发展到包括可衡量的业务指标，例如所服务的请求、交付的收入以及为其产品服务的客户。\n\n这种远离仅以美元报告的做法很重要，因为每个涉及云支出的团队都有不同的动机。使用团队的动机来找到合适的例子是使云支出更具意义的一种方法。例如，工程团队的一个新兴动机是引入可持续性指标，如碳排放。有关可持续性与\
  \ FinOps 的更多信息，请参阅第 19 章。\n\n对于企业领导者来说，将云成本与重要的业务价值指标联系起来，例如所支持产品收入的百分比或某些关键活动的产出，可以更清楚地了解云支出的整体效率。然后组织可以为支出百分比设定目标限制并使用\n\
  \n这旨在推动项目采用多种技术进行优化，以减缓云支出增长相对于收入增长的速度。第三部分讨论了优化方法。\n\n但总体业务战略并不能直接关联到团队的动机。例如，工程团队将努力转化为用户功能，因此他们的动机围绕着扩大工程团队并交付更多功能。一位\
  \ FinOps 基金会成员发现，通过以工程团队的月度成本形式报告云支出，他找到了一个有意义的方式来吸引工程师。在评估成本节约措施时，他们能够说出优化措施可能带来特定数量的额外人员编制，或者可以说明成本节约措施多快能支付团队的薪资。\n\
  \n了解团队的动机有助于你找到有效的方式来吸引他们。对于服务经理而言，以替代单位如每位日活跃用户成本（DAUs）进行报告是很好的策略。通过将云支出除以其服务的\
  \ DAUs 数量，他们可以展示这些服务每花费一美元所产生的业务价值。\n\n随着 FinOps 实践不断成熟并开始采用单位指标，你可以将真实成本关联到业务职能，并开始将成本对话引导为价值对话。对于一家运输公司，你的单位指标可能是已交付包裹数，或可从更简单的指标如每次请求或\
  \ API 调用的成本开始。当你能将云成本与每次业务交付等同起来时，你就可以以从节省中可多运送多少批货物的方式报告成本优化。所有这些情境化都有助于在团队之间建立共同理解。\n\
  \n## 云语言与业务语言\n\n当你创建报告，使其脱离操作云资源的员工，或脱离运营成本节约项目的 FinOps 团队时，抽象掉云特定术语是有意义的。当你用更通用的业务术语替换这些术语时，你可以在保持准确的同时对报告进行总结。\n\
  \n例如，让我们来看一下计算资源的云预留。这些将在第 17 章中更详细地介绍，但总体思路是，如果你向云服务提供商做出承诺并有效使用这些承诺，你可以省钱。如果不这样做，你就会亏钱。AWS\
  \ 将其称为 Savings Plans 或 Reserved Instances，不同选项节省的金额各不相同。\n\n如果你的 FinOps 团队为自己创建报告，他们需要了解所做个别承诺的细节。但当你开始向上向财务部门再向整个业务报告时，重要的信息就会改变。你在这里关注的是整体成功：你省钱了还是亏钱了？当你从使用云特定术语如\
  \ *承诺利用率* 的报告转向使用更通用的业务术语如 *已实现节省* 时，你就创造了清晰度。\n\n减少需要深入云知识的人员数量，尤其是在你从技术向更通用的业务报告和监控转移时，降低了知识壁垒。而将报告重点放在所报告的实际业务结果上，继续促进更多的信任、信誉和理解。\n\
  \n## 在 DevOps 与财务团队之间创建通用翻译器\n\n我们之前曾使用道格拉斯·亚当斯的杰作 *银河系漫游指南*（Harmony Books）中的 *巴别鱼*\
  \ 概念来指代此事。然而，这是一个并非人人都能理解的引用。相反，我们将使用 *星际迷航* 中对类似概念的引用，即通用翻译器。在 *星际迷航* 中，通用翻译器用于将外星语言翻译成用户的母语。这正是每个\
  \ FinOps 团队都希望能提供给财务、技术和产品团队的东西，以便他们能够完美地相互理解。\n\n例如，我们曾参加过会议，技术团队讨论他们用于标记云资源的具体值，而财务团队则更广泛地讨论成本分摊的需求。两个团队都在描述同一件事，但他们审阅的报告中存在细微差别，例如标签值如何用于分配成本的细节，这阻碍了这两个团队之间的理解。\n\
  \n他们本可以使用翻译器来消除这种混乱。\n\n但如果财务和技术团队都清楚 FinOps 实践（如成本分摊）在组织内是如何运作的，谈话总是从共同的理解水平开始——不需要通用翻译器。\n\
  \n财务和工程团队都很聪明。然而，你必须记住他们有不同的实践和不同的术语。FinOps 应该帮助财务团队理解云语言，通过为那些理解收支的人抽象掉云特定术语，同时应为工程团队简化财务要求。\n\
  \nFinOps 从业者构建报告和流程，减少了财务和工程团队花费大量时间学习和在专业领域之外工作需求。采用一致语言构建这些报告使团队能够熟悉一套共同术语，然后使用这些通用报告围绕云的收益和成本进行对话。\n\
  \n你需要 FinOps 来使团队高效沟通。理想情况下，会议室中根本不需要 FinOps 团队的人。当每个人共享一套词汇时，该人员的存在变得不那么必要。然而，FinOps\
  \ 团队始终在那里协助构建这些报告，以便信任、理解和清晰度持续增长。\n\n## 教育所有学科的必要性\n\nFinOps 团队随后可以帮助收集和定义组织中用于描述云支出和节省的术语。学科特定术语、行业术语以及不同云服务提供商使用的变体必须被采纳和/或改编为共同词汇表。\n\
  \n财务、技术、产品、采购或管理中的任何人都不应被期望尝试学习每个其他团队的通用语言。理想情况下，每个人在中间相遇，财务学习描述云资源所需的术语，工程学习描述成本的术语，产品团队学习与两者沟通。当团队学习更多其他团队使用的语言时，对话会更快地导向成功结果。\n\
  \n## 基准测试与游戏化\n\n当围绕相同语言构建的通用报告用于衡量每个团队的支出和优化时，就有可能比较团队——甚至创造一些友好竞争。第 22 章更深入地探讨了用于比较群体的指标，但现在想想能够比较团队如何导向游戏化。\n\
  \n例如，可以为成功管理团队云支出授予虚拟成就徽章。庆祝执行最多优化的团队，并突出其对整体云支出和优化的具体积极影响，是吸引和鼓励团队的绝佳方式。\n\n另一种选择是拥有突出最差表现者的报告——那些缺乏优化行动、忽视团队云支出或对意外支出异常反应缓慢的人——如果做得好，可以有效甚至有趣。根据我们的经验，团队不喜欢被列为最差表现者，并经常会付出额外努力来改变他们在名单上的位置。我们将在第\
  \ 11 章更详细地讨论我们所称的“羞辱/最差表现者名单”，届时我们将介绍有助于你实现 FinOps 目标的实践。\n\n## 结论\n\n最终，你使用共同词汇表来建立对云成本和优化机会的共同理解。\n\
  \nTo summarize:\n- 要意识到不同团队使用学科特定术语。\n- 帮助员工学习通用词汇并在报告中保持术语一致，这将有助于消除混淆。\n- FinOps\
  \ 团队不必在会议中充当常驻翻译，但应协助学习并使团队能够越来越多地自行沟通。\n- 考虑添加使用抽象度量单位的报告，以更符合团队意义的方式进行沟通。\n- 将成本和节省按业务价值的某个单位进行划分，可让你衡量云支出的效率。\n\
  \n在你能够优化云支出之前，你需要了解你的云成本。我们将在下一章探讨云账单的结构。\n\n\n\n## 云账单解剖\n\n在本章中，我们将探讨公共云服务计费的基本原理以及这些费用在账单数据中的体现方式。理解云账单是能够在\
  \ FinOps 生命周期后期分配和优化云成本的关键。组织的云支出结构还将有助于确定谁将执行某些优化操作，以及如何委派 FinOps 工作。\n\n与其查看单个账单行（这在\
  \ FinOps 数据深度分析中有时是必需的），本章探讨的是云服务提供商如何向公司呈现数据以对云资源进行收费。正确理解这一点将帮助 FinOps 从业者创建有影响力的报告，帮助所有团队理解云账单。第\
  \ 8 章使用这些概念来影响 FinOps 的用户界面（UI）。\n\n### 云账单类型\n\n顶级云服务提供商以三种方式之一为您提供访问云账单数据：\n\n\
  - *发票*\n  这对 FinOps 来说很糟糕，因为它高度汇总，没有提供足够的数据颗粒度和新鲜度。主要是，发票对财务和一般会计目的有用。\n- *云原生成本工具*\n\
  \  原生工具（例如 AWS 的 Cost Explorer）可视化您的数据，如果您仅使用单一云服务提供商并且报告需求相对基础，则会非常有用。但随着云环境的复杂性和规模增长——尤其是对于多云组织——原生工具存在局限性，可能影响您的\
  \ FinOps 成熟度。\n\n### 详细成本和使用账单数据\n\n详细账单数据（例如 AWS 的 Cost and Usage Report 或 Google\
  \ Cloud 的 BigQuery Export）通常可通过文件或 API 访问。这些数据非常适合查看所有可用细节，但使用复杂，需要专门的知识和数据分析工具才能理解。\n\
  \n### 云计费复杂性\n\n云账单数据很复杂，而且必须如此才能实现 FinOps。在 2020 年出版的本书第一版中，我们指出仅 AWS 就拥有超过 200,000\
  \ 个单独的产品 SKU，其中一些按每秒分辨率计费。截至第二版，三年后，该数字已增长到仅在 AWS 定价 API 中列出的超过 791,000 个单独 SKU，不包括\
  \ Azure、Google Cloud、Oracle 等提供的 SKU。详细的账单数据通常每天通过多次更新传入，其背后存在复杂的费用相互关联，例如实例小时数、存储的千兆字节数和数据传输。我们在这些文件中看到大型云支出者每月有数十亿笔单独费用。\n\
  \n虽然有平台和云原生工具（第 8 章中介绍）来帮助破译复杂性，但团队中至少有一名对数据有深入理解的 FinOps 从业者是很重要的。这不仅有助于其他人理解和拆解计费概念，而且也更容易解释\
  \ FinOps 工具产生的数据和建议。账单专家曾被发现识别账单数据中的差异并向其云服务提供商报告，以便进行账单调整和/或退款。\n\n财务团队查看的发票数据可能并不总是与团队可能正在分析的详细账单信息（例如\
  \ AWS Cost and Usage Report）保持一致。虽然外部 FinOps 平台可以帮助每月对发票进行对账，但发票应用摊销、混合费率（以 AWS\
  \ 为例）或基于承诺的折扣（如 Savings Plans [SPs] 或 Reserved Instances [RIs]）的粒度级别可能与服务或账户/订阅/项目级别的详细账单数据不同。因此，有助于在早期设定期望，即团队应仅将发票用于应付账款目的，而不是分析云支出的部分。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_94_0.png)\n\n> 发票在很大程度上是应付账款工具，而不是 FinOps\
  \ 工具。FinOps 需要比汇总的月度账单所能提供的更精细和及时的数据。\n\n要识别任何服务的成本驱动因素，您需要深入到发票提供的月度明细和云服务级别以下。主要的云提供商（例如\
  \ AWS、GCP、Azure 和 Oracle）都提供坚实的原生成本工具，让您从高层次开始分析支出，这有助于我们迈出进入可见性的第一步。原生成本工具仍有一些局限性，例如组织转向多云后处理多个云账单、处理自定义协商费率、需要推送已分配的支出数据以创建团队问责，或容器成本分配。请记住，云原生工具也可以始终用于对特定成本进行研究和临时报告，因此即使您依赖第三方或自研工具，也应深入了解这些工具及其有效使用方法。\n\
  \n### 账单数据的基本格式\n\n让我们从三个主要云提供商各自提供的账单数据的基本格式开始。文件中的每一行都列举了使用的一种类型资源的使用量。云账单项目的属性也往往包括特定时间段内使用的快照。附加到使用行上的内容如下：\n\
  \n- 时间段\n- 使用的资源量\n- 该期间计费所使用的费率详情\n- 按区域位于世界何处\n- 资源 ID\n- 元数据属性——如账户、项目或标签——可用于将支出分配到产品\n\
  \n稍后，第 12 章将介绍标签以及如何利用它来推动问责制。现在，让我们查看来自主要云提供商的账单数据样本，以便您开始了解为 FinOps 计划提供动力的原始元素。\n\
  \n图 5-1 显示了一行账单数据，这是每天接收的可能数亿行账单数据中的一行。对未经训练的眼睛来说，数据可能看起来难以辨认，但您可以辨别出许多重要属性：\n\n\
  - 资源使用时间\n- 应用于账单的费率和费用\n- 被计费的资源\n- 是否应用了预留，如果有，是哪一个\n- 有助于成本分配的标签信息和元数据\n- 费用所在的区域和服务\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_96_0.png)\n\n图 5-1. AWS CUR 账单数据的示例行\n\
  \n所有这些粒度为 FinOps 团队在实践建立过程中提供了巨大的力量。但粒度会带来复杂性，很快账单数据就会变得如此庞大，以至于无法用电子表格管理。任何实质性的云支出都会产生大量的费用：规模较大的云支出者每月可能有数十亿笔单独的费用行项目，每个项目附带数百列元细节。云原生程度越高，数据集越大：无服务器函数、临时实例使用、按秒计费数据等等，都为\
  \ FinOps 从业者带来了大数据问题。您必须求助于大数据分析技术来获得帮助。\n\n然而，您不能简单地让数据分析师处理原始账单数据。用于管理传统 IT 支出的现有财务系统无法在不进行汇总的情况下处理数据量，也无法提供\
  \ FinOps 为创建反馈循环所需的接近实时速度的数据新鲜度。\n\n每个云的粒度级别和细节不同，其维度和指标的术语也不同。每种基于承诺的折扣在应用方式上代表方式也不同。FinOps\
  \ 团队需要具备技能来填补数据工程角色（第 3 章中描述）。\n\n处理数据应该是决定是构建内部工具还是购买供应商平台时需要考虑的关键因素，这在第 8 章中进行了讨论。供应商抽象掉了随着您添加\n\
  \n云和服务，以及相关的數據质量控制。云本身在添加新服务或更改新的计费功能时也会频繁调整自己的数据。管理数据流和这些变化是管理 FinOps 工具的重要组成部分。\n\
  \n理解这种复杂性让你在未来能够做一些很酷的事情，比如在某些微小变化发生时进行自动异常检测。我们说微小是因为云效率往往会因“千刀万剐”而受损。想象一下，你的公司每月在云上花费\
  \ 1,000,000 美元，然后一个团队留下了一个未使用的 50 个实例集群，每天花费 5,000 美元。鉴于这两个数字之间规模差异巨大，当你查看服务级汇总或月度汇总时，你可能甚至不会注意到这种变化，然而这笔小额费用很快就会累积到每月超过\
  \ 150,000 美元——占总月支出 15%。你需要在这些小变化累积成大成本之前，利用机器学习对数据进行分析。幸运的是，云提供商通过数据的粒度为你提供了强大的能力，可以在小问题演变成超支的感染性创伤之前加以解决。\n\
  \n## 一个简单的支出公式\n\n云账单的公式其实很简单：\n\n```\nSpend = Usage × Rate\n```\n\n使用量可能是资源使用的小时数（或秒数）。费率是为该资源的使用或所用存储类别支付的每小时（或每秒）金额。概念上来说，这很简单。改变其中任何一项，你的云账单就会上涨。两者都增加的话，账单会大幅上涨。\n\
  \n## 时间，为什么你要惩罚我？\n\n在 90 年代，乐队 Hootie and the Blowfish 发行了一首名为“Time”的歌曲。他们唱道时间可以“教你关于明天以及你所有的痛苦和悲伤”。并且“明天只是另一天……我不相信时间”。\n\
  \nHootie 在 FinOps 方面不太可能有效，因为云计费全都与时间有关。几乎每一项费用都基于时间。即使是固定费率的项目，也是按月或按年计费。更常见的是，你按计算的秒数、GB\
  \ 月存储量，或查询完成所需的时间付费。这都与支出公式中的使用量部分相关：在一段时间内你使用了多少云资源。当然，也有例外。无服务器和数据传输不是基于时间而是基于用量。两者仍然遵循用量\
  \ × 费率的相同模型。\n\n例如，720 GB 的数据传输可能按每 GB 0.02 美元的费率收费。或者 235,000 次函数请求按每次请求 0.001\
  \ 美元收费。然而，这些例子仍然基于使用量。你使用了这个东西吗？如果是，就收费；如果没有，就不收费。这是云的变动支出模式与本地部署的固定支出模式的又一例证。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_98_0.png)\n\n需要记住的一个重要云计费细微之处：只要资源处于开启状态，你就会被收费，无论资源是否被高效使用，或根本未被使用。你有责任确保资源得到有效使用并适当配置。\n\
  \n考虑云提供商如何对计算资源收费。费用基于资源运行的时间。虽然大多数主要提供商按秒计费计算，但让我们通过使用小时来简化这个例子。30 天的月份有 720 小时，31\
  \ 天的月份有 744 小时（我们将在本章后面讨论二月）。\n\n因此，如果你查看一个在整个一月都运行并按小时计费的资源的计算费用，你会看到该资源 744 小时的计算使用量记录。当然，它还将包括为这\
  \ 744 小时计费的费率。所有 744 小时都可能按同一费率计费，但同样可能，例如，其中 200 小时应用了 SP 或 RI，而另外 544 小时没有。如果是这样，就会有两行数据。一行列出按即付费费率的\
  \ 544 小时，另一行列出按 SP/RI 费率的 200 小时。同一资源，在不同时间产生不同成本，这是由于云提供商在计费数据中对基于承诺的折扣进行看似随机的应用所致。这种情况是常态，使得对流动的云计费费率进行规范化——并向业务解释——成为\
  \ FinOps 提供商持续的头痛问题。\n\n## 微小部分的總和\n\n所有这些微小费用都会汇总成每项服务或每月的总费用。但每一笔微小费用都有其自身的细微差别和属性，如果仔细检查，可以为你的使用情况提供丰富、有用的数据。记住，你被收取的是该事物在该期间开启的实际时间费用。不是是否被使用，而是是否开启。\n\
  \n我们经常这样解释：“不要对资源产生依恋。你买的不是离散的资源——你买的是在一段时间内对资源的按比例使用。” 在 90 年代中期，J.R. 在夏威夷的 W.\
  \ M. Keck 天文台从事 IT 的第一份工作中，他使用的是以当地海滩命名的服务器：*Hapuna*、*Kiholo*、*Kaunaoa*、*Maumae*。但在云中，计算资源应被视为临时且可替换的。它们是牲畜，不是宠物。\n\
  \n正如我们稍后会进一步解释的那样，即使是 SPs/RIs/CUDs 等基于承诺的折扣计划也不会关注它们附加到哪台服务器上。它们只是附加到与特定相关属性匹配或提供最大节省机会的服务器上。当你将同样的思维方式应用于云计费时，你会意识到\
  \ *you're buying time, not things*。而且尽管对某些人来说这似乎显而易见，这个概念对于财务团队在开始核算和理解云账单时至关重要。\n\
  \n## 云计费数据的简史\n\n完全披露：我们对云支出数据是彻头彻尾的极客。你可能会在 AWS re:Invent 或 Google Next 看到我们，怀旧地回忆过去十年中云计费文件的各种迭代以及每次迭代所解锁的能力。冒着陷入极客兔子洞的风险，这些迭代实际上与一家公司开始\
  \ FinOps 的典型旅程完美映射。每次迭代都反映了当时最先进的云支出者的成熟度。如果公司在当时没有跟上潮流，它们很可能现在正处于类似的旅程中。因此，从渐进式采用的角度来看，快速深入了解过去\
  \ 10 多年 AWS 计费文件更新的情况非常有用。我们使用 AWS 来描述历史，因为他们是第一个提供此类计费数据的云提供商。\n\n### 2008: Invoices\n\
  \n一切就此开始。在这里，你可以看到按月和按服务级别的账单，没有公司元数据（如标签），也没有了解变化或成本驱动因素的粒度。财务团队看到这个账单时不可避免地会问：“这个发票对吗？”\
  \ 要回答这个问题，你需要查看计费数据的下一个迭代。\n\n### 2010: Consolidated Billing\n\n现在听起来可能很疯狂，但 AWS\
  \ 在多年时间里不允许你将付款汇总到单个账户。云支出的早期先驱有时会有数十个不同的云账户，每个账户都有单独的账单，无法合并到一个账户下进行支付或合并。云蔓延成为一个严重问题：早期云采用者经常有违规的云支出账户仍在个人信用卡上支付，必须通过费用报告追踪下来。合并计费增加了\
  \ payer 和关联账户层级概念，使其能够在独立于安全或权限的情况下建立合成计费关系。这改变了游戏规则，不仅对报告目的有用，也使确定承诺水平变得更容易。\n\n\
  ### 2012: CAR (Cost Allocation Report)\n\n2012 年，AWS 用户希望开始回答诸如“好吧，我知道这个月花了 100,000\
  \ 美元，但哪些产品或团队推动了这笔支出？”之类的问题。CAR 文件引入了为每个标签值和每个关联账户创建单独数据行的概念。当时这是一个大事——你终于可以分配支出。但这也很令人沮丧，因为它按月粒度报告支出，因此你无法确定支出何时开始或何时出现峰值。CAR\
  \ 中也有未标记支出的月度汇总行，但无法看到它们由哪些资源组成。\n\n### 2013: DBR (Detailed Billing Report)\n\n\
  DBR 引入了按服务计费的时间序列。不同于只能看到某个月某项服务花费多少，你可以看到该服务在该月何时产生费用。这让你开始了解团队在月中做出的弹性变化如何影响支出。但——剧透——DBR\
  \ 缺少一个即将改变成本管理世界的关键数据。\n\n### 2014: DBR-RT (Detailed Billing Report with Resources\
  \ and Tags)\n\nDBR-RT 是一个变革者。它为每个时间段内使用的每个资源引入了一行数据，每個标签键都有一个列。数据增长惊人：大型客户的 DBR\
  \ 很少超过兆字节，但 DBR-RT 可能达到数百 GB 的 CSV（逗号分隔值）数据。对于一些大支出者，这可能意味着单个文件中有数十亿个逗号。该文件让你可以看到在特定时间段内具有特定标签的特定资源\
  \ ID 驱动了支出，以及该小时是否应用了 RI。突然之间，你可以用极高的精度定位变化。因此，早期 FinOps 实践者可以开始为优化提供更好的建议。\n\n\
  ### 2017: CUR (Cost and Usage Report)\n\n开发期间代号为“Origami”，CUR 文件是对计费架构的彻底重新思考。首次，AWS\
  \ 从 CSV 转向更适合程序化摄取的 JavaScript Object Notation（JSON）格式。作为这一演进的一部分，某些数据，如费率，被拆分到单独的\
  \ JSON 文件中，使得构建自己的计费数据读取器变得更棘手，而许多人已为更简单的 DBR 格式这样做过。这没关系，因为 CUR 有一个小而强大的优势：它不仅能告诉你是否应用了\
  \ RI，还能告诉你在该小时应用了哪个 RI（或其一部分）。突然之间，你对 RI 的利用率有了更清晰的了解，以及它们如何为额外的采购和修改决策提供信息。自 2017\
  \ 年以来，AWS 一直在迭代此文件格式，截至 2022 年底，它仍然是标准。\n\n\n\n一旦了解这段简短的历史，就很容易看出它遵循了初创 FinOps 实践的相同渐进改进方法：\n\
  \n- 1. 你在向云服务提供商付款前，先检查按服务划分的总支出。（Invoices）\n- 2. 然后你可以深入了解哪些团队或产品在推动该服务，以便进行成本展示或分摊。（CAR）\n\
  - 3. 然后你开始思考资源的使用时间。（DBR）\n- 4. 对此不满意时，你意识到想要精确定位具体的资源费率应用，并找出成本分摊的缺口所在。（DBR-RT）\n\
  - 5. 随着被消费的云服务提供商产品选择日益增多，你寻求更细粒度的过滤以获取云使用中的具体细节。此外，你希望让 FinOps 工作更具程序化，并回答关于承诺（如\
  \ RIs）的投资回报率和价值的问题。（CUR）\n- 6. 最后（或者至少目前如此，因为 FinOps 始终在演进），像 Amazon Billing Conductor\
  \ 这样的服务使你能够调整费率、拆分账单，并为特定目的提供定制化账单数据。\n\n这种演进也映射到 Cloudability 的发展历程，Cloudability\
  \ 是最早的云成本平台之一。他们的平台在 2011 年只是一组脚本，登录 AWS（使用 root 凭证，因为 IAM——身份和访问管理——当时还不存在），抓取发票屏幕，解析出总支出明细，然后发送一封包含数字的简单每日邮件。至今，日常邮件功能仍是该平台的核心，推动着团队的反馈循环。但随着账单数据的日益复杂，所有\
  \ FinOps 认证平台（如 CloudHealth、Spot、CloudCheckr 等）都已适应并演进，功能与之匹配。\n\n我们通过 AWS 账单数据的视角讲述了上述故事，仅仅是因为在撰写时它是成熟度最高的。但请放心，其他每个提供商都在经历（或已经历）类似的账单成熟度之旅。多云之旅不幸带来了更多复杂性。Azure\
  \ 长期以来根据你与微软的合同类型支持不同的 API（尽管其中一些 API 自 2022 年底起已被弃用并整合），并且相同的信息并不总是通过每个 API 可用。截至\
  \ 2022 年，Google Cloud 仍未通过同一机制为所有服务提供完全细粒度的资源级数据，但存在各种变通方法。但所有云提供商都在不断更新其成本和账单数据的提供方式，并进行修改以支持更多新服务、新计费结构和新定价模式。\n\
  \n## The Importance of Hourly Data\n\n你可能会想知道为什么需要考虑小时级（或秒级）数据和资源级粒度。按标签的日级或周级粒度还不够吗？简单答案是否定的。一旦你的\
  \ FinOps 实践成熟，就更不可能是足够的。\n\n小时级数据对于执行更高级别的 FinOps 功能（如基于承诺的折扣规划）是必需的。SP/RI/CUD 的购买基于在特定时期内运行的特定类型资源的数量，相对于不预留该资源的盈亏平衡点。如果按月汇总资源，你就得不到那个重要细节。要确定需要多少资源，你必须查看每个小时（或每秒）运行了多少资源，以及使用量的水线。\n\
  \n我们在这里不会详细说明（这个故事仍处于早期成熟阶段），但请记住，将来 AWS、GCP 和 Azure 等提供的细粒度可见性对于在一个资源可以存在并仅在几秒或几分钟内被计费的可变资源世界中访问至关重要。\n\
  \n## A Month Is Not a Month\n\n想象一家公司在年初采用了新的成本优化举措。它从 1 月 1 日开始列出成本削减行动：“我们关闭了未使用的实例，对其他实例进行了\
  \ rightsizing，并购买了一些 Savings Plans。”第二个月，云账单下降了 10%。成功！\n\n但等等。如果用二月份的天数除以一月份的天数，你会得到\
  \ 90%。这可能显得痛苦地显而易见，但你甚至无法开始计算有多少次二月与其他月份之间的差异错误地让团队认为他们在有效降低成本。然后，不可避免地，在 3 月 31\
  \ 日，成本环比上涨 10% 时会引发恐慌。\n\n值得重申的是，*云计费全都与时间有关*。云计费不像许多财务团队习惯的那样使用固定的月份。它更细粒度，如果你想进行同类比较，你需要查看相同长度的时间，无论是\
  \ 10 天还是 10 小时。\n\n当你从将全年支出平均除以 12 的瀑布式摊销计划世界中走出来时，这是一个很大的转变。而旧习惯很难改变。我们实际上见过云挑战型财务部门批评正确计算的小时级摊销，认为其偏差了\
  \ 10%，因为他们将摊销除以 12，而他们应该取每秒（或每小时）的摊销成本并乘以使用的小时数。这又是 FinOps 需要新思维的又一个例子。\n\n## A\
  \ Dollar Is Not a Dollar\n\n在谈到同类比较时，请记住特定行中特定资源类型的费率可能与不同资源时间段中的相同资源类型不同。与你拥有或租赁的硬件不同，你可以在一段时间内为资源设定一致的费率，云费率可以根据云提供商是否应用了折扣而大幅变化。\n\
  \n此外，SP 或 RI 的提前预付款摊销可能会使方程式变得更加复杂，你需要决定是否将这些计入用户看到的费率。我们建议将其包含在内，因为这样显示的金额将更好地代表你以后分摊收取的金额。当然，这假设你已经在分配之旅中达到了该阶段。\n\
  \n如果你选择不包含摊销的预付款，你的团队可能会认为他们花费的比实际少，尤其是在 AWS 和 Azure 提供的预付 RI 的情况下。当这些不包含时，账单数据中已应用使用部分的行的费用最终为\
  \ $0.00——即使使用了你预先支付了费用的资源。你会让团队对成本降低感到高兴，但也会给他们带来错误的效率感。\n\n所有云服务提供商还为某些服务提供所谓的免费套餐，有时作为促销，有时按月持续提供。对于大型云用户来说，这通常只是一小部分，但这又是费率差异可能导致混淆的另一种方式。每月获得免费使用优惠的工作负载往往没有一致性，这可能导致你的团队在月度成本中看到细微且令人困惑的变化。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_103_0.png)\n\n请记住，费率和成本可以在团队对基础设施不做任何更改的情况下发生变化。\n\
  \n## Two Levers to Affect Your Bill\n\n记住，云支出的简单公式给了我们两个影响云支出的基本杠杆：使用量和使用费率。\n\n\
  ```\nSpend = Usage × Rate\n```\n\n这将是决定如何优化以及组织中谁来执行优化行动的关键部分。让我们先看如何，然后再讨论谁。\n\n\
  第一个杠杆是减少使用量。这称为 *cost avoidance*，你可以通过终止空闲资源、对过大资源进行 rightsizing、在非高峰时段减少运行资源的数量，或在夜间和周末完全关闭来做到这一点。\n\
  \n第二个杠杆是为使用量支付更少的费用。这称为 *rate reduction*，你可以通过利用云计费结构来实现，例如 Savings Plans（AWS 或\
  \ Azure）、预留实例（AWS 或 Azure）和承诺使用折扣（GCP）。还有基于使用量的批量折扣（例如 GCP 的持续使用折扣）或云提供商为大规模支出者提供的定制定价计划。最后，一些公司还使用\
  \ spot 实例或抢占式实例，如果他们愿意在资源可能突然丢失的情况下进行工程设计，这可能很有用。不管你选择哪种方式，它们都会导致为使用量支付更少的费用。\n\n\
  ## Who Should Avoid Costs and Who Should Reduce Rates?\n\n关于优化任务中谁负责每个流程，一直存在争论。在与数百家做\
  \ FinOps 不佳的公司以及（数量更少）达到更成熟 FinOps 阶段的公司工作超过十年后，我们对此有明确的看法：\n\n> 最成功的 FinOps 实践将使用更少（即避免成本）分散化，并将支付更少（即降低费率）集中化。\n\
  \n负责推动大部分云支出的分散决策者是直接做出基础设施选择的应用程序所有者本身。他们最有能力决定是否关闭事物、调整其大小或改变需求的形状。由于他们对工作负载需求的深入了解，他们可以查看利用率数据并确定看似空闲的实例是否需要保留或可以终止。在大型分布式组织中，基础设施决策无法有效集中化。给工程师/应用程序所有者提供数据和权力，让他们为业务目标做出正确的决策。\n\
  \n另一方面，这些应用程序所有者通常并不处于购买 RI 或 CUD 的最佳位置。更糟糕的是，他们有时误解了这些工作的财务机制，或不了解公司资本成本等重要相关概念。集中的\
  \ FinOps 团队可以查看整个云环境以寻找节省机会。甚至更好的是，他们可能拥有采购或财务分析技能，能够理解现金流分析的细微差别，并熟悉组织的业务需求和财务约束。第\
  \ 16、17 和 18 章提供了对各种基于承诺的折扣的更深入分析以及有效使用它们的策略。\n\n\n\n根据与提高预留/承诺覆盖率、减少未使用空闲以及利用批量折扣或议价定价相关的指标来衡量中央\
  \ FinOps 团队。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_105_0.png)\n\n## 集中化费率降低\n\
  \nFinOps 原则之一是集中化团队推动 FinOps，而集中化费率降低是其关键责任领域之一。费率降低方案可能复杂难懂，且云服务提供商对其方案不断创新。在我们撰写本书第二版期间，Google\
  \ Cloud 和 Microsoft Azure 分别宣布了全新的基于承诺的折扣计划，形式分别为 Flexible CUDs 和 Saving Plans。让每个分布式团队花时间学习每个新折扣计划的工作原理以及如何最好地跟踪、优化和运营它们的做法并不有效。\n\
  \n你们团队期望以降低费率运行的云资源单元不会全部来自一个团队。规模化企业运行多个产品和项目，需要数百到数千个云资源，将所有预留汇总到一个集中化监控方式中可提高共享覆盖率。\n\
  \n由于单个 SP 或 CUD 可应用于多个资源——在 AWS 的情况下，可跨多个账户——让各团队自行管理其费率降低计划往往会导致整体覆盖率下降、某一区域覆盖过度，最终导致已购买承诺的闲置容量。当由拥有整体需求视野的中央团队进行管理时，可实现最高水平的节省。正如我们在第\
  \ 18 章关于基于承诺的折扣策略中将介绍的那样，在做出承诺时需要考虑的因素远不止资源类型。\n\n例如，一个团队白天资源使用量很高，而另一个团队夜间资源使用量很高。根据其使用情况，让任一团队单独做出承诺可能都不合理。但总体而言，24\
  \ 小时期间始终运行着一致的基础资源。中央团队识别出预留承诺的机会，从而为两个团队节省资源费率。用于可视化此行为的图像是两个相位偏移的正弦波——见图 5-2；一个下降时另一个上升，随着时间推移，该区域大部分被某些活动填满。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_106_0.png)\n\n图 5-2. 相位偏移重叠\n\n在 FinOps\
  \ 成熟度的更高级阶段，保持折扣覆盖率上升和闲置容量下降需要持续管理。此外，初始采购可能很复杂，难以做到正确（我们见过单次错误承诺就浪费数百万美元）。FinOps\
  \ 团队在为所有人优化覆盖率的同时降低浪费的可能性。\n\n## 为何应将使用量降低去中心化\n\n相反，另一项 FinOps 原则指出，“每个人都对其云使用负责。”随着费率降低现在被战略性集中，成本规避（使用量降低）成为贵组织各团队中推广的活动方法。在企业规模下，云成本可能由各个团队和支持贵企业运行的服务的各种工程师每天进行数百到数千次操作构成。它们是您创新机器的心脏。\n\
  \n为了让他们快速运转，请主动开始并为您的工程团队建立一个轻量级的教育计划。在架构设计期间倡导成本效率，并解释工程师可用于以精益方式部署云的方法，然后根据其工作负载需求增长其资源。一些示例包括有效使用扩展架构和抢占式实例、松耦合架构、无服务器或容器、在团队开始存储数据之前实施数据保留政策、在发布前嵌入变更的成本估算，以及在发布评审期间标记优化（拉取请求和/或变更评审会议），例如更新基础设施即代码中定义的旧一代实例的使用。\n\
  \n尽管去中心化团队通常最适合就基础设施变更做出决策，但中央 FinOps 团队为其提供优化数据和建议供其考虑的做法很常见。他们通过收集使用和利用率数据并提供更符合工作负载需求的资源替代方案的可视性来实现这一点。理想情况下，这些建议会定期推送给团队，或基于阈值警报（针对早期实践）推送，或通过\
  \ Jira 或 ServiceNow 等票务系统纳入开发人员冲刺（针对高级实践）。我们将在第 15 章中更详细地介绍这些建议的关键标准。\n\n这种模式确保您的资源所有者——他们更了解资源的使用方式、依赖关系以及是否有任何业务原因导致更改会负面影响您的服务——在建议实施前有机会审查所有建议。\n\
  \nFinOps 实践者通过提供洞察和数据访问权限，使工程团队能够近乎实时地做出最佳技术决策。他们将节省潜力与支出影响作为成本指标引入，与工程团队已跟踪的其他指标并列。\n\
  \n## 结论\n\n云计费很复杂。提供正确的数据粒度范围涉及工作和权衡。但正是这种复杂性赋予您大量权力，既可分析支出驱动因素，又可授权团队拥有其优化决策。即使您使用\
  \ FinOps 平台来自动化报告和洞察，您也需要了解云提供商数据的格式，以便从所见内容中得出正确结论。力求在组织内标准化一致的成本指标格式及其报告机制。这很可能是一个摊销费率，其中考虑了您与云提供商可能拥有的任何定制折扣、摊销预付款以及其收取的任何支持成本。如果没有这种标准化，您将会有很多混乱，因为您的团队会以不同的方式查看数字。\n\
  \n总结如下：\n\n- 大多数情况下，计费数据是基于时间的，因此需要持续关注，以确保运行中的资源持续提供价值。\n- 只有深入了解计费数据，才能对计费数据进行详细分析。学习原始数据以成为有效的\
  \ FinOps 实践者。\n- 云账单中的细微变化会迅速累积，因此请使用自动异常检测和差异报告跟踪变化，以识别正在上升的趋势。\n- 您账单的简单公式为 Spend\
  \ = Usage × Rate。这为您优化账单提供了两个杠杆：使用更少以及为所使用的资源支付更少的费用。\n- 将使用量降低（使用更少）去中心化，同时将费率降低（为所使用的资源支付更少）集中化。\n\
  - 中央团队更适合管理基于承诺的折扣，因为他们能够跨整个云环境进行查看，并且管理大量承诺组合的复杂性。\n- 去中心化团队由中央团队提供使用优化数据和建议，从而获得授权，因为这些去中心化的应用所有者最适合做出基础设施变更决策。\n\
  \n我们通过介绍 FinOps、您为何需要它、它如何需要文化转变，以及最后云账单提供的洞察，奠定了基础。下一章介绍 FinOps 框架。我们将描述该框架是什么、如何使用它以及每个组件的结构。\n\
  \n## 采用 FinOps\n\nFinOps 是一场无限游戏。我们的意思是，您永远不会真正完成对它的改进。并且您必须从某个地方开始。\n\n> 在有限游戏中，如足球或国际象棋，玩家已知，规则固定，终点明确。胜者和败者很容易识别。在无限游戏中，如商业、政治或生活本身，玩家来来去去，规则可变，没有明确的终点。无限游戏中没有胜者或败者；只有领先和落后。\n\
  > \n> —Simon Sinek, *The Infinite Game* (Penguin UK, 2020)\n\n我们从实践者社区听到的最常见问题之一是“如何让我的高管接受这一实践？”然后是“如何让组织在对其成功至关重要的大范围角色中采用这一实践？”\n\
  \n本章探讨了从公司技术和财务领导层获得适当组织支持的常见方法。如果没有这些， nascent FinOps 实践往往会陷入被动的中间成熟阶段，与组织中的其他优先事项抗争。本章还探讨了\
  \ *FinOps Driver* 的流程，即认识到实践需求并在内部倡导该实践的人。\n\n图 6-1 概述了在帮助您在组织内建立实践和文化时需要了解的关键角色和需要完成的里程碑。\n\
  \n\n\n![](img/4d4736bc293fd892d1da81802d0f9520_110_0.png)\n\n图 6-1. FinOps 采用路线图，原出处\
  \ Mike Eisenstein 和 Dean Oliver (Accenture, LLP)\n\n## 坦白\n\n在撰写本书第二版时，我的合著者 Mike\
  \ Fuller 向我坦白：“回顾来看，我们 [Atlassian] 在撰写本书第一版时并没有认真对待 FinOps。” 是的，FinOps 是他负责的领域之一，他在管理\
  \ Atlassian 在大规模迁移和云增长期间的云支出时，花了多年时间研究和思考 FinOps 的模式，但这并不是他的全职工作。\n\n事实上，在公司里，这也不是任何人的全职工作。公司层面没有关于\
  \ FinOps 成果的自上而下 C 级编码的公司目标。目标设定不一致，他们并没有积极投入优化和流程，而更多是专注于低垂果实。他知道他们需要做什么以及如何实现，但这\
  \ simply 不是公司的最高优先事项。而且这也没关系。公司正在进行知情忽视——有意决定将重点放在其他优先事项上，例如完成迁移和更快地交付产品。\n\n起初，我的下巴掉了。我自\
  \ 2014 年第一次见到 Mike 以来，一直在记录他关于云成本管理的先进思考，他以其安静而权威的方式，重置了我对诸如 RI 策略和数据源等多个核心领域的思考。\n\
  \n然而，越想越觉得，Mike 关于他自己（以及由此延伸到 Atlassian）进入 FinOps 成熟度的“坦白”，就像每个人一样。不可避免地，你一开始把 FinOps\
  \ 作为一种轻量级实践——或早期成熟度实践——随着时间推移，随着云支出增长和公司目标一致，你会逐渐更认真地对待它。Mike 个人一直痴迷于 FinOps，但他有自己的本职工作（当时他在\
  \ Atlassian 的 CCoE 工作），他的公司（像大多数公司一样）花了一些时间才走到决定大力投资人员配置 FinOps 功能和角色以推广该实践的地步。他是典型的\
  \ FinOps 驱动者原型：它始于一个喧闹的个人，然后随着时间的推移，变成公司重点，具有广泛优先、由高管赞助的目标。\n\n当我们深入探讨这一思考时，我们意识到通常存在几个实践成熟度层级。这在这一章开始时很重要，因为你向领导层提出的建议将非常不同，具体取决于公司处于哪个层级。在内部推广\
  \ FinOps 之前，你需要诚实地审视公司在 FinOps 之旅中的位置，这通常与其云采用之旅相关，以及它最积极优先考虑的成果。\n\nFinOps 不是关于省钱，而是通过对云技术投资的数据驱动决策来赚钱。如果你最优先的事项是尽快摆脱数据中心，或利用云来转型技术并推动更多收入，那么你可能不会获得太多关注长尾优化的认可；你主要会得到加速迁移的支持。\n\
  \n尽管 Atlassian 正在实践知情忽视，但并不意味着他们什么都没做。这意味着他们选择性地投入他们认为关键的能力，而对其他能力保持被动。成本分配被视为问责的关键，并被积极追求，而基于承诺的折扣和\
  \ rightsizing 则更被动地进行。\n\n不过，有一点 Mike 知道他需要将被动实践转变为积极管理的实践。\n\n## 不同层级的不同高管推介\n\n\
  为了确保获得最大的成功，让我们再次转向第 1 章中讨论的 FinOps 成熟度模型。在早期阶段，你将有一个基于你希望实现的结果的特定推介。为了做到这一点，你必须评估你的组织真正处于何处。\n\
  \n在成熟度较低的阶段，你可能正在做一些与 FinOps 相邻的事情，例如审查支出或偶尔进行优化，但你并没有以生命周期的方式进行，也没有运行一个框架（如第 7\
  \ 章中涵盖的 FinOps Foundation Framework）及其能力，或采用 playbook。\n\nMike 后来补充道：\n\n我们当时并没有像今天这样以结构化的方式进行\
  \ FinOps。我们多年来一直以更临时的方式进行。在我们 FinOps 成熟度的中间阶段，我们开始为框架中的所有能力领域设定目标，并为这些能力设定目标和阈值，跟踪我们旨在改进的能力，衡量我们努力的结果，并对外报告。\n\
  \n### 起始推介\n\n> 聪明人起初做的事，愚人最后才做。\n> —沃伦·巴菲特\n\n以下是你在推广 FinOps 初始采用时需要准备好答案的一些问题：\n\
  \n为什么要开始做 FinOps？\n\n请参考本书的前几章，了解如何分享开始的理由。\n\n对每个相关高管角色的好处是什么？\n\n每个高管的关注点（和奖金）方式都不同。如果个别高管了解具体细节，这将帮助他们为支持该计划建立自己的案例。本章后面，我们将分解\
  \ CEO、CFO、CTO 等个别高管的挑战、动机和好处。\n\n对业务的好处是什么，以云采用和组织将获得的结果为衡量标准？\n\n请考虑 FinOps 框架的主要成果（第\
  \ 7 章中涵盖）。同时仔细查看你的云采用，以确定成本分配、优化等好处之间的平衡。云采用目标规定了在铁三角上关注的重点，如第 26 章所讨论的。\n\nFinOps\
  \ 如何帮助解除通往安全、GreenOps 和可持续性等其他重要计划的道路？\n\n我们开始看到 GreenOps 和 FinOps 团队之间存在强烈的重叠。它们共享一组共同的底层目标。将可持续性目标与\
  \ FinOps 挂钩可以帮助为请求提供资金；一石二鸟。参见第 19 章，了解可持续性与 FinOps 如何相交。\n\n现有的财务框架为什么不能解决需求？\n\
  \n现有的 IT 财务框架通常与 FinOps 实践并行运行，通过解决业务中不同的一组需求。参见第 25 章，了解其他常见框架如何与 FinOps 一起（或不一起）工作。当你遇到那些熟悉传统\
  \ IT 框架而不习惯处理云规模下独特的大规模可变性和支出数据粒度的人时，回答这个问题很重要。\n\n由于这是一个起始推介，你还不会有一个结构清晰的 FinOps\
  \ 框架，明确列出组织内需要的不同能力。相反，你提出的是高层级的结果，回答诸如：你是否能够理解你的成本和使用情况，你是否能够识别优化机会等？\n\n### 推进推介\n\
  \n以下是你在推广实践成熟度时需要包含的一些内容。\n\n一个好的起点是衡量你的组织在各个 FinOps 能力方面的成功程度。这使你能够定义并提出下一步需要去哪里。推介的这一阶段侧重于你如何更重地投资于特定领域，并期望实现特定的成果。\n\
  \n表 6-1 中的每个能力都应有一个成功衡量标准和一组成果，这在第 7 章中有更详细的介绍。重点讲述如何实现你需要达到的成果以达到目标成功衡量标准。然后将这些成果与业务需要提供的要求联系起来，以实现它们，例如：\n\
  \n- 来自其他团队的时间承诺\n- 需要额外花费的资金或预先支付的款项\n- FinOps 团队本身或其他组织团队中增加的人头\n\n*表 6-1. 现有实践中框架能力的简化成熟度评估*\n\
  \n| 领域 | 能力 | 初期 | 中期 | 高级 |\n|---|---|---|---|---|\n| 理解云使用情况和成本 | 成本分配 |  | 当前\
  \ | 增长 |\n| 理解云使用情况和成本 | 管理共享成本 | 当前 | 增长 |  |\n| 性能跟踪和基准测试 | 预测 |  | 构建 |  |\n\
  | 云费率优化 | 管理基于承诺的折扣 |  | 当前 | 增长 |\n| 云使用优化 | 资源利用率和效率 |  |  | 构建 |\n| 实时决策 | 衡量单位成本\
  \ | 构建 |  |  |\n| 组织对齐 | FinOps 与其他框架的交叉 | 当前 |  | 增长 |\n\n\n\n以下是您在对该实践进行额外投资时希望突出的能力成果示例：\n\
  \n### Cost allocation\n成本分配\n提高成本正确分配给团队的比例。\n\n### Forecasting\n预测\n提高可靠性和可预测性等。\n\
  \n### Measuring unit costs\n衡量单位成本\n识别可以开始为一组产品衡量业务价值指标并将其关联回其报告以用于价值对话的团队。\n\n\
  ### FinOps intersection with other frameworks\nFinOps 与其他框架的交集\n在组织内部提供管理其他财务实践的团队与\
  \ FinOps 之间的协调，减少工作重复，并提高云支出报告的一致性。\n\n### Budget management\n预算管理\n提高同时保持在预测预算内以及“左移”主动预算管理的能力，使工程团队能够主动预测变更的成本影响，并在预计出现重大影响时提高预算负责人的意识。\n\
  \nState of FinOps 2022 数据显示，早期团队通常为 1–3 人，而成熟阶段的公司往往有 13 名以上专职人员帮助在组织中实现 FinOps。最新的调查数据可在\
  \ FinOps Foundation 网站上找到。\n\n回到 Mike 的案例，改善成本削减是最初的推介重点。但在推进阶段，它已完全围绕工程效率展开。他试图回答“我们如何防止工程师陷入困境并提高发布的速度？”这个问题。他知道，改善工程成本效率将使他的技术领导者节省资金并为额外项目和人员配备提供资金：“现在给我们一些钱来改进我们的\
  \ FinOps 实践，以后您就能用更多的工程师做更多创新性的事情。”\n\n超支会限制技术团队的速度。团队超支时，经常被告知要放缓功能开发，专注于通过清理浪费积压来降低成本。理想情况下，团队应从第一天起就领先于问题，并在推进过程中进行成本架构以防止放缓。这是一种经典的维护和\
  \ KTLO（keep the lights on）方法，而非陷入救火的困境。这使得工程工作量可预测且平稳，而不是在浪费过高时出现大量努力的峰值，分散他们对发布的注意力。这一概念通常是您推进实践推介的关键部分。\n\
  \nFinOps 可以为组织呈现大量待解决的问题。每个都会有所不同。完整的图景甚至可能影响企业决定投资的内容。表 6-2 显示了一些向不同角色展示的关注重点示例。\n\
  \n表 6-2. FinOps 可帮助解决不同角色的关注重点示例\n\n| 角色 | 关注重点 |\n|---|---|\n| 业务领导者 | 利用云技术提升竞争力\
  \ |\n| 工程 | 在提高成本效率和交付速度的同时创新 |\n| 财务 | 准确理解、分配和预测成本 |\n\n所有人都或多或少关心成本节约，但每个人的核心动机不同。今天，很少有公司从零\
  \ FinOps 开始；大多数公司已经在进行一定程度的 FinOps 活动。因此，您需要描绘出今天所处的位置、将要去往的方向以及这段漫长旅程的好处。\n\n##\
  \ Sample Headcount Plan for Advancing a FinOps Team\n推进 FinOps 团队的示例人员配置计划\n\n表\
  \ 6-3 是作为向技术高管提出的推进 FinOps 推介的一部分的示例人员配置计划。它包括为关键领域增加的人员配备，例如用于摄取/规范化账单数据及相关数据源的数据工程师、用于审查数据并为组织准备报告的分析师、嵌入服务团队以提升其使用优化技能的成本工程师、连接各种\
  \ FinOps 服务并为组织提供模板的自动化工程师，以及管理 FinOps 团队本身的负责人。\n\n表 6-3. 向 CTO 汇报的实践的示例招聘计划\n\n\
  | 财政年度 | 数据工程师 | 分析师 | 自动化工程师 | 团队负责人 | 所需资金 |\n|---|---|---|---|---|---|\n| FY22\
  \ | 2 | 1 | 1 | 1 |  |\n| FY23 | 2 | 2 | 2 | 1 | +2 |\n| FY24 | 3 | 3 | 2 | 2 |\
  \ +3 |\n| FY25 | 4 | 5 | 3 | 2 | +4 |\n\n您的推进 FinOps 推介应包括在获得所需资源后预期会发生的结果。例如，组织需要\
  \ $X 百万美元的承诺以降低费率，三个新的招聘名额，以及来自另外三个团队（财务、工程和采购）的承诺，以建立业务价值模型。\n\n## Stories from\
  \ the Cloud—RJ Hazra\n来自云端的故事—RJ Hazra\n\nEquifax 的 SVP 和技术 CFO RJ Hazra 分享了他们自身采用之旅如何改变了应用团队对成本的关注重点：“他们主要忙于迁移工作负载，没有足够关注业务的最佳结果。我们通过将曾在成本优化的中央平台上工作的工程师嵌入到业务部门团队中取得了很多成功，这使我们的关注点转变为\
  \ FinOps 现在是每个人的责任。我们发布操作手册，我们构建架构图，您遵循我们设定的模式，我们据此评估您。如果他们不遵循，我们就会放慢他们的速度。”\n\n\
  ## Pitching the Executive Sponsor\n向执行赞助商推介\n\n截至 2022 年，State of FinOps 数据显示，大多数\
  \ FinOps 团队向 CIO 或 CTO 等技术高管汇报。越来越多的人向技术 CFO 或相关混合角色汇报。您推介的第一部分是向 CTO（或您组织合适的 CxO）描绘今天所处的位置。这包括涵盖现有的报告可见性以及公司在\
  \ FinOps 框架关键能力方面的成熟度评估。我们建议从 FinOps Foundation 网站上提供的开源 FinOps 评估开始。\n\n最重要的是，您需要描绘出在实施实践下一阶段后，公司文化和工作方式预期会发生的变化。\n\
  \n以下是您可以在推介中回答的一些问题：\n\n- 工程师的日常工作如何改变？\n- 组织需要引入哪些项目和仪式？\n- 工程经理如何开始思考 FinOps？\n\
  - 组织如何确保拥有合适资源？\n- 深入挖掘可见性优势，组织可以推动哪些单位经济和报告？\n\n以下是一些开始建模特定场景的问题：\n\n- 组织应计划以何种组合实现成本规避：更侧重于使用量减少还是费率降低？\n\
  - 如果组织有更多时间和人员来妥善维护它们，可以拥有多少个 SP 或 CUD？\n- 如果能够更有效地管理承诺和资源利用率，过去一年可以节省多少？\n- 您需要做出什么改变，以便一年后回顾时效率明显提高？\n\
  - 如果有全公司目标或更好的高管支持此类变革，组织可以实现多少更多使用量减少？\n\n推介应涵盖这对公司真正意味着什么。它不仅仅是花费多少钱、需要多少人以及节省了多少美元。在\
  \ Atlassian，正如大多数公司一样，CTO 在进入 FinOps 将推动的节约和效率价值主张之前，重要的是要思考采用 FinOps 对工程团队（技术公司最重要的资产）的影响。\n\
  \n因此，在向 Atlassian CTO 提出推介之前，Mike 从相关团队获得了反馈。他采访了财务部门关于他们在支出分配和可变支出准确预测方面的痛点。他与工程服务负责人交谈，了解他们目前对成本的可见性程度，以及为了能够在异常发生时向领导解释发生了什么，他们需要什么。通过所有的对话，他研究了自己正在推介的中央\
  \ FinOps 团队如何提供帮助。\n\n这些对话也开始为即将到来的变化做好团队准备：服务负责人将被期望知道自己的成本，并在支出发生变化时做好讨论准备。他还开始推广将数据置于工程师路径上的关键策略（有关此概念的详细信息，请参阅第\
  \ 8 章）。他开始设定在推广更结构化的 FinOps 目标和实践后，各层级工程将做什么的期望。\n\n在 Mike 的案例中，资金来自 CTO，因此对话围绕工程收益展开。向\
  \ CFO 推介时，重点应更多放在通过更清晰的分配、更准确的预测以及更低的预算目标差异来确保更好的成本报告，这些都可以通过更多投资得到改善。\n\n## Playing\
  \ to Your Audience\n投其所好\n\n在组织内部提议采用 FinOps 功能时，请向执行团队中的各种角色（工程领导、财务领导等）进行简报，以获得批准、认可并参与开展\
  \ FinOps 并实现其目标。\n\n每个执行团队角色如下所述，包括其目标、关注点、关键信息和有用的 KPI。通过了解每个执行角色的动机，FinOps 倡导者将能够更有效地描述\
  \ FinOps 的价值，最小化获得一致性的时间和精力。\n\n\n\n## 驱动者必须影响的关键角色\n\n图 6-2 显示了 FinOps 团队和驱动者角色最初如何处于各个利益相关者之间，帮助翻译需求并建立桥梁，使他们能够更紧密地自主协作。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_118_0.png)\n\n图 6-2. 与 FinOps 驱动者的角色交互\n\
  \n如需更全面地了解构建 FinOps 实践所涉及的各种角色和岗位，请参阅第 3 章中各个角色的动机。以下部分内容改编自 Adopting FinOps 开源项目。\n\
  \n## CEO 角色\n\n对于 FinOps 实践而言，CEO 的目标是确保云投资与业务目标保持一致。示例请参见表 6-4。\n\n表 6-4. 常见的 CEO\
  \ 业务和 FinOps 目标\n\n| 目标 | 痛点 | 关键指标 | FinOps 收益 |\n|---|---|---|---|\n| 年同比加速公司增长\
  \ | 不可预测、有时混乱的云支出 | 收入增长 | 管理风险 |\n| 战略竞争优势 | 无法看到工程举措与业务目标之间的联系 | 毛利率 | 将工程决策与业务成果相连接\
  \ |\n| 更快的上市时间 | 不确定公司云投资的回报 | COGS（销售成本） | 预测云支出如何随着业务增长而增长 |\n| 以成本效益的方式交付创新、领先市场的解决方案\
  \ |  | 单位成本经济 | 指导组织做出良好的云投资 |\n\n## CTO/CIO 角色\n\n利用技术为业务提供市场和竞争优势。示例请参见表 6-5。\n\
  \n表 6-5. 常见的 CTO/CIO 和 FinOps 目标\n\n| 目标 | 痛点 | 关键指标 | FinOps 收益 |\n|---|---|---|---|\n\
  | 年同比加速公司增长 | 承受极大压力，要么证明云账单的合理性，要么降低云账单 | 收入增长 | 预测云支出如何随着业务增长而增长 |\n| 战略竞争优势 |\
  \ 支出缺乏约束机制 | 毛利率 | 推动组织做出良好的云投资 |\n| 更快的上市时间 | 不满意的工程师 | COGS | 使工程组织能够获得更多自由，利用更新的云技术并更快地将解决方案推向市场\
  \ |\n| 以成本效益的方式交付创新、领先市场的解决方案 | 业务连续性 可靠性 | 单位成本经济 新功能/产品上市时间 工程生产力 跟踪研发与生产支出 保持运营在预算内\
  \ |  |\n\n## CFO 角色\n\n提高成本报告和预测的准确性和可预测性。示例请参见表 6-6。\n\n表 6-6. 常见的 CFO 和 FinOps\
  \ 目标\n\n| 目标 | 痛点 | 关键指标 | FinOps 收益 |\n|---|---|---|---|\n| 成本可见性、细化和准确性 | 不可预测、有时混乱的云支出\
  \ | 收入增长 | 对云成本承担更大的责任 |\n| 单位成本/COGS 总体降低 | 不确定公司云投资的回报 | 毛利率 | 更依赖预算和预测模型 |\n\
  | 在增长期间管理成本，在平稳/下降期间进行不成比例的成本削减 | 成本波动和创新与预算周期不一致 | COGS 单位成本经济 可预测性 | 对公司净利润的直接影响\
  \ |\n\n## 工程负责人角色\n\n在提高交付速度的同时保持成本效益并推动创新。示例请参见表 6-7。\n\n## 表 6-7. 常见的工程负责人目标\n\
  \n| 目标 | 痛点 | 关键指标 | FinOps 收益 |\n|---|---|---|---|\n| 推动对负责应用程序/服务的工程团队的问责 | 随着工作量不断增加，工程师不满意\
  \ | 按基础设施成本计算的收入 | 对云成本的可见性提高 |\n| 通过识别异常和最佳实践，为工程团队提供指导，使其拥有成本效益的应用程序/服务 | 交付周期长\
  \ | 每个部署服务的成本和服务利用率 | 与云成本和单位经济的联系 |\n| 与工程团队合作识别费率降低和可能的成本规避 | 无法预测对预算的影响 | 将 IT\
  \ 成本向业务进行展示和回拨 | 对利用率承担更多责任 |\n| 成本分摊 | 难以识别服务或应用程序所有权 |  | 鼓励采用稳健的架构原则以考虑效率 |\n\
  |  | 无法足够准确地预测开发新功能和产品所需的成本 |  |  |\n\n## FinOps 采用路线图\n\n我们提供了这份入门指南，帮助您构建演示文稿，向其他团队、同事和利益相关者介绍建立\
  \ FinOps 实践的好处。它包括准备步骤、按角色和角色划分的问责制和期望、详细的路线图等。\n\n以下阶段基于 FinOps Foundation 的 Adopting\
  \ FinOps 工作组的开源冲刺成果，其中包括 Mike Eisenstein（Accenture）、Idaliz Baez（RealOps.io）、Natalie\
  \ Daley（HSBC）、Rejane Leite（Flexera）、Mike Bradbury（JunoCX）、Tracy Roesler（dbt Labs）、Bailey\
  \ Caldwell（McKinsey）、Rich Gibbons（ITAM Review）、Erik Peterson（CloudZero）、Nick Grab（Ellix\
  \ GmbH）、Anthony Johnson（Box）、Kim Wier（Target）、Melvin Brown II（美国政府）和 Mandy van Os（TechNative）的核心贡献。\n\
  \n## 阶段 1：在组织中规划 FinOps\n\n正如本章开头所述，FinOps 是一个无限游戏。你永远不会真正完成。尽快开始并迈出小步，逐步成熟对业务最重要的能力至关重要。本阶段的目标是制定适合您组织的\
  \ FinOps 转型计划，该计划已根据您可用的资源和您认为最重要的目标进行了调整。\n\n## 进行研究\n\n在组织内部寻找合适的利益相关者。作为希望将 FinOps\
  \ 引入组织的个人，您需要高层赞助以及培养的支持者来建立势头。您可以采取以下步骤：\n\n- 调查可能的倡导者/champion/高管赞助人，并使用定制的 FinOps\
  \ 介绍 deck 或有针对性的访谈问题与他们进行一对一对话，以确定采用策略。\n- 在对话中调查组织正在经历的痛点，例如云成本破坏商业案例、对成本超支的普遍认知、云消费者缺乏成本可见性等。\n\
  - 在对话中调查受影响的群体、团队和个人。谁受痛点影响？\n\n## 制定计划\n\n描绘未来状态的图景。这应该吸引业务关注（由于云技术估值带来的业务加速、单位经济改善等）。您可以采取以下步骤：\n\
  \n- 确定工具需求。确定现有自有工具是否能满足计划的需求。\n- 为 FinOps 职能确定组织归属。这可能在 CCoE、财务或 IT 中。取决于组织结构的复杂性，建立专门的\
  \ FinOps 团队可能需要分阶段进行。一些组织可能会（1）设立跨职能转型项目办公室并创建工作流/工作组，（2）在扩展的云业务办公室/CCoE 中设立 FinOps\
  \ 职能，以及（3）发展为专门的云 FinOps 团队。\n- 确定可以成为 evangelists 的候选早期采用团队。\n- 确定用于衡量 FinOps 职能的\
  \ KPI，并确定衡量业务部门和应用团队等利益相关者参与度和绩效的方法。这些 KPI 是初步的，将在第 2 阶段演进，但拥有一个初始集合很重要。\n- 准备将在第\
  \ 2 阶段使用的沟通计划。\n\n## 来自云端的故事——Jason Rhoades\n\nIntuit 的 Jason Rhoades 分享了在早期交付重大、快速胜利以增加高管投资的重要性：\n\
  \n> 当然各地情况不同，但对我而言在 Intuit，实际的成果先于所有增量的 FinOps 投资。FinOps 作为一种理论可能很难让一些高管理解。或者你被困在\
  \ CTO 将其视为纯技术工作而 CFO 将其视为纯财务工作的局面。描绘这样的图景：“我们上个月通过新的 FinOps 预付努力节省了 $XM，还有 $YM 可以继续追回”\
  \ 或 “我们追踪到了根本原因”\n\n将一次云成本激增与某个团队采取的行动联系起来，并且本可以通过投入来预防它\"——当你处于绿地环境时，这些已得到证明且相对容易实现的早期成果描绘出\
  \ FinOps 如何在长期内创造价值的更具体/更直观且高管能够理解的图景。领导层更有可能支持已经展现出可证明、可量化的成功的努力，而不是仅仅谈论潜力的努力。证明价值，你就会得到你寻求的支持。沟通计划不应过度聚焦于\
  \ FinOps 的细节，而应讲述 FinOps 能为业务做什么的故事。\n\n### Gather support\n\n召集已培养的支持者并解释采用 FinOps\
  \ 的重要性：\n\n- 突出当前状态、痛点和其他问题。\n- 识别威胁并提供如果不采取行动可能发生的情景。\n- 展示 FinOps 成熟后在组织中的样子。\n\
  - 审视应或可被利用的机会。\n- 制定实施计划的路线图。\n  - 获取执行赞助人的反馈并根据需要进行调整。\n  - 包括初始团队规模、预算和初始化时间线。\n\
  \  - 包括价值主张（例如，ROI，如设立 FinOps 职能的成本与持续合理的云超支之间的对比）。\n- 向其他利益相关者、支持者和一组不熟悉该项目的人员试点展示，例如业务单元负责人。\n\
  \n### Perform initial resourcing\n\n成功的 FinOps 需要划出具有相关技能集的专用资源：\n\n- 请求赞助人支持，招募其他执行领导作为赞助人。\n\
  - 组成由真正的组织影响者和利益相关者组成的变革联盟。\n- 获得人员编制的预算批准。\n- 根据需求选择原生、第三方或自研工具。\n\n## Stage 2:\
  \ Socializing FinOps for Adoption in an Organization\n\nFinOps 是一种文化变革，需要组织内众多不同团队和角色的认同。因此，旨在鼓励实践采用的沟通和反馈循环至关重要。本阶段的目标是将第一阶段创建的\
  \ FinOps 计划传达给所有相关利益相关者。下面的 FinOps 演讲稿有助于以清晰、易读且快速的方式传达这一点。\n\n### Communicate value\n\
  \n关键利益相关者在组织内推广 FinOps 的方式：\n\n- 传达变革的核心价值观。\n- 分享你对未来组织样貌的简短总结。\n- 分享高层路线图。\n-\
  \ FinOps Foundation 网站上提供的 *What Is FinOps* 演讲稿是此演讲的良好起点，但必须为你的组织定制，以涉及你的计划。\n\n\
  ### Gather team feedback\n\n与已确定的受影响团队（如财务负责人、产品负责人和首席工程师）进行 FinOps 交流，以：\n\n- 提供对\
  \ FinOps 是什么的理解。\n- 了解他们的问题并解释/教育 FinOps 如何帮助他们。\n- 讨论拟议的 KPI 并根据交流反馈进行调整。\n- 建立\
  \ FinOps 与关键合作伙伴（IT 领域；财务控制；应用团队）之间的互动模式。\n- 在推广过程中确定 CCoE 和执行指导委员会的未来成员。\n\n###\
  \ Define initial FinOps model\n\n你的模型应包括资源、运营模式、跨职能互动模式以及用于报告进展的相关 KPI：\n\n- 将 FinOps\
  \ 模型（*inform, optimize, and operate*）定制到组织中。\n- 在现有角色或个人重叠的情况下，通过内部调动确定 FinOps 团队；通过招聘/外包填补剩余差距。\n\
  - 绘制 FinOps 在组织中的变革网络——赞助人、影响者、采用者。制定明确的培训和沟通策略，确保覆盖所有受影响资源。\n- 创建轮辐式模型以在非常大的组织内扩展\
  \ FinOps，本章后面会详细介绍。\n- KPI 路线图：确定第一批 KPI 和报告，并识别和规划下一代 KPI 和报告。\n\n## Stage 3: Preparing\
  \ the Organization for FinOps\n\n一旦你已推广并为文化变革获得支持，现在就开始评估和参与业务的各个部分的工作。本阶段的目标是在你的组织中开始启动\
  \ FinOps 飞轮，以便你在 FinOps 框架的各个能力和领域中开始成熟。\n\n### Assess FinOps readiness\n\n对组织在关键能力方面的成熟度进行评估通常包括以下内容：\n\
  \n- 定义标签、元数据和组织分类法。\n- 部署、配置并冒烟测试工具。\n- 确定第一波 KPI。KPI/业务采用指标可在“采用期”内演进，以营造逐步 FinOps\
  \ 成熟的心态，而非一次性推动完全成熟。这将允许成熟度较低的团队和执行领导不会被“吓退”并逐步进行。\n- 定义用于警报和报告限制的使用和支出阈值。\n- 定义并准备基于角色的自助服务仪表板。这些应显示重要指标，如第一波\
  \ KPI、成本分摊、预算异常、优化建议以及利益相关者感兴趣的其他视图。\n- 准备包含单位成本计算的预测模型。此时，这很可能只是一个电子表格。\n\n###\
  \ Engage stakeholders\n\n你现在准备好开始持续的节奏和流程以实施你的模型：\n\n- 确定业务单元对承诺水平的意愿（企业折扣谈判的总成本、RI/SP/CUD\
  \ 等）。\n- 参与早期采用团队以获得优化成果（例如，关闭不再使用的测试环境或实例以显示实质性节省）。这些对于推广、推广和赢得后续采用非常重要。\n- 获得一些实施\
  \ FinOps 的早期治理成果（例如，标签策略、租用转实时自动化等）。\n- 开始定期会议的节奏。FinOps/CCoE 团队应定期与业务单元、应用团队、从业者和利益相关者沟通，以实施最佳实践并跟踪\
  \ KPI。\n\n请记住，如果组织有多个业务单元采用联邦云运营模型运行，它们将具有不同的成熟度水平。变更管理必须考虑到这一点，并允许它们以不同的节奏采用。\n\
  \n恭喜，你已开始实践 FinOps！\n\n## Type of Alignment to the Organization\n\n我们通常看到三种类型的 FinOps\
  \ 实践团队：集中式、分散式和轮辐式。\n\n在集中式 FinOps 团队中，它们直接对齐 CIO、CFO 或 CTO 并作为业务的服务存在。它们可能是 CCoE\
  \ 的一部分，也可能不是，如果组织没有的话。具有云支出的业务单元与这个专用的 FinOps 团队互动以协作开展 FinOps 活动，而专用的 FinOps 团队集中化能力——例如管理基于承诺的折扣——这些能力最受益于集中化。\n\
  \nPros\n权威、专业知识、规模经济\n\nCons\n利益相关者众多，使能和教育是关键，说服需要执行层支持\n\n在分散式 FinOps 团队中，它们对齐特定的业务单元并服务于该业务单元的最佳利益。每个具有显著云支出的业务单元（BU）在其组内都会有一名专职的\
  \ FinOps 人员，但没有一个总体中央团队在整个组织中推动最佳实践和可重复模式。\n\nPros\n非常敏捷，嵌入工程团队\n\nCons\n未最大化费率，工作重复，容易流失关键人才\n\
  \n我们通常在组织认识到 FinOps 需要发生但没有中央执行层支持来设立正式集中实践时看到分散团队。对于大多数组织而言，这将在实践开始时是一个过渡状态。\n\n\
  \n\n轮辐式团队允许兼具集中化和分散化。\n\n### Pros\n- 关键业务单元在轮辐中拥有专属嵌入式 FinOps 资源，中央枢纽\n- FinOps\
  \ 专注于最大化费率并支持更多轮辐\n\n### Cons\n- 团队需要在轮辐层面投入更多资金、培训并招聘合适的人才\n\n富达投资拥有一个长期存在且定义明确的\
  \ FinOps 轮辐式模型，他们在 2022 年 FinOps X 大会上进行了讨论。中央团队负责管理承诺并汇总来自各个团队的预测等能力，但每个主要业务单元也都有由其各自业务单元资助的专属嵌入式\
  \ FinOps 专家。\n\n## 全职、兼职、借用时间：关于资源的说明\n\n您 FinOps 团队的资源最终应完全致力于 FinOps；然而，它们通常以虚线汇报并按时间百分比分配的方式开始。两种模式的结合也很常见：您有一名专职的\
  \ FinOps 负责人，他/她与财务或工程合作伙伴有虚线汇报关系。\n\n在开始阶段，不要害怕考虑外部承包商或顾问来启动、加速，甚至运营您中央实践的一部分。招聘真正了解\
  \ FinOps 的优秀人才非常困难；有时您可用的顾问是最佳选择。FinOps 基金会有一份 FinOps 认证服务提供商的名单。\n\n通常，一个非专职的虚拟\
  \ FinOps 团队可以让公司开始 FinOps。利用它来开始建立一些能力，例如了解云支出基础和识别最大的成本驱动因素的基础知识。当您在这一点上做得越来越好时，您的成功就成为争取专职资源资金的论据。从小开始，寻找成果，并广泛宣传它们。\n\
  \n正如 Mike 在 Atlassian 的发现，他们知道优化支出有价值，并且需要了解成本，但直到他能够展示影响可能有多大时，他才获得了扩大专职团队的认可。这基于基于真实案例的硬数据，而不是预测。FinOps\
  \ 人头的美妙之处在于它通常能自负盈亏。很少您可以对高管说：“给我五个资源，我会把钱还给你。”\n\n但如果您的提案被否决，您没有获得团队的资金会怎样？是时候审视企业做出这种选择的原因了。这可能是我们所说的深口袋综合征，即优先考虑不惜一切代价迁移，执行层希望团队不惜一切代价完成工作。在这种情况下，您可能需要开始实践\
  \ *informed ignoring*，直到企业准备好并开始向各个利益相关者提供可见性。不要试图强迫工程师进行成本优化。开始围绕成本分配建立肌肉，开始使用云原生工具探索数据，并弄清楚在没有专职团队的情况下可以开始哪些基本的第一项能力。\n\
  \n一些早期成果可能是开始探索承诺型折扣，如第 16 章所述，以实现一些快速的成本优化收益。这些折扣工具可以在很大程度上以对工程团队透明的方式进行，保持他们专注于更高优先级的任务。\n\
  \n## 从零设计一个复杂系统永远行不通\n\n在构建您的提案之前，请考虑以下引言：\n\n> 一个行之有效的复杂系统无一例外都是从一个行之有效的简单系统演化而来。从零设计出来的复杂系统永远行不通，也无法通过修补使其运行。你必须从一个简单的可行系统重新开始。\n\
  > —John Gall, Systemantics: How Systems Work and Especially How They Fail\n> (Quadrangle,\
  \ 1977)\n\n如果您使计划过于复杂，则不太可能成功。您的 FinOps 采用计划应简单地概述企业开始或扩展 FinOps 的步骤以及开展该实践的好处。\n\
  \n保持简单。不要试图一口吃成胖子。选择最关键的部分并从那里开始。定义关键利益相关者将是谁，确定您已有的技能集以及需要填补的差距，定义可实现的目标，并开始制定成本分配策略。\n\
  \n您还必须说明在组织中实现真正的文化变革是一个可能需要数年的漫长过程。FinOps 需要分阶段成长并随着时间成熟，因为相邻团队和流程认识到有效管理云价值所需的变革。\n\
  \n就像人类的免疫系统一样，FinOps 实践并非一蹴而就。为了准备好应对挑战，它必须从一个通过经验学习模式、习惯和适当应对方式以适应不断变化的环境的基础系统开始。\n\
  \n## 结论\n\n获得 FinOps 的组织采用需要周密的规划、对高管动机的理解，以及对组织运作方式的大量研究。\n\n总结如下：\n- 高级实践的提案应包括对当前实践的评估以及\
  \ FinOps 在您组织内的计划，其中包括将加速特定能力及其 resulting 成果的额外投资。\n- 不要试图在 FinOps 实践的初始计划中好高骛远。从小开始，取得成果，并随着时间的推移迭代。\n\
  - 不同高管会对 FinOps 实践期望不同的成果；在向每位高管提案之前，请务必了解他们不同的动机。\n- 您启动 FinOps 实践的提案应专注于可通过谨慎投资实现的水果。\n\
  - 请记住在所有阶段过度沟通并推广您的努力，以带上各个利益相关者。\n\n记住，建立 FinOps 实践就是建立共识。您必须赢得人心，改变长期存在的流程。在下一章中，我们将深入\
  \ FinOps 框架，它将为您提供一个能力菜单，让您从任何起点将实践提升到下一个水平。\n\n## FinOps 基金会框架\n\nFinOps 基金会框架是一套不断发展的构建模块，使您能够构建与组织云成熟度和复杂性相匹配的\
  \ FinOps 实践。本章向您介绍框架是什么以及如何在 FinOps 实践中使用它。此外，本章解释了框架的结构，并说明了如何通过指南、评估和 playbook\
  \ 等相关实施来调整它以满足您组织的 FinOps 需求。\n\n将框架纳入您的实践可避免重复造轮子，并使您能够快速重新组合多年来以各种形式存在的已知构建模块。框架的某些部分与所有实践相关，例如成本分配（即元数据和层级）和建立\
  \ FinOps 文化，而某些部分仅与特定场景相关，如管理共享成本或 IT 资产管理集成。\n\n该框架概述了原则、角色、成熟度特征和关键能力，以构建成功 FinOps\
  \ 实践所需的活动和成功衡量标准。FinOps 基金会从业者社区、云服务提供商和合作伙伴成员都为 FinOps 框架做出了贡献。您可以将本书中的所有内容与框架联系起来。\n\
  \n每个采用云的组织都需要开发管理云成本的机制。框架通过与云成本管理最佳实践保持一致，为您的 FinOps 实践提供运营模型。\n\n与其在成熟过程中发现新的未知陷阱，您可以使用框架来构建\
  \ FinOps 实践并保持对所有有助于您更早实现目标的 FinOps 领域的关注，同时意识到您当前未关注的元素。\n\n\n\n框架还充当一种机制，促进贵组织内负责\
  \ FinOps 的所有人员之间更好地沟通。框架为 FinOps 评估等实施提供了基础，有助于评估并使关键利益相关者围绕对贵组织成熟度的共同评估达成一致。\n\n\
  ## 您实践的运营模型\n\n将框架视为您 FinOps 实践的运营模型。它并不是按特定顺序完成的特定任务清单，因为没有两个 FinOps 实践完全相同；相反，它是一份全面的活动清单，您可以根据需要将其用于实践中。\n\
  \n想象一下，您正在种植花园。每天您评估所见情况并决定哪项任务能提供最大价值。您可能会种植、修剪、浇水、施肥、覆盖等。有大量指南可以帮助您发现并培养作为园丁所需的技能清单。您的花园正在成长，并且需求不断变化。您不能仅靠覆盖就打造出世界上最好的花园。每天遵循相同的任务清单无法让您根据当时最有利于花园的情况调整优先级。您需要制定一个*运营模型*和反馈循环，使日常活动适应花园的需求，根据您拥有的植物、花园状况、所处的气候类型、季节性降雨量、土壤条件变化和其他变化因素来增加和成熟能力。\n\
  \n同样地，在您的 FinOps 实践中，没有一份简单的任务清单可以始终带来积极的结果。框架旨在帮助您了解能力清单以及这些能力在不同组织中实施的基本结构，并允许您在当时选择适合您组织的能力和实施细节。\n\
  \n## 框架模型\n\n图 7-1 显示了 FinOps Foundation 框架主要组件的概述。本节简要介绍框架中的每个支持要素：原则、角色、成熟度以及阶段。然后下一节描述构成框架主要组件的域和能力。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_131_0.png)\n\n图 7-1. FinOps Foundation\
  \ 框架海报 2022 在线可获取\n\n## 原则\n\n框架包含第 1 章中介绍的 FinOps 原则。您在 FinOps 实践中执行的所有活动都必须与原则保持一致。域、能力、角色和阶段都强化了它们所倡导的价值观。当您扩展\
  \ FinOps 框架并为组织定制其组件时，始终牢记原则，并在实践中保持与之的一致性。\n\n## 角色\n\n尽管 FinOps 实践者需要在框架的各个方面参与，但所有参与\
  \ FinOps 的角色也将从理解其结构中受益。业务领导者将有兴趣了解域成果以及应投资哪些领域以确保其问题得到解答并实现目标。工程团队需要了解他们每项任务如何为特定能力做出贡献，而框架则为他们的努力成果提供了背景。通过框架术语实现了\
  \ FinOps 的一致语言，并帮助每个角色了解他们需要扮演的角色。\n\n## 成熟度\n\n框架适用于所有实践，无论成熟度水平如何。随着成熟，您将随着时间的推移采用更多能力，然后在成功衡量指标上设定不断提高的目标。每项能力本身将处于不同的成熟阶段。\n\
  \n框架中的每项能力都有成熟度评估。您应力求熟悉计划立即着手的能力以及计划推迟开始的能力。能力清单并不是您应盲目遵循的死板清单。使能力成熟需要时间和持续迭代，因为您的组织正在成长以适应所需活动。目标并不是在每项能力上都达到先进的成熟度水平；而是在每项能力上达到适合您组织需求的成熟度水平。您应评估哪些域将帮助您实现预期成果，然后评估域内哪些能力需要改进。\n\
  \n共享成本是早期可能花费过多时间的常见能力示例。这些情况通常发生在单个云资源或服务被多个团队使用时。虽然您可以通过自己的数据分析和工具引入详细的共享模型，根据实时使用情况重新分配成本，但这种具体性并非总是必需的。尽管过去几年该领域的工具和最佳实践已大幅改进，但您应评估是否现在采用商定的固定百分比——例如根据商定百分比分摊部分共享成本——就已足够。简单的分配方案通常可以在早期满足业务需求，而无需增加更成熟和动态的共享成本能力的复杂性。\n\
  \n## 阶段\n\n第 9 章介绍了 FinOps 生命周期和三个 FinOps 生命周期阶段：*告知*、*优化*和*运营*。这些阶段帮助您以一致的顺序组织每项能力的活动。它们提醒您始终以迭代、循环的方式工作，随着成熟度提升而进行增量改进。\n\
  \n## 域和能力\n\nFinOps 框架利用一系列域和能力来实现 FinOps 原则中的概念。\n\n高层域涵盖了业务所需的一组成果。域及其相关成果可能会随时间变化，因此我们建议在\
  \ FinOps Foundation 网站查看框架。表 7-1 显示了出版时域列表及其主要成果。\n\n表 7-1. 框架域及其主要成果\n\n| 域 | 主要成果\
  \ |\n|---|---|\n| 理解云使用情况和成本 | 推动问责制和透明度 |\n| 绩效跟踪和基准测试 | 定义什么是好的 |\n| 实时决策 | 能够实现基于数据的支出决策的快速反馈循环\
  \ |\n| 云使用优化 | 确保高效使用云资源，同时减少浪费支出 |\n| 云费率优化 | 使用各种基于承诺的折扣计划来减少您为消耗资源支付的费用 |\n|\
  \ 组织对齐 | 使您的云使用与组织目标和结构保持一致 |\n\n这些成果可以帮助您回答组织提出的实际问题，例如：\n\n- 此应用程序的最大成本驱动因素是什么？（理解云使用情况和成本）\n\
  - 如何减少对特定服务的支出？（使用优化、费率优化）\n- 您对某类资源的使用情况随时间发生了怎样的变化？（绩效跟踪）\n\n然后每个域都会确定一组能力，帮助您在努力实现所需成果时解决将面临的具体挑战。每项能力都描述了有助于该能力成功的所需数据、行动和指标。\n\
  \n## 域的结构\n\n每个域的核心部分遵循标准结构：\n\n### 定义\n\n帮助您了解在 FinOps 实践中需要执行的高层活动，以实现您应期望的预期成果，以及该域旨在为您解决的主要问题。\n\
  \n### 能力\n\n提供实现该域成果的能力清单。我们将在本章后面更详细地讨论能力。\n\n### 供应商和服务提供商\n\n一份提供解决方案以帮助您在该域内工作的工具和服务提供商清单。一些解决方案提供商专注于针对单一域的工具，具备深厚专业知识，而其他提供商则在多个域中提供整体解决方案。\n\
  \n\n\n## 培训与课程\n\nFinOps Foundation 和认证培训合作伙伴提供的培训清单，帮助您和您的员工在本领域接受教育。\n\n部分领域可能包含针对该领域的具体额外内容。\n\
  \n## 能力结构\n\n每个能力代表支持其对应 FinOps 领域（们）的功能活动领域。每个能力的核心部分遵循标准结构。\n\n### 定义\n\n该定义概述了能力范围，有助于您了解哪个能力与特定目标或成果相符。\n\
  \n### 成熟度评估\n\n成熟度评估提供了该能力在不同成熟阶段的示例，您可以用它来评估当前所处的位置以及下一步工作的重点。\n\n### 评估视角\n\n\
  通过多种视角审视您的 FinOps 实践，您可以评估其相对于更广泛的组织以及其中特定目标群体的优势。正如 FinOps Foundation 的 Ben de\
  \ Mora 所概述的那样，有五个视角可用于评估您的能力成熟度：\n\n### 知识\n\n您的目标群体是否理解该能力涉及的内容？这一概念及其机制、术语和流程的普及程度如何？\n\
  \n### 流程\n\n您的目标群体能否描述在其情境中执行该能力的流程？请考虑此类流程的有效性、有效性和普及程度。\n\n### 指标\n\n该能力是否被衡量？您是否有证明随时间推移进展的方法？您如何获取这些测量数据，以及它们与业务成果的相关性如何？\n\
  \n### 采用\n\n该能力在多大程度上被您的业务作为其核心和关键职能的一部分所采用和接受？请考虑该能力在整个组织中的普及程度和存在情况。\n\n### 自动化\n\
  \n您的目标群体是否以可重复、一致、高效且节省人力的方式自动化该能力？\n\n## 功能活动\n\n功能活动是任务或流程，使各种角色能够通过 FinOps 生命周期阶段（本书后面会介绍）迭代地满足\
  \ FinOps 实践的需求。这些活动和程序服务于以下一项或多项：\n\n### 使能\n\n建立能力以帮助他人执行 FinOps 活动\n\n### 教育/知识共享\n\
  \n教导他人如何执行 FinOps 活动\n\n### 倡导\n\n帮助他人理解该能力的重要性\n\n### 可执行任务\n\n创建并传达一项需要组织内某人采取行动的任务\n\
  \n### 提升 FinOps 成熟度\n\n开发流程和工具，使 FinOps 在您的业务中更成功\n\n随着 FinOps 成熟度的提高，活跃的 FinOps\
  \ 实践中实施的功能活动数量也会增加。\n\n## 成功衡量指标\n\n每个能力都需要至少一个衡量其绩效并允许 FinOps 从业者设定目标的指标。这些指标及其相关目标衡量您在给定能力中的成功程度。随着实践的成熟，您将提高目标，从而能够设定并客观衡量短期目标。成功衡量指标还可以帮助您识别阻碍您实现目标的活动。\n\
  \n各种能力中成功衡量指标的一些示例包括：\n\n### 成本分摊\n\n可分配给其所有者的云支出百分比\n\n### 预测偏差\n\n预测支出与实际支出之间的差异百分比\n\
  \n### 资源利用率\n\n由空闲或低效资源驱动的月度云支出百分比阈值\n\n## 输入\n\n有助于能力成功的输入包括外部数据源、报告、白皮书和培训。一些示例包括云采用框架、供应商优化建议以及业务政策/标准。此资源清单是进一步学习或开始收集设置功能活动所需信息的好方法。\n\
  \n## 使框架适应您的需求\n\n由于不同组织具有不同的运营需求，这些需求塑造了其成功的路径，因此 FinOps 框架本身被有意设计为具有方向性，通过一系列\
  \ KPI 提供成功参数，通过在所需活动的背景下描述成熟度特征，以及通过描述每个 FinOps 角色的责任来实现。例如，公共部门或政府机构的预算和预测流程与私营公司大不相同。预计框架会根据您组织的运营需求进行调整和更新。\n\
  \n您使用的云服务提供商和供应商工具将进一步影响团队如何按照框架所述完成 FinOps 实践中的具体活动。推荐的方法是从 FinOps 框架开始，并修改功能活动以涵盖任何组织或行业特定的活动。示例包括变更管理工作流或采购审批流程。对于每个活动，将其分配给组织内的特定角色，向员工传授应遵循的流程，并倡导完成每个活动的重要性。\n\
  \n框架实施是由社区创建的资源，用于提供特定行业和供应商的成功方案。这些资源形式多样，包括操作指南、能力手册，甚至视频演示。框架实施由社区个人成员、社区工作组和合作伙伴成员贡献。实施的目标是提供在情境上相关的应对挑战的方法，以改进您的\
  \ FinOps 能力。实施可以描述如何使用特定工具、流程或改进的功能活动来针对单个能力、领域或整个 FinOps 框架。\n\n## 来自云端的故事——FinOps\
  \ 社区\n\n2022 年初，美国政府各机构的代表聚集在一起，创建了首个政府手册，介绍如何在政府采购流程和规则的独特限制下进行 FinOps。近二十四个机构参与其中，包括陆军、联邦航空管理局、白宫、小企业管理局、住房和城市发展部、总务管理局以及内政部。他们由人事管理办公室（OPM）副首席信息官\
  \ Melvin Brown II 领导。\n\n正如他们在其实施指南的第一版中所说：\n\n> 该手册旨在建立在现有的 FinOps 框架之上，帮助联邦机构开始（或成熟）其云之旅。虽然每个机构都应根据其组织的当前状态和期望成果定制其\
  \ FinOps 实施，但本手册强调了 FinOps 框架中可能需要为公共部门用例稍作调整的领域。\n> \n> 本手册将帮助指导联邦机构实现成功的云财务管理实践，使其能够获得近实时云支出可见性和执行层级细节报告带来的关键成果，从而使机构的云运营与战略目标保持一致。\n\
  > \n> 该手册分为三个阶段，旨在帮助您在机构中实施 FinOps，使您能够顺利过渡到在组织内运营 FinOps。\n> \n> 在您开发自己的解决方案时，您可以将它们贡献回社区作为实施指南，帮助后来遇到类似情况的其他人。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_137_0.png)\n\n实施指南是开发您 FinOps 实践的绝佳参考，您可以通过查看其他组织如何实施单个能力甚至整个框架来实现。如果您找不到符合您目标的示例，我们建议您加入\
  \ FinOps Foundation，利用那里的从业者社区。他们总是愿意回答问题、分享见解并展示对他们有效的方法。\n\n## 与其他框架/模型的连接\n\n\
  其他财务模型和框架的存在，例如 IT 财务管理、技术业务管理（TBM）、IT 资产管理（ITAM）或 IT 服务管理（ITSM），也会影响实施哪些角色、具体流程和功能活动。许多成功的\
  \ FinOps 团队在其组织内与这些现有运营模型并行工作。There\n\n在现有的运营模式运行良好的情况下，让 FinOps 重复或取代其中已有的能力价值不大。FinOps\
  \ 可以填补这些不同运营模式在云财务管理方面的挑战，并将它们整合起来，把优势领域结合成一个整体系统。FinOps 框架具有与这些其他实践共享成果的特定能力。\n\
  \n为了让 FinOps 与其他运营模式/框架良好协同工作，你需要确定 FinOps 将负责的功能活动以及其他模式的功能活动。此外，你还需要跟踪在两者之间共享的信息，以保持它们之间的一致性。有关此信息的详细内容在第\
  \ 25 章中介绍。\n\n## Conclusion\n\nFinOps 框架是宝贵的资源，不仅适用于刚开始 FinOps 实践的从业者，也适用于成熟的从业者。\n\
  \nTo summarize:\n\n- FinOps 框架是一套构建模块，可让你创建与组织在云中的成熟度相匹配的成功的 FinOps 实践。\n- 采用框架中使用的术语将有助于在企业内部所有角色之间就\
  \ FinOps 使用共同语言。\n- 框架使你能够评估自身的优势和劣势。\n- 框架不仅适用于 FinOps 从业者，也适用于组织中的所有角色。\n- 你应通过调整能力以适应组织的运作方式，将框架应用于自己的实践。\n\
  \n下一章将讨论构建构成 FinOps *用户界面* (UI) 的报告和仪表板的注意事项。\n"
- "## The UI of FinOps\n\n你的报告和仪表板为你的组织提供了 FinOps 的用户界面 (UI)。将报告视为你的 UI，你可以应用数十年来关于有效\
  \ UI 设计的研究。你应仔细审视这些报告作为 FinOps 实践的 *产品*。因此，它是用户与数据交互的界面。你在报告中呈现 FinOps 数据的方式会影响\
  \ FinOps 在组织中的推广成功。FinOps 产品应被视为生产工作负载：质量很重要，清晰度很重要，用户体验 (UX) 很重要。这些因素带来对数据的信任，从而使团队能够做出决策，并避免浪费时间来为数据的质量辩护。\n\
  \n制作包含漂亮图表和数据表格的报告很容易，但更难的是根据用户需要了解的内容向他们讲述故事，并使他们能够就需要采取什么行动做出决策。本章涵盖了一些重要概念，帮助你构建高质量的\
  \ FinOps 报告。我们将在本章剩余部分使用 *报告* 一词，但这些概念和建议同样适用于用于向用户交付 FinOps 数据的仪表板和商业智能系统。\n\n\
  ## Build Versus Buy Versus Native\n\n在思考作为 FinOps 实践一部分你将创建的报告时，首先考虑完成工作所需的工具和平台。正如你在第\
  \ 5 章中所学到的，为了创建 FinOps 报告，你必须持续处理的数据量可能非常巨大，因此你很可能拥有整套工具箱。问题是你将使用哪种类型的工具。本章中的概念并非意味着你应该构建自己的\
  \ FinOps 报告平台。它们也并非旨在阻止你这样做。我们通常看到通往成功 FinOps 数据管理的多种工具路径：\n\n- *原生工具* 如 AWS Cost\
  \ Explorer、Google Cloud Cost Management 或 Azure Cost Management 在开始 FinOps 之旅时始终是起点。\n\
  - *软件即服务 (SaaS) 平台* 如 FinOps.org 上指定的 Certified FinOps Platforms 通常被采购以超越原生工具并加快相对于自行构建系统的价值实现时间。它们还充当你在多云计费数据不断变化的环境与你之间的关键抽象层。\n\
  - *先购买后增强* 是我们越来越常见的一个主题，其中大型云支出方会采用原生工具或平台的 API，并在其范围的边缘添加自定义功能，以及将数据集成进出它们。\n\
  - *自研工具* 是 2022 年 FinOps 状况数据中增长最快的细分市场；有时从零开始构建，但通常是在现有商业智能 (BI) 工具（如 Tableau 或\
  \ Looker）之上构建，或使用特定于云的解决方案（如 AWS Cost Intelligence Dashboards 或 Google 的 BigQuery\
  \ Export）。\n\n与许多事情一样，你采取的方法取决于公司的资源、文化和技能。我们知道一些成功的庞大 FinOps 实践完全依赖平台，也有一些完全依赖自研工具。大多数，如果不是所有组织，都将依赖于一套工具和方法，随着其成熟度的增长和云使用情况的变化而变化。没有唯一正确答案。\n\
  \n## When to Use Native Tooling\n\n每个云提供商都提供自己的成本管理工具集。我们建议你始终从原生工具开始。它通常提供你在早期成熟阶段所需覆盖的核心功能。随着你的云支出和复杂性增加，很可能你需要比原生工具所能提供的更多功能。此时，讨论就变成是构建还是购买。不管你如何推进，原生工具仍然可以作为来自你平台数据的合理性检查，并且通常将是你与云服务提供商支持团队沟通的方式。及时了解原生工具的最新情况，并确保组织中的合适人员可以访问它们。\n\
  \n通常，原生工具分为两类。首先是专为成本管理而构建的工具，如 AWS Cost Explorer、Google Cloud Cost Management 和\
  \ Azure Cost Management。其次，随着你的成熟，还有 BI 工具——如 Google 的 Looker 和 AWS 的 QuickSight——云服务提供商提供的报告模板可让你通过工具更深入地自定义报告。\n\
  \n## When to Build\n\n在 FinOpsPod 播客中，Target 的效率工程总监 Kim Wier 讲述了她的 CIO 将 Target\
  \ 视为产品公司，因此大部分开发都在内部进行的故事：\n\n> 我们需要在 Target 内部拥有知识。我们的 CIO 不希望将技术知识外包给其他公司。Target\
  \ 的开发在很大程度上在内部进行。我们建立了软件工程文化，因此所有开发都在内部进行。\n\n因此，Target 投资了一个强大的 FinOps 工程团队来管理数据管道和摄取，以及前端开发团队为各种角色（如工程师和领导层）开发自定义仪表板。\n\
  \n以下是人们选择自行构建报告层的一些常见原因：\n\n- 对自己的数据进行控制\n- 轻松集成内部数据（单位经济数据、分类数据、性能数据等）\n- 根据特定公司需求定制功能\n\
  - SaaS 模式通常不具备所需合规性（例如 FedRAMP、SOC 2）\n- 费用结构并不总是随价值而扩展\n- 报告的灵活性\n- 能够快速做出更改\n\
  - 公司内部具备执行复杂软件开发和数据分析的技术能力\n- 组织愿意持续投资学习不断发展和扩展的云数据细节\n\n## Stories from the Cloud—FinOps\
  \ Community\n\n这个来自 FinOps Foundation 成员 Slack 论坛的故事由 Avalara 的成本优化总监 Lindbergh\
  \ Matillano 分享：\n\n> 我遵循 People、Process 和 Tools 的理念。首先需要合适的人到位，其次是流程，然后才是工具。我经常看到组织在没有合适的人和流程到位之前就投资工具。这通常会导致工具利用不足或围绕工具设计的无效/低效流程。\n\
  \n\n\n我至少为四家公司启动了 FinOps 实践。当我进入一个组织时，我做的第一件事就是运行使用报告来回答以下问题：\n\n- 过去三个月有多少人访问过该平台？\n\
  - 哪些报告被定期使用？\n- 哪些功能正在被使用？\n\n如果使用率较低，我会在评估平台投资回报率时深入探究导致这种低使用率的根本文化原因。\n\n我经常发现利益相关者：\n\
  \n- 偏好原生工具（例如，Cost Explorer）\n- 请求对标准报告进行修改，而这些修改超出了平台的能力范围\n- 仅使用平台 10% 的功能（大多与报告相关）\n\
  - 希望了解平台自动化的代码，因此不允许自动修复，尤其是在生产实例中\n- 尝试将平台定制以满足组织的特定需求通常需要定制或变通方案，从而增加工具成本。\n\n\
  对于自建或购买的平台，要想成功，它需要得到成本意识文化的支持，因为如果没有以成本和云价值为核心的 FinOps 文化关注，工具就会失败。\n\n在某些情况下，购买平台可以节省开发时间和资源。但我认为让工程师参与构建解决方案有助于培养成本意识文化。\n\
  \n## 为什么要购买\n\n相反，Equifax 全球技术首席财务官 RJ Hazra 选择购买平台，以便更快地转向关注 FinOps 的文化方面，同时也关注自动化工作：\n\
  \n> 我们使用采购的 FinOps 平台来生成可见性。但这还不够——我们需要能够快速对可见性采取行动。财务和工程部门需要比以往任何时候都更紧密地合作。CTO\
  \ 优先考虑 FinOps 文化转型，并授权组织中的 SREs [Site Reliability Engineers] 帮助推动并说服其他工程师。我们需要工程师与工程师就使用优化进行沟通，而不是构建工具。我们需要弄清楚如何构建云提供商的承诺结构，因此我们也将采购/采购部门纳入了团队。\n\
  \nCouchbase 高级云 FinOps 经理 Michael Barba 分享了他对为什么要购买 FinOps 平台的观点：\n\n很多公司可能没有内部工程资源来构建自研工具，或者即使有，这些人员在其他地方更有价值。对\
  \ Couchbase 来说，这意味着专注于构建我们销售的服务，而不是构建可以通过软件外包的内部报告。\n\n以下是人们选择购买 SaaS 平台的一些常见原因：\n\
  \n- 快速实现价值：通常设置时 IAM 和云控制台工作量很少\n- 简单的工具可创建映射支出的自定义分组\n- 复杂的数学计算（如摊销的 RI 映射）已计算完毕\n\
  - 比原生工具提供的更详细的优化功能\n- 可访问平台公司的主题专家\n- 平台提供商可降低云数据和数据质量变化带来的风险\n\n## 来自云端的故事——FinOps\
  \ 社区\n\n这个故事来自 FinOps Foundation 成员 Slack 论坛，由法国跨国制造公司 Saint-Gobain 的 Angel Alves\
  \ 分享：\n\n> 当我加入上一家公司时，他们已经在使用第三方工具。我尝试改回自建解决方案，但挑战在于资源不足。我可以替换类似的报告（单一厂商，无 Kubernetes），但我们的路线图包括采用另一家云提供商以及\
  \ Kubernetes。在投入精力构建支持该路线图的解决方案时，决定工程资源有其他优先事项，因此我们选择继续支付第三方平台费用，而将重点放在促进新云提供商和\
  \ Kubernetes 技术的采用上。\n\nSlack 中的另一位人士也分享了他们对平台的看法：\n\n> 对我们来说，简单来说就是我们没有资源/时间自己构建。使用第三方平台为我们节省了大量时间，并允许我们自动保持最新（新\
  \ AWS 服务、Kubernetes 支持等）。尽管有所改进，但原生工具目前还不够好，至少现在是这样。我们经常看到有人询问“如何做 XYZ”，而这些通常已经由我们使用的第三方工具提供。\n\
  \n我们鼓励你将本章中的概念视为透镜，以便使我们讨论的任何路径更加成功。FinOps 依赖于推动问责制和决策，这使其本质上成为从与同事的对话到你在报告中呈现的数据的\
  \ UX 挑战。\n\n## 运营化报告\n\n你的报告和仪表板必须以一致的方式呈现信息，具有高质量数据以及高度的审查和控制。你应该像工程团队对待其生产服务一样对待你的\
  \ FinOps 报告，具有控制、质量检查和严格审查。如果你的报告出现故障或开始呈现不正确甚至不一致的信息，那么组织内部的 FinOps 将受到不利影响。\n\n\
  ## 数据质量\n\nMike 的同事 Diana Mileva 是 Atlassian 的云 FinOps 高级业务分析师，她在 FinOps X 2022\
  \ 上就 FinOps 报告中的数据质量发表了演讲。Diana 解释了数据质量的重要性以及 FinOps 团队处理数据问题的方法。Diana 演讲中的关键内容包括数据延迟、数据问题、质量检查以及\
  \ FinOps 从业者面临的报告挑战。\n\n> *当有人质疑我们的 FinOps 数据时，我们将其视为生产 bug 并开具 jira 票据进行调查。我们对整个数据集执行自动数据质量检查，并辅以\
  \ SLOs [service level objectives] 来衡量及时性和准确性。我们的目标是在用户之前检测到任何问题并主动通知他们，以便他们不会基于错误信息做出决策。*\n\
  > \n> —Diana Mileva，Atlassian 高级业务分析师\n\n在本书印刷时，在大多数云中，使用云资源与其接收使用该资源的计费数据之间存在延迟。延迟通常为\
  \ 24–48 小时。不幸的是，延迟并不一致，尤其是在月初和月末时可能会更长。你有时可能会收到最新可用计费数据期间的部分数据。其影响是 FinOps 报告可能会错误地显示在最近报告小时内成本下降，并且可能缺少最后一天或两天的数据——见图\
  \ 8-1。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_144_0.png)\n\n图 8-1. 由于数据交付延迟，最近几天云成本数据出现下降\n\
  \n一种常见做法是从报告中删除最近几天的数据以避免成本下降。虽然修剪可用数据对于使呈现的数据更一致非常有帮助，但它并不是万能药，无法消除对报告数据质量进行额外监控和警报的需求。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_145_0.png)\n\n对于构建自己的报告的高级从业者，我们建议你在报告上显示两个日期，一个日期表示报告最后更新时间，另一个日期表示创建报告时可用数据的最新程度。这对于不显示按小时或按日细分且仅提供汇总数据的报告尤其重要。\n\
  \n云服务提供商在交付客户计费数据方面出现问题的情况屡见不鲜，导致在月末最终账单更正之前一段时间内数据不完整或不准确。这些数据问题经常导致问题——无论使用内部工具还是供应商提供的解决方案——在后处理中丰富云服务提供商计费数据。\n\
  \n为了检测计费数据问题，监控计费报告中数据质量非常重要。这使你能够在报告中呈现的数据出现问题时提醒员工。主动提醒员工有助于你保持对 FinOps 报告的信任。云服务提供商可以更改数据报告方式。虽然顶级云提供商今天提供了更多关于其报告结构的详细信息，并且经常发布有关即将发生更改的信息，但并非总是如此。我们见过云服务提供商修复计费数据中的不一致问题，这可能导致公司处理不一致数据的现有方法失效。\n\
  \nFinOps 报告基于查询构建，查询可能会错误处理特定事件。例如，年份变更，查询错误地处理日期滚动到下一年的情况，以及假设特定值存在的查询，这会意外过滤掉数据。验证查询不仅在你首次构建报告时很重要，而且在报告可用期间也很重要。这在采用他人创建的报告时尤其重要，无论是公司内部还是社区外部。了解这些报告底层使用的查询的局限性可以避免信息被误解或错误的情况。\n\
  \n如果你的用户发现报告中呈现的数据不正确或不一致，那么对报告的信任就会下降。这种信任的丧失可能导致工程师不作为，或出现大量未经授权的工具和报告，这些工具和报告通常与官方\
  \ FinOps 报告不一致，导致决策缺乏或基于错误数据做出决策。此外，不一致的报告会导致花费大量时间来调和差异并讨论正确性。\n\n的数据。FinOps 团队提供统一的云成本数据用户界面的目的，是为工程团队节省自行梳理这些细节所需的时间和精力。当他们不信任报告时，不仅成本节约可能消失，而且宝贵的工程工时也会流失。\n\
  \n正如 Diana Mileva 在她 2022 年 FinOps X 演讲中所说，“数据质量的单个报告被视为需要迅速调查的生产事故，包括向报告者持续沟通以及对任何实际问题的事后分析。通过这一过程，我们不断改进数据的质量，同时也让利益相关者信任我们认真对待数据质量问题。”\n\
  \n防止不良数据进入报告很重要，但有时这可能无法完全避免，因此建立能够检测数据问题并主动提醒用户的流程，有助于维持对报告的信心。\n\n## Perfect Is\
  \ the Enemy of Good\n\n数据质量并不意味着 100% 实时精确到微分钱。它意味着数据持续足够好，能够做出明智的决策。不可避免的是，由于上述一个或多个问题，你的报告中会出现一些错误或不准确之处。但\
  \ FinOps 团队的工作是采取措施——商业上合理的努力——以确保所呈现的数据一致、最新，并且具有足够的准确性来支持组织做出正确的决策。随着时间的推移，可以对可用信息的处理及时性、数据摄取和规范化流程、新增数据源以及查询优化进行调整。\n\
  \n> *Above all else show the data.*\n> —Edward R. Tufte\n\n## Report Tiering\n\n\
  你为团队构建以呈现数据的报告并非都同等有用或正式。有些报告是你依赖来代表官方分摊报告的，而另一些报告只是回答临时性问题。报告分层可以成为区分报告的有效方式。\n\
  \nDiana 继续分享：“内部我们将报告标记为受管或不受管。如果你想要临时构建的东西，我们会创建一个不受管报告并如此标记。于是会出现大量不受管且未保持更新的报告列表。例如，随着新的数据架构进入计费数据，查询可能需要更新，或者查询的编写方式仅针对当月。为了保持对报告的信任，请务必维护并标明哪些是受管报告，哪些是未维护的。”\n\
  \n成熟的 FinOps 实践可能会随着时间积累数百份 FinOps 报告，其中许多是在特定时间点创建的，以回答业务之前提出的问题。理想情况下，团队会持续策划一个更小且更集中的主要报告集合，代表其认为分布式团队应最关注的黄金标准。\n\
  \n## Stories from the Cloud—Jason Rhoades\n\nIntuit 的开发经理 Jason Rhoades 分享道：\n\n\
  我们不到十份官方报告，可以回答所有适合以图形报告方式回答的问题。这些报告中的数据通过筛选器缩小到相关方感兴趣的云部分。\n\n他继续指出，数据民主化是有帮助的，但有一些注意事项：\n\
  \n你不想成为对所有人封闭的孤岛；同时，开放也会带来风险，即数据使用者在构建其定制产品时会出现错误——甚至只是做出不同的决策——以至于你的 FinOps 团队被牵扯进来，不得不解释为什么\
  \ Team X 的定制报告中的数字与主流报告不同。\n\n这确实是一个风险，但应权衡这些团队可能发现或证明核心团队未曾想到或没有周期自行开发的新视角或能力价值的可能性。实质上是众包\
  \ FinOps 创新。\n\n当 FinOps 团队成为数据提供方时，应建立明确的责任边界，以限制在数据被误用或更确切地说是被消费团队误解时可能产生的责任。\n\
  \n随着报告集合的不断增长，用户将不清楚哪些报告重要、哪些是最新的，以及用户能否信任数据。通过明确标记你的报告，你可以引导用户了解各自的区别。\n\n理想情况下，你应为报告应用分层或分类系统，从标记创建日期并标注为未维护的低层报告，一直到用户可以轻松识别的高层生产报告，表明它们维护良好、质量受监控，并且用户可以信任它们。\n\
  \n为特定目的在特定时间点回答特定问题的临时报告是 FinOps 流程的重要组成部分。然而，你应努力不断删除不再相关或不再提供价值的旧报告。这样做可以降低员工找到错误报告并据此做出决策的可能性。\n\
  \n给员工一个特定报告的链接，下周他们会回来索要另一个报告的链接。给员工提供一份更新的生产报告列表的链接，他们将永远受用。这显然是对一个与钓鱼相关的常见谚语的改编，但它在思考如何引导员工使用你提供的\
  \ FinOps 数据时非常有用。虽然直接引导他们到有助于当前情况的报告是有帮助的，但确保他们也知道未来如何找到你的报告，将减少 FinOps 团队的支持负担。\n\
  \n## Rolling Out Changes\n\n随着时间的推移，你的报告需要发生变化：新数据将变得可用，而某些数据将变得无关紧要。下一节介绍通用报告，但有时你的报告可能需要拆分为两份。在未通知的情况下更改生产报告会影响你的\
  \ FinOps 实践，因为用户不会理解更改的原因、新数据代表什么，以及他们去哪里获取被移除的数据。\n\n手动更改生产报告存在使报告处于损坏状态的风险，其结果是用户会认为报告不可信并今后避免使用数据。拥有生产报告的暂存副本允许你测试拟进行的更改，并为你在对生产报告进行更改前为用户准备文档提供位置。随着更改的实施，让用户参与其中将确保他们理解如何继续使用你的报告。\n\
  \n理想情况下，你的 FinOps 报告可以通过 API 配置，或使用某种文件上传进行保存和恢复。这使你能够将报告配置存储在配置管理系统或代码仓库中。保留报告的先前配置，以便在更改未按计划进行时能够快速将报告恢复到已知良好的状态。\n\
  \n## The Universal Report\n\n随着报告数量的增长，实践者倾向于尝试将所有 FinOps 数据整合到我们所称的通用报告中——一份统御一切的报告。这份通用报告塞满了所有能容纳的数据，而不考虑其传达的信息或数据向用户呈现的清晰度。通用报告几乎总是难以阅读，这削弱了用户理解所传达信息的能力。这些报告通常对数据没有结构或组织，只是提供大量彼此之间没有关联的信息。\n\
  \n当数据点之间存在明确联系，并且有关于用户如何阅读和理解报告的故事时，合并报告是可以接受的。另一方面，你应审查你的报告并确定何时最好将报告拆分为两个或多个更清晰的报告，每个报告都更容易让用户理解。\n\
  \n\n\n设计新的 FinOps 报表时，尽量保持简洁。只包含必要的信息，并在实际可行的范围内尽可能进行汇总。你可能有数百列可添加的数据，但包含过多信息会使报表更难理解。或者，更好的做法是提供交互式报表，允许用户在需要时深入查看所需信息、添加更多上下文，或仅在个人需要时连接更多数据点。\n\
  \n当你构建交付给用户的报表与用户按需加载的报表时，这一点变得尤为重要。交付的报表会缺乏上下文，需要简短清晰地传达其信息。如果交付的报表复杂且信息过多，用户会将其存档以便有更多时间阅读，而事实上他们永远不会这样做。\n\
  \n> 杂乱和混乱是设计的失败，而非信息的属性。\n> —爱德华·塔夫特\n\n![](img/4d4736bc293fd892d1da81802d0f9520_149_0.png)\n\
  \n借助设置可提醒你变化的报表的能力，你可以创建监控意料之外情况的报表，例如你未使用的云产品产生的费用、未挂载的存储卷，或每日成本跳升超过设定百分比的情况。这些报表的通知功能意味着你无需每天检查其状态。相反，让报表来提醒你在需要阅读时通知你。\n\
  \nFinOps 报表最成功时，你识别出员工需要回答的常见问题并针对性地设计报表来回答这些问题。问问自己：“我用这份报表试图回答什么问题？”并确保报表实现了这一目标。同时，考虑员工使用报表所需了解的信息。例如，如果他们需要应用程序名称或成本中心编号，请确保引导用户先查看有助于获取这些信息的报表。\n\
  \n将你的报表想象成层蛋糕，最上层的报表使用所需信息最少，并仅提供足够的信息以便在下一层使用报表。随着用户向下移动报表层级，他们正在以更精细的粒度深入特定区域的更多细节。只有当用户需要额外细节来回答他们的问题时，才需要深入信息。\n\
  \n## 无障碍访问\n\n让你的 FinOps 报表对所有员工都可访问至关重要。在构建报表时，请考虑你无法向所有用户解释报表。如果同事阅读报表时你必须在场，那么你在组织内扩展\
  \ FinOps 将会困难。\n\n本节提供了 UI 中使用的一些常见设计指南，可帮助你的 FinOps 报表更实用。如果你的组织有专业的报表或 UI/UX 团队，他们可能还能为你提供已在使用的示例以进一步帮助。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_150_0.png)\n\n多年来，信息设计领域涌现了许多优秀书籍。我们推荐你阅读其中一本：《Envisioning\
  \ Information》（Graphics Press, 1990），作者 Edward Tufte，本章中多次引用了他的观点。\n\n## 颜色\n\n\
  在起草本书第一版时，我们犯的一个错误是撰写了引用文中图表颜色的内容。结果书要以黑白印刷，图表现在变成各种灰度，而内容却写着诸如“红色线条对比蓝色”。这种颜色的去除使许多图表变得不清晰，我们不得不重新设计它们并重写引用。虽然无彩色视—仅以黑白视觉—并不常见，但在较大组织中拥有某种形式色盲的员工是很可能的。因此，你应旨在使用不仅仅是颜色来表示报表中的不同元素。与其只有红蓝两条线，不如一条实线一条虚线。与其使用纯色柱状图，不如选择一种带条纹、另一种带圆点的样式。如果无法更改图表格式，最好将一个包含多个堆叠项目的图表改为两个单独的图表。\n\
  \n## 视觉层次\n\n在报表和仪表板中布局内容时，将相关项目放在一起。围绕相关内容设置视觉边框，并在间接关联的内容之间划清界限。考虑内容布局方式将使你的报表对受众更直观易读。\n\
  \n你应考虑报表上信息的视觉层次安排，其中汇总信息通常位于顶部或左侧，而更详细—或较不重要—的信息位于下方或右侧。\n\n## 易用性和一致性\n\n用户会迅速放弃难以交互且缓慢的报表和仪表板—这增加了在组织内实施\
  \ FinOps 的挑战。随着你构建报表和仪表板集合，力求保持性能和一致性，使员工更容易理解如何使用它们。\n\n## 语言\n\n第 4 章介绍了 FinOps\
  \ 的语言。在讨论 FinOps 时在报表中使用相同的术语将保持一致性。不要在报表之间更改术语或使用不清晰的术语，导致用户询问你的本意。我们经常看到 FinOps\
  \ 从业者在创建报表时使用术语 cost 存在不一致。正如我们在第 4 章提到的，这可能是未混合成本、摊销成本或完全加载成本中的任何一种。\n\n## 颜色和视觉表示的一致性\n\
  \n需要使用除颜色之外的区分方式并不排除使用颜色。但应力求在颜色和视觉表示的使用上保持一致。当你在一个图表中将节省显示为绿色虚线，而在下一个图表中用实心蓝线表示节省时，读者不会清楚两者代表相同事物。更糟的是在不同项目间跨图表使用相同的颜色/线型，迫使用户仔细查阅每个图表的图例来确定是什么。同一报表内或\
  \ FinOps 报表套件中的不一致会让员工误读信息并随着时间侵蚀信任。\n\n## 识别与回忆\n\n当数据一起呈现时，用户更容易识别离散信息之间的联系。如果你呈现的信息引用了屏幕外或另一份报表中的数据，你就迫使员工回忆之前呈现的信息，导致他们滚动查看或在报表间切换以提醒自己数值。相关信息的分离会使读者更难将其联系起来。这种联系对于长报表或大型仪表板至关重要。你应尽量将相关项目放在一起，不要迫使用户回忆其他地方呈现的信息。如果你确实需要引用其他地方呈现的信息，应重复关键信息或协助将其链接回正确位置。\n\
  \n> 比较必须在视域范围内强制进行，这是一个在实践中偶尔被遗忘的基本要点。\n>\n> —爱德华·塔夫特\n\n你可能会发现相同的三个顶部汇总框出现在你制作的许多不同仪表板上，因为某些汇总级信息始终作为起点相关，但随后在较低层级出现的表格或数字会因不同角色或业务目的而有所不同。\n\
  \n## 心理概念\n\n《如何赢得朋友和影响他人》（Simon and Schuster）一书的作者戴尔·卡耐基说，“与人交往的成功取决于对他人观点的同情性理解。”\
  \ FinOps 在很大程度上是关于在正确的时间以正确的方式提供正确的信息，以影响和鼓励他人的行为。\n\n为易用性设计报表很重要，但考虑报表中包含的信息也会影响用户从中获得的内容。认知行为或认知心理学领域在过去\
  \ 20 年里蓬勃发展，让我们越来越了解人类常见的偏见和行为，以及如何应用技术来利用（或缓解）这些偏见。\n\n明确地说，这不是一章关于如何用认知行为科学 trick\
  \ 人做事的，而是关于理解人们在阅读你的 FinOps 报表时因为他们是人而会有的一些偏见，以及如何围绕这些偏见设计或以决策者不会陷入众所周知的认知陷阱的方式呈现信息。\n\
  \n让我们看看如何将一些心理理论应用于使你的 FinOps 报表更有效。\n\n## 锚定偏差\n\n当某人对信息思考或解释出现错误时，*认知偏见*通常在起作用。*锚定偏差*，或*锚定效应*，是一种认知偏见，其中早期向用户呈现的信息会影响他们后来对其他信息的感知。摘自维基百科：\n\
  \n> *锚定效应*是一种认知偏见，其中个体的决策受特定参考点或“锚点”影响。例如，如果一辆车与更昂贵的车型（锚点）并列展示，个体更可能购买它。谈判中低于锚点的价格可能看起来合理，甚至对买家来说很便宜，即使这些价格仍相对高于汽车的实际市场价值。\n\
  \n你当地的零售商经常使用这种方法。每次你进入商店看到那台价格几乎不切实际的昂贵电视时，这就在你的脑海中锚定了什么是昂贵，因此你更可能购买的其他电视相比之下看起来都是超值优惠。\n\
  \n\n\n考虑一份向工程团队展示其服务成本的报告（见图 8-2）。在报告开头，你列出了整个组织中最昂贵的 10 项服务，这会让工程师以这些最昂贵服务的成本为锚点，并可能影响他们对自己服务的看法。\n\
  \n### 每周 FinOps 报告\n\n| 服务名称 | 每周成本 |\n|---|---|\n| Application 1 | $10,000 |\n\
  | Application 2 | $8,000 |\n| Application 3 | $7,500 |\n| Application 4 | $6,300\
  \ |\n\n### 团队 A - 服务成本\n\n| 服务名称 | 每周成本 |\n|---|---|\n| Application 5 | $2,000 |\n\
  | Application 6 | $560 |\n| Application 7 | $200 |\n| Application 8 | $1,250 |\n\
  \n图 8-2. 示例每周 FinOps 报告，供团队展示\n\n仅展示其服务的成本，而不包含其他团队的支出，将有助于避免这种偏差，并让你的团队更公平地评估其服务的成本。\n\
  \n尽管添加这些额外信息可能是出于提供信息的意图，但为了实现报告的预期效果，你应考虑所需的信息，并评估添加可能锚定用户的额外数据点的影响。\n\n## 确认偏误\n\
  \n另一种认知偏误是确认偏误。用户从你的报告中寻找信息，并以支持其先前信念的方式进行解读。来自维基百科：\n\n> 确认偏误是指以证实或支持个人先前信念或价值观的方式搜索、解释、偏好并回忆信息的倾向。人们在选择支持其观点的信息而忽略相反信息时，或在将模糊证据解释为支持其现有态度时会表现出这种偏误。\n\
  \n在不同报告中提供信息会让用户选择支持其思维的报告。一致性和识别可以帮助抵消确认偏误。\n\n避免通用报告设计也能遏制确认偏误，因为它让每份报告或仪表板都聚焦于特定问题，而不是提供\
  \ 10 或 20 个数据点让用户从中寻找一些好消息来关注。\n\n例如，一份包含可能需要调整大小的 40,000 个计算资源并按应用团队分组的报告，几乎让任何人都能找到做得比自己差的人。另一份题为“Resources\
  \ [Yourteam] Should Consider Rightsizing as Soon as Possible”，列出前 5 或 10 个可节省资金的资源，提供了一份无人能否认的清单。\n\
  \n## 冯·雷斯托夫效应\n\n与人们如何回忆信息相关的另一种心理理论是冯·雷斯托夫效应，也称为分离效应。来自维基百科：“The Von Restorff effect,\
  \ also known as the ‘isolation effect,’ predicts that when multiple homogeneous\
  \ stimuli are presented, the stimulus that differs from the rest is more likely\
  \ to be remembered.”\n\n当呈现一组项目时，与其他项目不同的那个项目更有可能被记住。应用于你的 FinOps 报告时，最有可能被员工记住的是最大或最小的项目（见图\
  \ 8-3 示例）。或者，如果你的某个图表使用独特的配色或样式，它在记忆中会比其他图表更突出。\n\n| 服务名称 | 每周成本 | 与上周差异 |\n|---|---|---|\n\
  | Application 8 | $1,250 | +1,000 |\n| Application 6 | $560 | +$50 |\n| Application\
  \ 5 | $2,000 | +$15 |\n| Application 7 | $200 | -$25 |\n\n图 8-3. 包含每周差异的服务成本\n\n\
  如果你向工程师展示一份显示其服务成本的报告，并且只显示每项服务的当前每周支出（如图 8-2 所示），那么工程师会记住成本最高的服务。相反，如果你还包括每项服务环比增长的金额，你就可以影响工程师回忆增长最快的服务。利用这种效应，你可以引导工程师在阅读报告时朝着你想要实现的结果发展，即关注增长最多的项目。\n\
  \n## Hick’s Law\n\n为了帮助员工做出决策，你的报告通常会呈现多个选项供其决定。希克定律是一个简单的概念，指出随着呈现的选项数量增加，决策时间也会增加。来自维基百科：\n\
  \n> 希克定律描述了由于可能的选择而导致一个人做出决策所需的时间：增加选择数量会使决策时间呈对数增长。希克-海曼定律评估选择反应实验中的认知信息容量。在希克-海曼定律中处理一定数量比特所需的时间被称为“信息获取率”。\n\
  \nFinOps 中的优化报告通常会包含一些供工程团队考虑的替代建议。你应力求只呈现最有可能被选中的最佳建议。\n\n考虑一个具有多个选项的建议。\n\n其中两个选项只会导致云成本略有降低，另一个则是对工程师而言的高风险变更。移除无效的项目可将工程师需要考虑的总项目数从五个减少到两个，很可能导致更快决策。在图\
  \ 8-4 中，AWS Compute Optimizer 控制台限制了向用户展示的建议数量，并显示价格差异和性能风险以帮助工程师做出决策。保持建议数量最少还有额外好处，即减少工程师阅读所有选项所需的时间，并可提高生产力。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_155_0.png)\n\n图 8-4. AWS Compute Optimizer\
  \ 控制台，显示用于调整 EC2 实例大小的建议\n\n![](img/4d4736bc293fd892d1da81802d0f9520_156_0.png)\n\
  \n希克定律及其对选择的隐含限制与 FinOps 基金会框架能力相契合：建立 FinOps 决策和问责结构。诸如将推荐何种优化（仅节省超过某一阈值的优化、仅针对这些类型资源的优化、仅针对已达到一定效率水平的团队的优化、仅针对低于最低效率阈值的资源的优化等）的政策决策，为最小化\
  \ FinOps 团队呈现的选项提供了模型，并提供了选择或排除某些选项的原因的透明度。\n\n## 关于报告的视角\n\n在评估你的 FinOps 报告集合的设计时，请考虑本节讨论的视角。它们将有助于确定报告的预期成果，并影响你需要包含的基本要素。\n\
  \n### 人物角色\n\n与本章前面讨论的通用报告概念相反，请考虑何时最好拥有以人物角色为中心的报告，为组织内的特定角色提供所需细节，而不是试图制作一份能回答所有人物角色所有问题的单一报告。例如，将领导层报告——将具体细节汇总为\
  \ FinOps 在组织内表现的高层概述——与工程师用于跟踪其个人服务成本的报告区分开来。这使你能够构建更有针对性的报告，最有效地推动 FinOps 成果。至关重要的是，这些报告在指标定义和语言方面保持一致。如果你的某份报告显示某个指标偏离轨道，另一份报告应反映该指标的相关改进机会。\n\
  \n### 成熟度\n\n随着你的 FinOps 实践成熟，可报告的信息量将迅速增长。随着你实施 FinOps 基金会框架的更多能力，你将增加需要跟踪和报告的更多成功衡量指标。进一步能力的增加也会增加员工需要执行的额外功能活动。依靠你的报告来了解何时需要完成任务，并衡量执行任务所带来的成果。\n\
  \n此外，随着你对云服务的采用增加，需要呈现的信息量也会增加。团队通常专注于核心云服务，例如计算、数据库和存储，但随着组织云成熟度的提高，\n\n预计会看到团队使用的更长的云原生服务列表，例如函数即服务（FaaS）、机器学习（ML）或更高级别的应用服务。这些新增的服务将引入不同的计费结构。有些按时间计费，如每秒或每月；其他则按数量收费，甚至两者兼有。云账单中使用的服务越多，报告云成本的任务就越复杂。\n\
  \n## Multicloud\n\n随着组织开始大量使用多个云服务提供商，您的 FinOps 团队可能会从单独的报告开始，尤其是如果您选择使用每个单独云服务提供商的计费工具。虽然主要云服务提供商使用的许多术语和概念在功能上相似，但在命名约定和服务分类方面存在差异，这可能会令人困惑，并且某些元素是特定云服务提供商独有的。关于云中标签和元数据结构差异的良好分析可在第\
  \ 12 章找到。\n\n将不同云的数据分开会迫使用户在各种环境之间回忆信息并自行关联相似概念。正如 Edward Tufte 所说，“比较必须在视域范围内强制执行。”\n\
  \n> 比较必须在视域范围内强制执行。\n\n为了减少与多云报告相关的努力和困惑，最好将云数据合并到一致的报告中，在这些报告中，连接信息的复杂性已得到正确处理。为实现这一点，您可能需要超越原生工具，使用内部或外部供应商工具。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_157_0.png)\n\n数据摄取和规范化是 FinOps Foundation\
  \ Framework 的基础能力，用于实现其他能力。有效的 FinOps 实践需要访问定期流的详细使用、利用率和成本数据，这些数据可以分类和分析以推动决策。监控平台、安全平台和业务运营应用程序也可以提供数据，用于告知利用率、位置、价值和使用情况，通常在相似的量级和粒度水平上。随着数据复杂性和多样性的增加，数据摄取和规范化挑战也在增长。在确定如何处理您自己的数据时，请务必查看框架中与此必需能力一起提供的成功衡量标准。\n\
  \n## Putting Data in the Path of Each Persona\n\nFinOps 数据对于最大化云支出价值是必需的，不幸的是，它通常隐藏在孤立的\
  \ FinOps 特定报告和工具中。当这些报告被遗弃在日常工作流程之外的仪表板中时，它们会被最需要它们的工程团队、业务领导者和财务团队所低估。为了抵消这一点，目标是*将数据置于*每个角色已建立的工作方式的路径中。\n\
  \n## Data in the Path of Finance\n\n首先看到某种形式 FinOps 数据的角色通常是财务团队。这源于共同的兴趣，因为财务希望将云支出数据添加到其已建立的财务报告系统中。云支出首先与公司采购订单关联，以帮助将支出分配到正确的预算中。将\
  \ FinOps 数据纳入财务系统允许您现有的财务流程与汇总的云支出一起工作，并减少与财务团队的摩擦，这些团队拥有通常无法偏离的完善的报告和审计要求。\n\n\
  ## Data in the Path of Leadership\n\n领导层和执行报告也应包含 FinOps 数据，显示云支出数据与现有业务指标的关系。为了让业务领导者做出决策，请确保关于云支出、节省和机会的关键信息出现在他们习惯消化的其他数据中。将\
  \ FinOps 数据与其他业务数据分开会强化 FinOps somehow 与业务其他部分脱节的错误认知。正如我们在 *第26章* 中将要介绍的，您应在领导层报告中提供\
  \ *单位经济指标*，将云支出与业务指标结合起来，以展示云使用对业务的价值和影响，而不仅仅是成本。\n\n## Data in the Path of Engineers\n\
  \n最后，但可能也是最重要的，我们强烈建议您努力将 FinOps 数据带入工程师的工作路径中。当您的工程师开始思考 FinOps 时，这不应是对他们完善的日常习惯的巨大偏离，即，您不希望他们远离做\
  \ DevOps 而花费时间 *做 FinOps*。理想情况下，它成为一个连贯流程中集成且必需的工作。\n\n我们经常说，*成本只是另一个效率指标*。工程团队将拥有专注于大量关键指标的仪表板和仪式。这些仪表板将监控安全、性能和可靠性指标，以成功管理在云中运行的服务。目标是将关键\
  \ FinOps 数据添加到这些现有位置和系统中。将他们需要开始考虑云支出变化的数据——例如实际值与预测值以及降低成本的机会——引入到他们持续的冲刺计划中。孤立的\
  \ FinOps 数据和对话会造成认知负担和分心，这不可避免地导致仅在强制要求时才发生的被动成本工作。因此，工程师会将 FinOps 任务视为对他们工作的中断，而不是工作的一部分。\n\
  \n在开发生命周期的早期以及现有流程中引入 FinOps 数据，可以鼓励他们在设计新架构或改进代码的每一步都考虑成本。工程师需要为 FinOps 活动分配适当的时间，以实现业务在云效率方面的期望成果。\n\
  \n## Connecting FinOps to the Rest of the Business\n\n> 倾听不仅仅是在对方说话时保持安静，直到你可以说出你想说的话。\n\
  > —Krista Tippett，记者\n\n而不是重新发明轮子，很可能已经存在负责财务、执行和工程报告的团队，FinOps 团队可以与他们合作以整合自己的数据。这提供了教育这些角色了解\
  \ FinOps 并继续打破组织内部学科壁垒的机会。它还提供了一个重要的接触点来解决本章前面讨论的 UI 概念，确保语言一致且数据以鼓励行动的方式呈现。这些现有团队通常擅长使用\
  \ API 提取和处理复杂数据，使其成为可读且一致的报告。\n\nData in the Path 概念背后的想法并不是将整个 FinOps 世界塞入每个人报告的中间。只带来使\
  \ FinOps 所需的针对性对话和决策成为可能的关键信息，而不会中断当前仪式。当由此信息引发需要更深入报告和分析的问题时，那就是将员工连接到您 FinOps\
  \ 工具库中可用的更详细报告的时候。\n\n您的工作是确保每个团队都拥有真正理解云消耗数据的背景，并在面对数据时做出正确的假设，从而为业务带来正确的行动。无论原始数据与其他工作流程的集成程度如何，都只能从中获得有限的信息。\n\
  \n## Seek First to Understand\n\n看到优化建议或某种效率评分数据时，可能会诱使人假设该基础设施的所有者没有考虑成本、忽视效率或只是恶意行为者。不要做假设，而是使用\
  \ FinOps 数据开启一次无指责的对话，先寻求理解决策，然后再尝试影响它们。\n\n\n\nKim Wier，Target 的效率工程总监，很好地运用了这一模式。她的中央\
  \ FinOps 使能团队会前往各个工程团队，请他们说明资源的高效使用应是什么样子。“询问他们希望如何查看效率指标很重要，”她说。“工程师希望在符合 Target\
  \ 最佳利益的前提下，尽可能充分地利用其基础设施。”然后她可以提供与该特定团队业务目标相一致的相关 FinOps 数据。Kim 继续说道，“我们旨在根据平台合作伙伴认为对平台重要的内容输出建议。如果我们提出建议，而工程团队有充分理由无法执行，那么我们希望这种反馈循环能够重新纳入我们的建议中。”\n\
  \n## Stories from the Cloud—Jason Rhoades\n\nFinOps 的 UI/UX 并非总是只读的。报告和仪表板中的信息通常从数据源流向终端用户，但终端用户也可以向系统反馈信息。\n\
  \nIntuit 的开发经理 Jason Rhoades 分享道：\n\n> 对于 Intuit 来说，一个重大的演进步骤是超越报告的只读概念，引入涉及终端用户执行写入操作的\
  \ FinOps 相关工作流程。这些可能像进行审批工作流以将某些云浪费从报告中排除/隐藏一样简单。或者是两个业务单元组之间为新的交叉计费而签订的合同，这会影响报告的结构。或者是团队为预测和对账目的调整他们如何共同分配云资产。当我们开始超越简单的报告以实现此类功能时，我们发现可以更全面地解决更多问题。但这确实需要扩大中央\
  \ FinOps 团队并增加一些新的技能，以实现更具交互性和迭代性的报告能力。\n\n这与 Noel Crowley 在 FinOpsPod 上从 Fidelity\
  \ 描述的、由不成熟实践最常采用的 flawed 方法相悖：“通常发生的情况是，FinOps 团队从其原生或平台工具中获取优化建议并交给团队，试图让他们采取行动。接收这些建议的人随后会以各种理由反驳，称这种变更在业务上不合理，例如说‘是的，我可以进行\
  \ rightsizing，但我不这么做，因为 XYZ。’”相反，Kim 在 Target 的做法使她的工程合作伙伴能够引导她找到对其业务部分最有意义的解决方案，而不是试图对所有人强加一种无效的标准化方法。\n\
  \n## Conclusion\n\n你创建的报告和仪表板是构建协作式 FinOps 实践最重要的工具之一。通过将报告视为 FinOps 的 UI，你可以使用常见的\
  \ UI 设计考量，使其更有效地传达正确的信息，从而促成积极行动。\n\n总结如下：\n\n- 将你的报告和仪表板视为生产环境，任何变更在部署前都需在暂存环境中进行测试。\n\
  - 报告和仪表板的质量可信度对 FinOps 成功至关重要。\n- 报告的一致性可避免混淆或确认偏误。\n- 考虑会影响报告查看方式的条件。\n- 仔细选择在报告中呈现的信息，以最好地影响你想要的结果。\n\
  - 根据目标受众的视角设计报告。随着云之旅的推进，重新评估之前做出的设计决策。\n- 为了使 FinOps 成为业务文化的一部分，将 FinOps 数据纳入工程师、财务和领导层使用的现有报告和仪式路径中。\n\
  \n本书第一部分到此结束。我们通过介绍 FinOps、你为什么需要它、它如何需要文化转变、云账单提供哪些洞察、FinOps 基金会框架以及最后 FinOps 的\
  \ UI 来奠定基础。第二部分进入有趣的部分：在你的组织内实施 FinOps 生命周期。\n"
- '## PART II


  ### Inform Phase


  现在你已经了解了 FinOps 的基础知识，是时候进入有趣的部分了。在本部分，我们将介绍 FinOps 生命周期中的告知阶段，带你了解成本分配、预测、账单变化的呈现以及优化性能监控的细节。这是生命周期的阶段，它推动团队的问责制，并为你设定未来改进目标做好准备。

  '
- "## The FinOps Lifecycle\n\n回到第 1 章，我们讨论了 FinOps 的核心原则。这些原则非常有助于指导行动，而在第 7 章我们讨论了\
  \ FinOps 框架，它是基于这些原则构建的。本章涵盖 FinOps 生命周期中持续迭代的阶段，以及如何将其应用于 FinOps 的能力。这些原则自本书第一版以来变化不大。但我们看到许多不同的公司和组织开始在其基础上构建和迭代，使其成为自己的东西。就像\
  \ FinOps 框架一样，它是一组可根据组织相关需求以各种方式组装的构建模块，这些原则也是开源的基础，供你组装并为你的组织构建 FinOps 计划。\n\n\
  ### The Six Principles of FinOps\n\n再次说明，原则如下：\n\n- 团队需要协作。\n- 决策由云的业务价值驱动。\n- 每个人都对其云使用负责。\n\
  - FinOps 报告应易于访问且及时。\n- 一个中央团队推动 FinOps。\n- 利用云的可变成本模式。\n\n让我们看看每个原则在实际操作中如何体现及其现实影响，后面我们将深入探讨特定框架能力是如何设计来利用它们以实现特定结果的。\n\
  \n### #1: Teams Need to Collaborate\n\n首先，FinOps 是一种文化变革，重点在于打破历史上从未紧密合作的团队之间的壁垒。当执行良好时，财务团队使用与云的速度和粒度相匹配的语言和报告，产品经理根据新功能带来的预期收入微调其应用扩展预测，而工程团队则将成本视为新的效率指标。\n\
  \n与此同时，FinOps 团队致力于持续改进商定的效率指标。他们帮助定义云使用的治理和参数，提供一定的控制，但首先关注确保创新和交付速度能够与成本效率并存地蓬勃发展。\n\
  \n将无责文化添加到这一原则中，使公司能够从错误中学习。去掉为成本超支寻找个人/团队归咎的需要，使事后分析可以专注于如何避免未来的超支，以及组织需要做出哪些改变来从此次事件中学习。\n\
  \n> *If a culture of finger pointing and shaming for “doing” the wrong thing prevails,\
  \ people will not bring issues to light for fear of punishment.*\n> —Betsy Beyer\
  \ et al., Site Reliability Engineering (O’Reilly)\n\n### #2: Decisions Are Driven\
  \ by the Business Value of Cloud\n\n首先思考云支出的业务价值，而非成本。将云视为成本中心很容易，尤其是在支出达到实质性水平时。云是价值创造者，但使用越多，成本越高。FinOps\
  \ 的作用是帮助最大化该支出所创造的价值。不要专注于每月的成本，而应专注于每项业务指标的成本，并始终以业务价值为导向做出决策。\n\n### #3: Everyone\
  \ Takes Ownership of Their Cloud Usage\n\n云成本基于云使用，这存在直接的相关性：如果你在用云，你就会产生成本，因此对云支出负责。通过将云支出问责制推向组织边缘，直至个人工程师及其团队，拥抱这一事实。并为他们提供信息和指导，使其能够为组织完成这项重要工作。\n\
  \n### #4: FinOps Reports Should Be Accessible and Timely\n\n在按秒甚至微秒计费的计算资源、无限云存储、共享\
  \ Kubernetes 集群、自动化部署以及可能因外部控制触发器产生成本的服务的世界里，按月或按季度报告云支出是不够的。实时决策关乎获取\n\n数据——例如支出变化或异常警报——应迅速传达给部署和管理云资源的人员。\n\
  \n如第 8 章所述，FinOps 数据应置于做出基础设施决策的人员的工作路径中，让他们在无需额外查找的情况下就能获得所需的信息。实时决策使这些人员能够建立快速反馈循环，从而持续改进支出模式、做出明智决策并提高效率。\n\
  \n坚持不懈地关注干净的数据以驱动决策。FinOps 决策应基于完全加载且分配正确的成本。成本应摊销以包含承诺计划中作为预付款的部分，并应反映公司为云资源支付的实际折扣费率。它们还应公平地计入共享成本并映射到企业的组织结构。没有这些对支出数据的调整，你的团队将基于错误的数据做出决策并阻碍价值创造。\n\
  \n## 5: A Centralized Team Drives FinOps\n\n文化变革最好有旗手引领。中央 FinOps 职能通过教育、标准化和布道将最佳实践带入组织。这个中央团队是你找到能够通过倡导和教育改变文化的主题专家的地方。FinOps\
  \ 团队通过更好的工具改进可用数据，并修改使组织能够进行 FinOps 的业务流程。通过集中化，你可以最大化费率优化工作的成果，这给予边缘团队自由来最大化使用优化的成果。请记住，最成功的公司将“使用更少”的责任下放，将“支付更少”的责任集中。\n\
  \nFinOps 从业者使用性能基准测试来提供组织表现如何的背景信息。云性能基准测试为公司提供其表现如何的客观证据。基准测试让团队知道他们是否花费正确，或者是否可以花得更少、花得不同或花得更好。公司应同时使用内部基准来确定各个团队在优化等关键领域的比较情况，以及基于行业标准的外部基准来将公司整体与其他类似公司进行比较。\n\
  \n## 6: Take Advantage of the Variable Cost Model of the Cloud\n\n在云的去中心化世界中，容量规划从前瞻性的“为了满足需求你需要什么？”视角转变为实时的“在已使用资源的基础上如何保持在预算内？”视角。不要基于可能未来的需求来购买容量，而应基于实际使用数据来确定资源调整、批量折扣以及\
  \ RI/SP/CUD 的购买。由于你始终可以购买更多容量来满足需求，因此重点变为充分利用当前使用的服务和资源，并尽可能长时间地使用尽可能少的资源。\n\n随着你的云实践成熟，力求利用随需求扩展的云原生服务以及诸如\
  \ spot instances 等可在需要时利用低成本资源的模式。\n\n## The FinOps Lifecycle\n\n现在我们已详细说明了核心原则，让我们探讨它们如何在三个不同阶段中实施：inform、optimize\
  \ 和 operate（见图 9-1）。这些阶段并非线性——你应计划不断循环往复：\n\n- 1. The *inform* phase gives you the\
  \ visibility for allocation and for creating shared accountability by showing teams\
  \ what they’re spending and why. This phase enables individuals who can now see\
  \ the impact of their actions on the bill.\n- 2. The *optimize* phase empowers your\
  \ teams to identify and measure efficiency optimizations, like rightsizing, storage\
  \ access frequency, or improving RI coverage. Goals are set upon the identified\
  \ optimizations, which align with each team’s area of focus.\n- 3. The *operate*\
  \ phase defines and implements processes that achieve the goals of technology, finance,\
  \ and business. Automation can be deployed to enable these processes to be performed\
  \ in a reliable and repeatable manner.\n\n![](img/4d4736bc293fd892d1da81802d0f9520_168_0.png)\n\
  \nFigure 9-1. The FinOps lifecycle\n\n生命周期本质上是一个循环，永不完成。最成功的公司采取渐进改进的方法，每次循环都变得更好一些，通过重复和实践建立肌肉记忆。\n\
  \n在生命周期的每个阶段，你将根据云支出状态和 FinOps 实践采取行动并执行活动。第 7 章介绍了 FinOps Foundation Framework，该框架描述了\
  \ FinOps 运营模型的这些方面。我们用花园的比喻来描述这一点，你将根据花园当时的状态调整每天需要完成的任务——浇水、覆盖和除草。\n\ninform 阶段是你查看\
  \ FinOps 花园状态的地方。optimize 阶段是你查看哪些能力具有可执行的操作以使 FinOps 花园更健康的地方。而 operate 阶段是你将在组织环境中执行这些操作以确保花园繁荣的地方。\n\
  \n一些能力非常适合生命周期的某个阶段，而其他能力可能在多个或所有阶段中使用。\n\n让我们回顾每个阶段以及你在循环生命周期时将采取的一些行动。需要注意的是，你不会在每次循环中执行所有操作。第\
  \ 1 章介绍了 Prius 效应，它将实时反馈循环转化为数据驱动的决策。同样，每次循环都应以最新数据为依据，专注于当时所需的最少且最重要的活动集合。\n\n\
  ### Inform\n\ninform 阶段是你开始了解成本及其驱动因素的地方。通过以接近实时的基础向团队提供成本可见性，你可以推动更好的行为。在 inform\
  \ 阶段，你获得云支出的可见性，深入到细粒度的成本分配，并建立共同问责制。团队通过使用各种基准和报告了解他们在哪些服务上花费了多少钱以及为什么。首次，个人可以看到其行为对账单的影响。\n\
  \nSome of the activities in this phase include:\n\n- *Map spending data to the business*\n\
  \  在实施准确的成本分摊之前，你必须正确地将支出数据映射到按成本中心、应用程序和业务单元划分的组织层级。工程团队设置的标签和账户通常与财务团队需要的世界观不一致，也未包含高管所需的适当汇总。\n\
  - *Create showback (and other) reporting*\n  为了将支出问责制推向组织的边缘，你必须通过回溯或类似的成本分摊模型向每个团队展示他们的支出。这种可见性是推动支出所有权并最终从中获得最大价值的基本构建块。\n\
  \n### Define budgets and forecasts\n\nFinOps 团队应提供团队生成不同项目云使用量预测并为每个项目提出预算所需的数据。这些预算和预测应考虑云架构的所有方面，包括云原生服务、容器和相关成本。按预算管理团队让你知道何时需要介入提供优化或支出补救帮助。它还有助于就支出为何发生变化展开对话。\n\
  \n支出预测应针对每个团队、服务或工作负载基于完全加载的成本和正确分配的支出进行，并能够根据历史和成本基础等不同输入对预测变化进行建模。\n\n### Define\
  \ your account strategy\n\n组织分发和使用 AWS 账户、Google Cloud 项目、Azure 订阅/资源组或其他层级分组的方式将对成本分配能力产生重大影响，而该能力是\
  \ inform 阶段的关键能力之一。通过以一致且逻辑的方式分发账户，使其可作为成本边界使用（如同用于安全、资源和其他技术目的一样），可以完成大量成本分配的繁重工作。\n\
  \n### Set tag strategy and compliance\n\n你的元数据策略（标记和标签），将在后面更详细地介绍，既是一门艺术也是科学。即使拥有强大的账户层级，尽早就支持性标签策略达成一致以实现更细粒度也是至关重要的。如果没有这一点，标签定义就会留给大众（或被忽略），标签泛滥会迅速使任何标签都无法使用。\n\
  \n### Identify untagged (and untaggable) resources\n\n有两种类型的组织：那些拥有未标记资源的人和那些自欺欺人认为自己没有的人。将未标记资源分配给团队或工作负载——并对不可标记的资源应用分配的元层——对于正确的成本分摊、可见性和后续优化至关重要。\n\
  \n### Allocate shared costs equitably\n\n如支持和共享服务等共享成本应按适当比例分配给责任方。有几种方法可以做到这一点，包括平均分摊或根据支出或计算小时数等使用指标进行分配。将它们留在中央成本池中通常不太理想，因为团队\
  \ then 看不到其应用程序的真实成本。\n\n\n\n## 动态计算自定义费率和摊销\n\n准确的支出可见性要求公司考虑任何自定义谈判费率，应用来自 RIs/SPs/CUDs\
  \ 的折扣，并应用来自 RIs/SPs/CUDs 的预付款摊销。这确保团队跟踪正确的支出数字，并且不会在财务团队的账单与日常支出报告不匹配时感到意外。\n\n\
  ## 分析趋势和差异\n\n识别支出驱动因素通常需要对时间段进行临时比较，并且能够从高层级（如成本中心）一直报告到资源（或容器、函数等）层面，以了解成本驱动因素。\n\
  \n## 创建记分卡\n\n记分卡让 FinOps 团队衡量不同项目团队在优化成本、速度和质量方面的表现。它们是快速查找可改进领域的方式，应使用前面提到的完全加载且正确分配的成本来进行。\n\
  \n## 对标行业同行\n\n在内部记分卡概念的基础上，更先进的 FinOps 团队将其基准测试扩展到与其他行业同行层级的支出数据进行比较，以使用一组规范化的支出特征来识别其相对效率。\n\
  \n## 识别异常\n\n异常检测不仅仅是识别费用阈值——识别使用量的异常峰值也很重要。鉴于云服务提供商提供的可变收费服务种类急剧增加，监控支出任何偏差的异常检测有助于您找到可能需要快速补救的“大海捞针”。\n\
  \n## 优化\n\n优化阶段识别对云的改进措施并为即将到来的运营阶段设定目标。成本规避和成本优化目标在此阶段发挥作用，其中成本规避是首要优先事项。\n\n需要流程来设定和跟踪近实时业务决策，以使组织能够优化其云。我们还将研究云服务提供商提供的可帮助降低云成本的服务。此阶段包括以下活动：\n\
  \n### 分析 KPI 并设定目标\n\n在优化阶段，您会查看 KPI 并设定逐步实现它们的目标。通过了解整体想要实现的目标，您可以设定中期步骤目标以逐步实现。这在优化阶段很有帮助，因为它有助于界定您发现的机会并记录下来，以便在后续运营阶段采取行动。\n\
  \n### 查找并报告未充分利用的服务\n\n一旦团队可以看到其正确分配的支出和使用情况，他们就可以开始在所有主要的支出驱动因素（例如计算、数据库、存储或网络）中识别未使用的资源。您可以根据生成的建议衡量潜在节省，以消除未使用的东西、扩展周期性使用的东西、调整长期尺寸不合适的资源，或重新设计运行不佳的东西。\n\
  \n### 评估集中式基于承诺的折扣选项\n\n作为成本削减措施，FinOps 团队可以评估现有 AWS/Azure RIs、AWS SPs 或 Google\
  \ Cloud CUDs/灵活 CUDs 的指标，以确保已有的资源得到有效使用，然后寻找购买更多（或出售或修改现有资源）的机会。他们跟踪承诺和预留，分析整个企业范围内的投资组合，以核算和了解使用效率和成本规避实际效果，同时还能看到即将到期的情况。\n\
  \n## 运营\n\n优化阶段设定改进目标，而运营阶段则建立实现这些目标的行动流程。此阶段还强调流程的持续改进。一旦自动化到位，管理层会退一步确保支出水平与公司目标保持一致。这是一个很好的时机，与其他\
  \ FinOps 团队成员讨论特定项目，以确定团队是否应做出一些更改。运营阶段进行的活动包括以下内容：\n\n### 向利益相关者交付支出数据\n\n创建第一章中讨论的\
  \ Prius 效应要求利益相关者定期了解他们与预算的跟踪情况。每日或每周的可见性为他们提供反馈循环，使他们能够为业务做出正确的决策。在运营阶段，您关注这些报告如何交付给利益相关者，建立生成报告并使其可用的流程和自动化。\n\
  \n### 进行文化变革以与目标保持一致\n\n团队接受教育并获得授权，以理解、核算并与组织内其他团队合作以推动创新。财务团队获得授权成为大胆的变革推动者，从阻碍投资转向与业务/技术团队合作以鼓励创新。每个团队必须不断迭代地提高对云的理解并提升其报告效率。\n\
  \n### 调整实例和服务规模（或关闭它们）\n\n在优化阶段，您可能会发现自己为不需要的更强大的计算资源付费。生成的建议在运营阶段得到执行。工程师审查建议，并在适当情况下进行调整——例如，切换到功能较弱、成本较低的实例；用更小的尺寸替换未使用的存储；或使用更符合访问需求的不同存储层级。成熟的\
  \ FinOps 团队会在所有主要的支出驱动因素上执行此操作。\n\n### 为云使用定义治理和控制\n\n请记住，云的主要价值是交付速度，推动更大的创新。与此同时，必须考虑成本，因此成熟的公司会不断评估他们就如何以及可以消费何种类型的云服务达成的共识性\
  \ guardrails，以确保不会阻碍创新和速度。控制过度，就会失去迁移到云的核心优势。\n\n### 持续改进效率和创新\n\n这些是不断迭代的流程，用于完善目标以推动更好的业务成果。我们称之为度量驱动的成本优化，如第\
  \ 22 章所述。与使用优化行动的节奏（容易导致效率低下或人为忽视）不同，度量驱动的成本优化定义了带有目标阈值并受监控的关键指标，以推动未来的优化行动。\n\n\
  ### 自动化资源优化\n\n成熟的团队转向以编程方式检测错误大小资源所需的更改，并提供自动清理未充分利用资源的功能。\n\n### 将建议集成到工作流中\n\n\
  成熟的团队不再要求应用程序所有者登录查看建议，而是开始将架构建议、调整规模建议、现代化机会以及其他改进机会推送到冲刺规划工具中。其中一些信息将是战术性的成本优化数据，但一些可能是战略性的，有助于团队了解如何通过架构或构建软件来建立成本效率，从而避免成本。\n\
  \n### 将分摊计费集成到内部系统\n\n一旦分摊计费已实施并向团队提供可见性，成熟的 FinOps 团队随后会通过其应用程序编程接口（API）以编程方式将该数据集成到其相关的内部报告系统和财务管理工具中。\n\
  \n### 建立基于策略的标签清理和存储生命周期策略\n\n成熟的团队开始通过诸如 tag-or-terminate 或 tag-on-deploy 之类的策略以编程方式清理标签。他们还实施基于策略的存储生命周期，以确保数据自动存储在最具成本效益的层级中。\n\
  \n## 注意事项\n\n在生命周期之旅开始时，您应该在 FinOps 实践中审查一些关键注意事项。它们围绕 FinOps 的关键理念展开：清楚了解支出、创建全公司范围的运动、推动创新，并最终帮助业务实现目标。\n\
  \n您需要评估以下内容：\n\n### 单位经济\n\n一个重要步骤是将云支出与实际业务成果联系起来。如果您的业务正在增长并且您在云中扩展，花更多钱不一定是坏事。尤其是如果您知道为客户提供服务的成本并且您持续降低成本。将支出指标与业务指标联系起来是您\
  \ FinOps 之旅中的关键一步。\n\n单位经济提供了一个清晰、通用的词汇表，以便组织各层级能够有意义地讨论云支出。管理层可以设定与成果挂钩的目标，而不是设定任意的支出目标。管理建议变为“不要担心总账单；只要确保您降低每次行程的成本”而不是更严格的“在云上花费更少”。\n\
  \n### 文化\n\n运营阶段是评估 FinOps 文化被采纳程度的好时机。资源利用效率低下或 RI 覆盖不足等问题通常是由于沟通不畅和组织孤岛造成的。寻找团队主动设计高效使用云的云服务的迹象。评估员工是否完成了可用的\
  \ FinOps 培训，以及财务与工程之间的沟通是否顺畅。\n\n### 交付速度\n\n交付速度由成本与质量之间的权衡控制。管理层可能希望与 FinOps 团队成员讨论特定项目，以决定是否调整这两个杠杆，看看是否可以提高交付速度。\n\
  \n\n\n## 对业务的价值\n\n再次，管理层可能希望评估云支出是否反映了项目对业务的价值。这是以 FinOps 团队成员讨论具体项目是否要继续按原样运营，还是可以做出一些改变的另一个机会。\n\
  \n## 从哪里开始？\n\n你从提出启动 inform 阶段的问题开始。将 FinOps 生命周期想象成一个闭环赛道——你可以在任何一点切入，最终会再次循环回来。然而，我们建议你在进入\
  \ optimize 或 operate 之前先从 inform 开始。了解云环境中正在发生的事情，并做好艰难但重要的分配清理工作，以便在开始做出更改之前明确谁真正负责什么。\n\
  \n无论你在生命周期的哪个阶段，都应持续关注文化和治理。FinOps 的真正力量来自于将行动和工具与文化转变相结合，从而改变整个组织与云使用相关的关系。\n\n\
  无论你做什么，都不要试图一口吃成胖子。几年前，我们看到一家大型零售商试图通过一次采购将 RI 覆盖率从 0% 提升到 80%。该公司研究了其基础设施，咨询了工程团队，检查了操作系统，并进行了\
  \ $2 million 的采购。管理人员互相击掌庆祝自己的出色表现，然后在接下来的几周内回到工作岗位。下个月云账单明显更高，VP 愤怒不已。经审查，公司发现由于对\
  \ BYOL（“bring your own license”）模式如何应用缺乏了解，它购买了错误的 RIs 和错误的操作系统。同一家零售商现在已达到 80%\
  \ 的覆盖率，但由于之前的灾难导致财务团队和业务部门变得畏手畏脚，提升他们水平花了多年的努力。慢慢来。就像任何事情一样，建立能力需要时间，但可以通过向先行者学习来加速。\n\
  \n## 你不必找到所有答案\n\n在你开始告诉团队关闭此资源或缩小那个资源之前，你必须真正了解成本驱动因素是什么，并让团队看到其支出对业务的影响。\n\n这将带来一些令人惊讶的自主结果。我们通过团队成员的一条\
  \ Slack 消息了解到一个很好的例子，其中一家制造公司仅通过向团队展示他们的支出情况就实现了六位数的年度节省（见 Figure 9-2）。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_176_0.png)\n\
  \nFigure 9-2. 关于成本可见性结果的真实对话\n\n这个故事最好的部分是 FinOps 并未向团队提出任何建议。他们所做的一切只是照亮了团队的云使用情况。团队根据对基础设施成本的理解主动进行改进。这就是为什么你要将使用量减少的任务推给负责支出的团队。\n\
  \n## 结论\n\n请记住，掌握 FinOps 生命周期是一种迭代方法，需要在大型企业中进行多年的教育和流程改进。\n\n总结如下：\n\n- FinOps\
  \ 生命周期包含三个主要阶段，你会不断循环往复。\n- 在生命周期的每次迭代中改进——不要试图一次做所有事情。\n- 尽早、经常地让所有跨职能团队参与进来，以便他们能与你一起学习。\n\
  - 不断寻找改进流程的机会，但要快速在各阶段之间移动。\n- 你能做的最关键的事情是为团队提供细粒度、实时的支出可见性。\n- 在做任何其他事情之前，你需要完全加载和分配你的成本，考虑你的自定义费率，填补分配缺口，分摊共享成本，将支出重新映射到你的组织结构，并核算摊销。\n\
  \n这听起来可能工作量很大，但实际上入门过程很容易。接下来，我们将逐步完成生命周期的第一阶段，以便你开始解决需要回答的问题。\n\n## Inform 阶段：你现在在哪里？\n\
  \n通过提问开始你的 FinOps 实践。这就是 inform 阶段的全部内容。当你找到这些问题的答案时，你就可以开始评估云的状态。在本章中，我们将查看一些你应该从中开始的问题，并对一些常见能力中“优秀”的样子有一个\
  \ aspirational glimpse。所有这些将帮助你在进入 optimize 阶段时知道该关注哪里。\n\n正如我们所说，FinOps 不是线性过程；它是一个循环。第一阶段获得的可见性对于使你能够进入下一阶段至关重要。你将花费大部分时间在\
  \ inform 阶段。如果过快地跳到 optimize，很容易犯 costly 错误。正如木匠自建筑工艺开始以来一直提醒我们的，“measure twice,\
  \ cut once。”测量为你提供信息，以便你可以做出更改，然后你将这些更改与运营指标进行衡量，等等。你将始终回到 inform，重新检查哪些行动对业务有益。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_177_0.png)\n\n你应该尝试回答的第一个问题是：“What’s\
  \ the total cloud spend, its forecast, and its growth rate?”如果这些数字对业务不重要，可能是在最基本的报告到位后考虑暂停的时候了。回顾第\
  \ 2 章中介绍的有知忽略概念。\n\n## 没有上下文的数据毫无意义\n\n当然，找到数据是不够的。你必须对其进行解释。你的目标是自我教育。你需要与财务、工程和业务线（LoB）的同事开始对话，讨论你想要实现的目标。\n\
  \n为此，熟练的 FinOps 从业者会提出问题，为他们构建适当的分配结构做好准备，如第 11 章所述。请记住，你不是在试图一口吃成胖子。你希望确定在整个 FinOps\
  \ 生命周期中会得到回答的问题。\n\n这个过程也完善了我们在第 4 章中讨论的共同语言。它防止了对数据的信任缺失，以及当团队之间缺乏一致性时经常随之而来的指责。\n\
  \n> *在瓶颈之外任何地方做出的改进都是幻觉。*\n> \n> —Gene Kim, The Phoenix Project\n\n即使是最有经验的 FinOps\
  \ 从业者——那些建立了多个成熟实践的人——在建立实践时也会遵循 FinOps 流程的逐步成熟。你的初始目标是取得一些轻松的胜利，收获低垂的果实，建立肌肉记忆，并获得信誉。想\
  \ DevOps，而不是 Waterfall。想 Gene Kim，而不是 Winston W. Royce。\n\n## 先寻求理解\n\n当你开始这一阶段时，你可能会立即发现一些浪费。想要冲出去修复它是可以理解且自然的。然而，首先要问，“Where\
  \ is the waste coming from?”这将帮助你识别根本原因并防止下次再次发生。换句话说，你应该抵制直接在云环境中做出更改的诱惑，而应首先专注于回答问题。\n\
  \n确定需要提问的最有效方法之一是访谈组织中的各个利益相关者。当你了解他们关心什么时，你就可以利用这些知识来构建报告和分配结构所需的上下文。\n\n以下是一些帮助你入门的问题：\n\
  \n- 你想报告什么？是成本中心、应用程序、产品、业务部门，还是其他东西？\n- 大部分支出来自哪里，即来自哪些服务？\n- 你要做 chargeback 吗？你要做\
  \ showback 吗？两者各有好处，但无论哪种方式都有助于推动问责。\n- 如果你要集中管理费率，公共利益是优先事项，还是通过 chargeback 收回成本更重要？\n\
  - 看到支出趋势就足够了吗，还是你需要精确到分地进行费用分摊？趋势是开始时的目标；后来，细粒度分配变得重要。\n\n\n\n- 如何应对成本中心的变化？起初，你可能使用电子表格或配置管理数据库（CMDB），但后来你将在\
  \ FinOps 平台中拥有一个分配数据的元层，以便根据组织不断变化的结构动态重新映射。\n- 如何应对人员或应用程序在团队之间转移，或重新组合到不同的团队？他们切换之后，如何获取他们现在关心的信息，因为他们的数据切片会不同？\n\
  - 如何通知人们分配结构发生了变化？\n- 你真正需要的标签是什么？起初可能只有三个，但后来可能有几十个。然而，如果你扩展到几十个，很可能标签太多，生命周期中的未来循环可能会让你根据优化阶段设定的更新目标来优化标签数量。\n\
  - 你是否会通过你的 CCoE 举办“lunch and learns”等活动，定期展示最佳实践并让大家感到兴奋？\n\n随着你在 FinOps 循环中移动，你会回答更多问题。你高效吗？你需要经历这个循环才能知道。并且在经历几次循环后，你会意识到你实际上永远不会到达终点。你只是变得更好，你的问题也更深入：\n\
  \n- 哪些团队在推动成本？他们高效吗？你能将他们的成本与单位指标关联起来吗？\n- 每个团队都有预算吗？你是否按这些预算管理团队？你能进行作业成本核算吗？\n\
  - 你的标签策略状态如何？查看已实施的标签以及它们报告的内容。查看覆盖缺口。考虑如何分配无法标记或共享的成本。\n- 你将如何保持分配结构同步并保持最新？电子表格？与\
  \ CMDB 基于节奏的同步？FinOps 平台与 CMDB 之间的 API 集成？\n- 承诺折扣策略是什么？有哪些基于承诺的折扣计划？它们的使用情况如何？如何优化？应该推出哪些新的？\n\
  - 然后……反复冲洗并重复。\n\n你在每个阶段挑选低垂的果实，然后进入下一个阶段。然后你重新调整目标并再次循环。但你应该始终从成本可见性开始。然后在下一个周期，你设定基本预算，见\
  \ Chapter 13 讨论。下一个周期，你就开始管理它们。\n\n每次你提出更难的问题时，都要确保其他团队与你同行。事实上，他们的教育 arguably 比\
  \ FinOps 从业者的技能更重要。成功的 FinOps 文化是一个共同工作的村庄，而不是一群试图快速推进一些 sweeping 变化的个人。\n\n## 本阶段的组织工作\n\
  \n在支出数据分析之外，还有很多组织和文化工作需要做，以创建 FinOps 文化。在健康的 FinOps 实践的这个阶段，你还将关注：\n\n- 让高管围绕目标以及云带来的工作模式变化达成一致\n\
  - 帮助工程师理解他们在影响业务方面的扩展角色，特别是将成本作为新的效率指标来考虑\n- 确保团队具备合适的技能（FinOps.org has more detail）\n\
  - 与工程、财务、IT、架构团队、采购、产品团队、安全、ITAM 团队等同事建立桥梁，通过 FinOps day 等活动在内部推广 FinOps 工作，以帮助分享概念、影响和早期成果\n\
  - 与工程团队保持一致（并帮助减轻他们的工作负担），通过尽可能管理费率优化，同时确保他们拥有管理使用优化所需的数据\n\n## 透明度与反馈循环\n\n在 Chapter\
  \ 1 中，我们探讨了 Prius Effect 以及实时可见性对你行为的影响。在电动车中，能量流动显示屏使你能够看到此刻所做的选择——过去可能是不自觉的——如何影响你使用的能量数量。同样，在\
  \ inform 阶段，你依赖不断到达的数据来驱动实时决策并建立问责制。\n\n最近，我们被问到，“Is near-real-time data needed\
  \ for everything in the cloud?” 我们考虑了这个问题，但想不出任何一份报告只需要每月查看一次的例子。云中变化太快，这与其说是计算机本身，不如说是推动云创新的行为。FinOps\
  \ 成熟初期，报告每天或每周查看。随着 FinOps 成熟，它们按约定的节奏（或基于异常）查看，而在非常先进的 FinOps 实践中，它们在显示你设定的指标已越过阈值的警报后才查看。Chapter\
  \ 22 digs into what that advanced stage scenario looks like.\n\n![](img/4d4736bc293fd892d1da81802d0f9520_181_0.png)\n\
  \n在新 FinOps 从业者中，花费大量时间和/或金钱使数据比组织内部流程所需更实时，可能成为沮丧的来源。目标是频繁更新的云支出数据，但不要超出对组织有益的范围。再次，不要冒着在瓶颈处优化的风险试图煮沸大海。\n\
  \n本阶段的关键能力是检测云支出异常的能力。异常是指偏离典型值（average）、随时间变化的斜率（trend）或循环重复模式（seasonality）的支出。它们是俗话说的干草堆里的针，在大多数云账单的复杂性（和规模）中难以检测。但它们也可能真的累积起来。\n\
  \n## 来自云端的故事——FinOps 社区\n\n一家跨国制药公司的远程工程团队在悉尼启动了三个 x1e.32xlarge 实例用于测试内存数据库。当时，这种尺寸的实例每小时成本略高于\
  \ $44。三个实例加起来每天花费超过 $3,000，或每月约 $98,000。这些数字看起来很大，直到你考虑到该团队的月度云账单超过 $3,500,000。因此，这一变化只会导致支出增加可怜的\
  \ 2%，并且在高层报告中不易被察觉。\n\n进一步掩盖这一支出异常的是，中央团队刚刚为另一批机器购买了 RIs，这笔交易实际上抵消了新 X1e 实例的支出差额。然而，由于\
  \ FinOps 团队拥有基于机器学习的异常检测，他们在同一天就发现了大型实例的使用情况，并能够立即讨论是否需要如此多的算力。毫不奇怪，结果证明不需要。\n\n\
  Granted，这是一个更成熟阶段公司的故事。较不成熟的 FinOps 实践通常从简单的每日支出可见性开始，向团队展示各自的支出。即使是这种程度的可见性也开始相应地影响他们的行为。\n\
  \n幸运的是，由于识别异常支出是如此关键的问题，所有云提供商和许多第三方工具和平台都为你提供了更轻松地发现异常的能力。要有效管理异常，你必须：\n\n- 1.\
  \ 拥有稳固的成本分配策略——将在下一章介绍。\n- 2. 经常查看——或以编程方式分诊——异常报告。\n- 3. 将异常分配给负责支出的适当团队。\n- 4.\
  \ 遵循调查和关闭异常工单的流程。\n\n异常频繁地给组织造成巨额资金损失是多么不幸，如果他们只是关注异常警报或在检测到异常后知道该找谁谈，这些损失本可以大大减少。管理异常始于\
  \ inform 阶段。如果你没有查看异常报告，请停止阅读并去打开它，然后回来完成本章。这很重要。\n\n## 基准测试团队绩效\n\n使用基准测试团队绩效的记分卡是了解团队如何比较的最好方法。记分卡让你找到表现最差和支出最高的团队，并让你了解你在行业中的基准情况。\n\
  \n记分卡还应显示相对于核心效率指标的改进机会。它们应为高管提供整个业务（或其一部分）的视图，以便了解每个人的表现并能够深入到单个团队层面以获取可操作的数据。它们是\
  \ CxO’s 的最佳朋友和促成变革的最佳武器。记分卡应推动团队的努力，并在从事类似工作的不同团队之间统一体验。而且记分卡有助于团队相互竞争。\n\n在之前的\
  \ FinOps Foundation call 中，Intuit 的 Dieter Matzion，现在在 Roku，分享了他的记分卡方法。关键项目包括：\n\
  \n- EC2 efficiency via a rightsizing score\n- Rate commitment program coverage and\
  \ efficiency\n- Elasticity measure to determine how well teams were taking advantage\
  \ of the ability of cloud to bring resources up and down, based on workload\n\n\
  除了为每个团队提供个人记分卡，跟踪他们在多个指标上的效率外，Dieter 还创建了一个高管级视图，按团队汇总分数。这种可见性将机会领域照亮了。并且它推动了改进，再次表明没有人想在最差违规者名单上。\n\
  \n\n\n![](img/4d4736bc293fd892d1da81802d0f9520_183_0.png)\n\nDieter's 演示录像，其中深入探讨了用于基准测试团队的具体指标，可在\
  \ FinOps Foundation 网站上获取。\n\n## What Great Looks Like\n\n正如所有学科一样，成为高绩效者没有捷径，因此请带着一丝抱负性的怀疑态度来看待以下卓越的衡量标准。组织的\
  \ FinOps 能力只能在数月数年的实践中发展。当然，你可以做一些事情来加快这一进程，但最终你需要投入学习和在组织内部成熟文化变革所需的时间。事实上，如果试图直接走向高绩效，会对业务造成损害。它不可避免地会导致错误，从而带来意外的成本。\n\
  \n表 10-1 显示了关键指标 across 的各种熟练程度。定量数据取自 Apptio Cloudability 在 2019 年的数据集中超过 90 亿美元的公共云支出，而定性数据则取自\
  \ 451 Group 对数百名云消费者进行的调查。¹\n\n表 10-1. 公共云中低、中、高绩效者的指标\n\n| | 低绩效者 | 中绩效者 | 高绩效者\
  \ |\n|---|---|---|---|\n| 云支出可见性与分配 | 依赖供应商发票和人工核对 | >1 天才能获得部分可见性，且细粒度历史数据保留有限\
  \ | <1 小时或接近实时可见所有支出，且保留所有当前和历史数据 |\n| 回溯或分摊 | 无法为团队提供云支出的准确核算 | 云支出根据资源估算使用量分配给团队\
  \ | 团队基于实际消耗了解其云支出份额 |\n| 团队预算 | 团队没有预算 | 团队有预算 | 团队制定预算并跟踪支出与预算的对比 |\n| 预留实例和约定使用折扣管理\
  \ | 0%–20% 的云服务通过预留购买 | 40%–50% 的云服务通过预留购买 | 80%–100% 的云服务通过预留购买 |\n| 查找并移除未充分利用的服务\
  \ | 每隔几个月 | 每周 | 自动化且由策略驱动 |\n| 单位经济 | 可能不使用 | 更偏向技术、基于团队的每计算小时成本等 | 更偏向业务的每客户成本等\
  \ |\n\n高绩效者能够快速提出并回答有关其支出和预测的复杂问题，他们会对部署变化的情景进行假设分析，并了解这些变化对其单位经济的影响。由于云支出的细粒度可见性和分配，他们知道在哪里寻找优化运营指标的机会。或者他们可以识别信息中的差距，或创建自动化以帮助他们在信息阶段成熟。\n\
  \n这种高水平的能力使企业能够通过创新的速度变得更具竞争力，使管理层和团队更好地了解成本和 COGS，并能更深入地了解服务的定价。\n\n1 451 Research,《云时代的成本管理：企业准备度威胁创新》（纽约：451\
  \ Group，2019），https://oreil.ly/71tao.\n\n## Conclusion\n\nFinOps 生命周期自然的静止状态是信息阶段。在这里，你了解云财务管理的当前状态，这将帮助你在下一阶段识别优化和运营改进的机会。\n\
  \n总结如下：\n\n- 为了回答问题，建立围绕财务数据的上下文。\n- 使用数据监控支出并规划优化和效率。\n- FinOps 文化帮助跨学科的角色共同合作，回答关于使用量和成本的重要问题。\n\
  - 遵循 FinOps 成熟度模型很重要。每次经过信息阶段，随着成熟，你将能够回答关于你的云的更复杂的问题。\n\n我们已经确定了问题，但如果没有将云支出细分为更细粒度的成本组的能力，关于整体支出的答案也只有那么有用。你需要一种方法来识别哪些成本属于哪个组，以便进行团队级报告、回溯、预算和预测。然后你就可以更有效地对团队进行基准测试并相互比较。这是下一章的主题，其中我们将介绍成本分配的概念。\n"
- "## Allocation: No Dollar Left Behind\n\n本章是关于你在分配支出之前需要做出的战略决策。虽然成本分配是关于将云成本分配给组织内的正确业务单元，但向整个业务报告这些分配也会带来许多好处。\n\
  \n### Why Allocation Matters\n\n不让任何一美元未分配、未指派或未标记的好处是巨大的。首先，你可以知道谁在花多少钱。你消除了典型的云成本讨论，这些讨论往往\
  \ abrupt 以“该资源不属于我”结束。但最有价值的是，你可以开始单独跟踪每个团队的预测增长（与整个公司的支出相比），并为团队设定预算，让他们知道自己相对于目标的表现如何，第\
  \ 13 章将更详细地介绍这一点。\n\n一旦你建立了这一点，你就会开始知道异常来自哪里，以及哪个业务领域和哪个工作负载导致了它们。知道资源在做什么，有助于我们通过考虑环境的特征和该团队的计划安排来智能地开始优化。它是生产还是开发？你希望在多大程度上突破各自\
  \ CPU 的界限？等等。与此同时，团队会收到与其支出相关的每日真实视图，而财务团队将在月底将其分摊给他们。\n\n> 你应该朝着单位经济迈进，以便将预算责任交给团队。中央团队仍在进行分配，但你希望通过分摊和回溯将问责制推向边缘团队，使其成为他们的责任。中央团队定义如何高效使用云。\n\
  > —Michele Alessandrini, Head of Cloud Adoption and Governance at YNAP\n\n分配使你能够回答第\
  \ 10 章中提出的关于云支出的业务问题。事实上，成本分配是业务价值与云支出之间的重要联系。随着人们意识到自己的行为及其影响，这种意识会推动更精益的文化。而分摊和回溯创造了问责制。\n\
  \n我们希望很明显，信息阶段是优化阶段的必要前提。即使如此，我们也见过太多云新手，他们会一头扎进试图成本优化其云环境，同时忽视了解云中成本分配驱动因素的重要性与复杂性。坚实的层级账户策略和体面的标记策略是任何成本分配策略的关键要素。但仅仅建立这些还不足以解决分配问题，因为分配可能是一个移动目标。考虑一下未标记或无法标记的资源不断出现，共享成本必须核算，而且非常常见的是——就在拐角处——一次重组或报告方式的变化可能会破坏分配策略，尽管它构建得再仔细。\n\
  \n人们也会增加复杂性。不同的人会想要不同的东西。财务人员想知道支出流向何处，以及如何以有意义的方式将其追溯到 SKU 和产品。工程师关心可变消耗、单个服务成本，以及他们的日常行为如何影响账单。工程总监会关心汇总到全局视图的多个视图。专家可能需要显示不同资源类型使用情况或使用特定许可类型的资源的详细报告的报告。上下文就是一切。因此，在构建策略时，你会牢记所有不同的需求和观点，以创建适合所有这些不同角色的分配结构。\n\
  \n当然，我们也不要忘记业务指标。你的策略必须让团队能够将业务指标与其支出联系起来，从而实现单位经济并就支出对业务的价值进行对话。\n\n### Amortization:\
  \ It’s Accrual World\n\n回顾第 4 章中介绍的匹配原则：它指出费用应在收到价值的期间记录，而不一定是在云提供商开具发票的期间。\n\n\
  这里需要考虑的会计原则是是否按现金制或权责发生制报告。前者意味着你在费用发生的期间报告支出，而后者则表示你在受益实现的期间报告支出。这适用于某些具有预付款的基于承诺的折扣等计费结构，其中初始费用的部分需要结转到承诺使用时。\n\
  \n\n\n\nThis “carrying forward,” or amortization, is the equivalent of the hardware\
  \ depreciation concept that many in the on-premises world are familiar with. But\
  \ here it specifically applies to intangible assets. Without amortizing the up-front\
  \ cost forward to when—and where—it was used, confusion and doubt are introduced\
  \ around the real-time spend data. Operators are lulled into thinking they are spending\
  \ less than they are, and there’s often an unhappy surprise later on when they receive\
  \ a larger invoice from accounting, which has applied amortization before charging\
  \ back.\n\nIn Figure 11-1, the cash basis reporting graph at the bottom shows how\
  \ spending can look lumpy without amortization applied. The accrual basis graph\
  \ at the top of the figure shows how spending trends become clearer once costs are\
  \ amortized.\n\n![](img/4d4736bc293fd892d1da81802d0f9520_187_0.png)\n\nFigure 11-1.\
  \ Monthly costs with and without amortization\n\n图 11-1. 有摊销和无摊销的月度成本\n\nHere’s\
  \ how the amortization and the resulting savings are calculated in a simplified\
  \ example:\n\n以下是摊销及其 resulting 节省在简化示例中的计算方法：\n\n- On-demand rate for a resource\
  \ is $0.10 per hour.\n- 资源按需费率为每小时 $0.10。\n- A reservation costs $200 up front,\
  \ and then $0.05 per hour when used.\n- 预留 upfront 费用为 $200，使用时每小时 $0.05。\n- The\
  \ amortized rate is $200, divided by 365 days of 24 hours each, plus the $0.05 per\
  \ hour rate.\n- 摊销费率为 $200 除以 365 天每天 24 小时，再加上每小时 $0.05 的费率。\n\n$$\\frac{200}{(365\
  \ \\times 24)} + (0.05) = $0.073$$\n\n- The savings works out to be the on-demand\
  \ hourly rate minus the amortized rate.\n- 节省额为按需小时费率减去摊销费率。\n\n$$0.10 - 0.073 =\
  \ $0.027 per hour (27% savings)$$\n\nA company might have hundreds, if not thousands,\
  \ of commitment-based discounts at any given point in time. This makes it quite\
  \ challenging to track all active commitments. Each commitment would typically have\
  \ a unique schedule, with a certain start and end date. In the case of convertible\
  \ AWS reservations, the RI could be modified to a set of new RIs, requiring the\
  \ original fixed price to be divided properly among all new target RIs.\n\n一家公司在任何给定时间可能有数百甚至数千个基于承诺的折扣。这使得跟踪所有活跃承诺变得相当具有挑战性。每个承诺通常都有独特的时间表，具有特定的开始和结束日期。在可转换\
  \ AWS 预留的情况下，RI 可以修改为一组新的 RI，需要将原始固定价格正确分摊到所有新的目标 RI 中。\n\nThere’s more detail coming\
  \ on commitment-based discounts of all sorts in Chapter 17.\n\n第 17 章将提供有关各种基于承诺折扣的更多细节。\n\
  \nIt’s recommended that amortization is factored into all spend reporting data,\
  \ including forecasting, chargeback, anomalies, and basically any other data that’s\
  \ put in front of teams. If cost reporting and analytics do not match higher-level\
  \ functions like forecasting and anomalies, data confusion can occur. And as we’ve\
  \ stated a few times, the less data confusion, the better.\n\n建议将摊销纳入所有支出报告数据中，包括预测、计费回溯、异常以及基本上提供给团队的任何其他数据。如果成本报告和分析与预测和异常等更高层级功能不匹配，就可能出现数据混淆。正如我们多次所述，数据混淆越少越好。\n\
  \n## Creating Goodwill and Auditability with Accounting\n\n## 通过会计建立善意与可审计性\n\n\
  The additional benefits of having a good account hierarchy and a good tagging strategy\
  \ go beyond full cost allocation and accountability to auditability. Using auditability\
  \ as an added bonus of tags can generate a lot of support from the finance teams\
  \ as you push forward an allocation strategy.\n\n拥有良好的账户层级和良好的标签策略的额外好处超出了完整的成本分配和问责，延伸到可审计性。将可审计性作为标签的附加好处使用，可以在您推进分配策略时获得财务团队的大力支持。\n\
  \n> *A big part of accounting’s job is making sure that all of the money spent can\
  \ be audited and tracked. The more resources are tagged correctly, the more auditable\
  \ is your cloud spend.*\n> \n> —Darek Gajewski, Principal Infrastructure Analyst\
  \ at Ancestry\n\n> *会计工作的重要部分是确保所有支出都可以被审计和追踪。资源标记得越正确，您的云支出就越可审计。*\n> \n> —Darek\
  \ Gajewski，Ancestry 的首席基础设施分析师\n\nIf that weren’t enough, a solid tagging strategy\
  \ allows you to build more accurate forecasting models, simply because you're using\
  \ data that's richer, more accurate, and more granular. Since another key role of\
  \ accounting is to forecast future expenses, tagging goes a long way toward building\
  \ trust and goodwill between operations and finance.\n\n如果这还不够，坚实的标签策略使您能够构建更准确的预测模型，仅仅因为您使用的是更丰富、更准确、更细粒度的数据。由于会计的另一个关键角色是预测未来支出，标签在建立运营与财务之间的信任和善意方面发挥了重要作用。\n\
  \nAll of this translates into less pushback, more willingness to move costs around,\
  \ and, in general, teams that are better equipped to achieve a company’s goals.\n\
  \n所有这些转化为更少的阻力、更愿意调整成本，以及总体上更好地配备以实现公司目标的团队。\n\n## The “Spend Panic” Tipping Point\n\
  \n## “支出恐慌”临界点\n\nAs is all too often the case, different teams running in cloud\
  \ have little oversight until the spend gets to be high enough that it draws the\
  \ attention of leadership. While there is often pushback against chargeback—and,\
  \ to a certain degree initially, to showback—operating without showback/chargeback\
  \ does not enable answers to the questions around who is spending what.\n\n正如经常发生的情况一样，不同的云中运行的团队在支出高到引起领导层注意之前几乎没有监督。虽然通常会对计费回溯——以及在一定程度上最初对展示回溯——存在抵触，但没有展示回溯/计费回溯的运营无法回答谁在花多少钱的问题。\n\
  \nFigure 11-2 shows a sample journey into the cloud where cost management is not\
  \ on the radar until spend draws executive attention.\n\n图 11-2 显示了一个进入云的示例旅程，其中成本管理在支出引起高管注意之前不在雷达上。\n\
  \nThe typical cloud maturity curve shows the point at which organizations start\
  \ to pay attention to their cloud spend. The illustrative graph culminates in a\
  \ very specific point: that moment when spending crosses an invisible threshold\
  \ and the executive team starts to really care about it. For some organizations,\
  \ that may be $1 million per month, while for others it may be $10 million per month.\
  \ The number is different for each organization, but the output is the same. The\
  \ tech organization is suddenly whiplashed into caring about—and seeking to optimize—cloud\
  \ spend.\n\n典型的云成熟度曲线显示了组织开始关注其云支出的时间点。说明性图表 culminates 在一个非常具体的点：支出跨越不可见阈值而执行团队开始真正关心它的那一刻。对于一些组织来说，这可能是每月\
  \ 100 万美元，而对于其他组织来说可能是每月 1000 万美元。数字因组织而异，但结果相同。技术组织突然被鞭打到关心——并寻求优化——云支出。\n\nSpend\
  \ panic is often such a surprise that there is a halt or pause in cloud use. This\
  \ can hurt the company overall in terms of making progress on business objectives,\
  \ as well as throw the cloud teams into a panic.\n\n支出恐慌往往令人如此惊讶，以至于云使用会暂停或停止。这可能会在实现业务目标方面损害公司整体，并使云团队陷入恐慌。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_189_0.png)\n\nFigure 11-2. Spend growth\
  \ with significant events\n\n图 11-2. 具有重大事件的支出增长\n\nDuring a FinOps Foundation call,\
  \ Ally Anderson, a business operations manager and eight-year FinOps veteran, tells\
  \ a similar story about her own organization. There have been three different times\
  \ when there was a “spend panic” that resulted in a push for more accountability:\n\
  \n在一次 FinOps Foundation 通话中，业务运营经理兼八年 FinOps 资深人士 Ally Anderson 讲述了她自己组织中的类似故事。有三次不同的时间出现了“支出恐慌”，导致对问责制的推动：\n\
  \nThe first one drove a need for questions being answered. This got finance onboard\
  \ with the idea of showing teams what they were spending. The spending increased\
  \ again, and drove a period of shameback. A light was shone on teams who were increasing\
  \ their cloud costs. This brought in showback for a spell, until another threshold\
  \ was crossed that resulted in another period of shameback in an attempt to try\
  \ to get teams to reduce spend. It wasn’t until a third period of spending panic\
  \ that the light bulb went off: the bill going up isn’t necessarily a bad thing\
  \ if our business is growing.\n\n第一次推动了需要回答问题的需求。这让财务部门接受了向团队展示他们支出想法的想法。支出再次增加，并导致了一段羞耻回溯期。那些增加云成本的团队被曝光。这带来了一段时间的展示回溯，直到另一个阈值被跨越，导致另一段羞耻回溯期，试图让团队减少支出。直到第三次支出恐慌，灯泡才亮起：如果我们的业务在增长，账单上涨不一定是坏事。\n\
  \nAt that point, Ally and her organization began to reframe the question as: “Are\
  \ we spending as efficiently as possible?” As she explains, “The conversation moved\
  \ to ‘how do we optimize?’ instead of mandating a cost reduction target.”\n\n在那时，Ally\
  \ 和她的组织开始重新定义问题为：“我们是否以尽可能高效的方式支出？”正如她解释的那样，“对话转向了‘我们如何优化？’而不是强制要求成本削减目标。”\n\nThese\
  \ conversations were possible because of the allocation strategy that had evolved\
  \ through many years of maturing FinOps.\n\n这些对话之所以成为可能，是因为分配策略在多年的 FinOps 成熟过程中不断演进。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_190_0.png)\n\nSpend panic is going to\
  \ happen. If you have an automated system in place to see your spend patterns, and\
  \ an approximate date for which you predict spend will increase by too much, you\
  \ are prepared for the inevitable executive scrutiny that will follow. Without defensible\
  \ cost allocations, you are heading into an avoidable conflict with business leaders.\
  \ You can protect yourself, and your sanity, with a scalable, easily updated allocation\
  \ strategy.\n\n支出恐慌将会发生。如果您有一个自动系统来查看支出模式，并且有一个大致的日期预测支出会增加过多，您就可以为随之而来的不可避免的高管审查做好准备。如果没有可辩护的成本分配，您将陷入与业务领导者之间可以避免的冲突。您可以用可扩展、易于更新的分配策略保护自己和您的理智。\n\
  \n## Spreading Out Shared Costs\n\n## 分摊共享成本\n\nEvery organization has shared IT\
  \ costs, and these span multiple business departments. As organizations increase\
  \ their adoption of public cloud resources, it becomes increasingly difficult to\
  \ assign shared cloud resources to specific business owners, to understand how to\
  \ properly and fairly allocate costs, and to actually forecast future business unit\
  \ budgets.\n\n每个组织都有共享的 IT 成本，这些成本跨越多个业务部门。随着组织增加对公共云资源的采用，将共享云资源分配给特定业务负责人、了解如何适当和公平地分配成本以及实际预测未来业务部门预算变得越来越困难。\n\
  \nSupport charges are a common example of this challenge. Cloud vendor support charges\
  \ are generally applied at the parent account level. Some organizations choose to\
  \ cover this charge with a Central IT/Cloud team’s budget, but that approach isn’t\
  \ commonly used. More commonly, a Central IT/Cloud team is considered a supporting\
  \ organization (being a cost center) and therefore needs to allocate its cost to\
  \ its customers: business units or application owners.\n\n支持费用是这一挑战的常见示例。云供应商支持费用通常在父账户级别应用。一些组织选择用中央\
  \ IT/云团队的预算来覆盖此费用，但这种方法并不常见。更常见的是，中央 IT/云团队被视为支持组织（作为成本中心），因此需要将其成本分配给其客户：业务部门或应用程序所有者。\n\
  \nModern architecture has also introduced more shared costs with the rise of shared\
  \ platforms. These platforms have multiple teams working with the same core resources,\
  \ such as data lakes built in commonly shared S3 buckets or Kubernetes systems running\
  \ on shared clusters. At first glance, chargeback and showback for these platforms\
  \ can seem impossible, but the trick is proper tagging and splitting shared costs\
  \ correctly.\n\n现代架构随着共享平台的兴起也引入了更多共享成本。这些平台有多个团队使用相同的核心资源，例如构建在共同共享 S3 存储桶中的数据湖或在共享集群上运行的\
  \ Kubernetes 系统。乍一看，这些平台的计费回溯和展示回溯似乎不可能，但诀窍在于正确的标签和正确拆分共享成本。\n\nThere are typically\
  \ three ways to split up shared costs like this:\n\n通常有三种方法来拆分此类共享成本：\n\n- *Proportional*\n\
  \  Based on relative percentage of direct costs\n- *Even split*\n  Split total amount\
  \ evenly across targets\n- *Fixed*\n  User-defined coefficient (the sum of coefficients\
  \ needs to be 100%)\n\n- *按比例*\n  基于直接成本的相对百分比\n- *平均分配*\n  将总金额平均分配给目标\n- *固定*\n\
  \  用户定义系数（系数的总和需要为 100%）\n\nMature organizations tend to proportionally distribute\
  \ shared costs among business units based on their direct charges. Let's consider\
  \ an example. Table 11-1 shows how much each business unit of an organization consumed\
  \ in a given month, and how the organization was charged $10,000 of enterprise support\
  \ charge.\n\n成熟的组织倾向于根据业务部门的直接费用按比例分配共享成本。让我们考虑一个示例。表 11-1 显示了组织中每个业务部门在一个月内的消耗量，以及组织被收取的\
  \ 10,000 美元企业支持费用。\n\n### Table 11-1. Cost allocation example with centralized support\
  \ charge\n\n### 表 11-1. 集中支持费用成本分配示例\n\n| Business units | Cost | % of total (excluding\
  \ enterprise support) |\n|---|---|---|\n| Sales operations | $50K | 50% |\n| Engineering—QA\
  \ | $30K | 30% |\n| Engineering | $20K | 20% |\n| Enterprise support charge | $10K\
  \ |  |\n| Total | $110K | 100% |\n\n| 业务部门 | 成本 | 占总计百分比（不含企业支持） |\n|---|---|---|\n\
  | 销售运营 | $50K | 50% |\n| 工程—QA | $30K | 30% |\n| 工程 | $20K | 20% |\n| 企业支持费用 | $10K\
  \ |  |\n| 总计 | $110K | 100% |\n\nWithout sharing the enterprise support charge,\
  \ you can see that:\n\n不分摊企业支持费用，您可以看到：\n\n- Sales operations will be accountable\
  \ for a total of $50,000.\n- 销售运营将负责总计 $50,000。\n- Engineering—QA will be accountable\
  \ for a total of $30,000.\n- 工程—QA 将负责总计 $30,000。\n- Engineering will be accountable\
  \ for a total of $20,000.\n- 工程将负责总计 $20,000。\n- The $10,000 enterprise support\
  \ charge isn't being distributed among teams and would need to be assigned to a\
  \ central budget.\n- $10,000 的企业支持费用未在团队之间分摊，需要分配给中央预算。\n\nIn Table 11-2, the proportional\
  \ sharing mode, the enterprise support charge ($10,000) will be distributed among\
  \ the business units based on the percentage of their raw spend.\n\n在表 11-2 中，按比例共享模式下，企业支持费用（$10,000）将根据业务部门的原始支出百分比在业务部门之间分摊。\n\
  \n\n\n表 11-2. 含摊销支持费用的成本分配示例\n\n| Business units | Allocation amount | Allocation\
  \ percentage |\n|---|---|---|\n| Sales operations | $55K | 50% |\n| Engineering—QA\
  \ | $33K | 30% |\n| Engineering | $22K | 20% |\n| Total | $110K | 100% |\n\n分享企业支持费用，你可以看到：\n\
  \n- 销售运营将承担总计 $55,000（$50,000 直接成本 + $5,000 支持费用分配）。\n- 工程—质量保证将承担总计 $33,000（$30,000\
  \ 直接成本 + $3,000 支持费用分配）。\n- 工程将承担总计 $22,000（$20,000 直接成本 + $2,000 支持费用分配）。\n- 企业支持费用已分配完毕，不会影响中央预算。\n\
  \n有关管理共享成本的更多信息，FinOps Foundation 网站上的开源 playbook 进一步扩展了这一主题。\n\n## 费用回拨与费用展示\n\n\
  FinOps 社区中关于何时进行费用回拨或费用展示的讨论一直在进行。\n\n这两种方法都推动问责制，但你需要关注它们之间的核心差异。费用回拨发生在实际发生的成本被分配回某个团队的预算或损益（P&L）时。费用展示发生在你向团队展示他们的支出时，但资金仍从中央预算内部分配。\n\
  \n我们见过关于如何理解差异的最佳方式来自 Barry Whittle 的一篇文章：\n\n> 费用展示把账单留在桌上供分析；费用回拨留下同样的账单，但要求付款。\n\
  > —Barry Whittle，Apptio\n\n实际上，选择两者之间的决定往往更多地取决于组织的会计要求，而非其成熟度。企业通常会因组织倾向于或不倾向于部门损益表而选择其中一种。例如，财务主管或\
  \ CFO 可能反对企业各部分之间的损益表概念，或者对业务的某些部分来说并不合理。在这些情况下，组织会倾向于费用展示，而不进行完整的费用回拨。经常需要对不同业务单元的成本进行单独核算，或企业在不同税务管辖权下运营的不同部分。这些类型的情况可能需要进行费用回拨。\n\
  \n但在过低的层级进行费用回拨也会带来其他困难。在云中，调整或抵免在会计期间结束后出现的情况很常见。事实上，所有使用情况都是事后报告的，因此需要定期估算期末成本并进行后续调整，这可能给一些财务和会计团队带来困难。愤怒的会计师不会成为好的\
  \ FinOps 合作伙伴。\n\n## 来自云端的故事——Rob Martin\n\n从费用展示过渡到费用回拨需要一些时间。FinOps Foundation\
  \ 学习总监 Rob Martin（他曾在 AWS 云经济团队工作）分享了这个故事：\n\n> 如果出于法律或税务原因没有迫切需要进行费用回拨，过渡可能需要数年时间。在我支持的一家大型公司中，达到真正的费用回拨花了三个财年。他们使用云的第一年非常具有探索性：他们大部分时间都在学习云的工作原理，尝试第一个应用程序，并建立对云预算与传统模式有何不同程度的理解。由于组织\
  \ IT 预算已经确定，且绝大多数 IT 仍在本地部署，因此第一年几乎没有进行预算或预测。在第二年，使用云的团队获得了更多灵活性，但仍受传统预算约束。FinOps\
  \ 团队向每个应用团队提供费用展示，但他们的资金来自大型传统预算项目。在第三年，组织终于能够明确定义云团队如何在全年控制和灵活管理其预算，并且财务团队确信负责这些团队的损益所有者可以在会计系统中直接为其成本收费。预测支出的团队对这些预测充满信心，因为他们在此期间一直可以访问费用展示报告，并且建立了在成本实际计入其会计项目时取得成功的流程。\n\
  \n## 适合目的的模型组合\n\nAlly Anderson 分享说，她的公司使用费用回拨和费用展示的组合。当是面向客户的 SaaS 工作负载时，公司在集中管理预算的同时进行费用展示支出。然后，对于某些\
  \ R&D 工作负载，他们会对特定团队的损益进行费用回拨。\n\nAlly 确认在团队之间分配支出是复杂且持续进行的。她将每个团队的数十个不同的账户映射到业务需要报告的相关产品和成本中心。然而，在一次大规模重组后，她告诉我们，团队很少拆除云资源并在不同账户中重建以匹配新的组织结构。但这是在健康的\
  \ FinOps 实践中一个重要步骤。你必须将云资源的现有使用情况重新归因于适当的团队、投资组合、VP 或成本中心。\n\n这是许多 FinOps 团队遇到的常见挑战。工程师标记资源的方式不一定与业务需要报告云支出的方式一致。而且支出通常需要重新映射以匹配拥有云支出的合法\
  \ *所有者* 的成本中心或产品。\n\n## 账户、标记、账户组织层级\n\n各大主要云服务提供商都有一系列元素，结合使用时可帮助你构建成功的云成本分配策略：\n\
  \n### 账户层级\n\n工程师如何将基础设施放置到 AWS 账户、Google Cloud 项目和 Azure 订阅中构成了成本分配策略的第一层。单个账户可用于将一个环境或应用程序的成本与另一个环境或应用程序隔离。\n\
  \n### 账户命名\n\n在组织云之旅的早期阶段经常被忽视的是拥有账户命名标准以记录账户用途的详细信息。目标是包含产品和将在账户内运行的环境等详细信息。一个示例名称可能是“productA-production-01”。FinOps\
  \ 从业者应鼓励组织设立中央检查点以确保遵循此命名流程。所有账户请求都应通过中央流程进行。在 AWS 中，这将以关联账户或成本类别的形式出现。在 Google\
  \ Cloud 中，这将以项目或文件夹的形式出现。在 Azure 中，这可能是订阅或资源组。\n\n### 标记\n\n大量使用标记和标签，尤其是在有多个应用程序或业务单元在内部运行的账户中。跟踪云资源部门或成本中心的标签键对\
  \ FinOps 尤其有帮助。标签有助于将账户内的支出划分为不同的组。要求对所有资源应用标签，使用不同程度的主动执行。然而，你应该知道并非所有支出都可标记，并非所有终端用户都合规。因此，仍经常有一大块未标记的支出作为数据卫生指标报告给管理层。\n\
  \n### 跨账户共享成本\n\nFinOps 从业者面临的一个常见问题是如何在云世界中分配中央成本。你需要拆分和分摊诸如批量折扣、企业支持和 RI 预付款等成本。账户内部包括\
  \ Kubernetes 基础设施、网络成本、监控和日志系统等项目的共享成本也需要由 FinOps 处理。有关拆分共享成本方式的更多信息，请参阅 *FinOps.org*\
  \ 上的开源 playbook。\n\n回到 Ally 分享的故事，在早期使用多租户账户方法时，标记覆盖率并不理想，导致大部分支出未标记。因此 Ally 专注于随着时间的推移降低支出与未标记支出之比。在逐账户的基础上，负责特定产品的团队负责人已获得对构成这些产品的服务的细粒度视图。现在提供接近实时的报告，从而提高了对月度和季度支出的可见性。这有助于通过揭示它们来缩小分配差距。\n\
  \n遵循 FinOps 中的典型成熟度曲线，Ally 最初将云批量折扣、企业支持费用以及 RI 摊销等预付款排除在终端团队收到的报告之外。多年来，Ally 的\
  \ FinOps 实践已经成熟，她的团队已将越来越多的这些成本纳入其支出报告中。今天，她的团队可以看到正确调整后的价格。他们能够查看完全调整后的支出，其中包含摊销和准确的批量费率，从而更准确地了解实际成本。\n\
  \n## 费用展示模型在行动\n\n费用展示的关键是将成本明确关联回去，以便团队知道他们花费了多少，向每个团队展示其实际支出与预测支出的对比，包括两者之间的差异以及与预算的比较。以每周、每月和每季度为基础提供费用展示报告，同时提供关于成本驱动因素和异常情况的更细粒度定期报告。\n\
  \n目标是让你的 CTO 与每个工程 VP 进行月度运营评审以展示其支出。当没有明显的差异时，这些会议往往相当简短。更大的差异会带来更集中的方法。FinOps\
  \ 流程应尽早提醒 VP 他们将超出预算。\n\n当差异出现时，迅速突出问题和导致差异的成本驱动因素，然后 VP 可以与团队合作实施修复，而无需等待月度运营评审。这是打破信息孤岛和实时决策制定的一个很好的例子。\n\
  \n\n\n## 成本回溯与展示考量\n\n实现成本回溯/展示有多种方式，例如直接传递成本、收回额外收入以及覆盖管理成本：\n\n### 回溯实际成本\n\n\
  这是最常见的方法，并推荐用于云优先的组织。无需维护第二套账本，每个人都围绕同一组数字和目标保持一致。成本回溯采用预付款的全额摊销，并应用自定义或折扣费率，且在\
  \ AWS 的情况下，使用未混合费率来显示团队在资源使用期间实际产生的成本。最成熟的组织还会拆分支持费用等共享成本。\n\n### 集中承诺型折扣并保留部分节省\n\
  \n这种方法允许中央团队为自身提供资金，同时也与团队分享节省的好处。然而，团队可能会产生抵触，因为他们被要求放弃对 RI/SP/CUD 采购的控制，因此无法获得所有可能的节省。\n\
  \n### 集中谈判折扣并保留部分节省\n\n与云服务提供商的定制谈判折扣通常随着您承诺支出的增加而增加。中央团队能够获得的规模经济使其能够获得最佳的费率，这是单个业务部门无法实现的。有时这些费率也高度保密，并且不希望在组织内广泛分享。出于所有这些原因，一些公司选择保留部分（或全部）谈判费率节省来资助中央团队的管理。虽然并不罕见，但这种做法违背了成熟\
  \ FinOps 从业者所重视的透明度。\n\n关于采用哪种展示或回溯模型的选择，最好通过广泛讨论来做出，讨论内容包括贵组织希望如何向不同团队内部展示成本、对直接成本回溯的严格程度、希望\
  \ FinOps 团队具有多强的创业精神、现有的会计规则等。这是一场必须包括财务和会计团队的对话和讨论，并且最终必须在执行层做出决定，因为这些决策对公司的 P&L\
  \ 有影响。\n\n### 结论\n\n分配策略因公司而异，但它是 FinOps 生命周期中的重要构建块。它使您能够专注于正确的领域，最终回答第 10 章提出的问题，即您在云上花费了多少钱以及谁在花费。\n\
  \n总结如下：\n\n- FinOps 实践中的云支出通常以权责发生制为基础查看，其中包含摊销的预付款、折扣费率以及计入团队所见数据的共享成本。\n- 努力将共享成本纳入模型，例如支持、摊销和未分配费用。\n\
  - 成本回溯和展示都能推动问责制。\n- 展示或回溯模型也有助于改进标签和可审计性。\n- 成本回溯是更高级的模型，但由于会计实践的原因，并不适合所有公司。通常最好先从展示开始，然后探索组织对转向成本回溯的支持。\n\
  - 在达到“支出恐慌”临界点之前建立模型，将有助于为高管解答支出驱动因素的问题。\n\n现在我们已经介绍了分配的*为什么*，让我们来看*如何*做。在下一章中，我们将深入探讨在企业中实施标签和账户结构的特定策略和战术。\n\
  \n## 标签、标签和账户，哎呀！\n\n在上一章中，我们讨论了成本分配对 FinOps 至关重要的原因。无论是通过标签、账户、文件夹还是标签（或更可能的是所有这些的组合）来实现，成本分配都是所有其他\
  \ FinOps 能力的构建块。\n\n如果没有一致的分配策略，您最终会得到大量未分配的成本，无法将其拆分或识别负责的团队。如果他们无法轻松看到成本，每个人如何对他们的云支出负责（原则\
  \ 3）？\n\n分配云成本的主要机制是将使用情况划分为：\n\n- AWS 账户、Google Cloud 项目、Azure 订阅或资源组，或云特定的元分组构造，如\
  \ AWS Organizations、Azure 管理组或 Google Cloud 文件夹。这些提供了最清晰且最易于强制执行的成本分配定义，但缺乏粒度灵活性。\n\
  - 类似资源级元数据的标签（AWS、Azure 或 Google Cloud）或标签（仅 Google Cloud）。这些提供了细粒度的资源级键/值对，为使用和计费数据提供更深入的上下文，但需要在运行时或之后进行清理工作。\n\
  \n在本章中，我们将介绍分配成本的核心机制以及它们各自如何促进成本分配，并描述我们在大规模实施中看到的成功策略。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_200_0.png)\n\
  \n云服务提供商对相似概念使用不同的术语：标签、标签、账户、订阅、项目等。这可以笼统地称为元数据，但为简单起见，本章中我们将层次结构称为账户，键/值对称为标签。因此，当我们说标签时，我们也指\
  \ Google Cloud 标签。当我们说账户时，我们也指 Google Cloud 项目和文件夹以及 Azure 订阅和资源组。\n\n### 基于标签和层次结构的方法\n\
  \n根据环境规模的不同，详细的云成本和使用数据可能达到数百万甚至数十亿行/条。对于您当月消耗的每个资源，都会有关于资源运行位置、您使用量的多少以及您为使用支付的费率的详细信息。\n\
  \n最初缺少的全部细节是资源业务逻辑：谁拥有它，谁应该为其付费，资源属于哪个业务服务，以及许多其他未解答的问题。当然，不能期望云服务提供商在账单中添加这些细节；所有这些细节都是客户特定的。因此，您使用标签。标签允许您为特定资源分配业务上下文细节，然后分析这些信息以回答您公司特定的问题。\n\
  \n公司每个学科的人员——财务、运营、工程和管理——都可以从云使用数据中获得洞察。财务可能会使用数据将成本回溯/展示应用于正确的业务部门。运营可能会分解云支出以进行预算跟踪和容量规划。工程可能希望将开发成本与生产成本分开。而管理可以使用数据了解哪些业务活动在推动成本。每个人都使用它来过滤和汇总庞大的使用数据堆，缩小到他们希望采取行动的可管理数据集。\n\
  \nFinOps 成功的关键是尽早建立账户和标签策略并保持一致。为此，您需要跨团队可见性。幸运的是，根据您使用的云服务提供商，有各种工具可用。所有云厂商都提供可应用于资源的键/值对标签形式，以及资源运行的基于层次结构的账户组。\n\
  \n一些云服务提供商甚至提供解决方案，允许您对组进行分组并构建更深层次的基于层次结构的分配。Google Cloud 文件夹、AWS Organizations\
  \ 和 Azure 管理组可以与单个资源的标签一起使用，甚至作为替代。AWS 提供了标记账户的能力，Google Cloud 允许对项目进行标记。基于层次结构的分配允许将账户分组为集群，这些集群本身也可以被标记。这种能力正被所有云服务提供商不断改进。\n\
  \n\n\n我们见过的最成功的 FinOps 从业者倾向于在分配策略中同时使用这两种方法——基于标签和基于层级的方法，但这样做并非必需。事实上，根据基础设施的复杂程度，你可能可以在没有标签/标签的情况下进行分配。或者你也可以不将使用量分离到各个账户中进行分配。但随着环境变得复杂，你很可能会同时使用两者。\n\
  \n在任何给定时间都要一致地应用它们，尽管随着你在云使用和 FinOps 成熟度方面的不断发展，你很可能会随着时间的推移改变策略。同时运行几种账户或标签策略模型是可以的，而且你不太可能让环境达到\
  \ 100% 一致。这是可以的！\n\n一般来说，如果你只想从一种策略开始，基于层级（accounts/subscriptions/folders）的方法最适合映射到一个（或几个）维度，例如公司的业务单元/部门/团队结构。账户结构是强制性的（所有资源必然且只能包含在一个账户中），它们粒度较粗（需要识别和分配的东西较少），它们更具个体意义（用户更容易识别账户名称而不是资源名称），并且它们很可能已经用于出于安全等技术原因隔离资源。\n\
  \n可以通过一段时间来增强标签策略，但仅从标签开始可能会有问题。一次又一次，我们看到仅使用标签的方法导致覆盖缺失，即使在为提高标签覆盖率付出巨大努力后，仍会出现大量未分配支出。我们发现，不仅开发团队\
  \ notoriously 难以确保所有资源都被标记（尤其是在云使用的早期阶段），而且云服务提供商通常有一小部分资源类型根本不支持标记。\n\n如果没有每个人都坚持策略，成本将被错误分配。例如，如果你使用账户作为成本分配策略，并且有团队共享账户，成本可能会被分配给一个组而非另一个组。最大的灵活性和成功来自于采用同时涵盖账户和标签的方法。通过结合基于层级和基于标签的策略，你可以使用标签来处理精细的细节，同时使用基于层级的策略来捕获剩余的未分配成本。\n\
  \n有三种核心方法可以将成本分配数据添加到使用和计费数据中：\n\n- *资源级标签*\n  由工程师或云平台提供商直接应用于云资源。\n- *账户/项目/订阅*\n\
  \  由厂商提供并在账单中表示。\n\n## 账单后数据构造\n\n通过操作账单数据并使用第三方数据或分析工具或自行管理的数据处理来补充额外细节而实现。\n\n\
  ## 开始制定你的策略\n\n要在组织内部成功构建基于标签和/或基于层级的分配策略，你必须做到三件关键的事情。\n\n### 沟通你的计划\n\n在开始规划标签和账户策略之前，你需要确保每个人都参与其中。如果没有所有关键利益相关者，就有风险创建出不符合每个人需求的策略。你的目标是为整个公司创建最佳策略，而不仅仅是一两个团队。事实上，如果团队已经实施了自己的标签或账户布局策略，你必须首先对其进行审计，以了解哪些有效，哪些无效。\n\
  \n通常，当存在现有的工程主导策略时，它们没有财务重点。你的策略必须具有财务包容性，同时考虑到成本分配和未来成本优化的需求。\n\n对于关键的财务拆分，最佳模式是拥有团队、服务、业务单元/成本中心和组织。这些划分用于按层级对成本和资源进行分组，以回答问题：团队与团队、服务与服务等等。一致性是强制性的。较不重要或更具团队特性的标签可以推荐但不强制执行。\n\
  \n### 保持简单\n\n成本分配策略可能看起来令人不知所措，尤其是在基础设施复杂的情况下，因此保持初始策略简单很重要。我们建议从三到五个你想要了解成本的明显领域开始。当你利用标签进行成本分配时，你最初可能会关注业务单元、产品、所有者和角色的标签。然后你可以确保开发服务部署在与生产服务不同的账户中。你使用账户按环境隔离成本。即使这些小小的第一步也能在信息方面带来巨大回报。事实上，我们多次看到，对顶层成本分配的初步关注可以带来重大的可见性和优化成果。\n\
  \n在前进过程中保持简单也很重要。你的目标应尽可能使系统直观。有时当公司随着系统增长变得更精细和复杂时，其 FinOps 实践最终会形成几个大型账户，其中有大量团队在内部运行。之后试图辨别哪些成本属于哪个团队/服务/环境可能会很困难。\n\
  \n### 制定你的问题\n\n由于分配策略的全部目的就是回答公司如何使用云的关键问题，因此在流程早期定义问题很重要。FinOps 应能够成功回答的一些常见问题是：\n\
  \n- 组织内哪个业务单元应承担此成本？\n- 哪些成本中心正在推动你的成本上升（或下降）？\n- 运营某个团队负责的产品需要多少成本？\n- 你能否确定哪些成本是非生产且可以安全关闭的？\n\
  \n以这些问题作为起点，你可以确定账单文件中缺少哪些元素（参见第 5 章），然后利用这些信息来指导你的账户层级和标签策略。\n\n## 比较三大厂商的分配选项\n\
  \n让我们比较三大云服务提供商，以了解你的分配策略如何受到其各种产品的影响（参见表 12-1）。\n\n表 12-1. 云厂商分配选项比较\n\n| | AWS\
  \ | Google Cloud Platform | Microsoft Azure |\n|---|---|---|---|\n| 层级 | 账户（管理账户和成员账户）\
  \ | 项目 | 订阅和资源组 |\n| 元层级 | AWS Organizations | 文件夹 | 管理组、部门 |\n| 键/值对 | 标签 | 标签和标签\
  \ | 标签 |\n| 每个资源的标签数量 | 50（某些服务仅允许 10 个） | 64 | 50（某些服务仅允许 15 个） |\n| 标签是否自动分配到你的详细账单数据\
  \ | 否—需要手动选择 | 是—存在一些限制 | 是—存在一些限制 |\n| 标签限制 | 部分服务限制支持的字符 | 小写字母、数字字符、下划线和连字符 |\
  \ 部分字符不支持 |\n| 标签可应用于 | 大多数服务的资源（不断变化；请参阅 AWS 文档了解所有当前详情），账户（通过 AWS Organizations）\
  \ | 大多数服务的资源、项目和文件夹 | 大多数服务的资源、Azure 资源组 |\n\n从表 12-1 可以看出，细粒度的分配策略基于每个云服务提供商允许你在其平台上隔离资源的方式。每个云服务提供商都有一种标记方式（尽管\
  \ Google Cloud 提供用于策略定义的标签和用于分配的标签），但每个提供商对这些标签施加的限制存在差异。\n\n一些提供商支持在账户或资源组级别进行标记。所有\
  \ Azure 资源都在资源组内创建，并且可以与资源组以及组内的单个资源关联标签。同样，AWS Organizations 允许将标签与特定账户关联。在云服务提供商的工具以及你自己的\
  \ FinOps 工具中，有各种使用和查看这些标签层级的方式。\n\n本章后面我们将介绍你需要考虑的关于这些标签限制的注意事项，特别是在你当前使用多个云服务提供商（或未来可能使用）的情况下。重要的是要认识到，对于某些云服务提供商的标签，需要采取措施以确保标签值反映在账单数据中。\n\
  \n## 比较账户和文件夹与标签和标签\n\n标签和账户各有优缺点。如我们所述，通常最好将它们一起使用，而不是二选一。标签高度灵活，但 100% 覆盖率可能难以实现，甚至不可能实现。而且，尽管基于账户分离的分配可以提供干净的回收费，但其报告选项有限。\n\
  \n账户是互斥的，而标签不是。账户应为你的主要索引，标签为次要。一种常见的最佳实践结构是使用账户拆分最重要的主要划分，然后使用标签深入这些账户以获得更精细的可见性。\n\
  \n在图 12-1 中，我们使用账户来分解单个产品及其各自的环境。这很重要，因为不同的产品或应用程序通常代表不同的成本中心或预算。单独的环境（开发、生产、暂存等）可能需要财务团队以不同的方式核算，因为有些是\
  \ COGS 费用，有些是研发费用。此外，各个团队可能希望将生产与开发支出分组在一起，以了解资金流向或应用不同的成本优化策略。\n\n\n\n![](img/4d4736bc293fd892d1da81802d0f9520_205_0.png)\n\
  \n图 12-1. AWS 账户的通用成本分配策略\n\n在某些公司中，标签被用作有限数量账户的主要分配方法。这在产品较少且对成本中心拆分要求不那么严格的公司中更为常见。标签优先的公司经常面临的挑战是在他们应用广泛的标签策略以覆盖尽可能多的资源时出现。到了报告时间，他们会剩下大量未标记的支出。此外，有些支出根本无法标记，或者可以标记但随后并未反映在账单数据中。鉴于这两种挑战，基于层次结构的账户策略通常能提供最清晰的计费回溯选项。\n\
  \n## 将账户和项目组织成组\n\n三大云服务提供商都提供方法通过 AWS Organizations、Azure 管理组和 Google Cloud 文件夹将您的账户、项目和订阅组织成层次结构。\n\
  \n以下是根据 Google 对文件夹的文档说明分组工作原理的一个示例：\n\n文件夹可以包含项目、其他文件夹或两者组合。组织可以使用文件夹在层次结构中将项目分组到组织节点下。例如，您的组织可能包含多个部门，每个部门都有自己的\
  \ Google Cloud 资源集。文件夹允许您按部门对这些资源进行分组。文件夹用于对具有共同 IAM 策略的资源进行分组。虽然文件夹可以包含多个文件夹或资源，但给定的文件夹或资源只能有一个父级。\n\
  \n在图 12-2 中，组织 Company 拥有代表两个部门 Dept X 和 Dept Y 的文件夹，以及一个用于可能对两个部门都通用的项目的 Shared\
  \ Infrastructure 文件夹。在 Dept Y 下，他们已组织成两个团队，并在团队文件夹内进一步按产品组织。Product 1 的文件夹进一步包含三个项目，每个项目都有项目所需的资源。这为他们在合适的粒度级别分配\
  \ IAM 策略和组织策略提供了高度灵活性。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_206_0.png)\n\n\
  图 12-2. Google Cloud 内部的成本分配\n\n公司创建包含其他文件夹或项目的的，这在图 12-2 中显示。这种结构被称为文件夹层次结构。退一步看，从组织到文件夹再到项目的进展被称为资源层次结构。\n\
  \n## 标签和标记：最灵活的分配选项\n\n云服务提供商可能称呼它们不同，但从根本上说，标签和标记都提供以键/值对形式定义元数据的功能。这些标签随后与云账户中的资源关联。键就像电子表格上的列标题，而值是该列的行条目。\n\
  \n将键/值对想象成描述一堆衬衫。每件衬衫可能有一个标签键为 color，其标签值为 red、blue 或 green。如果您想找到红色和蓝色衬衫之间的成本差异，您可以使用颜色标签对成本进行分组并显示差异。\n\
  \n图 12-3 显示了一些使用 Environment 和 Tier 标签标记的云资源。这些标签提供了一种识别哪些资源来自生产环境与开发环境以及哪些资源支持服务的\
  \ 前端 而非 后端 的方法。对云服务提供商而言，标签仅仅是没有语义含义的字符字符串。因为标签仅对客户有意义，所以只要符合字符集和长度等语法限制，您就可以让它们成为您想要的任何内容。对标签键及其适当/批准值的清晰规划将确保您不会最终得到不一致应用的标签，从而阻碍未来的成本分配工作。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_207_0.png)\n\n图 12-3. 云资源的标签\n\n## 使用标签进行计费\n\
  \n在云账单中体现标签数据允许您按多个标签维度对成本进行分组。按每个团队排列成本——或按不同环境分组，例如开发与生产成本——将使您能够将费用分配到业务的正确领域。\n\
  \n标签允许您识别云账单上哪些项目可归因于您业务的每个服务。除了按这些标签维度（团队/服务/环境）对成本进行分组外，您还可以监控每个组的云计费的显著变化——因此更快地解决意外成本。\n\
  \n一些云服务提供商需要您提前选择希望导出到账单数据的标签键。其他提供商会导出与您的资源关联的每个标签。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_207_1.png)\n\
  \n对于允许您挑选标签的平台（如 AWS），我们警告不要过度并添加数百个标签。账单文件中额外、不必要的数据会增加——本已庞大——的数据大小并使分析更困难。\n\n\
  ## 尽早开始标记\n\n当您开始构建 FinOps 实践时，推迟困难的挑战，例如让团队标记其资源，很诱人。许多公司要么没有标记标准，要么有标准但未对其团队执行。必须认识到标签不会追溯应用。您必须提前规划标记策略以确保全面报告。\n\
  \n例如，在 1 月 1 日创建资源而不直到 2 月 1 日才为其分配标签，会导致所有 1 月的账单数据未标记，因此可能未分配。此外，标记资源但直到稍后日期才在计费中激活标签会导致标签分配出现空白。以后，当您需要分析账单数据以进行成本分配和本章后面将讨论的成本优化策略时，您会发现账单数据不具备您需要的分配历史。\n\
  \n标记是确保您在 FinOps 实践的更高级阶段拥有丰富数据集的重要早期步骤。如果还没说够：不要推迟您的标记策略。\n\n## 决定何时设定标记标准\n\n\
  实施标记标准的最佳时机是公司刚刚开始云之旅时。该标准应明确定义将应用于所有资源的标签键——以及标签可能包含的适当值。在工程师开始构建之前实施该标准并传达给他们将有助于确保良好的标签覆盖率并提供高质量数据。然而，许多公司已经构建了大型部署并且没有标记标准。别担心：现在应用标准并让工程师更新其资源并不为时已晚，只是需要一些工作。\n\
  \n人们抵制实施标记标准的情况并不少见，尤其是在已经部署了大量不符合新标记标准的资源时。获得领导层支持新标记标准的公司在整个组织中标签采用率更高。最初利用领导层授权——最终是文化变革——使标记成为\
  \ FinOps 团队乃至整个业务的必备要求，以鼓励广泛合规。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_209_0.png)\n\
  \n标签的价值 *确实* 超出了 FinOps 的范围，了解这些好处在企业试图实施标记标准时很有用。对于安全团队而言，标签可以识别受可能安全问题影响的资源所属的服务和团队。运营团队能够轻松确定资源出现问题通知时会受到影响的服务。组织中良好的标记策略将为许多不同利益相关者带来回报。\n\
  \n开始时标记标准考虑得越周全，未来需要修订的可能性就越小。如果您需要在团队刚刚完成之前策略的推广后返回要求他们更改一堆标签，您就不会交到朋友。\n\n随着业务在云上扩展，它将产生数千甚至数百万个资源费用，每个资源都有自己的标签。更改标记策略意味着团队必须更新所有这些资源。由于标签通常由\
  \ Terraform、CloudFormation 和 Azure Resource Manager (ARM) 模板等自动化基础设施应用，对自动化标签的更新需要在代码中推出。公司经常发现许多资源无法更新，最终导致半实现的标准。\n\
  \n## 选择合适的标签数量\n\n标记标准不应该强迫团队应用太多标签。对过多的标签要求只会引起对标准的抵制，从而导致不合规。始终牢记您需要回答的问题，并将您的标签策略与从账户层次结构中获得的数据相平衡。最好只要求核心元数据所需的标签。不要将所有标签定义为必需，而是定义可选标签，清楚地描述如果团队选择这样做应如何实施它们。\n\
  \n如果您不确定从何开始标记标准，以下是具有成功 FinOps 的公司实施的一些标签：\n\n- 一个 *cost center/business unit*\
  \ 标签，清楚地定义资源的成本应在组织内如何分配。\n- 一个 *service/workload name* 标签，标识资源所属的业务服务，使组织能够区分团队运行的服务之间的成本。\n\
  - 一个 *resource owner* 标签，帮助识别负责该资源的个人/团队。\n\n\n\n-   一个 *name* 标签，用于帮助识别资源，使用比云服务提供商给你的标识符更友好的标识符。\n\
  -   一个 *environment* 标签，用于帮助确定开发、测试/暂存和生产环境之间的成本差异。\n\n我们建议使用账户层级结构来替代最重要的一个或两个标签——例如成本中心和环境——然后使用标签来跟踪剩余的三个到五个必须跟踪的分配。粗粒度的账户层级结构提供了对少数维度的便捷映射，而标签则提供了额外业务维度的更精细细节。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_210_0.png)\n\n最成熟的 FinOps 实践使用标签将云资源连接到其他信息来源，例如配置管理数据库（CMDB）。这既能实现引用大量数据，也能实现更快速/更简单的流程，只需更新一次信息，而无需更正云资源上可能存在的数百万个标签。\n\
  \n## Working Within Tag/Label Restrictions\n\n最好确保你计划的标签策略（所需键和值）可在你计划使用的所有云服务提供商之间通用。某些云服务提供商的服务允许几乎任何字符，而其他服务则更严格。标签的长度也可能有限制，并且服务对每个资源支持的标签数量有限制。\n\
  \n你应确保你打算使用的服务能与你的建议策略兼容。否则，你可能最终需要在某个时候更改标签，或者最终会出现多个分组，其值略有不同。\n\n例如，你可能开始用 R&D\
  \ 为资源打标签，但后来才发现某个特定服务不支持 & 字符。这会给你两个选择：回头将所有现有的 R&D 资源重新标记为类似 RandD 的名称，或最终在账单中同时出现\
  \ R&D 和 RandD 两个值，导致成本在两个分组之间分散。一些 FinOps 工具提供事后修复不一致标签的方法，允许你应用规则来调整资源在其报告中的分配方式，而无需更改原始云支出数据。\n\
  \n某些云服务提供商允许你为更多资源类型打标签，而其他提供商则不允许，这可能是负责标记资源的员工常见的抱怨。重要的是要认识到所有支持标记的资源带来的好处，并持续推动你的云服务提供商为其资源类型增加更多标签支持。\n\
  \n即使你无法为所有资源打标签，也应努力尽可能多地标记。向支持标记的资源应用标签有很多业务优势。无法标记的资源（如 CloudWatch 费用）是我们建议除了标签之外还使用某种层级分组的原因之一。这样你就可以尽可能多地分配未标记的成本。\n\
  \n## Maintaining Tag Hygiene\n\n标签卫生是指你为确保标签系统（及其产生的数据）尽可能干净而采取的措施。如果没有适当的标签卫生，你可能会使用不准确的数据，进而影响决策的准确性。\n\
  \n一致性是标签卫生的关键。如果一个团队使用标签值 prod，而另一个团队使用 production，这些标签默认会在你的账单数据中作为单独的行项目分组。标签有时区分大小写，因此值\
  \ Enterprise 可能会与值 enterprise 分开报告。当人类创建标签时，常见会出现拼写错误、大小写差异和缩写。解决办法是通过自动化强制执行标签策略。诸如\
  \ Ansible、Terraform、Azure 资源管理器模板、Google Cloud Deployment Manager 和 AWS CloudFormation\
  \ 之类的基础设施自动化可以帮助确保一致性并避免人为错误。\n\n然而，即使在组织内部实施了最佳的自动化和部署实践，也不可避免地会出现一些资源在创建时缺少或标签无效的情况。这就是为什么有开源工具和第三方平台旨在在资源创建后不久将其删除或至少阻止的原因。这有助于限制账户内否则会产生的未分配/无法解释的成本数量。（我们将在\
  \ FinOps 生命周期中的运营阶段介绍自动化；参见第四部分。）\n\n另一个有效的方法是将标签从父资源（如实例）复制到子资源（例如卷、快照、网络接口）。通过将标签复制到子资源，你可以获得更大的标签覆盖率，并确保资源使用相关的标签集进行标记。我们见过成功的标签策略，例如仅要求标记\
  \ Azure 资源组，而不标记资源本身，而其他策略则标记两个层级并实施业务逻辑以在特定情况下决定使用哪个值。\n\n你甚至可以创建一些业务逻辑，将未标记的资源分配给默认成本中心。一个例子是为每个云账户应用默认成本中心。账户内的所有未标记成本随后将被分配给指定的默认成本中心。对于计费，你可以在资源本身通过更新标签来实现。或者你也可以在分析期间事后将此业务逻辑应用于账单文件。事后应用此逻辑的好处是，你可以在不进入账户并更新单个资源上的实际标签集的情况下更新业务逻辑。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_212_0.png)\n\n若要探索可帮助进行成本分配、标签卫生以及对成本报告应用逻辑的工具，请查看\
  \ FinOps.org 上的 FinOps 认证平台。\n\n## Reporting on Tag Performance\n\n为了确定组织内部的标签实践效果，你应拥有识别标签错误应用位置的报告。我们建议你通过有标签分配的云支出金额与无标签分配的金额来衡量标签覆盖率。以这种方式衡量，生命周期很短、成本很低的项目会被报告为不如运行时间长、成本高的资源重要。请记住，并非所有云服务提供商内部的资源都可标记，因此设定\
  \ 95% 的目标并制定流程来分配最后 5% 无法标记的资源更为现实。\n\n报告使你能够跟进相关团队以更新其自动化——至少手动更正标签。通过随时间跟踪不符合标签标准的资源数量，你可以判断组织在应用标签标准方面是否有所改善。拥有一个人人可见的最差违规者名单也有助于推动更彻底的标签采用。\n\
  \n## Getting Teams to Implement Tags\n\n我们经常听到的一个常见问题是，“关于如何让资源被标记，你有哪些最重要的建议？”我们再次请教\
  \ Ally Anderson，她的故事我们在上一章分享过。她与每个团队的工程联系人密切合作，并说，“如果有大量支出未被标记，我会通过报告让他们看到。”她发现，她越是持续地将数据呈现在团队负责人面前，标签就越容易被应用，仅仅通过建立实时数据反馈循环。她还得到了领导团队的支持。作为她的高管报告的一部分，Anderson\
  \ 将未标记支出作为持续报告的核心部分，这鼓励高管推动自己的团队尽量减少未标记成本。\n\n来自 Ancestry.com 的 Darek Gajewski 专注于“创建时标记”方法作为提高标签合规性的策略。由于云提供商不断增加更多支持，要求在启动基础设施之前设置某些标签，利用这一点可以极大地帮助提高标签覆盖率。\n\
  \n\n\n![](img/4d4736bc293fd892d1da81802d0f9520_213_0.png)\n\n要将本章中的所有概念整合成一个真实生活案例，请收听\
  \ FinOpsPod 播客的第 6 集《Attribution, Tags & Labels . . . OH MY!》，该集讲述了 Jason Rhoades\
  \ 的故事，介绍了 Intuit 如何在多年对标签、标签和账户结构的迭代中，启动、演进并成熟其归因策略。\n\n## 结论\n\n良好的 FinOps 实践应从精心设计的账户和标签策略开始。账户层级和标签为你的账单数据带来的额外元数据，将在今后的几乎所有报告和分析中发挥作用。\n\
  \n总结如下：\n\n-   你的账户分配策略将为资源提供结构并帮助你归类成本。\n-   让公司理解标签的重要性并致力于自动化标签，将使整个业务受益。\n-\
  \   由你的标签和账户分配构建的成本可见性和成本问责制将有助于在组织内部建立精益文化。\n-   标签和账户分配是 FinOps 生命周期优化阶段的常见要求。\n\
  \n首先制定成本分配策略——它将有助于几乎所有 FinOps 能力，尤其是我们在下一章中介绍的预测。\n"
- "## 精准预测\n\n*预测* 是预测未来支出的做法，通常基于历史支出趋势的组合和对未来计划的评估。其目的是了解未来云基础设施和应用生命周期变化可能如何影响预算，并帮助评估云投资决策。这也是\
  \ FinOps 中最难做对的事情之一。\n\n预测之所以困难，是因为它需要在工程师、财务和采购之间交叉，财务承担财务报告责任，采购承担会计责任，两者都需要工程师和高级管理人员的协助来履行这些义务并了解基础设施的计划变更。这些利益相关团队之间的协作对于构建商定的预测模型和\
  \ KPI 至关重要，从而制定与业务目标一致的预算。当这些团队构建可靠且准确的云支出预测模型时，云成本预测将为投资和运营决策提供信息，以加速组织的增长。\n\n\
  在本章中，我们讨论预测，解释为什么预测如此困难，并介绍提高其准确性所需的关键概念。\n\n传统的 IT 预测——在云之前——主要用于年度预算流程。对于数据中心设备，在进行系统增强或全新系统构建时，会提前计算总拥有成本（TCO）的预测。由于工程团队历史上并未参与或关心除为资本支出构建商业案例之外的\
  \ IT 支出预测，他们缺乏频繁预测以及与财务和业务协作的肌肉记忆。\n\n在传统的数据中心部署中，已知固定成本占很大比例，因此预测不准确的影响可能有限。然而，当你转向云的变动成本模式时，固定成本与变动成本的比例被颠倒，变动成本更大，预测的不准确可能产生实质性影响。\n\
  \n云中的频繁预测比数据中心部署更重要，并需要更多人之间的互动。\n\n## 云预测现状\n\n云支出的预测即使对于高级从业者而言也可能是一个难以掌握的挑战领域。在最新的《FinOps\
  \ 现状》调查中，它是第二常见的 FinOps 挑战，相当大一部分受访者——包括来自成熟实践的受访者——报告其预测准确性偏差超过 10%。当你的云账单达到每月数百万美元时，10%\
  \ 的偏差会迅速累积。\n\n与预测的偏差源于云成本的复杂性以及云资源的分布式消耗：当大量不同的人员和代码按需采购基础设施时，很难确定 6–12 个月后总计会是多少。这不仅仅是一个建模问题，也是一个人员和技术问题。\n\
  \n《FinOps 现状 2022》的受访者显示，与基准测试相比有所改善，表明与 2021 年调查的回复相比，预测变得更准确。最先进阶段的群体能够将预测控制在实际支出\
  \ 5% 的偏差范围内，而较不先进阶段的群体报告的偏差为 20% 或以上。精准预测耗时且需要自动化以及掌握其他 FinOps 实践以提高效率。\n\n高级阶段的受访者在刷新预测和相关云预算的周期上领先，尽管少数受访者以每周的频率生成预测，表明所有方面仍有很大改进空间。约\
  \ 21% 的受访者报告每年进行预测，这令人惊讶，考虑到云基础设施在一年内变化的变异性和速度，这可能是预测准确性成为 FinOps 团队主要挑战之一的可能原因。\n\
  \n> 它注定会出错。接受它并从一个有根据的猜测开始，但要快！\n> —Andrew Feig，JPMorgan Chase & Co. 的云工程管理总监\n\n\
  大量调查受访者表示他们不进行预测，导致他们在账单到达前盲目飞行，或者只是由于缺乏准确性而没有广泛传达他们的预测。\n\n## 预测方法\n\n让我们看看组织使用的预测方法。首先介绍这些基础知识很重要，因为你的组织可能对每种方法有不同的名称。明确各自的区别将有助于我们达成共同理解。\n\
  \n我们首先需要统一的第一组术语是生成预测本身的方法：\n\n## 朴素预测\n\n一种非常简单的方法，使用你之前的支出历史。朴素预测假设你下一个周期的云支出将与上一个周期相同。在图\
  \ 13-1 中，预测是历史实际数据的直接复制。这种预测方法对于云支出来说过于基础，因为云支出可能根据需求、业务事件和人为选择而迅速变化。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_217_0.png)\n\
  \n图 13-1. 朴素预测假设你下一个周期的支出将与上一个周期镜像\n\n## 基于趋势的预测\n\n也称为单变量预测，这种方法仍然使用过去的云支出历史作为预测基础，但也引入了一些统计元素——例如线性回归——以利用过去预测的趋势来预测未来期间的支出。在图\
  \ 13-2 中，云支出的历史趋势被用来预测未来期间。基于趋势的预测仅考虑你现有的历史支出，不引入未来期间可能发生变化的任何额外情景或业务驱动因素。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_218_0.png)\n\
  \n图 13-2. 基于趋势的预测\n\n## 基于驱动因素的预测\n\n也称为 *多元预测*，这种方法考虑其他业务指标来增强你的预测。将业务驱动因素与你的云支出联系起来可以提高预测的准确性，尤其是在该其他业务指标已以可接受的准确度进行预测时。这可以是手动调整预测的形式，也可以是向自动化预测算法提供多个输入数据源。在图\
  \ 13-3 中，基于趋势的预测根据与之前云支出相比由于外部驱动因素而产生的额外预期支出进行了调整。一些例子包括：\n\n-   营销举措带来的活动增加\n-\
  \   由于新产品发布导致云使用量的变化\n-   员工人数与研究与开发（R&D）云支出相比\n-   销售额/月活跃用户与生产（COGS）云支出相比\n\n\
  ![](img/4d4736bc293fd892d1da81802d0f9520_218_1.png)\n\n图 13-3. 基于驱动因素的预测\n\n\n\n\
  ## 预测模型\n\n现在让我们考虑你可能用来生成预测的工具或模型。我们不会详细介绍生成预测的不同算法或机器学习模型。本章的目的是帮助你思考云预测的方式，并考虑在\
  \ FinOps 中处理云支出预测的技术。如果你对预测的具体内容感兴趣，有很多优秀的书籍涵盖了预测，例如 Rob J. Hyndman 和 George Athanasopoulos\
  \ 合著的 *Forecasting: Principles and Practice*（OTexts，2021）。预测模型包括：\n\n### 机器学习预测\n\
  \n这是一个经常被过度使用的术语，用来描述预测技术。有些人认为只有深度学习模型才是真正的机器学习预测；其他人则将统计和其他非深度学习模型也归入此类。无论你选择使用哪种模型，我们都建议你多方比较。不要害怕尝试另一种模型。你使用的第一个模型不太可能是最好的。此外，还应考虑根据历史数据评估多个模型，以查看哪些模型会更准确。\n\
  \n### 组合预测\n\n这是一种将不同预测结合起来的方法，以使用多个模型实现更准确的预测。组合的一个简单方法是取多个模型结果的平均值。\n\n### 静态预测\n\
  \n这种类型的预测在设定的周期开始时生成一次，例如 12 个月。在周期结束之前不会更新，届时将为下一个周期生成新的预测。这种类型的预测适用于非常可预测的支出。\n\
  \n### 滚动预测\n\n这种类型的预测也在设定的周期开始时生成，例如 12 个月。然而，与静态预测不同，它会在周期期间频繁重新生成（每周、每月、每季度）。每次重新生成时，它都是为相同的时间长度创建的，\
  \ effectively 在预测范围的末尾添加了更多数据。\n\n## 云预测挑战\n\n要生成更准确的预测，你必须首先解决一组常见挑战。你可能已经在处理其中一些项目，因为解决预测所需的技能与第\
  \ 7 章中涵盖的 FinOps 基金会框架中的许多其他项目相关。取决于你的组织结构以及 FinOps 的成熟程度，其中一些挑战可能更容易解决。\n\n###\
  \ 手动与自动化预测\n\n预测通常最初是组织内财务或 FinOps 团队的手工练习。该练习可能使用一种朴素的方法，即使用之前的支出数字然后根据工程反馈进行调整，或将历史数据移入电子表格并使用公式生成一些基于趋势的预测。随着云支出的增长，这种手动方法变得困难，准确性也经常下降。低支出团队的成本通常被归为一个组并作为一个整体进行预测，从而降低了预测的颗粒度。生成这些预测所需的精力意味着频率非常低——每月、每季度或更少。\n\
  \n能够执行基于趋势或基于驱动因素预测的自动化预测工具使预测能够经常生成。在 2022 年的 State of FinOps 调查中，据报道最先进的从业者每周甚至每天执行预测。成熟的\
  \ FinOps 文化将导致更多工程团队承担其支出的责任，从而使他们对预测更感兴趣。\n\n### 不准确性\n\n寻找能够考虑云支出季节性的模型/工具。你的云支出不太可能全年都相同。能够考虑云支出起伏的预测将带来更高的准确性。\n\
  \n一些模型受数据中异常值的影响更大；异常造成的短暂突然飙升会导致预测不准确。一些模型能很好地处理异常值，而其他模型则需要你进行手动调整来修复它们。\n\n![](img/4d4736bc293fd892d1da81802d0f9520_220_0.png)\n\
  \n单一算法是不够的。一些预测算法在成本数据历史更长时效果更好，而其他算法能够使用有限的数据点。你可能会拥有具有长期数据历史的应用程序，但在引入新工作负载时，大多数预测算法都不会像预期那样有效。结合多种场景的算法集成方法是在历史可用性差异方面更有效的方式。\n\
  \n### 颗粒度\n\n在总云支出层面进行预测无法让你弄清楚哪些云支出个体组导致了预测不准确。此外，你的财务团队可能需要更精细的预测颗粒度来满足其报告要求。相反，在非常详细的层级生成预测可能需要比合理所需更多的精力，尤其是在你有大量支出很少的分组时。\n\
  \n第 12 章介绍了标签和标记，没有这些，生成任何颗粒度的预测几乎是不可能的。基于标签和层级的方法允许你将云支出划分为相关的类别，如成本中心、应用程序或环境。在更精细的颗粒度层面进行预测可以让你确定预测与实际不匹配的地方，并让你专注于这些领域以改进。\n\
  \n在生成颗粒度预测时，预计预测与汇总预测是一致的。使用图 13-4 中的支出层级，如果你按应用程序生成预测，预计将它们加总后会等于你的总云支出预测。然而，如果你为总云支出生成汇总预测，同时也在应用程序层级等颗粒度上生成预测，那么由于预测算法的统计特性，将所有颗粒度预测加总起来可能不会等于独立生成的汇总预测的总和。预测之间的差异将由颗粒度预测在应用程序层级的小不准确性以及汇总预测缺乏细节所驱动。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_221_0.png)\n\n图 13-4. 一个示例云支出层级\n\n你可以通过将预测方法限制在一个颗粒度层级来创建一致的预测。以图\
  \ 13-4 中的层级为例，大多数预测者使用的三种主要预测颗粒度方法如下：\n\n### 自下而上\n\n自下而上方法专注于最细粒度的云支出；我们的示例使用应用程序级支出。这种方法为每个应用程序创建单独的预测，然后汇总为更广泛的分类、团队，然后是总云支出。这种方法允许工程师和高管提供大量输入，从而提高颗粒度层级的准确性，并可能导致最准确的总支出预测。\n\
  \n### 自上而下\n\n自上而下方法专注于使用历史支出趋势和未来项目信息为总云支出生成预测。然后该预测会根据历史比例与未来项目预期相匹配分配给多个团队和应用程序。这种方法在应用程序间支出分布变化不大或没有变化时最成功，但在支出分布存在大幅波动的情况下会变得高度不准确。\n\
  \n### 中间向外\n\n生成一致预测的最后一种方法是中间向外。在图 13-4 示例中，这意味着在团队层级生成预测，然后汇总到总云支出层级并按比例分配到应用程序层级。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_222_0.png)\n\n为对你的报告最重要的颗粒度层级生成预测。应用中间向外方法汇总预测，然后在需要时应用历史比例将预测扩展到更细粒度的层级。\n\
  \n## 预测频率\n\n请记住云变化很快，变化越快你的预测就会越快过时。想象一下，你的工程师今天做出了一个决定，使其云支出每天增加 10 美元。在接下来的 12\
  \ 个月里，这一决定将累计增加超过 3,500 美元的支出。现在想想你有多少工程师每天都在做 10 美元的决定，一年 365 天。今天的 12 个月静态预测到年底将完全过时。\n\
  \nState of FinOps 中最先进的从业者报告称他们每周更新预测，尽管每月或每季度仍然是大多数人的最常见节奏。对于预测准确性来说，这时间太长而无法有效。\n\
  \n当你使用滚动预测更频繁地重新计算预测时，你可以保持对云支出更准确的预期；此外，你可以使用这些信息来找到推动预测变化的因素。这会更容易\n\n并且工程团队负责人查看过去一周的支出、发现与预期不符之处并纠正下周的预测，比按月或按季度进行要更快。\n\
  \n表13-1中的数据展示了五个应用的预测。该预测针对每个应用的月度支出，并每周生成。通过比较前后预测之间的差异，你可以轻松识别预测发生变化的地方，并发现App2是需要询问更多信息以更准确地了解预测变化的团队。\n\
  \n*表13-1. 周环比预测变化*\n\n| 应用 | 月度预测（第1周） | 月度预测（第2周） | 差异 |\n|---|---|---|---|\n|\
  \ App1 | $15,000 | $15,000 | $0 |\n| App2 | $25,000 | $30,000 | +$5,000 |\n| App3\
  \ | $10,000 | $9,000 | -$1,000 |\n| App4 | $5,000 | $6,000 | +$1,000 |\n| App5 |\
  \ $30,000 | $30,000 | $0 |\n| 合计 | $85,000 | $90,000 | $5,000 |\n\n> *我们没有一个人比所有人加起来更聪明。*\n\
  > —Ken Blanchard\n\n随着贵组织各地的工程师更接近成本差异的原因，他们识别成本驱动因素会更容易、更快。单个小的差异与总云支出相比可能微不足道，但对单个团队来说可能很重要，而许多小的差异累积起来可能达到实质性金额。为工程师提供细粒度的成本可见性和定期更新的预测，使您能够获得最大的收益。\n\
  \n## 沟通\n\n我们经常谈论使企业能够基于云的价值做出决策，而在这里，你需要这些决策反馈到预测流程中，以便被正确捕获和估算。无论多少机器驱动的预测，都无法准确预测工程师为其基础设施制定的变更以及这些变更如何影响云支出。在上一节中，我们举例说明了工程师在云支出上做出的小决策如何累积起来使贵组织的云预测不准确。在生成预测时，必须有一个开放的沟通渠道来捕获工程师的这些计划。重要的是，你需要将预测视为不仅仅是内部财务工作。预测需要让所有FinOps角色参与，并利用每个角色的专业知识来创建最准确的预测。\n\
  \n## 未来项目\n\n未来项目的[content]\n并且工程团队负责人查看过去一周的支出、发现与预期不符之处并纠正下周的预测，比按月或按季度进行要更快。\n\
  \n表13-1中的数据展示了五个应用的预测。该预测针对每个应用的月度支出，并每周生成。通过比较前后预测之间的差异，你可以轻松识别预测发生变化的地方，并发现App2是需要询问更多信息以更准确地了解预测变化的团队。\n\
  \n*表13-1. 周环比预测变化*\n\n| 应用 | 月度预测（第1周） | 月度预测（第2周） | 差异 |\n|---|---|---|---|\n|\
  \ App1 | $15,000 | $15,000 | $0 |\n| App2 | $25,000 | $30,000 | +$5,000 |\n| App3\
  \ | $10,000 | $9,000 | -$1,000 |\n| App4 | $5,000 | $6,000 | +$1,000 |\n| App5 |\
  \ $30,000 | $30,000 | $0 |\n| 合计 | $85,000 | $90,000 | $5,000 |\n\n> *我们没有一个人比所有人加起来更聪明。*\n\
  > —Ken Blanchard\n\n随着贵组织各地的工程师更接近成本差异的原因，他们识别成本驱动因素会更容易、更快。单个小的差异与总云支出相比可能微不足道，但对单个团队来说可能很重要，而许多小的差异累积起来可能达到实质性金额。为工程师提供细粒度的成本可见性和定期更新的预测，使您能够获得最大的收益。\n\
  \n## 沟通\n\n我们经常谈论使企业能够基于云的价值做出决策，而在这里，你需要这些决策反馈到预测流程中，以便被正确捕获和估算。无论多少机器驱动的预测，都无法准确预测工程师为其基础设施制定的变更以及这些变更如何影响云支出。在上一节中，我们举例说明了工程师在云支出上做出的小决策如何累积起来使贵组织的云预测不准确。在生成预测时，必须有一个开放的沟通渠道来捕获工程师的这些计划。重要的是，你需要将预测视为不仅仅是内部财务工作。预测需要让所有FinOps角色参与，并利用每个角色的专业知识来创建最准确的预测。\n\
  \n## 未来项目\n\n未来项目的影响范围从对总云支出影响极小的成本决策，到可能大规模改变企业利用和支出云的方式的大型成本决策。例如，将大型应用从数据中心迁移到云中，或将应用部署到多个新区域以在更多地点提供产品，都是可能影响云支出预测的大规模业务变更。这些大规模决策一旦做出，通常会为实际支出增加净新云支出，这使得任何机器驱动的预测都无法预测未来的增长。建立协作流程，以便工程团队有明确的方式让FinOps团队参与估算未来项目的成本影响。这将确保额外支出可以手动输入以补充预测并提高其准确性。你可以在表13-2中看到应用的自动预测以及额外手动输入的项目成本，以创建完整的预测。\n\
  \n表13-2. 周环比预测变化\n\n| 预测类型 | 应用 | 预测第1月 | 预测第2月 | 预测第3月 |\n|---|---|---|---|---|\n\
  | 自动 | App1 | $15,000 | $16,000 | $17,000 |\n|  | App2 | $25,000 | $30,000 | $35,000\
  \ |\n|  | App3 | $10,000 | $8,000 | $6,000 |\n|  | App4 | $5,000 | $5,000 | $5,000\
  \ |\n|  | App5 | $30,000 | $40,000 | $50,000 |\n| 手动 | Project A | $0 | $25,000\
  \ | $35,000 |\n|  | Project B | $0 | $0 | $10,000 |\n|  | 合计 | $85,000 | $124,000\
  \ | $158,000 |\n\n![](img/4d4736bc293fd892d1da81802d0f9520_224_0.png)\n\n需要谨慎的一项是工程师对未来项目额外云支出何时部署所做的估算。时间往往过于乐观，可能比最初预测的要晚得多。从工程师那里收集这些信息应是持续进行的，在项目落地之前不断更新预测，并随着最新预测的可用而逐步细化新支出的时间。\n\
  \n## 云端故事—Bharat Chadha\n\nBharat Chadha负责Freewheel的IT运营。他的预测之旅最初使用趋势预测，利用统计公式而未让工程师参与。他开始看到大差异，于是决定改为自下而上的方法，使用每月调查向账户负责人验证自动生成的预测。\n\
  \n通过使用业务驱动因素将收入与AWS成本的增长相关联，他能够调整云预算。他与CTO办公室合作获得支持，然后联系大约90名账户负责人每两周开会审查预测。出席率很高，他们专注于差异的主要驱动因素。账户负责人了解所使用的预测公式。他们已能实现82%–85%的预测准确率，这对财务部门来说足够，但随着时间的推移仍有改进空间。\n\
  \n他的经验教训：“看到趋势并将事件映射到特定月份确实很有帮助。你需要围绕标签进行良好的培训，例如在招聘工程师时，他们需要了解标签以及其重要性。文化很难改变；你需要在开始时设定期望。”\n\
  \n## 成本估算\n\n预测未来部署的成本对于工程团队来说可能非常困难，尤其是在没有现有概念验证工作或供应商提供的应用部署计算的情况下。\n\n所有主要云服务提供商提供的成本计算器有助于为新工作负载提供大致价值，但这些工具只能估算你手动输入到计算器中的项目的成本。由于云部署的复杂性和成本的细粒度，你的工程师很容易遗漏输入项目或低估操作新工作负载所需资源的大小/用量。\n\
  \n将设计相似的现有工作负载与引入的新工作负载进行比较可以帮助团队估算新工作负载的未来成本。让你的工程师比较引入的新工作负载的设计与现有工作负载，以确定是否有任何类似系统。在可能的情况下，使用现有工作负载将有助于识别使用成本计算器时可能遗漏的成本项目。如果没有现有系统，利用云的可变成本模型；让你的团队在测试环境中部署新工作负载并运行一小时左右。测试后，你就可以确定与工作负载测试运行相关的成本。\n\
  \n工程师在部署前最难估算的成本包括以下内容：\n\n- 网络流量成本\n  - 跨区域数据传输\n  - 跨可用区传输\n  - 如负载均衡器等单个资源处理的流量量\n\
  - 事件数量\n  - 函数即服务执行\n  - 队列中发送/接收的消息\n  - 数据库查询数量\n- 数据存储活动\n  - 有多少数据可以迁移到访问频率较低的层级\n\
  \  - 对各个对象的请求计数\n\n在供应商和开源领域，我们开始看到像Infracost这样的新工具，它使你的工程团队能够在将更改推广到云平台之前看到其成本影响的估算。这种左移使你的团队能够检查其更改是否会对成本产生预期影响。\n\
  \n无论是在工程师部署新基础设施之前，还是在他们部署现有基础设施的更新之前，频繁更新预测并沟通项目工作意味着随着工程师推进其项目，你的预测将被细化。工程团队之间的协作使你能够在更新到来时捕获预测中正在发生什么变化的反馈。\n\
  \n## 成本优化对预测的影响\n\n正如业务决策和新部署可以推动云支出增加一样，未来的云成本优化也可以大幅减少支出，也会使你的预测不准确。第三部分中的章节更详细地介绍了这些优化。现在，我们希望你理解，就像导致云支出增加的项目工作一样，你需要生成代表通过FinOps活动推动的云支出减少的预测效率计算，并将其从预测中减去。\n\
  \n在实施FinOps的早期阶段，随着你引入使用和费率优化，云支出可能会大幅减少。如果不在预测中预测这些减少，你可能会出现预测高于实际的情况。\n\n当你引入FinOps优化时，运营成本的降低可能会掩盖云支出的自然增长率。随着这些优化趋于稳定，支出的正常增长率将恢复；调整预测时需要对此建模，以便初始减少不会导致未来低估。\n\
  \n一个例子说明了当未考虑时FinOps优化如何影响预测，可以在图13-5中看到。随着2022-05开始FinOps活动，你会看到云支出的快速减少。几个月后，在2022-09，自然\n\
  \n云支出的增长回升。如果在 2022-04 生成预测时未考虑引入 FinOps 的预期影响，预测就会过高。如果相反预测是在 2022-07 生成的，下行趋势会影响预测，并且会掩盖当时的成本削减之下的云支出自然增长；如果未将其考虑在内，预测就会过低。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_227_0.png)\n\n图 13-5. 从 2022-05 开始实施\
  \ FinOps 活动时的示例云支出\n\n## 来自云端的故事——Drew Lowe\n\nDrew Lowe 领导 Hulu Disney 的 FinOps\
  \ 采购团队，与 Anthony Logan 合作。起初他的团队没有来自高层的授权，这使他们能够专注于政策。财务规划与分析（FP&A）缺乏技术深度，而工程师则不关心云成本。Hulu\
  \ 主要使用 AWS，部分工作负载在数据中心。Drew 的团队最终向 CFO 汇报。\n\n预测在工程师为下一个预算周期申请 4.5 倍于上一年支出的费用时达到转折点。分散的工程团队在不了解底层成本的情况下对产品做出定价决策。公司的目标和关键结果（OKRs）以观众为先。虽然\
  \ Drew 能够将支出与收入联系起来，但他担心过度支出。\n\n为所有工程师增加了一个关于预测准确性的关键 OKR。Drew 的团队从可靠的数据开始，确保他们可以信任这些数字。通过推动透明度，他能够建立需求驱动的预测，进而使他们能够优化支出。通过识别支出最高的团队并了解其工作负载，他的团队能够使大部分预测与预期保持一致。\n\
  \nDrew 使用混合预测模型，其中对主要服务使用基于业务驱动因素的预测，对长尾部分使用基于趋势的预测。这使他能够每月更新预测，平均偏差约为 2.5%，最坏情况约为\
  \ 9% 的偏差。为此，Drew 决定按工作负载而非云库存单位（SKU）进行预测。然而，工程波动性具有挑战性，例如预测负载测试或新服务。对于新服务，Drew 使用\
  \ SWAG 估算来跟踪其路线图上的这些特殊项目。\n\nDrew 的经验总结：“标签策略至关重要。与成本最高的工作负载密切合作效果非常好。首先与 CTO 和\
  \ CFO 建立关系，然后与工程负责人互动。”\n\n## 预测与预算\n\n预测和预算密不可分。我们很快会介绍预算生成的阶段，但重要的是要理解，使用预测来设定预算是使预算反映现实的主要因素之一。\n\
  \n如果你的趋势偏离了预测，你必须问自己：是否需要做出改变以使你重新与预测保持一致，还是需要更新预测？因此，你应该每天跟踪实际支出与预测的对比。云支出的图表应包含你的预测，以便确定是否需要采取任何行动（见图\
  \ 13-6）。然后将信息分解到团队层面，这可以让你看到是否有任何团队的行动导致你偏离预测。可能存在业务原因（合规、性能等），这意味着你应该选择简单地调整预测。\n\
  \n![](img/4d4736bc293fd892d1da81802d0f9520_228_0.png)\n\n图 13-6. 一张图表显示过去六个月的六个月预测、预计预算以及实际预算/使用情况\n\
  \nFinOps 社区普遍认为，云团队的预测应以滚动 3 至 12 个月为基准进行。Atlassian 以 3 个月为增量进行预测，但也会向前预测 3 年，以探索他们认为将处于的位置。我们合作过的一家大型媒体公司对此有变体：年度预测，分解为每月目标，每季度修订一次。\n\
  \n按季度或月度评估预测往往频率不够高。熟练的 FinOps 从业者会不断根据实时数据（有时是每日）评估差异，以查看哪些团队偏离了季度预测，然后迅速介入。这使他们能够在差异扩大之前提前应对。当实际值与预测不同，且决定维持支出增加时，该决定会在做出当天上报管理层。管理层与业务之间可以进行对话，以确定增加的支出产生的价值（如有）以及必要的补救措施。\n\
  \n这些持续的评估有助于企业在月度进展中做出更好的决策，同时显示支出最早可以向下弯曲的时间点。预算不应旨在阻止支出，而应提供识别支出偏离计划的工具——这，正如我们所记得的，使对话成为可能。\n\
  \n## 管理团队预算的重要性\n\n很容易将预算视为具有严苛限制的限制性控制。然而，预算不必也不应限制创新。如我们之前提到的（值得重复！），FinOps 不是关于省钱——而是关于赚钱。在\
  \ FinOps 中，预算是关于将投资集中于推动创新，而不是阻止创新。\n\n与工程团队就成本优化进行的初步对话通常并不富有成效。他们传统上不需要考虑成本，并且承受着不断交付更多、更快交付的压力。因此，他们可以理解地抵制花费宝贵的周期进行成本优化——这通常被视为别人的工作。\n\
  \n当 FinOps 从业者与架构团队坐下来审查成本发现时，从业者经常会遇到对建议的抵制，并且只有有时才会看到建议的更改得到实施。\n\n然而，如果团队被赋予具体的成本目标或需要达成的目标，他们往往会达成。来自管理层的节流建议会受到热烈欢迎。开发团队积极参与，并主动询问在保持速度和质量的同时如何削减成本。资源优化配置会发生，因为团队有明确的目标。由领导力驱动的成本优化文化会将他们招募为盟友，并提供他们如何帮助业务的可见性。他们开始理解\
  \ FinOps 不是关于削减资源，而是关于实现以成本为意识的速度和创新。\n\n对于许多科技独角兽公司来说，预算是一个忌讳的词。它是一种必要的恶，会分散他们试图在竞争激烈的增长市场中尽可能多地获取市场份额的注意力。他们沉浸在不断交付更大、更好的功能、引人入胜的内容或数据科学驱动的推荐的无休止军备竞赛中。存在一种毫无根据的假设，即预算会拖慢一切。\n\
  \n但对于大多数企业来说，预算是启动项目的必要步骤。在预算获批之前不会给予绿灯。云计算彻底改变了预算流程。过去靠采购订单的权力控制预算、防止支付超出计划的费用的日子已经一去不复返了。由于云支出的分布式和轻度治理特性，大多数组织——无论大小——都在公共云中难以准确预算。\n\
  \n像大多数事情一样，建立有效的预算是一个过程。以下是组织通常会经历的四种预算水平：\n\n### 第 1 级：根本没有预算\n\n在最近与一家知名科技独角兽的会议中，团队被问及他们如何为云支出定义预算。回答是摇头：“我们没有预算。我们不想限制工程师。”这家公司也意识到他们花费的比想要的多得多。该组织制定了未来三年云支出的计划，但由于该计划未下放到负责消耗云资源的各个团队，他们已经远远超过了他们与云服务提供商约定的支出。在这种情况下，他们完全忽视了预算，甚至没有进行知情忽视。\n\
  \n### 第 2 级：花去年的钱\n\n一家知名零售商的预算流程很简单，就是试图保持在公司上一年支出的范围内——采用静态预测并用其设定预算。尽管表面上这似乎是一个不错的起点，但它并非基于对公司支出是否与其所做工作相符的分析。非常类似于政府支出，它创造了错误的激励，鼓励团队花光预算，以免明年被削减。\n\
  \n这种预算类型——“先止血”方法——实际上在遏制失控的云支出方面相当有效。但它不会带来节省，也不会产生与业务目标挂钩的有意义的云支出衡量标准。它类似于在旧的以资本支出为主的数据中心采购世界中进行预算的方式。你查看当时拥有的资源和剩余容量，但对实际使用效率没有任何了解。\n\
  \n\n\n## Level 3: 成本削减目标\n\n成本削减目标会查看滚动预测中的预测支出，然后按规定金额进行削减。它们可以为团队提供正确的激励，但通常是任意的，且与任何具体的业务成果无关。一家在线杂货商的目标是减少整个组织的支出，并为每个团队设定了\
  \ 20% 的成本削减目标。这一目标相对容易实现，因为这是团队被赋予的第一个优化目标。毕竟，“所衡量的就会得到改进。” 有些机器正在运行完全可以终止，未使用的存储闲置着，并且有很多机会来优化资源规模并购买预留实例。随着时间的推移，成本削减方法开始出现两个问题。首先，后期期间的节省通常不如开始时那样显著，导致对\
  \ FinOps 本身价值的质疑；其次，关注总支出可能会开始推动影响系统性能或其他方面价值的成本削减。\n\n## Level 4: 单位经济绩效指标\n\n\
  在这里，公司开始将云支出与实际业务成果挂钩。如果你的业务正在增长并且在云中扩展，支出更多并不一定是坏事。尤其是当你知道服务客户的成本并持续将其降低时更是如此。正如你现在所知，将支出指标与业务指标挂钩是\
  \ FinOps 之旅中的关键一步，也是驱动因素预测的直接联系。任何人都可以看到单位成本是上升还是下降，但他们不知道原因，因此无法告诉你原因。要真正使分布式团队能够影响其支出，作业成本法是最后一步。我们将在第\
  \ 26 章更详细地讨论这一点。\n\n最终，重要的是所有掌控支出的人都了解他们在期间内相对于预算计划的跟踪情况。这让他们能及早知道如果情况不佳，需要进行哪些纠正措施才能达到目标。超支并不是唯一的问题：对于财务团队来说，支出不足同样糟糕，因为这意味着预算本可以用于更有用的地方。\n\
  \n> 我们持续努力改进的一件事是，随着获取更多信息，消除预测中的“占位符”。对于财务计划中几年后的估算，“占位符”是可以接受的，因为技术解决方案会有多个选项且尚未确定。随着工作负载得到更好定义，其预测也能够更明确，占位符应被评估并用置信度更高的估算替换。\n\
  \n> —Joshua Bauman, EA\n\n为了最好地掌舵，工程领导层需要在计划 adherence 与竞争性优先事项之间为组织做出最佳权衡。这意味着明确传达关于权衡选项的战略优先级指导，以及它们预计如何影响预测的云支出数据。\n\
  \n请记住，你也可以在预算上实践“有根据的忽视”。虽然大多数团队预计支出接近预算，但某些团队可以允许更高的预算不确定性。对于开发新产品或从事新战略机会的团队，只要他们瞄准的项目目标得以实现，你可以允许他们在计划上稍有偏差。\n\
  \n## Conclusion\n\n即使是最成熟的 FinOps 实践，准确预测也是一项挑战。无论你的方法如何，都应期望时间越近，准确性/具体性要求越高。下个季度应比两年后具有更高的置信度。你可以对预测云支出方式做出一些改变，以获得生成可靠预测的最佳机会。\n\
  \nTo summarize:\n\n总结：\n\n- Don't use static forecasting; choose instead a rolling\
  \ forecast model.\n- 不要使用静态预测；改用滚动预测模型。\n- Driver-based forecasting in conjunction\
  \ with forecasts that can handle seasonality and anomalies give the best baseline\
  \ forecast data.\n- 驱动因素预测与能够处理季节性和异常值的预测相结合，可提供最佳的基础预测数据。\n- Granular forecasts\
  \ are important for FinOps, but you will need to maintain coherence to summary forecasts.\n\
  - 细粒度的预测对 FinOps 很重要，但你需要保持与汇总预测的一致性。\n- Transitioning from traditional IT forecasting\
  \ to cloud spend forecasting involves getting all personas active in the forecasting\
  \ process.\n- 从传统 IT 预测转向云支出预测涉及让所有角色积极参与预测流程。\n- Augment the machine-generated\
  \ forecasts with feedback from both engineering and FinOps teams. Not every data\
  \ point is available in your historical data.\n- 用工程团队和 FinOps 团队的反馈来补充机器生成的预测。并非所有数据点都可在历史数据中找到。\n\
  - Budgets should be driven by forecasts and communicated down to the engineering\
  \ teams regularly, with guidance on trade-off expectations between budget adherence\
  \ and hitting other business objectives.\n- 预算应由预测驱动，并定期传达给工程团队，同时提供关于预算 adherence\
  \ 与实现其他业务目标之间权衡期望的指导。\n\nNow that you know what you expect to spend on cloud, let's\
  \ dig into ways to optimize cloud spending in the next phase: *optimize*, the focus\
  \ of Part III.\n\n现在你知道了预计在云上的支出，让我们深入探讨在下一阶段优化云支出的方法：*优化*，这是第三部分的核心。\n"

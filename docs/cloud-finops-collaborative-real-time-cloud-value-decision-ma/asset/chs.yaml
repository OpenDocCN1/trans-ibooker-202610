  允许区域，297\n阻止区域，297\n受限区域，297\n\n## 关于作者\n**J.R. Storment** 是 FinOps 基金会的执行董事，FinOps\
  \ 基金会是 Linux 基金会的一个项目，全球拥有近 10,000 名成员，并包括世界上大多数最大云支出者的参与。他曾是 Cloudability 的联合创始人，Cloudability\
  \ 是 2011 年至 2019 年云成本管理领域的先驱，2019 年被 Apptio 收购并成为其旗舰产品。收购后，他在 Cloudability 业务部门担任产品/工程副总裁和云总经理一年，然后离开，全职加入非营利组织\
  \ Linux 基金会，追求他推动 FinOps 领域从业人员发展的热情。截至 2023 年，他已与世界上最大的云消费者密切合作 13 年——从 Apple 到\
  \ Spotify 到 BP 到 Nike 到 Uber 到 GE——帮助他们通过技术、文化和流程设计优化和分析其云支出策略。J.R. 在多场 AWS re:Invent\
  \ 和美国、亚太地区、英国和欧盟的数十场会议上就 FinOps 主题发表演讲。他出生于俄勒冈州，在夏威夷长大，曾居住在旧金山、巴塞罗那和伦敦，现与妻子 Jessica\
  \ 和儿子 Oliver 一起回到俄勒冈州波特兰。他自认是双胞胎男孩的父亲，尽管 Oliver 的兄弟 Wiley 在本书第一版撰写期间于 2019 年去世。\n\
  \n**Mike Fuller** 是一名首席工程师，已在 Atlassian 从事云和 FinOps 工作超过十年。自撰写《Cloud FinOps》书籍第一版以来，Mike\
  \ 在 Atlassian 内部组建了专门的 FinOps 团队，将角色和职责从云卓越中心移出，形成了一个由数据工程师、分析师和 FinOps 实践者组成的小团队。Mike\
  \ 的团队帮助 Atlassian 从其在云上的支出中获得最大价值。作为 Atlassian 的首席工程师，Mike 也是 Insights 团队的架构师，负责优化领域专家（安全、合规、FinOps、可靠性）与\
  \ Atlassian 全球员工工程师互动的方式的策略。\n\nMike 持有卧龙岗大学计算机科学学士学位，并完成了九项 AWS 认证。他在多场 AWS re:Invent\
  \ 和 AWS Summit 活动中就 AWS 安全和 Cloud FinOps 等主题发表演讲。Mike 曾担任 FinOps 基金会技术顾问委员会成员，目前是其理事会成员。多年来，Mike\
  \ 在全球范围内结识了许多在各自组织中担任 FinOps 领导者的朋友。这些联系帮助塑造了 Mike 对 FinOps 成功意味着什么的思考。\n\nMike\
  \ 与妻子 Lesley 和两个孩子 Claire 和 Harrison 一起生活在澳大利亚南海岸。他们在让澳大利亚闻名的美丽海滩和乡村景观之间分配家庭时间。\n\
  \n\n\n## 版记\n\n封面上的动物是 *Cloud FinOps* 上的蓝头太阳鸟 (*Cyanomitra alinae*)。它们是生活在撒哈拉以南非洲大湖地区的小鸟。作为\
  \ Nectarinidae 科的成员，它们具有向下弯曲的喙和短翼，能够快速、直接飞行。它们具有性二态性，雄鸟的羽毛比雌鸟色彩丰富得多；它们的羽毛在明亮的红色眼睛映衬下闪耀着虹彩的蓝绿色。太阳鸟可以在卢旺达的\
  \ Nyungwe Forest National Park 国家公园的热带雨林到乌干达西南部 Bwindi-Impenetrable National Park\
  \ 国家公园的茂密山地森林之间任何地方找到。\n\n蓝头太阳鸟白天大部分时间在林缘和空地寻找食物。它以昆虫和小型蜘蛛为食，也吃花蜜，就像美国蜂鸟和澳大利亚吸蜜鸟一样。虽然与新大陆的对应物种无关，但太阳鸟也偏好以红色和橙色的管状花为食，并且具有刷状舌尖，可以提取花蜜。\n\
  \n蓝头太阳鸟在非洲生态系统中发挥着关键作用，因为非洲大陆许多最具代表性的植物（如芦荟、银合欢和天堂鸟花）依赖它进行授粉——以至于人们普遍认为太阳鸟一直是推动非洲植物物种形成的主要力量。\n\
  \nO'Reilly 封面上的许多动物都濒临灭绝；它们对世界都很重要。\n\n封面插图由 Karen Montgomery 绘制，基于 *Wood's Illustrated\
  \ Natural History* 中的黑白版画。封面字体为 Gilroy Semibold 和 Guardian Sans。正文字体为 Adobe Minion\
  \ Pro；标题字体为 Adobe Myriad Condensed；代码字体为 Dalton Maag 的 Ubuntu Mono。\n"

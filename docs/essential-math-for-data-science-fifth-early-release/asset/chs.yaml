- '# 数据科学的基础数学（第5版早期发布）

  '
- '## 前言


  在过去 10 年左右，人们对在日常工作和生活中应用数学和统计学的兴趣与日俱增。这是什么原因呢？是否与《哈佛商业评论》称为“21世纪最性感的职业”的“数据科学”兴趣加速有关？还是机器学习和“人工智能”将改变我们生活的承诺？是因为新闻标题充斥着各类研究、民调和研究结果，但人们不确定如何审视此类主张？还是因为“自动驾驶”汽车和机器人在不久的将来将自动化工作的承诺？


  我将论证，数学和统计学学科之所以引起主流兴趣，是因为数据日益普及，而我们需要数学、统计学和机器学习来理解这些数据。是的，我们确实拥有科学工具、机器学习和其他像塞壬一样召唤我们的自动化技术。我们盲目信任这些“黑盒”，即我们不理解的设备和软件，但我们还是使用它们。


  虽然轻易相信计算机比我们聪明（这一观点经常被营销），但现实恰恰相反。这种脱节在很多层面上都可能是危险的。你真的想要一个“算法”或“AI”来进行刑事判决或驾驶车辆，而包括开发者在内的无人能解释它为何做出特定决定吗？可解释性是统计计算和
  AI 的下一个前沿。只有当我们打开“黑盒”并揭示其中的数学时，这才能开始。


  你也可能会问，开发者怎么可能不了解自己的算法是如何工作的？我们将在本书后半部分讨论机器学习技术时谈及这一点，并强调为什么我们需要理解我们所构建的黑盒背后的数学。


  另外，数据之所以大规模被收集，很大程度上是因为联网设备及其在我们日常生活中的存在。我们不再仅仅在台式机或笔记本电脑上使用互联网。我们现在将互联网带在身边，用于智能手机、汽车和家用设备。过去二十年里，这微妙地促成了一种转变。数据已从一种运营工具演变为为一些目标不明确的目的而被收集和分析的东西。智能手表不断收集我们的心率、呼吸、步行距离和其他指标数据。然后，它将这些数据上传到云端，与其他用户的数据一起进行分析。我们的驾驶习惯正由计算机汽车收集，并由制造商用来收集数据并实现“自动驾驶”汽车。甚至“智能牙刷”也进入了药店，它们追踪刷牙习惯并将数据存储在云端。智能牙刷数据是否有用和重要，那是另一个讨论话题！


  所有这些数据收集都在渗透我们生活的每一个角落。这可能令人不知所措，可以写一整本书来讨论隐私问题和伦理。但数据的可用性也创造了以新方式利用数学和统计学的机会，并在学术环境之外创造更多曝光。我们可以更多地了解人类体验，改进产品设计和应用，并优化商业策略。如果你理解本书中提出的观点，你将能够解锁我们数据囤积基础设施中所蕴含的价值。这并不意味着数据和统计工具是解决世界所有问题的银弹，但它给了我们可以使用的新工具。有时，认识到某些数据项目是死胡同，并意识到精力应花在别处，同样有价值。


  数据的日益普及已为“数据科学”和“机器学习”成为受欢迎的职业铺平了道路。我们将必备数学定义为对概率、线性代数、统计学和机器学习的接触。如果你正在寻求数据科学、机器学习或工程领域的职业，这些话题是必要的。我会加入刚好足够的大学数学、微积分和统计学，以便更好地理解你将遇到的“黑盒”库中到底有什么。


  通过本书，我旨在让读者接触不同的数学、统计和机器学习领域，这些领域适用于现实世界的问题。前四章涵盖基础数学概念，包括实用微积分、概率、线性代数和统计学。最后三章将过渡到机器学习。教授机器学习的最终目的是整合我们所学的一切，并展示在使用机器学习和统计库时超越“黑盒”理解的实用见解。


  跟随示例所需的唯一工具是一台 Windows/Mac/Linux 计算机和你选择的 Python 3 环境。我们需要的主要 Python 库是 numpy、scipy、sympy
  和 sklearn。如果你不熟悉 Python，它是一种友好且易于使用的编程语言，拥有大量的学习资源。以下是我推荐的一些书籍：


  - Data Science from Scratch 2nd Edition (O’Reilly) by Joel Grus - 这本书的第二章是我遇到的最好的
  Python 速成课程。即使你从未编写过代码，Joel 也出色地让你在最短时间内有效地上手 Python。这也是一本值得放在书架上并应用你数学知识的好书！


  - Python for the Busy Java Developer (Apress) by Deepak Sarda - 如果你是来自静态类型、面向对象编程背景的软件工程师，这是你应该拿起的书。作为一个从
  Java 开始编程的人，我深深欣赏 Deepak 如何分享 Python 特性并将其与 Java 开发者联系起来。如果你做过 .NET、C++ 或其他类 C 语言，你可能也会从这本书中有效地学习
  Python。


  本书不会让你成为专家或赋予你博士水平的知识。我尽力避免充斥希腊符号的数学表达式，而是努力使用平实的英语来代替。但是，本书会让你更自在地谈论数学和统计学，为你提供在各个领域成功导航所需的基本知识。我相信



  通往成功的最广阔道路并非在于某一主题上拥有深厚的专业知识，而是在于涉猎多个主题并拥有实践知识。本书的目标正是如此，你将学到足够“危险”的知识，从而能够提出那些曾经难以捉摸的关键问题。


  那么，让我们开始吧！

  '
- "# 第 1 章. 基础数学与微积分回顾\n\n本章将首先介绍什么是数字，以及变量和函数如何在笛卡尔坐标系中工作。接着我们将介绍指数和对数。之后我们将学习微积分的两种基本运算：导数和积分。\n\
  \n在深入概率、线性代数、统计学和机器学习等核心数学应用领域之前，我们或许应该先回顾一些基础数学和微积分概念。在你扔掉这本书尖叫着逃跑之前，别担心！我会以一种你可能在大学里没有学过的方式，介绍如何对函数求导和积分。我们身边有Python，而不是铅笔和纸。即使你不熟悉导数和积分，也不必担心。\n\
  \n我会尽可能使这些主题简洁实用，只关注对后续章节有帮助且属于“核心数学”范畴的内容。\n\n> 这绝非一本完整的数学速成课！\n>\n> 这绝不是对高中和大学数学的全面回顾。如果你想要那样，一本值得查阅的好书是\
  \ Ivan Savov 所著的《数学和物理无废话指南》（恕我直言）。该书的前几章包含我见过的最好的高中和大学数学速成课。Dr. Richard Elwes 所著的《Mathematics\
  \ 1001》也有一些很棒的内容，并且采用小节解释的形式。\n\n## 数论\n\n什么是数字？我保证在这本书中不会过于哲学化，但数字不是我们定义的一种构造吗？为什么我们有0到9的数字，而不是更多数字？为什么我们有分数和小数，而不仅仅是整数？这个思考数字及其设计方式的数学领域被称为数论。\n\
  \n**数论**可以追溯到古代，当时数学家研究不同的数系以及我们为何以当前方式接受它们。以下是你可能认识的不同数系：\n\n### *自然数*\n\n这些是1、2、3、4、5……等等的数字。这里只包含正数，也是已知最早的系统。自然数如此古老，以至于穴居人曾在骨头和洞穴墙壁上刻划计数符号来保存记录。\n\
  \n### *非负整数*\n\n在自然数的基础上，“0”的概念后来被接受，我们称这些为“整数。”巴比伦人还开发了对于大于9的数字（如“10”、“1000”或“1090”）中空“列”占位符记数法的有用想法。这些零表示该列没有数值占据。\n\
  \n### *整数*\n\n整数包括正数和负数自然数以及0。我们可能视之理所当然，但古代数学家对负数的概念深感怀疑。但是，当你从3中减去5时，你会得到-2。这在财务领域尤其有用，我们在那里衡量盈亏。公元628年，一位名叫Brahmagupta的印度数学家展示了为什么负数对于利用二次公式推进算术是必要的，因此整数获得了接受。\n\
  \n### *有理数*\n\n任何可以表示为分数的数字（如2/3）都是有理数。这包括所有有限小数和整数，因为它们也可以表示为分数，例如687/100 = 6.87\
  \ 和 2/1 = 2。它们被称为有理数是因为它们是比率。有理数很快就被认为是必需的，因为时间、资源和其他数量并不总是可以用离散单位来衡量。牛奶不总是以加仑为单位出售。我们可能需要以加仑的部分来衡量它。如果我跑了12分钟，我不能被迫以整英里为单位来衡量，而实际上我跑了9/10英里。\n\
  \n### 无理数\n\n无理数不能表示为分数。这包括著名的π，某些数字的平方根（如√2），以及我们稍后将学习的欧拉数e。这些数字有无限多位小数，例如π = 3.141592653589793238462...\n\
  \n无理数背后有一段有趣的历史。希腊数学家毕达哥拉斯相信所有数字都是有理数。他如此热切地相信这一点，以至于他创立了一种祈祷数字10的宗教。“赐福于我们，神圣的数字，你生育了神和人！”他和他的追随者会祈祷（我不知道为什么“10”如此特别）。有一个传说称，他的一位追随者希帕索斯通过演示2的平方根来证明并非所有数字都是有理数。这严重动摇了毕达哥拉斯的信仰体系，他通过将希帕索斯溺死在海中来回应。\n\
  \n无论如何，我们现在知道并非所有数字都是有理数。\n\n### 实数\n\n实数包括有理数和无理数。在实际操作中，当你进行任何数据科学工作时，可以将你使用的任何小数视为实数。\n\
  \n### 复数和虚数\n\n当你对负数开平方根时，就会遇到这种数字类型。虽然虚数和复数在某些类型的问题中有相关性，但出于我们的目的，我们将大多避开它们。\n\n\
  在数据科学中，你会发现你的大部分（如果不是全部）工作将使用自然数、整数和实数。虚数可能出现在更高级的用例中，例如矩阵分解，我们将在第4章中涉及。\n\n###\
  \ 复数和虚数\n\n如果你确实想了解虚数，这里有一个很棒的YouTube播放列表[虚数是真实的](https://youtu.be/T647CGsu0VU)。\n\
  \n### 运算顺序\n\n希望你熟悉**运算顺序**，即求解数学表达式各部分的顺序。作为简要回顾，请记住你先计算括号中的组件，然后是指数，接着是乘法、除法、加法和减法。你可以通过助记符**PEMDAS**（Please\
  \ Excuse My Dear Aunt Sally，即括号、指数、乘法、除法、加法、减法）来记住运算顺序。\n\n以这个表达式为例：\n\n```\n2 \\\
  times \\frac{(3 + 2)^2}{5} - 4\n```\n\n首先我们计算括号(3 + 2)，结果为5。\n\n```\n2 \\times \\\
  frac{(5)^2}{5} - 4\n```\n\n接下来我们求解指数，可以看出就是对刚才求和的5进行平方。结果是25。\n\n$$ 2 \\times \\\
  frac{25}{5} - 4 $$\n\n接下来是乘法和除法。这两者的顺序可以互换，因为除法也是乘法（使用分数）。让我们继续将2与\\(\\frac{25}{5}\\\
  )相乘，得到\\(\\frac{50}{5}\\)。\n\n$$ \\frac{50}{5} - 4 $$\n\n接下来我们将执行除法，用50除以5，结果为10。\n\
  \n$$ 10 - 4 $$\n\n最后我们执行加法和减法。当然，10 - 4将给我们6。\n\n$$ 10 - 4 = 6 $$\n\n果不其然，如果我们用Python来表达这个，将打印出6.0，如示例1-1所示。\n\
  \n### *示例1-1. 在Python中求解表达式*\n\n```\nmy_value = 2 * (3 + 2)**2 / 5 - 4\nprint(my_value)\
  \ # prints 6.0\n```\n\n这可能很基础，但仍然至关重要。在代码中，即使没有它们也能得到正确结果，但在复杂表达式中大量使用括号也是一种好习惯，这样你可以掌控求值顺序。\n\
  \n在这里，我将表达式的分数部分用括号括起来，帮助将其与表达式的其余部分区分开来，如示例1-2所示。\n\n### *示例1-2. 在Python中使用括号以提高清晰度*\n\
  \n```\nmy_value = 2 * ((3 + 2)**2 / 5) - 4\nprint(my_value) # prints 6.0\n```\n\n\
  虽然两个示例在技术上都是正确的，但后一个示例对我们这些容易混淆的人来说更清晰。如果你或其他人对你的代码进行更改，括号在更改时提供了操作顺序的易于参考。这也为防止代码更改导致的错误提供了一道防线。\n\
  \n### 变量\n\n如果你使用Python或其他编程语言做过脚本编写，你就知道什么是变量。在数学中，**变量**是未指定或未知数字的命名占位符。\n\n你可能有一个表示任何实数的变量x，并且可以在不声明它是什么的情况下对该变量进行乘法运算。在示例1-3中，我们从用户那里获取变量输入x，并将其乘以3。\n\
  \n### *示例1-3. 然后相乘的Python变量*\n\n```\nx = int(input(\"Please input a number\\\\n\"\
  ))\nproduct = 3 * x\nprint(product)\n```\n\n某些变量类型有一些标准变量名。如果这些变量名和概念不熟悉，别担心！但其余读者可能认识，我们使用theta\
  \ θ表示角度，使用beta β表示线性回归中的参数。希腊符号在Python中是别扭的变量名，因此我们可能会在Python中将这些变量命名为theta和beta，如示例1-4所示。\n\
  \n### *示例1-4. Python中的希腊变量名*\n\n```\nbeta = 1.75\ntheta = 30.0\n```\n\n\n\n\n另请注意，变量名可以加下标，以便使用多个同名变量实例。出于实际目的，只需将它们视为单独的变量。如果您遇到变量\
  \ x1、x2 和 x3，只需像示例 1-5 中所示一样将它们视为三个单独的变量。\n\n## 函数\n\n函数是定义两个或多个变量之间关系的表达式。更具体地说，函数接受输入变量（也称为域变量或自变量），将其代入表达式，然后得出输出变量（也称为因变量）。\n\
  \n来看这个简单的线性函数：\n\n```\ny = 2x + 1\n```\n\n对于任何给定的 x 值，我们使用该 x 求解表达式以找到 y。当 x = 1\
  \ 时，y = 3。当 x = 2 时，y = 5。当 x = 3 时，y = 7，依此类推，如表 1-1 所示。\n\n### 表 1-1. 微分用途理论 =\
  \ 2x + 1\n\n| x | 2x + 1 | y |\n|---|---|---|\n| 0 | 2(0) + 1 | 1 |\n| 1 | 2(1)\
  \ + 1 | 3 |\n| 2 | 2(2) + 1 | 5 |\n| 3 | 2(3) + 1 | 7 |\n\n函数很有用，因为它们模拟了变量之间可预测的关系，例如在\
  \ x 温度下我们可以预期多少场火灾 y。我们将在第 5 章使用线性函数进行线性回归。\n\n对于因变量 y，您可能会看到另一种惯例，即将其明确标记为 x 的函数，例如\
  \ f(x)。因此，与其将函数表示为 y = 2x + 1，我们也可以将其表示为：\n\nf(x) = 2x + 1\n\n### 示例 1-6. 在 Python\
  \ 中声明线性函数\n\n```\ndef f(x):\n    return 2 * x + 1\n\nx_values = [0, 1, 2, 3]\n\n\
  for x in x_values:\n    y = f(x)\n    print(y)\n```\n\n在处理实数时，函数一个微妙但重要的特性是它们通常具有无限数量的\
  \ x 值和相应的 y 值。问问自己：我们可以向函数 $y = 2x + 1$ 输入多少个 x 值？与其只输入 0、1、2、3...，为什么不输入 0、0.5、1、1.5、2、2.5、3，如下表\
  \ 1-2 所示？\n\n### 表 1-2. y = 2x + 1 的微分方程\n\n| x | 2x + 1 | y |\n|---|---|---|\n\
  | 0.0 | 2(0) + 1 | 1 |\n| 0.5 | 2(.5) + 1 | 2 |\n| 1.0 | 2(1) + 1 | 3 |\n| 1.5 |\
  \ 2(1.5) + 1 | 4 |\n| 2.0 | 2(2) + 1 | 5 |\n| 2.5 | 2(2.5) + 1 | 6 |\n| 3.0 | 2(3)\
  \ + 1 | 7 |\n\n或者为什么不对 x 进行四分之一步长？或者十分之一步长？我们可以将这些步长无限小，从而有效地表明 \\(y = 2x + 1\\\
  ) 是一个**连续函数**，其中每个可能的 x 值都有一个对应的 y 值。这很好地引导我们将函数可视化为一条线，如图 1-1 所示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_20_0.png)\n\
  \n图 1-1. 函数 y = 2x + 1 的图像\n\n当我们在二维平面上使用两条数轴（每个变量一条）进行绘图时，这被称为**笛卡尔平面**、x-y 平面或**坐标平面**。我们追踪给定的\
  \ x 值，然后查找对应的 y 值，并将交点绘制成一条线。请注意，由于实数的性质（或者如果您喜欢，小数），存在无限数量的 x 值。这就是为什么当我们绘制函数 f(x)\
  \ 时，我们得到一条没有中断的连续线。该线或其任何部分上都有无限数量的点。\n\n如果您想使用 Python 绘制此图，有从 Plotly 到 matplotlib\
  \ 的多种绘图库。在整本书中，我们将使用 SymPy 完成许多任务，首先使用的就是绘制函数。SymPy 使用 matplotlib，因此请确保已安装该包。否则，它会在控制台中输出一个难看的文本图。之后，只需使用\
  \ symbols() 向 SymPy 声明 x 变量，声明您的函数，然后按示例 1-7 和图 1-2 所示进行绘图。\n\n### 示例 1-7. 使用 SymPy\
  \ 在 Python 中绘制线性函数\n\n```python\nfrom sympy import *\n\nx = symbols('x')\nf = 2*x\
  \ + 1\nplot(f)\n```\n\n![](img/8e0dcc1636d032e7728a07e97751e446_22_0.png)\n\n图 1-2.\
  \ 使用 SymPy 绘制线性函数\n\n示例 1-8 和图 1-3 是另一个示例，展示了函数 f(x) = x^2 + 1。\n\n### 示例 1-8. 使用\
  \ SymPy 在 Python 中绘制线性函数\n\n```\nfrom sympy import *\nx = symbols('x')\nf = x**2\
  \ + 1\nplot(f)\n```\n\n![](img/8e0dcc1636d032e7728a07e97751e446_23_0.png)\n\n图 1-3.\
  \ 使用 SymPy 绘制指数函数\n\n请注意，在图 1-3 中，我们得到的不是直线，而是一个称为抛物线的平滑、对称曲线。它是连续的但不是线性的，因为它不会沿直线产生值。像这样的曲线函数在数学上更难处理，但我们会学习一些技巧来使其不那么困难。\n\
  \n> **曲线函数**\n> \n> 当函数是连续但曲线的，而不是线性和直的时，我们称其为曲线函数。\n\n请注意，函数可以使用多个输入变量，而不仅仅是一个。例如，我们可以拥有自变量\
  \ x 和 y 的函数。请注意，y 不像之前的示例那样是因变量。\n\n\\(f(x, y) = 2x + 3y\\)\n\n由于我们有 2 个自变量（x 和\
  \ y）和 1 个因变量（f(x, y) 的输出），我们需要在 3 维上绘制此图以生成值平面而不是一条线，如示例 1-9 和图 1-4 所示。\n\n### 示例\
  \ 1-9. 在 Python 中声明带有 2 个自变量的函数：\n\n```\nfrom sympy import *\nfrom sympy.plotting\
  \ import plot3d\n\nx, y = symbols('x y')\nf = 2*x + 3*y\nplot3d(f)\n```\n\n![](img/8e0dcc1636d032e7728a07e97751e446_24_0.png)\n\
  \n图 1-4. 使用 SymPy 绘制三维函数\n\n无论您有多少个自变量，函数通常只输出一个因变量。当求解多个因变量时，您可能会为每个变量使用单独的函数。\n\
  \n## 求和\n\n我曾承诺在这本书中不使用充满希腊符号的方程。但是，有一个方程非常常见且有用，以至于不介绍它将是一种失职。**求和**用西格玛 \\(\\\
  Sigma\\) 表示，用于将元素相加。\n\n例如，如果我想迭代 1 到 5 的数字，将每个数字乘以 2，然后将它们求和，我将使用求和来表示如下。示例 1-10\
  \ 展示了如何在 Python 中执行此操作。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_25_0.png)\n\n\
  ### 示例 1-10. 在 Python 中执行求和\n\n```\nsummation = sum(2*i for i in range(1,6))\nprint(summation)\n\
  ```\n\n请注意，i 是占位符变量，表示循环中我们迭代的每个连续索引值，我们将其乘以 2 然后全部求和。在迭代数据时，您可能会看到类似 x_i 的变量，表示集合中索引\
  \ i 处的元素。\n\n### range() 函数\n\n请回顾，Python 中的 `range()` 函数是末尾不包含的，也就是说，如果您调用 `range(1,\
  \ 4)`，它将迭代数字 1、2 和 3。它将 4 作为上限排除在外。\n\n还常见将 $n$ 表示为集合中的项目数量，例如数据集中的记录数。下面是一个示例，我们迭代大小为\
  \ $n$ 的数字集合，将每个数字乘以 10，然后求和。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_26_0.png)\n\
  \n在示例 1-11 中，我们使用 Python 对 4 个数字的集合执行此表达式。请注意，在 Python（以及大多数编程语言）中，我们通常从索引 0 开始引用项目，而在数学中我们从索引\
  \ 1 开始。因此，我们在迭代时相应地进行偏移，在 `range()` 中从 0 开始。\n\n### 示例 1-11. Python 中元素的求和\n\n```\n\
  x = [1, 4, 6, 2]\nn = len(x)\n\nsummation = sum(10*x[i] for i in range(0,n))\nprint(summation)\n\
  ```\n\n这就是求和的要点。简而言之，求和 $\\Sigma$ 的意思是“把一堆东西加在一起”，并使用索引 $i$ 和最大值 $n$ 来表达每个输入求和的迭代。我们将在整本书中遇到它们。\n\
  \n\n\n\n\n## SYMPY 中的求和\n\n欢迎在您了解更多 SymPy 知识后再来查看此侧边栏。我们之前用于绘制函数的 SymPy，实际上是一个符号数学库，我们将在本章后面讨论这意味着什么。但请注意，以备将来参考，SymPy\
  \ 中的求和操作是使用 `Sum()` 算子执行的。下面在示例 1-12 中，我们将 `i` 从 1 迭代到 `n`，将每个 `i` 相乘并求和。但随后我们使用\
  \ `subs()` 函数将 `n` 指定为 5，然后它将迭代并求和 1 到 `n` 的所有 `i` 元素。\n\n### 示例 1-12.\n\n```\n\
  from sympy import *\n\ni,n = symbols('i n')\n\n# iterate each element i from 1 to\
  \ n,\n# then multiply and sum\nsummation = Sum(2*i,(i,1,n))\n\n# specify n as 5,\n\
  # iterating the numbers 1 through 5\nup_to_5 = summation.subs(n, 5)\nprint(up_to_5.doit())\
  \ # 30\n```\n\n请注意，SymPy 中的求和是惰性的，这意味着它们不会自动计算或简化。因此请使用 `doit()` 函数来执行表达式。\n\n##\
  \ 指数\n\n**指数** 是将一个数乘以自身指定次数的运算。当将 2 提升到 3 次幂（用 3 作为上标，表示为 2³）时，就是将三个 2 相乘：\n\n\
  2³ = 2*2*2 = 8\n\n**底数** 是我们进行幂运算的变量或值，而**指数** 是我们将底数值相乘的次数。对于表达式 $2^3$，2 是底数，3\
  \ 是指数。\n\n指数有一些有趣的性质。假设我们将 $x^2$ 和 $x^3$ 相乘。请观察下面当我用简单乘法展开指数，然后合并为单个指数时会发生什么：\n\n\
  $x^2 x^3 = (x*x)*(x*x*x) = x^{2+3} = x^5$\n\n当我们将相同底数的指数相乘时，我们只需相加指数，这称为**乘积法则**。请允许我再次强调，所有相乘指数的底数必须相同，乘积法则才适用。\n\
  \n让我们接下来探讨除法。当我们将 $x^2$ 除以 $x^5$ 时会发生什么？\n\n$\\frac{x^2}{x^5}\n\\frac{x*x}{x*x*x*x*x}\n\
  \\frac{1}{x*x*x}\n\\frac{1}{x^3} = x^{-3}$\n\n如您所见，当我们将 $x^2$ 除以 $x^5$ 时，可以在分子和分母中抵消两个\
  \ $x$，剩下 $\\frac{1}{x^3}$。当一个因子同时存在于分子和分母时，我们可以抵消该因子。\n\n您可能会想，那个 $x^{-3}$ 是怎么回事？这是一个引入负指数的好时机，负指数是将指数运算表示在分数分母的另一种方式。为了演示，$\\\
  frac{1}{x^3}$ 与 $x^{-3}$ 相同。\n\n$\\frac{1}{x^3} = x^{-3}$\n\n回到乘积法则，我们可以看到它也适用于负指数。为了获得对此的直觉，让我们换一种方式来解决这个问题。我们可以通过将\
  \ $x^5$ 的“5”指数设为负数，然后将其与 $x^2$ 相乘来表示两个指数的除法。当你添加一个负数时，它实际上是在执行减法。因此，如下所示，指数乘积法则中求和相乘指数仍然成立：\n\
  \n\\(\\frac{x^2}{x^5} = x^2 \\frac{1}{x^5} = x^2 x^{-5} = x^{2+-5} = x^{-3}\\)\n\
  \n最后但同样重要的是，你能想明白为什么任何底数的 0 次幂都是 1 吗？\n\n$x^0 = 1$\n\n获得这种直觉的最佳方法是推理：任何数除以它自身都等于\
  \ 1。如果你有 $\\frac{x^3}{x^3}$，从代数上很明显它简化为 1。但该表达式也求值为 $x^0$。\n\n$1 = \\frac{x^3}{x^3}\
  \ = x^3 x^{-3} = x^{3+-3} = x^0$\n\n根据过渡性，即如果 $a = b$ 且 $b = c$，那么 $a = c$，我们知道\
  \ $x^0 == 1$。\n\n## 使用 SYMPY 简化表达式\n\n如果您对简化代数表达式感到不自在，可以使用 SymPy 库来为您完成工作。示例 1-13\
  \ 展示了如何简化我们之前的示例。\n\n### 示例 1-13.\n\n```\nfrom sympy import *\n\nx = symbols('x')\n\
  expr = x**2 / x**5\nprint(expr) # x**(-3)\n```\n\n那分数指数呢？它们是表示根（例如平方根）的另一种方式。作为简要回顾，\\\
  (\\sqrt{4}\\) 问“什么数乘以自身会得到 4？”，答案当然是 2。请注意，\\(4^{1/2}\\) 与 \\(\\sqrt{4}\\) 相同。\n\
  \n\\(4^{1/2} = \\sqrt{4} = 2\\)\n\n立方根与平方根类似，但它们寻求一个数乘以自身 3 次得到结果。8 的立方根表示为 \\(\\\
  sqrt[3]{8}\\)，问“什么数乘以自身 3 次得到 8？”这个数是 2，因为 \\(2*2*2 = 8\\)。在指数中，立方根表示为分数指数，\\(\\\
  sqrt[3]{8}\\) 可以重新表示为 \\(8^{1/3}\\)。\n\n\\(8^{1/3} = \\sqrt[3]{8} = 2\\)\n\n为了回到原点，当你将\
  \ 8 的立方根乘以自身三次时会发生什么？这将撤销立方根并得到 8。或者，如果我们将立方根表示为分数指数 \\(8^{1/3}\\)，就会清楚我们将指数相加得到指数\
  \ 1。这也撤销了立方根。\n\n\\(\\sqrt[3]{8}*\\sqrt[3]{8}*\\sqrt[3]{8} = 8^{\\frac{1}{3}} \\\
  times 8^{\\frac{1}{3}} \\times 8^{\\frac{1}{3}} = 8^{\\frac{1}{3}+\\frac{1}{3}+\\\
  frac{1}{3}} = 8^1 = 8\\)\n\n还有一个性质：一个指数的指数将指数相乘。这称为**幂的乘方法则**。所以 \\((8^3)^2\\) 将简化为\
  \ \\(8^6\\)。\n\n\\((8^3)^2 = 8^{3\\times 2} = 8^6\\)\n\n如果您对此持怀疑态度，请尝试展开它，您会看到求和法则使其变得清晰：\n\
  \n\\((8^3)^2 = 8^3 8^3 = 8^{3+3} = 8^6\\)\n\n最后，当我们有一个分子不为 1 的分数指数时，例如 \\(8^{\\\
  frac{2}{3}}\\)，这意味着什么？好吧，那是先取 8 的立方根，然后将其平方。请看下面：\n\n\\( 8^{\\frac{2}{3}} = \\left(8^{\\\
  frac{1}{3}}\\right)^2 = 2^2 = 4 \\)\n\n是的，无理数可以作为指数，例如 \\( 8^\\pi \\) 约为 687.2913。这可能感觉不直观，也可以理解！出于时间考虑，我们不会深入探讨，因为这需要一些微积分知识。但本质上，我们可以通过用有理数近似来计算无理指数。这实际上就是计算机所做的，因为它们只能计算到有限的小数位数。\n\
  \n例如，$\\pi$ 有无限多位小数。但如果我们取前 11 位数字，3.1415926535，我们可以将 $\\pi$ 近似为有理数 \\( 31415926535\
  \ \\, / \\, 10000000000 \\）。果然，这给了我们大约 687.2913，这应该与任何计算器的结果大约一致。\n\n\\( 8^\\pi\
  \ \\approx 8^{\\frac{31415926535}{10000000000}} \\approx 687.2913 \\)\n\n## 对数\n\
  \n**对数** 是一个数学函数，用于为特定数值和底数求幂。乍一看可能不太有趣，但它实际上有许多应用。从测量地震到管理立体声音量，对数无处不在。它也广泛应用于机器学习和数据科学。事实上，对数将成为**第\
  \ 6 章**中逻辑回归的关键部分。\n\n开始思考，问问自己“2 乘以 _多少次方_ 得到 8？”一种表达这种数学运算的方法是使用 _x_ 作为指数：\n\n\
  \\( 2^x = 8 \\)\n\n我们直观地知道答案，\\( x = 3 \\)，但我们需要一种更优雅的方式来表达这个常见的数学运算。这就是 \\( \\\
  log() \\) 函数的用途。\n\nlog_2 8 = x\n\n如您在上面的对数表达式中所见，我们有一个底数为 2，并寻找一个幂使结果为 8。更一般地，我们可以将变量指数重新表示为对数：\n\
  \na^x = b\nlog_a b = x\n\n从代数上讲，这是一种隔离 x 的方法，这对于求解 x 很重要。示例 1-14 展示了如何在 Python 中计算这个对数。\n\
  \n### 示例 1-14. 在 Python 中使用 log 函数：\n\n```\nfrom math import log\n\n# 2 raised to\
  \ what power gives me 8?\nx = log(8, 2)\n\nprint(x) # prints 3.0\n```\n\n当您在类似 Python\
  \ 的平台上不向 log() 函数提供底数参数时，它通常会有一个默认底数。在某些领域，例如地震测量中，log 的默认底数是 10。但在数据科学中，log 的默认底数是欧拉数\
  \ e。Python 使用后者，我们很快会讨论 e。\n\n就像指数一样，对数在乘法、除法、幂运算等方面也有几个性质。出于时间和重点考虑，我将下面在表 1-3\
  \ 中列出。关键思路是，对数为给定的底数寻找一个指数，使其结果为某个数字。\n\n如果您需要深入了解对数性质，表 1-3 将指数和对数的行为并列显示，供您参考。\n\
  \n\n\n\n\n## 表 1-3. 指数和对数的属性\n\n| 运算符 | 指数属性 | 对数属性 |\n|---|---|---|\n| 乘法 | \\\
  (x^m \\times x^n = x^{m+n}\\) | \\(log(a \\times b) = log(a) + log(b)\\) |\n| 除法\
  \ | \\(\\frac{x^m}{x^n} = x^{m-n}\\) | \\(log\\left(\\frac{a}{b}\\right) = log(a)\
  \ - log(b)\\) |\n| 指数运算 | \\((x^m)^n = x^{mn}\\) | \\(log(a^n) = n \\times log(a)\\\
  ) |\n| 零指数 | \\(x^0 = 1\\) | \\(log(1) = 0\\) |\n| 逆数 | \\(x^{-1} = \\frac{1}{x}\\\
  ) | \\(log(x^{-1}) = log\\left(\\frac{1}{x}\\right) = -log(x)\\) |\n\n## 欧拉数与自然对数\n\
  \n数学中有一个经常出现的特殊数字，叫做欧拉数 \\(e\\)。它是一个类似圆周率 \\(\\pi\\) 的特殊数字，约等于 2.71828。\\(e\\) 被大量使用，因为它在数学上简化了许多问题。\n\
  \n高中时，我的微积分老师在几个指数问题中演示了欧拉数。最后我问：“诺厄先生，究竟什么是 \\(e\\)？它从哪里来？”我记得对涉及兔群和其他自然现象的解释从未完全满意。我希望在这里给出一个更令人满意的解释。\n\
  \n### 为何欧拉数被广泛使用\n\n欧拉数的一个属性是，其指数函数的导数是其自身，这使得它在指数函数和对数函数中非常方便。我们将在本章后面学习导数。在许多底数其实无关紧要的应用中，我们会选择导数最简单的那个底数，而这就是欧拉数。这也是为什么在许多数据科学函数中，它是默认底数。\n\
  \n以下是我发现欧拉数的喜欢方式。假设你以年利率 20% 向某人贷款 100 美元。通常利息按月复利，因此每月利率为 .20/12 = .01666。两年后贷款余额会是多少？为了简化，我们假设贷款在这两年结束前不需要还款（且未进行任何还款）。\n\
  \n结合我们迄今学习的指数概念（或者也许从金融教材中查出），我们可以得出一个计算利息的公式。它由初始投资 $P$ 对应的余额 $A$、利率 $r、时间跨度 $t$（年数）和每期数\
  \ $n$（每年月数）组成。公式如下：\n\nA = P \\times (1 + \\frac{r}{n})^{nt}\n\n因此，如果按月复利，贷款将增长到\
  \ 148.69 美元，计算如下：\n\nA = P \\times (1 + \\frac{r}{n})^{nt}\n\n100 \\times \\left(1\
  \ + \\frac{.20}{12}\\right)^{12 \\times 2} = 148.6914618\n\n如果要在 Python 中执行此操作，请尝试使用示例\
  \ 1-15 中的代码。\n\n### 示例 1-15. 在 Python 中计算复利\n\n```python\nfrom math import exp\n\
  \np = 100\nr = .20\nt = 2.0\nn = 12\n\na = p * (1 + (r/n))**(n * t)\n\nprint(a)\
  \ # prints 148.69146179463576\n```\n\n但如果按日复利会怎样？会发生什么？将 n 改为 365。\n\n$$A = P \\\
  times \\left(1 + \\frac{r}{n}\\right)^{nt}$$\n\n$$100 \\times \\left(1 + \\frac{.20}{365}\\\
  right)^{365\\times2} = 149.1661279$$\n\n嘿！如果按日复利而不是按月复利，两年后我们将多赚 47.4666 美分。如果想更贪心，为什么不按每小时复利，如下所示？这会带来更多收益吗？一年有\
  \ 8760 小时，因此将 n 设置为该值：\n\n$$A = P \\times \\left(1 + \\frac{r}{n}\\right)^{nt}$$\n\
  \n$$100 \\times \\left(1 + \\frac{.20}{8760}\\right)^{8760\\times2} = 149.1817886$$\n\
  \n啊，我们又多挤出了大约 2 美分的利息！但我们是否遇到了边际递减？让我们尝试按每分钟复利！请注意，一年有 525,600 分钟，因此将 n 设置为该值：\n\
  \n$$A = P \\times \\left(1 + \\frac{r}{n}\\right)^{nt}$$\n\n$$100 \\times \\left(1\
  \ + \\frac{.20}{525600}\\right)^{525600\\times2} = 149.1824584$$\n\n好吧，复利频率越高，我们获得的美分分数就越来越小。所以，如果我将这些周期不断缩小直到无限小，达到连续复利的程度，这会带来什么结果呢？\n\
  \n让我向你介绍欧拉数 e，约等于 2.71828。以下是“连续复利”的公式，意味着我们不断地进行复利：\n\n$$A = P \\times e^{rt}$$\n\
  \n回到我们的示例，让我们计算如果按连续复利计算，2 年后贷款的余额：\n\n$$A = P \\times e^{rt}$$\n\n$$A = 100 \\\
  times e^{.20 \\times 2} = 149.1824698$$\n\n好吧，考虑到按每分钟复利得到的余额为 149.1824584，这并不太令人惊讶。这已经非常接近连续复利时的值\
  \ 149.1824698 了。\n\n通常，你在 Python、Excel 和其他平台上使用 exp() 函数将 e 作为指数底数。你会发现 e 使用非常普遍，它既是指数函数也是对数函数的默认底数。\n\
  \n示例 1-16 使用 Python 中的 exp() 函数计算连续复利。\n\n### 示例 1-16. 在 Python 中计算连续复利\n\n```python\n\
  from math import exp\n\np = 100 # principal, starting amount\nr = .20 # interest\
  \ rate, by year\nt = 2.0 # time, number of years\n\na = p * exp(r*t)\n\nprint(a)\
  \ # prints 149.18246976412703\n```\n\n那么这个常数 e 从哪里来？比较复利公式和连续复利公式。它们在结构上看起来相似，但有一些区别：\n\
  \n\\( A = P \\times \\left( 1 + \\frac{r}{n} \\right)^{nt} \\)\n\n\\( A = P \\times\
  \ e^{rt} \\)\n\n从更技术的角度来说，\\( e \\) 是表达式 \\( (1 + \\frac{1}{n})^n \\) 当 \\( n \\\
  ) 越来越大、趋近于无穷大时的结果值。尝试使用越来越大的 \\( n \\) 值进行实验。通过不断增大 \\( n \\)，你会注意到一件事：\n\n\\( \\\
  left( 1 + \\frac{1}{n} \\right)^n \\)\n\n\\( \\left( 1 + \\frac{1}{100} \\right)^{100}\
  \ = 2.70481382942 \\)\n\n\\( \\left( 1 + \\frac{1}{1000} \\right)^{1000} = 2.71692393224\
  \ \\)\n\n\\( \\left( 1 + \\frac{1}{10000} \\right)^{10000} = 2.71814592682 \\)\n\
  \n\\( \\left( 1 + \\frac{1}{100000000} \\right)^{100000000} = 2.71828169413 \\)\n\
  \n随着 \\( n \\) 越来越大，收益会递减，并且它大约收敛于 2.71828 的值，即我们的值 \\( e \\)。你会发现这个数字 \\( e \\\
  ) 不仅用于研究种群及其增长。它在数学的许多领域中发挥着关键作用。\n\n在本书后面，我们将使用欧拉数在第 3 章构建正态分布，在第 6 章构建逻辑回归。\n\n\
  ## 自然对数\n\n当我们使用 $e$ 作为对数的底数时，我们称之为**自然对数**。根据平台不同，我们可能会使用 `ln()` 而不是 `log()` 来指定自然对数。因此，与其将自然对数表示为\
  \ $log_e10$ 来求 $e$ 的多少次方等于 10，我们会将其简写为 $ln(10)$。\n\n$log_e10 = ln(10)$\n\n然而在 Python\
  \ 中，自然对数由 `log()` 函数指定。如前所述，`log()` 函数的默认底数是 $e$。只需将底数的第二个参数留空，它就会默认使用 $e$ 作为底数，如示例\
  \ 1-17 所示。\n\n### 示例 1-17. 在 Python 中计算 10 的自然对数\n\n```python\nfrom math import\
  \ log\n\n# e raised to what power gives us 10?\nx = log(10)\n\nprint(x) # prints\
  \ 2.302585092994046\n```\n\n在本书的多个地方，我们将使用 $e。请随意使用 Excel、Python、Desmos.com 或任何其他你选择的计算平台，尝试指数和对数一段时间。制作图表，熟悉这些函数的形状。\n\
  \n## 极限\n\n正如我们通过欧拉数所看到的，当我们永远增加或减少一个输入变量，而输出变量不断接近某个值却从未达到它时，会出现一些有趣的想法。让我们正式探索这个想法。\n\
  \n请看图 1-5 中绘制的这个函数：\n\n$f(x) = \\frac{1}{x}$\n\n![](img/8e0dcc1636d032e7728a07e97751e446_40_0.png)\n\
  \n图 1-5. 在任一方向永远趋近于 0 但从未达到 0 的函数\n\n我们只考虑正 x 值。请注意，当 x 永远增加时，f(x) 会越来越接近 0。令人着迷的是，f(x)\
  \ 实际上永远不会达到 0。它只是永远越来越接近。\n\n因此，这个函数的命运是，当 x 永远延伸至无穷大时，它将不断接近 0 但永远不会达到 0。表达一个永远被接近但从未达到的值的方式，是通过极限。\n\
  \n```\n\\lim_{x \\to \\infty} \\frac{1}{x} = 0\n```\n\n读法为“当 x 趋近于无穷大时，函数 1/x 趋近于\
  \ 0（但从未达到 0）。” 这种“趋近但从不接触”的行为你会经常看到，尤其是当我们深入学习导数和积分时。\n\n\n\n\n\n使用 SymPy，我们可以计算当\
  \ \\( x \\) 趋近于无穷大 \\( \\infty \\) 时，\\( f(x) = \\frac{1}{x} \\) 趋近于什么值。请注意，SymPy\
  \ 中用 \\( \\infty \\) 巧妙地表达了 $\\infty$。\n\n### 示例 1-18. 使用 SymPy 计算极限\n\n```python\n\
  from sympy import *\nx = symbols('x')\nf = 1 / x\nresult = limit(f, x, oo)\nprint(result)\
  \ # 0\n```\n\n如你所见，我们也是以这种方式发现了欧拉数 \\( e \\)。它是将该函数中的 \\( n \\) 永无止境地延伸到无穷大所得的结果。\n\
  \n\\[\\lim_{n\\to\\infty} \\left(1 + \\frac{1}{n}\\right)^n = e = 2.71828169413..\\\
  ]\n\n有趣的是，当我们使用 SymPy 中的极限计算欧拉数时（如示例 1-19 所示），SymPy 会立即将其识别为欧拉数。我们可以调用 `evalf()`\
  \ 以便将其显示为数字。\n\n### 示例 1-19.\n\n```python\nfrom sympy import *\nn = symbols('n')\n\
  f = (1 + (1/n))**n\nresult = limit(f, n, oo)\nprint(result) # E\nprint(result.evalf())\
  \ # 2.71828182845905\n```\n\n## SymPy 的强大之处\n\nSymPy 是 Python 的一个强大而出色的计算机代数系统（CAS），它使用精确的符号计算，而不是使用小数进行近似计算。在你会用“铅笔和纸”来解决数学和微积分问题的那些场景中，它非常有帮助，而且还能使用你熟悉的\
  \ Python 语法。它不会将 2 的平方根近似表示为 1.4142135623730951，而是会将其精确地保留为 *sqrt(2)*。\n\n那么，为什么不为所有与数学相关的事情都使用\
  \ SymPy 呢？尽管我们会在本书中一直使用它，但使用普通小数进行 Python 数学运算仍然很重要，因为 SciKit-Learn 和其他数据科学库也是采用这种方法。对于计算机来说，使用小数比使用符号快得多。当数学表达式变得过大时，SymPy\
  \ 也会感到吃力。但请将 SymPy 作为你的秘密武器随时备用，不要告诉你的高中和大学生孩子。他们可以直接用它来做数学作业。\n\nhttps://docs.sympy.org/latest/tutorial/intro.html\n\
  \n## 导数\n\n让我们回到函数的话题，从微积分的角度来看待它们，从导数开始。导数告诉我们函数的斜率，并且有助于测量函数中任何一点的变化率。\n\n为什么我们要关心导数？它们经常用于机器学习和其他数学算法，尤其是梯度下降。当斜率为\
  \ 0 时，这意味着我们处于输出变量的最小值或最大值。在以后进行线性回归（第 5 章）、逻辑回归（第 6 章）和神经网络（第 7 章）时，这个概念将很有用。\n\
  \n让我们从一个简单的例子开始。让我们看看图 1-6 中的函数 \\( f(x) = x^2 \\)。在 \\( x = 2 \\) 处，曲线有“陡”吗？\n\n\
  ![](img/8e0dcc1636d032e7728a07e97751e446_44_0.png)\n\n图 1-6. 观察函数给定部分的陡峭程度\n\n请注意，如上所述，我们可以测量曲线上任意点的“陡峭程度”，并可以用一条切线来可视化这一点。将\
  \ **切线** 视为在给定点处“刚好接触”曲线的一条直线。它还提供给定点处的斜率。你可以通过创建一条与该 x 值和函数上 *非常接近* 的相邻 x 值相交的直线，来粗略地估计给定\
  \ x 值处的切线。\n\n取 x = 2 和附近的值 x = 2.1，将它们传递给函数 f(x) = x^2，将得到 f(2) = 4 和 f(2.1) =\
  \ 4.41，如图 1-7 所示。通过这两点的直线的斜率为 4.1。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_46_0.png)\n\
  \n图 1-7. 计算斜率的一种粗糙方法\n\n你可以使用简单的升降比公式快速计算两点之间的斜率 m：\n\n$$m = \\frac{y_2 - y_1}{x_2\
  \ - x_1}$$\n\n$$m = \\frac{4.41 - 4.0}{2.1 - 2.0}$$\n\n$$m = 4.1$$\n\n如果我将两点之间的\
  \ x 步长设得更小，例如 x = 2 和 x = 2.00001，这将产生 f(2) = 4 和 f(2.00001) = 4.00004，这将非常接近实际斜率\
  \ 4。因此，我们相邻值的步长越小，就越接近曲线上给定点处的斜率值。与数学中许多重要概念一样，当我们趋近于无穷大或无穷小的值时，会发现有意义的东西。\n\n###\
  \ 示例 1-20. Python 中的导数计算器\n\n```python\ndef derivative_x(f, x, step_size):\n   \
  \ m = (f(x + step_size) - f(x)) / ((x + step_size) - x)\n    return m\n\ndef my_function(x):\n\
  \    return x**2\n\nslope_at_2 = derivative_x(my_function, 2, .00001)\nprint(slope_at_2)\
  \ # prints 4.000010000000827\n```\n\n好消息是，有一种更干净的方法可以计算函数上任意位置的斜率。我们一直在使用 SymPy\
  \ 来绘制图形，但我会向你展示它如何利用符号计算的魔力为你执行导数等任务。\n\n当你遇到类似 f(x) = x^2 的指数函数时，导数函数会将指数变为乘数，然后将指数减\
  \ 1，留给我们导数 \\frac{d}{dx} x^2 = 2x。\\frac{d}{dx} 表示对 x 求导，也就是说我们构建了一个针对 x 值以获取其斜率的导数。因此，如果我们想找到\
  \ x = 2 处的斜率，并且拥有导数函数，只需代入该 x 值即可得到斜率。\n\n$$f(x) = x^2$$\n\n$$\\frac{d}{dx}f(x)\
  \ = \\frac{d}{dx}x^2 = 2x$$\n\n$$\\frac{d}{dx}f(2) = 2(2) = 4$$\n\n如果你打算学习这些规则来手动计算导数，有很多微积分书籍可供参考。但有一些很好的工具可以为你符号化地计算导数。Python\
  \ 库 SymPy 是免费且开源的，并且很好地适应了 Python 语法的使用。示例 1-21 展示了我们如何在 SymPy 上计算 f(x) = x^2 的导数。\n\
  \n### 示例 1-21. 在 SymPy 中计算导数\n\n```python\nfrom sympy import *\n# Declare 'x' to\
  \ SymPy\nx = symbols('x')\n# Now just use Python syntax to declare function\nf =\
  \ x**2\n# Calculate the derivative of the function\ndx_f = diff(f)\nprint(dx_f)\
  \ # prints 2*x\n```\n\n哇！因此，通过在 SymPy 中使用 symbols() 函数声明变量，我就可以继续使用普通 Python 语法来声明我的函数。之后，我可以使用\
  \ diff() 为我计算导数函数。在示例 1-22 中，我们可以将导数函数带回普通 Python，并简单地将其声明为另一个函数。\n\n### 示例 1-22.\
  \ Python 中的导数计算器\n\n```python\ndef f(x):\n    return x**2\n\ndef dx_f(x):\n    return\
  \ 2*x\n\nslope_at_2 = dx_f(2.0)\n\nprint(slope_at_2) # prints 4.0\n```\n\n如果你想继续使用\
  \ SymPy，可以调用 `subs()` 函数将 `x` 变量替换为值 `2`，如示例 1-23 所示。\n\n### 示例 1-23. 在 SymPy 中使用替换功能\n\
  \n```python\n# Calculate the slope at x = 2\nprint(dx_f.subs(x,2)) # prints 4\n\
  ```\n\n## 偏导数\n\n本书中我们将遇到的另一个概念是 **偏导数**，我们将在第 5 章、第 6 章和第 7 章中使用它。这些是具有多个输入变量的函数上的导数。\n\
  \n这样来看待。与其在一维函数上找斜率，不如说我们有针对多个变量在多个方向上的斜率。对于每个给定变量的导数，我们假设其他变量保持不变。请看图 1-8 中 $f(x,\
  \ y) = 2x^3 + 3y^3$ 的 3D 图，你将看到我们有两个变量的两个方向上的斜率。\n\n让我们来看看函数 $f(x, y) = 2x^3 + 3y^3$。$x$\
  \ 和 $y$ 变量各自都有自己的导数 $\\frac{d}{dx}$ 和 $\\frac{d}{dy}$。这些表示在多维表面上相对于每个变量的斜率值。在处理多维时，我们从技术上将这些“斜率”称为\
  \ **梯度**。以下是 $x$ 和 $y$ 的导数，接着是计算这些导数的 SymPy 代码：\n\n$f(x, y) = 2x^3 + 3y^3$\n\n\n\
  \n\n\n\n$$\\frac{\\partial}{\\partial x} 2x^3 + 3y^3 = 6x^2$$\n$$\\frac{\\partial}{\\\
  partial y} 2x^3 + 3y^3 = 9y^2$$\n\n示例 1-24 和图 1-8 展示了如何使用 SymPy 分别计算 x 和 y 的偏导数。\n\
  \n### 示例 1-24. 使用 SymPy 计算偏导数\n\n```\nfrom sympy import *\nfrom sympy.plotting import\
  \ plot3d\n\n# Declare x and y to SymPy\nx, y = symbols('x y')\n\n# Now just use\
  \ Python syntax to declare function\nf = 2*x**3 + 3*y**3\n\n# Calculate the partial\
  \ derivatives for x and y\ndx_f = diff(f, x)\ndy_f = diff(f, y)\n\nprint(dx_f) #\
  \ prints 6*x**2\nprint(dy_f) # prints 9*y**2\n\n# plot the function\nplot3d(f)\n\
  ```\n\n![](img/8e0dcc1636d032e7728a07e97751e446_51_0.png)\n\n### 图 1-8. 绘制三维指数函数\n\
  \n所以对于 (x,y) 值 (1,2)，x 方向的斜率为 6(1) = 6，y 方向的斜率为 9(2)<sup>2</sup> = 36。\n\n## 使用极限计算导数\n\
  \n想看看极限在计算导数中何时发挥作用吗？如果你对迄今所学内容感到满意，请继续！如果你仍在消化，也许可以考虑稍后再回到这个侧边栏。\n\nSymPy 让我们可以进行一些关于数学的有趣探索。以我们的函数\
  \ \\( f(x) = x^2 \\) 为例，我们通过绘制经过近邻点 \\( x = 2.0001 \\) 的直线来近似 \\( x = 2 \\) 处的斜率，方法是增加一个步长\
  \ .0001。为什么不使用极限来无限减小该步长 \\( s\\) 看看它趋近于什么斜率呢？\n\n\\[ \\lim_{s \\to 0} \\frac{(x\
  \ + s)^2 - x^2}{(x + s) - x} \\]\n\n在我们的例子中，我们关心的是 \\( x = 2 \\) 处的斜率，因此让我们代入该值。\n\
  \n\\[ \\lim_{s \\to 0} \\frac{(2 + s)^2 - 2^2}{(2 + s) - 2} = 4 \\]\n\n通过无限趋近于步长\
  \ \\( s\\) 到 0 但永不触及（记住近邻点不能接触 \\( x = 2 \\) 处的点，否则就没有直线了！），我们可以使用极限来看到我们趋于斜率 4，如示例\
  \ 1-25 所示。\n\n### 示例 1-25. 使用极限计算斜率\n\n```\nfrom sympy import *\n\n# \"x\" and step\
  \ size \"s\"\nx, s = symbols('x s')\n\n# declare function\nf = x**2\n\n# slope between\
  \ two points with gap \"s\"\n# substitute into rise-over-run formula\nslope_f =\
  \ (f.subs(x, x + s) - f) / ((x+s) - x)\n\n# substitute 2 for x\nslope_2 = slope_f.subs(x,\
  \ 2)\n\n# calculate slope at x = 2\n# infinitely approach step size __s__ to 0\n\
  result = limit(slope_2, s, 0)\n\nprint(result) # 4\n```\n\n现在如果我们不为 \\(x\\) 赋予特定值而将其保持不变呢？如果我们将步长\
  \ \\(s\\) 无限趋近于 0 会发生什么呢？让我们看示例 1-26。\n\n### 示例 1-26. 使用极限计算导数\n\n```\nfrom sympy\
  \ import *\n\n# \"x\" and step size \"s\"\nx, s = symbols('x s')\n\n# declare function\n\
  f = x**2\n\n# slope between two points with gap \"s\"\n# substitute into rise-over-run\
  \ formula\nslope_f = (f.subs(x, x + s) - f) / ((x+s) - x)\n\n# calculate derivative\
  \ function\n# infinitely approach step size +s+ to 0\nresult = limit(slope_f, s,\
  \ 0)\n\nprint(result) # 2x\n```\n\n这给出了我们的导数函数 \\(2x\\)。SymPy 足够聪明，能明白永远不让步长达到 0\
  \ 而始终趋近于 0。这使得 \\(f(x) = x^2\\) 趋于其导数对应物 \\(2x\\)。\n\n## 链式法则\n\n但目前让我们通过一个简单的代数示例来学习链式法则。假设你有两个函数：\n\
  \n$y = x^2 + 1$\n\n$z = y^3 - 2$\n\n注意上面两个函数是关联的，因为 y 是第一个函数的输出变量，但在第二个函数中是输入变量。这意味着我们可以像这样将第一个函数\
  \ y 代入第二个函数 z：\n\n$z = (x^2 + 1)^3 - 2$\n\n那么 z 对 x 的导数是什么？我们已经有了将 z 用 x 表示的代换。让我们使用\
  \ SymPy 在示例 1-27 中计算它。\n\n### 示例 1-27. 求 z 对 x 的导数\n\n```\nfrom sympy import *\n\
  \nz = (x**2 + 1)**3 - 2\ndz_dx = diff(z, x)\nprint(dz_dx)\n\n# 6*x*(x**2 + 1)**2\n\
  ```\n\n因此，z 对 x 的导数是 6x(x^2 + 1)^2。\n\n$$\\frac{dz}{dx} \\left( (x^2 + 1)^3 - 2\
  \ \\right) = 6x(x^2 + 1)^2$$\n\n但看看这个。让我们重新开始，采用不同的方法。如果我们分别对 y 和 z 函数求导，然后将它们相乘，这也会产生\
  \ z 对 x 的导数！让我们试一试。\n\n$$\\frac{dy}{dx}(x^2 + 1) = 2x$$\n$$\\frac{dz}{dy}(y^3 -\
  \ 2) = 3y^2$$\n$$\\frac{dz}{dx} = (2x) (3y^2) = 6xy^2$$\n\n好吧，$6xy^2$ 看起来可能不像 $6x(x^2\
  \ + 1)^2$，但那只是因为我们尚未代入 y 函数。这样做，使得整个 $\\frac{dz}{dx}$ 导数用 x 表示而不含 y。\n\n$$\\frac{dz}{dx}\
  \ = 6xy^2 = 6x(x^2 + 1)^2$$\n\n现在我们看到了，我们得到了相同的导数函数 $6x(x^2 + 1)^2$！\n\n我们在这里目睹的是**链式法则**，它指出对于给定函数\
  \ y（输入变量为 x）复合到另一个函数 z（输入变量为 y），我们可以通过将两个各自的导数相乘来找到 z 对 x 的导数。\n\n$$\\frac{dz}{dx}\
  \ = \\frac{dz}{dy} \\times \\frac{dy}{dx}$$\n\n示例 1-28 展示了进行此比较的 SymPy 代码，表明链式法则得出的导数等于替换函数的导数。\n\
  \n### 示例 1-28. 使用和不使用链式法则计算导数 dz/dx，但仍得到相同答案\n\n```\nfrom sympy import *\nx, y =\
  \ symbols('x y')\n# derivative for first function\n# need to underscore y to prevent\
  \ variable clash\n_y = x**2 + 1\n\ndy_dx = diff(_y)\n\n# derivative for second function\n\
  z = y**3 - 2\ndz_dy = diff(z)\n\n# Calculate derivative with and without\n# chain\
  \ rule, substitute y function\ndz_dx_chain = (dy_dx * dz_dy).subs(y, _y)\ndz_dx_no_chain\
  \ = diff(z.subs(y, _y))\n\n# Prove chain rule by showing both are equal\nprint(dz_dx_chain)\
  \ # 6*x*(x**2 + 1)**2\nprint(dz_dx_no_chain) # 6*x*(x**2 + 1)**2\n```\n\n链式法则是使用正确权重和偏差训练神经网络的关键部分。与其以嵌套洋葱的方式理清每个节点的导数，不如相乘各节点的导数，这在数学上要容易得多。\n\
  \n## 积分\n\n导数的对立面是**积分**，它用于求给定范围内曲线下的面积。在**第 2 章**和**第 3 章**中，我们将求概率分布下的面积。虽然我们不会直接使用积分，而是使用已经积分的累积密度函数，但了解积分如何求曲线下的面积是有好处的。**附录\
  \ A** 包含了在此方法在概率分布上的应用示例。\n\n我想采用一种称为黎曼和的直观方法来学习积分，它能灵活适应任何连续函数。首先，让我们指出，在直线下求某个范围的面积是很容易的。假设我有一个函数\
  \ f(x) = 2x，我想求 0 到 1 之间直线下的面积，如**图 1-9** 中阴影所示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_57_0.png)\n\
  \n### 图 1-9. 计算线性函数下的面积\n\n请注意，我正在求直线与 x 轴之间，且在 x 范围 0 到 1.0 内的面积。如果你还记得基本的几何公式，三角形的面积\
  \ A 为 A = \\frac{1}{2}bh，其中 b 是底边长度，h 是高度。我们可以从上面直观地看出 b = 1 且 h = 2。因此，代入公式，我们得到的面积为\
  \ 1.0，如下计算所示：\n\n$$A = \\frac{1}{2}bh$$\n$$A = \\frac{1}{2}*1*2$$\n$$A = 1$$\n\n\
  这还不错，对吧？但让我们来看一个难以求面积的函数：f(x) = x^2 + 1。0 到 1 之间的面积是多少，如图 1-10 中阴影所示？\n\n![](img/8e0dcc1636d032e7728a07e97751e446_59_0.png)\n\
  \n图 1-10. 计算非线性函数下的面积不那么直截了当\n\n\n\n\n同样，我们只关心曲线下方、x轴上方、且x范围在0到1之间的区域。这里的曲线并不能给我们一个简洁的几何公式来求面积，但这里有一个聪明的小技巧你可以尝试。\n\
  \n如果我们在曲线下方像图1-11所示堆放5个等长的矩形，每个矩形的高度都从x轴延伸到中点触及曲线的位置，那会怎么样呢？\n\n![](img/8e0dcc1636d032e7728a07e97751e446_61_0.png)\n\
  \n图1-11. 在曲线下方堆放矩形以近似面积\n\n矩形的面积是_A_ = 长 × 宽，因此我们可以轻松求和各个矩形的面积。这能给出曲线下方面积的良好近似吗？如果我们堆放100个矩形呢？1000个？100,000个？当我们增加矩形数量的同时减小它们的宽度，难道我们不会更接近曲线下方的面积吗？当然会，这是又一个例子，即我们将某个东西向无穷递增或递减，以逼近真实值。\n\
  \n让我们在Python中试一下。首先，我们需要一个近似积分的函数，我们将其命名为`approximate_integral()`。参数_a_和_b_分别指定_x_范围的最小值和最大值。_n_是要堆放的矩形数量，_f_是我们要积分的函数。我们在示例1-29中实现该函数，然后用5个矩形在0.0到1.0之间对函数_f_(_x_)\
  \ = _x_<sup>2</sup> + 1进行积分。\n\n## 示例1-29. Python中的积分近似\n\n```python\ndef approximate_integral(a,\
  \ b, n, f):\n    delta_x = (b - a) / n\n    total_sum = 0\n\n    for i in range(1,\
  \ n + 1):\n        midpoint = 0.5 * (2 * a + delta_x * (2 * i - 1))\n        total_sum\
  \ += f(midpoint)\n\n    return total_sum * delta_x\n\ndef my_function(x):\n    return\
  \ x**2 + 1\n\narea = approximate_integral(a=0, b=1, n=5, f=my_function)\nprint(area)\
  \ # prints 1.33\n```\n\n我们得到的面积是1.33。如果使用1000个矩形会怎样？让我们在示例1-30中试一下。\n\n## 示例1-30.\
  \ Python中的积分近似\n\n```python\narea = approximate_integral(a=0, b=1, n=1000, f=my_function)\n\
  print(area) # prints 1.333333250000001\n```\n\n好吧，我们这里获得了更多精度，也获得了更多小数位。那100万个矩形呢，如示例1-31所示？\n\
  \n## 示例1-31. Python中的积分近似\n\n```python\narea = approximate_integral(a=0, b=1, n=1_000_000,\
  \ f=my_function)\n\nprint(area) # prints 1.3333333333332733\n```\n\n好吧，我想我们这里收益递减了，正在趋近于1.333这个值，其中“.333”部分会无限循环。如果这是一个有理数，那很可能是\\\
  (\\frac{4}{3} = 1.333\\)。随着矩形数量的增加，近似值开始在越来越小的小数位上达到其极限。\n\n既然我们对要实现的目标及其原因有了一些直观认识，那么让我们使用SymPy来做一个更精确的方法，碰巧SymPy支持有理数，如示例1-32所示。\n\
  \n## 示例1-32. 使用SymPy执行积分\n\n```python\nfrom sympy import *\n\n# Declare 'x' to SymPy\n\
  x = symbols('x')\n\n# Now just use Python syntax to declare function\nf = x**2 +\
  \ 1\n\n# Calculate the integral of the function with respect to x\n# for the area\
  \ between x = 0 and 1\narea = integrate(f, (x, 0, 1))\n\nprint(area) # prints 4/3\n\
  ```\n\n酷！所以面积实际上是4/3，这正是我们之前的方法趋近的值。不幸的是，普通Python（以及许多编程语言）只支持小数，但像SymPy这样的计算机代数系统能给我们精确的有理数。我们将在第2章和第3章中使用积分来求曲线下方的面积，尽管我们会让Scikit-learn为我们完成这项工作。\n\
  \n## 使用极限计算积分\n\n对于极度好奇的读者，以下是我们如何在SymPy中使用极限计算定积分。请！如果你已经消化得足够多，可以跳过，或稍后再回到这个侧边栏。但如果你感觉状态良好，想深入了解积分是如何使用极限推导的，请继续！\n\
  \n主要思路与我们之前做的类似：在曲线下方堆放矩形，并使其无限变小，直到逼近精确面积。但当然，矩形的宽度不能为0……它们只需要不断趋近于0而永远不达到0。这是使用极限的又一个例子。\n\
  \nKhan Academy有一篇精彩的文章解释了如何对Riemann Sum使用极限，但以下是我们如何在SymPy中做到这一点，如示例1-33所示。\n\n\
  ## 示例1-33. 使用极限计算积分\n\n```python\nfrom sympy import *\n\n# Declare variables to\
  \ SymPy\nx, i, n = symbols('x i n')\n\n# Declare function and range\nf = x**2 +\
  \ 1\nlower, upper = 0, 1\n\n# Calculate width and each rectangle height at index\
  \ \"i\"\ndelta_x = ((upper - lower) / n)\nx_i = (lower + delta_x * i)\nfx_i = f.subs(x,\
  \ x_i)\n\n# Iterate all \"n\" rectangles and sum their areas\nn_rectangles = Sum(delta_x\
  \ * fx_i, (i, 1, n)).doit()\n\n# Calculate the area by approaching the number\n\
  # of rectangles \"n\" to infinity\narea = limit(n_rectangles, n, oo)\n\nprint(area)\
  \ # prints 4/3\n```\n\n上面我们确定了每个矩形的长度`delta_x`和每个矩形的起始位置`x_i`，其中`i`是每个矩形的索引。`fx_i`是索引`i`处每个矩形的高度。我们声明`n`个矩形并求和它们的面积`delta_x\
  \ * fx_i`，但我们还没有面积值，因为尚未为`n`指定一个数字。相反，我们将`n`趋近于无穷，以查看我们趋近于什么面积，你应该会得到`4/3`！\n\n\
  ## 结论\n\n在本章中，我们介绍了本书其余部分将使用的一些基础知识。从数论到对数和微积分积分，我们挑选了一些与数据科学、机器学习和分析相关的重要数学概念。你可能会问这些概念有什么用。这将在下一部分介绍！\n\
  \n在进入概率讨论之前，请花点时间再次浏览这些概念，然后完成以下练习。你在阅读本书的过程中随时可以回到本章，并在开始应用这些数学理念时根据需要复习。\n\n##\
  \ 练习\n\n- 1. 62.6738是有理数还是无理数？为什么或为什么不是？\n- 2. 计算表达式：$10^7 10^{-5}$\n- 3. 计算表达式：$81^{\\\
  frac{1}{2}}$\n- 4. 计算表达式：$25^{\\frac{3}{2}}$\n- 5. 假设不进行任何还款，5%利率按月复利计算，3年后一笔1000美元的贷款价值多少？\n\
  - 6. 假设不进行任何还款，5%利率按连续复利计算，3年后一笔1000美元的贷款价值多少？\n- 7. 对于函数f(x) = 3x^2 + 1，x = 3处的斜率是多少？\n\
  - 8. 对于函数f(x) = 3x^2 + 1，x在0到2之间时曲线下方的面积是多少？\n\n答案在附录B中。\n"
- "# 第 2 章. 概率\n\n当你想到概率时，脑海中会浮现什么画面？也许你会想到赌博相关的例子，比如中彩票的概率或掷两个骰子得到对子的概率。也可能是预测股票表现、政治选举的结果，或者你的航班是否能准时到达。我们的世界充满了我们想要衡量的不确定性。\n\
  \n也许这就是我们应该关注的词：不确定性。我们如何衡量自己不确定的东西？\n\n归根结底，概率是衡量某事件发生确定性的理论研究。它是统计学、假设检验、机器学习及本书其他主题的基础学科。许多人理所当然地认为自己理解概率。然而，它比大多数人想象的更具微妙性和复杂性。虽然概率的定理和思想在数学上是严谨的，但当我们引入数据并涉足统计学时，它会变得更加复杂。我们将在第4章关于统计学和假设检验的内容中涵盖这一点。\n\
  \n在本章中，我们将讨论什么是概率。然后我们将介绍概率数学概念、贝叶斯定理、二项分布和β分布。\n\n## 理解概率\n\n**概率**是我们相信某事件发生的强度，通常以百分比表示。以下是一些可能需要用概率来回答的问题：\n\
  \n- 我在10次公平投掷中得到7次正面的可能性有多大？\n- 我赢得选举的机会有多大？\n- 我的航班会晚点吗？\n- 我多么确定一个产品有缺陷？\n\n表达概率最流行的方式是百分比，例如“我的航班有70%的可能性会晚点”。我们将把这个概率称为_P_(_X_)，其中_X_是\n\
  \n\n\n感兴趣的事件。不过，在使用概率时，你更可能会看到它以小数表示（例如 .70），且必须介于 0.0 和 1.0 之间。P(X) = .70\n\n**似然**与概率相似，容易将两者混淆（许多词典也是如此）。在日常对话中，你可以互换使用“概率”和“似然”。不过，我们应该厘清这些差异。概率是关于量化尚未发生的事件的预测，而似然是衡量已经发生的事件的频率。在统计学和机器学习中，我们常以数据形式利用似然（过去）来预测概率（未来）。\n\
  \n需要注意的是，事件发生的概率必须严格介于 0% 和 100%（即 0.0 和 1.0）之间。从逻辑上讲，事件不发生的概率等于 1.0 减去事件发生的概率。\n\
  \n```\n$P(X) = .70$\n\n\\(P(\\text{not } X) = 1-.70 = .30\\)\n```\n\n这是概率与似然之间的另一区别。事件所有可能且互斥结果的概率之和必须为\
  \ 1.0 或 100%（即只能发生一个结果，不能发生多个）。然而，似然不受此规则约束。\n\n另外，概率可以表示为**赔率** \\(O(X)\\)，例如 7:3、\\\
  (\\frac{7}{3}\\) 或 2.333。\n\n要将赔率 \\(O(X)\\) 转换为比例概率 \\(P(X)\\)，请使用以下公式：\n\n```\n\
  \\(P(X) = \\frac{O(X)}{1 + O(X)}\\)\n```\n\n因此，如果我有一个赔率 \\(\\frac{7}{3}\\)，我可以这样将其转换为比例概率：\n\
  \n```\n\\(P(X) = \\frac{O(X)}{1 + O(X)}\\)\n\n\\(P(X) = \\frac{\\frac{7}{3}}{1 +\
  \ \\frac{7}{3}}\\)\n```\n\n$P(X) = .7$\n\n相反，你可以通过将事件发生的概率除以事件不发生的概率，简单地将赔率转换为概率：\n\
  \n$O(X) = \\frac{P(X)}{1-P(X)}$\n\n$O(X) = \\frac{.70}{1-.70}$\n\n$O(X) = \\frac{7}{3}$\n\
  \n## 赔率很有用！\n\n虽然许多人更习惯以百分比或比例表示概率，但赔率可以是一个有用的工具。如果我有一个 2.0 的赔率，这意味着我认为该事件发生的可能性是不发生的\
  \ 2 倍。与 66.666% 的百分比相比，用它来描述一种信念可能更直观。因此，赔率在量化主观信念方面很有帮助，尤其是在赌博/投注场景中。它在贝叶斯统计（包括贝叶斯因子）以及我们将在第\
  \ 6 章介绍的对数赔率的逻辑回归中也发挥作用。\n\n## 概率与统计\n\n有时人们会将*概率*和*统计*互换使用，虽然将这两门学科混为一谈可以理解，但它们确实有区别。**概率**纯粹是关于事件发生可能性的理论，不需要数据。**统计学**另一方面离不开数据，它利用数据来发现概率，并提供描述数据的工具。\n\
  \n试想预测掷骰子出“4”的点数（“die”是“dice”的单数形式）。如果纯粹从概率思维来解决这个问题，只需说骰子有 6 个面。我们假设每个面出现的概率相等，因此掷出“4”的概率是\
  \ $\\frac{1}{6}$，即 16.666%。\n\n然而，一个热情的统计学家可能会说：“不！我们需要掷骰子来获取数据。如果我们能掷 30 次或更多，掷得越多越好，只有这样我们才有数据来确定掷出\
  \ 4 的概率。” 如果我们假设骰子是公平的，这种方法可能显得荒谬，但如果不是呢？如果是这种情况，收集数据是发现掷出“4”概率的唯一方法。我们将在第 3 章讨论假设检验。\n\
  \n## 概率数学\n\n当我们处理事件的单一概率 P(X)（称为**边缘概率**）时，其概念如前面所述相当直观。但当我们开始组合不同事件的概率时，情况就不那么直观了。\n\
  \n### 联合概率\n\n假设你有一枚公平的硬币和一个公平的 6 面骰子。你想求分别掷出“正面”和掷出“6”的概率。这是两个独立事件的两个单独概率，但我们想求两个事件同时发生的概率。这称为**联合概率**。\n\
  \n可以将联合概率视为 AND 操作符。我想求掷出正面 AND 掷出六的概率。我们希望两个事件同时发生，那么该如何计算这个概率呢？\n\n硬币有 2 个面，骰子有\
  \ 6 个面，因此正面的概率是 1/2，六的概率是 1/6。两个事件同时发生的概率（假设它们独立，稍后详述）仅仅是将两者相乘：\n\n```\nP(A AND\
  \ B) = P(A)*P(B)\n\nP (Heads) = 1/2\n\nP (6) = 1/6\n\nP (Heads AND 6) = 1/2 * 1/6\
  \ = 1/12 = .08333\n```\n\n这很简单，但这是为什么呢？许多概率规则可以通过生成事件的所有可能组合来发现，这来源于离散数学中称为排列和组合的领域。对于这种情况，生成硬币和骰子之间的每一种可能结果，将正面\
  \ (H) 和反面 (T) 与 1 到 6 的数字配对。注意，我在感兴趣的结果（即正面和六）周围加上了星号“**”。\n\nH1 H2 H3 H4 H5 *H6*\
  \ T1 T2 T3 T4 T5 T6\n\n请注意，掷硬币和掷骰子共有 12 种可能结果。我们感兴趣的只有“H6”，即正面和六。由于只有一个结果满足条件，而总共有\
  \ 12 种可能结果，因此掷出正面和六的概率是 $\\frac{1}{12}$。\n\n与其生成所有可能组合并计算我们感兴趣的组合数量，我们可以再次使用乘法作为快捷方式来求联合概率。这称为**乘法规则**。\n\
  \n$P(\\text{A AND B}) = P(A) \\times P(B)$\n\n$P(\\text{Heads AND 6}) = \\frac{1}{2}\
  \ \\times \\frac{1}{6} = \\frac{1}{12} = .08333$\n\n### 并集概率\n\n我们讨论了联合概率，即两个或多个事件同时发生的概率。那么求事件\
  \ A 或 B 发生的概率呢？在处理概率中的“或”运算时，这称为**并集概率**。\n\n让我们从**互斥事件**开始，即不能同时发生的事件。例如，掷骰子时，我不能同时得到“4”和“6”。我只能得到一个结果。这类情况的并集概率很简单，直接将它们相加即可。如果我想求掷骰子得到“4”或“6”的概率，则为\
  \ $\\frac{2}{6} = \\frac{1}{3}$。\n\n$P(4) = \\frac{1}{6}$\n\n$P(6) = \\frac{1}{6}$\n\
  \n$P(4 \\text{ OR } 6) = \\frac{1}{6} + \\frac{1}{6} = \\frac{1}{3}$\n\n但**非互斥事件**呢？即可以同时发生的事件。让我们回到掷硬币和掷骰子的示例。得到正面\
  \ OR “六”的概率是多少？在你想直接将这些概率相加之前，让我们再次生成所有可能结果，并突出我们感兴趣的结果：\n\n```\n*H1*  *H2*  *H3*\
  \  *H4*  *H5*  *H6*  T1  T2  T3  T4  T5  *T6*\n```\n\n上面，我们关注所有“正面”结果以及“六”的结果。如果我们将感兴趣的\
  \ 12 个结果中的 7 个按比例计算，即 \\(\\frac{7}{12}\\)，则得到正确的概率 .58333。\n\n但如果将正面和“六”的概率直接相加会怎样？我们会得到一个不同的（错误！）答案\
  \ .666。\n\n```\n\\( P(HEADS) = \\frac{1}{2} \\)\n\n\\( P(6) = \\frac{1}{6} \\)\n\
  \n\\( P(HEADS \\text{ OR } 6) = \\frac{1}{2} + \\frac{1}{6} = \\frac{4}{6} = .666\
  \ \\)\n```\n\n这是怎么回事？再仔细研究一下掷硬币和掷骰子的组合，看看是否能发现什么可疑之处。注意，当我们将概率相加时，我们在“H6”和“T6”中都重复计算了得到“6”的概率！如果这还不清楚，尝试求“正面”或骰子点数\
  \ 1 到 5 的概率。\n\n```\n\\( P(HEADS) = \\frac{1}{2} \\)\n\n\\( P(1 \\text{ through\
  \ } 5) = \\frac{5}{6} \\)\n\n\\( P(HEADS \\text{ OR } 1 \\text{ through } 5) = \\\
  frac{1}{2} + \\frac{5}{6} = \\frac{8}{6} = 1.333 \\)\n```\n\n我们得到 133.333% 的概率，这肯定是不正确的，因为概率不能超过\
  \ 100% 或 1.0。问题再次是我们重复计算了结果。\n\n\n\n\n\n如果你思考足够久，你可能会意识到，在并集概率中消除重复计数的逻辑方法是减去联合概率。这被称为**概率加法法则**，可确保每个联合事件只被计算一次。\n\
  \n```\nP(A OR B) = P(A) + P(B) - P(A AND B)\nP(A OR B) = P(A) + P(B) - P(A) × P(B)\n\
  ```\n\n因此，回到计算正面或“六”的概率的例子，我们需要从并集概率中减去得到正面或“六”的联合概率：\n\n```\nP(HEADS) = 1/2\nP(6)\
  \ = 1/6\nP(A OR B) = P(A) + P(B) - P(A) × P(B)\nP(HEADS OR 6) = 1/2 + 1/6 - (1/2\
  \ × 1/6) = .58333\n```\n\n请注意，此公式也适用于互斥事件。如果事件是互斥的，即只允许发生结果 A 或 B 中的一个，而不能两者都发生，那么联合概率\
  \ P(A AND B) 将为 0，从而从公式中消除。此时，你只需像之前一样对事件求和即可。\n\n总结：当两个或多个非互斥事件之间存在并集概率时，请务必减去联合概率，以免重复计算概率。\n\
  \n## 条件概率与贝叶斯定理\n\n人们容易混淆的一个概率主题是**条件概率**的概念，即在事件 B 已经发生的情况下，事件 A 发生的概率。它通常表示为 P(A\
  \ GIVEN B) 或 P(A|B)。\n\n假设某项研究声称 85% 的癌症患者喝咖啡。你对这个说法有何反应？这是否让你感到惊慌，想要放弃你最爱的早晨饮品？让我们先将其定义为条件概率\
  \ P(Coffee given Cancer) 或 P(Coffee|Cancer)。这表示已知某人患有癌症的情况下，其喝咖啡的概率。\n\n在美国，让我们将其与癌症诊断人数比例（根据\
  \ cancer.gov 为 0.5%）和喝咖啡人群比例（根据 statista.com 为 65%）进行对比：\n\nP(Coffee) = .65\nP(Cancer)\
  \ = .005\nP(Coffee|Cancer) = .85\n\n嗯……研究一下这些数字，问问咖啡是否真的是这里的问题。请注意，任何时候只有 0.5% 的人口患有癌症。然而，65%\
  \ 的人口经常喝咖啡。如果咖啡导致癌症，难道我们不应该看到远高于 0.5% 的癌症数字吗？难道不应该接近 65% 吗？\n\n这就是比例数字的狡猾之处。在没有任何上下文的情况下，它们可能看起来很重要，媒体标题当然可以利用这一点来获得点击率：可能会写“新研究揭示\
  \ 85% 的癌症患者喝咖啡”。当然，这很荒谬，因为我们将一个常见属性（喝咖啡）与一个罕见属性（患癌）关联了起来。\n\n人们之所以容易被条件概率搞混，是因为条件的方向很重要，而两种条件被错误地视为相等。“已知某人是咖啡饮用者，其患癌的概率”与“已知某人患癌，其是咖啡饮用者的概率”是不同的。简单来说：少数咖啡饮用者患癌，但许多癌症患者喝咖啡。\n\
  \n如果我们有兴趣研究咖啡是否导致癌症，我们真正关心的是第一个条件概率：已知某人是咖啡饮用者，其患癌的概率。\n\nP(Coffee|Cancer) = .85\n\
  P(Cancer|Coffee) = ?\n\n我们如何翻转条件？有一个强大的小公式叫做贝叶斯定理，我们可以使用它来翻转条件概率。\n\n```\nP (A|B)\
  \ = \\frac{P(B|A)P(A)}{P(B)}\n```\n\n如果我们将已有信息代入此公式，可以求解出已知某人喝咖啡，其患癌的概率：\n\n```\n\
  P (A|B) = \\frac{P(B|A)*P(A)}{P(B)}\n\nP (Cancer|Coffee) = \\frac{P(Coffee|Cancer)*P(Coffee)}{P(Cancer)}\n\
  \nP (Cancer|Coffee) = \\frac{.85*.005}{.65} = .0065\n```\n\n如果你想在 Python 中计算此值，请查看示例\
  \ 2-1。\n\n### 示例 2-1. 在 Python 中使用贝叶斯定理\n\n```\np_coffee_drinker = .65\np_cancer\
  \ = .005\np_coffee_drinker_given_cancer = .85\np_cancer_given_coffee_drinker = p_coffee_drinker_given_cancer\
  \ *\n    p_cancer / p_coffee_drinker\n\n# prints 0.006538461538461539\nprint(p_cancer_given_coffee_drinker)\n\
  ```\n\n好吧，已知某人是咖啡饮用者，其患癌的概率只有 0.65%！这个数字与已知某人患癌，其是咖啡饮用者的概率（85%）截然不同。现在你明白条件的方向为什么重要了吗？出于这个原因，贝叶斯定理很有帮助。它还可以用于将多个条件概率链接在一起，以便根据新信息不断更新我们的信念。\n\
  \n### 什么定义了“咖啡饮用者”？\n\n请注意，我本可以考虑其他变量，特别是什么样的人才算作“咖啡饮用者”。如果某人每月喝一次咖啡，与每天喝咖啡的人相比，我是否应该同样将两者都视为“咖啡饮用者”？那个一个月前才开始喝咖啡的人，与喝了\
  \ 20 年咖啡的人呢？人们需要多久、喝多长时间咖啡，才能在这个癌症研究中达到“咖啡饮用者”的门槛？\n\n这些都是需要考虑的重要问题，也表明数据很少能讲述完整的故事。如果有人给你一份患者电子表格，上面有一个简单的“是/否”标记来标注他们是否是咖啡饮用者，那么这个门槛就需要被定义！或者我们需要一个更有分量的指标，比如“过去\
  \ 3 年内消耗的咖啡饮品数量”。我将这个思想实验保持简单，并没有定义某人如何才算作“咖啡饮用者”，但请注意，在实际工作中，深入探究数据始终是个好主意。我们将在第\
  \ 3 章中更详细地讨论这一点。\n\n如果你想更深入地探索贝叶斯定理背后的直觉，请转到附录 A。目前只需知道它能帮助我们翻转条件概率。接下来，让我们讨论条件概率如何与联合和并集运算相互作用。\n\
  \n### 朴素贝叶斯\n\n贝叶斯定理在一种常见的机器学习算法——朴素贝叶斯（Naive Bayes）中扮演着核心角色。Joel Grus 在他的书《从头开始学数据科学》中对此进行了讲解。\n\
  \n### 联合与并集条件概率\n\n让我们重新审视联合概率及其与条件概率的相互作用。我想找出某人既是咖啡饮用者又患癌的概率。我是否应该将 P(Coffee)\
  \ 和 P(Cancer) 相乘？或者，如果可用，我是否应该用 P(Coffee|Cancer) 替代 P(Coffee)？我应该使用哪一个？\n\n- 选项\
  \ 1：\n\n```\nP(Coffee) × P(Cancer) = .65 × .005 = .00325\n```\n\n- 选项 2：\n\n```\n\
  P(Coffee|Cancer) × P(Cancer) = .85 × .005 = .00425\n```\n\n如果我们已经确定概率仅适用于癌症患者，那么使用\
  \ P(Coffee|Cancer) 而不是 P(Coffee) 难道不合理吗？一个更具体，并且适用于已经建立的条件。因此，我们应该使用 P(Coffee|Cancer)，因为\
  \ P(Cancer) 已经是我们联合概率的一部分。这意味着某人既患癌又是咖啡饮用者的概率是 0.425%。\n\nP(Coffee and Cancer) =\
  \ P(Coffee|Cancer) × P(Cancer) = .85 × .005 = .00425\n\n这个联合概率也适用于相反的方向。我可以通过将 P(Cancer|Coffee)\
  \ 和 P(Coffee) 相乘，找出某人既是咖啡饮用者又患癌的概率。如你所见，我得出了相同的答案：\n\nP(Cancer|Coffee) × P(Coffee)\
  \ = .0065 × .65 = .00425\n\n如果没有任何条件概率可用，那么我们所能做的最好方法就是将 P(Coffee Drinker) 和 P(Cancer)\
  \ 相乘，如下所示：\n\nP(Coffee Drinker) × P(Cancer) = .65 × .005 = .00325\n\n现在请思考一下：如果事件\
  \ A 对事件 B 没有影响，那么这对条件概率 P(B|A) 意味着什么？这意味着 P(B|A) = P(B)，即事件 A 的发生与事件 B 发生的可能性无关。因此，无论两个事件是否依赖，我们可以将联合概率公式更新为：\n\
  \nP(A AND B) = P(B) × P(A|B)\n\n最后，让我们讨论一下并集和条件概率。如果我想计算 A 或 B 发生的概率，但 A 可能会影响 B\
  \ 的概率，我们这样更新加法法则：\n\nP(A OR B) = P(A) + P(B) – P(A|B) × P(B)\n\n提醒一下，这也适用于互斥事件。如果事件\
  \ A 和 B 不能同时发生，则加法法则 P(A|B) × P(B) 将产生 0。\n\n\n\n\n\n## 二项分布\n\n在本章剩余部分，我们将学习两种概率分布：二项分布和β分布。虽然在本书剩余部分我们不会使用它们，但它们本身是有用的工具，并且对于理解在给定试验次数下事件如何发生是基础性的。它们也将成为理解概率分布的良好过渡，我们将在第3章中大量使用概率分布。让我们探讨一个可能出现在现实世界场景中的用例。\n\
  \n假设你正在开发一种新的涡轮喷气发动机，并进行了10次测试。结果产生了8次成功和2次失败：\n\n- ✓ ✓ ✓ ✓ ✓ X X ✓ ✓\n\n你原本希望达到90%的成功率，但根据上述数据，你得出结论测试只有80%的成功率，因此失败了。每次测试都耗时且昂贵，所以你决定是时候回到绘图板上重新设计了。\n\
  \n然而，你的一名工程师坚持认为应该进行更多测试。“唯一能确定的方法是进行更多测试，”她争辩道。“如果更多测试产生90%或更高的成功率怎么办？毕竟，如果你抛10次硬币得到8次正面，并不意味着硬币被固定在80%。”\n\
  \n你简要考虑了工程师的论点，并意识到她有道理。即使是公平的硬币投掷，结果也不会总是均匀分布，特别是只有10次投掷时。你最可能得到5次正面，但也可能得到3、4、6或7次正面。你甚至可能得到10次正面，尽管这极不可能。那么，在假设基础概率为90%的情况下，你如何确定80%成功的可能性呢？\n\
  \n这里可能相关的一个工具是**二项分布**，它衡量在给定*p*概率的情况下，*n*次试验中出现*k*次成功的可能性。\n\n从视觉上看，二项分布如图2-1所示。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_79_0.png)\n\n图2-1. 二项分布\n\n如上所示，我们看到每个柱状图代表10次试验中k次成功的概率。\n\
  这个二项分布假设概率p为90%，意味着成功发生的概率为.90（或90%）。如果这是真的，这意味着从10次试验中得到8次成功的概率为.1937。从10次试验中得到1次成功的概率极不可能，为.00000008999，因此柱子甚至不可见。\n\
  \n我们也可以通过累加8次或更少成功的柱子来计算8次或更少成功的概率。这将给出.2639的概率，即8次或更少成功。\n\n那么，我们如何实现二项分布呢？我们可以相对容易地从头开始实现（如附录A中所述），或者可以使用SciPy等库。示例2-2展示了如何使用SciPy的binom.pmf()函数（PMF代表“概率质量函数”）来打印我们二项分布从0到10次成功的全部11个概率。\n\
  \n### 示例2-2. 使用SciPy进行二项分布\n\n```\nfrom scipy.stats import binom\n\nn = 10\np =\
  \ 0.9\n\nfor k in range(n + 1):\n    probability = binom.pmf(k, n, p)\n    print(\"\
  {0} - {1}\".format(k, probability))\n```\n\n```\n# OUTPUT:\n# 0 - 9.99999999999996e-11\n\
  # 1 - 8.99999999999996e-09\n# 2 - 3.644999999999996e-07\n# 3 - 8.74800000000003e-06\n\
  # 4 - 0.00013778099999999\n# 5 - 0.00148803479999998\n# 6 - 0.0116026099999996\n\
  # 7 - 0.0573956280000001\n# 8 - 0.193710244999993\n# 9 - 0.3874204890000037\n# 10\
  \ - 0.3486784401000004\n```\n\n如你所见，我们将n作为试验次数，p作为每次试验的成功概率，而k是我们想要查询其概率的成功次数。我们遍历每个成功次数x及其对应的概率，即观察到那么多次成功的概率。如上面输出所示，最可能的成功次数是9。\n\
  \n但是，如果你将8次或更少成功的概率相加，我们将得到.2639。这意味着即使基础成功率为90%，看到8次或更少成功的机会也有26.39%。所以工程师可能是对的。26.39%的机会并非微不足道，当然是可能的。\n\
  \n然而，我们在模型中确实做了一个假设，我们将在接下来的β分布部分讨论。\n\n### 从零开始构建二项分布\n\n转到附录A，了解如何在不使用Scikit-learn的情况下从头构建二项分布。\n\
  \n## β分布\n\n在使用二项分布的发动机测试模型中，我做了什么假设？是否有一个我假设为真，然后围绕它构建整个模型的参数？仔细思考并继续阅读。\n\n我上面的二项分布可能存在的问题是，我假设基础成功率为90%。这并不意味着我的模型毫无价值。我只是展示，如果基础成功率为90%，那么在10次试验中看到8次或更少成功的概率有26.39%。因此，工程师并非完全错误，即可能存在90%的基础成功率。\n\
  \n但是，让我们换个角度思考一下：除了90%之外，是否还有其他基础成功率会产生8/10的成功？我们能否在基础成功率为80%、70%或30%的情况下看到8/10的成功？当我们固定8/10的成功时，能否探索概率的概率？\n\
  \n与其创建无数个二项分布来回答这个问题，我们可以使用一个工具。**β分布**允许我们看到在给定*α*次成功和*β*次失败的情况下，事件发生的不同基础概率的可能性。\n\
  \n以下是在8次成功和2次失败情况下的β分布图表（见图2-2）。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_82_0.png)\n\
  \n图2-2. β分布\n\n### 在DESMOS上使用β分布\n\n如果你想与β分布进行交互，这里提供了一个Desmos图表：\n\nhttps://www.desmos.com/calculator/xylhmcwo71\n\
  \n请注意，x轴表示0.0到1.0（0%到100%）的所有基础成功率，y轴表示给定8次成功和2次失败时该概率的可能性。换句话说，β分布允许我们在给定8/10成功的情况下看到概率的概率。请将其视为元概率，花点时间掌握这个想法！\n\
  \n还要注意的是，β分布是一个连续函数，这意味着它形成一条小数值的连续曲线（与二项分布中整齐且离散的整数不同）。这将使β分布的数学计算稍微困难一些，因为y轴上的给定密度值并不是概率。我们反而通过曲线下的面积来查找概率。\n\
  \nβ分布是一种**概率分布**，这意味着整条曲线下的面积为1.0，即100%。要查找概率，我们需要找到某个范围内的面积。例如，如果我们想要评估8/10的成功将产生90%或更高成功率的概率，我们需要找到0.9到1.0之间的面积，即22.5%，如图2-3中阴影所示。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_83_0.png)\n\n图2-3. 90%到100%之间的面积，即22.5%\n\
  \n与二项分布一样，我们可以使用SciPy来实现β分布。每个连续概率分布都有一个**累积分布函数（CDF）**，它计算到给定x值为止的面积。假设我想要计算到90%（0.0到.90）的面积，如图2-4中阴影所示。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_84_0.png)\n\n图2-4. 计算到90%（0.0到.90）的面积\n\
  \n使用SciPy及其`beta.cdf()`函数非常简单，我需要提供的唯一参数是x值、成功次数a和失败次数b，如示例2-3所示。\n\n### 示例2-3.\
  \ 使用SciPy进行β分布\n\n```\nfrom scipy.stats import beta\n\na = 8\nb = 2\n\np = beta.cdf(.90,\
  \ a, b)\n\n# 0.7748409780000001\nprint(p)\n```\n\n根据上面的计算，基础成功概率为90%或更低的概率为77.48%。\n\
  \n我们如何计算成功率为90%或更高的概率，如图2-5中阴影所示？\n\n\n\n\n![](img/8e0dcc1636d032e7728a07e97751e446_85_0.png)\n\
  \n## 图 2-5. 成功率在 90% 或以上的概率\n\n我们的 CDF 仅计算边界左侧的面积，而非右侧。思考一下概率规则：在概率分布中，曲线下的总面积为\
  \ 1.0。如果我们想求事件的对立概率（大于 0.90 而非小于 0.90），只需用 1.0 减去小于 0.90 的概率，剩余的概率即代表大于 0.90 的情形。图\
  \ 2-6 直观展示了我们如何进行此减法运算。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_86_0.png)\n\n\
  ## 图 2-6. 求成功率大于 90% 的概率\n\n示例 2-4 展示了如何在 Python 中计算此减法运算。\n\n## 示例 2-4. 使用 SciPy\
  \ 的贝塔分布\n\n```\nfrom scipy.stats import beta\n\na = 8\nb = 2\n\np = 1.0 - beta.cdf(.90,\
  \ a, b)\n\n# 0.22515902199999993\nprint(p)\n```\n\n这意味着在 10 次发动机测试中有 8 次成功的情况下，实际成功率为\
  \ 90% 或以上的概率只有 22.5%。但它小于 90% 的概率约为 77.5%。这里的形势对我们不利，即我们的测试并未取得成功，但如果我们抱着试试运气的心态，也可以通过更多测试来押注那\
  \ 22.5% 的机会。如果我们的首席财务官批准了再进行 26 次测试的资金，结果为 30 次成功和 6 次失败，那么我们的贝塔分布现在将如图 2-7 所示。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_88_0.png)\n\n## 图 2-7. 30 次成功和 6 次失败后的贝塔分布\n\
  \n请注意，我们的分布变窄了，因此更有信心实际成功率落在一个更小的范围内。不幸的是，满足 90% 成功率最低要求的概率仅有所下降，从 22.5% 降至 13.16%，如示例\
  \ 2-5 所示。\n\n## 示例 2-5. 使用 SciPy 的贝塔分布\n\n```\nfrom scipy.stats import beta\n\n\
  a = 30\nb = 6\n\np = 1.0 - beta.cdf(.90, a, b)\n\n# 0.13163577484183708\nprint(p)\n\
  ```\n\n到此为止，或许最好停止测试并收手，除非你想继续冒那 13.16% 的风险，并期望峰值向右移动。\n\n最后，如何计算中间区域的面积？如果我想求实际成功率在\
  \ 80% 到 90% 之间的概率（如图 2-8 所示），该如何计算？\n\n![](img/8e0dcc1636d032e7728a07e97751e446_90_0.png)\n\
  \n## 图 2-8. 实际成功率在 80% 到 90% 之间的概率\n\n请仔细思考你可能会如何处理这个问题。如果我们用 0.90 后面的面积减去 0.80\
  \ 后面的面积（如图 2-9 所示），会怎样？\n\n![](img/8e0dcc1636d032e7728a07e97751e446_91_0.png)\n\n\
  ## 图 2-9. 获取 0.80 和 0.90 之间的面积\n\n这不正是能给出 0.80 和 0.90 之间面积的方法吗？确实如此，这样得到的面积为 0.3386，即\
  \ 33.86% 的概率。以下是在 Python 中的计算方法（示例 2-6）。\n\n## 示例 2-6. 使用 SciPy 计算贝塔分布中间区域面积\n\n\
  ```\nfrom scipy.stats import beta\na = 8\nb = 2\np = beta.cdf(.90, a, b) - beta.cdf(.80,\
  \ a, b)\n# 0.33863336200000016\nprint(p)\n```\n\n贝塔分布是一个引人入胜的工具，用于基于有限观测值来衡量事件发生与不发生的概率。它让我们能够对“概率的概率”进行推理，并且在获取新数据时可以对其进行更新。我们也可以用它进行假设检验，但在第\
  \ 3 章中，我们将更侧重于使用正态分布和 T 分布来实现这一目的。\n\n### 从零开始实现贝塔分布\n\n要了解如何从零开始实现贝塔分布，请参阅附录 A。\n\
  \n## 结论\n\n本节我们学习了许多内容！我们不仅介绍了概率的基础知识、其逻辑运算符和贝叶斯定理，还介绍了包括二项分布和贝塔分布在内的概率分布。在下一章中，我们将介绍较为著名的分布之一——正态分布，以及它与假设检验的关系。\n\
  \n如果你想深入了解贝叶斯概率和统计学，Will Kurt 的 *以有趣的方式学习贝叶斯统计* 是一本极好的书。O'Reilly 平台上也提供交互式的 Kata\
  \ 代码场景。\n\n## 练习\n\n- 1. 今天下雨的概率为 30%，而你的伞订单按时送达的概率为 40%。你渴望今天在雨中行走，但两者缺一不可！\n\n\
  \  下雨 **且** 伞会按时到达的概率是多少？\n\n- 2. 今天下雨的概率为 30%，而你的伞订单按时送达的概率为 40%。\n\n  只有在不下雨或伞送到的情况下，你才能去办事。\n\
  \n  不下雨 **或** 伞到达的概率是多少？\n\n- 3. 今天下雨的概率为 30%，而你的伞订单按时送达的概率为 40%。\n\n  不过，你发现如果下雨，伞按时送达的概率只有\
  \ 20%。\n\n  下雨 **且** 伞按时到达的概率是多少？\n\n- 4. 你有一班从拉斯维加斯飞往达拉斯的航班，已有 137 名乘客预订。不过，现在是周日早晨的拉斯维加斯，你估计每名乘客有\
  \ 40% 的概率不出现。\n\n  你正在计算应该超售多少个座位，以免飞机空载飞行。\n\n  至少有 50 名乘客不出现的概率是多少？\n\n- 5. 你掷了\
  \ 19 次硬币，正面出现 15 次，反面出现 4 次。\n\n  你觉得这枚硬币有很大概率是公平的吗？为什么或为什么不？\n\n答案在附录 B 中。\n"
- "# 第 3 章. 描述统计学与推断统计学\n\n**统计学**是收集和分析数据以发现有用结果，或预测导致这些结果发生原因的实践。概率在统计学中常扮演重要角色，因为我们利用数据来估计事件发生的可能性。\n\
  \n统计学或许并不总能得到应有的认可，但它却是众多数据驱动创新的核心。机器学习本身就是一种统计工具，旨在寻找可能的假设，以关联数据中不同变量之间的关系。然而，即使是对专业统计学家而言，统计学也有许多盲点。我们很容易被数据所表达的内容所吸引，而忘记询问数据来自哪里。随着“大数据”、“数据挖掘”和“机器学习”都在加速统计算法的自动化，这些担忧变得愈发重要。因此，打好统计学和假设检验的基础至关重要，这样你就不会将这些自动化视为黑盒。\n\
  \n在本节中，我们将学习统计学和假设检验的基础知识。我们将从描述性统计学入手，学习汇总数据的常见方法。之后，我们将进入推断性统计学领域，试图根据样本推断总体的属性。\n\
  \n### 什么是数据？\n\n定义数据似乎有些奇怪，因为这是我们都在使用且视为理所当然的东西。但我认为有必要这么做。很可能，如果你问任何人什么是数据，他们可能会回答类似“你知道……数据！它就是……嗯……信息！”之类的话，并且不会再深入探讨。如今，数据似乎被宣传为万能之源。它不仅是真理的源泉……更是智慧的源泉！它是“人工智能”的燃料，人们相信你拥有的数据越多，拥有的真理就越多。因此，数据似乎再多也不嫌多。它将解锁重新定义商业战略所需的秘密，甚至可能创造出通用人工智能。但让我提供一个关于数据的务实视角。数据本身并不重要。重要的是对数据的分析（以及数据的生成方式），这才是所有这些创新和解决方案的驱动力。\n\
  \n想象一下，你得到了一张一家人的照片。你能仅凭这一张照片了解这个家庭的故事吗？如果你有 20 张照片呢？200 张？2000 张？你需要多少张照片才能了解他们的故事？你是否需要他们在不同情境下的照片？单独和合在一起？与亲戚和朋友？在家和在工作地点？\n\
  \n**数据**就像照片一样；它提供了一个故事的快照。连续的现实和情境并未被完全捕获，驱动这个故事的无数变量也是如此。正如我们将讨论的，数据可能存在偏差。它可能存在缺口并缺少相关变量。理想情况下，我们希望拥有无限量的数据来捕获无限数量的变量，并有如此多的细节，以至于我们几乎可以重新创建现实并构建替代现实！但这是可能的吗？目前，不可能。即使世界上所有最强大的超级计算机加在一起，也远远无法将整个世界作为数据来捕获。\n\
  \n因此，我们必须缩小范围，使目标具有可行性。几张父亲打高尔夫球的有策略的照片，就能轻易告诉我们他是否擅长高尔夫。但试图仅凭照片解读他一生的故事？那可能是不可能的。快照中有太多无法捕捉的内容。在处理数据项目时，也应考虑这些实际问题，因为数据实际上只是在给定时间下的快照，只捕获其所瞄准的内容（很像相机）。我们需要保持目标聚焦，这样才能聚焦于收集相关且完整的数据。如果我们的目标过于宽泛和开放，我们可能会因得出虚假发现和不完整的数据集而陷入麻烦。这种做法被称为\
  \ **数据挖掘**，它有时有用但必须小心进行。我们将在本章末尾再次探讨这一点。\n\n即使目标定义得很窄，我们的数据仍可能出现问题。让我们回到这样一个问题：几张有策略的照片能否判断父亲是否擅长高尔夫。也许，如果你有一张他挥杆时的照片，你就能判断他的姿势是否正确。或者，如果你看到他在球洞旁欢呼和挥拳，你可以推断他取得了好成绩。也许你可以直接拍一张他的成绩单！但重要的是要注意，所有这些情况都可能是伪造的或断章取义。也许他是在为……欢呼\n\
  \n\n或者是其他人，或者记分卡根本不是他的，甚至是伪造的。就像这些照片一样，数据不会捕捉背景或解释。这是一个非常重要的观点，因为数据提供的是线索，而非真相。这些线索可以引导我们走向真相，也可能误导我们得出错误的结论。\n\
  \n这就是为什么对数据来源保持好奇是如此重要的技能。询问数据是如何创建的，由谁创建，以及数据没有捕获什么。如今，太容易被数据所说的内容所吸引，而忘记询问它来自何处。更糟糕的是，普遍存在一种观点，即可以将数据铲入机器学习算法，并期望计算机自行解决一切。但正如古语所说，“垃圾进，垃圾出。”难怪只有[13%\
  \ 的机器学习项目根据 VentureBeat 成功](https://venturebeat.com/2019/07/19/why-do-87-of-data-science-projects-never-make-it-into-production/)。成功的机器学习项目会对数据及其产生方式进行深思熟虑和分析。\n\
  \n## 基准真理\n\n更广泛地说，家庭照片的例子呈现了一个基准真理问题。\n\n当我教授 AI 系统安全课程时，曾有人问过我如何让自动驾驶汽车更安全。“当自动驾驶汽车无法通过其摄像头传感器识别行人时，难道没有办法让它识别出故障并停车吗？”我回答说没有，因为该系统没有**基准真理**框架，即对什么是真实的经过验证和完整的认知。如果汽车无法识别行人，它又怎么能意识到自己无法识别行人呢？除非有人工操作员可以提供并介入，否则它没有可供回退的基准真理。\n\
  \n这实际上是“自动驾驶”汽车和出租车服务的现状。雷达等传感器对狭窄问题（例如“车前是否有东西？”）提供了相当可靠的基准真理。但基于摄像头感官（在非受控环境中）识别物体是一个模糊得多的感知问题，可能遇到的像素组合数量天文数字般庞大。因此，基准真理不存在。\n\
  \n您的数据是否代表可验证且完整的基准真理？传感器和来源可靠且准确吗？还是基准真理未知？\n\nhttps://en.wikipedia.org/wiki/Ground_truth\n\
  \n## 描述统计与推断统计\n\n当你听到“统计学”这个词时，脑海中浮现的是什么？是计算均值、中位数、众数、图表、钟形曲线以及其他描述数据的工具吗？这是统计学中最常被理解的部分，称为**描述统计学**，我们用它来汇总数据。毕竟，浏览一百万条数据记录更有意义，还是让它们被汇总更有意义？我们将首先介绍统计学的这一领域。\n\
  \n**推断统计学**试图揭示更大总体的属性，通常基于样本。它常被误解，且不如描述统计学直观。很多时候，我们有兴趣研究一个太大而无法观察的群体（例如北美青少年的平均身高），不得不求助于仅使用该群体少数成员来推断关于他们的结论。正如你所猜测的，这并不容易做对。毕竟，我们试图用一个可能不具代表性的样本来代表一个总体。我们将在过程中探讨这些注意事项。\n\
  \n## 总体、样本和偏差\n\n在深入研究描述统计学和推断统计学之前，列出一些定义并将其与具体示例联系起来可能是个好主意。\n\n一个**总体**是我们想要研究的特定感兴趣群体，例如“北美所有\
  \ 65 岁以上的老人”、“苏格兰所有金毛寻回犬”或“洛斯阿尔托斯高中目前的高二学生”。注意我们在定义总体时有边界。其中一些边界很宽泛，涵盖广阔地理区域或年龄段的大量群体。另一些则非常具体和小，例如洛斯阿尔托斯高中的高二学生。你如何界定总体取决于你有兴趣研究什么。\n\
  \n一个**样本**是总体的子集，理想情况下是随机且无偏的，我们用它来推断总体的属性。我们通常不得不研究样本，因为并不总是可能对整个总体进行调查。当然，如果某些总体规模小且易于接触，则更容易获取。但是测量北美所有\
  \ 65 岁以上的老人？这不太可能切实可行！\n\n## 总体可能是抽象的！\n\n值得注意的是，总体可以是理论上的，而非实物可触的。在这些情况下，我们的“总体”更像是从某种抽象事物中取出的样本。我最喜欢的例子是：我们对机场下午\
  \ 2 点到 3 点之间起飞的航班感兴趣，但我们缺乏该时间段足够多的航班来可靠预测这些航班延误的频率。因此，我们可以将这个“总体”视为一个样本……来自下午 2\
  \ 点到 3 点之间所有理论起飞航班的底层总体。\n\n正是这类问题，促使许多研究人员求助于模拟来生成数据。模拟可能有用，但很少准确，因为模拟只捕获了这么多变量，并且内置了假设。\n\
  \n如果我们要基于样本推断总体的属性，重要的是样本应尽可能随机，以免我们扭曲结论。举个例子。假设我是亚利桑那州立大学的一名大学生。我想找出美国大学生每周观看电视的平均小时数。我走到宿舍外面，开始对路过的随机学生进行调查，几个小时内就完成了数据收集。这里有什么问题？\n\
  \n问题是我们的学生样本将会有**偏差**，这意味着它会以过度代表某一群体而牺牲其他群体的方式扭曲我们的发现。我的研究将总体定义为“美国大学生”，而不是“亚利桑那州立大学的大学生”。我只在一所特定大学对学生进行调查，以代表美国整个国家的所有大学生！这真的公平吗？\n\
  \n全国所有大学不太可能在学生属性上都千篇一律。如果亚利桑那州立大学的学生比其他大学的学生观看更多电视，那会怎样？用他们来代表整个国家，难道不会扭曲结果吗？这可能是因为亚利桑那州坦佩通常太热，无法外出。因此看电视是一种常见的消遣（据我所知，我在凤凰城住了很多年）。其他气候较温和地区的大学生可能会参加更多户外活动，看更少电视。\n\
  \n这只是一个可能的变量，说明用一所大学的学生样本来代表整个美国的大学生是个坏主意。理想情况下，我应该在全国不同大学随机调查大学生。这样我就能获得一个更具代表性的样本。\n\
  \n然而，偏差并不总是地理性质的。假设我真诚地努力对美国各地的学生进行调查。我安排了一项社交媒体活动，让各大学在 Twitter 和 Facebook 上分享调查。这样他们的学生就会看到并希望填写。我收到了全国各地关于学生观看电视习惯的数百条回复，觉得自己征服了偏差这头野兽……或者我真的征服了吗？\n\
  \n如果足够活跃于社交媒体以看到调查的学生也更有可能观看更多电视，那会怎样？如果他们经常使用社交媒体，他们可能不介意娱乐屏幕时间。很容易想象他们在另一个标签页里准备好了\
  \ Netflix 和 Hulu 来流媒体播放！这种特定类型的偏差，即特定群体更有可能将自己纳入样本，被称为**自我选择偏差**。\n\n该死！你就是赢不了，对吧？！如果你想得足够久，数据偏差感觉就像是不可避免的！而且很多时候它就是。那么多**混杂变量**，即我们没有考虑到的因素，都可能影响我们的研究。数据偏差这一问题克服起来成本高昂且困难，机器学习尤其容易受其影响。\n\
  \n克服这一问题的方法是从整个总体中真正随机选择学生，他们不能自愿选择加入或退出样本。这是减轻偏差最有效的方法，但正如你所想象的，这需要大量协调资源来完成。\n\
  \n\n\n\n## 偏见类型快速导览\n\n作为人类，我们与生俱来就带有偏见。即使模式不存在，我们也会寻找模式。这或许在我们早期的历史中是生存所必需的，因为发现模式能让狩猎、采集和耕作更有成效。\n\
  \n偏见有很多种，但它们都有同样的效果，即扭曲研究结果。确认偏误是只收集支持你信念的数据，这甚至可能在不知不觉中进行。一个例子是只关注你在政治上同意的社交媒体账号，这会强化你的信念，而不是挑战它们。\n\
  \n我们刚刚讨论了自我选择偏差，即某些类型的受试者更有可能将自己纳入实验。走上飞机，询问乘客是否喜欢这家航空公司胜过其他航空公司，并用此来对所有航空公司的客户满意度进行排名，是很荒谬的。为什么呢？这些乘客中很可能有很多回头客，而他们造成了自我选择偏差。我们不知道有多少是首次乘客，有多少是回头客，当然后者会倾向于喜欢这家航空公司胜过其他航空公司。即使是首次乘客也可能带有偏见并自我选择，因为他们选择乘坐这家航空公司，而我们并没有对所有航空公司进行抽样。\n\
  \n幸存者偏差只捕捉活着和幸存的受试者，而已逝者从未被计入。在我看来，这是最迷人的偏见类型，因为其例子多样且不明显。\n\n可能最著名的幸存者偏差例子是这样的：二战期间，皇家空军在德国敌机火力导致轰炸机人员伤亡方面遇到了麻烦。他们的最初解决方案是在发现弹孔的地方为轰炸机加装装甲，理由是这将提高它们的生存概率。然而，一位名叫亚伯拉罕·沃尔德的数学家向他们指出这是致命的错误。他提议为飞机上没有弹孔的区域加装装甲。他疯了吗？远非如此。那些返回的轰炸机显然在有弹孔的地方没有致命损伤。我们怎么知道这一点？因为它们完成任务返回了！那些没有返回的飞机呢？它们被击中在哪里？沃尔德的理论很可能是那些幸存并返回基地的飞机上未被击中的区域，结果证明是正确的。那些没有弹孔的区域被加装了装甲，飞机和飞行员的生存率因此提高。这种非传统的观察被认为扭转了战争局势，使盟军占据上风。\n\
  \n还有其他不那么明显的关于幸存者偏差的迷人例子。许多管理咨询公司和图书出版商喜欢找出成功公司/个人的特征，并将其作为未来成功的预测指标。这些作品纯粹是幸存者偏差（XKCD\
  \ 就有个关于此的有趣漫画）。这些作品没有考虑到那些默默无闻失败的公司/个人，这些“成功”特质在失败者中同样可能很常见。我们只是没听说过他们，因为他们从未聚光灯下。\n\
  \n让我想到的一个轶事例子是史蒂夫·乔布斯。在许多记述中，他被认为充满激情且脾气暴躁……但他也创办了有史以来最有价值的公司之一。因此，有些人相信充满激情甚至任性可能与成功相关。同样，这是幸存者偏差。我敢打赌，有很多由充满激情的领导者经营但默默无闻失败的公司，但我们却执着于苹果这样的异常成功案例。\n\
  \n最后，1987 年有一项兽医研究显示，从 6 层或更低楼层坠落的猫受伤比从 6 层以上坠落的猫更严重。当时的主流科学理论推测，猫在大约 5 层高度时会调整身体姿势，给自己足够的时间为撞击做准备并减少受伤。但随后，《直说》出版物提出了一个重要问题：那些死掉的猫怎么了？人们不太可能把一只死猫带到兽医那里，因此未报告有多少只猫因高处坠落而死亡。用荷默·辛普森的话说，“哎呀！”。\n\
  \n好了，关于总体、样本和偏见的讨论就够多了。让我们进入一些数学和描述性统计。请记住，数学和计算机不会识别数据中的偏见。作为一名优秀的数据科学专业人士，这是你需要检测的事情！务必询问数据是如何获得的，然后仔细审查该过程如何可能导致数据偏差。\n\
  \n## 机器学习中的样本与偏见\n\n采样和偏见的问题同样扩展到机器学习。无论是线性回归、逻辑回归还是神经网络，都会使用一组数据来推断预测。如果该数据有偏见，它将导致机器学习算法得出有偏见的结论。\n\
  \n这方面有许多有据可查的案例。刑事司法一直是机器学习应用中风险很高的一个领域，因为它一再被证明从各方面都存在偏见，由于数据集中少数群体占比较大，从而歧视少数群体。2017\
  \ 年，沃尔沃测试了“自动驾驶汽车”，这些汽车是基于捕获鹿、麋鹿和驯鹿的数据集训练的。然而，它在澳大利亚没有驾驶数据，因此无法识别袋鼠，更不用说理解它们的跳跃动作了！这两者都是有偏数据的例子。\n\
  \n### 描述性统计\n\n描述性统计是大多数人熟悉的领域。我们将接触均值、中位数和众数等基础知识，然后是方差、标准差和正态分布。\n\n### 均值和加权均值\n\
  \n**均值**是一组数值的平均值。操作很简单：求和数值，然后除以数值的个数。均值很有用，因为它显示了观察到的一组数值中“重心”所在的位置。\n\n总体和样本的均值计算方式相同。示例\
  \ 3-1 展示了 8 个数值的样本以及如何在 Python 中计算它们的均值。\n\n*示例 3-1. 在 Python 中计算均值*\n\n```python\n\
  # Number of pets each person owns\nsample = [1, 3, 2, 5, 7, 0, 2, 3]\nmean = sum(sample)\
  \ / len(sample)\nprint(mean) # prints 2.875\n```\n\n如您所见，我们调查了 8 个人及其拥有的宠物数量。样本的总和是\
  \ 23，样本中的项目数是 8，因此给出的均值为 2.875，因为 23/8 = 2.875。\n\n你会看到两种版本的均值：样本均值 \\(\\overline{x}\\\
  ) 和总体均值 \\(\\mu\\)，如下所示：\n\n\\[\\overline{x} = \\frac{x_1 + x_2 + x_3 + ... + x_n}{n}\
  \ = \\sum \\frac{x_i}{n}\\]\n\n\\[\\mu = \\frac{x_1 + x_2 + x_3 + ... + x_n}{N}\
  \ = \\sum \\frac{x_i}{N}\\]\n\n请回顾，求和符号 \\(\\sum\\) 意味着将所有项目相加。\\(n\\) 和 \\(N\\\
  ) 分别代表样本量和总体量，但在数学上它们代表同一回事：项目数量。对于称呼样本均值 \\(\\overline{x}\\)（“x-bar”）和总体均值 \\(\\\
  mu\\)（“mu”）也是如此。\\(\\overline{x}\\) 和 \\(\\mu\\) 是相同的计算，只是根据我们处理的是样本还是总体而有不同的名称。\n\
  \n均值你可能很熟悉，但关于均值有一个鲜为人知的事实：均值实际上是一种称为**加权均值**的加权平均。我们常用的均值给予每个值相等的权重。但我们可以调整均值，给每个项目赋予不同的权重。\n\
  \n加权均值 =\n\\(\\frac{(x_1 \\cdot w_1) + (x_2 \\cdot w_2) + (x_3 \\cdot w_3) + ...\
  \ (x_n \\cdot w_n)}{w_1 + w_2 + w_3 + ... + w_n}\\)\n\n当我们希望某些数值对均值的贡献大于其他数值时，这会很有用。一个常见的例子是给学术考试加权以计算最终成绩。如果你有\
  \ 3 次期中考试和 1 次期末考试，并且我们给 3 次期中考试每次 20% 的权重，期末考试 40% 的权重，那么像示例 3-2 中那样表示：\n\n*示例\
  \ 3-2. 在 Python 中计算加权均值*\n\n```python\n# Three exams of .20 weight each and final\
  \ exam of .40 weight\nsample = [90, 80, 63, 87]\nweights = [.20, .20, .20, .40]\n\
  \nweighted_mean = sum(s * w for s,w in zip(sample, weights)) / sum(weights)\n\n\
  print(weighted_mean) # prints 81.4\n```\n\n\n我们通过乘法相应地对每个考试成绩进行加权，并不是按数值个数相除，而是按权重之和相除。权重不必是百分比，因为任何用作权重的数字最终都会被成比例化。在示例\
  \ 3-3 中，我们给每个考试赋予“1”的权重，但给期末考试赋予“2”的权重，使其权重是其他考试的两倍。我们仍然会得到同样的答案 81.4，因为这些值仍然会被成比例化。\n\
  \n## 示例 3-3. 在 Python 中计算加权平均数\n\n```python\n# Three exams of .20 weight each and\
  \ final exam of .40 weight\nsample = [90, 80, 63, 87]\nweights = [1.0, 1.0, 1.0,\
  \ 2.0]\nweighted_mean = sum(s * w for s,w in zip(sample, weights)) / sum(weights)\n\
  print(weighted_mean) # prints 81.4\n```\n\n## 中位数\n\n中位数是一组有序值中位于中间的值。你依次对值进行排序，中位数将是位于中间的那个值。如果值的个数是偶数，则取两个中间值的平均值。我们可以在示例\
  \ 3-4 中看到，我们样本中宠物数量的中位数是 7。\n\n- 0, 1, 5, *7*, 9, 10, 14\n\n## 示例 3-4. 在 Python\
  \ 中计算中位数\n\n```python\n# Number of pets each person owns\nsample = [0, 1, 5, 7,\
  \ 9, 10, 14]\ndef median(values):\n    ordered = sorted(values)\n    print(ordered)\n\
  \    n = len(ordered)\n    mid = int(n / 2) - 1 if n % 2 == 0 else int(n/2)\n  \
  \  if n % 2 == 0:\n        return (ordered[mid] + ordered[mid+1]) / 2.0\n    else:\n\
  \        return ordered[mid]\nprint(median(sample)) # prints 7\n```\n\n当数据被 **异常值**（即与其余值相比极大或极小的值）所偏移时，中位数可以作为均值的一个有用替代方案。这里有一个有趣的轶事来帮助理解原因。1986\
  \ 年，北卡罗来纳大学地理专业毕业生的平均年薪为 250,000 美元。其他大学平均为 22,000 美元。哇，UNC 的地理专业一定很了不起！\n\n但在现实中，UNC\
  \ 的地理专业究竟有什么赚钱之处呢？嗯……他们有一位名叫迈克尔·乔丹的毕业生。史上最著名的 NBA 球员之一确实拥有北卡罗来纳大学的地理学学位。然而，他开始职业生涯是打篮球，而不是研究地图。显然，这是一个混淆变量，制造了一个巨大的异常值，并严重扭曲了收入平均值。\n\
  \n这就是为什么在异常值较多的情况下（例如收入相关数据），中位数可能比均值更可取。它对异常值不那么敏感，而是根据数据的相对顺序严格地将数据从中间切分开，而不是根据它们在数轴上的确切位置。当你的中位数与均值相差很大时，这意味着你有一个带有异常值的偏斜数据集。\n\
  \n## 中位数是分位数\n\n描述性统计中存在 **分位数** 的概念。分位数的概念本质上与中位数相同，只是在中间以外的其他位置切分数据。中位数实际上是 50%\
  \ 分位数，即 50% 的有序值位于其后面的值。然后还有 25%、50%、75% 分位数，它们被称为 **四分位数**，因为它们按 25% 的增量切分数据。\n\
  \n## 众数\n\n**众数** 是出现频率最高的一组值。当你的数据具有重复性且你想要找出哪些值出现频率最高时，它主要变得有用。\n\n当没有任何值出现超过一次时，没有众数。当两个值出现频率相同时，则该数据集被视为\
  \ **双峰**。在示例 3-5 中，我们计算了宠物数据集的众数，果然我们看到这是双峰的，因为 2 和 3 出现频率最高（且相同）。\n\n## 示例 3-5.\
  \ 在 Python 中计算众数\n\n```python\n# Number of pets each person owns\nfrom collections\
  \ import defaultdict\n\nsample = [1, 3, 2, 5, 7, 0, 2, 3]\n\ndef mode(values):\n\
  \    counts = defaultdict(lambda: 0)\n\n    for s in values:\n        counts[s]\
  \ += 1\n\n    max_count = max(counts.values())\n    modes = [v for v in set(values)\
  \ if counts[v] == max_count]\n    return modes\n\nprint(mode(sample)) # [2, 3]\n\
  ```\n\n实际上，众数经常不会被大量使用，除非你的数据具有重复性。\n这通常在整数、类别和其他离散变量中遇到。\n\n## 方差和标准差\n\n当我们开始谈论方差和标准差时，事情变得有趣起来。令人困惑的一点是，样本和总体的方差和标准差计算存在一些差异。我们会尽力清楚地介绍这些差异。\n\
  \n## 总体方差和标准差\n\n在描述数据时，我们通常有兴趣测量均值与每个数据点之间的差异。这让我们了解数据有多“分散”。\n\n假设我有兴趣研究我工作人员养的宠物数量（请注意，我将其定义为总体，而非样本）。我工作人员中有\
  \ 7 个人。\n\n我计算他们养的宠物数量的平均值，得到 6.571。让我们从每个值中减去这个平均值。这将显示每个值离平均值有多远，如表 3-1 所示。\n\n\
  ## 表 3-1. 员工养的宠物数量\n\n| 值 | 均值 | 差值 |\n|---|---|---|\n| 0 | 6.571 | -6.571 |\n|\
  \ 1 | 6.571 | -5.571 |\n| 5 | 6.571 | -1.571 |\n| 7 | 6.571 | 0.429 |\n| 9 | 6.571\
  \ | 2.429 |\n| 10 | 6.571 | 3.429 |\n| 14 | 6.571 | 7.429 |\n\n让我们在数轴上可视化这一点，其中“X”表示均值，如图\
  \ 3-1 所示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_110_0.png)\n\n图 3-1. 可视化我们数据的分布，其中“X”是均值\n\
  \n嗯……现在考虑一下上述信息为什么有用。这些差异让我们了解数据有多“分散”，以及值离均值有多远。是否有方法可以将这些差异合并为一个单一数字，以快速描述数据有多分散？\n\
  \n你可能会想取差异的平均值，但在求和时，负数和正数会相互抵消。我们可以对绝对值求和（去掉负号，使所有值变为正数）。更好的方法是在求和前对这些差异进行平方。这不仅消除了负值（因为对负数求平方会使其变为正数），还能放大较大的差异，并且在数学上更易于处理（绝对值的导数不那么直接）。之后，对平方差求平均值。这将给出我们的\
  \ **方差**，即衡量数据分散程度的指标。\n\n以下是计算方差的数学公式：\n\n总体方差 = \\frac{(x_1 - mean)^2 + (x_2 -\
  \ mean)^2 + ... + (x_n - mean)^2}{N}\n\n更正式地，以下是总体的方差。\n\n\\sigma^2 = \\frac{\\\
  sum (x_i - \\mu)^2}{N}\n\n示例 3-6 展示了如何在 Python 中计算我们宠物示例的总体方差。\n\n## 示例 3-6. 在 Python\
  \ 中计算方差\n\n```python\n# Number of pets each person owns\ndata = [0, 1, 5, 7, 9,\
  \ 10, 14]\n\ndef variance(values):\n    mean = sum(values) / len(values)\n    _variance\
  \ = sum((v - mean) ** 2 for v in values) / len(values)\n    return _variance\n\n\
  print(variance(data)) # prints 21.387755102040813\n```\n\n所以我办公室员工养宠物数量的方差为 21.387755。好吧，但这到底意味着什么？得出结论，方差越高表示数据越分散，这是合理的，但我们如何将其与我们的数据联系起来呢？这个数字大于我们所有的观测值，因为我们做了大量的平方和求和操作，将其放置在了完全不同的度量上。那么，我们如何将其缩小回原来的量级呢？\n\
  \n平方的逆运算是平方根，因此让我们对方差开平方根，从而得到 **标准差**。这是将方差缩放为以“宠物数量”为单位的数字，这使其更有意义。\n\n$$\\sigma\
  \ = \\sqrt{\\frac{\\sum (x_i - \\mu)^2}{N}}$$\n\n要在 Python 中实现，我们可以复用 `variance()`\
  \ 函数并对其结果调用 `sqrt()`。我们现在有了 `std_dev()` 函数，如示例 3-7 所示。\n\n## 示例 3-7. 在 Python 中计算标准差\n\
  \n```python\nfrom math import sqrt\n\n# Number of pets each person owns\ndata =\
  \ [0, 1, 5, 7, 9, 10, 14]\n\ndef variance(values):\n    mean = sum(values) / len(values)\n\
  \    _variance = sum((v - mean) ** 2 for v in values) / len(values)\n    return\
  \ _variance\n\ndef std_dev(values):\n    return sqrt(variance(values))\n\nprint(std_dev(data))\
  \  # prints 4.624689730353898\n```\n\n运行示例 3-7 中的代码，你会看到我们的标准差约为 4.62 只宠物。这样，我们就可以在最初的量级上表达数据的分散程度，这使我们的方差更容易解释。我们将在第\
  \ 5 章中看到标准差的一些重要应用。\n\n> ## 为什么要平方？\n> \n> 关于方差，如果 \\(\\sigma^2\\) 中的指数让你困扰，那是因为它提示你对其开平方根以得到标准差。这是一个小小的提醒，告诉你正在处理需要开平方根的平方值。\n\
  \n## 样本方差和标准差\n\n在上一节中，我们讨论了总体的方差和标准差。然而，当我们计算样本时，需要对这两个公式做一个重要调整：\n\n\n\ns² = \\\
  frac{\\sum (x_i - \\bar{x})²}{n - 1}\ns = \\sqrt{\\frac{\\sum (x_i - \\bar{x})²}{n\
  \ - 1}}\n\n你发现区别了吗？当我们对平方差求平均值时，除数是 n-1 而不是项目总数 n。我们为什么要这样做？我们这样做是为了降低样本中的任何偏差，并避免根据样本低估总体的方差。通过在除数中少算\
  \ 1 个值，我们增加了方差，从而捕捉了样本中更大的不确定性。\n\n## 为什么样本大小要减 1？\n\n在 YouTube 上，Josh Starmer 有一个名为\
  \ StatQuest 的优秀视频系列。在其中一个视频中，他详细解释了为什么我们在计算方差时对样本采取不同的处理方式，并从项目数量中减去一个元素。\n\nhttps://www.youtube.com/watch?v=sHRBg6BhKjI\n\
  \n如果我们的宠物数据是样本而不是总体，我们应相应地做出该调整。在示例 3-8 中，我修改了之前的 `variance()` 和 `std_dev()` Python\
  \ 代码，以可选地提供一个参数 `is_sample`，如果为 `True`，则会从方差的除数中减去 1。\n\n### 示例 3-8. 在 Python 中计算标准差\n\
  \n```python\nfrom math import sqrt\n\n# Number of pets each person owns\ndata =\
  \ [0, 1, 5, 7, 9, 10, 14]\n\ndef variance(values, is_sample: bool = False):\n  \
  \  mean = sum(values) / len(values)\n    _variance = sum((v - mean) ** 2 for v in\
  \ values) /\n        (len(values) - (1 if is_sample else 0))\n    return _variance\n\
  \ndef std_dev(values, is_sample: bool = False):\n    return sqrt(variance(values,\
  \ is_sample))\n\nprint(\"VARIANCE = {}\".format(variance(data, is_sample=True)))\
  \  # 24.95238095238095\nprint(\"STD DEV = {}\".format(std_dev(data, is_sample=True)))\
  \  # 4.99523582550223\n```\n\n请注意，在示例 3-8 中，我的方差和标准差相比于之前将其视为总体而非样本的示例有所增加。回顾示例\
  \ 3-7，将其视为总体时标准差约为 4.62。但在这里将其视为样本（从方差分母中减去 1），我们得到的结果约为 4.99。这是正确的，因为样本可能具有偏差，且不能完美代表总体。因此，我们增加了方差（进而增加了标准差），以提高我们对数值分散程度的估计。更大的方差/标准差表明置信度较低，范围更大。\n\
  \n就像均值一样（\\(\\overline{x}\\) 表示样本，\\(\\mu\\) 表示总体），你经常会看到方差和标准差的某些符号。样本标准差和均值分别由\
  \ \\(s\\) 和西格玛 \\(\\sigma\\) 指定。以下是样本和总体标准差公式：\n\n\\(s = \\sqrt{\\frac{\\sum (x_i\
  \ - \\overline{x})^2}{n - 1}}\\)\n\n\\(\\sigma = \\sqrt{\\frac{\\sum (x_i - \\mu)^2}{N}}\\\
  )\n\n方差将是这两个公式的平方，从而消除平方根。因此，样本和总体的方差分别为 \\(s^2\\) 和 \\(\\sigma^2\\)。\n\n\\(s^2\
  \ = \\frac{\\sum (x_i - \\overline{x})^2}{n - 1}\\)\n\n\\(\\sigma^2 = \\frac{\\\
  sum (x_i - \\mu)^2}{N}\\)\n\n同样，平方有助于暗示应该取平方根以得到标准差。\n\n## 正态分布\n\n我们在上一章中接触过概率分布，特别是二项分布和β分布。然而，最著名的分布是正态分布。正态分布，也称为高斯分布，是一种对称的钟形分布，其大部分质量集中在均值附近，其离散程度由标准差定义。随着远离均值，两侧的“尾部”变得越来越薄。\n\
  \n图 3-2 是金毛寻回犬体重的正态分布。请注意，大部分质量集中在 64.43 磅的均值附近。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_115_0.png)\n\
  \n图 3-2. 正态分布\n\n## 发现正态分布\n\n正态分布在自然、工程、科学和其他领域中很常见。我们如何发现它？假设我们对 50 只成年金毛寻回犬的体重进行抽样，并将其绘制在数轴上，如图\
  \ 3-3 所示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_116_0.png)\n\n图 3-3. 50 只金毛寻回犬体重的样本\n\
  \n请注意，我们向中心方向有更多值，但向左或向右移动得越远，看到的值就越少。根据我们的样本，遇到体重为 57 或 71 磅的金毛寻回犬似乎不太可能。但体重为 64\
  \ 或 65 磅？嗯，这当然看起来是可能的。\n\n有没有更好的方法来可视化这种可能性，以查看我们更可能从总体中抽样到哪些金毛寻回犬体重？我们可以尝试创建一个\
  \ **直方图**，它根据等长数值范围将值分桶（或“分箱”），然后使用柱状图显示每个范围内的值的数量。在图 3-4 中，我们创建了一个将值分箱为 0.5 磅范围的直方图。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_116_1.png)\n\n图 3-4. 金毛寻回犬体重的直方图\n\n\
  上面的直方图没有揭示我们数据的任何有意义形状。原因在于我们的分箱太小。我们没有极大或无限的数据量来使每个分箱中有足够多的点。因此，我们必须使分箱更大。让我们在图\
  \ 3-5 中将每个分箱的长度设为 3 磅。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_117_0.png)\n\n\
  图 3-5. 更有效的直方图\n\n好了，现在我们有进展了！如你所见，如果分箱大小合适（在此例中每个分箱范围为 3 磅），我们的数据就开始呈现出有意义的钟形。它不是完美的钟形，因为我们的样本永远不会完美代表总体，但这很可能是证据表明我们的样本符合正态分布。如果我们使用合适的分箱大小拟合直方图，并将其缩放为面积为\
  \ 1.0（这是概率分布所要求的），我们就大致能看到一个代表我们样本的钟曲线。让我们在图 3-6 中将其与原始数据点一并展示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_118_0.png)\n\
  \n图 3-6. 拟合到数据点上的正态分布\n\n观察上面的钟曲线，我们可以合理地预期金毛寻回犬的体重最可能在 64.43（均值）左右，但在 55 或 73 磅时不太可能。比这更极端的任何情况几乎都不可能。\n\
  \n## 正态分布的属性\n\n正态分布具有几个使其有用的重要属性：\n\n- 它是对称的，两侧在均值（即中心）处完全镜像对称\n- 大部分质量集中在均值附近的中心\n\
  - 它有一个由标准差指定的离散程度（窄或宽）\n- “尾部”是最不可能的结果，无限趋近于零但永远不接触零\n- 它类似于自然和日常生活中许多现象，甚至由于中心极限定理而将非正态问题概括化，我们稍后将讨论这一点\n\
  \n## 概率密度函数 (PDF)\n\n标准差在正态分布中起着重要作用，因为它定义了分布“分散”的程度。它实际上是与均值一起的参数之一。创建正态分布的概率密度函数\
  \ (PDF) 如下：\n\nf(x) = \\frac{1}{\\sigma} * \\sqrt{2\\pi} * e^{-\\frac{1}{2} \\left(\\\
  frac{x-\\mu}{\\sigma}\\right)^2}\n\n哇，这可真是个口舌，不是吗？我们甚至看到了第一章中的老朋友欧拉数 e 以及一些疯狂的指数。以下是如何在示例\
  \ 3-9 中用 Python 表达它。\n\n### 示例 3-9. Python 中的正态分布函数\n\n```python\n# normal distribution,\
  \ returns likelihood\ndef normal_pdf(x: float, mean: float, std_dev: float) -> float:\n\
  \    return (1.0 / (2.0 * math.pi * std_dev ** 2) ** 0.5) *\n    math.exp(-1.0 *\
  \ ((x - mean) ** 2 / (2.0 * std_dev ** 2)))\n```\n\n这个公式里有很多东西需要拆解，但重要的是，它接受均值和标准差作为参数，以及一个\
  \ x 值，以便你可以查询该给定值的似然性。\n\n就像第 2 章中的 β 分布一样，正态分布是连续的。这意味着要获取概率，我们需要对一系列 x 值进行积分以求出面积。\n\
  \n不过在实践中，我们将使用 SciPy 来为我们执行这些计算。\n\n## 积分正态分布\n\n在正态分布中，垂直轴不是概率，而是数据的似然性。要找到概率，我们需要查看给定范围，然后找到该范围下曲线的面积。假设我想查找金毛寻回犬体重在\
  \ 62 到 66 磅之间的概率。图 3-7 是我们想要求面积的范围的可视化。\n\n\n\n\n\n![](img/8e0dcc1636d032e7728a07e97751e446_120_0.png)\n\
  \n图 3-7. 介于 62 到 66 磅之间的累积分布函数（CDF）\n\n已经在第二章中使用 Beta 分布完成了此任务，和 Beta 分布一样，这里也有一个累积分布函数（CDF）。让我们采用这种方法。\n\
  \n## 使用累积分布函数（CDF）进行积分\n\n正如我们在上一章中所学，累积分布函数（CDF）为给定分布提供直到给定 x 值的面积。让我们看看我们的金毛寻回犬正态分布的\
  \ CDF 是什么样子，并在图 3-8 中将其与 PDF 并排展示以供参考。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_122_0.png)\n\
  \n图 3-8. 与累积分布函数（CDF）并排展示的概率密度函数（PDF）\n\n请注意两个图之间存在关系。CDF 是一个 S 形曲线（称为 sigmoid 曲线），它将\
  \ PDF 中直到该范围的面积投影出来。观察图 3-9，当我们从负无穷到 64.43（均值）捕获面积时，我们的 CDF 显示的值正好是 .5 或 50%！\n\n\
  ![](img/8e0dcc1636d032e7728a07e97751e446_123_0.png)\n\n图 3-9. 金毛寻回犬体重的 PDF 和 CDF，测量直到均值的概率\n\
  \n直到均值的 .50 或 50% 这个面积之所以已知，是因为我们的正态分布具有对称性，我们可以预期钟形曲线的另一侧也有 50% 的面积。\n\n要使用 SciPy\
  \ 在 Python 中计算直到 64.43 的这个面积，请使用 `norm.cdf()` 函数，如示例 3-10 所示。\n\n## 示例 3-10. Python\
  \ 中的正态分布 CDF\n\n```python\nfrom scipy.stats import norm\n\nmean = 64.43\nstd_dev\
  \ = 2.99\n\nx = norm.cdf(64.43, mean, std_dev)\n\nprint(x) # prints 0.5\n```\n\n\
  就像我们在第二章中所做的，我们可以通过相减面积来演绎得出中间范围的面积。如果我们想找到观察到的金毛寻回犬体重在 62 到 66 磅之间的概率，我们将计算直到 66\
  \ 的面积并减去直到 62 的面积，如图 3-10 所示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_125_0.png)\n\
  \n图 3-10. 寻找中间概率范围\n\n使用 SciPy 在 Python 中执行此操作就像减去示例 3-11 中显示的两个 CDF 操作一样简单。\n\n\
  ## 示例 3-11. 使用 CDF 获取中间范围概率\n\n```python\nfrom scipy.stats import norm\nmean = 64.43\n\
  std_dev = 2.99\nx = norm.cdf(66, mean, std_dev) - norm.cdf(62, mean, std_dev)\n\
  print(x) # prints 0.4920450147062894\n```\n\n你应该发现观察到的金毛寻回犬体重在 62 到 66 磅之间的概率为 0.4920，即大约\
  \ 49.2%。\n\n## 逆累积分布函数（CDF）\n\n当我们在本章后面开始进行假设检验时，你会遇到需要在 CDF 上查找面积然后返回相应 x 值的情况。当然，这是\
  \ CDF 的反向用法，因此我们需要使用逆累积分布函数，它像图 3-11 所示翻转轴。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_127_0.png)\n\
  \n图 3-11. 逆 CDF，也称为 PPF 或分位数函数\n\n这样，我们现在可以查找概率然后返回相应的 x 值，在 SciPy 中我们会使用 norm.ppf()\
  \ 函数。例如，我想找到 95% 的金毛寻回犬体重低于的数值。当我在示例 3-12 中使用逆累积分布函数时，这很容易完成。\n\n## 示例 3-12. 在 Python\
  \ 中使用逆 CDF（称为 ppf()）\n\n```python\nfrom scipy.stats import norm\nx = norm.ppf(.95,\
  \ loc=64.43, scale=2.99)\nprint(x) # 69.3481123445849\n```\n\n我发现 95% 的金毛寻回犬体重为\
  \ 69.348 磅或更低。\n\n你也可以使用逆累积分布函数生成遵循正态分布的随机数。如果我想创建一个生成 1,000 个逼真的金毛寻回犬体重的模拟，我只需生成\
  \ 0.0 到 1.0 之间的随机值，将其传递给逆累积分布函数，并返回体重值，如示例 3-13 所示。\n\n## 示例 3-13. 从正态分布生成随机数\n\n\
  ```python\nimport random\nfrom scipy.stats import norm\nfor i in range(0,1000) :\n\
  \    random_p = random.uniform(0.0, 1.0)\n    random_weight = norm.ppf(random_p,\
  \ loc=64.43, scale=2.99)\n    print(random_weight)\n```\n\n当然，NumPy 和其他库可以为你生成分布的随机值，但这突出了逆累积分布函数派上用场的一个用例。\n\
  \n> **从零开始实现 CDF 和逆 CDF**\n> \n> 要了解如何在 Python 中从零开始实现 CDF 和逆 CDF，请参阅附录 A。\n\n##\
  \ Z-得分\n\n将正态分布重新缩放，使均值为 0、标准差为 1 是很常见的，这被称为 **标准正态分布**。这使得我们可以轻松比较一个正态分布与另一个正态分布的离散程度，即使它们具有不同的均值和方差。\n\
  \n标准正态分布中特别重要的是，它将所有 x 值表示为标准差，称为 **Z-得分**。将 x 值转换为 Z-得分使用基本缩放公式。\n\n```\nz = \\\
  frac{x-\\mu}{\\sigma}\n```\n\n这是一个例子。我们有两个来自不同社区的房子。社区 A 的平均房价为 $140,000，标准差为 $3,000。社区\
  \ B 的平均房价为 $800,000，标准差为 $10,000。\n\n- μ_A = 140,000\n- μ_B = 800,000\n- σ_A = 3,000\n\
  - σ_B = 10,000\n\n现在我们有来自各自社区的两套房子。社区 A 的房子 A 价值 $150,000，社区 B 的房子 B 价值 $815,000。哪套房子相对于其社区的平均房子更昂贵？\n\
  \n- x_A = 150,000\n- x_B = 815,000\n\n如果我们将这两个值表示为标准差，就可以将它们相对于每个社区均值进行比较。使用 Z-得分公式：\n\
  \n- z = \\frac{x - mean}{standard deviation}\n- z_A = \\frac{150000 - 140000}{3000}\
  \ = 3.\\overline{333}\n- z_B = \\frac{815000 - 800000}{10000} = 1.5\n\n所以社区 A 的房子相对于其社区来说实际上比社区\
  \ B 的房子贵得多，因为它们的值分别为 3.\\overline{333} 和 1.5。\n\n这是我们如何将来自具有均值和标准差的给定分布的 x 值转换为\
  \ z-得分，以及反过来的操作，如示例 3-14 所示。\n\n## 示例 3-14. 将 Z-得分转换为 x 值，反之亦然\n\n```python\ndef\
  \ z_score(x, mean, std):\n    return (x - mean) / std\n\ndef z_to_x(z, mean, std):\n\
  \    return (z * std) + mean\n\nmean = 140000\nstd_dev = 3000\nx = 150000\n\n# Convert\
  \ to Z-score and then back to X\nz = z_score(x, mean, std_dev)\nback_to_x = z_to_x(z,\
  \ mean, std_dev)\n\nprint(\"Z-Score: {}\".format(z)) # Z-Score: 3.333\nprint(\"\
  Back to X: {}\".format(back_to_x)) # Back to X: 150000.0\n```\n\n上面的 z_score() 函数将\
  \ x 值按给定均值和标准差缩放为标准差。z_to_x() 函数将 Z-得分转换回 x 值。研究这两个函数，你可以看到它们的代数关系，一个求解 Z-得分，另一个求解\
  \ x 值。然后我们将 150000 的 x 值转换为 3.333 的 Z-得分，然后将该 Z-得分转换回 x 值。\n\n## 变异系数\n\n与测量离散程度相关的一个有用工具是变异系数。它比较两个分布并量化每个分布的离散程度。计算很简单：用标准差除以均值。下面是公式及比较两个社区的示例。\n\
  \n```\ncv = \\frac{\\sigma}{\\mu}\n\ncv_A = \\frac{3000}{140000} = 0.0214\n\ncv_B\
  \ = \\frac{10000}{800000} = 0.0125\n```\n\n如上所述，社区 A 虽然比社区 B 便宜，但其离散程度更大，因此价格多样性也比社区\
  \ B 更高。\n\n## 推断统计学\n\n我们迄今涵盖的描述性统计学通常被理解。但是当我们进入推断统计学时，样本和总体之间的抽象关系就会充分展现。这些抽象的细微差别不是你希望匆匆而过的东西，而是要花时间深思熟虑地吸收。如前所述，作为人类，我们天生就带有偏见并迅速得出结论。成为一名优秀的数据科学专业人士要求你抑制这种原始欲望，并考虑其他解释也可能存在的可能性。理论认为根本没有任何解释，而一个发现只是巧合和随机的，是可以接受的（甚至是开明的）。\n\
  \n首先让我们从奠定所有推断统计学基础的定理开始。\n\n## 中央极限定理\n\n正态分布有用的原因之一是因为它在自然界中经常出现，例如成年金毛寻回犬的体重。但是它出现在更\n\
  \n\n\n在自然总体之外有一个引人入胜的语境。当我们从一个总体中开始测量足够大的样本时，即使该总体不服从正态分布，正态分布依然会出现。\n\n让我们假设我正在测量一个真正且均匀随机的总体。\n\
  0.0 到 1.0 之间的任何值出现的可能性都相同，且没有任何值具有优先性。但是当我们从这个总体中取样越来越大，计算每个样本的平均值，然后将它们绘制成直方图时，会发生一件引人入胜的事情。运行示例\
  \ 3-15 中的 Python 代码，观察图 3-12 中的图表。\n\n### 示例 3-15. 在 Python 中探索中心极限定理\n\n```\n#\
  \ Samples of the uniform distribution will average out to a normal distribution.\n\
  import random\nimport plotly.express as px\n\nsample_size = 31\nsample_count = 1000\n\
  \n# Central limit theorem, 1000 samples each with 31 random numbers between 0.0\
  \ and 1.0\nx_values = [(sum([random.uniform(0.0, 1.0) for i in range(sample_size)])\
  \ / sample_size)\n            for _ in range(sample_count)]\n\ny_values = [1 for\
  \ _ in range(sample_count)]\n\npx.histogram(x=x_values, y=y_values, nbins=20).show()\n\
  ```\n\n![](img/8e0dcc1636d032e7728a07e97751e446_133_0.png)\n\n### 图 3-12. 对样本取均值（每个样本大小为\
  \ 31）并将其绘图。\n\n等等，当均匀随机数被分成每组 31 个并求平均时，怎么会大致形成正态分布呢？任何数字出现的可能性都相同，对吧？分布不应该是平坦的而非钟形曲线的吗？\n\
  \n事情是这样的。样本中的单独数字本身不会形成正态分布。分布会是平坦的，其中任何数字出现的可能性都相同（称为**均匀分布**）。但当我们将它们作为样本分组并求平均时，它们会形成正态分布。\n\
  \n这是因为**中心极限定理**，它指出当我们从总体中取足够大的样本，计算每个样本的均值，并将其作为分布绘制时，会发生有趣的事情：\n\n- 样本均值的均值等于总体均值。\n\
  - 如果总体是正态的，那么样本均值也将是正态的。\n- 如果总体不正态，但样本大小大于 30，大约样本均值仍然会形成正态分布。\n- 样本均值的标准差等于总体标准差除以样本大小的平方根。\n\
  \n样本标准差 = \\(\\frac{\\text{总体标准差}}{\\sqrt{\\text{样本大小}}}\\)\n\n以上所有为什么重要？这些行为使我们能够基于样本推断总体的有用信息，即使是非正态总体。如果你修改上述代码并尝试更小的样本大小（1\
  \ 或 2），你不会真正看到正态分布出现。但当你接近 31 或更多时，你会看到我们趋于正态分布，如图 3-13 所示。\n\n### 样本大小 = 1\n\n\
  ![](img/8e0dcc1636d032e7728a07e97751e446_135_0.png)\n\n### 样本大小 = 2\n\n![](img/8e0dcc1636d032e7728a07e97751e446_135_1.png)\n\
  \n### 样本大小 = 31\n\n![](img/8e0dcc1636d032e7728a07e97751e446_135_2.png)\n\n### 图\
  \ 3-13. 较大的样本大小趋近于正态分布\n\n31 是统计学中的教科书数字，因为此时我们的样本分布通常会趋于总体分布，尤其是当我们测量样本均值或其他参数时。当你样本中的项目少于\
  \ 31 个时，就必须依赖 T 分布而非正态分布，而样本量越小，T 分布的尾部就越肥。我们稍后会简要讨论这一点，但首先，当我们讨论置信区间和检验时，假设样本中至少有\
  \ 31 个项目。\n\n## 多少样本才足够？\n\n虽然 31 是样本中满足中心极限定理并看到正态分布所需的教科书项目数，但有时情况并非如此。有些情况下你需要更大的样本，例如当底层分布是不对称或多模态的（意味着它有多个峰值而非均值处的一个峰值）时。\n\
  \n总结来说，当你不确定底层概率分布时，拥有更大的样本更好。你可以阅读这篇文章以获取更多信息。\n\n## 置信区间\n\n你可能听说过置信区间这个术语，它常常让统计学新手和学生感到困惑。置信区间是一种范围计算，显示我们相信样本均值（或其他参数）落在总体均值范围内的置信程度。\n\
  \n_**基于31只金毛寻回犬的样本，样本均值为64.408，样本标准差为2.05，我有95%的把握认为总体均值介于63.686和65.1296之间。我怎么知道这一点？让我来向你展示，如果你感到困惑，请回到这一段落，记住我们试图实现什么。我之所以将其加粗是有原因！**_\n\
  \n我首先选择一个置信水平（LOC），它将包含总体均值范围所需的概率。我希望有95%的把握认为我的样本均值落在我将计算的总体均值范围内。这就是我的LOC。我们可以利用中心极限定理并推断总体均值的这个范围是什么。首先，我需要**临界\
  \ Z 值**，它是标准正态分布中对称范围，能让我中心区域有95%的概率，如图3-14中所强调。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_137_0.png)\n\
  \n### 图 3-14. 标准正态分布中心区域的95%对称概率\n\n我们如何计算包含面积0.95的这个对称范围？作为概念比作为计算更容易理解。你可能本能地想要使用CDF，但随后你可能会意识到这里还有更多的组成部分。\n\
  \n首先，你需要利用逆CDF。逻辑上，要获得中心区域95%的对称面积，我们会去除尾部，尾部拥有剩余的5%面积。将剩余的5%面积一分为二，每个尾部就有2.5%的面积。因此，我们想要查找x值的面积是0.025和0.975，如图3-15所示。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_138_0.png)\n\n### 图 3-15. 我们想要给出面积0.025和0.975的x值\n\
  \n我们可以查找面积0.025对应的x值，以及面积0.975对应的x值，这将给我们包含95%面积的中心范围。然后我们将返回包含该面积的相应上下z值。请记住，我们这里使用的是标准正态分布，所以它们除了正负号外是相同的。让我们按照示例\
  \ 3-16 所示在 Python 中计算这一点。\n\n### 示例 3-16. 检索临界 Z 值\n\n```\nfrom scipy.stats import\
  \ norm\n\ndef critical_z_value(p):\n    norm_dist = norm(loc=0.0, scale=1.0)\n \
  \   left_tail_area = (1.0 - p) / 2.0\n    upper_area = 1.0 - ((1.0 - p) / 2.0)\n\
  \    return norm_dist.ppf(left_tail_area), norm_dist.ppf(upper_area)\n\nprint(critical_z_value(p=.95))\n\
  # (-1.9599639845400054, 1.9599639845400054)\n```\n\n好的，我们得到 ±1.95996，这就是捕获标准正态分布中心区域95%概率的临界Z值。接下来，我将利用中心极限定理来计算**误差范围（E）**，它是在该置信水平下包含总体均值的样本均值周围的范围。回顾一下，我们31只金毛寻回犬的样本均值为64.408，标准差为2.05。获取此误差范围的公式如下所示：\n\
  \n```\nE = \\pm z_c \\frac{s}{\\sqrt{n}}\n\nE = \\pm 1.95996 * \\frac{2.05}{\\sqrt{31}}\n\
  \nE = \\pm 0.72164\n```\n\n如果我们将该误差范围应用于样本均值，我们最终就得到了置信区间！\n\n95% 置信区间 = 64.408\
  \ ± 0.72164\n\n以下是按照示例 3-17 所示，从头到尾在 Python 中计算此置信区间的方法。\n\n### 示例 3-17. 在 Python\
  \ 中计算置信区间\n\n```\nfrom math import sqrt\nfrom scipy.stats import norm\n\ndef critical_z_value(p):\n\
  \    norm_dist = norm(loc=0.0, scale=1.0)\n    left_tail_area = (1.0 - p) / 2.0\n\
  \    upper_area = 1.0 - ((1.0 - p) / 2.0)\n    return norm_dist.ppf(left_tail_area),\
  \ norm_dist.ppf(upper_area)\n\ndef confidence_interval(p, sample_mean, sample_std,\
  \ n):\n    # Sample size must be greater than 30\n    lower, upper = critical_z_value(p)\n\
  \    lower_ci = lower * (sample_std / sqrt(n))\n    upper_ci = upper * (sample_std\
  \ / sqrt(n))\n    return sample_mean + lower_ci, sample_mean + upper_ci\n```\n\n\
  \n\n```\nprint(confidence_interval(p=.95, sample_mean=64.408, sample_std=2.05,\n\
  n=31))\n# (63.68635915701992, 65.12964084298008)\n```\n\n所以解读这句话的方式是：“基于我对31只金毛犬体重的样本，样本均值为64.408，样本标准差为2.05，我有95%的把握总体均值在63.686到65.1296之间”。这就是我们描述置信区间的方式。\n\
  \n另一个值得注意的有趣之处是，在我们的误差公式中，n越大，置信区间就越窄！这很合理，因为如果我们拥有更大的样本，就更有把握总体均值落在更小的范围内，这也就是为什么它被称为置信区间。\n\
  \n这里需要注意的一个前提是，为了使此方法生效，样本量必须至少为31个样本。这回溯到了中心极限定理，如果我们想将置信区间应用于更小的样本，则需要使用方差更大（尾部更肥，反映更多不确定性）的分布。这就是T分布的用途，我们将在本章末尾探讨。\n\
  \n在第5章中，我们将继续将置信区间用于线性回归。\n\n## 理解P值\n\n当我们说某事具有统计显著性时，究竟是什么意思？我们经常听到这个词被随意和频繁地使用，但它在数学上究竟意味着什么？从技术上讲，这与所谓的p值有关，这是许多人难以掌握的概念。但我认为，当你追溯p值的起源时，p值的概念会更容易理解。虽然这是一个不完美的例子，但它传达了一些重大理念。\n\
  \n1925年，一位名叫罗纳德·费舍尔的数学家正在参加一个派对。他的同事默里尔·布里斯托尔声称，她可以仅凭品尝就判断出茶是先倒入牛奶还是先倒入茶。被这一说法吸引，罗纳德当场设计了一个实验。\n\
  \n他准备了8杯茶。4杯先倒了牛奶，另外4杯先倒了茶。随后他将这些茶呈送给这位鉴赏家同事，并让她识别每杯茶的倒入顺序。令人惊叹的是，她全部答对了，而这种情况纯属偶然发生的概率是70分之1，即0.01428571。\n\
  \n这个1.4%的概率就是我们所说的 **p值**，即某事纯属偶然发生而非基于假设性解释的概率。无需深入组合数学的细节，默里尔完全凭猜测正确识别所有茶杯的概率是1.4%。这究竟告诉了你什么？\n\
  \n在设计实验时，无论是确定有机甜甜圈是否导致体重增加，还是居住在高压线附近是否导致癌症，我们都必须考虑运气成分的可能性。就像默里尔有1.4%的概率仅凭猜测就正确识别茶杯一样，随机性也总有可能像老虎机一样给了我们一手好牌。这有助于我们构建\
  \ **原假设（H0）**，即质疑的变量对实验没有影响，任何积极结果都只是随机运气。而 **备择假设（H1）** 则提出，质疑的变量（称为 **受控变量**）正在导致积极结果。\n\
  \n传统上，统计显著性的阈值是p值小于或等于5%，即.05。由于.014小于.05，这意味着我们可以拒绝默里尔在随机猜测的原假设。随后我们可以支持备择假设，即默里尔具有特殊能力，能够判断是先倒茶还是先倒牛奶。\n\
  \n现在，茶会示例未能体现的一点是，在计算p值时，我们会捕捉该事件或更罕见事件的所有概率。我们将在接下来使用正态分布的示例中探讨这一点。\n\n## 假设检验\n\
  \n以往研究表明，感冒的平均康复时间为18天，标准差为1.5天，且服从正态分布。\n\n这意味着康复时间在15到21天之间的概率约为95%，如图3-16和示例3-18所示。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_142_0.png)\n\n图3-16. 康复时间在15到21天之间的概率为95%\n\
  \n### 示例3-18. 计算康复时间在15到21天之间的概率\n\n```\nfrom scipy.stats import norm\n\n# Cold\
  \ has 18 day mean recovery, 1.5 std dev\nmean = 18\nstd_dev = 1.5\n\n# 95% probability\
  \ recovery time takes between 15 and 21 days.\nx = norm.cdf(21, mean, std_dev) -\
  \ norm.cdf(15, mean, std_dev)\n\nprint(x) # 0.9544997361036416\n```\n\n因此，从剩余的5%概率可以推断，康复时间超过21天的概率为2.5%，少于15天的概率也为2.5%。请记住这个信息，因为稍后至关重要！这就是驱动我们p值的因素。\n\
  \n现在假设一种实验性新药被给予一组40人的测试组，他们从感冒中康复的平均时间为16天，如图3-17所示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_143_0.png)\n\
  \n图3-17. 服用药物的一组人花费16天康复\n\n该药物是否有效？如果你思考足够久，可能会意识到我们真正在问的是：该药物是否显示出统计显著性？或者药物无效，16天的康复只是测试组的巧合？第一个问题构成了我们的备择假设，而第二个问题构成了我们的原假设。\n\
  \n计算此问题有两种方法：单侧检验和双侧检验。我们将从单侧检验开始。\n\n### 单侧检验\n\n在进行单侧检验时，我们通常使用不等式来表述原假设和备择假设。我们围绕总体均值提出假设，即总体均值要么大于或等于18（原假设H0），要么小于18（备择假设H1）。\n\
  \n```\nH0 : population mean ≥ 18\nH1 : population mean < 18\n```\n\n要拒绝原假设，我们需要证明服药患者的样本均值不太可能是巧合。由于传统上p值小于或等于.05被视为统计显著，我们将使用此作为阈值（图3-17）。当我们使用Python中的逆累积分布函数计算此问题时，如图3-18和示例3-19所示，我们发现大约15.51天是左侧尾部面积为.05的康复天数。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_145_0.png)\n\n图3-18. 获取尾部面积为5%的x值\n\n\
  ### 示例3-19. 获取尾部面积为5%的x值的Python代码\n\n```\nfrom scipy.stats import norm\n\n# Cold\
  \ has 18 day mean recovery, 1.5 std dev\nmean = 18\nstd_dev = 1.5\n\n# What x-value\
  \ has 5% of area behind it?\nx = norm.ppf(.05, mean, std_dev)\n\nprint(x) # 15.53271955957279\n\
  ```\n\n因此，如果我们的样本组平均康复时间达到15.53天或更少，则我们的药物被认为具有足够的统计显著性来证明有影响。然而，我们的康复时间样本均值实际上是16天，并不落入这个原假设拒绝区域。因此，统计显著性检验失败了，如图3-19所示。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_146_0.png)\n\n图3-19. 我们未能证明药物测试结果具有统计显著性\n\
  \n直到16天那个点的面积即为我们的p值，为.0912，我们通过Python如示例3-20所示进行计算。\n\n### 示例3-20. 计算单侧p值\n\n```\n\
  from scipy.stats import norm\n\n# Cold has 18 day mean recovery, 1.5 std dev\nmean\
  \ = 18\nstd_dev = 1.5\n\n# Probability of 16 or less days\np_value = norm.cdf(16,\
  \ mean, std_dev)\n\nprint(p_value) # 0.09121121972586788\n```\n\n由于p值.0912大于我们的统计显著性阈值.05，我们不认为药物试验成功，因此无法拒绝原假设。\n\
  \n### 双侧检验\n\n我们之前进行的检验被称为单侧检验，因为它只在一侧尾部寻找统计显著性。然而，它通常更安全、更好\n\n\n采用双尾检验的练习。我们将稍后阐述原因，但先计算一下。\n\
  \n执行 **双尾检验** 时，我们将原假设和备选假设构建为“相等”与“不相等”的结构。在我们的药物测试中，原假设表示平均恢复时间为 18 天。但我们的备选假设是，由于新药的作用，平均恢复时间不是\
  \ 18 天。\n\n$H_0 : \\text{population mean} = 18$\n\n$H_1 : \\text{population mean}\
  \ \\neq 18$\n\n这有一个重要的含义。我们构建备选假设并非为了检验药物是否改善感冒恢复时间，而是为了检验它是否产生了 _任何_ 影响。这包括检验它是否延长了感冒持续时间。这有帮助吗？请先保留这个想法。\n\
  \n自然，这意味着我们将 p 值统计显著性阈值分布到两个尾部，而不仅仅是一个。如果我们进行 5% 的统计显著性检验，则将其分割，给每个尾部各分配 2.5%。如果我们的药物平均恢复时间落入任一区域，则检验成功，我们拒绝原假设（图\
  \ 3-20）。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_148_0.png)\n\nFigure 3-20.\
  \ 双尾检验\n\n下尾和上尾的 x 值分别为 15.06 和 20.93，这意味着如果分别低于或高于这些值，我们拒绝原假设。以下面的图 3-21 和示例 3-21\
  \ 中使用逆 CDF 计算的两个值。请记住，要得到上尾，我们取 .95，然后再加上 .025 的显著性阈值，得到 .975。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_149_0.png)\n\
  \nFigure 3-21. 计算正态分布中心 95% 区域\n\n### 示例 3-21.\n\n```\nfrom scipy.stats import norm\n\
  \n# Cold has 18 day mean recovery, 1.5 std dev\nmean = 18\nstd_dev = 1.5\n\n# What\
  \ x-value has 2.5% of area behind it?\nx1 = norm.ppf(.025, mean, std_dev)\n\n# What\
  \ x-value has 97.5% of area behind it\nx2 = norm.ppf(.975, mean, std_dev)\n\nprint(x1)\
  \ # 15.060054023189918\nprint(x2) # 20.93994597681008\n```\n\n药物测试组的样本均值为 16，而 16\
  \ 既不小于 15.06 也不大于 20.9399。因此，与单尾检验一样，我们仍未能拒绝原假设。如图 3-22 所示，我们的药物仍未显示出具有任何影响的统计显著性。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_150_0.png)\n\nFigure 3-22. 双尾检验未能证明统计显著性\n\
  \n但 p 值是多少？在双尾检验中，这里变得有趣了。我们的 p 值不仅会捕获 16 左侧的区域，还会捕获右侧尾部对称的等效区域。由于 16 低于均值 4 天，我们还会捕获高于\
  \ 20 的区域，即高于均值 4 天（图 3-23）。这是捕获钟形曲线两侧某事件或更罕见事件的概率。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_151_0.png)\n\
  \nFigure 3-23. p 值为统计显著性添加对称两侧\n\n将这两个区域相加，我们得到 p 值为 .1824。这远大于 .05，因此它肯定不符合我们的\
  \ p 值阈值 .05（示例 3-22）。\n\n### 示例 3-22. 计算双尾 p 值\n\n```\nfrom scipy.stats import norm\n\
  \n# Cold has 18 day mean recovery, 1.5 std dev\nmean = 18\nstd_dev = 1.5\n\n# Probability\
  \ of 16 or less days\np1 = norm.cdf(16, mean, std_dev)\n\n# Probability of 20 or\
  \ more days\np2 = 1.0 - norm.cdf(20, mean, std_dev)\n\n# P-value of both tails\n\
  p_value = p1 + p2\n\nprint(p_value) # 0.18242243945173575\n```\n\n那么，为什么在双尾检验中，我们还要加上对面侧的对称区域呢？这可能不是最直观的概念，但首先请记住我们如何构建假设：\n\
  \n$$H_0 : \\text{population mean} = 18$$\n\n$$H_1 : \\text{population mean} \\neq\
  \ 18$$\n\n如果我们以“等于 18”对“不等于 18”的方式进行检验，就必须捕获两侧任何等于或低于该值的概率。毕竟，我们试图证明显著性，而这包括任何同样或更不太可能发生的情况。在只使用“大于/小于”逻辑的单尾检验中，我们并没有这种特殊考虑。但在处理“等于/不等于”时，我们的关注区域会向两个方向延伸。\n\
  \n那么，双尾检验的实际意义是什么？它如何影响我们是否拒绝原假设？问自己：哪一个设定了更高的阈值？你会发现，即使我们的目标是展示我们可能减少了某事（使用药物缩短感冒恢复时间），将假设重新构建为展示任何影响（更大或更小）也会创建更高的显著性阈值。如果我们的显著性阈值是\
  \ p 值 .05 或更低，我们的单尾检验在 p 值 .0912 时更接近接受，而双尾检验则约为两倍，即 p 值 .182。\n\n这意味着双尾检验使拒绝原假设更加困难，并要求通过检验需要更强的证据。还要考虑一下：如果我们的药物可能会加重感冒并延长持续时间呢？捕捉该方向的概率并考虑该方向的变异可能也是有帮助的。这就是为什么在大多数情况下，双尾检验更可取。它们往往更可靠，且不会将假设偏向单一方向。\n\
  \n我们将在第 5 章和第 6 章中再次使用假设检验和 P 值。\n\n## 警惕 P-hacking！\n\n科学研究界日益引起关注的一个问题叫做 p-hacking，即研究者寻找统计显著（p\
  \ 值 ≤ .05）的 p 值。在“大数据”、机器学习和数据挖掘中，这并不难做到，我们可以遍历数百或数千个变量，然后找到它们之间统计显著（但巧合的）关系。\n\n\
  为什么这么多研究者进行 p-hack？许多人可能没有意识到自己在这样做。很容易不断调整模型，剔除“有噪声”的数据并更改参数，直到得到“正确”的结果。其他人只是受到学术界和工业界的压力，需要产出有利可图而非客观的结果。\n\
  \n如果你被 Calvin 谷物公司雇来研究糖霜巧克力糖炸弹是否会导致糖尿病，你期望给出诚实分析并再次被雇佣吗？如果经理要求你制作预测，显示新产品下季度销售额为\
  \ 1500 万美元，会怎样？你无法控制销售情况，但被要求提供一个产生预设结果的模型。最坏的情况下，当结果被证明错误时，你甚至可能要承担责任。不公平，但确实会发生！\n\
  \n这就是为什么像外交手腕这样的软技能可以在数据科学专业人士的职业生涯中起到关键作用。如果你能以一种能让受众接受的方式分享困难且不便的故事，那是一项了不起的成就。只需注意组织的管理氛围，并始终提出替代方案。如果你最终陷入被要求进行\
  \ p-hack 且可能在其适得其反时被追究责任的两难境地，那么一定要改变工作环境！\n\n## T 分布：处理小样本\n\n让我们简要探讨如何处理 30 或以下的小样本，在进行第\
  \ 5 章的线性回归时我们会用到这一点。无论是计算置信区间还是进行假设检验，如果样本包含 30 个或以下项目，我们会选择使用 T 分布而不是正态分布。T 分布类似于正态分布，但尾部更肥，以反映更大的方差和不确定性。图\
  \ 3-24 展示了正态分布（虚线）与自由度为 1 的 T 分布（实线）并排对比：\n\n![](img/8e0dcc1636d032e7728a07e97751e446_154_0.png)\n\
  \nFigure 3-24. 与正态分布并排的 T 分布。注意更肥的尾部。\n\n样本量越小，T 分布的尾部就越肥。但有趣的是，当样本量接近 31 项后，T 分布几乎\n\
  \n\n与正态分布无法区分，这清晰地反映了中心极限定理背后的思想。\n\n下面的示例 3-23 展示了如何找到 95% 置信水平的临界 t 值。当样本量为 30\
  \ 或以下时，你可以使用它来进行置信区间估计和假设检验。它在概念上与临界 z 值相同，但我们使用 T 分布而不是正态分布来反映更大的不确定性。样本量越小，反映更大不确定性的范围就越大。\n\
  \n## Example 3-23\n\n```\nfrom scipy.stats import t\n\n# get critical value range\
  \ for 95% confidence\n# with a sample size of 25\n\nn = 25\nlower = t.ppf(.025,\
  \ df=n-1)\nupper = t.ppf(.975, df=n-1)\n\nprint(lower, upper)\n-2.063898561628021\
  \ 2.0638985616280205\n```\n\n请注意，df 是“自由度”参数，如前所述，它应比样本量小 1。\n\n## 超越均值\n\n我们可以使用置信区间和假设检验来测量均值以外的其他参数，包括方差/标准差以及比例（例如，60%\
  \ 的人报告每天步行 1 小时后幸福感有所提高）。这些需要其他分布，例如卡方分布，而不是正态分布。如前所述，这些都超出了本书的范围，但希望你已打下坚实的概念基础，以便在需要时能够扩展到这些领域。\n\
  \n不过，我们将在整个第 5 章和第 6 章中使用置信区间和假设检验。\n\n## 大数据注意事项与德州神枪手谬误\n\n在结束本章之前，最后一个想法。正如我们所讨论的，随机性在验证我们的发现中扮演着重要角色，我们始终必须考虑其可能性。不幸的是，随着“大数据”、机器学习和其他数据挖掘工具的兴起，科学方法突然变成了倒行逆施的事情。这可能很危险，让我来解释原因，我将改编加里·史密斯在其著作《标准偏差》中的一个例子。\n\
  \n让我们假设我从一副标准扑克牌中抽出 4 张牌。这里没有游戏或目标，除了抽出 4 张牌并观察它们。我得到两张 10，一张 3 和一张 2。“这很有趣，”我说。“我抽到了两张\
  \ 10，一张 3 和一张 2。这有意义吗？我接下来抽的四张牌也会是两个连续数字和一对吗？这里的基本模型是什么？”\n\n你看到我在那里做了什么吗？我采取了一件完全是随机的事情，不仅寻找模式，还试图根据它们建立预测模型。这里微妙发生的事情是，我从未将抽到这四张具有特定模式的牌作为目标。我是在他们出现后才观察到的。\n\
  \n这正是数据挖掘每天中招的方式：在随机事件中发现巧合的模式。在有大量数据和快速算法寻找模式的情况下，找到看起来有意义但实际上只是随机巧合的事情并不难。\n\n\
  这也类似于我朝墙开枪，然后在弹孔周围画一个靶子，接着叫朋友过来炫耀我的神枪手技巧。蠢吗？对吧？嗯，许多数据科学从业者实际上每天都在这样做，这被称为德州神枪手谬误。他们没有目标就开始行动，偶然发现某种罕见的事情，然后指出他们发现的东西不知怎地创造了预测价值。\n\
  \n问题在于大数定律表明罕见事件很可能会被发现，只是我们不知道是哪些。当我们遇到罕见事件时，我们会强调甚至推测可能导致它们的原因。问题就在于此。特定个人中彩票的概率极低，但总有人会中彩票。当有中奖者时，我们为什么要感到惊讶？除非有人预测了中奖者，否则除了某个随机的人走运之外，什么有意义的事情都没有发生。\n\
  \n这也适用于我们将在第 5 章中学习的相关性。在拥有数千个变量的巨大数据集中，用 .05 的 p 值找到统计显著的结果很难吗？你赌对了！我会找到成千上万个这样的结果。我甚至会展示证据，尼古拉斯·凯奇的电影数量与一年中的游泳池溺亡人数相关。\n\
  \n因此，为了防止德州神枪手谬误和陷入大数据谬误，请尝试使用结构化的假设检验并为该目标收集数据。如果你使用数据挖掘，请尝试获取新数据以查看你的发现是否仍然成立。最后，始终考虑事情可能是巧合的可能性，如果没有常识性的解释，那它很可能就是巧合。\n\
  \n我们学会了在收集数据之前如何提出假设，但数据挖掘先收集数据再提出假设。具有讽刺意味的是，我们从假设开始往往更客观，因为随后我们会寻找数据来故意证明或反驳我们的假设。\n\
  \n## 结论\n\n在本章中我们学到了很多，你应该为自己走到这一步而感到高兴。这可能是本书中较难的主题之一！我们不仅学习了从均值到正态分布的描述性统计，还掌握了置信区间和假设检验。\n\
  \n希望你能以略有不同的眼光看待数据。它是对某事物的快照，而非对现实的完整捕捉。单靠数据并不十分有用，我们需要背景、好奇心以及对数据来源的分析，才能从中获得有意义的洞察。我们介绍了如何描述数据，以及如何基于样本推断更大总体的属性。最后，我们探讨了如果不小心可能会陷入的某些数据挖掘谬误，以及如何通过新数据和常识来补救。\n\
  \n如果你需要回头复习本章的一些内容，请不要难过，因为这里有很多东西需要消化。如果你希望在数据科学和机器学习领域取得成功，进入假设检验的思维模式也很重要。很少有从业者花时间将统计学和假设检验概念与机器学习联系起来，这很遗憾。可理解性和可解释性是机器学习的下一个前沿，因此请继续学习并将这些想法融入到本书剩余部分以及你整个职业生涯中。\n\
  \n## 练习\n\n- 1. 你为 3D 打印机购买了一卷 1.75mm 耗材。你想测量耗材直径实际与 1.75 mm 有多接近。你使用卡尺工具在耗材卷上五次采样直径：1.78,\
  \ 1.75, 1.72, 1.74, 1.77。计算这组数值的均值和标准差。\n\n- 2. 一家制造商声称 Z-Phone 智能手机的平均消费寿命为 42\
  \ 个月，标准差为 8 月。假设呈正态分布，给定的随机 Z-Phone 在 20 到 30 个月之间持续使用的概率是多少？\n\n- 3. 我怀疑我的 3D 打印机耗材平均直径并非如宣传的\
  \ 1.75mm。我用工具采样了 34 次测量值。样本均值为 1.715588，样本标准差为 0.029252。我整卷耗材的均值 99% 置信区间是多少？\n\n\
  - 4. 你的市场部门发起了一个新的广告活动，想知道它是否影响了销售，过去销售平均每天 10,345 美元，标准差为 552 美元。新的广告活动持续了 45 天，平均销售额为\
  \ 11,641 美元。该活动影响了销售吗？为什么或为什么不？（为获得更可靠的显著性，请使用双尾检验）\n\n答案在附录 B 中。\n"
- "# 第 4 章. 线性代数\n\n稍微换个话题，让我们从概率和统计学转向线性代数。有时候人们会把线性代数和基础代数混淆，认为它可能与使用代数函数 y = mx\
  \ + b 绘制直线有关。这就是为什么线性代数或许应该被称为“向量代数”或“矩阵代数”，因为它更加抽象。线性系统确实发挥作用，但方式更加形而上学。\n\n那么，线性代数究竟是什么？嗯，线性代数关注线性系统，但通过向量空间和矩阵来表示它们。如果你不知道向量或矩阵是什么，不要担心！我们将深入定义和探讨它们。线性代数对数学、统计学、运筹学、数据科学和机器学习等许多应用领域至关重要。当我们在这些领域中任何一个处理数据时，我们都在使用线性代数，或许你甚至都不知道。\n\
  \n你可以暂时不学习线性代数，使用那些为你完成所有工作的机器学习和统计库。但如果我们想了解这些黑箱背后的直觉，并更有效地处理数据，理解线性代数的基础是必然的。线性代数是一个巨大的主题，可以填满厚厚的教科书，因此我们当然无法仅在本书的一章中完全掌握它。然而，我们可以学到足够的内容，使自己更加熟悉它并有效地在数据科学领域中导航。本书的剩余章节（包括第\
  \ 5 章和第 7 章）也将有机会应用它。\n\n## 什么是向量？\n\n简单来说，向量是空间中具有特定方向和长度的箭头，通常代表一段数据。它是线性代数（包括矩阵和线性变换）的核心构建块。在其\n\
  \n\nfundamental form, it has no concept of location so always imagine its tail starts\
  \ at the origin of a Cartesian plane (0,0).\n\nFigure 4-1 shows a vector \\(\\vec{v}\\\
  ) that moves 3 steps in the horizontal direction and 2 steps in the vertical direction.\n\
  \n\\(\\vec{v} = \\begin{bmatrix} 3 \\\\ 2 \\end{bmatrix}\\)\n\n![](img/8e0dcc1636d032e7728a07e97751e446_161_0.png)\n\
  \n### Figure 4-1. A simple vector\n\nTo emphasize again, the purpose of the vector\
  \ is to visually represent a piece of data. If you have a data record for the square\
  \ footage of a house 18,000 square feet and its valuation $260,000, we could express\
  \ that as a vector `[18000 260000]`, stepping 18,000 steps in the horizontal direction\
  \ and 260,000 steps in the vertical direction.\n\nWe declare a vector mathematically\
  \ like this:\n\n$$\\vec{v} = \\begin{bmatrix} x \\\\ y \\end{bmatrix}$$\n\n$$\n\\\
  vec{v} = \\begin{bmatrix} 3 \\\\ 2 \\end{bmatrix}\n$$\n\nWe can declare a vector\
  \ using a simple Python collection, like a Python list as shown in Example 4-1.\n\
  \n### Example 4-1. Declaring a vector in Python using a list\n\n```\nv = [3, 2]\n\
  print(v)\n```\n\nHowever when we start doing mathematical computations with vectors,\
  \ especially when doing tasks like machine learning, we should probably use the\
  \ NumPy library as it is more efficient than plain Python. You can also use SymPy\
  \ to perform linear algebra operations, and we will use it occasionally in this\
  \ chapter when decimals become inconvenient. However, NumPy is what you will likely\
  \ use in practice so that is what we will mainly stick to.\n\nTo declare a vector,\
  \ you can use NumPy’s `array()` function and then can pass a collection of numbers\
  \ to it as shown in Example 4-2.\n\n### Example 4-2. Declaring a vector in Python\
  \ using NumPy\n\n```\nimport numpy as np\nv = np.array([3, 2])\nprint(v)\n```\n\n\
  ## PYTHON IS SLOW, ITS NUMERICAL LIBRARIES ARE NOT\n\nPython is a computationally\
  \ slow language platform, as it does not compile to lower-level machine code like\
  \ Java, C#, C, etc. It is dynamically interpreted at runtime. However Python’s numeric\
  \ and scientific libraries are not slow. Libraries like NumPy are typically written\
  \ in low-level languages like C and C++, hence why they are computationally efficient.\
  \ Python really acts as “glue code” integrating these libraries for your tasks.\n\
  \nA vector has countless practical applications. In physics, a vector is often thought\
  \ of as a direction and magnitude. In math it is a direction and scale on an XY\
  \ plane, kind of like a movement. In computer science, it is an array of numbers\
  \ storing data. The computer science context is the one we will become the most\
  \ familiar with as data science professionals. However it is important we never\
  \ forget the visual aspect so we do not think of vectors as esoteric grids of numbers.\
  \ Without a visual understanding it is almost impossible to grasp many fundamental\
  \ linear algebra concepts like linear dependence and determinants.\n\nHere are some\
  \ more examples of vectors. In Figure 4-2 note that some of these vectors have negative\
  \ directions on the X and Y scales. Vectors with negative directions will have an\
  \ impact when we combine them later, essentially subtracting rather than adding\
  \ them together.\n\n![](img/8e0dcc1636d032e7728a07e97751e446_164_0.png)\n\n$$ \\\
  vec{v} = \\begin{bmatrix} 3 \\\\ 4 \\end{bmatrix} $$\n\n![](img/8e0dcc1636d032e7728a07e97751e446_164_1.png)\n\
  \n$$ \\vec{v} = \\begin{bmatrix} -3 \\\\ 2 \\end{bmatrix} $$\n\n![](img/8e0dcc1636d032e7728a07e97751e446_164_2.png)\n\
  \n$$ \\vec{v} = \\begin{bmatrix} -4 \\\\ 4 \\end{bmatrix} $$\n\n### Figure 4-2.\
  \ A sampling of different vectors\n\n## WHY ARE VECTORS USEFUL?\n\nA struggle many\
  \ people have with vectors (and linear algebra in general) is understanding why\
  \ they are useful. They are a highly abstract concept but it has many tangible applications.\
  \ Computer graphics are easier to work with when you have a grasp of vectors and\
  \ linear transformations (the fantastic Manim visualization library defines animations\
  \ and transformations `with vectors`). When doing statistics and machine learning\
  \ work, data is often imported and turned into numerical vectors so we can work\
  \ with it. Solvers like the one in Excel or Python PuLP use linear programming,\
  \ which uses vectors to maximize a solution while meeting those constraints. Even\
  \ video games and flight simulators use vectors and linear algebra not just to model\
  \ graphics but also physics. I think what makes vectors so hard to grasp is not\
  \ that their application is unobvious, but rather these applications are so diverse\
  \ it is hard to see the generalization.\n\nNote also vectors can exist on more than\
  \ two dimensions. Below we declare a 3-dimensional vector along axes x, y, and z:\n\
  \n```\n\\(\\vec{v} = \\begin{bmatrix} x \\\\ y \\\\ z \\end{bmatrix} = \\begin{bmatrix}\
  \ 4 \\\\ 1 \\\\ 2 \\end{bmatrix}\\)\n```\n\nNote to create the vector above we are\
  \ stepping 4 steps in the x direction, 1 in the y direction, and 2 in the z direction.\
  \ Here it is visualized in Figure 4-3. Note that we no longer are showing a vector\
  \ on a 2-dimensional grid but rather a 3-dimensional space with 3 axes: x, y, and\
  \ z.\n\n![](img/8e0dcc1636d032e7728a07e97751e446_166_0.png)\n\n### Figure 4-3. A\
  \ 3-dimensional vector\n\nNaturally we can express this 3-dimensional vector in\
  \ Python using 3 numeric values, as declared in Example 4-3.\n\n### Example 4-3.\
  \ Declaring a 3-dimensional vector in Python using NumPy\n\n```\nimport numpy as\
  \ np\nv = np.array([4, 1, 2])\nprint(v)\n```\n\nLike many mathematical models, visualizing\
  \ more than 3 dimensions is challenging and something we will not expend energy\
  \ doing so in this book. But numerically it is still straightforward. Example 4-4\
  \ shows how we declare a 5-dimensional vector mathematically in Python.\n\n![](img/8e0dcc1636d032e7728a07e97751e446_167_0.png)\n\
  \n### Example 4-4. Declaring a 5-dimensional vector in Python using NumPy\n\n```\n\
  import numpy as np\nv = np.array([6, 1, 5, 8, 3])\nprint(v)\n```\n\n## Adding and\
  \ Combining Vectors\n\nOn their own, vectors are not terribly interesting. You express\
  \ a direction and size, kind of like a movement of space. But when you start combining\
  \ vectors, known as **vector addition**, it starts to get interesting. We effectively\
  \ combine the movements of two vectors into a single vector.\n\nSay we have two\
  \ vectors \\(\\vec{v}\\) and \\(\\vec{w}\\) as shown in Figure 4-4. How do we add\
  \ these two vectors together?\n\n![](img/8e0dcc1636d032e7728a07e97751e446_168_0.png)\n\
  \n### Figure 4-4. Adding two vectors together\n\nWe will get to why adding vectors\
  \ is useful in a moment. But if we wanted to combine these two vectors, including\
  \ their direction and scale, what would that look like? Numerically this is straightforward.\
  \ You simply add the respective $x$ values and then the $y$ values into a new vector\
  \ as shown in Example 4-5.\n\n$$\\vec{v} = \\begin{bmatrix} 3 \\\\ 2 \\end{bmatrix}$$\n\
  \n\\(\\vec{w} = \\begin{bmatrix} 2 \\\\ -1 \\end{bmatrix}\\)\n\\(\\vec{v} + \\vec{w}\
  \ = \\begin{bmatrix} 3+2 \\\\ 2 + (-1) \\end{bmatrix} = \\begin{bmatrix} 5 \\\\\
  \ 1 \\end{bmatrix}\\)\n\n### Example 4-5. Adding two vectors in Python using NumPy\n\
  \n```\nfrom numpy import array\n\nv = array([3,2])\nw = array([2,-1])\n\n# sum the\
  \ vectors\nv_plus_w = v + w\n\n# display summed vector\nprint(v_plus_w) # [5, 1]\n\
  ```\n\nBut what does this mean visually? To visually add these two vectors together,\
  \ connect one vector after the other and walk to the tip of the last vector (Figure\
  \ 4-5). The point you end at is a new vector, the result of summing the two vectors.\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_170_0.png)\n\n### Figure 4-5. Adding\
  \ two vectors into a new vector\n\nAs seen above in Figure 4-5, when we walk to\
  \ the end of the last vector \\(\\vec{w}\\) we end up with a new vector [5, 1].\
  \ This new vector is the result of summing \\(\\vec{v}\\) and \\(\\vec{w}\\). In\
  \ practice, this can be simply adding data together. If we were totaling housing\
  \ values and their square footage in an area, we would be adding several vectors\
  \ into a single vector in this manner.\n\nNote that it does not matter whether we\
  \ add \\(\\vec{v}\\) before \\(\\vec{w}\\) or vice versa, which means it is **commutative**\
  \ and order of operation does not matter. If we walk \\(\\vec{w}\\) before \\(\\\
  vec{v}\\) we end up with the same resulting vector [5, 1] as visualized in Figure\
  \ 4-6.\n\n\n\n\n\n![](img/8e0dcc1636d032e7728a07e97751e446_171_0.png)\n\n图 4-6.\
  \ 向量加法满足交换律\n\n## 缩放向量\n\n缩放是增长或缩短向量的长度。你可以通过乘以一个单一值（称为**标量**）来增长或缩短向量。图 4-7 展示了向量\
  \ \\(\\vec{v}\\) 被 2 倍缩放，即长度加倍。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_172_0.png)\n\
  \n图 4-7. 缩放向量\n\n在数学上，你将向量的每个元素乘以标量值。\n\n\\(\\vec{v} = \\begin{bmatrix} 3 \\\\ 2\
  \ \\end{bmatrix}\\)\n\n\\(2\\vec{v} = 2 \\begin{bmatrix} 3 \\\\ 2 \\end{bmatrix}\
  \ = \\begin{bmatrix} 3 \\times 2 \\\\ 2 \\times 2 \\end{bmatrix} = \\begin{bmatrix}\
  \ 6 \\\\ 4 \\end{bmatrix}\\)\n\n在 Python 中执行此缩放操作就像用向量乘以标量一样简单，如示例 4-6 所示。\n\n##\
  \ 示例 4-6. 使用 NumPy 在 Python 中缩放数字\n\n```\nfrom numpy import array\n\nv = array([3,1])\n\
  \n# scale the vector\nscaled_v = 2.0 * v\n\n# display scaled vector\nprint(scaled_v)\
  \  # [6 2]\n```\n\n如图 4-8 所示，向量 \\(\\vec{v}\\) 被 0.5 倍缩放，即长度减半。\n\n\\(\\vec{v} =\
  \ \\begin{bmatrix} 3 \\\\ 1 \\end{bmatrix}\\)\n\n![](img/8e0dcc1636d032e7728a07e97751e446_174_0.png)\n\
  \n\\(0.5\\vec{v} = \\begin{bmatrix} 3 \\\\ 1.5 \\end{bmatrix}\\)\n\n图 4-8. 将向量缩小一半\n\
  \n## 操纵数据即操纵向量\n\n每个数据操作都可以用向量来理解，即使是简单的平均值。\n\n以缩放为例。假设我们想要获取整个社区的平均房价和平均面积。我们会将向量相加，分别合并它们的价值和面积，得到一个包含总价值和总面积的巨型向量。然后我们通过除以房屋数量\
  \ N 来缩小该向量，这实际上就是乘以 1/N。现在我们有一个包含平均房价和平均面积的向量了。\n\n这里需要注意的一个重要细节是：缩放向量不会改变其方向，只改变其大小。但这条规则有一个小例外，如图\
  \ 4-9 所示。当你将向量乘以负数时，它会翻转向量的方向，如下所示：\n\n![](img/8e0dcc1636d032e7728a07e97751e446_176_0.png)\n\
  \n图 4-9. 负标量会翻转向量方向\n\n不过仔细想一想，用负数缩放并没有真正改变方向，因为向量仍然位于同一条直线上。这引出了一个关键概念：线性相关性。\n\
  \n## 展开与线性相关性\n\n这两种操作——向量相加和缩放——带来了一个简单但强大的想法。通过这两种操作，我们可以合并两个向量并缩放它们，以创建任意想要的结果向量。图\
  \ 4-10 展示了六个示例：取两个向量 \\(\\vec{v}\\) 和 \\(\\vec{w}\\)，对其进行缩放并合并。这两个固定在不同方向上的向量 \\\
  (\\vec{v}\\) 和 \\(\\vec{w}\\)，可以缩放并相加，以创建任意新向量 \\(\\vec{v + w}\\)。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_178_0.png)\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_178_1.png)\n\n![](img/8e0dcc1636d032e7728a07e97751e446_178_2.png)\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_178_3.png)\n\n![](img/8e0dcc1636d032e7728a07e97751e446_178_4.png)\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_178_5.png)\n\n图 4-10. 缩放两个相加的向量，使我们能够创建任意新向量\n\
  \n再次强调，\\(\\vec{v}\\) 和 \\(\\vec{w}\\) 的方向是固定的，除非通过负标量翻转，但我们可以使用缩放来自由创建由 \\(\\vec{v\
  \ + w}\\) 组成的任何向量。\n\n这种可能向量的整个空间称为**展开（span）**，在大多数情况下，我们只需缩放并求和这两个向量，就能创建无限多个向量。当我们拥有两个不同方向的向量时，它们是**线性无关的**，并具有这种无限的展开。\n\
  \n但在什么情况下，我们能创建的向量是有限的？请思考并继续阅读。\n\n当两个向量在同一方向上，或位于同一条直线上时会发生什么？这些向量的组合也被困在同一条直线上，限制了我们的展开仅为那条直线。无论你如何缩放，结果和向量也被困在同一条直线上。这使它们成为**线性相关**的向量，如图\
  \ 4-11 所示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_180_0.png)\n\n图 4-11. 线性相关向量\n\
  \n这里的展开被困在构成它的两个向量所在的同一条直线上。因为两个向量位于同一条底层直线上，我们无法通过缩放灵活地创建任何新向量。任何结果向量都被困在那条直线上。\n\
  \n在 3 维或更高维度中，当我们有一组线性相关向量时，通常会被困在一个较低维度的平面上。如图 4-12 所示，即使我们拥有 3 维向量，也可能被困在 2 维平面上，下面是一个示例。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_181_0.png)\n\n图 4-12. 3 维中的线性相关性，注意我们的展开被限制在一个平面上\n\
  \n稍后我们将学习一个称为行列式的简单工具来检查线性相关性，但我们为什么关心两个向量是线性相关还是线性无关呢？当它们线性相关时，许多问题会变得困难或无法求解。例如，当我们在本章后面学习方程组时，线性相关的方程组会导致变量消失，使问题无法求解。但如果你拥有线性无关性，从两个或多个向量中创建任何你需要的向量的灵活性在求解方案时将变得无比宝贵！\n\
  \n## 线性变换\n\n将两个固定方向的向量相加，并对其缩放以获得不同组合向量的概念，非常重要。这个组合向量（线性相关情况除外）可以指向任何方向，并拥有我们选择的任何长度。这为线性变换建立了直觉，我们用一个向量以类似函数的方式转换另一个向量。\n\
  \n## 基向量\n\n想象我们有两个简单的向量 \\(\\hat{i}\\) 和 \\(\\hat{j}\\)（“i-帽”和“j-帽”）。这些被称为**基向量**，用于描述对其他向量的变换。它们通常长度为\
  \ 1，并指向互相垂直的正方向，如图 4-13 所示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_183_0.png)\n\
  \n图 4-13. 基向量 $\\hat{i}$ 和 $\\hat{j}$\n\n将基向量视为构建或转换任何向量的积木。我们的基向量表示为一个 2x2 矩阵，第一列是\
  \ $\\hat{i}$，第二列是 $\\hat{j}$。\n\n```\n$$\\hat{i} = \\begin{bmatrix} 1 \\\\ 0 \\\
  end{bmatrix}$$\n\\hat{j} = \\begin{bmatrix} 0 \\\\ 1 \\end{bmatrix}\n\nbasis = \\\
  begin{bmatrix} 1 & 0 \\\\ 0 & 1 \\end{bmatrix}\n```\n\n一个**矩阵**是向量的集合（例如 \\(\\hat{i},\
  \ \\hat{j}\\)），可以有多个行和列，是一种方便的数据打包方式。我们可以通过缩放和相加 \\(\\hat{i}\\) 和 \\(\\hat{j}\\\
  ) 来创建任何我们想要的向量。让我们从每个长度为 1 开始，并展示结果向量 \\(\\vec{v}\\)，如图 4-14 所示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_185_0.png)\n\
  \n图 4-14. 基于基向量创建向量\n\n我希望向量 \\(\\vec{v}\\) 落在 \\([3, 2]\\) 处。如果我们将 \\(\\hat{\\\
  imath}\\) 扩展 3 倍，将 \\(\\hat{\\jmath}\\) 扩展 2 倍，\\(\\vec{v}\\) 会发生什么变化？首先我们分别对它们进行缩放，如下所示：\n\
  \n\\(3\\hat{\\imath} = 3\\begin{bmatrix} 1 \\\\ 0 \\end{bmatrix} = \\begin{bmatrix}\
  \ 3 \\\\ 0 \\end{bmatrix}\\)\n\n$2\\hat{j} = 2 \\begin{bmatrix} 0 \\\\ 1 \\end{bmatrix}\
  \ = \\begin{bmatrix} 0 \\\\ 2 \\end{bmatrix}$\n\n如果我们在这两个方向上拉伸空间，这对 $\\vec{v}$ 有什么影响？嗯，它将随\
  \ $\\hat{i}$ 和 $\\hat{j}$ 一起拉伸。这称为**线性变换**，我们通过跟踪基向量的运动，用拉伸、压缩、剪切或旋转来转换向量。在图 4-15\
  \ 的这种情况下，缩放 $\\hat{i}$ 和 $\\hat{j}$ 连同我们的向量 $\\vec{v}$ 一起拉伸了空间。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_186_0.png)\n\
  \n图 4-15. 一个线性变换\n\n\n\n\n\n但 \\(\\vec{v}\\) 落在哪里呢？这里很容易直观地看到它落在哪里，即 `[3, 2]`。回顾一下，向量\
  \ \\(\\vec{v}\\) 是由 \\(\\hat{i}\\) 和 \\(\\hat{j}\\) 相加组成的。因此，我们只需取拉伸后的 \\(\\hat{i}\\\
  ) 和 \\(\\hat{j}\\) 并将它们相加，以查看向量 \\(\\vec{v}\\) 落在了哪里。\n\n\\(\\vec{v}_{new} = \\\
  begin{bmatrix} 3 \\\\ 0 \\end{bmatrix} + \\begin{bmatrix} 0 \\\\ 2 \\end{bmatrix}\
  \ = \\begin{bmatrix} 3 \\\\ 2 \\end{bmatrix}\\)\n\n一般来说，使用线性变换，你可以实现图 4-16 所示的四种运动。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_188_0.png)\n\n![](img/8e0dcc1636d032e7728a07e97751e446_188_1.png)\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_188_2.png)\n\n![](img/8e0dcc1636d032e7728a07e97751e446_188_3.png)\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_188_4.png)\n\n图 4-16. 线性变换可以实现四种运动\n\n\
  这四种线性变换是线性代数的核心部分。缩放向量会拉伸或压缩它。旋转会转动向量空间，而反转会翻转向量空间，使 \\(\\hat{i}\\) 和 \\(\\hat{j}\\\
  ) 互换各自的位置。\n\n重要的是要注意，你不能有非线性变换，因为这会导致不再遵循直线的曲线或蜿蜒变换。这就是为什么我们称之为线性代数，而不是非线性代数！\n\
  \n## 矩阵向量乘法\n\n这把我们带到了线性代数中的下一个重要概念。跟踪 \\(\\hat{i}\\) 和 \\(\\hat{j}\\) 在变换后落在哪里的概念很重要，因为它不仅让我们能够创建向量，还能转换现有向量。如果你想获得真正的线性代数启发，想想为什么创建向量和转换向量实际上是同一件事。这全都是关于相对性的问题，即你的基向量在变换前后作为起点。\n\
  \n给定打包为矩阵的基向量 \\(\\hat{i}\\) 和 \\(\\hat{j}\\) 来转换向量 \\(\\vec{v}\\) 的公式如下：\n\n```\n\
  \\[\n\\begin{bmatrix} x_{new} \\\\ y_{new} \\end{bmatrix} = \\begin{bmatrix} a &\
  \ b \\\\ c & d \\end{bmatrix} \\begin{bmatrix} x \\\\ y \\end{bmatrix}\n\\]\n\\\
  [\n\\begin{bmatrix} x_{new} \\\\ y_{new} \\end{bmatrix} = \\begin{bmatrix} ax +\
  \ by \\\\ cx + dy \\end{bmatrix}\n\\]\n```\n\n\\(\\hat{i}\\) 是第一列 `[a \\ c]`，\\\
  (\\hat{j}\\) 是列 `[b \\ d]`。我们将这两个基向量都打包成一个矩阵，这再次是一组表示为两个或更多维度中数字网格的向量。通过应用基向量来转换向量的过程被称为\
  \ **矩阵向量乘法**。起初这可能显得有些牵强，但这个公式是缩放和相加 \\(\\hat{i}\\) 和 \\(\\hat{j}\\) 的快捷方式，就像我们之前将两个向量相加一样，并将变换应用于任何向量\
  \ \\(\\vec{v}\\)。\n\n因此，实际上，矩阵确实是作为基向量表达的变换。\n\n要在 Python 中使用 NumPy 执行此变换，我们需要将基向量声明为矩阵，然后使用\
  \ `dot()` 运算符将其应用于向量 \\(\\vec{v}\\)（示例 4-7）。点运算符将执行我们刚才描述的矩阵与向量之间的缩放和相加。这被称为 **点积**，我们将在本章中探讨它。\n\
  \n### 示例 4-7. NumPy 中的矩阵向量乘法\n\n```\nfrom numpy import array\n\n# compose basis\
  \ matrix with i-hat and j-hat\nbasis = array(\n    [[3, 0],\n     [0, 2]]\n)\n\n\
  # declare vector v\nv = array([1, 1])\n\n# create new vector\n# by transforming\
  \ v with dot product\nnew_v = basis.dot(v)\n\nprint(new_v) # [3, 2]\n```\n\n在以基向量思考时，我倾向于先拆分基向量，然后将它们组合成矩阵。请注意，你需要进行\
  \ **转置**，即交换列和行。这是因为 NumPy 的 `array()` 函数会做出我们不想要的相反方向，将每个向量作为行而不是列填充。NumPy 中的转置在示例\
  \ 4-8 中演示。\n\n### 示例 4-8.\n\n```\nfrom numpy import array\n\n# Declare i-hat and\
  \ j-hat\ni_hat = array([2, 0])\nj_hat = array([0, 3])\n\n# compose basis matrix\
  \ using i-hat and j-hat\n# also need to transpose rows into columns\nbasis = array([i_hat,\
  \ j_hat]).transpose()\n\n# declare vector v\nv = array([[1,1]])\n\n# create new\
  \ vector\n# by transforming v with dot product\nnew_v = basis.dot(v)\n\nprint(new_v)\
  \ # [2, 3]\n```\n\n这里还有另一个例子。让我们从向量 \\(\\vec{v}\\) 为 [2  1] 开始，\\(\\hat{i}\\) 和\
  \ \\(\\hat{j}\\) 分别起始于 [1  0] 和 [0  1]。然后我们将 \\(\\hat{i}\\) 和 \\(\\hat{j}\\) 转换为\
  \ [2  0] 和 [0  3]。向量 \\(\\vec{v}\\) 会发生什么？使用我们的公式手动进行数学计算，我们得到以下结果。\n\n\\(\\begin{bmatrix}\
  \ x_{new} \\\\ y_{new} \\end{bmatrix} = \\begin{bmatrix} a & b \\\\ c & d \\end{bmatrix}\
  \ \\begin{bmatrix} x \\\\ y \\end{bmatrix} = \\begin{bmatrix} ax + by \\\\ cx +\
  \ dy \\end{bmatrix}\\)\n\n\\(\\begin{bmatrix} x_{new} \\\\ y_{new} \\end{bmatrix}\
  \ = \\begin{bmatrix} 2 & 0 \\\\ 0 & 3 \\end{bmatrix} \\begin{bmatrix} 2 \\\\ 1 \\\
  end{bmatrix} = \\begin{bmatrix} (2)(2) + (0)(1) \\\\ (2)(0) + (3)(1) \\end{bmatrix}\
  \ = \\begin{bmatrix} 4 \\\\ 3 \\end{bmatrix}\\)\n\n示例 4-9 在 Python 中展示了这个解决方案。\n\
  \n### 示例 4-9. 使用 NumPy 转换向量\n\n```\nfrom numpy import array\n\n# Declare i-hat and\
  \ j-hat\ni_hat = array([2, 0])\nj_hat = array([0, 3])\n\n# compose basis matrix\
  \ using i-hat and j-hat\n# also need to transpose rows into columns\nbasis = array([i_hat,\
  \ j_hat]).transpose()\n\n# declare vector v\nv = array([2,1])\n\n# create new vector\n\
  # by transforming v with dot product\nnew_v = basis.dot(v)\n\nprint(new_v) # [4\
  \ 3]\n```\n\n向量 \\(\\vec{v}\\) 现在落在 [ 4 3 ] 处。图 4-17 显示了此变换的可视化效果。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_192_0.png)\n\
  \n图 4-17. 一个拉伸线性变换\n\n这里有一个难度再上一层的例子。让我们取值为 \\([2 \\quad 1]\\) 的向量 \\(\\vec{v}\\\
  )。\\(\\hat{i}\\) 和 \\(\\hat{j}\\) 起始于 \\([1 \\quad 0]\\) 和 \\([0 \\quad 1]\\)，但随后被转换并落在\
  \ \\([2 \\quad 3]\\) 和 \\([2 \\quad -1]\\)。\\(\\vec{v}\\) 会发生什么？让我们查看图 4-18 和示例\
  \ 4-10。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_193_0.png)\n\n图 4-18. 一个执行旋转、剪切和空间翻转的线性变换\n\
  \n### 示例 4-10.\n\n```\nfrom numpy import array\n\n# Declare i-hat and j-hat\ni_hat\
  \ = array([2, 3])\nj_hat = array([2, -1])\n\n# compose basis matrix using i-hat\
  \ and j-hat\n# also need to transpose rows into columns\nbasis = array([i_hat, j_hat]).transpose()\n\
  \n# declare vector v\nv = array([2,1])\n\n# create new vector\n# by transforming\
  \ v with dot product\nnew_v = basis.dot(v)\n\nprint(new_v) # [6, 5]\n```\n\n这里发生了很多事情。我们不仅缩放了\
  \ \\(\\hat{i}\\) 和 \\(\\hat{j}\\) 并拉长了向量 \\(\\vec{v}\\)。我们实际上还剪切、旋转和翻转了空间。当 \\(\\\
  hat{i}\\) 和 \\(\\hat{j}\\) 在其顺时针方向中互换位置时，你知道空间被翻转了，我们将在本章后面学习如何使用行列式来检测这一点。\n\n\
  ## 3D 及更高维度中的基向量\n\n你可能在想，我们如何在 3 维或更多维度中思考向量变换。基向量的概念非常好地延伸了。如果我有一个 3 维向量空间，那么我就有基向量\
  \ \\(\\hat{\\imath}\\)、\\(\\hat{\\jmath}\\) 和 \\(\\hat{k}\\)。对于每个新维度，我只需继续从字母表中添加更多字母（图\
  \ 4-19）。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_195_0.png)\n\n图 4-19. 3D 基向量\n\
  \n值得指出的另一点是，某些线性变换可以将向量空间移动到更少或更多维度，而这正是非方阵所做的（行数和列数不相等）。由于时间关系，我们无法深入探讨这一点。但 3Blue1Brown\
  \ 精美地解释和动画演示了这一概念。\n\n## 矩阵乘法\n\n我们学习了如何将向量和矩阵相乘，但将两个矩阵相乘究竟能实现什么？将 **矩阵乘法** 视为对向量空间应用多个变换。每个变换都像一个函数，我们先应用最内层的变换，然后向外依次应用每个后续变换。\n\
  \n下面是如何对值为 [`x` `y`] 的任何向量 \\(\\vec{v}\\) 先应用旋转，再应用剪切。\n\n```\n[ 1  1 ] [ 0 -1 ]\
  \ [ x ]\n[ 0  1 ] [  1  0 ] [ y ]\n```\n\n我们实际上可以使用这个公式来合并这两个变换，将一个变换应用到上一个变换之上。你将第一个矩阵的每一行与第二个矩阵的每个相应列相乘并相加，按照“横过-向下！横过-向下！”的模式进行。\n\
  \n```\n[ a b ] [ e f ] = [ ae + bg  af + bh ]\n[ c d ] [ g h ]   [ ce + dg  cf +\
  \ dh ]\n```\n\n因此，我们实际上可以将这两个独立的变换（旋转和剪切）合并为一个单一的变换。\n\n```\n[ 1  1 ] [ 0 -1 ] [\
  \ x ]\n[ 0  1 ] [  1  0 ] [ y ]\n\n= [ (1)(0) + (1)(1)  (-1)(1) + (1)(0) ] [ x ]\n\
  \  [ (0)(0) + (1)(1)  (0)(-1) + (1)(0) ] [ y ]\n```\n\n\n\n= \\(\\begin{bmatrix}\
  \ 1 & -1 \\\\ 1 & 0 \\end{bmatrix} \\begin{bmatrix} x \\\\ y \\end{bmatrix}\\)\n\
  \n在 Python 中使用 NumPy 执行此操作时，可以直接使用 `matmul()` 或 `@` 运算符（示例 4-11）来组合这两个矩阵。然后，我们将使用这个合并后的变换，并将其应用于向量\
  \ `[1 2]`。\n\n### 示例 4-11.\n\n```python\nfrom numpy import array\n\n# Transformation\
  \ 1\ni_hat1 = array([0, 1])\nj_hat1 = array([-1, 0])\ntransform1 = array([i_hat1,\
  \ j_hat1]).transpose()\n\n# Transformation 2\ni_hat2 = array([1, 0])\nj_hat2 = array([1,\
  \ 1])\ntransform2 = array([i_hat2, j_hat2]).transpose()\n\n# Combine Transformations\n\
  combined = transform2 @ transform1\n\n# Test\nprint(\"COMBINED MATRIX:\\n {}\".format(combined))\n\
  \nv = array([1, 2])    # [-1 1]\nprint(combined.dot(v)) # [-1 1]\n```\n\n> # 使用\
  \ DOT() 还是 MATMUL() 和 @\n> \n> 一般来说，在 NumPy 中组合矩阵时，应优先使用 `matmul()` 及其简写 `@`，而不是\
  \ `dot()` 运算符。前者在处理高维矩阵及元素广播方式方面通常具有更可取的策略。\n> \n> 如果你喜欢深入研究这类实现细节，这个 [StackOverflow](https://stackoverflow.com/)\
  \ 问题是一个很好的起点。\n\n请注意，我们也可以分别对向量 \\(\\vec{v}\\) 应用每个变换，仍然得到相同的结果。如果将最后一行替换为这三行（示例\
  \ 4-12），对每个变换进行应用，你在该新向量上仍然会得到 [-1 1]。\n\n### 示例 4-12.\n\n```python\nrotated = transform1.dot(v)\n\
  sheered = transform2.dot(rotated)\nprint(sheered) # [-1 1]\n```\n\n请注意，应用每个变换的顺序很重要！如果我们在\
  \ `transformation2` 上应用 `transformation1`，将得到与示例 4-13 中计算的不同结果 `[-2 3]`。因此，矩阵点积不具备交换性，这意味着你不能交换顺序并期望得到相同的结果！\n\
  \n### 示例 4-13.\n\n```python\nfrom numpy import array\n\n# Transformation 1\ni_hat1\
  \ = array([0, 1])\nj_hat1 = array([-1, 0])\ntransform1 = array([i_hat1, j_hat1]).transpose()\n\
  \n# Transformation 2\ni_hat2 = array([1, 0])\nj_hat2 = array([1, 1])\ntransform2\
  \ = array([i_hat2, j_hat2]).transpose()\n\n# Combine Transformations, apply shear\
  \ first and then rotation\ncombined = transform1 @ transform2\n\n# Test\nprint(\"\
  COMBINED MATRIX:\\n {}\".format(combined))\n\nv = array([1, 2])\nprint(combined.dot(v))\
  \ # [-2 3]\n```\n\n将每个变换视为一个函数，我们从内到外应用它们，就像嵌套函数调用一样。\n\n## 实际中的线性变换\n\n你可能会好奇，所有这些线性变换和矩阵与数据科学和机器学习有什么关系。答案是：一切都有关！从导入数据到线性回归、逻辑回归和神经网络中的数值运算，线性变换都是数学处理数据的核心。\n\
  \n不过，在实际操作中，你很少会花时间从几何上将数据可视化为向量空间和线性变换。你将要处理太多维度，无法高效地完成此操作。但了解几何解释仍然很有益，这样你才能明白这些看似巧妙的数值运算到底在做什么！否则，你只是在没有任何上下文的情况下死记硬背数值运算模式。这也能让行列式等新的线性代数概念变得更加直观。\n\
  \n### 行列式\n\n执行线性变换时，我们有时会“扩展”或“压缩”空间，这种发生的程度可能很有帮助。取向量空间中图 4-20 的一个采样区域：在缩放 î 和\
  \ ĵ 之后，它会发生什么变化？\n\n![](img/8e0dcc1636d032e7728a07e97751e446_200_0.png)\n\n图 4-20.\
  \ 行列式衡量线性变换如何缩放面积\n\n面积增加了 6.0 倍，这个因子被称为 **行列式**。行列式描述了向量空间中采样区域在线性变换下的缩放程度，这可以提供关于变换的有用信息。\n\
  \n### 示例 4-14.\n\n```python\nfrom numpy.linalg import det\nfrom numpy import array\n\
  \ni_hat = array([3, 0])\nj_hat = array([0, 2])\n\nbasis = array([i_hat, j_hat]).transpose()\n\
  \ndeterminant = det(basis)\n\nprint(determinant) # prints 6.0\n```\n\n简单的剪切和旋转不应该影响行列式，因为面积不会改变。图\
  \ 4-21 和示例 4-15 展示了一个简单的剪切，行列式仍保持 1.0 的因子，表明其不变。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_202_0.png)\n\
  \n图 4-21. 简单的剪切不会改变行列式\n\n### 示例 4-15.\n\n```python\nfrom numpy.linalg import det\n\
  from numpy import array\ni_hat = array([1, 0])\nj_hat = array([1, 1])\nbasis = array([i_hat,\
  \ j_hat]).transpose()\n\ndeterminant = det(basis)\n\nprint(determinant) # prints\
  \ 1.0\n```\n\n但是缩放会增加或减少行列式，因为这会增加/减少采样面积。当方向翻转（î 和 ĵ 顺时针互换位置）时，行列式将为负数。图 4-22 和示例\
  \ 4-16 展示了一个行列式，表示的变换不仅缩放了空间，还翻转了向量空间的方向。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_204_0.png)\n\
  \n图 4-22. 翻转空间上的行列式为负数\n\n### 示例 4-16.\n\n```python\nfrom numpy.linalg import det\n\
  from numpy import array\n\ni_hat = array([-2, 1])\nj_hat = array([1, 2])\n\nbasis\
  \ = array([i_hat, j_hat]).transpose()\n\ndeterminant = det(basis)\n\nprint(determinant)\
  \ # prints -5.0\n```\n\n由于这个行列式为负数，我们可以快速看出方向已经翻转。但行列式告诉你的最关键信息是，该变换是否具有线性相关性。如果行列式为\
  \ 0，意味着整个空间已被压缩到较低维度。\n\n在图 4-23 中，我们看到两个具有线性相关性的变换：一个将 2D 空间压缩到 1 维，另一个将 3D 空间压缩到\
  \ 2 维。在这两种情况下，面积和体积分别为 0！\n\n![](img/8e0dcc1636d032e7728a07e97751e446_205_0.png)\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_205_1.png)\n\n图 4-23. 2D 和 3D 中的线性相关性\n\
  \n示例 4-17 展示了上述 2D 示例的代码，将整个 2D 空间压缩到一条一维数轴上。\n\n### 示例 4-17.\n\n```python\nfrom\
  \ numpy.linalg import det\nfrom numpy import array\n\ni_hat = array([-2, 1])\nj_hat\
  \ = array([3, -1.5])\n\nbasis = array([i_hat, j_hat]).transpose()\n\ndeterminant\
  \ = det(basis)\n\nprint(determinant) # prints 0.0\n```\n\n因此，检测 0 行列式对于判断变换是否具有线性相关性非常有帮助。当你遇到这种情况时，很可能会面临一个棘手甚至无法解决的问题。\n\
  \n### 特殊类型的矩阵\n\n有些特殊的矩阵案例值得关注，我们应该介绍一下。\n\n#### 方阵\n\n方阵是行数和列数相等的矩阵。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_206_0.png)\n\
  \n它们主要用于表示线性变换，并且是许多运算（如特征值分解）的前提条件。\n\n#### 单位矩阵\n\n单位矩阵是一个方阵，其对角线上的元素为 1，其他元素均为\
  \ 0。\n\n单位矩阵：\n\n| 1 | 0 | 0 |\n|---|---|---|\n| 0 | 1 | 0 |\n| 0 | 0 | 1 |\n\n\
  单位矩阵有什么重要性呢？其实，当你拥有单位矩阵时，基本上就已经撤销了变换并找到了起始基向量。这在下一节求解方程组时将发挥重要作用。\n\n#### 逆矩阵\n\n\
  逆矩阵是撤销另一个矩阵变换的矩阵。假设我有矩阵 $ A $。\n\nA =\n\n| 4 | 2 | 4 |\n|---|---|---|\n| 5 | 3 |\
  \ 7 |\n| 9 | 3 | 6 |\n\n矩阵 $ A $ 的逆矩阵称为 $ A^{-1} $。我们将在下一节学习如何使用 Sympy 或 NumPy 计算逆矩阵，以下是矩阵\
  \ $ A $ 的逆矩阵。\n\nA^{-1} =\n\n| -1/2 | 0 | 1/3 |\n|---|---|---|\n| 5.5 | -2 | 4/3\
  \ |\n| -2 | 1 | 1/3 |\n\n当我们对 $ A^{-1} $ 和 $ A $ 进行矩阵乘法时，最终得到一个单位矩阵。我们将在下一节关于方程组的内容中，通过\
  \ NumPy 和 Sympy 看到这一点。\n\n```\n| -1/2 0 1/3 || 4 2 4 || 1 0 0 |\n| 5.5 -2 4/3 ||\
  \ 5 3 7 | = | 0 1 0 |\n| -2 1 1/3 || 9 3 6 |   | 0 0 1 |\n```\n\n\n\n## 对角矩阵\n\n\
  与单位矩阵类似的是**对角矩阵**，其对角线为非零值，其余值均为 0。对角矩阵在某些计算中非常理想，因为它们表示将简单标量应用于向量空间。它出现在一些线性代数运算中。\n\
  \n对角线：\n\n| 4 | 0 | 0 |\n|---|---|---|\n| 0 | 2 | 0 |\n| 0 | 0 | 5 |\n\n## 三角矩阵\n\
  \n与对角矩阵类似的是**三角矩阵**，其对角线为非零值，前方为值构成的三角形，其余值均为 0。\n\n三角形：\n\n| 4 | 2 | 9 |\n|---|---|---|\n\
  | 0 | 1 | 6 |\n| 0 | 0 | 5 |\n\n三角矩阵在许多数值分析任务中非常理想，因为它们在方程组求解中通常更容易求解。它也出现在某些分解任务中，例如\
  \ LU 分解。\n\n## 稀疏矩阵\n\n偶尔你会遇到大部分为零且只有少量非零元素的矩阵。这些被称为**稀疏矩阵**。从纯数学角度来看，它们并不十分有趣。但从计算角度来看，它们提供了创建效率的机会。如果矩阵大部分为\
  \ 0，稀疏矩阵实现不会费劲去浪费空间存储一堆 0，而是只跟踪非零单元格。\n\n稀疏：\n\n| 0 | 0 | 0 |\n|---|---|---|\n|\
  \ 0 | 0 | 2 |\n| 0 | 0 | 0 |\n| 0 | 0 | 0 |\n\n当你有大型稀疏矩阵时，可能会显式使用稀疏函数来创建矩阵。\n\n\
  ## 方程组与逆矩阵\n\n线性代数的基本用例之一是求解方程组。这也是学习逆矩阵的一个良好应用。假设你得到了以下方程，需要求解 x、y 和 z。\n\n4x +\
  \ 2y + 4z = 44\n5x + 3y + 7z = 56\n9x + 3y + 6z = 72\n\n你可以尝试手动使用不同的代数运算来隔离三个变量，但如果你想让计算机求解，则需要像下面所示将此问题用矩阵表示。将系数提取到矩阵\
  \ A 中，将方程右侧的值提取到矩阵 B 中，将未知变量提取到矩阵 X 中。\n\nA =\n\n| 4 | 2 | 4 |\n|---|---|---|\n\
  | 5 | 3 | 7 |\n| 9 | 3 | 6 |\n\nB =\n\n| 44 |\n|---|\n| 56 |\n| 72 |\n\n$X = \\\
  begin{bmatrix} x \\\\ y \\\\ z \\end{bmatrix}$\n\n线性方程组的函数为 $AX = B$，我们需要用另一个矩阵\
  \ $X$ 来转换矩阵 $A$，从而得到矩阵 $B$。\n\n$AX = B$\n\n\\begin{bmatrix} 4 & 2 & 4 \\\\ 5 & 3\
  \ & 7 \\\\ 9 & 3 & 6 \\end{bmatrix} \\cdot \\begin{bmatrix} x \\\\ y \\\\ z \\end{bmatrix}\
  \ = \\begin{bmatrix} 44 \\\\ 56 \\\\ 72 \\end{bmatrix}\n\n我们需要“撤销” $A$ 以便隔离 $X$\
  \ 并获取 $x$、$y$ 和 $z$ 的值。撤销 $A$ 的方法是取 $A$ 的逆（记为 $A^{-1}$），并通过矩阵乘法将其应用于 $A$。我们可以如下代数表达：\n\
  \n$AX = B$\n$A^{-1}AX = A^{-1}B$\n$X = A^{-1}B$\n\n计算矩阵 $A$ 的逆时，我们可能应该使用计算机，而不是使用高斯消元法手动寻找解（本书不会深入探讨高斯消元法，PatrickJMT\
  \ 在 YouTube 上有一些很棒的视频）。以下是矩阵 $A$ 的逆。\n\n$A^{-1} = \\begin{bmatrix} -\\frac{1}{2}\
  \ & 0 & \\frac{1}{3} \\\\ 5.5 & -2 & \\frac{4}{3} \\\\ -2 & 1 & \\frac{1}{3} \\\
  end{bmatrix}$\n\n注意，当我们将 $A^{-1}$ 与 $A$ 进行矩阵乘法时，将生成一个单位矩阵，即对角线上为 1、其余均为 0 的矩阵。单位矩阵相当于线性代数中的乘以“1”，意味着它基本没有影响，并将有效隔离\
  \ $x$、$y$ 和 $z$ 的值。\n\n$A^{-1} = \\begin{bmatrix} -\\frac{1}{2} & 0 & \\frac{1}{3}\
  \ \\\\ 5.5 & -2 & \\frac{4}{3} \\\\ -2 & 1 & \\frac{1}{3} \\end{bmatrix}$\n\n$A\
  \ = \\begin{bmatrix} 4 & 2 & 4 \\\\ 5 & 3 & 7 \\\\ 9 & 3 & 6 \\end{bmatrix}$\n\n\
  $A^{-1}A = \\begin{bmatrix} 1 & 0 & 0 \\\\ 0 & 1 & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}$\n\
  \n要在 Python 中看到这个单位矩阵的实际效果，你可能希望在此处使用 SymPy 而不是 NumPy。NumPy 中的浮点小数不会让单位矩阵如此明显，但在\
  \ Example 4-18 中以符号方式进行操作，我们将看到干净、符号化的输出。注意，在 SymPy 中进行矩阵乘法时，我们使用星号 * 而不是 @。\n\n\
  ## 示例 4-18. 使用 SymPy 研究逆矩阵和单位矩阵\n\n```python\nfrom sympy import *\n\n# 4x + 2y +\
  \ 4z = 44\n# 5x + 3y + 7z = 56\n# 9x + 3y + 6z = 72\n\nA = Matrix([\n    [4, 2,\
  \ 4],\n    [5, 3, 7],\n    [9, 3, 6]\n])\n\n# dot product between A and its inverse\n\
  # will produce identity function\ninverse = A.inv()\nidentity = inverse * A\n\n\
  # prints Matrix([[-1/2, 0, 1/3], [11/2, -2, -4/3], [-2, 1, 1/3]])\nprint(\"INVERSE:\
  \ {}\".format(inverse))\n\n# prints Matrix([[1, 0, 0], [0, 1, 0], [0, 0, 1]])\n\
  print(\"IDENTITY: {}\".format(identity))\n```\n\n不过在实践中，浮点精度的不足不会对我们的答案产生太大影响，因此使用\
  \ NumPy 求解 X 应该没问题。\n\n示例 4-19 展示了使用 NumPy 的解法。\n\n## 示例 4-19. 使用 NumPy 求解方程组\n\n\
  ```python\nfrom numpy import array\nfrom numpy.linalg import inv\n\n# 4x + 2y +\
  \ 4z = 44\n# 5x + 3y + 7z = 56\n# 9x + 3y + 6z = 72\n\nA = array([\n    [4, 2, 4],\n\
  \    [5, 3, 7],\n    [9, 3, 6]\n])\n\nB = array([\n    44,\n    56,\n    72\n])\n\
  \nX = inv(A).dot(B)\n\nprint(X) # [ 2. 34. -8.]\n```\n\n因此 x = 2，y = 34，z = -8。由于我在此问题中使用了\
  \ SymPy，示例 4-20 展示了使用 SymPy 的完整解法，作为 NumPy 的替代方案。\n\n## 示例 4-20. 使用 SymPy 求解方程组\n\
  \n```python\nfrom sympy import *\n\n# 4x + 2y + 4z = 44\n# 5x + 3y + 7z = 56\n#\
  \ 9x + 3y + 6z = 72\n\nA = Matrix([\n    [4, 2, 4],\n    [5, 3, 7],\n    [9, 3,\
  \ 6]\n])\nB = Matrix([\n    44,\n    56,\n    72\n])\nX = A.inv() * B\nprint(X)\
  \ # Matrix([ [2], [34], [-8]])\n```\n\n以下是数学符号中的解法：\n\n\\(A^{-1}B = X\\)\n\n\\(\\\
  begin{bmatrix} -\\frac{1}{2} & 0 & \\frac{1}{3} \\\\ 5.5 & -2 & \\frac{4}{3} \\\\\
  \ -2 & 1 & \\frac{1}{3} \\end{bmatrix} \\begin{bmatrix} 44 \\\\ 56 \\\\ 72 \\end{bmatrix}\
  \ = \\begin{bmatrix} x \\\\ y \\\\ z \\end{bmatrix}\\)\n\n\\(\\begin{bmatrix} 2\
  \ \\\\ 34 \\\\ -8 \\end{bmatrix} = \\begin{bmatrix} x \\\\ y \\\\ z \\end{bmatrix}\\\
  )\n\n希望这能让你对逆矩阵及其如何用于求解方程组有所了解。\n\n## 线性规划中的方程组\n\n这种求解方程组的方法也用于线性规划，其中不等式定义约束条件，并对目标进行最小化/最大化。\n\
  \nPatrickJMT 有大量关于线性规划的优秀视频。我们也在附录 A 中简要介绍了它。\n\n实际上，你很少需要手动计算逆矩阵，可以让计算机为你完成。但如果你有需要或出于好奇，你会想了解高斯消元法。\n\
  \nPatrickJMT 在 YouTube 上有多个演示高斯消元法的视频。\n\n## 特征向量和特征值\n\n**矩阵分解**是将矩阵分解为其基本组件，类似于对数字进行因式分解（例如，10\
  \ 可以分解为 2 x 5）。\n\n矩阵分解对查找逆矩阵、计算行列式以及线性回归等任务很有帮助。根据任务的不同，矩阵分解有多种方法。在第 5 章中，我们将使用一种称为\
  \ QR 分解的矩阵分解技术来执行线性回归。\n\n但在本章中，让我们专注于一种称为特征值分解的常用方法，它常用于机器学习和主成分分析（PCA）。在这个层面上，我们没有精力深入探讨每个应用。目前，只需知道特征值分解有助于将矩阵分解为在不同机器学习任务中更易于处理的组件。请注意，它仅适用于方阵。\n\
  \n在特征值分解中，有两个组成部分：特征值（记为 lambda λ）和特征向量（记为 v），如图 4-24 所示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_215_0.png)\n\
  \n### 图 4-24. 特征向量和特征值\n\n如果有一个方阵 $A$，它具有以下特征值方程：\n\n$Av = \\lambda v$\n\n如果 $A$\
  \ 是原始矩阵，它由特征向量 $v$ 和特征值 $\\lambda$ 组成。每个父矩阵的每个维度都有一个特征向量和特征值，并且并非所有矩阵都可以分解为特征向量和特征值。有时甚至会出现复数（虚数）。\n\
  \n\n\n\n示例 4-21 展示了如何在 NumPy 中为给定矩阵 A 计算特征向量和特征值：\n\n## 示例 4-21. 在 NumPy 中执行特征分解\n\
  \n```\nfrom numpy import array, diag\nfrom numpy.linalg import eig, inv\n\nA = array([\n\
  \    [1, 2],\n    [4, 5]\n])\n\neigenvals, eigenvecs = eig(A)\n\nprint(\"EIGENVALUES\"\
  )\nprint(eigenvals)\nprint(\"\\nEIGENVECTORS\")\nprint(eigenvecs)\n\n\"\"\"\nEIGENVALUES\n\
  [-0.46410162  6.46410162]\n\nEIGENVECTORS\n[[ -0.80689822  -0.34372377]\n [ 0.59069049\
  \  -0.9390708 ]]\n\"\"\"\n```\n\n那么，我们如何从特征向量和特征值重建矩阵 $A$ 呢？\n回顾这个公式：\n\n$Av = \\\
  lambda v$\n\n我们需要对公式进行一些小调整以重建 $A$：\n\n$A = Q \\Lambda Q^{-1}$\n\n在这个新公式中，$Q$ 是特征向量，$\\\
  Lambda$ 是对角形式的特征值，而 $Q^{-1}$ 是 $Q$ 的逆矩阵。对角形式意味着将向量填充到一个由零组成的矩阵中，并沿对角线占据类似单位矩阵的模式。\n\
  \n示例 4-22 在 Python 中完整演示了这一过程，首先分解矩阵，然后重新组合它。\n\n## 示例 4-22. 在 NumPy 中分解和重新组合矩阵\n\
  \n```\nfrom numpy import array, diag\nfrom numpy.linalg import eig, inv\n\nA = array([\n\
  \   [1, 2],\n   [4, 5]\n])\n```\n\n```\neigenvals, eigenvecs = eig(A)\n\nprint(\"\
  EIGENVALUES\")\nprint(eigenvals)\nprint(\"\\nEIGENVECTORS\")\nprint(eigenvecs)\n\
  ```\n\n```\nprint(\"\\nREBUILD MATRIX\")\nQ = eigenvecs\nR = inv(Q)\n\nL = diag(eigenvals)\n\
  B = Q @ L @ R\n\nprint(B)\n```\n\n> \"\"\"\n> 特征值\n> [-0.46410162  6.46410162]\n\
  > 特征向量\n> [[-0.80689822 -0.34372377]\n>  [ 0.59069049 -0.9390708 ]]\n> 重建矩阵\n> [[1.\
  \ 2.]\n>  [4. 5.]]\n> \"\"\"\n\n如上所示，我们重建的矩阵就是我们开始时的那个矩阵。\n\n## 结论\n\n线性代数可能会令人抓狂地抽象，充满了值得深思的奥秘和思想。你可能会发现整个主题是一个巨大的“兔子洞”，而且你说得对！不过，如果你希望拥有一个长久且成功的数据科学职业生涯，保持好奇心是个好主意。它是统计计算、机器学习及其他应用数据科学领域的基础。归根结底，它是计算机科学的基础。你当然可以暂时不懂它，但到某个时候你会在理解上遇到局限。\n\
  \n你可能会好奇这些想法有多实际，因为它们可能感觉很理论。别担心，我们将在本书中看到一些实际应用。但理论和几何解释在处理数据时很重要，可以帮助你建立直觉；通过直观理解线性变换，你将准备好应对追求过程中可能遇到的更高级概念。\n\
  \n如果你想了解更多关于线性规划的内容，没有比 3Blue1Brown 的 YouTube 播放列表《线性代数的本质》更好的地方了。PatrickJMT 的线性代数视频也很有帮助。\n\
  \n如果你想更熟练地使用 NumPy，Wes McKinney 所著的 O’Reilly 出版的《Python for Data (第 2 版)》是一本推荐读物。它并不侧重线性代数，但确实提供了在数据集上使用\
  \ NumPy、Pandas 和 Python 的实用指导。\n\n## 练习\n\n- 1. 向量 \\(\\vec{v}\\) 的值为 [1 2]，但随后发生了一次变换。\\\
  (\\hat{i}\\) 映射到 [2 0]，\\(\\hat{j}\\) 映射到 [0 1.5]。\\(\\vec{v}\\) 会映射到哪里？\n\n- 2.\
  \ 向量 \\(\\vec{v}\\) 的值为 [1 2]，但随后发生了一次变换。\\(\\hat{i}\\) 映射到 [-2 1]，\\(\\hat{j}\\\
  ) 映射到 [1 -2]。\\(\\vec{v}\\) 会映射到哪里？\n\n- 3. 一个变换将 \\(\\hat{i}\\) 映射到 [1 0]，将 \\\
  (\\hat{j}\\) 映射到 [2 2]。这个变换的行列式是多少？\n\n- 4. 是否可以将两个或多个线性变换合并为一个线性变换？为什么或为什么不？\n\n\
  - 5. 求解关于 x、y、z 的方程组：\n  3x + 1y + 0z == 54\n  2x + 4y + 1z = 12\n  3x + 1y + 8z\
  \ = 6\n\n- 1. 下面的矩阵是否线性相关？为什么或为什么不？\n\n| 2 | 1 |\n|---|---|\n| 6 | 3 |\n\n答案在附录\
  \ B 中。\n"
- "# 第 5 章. 线性回归\n\n数据分析中最实用的技术之一是通过观察到的数据点拟合一条直线，以展示两个或多个变量之间的关系。**回归**试图将一个函数拟合到观察数据，以便对新数据进行预测。**线性回归**将一条直线拟合到观察数据，试图展示变量之间的线性关系，并对尚未观察到的新数据进行预测。\n\
  \n与其阅读线性回归的描述，不如看一张图，可能更容易理解。以下是图 5-1 中的线性回归示例。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_221_0.png)\n\
  \n图 5-1. 线性回归示例，将直线拟合到观察数据\n\n线性回归是数据科学和统计学中的得力工具，不仅运用了前几章学到的概念，还为神经网络（第 7 章）和逻辑回归（第\
  \ 6 章）等后续主题奠定了新的基础。这一相对简单的技术已有 200 多年历史，当代被称为一种机器学习形式。\n\n机器学习从业者通常采用不同的验证方法，从将数据划分为训练集和测试集开始。统计学家更可能使用预测区间和相关性等指标来评估统计显著性。我们将介绍两种思想流派，以便读者能够弥合这两个学科之间日益扩大的差距，从而掌握两套技能。\n\
  \n> ### 等等，回归是机器学习吗？\n> \n> “机器学习”涵盖多种技术，但目前应用最广泛的是有监督学习，回归在这里起着重要作用。这就是为什么线性回归被称为一种机器学习形式。令人困惑的是，统计学家可能将其回归模型称为\
  \ *统计学习*，而数据科学和机器学习专业人士则会称其模型为 *机器学习*。\n> \n> 虽然有监督学习通常是回归，但无监督机器学习更多涉及聚类和异常检测。强化学习通常将有监督机器学习与仿真相结合，以快速生成合成数据。\n\
  > \n> 我们将在第 6 章（逻辑回归）和第 7 章（神经网络）中学习另外两种有监督机器学习形式。\n\n### 基础线性回归\n\n我想研究狗的年龄与其就医次数之间的关系。在一个虚构的样本中，我们有\
  \ 10 随机狗。我喜欢用简单的数据集（真实或非真实）来理解复杂技术，这样我们就能在不被复杂数据干扰的情况下理解该技术的优势和局限性。让我们按照图 5-2 所示绘制这个数据集。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_223_0.png)\n\n图 5-2. 绘制 10 只狗及其年龄和就诊次数的样本\n\
  \n我们可以清楚地看到这里存在线性相关，意味着当其中一个变量增加/减少时，另一个变量也会大致按比例增加/减少。我们可以穿过这些点画一条线，如图 5-3 所示展示这种相关性。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_224_0.png)\n\n### 图 5-3. 通过我们的数据拟合一条直线\n\
  \n我将在本章后面展示如何计算这条拟合直线。我们还将探讨如何计算这条拟合直线的质量。目前，让我们关注执行线性回归的好处。它允许我们对未见过的数据进行预测。我的样本中没有\
  \ 8.5 岁的狗，但我可以查看这条直线，估计该狗一生会有 21 次就医。我只需查看 x=8.5 处的直线，就能看到 y=21.218，如图 5-4 所示。另一个好处是，我们可以分析变量之间的可能关系，并假设相关变量之间存在因果关系。\n\
  \n\n\n![](img/8e0dcc1636d032e7728a07e97751e446_225_0.png)\n\n图 5-4. 使用线性回归进行预测，显示一只\
  \ 8.5 岁的狗预计有大约 21.2 次兽医就诊\n\n那么线性回归的缺点是什么？我不能指望每个结果都会精确地落在该线上。毕竟，现实世界的数据是嘈杂的且从不完美，不会遵循一条直线。它可能根本不会遵循一条直线！这条线周围会有误差，数据点可能会落在线上方或下方。当我们讨论\
  \ p 值、统计显著性和预测区间（描述我们的线性回归有多可靠）时，我们将从数学上介绍这一点。另一个问题是，我们不应该使用线性回归对现有数据范围之外的值进行预测，这意味着我们不应该对\
  \ x < 0 和 x > 10 进行预测，因为我们没有这些值之外的数据。\n\n> **不要忘记抽样偏差！**\n>\n> 我们应该质疑这些数据及其采样方式，以检测偏差。这是在单一兽医诊所进行的吗？还是多个随机诊所？使用兽医数据、仅调查就诊狗狗是否存在自我选择偏差？如果狗狗在同一地理区域被采样，是否会影响数据？也许炎热沙漠气候中的狗狗会更频繁地因为中暑和蛇咬而去看兽医，这会虚高我们样本中的兽医就诊次数。\n\
  >\n> 如前所述在第 3 章中，将数据视为真理神谕已成为一种时尚。然而，数据仅仅是总体的一个样本，我们需要练习辨别力来判断我们的样本代表性有多好。要对数据的来源（而不仅仅是数据本身）保持同样甚至更多的兴趣。\n\
  \n## 使用 SciPy 的基本线性回归\n\n本章我们有很多关于线性回归需要学习，但让我们先用一些代码来执行目前所知道的内容。\n\n有许多平台可以执行线性回归，从\
  \ Excel 到 Python 和 R。但在这本书中，我们将坚持使用 Python，首先使用 Scikit-learn 为我们完成工作。本章稍后我将展示如何从头开始构建线性回归，以便我们掌握梯度下降和最小二乘等重要概念。\n\
  \n代码示例 5-1 演示了如何使用 Scikit-learn 对 10 只狗的样本进行基本的未验证线性回归。我们使用 Pandas 加载这些数据，将其转换为\
  \ NumPy 数组，使用 Scikit-learn 执行线性回归，并使用 plotly 在图表中显示它。\n\n## 示例 5-1. 使用 Scikit-learn\
  \ 进行线性回归\n\n```\nimport pandas as pd\nimport matplotlib.pyplot as plt\nfrom sklearn.linear_model\
  \ import LinearRegression\n\n# Import points\ndf = pd.read_csv('https://bit.ly/3goOAnt',\
  \ delimiter=\",\")\n\n# Extract input variables (all rows, all columns but last\
  \ column)\nX = df.values[:, :-1]\n\n# Extract output column (all rows, last column)\n\
  Y = df.values[:, -1]\n\n# Fit a line to the points\nfit = LinearRegression().fit(X,\
  \ Y)\n\n# m = 1.7867224, b = -16.51923513\nm = fit.coef_.flatten()\nb = fit.intercept_.flatten()\n\
  print(\"m = {0}\".format(m))\nprint(\"b = {0}\".format(b))\n\n# show in chart\n\
  plt.plot(X, Y, 'o') # scatterplot\nplt.plot(X, m*X+b) # line\nplt.show()\n```\n\n\
  首先，我们从 GitHub 上的这个 CSV 导入数据。我们使用 Pandas 将两列分离为 X 和 Y 数据集。然后，我们将 LinearRegression\
  \ 模型与输入 X 数据和输出 Y 数据进行 fit()。之后，我们可以获取描述我们拟合线性函数的 m 和 b 系数。\n\n在图表中，你果然会得到一条穿过这些点的拟合线，如图\
  \ 5-5 所示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_228_0.png)\n\n图 5-5. SciPy\
  \ 会将回归线拟合到您的数据上。\n\n是什么决定了这些点的最佳拟合线？让我们接下来讨论一下。\n\n## 残差与平方误差\n\n像 Scikit-learn\
  \ 这样的统计工具如何得出拟合这些点的直线？归根结底，这取决于机器学习训练中两个基本问题：\n\n- 1) 什么定义了“最佳拟合”？\n- 2) 如何达到那个“最佳拟合”？\n\
  \n第一个问题有相当明确的答案：我们最小化平方，或者更具体地说，是平方残差之和。让我们来分解一下。在点中绘制任意一条直线。残差是直线与点之间的数值差，如图 5-6\
  \ 所示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_229_0.png)\n\n图 5-6. 残差是直线与点之间的差异\n\
  \n直线上方的点将有正残差，直线下方的点将有负残差。换句话说，这是预测 y 值（由直线得出）与实际 y 值（来自数据）之间的减法差。残差的另一个名称是 **错误**，因为它们反映了我们的直线在预测数据时有多么错误。\n\
  \n让我们在代码示例 5-2 中计算这 10 个点与直线 y = 1.93939x + 4.73333 之间的这些差异。\n\n## 示例 5-2. 计算给定直线和数据的残差\n\
  \n```\nimport pandas as pd\n\n# Import points\npoints = pd.read_csv('https://bit.ly/3goOAnt',\n\
  \                    delimiter=\",\").itertuples()\n\n# Test with a given line\n\
  m = 1.93939\nb = 4.73333\n\n# calculate sum of squares\nfor p in points:\n    y_actual\
  \ = p.y\n    y_predict = m*p.x + b\n    residual = y_actual - y_predict\n    print(residual)\n\
  ```\n\n# 输出：\n\n# 示例 5-3.\n\n-1.67272\n1.3878900000000005\n-0.5515000000000008\n\
  2.5091099999999997\n-0.4302799999999998\n-1.3696699999999993\n0.6909400000000012\n\
  -2.2484499999999983\n2.8121600000000002\n-1.1272299999999973\n\n如果我们要在 10 个数据点上拟合一条直线，我们可能希望总体上最小化这些残差，以使直线与点之间的差距尽可能小。但我们如何衡量“总体”？最佳方法是采用\
  \ **平方和**，它只是对每个残差求平方（即将每个残差乘以其自身），然后将它们相加。我们取每个实际 y 值，减去直线给出的预测 y 值，然后对所有这些差值求平方并求和。\n\
  \n## 为什么不使用绝对值？\n\n你可能会好奇为什么在求和之前必须对残差求平方。为什么不直接把它们加起来而不求平方？这行不通，因为负数会抵消正数。如果我们加绝对值，将所有负值转换为正值呢？这听起来有希望，但绝对值在数学上不方便。更具体地说，绝对值与微积分导数配合不好，我们将在后面用于梯度下降。这就是为什么我们选择平方残差作为总计损失的方式。\n\
  \n一种直观的思考方式如图 5-7 所示，我们在每个残差上叠加一个正方形，每条边的长度等于残差。我们将所有这些正方形的面积相加，稍后我们将学习如何通过确定最佳\
  \ m 和 b 来找到可以达到的最小和。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_232_0.png)\n\n\
  图 5-7. 可视化平方和，即所有正方形面积之和，每个正方形的边长等于残差\n\n让我们修改示例 5-4 中的代码。\n\n## 示例 5-4. 计算给定直线和数据的平方和\n\
  \n```\nimport pandas as pd\n\n# Import points\npoints = pd.read_csv(\"https://bit.ly/2KF29Bd\"\
  ).itertuples()\n\n# Test with a given line\nm = 1.93939\nb = 4.73333\n\nsum_of_squares\
  \ = 0.0\n\n# calculate sum of squares\nfor p in points:\n    y_actual = p.y\n  \
  \  y_predict = m*p.x + b\n    residual_squared = (y_predict - y_actual)**2\n   \
  \ sum_of_squares += residual_squared\n\nprint(\"sum of squares = {}\".format(sum_of_squares))\n\
  # sum of squares = 28.096969704500005\n```\n\n下一个问题是：如何在不使用 Scikit-learn 等库的情况下，找到会产生最小平方和的\
  \ m 和 b 值？让我们接下来看看。\n\n## 寻找最佳拟合线\n\n我们现在有了一种方法来衡量给定直线与数据点之间的质量：平方和。我们能让这个数字越低，拟合就越好。那么，我们如何找到产生最小平方和的正确\
  \ m 和 b 值呢？\n\n我们可以采用几种搜索算法，这些算法试图找到解决给定问题的正确值集。您可以尝试采用暴力法，数百万次生成随机的 m 和 b 值，并且\n\
  \n\n选择产生最小平方和的那些。这种方法效果不好，因为即使找到一个不错的近似解也需要花费无穷无尽的时间。我们需要一些更有引导性的方法。我将为你整理出五种可用的技术：闭式解、矩阵求逆、矩阵分解、梯度下降和随机梯度下降。还有像爬山算法这样的其他搜索算法可以使用（并在附录A中介绍），但我们将坚持使用常见的方法。\n\
  \n## 机器学习训练即拟合回归\n\n这是“训练”机器学习算法的核心。我们提供一些数据和一个目标函数（平方和），它会找到合适的系数m和b来实现该目标。所以当我们“训练”机器学习模型时，实际上是在最小化损失函数。\n\
  \n## 闭式方程\n\n有些读者可能会问，是否存在一个公式（称为闭式方程）可以通过精确计算来拟合线性回归。答案是肯定的，但仅适用于只有一个输入变量的简单线性回归。对于许多有多个输入变量和大量数据的机器学习问题，这种便利并不存在。我们可以使用线性代数技术来进行扩展，稍后我们将讨论这一点。我们也将借此机会学习随机梯度下降等搜索算法。\n\
  \n对于只有一个输入和一个输出变量的简单线性回归，以下是计算m和b的闭式方程。示例5-5展示了如何在Python中进行这些计算。\n\n```\nm = \\\
  frac{n \\sum xy - \\sum x \\sum y}{n \\sum x^2 - (\\sum x)^2}\nb = \\frac{\\sum\
  \ y}{n} - m \\frac{\\sum x}{n}\n```\n\n## 示例 5-5. 为简单线性回归计算m和b\n\n```\nimport pandas\
  \ as pd\n\n# Load the data\npoints = list(pd.read_csv('https://bit.ly/2KF29Bd',\n\
  delimiter=\",\").itertuples())\n\nn = len(points)\n\nm = (n*sum(p.x*p.y for p in\
  \ points) - sum(p.x for p in points) *\n     sum(p.y for p in points)) / (n*sum(p.x**2\
  \ for p in points) -\n     sum(p.x for p in points)**2)\n\nb = (sum(p.y for p in\
  \ points) / n) - m * sum(p.x for p in points) /\nn\n\nprint(m, b)\n# 1.9393939393939394\
  \ 4.7333333333333325\n```\n\n计算m和b的这些方程源自微积分，如果你想探究公式的来源，本章后面我们将使用SymPy进行一些微积分工作。目前，你可以代入数据点数n，并遍历x和y值来执行上述操作。\n\
  \n接下来，我们将学习更多面向当代技术的方法，这些技术能够应对更大规模的数据。闭式方程通常难以扩展。\n\n> ## 计算复杂度\n> \n> 闭式方程在较大数据集上扩展性不佳的原因，归因于一个称为*计算复杂度*的计算机科学概念，它衡量算法随问题规模增长所需的时间。值得熟悉这一概念，下面是两个关于此主题的优秀YouTube视频：\n\
  > \n> **P vs. NP 与计算复杂度动物园** https://youtu.be/YX40hbAHx3s\n> \n> **什么是大O表示法？** https://www.youtube.com/watch?v=Q_1M2JaijjQ\n\
  \n## 逆矩阵技术\n\n接下来，我有时会用不同的名称β₁和β₀来分别替代系数m和b。这是你在专业领域中会更常看到的惯例，所以现在是时候升级一下了。\n\n\
  虽然我们在第4章专门用整章篇幅介绍了线性代数，但对于初学者来说，将其应用于数学和数据科学可能会有些令人不知所措。这就是为什么本书中的大多数示例将使用纯Python或Scikit-learn。不过，我会在合适的地方穿插一些线性代数，以展示它的用处。如果你觉得本节内容令人不知所措，可以随意跳过，先阅读本章的其余部分，稍后再回来。\n\
  \n我们可以使用在第4章中介绍过的转置矩阵和逆矩阵来拟合线性回归。下面，给定输入变量值的矩阵X和输出变量值的向量y，我们计算系数向量b。不深入微积分和线性代数证明的细节，公式如下：\n\
  \nb = (Xᵀ · X)⁻¹ · Xᵀ · y\n\n你会注意到，转置和逆运算是在矩阵X上执行的，并与矩阵乘法结合使用。以下是我们在NumPy中执行上述操作以获取系数m和b的方式，如示例5-6所示。\n\
  \n## 示例 5-6. 使用逆矩阵和转置矩阵拟合线性回归\n\n```\nimport pandas as pd\nfrom numpy.linalg import\
  \ inv\nimport numpy as np\n\n# Import points\ndf = pd.read_csv('https://bit.ly/3goOAnt',\
  \ delimiter=\",\")\n\n# Extract input variables (all rows, all columns but last\
  \ column)\nX = df.values[:, :-1].flatten()\n\n# Add placeholder \"1\" column to\
  \ generate intercept\nX_1 = np.vstack([X, np.ones(len(X))]).T\n\n# Extract output\
  \ column (all rows, last column)\nY = df.values[:, -1]\n\n# Calculate coefficients\
  \ for slope and intercept\nb = inv(X_1.transpose() @ X_1) @ (X_1.transpose() @ Y)\n\
  print(b) # [1.93939394 4.73333333]\n\n# Predict against the y-values\ny_predict\
  \ = X_1.dot(b)\n```\n\n这不直观，但请注意，上面我们必须在x列旁边堆叠一列“1”。这样做的原因是，这会生成截距\\(\\beta_0\\\
  )系数。由于这一列全是1，它实际上生成的是截距，而不仅仅是斜率\\(\\beta_1\\)。\n\n当数据量大且维度多时，计算机可能会开始吃力并产生不稳定的结果。这就是矩阵分解的用武之地，我们在第4章关于线性代数的内容中学习过。在此特定情况下，我们取矩阵X，追加一列额外的1来生成截距\\\
  (\\beta_0，就像之前一样，然后将其分解为两个分量矩阵Q和R。\n\n\\(X = Q \\cdot R\\)\n\n避免更多微积分的细节，以下是如何使用Q和R来找到矩阵形式b中的beta系数值：\n\
  \n\\(b = R^{-1} \\cdot Q^T \\cdot y\\)\n\n以下是如何在Python中使用上述QR分解公式和NumPy来执行线性回归。\n\
  \n## 示例 5-7. 使用QR分解执行线性回归\n\n```\nimport pandas as pd\nfrom numpy.linalg import\
  \ qr, inv\nimport numpy as np\n\n# Import points\ndf = pd.read_csv('https://bit.ly/3goOAnt',\
  \ delimiter=\",\")\n\n# Extract input variables (all rows, all columns but last\
  \ column)\nX = df.values[:, :-1].flatten()\n\n# Add placeholder \"1\" column to\
  \ generate intercept\nX_1 = np.vstack([X, np.ones(len(X))]).transpose()\n\n# Extract\
  \ output column (all rows, last column)\nY = df.values[:, -1]\n\n# calculate coefficients\
  \ for slope and intercept\n# using QR decomposition\nQ, R = qr(X_1)\nb = inv(R).dot(Q.transpose()).dot(Y)\n\
  \nprint(b) # [1.93939394 4.73333333]\n```\n\n通常，QR分解是许多科学库用于线性回归的方法，因为它更容易处理大量数据并且更稳定。我所说的*稳定*是什么意思？**数值稳定性**是指算法尽量减少错误，而不是放大近似中的错误。请记住，计算机只能处理有限的小数位数，并且需要近似，因此我们的算法在近似误差累积时不劣化变得很重要。\n\
  \nhttps://en.wikipedia.org/wiki/Numerical_stability\n\n> > **不知所措？**\n> > 如果你发现这些线性回归的线性代数示例令人不知所措，请不要担心！我只是想让你接触线性代数的一个实际用例。接下来我们将专注于其他你可以利用的技术。\n\
  \n## 梯度下降\n\n**梯度下降**是一种优化技术，它使用导数和迭代来最小化/最大化一组针对目标的参数。要了解梯度下降，让我们做一个快速的思想实验，然后将其应用于一个简单的示例。\n\
  \n## 梯度下降思想实验\n\n想象你身处夜晚的山脉，手持一支手电筒。你试图到达山脉的最低点。在迈出步伐之前，你就能看到周围的坡度。你会朝着明显向下的方向踏步。坡度越大，步子越大；坡度越小，步子越小。最终，你会发现自己处于坡度为0（即平坦）的低点。听起来不错，对吧？这种手电筒方法被称为**梯度下降**，即沿着坡度向下的方向踏步。\n\
  \n在机器学习中，我们常常将不同参数下可能遇到的所有平方损失视为一片山岳地貌。我们希望最小化损失，并通过在损失地貌中导航来实现这一点。解决这个问题时，梯度下降有一个吸引人的特点：偏导数就是那盏手电筒，使我们能够看到每个参数（在此例中为m和b，或β₀和β₁）的斜坡。我们朝着m和b的斜坡向下方向踏步。坡度越大，步子越大；坡度越小，步子越小。我们可以通过取坡度的一小部分来简单地计算步长。这一部分被称为我们的**学习率**。学习率越高，运行速度越快，但代价是精度降低。但学习率越低，训练速度越慢，且需要更多的迭代。\n\
  \n决定学习率就像在蚂蚁、人类或巨人之间选择来沿斜坡下山。蚂蚁（小的学习率）会迈出小步子，需要不可接受的长时间才能到达底部，但能做得非常精确。巨人（大的学习率）可能会一直跨过最低点，以至于无论走多少步都可能永远无法到达。人类（适中的学习率）可能拥有最平衡的步长，在速度和准确性之间做出了正确的权衡，以到达最低点。\n\
  \n## 先走再跑\n\n对于函数f(x) = (x − 3)² + 4，让我们找到产生该函数最低点的x值。虽然我们可以代数方法求解，\n\n\n\n让我们使用梯度下降来做这件事。\n\
  \n下面是我们要做的事情的直观演示。如图 5-8 所示，我们想要将 x“步进”到斜率为 0 的最小值处。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_241_0.png)\n\
  \n图 5-8. 向斜率趋近于 0 的局部最小值步进\n\n在示例 5-8 中，函数 f(x) 及其对 x 的导数为 dx_f(x)。请回顾我们在第 1 章中介绍过如何使用\
  \ SymPy 计算导数。求得导数后，我们接着执行梯度下降。\n\n## 示例 5-8. 使用梯度下降求抛物线的最小值\n\n```\nimport random\n\
  \ndef f(x):\n    return (x - 3) ** 2 + 4\n\ndef dx_f(x):\n    return 2*(x - 3)\n\
  \n# The learning rate\nL = 0.001\n\n# The number of iterations to perform gradient\
  \ descent\niterations = 100_000\n\n# start at a random x\nx = random.randint(-15,15)\n\
  \nfor i in range(iterations):\n    # get slope\n    d_x = dx_f(x)\n\n    # update\
  \ x by subtracting the (learning rate) * (slope)\n    x -= L * d_x\n\nprint(x, f(x))\
  \ # prints 2.99999999999889 4.0\n```\n\n如果我们绘制该函数（如图 5-8 所示），应该能清楚地看到函数的最低点在 x =\
  \ 3 处，而上面的代码应该能非常接近该点。学习率用于在每次迭代中取斜率的一小部分并将其从 x 值中减去。较大的斜率会导致较大的步长，而较小的斜率会导致较小的步长。经过足够多的迭代后，x\
  \ 将到达函数的最低点（或足够接近该点），此时斜率为 0。\n\n## 梯度下降与线性回归\n\n你现在可能在想我们如何将其用于线性回归。其实思路是一样的，只不过我们的“变量”是\
  \ m 和 b（或 β0 和 β1），而不是 x。原因如下：在简单线性回归中，我们已经知道 x 和 y 的值，因为它们作为训练数据提供。我们需要求解的“变量”实际上是参数\
  \ m 和 b，以便找到最佳拟合直线，然后可以接受一个 x 变量来预测新的 y 值。\n\n我们如何计算 m 和 b 的斜率？我们需要对每个变量求偏导数。我们要对哪个函数求导数？请记住，我们试图最小化损失，而损失将是平方和。因此，我们需要找到平方和函数对\
  \ m 和 b 的导数。\n\n我按照示例 5-9 所示实现了 m 和 b 这两个偏导数。我们很快将在 SymPy 中学习如何做到这一点。接着，我执行梯度下降来求\
  \ m 和 b。100,000 次迭代且学习率为 .001 就足够了。请注意，学习率设得越小，速度越慢，所需的迭代次数越多。但如果设得过高，虽然运行速度快，但近似效果较差。当有人说机器学习算法在“学习”或“训练”时，实际上只是像这样拟合一个回归。\n\
  \n## 示例 5-9. 对线性回归执行梯度下降\n\n```\nimport pandas as pd\n\n# Import points from CSV\n\
  points = list(pd.read_csv(\"https://bit.ly/2KF29Bd\").itertuples())\n\n# Building\
  \ the model\nm = 0.0\nb = 0.0\n\n# The learning Rate\nL = .001\n\n# The number of\
  \ iterations\niterations = 100_000\n\nn = float(len(points)) # Number of elements\
  \ in X\n\n# Perform Gradient Descent\nfor i in range(iterations):\n    # slope with\
  \ respect to m\n    D_m = sum(2 * p.x * ((m * p.x + b) - p.y) for p in points)\n\
  \    # slope with respect to b\n    D_b = sum(2 * ((m * p.x + b) - p.y) for p in\
  \ points)\n    # update m and b\n    m -= L * D_m\n    b -= L * D_b\nprint(\"y =\
  \ {0}x + {1}\".format(m, b))\n# y = 1.9393939393939548x + 4.73333333333227\n```\n\
  \n还不错！这个近似结果接近于我们解析解公式的结果。但问题在哪里呢？仅仅因为我们通过最小化平方和找到了“最佳拟合直线”，并不意味着我们的线性回归模型就很好。最小化平方和能保证得到一个用于预测的优秀模型吗？并不完全是。现在我已经向你展示了如何拟合线性回归，让我们退后一步，重新审视大局，判断给定的线性回归是否真的是进行预测的正确方法。但在此之前，这里还有一段展示\
  \ SymPy 解法的插曲。\n\n## 使用 SymPy 的线性回归梯度下降\n\n如果你想要计算平方和函数对 m 和 b 这两个偏导数的 SymPy 代码，示例\
  \ 5-10 中的代码如下。\n\n## 示例 5-10. 计算 m 和 b 的偏导数\n\n```\nfrom sympy import *\nm, b, i,\
  \ n = symbols('m b i n')\nx, y = symbols('x y', cls=Function)\nsum_of_squares =\
  \ Sum((m*x(i) + b - y(i)) ** 2, (i, 0, n))\nd_m = diff(sum_of_squares, m)\nd_b =\
  \ diff(sum_of_squares, b)\nprint(d_m)\nprint(d_b)\n```\n\n```\n# OUTPUTS\n# Sum(2*(b\
  \ + m*x(i) - y(i))*x(i), (i, 0, n))\n# Sum(2*b + 2*m*x(i) - 2*y(i), (i, 0, n))\n\
  ```\n\n你会看到上面分别打印出了 \\(m\\) 和 \\(b\\) 的两个导数。\n请注意，`Sum()` 函数会迭代并将项目相加（在此例中为所有数据点），我们将\
  \ \\(x\\) 和 \\(y\\) 视为查找给定索引 \\(i\\) 处点的值的函数。\n\n在数学符号中，其中 \\(e(x)\\) 表示平方和损失函数，\\\
  (m\\) 和 \\(b\\) 的偏导数如下。\n\n\\(e(x) = \\sum_{i=0}^n ((mx_i + b) - y_i)^2\\)\n\n\\\
  (\\frac{d}{dm}e(x) = \\sum_{i=0}^n 2(b + mx_i - y_i)x_i\\)\n\n\\(\\frac{d}{db}e(x)\
  \ = \\sum_{i=0}^n (2b + 2mx_i - 2y_i)\\)\n\n如果你想要应用我们的数据集并使用梯度下降执行线性回归，则需要执行示例 5-11\
  \ 中所示的几个额外步骤。我们需要对 `d_m` 和 `d_b` 导数函数迭代所有数据点，以替换 \\(n\\)、\\(x(i)\\) 和 \\(y(i)\\\
  ) 的值。这样应该只剩下 \\(m\\) 和 \\(b\\) 变量，我们将使用梯度下降来搜索它们的最优值。\n\n## 示例 5-11.\n\n```\nimport\
  \ pandas as pd\nfrom sympy import *\n\n# Import points from CSV\npoints = list(pd.read_csv(\"\
  https://bit.ly/2KF29Bd\").itertuples())\n\nm, b, i, n = symbols('m b i n')\nx, y\
  \ = symbols('x y', cls=Function)\n\nsum_of_squares = Sum((m*x(i) + b - y(i)) **\
  \ 2, (i, 0, n))\n\nd_m = diff(sum_of_squares, m) \\\n.subs(n, len(points) - 1).doit()\
  \ \\\n.replace(x, lambda i: points[i].x) \\\n.replace(y, lambda i: points[i].y)\n\
  \nd_b = diff(sum_of_squares, b) \\\n.subs(n, len(points) - 1).doit() \\\n.replace(x,\
  \ lambda i: points[i].x) \\\n.replace(y, lambda i: points[i].y)\n\n# compile using\
  \ lambdify for faster computation\nd_m = lambdify([m, b], d_m)\nd_b = lambdify([m,\
  \ b], d_b)\n\n# Building the model\nm = 0.0\nb = 0.0\n\n# The learning Rate\nL =\
  \ .001\n\n# The number of iterations\niterations = 100_000\n\n# Perform Gradient\
  \ Descent\nfor i in range(iterations):\n    # update m and b\n    m -= d_m(m,b)\
  \ * L\n    b -= d_b(m,b) * L\n\nprint(\"y = {0}x + {1}\".format(m, b))\n# y = 1.9399393939393954x\
  \ + 4.733333333333231\n```\n\n如示例 5-11 所示，最好对两个偏导数函数都调用 `lambdify()`，将它们从 SymPy\
  \ 转换为优化后的 Python 函数。这样在执行梯度下降时，计算速度会快得多。生成的 Python 函数由 NumPy、SciPy 或 SymPy 检测到的任何可用数值库提供支持。之后，我们就可以执行梯度下降了。\n\
  \n最后，如果你想知道这个简单线性回归的损失函数是什么样子的，示例 5-12 展示了将 x、y 和 n 值代入损失函数的 SymPy 代码，然后将 m 和 b\
  \ 作为输入变量进行绘图。我们的梯度下降算法将找到图 5-9 所示损失曲面的最低点。\n\n## 示例 5-12.\n\n```\nfrom sympy import\
  \ *\nfrom sympy.plotting import plot3d\nimport pandas as pd\n\npoints = list(pd.read_csv(\"\
  https://bit.ly/2KF29Bd\").itertuples())\nm, b, i, n = symbols('m b i n')\nx, y =\
  \ symbols('x y', cls=Function)\n\nsum_of_squares = Sum((m*x(i) + b - y(i)) ** 2,\
  \ (i, 0, n)) \\\n    .subs(n, len(points) - 1).doit() \\\n    .replace(x, lambda\
  \ i: points[i].x) \\\n    .replace(y, lambda i: points[i].y)\n\nplot3d(sum_of_squares)\n\
  \n\n\n\n\n![](img/8e0dcc1636d032e7728a07e97751e446_248_0.png)\n\n图 5-9. 简单线性回归的损失景观\n\
  \n## 过拟合与方差\n\n让我来出个谜题：如果我们真心想最小化损失，也就是将平方和降为 0，该怎么做？除了线性回归，还有其他选择吗？你可能得出的一个结论是，只需拟合一条经过所有点的曲线。哎呀，不如直接把点用分段连线起来，如图\
  \ 5-10 所示用来做预测？这样我们的损失就是 0 了！\n\n![](img/8e0dcc1636d032e7728a07e97751e446_249_0.png)\n\
  \n图 5-10. 通过简单连接点来进行回归，从而得到零损失。\n\n哎呀，我们为什么要为线性回归费那么大劲，而不这样做呢？好吧，请记住，我们宏观的目标不是最小化平方和，而是对新数据做出准确预测。这个“连线连点”模型严重**过拟合**，意味着它将回归拟合得过于精确地贴合训练数据，以至于在新数据上预测效果很差。这个简单的“连线连点”模型对远离其余点的异常值非常敏感，意味着它在预测中会有很高的**方差**。虽然本例中的点相对靠近一条直线，但在分布更广且包含更多异常值的其他数据集中，这个问题会严重得多。因为过拟合会增加方差，预测结果将千差万别！\n\
  \n## 过拟合即记忆\n\n当你听到有人说回归“记住”了数据，而不是对其进行泛化时，他们指的就是过拟合。\n\n不言而喻，我们希望在模型中找到有效的泛化，而不是记忆数据。否则，我们的回归就只是一个用于查找值的数据库。\n\
  \n这就是为什么在机器学习中，你会发现模型中加入了偏差，而线性回归被认为是一个高度偏差的模型。这里的偏差与数据中的偏差不同，我们在第 3 章中详细讨论过。**模型中的偏差**意味着我们优先采用某种方法（例如保持一条直线），而不是去迎合数据所显示的一切。偏差模型留出了一定的余地，希望在新数据上最小化损失以获得更好的预测，而不是在训练数据上最小化损失。我想你可以说，向模型添加偏差是通过**欠拟合**（即对训练数据拟合得不够）来抵消过拟合的。\n\
  \n不难想象，这是一场平衡艺术，因为这两个目标是矛盾的。在机器学习中，我们基本上是在说：“我想把回归拟合到我的数据上，但我不想把它拟合_太过_。我需要一些余地来对那些不同的新数据进行预测。”\n\
  \n## LASSO 回归与岭回归\n\nLASSO 回归和岭回归是线性回归的两种较为流行的变体。岭回归以罚项的形式向线性回归添加了进一步的偏差，因此导致它对数据拟合得较少。LASSO\
  \ 回归会尝试边缘化噪声变量，因此在你希望自动移除可能无关的变量时非常有用。\n\n即便如此，我们不能只是对一些数据应用线性回归，做一些预测，然后就假设一切都没问题。即使有直线的偏差，线性回归仍然可能过拟合。因此，我们需要检查并减轻过拟合和欠拟合，以找到两者之间的平衡点。如果根本不存在这样的平衡点，那么你应该彻底放弃该模型。\n\
  \n## 随机梯度下降\n\n在机器学习场景中，你不太可能像我们之前那样在实际操作中使用梯度下降（那时我们在所有训练数据上进行训练，称为批量梯度下降）。在实际操作中，你更有可能执行随机梯度下降，它在每次迭代时只训练数据集中的一个样本。在小批量梯度下降中，每次迭代使用数据集中的多个样本（例如\
  \ 10 或 100 个数据点）。\n\n为什么每次迭代只使用部分数据？机器学习从业者提到了几个好处。首先，它显著减少了计算量，因为每次迭代不需要遍历整个训练数据集，只需遍历其中一部分。第二个好处是它能减少过拟合。通过在每次迭代时只让训练算法接触部分数据，它不断改变损失景观，使其不会落在损失最小值上。毕竟，最小化损失是导致过拟合的原因，因此我们引入一些随机性来制造一点欠拟合（但希望不要太多）。\n\
  \n当然，我们的近似会变得不那么精确，因此我们必须小心。这就是为什么我们很快就会讨论训练/测试划分，以及用于评估线性回归可靠性的其他指标。\n\n示例 5-13\
  \ 展示了如何在 Python 中执行随机梯度下降。如果你将样本大小改为大于 1，它将执行小批量梯度下降。\n\n## 示例 5-13. 执行线性回归的随机梯度下降\n\
  \n```\nimport pandas as pd\nimport numpy as np\n\n# Input data\ndata = pd.read_csv('https://bit.ly/2KF29Bd',\
  \ header=0)\n\nX = data.iloc[:, 0].values\nY = data.iloc[:, 1].values\n\nn = data.shape[0]\
  \ # rows\n\n# Building the model\nm = 0.0\nb = 0.0\n\nsample_size = 1 # sample size\n\
  L = .0001 # The learning Rate\nepochs = 1_000_000 # The number of iterations to\
  \ perform gradient descent\n\n# Performing Stochastic Gradient Descent\nfor i in\
  \ range(epochs):\n    idx = np.random.choice(n, sample_size, replace=False)\n  \
  \  x_sample = X[idx]\n    y_sample = Y[idx]\n\n    # The current predicted value\
  \ of Y\n    Y_pred = m * x_sample + b\n\n    # d/dm derivative of loss function\n\
  \    D_m = (-2 / sample_size) * sum(x_sample * (y_sample - Y_pred))\n\n    # d/db\
  \ derivative of loss function\n    D_b = (-2 / sample_size) * sum(y_sample - Y_pred)\n\
  \    m = m - L * D_m # Update m\n    b = b - L * D_b # Update b\n\n# print progress\n\
  if i % 10000 == 0:\n    print(i, m, b)\nprint(\"y = {0}x + {1}\".format(m, b))\n\
  ```\n\n当我运行这段代码时，得到的线性回归为 y = 1.9382830354181135x + 4.753408787648379。显然，你的结果会不同，而且由于随机梯度下降，我们实际上不会收敛到某个特定的最小值，而是会落在一个更广泛的区域内。\n\
  \n## 随机性是坏事吗？\n\n如果这种随机性让你感到不安，即每次运行一段代码都会得到不同的答案，欢迎来到机器学习、优化和随机算法的世界！许多进行近似的算法都是基于随机性的，虽然有些非常有用，但另一些可能会像你预期的那样粗心大意且表现不佳。\n\
  \n许多人将机器学习和 AI 视为一种能给出客观、精确答案的工具，但这与事实相去甚远。机器学习产生的是带有一定不确定度的近似结果，一旦投入生产，往往没有真实值可依。如果一个人不了解其工作原理，机器学习可能会被滥用，而不承认其非确定性和近似的本性是失职的。\n\
  \n虽然随机性可以创造一些强大的工具，但也可能被滥用。要小心不要利用种子值和随机性来 p-hack 一个“良好”的结果，并且要致力于分析你的数据和模型。\n\n\
  ## 相关系数\n\n看看图 5-11 中的这个散点图及其线性回归。为什么线性回归在这里可能效果不太好？\n\n![](img/8e0dcc1636d032e7728a07e97751e446_254_0.png)\n\
  \n图 5-11. 方差较高的数据散点图\n\n这里的问题是数据方差较高。如果数据分布非常分散，会使方差升高到预测变得不那么准确和有用的程度，从而导致较大的残差。当然，我们可以引入一个偏差更大的模型，例如线性回归，使其不那么容易迎合方差而发生弯曲。然而，欠拟合也会削弱我们的预测，因为数据分布得太分散了。我们需要在数值上衡量我们的预测“偏离”程度。\n\
  \n那么，如何对这些残差进行整体衡量？又如何了解数据方差的大小呢？让我来介绍一下**相关系数**，也称为**皮尔逊相关**，它以 -1 到 1 之间的值来衡量两个变量之间关系的强度。相关系数越接近\
  \ 0，表示相关性越弱。相关系数越接近 1，表示强**正相关**，意味着当一个变量增加时，另一个变量也按比例增加。如果越接近 -1，则表示强**负相关**，意味着当一个变量增加时，另一个变量按比例减少。\n\
  \n请注意，相关系数通常用 r 表示。图 5-16 中高度分散的数据的相关系数为 0.1201。由于它远比 1 更接近 0，我们可以推断其几乎没有相关性。\n\n\
  图 5-12 展示了另外三个散点图及其相关系数。请注意，点越是沿着一条直线分布，相关性就越强。点越分散，相关性就越弱。\n\n\n\n\n![](img/8e0dcc1636d032e7728a07e97751e446_256_0.png)\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_256_1.png)\n\n![](img/8e0dcc1636d032e7728a07e97751e446_256_2.png)\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_256_3.png)\n\n图 5-12. 四个散点图的相关系数\n\n\
  你可以想象，相关系数有助于判断两个变量之间是否存在可能的关系。如果存在强正/负相关关系，它在我们的线性回归中将很有用。如果没有关系，它们可能只是增加噪声并降低模型准确性。\n\
  \n我们如何使用 Python 来计算相关系数？让我们使用之前用过的那个简单的 10 点数据集。分析所有变量对之间相关性的一种快速简单方法是使用 Pandas\
  \ 的 `corr()` 函数。它可以轻松查看数据集中每对变量之间的相关系数，在本例中仅为 `x` 和 `y`。这称为**相关矩阵**。请参阅示例 5-14。\n\
  \n### 示例 5-14. 使用 Pandas 查看每对变量之间的相关系数\n\n```python\nimport pandas as pd\n\n# Read\
  \ data into Pandas dataframe\ndf = pd.read_csv('https://bit.ly/2KF29Bd', delimiter=\"\
  ,\")\n\n# Print correlations between variables\ncorrelations = df.corr(method='pearson')\n\
  print(correlations)\n\n# OUTPUT:\n#           x         y\n# x  1.000000  0.957586\n\
  # y  0.957586  1.000000\n```\n\n正如你所见，`x` 和 `y` 之间的相关系数 .957586 表明这两个变量之间存在强正相关关系。你可以忽略矩阵中\
  \ `x` 或 `y` 与自身设置且值为 `1.0` 的部分。显然，当 `x` 或 `y` 与自身设置时，相关性将完美地达到 1.0，因为它们的值与自身完全匹配。当有两个以上变量时，相关矩阵将显示一个更大的网格，因为有更多的变量需要配对和比较。\n\
  \n如果更改代码以使用方差较大、数据分布较分散的不同数据集，你会看到相关系数下降。这同样表明相关性较弱。\n\n## 计算相关系数\n\n对于好奇相关系数如何计算的数学爱好者，以下是公式：\n\
  \n\\( r = \\frac{n \\sum xy - (\\sum x)(\\sum y)}{\\sqrt{n \\sum x^2 - (\\sum x)^2}\
  \ \\sqrt{n \\sum y^2 - (\\sum y)^2}} \\)\n\n如果你想在 Python 中看到完整实现，我喜欢使用单行 `for` 循环来进行这些求和。示例\
  \ 5-15 展示了在 Python 中从头实现相关系数。\n\n### 示例 5-15. 在 Python 中从头计算相关系数\n\n```python\n\
  import pandas as pd\nfrom math import sqrt\n\n# Import points from CSV\npoints =\
  \ list(pd.read_csv(\"https://bit.ly/2KF29Bd\").itertuples())\nn = len(points)\n\n\
  numerator = n * sum(p.x * p.y for p in points) - \\\n    sum(p.x for p in points)\
  \ * sum(p.y for p in points)\n\ndenominator = sqrt(n*sum(p.x**2 for p in points)\
  \ - sum(p.x for p in points)**2) \\\n    * sqrt(n*sum(p.y**2 for p in points) -\
  \ sum(p.y for p in points)**2)\n\ncorr = numerator / denominator\n\nprint(corr)\n\
  \n# OUTPUT:\n# 0.9575860952087218\n```\n\n## 统计显著性\n\n线性回归中你必须考虑的另一个方面是：我的数据相关性是否是巧合？在第\
  \ 3 章中，我们学习了假设检验和 p 值，我们将在此用线性回归扩展这些思想。\n\n### STATSMODELS 库\n\n虽然本书不会再介绍另一个库，但如果你想进行统计分析，值得一提的是\
  \ `statsmodels` 值得关注。\n\nhttps://www.statsmodels.org/stable/regression.html\n\n\
  Scikit-learn 和其他机器学习库不提供统计显著性和置信区间的工具，我们将在另一个侧边栏中讨论原因。我们将自己实现这些技术。但要知道这个库存在，并且值得一试！\n\
  \n让我们从一个基本问题开始：我是否可能因为随机机会而在数据中看到线性关系？我们如何才能 95% 确定这两个变量之间的相关性是显著的，而非巧合？如果这听起来像第\
  \ 3 章中的假设检验，那就是因为它确实是！我们需要不仅表达相关系数，还要量化我们对相关系数非随机发生的信心程度。\n\n与我们在第 3 章药物测试示例中估计均值不同，我们正在基于样本估计总体相关系数。我们用希腊字母\
  \ ρ（“Rho”）表示总体相关系数，而我们的样本相关系数是 r。与第 3 章一样，我们将设立原假设 H0 和备择假设 H1。\n\n```\nH0 : ρ =\
  \ 0 (implies no relationship)\n\nH1 : ρ ≠ 0 (relationship is present)\n```\n\n我们的原假设\
  \ $H_0$ 是两个变量之间没有关系，或者更准确地说，相关系数为 0。备择假设 $H_1$ 是存在一种关系，可以是正相关或负相关。这就是为什么备择假设定义为\
  \ \\(\\rho \\neq 0\\)，以支持正相关和负相关。\n\n让我们回到图 5-13 所示的 10 点数据集。我们偶然看到这些数据点的可能性有多大？而它们恰好产生了看似线性的关系？\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_260_0.png)\n\n图 5-13. 通过随机机会看到这些似乎具有线性相关性的数据的可能性有多大？\n\
  \n我们之前在示例 5-14 中已经计算过该数据集的相关系数，为 0.957586。这是一种强有力且令人信服的正相关关系。但我们仍需要评估这是否纯属运气。让我们使用双尾检验以\
  \ 95% 的置信度开展假设检验，探索这两个变量之间是否存在关系。\n\n我们在第 3 章讨论过 T 分布，其尾部更宽，以捕获更多的方差和不确定性。我们使用 T\
  \ 分布而不是正态分布来进行线性回归的假设检验。首先，让我们像图 5-14 所示绘制一个带有 95% 临界值范围的 T 分布。我们考虑到样本中有 10 条记录，因此有\
  \ 9 个自由度（10 - 1 = 9）。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_262_0.png)\n\n\
  图 5-14. 具有 9 个自由度的 T 分布，因为有 10 条记录且我们减去 1。\n\n临界值约为 ±2.262，我们可以按照示例 5-16 在 Python\
  \ 中计算它。这涵盖了 T 分布中心区域的 95%。\n\n### 示例 5-16. 从 T 分布计算临界值\n\n```python\nfrom scipy.stats\
  \ import t\n\nn = 10\nlower_cv = t(n-1).ppf(.025)\nupper_cv = t(n-1).ppf(.975)\n\
  \nprint(lower_cv, upper_cv)\n# -2.262157162740992 2.2621571627409915\n```\n\n如果我们的检验值碰巧落在\
  \ (-2.262, 2.262) 范围之外，则可以拒绝原假设。要计算检验值 t，我们需要使用下面的公式。同样，r 是相关系数，n 是样本量。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_263_0.png)\n\
  \n让我们像示例 5-17 所示在 Python 中将整个测试整合起来。如果我们的检验值落在 95% 置信度的临界范围之外，我们接受相关性不是偶然的。\n\n\
  ### 示例 5-17. 对看似线性的数据进行显著性检验\n\n```python\nfrom scipy.stats import t\nfrom math\
  \ import sqrt\n\n# sample size\nn = 10\n\nlower_cv = t(n-1).ppf(.025)\nupper_cv\
  \ = t(n-1).ppf(.975)\n\n# correlation coefficient\n# derived from data https://bit.ly/2KF29Bd\n\
  r = 0.957586\n\n# Perform the test\ntest_value = r / sqrt((1-r**2) / (n-2))\n\n\
  print(\"TEST VALUE: {}\".format(test_value))\nprint(\"CRITICAL RANGE: {}, {}\".format(lower_cv,\
  \ upper_cv))\n\nif test_value < lower_cv or test_value > upper_cv:\n    print(\"\
  CORRELATION PROVEN, REJECT H0\")\nelse:\n    print(\"CORRELATION NOT PROVEN, FAILED\
  \ TO REJECT H0 \")\n\n# Calculate p-value\nif test_value > 0:\n    p_value = 1.0\
  \ - t(n-1).cdf(test_value)\nelse:\n    p_value = t(n-1).cdf(test_value)\n\n# Two-tailed,\
  \ so multiply by 2\np_value = p_value * 2\nprint(\"P-VALUE: {}\".format(p_value))\n\
  ```\n\n上面的检验值约为 9.39956，这肯定落在 (-2.262, 2.262) 范围之外，因此我们可以拒绝原假设并说我们的相关性是真实的。这是因为\
  \ p 值极为显著：.000005976。这远低于我们的 .05 阈值，因此这几乎肯定不是巧合，而是存在相关性。p 值如此之小是有道理的，因为这些点强烈类似一条直线。这些点偶然如此紧密地排列成一条直线的可能性极小。\n\
  \n图 5-15 显示了其他一些数据集及其相关系数和 p 值。分析每一个。哪个最可能对预测最有用？其他数据集有什么问题？\n\n\n\n\n![](img/8e0dcc1636d032e7728a07e97751e446_265_0.png)\n\
  \nr 0.771454\np-value 0.34913\n\n![](img/8e0dcc1636d032e7728a07e97751e446_265_1.png)\n\
  \nr 0.957586095\np-value 0.000005976\n\n![](img/8e0dcc1636d032e7728a07e97751e446_265_2.png)\n\
  \nr 0.100984708\np-value 0.569732057\n\n![](img/8e0dcc1636d032e7728a07e97751e446_265_3.png)\n\
  \nr 0.037875905\np-value 0.831544971\n\n图 5-15. 不同数据集及其相关系数和 p 值\n\n既然你有机会对图 5-15\
  \ 中的数据集进行了分析，让我们来梳理一下发现。左图具有高正相关，但只有 3 个点。数据不足会显著推高 p 值至 .34913，并增加数据是偶然发生的可能性。这是合理的，因为只有\
  \ 3 个数据点时容易看到线性模式，但这并不比仅有 2 个点（两点间简单连成一条线）好多少。这里提及一条重要经验法则：拥有更多数据会降低你的 p 值，尤其是当数据沿线性分布时。\n\
  \n第二个图就是我们刚才介绍的。它只有 10 个数据点，但线性模式非常完美，因此不仅有很强的正相关，还有一个极低的 p 值。当 p 值如此之低时，你可以肯定你在测量的是一个经过设计且受严格控制的过程，而非社会学或自然现象。\n\
  \n图 5-15 中右侧的两个图未能识别出线性关系。它们的相关系数接近 0，表明没有相关性，而 p 值也并不意外地表明随机性起了作用。\n\n经验法则如下：你拥有的且持续呈现线性趋势的数据越多，你的相关性\
  \ p 值就越显著。数据越分散或稀疏，p 值就越高，从而表明你的相关性是偶然发生的。\n\n## 决定系数\n\n让我们学习一下统计和机器学习回归中常见的一个重要指标。**决定系数**，称为\
  \ $r^2$，衡量一个变量的变化量有多少可以由另一个变量的变化量来解释。它也是相关系数 $r$ 的平方。当 $r$ 趋向于完美相关（-1 或 1）时，$r^2$\
  \ 趋向于 1。基本上，$r^2$ 显示了两个变量相互作用的程度。\n\n让我们继续查看图 5-13 中的数据。在示例 5-18 中，使用我们之前计算相关系数的\
  \ dataframe 代码，然后简单地对其平方。这将把每个相关系数乘以自身。\n\n### 示例 5-18. 在 Pandas 中创建相关矩阵\n\n```python\n\
  import pandas as pd\n\n# Read data into Pandas dataframe\ndf = pd.read_csv('https://bit.ly/2KF29Bd',\
  \ delimiter=\",\")\n\n# Print correlations between variables\ncoeff_determination\
  \ = df.corr(method='pearson') ** 2\nprint(coeff_determination)\n```\n\n```\n#\n\
  # x y\n# x 1.000000 0.916971\n# y 0.916971 1.000000\n```\n\n决定系数为 .916971，可解释为：“x\
  \ 的 91.6971% 变化量由 y 解释（反之亦然），其余 8.3029% 是由其他未捕获变量引起的噪声。0.916971 是一个相当不错的决定系数，表明\
  \ x 和 y 互相解释了各自的方差。但可能还有其他变量在起作用，构成了那剩余的 0.083029。请记住，相关不等于因果，因此可能还有其他变量在影响我们所看到的关系。\n\
  \n## 相关不等于因果！\n\n需要注意的是，虽然我们非常重视测量相关性并围绕它构建指标，但请记住 _相关不等于因果！_ 你可能以前听过这个口号，但我想解释一下统计学家为什么这样说。\n\
  \n仅仅因为我们看到 x 和 y 之间存在相关性，并不意味着 x 导致 y。事实上，可能是 y 导致 x！或者可能有一个第三个未捕获变量 z 在导致 x 和 y。也可能是\
  \ x 和 y 根本不相互导致，相关性只是巧合，因此衡量统计显著性很重要。\n\n现在我有一个更紧迫的问题要问你。计算机能区分相关性和因果关系吗？答案是毫无疑问的“不”！计算机只有相关性的概念，而没有因果关系的概念。假设我将一个数据集加载到\
  \ Scikit-learn 中，显示消耗的加仑水量和我的水费账单。我的计算机，或包括 Scikit-learn 在内的任何程序，都不知道是更多的用水导致更高的账单，还是更高的账单导致更多的用水。一个“AI”系统很容易得出后者结论，尽管这毫无意义。这就是为什么许多机器学习项目需要人工介入来注入常识。\n\
  \n在计算机视觉中也会发生这种情况。计算机视觉通常使用对数字像素的回归来预测类别。如果我使用牛的照片训练一个计算机视觉系统来识别牛，它很容易与田地而非牛建立相关性。因此，如果我展示一张空旷田野的照片，它会将草地标记为牛！这又是因为计算机没有因果关系的概念（牛的形状应该导致标签“牛”），而是陷入了我们不感兴趣的相关性中。\n\
  \n## 估计值的标准误\n\n衡量线性回归总体误差的一种方法是 **SSE**，即 **平方误差和**。我们之前学过，对每个残差平方并求和。如果 ŷ（读作“y-hat”）是直线上的每个预测值，而\
  \ y 表示数据中的每个实际 y 值，计算方法如下：\n\n```\nSSE = \\sum (y - \\hat{y})^2\n```\n\n然而，所有这些平方值都难以解释，因此我们可以使用平方根逻辑将事物缩放回原始单位。我们还会对它们求平均，这就是\
  \ **估计值的标准误**（**S**<sub>e</sub>）所做的。如果 _n_ 是数据点数量，示例 5-19 展示了如何在 Python 中计算标准误 **S**<sub>e</sub>。\n\
  \n\\( S_e = \\frac{\\sum (y - \\hat{y})^2}{n - 2} \\)\n\n### 示例 5-19. 计算估计值的标准误\n\
  \n下面是我们在 Python 中计算它的方法：\n\n```python\nimport pandas as pd\nfrom math import sqrt\n\
  \n# Load the data\npoints = list(pd.read_csv('https://bit.ly/2KF29Bd',\n       \
  \                   delimiter=\",\").itertuples())\n\nn = len(points)\n\n# Regression\
  \ line\nm = 1.939\nb = 4.733\n\n# Calculate Standard Error of Estimate\nS_e = sqrt((sum((p.y\
  \ - (m*p.x + b))**2 for p in points))/(n-2))\n\nprint(S_e)\n# 1.87406793500129\n\
  ```\n\n为什么是 _n_ – 2 而不是 _n_ – 1，就像我们在第 3 章的许多方差计算中所做的那样？无需深入数学证明，这是因为线性回归有两个变量，而不仅仅是一个，所以我们在自由度中需要再增加一个不确定性。\n\
  \n你会注意到估计值的标准误与我们在第 3 章学习的标准差非常相似。这并非巧合。这是因为它是线性回归的标准差。\n\n## 预测区间\n\n如前所述，线性回归中的数据是总体的一个样本。因此，我们的回归只能和样本一样好。我们的线性回归直线上也沿着一个正态分布。有效地，这使得每个预测\
  \ y 值都像均值一样是一个样本统计量。事实上，“均值”正沿着直线移动。\n\n还记得我们在第 2 章讨论统计学时提到方差和标准差吗？这些概念同样适用于此。在线性回归中，我们希望数据以线性方式遵循正态分布。回归直线充当我们钟形曲线上移动的“均值”，而数据围绕直线的分散程度反映了方差/标准差，如图\
  \ 5-16 所示。\n\n\n\n\n\n\n![](img/8e0dcc1636d032e7728a07e97751e446_271_0.png)\n\n\
  图 5-16. 线性回归假设正态分布围绕回归线分布\n\n当我们有一条沿着线性回归线的正态分布时，我们面对的不再是单一变量，还有第二个变量在引导分布。每个 y\
  \ 预测值周围都有一个置信区间，这被称为预测区间。\n\n让我们通过兽医示例重新建立一些背景，估算狗的年龄和兽医就诊次数。我想知道一只 8.5 岁狗的兽医就诊次数在\
  \ 95% 置信水平下的预测区间。这个预测区间的样子如图 5-17 所示。我们有 95% 的把握，一只 8.5 岁的狗兽医就诊次数会在 16.462 到 25.966\
  \ 次之间。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_273_0.png)\n\n图 5-17. 一只 8.5\
  \ 岁狗在 95% 置信水平下的预测区间\n\n我们该如何计算这个？我们需要得到误差范围，并将其在预测的 y 值周围进行加减运算。这是一个棘手的方程，涉及 t\
  \ 分布的临界值以及估计的标准误。让我们来看一下：\n\n![](img/8e0dcc1636d032e7728a07e97751e446_274_0.png)\n\
  \n我们感兴趣的 x 值指定为 $x_0$，在此例中为 8.5。以下是使用 Python 解决此问题的方法，如示例 5-20 所示。\n\n## 示例 5-20.\
  \ 计算一只 8.5 岁狗的兽医就诊次数预测区间\n\n```\nimport pandas as pd\nfrom scipy.stats import t\n\
  from math import sqrt\n\n# Load the data\npoints = list(pd.read_csv('https://bit.ly/2KF29Bd',\
  \ delimiter=\",\").itertuples())\n\nn = len(points)\n\n# Linear Regression Line\n\
  m = 1.939\nb = 4.733\n\n# Calculate Prediction Interval for x = 8.5\nx_0 = 8.5\n\
  x_mean = sum(p.x for p in points) / len(points)\n\nt_value = t(n - 2).ppf(.975)\n\
  \nstandard_error = sqrt(sum((p.y - (m * p.x + b)) ** 2 for p in points) / (n - 2))\n\
  \nmargin_of_error = t_value * standard_error * \\\n    sqrt(1 + (1 / n) + (n * (x_0\
  \ - x_mean) ** 2) / \\\n    (n * sum(p.x ** 2 for p in points) - sum(p.x for p in\
  \ points) ** 2))\n\npredicted_y = m*x_0 + b\n# Calculate prediction interval\nprint(predicted_y\
  \ - margin_of_error, predicted_y + margin_of_error)\n# 16.462516875955465 25.96648312404537\n\
  ```\n\n哎呀！这需要大量计算，遗憾的是 SciPy 及其他主流数据科学库并不提供此功能。但如果你倾向于统计分析，这将是非常有用的信息。我们不仅基于线性回归做出预测（例如，一只\
  \ 8.5 岁的狗会有 21.2145 次兽医就诊），还能够表达一个远非绝对的结论：一只 8.5 岁的狗有 95% 的概率兽医就诊次数在 16.46 到 25.96\
  \ 次之间。很棒，对吧？这是一个更安全的说法，因为它捕捉的是一个范围而不是单一数值，从而考虑了不确定性。\n\n## 参数的置信区间\n\n仔细想想，线性回归线本身就是一个样本统计量，而我们试图推断的总体也有一条线性回归线。这意味着\
  \ m 和 b 等参数有自己的分布，我们可以分别围绕 m 和 b 建模置信区间，以反映总体的斜率和 y 截距。这超出了本书的范围，但值得注意的是，可以进行这种类型的分析。\n\
  \n你可以找到从头进行这些计算的资源，但使用 Excel 的回归工具或 Python 库可能更简单。\n\n## 训练/测试划分\n\n我刚才进行的相关系数、统计显著性和决定系数分析，不幸的是并非总是由从业者执行。有时他们面对的数据量太大，没有时间或技术能力去做。例如，一张\
  \ 128x128 像素的图像至少有 16,384 个变量。你有时间对每个像素变量进行统计分析吗？可能没有！不幸的是，这导致许多数据科学家根本不学习这些统计指标。\n\
  \n在一个晦涩的在线论坛上，我曾读到一篇帖子，说统计回归像手术刀，而机器学习像链锯。在处理海量数据和变量时，你无法用手术刀筛选所有内容。你不得不求助于链锯，虽然你失去了可解释性和精确性，但至少可以扩展规模，对更多数据做出更广泛的预测。话虽如此，抽样偏差和过拟合等统计问题并不会消失。但有一些做法可以用于快速验证。\n\
  \n## 为什么 Scikit-learn 中没有置信区间和 P 值？\n\nScikit-learn 不支持置信区间和 P 值，因为这两种技术对于高维数据来说是未解决的问题。这只强调了统计学家和机器学习从业者之间的差距。Scikit-learn\
  \ 的维护者之一 Gael Varoquaux 说过：“……一般来说，计算正确的 P 值需要对数据做出一些假设，而机器学习使用的数据并不满足这些假设（没有多重共线性，与维度相比有足够的数据）……P\
  \ 值是人们期望被仔细检查的东西（它们是医学研究中的一道防线）。实现它们是在找麻烦……我们只能在非常狭窄的设置中[变量很少]给出 P 值。”\n\n如果你想深入探究，GitHub\
  \ 上有一些有趣的讨论：\n\n- https://github.com/scikit-learn/scikit-learn/issues/6773\n- https://github.com/scikit-learn/scikit-learn/issues/16802\n\
  \n如前所述，`statsmodels` 是一个为统计分析提供有用工具的库。请注意，由于上述原因，它可能无法扩展到更高维的模型。\n\n- https://www.statsmodels.org/stable/regression.html\n\
  \n机器学习从业者用来缓解过拟合的一种基本技术叫做训练/测试划分，通常将 1/3 的数据留作测试，另外 2/3 用于训练（也可以使用其他比例）。**训练数据集**用于拟合线性回归，而**测试数据集**用于衡量线性回归在未见过的数据上的表现。这种技术通常用于所有受监督机器学习，包括逻辑回归和神经网络。图\
  \ 5-18 展示了我们如何将数据分为 2/3 用于训练和 1/3 用于测试的可视化。\n\n## 这是一个小型数据集\n\n稍后我们将了解，将训练/测试数据集划分为\
  \ 2/3 和 1/3 之外还有其他方法。如果你的数据集非常小，使用 9/10 和 1/10 搭配交叉验证，或者甚至只使用留一法交叉验证，可能会更好。参见 *训练/测试划分必须是三分之一吗？*\
  \ 了解更多。\n\n数据\n\n训练\n\n测试\n\n![](img/8e0dcc1636d032e7728a07e97751e446_278_0.png)\n\
  \n图 5-18. 划分训练/测试数据。回归线是通过最小二乘法拟合到训练数据（蓝色）上的，而测试数据（红色）随后被分析，以查看预测在之前未见过的数据上偏离了多少\n\
  \n示例 5-21 展示了如何使用 Scikit-learn 执行训练/测试划分，其中 1/3 的数据留作测试，另外 2/3 用于训练。\n\n> 训练就是拟合回归\n\
  > \n> 请记住，“拟合”回归与“训练”同义。后者一词由机器学习从业者使用。\n\n## 示例 5-21. 对线性回归执行训练/测试划分\n\n```python\n\
  import pandas as pd\nfrom sklearn.linear_model import LinearRegression\nfrom sklearn.model_selection\
  \ import train_test_split\n\n# Load the data\ndf = pd.read_csv('https://bit.ly/3cIH97A',\
  \ delimiter=\",\")\n\n# Extract input variables (all rows, all columns but last\
  \ column)\nX = df.values[:, :-1]\n\n# Extract output column (all rows, last column)\n\
  Y = df.values[:, -1]\n\n# Separate training and testing data\n# This leaves a third\
  \ of the data out for testing\nX_train, X_test, Y_train, Y_test = train_test_split(X,\
  \ Y,\n                                                test_size=1/3)\n\nmodel =\
  \ LinearRegression()\nmodel.fit(X_train, Y_train)\nresult = model.score(X_test,\
  \ Y_test)\nprint(\"R^2: %.3f\" % result)\n```\n\n请注意 train_test_split() 会获取我们的数据集（X\
  \ 和 Y 列），将其打乱，然后根据我们的测试数据集大小返回训练和测试数据集。我们使用 LinearRegression 的 fit() 函数在训练数据 X_train\
  \ 和 Y_train 上进行拟合。然后我们使用\n\n\n\n在测试数据集 X_test 和 Y_test 上使用 `score()` 函数来评估 $r^2$，从而了解回归在未见过的数据上的表现。测试数据集的\
  \ $r^2$ 越高，越好。该数值越高，表明回归在未见过的数据上表现越好。\n\n## 使用 R-平方 进行测试\n\n请注意，此处的 \\( r^2 \\)\
  \ 计算方式略有不同，因为我们有一个来自训练的预定义线性回归。我们将测试数据与基于训练数据构建的回归线进行比较。目标仍然相同：越接近 1.0 越理想，以表明即使在训练数据上回归相关性也很强；而越接近\
  \ 0.0 则表明测试数据集表现不佳。其计算方法如下，其中 \\( y_i \\) 是每个实际 y 值，\\( \\widehat{y_i} \\) 是每个预测\
  \ y 值，\\( \\overline{y} \\) 是所有数据点的平均 y 值。\n\n\\( r^2 = 1 - \\frac{\\sum \\left(\
  \ y_i - \\widehat{y_i} \\right)^2}{\\sum \\left( y_i - \\overline{y} \\right)^2}\
  \ \\)\n\n图 5-19 显示了不同线性回归的不同 \\( r^2 \\) 值。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_282_0.png)\n\
  \n### $R^2 = 1.0$\n（完美！）\n\n![](img/8e0dcc1636d032e7728a07e97751e446_282_1.png)\n\
  \n### $R^2 = 0.917$\n（良好！）\n\n![](img/8e0dcc1636d032e7728a07e97751e446_282_2.png)\n\
  \n### $R^2 = 0.071$\n（较差！）\n\n图 5-19. 将 R-平方应用于使用训练过的线性回归的不同测试数据集\n\n我们还可以将测试数据集在每个\
  \ 1/3 折叠之间轮换。这称为 **交叉验证**，通常被视为验证技术的金标准。图 5-20 显示了数据的每个 1/3 如何轮流充当测试数据集。\n\n数据\n\
  \n| | | |\n|---|---|---|\n| 训练 | 训练 | 测试 |\n| 训练 | 测试 | 训练 |\n| 测试 | 训练 | 训练 |\n\
  \n### 图 5-20. 三倍交叉验证的可视化\n\n示例 5-22 中的代码展示了在三个折叠上执行交叉验证，然后将评分指标（在此情况下为平均平方和（MSE））及其标准差平均，以显示每次测试的一致性。\n\
  \n### 示例 5-22. 对线性回归使用 3 倍交叉验证\n\n```\nimport pandas as pd\nfrom sklearn.linear_model\
  \ import LinearRegression\nfrom sklearn.model_selection import KFold, cross_val_score\n\
  \ndf = pd.read_csv('https://bit.ly/3cIH97A', delimiter=\", \")\n\n# Extract input\
  \ variables (all rows, all columns but last column)\nX = df.values[:, :-1]\n\n#\
  \ Extract output column (all rows, last column)\\\nY = df.values[:, -1]\n\n# Perform\
  \ a simple linear regression\nkfold = KFold(n_splits=3, random_state=7, shuffle=True)\n\
  model = LinearRegression()\nresults = cross_val_score(model, X, Y, cv=kfold)\nprint(results)\n\
  print(\"MSE: mean=%.3f (stdev=%.3f)\" % (results.mean(), results.std()))\n```\n\n\
  ## 训练/测试划分必须是三分之一吗？\n\n我们不需要将数据按三分之一进行折叠。您可以使用 **k 倍验证** 来按任何比例划分数据。通常，1/3、1/5 或\
  \ 1/10 常被用作测试数据的比例，但 1/3 是最常用的。\n\n一般而言，您选择的 _k_ 值需要使测试数据集为该问题提供足够大的样本。您还需要足够多的交替/打乱的测试数据集，以便对未见过的数据的性能提供公平的估计。中等规模的数据集可以使用\
  \ _k_ 值 3、5 或 10。**留一法交叉验证（LOOCV）** 会将每个单独的数据记录作为测试数据集中唯一的样本进行轮换，当整个数据集较小时，这很有帮助。\n\
  \n当您担心模型的方差时，除了进行简单的训练/测试划分或交叉验证外，您还可以使用 **随机折叠验证** 反复打乱并训练/测试划分数据无数次，并汇总测试结果。在\
  \ *示例 5-23* 中，有 10 次迭代，随机抽取 1/3 的数据用于测试，另外 2/3 用于训练。然后将这 10 个测试结果及其标准差平均，以查看测试数据集的表现是否一致。\n\
  \n有什么代价吗？由于我们多次训练回归模型，计算成本非常高。\n\n### 示例 5-23. 对线性回归使用随机折叠验证\n\n```\nimport pandas\
  \ as pd\nfrom sklearn.linear_model import LinearRegression\nfrom sklearn.model_selection\
  \ import cross_val_score, ShuffleSplit\n\ndf = pd.read_csv('https://bit.ly/38XwbeB',\
  \ delimiter=\",\")\n\n# Extract input variables (all rows, all columns but last\
  \ column)\nX = df.values[:, :-1]\n\n# Extract output column (all rows, last column)\\\
  \ \nY = df.values[:, -1]\n\n# Perform a simple linear regression\nkfold = ShuffleSplit(n_splits=10,\
  \ test_size=.33, random_state=7)\nmodel = LinearRegression()\nresults = cross_val_score(model,\
  \ X, Y, cv=kfold)\n\nprint(results)\nprint(\"mean=%.3f (stdev=%.3f)\" % (results.mean(),\
  \ results.std()))\n```\n\n因此，当时间紧迫或数据量太大无法进行统计分析时，训练/测试划分将提供一种方法，用于衡量您的线性回归在未见过的数据上的表现。\n\
  \n## 训练/测试划分并非保证\n\n需要注意的是，仅仅应用机器学习最佳实践（即划分训练数据和测试数据）并不意味着您的模型就会表现良好。您很容易过度调优模型，并通过\
  \ p-hacking 获得良好的测试结果，结果却发现它在现实世界中表现不佳。这就是为什么有时需要留出一个称为 **验证集** 的另一数据集，尤其是在比较不同模型或配置时。这样，您对训练数据所做的调整以获得更好的测试数据性能就不会将信息泄露到训练中。您可以使用验证数据集作为最后一道防线，以查看\
  \ p-hacking 是否导致您在测试数据集上过拟合。\n\n即便如此，您的整个数据集（包括训练、测试和验证）一开始就可能存在偏差，任何划分都无法缓解这一问题。Andrew\
  \ Ng 在与 DeepLearning.AI 和 Stanford HAI 的问答中将此讨论为机器学习的一大问题。他通过一个示例说明了为什么机器学习尚未取代放射科医生（https://spectrum.ieee.org/andrew-ng-xrays-the-ai-hype）。\n\
  \n## 多元线性回归\n\n本章几乎专注于对单个输入变量和单个输出变量进行线性回归。但是，我们在此学到的概念很大程度上也适用于多元线性回归。可以使用 $r^2$、标准误差和置信区间等指标，但随着变量增多，难度会增加。示例\
  \ 5-24 是使用 Scikit-learn 进行的具有两个输入变量和一个输出变量的线性回归示例。\n\n### 示例 5-24. 具有两个输入变量的线性回归\n\
  \n```\nimport pandas as pd\nfrom sklearn.linear_model import LinearRegression\n\n\
  # Load the data\ndf = pd.read_csv('https://bit.ly/2X1HWH7', delimiter=\",\")\n\n\
  # Extract input variables (all rows, all columns but last column)\nX = df.values[:,\
  \ :-1]\n\n# Extract output column (all rows, last column)\\\nY = df.values[:, -1]\n\
  \n# Training\nfit = LinearRegression().fit(X, Y)\n\n# Print coefficients\nprint(\"\
  Coefficients = {0}\".format(fit.coef_))\nprint(\"Intercept = {0}\".format(fit.intercept_))\n\
  print(\"z = {0} + {1}x + {2}y\".format(fit.intercept_, fit.coef_[0],\nfit.coef_[1]))\n\
  ```\n\n当模型因变量过多而开始失去可解释性时，就存在一定的脆弱性，这时机器学习实践开始介入并将模型视为黑盒。我希望您已相信统计学问题不会消失，并且您添加的变量越多，数据就越稀疏。但如果您退后一步，使用相关矩阵分析每对变量之间的关系，并寻求理解每对变量如何交互作用，这只会有助于您创建高效的机器学习模型。\n\
  \n## 结论\n\n本章涵盖了大量内容。我们力求超越对线性回归的肤浅理解，并不再将训练/测试划分作为唯一的验证方式。我想向您展示手术刀（统计学）和链锯（机器学习），以便您能判断哪种最适合特定\n\
  \n\n你遇到的问题。仅在线性回归中就有大量可用的度量和分析方法，我们介绍了其中一些，以了解线性回归是否可靠用于预测。你可能会发现自己需要进行宽泛的近似回归，或使用统计工具仔细分析和梳理数据。你采用哪种方法取决于具体情况，如果你想了解更多Python中可用的统计工具，请查看`statsmodels`库。\n\
  \nhttps://www.statsmodels.org/stable/regression.html\n\n在第6章（涵盖逻辑回归）中，我们将重新探讨R²和统计显著性。我希望本章让你相信，有方法可以有意义地分析数据，而这种投资可以决定项目的成败。\n\
  \n## 练习\n\n此处提供了一个包含两个变量x和y的数据集：https://bit.ly/3C8JzrM。\n\n- 1. 执行简单线性回归，找到最小化损失（平方和）的m和b值。\n\
  - 2. 计算此数据的相关系数和统计显著性（95%置信度）。相关性有用吗？\n- 3. 如果我预测x = 50，y预测值的95%预测区间是多少？\n- 4. 重新开始你的回归并进行训练/测试划分。请随意尝试交叉验证和随机折叠验证。线性回归在测试数据上表现良好且一致吗？为什么或为什么不？\n\
  \n答案在附录B中。\n"
- "# 第 6 章. 逻辑回归与分类\n\n在本章中，我们将介绍**逻辑回归**，这是一种根据一个或多个自变量预测结果概率的回归类型。这反过来可用于**分类**，即预测类别而非我们在线性回归中处理的实数。\n\
  \n我们并不总是有兴趣将变量表示为**连续**型，即它们可以表示无限多个实小数值。在某些情况下，我们宁愿变量是**离散**型，或代表整数、整型或布尔值（1/0，真/假）。逻辑回归在训练时使用的是离散（二进制1或0）或分类数值（即整数）的输出变量。它确实以概率形式输出连续变量，但可以通过阈值将其转换为离散值。\n\
  \n逻辑回归易于实现，并且对异常值和其他数据挑战具有相当的鲁棒性。许多机器学习问题最好用逻辑回归解决，与其他类型的监督机器学习相比，它提供了更多的实用性和性能。\n\
  \n就像我们在第5章介绍线性回归时所做的那样，我们将尝试在统计学和机器学习之间走钢丝，使用两个学科的工具和分析方法。逻辑回归将整合我们从本书中学到的许多概念，从概率到线性回归。\n\
  \n### 理解逻辑回归\n\n想象发生了一起小型工业事故，你正在尝试了解化学物质暴露的影响。你有11名患者接触这种化学物质的时长各不相同（请注意这是编造的数据）。有些人出现了症状（值为1），其他人没有出现症状（值为0）。让我们在图6-1中绘制它们，其中x轴是暴露小时数，y轴是他们是否（1或0）出现了症状。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_291_0.png)\n\n图6-1. 绘制患者在x小时暴露期间是否（1）或没有（0）出现症状。\n\
  \n患者在多长时间后开始出现症状？嗯，很明显在近乎4小时时，我们立即从患者未出现症状（0）转变为出现症状（1）。在图6-2中，我们看到带有预测曲线的相同数据。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_292_0.png)\n\n图6-2. 4小时后，我们看到一个明显的跳跃，患者开始出现症状\n\
  \n对该样本进行粗略分析，我们可以说，暴露时间少于4小时的患者几乎有0%的概率出现症状，而暴露时间大于4小时的患者则有100%的概率。在这两组之间，大约在4小时时，出现症状的概率立即跳跃。\n\
  \n当然，现实世界中情况从来不会如此非黑即白。假设你收集了更多数据，其中范围的中间部分既有出现症状的患者也有未出现症状的患者，如图6-3所示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_293_0.png)\n\
  \n图6-3. 中间既有出现症状（1）的患者也有未出现症状（0）的患者。\n\n解释这一点的方法是，患者出现症状的概率随每小时暴露逐渐增加。让我们用**逻辑函数**来可视化这一点，即一个S形曲线，其中输出变量被压缩在0和1之间，如图6-4所示。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_293_1.png)\n\n图6-4. 将逻辑函数拟合到数据上\n\n由于中间这些点的重叠，患者出现症状没有明确的截止点，而是从0%概率到100%概率（“0”和“1”）的渐进过渡。这个示例演示了**逻辑回归**如何产生一条曲线，表明属于真实类别（患者出现了症状）的概率随自变量（暴露小时数）而变化。\n\
  \n我们可以重新利用逻辑回归，不仅为给定的输入变量预测概率，还可以添加阈值来预测它是否属于该类别。例如，如果我有一个新患者，发现他们已暴露了6小时，我预测他们有71.1%的几率出现症状，如图6-5所示。如果我的阈值是至少50%的概率出现症状，我只需将其分类为将出现症状。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_294_0.png)\n\n图6-5. 我们可以预期暴露6小时的患者有71.1%的可能性出现症状，并且因为这大于50%的阈值，我们预测他们将出现症状\n\
  \n### 执行逻辑回归\n\n那么，我们如何执行逻辑回归呢？让我们先看看逻辑函数，并探索其背后的数学原理。\n\n### 逻辑函数\n\n逻辑函数是一种S形曲线（也称为Sigmoid曲线），对于给定的输入变量集，它生成介于0和1之间的输出变量。由于输出变量介于0和1之间，它可用于表示概率。\n\
  \n下面是一个针对单个输入变量x输出概率y的逻辑函数。\n\n```\ny = \\frac{1.0}{1.0 + e^{-(\\beta_0+\\beta_1\
  \ x)}}\n```\n\n请注意，此公式使用了在第1章中介绍过的欧拉数$e$。$x$变量是自变量/输入变量。$\\beta_0$和$\\beta_1$是我们需要求解的系数。\n\
  \n$\\beta_0$和$\\beta_1$被打包在一个指数中，该指数类似于线性函数，你可能记得它与$y = mx + b$或$y = \\beta_0 +\
  \ \\beta_1x$完全相同。这并非巧合，逻辑回归实际上与线性回归有着密切的关系，我们将在本章后面讨论。$\\beta_0$确实是截距（在简单线性回归中我们称之为$b$），$\\\
  beta_1$是x的斜率（在简单线性回归中我们称之为$m$）。指数中的这个线性函数称为log-odds函数，但目前只需知道整个逻辑函数会生成我们需要的S形曲线，以便在$x$值上输出变化的概率。\n\
  \n要在Python中声明逻辑函数，请使用`math`包中的`exp()`函数来声明$e$的指数，如示例6-1所示。\n\n### 示例6-1. 针对单个自变量的Python中的逻辑函数\n\
  \n```python\nimport math\n\ndef predict_probability(x, b0, b1):\n    p = 1.0 / (1.0\
  \ + math.exp(-(b0 + b1 * x)))\n    return p\n```\n\n让我们绘制图表来看看它是什么样子，并假设$\\beta_0\
  \ = -2.823$和$\\beta_1 = 0.62$。我们将在示例6-2中使用SymPy，输出的图表如图6-6所示。\n\n### 示例6-2. 使用SymPy绘制逻辑函数\n\
  \n```python\nfrom sympy import *\nb0, b1, x = symbols('b0 b1 x')\n\np = 1.0 / (1.0\
  \ + exp(-(b0 + b1 * x)))\n\np = p.subs(b0,-2.823)\np = p.subs(b1, 0.620)\nprint(p)\n\
  \nplot(p)\n```\n\n\n\n\n![](img/8e0dcc1636d032e7728a07e97751e446_296_0.png)\n\n\
  图 6-6. 逻辑函数\n\n在某些教材中，你也可能会看到逻辑函数按如下形式声明。\n\n$$p = \\frac{e^{\\beta_0 + \\beta_1\
  \ x}}{1 + e^{\\beta_0 + \\beta_1 x}}$$\n\n别担心，因为这只是同一个函数的不同代数表达方式。请注意，就像线性回归一样，我们也可以将逻辑回归扩展到多个输入变量（$x_1,\
  \ x_2, ... x_n$），如下面的公式所示。我们只需添加更多的 $\\beta_x$ 系数。\n\n$$p = \\frac{1}{1 + e^{-(\\\
  beta_0 + \\beta_1 x_1 + \\beta_2 x_2 + ... \\beta_n x_n)}}$$\n\n## 逻辑曲线拟合\n\n如何将逻辑曲线拟合到给定的训练数据集？首先，数据可以包含小数、整数和二进制变量的任意混合，但输出变量必须是二进制的（0\
  \ 或 1）。当我们实际进行预测时，输出变量将在 0 到 1 之间，类似于概率。\n\n数据提供了我们的输入和输出变量值，但我们需要求解 $\\beta_0$\
  \ 和 $\\beta_1$ 系数以拟合我们的逻辑函数。回想一下我们在第 5 章中如何使用最小二乘法。然而，这不适用于这里。相反，我们使用最大似然估计，正如其名称所示，最大化给定逻辑曲线输出观测数据的可能性。\n\
  \n要计算最大似然估计，实际上没有像线性回归那样的封闭形式方程。我们仍然可以使用随机梯度下降，或者让库为我们完成。让我们先从库 SciPy 开始，介绍这两种方法。\n\
  \n## 使用 SciPy\n\nSciPy 的好处在于模型通常具有一组标准化的函数和 API，这意味着在许多情况下，你可以复制/粘贴代码，然后在不同模型之间重复使用。在示例\
  \ 6-3 中，你将看到对我们的患者数据执行逻辑回归。如果你将其与第 5 章中的线性回归代码进行比较，你会发现它在导入、分离和拟合数据方面有着几乎相同的代码。主要区别在于，我为模型使用了\
  \ LogisticRegression() 而不是 LinearRegression()。\n\n### 示例 6-3. 使用标准逻辑回归 SciPy\n\n\
  ```python\nimport pandas as pd\nfrom sklearn.linear_model import LogisticRegression\n\
  \n# Load the data\ndf = pd.read_csv('https://bit.ly/33ebs2R', delimiter=\",\")\n\
  \n# Extract input variables (all rows, all columns but last column)\nX = df.values[:,\
  \ :-1]\n\n# Extract output column (all rows, last column)\nY = df.values[:, -1]\n\
  \n# Perform logistic regression\n# Turn off penalty\nmodel = LogisticRegression(penalty='none')\n\
  model.fit(X, Y)\n\n# print beta1\nprint(model.coef_.flatten()) # 0.69267212\n\n\
  # print beta0\nprint(model.intercept_.flatten()) # -3.17576395\n```\n\n## 进行预测\n\
  \n要进行特定预测，请在 SciPy 的模型对象上使用 predict() 和 predict_prob() 函数，无论它是 LogisticRegression\
  \ 还是任何其他类型的分类模型。predict() 函数将预测特定类（例如 True 1.0 或 False 1.0），而 predict_prob() 将输出每个类的概率。\n\
  \n在 SciPy 中运行模型后，我得到的逻辑回归为 $\\beta_0 = -3.17576395$ 和 $\\beta_1 = 0.69267212$。当我绘制它时，它应该看起来不错，如图\
  \ 6-7 所示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_298_0.png)\n\n图 6-7. 绘制 Scikit-learn\
  \ 逻辑回归\n\n这里有几点需要注意。当我创建 `LogisticRegression()` 模型时，我没有指定 `penalty` 参数，该参数选择像 `l1`\
  \ 或 `l2` 这样的正则化技术。虽然这超出了本书的范围，但我在“关于 SciPy 参数”框中包含了简要的见解，以便你手头有有用的参考。\n\n最后，我将对系数和截距使用\
  \ `flatten()`，它们作为多维矩阵输出但只有一个元素。展平意味着将数字矩阵折叠为较少的维度，特别是在元素数量少于维度数量时。例如，我在这里使用 `flatten()`\
  \ 来获取嵌套在二维矩阵中的单个数字，并将其作为单个值提取出来。然后我就得到了我的 $\\beta_0$ 和 $\\beta_1$ 系数。\n\n## 关于 SciPy\
  \ 参数\n\nSciPy 在其回归和分类模型中提供了很多选项。不幸的是，没有足够的篇幅或页面来涵盖它们，因为这不是一本专注于机器学习的书。\n\n然而，SciPy\
  \ 文档写得很好，关于逻辑回归的页面可以在这里找到。\n\nhttps://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html\n\
  \n如果很多术语不熟悉，例如正则化和 l1 及 l2 惩罚，还有其他优秀的 O'Reilly 书籍探讨这些主题。我发现的一本更有帮助的文本是 Aurélien\
  \ Géron 编写的 **Hands-On Machine Learning with Scikit-learn, Keras, and TensorFlow**。\n\
  \nhttps://learning.oreilly.com/library/view/hands-on-machine-learning/9781492032632/\n\
  \n## 使用最大似然和梯度下降\n\n正如我们在本书中一贯所做的，我旨在提供从头构建技术的见解，即使库可以为我们完成。为了自己拟合逻辑回归，有几种方法，但所有方法通常都求助于最大似然估计（MLE）。MLE\
  \ 最大化给定逻辑曲线输出观测数据的可能性。它与平方和不同，但我们仍然可以应用梯度下降或随机梯度下降来求解。\n\n我将尝试简化数学术语，并在此尽量减少线性代数。基本上，其思路是找到\
  \ $\\beta_0$ 和 $\\beta_1$ 系数，使我们的逻辑曲线尽可能贴近这些点，表明它最有可能生成了这些点。如果你回想一下第 2 章我们学习概率时，我们通过将多个事件的概率（或似然）相乘来组合它们。在此应用中，我们正在计算对于给定的逻辑回归曲线，我们会观察到所有这些点的可能性。\n\
  \n应用联合概率的概念，每个患者都有基于拟合逻辑函数表现出症状的可能性，如图 6-8 所示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_299_0.png)\n\
  \n图 6-8. 逻辑曲线上每个输入值都有对应的似然值\n\n我们从逻辑回归曲线上每个点上方或下方获取每个似然值。如果点在逻辑回归曲线下方，我们需要将结果概率从\
  \ 1.0 中减去，因为我们也想最大化负例。\n\n给定系数 $\\beta_0 = -3.17576395$ 和 $\\beta_1 = 0.69267212$，示例\
  \ 6-4 展示了如何在 Python 中计算此数据的联合似然。\n\n### 示例 6-4. 计算给定逻辑回归观察所有点的联合似然\n\n```python\n\
  import math\nimport pandas as pd\npatient_data = pd.read_csv('https://bit.ly/33ebs2R',\
  \ delimiter=\",\").itertuples()\nb0 = -3.17576395\n\nb1 = 0.69267212\n\ndef logistic_function(x):\n\
  \    p = 1.0 / (1.0 + math.exp(-(b0 + b1 * x)))\n    return p\n\n# Calculate the\
  \ joint likelihood\njoint_likelihood = 1.0\n\nfor p in patient_data:\n    if p.y\
  \ == 1.0:\n        joint_likelihood *= logistic_function(p.x)\n    elif p.y == 0.0:\n\
  \        joint_likelihood *= (1.0 - logistic_function(p.x))\n\nprint(joint_likelihood)\
  \ # 4.7911180221699105e-05\n```\n\n这里有一个数学技巧，可以压缩那个 `if` 表达式。正如我们在第 1 章中介绍的，当你将任何数字设为\
  \ 0 次幂时，它将始终为 1。看一下这个公式，并注意指数中真（1）和假（0）情况的处理。\n\njoint likelihood = \\(\\prod_{i=1}^{n}\
  \ \\left( \\frac{1.0}{1.0 + e^{-(\\beta_0 + \\beta_1 x_i)}} \\right)^{y_i} \\times\
  \ \\left( \\frac{1.0}{1.0 + e^{-(\\beta_0 + \\beta_1 x_i)}} \\right)^{1.0-y_i}\\\
  )\n\n要在 Python 中执行此操作，请将该 for 循环内的所有内容压缩到示例 6-5 中：\n\n### 示例 6-5. 不使用 `if` 表达式压缩联合似然计算\n\
  \n```python\nfor p in patient_data:\n    joint_likelihood *= logistic_function(p.x)\
  \ ** p.y * (1.0 - logistic_function(p.x)) ** (1.0 - p.y)\n```\n\n我到底做了什么？请注意，这个表达式有两个部分，一个用于\
  \ \\(y = 1\\)，另一个用于 \\(y = 0\\)。当任何数字被提升到 0 次幂时，结果将为 1。因此，无论 \\(y\\) 是 1 还是 0，都会导致另一侧的相反条件计算为\
  \ 1，并在乘法中没有影响。我们得以表达 `if` 表达式，但完全使用数学表达式来完成。我们无法对使用 `if` 的表达式进行求导，因此这将很有帮助。\n\n\
  请注意，计算机在将多个小小数相乘时可能会不堪重负，这被称为 **浮点下溢**。这意味着随着小数越来越小（在乘法中可能发生这种情况），计算机在跟踪那么多小数位时会遇到限制。有一个巧妙的数学技巧可以绕过这个问题。你可以对每个正在相乘的小数取\
  \ `log()`，然后将它们相加。这要归功于我们在第 1 章中介绍的对数的加法特性。然后你可以调用 `exp()` 函数将总和转换回乘积。\n\n让我们修改代码以使用对数加法而不是乘法。请注意，`log()`\
  \ 函数默认以底数 *e* 为底，虽然任何底数从技术上讲都可以工作，但这样做更可取，因为 *e^x* 是自身的导数，从计算角度来看更高效。\n\n\n\n\n\n\
  ### 示例 6-6. 使用对数相加\n\n```\n# Calculate the joint likelihood\njoint_likelihood =\
  \ 0.0\n\nfor p in patient_data:\n    joint_likelihood += math.log(logistic_function(p.x)\
  \ ** p.y * \\\n    (1.0 - logistic_function(p.x)) ** (1.0 - p.y))\n\njoint_likelihood\
  \ = math.exp(joint_likelihood)\n```\n\n若要将上述 Python 代码表示为数学符号，其表达式如下。\n\n联合似然 =\
  \ \\sum_{i=1}^{n} log \\left( \\left( \\frac{1.0}{1.0 + e^{-(\\beta_0 + \\beta_1\
  \ x_i)}} \\right)^{y_i} \\times \\left( 1.0 - \\frac{1.0}{1.0 + e^{-(\\beta_0 +\
  \ \\beta_1 x_i)}} \\right)^{1.0 - y_i} \\right)\n\n你想计算上述表达式中 \\beta_0 和 \\beta_1\
  \ 的偏导数吗？我想你不想。这太棘手了。天哪，单在 SymPy 中表达那个函数就够呛了！请看示例 6-7。\n\n### 示例 6-7. 在 SymPy 中表达逻辑回归的联合似然\n\
  \n```\njoint_likelihood = Sum(log((1.0 / (1.0 + exp(-(b + m * x(i)))))**y(i) \\\n\
  * (1.0 - (1.0 / (1.0 + exp(-(b + m * x(i))))))**(1-y(i))), (i, 0, n))\n```\n\n所以，我们就让\
  \ SymPy 来帮我们分别对 \\beta_0 和 \\beta_1 求偏导数吧。然后我们会立即编译并用于梯度下降，如示例 6-8 所示。\n\n### 示例\
  \ 6-8. 在逻辑回归中使用梯度下降\n\n```\nfrom sympy import *\nimport pandas as pd\n\npoints =\
  \ list(pd.read_csv(\"https://tinyurl.com/y2cocoo7\").itertuples())\n\nb1, b0, i,\
  \ n = symbols('b1 b0 i n')\nx, y = symbols('x y', cls=Function)\njoint_likelihood\
  \ = Sum(log((1.0 / (1.0 + exp(-(b0 + b1 * x(i))))) ** y(i) \\\n* (1.0 - (1.0 / (1.0\
  \ + exp(-(b0 + b1 * x(i))))) ** (1 - y(i))), (i, 0,\nn))\n\n# Partial derivative\
  \ for m, with points substituted\nd_b1 = diff(joint_likelihood, b1) \\\n.subs(n,\
  \ len(points) - 1).doit() \\\n.replace(x, lambda i: points[i].x) \\\n.replace(y,\
  \ lambda i: points[i].y)\n\n# Partial derivative for m, with points substituted\n\
  d_b0 = diff(joint_likelihood, b0) \\\n.subs(n, len(points) - 1).doit() \\\n.replace(x,\
  \ lambda i: points[i].x) \\\n.replace(y, lambda i: points[i].y)\n\n# compile using\
  \ lambdify for faster computation\nd_b1 = lambdify([b1, b0], d_b1)\nd_b0 = lambdify([b1,\
  \ b0], d_b0)\n\n# Perform Gradient Descent\nb1 = 0.01\nb0 = 0.01\nL = .01\n\nfor\
  \ j in range(10_000) :\n    b1 += d_b1(b1, b0) * L\n    b0 += d_b0(b1, b0) * L\n\
  \nprint(b1, b0)\n# 0.6926693075370812 -3.175751550409821\n```\n\n在对 \\(\\beta_0\\\
  ) 和 \\(\\beta_1\\) 计算偏导数后，我们代入 \\(x\\) 和 \\(y\\) 的值以及数据点数量 \\(n\\)。然后我们使用 `lambdify()`\
  \ 编译导数函数以提高效率（它在幕后使用 NumPy）。之后，我们执行梯度下降，就像在第 5 章中所做的那样，但由于我们试图最大化而非最小化，因此我们将每次调整加到\
  \ \\(\\beta_0\\) 和 \\(\\beta_1\\) 上，而不是像最小二乘法那样相减。\n\n如示例 6-8 所示，我们得到 \\(\\beta_0\
  \ = -3.17575\\) 和 \\(\\beta_1 = 0.692667\\)。这与我们之前在 SciPy 中得到的系数值高度可比。\n\n正如在第 5\
  \ 章中学到的，我们也可以使用随机梯度下降，在每次迭代时只采样一条或少量记录。这将提升计算速度和性能，并防止过拟合。此处无需再次赘述，我们将继续往下。\n\n\
  ## 多元逻辑回归\n\n让我们尝试一个在多个输入变量上使用逻辑回归的示例。以下是来自一个虚构数据集的少量记录样本，该数据集包含一些员工保留数据（完整数据集在此：https://bit.ly/3aqsOMO）。\n\
  \n| 性别 | 年龄 | 晋升次数 | 雇佣年限 | 是否离职 |\n|---|---|---|---|---|\n| 1 | 32 | 3 | 7 | 0\
  \ |\n| 1 | 34 | 2 | 5 | 0 |\n| 1 | 29 | 2 | 5 | 1 |\n| 0 | 42 | 4 | 10 | 0 |\n|\
  \ 1 | 43 | 4 | 10 | 0 |\n\n图 6-9. 员工保留数据样本\n\n这个数据集中有 54 条记录。假设我们想用它来预测其他员工是否会离职，这里可以使用逻辑回归（尽管这一切都不是个好主意，我会在后面详细说明原因）。还记得我们可以支持不止一个输入变量，如下面公式所示。\n\
  \n\\( y = \\frac{1}{1 + e^{-(\\beta_0 + \\beta_1 x_1 + \\beta_2 x_2 + ... \\beta_n\
  \ x_n)}} \\)\n\n我将为变量 `sex`、`age`、`promotions` 和 `years_employed` 中的每一个创建 \\(\\\
  beta\\) 系数。输出变量 `did_quit` 是二进制的，它将驱动我们要预测的逻辑回归结果。由于我们处理的是多维数据，可视化我们的逻辑曲线所代表的曲面超平面会很困难。因此我们将避开可视化。\n\
  \n让我们使其更有趣。我们将使用 Scikit-learn，但会制作一个交互式 shell 来测试员工。以下是示例 6-9 中的代码，运行后将执行逻辑回归，然后我们可以输入新员工的数据来预测他们是否会离职。会有什么问题？我相信没事。我们只是根据人们的个人属性进行预测并据此做出决定。我相信一切都会很好。\n\
  \n（如果还不清楚，我在说反话）。\n\n### 示例 6-9. 对员工数据进行多元逻辑回归\n\n```\nimport pandas as pd\nfrom\
  \ sklearn.linear_model import LogisticRegression\n\nemployee_data = pd.read_csv(\"\
  https://tinyurl.com/y6r7qjrp\")\n\n# grab independent variable columns\ninputs =\
  \ employee_data.iloc[:, :-1]\n\n# grab dependent \"did_quit\" variable column\n\
  output = employee_data.iloc[:, -1]\n\n# build logistic regression\nfit = LogisticRegression(penalty='none').fit(inputs,\
  \ output)\n\n# Print coefficients:\nprint(\"COEFFICIENTS: {0}\".format(fit.coef_.flatten()))\n\
  print(\"INTERCEPT: {0}\".format(fit.intercept_.flatten()))\n\n# Interact and test\
  \ with new employee data\ndef predict_employee_will_stay(sex, age, promotions, years_employed):\n\
  \    prediction = fit.predict([[sex, age, promotions, years_employed]])\n    probabilities\
  \ = fit.predict_proba([[sex, age, promotions, years_employed]])\n    if prediction\
  \ == [[1]]:\n        return \"WILL LEAVE: {0}\".format(probabilities)\n    else:\n\
  \        return \"WILL STAY: {0}\".format(probabilities)\n\n# Test a prediction\n\
  while True:\n    n = input(\"Predict employee will stay or leave {sex},{age},{promotions},{years\
  \ employed}: \")\n    (sex, age, promotions, years_employed) = n.split(\",\")\n\
  \    print(predict_employee_will_stay(int(sex), int(age), int(promotions),\n   \
  \ int(years_employed)))\n```\n\n图 6-10 显示了员工是否被预测会离职的结果。该员工性别为 \"1\"，年龄 34 岁，晋升过\
  \ 1 次，在公司工作了 5 年。果然，预测结果是 “WILL LEAVE”。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_304_0.png)\n\
  \n图 6-10. 对一名 34 岁、有 1 次晋升和 5 年工龄的员工是否会离职进行预测\n\n请注意，`predict_proba()` 函数会输出两个值，第一个是\
  \ 0（假）的概率，第二个是 1（真）的概率。\n\n你会注意到，性别、年龄、晋升次数和工龄的系数按此顺序显示。根据系数的权重，你可以看出性别和年龄在预测中起的作用很小（它们的权重都接近\
  \ 0）。然而，`promotions` 和 `years_employed` 分别有 -2.504 和 .97 的显著权重。关于这个玩具数据集的一个秘密：我编造了它，使得员工如果大约每\
  \ 2 年得不到一次晋升就会离职。果然，我的逻辑回归捕捉到了这个模式，你也可以用其他员工来试试。但是，如果你超出了训练数据的范围，预测可能会开始失效（例如，输入一名\
  \ 70 岁且 3 年未获晋升的员工，很难说这个模型会如何，因为它没有该年龄段的数据）。\n\n当然，现实生活并不总是这么干净利落。一名在一家公司工作了 8 年却从未晋升的员工，可能对自己的角色感到满意，短期内不太可能离职。如果是这种情况，年龄等变量可能会起作用并获得权重。然后，当然，我们可能会开始担心其他相关变量没有被\n\
  \n\n\ncaptured. See the warning callout Be Careful Making Classifications on People!\
  \ to learn more.\n\n## 谨慎对人进行分类！\n\n自毁前脚最快、最稳妥的方式，就是收集关于人群的数据，并随意用其进行预测。不仅可能引发数据隐私问题，如果模型被发现具有歧视性，还可能引发法律和公关问题。种族和性别等输入变量可能会在机器学习训练中被赋予权重。此后，不被雇佣或贷款被拒等不良后果将施加于这些人群。更极端的应用包括被监控系统错误标记或被拒绝刑事假释。还要注意，通勤时间等看似无害的变量也被发现与歧视性变量相关。\n\
  \nAt the time of writing, a number of articles have been citing machine learning\
  \ discrimination as an issue.\nhttps://www.theregister.com/2021/07/16/facial_recognition_failure/\n\
  https://www.nytimes.com/2020/06/24/technology/facial-recognition-arrest.html\n\n\
  As data privacy laws continue to evolve, it is advisable to err on the side of caution\
  \ and engineer personal data carefully. Think about what automated decisions will\
  \ be propagated and how that can cause harm. Sometimes it is better to just leave\
  \ a “problem” alone and keep doing it manually, rather than\n\nFinally on this employee\
  \ retention example, think about where this data came from. Yes, I made up this\
  \ dataset but in the real world you always want to question what process created\
  \ the data. Over what period of time did this sample come from? How far back do\
  \ we go looking for employees who quit? What constitutes an employee who stayed?\
  \ Are they current employees at this point in time? How do we know they are not\
  \ about to quit, making them a false negative? Data scientists easily fall into\
  \ traps only analyzing what data says, but not questioning where it came from and\
  \ what assumptions are built into it.\n\nThe best way to get answers to these questions\
  \ is understand what the predictions are being used for. Is it to decide when to\
  \ give people promotions to retain them? Can this create a circular bias promoting\
  \ people with a set of attributes? Will that bias be re-affirmed when those promotions\
  \ start becoming the new training data?\n\nThese are all important questions, and\
  \ perhaps even inconvenient ones that cause unwanted scope creep into the project.\
  \ If this scrutiny is not welcomed by your team or leadership on a project, consider\
  \ empowering yourself with a different role where curiosity becomes a strength.\n\
  \n## 理解对数几率（Log-Odds）\n\nAt this point, it is time to discuss the logistic regression\
  \ and what it is mathematically made of. This can be a bit dizzying so take your\
  \ time here. If you get overwhelmed you can always revisit this section later.\n\
  \nStarting in the 1900s, it has always been an interest to mathematicians to take\
  \ a linear function and scale its output to fall between 0 and 1, and therefore\
  \ be useful for predicting probability. The log-odds, also called the logit function,\
  \ lends itself to logistic regression for this purpose.\n\nRemember earlier I pointed\
  \ out the exponent value \\(\\beta_0 + \\beta_1x\\) is a linear function? Look below\
  \ at our logistic function again:\n\n$$p = \\frac{1.0}{1.0 + e^{-(\\beta_0+\\beta_1x)}}$$\n\
  \nThis linear function being raised to \\(e\\) is known as the **对数几率（log-odds）**\
  \ function, which takes the logarithm of the odds for the event of interest. Your\
  \ response might be “Wait, I don’t see any \\(\\log()\\) or odds. I just see a linear\
  \ function!” Bear with me, I will show the hidden math.\n\nAs an example, let’s\
  \ use our logistic regression from earlier where \\(\\beta_0 = -3.17576395\\) and\
  \ \\(\\beta_1 = 0.69267212\\). What is the probability of showing symptoms after\
  \ 6 hours, where \\(x = 6\\)? We already know how to do this: plug these values\
  \ into our logistic function.\n\n$$p = \\frac{1.0}{1.0 + e^{(-3.17576395+0.69267212(6))}}\
  \ = 0.727161542928554$$\n\nWe plug in these values and output a probability of .72716.\
  \ But let’s look at this from an odds perspective. Recall in Chapter 2 we learned\
  \ how to calculate odds from a probability:\n\n$$\\text{odds} = \\frac{p}{1 - p}$$\n\
  \n$$\\text{odds} = \\frac{.72716}{1 - .72716} = 2.66517246407876$$\n\nSo at 6 hours,\
  \ a patient is 2.66517 times more likely to show symptoms than not show symptoms.\n\
  \nWhen we wrap the odds function in a natural logarithm (a logarithm with base \\\
  (e\\)), we call this the **logit 函数**. The output of this formula is what we call\
  \ the **对数几率（log-odds）**, named... shockingly... because we take the logarithm of\
  \ the odds.\n\n$$\\text{logit} = log\\big(\\frac{p}{1 - p}\\big)$$\n\n$$\\text{logit}\
  \ = log\\big(\\frac{.72716}{1 - .72716}\\big) = 0.98026877$$\n\nOur log-odds at\
  \ 6 hours is 0.9802687. What does this mean and why do we care? When we are in “log-odds\
  \ land” it is easier to compare one set of odds against another. We treat anything\
  \ greater than 0 as favoring odds an event will happen, whereas anything less than\
  \ 0 is against an event. A log-odds of -1.05 is linearly the same distance from\
  \ 0 as 1.05. In plain odds though, the equivalents are .3499 and 2.857 respectively,\
  \ which is not as interpretable. That is the convenience of log-odds.\n\n### 几率与对数（ODDS\
  \ AND LOGS）\n\nLogarithms and odds have an interesting relationship. Odds are against\
  \ an event when it is between 0.0 and 1.0, but anything greater than 1.0 favors\
  \ the event and extends into positive infinity. This lack of symmetry is awkward.\
  \ However, logarithms rescale an odds so that it is completely linear, where a log-odds\
  \ of 0.0 means fair odds. A log-odds of -1.05 is linearly the same distance from\
  \ 0 as 1.05, and thus make comparing odds much easier.\n\nJosh Starmer has a great\
  \ video talking about this relationship between odds and logs here:\nhttps://www.youtube.com/watch?v=ARfXDSkQf1Y\n\
  \nRecall I said the linear function in our logistic regression formula β₀ + β₁x\
  \ is our log-odds function. Check this out:\n\n```\nlog odds = β₀ + β₁x\n\nlog odds\
  \ = -3.17576395 + 0.69267212(6)\n\nlog odds = 0.98026877\n```\n\nIt’s the same value\
  \ 0.98026877 as our previous calculation, the odds of our logistic regression at\
  \ x = 6 and then taking the `log()` of it! So what is the link? What ties all this\
  \ together? Given a probability from a logistic regression p and input variable\
  \ x, it is this:\n\n```\nlog (p / (1 - p)) = β₀ + β₁x\n```\n\nLet’s plot the log-odds\
  \ line alongside the logistic regression, as shown in Figure 6-11.\n\n![](img/8e0dcc1636d032e7728a07e97751e446_308_0.png)\n\
  \nFigure 6-11. The log-odds line is converted into a logistic function that outputs\
  \ a probability.\n\nEvery logistic regression is actually backed by a linear function,\
  \ and that linear function is a log-odds function. Note in Figure 6-11 that when\
  \ the log-odds is 0.0 on the line, then the probability of the logistic curve is\
  \ at 0.5. This makes sense because when our odds are fair at 1.0, the probability\
  \ is going to be 0.50 as shown in the logistic regression, and the log-odds are\
  \ going to be 0 as shown by the line.\n\nAnother benefit we get looking at the logistic\
  \ regression from an odds perspective is we can compare the effect between one x\
  \ value and another. Let’s say I want to understand how much my odds change between\
  \ 6 hours and 8 hours of exposure to the chemical. I can take the odds at 6 hours\
  \ and then 8 hours, and then ratio the two odds against each other in an **几率比（odds\
  \ ratio）**. This is not to be confused with a plain odds which, yes is a ratio,\
  \ but it is not an odds ratio.\n\nLet's first find the probabilities of symptoms\
  \ for 6 hours and 8 hours respectively.\n\n\\( p = \\frac{1.0}{1.0 + e^{-(\\beta_0+\\\
  beta_1 x)}} \\)\n\n\\( p_6 = \\frac{1.0}{1.0 + e^{(-3.17576395+0.69267212(6))}}\
  \ = 0.7271615429285554 \\)\n\n\\( p_8 = \\frac{1.0}{1.0 + e^{(-3.17576395+0.69267212(8))}}\
  \ = 0.914167258137741 \\)\n\nNow let's convert those into odds, which we will declare\
  \ as \\( o_x \\) .\n\n\\( o = \\frac{p}{1 - p} \\)\n\n\\( o_6 = \\frac{0.7271615429285554}{1\
  \ - 0.7271615429285554} = 2.66517246407876 \\)\n\n\\( o_8 = \\frac{0.914167258137741}{1\
  \ - 0.914167258137741} = 10.6505657200694 \\)\n\nFinally, set the two odds against\
  \ each other as an odds ratio, where the odds for 8 hours is the numerator and the\
  \ odds for 6 hours is in the denominator. We get a value of approximately 3.996,\
  \ meaning that our odds of showing symptoms increases by nearly a factor of 4 with\
  \ an extra 2 hours of exposure.\n\n\\(\\text{odds ratio} = \\frac{10.6505657200694}{2.66517246407876}\
  \ = 3.99620132040906 \\)\n\nYou will find this odds ratio value of 3.996 holds across\
  \ any two hour range, like 2 hours to 4 hours, 4 hours to 6 hours, 8 hours to 10\
  \ hours... etc. As long as its a 2-hour gap you will find that odds ratio stays\
  \ consistent. It will differ for other range lengths.\n\n## R-Squared\n\nWe covered\
  \ quite a few statistical metrics for linear regression in Chapter 5, and we will\
  \ try to do the same for logistic regression. We still worry about many of the same\
  \ problems as in linear regression, including overfitting and variance. As a matter\
  \ of fact, we can borrow and adapt several metrics from linear regression and apply\
  \ them to logistic regression. Let's start with \\( R^2 \\).\n\n\n\n\n就像线性回归一样，给定的逻辑回归也有一个\
  \ $R^2$。如果你还记得第 5 章，$R^2$ 表示给定的自变量在多大程度上解释了因变量。将此应用到我们的化学暴露问题中，衡量化学暴露小时数在多大程度上解释症状出现是有道理的。\n\
  \n关于在逻辑回归中计算 $R^2$ 的最佳方法并没有真正的共识，但一种称为 McFadden's Pseudo $R^2$ 的流行技术密切模拟线性回归中使用的\
  \ $R^2$。我们将在以下示例中使用此技术，公式如下：\n\n$$ R^2 = \\frac{(\\text{对数似然}) - (\\text{拟合的对数似然})}{(\\\
  text{对数似然})} $$\n\n我们将学习如何计算“拟合的对数似然”和“对数似然”，从而计算 $R^2$。\n\n这里不能像线性回归那样使用残差，但可以如图\
  \ 6-12 所示，将结果投影回逻辑曲线，并查找其介于 0.0 和 1.0 之间的对应似然值。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_310_0.png)\n\
  \n图 6-12. 将输出值投影回逻辑曲线\n\n然后可以对这些似然值分别取 log() 并将它们相加。这将是拟合的对数似然。就像计算最大似然时所做的那样，我们将通过从\
  \ 1.0 中减去其值来转换“false”似然值。\n\n### 示例 6-10. 计算拟合的对数似然\n\n```python\nfrom math import\
  \ log, exp\nimport pandas as pd\n\npatient_data = pd.read_csv('https://bit.ly/33ebs2R',\
  \ delimiter=\",\").itertuples()\n\nb0 = -3.17576395\nb1 = 0.69267212\n\ndef logistic_function(x):\n\
  \    p = 1.0 / (1.0 + exp(-(b0 + b1 * x)))\n    return p\n\n# Sum the log-likelihoods\n\
  log_likelihood_fit = 0.0\n\nfor p in patient_data:\n    if p.y == 1.0:\n       \
  \ log_likelihood_fit += log(logistic_function(p.x))\n    elif p.y == 0.0:\n    \
  \    log_likelihood_fit += log(1.0 - logistic_function(p.x))\n\nprint(log_likelihood_fit)\
  \ # -9.946161673231583\n```\n\n使用一些巧妙的二进制乘法和 Python 推导式，我们可以将该 `for` 循环和 `if` 表达式合并为一行，返回\
  \ `log_likelihood_fit`。与我们在最大似然公式中所做的类似，我们可以在 true 和 false 情况之间使用一些二进制减法，从数学上消除其中之一。在此例中，我们乘以\
  \ 0，因此相应地将 true 或 false 情况中的一个（而非两者）应用于求和。\n\n### 示例 6-11. 将对数似然逻辑合并为单行\n\n```python\n\
  log_likelihood_fit = sum(log(logistic_function(p.x)) * p.y +\n    log(1.0 - logistic_function(p.x))\
  \ * (1.0 - p.y)\n    for p in patient_data)\n```\n\n如果用数学符号表示拟合的似然，则如下所示。请注意 f(x_i)\
  \ 是给定输入变量 x_i 的逻辑函数。\n\n$$\nlog\\ likelihood\\ fit = \\sum_{i=1}^{n} (log(f(x_i))\
  \ \\times y_i) + (log(1.0 - f(x_i)) \\times (1 - y_i))\n$$\n\n如示例 6-10 和示例 6-11\
  \ 中计算的那样，拟合的对数似然为 -9.9461。计算 $R^2$ 还需要一个数据点：即不使用任何输入变量、仅使用真实病例数除以所有病例数（实际只保留截距）来估算的对数似然。请注意，可以通过将所有\
  \ y 值相加 $\\sum y_i$ 来统计有症状病例数，因为只有 1 而不是 0 会计入总和。公式如下：\n\n$$\nlog\\ likelihood =\
  \ \\frac{\\sum y_i}{n} \\times y_i + \\left(1 - \\frac{\\sum y_i}{n}\\right) \\\
  times (1 - y_i)\n$$\n\n示例 6-12 中应用了此公式的展开式 Python 等价代码如下。\n\n### 示例 6-12. 患者的对数似然\n\
  \n```python\nimport pandas as pd\nfrom math import log, exp\n\npatient_data = list(pd.read_csv('https://bit.ly/33ebs2R',\n\
  delimiter=\",\").itertuples())\n\nlikelihood = sum(p.y for p in patient_data) /\
  \ len(patient_data)\n\nlog_likelihood = 0.0\n\nfor p in patient_data:\n    if p.y\
  \ == 1.0:\n        log_likelihood += log(likelihood)\n    elif p.y == 0.0:\n   \
  \     log_likelihood += log(1.0 - likelihood)\n\nprint(log_likelihood) # -14.341070198709906\n\
  ```\n\n为了整合此逻辑并反映公式，我们可以将该 `for` 循环和 `if` 表达式压缩为一行，使用一些二进制乘法逻辑来处理 true 和 false 情况：\n\
  \n### 示例 6-13. 将对数似然合并为单行\n\n```python\nlog_likelihood = sum(log(likelihood) * p.y\
  \ + log(1.0 - likelihood) * (1.0 - p.y) \\\n    for p in patient_data)\n```\n\n\
  最后，只需代入这些值即可得到 $R^2$：\n\n![](img/8e0dcc1636d032e7728a07e97751e446_312_0.png)\n\n\
  以下是示例 6-14 中显示的 Python 代码，用于完整计算 $R^2$。\n\n### 示例 6-14. 计算逻辑回归的 $R^2$\n\n```python\n\
  import pandas as pd\nfrom math import log, exp\n\npatient_data = list(pd.read_csv('https://bit.ly/33ebs2R',\n\
  delimiter=\",\").itertuples())\n\n# Declare fitted logistic regression\nb0 = -3.17576395\n\
  b1 = 0.69267212\n\ndef logistic_function(x):\n    p = 1.0 / (1.0 + exp(-(b0 + b1\
  \ * x)))\n    return p\n\n# calculate the log likelihood of the fit\nlog_likelihood_fit\
  \ = sum(log(logistic_function(p.x)) * p.y +\n    log(1.0 - logistic_function(p.x))\
  \ * (1.0 - p.y)\n    for p in patient_data)\n# calculate the log likelihood without\
  \ fit\nlikelihood = sum(p.y for p in patient_data) / len(patient_data)\nlog_likelihood\
  \ = sum(log(likelihood) * p.y + log(1.0 - likelihood) * (1.0 - p.y) \\\n    for\
  \ p in patient_data)\n# calculate R-Square\nr2 = (log_likelihood - log_likelihood_fit)\
  \ / log_likelihood\nprint(r2)  # 0.306456105756576\n```\n\n好的，我们得到 $R^2 = 0.306456$，那么化学暴露小时数是否能解释某人是否出现症状？如我们在第\
  \ 5 章线性回归中所学，拟合度差的 $R^2$ 更接近 0.0，拟合度高的则更接近 1.0。因此我们可以得出结论：暴露小时数对预测症状的效果平平，因为 $R^2$\
  \ 为 0.30645。除了暴露时间之外，一定还有其他变量有助于更好地预测某人是否会出现症状。这很合理，因为在我们观察到的大多数数据中，出现症状和未出现症状的患者混杂程度很高，如图\
  \ 6-13 所示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_313_0.png)\n\n图 6-13. 我们的数据\
  \ $R^2$ 仅为 0.30645（效果平平），因为曲线中间存在很大方差\n\n但如果我们的数据存在清晰的分界，其中 1 和 0 结果像图 6-14 所示那样被清晰分开，那么我们将拥有完美的\
  \ $R^2 = 1.0$。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_314_0.png)\n\n图 6-14.\
  \ 此逻辑回归的 $R^2$ 为完美的 1.0，因为暴露小时数预测的结果存在清晰分界。\n\n## P 值\n\n就像线性回归一样，仅仅因为有了 R^2 并不意味着分析结束。我们需要调查看到这些数据的可能性是由于巧合，而非实际关系。这意味着我们需要一个\
  \ P 值。\n\n为此，我们需要学习一种称为卡方分布（Chi-Square Distribution，标注为 chi^2 Distribution）的新概率分布。它是连续的，并在统计学的多个领域中使用，包括这个领域！\n\
  \n如果将标准正态分布（均值为 0，标准差为 1）中的每个值平方，则可得到自由度为 1 的 chi^2 分布。就我们的目的而言，自由度将取决于逻辑回归中参数 n\
  \ 的数量，即 n - 1。不同自由度的示例见图 6-15。由于我们有两个参数（暴露小时数和是否出现症状），因此自由度为 1，因为 2 - 1 = 1。\n\n\
  ![](img/8e0dcc1636d032e7728a07e97751e446_315_0.png)\n\n图 6-15. 自由度不同的 $\\chi^2$\
  \ 分布。\n\n我们需要先前 $R^2$ 小节中计算的拟合对数似然和对数似然。用于查找的 $\\chi^2$ 值公式如下：\n\n$$\n\\chi^2 =\
  \ 2 (\\text{拟合的对数似然}) - (\\text{对数似然})\n$$\n\n\n然后我们取该值，并从 \\(\\chi^2\\) 分布中查找概率。这将给出我们的\
  \ p 值。\n\np-value = chi(2((log likelihood fit) - (log likelihood)))\n\n这是给定拟合逻辑回归的\
  \ p 值。我们使用 SciPy 的 `chi2` 模块来使用卡方分布。\n\n### 示例 6-15. 计算给定逻辑回归的 p 值\n\n```\nimport\
  \ pandas as pd\nfrom math import log, exp\nfrom scipy.stats import chi2\n\npatient_data\
  \ = list(pd.read_csv('https://bit.ly/33ebs2R',\ndelimiter=\",\")).itertuples()\n\
  \n# Declare fitted logistic regression\nb0 = -3.17576395\nb1 = 0.69267212\n\ndef\
  \ logistic_function(x):\n    p = 1.0 / (1.0 + exp(-(b0 + b1 * x)))\n    return p\n\
  \n# calculate the log likelihood of the fit\nlog_likelihood_fit = sum(log(logistic_function(p.x))\
  \ * p.y +\n    log(1.0 - logistic_function(p.x)) * (1.0 - p.y)\n    for p in patient_data)\n\
  \n# calculate the log likelihood without fit\nlikelihood = sum(p.y for p in patient_data)\
  \ / len(patient_data)\n\nlog_likelihood = sum(log(likelihood) * p.y + log(1.0 -\
  \ likelihood) * (1.0 - p.y) \\\n    for p in patient_data)\n\n# calculate p-value\n\
  chi2_input = 2 * (log_likelihood_fit - log_likelihood)\np_value = chi2.pdf(chi2_input,\
  \ 1) # 1 degree of freedom (n - 1)\n\nprint(p_value) # 0.0016604875618753787\n```\n\
  \n所以我们得到的 p 值为 0.00166，如果显著性阈值为 .05，我们就说该数据在统计上具有显著性，而非随机偶然。\n\n## 训练/测试划分\n\n如第\
  \ 5 章（线性回归）中所述，我们可以使用训练/测试划分来验证机器学习算法。这是评估逻辑回归性能的更“机器学习”方法。虽然依赖 \\(R^2\\) 和 p 值等传统统计指标是个好主意，但在处理更多变量时，这变得不太实际。这时训练/测试划分再次派上用场。为了回顾，图\
  \ 6-16 可视化了一种交替测试数据集的 3 折交叉验证。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_317_0.png)\n\
  \n图 6-16. 3 折交叉验证，将数据集的每一第三部分作为测试数据集。\n\n在示例 6-16 中，我们在员工保留数据集上执行逻辑回归，但将数据分为三等份。然后我们将每一第三部分作为测试数据。最后，用平均值和标准差汇总三个准确率。\n\
  \n### 示例 6-16. 使用 3 折交叉验证执行逻辑回归\n\n```\nimport pandas as pd\nfrom sklearn.linear_model\
  \ import LogisticRegression\nfrom sklearn.model_selection import KFold, cross_val_score\n\
  \n# Load the data\ndf = pd.read_csv(\"https://tinyurl.com/y6r7qjrp\", delimiter=\"\
  ,\")\n\nX = df.values[:, :-1]\nY = df.values[:, -1]\n\n# \"random_state\" is the\
  \ random seed, which we fix to 7\nkfold = KFold(n_splits=3, random_state=7, shuffle=True)\n\
  model = LogisticRegression(penalty='none')\nresults = cross_val_score(model, X,\
  \ Y, cv=kfold)\n\nprint(\"Accuracy Mean: %.3f (stdev=%.3f)\" % (results.mean(),\
  \ results.std()))\n```\n\n我们还可以使用随机折叠验证、留一法交叉验证以及第 5 章中执行的所有其他折叠变体。废话不多说，让我们来谈谈为什么准确率是分类的糟糕指标。\n\
  \n## 混淆矩阵\n\n假设一个模型观察到名为“Michael”的人辞职了。将姓和名作为输入变量捕获的理由确实值得商榷，因为有人的姓名是否会影响其是否辞职存疑。然而，为了简化示例，我们就假设如此。然后模型预测任何名为“Michael”的人都会辞职。\n\
  \n现在正是准确率失效的地方。我有 100 名员工，其中一名叫“Michael”，另一名叫“Samantha”。Michael 被错误地预测会辞职，而实际上是\
  \ Samantha 辞职了。我的模型准确率是多少？是 98%，因为在 100 名员工中只有 2 个预测错误，如图 6-17 所示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_319_0.png)\n\
  \n实际：此员工辞职 预测错误 但我仍然 98% 准确！\n\n预测：此员工名为 \"Michael\" 此员工将辞职\n\n图 6-17. 名为 \"Michael\"\
  \ 的员工被预测会辞职，但实际上是另一名员工辞职，这使我们获得了 98% 的准确率\n\n特别是对于不平衡数据，其中感兴趣事件（例如员工辞职）很少见，准确率指标对分类问题具有极大的误导性。如果您曾有供应商、顾问或数据科学家试图以准确率为卖点向您销售分类系统，请要求提供混淆矩阵。\n\
  \n一个 **混淆矩阵** 是一个网格，它将预测与实际结果进行对比，显示真正例、真负例、假正例（I 类错误）和假负例（II 类错误）。图 6-18 展示了一个混淆矩阵。\n\
  \n| | 实际离职 (真) | 实际留任 (假) |\n|---|---|---|\n| 预测将离职 (真) | 0 | 1 |\n| 预测将留任 (假) |\
  \ 1 | 98 |\n\n图 6-18. 一个简单的混淆矩阵\n\n通常，我们希望对角线值（从左上角到右下角）更高，因为这些反映了正确的分类。我们希望评估有多少被预测会离职的员工确实离职了（真正例）。相反，我们也希望评估有多少被预测会留任的员工确实留任了（真负例）。\n\
  \n其他单元格反映错误预测，即被预测会离职的员工最终留任（假正例），以及被预测会留任的员工最终离职（假负例）。\n\n我们需要做的是将准确率指标拆分为更具体的准确率指标，针对混淆矩阵的不同部分。让我们来看看图\
  \ 6-19，它添加了一些有用的指标。\n\n| | 实际离职 | 实际留任 | | |\n|---|---|---|---|---|\n| 预测将离职 | 0\
  \ (TP) | 1 (FN) | 灵敏度<br>\\(\\frac{TP}{TP+FN} = \\frac{0}{0+1} = 0\\) | F1 分数<br>\\\
  (\\frac{2 \\cdot Precision \\cdot Recall}{Precision + Recall} = 未定义\\) |\n| 预测将留任\
  \ | 1 (FP) | 98 (TN) | 特异度<br>\\(\\frac{TN}{TN+FP} = \\frac{98}{98+1} = .989\\)\
  \ | |\n| | 精确率<br>\\(\\frac{TP}{TP+FP} = \\frac{0}{0+1} = 0\\) | 阴性预测值<br>\\(\\\
  frac{TN}{TN+FN} = \\frac{98}{98+1} = .989\\) | 准确率<br>\\(\\frac{TP+TN}{TP+TN+FP+FN}\
  \ = \\frac{98+0}{0+98+1+1} = .98\\) | |\n\n图 6-19. 向混淆矩阵添加有用指标\n\n从混淆矩阵中，我们可以推导出除准确率之外的各种有用指标。我们可以轻松看出，精确率（正预测的准确性）和灵敏度（识别出的正例比例）均为\
  \ 0，这意味着该机器学习模型在正例预测上完全失败。\n\n### 示例 6-17. 在 SciPy 中为测试数据集创建混淆矩阵\n\n```\nimport\
  \ pandas as pd\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics\
  \ import confusion_matrix\nfrom sklearn.model_selection import train_test_split\n\
  \n# Load the data\ndf = pd.read_csv('https://bit.ly/3cManTi', delimiter=\",\")\n\
  # Extract input variables (all rows, all columns but last column)\nX = df.values[:,\
  \ :-1]\n# Extract output column (all rows, last column)\\\nY = df.values[:, -1]\n\
  model = LogisticRegression(solver='liblinear')\nX_train, X_test, Y_train, Y_test\
  \ = train_test_split(X, Y, test_size=.33,\nrandom_state=10)\nmodel.fit(X_train,\
  \ Y_train)\nprediction = model.predict(X_test)\n\"\"\"\nThe confusion matrix evaluates\
  \ accuracy within each category.\n[truepositives falsenegatives]\n[falsepositives\
  \ truenegatives)]\nThe diagonal represents correct predictions,\nso we want those\
  \ to be higher\n\"\"\"\nmatrix = confusion_matrix(y_true=Y_test, y_pred=prediction)\n\
  print(matrix)\n```\n\n## 贝叶斯定理与混淆矩阵\n\n你还记得第 2 章中的贝叶斯定理吗？你可以使用贝叶斯定理引入外部信息，以进一步验证混淆矩阵中的发现。图\
  \ 6-20 显示了 1000 名接受疾病检测的患者的混淆矩阵。\n\n\n\n\n\n| | 检测呈阳性 | 检测呈阴性 |\n|---|---|---|\n\
  | 有风险 | 198 | 2 |\n| 无风险 | 50 | 750 |\n\n图 6-20. 医学检测的混淆矩阵，用于识别疾病\n\n我们被告知，对于有健康风险的患者，99%\
  \ 会被成功识别（灵敏度）。使用混淆矩阵，我们可以看到在数学上这是成立的。\n\n```\nsensitivity = \\frac{198}{198 + 2}\
  \ = .99\n```\n\n但是如果我们颠倒条件呢？检测呈阳性的人中，有多少人有健康风险（精确率）？虽然我们在颠倒条件概率，但不需要在这里使用贝叶斯定理，因为混淆矩阵为我们提供了所有需要的数字。\n\
  \n```\nprecision = \\frac{198}{198 + 50} = .798\n```\n\n好吧，79.8% 还不算糟糕，这是检测呈阳性的人中实际患病的比例。但请问问自己……我们对数据做了什么假设？它能代表总体吗？\n\
  \n我们快速研究了一下，发现总体中实际只有 1% 的人患有这种疾病。这里有个使用贝叶斯定理的机会。我们可以考虑总体中实际患病的比例，并将其纳入混淆矩阵的发现中。我们随后发现了一件重要的事情。\n\
  \n```\nP (At Risk if Positive) = \\frac{P(Positive if At Risk) \\times P(At Risk)}{P(Positive)}\n\
  \nP (At Risk if Positive) = \\frac{.99 \\times .01}{.248}\n\nP (At Risk if Positive)\
  \ = .0339\n```\n\n当我们考虑到只有 1% 的总体有风险，而我们的测试患者中有 20% 有风险时，在检测呈阳性的情况下，有风险的概率是 3.39%！它怎么从\
  \ 99% 降下来的？这只表明，我们很容易被那些仅在特定样本（如供应商的 1000 名测试患者）中很高的概率所误导。所以，如果这个测试成功识别真阳性的概率只有\
  \ 3.39%，我们可能不应该使用它。\n\n## 接收者操作特征（ROC）/曲线下面积（AUC）\n\n在评估不同机器学习配置时，我们可能会面对几十个、几百个甚至几千个混淆矩阵。审查这些矩阵可能会很乏味，因此我们可以用接收者操作特征（ROC）曲线来概括所有矩阵，如图\
  \ 6-21 所示。这样我们就可以查看每个测试实例（每个由黑点表示），并找到真阳性和假阳性之间的可接受平衡。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_325_0.png)\n\
  \n图 6-21. 接收者操作特征（ROC）曲线\n\n我们还可以为每个模型创建单独的 ROC 曲线来比较不同的机器学习模型。例如，如果在图 6-22 中，红色曲线代表逻辑回归，蓝色曲线代表决策树（本书未介绍的一种机器学习技术），我们可以并排查看它们的性能。曲线下面积（AUC）是选择使用哪个模型的良好指标。由于红色曲线（逻辑回归）具有更大的面积，这表明它是更优的模型。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_326_0.png)\n\n图 6-22. 通过各自的 ROC 曲线比较两个模型的曲线下面积（AUC）\n\
  \n要将 AUC 用作评分指标，请将 Scikit-learn API 中的 `scoring` 参数更改为使用 `roc_auc`，如示例 6-18 中所示的交叉验证。\n\
  \n## 示例 6-18. 将 AUC 用作 Scikit-learn 参数：\n\n```\n# put Scikit-learn model here\n\
  results = cross_val_score(model, X, Y, cv=kfold, scoring='roc_auc')\nprint(\"AUC:\
  \ %.3f (%.3f)\" % (results.mean(), results.std()))\n# AUC: 0.791 (0.051)\n```\n\n\
  ## 类别不平衡\n\n在结束本章之前，还有一个需要讨论的问题。如前面讨论混淆矩阵时所见，**类别不平衡**（当数据在每个结果类别中分布不均时发生）是机器学习中的一个问题。不幸的是，许多感兴趣的问题都是不平衡的，例如疾病预测、安全漏洞、欺诈检测等等。类别不平衡仍然是一个未解决的问题，没有很好的解决方案。不过，你可以尝试一些技巧。\n\
  \n首先，你可以采取一些显而易见的措施，比如收集更多数据或尝试不同的模型，以及使用混淆矩阵和 ROC/AUC 曲线。所有这些都有助于跟踪错误预测并主动发现错误。\n\
  \n另一种常见的技术是复制少数类中的样本，直到它在数据集中得到均等表示。你可以在 Scikit-learn 中执行此操作，如示例 6-19 所示，在进行训练-测试分割时。传递包含类值的列的\
  \ `stratify` 选项，它将尝试均等表示每个类的数据。\n\n## 示例 6-19. 在 Scikit-learn 中使用“stratify”选项以平衡数据中的类别\n\
  \n```\nX, Y = ...\nX_train, X_test, Y_train, Y_test = \\\\\ntrain_test_split(X,\
  \ Y, test_size=.33, stratify=Y)\n```\n\n还有一类称为 SMOTE 的算法，它可以生成少数类的合成样本。不过，最理想的方法是使用异常检测模型来解决问题，这类模型专门用于寻找罕见事件。然而，这些模型寻找的是异常值，并且不一定是分类，因为它们是无监督算法。所有这些技术都超出了本书的范围，但值得提及，因为它们*可能*为特定问题提供更好的解决方案。\n\
  \n## 结论\n\n逻辑回归是用于预测概率和分类的主力模型。逻辑回归可以预测多个类别，而不仅仅是 true/false。你只需构建单独的逻辑回归模型，对数据是否属于该类别进行建模，概率最高的模型胜出。你可能会发现，Scikit-learn\
  \ 在大部分情况下会为你完成此操作，并检测你的数据是否超过两个类别。\n\n在本章中，我们不仅介绍了如何使用梯度下降和 Scikit-learn 拟合逻辑回归，还介绍了统计和机器学习方面的验证方法。在统计方面，我们介绍了\
  \ R² 和 p 值；在机器学习方面，我们探讨了训练/测试分割、混淆矩阵和 ROC/AUC。\n\n如果你想了解更多关于逻辑回归的内容，可能最好的入门资源是 Josh\
  \ Starmer 的 StatQuest 逻辑回归播放列表。我必须感谢 Josh 的工作，它协助了本章的一些部分，特别是关于如何计算逻辑回归的 R² 和 p\
  \ 值。如果没有其他原因，也要看看他的视频，欣赏精彩的开场曲！\n\nhttps://youtu.be/yIYKR4sgzI8\n\n与往常一样，你会发现自己在统计学和机器学习两个世界之间行走。现在很多书籍和资源都从机器学习角度介绍逻辑回归，但也试着寻找统计学资源。两种思想流派都有优缺点，只有同时适应两者才能获胜！\n\
  \n## 练习\n\n这里提供了一个包含三个输入变量 RED、GREEN 和 BLUE 以及一个输出变量 LIGHT_OR_DARK_FONT_IND 的数据集：https://bit.ly/3imidqa。它将用于预测浅色/深色字体（分别为\
  \ 0/1）是否适用于给定的背景颜色（由 RGB 值指定）。\n\n- 1. 对上述数据进行逻辑回归，使用 3 折交叉验证和准确率作为指标。\n\n- 2. 生成混淆矩阵，比较预测值和实际值。\n\
  \n- 3. 选择几种不同的背景颜色（你可以使用类似这样的 RGB 工具：https://bit.ly/3FHywrZ），看看逻辑回归是否合理地为每种颜色选择了浅色（0）或深色（1）字体。\n\
  \n- 4. 根据前面的练习，你认为逻辑回归对预测给定背景颜色的浅色或深色字体是否有效？\n\n答案在附录 B 中。\n"
- "# 第 7 章. 神经网络\n\n神经网络是一种在过去 10 年中获得复兴的回归和分类技术。从最简单的定义来看，**神经网络**是一种多层回归，包含位于输入变量和输出变量之间的权重、偏置和非线性函数层。**深度学习**是神经网络的一种流行变体，它利用多个“隐藏”（或中间）节点层，这些节点包含权重和偏置。每个节点在传递给非线性函数（称为激活函数）之前都类似于线性函数。就像我们在第\
  \ 5 章中学习的线性回归一样，优化技术（如随机梯度下降）被用来找到最佳的权重和偏置值，以最小化残差。\n\n神经网络为过去计算机难以解决的问题提供了令人兴奋的解决方案。从图像中识别对象到处理音频中的文字，神经网络已创造出影响我们日常生活的工具。这包括虚拟助手和搜索引擎，以及我们\
  \ iPhone 中的照片工具。\n\n鉴于媒体对神经网络的大肆渲染和新闻头条上的大胆声称，它们自 20 世纪 50 年代就已存在，这可能令人惊讶。2010 之后它们突然走红，是因为数据和计算能力的日益普及。2011\
  \ 年至 2015 年之间的 ImageNet 挑战可能是这种复兴的最大推动力，将在 140 万张图像上对 1000 个类别进行分类的性能提高到 96.4% 的准确率。\n\
  \n然而，像任何机器学习技术一样，它只适用于定义狭窄的问题。即使是创建“自动驾驶”汽车的项目，也不采用端到端深度学习，而主要使用手写的规则系统，并利用卷积神经网络作为“标签制作器”来识别道路上的物体。我们将在本章后面讨论这一点，以了解神经网络实际应用于何处。但首先，我们将在\
  \ NumPy 中构建一个简单的神经网络，然后使用 Scikit-learn 作为库实现。\n\n### 何时使用神经网络和深度学习\n\n神经网络和深度学习可用于分类和回归，那么它们与线性回归、逻辑回归及其他类型的机器学习相比如何？你可能听过这样的话：“当你手里只有一把锤子，看什么都像钉子。”每种算法都有其特定场景的优缺点。线性回归和逻辑回归，以及\n\
  \n\n与梯度提升树（本书未涉及）一样，在对结构化数据进行预测方面效果相当出色。将“结构化数据”视为易于表示为带有行和列的表格的数据。但图像分类等感知问题的结构性要弱得多，因为我们试图在像素组之间寻找模糊的相关性来识别形状和模式，而不是表格中的数据行。预测正在输入的句子中的下一个4-5个单词，或解读音频片段中所说的话，也属于感知问题，并且是神经网络用于自然语言处理的示例。\n\
  \n本章将主要关注简单的神经网络，仅包含1-2个隐藏层。\n\n## 神经网络的变体\n\n神经网络的变体包括卷积神经网络，常用于图像识别。长短期记忆网络（LSTM）用于时间序列预测或预测。循环神经网络常用于文本转语音应用。\n\
  \n## 使用神经网络是否大材小用？\n\n为即将举例使用神经网络很可能属于大材小用，因为逻辑回归可能更实用。甚至可以采用公式化方法。然而，我始终主张通过将复杂技术应用于简单的玩具问题来理解它们。你可以了解技术的优势和局限性，而不会被大型数据集分散注意力。因此，请尽量在更简单的模型更实用时避免使用神经网络。本章我们将打破这条规则，以便理解该技术。\n\
  \n## 一个简单的神经网络\n\n这里有一个简单的玩具示例，可帮助你熟悉神经网络。我想预测对于给定颜色背景，字体应该是浅色（1）还是深色（0）。图7-1展示了几种不同背景色的示例。第一行配合浅色字体效果最好，第二行配合深色字体效果最好。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_331_0.png)\n\n![](img/8e0dcc1636d032e7728a07e97751e446_331_1.png)\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_331_2.png)\n\n![](img/8e0dcc1636d032e7728a07e97751e446_331_3.png)\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_331_4.png)\n\n![](img/8e0dcc1636d032e7728a07e97751e446_331_5.png)\n\
  \n图7-1. 浅色背景配深色字体效果最好，深色背景配浅色字体效果最好\n\n在计算机科学中，表示颜色的一种方法是使用RGB值，即“红”、“绿”和“蓝”值。这些值均介于0到255之间，表示混合这三种颜色以创建所需颜色的比例。例如，如果将RGB表示为（红，绿，蓝），则深橙色的RGB为（255，140，0），粉色为（255，192，203）。黑色为（0，0，0），白色为（255，255，255）。\n\
  \n从机器学习和回归的角度来看，我们有三个数值输入变量——红、绿、蓝——用于捕捉给定的背景颜色。我们需要针对这些输入变量拟合一个函数，并输出是否应为该背景颜色使用浅色（1）或深色（0）字体。\n\
  \n## 通过RGB表示颜色\n\n在线上有数百种调色板可用于尝试RGB值。W3 Schools提供了一个：\n\nhttps://www.w3schools.com/colors/colors_rgb.asp\n\
  \n请注意，此示例与神经网络识别图像的工作原理并不远，因为每个像素通常被建模为三个数值RGB值。在此示例中，我们只关注一个“像素”作为背景颜色。\n\n让我们先从高层次入手，暂时搁置所有实现细节。我们将像剥洋葱一样来探讨这个话题，先从更高层面的理解开始，再慢慢深入细节。目前，我们只是将接受输入并产生输出的过程简单地标记为“神秘数学”。我们有三个数值输入变量R、G和B，由这套“神秘数学”进行处理。然后它输出一个介于0和1之间的预测值，如图7-2所示。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_333_0.png)\n\n图7-2. 我们有三个数值RGB值，用于对浅色或深色字体进行预测。\n\
  \n此预测输出表示一种概率。输出概率是神经网络分类中最常见的模型。一旦用数值替换RGB，我们就会发现，小于0.5意味着建议使用深色字体，而大于0.5意味着建议使用浅色字体，如图7-3所示。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_334_0.png)\n\n图7-3. 如果输入背景颜色为粉色（255,192,203），则“神秘数学”推荐使用浅色字体，因为输出的概率0.89大于0.5。\n\
  \n那么，该“神秘数学”黑盒内部究竟发生了什么？让我们在图7-4中看一看。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_335_0.png)\n\
  \n图7-4. 神经网络的隐藏层将权重和偏置值应用于每个输入变量，而输出层则将另一组权重和偏置应用于该输出。\n\n神经网络还缺少一个部分，即激活函数，但我们稍后会讲到。让我们先来理解这里发生了什么。左侧第一层仅仅是三个变量的输入，在这里即红、绿、蓝值。在隐藏（中间）层中，请注意，我们在输入和输出之间产生了三个**节点**，即权重和偏置的函数。每个节点本质上是一个线性函数，斜率为w_i，截距为b_i，与输入变量x_i相乘并求和。每个输入节点和隐藏节点之间有一个权重w_i，每个隐藏节点和输出节点之间还有一组权重。每个隐藏节点和输出节点都会额外添加一个偏置b_i。\n\
  \n请注意，输出节点重复相同的操作，即取隐藏层加权求和后的输出，并将其作为最终层的输入，在最终层中将应用另一组权重和偏置。我使用“重复加权求和”代替数学表达式，因为从隐藏层嵌入的表达式太长，无法在图形中显示。但以下是最终节点的表达式，请注意隐藏层的输出如何成为最终层的输入。\n\
  \n```\noutput = w_10 (x_1 w_1 + x_2 w_2 + x_3 w_3 + b_1)\n+ w_11 (x_1 w_4 + x_2\
  \ w_5 + x_3 w_6 + b_2)\n+ w_12 (x_1 w_7 + x_2 w_8 + x_3 w_9 + b_3) + b_4\n```\n\n\
  简而言之，这与线性回归或逻辑回归一样是一种回归，只是需要求解的参数多得多。权重和偏置值类似于线性回归中的m和b，或β₁和β₀参数。我们确实使用随机梯度下降并最小化损失，与线性回归一样，但我们需要一个称为反向传播的额外工具来解开权重w_i和偏置b_i值，并使用链式法则计算它们的偏导数。我们将在本章后面讨论这一点，但目前先假设我们已优化好权重和偏置值。首先我们需要讨论激活函数。\n\
  \n## 激活函数\n\n接下来我们来介绍激活函数。激活函数是一种非线性函数，可对节点中的加权求和值进行变换或压缩，帮助神经网络有效分离数据以便进行分类。让我们看看图7-5。如果没有激活函数，你的隐藏层将不会起作用，其性能将不比线性回归好。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_337_0.png)\n\n图7-5. 应用激活函数\n\nReLU激活函数会将隐藏节点的任何负输出置零。如果权重、偏置和输入相乘并求和得到一个负数，它将\n\
  \n\n会被转换为 0。否则输出保持不变。这是使用 SymPy（示例 7-1）绘制的 ReLU 图（图 7-6）。\n\n### 示例 7-1. 绘制 ReLU\
  \ 函数\n\n```python\nfrom sympy import *\n\n# plot relu\nx = symbols('x')\nrelu =\
  \ Max(0, x)\nplot(relu)\n```\n\n![](img/8e0dcc1636d032e7728a07e97751e446_339_0.png)\n\
  \n图 7-6. ReLU 函数图像\n\nReLU 是“修正线性单元”的缩写，但这只是一个花哨的说法，意思是“将负值转换为 0”。ReLU 因其速度快且能缓解梯度消失问题，在神经网络和深度学习的隐藏层中广受欢迎。当偏导数斜率变得非常小、过早趋近于\
  \ 0 并导致训练戛然而止时，就会发生梯度消失现象。\n\n输出层有一项重要工作：它获取神经网络隐藏层中的大量数学运算结果，并将其转换为可解释的结果，例如呈现分类预测。这个特定神经网络的输出层使用\
  \ **logistic 激活函数**，这是一个简单的 sigmoid 曲线。如果你读过第 6 章，logistic（或 sigmoid）函数应该很熟悉，这表明逻辑回归正在作为我们神经网络中的一个层发挥作用。输出节点对来自隐藏层的每个输入值计算权重、偏置和求和。之后，它将该结果值传递给\
  \ logistic 函数，因此输出一个 0 到 1 之间的数字。与第 6 章中的逻辑回归类似，这表示神经网络推荐使用浅色字体的概率。如果该值大于或等于 .5，神经网络建议使用浅色字体；低于此值则建议使用深色字体。\n\
  \n这是使用 SymPy（示例 7-2）绘制的 logistic 函数图（图 7-7）。\n\n### 示例 7-2. SymPy 中的 logistic 激活函数\n\
  \n```python\nfrom sympy import *\n# plot logistic\nx = symbols('x')\nlogistic =\
  \ 1 / (1 + exp(-x))\nplot(logistic)\n```\n\n![](img/8e0dcc1636d032e7728a07e97751e446_341_0.png)\n\
  \n图 7-7. Logistic 激活函数\n\n请注意，当我们将节点的加权、加偏且求和后的值传递给激活函数时，我们现在将其称为 **激活输出**，意思是它已通过激活函数过滤。当激活输出离开隐藏层时，信号就准备好馈送到下一层了。激活函数可能增强了信号、削弱了信号，或者保持原样。这就是神经网络大脑和突触比喻的由来。\n\
  \n鉴于可能存在的复杂性，你可能想知道是否有其他激活函数。表 7-1 显示了一些常见的激活函数。\n\n### 表 7-1. 常见激活函数\n\n| 名称 |\
  \ 典型使用层 | 描述 | 备注 |\n|---|---|---|---|\n| 线性 | 输出 | 保持值不变 | 不常用 |\n| Logistic |\
  \ 输出 | S 形 sigmoid 曲线 | 将值压缩到 0 和 1 之间，通常协助二分类 |\n| 双曲正切 | 隐藏 | tanh，-1 到 1 之间的\
  \ S 形 sigmoid 曲线 | 通过将均值拉近 0 来协助“中心化”数据 |\n| ReLU | 隐藏 | 将负值转换为 0 | 流行的激活函数，比 sigmoid\
  \ 和 tanh 更快，缓解梯度消失问题，计算开销小 |\n| 漏 ReLU | 隐藏 | 将负值乘以 .01 | ReLU 的有争议的变体，它边缘化而非消除负值\
  \ |\n| Softmax | 输出 | 确保所有输出节点加起来等于 1.0 | 用于多类分类，并重新缩放输出使其加起来等于 1.0 |\n\n这并非激活函数的详尽列表，在理论上，任何函数都可以作为神经网络中的激活函数。\n\
  \n虽然这个神经网络看似支持两个类别（浅色字体或深色字体），但实际上它是面向一个类别建模的：字体是否应该是浅色（1）或不是（0）。如果你想支持多个类别，可以为每个类别添加更多输出节点。例如，如果你试图识别手写数字\
  \ 0-9，会有 10 个输出节点，分别表示给定图像是这些数字中每一个的概率。在有多个类别时，你也可以考虑将 softmax 用作输出激活。图 7-8 展示了一个示例，即对一张数字的像素化图像进行处理，其中像素被拆分为单独的神经网络输入，然后传递两个中间层，最后传递一个带有\
  \ 10 个节点的输出层，代表 10 个类别（即数字 0-9）的概率。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_345_0.png)\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_345_1.png)\n\n图 7-8. 将每个像素作为输入并预测图像包含哪个数字的神经网络\n\
  \n关于在神经网络中使用 MNIST 数据集的示例，请参阅附录 A。\n\n> # 我不知道该使用哪个激活函数！\n> \n> 如果不确定使用哪些激活函数，当前最佳实践倾向于中间层使用\
  \ ReLU，输出层使用 logistic（sigmoid）。如果输出中有多个分类，请在输出层使用 softmax。\n\n## 前向传播\n\n让我们使用 NumPy\
  \ 记迄今所学的内容。请注意，我尚未优化参数（我们的权重和偏置值）。我们将使用随机值初始化它们。\n\n示例 7-3 是创建一个尚未优化的简单前馈神经网络的 Python\
  \ 代码。所谓“前馈”，是指我们只是将颜色输入神经网络并查看其输出。权重和偏置是随机初始化的，将在本章后面优化，因此暂时不要指望有有用的输出。\n\n### 示例\
  \ 7-3. 一个带有随机权重和偏置值的简单前向传播网络。\n\n```python\nimport numpy as np\nimport pandas as\
  \ pd\nfrom sklearn.model_selection import train_test_split\n\nall_data = pd.read_csv(\"\
  https://tinyurl.com/y2qmhfsr\")\n\n# Extract the input columns, scale down by 255\n\
  all_inputs = (all_data.iloc[:, 0:3].values / 255.0)\nall_outputs = all_data.iloc[:,\
  \ -1].values\n\n# Split train and test data sets\nX_train, X_test, Y_train, Y_test\
  \ = train_test_split(all_inputs, all_outputs,\ntest_size=1/3)\nn = X_train.shape[0]\
  \ # number of training records\n\n# Build neural network with weights and biases\n\
  # with random initialization\nw_hidden = np.random.rand(3, 3)\nw_output = np.random.rand(1,\
  \ 3)\n\nb_hidden = np.random.rand(3, 1)\nb_output = np.random.rand(1, 1)\n\n# Activation\
  \ functions\nrelu = lambda x: np.maximum(x, 0)\nlogistic = lambda x: 1 / (1 + np.exp(-x))\n\
  \n# Runs inputs through the neural network to get predicted outputs\ndef forward_prop(X):\n\
  \    Z1 = w_hidden @ X + b_hidden\n    A1 = relu(Z1)\n    Z2 = w_output @ A1 + b_output\n\
  \    A2 = logistic(Z2)\n    return Z1, A1, Z2, A2\n```\n\n```python\n# Calculate\
  \ accuracy\ntest_predictions = forward_prop(X_test.transpose())[3]  # grab only\
  \ output layer, A2\ntest_comparisons = np.equal((test_predictions >= .5).flatten().astype(int),\n\
  Y_test)\naccuracy = sum(test_comparisons.astype(int) / X_test.shape[0])\nprint(\"\
  ACCURACY: \", accuracy)\n```\n\n这里有几点需要注意。包含 RGB 输入值以及输出值（1 表示浅色，0 表示深色）的数据集位于 https://tinyurl.com/y2qmhfsr。我将输入列\
  \ R、G 和 B 的值按 1/255 的因子缩小，使其介于 0 和 1 之间。这将有助于后续训练，以压缩数值空间。\n\n请注意，我还使用 Scikit-learn\
  \ 将 2/3 的数据用于训练，1/3 用于测试，这是我们在第 5 章中学习过的方法。n 仅仅是训练数据记录的数量。\n\n现在请注意示例 7-4 中所示的这些代码行。\n\
  \n### 示例 7-4. NumPy 中的权重矩阵和偏置向量\n\n```python\n# Build neural network with weights\
  \ and biases\n# with random initialization\nw_hidden = np.random.rand(3, 3)\nw_output\
  \ = np.random.rand(1, 3)\n\nb_hidden = np.random.rand(3, 1)\nb_output = np.random.rand(1,\
  \ 1)\n```\n\n这些代码声明了神经网络隐藏层和输出层的权重和偏置。这可能还不明显，但矩阵乘法将使用线性代数和 NumPy 使我们的代码强大而简单。\n\
  \n权重和偏置将初始化为 0 到 1 之间的随机值。让我们先看看权重矩阵。当我运行代码时，得到了这些矩阵。\n\n\\( W_{hidden} = \\begin{bmatrix}\
  \ 0.034535 & 0.5185636 & 0.81485028 \\\\ 0.3329199 & 0.53873853 & 0.96359003 \\\\\
  \ 0.19808306 & 0.45422182 & 0.36618893 \\end{bmatrix} \\)\n\\( W_{output} = [0.82652072\
  \ \\quad 0.30781539 \\quad 0.93095565] \\)\n\n请注意，上面 \\( w_{hidden} \\) 是隐藏层中的权重。第一行代表第一个节点的权重\
  \ \\( w_1, w_2, and w_3 \\)。第二行是第二个节点，带有权重 \\( w_4 \\),\n\n\n\nw5、和 w6。第三行是第三个节点，权重为\
  \ w7、w8 和 w9。\n\n输出层只有一个节点，意味着其矩阵只有一行，权重为 w10、w11 和 w12。\n\n这里有规律吗？每个节点都表示为矩阵中的一行。如果有\
  \ 3 个节点，就有 3 行。如果有 1 个节点，就有 1 行。每一列都保存该节点的权重值。\n\n让我们也来看看偏置。由于每个节点有一个偏置，隐藏层将有 3\
  \ 行偏置，输出层将有 1 行偏置。每个节点只有 1 个偏置，因此将只有 1 列。\n\n\\( B_{hidden} = \\begin{bmatrix} 0.41379442\
  \ \\\\ 0.81666079 \\\\ 0.07511252 \\end{bmatrix} \\)\n\n\\( B_{output} = [0.58018555]\
  \ \\)\n\n现在让我们将这些矩阵值与图 7-9 中显示的可视化神经网络进行比较。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_349_0.png)\n\
  \n- $w_1 = 0.034535$\n- $w_2 = 0.5185636$\n- $w_3 = 0.81485028$\n- $b_1 = 0.41379442$\n\
  - $w_4 = 0.3329199$\n- $w_5 = 0.53873853$\n- $w_6 = 0.96359003$\n- $b_2 = 0.81666079$\n\
  - $w_7 = 0.19808306$\n- $w_8 = 0.45422182$\n- $w_9 = 0.36618893$\n- $b_3 = 0.07511252$\n\
  - $w_{10} = 0.82652072$\n- $w_{11} = 0.30781539$\n- $w_{12} = 0.93095565$\n- $b_4\
  \ = 0.58018555$\n\n图 7-9. 将我们的神经网络与权重和偏置矩阵值进行可视化。\n\n除了晦涩紧凑之外，这些矩阵形式的权重和偏置有什么好处？让我们将注意力集中在示例\
  \ 7-5 的这些代码行上。\n\n## 示例 7-5. 我们的神经网络的激活函数和前向传播函数。\n\n```\n# Activation functions\n\
  relu = lambda x: np.maximum(x, 0)\nlogistic = lambda x: 1 / (1 + np.exp(-x))\n\n\
  # Runs inputs through the neural network to get predicted outputs\ndef forward_prop(X):\n\
  \    Z1 = w_hidden @ X + b_hidden\n    A1 = relu(Z1)\n    Z2 = w_output @ A1 + b_output\n\
  \    A2 = logistic(Z2)\n    return Z1, A1, Z2, A2\n```\n\n以上代码很重要，因为它使用矩阵乘法和矩阵-向量乘法简洁地执行了我们整个神经网络。我们在第\
  \ 4 章中学习过这些操作。它只需几行代码就能将三个 RGB 输入的颜色通过权重、偏置和激活函数。\n\n我首先声明 relu() 和 logistic() 激活函数，它们实际上接受给定的输入值并返回曲线上的输出值。forward_prop()\
  \ 函数为给定的包含 R、G 和 B 值的颜色输入 X 执行我们整个神经网络。它返回 4 个阶段的矩阵输出：Z1、A1、Z2 和 A2。“1”和“2”分别表示操作属于第“1”层和第“2”层。“Z”表示该层的未激活输出，而“A”是该层的激活输出。\n\
  \n隐藏层由 Z1 和 A1 表示。Z1 是应用于 X 的权重和偏置。然后 A1 获取 Z1 的输出并将其通过激活 ReLU 函数。Z2 获取 A1 的输出并应用输出层权重和偏置。该输出随后被通过激活函数（即逻辑曲线），并变为\
  \ A2。最终阶段 A2 是来自输出层的预测概率，返回 0 到 1 之间的值。我们称它为 A2，因为它是第 2 层的“激活”输出。\n\n让我们从 Z1 开始更详细地分析这一点。\n\
  \n$Z_1 = W_{hidden}X + B_{hidden}$\n\n首先，我们在 $W_{hidden}$ 和输入颜色 X 之间执行矩阵-向量乘法。我们将\
  \ $W_{hidden}$ 的每一行（每一行都是一个节点的一组权重）与向量 X（RGB 颜色输入值）相乘。然后将偏置加到该结果上。\n\nZ_1 = W_{hidden}X\
  \ + B_{hidden}\n\nZ1 = \\(\\begin{bmatrix} 0.034535 & 0.5185636 & 0.81485028 \\\\\
  \ 0.3329199 & 0.53873853 & 0.96359003 \\\\ 0.19808306 & 0.45422182 & 0.36618893\
  \ \\end{bmatrix} \\begin{bmatrix} 0.82652072 \\\\ 0.30781539 \\\\ 0.93095565 \\\
  end{bmatrix} + \\begin{bmatrix} 0.41379442 \\\\ 0.81666079 \\\\ 0.07511252 \\end{bmatrix}\\\
  )\n\nZ1 = \\(\\begin{bmatrix} 0.946755221909086 \\\\ 1.33805678888247 \\\\ 0.644441873391768\
  \ \\end{bmatrix} + \\begin{bmatrix} 0.41379442 \\\\ 0.81666079 \\\\ 0.07511252 \\\
  end{bmatrix}\\)\n\nZ1 = \\(\\begin{bmatrix} 1.36054964190909 \\\\ 2.15471757888247\
  \ \\\\ 0.719554393391768 \\end{bmatrix}\\)\n\n图 7-10. 使用矩阵-向量乘法以及向量加法将隐藏层权重和偏置应用于输入\
  \ X。\n\n该 Z1 向量是隐藏层的原始输出，但我们仍然需要将其通过激活函数以将 Z1 转换为 A1。这很简单。只需将该向量中的每个值通过 ReLU 函数，它就会给我们\
  \ \\(A_1\\)。由于所有值都是正数，这不应有任何影响。\n\n\\(A_1 = ReLU (Z_1)\\)\n\n\\(A_1 = \\begin{bmatrix}\
  \ ReLU(1.36054964190909) \\\\ ReLU(2.15471757888247) \\\\ ReLU(0.719554393391768)\
  \ \\end{bmatrix} = \\begin{bmatrix} 1.36054964190909 \\\\ 2.15471757888247 \\\\\
  \ 0.719554393391768 \\end{bmatrix}\\)\n\n现在让我们取该隐藏层输出 \\(A_1\\) 并将其通过最终层以获得 \\(Z_2\\\
  )，然后获得 \\(A_2\\)。\\(A_1\\) 变成输出层的输入。\n\n\\(Z_2 = W_{output}A_1 + B_{output}\\)\n\
  \n\\(Z_2 = [0.82652072 \\quad 0.30781539 \\quad 0.93095565] \\begin{bmatrix} 1.36054964190909\
  \ \\\\ 2.15471757888247 \\\\ 0.719554393391768 \\end{bmatrix} + [0.58018555]\\)\n\
  \n\\(Z_2 = [2.45765202842636] + [0.58018555]\\)\n\n\\(Z_2 = [3.03783757842636]\\\
  )\n\n最后将 \\(Z_2\\) 中的这个单个值通过激活函数以获得 \\(A_2\\)。这将产生大约 \\(0.95425\\) 的预测。\n\n\\(A_2\
  \ = logistic (Z_2)\\)\n\n\\(A_2 = logistic ([3.03783757842636])\\)\n\n\\(A_2 = 0.954254478103241\\\
  )\n\n这执行了我们整个神经网络，尽管我们还没有训练它。但请花点时间欣赏一下，我们已经将所有这些输入值、权重、偏置和非线性函数都转换成了一个将提供预测的单一值。\n\
  \n同样，\\(A_2\\) 是最终输出，用于预测背景颜色是需要浅色（1）还是深色（0）字体。尽管我们的权重和偏置尚未优化，但让我们按示例 7-6 所示计算准确率。获取测试数据集\
  \ X\\_test，将其转置，并将其通过 `forward_prop()` 函数，但只获取包含每个测试颜色预测的 \\(A_2\\) 向量。然后将预测与实际值进行比较，并计算正确预测的百分比。\n\
  \n## 示例 7-6. 计算准确率\n\n```python\n# Calculate accuracy\ntest_predictions = forward_prop(X_test.transpose())\
  \ [3]  # grab only A2\ntest_comparisons = np.equal((test_predictions >= .5).flatten().astype(int),\n\
  Y_test)\naccuracy = sum(test_comparisons.astype(int) / X_test.shape[0])\nprint(\"\
  ACCURACY: \", accuracy)\n```\n\n当我运行示例 7-3 中的完整代码时，我大约得到 55% 到 67% 的准确率。请记住，权重和偏置是随机生成的，因此结果会有所不同。虽然考虑到参数是随机生成的，这看起来可能很高，但请记住，输出预测是二进制的：浅色或深色。因此，随机抛硬币对于每个预测也可能产生这种结果，所以这个数字不应令人惊讶。\n\
  \n> **别忘了检查数据是否不平衡！**\n> 如前第 6 章所讨论，别忘了分析你的数据以检查类别是否不平衡。整个背景颜色数据集有点不平衡。512 种颜色的输出为\
  \ 0，833 种颜色的输出为 1。这可能会扭曲准确率，也可能是我们的随机权重和偏置趋向高于 50% 准确率的原因。如果数据极度不平衡（例如 99% 的数据属于同一类），请记住使用混淆矩阵来跟踪假阳性和假阴性。\n\
  \n好了，到目前为止在结构上一切都说得通吗？在继续之前，欢迎随时回顾到目前为止的所有内容。我们只有一个最后要讲的部分：优化权重和偏置。去弄杯浓缩咖啡或氮气咖啡吧，因为这是本书中我们将要进行的最复杂的数学！\n\
  \n## 反向传播\n\n在开始使用随机梯度下降来优化神经网络之前，我们面临的一个挑战是弄清楚如何相应地更改每个权重和偏置值，尽管它们都纠缠在一起以创建输出变量，然后用该变量来计算残差。我们如何找到每个权重\
  \ _w<sub>i</sub>_ 和偏置 _b<sub>i</sub>_ 变量的导数？我们需要使用在第 1 章中介绍的链式法则。\n\n### 计算权重和偏置导数\n\
  \n我们还没有准备好应用随机梯度下降来训练神经网络。我们必须获取关于权重 _W<sub>i</sub>_ 和偏置 _B<sub>i</sub>_ 的偏导数，并且链式法则可以帮助我们。\n\
  \n\n\n\n\n虽然过程基本相同，但在神经网络上使用随机梯度下降存在一个复杂性。一层中的节点将其权重和偏差馈送到下一层，然后下一层应用另一组权重和偏差。这创造了一个像洋葱一样嵌套的结构，我们需要从输出层开始解开。\n\
  \n在梯度下降过程中，我们需要确定应该调整哪些权重和偏差，以及调整多少，以减少总体成本函数。单次预测的成本将是神经网络输出 \\(A_2\\) 的平方减去预测值\
  \ Y。\n\n\\(C = (A_2 - Y)^2\\)\n\n但让我们深入一层。这个激活后的输出 \\(A_2\\) 只是经过激活函数处理后的 \\(Z_2\\\
  )。\n\n\\(A_2 = sigmoid(Z_2)\\)\n\n而 \\(Z_2\\) 则是将输出权重和偏差应用于来自隐藏层的激活输出 \\(A_1\\)\
  \ 的结果。\n\n\\(Z_2 = W_2A_1 + B_2\\)\n\n\\(A_1\\) 是基于 \\(Z_1\\) 构建的，\\(Z_1\\) 经过 ReLU\
  \ 激活函数处理。\n\n\\(A_1 = ReLU(Z_1)\\)\n\n最后，\\(Z_1\\) 是输入 X 值经过隐藏层加权和加偏后的结果。\n\n\\\
  (Z_1 = W_1X + B_1\\)\n\n我们需要找到包含在 \\(W_1, B_1, W_2,\\) 和 \\(B_2\\) 矩阵和向量中的权重和偏差，以最小化我们的损失。通过微调它们的斜率，我们可以改变对最小化损失影响最大的权重和偏差。但是，对权重或偏差的每一点微小调整都会一直传播到外层的损失函数。这时链式法则可以帮助我们找出这种影响。\n\
  \n让我们专注于寻找输出层权重 \\(W_2\\) 与成本函数 \\(C\\) 之间的关系。权重 \\(W_2\\) 的变化会导致未激活输出 \\(Z_2\\\
  ) 的变化。然后这会改变激活后的输出 \\(A_2\\)，从而改变成本函数 \\(C\\)。使用链式法则，我们可以定义 \\(C\\) 对 \\(W_2\\)\
  \ 的导数如下。\n\n\\(\\frac{dC}{dW_2} = \\frac{dZ_2}{dW_2} \\frac{dA_2}{dZ_2} \\frac{dC}{dA_2}\\\
  )\n\n当我们将这三个梯度相乘时，我们就得到了一个衡量指标，表明对 $W_2$ 的改变会使成本函数 $C$ 变化多少。\n\n现在我们将计算这三个导数。让我们使用\
  \ SymPy 来计算成本函数对 A2 的导数，如示例 7-7 所示。\n\n### 示例 7-7. 计算成本函数对 A2 的导数\n\n```python\n\
  from sympy import *\n\nA2, y = symbols('A2 Y')\nC = (A2 - Y) ** 2\ndC_dA2 = diff(C,\
  \ A2)\nprint(dC_dA2) # 2*A2 - 2*Y\n```\n\n\\(\\frac{dC}{dA_2} = 2A_2 - 2y\\)\n\n\
  接下来，让我们求出 A2 对 Z2 的导数。请记住，A2 是激活函数的输出，在这里是逻辑函数。因此，我们实际上是在求解一个 sigmoid 曲线的导数。\n\n\
  ### 示例 7-8. 求解 A2 对 Z2 的导数\n\n```python\nfrom sympy import *\n\nZ2 = symbols('Z2')\n\
  \nlogistic = lambda x: 1 / (1 + exp(-x))\n\nA2 = logistic(Z2)\ndA2_dZ2 = diff(A2,\
  \ Z2)\nprint(dA2_dZ2) # exp(-Z2)/(1 + exp(-Z2)) ** 2\n```\n\n\\(\\frac{dA_2}{dZ_2}\
  \ = \\frac{e^{-Z_2}}{(1 + e^{-Z_2})^2}\\)\n\nZ2 对 w2 的导数结果将仅为 A1，因为它只是一个线性函数，并将返回斜率。\n\
  \n### 示例 7-9. Z2 对 W2 的导数\n\n```python\nfrom sympy import *\n\nA1, W2, B2 = symbols('A1,\
  \ W2, B2')\n\nZ2 = A1*W2 + B2\ndz2_dW2 = diff(Z2, W2)\nprint(dZ2_dW2) # A1\n```\n\
  \n\\(\\frac{dZ_2}{dW_2} = A_1\\)\n\n汇总以上内容，以下是求解 $W_2$ 中某个权重的变化如何影响成本函数 $C$ 的导数。\n\
  \n$$ \\frac{dC}{dW_2} = \\frac{dZ_2}{dW_2} \\frac{dA_2}{dZ_2} \\frac{dC}{dA_2} =\
  \ (A_1) \\left( \\frac{e^{-Z_2}}{(1 + e^{-Z_2})^2} \\right) (2A_2 - 2y) $$\n\n当我们运行带有三个输入\
  \ R、G 和 B 值的输入 X 时，我们将拥有 $A_1, A_2, Z_2$ 和 $y$ 的值。\n\n### 不要在数学中迷失！\n\n此时很容易在数学中迷失，并忘记最初想要实现的目标，即求解输出层中某个权重（$W_2$）对成本函数的导数。当你发现自己陷入细节并忘记自己想要做什么时，请后退一步，去散散步，喝杯咖啡，提醒自己想要完成什么。如果做不到，你应该从头开始重新来过，一步步推导到你迷失的地方。\n\
  \n然而，这只是神经网络的一个组成部分，即 $W_2$ 的导数。以下是示例 7-10 中用于链式法则所需的其余偏导数的 SymPy 计算。\n\n### 示例\
  \ 7-10. 计算神经网络所需的所有偏导数\n\n```python\nfrom sympy import *\n\nW1, W2, B1, B2, A1,\
  \ A2, Z1, Z2, X, Y = symbols('W1 W2 B1 B2 A1 A2 Z1 Z2 X Y')\n\n# Calculate derivative\
  \ of cost function with respect to A2\nC = (A2 - Y)**2\ndc_dA2 = diff(C, A2)\nprint(\"\
  dc_dA2 = \", dc_dA2) # 2*A2 - 2*Y\n\n# Calculate derivative of A2 with respect to\
  \ Z2\nlogistic = lambda x: 1 / (1 + exp(-x))\nA2 = logistic(Z2)\ndA2_dZ2 = diff(A2,\
  \ Z2)\nprint(\"dA2_dZ2 = \", dA2_dZ2) # exp(-Z2)/(1 + exp(-Z2)) ** 2\n\n# Calculate\
  \ derivative of Z2 with respect to A1\n_Z2 = A1*W2 + B2\ndZ2_dA1 = diff(_Z2, A1)\n\
  print(\"dZ2_dA1 = \", dZ2_dA1) # W2\n\n# Calculate derivative of Z2 with respect\
  \ to W2\ndZ2_dW2 = diff(_Z2, W2)\nprint(\"dZ2_dW2 = \", dZ2_dW2) # A1\n```\n\n```python\n\
  # Calculate derivative of Z2 with respect to B2\ndZ2_dB2 = diff(Z2, B2)\nprint(\"\
  dZ2_dB2 = \", dZ2_dB2) # 1\n```\n\n```python\n# Calculate derivative of A1 with\
  \ respect to Z1\nrelu = lambda x: Max(x, 0)\n_A1 = relu(Z1)\n\nd_relu = lambda x:\
  \ x > 0 # Slope is 1 if positive, 0 if negative\ndA1_dZ1 = d_relu(Z1)\nprint(\"\
  dA1_dZ1 = \", dA1_dZ1) # Z1 > 0\n```\n\n```python\n# Calculate derivative of Z1\
  \ with respect to W1\n_Z1 = X*W1 + B1\ndZ1_dW1 = diff(Z1, W1)\nprint(\"dZ1_dW1 =\
  \ \", dZ1_dW1) # X\n```\n\n```python\n# Calculate derivative of Z1 with respect\
  \ to B1\ndZ1_dB1 = diff(Z1, B1)\nprint(\"dZ1_dB1 = \", dZ1_dB1) # 1\n```\n\n请注意，ReLU\
  \ 是手动计算的，而不是使用 SymPy 的 diff() 函数。这是因为导数适用于平滑曲线，而不是 ReLU 上存在的锯齿状拐点。但我们可以轻松地通过声明正数的斜率为\
  \ 1、负数的斜率为 0 来绕过这个问题。这是有道理的，因为负数是斜率为 0 的平直线。而正数则保持不变，具有 1 对 1 的斜率。\n\n这些偏导数可以链式组合，以创建相对于权重和偏差的新偏导数。让我们求解\
  \ $W_1$、$W_2$、$B_1$ 和 $B_2$ 相对于成本函数的所有四个偏导数。我们已经讲解了 $\\frac{dC}{dW_2}$。让我们将其与我们需要的其他三个链式导数一起展示。\n\
  \n\\[\n\\frac{dC}{dW_2} = \\frac{dZ_2}{dW_2} \\frac{dA_2}{dZ_2} \\frac{dC}{dA_2}\
  \ = (A_1) \\left( \\frac{e^{-Z_2}}{(1 + e^{-Z_2})^2} \\right) (2A_2 - 2y)\n\\]\n\
  \n\\[\n\\frac{dC}{dB_2} = \\frac{dZ_2}{dB_2} \\frac{dA_2}{dZ_2} \\frac{dC}{dA_2}\
  \ = (1) \\left( \\frac{e^{-Z_2}}{(1 + e^{-Z_2})^2} \\right) (2A_2 - 2y)\n\\]\n\n\
  \\[\n\\frac{dC}{dW_1} = \\frac{dC}{dA_2} \\frac{dA_2}{dZ_2} \\frac{dZ_2}{dA_1} \\\
  frac{dA_1}{dZ_1} \\frac{dZ_1}{dW_1} = (2A_2 - 2y) \\left( \\frac{e^{-Z_2}}{(1 +\
  \ e^{-Z_2})^2} \\right) (W_2) (Z_1 > 0) (X)\n\\]\n\n\\[\n\\frac{dC}{dB_1} = \\frac{dC}{dA_2}\
  \ \\frac{dA_2}{dZ_2} \\frac{dZ_2}{dA_1} \\frac{dA_1}{dZ_1} \\frac{dZ_1}{dB_1} =\
  \ (2A_2 - 2y) \\left( \\frac{e^{-Z_2}}{(1 + e^{-Z_2})^2} \\right) (W_2) (Z_1 > 0)\
  \ (1)\n\\]\n\n我们将使用这些链式梯度来计算成本函数 C 相对于 W1、B1、W2 和 B2 的斜率。\n\n## 自动微分\n\n如你所见，即使使用链式法则和像\
  \ SymPy 这样的符号库，解开导数仍然很繁琐。这就是为什么可微分编程库正在兴起，例如 Google 开发的 JAX 库。它与 NumPy 几乎完全相同，只是它允许对打包为矩阵的参数计算导数。\n\
  \n如果你想了解更多关于自动微分的信息，这个 YouTube 视频很好地解释了它。\n\nhttps://youtu.be/wG_nFlawSSY\n\n##\
  \ 随机梯度下降\n\n我们现在准备好整合链式法则以执行随机梯度下降了。为了保持简单，我们在每次迭代中只采样一个训练记录。批量梯度下降和小批量梯度下降常用于神经网络和深度学习，但每次迭代只处理一个样本就已经涉及足够多的线性代数和微积分了。\n\
  \n让我们来看看我们神经网络的完整实现，带有反向传播的随机梯度下降，如示例 7-11 所示。\n\n## 示例 7-11. 使用随机梯度下降实现神经网络\n\n\
  ```python\nimport numpy as np\nimport pandas as pd\nfrom sklearn.model_selection\
  \ import train_test_split\n\nall_data = pd.read_csv(\"https://tinyurl.com/y2qmhfsr\"\
  )\n\n# Learning rate controls how slowly we approach a solution\n# Make it too small,\
  \ it will take too long to run.\n# Make it too big, it will likely overshoot and\
  \ miss the solution.\nL = 0.05\n\n# Extract the input columns, scale down by 255\n\
  all_inputs = (all_data.iloc[:, 0:3].values / 255.0)\nall_outputs = all_data.iloc[:,\
  \ -1].values\n\n# Split train and test data sets\nX_train, X_test, Y_train, Y_test\
  \ = train_test_split(all_inputs, all_outputs,\ntest_size=1 / 3)\nn = X_train.shape[0]\n\
  \n# Build neural network with weights and biases\n```\n\n\n\n\n\n```python\n# with\
  \ random initialization\nw_hidden = np.random.rand(3, 3)\nw_output = np.random.rand(1,\
  \ 3)\n\nb_hidden = np.random.rand(3, 1)\nb_output = np.random.rand(1, 1)\n```\n\n\
  ```python\n# Activation functions\nrelu = lambda x: np.maximum(x, 0)\nlogistic =\
  \ lambda x: 1 / (1 + np.exp(-x))\n```\n\n```python\n# Runs inputs through the neural\
  \ network to get predicted outputs\ndef forward_prop(X):\n    Z1 = w_hidden @ X\
  \ + b_hidden\n    A1 = relu(Z1)\n    Z2 = w_output @ A1 + b_output\n    A2 = logistic(Z2)\n\
  \n    return Z1, A1, Z2, A2\n```\n\n```python\n# Derivatives of Activation functions\n\
  d_relu = lambda x: x > 0\nd_logistic = lambda x: np.exp(-x) / (1 + np.exp(-x)) **\
  \ 2\n```\n\n```python\n# returns slopes for weights and biases\n# using chain rule\n\
  def backward_prop(Z1, A1, Z2, A2, X, Y):\n    dc_dA2 = 2 * A2 - 2 * Y\n    dA2_dZ2\
  \ = d_logistic(Z2)\n    dZ2_dA1 = w_output\n    dZ2_dW2 = A1\n    dZ2_dB2 = 1\n\n\
  \    dA1_dZ1 = d_relu(Z1)\n    dZ1_dW1 = X\n    dZ1_dB1 = 1\n\n    dc_dW2 = dc_dA2\
  \ @ dA2_dZ2 @ dZ2_dW2.T\n\n    dc_dB2 = dc_dA2 @ dA2_dZ2 * dZ2_dB2\n\n    dc_dA1\
  \ = dc_dA2 @ dA2_dZ2 @ dZ2_dA1\n\n    dc_dW1 = dc_dA1 @ dA1_dZ1 @ dZ1_dW1.T\n\n\
  \    dc_dB1 = dc_dA1 @ dA1_dZ1 * dZ1_dB1\n\n    return dc_dW1, dc_dB1, dc_dW2, dc_dB2\n\
  ```\n\n```python\n# Execute gradient descent\nfor i in range(100_000):\n    # randomly\
  \ select one of the training data\n    idx = np.random.choice(n, 1, replace=False)\n\
  \    X_sample = X_train[idx].transpose()\n    Y_sample = Y_train[idx]\n    # run\
  \ randomly selected training data through neural network\n    Z1, A1, Z2, A2 = forward_prop(X_sample)\n\
  \n    # distribute error through backpropagation\n    # and return slopes for weights\
  \ and biases\n    dW1, dB1, dW2, dB2 = backward_prop(Z1, A1, Z2, A2, X_sample, Y_sample)\n\
  \n    # update weights and biases\n    w_hidden -= L * dW1\n    b_hidden -= L *\
  \ dB1\n    w_output -= L * dW2\n    b_output -= L * dB2\n\n    # Calculate accuracy\n\
  \    test_predictions = forward_prop(X_test.transpose())[3]  # grab only A2\n  \
  \  test_comparisons = np.equal((test_predictions >= .5).flatten().astype(int),\n\
  \                                Y_test)\n    accuracy = sum(test_comparisons.astype(int)\
  \ / X_test.shape[0])\n    print(\"ACCURACY: \", accuracy)\n```\n\n这里有很多内容，但它建立在本章学到的其他所有内容之上。我们执行\
  \ 100,000 次随机梯度下降迭代。将训练数据和测试数据分别按 2/3 和 1/3 分割，根据随机性的不同，我在测试数据集上大约能获得 97-99% 的准确率。这意味着训练后，我的神经网络能正确识别\
  \ 97-99% 的测试数据，做出正确的浅色/深色字体预测。\n\n这里的关键是 backward_prop() 函数，它实现了链式法则，获取输出节点的误差（平方残差），然后将其拆分并反向传播到输出权重/偏置和隐藏权重/偏置，以求得每个权重/偏置的斜率。接着，我们在\
  \ for 循环中分别利用这些斜率微调权重/偏置，乘以学习率 L，就像在第 5 章和第 6 章中所做的那样。我们进行一些矩阵-向量乘法，根据斜率反向传播误差，并在需要时转置矩阵和向量，以使行和列之间的维度匹配。\n\
  \n如果你想让神经网络更具交互性，以下是示例 7-12 中的一段代码片段，我们可以输入不同的背景颜色（通过 R、G、B 值），看看它是预测浅色字体还是深色字体。将其追加到之前代码示例\
  \ 7-11 的底部，试一试吧！\n\n### 示例 7-12. 为我们的神经网络添加交互式 shell\n\n```python\n# Interact and\
  \ test with new colors\ndef predict_probability(r, g, b):\n    X = np.array([[r,\
  \ g, b]]).transpose() / 255\n    Z1, A1, Z2, A2 = forward_prop(X)\n    return A2\n\
  \ndef predict_font_shade(r, g, b):\n    output_values = predict_probability(r, g,\
  \ b)\n    if output_values > .5:\n        return \"DARK\"\n    else:\n        return\
  \ \"LIGHT\"\n\nwhile True:\n    col_input = input(\"Predict light or dark font.\
  \ Input values R,G,B: \")\n    (r, g, b) = col_input.split(\",\")\n    print(predict_font_shade(int(r),\
  \ int(g), int(b)))\n```\n\n从零构建自己的神经网络需要大量工作和数学知识，但这能让你深入了解其本质。通过逐层学习、微积分和线性代数，我们能更强烈地感受到\
  \ PyTorch 和 Tensorflow 等深度学习库在幕后所做的工作。\n\n通读本章后你可能已经了解，让神经网络运转起来有很多组成部分。在代码的不同部分设置断点，查看每个矩阵操作在做什么，这可能会有所帮助。你还可以将代码移植到\
  \ Jupyter Notebook 中，以便更直观地了解每个步骤。\n\n> # 3BLUE1BROWN 论反向传播\n>\n> 3Blue1Brown 有几段经典视频，讲解反向传播以及神经网络背后的微积分。\n\
  >\n> https://youtu.be/llg3gGewQ5U\n> https://youtu.be/tleHLnjs5U8\n\n## 使用 Scikit-learn\n\
  \nScikit-learn 中有一些有限的神经网络功能。如果你认真对待深度学习，可能会想学习 PyTorch 或 Tensorflow，并配备一台拥有强大 GPU\
  \ 的电脑（这是买你一直想要的游戏电脑的一个绝佳理由！）。我听说现在所有酷孩子都在使用 PyTorch。不过，Scikit-learn 确实提供了一些方便的模型，包括\
  \ MLPClassifier，即“多层感知器分类器”。这是一种专为分类设计的神经网络，默认使用 logistic 输出激活函数。\n\n示例 7-13 是我们开发的背景颜色分类应用程序的\
  \ Scikit-learn 版本。activation 参数指定隐藏层。\n\n### 示例 7-13. 使用 Scikit-learn 神经网络分类器\n\n\

  图 A-8. 我们线性规划系统的最大化目标。\n\n虽然我们可以使用 NumPy 和大量矩阵运算来数值求解此问题，但使用如示例 A-11 所示的 PuLP 会更容易。请注意，`LpVariable`\
  \ 定义要求解的变量。`LpProblem` 是使用 Python 运算符添加约束和目标函数的线性规划系统。然后通过在 `LpProblem` 上调用 `solve()`\
  \ 来求解变量。\n\n## 示例 A-11. 使用 Python PuLP 求解线性规划系统\n\n```\n# GRAPH: https://www.desmos.com/calculator/iildqi2vt7\n\
  from pulp import *\n\n# declare your variables\nx = LpVariable(\"x\", 0)  # 0<=x\n\

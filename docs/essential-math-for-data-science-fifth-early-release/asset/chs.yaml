  , LpMaximize)\n\n# defines the constraints\nprob += x + 3*y <= 20\nprob += 6*x +2*y\
  \ <= 45\n\n# defines the objective function to maximize\nprob += 200*x + 300*y\n\
  \n# solve the problem\nstatus = prob.solve()\nprint(LpStatus[status])\n\n# print\
  \ the results x = 5.9375, y = 4.6875\nprint(value(x))\nprint(value(y))\n```\n\n\

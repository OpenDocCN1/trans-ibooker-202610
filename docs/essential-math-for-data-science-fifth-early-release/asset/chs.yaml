  \ A-3 中包含了你需要的所有部分。\n\n### 示例 A-3. 从零开始构建二项分布\n\n```python\n# Factorials multiply\
  \ consecutive descending integers down to 1\n# EXAMPLE: 5! = 5 * 4 * 3 * 2 * 1\n\
  def factorial(n: int):\n    f = 1\n    for i in range(n):\n        f *= (i + 1)\n\
  \    return f\n\n# Generates the coefficient needed for the binomial distribution\n\
  def binomial_coefficient(n: int, k: int):\n    return factorial(n) / (factorial(k)\
  \ * factorial(n - k))\n\n# Binomial distribution calculates the probability of k\
  \ events out of n trials\n# given the p probability of k occurring\ndef binomial_distribution(k:\
  \ int, n: int, p: float):\n    return binomial_coefficient(n, k) * (p ** k) * (1.0\
  \ - p) ** (n - k)\n\n# 10 trials where each has 90% success probability\nn = 10\n\
  p = 0.9\n\nfor k in range(n + 1):\n    probability = binomial_distribution(k, n,\
  \ p)\n    print(\"{0} - {1}\".format(k, probability))\n```\n\n使用 `factorial()` 和\
  \ `binomial_coefficient()`，我们可以从零开始构建二项分布函数。阶乘函数将 1 到 n 的连续整数范围相乘。例如，5! 的阶乘是 1*2*3*4*5\
  \ = 120。\n\n二项系数函数允许我们从 n 种可能性中选取 k 种结果，而不考虑顺序。如果 k = 2 且 n = 3，那么将分别生成集合 (1,2)\
  \ 和 (1,2,3)。在这两个集合之间，可能的不同组合为 (1,3)、(1,2) 和 (2,3)。共有 3 种组合，因此二项系数为 3。当然，使用 `binomial_coefficient()`\
  \ 函数，我们可以通过阶乘和乘法来避免所有排列工作。\n\n在实现 `binomial_distribution()` 时，请注意我们如何取二项系数，并将其乘以成功概率\
  \ p 发生 k 次（即指数）的概率。然后我们将其乘以相反的情况：失败概率 1.0 - p 发生 n - k 次的概率。这样我们就可以考虑事件在多次试验中发生与不发生的概率\
  \ p。\n\n### 从零开始实现β分布\n\n如果你很好奇如何从零开始构建β分布，你需要重用用于二项分布的 `factorial()` 函数，以及上一章中构建的\
  \ `approximate_integral()` 函数。\n\n就像我们在上一章中所做的那样，我们将感兴趣范围内的矩形堆积在曲线下方，如图 A-2 所示。\n\
  \n![](img/8e0dcc1636d032e7728a07e97751e446_409_0.png)\n\n图 A-2. 在曲线下方堆积矩形以求面积/概率\n\
  \n这里只使用了 6 个矩形，如果使用更多矩形，精度会更高。让我们从零开始实现 `beta_distribution()`，并在 .9 到 1.0 之间积分 1000\
  \ 个矩形，如示例 A-4 所示。\n\n### 示例 A-4. β分布从零开始\n\n```python\n# Factorials multiply consecutive\
  \ descending integers down to 1\n# EXAMPLE: 5! = 5 * 4 * 3 * 2 * 1\ndef factorial(n:\
  \ int):\n    f = 1\n    for i in range(n):\n        f *= (i + 1)\n    return f\n\
  ```\n\n```python\ndef approximate_integral(a, b, n, f):\n    delta_x = (b - a) /\
  \ n\n    total_sum = 0\n\n    for i in range(1, n + 1):\n        midpoint = 0.5\
  \ * (2 * a + delta_x * (2 * i - 1))\n        total_sum += f(midpoint)\n\n    return\
  \ total_sum * delta_x\n```\n\n```python\ndef beta_distribution(x: float, alpha:\
  \ float, beta: float) -> float:\n    if x < 0.0 or x > 1.0:\n        raise ValueError(\"\
  x must be between 0.0 and 1.0\")\n\n    numerator = x ** (alpha - 1.0) * (1.0 -\
  \ x) ** (beta - 1.0)\n    denominator = (1.0 * factorial(alpha - 1) * factorial(beta\
  \ - 1)) / (1.0 *\n    factorial(alpha + beta - 1))\n\n    return numerator / denominator\n\
  ```\n\n```python\ngreater_than_90 = approximate_integral(a=.90, b=1.0, n=1000, f=lambda\
  \ x:\nbeta_distribution(x, 8, 2))\nless_than_90 = 1.0 - greater_than_90\n\nprint(\"\
  GREATER THAN 90%: {}, LESS THAN 90%: {}\".format(greater_than_90,\nless_than_90))\n\
  ```\n\n你会发现，在 `beta_distribution()` 函数中，我们提供一个给定概率 x、一个量化成功的 alpha 值，以及一个量化失败的 beta\
  \ 值。该函数将返回观察到给定可能性 x 的可能性。但同样，为了获得观察概率 x 的概率，我们需要在 x 值的范围内找到一个区域。幸运的是，我们已经从上一章中定义好了\
  \ `approximate_integral()` 函数，可以直接使用。我们可以计算成功率大于 90% 以及小于 90% 的概率，如上文最后几行所示。\n\n\
  ### 推导贝叶斯定理\n\n如果你想理解贝叶斯定理为什么有效，而不仅仅是听我说，让我们做一个思想实验。假设我有 100,000 人的人口。用给定的概率乘以它，得到喝咖啡的人数和患癌症的人数。\n\
  \n```\nN = 100,000\n\nP(Coffee Drinker) = .65\n\nP(Cancer) = .005\n\nCoffee Drinkers\
  \ = 65,000\n\nCancer Patients = 500\n```\n\n我们有 65,000 名咖啡饮用者和 500 名癌症患者。在这 500\
  \ 名癌症患者中，有多少人喝咖啡？我们得到了条件概率 P(Coffee|Cancer)，可以将其乘以这 500 人，这应该能得出 425 名喝咖啡的癌症患者。\n\
  \n```\nP(Coffee Drinker|Cancer) = .85\n\nCoffee Drinkers with Cancer = 500×.85 =\
  \ 425\n```\n\n那么，喝咖啡的人中患癌症的百分比是多少？我们要除以哪两个数字？我们已经知道了既喝咖啡又患癌症的人数。因此，我们将这个数字与咖啡饮用者的总数进行比例计算。\n\
  \n```\nP(Cancer|Coffee Drinker) = \\frac{Coffee Drinkers with Cancer}{Coffee Drinkers}\n\
  \nP(Cancer|Coffee Drinker) = \\frac{425}{65,000}\n\nP(Cancer|Coffee Drinker) = 0.006538\n\
  ```\n\n等等，我们刚刚翻转了条件概率吗？是的，我们做到了！我们从 P(Coffee Drinker|Cancer) 开始，最终得到了 P(Cancer|Coffee\
  \ Drinker)。通过取出人群的两个子集（65,000 名咖啡饮用者和 500 名癌症患者），然后应用我们拥有的条件概率的联合概率，我们最终得到了 425\
  \ 名既喝咖啡又患癌症的人。然后我们将其除以咖啡饮用者的人数，得到给定某人是咖啡饮用者时患癌症的概率。\n\n\n\n\n\n但此处的贝叶斯定理在哪里呢？让我们专注于\
  \ $P(\\text{Cancer}|\\text{Coffee Drinker})$ 表达式，并用我们先前计算的所有表达式来展开它。\n\n$P(\\text{Cancer}|\\\
  text{Coffee Drinker}) = \\frac{100,000 \\times P(\\text{Cancer}) \\times P(\\text{Coffee\
  \ Drinker}|\\text{Cancer})}{100,000 \\times P(\\text{Coffee Drinker})}$\n\n请注意，100,000\
  \ 的总体 N 既出现在分子中也出现在分母中，因此会被约掉。现在这看起来熟悉了吗？\n\n$P(\\text{Cancer}|\\text{Coffee Drinker})\
  \ = \\frac{P(\\text{Cancer}) \\times P(\\text{Coffee Drinker}|\\text{Cancer})}{P(\\\
  text{Coffee Drinker})}$\n\n果然，这应该与贝叶斯定理相符！\n\n$P(\\text{A}|\\text{B}) = \\frac{P(\\\
  text{B}|\\text{A})*P(\\text{B})}{P(\\text{A})}$\n\n$P(\\text{Cancer}|\\text{Coffee\
  \ Drinker}) = \\frac{P(\\text{Cancer}) \\times P(\\text{Coffee Drinker}|\\text{Cancer})}{P(\\\
  text{Coffee Drinker})}$\n\n因此，如果你对贝叶斯定理感到困惑，或难以掌握其背后的直觉，不妨根据给定的概率对固定总体进行子集抽取。然后你就可以沿着思路，将条件概率“翻转”过来。\n\
  \n## 从零开始实现 CDF 和逆 CDF\n\n为了计算正态分布下的面积，我们当然可以使用第 1 章学到、并在第 2 章中应用于β分布的矩形填充法。它不需要累积分布函数（CDF），只是在概率密度函数（PDF）下方堆放矩形。使用这种方法，我们可以找到一只金毛寻回犬体重在\
  \ 61 到 62 磅之间的概率，如示例 A-5 所示，使用 1000 个堆叠的矩形与正态 PDF 进行计算。\n\n### 示例 A-5. Python 中的正态分布函数\n\
  \n```\nimport math\n```\n\n```\ndef normal_pdf(x: float, mean: float, std_dev: float)\
  \ -> float:\n    return (1.0 / (2.0 * math.pi * std_dev ** 2) ** 0.5) *\n      \
  \     math.exp(-1.0 * ((x - mean) ** 2 / (2.0 * std_dev ** 2)))\n```\n\n```\ndef\
  \ approximate_integral(a, b, n, f):\n    delta_x = (b - a) / n\n    total_sum =\
  \ 0\n    for i in range(1, n + 1):\n        midpoint = 0.5 * (2 * a + delta_x *\
  \ (2 * i - 1))\n        total_sum += f(midpoint)\n\n    return total_sum * delta_x\n\
  ```\n\n```\np_between_61_and_62 = approximate_integral(a=61, b=62, n=7,\n      \
  \                             f=lambda x: normal_pdf(x, 64.43, 2.99))\nprint(p_between_61_and_62)\
  \ # 0.0825344984983386\n```\n\n这将给我们大约 8.25% 的概率，即一只金毛寻回犬的体重在 61 到 62 磅之间。如果我们想利用已经为我们积分好的累积分布函数，且无需任何矩形堆叠，我们可以像示例\
  \ A-6 所示从零开始声明它。\n\n### 示例 A-6. 在 Python 中使用逆 CDF（称为 ppf()）\n\n```\nimport math\n\
  def normal_cdf(x: float, mean: float, std_dev: float) -> float:\n    return (1 +\
  \ math.erf((x - mean) / math.sqrt(2) / std_dev)) / 2\nmean = 64.43\nstd_dev = 2.99\n\
  x = normal_cdf(66, mean, std_dev) - normal_cdf(62, mean, std_dev)\nprint(x) # prints\
  \ 0.49204501470628936\n```\n\nmath.erf() 被称为误差函数，常用于计算累积分布。最后，要从零开始实现逆 CDF，你需要使用\
  \ erf() 函数的逆函数，称为 erfinv()。示例 A-7 使用从零开始编码的逆 CDF 计算了 1000 个随机生成的金毛寻回犬体重。\n\n###\
  \ 示例 A-7. 生成随机金毛寻回犬体重\n\n```\nimport random\nfrom scipy.special import erfinv\n\
  def inv_normal_cdf(p: float, mean: float, std_dev: float):\n    return mean + (std_dev\
  \ * (2.0 ** 0.5) * erfinv((2.0 * p) - 1.0))\nmean = 64.43\nstd_dev = 2.99\nfor i\
  \ in range(0, 1000):\n    random_p = random.uniform(0.0, 1.0)\n    print(inv_normal_cdf(random_p,\
  \ mean, std_dev))\n```\n\n## 使用 e 来预测随时间变化的事件概率\n\n让我们再看一个 e 的实用用例。假设你是一家丙烷罐制造商。显然你不希望罐体泄漏，否则可能会造成危险，尤其是在明火和火花附近。在测试一种新罐体设计时，你的工程师报告称，在任何给定年份，它泄漏的概率为\
  \ 5%。\n\n你知道这个数字已经高到不可接受，但你想知道这个概率随时间如何复合。你现在问自己：“在 2 年内、5 年内、10 年内发生泄漏的概率是多少？”暴露的时间越长，看到罐体泄漏的概率不会只会越高吗？欧拉数\
  \ e 又可以来解救了！\n\n```\nP_{leak} = 1.0 - e^{-\\lambda T}\n```\n\n上述函数模拟了随时间变化的事件概率，在此情况下即罐体在\
  \ T 时间后泄漏的概率。e 再次是欧拉数，lambda λ 是每个时间单位（每年）的故障率，T 是已过去的时间量（年数）。\n\n如果我们将此函数作图，其中\
  \ T 为横轴，泄漏概率为纵轴，且 λ = .05，我们将得到图 A-3 中所示的结果：\n\n![](img/8e0dcc1636d032e7728a07e97751e446_415_0.png)\n\
  \n图 A-3. 预测随时间变化的泄漏概率\n\n以下是我们如何在 Python 中为 λ = .05 和 T = 5 年建模此函数，如示例 A-8 所示。\n\
  \n### 示例 A-8. 预测随时间变化的泄漏概率的代码\n\n```\nfrom math import exp\n\n# Probability of leak\
  \ in 1 year\np_leak = .05\n\n# number of years\nt = 5\n\n# Probability of leak within\
  \ 5 years\n# 0.22119921692859512\np_leak_5_years = 1.0 - exp(-p_leak * t)\n\nprint(\"\
  PROBABILITY OF LEAK WITHIN 5 YEARS: {}\".format(p_leak_5_years))\n```\n\n罐体在 2 年后发生故障的概率约为\
  \ 9.5%，5 年约为 22.1%，10 年约为 39.3%。时间一久，罐体泄漏的可能性就越大。我们可以将此公式推广，以预测任何在给定期间内具有概率的事件，并查看该概率在不同时间段内如何变化。\n\
  \n## 山爬算法与线性回归\n\n如果你觉得在从零开始构建机器学习时微积分令人不知所措，可以尝试一种更蛮力的方法。让我们尝试一种山爬算法，在若干次迭代中通过添加随机值来随机调整\
  \ m 和 b。这些随机值可以是正数或负数（这会使加法操作实质上变成减法），我们只保留改善平方和的调整。\n\n但是，我们就随意生成任何随机数作为调整量吗？我们希望更倾向于较小的移动，但偶尔可能会允许较大的移动。这样我们大多数时候进行微调，但在需要时偶尔也会做出大跳跃。实现此目的的最佳工具是使用标准正态分布，均值为\
  \ 0，标准差为 1。回顾第 3 章，标准正态分布在 0 附近具有高值密度，而值距离 0 越远（无论是负方向还是正方向），该值出现的可能性就越小，如图 A-4\
  \ 所示。\n\n![](img/8e0dcc1636d032e7728a07e97751e446_417_0.png)\n\n图 A-4. 标准正态分布中的大多数值都很小且接近\
  \ 0，而较大的值在尾部出现的频率较低\n\n回到线性回归，我们将 m 和 b 从 0 或某些其他起始值开始。然后在 `for` 循环中进行 150,000 次迭代，通过添加从标准正态分布中采样的值来随机调整\
  \ m 和 b。如果随机调整改善/减小了平方和，我们就保留它。但如果平方和增加了，我们就撤销该随机调整。换句话说，我们只保留改善平方和的调整。让我们在示例 A-9\
  \ 中看一下。\n\n### 示例 A-9.\n\n```\nfrom numpy.random import normal\nimport pandas as\
  \ pd\n\n# Import points from CSV\npoints = [p for p in pd.read_csv(\"https://bit.ly/2KF29Bd\"\
  ).itertuples()]\n\n# Building the model\nm = 0.0\nb = 0.0\n\n# The number of iterations\
  \ to perform\niterations = 150000\n\n# Number of points\nn = float(len(points))\n\
  \n# Initialize with a really large loss\n# that we know will get replaced\nbest_loss\
  \ = 1000000000000.0\n\nfor i in range(iterations):\n    # Randomly adjust \"m\"\
  \ and \"b\"\n    m_adjust = normal(0,1)\n    b_adjust = normal(0,1)\n\n    m +=\
  \ m_adjust\n    b += b_adjust\n\n    # Calculate loss, which is total sum squared\
  \ error\n    new_loss = 0.0\n    for p in points:\n        new_loss += (p.y - (m\
  \ * p.x + b)) ** 2\n\n    # If loss has improved, keep new values. Otherwise revert.\n\
  \    if new_loss < best_loss:\n        print(\"y = {0}x + {1}\".format(m, b))\n\
  \        best_loss = new_loss\n    else:\n        m -= m_adjust\n        b -= b_adjust\n\
  \nprint(\"y = {0}x + {1}\".format(m, b))\n```\n\n你将看到算法的进展，但最终你应该得到一个拟合函数，大约为 y\
  \ = 1.9395722046562853x + 4.731834051245578，左右可能略有不同。让我们验证一下这个答案。当我使用 Excel 或 Desmos\
  \ 为我执行线性回归时，Desmos 给出了 y = 1.93939x + 4.73333。不赖！我已经非常接近了！\n\n为什么我们需要 100 万次迭代？通过实验，我发现经过足够多的迭代后，解不再有多大改进，并且\
  \ m 和 b 的最优值收敛到可以最小化平方和的非常接近的位置。你会发现许多机器学习库和算法都会有一个执行迭代次数的参数，它正是起到这个作用。你需要有足够的\n\
  \n\n\n所以它大约会收敛到正确答案，但不会过度，以免在已经找到可接受解时浪费计算时间。\n\n你可能还有另一个疑问，为什么我将 `best_loss` 初始化为一个极大的数值。我这么做是为了用一个我知道在搜索开始后会被覆盖的值来初始化最佳损失，然后它将与每次迭代的新损失进行比较，以查看是否带来改进。我本来也可以使用正无穷\
  \ `float( 'inf' )`，而不是一个非常大的数字。\n\n## 爬山算法与逻辑回归\n\n就像前面线性回归的例子一样，我们也可以将爬山算法应用于逻辑回归。如果你觉得微积分和偏导数一次性太多，也可以再次使用这种技术。\n\
  \n爬山算法的方法论是相同的：使用正态分布中的随机值调整 m 和 b。不过，我们有一个不同的目标函数，即第 6 章讨论过的最大似然估计。因此，我们只采取增加似然估计的随机调整，经过足够多的迭代后，我们应该能收敛到一个拟合的逻辑回归。\n\
  \n所有这些都在示例 A-10 中演示。\n\n_示例 A-10. 为简单逻辑回归使用爬山算法._\n\n```\nimport math\nimport random\n\
  import numpy as np\nimport pandas as pd\n\n# Desmos graph: https://www.desmos.com/calculator/6cb10atg3l\n\
  points = [p for p in pd.read_csv(\"https://tinyurl.com/y2coco07\").itertuples()]\n\
  best_likelihood = -10_000_000\nb0 = .01\nb1 = .01\n\n# calculate maximum likelihood\n\
  def predict_probability(x):\n    p = 1.0 / (1.0001 + math.exp(-(b0 + b1 * x)))\n\
  \    return p\n\nfor i in range(1_000_000):\n# Select b0 or b1 randomly, and adjust\
  \ it randomly\nrandom_b = random.choice(range(2))\n\nrandom_adjust = np.random.normal()\n\
  \nif random_b == 0:\n    b0 += -random_adjust\nelif random_b == 1:\n    b1 += random_adjust\n\
  \n# Calculate total likelihood\ntrue_estimates = sum(math.log(predict_probability(p.x))\
  \ for p in points if p.y == 1.0)\nfalse_estimates = sum(math.log(1.0 - predict_probability(p.x))\
  \ for p in points if p.y == 0.0)\n\ntotal_likelihood = true_estimates + false_estimates\n\
  \n# If likelihood improves, keep the random adjustment. Otherwise revert.\nif best_likelihood\
  \ < total_likelihood:\n    best_likelihood = total_likelihood\nelif random_b ==\
  \ 0:\n    b0 -= random_adjust\nelif random_b == 1:\n    b1 -= random_adjust\n\n\
  print(\"1.0 / (1 + exp(-({0} + {1}*x))\".format(b0, b1))\nprint(\"BEST LIKELIHOOD:\
  \ {0}\".format(math.exp(best_likelihood)))\n```\n\n有关最大似然估计、逻辑函数以及我们使用 log() 函数的原因的更多详细信息，请参阅第\
  \ 6 章。\n\n## 线性规划简介\n\n每个数据科学专业人士都应该熟悉的一种技术是 **线性规划**，它通过引入“松弛变量”来适应方程组求解不等式系统。当线性规划系统中的变量是离散整数或二进制变量（0\
  \ 或 1）时，它被称为 **整数规划**。当同时使用线性连续变量和整数变量时，它被称为 **混合整数规划**。\n\n尽管线性规划及其变体更多是算法驱动而非数据驱动，但它们可以用于解决大量经典的“人工智能”问题。虽然将线性规划系统称为“人工智能”听起来可能存疑，但许多供应商和公司都普遍采用这种做法，因为这会提升其感知价值。\n\
  \n在实践中，最好使用众多可用的求解器库来为你执行线性规划，但本节末尾将提供从头开始实现的资源。对于这些示例，我们将使用 PuLP，不过 Pyomo 也是一个选项。我们还将使用图形直觉，尽管超过三维的问题不容易可视化。\n\
  \n以下是我们的示例。你有两条产品线：iPac 和 iPac Ultra。iPac 每单位利润为 200 美元，而 iPac Ultra 每单位利润为 300\
  \ 美元。\n\n然而，装配线每天只能工作 20 小时，生产一个 iPac 需要 1 小时，生产一个 iPac Ultra 需要 3 小时。\n\n每天只能提供\
  \ 45 套组件，iPac 需要 6 套，而 iPac Ultra 需要 2 套。\n\n假设所有供应都能售出，我们应该销售多少 iPac 和 iPac Ultra\
  \ 才能最大化利润？\n\n首先，我们先记录第一个约束并将其拆解。\n\n- ...装配线每天只能工作 20 小时，生产一个 iPac 需要 1 小时，生产一个\
  \ iPac Ultra 需要 3 小时。\n\n我们可以将其表示为一个不等式，其中 x 是 iPac 的单位数量，y 是 iPac Ultra 的单位数量。两者都必须为正，图\
  \ A-5 显示我们可以相应地绘图。\n\n$x + 3y \\le 20(x \\ge 0, y \\ge 0)$\n\n![](img/8e0dcc1636d032e7728a07e97751e446_422_0.png)\n\
  \n图 A-5. 绘制第一个约束\n\n现在让我们看看第二个约束。\n\n每天只能提供 45 套组件，iPac 需要 6 套，而 iPac Ultra 需要 2\
  \ 套。\n\n我们也可以如图 A-6 所示建模并绘图。\n\n```\n6x + 2y ≤ 45(x ≥ 0, y ≥ 0)\n```\n\n![](img/8e0dcc1636d032e7728a07e97751e446_423_0.png)\n\
  \n图 A-6. 绘制第二个约束\n\n注意在图 A-6 中，我们现在有了这两个约束之间的重叠。我们的解位于该重叠区域内，我们称之为 *可行域*。最后，我们要最大化利润\
  \ Z，根据 iPac 和 iPac Ultra 各自的利润金额，可以如下表示：\n\n```\nZ = 200x + 300y\n```\n\n如果将此函数表示为一条直线，我们可以尽可能增加\

  md: '# PYTHON IS SLOW, ITS NUMERICAL LIBRARIES ARE NOT


    Python is a computationally slow language platform, as it does not compile to
    lower-level machine code like Java, C#, C, etc. It is dynamically interpreted
    at runtime. However Python’s numeric and scientific libraries are not slow. Libraries
    like NumPy are typically written in low-level languages like C and C++, hence
    why they are computationally efficient. Python really acts as “glue code” integrating
    these libraries for your tasks.


    A vector has countless practical applications. In physics, a vector is often thought
    of as a direction and magnitude. In math it is a direction and scale on an XY
    plane, kind of like a movement. In computer science, it is an array of numbers
    storing data. The computer science context is the one we will become the most
    familiar with as data science professionals. However it is important we never
    forget the visual aspect so we do not think of vectors as esoteric grids of numbers.
    Without a visual understanding it is almost impossible to grasp many fundamental
    linear algebra concepts like linear dependence and determinants.


    Here are some more examples of vectors. In Figure 4-2 note that some of these
    vectors have negative directions on the X and Y scales. Vectors with negative
    directions will have an impact when we combine them later, essentially subtracting
    rather than adding them together.'

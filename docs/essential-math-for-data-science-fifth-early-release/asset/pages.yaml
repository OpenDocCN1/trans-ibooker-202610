    # Confusion Matrices


    Suppose a model observed people with the name “Michael” quit their job. The reason
    why first and last name are captured as input variables is indeed questionable,
    as it is doubtful someone’s name has any impact on whether they quit. However,
    to simplify the example, let’s go with it. The model then predicts that any person
    named “Michael” will quit their job.


    Now this is where accuracy falls apart. I have 100 employees, including one named
    “Michael” and another named “Samantha”. Michael is wrongly predicted to quit,
    and it is Samantha that ends up quitting. What’s the accuracy of my model? It
    is 98% because there were only 2 wrong predictions out of 100 employees as visualized
    in Figure 6-17.'

  md: 'Figure 4-8. Scaling down a vector by half


    # MANIPULATING DATA IS MANIPULATING VECTORS


    Every data operation can be thought of in terms of vectors, even simple averages.


    Take scaling for example. Let’s say we were trying to get the average house value
    and average square footage for an entire neighborhood. We would add the vectors
    together to combine their value and square footage respectively, giving us one
    giant vector containing both total value and total square footage. We then scale
    down the vector by dividing by the number of houses N, which really is multiplying
    by 1/N. We now have a vector containing the average house value and average square
    footage.


    An important detail to note here is that scaling a vector does not change its

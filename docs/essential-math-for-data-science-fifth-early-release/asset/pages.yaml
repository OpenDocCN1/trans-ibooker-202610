- pgno: 363
  md: 'It turns out that when we collect data from Stanford Hospital, then we train
    and test on data from the same hospital, indeed, we can publish papers showing
    [the algorithms] are comparable to human radiologists in spotting certain conditions.


    It turns out [that when] you take that same model, that same AI system, to an
    older hospital down the street, with an older machine, and the technician uses
    a slightly different imaging protocol, that data drifts to cause the performance
    of AI system to degrade significantly. In contrast, any human radiologist can
    walk down the street to the older hospital and do just fine.


    So even though at a moment in time, on a specific data set, we can show this works,
    the clinical reality is that these models still need a lot of work to reach production.
    —Andrew Ng


    [1] https://spectrum.ieee.org/andrew-ng-xrays-the-ai-hype


    In other words, the machine learning overfitted to the Stanford hospital training
    and testing dataset. When taken to other hospitals with different machinery, the
    performance degraded significantly due to the overfitting.


    The same challenges occur with autonomous vehicles and “self-driving” cars. It
    is not just enough to train a neural network on one stop sign, but it has to be
    trained on countless combinations of conditions around that stop sign: good weather,
    rainy weather, night and day, with graffiti, blocked by a tree, in different locales,
    etc. In traffic scenarios, think of all the different types of vehicles, pedestrians,
    pedestrians dressed in costumes, and infinite number of edge cases that will be
    encountered! There is simply no effective way to capture every type of event that
    is encountered on the road just by having more weights and biases in a neural
    network.


    This is why autonomous vehicles themselves do not use neural networks in an end-to-end
    manner. Instead, different software and sensor modules are broken up where one
    module may use a neural network to draw a box around an object. Then another module
    will use a different neural network to classify the object in that box, such as
    a pedestrian. From there, traditional rule-based logic will attempt to predict
    the path of the pedestrian and hardcoded logic will choose from different conditions
    on how to react. The machine learning was limited to label-making activity, not
    the tactics and maneuvers of the vehicle. On top of that, basic sensors like radar
    will simply stop if an unknown object is detected in front of the vehicle, and
    this is just another piece of the technology stack that does not use machine learning
    or deep learning.


    This might be surprising given all the media headlines about neural networks and
    deep learning beating humans in games like Chess and Go, or even besting pilots
    in combat flight simulations. It is important to remember in reinforcement learning
    environments like these that simulations are closed-worlds, where infinite amounts
    of labelled data can'

    Oy vey! That’s a lot of calculation, and unfortunately SciPy and other mainstream
    data science libraries do not do this. But if you are inclined towards statistical
    analysis, this is very useful information. We not only create a prediction based
    on a linear regression (e.g. a dog that’s 8.5 years old will have 21.2145 vet
    visits), but we are actually able to say something much less absolute: there’s
    a 95% probability an 8.5 year old dog will visit the vet between 16.46 and 25.96
    times. Brilliant, right? And it’s a much safer claim because it captures a range
    rather than a single value, and thus accounts for uncertainty.


    # CONFIDENCE INTERVALS FOR THE PARAMETERS


    When you think about it, the linear regression line itself is a sample statistic,
    and there is a linear regression line for the whole population we are trying to
    infer. This means parameters like m and b have their own distributions, and we
    can model confidence intervals around m and b individually to reflect the population’s
    slope and y-intercept. This is beyond the scope of this book but it’s worth noting
    this type of analysis can be done.


    You can find resources to do these calculations from scratch but it might just
    be easier to use Excel’s regression tools or libraries for Python.


    # Train/Test Splits


    This analysis I just did with the correlation coefficient, statistical significance,

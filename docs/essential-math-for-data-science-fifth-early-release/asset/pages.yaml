- pgno: 310
  md: 'Just like linear regression, there is an $R^2$ for a given logistic regression.
    If you recall from Chapter 5, the $R^2$ indicates how well a given independent
    variable explains a dependent variable. Applying this to our chemical exposure
    problem, it makes sense we want to measure how much chemical exposure hours explains
    showing symptoms.


    There is not really a consensus on the best way to calculate the $R^2$ on a logistic
    regression, but a popular technique known as McFadden''s Pseudo $R^2$ closely
    mimics the $R^2$ used in linear regression. We will use this technique in the
    following examples and here is the formula:


    $$ R^2 = \frac{(\text{log likelihood}) - (\text{log likelihood fit})}{(\text{log
    likelihood})} $$


    We will learn how to calculate the “log likelihood fit” and “log likelihood” so
    we can calculate the $R^2$.


    We cannot use residuals here like in linear regression, but we can project the
    outcomes back onto the logistic curve as shown in Figure 6-12, and look up their
    corresponding likelihoods between 0.0 and 1.0.


    ![](img/8e0dcc1636d032e7728a07e97751e446_310_0.png)


    Figure 6-12. Projecting the output values back onto the logistic curve


    We can then take the log() of each of those likelihoods and sum them together.
    This will be the log likelihood of the fit. Just like we did calculating maximum
    likelihood, we will convert the “false” likelihoods by subtracting from 1.0.


    # Example 6-10. Calculating the log-likelihood of the fit


    ```

    from math import log, exp

    ```


    ```

    import pandas as pd

    ```


    ```

    patient_data = pd.read_csv(''https://bit.ly/33ebs2R'', delimiter=",").itertuples()

    ```'

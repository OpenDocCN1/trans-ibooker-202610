  md: 'identify the pour order for each. Remarkably she identified them all correctly,

    and the probability of this happening by chance is 1 in 70, or 0.01428571.


    This 1.4% probability is what we call the **p-value**, the probability something

    occurring by chance rather than because of a hypothesized explanation. Without

    going down a rabbit hole of combinatorial math, the probability that Muriel

    completely guessed the cups correctly is 1.4%. What exactly does that tell you?


    When we frame an experiment, whether it is determining if organic donuts cause

    weight gain or living near power lines causes cancer, we always have to

    entertain the possibility that random luck played a role. Just like there is a
    1.4%

    chance Muriel identified the cups of tea correctly simply by guessing, there’s

    always a chance randomness just gave us a good hand like a slot machine. This

    helps us frame our **null hypothesis (H0)**, saying that the variable in question

    had no impact on the experiment and any positive results is just random luck.

    The **alternative hypothesis (H1)** poses that a variable in question (called
    the


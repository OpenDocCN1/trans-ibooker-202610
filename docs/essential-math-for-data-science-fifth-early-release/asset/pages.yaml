  md: '# Deriving Bayes Theorem


    If you want to understand why Bayes Theorem works rather than take my word for
    it, let''s do a thought experiment. Let''s say I have a population of 100,000
    people. Multiply it with our given probabilities to get the count of people who
    drink coffee and the count of people who have cancer.


    ```

    N = 100,000


    P(Coffee Drinker) = .65


    P(Cancer) = .005


    Coffee Drinkers = 65,000


    Cancer Patients = 500

    ```


    We have 65,000 coffee drinkers and 500 cancer patients. Now of those 500 cancer
    patients, how many are coffee drinkers? We were provided with a conditional probability
    P(Coffee|Cancer) we can multiply against those 500 people, which should give us
    425 cancer patients who drink coffee.


    ```

    P(Coffee Drinker|Cancer) = .85


    Coffee Drinkers with Cancer = 500×.85 = 425

    ```


    Now what is the percentage of coffee drinkers who have cancer? What two numbers
    do we divide? We already have the number of people who drink coffee AND have cancer.
    Therefore we proportion that against the total number of coffee drinkers.


    ```

    P (Cancer|Coffee Drinker) = \frac{Coffee Drinkers with Cancer}{Coffee Drinkers}


    P (Cancer|Coffee Drinker) = \frac{425}{65,000}


    P(Cancer|Coffee Drinker) = 0.006538

    ```


    Hold on a minute, did we just flip our conditional probability? Yes we did! We
    started with P(Coffee Drinker|Cancer) and ended up with P(Cancer|Coffee Drinker).
    By taking two subsets of the population (65,000 coffee drinkers and 500 cancer
    patients), and then applying a joint probability using the conditional probability
    we had, we ended up with 425 people in our population who both drink coffee and
    have cancer. We then divide that by the number of coffee drinkers to get the probability
    of cancer given one''s a coffee drinker.'
  merge: -1
  img_proc: true
- pgno: 412
  md: "But where is Bayes Theorem in this? Let’s focus on the $P(\\text{Cancer}|\\\
    text{Coffee Drinker})$ expression and expand it with all the expressions we previously\
    \ calculated.\n\n$P(\\text{Cancer}|\\text{Coffee Drinker}) = \\frac{100,000 \\\
    times P(\\text{Cancer}) \\times P(\\text{Coffee Drinker}|\\text{Cancer})}{100,000\
    \ \\times P(\\text{Coffee Drinker})}$\n\nNotice the population N of 100,000 exists\
    \ in both the numerator and denominator so it cancels out. Does this look familiar\
    \ now?\n\n$P(\\text{Cancer}|\\text{Coffee Drinker}) = \\frac{P(\\text{Cancer})\
    \ \\times P(\\text{Coffee Drinker}|\\text{Cancer})}{P(\\text{Coffee Drinker})}$\n\
    \nSure enough, this should match Bayes Theorem!\n\n$P(\\text{A}|\\text{B}) = \\\
    frac{P(\\text{B}|\\text{A})*P(\\text{B})}{P(\\text{A})}$\n\n$P(\\text{Cancer}|\\\
    text{Coffee Drinker}) = \\frac{P(\\text{Cancer}) \\times P(\\text{Coffee Drinker}|\\\
    text{Cancer})}{P(\\text{Coffee Drinker})}$\n\nSo if you get confused by Bayes\
    \ Theorem or struggle with the intuition behind it, try taking subsets of a fixed\
    \ population based on the provided probabilities. You can then trace your way\
    \ to flip a conditional probability.\n\n# CDF and Inverse CDF from Scratch\n\n\
    To calculate areas for the normal distribution, we can of course use the rectangle-packing\
    \ method we learned in Chapter 1 and applied to the beta distribution in Chapter\
    \ 2. It does not require the cumulative density function (CDF) but simply packes\
    \ rectangles under the probability density function (PDF). Using this method,\
    \ we can find the probability a golden retriever weighs between 61 and 62 pounds\
    \ as shown in Example A-5, using 1000 packed rectangles against the normal PDF.\n\
    \nExample A-5. The normal distribution function in Python\n\n```\nimport math\n\
    ```\n\n```\ndef normal_pdf(x: float, mean: float, std_dev: float) -> float:\n\
    \    return (1.0 / (2.0 * math.pi * std_dev ** 2) ** 0.5) *\n           math.exp(-1.0\
    \ * ((x - mean) ** 2 / (2.0 * std_dev ** 2)))\n```\n\n```\ndef approximate_integral(a,\
    \ b, n, f):\n    delta_x = (b - a) / n\n```"

  md: '# # Chapter 7. Neural Networks


    A regression and classification technique that has enjoyed a renaissance over
    the past 10 years are neural networks. In the simplest definition, a **neural
    network** is a multi-layered regression containing layers of weights, biases,
    and nonlinear functions that reside between input variables and output variables.
    **Deep learning** is a popular variant of neural networks that utilizes multiple
    “hidden” (or middle) layers of nodes containing weights and biases. Each node
    resembles a linear function before being passed to a nonlinear function (called
    an activation function). Just like linear regression which we learned about in
    Chapter 5, optimization techniques like stochastic gradient descent are used to
    find the optimal weight and bias values to minimize the residuals.


    Neural networks offer exciting solutions to problems previously difficult for
    computers to solve. From identifying objects in images to processing words in
    audio, neural networks have created tools that affect our everyday lives. This
    includes virtual assistants and search engines, as well as photo tools in our
    iPhones.


    Given the media hoopla and bold claims dominating news headlines about neural
    networks, it may be surprising that they have been around since the 1950’s. The
    reason for their sudden popularity after 2010 is due to the growing availability
    of data and computing power. The ImageNet challenge between 2011 and 2015 was
    probably the largest driver of the renaissance, boosting performance on classifying
    1000 categories on 1.4 million images to an accuracy of 96.4%.


    However, like any machine learning technique it only works on narrowly defined
    problems. Even projects to create “self-driving” cars do not use end-to-end deep
    learning, and primarily use hand-coded rule systems with convoluted neural networks
    acting as a “label maker” for identifying objects on the road. We will discuss
    this later in this chapter to understand where neural networks are actually used.
    But first we will build a simple neural network in NumPy, and then use Scikit-learn
    as a library implementation.


    # ## When to Use Neural Networks and Deep Learning


    Neural networks and deep learning can be used for classification and regression,
    so how does it size up to linear regression, logistic regression, and other types
    of machine learning? You might have heard the expression “when all you have is
    a hammer, everything starts to look like a nail.” There are advantages and disadvantages
    that are situational for each type of algorithm. Linear regression and logistic
    regression, as well'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'as gradient boosted trees (which we did not cover in this book), do a pretty
    fantastic job making predictions on structured data. Think of “structured data”
    as data that is easily represented as a table, with rows and columns. But perceptual
    problems like image classification are much less structured, as we are trying
    to find fuzzy correlations between groups of pixels to identify shapes and patterns,
    not rows of data in a table. Trying to predict the next 4-5 words in a sentence
    being typed, or deciphering the words being said in an audio clip, are also perceptual
    problems and examples of neural networks being used for natural language processing.


    In this chapter, we will primarily focus on simple neural networks, with only
    1-2 hidden layers.


    # VARIANTS OF NEURAL NETWORKS


    Variants of neural networks include convolutional neural networks, which are often
    used for image recognition. Long-short Term Memory (LSTM) is used for predicting
    on time-series, or forecasting. Recurrent neural networks are often used for text-to-speech
    applications.


    # IS USING A NEURAL NETWORK OVERKILL?


    Using neural networks for the upcoming example is probably overkill, as a logistic
    regression would probably be more practical. Even a formulaiac approach can be
    used. However, I have always been a fan of understanding complex techniques by
    applying them to simple toy problems. You learn about the strengths and limitations
    of the technique rather than be distracted by large datasets. So with that in
    mind, try not to use neural networks where simpler models will be more practical.
    We will break this rule in this chapter for the sake of understanding the technique.


    # A Simple Neural Network


    Here is a simple toy example to get a feel for neural networks. I want to predict
    whether a font should be light (1) or dark (0) for a given color background. Here
    is a few examples of different background colors in Figure 7-1. The top row looks
    best with light font, and the bottom row looks best with dark font.'

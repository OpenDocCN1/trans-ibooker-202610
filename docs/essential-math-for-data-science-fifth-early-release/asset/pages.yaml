    # Systems of Equations and Inverse Matrices


    One of the basic use cases for linear algebra is solving systems of equations.
    It is also a good application to learn about inverse matrices. Let’s say you are
    provided with the following equations and you need to solve for x, y, and z.


    4x + 2y + 4z = 44

    5x + 3y + 7z = 56

    9x + 3y + 6z = 72


    You can try manually experimenting with different algebraic operations to isolate
    the three variables, but if you want a computer to solve it you will need to express
    this problem in terms of matrices as shown below. Extract the coefficients into
    matrix A, the values on the right-side of the equation into matrix B, and the
    unknown variables into matrix X.


    A = | 4 2 4 |

    | 5 3 7 |

    | 9 3 6 |


    B = | 44 |

    | 56 |

    | 72 |'

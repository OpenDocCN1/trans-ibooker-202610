  md: '# Chapter 7


    There''s obviously a lot of experimenting and alchemy you can try with different
    hidden layers, activation functions, different test dataset sizes, etc. I tried
    to use 1 hidden layer with 3 nodes with a ReLU activation, and I struggled to
    get good predictions on my test dataset. The confusion matrices and accuracy were
    consistently poor and any configuration changes I ran did just as poorly.


    The reason the neural network is probably failing is 1) the test dataset is far
    too small for a neural network (which are extremely data-hungry) and 2) there
    are simpler and more effective models like logistic regression for this type of
    problem. That’s not to say you can’t find a configuration that will work, but
    you have to be careful not to p-hack your way to a good result that overfits to
    the little training and test data you have.



    # # Special Types of Matrices


    There are a few special cases of matrices that are notable and we should cover.


    # ## Square Matrix


    The square matrix is a matix that has an equal number of rows and columns.


    ![](img/8e0dcc1636d032e7728a07e97751e446_206_0.png)


    They are primarily used to represent linear transformations, and are a requirement
    for many operations like eigendecomposition.


    # ## Identity Matrix


    The identity matrix is a square matrix that has a diagonal of 1''s while the other
    values are 0.'

- pgno: 365
  md: 'networks, and deep learning all work narrowly on defined problems. It cannot
    broadly reason or choose its own tasks, or ponder objects it has not seen before.
    Like any coded application, it only does what it was programmed to do.


    With whatever tool it takes, solve the problem. There should be no partiality
    to neural networks or any other tool at your disposal. With all of this in mind,
    using a neural network might not be the best option for the task in front of you.
    It is important to always consider what problem you are striving to solve without
    making a specific tool your primary objective. The use of deep learning has to
    be strategic and warranted. There are certainly use cases, but in most of your
    everyday work you will likely have more success with simpler and more biased models
    like linear regression, logistic regression, or traditional rule-based systems.
    But if you find yourself having to classify objects in images, and you have the
    budget and labor to build that dataset, then deep learning is going to be your
    best bet.


    # IS AN AI WINTER COMING?


    Are neural networks and deep learning useful? Absolutely! And it is definitely
    worth learning.


    That being said, there is a good chance you have seen media, politicians, and
    tech celebrities hail deep learning as some general artificial intelligence that
    can match, if not outperform, human intelligence and even destined to control
    the world. I have attended talks from authoritative figures in the software development
    community telling programmers they will be out of the job in a few years because
    of machine learning, and AI will take over writing code.


    Nearly a decade later, these predictions are still running late in 2022 because
    they are simply not true. We have seen far more AI challenges than breakthroughs,
    and I still have to drive my own car and write my own code. Neural networks are
    loosely inspired by the human brain, but are by no means a replication of them.
    Their capabilities are nowhere near on par with what you see in movies like The
    Terminator, Westworld, or WarGames. Instead, neural networks and deep learning
    work narrowly on specific problems, like recognizing dog and cat photos after
    being optimized on thousands of images. As stated earlier, it cannot reason or
    choose its own tasks, or contemplate uncertainty or objects it has not seen before.
    It only does what it was programmed to do.


    This disconnect may have inflated investment and expectations, resulting in a
    bubble that could burst. This would bring about another “AI winter,” where disillusionment
    and disappointment dry up funding in AI research. In North America, Europe, and
    Japan AI winters have happened multiple times since the 1960’s. There’s a good
    chance another AI winter is around the corner, but it does not mean neural networks
    and deep learning will lose usefulness. They will continue to be applied in the
    problems they are good at: computer vision, audio, natural language, and a few
    other domains. Maybe you can discover new ways to use them! Use what works best
    whether its linear regression, logistic regression, a traditional rule-based system,
    or a neural network. There is much more power in the simplicity of pairing the
    right tool to the right problem.


    # Conclusions'

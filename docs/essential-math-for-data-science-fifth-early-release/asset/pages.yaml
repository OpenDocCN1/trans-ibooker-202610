- pgno: 386
  md: 'But what about the aerospace defense company? If a fighter jet has an “AI”
    on board that automatically shoots targets, how catastrophic would it be if it
    is wrong? We are talking about human lives now, not movie recommendations!


    The risk tolerance gap between both of these industries is wide. Naturally, the
    aerospace defense company is going to be far more conservative implementing any
    experimental system. This means red tape and safety working groups evaluating
    and stopping any project they deem unacceptably high risk, and justifiably so.
    What’s interesting though is the success of AI in Silicon Valley startups, most
    in low-risk applications like movie recommendations, have created FOMO (“fear
    of missing out”) with the defense industry executives and leadership. This is
    likely because the disparity in risk tolerance between these two domains is not
    highlighted enough.


    Of course, there is a wide spectrum of risk severity between these two industries,
    between “irritated user” and “loss of human life.” Banks may use AI to determine
    who will qualify for loans, but that carries risks in discriminating against certain
    demographics. Criminal justice systems have experimented with AI in parole and
    surveillance systems, only to run into the same discrimination issues. Social
    media may use AI to determine what user posts are acceptable, but anger its users
    when it suppresses “harmless” content (false positives) as well as lawmakers when
    “harmful” content is not suppressed (false negatives).


    This demonstrates the need to know your industry. If you want to do lots of machine
    learning, you will probably want to work low-risk industries where false positives
    and false negatives do not endanger or upset anyone. But if none of that appeals
    to you, and you want to work on bolder applications like “self-driving” cars,
    aviation, and medicine then expect your machine learning models to get rejected
    a lot.


    In these higher risk industries, do not be surprised if specific PhD’s and other
    formal credentials are required. Even with a specialized PhD, false positives
    and false negatives do not magically disappear. If you do not want'

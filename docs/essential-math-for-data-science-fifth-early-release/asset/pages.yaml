    ,\").iteruples())\n\nn = len(points)\n\n# Regression line\nm = 1.939\nb = 4.733\n\
    \n# Calculate Standard Error of Estimate\nS_e = sqrt((sum((p.y - (m*p.x + b))**2\
    \ for p in points))/(n-2))\n\nprint(S_e)\n# 1.87406793500129\n```\n\nWhy _n_ –\
    \ 2 instead of _n_ – 1, like we have done in so many variance calculations in\
    \ Chapter 3? Without going too deep into mathematical proofs, this is because\
    \ a linear regression has two variables, not just one, so we have to increase\
    \ the uncertainty by one more in our degrees of freedom.\n\nYou will notice the\
    \ standard error of the estimate looks remarkably similar to the standard deviation\
    \ we studied in Chapter 3. This is not by accident. That is because it is the\
    \ standard deviation for a linear regresison.\n\n# Prediction Intervals"

- pgno: 9
  md: 'through 9, and not have more digits than that? Why do we have fractions and
    decimals and not just whole numbers? This area of math where we muse about numbers
    and why we designed them a certain way is known as number theory.


    **Number theory** goes all the way back to ancient times, where mathematicians
    study different number systems and why we have accepted them the way we do today.
    Here are different number systems that you may recognize:


    # *Natural Numbers*


    These are the numbers 1, 2, 3, 4, 5... and so on. Only positive numbers are included
    here, and are the earliest known system. Natural numbers are so ancient cavemen
    scratched tally marks on bones and cave walls to keep records.


    # *Whole Numbers*


    Adding to natural numbers, the concept of “0” was later accepted and we call these
    “whole numbers.” The Babylonians also developed the useful idea for place-holding
    notation for empty “columns” on numbers greater than 9, such as “10”, “1000”,
    or “1090.” Those zeros indicate no value occupying that column.


    # *Integers*


    Integers include positive and negative natural numbers as well as 0. We may take
    them for granted, but ancient mathematicians were deeply distrusting of the idea
    of negative numbers. But when you subtract 5 from 3, you get -2. This is useful
    especially when it comes to finances where we measure profits and losses. In 628
    AD, an Indian mathematician named Brahmagupta showed why negative numbers were
    necessary for arithmetic to progress with the quadratic formula, and therefore
    integers became accepted.


    # *Rational Numbers*'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'Any number that you can express as a fraction, such as 2/3, is a rational number.
    This includes all finite decimals and integers since they can be expressed as
    fractions too, such as 687/100 = 6.87 and 2/1 = 2 respectively. They are called
    rational because they are ratios. Rational numbers were quickly deemed necessary
    beceause because time, resources, and other quantities could not always be measured
    in discrete units. Milk does not always come in gallons. We may have to measure
    it as parts of a gallon. If I run for 12 minutes, I cannot be forced to measure
    in whole miles when in actuality I ran 9/10 of a mile.


    # Irrational Numbers


    Irrational numbers cannot be expressed as a fraction. This includes the famous
    π, square roots of certain numbers like √2, and Euler''s number e which we will
    learn about later. These numbers have an infinite number of decimal digits, such
    as π = 3.141592653589793238462...


    There is an interesting history behind irrational numbers. The Greek mathematician
    Pythagoras believed all numbers are rational. He believed this so fervently, he
    made a religion that prayed to the number 10. "Bless us, divine number, thou who
    generated gods and men!" he and his followers would pray (why "10" was so special,
    I do not know). There is a legend that one of his followers Hippasus proved not
    all numbers are rational simply by demonstrating the square root of 2. This severely
    messed with Pythagoras'' belief system, and he responded by drowning Hippasus
    out at sea.


    Regardless, we now know not all numbers are rational.


    # Real Numbers


    Real numbers include rational as well as irrational numbers. In practicality,
    when you are doing any data science work you can treat any decimals you work with
    as real numbers.


    # Complex and Imaginary Numbers'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'You encounter this number type when you take the square root of a negative
    number. While imaginary and complex numbers have relevance in certain types of
    problems, we will mostly steer clear from them for our purposes.


    In data science, you will find most (if not all) your work will be using natural
    numbers, integers, and real numbers. Imaginary numbers may be encountered in more
    advanced use cases such as matrix decomposition, which we will touch on in Chapter
    4>>.


    # COMPLEX AND IMAGINARY NUMBERS


    If you do want to learn about imaginary numbers, there is a great playlist Imaginary
    Numbers are Real on YouTube here: https://youtu.be/T647CGsu0VU.


    # # Order of Operations


    Hopefully you are familiar with **order of operations** which is the order you
    solve each part of a mathematical expression. As a brief refresher, recall you
    evaluate components in parentheses, followed by exponents, then multiplication,
    division, addition, and subtraction. You can remember the order of operations
    by the mnemonic device **PEMDAS** (Please Excuse My Dear Aunt Sally) which corresponds
    to the ordering paranthesis, exponents, multiplication, division, addition, and
    subtraction.


    Take for example this expression:


    ```

    2 \times \frac{(3 + 2)^2}{5} - 4

    ```


    First we evaluate the paranetheses (3 + 2) which evaluates to 5.


    ```

    2 \times \frac{(5)^2}{5} - 4

    ```'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'Next we solve the exponent, which we can see is squaring that 5 we just summed.
    That is 25.


    $$ 2 \times \frac{25}{5} - 4 $$


    Next up we have multiplication and division. The ordering of these two is swappable
    since division is also multiplication (using fractions). Let’s go ahead and multiply
    the 2 with the \(\frac{25}{5}\), yielding \(\frac{50}{5}\).


    $$ \frac{50}{5} - 4 $$


    Next we will perform the division, dividing 50 by 5 which will yield 10.


    $$ 10 - 4 $$


    And finally we perform any addition and subtraction. Of course, 10 − 4 is going
    to give us 6.


    $$ 10 - 4 = 6 $$


    Sure enough, if we were to express this in Python we would print a value of 6.0
    as shown in Example 1-1.


    # *Example 1-1. Solving an expression in Python*


    ```

    my_value = 2 * (3 + 2)**2 / 5 - 4

    print(my_value) # prints 6.0

    ```


    This may be elementary but it is still critical nonetheless. In code, even if
    you get the correct result without them, it is a good practice to liberally use
    parentheses in complex expressions so you establish control of the evaluation
    order.


    Here I group up the fractional part of my expression in parentheses, helping to
    set it apart from the rest of the expression in Example 1-2.


    # *Example 1-2. Making use of parentheses for clarity in Python*'
  merge: -1

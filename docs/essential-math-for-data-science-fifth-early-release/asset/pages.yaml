- pgno: 368
  md: 'Maybe you are just a curious professional wondering how math can be useful
    on a practical level, not just an academic one.


    I will do my best to meet the concerns of all these groups, and hopefully generalize
    some career advice that will be useful to most readers. Let’s start with redefining
    data science. We have objectively studied it and will now look in the context
    of career development and the future of the field.


    # IS THE AUTHOR BEING ANECDOTAL?


    It is hard to not sound anecdotal in tasks like this, where I dispense career
    advice sharing my own experiences (and experiences of others) rather than large,
    controlled surveys and studies like I advocate in Chapter 3. But here’s my pitch:
    I have worked in the Fortune 500 world for over a decade, and saw the transformation
    the data science movement had on organizations. I have spoken at many tech conferences
    around the world, and listened to countless peers react with “this has happened
    to us too!” I read many blogs and respected publications, from Wall Street Journal
    to Forbes, and learned to recognize disconnects between popular expectations and
    reality. I pay especially close attention to the kingmakers, the leaders, and
    followers across different industries and how they make or follow markets with
    data science and artificial intelligence. Currently, I teach and advise stakeholders
    in safety-critical applications of artificial intelligence at University of Southern
    California, in the Aviation Safety and Security Program.


    I only put a C.V. here to show that while I have not done formal surveys and studies,
    and perhaps I am compiling anecdotal information, there are persistent narratives
    I have found with all these sources of information. Vicki Boykis, an astute machine
    learning engineer at Tumblr, wrote a blog article sharing similar findings to
    mine, and I highly recommend reading it. You are welcome to take my findings with
    a grain of salt, but pay close attention to what is happening in your own work
    environment and identify assumptions that your management and colleagues subscribe
    to.


    # Redefining Data Science


    Data science is the analysis of data to gain actionable insights. In practice,
    it is an amalgamation of different data-related disciplines rolled into one: statistics,
    data analysis, data visualization, machine learning, operations research, software
    engineering... just to name a few. Pretty much any discipline that touches data
    can be branded as “data science.” This lack of clear definition has been problematic
    for the field. After all, anything that'

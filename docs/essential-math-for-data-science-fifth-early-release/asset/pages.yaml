  md: 'When we have a normal distribution following a linear regression line, we have
    not just one variable but a second one steering a distribution as well. There
    is a confidence interval around each y prediction and this is known as a prediction
    interval.


    Let''s bring back some context with our veterinary example, estimating the age
    of a dog and number of vet visits. I want to know the prediction interval for
    number of vet visits with 95% confidence for a dog that is 8.5 years old. What
    this prediction interval looks like is shown in Figure 5-17. We are 95% confident
    that an 8.5 year old dog will have had between 16.462 and 25.966 veterinary visits.'

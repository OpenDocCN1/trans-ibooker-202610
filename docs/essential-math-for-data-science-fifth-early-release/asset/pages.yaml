  md: 'the event of interest. As you work with probabilities though, you will more
    likely see it expressed as a decimal (in this case .70) which must be between
    0.0 and 1.0. P(X) = .70


    **Likelihood** is similar to probability, and it is easy to confuse the two (many
    dictionaries do as well). You can get away with using “probability” and “likelihood”
    interchangeably in everyday conversation. However, we should pin down these differences.
    Probability is about quantifying predictions of events yet to happen, whereas
    likelihood is measuring the frequency of events that already occurred. In statistics
    and machine learning, we often use likelihood (the past) in the form of data to
    predict probability (the future).


    It is important to note that a probability of an event happening must be strictly
    between 0% and 100%, or 0.0 and 1.0. Logically, this means the probability of
    an event NOT happening is calculated by subtracting the probability of the event
    from 1.0.


    ```

    $P(X) = .70$


    \(P(\text{not } X) = 1-.70 = .30\)

    ```


    This is another distinction between probability and likelihood. Probabilities
    of all possible mutually exclusive outcomes for an event (meaning only one outcome
    can occur, not multiple) must sum to 1.0 or 100%. Likelihoods however are not
    subject to this rule.


    Alternatively, probability can be expressed as an **odds** \(O(X)\) such as 7:3,
    \(\frac{7}{3}\), or 2. 333.


    To turn an odds \(O(X)\) into a proportional probability \(P(X)\), use the formula
    below:


    ```

    \(P(X) = \frac{O(X)}{1 + O(X)}\)

    ```


    So if have an odds \(\frac{7}{3}\), I can convert it into a proportional probability
    like this:


    ```

    \(P(X) = \frac{O(X)}{1 + O(X)}\)


    \(P(X) = \frac{\frac{7}{3}}{1 + \frac{7}{3}}\)

    ```'

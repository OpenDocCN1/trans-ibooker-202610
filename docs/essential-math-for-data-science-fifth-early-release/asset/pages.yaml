    \ noisy and never perfect and will not follow a straight line. It may not remotely\
    \ follow a straight line at all! There is going to be error around that line,\
    \ where the point will fall above or below the line. We will cover this mathematically\
    \ when we talk about p-values, statistical significance, and prediction intervals\
    \ which describes how reliable our linear regression is. Another catch is we should\
    \ not use the linear regression to make predictions outside the range of data\
    \ we have, meaning we should not make predictions where x < 0 and x > 10 because\
    \ we do not have data outside those values.\n\n> **DON'T FORGET SAMPLING BIAS!**\n\
    > \n> We should question this data and how it was sampled in order to detect bias.\
    \ Was this at a single veterinary clinic? Multiple random clinics? Is there self-selection\
    \ bias by using veterinary data, only polling dogs that visit the vet? If the\

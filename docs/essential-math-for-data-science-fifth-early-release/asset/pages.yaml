  md: 'When we multiply these three gradients together, we get a measure of how much
    a change to $W_2$ will change the cost function $C$.


    Now we will calculate these three derivatives. Let’s use SymPy to calculate the
    derivative of the cost function with respect to A2 in Example 7-7.


    # Example 7-7. Calculating the derivative of the cost function with respect to
    A2.


    ```

    from sympy import *


    A2, y = symbols(''A2 Y'')

    C = (A2 - Y) ** 2

    dC_dA2 = diff(C, A2)

    print(dC_dA2) # 2*A2 - 2*Y

    ```


    \(\frac{dC}{dA_2} = 2A_2 - 2y\)


    Next let’s get the derivative of A2 with respect to Z2. Remember that A2 is the
    output of an activation function, in this case the logistic function. So we really
    are just taking the derivative of a sigmoid curve.


    # Example 7-8. Finding the derivative of A2 with respect to Z2


    ```

    from sympy import *


    Z2 = symbols(''Z2'')


    logistic = lambda x: 1 / (1 + exp(-x))


    A2 = logistic(Z2)

    dA2_dZ2 = diff(A2, Z2)

    print(dA2_dZ2) # exp(-Z2)/(1 + exp(-Z2)) ** 2

    ```


    \(\frac{dA_2}{dZ_2} = \frac{e^{-Z_2}}{(1 + e^{-Z_2})^2}\)


    The derivative of Z2 with respect to w2 is going to work out to just be A1, as
    it is just a linear function and going to return the slope.


    # Example 7-9. Derivative of Z2 with respect to W2


    ```

    from sympy import *


    A1, W2, B2 = symbols(''A1, W2, B2'')


    Z2 = A1*W2 + B2

    dz2_dW2 = diff(Z2, W2)

    print(dZ2__dW2) # A1

    ```


    \(\frac{dZ_2}{dW_1} = A_1\)'

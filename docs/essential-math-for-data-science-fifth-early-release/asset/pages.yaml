  md: 'P(Coffee given Cancer) or P(Coffee|Cancer). This represents a probability of
    people who drink coffee given they have cancer.


    Within the United States, let’s compare this to the percentage of people diagnosed
    with cancer (0.5% according to cancer.gov) and the percentage of people who drink
    coffee (65% according to statista.com):


    P(Coffee) = .65

    P(Cancer) = .005

    P(Coffee|Cancer) = .85


    Hmmmmm... study these numbers for a moment and ask whether coffee is really the
    problem here. Notice again that only 0.5% of the population has cancer at any
    given time. However 65% of the population drinks coffee regularly. If coffee contributes
    to cancer, should we not have much higher cancer numbers than 0.5%? Would it not
    be closer to 65%?


    This is the sneaky thing about proportional numbers. They may seem significant
    without any given context, and media headlines can certainly exploit this for
    clicks: “New Study Reveals 85% of Cancer Patients Drink Coffee” it might read.
    Of course, this is silly because we have taken a common attribute (drinking coffee)
    and associated it with an uncommon one (having cancer).


    The reason people can be so easily confused by conditional probabilities is because
    the direction of the condition matters, and the two conditions are conflated as
    somehow being equal. The “probability of having cancer given you are a coffee
    drinker” is different than the “probability of being a coffee drinker given you
    have cancer.” To put it simply: few coffee drinkers have cancer, but many cancer
    patients drink coffee.


    If we are interested in studying whether coffee contributes to cancer, we really
    are interested in the first conditional probability: the probability of some one
    having cancer given they are a coffee drinker.


    P(Coffee|Cancer) = .85

    P(Cancer|Coffee) = ?


    How do we flip the condition? There’s a powerful little formula called Bayes Theorem
    and we can use it to flip conditional probabilities.'

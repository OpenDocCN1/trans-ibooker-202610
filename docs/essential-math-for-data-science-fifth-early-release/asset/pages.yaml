  md: '# # CALCULATING INTEGRALS WITH LIMITS


    For the super curious, here is how we calculate definite integrals using limits
    in SymPy. Please! Skip or come back to this sidebar later if you have enough to
    digest. But if you are feeling good and want to deep dive how integrals are derived
    using limits, proceed!


    The main idea follows much what we did earlier: pack rectangles under a curve
    and make them infinitely smaller until we approach the exact area. But of course,
    the rectangles cannot have a width of 0... they just have to keep getting closer
    to 0 without ever reaching 0. It is another case of using limits.


    Khan Academy has a great article explaining how to use limits for Reimann Sums
    but here is how we do it in SymPy as shown in Example 1-33.


    # Example 1-33. Using Limits to Calculate Integrals


    ```

    from sympy import *


    # Declare variables to SymPy

    x, i, n = symbols(''x i n'')


    # Declare function and range

    f = x**2 + 1

    lower, upper = 0, 1


    # Calculate width and each rectangle height at index "i"

    delta_x = ((upper - lower) / n)

    x_i = (lower + delta_x * i)

    fx_i = f.subs(x, x_i)


    # Iterate all "n" rectangles and sum their areas

    n_rectangles = Sum(delta_x * fx_i, (i, 1, n)).doit()


    # Calculate the area by approaching the number

    # of rectangles "n" to infinity

    area = limit(n_rectangles, n, oo)


    print(area) # prints 4/3

    ```'
  merge: -1
  img_proc: true

- pgno: 393
  md: 'Data science teams feel pressured for having a solution (e.g. machine learning)
    before they even have an objective or problem to solve. Once a problem is found,
    stakeholder buy-in and aligning resources is found to be difficult, and focus
    starts to bounce from one low-hanging fruit to another.


    The problem here is you were hired for a role based on a buzzword, not a function.
    Poor role definition tends to propagate to other problems discussed next. Let’s
    move on to organizational focus.


    # **Organizational Focus and Buy-In**


    Another factor to watch out for is how aligned the organization is on specific
    objectives, and whether all parties are bought in.


    Since the data science boom, many organizations restructured to have a central
    data science team. The vision by executives is to have the data science team rove,
    advise, and help other departments become “data-driven” and employ innovative
    techniques like machine learning. They may also be tasked to break down data silos
    between the departments. While this sounds like a good idea on paper, many organizations
    discovered this is full of challenges.


    Here’s why: management creates a data science team but there’s no clear objective.
    Therefore this team is tasked with looking for problems to solve, rather than
    empowered to solve known problems. As stated, this is why data science teams are
    notorious for having a solution (e.g. machine learning) before they have an objective.
    They are especially ill-equipped to be a driving force for breaking down “data
    silos” as this is completely outside their lane of expertise.'
  merge: -1
  img_proc: true
- pgno: 394
  md: '# BREAKING DOWN DATA SILOS IS AN IT JOB!


    It is misguided to use a data science team to “break down data silos” in an organization.
    Data silos are often due to a lack of data warehousing infrastructure, and departments
    are housing their data in spreadsheets and secret databases rather than a centralized
    and supported database.


    If “data silos” are deemed a problem you need servers, cloud instances, certified
    database administrators, security protocols, and an IT task force to put all this
    together. This is not something a data science team is equipped to do, as they
    likely do not have the needed expertise, budget, and organizational authority
    to pull this off except in very small companies.


    Once a problem is found, stakeholder buy-in and aligning resources is found to
    be difficult. If an opportunity is found, strong leadership is needed to do the
    following:


    +   - Have a clearly defined objective and road map

    +   - Obtain budget to collect data and support the infrastructure

    +   - Attain data access and negotiate data ownership

    +   - Include stakeholder buy-in and domain knowledge

    +   - Budget time and meetings from stakeholders


    The above requirements are much harder to do after a data science team has been
    hired, rather than before, because the data science team’s roles are being scoped
    and budgeted reactively. If higher leadership has not aligned resources and buy-in
    from all necessary parties, the data science project will not succeed. This is
    why there is no shortage of articles blaming organizations for not being ready
    for data science, from HBR to MIT Sloan Review.


    It is better to work on a data science team that organizationally is in the same
    department as its customer. Information, budgets, and communication is shared
    more freely and cohesively. That way there is less tension, as interdepartmental
    politics is mitigated by putting everyone “on the same team” rather than in competition.'
  merge: -1
  img_proc: true
- pgno: 395
  md: '# # DATA ACCESS IS POLITICAL


    It is no secret organizations are protective of their data, but it is not just
    due to security or distrust concerns. Data itself is a highly political asset,
    and many people are reluctant to provide access even to their own colleagues.
    Even departments inside the same organization will not share data with each other
    for this reason: they do not want others doing their job, much less doing it incorrectly.
    It may require _their_ full-time expertise to interpret the data, and it requires
    _their_ domain knowledge. After all, their data is their business! And if you
    are asking for access to _their_ data, you are asking to get into _their_ business.


    On top of that, data scientists can overestimate their ability to interpret foreign
    data sets and the domain expertise needed to use it. To overcome this hurdle,
    you have to develop trust and buy-in with each partner with expertise, negotiate
    a knowledge transfer, and if needed giving them a significant role in the project.


    # ## Adequate Resources


    Another risk to watch out for is not getting adequate resources to do your job.
    It is difficult being thrown into a role and not having what you need. Of course,
    being scrappy and resourceful is an invaluable trait. But even the scrappiest
    software engineer/data scientist rock star can quickly find themselves in over
    their head. Sometimes you need things that cost money and your employer cannot
    budget for it.


    Let’s say you need a database to perform forecasting work. You have a poor connection
    to a third party database, with frequent downtime and disconnects. The last thing
    you want to hear is to “make it work” but that is your situation. You contemplate
    replicating the database locally but to do that, you need to store 40 GB a day,
    and therefore you need a server or cloud instance. Now you are clearly in over
    your head, a “data scientist” becoming an IT department without an IT budget!


    In these situations, you have to contemplate how you can cut corners without hurting
    your project. Can you only hold the rolling latest data and delete the rest? Can
    you create some error-handling Python script that reconnects when a disconnect
    happens, while breaking up the data in batches so it picks up from the last successful
    batch?'
  merge: -1
  img_proc: true
- pgno: 396
  md: 'If this problem/solution sounds specific, yes I did have to do this, and yes
    it did work! It is satisfying to come up with workaround solutions and streamline
    a process without incurring more costs. But inevitably for many data projects
    you may need data pipelines, servers, clusters, GPU-based workstations, and other
    computational resources that a desktop computer cannot offer. In other words,
    these things can cost money and your organization may be unable to budget for
    them.


    # WHERE''S THE MATHEMATICAL MODELING?


    If you are wondering how you were hired to do regression, statistics, machine
    learning, and other applied mathematics only to find yourself doing rogue IT work,
    this is not uncommon in the current corporate climate.


    You are working with data however, and that implicitly can lead to IT-like work.
    The important thing is to make sure your skills still match the job and the needed
    outcome. We will address this throughout the rest of this chapter.


    # Reasonable Objectives


    This is a big one to watch out for. In a landscape full of hype and moonshot promises,
    it is easy to encounter unreasonable objectives.


    There are situations where a manager hires a data scientist, and expects them
    to waltz in effortlessly and add exponential value to the organization. This can
    certainly happen if the organization is still doing manual work and opportunities
    to automate are everywhere. For example, if the organization is doing all their
    work in spreadsheets and forecasts are done by pure guesses, this is a great opportunity
    for a data science professional to streamline processes into a database and make
    strides with even simple regression models.


    On the other hand if the organization hires a data scientist to implement “machine
    learning” into their software, specifically recognizing objects in images, this
    is much harder. A well-informed data scientist has to explain to management this
    is an endeavor that will cost hundreds of thousands of dollars at least! Not only
    do pictures have to be gathered, but manual labor'
  merge: -1
  img_proc: true
- pgno: 397
  md: 'has to be hired to label the objects in the images. And that is just collecting
    the data!


    It is common for a data scientist to spend their first 18 months explaining to
    management why they have not delivered, because they are still trying to gather
    and clean data which is 95% of machine learning efforts.

    Management can become disillusioned with this because they fell victim to

    a popular narrative that “machine learning” and “AI” would do away with

    manual processes, only to discover they traded one set of manual processes

    for another: the procurement of labeled data.


    So be wary of environments that set unreasonable objectives, and find

    diplomatic ways to manage expectations with management especially when

    others promised them an “EASY button.” There are a lot of claims from

    otherwise reputable business journals, and high-dollar management

    consultancies, that super-intelligent AI is around the corner. Managers who

    lack technical expertise can fall victim to this hyped up narrative.


    # # CUI BONO?


    The Latin expression cui bono means “who benefits?” It is a good question to ask
    when

    you find yourself trying to make sense of behaviors when the Jabberwocky Effect
    is in

    full swing. When the media promotes stories about artificial intelligence, who
    benefits

    from that? Regardless of your answer, the media also benefits from the clicks
    and ad

    revenue. High-dollar management consultancies create more billable hours around
    “AI

    strategy”. A chip manufacturer can promote deep learning to sell more graphics
    cards,

    and cloud platforms can sell more data storage and CPU time for machine learning

    projects.


    What do all of these parties have in common? It is not just they are using “AI”
    as a

    means to sell their products, but they have no long-term stake in their customers’

    success. They are selling units, not a project outcome, much like selling shovels
    during

    a gold rush.


    However, I’m not saying these media and vendor motivations are unethical. It is
    their

    employees’ job to make money for their company and provide for their families.
    The

    claims that promote their product may even be legitimate and achievable. However
    it

    cannot be dismissed that once a claim is promoted it is difficult to walk it back,
    even

    when it is realized to be unattainable. Many businesses might pivot and redirect
    their

    efforts rather than admit their claims did not pan out. So just be aware of this
    dynamic

    and to always ask cui bono?'

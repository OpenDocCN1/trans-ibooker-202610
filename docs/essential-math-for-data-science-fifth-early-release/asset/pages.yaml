- pgno: 373
  md: 'With every data scientist title I’ve held, I had already been doing the job
    under a different name before rebranding czars in HR applied a little nip-tuck
    to the employee database. My duties didn’t change in the slightest. I’m no exception;
    my social circle is full of former statisticians, decision support engineers,
    quantitative analysts, math professors, big data specialists, business intelligence
    experts, analytics leads, research scientists, software engineers, Excel jockeys,
    niche PhD survivors... all proud Data Scientists of today.


    —Cassie Kozyrkov


    Data science technically does not exclude any of these professionals, because
    they all are using data to gather insight. Of course, there was some pushback
    from the science community who were reluctant to coronate data science as a real
    science. After all, can you think of a science that does not use data? In 2011
    Pete Warden (who now works as a Tensorflow lead at Google) wrote an interesting
    defense of the data science movement in an O’Reilly article. He also cleanly articulated
    objectors’ arguments about the lack of definition:


    > [Regarding the lack of definition for data science, this] is probably the deepest
    objection, and the one with the most teeth. There is no widely accepted boundary
    for what’s inside and outside of data science’s scope. Is it just a faddish rebranding
    of statistics? I don’t think so, but I also don’t have a full definition. I believe
    that the recent abundance of data has sparked something new in the world, and
    when I look around I see people with shared characteristics who don’t fit into
    traditional categories. These people tend to work beyond the narrow specialties
    that dominate the corporate and institutional world, handling everything from
    finding the data, processing it at scale, visualizing it and writing it up as
    a story. They also seem to start by looking at what the data can tell them, and
    then picking interesting threads to follow, rather than the traditional scientist’s
    approach of choosing the problem first and then finding data to shed light on
    it.


    —Pete Warden'
  merge: -1
  img_proc: true
- pgno: 374
  md: 'Pete ironically could not come up with a definition for _data science_ either,
    but he clearly made a case of why data science is flawed but useful. He also highlighted
    the shift of research abandoning the scientific method in favor of once-eschewed
    practices like data mining, which we talked about in Chapter 3.


    Data science made an interesting pivot just a few years after the Harvard Business
    Review article. Perhaps it was more of a merger with “AI” and “machine learning”
    than a pivot. Regardless, when machine learning and deep learning dominated headlines
    around 2014, data was sold as the “fuel” for creating artificial intelligence.
    This naturally expanded the scope of data science and created a confluence with
    the AI/machine learning movement. In particular, the ImageNet challenge sparked
    a revived interest in “AI” and brought on a machine learning and deep learning
    renaissance. Companies like Waymo and Tesla promised self-driving cars in a matter
    of years thanks to advances in deep learning, further fueling media headlines
    and bootcamp enrollments.


    This sudden interest in neural networks and deep learning had a interesting side
    effect. Regression techniques like decision trees, support vector machines, and
    logistic regression, spending decades hiding in academia and specialized statistics
    professions, rode the coattails of deep learning into the public limelight. At
    the same time, libraries like Scikit-learn created a low barrier for entry into
    the field. This had a hidden cost of creating data science professionals who did
    not understand how these libraries or models worked, but used them anyway.


    Because the discipline of _data science_ has evolved faster than a perceived need
    to define it, it is not uncommon for a “data scientist” role to be a complete
    wildcard. I have met several individuals who held a “data scientist” title in
    Fortune 500 companies. Some are highly proficient in coding and might even have
    software engineering backgrounds, but have no idea what statistical significance
    is. Others stay confined in Excel and barely know SQL, much less Python or R.
    I met data science folks who taught themselves a few functions in Scikit-learn,
    and quickly found themselves floundering because that was all they knew.'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'So what does this mean for you? How do you flourish in such a buzzwordy and
    chaotic landscape? It all comes down to what types of problems or industries interest
    you, and not being quick to rely on employers to define roles. You do not have
    to be a *data scientist* to do data science. There are a wide array of fields
    you can work to your advantage given this knowledge you now have. You can be an
    *analyst*, *researcher*, *machine learning engineer*, *advisor*, *consultant*,
    and a myriad of other roles that are not necessarily called *data scientist*.


    But first, let''s address some ways you can continue learning and find your edge
    in the data science job market.


    # Finding Your Edge


    The practical data science professional needs more than an understanding of statistics
    and machine learning to thrive. In most cases, it is unreasonable to expect data
    to be readily available for machine learning and other projects. Instead you will
    find yourself chasing data sources, engineering scripts and software, scraping
    documents, scraping Excel workbooks, and even creating your own databases. At
    least 95% of your coding efforts will not be related to machine learning or statistical
    modeling at all, but rather creating, moving, and transforming data so it is usable.


    On top of that, you have to have awareness of the big picture and the dynamics
    of your organization. Your managers can make assumptions in defining your role,
    and it is important to identify these assumptions so you recognize how they affect
    you. While you are relying on your customers and leadership for their industry
    expertise, you should be in a role to provide technical knowledge and articulate
    what is feasible. Let’s look at some hard and soft skills you will likely need.


    # SQL Proficiency


    SQL, also called *structured query language*, is a querying language to retrieve,
    transform, and write table data. A *relational database* is the most'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'common way to organize data, storing data into tables that are connected to
    each other much like a V-Lookup in Excel. Relational database platforms like MySQL,
    Microsoft SQL Server, Oracle, SQLite, and PostgreSQL support SQL. As you might
    notice, SQL and relational databases are so tightly coupled “SQL” is often used
    in the branding of the relational database, like “MySQL” and “Microsoft SQL Server.”


    Example 8-1 is a simple SQL query that retrieves the `CUSTOMER_ID` and `NAME`
    fields from a `CUSTOMER` table, for only records that are in the `STATE` of “TX”.


    # *Example 8-1. A simple SQL query*


    ```

    SELECT CUSTOMER_ID, NAME

    FROM CUSTOMER

    WHERE STATE = ''TX''

    ```


    Simply put, it is hard to get anywhere as a data science professional without
    a proficiency of SQL. Businesses use data warehouses and SQL is almost always
    the means to retrieve the data. SELECT, WHERE, GROUP BY, ORDER BY, CASE, INNER
    JOIN, and LEFT JOIN should all be familiar SQL keywords. It is even better to
    know subqueries, derived tables, common table expressions, and windowing function
    to get the most utility out of your data.


    # SHAMELESS PLUG - THE AUTHOR HAS A SQL BOOK!


    I have written a beginner’s SQL book for O’Reilly called *Getting Started with
    SQL*. It is barely over 100 pages so it can be finished in a day. It covers the
    essentials including joins and aggregations, as well as creating your own database.
    The book uses SQLite which can be set up in less than a minute.


    There are other great SQL books by O’Reilly, including *Learning SQL, 3rd Ed.*
    by Alan Beaulieu and the *SQL Pocket Guide, 4th Ed.* by Alice Zhao. After speed-reading

  md: '# LINEAR TRANSFORMATIONS IN PRACTICE


    You might be wondering what do all these linear transformations and matrices have
    to do with data science and machine learning. The answer is everything! From importing
    data to numerical operations with linear regression, logistic regression, and
    neural networks, linear transformations are the heart of mathematically manipulated
    data.


    In practice however, you will rarely take the time to geometrically visualize
    your data as vector spaces and linear transformations. You will be dealing with
    too many dimensions to do this productively. But it is good to be mindful of of
    the geometric interpretation just to understand what these contrived-looking numerical
    operations do! Otherwise you just memorizing numerical operation patterns without
    any context. It also makes new linear algebra concepts like determinants more
    obvious.



- pgno: 231
  md: '# WHY NOT ABSOLUTE VALUES?


    You might wonder why we have to square the residuals before summing them. Why
    not just add them up without squaring? That will not work because the negatives
    will cancel out the positives. What if we add the absolute values, where we turn
    all negative values into positive values? That sounds promising but absolute values
    are mathematically inconvenient. More specifically, absolute values do not work
    well with calculus derivatives which we are going to use later for gradient descent.
    This is why we choose the squared residuals as our way of totaling the loss.


    A visual way to think of it is shown in Figure 5-7, where we overlay a square
    on each residual and each side is the length of the residual. We sum the area
    of all these squares, and later we will learn how to find the minimum sum we can
    achieve by identifying the best m and b.'
  merge: -1
  img_proc: true

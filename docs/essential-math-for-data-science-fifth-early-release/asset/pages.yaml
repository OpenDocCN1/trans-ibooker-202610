- pgno: 309
  md: 'much my odds change between 6 hours and 8 hours of exposure to the chemical.
    I can take the odds at 6 hours and then 8 hours, and then ratio the two odds against
    each other in an **odds ratio**. This is not to be confused with a plain odds
    which, yes is a ratio, but it is not an odds ratio.


    Let''s first find the probabilities of symptoms for 6 hours and 8 hours respectively.


    \( p = \frac{1.0}{1.0 + e^{-(\beta_0+\beta_1 x)}} \)


    \( p_6 = \frac{1.0}{1.0 + e^{(-3.17576395+0.69267212(6))}} = 0.7271615429285554
    \)


    \( p_8 = \frac{1.0}{1.0 + e^{(-3.17576395+0.69267212(8))}} = 0.914167258137741
    \)


    Now let''s convert those into odds, which we will declare as \( o_x \) .


    \( o = \frac{p}{1 - p} \)


    \( o_6 = \frac{0.7271615429285554}{1 - 0.7271615429285554} = 2.66517246407876
    \)


    \( o_8 = \frac{0.914167258137741}{1 - 0.914167258137741} = 10.6505657200694 \)


    Finally, set the two odds against each other as an odds ratio, where the odds
    for 8 hours is the numerator and the odds for 6 hours is in the denominator. We
    get a value of approximately 3.996, meaning that our odds of showing symptoms
    increases by nearly a factor of 4 with an extra 2 hours of exposure.


    \(\text{odds ratio} = \frac{10.6505657200694}{2.66517246407876} = 3.99620132040906
    \)


    You will find this odds ratio value of 3.996 holds across any two hour range,
    like 2 hours to 4 hours, 4 hours to 6 hours, 8 hours to 10 hours... etc. As long
    as its a 2-hour gap you will find that odds ratio stays consistent. It will differ
    for other range lengths.


    # R-Squared


    We covered quite a few statistical metrics for linear regression in Chapter 5,

  md: 'Notice that the x-axis represents all underlying rates of success from 0.0
    to 1.0 (0% to 100%), and the y-axis represents the likelihood of that probability
    given 8 successes and 2 failures. In other words, the beta distribution allows
    us to see the probabilities of probabilities given 8/10 successes. Think of it
    as a meta-probability so take your time grasping this idea!


    Notice also that the beta distribution is a continuous function, meaning it forms
    a continuous curve of decimal values (as opposed to the tidy and discrete integers
    in the binomial distribution). This is going to make the math with the beta distribution
    a bit harder, as a given density value on the y-axis is not a probability. We
    instead find probabilities using areas under the curve.


    The beta distribution is a type of **probability distribution**, which means the
    area under the entire curve is 1.0, or 100%. To find a probability, we need to
    find the area within a range. For example, if we want to evaluate the probability
    8/10 successes would yield 90% or higher success rate, we need to find the area
    between 0.9 and 1.0, which is 22.5%, as shaded in Figure 2-3.



  md: '# # JAVA DATA SCIENCE LIBRARIES


    While not nearly as popular as Python data science libraries, Java does have several
    equivalent libraries that are strongly supported. ND4J is the NumPy for the JVM,
    and SMILE is the Scikit-learn. TableSaw is the Java equivalent to Pandas.


    Apache Spark is actually written on the Java platform, specifically using Scala.
    Interestingly Apache Spark was a driver for some time trying to make Scala a mainstream
    language for data science, although it did not catch on to the degree the Scala
    community probably hoped. This is why a lot of effort was made to add Python,
    SQL, and R compatibility and not just Java and Scala.


    # # Data Visualization


    Another technical skill you should have some degree of proficiency is data visualization.
    Be comfortable making charts, graphs, and plots that not just tells stories to
    management, but also helps your own data exploration efforts. You can summarize
    data with a SQL command, but sometimes a bar chart or scatterplot will give you
    a better sense of your data in less time.


    When it comes to what tools to use for data visualization, this is much harder
    to answer because there is so much fragmentation and choice. If you work in a
    traditional office environment, Excel and PowerPoint are often the preferred visualization
    tools, and you know what? They are quite alright! I do not use them for everything
    but they do accomplish a great majority of tasks. Need a scatterplot on a small/medium
    dataset? Or a histogram? No problem! You can have one built in a few minutes after
    copying/pasting your data into an Excel workbook. This is great for one-time graph
    visualizations, and there is no shame in using Excel when it works.


    However, there are situations you might want to script the creation of graphs
    so it is repeatable, reusable, or integrates with your Python code.'

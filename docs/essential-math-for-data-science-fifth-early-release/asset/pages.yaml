  md: '# Practitioner versus Adviser


    This might be a generalization, but there are two types of knowledge experts:
    practitioners and advisers. To find your edge, discern which you want to be and
    tune your professional development accordingly.


    In the data science and analytics world, practitioners are the ones writing code,
    creating models, scouring data, and trying to directly create value. Advisers
    are like consultants, telling management whether their objectives are sound, helping
    with strategy, and providing direction. Sometimes a practitioner can work their
    way up to being an adviser. Sometimes advisers were never practitioners. There
    are pros and cons to each role.


    A practitioner may enjoy coding, doing data analysis, and performing tangible
    work that directly can create value. A benefit for the practitioner is they actually
    develop and possess hard skills. However burying oneself in code, math, and data
    makes it easy to lose sight of the big picture, and lose touch with the rest of
    the organization and industry. A common complaint I have heard from managers is
    their “data scientist” wants to work on problems they find interesting, but do
    not add value to the organization. I have also heard complaints from practitioners
    that want exposure and upward mobility, but feel tucked away and hidden in their
    organization.


    An adviser admittedly has a cushier job in some ways. They dispense advice and
    information to managers, and help provide strategic direction to a business. They
    are typically not the ones who write code or scour data, but help management hire
    the people that do. The career risk is different, as they do not worry about meeting
    sprint deadlines, dealing with code bugs, or misbehaving models like practitioners
    do. But they do have to worry about staying knowledgeable, credible, and relevant.


    To be an effective adviser, you have be really knowledgeable and know things other
    people do not. It has to be critical and relevant information, that is fine-tuned
    to your customer’s needs. To stay relevant, you have to read, read, and read more
    every day... seeking and synthesizing information others are overlooking. It is
    not enough to be familiar with machine learning, statistics, and deep learning.
    You have to be paying attention to'
  merge: -1
  img_proc: true
- pgno: 389
  md: 'your client’s industry as well as other industries, tracking who is succeeding
    and who is not. You also have to learn to pair the right solution to the right
    problem, in a business landscape where many are looking for a silver bullet. And
    to do all of this, you have to be an effective communicator and share information
    in a way that helps your client, not just demonstrate what you know.


    The greatest risk of an adviser is providing information that ends up being wrong.
    Some consultants are quite effective at redirecting blame to outside factors,
    like “nobody in the industry saw this coming” or “this is a six-sigma event!”
    meaning an undesirable event had a one in a half-billion chance of occurring,
    but did anyway. Another risk is not having the hard skills of a practitioner,
    and becoming disconnected from the technical side of the business. This is why
    it is a good idea to regularly practice coding and modeling at home, or at least
    make technical books part of your reading.


    In the end, a good adviser tries to be a bridge between the customer and their
    end goal, often filling a massive knowledge gap that exists. It is not billing
    the maximum number of hours and inventing busywork, but truly identifying what
    troubles your customer and helping them sleep at night.'

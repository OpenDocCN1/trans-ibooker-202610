  md: 'The median can be a helpful alternative to the mean when data is skewed by
    **outliers**, or values that are extremely large and small compared to the rest
    of the values. Here''s an interesting anecdote to understand why. In 1986, the
    mean annual starting salary of geography graduates in the University of North
    Carolina was $250,000. Other universities averaged $22,000. Wow, UNC must have
    an amazing geography program!


    But in reality, what was so lucrative about UNC''s geography program? Well...
    they had Michael Jordan as one of their graduates. One of the most famous NBA
    players of all time indeed graduated with a geography degree from University of
    North Carolina. However he started his career playing basketball, not studying
    maps. Obviously this is a confounding variable which has created a huge outlier,
    and it majorly skewed the income average.


    This is why the median can be preferable in outlier-heavy situations (such as
    income-related data) over the mean. It is less sensitive to outliers and cuts
    data strictly down the middle based on their relative order, rather than where
    they fall exactly on a number line. When your median is very different from mean,
    that means you have a skewed dataset with outliers.


    # THE MEDIAN IS A QUANTILE


    There is a concept of **quantiles** in descriptive statistics. The concept of
    quantiles is essentially the same as a median, just cutting the data in other
    places besides the middle. The median is actually the 50% quantile, or the value
    where 50% of ordered values are behind it. Then there is the 25%, 50%, 75% quantiles
    which are known as **quartiles** as they cut data in 25% increments.


    # Mode


    The **mode** is the most frequently occurring set of values. It primarily becomes
    useful when your data is repetitive and you want to find which values occur the
    most frequently.


    When no value occurs more than once, there is no mode. When two values occur with
    an equal amount of frequency, then the dataset is considered **bimodal**. In'

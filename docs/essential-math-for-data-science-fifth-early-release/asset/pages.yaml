    Figure 7-6. Graph for ReLU function


    ReLU is short for “rectified linear unit”, but that is just a fancy way of saying
    “turn negative values into 0.” ReLU has gotten popular for hidden layers in neural
    networks and deep learning because of its speed and mitigation of the vanishing
    gradient problem. Vanishing gradients occur when the partial derivative slopes

- pgno: 257
  md: '# Figure 5-12. Correlation coefficients for four scatterplots


    As you can imagine, the correlation coefficient is useful to see if there is a
    possible relationship between two variables. If there is a strong positive/negative
    relationship, it will be useful in our linear regression. If there is not a relationship,
    they may just add noise and hurt model accuracy.


    How do we use Python to calculate the correlation coefficient? Let’s use our simple
    10-point dataset we used earlier. A quick and easy way to analyze correlations
    for all pairs of variables is using Pandas’ `corr()` function. It makes it easy
    to see the correlation coefficient between every pair of variables in a dataset,
    which in this case will only be `x` and `y`. This is known as a **correlation
    matrix**. Take a look in Example 5-14.


    # Example 5-14. Using Pandas to see the correlation coefficient between every
    pair of variables


    ```

    ```python

    import pandas as pd


    # Read data into Pandas dataframe

    df = pd.read_csv(''https://bit.ly/2KF29Bd'', delimiter=",")


    # Print correlations between variables

    correlations = df.corr(method=''pearson'')

    print(correlations)


    # OUTPUT:

    #           x         y

    # x  1.000000  0.957586

    # y  0.957586  1.000000

    ```

    ```


    As you can see the correlation coefficient .957586 between `x` and `y` indicates
    a strong positive correlation between the two variables. You can ignore the parts
    of the matrix where `x` or `y` are set to themselves and have a value of `1.0`.
    Obviously when `x` or `y` is set to itself the correlation will be perfect at
    1.0, because their values match themselves exactly. When you have more than two
    variables, the correlation matrix will show a larger grid because there are more
    variables to pair and compare.


    If you change the code to use a different dataset with a lot of variance, where
    the data is spread out, you will see that correlation coefficient'

    # ANCHORING BIAS AND FIRST PROGRAMMING LANGUAGES


    It is common for technical professionals to get partial and emotionally invested
    in technologies and platforms, especially programming languages. Please don''t
    do this! This kind of tribalism is not productive, and ignores the reality that
    every programming language caters to different qualities and use cases. Another
    reality is that some programming languages catch on while others do not, often
    for reasons that have nothing to do with merits in language design. If a big company
    is not paying for its support, its chances of survival are slim.


    We talked about different types of cognitive biases in Chapter 3. Another one
    is anchoring bias, which states we can become partial to the first thing we learn,
    such as a programming language. If you are feeling obligated to learn a new language,
    be open-minded and give it a chance! No language is perfect, and all that matters
    is it gets the job done.


    However be wary if the language''s support is questionable because it is on life
    support, not receiving updates, or lacks a corporate maintainer. Examples of this
    include Microsoft''s VBA, Red Hat''s Ceylon, and Haskell.'

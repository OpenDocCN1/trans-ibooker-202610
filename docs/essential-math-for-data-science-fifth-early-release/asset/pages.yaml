- pgno: 354
  md: 'While the process is largely the same, there is a complication using stochastic
    gradient descent on neural networks. The nodes in one layer feed their weights
    and biases into the next layer, which then applies another set of weights and
    biases. This creates an onion-like nesting we need to untangle starting with the
    output layer.


    During gradient descent, we need to figure out which weights and biases should
    be adjusted, and by how much, to reduce the overall cost function. The cost for
    a single prediction is going to be the squared output of the neural network \(A_2\)
    minus the prediction Y.


    \(C = (A_2 - Y)^2\)


    But let''s peel back a layer. That activated output \(A_2\) is just \(Z_2\) with
    the activation function.


    \(A_2 = sigmoid(Z_2)\)


    \(Z_2\) in turn is the output weights and biases applied to activation output
    \(A_1\), which comes from the hidden layer.


    \(Z_2 = W_2A_1 + B_2\)


    \(A_1\) is built off \(Z_1\) which is passed through the ReLU activation function.


    \(A_1 = ReLU(Z_1)\)


    Finally, \(Z_1\) is the input X values weighted and biased by the hidden layer.


    \(Z_1 = W_1X + B_1\)


    We need to find the weights and biases contained in the \(W_1, B_1, W_2,\) and
    \(B_2\) matrices and vectors that will minimize our loss. By nudging their slopes,
    we can change the weights and biases that have the most impact in minimizing loss.
    However, each little nudge on a weight or bias is going to propogate all the way
    to the loss function on the outer layer. This is where the chain rule can help
    us figure out this impact.


    Let''s focus on finding the relationship on a weight from the output layer \(W_2\),
    and the cost function \(C\). A change in the weight \(W_2\) results in a change
    to the unactivated output \(Z_2\). That then changes the activated output \(A_2\),
    which changes the cost function \(C\). Using the chain rule, we can define the
    derivative of \(C\) with respect to \(W_2\) as this.


    \(\frac{dC}{dW_2} = \frac{dZ_2}{dW_2} \frac{dA_2}{dZ_2} \frac{dC}{dA_2}\)'

- pgno: 239
  md: '# A Thought Experiment on Gradient Descent


    Imagine you are in a mountain range at night and given a flashlight. You are trying
    to get to the lowest point of the mountain range. You can see the slope around
    you before you even take a step. You step in directions where the slope visibly
    goes downwards. You take bigger steps for bigger slopes, and smaller steps for
    smaller slopes. Ultimately you will find yourself at a low point where the slope
    is flat, a value of 0. Sounds pretty good, right? This approach with the flashlight
    is known as **gradient descent**, where we step in directions where the slope
    goes downwards.


    In machine learning, we often think of all possible sum of square losses we will
    encounter with different parameters as a mountainous landscape. We want to minimize
    our loss and we navigate the loss landscape to do it. To solve this problem gradient
    descent has an attractive feature: the partial derivative is that flashlight,
    allowing us to see the slopes for every parameter (in this case m and b, or β₀
    and β₁). We step in directions for m and b where the slope goes downwards. We
    take bigger steps for bigger slopes and smaller steps for smaller slopes. We can
    simply calculate the length of this step by taking a fraction of the slope. This
    fraction is known as our **learning rate**. The higher the learning rate, the
    faster it will run at the cost of accuracy. But the lower the learning rate, the
    slower it will take to train and require more iterations.


    Deciding a learning rate is like choosing between an ant, a human, or a giant
    to step down the slope. An ant (small learning rate) will take tiny steps and
    take an unacceptably long time to get to the bottom, but will do so precisely.
    A giant (large learning rate) may keep stepping over the minimum to the point
    he may never reach it no matter how many steps he takes. The human (moderate learning
    rate) probably has most balanced step size, having the right trade between speed
    and accuracy in arriving at the minimum.


    # Let''s Walk Before We Run


    For the function f(x) = (x − 3)² + 4, let''s find the x value that produces the
    lowest point of that function. While we could solve this algebraically,'

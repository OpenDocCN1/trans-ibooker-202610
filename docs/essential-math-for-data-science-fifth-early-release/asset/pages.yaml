  md: '# USING LIMITS TO CALCULATE DERIVATIVES


    Want to see where limits come into play calculating derivatives? If you are feeling
    good about what we learned so far, proceed! If you are still digesting, maybe
    consider coming back to this sidebar later.


    SymPy allows us to do some interesting explorations about math. Take our function
    \( f(x) = x^2 \) and we approximated a slope for \( x = 2 \) by drawing a line
    through a close neighboring point \( x = 2.0001 \) by adding a step .0001. Why
    not use a limit to forever decrease that step \( s \) and see what slope it approaches?


    \[ \lim_{s \to 0} \frac{(x + s)^2 - x^2}{(x + s) - x} \]


    In our example, we are interested in the slope where \( x = 2 \) so let’s substitute
    that.


    \[ \lim_{s \to 0} \frac{(2 + s)^2 - 2^2}{(2 + s) - 2} = 4 \]


    By forever approaching a step size \( s \) to 0 but never reaching it (remember
    the neighboring point cannot touch the point at \( x = 2 \) else we have no line!),
    we can use a limit to see we converge on a slope of 4 as shown in Example 1-25.


    # Example 1-25. Using limits to calculate a slope


    ```

    from sympy import *


    # "x" and step size "s"

    x, s = symbols(''x s'')


    # declare function

    f = x**2


    # slope between two points with gap "s"

    # substitute into rise-over-run formula

    slope_f = (f.subs(x, x + s) - f) / ((x+s) - x)

    ```'

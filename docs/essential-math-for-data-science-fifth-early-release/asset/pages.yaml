- pgno: 250
  md: 'Shoot, why did we go through all that trouble with linear regression and not
    do this instead? Well, remember our big picture objective is not to minimize the
    sum of squares but to make accurate predictions on new data. This “connect the
    dots” model is severely **overfit**, meaning it shaped the regression to the training
    data too exactly to the point it will predict poorly on new data. This simple
    “connect the dots” model is sensitive to outliers that are far away from the rest
    of the points, meaning it will have high **variance** in predictions. While the
    points in this example are relatively close to a line, this problem will be a
    lot worse with other datasets with more spread and outliers. Because overfitting
    increases variance, predictions are going to be all over the place!


    # OVERFITTING IS MEMORIZATION


    When you hear someone say a regression “memorized” the data rather than generalizing
    it, they are talking about overfitting.


    As you can guess we want to find effective generalizations in our model rather
    than memorize data. Otherwise our regression simply turns into a database where
    we look up values.


    This is why in machine learning you will find bias is added to the model, and
    linear regression is considered a highly biased model. This is not the same as
    bias in the data, which we talked about extensively in Chapter 3. **Bias in a
    model** means we prioritize a method (e.g. maintaining a straight line) as opposed
    to bending and fitting to exactly what the data says. A biased model leaves some
    wiggle room hoping to minimize loss on new data for better predictions, as opposed
    to minimizing loss on data it was trained on. I guess you could say adding bias
    to a model counteracts overfitting with **underfitting**, or fitting less to the
    training data.


    As you can imagine this is a balancing act because it is two contradictory objectives.
    In machine learning, we basically are saying “I want to fit a regression to my
    data, but I don’t want to fit it _too much_. I need some wiggle room for predictions
    on new data that will be different.”'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# LASSO AND RIDGE REGRESSION


    Two somewhat popular variants of linear regression are lasso regression and ridge
    regression. Ridge regression adds a further bias to a linear regression in the
    form of a penalty, and therefore causing it to fit less to the data. Lasso regression
    will attempt to marginalize variables that are noisy, making it useful when you
    want to automatically remove variables that might be irrelevant.


    Still we cannot just apply a linear regression to some data, make some predictions
    with it, and assume all is okay. A linear regression can still overfit even with
    the bias of a straight line. Therefore, we need to check and mitigate for both
    overfitting and underfitting to find the sweet spot between the two. That is if
    there is one at all, in which case you should abandon the model altogether.


    # Stochastic Gradient Descent


    In a machine learning context, you are unlikely to do gradient descent in practice
    like we did earlier, where we trained on all training data (called batch gradient
    descent). In practice you are more likely to perform stochastic gradient descent,
    which will only train on one sample of the dataset on each iteration. In mini-batch
    gradient descent, multiple samples of the dataset are used (e.g. 10 or 100 data
    points) on each iteration.


    Why only use part of the data on each iteration? Machine learning practitioners
    cite a few benefits. First it reduces computation significantly, as each iteration
    does not have to traverse the entire training dataset but only part of it. The
    second benefit is it reduces overfitting. By exposing the training algorithm to
    only part of the data on each iteration, it keeps changing the loss landscape
    so it does not settle in the loss minimum. After all, minimizing the loss is what
    causes overfitting and so we introduce some randomness to create a little bit
    of underfitting (but hopefully not too much).


    Of course, our approximation becomes loose so we have to be careful. This is why
    we will talk about training/testing splits shortly, as well as other'

- pgno: 14
  md: 'Note also that variable names can be subscripted so that several instances
    of a variable name can be used. For practical purposes, just treat these as separate
    variables. If you encounter variables x1, x2, and x3, just treat them as three
    separate variables as shown in Example 1-5.


    # Example 1-5. Expressing subscripted variables in Python


    ```

    x1 = 3  # or x_1 = 3

    x2 = 10 # or x_2 = 10

    x3 = 44 # or x_3 = 44

    ```


    # Functions


    Functions are expressions that define relationships between two or more variables.
    More specifically, a function takes input variables (also called domain variables
    or independent variables), plugs them into an expression, and then results in
    an output variable (also called dependent variable).


    Take this simple linear function:


    ```

    y = 2x + 1

    ```


    For any given x value, we solve the expression with that x to find y. When x =
    1, then y = 3. When x = 2, y = 5. When x = 3, y = 7 and so on as shown in Table
    1-1.'

    # MACHINE LEARNING TRAINING IS FITTING A REGRESSION


    This is the heart of “training” a machine learning algorithm. We provide some
    data and an objective function (the sum of squares) and it will find the right
    coefficients m and b to fulfill that objective. So when we “train” a machine learning
    model we really are minimizing a loss function.


    # Closed Form Equation


    Some readers may ask if there is a formula (called a closed form equation) to
    fit a linear regression by exact calculation. The answer is yes, but only for
    a simple linear regression with one input variable. This luxury does not exist
    for many machine learning problems with several input variables and a large amount
    of data. We can use linear algebra techniques to scale up, and we will talk about
    this shortly. We will also take the opportunity to learn about search algorithms
    like stochastic gradient descent.


    For a simple linear regression with only one input and one output variable, here
    are the closed form equations to calculate m and b. Example 5-5 shows how you
    can do these calculations in Python.


    ```

    m = \frac{n \sum xy - \sum x \sum y}{n \sum x^2 - (\sum x)^2}

    ```'

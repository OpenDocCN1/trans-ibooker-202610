  md: '# SOFTWARE LICENSES CAN BE POLITICAL


    Imagine that you created a Python or Java application that solicits a few user
    inputs, retrieves and wrangles different data sources, runs some highly-custom
    algorithms, and then presents a visualization and a table showing the result.
    You present it at a meeting after months of hard work, but then one of the managers
    raises his hand and asks “Why not just do this in Tableau?”


    It’s a hard pill to swallow for some managers, knowing that they have spent thousands
    and thousands of dollars for corporate software licenses, and you come in and
    use a more capable (albeit more complex to use) open-source solution that has
    no licensing costs. You can emphasize that Tableau does not support these algorithms
    or integrated workflows you had to create. After all, Tableau is just a visualization
    software. It is not a from-scratch coding platform to create a customized, highly-tailored
    solution.


    Leadership is often sold the impression that Tableau, Alteryx, or another commercial
    tool can do everything. After all, they spent a lot of money for it and were probably
    given a good sales pitch by the vendor. Naturally, they want to justify the costs
    and have as many people as possible using the license. They probably spent further
    budget training employees to use the software, and want others to be able to maintain
    your work.


    Be sensitive to this. If management asks you to use the tool they paid for, then
    explore if you can make it work. But if it has limitations or steep usability
    compromises in your specific tasks, be politely upfront about it.


    # Knowing Your Industry


    Let’s compare two industries: movie streaming (e.g. Netflix) and aerospace defense
    (e.g. Lockheed Martin). Do they have anything in common? Hardly! Both are technology-driven
    companies, but one is streaming movies for consumers and the other is building
    airplanes with ordnance.


    When I advise on artificial intelligence and system safety, one of the first things
    I point out is these two industries have very different tolerances for risk. A
    movie streaming company may tout they have an “AI” system that learns what movies
    to recommend to consumers, but how catastrophic is it when it gives a bad recommendation?
    Well, at worst you have a mildly irritated consumer who wasted 2 hours watching
    a movie they did not enjoy.'

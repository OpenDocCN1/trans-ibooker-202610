  md: '# Appendix A. Appendix


    # Using Latex Rendering with SymPy


    As you get more comfortable with mathematical notation, it can be helpful to take
    your SymPy expressions and display them in mathematical notation.


    The quickest way to do this is is to use the the `latex()` function SymPy on your
    expression and then copy the result to a Math Latex viewer.


    Example A-1 is an example that takes a simple expression and turns it into a latex
    string. Of course we can take the result of derivatives, integrals, and other
    SymPy operations and render that as Latex too. But let’s keep the example straightforward.


    # Example A-1. Using SymPy to convert an expression into Latex


    ```

    from sympy import *

    x,y = symbols(''x y'')

    z = x**2 / sqrt(2*y**3 - 1)

    print(latex(z))

    # prints

    # \frac{x^{(2)}}{\sqrt{2 y^{(3)} - 1}}

    ```


    This \frac{x^{(2)}}{\sqrt{2 y^{(3)} - 1}} string is formatted math Latex, and
    there are a variety of tools and document formats that can be adapted to support
    it. But to simply render the math latex, go to a latex equation editor. Here are
    two different ones I use online:


    +   - https://lateditor.lagrida.com/

    +   - https://latex.codecogs.com/


    In Figure A-1 I use the Lagrida’s Latex editor to render the mathematical expression.'

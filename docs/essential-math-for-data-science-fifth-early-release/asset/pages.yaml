- pgno: 55
  md: '\frac{dy}{dx}(x^2 + 1) = 2x

    \frac{dz}{dy}(y^3 - 2) = 3y^2

    \frac{dz}{dx} = (2x) (3y^2) = 6xy^2


    Alright, $6xy^2$ may not look like $6x(x^2 + 1)^2$, but that’s only because we
    have not substituted the y function yet. Do that so the entire $\frac{dz}{dx}$
    derivative is expressed in terms of x without y.


    \frac{dz}{dx} = 6xy^2 = 6x(x^2 + 1)^2


    Now we see we got the same derivative function $6x(x^2 + 1)^2$!


    What we have witnessed here is the **chain rule**, which says that for a given
    function y (with input variable x) composed into another function z (with input
    variable y), we can find the derivative of z with respect to x by multiplying
    the two respective derivatives together.


    \frac{dz}{dx} = \frac{dz}{dy} \times \frac{dy}{dx}


    Example 1-28 shows the SymPy code that makes this comparison, showing the derivative
    from the chain rule is equal to the derivative of the substituted function.


    # Example 1-28. Calculating the derivative dz/dx with and without the chain rule,
    but still getting the same answer


    ```

    from sympy import *

    x, y = symbols(''x y'')

    # derivative for first function

    # need to underscore y to prevent variable clash

    _y = x**2 + 1

    ```'

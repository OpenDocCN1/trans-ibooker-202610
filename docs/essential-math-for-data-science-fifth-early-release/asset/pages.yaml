    Now what if we do not assign a specific value to \(x\) and leave it alone? What
    happens if we decrease our step size \(s\) infinitely towards 0 then? Let''s look
    in Example 1-26.


    # Example 1-26. Using limits to calculate a derivative


    ```

    from sympy import *


    # "x" and step size "s"

    x, s = symbols(''x s'')


    # declare function

    f = x**2


    # slope between two points with gap "s"

    # substitute into rise-over-run formula

    slope_f = (f.subs(x, x + s) - f) / ((x+s) - x)


    # calculate derivative function

    # infinitely approach step size +s+ to 0

    result = limit(slope_f, s, 0)


    print(result) # 2x

    ```


    That gave us our derivative function \(2x\). SymPy was smart enough to figure
    out to never let our step size reach 0 but forever approach 0. This converges
    \(f(x) = x^2\) to reach its derivative counterpart \(2x\).



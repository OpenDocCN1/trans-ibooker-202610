- pgno: 417
  md: '![](img/8e0dcc1636d032e7728a07e97751e446_417_0.png)


    Figure A-4. Most values in a standard normal distribution are small and near 0,
    while larger values are less frequent on the tails


    Circling back to the linear regression, we will start m and b at 0 or some other
    starting values. Then for 150,000 iterations in a `for` loop, we will randomly
    adjust m and b by adding values sampled from the standard normal distribution.
    If a random adjustment improves/lessens the sum of squares, we keep it. But if
    the sum of squares increases, we undo that random adjustment. In other words,
    we only keep adjustments that improve the sum of squares. Let''s take a look in
    Example A-9.


    # Example A-9.


    ```

    from numpy.random import normal

    import pandas as pd


    # Import points from CSV

    points = [p for p in pd.read_csv("https://bit.ly/2KF29Bd").itertuples()]


- pgno: 134
  md: "Here's what happening. The individual numbers in the samples alone will not\
    \ create a normal distribution. The distribution will be flat where any number\
    \ is equally likely (known as a **uniform distribution**). But when we group them\
    \ as samples and average them they form a normal distribution.\n\nThis is because\
    \ of the **central limit theorem**, which states interesting things happen when\
    \ we take large enough samples of a population, calculate the mean of each, and\
    \ plot them as a distribution:\n\n+   1. The mean of the sample means is equal\
    \ to the population mean.\n+   \n+   2. If the population is normal, then the\
    \ sample means will be normal.\n+   \n+   3. If the population is not normal,\
    \ but the sample size is greater than 30, roughly the sample means will still\
    \ form a normal distribution.\n+   \n+   4. The standard deviation of the sample\
    \ means equals the population standard deviation divided by the square root of\
    \ $n$.\n\nsample standard deviation = \\(\\frac{\\text{population standard deviation}}{\\\
    sqrt{\\text{sample size}}}\\)\n\nWhy is all the above important? These behaviors\
    \ allows us to infer useful things about populations based on samples, even for\
    \ non-normal populations. If you modify the code above and try smaller sample\
    \ sizes of 1 or 2, you will not really see a normal distribution emerge. But as\
    \ you approach 31 or more, you will see that we converge onto a normal distribution\
    \ as shown in Figure 3-13."

  md: 'Figure 5-15. Different datasets and their correlation coefficients and p-values


    Now that you’ve had a chance to work through the analysis on the datasets from
    Figure 5-15, let’s walk through the findings. The left figure has a high positive
    correlation, but it only has 3 points. The lack of data drives up the p-value
    significantly to .34913 and increases the likelihood the data happened by chance.
    This makes sense because having just 3 data points makes it likely to see a linear
    pattern, but it’s not much better than having 2 points that will simply connect
    a line between the two points. This brings up an important rule-of-thumb: having
    more data will decrease your p-value, especially if that data gravitates towards
    a line.


    The second figure is what we just covered. It only has 10 data points, but it
    forms a linear pattern so nicely, we not only have a strong positive correlation
    but also an extremely low p-value. When you have a p-value this low, you can bet
    you are measuring an engineered and tightly controlled process, not something
    sociological or natural.


    The right two figures in Figure 5-15 fail to identify a linear relationship. Their
    correlation coefficient is close to 0 indicating no correlation, and the p-values
    unsurprisingly indicate randomness played a role.


    The rule of thumb is this: the more data you have that consistently resembles
    a line, the more significant the p-value for your correlation will be. The more
    scattered or sparse the data, the more the p-value will increase and thus indicate
    your correlation occurred by random chance.


    # Coefficient of Determination


    Let’s learn an important metric you will see a lot in statistics and machine learning
    regressions. The **coefficient of determination**, called $r^2$, measures how
    much variation in one variable is explainable by the variation of the other variable.
    It is also the square of the correlation coefficient $r$. As $r$ approaches a
    perfect correlation (-1 or 1), the $r^2$ approaches 1. Essentially, $r^2$ shows
    how much two variables interact with each other.'

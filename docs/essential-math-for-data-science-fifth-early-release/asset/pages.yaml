- pgno: 398
  md: '# # Competing with Existing Systems


    This caution might fall under “reasonable objectives” but I think this situation
    is common enough that it warrants its own category. A subtle but problematic type
    of role is one that competes with an existing system that is not actually broken.
    These situations may arise in work environments that lack things to do and need
    to look busy.


    Your employer contracted a vendor to install a sales forecasting system several
    years ago. Your manager now asks you to improve the forecasting system by increasing
    accuracy by 1%.


    Do you see the statistical problem here? If you read Chapter 3, 1% should not
    feel statistically significant, and randomness can easily give you that 1% without
    any effort on your part. Conversely, randomness can swing the opposite direction
    and market forces out of your control can negate any effort you implement. A bad
    sales quarter and factors outside your control (such as competitors moving into
    your company’s market) decrease revenue by -3% rather than the 1% you inevitably
    p-hacked.


    The overarching problem here, besides the redundancy of work, is the outcome is
    not in your sphere of influence. This may become a less than optimal situation.
    It’s one thing if the existing system you are competing with is broken and rudimentary,
    or done completely manual without automation. But competing with a system that
    is not broken is setting yourself up for a bad time. If possible, run for the
    hills when you see this kind of project.'
  merge: -1
  img_proc: true

  md: 'indistinguishable from the normal distribution, which neatly reflects the ideas
    behind the central limit theorem.


    Example 3-23 below shows how to find the critical t-value for 95% confidence.
    You can use this for confidence intervals and hypothesis testing when you have
    a sample size of 30 or less. It''s conceptually the same as the critical z-value,
    but we are usign a T-distribution instead of a normal distribution to reflect
    greater uncertainty. The smaller the sample size, the larger the range reflecting
    greater uncertainty.


    # Example 3-23.


    ```

    from scipy.stats import t


    # get critical value range for 95% confidence

    # with a sample size of 25


    n = 25

    lower = t.ppf(.025, df=n-1)

    upper = t.ppf(.975, df=n-1)


    print(lower, upper)

    -2.063898561628021 2.0638985616280205

    ```


    Note that df is the “degrees of freedom” parameter, and as outlined earlier it
    should be 1 less of the sample size.


    # BEYOND THE MEAN


    We can use confidence intervals and hypothesis testing to measure other parameters
    besides the mean, including variance/standard deviation as well as proportions
    (e.g. 60% of people report improved happiness after walking 1 hour a day). These
    require other distributions such as the Chi-Square distribution instead of the
    normal distribution. As stated, these are all beyond the scope of this book but
    hopefully you have a strong conceptual foundation to extend into these areas if
    needed.


    We will however use confidence intervals and hypothesis testing throughout Chapter
    5 and Chapter 6.'

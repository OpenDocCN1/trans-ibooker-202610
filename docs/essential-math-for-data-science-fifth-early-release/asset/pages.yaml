    # The Normal Distribution


    We touched on probability distributions in the last chapter, particularly the
    binomial distribution and beta distribution. However the most famous distribution
    of all is the normal distribution. The normal distribution, also known as the
    Gaussian distribution, is a symmetrical bell-shaped distribution that has most
    mass around the mean, and its spread is defined as a standard deviation. The “tails”
    on either side become thinner as you move away from the mean.


    Figure 3-2 is a normal distribution for golden retriever weights. Notice how most
    of the mass is around the mean of 64.43 pounds.


    ![](img/8e0dcc1636d032e7728a07e97751e446_115_0.png)


    Figure 3-2. A normal distribution


    # Discovering the Normal Distribution


    The normal distribution is seen a lot in nature, engineering, science, and other
    domains. How do we discover it? Let’s say we sample the weight of 50 adult golden
    retrievers and plot them on a number line as shown in Figure 3-3.'

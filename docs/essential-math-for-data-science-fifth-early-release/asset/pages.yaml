- pgno: 28
  md: 'The **base** is the variable or value we are exponentiating, and the **exponent**
    is the number of times we multiply the base value. For the expression $2^3$, 2
    is the base and 3 is the exponent.


    Exponents have a few interesting properties. Say we multiplied $x^2$ and $x^3$
    together. Observe what happens below when I expand the exponents with simple multiplication,
    and then consolidate into a single exponent:


    $x^2 x^3 = (x*x)*(x*x*x) = x^{2+3} = x^5$


    When we multiply exponents together with the same base, we simply add the exponents
    which is known as the **product rule**. Let me emphasize again that the base of
    all multiplied exponents must be the same for the product rule to apply.


    Let’s explore division next. What happens when we divide $x^2$ by $x^5$ ?


    $\frac{x^2}{x^5}

    \frac{x*x}{x*x*x*x*x}

    \frac{1}{x*x*x}

    \frac{1}{x^3} = x^{-3}$


    As you can see above, when we divide $x^2$ by $x^5$ we can cancel out two $x$’s
    in numerator and denominator, leaving us with $\frac{1}{x^3}$. When a factor exists
    in both the numerator and denominator, we can cancel out that factor.


    What about the $x^{-3}$, you wonder? This is a good point to introduce negative
    exponents, which is another way of expressing an exponent operation in the denominator
    of a fraction. To demonstrate, $\frac{1}{x^3}$ is the same as $x^{-3}$.


    $\frac{1}{x^3} = x^{-3}$'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Tying back the product rule, we can see it applies to negative exponents too.
    To get intuition behind this, let''s approach this problem a different way. We
    can express this division of two exponents by making the “5” exponent of $x^5$
    negative, and then multiplying it with $x^2$. When you add a negative number,
    it is effectively performing subtraction. Therefore, the exponent product rule
    summing the multiplied exponents still holds up as shown below:


    \(\frac{x^2}{x^5} = x^2 \frac{1}{x^5} = x^2 x^{-5} = x^{2+-5} = x^{-3}\)


    Last but not least, can you figure out why any base with an exponent of $0$ is
    $1$?


    $x^0 = 1$


    The best way to get this intuition is to reason that any number divided by itself
    is 1. If you have $\frac{x^3}{x^3}$ it is algebraically obvious that reduces to
    1. But that expression also evaluates to $x^0$.


    $1 = \frac{x^3}{x^3} = x^3 x^{-3} = x^{3+-3} = x^0$


    By the transitive property, which states that if $a = b$ and $b = c$, then $a
    = c$, we know that $x^0 == 1$.


    # # SIMPLIFY EXPRESSIONS WITH SYMPY


    If you get uncomfortable with simplifying algebraic expressions, you can use the
    SymPy library to do the work for you. Example 1-13 shows how to simplify our previous
    example.


    # Example 1-13.


    ```

    from sympy import *


    x = symbols(''x'')

    expr = x**2 / x**5

    print(expr) # x**(-3)

    ```'

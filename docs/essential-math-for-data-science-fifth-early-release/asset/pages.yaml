    sample standard deviation of 2.05, I am 95% confident that the population mean
    lies between 63.686 and 65.1296. How do I know this? Let me show you and if you
    get confused, circle back to this paragraph and remember what we are trying to
    achieve. I highlighted that in bold for a reason!**



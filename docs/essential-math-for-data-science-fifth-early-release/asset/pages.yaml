- pgno: 299
  md: 'several ways but all methods typically turn to maximum likelihood estimation
    (MLE). MLE maximizes the likelihood a given logistic curve would output the observed
    data. It is different than sum of squares, but we can still apply gradient descent
    or stochastic gradient descent to solve it.


    I''ll try to streamline the mathematical jargon and minimize the linear algebra
    here. Essentially the idea is to find the β0 and β1 coefficients that brings our
    logistic curve to those points as closely as possible, indicating it is most likely
    to have produced those points. If you recall in Chapter 2 when we studied probability,
    we combine probabilities (or likelihoods) of multiple events by multiplying them
    together. In this application, we are calculating the likelihood we would see
    all these points for a given logistic regression curve.


    Applying the idea of joint probabilities, each patient has a likelihood they would
    show symptoms _based on the fitted logistic function_ as shown in Figure 6-8.


    ![](img/8e0dcc1636d032e7728a07e97751e446_299_0.png)


    Figure 6-8. Every input value has a corresponding likelihood on the logistic curve


    We fetch each likelihood off the logistic regression curve above or below each
    point. If the point is below the logistic regression curve, we need to subtract
    the resulting probability from 1.0 because we want to maximize the false cases
    too.


    Given coefficients β0 = -3.17576395 and β1 = 0.69267212, Example 6-4 shows how
    we calculate the joint likelihood for this data in Python.


    # _Example 6-4. Calculating the joint likelihood of observing all the points for
    a given logistic regression_


    ```


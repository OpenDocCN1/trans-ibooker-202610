    We already calculated the correlation coefficient for this dataset earlier in
    Example 5-14, which is 0.957586. That’s a strong and compelling positive correlation.
    But again we need to evaluate if this was by random luck. Let’s pursue our hypothesis
    test with 95% confidence using a two-tailed test, exploring if there is a relationship
    between these two variables.'

  md: '# # SUMMATIONS IN SYMPY


    Feel free to come to this sidebar later when you learn more about SymPy. SymPy,
    which we used to graph functions, is actually a symbolic math library and we will
    talk about what this means later in this chapter. But note for future reference
    that a summation operation in SymPy is performed using the `Sum()` operator. Below
    in Example 1-12 we iterate `i` from 1 through `n`, multiply each `i`, and sum
    them. But then we use the `subs()` function to specify `n` as 5, which will then
    iterate and sum all `i` elements from 1 through `n`.


    # *Example 1-12.*


    ```

    from sympy import *


    i,n = symbols(''i n'')


    # iterate each element i from 1 to n,

    # then multiply and sum

    summation = Sum(2*i,(i,1,n))


    # specify n as 5,

    # iterating the numbers 1 through 5

    up_to_5 = summation.subs(n, 5)

    print(up_to_5.doit()) # 30

    ```


    Note that summations in SymPy are lazy, meaning they do not automatically calculate
    or get simplified. So use the `doit()` function to execute the expression.


    # # Exponents


    **Exponents** multiplies a number by itself a specified number of times. When
    you raise 2 to the 3rd power (expressed as 2³ using 3 as a superscript), that
    is multiplying three 2’s together:


    2³ = 2*2*2 = 8'

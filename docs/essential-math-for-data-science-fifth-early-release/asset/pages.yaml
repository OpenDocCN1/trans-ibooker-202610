  md: '# WHAT ABOUT JUPYTER NOTEBOOKS?


    Data scientists often get a bad rap for writing poor code. There are a number
    of reasons why this is the case, but one possible culprit could be the workflows
    encouraged by Jupyter Notebooks.


    You might wonder why I did not use (or encourage) Jupyter notebooks throughout
    this entire book. Jupyter notebooks are a popular platform to write data science
    code but in a way you can place notes, runnable code snippets, and console/chart
    outputs in one place. They can be a helpful tool and provide a convenient way
    to tell a story with data.


    That being said, notebooks are simply not a requirement to do data science work
    unless your employer requires it. Everything we covered in this book was done
    in plain Python without notebooks. I did this on purpose, as I did not want to
    burden readers with setting up additional tooling. This might go against convention,
    but you can have a healthy career without touching notebooks.


    Here is why: notebooks encourage bad programming habits. Notebooks encourage workflows
    that emphasize linearity rather than modularity, meaning they are not conducive
    to writing reusable code. Reusability is arguably the most basic goal of software
    programming. On top of that, notebook cells containing the code snippets can be
    run in any arbitrary order, or re-ran multiple times. If you are not careful,
    you can create confusing states and bugs that will at best create blatant errors,
    and at worst create subtle miscalculations that go unnoticed. Especially if you
    are a beginner, this is a maddening way to learn Python as these technical traps
    are not obvious to newcomers. It is also a way to come across and present a finding,
    only to discover it was the result of a bug and therefore too good to be true.


    I am not advocating to avoid notebooks. By all means, use them if they make you
    and your workplace happy! However I am advocating to not rely on them. Joel Grus
    (author of **Data Science from Scratch**'

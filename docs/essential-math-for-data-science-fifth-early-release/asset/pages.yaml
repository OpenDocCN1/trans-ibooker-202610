- pgno: 306
  md: 'Starting in the 1900’s, it has always been an interest to mathematicians to
    take a linear function and scale its output to fall between 0 and 1, and therefore
    be useful for predicting probability. The log-odds, also called the logit function,
    lends itself to logistic regression for this purpose.


    Remember earlier I pointed out the exponent value \(\beta_0 + \beta_1x\) is a
    linear function? Look below at our logistic function again:


    $$p = \frac{1.0}{1.0 + e^{-(\beta_0+\beta_1x)}}$$


    This linear function being raised to \(e\) is known as the **log-odds** function,
    which takes the logarithm of the odds for the event of interest. Your response
    might be “Wait, I don’t see any \(\log()\) or odds. I just see a linear function!”
    Bear with me, I will show the hidden math.


    As an example, let’s use our logistic regression from earlier where \(\beta_0
    = -3.17576395\) and \(\beta_1 = 0.69267212\). What is the probability of showing
    symptoms after 6 hours, where \(x = 6\)? We already know how to do this: plug
    these values into our logistic function.


    $$p = \frac{1.0}{1.0 + e^{(-3.17576395+0.69267212(6))}} = 0.727161542928554$$


    We plug in these values and output a probability of .72716. But let’s look at
    this from an odds perspective. Recall in Chapter 2 we learned how to calculate
    odds from a probability:


    $$\text{odds} = \frac{p}{1 - p}$$


    $$\text{odds} = \frac{.72716}{1 - .72716} = 2.66517246407876$$


    So at 6 hours, a patient is 2.66517 times more likely to show symptoms than not
    show symptoms.


    When we wrap the odds function in a natural logarithm (a logarithm with base \(e\)),
    we call this the **logit function**. The output of this formula is what we call
    the **log-odds**, named... shockingly... because we take the logarithm of the
    odds.


    $$\text{logit} = log\big(\frac{p}{1 - p}\big)$$


    $$\text{logit} = log\big(\frac{.72716}{1 - .72716}\big) = 0.98026877$$'

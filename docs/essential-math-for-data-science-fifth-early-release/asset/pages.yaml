- pgno: 307
  md: 'Our log-odds at 6 hours is 0.9802687. What does this mean and why do we care?
    When we are in “log-odds land” it is easier to compare one set of odds against
    another. We treat anything greater than 0 as favoring odds an event will happen,
    whereas anything less than 0 is against an event. A log-odds of -1.05 is linearly
    the same distance from 0 as 1.05. In plain odds though, the equivalents are .3499
    and 2.857 respectively, which is not as interpretable. That is the convenience
    of log-odds.


    # # ODDS AND LOGS


    Logarithms and odds have an interesting relationship. Odds are against an event
    when it is between 0.0 and 1.0, but anything greater than 1.0 favors the event
    and extends into positive infinity. This lack of symmetry is awkward. However,
    logarithms rescale an odds so that it is completely linear, where a log-odds of
    0.0 means fair odds. A log-odds of -1.05 is linearly the same distance from 0
    as 1.05, and thus make comparing odds much easier.


    Josh Starmer has a great video talking about this relationship between odds and
    logs here:

    https://www.youtube.com/watch?v=ARfXDSkQf1Y


    Recall I said the linear function in our logistic regression formula β₀ + β₁x
    is our log-odds function. Check this out:


    ```

    log odds = β₀ + β₁x


    log odds = -3.17576395 + 0.69267212(6)


    log odds = 0.98026877

    ```


    It’s the same value 0.98026877 as our previous calculation, the odds of our logistic
    regression at x = 6 and then taking the `log()` of it! So what is the link? What
    ties all this together? Given a probability from a logistic regression p and input
    variable x, it is this:


    ```

    log (p / (1 - p)) = β₀ + β₁x

    ```


    Let’s plot the log-odds line alongside the logistic regression, as shown in Figure
    6-11.'

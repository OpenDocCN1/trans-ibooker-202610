  md: '# Big Data Considerations and Texas Sharpshooter Fallacy


    One final thought before we close this chapter. As we have discussed, randomness
    plays such a role in validating our findings and we always have to account for
    its possibility. Unfortunately with “big data”, machine learning, and other data-mining
    tools the scientific method has suddenly become a practice done backwards. This
    can be precarious and allow me to demonstrate why, adapting an example from Gary
    Smith in his book Standard Deviations.


    Let’s pretend I draw 4 playing cards from a fair deck. There’s no game or objective
    here other than to draw 4 cards and observe them. I get 2 tens, a three, and a
    two. “This is interesting” I say. “I got 2 tens, a three, and a two. Is this meaningful?
    Are the next four cards I draw also going to be two consecutive numbers and a
    pair? What’s the underlying model here?”


    See what I did there? I took something that was completely random and I not only
    looked for patterns, but I tried to make a predictive model out of them. What
    has subtly happened here is I never made it my objective to get these four cards
    with these particular patterns. I observed them after they occurred.


    This is exactly what data mining falls victim to every day: finding coincidental
    patterns in random events. With huge amounts of data and fast algorithms looking
    for patterns, it’s not hard to find things that look meaningful but actually are
    just random coincidences.


    This is also analogous to me firing a gun at a wall. I then draw a target around
    the hole and I then bring my friends over to show off my amazing marksmanship.
    Silly, right? Well many people in data science figuratively do this everyday and
    it is known as the Texas Sharpshooter Fallacy. They set out to act without an
    objective, stumble on something rare, and then point out what they found somehow
    creates predictive value.


    The problem is the law of truly large numbers says rare events are likely to be
    found, we just do not know which ones. When we encounter rare events, we highlight
    and even speculate what might have caused them. The issue is this. The probability
    of a specific person winning the lottery is highly unlikely, but yet someone is
    going to win the lottery. Why should we be surprised when there'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'is a winner? Unless somebody predicted the winner, nothing meaningful happened
    other than a random person got lucky.


    This also applies to correlations which we will study in Chapter 5. With an enormous
    dataset with thousands of variables, is it hard to find statistically significant
    findings with a .05 p-value? You betcha! I’ll find thousands of those. I’ll even
    show evidence the number of Nicholas Cage movies correlates with the number of
    pool drownings in a year.


    So to prevent the Texas Sharpshooter Fallacy and falling victim to big data fallacies,
    try to use structured hypothesis testing and gather data for that objective. If
    you utilize data mining, try to obtain fresh data to see if your findings still
    hold up. Finally, always consider the possibility that things can be coincidental
    and if there is not a common sense explanation then it probably was coincidental.


    We learned how to hypothesize before gathering data, but data mining gathers data
    then hypothesizes. Ironically, we are often more objective starting with a hypothesis,
    because we then seek out data to deliberately prove and disprove our hypothesis.


    # Conclusions


    We learned a lot in this chapter, and you should feel good about getting this
    far. This was probably one of the harder topics in this book! We learned not only
    descriptive statistics from the mean to the normal distribution, but we also tackled
    confidence intervals and hypothesis testing.


    Hopefully you see data a little differently. It is snapshots of something rather
    than a complete capturing of reality. Data on its own is not very useful, and
    we need context, curiosity, and analysis of where it came from before we can make
    meaningful insights with it. We covered how to describe data as well as infer
    attributes about a larger population based on a sample. Finally we addressed some
    of the data mining fallacies we can stumble into if we are not careful, and how
    to remedy that with fresh data and common sense.


    Do not feel bad if you need to go back and review some of the content in this
    chapter, because there’s a lot to digest. It is also important to get in the hypothesis
    testing mindset if you want to be successful at a data science and'
  merge: -1
  img_proc: true

    Notice that ReLU was calculated manually rather than using SymPy''s + diff() +
    function. This is because derivatives work with smooth curves, not jagged corners
    which exists on ReLU. But it''s easy to hack around that simply by declaring the
    slope to be 1 for positive numbers, and 0 for negative numbers. This makes sense
    because negative numbers have a flat line with slope 0. But positive numbers are
    left as-is with a 1-to-1 slope.



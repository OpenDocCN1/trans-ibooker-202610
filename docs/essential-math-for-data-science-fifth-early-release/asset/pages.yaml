  md: '# WHY ARE VECTORS USEFUL?


    A struggle many people have with vectors (and linear algebra in general) is understanding
    why they are useful. They are a highly abstract concept but it has many tangible
    applications. Computer graphics are easier to work with when you have a grasp
    of vectors and linear transformations (the fantastic Manim visualization library
    defines animations and transformations `with vectors`). When doing statistics
    and machine learning work, data is often imported and turned into numerical vectors
    so we can work with it. Solvers like the one in Excel or Python PuLP use linear
    programming, which uses vectors to maximize a solution while meeting those constraints.
    Even video games and flight simulators use vectors and linear algebra not just
    to model graphics but also physics. I think what makes vectors so hard to grasp
    is not that their application is unobvious, but rather these applications are
    so diverse it is hard to see the generalization.


    Note also vectors can exist on more than two dimensions. Below we declare a 3-dimensional
    vector along axes x, y, and z:


    ```

    \(\vec{v} = \begin{vmatrix} x \\ y \\ z \end{vmatrix} = \begin{vmatrix} 4 \\ 1
    \\ 2 \end{vmatrix}\)

    ```



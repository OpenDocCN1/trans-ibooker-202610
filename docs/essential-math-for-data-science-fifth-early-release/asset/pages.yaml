  md: "This is just using 6 rectangles and we will get better accuracy if we were\
    \ to use more rectangles. Let's implement the `beta_distribution()` from scratch\
    \ and integrate 1000 rectangles between .9 and 1.0 as shown in Example A-4.\n\n\
    # Example A-4. Beta distribution from scratch\n\n```\n```python\n# Factorials\
    \ multiply consecutive descending integers down to 1\n# EXAMPLE: 5! = 5 * 4 *\
    \ 3 * 2 * 1\ndef factorial(n: int):\n    f = 1\n    for i in range(n):\n     \
    \   f *= (i + 1)\n    return f\n```\n```\n\n```\n```python\ndef approximate_integral(a,\
    \ b, n, f):\n    delta_x = (b - a) / n\n    total_sum = 0\n\n    for i in range(1,\
    \ n + 1):\n        midpoint = 0.5 * (2 * a + delta_x * (2 * i - 1))\n        total_sum\
    \ += f(midpoint)\n\n    return total_sum * delta_x\n```\n```\n\n```\n```python\n\
    def beta_distribution(x: float, alpha: float, beta: float) -> float:\n    if x\
    \ < 0.0 or x > 1.0:\n        raise ValueError(\"x must be between 0.0 and 1.0\"\
    )\n\n    numerator = x ** (alpha - 1.0) * (1.0 - x) ** (beta - 1.0)\n    denominator\
    \ = (1.0 * factorial(alpha - 1) * factorial(beta - 1)) / (1.0 *\n    factorial(alpha\
    \ + beta - 1))\n\n    return numerator / denominator\n```\n```\n\n```\n```python\n\
    greater_than_90 = approximate_integral(a=.90, b=1.0, n=1000, f=lambda x:\nbeta_distribution(x,\
    \ 8, 2))\nless_than_90 = 1.0 - greater_than_90\n\nprint(\"GREATER THAN 90%: {},\
    \ LESS THAN 90%: {}\".format(greater_than_90,\nless_than_90))\n```\n```\n\nYou\
    \ will notice with the `beta_distribution()` function, we provide a given probability\

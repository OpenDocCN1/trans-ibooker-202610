    # Hill Climbing and Linear Regression


    If you find the calculus overwhelming in building machine learning from scratch,
    you can try a more brute-force method. Let’s try a hill climbing algorithm, where
    we randomly adjust m and b by adding random values for a number of iterations.
    These random values will be positive or negative (which will make the addition
    operation effectively subtraction), and we will only keep adjustments that improve
    our sum of squares.


    But do we just generate any random number as the adjustment? We will want to prefer
    smaller moves but occasionally we might allow larger moves. This way we have mostly
    fine adjustments but occasionally we will make big jumps if they are needed. The
    best tool to do this is to use a standard normal distribution, with a mean of
    0 and a standard deviation of 1. Recall from Chapter 3 that a standard normal
    distribution will have a high density of values near 0, and the farther the value
    is away from 0 (in both the negative and positive direction) the less likely the
    value becomes as shown in Figure A-4.'

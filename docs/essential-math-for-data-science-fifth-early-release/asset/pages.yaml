- pgno: 344
  md: '| Logistic | Output | S-shaped sigmoid curve | Compresses values between 0
    and 1, often assists binary classification |

    |---|---|---|---|

    | Tangent Hyperbolic | Hidden | tanh, S-shaped sigmoid curve between -1 and 1
    | Assists in “centering” data by bringing mean close to 0 |

    | ReLU | Hidden | Turns negative values to 0 | Popular activation faster than
    sigmoid and tanh, mitigates vanishing gradient problems and computationally cheap
    |

    | Leaky ReLU | Hidden | Multiplies negative values by .01 | Controversial variant
    of ReLU that marginalizes rather than eliminates negative values |

    | Softmax | Output | Ensures all output nodes add up to 1.0 | Useful for multiple
    classifications and rescaling outputs so they add up to 1.0 |


    This is not a comprehensive list of activation functions, and in theory any function
    could be an activation function in a neural network.



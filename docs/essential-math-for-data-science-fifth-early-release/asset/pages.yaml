- pgno: 31
  md: 'Lastly, what does it mean when we have a fractional exponent with a numerator
    other than 1, such as \( 8^{\frac{2}{3}} \)? Well that is taking the cube root
    of 8 and then squaring it. Take a look below:


    \( 8^{\frac{2}{3}} = \left(8^{\frac{1}{3}}\right)^2 = 2^2 = 4 \)


    And yes, irrational numbers can serve as exponents like \( 8^\pi \) which is 687.2913.
    This may feel unintuitive, and understandably so! In the interest of time we will
    not dive deep into this as it requires some calculus. But essentially, we can
    calculate irrational exponents by approximating with a rational number. This is
    effectively what computers do since they can only compute to so many decimal places
    anyway.


    For example \(\pi\) has an infinite number of decimal places. But if we take the
    first 11 digits, 3.1415926535, we can approximate \(\pi\) as a rational number
    \( 31415926535 \, / \, 10000000000 \). Sure enough, this gives us approximately
    687.2913 which should approximately match any calculator.


    \( 8^\pi \approx 8^{\frac{31415926535}{10000000000}} \approx 687.2913 \)


    # Logarithms


    A **logarithm** is a math function that finds a power for a specific number and
    base. It may not sound interesting at first, but it actually has many applications.
    From measuring earthquakes to managing volume on your stereo, the logarithm is
    found everywhere. It also finds its way into machine learning and data science
    a lot. As a matter of fact, logarithms will be a key part of logistic regressions
    in **Chapter 6**.


    Start your thinking by asking “2 raised to _what power_ gives me 8?” One way to
    express this mathematically is to use an _x_ for the exponent:


    \( 2^x = 8 \)


    We intuitively know the answer, \( x = 3 \), but we need a more elegant way to
    express this common math operation. This is what the \( \log() \) function is
    for.'

  md: 'When we plot on a two-dimensional plane with two number lines (one for each
    variable) it is known as a **Cartesian plane**, x-y plane, or **coordinate plane**.
    We trace a given x value and then look up the corresponding y value, and plot
    the intersections as a line. Notice that due to the nature of real numbers (or
    decimals, if you prefer), there are an infinite number of x values. This is why
    when we plot the function f (x) we get a continuous line with no breaks in it.
    There are an infinite number of points on that line, or any part of that line.


    If you want to plot this using Python, there are a number of charting libraries
    from Plotly to matplotlib. Throughout this book we will use SymPy to do many tasks,
    and the first we will use is plotting a function. SymPy uses matplotlib so make
    sure you have that package installed. Otherwise it will print an ugly text-based
    graph to your console. After that, just declare the x variable to SymPy using
    symbols (), declare your function, and then plot it as shown in **Example 1-7**
    and **Figure 1-2**.


    # Example 1-7. Charting a linear function in Python using SymPy


    ```

    ```python

    from sympy import *


    x = symbols(''x'')

    f = 2*x + 1

    plot(f)

    ```


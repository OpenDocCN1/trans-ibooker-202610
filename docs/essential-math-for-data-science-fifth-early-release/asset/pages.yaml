    # # Productive Learning


    In a 2008 stand-up special, comedian Brian Regan contrasted his lack of curiosity
    to those who read newspapers. Pointing out that a front page story is never concluded,
    he stated has no desire to turn to the specified page to find out how it ends.
    “And after a 9 year trial, the jury finally came in with a verdict of continued
    on page 22 on column C… I guess I’ll never know” he quips dismissively. He then
    contrasts with those who flip the pages, exclaiming “I want to learn! I want to
    be a learner of things!”


    While Brian Regan might have intended to be self-deprecating, maybe he was right
    about something. Learning a topic for the sake it of is hardly motivation, and
    being disinterested is not always a bad thing. If you pick up a calculus textbook
    and have no purpose for learning it, you will probably end up discouraged and
    frustrated. You need to have a project or objective in mind, and if you find a
    topic uninteresting why bother learning it? Personally, when I allowed myself
    to lose interest in topics I could not find relevant, it was incredibly liberating.
    Even more surprising, my productivity skyrocketed.


    It does not mean you should be uncurious. However there is so much information
    out there, and prioritizing what you learn is an invaluable skill. You can ask
    questions why something is useful and if you cannot get a straight answer, allow
    yourself to move on! Is everybody talking about natural language processing? It
    does not mean you have to! Most businesses do not need natural language processing
    anyway, so it is okay to say it is not worth your effort or time.


    Whether you have projects on your job or you create your own for self-study, have
    something tangible to work towards. Only _you_ get to decide what is worth learning,
    and you can wave off the FOMO in pursuit of things _you_ find interesting and
    relevant.'

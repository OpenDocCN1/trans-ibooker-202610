  md: '# Logarithms


    | Operator | Exponent Property | Logarithm Property |

    |---|---|---|

    | Multiplication | \(x^m \times x^n = x^{m+n}\) | \(log(a \times b) = log(a) +
    log(b)\) |

    | Division | \(\frac{x^m}{x^n} = x^{m-n}\) | \(log\left(\frac{a}{b}\right) = log(a)
    - log(b)\) |

    | Exponentiation | \((x^m)^n = x^{mn}\) | \(log(a^n) = n \times log(a)\) |

    | Zero Exponent | \(x^0 = 1\) | \(log(1) = 0\) |

    | Inverse | \(x^{-1} = \frac{1}{x}\) | \(log(x^{-1}) = log\left(\frac{1}{x}\right)
    = -log(x)\) |



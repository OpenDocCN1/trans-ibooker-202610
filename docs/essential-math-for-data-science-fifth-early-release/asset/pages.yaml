  md: 'image is at least 16,384 variables. Do you have time to do statistical analysis
    on each of those pixel variables? Probably not! Unfortunately this leads many
    data scientists to not learn these statistical metrics at all.


    In an obscure online forum, I once read a post saying statistical regression is
    a scalpel, while machine learning is a chainsaw. When operating with massive amounts
    of data and variables, you cannot sift through all of that with a scalpel. You
    have to resort to a chainsaw and while you lose explainability and precision,
    you at least can scale to make broader predictions on more data. That being said,
    statistical concerns like sampling bias and overfitting do not go away. But there
    are a few practices that can be employed for quick validation.


    # WHY ARE THERE NO CONFIDENCE INTERVALS AND P-VALUES IN SCIKIT-LEARN?


    Scikit-learn does not support confidence intervals and P-values, as these two
    techniques are open problems for higher-dimensional data. This only emphasizes
    the gap between statisticans and machine learning practitioners. As one of the
    maintainers of Scikit-learn, Gael Varoquaux, said “... in general computing correct
    p-values requires assumptions on the data that are not met by the data used in
    machine learning (no multicollinearity, enough data compared to the dimensionality)
    ... P-values are something that are expected to be well checked (they are a guard
    in medical research). Implementing them is asking for trouble... We can give p-values
    only in very narrow settings [with few variables].”


    If you want to go down the rabbit hole, there are some interesting discussions
    on Github:


    +   https://github.com/scikit-learn/scikit-learn/issues/6773


    +   https://github.com/scikit-learn/scikit-learn/issues/16802


    As mentioned before, `statsmodel` is a library that provides helpful tools for
    statistical analysis. Just know it will likely not scale to larger dimensional
    models because of the aforementioned reasons.


    +   https://www.statsmodels.org/stable/regression.html


    A basic technique machine learning practitioners will use to mitigate overfitting
    is a practice called the train/test split, where typically 1/3 of the data is
    set aside for testing and the other 2/3 is used for training (other ratios'

- pgno: 94
  md: '# # Chapter 3. Descriptive and Inferential Statistics


    **Statistics** is the practice of collecting and analyzing data to discover findings
    that are useful, or predict what causes those findings to happen. Probability
    often plays a large role in statistics, as we use data to estimate how likely
    an event is to happen.


    It may not always get credit, but statistics is the heart of so many data-driven
    innovations. Machine learning in itself is a statistical tool, searching for possible
    hypotheses to correlate relationships between different variables in data. However
    there are a lot of blind sides in statistics, even for professional statisticians.
    We can so easily get caught up in what the data says that we forget to ask where
    the data comes from. These concerns become all the more important as “big data”,
    “data mining”, and “machine learning” all accelerate the automation of statistical
    algorithms. Therefore it is important to have a solid foundation in statistics
    and hypothesis testing, so you do not treat these automations as black boxes.


    In this section we will cover the fundamentals of statistics and hypothesis testing.
    Starting with descriptive statistics, we will learn common ways to summarize data.
    After that we will venture into inferential statistics where we try to uncover
    attributes of a population based on a sample.


    # ## What is Data?


    It may seem odd I have to define data, something we all use and take for granted.
    But I think it needs to be done. Chances are if you asked any person what is data,
    they might answer to the effect of “you know... data! It’s... you know... information!”
    and not venture further than that. Nowadays it seems to be marketed as the be
    all and end all. The source of not just truth... but intelligence! It’s the fuel
    for “artificial intelligence” and it is believed that the more data you have,
    the more truth you have. Therefore you can never have enough data. It will unlock
    the secrets needed to redefine your business strategy'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'and maybe even create artificial general intelligence. But let me offer a pragmatic
    perspective on what data is. Data is not important in itself. It’s the analysis
    of data (and how it is produced) that is the driver of all these innovations and
    solutions.


    Imagine you were provided a photo of a family. Can you glean this family’s story
    based on this one photo? What if you had 20 photos? 200 photos? 2000 photos? How
    many photos do you need to know their story? Do you need photos of them in different
    situations? Alone and together? With relatives and friends? At home and at work?


    **Data** is just like photographs; it provides snapshots of a story. The continuous
    reality and contexts are not fully captured, as well as the infinite number of
    variables driving that story. As we will discuss, data may be biased. It can have
    gaps and be missing relevant variables. Ideally we would love to have an infinite
    amount of data capturing an infinite number of variables, with so much detail
    we could virtually recreate reality and construct alternate ones! But is this
    possible? Currently, no. Not even the greatest supercomputers in the world combined
    can come close to capturing the entirety of the world as data.


    Therefore we have to narrow our scope to make our objectives feasible. A few strategic
    photos of the father playing golf can easily tell us whether he is good at golf.
    But trying to decipher his entire life story just through photos? That might be
    impossible. There is so much that cannot be captured in snapshots. These practical
    concerns should also be applied when working with data projects, because data
    is actually just snapshots of a given time capturing only what it is aimed at
    (much like a camera). We need to keep our objectives focused as this hones in
    on gathering data that is relevant and complete. If we make our objectives broad
    and open-ended, we can get into trouble with spurious findings and incomplete
    datasets. This practice, known as **data mining**, has a time and place but it
    must be done carefully. We will revisit this at the end of the chapter.


    Even with narrowly defined objectives, we can still run into problems with our
    data. Let’s return to the question of determining whether a few strategic photos
    can tell whether the father is good at golf. Perhaps if you had a photo of him
    mid-swing you would be able to tell if he had good form. Or perhaps if you saw
    him cheering and fist-pumping at a hole, you can infer he got a good score. Maybe
    you can just take a photo of his scorecard! But it’s important to note all these
    instances can be faked or taken out of context. Maybe he was cheering for'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'someone else, or maybe the scorecard was not his or even forged. Just like
    these photographs, data does not capture context or explanations. This is an incredibly
    important point because data provides clues, not truth. These clues can lead us
    to the truth or mislead us into erroneous conclusions.


    This is why being curious about where data comes from is such an important skill.
    Ask questions on how the data was created, who it was created by, and what the
    data is not capturing. Nowadays it is too easy to get caught up in what the data
    says, and forgetting to ask where it came from. Even worse there are widespread
    sentiments that one can shovel data into machine learning algorithms and expect
    the computer to work it all out. But as the old adage goes, “garbage in, garbage
    out.” No wonder only https://venturebeat.com/2019/07/19/why-do-87-of-data-science-projects-never-make-it-into-production/
    [13% of machine learning projects succeed according to VentureBeat]. Successful
    machine learning projects put thought and analysis into the data, as well as what
    produced the data.'

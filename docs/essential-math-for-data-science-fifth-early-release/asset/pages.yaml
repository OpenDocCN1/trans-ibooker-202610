  md: '# Figure 5-20. A visualization of cross-validation with three folds


    The code in Example 5-22 shows a cross-validation performed across three folds,
    and then the scoring metric (in this case the mean sum of squares

    (MSE)) is averaged alongside its standard deviation to show how


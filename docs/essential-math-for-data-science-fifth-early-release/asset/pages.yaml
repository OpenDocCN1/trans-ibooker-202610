- pgno: 25
  md: 'No matter how many independent variables you have, your function will typically
    only output one dependent variable. When you solve for multiple dependent variables,
    you will likely be using separate functions for each one.


    # Summations


    I promised not to use equations full of Greek symbols in this book. However, there
    is one that is so common and useful that it would be remiss to not cover it. A
    **summation** is expressed as a sigma \(\Sigma\) and adds elements together.


    For example, if I want to iterate the numbers 1 through 5, multiply each by 2,
    and sum them here is how I would express that using a summation. Example 1-10
    shows how to execute this in Python.


    ![](img/8e0dcc1636d032e7728a07e97751e446_25_0.png)


    Example 1-10. Performing a summation in Python


    ```

    summation = sum(2*i for i in range(1,6))

    print(summation)

    ```


    Note that i is a placeholder variable representing each consecutive index value
    we are iterating in the loop, which we multiply by 2 and then sum all together.
    When you are iterating data, you may see variables like x_i indicating an element
    in a collection at index i.


    **THE RANGE() FUNCTION**


    Recall that the `range()` function in Python is end exclusive, meaning if you
    invoke `range(1, 4)` it will iterate the numbers 1, 2, and 3. It excludes the
    4 as an upper boundary.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'It is also common to see $n$ represent the number of items in a collection,
    like the number of records in a dataset. Here is one such example where we iterate
    a collection of numbers of size $n$, multiply each one by 10, and sum them.


    ![](img/8e0dcc1636d032e7728a07e97751e446_26_0.png)


    In Example 1-11 we use Python we execute this expression on a collection of 4
    numbers. Note that in Python (and most programming languages in general) we typically
    reference items starting at index 0, while in math we start at index 1. Therefore
    we shift accordingly in our iteration by starting at 0 in our `range()`.


    # Example 1-11. Summation of elements in Python


    ```

    x = [1, 4, 6, 2]

    n = len(x)


    summation = sum(10*x[i] for i in range(0,n))

    print(summation)

    ```


    That is the gist of summation. In a nutshell, a summation $\Sigma$ says “add a
    bunch of things together” and uses an index $i$ and a maximum value $n$ to express
    each iteration feeding into the sum. We will see them throughout this book.'

    # ## Backpropogation


    Before we start using stochastic gradient descent to optimize our neural network,
    a challenge we have is figuring out how to change each of the weight and bias
    values accordingly even though they all are tangled together to create the output
    variable, which then is used to calculate the residuals. How do we find the derivative
    of each weight _w<sub>i</sub>_ and bias _b<sub>i</sub>_ variable? We need to use
    the chain rule which we covered in Chapter 1.


    # ## Calculating the Weight and Bias Derivatives


    We are not quite ready to apply stochastic gradient descent to train our neural
    network yet. We have to get the partial derivatives with respect to the weights
    _W<sub>i</sub>_ and biases _B<sub>i</sub>_, and we have the chain rule to help
    us.'

    # Eigenvectors and Eigenvalues


    **Matrix decomposition** is breaking up a matrix into its basic components, much
    like factoring numbers (e.g. 10 can be factored to 2 x 5).


    Matrix decomposition is helpful for tasks like finding inverse matrices, calculating
    determinants, as well as linear regression. There are many ways to decompose a
    matrix depending on your task. In Chapter 5 we will use a matrix decomposition
    technique, QR decomposition, to perform a linear regression.


    But in this chapter let''s focus on a common method called eigendecomposition,
    which is often used for machine learning and Principal Component Analysis (PCA).
    At this level we do not have the bandwidth to dive into each of these applications.
    For now, just know eigendecomposition is helpful for breaking up a matrix into
    components that are easier to work with in different machine learning tasks. Note
    also it only works on square matrices.


    In eigendecomposition, there are two components: the eigenvalues denoted by lambda
    λ and eigenvector by v shown in Figure 4-24.'
  merge: -1
  img_proc: true

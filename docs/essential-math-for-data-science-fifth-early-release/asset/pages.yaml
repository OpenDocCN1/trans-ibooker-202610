  md: '# SUCCESS IS NOT ALWAYS ABOUT PROFITABILITY


    Discern how your customer is defining “success.” Businesses are pursuing AI, machine
    learning, and data science to be successful, right? But what is success?


    Is it profitability? Not always. In our highly speculative economy, success might
    be another series of VC funding, having customer growth or revenue growth, or
    high valuation even if the company is losing millions or billions of dollars.
    None of these metrics have anything to do with profitability.


    Why is this happening? Tolerance for long-term plays in venture capital have marginalized
    profitability, believing it will be achieved much farther down the road. However,
    it is possible this is creating bubbles much like what happened in the dot-com
    boom of 2000.


    In the end, profitability has to be achieved for a company to be long-term successful,
    but not everyone has that goal. Many founders and investors simply want to ride
    the growth and cash out before the bubble bursts, often when the company is sold
    to the public through an IPO.


    What does this mean for you? Regardless if you are a practitioner or adviser,
    working at a startup or a Fortune 500, recognize what is motivating your client
    or employer. Are they seeking higher valuations? Actual profitability? Intrinsic
    value or perceived value? This will directly affect what you work on and what
    your clients want to hear, and you can judge accordingly if you are in a place
    to assist them or not.


    If you want to learn more about venture capital, speculative valuation, and the
    effects of startup culture, *The Cult of We* by Wall Street Journal writers Eliot
    Brown and Maureen Farrell is fantastic.


    When projects are planned on tools rather than problems, there is a high likelihood
    of the project not succeeding. This means as an advisor you have to hone in your
    listening skills, and identify the questions that clients are'

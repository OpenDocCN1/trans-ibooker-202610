- pgno: 371
  md: 'How did we get here? And how can something lacking definition like *data science*
    become such a compelling force in the corporate world? Most importantly, how does
    its definition (or lack thereof) affect your career? These are all important questions
    we talk about in this chapter.


    This is why I tell my clients **a better definition for data science is software
    engineering with proficiency in statistics, machine learning, and optimization.**
    If you take any of those four disciplines away (software engineering, statistics,
    machine learning, and optimization) the data scientist is at risk of not performing.
    Most organizations have struggled to make clear distinctions about skillsets that
    make a data scientist effective, but the definition provided should give clarity.
    While some may think that software engineering is a controversial requirement,
    I think it is highly necessary given the direction industries are going. We will
    address this point later.


    But first, the best way to understand *data science* is to trace back the history
    of the term.


    # A Brief History of Data Science


    We could trace *data science* all the way back to the origin of statistics, as
    early as the 17th century or even the 8th century. For the sake of brevity, let''s
    start in the 1990''s. Analysts, statisticians, researchers, “quants,” and data
    engineers often maintained distinct roles. Tooling stacks often consisted of spreadsheets,
    R, MATLAB, SAS, and SQL.


    Of course, things started to change rapidly after 2000. The internet and connected
    devices started to generate enormous amounts of data. Alongside the inception
    of Hadoop, Google pushed analytics and data collection to unimaginable heights.
    As 2010 approached, executives at Google insisted statisticians will have the
    “sexy” job in the next decade. What came next was prescient.'
  merge: -1
  img_proc: true
- pgno: 372
  md: "In 2012, the Harvard Business Review mainstreamed this concept called *data\
    \ science* and declared it the “sexiest job of the 21st century.” After the HBR\
    \ article, many companies and corporate workers raced to fill the *data science*\
    \ void. Management consultants were primed and positioned to educate Fortune 500\
    \ leaders on how to bring *data science* to their organizations. SQL developers,\
    \ analysts, researchers, quants, statisticians, engineers, physicists, and a myriad\
    \ of other professionals rebranded themselves as “data scientists.” Tech companies,\
    \ feeling that traditional role titles like “analyst,” “statistician,” or “researcher”\
    \ sounded dated, renamed the roles to “data scientist.”\n\nNaturally, management\
    \ at Fortune 500 companies came under pressure from the C-suite to get on the\
    \ *data science* bandwagon. The initial reasoning was a lot of data was being\
    \ collected, therefore *big data* becoming a trend and *data scientists* were\
    \ needed to get insight from it. Around this time, the word “data-driven” became\
    \ a maxim across industries. The corporate world believed that unlike people,\
    \ data is objective and unbiased.\n\n> **REMINDER - DATA IS NOT OBJECTIVE AND\
    \ UNBIASED!**\n> \n> To this day, many professionals and managers fall into the\
    \ fallacy thinking data is objective and unbiased. Hopefully after reading this\
    \ book you know this is simply not true, and refer to *Chapter 3* if you need\
    \ a refresher why.\n\nManagement and HR at companies, unable to compete for specialized\
    \ deep learning PhD’s that were gobbled up by FAANG (Facebook, Amazon, Apple,\
    \ Netflix, and Google) and still under pressure to check the *data science* box,\
    \ made an interesting move. They rebranded existing teams of analysts, SQL developers,\
    \ and Excel jockeys as “data scientists.” Cassie Kozyrkov, the Chief Decision\
    \ Scientist at Google, described this open secret in a *2018* blog article on\
    \ *Hackernoon*:"

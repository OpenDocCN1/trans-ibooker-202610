  md: '# Chapter 4. Linear Algebra


    Changing gears a little bit, let''s venture away from probability and statistics
    and into linear algebra. Sometimes people confuse linear algebra with basic algebra,
    thinking maybe it has to do with plotting lines using the algebraic function y
    = mx + b. This is why linear algebra should probably have been called “vector
    algebra” or “matrix algebra” because it is much more abstract. Linear systems
    play a role, but in a much more metaphysical way.


    So, what exactly is linear algebra? Well, linear algebra concerns itself with
    linear systems, but represents them through vector spaces and matrices. If you
    do not know what a vector or a matrix is, do not worry! We will define and explore
    them in depth. Linear algebra is hugely fundamental to many applied areas of math,
    statistics, operations research, data science, and machine learning. When we work
    with data in any of these areas, we are using linear algebra and perhaps you may
    not even know it.


    You can get away with not learning linear algebra for awhile, using machine learning
    and statistics libraries that do it all for you. But if we are going to get intuition
    behind these black boxes and be more effective at working with data, understanding
    the fundamentals of linear algebra is an inevitability. Linear algebra is an enormous
    topic that can fill thick textbooks, so of course we cannot gain total mastery
    in just one chapter of this book. However, we can learn enough to be more comfortable
    with it and navigate the data science domain effectively. There will also be opportunities
    to apply it in the remaining chapters in this book, including Chapter 5 and Chapter
    7.


    # What is a Vector?


    Simply put a vector is an arrow in space with a specific direction and length,
    often representing a piece of data. It is the central building block to linear
    algebra, including matrices and linear transformations. In its'

    \ = 1.0\n\nfor p in patient_data:\n    if p.y == 1.0:\n        joint_likelihood\
    \ *= logistic_function(p.x)\n    elif p.y == 0.0:\n        joint_likelihood *=\
    \ (1.0 - logistic_function(p.x))\n\nprint(joint_likelihood) # 4.7911180221699105e-05\n\
    ```\n\nHere's a mathematical trick we can do to compress that `if` expression.\
    \ As we covered in Chapter 1, when you set any number to the power of 0 it will\
    \ always be 1. Take a look at this formula and note the handling of true (1) and\
    \ false (0) cases in the exponents.\n\njoint likelihood = \\(\\prod_{i=1}^{n}\
    \ \\left( \\frac{1.0}{1.0 + e^{-(\\beta_0 + \\beta_1 x_i)}} \\right)^{y_i} \\\
    times \\left( \\frac{1.0}{1.0 + e^{-(\\beta_0 + \\beta_1 x_i)}} \\right)^{1.0-y_i}\\\
    )\n\nTo do this in Python, compress everything inside that for loop into Example\
    \ 6-5:\n\n# Example 6-5. Compressing the joint likelihood calculation without\
    \ an `if` expression\n\n```\nfor p in patient_data:\n    joint_likelihood *= logistic_function(p.x)\
    \ ** p.y \\\\\n    (1.0 - logistic_function(p.x)) ** (1.0 - p.y)\n```\n\nWhat\
    \ exactly did I do? Notice that there are two halves to this expression, one for\
    \ when \\(y = 1\\) and the other where \\(y = 0\\). When any number is raised\
    \ to exponent 0 it will result in 1. Therefore, whether \\(y\\) is 1 or 0 it will\
    \ cause the opposite condition on the other side to evaluate to 1 and have no\
    \ effect in multiplication. We get to express our `if` expression but do it completely\
    \ in a mathematical expression. We cannot do derivatives on expressions that use\
    \ `if`, so this will be helpful.\n\nNote that computers can get overwhelmed multiplying\
    \ several small decimals together, known as **floating point underflow**. This\
    \ means that as decimals get smaller and smaller, which can happen in multiplication,\
    \ the computer runs into limitations keeping track of that many decimal places.\
    \ There is a clever mathematical hack to get around this. You can take the `log()`\
    \ of each decimal you are multiplying, and instead add them together. This is\
    \ thanks to the additive properties of logarithms we covered in Chapter 1. You\
    \ can then call the `exp()` function to convert the total sum back to get the\
    \ product.\n\nLet's revise our code to use logarithmic addition instead of multiplication.\
    \ Note that the `log()` function will default to base *e* and while any base technically\
    \ works, this is preferable because *e^x* is the derivative of itself and will\

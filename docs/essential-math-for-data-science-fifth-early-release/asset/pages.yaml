  md: '# COEFFICIENT OF VARIATION


    A helpful tool related to measuring spread is the coefficient of variation. It
    compares two distributions and quantifies how spread out each of them are. It
    is simple to calculate: divide the standard deviation by the mean. Here is the
    formula alongside the example comparing two neighborhoods.


    ```

    cv = \frac{\sigma}{\mu}


    cv_A = \frac{3000}{140000} = 0.0214


    cv_B = \frac{10000}{800000} = 0.0125

    ```


    As seen above neighborhood A, while cheaper than than neighborhood B, has more
    spread and therefore more price diversity than neighborhood B.


    # Inferential Statistics


    Descriptive statistics, which we covered so far, is commonly understood. However
    when we get into inferential statistics the abstract relationships between sample
    and population comes into full play. These abstract nuances are not something
    you want to rush through, but rather take your time and absorb thoughtfully. As
    stated earlier, we are wired as humans to be biased and quickly come to conclusions.
    Being a good data science professional requires you to suppress that primal desire
    and consider the possibility that other explanations can exist. It is acceptable
    (perhaps even enlightened) to theorize there is no explanation at all and a finding

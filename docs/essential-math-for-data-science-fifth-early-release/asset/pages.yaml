    “green”, and “blue” values. Each of these values are between 0 and 255 and express
    how these three colors are mixed to create the desired color. For example, if
    we express the RGB as (red, green, blue) then dark orange would have an RGB of
    (255, 140, 0) and pink would be (255, 192, 203). Black would be (0, 0, 0) and
    white would be (255, 255, 255).



    # Probability Math


    When we work with a single probability of an event P(X), known as a **marginal
    probability**, the idea is fairly straightforward as discussed previously. But
    when we start combining probabilities of different events together it gets a little
    less intuitive.


    # Joint Probabilities


    Let’s say you have a fair coin and a fair 6-sided die. You want to find the probability
    of flipping a “Heads” and rolling a “6” on the coin and die respectively. These
    are two separate probabilities of two separate events, but we want to find the
    probability that both events will occur together. This is known as a **joint probability**.


    Think of a joint probability as an AND operator. I want to find the probability
    of flipping a heads AND rolling a six. We want both events to happen together,
    so how do we calculate this probability?


    There are 2 sides on a coin and 6 sides on the die, so the probability of heads
    is 1/2 and probability of six is 1/6. The probability of both events occurring
    (assuming they are independent, more on this later!) is simply multiplying the
    two together:


    ```

    P(A AND B) = P(A)*P(B)


    P (Heads) = 1/2


    P (6) = 1/6


    P (Heads AND 6) = 1/2 * 1/6 = 1/12 = .08333

    ```


    Easy enough, but why is this the case? A lot of probability rules can be discovered
    by generating all possible combinations of events, which comes from an area of
    discrete math known as permutations and combinations. For this case, generate
    every possible outcome between the coin and die, pairing heads (H) and tails (T)'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'with the numbers 1 through 6. Note I put asterisks “**” around the outcome
    of interest where we get heads and a six.


    H1 H2 H3 H4 H5 *H6* T1 T2 T3 T4 T5 T6


    Notice there are 12 possible outcomes when flipping our coin and rolling our die.
    The only one that is of interest to us is “H6,” getting a heads and a six. So
    because there is only 1 outcome that satisfies our condition, and there are 12
    possible outcomes, the probability of getting a heads and a six is $\frac{1}{12}$.


    Rather than generate all possible combinations and counting the ones of interest
    to us, we can again use the multiplication as a shortcut to find the joint probability.
    This is known as the **product rule**.


    $P(\text{A AND B}) = P(A) \times P(B)$


    $P(\text{Heads AND 6}) = \frac{1}{2} \times \frac{1}{6} = \frac{1}{12} = .08333$


    # Union Probabilities


    We discussed joint probabilities, which is the probability of two or more events
    occurring simultaneously. But what about the probability of getting event A or
    B? When we deal with “OR” operations with probabilities, this is known as a **union
    probability**.


    Let’s start with **mutually exclusive** events, which are events that cannot occur
    simultaneously. For example, if I roll a die I cannot simultaneousely get a “4”
    and a “6”. I can only get one outcome. Getting the union probability for these
    cases are easy. I just simply add them together. If I want to find the probability
    of getting a “4” or “6” on a die roll, it is going to be $\frac{2}{6} = \frac{1}{3}$.


    $P(4) = \frac{1}{6}$


    $P(6) = \frac{1}{6}$


    $P(4 \text{ OR } 6) = \frac{1}{6} + \frac{1}{6} = \frac{1}{3}$'

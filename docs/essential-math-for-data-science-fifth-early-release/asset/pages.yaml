  md: "Example 4-21 is how we calculate eigenvectors and eigenvalues in NumPy for\
    \ a given matrix A:\n\n# Example 4-21. Performing eigendecomposition in NumPy\n\
    \n```\nfrom numpy import array, diag\nfrom numpy.linalg import eig, inv\n\nA =\
    \ array([\n    [1, 2],\n    [4, 5]\n])\n\neigenvals, eigenvecs = eig(A)\n\nprint(\"\
    EIGENVALUES\")\nprint(eigenvals)\nprint(\"\\\\nEIGENVECTORS\")\nprint(eigenvecs)\n\
    \n\"\"\"\nEIGENVALUES\n[-0.46410162  6.46410162]\n\nEIGENVECTORS\n[[ -0.80689822\
    \  -0.34372377]\n [ 0.59069049  -0.9390708 ]]\n\"\"\"\n```\n\nSo how do we rebuild\
    \ matrix $A$ from the eigenvectors and eigenvalues?\nRecall this formula:\n\n\
    $Av = \\lambda v$\n\nWe need to make a few tweaks to the formula to reconstruct\
    \ $A$:\n\n$A = Q \\Lambda Q^{-1}$\n\nIn this new formula, $Q$ is the eigenvectors,\
    \ $\\Lambda$ is the eigenvalues in diagonal\nform, and $Q^{-1}$ is the inverse\
    \ matrix of $Q$. Diagonal form means the vector is\npadded into a matrix of zeroes,\
    \ and occupies the diagonal line in a similar\npattern to an identity matrix.\n\
    \nExample 4-22 brings the example full circle in Python, starting with\ndecomposing\
    \ the matrix and then recomposing it."

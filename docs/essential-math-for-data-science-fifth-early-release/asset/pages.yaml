    # BE CAREFUL MAKING CLASSIFICATIONS ON PEOPLE!


    A quick and surefire way to shoot yourself in the foot is to collect data on people
    and use it to make predictions haphazardly. Not only can data privacy concerns
    come about, but legal and PR issues can emerge if the model is found to be discriminatory.
    Input variables like race and gender can become weighted from ML training. After
    that, undesirable outcomes are inflicted on those demographics like not being
    hired or being denied loans. More extreme applications include being falsely flagged
    by surveillance systems or being denied criminal parole. Note too that seemingly
    benign variables like commute time have been found to correlate with discriminatory
    variables.


    At the time of writing, a number of articles have been citing machine learning
    discrimination as an issue.

    https://www.theregister.com/2021/07/16/facial_recognition_failure/

    https://www.nytimes.com/2020/06/24/technology/facial-recognition-arrest.html


    As data privacy laws continue to evolve, it is advisable to err on the side of
    caution and engineer personal data carefully. Think about what automated decisions
    will be propagated and how that can cause harm. Sometimes it is better to just
    leave a “problem” alone and keep doing it manually, rather than


    Finally on this employee retention example, think about where this data came from.
    Yes, I made up this dataset but in the real world you always want to question
    what process created the data. Over what period of time did this sample come from?
    How far back do we go looking for employees who quit? What constitutes an employee
    who stayed? Are they current employees at this point in time? How do we know they
    are not about to quit, making them a false negative? Data scientists easily fall
    into traps only analyzing what data says, but not questioning where it came from
    and what assumptions are built into it.


    The best way to get answers to these questions is understand what the predictions
    are being used for. Is it to decide when to give people promotions to retain them?
    Can this create a circular bias promoting people with a set of attributes? Will
    that bias be re-affirmed when those promotions start becoming the new training
    data?


    These are all important questions, and perhaps even inconvenient ones that cause
    unwanted scope creep into the project. If this scrutiny is not welcomed by your
    team or leadership on a project, consider empowering yourself with a different
    role where curiosity becomes a strength.



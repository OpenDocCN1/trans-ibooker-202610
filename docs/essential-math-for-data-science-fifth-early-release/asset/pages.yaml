    \ 5-13. Performing stochastic gradient descent for a linear regression\n\n```\n\
    import pandas as pd\nimport numpy as np\n\n# Input data\ndata = pd.read_csv('https://bit.ly/2KF29Bd',\
    \ header=0)\n\nX = data.iloc[:, 0].values\nY = data.iloc[:, 1].values\n\nn = data.shape[0]\

    # BEWARE OF P-HACKING!


    There is a problem getting more awareness in the scientific research community
    called p-hacking, where researchers shop for statistically significant p-values
    of .05 or less. This is not hard to do with “big data”, machine learning, and
    data mining where we can traverse hundreds or thousands of variables and then
    find statistically significant (but coincidental) relationships between them.


    Why do so many researchers p-hack? Many are probably not aware they are doing
    it. It’s easy to keep tuning and tuning a model, omitting “noisy” data and changing
    parameters, until it gives the “right” result. Others are simply under pressure
    by academia and industry to produce lucrative, not objective, results.


    If you are hired by the Calvin Cereal Company to study whether Frosted Chocolate
    Sugar Bombs causes diabetes, do you expect to give an honest analysis and get
    hired again? What if a manager asks you to produce a forecast showing $15 million
    in sales next quarter for a new product launch? You have no control over what
    sales will be, but you’re asked for a model that produces a pre-determined result.
    In the worst case, you may even be held accountable when it proves wrong. Unfair,
    but it happens!


    This is why soft skills like diplomacy can make a difference in a data science
    professional’s career. If you can share difficult and inconvenient stories in
    a way that productively gets an audience, that is a tremendous feat. Just be mindful
    of the organization’s managerial climate and always propose alternate solutions.
    If you end up in a no-win situation where you are asked to p-hack, and could be
    held accountable for when it backfires, then definitely change work environments!



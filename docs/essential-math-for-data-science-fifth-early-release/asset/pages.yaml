  md: '# THE POWER OF SYMPY


    SymPy is a powerful and fantastic computer algebra system (CAS) for Python that
    uses exact symbolic computation rather than approximate computation using decimals.
    It’s helpful for those situations you would use “pencil and paper” to solve math
    and calculus problems, with the benefit of using familiar Python syntax. Rather
    than represent the square root of 2 by approximating 1 . 4142135623730951, it
    will preserve it as exactly *sqrt(2)*.


    So why not use SymPy for everything math-related? While we will use it throughout
    this book, it is important to still be comfortable doing Python math with plain
    decimals, as SciKit-Learn and other data science libraries take this approach.
    It is much faster for computers to use decimals rather than symbols. SymPy does
    also struggle when mathematical expressions start to get too big. But keep SymPy
    in your back pocket as your advantage, and do not tell your high school and college-age
    kids about it. They can literally use it to do their math homework.


    https://docs.sympy.org/latest/tutorial/intro.html



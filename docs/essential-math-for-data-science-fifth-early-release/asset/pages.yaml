    # # P-Values


    Just like linear regression, we are not done just because we have an R^2. We need
    to investigate how likely we would have seen this data by chance rather than because
    of an actual relationship. This means we need a P-Value.


    To do this, we will need to learn a new probability distribution called the Chi-Square
    Distribution, annotated as chi^2 Distribution. It is continuous and used in several
    areas of statistics, including this one!


    If we take each value in a standard normal distribution (mean of 0 and standard
    deviation of 1) and square it, that will give us the chi^2 distribution with 1
    degree of freedom. For our purposes, the degrees of freedom will depend on how
    many parameters n are in our logistic regression, which will be n - 1. You can
    see examples of different degrees of freedom in Figure 6-15. Since we have two
    parameters (hours of exposure and whether symptoms were shown), our degrees of
    freedom will be 1 because 2 - 1 = 1.'

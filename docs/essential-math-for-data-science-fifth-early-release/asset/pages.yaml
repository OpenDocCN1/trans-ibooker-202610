    to missing or broken constraints.


    **Infeasible** – There is no overlap with all the constrained regions.


    **Alternate Solutions** – The objective line is parallel to the bounding constraint,
    presenting many solutions along the line.


    **Redundancy** – Two parallel constraints bounding the same direction can be consolidated
    into one.



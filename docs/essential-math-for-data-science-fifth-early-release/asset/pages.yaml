  md: 'P(Coffee|Cancer) × P(Cancer) = .85 × .005 = .00425


    If we already have established our probability only applies to people with Cancer,
    does it not make sense to use P(Coffee|Cancer) instead of P(Coffee)? One is more
    specific and applies to a condition that’s already been established. So we should
    use P(Coffee|Cancer) as P(Cancer) is already part of our joint probability. This
    means the probability of someone having cancer and being a coffee drinker is 0.425%.


    P(Coffee and Cancer) = P(Coffee|Cancer) × P(Cancer) = .85 × .005 = .00425


    This joint probability also applies in the other direction. I can find the probability
    of someone being a coffee drinker and having cancer by multiplying P(Cancer|Coffee)
    and P(Coffee). As you can observe, I arrive at the same answer:


    P(Cancer|Coffee) × P(Coffee) = .0065 × .65 = .00425


    If we did not have any conditional probabilities available, then the best we can
    do is multiply P(Coffee Drinker) and P(Cancer) as shown here:


    P(Coffee Drinker) × P(Cancer) = .65 × .005 = .00325


    Now think about this: if event A has no impact on event B, then what does that
    mean for conditional probability P(B|A)? That means P(B|A) = P(B), meaning event
    A occurring makes no difference to how likely event B is to occur. Therefore we
    can update our joint probability formula to be, regardless if the two events are
    dependent, to be:


    P(A AND B) = P(B) × P(A|B)


    And finally let’s talk about unions and conditional probability. If I wanted to
    calculate the probability of A or B occurring, but A may affect the probability
    of B, we update our sum rule like this:


    P(A OR B) = P(A) + P(B) – P(A|B) × P(B)


    As a reminder, this applies to mutually exclusive events as well. The sum rule
    P(A|B) × P(B) would yield 0 if the events A and B cannot happen simultaneously.'

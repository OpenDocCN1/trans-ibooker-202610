- pgno: 409
  md: 'The binomial coefficient function allows us to select k outcomes from n possibilities
    with no regard for ordering. If you have k = 2 and n = 3, that would yield sets
    (1,2) and (1,2,3), respectively. Between those two sets, the possible distinct
    combinations would be (1,3), (1,2), and (2,3). That is 3 combinations so that
    would be a binomial coefficient of 3. Of course, using the `binomial_coefficient()`
    function we can avoid all that permutation work by using factorials and multiplication
    instead.


    When implementing `binomial_distribution()`, notice how we take the binomial coefficient
    and multiply it by the probability of success p occurring k times (hence the exponent).
    We then multiply it by the opposite case: the probability of failure 1.0 - p occurring
    n - k times. This allows us to account for the probability p of an event occurring
    versus not occurring across several trials.


    # Beta Distribution from Scratch


    If you are curious how to build a beta distribution from scratch, you will need
    to re-use the `factorial()` function we used for the binomial distribution as
    well as the `approximate_integral()` function we built in the last chapter.



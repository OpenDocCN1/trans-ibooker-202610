  md: 'As mentioned earlier, our data in a linear regression is a sample from a population.
    Therefore our regression is only as good as our sample. Our linear regression
    line also has a normal distribution running along it. Effectively, this makes
    each predicted y value a sample statistic just like the mean. As a matter of fact,
    the “mean” is shifting along the line.


    Remember when we talked statistics in Chapter 2 about variance and standard deviation?
    The concepts apply here too. With a linear regression, we hope that data follows
    a normal distribution in a linear fashion. A regression line serves as the shifting
    “mean” of our bell curve and the spread of the data around the line reflects the
    variance/standard deviation, as shown in Figure 5-16.'

  md: '# DO TRAINING/TEST SPLITS HAVE TO BE THIRDS?


    We do not have to fold our data by thirds. You can use **k-fold validation** to
    split on any proportion. Typically 1/3, 1/5, or 1/10 are commonly used for the
    proportion of test data, but 1/3 is the most common.


    Generally, the _k_ you choose has to result in a test dataset that has a large
    enough sample for the problem. You also need enough alternating/shuffled test
    datasets to provide a fair estimate of performance on data that was not seen before.
    Modestly sized datasets can use _k_ values of 3, 5, or 10. **Leave-one-out-cross-validation
    (LOOCV)** will alternate each individual data record as the only sample in the
    test dataset, and this can be helpful when the whole dataset is small.


    When you get concerned about variance in your model, one thing you can do is rather
    than doing a simple train/test split or cross-validation, you can use **random
    fold validation** to repeatedly shuffle and train/test split your data an unlimited
    number of times and aggregate the testing results. In *Example 5-23* there are
    10 iterations of randomly sampling a 1/3 of the data for testing and the other
    2/3 for training. Those 10 testing results are then averaged alongside its standard
    deviation to see how consistently the test datasets perform.


    What’s the catch? It’s computationally very expensive as we are training the regression
    many times.


    # *Example 5-23. Using a random-fold validation for a linear regression*


    ```

    import pandas as pd

    from sklearn.linear_model import LinearRegression

    from sklearn.model_selection import cross_val_score, ShuffleSplit


    df = pd.read_csv(''https://bit.ly/38XwbeB'', delimiter=",")


    # Extract input variables (all rows, all columns but last column)

    X = df.values[:, :-1]

    ```'

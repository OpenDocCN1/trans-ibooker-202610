    Now you might be wondering if it makes sense to build 5.9375 and 4.6875 units?
    Linear programming systems are much more efficient if you can tolerate continuous
    values in your variables, and perhaps you can just round them afterwards. But
    certain types of problems absolutely require integers and binary variables to
    be handled discretely.


    To force the x and y variables to be treated as integers, provide a category argument
    `cat=LpInteger` as shown in Example A-12.


    # *Example A-12. Forcing variables to be solved as integers*


    ```

    # declare your variables

    x = LpVariable("x", 0, cat=LpInteger) # 0<=x

    y = LpVariable("y", 0, cat=LpInteger) # 0<=y

    ```


    Graphically, this means we fill our feasible region with discrete points rather
    than a continuous region. Our solution will not land on a vertex necessarily but
    rather the point that is closest to the vertex as shown in Figure A-9.'

- pgno: 274
  md: "How do we calculate this? We need to get the margin of error, and plus/minus\
    \ it around the predicted y-value. It's a beastly equation that involves a critical\
    \ value from the t-distribution as well as the standard error of the estimate.\
    \ Let's take a look:\n\n![](img/8e0dcc1636d032e7728a07e97751e446_274_0.png)\n\n\
    The x-value we are interested in is specified as $x_0$, which in this case is\
    \ 8.5. Here is how we solve this in Python shown in Example 5-20.\n\n# **Example\
    \ 5-20.** Calculating a prediction interval of vet visits for a dog that’s 8.5\
    \ years old\n\n```\nimport pandas as pd\nfrom scipy.stats import t\nfrom math\
    \ import sqrt\n\n# Load the data\npoints = list(pd.read_csv('https://bit.ly/2KF29Bd',\
    \ delimiter=\",\").itertuples())\n\nn = len(points)\n\n# Linear Regression Line\n\
    m = 1.939\nb = 4.733\n\n# Calculate Prediction Interval for x = 8.5\nx_0 = 8.5\n\
    x_mean = sum(p.x for p in points) / len(points)\n\nt_value = t(n - 2).ppf(.975)\n\
    \nstandard_error = sqrt(sum((p.y - (m * p.x + b)) ** 2 for p in points) / (n -\
    \ 2))\n\nmargin_of_error = t_value * standard_error * \\\n    sqrt(1 + (1 / n)\
    \ + (n * (x_0 - x_mean) ** 2) / \\\n    (n * sum(p.x ** 2 for p in points) - sum(p.x\
    \ for p in points) ** 2))\n\npredicted_y = m*x_0 + b\n```"

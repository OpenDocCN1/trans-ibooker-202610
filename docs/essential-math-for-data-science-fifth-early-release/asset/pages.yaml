    It is the same thing with NoSQL which includes platforms like Couchbase and MongoDB.
    While some readers might disagree and make valid arguments, I believe comparing
    NoSQL with SQL is comparing apples and oranges. Yes they both store data and provide
    querying capabilities, but I do not think that puts them in competition. They
    have different qualities for different use cases. NoSQL stands for “not only SQL”
    and is better equipped to store unstructured data, like pictures or freeform text
    articles. SQL is better equipped to store structured data. SQL maintains data
    integrity more aggressively than NoSQL, although at the cost of computing overhead
    and less scalability.


    # SQL, THE LINGUA FRANCA OF DATA


    In 2015, many speculated NoSQL and distributed data processing technologies like
    Apache Spark would replace SQL and relational databases. Ironically, SQL has proven
    to be so important to data users that SQL layers were added to these platforms
    out of demand. These layering technologies include Presto, BigQuery, and Apache
    Spark SQL just to name a few. Most data problems are not big data problems, and
    nothing works quite like SQL in querying data. Therefore, SQL has continued to
    thrive and maintained its place as the lingua franca of the data world.


    On another note, the promotion of NoSQL and “big data” platforms might be a lesson
    on The Silver Bullet Syndrome. Hadi Hariri from JetBrains gave a talk on this

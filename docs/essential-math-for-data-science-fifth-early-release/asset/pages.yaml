  md: 'But what about **non-mutually exclusive** events, which are events that can
    occur simultaneoulsy? Let’s go back to the coin flip and die roll example. What
    is the probability of getting a heads OR a “six”? Before you are tempted to add
    those probabilities, let’s generate all possible outcomes again and highlight
    the ones we are interested in:


    ```

    *H1*  *H2*  *H3*  *H4*  *H5*  *H6*  T1  T2  T3  T4  T5  *T6*

    ```


    Above we are interested in all the “heads” outcome as well as the “6” outcomes.
    If we proportion the 7 out of 12 outcomes we are interested in, \(\frac{7}{12}\),
    we get a correct probability of . 58333.


    But what happens if we add the probabilities of heads and “6” together? We get
    a different (and wrong!) answer of . 666.


    ```

    \( P(HEADS) = \frac{1}{2} \)


    \( P(6) = \frac{1}{6} \)


    \( P(HEADS \text{ OR } 6) = \frac{1}{2} + \frac{1}{6} = \frac{4}{6} = .666 \)

    ```


    Why is that? Study the combinations of coin flip and die outcomes again and see
    if you can find something fishy. Notice when we add the probabilities, we double-count
    the probability of getting a “6” in both “H6” and “T6”! If this is not clear,
    try finding the probability of getting “Heads” or a die roll of 1 through 5.


    ```

    \( P(HEADS) = \frac{1}{2} \)


    \( P(1 \text{ through } 5) = \frac{5}{6} \)


    \( P(HEADS \text{ OR } 1 \text{ through } 5) = \frac{1}{2} + \frac{5}{6} = \frac{8}{6}
    = 1.333 \)

    ```


    We get a probability of 133.333% which is definitely not correct as a probability
    must be no more than 100% or 1.0. The problem again is we are double-counting
    outcomes.'

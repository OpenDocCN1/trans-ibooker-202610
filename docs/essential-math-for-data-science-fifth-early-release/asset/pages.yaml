  md: '![](img/8e0dcc1636d032e7728a07e97751e446_215_0.png)


    # Figure 4-24. The eigenvector and eigenvalues


    If we have a square matrix $A$, it has the following eigenvalue equation:


    ```

    $Av = \lambda v$

    ```


    If $A$ is the original matrix, it is composed of eigenvector $v$ and eigenvalue
    $\lambda$. There is one eigenvector and eigenvalue for each dimension of the parent
    matrix, and not all matrices can be decomposed into an eigenvector and eigenvalue.
    Sometimes complex (imaginary) numbers will even result.'
  merge: -1

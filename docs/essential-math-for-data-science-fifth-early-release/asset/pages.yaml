  md: '# # Binomial Distribution


    For the remainder of this chapter, we are going to learn two probability distributions:
    the binomial and beta distributions. While we will not be using these for the
    rest of the book, they are useful tools in themselves and fundamental in understanding
    how events occur given a number of trials. They will also be a good segue on understanding
    probability distributions which we will use heavily in Chapter 3. Let’s explore
    a use case that could occur in a real-world scenario.


    Let’s say you are working on a new turbine jet engine and ran 10 tests. The outcomes
    yielded 8 successes and 2 failures:


    +   ✓ ✓ ✓ ✓ ✓ X X ✓ ✓


    You were hoping to get a 90% success rate, but based on the data above you conclude
    that your tests have failed with only 80% success. Each test is time-consuming
    and expensive, so you decide it is time to go back to the drawing board to re-engineer
    the design.


    However one of your engineers insists there should be more tests. “The only way
    we will know for sure is to run more tests,” she argues. “What if more tests yield
    90% or greater success? After all, if you flip a coin 10 times and get 8 heads,
    it does not mean the coin is fixed at 80%.”


    You briefly consider the engineer’s argument and realize she has a point. Even
    a fair coin flip will not always have an equally split outcome, especially with
    only 10 flips. You are most likely to get 5 heads but you can also get 3, 4, 6,
    or 7 heads. You could even get 10 heads, although this is extremely unlikely.
    So how do you determine the likelihood of 80% success assuming the underlying
    probability is 90%?


    One tool that might be relevant here is the **binomial distribution**, which measures
    how likely *k* successes can happen out of *n* trials given *p* probability.


    Visually, a binomial distribution looks like Figure 2-1.'

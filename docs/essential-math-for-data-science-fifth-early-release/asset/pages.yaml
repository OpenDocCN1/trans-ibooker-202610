    Now that we got some intuition on what we are trying to achieve and why, let’s
    do a more exact approach with SymPy which happens to support rational numbers
    in Example 1-32.


    # Example 1-32. Using SymPy to perform integration


    ```

    from sympy import *


    # Declare ''x'' to SymPy

    x = symbols(''x'')


    # Now just use Python syntax to declare function

    f = x**2 + 1


    # Calculate the integral of the function with respect to x

    # for the area between x = 0 and 1

    area = integrate(f, (x, 0, 1))


    print(area) # prints 4/3

    ```



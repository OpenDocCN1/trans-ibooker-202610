  md: 'indicating a probability of belonging to the true category (a patient showed
    symptoms) across an independent variable (hours of exposure).


    We can repurpose a logistic regression to not just predict a probability for given
    input variables, but also add a threshold to predict whether it belongs to that
    category. For example, if I get a new patient and find they have been exposed
    for 6 hours, I predict a 71.1% chance they will show symptoms as traced in Figure
    6-5. If my threshold is at least 50% probability to show symptoms, I will simply
    classify that he will show symptoms.


    ![](img/8e0dcc1636d032e7728a07e97751e446_294_0.png)


    Figure 6-5. We can expect a patient exposed for 6 hours to be 71.1% likely to
    have symptoms, and because that''s greater than a threshold of 50% we predict
    they will show symptoms


    # Performing a Logistic Regression


    So how do we perform a logistic regression? Let''s first take a look at the logistic
    function and explore the math behind it.


    # Logistic Function


    The logistic function is an S-shaped curve (also known as a sigmoid curve) that,
    for a given set of input variables, produces an output variable between 0 and
    1. Because the output variable is between 0 and 1 it can be used to represent
    a probability.


    Here is the logistic function that outputs a probability y for one input variable
    x.


    ```

    y = \frac{1.0}{1.0 + e^{-(\beta_0+\beta_1 x)}}

    ```'
  merge: -1
  img_proc: true
- pgno: 295
  md: "Note this formula uses Euler's number $e$ which we covered in Chapter 1. The\
    \ $x$ variable is the independent/input variable. $\\beta_0$ and $\\beta_1$ are\
    \ the coefficients we need to solve for.\n\n$\\beta_0$ and $\\beta_1$ are packaged\
    \ inside an exponent resembling a linear function, which you may recall looks\
    \ identical to $y = mx + b$ or $y = \\beta_0 + \\beta_1x$. This is not a coincidence\
    \ and logistic regression actually has a close relationship to linear regression,\
    \ which we will discuss later in this chapter. $\\beta_0$ indeed is the intercept\
    \ (which we call $b$ in a simple linear regression) and $\\beta_1$ is the slope\
    \ for x (which we call $m$ in a simple linear regression). This linear function\
    \ in the exponent is known as the log-odds function, but for now just know this\
    \ whole logistic function produces this S-shaped curve we need to output a shifting\
    \ probability across an $x$ value.\n\nTo declare the logistic function in Python,\
    \ use the `exp()` function from the `math` package to declare the $e$ exponent\
    \ as shown in Example 6-1.\n\n# Example 6-1. The logistic function in Python for\
    \ one independent variable\n\n```\n```python\nimport math\n\ndef predict_probability(x,\
    \ b0, b1):\n    p = 1.0 / (1.0 + math.exp(-(b0 + b1 * x)))\n    return p\n```\n\
    ```\n\nLet's plot to see what it looks like, and assume $\\beta_0 = -2.823$ and\
    \ $\\beta_1 = 0.62$. We will use SymPy in Example 6-2 and the outputted graph\
    \ is shown in Figure 6-6.\n\n# Example 6-2. Using SymPy to plot a logistic function\n\
    \n```\n```python\nfrom sympy import *\nb0, b1, x = symbols('b0 b1 x')\n\np = 1.0\
    \ / (1.0 + exp(-(b0 + b1 * x)))\n\np = p.subs(b0,-2.823)\np = p.subs(b1, 0.620)\n\
    print(p)\n\nplot(p)\n```\n```"
  merge: -1
  img_proc: true
- pgno: 296
  md: '![](img/8e0dcc1636d032e7728a07e97751e446_296_0.png)


    Figure 6-6. A logistic function


    In some textbooks, you may alternatively see the logistic function declared like
    this.


    $$p = \frac{e^{\beta_0 + \beta_1 x}}{1 + e^{\beta_0 + \beta_1 x}}$$


    Do not fret about it, because it is the same function just algebraically expressed
    differently. Note like linear regression we can also extend logistic regression
    to more than one input variable ($x_1, x_2, ... x_n$), as shown in this formula.
    We just add more $\beta_x$ coefficients.


    $$p = \frac{1}{1 + e^{-(\beta_0 + \beta_1 x_1 + \beta_2 x_2 + ... \beta_n x_n)}}$$


    # Fitting the Logistic Curve


    How do you fit the logistic curve to a given training dataset? First, the data
    can have any mix of decimal, integer, and binary variables but the output variable
    must be binary (0 or 1). When we actually do prediction, the output variable will
    be between 0 and 1 resembling a probability.


    The data provides our input and output variable values, but we need to solve for
    the $\beta_0$ and $\beta_1$ coefficients to fit our logistic function. Recall
    how we used least squares in Chapter 5. However, this does not apply here. Instead
    we use maximum likelihood estimation which, as the name suggests, maximizes the
    likelihood a given logistic curve would output the observed data.


    To calculate the maximum likelihood estimation, there really is no closed form
    equations like in linear regression. We can still use stochastic gradient descent,
    or have a library do it for us. Let''s cover both of these approaches starting
    with the library SciPy.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Using SciPy


    The nice thing about SciPy is the models often have a standardized set of functions
    and API''s, meaning in many cases you can copy/paste your code and can then reuse
    it between models. In Example 6-3 you will see a logistic regression performed
    on our patient data. If you compare it to our linear regression code in Chapter
    5, you will see it has nearly identical code in importing, separating, and fitting
    our data. The main difference is I use a LogisticRegression() for my model instead
    of a LinearRegression().


    # Example 6-3. Using a plain logistic regression SciPy


    ```

    import pandas as pd

    from sklearn.linear_model import LogisticRegression


    # Load the data

    df = pd.read_csv(''https://bit.ly/33ebs2R'', delimiter=",")


    # Extract input variables (all rows, all columns but last column)

    X = df.values[:, :-1]


    # Extract output column (all rows, last column)

    Y = df.values[:, -1]


    # Perform logistic regression

    # Turn off penalty


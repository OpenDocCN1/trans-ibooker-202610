  md: '| | TESTS POSITIVE | TESTS NEGATIVE |

    |---|---|---|

    | AT RISK | 198 | 2 |

    | NOT AT RISK | 50 | 750 |


    Figure 6-20. A confusion matrix for a medical test, identifying a disease


    We are told that for patients that have a health risk, 99% will be identified
    successfully (sensitivity). Using the confusion matirx, we can see that mathematically
    checks out.


    ```

    sensitivity = \frac{198}{198 + 2} = .99

    ```


    But what if we flip the condition? What percentage of those who tested positive
    have the health risk (precision)? While we are flipping a conditional probability,
    we do not have to use Bayes Theorem here because the confusion matrix gives us
    all the numbers we need.


    ```

    precision = \frac{198}{198 + 50} = .798

    ```


    Okay so 79.8% is not terrible, and that''s the percentage of people who tested
    positive that actually have the disease. But ask yourself this... what are we
    assuming about our data? Is it representative of the population?


    We do some quick research and found 1% of the population actually has the disease.
    There is an opportunity to use Bayes Theorem here. We can account for the proportion
    of the population that actually has the disease, and incorporate that into our
    confusion matrix findings. We then discover something significant.


    ```

    P (At Risk if Positive) = \frac{P(Positive if At Risk) \times P(At Risk)}{P(Positive)}


    P (At Risk if Positive) = \frac{.99 \times .01}{.248}


    P (At Risk if Positive) = .0339

    ```'

  md: "# Example 7-5. The activation functions and forward propagation function for\
    \ our neural network.\n\n```\n# Activation functions\nrelu = lambda x: np.maximum(x,\
    \ 0)\nlogistic = lambda x: 1 / (1 + np.exp(-x))\n\n# Runs inputs through the neural\
    \ network to get predicted outputs\ndef forward_prop(X):\n    Z1 = w_hidden @\
    \ X + b_hidden\n    A1 = relu(Z1)\n    Z2 = w_output @ A1 + b_output\n    A2 =\
    \ logistic(Z2)\n    return Z1, A1, Z2, A2\n```\n\nThis code above is important\
    \ because it concisely executes our entire neural network using matrix multiplication\
    \ and matrix-vector multiplication. We learned about these operations in Chapter\
    \ 4. It runs a color of three RGB inputs through the weights, biases, and activation\
    \ functions in just a few lines of code.\n\nI first declare the relu() and logistic()\
    \ activation functions, which literally take a given input value and returns the\
    \ output value from the curve. The forward_prop() function executes our entire\
    \ neural network for a given color input X containing the R,G, and B values. It\
    \ returns the matrix outputs from 4 stages: Z1, A1, Z2, and A2. “1” and “2” indicate\
    \ the operations belong to layers “1” and “2” respectively. The “Z” indicates\
    \ an unactivated output from the layer, and “A” is activated output from the layer.\n\
    \nThe hidden layer is represented by Z1 and A1. Z1 is the weights and biases applied\
    \ to X. Then A1 takes that output from Z1 and pushes it through the activation\
    \ ReLU function. Z2 takes the output from A1 and applies the output layer weights\
    \ and biases. That output is in turn pushed through the activation function, the\
    \ logistic curve, and becomes A2. The final stage A2 is the prediction probability\
    \ from the output layer, returning a value between 0 and 1. We call it A2 because\
    \ it is the “activated” output from layer 2.\n\nLet’s break this down in more\
    \ detail starting with Z1.\n\n$Z_1 = W_{hidden}X + B_{hidden}$\n\nFirst we perform\

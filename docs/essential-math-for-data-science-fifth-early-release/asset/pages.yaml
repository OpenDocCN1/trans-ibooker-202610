- pgno: 189
  md: 'Figure 4-16. Four movements can be achieved with linear transformations


    These four linear transformations are a central part of linear algebra. Scaling
    a vector will stretch or squeeze it. Rotations will turn the vector space, and
    inversions will flip the vector space so that \(\hat{i}\) and \(\hat{j}\) swap
    respective places.


    It is important to note that you cannot have transformations that are nonlinear,
    resulting in curvy or squiggly transformations that no longer respect a straight
    line. This is why we call it linear algebra, not nonlinear algebra!


    # Matrix Vector Multiplication


    This brings us to our next big idea in linear algebra. This concept of tracking
    where \(\hat{i}\) and \(\hat{j}\) land after a transformation is important because
    it allows us not just to create vectors but also transform existing vectors. If
    you want true linear algebra enlightenment, think why creating vectors and transforming
    vectors are actually the same thing. It’s all a matter of relativity given your
    basis vectors being a starting point before and after a transformation.


    The formula to transform a vector \(\vec{v}\) given basis vectors \(\hat{i}\)
    and \(\hat{j}\) packaged as a matrix is as follows:


    ```

    \[

    \begin{bmatrix} x_{new} \\ y_{new} \end{bmatrix} = \begin{bmatrix} a & b \\ c
    & d \end{bmatrix} \begin{bmatrix} x \\ y \end{bmatrix}

    \]

    \[

    \begin{bmatrix} x_{new} \\ y_{new} \end{bmatrix} = \begin{bmatrix} ax + by \\
    cx + dy \end{bmatrix}

    \]

    ```


    \(\hat{i}\) is the first column \([a \ c]\) and \(\hat{j}\) is the column \([b
    \ d]\). We package both of these basis vectors as a matrix, which again is a collection
    of vectors expressed as a grid of numbers in two or more dimensions. This transformation
    of a vector by applying basis vectors is known as **matrix vector multiplication**.
    This may seem contrived at first, but this formula is'

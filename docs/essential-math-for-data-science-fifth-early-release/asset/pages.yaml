- pgno: 340
  md: 'The output layer has an important job: it takes the piles of math from the
    hidden layers of the neural network and turns them into an interpretable result,
    such as presenting classification predictions. The output layer for this particular
    neural network uses the **logistic activation function**, which is a simple sigmoid
    curve. If you read Chapter 6, the logistic (or sigmoid) function should be familiar,
    and demonstrates that logistic regression is acting as a layer in our neural network.
    The output node weights, biases, and sums each of the incoming values from the
    hidden layer. After that, it passes that resulting value through the logistic
    function so it outputs a number between 0 and 1. Much like logistic regression
    in Chapter 6, this represents a probability that the given color inputted into
    the neural network recommends a light font. If it is greater than or equal to
    .5, the neural network is suggesting a light font, but less than that will advise
    a dark font.


    Here is the graph for the logistic function (Figure 7-7) using SymPy (Example
    7-2).


    # Example 7-2. Logistic activation function in SymPy


    ```

    from sympy import *

    # plot logistic

    x = symbols(''x'')

    logistic = 1 / (1 + exp(-x))

    plot(logistic)

    ```'

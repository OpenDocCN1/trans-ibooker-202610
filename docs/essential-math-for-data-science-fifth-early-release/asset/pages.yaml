  md: '```

    identity:

    | 1 0 0 |

    | 0 1 0 |

    | 0 0 1 |

    ```


    What''s the big deal with identity matrices? Well when you have an identity matrix
    you essentially have undone a transformation and found your starting basis vectors.
    This will play a big role in solving systems of equations in the next section.


    # Inverse Matrix


    An inverse matrix is a matrix that undoes the transformation of another matrix.
    Let’s say I have matrix $ A $.


    ```

    A = |

    | 4 2 4 |

    | 5 3 7 |

    | 9 3 6 |

    ```


    The inverse of matrix $ A $ is called $ A^{\{-1\}} $. We will learn how to calculate
    the inverse using Sympy or NumPy in the next section, but this is what the inverse
    of matrix $ A $ is.


    ```

    A^{-1} = |

    | -1/2 0 1/3 |

    | 5.5 -2 4/3 |

    | -2 1 1/3 |

    ```


    When we perform matrix multiplication between $ A^{\{-1\}} $ and $ A $, we end
    up with an identity matrix. We will see this in action with NumPy and Sympy in
    the next section on systems of equations.


    ```

    | -1/2 0 1/3 || 4 2 4 || 1 0 0 |

    | 5.5 -2 4/3 || 5 3 7 | = | 0 1 0 |

    | -2 1 1/3 || 9 3 6 |   | 0 0 1 |

    ```'

    +   σ_B = 10,000


    Now we have two homes from each respective neighborhood. House A from neighborhood
    A is worth $150,000 and House B from neighborhood B is worth $815,000. Which home
    is more expensive relative to the average home in its neighborhood?


    +   x_A = 150,000

    +   x_B = 815,000


    If we express these two values in terms of standard deviations, we can compare
    them relative to each neighborhood mean. Use the Z-score formula:


    +   z = \frac{x - mean}{standard deviation}

    +   z_A = \frac{150000 - 140000}{3000} = 3.\overline{333}

    +   z_B = \frac{815000 - 800000}{10000} = 1.5


    So the house in neighborhood A is actually much more expensive relative to its

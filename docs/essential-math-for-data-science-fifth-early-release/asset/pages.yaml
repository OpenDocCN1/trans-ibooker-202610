    # What to Watch Out For in Data Science Jobs


    To understand the data science job market, it might be good to draw a comparison
    to a profound piece of American television.


    In 2010, there was a U.S. TV series Better Off Ted. One episode, titled Jabberwocky
    (Season 1 Episode 12), captured something profound about corporate buzzwords.
    In the show Ted, the lead character, makes up a fictitious “Jabberwocky” project
    at his company to hide funding. With humorous results, his manager, the CEO, and
    ultimately the entire company began to “work” on the “Jabberwocky” project without
    even knowing what it is. It continues to escalate and thousands of employees are
    pretending to work on “Jabberwocky” while no one stops to ask what they are actually
    working on. The reason: no one wants to admit they are out of the loop, and ignorant
    of something important.


    The Jabberwocky Effect is an anecdotal theory that an industry or organization
    can perpetuate a buzzword/project even if no one has satisfactorily defined what
    it is. Organizations can cyclically fall victim to this behavior, allowing terms
    to circulate without definition and group behavior permits the ambiguity. Common
    examples may include blockchain, artificial intelligence, data science, big data,
    Bitcoin, internet of'
  merge: -1
  img_proc: true
- pgno: 392
  md: 'things, quantum computing, NFT’s, being “data-driven”, cloud computing, and
    “digital disruption.” Even tangible, high-profile, and specific projects can become
    mysterious buzzwords understood by a few but talked about by many.


    To stop the Jabberwocky Effect, you have to be a catalyst for productive dialogue.
    Be curious about the methods and means (not just the qualities or outcomes) of
    a project or initiative. When it comes to a role, is the company hiring you to
    work on “Jabberwocky,” or practical and specific projects? Have they fallen victim
    to buzzwords and hiring you because of FOMO (fear of missing out)? Or do they
    actually have specific and functional needs they are hiring you for? Making this
    discernment can spell the difference between a good fit that cruises smoothly,
    or a frustrating speed bump in your career.


    With that backdrop, let’s now consider a few things to watch out for in data science
    jobs starting with role definition.


    # # Role Definition


    Let’s say you are hired as a data scientist. The interview went great. You asked
    questions about the role and got straight answers. You are offered a job, and
    most importantly you should know what projects you will be working on.


    You always want to go into a role that is clearly defined and has tangible objectives.
    There is no guessing what you are supposed to be working on. Even better you should
    have leadership with a clear vision that understands what the business needs.
    You become the executor of clearly defined objectives and know your customer.


    Conversely, if you were hired into a role because the department wants to be “data-driven”
    or have a competitive edge in “data science,” this is a red flag. Chances are
    you will be burdened with finding problems to solve and selling any low-hanging
    fruit you find. When you ask for strategic guidance, you are told to apply “machine
    learning” to the business. But of course, when all you have is a hammer, everything
    starts to look like a nail.'

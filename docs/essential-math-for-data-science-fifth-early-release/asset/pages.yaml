  md: 'Okay we are only gaining smaller and smaller fractions of a cent the more frequently
    we compound. So if I keep making these periods infinitely smaller to the point
    of compounding continuously, where does this lead to?


    Let me introduce you to Euler''s number e, which is approximately 2.71828. Here
    is the formula to compound “continuously,” meaning we are compounding nonstop:


    $$A = P \times e^{rt}$$


    Returning to our example, let’s calculate the balance of our loan after 2 years
    if we compounded continuously:


    $$A = P \times e^{rt}$$


    $$A = 100 \times e^{.20 \times 2} = 149.1824698$$


    Okay this is not too surpising considering compounding every minute got us a balance
    of 149.1824584. That got us really close to our value of 149.1824698 when compounding
    continuously.



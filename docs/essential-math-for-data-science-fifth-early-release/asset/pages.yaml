  md: "# Example A-2. Open a math latex rendering using CodeCogs.\n\n```\n```python\n\
    import webbrowser\nfrom sympy import *\n\nx,y = symbols('x y')\n\nz = x**2 / sqrt(2*x*y**3\
    \ - 1)\n\nwebbrowser.open(\"https://latex.codecogs.com/png.image?\\dpi(200)\"\
    \ + latex(z))\n```\n```\n\nIf you use Jupyter, you can also use plugins to render\
    \ Math Latex.\n\n# Binomial Distribution from Scratch\n\nIf you want to implement\
    \ a binomial distribution from scratch, here are all the parts you need in Example\
    \ A-3.\n\n# Example A-3. Building a Binomial Distribution from scratch\n\n```\n\
    ```python\n# Factorials multiply consecutive descending integers down to 1\n#\
    \ EXAMPLE: 5! = 5 * 4 * 3 * 2 * 1\ndef factorial(n: int):\n    f = 1\n    for\
    \ i in range(n):\n        f *= (i + 1)\n    return f\n\n# Generates the coefficient\
    \ needed for the binomial distribution\ndef binomial_coefficient(n: int, k: int):\n\
    \    return factorial(n) / (factorial(k) * factorial(n - k))\n\n# Binomial distribution\
    \ calculates the probability of k events out of n trials\n# given the p probability\
    \ of k occurring\ndef binomial_distribution(k: int, n: int, p: float):\n    return\
    \ binomial_coefficient(n, k) * (p ** k) * (1.0 - p) ** (n - k)\n\n# 10 trials\
    \ where each has 90% success probability\nn = 10\np = 0.9\n\nfor k in range(n\
    \ + 1):\n    probability = binomial_distribution(k, n, p)\n    print(\"{0} - {1}\"\
    .format(k, probability))\n```\n```\n\nUsing the factorial() and the binomial_coefficient(),\
    \ we can build a binomial distribution function from scratch. The factorial function\
    \ multiplies a consecutive range of integers from 1 to n. For example, a factorial\
    \ of 5! would be 1*2*3*4*5 = 120."

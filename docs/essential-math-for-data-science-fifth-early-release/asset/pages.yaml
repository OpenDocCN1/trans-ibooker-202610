- pgno: 401
  md: '# WHAT IS SHADOW IT?


    Shadow IT (or Shadow “Information Technology”) is a term describing office workers
    who create systems outside their IT department. These systems can include databases,
    scripts, and processes, as well as vendor and employee-made software without the
    IT department’s involvement.


    Shadow IT used to be frowned on in organizations, as it is unregulated and operating
    outside the IT department’s scope of control. When finance, marketing, and other
    non-IT departments decide to hand-spin their own rogue IT operations, it certainly
    can create hidden costs to the organization in inefficiency and security concerns.
    Nasty politics can ensue where IT departments and non-IT departments clash, accusing
    each other of not staying in their lane or simply co-opting roles for job security.


    However, one benefit of the data science movement is it has made shadow IT more
    accepted as a necessity for innovation. Non-IT folks can prototype and experiment
    with creating datasets, Python scripts, and regression tools. The IT department
    can then pick up these innovations and support them formally as they mature. This
    also allows the business to become more nimble. A business rule change can be
    a quick edit to a Python script or in-house database, rather than filing a ticket
    with the IT help desk. Whether that change should be subject to rigorous testing
    and red tape is certainly a cost trade-off for responsiveness.


    Overall, if you find yourself in a Shadow IT role (which is likely) make sure
    you understand the risks and play nice with the IT department. If you are successful,
    it can be empowering and rewarding to support your business this way. If you sense
    possible conflict with your IT department, be upfront with your leadership and
    let them know. If you can truthfully say your work is “prototyping” and “exploration”
    then your leadership can argue it is outside the IT purview. Never go rogue without
    your leadership’s support though, and let them deal with the interdepartmental
    politics.'

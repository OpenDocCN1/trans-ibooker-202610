- pgno: 210
  md: '$X = \begin{bmatrix} x \\ y \\ z \end{bmatrix}$


    The function for a linear system of equations is $AX = B$, we need to transform
    matrix $A$ with some other matrix $X$ that will result in matrix $B$.


    $AX = B$


    \begin{bmatrix} 4 & 2 & 4 \\ 5 & 3 & 7 \\ 9 & 3 & 6 \end{bmatrix} \cdot \begin{bmatrix}
    x \\ y \\ z \end{bmatrix} = \begin{bmatrix} 44 \\ 56 \\ 72 \end{bmatrix}


    We need to “undo” $A$ so we can isolate $X$ and get the values for $x, y,$ and
    $z$. The way you undo $A$ is to take the inverse of $A$ denoted by $A^{-1}$ and
    apply it to $A$ via matrix multiplication. We can express this algebraically below:


    $AX = B$\n$A^{-1}AX = A^{-1}B$\n$X = A^{-1}B$


    To calculate the inverse of matrix $A$, we should probably use a computer rather
    than searching for solutions by hand using Gaussian elimination, which we will
    not venture into in this book (PatrickJMT has some great videos on YouTube). Here
    is the inverse of matrix $A$.


    $A^{-1} = \begin{bmatrix} -\frac{1}{2} & 0 & \frac{1}{3} \\ 5.5 & -2 & \frac{4}{3}
    \\ -2 & 1 & \frac{1}{3} \end{bmatrix}$


    Note when we matrix multiply $A^{-1}$ against $A$ it will create an identity matrix,
    a matrix of all zeroes except for 1’s in the diagonal. The identity matrix is
    the linear algebra equivalent of multiplying by “1”, meaning it essentially has
    no effect and will effectively isolate values for $x, y,$ and $z$.'

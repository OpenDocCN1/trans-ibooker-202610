    \ about shortly.\n\n# The Probability Density Function (PDF)\n\nThe standard deviation\
    \ plays an important role in the normal distribution, because it defines how “spread\
    \ out” it is. It is actually one of the parameters alongside the mean. The probability\
    \ density function (PDF) that creates the normal distribution is as follows:\n\
    \nf(x) = \\frac{1}{\\sigma} * \\sqrt{2\\pi} * e^{-\\frac{1}{2} \\left(\\frac{x-\\\
    mu}{\\sigma}\\right)^2}\n\nWow that’s a mouthful, isn’t it? We even see our friend\
    \ Euler’s Number e from Chapter 1 and some crazy exponents. Here is how we can\
    \ express it in Python in Example 3-9.\n\n# Example 3-9. The normal distribution\
    \ function in Python\n\n```\n# normal distribution, returns likelihood\ndef normal_pdf(x:\
    \ float, mean: float, std_dev: float) -> float:\n    return (1.0 / (2.0 * math.pi\
    \ * std_dev ** 2) ** 0.5) *\n    math.exp(-1.0 * ((x - mean) ** 2 / (2.0 * std_dev\
    \ ** 2)))\n```\n\nThere’s a lot to take apart here in this formula, but what’s\
    \ important is that it accepts a mean and standard deviation as parameters, as\

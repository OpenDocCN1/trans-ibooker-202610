  md: 'Our null hypothesis $H_0$ is that there is no relationship between two variables,
    or more technically the correlation coefficient is 0. The alternative hypothesis
    $H_1$ is there is a relationship, and it can be a positive or negative correlation.
    This is why the alternative hypothesis is defined as \(\rho \neq 0\) to support
    both a positive and negative correlation.


    Let’s return to our dataset of 10 points as shown in Figure 5-13. How likely is
    it we would see these data points by chance? And they happen to produce what looks
    like a linear relationship?


    ![](img/8e0dcc1636d032e7728a07e97751e446_260_0.png)



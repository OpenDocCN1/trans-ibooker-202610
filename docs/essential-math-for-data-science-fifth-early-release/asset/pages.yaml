  md: 'Figure 4-10. Scaling two added vectors allows us to create any new vector


    AGAIN, \(\vec{v}\) and \(\vec{w}\) are fixed in direction, except for flipping
    with negative scalars, but we can use scaling to freely create any vector composed
    of \(\vec{v + w}\).


    This whole space of possible vectors is called **span**, and in most cases our
    span can create unlimited vectors off those two vectors, simply by scaling and
    summing them. When we have two vectors in two different directions, they are **linearly
    independent** and have this unlimited span.


    But in what case are we limited in the vectors we can create? Think about it and
    read on.


    What happens when two vectors exist in the same direction, or exist on the same
    line? The combination of those vectors is also stuck on the same line, limiting
    our span to just that line. No matter how you scale it, the resulting sum vector
    is also stuck on that same line. This makes them **linearly dependent** as shown
    in Figure 4-11.'

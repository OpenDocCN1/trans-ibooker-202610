  md: "# Example 4-22. Decomposing and recomposing a matrix in NumPy\n\n```\nfrom\
    \ numpy import array, diag\nfrom numpy.linalg import eig, inv\n\nA = array([\n\
    \   [1, 2],\n   [4, 5]\n])\n```\n\n```\neigenvals, eigenvecs = eig(A)\n\nprint(\"\
    EIGENVALUES\")\nprint(eigenvals)\nprint(\"\\nEIGENVECTORS\")\nprint(eigenvecs)\n\
    ```\n\n```\nprint(\"\\nREBUILD MATRIX\")\nQ = eigenvecs\nR = inv(Q)\n\nL = diag(eigenvals)\n\
    B = Q @ L @ R\n\nprint(B)\n```\n\n> \"\"\"\n> EIGENVALUES\n> [-0.46410162  6.46410162]\n\
    > EIGENVECTORS\n> [[-0.80689822 -0.34372377]\n>  [ 0.59069049 -0.9390708 ]]\n\
    > REBUILD MATRIX\n> [[1. 2.]\n>  [4. 5.]]\n> \"\"\"\n\nAs you can see above, the\

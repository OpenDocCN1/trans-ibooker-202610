- pgno: 97
  md: '# ## GROUND TRUTH


    More broadly speaking, the family photo example presents a problem of ground truth.


    When I was teaching a class on AI system safety, I was once asked a question on
    making self-driving cars safer. “When a self-driving car is failing to recognize
    a pedestrian on its camera sensor, is there not a way for it to recognize the
    failure and stop?” I replied no, because the system has no framework for **ground
    truth**, or verified and complete knowledge of what is true. If the car is failing
    to recognize a pedestrian, how is it supposed to recognize that it is failing
    to recognize a pedestrian? There’s no ground truth for it to fall back on, unless
    there is a human operator who can provide it and intervene.


    This actually is the status quo of “self-driving” cars and taxi services. Some
    sensors like radar provide modestly reliable ground truths on narrow questions,
    like “is there something in front of the vehicle?” But recognizing objects based
    on camera sensory (in an uncontrolled environment) is a much fuzzier perception
    problem with astronomical numbers of pixel combinations it could see. Thus ground
    truth is nonexistent.


    Does your data represent a ground truth that’s verifiable and complete? Are the
    sensors and sources reliable and accurate? Or is the ground truth unknown?


    https://en.wikipedia.org/wiki/Ground_truth


    # ## Descriptive versus Inferential Statistics


    What comes to mind when you hear the word “statistics”? Is it calculating mean,
    median, mode, charts, bell curves, and other tools to describe data? This is the
    most commonly understood part of statistics called **descriptive statistics**
    and we use it to summarize data. After all, is it more meaningful to scroll through
    a million records of data or have it summarized? We will cover this area of statistics
    first.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '**Inferential statistics** tries to uncover attributes about a larger population,
    often based on a sample. It is often misunderstood and less intuitive than descriptive
    statistics. Oftentimes we are interested in studying a group that is too large
    to observe (e.g. average height of adolescents in North America) and we have to
    resort to using only a few members of that group to infer conclusions about them.
    As you can guess, this is not easy to get right. After all, we are trying to represent
    a population with a sample which may not be representative. We will explore these
    caveats along the way.


    # # Populations, Samples, and Bias


    Before we dive deeper into descriptive and inferential statistics, it might be
    a good idea to lay out some definitions and relate them with tangible examples.


    A **population** is a particular group of interest we want to study, such as “all
    seniors over the age of 65 in the North America”, “all golden retrievers in Scotland,”
    or “current high school sophomores at Los Altos High School.” Notice how we have
    boundaries on defining our population. Some of these boundaries are broad and
    capture a large group over a vast geography or age group. Others are highly specific
    and small such as the sophomores at Los Altos High School. How you hone in on
    defining a population depends on what you are interested in studying.


    A **sample** is a subset of the population that is ideally random and unbiased,
    which we use to infer attributes about the population. We often have to study
    samples because polling the entire population is not always possible. Of course,
    some populations are easier to get a hold of if they are small and accessible.
    But measuring all seniors over 65 in North America? That is unlikely to be practical!'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# POPULATIONS CAN BE ABSTRACT!


    It is important to note that populations can be theoretical and not physically
    tangible. In these cases our “population” acts more like a sample from something
    abstract. Here’s my favorite example: we are interested in flights that depart
    between 2PM and 3PM at an airport, but we lack enough flights at that time to
    reliably predict how often these flights are late. Therefore we may treat this
    “population” as a sample instead... from an underlying population of all theoretical
    flights taking off between 2PM and 3PM.


    Problems like this are why many researchers resort to simulations to generate
    data. Simulations can be useful but rarely are accurate, as simulations only capture
    so many variables and have assumptions built in.


    If we are going to infer attributes about a population based on a sample, it’s
    important the sample be as random as possible so we do not skew our conclusions.
    Here’s an example. Let’s say I’m a college student at Arizona State University.
    I want to find the average number of hours college students watch television per
    week in the United States. I walk right outside my dorm and start polling random
    students walking by, finishing my data gathering in a few hours. What’s the problem
    here?


    The problem is our student sample is going to have **bias**, meaning it skews
    our findings by overrepresenting a certain group at the expense of other groups.
    My study defined the population to be “college students in the United States,”
    not “college students at Arizona State University.” I am only polling students
    at one specific university to represent all college students in the entire United
    States! Is that really fair?


    It is unlikely all colleges across the country homogeneously have the same student
    attributes. What if Arizona State students watch far more TV than other students
    at other universities? Would that not distort the results using them to represent
    the entire country? Maybe this is possible because it is usually too hot to go
    outside in Tempe, Arizona. Therefore TV is a common pastime (anecdotally I would
    know, I lived in Phoenix for many years). Other college students in milder climates
    may do more outdoor activities and watch less TV.


    This is just one possible variable showing why it’s a bad idea to represent college
    students across the entire United States with just a sample of students from one
    university. Ideally, I should be randomly polling college students all'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'over the country at different universities. That way I have a more representative
    sample.


    However, bias is not always geographic. Let’s say I put a sincere effort to poll
    students across the United States. I arrange a social media campaign to have a
    poll shared by various universities on Twitter and Facebook. This way their students
    see it and hopefully fill it out. I get hundreds of responses on students’ TV
    habits across the country and feel I’ve conquered the bias beast... or have I?


    What if students who are on social media enough to see the poll are also likely
    to watch more TV? If they are on social media a lot, they probably do not mind
    recreational screen time. It’s easy to imagine they have Netflix and Hulu ready
    to stream on that other tab! This particular type of bias where a specific group
    is more likely to include themselves in a sample is known as **self-selection
    bias**.


    Darn it! You just can’t win, can you?! If you think about it long enough, data
    bias just feels inevitable! And oftentimes it is. So many **confounding variables**,
    or factors we did not account for, can influence our study. This problem of data
    bias is expensive and difficult to overcome, and machine learning is especially
    vulnerable to it.


    The way to overcome this problem is to truly at random select students from the
    entire population, and they cannot elect themselves into or out of the sample
    voluntarily. This is the most effective way to mitigate bias, but as you can imagine
    it takes a lot of coordinated resources to do.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# # A WHIRLWIND TOUR OF BIAS TYPES


    As humans, we are strangely wired to be biased. We look for patterns even if they
    do not exist. Perhaps this was a necessity for survial in our early history, as
    finding patterns make hunting, gathering, and farming more productive.


    There are many types of bias, but they all have the same effect of distorting
    findings. Confirmation bias is only gathering data that supports your belief,
    which can even be done unknowingly. An example of this is only following social
    media accounts you politically agree with, reinforcing your beliefs rather than
    challenging them.


    We just discussed self-selection bias, which is when certain types of subjects
    are more likely to include themselves in the experiment. Walking onto a flight
    and polling the customers if they like the airline over other airlines, and using
    that to rank customer satisfaction amongst all airlines, is silly. Why? Many of
    those customers are likely repeat customers, and they have created self-selection
    bias. We do not know how many are first-time fliers or repeat fliers, and of course
    the latter is going to prefer that airline over other airlines. Even first-time
    fliers may be biased and self-selected, because they chose to fly that airline
    and we are not sampling all airlines.


    Survival bias only captures living and surviving subjects, while the deceased
    ones are never accounted for. It is the most fascinating type of bias in my opinion,
    because the examples are diverse and unobvious.


    Probably the most famous example of survival bias is this: The Royal Air Force
    in WWII was having trouble with German enemy fire causing casualties on its bombers.
    Their initial solution was to armor bombers where bullet holes were found, reasoning
    this would improve their likelihood of survival. However a mathematician named
    Abraham Wald pointed to them this was fatally wrong. He proposed armoring areas
    on the aircraft that did not have bullet holes. Was he insane? Far from. The bombers
    that returned obviously did not have fatal damage where bullet holes were found.
    How do we know this? Because they returned from their mission! But what of the
    aircraft that did not return? Where were they hit? Wald''s theory was likely in
    the areas untouched in the aircraft that survived and returned to base, and'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'this proved right. Those areas without bullet holes were armored and the survivability
    of aircraft and pilots increased. This unorthodox observation is credited with
    turning the tide of war in favor of the Allies.


    There are other fascinating examples of survivor bias that are less obvious. Many
    management consulting companies and book publishers like to identify traits of
    successful companies/individuals and use them as predictors for future successes.
    These works are pure survival bias (and XKCD has a funny cartoon about this).
    These works do not account for companies/individuals that failed in obscurity,
    and these “success” qualities may be commonplace with failed ones as well. We
    just have not heard about them because they never had a spotlight.


    An anecdotal example that comes to my mind is Steve Jobs. On many accounts, he
    was said to be passionate and hot-tempered... but he also created one of the most
    valuable companies of all time. Therefore some people believed being passionate
    and even temperamental might correlate with success. Again, this is survivor bias.
    I am willing to bet there are many companies run by passionate leaders that failed
    in obscurity, but we fixate and latch onto outlier success stories like Apple.


    Lastly, in 1987 there was a veterinary study showing that cats who fell from 6
    stories or less had greater injuries than those that fell more than 6 stories.
    Prevailing scientific theories postulated that cats righted themselves at about
    5 stories, giving them enough time to brace for impact and inflict less injury.
    But then a publication The Straight Dope posed an important question: what happened
    to the dead cats? People are not likely to bring a dead cat to the vet and therefore
    it is unreported how many cats died from higher falls. In the words of Homer Simpson,
    "D’ oh!".


    Alright, enough talk about populations, samples, and bias. Let’s move onto some
    math and descriptive statistics. Just remember that math and computers do not
    recognize bias in your data. That is on you to detect as a good data science professional!
    Always ask questions about how the data was obtained, and then scrutinize how
    that process could have biased the data.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# SAMPLES AND BIAS IN MACHINE LEARNING


    These problems with sampling and bias extends to machine learning as well. Whether
    it is linear regression, logistic regression, or neural networks, a sample of
    data is used to infer predictions. If that data is biased then it will steer the
    machine learning algorithm to make biased conclusions.


    There are many documented cases of this. Criminal justice has been a precarious
    application of machine learning because it has repeatedly shown to be biased in
    every sense of the word, discriminating against minorities due to minority-heavy
    datasets. In 2017, Volvo tested “self- driving cars” that were trained on datasets
    capturing deer, elk, and caribou. However it had no driving data in Australia
    and therefore could not recognize kangaroos, much less make sense of their jumping
    movements! Both of these are examples of biased data.


    # Descriptive Statistics


    Descriptive statistics is the area most people are familiar with. We will touch
    on the basics like mean, median, and mode followed by variance, standard deviation,
    and the normal distribution.


    # Mean and Weighted Mean


    The **mean** is the average of a set of values. The operation is simple to do:
    sum the values and divide by the number of values. The mean is useful because
    it shows where the “center of gravity” exists for an observed set of values.


    The mean is calculated the same way for both populations and samples.

    Example 3-1 shows a sample of 8 values and how to calculate their mean in Python.


    # _Example 3-1. Calculating mean in Python_


    ```

    ```python

    # Number of pets each person owns

    sample = [1, 3, 2, 5, 7, 0, 2, 3]

    mean = sum(sample) / len(sample)

    print(mean) # prints 2.875

    ```

    ```


    As you can see, we polled 8 people and the number of pets they own. The sum of
    the sample is 23 and the number of items in the sample is 8, so this gives us
    a mean of 2.875 as 23/8 = 2.875.'
  merge: -1
  img_proc: true
- pgno: 104
  md: "There are two versions of the mean you will see: the sample mean \\(\\overline{x}\\\
    ) and the population mean \\(\\mu\\) as expressed below:\n\n\\[\\overline{x} =\
    \ \\frac{x_1 + x_2 + x_3 + ... + x_n}{n} = \\sum \\frac{x_i}{n}\\)\n\n\\[\\mu\
    \ = \\frac{x_1 + x_2 + x_3 + ... + x_n}{N} = \\sum \\frac{x_i}{N}\\]\n\nRecall\
    \ the summation symbol \\(\\sum\\) means add all the items together. The \\(n\\\
    ) and the \\(N\\) represent the sample and population size respectively, but mathematically\
    \ they represent the same thing: the number of items. The same goes for calling\
    \ the sample mean \\(\\overline{x}\\) (\"x-bar\") and the population mean \\(\\\
    mu\\) (\"mu\"). Both \\(\\overline{x}\\) and \\(\\mu\\) are the same calculation,\
    \ just different names depending on whether it’s a sample or population we are\
    \ working with.\n\nThe mean is likely familiar to you, but here’s something less\
    \ known about the mean: the mean is actually a weighted average called the **weighted\
    \ mean**. The mean we commonly use gives equal importance to each value. But we\
    \ can manipulate the mean and give each item a different weight.\n\nweighted mean\
    \ = \n\\(\\frac{(x_1 \\cdot w_1) + (x_2 \\cdot w_2) + (x_3 \\cdot w_3) + ... (x_n\
    \ \\cdot w_n)}{w_1 + w_2 + w_3 + ... + w_n}\\)\n\nThis can be helpful when we\
    \ want some values to contribute to the mean more than others. A common example\
    \ of this is weighting academic exams to give a final grade. If you have 3 exams\
    \ and a final exam, and we give each of the 3 exams 20% weight and the final exam\
    \ 40% weight of the final grade, here is how we express it in Example 3-2.\n\n\
    # *Example 3-2. Calculating a weighted mean in Python*\n\n```\n# Three exams of\
    \ .20 weight each and final exam of .40 weight\nsample = [90, 80, 63, 87]\nweights\
    \ = [.20, .20, .20, .40]\n\nweighted_mean = sum(s * w for s,w in zip(sample, weights))\
    \ /\nsum(weights)\n\nprint(weighted_mean) # prints 81.4\n```"

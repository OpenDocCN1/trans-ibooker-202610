  md: "# Chapter 1. Basic Math and Calculus Review\n\nWe will kick off the first chapter\
    \ covering what numbers are and how variables and functions work on a Cartesian\
    \ system. We will then cover exponents and logarithms. After that we will learn\
    \ the two basic operations of calculus: derivatives and integrals.\n\nBefore we\
    \ dive into the applied areas of essential math such as probability, linear algebra,\
    \ statistics, and machine learning, we should probably review a few basic math\
    \ and calculus concepts. Before you drop this book and run screaming, do not worry!\
    \ I will present how to calculate derivatives and integrals for a function in\
    \ a way you were probably not taught in college. We got Python on our side, not\
    \ a pencil and paper. Even if you are not familiar with derivatives and integrals,\
    \ you still do not need to worry.\n\nI will make these topics as tight and practical\
    \ as possible, focusing only on what will help us in later chapters and fall under\
    \ the “essential math” umbrella.\n\n> THIS IS NOT A FULL MATH CRASH COURSE!\n\
    > \n> This is by no means a comprehensive review of high school and college math.\
    \ If you want that, a great book to check out is No Bullshit Guide to Math and\
    \ Physics by Ivan Savov (pardon my French). The first few chapters contain the\
    \ best crash course on high school and college math I have ever seen. The book\
    \ Mathematics 1001 by Dr. Richard Elwes has some great content as well, and in\
    \ bite-sized explanations.\n\n# Number Theory\n\nWhat are numbers? I promise to\
    \ not be too philosophical in this book, but are numbers not a construct we have\
    \ defined? Why do we have the digits 0"

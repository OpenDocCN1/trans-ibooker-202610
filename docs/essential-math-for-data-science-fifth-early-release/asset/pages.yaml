  md: '# # Statistical Significance


    Here is another aspect to a linear regression you must consider: is my data correlation
    coincidental? In Chapter 3 we studied hypothesis testing and p-values, and we
    are going to extend those ideas here with a linear regression.


    # THE STATSMODEL LIBRARY


    While we are not going to introduce yet another library in this book, it is worth
    mentioning that `statsmodel` is noteworthy if you want to do statistical analysis.


    https://www.statsmodels.org/stable/regression.html


    Scikit-learn and other machine learning libraries do not provide tools for statistical
    significance and confidence intervals for reasons we will discuss in another sidebar.
    We are going to code those techniques ourselves. But know this library exists
    and it is worth checking out!


    Let’s start with a fundamental question: is it possible I see a linear relationship
    in my data due to random chance? How can we be 95% sure the correlation between
    these two variables is significant, and not coincidental? If this sounds like
    a hypothesis test from Chapter 3, it’s because it is! We need to express not just
    the correlation coefficient, but quantify how confident we are that the correlation
    coefficient did not occur by chance.


    Rather than estimating a mean like we did in Chapter 3 with the drug testing example,
    we are estimating the population correlation coefficient based on a sample. We
    denote the population correlation coefficient with the Greek symbol ρ (“Rho”)
    while our sample correlation coefficient is r. Just like we did in Chapter 3,
    we will have a null hypothesis H0 and alternative hypothesis H1.


    ```

    H0 : ρ = 0 (implies no relationship)


    H1 : ρ ≠ 0 (relationship is present)

    ```'
  merge: -1
  img_proc: true

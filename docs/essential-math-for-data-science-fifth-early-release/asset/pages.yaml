  md: 'From the confusion matrix, we can derive all sorts of useful metrics beyond
    just accuracy. We can easily see that precision (how accurate positive predictions
    were) and sensitivity (rate of identified positives) are 0, meaning this machine
    learning model fails entirely at positive predictions.


    Example 6-17 shows how to use the confusion matrix API in SciPy on a logistic
    regression with a train/test split. Note that the confusion matrix is only applied
    to the test dataset.


    # Example 6-17. Creating a confusion matrix for a test dataset in SciPy


    ```

    import pandas as pd

    from sklearn.linear_model import LogisticRegression

    from sklearn.metrics import confusion_matrix

    from sklearn.model_selection import train_test_split


    # Load the data

    df = pd.read_csv(''https://bit.ly/3cManTi'', delimiter=",")

    # Extract input variables (all rows, all columns but last column)

    X = df.values[:, :-1]

    # Extract output column (all rows, last column)\

    Y = df.values[:, -1]

    model = LogisticRegression(solver=''liblinear'')

    X_train, X_test, Y_train, Y_test = train_test_split(X, Y, test_size=.33,

    random_state=10)

    model.fit(X_train, Y_train)

    prediction = model.predict(X_test)

    """

    The confusion matrix evaluates accuracy within each category.

    [truepositives falsenegatives]

    [falsepositives truenegatives)]

    The diagonal represents correct predictions,

    so we want those to be higher

    """

    matrix = confusion_matrix(y_true=Y_test, y_pred=prediction)

    print(matrix)

    ```


    # Bayes Theorem and the Confusion Matrix



- pgno: 30
  md: 'Now what about fractional exponents? They are an alternative way to represent
    roots, such as the square root. As a brief refresher, a \(\sqrt{4}\) asks “what
    number multiplied by itself will give me 4?”, which of course is 2. Note here
    that \(4^{1/2}\) is the same as \(\sqrt{4}\).


    \(4^{1/2} = \sqrt{4} = 2\)


    Cubed roots are similar to square roots, but they seek a number multiplied by
    itself 3 times to give a result. A cubed root of 8 is expressed as \(\sqrt[3]{8}\),
    and asks “what number multiplied by itself 3 times gives me 8?” This number would
    be 2 because \(2*2*2 = 8\). In exponents a cubed root is expressed as a fractional
    exponent, and \(\sqrt[3]{8}\) can be re-expressed as \(8^{1/3}\).


    \(8^{1/3} = \sqrt[3]{8} = 2\)


    To bring it back full circle, what happens when you multiply the cubed root of
    8 three times? This will undo the cubed root and yield us 8. Alternatively, if
    we express the cubed root as fractional exponenents \(8^{1/3}\), it becomes clear
    we add the exponents together to get an exponent of 1. That also undoes the cubed
    root.


    \(\sqrt[3]{8}*\sqrt[3]{8}*\sqrt[3]{8} = 8^{\frac{1}{3}} \times 8^{\frac{1}{3}}
    \times 8^{\frac{1}{3}} = 8^{\frac{1}{3}+\frac{1}{3}+\frac{1}{3}} = 8^1 = 8\)


    And one last property: an exponent of an exponent will multiply the exponents
    together. This is known as the **power rule**. So \((8^3)^2\) would simplify to
    \(8^6\).


    \((8^3)^2 = 8^{3\times 2} = 8^6\)


    If you are skeptical why this is, try expanding it and you will see the sum rule
    makes it clear:


    \((8^3)^2 = 8^3 8^3 = 8^{3+3} = 8^6\)'

- 'no': 0
  overturn_probability: 0.7
  alternative: 正文前置元数据/书封书名，属于前言前置内容的一部分，不应独立成章
  counter_evidence:
  - 该行仅为图书封面书名，属于出版元数据，不具备章节统领性和概括后续正文内容的语义功能；
  - 前置内容（致谢、前言等）应作为一个整体章节，其起点应以“前言”或“致谢”等具有标志性的行开始，而非封面书名；
  - 行0紧随大量空行后接作者单位信息，更像是扉页/封面信息，将其单独作为分章点会过度碎片化正文前置部分。
  keep_split: false
- 'no': 78
  overturn_probability: 0.15
  alternative: 第1章标题（最高层级章节）
  counter_evidence:
  - 标题以纯阿拉伯数字“1”开头，缺少“第 X 章”或“Chapter”字样，虽符合“Y. ”特征，但也可能被误读为编号列表项；
  - 该行前为前言结尾部分（致谢与日期、地点签名），中间仅以空行分隔，缺乏页码或分页符等明显的章节断页标记；
  - 标题语义“大依赖数据简介”偏向引言性质，与前言内容存在主题重叠，若不考虑后文1.1等子节，可能被误判为前言延续的第一节小标题。
  keep_split: true
- 'no': 832
  overturn_probability: 0.1
  alternative: 第2章标题（最高层级章节）
  counter_evidence:
  - 该行紧接第1章参考文献列表（行828-830）之后，中间无明显分页符或章节分隔符，可能被误认为是参考文献部分后的正文延续；
  - 若全书采用“部分-章节”模式，缺少“第 X 部分”标题，该行是否应独立成章需依赖语义而非编号，存在不确定性；
  - 标题与第1章格式高度一致，编号连贯（1后接2），虽然支持其为章标题，但也可能是模板化重复，导致审查员过度依赖格式而忽略实质内容边界。
  keep_split: true

  \ \\(\\ell_1\\) 范数较小。因此，x 轴上的 \\(\\ell_1\\) 范数作为惩罚的代理。由于图中仅显示非零估计系数，系数的数量\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_390_0.png)\n\

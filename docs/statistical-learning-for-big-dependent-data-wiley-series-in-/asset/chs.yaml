  \ NULL\nfor (i in 1:p){\nX <- cbind(X,rate[(ist-i):(nT-i)])\n}\nnobe <- nT-p\nnfit\
  \ <- nobe-nfore\nx_train <- X[1:nfit,]\n```\n\n```r\ny_train <- Y[1:nfit]\nx_pred\
  \ <- X[(nfit+1):nobe,]\ny_pred <- Y[(nfit+1):nobe]\n### Linear regression prediction\n\
  m1 <- lm(y_train~.,data=data.frame(x_train))\npm1 <- predict(m1,newdata=data.frame(x_pred))\n\
  rmse_lm <- sqrt(mean((y_pred-pm1)^2))\nmae_lm <- mean(abs(y_pred-pm1))\nmed_lm <-\
  \ median(abs(y_pred-pm1))\ncat(\"lm results: (rmse,mae,med) : \",c(rmse_lm,mae_lm,med_lm),\"\
  \\n\")\n```\n\n```r\n### standardize predictors for neural networks\nx_train <-\
  \ scale(x_train)\ncol_means_train <- attr(x_train,\"scaled:center\")\ncol_stddevs_train\
  \ <- attr(x_train,\"scaled:scale\")\n### standardize the predictor accordingly\n\
  x_pred <- scale(x_pred,center=col_means_train,scale=col_stddevs_train)\n##\nlibrary(keras)\n\
  ```\n\n```r\nbuild_mod <- function(){\nmodel <- keras_model_sequential() %>%\nlayer_dense(units=8,activation=\"\
  relu\",input_shape=dim(x_train)[2]) %>%\nlayer_dense(units=2,activation=\"relu\"\
  ) %>%\nlayer_dense(units=1) %>%\n}\n```\n\n```r\nmodel %>% compile(\nloss=\"mse\"\
  ,\noptimizer=optimizer_rmsprop(),\nmetrics=list(\"mean_absolute_error\")\n)\n```\n\
  \n```r\nmodel\n}\nsummary(model) # print out the model\n```\n\n```r\n### display\
  \ training progress by printing a single dot for each\n### completed epoch\nmodel\
  \ <- build_mod()\nmodel %>% summary()\nprint_dot_callback <- callback_lambda(\n\

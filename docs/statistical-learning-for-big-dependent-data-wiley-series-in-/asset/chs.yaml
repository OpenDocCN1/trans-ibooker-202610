  \ Peña et al. (2001)、Box et al. (2015)、Brockwell and Davis (2013)、Cryer and Chan\
  \ (2008)、Shumway and Stoffer (2017) 以及 Tsay (2010, 2014) 等。\n\n给定一组时间序列，分析的第一步是通过绘制序列图来可视化数据，以了解其基本特性。人们还会尝试检测粗大的测量误差，这类误差在自动记录的数据中非常普遍。这些误差可能发生在许多序列的某些特定时间点，也可能集中在少数几个序列中，使它们与其他序列不同。我们提出的图形表示旨在识别这两种测量误差情况。一旦时间序列集经过某些清洗，我们就介绍用于建模和预测序列的统计方法。最常用于平稳时间序列的模型是自回归移动平均（ARMA）模型，这些模型已被证明在许多科学领域非常有用。该家族的特殊成员是自回归（AR）模型，其中序列仅依赖于其前\
  \ p 个滞后值（p 为正整数）。AR 模型的特点是具有无限多个非零自相关系数，这些系数随滞后增加而指数衰减至零。因此，AR 过程具有相对较长的记忆，因为序列的当前值与许多先前值相关，尽管系数会衰减。具有有限记忆特性的标量过程是移动平均（MA）模型，它由有限数个过去创新项（或噪声）的加权平均值构成。将\
  \ AR 和 MA 结构结合起来，我们得到 ARMA 模型，它们提供了一个广泛且灵活的平稳随机过程家族，适用于表示许多经验时间序列。\n\n某些平稳时间序列可被视为多个周期过程的混合。这是谱分析的动机，其中序列的变异性由具有不同频率和变异性的谐波过程来解释。平稳时间序列的谱是其所有滞后自协方差的线性组合，每个\
  \ ARMA 过程都隐含一个给定的谱，反之亦然。这种方法，即频域分析，为使用 ARMA 模型的时域分析提供了互补信息。\n\n时间序列可能在均值、方差、自相关或其分布的其他特征方面是非平稳的。如第\
  \ 1 章所述，最重要的非平稳过程是整合过程，尤其是 I(1) 过程。I(1) 过程的基本特征是其均值随时间变化，但其增量构成一个平稳过程。因此，通过差分，该序列可以变成平稳序列。自回归积分移动平均（ARIMA）模型家族适用于通过差分变成平稳\
  \ ARMA 过程的时间序列。区分整合过程和平稳过程的一个重要属性是序列依赖的行为方式。对于平稳过程，自相关系数随滞后增加而指数衰减至零，而整合时间序列的自相关系数则随滞后增加而不趋于零。\n\
  \n另一类重要的非平稳过程是季节过程，其中序列的均值不是常数，而是呈现周期性模式。例如，某地理位置的月度气温序列通常表现出强烈的季节性，夏季的均值较高。如果这种季节性模式是持久的，则需要季节性差分来将序列转换为平稳性。带有季节性差分的\
  \ ARIMA 模型称为季节性 ARIMA（SARIMA）模型。\n\n建模非平稳时间序列的另一种方法是将其视为趋势、季节性和不规则分量的加法模型。这种方法称为结构时间序列建模。它是描述动态系统演化的一般程序（称为状态空间表示）的特例。状态空间模型（SSM）的一个优点是，它提供了一种有效的递归方法来估计模型参数并生成预测。此外，该模型可以简单地推广到多元时间序列，我们将在第\
  \ 3 章中讨论。\n\n本章的第二部分研究如何为大量时间序列构建 ARIMA 模型，重点在于自动程序。对每个时间序列拟合模型分三步进行。第一步，我们检查序列是否需要变换（幂家族），然后将得到的序列分类为以下类别之一：平稳、单位根非平稳或季节性序列。这一步可以视为分类步骤。第二步是模型选择，即估计多个模型并使用信息准则从候选模型中选择最佳模型。第三步进行诊断检查，并根据需要优化拟合模型。然后，每个序列选定的模型可用于预测。请记住，在某些应用中，多个模型可能对给定时间序列都拟合良好，此时可以使用模型平均值来生成组合预测。\n\
  \n\n\n\n\n## 2.1 可视化大量时间序列\n\n对大量时间序列进行可视化对于检测粗大测量误差、识别与其他序列不同的序列、展示可能分组的存在以及理解所研究序列的整体结构至关重要。将\
  \ \\( k \\) 个含 \\( T \\) 个观测值的时间序列放入一个双向表中，每列包含一个单独的时间序列，每行包含某一时间点的所有序列，我们关注两类分别展示行和列属性的图表。具体来说，它们展示了：(1)\
  \ 所有序列随时间共同演变的属性，即绘制每行随时间变化的某些属性；(2) 完整周期内每个序列的属性，即绘制每个序列（列）边缘分布的某些属性。\n\n第一类图表称为动态图，因为它们展示了所有系列所选摘要随时间演变的情况。第二类图表称为静态图，因为它们展示了每个系列（列）在整个观测期内的行为摘要。当列（系列）的顺序没有信息量（这通常是情况）时，我们可以绘制系列所选摘要的散点图或列（系列）分布所选分位数的箱线图。如果能找到列的有意义顺序，例如第9章讨论的空间数据，那么我们也可以根据此顺序绘制行的一些所选摘要。接下来，我们将简要解释和演示这两类图表。\n\
  \n### 2.1.1 动态图\n\n总结一组数据分布的有用方法是使用分位数。给定标量随机变量 \\( X \\) 的随机样本 \\( \\{x_i\\}_{i=1}^k\
  \ \\) 及其实证累积分布函数（CDF）\\( \\widehat{F}_k(x) \\)，实证 \\( p \\) 分位数 \\( q^{*(p)} \\\
  ) 定义为\n\n```\nq^{*(p)} = \\inf_{x \\in R} \\{x | \\widehat{F}_k(x) \\ge p\\}, \\\
  quad (2.1)\n```\n\n并且众所周知（参见 Ferguson (1967) 等），该分位数可以通过以下方式计算：\n\n```\nq^{*(p)}\
  \ = \\arg \\min_{y \\in R} \\left[ p \\sum_{x_i \\ge y} |x_i - y| + (1-p) \\sum_{x_i\
  \ < y} |x_i - y| \\right] . \\quad (2.2)\n```\n\n考虑一个 \\( k \\) 维时间序列的大型数据集 \\(\
  \ \\{z_t | t = 1, ..., T\\} \\)。如果 \\( z_t \\) 是严格平稳的，那么 \\( z_t \\) 的分布是时不变的。我们可以在每个时刻\
  \ \\( t \\) 计算该点观测值的一些选定实证分位数，并用这些值构建时间序列分位数（TWQ）时间序列。每个点 \\( t = v \\) 的分位数由 (2.2)\
  \ 计算，其中 \\( x_i \\) 的值现在为 \\( z_{i,v} \\)。当系列平稳时，这些分位数随时间应当相似。\n\n因此，通过绘制由选定时间序列分位数形成的时间序列，可以检验底层时间序列的平稳性。\n\
  \n为演示，请考虑第1章中使用的世界金融市场指数的每日对数价格。图 2.1 分别展示了概率为 0.025、0.5 和 0.975 的时间序列分位数的时间图。也就是说，该图显示了双向数据表每行的\
  \ 2.5% 分位数、中位数和 97.5% 分位数系列。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_61_0.png)\n\
  \n图 2.1 2000年1月4日至2015年12月16日期间，99个世界金融市场指数每日对数价格的时间序列分位数。分位数为每个交易日收益率的2.5、50和97.5%分位数。\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_61_1.png)\n\n图 2.2 2000年1月4日至2015年12月16日期间，99个世界金融市场指数每日对数收益率的时间序列分位数。分位数为每个交易日收益率的2.5、50和97.5%分位数。\n\
  \n在图中，黑色（实线）为每日中位数对数收益率的时间序列图，红色（虚线）为2.5%分位数的时间图，蓝色（点线）为97.5%分位数的时间图。这些分位数表明，如预期，这些系列是非平稳的，因为三个分位数均呈上升趋势。图\
  \ 2.2 显示了收益率系列对应分位数的时间图，即WSI系列的第一阶对数差分。从图中容易看出：(a) 2008年金融危机时期是世界金融市场波动性（volatility）最高的时期；(b)\
  \ 世界金融市场的四分位距[97.5–2.5%]在2000年代初似乎大于近期，表明世界各国金融市场比以往任何时候都更加一体化。所有这些变化表明，收益率系列在所考虑的整个期间也是非平稳的，尽管在某些子期间它们似乎是平稳的。\n\
  \n这些时间序列分位数图表传达了关于数据平稳性的直观印象。然而，它们不能很好地表征数据的动态依赖性，因为其依赖关系不必与单个时间序列相同。\n\n例如，一组平稳时间序列的分位数可能形成近乎平行的直线，尽管单个序列可能具有强自相关性。对于动态较弱的系列（例如仅具有几个滞后序列相关性的资产收益率系列），这并非局限；但对于具有显著自相关结构的系列，其动态可能无法由时间序列分位数展示。为缓解此问题，Peña\
  \ et al. (2019) 提出了一种旨在保留系列动态依赖性的动态分位数图。\n\n假设一组时间序列由多元随机过程生成，即我们有 k 个可能相互依赖且各不相同的标量随机过程。聚焦于给定时间点\
  \ t = v，我们有一个数据向量 zv = (z1v, ..., zkv)'，它来自 k 维随机向量 (Z1v, ..., Zkv)'，其分布 Fv(z) 代表来自依赖于两个索引的某个随机过程的样本。例如，它可能是一个时空过程，或者任何其他一个索引为时间、另一个索引为一组定义明确的元素的过程。可以证明（参见\
  \ Peña et al., 2019 及其中的参考文献），在某些一般条件下（例如平稳过程），随着 k 趋于无穷大，zv 的实证 CDF 收敛于一元极限分布。假设时间序列集合满足这些条件，则边缘分布函数\
  \ Fv(z) 随着 k 趋于无穷大，对每个时间点 v 收敛于一个定义明确的分布函数。\n\n为方便引用，令 Ck = {zit | 1 <= i <= k,\
  \ 1 <= t <= T} 为观测到的时间序列集合。基于上述关于 zt 的实证 CDF 的性质，我们将第 p 个实证动态分位数（EDQ）定义为 Ck 中满足优化问题的系列\
  \ {q_t^(p)}：\n\n```\n{q_t^(p)} = argmin_{(y_t) \\in C_k} \\left[ \\sum_{t=1}^T \\\
  left( \\sum_{z_{it} \\ge y_t} p|z_{it} - y_t| + \\sum_{z_{it} \\le y_t} (1-p)|z_{it}\
  \ - y_t| \\right) \\right] . (2.3)\n```\n\n请注意，此优化问题与用于求解时间序列分位数的 (2.2) 不同。TWQ 是通过在每个时间点求解优化问题计算得出的，而\
  \ EDQ 则是通过在整个期间内求解优化问题得到的。在 TWQ 中，每个时间点得到的解可以是任意实数，而在 EDQ 中，求解该问题的时间序列被限制为观测到的时间序列之一。EDQ\
  \ 的直接计算需要 O(k^2) 次运算来计算两个系列之间的距离，以及 k log(k) 次排序运算。对于中等规模的 k（例如不超过 1000 个时间序列），使用当今的台式计算机可在几分钟内直接计算得出。然而，对于大规模的\
  \ k，直接估计可能会很慢。Peña et al. (2019) 提出了一种算法，以 O(k) 的计算量对动态分位数给出良好的近似。因此，该方法可以应用于高维时间序列集合。\n\
  \n为演示 EDQ，我们考虑2017年3月在台湾进行的每小时PM2.5测量数据集。这些测量值（单位：微克每立方米，µg/m³）由一种名为 AirBox^1 的新设备获取，该设备便携且广泛可用。该数据集包含516个系列，每个系列有744个观测值（即\
  \ k = 516 且 T = 744）。图 2.3 和图 2.4 显示了概率为 0.025、0.5 和 0.975 的 PM2.5 时间序列分位数和 EDQ。可以看出，结果有所不同。EDQ\
  \ 显示了比 TWQ 中展示的更强的系列真实动态。\n\n\n\n\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_63_0.png)\n\
  \n图 2.3 AirBox PM2.5 数据的时间分位数图。图中显示了 TWQ 0.025（红色）、0.5（黑色）和 0.975（蓝色）。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_63_1.png)\n\
  \n图 2.4 AirBox PM2.5 数据的 EDQ 图。图中显示了 EDQ 0.025（红色）、0.5（黑色）和 0.975（蓝色）。\n\n与在每个时间点使用所有序列边缘分布的分位数不同，我们可以计算其他汇总统计量，如均值和标准差，并将它们绘制在双变量图中或随时间绘制。图\
  \ 2.5 显示了每个交易日世界金融指数收益率序列的均值和方差的散点图。从图中可以清楚地看出，有三天的股票回报率方差非常高。这三天在图中标记出来，分别是 2001\
  \ 年 1 月 1 日、1 月 3 日和 2008 年 10 月 15 日。图还表明，有一天金融指数的波动率较低，但股票下跌超过 6%（最左边的点）。结果发现，这发生在\
  \ 2008 年 10 月 6 日，即世界金融危机的开始。考虑到 (a) 2000 年 12 月美国市场的下跌和 2001 年 1 月美国市场的反弹，以及 (b)\
  \ 2008 年世界金融危机，这些发现似乎是合理的。总体而言，散点图表明，99 个金融指数的日对数收益率方差\n\n并不大，但日对数收益率的均值范围可能很大，从\
  \ –0.06 到 0.06 不等。我们得出结论，行的汇总统计量图提供了关于所研究的 k 个时间序列随时间共同演变的有用信息。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_64_0.png)\n\
  \n图 2.5 99 个世界金融市场指数日对数收益率的横截面方差与均值散点图。时间段为 2000 年 1 月 4 日至 2015 年 12 月 16 日。\n\n\
  ### R 命令和使用的包：\n\n```r\n> require(MTS)\n> stock <- read.csv2(\"Stock_indexes_99world.csv\"\
  ,header=FALSE)\n> stock <- stock[,-1] # index observation index\n> stock <- as.matrix(stock)\
  \ # plot twq stock return\n> rtn <- diffM(log(stock))\n> q <- apply(rtn,1,quantile,c(0.025,\
  \ 0.5,0.975))\n> tdx <- c(1:4162)/260+2000\n> plot(tdx,q[1,],type=\"l\",xlab=\"\
  year\",ylab=\"log-return\",\n     ylim=c(-0.2,0.2),col=\"red\")\n> lines(tdx,q[2,],col=\"\
  black\",lty=2)\n> lines(tdx,q[3,],col=\"blue\",lty=3)\n#plot twq logstock\n>x=log(stock)\n\
  >tdx <- c(1:4163)/260+2000\n>twq <- apply(x,1,quantile,c(0.025, 0.5, 0.975))\nplot(tdx,twq[1,],main=\"\
  TWQ\",type=\"l\",xlab=\"year\",ylab=\"log-price\",\n     ylim=c(min(x),max(x)),col=\"\
  red\")\nlines(tdx,twq[2,],col=\"black\",lty=2)\nlines(tdx,twq[3,],col=\"blue\",lty=3)\n\
  #plot edq logstock\n>q50=edqts (x,p=0.5,h=30)\n>q025=edqts (x,p=0.025,h=30)\n>q975=edqts\
  \ (x,p=0.975,h=30)\n>plot(tdx,x[,q50],main=\"EDQ\",type=\"l\",xlab=\"year\",ylab=\"\
  log-price\",\n     ylim=c(min(x),max(x)),col=\"black\")\n>lines(tdx,x[,q025],col=\"\
  red\",lty=3)\n>lines(tdx,x[,q975],col=\"blue\",lty=3)\n> ave <- apply(rtn,1,mean)\n\
  > v <- apply(rtn,1,var)\n> plot(ave,v,xlab=\"mean\",ylab=\"variance\")\n> text(locator(1),\"\
  10/15/2008\")\n> text(locator(1),\"01/03/2001\")\n> text(locator(1),\"01/01/2001\"\
  )\n> text(locator(1),\"10/06/2008\")\n```\n\n### 2.1.2 静态图\n\n静态图是用于总结研究中每个 k 个时间序列在样本期内行为的图形工具。在这些图中，我们检查每个列的边缘分布的一些属性（或汇总），并将所有序列的这些汇总绘制在一起。我们称这些图为静态图，因为它们显示了观察期内每个时间序列的汇总，因此未揭示时间动态。我们在此提出的第一个图是对每个列（序列）分布的选定分位数（包括每个序列的最小值和最大值）制作传统的箱线图。此图称为分位数-箱线图。\n\
  \n图 2.6 显示了 AirBox PM2.5 测量值的分位数-箱线图。选定的分位数为每个序列的最小值、25%、50%、75% 分位数和最大值。从图中可以清楚地看出，两个\
  \ PM2.5 测量序列的中位数接近零。事实上，在 25、50 和 75% 分位数处存在两个低点。由于 PM2.5 测量值不能为负值，此图立即识别出数据集中两个潜在的异常序列。图\
  \ 2.7 显示了三个样本方差最小的序列的时间图。这些序列是第 29、70 和 348 个序列。从时间图中很容易看出，序列 29 和 70 有大量的零测量值，表明这两个序列有超过\
  \ 50% 的缺失值，因此应从进一步建模中剔除。\n\n每个观测时间序列的两个重要汇总是其中心位置和变异性，我们建议绘制每个序列的标准差（或方差）与均值的散点图。此图能够识别变异性更高或异常样本均值的序列。换句话说，该图可以发现数据集中的某些异质性。图\
  \ 2.8 显示了 99 个世界金融市场指数日对数收益率的样本方差与样本均值的散点图。从\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_65_0.png)\n\
  \n图 2.6 AirBox PM2.5 数据集的分位数-箱线图。选定的分位数为最小值、25、50、75% 分位数和最大值。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_66_0.png)\n\
  \n图 2.7 2017 年 3 月台湾每小时 AirBox PM2.5 测量值的三个极端序列的时间图。x 轴表示 3 月的日期。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_66_1.png)\n\
  \n图 2.8 2000 年 1 月至 2015 年 12 月期间 99 个世界金融市场指数日对数收益率的样本方差与样本均值。\n\n图中，一个具有相对较大方差的孤立点很容易看到。结果发现，这是序列\
  \ 58（对应俄罗斯股票市场）。此外，还有一个序列具有非常大的平均回报（序列 85，委内瑞拉股票市场）和两个序列具有非常低的回报（56 和 79，荷兰和希腊股票市场）。图\
  \ 2.9 显示了序列 58 和 85 的时间图。从图中可以清楚地看出，序列 58 包含两个巨大的异常值，日收益率绝对值超过 150 个百分点。这个例子表明，在分析大型时间序列数据集时需要清洗数据。序列\
  \ 85 在 2008 年世界金融危机期间以及最近几年也显示出高变异性。\n\n我们提出的第三个静态图是所有序列的滞后-1 样本自相关系数与滞后-2 样本自相关系数的散点图。这个\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_67_0.png)\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_67_1.png)\n\
  \n简单图可以提供有关单个序列动态依赖的信息。如果序列共享相似的动态依赖，则散点图应显示沿直线聚类的点，否则，将找到不同类型的依赖点聚类。图 2.10 显示了\
  \ AirBox 每小时 PM2.5 序列的滞后-1 ACF 与滞后-2 ACF 的散点图。从图中，我们做出以下观察。首先，如预期，存在沿直线的某些聚类行为。其次，存在\

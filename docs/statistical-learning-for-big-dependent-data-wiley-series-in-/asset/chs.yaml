  \ \\(b = 3\\)，\\(r + 1 = 2\\) 且 \\(s + b + 1 = 5\\)。因此，如预期，\\((r, s, b) = (1, 1,\
  \ 3)\\)。\n\n### 表 3.1 传递函数模型冲激响应权重的理论模式\n\n| (i,j) | 1 | 2 | \\(\\cdots\\) | \\\

  ```\n\n## 4.5 多变量异常值检测\n\n### 4.5.1 VARMA 异常值检测\n\n多变量异常值可以通过与 Tsay et al (2000)\
  \ 提出的单变量情况类似的迭代过程来检测。首先，在假设无异常值的情况下，为待研究序列构建一个初始 VARIMA 模型。该初始模型的参数通过使用经过单变量时间序列初始清洗程序调整的系列来估计，以获得稳健的参数估计。令\
  \ \\(\\hat{e}_t\\) 为估计残差，\\(\\hat{\\Pi}_i\\) 为 AR 表示的估计系数。然后，在每个时间点，可以按以下方式估计每种异常值类型的影响。对于时间索引\
  \ \\(h\\) 处的 MIO，关于异常值的所有信息都包含在 \\(\\hat{e}_h\\) 中，我们使用 \\(\\hat{\\omega}_{I,h}\
  \ = \\hat{e}_h\\) 来估计异常值大小，其中下标 \\(I\\) 表示 MIO。对于其他类型的异常值，采用相同的估计思路，我们仅详细介绍 MAO\
  \ 情况。在此情况下，根据 (4.20)，有\n\n\\(\\hat{e}_t = \\left[ I - \\sum_{i=1}^{\\infty} \\hat{\\\
  Pi}_i B^i \\right] I_t^{(h)} \\omega_{A,h} + a_t = \\left[ I_t^{(h)} - \\sum_{i=1}^{\\\
  infty} \\hat{\\Pi}_i I_{t-i}^{(h)} \\right] \\omega_{A,h} + a_t.\\)\n\n由于 \\(a_t\\\
  ) 通常具有完整的协方差矩阵 \\(\\Sigma_a\\)，我们使用广义最小二乘法（GLS）来估计 \\(\\omega_{A,h}\\)：\n\n\\(\\\
  hat{\\omega}_{A,h} = \\left[ \\sum_{i=0}^{T-h} \\hat{\\Pi}_i \\Sigma_a^{-1} \\hat{\\\
  Pi}_i \\right]^{-1} \\sum_{i=0}^{T-h} \\hat{\\Pi}_i \\Sigma_a^{-1} \\hat{e}_{t+i},\
  \ \\quad (\\hat{\\Pi}_0 = -I).\\)\n\n估计量的协方差矩阵为 \\(\\Sigma_{A,h} = \\left[ \\sum_{i=0}^{T-h}\
  \ \\hat{\\Pi}_i \\Sigma_a^{-1} \\hat{\\Pi}_i \\right]^{-1}\\)。\n\n为了检验时间索引 \\(h\\\
  ) 处多变量异常值的显著性，我们考虑原假设 \\(H_0: \\omega_h = 0\\) 与备择假设 \\(H_a: \\omega_h \\neq 0\\\
  )。使用了两个检验统计量。第一个检验统计量是\n\n\\(J_{t,h} = \\hat{\\omega}'_{t,h} \\Sigma_{t,h}^{-1}\
  \ \\hat{\\omega}_{t,h},\\)\n\n其中 \\(i = AO, IO, LS\\) 取决于异常值类型。该统计量将所有组件联合处理。在固定\
  \ \\(h\\) 且假设模型已知的情况下，在原假设下，\\(J_{i,h}\\) 服从自由度为 \\(k\\) 的卡方随机变量。第二个检验统计量是在 \\(\\\
  Sigma_{i,h}\\) 已知时，\\(\\widehat{\\boldsymbol{\\omega}}_{i,h}\\) 组件的绝对值最大值。即，\n\n\
  \\(C_{i,h} = \\max_{1 \\le j \\le k} |\\hat{\\omega}_{j,i,h}| / \\sqrt{\\sigma_{j,i,h}},\\\
  )\n\n其中 \\(\\hat{\\omega}_{j,i,h}\\) 和 \\(\\sigma_{j,i,h}\\) 分别是 \\(\\widehat{\\\
  boldsymbol{\\omega}}_{i,h}\\) 的第 \\(j\\) 个元素和 \\(\\Sigma_{i,h}\\) 的第 \\((j, j)\\\
  ) 个元素。\n\n我们定义总体检验统计量为\n\n\\(J_{\\max}(i, h_i) = \\max_h J_{i,h}, \\quad C_{\\max}(i,\
  \ h_i^*) = \\max_h C_{i,h}, \\quad i = AO, IO, LS, \\quad (4.35)\\)\n\n这里需要理解的是，\\\
  (h_i\\) 表示检验统计量 \\(J_{i,h}\\) 取得最大值的时间索引，\\(h_i^*\\) 表示 \\(C_{i,h}\\) 取得最大值的时间索引。在样本中无异常值的原假设下，并假设\
  \ \\(\\mathbf{z}_t\\) 的模型已知，\\(J_{\\max}(I, h_i)\\) 是来自自由度为 \\(k\\) 的卡方分布的容量为 \\\
  (T\\) 的随机样本的最大值，其渐近分布可以使用极值分布得到。(4.35) 中的其他三个联合检验统计量中的每一个都是来自自由度为 \\(k\\) 的卡方分布的依赖样本的最大值，因此它们的渐近分布更为复杂。在实践中，需要通过模拟来生成两个检验统计量的有限样本临界值。\n\
  \n与单变量情况类似，如果单个联合统计量 \\(J_{\\max}(i, h_o)\\) 在时间索引 \\(h_o\\) 处显著，则我们在 \\(h_o\\)\
  \ 处识别出类型 \\(i\\) 的多变量异常值，其中 \\(i = AO, IO, LS\\)。在存在多个显著联合检验统计量的情况下，我们根据具有最小经验 \\\
  (p\\) 值的检验统计量来识别异常值类型。例如，如果 \\(J_{\\max}(A, h_A)\\) 在时间索引 \\(h_o\\) 处具有最小的 \\(p\\\
  ) 值，且该 \\(p\\) 值小于 0.05，则我们在 5% 的显著性水平下在时间索引 \\(h_o\\) 处识别出一个 AO。当给定显著性水平下所有四个联合统计量均不显著时，我们使用组件统计量\
  \ \\(C_{\\max}(i, h_i^*)\\) 来检查是否存在其他异常值。此步骤确保不会遗漏任何组件异常值。\n\n一旦识别出异常值，就会将其对底层时间序列的影响移除。调整后的序列被视为一个新数据集，检测过程被迭代进行。当未检测到显著异常值时，终止检测过程。最后，我们建议对模型参数和所有检测出的异常值进行联合估计。如果在此联合估计中发现某些异常值参数不显著，则将其删除。联合估计将重复进行，直到所有检测出的异常值在给定显著性水平下均显著。\n\
  \n### 4.5.2 通过投影进行异常值检测\n\n对于大量时间系列，在进行任何建模练习之前，我们需要一种快速清洗数据的方法。为此，我们将缺失观测值占 30%\
  \ 或以上的任何系列归类为异常系列，并将其从数据集中移除以供进一步考虑。同样，如果数据集中的任何系列包含占 30% 或以上的相同值观测，我们也将其移除。当系列是自动收集时（某些仪器可能故障），可能会出现缺失值或相同值数据比例较高的系列。一旦移除了异常系列，我们就使用单个系列的简单线性插值来填充数据集中剩余的任何缺失值。考虑一个标量时间系列\
  \ \\(z_t\\)，其中有一段缺失值，例如 \\(z_{h+1}, \\dots, z_{h+g}\\)，其中 \\(g\\) 为缺失值的数量。这里两个邻近的非缺失值是\
  \ \\(z_h\\) 和 \\(z_{h+g+1}\\)，我们使用 \\(z_{h+j} = z_h + j(z_{h+g+1} - z_h)/(g+1)\\\
  )（\\(j = 1, \\dots, g\\)）来填充缺失值。\n\n接下来，我们希望考虑一种不需要指定多变量模型、因此可以应用于大量时间系列集合的异常值检测程序。该程序利用单变量异常值检测程序和多变量时间系列的投影。该程序的基本思想由\
  \ Galeano et al. (2006) 提出，他们表明多变量异常值在几乎每个投影系列中至少产生一个单变量异常值，通过检测单变量异常值我们可以识别多变量异常值。此外，在某些情况下，将单变量检验统计量应用于最优投影来寻找多变量异常值，比在原始系列上使用多变量统计量更好。使用投影来搜索多变量异常值的第一个优势是简单性。通过使用投影的单变量系列，我们不需要为底层系列预先指定多变量模型。第二，可以证明，合适的投影方向将产生比多变量统计量更强大的检验统计量。\n\
  \n首先，我们分析通过投影 VARMA 系列 \\(\\Phi(B)y_t = c + \\Theta(B)a_t\\) 得到的单变量系列的性质。众所周知，VARMA\
  \ 模型各分量的非零线性组合遵循单变量 ARMA 模型；例如，参见 Lütkepohl (1993) 和 Tsay (2014)。考虑一个非平凡的 \\(k\\\
  ) 维向量 \\(v\\)。令 \\(y_t = v'y_t\\)。\n\n如果 \\(y_t\\) 遵循 VARMA\\((p, q)\\) 过程，则 \\\
  (y_t\\) 遵循 ARMA\\((p^*, q^*)\\) 模型，其中 \\(p^* \\leqslant kp\\) 且 \\(q^* \\leqslant\
  \ (k-1)p + q\\)。特别是，如果 \\(y_t\\) 是 VMA\\((q)\\) 系列，则 \\(y_t\\) 是 MA\\((q^*)\\) 且\
  \ \\(q^* \\leqslant q\\)，如果它是 VAR\\((p)\\) 过程，则 \\(y_t\\) 是 ARMA\\((p^*, q^*)\\\
  ) 且 \\(p^* \\leqslant kp\\) 且 \\(q^* \\leqslant (k-1)p\\)。\\(y_t\\) 的模型一般形式为 \\\
  (\\phi(B)y_t = c + \\theta(B)e_t\\)，其中 \\(\\phi(B) = |\\Phi(B)|\\)，\\(c = v'\\Phi(1)^*c\\\
  )，\\(\\theta(B)e_t = v'\\Phi(B)^*\\Theta(B)a_t\\)，其中 \\(\\Phi(B)^*\\) 是 \\(\\Phi(B)\\\
  ) 的伴随矩阵，\\(e_t\\) 是均值为零且方差 \\(\\sigma_e^2 > 0\\) 的标量白噪声过程。\n\n当观测系列 \\(z_t\\) 受大小为\
  \ \\(w\\) 的异常值影响时，我们从等式 (4.17) 和 (4.26) 看出，模型可以写成\n\\(z_t = y_t + \\alpha(B)w I_t^{(h)},\\\
  )\n\n其中，对于 MAO，\\(\\alpha(B) = I\\)，对于 MLS，\\(\\alpha(B) = I/(1-B)\\)。投影观测系列是 \\\
  (z_t = v'z_t\\)，它满足 \\(z_t = y_t + v'\\alpha(B)w I_t^{(h)}\\)。如果 \\(z_t\\) 具有 MAO，则投影观测系列是\
  \ \\(z_t = y_t + \\beta I_t^{(h)}\\)，其中 \\(\\beta = v'w\\)。如果 \\(z_t\\) 具有 MLS，则投影系列\
  \ \\(z_t\\) 在时间 \\(t = h\\) 处具有大小为 \\(\\beta = v'w\\) 的水平移位。因此，多变量异常值的两种基本类型 MAO\
  \ 和 MLS 将在投影系列中表现为相同类型的单变量异常值，即 AO 和 LS。\n\nMIO 在投影中产生更复杂的影响。它导致从时间索引 \\(t = h\\\
  ) 开始的一段连续异常值，大小为 \\(v'w, v'\\Psi_1 w, \\dots, v'\\Psi_{T-h}w\\)。假设 \\(h\\) 不接近 \\\
  (T\\)，并且因为 \\(\\Psi_j \\to 0\\) 当 \\(j \\to \\infty\\)，该片段中异常值的大小趋近于零。在特殊情况下 \\\
  (v'\\Psi_i w = \\psi_i v'w\\)，对于\n\n\n\n当 $i = 1, ..., T - h$ 时，$z_t$ 在 $t = h$\
  \ 处存在大小为 $\\beta = v'w$ 的创新性离群点。然而，若对 $i = 1, ..., T - h$ 满足 $v'\\Psi_i w = 0$，则\
  \ $z_t$ 在 $t = h$ 处有一个大小为 $\\beta = v'w$ 的 AO；若对 $i = 0, ..., T - h$ 满足 $v'\\Psi_i\
  \ w = v'w$，则 $z_t$ 在 $t = h$ 处具有一个大小为 $\\beta = v'w$ 的水平位移。因此，通过投影得到的一元序列 $z_t$\
  \ 可能受到 AO、离群点簇或水平位移的影响。出于此原因，本节不考虑 MIO。\n\nPeña 和 Prieto (2001) 提出了一种基于投影的多元离群点检测程序，该投影最大化或最小化投影数据的峰度系数。这一结果可以推广到多元时间序列，方法是将最大鉴别方向定义为相对于投影系列的方差，最大化一元离群点大小\
  \ $v'w$ 的方向。Galeano et al. (2006) 表明，对于 MAO 和 MLS，最大鉴别方向是由离群点大小 $w$ 定义的方向，并且该方向可以通过寻找投影系列峰度系数的极值来获得。\n\
  \n正如我们在 4.3.4 节中所见，多个离群点可能产生遮蔽效应和 swamping 效应。例如，某个投影可能有效揭示一个离群点，但遮蔽其他离群点的影响。为克服这一困难，在发现离群点并从向量序列中调整其影响后，我们对搜索过程进行迭代。此外，Peña\
  \ 和 Prieto (2007) 证明，除极端峰度方向外，若加入经稍作修改的 StahelDonoho 方法计算的一些随机方向，则多元离群点搜索可以得到改进。因此，在移除检测到的离群点影响后，我们提议使用新方向迭代搜索程序，直至不再发现离群点。因此，如果一组离群点在某一方向上被遮蔽，则在移除检测到的离群点后，它们可能在后续迭代中被揭示。Swamping\
  \ 意味着一个离群点以这样的方式影响序列，使得其他“好”数据点看起来像离群点。下一节提议的程序包含迭代以避免 swamping 效应，这种效应可能出现在使用投影统计量进行的一元搜索中。其思想是在对参数和检测到的离群点进行联合估计后，删除不显著的离群点。这将在下一节中进一步阐明。\n\
  \n### 4.5.3 用于离群点检测的投影算法\n\n此处提议的程序基于 Galeano et al. (2006, 2020) 的方法，用于识别多元和一元\
  \ LS 及 AO，而无需为向量时间序列指定多元模型。如前一节所述，未包含 MIO，因为其影响取决于指定的多元模型。该算法包含两个部分。在第一部分中，对一组时间序列进行初步清洗，而不假设任何多元模型。在第二部分中，使用第一步获得的干净序列估计指定模型（可以是\
  \ VARMA 或动态因子模型 (DFM，见第 6 章）），并用于检测离群点。当然，当假设的模型正确时，在离群点搜索中使用它将导致更强大的程序。接下来，我们描述不使用模型清洗序列中离群点的算法。\n\
  \n- 1. 给定 $z_1, ..., z_T$，找到最大化或最小化投影时间序列峰度系数的两个方向。然后，将观察到的向量系列投影到这些方向，并在投影时间序列中搜索离群点。为此，我们使用前面提到的一元时间序列分析算法。\n\
  \n- 2. 如果在步骤 1 中未发现离群点，则转到步骤 4。否则，令 \\( T_o = (t_1, \\dots, t_o)' \\) 为步骤 1(a) 中发现的离群点位置集合，\\\
  ( C_o = (c_1, \\dots, c_o)' \\) 为检测到的离群点类型（LS 或 AO）的标签。假设 \\( k \\) 个时间序列中每一个在时间索引\
  \ \\( t_i \\in T_o \\) 处都有一个类型为 \\( c_i \\in C_o \\) 的离群点，并移除它们对每个 \\( k \\) 个时间序列的影响。然后，对清洗后的向量时间系列重复步骤\
  \ 1 和 2，直到投影时间系列中不再发现离群点。\n\n- 3. 令 \\( d_o \\) 为在步骤 1 和 2 中得到的、投影时间系列包含检测到的离群点的方向数量。按照\
  \ Peña 和 Prieto (2007) 的说明计算 \\( d_o \\) 个随机方向，投影步骤 2 后得到的向量时间系列，并像步骤 1 那样在投影时间系列中搜索离群点。按步骤\
  \ 2 的方式，在检测到的离群点位置移除每个 \\( k \\) 个时间系列中的离群点影响（如有）。\n\n- 4. 在步骤 2 后已清洗掉多元离群点的 \\\
  ( k \\) 个一元时间系列中搜索一元离群点。\n\n以下是对提议程序的一些说明。首先，在步骤 1 和 3 中分别计算最大峰度方向和随机方向时，假设 \\(\
  \ T > k \\)。因此，如果 \\( k \\ge T \\)，则这些方向是使用时间系列的主要主成分作为数据来计算的。其次，对于大量时间系列，可以不使用\
  \ 2 和 4 来修正检测到的离群点影响，而是对所有 \\( k \\) 个时间系列应用快速插值。对 MAO 进行此操作的快速方法是，将在投影中发现的 MAO\
  \ 发生时间索引处的向量观测值替换为使用移动平均窗口宽度为 4 的指数加权移动平均 (EWMA) 平滑得到的插值。当时间系列维度较高时，此方法可减少清洗的沉重计算负担。第三，在步骤\
  \ 1 中，对所有系列发现的 MAO 离群点进行插值可能导致一定的效率损失，因为我们可能会丢弃好的数据点。但是，当多元离群点的数量仅占样本量的一小部分时，此影响可以忽略不计。第四，提议的算法取决于确定时间系列观测值是否被标记为离群点的截止值的选择，该值应取为标准正态分布的\
  \ \\( (1 - \\alpha/2)^{1/(Tm)} \\) 分位数，记为 \\( z_{(1-\\alpha/2)^{1/(Tm)}} \\)。\n\n\
  当我们希望为向量时间系列拟合模型时，例如 DFM（见第 6 章），使用初步清洗中找到的离群点位置集合，模型会拟合到原始向量时间系列上，同时估计离群点影响和模型参数。如有必要，拟合模型会被细化，例如移除不显著的离群点（如有）。对于中等维度\
  \ \\( k \\)，也可以使用 VAR(\\( p \\)) 模型。如果在某个给定水平发现某个影响不显著，我们移除最不显著的那个，并重复联合估计，直到所有影响都显著。\n\
  \n### 4.5.4 非平稳情况\n\n假设 \\( y_t \\sim I(d_1, \\dots, d_k) \\)，其中 \\( d_i \\) 为表示成分差分阶数的非负整数。令\
  \ \\( d = \\max(d_1, \\dots, d_k) \\)，先考虑 \\( d = 1 \\) 的情况，我们将其简记为 \\( y_t \\sim\
  \ I(1) \\)。对于这样的系列，除两个基本离群点 MAO 和 MLS 外，我们还考虑多元斜坡位移 (MRS)，它意味着多元系列中的斜率变化，并且可能出现在\
  \ \\( I(1) \\) 系列中。\n\n因此，对于 MRS，我们假设它仅适用于 \\(y_t\\) 中 \\(d_j = 1\\) 的成分，即离群点大小\
  \ \\(w = (w_1, ..., w_k)'\\) 满足 \\(w_j = 0\\)（如果 \\(d_j = 0\\)）。观察到的系列 \\(z_t\\\
  ) 可以通过差分转换为平稳。这种差分对现有离群点的影响如下。在 MIO 情况下，\\(\\nabla z_t = \\nabla y_t + \\bar{\\\
  Psi}(B)w_t^{(h)}\\)，其中 \\(\\bar{\\Psi}(B) = \\nabla \\Psi(B)\\)，因此 MIO 在差分系列中产生\
  \ MIO。在 MAO 情况下，\\(\\nabla z_t = \\nabla y_t + w(I_t - I_{t-1}^{(h)})\\)，产生两个大小相同但符号相反的连续\
  \ MAO。在 MLS 情况下，\\(\\nabla z_t = \\nabla y_t + w_t^{(h)}\\)，结果是一个大小相同的 MAO。在 MTC\
  \ 情况下，\\(\\nabla z_t = \\nabla y_t + \\zeta(B)w_t^{(h)}\\)，其中 \\(\\zeta(B) = 1 +\
  \ \\zeta_1 B + \\zeta_2 B^2 + \\cdots\\)，使得 \\(\\zeta_j = \\delta^{j-1}(1 - \\delta)\\\
  )。因此，MTC 产生一个系数 \\(\\zeta_j\\) 递减的 MTC。在 MRS 情况下，\\(\\nabla z_t = \\nabla y_t +\
  \ w S_t^{(h)}\\)，这产生一个大小等于 MRS 的 MLS。\n\n因此，在 \\(I(1)\\) 情况下，我们提出一种与平稳情况下步骤 1 类似的程序，但现在应用于一阶差分系列。该程序对\
  \ \\(z_t\\) 进行一阶差分，并像在平稳情况下一样检查 MLS。但是，现在在差分系列中检测到的 MLS 被作为斜坡位移并入原始系列，并与模型参数联合估计。如果任何斜坡位移不显著，则将其从模型中移除，并重复检测过程，直到所有斜坡位移都显著。最后，我们得到一个系列\
  \ \\(z_t^* = z_t - \\sum_{i=1}^{r^R} w_i R_t^{(h)}\\)，该系列不含斜坡位移。然后，我们对 \\(z_t^*\\\
  ) 取一阶差分，并继续检测孤立 MAO（对应 LS）和两个连续 MAO（对应原始系列中的一个 MAO）。在差分系列中检测到的所有离群点均通过原始系列中的相应影响并入，并与模型参数联合估计。如果任何离群点变得不显著，则将其从模型中移除。我们重复该过程，直到所有离群点都具有统计显著性。\n\
  \n该程序也可应用于协整系列。在这种情况下，\\(\\nabla z_t\\) 是过度差分，意味着其移动平均分量包含单位根。尽管如此，这并不是提议程序的问题，因为离群点的方向通常与协整方向不同。换句话说，如果\
  \ \\(v\\) 是通过最大化或最小化峰度系数获得的向量，那么它不太可能是协整向量，且 \\(v'\\nabla z_t = \\nabla(v'z_t)\\\
  ) 是平稳且可逆的，因为 \\(v'z_t\\) 是一个非平稳系列。但是，如果系列是协整的，则最终估计应使用第 3 章解释的误差修正模型进行。注意，如果 \\\
  (v\\) 是协整向量，那么 \\(v'z_t\\) 是平稳的，而 \\(\\nabla v'z_t\\) 是过度差分的。\n\n### 示例 4.6\n\n\
  为进行说明，我们在进出口系列（美国和中国）中搜索多元离群点。有关数据的更多信息见第 3 章。我们使用程序 `outliers.hdts`，该程序在提议的投影程序的第一步中无模型检测多元\
  \ AOs。该程序的第二步将在第 6 章中解释。\n\n在此特定实例中，程序检测到了七个多元离群点和六个一元离群点。这七个 MAO 和六个 AO 产生的离群点影响多于在示例\
  \ 4.5 的一元情况中发现的六个 AO 和六个 TC。请注意，离群点的时间索引大致与示例 4.5 中发现的时间索引一致。\n\n\n\n\n\n总而言之，单变量异常值再次被检测出来，但一些检测到的多变量异常值（如\
  \ $h = 109$）在单变量搜索中未被识别。\n\n### 多变量异常值检测的 R 命令：\n\n```\n>da<- read.csv(\"m-eximpcnus.csv\"\
  )\n>da=da[,1]\n>da=as.ts(da)\n>xt=diff(da)\n### The inputs of outliers.hdts are\
  \ (Yt,r.maxn,ind).\n### Yt is the T-by-k data matrix,\n### r.max is the number of\
  \ factors and ind is an indicator.\n### Here r.max = 1. We set ind=1 for taking\
  \ no difference.\n### If ind=2, the first difference is taken.\n>out=outliers.hdts(xt,1,1)\n\
  [1] \"First step - Running the first substep:\nprojections of maximum kurtosis\"\
  \nMaximum kurtosis: Direction number = 1 Number of outliers = 4\n[1] \"First step\
  \ - Running the second substep: random projections\"\nRandom projections: Number\
  \ = 1 Number of outliers = 3\n[1] \"First step - Running the third substep: univariate\
  \ cleaning\"\nUnivariate cleaning: Number = 1 Number of outliers = 0\nUnivariate\
  \ cleaning: Number = 2 Number of outliers = 3\nUnivariate cleaning: Number = 3 Number\
  \ of outliers = 1\nUnivariate cleaning: Number = 4 Number of outliers = 2\n>out$times.kurt\n\
  [1] 277 278 313 314\nout$times.rand\n[1] 12 13 109\nout$times.uni\n[1] 26 200 203\
  \ 203 14 202\n#Note that this number may be different in another run because\n###\
  \ the random directions used are different.\n```\n\n### 示例 4.7\n\n作为第二个示例，我们使用欧洲国家的消费者价格指数（CPI）数据。参见第\
  \ 1 章。我们使用程序 outliers.hdts 搜索多变量和单变量异常值，该程序通过投影搜索 MAO，随后搜索各个系列中的 AO。我们专注于在不使用任何多变量模型的情况下对异常值进行初步清洗。所分析的系列是差分数据\
  \ $VV_{12} \\log \\zeta_t$。所使用的命令如下所示：\n\n```\n>x=read.csv2(\"CPIEurope2000-15.csv\"\
  )\n>x=as.ts(x)\n>lx=log(x)\n>x1=diff(lx,lag=12)\n>xl2=diff(x1)\n>out=outliers.hdts(xl2,1,1)\n\
  ```\n\n首先获得的输出如下\n\n```\n[1] \"First step - Running the first substep: projections\
  \ of maximum kurtosis\"\nMaximum kurtosis: Direction number = 1 Number of outliers\
  \ = 3\n-------------------------------------------------------------\n[1] \"First\
  \ step - Running the second substep: random projections\"\nRandom projections: Number\
  \ = 1 Number of outliers = 0\n-------------------------------------------------------------\n\
  Random projections: Number = 3 Number of outliers = 0\n-------------------------------------------------------------\n\
  #The number of MAO identified by kurtosis and random projection\nis obtained\n>\
  \ out$times.kurt\n[1] 24 48 120 1 3 14 15 108\n> out$times.rand\n[1] 114\n### and\
  \ for the univariate outliers\nout$times.uni\n[1] 96 110 144 6 126 173 13 69 72\
  \ 94\n```\n\n单变量搜索的输出表明有 18 个异常值。出现次数最多的是第 23 系列（罗马尼亚），然后是第 25 系列（斯洛伐克）和第 3 系列（捷克共和国）。\n\
  \n## 4.6 鲁棒估计\n\n处理异常值的另一种方法是使用对异常数据点不敏感的估计方法。该方法称为*鲁棒估计*，是处理数据异质性的一种与异常值检测互补的方法。异常值检测侧重于搜索和估计可能异常值的影响，而鲁棒估计则研究减轻其在统计推断中影响的方法。因此，这两种方法相互补充。\n\
  \n众所周知，在正态性下最小二乘（LS）估计是最优的，但当观测值来自重尾分布时，可能会变得低效，而重尾分布倾向于产生异常数据点。估计量的*破裂点*定义为样本中使估计值变为任意值的异常值的最小比例。例如，AR(1)\
  \ 过程的 LS 估计的破裂点为 1/T，因为单个异常值可能将 \\(\\phi\\) 改变为任意值。如果我们不使用 LS 方法，而是使用具有高破裂点的鲁棒估计\
  \ \\(b/T\\) 并且异常值的比例小于这个破裂点 \\(b/T$，则可以将异常值识别为鲁棒模型的大残差。通常，鲁棒估计最小化残差的一个函数，该函数的增长速度慢于平方，或者更好的是，是有界的，从而限制了异常值的最大影响。考虑一个标量\
  \ AR(\\(p$) 模型，并让 \\(\\phi_p\\) 为参数向量。由 Huber (1981) 引入的一类一般鲁棒估计是 M-估计量，其最小化\n\n\
  \\(M = \\sum_{t=1}^{T} \\gamma \\left[ \\frac{e_t(\\phi_p)}{\\hat{\\sigma}} \\right]\
  \ ,\\) (4.36)\n\n其中 \\(\\gamma\\) 是一个非递减有界函数，满足 \\(\\gamma(0) = 0$ 和 \\(\\gamma(\\\
  infty) = 1$，因此每个残差 \\(e_t(\\phi_p) = z_t - \\phi'_p z_{t-1,p}$ 的影响是有界的，其中 \\(z_{t-1,p}\
  \ = (z_{t-1}, ..., z_{t-p})'$，且 \\(\\hat{\\sigma}\\) 是 \\(\\sigma$ 的一个初始估计，它使 M-估计独立于观测值的尺度。请注意，在\
  \ Eq. (4.36) 中，当 \\(\\gamma(x) = x^2$ 时得到 LS 估计，当 \\(\\gamma(x) = |x|$ 时得到 \\(L_1$\
  \ 估计，这两种估计不需要 \\(\\hat{\\sigma}$ 的初始值，而 M-估计则需要。这种变异性的初始值可以通过例如以简单的方式插值所有可疑观测值，并利用这些残差的稳健尺度度量（如绝对值中位数\
  \ mad）计算初始估计 \\(\\hat{\\sigma}$ 来获得：\n\n\\(\\hat{\\sigma} = \\frac{1}{0.675} \\\
  text{Med}(|e_i|, e_i \\neq 0).\\)\n\n函数 (4.36) 由以下迭代算法最小化。对 (4.36) 中的 \\(M$ 关于 \\\
  (\\boldsymbol{\\phi}_p$ 求导，并舍去常数项后，估计量必须验证\n\n\\(\\sum_{t=p+1}^{T} \\gamma' \\left(\
  \ \\frac{z_t - \\boldsymbol{\\phi}'_p \\boldsymbol{z}_{t-1,p}}{\\hat{\\sigma}} \\\
  right) \\boldsymbol{z}_{t-1,p} = 0, \\quad (4.37)\\)\n\n其中 \\(\\gamma'(x) = d\\\
  gamma(x)/dx$。接下来，定义权重函数\n\n\\(\\omega(x) = \\gamma'(x)/x \\quad \\text{if } x \\\
  neq 0; \\quad \\omega(0) = 0,\\)\n\n和 Eq. (4.37) 的解可以写成\n\n\\(\\sum_{i=1}^{n} \\\
  omega_i \\boldsymbol{z}_{t-1,p}(z_t - \\boldsymbol{z}'_{t-1,p} \\boldsymbol{\\phi}_p)\
  \ = 0,\\)\n\n其中 \\(\\omega_i = \\omega(e_i(\\boldsymbol{\\phi}_p)/\\widehat{\\sigma})$。估计量为\n\
  \n\\(\\hat{\\boldsymbol{\\phi}}_p = \\left[ \\sum_{i=1}^{T} \\omega_i \\boldsymbol{z}_{t-1,p}\
  \ \\boldsymbol{z}'_{t-1,p} \\right]^{-1} \\left( \\sum_{i=1}^{T} \\omega_i \\boldsymbol{z}_{t-1,p}\
  \ z_t \\right), \\quad (4.38)$\n\n这是一种加权 LS 估计，其权重取决于标准化残差 \\(e_i(\\boldsymbol{\\\
  phi}_p)/\\widehat{\\sigma}$，因此在估计中，残差较大的观测值权重会较小。函数 (4.36) 通过使用某个初始估计 \\(\\boldsymbol{\\\
  phi}_p^{(0)}$ 来获得残差，然后根据 (4.38) 计算估计的新值来最小化。该估计将产生新的残差和新的权重，过程一直迭代直到收敛。\n\n当样本仅存在低杠杆异常值时，M-估计量很有用。所谓低杠杆，是指异常观测值不会显著影响参数估计。在一般情况下，更好的替代方案是使用\
  \ MM-估计量，其中估计分为两步进行：(1) 计算一个具有高破裂点的初始一致估计 \\(\\hat{\\boldsymbol{\\phi}}_p^{(0)}$；虽然它可能不高效，并且使用此估计获得一个稳健尺度；(2)\
  \ 从 \\(\\hat{\\boldsymbol{\\phi}}_p^{(0)}$ 开始，通过前面的迭代程序最小化 Eq. (4.36)。\n\n鲁棒估计中的一个关键问题是在计算残差时避免异常值的传播。例如，如前所述，AR(p)\
  \ 中在 \\(t=h$ 处的 AO 会污染从 \\(t=h$ 开始的所有 p 个连续残差，因为 \\(e_t(\\boldsymbol{\\phi}_p) =\
  \ z_t - \\boldsymbol{\\phi}'_p \\boldsymbol{z}_{t-1,p}$。因此，已提出了鲁棒滤波器来避免这种影响，例如，Muler\
  \ et al. (2009) 在单变量情况下以及 Muler (2013) 针对\n\n\n\n向量情况，以及其中的参考文献。关于时间序列分析的稳健方法的良好介绍可以在\
  \ Maronna et al. (2019) 中找到。\n\n### 示例 4.8\n\n在这里，我们使用稳健估计 R 包 **robustarima** 来搜索异常值。其命令\
  \ `arima.rob` 可以在异常值检测下估计指定的时间序列模型。我们还将结果与示例 4.5 中的 `tsoutliers` 进行比较。再次，我们使用的数据是美国和中国的进出口系列。使用的命令是：\n\
  \n```\n> da <- read.csv(\"m-eximpcnus.csv\")\n> da=da[,-1]\n> da=as.ts(da)\n> xt=diff(da)\n\
  > T=dim(xt)[1]\n> k=dim(xt)[2]\n> require(robustarima)\n>Otable <- matrix(0,k,4)\n\
  >for (i in 1:k){\n> z <-as.ts(xt[,i])\n> mm <- arima.rob(z^1,p=3)\n> mm1 <- mm$outliers\n\
  > mm1 <- mm$outliers\n>Otable[i,1] <- i\n>for (j in 1:3){\n> jdx <- c(1:mm1$nout)[mm1$outlier.type==j]\n\
  >Otable[i,(j+1)]=length(jdx) }\n> colnames(Otable) <- c(\"Series\",\"IO\",\"AO\"\
  ,\"LS\")\n> print (Otable)\n```\n\n| 系列 | IO | AO | LS |\n|------|----|----|----|\n\
  | 1 | 0 | 9 | 0 |\n| 2 | 0 | 4 | 0 |\n| 3 | 0 | 6 | 0 |\n| 4 | 0 | 5 | 0 |\n\n将结果与示例\
  \ 4.5 的结果进行比较，我们看到两种方法产生相似的结果。主要区别在于稳健方法识别了几个连续的 AO 异常值，而 `tsoutliers` 将这些 AO 视为暂时性变化。例如，请参见下面第四系列的结果：\n\
  \n```\n> z <-as.ts(xt[,4])\n> mm <- arima.rob(z^1,p=3)\n> mm$outliers\nNumber of\
  \ outliers detected:  5\nOutlier index\n[1] 14 200 202 203 204\nOutlier type\n[1]\
  \ \"AO\" \"AO\" \"AO\" \"AO\" \"AO\"\nOutlier impact\n[1] 0.0718 -0.0699 -0.1195\
  \ -0.0579 -0.0910\nOutlier t-statistics\n[1] 4.3659 4.2716 7.1753 3.5323 5.4793\n\
  ```\n\n结果显示有五个 AO，其中从 t = 202 到 204 有三个连续的。另一方面，示例 4.5 中的 tsoutliers 程序检测到了 t =\
  \ 14 处的 AO，但 t = 202 处是 TC。\n\n## 4.7 参数变化的异质性\n\n时间序列分析中另一种形式的异质性是由模型参数的变化引起的。其影响可以在整个抽样期逐渐观察到。关于单变量时间序列模型中参数变化监控的文献很多。首先，McCulloch\
  \ and Tsay (1993) 从贝叶斯角度研究了 AR 过程中的均值和方差转移。Lee et al. (2003)、Gambay and Serban (2009)\
  \ 和 Chan et al. (2014) 等许多学者也考虑了 AR 参数的变化。其次，Inclán and Tiao (1994) 研究了边际方差的变化，他们提出了一种基于累积平方和统计量的迭代程序，Bai\
  \ (1994) 和 Bai and Perron (1998) 也研究了此问题。对于多变量时间序列分析，相关工作较少。Galeano and Peña (2007)\
  \ 使用 LR 和累积和（cusum）方法研究了 VARMA 模型中各组成部分方差和相关结构阶跃变化的检测。在接下来的内容中，我们将介绍检测单变量时间序列中参数变化和多变量时间序列中协方差变化的程序。\n\
  \n### 4.7.1 单变量时间序列中的参数变化\n\n考虑一个遵循模型 \\(z_t = \\boldsymbol{\\phi}' \\mathbf{Z}_{t-1}\
  \ + a_t\\) 的单变量 AR(p) 时间序列，其中 \\(1 \\le t \\le T\\)，\\(\\boldsymbol{\\phi} = (\\\
  phi_0, \\phi_1, \\dots, \\phi_p)'\\) 且 \\(\\mathbf{Z}_{t-1} = (1, z_{t-1}, \\dots,\
  \ z_{t-p})'\\)。假设该序列在时间索引 \\(\\tau_1 < \\tau_2 < \\dots < \\tau_m\\) 处发生 m 个参数变化，且\
  \ \\(\\tau_1 > 1\\) 与 \\(\\tau_m < T\\)。变化可能同时出现在 AR 系数和噪声方差中。为简化起见，我们设 \\(\\mathrm{Var}(a_t)\
  \ = 1\\) 以避免方差参数化的任何混淆。因此，当 \\(1 \\le t < \\tau_1\\) 时，序列遵循 AR(p) 模型 \\(z_t = \\\
  boldsymbol{\\phi}'_1 \\mathbf{Z}_{t-1} + \\sigma_1 a_t\\)，但当 \\(t = \\tau_1\\) 时，模型变为\
  \ \\(z_t = \\boldsymbol{\\phi}'_2 \\mathbf{Z}_{t-1} + \\sigma_2 a_t\\)。第二个模型适用于区间\
  \ \\(\\tau_1 \\le t < \\tau_2\\) 中的数据。同样，在时间 \\(t = \\tau_2\\) 时，AR 参数转移到 \\(\\\
  boldsymbol{\\phi}'_3\\)，噪声方差转移到 \\(\\sigma_3\\)，以此类推。定义 \\(\\tau_0 = 1\\) 和 \\(\\\
  tau_{m+1} = T\\)，该模型可写为\n\n\\(z_t = \\sum_{i=1}^{m+1} (\\boldsymbol{\\phi}'_i \\\
  mathbf{Z}_{t-1} + \\sigma_i a_t) I_{[\\tau_{i-1} \\le t < \\tau_i]},\\) (4.39)\n\
  \n其中，若 A 成立则 I(A) = 1，否则 I(A) = 0。Chan et al. (2014) 提出用参数变化向量作为新参数，以更紧凑的形式写出该模型。定义时刻\
  \ t 的参数变化向量 \\(\\boldsymbol{\\beta}_t\\)，并取 \\(\\boldsymbol{\\beta}_1 = \\boldsymbol{\\\
  phi}_1\\)。\n\n然后，当 \\( t < \\tau_1 \\) 时，参数不变，因此 \\( \\beta_t = \\mathbf{0} \\)。然而，在\
  \ \\( t = \\tau_1 \\) 处，参数变为 \\( \\phi_2 \\)，因此 \\( \\beta_{\\tau_1} = \\phi_2 -\
  \ \\phi_1 \\)。一般来说，若 \\( t \\) 不属于变点集合 \\( (\\tau_1, \\tau_2, \\dots, \\tau_m) \\\
  )，则 \\( \\beta_t = \\mathbf{0} \\)；若 \\( t = \\tau_i \\)，则 \\( \\beta_t = \\phi_{i+1}\
  \ - \\phi_i \\)。因此，我们可以将 Eq. (4.39) 写成\n\n\\( Y = XB + U, \\) (4.40)\n\n其中，\\(\\\
  mathbf{Y} = (z_1, \\dots, z_T)'\\)，\\( X \\) 是滞后值变量的 \\( T \\times T(p+1) \\) 矩阵，定义为\n\
  \n\\( X = \\left[ \\begin{array}{ccccc} Y_0' & 0' & 0' & \\dots & 0' \\\\ Y_1' &\
  \ Y_1' & 0' & \\dots & 0' \\\\ Y_2' & Y_2' & Y_2' & \\dots & 0' \\\\ \\vdots & \\\
  vdots & \\vdots & \\ddots & \\vdots \\\\ Y_{T-1}' & Y_{T-1}' & Y_{T-1}' & \\dots\
  \ & Y_{T-1}' \\end{array} \\right], \\)\n\n与 \\(\\mathbf{Y}_i = (1, z_i, z_{i-1},\
  \ \\dots, z_{i-p+1})'\\) 和 \\(\\mathbf{0}\\) 是一个 \\( p+1 \\) 维零向量，\\( B = (\\beta_1',\
  \ \\dots, \\beta_T') \\) 是参数变化的 \\( T(p+1) \\) 维向量，\\( U = (\\sigma_1 a_1, \\dots,\
  \ \\sigma_T a_T) \\)。\n\nChan et al. (2014) 提出通过群 Lasso 估计来估计该模型，该模型中只有 \\( m+1\
  \ \\) 个系数 \\(\\beta_t'\\) 不为零，群 Lasso 估计将在第 7 章中详细说明。在此情况下，模型参数具有群结构，即我们关注的是 \\\
  ( T \\) 个向量 \\(\\beta_t\\)，而不是 \\( T(p+1) \\) 个参数 \\(\\beta_{ij}\\) 的个别值，其中 \\(\\\
  beta_t = (\\beta_{t0}, \\beta_{t1}, \\dots, \\beta_{tp})\\)。标准 Lasso 最小化试图使许多 \\\
  (\\beta_{ij}\\) 等于零，而在此我们关注的是使群 \\(\\beta_t\\) 中的所有系数均等于零。为此，Yuan and Lin (2006)\
  \ 提出了群 Lasso，其估计方程为\n\n\\( \\hat{B} = \\arg \\min \\frac{1}{T} \\| \\mathbf{Y} -\
  \ \\mathbf{XB} \\|^2 + \\lambda_T \\sum_{t=1}^T \\| \\beta_t \\|, \\)\n\n其中 \\(\\\
  lambda_T\\) 是惩罚参数，\\(\\| . \\|\\) 是欧几里得或 \\(\\ell_2\\) 范数。注意，如果在惩罚中使用 \\(\\ell_1\\\
  ) 范数，我们将回到标准 Lasso。然而，通过使用 \\(\\ell_2\\) 范数，时刻 t 的所有系数被一起考虑。因此，若 \\(\\hat{\\beta}_t\
  \ \\neq \\mathbf{0}\\)，则在时间索引 t 处检测到一个参数变化，且估计的变化数量 \\(\\hat{m}\\) 等于非零元素 \\(\\\
  hat{\\beta}_t\\) 的数量减一。令 \\((\\hat{\\tau}_1, \\hat{\\tau}_2, \\dots, \\hat{\\tau}_{\\\
  hat{m}})\\) 为这些变化的时间索引。AR 参数估计为\n\n\\(\\hat{\\phi}_1 = \\hat{\\beta}_1 \\quad \\\
  text{and} \\quad \\hat{\\phi}_j = \\sum_{t=1}^{\\hat{j}} \\hat{\\beta}_t, \\quad\
  \ j = 2, \\dots, \\hat{m} + 1.\\)\n\nChan et al. (2014) 证明了该程序在预测误差方面是一致的，但会高估变点的数量。他们还建议应用模型选择准则，从群\
  \ Lasso 估计找到的 \\(\\hat{m}\\) 个变点中选择最佳变点集合。最后，有一些工作专注于多变量数据变点检测的非参数方法。例如，参见 Matteson\
  \ and James (2014)。\n\n### 4.7.2 多变量时间序列中的协方差变化\n\n假设我们观察到的不是遵循 VARMA 模型 \\(\\Phi(B)y_t\
  \ = \\Theta(B)a_t\\)、且 \\(a_t \\sim N_k(0, \\Sigma)\\) 的时间序列 \\(y_t = (y_{1t}, \\\
  dots, y_{kt})'\\)，而是观察到由下式给出的 \\(z_t\\)：\n\n\\(\\Phi(B)z_t = \\Theta(B)e_t,\\)\n\
  \n\n\n其中，\n\n$$e_t = a_t + W S_t^{(h)} a_t,$$\n\n其中，$S_t^{(h)}$ 是阶跃函数，$W$ 是大小为 $k\
  \ \\times k$ 的下三角矩阵，表示协方差变化的影响。该方程表明，观测时间序列的创新项 $e_t$ 的协方差在时点 $t = h$ 由 $\\Sigma$\
  \ 变为 $\\Omega = (I + W)\\Sigma(I + W)'$。观测序列 $z_t$ 与未观测向量 ARMA 时间序列 $y_t$ 之间的关系由下式给出：\n\
  \n$$z_t = y_t + \\Psi(B) W S_t^{(h)} a_t, \\tag{4.41}$$\n\n其中，$\\Psi(B) = \\Phi^{-1}(B)\\\
  Theta(B)$。\n\n不失一般性，我们假设 $(I + W)$ 是正定矩阵，从而矩阵 $W$ 得到良好识别。设 $\\Sigma = L_{\\Sigma}\
  \ L_{\\Sigma}'$ 和 $\\Omega = L_{\\Omega} L_{\\Omega}'$ 为两个协方差矩阵的 Cholesky 分解。则\n\
  \n$$\\Omega = L_{\\Omega} L'_{\\Omega} = (I + W)L_{\\Sigma} L'_{\\Sigma} (I + W)'$$\n\
  \n和\n\n$$L_{\\Omega} = (I + W)L_{\\Sigma},$$\n\n这意味着\n\n$$W = L_{\\Omega} L_{\\\
  Sigma}^{-1} - I. \\tag{4.42}$$\n\n因此，通过 (4.42) 估计 $W$ 得到一个定义明确的矩阵。\n\n为检验时点 $t =\
  \ h$ 处协方差变化的显著性，假设向量 ARMA 模型的参数已知，并通过下式计算残差：\n\n$$e_t = z_t - \\sum_{i=1}^p \\Phi_i\
  \ z_{t-i} + \\sum_{j=1}^q \\Theta_j e_{t-j}. \\tag{4.43}$$\n\n我们想检验原假设 $H_0 : W\
  \ = 0$，这意味着这些残差是独立同分布且同方差的，与备择假设 $H_1 : W \\neq 0$ 相对，后者意味着残差是异方差的。我们提出两种统计量：LR\
  \ 检验（渐近最强检验）和 CUSUM 检验。我们定义三个矩阵 $S = \\sum_{i=1}^T (e_i e_i') / T$、$S_1 = \\sum_{i=1}^{h-1}\
  \ (e_i e_i') / (h-1)$ 和 $S_2 = \\sum_{i=h}^T (e_i e_i') / (T - h + 1)$。在时点 $t =\
  \ h$ 及之后发生方差变化的 LR 统计量由下式给出：\n\n$$\\text{LR}_h = \\log \\frac{|S|^T}{|S_1|^{h-1}\
  \ |S_2|^{T-h+1}}, \\tag{4.44}$$\n\n并且，在无协方差变化且模型已知的原假设下，$\\text{LR}_h$ 统计量具有渐近卡方分布，自由度为\
  \ $\\frac{1}{2}k(k+1)$。\n\n替代的 CUSUM 检验统计量可构建如下。设 $A_h = \\sum_{i=1}^h e_i' \\Sigma^{-1}\
  \ e_t$ 为残差的多元累积平方和，其中 $h$ 是任意给定值 $1 \\le h \\le T$。设，\n\n$$C_h = \\frac{h}{\\sqrt{2kT}}\
  \ \\left( \\frac{A_h}{h} - \\frac{A_T}{T} \\right), \\tag{4.45}$$\n为序列 \\( e_t \\\
  ) 的中心化和标准化累积平方和。\n在无协方差矩阵变化假设下，该统计量的渐近分布是 $v = h/T$ 处的布朗桥，其服务于均值为零、方差为 $v(1 - v)$\
  \ 的正态分布。因此，为检验时点 $h$ 处是否存在协方差变化，统计量 $C_h$ 的值将与均值为零、方差为 $v(1 - v)$ 的正态分布的百分位数进行比较。协方差变化的影响通过计算矩阵\
  \ $S_1$ 和 $S_2$ 的 Cholesky 分解并使用 Eq. (4.42) 来估计\n\n\\(\\widehat{W} = L_{S_2} L_{S_1}^{-1}\
  \ - I.\\) (4.46)\n\n#### 4.7.2.1 检测多个协方差变化\n\n向量时间序列中可能发生多个协方差变化。当存在 $r$ 个变化时，观测时间序列由下式给出\n\
  \n\\( z_t = y_t + \\Psi(B)(I + W_r S_t^{(h_r)}) \\cdots (I + W_1 S_t^{(h_1)}) a_t,\\\
  )\n\n其中，$\\{h_1, \\dots, h_r\\}$ 是 $r$ 个变化点的时间索引，$W_1, \\dots, W_r$ 是 $k \\times\
  \ k$ 的下三角矩阵，表示 $r$ 个变化的影响。假设参数已知，残差的过滤序列由下式给出\n\n\\( e_t = (I + W_r S_t^{(h_r)})\
  \ \\cdots (I + W_1 S_t^{(h_1)}) a_t,\\)\n\n并且，$e_t$ 的残差协方差矩阵在 $t = h_1$ 处从 $\\Sigma$\
  \ 变为 $(I + W_1) \\Sigma (I + W_1)'$，在 $t = h_2$ 处变为 $(I + W_2)(I + W_1) \\Sigma\
  \ (I + W_1)' (I + W_2)'$，以此类推。在实际中，VARMA 模型的参数、方差变化的数量、位置和大小均未知。设 $\\widehat{\\\
  text{LR}}_t$ 和 $\\widehat{C}_t$ 分别为通过 (4.43) 得到的估计残差计算出的统计量 (4.44) 和 (4.45)。我们将该系列中这些统计量的最大值定义为，\n\
  \n\\(\\Lambda_{\\max}(h_{\\max}^{LR}) = \\max\\{ |\\widehat{\\text{LR}}_t|, 1 \\\
  le t \\le T \\}, \\, \\Gamma_{\\max}(h_{\\max}^C) = \\max\\{ |\\widehat{C}_t|, 1\
  \ \\le t \\le T \\},\\) (4.47)\n\n其中，$h_{\\max}^{LR}$ 和 $h_{\\max}^C + 1$ 分别是使用\
  \ LR 检验和 CUSUM 统计量估计的变化时点。Eq. (4.47) 中 $\\Lambda_{\\max}$ 的分布难以处理，临界值通过仿真得到。Eq.\
  \ (4.47) 中 $\\Gamma_{\\max}$ 的分布渐近地为 $\\sup\\{ |M_r^0| : 0 \\le r \\le 1 \\}$ 的分布，由下式给出（参见\
  \ Billingsley, 2013）：\n\n\\( P\\{ \\sup |M_r^0| \\le a : 0 \\le r \\le 1 \\} = 1\
  \ + 2 \\sum_{i=1}^\\infty (-1)^i \\exp(-2 i^2 a^2),\\)\n\n临界值可从此分布中得到。如果系列中发生了多个变化，我们提出两种基于统计量\
  \ $\\Lambda_{\\max}$ 和 $\\Gamma_{\\max}$ 的迭代程序来检测它们并估计其影响。\n\n#### 4.7.2.2 LR 检验\n\
  \n以下程序是 Tsay (1988) 提出方法的推广。该算法基于在发现方差变化后清洗序列，步骤如下：\n\n- 1. 假设无方差变化，为观测序列 $z_t$\
  \ 指定一个向量 ARMA 模型。得到模型的最大似然估计以及由 $\\widehat{e}_t$ 表示的残差过滤序列。定义 $z_t^* = z_t$。\n\n\
  - 2. 对给定的正整数 $d$，使用步骤 1 得到的残差计算统计量 $\\text{LR}_h$，其中 $h = d + 1, \\dots, T - d$。数量\
  \ $d$ 表示估计协方差矩阵所需的最小残差数，我们将 $d$ 取为待估计参数数加一，\n\n\\[ d = k + k(p + q) + \\frac{k(k+1)}{2}\
  \ + 1. \\]\n\n利用统计量 $\\text{LR}_h$，得到 Eq. (4.47) 中的统计量 $\\Lambda_{\\max}(h_{\\max}^{LR})$。\n\
  \n- 3. 对于给定的显著性水平，将 $\\Lambda_{\\max}(h_{\\max}^{LR})$ 与指定临界值 $C$ 进行比较。如果 $\\Lambda_{\\\
  max}(h_{\\max}^{LR}) < C$，则结论为不存在协方差变化，程序结束。如果 $\\Lambda_{\\max}(h_{\\max}^{LR})\
  \ \\ge C$，则假设在时点 $t = h_{\\max}^{LR}$ 处存在显著协方差变化。\n\n- 4. 矩阵 $\\widehat{W}$ 使用 Eq.\
  \ (4.46) 估计，并按如下方式计算修正后的残差系列：\n\n\\[ e_t^* = \\begin{cases} \\widehat{e_t}, & t\
  \ < h_{\\max}^{LR}, \\\\ (I + \\widehat{W})^{-1} \\widehat{e_t}, & t \\ge h_{\\\
  max}^{LR}, \\end{cases} \\]\n\n并且，利用该残差系列，定义校正后的时间序列为\n\n\\[ z_t^* = \\begin{cases}\
  \ z_t, & t < h_{\\max}^{LR} \\\\ \\widehat{\\Phi}_1 z_{t-1} + \\dots + \\widehat{\\\
  Phi}_p z_{t-p} + e_t^* - \\widehat{\\Theta}_1 e_{t-1}^* - \\dots - \\widehat{\\\
  Theta}_q e_{t-q}^*, & t \\ge h_{\\max}^{LR} \\end{cases} \\]\n\n其中，多项式矩阵 $\\widehat{\\\
  Phi}(B)$ 和 $\\widehat{\\Theta}(B)$ 是参数的最大似然估计。然后，返回步骤 1，将 $z_t^*$ 视为观测过程。\n\n- 5.\
  \ 当不再发现协方差变化时，使用下述模型对模型参数以及之前步骤中检测到的所有协方差变化进行联合估计：\n\n\\[ \\Phi(B)z_t = \\Theta(B)(I\
  \ + W_r S_t^{(h_t)}) \\cdots (I + W_1 S_t^{(h_1)}) a_t. \\quad (4.48) \\]\n\n该联合估计分两步进行。首先，假设无方差变化来估计参数，然后估计矩阵\
  \ $W_r$。之后，校正序列，并重复这两步直到收敛。\n\nCUSUM 程序是 Inclán 和 Tiao (1994) 提出方法的推广。该算法基于在检测到变化时将序列连续分为两段，并在附录中说明。对这些算法有以下几点说明。首先，LR\
  \ 统计量的临界值必须通过仿真得到，而 CUSUM 程序的临界值是布朗桥绝对值最大值的渐近临界值。其次，在两种算法中，我们都要求方差变化之间的最小距离大于 $d$，以便可以估计协方差矩阵。如果在小于\
  \ $d$ 的区间内发现了多个变化，这些变化将被视为多元离群点，并由之前讨论的程序进行估计。第三，LR 程序的最后一步是为了避免估计协方差变化大小的偏差。请注意，在步骤\
  \ 4 中，协方差变化的大小是在检测之后估计的。因此，如果存在两个协方差变化，则第一个检测到的变化的影响在未考虑第二个变化的情况下进行估计。因此，需要联合估计来减少偏差。\n\
  \n\n\n\n\n## APPENDIX 4.A: CUSUM ALGORITHMS\n\n### 4.A.1 Detecting Univariate LS\n\
  \nBai (1994) proposed to identify LS by the cusum statistic,\n\n$$ C_t = \\frac{t}{\\\
  sqrt{T \\psi(1)\\sigma_e}} \\left( \\frac{1}{t} \\sum_{i=1}^t z_i - \\bar{z} \\\
  right), \\quad (4.49) $$\n\nto test for a level shift at $t = h + 1$ in a linear\
  \ process, and showed that the statistic converges weakly to a standard Brownian\
  \ Bridge on $[0, 1]$. In practice, the quantity $\\psi(1)\\sigma_e$ is replaced\
  \ by a consistent estimator,\n\n$$ \\widehat{\\psi(1)}\\sigma_e = \\left[ \\widehat{\\\
  gamma(0)} + 2 \\sum_{i=1}^K \\left( 1 - \\frac{|i|}{K} \\right) \\widehat{\\gamma(i)}\
  \ \\right]^{\\frac{1}{2}}, $$\n\nwhere $\\widehat{\\gamma(i)} = \\text{Cov}(y_t,\
  \ y_{t-i})$ and $K$ is a quantity such that $K \\to \\infty$ and $K/T \\to 0$ as\
  \ $T \\to \\infty$. Under the assumption of no level shifts in the sample, the statistic\
  \ $\\max_{1 \\le t \\le T} |C_t|$ is asymptotically distributed as the supremum\
  \ of the absolute value of a Brownian Bridge with cumulative distribution function,\
  \ $F(x) = 1 + 2 \\sum_{i=1}^\\infty (-1)^i e^{-2i^2 x^2}$, for $x > 0$. The main\
  \ advantages of the cusum statistic (4.49) over the LRT statistic for detecting\
  \ level shifts include that (1) the ARMA model is not needed, (2) the cusum statistic\
  \ has been shown to be more powerful than the LRT in several Monte Carlo studies,\
  \ and (3) the statistic (4.49) seems to be robust to the presence of other outliers\
  \ whereas the LRT statistic is not.\n\n### 4.A.2 Detecting Multivariate Level Shift\n\
  \nGaleano et al. (2006) proposed an iterative procedure to identify multivariate\
  \ level shifts based on the algorithm proposed in Inclán and Tiao (1994) for detecting\
  \ several variance changes. For a vector of $k$ series compute projected univariate\
  \ series, $z_{it} = v_i' z_t$, for $i = 1, ..., N$, where $N \\ge k$, and let $H$\
  \ be the prespecified minimum distance between two level shifts. The proposed algorithm\
  \ divides the series into pieces after detecting a level shift and proceeds as follows:\n\
  \n- 1. Let $t_1 = 1$ and $t_2 = T$. Obtain\n\n$$ D_L = \\max_{1 \\le i \\le N} \\\
  max_{t_1 \\le t \\le t_2} |C_t^i|, \\quad (4.50) $$\n\nwhere $C_t^i$ is the cusum\
  \ statistic (4.49) applied to the $i$th projected series for $i = 1, ..., k$. Let\n\
  \n$$ (i_{\\max}, t_{\\max}) = \\arg \\max_{1 \\le i \\le N} \\arg \\max_{t_1 \\\
  le t \\le t_2} |C_t^i|. \\quad (4.51) $$\n\nIf $D_L > D_{L,\\alpha}$, where $D_{L,\\\
  alpha}$ is the critical value for the significance level $\\alpha$, then there is\
  \ a possible level shift at $t = t_{\\max} + 1$, and we go to 2a. If $D_L < D_{L,\\\
  alpha}$, then there is no level shift in the series and the algorithm stops.\n\n\
  - 2a. Define $t_2 = t_{\\max}$ of step 1, and obtain new values of $D_L$ and $(i_{\\\
  max}, t_{\\max})$ of (4.50) and (4.51), respectively. If $D_L > D_{L,\\alpha}$,\
  \ and $t_2 - t_{\\max} > H$, then we redefine $t_2 = t_{\\max}$ and repeat step\
  \ 2a until $D_L < D_{L,\\alpha}$ or $t_2 - t_{\\max} \\le H$. Define $t_{\\text{first}}\
  \ = t_2$ where $t_2$ is the last time index that attains the maximum of the cusum\
  \ statistic that is larger than $D_{L,\\alpha}$ and satisfies $t_2 - t_{\\max} >\
  \ H$. The point $t_{\\text{first}} + 1$ is the first time point with a possible\
  \ level shift.\n\n- 2b. Define $t_1 = t_{\\max}$ of step 1 and $t_2 = T$, and obtain\
  \ new values of $D_L$ and $(i_{\\max}, t_{\\max})$ of (4.50) and (4.51). If $D_L\
  \ > D_{L,\\alpha}$, and $t_{\\max} - t_1 > H$, then we redefine $t_1 = t_{\\max}$\
  \ and repeat step 2b until $D_L < D_{L,\\alpha}$ or $t_{\\max} - t_1 \\le H$. Define\
  \ $t_{\\text{last}} = t_1$ where $t_1$ is the last time index that attains the maximum\
  \ of the cusum statistics which is larger than $D_{L,\\alpha}$ and satisfies $t_{\\\
  max} - t_1 > H$. The point $t_{\\text{last}} + 1$ is the last time point with a\
  \ possible level shift.\n\n- 2c. If $t_{\\text{last}} - t_{\\text{first}} < H$,\
  \ there is just a level shift and the algorithm stops. If not, keep both values\
  \ as possible change points and repeat steps 2a and 2b for $t_1 = t_{\\text{first}}$\
  \ and $t_2 = t_{\\text{last}}$ until no more possible change points are detected.\
  \ Then, go to step 3.\n\n- 3. Define a vector $h^L = (h^L_0, \\dots, h^L_{r_L+1})$,\
  \ where $h^L_0 = 1, h^L_{r_L+1} = T$ and $h^L_1 < \\cdots < h^L_{r_L}$ are the change\
  \ points detected in step 2. Obtain the statistic $D_L$ in each sub-intervals $(h^L_i,\
  \ h^L_{i+2})$ and check its statistical significance. If it is not significant,\
  \ eliminate the corresponding possible change point. Repeat step 3 until the number\
  \ of possible change points remains unchanged and the time indexes of change points\
  \ are the same between iterations. Removing $h^L_0 = 1$ and $h^L_{r_L+1} = T$ from\
  \ the final vector of time indexes, we obtain $r_L$ level shifts in the series at\
  \ time indexes $h^L_i + 1$ for $i = 1, \\dots, r_L$.\n\n- 4. Let $\\{h^L_1, \\dots,\
  \ h^L_{r_L}\\}$ be the time indexes of $r_L$ detected level shifts. To remove the\
  \ impacts of level shifts, fit the model:\n\n\\((\\mathbf{I} - \\Pi_1 B - \\cdots\
  \ - \\Pi_{\\hat{p}} B^{\\hat{p}}) z^*_t = \\mathbf{a}^*_t, \\quad (4.52)\\)\n\n\
  where \\(z^*_t = z_t - \\sum_{i=1}^{r_L} w_i S_t^{(h^L_i)}\\), and the order \\\
  (\\hat{p}\\) is chosen such that\n\n\\(\\hat{p} = \\arg \\min_{0 \\le p \\le p_{\\\
  max}} AIC(p) = \\arg \\min_{0 \\le p \\le p_{\\max}} \\left\\{ \\log |\\hat{\\Sigma}_p|\
  \ + 2 \\frac{k^2 p}{T} \\right\\},\\)\n\nwhere \\(\\hat{\\Sigma}_p = \\frac{1}{T\
  \ - 2p - 1} \\sum_{t=p+1}^T \\mathbf{a}^*_t \\mathbf{a}^{*\\prime}_t\\) and \\(p_{\\\
  max}\\) is a prespecified upper bound. If some of the effects of level shifts are\
  \ not significant, the least significant one is removed from the model in (4.52)\
  \ and the effects of the remaining \\(r_L - 1\\) level shifts are re-estimated.\
  \ This process is repeated until all the level shifts are significant.\n\nCritical\
  \ values of the statistic $D_L$, which is the maximum of dependent random variables,\
  \ can be obtained by simulation (see Galeano et al., 2006). Note that the test statistics\
  \ (4.49) are highly correlated for close observations and consecutive large values\
  \ of $C_t$ might be caused by a single level shift. To avoid over detection two\
  \ level shifts should not be closer than the number $H$ in steps 2 and 3; $H = 10$\
  \ seems to work well in practice.\n\n### 4.A.3 Detecting Multiple Covariance Changes\n\
  \nThe algorithm is a generalization of Inclán and Tiao (1994) and proceeds as follows:\n\
  \n- 1. Assuming no covariance changes, a vector ARMA model is specified for the\
  \ observed series \\(\\boldsymbol{z}_t\\). The maximum likelihood estimates of the\
  \ model are obtained as well as the residual series that we denote by \\(\\widehat{\\\
  boldsymbol{e}}_t\\). Let \\(t_1 = 1\\).\n\n- 2. Obtain \\(\\Gamma_{\\max}(h_{\\\
  max}^C)\\) in (4.47) for \\(t = 1, \\dots, T\\). If \\(\\Gamma_{\\max}(h_{\\max}^C)\
  \ > C\\), where \\(C\\) is a specified critical value for a given critical level,\
  \ go to step 3. If \\(\\Gamma_{\\max}(h_{\\max}^C) < C$, it is assumed that there\
  \ is no covariance change in the series and the procedure ends.\n\n- 3. Step 3 contains\
  \ three substeps:\n  - a. Obtain \\(\\Gamma_{\\max}(h_{\\max}^C)\\) for \\(t = 1,\
  \ \\dots, t_2$, where \\(t_2 = h_{\\max}^C$. If \\(\\Gamma_{\\max}(h_{\\max}^C)\
  \ > C$, redefine \\(t_2 = h_{\\max}^C$ and repeat step 3(a) until \\(\\Gamma_{\\\
  max}(h_{\\max}^C) < C$. When this happens, define \\(h_{\\text{first}} = t_2\\),\
  \ where \\(t_2\\) is the last value such that \\(\\Gamma_{\\max}(h_{\\max}^C) >\
  \ C$.\n  - b. Repeat a similar search in the interval \\(t_2 \\le t \\le T$, where\
  \ \\(t_2\\) is the point \\(h_{\\max}^C$ obtained in step 2. For that, define \\\
  (t_1 = h_{\\max}^C + 1$, where \\(h_{\\max}^C = \\arg \\max \\{ C_t : t = t_1, \\\
  dots, T \\}$ and repeat it until \\(\\Gamma_{\\max}(h_{\\max}^C) < C$. Define \\\
  (h_{\\text{last}} = t_1 - 1$, where \\(t_1\\) is the last value such that \\(\\\
  Gamma_{\\max}(h_{\\max}^C) > C$.\n  - c. If \\(|h_{\\text{last}} - h_{\\text{first}}|\
  \ < d$, there is just one change point and the algorithm ends. Otherwise, keep both\
  \ values as possible change points and repeat steps 2 and 3 for \\(t_1 = h_{\\text{first}}\\\
  ) and \\(T = h_{\\text{last}}$, until no more possible change points are detected.\
  \ Then, go to step 4.\n\n- 4. Define a vector \\(\\boldsymbol{\\ell} = (\\ell_1,\
  \ \\dots, \\ell_s)$, where \\(\\ell_1 = 1$, \\(\\ell_s = T$ and \\(\\ell_2, \\dots,\
  \ \\ell_{s-1}$ are the points detected in steps 2 and 3 in increasing order. Obtain\
  \ the statistic \\(C_t$ in each one of the intervals \\((\\ell_i, \\ell_{i+2})\\\
  ) and check if its maximum is still significant. If it is not, eliminate the corresponding\
  \ point. Repeat step 4 until the number of possible change points does not change,\
  \ and the points found in previous iterations do not differ from those in the last\
  \ one. The vector \\((\\ell_2 + 1, \\dots, \\ell_{s-1} + 1)$ are the points of covariance\
  \ change.\n\n- 5. Finally, estimate the parameters of the model and the covariance\
  \ changes detected in the previous steps jointly by using (4.48).\n\n## EXERCISES\n\
  \n- 1. Compute the optimal interpolation for the univariate ARMA process \\((1 -\
  \ 0.6B - 0.3B^2)z_t = 5 + a_t\\) at time \\(h\\) as a function of the observations\
  \ before and after \\(t = h\\). How many values are used? How are they weighted?\n\
  \n- 2. Prove that the optimal interpolation of the vector process \\((\\boldsymbol{I}\
  \ - \\boldsymbol{\\Phi}B)\\boldsymbol{z}_t = \\boldsymbol{a}_t\\) at time \\(t =\
  \ h\\) is given by \\(\\widehat{\\boldsymbol{z}}_h = (\\boldsymbol{I} + \\boldsymbol{\\\
  Phi}'\\boldsymbol{\\Phi})^{-1}\\boldsymbol{\\Phi}(\\boldsymbol{z}_{h-1} + \\boldsymbol{z}_{h+1})\\\
  ).\n\n- 3. Use the package **tsoutliers** to detect outliers in the 9th and 10th\
  \ series of the data set `TaiwanAirBox032017.csv`. Then, use the Lasso approach\
  \ to detect level shifts and AOs in the same two time series. Compare the detection\
  \ results.\n\n- 4. Compare the results of Exercise 3 with those obtained via the\
  \ program **arima.rob**.\n\n- 5. With the three series of world temperature (`Temperatures.csv`)\
  \ find outliers using the programs **tso**, **arima.rob** and **outlierLasso**.\n\
  \n\n\n\n\n- 6. 如示例 2.2 所示，模拟三个遵循 ARMA 模型的时间序列，各取 100 个值。例如，AR(2) 或 ARMA(1,1)。在三个时间序列中引入大小为\
  \ 3 的离群点，并比较使用程序 tso、arima.rob 和 outlierLasso 进行单变量检测的结果与使用程序 outliers.hdts 进行多变量检测的结果。验证多变量检测比单变量检测更强大。\n\
  \n- 7. 在方差为 \\(\\sigma^2\\) 的白噪声序列 \\(a_t\\) 中，大小为 \\(\\omega\\) 的离群点由比率 \\(\\omega/\\\
  sigma\\) 识别。在具有相同方差 \\(\\sigma^2\\) 的 \\(k\\) 个时间序列组成的向量白噪声 \\(a_t\\) 及多变量离群点 \\\
  (\\boldsymbol{\\omega}\\) 中，通过将 \\(a_t\\) 在方向 \\(\\boldsymbol{\\omega}\\) 上投影得到的单变量时间序列\
  \ \\(y_t = \\boldsymbol{\\omega}'a_t\\) 具有一个大小为 \\(\\boldsymbol{\\omega}'\\boldsymbol{\\\
  omega}\\)、方差为 \\(\\boldsymbol{\\omega}'\\boldsymbol{\\omega}\\sigma^2\\) 的离群点，识别离群点的比率为\
  \ \\(\\sqrt{\\boldsymbol{\\omega}'\\boldsymbol{\\omega}}/\\sigma = \\sqrt{k\\bar{\\\
  omega}}/\\sigma\\)，其中 \\(\\bar{\\omega} = \\sqrt{\\boldsymbol{\\omega}'\\boldsymbol{\\\
  omega}/k}\\)。解释为什么这些结果证明，如果离群点的方向被准确识别，则通过投影进行的多变量离群点检测可能比单变量检测更强大。\n\n- 8. 假设 \\\
  (k\\) 很大，且该系列遵循参数矩阵稀疏（许多系数等于零且秩为 \\(r \\ll k\\)）的 VAR(1) 模型。如果时间序列向量在时刻 \\(h\\)\
  \ 和 \\(h+1\\) 受到两个 MAO 的影响。证明只有时间序列向量的一小部分随机投影能够显示 MAOs 的存在。\n\n## REFERENCES\n\n\

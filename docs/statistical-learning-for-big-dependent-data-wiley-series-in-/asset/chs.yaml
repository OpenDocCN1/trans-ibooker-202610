- "# 6 动态因子模型\n\n因子模型（FM）由英国心理学家查尔斯·斯皮尔曼在二十世纪前二十五年提出，用于解释智力概念。他发现，不同人在一组心智能力测试中的结果可以由一个一般因子解释，他称其为智力因子\
  \ G，以及一个特定成分，该成分取决于测试类别。FM 最初主要在心理学中研究，随后在经济学中用于研究经济发展的维度，在社会学中用于理解社会和经济概念。有关更多信息，请参见\
  \ Harman (1976)。\n\n时间序列早期因子分析包括 Anderson (1963)，他认识到需要为时间序列数据（如滞后因子效应）开发特定结果，以及\
  \ Brillinger (1964)，他为时间序列引入了动态主成分（DPCs）。Geweke (1977) 对 k 个平稳时间序列提出了动态因子模型（DFM），假设每个变量是两个独立成分之和：由\
  \ r 个因子生成的共同成分，加上特定成分或噪声。假设 r 个因子遵循独立线性过程，并可以带滞后地影响变量。他还提出了一种频域程序，通过采用经典 Jöreskog\
  \ 的最大似然（ML）方法来估计 FM 模型（Jöreskog, 1967）。Sargent 和 Sims (1977) 将该模型称为指数模型，并讨论了使用 Geweke\
  \ 的估计方法在经济学中的应用。另请参见 Geweke 和 Singleton (1981)。Engle 和 Watson (1981) 将单一 FM 视为线性系统状态空间表示的特例，并展示了如何使用卡尔曼滤波器估计该模型。Chamberlain\
  \ (1983) 和 Chamberlain 与 Rothschild (1983) 引入了近似动态因子模型（ADFM），其中噪声具有动态性，但特征值有界，并将其应用于套利定价模型，强调有界和无界特征值之间的差异。Connor\
  \ 和 Korajczyk (1986) 讨论了这些模型，也针对套利问题，并表明可以通过主成分分析（PCA）获得因子的一致估计。\n\nPeña 和 Box (1987)\
  \ 提出了一个 FM，其中所有动态均由因子驱动，噪声序列不相关。该模型通常称为精确 DFM（EDFM）。他们提出了对滞后协方差矩阵进行特征值分析以估计因子的方法。作者还首次将\
  \ DFM 的属性与向量自回归移动平均（VARMA）过程相关联，表明当数据由 DFM 生成时，VARMA 模型缺乏识别性。Stock 和 Watson (1988)\
  \ 提出了一个用于共同趋势的检验统计量，为 DFM 的非平稳分析打开了道路，Molenaar 等人 (1992) 研究了非平稳 DFM，其中因子遵循线性趋势。他们使用\
  \ Jöreskog 的 ML 方法估计了该模型。Forni 等人 (2000) 提出了一种通用方法，允许因子具有无限动态和非正交特异性成分，并使用 Brillinger\
  \ (1964) 的 DPCs 估计了该模型。他们将该模型称为广义动态因子模型（GDFM），并开发了其用于结构分析和预测的属性（Forni et al. 2005,\
  \ 2009, 2015）。有关各种 FM 的讨论，请参见 Tsay (2014, 第 6 章)。\n\n近年来，DFM 已成为统计学和计量经济学中一个活跃的研究领域，有许多重要贡献，该领域仍在快速发展。一些近期参考文献包括：Creal\
  \ 和 Tsay (2015) 考虑具有时间变载荷的高维随机 Copula 模型；Bai 和 Li (2016) 研究近似 FM 中的最大似然推断；Chan 等人\
  \ (2017) 考虑 DFM 中的推断和模型选择；Gao 和 Tsay (2019) 提出了一种用于高维时间序列的结构-因子方法；Zhang 等人 (2018)\
  \ 提出通过 DFM 识别协整的方法；McAlinn 等人 (2018) 从贝叶斯角度考虑稀疏 DFM；Wang 等人 (2019)；Chen 等人 (2020)\
  \ 研究矩阵值高维时间序列的 FM；以及 Gao 和 Tsay (2020) 调查高维单位根时间序列的结构 FM。\n\n使用 DFM 对多变量时间序列进行建模的优势在于，它们可以用少量参数表示动态演化。与\
  \ VARMA 模型相比，这是一个明显的优势，因为 VARMA 模型的参数数量随系列数量的平方增长。在本章中，我们介绍了为平稳和非平稳时间序列提出的 DFM。我们首先研究平稳数据的\
  \ EDFM，其中所有动态均由因子驱动，而噪声为白噪声。在某些一般条件下，该模型识别性良好，可以获得一致估计。噪声的动态可以推广以允许某些弱自相关或交叉相关，如同在\
  \ ADFM 中一样。该模型在有限样本中不具有识别性，但对弱噪声依赖做出某些强假设后，它可以渐近识别。另一种扩展是允许因子以更复杂的动态影响系列，甚至包括无限数量的滞后，该模型称为\
  \ GDFM。该框架通常包括 ADFM 的噪声假设。然后可以通过广义动态主成分（GDPC）估计该模型。\n\nDFM 也已扩展到非平稳数据，主要用于整合过程。然而，所提出的不同程序的优劣仍在研究中。我们还讨论了文献中可用的其他\
  \ FM 公式和扩展。最后，我们处理样本量小于正在研究的时间序列数量的情况。\n\n## 6.1 平稳系列的 DFM\n\n考虑 k 维平稳时间序列 z1, ...,\
  \ zT 的实现，其中 zt = (z1t, ..., zkt)'。我们假设每个时间序列均已通过减去其样本均值进行中心化，使得对于所有 j = 1, ...,\
  \ k，sum zjt = 0，并令 Z 为维度为 T x k 的数据矩阵，其中第 i 行是 zt'。我们假设系列的动态演化可以解释为两个正交成分之和。第一个成分在所有系列中是共同的，因此负责系列间的自相关和交叉相关。第二个成分是噪声，也称为特定或特异性成分，可能考虑到各系列特有的一些较小动态。DFM\
  \ 定义如下：\n\n```\nz_t = P f_t + n_t,\n```\n\n其中 f_t = (f_{1t}, ..., f_{rt})' 是 r 维公共因子向量，P\
  \ = [p_{ij}] 是 k x r 因子载荷矩阵，n_t = (n_{1t}, ..., n_{kt})' 是 k 维特异性系列。两个成分 f_t 和 n_t\
  \ 是独立的。令 p_{i.} 为 P 矩阵的第 i 行（即 1 x r 行向量），则有\n\n```\nz_{it} = p_{i.} f_t + n_{it}.\n\
  ```\n\n令 F 为因子值的 T x r 矩阵，其中第 i 行是 f'_t，令 N 为噪声的 T x k 矩阵。在矩阵表示中，FM 变为\n\n```\n\
  Z = F P' + N.\n```\n\nk x 1 向量 c_t = P f_t = (c_{1t}, ..., c_{kt})' 表示每个系列的共同成分，由\
  \ f_t 中的 r 个未观察到的公共因子生成，在实践中，r << k。在 f_t 和 n_t 均为具有对角协方差矩阵的白噪声过程的特殊情况下，该模型简化为多变量分析中的经典因子模型。\n\
  \n与经典 FM 类似，我们需要对载荷和因子施加条件，以识别 Eq. (6.1) 中的 FM。对于任何可逆的 r x r 矩阵 Q，我们有\n\n```\nc_t\
  \ = P f_t = P Q^{-1} Q f_t \\equiv P^* f_t^*,\n```\n\n其中 P^* = P Q^{-1} 和 f_t^*\
  \ = Q f_t。因此，我们需要固定 P 和 f_t 的标度，并可以在两种方法中选择。第一种方法是要求 \\Gamma_f(0) = E(f_t f_t')\
  \ = I（即 r x r 单位矩阵），与经典 FM 中一样。此要求意味着 \\Gamma_{f^*}(0) 也必须是 r x r 单位矩阵。因此，\n\n```\n\
  I = \\Gamma_{f^*}(0) = E[f_t^* (f_t^*)'] = Q E[f_t f_t'] Q' = Q Q',\n```\n\n这意味着\
  \ Q 是正交矩阵。第二种方法是要求 P'P = I。在此情况下，我们还需要 (P^*)' P^* = I，因此，我们有\n\n```\nI = (P^*)'\
  \ P^* = (Q^{-1})' P' P Q^{-1} = (Q^{-1})' Q' Q^{-1},\n```\n\n\n\n\n\n这意味着 $(QQ')^{-1}\
  \ = I$ 因而 $QQ' = I$。同样，$Q$ 是一个正交归一矩阵。两种方法对 $Q$ 得出了相同的要求。前面的讨论表明，公式 (6.1) 中的动态因子模型尚未被唯一识别。事实上，对于任何\
  \ \\( r \\times r \\) 正交归一矩阵 $Q$，都有\n\n$$z_t = P f_t + n_t = P^* f_t^* + n_t.$$\n\
  \n其中 $P^* = P Q^{-1}$ 且 $f_t^* = Q f'_t$。请注意，\\( r \\times r \\) 正交归一矩阵 $Q$ 具有 $r(r+1)/2$\
  \ 个独立元素，并且它表示 $r$ 维空间中的旋转。\n\n在本章中，我们采用 $P'P = I$ 的条件。由于公共因子 $f_t$ 不可观测（也称为潜在因子），我们进一步假设，不失一般性，$\\\
  Gamma_f(0)$ 是对角矩阵。换句话说，如果需要，我们可以对潜在公共因子 $f_t$ 进行正交化。在上述假设下，动态因子模型在旋转下是可识别的。请注意，用任意正交矩阵旋转不相关因子\
  \ $f_t^* = A f_t$，其中 $A A' = I$ 是正交的，可能导致新因子的协方差矩阵 $E(f_t^{*'} f_t^{*}) = A \\Gamma_f(0)\
  \ A'$ 不一定是对角矩阵。然而，该旋转将保持新载荷矩阵的正交归一条件，因为 $(P^*)' P^* = (A^{-1})' P' P A^{-1} = (A\
  \ A')^{-1} = I$。当然，一旦将识别模型拟合到数据，我们总是可以探索因子的旋转是否会导致更易理解的模型。此外，如前所述，可以始终对 $f_t$ 进行正交化，以便得到的公共因子具有对角协方差矩阵。\n\
  \n除了结构公式 (6.1) 之外，我们还需要指定公共因子和噪声的模型。假设因子是线性平稳序列，可以用 VARMA 模型很好地近似，\n\n$$\\Phi(B)\
  \ f_t = \\Theta(B) a_t, \\quad (6.4)$$\n\n其中 $\\Phi(B) = I - \\Phi_1 B - \\cdots\
  \ - \\Phi_p B^p$ 且 $\\Theta(B) = I - \\Theta_1 B - \\cdots - \\Theta_q B^q$ 并且，为了平稳性和可逆性，行列式方程\
  \ $|\\Phi(B)| = 0$ 和 $|\\Theta(B)| = 0$ 的根位于单位圆外。因子必须具有对角协方差矩阵，并且为简单起见，VARMA 表示\
  \ (6.4) 的所有多项式矩阵都是 \\( r \\times r \\) 对角矩阵，且 \\( a_t \\sim N_r(0, \\Sigma_a) \\\
  )，其中 $\\Sigma_a$ 是对角方差-协方差矩阵，对所有 \\( h \\neq 0 \\) 有 $E(a_t a'_{t-h}) = 0$。此外，我们假设因子与特异噪声不相关，即，对所有\
  \ \\( h = 0, \\pm 1, \\pm 2, \\dots \\) 有 $E(a_t n'_{t-h}) = 0$。\n\n对特异或具体分量 $n_t$\
  \ 通常施加两种假设。在第一种情况下，特异分量只是一个白噪声过程，即 $n_t = e_t$，其中 $e_t$ 是一组均值为零、协方差矩阵为 $\\Sigma_e$\
  \ 的独立同分布随机向量序列。此外，如前所述，$\\{e_t\\}$ 与 $f_t$ 不相关，或者等价地说，$\\{e_t\\}$ 与 $\\{a_t\\}$\
  \ 不相关，即对所有 \\( h = 0, \\pm 1, \\pm 2, \\dots \\) 有 $E(a_t e'_{t-h}) = 0$。在对 $n_t$\
  \ 作此假设下，模型是完全识别的（旋转除外），它被称为精确 DFM 或 EDFM。该模型由 Peña 和 Box (1987) 提出。当 $k$ 较大时，协方差矩阵中的参数个数为\
  \ $k(k+1)/2$，可能大于 $T$，在这种情况下，通常进一步假设 $\\Sigma_e$ 为对角矩阵以提高估计效率。在实际应用中，无论样本量 $T$ 如何，估计噪声项\
  \ $\\hat{n}_t$ 的样本协方差矩阵都是奇异的。\n\n第二种假设适用于高维情况，其中 $k$ 可以趋近于无穷。此时，$n_t$ 可能具有某些弱自相关和截面相关，因此\
  \ $n_t$ 的协方差矩阵的最大特征值相对于公共因子的最小方差来说相对较小。在该假设下，当 $T$ 和 $k$ 都趋于无穷时，动态因子模型是可识别的。得到的模型称为近似\
  \ DFM 或 ADFM。ADFM 甚至允许公共因子与噪声之间存在某些弱交叉相关，只要这些相关性在渐近意义上趋于零。一般来说，为了识别 ADFM，要求当 $k$\
  \ 和 $T$ 较大时，所有自相关或交叉依赖性消失，以便模型在极限上趋近于精确 DFM。我们将在下一节介绍该模型的一些进一步细节。ADFM 由 Geweke (1977)、Chamberlain\
  \ (1983) 和 Chamberlain & Rothschild (1983) 提出，并由 Forni et al (2000)、Stock and Watson\
  \ (2002a, 2002b) 以及 Bai and Ng (2002) 研究。\n\n### 6.1.1 协方差矩阵的性质\n\n对于平稳时间序列，估计动态因子模型所需的可用信息包含在序列的协方差矩阵中。然后，根据公式\
  \ (6.1)，将 \\(\\Gamma_f(h)\\) 和 \\(\\Gamma_n(h)\\) 分别称为因子和噪声的滞后 h 协方差，则有\n\n$$\\\
  Gamma_z(h) = P\\Gamma_f(h)P' + \\Gamma_n(h), \\quad h \\ge 0.\\tag{6.5}$$\n\n这个矩阵方程在研究动态因子模型中起着重要作用。在实践中，必须小心，因为自协方差矩阵取决于标度。如果使用\
  \ $z_t$ 的标准化过程，则结果可能与基于原始标度的结果不同。如同经典因子分析中一样，如果系列不是相同的测量单位，标准化它们可以使结果免受标度效应的影响。当所有系列都在相同的标度时，方差较大的系列对结果的影响较大。因此，根据数据和分析目标，我们可以决定是否应该对观察过程\
  \ $z_t$ 进行标准化。我们建议两者都尝试并比较结果。\n\n#### 6.1.1.1 精确 DFM\n\n在这种情况下，$k$ 是有限的且 $n_t =\
  \ e_t$ 是白噪声，因此公式 (6.5) 给出\n\n$$\\Gamma_z(0) = P\\Gamma_f(0)P' + \\Sigma_e,\\tag{6.6}$$\n\
  \n$$\\Gamma_z(h) = P\\Gamma_f(h)P', \\quad h > 0.\\tag{6.7}$$\n\n由公式 (6.7) 可知，由于\
  \ $P$ 满秩，\\(\\Gamma_z(h)\\) 的秩与 \\(\\Gamma_f(h)\\) 的秩相同。因此，公共因子的数量为 $r = \\max_h\\\
  {\\text{rank}[\\Gamma_z(h)] \\mid h > 0\\}$。因而，检查 $z_t$ 的样本自协方差矩阵的秩可以提供关于公共因子数量的信息。更多细节将在下一节给出。\n\
  \n接下来，由于模型的所有动态依赖都由公共因子 $f_t$ 驱动，进一步假设公共因子的任何线性组合都不是白噪声系列，这似乎是自然的。此外，如果 $f_t$ 的潜在公共因子\
  \ $f_{it}$ 彼此独立，那么对于所有 $h$，\\(\\Gamma_f(h)\\) 都是对角矩阵。因此，根据公式 (6.6) 和 (6.7)，$\\Gamma_z(h)$\
  \ 对所有 $h \\ge 0$ 都是对称的。$z_t$ 的自协方差矩阵的这些特征可用于验证具有独立公共因子的精确 DFM 的存在性。\n\n对公式 (6.6)\
  \ 中特异分量 $n_t$ 的协方差矩阵 $\\Sigma_e$ 作进一步假设，我们有以下两个有趣的情况：\n\n- I. 协方差矩阵 $\\Sigma_e =\
  \ \\sigma^2 I$：用 $P$ 的第 $j$ 列 $p_j$ 右乘公式 (6.6)，并使用 $P'P = I$ 和一些代数运算，我们有\n\n$$\\\
  Gamma_z(0)p_j = (\\gamma_{f_j}^2 + \\sigma^2)p_j,$$\n\n其中 $\\gamma_{f_j}^2$ 是第 $j$\
  \ 个公共因子 $f_{jt}$ 的方差，$1 \\le j \\le r$。因此，在这种情况下，第 $j$ 列 $p_j$ 是 $\\Gamma_z(0)$\
  \ 与特征值 $\\gamma_{f_j}^2 + \\sigma^2$ 相关的特征向量。此外，设 $P_\\perp$ 为 $P$ 在 $R^k$ 中的 $k\
  \ \\times (k-r)$ 正交补，使得 $(P_\\perp)'P = 0$，即一个 $(k-r) \\times r$ 的零矩阵。然后，用 $P_\\\
  perp$ 的第 $j$ 列 $p_j^*$ 右乘公式 (6.6)，我们有\n\n$$\\Gamma_z(0)p_j^* = \\sigma^2 p_j^*,$$\n\
  \n其中 $1 \\le j \\le k - r$。因此，$p_j^*$ 是 $\\Gamma_z(0)$ 与特征值 $\\sigma^2$ 相关的特征向量。基于前面的讨论，我们看到，在这种情况下，$\\\
  Gamma_z(0)$ 与 $r$ 个最大特征值相关的 $r$ 个特征向量构成精确 DFM 的载荷矩阵。\n\n- II. 协方差矩阵 $\\Sigma_e =\
  \ \\text{diag}\\{\\sigma_1^2, \\dots, \\sigma_k^2\\}$。设 $\\sigma^2 = \\max_{1 \\\
  le j \\le k}\\{\\sigma_j^2\\}$ 为噪声的最大方差。我们有\n\n$$\\Sigma_e = \\sigma^2 I + D_0,$$\n\
  \n其中 $D_0 = \\text{diag}\\{\\sigma_1^2 - \\sigma^2, \\dots, \\sigma_k^2 - \\sigma^2\\\
  }$。不失一般性，假设 $\\gamma_{f,r}^2$ 为公共因子 $f_{jt}$（$1 \\le j \\le r$）的最小方差。然后，使用与情况 I\
  \ 相同的方法，我们得到\n\n$$\\Gamma_z(0)p_r = (\\gamma_{f,r}^2 + \\sigma^2)(p_r + \\delta_r),\
  \ \\quad (6.8)$$\n\n其中 $\\delta_r = D_0 p_r / (\\gamma_{f,r}^2 + \\sigma^2)$。由公式\
  \ (6.8) 可知，$p_r$ 不再是 $\\Gamma_z(0)$ 的特征向量，因为 $\\delta_r$ 通常不是零向量。然而，如果 $\\gamma_{f,r}^2$\
  \ 远大于 $\\sigma^2$，则 $\\delta_r$ 会很小甚至可以忽略不计，且 $p_r$ 近似为 $\\Gamma_z(0)$ 与特征值 $\\\
  gamma_{f,r}^2 + \\sigma^2$ 的特征向量。总结来说，设 $\\sigma^2 / \\gamma_{f,r}^2$ 为所研究精确 DFM\
  \ 的噪声信噪比，其中 $\\gamma_{f,r}^2$ 是公共因子的最小方差，$\\sigma^2$ 是噪声的最大方差。那么，只要噪声信噪比 $\\sigma^2\
  \ / \\gamma_{f,r}^2$ 非常小，情况 I 的结果在情况 II 中近似成立。总结来说，如果噪声信噪比较小（或等价地说，信噪比较大），模型会更有用且更容易识别。\n\
  \n\n\n\n\n#### 6.1.1.2 近似 DFM\n\n在这种情况下，模型在有限样本中不可识别，但在某些条件下，当 $k$ 和 $T$ 都趋于无穷大时，可以识别。当\
  \ $n_t$ 具有动态依赖性时，Eq. (6.7) 变为\n\n$$\\Gamma_z(h) = \\mathbf{P}\\Gamma_f(h)\\mathbf{P}'\
  \ + \\Gamma_n(h), \\quad h > 0, \\tag{6.9}$$\n\n前提是 $f_t$ 与 $n_{t-h}$ 不相关。那么，$\\\
  Gamma_z(h)$ 的秩不再提供关于公共因子数量 $r$ 的信息。然而，在与 EDFM 的 Case II 类似条件下，我们仍然可以识别载荷矩阵。如果我们要求\n\
  \n$$\\lim_{k \\to \\infty} \\frac{1}{k^2} \\sum_{i=1}^k \\sum_{j=1}^k |\\gamma_{n,ij}|\
  \ \\to 0, \\tag{6.10}$$\n\n其中 $\\gamma_{n,ij}$ 是 $n_{it}$ 和 $n_{jt}$ 的协方差。这个条件相当强。它意味着噪声分量\
  \ $n_t$ 的自相关和交叉依赖应该很弱，并且当 $k$ 增加时，大多数都为零。有兴趣的读者请参阅 Forni et al. (2000)，以了解对 ADFM\
  \ 识别的仔细研究。\n\n### Example 6.1\n\n为了演示自协方差矩阵如何显示 DFM 的特征，我们考虑 19 个欧元国家的标准化国内生产总值的增长率。原始数据在文件\
  \ `UMEdata20002018.csv` 中，包含 57 个变量和 76 个观测值。数据跨度从 2000 年第一季度到 2018 年第四季度。对于每个国家，有三个经济变量，分别是\
  \ (a) 市场价格国内生产总值 (GDP)、(b) 最终消费支出 (CON) 和 (c) 毛固定资本形成 (INV)。\n\n为了平稳性，我们考虑 GDP 序列的增长率。因此，在本示例中，19\
  \ 维的 GDP 增长率序列为 $z_t = \\nabla \\log(\\text{GDP}_t)$。图 6.1 显示了该序列 $z_t$ 的时间图。从图中可以明显看出，正如预期的那样，所有\
  \ 19 个经济体都受到了 2008 年金融危机的影响。该图还表明，一些国家在 2013 年左右经历了负增长。我们对 $h = 0, \\dots, 4$ 的\
  \ $\\widehat{\\Gamma}_z(h)$ 进行特征值-特征向量分析。除了协方差矩阵外，滞后自协方差矩阵不是对称的，因此其特征值（和特征向量）可能包含复数。我们的目标是展示样本自协方差矩阵所表现出的模式的一致性，并且这些模式为对\
  \ 19 个 GDP 增长率序列使用 DFM 提供了一些依据。\n\n表 6.1 提供了 $h = 0, \\dots, 4$ 时 $\\widehat{\\\
  Gamma}_z(h)$ 的四个最大特征值的绝对值。从表中可以清楚地看出，对于所有考虑的 $h$，第一个特征值占主导地位，并且其值随着 $h$ 增加而减少。更有趣的是，第一个特征值是实数。各种滞后\
  \ $h$ 下第一个特征值的主导性质表明，系统中至少存在一个公共因子，即 $r = 1$。\n\n### TABLE 6.1 2000.II 至 2018.IV\

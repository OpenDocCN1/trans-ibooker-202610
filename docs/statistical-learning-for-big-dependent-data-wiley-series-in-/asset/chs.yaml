  ,plot=TRUE)\n[1] 5\n```\n\n## 7.6 提升法\n\n提升算法最初被提出作为集成方法，即结合多个模型（或方法）的预测以获得最优预测的方法。提升的基本思想是从调整后的数据生成多个预测，然后使用线性组合或多数投票将其聚合，以构建最终的估计器或预测。它类似于模型平均。关于提升的良好参考文献是\
  \ Bühlmann 和 van de Geer (2011, 第 12 章) 以及 Hastie 等人 (2009)。Friedman 等人 (2000) 和\
  \ Friedman (2001) 发展了一个更一般的统计框架，将提升直接解释为函数估计的统计方法。\n\n给定数据 \\(\\{(\\mathbf{x}_t,\
  \ y_t) | t = 1, \\dots, n\\}\\)，提升包含两个关键要素。第一个要素称为 *弱学习器*，这是一种易于计算的统计预测方法。弱学习器的示例包括简单回归树或简单线性回归。第二个要素是一种数据调整方法，其中要拟合的变量在每次迭代中进行调整，这种调整通常取决于弱学习器。考虑模型\n\
  \n```\n\\(y_t = f(\\mathbf{x}_t) + \\epsilon_t,\\)  \\(\\text{(7.46)}\\)\n```\n\n\
  其中 \\(\\epsilon_t\\) 是误差项，\\(f(.)\\) 是感兴趣的未知实值函数。提升算法的工作流程如下：\n\n- 调整后的数据 1 \\(\\\
  rightarrow\\) weak learner \\(\\hat{f}^{(1)}(.)\\)\n- 调整后的数据 2 \\(\\rightarrow\\\
  ) weak learner \\(\\hat{f}^{(2)}(.)\\)\n- \\(\\vdots \\quad \\vdots\\)\n- 调整后的数据\
  \ \\(r\\rightarrow\\) weak learner \\(\\hat{f}^{(r)}(.)\\)\n\n其中 \\(r\\) 是预先指定的正整数。然后，聚合结果为\n\
  \n\\(\\text{聚合} : \\hat{f}_A = \\sum_{i=1}^r \\alpha_i \\hat{f}^{(i)}(.), \\quad\
  \ (7.47)\\)\n\n其中 \\(\\alpha_i\\) 是合适的系数或权重。显然，弱学习器的选择、迭代次数以及权重 \\(\\alpha_i\\)\
  \ 的选择是提升在应用中发挥作用的重要问题。\n\n从数学角度来看，为了估计方程 (7.46) 中的函数 \\(f(.)\\)，我们通常采用适当的损失函数，并在某个可测函数空间上对其进行最小化。即，\n\
  \n\\(f_o(.) = \\text{arg min}_{f \\in S} E[L(f(X), y)] \\quad (7.48)\\)\n\n其中 \\\
  (S\\) 表示一个可测函数空间，\\(L(f(.), y)\\) 是一个假设对 \\(f(.)\\) 可微且凸的损失函数。对于平方误差损失，\\(L(f(.),\
  \ y) = (y - f(.))^2\\)，相关的总体最小化器是 \\(f_o(x) = E[Y|X=x]\\)。\n\nFriedman (2001) 提出了一种函数梯度下降（FGD）算法来估计\
  \ \\(f(.)\\)。该算法如下：\n\n### FGD 算法：\n\n- 1. 初始化 \\(\\hat{f}^{(0)}(.)\\)，例如 \\(\\\
  hat{f}^{(0)}(.) \\equiv 0\\) 或\n\n\\(\\hat{f}^{(0)} = \\text{arg min}_c \\frac{1}{n}\
  \ \\sum_{i=1}^n L(c, y_i).\\)\n\n设置 \\(r=0\\)。\n\n- 2. 将 \\(r\\) 增加 1，即 \\(r \\\
  leftarrow r+1\\)。通过计算负梯度 \\(-\\frac{dL(f,y)}{df}\\) 并在 \\(\\hat{f}^{(r-1)}(x_t)\\\
  ) 处对其求值来生成一组新的响应变量。即，计算\n\n\\(v_t = -\\frac{\\partial L(f, y_t)}{\\partial f} |_{f=\\\
  hat{f}^{(r-1)}(x_t)}, \\quad t=1, \\dots, n.\\)\n\n- 3. 使用解释变量 \\(x_1, \\dots, x_n\\\
  ) 通过弱学习器拟合新的响应变量 \\(v_1, \\dots, v_n\\)，即\n\n\\((x_t, v_t) \\rightarrow \\text{弱学习器\
  \ } g^{(r)}(.).\\)\n\n- 4. 更新 \\(\\hat{f}^{(r)}(.) = \\hat{f}^{(r-1)}(.) + \\delta\
  \ \\times \\hat{g}^{(r)}(.),\\) 其中 \\(0 < \\delta \\le 1\\) 是步长参数。\n\n- 5. 重复步骤\
  \ 2 到 4，直到 \\(r = r_o\\)，其中 \\(r_o\\) 是预先指定的正整数。\n\n\n\n\n对于独立数据，\\( r_o \\) 可通过\
  \ CV 选择。结果表明，\\( r_o \\) 的选择在上述 FGD 算法中很重要。另一方面，只要步长 \\( \\delta \\) 很小，其选取并不关键。在以下内容中，我们关注\
  \ \\( \\ell_2 \\) boosting，因为我们的主要关注点是预测。\n\n### 7.6.1 \\( \\ell_2 \\) Boosting\n\
  \n假设 Eq. (7.46) 中的函数 \\( f(\\mathbf{x}_t) \\) 为线性，因此我们得到一个线性回归问题。此时 \\( \\ell_2\
  \ \\) boosting 是一种有用的算法，特别是当 \\( \\mathbf{x}_t \\) 的维度较大时。在这里，将平方误差损失函数修改为 \\( L(f,\
  \ y) = \\frac{1}{2}(y - f)^2 \\) 比较方便，其负梯度就是回归残差。将 FGD 算法应用于这个高维线性回归问题，我们得到以下 \\\
  ( \\ell_2 \\) boosting 算法：\n\n*\\( \\ell_2 \\) Boosting 算法：*\n\n- 1. 初始化 \\( \\\
  hat{f}^{(0)}(.) = \\bar{y} \\) 并设置 \\( r = 0 \\)。\n- 2. 将 \\( r \\) 增加 1。即，\\( r\
  \ \\leftarrow r + 1 \\)。计算残差\n  \\( v_t = y_t - \\hat{f}^{(r-1)}(\\mathbf{x}_t),\
  \ \\quad t = 1, \\dots, n \\)。\n- 3. 使用弱学习器将残差 \\( v_1, \\dots, v_n \\) 拟合到 \\(\
  \ \\mathbf{x}_1, \\dots, \\mathbf{x}_n \\)：\n  \\( (\\mathbf{x}_t, v_t) \\rightarrow_{\\\
  text{弱学习器}} \\hat{g}^{(r)}(.) \\)。\n- 4. 更新 \\( \\hat{f}^{(r)}(.) = \\hat{f}^{(r-1)}(.)\
  \ + \\delta \\times \\hat{g}^{(r)}(.) \\)，其中 \\( 0 < \\delta \\le 1 \\)。\n- 5. 重复步骤\
  \ 2 到 4，直到 \\( r = r_o \\)，即预设的正整数迭代次数。\n\n得到的估计量为\n\n\\(\\hat{f}^{(r_o)}(.) = \\\
  delta \\sum_{r=1}^{r_o} \\hat{g}^{(r)}(.) + \\hat{f}^{(0)}(.).\\) (7.49)\n\n因此，boosting\
  \ 估计量 \\( \\hat{f}^{(r_o)}(.) \\) 的性质由 \\( \\hat{g}^{(r)}(.) \\) 的性质决定，而 \\( \\\
  hat{g}^{(r)}(.) \\) 是弱学习器的估计量。有必要讨论弱学习器的选择并研究 \\( \\hat{g}^{(r)}(.) \\) 的性质。\n\n\
  ### 7.6.2 弱学习器的选择\n\n在选择弱学习器时，需要考虑的一个重要因素是计算的简便性。文献中已提出几种常用的弱学习器，包括用于（广义）线性模型的分量线性最小二乘法、用于加性模型的分量平滑样条，以及回归树或分类树。参见\
  \ Bühlmann 和 van de Geer (2011, 第 12 章)。这里我们使用分量线性最小二乘法。我们的数据集是 \\(\\{(\\mathbf{x}_t,\
  \ y_t)|t = 1, \\dots, n\\}\\)，假设其满足通常的假设，例如独立性、同方差性和 \\( E(y_t|\\mathbf{x}_t) =\
  \ \\sum_{i=1}^k \\beta_i x_{ti} \\)。对于每次 boosting 迭代，数据集是 \\(\\{(x_t, v_t)|t = 1,\
  \ \\dots, n\\}\\)，\\(\\hat{g}^{(r)}(.)\\) 由以下公式给出：\n\n\\(\\hat{g}^{(r)}(x_t) = \\\
  hat{y}_{j_r} x_{j_t}, \\quad \\hat{y}_j = \\frac{\\sum_{t=1}^n x_{jt} v_t}{\\sum_{t=1}^n\
  \ x_{jt}^2}, \\quad \\hat{j}_r = \\arg \\min_{1 \\le j \\le k} \\sum_{t=1}^n (v_t\
  \ - \\hat{y}_j x_{jt})^2. \\quad (7.50)\\)\n\n换句话说，在每次迭代中，我们在简单线性回归框架内选择最佳预测器，并使用其系数估计值\
  \ \\(\\hat{y}_j\\)。这与线性回归分析中变量选择的常规前向过程类似。\n\n上述弱学习器的模型拟合为\n\n\\(\\hat{f}^{(r)}(x_t)\
  \ = \\hat{f}^{(r-1)}(x_t) + \\delta \\times \\hat{y}_{j_r} x_{t,j_r},\\)\n\n其中 \\\
  (\\hat{j}_r\\) 定义于 Eq. (7.50)。就系数估计而言，我们有\n\n\\(\\hat{\\beta}_j^{(r)} = \\begin{cases}\
  \ \\hat{\\beta}_j^{(r-1)} + \\delta \\times \\hat{y}_{j_r}, & \\text{if } j = \\\
  hat{j}_r, \\\\ \\hat{\\beta}_j^{(r-1)}, & \\text{if } j \\neq \\hat{j}_r. \\end{cases}\\\
  )\n\n因此，在第 \\( r \\) 次迭代中，只有 \\(\\hat{j}_r\\) 第个预测器的系数估计值会被更新。显然，使用分量线性最小二乘法弱学习器的\
  \ \\( \\ell_2 \\) boosting 在每次 boosting 迭代 \\( r \\) 都会产生线性模型拟合。文献中已推导出此类用于高维线性回归的\
  \ \\( \\ell_2 \\) boosting 算法的渐近一致性。例如，参见 Bühlmann 和 van de Geer (2011) 的定理 12.2。\n\
  \nBai 和 Ng (2009) 将此算法应用于第 7.4 节中 PCR 和 DI 模型因子的选择。他们比较了两种通过 boosting 计算最终预测器的方法。在第一种情况中，他们将变量的滞后项视为其他任何变量，并使用简单回归来评估其预测。在第二种情况中，他们将所有滞后项一起考虑，并使用多元回归来计算其预测。他们的结果表明，这两种方法中哪种更好取决于未知的数据生成过程。\n\
  \n### 示例 7.8\n\nR 中有多个可用于进行 boosting 的包。在我们的演示中，我们使用 **gbm** 包。**caret** 包也可用。这些包使用基于树的方法，将在下一章中讨论。这里只需说明，回归树由预测器空间的某些划分组成。划分是按顺序进行的，每个划分使用一个选定的预测器和一个阈值。变量和阈值的选择旨在最小化预测器空间每个子区域内残差平方误差之和。\n\
  \n为了说明 boosting，我们将 \\( \\ell_2 \\) boosting 应用于示例 7.5-7.7 的月度宏观经济数据。由于这是一个回归问题，我们在\
  \ `gbm` 命令中使用子命令 `distribution='gaussian'`。首先，我们使用 10000 棵树，`interaction.depth`=1（这将树限制为只能进行一次分割），来建模\
  \ IPI 的增长率。此外，我们采用一个小的 \\( \\delta = 0.001 \\)。使用五倍交叉验证，该算法进行了 9994 次迭代以达到最小 CV\
  \ 误差 \\( 6.50 \\times 10^{-3} \\)。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_422_0.png)\n\
  \n图 7.25 \\( \\ell_2 \\) boosting 算法五倍交叉验证结果。数据由月度宏观经济变量组成。因变量是 IPI 的月度增长率，预测变量是所有可用的\
  \ 122 个变量的滞后 1 到滞后 6 项。左图对应 10000 棵树且交互深度为 1，右图对应 5000 棵树且深度为 3。\n\n请参见图 7.25 的左图。在\
  \ 732 个预测变量中，boosting 算法识别出 485 个具有非零影响的变量。其次，我们使用 5000 棵树且 `interaction.depth`=3（这同样限制了树的大小）来建模\
  \ IP 增长率。使用的收缩率为 0.01。请参见图 7.25 的右图。在此特定情况下，CV 选择了 1848 次迭代，CV 误差为 \\( 6.29 \\times\
  \ 10^{-3} \\)。现在，在 732 个预测变量中，有 682 个变量具有非零影响。\n\n最后，我们使用 SLBDD 包中的 `tsBoost` 命令，该命令使用简单线性回归作为弱学习器。使用\
  \ \\( \\delta = 0.01 \\) 和 5000 次迭代，程序选择了 124 个预测变量。图 7.26 显示了 IPI 月度增长率及 \\( \\\
  ell_2 \\) boosting 拟合值的时间图。从图中可以看出，boosting 算法效果良好，因为它能很好地描述 IP 增长率的行为。图 7.27 显示了\
  \ IP 增长率的样本自相关性和 boosting 拟合的残差。显然，残差没有显著序列相关的迹象。在此特定应用中，如预期，简单线性回归似乎是弱学习器的一个良好选择。\n\

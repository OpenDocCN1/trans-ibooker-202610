  >EVS0=S0$vectors[,2]\n>S1=eigen(out$acf[2,,])\n>S1$values[1:4] # May have complex\
  \ eigenvalues\n>Mod(S1$values[1:4])\n>E1=S1$values[1:4]\n>EV1=S1$vectors[,1]\n>EVS1=S1$vectors[,2]\n\
  ......\n>EVf=cbind(EVF0,EVF1,EVF2,EVF3)\n>EVS=cbind(EVS0,EVS1,EVS2,EVS3) # Not shown\n\
  >ts.plot(EVF)\n>EVF=cbind(-EVF0,EVF1,EVF2,-EVF3) # Change some signs\n>ts.plot(EVF)\
  \ # re-plot.\n```\n\n### 6.1.2 动态因子和 VARMA 模型\n\nEq. (6.1) 的 EDFM，其中 $n_t$ 为白噪声，意味着观测序列的\
  \ $k-r$ 个线性组合是白噪声，$r$ 个线性组合包含所有动态。令 $P^\\perp$ 为满足 $(P^\\perp)'P = 0$ 的 $k \\times\
  \ (k-r)$ 矩阵。那么， $k-r$ 个线性组合 $y_{1t} = (P^\\perp)'z_t$ 是白噪声，而 $r$ 个线性组合\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_320_0.png)\n\
  \n图 6.2 19 个欧元国家 GDP 增长率自协方差矩阵前几个特征值的载荷，滞后 0 到滞后 3。\n\n$y_{2t} = P'z_t$ 包含公共因子。Hu\
  \ (2005) 证明了相反也是成立的。也就是说，考虑 $z_t$ 的 VAR($p$) 模型\n\n$$z_t = \\sum_{i=1}^p \\Phi_i\
  \ z_{t-i} + a_t,$$\n\n如果我们能找到一个 $k \\times k$ 矩阵 $G$，使得 $y_t = Gz_t$ 满足模型\n\n$$y_t\
  \ = \\sum_{i=1}^p \\Phi_i^* y_{t-i} + a_t^*,$$\n\n其中 $\\Phi_i^* = G\\Phi_i G^{-1}$\
  \ 且 $\\Sigma_a^* = G\\Phi_i G'$，并且这个新序列 $y_t$ 可以分区为 $y_t' = (y_{1t}', y_{2t}')'$，其中\
  \ $y_{1t}$ 是 $(k-r)$ 维白噪声过程且 $y_{2t}$ 遵循 VAR($p$) 模型，那么 $z_t$ 遵循 Eq. (6.1) 中的 DFM。\n\
  \n接下来，Box and Tiao (1977) 和 Tiao and Tsay (1989) 研究了简化遵循 VARMA 模型的时间序列向量动态的方法。如第\
  \ 3 章所示，Box and Tiao (1977) 提出搜索线性组合 $v_t = C'z_t$，其元素根据其可预测性排列。从\n\n$$z_t = \\\
  widehat{z}_{t-1}(1) + e_t, \\quad \\text{(6.11)}$$\n\n并令 $\\Gamma_p(1) = E\\{\\\
  widehat{z}_{t-1}(1)\\widehat{z}'_{t-1}(1)\\}$，我们有 $\\Gamma_z(0) = \\Gamma_p(1) +\
  \ \\Sigma_\\epsilon$，并且在第 3.5.2 节中显示了最大可预测性的线性组合由矩阵\n\n$$M = \\Gamma_z^{-1}(0)\\\
  Gamma_p(1).$$\n\n的最大特征值给出。假设 EDFM，并从 Eq. (6.6)，我们有 $\\Gamma_p(1) = P\\Gamma_f(0)P'$。因此，最大可预测性的线性组合由矩阵\n\
  \n$$M = \\Gamma_z^{-1}(0)P\\Gamma_f(0)P',$$\n\n对应的最大特征值的特征向量给出，其秩为 $r$。然后，\n\n$$MP\
  \ = \\Gamma_z^{-1}(0)P\\Gamma_f(0).$$\n\n为简化起见，假设 $\\Sigma_\\epsilon = \\sigma^2\
  \ I$，并使用 $\\Gamma_f(0) = \\text{diag}\\{\\gamma_{f,1}^2, \\dots, \\gamma_{f,r}^2\\\
  }$ 和矩阵反演公式\n\n$$(A + BDB')^{-1} = A^{-1} - A^{-1}B(B'A^{-1}B + D^{-1})^{-1}B'A^{-1},$$\n\
  \n经过一些代数运算，我们可以得到\n\n$$\\Gamma_z^{-1}(0)P = [\\sigma^2 I + P\\Gamma_f(0)P']^{-1}P\
  \ = P[\\sigma^2 I + \\Gamma_f(0)]^{-1} = PV,$$\n\n其中 $V$ 是一个对角矩阵，其第 $j$ 个对角元素为 $(\\\
  gamma_{f,j}^2 + \\sigma^2)^{-1}$，其中 $\\gamma_{f,j}^2$ 是 $f_{jt}$ 的方差。因此，由于 $MP =\
  \ PV\\Gamma_f(0) = PD$，其中 $D$ 是一个对角矩阵，其元素为 $\\gamma_{f,j}^2/(\\gamma_{f,j}^2 + \\\
  sigma^2)$，最大可预测性方向由 $P$ 矩阵中对应于方差最大的因子的列给出。\n\n\n\n\n\n这为 EDFM 与 Box 和 Tiao (1977)\
  \ 的工作提供了直接联系。如在第 3 章中所述，Tiao 和 Tsay (1989) 通过标量分量模型引入了 VARMA 模型的简化，这些模型是具有特定动力学的观测时间序列的线性组合。特别是，SCM(0,0)\
  \ 是一个白噪声过程，在 EDFM 下，白噪声线性组合的数量，即 SCM(0,0) 的数量，为 $k - r$。因此，SCM(0,0) 模型也与 EDFM 相关联。\n\
  \nPeña 和 Box (1987) 证明，如果系列 $z_t$ 遵循 Eq. (6.1) 中的 DFM，且因子由 VARMA($p_1, q_1$) 过程给出，则该系列也遵循\
  \ VARMA($p_2, q_2$) 过程，其中 $p_1 = p_2$ 且 $q_2 = \\max(p_1, q_1)$。然而，系列 $z_t$ 的 VARMA($p_2,\
  \ q_2$) 表示的参数矩阵无法识别，这可能使 VARMA 模型的估计变得困难和不稳定。\n\n## 6.2 将平稳 DFM 拟合到数据\n\n给定数据 $\\\
  {z_1, \\dots, z_T\\}$，其中 $z_t = (z_{t1}, \\dots, z_{tk})'$，为简化起见，假设每个系列 $z_{it}$\
  \ 都已进行均值调整。令 $\\mathbf{Z}$ 为 $T \\times k$ 数据矩阵，其中 $\\mathbf{Z}' = [z_1, \\dots,\
  \ z_T]$。则 $\\hat{\\mathbf{F}}_z(h) = \\sum_{t=h+1}^T z_t z_{t-h}' / T$，特别是 $\\hat{\\\
  mathbf{F}}_z(0) = \\mathbf{Z}'\\mathbf{Z} / T$。在本节中，我们讨论估计 $k \\times r$ 载荷矩阵 $\\\
  mathbf{P}$、$T \\times r$ 公共因子矩阵 $\\mathbf{F}$ 以及因子和噪声模型参数的不同程序。我们从公共因子数量 $r$ 已知的情况开始，然后讨论选择\
  \ $r$ 的方法。\n\n在本节中，我们假设 $T > k$。$T \\le k$ 的情况将在第 6.10 节中讨论，在那里我们采用不同的公式，并使用投影 PCA\
  \ 来提高估计公共因子的效率。\n\n### 6.2.1 主成分 (PC) 估计\n\n在某些条件下，EDFM 和 ADFM 的一致估计可以通过样本协方差矩阵\
  \ $\\hat{\\mathbf{F}}_z(0)$ 的特征值-特征向量分析获得。在给定 $r$ 的情况下，载荷矩阵 $\\mathbf{P}$ 通过与最大\
  \ $r$ 个特征值对应的 $\\hat{\\mathbf{F}}_z(0)$ 的归一化特征向量来估计。将估计值记为 $\\hat{\\mathbf{P}}$，由于\
  \ $\\hat{\\mathbf{F}}_z(0)$ 在 $T > k$ 时是对称正定的，因此有 $\\hat{\\mathbf{P}}'\\hat{\\mathbf{P}}\
  \ = \\mathbf{I}$。然后潜在因子通过 $\\hat{f}_t = \\hat{\\mathbf{P}}' z_t$ 估计，即数据矩阵 $\\mathbf{Z}$\
  \ 的前 $r$ 个主成分。注意，在 (6.1) 中左乘 $\\hat{\\mathbf{P}}'$，我们有\n\n$\\hat{\\mathbf{P}}' \\\
  mathbf{z}_t = \\hat{\\mathbf{P}}' \\mathbf{P} \\mathbf{f}_t + \\hat{\\mathbf{P}}'\
  \ \\mathbf{n}_t$\n\n并且，对于固定 $k$，$\\hat{\\mathbf{P}}$ 将在 $T \\to \\infty$ 时收敛到 $\\\
  mathbf{P}$。因此，我们近似有 $\\hat{\\mathbf{P}}'\\hat{\\mathbf{P}} = \\mathbf{I}$。对于 EDFM，噪声\
  \ $n_t$ 是白噪声，线性组合 $\\hat{\\mathbf{P}}' n_t$ 是零均值变量，其样本均值将随着 $T$ 的增加通过大数定律收敛到零。对于\
  \ ADFM，对噪声和 $f_t$ 的结构施加了适当条件，使得 $\\hat{\\mathbf{F}}_z(0)$ 的特征向量继续提供载荷和因子 $\\hat{f}_t\
  \ = \\hat{\\mathbf{P}}' z_t$ 的一致估计。参见 Bai and Ng (2002, 2013)。\n\n正式地，我们希望找到一个 \\\
  (k \\times r\\) 矩阵 \\(\\widehat{\\boldsymbol{P}}\\) 和一个 \\(T \\times r\\) 因子矩阵 \\\
  (\\widehat{\\boldsymbol{F}}\\)，其中 \\(\\widehat{\\boldsymbol{F}}' = [\\widehat{f}_1,\
  \ \\dots, \\widehat{f}_T]\\)，以最小化\n\n\\(\\text{MSE}(\\boldsymbol{P}, \\boldsymbol{F})\
  \ = \\frac{1}{kT} \\sum_{t=1}^T (z_t - \\boldsymbol{P} f_t)'(z_t - \\boldsymbol{P}\
  \ f_t),\\quad (6.12)\\)\n\n在限制条件 \\(\\widehat{\\boldsymbol{P}}'\\widehat{\\boldsymbol{P}}\
  \ = \\boldsymbol{I}\\) 和 \\(\\widehat{\\boldsymbol{F}}'\\widehat{\\boldsymbol{F}}\
  \ = \\boldsymbol{D}$ 下，其中 \\(\\boldsymbol{D}$ 是正定对角矩阵。然后\n\n\\(\\frac{\\partial\
  \ \\text{MSE}(\\boldsymbol{P}, \\boldsymbol{F})}{\\partial f_t} = -2\\widehat{\\\
  boldsymbol{P}}' z_t + 2\\widehat{\\boldsymbol{P}}'\\widehat{\\boldsymbol{P}}\\widehat{f}_t\
  \ = \\boldsymbol{0},\\)\n\n并施加限制 \\(\\widehat{\\boldsymbol{P}}'\\widehat{\\boldsymbol{P}}\
  \ = \\boldsymbol{I}\\)，我们有\n\n\\(\\widehat{f}_t = \\widehat{\\boldsymbol{P}}' z_t,\\\
  quad (6.13)\\)\n\n并且\n\n\\(\\frac{\\partial \\text{MSE}(\\boldsymbol{P}, \\boldsymbol{F})}{\\\
  partial \\boldsymbol{P}'} = -2 \\sum_{t=1}^T z_t \\widehat{f}_t' + 2 \\widehat{\\\
  boldsymbol{P}} \\sum_{t=1}^T \\widehat{f}_t \\widehat{f}_t' = \\boldsymbol{0},\\\
  )\n\n在限制条件 \\(\\widehat{\\boldsymbol{F}}'\\widehat{\\boldsymbol{F}} = \\sum_{t=1}^T\
  \ \\widehat{f}_t \\widehat{f}_t' = \\boldsymbol{D}$ 下，并使用 Eq. (6.13)，我们有 $\\boldsymbol{Z}'\\\
  boldsymbol{Z}\\widehat{\\boldsymbol{P}} = \\widehat{\\boldsymbol{P}}\\boldsymbol{D}$，$\\\
  widehat{\\boldsymbol{P}}$ 的列（记为 $\\widehat{p}_{\\cdot j}$）必须满足\n\n\\(\\widehat{\\\
  boldsymbol{\\Gamma}}_z(0)\\widehat{p}_{\\cdot j} = \\lambda_j \\widehat{p}_{\\cdot\
  \ j}.\\quad (6.14)\\)\n\n因此，$\\widehat{\\boldsymbol{P}}$ 的列是对应于 $\\widehat{\\boldsymbol{\\\
  Gamma}}_z(0)$ 最大 $r$ 个特征值的特征向量。不难看出\n\n\\(\\text{MSE}(\\widehat{\\boldsymbol{P}},\
  \ \\widehat{\\boldsymbol{F}}) = \\sum_{j=1}^r \\lambda_j,\\)\n\n因此，我们选择矩阵 $\\widehat{\\\
  boldsymbol{\\Gamma}}_z(0)$ 的 $r$ 个最大特征值。第 1 章对主成分进行了类似的分析。\n\nStock and Watson (2002a,\
  \ 2002b) 和 Bai and Ng (2002) 证明，当 $k$ 和 $T$ 都趋于无穷大且噪声的弱自相关和交叉相关时，PC 估计是一致的。然而，正如我们稍后所见，当\
  \ $c = \\lim_{T,k \\to \\infty} k/T$ 大于 1 时（即 $k > T$），无法获得一致性。关于特殊分量结构的条件可以稍微推广，允许自相关和交叉相关依赖于\
  \ $t$，然后对所有 $t$ 取上确界。此外，噪声的分布必须满足一些广泛条件才能证明一致性。\n\n一旦因子被估计，特殊分量就可以计算为 $\\widehat{n}_t\
  \ = (\\boldsymbol{I} - \\widehat{\\boldsymbol{P}}\\widehat{\\boldsymbol{P}}')z_t$，我们可以对每个分量\
  \ $n_{it}$ 估计标量自回归移动平均 (ARMA) 模型。注意，估计的噪声是维度为 $k - r$ 的线性空间中的 $k \\times 1$ 向量，因为其中有\
  \ $r$ 个线性组合必须等于零，即 $\\widehat{\\boldsymbol{P}}'\\widehat{n}_t = (\\widehat{\\boldsymbol{P}}'\
  \ - (\\widehat{\\boldsymbol{P}}'\\widehat{\\boldsymbol{P}})\\widehat{\\boldsymbol{P}}')z_t\
  \ = 0$。将 $\\widehat{\\boldsymbol{N}}' = [\\widehat{n}_1, \\dots, \\widehat{n}_T]$\
  \ 称为估计噪声矩阵，估计的噪声协方差矩阵 $\\widehat{\\boldsymbol{\\Gamma}}_n(0) = \\boldsymbol{N}'\\\
  boldsymbol{N}/T$ 是奇异的。然而，其对角元素（即噪声方差）可以通过 $\\sum_{t=1}^T \\hat{\\eta}_{it}^2 / T$\
  \ 估计。注意，由 Eq. (6.6)，\n\n$$\\sum_{i=1}^k \\gamma_{z_i}(0) = \\sum_{j=1}^r \\gamma_{f_j}(0)\
  \ + \\sum_{i=1}^k \\gamma_{\\eta_i}(0),$$\n\n噪声方差之和等于系列方差之和减去因子方差之和。\n\n因子的模型也通过每个因子时间序列\
  \ $\\hat{f}_{it}$ 的单变量分析得到。\n\n### 6.2.2 汇总 PC 估计器\n\n对于 EDFM，Peña 和 Box (1987)\
  \ 提出的一种比 PCA 更高效的估计可以通过汇总滞后自协方差矩阵的信息来获得。这些矩阵的性质表明，我们可以通过汇总数据估计的滞后自协方差矩阵中与最大特征值相关的\
  \ $r$ 个特征向量来估计 \\(P\\)。这可以通过形成汇总矩阵来实现\n\n$$C = \\sum_{i=1}^{h_0} \\hat{\\Gamma}_z(h),$$\n\
  \n其中 \\(h_0\\) 是一个预设的正整数，并计算 \\(C\\) 对应于最大 \\(r\\) 个特征值的特征向量以形成矩阵 $\\hat{P}$。然而，由于估计的矩阵\
  \ $\\hat{\\Gamma}_z(h)$ 不一定是对称的，它们可能具有复数特征值。Lam et al. (2011) 提出的一个更好的替代方案是使用一个与\
  \ $\\hat{\\Gamma}_z(h)$ 具有相同特征向量的对称矩阵。定义\n\n$$L = \\sum_{i=1}^{h_0} \\hat{\\Gamma}_z(h)\\\
  hat{\\Gamma}_z(h)'. \\quad (6.15)$$\n\n并使用对应于最大 \\(r\\) 个特征值的 \\(L\\) 的特征向量来估计载荷和因子。如第\
  \ 6.2.1 节所示的协方差矩阵的特性表明，汇总信息不仅在噪声为白噪声时有用，而且在噪声存在异方差或具有相似自相关结构时也有用。有关使用矩阵 (6.15) 估计因子的优势，请参见\
  \ Lam et al. (2011)、Chan et al. (2017)、Gao 和 Tsay (2019) 以及 Caro 和 Peña (2020)。\n\
  \n### 6.2.3 广义 PC 估计器\n\n在异质性情况下，噪声分量的方差各不相同，可以使用广义最小二乘法来提高估计效率。目标函数变为\n\n$$\\text{MSE}(P,\
  \ F) = \\frac{1}{kT} \\sum_{t=1}^T (z_t - P f_t)' \\Sigma_n^{-1} (z_t - P f_t).\
  \ \\quad (6.16)$$\n\n\n\n\n\nAs \\(\\Sigma_n^{-1}\\) is unknown, the minimization\
  \ of Eq. (6.16) is usually carried out in two steps. First, the estimators in Eqs.\
  \ (6.13) and (6.14) are used to compute \\(\\hat{\\boldsymbol{n}}_t = (\\boldsymbol{I}\
  \ - \\hat{\\boldsymbol{P}}\\hat{\\boldsymbol{P}}')\\boldsymbol{z}_t\\). As mentioned\
  \ before, estimating the noise covariance matrix with \\(\\hat{\\boldsymbol{n}}_t\\\
  ) results in a singular matrix, because the idiosyncratic space is of dimension\
  \ \\(k - r\\). However, assuming that \\(\\Sigma_n\\) is diagonal, the variances,\
  \ \\(\\{\\sigma_i^2\\}\\), can be estimated using each component \\(n_{it}\\). By\
  \ transforming the variables in Eq. (6.16) by \\(\\boldsymbol{z}_t^* = \\hat{\\\
  Sigma}_n^{-1/2} \\boldsymbol{z}_t = \\{z_{it}/\\hat{\\sigma}_i, i = 1, \\dots, k\\\
  }\\) and letting \\(\\boldsymbol{P}^* = \\hat{\\Sigma}_n^{-1/2} \\boldsymbol{P}\\\
  ), we have the standard least squares problem with homoscedastic variables. We can\
  \ then apply PCA to the new variables \\(\\boldsymbol{z}_t^*\\) to obtain a new\
  \ loading matrix \\(\\hat{\\boldsymbol{P}}^*\\) that verifies \\(\\boldsymbol{P}^*\
  \ = \\hat{\\Sigma}_n^{-1/2} \\boldsymbol{P}\\). To obtain the original loading matrix\
  \ for the observed variables, we can transform with \\(\\hat{\\boldsymbol{P}} =\
  \ \\hat{\\Sigma}_n^{1/2} \\hat{\\boldsymbol{P}}^*\\). Unless there exist large differences\
  \ among the variances of the noises, the advantage of using generalized least squares\
  \ is usually small. A second simple alternative is to estimate the covariance matrix\
  \ associated with common factors by \\(\\hat{\\Gamma}_c(0) = \\hat{\\Gamma}_z(0)\
  \ - \\hat{\\Sigma}_n\\), and then compute the PCs of \\(\\hat{\\Gamma}_c(0)\\).\
  \ A more efficient and complex two step procedure has been proposed by Breitung\
  \ and Tenhofen (2011).\n\n### 6.2.4 ML 估计\n\nThe ML estimation requires some assumptions\
  \ on the distribution of the observed time series. Often, \\(\\boldsymbol{z}_t\\\
  ) is supposed to be Gaussian and two ML estimation approaches have been proposed.\
  \ The first one is an extension of the classical FM and assumes that \\(f_t\\) is\
  \ a random variable with zero mean and covariance matrix \\(\\Gamma_f(0)\\), but\
  \ has no dynamics. That is, \\(f_t\\) is uncorrelated with its past values. Then,\
  \ \\(\\boldsymbol{z}_t\\) is \\(N_k(0, \\Gamma_z(0))\\) with \\(\\Gamma_z(0) = \\\
  boldsymbol{P}\\Gamma_f(0)\\boldsymbol{P}' + \\Sigma_e\\). In this particular instance,\
  \ the parameters include (a) the \\(k \\times r\\) elements of the loading matrix\
  \ \\(\\boldsymbol{P}\\), (b) the \\(r\\) diagonal elements of \\(\\Gamma_f(0)\\\
  ), and (c) the \\(k\\) diagonal elements of \\(\\Sigma_e\\). The series \\(z_t\\\
  ) is independent of its lagged values, and the log-likelihood function is\n\n```\n\
  \\(L(\\boldsymbol{P}, \\Gamma_f(\\mathbf{0}), \\Sigma_n) = -\\frac{T}{2} \\log|\\\
  Gamma_z(0)| - \\frac{1}{2} \\sum_{t=1}^T \\boldsymbol{z}_t'[\\Gamma_z(0)]^{-1}\\\
  boldsymbol{z}_t,\\)\n```\n\nthat can be written as\n\n```\n\\(L(\\boldsymbol{P},\
  \ \\Gamma_f(\\mathbf{0}), \\Sigma_n) = -\\frac{T}{2} \\log|\\Gamma_z(0)| - \\frac{T}{2}\
  \ \\text{tr}[\\hat{\\Gamma}_z(0)\\Gamma_z^{-1}(0)],\\) (6.17)\n```\n\nwhere tr(\\\
  (\\boldsymbol{A}\\)) denotes the trace of the matrix \\(\\boldsymbol{A}\\). The\
  \ maximization of Eq. (6.17) can be carried out by taking the partial derivatives\
  \ with respect to the parameters. The situation is similar to that of the standard\
  \ factor analysis when \\(T > k\\), see Seber (1984), and has been studied in the\
  \ time series literature by Bai and Li (2012). For \\(k \\ge T\\), these authors\
  \ proposed a quasi-likelihood function in which instead of the covariance matrix\
  \ of the observations, which is singular, an approximate full rank matrix is used.\n\
  \nThe second approach, see Choi (2012), Doz et al. (2012), and Bai and Li (2016),\
  \ is to take \\(f_t\\) as parameters, or random variables, with dynamical dependence,\
  \ and to use the conditional distribution of \\(z_t\\) as \\(N_k(P f_t, \\Sigma_e)\\\
  ). The log-likelihood then becomes\n\n```\n\\(L(\\boldsymbol{P}, \\boldsymbol{F},\
  \ \\Sigma_e) = -\\frac{T}{2} \\log|\\Sigma_e| - \\frac{1}{2} \\sum_{t=1}^T (\\boldsymbol{z}_t\
  \ - \\boldsymbol{P} f_t)' \\Sigma_e^{-1} (\\boldsymbol{z}_t - \\boldsymbol{P} f_t),\\\
  ) (6.18)\n```\n\nwhere the parameters include (a) the \\(k \\times r\\) elements\
  \ of \\(\\mathbf{P}\\), (b) the \\(T \\times r\\) elements of \\(\\mathbf{F}\\),\
  \ and (c) the \\(k\\) diagonal elements of \\(\\Sigma_e\\). Assuming \\(\\Sigma_e\
  \ = \\sigma^2\\mathbf{I}\\), maximizing Eq. (6.18) is equivalent to PCA, and assuming\
  \ \\(\\Sigma_e\\) a positive definite matrix to generalized PCs. The minimization\
  \ of Eq. (6.18) can be carried out by putting the model in a state space form and\
  \ computing the likelihood function using the Kalman filter. The observation equation\
  \ for the state space representation is simply Eq. (6.1). The transition equation\
  \ is obtained by assuming a VAR(\\(p_1\\)) and a VAR(\\(p_2\\)) model for the factors\
  \ and noises, respectively. See Chapter 2 for state-space model and Kalman filter.\
  \ This approach is useful for a small \\(k\\) and has the advantage of allowing\
  \ the series to contain different periodicities, but it is less useful when \\(k\\\
  ) is large. The EM algorithm has also been used for estimating FMs but, again, is\
  \ not practical for large \\(k\\).\n\nThe following iterative procedure, proposed\
  \ by Bai and Li (2016), can be carried out easily with some initial estimates of\
  \ \\(\\mathbf{P}\\) and \\(\\mathbf{F}\\) to perform the approximate ML estimation:\n\
  \n- 1. Given the present estimates \\(\\widehat{\\mathbf{P}},\\widehat{\\mathbf{F}}\\\
  ), the residuals are computed by \\(\\widehat{\\mathbf{n}}_t = (\\mathbf{I} - \\\
  widehat{\\mathbf{P}}\\widehat{\\mathbf{P}}')\\mathbf{z}_t\\), and the noise variances,\
  \ \\(\\text{var}(n_{it}) = \\widehat{\\sigma}_i^2\\), which are used to form a diagonal\
  \ matrix \\(\\widehat{\\Sigma}_e\\).\n- 2. Autoregressive (AR) models are fitted\
  \ to each residual series, \\(\\widehat{\\phi}_i(B)\\widehat{n}_{it} = a_{it}\\\
  ), \\(i = 1, \\dots, k\\).\n- 3. The vector of loadings for each series, \\((\\\
  mathbf{p}_{t\\cdot})'\\), that is, the \\(i\\)th row of the matrix \\(\\widehat{\\\
  mathbf{P}}\\), is updated with the following regression\n  \\(\\widehat{\\phi}_i(B)z_{it}\
  \ = (\\mathbf{p}_{t\\cdot}')\\widehat{\\phi}_i(B)\\widehat{\\mathbf{f}}_t + \\epsilon_{it}.\\\
  )\n- 4. The factors are updated by using the current vector of loadings and running\
  \ the regression\n  \\(\\widehat{z}_{it}/\\widehat{\\sigma}_i = (\\mathbf{p}_{t\\\
  cdot}')\\widehat{\\mathbf{f}}_t/\\widehat{\\sigma}_i + \\epsilon_{it}^*.\\)\n- 5.\
  \ With the new factors and loadings, go to step 1 and iterate until convergence.\n\
  \n### 6.2.5 选择因子数量\n\nSeveral tests have been proposed in the literature to select\
  \ the number of factors and we will present here the most often used ones. The first\
  \ class of tests is based on checking the rank of the autocovariance matrices. Note\
  \ that for the EDFM, the maximum rank must be \\(r\\) and this maximum is achieved\
  \ also by the sum of some autocovariance matrices with \\(h > 0\\). These tests\
  \ are less useful if there is strong autocorrelation in the noises (e.g. the ADFM),\
  \ because then the lag covariance matrices can be full rank. Also, these types of\
  \ tests work well for \\(T >> k\\), that is, with a small number of long time series,\
  \ but are less powerful when \\(k\\) is relatively large compared with \\(T\\).\
  \ A second class of tests make use of the idea of separating the large eigenvalues\
  \ of the covariance matrices from the small ones and selecting \\(r\\) as the number\
  \ of large eigenvalues. A third way to select the number of factors is to use a\
  \ model selection criterion. We describe these three methods next. The selection\
  \ of \\(r\\) for the case of \\(k \\ge T\\) can be carried out by testing for high-dimensional\
  \ white noises discussed in Section 6.10.\n\n#### 6.2.5.1 通过规范相关分析进行秩检验\n\nTiao\
  \ and Tsay (1989) proposed to check the rank of some moment matrices for both the\
  \ stationary and nonstationary vector time series using canonical correlation analysis\
  \ and a chi-square statistic. A similar test for EDFM was proposed by Peña and Poncela\
  \ (2006) as follows. For all h > 0, there exists a k × (k − r) matrix \\(\\mathbf{P}_\\\
  perp\\) such that \\(\\Gamma_z(h)\\mathbf{P}_\\perp = \\mathbf{0}\\). Thus, the\
  \ k − r independent linear combinations of the observed series given by \\(\\mathbf{P}'_\\\
  perp\\mathbf{z}_t\\) are cross-sectionally and serially uncorrelated for all lags,\
  \ and also uncorrelated with \\(\\mathbf{P}'_\\perp\\mathbf{z}_{t-h}\\). Consider\
  \ now the k × k canonical correlation matrix\n\n```\n\\(\\mathbf{M}(h) = [E(\\mathbf{z}_t\\\
  mathbf{z}'_t)]^{-1} E(\\mathbf{z}_t\\mathbf{z}'_{t-h})[E(\\mathbf{z}_{t-h}\\mathbf{z}'_{t-h})]^{-1}\
  \ E(\\mathbf{z}_{t-h}\\mathbf{z}_t),\\)\n```\n\nwhere, for simplicity, we assume\
  \ \\(E(\\mathbf{z}_t) = \\mathbf{0}\\). Assuming an EDFM satisfying \\(\\Gamma_z(h)\
  \ = \\Gamma_z(-h)\\), we have that\n\n```\n\\(\\mathbf{M}(h) = [\\Gamma_z^{-1}(0)\\\
  Gamma_z(h)]^2.\\)\n```\n\nSuppose that \\(rank[\\Gamma_f(h)] = r\\), which is also\
  \ the rank of \\(\\Gamma_z(h)\\), then, we have \\(rank[\\mathbf{M}(h)] = r\\).\
  \ The number of zero canonical correlations between \\(\\mathbf{z}_{t-h}\\) and\
  \ \\(\\mathbf{z}_t\\) is given by the number of zero eigenvalues of the \\(\\mathbf{M}(h)\\\
  ) matrix, that is k − r. Thus, the number of common factors r is equivalent to the\
  \ number of non-zero canonical correlations between \\(\\mathbf{z}_{t-h}\\) and\
  \ \\(\\mathbf{z}_t\\).\n\nThe test for the number of factors is based on the aforementioned\
  \ result. Let \\(\\widehat{\\lambda}_1 \\ge \\widehat{\\lambda}_2 \\ge \\cdots \\\
  ge \\widehat{\\lambda}_k\\) be the ordered eigenvalues of the matrix \\(\\widehat{\\\
  mathbf{M}}(h)\\). If we have r factors, the eigenvalues \\(\\widehat{\\lambda}_{r+1},\
  \ \\dots, \\widehat{\\lambda}_k\\) are estimates of squared correlations equal to\
  \ zero and have asymptotic variance 1/(T − h). Therefore, the statistics \\(-(T-h)\\\
  log(1-\\widehat{\\lambda}_j) \\simeq (T-h)\\widehat{\\lambda}_j\\) follow a chi-square\
  \ distribution. It can be shown (see Peña and Poncela, 2006) that the statistic\n\
  \n```\n\\(S_{h-r} = -(T-h) \\sum_{j=r+1}^k \\log(1-\\widehat{\\lambda}_j),\\)\n\
  ```\n\nis asymptotically a \\(\\chi^2_{(k-r)^2}\\). The test is applied sequentially.\
  \ It starts with r = 0 and if the hypothesis is rejected, the value r = 1 is tried\
  \ and so on. The testing procedure stops when the hypothesis of r factor, or r non-zero\
  \ canonical correlation cannot be rejected.\n\nThis test works well when T/k is\
  \ large, but deteriorates when this ratio is small. Also, when the lag covariance\
  \ matrices of the factors are not full rank, the test may fail. For instance, suppose\
  \ two factors that follow moving-average (MA) processes. The first is MA(1) and\
  \ the second is MA(3), but with coefficients for lags one and two equal to zero.\
  \ Then, the lag-1 covariance matrix of the two factors is of rank one, the lag-2\
  \ matrix is rank zero, and the lag-3 has rank one. Thus, the test would indicate\
  \ a single factor, instead of two. However, the test can be modified to overcome\
  \ such difficulties by either checking the equivalence of identified common factors\
  \ for different lags or applying canonical correlation analysis simultaneously to\
  \ multiple lag autocovariance matrices. See Bolivar et al. (2020).\n\n\n\n\n\n####\
  \ 6.2.5.2 特征值跃变检验\n\n此处的检验基于协方差矩阵或滞后协方差矩阵之和的连续特征值（按适当顺序排列）的比率。该想法源于用于选择主成分数量的肘部图和随机矩阵理论，检验旨在寻找特征值比率的跃变，这种跃变会在达到真实因子数量时出现。参见\
  \ Onatski (2009, 2010)、Lam and Yao (2012) 以及 Ahn and Horenstein (2013)。\n\nLam and\
  \ Yao (2012) 提议计算合并协方差矩阵的有序特征值 $\\lambda_1 \\ge \\lambda_2 \\ge \\cdots \\ge \\\
  lambda_k$\n\n$$\\mathbf{M} = \\sum_{h=1}^{h_0} \\hat{\\mathbf{\\Gamma}}_z(h) \\\
  hat{\\mathbf{\\Gamma}}_z(h)', \\tag{6.21}$$\n\n其中 $h_0$ 是预先指定的正整数，并选择 $r$ 为\n\n\
  $$\\hat{r} = \\arg \\min_{1 \\le i \\le r^*} \\frac{\\hat{\\lambda}_{i+1}}{\\hat{\\\
  lambda}_i},$$\n\n对于某些 $r^* = \\alpha k$，其中 $k$ 是序列的数量且 $0 < \\alpha < 1$ 例如 $\\\
  alpha = 0.2$。假设前 $r$ 个特征值较大，其余特征值较小。那么，比率 $\\lambda_{i+1}/\\lambda_i \\le 1$ 在 $i\
  \ = r$ 时会出现较大下降。\n\nAhn and Horenstein (2013) 也提出了一种类似的检验，使用协方差矩阵 $\\hat{\\Gamma}_z(0)$\
  \ 的有序特征值 $\\nu_1 \\ge \\nu_2 \\ge \\cdots \\ge \\nu_k$。准则是\n\n$$\\hat{r} = \\arg\
  \ \\max_{1 \\le i \\le r^*} \\frac{\\nu_i}{\\nu_{i+1}}.$$\n\n如果某些因子是白噪声，则无法应用 Lam\
  \ and Yao 准则，因为滞后协方差矩阵中不包含这些因子的信息。然而，Ahn and Horenstein 检验仍然有效。此外，如果不存在共同因子，则两种检验都无法使用。有限经验表明，比率往往由一个主导因子支配，这通常发生在\
  \ $\\mathbf{z}_t$ 中存在强自相关时。事实上，该检验在应用中倾向于找到 $r = 1$。一旦消除了第一个主导因子，该检验可以进行迭代并应用于残差。\n\
  \n#### 6.2.5.3 使用信息准则\n\n与许多其他统计问题一样，信息准则可用于选择共同因子的数量。第 3 章解释的贝叶斯信息准则（BIC）在 $T >\
  \ k$ 时可使用，如\n\n$$\\text{BIC}(r) = \\log \\hat{\\sigma}_r^2 + r \\frac{\\log T}{T}$$\n\
  \n但当 $k$ 较大或接近 $T$ 时，此准则并不总能对因子数量提供一致的估计。Bai and Ng (2002) 提出了一种在实践中似乎效果良好的一致模型选择准则，可表示为\n\
  \n$$\\text{BNG}(r) = \\log \\hat{\\sigma}_r^2 + r \\frac{\\log (\\min(T, k))}{\\\
  min(T, k)}.$$\n\n其中\n\n\\(\\widehat{\\sigma}_r^2 = \\text{MSE}(\\widehat{\\boldsymbol{P}}_r,\
  \ \\widehat{\\boldsymbol{F}}_r) = \\frac{1}{kT} \\sum_{t=1}^T (\\boldsymbol{z}_t\
  \ - \\widehat{\\boldsymbol{P}}_r \\boldsymbol{f}_t^r)' (\\boldsymbol{z}_t - \\widehat{\\\
  boldsymbol{P}}_r \\boldsymbol{f}_t^r)\\)\n\n是在拟合 $r$ 个因子时的均方误差（MSE），此处使用 $\\boldsymbol{f}_t^r$\
  \ 表示 $\\boldsymbol{f}_t$ 的维度为 $r$。因子数量的选择旨在最小化 BNG($r$)。\n\n### 6.2.6 使用 DFM 进行预测\n\
  \n使用 DFM 模型进行预测是通过为每个因子和每个噪声序列拟合适当的标量 ARMA 模型，并从拟合模型生成预测来进行的，例如 \\(\\widehat{f}_t^r(h)\\\
  ) 和 \\(\\widehat{n}_t(h)$，其中 $h$ 是预测步距，$t$ 是预测原点。然后\n\n\\(\\widehat{\\boldsymbol{z}}_t(h)\
  \ = \\widehat{\\boldsymbol{P}}\\widehat{\\boldsymbol{f}}_t^r(h) + \\widehat{\\boldsymbol{n}}_t(h).\
  \ \\quad (6.22)\\)\n\n使用 EDFM 预测单个时间序列时，因子汇总了关于动态的所有信息，且\n\n\\(E(z_{i,t+h}|\\boldsymbol{Z},\
  \ \\boldsymbol{F}) = E[(\\mathbf{p}_t^i)' \\boldsymbol{f}_{t+h} + n_{i,t+h} | \\\
  boldsymbol{Z}, \\boldsymbol{F}] = (\\mathbf{p}_t^i)' E(\\boldsymbol{f}_{t+h} | \\\
  boldsymbol{F}) + E(n_{i,t+h} | \\boldsymbol{Z}, \\boldsymbol{F}).\\)\n\n因此，要预测每个单独的时间序列，只需要所有因子的预测外加特定噪声的预测。\n\
  \nDFM 生成的预测可以表示为（参见 Peña and Poncela, 2004）包含一个类似于层次贝叶斯模型推导出的汇总项。例如，假设一个单因子 DFM，其中因子遵循参数为\
  \ $\\phi$ 的 AR(1) 过程。根据 (6.22)，每个系列的预测为 \\(\\widehat{z}_{i,t+h|t} = \\boldsymbol{\\\
  phi}^h p_i f_{i|t}\\)，该方程也可以写成\n\n\\(\\widehat{z}_{i,t+h|t} = \\boldsymbol{\\phi}^h\
  \ \\left[ \\alpha_t p_i f_{i|t|-1} + (1 - \\alpha_t) \\sum_{i=1}^k \\delta_i z_{it}\
  \ \\right],\\)\n\n其中 \\(\\delta_i = (p_i^2 / \\sigma^2) / \\sum_{i=1}^k (p_i^2 /\
  \ \\sigma^2)\\) 是第 $i$ 个系列的相对信噪比。因此，预测可以看作是两个项的加权组合：第一项是使用截至 $t-1$ 时信息的时间 $t$ 因子预测，第二项是时间\
  \ $t$ 时系列值的加权平均，每个系列的权重取决于其相对信噪比。预测中两个项的权重取决于其相对精度，即 \\(\\alpha_t = \\text{var}^{-1}(f_{i|t|-1})\
  \ / [\\text{var}^{-1}(f_{i|t|-1}) + \\sum_{i=1}^k (p_i^2 / \\sigma^2)]\\)；有关更深入的分析，请参见\
  \ Peña and Poncela (2004)。这些作者推导了单因子情况下 FM 预测相对于单变量和收缩模型的预期收益，并表明 FM 的优势随时间序列向量的维度和各组件之间动态关系的强度而增加。\n\
  \nBoivin and Ng (2006) 研究了使用更多数量的系列来提取因子对预测的优势。当特征误差存在交叉相关时，这种优势可能非常小，甚至成为缺点。在第\
  \ 7 章中，我们将看到如何将 DFM 与其他方法结合来预测大量时间序列。\n\nDFM 也可以与其他方法结合以产生非线性预测。Fan et al. (2017)\
  \ 提出了充分预测，这是一种有趣的预测方法，除线性 DFM 预测外，还结合了一组从高维预测器中推断出的充分预测指标。该方法通过利用 FMs 汇总交叉相关，将基于切片逆回归（Li,\
  \ 1991）的充分维度缩减和 Cook (2018) 的中心子空间分析扩展到高维模式。\n\n### 示例 6.2\n\n为说明这一点，我们再次考虑示例 6.1\
  \ 中使用的 19 个欧元区国家季度 GDP 的增长率。将 Lam and Yao 检验应用于公式 (6.21) 中的合并协方差矩阵，我们得到了 \\(\\hat{r}\
  \ = 1\\)。估计的共同因子如图 6.3 所示。总体而言，估计的共同因子与从样本协方差矩阵获得的因子相似。该因子解释了系列约 51% 的变异性。该分析通过与本书关联的\
  \ SLBDD R 包中的命令 `dfmpc` 进行。该程序还给出了载荷向量，见图 6.4，以及因子和特征噪声的模型。\n\n### 用于 DFM 分析的 R\
  \ 命令：续示例 6.1。\n\n```\n>out=dfmpc(G1)\n>out$r # output is not shown.\n>out$F\n>out$L\n\
  >plot(tdx,-out$F[,1],xlab='year',ylab='1st factor',type='l')\n>plot (1:19,-out$L,xlab='country',ylab='weight',type='l')\n\
  >out$MarmaF\n>out$MarmaE\n```\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_330_0.png)\n\
  \n图 6.3 19 个欧元区国家 GDP 系列增长率的第一个共同因子的时间图。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_331_0.png)\n\
  \n图 6.4 19 个欧元区国家 GDP 系列增长率的第一个共同因子的载荷。\n\n### 示例 6.3\n\n我们继续研究采用欧洲货币联盟（EMU）的 19\
  \ 个国家的季度市场价格 GDP 系列、最终消费支出（CON）和毛固定资本形成（INV）系列，总共 57 个时间序列。数据跨度为 2000 年第 1 季度至 2018\

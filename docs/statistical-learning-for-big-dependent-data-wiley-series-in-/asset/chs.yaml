  \ 4.3 所示，然后对所有系列应用。为了使用相似模型来比较结果，前两个系列的 AR 阶数为 p = 2。检测到的异常值数量保持为 5。在第一个系列中，所有异常值均被识别为水平移位，而在示例\
  \ 4.3 中，两个为水平移位，两个为暂时性变化，一个为加性异常值。由于此处未考虑暂时性变化，这两个暂时性变化被识别为水平移位。在第二个系列中，仅发现三个加性异常值。\n\
  \n为了检测所有时间序列的异常值，我们设置 p = 5 以涵盖数据的不同动态行为。如果某个系列包含检测到的水平移位，我们根据所提议的程序移除水平移位的影响。然后，我们使用水平移位调整后的系列来检测\

  \n```\nMAE = \\frac{1}{192} \\frac{1}{1095} \\sum_{i=1}^{192} \\sum_{t=1}^{1095}\
  \ |X_{t,i} - \\hat{X}_{t,i}|,\n```\n\n和\n\n```\nRMSE = \\left( \\frac{1}{192} \\\
  frac{1}{1095} \\sum_{i=1}^{192} \\sum_{t=1}^{1095} (X_{t,i} - \\hat{X}_{t,i})^2\
  \ \\right)^{1/2},\n```\n\n其中 \\(z_{it}\\) 对应第 \\(t\\) 天的第 \\(i\\) 个序列，\\(\\hat{\\\
  zeta}_{it}\\) 是其预测值。模型 M1 的 MAE 和 RMSE 分别为 0.0526 和 0.1131，而模型 M2 分别为 0.0487 和 0.1100。这些结果表明，引入聚类结构和特定因子对整体样本外预测产生了中等程度的改进。模型\
  \ M1 在聚类 1（聚类 2）的时间序列上计算的 MAE 和 RMSE 为 0.0545 和 0.0734（0.0501 和 0.1522），模型 M2 为\
  \ 0.0502 和 0.0677（0.0465 和 0.1505），MAE 改进了 7.88%，RMSE 改进了 7.86%（7.04 和 1.10 %），分别。也就是说，两个聚类均观察到改进，且第一个聚类的改进更大。\n\
  \n## 6.9 DFM 的一些扩展\n\n本章介绍的模型已以多种方式进行了扩展。首先，载荷可能不是恒定的，而是随时间变化，或者因子模型（FM）的参数在观测期内也可能发生变化。请注意，由于只有公共组件（载荷与因子的乘积）可以被识别，因此假设两个结构同时变化是没有意义的。最受研究的变化是因子载荷。Stock\
  \ and Watson (2002a, 2002b) 证明，如果这些载荷变化的幅度较小，则通过主成分（PC）进行的估计仍然是一致的。然而，可以看出，如果这些变化不够小，PC\
  \ 估计将变得低效。Motta et al. (2011) 研究了局部平稳因子模型。Motta and Ombao (2012) 假设载荷随时间平滑变化，并通过估计的时间变化协方差矩阵的谱分解来估计它们，而\
  \ Su and Wang (2017) 应用 PC 的局部版本来估计因子和载荷。其他方法基于使用小波来估计载荷的演变；参见 Cataño et al. (2020)。关于因子模型中参数变化，Corral\
  \ and Peña (2008) 假设因子遵循 AR 阈值模型并研究了其估计。\n\nDFM 的一个重要未来发展是时间上的张量数据分析。例如，假设我们分析不同时间、不同市场中不同产品的需求演变。在每个时间\
  \ t，t = 1, ..., T，我们观察一个矩阵，包含不同市场 j = 1, ..., J 中产品 i = 1, ..., I 的销售量。因子可能同时作用于两个维度：产品和市场。将时间\
  \ t 的 \\( I \\times J \\) 维数据矩阵记为 \\( Z_t \\)，Wang et al. (2019) 和 Chen et al. (2020)\
  \ 假设因子模型\n\n\\( Z_t = R F_t C' + U_t,\\)\n\n其中 \\( R \\) 是一个 \\( I \\times r_1 \\\
  ) 行载荷矩阵，\\( F_t \\) 是一个 \\( r_1 \\times r_2 \\) 的因子矩阵，\\( C \\) 是一个 \\( J \\times\
  \ r_2 \\) 列载荷矩阵。在此示例中，数据是三阶张量，但该模型可以推广到任何 h 阶张量。随着可按不同维度分类的大数据日益增长，此类扩展在未来将变得越来越重要。\n\
  \n另一个扩展是考虑 DFM 中的季节性。这些模型可以扩展以包含季节性因子，如下\n\n\\( z_t = P_1 f_{1t} + P_2 f_{2t} +\
  \ P_3 f_{3t} + e_t,\\)\n\n为简单起见，我们假设 \\( e_t \\) 为白噪声，\\( f_t = (f'_{1t}, f'_{2t},\
  \ f'_{3t})' \\) 中包含三组公共因子。这些公共因子分别与整合因子、季节性因子和平稳因子相关。因此，\\( f_{1t} \\) 是维度为 \\(\
  \ r_1 \\) 的非平稳非季节性因子向量，并遵循 \\( d \\ge 1 \\) 的模型：\n\n\\( \\Phi_1(B) \\nabla^d f_{1t}\
  \ = \\theta_1(B) a_{1t},\\) (6.51)\n\n$f_{2t}$ 是维度为 $r_2$、周期为 $s$ 的季节性因子，满足\n\n\
  $$\n\\Phi_2(B^s)\\nabla_s^D f_{2t} = \\theta_2(B^s)a_{2t}, \\quad (6.52)\n$$\n\n\
  其中 $\\nabla_s = (1 - B^s)$ 且 $D \\ge 0$，而 $f_{3t}$ 由维度为 $r_3$ 的平稳因子组成，并遵循模型\n\n\
  $$\n\\Phi_3(B)f_{3t} = \\theta_3(B)a_{3t}, \\quad (6.53)\n$$\n\n其中 AR 和 MA 矩阵多项式满足第\
  \ 3 章讨论的可识别性条件。事实上，我们假设，对于每个 $i = 1, 2, 3$，$\\{a_{it}\\}$ 是均值为 $\\mathbf{0}$、协方差矩阵为对角矩阵\
  \ $\\Sigma_i$ 的高斯白噪声过程，且所有参数矩阵均为对角矩阵。这里，$r_1 + r_2 + r_3 = r$，我们写 $\\mathbf{P} =\
  \ [\\mathbf{P}_1 \\mathbf{P}_2 \\mathbf{P}_3]$，其中子矩阵 $\\mathbf{P}_i$ 的维度为 $k \\\
  times r_i$，且 $f_{it} = (f_{i1t}, \\dots, f_{ir_i,t})'$，$i = 1, 2, 3$。创新过程 $\\{a_{1t}\\\
  }$、$\\{a_{2t}\\}$、$\\{a_{3t}\\}$ 和 $\\{e_t\\}$ 互不相关。我们假设 $\\mathbf{P}'\\mathbf{P}\
  \ = \\mathbf{I}_r$，这意味着对于 $i = 1, 2, 3$ 有 $\\mathbf{P}'_i\\mathbf{P}_i = \\mathbf{I}_{r_i}$。\n\
  \n为简单起见，假设 $d = D = 1$。我们定义样本广义季节性自协方差（SGCV）矩阵 $C_{z,s}(h)$ 如下\n\n$$\nC_{z,s}(h)\
  \ = \\frac{s^{2d}}{T^{2d}} \\sum_{t=h+1}^T z_t z'_{t-h}. \\quad (6.54)\n$$\n\n$C_{z,s}(h)$\
  \ 中的归一化常数等于 $1/(T/s)^{2d}$，其中 $T/s$ 是样本中的季节数，前提是 $T$ 是 $s$ 的倍数。可以证明，见 Nieto et al.\
  \ (2016)，当 $h$ 固定且 $T \\to \\infty$ 时，序列 $\\{C_{z,s}(h)\\}$ 弱收敛到一个随机矩阵 $\\Gamma_{z,s}(h)$，该矩阵具有以下性质：(a)\
  \ 对于 $h = js$（$j$ 为正整数），$\\Gamma_{z,s}(h)$ 几乎可以肯定有 $r_1 + r_2$ 个正特征值和 $k - r_1 -\
  \ r_2$ 个零特征值；(b) 对于 $h \\neq js$，$\\Gamma_{z,s}(h)$ 几乎可以肯定有 $r_1$ 个正特征值和 $k - r_1$\
  \ 个零特征值。设 $\\lambda_1(h), \\dots, \\lambda_k(h)$ 为 $\\Gamma_{z,s}(h)$ 的特征值。那么，如果\
  \ $h = js$，对应 $r_1 + r_2$ 个正特征值的特征向量构成子矩阵 $[\\mathbf{P}_1 \\mathbf{P}_2]$ 列空间的一组基；如果\
  \ $h \\neq js$，对应 $r_1$ 个正特征值的特征向量构成子矩阵 $\\mathbf{P}_1$ 列空间的一组基。\n\n因此，我们预期样本协方差矩阵\
  \ $C_{z,s}(h)$ 具有两个不相交的特征值子集：一个包含相对较大的正值，另一个由接近于零的小值组成。对于有序特征值，当 $h \\neq js$ 时，小值将出现在\
  \ $i = r_1 + 1, \\dots, k$；当 $h = js$ 时，小值将出现在 $i = r_1 + r_2 + 1, \\dots, k$。基于这些结果拟合模型的程序已由\
  \ Nieto et al. (2016) 提出。\n\n## 6.10 高维情形\n\n### 6.10.1 稀疏主成分\n\n本节讨论了在维度 $k$ 大于样本量\
  \ $T$ 的高维时间序列中 DFM 的 PC 估计。在这些情况下，PC 估计不一致，在有限样本中可能不准确。\n\n作为示例，表 6.3 和 6.4 展示了在具有一个因子的\
  \ EDFM 中，通过 PC 估计协方差矩阵最大特征向量的两个精度指标，该因子为方差为 25 的白噪声，噪声服从 $N(0,1)$。表 6.3 展示\n\n\n\
  表 6.3 大信噪比单因子 EDFM 中，协方差矩阵第一个特征向量与 PC 估计特征向量之间相关系数的绝对值，作为样本量 T 和序列数量 k 的函数\n\n|\
  \ T/k | 10 | 20 | 50 | 100 | 200 | 300 | 400 | 500 |\n|---|---|---|---|---|---|---|---|---|\n\
  | 100 | 0.992 | 0.983 | 0.960 | 0.924 | 0.868 | 0.813 | 0.769 | 0.726 |\n| 200 |\
  \ 0.996 | 0.991 | 0.979 | 0.961 | 0.924 | 0.894 | 0.862 | 0.838 |\n| 300 | 0.997\
  \ | 0.994 | 0.986 | 0.972 | 0.948 | 0.924 | 0.903 | 0.883 |\n\n表 6.4 大信噪比单因子 EDFM\
  \ 中，协方差矩阵第一个特征向量与 PC 估计特征向量之间角度的绝对值（以梯为单位），作为样本量 T 和序列数量 k 的函数\n\n| T/k | 10 | 20\
  \ | 50 | 100 | 200 | 300 | 400 | 500 |\n|---|---|---|---|---|---|---|---|---|\n\
  | 100 | 3.46 | 5.06 | 8.18 | 11.57 | 16.15 | 19.44 | 22.38 | 25.25 |\n| 200 | 2.39\
  \ | 3.52 | 5.82 | 8.08 | 11.59 | 14.03 | 16.13 | 18.03 |\n| 300 | 1.92 | 2.92 |\
  \ 4.71 | 6.74 | 9.56 | 11.60 | 13.31 | 14.85 |\n\n真实特征向量与 PC 估计特征向量之间相关系数的绝对值，表\
  \ 6.4 则为两个向量之间的角度（以梯为单位）。很明显，当 k/T 增加时，估计精度会下降，且在 k > T 时可能非常差。构建这些表格的 R 命令见附录，读者可以检查，降低信噪比会使\
  \ PC 的精度变得非常低。例如，当因子方差为 4，T=100 且 k=40 时，真实特征向量与估计特征向量之间的相关系数低至 0.35。\n\n要解释这些结果，请考虑具有一个因子的简单\
  \ EDFM 情况。观测值的协方差矩阵由下式给出\n\n```\n\\Gamma_z(0) = pp'\\gamma_0 + \\sigma^2 I\n```\n\
  \n其中 p 为载荷向量。令 s = \\gamma_0/\\sigma^2 为信噪比。将 \\widehat{p} 称为 p 的 PC 估计值，估计精度可由\
  \ \\cos \\alpha = p'\\widehat{p} 或 \\text{corr}(\\widehat{p}, p) 衡量，两个向量之间的角度越接近零，或相关系数越接近一，估计的准确性越好。Johnstone\
  \ and Lu (2009) 证明，当 T 和 k 都趋于无穷大，并记 c = \\lim_{T,k \\to \\infty} k/T 时，有\n\n```\n\
  \\lim_{T,k \\to \\infty} \\cos^2 \\alpha = \\frac{(s^2 - c)_+}{s^2 + sc} \\quad\
  \ (6.55)\n```\n\n其中 (a)_+ = \\max\\{a, 0\\}。因此，若 \\lim_{T,k \\to \\infty} \\cos^2\
  \ \\alpha = 1，则 \\widehat{p} 是 p 的一致估计量。这要求 c = 0，即 k 必须固定，或者在 T 趋于无穷大时与 T 一起非常缓慢地增长。这是\
  \ T > k 且 k 固定时的标准 PC 应用。当 c > 0 时，估计精度取决于信噪比 \\( s \\)。若该比率较小且 \\( s^2 < c \\)，则\
  \ \\( \\lim_{T,k \\to \\infty} \\cos^2 \\alpha = 0 \\)，且向量 \\( \\widehat{p} \\)\
  \ 与 \\( p \\) 正交：估计未提供关于真实值的任何信息。若信噪比较强且 \\( s^2 > c \\)，估计精度随 \\( s^2 \\) 增大，但估计量永远不一致，且在极限中始终存在某些偏差。有关此分析的推广，请参见\
  \ Wang and Fan (2017)。\n\n已提出多种解决方案来克服这一困难。Johnstone and Lu (2009) 证明，即使 \\( k >\
  \ p \\)，如果向量 \\( p \\) 是稀疏的，即许多系数等于零，PC 仍可提供一致估计。他们提出了一种两步程序：首先选择方差较大的变量 \\( z_{it}\
  \ \\)，然后在这组选定变量的小集合上应用 PC。最终向量 \\( \\widehat{p} \\) 由选定变量的估计值构成，其余变量为零。另一种解决方案是向计算\
  \ PC 的方法添加稀疏性条件，无论是通过方差最大化还是最优重构。Jolliffe et al. (2003) 使用最大方差条件和 Lasso（在第 7 章中研究）来解决以下问题：\n\
  \n\\(\\max \\{v'X'Xv\\}, \\quad \\text{subject to } \\|v\\|_1 \\le t, \\|v\\|_2\
  \ = 1. \\quad (6.56)\\)\n\n去掉限制 \\(\\|v\\|_1 \\le t\\) 后，该问题成为计算 PC 的标准方法，即作为矩阵\
  \ \\( X'X \\) 的主要特征向量。添加限制 \\(\\|v\\|_1 \\le t\\)，即 PC 的系数绝对值之和必须很小，从而得到稀疏解。Hastie\
  \ et al. (2015) 讨论了求解 Eq. (6.56) 的有效方法。Zou and Hastie (2005) 利用 PC 的最优重构性质，寻找投影方向\
  \ \\( v \\) 和系数 \\( \\beta \\)，使其满足\n\n\\(\\min \\left\\{ \\frac{1}{T} \\sum_{i=1}^T\
  \ \\|z_i - \\beta v' z_i\\|_2^2 + \\lambda_1 \\|v\\|_1 + \\lambda_2 \\|v\\|_2^2\
  \ \\right\\}, \\quad \\text{subject to } \\|\\beta\\|_2 = 1.\\)\n\n该程序也使用 Lasso\
  \ 限制，与下一章中研究的弹性网高度相关。\n\n在下一节中，我们将介绍一种用于多变量和高维时间序列分析的结构-FM。该模型假设，观测到的 \\( k \\)\
  \ 维时间序列是 \\( r \\) 个共同因子和 \\( k-r \\) 个白噪声过程的非奇异线性变换。对于有限的 \\( k \\)，结构-FM 优于传统的精确\
  \ FM，因为噪声的样本协方差矩阵是正定的。对于 \\( k \\) 趋于无穷大的情况，结构-FM 使用不同的方法来指定共同因子的数量，而非特征向量比率，从而避免了此处提到的\
  \ PCA 所面临的困难。\n\n### 6.10.2 结构-FM 方法\n\nGao and Tsay (2018) 提出了以下结构-FM\n\n\\( z_t\
  \ = P \\begin{bmatrix} f_t \\\\ \\epsilon_t \\end{bmatrix} = [P_1, P_2] \\begin{bmatrix}\
  \ f_t \\\\ \\epsilon_t \\end{bmatrix} = P_1 f_t + P_2 \\epsilon_t, \\quad (6.57)\
  \ \\)\n\n其中 \\( P \\) 是一个 \\( k \\times k \\) 非奇异矩阵，\\( f_t = (f_{1t}, \\dots, f_{rt})'\
  \ \\) 是共同因子，\\( \\epsilon_t = (\\epsilon_{1t}, \\dots, \\epsilon_{vt})' \\) 是 \\\
  ( v \\) 维白噪声，且 \\( v = k - r \\)，\\( P_1 \\) 是 \\( k \\times r \\) 载荷矩阵，\\(\\boldsymbol{P}_2\\\
  ) 是 \\( k \\times v \\) 实矩阵。在模型 (6.57) 中，我们假设 \\(\\boldsymbol{\\Gamma}_f(0) = \\\
  boldsymbol{I}_r\\)、\\(\\boldsymbol{\\Gamma}_{\\epsilon}(0) = \\boldsymbol{I}_v\\\
  )、\\(\\text{Cov}(\\boldsymbol{f}_t, \\boldsymbol{\\epsilon}_t) = \\mathbf{0}\\)，且\
  \ \\(\\boldsymbol{f}_t\\) 的任何线性组合都不是白噪声序列；否则，我们可以将白噪声移至 \\(\\boldsymbol{\\epsilon}_t\\\
  )。\n\n令 \\(\\boldsymbol{P}_1 = \\boldsymbol{A}_1\\boldsymbol{Q}_1\\) 且 \\(\\boldsymbol{P}_2\
  \ = \\boldsymbol{A}_2\\boldsymbol{Q}_2\\)，其中 \\(\\boldsymbol{A}_1\\) 和 \\(\\boldsymbol{A}_2\\\
  ) 是半正交矩阵，满足 \\(\\boldsymbol{A}'_1\\boldsymbol{A}_1 = \\boldsymbol{I}_r\\) 和 \\(\\\
  boldsymbol{A}'_2\\boldsymbol{A}_2 = \\boldsymbol{I}_v\\)。这可以通过 QR 分解或奇异值分解始终完成。在这种参数化下，\\\
  (\\boldsymbol{f}_t\\) 和 \\(\\boldsymbol{\\epsilon}_t\\) 的强度分别由 \\(\\boldsymbol{Q}_1\\\
  ) 和 \\(\\boldsymbol{Q}_2\\) 表示。等式 (6.57) 中的模型可改写为\n\n\\(\\boldsymbol{z}_t = \\boldsymbol{A}_1\\\
  boldsymbol{x}_t + \\boldsymbol{A}_2\\boldsymbol{e}_t, \\quad (6.58)\\)\n\n其中 \\\
  (\\boldsymbol{x}_t = \\boldsymbol{Q}'_1\\boldsymbol{f}_t\\) 且 \\(\\boldsymbol{e}_t\
  \ = \\boldsymbol{Q}_2\\boldsymbol{e}_t\\)。请注意，FM 的可识别性继续适用于等式 (6.58) 中的模型，但由 \\\
  (\\boldsymbol{A}_1\\)（因此由 \\(\\boldsymbol{P}_1\\)）生成的列空间可以被识别。\\(\\boldsymbol{A}_2\\\
  ) 的列空间也是如此。等式 (6.57) 与传统 FM 的主要区别在于，等式 (6.57) 及因此等式 (6.58) 中的随机向量始终具有总维度 \\(k\\\
  )。因此，共同因子的数量 \\(r\\) 可由 \\(k-v\\) 识别，其中 \\(v\\) 是观测向量 \\(\\boldsymbol{z}_t\\) 中嵌入的白噪声过程的数量。最近已提出多种方法来检验高维白噪声过程。下面的分析利用了这些白噪声检验统计量。请参见第\
  \ 6.10.4 节。\n\n### 6.10.3 估计\n\n在本节中，我们概述了等式 (6.58) 模型的估计程序。我们首先简要讨论 Gao and Tsay\
  \ (2018) 所使用估计方法背后的依据。令 \\(\\boldsymbol{B}_1\\) 和 \\(\\boldsymbol{B}_2\\) 分别为 \\\
  (\\boldsymbol{A}_1\\) 和 \\(\\boldsymbol{A}_2\\) 的正交补，因此 \\(\\boldsymbol{B}_1 \\\
  in R^{k \\times v}\\) 和 \\(\\boldsymbol{B}_2 \\in R^{k \\times r}\\) 是两个满足 \\(\\\
  boldsymbol{B}'_1\\boldsymbol{A}_1 = \\mathbf{0}\\) 和 \\(\\boldsymbol{B}'_2\\boldsymbol{A}_2\
  \ = \\mathbf{0}\\) 的半正交矩阵。由等式 (6.58) 得\n\n\\(\\boldsymbol{B}'_1\\boldsymbol{z}_t\
  \ = \\boldsymbol{B}'_1\\boldsymbol{A}_2\\boldsymbol{e}_t, \\quad (6.59)\\)\n\n因此\
  \ \\(\\boldsymbol{B}'_1\\boldsymbol{z}_t\\) 是一个 \\(v\\) 维白噪声过程。同样，由等式 (6.58) 得\n\
  \n\\(\\Gamma_z(h) = \\boldsymbol{A}_1\\Gamma_x(h)\\boldsymbol{A}'_1 + \\boldsymbol{A}_1\\\
  Sigma_{xe}(h)\\boldsymbol{A}'_2, \\quad h \\ge 1, \\quad (6.60)\\)\n\n其中 \\(\\Sigma_{xe}(h)\
  \ = \\text{Cov}(\\boldsymbol{x}_t, \\boldsymbol{e}_{t-h})\\)，且\n\n\\(\\Gamma_z(0)\
  \ = \\boldsymbol{A}_1\\Gamma_x(0)\\boldsymbol{A}'_1 + \\boldsymbol{A}_2\\Gamma_e(0)\\\
  boldsymbol{A}'_2. \\quad (6.61)\\)\n\n对于预指定的正整数 \\(h_0\\)，如等式 (6.21) 所示，定义\n\n\\\
  (\\boldsymbol{M} = \\sum_{h=1}^{h_0} \\Gamma_z(h)\\Gamma_z(h)', \\quad (6.62)\\\
  )\n\n这是一个 \\(k \\times k\\) 半正定矩阵。由于 \\(\\boldsymbol{B}'_1\\boldsymbol{A}_1 = \\\
  mathbf{0}\\)，我们有 \\(\\boldsymbol{M}\\boldsymbol{B}_1 = \\mathbf{0}\\)，因此 \\(\\boldsymbol{B}_1\\\
  ) 的列是与 \\(\\boldsymbol{M}\\) 的零特征值相关的特征向量，而因子载荷空间（即 \\(\\boldsymbol{A}_1\\) 的列空间）由与\
  \ \\(\\boldsymbol{M}\\) 的 \\(r\\) 个非零特征值相关的特征向量张成。这提供了 \\(\\boldsymbol{A}_1\\) 的估计。\n\
  \n\n\n\n接下来，由等式 (6.58) 得\n\n$B'_2 z_t = B'_2 A_1 x_t, \\quad (6.63)$\n\n它与等式 (6.59)\
  \ 中定义的 $B'_1 z_t$ 不相关。因此，\n\n$B'_2 \\Gamma_z(0) B_1 B'_1 \\Gamma_z(0) B_2 = \\mathbf{0},\
  \ \\quad (6.64)$\n\n这意味着 $B_2$ 由以下矩阵的零特征值对应的 $r$ 个特征向量组成\n\n$S = \\Gamma_z(0) B_1\
  \ B'_1 \\Gamma_z(0). \\quad (6.65)$\n\nGao 和 Tsay (2018) 表明矩阵 $B'_2 A_1$ 是可逆的，因此，由等式\
  \ (6.63) 得 $x_t = (B'_2 A_1)^{-1} B_2 z_t$。这提供了公共因子 $x_t$ 及因此的 $f_t$ 的估计。由等式 (6.58)，$x_t$\
  \ 不涉及白噪声项 $e_t$，因此估计的公共因子 $\\hat{f}_t = Q_1^{-1} x_t$ 不会涉及噪声项 $e_t$。这种估计方法因而提高了公共因子\
  \ $f_t$ 估计的效率。作者将等式 (6.65) 中 $S$ 的特征值-特征向量分析称为投影 PCA，因为它在执行 PCA 之前将观测序列 $z_t$ 投影到\
  \ $B_1$ 的方向上。\n\n转到实际估计。暂且假设公共因子的数量 $r$ 已知。$r$ 的选择将在下一节给出。首先，我们对样本矩阵进行特征值-特征向量分析\n\
  \n$\\widehat{M} = \\sum_{h=1}^{h_0} \\hat{\\Gamma}_z(h) \\widehat{\\Gamma}_z(h)',$\n\
  \n其中 $h_0$ 是一个小的正整数。令 $\\hat{A}_1 = [\\hat{a}_1, ..., \\hat{a}_r]$ 和 $\\hat{B}_1\
  \ = [\\hat{B}_1, ..., \\hat{B}_v]$ 为分别由 $\\widehat{M}$ 与非零特征值和零特征值相关联的特征向量组成的半正交矩阵。接下来，我们对\
  \ $\\hat{S} = \\hat{\\Gamma}_z(0) \\hat{B}_1 \\hat{B}'_1 \\hat{\\Gamma}_z(0)$ 进行特征值-特征向量分析，这是一个秩最大为\
  \ $k - r$ 的 $k \\times k$ 矩阵。令 $\\hat{B}_2 = [\\hat{B}_{v+1}, ..., \\hat{B}_k]$，其中\
  \ $\\hat{B}_i$（$i = v + 1, ..., k$）是与 $\\hat{S}$ 的 $r$ 个最小特征值相关联的特征向量。对于较大的 $k$，Gao\
  \ 和 Tsay (2018) 提供了一种计算 $\\hat{B}_2$ 的修改方法，如果允许噪声协方差矩阵 $\\Gamma_e(0)$ 的某些最大特征值在\
  \ $k \\to \\infty$ 时趋于无穷大。有兴趣的读者可参阅该文档以获取详细信息。然后我们可以通过 $\\hat{x}_t = (\\hat{B}'_2\
  \ \\hat{A}_1)^{-1} \\hat{B}'_2 z_t$ 估计因子过程。最后，白噪声过程可以通过 $\\hat{e}_t = \\hat{A}'_2\
  \ z_t - \\hat{A}'_2 \\hat{A}_1 \\hat{x}_t$ 估计，其中 $\\hat{A}_2 = [\\hat{B}_1, ...,\
  \ \\hat{B}_v]$ 由与 $\\hat{S}$ 的 $v$ 个最大特征值相关联的特征向量组成。\n\n#### 6.10.4 选择公共因子的数量\n\n\
  在 $k \\ge T$ 的情况下，典型相关分析无法用于选择公共因子的数量 $r$。然而，根据前一节的讨论，$\\hat{B}'_1 z_t$ 是一个 $v$\
  \ 维白噪声，其中 $v = k - r$。因此，通过检验矩阵 $\\widehat{M}$ 主成分中的白噪声序列数量，我们可以估计 $v$。用 $\\hat{v}$\
  \ 表示估计的白噪声序列数量。那么，$\\hat{r} = k - \\hat{v}$。关键问题是如何检验高维白噪声时间序列。\n\n近年来，高维白噪声过程检验已得到广泛研究。这里我们讨论两种方法。其他可能的方法包括\
  \ Ling et al. (2020) 及其参考文献。我们讨论的两种方法利用时间序列滞后自相关矩阵的最大绝对交叉相关。为了我们的目的，我们想检测 \\(\\\
  hat{\\boldsymbol{u}}_t = [\\hat{\\mathbf{A}}_1, \\hat{\\mathbf{B}}_1]'\\boldsymbol{z}_t\\\
  ) 中的白噪声系列数量，其中 \\([\\hat{\\mathbf{A}}_1, \\hat{\\mathbf{B}}_1]\\) 是等式 (6.62) 中矩阵\
  \ \\(\\hat{\\boldsymbol{M}}\\) 的特征向量矩阵。为了讨论简便，令 \\(\\boldsymbol{w}_t\\) 为 \\(\\\
  hat{\\boldsymbol{u}}_t\\) 的一个 \\(d\\) 维子序列，其中 \\(1 \\le d \\le k\\)。我们的目标是检验原假设\
  \ \\(H_0 : \\Gamma_w(1) = \\cdots = \\Gamma_w(m) = \\mathbf{0}\\) 与备择假设 \\(H_a :\
  \ \\Gamma_w(h) \\neq \\mathbf{0}\\) 对于某些满足 \\(1 \\le h \\le m\\) 的 \\(h\\)，其中 \\\
  (m\\) 是正整数，并且为了简便，我们假设 \\(\\hat{\\boldsymbol{u}}_t\\) 已标准化，因此 \\(\\Gamma_w(h)\\\
  ) 是 \\(\\boldsymbol{w}_t\\) 的滞后-\\(h\\) 自相关矩阵。第一种方法由 Chang et al. (2017) 提出，检验统计量为\n\
  \n\\(T_1(m) = \\sqrt{T} \\times \\max_{1 \\le h \\le m} \\max_{1 \\le i \\le j \\\
  le d} |\\hat{\\gamma}_{w,ij}(h)|, \\quad (6.66)\\)\n\n其中 \\(\\hat{\\gamma}_{w,ij}(h)\\\
  ) 是 \\(\\hat{\\boldsymbol{\\Gamma}}_w(h)\\) 的 \\((i,j)\\) 第个元素。作者表明，在 \\(\\boldsymbol{w}_t\\\
  ) 具有有限四阶矩和原假设下，\\(T_1(m)\\) 的极限分布可以近似为正随机向量的 \\(L_\\infty\\)-范数，因此，模拟可用于获取检验统计量\
  \ \\(T_1(m)\\) 的渐近临界值。有限经验表明，如果 \\(d\\) 适中，该检验统计量表现相当不错。对于较大的 \\(d\\)，该检验统计量需要密集的计算时间。\n\
  \n白噪声检验的第二种方法由 Tsay (2020) 提出。作者不直接使用 \\(\\boldsymbol{w}_t\\)，而是提议使用 \\(\\boldsymbol{w}_t\\\
  ) 的秩序列。对于标量时间序列 \\(y_t\\) 及其实现 \\(\\{y_1, \\dots, y_t\\}\\)，其秩序列是通过用样本中的秩统计量替换 \\\
  (y_t\\) 得到的时间序列。令 \\(\\hat{\\boldsymbol{R}}_w(h)\\) 为 \\(\\boldsymbol{w}_t\\) 的秩序列的滞后-\\\
  (h\\) 样本自相关矩阵。定义\n\n\\(T_{\\max}(h) = \\max_{1 \\le i \\le j \\le d} \\hat{r}_{w,ij}\
  \ \\text{ and } T_{\\min}(h) = - \\min_{1 \\le i \\le j \\le d} \\hat{r}_{w,ij},\\\
  )\n\n其中 \\(\\hat{r}_{w,ij}\\) 是 \\(\\hat{\\boldsymbol{R}}_w(h)\\) 的 \\((i,j)\\)\
  \ 第个元素。注意，\\(T_{\\max}(h)\\) 是 \\(\\boldsymbol{w}_t\\) 在滞后 \\(h\\) 时的最大秩交叉相关，而 \\\
  (-T_{\\min}(h)\\) 是 \\(\\boldsymbol{w}_t\\) 在滞后 \\(h\\) 时的最小秩交叉相关。在 \\(\\boldsymbol{w}_t\\\
  ) 是 \\(d\\) 维白噪声且 \\(\\boldsymbol{\\Gamma}_w(0)\\) 为对角矩阵的原假设下，Tsay (2020) 表明 \\\
  (\\{\\hat{r}_{w,ij}(h)|1 \\le i, j \\le d\\}\\) 渐近独立并服从 \\(N(0, 1)\\) 分布。\\(T_{\\\
  max}(h)\\) 和 \\(T_{\\min}(h)\\) 都是 \\(d^2 N(0, 1)\\) 随机变量的极值，因此它们渐近服从 Gumbel 分布。此外，\\\
  (T_{\\max}(h)\\) 和 \\(T_{\\min}(h)\\) 渐近独立。现在，定义检验统计量\n\n\\(T_2(m) = \\sqrt{T} \\\
  times \\max_{1 \\le h \\le m} \\max \\{T_{\\max}(h), T_{\\min}(h)\\} . \\quad (6.67)\\\
  )\n\n由于在我们的应用中 \\(\\boldsymbol{w}_t\\) 的分量不相关，因此 Tsay (2020) 使用的一个假设自动满足。因此，在 \\\
  (\\boldsymbol{w}_t\\) 具有连续分布且原假设成立的前提下，等式 (6.67) 中的 \\(T_2(m)\\) 渐近遵循独立 Gumbel 分布的乘积，其临界值可得到解析形式。具体而言，设\
  \ \\(\\alpha\\) 为 I 类错误，则若\n\n\\(T_2(m) \\ge c_{d,m} \\times \\chi_{1-\\alpha/2}\
  \ + s_{d,m},\\)\n\n则在 5% 水平上拒绝原假设 \\(H_0\\)，其中 \\(\\chi_{1-\\alpha/2} = -\\ln(-\\\
  ln(1-\\alpha/2))\\) 是标准 Gumbel 分布的 \\((1-\\alpha/2)\\) 分位数，且\n\n$$c_{d,m} = [2 \\\
  ln(d^2 m)]^{-1/2} \\quad \\text{and} \\quad s_{d,m} = \\sqrt{2 \\ln(d^2 m)} - \\\
  frac{\\ln(4\\pi) + \\ln(\\ln(d^2 m))}{2(2 \\ln(d^2 m))^{1/2}}.$$\n\n除了具有解析形式的临界值外，等式\
  \ (6.67) 中的检验统计量 \\(T_2(m)\\) 还有其他一些优点。它不要求 \\(\\boldsymbol{w}_t\\) 存在任何矩（例如柯西分布），并且对\
  \ \\(\\boldsymbol{w}_t\\) 中的异常值具有鲁棒性。\n\n#### 6.10.5 载荷估计的渐近性质\n\n对于两个满足 \\(\\boldsymbol{H}_1'\\\
  boldsymbol{H}_1 = \\boldsymbol{H}_2'\\boldsymbol{H}_2 = \\boldsymbol{I}_r\\) 的 \\\
  (k \\times r\\) 半正交矩阵 \\(\\boldsymbol{H}_1\\) 和 \\(\\boldsymbol{H}_2\\)，\\(\\boldsymbol{H}_1\\\
  ) 和 \\(\\boldsymbol{H}_2\\) 所张列空间之间的差异可通过以下方式度量\n\n$$D(\\boldsymbol{H}_1, \\boldsymbol{H}_2)\
  \ = \\sqrt{1 - \\frac{1}{r} \\text{tr}(\\boldsymbol{H}_1 \\boldsymbol{H}_1' \\boldsymbol{H}_2\
  \ \\boldsymbol{H}_2')}.\\tag{6.68}$$\n\n这里 \\(D(\\boldsymbol{H}_1, \\boldsymbol{H}_2)\
  \ \\in [0, 1]\\)。当且仅当 \\(\\boldsymbol{H}_1\\) 和 \\(\\boldsymbol{H}_2\\) 的两个列空间等价时，其值为零；当且仅当两个列空间互相正交时，其值为\
  \ 1。我们使用该度量来量化因子模型（FM）估计的准确性。例如，我们使用 \\(D(\\widehat{\\boldsymbol{A}}_1, \\boldsymbol{A}_1)\\\
  ) 来衡量使用 \\(\\widehat{\\boldsymbol{A}}_1\\) 估计 \\(\\boldsymbol{A}_1\\) 的一致性。\n\n\
  对于固定的 \\(k\\)，在某些温和条件下（例如 \\(\\boldsymbol{f}_t\\) 和 \\(\\boldsymbol{e}_t\\) 存在某些有限阶矩，以及\
  \ \\(\\boldsymbol{z}_t\\) 和 \\(\\boldsymbol{f}_t\\) 满足某些 \\(\\alpha\\)-混合条件），我们可以推导\
  \ FM 估计量的渐近性质。例如，如预期，\\(D(\\widehat{\\boldsymbol{A}}_1, \\boldsymbol{A}_1) = O(T^{-1/2})\\\
  )。详情可见 Gao 和 Tsay (2019)。对于高维情况，只要 \\(k = o(T^{1/2})\\)，即可得到类似结果。另一方面，当 \\(k\\)\
  \ 和 \\(T\\) 都趋于无穷大时，估计量的极限性质会变得更加复杂。考虑等式 (6.57) 中的模型。我们只关注 \\(\\boldsymbol{f}_t\\\
  ) 和 \\(\\boldsymbol{e}_t\\) 独立的情况。\\(\\boldsymbol{f}_t\\) 与某些 \\(h > 0\\) 的 \\(\\\
  boldsymbol{e}_{t-h}\\) 相关的情况可见 Gao 和 Tsay (2018)。\n\n令 \\(\\boldsymbol{L}_1 = [\\\
  boldsymbol{c}_1, \\dots, \\boldsymbol{c}_r]\\) 和 \\(\\boldsymbol{L}_2 = [\\boldsymbol{c}_{r+1},\
  \ \\dots, \\boldsymbol{c}_k]\\)。随着 \\(k\\) 增加，我们需要一些度量来量化载荷和噪声的强度。\n\n- 1. 条件 A：\\\
  (\\boldsymbol{L}_1\\) 的列满足 \\(j = 1, \\dots, r\\) 时 \\(\\|\\boldsymbol{c}_j\\|_2^2\
  \ \\asymp k^{1-\\delta_1}\\)，且 \\(\\delta_1 \\in [0, 1)\\)，其中 \\(a \\asymp b\\)\
  \ 意味着 \\(a = O(b)\\) 且 \\(b = O(a)\\)。此外，对于每个列 \\(\\boldsymbol{c}_j\\)，\\(\\min_{\\\
  theta_i \\in \\mathcal{K}, i \\neq j} \\|\\boldsymbol{c}_j - \\sum_{1 \\le i \\\
  le r, i \\neq j} \\theta_i \\boldsymbol{c}_i\\|_2^2 \\asymp k^{1-\\delta_1}\\)。\n\
  - 2. 条件 B：\\(\\boldsymbol{L}_2\\) 允许奇异值分解 \\(\\boldsymbol{L}_2 = \\boldsymbol{A}_2\
  \ \\boldsymbol{D}_2 \\boldsymbol{V}_2'\\)，其中 \\(\\boldsymbol{A}_2 \\in \\mathcal{R}^{k\
  \ \\times v}\\) 在等式 (6.58) 中给出，\\(\\boldsymbol{D}_2 = \\text{diag}(d_1, \\dots,\
  \ d_v)\\) 且 \\(\\boldsymbol{V}_2 \\in \\mathcal{R}^{v \\times v}\\) 满足 \\(\\boldsymbol{V}_2'\
  \ \\boldsymbol{V}_2 = \\boldsymbol{I}_v\\)。此外，存在一个有限整数 \\(0 < g < v\\)，使得对于某些 \\\
  (\\delta_2 \\in [0, 1)\\)，\\(d_1 \\asymp \\cdots \\asymp d_g \\asymp k^{(1-\\delta_2)/2}\\\
  ) 且 \\(d_{g+1} \\asymp \\cdots \\asymp d_v \\asymp 1\\)。\n\n条件 A 中的 \\(\\delta_1\\\
  ) 用于量化因子的强度，\\(\\boldsymbol{L}_1 \\boldsymbol{L}_1'\\) 的特征值均为 \\(k^{1-\\delta_1}\\\
  ) 阶。如果 \\(\\delta_1 = 0\\)，相应的因子称为强因子，因为它们包含 \\(\\boldsymbol{c}_j\\) 的每个元素为 \\(O(1)\\\
  ) 的情况。如果 \\(\\delta_1 > 0\\)，相应的因子称为弱因子，且 \\(\\delta_1\\) 越小，因子越强。使用指数 \\(\\delta_1\\\
  ) 的一个优点是将收敛\n\n\n将估计因子的收敛率与因子强度显式联系起来。条件 A 确保 \\(\\boldsymbol{x}_t\\) 中所有公共因子具有相同的强度\
  \ \\(\\delta_1\\)。在实践中，因子可能具有多个强度水平。在这种情况下，载荷矩阵的一致性将取决于最弱因子的强度。为了节省篇幅，我们不在此处考虑此问题。条件\
  \ B 成立有许多充分条件。例如，如果我们允许 \\((\\boldsymbol{c}_{r+1}, ..., \\boldsymbol{c}_{r+g})\\\
  ) 对某些 \\(\\delta_2 \\in (0, 1)\\) 满足条件 A，且 \\((\\boldsymbol{c}_{r+g+1}, ..., \\\
  boldsymbol{c}_k)\\) 的 \\(L_1\\)- 和 \\(L_\\infty\\)- 范数均有限，则条件 B 成立。一种特殊情况是让 \\(\\\
  boldsymbol{c}_{r+g+j}\\) 成为标准单位向量。\\(\\delta_1\\) 与 \\(\\delta_2\\) 之间的约束将在以后不同情形下用于保证估计的一致性。\n\
  \n如果 \\(r\\) 是已知且固定的，Gao 和 Tsay (2018) 表明，在包括条件 A 和 B 以及 \\(\\boldsymbol{f}'_t\\\
  ) 与 \\(\\boldsymbol{e}_t\\) 独立在内的某些条件下，若 \\(kT^{-1/2} = o(1)\\)，则 \\(D(\\widehat{\\\
  boldsymbol{A}}_1, \\boldsymbol{A}_1) = O_p(k^{\\delta_1} T^{-1/2})\\) 且 \\(D(\\\
  widehat{\\boldsymbol{B}}_1, \\boldsymbol{B}_1) = O_p(k^{\\delta_1} T^{-1/2})\\)。因此，若\
  \ \\(\\delta_1 > 0\\)，收敛率比固定 \\(k\\) 的情况更慢。因此，载荷强度影响 FMs 中估计的收敛率。\\(\\boldsymbol{B}_2\\\
  ) 的估计要困难得多。在某些情况下，对于大 \\(k\\) 没有可用的一致估计量。为缓解这一困难，我们估计 \\(\\boldsymbol{B}_2^*\\)，即由矩阵\
  \ \\(\\boldsymbol{S}\\)（公式 (6.65) 中）对应最小的 \\(k-g\\) 个特征值的特征向量所张成的子空间。令 \\(\\widehat{\\\
  boldsymbol{B}}_2^*\\) 由 \\(\\widehat{\\boldsymbol{S}}\\) 对应 \\(k-g\\) 个最小特征值的特征向量组成。然后\
  \ \\(\\widehat{\\boldsymbol{B}}_2\\) 的选择是 \\(\\widehat{\\boldsymbol{B}}_2^*\\) 的一个子空间。在上述条件下，若\
  \ \\(kT^{-1/2} = o(1)\\)，我们也有\n\n```\n\\(D(\\widehat{\\boldsymbol{B}}_2^*, \\boldsymbol{B}_2^*)\
  \ = O_p[k^{2\\delta_2-\\delta_1} T^{-1/2} + k^{\\delta_2} T^{-1/2} + (1 + k^{2(\\\
  delta_2-\\delta_1)}) D(\\widehat{\\boldsymbol{B}}_1, \\boldsymbol{B}_1)]\\).\n```\n\
  \n最后，Gao 和 Tsay (2020) 研究了具有单位根的高维 FMs 的情况。\n\n## 附录 6.A：一些 R 命令\n\n给出了用于通过主成分法估计协方差矩阵最大特征向量、利用两种精度指标计算表\
  \ 6.3 和表 6.4 的命令。\n\n```\nt0 <- proc.time() # start the clock\nN=250\nR0=rep(0,N)\n\
  ANG=rep(0,N)\nCOS=rep(0,N)\n#define the signal to noise ratio with the sd of the\
  \ factor\nfsd=5\nvT=c(100,200,300)\nvk=c(10,20,50,100,200,300,400,500)\ndT=length(vT)\n\
  dk=length(vk)\nTAB1=matrix(0,dT,dk)\nTAB2=matrix(0,dT,dk)\nfor (j in 1:dk) {\nfor\
  \ (t in 1:dT) {\nT=vT[t]\nk=vk[j]\nfor(i in 1:N){\na=rnorm(k*T)\nA=matrix(a,T,k)\n\
  f=rnorm(T)*fsd\n### a general arima model for the factor can be used with\n##f=arima.sim(n=T,list(ar=c(.7)))\n\
  F=matrix(f,T,1)\np=runif(k)\npe=p/sqrt(sum( p ^ 2 ))\nP=matrix(pe,1,k)\nYC=F %*%\
  \ P\nY=YC+A\nS=cov(Y)\nES=eigen(S)\nEV=ES$values\nEVV=ES$vectors\npv=ES$vectors[,1]\n\
  pv=as.matrix(pv,1,k)\nro=abs(cor(pv,pe))\nR0[i]=ro\ncos=abs(sum(pv*pe))\nangr=acos(cos)\n\
  ang=angr*180/pi\nANG[i]=ang\nTAB1[t,j]=mean(R0)\nTAB2[t,j]=mean(ANG) }}\ntf=proc.time()-t0\n\
  ```\n\n## 练习\n\n- 1. 在 DFM \\( z_t = P f_t + a_t \\) 中，其中 \\( P = \\frac{1}{\\sqrt{k}}\
  \ 1 \\) 是一个 \\( k \\times 1 \\) 向量，\\( 1 = (1, \\dots, 1)' \\)，且 \\( a_t \\) 为协方差矩阵\
  \ \\( \\Sigma_a = \\sigma^2 I \\) 的白噪声：(1) 说明系列 \\( c'_j z_t \\)（\\( j = 1, \\dots,\
  \ k - 1 \\)）构成白噪声的线性组合形式；(2) 求这些线性组合的方差。\n\n- 2. 假设 DFM \\( z_t = P f_t + n_t \\\
  )，其中 \\( n_t \\) 遵循对角 VAR 模型。在什么条件下，因子 \\( f_t \\) 是数据的线性组合？因子方差与噪声方差应满足什么关系，才能通过主成分分析获得因子的一致估计？\n\
  \n- 3. 考虑具有一个因子和两个滞后的 GDFM，\\( z_t = P_0 f_t + P_1 f_{t-1} + P_2 f_{t-2} + n_t \\\
  )，其中因子遵循 \\( f_t = \\phi f_{t-1} + u_t \\)。证明该模型可以写为具有一个因子的 DFM，\\( z_t = P^* f_t^*\
  \ + n_t^* \\)，其中 \\( f_t^* = f'_{t-1} + u_t^* \\)。\n\n- 4. 假设 GDFM \\( z_t = P_0\
  \ f_t + P_1 f_{t-1} + a_t \\)（其中 \\( a_t \\) 为白噪声）使用带有一个滞后的 ODPC 估计，且 \\( c_1 =\
  \ c_2 = 1 \\)。证明 \\( z_t \\) 的估计可以表示为 \\( \\hat{z}_t = A_0 z_t + A_1 z_{t-1} + A_2\
  \ z_{t-2} \\)。\n\n- 5. 将 DFM 拟合到文件 CPIEurope2000-15.csv 中的 EUUS（CPI）价格指数。应用变换 VV12\
  \ log zt 和命令 dfmpc 来拟合模型。分析发现的三个因子的性质以及残差的模型。\n\n- 6. 将 DFM 拟合到文件 CPIEurope2000-15.csv\
  \ 中 EUUS（CPI）价格指数的水平数据。应用变换 log(zt) 和命令 dfmpc 来拟合模型。分析发现的第一个因子的性质。取该因子的残差，再次应用 dfmpc\
  \ 命令。将结果与练习 5 中获得的结果进行比较。\n\n- 7. 使用文件 gdpsimple6c8010.txt 中六个国家的 GDP 数据拟合一个 FM。将结果与拟合了\
  \ VAR 模型的示例 3.2 中的结果进行比较。\n\n- 8. 修改附录中给出的命令，以检查主成分法在不同信噪比下估计 EDFM 的精度，并观察该比率下降时精度的下降情况。同时，检查更多因子对估计精度的影响。\n\

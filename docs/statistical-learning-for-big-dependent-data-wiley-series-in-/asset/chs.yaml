  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_294_1.png)\n\nFigure 5.31 脑电图数据在最大判别方向上的投影\n\
  \ndiscrim程序执行所有分析，LDF的平均结果为：样本内8%，样本外13%；LR为：样本内3%，样本外13%。因此，在本例中，两种方法表现相似。\n\n\

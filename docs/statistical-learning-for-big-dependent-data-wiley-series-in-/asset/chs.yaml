  \ 128 个神经元的全连接层，激活函数为 relu。第七层是丢弃率为 0.25 的 dropout 层，最后一层是具有 10 个神经元的全连接输出层，激活函数为\
  \ softmax，与之前相同。生成的网络拥有 600,810 个参数，其中大部分来自第六层的全连接网络。我们也使用分类交叉熵作为损失函数，准则为 rmsprop，与之前相同。卷积网络的训练在五个\

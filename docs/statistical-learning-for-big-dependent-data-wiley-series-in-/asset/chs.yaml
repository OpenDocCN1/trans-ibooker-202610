  - 8. S&P 工业：S&P 普通股价格指数：工业（滞后 3 期），\n- 9. TB3SMFFM：3 个月期国债利率减联邦基金利率（滞后 5 期）\n\n\
  因此，Lasso 回归表明，美国 IPI 的增长率取决于多个部门，包括产出、劳动力市场、库存、利率和股票市场。这似乎是合理的。请注意，阈值 0.04 的选择是任意的。由于预测变量已标准化，我们可以直接比较估计系数的大小\n\

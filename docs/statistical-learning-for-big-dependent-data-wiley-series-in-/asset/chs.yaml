  \ 0.02232\n```\n\n## 3.5 单位根与协整\n\n如在第 2 章中所讨论，如果 \\(w_t = (1 - B)z_t\\) 是一个平稳且可逆过程，则标量时间序列\
  \ \\(z_t\\) 是阶数为 1 的单位根过程。在经济学文献中，\\(z_t\\) 被称为 I(1) 过程，意味着它是阶数为 1 的整合过程。一般来说，如果\
  \ \\(w_t = (1 - B)^d z_t\\) 是平稳且可逆的，则 \\(z_t\\) 是一个 I(d) 过程。I(1) 过程在分析商业和经济时间序列方面起着重要作用。例如，一个经济体的季度\
  \ GDP 通常构成一个 I(1) 过程。同样，大多数股票价格（或对数价格）也是 I(1) 过程。在本节中，我们考虑多变量整合过程，重点关注伪关系和协整的问题。\n\
  \n如果方程 (3.1) 的多变量时间序列 \\(\\mathbf{z}_t\\) 满足 \\(|\\phi(1)| = 0\\) 但 \\(|\\theta(1)|\
  \ \\neq 0\\)，则它是一个整合过程。换句话说，\"1\" 是行列式方程 \\(|\\phi(B)| = 0\\) 的一个解，但不是 \\(|\\theta(B)|\
  \ = 0\\) 的解。整合过程在许多实际应用中存在，尤其是 I(1) 过程，其性质在文献中已得到广泛研究。例如，参见 Phillips (1987)、Chan\
  \ 和 Wei (1988)，以及 Tsay 和 Tiao (1990) 等众多文献。\n\n\n\n\n\n### 3.5.1 伪回归\n\n假设 $z_{1t}$\
  \ 和 $z_{2t}$ 是两个标量 I(1) 过程，我们关注它们的线性关系。为此，常用简单线性回归，即\n\n$z_{2t} = \\alpha + \\beta\
  \ z_{1t} + \\epsilon_t, \\quad (3.63)$\n\n其中 $\\epsilon_t$ 表示误差项。直观上，如果 $\\beta\
  \ \\neq 0$，则两个过程线性相关。因此，常用 $H_0 : \\beta = 0$ 与 $H_a : \\beta \\neq 0$ 的假设检验来进行推断。然而，因为\
  \ $z_{1t}$ 和 $z_{2t}$ 均为 I(1) 过程，$\\beta$ 的最小二乘估计的 t-比率的常规参考分布不适用。使用常规参考分布常常会导致误发现，意味着在\
  \ $H_0$ 为真时过于频繁地拒绝 $H_0$。为了演示，我们生成如下两个独立随机游走序列：\n\n$z_{1t} = z_{1,t-1} + a_{1t},\
  \ \\quad z_{1,0} = 0, \\qquad z_{2t} = z_{2,t-1} + a_{2t}, \\quad z_{2,0} = 0, \\\
  quad t = 1, \\dots, 100,$\n\n其中 $\\{a_{1t}\\}$ 和 $\\{a_{2t}\\}$ 是两个独立标准高斯过程。然后，我们拟合\
  \ Eq. (3.63) 的线性回归。使用常规临界值 1.96，我们列出拒绝原假设 $\\beta = 0$ 的频率。经过 1000 次复制，拒绝 $\\beta\
  \ = 0$ 的经验频率约为 77%，远高于 5% 的 I 类错误。这个简单的模拟清楚地表明，在使用涉及整合过程的线性回归时必须小心。常规检验容易误识别 I(1)\
  \ 过程之间的线性关系，这种现象称为 *伪线性回归*。为了避免伪回归，应始终检查 Eq. (3.63) 线性回归的残差。如果残差序列本身是整合的，则该线性关系是伪的。例如，参见\
  \ Tsay (2014, chapter 5)。\n\n### 3.5.2 向量过程的线性组合\n\n形式 $y_t = b'z_t$ 的向量时间序列的线性组合可能导致一些具有重要应用的有趣标量过程。我们在第\
  \ 1 章中看到，通过将 $b$ 选择为 $z_t$ 协方差矩阵的特征向量之一，我们得到一个主成分。主成分分析 (PCA) 将 $k$ 维的 $z_t$ 分解为一组按方差大小排序的同期不相关序列。我们也可以根据可预测性将\
  \ $z_t$ 分解为一组线性组合。这是 Box 和 Tiao (1977) 提出的方法。假设我们想根据 $z_t$ 的 1 步先行可预测性找到线性组合。如前所述，我们可以将向量时间序列写成\n\
  \n$z_t = z_{t-1}(1) + a_t, \\quad (3.64)$\n\n其中 $z_{t-1}(1)$ 是在预测起点 $t-1$ 对 $z_t$\
  \ 的 1 步先行预测。对 Eq. (3.64) 取方差，得到 $\\Gamma_z(0) = \\Gamma_p(1) + \\Sigma_a$，其中 $\\\
  Gamma_p(1)$ 是 $z_{t-1}(1)$ 的协方差矩阵，$a_t$ 不相关。将 Eq. (3.64) 左乘 $b'$，得到\n\n$y_t = y_{t-1}(1)\
  \ + u_t \\quad (3.65)$\n\n其中 \\( y_{t-1}(1) \\) 是在预测起点 \\( t-1 \\) 对 \\( y_t \\\
  ) 的 1 步先行预测，\\( u_t = b'a_t \\)。由 Eq. (3.65) 得 \\( \\sigma_y^2 = p_y^2 + \\sigma_u^2\
  \ \\)，其中 \\( \\sigma_y^2 = b'\\Gamma_z(0)b \\) 是标量系列 \\( y_t \\) 的方差，\\( \\sigma_u^2\
  \ \\) 是其创新过程的方差，\\( p_y^2 = b'\\Gamma_p(1)b \\) 是解释方差。标量系列 \\( y_t = b'z_t \\) 的可预测性在第\
  \ 2 章中定义为\n\n\\[ \\lambda = \\frac{p_y^2}{\\sigma_y^2} = \\frac{b'\\Gamma_p(1)b}{b'\\\
  Gamma_z(0)b} \\]\n\n而最大可预测性的线性组合可通过求解\n\n\\[ \\frac{\\partial \\lambda}{\\partial\
  \ b} = \\frac{2\\Gamma_p(1)b\\sigma_y^2 - 2\\Gamma_z(0)bp_y^2}{(b'\\Gamma_z(0)b)^2}\
  \ = 0, \\]\n\n得到，这意味着\n\n\\[ \\Gamma_z^{-1}(0)\\Gamma_p(1)b = \\lambda b \\]\n\n\
  且向量 \\( b \\) 必须是矩阵 \\( \\mathbf{M} = \\Gamma_z^{-1}(0)\\Gamma_p(1) \\) 的特征向量，由于特征值衡量可预测性，我们必须选择对应于最大特征值的特征向量。最不可预测的线性组合是由对应于最小特征值的特征向量形成的。该分析可应用于任何预测水平\
  \ \\( h \\)。例如，对于 VAR(1) 模型 \\( \\hat{z}_{t-1}(1) = \\phi z_{t-1} \\, \\Gamma_p(1)\
  \ = \\phi \\Gamma_z(0)\\phi' \\)，且 \\( b \\) 是矩阵\n\n\\[ \\mathbf{M} = \\Gamma_z^{-1}(0)\\\
  phi\\Gamma_z(0)\\phi' \\]\n\n的最大特征值。由于 \\( \\phi = \\Gamma_z(1)\\Gamma_z^{-1}(0)\
  \ \\)，前置矩阵可写为\n\n\\[ \\mathbf{M} = \\Gamma_z^{-1}(0)\\Gamma_z(1)\\Gamma_z^{-1}(0)\\\
  Gamma_z(1)' \\]\n\n这是 \\( z_t \\) 与 \\( z_{t-1} \\) 之间的典型相关矩阵。因此，最大可预测性的线性组合等价于\
  \ \\( z_t \\) 与其过去之间最大典型相关对应的典型变量。有关该结果的一般证明，参见 Velu et al. (1987)。典型相关分析和具有有趣特性的线性组合是构建\
  \ VARMA 模型的一些有用方法（如 SCMs）背后的关键思想。Box 和 Tiao (1977) 举例说明的一个有趣情况是，当向量序列是整合的，但其某些线性组合是平稳的。这就是下一节将讨论的共整合的思想。\n\
  \n### 3.5.3 协整\n\n整合过程的一个重要问题是共整合。考虑两个单变量 I(1) 过程 \\( z_{1t} \\) 和 \\( z_{2t} \\\
  )。如果存在一个非零线性组合 \\( y_t = \\beta_1 z_{1t} + \\beta_2 z_{2t} \\)，它是平稳的，则 \\( z_{1t}\
  \ \\) 和 \\( z_{2t} \\) 是共整合的。线性组合 \\( \\beta = (\\beta_1, \\beta_2)' \\) 称为共整合向量。一般而言，考虑一个\
  \ \\( k \\) 维整合过程 \\( z_t \\)。如果存在非零 \\( k \\) 维向量 \\( \\beta \\) 使得 \\( y_t = \\\
  beta'z_t \\) 是平稳的，则 \\( z_t \\) 是具有共整合向量 \\( \\beta \\) 的共整合过程。如果存在秩为 \\( m \\)\
  \ 的 \\( k \\times m \\) 矩阵 \\( \\beta \\)，使得 \\( m \\) 维过程 \\( y_t = \\beta'z_t\
  \ \\) 是平稳的，则 \\( z_t \\) 是具有共整合秩 \\( m \\) 的共整合过程，且 \\( \\beta \\) 是共整合矩阵。换句话说，\\\
  ( m \\) 是共整合向量的数量。显然，\\( m \\le k \\)。\n\n共整合在经济学和金融学中特别感兴趣，因为它们与经济学中的长期均衡概念以及金融学中的配对交易观念相关。粗略地说，整合过程是不可预测的，但平稳过程是可预测的。共整合意味着，虽然\
  \ \\( z_t \\) 的个别组成部分不可预测，但它们的线性组合 \\( y_t = \\beta' z_t \\) 是可预测的。长期均衡和配对交易利用了整合过程的这种可预测性。有关配对交易的演示，参见\
  \ Tsay (2010)。\n\n### 3.5.4 过度差分\n\n时间序列分析中处理单位根非平稳性的常规方法是取差分。按定义，如果标量系列 \\(z_t\\\
  ) 是 I(1) 过程，则 \\(w_t = (1 - B)z_t\\) 是平稳且可逆的。因此，可以分析 \\(w_t\\) 并产生 1 步先行预测 \\(\\\
  hat{z}_T(1) = E(z_{T+1} | F_T) = z_T + \\hat{w}_T(1)\\)。对于多元情况，情况更为复杂。如果 \\(z_t\\\
  ) 是共整合秩为 \\(m\\) 且 \\(m < k\\) 的共整合过程，则 \\(k\\) 维过程 \\(z_t\\) 中只有 \\(k - m\\) 个单位根。如果考虑\
  \ \\(\\boldsymbol{w}_t = (1 - B)\\boldsymbol{z}_t\\)，即 \\(w_{it} = z_{it} - z_{i,t-1}\\\
  )，则 \\(\\boldsymbol{w}_t\\) 将是不可逆的。为了演示，考虑双变量 ARMA(1,1) 模型\n\n\\(\\boldsymbol{z}_t\
  \ - \\left[ \\begin{array}{rr} 1.05 & -0.05 \\\\ 0.45 & 0.55 \\end{array} \\right]\
  \ \\boldsymbol{z}_{t-1} = \\boldsymbol{a}_t - \\left[ \\begin{array}{rr} -0.05 &\
  \ 0.45 \\\\ 0.45 & -0.05 \\end{array} \\right] \\boldsymbol{a}_{t-1}\\) (3.66)\n\
  \n其中 \\(\\boldsymbol{a}_t\\) 是均值为零且协方差矩阵 \\(\\Sigma_a\\) 为正定的二维白噪声系列。很容易验证，对于 Eq.\
  \ (3.66) 中的模型，\n\n\\(|\\boldsymbol{\\phi}(B)| = (1 - B)(1 - 0.6B), \\quad |\\boldsymbol{\\\
  theta}(B)| = (1 - 0.4B)(1 + 0.5B),\\)\n\n因此 \\(|\\boldsymbol{\\phi}(1)| = 0\\)，但\
  \ \\(|\\boldsymbol{\\theta}(1)| \\neq 0\\)。因此，\\(\\boldsymbol{z}_t\\) 是单位根非平稳的，但可逆的。此外，从\
  \ Eq. (3.66) 还可以很容易地验证，\n\n\\(z_{1t} - z_{2t} = 0.6(z_{1,t-1} - z_{2,t-1}) + (a_{1t}\
  \ - a_{2t}) + 0.5(a_{1,t-1} - a_{2,t-1}).\\)\n\n令 \\(x_t = z_{1t} - z_{2t}\\) 和\
  \ \\(b_t = a_{1t} - a_{2t}\\)，则有\n\n\\(x_t = 0.6x_{t-1} + b_t + 0.5b_{t-1},\\)\n\
  \n这是一个平稳且可逆的时间序列。因此，\\(z_{1t}\\) 和 \\(z_{2t}\\) 是共整合的，共整合向量为 \\((1, -1)'\\)。\n\n\
  接下来，令 \\(\\boldsymbol{w}_t = (1 - B)\\boldsymbol{z}_t\\)，即对每个序列取一阶差分。将 Eq. (3.66)\
  \ 左乘\n\n\\(\\left[ \\begin{array}{rr} 1 - 0.55B & -0.05B \\\\ 0.45B & 1 - 1.05B\
  \ \\end{array} \\right],\\)\n\n我们得到\n\n\\((1 - 0.6B)\\boldsymbol{w}_t = \\left[\
  \ \\begin{array}{rr} 1 - 0.5B - 0.005B^2 & -0.5B + 0.245B^2 \\\\ 0.495B^2 & 1 -\
  \ B - 0.255B^2 \\end{array} \\right] \\boldsymbol{a}_t.\\) (3.67)\n\n\n\n\n\n因此，\\\
  (\\boldsymbol{w}_t\\) 遵循平稳 VARMA(1,2) 模型。然而，由式 (3.67) 可知，若将 \\(\\boldsymbol{w}_t\\\
  ) 的 MA 矩阵多项式记为 \\(\\theta^*(B)\\)，则可见\n\n\\(|\\theta^*(1)| = \\begin{vmatrix} 1\
  \ - 0.5 - 0.005 & -0.5 + 0.245 \\\\ 0.495 & 1 - 1 - 0.255 \\end{vmatrix} = \\begin{vmatrix}\
  \ 0.495 & -0.255 \\\\ 0.495 & -0.255 \\end{vmatrix} = 0.\\)\n\n这意味着 1 是行列式方程 \\\
  (|\\theta^*(B)| = 0\\) 的一个解。因此，\\(\\boldsymbol{w}_t\\) 的 VARMA(1,2) 模型是不可逆的。\n\n\
  对协整向量过程的各个分量进行差分，若其协整秩小于维度，会导致不可逆的 VARMA 模型，在时间序列文献中这被称为 *过度差分*。*过度差分* 会导致对协整过程建模时出现复杂情况。例如，由于\
  \ \\(\\boldsymbol{w}_t\\) 不可逆，它没有有限阶 VAR 近似。因此，在实践中对 \\(\\boldsymbol{w}_t\\) 进行建模以获得良好近似，通常需要高阶\
  \ VAR 模型。另一个复杂之处在于，不可逆模型的似然函数解位于参数空间的边界上，因此常规的 MLE 渐进理论不适用。有兴趣的读者可参阅 Tanaka (2017,\
  \ 第 7 章) 及其中的参考文献。\n\n为避免 *过度差分*，Engle and Granger (1987) 提出了误差修正的思想。详情见下一节。\n\n\
  ## 3.6 误差修正模型\n\n考虑式 (3.1) 中的 VARMA 模型，但假设 1 可能是行列式方程 \\(|\\phi(B)| = 0\\) 的一个解。换句话说，我们假设\
  \ \\(\\boldsymbol{z}_t\\) 可以是 1 阶整合过程。记 \\(\\nabla \\boldsymbol{z}_t = \\boldsymbol{z}_t\
  \ - \\boldsymbol{z}_{t-1} = (I - B)\\boldsymbol{z}_t\\) 为 \\(\\boldsymbol{z}_t\\\
  ) 的一阶差分系列。通过直接的代数运算，例如 Tsay (2014, 第 5 章)，可得\n\n\\(\\nabla \\boldsymbol{z}_t = \\\
  Pi \\boldsymbol{z}_{t-1} + \\sum_{i=1}^{p-1} \\Phi_i^* \\nabla \\boldsymbol{z}_{t-i}\
  \ + \\boldsymbol{c}_0 + \\theta(B)\\boldsymbol{a}_t, \\quad (3.68)\\)\n\n其中 \\(\\\
  Pi = \\sum_{i=1}^p \\Phi_i - I = -\\phi(1)\\)，且对 \\(i = 1, \\dots, p-1\\)，\\(\\\
  Phi_i^* = -(\\phi_{i+1} + \\cdots + \\phi_p)\\)。式 (3.68) 称为整合过程 \\(\\boldsymbol{z}_t\\\
  ) 的 *误差修正模型* (ECM)。注意，该模型是可逆的，因为我们没有改变 MA 矩阵多项式。然而，若 \\(|\\phi(1)| = 0\\)，则系数矩阵\
  \ \\(\\Pi\\) 为奇异矩阵。一般来说，有以下几种情况：\n\n- 若 rank(\\(\\Pi\\)) = 0，则 \\(\\Pi = \\mathbf{0}\\\
  ) 且 \\(\\boldsymbol{z}_t\\) 有 \\(k\\) 个单位根。它不是协整的。\n- 若 rank(\\(\\Pi\\)) = \\(k\\\
  )，则 \\(\\Pi\\) 非奇异且 \\(\\boldsymbol{z}_t\\) 是平稳过程。\n- 若 rank(\\(\\Pi\\)) = \\(m\\\
  ) 且 \\(1 \\le m < k\\)，则 \\(\\boldsymbol{z}_t\\) 有 \\(\\nu = k - m\\) 个单位根且存在 \\\
  (m\\) 个协整向量。在这种情况下，可以写 \\(\\Pi = \\boldsymbol{\\alpha}\\boldsymbol{\\beta}'\\)，其中\
  \ \\(\\boldsymbol{\\alpha}\\) 和 \\(\\boldsymbol{\\beta}\\) 均为秩为 \\(m\\) 的 \\(k \\\
  times m\\) 实值矩阵。令 \\(\\boldsymbol{w}_t = \\boldsymbol{\\beta}'\\boldsymbol{z}_t\\\
  )，它是一个 \\(m\\) 维平稳过程。换句话说，\\(\\boldsymbol{\\beta}\\) 的列是 \\(\\boldsymbol{z}_t\\\
  ) 的协整向量。注意，对任意 \\(m \\times m\\) 正交矩阵 \\(\\boldsymbol{P}\\)，均有 \\(\\boldsymbol{\\\
  alpha}\\boldsymbol{\\beta}' = (\\boldsymbol{\\alpha}\\boldsymbol{P})(\\boldsymbol{P}\\\
  boldsymbol{\\beta})'\\)。因此，若 \\(m > 1\\)，协整向量不是唯一确定的。不过，\\(\\boldsymbol{\\beta}\\\
  ) 的列空间是唯一的。\n\n对于协整过程 \\(\\boldsymbol{z}_t\\)，\\(\\boldsymbol{w}_t\\) 的平稳性通过将模型改写为以下形式即可容易看出\n\
  \\(\\nabla z_t = \\alpha w_{t-1} + \\sum_{i=1}^{p-1} \\phi_i^* \\nabla z_{t-i} +\
  \ c_0 + \\theta(B) a_t. \\tag{3.69}\\)\n\n这里 \\(\\alpha\\) 是满秩且 \\(\\nabla z_t\\\
  ) 是平稳的，因此 \\(\\boldsymbol{w}_t\\) 必须是平稳的，因为平稳过程不能依赖于任何单位根过程。\n\n式 (3.68) 的误差修正模型被称为\
  \ *过渡形式* 的 ECM，因为系数矩阵 \\(\\phi_i^*\\) 表示过渡效应。ECM 的另一种形式如下\n\\(\\nabla z_t = \\Pi\
  \ z_{t-p} + \\sum_{i=1}^{p-1} \\phi_i^* \\nabla z_{t-i} + c_0 + \\theta(B) a_t,\
  \ \\tag{3.70}\\)\n\n其中 \\(\\Pi\\) 保持不变，即 \\(\\Pi = -\\phi(1)\\)，但对 \\(i=1, \\dots,\
  \ p-1\\)，\\(\\phi_i^* = -(\\mathbf{I} - \\phi_1 - \\cdots - \\phi_i)\\)。这些新的 \\\
  (\\phi_i^*\\) 矩阵包含长期累积效应，式 (3.70) 中的 ECM 被称为 *长期形式* 的 ECM。\n\n### 3.6.1 协整检验\n\n\
  检验多元过程中协整向量的存在性（及其数量）在计量经济学文献中被称为 *协整* 检验。文献中有多种可用于协整检验的方法。对于 VAR 模型，最常用的协整检验是 Johansen\
  \ 检验 (Johansen, 1991; Johansen and Juselius, 1990)。该检验可以使用 (3.68) 或 (3.70) 的 ECM\
  \ 进行。在我们的讨论中采用过渡形式，并将式 (3.68) 的 ECM 扩展以包含可能的时间趋势。即，\n\n\\(\\nabla z_t = \\Pi z_{t-1}\
  \ + \\sum_{i=1}^{p-1} \\phi_i^* \\nabla z_{t-i} + d_t + a_t, \\tag{3.71}\\)\n\n\
  其中 \\(d_t = c_0 + c_1 t\\)，\\(c_0\\) 和 \\(c_1\\) 为 \\(k\\) 维实向量，其余系数与式 (3.68) 相同。协整检验随后关注矩阵\
  \ \\(\\Pi\\) 的秩，该秩与 \\(z_{t-1}\\) 和 \\(\\nabla z_t\\) 之间的相关矩阵有关。假设多元正态性，Johansen\
  \ (1991, 1995) 使用 ML 检验来检测 \\(\\Pi\\) 的秩。这本质上基于典型相关分析。具体地，为减轻平稳部分对协整检验的影响，考虑两个初步的多元线性回归\n\
  \n\\(\\nabla z_t = \\sum_{i=1}^{p-1} \\gamma_i \\nabla z_{t-i} + d_t + u_t \\tag{3.72}\\\
  )\n\\(z_{t-1} = \\sum_{i=1}^{p-1} \\gamma_i^* \\nabla z_{t-i} + d_t^* + v_t \\tag{3.73}\\\
  )\n\n其中上标“*”用于 Eq. (3.73) 的系数矩阵，确定性趋势是预先指定的，\\(u_t\\) 和 \\(v_t\\) 分别表示误差项。令 \\(\\\
  hat{u}_t\\) 和 \\(\\hat{v}_t\\) 分别为 Eqs. (3.72) 和 (3.73) 的 OLS 估计残差。然后，考虑多元线性回归\n\
  \n\\(\\hat{u}_t = \\Pi \\hat{v}_t + \\epsilon_t, \\quad (3.74)\\)\n\n其中 \\(\\epsilon_t\\\
  ) 是误差项。对于 Eqs. (3.71) 和 (3.74)，\\(\\Pi\\) 的最小二乘估计是等价的。因此，在多元正态性假设下，可以通过检验 \\(\\\
  hat{u}_t\\) 和 \\(\\hat{v}_t\\) 之间的典型相关系数来检查 \\(\\Pi\\) 的秩。令 \\(\\lambda_1^2 \\ge\
  \ \\lambda_2 \\ge \\cdots \\ge \\lambda_k^2\\) 为 \\(\\hat{u}_t\\) 和 \\(\\hat{v}_t\\\
  ) 之间按顺序排列的平方典型相关系数。Johansen (1991) 考虑了用于识别 rank(\\(\\Pi\\)) 的两种检验统计量。\n\n对 \\(m\
  \ = 0, \\dots, k-1\\)，考虑原假设 \\(H(m): \\text{Rank}(\\Pi) = m\\) 与备择假设 \\(H_a : \\\
  text{rank}(\\Pi) > m\\)。检验统计量为\n\n\\(L_{tr}(m) = -(T - kp) \\sum_{i=m+1}^k \\ln(1\
  \ - \\lambda_i^2), \\quad (3.75)\\)\n\n其中 \\(T\\) 为样本量，\\(p\\) 为 VAR 阶数，\\(k\\)\
  \ 为维度。该检验的思想是，在原假设 \\(H(m)\\) 下，\\(\\text{rank}(\\Pi) = m\\)，因此 \\(\\hat{u}_t\\\
  ) 和 \\(\\hat{v}_t\\) 之间最大的 \\(m\\) 个典型相关系数为正，而其余 \\(k - m\\) 个典型相关系数为零。该检验统计量被称为迹检验。与平稳情况不同，\\\
  (L_{tr}(m)\\) 在 \\(H(m)\\) 下的极限分布不是卡方分布。它是标准布朗运动的函数。详情见 Johansen (1991) 和 Tsay (2014,\
  \ 第 5 章) 及其中的参考文献。在实践中，\\(L_{tr}(m)\\) 的渐进临界值通过模拟获得。\n\nJohansen (1991) 考虑的第二个检验统计量涉及以下检验\n\
  \n\\(H_0 : \\text{Rank}(\\Pi) = m \\quad \\text{vs} \\quad \\text{Rank}(\\Pi) =\
  \ m + 1.\\)\n\n在这种情况下，检验统计量为\n\n\\(L_{\\max}(m) = -(T - kp) \\ln(1 - \\lambda_{m+1}^2).\
  \ \\quad (3.76)\\)\n\n该检验统计量称为最大检验。类似地，\\(L_{\\max}(m)\\) 的极限分布也不是卡方分布，而是标准布朗运动的函数。\n\
  \n一旦协整向量的数量 \\(m\\) 确定，\\(\\hat{u}_t\\) 和 \\(\\hat{v}_t\\) 之间典型相关分析中与最大的 \\(m\\\
  ) 个特征值 \\(\\{\\lambda_i^2 | i = 1, \\dots, m\\}\\) 相关的特征向量可用于估计协整向量。\n\n### 示例 3.4\n\
  \n考虑 1952 年 5 月至 2019 年 6 月的月度 Moody's 老牌 Aaa 和 Baa 债券收益率。数据可从圣路易斯联邦储备银行的 FRED 获取，如图\
  \ 3.14 所示。从图中看，两种债券收益率大致同步波动，偶尔有偏离。\n\n为演示协整检验，我们从标量单位根检验开始。对于 Aaa 债券收益率，选用 AR(3)\
  \ 模型，增广 Dickey-Fuller 检验值为 \\(-0.45\\)。与 1% 或 5% 的临界值相比，不能拒绝单位根原假设。对于 Baa 债券收益率，选用\
  \ AR(2) 模型，增广 Dickey-Fuller 检验统计量为 \\(-0.40\\)，同样，这未能拒绝单位根\n\n\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_175_0.png)\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_175_1.png)\n\n零假设。因此，这两个债券收益率序列中的每一个似乎都是单位根非平稳的。\n\
  \n联合考虑这两个序列。AIC 为这两个序列选定了 VAR(8) 模型。Johansen 检验统计量显示 \\( L_{max}(0) = 27.19 \\)\
  \ 和 \\( L_{max}(1) = 2.01 \\)。与其临界值相比，检验统计量显示 Rank(\\(\\Pi\\)) = 1，这意味着两个债券收益率序列是协整的。这并不奇怪，因为两个债券收益率之间任何显著且持续的偏离都会导致套利机会。如果使用跟踪统计量，检验统计量为\
  \ \\( L_{tr}(0) = 29.20 \\) 和 \\( L_{tr}(1) = 2.01 \\)，同样得出协整的相同结论。协整向量为 \\( (1,\
  \ -0.926)' \\)。图 3.15 显示了两个债券收益率协整序列的时间图。该序列的平稳性很明显，除了 2008 年金融危机期间的大幅下跌。\n\n###\

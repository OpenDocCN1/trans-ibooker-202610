  ## 1.6 序列依赖的影响


  在前面的章节中，我们介绍了一些大型依赖数据的示例和随机过程的一些基本概念。在本节中，我们使用一些简单示例来说明，为独立数据分析开发的统计方法在应用于依赖数据时可能会遇到困难。


  如前所述，PCA 最初是为独立数据提出的，PCA 的样本版本也适用于依赖数据。令 \( y_t = P''z_t \) 为向量过程 \( z_t \) 的主成分，其中
  \( P \) 是由 \( z_t \) 的样本协方差矩阵的特征向量组成的正交正规变换矩阵。根据正交性，当 \( i \neq j \) 时，有 \( \text{Cov}(y_{it},
  y_{jt}) = 0 \)。即，主成分在瞬时上不相关。对于独立数据，当 \( j \neq 0 \) 时，\( \text{Cov}(z_t, z_{t-j})
  = 0 \)。因此，对于独立数据，主成分 \( y_t \) 在瞬时上和序列上都不相关。因此，在这种情况下，如果分析关注数据的前两个矩，我们可以分别分析每个分量
  \( y_{it} \)。特别是，在高斯假设下，主成分是相互独立的。


  转到依赖数据。诚然，主成分 \( y_t \) 在瞬时上不相关，但它们可能在动态上（或序列上）相关。为了演示，图 1.23 显示了图 1.7 中40个价格指数的增长率的
  \( y_{2t} \) 和 \( y_{3t} \) 的自相关图和互相关图。这两个主成分在图 1.22 中所示。从相关图来看，\( y_{2t} \) 和 \(
  y_{3t} \) 在序列上相关，因此必须联合分析。因此，依赖数据的 PCA 与独立数据的 PCA 可能存在显著差异。事实上，Zhang 和 Tong (2020)
  表明 (a) 静态且序列相关的向量时间序列的样本协方差矩阵的特征值是渐近相关的，(b) 这些特征值对所有特征向量渐近依赖。另一方面，对于独立数据，(a) 特征值和特征向量渐近独立，(b)
  在某些条件下特征值渐近不相关。


  转到为大型独立数据提出的统计方法。最常用的检验统计量之一是单样本 t 检验，用于检验标量随机变量的均值是否为零。对于观测数据集 \(\{z_1, \dots,
  z_T\}\)，计算检验统计量


  ```

  \(t = \frac{\bar{z}}{\sqrt{s^2/T}},\) (1.26)

  ```


  其中 \(\bar{z} = \sum_{t=1}^T z_t / T\) 是样本均值，\(s^2 = \sum_{t=1}^T (z_t - \bar{z})^2
  / (T - 1)\) 是样本方差。对于 i.i.d. 样本，式 (1.26) 的 t 统计量渐近服从 \(N(0, 1)\) 分布，因此可以进行统计推断。另一方面，假设
  \(z_t\) 服从 AR(1) 模型，即 \(z_t = \phi_0 + \phi_1 z_{t-1} + a_t\)，其中 \(\phi_0\) 为常数，\(\phi_1
  \neq 0\)，\(\{a_t\}\) 为标量白噪声系列。那么，式 (1.26) 中的检验统计量不再渐近服从 \(N(0, 1)\) 分布，因为可以轻松验证
  \(\text{Var}(\sqrt{T}\bar{z})\) 随 \(T \to \infty\) 收敛到 \(\text{Var}(z_t) \times
  \frac{1+\phi}{1-\phi}\)。因此，在这种情况下应使用的适当检验统计量是


  ```

  \(t_{dep} = \frac{\bar{z}}{\sqrt{s^2(1+\phi)/[T(1-\phi)]}}.\) (1.27)

  ```


  由式 (1.26) 和 (1.27) 得 \(t = t_{dep} \times \sqrt{(1+\phi)/(1-\phi)}\)，因此 t 和 t_dep
  可能存在显著差异，表明忽略序列依赖可能导致单样本 t 检验的错误推断。例如，如果 \(\phi = 0.9\)，则 \(t = t_{dep} \times \sqrt{19}\)；若
  \(\phi = -0.9\)，则 \(t = t_{dep} / \sqrt{19}\)。另一个例子是，近年来广泛用于分析大数据的统计方法是 Tibshirani
  (1996) 的 Lasso 回归。该方法强调稀疏性，即使在样本量小于变量数量时也适用。该方法及其扩展的详细内容将在第 7 章介绍。Lasso 最初是为独立数据开发的。这里我们使用一个简单的模拟示例来演示，当
  Lasso 回归应用于序列依赖数据时可能会失效。



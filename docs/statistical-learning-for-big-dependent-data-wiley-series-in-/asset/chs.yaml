  \ mean(R_test == Yhat2)\n```\n\n### 示例 8.6\n\n为演示深度学习（DL）在经济数据分析中的应用，我们重新使用了来自 FRED\
  \ 的月度宏观经济数据集。数据跨度为 1959 年 1 月至 2019 年 4 月。由于存在缺失值，且为实现平稳性使用了多种变换（如前文所述），我们使用 710\
  \ 个观测值和 122 个变量。同样，我们使用 IP 指数的增长率作为因变量，并使用所有变量的滞后 1 至滞后 6 项作为预测变量。因此，我们的有效样本量为 704，预测变量为\
  \ 732 个。我们进一步将数据分为 (a) 包含 504 个观测值的训练子样本和 (b) 包含 200 个观测值的预测子样本。\n\n首先，作为基准模型，我们使用标量\
  \ AR(12) 模型。拟合模型为\n\n```\ny_t = 0.0014 + 0.264y_{t-1} + 0.136y_{t-2} + 0.133y_{t-3}\
  \ + 0.080y_{t-4} - 0.12y_{t-5}\n- 0.011y_{t-6} + 0.018y_{t-7} + 0.01y_{t-8} + 0.11y_{t-9}\
  \ - 0.01y_{t-10}\n- 0.002y_{t-11} - 0.089y_{t-12} + a_t, σ_a = 0.0068.\n```\n\n\
  该模型对数据拟合效果相当好。例如，残差的 Ljung-Box 统计量显示 Q(24) = 22.55，p 值为 0.55。对于测试子样本，该 AR 模型的 RMSE、平均绝对误差（MAE）和中位数绝对误差（MedAE）分别为\
  \ 0.0065、0.0046 和 0.0037。\n\n其次，考虑 DL。我们对训练子样本的预测变量进行标准化，使每个预测变量的均值为 0，方差为 1。然后，我们基于训练子样本中预测变量的均值和标准误，对测试子样本的预测变量进行了转换。变换的详细信息见附带的\
  \ R 演示。我们尝试了一些 DL 模型，得到的最佳模型如下：这是一个具有六层的神经网络（NN）。第一层是含有 64 个神经元的全连接层，拥有 46,912 个参数。第二层是丢弃率为\
  \ 0.4 的 Dropout 层，第三层也是含有 16 个神经元的全连接层。其后是另一个丢弃率为 0.25 的 Dropout 层。第五层是含有四个神经元的全连接层，最终输出层具有一个神经元和简单的线性激活函数。其他所有全连接层均采用\
  \ ReLU 作为激活函数。总体而言，该网络共有 48,025 个参数。图 8.17 显示了该网络在训练子样本上经过 100 个轮次的收敛图。损失函数和平均绝对误差均以\
  \ 0.2 的交叉验证率显示。图表表明训练已收敛。对于测试子样本，该网络的 RMSE、MAE 和 MedAE 分别为 0.0070、0.0047 和 0.0036。这些结果与\
  \ AR(12) 模型的结果基本相同。我们尝试的其他 DL 模型的结果见表 8.2。从表中可以看出，DL 的性能似乎相对稳定，除了第一个拥有 103,137 个参数的模型外。\n\

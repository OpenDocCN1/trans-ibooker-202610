  \ |\n\n## 3.3 向量移动平均模型\n\n当 p = 0 时，Eq. (3.1) 中的模型简化为\n\n```\nz_t = c_0 + θ(B)a_t,\
  \ (3.55)\n```\n\n这是一个阶数为 q 的向量移动平均 (VMA) 模型。\nVMA 模型可出现在许多情形中。\n例如，对独立的时间平滑\n\n\n\
  数据会引入短期序列相关性。考虑一个白噪声过程 \\(\\boldsymbol{a}_t\\)。对两个连续观测值求平均，例如 \\(\\boldsymbol{z}_t\
  \ = (\\boldsymbol{a}_t + \\boldsymbol{a}_{t-1})/2\\)，会引入滞后-1 序列相关性，从而得到一个 VMA(1)\
  \ 模型。另一个例子是带有测量误差的随机游走，常见于资产价格建模。假设 \\(z_t = z_{t-1} + a_t\\)，其中 \\(a_t\\) 是白噪声序列，但我们观测\
  \ \\(y_t = z_t + \\epsilon_t\\)，其中 \\(\\epsilon_t\\) 表示一个独立的测量误差。那么，\\(w_t \\equiv\
  \ y_t - y_{t-1} = a_t + \\epsilon_t - \\epsilon_{t-1}\\)，它遵循一个 MA(1) 模型。\n\n###\
  \ 3.3.1 VMA 模型的性质\n\n公式 (3.55) 中 VMA($q$) 模型的性质易于推导和理解。首先，过程 \\(\\boldsymbol{z}_t\\\
  ) 是平稳的，且 \\(E(\\boldsymbol{z}_t) = \\boldsymbol{c}_0\\)。其次，\\(\\boldsymbol{z}_t\\\
  ) 的自协方差矩阵为\n\n\\[\n\\begin{aligned}\n\\boldsymbol{\\Gamma}_z(0) &= \\boldsymbol{\\\
  Sigma}_a + \\sum_{i=1}^q \\boldsymbol{\\theta}_i \\boldsymbol{\\Sigma}_a \\boldsymbol{\\\
  theta}'_i \\\\\n\\boldsymbol{\\Gamma}_z(\\ell) &= \\sum_{i=\\ell}^q \\boldsymbol{\\\
  theta}_i \\boldsymbol{\\Sigma}_a \\boldsymbol{\\theta}'_{i-\\ell}, \\quad \\text{where\
  \ } \\boldsymbol{\\theta}_0 = -\\boldsymbol{I}, \\quad \\ell = 1, \\dots, q, \\\
  tag{3.56} \\\\\n\\boldsymbol{\\Gamma}_z(\\ell) &= \\boldsymbol{0}, \\quad \\ell\
  \ > q. \\tag{3.57}\n\\end{aligned}\n\\]\n\n由公式 (3.56) 和 (3.57) 可知，VMA($q$) 模型最多有\
  \ $q$ 个非零自相关矩阵，在文献中该模型被称为有限记忆模型。\n\n如果行列式方程 \\(|\\boldsymbol{\\theta}(B)| = 0\\\
  ) 的所有零点的绝对值均大于 1，则 \\(\\boldsymbol{z}_t\\) 具有 VAR 表示式\n\n\\[\n\\boldsymbol{z}_t\
  \ = \\boldsymbol{\\phi}_0 + \\boldsymbol{a}_t + \\sum_{i=1}^\\infty \\boldsymbol{\\\
  pi}_i \\boldsymbol{z}_{t-i}, \\tag{3.58}\n\\]\n\n其中 \\(\\boldsymbol{\\phi}_0\\)\
  \ 是由 \\([\\boldsymbol{\\theta}(1)]^{-1} \\boldsymbol{c}_0\\) 给出的常数向量，系数矩阵 \\(\\\
  boldsymbol{\\pi}_i\\) 由 \\(\\boldsymbol{\\pi}(B) = \\boldsymbol{I} - \\sum_{i=1}^\\\
  infty \\boldsymbol{\\pi}_i \\boldsymbol{B}^i\\) 确定，使得 \\([\\boldsymbol{\\pi}(B)]^{-1}\
  \ = \\boldsymbol{\\theta}(B)\\)。更具体地说，\n\n\\[\n\\boldsymbol{\\pi}_i = \\sum_{j=1}^{\\\
  min(i,q)} \\boldsymbol{\\theta}_j \\boldsymbol{\\pi}_{i-j}, \\quad i > 0.\n\\]\n\
  \n不难看出，当 \\(i \\to \\infty\\) 时，\\(\\boldsymbol{\\pi}_i \\to \\boldsymbol{0}\\)。任何在公式\
  \ (3.58) 中具有有意义 VAR 表示式的 VMA 模型被称为 *可逆的*。\n\n最后，对于一个 $k$ 维 VMA($q$) 模型和任何满秩矩阵 \\\
  (\\boldsymbol{C}_{g \\times k}\\)，\\(\\boldsymbol{w}_t = \\boldsymbol{C}\\boldsymbol{z}_t\\\
  ) 是一个 $g$ 维 VMA($q$) 过程。特别是，\\(\\boldsymbol{z}_t\\) 的任何分量 $z_{it}$ 都是一个标量 MA($q$)\
  \ 过程。\n\n### 3.3.2 VMA 建模\n\n对于给定的 VMA 过程实现 \\(\\{\\boldsymbol{z}_t | t = 1, \\\
  dots, T\\}\\)，可以通过检查样本自相关矩阵并借助某些序列相关性 Portmanteau 检验来确定阶数 $q$。此外，人们通常采用 ML 方法来估计指定的\
  \ VMA 模型。估计通常比较耗时，因为它涉及非线性优化。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_158_0.png)\n\
  \n图 3.9 1962 年 1 月至 2018 年 12 月五个市场指数简单收益率的时间图。\n\n为了演示 VMA 模型，我们考虑了 1962 年 1 月至\
  \ 2018 年 12 月间某些美国市场指数的月度简单收益率，共 684 个观测值。所考虑的市场指数是 NYSE/AMEX/NASDAQ 的市值 1 至 5 组合投资组合，数据由证券价格研究中心（CRSP）获得。图\
  \ 3.9 显示了所用五个市场指数收益率的时间图。如预期，除了少数异常观测值外，这些序列都是弱平稳的。在以下内容中，我们使用 R 的 MTS 包进行分析。\n\n\
  令 \\( z_t = (z_{1t}, ..., z_{5t})' \\) 为月度收益率序列。阶数选择选出一个 VMA(12) 模型，但 \\( z_t \\\

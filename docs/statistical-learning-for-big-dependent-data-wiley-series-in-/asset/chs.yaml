  \ keras。\n\n### 8.4.4 LSTM 的应用\n\n为演示 LSTM 的应用，我们考虑著名的电影评论数据集 **IMDB**，该数据集也可从 **keras**\
  \ 包中获取。因变量是二进制的“1”或“0”（赞成或反对），预测变量由评论者的评论组成。遵循该数据集常用的方法，我们对每条评论使用恰好 100 个单词。如果一条评论少于\
  \ 100 个单词，则用编码为零的特殊单词进行填充。对预测变量的此类预处理可以使用该包的命令 `pad_sequences` 来完成。由于评论中的单词是相连的，RNN\
  \ 和 LSTM 似乎很有用。我们首先用 RNN 开始分析。随后使用 LSTM 网络，以便评估 LSTM 的贡献。该数据集包含 5736 条评论，我们使用前 4000\
  \ 条作为训练子样本，最后 1736 条作为测试子样本。预处理预测变量所使用的命令在附带的 R 演示中给出。\n\n请记住，**keras** 具有许多内置网络层，我们使用顺序方法来构建网络。同样，有关更多细节，读者可参阅该包的文档和\
  \ vignettes。对于 RNN，我们首先使用一个嵌入层将数据整理成形状为 (100,32) 的数组。然后我们使用一个 reshape 层，以确保数据能够通过网络被正确处理。接下来是一个丢弃率为\
  \ 0.25 的 dropout 层，以简化训练。我们使用 flatten 层来嵌入数据。接下来，我们应用一个具有 128 个神经元的 dense 层，激活函数为\
  \ `relu`（整流线性单元）。随后是另一个丢弃率为 0.25 的 dropout 层，以简化计算。最后，输出层是一个具有一个神经元和 sigmoid 激活函数的\
  \ dense 层。之所以如此，是因为我们的响应变量是二进制的。得到的 RNN 具有 425,857 个参数。\n\n我们使用二元交叉熵作为损失函数、残差均方误差作为准则来训练\
  \ RNN。由于不同评论者的措辞各不相同，我们使用较小的学习率 0.00025。该学习率曾被 **kerasR** 包使用，尽管我们无法运行该包。我们以批量大小\
  \ 32 和 0.1 的验证分割训练网络 30 个 epoch。图 8.15 显示了 30 个 epoch 的收敛情况。从图中可以看出，误差随 epoch 数量递减，但交叉验证表明我们可能应该更早停止。训练后，损失约为\
  \ 0.075。对于测试子样本，我们得到以下结果：\n\n```\n> table(R_test, Rhat)\n   Rhat\nR_test   0   1\n\
  \  0  608  193\n  1  180  755\n```\n\n| | 0 | 1 |\n|---|---|---|\n| 0 | 608 | 193\
  \ |\n| 1 | 180 | 755 |\n\n> mean(R_test == Rhat)\n[1] 0.7851382\n\n这表明所采用的 RNN 对电影评论的成功率约为\
  \ 78.5%。\n\n接下来看 LSTM 网络。我们对 RNN 进行了几处修改。(a) 我们用具有 32 个神经元的 LSTM 层替换 flatten 层。(b)\
  \ 我们将 dense 层增加到 256 个神经元。(c) 我们移除输出层之前的 dropout 层。所得到的\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_479_0.png)\n\
  \n图 8.15 IMDB 数据集训练子样本（由前 4000 条评论组成）中 RNN 的收敛情况。\n\n得到的 LSTM 网络具有 33,025 个参数，远小于\
  \ RNN 的参数数量。我们使用相同的损失函数和准则，但仅训练 LSTM 网络 10 个 epoch。图 8.16 显示了 LSTM 网络在 10 个 epoch\
  \ 中的收敛情况。在此情况下，样本内和交叉验证曲线继续下降，表明我们可以稍微延长训练时间或使用更大的交叉验证率。我们进行了几次实验，但样本外\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_479_1.png)\n\
  \n图 8.16 IMDB 数据集训练子样本（由前 4000 条评论组成）中 LSTM 的收敛情况。\n\n预测似乎相似。对于测试子样本，LSTM 网络显示以下结果：\n\
  \n```\n> table(R_test,Yhat2)\n     Yhat2\nR_test  0  1\n   0 650 150\n   1 135 800\n\
  ```\n\n| | 0 | 1 |\n|---|---|---|\n| 0 | 650 | 150 |\n| 1 | 135 | 800 |\n\n> mean(R_test==Yhat2)\n\
  [1] 0.8358295\n\n这表明成功率为 83.6%，高于 RNN 网络。因此，在这种情况下，LSTM 似乎很有帮助。\n\n### RNN 和 LSTM\

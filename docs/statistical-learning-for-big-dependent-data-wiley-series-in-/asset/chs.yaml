  > abline(h=1)\n> lines(trend[,3],trend[,2],lty=3,lwd=2)\n>##\n>plot(STdata,\"acf\"\
  ,ID=\"3810\")\n>alpha.lm<- estimateBetaFields(STdata)#estimate alpha (called beta\
  \ in R)\n>names(alpha.lm)\n```\n\n\n\n#[1] \"beta\" \"beta.sd\"\n\n#### 使用 plotrix\
  \ 包准备绘图。\n>require(plotrix)\n>head(row.names(alpha.lm$beta))\n#[1] \"13865\" \"\

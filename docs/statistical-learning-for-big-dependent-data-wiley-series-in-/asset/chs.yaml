  \ IPI 的增长率，预测变量由所有变量的前六个滞后值组成。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_411_1.png)\n\
  \n**Figure 7.21** 月度宏观经济数据集主成分数量与赤池信息量准则 (AIC) 的对比。因变量是 IPI 的增长率，预测变量由所有变量的前六个滞后值组成。\n\

- "# 7 基于大规模依赖数据的预测\n\n设 \\( y_t \\) 为感兴趣的标量变量，\\( \\boldsymbol{x}_t = (x_{1t}, \\\
  dots, x_{kt})' \\) 为 \\( k \\) 个解释变量的集合，其中可能包含 \\( y_t \\) 的某些滞后值。本章关注在给定 \\( \\\
  { \\boldsymbol{x}_1, \\dots, \\boldsymbol{x}_n \\} \\) 的情况下预测 \\( y_{n+h} \\) 的问题，其中\
  \ \\( n \\) 为预测原点，\\( h > 0 \\) 为预测步距。为便于表述，令 \\( F_n \\) 为时间 \\( t=n \\) 时可用的信息。从数学上讲，\\\
  ( F_n \\) 表示由 \\( \\{ \\boldsymbol{x}_1, \\dots, \\boldsymbol{x}_n \\} \\) 生成的 \\\
  ( \\sigma \\)-字段。我们的目标是研究条件分布 \\( p(y_{n+h}|F_n) \\)。这是一个老旧的预测问题，文献中有许多统计方法可用。然而，在当前数据丰富的环境中，近年来发展出了几种有趣的方法。我们在第\
  \ 6 章中介绍了基于动态因子模型的一些这些方法。在本章中，我们讨论并展示几种其他新发展。所考虑的方法包括 (a) 正则化线性模型，(b) 扩散指数（DI）或主成分回归（PCR），(c)\
  \ 偏最小二乘法，和 (d) 提升算法。对于正则化方法，我们讨论最小绝对收缩和选择算子（Lasso）及其各种扩展。我们还介绍了关于依赖数据 Lasso 方法的一些最新进展。对于提升算法，我们讨论用于预测的\
  \ \\( \\ell_2 \\) 提升算法以及一些用于分类的提升算法。最后，我们介绍了用于预测的混频数据抽样（MIDAS）方法以及用于更新预测的即时预测（nowcasting）理念。后者利用高频数据来更新对较低频率感兴趣变量的预测。例如，一国的国内生产总值（GDP）通常按季度发布。使用即时预测，一旦季度第一个月过去且月度变量数据可用，就可以修订\
  \ GDP 预测。神经网络、基于树的方法（如随机森林）和机器学习将在下一章中讨论。\n\n本章的讨论与文献中可用的传统方法存在一定偏差，因为我们关注依赖数据，并强调预测器数量\
  \ \\( k \\) 较大（甚至大于样本量 \\( T \\) 或预测原点 \\( n \\)）的情况。然而，请记住，本章讨论的大多数现代方法是为独立数据开发的，因此在某些情况下我们可能从该假设出发。对依赖数据的扩展将在后面给出（如有）。\n\
  \n然而，将为独立数据开发的方法应用于依赖数据时必须谨慎。众所周知，如果忽略序列相关性和高多重共线性，可能导致错误的推断。参见第 1 章和第 7.2 节的讨论。此外，当\
  \ \\( k > \\min\\{n, T\\} \\) 时，构建预测模型需要一些正则化。我们从短程依赖数据开始讨论，即所涉变量的序列依赖性以指数速率衰减至零。强序列依赖性的情况将在后面的章节中简要讨论。\n\
  \n## 7.1 正则化线性模型\n\n统计学的一项重要最新进展是在稀疏性假设下进行正则化估计，尤其是 Lasso（Tibshirani, 1996）。本章关注问题的线性回归模型可写为\n\
  \n$y_{t+h} = \\mathbf{x}'_t \\boldsymbol{\\beta} + e_t = \\sum_{i=1}^k \\beta_i\
  \ x_{it} + e_t, \\quad t = 1, \\dots, n$ (7.1)\n\n其中预测步距 \\( h \\) 是给定且固定的，\\( \\\
  boldsymbol{\\beta} \\) 是参数向量。为简化记号，可理解 \\( \\mathbf{x}_t \\) 可能包含 1 向量。在应用中，每个预测器\
  \ \\( x_{it} \\) 进行均值调整并标准化为单位方差。这种标准化对独立数据效果良好，但当数据具有强序列相关性时可能会遇到困难。我们将在第 7.2 节中给出一些细节。对于正则化线性模型，人们估计未知参数，并利用估计值及预测器的值来获得预测。\n\
  \n用矩阵-向量记号，Eq. (7.1) 的线性回归模型变为\n\n$\\mathbf{Y} = \\mathbf{X}\\boldsymbol{\\beta}\
  \ + \\mathbf{E},$ (7.2)\n\n其中 \\( \\mathbf{Y} \\) 是 \\( n \\) 维响应向量，\\( \\mathbf{X}\
  \ \\) 是设计矩阵，其第 \\( i \\) 行是 \\( \\mathbf{x}'_i \\)，\\( \\mathbf{E} \\) 是误差向量。\n\n\
  在传统线性回归分析中，假设 (a) 误差 \\( e_1, \\dots, e_n \\) 是均值为零、方差为 \\( \\sigma_e^2 \\) 的独立同分布（i.i.d.）随机变量，(b)\
  \ \\( e_i \\) 与 \\( \\mathbf{x}_t \\) 独立，(c) 预测器 \\( \\mathbf{x}_i \\) 满足 \\( E(\\\
  mathbf{x}_i \\mathbf{x}'_i) \\) 为正定的条件。我们将在后面放宽这些条件。\n\n如果 \\( k \\) 远小于 \\( n \\\
  )，则可以使用普通最小二乘法（LS）来估计 Eq. (7.1) 中的模型。估计值为 \\( \\hat{\\boldsymbol{\\beta}} = (\\\
  sum_{t=1}^n \\mathbf{x}_t \\mathbf{x}'_t)^{-1} \\sum_{t=1}^n \\mathbf{x}_t y_{t+h}\
  \ \\)。此外，有\n\n\\(\\sqrt{n}(\\hat{\\boldsymbol{\\beta}} - \\boldsymbol{\\beta}) \\\
  to_d N \\left[ \\mathbf{0}, \\sigma_e^2 \\left( \\sum_{i=1}^n \\mathbf{x}_i \\mathbf{x}'_i\
  \ \\right)^{-1} \\right],\\)\n\n\n其中 \\(\\rightarrow_d\\) 表示分布收敛。有关 \\(\\widehat{\\\
  boldsymbol{\\beta}}\\) 性质的详细信息，读者可参阅，例如，Seber and Lee (2003)。\n\n另一方面，如果 \\(k \\\
  ge n\\)，则 LS 估计不唯一，并且会对数据过拟合。需要某种形式的正则化。Tibshirani (1996) 的 Lasso 估计量使用 \\(\\ell_1\\\
  )-罚项来实现此目标。对于给定的罚参数（或调参数）\\(\\lambda > 0\\)，Lasso 估计量 \\(\\widehat{\\boldsymbol{\\\
  beta}}(\\lambda)\\) 由以下公式给出：\n\n$$\n\\widehat{\\boldsymbol{\\beta}}(\\lambda) =\
  \ \\arg \\min_{\\boldsymbol{\\beta}} \\left( \\frac{\\|\\mathbf{Y} - \\mathbf{X}\\\
  boldsymbol{\\beta}\\|_2^2}{n} + \\lambda \\|\\boldsymbol{\\beta}\\|_1 \\right),\
  \ \\quad (73)\n$$\n\n其中 \\(\\|\\mathbf{Y} - \\mathbf{X}\\boldsymbol{\\beta}\\|_2^2\
  \ = \\sum_{t=1}^n (y_{t+h} - \\mathbf{x}'_t \\boldsymbol{\\beta})^2\\) 且 \\(\\|\\\
  boldsymbol{\\beta}\\|_1 = \\sum_{i=1}^k |\\beta_i|\\)。请注意，为方便起见，在 Lasso 文献中，预测变量通常被标准化，使得\
  \ \\(\\sum_{t=1}^n x_{it} = 0\\) 且 \\(\\sum_{i=1}^n x_{it}^2 = 1\\) 对 \\(i = 1,\
  \ \\dots, k\\) 成立。此外，还假设因变量已进行均值调整，即 \\(\\bar{Y} = \\sum_{i=1}^n y_{t+h} / n = 0\\\
  )。\n\nLasso 的 \\(\\ell_1\\)-罚项具有多种良好特性。首先，公式 (73) 的目标函数是凸的，因此可以使用高效计算方法来获得 Lasso\
  \ 估计量，包括坐标下降法和 Efron et al. (2004) 的最小角回归。有关更多细节，请参见，例如，Giraud (2015, chapter 4)。其次，\\\
  (\\ell_1\\)-几何（隐含线性约束）使 Lasso 能够执行变量选择，即某些估计 \\(\\widehat{\\beta}_i\\) 通常恰好为零。可以证明，公式\
  \ (73) 的优化问题等价于\n\n$$\n\\widehat{\\boldsymbol{\\beta}}_{\\text{primal}}(R) = \\\
  arg \\min_{\\boldsymbol{\\beta}: \\|\\boldsymbol{\\beta}\\|_1 \\le R} \\frac{\\\
  |\\mathbf{Y} - \\mathbf{X}\\boldsymbol{\\beta}\\|_2^2}{n}, \\quad (74)\n$$\n\n其中\
  \ (73) 中的罚参数 \\(\\lambda\\) 与 (74) 中的 \\(R\\) 存在一一对应关系。这种对应关系可能取决于数据。有关详情，请参见，例如，Bertsekas\
  \ (1995, chapter 5)。在具有线性目标函数和线性约束的线性规划中，众所周知，解必须出现在顶点或单纯形上。当存在许多变量时，其中几个变量高度相关，公式\
  \ (74) 中针对这些变量的二次函数的等高线将近似为线性，解通常位于顶点。通过这种方式，Lasso 可以执行变量选择。文献中，仅少数系数 \\(\\beta_i\\\
  ) 非零的假设被称为 *稀疏性假设*。当 \\(k \\ge n\\) 时，稀疏性条件在数据分析中发挥着重要作用。\n\n为了进一步说明 Lasso 的变量选择特性，假设所有变量均被标准化为零均值和单位方差，且所有\
  \ \\(\\beta_i\\) 系数均为正。对公式 (73) 关于每个系数 \\(\\beta_i\\) 求导，可得\n\n$$\n\\frac{\\partial\
  \ \\widehat{\\boldsymbol{\\beta}}(\\lambda)}{\\partial \\boldsymbol{\\beta}} = 0\
  \ \\Rightarrow \\boldsymbol{\\beta} = (\\mathbf{X}'\\mathbf{X})^{-1}[\\text{Cov}(\\\
  mathbf{X}, y) - \\mathbf{1}\\lambda^*],\n$$\n\n其中 \\(\\lambda^* = \\lambda n / 2\\\
  ) 且 \\(\\text{Cov}(\\mathbf{X}, y) = \\mathbf{X}'\\mathbf{y}\\)。因此，令 \\(\\lambda^*\
  \ = \\text{Cov}(x_i, y)\\) 会使 \\(\\beta_i\\) 的估计值为零。因此，如果我们有一组相关预测变量，例如 \\(\\mathbf{x}\\\
  )，且它们在 \\(\\text{Cov}(\\mathbf{x}, y)\\) 中具有相近的值，\\(\\lambda^* = \\text{Cov}(\\\
  mathbf{x}, y)\\) 会使大部分相应的 \\(\\beta_i\\) 系数等于零。\n\n正则化还有其他可用的罚函数。例如，当使用 \\(\\ell_2\\\
  )-罚项时，会得到著名的岭回归，即\n\n$$\n\\widehat{\\boldsymbol{\\beta}}_{\\text{ridge}}(\\lambda)\
  \ = \\arg \\min_{\\boldsymbol{\\beta}} \\left( \\frac{\\| \\mathbf{Y} - \\mathbf{X}\
  \ \\boldsymbol{\\beta} \\|_2^2}{n} + \\lambda \\| \\boldsymbol{\\beta} \\|_2^2 \\\
  right). \\tag{7.5}\n$$\n\n请参见 Hoerl (1962)。\\(\\ell_2\\) 罚项也称为 Tikhonov 正则化。\n\n\
  可以证明，这些正则化可以解释为具有不同先验的贝叶斯估计量；请参见，例如，Hastie et al. (2009, 2015)。有关相关工作，另请参见 Taddy\
  \ (2017)。\n\n在应用正则化回归时，一个重要问题是罚参数 \\(\\lambda\\) 的选择。较小的罚项会导致过拟合，而较大的罚项（如 \\(\\\
  lambda = \\infty\\)）会导致所有 \\(i\\) 的 \\(\\beta_i = 0\\)。在文献中，对于独立数据，如第 5 章所述，可以使用交叉验证（CV）来选择\
  \ \\(\\lambda\\)，例如 10 折交叉验证。粗略地说，将数据集 \\(S = \\{(y_{t+h}, \\mathbf{x}_t)|t=1, \\\
  dots, n\\}\\) 随机划分为 10 个子样本，例如 \\(S_1, \\dots, S_{10}\\)。令 \\(S_{(i)}\\) 为除子样本 \\\
  (S_i\\) 之外的所有数据。即，\\(S_{(i)} = \\cup_{j \\neq i}^{10} S_j\\)。令 \\(\\{\\lambda_j\
  \ | j=1, \\dots, m\\}\\) 为 \\(\\lambda\\) 的一组可能取值，并令 \\(\\text{SSE}(\\lambda_j)\\\
  ) 为罚参数 \\(\\lambda_j\\) 下定义的平方预测误差之和。CV 过程如下：\n\n- 1. 对于每个 \\(\\lambda_j (j=1, \\\
  dots, m)\\)\n  - (a) 初始化 \\(\\text{SSE}(\\lambda_j) = 0\\)\n  - (b) 对 \\(i=1, \\\
  dots, 10\\):\n    - 使用数据 \\(S_{(i)}\\) 拟合带有罚项 \\(\\lambda_j\\) 的 Lasso 模型\n    -\
  \ 使用拟合参数和 \\(S_i\\) 中的预测变量预测响应\n    - 计算子样本 \\(S_i\\) 的预测误差\n    - 通过添加子样本 \\(S_i\\\
  ) 的平方预测误差之和来更新 \\(\\text{SSE}(\\lambda_j)\\)\n- 2. 通过 \\(\\lambda = \\arg \\min_{\\\
  lambda_j} \\text{SSE}(\\lambda_j)\\) 选择 \\(\\lambda\\)\n\n此过程通常用于大多数 Lasso 回归软件包中。但是，当数据为序列相关时，这种\
  \ CV 的有效性值得商榷。我们稍后将讨论在数据为序列相关时选择罚参数 \\(\\lambda\\) 的一些方法。\n\n### 7.1.1 Lasso 估计量的性质\n\
  \n在本节中，我们简要概述了当公式 (7.3) 的误差 \\(e_t\\) 满足通常线性回归假设时 Lasso 估计量的一些重要特性。这里预测变量的数量 \\\
  (k\\) 可能大于预测起点 \\(n\\)（或样本量 \\(T\\)），因此可以将 \\(k\\) 视为 \\(n\\) 的函数，讨论的渐近特性适用于 \\\
  (n \\to \\infty\\)。读者可参阅 Bühlmann and van de Geer (2011) 以了解更多细节以及 Lasso 估计量的其他理论特性。\n\
  \n我们先引入一些记号。对于两个实数列 \\(\\{a_n\\}\\) 和 \\(\\{b_n\\}\\)，如果 \\(a_n/b_n \\to 0\\) 当\
  \ \\(n \\to \\infty\\)，则称 \\(a_n = o(b_n)\\)；如果存在常数 \\(c\\) 和 \\(C\\)，使得对所有足够大的\
  \ \\(n\\) 都有 \\(c \\le a_n/b_n \\le C\\)，则称 \\(a_n \\asymp b_n\\)。此外，定义 \\(\\boldsymbol{\\\
  beta}\\) 的 \\(q\\) 阶范数为 \\(\\|\\boldsymbol{\\beta}\\|_q = \\big(\\sum_{i=j}^k |\\\
  beta_j|^q\\big)^{1/q}\\)。\n\n为了介绍 Lasso 估计量的基本特性，考虑线性模型\n\n$$\ny_i = \\sum_{j=1}^k\
  \ \\beta_j x_{i,j} + \\epsilon_i, \\quad i = 1, \\dots, n, \\quad (7.6)\n$$\n\n\
  其中设计矩阵 \\(X\\) 是固定的，误差向量 \\(\\epsilon = (\\epsilon_1, \\dots, \\epsilon_n)' \\sim\
  \ N(0, \\sigma_e^2 \\mathbf{I})\\)。假设公式 (7.6) 中的线性模型为真实模型，并将真实参数向量表示为 \\(\\beta^0\\\
  )。如果 \\(n > k\\)，\\(X\\) 满秩，且 LS 估计量 \\(\\hat{\\beta} = (X'X)^{-1}(X'Y)\\) 具有各种良好特性。此外，\n\
  \n$$\n\\|X(\\hat{\\beta} - \\beta^0)\\|_2^2/\\sigma_e^2 \\sim \\chi_k^2,\n$$\n\n\
  其中 \\(\\chi_k^2\\) 表示自由度为 \\(k\\) 的卡方分布。因此，\n\n$$\nE\\|X(\\hat{\\beta} - \\beta^0)\\\
  |_2^2/n = \\frac{\\sigma_e^2}{n}k.\n$$\n\n这意味着，在重新参数化使得 \\(X\\) 的列正交后，每个参数 \\(\\\
  beta_j^0\\) 的估计平方精度为 \\(\\sigma_e^2/n\\)，\\(j = 1, \\dots, k\\)。\n\n考虑 \\(k > n\\\
  ) 的情况。这里需要一定的限制。可以证明（Bühlmann and van de Geer, 2011），对于 Lasso 估计量 \\(\\hat{\\beta}\\\
  )，我们有\n\n$$\n\\frac{\\|X(\\hat{\\beta} - \\beta^0)\\|_2^2}{n} \\le C \\|\\beta^0\\\
  |_1 \\sqrt{\\log k/n},\n$$\n\n因此，如果 \\(\\|\\beta^0\\|_1\\) 的非零系数数量少于 \\(\\sqrt{n/\\\
  log k}\\)，例如 \\(\\|\\beta^0\\|_1 = o(\\sqrt{n/\\log k})\\)，则当 \\(k\\) 和 \\(n\\)\
  \ 都趋于无穷大时，Lasso 估计量是一致的。令\n\n$$\nS_0 = \\{j | \\beta_j^0 \\neq 0\\}\n$$\n\n作为真实非零系数的索引集合，且\
  \ \\(s_0 = |S_0|\\) 为 \\(\\beta^0\\) 的非零系数数量。在文献中，\\(s_0\\) 是 \\(\\beta^0\\) 的 *稀疏性指数*，\\\
  (S_0\\) 可以视为线性模型 (7.6) 的 *活跃集*。如果已知 \\(S_0\\)，则可以简单地选择与非零参数相关的 \\(X\\) 的列来进行分析。但在实际中，\\\
  (S_0\\) 是未知的。在使用适当选择的罚参数 \\(\\lambda\\)（阶数为 \\(\\sigma_e \\sqrt{\\log(k)n}\\)）的正则化估计下，我们有\
  \ *奥拉克尔不等式*，关于该概念的示例请参见 Candes (2006)，Lasso 估计量满足\n\n$$\n\\frac{\\|X(\\hat{\\beta}\
  \ - \\beta^0)\\|_2^2}{n} \\le c \\frac{\\sigma_e^2 \\log(k)}{n} s_0, \\quad (7.7)\n\
  $$\n\n以较大的概率成立，其中常数 \\(c\\) 通过格拉姆矩阵 \\(\\hat{\\Sigma} = X'X/n\\) 依赖于 \\(k\\) 或 \\\
  (n\\)。与 \\(k < n\\) 的情况相比，我们在不等式中添加了因子 \\(\\log(k)\\)。\n\n接下来，考虑公式 (7.6) 的线性模型。根据\
  \ Lasso 估计量的定义，我们有\n\n$$\n\\|Y - X\\hat{\\beta}\\|_2^2/n + \\lambda \\|\\hat{\\\
  beta}\\|_1 \\le \\|Y - X\\beta^0\\|_2^2/n + \\lambda \\|\\beta^0\\|_1.\n$$\n\n因此，通过改写\
  \ \\(Y - X\\hat{\\beta} = (Y - X\\beta^0) - X(\\hat{\\beta} - \\beta^0)\\)，我们有以下基本不等式\n\
  \n$$\n\\|X(\\hat{\\beta} - \\beta^0)\\|_2^2/n + \\lambda \\|\\hat{\\beta}\\|_1 \\\
  le 2\\epsilon' X(\\hat{\\beta} - \\beta^0)/n + \\lambda \\|\\beta^0\\|_1. \\quad\
  \ (7.8)\n\n\n\n\n\n术语 $2e'X(\\hat{\\beta} - \\beta^0)$ 被称为问题的 *经验过程*。也就是说，它是问题的随机部分，并且可以由所涉及参数的\
  \ $\\ell_1$ 范数如下界定：\n\n$2|e'X(\\hat{\\beta} - \\beta^0)| \\le \\left( \\max_{1 \\\
  le j \\le k} 2|e'X_{\\cdot j}| \\right) \\|\\hat{\\beta} - \\beta^0\\|_1,$\n\n其中\
  \ $X_{\\cdot j}$ 表示 $X$ 的第 $j$ 列。惩罚的思路是支配问题的经验过程。因此，定义\n\n$F = \\left\\{ \\max_{1\
  \ \\le j \\le k} 2|e'X_{\\cdot j}|/n \\le \\lambda_0 \\right\\}, \\quad (7.9)$\n\
  \n这里我们假设 $\\lambda > 2\\lambda_0$，以确保在集合 $F$ 上可以消除问题的随机部分。令 $\\hat{\\sigma}_j^2$\
  \ 为 $\\hat{\\Sigma} = X'X/n$ 的 $(j,j)$ 个元素，即第 $j$ 个预测变量方差的估计。以下结果证实集合 $F$ 并不小。\n\
  \n#### 引理 7.1\n假设对 $j = 1, \\dots, k$ 均有 $\\hat{\\sigma}_j = 1$。则，对于所有 $t > 0$ 以及\
  \ $\\lambda_0 = 2\\sigma_e \\sqrt{\\frac{t^2+2\\log(k)}{n}}$，有\n\n$P(F) \\ge 1 -\
  \ 2 \\exp(-t^2/2).$\n\n#### 证明：\n在假设 $\\hat{\\sigma}_j = 1$ 下，变量 $U_j = e'X_{\\\
  cdot j}/(\\sqrt{n\\sigma_e^2})$ 服从 $N(0,1)$ 分布。因此，\n\n$P\\left( \\max_{1 \\le j\
  \ \\le k} |U_j| > \\sqrt{t^2+2\\log(k)} \\right) \\le 2k \\exp\\left[ -\\frac{t^2+2\\\
  log(k)}{2} \\right] = 2 \\exp\\left( \\frac{-t^2}{2} \\right).$\n\n利用基本不等式和引理 7.1，可以得到\
  \ Lasso 估计器的一致性。\n\n#### 定理 7.1\n假设对所有 $j$ 均有 $\\hat{\\sigma}_j = 1$。对于 $t > 0$，令惩罚参数为\n\
  \n$\\lambda = 4\\hat{\\sigma}_e \\sqrt{\\frac{t^2+2\\log(k)}{n}},$\n\n其中 $\\hat{\\\
  sigma}_e$ 是误差 $\\epsilon_i$ 的标准误 $\\sigma_e$ 的估计值。那么，以至少 $1 - \\alpha$ 的概率，其中 $\\\
  alpha = 2 \\exp[-t^2/2] + P(\\hat{\\sigma}_e \\le \\sigma_e)$，\n\n$2\\|X(\\hat{\\\
  beta} - \\beta^0)\\|_2^2 \\le 3\\lambda\\|\\beta^0\\|_1.$\n\n参见 Bühlmann 与 van de\
  \ Geer (2011) 的推论 6.1。它指出，对于 Eq. (76) 中的线性模型，选取阶数为 $\\sqrt{\\log(k)/n}$ 的惩罚（或正则化）参数\
  \ $\\lambda$，并假设真实参数 $\\beta^0$ 的 $\\ell_1$ 范数阶数小于 $\\sqrt{n/\\log(k)}$，则可得到 Lasso\
  \ 估计器的一致性结果。\n\n当设计矩阵是随机的，即 $X$ 由随机变量组成时，也可以得到相同结果。一般来说，令\n\n$\\Sigma_X = \\begin{cases}\
  \ X'X/n, & \\text{if the design is fixed,} \\\\ \\text{Cov}(x_t), & \\text{if the\
  \ design is random.} \\end{cases}$\n\n在误差分布满足某些温和正则性条件且惩罚参数 \\(\\lambda\\) 被适当选取（例如\
  \ \\(\\lambda \\asymp \\sqrt{\\log(k)/n}\\)）的情况下，Lasso 估计器的一致性如下：\n\n\\([\\hat{\\\
  beta}(\\lambda) - \\beta^0]'\\Sigma_X[\\hat{\\beta}(\\lambda) - \\beta^0] = o_p(1),\
  \ \\quad n \\to \\infty, \\qquad (7.10)\\)\n\n若设计是固定的且基本稀疏性假设\n\n\\(s_0 = \\|\\\
  beta^0\\|_0 = o \\left( \\sqrt{\\frac{n}{\\log(k)}} \\right) \\qquad (7.11)\\)\n\
  \n成立。若设计是随机的，只要真实参数满足\n\n\\(\\|\\beta^0\\|_1 = o((n / \\log(n))^{1/4}). \\qquad\
  \ (7.12)\\)\n\n，则 Eq. (7.10) 的一致性结果仍然成立。\n\n参见 Greenshtein 与 Ritov (2004) 以及 Bartlett\
  \ 等人 (2012)。\n\n令 \\(S\\) 成为 \\(\\{1, \\dots, k\\}\\) 的一个子集，即 \\(S \\subset \\{1,\
  \ \\dots, k\\}\\)。令 \\(\\beta_S\\) 为一个 \\(k\\) 维向量，其第 \\(j\\) 个元素若 \\(j \\in S\\\
  ) 则为 \\(\\beta_j\\)，否则为 \\(0\\)。同样，令 \\(\\beta_{S^c}\\) 为一个 \\(k\\) 维向量，其第 \\(j\\\
  ) 个元素若 \\(j \\notin S\\) 则为 \\(\\beta_j\\)，否则为 \\(0\\)，其中 \\(S^c\\) 表示 \\(S\\) 相对于\
  \ \\(\\{1, \\dots, k\\}\\) 的补集。显然，\\(\\beta = \\beta_S + \\beta_{S^c}\\)。我们可以进一步考察\
  \ Lasso 估计器的性质。\n\n#### 引理 7.2\n在 Eq. (7.9) 的集合 \\(F\\) 上且 \\(\\lambda > 2\\lambda_0$\
  \ 时，有\n\n\\(2\\|X(\\hat{\\beta} - \\beta^0)\\|_2^2/n + \\lambda\\|\\hat{\\beta}_{S^c}\\\
  |_1 \\le 3\\|\\hat{\\beta}_{S_0} - \\beta_{S_0}\\|_1.\\)\n\n该引理可通过基本不等式和三角不等式得到。参见\
  \ Bühlmann 与 van de Geer (2011) 的引理 6.3。由引理 7.2 可得\n\n\\(\\|\\hat{\\beta}_{S^c}\\\
  |_1 \\le 3\\|\\hat{\\beta}_{S_0} - \\beta_{S_0}\\|_1.\\)\n\n对于 Eq. (76) 的线性模型，若存在\
  \ \\(\\phi_0 > 0$ 使得对所有满足 \\(\\|\\beta_{S^c}\\|_1 \\le 3\\|\\beta_{S_0}\\|_1$ 的\
  \ \\(\\beta\\)，不等式条件\n\n\\(\\|\\beta_{S_0}\\|_1^2 \\le (\\beta' \\hat{\\Sigma} \\\
  beta) s_0 / \\phi_0^2 \\qquad (7.13)\\)\n\n成立，则称对于集合 \\(S_0$ 满足 *兼容性条件*。注意，不等式中的系数\
  \ 3 相当任意，但在文献中常被采用。它可以替换为任何大于 1 的常数。若将 \\(\\|\\beta_{S_0}\\|_1^2$ 替换为其上界 \\(s_0\\\
  |\\beta_{S_0}\\|_2^2$，则此兼容性条件与文献中常见的对 \\(\\hat{\\Sigma}$ 最小特征值的条件相似。在实际中，\\(S_0$\
  \ 未知，因此无法验证兼容性条件。若已知 \\(S_0$ 的基数 \\(s_0$，则可以通过检查基数为 \\(s_0$ 的 \\(\\{1, \\dots, k\\\
  }$ 的所有子集来验证该条件，从而得到 Bickel 等人 (2009) 的 *受限特征值假设*。\n\n#### 定理 7.2\n假设对于 \\(S_0$ 兼容性条件成立。则在集合\
  \ \\(F\\) 上且 \\(\\lambda \\ge 2\\lambda_0$ 时，有\n\n\\(\\|X(\\hat{\\beta} - \\beta^0)\\\
  |_2^2/n + \\lambda\\|\\hat{\\beta} - \\beta^0\\|_1 \\le 4\\lambda^2 s_0 / \\phi_0^2.\\\
  )\n\n参见 Bühlmann 与 van de Geer (2011) 的定理 6.1。定理 7.2 的结果给出了两个误差界。首先，\\(\\|X(\\widehat{\\\
  boldsymbol{\\beta}} - \\boldsymbol{\\beta}^0)\\|_2^2/n \\le 4\\lambda^2 s_0 / \\\
  phi_0^2\\) 为线性回归预测误差。其次，\\(\\|\\widehat{\\boldsymbol{\\beta}} - \\boldsymbol{\\\
  beta}^0\\|_1 \\le 4\\lambda s_0 / \\phi_0^2\\) 为 \\(\\ell_1$ 估计误差。\n\n最后，我们陈述 Bühlmann\
  \ 与 van de Geer (2011) 中关于 Lasso 估计器的另外两个性质。首先，在设计矩阵 \\(\\boldsymbol{X}$ 的兼容性条件和线性模型的稀疏性\
  \ \\(s_0$ 下，可以证明当 \\(\\lambda$ 位于阶数为 \\(\\lambda \\asymp \\sqrt{\\log(k)/n}$ 的合适范围内时，有\n\
  \n\\(\\|\\widehat{\\boldsymbol{\\beta}}(\\lambda) - \\boldsymbol{\\beta}^0\\|_q\
  \ \\to_p \\mathbf{0}, \\quad n \\to \\infty,\\)\n\n其中 \\(\\to_p$ 表示收敛于概率，\\(q \\\
  in \\{1, 2\\}$。其次，若要使用 Lasso 估计器进行变量选择，则需要一些相当严格的条件。定义\n\n\\(\\widehat{S}(\\lambda)\
  \ = \\{j | \\widehat{\\beta}_j(\\lambda) \\neq 0, j = 1, \\dots, k\\} (7.14)\\)\n\
  \n为 \\(\\widehat{\\boldsymbol{\\beta}}(\\lambda)$ 中非零元素的索引集。为了进行适当的变量选择，我们希望随着样本量（或预测原点）\\\
  (n$ 增加，\\(P(\\widehat{S}(\\lambda) = S_0) \\to 1$。为此，需要对设计矩阵 \\(\\boldsymbol{X}$\
  \ 满足某些条件。同样，令 \\(\\widehat{\\boldsymbol{\\Sigma}} = \\boldsymbol{X}'\\boldsymbol{X}/n$\
  \ 且不失一般性地假设 \\(\\boldsymbol{\\beta}$ 的前 \\(s_0$ 个元素非零。将 \\(\\widehat{\\boldsymbol{\\\
  Sigma}}$ 分区如下\n\n\\(\\widehat{\\boldsymbol{\\Sigma}} = \\left[ \\begin{array}{cc}\
  \ \\widehat{\\boldsymbol{\\Sigma}}_{11} & \\widehat{\\boldsymbol{\\Sigma}}_{12}\
  \ \\\\ \\widehat{\\boldsymbol{\\Sigma}}_{21} & \\widehat{\\boldsymbol{\\Sigma}}_{22}\
  \ \\end{array} \\right],\\)\n\n其中 \\(\\widehat{\\boldsymbol{\\Sigma}}_{11}$ 是一个\
  \ \\(s_0 \\times s_0$ 矩阵，\\(\\widehat{\\boldsymbol{\\Sigma}}_{22}$ 是一个 \\((k - s_0)\
  \ \\times (k - s_0)$ 矩阵，而 \\(\\widehat{\\boldsymbol{\\Sigma}}_{12}$ 的维度为 \\((s_0,\
  \ k - s_0)$。*不可表征条件* 为\n\n\\(\\|\\widehat{\\boldsymbol{\\Sigma}}_{21} \\widehat{\\\
  boldsymbol{\\Sigma}}_{11}^{-1} \\text{sign}(\\boldsymbol{\\beta}_1^0, \\boldsymbol{\\\
  beta}_2^0, \\dots, \\boldsymbol{\\beta}_{s_0}^0)\\|_\\infty \\le \\theta, \\quad\
  \ 0 < \\theta < 1, (7.15)\\)\n\n其中 \\(\\|\\mathbf{x}\\|_\\infty = \\max_j |x_j|$\
  \ 且 \\(\\text{sign}(\\boldsymbol{\\beta}_1^0, \\boldsymbol{\\beta}_2^0, \\dots,\
  \ \\boldsymbol{\\beta}_{s_0}^0) = [\\text{sign}(\\beta_1^0), \\text{sign}(\\beta_2^0),\
  \ \\dots, \\text{sign}(\\beta_{s_0}^0)]'$。参见 Zhao 与 Yu (2006)。在假设 *不可表征条件* 且非零系数满足\n\
  \n\\(\\inf_{j \\in S_0} |\\beta_j^0| \\gg \\sqrt{s_0 \\log(k)/n},\\)\n\n的情况下，Meinshausen\
  \ 与 Bühlmann (2006) 表明，对于适当选取的 \\(\\lambda \\gg \\sqrt{\\log(k)/n}$，\n\n\\(P(\\\
  widehat{S}(\\lambda) = S_0) \\to 1, \\quad n \\to \\infty.\\)\n\n本节的推导简洁，可能难以理解。然而，核心信息很明确。在设计矩阵性质、误差项以及预测变量与误差之间交叉依赖性满足某些正则性条件的前提下，只要选取合适的惩罚参数\
  \ \\(\\lambda$，就能得到 Lasso 回归的良好结果。对于强稀疏性情况（即 \\(\\boldsymbol{\\beta}^0$ 中非零真实系数的数量有限）尤其如此。\n\
  \n### 7.1.2 Lasso 回归的一些扩展\n\n在有限样本中，Lasso 估计器可能包含偏差。此外，在某些应用中，领域知识或过去经验可能提供某些信息\n\
  \n\n回归系数向量 \\(\\beta\\)。例如，感兴趣的问题可能包含函数或参数 \\(\\beta_j\\) \\((j = 1, ..., k)\\)\
  \ 的一个子集。为了扩展 Lasso 方法的适用性，已经提出了各种扩展，在本节中我们介绍其中一些。\n\n#### 7.1.2.1 自适应 Lasso\n\n\
  在 Lasso 应用中，选择惩罚参数 \\(\\lambda\\) 非常重要。常用的交叉验证（CV）方法基于预测。对于变量选择，经验表明 Lasso 倾向于选择过多变量。为了缓解这一过度选择问题，Zou\
  \ (2006) 提出了自适应 Lasso，这是一种两阶段程序，根据权重为每个系数分配不同的惩罚，如下所示。\n\n\\[\n\\widehat{\\boldsymbol{\\\
  beta}}_{\\text{adapt}}(\\lambda) = \\arg \\min_{\\boldsymbol{\\beta}} \\left( \\\
  | \\mathbf{Y} - \\mathbf{X} \\boldsymbol{\\beta} \\|_2^2 / n + \\lambda \\sum_{j=1}^k\
  \ \\frac{|\\beta_j|}{|\\widehat{\\beta}_{\\text{ini},j}|} \\right), \\quad (7.16)\n\
  \\]\n\n其中 \\(\\widehat{\\beta}_{\\text{ini},j}\\) 表示 \\(\\beta_j\\) 的一个初始估计量。在实践中，通常采用带有交叉验证的常规\
  \ Lasso 估计来选择惩罚参数。将选定的惩罚表示为 \\(\\lambda_{\\text{ini},cv}\\)，并可使用 \\(\\widehat{\\\
  beta}_j(\\lambda_{\\text{ini},cv})\\) 作为初始估计 \\(\\widehat{\\beta}_{\\text{ini},j}\\\
  ) 来运行自适应 Lasso。第二阶段 Lasso 的惩罚参数也通过交叉验证选择。当然，在第二阶段，如果 \\(\\widehat{\\beta}_{\\text{ini},j}\
  \ = 0\\)，则 \\(\\widehat{\\beta}_{\\text{adapt},j} = 0\\)。自适应 Lasso 的一个良好特性是，不同的初始估计会导致在第二阶段分析中使用不同的惩罚。较大的\
  \ \\(\\widehat{\\beta}_{\\text{ini},j}\\) 意味着对 \\(\\widehat{\\beta}_{\\text{adapt},j}\\\
  ) 较小的惩罚，而较小的 \\(\\widehat{\\beta}_{\\text{ini},j}\\) 意味着较重的惩罚，使得该参数更容易被估计为零，从而减少第二阶段估计中选定变量的数量。\n\
  \n#### 7.1.2.2 组 Lasso\n\n在某些应用中，数据可能包含某些因子结构，而组 Lasso 正是为此情况设计的。它在第 4 章中被引入，用于检测自回归（AR）过程中的参数变化。现在，假设\
  \ \\(k\\) 个预测变量被分为 \\(g\\) 个组。具体来说，假设 \\(G_1, ..., G_g\\) 构成 \\(\\{1, ..., k\\}\\\
  ) 的一个划分。即，\\(\\cup_{i=1}^g G_i = \\{1, ..., k\\}\\) 且当 \\(i \\neq j\\) 时 \\(G_i\
  \ \\cap G_j = \\emptyset\\)。此外，令 \\(\\boldsymbol{\\beta}_{G_i}\\) 为 \\(G_i\\) 中变量的参数向量。令\
  \ \\(\\| \\boldsymbol{\\beta}_{G_i} \\|_2\\) 为 \\(\\boldsymbol{\\beta}_{G_i}\\)\
  \ 的通常欧几里得范数，其中 \\(i = 1, ..., g\\)。组 Lasso 估计量定义为\n\n\\[\n\\widehat{\\boldsymbol{\\\
  beta}}_g(\\lambda) = \\arg \\min_{\\boldsymbol{\\beta}} \\left( \\| \\mathbf{Y}\
  \ - \\mathbf{X} \\boldsymbol{\\beta} \\|_2^2 / n + \\lambda \\sum_{j=1}^g m_j \\\
  | \\boldsymbol{\\beta}_{G_j} \\|_2 \\right), \\quad (7.17)\n\\]\n\n其中 \\(m_j\\)\
  \ 是一个常数，例如 \\(m_j = \\sqrt{n_j}\\)，其中 \\(n_j\\) 是组 \\(G_j\\) 的基数。显然，组 Lasso 同时考虑每个组中的所有参数。根据\
  \ \\(\\lambda\\)，\\(G_i\\) 中变量的参数向量要么全为零，要么所有元素都非零。请注意，如果 \\(g = k\\) 使得所有组都只包含单个变量，则通过令\
  \ \\(\\| \\boldsymbol{\\beta}_{G_i} \\|_2 = \\| \\boldsymbol{\\beta}_{G_i} \\|_1\\\
  )，组 Lasso 退化为标准 Lasso。组 Lasso 由 Yuan and Lin (2006) 提出。如果对向量自回归（VAR）模型在给定滞后阶的系数矩阵联合感兴趣，它可以用于建模高维时间序列（HDTS）。请注意，为了联合考虑每个组中的参数，需要使用\
  \ L2 惩罚函数而非 L1。若干用于估计稀疏加性模型的程序与此估计方法相关（参见 Hastie et al. 2015）。\n\n#### 7.1.2.3 弹性网\n\
  \nZou and Hastie (2005) 使用 \\(\\ell_1\\)- 和 \\(\\ell_2\\)- 惩罚的组合来改进 Lasso 估计量的解释性，并提出了定义如下的弹性网\n\
  \n\\[\n\\widehat{\\boldsymbol{\\beta}}_{\\mathrm{EN}}(\\alpha) = \\arg \\min_{\\\
  boldsymbol{\\beta}} (\\|\\mathbf{Y}-\\mathbf{X} \\boldsymbol{\\beta}\\|_2^2 / n\
  \ + \\lambda \\alpha\\|\\boldsymbol{\\beta}\\|_1 + \\lambda(1-\\alpha)\\|\\boldsymbol{\\\
  beta}\\|_2), \\quad (7.18)\n\\]\n\n其中 \\(0 \\le \\alpha \\le 1\\)，下标“EN”用于表示弹性网。显然，当\
  \ \\(\\alpha = 1\\) 时弹性网估计量退化为 Lasso 估计量，而当 \\(\\alpha = 0\\) 时为岭回归估计量。在等式 (7.18)\
  \ 中，使用简单的线性组合来定义惩罚，可以通过交叉验证进行选择。在 Zou and Hastie (2005) 中，使用了两个惩罚 \\(\\lambda_1\\\
  ) 和 \\(\\lambda_2\\)，因此需要选择两个调参参数。在文献中，没有关于选择参数 \\(\\alpha\\) 的明确指导原则。可以为 \\(\\\
  alpha\\) 选择几个可能的值，并比较其样本外表现以选择合适的值。\n\n#### 7.1.2.4 融合 Lasso\n\n为了改进线性回归模型参数化中的简洁性（或平滑性），Tibshirani\
  \ et al. (2005) 提出了融合 Lasso，其定义为\n\n\\[\n\\widehat{\\boldsymbol{\\beta}}_{\\mathrm{fused}}(\\\
  lambda_1, \\lambda_2) = \\arg \\min_{\\boldsymbol{\\beta}} \\left( \\|\\mathbf{Y}-\\\
  mathbf{X} \\boldsymbol{\\beta}\\|_2^2 / n + \\lambda_1 \\|\\boldsymbol{\\beta}\\\
  |_1 + \\lambda_2 \\sum_{j=2}^k |\\beta_j - \\beta_{j-1}| \\right), \\quad (7.19)\n\
  \\]\n\n其中 \\(\\lambda_1 \\ge 0\\) 且 \\(\\lambda_2 \\ge 0\\)。第二个惩罚 \\(\\lambda_2\\\
  ) 侧重于从一个变量到另一个变量的参数平滑性。较大的 \\(\\lambda_2\\) 将强制所有参数相同。作为一个特例，假设真实模型为 \\(Y_i = \\\
  beta \\sum_{j=1}^k x_{ji} + \\epsilon_i\\)，该模型简洁但不稀疏。融合 Lasso 可以轻松处理此类简洁模型，而 Lasso\
  \ 可能会遇到一些困难。\n\n#### 7.1.2.5 SCAD 惩罚\n\n为了减少 Lasso 估计量在变量选择中的有限样本偏差，Fan and Li (2001)\
  \ 为线性回归模型提出了平滑截断绝对偏差（SCAD）惩罚，其中每个系数根据其绝对大小进行惩罚。估计量定义为\n\n\\[\n\\widehat{\\boldsymbol{\\\
  beta}}_{\\mathrm{scad}}(\\lambda, a) = \\arg \\min_{\\boldsymbol{\\beta}} \\left(\
  \ \\|\\mathbf{Y}-\\mathbf{X} \\boldsymbol{\\beta}\\|_2^2 / n + \\sum_{j=1}^k \\\
  mathrm{pen}_{\\lambda, a}(\\beta_j) \\right), \\quad (7.20)\n\\]\n\n其中惩罚由以下给出\n\n\
  \\[\n\\mathrm{pen}_{\\lambda, a}(u) = \\begin{cases} \\lambda|u|, & \\text{if }\
  \ |u| \\le \\lambda, \\\\ -(u^2 - 2a\\lambda|u| + \\lambda^2) / [2(a-1)], & \\text{if\
  \ } \\lambda < |u| \\le a\\lambda, \\\\ (a+1)\\lambda^2 / 2, & \\text{if } |u| >\
  \ a\\lambda, \\end{cases}\n\\]\n\n其中 \\(u\\) 是实数，\\(\\lambda \\ge 0\\)，且 \\(a\\\
  ) 是正实数。Fan and Li (2001) 推荐 \\(a=3.7\\)。从定义中可以清楚地看出，SCAD 的惩罚取决于回归系数 \\(\\beta_j\\\
  ) 的绝对值：如果系数较小，则为标准 Lasso 惩罚；在中间区间，它同时取决于绝对值和平方；当系数幅度较大时，其上界为 \\((a+1)\\lambda^2/2\\\
  )。这与 Lasso 不同，Lasso 的惩罚是无界的。SCAD 惩罚在零点不可导且非凸。只要 \\(a > 2\\)，惩罚的导数除了零点外处处存在。\n\n\
  ### 示例 7.1\n\n为了展示正则化线性回归的应用，请考虑 McCracken and Ng (2016) 描述的美国月度宏观经济数据集，该数据集可在 https://research.stlouisfed.org/econ/mccracken/fred-databases/\
  \ 获取。该数据集每月更新，包含 128 个宏观经济变量。变量详情载于 McCracken and Ng (2016)。由于存在缺失值，我们删除了六个变量（编号为\
  \ 58、60、95、104、123 和 128），并在分析中使用了从 1960 年 1 月到 2019 年 4 月的数据。此外，我们使用 McCracken\
  \ and Ng (2016) 给出的差分和变换来构建平稳序列。因此，我们的分析采用了 710 个观测值和 122 个变量。图 7.1 显示了 122 个变量的时间图（已适当缩放，使每个变量的样本方差为\
  \ 1）。\n\n为示例，我们将美国工业生产指数（IPI）的月度增长率作为因变量，预测期限为 \\(h=1\\)，并将所有 122 个变量的前 6 个滞后值作为预测变量。因此，我们有\n\
  \n\\[\n\\mathbf{Y} = \\mathbf{X}\\boldsymbol{\\beta} + \\boldsymbol{\\epsilon},\n\
  \\]\n\n其中 \\(\\mathbf{Y}\\) 是一个 704 维的响应向量（针对 \\(t = 7, \\dots, 710\\)），\\(\\mathbf{X}\\\
  ) 是一个 \\(704 \\times 732\\)（\\(122 \\times 6 = 732\\)）设计矩阵。在这种情况下，\\(k = 732 > n\
  \ = 704\\)。\n\n图 7.2 显示了 Lasso 回归的系数轮廓图，通过运行 `glmnet` 包的 `glmnet` 命令（设置 \\(\\alpha\

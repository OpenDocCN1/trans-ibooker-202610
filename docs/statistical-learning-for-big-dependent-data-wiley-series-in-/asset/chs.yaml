  ## 示例 1.4


  我们使用以下模型生成了2000个观测值


  ```

  \(x_t = 1.9x_{t-1} - 0.8x_{t-2} - 0.1x_{t-3} + \epsilon_t, \quad t = 1, \dots, 2000,
  \quad (1.28)\)

  ```


  其中 \(\epsilon_t\) 是来自标准正态分布的随机抽样，即 \(\epsilon_t \sim_{iid} N(0,1)\)。式 (1.28) 的模型是高斯
  ARIMA(1,2,0) 模型。该序列如图 1.24 所示。然后我们考虑一个线性回归


  ```

  \(y_t = \boldsymbol{x}''_t \boldsymbol{\beta} + e_t, \quad t = 11, \dots, 2000,\)

  ```


  其中设计向量由


  ```

  $x_t = (x_{t-1}, x_{t-2}, ..., x_{t-10}, z_{1t}, ..., z_{10t})''$,

  ```


  给出，对所有 \(i\) 和 \(t\)，\(z_{it} \sim^{iid} N(0, 1)\)。因此，我们有一个具有 \(p = 20\) 和 \(T =
  1990\) 的线性回归模型。数据生成模型是稀疏的，包含三个非零系数。我们的目标是估计回归模型并识别非零系数。在这种情况下，适当的统计方法应将 \(x_{t-1}\)、\(x_{t-2}\)
  和 \(x_{t-3}\) 识别为唯一具有非零系数的预测变量。图 1.25 显示了 Lasso 估计的结果。该图称为系数剖面图，即标准化系数估计与系数估计适当缩放的范数的散点图。图上方的数字表示非零系数的数量。图右侧的数字标识关键预测变量。系数剖面图的详细信息和用法将在第
  7 章介绍。目前只需注意，图中显示了较大的非零系数估计。从图中可以清楚地看出，Lasso 可以轻松识别 \(x_{t-1}\) 和 \(x_{t-2}\) 作为重要的解释变量，但无法确定
  \(x_{t-3}\)。这并不奇怪，因为式 (1.28) 中的 AR(3) 模型是一个具有强序列依赖的 \(I(2)\) 过程，导致线性回归分析中多重共线性的问题。在这种情况下，解释变量
  \(x_{t-1}\) 到 \(x_{t-10}\) 强烈相关，样本相关系数接近 1。此外，Lasso 回归估计通常需要对设计矩阵的每一列进行归一化。对于 \(I(2)\)
  序列，样本标准差的增长阶数高于样本量。归一化可能导致只关注单位根依赖。反过来，这可能会忽略过程平稳部分的序列依赖。可以使用单位根过程理论来证明这一点。例如，参见
  Tsay (2014) 及其参考文献。这里只需说明，当序列依赖很强时，Lasso 回归可能对依赖数据失效。我们将在第 7 章讨论克服此类困难的方法。因此，有必要开发用于分析大型依赖数据的统计方法。


  ## 附录 1.A：一些矩阵理论


  在本附录中，我们介绍多元统计分析中有用的一些矩阵性质。设 \(A\) 为一个 \(k \times k\) 实值矩阵。行列式方程 \(|A - \lambda
  I| = 0\) 的解为 \(A\) 的特征值。若 \(k\) 维向量 \(x = (x_1, ..., x_k)''\) 满足 \(Ax = \lambda
  x\)，则称 \(x\) 为 \(A\) 与特征值 \(\lambda\) 关联的特征向量。通常，\(A\) 的特征值和特征向量可能取复数值。


  矩阵 \(A\) 是正定的，如果 (a) \(A = A''\)，即 \(A\) 是对称的，且 (b) 对于任何非零 \(k\) 维向量 \(x = (x_1,
  ..., x_k)''\)，\(x''Ax > 0\)。正定矩阵在许多统计应用中起着重要作用，研究其性质很有价值。可以轻松看出，正定矩阵 \(A\) 的所有特征值都是正数。


  **谱分解：** 假设 \(A\) 为一个 \(k \times k\) 实值正定矩阵。设 \(\lambda_1 \ge \lambda_2 \ge \cdots
  \ge \lambda_k\) 为 \(A\) 的特征值。设 \(e_i\) 为与特征值 \(\lambda_i\) 关联的 \(A\) 的特征向量，满足 \(e_i''e_1
  = 1\)。即 \(e_i\) 的欧几里得范数为 1。设 \(P = [e_1, ..., e_k]\) 为由特征向量组成的 \(k \times k\) 矩阵。那么，有
  (1)




  $AP = P\Lambda$，其中 $\Lambda = \text{diag}\{\lambda_1, \dots, \lambda_k\}$; (2) $P''P
  = PP'' = I$，即 \(k\) 维单位矩阵; (3)


  $$A = P\Lambda P'' = \sum_{i=1}^k \lambda_i e_i e_i''.$''


  性质 (3) 被称为正定矩阵 \(\boldsymbol{A}\) 的谱分解。利用谱分解以及 \(\boldsymbol{A}\) 的特征值和特征向量的性质，我们有以下性质。


  ### 性质 I


  假设 \(\boldsymbol{A}\) 是一个正定的 \(k \times k\) 实值矩阵，其谱分解由特征值-特征向量对 \((\lambda_i, \boldsymbol{e}_i)$
  给出。则：


  $$\max_{\boldsymbol{x} \neq \boldsymbol{0}} \frac{\boldsymbol{x}'' \boldsymbol{A}
  \boldsymbol{x}}{\boldsymbol{x}'' \boldsymbol{x}} = \lambda_1$$


  $$\min_{\boldsymbol{x} \neq \boldsymbol{0}} \frac{\boldsymbol{x}'' \boldsymbol{A}
  \boldsymbol{x}}{\boldsymbol{x}'' \boldsymbol{x}} = \lambda_k,$$


  其中最大值和最小值分别在 \(\boldsymbol{x} = \boldsymbol{e}_1$ 和 \(\boldsymbol{x} = \boldsymbol{e}_k$
  时取得。此外，


  $$\max_{\boldsymbol{x} \neq \boldsymbol{0}, \boldsymbol{x}'' \boldsymbol{e}_j =
  0, j=1, \dots, i} \frac{\boldsymbol{x}'' \boldsymbol{A} \boldsymbol{x}}{\boldsymbol{x}''
  \boldsymbol{x}} = \lambda_{i+1}$$


  其中最大值在 \(\boldsymbol{x} = \boldsymbol{e}_{i+1}$ 时取得，这里 \(i = 2, \dots, k$.



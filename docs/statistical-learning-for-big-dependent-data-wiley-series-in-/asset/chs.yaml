  \n从图中可以清楚地看出，高臭氧浓度集中在北伊利诺伊州和南威斯康星州密歇根湖西岸沿线城市附近。\n\n图9.4提供了美国中部138个气象站在1993年5月三个选定日期的日最高气温空间图。如预期，图示表明日最高气温在南部较高，北部较低。另一方面，东西方向的日最高气温模式不够明显。图还表明，日最高气温存在显著的时间变化。\n\

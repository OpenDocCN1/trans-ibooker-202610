  # 前言


  人类历史上第一次，我们正在无时无刻、处处收集数据。这些数据呈指数级增长，以最低成本生产和存储，正在改变我们学习事物和控制活动的方式，包括监测健康和利用闲暇时间。统计学作为一门科学学科，是在一个不同的环境下产生的，那时数据稀缺，主要关注从小型结构化数据集中获取可用信息的最大效率。因此，需要新方法从异构且非结构化的大数据集中提取有用信息。这些方法正在统计学、计算机科学、机器学习、运筹学、人工智能及其他领域中开发。它们构成了通常所说的数据科学。迄今为止，大多数大数据分析的进展都假设数据来自独立对象，因此可以将其视为独立观察。另一方面，实证数据通常随时间或空间生成，因此具有动态和/或空间依赖性。


  本书的主要目标是从大型依赖数据中学习。具有时态动态的数据在统计学中作为时间序列分析被研究，而空间依赖性则属于较新的空间统计学领域。最近大数据方法发展的若干核心思想源自时间序列分析。例如，赤池信息量准则由
  Akaike 提出，用于选择自回归过程的阶数，Box 和 Jenkins 提出了带有非线性估计的迭代建模程序，用于自回归积分移动平均（ARIMA）模型，而合并预测的方法（为机器学习中的模型平均和集成方法铺平了道路）可以追溯到贝叶斯预测。当今，许多科学领域（从经济学和商业到环境与健康科学，再到工程和计算机视觉）都需要分析具有时态和空间依赖性的大数据。我们认为，建模和处理大型依赖数据是数据科学中一个关键的新兴领域。


  已有多本优秀著作面向独立数据的统计学习编写，但针对依赖数据的研究却少得多。本书试图激发预测和分类中可用方法的使用，促进从大型依赖数据中提取有用信息的统计方法的进一步研究，并指出在忽视数据依赖性时可能出现的潜在弱点。我们首先对时间序列分析（包括单变量和多变量）进行简要回顾，接着介绍在分析多个时间序列时处理异质性的方法。随后，我们讨论对多个时间序列进行分类和聚类的方法，并介绍动态因子模型用于建模多变量或高维时间序列。之后，我们在数据丰富环境中对预测（包括即期预测）进行了深入讨论。接着，我们转向深度学习和时空数据分析。


  本书以应用为导向，但也提供了一些基本理论，以帮助读者更好地理解所使用的方法和程序。由于所讨论问题的高维性质，我们在几个章节中包含了一些技术推导，但在大部分内容中，我们将对严格数学证明感兴趣的读者引向现有文献。全书使用真实案例来展示分析和应用。对于实证数据分析，我们大量使用
  R 并提供必要的说明和 R 脚本，以便读者可以复现书中所示的结果。


  本书组织如下。第 1 章提供书中考虑的数据集的一些示例，并介绍时态依赖性、随机过程和时间序列的基本概念。它还讨论了主成分分析，并说明了在忽视数据依赖性时传统统计推断的弱点。第
  2 章首先介绍可视化大量时间序列的新方法，总结了 ARIMA 和状态空间模型的主要特性（包括光谱分析和卡尔曼滤波），并提出了一种为大量时间序列构建单变量模型的方法。第
  3 章回顾构建多变量向量 ARMA 模型的可用方法及其在高维时间序列中的局限性。它还讨论了协整以及处理单根多变量非平稳序列的方法。实际时间序列数据通常具有异质性，带有聚类和某些共同特征，包含缺失值和离群值，并可能遇到结构性断点。我们将在接下来的两章中解决这些问题。第
  4 章介绍缺失值估计以及检测和建模单变量和多变量时间序列中离群值的一些新方法。所考虑的离群值包括加性离群值、创新性离群值、水平转移、暂时转移和参数变化。第 5
  章分析时间序列的聚类（即无监督分类）方法，包括基于依赖性聚类时间序列或选择聚类数量的最近程序。该章还考虑时间序列判别（即监督分类），并涵盖不仅在统计学中开发，而且在机器学习（如支持向量机）中开发的方法。第
  6 章专注于建模大量时间序列的一个活跃研究课题，即动态因子模型和其他类型的因子模型。本章详细描述了该课题的发展，并讨论了文献中可用的几种模型的优缺点（包括高维环境下的模型）。第
  7 章集中讨论预测大量时间序列的关键问题。它探讨了拉索回归在时间序列中的应用，以及主要在统计学和计量经济学文献中开发的用于预测高维时间序列的程序。它还研究了即期预测方法，并通过真实案例展示其有用性。第
  8 章考虑用于预测和分类的机器学习，包括神经网络和深度学习。它还研究了在统计学与机器学习交界处开发的方法（通常称为数据科学），包括分类和回归树（CART）以及随机森林。最后，第
  9 章研究时空数据及其应用，包括用于空间预测的各种克里金方法。


  依赖数据涵盖广泛的主题和方法，尤其是在存在高维数据时。期望一本书能涵盖所有这些重要主题是不切实际的。本书也不例外。我们需要对所包含的内容做出取舍。与其他书籍一样，我们的选择很大程度上取决于我们的经验、研究领域和偏好。有一些重要主题（特别是那些正在快速发展的主题）未在本书中涵盖，例如，面向依赖数据的函数数据分析。我们希望在未来的版本中加入此及其他相关主题。


  本书充分利用了许多现有的 R 包。然而，书中讨论的某些方法无法使用任何现有包来实现。我们开发了一些 R 脚本来执行此类分析。例如，我们开发了一种用于大量时间序列的新自动建模程序，并在第
  2 章中使用和演示。在 Angela Caro 和 Antonio Elías 的大力帮助下，我们将这些 R 脚本纳入了专为本书开发的新包，并将其称为 SLBDD
  包。此外，所使用的数据集（受版权保护的除外）也已包含在内。书中提供的一些 R 脚本可在本书的网页上找到：https://www.rueytsay.com/slbdd。



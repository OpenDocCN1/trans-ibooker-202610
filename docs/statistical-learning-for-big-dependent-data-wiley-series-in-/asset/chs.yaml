  ,ylab=\"Lag 0 weight \", type=\"l\")\n> plot (a11,xlab=\"Country\",ylab=\"Lag 1\
  \ weight \", type=\"l\")\n> plot (a12,xlab=\"Country\",ylab=\"Lag 2 weight \", type=\"\
  l\")\n> plot (a13,xlab=\"Country\",ylab=\"Lag 3 weight \", type=\"l\")\n> B1 <-\
  \ sal[[1]]$B\n> par(mfrow=c(1,4))\n### The Loadings B are plotted\n> plot (B1[1,],xlab=\"\
  Countries\",ylab=\"Loadings 1st DF lag 0\", type=\"l\")\n> plot (B1[2,],xlab=\"\
  Countries\",ylab=\"Loadings 1st DF lag 1\", type=\"l\")\n> plot (B1[3,],xlab=\"\
  Countries\",ylab=\"Loadings 1st DF lag 2\", type=\"l\")\n> plot (B1[4,],xlab=\"\
  Countries\",ylab=\"Loadings 1st DF lag 3\", type=\"l\")\n```\n\n## 6.5 非平稳系列的 DFM\n\
  \n为简化起见，假设时间序列 $z_t$ 满足 \\(\\bar{z} = \\sum_{l=1}^T z_l / T = \\mathbf{0}\\) 并且是一个\
  \ \\(I(1)\\) 过程。那么，一些共同因子是 \\(I(1)\\)，但其中一些可能是平稳的。Hu 和 Chou (2004) 考虑了这种模型，并提出使用标量组件模型\
  \ (Tiao and Tsay, 1989) 来分离平稳和非平稳因子。Peña 和 Poncela (2006) 提出了一种正式方法，采用以下模型：\n\n\
  $z_t = P_1 f_{1t} + P_2 f_{2t} + n_t, \\quad (6.37)$\n\n其中 $P_1$ 和 $f_{1t}$ 对应于\
  \ $r_1$ 维的 \\(I(1)\\) 共同因子，$P_2$ 和 $f_{2t}$ 对应于 $r_2$ 维的平稳共同因子，$n_t$ 是一个平稳噪声过程。对于\
  \ \\(I(d)\\) 过程 $y_t$，作者定义了广义样本自协方差矩阵 $C_y(h)$ 为\n\n$C_y(h) = \\frac{1}{T^{2d}}\
  \ \\sum_{t=h+1}^T z_{t-h} z'_t, \\quad (6.38)$\n\n并表明 (1) 这些广义协方差矩阵收敛到某些随机矩阵，(2)\
  \ 对于非平稳因子的识别，这些矩阵的作用与平稳系列的样本自协方差矩阵相同。事实上，他们表明，在模型 (6.37) 下，广义样本协方差矩阵 $C_y(h)$（有限\
  \ $h$）弱收敛到一个随机矩阵 $\\Gamma_y$，该矩阵几乎可以肯定地有 $r_1$ 个大于零的特征值和 $k - r_1$ 个等于零的特征值。另外，对应于\
  \ $r_1$ 个大于零特征值的特征向量构成了由载荷子矩阵 $P_1$ 的列所张成的空间的基。\n\n这意味着，公共非平稳因子的数量可以通过 $C_y(h)$\
  \ 的非零特征值数量来找到，相应的特征向量提供了 $P_1$ 载荷矩阵的估计。因此，令 $\\hat{P}_1$ 为由与 $C_y(0)$ 的 $r_1$ 个最大特征值相关的特征向量组成的矩阵，我们通过\
  \ $\\widehat{f}_{1t} = \\hat{P}'_1 z_t$ 估计整合因子。接下来，我们通过以下方法获得一个不含非平稳因子的新系列 $y_t$：\n\
  \n$y_t = z_t - \\hat{P}_1 \\widehat{f}_{1t} = P_2 f_{2t} + n_t + \\varepsilon_t,\
  \ \\quad (6.39)$\n\n其中 $\\varepsilon_t = P_1 f_{1t} - \\hat{P}_1 \\widehat{f}_{1t}$\
  \ 是一个随着 \\( T \\rightarrow \\infty \\) 收敛到零的过程。那么，过程 $y_t$ 大约会遵循公式 (6.1) 中的静态 DFM，我们可以应用之前讨论用于静态时间序列的方法来估计\
  \ $P_2$ 和 $f_{2t}$。最后，计算噪声，并可以构建因子和噪声的模型。作为广义协方差矩阵的替代方案，我们可以使用汇总协方差矩阵 (6.21) 来计算特征向量。\n\
  \n这种方法要求噪声是平稳的。否则，$C_y(0)$ 的特征结构将无法提供信息，公式 (6.39) 中的系列 $y_t$ 很可能具有整合噪声，导致识别问题。另外，如我们在第\
  \ 3 章中所见，独立的 \\(I(1)\\) 系列可能具有很强的相关系数，进而可能导致伪回归问题。参见第 3.5.1 节。因此，一组独立的 \\(I(1)\\\
  ) 系列可能具有许多非对角非零系数的协方差矩阵，应用主成分分析可能导致伪因子。\n\nBai 和 Ng (2004) 提出了一种替代程序，该程序不假设噪声是平稳的，即对观测系列进行一阶差分，并将\
  \ DFM 应用于生成的平稳系列。令 $y_t = \\nabla z_t$ 并写成：\n\n$y_t = P_1 \\tilde{f}_{1t} + P_2\
  \ \\tilde{f}_{2t} + \\tilde{n}_t.$\n\n这是一个静态 DFM，因子为 \\(\\tilde{f}_{1t} = \\nabla\
  \ f_{1t}\\) 和 \\(\\tilde{f}_{2t} = \\nabla f_{2t}\\)，噪声是平稳的，但可能不可逆。我们可以在差分后应用静态\
  \ DFM 的程序来找到一组因子 \\(\\tilde{f}_t\\)，其中包括平稳和非平稳因子。然后，我们可以通过 \\(f_1 = \\tilde{f}_1\\\
  ) 和\n\n```\n\\(\\hat{f}_t = \\sum_{s=2}^t \\tilde{f}_s, \\quad t \\ge 2,\\)\n```\n\
  \n构建整合因子，并检查 \\(\\hat{f}_t\\) 组分的平稳性。这可以使用第 2 章讨论的扩展 Dickey-Fuller 检验来完成。请注意，此程序找到的整合因子数量可能大于真实数量\
  \ \\(r_1\\)，需要协整检验来选择因子数量。参见第 3 章。然后，计算噪声系列 \\(\\hat{n}_t = z_t - \\hat{P}'_f \\\
  hat{f}_{1t} - \\hat{P}'_{2f} \\hat{f}_{2t}\\)，并对每个组分进行平稳性检验并用于建模。\n\n第一种方法在水平上运行，没有识别问题，并且有优势是整合因子空间的维度可以直接找到。如果我们预期系列具有带有平稳噪声的公共因子，则建议使用此方法。另一方面，如前所述，如果系列是独立的\
  \ I(1) 系列，或者某些噪声是整合的（参见 Onatski 和 Wang, 2019），它可能会找到伪因子。第二种方法在差分后的系列上运行，当噪声是整合时，更适合检验整合因子的存在，但当噪声是平稳时，它在找到整合因子维度方面效率较低，如\
  \ Corona 等人 (2020) 的蒙特卡洛研究所示。Choi (2017) 指出这种效应的一个原因是，对平稳噪声进行差分通常会增加其方差和自相关性，使公共因子的估计效率降低。无论如何，这仍然是一个开放问题，需要更多研究来判断两种方法的相对优劣。例如，参见\
  \ Corona 等人 (2017) 关于在静态单变量变换后选择因子数量的方法性能的研究。因此，我们的建议始终是尝试两种方法并比较它们的结果。Gao 和 Tsay\
  \ (2020) 最近提出了另一种方法，也对 $z_t$ 的水平进行操作。\n\n### 示例 6.5\n\n我们再次分析 19 个欧元区国家的 GDP 系列，但现在直接使用水平。图\
  \ 6.16 显示了这 19 个标准化 GDP 系列的时间图。图显示，所有国家的 GDP 系列在 2008 年金融危机之前增长迅速。然后，所有国家都深受金融危机影响，尽管其中大多数很快恢复了增长，但有三个国家在\
  \ 2013 年左右又出现下降。这三个经济体是希腊、葡萄牙和意大利。事实上，有两个国家的 GDP 系列尚未恢复到危机前水平。\n\n我们使用程序 `dfmpc`\
  \ 分析这些系列以估计因子，并通过 Lam 和 Yao 检验发现两个共同因子。这两个因子显示在图 6.17 中。第一个因子解释了 79.72% 的变异性，第二个解释了\
  \ 14.95%。这些结果与滞后协方差矩阵的主要特征值一致，由于系列是标准化的，这些特征值即为相关系数矩阵的特征值。这些特征值显示在表 6.2 中，并建议使用两个因子。\n\

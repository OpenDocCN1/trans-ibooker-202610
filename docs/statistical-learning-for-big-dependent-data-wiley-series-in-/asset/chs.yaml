  9 章讨论的空间过程的一个示例。


  这里介绍的六个数据集是多元时空序列的示例，我们在其中随时间和空间观察若干感兴趣变量的值。


  ![](img/d4c84ae3c2178f4c506af3dd2ed13122_29_1.png)


  图 1.13 美国中西部州份各监测站的位置和臭氧水平。测量值为 1987年6月20日 上午9点至下午4点的8小时平均值。


  时间序列在给定序列中引入了动态依赖，这种依赖可能随时间变化。数据还显示序列之间存在交叉依赖，而交叉依赖的强度又可能取决于地理位置或国家之间的经济关系。本书的一个主要焦点是研究多个时间序列之间的动态依赖和交叉依赖。


  分析大规模依赖数据的目标包括：(a) 研究序列之间的关系；(b) 探索序列内部及序列之间的动态依赖；(c) 预测序列的未来值。对于空间过程，人们可能有兴趣预测没有观测值的地点上的感兴趣变量。前两个目标被称为数据分析与建模，而第三个目标涉及统计推断。建模和推断不仅需要处理数据的方法，还需要可以据此进行适当推断的理论。为此，我们需要一个框架来理解研究中时间序列的特征并做出可靠的预测。我们将通过在下一节中介绍随机过程来讨论这个框架。


  ## 1.2 随机过程


  随机过程的理论与性质构成了依赖数据统计分析与推断的基础。


  ### 1.2.1 标量过程


  标量随机过程是随机变量序列 {z_t}，其中下标 t 取值于某个集合 C。在大多数情况下，C 的元素是有序的，并且通常对应于某个日历时间（天、月、年等）。由此产生的随机过程
  z_t 称为时间序列。除非特别说明，我们假设本书中的时间索引 t 是等间距的。对于空间过程，C 由某些地理区域的位置组成。这些位置可以表示观测站或城市的纬度和经度。对于
  C 中的每个值 t（例如，每个时间点），z_t 是定义在共同可测空间上的实值随机变量。为简单起见，观测值也用 {z_t} 表示，构成随机过程的一个实现。我们将用
  z_1^T = (z_1, ..., z_t, ..., z_T)'' 表示实现，其中 T 是样本量，A'' 表示矩阵或向量 A 的转置。样本量 T 表示时间序列的观测数量，或纯空间过程的位置数量。


  随机过程 z_t 的统计特性由其概率分布表征。更具体地说，对于给定的 T（有限且固定），z_1^T 的性质由其元素 {z_t | t = 1, ..., T}
  的联合概率分布决定。z_1^T 中任何非空子集的边缘分布可以通过从联合分布中积分掉不在子集中的元素来得到。特别是，单个元素 z_t 的概率分布称为 z_t 的边缘分布。因此，类似于一般有限维随机变量，当我们知道其联合概率分布时，我们就说
  z_1^T 的概率结构已知。


  在本书中，我们假设概率分布有明确定义的密度函数。令 f_t(z) 为 z_t 的边缘概率密度函数。定义


  $z_t$ 的期望值或均值为


  $$\mu_t = E(z_t) = \int_R z_t f_t(z) dz$$


  前提是积分存在，其中 $R$ 表示实数直线。序列 $\mu_1^T = (\mu_1, \mu_2, \dots, \mu_T)$ 是 $\mathbf{z}_1^T$
  的均值函数。定义 $z_t$ 的方差为


  $$\sigma_t^2 = E(z_t - \mu_t)^2 = \int_R (z - \mu_t)^2 f_t(z) dz$$


  前提是积分存在。序列 $\{\sigma_1^2\}_1^T = (\sigma_1^2, \dots, \sigma_T^2)$ 是 $\mathbf{z}_1^T$
  的方差函数。高阶矩可以类似定义，假设它们存在。


  一个感兴趣的特例是 $\mathbf{z}_1^T$ 的所有元素具有相同的均值。在这种情况下，$\mu_1^T$ 是一个常数函数。如果 $\mathbf{z}_1^T$
  的所有元素具有相同的方差，则 $\{\sigma_t^2\}_1^T$ 是一个常数函数。如果对于所有有限 $T$，$\mu_1^T$ 和 $\{\sigma_t^2\}_1^T$
  都是常数，则随机过程 $z_t$ 是稳定的，我们称其为齐次过程。在某些应用中，$\mu_1^T$ 或 $\{\sigma_t^2\}_1^T$ 可能不存在。


  在下文中，我们假设所有 $t$ 的 $\sigma_t^2$ 都存在。随机过程 $z_t$ 的线性动态依赖由其自协方差或自相关系数函数（ACF）决定。对于 $z_t$
  和 $z_{t-j}$（其中 $j$ 是给定的整数），我们定义它们的自协方差为


  $$\gamma(t, t-j) = \text{Cov}(z_t, z_{t-j}) = E[(z_t - \mu_t)(z_{t-j} - \mu_{t-j})].
  \quad (1.1)$$


  当 $j=0$ 时，$\gamma(t, t) = \text{Var}(z_t) = \sigma_t^2$。另外，从定义中可以清楚地看出 $\gamma(t,
  t-j) = \gamma(t-j, t)$。$z_t$ 与 $z_{t-j}$ 之间的自相关系数定义为


  $$\rho(t, t-j) = \frac{\gamma(t, t-j)}{\sigma_t \sigma_{t-j}}. \quad (1.2)$$


  在实际应用中，特别重要的情况是 $z_t$ 与 $z_{t-j}$ 之间的自协方差，因而也包括自相关系数，是滞后 $j$ 的函数，而不是 $t$ 的函数。在这种情况下，自协方差和自相关系数是时不变的，我们写作
  $\gamma(t, t-j) = \gamma_j$ 和 $\rho(t, t-j) = \rho_j$。


  #### 1.2.1.1 平稳性


  如果随机过程 $z_t$ 的 $m$ 维随机向量 $(z_{t_1}, z_{t_2}, \dots, z_{t_m})$ 和 $(z_{t_1+h}, z_{t_2+h},
  \dots, z_{t_m+h})$ 的联合分布相同，则称其为严格平稳，其中 $m$ 是任意正整数，$\{t_1, \dots, t_m\}$ 是任意 $m$
  个时间索引，$h$ 是任意整数。换句话说，任意 $m$ 个随机变量的联合分布是时不变的。特别是，严格平稳过程 $z_t$ 的边缘概率密度 $f_t(z)$ 不依赖于
  $t$，我们简单地将其表示为 $f(z)$。如果随机过程 $z_t$ 的均值和自协方差函数存在且是时不变的，则称其为弱平稳。具体来说，过程 $z_t$ 是弱意义平稳的，当且仅当：(1)
  对所有 $t$，$\mu_t = \mu$；(2) 对所有 $t$，$\sigma_t^2 = \sigma^2$；(3) 对所有 $t$，$\gamma(t,
  t-j) = \gamma_j$，其中 $j$ 是给定整数。前两个条件表示均值和方差是时不变的。第三个条件表明，两个变量之间的自协方差，因而也包括自相关系数，仅取决于它们的时间间隔
  $j$。除非特别说明，我们



  用平稳性表示随机过程的弱平稳性。对于该过程，自协方差和自相关函数仅取决于滞后的差值，特别是，我们有 \(\gamma_0 = \sigma^2, \gamma_j
  = \gamma_{-j}\) 和 \(\rho_j = \rho_{-j}\)，其中 \(j\) 是任意整数。


  假设 \(z_t\) 是平稳的。对于给定的正整数 \(m\)，\((z_t, z_{t-1}, \dots, z_{t-m+1})''\) 的协方差矩阵定义为


  \(\boldsymbol{M}_z(m) = E \left\{ \begin{bmatrix} z_t - \mu \\ z_{t-1} - \mu \\
  \vdots \\ z_{t-m+1} - \mu \end{bmatrix} [(z_t - \mu), (z_{t-1} - \mu), \dots, (z_{t-m+1}
  - \mu)] \right\} = \begin{bmatrix} \gamma_0 & \gamma_1 & \cdots & \gamma_{m-1} \\
  \gamma_1 & \gamma_0 & \cdots & \gamma_{m-2} \\ \vdots & \vdots & \ddots & \vdots
  \\ \gamma_{m-1} & \gamma_{m-2} & \cdots & \gamma_0 \end{bmatrix} \quad (1.3)\)


  该协方差矩阵具有特殊模式：(a) 所有对角元素相同，(b) 主对角线上下的所有元素相同，以此类推。这样的矩阵称为 *托普利茨* 矩阵。相应的 *自相关矩阵* 是


  \(\boldsymbol{R}_z(m) = \begin{bmatrix} 1 & \rho_1 & \cdots & \rho_{m-1} \\ \rho_1
  & 1 & \cdots & \rho_{m-2} \\ \vdots & \vdots & \ddots & \vdots \\ \rho_{m-1} & \rho_{m-2}
  & \cdots & 1 \end{bmatrix} \quad (1.4)\)


  它也是一个托普利茨矩阵。


  平稳过程的一个重要性质是，其元素的任何非平凡有限线性组合仍然是平稳的。换句话说，通过平稳过程的任何非零线性组合（具有有限元素）得到的过程也是平稳的。例如，如果
  \(z_t\) 是平稳的，则由 \(w_t = z_t - z_{t-1}\) 定义的过程 \(w_t\) 也是平稳的。该性质的一个推论是，\(z_t\) 的自协方差必须满足某些有助于研究随机过程的条件。特别是，我们可以考虑平稳过程
  \(z_t\) 及其滞后值的非平凡线性组合，即


  \(y_t = c_1 z_t + c_2 z_{t-1} + \cdots + c_m z_{t-m+1} = \boldsymbol{c}'' \boldsymbol{z}_{t,m}\)


  其中 \(\boldsymbol{c} = (c_1, \dots, c_m)'' \neq \boldsymbol{0}\) 且 \(\boldsymbol{z}''_{t,m}
  = (z_t, z_{t-1}, \dots, z_{t-m+1})''\)。由于 \(y_t\) 是平稳的，其方差存在且由 \(\boldsymbol{c}''
  \boldsymbol{M}_z(m) \boldsymbol{c} \geq 0\) 给出，其中 \(\boldsymbol{M}_z(m)\) 在 Eq.
  (1.3) 中定义。因此，\(\boldsymbol{M}_z(m)\) 必须是半正定矩阵。同样，相关矩阵 \(\boldsymbol{R}_z(m)\) 也必须是半正定的。


  严格平稳性蕴含弱平稳性，前提是过程的前两阶矩存在。但弱平稳性并不能保证随机过程的严格平稳性。考虑以下简单示例。设 \(\{z_t\}\) 为一组独立同分布的标准正态随机变量，即
  \( z_t \sim iid N(0, 1) \)。通过以下方式定义随机过程 \( x_t \)


  \[

  x_t = \begin{cases} 0.5(z_t^2 - 1), & \text{if } t \text{ is odd} \\ z_t, & \text{if
  } t \text{ is even.} \end{cases}

  \]


  很容易证明 (a) \( E(x_t) = 0 \)，(b) \( Var(x_t) = 1 \)，且 (c) 对于 \( j \neq 0 \) 有 \( E(x_t
  x_{t-j}) = 0 \)。因此，\(\{x_t\}\) 是一个弱平稳过程。另一方面，当 \( t \) 为偶数时 \( x_t \) 服从高斯分布，而当
  \( t \) 为奇数时它是具有一度自由度的平移 \(\chi^2\) 分布。过程 \(\{x_t\}\) 不是同分布的，因此不是严格平稳的。如果假设对所有 \(
  T \) 都有 \( z_1^T \) 服从多元正态分布，则弱平稳性等价于严格平稳性，因为正态（或高斯）分布由其前两阶矩决定。


  #### 1.2.1.2 白噪声过程


  一个重要的平稳过程是 *白噪声过程*。随机过程 \( z_t \) 是白噪声过程，当且仅当它满足以下条件：(1) \( E(z_t) = 0 \)；(2) \(
  Var(z_t) = \sigma^2 < \infty \)；且 (3) 对于所有 \( j \neq 0 \) 有 \( Cov(z_t, z_{t-j})
  = 0 \)。换句话说，\( z_t \) 是白噪声序列当且仅当它具有零均值和有限方差，并且不存在序列相关性。因此，白噪声不一定是严格平稳的。如果施加额外条件，即
  \( z_t \) 与 \( z_{t-j} \) 独立且服从同一分布，其中 \( j \neq 0 \)，则 \( z_t \) 是 *严格白噪声过程*。


  #### 1.2.1.3 条件分布


  除了边缘分布外，条件分布在研究随机过程中也起着重要作用。设 \( z_\ell^k = (z_\ell, z_{\ell+1}, \dots, z_k)'' \)，其中
  \( \ell \) 和 \( k \) 为正整数且 \( \ell \le k \)。在预测中，我们关注在给定 \( z_1^T \) 时 \( z_{T+1}^{T+h}
  \) 的条件分布，其中 \( h \ge 1 \) 被称为 *预测期*。在估计中，我们将 \( z_1^T \) 的联合概率密度函数表示为 \( z_{t+1}
  \) 在给定 \( z_1^t \) 时的条件密度函数的乘积，其中 \( t = T - 1, T - 2, \dots, 1 \)。更多细节将在后续章节中介绍。


  如果随机过程 \( z_t \) 具有以下性质


  \[

  f(z_{t+1}|z_1^t) = f(z_{t+1}|z_t), \quad t = 1, 2, \dots,

  \]


  则 \( z_t \) 是一阶 *马可夫过程*。上述性质被称为马可夫过程的无记忆性，因为条件分布仅取决于前一期的变量。


  ### 1.2.2 向量过程


  随机向量过程是随机向量的序列 \(\{z_t\}\)，其中索引 \( t \) 取自某个集合 \( C \) 的值，且 \( z_t = (z_{1t}, \dots,
  z_{kt})'' \) 是一个 \( k \) 维向量。每个分量 \( z_{it} \) 遵循一个标量随机过程，而向量过程由随机变量 \( (z_1, \dots,
  z_T) \) 的联合概率分布来表征。与标量情况类似，我们定义 \( z_t \) 的均值向量为


  \[

  E(z_t) = [E(z_{1t}), E(z_{2t}), \dots, E(z_{kt})]'' = (\mu_{1t}, \dots, \mu_{kt})''
  \equiv \mu_t,

  \]


  前提是期望存在，以及滞后-\(\ell\) 自协方差函数为


  \[

  \Gamma(t, t-\ell) = Cov(z_t, z_{t-\ell}) = E[(z_t - \mu_t)(z_{t-\ell} - \mu_{t-\ell})'']
  \quad (1.5)

  \]


  前提是涉及的所有协方差都存在，其中 \(\ell\) 是整数。我们说向量过程 \(\{z_t\}\) 是弱平稳的，如果 (a) \(\mu_t = \mu\)，一个常数向量，且
  (b) \(\Gamma(t, t - \ell)\) 仅取决于 \(\ell\)。换句话说，\(k\) 维随机过程 \(z_t\) 若其前两阶矩与时间无关，则是弱平稳的。在此情况下，我们写
  \(\Gamma(t, t - \ell) = E[(z_t - \mu)(z_{t-\ell} - \mu)''] = \Gamma(\ell) = [\gamma_{ij}(\ell)]\)，其中
  \(1 \le i, j \le k\)。特别是，弱平稳 \(k\) 维随机过程 \(z_t\) 的滞后-0 自协方差矩阵由以下给出


  \[

  \Gamma(0) = \begin{bmatrix} \gamma_{11}(0) & \gamma_{12}(0) & \cdots & \gamma_{1k}(0)
  \\ \gamma_{21}(0) & \gamma_{22}(0) & \cdots & \gamma_{2k}(0) \\ \vdots & \vdots
  & \ddots & \vdots \\ \gamma_{k1}(0) & \gamma_{k2}(0) & \cdots & \gamma_{kk}(0) \end{bmatrix}
  \quad (1.6)

  \]


  它是对称的，因为 \(\gamma_{ij}(0) = \gamma_{ji}(0)\)。注意，对角元素 \(\gamma_{ii}(0) = \sigma_i^2
  = \text{Var}(z_{it})\)。


  对于平稳向量过程 \(z_t\)，其滞后-\(\ell\) 自协方差矩阵 \(\Gamma(\ell) = [\gamma_{ij}(\ell)]\) 度量了分量序列
  \(z_{it}\) 及其滞后变量 \(z_{j,t-\ell}\) 之间的线性依赖关系。研究 \(\Gamma(\ell)\) 中各个元素 \(\gamma_{ij}(\ell)\)
  的精确含义是有意义的。首先，对角元素 \(\gamma_{ii}(\ell)\) 是标量过程 \(z_{it}\) (\(i = 1, \dots, k\))
  的滞后-\(\ell\) 自协方差。其次，非对角元素 \(\gamma_{ij}(\ell)\) 是


  \(\gamma_{ij}(\ell) = E[(z_{it} - \mu_i)(z_{j,t-\ell} - \mu_j)]\)


  它度量了 \(z_{it}\) 对滞后值 \(z_{j,t-\ell}\) 的线性依赖（当 \(\ell > 0\) 时）。因此，\(\gamma_{ij}(\ell)\)
  量化了 \(z_{it}\) 对 \(z_{jt}\) 的第 \(\ell\) 个过去值的线性依赖。第三，一般来说，如果 \(\ell > 0\)，\(\Gamma(\ell)\)
  不是对称的。事实上，对于大多数随机过程 \(z_t\)，\(\gamma_{ij}(\ell) \neq \gamma_{ji}(\ell)\)，因为如前所述，\(\gamma_{ij}(\ell)\)
  表示 \(z_{it}\) 对 \(z_{j,t-\ell}\) 的线性依赖，而 \(\gamma_{ji}(\ell)\) 量化 \(z_{jt}\) 对 \(z_{i,t-\ell}\)
  的线性依赖。最后，我们有


  \(\gamma_{ij}(-\ell) = E[(z_{it} - \mu_i)(z_{j,t+\ell} - \mu_j)]\)

  \(= E[(z_{j,v} - \mu_j)(z_{i,v-\ell} - \mu_i)] \quad (v = \text{t} + \ell)\)

  \(= \gamma_{ji}(\ell). \quad \text{(by stationarity)}\)


  因此，对于所有 \(\ell\) 都有 \(\gamma_{ij}(-\ell) = \gamma_{ji}(\ell)\)。平稳向量过程 \(z_t\) 的自协方差矩阵满足


  \(\Gamma(-\ell) = [\Gamma(\ell)]''\)


  因此，在实践中只需考虑 \(\ell \ge 0\) 时的 \(\Gamma(\ell)\) 即可。如果需要 \(\Gamma(\ell)\) 的维度以避免任何混淆，我们写
  \(\Gamma(\ell) \equiv \Gamma_k(\ell)\)，其中下标 \(k\) 表示基础随机过程 \(z_t\) 的维度。


  过程 \(z_t\) 整体变异性的全局度量由其广义方差给出，即滞后-0 协方差矩阵 \(\Gamma(0)\) 的行列式，也就是 \(|\Gamma(0)|\)。按维度标准化的度量是有效方差，定义为


  \(\text{EV}(\mathbf{z}_t) = |\Gamma(0)|^{1/k}.\) (1.7)


  例如，如果 \(\mathbf{z}_t\) 是二维的，则 \(\text{EV}(\mathbf{z}_t) = [\gamma_{11}(0)\gamma_{22}(0)\{1
  - \rho_{12}^2(0)\}]^{1/2}\)，其中 \(\rho_{12}(0)\) 是 \(z_{1t}\) 与 \(z_{2t}\) 之间的瞬时相关系数。





  显然，当两个序列不相关时，EV($z_t$) 取得最大值，即 \(\rho_{12}(0) = 0\)。对于一个 \(k\)-维过程 $z_t$，由于方阵的行列式是其特征值的乘积，有效方差是
  \(\Gamma(0)\) 特征值的几何平均值。


  我们可以通过其分量的线性组合来总结平稳向量过程 $z_t$ 的性质。例如，考虑线性过程


  $$y_t = c''z_t = \sum_{i=1}^k c_i z_{it}$$


  其中 $c = (c_1, ..., c_k)'' \neq 0$。该过程是平稳的，因为它是平稳分量 $z_{it}$ ($i = 1, ..., k$) 的有限线性组合。更具体地说，期望为
  $E(y_t) = c_1 E(z_{1t}) + ... + c_k E(z_{kt}) = c''E(z_t) = c''\mu$，它是时间不变的。同样，$y_t$
  的方差由 $\text{Var}(y_t) = \text{Var}(c''z_t) = c''\text{Var}(z_t)c = c''\Gamma(0)c$
  给出，这也是时间不变的。一般来说，我们有 $\text{Cov}(y_t, y_{t-\ell}) = c''\Gamma(\ell)c$，它只依赖于 $\ell$。因此，$y_t$
  是平稳的。此外，由于 $\text{Var}(y_t)$ 是非负的且 $c$ 是任意非零向量，我们得出 $\Gamma(0)$ 是半正定的。


  类似于标量情况，平稳向量过程 $z_t$ 在 Eq. (1.5) 中的自协方差矩阵必须满足某些条件。为了说明这一点，我们考虑 $z_t$ 及其 $m$ 个滞后值的非零线性组合，例如，


  $$y_t = \sum_{i=1}^m b''_i z_{t-i+1} = b''_1 z_t + b''_2 z_{t-1} + \cdots + b''_m
  z_{t-m+1}$$


  其中 $b_j = (b_{j1}, ..., b_{jk})''$ 为 $j = 1, ..., m$ 的 $k$-维实向量。定义 $b = (b''_1,
  b''_2, ..., b''_m)''$，即一个非零的 $km$-维常数向量，以及 $z_{t,m} = (z''_t, z''_{t-1}, ..., z''_{t-m+1})''$，则有
  $\text{Var}(y_t) = b''\text{Var}(z_{t,m})b = b''M_z(m)b$，其中


  $$M_z(m) = \begin{bmatrix} \Gamma(0) & \Gamma(1) & \cdots & \Gamma(m-1) \\ \Gamma(-1)
  & \Gamma(0) & \cdots & \Gamma(m-2) \\ \vdots & \vdots & \ddots & \vdots \\ \Gamma(-m+1)
  & \Gamma(-m+2) & \cdots & \Gamma(0) \end{bmatrix} \quad (1.8)$$


  是一个非负分块 Toeplitz 矩阵。这个 $M_z(m)$ 矩阵是标量序列 $z_t$ 在 Eq. (1.3) 中的 $M_z(m)$ 的推广。


  $z_t$ 的互相关矩阵（CCMs）定义为标准化过程 $x_t = D^{-1/2}(z_t - \mu)$ 的自协方差，其中矩阵 $D$ 定义为 $\text{diag}(\gamma_{11}(0),
  ..., \gamma_{kk}(0))$，由 $z_t$ 的分量方差组成。具体来说，$z_t$ 的滞后-\(\ell\) CCM 为


  $$R_z(\ell) = \text{Cov}(x_t, x_{t-\ell}) = D^{-1/2} \text{Cov}(z_t, z_{t-\ell})
  D^{-1/2}$$


  $$= \begin{bmatrix} \rho_{11}(\ell) & \rho_{12}(\ell) & \cdots & \rho_{1k}(\ell)
  \\ \rho_{21}(\ell) & \rho_{22}(\ell) & \cdots & \rho_{2k}(\ell) \\ \vdots & \vdots
  & \ddots & \vdots \\ \rho_{k1}(\ell) & \rho_{k2}(\ell) & \cdots & \rho_{kk}(\ell)
  \end{bmatrix} \quad (1.9)$$


  根据定义，我们有 \(\rho_{ii}(0) = 1\) 且


  \(\rho_{ij}(\ell) = \frac{\gamma_{ij}(\ell)}{\sqrt{\gamma_{ii}(0)\gamma_{jj}(0)}}.\)


  类似于自协方差矩阵，我们有 \(M_z(\ell) = [M_z(-\ell)]''\).


  $z_t$ 的有效相关性由


  \(\text{ER}_z = 1 - |\text{R}_z(0)|^{1/k}\) (1.10)


  给出，其值在零和一之间。例如，当 \(k=2\) 时，\(\text{ER}_z = 1 - [1 - \rho_{12}(0)]^{1/2}\)。更多性质请参见
  Peña and Rodriguez (2003)。


  #### 1.2.2.1 向量白噪声


  若 \(k\)-维向量过程 \(z_t\) 满足 (a) \(E(z_t) = 0\)，(b) \(\text{Var}(z_t) = \Gamma(0)\)
  为正定，且 (c) 对所有 \(\ell \neq 0\) 有 \(\Gamma(\ell) = 0\)，则称其为白噪声过程。这是标量白噪声的直接推广。因此，向量白噪声过程由零均值、正定协方差且无滞后自相关或互相关的随机向量组成。


  #### 1.2.2.2 可逆性


  在许多应用中，我们使用线性回归类型的模型来描述向量过程的动态依赖性。该模型可写为


  \(z_t = \pi_0 + \sum_{i=1}^{\infty} \pi_i z_{t-i} + a_t\) (1.11)


  其中 \(\{a_t\}\) 是平稳向量白噪声过程，\(\pi_0\) 是常数 \(k\)-维向量，\(\pi_i\) 为 \(k \times k\) 实值矩阵。为了使
  Eq. (1.11) 有意义，系数矩阵必须满足条件


  \(\sum_{i=1}^{\infty} \|\pi_i\| < \infty\) (1.12)


  其中 \(\|\mathbf{A}\|\) 表示矩阵 \(\mathbf{A}\) 的一个范数，例如 \(\|\mathbf{A}\| = \left( \sum_{i=1}^k
  \sum_{j=1}^k a_{ij}^2 \right)^{1/2}\)，即 \(Frobenius\) 范数。若向量过程 \(z_t\) 可以采用满足 Eq.
  (1.12) 条件的 (1.11) 模型，则称其为 \(invertible\)（可逆）。若 Eq. (1.11) 中的求和在有限整数 \(p\) 处截断，则
  \(z_t\) 可逆，且该过程遵循向量自回归（VAR）模型。


  可逆性是时间序列分析中的另一个重要概念。可逆模型的一个必要条件是当 \(i \to \infty\) 时 \(\|\pi_i\| \to 0\)。这意味着，在已知信息
  \(\{z_{t-1}, z_{t-2}, \dots, z_{t-\ell+1}\}\) 的条件下，\(z_{t-\ell}\) 对 \(z_t\) 的附加贡献随着
  \(\ell\) 增加而减小。考虑标量过程 \(z_t\)，任何有限 \(p\) 的 AR(\(p\)) 过程都是可逆的。另一方面，过程 \(z_t = a_t
  - a_{t-1}\)，其中 \(\{a_t\}\) 是白噪声，是平稳的，但不可逆。


  ## 1.3 平稳向量过程的样本矩


  在实际应用中，我们通常观察到平稳向量过程 \(z_t\) 的一系列实现，例如 \(\{z_1, \dots, z_T\}\)。我们的目标是根据观察数据研究 \(z_t\)
  的性能。为此，某些探索性数据分析很有用。特别是，通过研究其样本矩，可以了解许多关于 \(z_t\) 的信息。


  ### 1.3.1 样本均值


  标量过程 \(z_{it}\) 总体均值的无偏估计量是样本均值


  \(\bar{z}_{\cdot i} = \frac{1}{T} \sum_{t=1}^T z_{it}.\) (1.13)


  将它们合在一起，向量过程 \(\boldsymbol{z}_t\) 的样本均值为


  \(\bar{\boldsymbol{z}} = (\bar{z}_1, \dots, \bar{z}_k)'' = \frac{1}{T} \sum_{t=1}^T
  \boldsymbol{z}_t.\) (1.14)


  对于独立同分布的随机样本，容易看出 \(E(\bar{z}_i) = E(z_{it}) = \mu_i\)；且 \(\bar{z}_i\) 的方差为 \(\sigma_i^2
  / T\)，其中 \(\sigma_i^2 = \text{Var}(z_{it})\)。因此，在这种情况下，当 \(T \to \infty\) 时，样本均值是总体均值
  \(\mu_i\) 的一致估计量。


  需要注意的是，对于平稳过程，样本均值的一致性不一定成立。例如，令 \(z_{11}\) 为来自均值为零、方差为 \(\sigma^2\) 的正态分布的随机样本。令
  \(t = 2, \dots, T\) 时 \(z_{1t} = z_{11}\)。这个特殊过程 \(\{z_{1t}\}\) 是平稳的，因为 (1) \(E(z_{1t})
  = 0\)，是时间不变的，(2) \(\text{Var}(z_{1t}) = \sigma^2\)，也是时间不变的，且 \(\text{Cov}(z_{1t},
  z_{1t-j}) = \sigma^2\)，对所有 \(j\) 都是时间不变的。然而，在这个特定情况下，无论样本量 \(T\) 为多少，都有 \(\bar{z}_{\cdot
  1} = z_{11}\) 和 \(\text{Var}(\bar{z}_{\cdot 1}) = \sigma_1^2\)。因此，当 \(T \to \infty\)
  时，样本均值不是这个特殊过程的一致估计量。


  样本均值 \(\bar{z}_{\cdot i}\) 作为总体均值 \(\mu_i\) 的一致估计量的条件，被称为随机过程的 *遍历* 条件。遍历理论关注的是长实现的时间平均（样本均值）收敛到动态系统空间平均（在给定时刻下许多随机样本的平均）的条件。对于标量弱平稳
  \(z_t\)，\(\bar{z}\) 收敛到 \(\mu = E(z_t)\) 的遍历条件是 \(\sum_{i=0}^{\infty} |\gamma_i|
  < \infty\)。从本书起，我们假设此条件成立。


  对于弱平稳向量过程 \(\boldsymbol{z}_t\)，样本均值 \(\bar{\boldsymbol{z}}\) 的协方差矩阵由


  \(\begin{aligned} \text{Var}(\bar{\boldsymbol{z}}) &= E \left[ (\bar{\boldsymbol{z}}
  - \boldsymbol{\mu})(\bar{\boldsymbol{z}} - \boldsymbol{\mu})'' \right] = E \left[
  \left\{ \frac{1}{T} \sum_{t=1}^T (\boldsymbol{z}_t - \boldsymbol{\mu}) \right\}
  \left\{ \frac{1}{T} \sum_{j=1}^T (\boldsymbol{z}_j - \boldsymbol{\mu})'' \right\}
  \right] \\ &= \frac{1}{T^2} \sum_{t=1}^T E \left[ (\boldsymbol{z}_t - \boldsymbol{\mu})
  \left\{ \sum_{j=1}^T (\boldsymbol{z}_j - \boldsymbol{\mu})'' \right\} \right] =
  \frac{1}{T^2} \left[ \sum_{|j-t| \le T-1} (T - |j|)\boldsymbol{\Gamma}(j) \right]
  . \end{aligned}\) (1.15)


  这意味着标量样本均值 \(\bar{z}_{\cdot i}\) 的渐近方差为


  \(T \times \text{Var}(\bar{z}_{\cdot i}) \to \gamma_{ii}(0) + 2 \sum_{\ell=1}^{\infty}
  \gamma_{ii}(\ell), \quad \text{as } T \to \infty.\) (1.16)


  再次说明，\(\gamma_{ii}(\ell)\) 是 \(z_{it}\) 的滞后-\(\ell\) 自协方差。根据 Equation (1.2)，如果 \(\{z_{it}\}\)
  是白噪声，则样本均值 \(\bar{z}_{\cdot i}\) 的方差为 \(\sigma_i^2 / T\)。一般来说，我们有


  \(\text{Var}(\bar{z}_{\cdot i}) \approx \frac{1}{T} \left[ \gamma_{ii}(0) + 2 \sum_{l=1}^{T}
  \gamma_{ii}(l) \right] , \quad \text{as } T \to \infty.\)






  因此，若 \(z_{it}\) 的自协方差之和较大，则 Var\((\bar{z}_t)\) 可能较大。\(z_{it}\) 的自协方差之和收敛的一个必要（但不充分）条件是


  \(\lim_{l \to \infty} \gamma_{ii}(l) \to 0,\)


  这意味着随着 \(l\) 增大，\(z_{it}\) 对其过去值 \(z_{i,t-l}\) 的依赖性消失。


  ### 1.3.2 样本协方差矩阵与相关系数矩阵


  对于向量过程 \(\mathbf{z}_t\)，滞后-\(\ell\) 样本自协方差矩阵为


  \(\hat{\mathbf{\Gamma}}(\ell) = \frac{1}{T} \sum_{t=\ell+1}^{T} (\mathbf{z}_t -
  \bar{\mathbf{z}})(\mathbf{z}_{t-\ell} - \bar{\mathbf{z}})'' .\) (1.17)


  特别是，样本协方差矩阵为


  \(\hat{\mathbf{\Gamma}}(0) = \frac{1}{T} \sum_{t=1}^{T} (\mathbf{z}_t - \bar{\mathbf{z}})(\mathbf{z}_t
  - \bar{\mathbf{z}})'' .\)


  \(\mathbf{z}_t\) 的滞后-\(\ell\) 样本 CCM 为


  \(\hat{\mathbf{R}}(\ell) = \hat{\mathbf{D}}^{-1/2} \hat{\mathbf{\Gamma}}(\ell) \hat{\mathbf{D}}^{-1/2}
  ,\) (1.18)


  其中 \(\hat{\mathbf{D}} = \text{diag}\{\hat{\gamma}_{11}(0), ..., \hat{\gamma}_{kk}(0)\}\)。由公式
  (1.18) 得


  \(\hat{\mathbf{R}}(\ell) = [\hat{\rho}_{ij}(\ell)] \quad \text{with} \quad \hat{\rho}_{ij}(\ell)
  = \frac{\hat{\gamma}_{ij}(\ell)}{\sqrt{\hat{\gamma}_{ii}(0)\hat{\gamma}_{jj}(0)}}
  .\)


  在某些温和条件下，对于弱平稳过程 \(\mathbf{z}_t\)，\(\hat{\mathbf{R}}(\ell)\) 是 \(\mathbf{R}(\ell)\)
  的一致估计量。若 \(\mathbf{z}_t\) 是平稳高斯过程，则满足上述条件。然而，\(\hat{\mathbf{R}}(\ell)\) 的渐近性质相当复杂。它们取决于过程
  \(\mathbf{z}_t\) 的动态依赖性。不过，某些特例的结果更容易理解。假设向量时间序列 \(\mathbf{z}_t\) 是白噪声过程，使得当 \(\ell
  \neq 0\) 时 \(\mathbf{R}(\ell) = \mathbf{0}\)。此时，我们有


  \(\text{Var}[\hat{\rho}_{ij}(\ell)] \approx \frac{1}{T}, \quad \ell \neq 0.\)


  并且，当 \(i \neq j\) 时，


  \(\text{Var}[\hat{\rho}_{ij}(0)] \approx \frac{[1 - \rho_{ij}^2(0)]^2}{T} .\) (1.19)


  更多细节见，例如，Reinsel (1993, section 4.1.2)。这些简单结果在向量时间序列的探索性数据分析中很有用。当维度 \(k\) 较大时尤其如此。分析时间序列数据的一个重要特征是探索观察时间序列的动态依赖性。对于一个
  \(k\) 维序列，每个样本 CCM \(\hat{\mathbf{R}}(\ell)\) 都是一个 \(k \times k\) 矩阵。若 \(k=10\)，则每个
  CCM 包含 100 个样本相关系数。要同时破译样本 CCM \(\hat{\mathbf{R}}(\ell)\) 中嵌入的模式（对 \(\ell = 1, ...,
  m\)，其中 \(m\) 是给定的正整数）并非易事。为辅助阅读样本 CCM，Tiao and Box (1981) 提出了一种简化方法来检查样本 CCM 的特征。具体地，考虑
  \(\hat{\boldsymbol{\mathcal{R}}}(\ell)\) 对 \(\ell > 0\)。Tiao and Box 定义相应的简化矩阵 \(\boldsymbol{\mathcal{S}}(\ell)
  = [S_{ij}(\ell)]\)，其中


  ```

  S_{ij}(\ell) = \begin{cases} + & \text{if } \hat{\rho}_{ij}(\ell) \ge 2/\sqrt{T},
  \\ . & \text{if } |\hat{\rho}_{ij}(\ell)| < 2/\sqrt{T}, \\ - & \text{if } \hat{\rho}_{ij}(\ell)
  \le -2/\sqrt{T}, \end{cases}

  ```


  其中可理解为，只要 \(z_t\) 是高斯白噪声，\(1/\sqrt{T}\) 就是 \(\hat{\boldsymbol{\mathcal{R}}}(\ell)\)
  元素的样本标准误。通过检查简化 CCM \(\boldsymbol{\mathcal{S}}(\ell)\) 对 \(\ell = 1, ..., m\)，要更容易理解
  \(z_t\) 的动态依赖性。我们通过一个例子演示简化 CCM 的有效性。



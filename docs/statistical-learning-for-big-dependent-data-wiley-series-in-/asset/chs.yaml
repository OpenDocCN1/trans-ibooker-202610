- "# 时间序列的聚类与分类\n\n在本章中，我们研究如何将一组时间序列划分为具有相似属性的同质时间序列组，以及如何将一个时间序列分类到若干可能簇中的某一个。实现这些目标的程序称为分类方法。当在没有参考集的情况下进行分类时，在该参考集中，相似序列被组织为已知数量的组，该程序称为聚类方法。这种分类也称为无监督分类或无监督模式识别。当我们有已按标签分类到各组的序列，且目标是对新观测到的序列进行分类时，该程序称为判别方法。此时，分类称为有监督分类或有监督模式识别。\n\
  \n在时间序列聚类中，我们有一组 k 个时间序列 \\((z_{i1}, \\dots, z_{iT})\\)，其中 \\(i = 1, \\dots, k\\\
  )，希望将这 k 个时间序列划分为若干组（或簇），使得（1）所有时间序列都被分类，（2）每个时间序列仅属于一个组，（3）每个组在内部尽可能同质。聚类是数据分析中的重要方法，并在许多科学领域有应用。聚类程序（i）选择两个时间序列之间的近似度量（距离或不相似度）并利用这些近似度来形成组，或（ii）为第\
  \ \\(i\\) 个时间序列定义一组特征或变量 \\(x_i\\)，其中 \\(x_i \\in \\mathbb{R}^p\\)，总结其属性，并利用这 k\
  \ 个变量向量进行分组。然后，通过以下方式构建簇：（a）使用层次聚类方法等基于序列间某些近似度的数据聚合；（b）如 k-means 等按相似度将数据划分为组；（c）如基于模型的聚类等估计若干数据生成模型的混合物（包括混合概率）；以及（d）将数据投影到更小的空间以寻找簇。\n\
  \n\n\n\n\n分类或歧视如下所示。假设研究的系统属于 c 个可能状态中的一个，记作 \\(S = (s_1, \\dots, s_c)\\)，并且每个观测时间序列是由且仅由其中一个状态生成的。对于每个状态，都有可用的观测时间序列的一些特征，因此我们可以推断给定状态下系统的预期输出。接下来，观察到一个新的时间序列，但其系统状态未知。其目标是对生成观测时间序列的系统状态做出决策，或者将时间序列归类为\
  \ \\(c\\) 个可能状态中的一个。具有两个状态（\\(c = 2\\)）的分类的一些经典应用包括：利用地震数据区分核爆炸和地震；利用心电图（ECG）区分受神经系统疾病影响或未受影响的个体；利用一组经济时间序列区分经济的扩张或收缩时期；利用一组量化公司信用度的时间序列区分公司的成功或破产。\n\
  \n分类所使用的程序也取决于关于每个状态输出的可用信息。存在三种可能情况。第一种情况是：我们知道每个状态用于生成数据的时间序列模型。问题在于将输出归类为生成观测序列概率最高的状态。在第二种情况下，我们不知道模型，但给定状态下时间序列的一组特征（变量）的分布可以得到。然后，我们可以计算观测时间序列的特征，并利用其分布进行分类。这种情况类似于多元分析中的标准判别分析。在第三种情况下，我们拥有由每个状态生成的一系列样本，这些样本汇总为具有未知联合分布的特征，并应用一些非参数方法来进行分类。\n\
  \n## 5.1 距离与不相似度\n\n寻找彼此相似的序列是一个具有许多应用的常见问题。事实上，序列之间的相似性是所有分类问题中的关键概念。在本节中，我们讨论时间序列之间的一些距离或不相似性度量。给定一个距离度量后，可以通过将距离接近的序列组合在一起来形成序列组。使用的合适距离度量的选择取决于分类的目标。此外，序列对之间的所有距离或不相似性通常汇总在一个近似矩阵中，分析该矩阵的特征对于表征时间序列集非常重要。\n\
  \n### 5.1.1 一元时间序列之间的距离\n\n假设我们想要定义两个平稳时间序列 \\(x_t\\) 和 \\(y_t\\) 之间的距离度量。我们假设，不失一般性，序列已被标准化，因此具有零均值和单位方差。两个向量\
  \ \\(x_t\\) 和 \\(y_t\\) 之间的距离是一个函数 \\(d(x_t, y_t)\\)，具有以下三个性质：(1) 该函数是非负的，\\(d(x_t,\
  \ y_t) \\ge 0\\)，并且当且仅当 \\(x_t = y_t\\) 时取值为 0；(2) 该函数是对称的，\\(d(x_t, y_t) = d(y_t,\
  \ x_t)\\)；(3) 该函数满足三角不等式，\\(d(x_t, y_t) \\le d(x_t, z_t) + d(z_t, y_t)\\)。两个时间序列之间的一个简单距离度量可以通过直接比较其观测值来构建。当然，这只有在序列被标准化（如本节所假设）时才有用，这样它们的值就不依赖于尺度。然后，给定\
  \ \\(\\boldsymbol{x}_t = (x_1, \\dots, x_T)'\\) 和 \\(\\boldsymbol{y}_t = (y_1, \\\
  dots, y_T)'\\)，两个序列之间的欧氏距离（或欧氏度量）为\n\n\\(d_E(\\boldsymbol{x}_t, \\boldsymbol{y}_t)\
  \ = \\sqrt{(\\boldsymbol{x}_t - \\boldsymbol{y}_t)'(\\boldsymbol{x}_t - \\boldsymbol{y}_t)}\
  \ = \\sqrt{2T(1 - \\widehat{\\rho}_{xy}(0))}.\\) (5.1)\n\n该距离仅依赖于序列间滞后零自相关 \\(\\\
  widehat{\\rho}_{xy}(0)\\)，因此不考虑序列间任何可能的滞后关系。\n\n定义距离的一个有用程序是将时间序列 \\(\\boldsymbol{x}_t\\\
  ) 汇总为一个特征向量 \\(\\boldsymbol{\\theta}_x = (\\theta_{x1}, \\dots, \\theta_{xp})'\\\
  )，并使用所得到的向量定义距离。构建两个标准化数据向量之间距离的常见方法是使用明科夫斯基族\n\n\\(d_m(\\boldsymbol{\\theta}_x,\
  \ \\boldsymbol{\\theta}_y) = \\left( \\sum_{i=1}^p |\\theta_{xi} - \\theta_{yi}|^m\
  \ \\right)^{1/m}.\\) (5.2)\n\n其中 \\(m > 0\\)。例如，当 \\(m = 1\\) 时，我们有 \\(L_1\\) 或“街区”距离。当\
  \ \\(m = 2\\) 时，是欧氏或 \\(L_2\\) 距离，而当 \\(m \\to \\infty\\) 时，\\(d_\\infty(\\boldsymbol{\\\
  theta}_x, \\boldsymbol{\\theta}_y) \\rightarrow \\sup \\{ |\\theta_{xi} - \\theta_{yi}|,\
  \ 1 \\le i \\le p \\}\\)。可以证明，如果 \\(a \\ge b\\) 且 \\(b \\ge 1\\)，则 \\(d_a(\\boldsymbol{\\\
  theta}_x, \\boldsymbol{\\theta}_y) \\le d_b(\\boldsymbol{\\theta}_x, \\boldsymbol{\\\
  theta}_y)\\)。\n\n平稳一元时间序列的线性动态依赖由其自相关结构表征。因此，我们可以通过比较两个序列的理论或估计自相关来构建一个距离度量。我们通常比较自相关系数函数（ACF），但也可以使用偏自相关或逆自相关，或这些系数的组合（如周期图）。令\
  \ \\(\\widehat{\\boldsymbol{\\rho}}_x = (\\widehat{\\rho}_x(1), \\dots, \\widehat{\\\
  rho}_x(h))'\\) 为样本 ACF 的前 \\(h\\) 个滞后向量，两个序列 \\(x_t\\) 和 \\(y_t\\) 之间的距离可定义为\n\n\
  \\(d(x_t, y_t, h) = \\sqrt{\\sum_{j=1}^h [\\widehat{\\rho}_x(j) - \\widehat{\\rho}_y(j)]^2}.\\\
  ) (5.3)\n\n即向量 \\(\\widehat{\\boldsymbol{\\rho}}_x\\) 和 \\(\\widehat{\\boldsymbol{\\\
  rho}}_y\\) 之间的欧氏距离，称为 ACF 距离。在等式 (5.3) 中，所有 ACF 具有相同的权重。这可以通过引入一个权重矩阵来修改，该矩阵是 ACF\
  \ 阶次的递减函数。例如，权重可能呈线性下降。对于样本 ACF，权重可能取决于其渐近方差，使得高阶系数具有较低的权重，因为它们往往具有更高的变异性。第三种更复杂的替代方案是考虑样本\
  \ ACF 是相关的，并使用两个样本 ACF 向量之间的马氏距离。因此，ACF 之间的一般距离度量为\n\n\\(d_W(x_t, y_t, h) = \\sqrt{(\\\
  widehat{\\boldsymbol{\\rho}}_x - \\widehat{\\boldsymbol{\\rho}}_y)' \\boldsymbol{W}\
  \ (\\widehat{\\boldsymbol{\\rho}}_x - \\widehat{\\boldsymbol{\\rho}}_y)}.\\)\n\n\
  其中，如果所有系数具有相同权重（如等式 (5.3) 中），矩阵 \\(\\boldsymbol{W}\\) 为单位矩阵；如果权重随滞后递减，则为对角矩阵；如果它是样本\
  \ ACF 的逆协方差矩阵，则为满秩矩阵。\n\n汇总时间序列的另一种方法是将 AR(h) 模型拟合到序列，并使用估计自回归（AR）系数向量 \\(\\hat{\\\
  phi}_x = [\\hat{\\phi}_x(1), \\dots, \\hat{\\phi}_x(h)]'\\)。然后，计算 AR 系数向量之间的欧氏距离。该度量由\
  \ Piccolo (1990) 提出。另参见 Corduas 和 Piccolo (2008)。其形式为\n\n\\(d_\\phi(x_t, y_t, h)\
  \ = \\sqrt{\\sum_{j=1}^h [\\hat{\\phi}_x(j) - \\hat{\\phi}_y(j)]^2}.\\) (5.4)\n\n\
  基于 ACF 或 AR 系数向量的距离是非参数的，因为 ACF 或 AR 拟合并未隐含假设底层时间序列的参数模型。在实践中，使用的滞后或阶数 h 必须足够大，以恰当描述数据的线性动态依赖。\n\
  \n参数方法是比较为两个时间序列指定的给定模型的参数向量。不过必须谨慎。例如，将 AR 和 MA 参数合并在一起以形成 ARIMA 模型的参数向量不是个好主意，因为相似的\
  \ ARIMA 模型可能具有相当不同的参数值。例如，系数为 0.4 的 MA(1) 模型与系数为 (-0.4, -0.16, -0.064) 的 AR(3) 模型很接近。Peña\
  \ (1990) 提出使用两个 ARIMA 模型的 AR 表示来定义它们之间的距离，即\n\n\\(d_\\pi(x_t, y_t, h) = \\sqrt{(\\\
  pi_x - \\pi_y)' V^{-1} (\\pi_x - \\pi_y)},\\) (5.5)\n\n其中 \\(V^{-1}\\) 是两个 \\(\\\
  pi\\) 权重向量的平均精度矩阵的一种度量。汇总时间序列动态依赖的另一种方法是使用其归一化周期图，在第 2 章中为平稳过程定义为\n\n\\(\\text{NI}(w_j)\
  \ = 2 \\left[ 1 + 2 \\sum_{h=1}^{T-1} \\hat{\\rho}_z(h) \\cos(w_j h) \\right], \\\
  quad 0 \\le w_j \\le \\pi.\\)\n\nCaiado et al. (2006) 提出了基于归一化周期图对数的两个周期图之间的距离\n\
  \n\\(d_\\text{NP}(x_t, y_t) = \\sqrt{\\sum_{j=1}^{[T/2]} [\\log \\text{NI}_x(2\\\
  pi j/T) - \\log \\text{NI}_y(2\\pi j/T)]^2}.\\) (5.6)\n\n很容易证明，所有先前的距离度量都满足距离的三个性质。\n\
  \n对于非平稳时间序列，我们不能使用它们的 ACF。要聚类整合时间序列，可以使用等式 (5.5) 比较参数，或者进行适当差分并比较所得平稳序列的 ACF。在其他情况下，人们可能对趋势或季节系数等特征向量感兴趣，并使用这些特征之间的距离来聚类时间序列。还可以使用\n\
  \n\n进行一系列预测以执行聚类，例如比较预测密度（Alonso et al., 2006）或一组样本外预测向量。此外，由于数据可能包含异常值，清理序列或使用某些稳健方法来计算\
  \ ACF 或 AR 系数非常重要。对于 ACF，可以使用 Spearman 秩相关，即使用相应的秩序列来计算 ACF；例如，参见 Tsay (2020)。所有距离都可以汇总在一个对称的距离矩阵中，该矩阵在对角线上为零，在非对角线元素上为正值。\n\
  \n前面的距离基于时间序列的线性性质。进一步分析见 Maharaj et al. (2019)。一些作者提出了基于非线性特征的距离度量（参见 Montero 和\
  \ Vilar, 2014），或者旨在比较两个可能具有不同数据点数量的时间序列的形状。例如，在语音识别中，我们希望识别以不同语速录制的单词。在这种情况下，我们寻找两个序列之间的最佳对齐，这就是动态时间变换（dynamic\
  \ time warping）度量的目标，它最小化按顺序取取的序列值之间的某些距离。\n\n### 5.1.2 单变量序列之间的不相似度\n\n距离的一个问题是它们依赖于变量的尺度，并且在单调变换下不不变。例如，欧几里得度量的平方\
  \ $d_2^2$ 不满足三角不等式，因此不是一个度量。要验证这一事实，请考虑三个点 $A = (0, 0)$、$B = (5, 5)$ 和 $C = (2,\
  \ 0)$。使用欧氏距离 $d_2(AB) = 5\\sqrt{2} \\le d_2(AC) + d_2(CB) = 2 + \\sqrt{34}$，但使用平方时\
  \ $d_2^2(AB) = 50 > d_2^2(AC) + d_2^2(CB) = 4 + 34$，因此它不是一个度量。出于这个原因，通常使用基于观测值排序的近性度量，这些度量不受单调变换的影响。\n\
  \n两个时间序列的函数是一个不相似度，如果它满足：\n- (1) $D(x_t, y_t) \\ge 0$ 且 $D(x_t, y_t) = 0$ 当且仅当 $x_t\
  \ = ay_t + c$，其中 $a$ 和 $c$ 为某些常数；\n- (2) $D(x_t, y_t) = D(y_t, x_t)$。\n\n请注意，$D(x_t,\
  \ y_t)$ 不需要满足三角不等式。此外，对于标准化时间序列，$D(x_t, y_t) = 0$ 意味着 $x_t = y_t$。给定一个不相似度，我们可以按如下方式构建相似度度量：设\
  \ $M$ 为集合中两个时间序列之间的最大不相似度，函数\n\n```\n$S(x_t, y_t) = M - D(x_t, y_t),$\n```\n\n始终为正且对称，被称为相似度度量。通常不相似度满足\
  \ $0 \\le D(x_t, y_t) \\le 1$，其中 0 表示相同，1 表示独立，因此相似度也在 0 和 1 之间。\n\n基于序列相关系数向量（普通、偏相关或逆相关）的距离是滞后逐个滞后地比较系数，而两个来自过去相同可预测性但分布在不同滞后的序列可能看起来非常不同。如果我们对序列从其过去的全局依赖性感兴趣，对于标准化高斯变量，似然函数仅取决于相关矩阵的行列式。这表明将所有\
  \ ACF 汇总在观测值的相关矩阵中，如下所示：\n\n\\(\\boldsymbol{R}_T = \\begin{bmatrix} 1 & \\rho(1)\
  \ & \\cdots & \\rho(T-2) & \\rho(T-1) \\\\ \\rho(1) & 1 & \\cdots & \\rho(T-3) &\
  \ \\rho(T-2) \\\\ \\vdots & \\vdots & \\ddots & \\vdots & \\vdots \\\\ \\rho(T-2)\
  \ & \\rho(T-3) & \\cdots & 1 & \\rho(1) \\\\ \\rho(T-1) & \\rho(T-2) & \\cdots &\
  \ \\rho(1) & 1 \\end{bmatrix} \\equiv \\begin{bmatrix} 1 & \\boldsymbol{\\rho}'_{(1:T-1)}\
  \ \\\\ \\boldsymbol{\\rho}_{(1:T-1)} & \\boldsymbol{R}_{T-1} \\end{bmatrix} . \\\
  quad (5.7)\\)\n\n如果我们想表示底层时间序列，这个 Toeplitz 矩阵也表示为 \\(\\boldsymbol{R}_{z,T}$。根据分块矩阵行列式的性质，我们有\n\
  \n\\(|\\boldsymbol{R}_T| = |\\boldsymbol{R}_{T-1}|(1 - R^2_{T-1}), \\quad (5.8)\\\
  )\n\n其中 \\(R^2_{T-1} = \\rho'_{(1:T-1)} \\boldsymbol{R}^{-1}_{T-1} \\rho_{(1:T-1)}$\
  \ 是序列 \\(z_t$ 通过所有可能滞后进行的 AR(T - 1) 拟合的多元相关系数的平方，\\(z_t = \\sum_{j=1}^{T-1} b_j\
  \ z_{t-j} + a_t$。通过递归使用此表达式，我们有\n\n\\(|\\boldsymbol{R}_T| = \\left[ \\prod_{i=1}^{T-1}\
  \ (1 - R^2_i) \\right] . \\quad (5.9)\\)\n\n假设所有时间序列都可以由一个 AR(h) 模型很好地近似，其中 h 远小于\
  \ T。那么，\\(R^2_{T-1} = R^2_{T-2} = \\cdots = R^2_h$ 且\n\n\\(\\| \\boldsymbol{R}_T\
  \ \\| = (1 - R^2_h)^{T-h+1} \\left[ \\prod_{i=1}^{h-1} (1 - R^2_i) \\right] .\\\
  )\n\n例如，假设 \\(h = 1$。那么 \\(\\rho(j) = \\rho_1^j$ 可以通过归纳法很容易地看出 \\(|\\boldsymbol{R}_T|\
  \ = (1 - \\rho_1^2)^{T-1}$。因此，如果我们知道向量 \\(\\boldsymbol{Z}_{t,h} = (z_t, z_{t-1},\
  \ \\dots, z_{t-h})'$ 的较小 \\((h + 1) \\times (h + 1)$ 相关矩阵的行列式，就可以计算所有观测值的大型 \\(T\
  \ \\times T$ 矩阵 \\(\\boldsymbol{R}_T$ 的行列式。这个矩阵 \\(\\boldsymbol{R}_h$ 在等式 (5.7)\
  \ 中给出，只需用 h 代替 T。这个较小矩阵的行列式具有所有自相关的全局度量的有趣解释，如同等式 (5.8)，我们有\n\n\\(|\\boldsymbol{R}_h|\
  \ = |\\boldsymbol{R}_{h-1}|(1 - R^2_h),\\)\n\n其中 \\(R^2_h$ 是 \\(z_t$ 的 AR(h) 拟合的多元相关系数的平方，并且\n\
  \n\\(|\\boldsymbol{R}_h|^{1/h} = \\left[ \\prod_{i=1}^h (1 - R^2_i) \\right]^{1/h}\
  \ . \\quad (5.10)\\)\n\n请注意，$1 - R^2_i$ 是序列从其过去（从 \\(z_{t-1}$ 到 \\(z_{t-i}$）的线性依赖性的度量，而\
  \ \\(|\\boldsymbol{R}_h|^{1/h}$ 是这些依赖度量的几何平均值。因此，$1 - |\\boldsymbol{R}_h|^{1/h}$\
  \ 可以解释为平均平方相关系数，当对序列拟合阶数递增的 AR 模型时得到。我们有 $0 \\le |\\boldsymbol{R}_h| \\le 1$，当且仅当\
  \ \\(\\boldsymbol{R}_h$ 为对角矩阵且所有滞后 ACF 都为零时等于一，并且当且仅当存在一个线性组合 \\(\\boldsymbol{a}'\\\
  boldsymbol{Z}_{t,h} = c$（一个常数）时等于零，这使得序列是确定性的且所有未来值都由过去值确定。\n\n基于这些性质，Peña 和 Rodriguez\
  \ (2002) 定义了平稳时间序列 \\(x_t\\) 的 *总相关性* 为\n\n\\(TC_{x,h} = 1 - |\\boldsymbol{R}_h|^{1/(h+1)},\\\
  ) \\quad \\((5.11)\\)\n\n它是序列与单变量白噪声过程之间距离的度量，后者具有 TC = 0。我们可以通过两个序列总相关性之差的绝对值来构建两个序列之间的不相似度度量，即，\n\
  \n\\(D_U(x_t, y_t, h) = |TC_{x,h} - TC_{y,h}| = \\left| |\\boldsymbol{R}_{x,h}|^{1/(h+1)}\
  \ - |\\boldsymbol{R}_{y,h}|^{1/(h+1)} \\right|,\\) \\quad \\((5.12)\\)\n\n并使用这些不相似度的近接矩阵进行聚类。\n\
  \n近接矩阵构建如下。设 \\(d(i, j)$ 为定义序列 \\(i$ 和序列 \\(j$ 之间近性所选用的度量。然后构建一个平方对称矩阵，对角线元素为零，第\
  \ \\(i$ 行和第 \\(j$ 列的非对角线元素等于 \\(d(i, j)$。\n\n### 示例 5.1\n\n为了说明距离和不相似度的计算，我们使用文件\
  \ `TaiwanAirBox032017.csv` 中的台湾 AirBox 数据，该文件包含 2017 年 3 月 Air-Box 设备的每小时 PM\\(_{2.5}$\
  \ 测量值。共有 744 个观测值和不同位置的 516 个序列。数据被加载到一个不包含第一列的矩阵中。序列的时间图如图 5.1 所示，包含三个经验动态分位数（EDQs）。图的详细信息见第\
  \ 2 章。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_238_0.png)\n\n**图 5.1** 台湾 AirBox\
  \ 数据及概率为 0.05、0.5 和 0.95 的经验动态分位数。\n\n由于大多数序列是非平稳的，应用了一阶差分，并使用序列 $z_t = \\nabla\
  \ x_t$ 来计算距离。计算了四个距离。h = 5 的 ACF 和偏自相关系数（PACF）距离、默认阶数的 Piccolo 距离（PIC）以及周期图距离（PER）。这是使用\

  \ |\n| 14 | 14 | 192 | 0.1428571429 |\n\n## 5.3 按变量聚类\n\n与使用距离矩阵 **_D_** 对时间序列进行聚类不同，我们可以用选定的特征或特征向量来表示每个时间序列，并将这些特征作为分类变量。例如，我们可以通过其\
  \ AR 系数向量来表示时间序列。此外，当序列数量较大时，距离矩阵 **_D_** 是一个大型方阵，我们可以应用多维缩放技术（例如，Seber, 1984）来得到一个新的\
  \ \\(k \\times p\\) 矩阵，其中 \\(p \\ll k\\) 是\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_265_0.png)\n\
  \n图 5.19 差分电价数据基于公式 (5.18) 的 GCC 不相似性的树状图。\n\n作为变量选择的主坐标，并使用这些新变量进行聚类分析。在本节中，我们介绍了四种基于变量的聚类分析方法。这些方法包括\
  \ k-means（也可与不相似性一起使用）、k-medoids、投影方法和混合分布模型。\n\n### 5.3.1 k-means 算法\n\n给定一组由 $k$\
  \ 个变量表征的对象（在本例中为 $k$ 个时间序列），观测值为 $(x_1, \\dots, x_k)$，我们希望将这些对象划分为给定数量的组（例如 $G$），使每个组尽可能同质。向量\
  \ $x_i$（其中 $i = 1, \\dots, k$）具有分量 $x_{ij}$，表示第 $i$ 个对象的第 $j$ 个变量（$j = 1, \\dots,\
  \ p$）的值。各组必须互斥，且每个对象仅属于一个组。k-means 的基本思想是进行分组，使最终各组尽可能同质。这是通过所有变量的组内变异或组内平方和（SSW）来衡量的，即需要最小化的量度：\n\
  \n\\(\\text{SSW} = \\sum_{g=1}^G \\sum_{j=1}^p \\sum_{i=1}^{n_g} (x_{ijg} - \\bar{x}_{jg})^2,\\\
  ) (5.24)\n\n其中 $x_{ijg}$ 是组 $g$ 中对象 $i$ 的第 $j$ 个变量的值，$\\bar{x}_{jg}$ 是包含 $n_g$ 个对象（或时间序列）的第\
  \ $g$ 组中第 $j$ 个变量的均值。该准则也可写成：\n\n\\( min SSW = min \\sum_{g=1}^G \\sum_{j=1}^p n_g\
  \ s_{jg}^2. \\) (5.25)\n\n其中 \\( s_{jg}^2 \\) 是第 \\( g \\) 组中第 \\( j \\) 个变量的方差。各组中变量的方差明显是分类中异质性的度量，通过最小化它们，我们可以得到同质组。另一种准则是最小化对象与其组中心之间的平方距离。如果使用欧氏距离来度量距离，则该准则写作：\n\
  \n\\( min \\sum_{g=1}^G \\sum_{i=1}^{n_g} (x_{ig} - \\bar{x}'_g)'(x_{ig} - \\bar{x}_g)\
  \ = min \\sum_{g=1}^G \\sum_{i=1}^{n_g} d^2(i, g), \\)\n\n其中 \\( d^2(i, g) \\) 是第\
  \ \\( g \\) 组中对象 \\( i \\) 与该组均值之间的平方欧氏距离。很容易证明两个准则是等价的。由于标量等于其迹，我们可以将最新的准则写作：\n\
  \n\\( min \\sum_{g=1}^G \\sum_{i=1}^{n_g} tr[d^2(i, g)] = min tr \\left[ \\sum_{g=1}^G\
  \ \\sum_{i=1}^{n_g} (x_{ig} - \\bar{x}_g)(x_{ig} - \\bar{x}_g)' \\right]. \\)\n\n\
  令 \\( W \\) 为组间平方和矩阵，\n\n\\( W = \\sum_{g=1}^G \\sum_{i=1}^{n_g} (x_{ig} - \\bar{x}_g)(x_{ig}\
  \ - \\bar{x}_g)', \\) (5.26)\n\n可得\n\n\\( min tr(W) = min SSW \\)\n\n两个准则一致。该准则也称为迹准则，由\
  \ Ward 于 1963 年提出。\n\n最小化该准则需要对 \\( G \\) 组的所有可能划分进行计算，除非对象数量非常小，否则这显然是不可能完成的任务。k-means\
  \ 算法寻找最优划分，约束是每次迭代只能将一个对象从一个组移到另一个组。还应注意，当 \\( G \\) 固定时，该准则才有意义，因为我们可以通过增加组数始终降低\
  \ SSW。事实上，通过让每个对象单独成组，我们始终可以使 SSW = 0。\n\nk-means 算法如下：\n\n- 1. 选择 \\( G \\) 个点作为初始组的中心。这可以通过以下方式完成：\n\
  \  - (a) 将对象随机分配到 \\( G \\) 个组，并取各组的中心；\n  - (b) 将相互间距最远的 \\( G \\) 个点作为中心；\n  -\
  \ (c) 使用一些先验信息构建初始组并计算其中心，或预先选择其中心。\n- 2. 计算每个对象到 \\( G \\) 个中心的欧氏距离，并将对象分配给距离最近的组。一旦对象被重新分配，受影响的组的中心将被重新计算。\n\
  - 3. 检查重新分配某些对象是否能改进准则 SSW。如果某组中的对象比所在组中心更接近另一组的中心，就会发生这种情况。在此情况下，该对象被移至新组，并重新计算受变更影响的两个组的中心。\n\
  - 4. 当无法再改进准则时，停止算法。\n\n因此，算法结果可能取决于初始分配和对象的顺序。算法应始终从不同的初始值开始重复运行，并对样本中的对象进行置换。顺序的影响通常较小，但建议确保其在每种情况下都没有影响。\n\
  \nk-means 使用的 SSW 和迹准则都具有两个重要特性。首先，它们对缩放变化不具有不变性。其次，最小化欧氏距离会产生近似球形的组。关于尺度，如果变量使用不同的单位，则最好对其进行标准化，使\
  \ k-means 的结果不依赖于测量尺度中的无关变化。当它们使用相同的单位时，通常最好不进行标准化，因为一个变量的较大方差可能恰恰是由于存在多个具有该变量不同值的对象群体所致，而如果数据被标准化，这些信息可能会被隐藏。\n\
  \nk-means 产生的预期球形组在各组预期具有非常不同形状时可能会带来问题。在这种情况下，我们可以应用变量变换，使其在组内的联合分布预期为近似正态且协方差矩阵为对角矩阵。\n\
  \n#### 5.3.1.1 组数\n\n第 5.2 节的 Silhouette 和 Gap 统计量可用于确定 k-means 中的组数。在这种情况下，距离是表示系列的特征坐标之间的欧氏距离。还有一些特定于变量的附加准则。Hartigan\
  \ (1975) 提出进行近似 F 检验以评估变异性降低，比较 $SSW_g$ 与 $SSW_{g+1}$，并计算增加一个组时变异性的相对降低。检验为：\n\n\
  \\( F = \\frac{SSW_g - SSW_{g+1}}{SSW_{g+1}/(n - g - 1)}, \\) (5.27)\n\n该检验衡量通过增加一个组而降低的变异性与聚类中平均变异性的关系。F\
  \ 值与具有 p 和 p(n - g - 1) 自由度的 F 分布进行比较。然而，在实际应用中，这种比较可能并不合理。一般而言，Hartigan (1975)\
  \ 建议，如果该商大于 10，则引入一个额外组。\n\nCalinski 和 Harabasz (1974) 提出最大化组间平方和与组内平方和之比。请注意，数据的协方差矩阵\
  \ V 可表示为：\n\n\\(\\mathbf{V} = \\sum_{i=1}^k (\\mathbf{x}_i - \\bar{\\mathbf{x}})(\\\
  mathbf{x}_i - \\bar{\\mathbf{x}})' = \\sum_{g=1}^G \\sum_{i=1}^{n_g} (\\mathbf{x}_{ig}\
  \ - \\bar{\\mathbf{x}}_g)(\\mathbf{x}_{ig} - \\bar{\\mathbf{x}}_g)' + \\sum_{g=1}^G\
  \ n_g (\\bar{\\mathbf{x}}_g - \\bar{\\mathbf{x}})(\\bar{\\mathbf{x}}_g - \\bar{\\\
  mathbf{x}})’,\\)\n\n应用迹算子可得：\n\n\\(\\text{tr}(\\mathbf{V}) = \\text{SSW} + \\text{SSB}.\\\
  )\n\n\n\n\n\nCH准则通过最大化下式来选择组数：\n\nCH(g) = \\frac{SSB_g / (g - 1)}{SSW_g / (n - g)}.\n\
  \n一个有用的图形显示是将此比率作为组数的函数进行绘制。\n\n### 示例 5.4\n\n我们将k-means应用于TaiwanAirBox数据。在剔除八个时间序列后，我们使用508个时间序列的集合，其中六个与偏远位置相关，另外两个只有少数非零数据点。参见示例5.3。使用的R命令是kmeans，位于stats包中。使用了三种维度不同的变量。第一种类型由每个序列的ACF前5个滞后组成，因此p\
  \ = 5；第二种类型是样本中31天每一天序列的平均值，因此p = 31；第三种类型将时间序列的每个观测值作为一个变量，因此p = T = 743。使用Calinski和Harabasz准则（CHC）来选择聚类数，如下计算。最多允许20个聚类，对于每个组数，k-means使用10个随机起始值运行，准则值保存在向量CHC中。\n\
  \n#### k-means的R命令：\n\n```\n##- means with the first five autocorrelation coefficients.\n\
  #### The outlier-cleaned series of Example 5.3 is used.\n> x=as.matrix(TaiwanAirBox032017)[,-1]\n\
  > lo=as.matrix(locations032017)[, -1]\n> remv = c(1,29,35,46,70,118,155,157) # outlying\
  \ locations\n> x = x[,-remv]\n> lo = lo[-remv,]\n> z=diff(x)\n##the acf of the stationary\
  \ series z are computed\n> h=6\n> aa=acf(z,lag.max=h,plot=FALSE)\n> H=c(2:6)\n>\
  \ nl=length(H)\n> k = dim(z)[2]\n##a matrix with columns the acf of each series\
  \ is formed\n> ACM=matrix(0,nl,k)\n> for (i in 1:k) {\n> ACM[,i] = aa$acf[H,i,i]\
  \ }\n##the k-means is applied\n> Kmax=20\n> bbb=rep(0,Kmax)\n> Wk=as.vector(bbb)\n\
  > Bk=Wk\n> HC=Bk[-1]\n> CHC=HC\n> n=dim(ACM)[2]\n> for (i in 1:Kmax) {\n+ center=i\n\
  + AA=kmeans(t(ACM),centers=i,nstart=10)\n+ Wk[i]=AA$tot.withinss\n+ Bk[i]=AA$betweenss\n\
  > for (j in 1:(Kmax-1)) {\n> HC[j] = (Wk[j] - Wk[j+1]) / (Wk[j+1] / (n-j))\n> CHC[j]\
  \ = (Bk[j] / (j)) / (Wk[j] / (n-j+1)) }\n> par(mfrow=c(1,1))\n> plot(CHC)\n####\
  \ Three groups are identified\n> AA=kmeans(t(ACM),centers=3,nstart=10)\n> AA\nk-means\
  \ clustering with 3 clusters of sizes 148, 191, 169\nCluster means:\n[,1] [,2] [,3]\
  \ [,4] [,5]\n1 0.13979848 -0.02746675 -0.04727573 -0.06181010 -0.061825575\n2 0.08036432\
  \ -0.12370731 -0.09944578 -0.03522905 -0.004116231\n3 -0.03754526 -0.05904016 -0.03590138\
  \ -0.02665427 -0.024233302\n(output truncated)\n```\n\n图5.20显示了CHC准则的图，从中我们可以看出三个聚类似乎是合理的。聚类的大小分别为148、191和169。这些组根据前五个ACF的强度来划分序列。基于每个组的中心（即平均ACF），我们发现第3组似乎包含白噪声序列，即观测序列的ARIMA(0,1,0)模型。然而，这些组与Air\
  \ Boxes的位置无关，如图5.21所示。\n\n接下来，我们通过取PM₂.₅测量值的日均值来构建每个序列的变量。因此，每个序列有31个变量，每个变量是24小时PM₂.₅测量值的平均值。这些变量在显示Air\
  \ Boxes位置方面比ACF表现更好。组的大小分别为196、171和141。图5.22显示了三个组的位置。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_269_0.png)\n\
  \n**图5.20** 台湾AirBox数据的CHC准则。该序列已进行差分。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_270_0.png)\n\
  \n图5.21 使用k-means和ACF前5个滞后得到的三组Air-Boxes的位置（经度和纬度）。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_270_1.png)\n\
  \n图5.22 使用PM2.5测量值的日均值得到的三组Air Boxes的位置（经度和纬度）。\n\n#### 聚类的R命令：\n\n```\n##A set\
  \ of variables is built as the average value of series each day\n> ke=dim(x)[2]\n\
  > Md=matrix(0,31,ke)\n> for (i in 1:31){\n+ for (j in 1:ke) {\n+ sl=1+12*(i-1)\n\
  + s2=sl+11\n+ Md[i,j]=sum(x[sl:s2,j])/12\n+ }\n+ }\n##For comparison purpose, we\
  \ also use 3 groups.\n> Data=t(Md)\n> AD=kmeans(Data,centers=3,nstart=10)\n> AD$size\n\
  [1] 196 171 141\n> lc1 <- which(AD$cluster==1)\n> lc2 <- which(AD$cluster==2)\n\
  > lc3 <- which(AD$cluster==3)\n> par(mfcol=c(1,3))\n> plot(lo[lc1,1],lo[lc1,1],xlab=\"\
  longitude\",ylab=\"latitude\",\nmain=\"Group-1\")\n#### Similar commands apply to\
  \ Groups 2 and 3.\n```\n\n最后，我们将每个观测值作为一个变量，并直接对观测时间序列应用k-means。在这种情况下，变量数多于观测数，p\
  \ = T = 743 > k = 508。同样，CHC准则选择三组，大小分别为152、103和253。图5.23显示了三组Air Boxes的位置。有趣的是，如预期，第1组和第2组中Air\
  \ Boxes的位置更加集中。此结果与示例5.3一致，在示例5.3中，我们表明考虑序列之间的互相关关系能够根据Air Boxes的位置得到更有意义的分类。根据公式(5.1)，如果两个序列具有强正互相关，则它们之间的欧氏距离较小；如果互相关较弱或为负，则距离会增加。因此，SSW准则将具有强正互相关的序列归为同一组。图5.24显示了这一点，它展示了每组内时间序列之间相关性的直方图：两组由强相关序列组成，第三组包含低相关或负相关的序列。正如我们之前发现的，地理上的邻居预期具有较高的互相关性。\n\
  \n### 5.3.2 k-Medoids\n\nk-means算法可能受异常值影响，因此提出了多种替代方法来解决这个问题。Kaufman和Rousseeuw（1987）提出了一种与k-means相关但存在几个差异的分区算法。首先，组的中心是其medoid，而不是样本均值。组的medoid是使其与组内所有成员的平均离差（或平均距离）最小化的成员。对于标量变量，组的medoid是L1距离的中位数。然而，对于多元变量，组的中位数可以有多种定义，且medoid不唯一。其次，组间对象交换的方式与k-means不同。第三，它可以应用于任意点间的离差或距离度量D(i,\
  \ j)，而k-means是基于欧氏距离构建的。一旦选择了度量D(i, j)，准则就是最小化\n\nSM = \\sum_{j=1}^G \\sum_{i \\\
  in G_j} D(i, M(j)), \\quad (5.28)\n\n其中M(j)是第i个对象所属的第j组的medoid，G是组的数量，G_j表示第j组。k-medoids算法，或称为围绕medoid分区（PAM）算法，工作方式如下（更多细节请参见Kaufman和Rousseeuw，2009）：\n\
  \n- 1. Build：从k个对象（在我们的情况中为时间序列）中选择G个作为初始组的领导者（medoids），并将每个对象与其最近的medoid关联。选择方法如下：首先选择使目标函数（5.28）下降最大的对象作为第一个领导者。对于每个非领导者对象，计算其导致的目标函数下降量，并选择（5.28）值最小的对象作为新的领导者。继续同样的方式，直到找到G个领导者。\n\
  \n- 2. Swap：检查将领导者与其组内某个成员交换是否会减小（5.28）。对所有对象和组进行此检查。\n\n- 3. 如果通过交换两个对象可以减小Eq.\
  \ (5.28)中的目标函数SM，则执行交换。当无法再减小目标函数时，停止过程。\n\n对于大量对象，该算法较慢，因此开发了一些近似算法，例如R中的Clustering\
  \ Large Applications（CLARA）等。**CLARA**在多个子样本上应用PAM并给出最佳结果，而其他算法则通过抽样仅探索对象与领导者之间可能交换的一个子集。\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_272_0.png)\n\n图5.23 直接使用每小时PM2.5测量值得到的三组Air\
  \ Boxes的位置（经度和纬度）。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_272_1.png)\n\n图5.24\
  \ 按序列间欧氏距离聚类的Air Boxes，各组内序列之间互相关的直方图。\n\n### 5.3.3 基于变量的模型聚类\n\n对于基于模型的方法，我们假设k个时间序列由G个不同的模型生成，目标是将序列分类为这G个组，使得每个组的所有成员都遵循同一模型。通常，模型由一个p参数向量表征。它可以是模型的AR表示系数，也可以是通常假设服从多元正态分布的一般特征向量。将序列划分为组的自然方法是假设参数向量θ_i由G个多元正态分布的混合生成。然后，目标是共同估计混合中各分布的参数以及每个序列属于混合中且仅属于一个分量的后验概率。这种方法称为基于模型的聚类，由Banfield和Raftery（1993）等人提出。这些作者还基于多元数据的正态分布混合开发了算法MCLUST。\n\
  \n\n\n\n\n对于时间序列分析，该方法已由 Xiong 和 Yeung (2004) 研究用于 ARMA 混合模型，并由 Frühwirth-Schnatter\
  \ 和 Kaufmann (2008) 从贝叶斯角度进行研究。这些程序首先对系列划分到各组进行初始估计。接着，计算混合模型的参数，并利用这些参数重新将系列分配到各组，重复这两个步骤直至收敛。估计是逐组进行的，最佳解由\
  \ BIC 准则或后验概率选定。\n\n#### 5.3.3.1 AR 混合模型的最大似然（ML）估计\n\n假设每个系列由一个高斯 AR(p) 模型生成，其中\
  \ \\(p < k\\)，属于 \\(G\\) 个组之一，各组具有不同的 AR 参数和残差方差。各系列相互独立，每个系列 \\(\\boldsymbol{z}_i\
  \ = (z_{i1}, \\dots, z_{iT})'\\)，\\(i=1, \\dots, k\\)，可被视为由一组分布混合生成：\n\n\\(f(\\\
  boldsymbol{z}_i) = \\sum_{g=1}^G \\pi_g f_g(\\boldsymbol{z}_i | \\boldsymbol{\\\
  phi}_g, \\sigma_g^2),\\) (5.29)\n\n其中 \\(\\pi_g\\) 是第 \\(g\\) 组的未知概率，\\(\\boldsymbol{\\\
  phi}_g = (\\phi_{1g}, \\dots, \\phi_{pg})'\\) 是 AR 参数向量，\\(\\sigma_g^2\\) 是组 \\\
  (g\\) 中噪声的方差，\\(f_g\\) 是由高斯 AR(p) 生成的单变量观测的联合密度，见第 2.8.3 节。记 \\(\\boldsymbol{\\\
  omega}_g = (\\boldsymbol{\\phi}'_g, \\sigma_g^2)\\)，以及 \\(\\boldsymbol{\\beta} =\
  \ (\\pi_1, \\dots, \\pi_G, \\boldsymbol{\\phi}'_1, \\dots, \\boldsymbol{\\phi}'_G,\
  \ \\sigma_1^2, \\dots, \\sigma_G^2)'\\) 为公式 (5.29) 中混合模型的全部参数向量，则对于 \\(\\tilde{\\\
  boldsymbol{z}}_i = (z_{i,p+1}, \\dots, z_{i,T})'\\)，\\(i=1, \\dots, k\\)，其联合条件对数似然为\n\
  \n\\(L_C(\\boldsymbol{\\beta}) = \\sum_{i=1}^k \\log \\left( \\sum_{g=1}^G \\pi_g\
  \ f_g(\\tilde{\\boldsymbol{z}}_i | \\boldsymbol{\\psi}_g) \\right),\\) (5.30)\n\n\
  其中 \\(f_g(\\tilde{\\boldsymbol{z}}_i | \\boldsymbol{\\psi}_g)\\) 是给定前 \\(p\\) 个观测值后\
  \ \\(\\tilde{\\boldsymbol{z}}_i\\) 的联合密度函数。该函数具有许多极大值，与每个密度由一个观测值精确确定的解相关联。为避免这些奇异性，我们假设每组至少有\
  \ \\(p+1\\) 个观测值，并尝试找到该函数的一个局部极大值。该似然函数的另一个问题是正态分布未被识别，因为顺序 \\(1, \\dots, G\\) 是任意的。为解决此问题，我们可以假设分布\
  \ \\(1, \\dots, G\\) 对应于 \\(\\pi_1 \\ge \\pi_2 \\ge \\dots \\ge \\pi_G\\)。\n\n为最大化公式\
  \ (5.30) 中关于概率 \\(\\pi_g\\) 的函数，引入拉格朗日乘数并施加限制 \\(\\sum_{g=1}^G \\pi_g = 1\\)，待最大化的函数为\n\
  \n\\(L_C(\\boldsymbol{\\beta}) = \\sum_{i=1}^k \\log \\sum_{g=1}^G \\pi_g f_g(\\\
  tilde{\\boldsymbol{z}}_i | \\boldsymbol{\\psi}_g) - \\lambda \\left( \\sum_{g=1}^G\
  \ \\pi_g - 1 \\right).\\) (5.31)\n\n对函数关于组概率 \\(\\pi_g\\) 求导：\n\n\\(\\frac{\\partial\
  \ L_C(\\boldsymbol{\\beta})}{\\partial \\pi_g} = \\sum_{i=1}^k \\frac{f_g(\\tilde{\\\
  boldsymbol{z}}_i | \\boldsymbol{\\psi}_g)}{\\sum_{g=1}^G \\pi_g f_g(\\tilde{\\boldsymbol{z}}_i\
  \ | \\boldsymbol{\\psi}_g)} - \\lambda = 0\\)\n\n两边乘以 \\(\\pi_g\\)（假设 \\(\\pi_g\
  \ \\neq 0\\)，否则模型 g 冗余），我们写出\n\n$$\\lambda \\widehat{\\pi}_g = \\sum_{i=1}^k \\\
  widehat{\\pi}_{ig}.$$\n\n其中 \\(\\widehat{\\pi}_{ig}\\) 是给定数据 \\(\\vec{\\mathbf{z}}_i\\\
  ) 时，系列 \\(i\\) 由第 \\(g\\) 个分布生成的后验概率。这些概率由贝叶斯定理计算\n\n$$\\widehat{\\pi}_{ig} = \\\
  frac{\\pi_g f_g(\\vec{\\mathbf{z}}_i | \\boldsymbol{\\psi}_g)}{\\sum_{g=1}^G \\\
  pi_g f_g(\\vec{\\mathbf{z}}_i | \\boldsymbol{\\psi}_g)},$$\n\n且 \\(\\sum_{g=1}^G\
  \ \\widehat{\\pi}_{ig} = 1\\)。为确定 \\(\\lambda\\) 的值，将 (5.32) 对所有组求和，得到 \\(\\lambda\
  \ = k\\)，将此值代入 (5.32)，先验组概率估计为\n\n$$\\widehat{\\pi}_g = \\frac{1}{k} \\sum_{i=1}^k\
  \ \\widehat{\\pi}_{ig}.$$\n\n为估计 AR 参数，我们对公式 (5.31) 关于它们求导，可写为\n\n$$\\frac{\\partial\
  \ L_C(\\boldsymbol{\\beta})}{\\partial \\boldsymbol{\\phi}_g} = \\sum_{i=1}^k \\\
  frac{\\pi_g f_g(\\vec{\\mathbf{z}}_i | \\boldsymbol{\\psi}_g)}{\\sum_{g=1}^G \\\
  pi_g f_g(\\vec{\\mathbf{z}}_i | \\boldsymbol{\\psi}_g)} \\frac{\\partial \\log f_g(\\\
  vec{\\mathbf{z}}_i | \\boldsymbol{\\psi}_g)}{\\partial \\boldsymbol{\\phi}_g} =\
  \ 0.$$\n\n利用公式 (5.33) 和第 2.8.1 节的结果，我们有\n\n$$\\frac{\\partial L_C(\\boldsymbol{\\\
  beta})}{\\partial \\boldsymbol{\\phi}_g} = 0 = \\sum_{i=1}^k \\widehat{\\pi}_{ig}\
  \ (\\widetilde{\\mathbf{Z}}'_i \\vec{\\mathbf{z}}_i - \\widetilde{\\mathbf{Z}}'_i\
  \ \\widetilde{\\mathbf{Z}}_i \\boldsymbol{\\phi}_g),$$\n\n其中 \\(\\widetilde{\\mathbf{Z}}_i\\\
  ) 是滞后值的 \\((T-p) \\times p\\) 矩阵。因此，\n\n$$\\widehat{\\boldsymbol{\\phi}}_g = \\\
  left( \\sum_{i=1}^k \\widehat{\\pi}_{ig} \\widetilde{\\mathbf{Z}}'_i \\widetilde{\\\
  mathbf{Z}}_i \\right)^{-1} \\left( \\sum_{i=1}^k \\widehat{\\pi}_{ig} \\widetilde{\\\
  mathbf{Z}}'_i \\vec{\\mathbf{z}}_i \\right),$$\n\n这正是使用所有系列估计参数的标准方程，但每个系列都按该系列属于各组的估计后验概率加权。创新方差可得到类似方程。然而，为计算\
  \ \\(\\widehat{\\boldsymbol{\\phi}}_g\\)，我们需要 \\(\\widehat{\\pi}_{ig}\\)，它们由 (5.33)\
  \ 计算并依赖模型参数。直觉上，我们可以在这两个步骤之间迭代，这就是期望-最大化（EM）算法提供的解。\n\n#### 5.3.3.2 EM 算法\n\nEM\
  \ 算法是一种强大的迭代方法，用于求缺失值和缺失变量（隐变量）的 ML 估计。它由 Dempster 等人 (1977) 提出。如在我们的情况中，存在缺失变量时，算法在期望（E）步和极大化（M）步之间迭代：E\
  \ 步利用参数的当前估计求关于缺失变量的对数似然期望；M 步给定缺失变量的值，对参数极大化对数似然。\n\n为应用 EM 算法，我们通过引入一组未观测或缺失的向量变量\
  \ ($s_1, \\dots, s_k$) 来转换问题，其中 $s_i$ 是一个 $G$ 维多项分布变量向量，仅有一个分量等于 1，对应于 \\(\\tilde{z}_i\\\
  ) 所属的组，其余均为 0。例如，如果 \\(\\tilde{z}_i\\) 来自第一个模型，则 \\(s_{i1} = 1\\) 且 \\(s_{i2} =\
  \ \\cdots = s_{iG} = 0\\)。此时 \\(\\sum_{g=1}^G s_{ig} = 1\\) 且 \\(\\sum_{i=1}^k \\\
  sum_{g=1}^G s_{ig} = k\\)。有了这些新变量，\\(\\tilde{z}_i\\) 给定 \\(s_i\\) 下的密度函数可写为\n\n\
  $$f(\\tilde{z}_i|s_i) = \\prod_{g=1}^G f_g(\\tilde{z}_i|\\psi_g)^{s_{ig}}. \\quad\
  \ (5.36)$$\n\n同理，缺失变量 \\(s_i\\) 的概率函数为\n\n$$p(s_i) = \\prod_{g=1}^G \\pi_g^{s_{ig}}.\
  \ \\quad (5.37)$$\n\n另一方面，观测变量 \\(\\tilde{z}_i\\) 和缺失变量 \\(s_i\\) 的联合密度函数为\n\n$$f(\\\
  tilde{z}_i, s_i) = f(\\tilde{z}_i|s_i)p(s_i),$$\n\n根据公式 (5.36) 和 (5.37)，可写为\n\n\
  $$f(\\tilde{z}_i, s_i) = \\prod_{g=1}^G (\\pi_g f_g(\\tilde{z}_i|\\psi_g))^{s_{ig}},$$\n\
  \n联合对数似然函数为\n\n$$L(\\beta) = \\sum_{i=1}^k \\log f(\\tilde{z}_i, s_i) = \\sum_{i=1}^k\
  \ \\sum_{g=1}^G s_{ig} \\log \\pi_g + \\sum_{i=1}^k \\sum_{g=1}^G s_{ig} \\log f_g(\\\
  tilde{z}_i|\\psi_g). \\quad (5.38)$$\n\nEM 算法从参数向量的初始估计 \\(\\hat{\\beta}^{(0)}\\\
  ) 开始，通常通过层次聚类或 \\(k\\)-means 计算得到。在 E 步中，我们给定初始参数和观测数据，计算完全似然 (5.38) 中缺失值的条件期望。由于似然关于\
  \ \\(s_{ig}\\) 是线性的，这等价于用缺失变量的期望替代缺失变量。缺失变量 \\(s_{ig}\\) 为取值 0 或 1 的二项分布变量，且\n\n\
  $$E(s_{ig}|\\hat{\\beta}^{(0)}, Z) = p(s_{ig} = 1|\\hat{\\beta}^{(0)}, Z) = \\hat{\\\
  pi}_{ig}^{(0)}$$\n\n其中 \\(\\hat{\\pi}_{ig}^{(0)}\\) 是在已观测 \\(z_i\\) 且模型参数由 \\(\\\
  hat{\\beta}^{(0)}\\) 给定时，观测值 \\(z_i\\) 来自模型 \\(g\\) 的概率。这些概率为\n\n\n\n可由(5.33)计算得出的后验概率，以\\\
  (\\widehat{\\boldsymbol{\\beta}}^{(0)}\\)作为参数值。通过用期望替换缺失变量，我们得到\n\n\\(L_C^*(\\boldsymbol{\\\
  beta}) = \\sum_{i=1}^k \\sum_{g=1}^G \\widehat{\\pi}_{ig}^{(0)} \\log \\pi_g + \\\
  sum_{i=1}^k \\sum_{g=1}^G \\pi_{ig}^{(0)} \\log f_g(\\mathbf{z}_i | \\boldsymbol{\\\
  psi}_g)\\)\n\n在M步中，对该函数求极大值并获得参数\\(\\boldsymbol{\\beta}\\)。我们发现参数\\(\\pi_g\\)仅出现在第一项中，正态分布的参数仅出现在第二项中，因此可以独立求解。从\\\
  (\\pi_g\\)开始，这些参数需满足其和为一，并由(5.34)计算得出。随后，利用值\\(\\widehat{\\pi}_{ig}^{(0)}\\)计算AR参数和残差方差的新估计量。这样便得到新的参数向量\\\
  (\\widehat{\\boldsymbol{\\beta}}^{(1)}\\)，算法迭代直至收敛。\n\n#### 5.3.3.3 多元正态混合分布的估计\n\
  \n若使用特征向量\\(\\mathbf{x}_i\\)来总结每个时间序列，EM算法同样适用。假设该向量服从多元正态混合分布，均值向量为\\(\\boldsymbol{\\\
  mu}_g\\)，协方差矩阵为\\(\\mathbf{V}_g\\)，概率为\\(\\pi_g\\)，其中\\(g=1, \\dots, G\\)，并将\\(\\\
  boldsymbol{\\psi} = (\\boldsymbol{\\pi}, \\boldsymbol{\\mu}_1, \\dots, \\boldsymbol{\\\
  mu}_G, \\mathbf{V}_1, \\dots, \\mathbf{V}_G)\\)称为参数向量，估计算法如下：\n\n- 1. 从初始值\\(\\\
  widehat{\\boldsymbol{\\psi}}^{(0)}\\)开始。令\\(s=1\\)，并按以下公式计算\\(\\widehat{\\pi}_{ig}^{(s)}\\\
  )：\n\n\\(\\pi_{ig}^{(s)} = \\frac{\\pi_g^{(s-1)} f_g^N(\\mathbf{x}_i | \\widehat{\\\
  boldsymbol{\\mu}}_g^{(s-1)}, \\widehat{\\mathbf{V}}_g^{(s-1)})}{\\sum_{g=1}^G \\\
  pi_g^{(s-1)} f_g^N(\\mathbf{x}_i | \\widehat{\\boldsymbol{\\mu}}_g^{(s-1)}, \\widehat{\\\
  mathbf{V}}_g^{(s-1)})}\\)\n\n和\n\n\\(\\widehat{\\pi}_g^{(s)} = \\frac{1}{k} \\sum_{i=1}^k\
  \ \\pi_{ig}^{(s)}\\)\n\n- 2. 使用以下公式估计多元正态分布的参数：\n\n\\(\\widehat{\\boldsymbol{\\\
  mu}}_g^{(s)} = \\sum_{i=1}^k \\frac{\\pi_{ig}^{(s)}}{\\sum_{i=1}^k \\pi_{ig}^{(s)}}\
  \ \\mathbf{x}_i\\)\n\n\\(\\widehat{\\mathbf{V}}_g = \\sum_{i=1}^k \\frac{\\pi_{ig}^{(s)}}{\\\
  sum_{i=1}^k \\pi_{ig}^{(s)}} (\\mathbf{x}_i - \\widehat{\\boldsymbol{\\mu}}_g)(\\\
  mathbf{x}_i - \\widehat{\\boldsymbol{\\mu}}_g)'\\)\n\n- 3. 转至步骤1，令\\(s \\leftarrow\
  \ s + 1$，并迭代上述两步直至收敛。\n\n在群体数量较多时应用前述方法需要进行一些简化，以避免需估计的参数数量增加，并确保协方差矩阵的正定性。程序MCLUST（Fraley\
  \ and Raftery, 1999；Fraley et al., 2012）通过谱分解对协方差矩阵进行参数化，采用EM算法。\n\n\\(\\mathbf{V}_g\
  \ = \\lambda_g \\mathbf{C}_g \\mathbf{A}_g \\mathbf{C}_g'\\)\n\n其中\\(\\boldsymbol{C}_g\\\
  )是包含\\(\\boldsymbol{V}_g\\)特征向量的正交矩阵，\\(\\lambda_g\\boldsymbol{A}_g\\)是其特征值矩阵，标量\\\
  (\\lambda_g\\)为矩阵的最大值。标量\\(\\lambda_g\\)表示椭球的体积，\\(\\boldsymbol{C}_g\\)中矩阵的特征向量表示方向，\\\
  (\\boldsymbol{A}_g\\)中的特征值表示椭球的形状。这样，我们可以让某些群体的方向或其他群体的形状有所不同。该程序（1）为最大群体数选择一个值\\\
  (M$；（2）对\\(G=1, ..., M$及分解（5.43）的不同假设，通过EM算法估计混合模型的参数，并通过层次聚类固定初始条件；（3）使用BIC准则选择最合适的群体数量及协方差矩阵条件。BIC计算中使用的参数数量取决于$G$以及各组模型的参数数量。\n\
  \n#### **5.3.3.4 贝叶斯估计**\n\n基于模型的聚类也可以从贝叶斯观点出发，在估计中使用马尔可夫链蒙特卡罗（MCMC）方法，如Frühwirth-Schnatter\
  \ and Kaufmann (2008)所提。同前文一样，假设我们有$G$个群体，每个群体对其成员系列有一个独特的AR($p$)模型。我们需要估计每个群体的模型参数，其中\\\
  (\\boldsymbol{\\psi}_g = (\\boldsymbol{\\psi}'_g, \\sigma^2_g)$，$g = 1, ..., G$，并将\\\
  (\\boldsymbol{\\psi} = (\\boldsymbol{\\psi}_1, ..., \\boldsymbol{\\psi}_G)$称为混合模型的参数向量。我们还需要分类变量\\\
  (\\boldsymbol{S} = (s_1, ..., s_k)$，这些变量现在被假设为独立变量，各自服从参数为\\(p(s_i = g) = n_g/k\
  \ = \\pi_i$的多项分布，其中\\(n_g$是第$g$组中的系列数量，未知且需估计，并称\\(\\boldsymbol{\\pi} = (\\pi_1,\
  \ ..., \\pi_G)'$。在给定参数和分类变量的情况下，系列\\(z_i$（\\(i = 1, ..., k$）的分布\\(p(z_i|\\boldsymbol{\\\
  psi}_g, \\boldsymbol{S})$被假设为正态分布（这可以推广）。我们为参数向量\\(\\boldsymbol{\\psi}_g$采用共轭先验，为\\\
  (\\boldsymbol{S}$采用狄利克雷先验。现在，参数的自然分解如下：（1）在给定分类变量的情况下，估计每个组的AR参数及残差方差；（2）在给定模型参数的情况下，估计分类变量。然后，MCMC过程（或吉布斯采样器）的应用如下：\n\
  \n- **1.** 初始化：从先验分布中抽取初始估计值，或对\\(k$个时间序列应用具有\\(G$个簇的\\(k$-means方法。在后一种情况下，通过合并各组内的系列来获得AR(\\\
  (p$)模型的初始估计值。\n\n- **2.** 对于迭代\\(m = 1, ..., M$，其中\\(M\\)为预先指定的正整数，（a）使用当前参数值，通过从后验\\\
  (p(s_i| z_i; \\boldsymbol{\\psi}, \\boldsymbol{\\pi})\\)中抽取随机样本来更新分类变量；（b）通过从条件后验分布\\\
  (p(\\boldsymbol{\\psi} | \\boldsymbol{Z}, \\boldsymbol{S})\\)中抽取样本来更新AR系数和残差方差，并从后验\\\
  (p(\\boldsymbol{\\pi} | \\boldsymbol{Z}, \\boldsymbol{S})\\)中更新\\(\\boldsymbol{\\\
  pi}\\)。\n\n- **3.** 抛弃随机抽取的前\\(N$次迭代，利用剩余\\(M - N$次迭代的抽取结果进行推断。\n\n在实践中，应使用足够大的\\\
  (M\\)，并检查MCMC算法的收敛性。\n\n群体数量的选择方法如下。设\\(M_G\\)为具有\\(G\\)个群体的模型规范，其中\\(G = 1, ...,\
  \ G_{max}\\)，\\(G_{max}\\)为预先指定的正整数，并使用均匀先验\\(p(M_G) = 1/G_{max}$。计算边缘似然\n\n\\(p(\\\
  mathbf{Z}|M_G) = \\int p(\\mathbf{Z}|\\boldsymbol{\\pi}, \\boldsymbol{\\pi}, \\\
  mathbf{S}, G)p(\\boldsymbol{\\pi}, \\boldsymbol{\\pi}, \\mathbf{S})d\\boldsymbol{\\\
  psi}d\\boldsymbol{\\pi}d\\mathbf{S},\\)\n\n并将其与先验\\(p(M_G)$结合，利用贝叶斯定理计算后验\\(p(M_G|\\\
  mathbf{Z})\\)以确定群体数量。所用方法的详情见Frühwirth-Schnatter and Kaufmann (2008)和Tsay (2014,\
  \ chapter 6)。与所有MCMC程序一样，必须检查迭代的收敛性，读者可参阅Gamerman and Lopes (2006)及其中的参考文献。该方法已被Wang\
  \ et al. (2013)用于改进许多时间序列的预测。\n\n#### 5.3.3.5 带结构断点的聚类\n\nWang and Tsay (2019) 提出了一种基于贝叶斯的方法，用于对带结构断点的时间序列进行聚类，推广了Frühwirth-Schnatter\
  \ and Kaufmann (2008)的工作。断点数量被视为随机变量，群体成员身份和群体特定参数允许在这些断点处变化。一旦找到断点和群体成员身份，就可以对同一组中的所有系列进行信息合并，以用于估计和预测。当有新时期的观测值时，可将体制序列和参数的估计结果用作更新的初始值，而无需重新运行估计。\n\
  \n#### 示例 5.5\n\n我们使用**mclust**包对台湾AirBox数据进行基于模型的聚类。该系列由前五个自相关系数总结。所使用的R命令如下。我们不重复ACM矩阵的计算，因为它与示例5.4相同。主要命令是**mclustBIC**，它提供了BIC值的摘要，作为不同情景下模型后验概率的近似，这些情景由正态混合分布中协方差矩阵的结构给出。一旦选择了聚类数量，命令**Mclust**即给出混合模型的估计结果。\n\
  \n#### 使用包**mclust**进行基于模型的聚类的R命令：\n\n```\n##application of mclust to ACM of the\
  \ AirBox data\n> require(mclust)\n> Dat=t(ACM)\n> st=mclustBIC(Dat, G=1:12)\nfitting\
  \ ...\n|=============================|\n> plot(st)\nplot (st)\n> st\n```\n\n基于BIC准则的前3个模型：\n\
  \n| 模型 | BIC |\n|-------|-----|\n| VVE,3 | 7362.747 |\n| EEV,2 | 7353.859 |\n| EVE,3\
  \ | 7342.181 |\n\n```\n##Given that the maximum values of the BIC for most of the\
  \ models\n##is for G=3, three clusters are selected.\n```\n\n\n\n\n\n> s1 = Mclust(Dat,\
  \ G=3)\n> summary(s1)\n\n---------------------------------------------------------------------------\n\
  由EM算法拟合的高斯有限混合模型\n---------------------------------------------------------------------------\n\

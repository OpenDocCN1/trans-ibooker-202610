  \n图 6.6 EMU 国家 57 个经济增长率序列第一个公因子的时间图。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_332_1.png)\n\
  \n图 6.7 EMU 国家 57 个经济增长率序列第一个公因子的载荷。\n\n由此可见，载荷在第九个序列上给予了较大权重，该序列为塞浦路斯的投资序列。这很不寻常，我们发现第九个序列与公因子之间的样本相关系数为\
  \ 0.996。图 6.8 显示了 57 个序列的方差，可见第九个序列的方差比其他序列的方差大 10 倍以上。这一现象证实了我们的担忧，即 PCA 严重依赖所涉及序列的量纲。从某种意义上说，第九个序列可视为离群序列。为缓解量纲效应，我们对增长率序列进行了标准化并重复了分析。标准化后的增长率如图\
  \ 6.9 所示。现在很明显，所有增长率均受 2008 年金融危机影响。对标准化后的增长率进行分析也选择了一个公因子，如图 6.10 所示。相应的载荷在图 6.11\
  \ 中给出。载荷表明，公因子是标准化后的增长率的加权平均。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_333_0.png)\n\
  \n图 6.8 EMU 国家 57 个经济增长率序列的方差。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_333_1.png)\n\
  \n图 6.9 欧洲货币联盟 19 国 57 个经济系列标准化增长率的时间图。季度数据，2000 年至 2018 年。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_334_0.png)\n\
  \n图 6.10 EMU 国家标准化增长率第一个公因子的时间图。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_334_1.png)\n\
  \n图 6.11 EMU 国家标准化增长率第一个公因子的载荷。\n\n### 示例 6.3 的 R 命令\n\n```\n>library(MTS)\n>x=as.matrix(EMUdata)\n\
  >y=log(x)\n>y1=diffM(y)\n>tdx= c(2:76)/4+2000 # calendar time\n>MTSplot(y1,tdx)\n\
  >sall1=dfmpp(y1, stand = 0, mth = 0, r = 1, lagk = 0)\n>plot(tdx,sall1$F[,1],xlab='year',ylab='1st\
  \ factor',type='l')\n>plot(1:57,-sall1$L,xlab='country',ylab='1st factor',type='l')\n\
  ```\n\n```\n>syl=scale(y1)\n>sal2=dfmpc(syl, stand = 0, mth = 0, r = 1, lagk = 0)\n\
  >MTSplot(syl,tdx)\n>plot(tdx, -sal2$F[,1], xlab='year', ylab='1st factor', type='l')\n\
  >plot(1:57, -sal2$L,xlab='country', ylab='1st factor', type='l')\n```\n\n### 6.2.7\
  \ DFM 的替代表述\n\nLi and Sheddon (2002) 提出了一种不同的 FM。他们假设向量时间序列 \\( \\mathbf{y}_t \\\
  ) 的每个分量 \\( y_{it} \\) 由以下公式生成\n\n\\( y_{it} = \\sum_{j=1}^r \\lambda_{ij} Z_{ji}(t),\
  \ \\quad i = 1, \\dots, k, \\quad (6.23) \\)\n\n其中 \\( \\lambda_{ij} \\) 是未知实数，分量\
  \ \\( Z_{ji}(t), i = 1, \\dots, k \\) 是从共同概率分布中抽取的独立过程。假设序列已标准化，将等式 (6.23) 写为 \\\
  ( \\mathbf{y}_{it} = \\boldsymbol{\\lambda}'_i \\mathbf{Z}_i(t) \\)，其中 \\( \\boldsymbol{\\\
  lambda}'_i = (\\lambda_{i1}, \\dots, \\lambda_{ir}) \\) 且 \\( \\mathbf{Z}_i(t) =\
  \ (Z_{1i}(t), \\dots, Z_{ri}(t))' \\)，并记 \\( \\rho_i(h) = E(y_{it} y_{it+h}) / E(y_{it}^2)\
  \ \\)，则有 \\( \\rho_i(h) = \\boldsymbol{\\lambda}'_i \\Gamma_{\\mathbf{Z}_i}(h) \\\
  boldsymbol{\\lambda}_i / \\boldsymbol{\\lambda}'_i \\Gamma_{\\mathbf{Z}_i}(0) \\\
  boldsymbol{\\lambda}_i \\)，其中 \\( \\Gamma_{\\mathbf{Z}_i}(h) \\) 是 \\( \\mathbf{Z}_i(t)\
  \ \\) 的滞后-\\( h \\) 自协方差矩阵。由于这些分量已标准化且互不相关，矩阵 \\( \\Gamma_{\\mathbf{Z}_i}(0) \\\
  ) 是单位矩阵，\\( \\Gamma_{\\mathbf{Z}_i}(h) \\) 是对角矩阵。记 \\( \\phi_{ij}(h) = E(Z_{ij}(t)\
  \ Z_{ij}(t+h)) \\) 为 \\( \\Gamma_{\\mathbf{Z}_i}(h) \\) 的第 \\( j \\) 个对角元素，它表示过程\
  \ \\( Z_{ij}(t) \\) 的滞后-\\( h \\) 自相关系数，则有\n\n\\( \\rho_i(h) = \\sum_{j=1}^r \\\
  lambda_{ij}^2 \\phi_{ij}(h) / \\sum_{j=1}^r \\lambda_{ij}^2 = \\sum_{j=1}^r p_{ij}^2\
  \ \\phi_{ij}(h), \\)\n\n其中 \\( p_{ij}^2 = \\lambda_{ij}^2 / \\sum_{j=1}^r \\lambda_{ij}^2\
  \ \\) 是满足 \\( \\sum_{i=1}^r p_{ij}^2 = 1 \\) 的权重。这是式 (6.1) 中 EDFM 的相同表达式，其中独立因子遵循相同的分布。就此而言，正如\
  \ Peña (2009) 所示，两种表述是等价的。\n\nGao and Tsay (2019, 2020) 提出了另一种 DFM 模型，避免了噪声协方差矩阵的奇异性。他们假设，观测到的\
  \ \\( k \\) 维时间序列是 \\( r \\) 个公因子和 \\( k-r \\) 个个体特异噪声的非奇异线性变换。因此，他们不使用 DFM 模型 \\\
  ( \\mathbf{z}_t = \\mathbf{P} \\mathbf{f}_t + \\mathbf{n}_t \\)（其中 \\( \\mathbf{n}_t\
  \ \\) 的维度为 \\( k \\)），而是假设噪声的维度为 \\( k-r \\)。如 Tiao and Tsay (1989) 所示，利用序列及其滞后值之间的典型相关分析，任何有限阶\
  \ VARMA 模型都可写为\n\n\\( \\mathbf{z}_t = \\mathbf{L}_1 \\mathbf{f}_t + \\mathbf{L}_2\
  \ \\mathbf{e}_t, \\quad (6.24) \\)\n\n其中 \\( \\mathbf{L}_1 \\) 是 \\( k \\times r\
  \ \\)，\\( \\mathbf{L}_2 \\) 是 \\( k \\times (k-r) \\)，\\( \\mathbf{f}_t \\) 是具有动态结构的\
  \ \\( r \\) 维因子，满足 \\( \\Gamma_f(0) = \\mathbf{I}_r \\)，\\( \\mathbf{e}_t \\) 是均值为零且协方差矩阵\
  \ \\( \\boldsymbol{\\Sigma}_e \\) 为正定的 \\( (k-r) \\) 维白噪声过程。此外，\\( \\mathbf{f}_t\
  \ \\) 的任何线性组合都不是白噪声过程，且 \\( \\{ \\mathbf{f}_t \\} \\) 和 \\( \\{ \\mathbf{e}_t \\\
  } \\) 不相关。不失一般性，可假设 \\( \\mathbf{L}'_1 \\mathbf{L}_1 = \\mathbf{I}_r \\) 且 \\( \\\
  mathbf{L}'_2 \\mathbf{L}_2 = \\mathbf{I}_{k-r} \\)，但 \\( \\mathbf{L}_1 \\) 一般不与\
  \ \\( \\mathbf{L}_2 \\) 正交。然后，记 \\( \\mathbf{L}^*_1 \\) 为 \\( \\mathbf{L}_1 \\)\
  \ 的正交补，则有\n\n\\( (\\mathbf{L}^*_1)' \\mathbf{z}_t = (\\mathbf{L}^*_1)' \\mathbf{L}_2\
  \ \\mathbf{e}_t, \\)\n\n因此，得到 \\( k-r \\) 个 \\( z_t \\) 的线性组合，它们均为白噪声。因此，因子个数可通过搜索为白噪声的线性组合个数来确定。\n\
  \n同样地，记 \\( \\mathbf{L}^*_2 \\) 为 \\( \\mathbf{L}_2 \\) 的正交补，并对等式 (6.24) 左乘，则有\n\
  \n\\( (\\mathbf{L}^*_2)' \\mathbf{z}_t = (\\mathbf{L}^*_2)' \\mathbf{L}_1 \\mathbf{f}_t,\
  \ \\)\n\n该式不涉及噪声分量 \\( \\mathbf{e}_t \\)。因此，可以推导出不受噪声项影响的公因子 \\( \\mathbf{f}_t \\\
  ) 的估计量。这与之前通过 PCA 提到的公因子估计不同，其中估计量 \\( \\hat{\\mathbf{f}}_t \\) 始终受噪声分量影响。Gao and\
  \ Tsay (2019) 将此类估计程序称为投影 PCA。由于该模型在高维情况下（即 \\( k > T \\））具有一些优势，我们将在 6.10 节进一步讨论。\n\
  \n## 6.3 平稳序列的广义 DFM (GDFM)\n\nDFM 假设序列与公因子之间存在同期关系。本模型可推广，见 Forni et al. (2000)，假设观测时间序列受因子及其所有过去值的影响。所得模型称为\
  \ GDFM。假设滞后阶数有限，其表达式为：\n\n\\( z_t = \\sum_{l=0}^{L-1} P_l f_{t-l} + n_t, \\quad\
  \ (6.25) \\)\n\n其中 \\( L \\) 是正整数。\\( f_t \\) 是互不相关的 \\( q \\) 维平稳公因子向量，\\( L \\\
  ) 个矩阵 \\( P_l \\) 是 \\( k \\times q \\) 因子载荷矩阵，\\( n_t \\) 是噪声或个体特异部分，为平稳并满足近似 DFM\
  \ 的条件。当 \\( L > 1 \\) 时，在等式 (6.25) 中用 \\( q \\) 表示因子个数，若 \\( L = 1 \\) 则恢复记号 \\\
  ( r \\)。此记号变更的原因稍后将变得清晰。序列 \\( z_t \\) 的公共分量为 \\( c_t = \\sum_{l=0}^{L-1} P_l f_{t-l}\
  \ \\)，由 \\( q < k \\) 个未观测因子序列生成。尽管 GDFM 的提出允许 \\( L \\) 趋于无穷，但本节仅讨论 \\( L \\) 有限的情况，这也是实践中最重要的情形。载荷矩阵和因子的识别条件与\
  \ DFM 类似，即 \\( P_l' P_l = I_q \\)（\\( l = 0, 1, \\dots, L-1 \\)），且 \\( E(f_t f_t')\
  \ \\) 为对角阵。\n\n模型 (6.25) 也可写为\n\n\\( z_t = P(B)f_t + n_t, \\)\n\n其中 \\( P(B) = P_0\
  \ + P_1 B + \\cdots + P_{L-1} B^{L-1} \\) 是滞后算子的矩阵多项式。假设因子遵循对角矩阵的向量自回归（VAR）模型\n\n\
  \\( A(B)f_t = a_t, \\)\n\n则有\n\n\\( z_t = \\Psi(B)a_t + n_t, \\)\n\n其中 \\( \\Psi(B)\
  \ = P(B)A(B) \\)。请注意，在有限样本中，\\( \\Psi(B) \\) 分解为 \\( A(B) \\) 和 \\( P(B) \\) 存在识别问题，因为二者均未观测到。\n\
  \n\n\n\n\n为了识别 GDFM，Forni et al. (2000) 在频率域内针对每个频率的观测数据谱密度矩阵的特征值提出了条件。他们假设这些矩阵有\
  \ $q$ 个特征值在 \\( k \\to \\infty \\) 时发散。然而，对于噪声分量，这些矩阵的所有特征值都有界。由于谱密度矩阵是协方差矩阵的傅里叶变换（参见\
  \ Shumway and Stoffer, 2000），该性质等价于：所有滞后协方差矩阵都有 $q$ 个在 \\( k \\to \\infty \\) 时发散的特征值，而特殊分量协方差矩阵的最大特征值在所有滞后下均有界。从直观角度来看，这意味着因子对几乎所有序列都有影响，且仅有少数载荷参数为零。可以说，因子对观测序列具有普遍性影响。然而，噪声集中在有限数量的序列上。对噪声的这些假设与\
  \ ADFM 中提出的假设类似。换句话说，噪声与信号比必须在 \\( k \\to \\infty \\) 时趋于零，模型才能被识别。\n\n### 6.3.1\
  \ GDFM 的一些性质\n\nModel (6.25) can be written as model (6.1) by defining a \\( k \\\
  times r \\) loading matrix \\( \\boldsymbol{B} = [\\boldsymbol{P}_0, \\dots, \\\
  boldsymbol{P}_{L-1}] \\), where now \\( r = qL \\) and a \\( r \\times 1 \\) vector\
  \ of series \\( \\boldsymbol{F}_t^D = [\\boldsymbol{f}'_t, \\dots \\boldsymbol{f}'_{t-L+1}]'\
  \ \\). Then\n\n\\( z_t = \\boldsymbol{B} \\boldsymbol{F}_t^D + \\boldsymbol{n}_t,\
  \ \\quad (6.26) \\)\n\nbut this equation does not represent the standard DFM because\
  \ \\( \\boldsymbol{B}' \\boldsymbol{B} \\neq \\boldsymbol{I}_r \\), as in general\
  \ \\( \\boldsymbol{P}_i' \\boldsymbol{P}_j \\neq \\boldsymbol{0} \\), for \\( i\
  \ \\neq j \\), and the covariance matrices \\( \\Gamma_F^D(h) \\) are no longer\
  \ diagonal. The covariance matrices of the observed series \\( \\boldsymbol{z}_t\
  \ \\) satisfy\n\n\\( \\Gamma_z(h) = \\boldsymbol{B} \\Gamma_F^D(h) \\boldsymbol{B}'\
  \ + \\Gamma_n(h), \\)\n\nwhere now \\( \\boldsymbol{B} \\) is \\( k \\times qL \\\
  ) and \\( \\Gamma_F^D(h) \\) is \\( qL \\times qL \\). The matrix \\( \\boldsymbol{B}\
  \ \\) can be written as \\( \\boldsymbol{UDV}' \\) for the singular value decomposition\
  \ and model (6.26) is equivalent to\n\n\\( z_t = \\boldsymbol{U} \\boldsymbol{F}_t^S\
  \ + \\boldsymbol{n}_t, \\)\n\nwhere the vector of static factors \\( \\boldsymbol{F}_t^S\
  \ = \\boldsymbol{DV}' \\boldsymbol{F}_t^D \\) is a linear transformation of the\
  \ original dynamic factors. These factors can be made orthogonal with some additional\
  \ transformation\n\n\\( z_t = \\boldsymbol{U} \\boldsymbol{M} \\boldsymbol{M}' \\\
  boldsymbol{F}_t^S + \\boldsymbol{n}_t = \\boldsymbol{P} \\boldsymbol{f}_t + \\boldsymbol{n}_t,\
  \ \\)\n\nwhere \\( \\boldsymbol{M} \\) is an orthonormal matrix with the eigenvectors\
  \ of the covariance matrix of \\( \\boldsymbol{F}_t^S \\) and \\( \\boldsymbol{P}\
  \ = \\boldsymbol{U} \\boldsymbol{M} \\) and \\( \\boldsymbol{f}_t = \\boldsymbol{M}'\
  \ \\boldsymbol{F}_t^S \\). Note that although \\( \\boldsymbol{P} \\Gamma_F^S(h)\
  \ \\boldsymbol{P}' \\) could have rank \\( qL \\), the space of the static factor\
  \ could be well approximated by a space of lower dimension than \\( qL \\). As an\
  \ illustration, consider the simple model with \\( L=2 \\)\n\n\\( z_t = \\boldsymbol{P}_0\
  \ f_t + \\boldsymbol{P}_1 f_{t-1} + \\boldsymbol{n}_t, \\)\n\nand the factors follow\
  \ the VAR(1) model \\( \\boldsymbol{f}_t = \\boldsymbol{\\Phi} \\boldsymbol{f}_{t-1}\
  \ + \\boldsymbol{u}_t \\). Then, this GDFM model can also be written as\n\n\\( z_t\
  \ = (\\boldsymbol{P}_0 \\Phi + \\boldsymbol{P}_1) f_{t-1} + \\boldsymbol{n}_t +\
  \ \\boldsymbol{P}_0 u_t = \\boldsymbol{P}^* f_t^* + \\boldsymbol{n}_t^*, \\)\n\n\
  This model can be seen as a DFM with r = 2q, as in (6.26), or as a DFM with r =\
  \ q factors, f_t^*, that have VAR(1) structure and a white noise, n_t^*, with a\
  \ non-diagonal covariance matrix. In particular, if the variances of the factor\
  \ noises, u_t, are smaller than those of the n_t and the off-diagonal elements of\
  \ the covariance matrix are small, the model will be close to a standard EDFM with\
  \ r = q factors. In practice, there is strong evidence that the number of dynamic\
  \ factors found, q, is usually smaller than the number of static factors, r, but\
  \ also that r < qL.\n\nThe estimation of GDFM can be carried out by DPC analysis\
  \ in the frequency domain, as proposed by Forni et al. (2000, 2005) or by linear\
  \ generalized DPC analysis in the time domain, as proposed by Peña et al. (2019).\
  \ This last approach seems to work better in finite samples, see Peña and Yohai\
  \ (2016) and Peña et al. (2019), and has the advantage that it can be applied to\
  \ the nonstationary case, where the spectral approach cannot.\n\n### 6.3.2 GDFM\
  \ 与 VARMA 模型\n\nAs mentioned in Chapter 3, to overcome the problem of using a large\
  \ number of parameters in a VARMA model when k is large, Velu, Reinsel and Wichern\
  \ (1986) proposed reduced rank models. In particular, the reduced rank VAR model\
  \ assumes that z_t follows a VAR model with parameter matrices that can be decomposed\
  \ as:\n\n$z_t = \\Phi(B)z_{t-1} + e_t = A(B)C(B)z_{t-1} + e_t, \\quad (6.27)$\n\n\
  where $A(B) = \\sum_{i=0}^{p_1} A_i B^i$ and $C(B) = \\sum_{i=0}^{p_2} C_i B^i$\
  \ are matrix polynomials of dimensions $k \\times r$ and $r \\times k$, where $r\
  \ < k$, and with degrees $p_1$ and $p_2$, respectively. The series $z_t$ follows\
  \ a VAR($p_1 + p_2 + 1$) model. Calling $C(B)z_{t-1} = f_t$, we can write the model\
  \ as\n\n$z_t = A(B)f_t + e_t, \\quad (6.28)$\n\nwhich looks like a GDFM with r factors\
  \ and a white noise term. However, there is an important difference between the\
  \ two models. In the reduced rank representation (6.28), the factors $f_t$ must\
  \ be linear combinations of lagged values of the series, whereas in the GDFM the\
  \ factors do not have these restrictions and they include the contemporaneous information\
  \ as well as the past information. See Ahn and Reinsel (1988) for generalizations\
  \ of Model (6.28) to the nested reduced rank AR model, and its relationship to the\
  \ scalar components model of Tsay and Tiao (1985) and Tiao and Tsay (1989).\n\n\
  ## 6.4 动态主成分\n\n### 6.4.1 用于最优重构的动态主成分\n\nWe have seen in Chapter 1 that the standard\
  \ PCs provide an optimal reconstruction of the time series data using only contemporaneous\
  \ information. Brillinger (1981) addressed the reconstruction problem in a more\
  \ general form, allowing the use of lagged values, and defined Dynamic Principal\
  \ Components, (DPCs) as linear combinations of the time series that provide an optimal\
  \ reconstruction using all leads and lags of the data. Formally, consider a zero-mean\
  \ k-dimensional stationary process\n\n{z_t | -∞ < t < ∞}. Define the first DPC as\
  \ a linear combination of all the values of the series\n\n$$f_t = \\sum_{h=-\\infty}^{\\\
  infty} c'_h z_{t-h}, \\qquad (6.29)$$\n\nwhere the $c_h$ are k-dimensional vectors\
  \ such that $f_t$ provides an optimal reconstruction of the data using all of its\
  \ lags and leads, that is, the first DPC minimizes:\n\n$$E \\left[ \\left( z_t -\
  \ \\sum_{j=-\\infty}^{\\infty} \\beta_j f_{t+j} \\right)' \\left( z_t - \\sum_{j=-\\\
  infty}^{\\infty} \\beta_j f_{t+j} \\right) \\right], \\qquad (6.30)$$\n\nusing some\
  \ $k \\times 1$ vectors $\\beta_j, -\\infty < j < \\infty$. Brillinger elegantly\
  \ solved this problem in the frequency domain by showing that $c_k$ is the inverse\
  \ Fourier transform of the PCs of the cross-spectral matrices for each frequency,\
  \ and $\\beta_j$ is the inverse Fourier transform of the conjugates of the same\
  \ PCs. See Brillinger (1981) and Shumway and Stoffer (2000) for the details. When\
  \ this procedure is adapted to finite samples, the number of lags in Eq. (6.29)\
  \ and in the reconstruction of the series in Eq. (6.30) are to be defined. Also,\
  \ the approach proposed by Brillinger to solve the problem can only be applied to\
  \ stationary time series. These DPC has been used by Forni et al. (2000, 2005) for\
  \ estimation of GDFMs.\n\n### 6.4.2 单侧 DPC\n\nPeña et al. (2019) proposed a way\
  \ to compute the DPC in the time domain that is more efficient than that in the\
  \ frequency domain in finite samples. They called the estimates one-sided dynamic\
  \ principal component (ODPC), because they used the lagged values of the series\
  \ to differentiate them from those defined by Brillinger that use both the past\
  \ and future values. The ODPCs are summarised as follows. Consider two nonnegative\
  \ integers $c_1$ and $c_2$. Let $a' = (a'_1, \\dots, a'_{c_1})$ be a $k(c_1 + 1)$-dimensional\
  \ vector, where $a' = (a_{h1}, \\dots, a_{hk})$. Also, let $B$ be a $(c_2 + 1) \\\
  times k$ matrix of the form $B' = [\\mathbf{b}_0, \\dots, \\mathbf{b}_{c_2}]$, where\
  \ each $\\mathbf{b}_i \\in R^k$. Define the first DPC as,\n\n$$f_t(\\widehat{a})\
  \ = \\sum_{h=0}^{c_1} z'_{t-h} \\widehat{a}_h, \\quad t = c_1 + 1, \\dots, T, \\\
  qquad (6.31)$$\n\nwhich is a linear combination of the lagged values of the series\
  \ that has the property that the reconstruction of the original data via\n\n$$z^{R,1}_t(a,\
  \ B) = \\sum_{h=0}^{c_2} \\mathbf{b}_h f_{t-h}(a), \\quad t = c_1 + c_2 + 1, \\\
  dots, T, \\qquad (6.32)$$\n\nminimizes the MSE in the reconstruction. That is, the\
  \ vector $\\widehat{a}$ and the matrix $\\widehat{B}$ are such that\n\n$$(\\widehat{a},\
  \ \\widehat{B}) = \\arg \\min_{\\|a\\|=1, B} \\frac{1}{T^* k} \\sum_{t=(c_1+c_2)+1}^{T}\
  \ \\| z_t - z^{R,1}_t(a, B) \\|^2, \\qquad (6.33)$$\n\nwhere $T^* = T - (c_1 + c_2)$\
  \ is the effective number of observations we can reconstruct with the ODPC. Note\
  \ that by (6.31), we can compute the component for\n\n\n\n$t = c_1 + 1, ..., T$，根据公式\
  \ (6.32)，我们可以重建的第一个值是 $t = c_1 + c_2$。约束 $\\|\\boldsymbol{a}\\| = 1$ 是为了识别目的而包含的，因为如果我们将公式\
  \ (6.31) 中的 $\\boldsymbol{a}_h$ 乘以 $g$ 并将 $\\boldsymbol{b}_h$ 除以 $g$，解保持不变。\n\n\
  第二个 ODPC 然后定义为滞后系列的线性组合，可用于最优重建第一个分量的残差。高阶分量的定义类似。最后，使用前 $v$ 个单侧 DPC 对 $\\boldsymbol{z}_t$\
  \ 的重建给出如下：\n\n\\(\\widehat{z}^v_t = \\sum_{i=1}^v \\sum_{h=0}^{c_2^i} \\widehat{\\\
  boldsymbol{b}}^i_h \\widehat{f}^i_{t-h}, \\quad c_{\\max}^v + 1 \\le t \\le T,\\\
  )\n\n这里 \\(c^i_1\\) 和 \\(c^i_2\\) 是第 \\(i\\) 个 ODPC 的 \\(c_1\\) 和 \\(c_2\\) 的取值，且\
  \ \\(c_{\\max}^v = \\max\\{c_1^i + c_2^i | i = 1, ..., v\\}\\)。\n\n我们现在描述一个计算 ODPC\
  \ 的算法。由于其定义是序列的，提出一个计算第一个分量的算法即可。在下文中，为了简化记号，我们省略指示分量编号的上标。为了推导计算 \\(\\widehat{\\\
  boldsymbol{a}}\\) 和 \\(\\widehat{\\boldsymbol{B}}\\) 的算法，我们需要先将公式 (6.33) 中的目标函数表示成更易处理的形式。为此，我们引入一些进一步的记号。设\
  \ \\(\\boldsymbol{Z}_h\\) 为 \\(T^* \\times k\\) 观测数据矩阵，即：\n\n\\(\\boldsymbol{Z}_h\
  \ = \\begin{bmatrix} \\boldsymbol{z}'_{h+1} \\\\ \\boldsymbol{z}'_{h+2} \\\\ \\\
  vdots \\\\ \\boldsymbol{z}'_{T+T^*} \\end{bmatrix},\\)\n\n并考虑 \\(h = 0, ..., (c_1\
  \ + c_2)\\) 的矩阵序列 \\(\\boldsymbol{Z}_h\\)。矩阵 \\(\\boldsymbol{Z}_{c_1+c_2}\\) 包含待重建的观测值，而矩阵\
  \ \\(\\boldsymbol{Z}_0, ..., \\boldsymbol{Z}_{c_1+c_2-1}\\) 用于计算该分量。我们还需要，对于 \\\
  (l = c_1, ..., (c_1 + c_2)\\)，包含用于计算该分量的滞后值的 \\(T^* \\times k(c_1 + 1)\\) 矩阵序列 \\\
  (\\boldsymbol{Z}_{l, c_1} = [\\boldsymbol{Z}_l, \\boldsymbol{Z}_{l-1}, ..., \\boldsymbol{Z}_{l-c_1}]\\\
  )，其中 \\(\\boldsymbol{F}_{c_1, c_2} = [\\boldsymbol{f}_{(c_1+c_2)}, \\boldsymbol{f}_{(c_1+c_2)-1},\
  \ ..., \\boldsymbol{f}_{c_1}]\\) 的列为分量，\\(\\boldsymbol{f}_j = (f_{j+1}, ..., f_{T-(c_1+c_2)+j})'\\\
  ) 给出了分量的值。这些最后的矩阵由以下关系相关：\n\n\\(\\boldsymbol{F}_{c_1, c_2} = (\\boldsymbol{Z}_{c_1+c_2,\
  \ c_1} \\boldsymbol{a}, ..., \\boldsymbol{Z}_{c_1, c_1} \\boldsymbol{a}),\\)\n\n\
  其中 \\(\\boldsymbol{F}_{c_1, c_2} = \\boldsymbol{F}_{c_1, c_2}(\\boldsymbol{a})\\\
  )，尽管这种依赖关系在记号中未明确体现。\\(\\boldsymbol{Z}_{c_1+c_2}\\) 的重建可以写成一个同维度的矩阵 \\(\\boldsymbol{Z}^R_{c_1+c_2}\\\
  )，即 \\(T^* \\times k\\)，\n\n\\(\\boldsymbol{Z}^R_{c_1+c_2} = \\boldsymbol{F}_{c_1,\
  \ c_2} \\boldsymbol{B}.\\)\n\n然后，\\((\\widehat{\\boldsymbol{a}}, \\widehat{\\boldsymbol{B}})\\\
  ) 可通过最小化以下式子获得：\n\n\\(\\| \\boldsymbol{Z}_{c_1+c_2} - \\boldsymbol{F}_{c_1, c_2}\
  \ \\boldsymbol{B} \\|^2_F = \\| \\text{vec}(\\boldsymbol{Z}_{c_1+c_2}) - \\text{vec}(\\\
  boldsymbol{Z}^R_{c_1+c_2}) \\|^2,\\)\n\n限制条件为 \\(\\| \\boldsymbol{a} \\| = 1\\)，其中\
  \ \\(\\| \\cdot \\|_F\\) 为 Frobenius 范数。\n\n然后，可以证明（参见 Peña et al. 2019），\\(\\widehat{\\\
  boldsymbol{a}}\\) 的最小二乘估计为\n\n\\(\\widehat{\\boldsymbol{a}} = (\\boldsymbol{Y}'\
  \ \\boldsymbol{Y})^{-1} \\boldsymbol{Y}' \\text{vec}(\\boldsymbol{Z}_{c_1+c_2}),\\\
  )\n\n其中矩阵 **Y** 由以下给出：\n\n$$Y = (B \\otimes I_{T^*})Z^B,$$\n\n矩阵 $Z^B$ 由包含用于计算该分量的滞后值的矩阵\
  \ $Z_{l, c_1}$ 构成。此解应标准化为单位范数。\n\n另一方面，对于固定的 $F_{c_1, c_2}$，最优 $B$ 也可以通过最小二乘法计算\n\
  \n$$\\widehat{B} = (F'_{c_1, c_2} F_{c_1, c_2})^{-1} F'_{c_1, c_2} Z_{c_1+c_2}.\\\
  tag{6.36}$$\n\n我们可以应用交替最小二乘算法来计算 $\\widehat{a}$ 和 $\\widehat{B}$。设 $a^{(i)}$、$B^{(i)}$\
  \ 和 $f^{(i)}$ 为第 $i$ 次迭代对应的 $a$、$B$ 和 $f$ 的取值。设 $\\delta \\in (0, 1)$ 为停止迭代的容忍参数。在我们的实现中，取\
  \ $\\delta = 10^{-4}$。与之前一样，算法通过给出分量的初始值（例如 $f^{(0)}$）并描述从 $f^{(i)}$ 计算 $B^{(i+1)}$、$a^{(i+1)}$\
  \ 和 $f^{(i+1)}$ 的规则来定义。具体步骤如下：\n\n- 1. 给定 $f^{(i)}$，根据公式 (6.36) 定义 $B^{(i+1)}$，其中\
  \ $F_{c_1, c_2}$ 对应于 $f^{(i)}$。\n- 2. 使用 $B = B^{(i+1)}$ 根据公式 (6.35) 计算 $a_p^{(i+1)}$，并令\
  \ $a^{(i+1)} = a_p^{(i+1)} / \\|a_p^{(i+1)}\\|$。\n- 3. $f^{(i+1)}$ 的第 $t$ 个坐标由公式\
  \ (6.31) 给出，其中 $a = a^{(i+1)}$。\n\n当 MSE 的相对下降小于 $\\delta$ 时停止迭代。很明显，在此算法中，每一步 MSE\
  \ 都会减小，因此它收敛到一个局部最小值。为了获得全局最小值，初始值 $f^{(0)}$ 应足够接近最优值。我们建议将 $f^{(0)}$ 取为数据第一个普通\
  \ PC 的最后 $T - c_1$ 个坐标。\n\n### 6.4.3 模型选择与预测\n\n在实践中，需要选择分量的数量以及每个分量中的滞后数量。为简化记号，假设对于每个分量\
  \ $c_1 = c_2$，即用于定义第 $i$ 个 DPC 的 $z_t$ 的滞后数量与用于重建原始序列的 $\\widehat{f}_t^i$ 的滞后数量相同。选择分量数量和滞后数量的一种可能方法是逐步最小化交叉验证预测误差。假设我们要进行\
  \ $h$ 步先行预测。固定最大滞后数量 $G_{\\max}$ 和窗口大小 $w$。然后，给定 $g \\in \\{1, \\dots, G_{\\max}\\\
  }$，我们使用 $g$ 个滞后计算第一个 ODPC，对 $t = 1, \\dots, w$ 使用时期 $1, \\dots, T - h - t + 1$，对于每个拟合，我们计算一个\
  \ $h$ 步先行预测和相应的 MSE $E_{t,h}$。预测误差的交叉验证估计如下：\n\n$$\\widehat{MSE}_{1,g} = \\frac{1}{w}\
  \ \\sum_{t=1}^w E_{t,h}.$$\n\n我们为第一个分量选择最小化 $\\widehat{MSE}_{1,g}$ 的 $g^{*,1}$ 值。然后，我们固定使用\
  \ $g^{*,1}$ 个滞后计算的第一个分量，并对第二个分量重复该过程。如果使用两个分量得到的最优交叉验证预测误差 $\\widehat{MSE}_{2,g}$\
  \ 大于仅使用一个分量的 $\\widehat{MSE}_{1,g}$，则我们停止，ODPCA 具有一个分量，拥有 \\(g^{*,1}\\) 个滞后；否则，我们添加使用\
  \ \\(g^{*,2}\\) 个滞后定义的第二个分量，并如以前一样继续。\n\n同样的逐步方法也可应用于最小化信息准则，而不是交叉验证预测误差。这将显著降低计算负担。以下准则受\
  \ Bai and Ng (2002) 提出的 IC\\(_{p3}\\) 准则启发，在实践中似乎能取得良好效果。设 \\(\\hat{\\sigma}_{1,g}^2\\\
  ) 为使用 \\(g\\) 个滞后定义的第一个 ODPCA 的重建 MSE。设 \\(T^{*,1,g} = T - 2g\\)。然后我们在 \\(1, \\\
  dots, G_{max}\\) 中选择最小化以下式子的 \\(g^{*,1}\\) 值：\n\n\\(\\text{BNG}_{1,g} = \\log(\\\
  hat{\\sigma}_{1,g}^2) + (g+1) \\frac{\\log(\\min(T^{*,1,g}, g))}{\\min(T^{*,1,g},\
  \ g)}.\\)\n\n请注意，\\((g+1)\\) 是使用 \\(g\\) 个滞后拟合单个分量所隐含的静态因子数量。现在假设我们已经计算了 \\(q-1\\\
  ) 个 DPC，每个具有 \\(c_1 = c_2 = g^{*,i}\\) 个滞后，\\(i = 1, \\dots, q-1\\)。设 \\(\\hat{\\\
  sigma}_{q,g}^2\\) 为使用各分量拟合得到的重建 MSE，其中前 \\(q-1\\) 个分量使用 \\(g^{*,i}, i = 1, \\dots,\
  \ q-1\\) 定义，最后一个分量使用 \\(g\\) 个滞后定义。设 \\(T^{*,q,g} = T - \\max\\{2g^{*,1}, \\dots,\
  \ 2g^{*,q-1}, 2g\\}\\)。设 \\(g^{*,q}\\) 为在 \\(1, \\dots, G_{max}\\) 中最小化以下式子的值：\n\
  \n\\(\\text{BNG}_{q,g} = \\log(\\hat{\\sigma}_{q,g}^2) + \\left( \\sum_{i=1}^{q-1}\
  \ (g^{*,i} + 1) + g + 1 \\right) \\frac{\\log(\\min(T^{*,q,g}, g))}{\\min(T^{*,q,g},\
  \ g)}.\\)\n\n请注意，\\(\\sum_{i=1}^{q-1} (g^{*,i} + 1)\\) 是拟合 \\(q-1\\) 个动态分量（每个具有\
  \ \\(g^{*,i}\\) 个滞后）所隐含的静态因子数量。如果 \\(\\text{BNG}_{q^{*,g}, g}\\) 大于 \\(\\text{BNG}_{q-1,\
  \ g^{*,q-1}}\\)，则我们停止，最终模型是具有 \\(q-1\\) 个分量的 ODPC。否则，我们添加使用 \\(g^{*,q}\\) 定义的第 \\\
  (q\\) 个分量，并如以前一样继续。\n\n将 \\(q\\) 个 DPC 拟合到数据后，每个具有 \\((c_1, c_2)\\) 个滞后，\\(i = 1,\
  \ \\dots, q\\)，我们可以如下构建预测。假设我们已决定对这些 DPC 分别预测的程序。例如，我们可以以自动方式将 ARMA 模型拟合到各分量。设 \\\
  (\\hat{f}_j^{i|h}\\)（\\(h > 0\\)）为截至时间 \\(T\\) 的信息下对 \\(f_{T+h}^i\\) 的预测。然后我们可以得到\
  \ \\(z_T\\) 的 \\(h\\) 步先行预测如下：\n\n\\(\\hat{z}_{T+v|T} = \\sum_{i=1}^{q} \\sum_{h=0}^{c_2}\
  \ \\hat{b}_h^i \\hat{f}_{T+v-h|T}^i.\\)\n\n### 6.4.4 单侧 DPC 与 GDFM 估计\n\n单侧 DPC\
  \ 或 ODPC 提供了一种估计 GDFM 的有用方法。事实上，Peña et al. (2019) 证明了，当序列数量和样本量都趋于无穷大时，用 ODPC 得到的重建在均方意义下收敛到\
  \ GDFM 的共同部分。因此，ODPC 提供了一种估计具有有限滞后数量的 DFM 共同部分的替代方法。对于非平稳时间序列，我们将在下一部分介绍这些时域 DPC\
  \ 的推广版本，以估计非平稳 GDFM。\n\n\n\n\n\n### 示例 6.4\n\n再次考虑 19 个欧元区国家从 2000.II 到 2018.IV\
  \ 的标准化 GDP 系列的增长率。这些数据在示例 6.1 中介绍过。我们使用 R 程序包 odpc 演示 ODPC 的估计。图 6.12 显示了第一个估计 ODPC\
  \ 的时间图，图 6.13 显示了第二个因子或第二个 ODPC。这些结果使用三个滞后计算得出。图 6.14 绘制了第一个 DPC 的 a^1 系数，而图 6.15\
  \ 也显示了第一个 DPC 在 B 中的载荷。\n\n#### 动态主成分的 R 命令：\n\n```\n>require(odpc) # load package\n\
  sal<- odpc(G1, ks=c(3,3))\n> sal\n\nk1 k2 MSE\nComponent 1 3 3 0.006\nComponent\

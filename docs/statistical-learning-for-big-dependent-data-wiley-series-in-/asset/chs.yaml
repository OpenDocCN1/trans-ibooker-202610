  \n**图 6.15** 用于重建欧洲货币联盟 GDP 增长率的第一个动态主成分的滞后载荷（**b** 系数）。这些载荷适用于从零到三的滞后。\n\n```\n\
  > plot(tdx, -f1,xlab=\"year\",ylab=\"Dynamic Factor\", main=\"First Dynamic\nFactor\

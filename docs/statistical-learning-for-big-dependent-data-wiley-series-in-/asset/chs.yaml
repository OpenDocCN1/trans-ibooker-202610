  \n```\n\n## 5.6 非参数分类\n\n当特征的分布未知时，可使用几种非参数方法进行判别。第一种是最近邻（NN），该方法应用非常简单，并常作为方法间比较的基准（参见，例如，Dau\
  \ et al. 2018）。第二种是支持向量机（SVM），由Vapnik（2013）提出，与机器学习中分类机构建理论相关，如Cherkassky和Mulier（1998）以及Vapnik（2013）所述。第三，有一些分类方法可以应用于更广泛的预测问题集，包括时间序列预测，这些程序在第7章和第8章中有所介绍。它们包括分类和回归树（CART）、随机森林、提升、神经网络和深度学习。最后，对于大型数据集，我们可以估计特征的联合概率分布，并使用此经验分布对新观测值进行分类。这些程序在时间序列分类问题的不同设置中的效率仍在进行深入研究。\n\
  \n### 5.6.1 最近邻\n\n一种简单且通用的分类程序，在许多情况下都取得了良好的效果，具体如下：\n\n\n\n- 1. 定义两点之间的距离度量。\n\
  - 2. 计算待分类点 \\(x_0\\) 与样本中所有点之间的距离。\n- 3. 选择最接近 \\(x_0\\) 的 \\(m\\) 个样本点。计算这些 \\\
  (m\\) 个点属于每个总体的比例。将点 \\(x_0\\) 归类到这 \\(m\\) 个点中频率最高的总体。\n\n该方法称为m-NN。在m=1的特定情况下，NN将新元素归类到其最近元素所属的总体。一个关键问题是m的选择。一种可能性是尝试不同的值，将分类错误作为m的函数得到，并选择导致最小观测分类错误的m值。\n\
  \n这种简单方法的优点之一在于它只查看待分类新数据周围的点分布。因此，如果某些特征不相关且有用于分类的信息包含在较小维度的空间中，则局部近似使得计算出的距离可能是较大空间的良好表示。对于时间序列分析，可以使用第5.1节中提出的任何距离和不相似性度量。\n\
  \n当特征空间的维度p较大时，NN效果不好。此时，一点到其他所有点的距离通常较高，这会降低该方法的性能。例如，假设数据由单位边长、维度为p的超立方体中均匀分布的点定义。考虑一个边长L\
  \ < 1的内部超立方体。它将包含总体（初始总体）中等于 \\(p_r = L^p\\) 比例的点。对于较大的p，例如p = 500，边长L = 0.99的大超立方体将以p\
  \ = 0.0065的概率包含总体中的点。因此，如果我们从总体中抽取n = 1000的样本，该超立方体中预期的点数为6.5。高维空间在相对意义上非常宽广，局部距离在高维中可能效果不好。针对这种情况，已提出了一些自适应最近邻方法；参见Hastie\
  \ et al. (2001)。另一种可能性是通过将数据投影到某些有用方向（如极端峰度方向）来降低空间维度；参见Peña and Prieto (2001)和Peña\
  \ et al. (2010)。这些方法的效率和有用性需要进一步研究。\n\n### 5.6.2 支持向量机\n\n歧视的一种流行方法是SVM；参见Vapnik\
  \ and Chapelle (2000)、Cherkassky and Mulier (1998)、Scholkopf and Smola (2001)及其参考文献。我们在此首先针对两个状态的情况介绍该方法。该程序处理分类问题与之前的方法略有不同：(1)\
  \ 与其寻找依赖于样本中所有点的全局解，不如寻找主要依赖于定义两个状态之间边界的点的局部解；(2) 与其寻找变量空间的降维并在较小空间中求解问题，不如寻找更大的空间，包括原始变量的非线性变换，使得点可以在其中完美地线性分离。\\\
  ( R^p \\) 中的超平面是维度为 \\( p - 1 \\) 的子空间，由线性方程定义\n\n```\n\\( w'x = b, \\quad (5.59)\
  \ \\)\n```\n\n其中 \\( w = (w_1, ..., w_p) \\neq 0 \\)，\\( x = (x_1, ..., x_p)' \\\
  )，且 \\( b \\) 为实数。如果超平面包含原点，其方程变为 \\( w'x = 0 \\)：所有从原点指向超平面上一点 \\( x \\) 的向量都与定义超平面的向量\
  \ \\( w \\) 正交。如果超平面不包含原点，则 \\( b \\neq 0 \\)。设 \\( x_0 \\) 为原点在超平面上的投影，则 \\( w'x_0\
  \ = b \\)。因此，我们可以将Eq. (5.59)改写为\n\n```\n\\( w'x = w'x_0 \\quad \\text{or} \\quad\
  \ w'x + w_0 = 0, \\)\n```\n\n其中 \\( w_0 = -w'x_0 \\)。一般来说，\\( R^p \\) 中的超平面将 \\\
  ( R^p \\) 划分为两个分离子空间，即 \\( w'x + w_0 > 0 \\) 和 \\( w'x + w_0 < 0 \\)。\n\n#### 5.6.2.1\
  \ 线性可分问题\n\n假设我们有一个包含 \\( n \\) 个元素的训练集 \\( \\{(y_i, x_i)\\} \\)，其中 \\( y_i \\)\
  \ 是二元分类变量，为简化起见，其可能取值为 \\( -1 \\) 和 \\( +1 \\)。如果该集合线性可分，则一组的所有观测值（例如 \\( y_i =\
  \ -1 \\) 的观测值）位于超平面的一侧，而另一组的所有点（\\( y_i = 1 \\) 的点）位于另一侧。因此，一侧的点满足 \\( w'x_i + w_0\
  \ < 0 \\)，另一侧的点满足 \\( w'x_i + w_0 > 0 \\)。此外，对于某个依赖于数据的值 \\( m \\)，存在等价关系 \\( w'x_i\
  \ + w_0 \\le -m \\) 和 \\( w'x_i + w_0 \\ge m \\)。这两个不等式可以合写为\n\n```\n\\( y_i(w'x_i\
  \ + w_0) \\ge m, \\quad \\text{for } i = 1, ..., n, \\quad (5.60) \\)\n```\n\n我们希望找到使\
  \ \\( m \\)（即组间的间隔或分离）尽可能大的超平面。图5.32说明了我们要解决的问题。在最大化问题中，必须考虑到满足Eq. (5.60)条件的超平面不是唯一的，因为任何其他超平面\
  \ \\( c(\\mathbf{w}'\\mathbf{x}_i + w_0) = 0 \\)（对任意 \\( c \\neq 0 \\)）也是解。为了确定超平面，我们定义\
  \ \\(\\mathbf{u} = \\mathbf{w}'/\\|\\mathbf{w}\\|\\)，待求解的问题为\n\nmax(m)  \nsuch that\
  \ \\(\\|\\mathbf{u}\\| = 1\\) and \\(y_i(\\mathbf{u}'\\mathbf{x}_i + w_0) \\geq\
  \ m\\). (5.61)\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_300_0.png)\n\n我们以略有不同的方式写出这个优化问题，这更容易求解。首先，请注意，点\
  \ \\(\\mathbf{x}_i\\) 到一般超平面 \\(\\mathbf{w}'\\mathbf{x} + w_0 = 0\\) 的距离是该点与其在超平面上的投影\
  \ \\(\\mathbf{x}_i(p)\\) 之间的距离。向量 \\(\\mathbf{x}_i - \\mathbf{x}_i(p)\\) 与超平面正交，因此我们可以写成\n\
  \n\\(\\mathbf{x}_i - \\mathbf{x}_i(p) = d_i\\mathbf{u},\\)\n\n其中 \\(\\mathbf{u}\\\
  ) 是与超平面正交的单位长度向量，\\(d_i\\) 是到超平面的距离。如果我们将此方程乘以 \\(\\mathbf{u}'\\)，并使用 \\(\\mathbf{x}_i(p)\\\
  ) 在超平面上，因此 \\(\\mathbf{w}'\\mathbf{x}_i(p) + w_0 = 0\\)，则\n\n\\(\\mathbf{u}'(\\\
  mathbf{x}_i - \\mathbf{x}_i(p)) = \\frac{\\mathbf{w}'}{\\|\\mathbf{w}\\|}[\\mathbf{x}_i\
  \ - \\mathbf{x}_i(p)] = \\frac{\\mathbf{w}'\\mathbf{x}_i + w_0}{\\|\\mathbf{w}\\\
  |} = d_i.\\)\n\n因此，Eq. (5.60) 的等价条件为，对于某个 \\( M \\) 值\n\n\\(y_i\\frac{(\\mathbf{w}'\\\
  mathbf{x}_i + w_0)}{\\|\\mathbf{w}\\|} \\geq M \\qquad \\text{for } i = 1, \\dots,\
  \ n\\)\n\n或\n\n\\(y_i(\\mathbf{w}'\\mathbf{x}_i + w_0) \\geq \\|\\mathbf{w}\\|M,\
  \ \\qquad \\text{for } i = 1, \\dots, n.\\)\n\n向量 \\(\\mathbf{w}\\) 的范数是任意的，但必须定义它来确定超平面。事实上，与Eq.\
  \ (5.61)相比，如果 \\(\\|\\mathbf{w}\\| = 1\\)，则 \\(M = m\\)。我们需要用这些变量中的任何一个来固定尺度，一个简单的解是取\n\
  \n\\(\\|\\mathbf{w}\\| = 1/M,\\)\n\n并且最大化距离 \\(M\\) 等同于最小化范数 \\(\\|\\mathbf{w}\\\
  |\\)。这种方法的另一个优点是我们不需要限制 \\(\\|\\mathbf{w}\\| = 1\\)，因为超平面由解完美定义。优化问题随后为\n\n\\(\\\
  min \\frac{1}{2}\\|\\mathbf{w}\\|^2,\\)  \nsubject to \\(y_i(\\mathbf{w}'\\mathbf{x}_i\
  \ + w_0) \\geq 1, \\quad i = 1, \\dots, n.\\) (5.62)\n\n这是一个带有 \\( p + 1 \\) 个变量的二次优化问题，即向量\
  \ \\(\\mathbf{w}\\) 的分量加上 \\( w_0 \\)。待最小化的函数可以用拉格朗日乘法表示为\n\n\\(F_L = \\frac{1}{2}\\\
  mathbf{w}'\\mathbf{w} - \\sum_{i=1}^n \\lambda_i[y_i(\\mathbf{w}'\\mathbf{x}_i +\
  \ w_0) - 1],\\) (5.63)\n\n\n\n其中 $\\lambda_i \\ge 0$，使得当所有点的约束条件都满足时 $F_L \\le w'w/2$，且如果对变量\
  \ $(y_j, x_j)$ 不满足约束条件 $y_i(w'x_i + w_0) \\ge 1$，则会增加 $F_L$。对 $w$ 和 $w_0$ 求导\n\n\
  $$\\frac{\\partial F_L}{\\partial w} = 0 = w - \\sum_{i=1}^n \\lambda_i y_i x_i,$$\
  \ (5.64)\n\n$$\\frac{\\partial F_L}{\\partial w_0} = 0 = \\sum_{i=1}^n \\lambda_i\
  \ y_i,$$ (5.65)\n\n并将这些方程代入公式 (5.63)，我们得到对偶问题\n\n$$F_D = \\frac{1}{2}w'w - w'w +\
  \ \\sum_{i=1}^n \\lambda_i = \\sum_{i=1}^n \\lambda_i - \\frac{1}{2} \\sum_{i=1}^n\
  \ \\sum_{j=1}^n \\lambda_i \\lambda_j y_i y_j x_i' x_j,$$ (5.66)\n\n这是一个关于 $n$ 个变量\
  \ $\\lambda_i$ 的问题，这些变量满足限制条件 $\\lambda_i \\ge 0$ 和 $\\sum_{i=1}^n \\lambda_i y_i\
  \ = 0$。它被称为对偶问题，最小化 $F_L$ 以找到定义超平面的 $p+1$ 个变量及其限制条件，等价于在满足各自限制条件的 $n$ 个变量 $\\lambda_i$\
  \ 条件下最大化 $F_D$。第二个问题更容易求解，且目标函数仅通过特征向量的标量积依赖于数据。这是一个具有二次准则和线性约束的凸优化问题，可通过标准优化方法求解。参见，例如，Hastie\
  \ et al. (2001)。\n\n还要注意，超平面由样本点之间的标量积定义，因为根据公式 (5.64) 它可以写成\n\n$$f(x) = w'x + w_0\
  \ = \\sum_{i=1}^n \\lambda_i y_i x_i' x + w_0.$$ (5.67)\n\n超平面由 $\\lambda_i > 0$\
  \ 的点定义，而 $\\lambda_i = 0$ 的点在超平面方程中不起作用。$\\lambda_i > 0$ 的点称为支持向量，并满足 $y_i(w'x_i\
  \ + w_0) = 1$。参见图 5.32。分类是根据 $w'x_i + w_0$ 的符号进行的。请注意，限制条件定义了一个由限制超平面 $w'x_i + w_0\
  \ = 1$ 和 $w'x_i + w_0 = -1$ 所界定的空间，该空间内不存在数据点。包含在这些限制超平面中的数据是支持向量，它们起着关键作用，因为如果它们被修改，分类将会改变，这一特性仅适用于支持向量。这是与\
  \ Fisher 的 LDF 或逻辑回归的重要区别。在这些方法中，对任意点的微小扰动（从 $x_i$ 到 $x_i + \\epsilon u$，其中 $\\\
  epsilon$ 很小）可能会导致分类变化。在支持向量机 (SVM) 中，这种情况会发生在靠近限制超平面的点上，但对远离两个超平面的点则没有影响。\n\n对于具有相同协方差矩阵的正态可分数据，Fisher\
  \ LDF 提供的解是最优的，但当协方差矩阵不同且数据不服从正态分布时，SVM 提供了一个有用的替代方案。通常在这些情况下，逻辑回归会提供与 SVM 类似的解。\n\
  \n#### 5.6.2.2 非线性可分问题\n\n如果数据不可线性分离，我们可以修改问题，找到一个超平面，使其在大多数数据上最大化类群间的分离，但允许少数点被错误分类。为了达到这个目的，我们为每个点引入一个变量\
  \ $\\alpha_i \\ge 0$，如果点被正确分类则该变量为零，否则为正。公式 (5.62) 的优化问题修改为\n\n$$\n\\min \\left(\
  \ \\frac{1}{2} \\|w\\|^2 + C \\sum_{i=1}^n \\alpha_i \\right) , \\tag{5.68}\n$$\n\
  \n\\[\n\\text{subject to } y_i(w'x_i + w_0) \\ge 1 - \\alpha_i, \\quad i = 1, \\\
  dots, n, \\\\\n\\alpha_i \\ge 0, \\tag{5.69}\n\\]\n\n其中需要给定参数 $C$。通常会尝试不同的值，并选择分类误差最小的那个。它也可以通过交叉验证\
  \ (CV) 获得，如第 5.4.2 节所述。拉格朗日函数为\n\n$$\nF_L = \\frac{1}{2} w'w + C \\sum_{i=1}^n \\\
  alpha_i - \\sum_{i=1}^n \\lambda_i [y_i(w'x_i + w_0) - (1 - \\alpha_i)] - \\sum_{i=1}^n\
  \ \\mu_i \\alpha_i \\tag{5.70}\n$$\n\n其中 $\\lambda_i \\ge 0$。对 $w$、$w_0$ 和 $\\alpha_i$\
  \ 求导，我们有\n\n$$\n\\frac{\\partial F_L}{\\partial w} = 0 = w - \\sum_{i=1}^n \\lambda_i\
  \ y_i x_i, \\\\\n\\frac{\\partial F_L}{\\partial w_0} = 0 = \\sum_{i=1}^n \\lambda_i\
  \ y_i, \\\\\n\\frac{\\partial F_L}{\\partial \\alpha_i} = 0 = C - \\lambda_i - \\\
  mu_i\n$$\n\n并且，将这些方程代入公式 (5.70)，我们得到对偶函数\n\n$$\nF_D = \\sum_{i=1}^n \\lambda_i -\
  \ \\frac{1}{2} \\sum_{i=1}^n \\sum_{j=1}^n \\lambda_i \\lambda_j y_i y_j x'_i x_j,\
  \ \\tag{5.71}\n$$\n\n该函数需在限制条件 $\\mu_i \\ge 0, 0 \\le \\lambda_i \\le C$ 和 $\\sum_{i=1}^n\
  \ \\lambda_i y_i = 0$ 下最大化。该问题与公式 (5.66) 类似，同样，函数 $F_D$ 以及超平面都通过标量积 $x'_i x_j$ 依赖于数据，如公式\
  \ (5.67) 所示。\n\n除了允许存在一些不可线性分离的点外，SVM 方法还可以通过增加空间维度来处理非线性。这通过引入以前特征的非线性函数作为新特征，并在该更大空间中寻找最优线性分离来实现。这种方法与经典程序所采用的方法相反，经典程序将数据投影到较小空间并使用非线性函数来分离状态。例如，在图\
  \ 5.33 中，两个组在一维空间中无法分离，但在二维空间中是线性可分的。当我们引入新变量时，重要的是要意识到，如公式 (5.66) 所示，目标函数仅依赖于观测值之间的标量积。\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_304_0.png)\n\n**Figure 5.33** 可在二维空间中线性分离但不能在一维空间中分离的两个变量。\n\
  \n因此，如果我们引入特征的非线性变换，并从变量 $\\mathbf{x} \\in R^p$ 转到一组新变量 $\\boldsymbol{h}(\\mathbf{x})\
  \ \\in R^q$，其中 $q > p$，我们需要计算标量积 $\\boldsymbol{h}(\\mathbf{x})'\\boldsymbol{h}(\\\
  mathbf{x})$。一种快速方法是使用内积核函数，它直接给出标量积。例如，多项式内积核函数是\n\n$$\nK(\\mathbf{x}_i, \\mathbf{x}'_j)\
  \ = (1 + \\mathbf{x}'_i \\mathbf{x}'_j)^d = \\boldsymbol{h}(\\mathbf{x}_i)' \\boldsymbol{h}(\\\
  mathbf{x}_j),\n$$\n\n它提供了两个向量 $\\boldsymbol{h}(\\mathbf{x}_i)'\\boldsymbol{h}(\\\
  mathbf{x}_j)$ 的标量积，该标量积包含了 $\\mathbf{x}$ 中每个 $p$ 个特征上的 $d$ 阶多项式。例如，假设 $d=2$ 和 $p=2$。那么，$\\\
  mathbf{x}_i = (x_{1i}, x_{2i})'$ 和 $\\mathbf{x}'_i \\mathbf{x}_i = x_{1i}^2 + x_{2i}^2$，且\n\
  \n$$\nK(\\mathbf{x}_i, \\mathbf{x}_i) = (1 + x_{1i}^2 + x_{2i}^2)^2 = (1 + 2x_{1i}^2\
  \ + 2x_{2i}^2 + 2x_{1i}^2 x_{2i}^2 + x_{1i}^4 + x_{2i}^4).\n$$\n\n这个内积包括原始变量中 $d=2$\
  \ 次多项式的所有项。请注意，$K(\\mathbf{x}_i, \\mathbf{x}_i)$ 是向量 $\\boldsymbol{h}(\\mathbf{x}_i)\
  \ = (1, \\sqrt{2}x_{1i}, \\sqrt{2}x_{2i}, \\sqrt{2}x_{1i}x_{2i}, x_{1i}^2, x_{2i}^2)$\
  \ 的平方范数，其中 $\\boldsymbol{h}(\\mathbf{x}_i) \\in \\mathbf{R}^6$。一般来说，$K(\\mathbf{x}_i,\
  \ \\mathbf{x}_j)$ 给出了向量 $\\boldsymbol{h}(\\mathbf{x}_i)$ 和 $\\boldsymbol{h}(\\mathbf{x}_j)$\
  \ 的标量积，包括所有直到 $d$ 阶的项。因此，如果我们使用这个核来增加特征空间的维度，超平面是\n\n$$\nf(\\boldsymbol{h}(\\mathbf{x}))\
  \ = \\boldsymbol{w}' \\boldsymbol{h}(\\mathbf{x}) + w_0 = \\sum_{i=1}^n \\lambda_i\
  \ y_i K(\\mathbf{x}_i, \\mathbf{x}) + w_0,\n$$\n\n其中现在 $\\mathbf{x} \\in \\mathbf{R}^q$\
  \ 和 $\\boldsymbol{h}(\\mathbf{x}) \\in \\mathbf{R}^q$，且需要求解的优化问题是采用新变量 $\\boldsymbol{h}(\\\
  mathbf{x}_i)$ 的公式 (5.71)，其形式为\n\n$$\n\\max F_D = \\sum_{i=1}^n \\lambda_i - \\frac{1}{2}\
  \ \\sum_{i=1}^n \\sum_{j=1}^n \\lambda_i \\lambda_j y_i y_j K(\\mathbf{x}_i, \\\
  mathbf{x}_j),\n$$\n\n$$\nC \\ge \\lambda_i \\ge 0, \\quad \\mu_i \\ge 0, \\quad\
  \ \\sum_{i=1}^n \\lambda_i y_i = 0.\n$$\n\n其他可用的内积核函数包括基于径向基、样条、傅里叶系数、Sigmoid 等的核函数（Cherkassky\
  \ and Mulier, 1998）。\n\n\n\n\n\n对于多于两个状态的情况，分类是分步进行的。在第1步，在第一个状态与其余状态之间进行分类。如果元素被分类至第一个状态，则程序停止。否则，进入第2步，在第二个状态与其余状态之间进行分类。该过程持续进行，直到元素被分类为止。\n\
  \n### 5.6.3 密度估计\n\n如果特征的密度不服从正态分布，且所考虑的特征数量 \\(p\\) 不过大，则可以使用系统之前输出的训练集来直接估计特征的分布。假设由状态\
  \ \\(s_i\\) 生成的时间序列有 \\(n_i\\) 个，总观测数为 \\(n = n_1 + \\cdots + n_c\\)。要对维度为 \\(p\\\
  ) 的点 \\(\\mathbf{x}_0\\) 进行分类，我们无需估计所有密度，只需估计该点处的密度。随后，通过最大化后验概率来进行分类，即最大化\n\n```\n\
  \\(\\max_{i \\in S} \\pi_i f(\\mathbf{x}_0 | s_i).\\)\n```\n\n在点 \\(\\mathbf{x}_0\\\
  ) 处估计给定状态密度的一种方法是：在 \\(p\\) 维空间中构建一个以 \\(\\mathbf{x}_0\\) 为中心、边长为 \\(h\\) 的超立方体，统计来自该状态并落入其中的点数\
  \ \\(n_i(\\mathbf{x}_0)\\)，并按超立方体体积内点的相对频率来估计密度，如下\n\n```\n\\(\\widehat{f}(\\mathbf{x}_0\
  \ | s_i) = \\frac{n_i(\\mathbf{x}_0)}{n_i h^p}.\\)\n```\n\n此过程与最近邻（NN）方法类似，但不是设定\
  \ \\(m\\) 个最近点的数量，而是设定带宽 \\(h\\)，并统计每个分布中有多少点落入该区间。上述规则可以写成\n\n```\n\\(\\widehat{f}(\\\
  mathbf{x}_0 | s_i) = \\frac{1}{n_i h^p} \\sum_{i=1}^n \\prod_{j=1}^p k \\left( \\\
  frac{x_{ij} - x_{0j}}{h} \\right),\\)\n```\n\n其中函数 \\(k\\) 被称为核函数，并满足\n\n```\n\\\
  (k \\left( \\frac{x_{ij} - x_{0j}}{h} \\right) = \\begin{cases} 1, & \\text{if }\
  \ |x_{ij} - x_{0j}| \\le h, \\\\ 0, & \\text{otherwise.} \\end{cases}\\)\n```\n\n\
  该密度估计器相当不规则，因为点要么进入超立方体并以值1对该点密度做出贡献，要么对密度确定毫无贡献。更好的估计器是允许点根据其到该点的距离，对给定点处的密度函数估计做出贡献，这可以通过使用根据点到目标点的距离对点的信息进行加权平均的核函数来实现。一种常用的核函数是正态或高斯核函数，由下式给出\n\
  \n```\n\\(k_G \\left( \\frac{x_{ij} - x_{0j}}{h} \\right) = \\frac{1}{\\sqrt{2\\\
  pi}} \\exp \\left[ -\\frac{1}{2} \\left( \\frac{x_{ij} - x_{0j}}{h} \\right)^2 \\\
  right].\\)\n```\n\n然后，在假设特征相互独立的情况下，我们得到所谓的朴素贝叶斯分类器，由下式给出\n\n$$\\widehat{f}^{\\\
  text{NB}}(\\mathbf{x}_0|s_i) = \\frac{1}{n_i h^p} \\sum_{l=1}^{n_i} \\prod_{j=1}^p\
  \ k_G\\left(\\frac{x_{lj} - x_{0j}}{h}\\right).$$\n\n该过程可以通过考虑变量间的依赖关系并使用正态多变量核函数来改进，从而得到：\n\
  \n$$\\widehat{f}(\\mathbf{x}_0|s_i) = \\frac{1}{n_i h^p |\\mathbf{S}_i|^{1/2}} \\\
  sum_{l=1}^{n_i} \\exp \\left\\{ - \\frac{1}{2h^2} (\\mathbf{x}_l - \\mathbf{x}_0)'\
  \ \\mathbf{S}_i^{-1} (\\mathbf{x}_l - \\mathbf{x}_0) \\right\\},$$\n\n其中 \\(\\mathbf{S}_i\\\
  ) 是状态 \\(s_i\\) 中协方差矩阵的估计值。通常，所有状态中都会使用每个状态估计矩阵的加权平均值，取相同的 \\(\\mathbf{S}_i\\) 矩阵。\n\
  \n所有核方法的问题在于，密度估计对带宽参数 \\(h\\) 的选择高度敏感，而 \\(h\\) 是未知的，但可以通过CV估计。\n\n### 示例 5.8\n\
  \n我们再次使用台湾AirBox数据及其位置。位置图表明，一些Air Box位于台北（岛屿北部，纬度 \\(\\le 22.7\\) 且经度 \\(\\le 129.5\\\
  )），另一些位于台北东南部的宜兰县（纬度 \\(\\ge 24.5\\) 且经度 \\(\\ge 121.4\\)）。利用这两个地点的序列集，我们开发了一种判别程序，用于将新的时间序列分类为来自北部（台北）或南部（宜兰）。可用于判别的变量是在示例5.1中计算的前五个自相关系数。用于判别的\
  \ **R** 命令如下，但我们未重复示例5.1和5.6中使用的命令。\n\n结果表明，自相关系数的判别能力较低。SVM中的分类错误率约为30-35%，LDF和LR略高一些。我们在SVM中尝试了其他非线性核函数，但结果相似，在本例中，SVM的非线性特性并未提供明显优势。\n\
  \n#### 用于判别分析的 R 命令：\n\n```\n> #The two groups of data, Taipei and Yilan, are obtained.\n\
  > library(caTools)\n> library(MASS)\n> library(e1071)\n> lo=as.matrix(locations032017)\n\
  > x=as.matrix(TaiwanAirBox032017)\n> #First, we build the matrix of clean data\n\
  > x=x[,-c(1,29,70)]\n> lo=lo[,-1]\n> lo=lo[-c(29,70),]\n> #Data frame with classification\
  \ variable for Taipei and Yilan.\n> i1=which(lo[,1]<22.7)\n> i2=which(lo[,2]<120.5)\n\
  > i3=sort(intersect(i1,i2))\n> x1=x[, i3]\n> i4=length(i3)\n> y1=matrix(0,i4,1)\n\
  > j1=which(lo[,1]>24.5)\n> j2=which(lo[,2]>121.4)\n> j3=sort(intersect(j1,j2))\n\
  > j4=length(j3)\n> intersect(j3,j3)\n> x2=x[, j3]\n> y2=matrix(1,j4,1)\n> y=c(y1,y2)\n\
  > xc=cbind(x1,x2)\n##The computation of ACF is similar to Examples 5.1 and 5.6.\n\
  #### The data, prepared as in Example 5.6 is in data.frame=data\n##Splitting the\
  \ data set into the Training set and Test set\n> set.seed(123)\n> split = sample.split(y,\
  \ SplitRatio = 0.65)\n> training_set = subset(data, split == TRUE)\n> test_set =\
  \ subset(data, split == FALSE)\n> training_set[,-1] = scale(training_set[,-1])\n\
  > test_set[,-1] = scale(test_set[,-1])\n#### Discrimination with Support Vector\
  \ Machine\n> svm = svm(y~training_set[,1], x=training_set[,-1],\n             type\
  \ = 'C-classification', kernel = 'sigmoid')\n> y_sv1 = predict(svm, newdata = training_set[,-1])\n\
  > misClasificError <- mean(y_sv1 != training_set[,1])\n> print(paste('Accuracy of\
  \ SVM in sample',1-misClasificError))\n[1] \"Accuracy of SVM in sample 0.7083333333333333\"\
  \n> y_sv2 = predict(svm, newdata = test_set[,-1])\n> misClasificError <- mean(y_sv2\
  \ != test_set[,1])\n> print(paste('Accuracy of SVM out of sample',1-misClasificError))\n\
  [1] \"Accuracy of SVM out of sample 0.6666666666666667\"\n#### As a reference we\
  \ present the results with LDF and LR for this data\n#### LDF and LR are computed\
  \ as in Example 5.6\n> print(paste('Accuracy of LDF in sample',1-misClasificError))\n\
  [1] \"Accuracy of LDF in sample 0.75\"\n> print(paste('Accuracy of LDF out of sample',1-misClasificError))\n\
  [1] \"Accuracy of LDF out of sample 0.705882352941176\"\n> print(paste('Accuracy\
  \ of LR in sample',1-misClasificError))\n[1] \"Accuracy of LR in sample 0.729166666666667\"\
  \n> print(paste('Accuracy of LR out of sample',1-misClasificError))\n[1] \"Accuracy\
  \ of LR out of sample 0.705882352941176\"\n```\n\n## 5.7 其他分类问题和方法\n\n通常，我们会遇到只有部分可用数据带有标签的情况。例如，我们有住院病人的体温时间系列，并知道其中一些人已通过检测确认感染COVID-19病毒，而另一些人尚未接受病毒检测。在其他情况下，我们拥有时间序列向量的演变，但可能类别或组别的标签仅在样本的一小部分中已知。此类问题被称为\
  \ _部分无监督分类_，尤其在为对象获取分类标签成本高昂时会出现。在这种情况下，我们必须结合使用聚类和判别方法来估计类别的概率，即对部分数据应用聚类分析，对另一部分应用判别模型，例如参见\
  \ Liu et al. (2002)。\n\n在其他情况下，我们拥有所有对象的数据和标签，但大多数对象属于同一类别，只有少数属于其他不常见类别。例如，在欺诈检测问题中，可能有许多正常操作，但只有少数描述欺诈。在这种情况下，分类器可能通过将所有对象分配给较大类别来最小化分类错误。这被称为不平衡分类问题，已提出多种解决方案。关于该主题的综述，参见\
  \ Ganganwar (2012)。\n\n解决此问题的第一种也是最简单的方法是使用贝叶斯方法，计算对象属于每个类别的后验概率，如Eq. (5.19)所示，并考虑先验概率。我们还可以将分类错误的后果纳入考虑，并将其作为决策问题来处理。第二种方案适用于非常大的数据集，我们可以对数据进行采样以提供更平衡的类别分布，要么通过对少数类示例进行随机过采样并随机复制，要么通过随机欠采样，移除过度代表类别中的病例。第三种方案是将问题视为异常值检测，即尝试在数据集中识别非典型事件，或识别与其余系列不典型的系列，如我们在第4章中讨论过的。\n\
  \n时间序列分类也已从功能数据分析的角度进行研究，通常使用深度概念。关于非平稳时间序列聚类的带宽深度方法，参见 Lopez-Pintado and Romo (2006)\
  \ 和 Tupper et al. (2015)。功能数据的一种常用距离是动态时序规整，它考虑按顺序取值但时间点不同的系列值之间的距离。参见 Jeong et\
  \ al. (2011)。\n\n## 练习\n\n- 1. 考虑世界股票指数。使用交叉线性相关作为不相似性度量，应用层次聚类。比较使用不同滞后数的不相似性度量所获得的结果。讨论用于选择聚类数量的不同标准。\n\
  \n- 2. 使用标准化系列之间的欧氏距离，对世界股票指数应用k-means和k-medoids进行聚类。评论所找到的聚类与练习1中获得的聚类之间的差异。\n\n\
  - 3. 考虑文件UMEdata2000_2018.csv中2000年至2019年欧盟的季度经济系列。比较使用系列单变量属性（例如前五个自相关系数）之间的不相似性度量进行层次聚类的结果，以及使用交叉相关的结果。\n\
  \n- 4. 按照示例5.7的分析，对五个EEG数据文件进行判别。对文件EEGsetB.csv、EEGsetC.csv和EEGsetE.csv中的数据应用类似分析。选择在癫痫发作个体和健康个体之间对五个文件进行分类的最佳方式，并使用A至E五个文件比较不同的判别方法。\n\
  \n- 5. 应用SVM对文件EEGsetA.csv与EEGsetB.csv、EEGsetC.csv、EEGsetD.csv和EEGsetE.csv中的数据进行判别，以便对健康个体或癫痫患者的结果进行分类。\n\
  \n\n\n\n6. 使用示例 5.5 中的台湾 AirBox 数据，比较使用 ACF 获得的聚类结果和使用对该序列进行 AR 拟合所得系数的聚类结果。\n\n\

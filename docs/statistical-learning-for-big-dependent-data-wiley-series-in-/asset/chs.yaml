  \  ## x-axis for plotting\n> plot(tdx,yp/10,xlab='year',ylab='rate',ylim=c(2.3,11),pch='o',cex=0.6)\n\
  > lines(tdx,y1/10,col=\"red\")\n> lines(tdx,y3/10,col=\"blue\")\n```\n\n```\n###\
  \ Below is the R script of rnnStream\n\"rnnStream\" <- function(z,h=25,nfore=200){\n\
  ### z: input in integer values\n### h: number of lags used as input\n### nfore:\
  \ data points in the testing subsample.\nif(!is.integer(z))z=as.integer(z)\nist\
  \ <- h+1\nnT <- length(z)\ny <- c( z[ist:nT] )\nX <- NULL\nfor (i in 1:){\n```\n\
  \n\n\n\n\n```r\nzz <- z[(ist-i) : (nt-i)]\nX <- cbind(X,zz)\n}\n### convert to binary\n\
  nobe <- length(y)\norig <- nobe-nfore\nyp <- y[(orig+1):nobe]\nyfit <- y[1:orig]\n\
  s <- NULL\nfor (i in 1:h){\n  x1 <- int2bin(X[1:orig,i],length=8)\n  s <- c(s,c(x1))\n\
  }\nXfit <- array(s,dim=c(orig,8,h))\nYfit <- int2bin(yfit,length=8)\nYfit <- array(Yfit,dim=c(orig,8,1))\n\
  ##\ns <- NULL\nfor (i in 1:h){\n  x2 <- int2bin(X[(orig+1):nobe,i],length=8)\n \
  \ s <- c(s,c(x2))\n}\nXp <- array(s,dim=c(nfore,8,h))\nrnnStream <- list(Xfit=Xfit,Yfit=Yfit,yp=yp,Xp=Xp,X=X[1:orig,],\n\
  \                  yfit=yfit,newX=X[(orig+1):nobe,])\n}\n```\n\n### 示例 8.5\n\n在本示例中，我们也使用美国月度失业率序列。唯一的区别是，我们将新可用的\
  \ 2020 年 3 月 1 日数据添加到该序列中。与之前一样，我们保留最后 200 个观测值用于样本外预测比较，并将 AR(13) 模型用作比较的基准模型。因此，训练样本包含\
  \ 654 个观测值。在此特定实例中，我们尝试了多个 NN 模型，包括 (a) 13-64-32-1 NN、(b) 13-32-16-1 NN、(c) 13-16-4-1\
  \ NN 和 (d) 13-8-2-1 NN，其中 N1-N2-N3-1 表示网络具有 N1 个输入变量、第一个隐藏层有 N2 个神经元、第二个隐藏层有 N3\
  \ 个神经元，以及输出层有一个神经元。在本研究中，我们为隐藏层使用 ReLU 激活函数，为输出层使用线性激活函数 f(x) = x。同样，我们使用均方误差作为损失函数。对于每个\
  \ NN 模型，训练设置为 500 个时代，但我们也采用了早停函数，如果损失函数的值下降不多，则提前停止。图 8.11 显示了 13-8-2-1 NN 的平均绝对误差随时代的变化。同时给出了训练和验证结果。在此，验证在每个时代使用训练数据的\
  \ 20%。图显示训练的收敛相当迅速。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_468_0.png)\n\n图\
  \ 8.11 通过 keras 包对美国月度失业率进行 13-8-2-1 NN 训练的收敛情况。\n\n### 表 8.1 月度美国失业率各 NN 模型的样本外表现\n\
  \n| 模型 | RMSE | MAE | MedAE | NP |\n|---|---|---|---|---|\n| 13-64-32-1 | 0.314\

  \n指定 TFM 阶数的一种替代方法是使用信息准则。时滞 b 相对容易识别。对于给定的 b，阶数 (r, s) 可以通过任意信息准则（如赤池信息准则（AIC）或贝叶斯信息准则（BIC））在某些预设的上界\
  \ (r_max, s_max) 下选择，参见第 2.8.4 节。\n\n### 示例 3.1\n\n为演示 TF 建模，我们考虑一个玩具示例。数据包括一家公司\
  \ 36 个月的销售和广告支出观测值；参见 Abraham and Ledolter (1983) 和 Blattberg and Jeuland (1981)。数据存储在文件\
  \ advertising-and-sales-data.csv 中。图 3.2 显示了数据的时间图，从中可以看出销售大致遵循广告支出。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_137_0.png)\n\
  \n图 3.2 一家公司 36 个月的销售和广告支出（单位：千）的时间图。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_138_0.png)\n\
  \n对样本偏自相关函数的简单检查表明，AR(1) 模型足以描述广告支出。拟合模型为\n\n\\( (1 - 0.3417B)(x_t - 27.95) = b_t,\
  \ \\quad \\sigma_b^2 = 303.7, \\quad (3.10) \\)\n\n其中，$x_t$ 表示每月广告支出。遵循传递函数模型（TFM）的建模程序，我们计算预白化销售序列\n\
  \n\\( \\tilde{y}_t \\equiv= (1 - 0.3417B)y_t, \\quad (3.11) \\)\n\n其中，$y_t$ 是每月销售。令\
  \ $z_t = (\\tilde{y}_t, b_t)'$ 为数据的预白化双变量序列。图 3.3 显示了 $z_t$ 的交叉相关矩阵图。特别感兴趣的是图 3.3\
  \ 的右上图和左下图。右上图显示 $\\tilde{y}_t$ 对 $b_t$ 滞后值的依赖，而左下图显示 $b_t$ 对 $\\tilde{y}_t$ 滞后值的依赖。从图中可以放心地看到，销售依赖于广告支出的滞后值，但广告支出不依赖于销售的滞后值。这证实了两个时间序列之间的\
  \ TF 关系。利用预白化的特性，右上图还显示前两个冲激响应权重在统计上显著，但所有更高阶权重不显著。因此，图表明 \\(b=0, r=0\\) 和 \\(s=1\\\
  )。\n\n表 3.3 提供了预白化序列的角形法。使用 \\(2/\\sqrt{36} \\approx 0.33\\) 作为粗略阈值，表表明第 3 行及以后的所有条目均不显著，确认了\
  \ \\((b, r, s) = (0, 0, 1)\\) 的选择。拟合 TFM 为\n\n\\( y_t = 16.91 + 0.12x_t + 0.14x_{t-1}\
  \ + \\frac{1}{1 - 0.497B}e_t, \\quad (3.12) \\)\n\n其中，所有估计值在 5% 水平上均显著，$e_t$ 是残差序列。由于残差中不存在序列相关性（Ljung-Box\
  \ 统计量 \\(Q(12) = 5.57\\)），该模型拟合数据良好。\n\n\n\n\n\n### TABLE 3.3 示例 3.1 中销售和广告支出预白化序列的角法表\n\

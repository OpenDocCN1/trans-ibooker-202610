  > plot(m2,line=TRUE)\n```\n\n## 7.5 偏最小二乘法\n\n偏最小二乘（PLS）回归由 H. Wold (1966) 提出，并在许多科学领域得到广泛应用，尤其是在计量化学（即计算化学）中。Geladi\
  \ 和 Kowalski (1986) 提供了一个教程，Abdi (2003) 对 PLS 作了很好的介绍。Ng (2013) 从算法角度考察了 PLS。与 PCR\
  \ 类似，PLS 也解决了 \\(X'X\\) 矩阵的奇异性问题，但它可以处理多元因变量。因此，在本节中，我们将 \\(Y\\) 视为一个 \\(n \\times\
  \ m\\) 数据矩阵。PLS 回归的目标是从 \\(X\\) 预测 \\(Y\\) 并描述它们的共同结构。对于熟悉多元统计分析的读者，PLS 可以被视为 \\\
  (Y\\) 和 \\(X\\) 的典型相关分析与 PCR 之间的一种方法。与寻求正交变换以尽可能多地解释 \\(X\\) 方差的 PCR 不同，PLS 寻找与\
  \ \\(Y\\) 也相关的 \\(X\\) 的线性组合。具体而言，PLS 寻求一组线性变换，对 \\(X\\) 和 \\(Y\\) 进行同时分解，使得这些变换后的成分尽可能多地解释\
  \ \\(X\\) 和 \\(Y\\) 之间的协方差。从数学上讲，PLS 可表述如下：\n\n\\[\nX = OP' + \\eta, \\tag{7.38}\n\
  \\]\n\\[\nY = UQ' + E, \\tag{7.39}\n\\]\n\n其中 \\(\\eta\\) 和 \\(E\\) 表示误差项，且可理解为它们可以为零。与\
  \ PCR 情况类似，\\(O\\) 和 \\(U\\) 是得分矩阵，\\(P\\) 和 \\(Q\\) 是载荷矩阵。P 随后考虑 \\(U\\) 与 \\(O\\\
  ) 之间的线性回归。PLS 的思想是执行等式 (7.38) 和 (7.39) 中的分解，以最大化 \\(X\\) 和 \\(Y\\) 之间的协方差。直观上，在执行分解时必须相互考虑彼此的信息。为了进一步了解，值得考虑等式\
  \ (7.34) 中 PCR 的谱分解。该分解可以通过一种称为 *非线性迭代偏最小二乘*（NIPALS）算法的迭代方法实现，该方法类似于用于获取正定矩阵特征值和特征向量的幂法。令\
  \ **_p_** 为等式 (7.34) 载荷矩阵 **_P_** 的一列，**_o_** 为其对应的得分向量。从特征值-特征向量分析中，我们有\n\n\\[\n\
  X'Xp = \\lambda p\n\\]\n\n令\n\n\\[\no = Xp\n\\]\n\n我们有\n\n\\[\np = \\frac{1}{\\\
  lambda} X'o\n\\]\n\n### _X_ 的 NIPALS 算法：\n\n- I. 初始化：令 **_o_** 为任意 _n_ 维向量，例如 _X_\
  \ 的任意一列。\n- II. 令 $p = X'o / ||X'o||$，\n- III. 更新 $o = Xp$，\n\n其中 \\(\\|x\\|\\)\
  \ 表示 _x_ 的欧几里得范数。迭代步骤 II 和步骤 III，直到 **_o_** 收敛。换句话说，算法从 **_o_** 的初始值开始，然后应用等式 (7.42)\
  \ 更新 **_p_**，再使用等式 (7.41) 更新 **_o_**。当发生收敛时，得到第一个主成分 **_p_**<sub>1</sub> 及其相关得分\
  \ **_o_**<sub>1</sub>。要找到后续成分，令 $Y = X - o_1p'_1$ 并重复该算法。\n\n该算法也适用于 _Y_ 的主成分分析，以获得等式\
  \ (7.39) 的得分矩阵 **_U_** 和载荷矩阵 **_Q_**。随后的问题是如何在 _X_ 和 _Y_ 之间相互获取信息以实现 PLS 的目标。一个简单的想法是在更新中交换\
  \ **_o_** 和 **_u_**。得到的 NIPALS 算法如下：\n\n### NIPALS 算法：\n\n- 1. 初始化：令 **_u_** 为任意起始向量，例如\
  \ **_u_** 为 _Y_ 的任意一列。\n- 2. 循环：\n  - * $p = X'u / ||X'u||$，\n  - * $o = Xp$，\n\
  \  - * $q = Y'o / ||Y'o||$，\n  - * $u = Yq$。\n- 3. 直到 **_o_** 收敛。\n\n如果 _Y_ 是向量，可以设置\
  \ $q = 1$ 并省略循环的最后两个步骤。该算法给出第一组 PLS 成分和载荷。对于后续成分和载荷，我们定义\n\n\\[\nX = X - op', \\\
  quad Y = Y - uq',\n\\]\n\n并重复该算法。\n\n经过 $r$ 次迭代后，我们得到两个 $n \\times r$ 矩阵 $\\mathbf{O}$\
  \ 和 $\\mathbf{U}$ 以及两个载荷矩阵 $\\mathbf{P}$ 和 $\\mathbf{Q}$。然后通过线性回归将 $\\mathbf{Y}$\
  \ 与 $\\mathbf{X}$ 关联：\n\n\\[\n\\mathbf{U} = \\mathbf{O}\\boldsymbol{\\beta} + \\\
  boldsymbol{\\epsilon},\n\\]\n\n其中 $\\boldsymbol{\\epsilon}$ 表示误差项。$\\mathbf{Y}$\
  \ 的拟合值随后为\n\n\\[\n\\widehat{\\mathbf{Y}} = \\widehat{\\mathbf{U}}\\mathbf{Q}' =\
  \ \\mathbf{O}\\widehat{\\boldsymbol{\\beta}}\\mathbf{Q}' = \\mathbf{X}\\mathbf{P}\\\
  widehat{\\boldsymbol{\\beta}}\\mathbf{Q}', \\quad (7.43)\n\\]\n\n其中使用了 PCA 的 $\\\
  mathbf{O} = \\mathbf{XP}$。\n\n为了了解 NIPALS 算法，请考虑\n\n\\[\n\\mathbf{p} = \\mathbf{X}'\\\
  mathbf{u}/\\|\\mathbf{X}'\\mathbf{u}\\|\n\\]\n\\[\n= \\mathbf{X}'\\mathbf{Y}\\mathbf{q}/\\\
  |\\mathbf{X}'\\mathbf{Y}\\mathbf{q}\\|\n\\]\n\\[\n= \\mathbf{X}'\\mathbf{Y}\\mathbf{Y}'\\\
  mathbf{o}/\\|\\mathbf{X}'\\mathbf{Y}\\mathbf{Y}'\\mathbf{o}\\|\n\\]\n\\[\n= \\mathbf{X}'\\\
  mathbf{Y}\\mathbf{Y}'\\mathbf{X}\\mathbf{p}/\\|\\mathbf{X}'\\mathbf{Y}\\mathbf{Y}'\\\
  mathbf{X}\\mathbf{p}\\|\n\\]\n\\[\n= \\frac{1}{\\lambda}(\\mathbf{Y}'\\mathbf{X})'(\\\
  mathbf{Y}'\\mathbf{X})\\mathbf{p}. \\quad (7.44)\n\\]\n\n显然，$\\mathbf{p}$ 是 $\\\
  mathbf{Y}'\\mathbf{X}$ 的样本协方差矩阵的特征向量。等式 (7.44) 中的算法正是幂法中用于计算对称矩阵 $\\mathbf{X}'\\\
  mathbf{Y}\\mathbf{Y}'\\mathbf{X}$ 最大特征值-特征向量的更新规则。\n\n除了 NIPALS 算法外，还有其他可用于计算 PLS\
  \ 回归的方法。例如，参见 de Jong (1993)。Helland (1990) 从预测角度对 PLS 进行了解释，当 $\\mathbf{Y}$ 是标量因变量时，这很容易遵循。\n\
  \n### PLS 算法 1：（PLS1）\n\n- 1. 定义 $\\mathbf{X}$ 残差 $\\boldsymbol{\\eta}_0$ 和 $y$\
  \ 残差 $\\mathbf{f}_0$ 的初始值：\n\n\\[\n\\boldsymbol{\\eta}_0 = \\mathbf{X} - \\boldsymbol{\\\
  mu}_x,\n\\]\n\\[\n\\mathbf{f}_0 = \\mathbf{Y} - \\boldsymbol{\\mu}_y,\n\\]\n\n其中\
  \ $\\boldsymbol{\\mu}_X$ 表示由 $\\mathbf{x}_t$ 的均值向量组成的矩阵，$\\mu_y$ 是由因变量 $y_{t+h}$\
  \ 的均值组成的向量。换句话说，$\\boldsymbol{\\eta}_0$ 和 $\\mathbf{f}_0$ 是均值调整后的 $\\mathbf{X}$\
  \ 和 $\\mathbf{Y}$。\n\n对于 $i = 1, 2, \\dots$，执行以下步骤 2 至 4：\n\n- 2. 引入 $\\mathbf{X}$\
  \ 得分 $\\mathbf{o}_i$，作为 $\\mathbf{X}$ 残差 $\\boldsymbol{\\eta}_{i-1}$ 的线性组合，使用 $\\\
  boldsymbol{\\eta}_{i-1}$ 与 $\\mathbf{f}_{i-1}$ 之间的协方差作为权重：\n\n\\[\n\\mathbf{o}_i\
  \ = \\boldsymbol{\\eta}'_{i-1}\\mathbf{w}_i, \\quad \\text{with } \\mathbf{w}_i\
  \ = \\text{Cov}(\\boldsymbol{\\eta}_{i-1}, \\mathbf{f}_{i-1}).\n\\]\n\n- 3. 通过最小二乘法确定\
  \ $\\mathbf{X}$ 载荷 $\\mathbf{p}_i$ 和 $\\mathbf{Y}$ 载荷 $\\mathbf{q}_i$：\n\n\\[\n\\\
  mathbf{p}_i = \\text{Cov}(\\boldsymbol{\\eta}_{i-1}, \\mathbf{o}_i)/\\text{Var}(\\\
  mathbf{o}_i),\n\\]\n\\[\n\\mathbf{q}_i = \\text{Cov}(\\mathbf{f}_{i-1}, \\mathbf{o}_i)/\\\
  text{Var}(\\mathbf{o}_i).\n\\]\n\n即，对 $\\mathbf{o}_i$ 回归 $\\boldsymbol{\\eta}_{i-1}$\
  \ 和 $\\mathbf{f}_{i-1}$ 以获得最小二乘估计。\n\n\n\n\n\n### 4. 寻找新的残差：\n\n```\n\\(\\eta_i\
  \ = \\eta_{i-1} - o_i p'_i, \\quad f_i = f_{i-1} - o_i q'_i.\\)\n```\n\n从步骤 1 和\
  \ 4 可以清楚地看出，该算法在每一步 m 都给出了两种表示\n\n```\n\\(X = \\mu_X + p_1 o'_1 + \\cdots + p_m\
  \ o'_m + \\eta_m, \\quad Y = \\mu_Y + q_1 o'_1 + \\cdots + q_m o'_m + f_m. \\quad\
  \ (7.45)\\)\n```\n\n从最小二乘回归的性质来看，根据步骤 3 和 4 可以清楚地看出，残差 \\(\\eta_i\\) 与 \\(o_i\\\
  ) 不相关，因此得分 \\(o_1, \\dots, o_m\\) 也不相关。此外，可以证明权重 \\(w_1, \\dots, w_m\\) 也不相关。从算法中也可以清楚地看出，**_Y_**\
  \ 与残差 \\(\\eta_i\\) 之间的线性依赖关系被用来构建得分 **_X_**，然后用于预测 **_Y_**。\n\n最后，有多个 R 包可用于 PLS\
  \ 回归。包 **pls** 和 **plsdepot** 提供 PLS 分析。**plsdof** 考虑 PLS 的自由度，**plsRglm** 给出广义线性模型的\
  \ PLS 分析，而 **plsVarSel** 提供 PLS 的变量选择。\n\n### 示例 7.7\n\n同样，考虑月度宏观数据集，以美国工业生产指数（IPI）的月度增长率作为因变量，所有变量的前六个滞后值作为预测变量，如我们在示例\
  \ 7.5 和 7.6 中所做的那样。将 PLS 成分的最大数量设置为 30 并使用交叉验证，如果使用观测到的预测变量，则 PLS 回归为该数据选择 _m_ =\
  \ 5。参见图 7.23。PLS 回归的摘要表明，使用 30 个成分时，模型解释了约 54% 的 IPI 增长率的方差。图 7.24 显示了带有 30 个成分的\
  \ PLS 的交叉验证预测。图中的直线表示目标线。该图显示，带有 30 个成分的 PLS 回归提供了合理的拟合。如果对 732 个预测变量进行标准化，带有交叉验证的\
  \ PLS 回归会选择一个 PLS 成分。\n\n### PLS 的 R 演示：使用包 pls.\n\n```\n> da <- read.csv(\"FREMDApril19.csv\"\

- "# 8 大规模依赖数据的机器学习\n\n分类与判别分析是具有众多应用的有用统计工具，如第 5 章所示。它们在传统统计分析和现代机器学习中都被广泛使用。在某些情况下，它们作为简单的统计工具，利用现代计算能力高效处理大型数据集。在本章中，我们关注不仅在预测，而且在分类与判别分析方面都有用的统计学和机器学习方法。在第一部分，介绍了基于树的方法，包括分类与回归树（CART）和随机森林（RF）。这些统计方法本质上是非参数的。它们不对研究数据假设任何特定的统计模型。相反，它们使用递归划分来探索数据集中隐藏的结构。CART\
  \ 在统计文献中有着悠久的历史。参见 Breiman et al. (1984)。随着集成学习的进步，CART 由 Breiman (2001) 进一步扩展为\
  \ RF。近年来，有关贝叶斯 CART 和贝叶斯加法回归树（BART）的文章众多。例如，参见 Chipman et al. (2010) 以及 He et al.\
  \ (2018) 对 BART 的近期改进。\n\n机器学习或人工智能（AI）当今很流行。它利用大数据（主要来自物联网）的可用性、优化方法的进步以及强大的计算机来处理信息以辅助决策。其目标是让机器（或一组计算机算法）像人脑一样思考和行动。深度学习（DL）是机器学习的一部分。它通常采用具有多层的复杂神经网络（NN）来提取数据中嵌入的有用信息。基本上，DL\
  \ 机器包含四个部分：（1）用于训练和验证的大型数据集，（2）定义良好的损失函数（或成本函数或目标函数），（3）高效或可行的优化程序，以及（4）一个模型\n\n\
  \n\n(或深层网络结构)。在本章第二部分，我们讨论NN和DL的一些基本概念，并使用因变量数据演示它们的应用。这些方法是半参数统计模型，因为NN通常由一些复杂的模型组成，由激活函数的层构成，包含许多未知参数，在机器学习文献中称为偏置和权重。有关DL的更多细节，读者可参阅Schmidhuber\
  \ (2015)和Goodfellow et al. (2016)等文献。\n\n## 8.1 回归树与随机森林\n\n基于树的方法在机器学习和决策中被广泛使用。它们使用递归分区和简单模型来探索数据的结构。这些树通常称为CART（分类和回归树），由Breiman\
  \ et al. (1984)提出。我们首先解释它们在回归中的应用，其次是分类中的应用。对于预测，这些方法本质上将预测器空间划分为不重叠的子区域，并使用每个子区域中因变量的样本均值（或多数投票）作为其预测。可以将具有多个预测器的回归树视为多元阶梯函数。应用回归树的关键问题是找到高效的方法来划分预测器空间，以最小化训练样本中的平方预测误差之和（或误分类率）。\n\
  \n我们从二叉树开始，讨论生长和修剪回归树的方法。在文献中，树的大小通常指分区的数量，或预测器空间中生成的子区域数量。树的起点表示整个预测器空间，即没有分区，对于给定数据集，最大的树对应于每个数据点都成为叶子的树。对于预测，最小的树意味着使用样本均值进行预测，而最大的树意味着使用单个数据点进行预测。因此，最小的树和最大的树在实践中都不实用。为了使基于树的方法有用，需要选择一棵合适的树，当解释变量取值于预测器空间的定义区域时，使用响应变量的条件均值进行预测。为此，我们需要讨论生长和修剪回归树的方法。\n\
  \n### 8.1.1 生长树\n\n考虑数据\\(\\{(x_t, y_t)|t=1, ..., n\\}\\)，其中\\(x_t = (x_{1t}, ...,\
  \ x_{kt})'\\)是预测器\\(X_t\\)的一个实现，\\(y_t\\)是因变量\\(Y_t\\)的一个实现。在本章中，我们遵循传统的统计文献，使用\\\
  (n\\)表示样本量。_回归树_通常是一个二叉树，通过生长和修剪分支来更好地描述\\(Y_t\\)和\\(X_t\\)之间的关系。例如，参见图8.1。它包含一个主干（或树干）、几个分支（或节点）和许多叶子。叶子称为_终端节点_，每个分支对预测器空间进行一次分割。在主干处，预测器空间是\\\
  (R^k\\)，即空间中没有分割。对于第\\(i\\)个预测器\\(x_{it}\\)，设\\(x_{i(1)} \\le x_{i(2)} \\le \\cdots\
  \ \\le x_{i(n)}\\)为其顺序统计量。任何实数\\(\\eta \\in [x_{i(1)}, x_{i(n)}]\\)将\\(R^k\\)划分为以下两个子区域：\n\
  \n```\n\\(R_{i,1} = \\{x_t | x_{it} \\le \\eta\\}, \\quad R_{i,2} = \\{x_t | x_{it}\
  \ > \\eta\\}.\\)\n```\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_442_0.png)\n\n\
  **图8.1** 美国IP指数月增长率的回归树。共有732个预测器。\n\n可以计算分区的\\(y_t\\)残差平方和为\n\n```\n\\(SS(i, \\\
  eta) = \\sum_{x_t \\in R_{i,1}} (y_t - \\bar{y}_1)^2 + \\sum_{x_t \\in R_{i,2}}\
  \ (y_t - \\bar{y}_2)^2,\\)\n```\n\n其中\\(\\bar{y}_1\\)和\\(\\bar{y}_2\\)分别是\\(y_t\\\
  )在\\(R_{i,1}\\)和\\(R_{i,2}\\)中的样本均值。在实践中，\\(\\eta\\)取\\(x_{it}\\)的顺序统计量，最佳分区由以下方式选择：\n\
  \n```\n\\(\\hat{\\eta}_i = \\arg \\min_{\\eta \\in \\{x_{(i1)}, \\dots, x_{(in)}\\\
  }} SS(i, \\eta),\\)\n```\n\n其中下标\\(i\\)表示分区基于第\\(i\\)个预测器。得到的平方预测误差之和为\\(SS(i, \\\
  hat{\\eta}_i)\\)。然后树的第一个分支由第\\(i_1\\)个预测器及其阈值\\(\\hat{\\eta}_{i_1}\\)确定，其中\\(i_1\\\
  )由以下给出：\n\n```\n\\((i_1, \\hat{\\eta}_{i_1}) = \\arg \\min_{1 \\le i \\le k} SS(i,\
  \ \\hat{\\eta}_i),\\)\n```\n\n相关的两个子区域是\\(R_{i_1,1}\\)和\\(R_{i_1,2}\\)。因此，第一次分割以两个叶子结束，即\\\
  (R_{i_1,1}\\)和\\(R_{i_1,2}\\)。\n\n接下来，对\\(R_{i_1,1}\\)和\\(R_{i_1,2}\\)分别重复生长过程。对\\\
  (R_{i_1,1}\\)的唯一修改是\\(x_{i_1,t}\\)仅取小于或等于\\(\\hat{\\eta}_{i_1}\\)的值。对\\(R_{i_1,2}\\\
  )，\\(x_{i_1,t}\\)取大于\\(\\hat{\\eta}_{i_1}\\)的值。在理论上，这个生长过程可以持续到每个子区域包含单个观测值（或少量预设数据点）。但这样完全生长的树会导致过拟合，在实践中并不有用。用于避免回归树过拟合的方法称为_修剪_，我们将在下一节讨论。需要注意的是，生长树存在一些变体。例如，可以不使用顺序统计量进行分区，而是随机选择每个预测器的一些值来进行分区。\n\
  \n### 8.1.2 修剪\n\n二叉回归树的分割数称为树的*深度*。对于深度大于零的情况，叶子（或终端节点）的数量等于树的深度加一，通常称为树的大小。用$T_m$表示深度为m的给定树。它将预测器空间$R^k$划分为$m+1$个子区域，表示为$\\\
  {R_j|j = 1, ..., m + 1\\}$，为简化起见，分割中使用的预测器被省略。$T_m$的平方预测误差之和为\n\n```\n$$SS(T_m)\
  \ = \\sum_{j=1}^{m+1} \\sum_{x_t \\in R_j} (y_t - \\bar{y}_j)^2,$$\n```\n\n其中$\\\
  bar{y}_j$表示$y_t$在$R_j$中的样本均值，即当解释变量属于$R_j$时响应变量的观测条件均值。要修剪树，通常采用复杂度代价准则\n\n```\n\
  $$C(T_m, \\lambda) = SS(T_m) + \\lambda |T_m|,$$\n```\n\n其中$|T_m|$表示树的大小，$\\lambda\
  \ > 0$是惩罚参数，用于权衡树的复杂度与拟合优度。在实践中，$\\lambda$可以通过交叉验证或样本外预测来选择。对于给定的$\\lambda$，通过以下方式选择树：\n\
  \n```\n$$T_{\\hat{m}} = \\arg \\min_m C(T_m, \\lambda).$$\n```\n\n显然，较大的$\\lambda$倾向于更小的树，$\\\
  lambda = 0$对应允许的最大树。\n\nR包**tree**和**rpart**可用于执行回归和分类的基于树的方法。我们在下面的演示中使用**tree**。\n\
  \n### 8.1.3 分类树\n\n当目标是将新观测值分类为G个可能的类别时，分割标准修改如下。在第一次分割中，与之前一样，对于每个预测器$x_{it}$，我们寻找一个实数$\\\
  eta \\in [x_{i(1)}, x_{i(n)}]$，根据某些标准将数据以最优方式分类。在接下来的分区中，我们继续分割每个子样本，类似于回归树，但现在使用为最优分类选择的标准。这个最优标准可以用几种方式定义。第一种是通过最小化错误分类的观测比例。因此，在每个分区$R_j$中，选择$\\\
  eta$的值以产生最小比例的分类错误：\n\n```\n$$p_{j\\hat{g}} = \\arg \\max_g p_{j,g},$$\n```\n\n\
  其中$p_{j,g}$，对于$g = 1, ..., G$，是分区中属于类别g的观测比例，分类是将分区中的所有观测归类为更频繁的类别。那么，分区j的分类错误比例将为：\n\
  \n```\n$$CE_j = 1 - p_{j\\hat{g}}.$$\n```\n\n另一个标准是最小化分类错误的平均比例。每个类别的相对误差$1 - p_{j,g}$，由观测的比例加权\n\
  \n\n\n在类中，$p_{jg}$，其中 $\\sum_{g=1}^G p_{j,g} = 1$。该平均值称为划分的基尼指数，定义为\n\n$Gini_j =\
  \ \\sum_{g=1}^G p_{j,g}(1-p_{j,g}).$\n\n类似的准则是最小化交叉熵或偏差，或节点的不纯度，定义为\n\n$Ent_j =\
  \ - \\sum_{g=1}^G p_{j,g} \\log p_{j,g}.$ (8.3)\n\n不难看出，当划分导致各组中观测值的比例相等且 $p_{j,g}\
  \ = 1/G$ 时，节点处的熵取得最大值。如果划分没有分类错误，且对每个组 $g$，要么 $p_{j,g} = 1$ 要么 $p_{j,g} = 0$，则熵取得最小值。当然，只有当待划分的子样本仅包含来自两个组的观测值时，才能达到这个最小值。注意，当\
  \ $x$ 很小时，$\\log(1-x) \\approx -x$，熵准则与基尼指数相似。两个准则均可微分，也是实践中最常用的准则。树的剪枝与之前一样，但在公式\
  \ (8.2) 中使用这些最优分类准则之一，而不是 $SS(T_m)$。\n\n### 示例 8.1\n\n再次考虑示例 7.1 中的美国月度宏观经济数据，但使用工业生产（IP）增长率作为因变量。预测变量由所有\
  \ 122 个变量的滞后 1 期到滞后 6 期的值组成。为了便于图形显示，我们对预测变量进行标准化。基于树的方法选择了一棵具有 20 个叶子（终端节点）的树，残差平均偏差（即平方误差）为\
  \ $2.52 \\times 10^{-5}$。用于分割的 19 个预测变量如下面的 R 演示所示。第一次分割基于第 33 个预测变量的滞后 1 期值，阈值为\
  \ -1.173。输出显示，在根节点处，有 704 个观测值，偏差为 $3.88 \\times 10^{-2}$，样本均值为 0.002163。另外，第一个叶子有\
  \ 5 个观测值，偏差为 $1.128 \\times 10^{-4}$，样本均值为 -0.01439。图 8.1 显示了所选回归树。\n\n### R 演示：回归树\n\

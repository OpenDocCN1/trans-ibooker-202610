  \n## 9.2 空间过程和数据分析\n\n分层模型（HM）是空间数据分析的一种有用统计框架。参见Cressie and Wikle (2011)。在HM框架下，数据是从具有噪声的底层空间过程观测得到的。然后空间过程取决于带有一些未知参数的一些协变量，并遵循一个明确指定的分布函数。然后可以通过贝叶斯分析或常规最大似然方法进行统计推断。有关更多详情，请参见下文。\n\
  \n令\\(D \\subset R^d\\)为感兴趣的\\(R^d\\)中的区域，空间过程为\\(\\{Y(\\boldsymbol{s}) | \\boldsymbol{s}\
  \ \\in D \\}\\)。区域\\(D\\)称为\\(Y(\\boldsymbol{s})\\)的域。假设在已知位置\\(\\{\\boldsymbol{s}_1,\
  \ \\dots, \\boldsymbol{s}_m \\}\\)处观测到带噪声的观测值，数据模型为\n\n```\nZ(\\boldsymbol{s}_i)\
  \ = Y(\\boldsymbol{s}_i) + \\epsilon(\\boldsymbol{s}_i), \\quad i = 1, \\dots, m,\
  \ \\qquad (9.1)\n```\n\n其中\\(\\epsilon(\\boldsymbol{s})\\)是\\(\\boldsymbol{s} \\\
  in D\\)上的白噪声过程，且与\\(Y(\\boldsymbol{s})\\)独立。通常，白噪声意味着\\(E[\\epsilon(.)] = 0\\)，\\\
  (\\text{Var}[\\epsilon(.)] = \\sigma_\\epsilon^2 > 0\\)，且若\\(\\boldsymbol{s}_1 \\\
  neq \\boldsymbol{s}_2\\)，则\\(\\text{Cov}[\\epsilon(\\boldsymbol{s}_1), \\epsilon(\\\
  boldsymbol{s}_2)] = 0\\)。\\(\\epsilon(\\boldsymbol{s})\\)过程可被视为测量误差。令\\(\\boldsymbol{Z}\
  \ = \\{ z(\\boldsymbol{s}_i) | i = 1, \\dots, m \\}\\)为数据集。在地统计学中，一个重要的问题是基于平方误差，在已知位置\\\
  (\\boldsymbol{s}_0\\)处获取\\(Y(\\boldsymbol{s}_0)\\)的最优空间预测值。\n\n\n\n\n\n损失和数据 \\\
  (\\mathbf{Z}\\)。最优预测器是 \\(E[Y(\\mathbf{s}_0)|\\mathbf{Z}]\\)。在某些特殊情况下，人们可能对 \\(E[Z(\\\
  mathbf{s}_0)|\\mathbf{Z}]\\) 感兴趣。注意 \\(E[Y(\\mathbf{s}_0)|\\mathbf{Z}] = E[Z(\\\
  mathbf{s}_0)|\\mathbf{Z}]\\)，但这两个条件期望具有不同的性质，且用途不同。\n\n在讨论数据分析之前，我们先介绍空间过程 \\(Y(\\\
  mathbf{s})\\) 的一些基本概念，其中 \\(\\mathbf{s} \\in D \\subset R^d\\)，且假设 \\(D\\) 在 \\\
  (R^d\\) 中具有正体积。如果过程 \\(Y(\\mathbf{s})\\) 满足下列条件，则称为二阶平稳：\n\n\\(E[Y(\\mathbf{s})]\
  \ = \\mu, \\quad \\text{for all } \\mathbf{s} \\in D,\\)\n(9.2)\n\n\\(\\text{Cov}[Y(\\\
  mathbf{s}_1), Y(\\mathbf{s}_2)] = C(\\mathbf{s}_1 - \\mathbf{s}_2), \\quad \\text{for\
  \ all } \\mathbf{s}_1, \\mathbf{s}_2 \\in D.\\)\n(9.3)\n\nEq. (9.2) 表明 \\(Y(\\mathbf{s})\\\
  ) 的期望在 \\(D\\) 内不变，Eq. (9.3) 中的函数 \\(C(\\cdot)\\) 称为 *协方差图* 或平稳协方差函数。此外，如果 \\(C(\\\
  mathbf{s}_1 - \\mathbf{s}_2)\\) 仅是 \\(\\|\\mathbf{s}_1 - \\mathbf{s}_2\\|\\) 的函数，则\
  \ \\(C(\\cdot)\\) 称为 *各向同性*。从定义可知，空间过程二阶（或弱）平稳的概念与时间序列相似。唯一的区别是，对于空间过程，若 \\(d >\
  \ 1\\)，则位置 \\(\\mathbf{s}\\) 没有明确定义的方向。\\(Y(\\mathbf{s})\\) 的 *渐近性* 概念也以类似于时间序列的方式定义。粗略地说，对于渐近过程\
  \ \\(Y(\\mathbf{s})\\)，可以通过空间平均来估计 \\(E[Y(\\mathbf{s})]\\)。\n\n对于二阶平稳空间过程 \\(Y(\\\
  mathbf{s})\\)，定义\n\n\\(C_y(\\mathbf{h}) = \\text{Cov}[Y(\\mathbf{s}), Y(\\mathbf{s}\
  \ + \\mathbf{h})], \\quad \\text{for all } \\mathbf{s}, \\mathbf{s} + \\mathbf{h}\
  \ \\in D.\\)\n(9.4)\n\n为简化起见，我们进一步假设 \\(Y(\\mathbf{s})\\) 和 \\(\\varepsilon(\\mathbf{s})\\\
  ) 是独立高斯过程，因此前两个矩是感兴趣的。定义 \\(\\sigma_y^2 = C_y(\\mathbf{0})\\) 和\n\n\\(\\sigma_0^2\
  \ = \\lim_{\\mathbf{h} \\to \\mathbf{0}} [C_y(\\mathbf{0}) - C_y(\\mathbf{h})],\\\
  )\n(9.5)\n\n其值非负。注意 \\(\\sigma_0^2\\) 表示 \\(Y(\\mathbf{s})\\) 过程的协方差图在 \\(\\mathbf{h}\
  \ = \\mathbf{0}\\) 处的跳跃。那么，我们有\n\n\\(\\text{Cov}[Z(\\mathbf{s}), Z(\\mathbf{s} +\
  \ \\mathbf{h})] \\equiv C_z(\\mathbf{h}) = \\begin{cases} \\sigma_y^2 + \\sigma_e^2,\
  \ & \\mathbf{h} = \\mathbf{0} \\\\ C_y(\\mathbf{h}), & \\mathbf{h} \\neq \\mathbf{0}.\
  \ \\end{cases}\\)\n\n下述量\n\n\\(\\lim_{\\mathbf{h} \\to \\mathbf{0}} [C_z(\\mathbf{0})\
  \ - C_z(\\mathbf{h})] = \\sigma_0^2 + \\sigma_e^2\\)\n\n在地统计学文献中称为 *块肥效应*。参见 Journel\
  \ and Huijbregts (1978) 等。*块肥* 一词用于表示 \\(C_z(\\mathbf{h})\\) 在 \\(\\mathbf{h} =\
  \ \\mathbf{0}\\) 处的跳跃。根据其定义，块肥是 \\(Y(\\mathbf{s})\\) 在 \\(\\mathbf{h} = \\mathbf{0}\\\
  ) 处的协方差图跳跃与观测噪声方差之和。在时间序列分析中，如果存在测量误差，则观测到的平稳时间序列变为 \\(z_t = y_t + \\epsilon_t\\\
  )，其中 \\(y_t\\) 是潜在时间序列，\\(\\epsilon_t\\) 是测量误差，并假设与 \\(y_t\\) 独立。在这种情况下，可以轻松看出：(a)\
  \ \\(\\text{Var}(z_t) = \\gamma_z(0) = \\gamma_y(0) + \\sigma_e^2\\)，其中 \\(\\sigma_e^2\\\
  ) 是 \\(\\epsilon_t\\) 的方差；以及 (b) 对于整数 \\(\\ell \\neq 0\\)，\\(\\gamma_z(\\ell) =\
  \ \\gamma_y(\\ell)\\)。如果 \\(t\\) 是连续的，则 \\(\\gamma_z(0) = \\gamma_y(0) + \\sigma_e^2\\\
  ) 且对 \\(h > 0\\) 有 \\(\\gamma_z(h) = \\gamma_y(h)\\)。因此，在存在测量误差时，块肥效应也会出现在时间序列分析中。在空间统计学中，块肥效应还包括空间过程\
  \ \\(Y(s)\\) 协方差函数在 \\(h = 0\\) 处的任何内在跳跃 \\(\\sigma_0^2\\)。\n\n考虑块肥效应，域 \\(D \\\
  subset R^d\\) 上的简单地统计模型可写为以下层次模型：\n\n- 数据模型：给定 \\(\\sigma_e^2\\) 时，对于 \\(i = 1,\
  \ \\dots, m\\)，\n  $$Z(s_i)|Y(s_i), \\sigma_e^2 \\sim_{\\text{ind}} N[Y(s_i), \\\
  sigma_e^2].$$\n\n- 过程模型：给定 \\(\\mu\\) 和 \\(C_y(.)\\) 时，\\(Y(.)\\) 是均值为 \\(\\mu\\\
  )、协方差函数为 \\(C_y(h)\\)（\\(h \\in D\\)）的平稳高斯过程。\n\n根据 \\(D\\) 的性质，空间过程 \\(Y(s)\\)\
  \ 通常分为地统计过程、格点过程、空间点过程和随机集过程。例如，当 \\(D\\) 由二维网格点组成时，\\(Y(s)\\) 是格点过程；当 \\(D\\) 由\
  \ \\(R^2\\) 中的随机点组成时，\\(Y(s)\\) 是点过程。更多细节见 Cressie and Wikle (2011, chapter 4)。接下来，我们将详细介绍前三类空间过程的统计推断。随机集过程在应用中较少使用。\n\
  \n## 9.3 地统计过程\n\n在应用中，通常可以获得一些协变量，我们假设空间过程 \\(Y(s)\\) 遵循线性模型\n\n$$Y(s) = x(s)'\\\
  beta + \\eta(s), \\quad s \\in D, \\qquad (9.6)$$\n\n其中 \\(\\eta(s)\\) 是均值为零、具有平稳协方差函数\
  \ \\(C_y(.)\\) 的高斯过程，\\(x(.)\\) 是 \\(k\\) 维协变量向量，在 \\(D\\) 的每个位置均可获得，\\(\\beta\\\
  ) 是 \\(k\\) 维参数向量。在观测位置 \\(s_1, \\dots, s_m\\) 处，我们得到线性混合模型\n\n$$\\boldsymbol{Y}\
  \ = \\boldsymbol{X}\\boldsymbol{\\beta} + \\boldsymbol{\\eta}, \\qquad (9.7)$$\n\
  \n其中 \\(\\boldsymbol{Y} = [Y(s_1), \\dots, Y(s_m)]'\\)，\\(\\boldsymbol{X}\\) 的第\
  \ \\(j\\) 行是 \\(x(s_j)'\\)，\\(\\boldsymbol{\\eta} = [\\eta(s_1), \\dots, \\eta(s_m)]'\\\
  )，表示空间随机效应，且 \\(\\text{Var}(\\boldsymbol{\\eta}) = [C_y(s_i - s_j)]\\) 是一个 \\(m\
  \ \\times m\\) 正定矩阵。在 Eq. (9.7) 中，\\(\\boldsymbol{\\beta}\\) 是协变量的固定效应，我们假设 \\(k\
  \ < m\\)。数据模型变为\n\n$$Z(s_i) = Y(s_i) + \\epsilon(s_i), \\quad i = 1, \\dots, m,\
  \ \\qquad (9.8)$$\n\n其中 \\(\\{\\epsilon(s_i)\\}\\) 为 iid \\(N(0, \\sigma_e^2)\\\
  )。那么，对于 \\(s \\in D\\)，有 \\(\\text{Var}[Z(s)] = \\sigma_y^2 + \\sigma_e^2\\)，在地统计学文献中称为台阶。该模型的块肥效应为\n\
  \n$$c_0 = \\sigma_0^2 + \\sigma_e^2,$$\n\n其中 \\(\\sigma_0^2 = \\lim_{h \\to 0} [C_y(0)\
  \ - C_y(h)]\\)。参见 Eq. (9.5)。量 \\(\\sigma_z^2 - c_0 = \\sigma_y^2 - \\sigma_0^2\\\
  ) 称为部分台阶。\n\n### 9.3.1 平稳变差函数\n\n对于 \\(D \\subset R^d\\) 中的空间过程 \\(Y(\\mathbf{s})\\\
  )，假设均值为常数，且相距 \\(\\mathbf{h}\\) 的变量差异的变化方式仅取决于 \\(\\mathbf{h}\\)。那么，函数\n$$\n2\\\
  gamma_y(\\mathbf{h}) = \\text{Var}[Y(\\mathbf{s} + \\mathbf{h}) - Y(\\mathbf{s})],\
  \ \\quad \\text{for all } \\mathbf{s}, \\mathbf{s} + \\mathbf{h} \\in D, \\quad\
  \ (9.9)\n$$\n\n称为平稳变差函数。如果 \\(\\text{Var}[Y(\\mathbf{s})]\\) 存在，则有\n$$\n2\\gamma_y(\\\
  mathbf{h}) = 2C_y(\\mathbf{0})(1 - C_y(\\mathbf{h})/C_y(\\mathbf{0})) = 2C_y(\\\
  mathbf{0})[1 - \\rho_y(\\mathbf{h})], \\quad (9.10)\n$$\n\n其中，若变差函数是各向同性的，\\(\\\
  rho_y(\\mathbf{h})\\) 作为空间过程的自相关系数，如下文定义。\n\n变差函数必须满足条件非正定性条件，\n$$\n\\sum_{i=1}^\\\
  ell \\sum_{j=1}^\\ell \\alpha_i \\bar{\\alpha}_j 2\\gamma_y(\\mathbf{s}_i - \\mathbf{s}_j)\
  \ \\le 0, \\quad (9.11)\n$$\n\n对任何正整数 \\(\\ell\\)、任何空间位置集合 \\(\\{\\mathbf{s}_1,\
  \ \\dots, \\mathbf{s}_\\ell\\}\\) 以及任何满足 \\(\\sum_{i=1}^\\ell \\alpha_i = 0\\) 的复数集合\
  \ \\(\\{\\alpha_1, \\dots, \\alpha_\\ell\\}\\) 成立，其中 \\(\\bar{\\alpha}_i\\) 是 \\\
  (\\alpha_i\\) 的复共轭。对于二阶平稳过程 \\(Y(\\mathbf{s})\\)，很容易证明条件 (9.11) 成立。基本上，由于 \\(\\\
  sum_{i=1}^\\ell \\alpha_i = 0\\)，Eq. (9.11) 的左边变为 \\(-2\\text{Var}[\\sum_{i=1}^\\\
  ell \\alpha_i Y(\\mathbf{s}_i)]\\)。该条件很重要，因为它保证了所有基于模型的方差均非负。\n\n如果变差函数可以表示为 \\\
  (\\|\\mathbf{h}\\| = (h_1^2 + \\dots + h_d^2)^{1/2}\\) 的函数，则该变差函数称为 *各向同性*；否则称为\
  \ *各向异性*。有时，我们将 \\(\\|\\mathbf{h}\\|\\) 写作 \\(\\|\\mathbf{h}\\|_2\\) 以强调 \\(\\ell_2\\\
  ) 范数。\n\n在前面的章节中，我们使用自协方差函数来描述二阶平稳时间序列的时序依赖。类似地，人们通常使用变差函数来捕捉二阶平稳空间过程的空间依赖。但是，应注意变差函数比协方差函数更一般。例如，考虑标量情况。对于随机游走过程，变差函数有定义，而其协方差函数未定义。在实践中，文献中常使用仅依赖少数参数\
  \ \\(\\boldsymbol{\\theta}\\) 的变差函数模型来总结空间依赖。下面给出一些示例。\n\n### 9.3.2 半变差函数示例\n\n\
  Eq. (9.9) 中的函数 \\(\\gamma_y(\\mathbf{h})\\) 称为 \\(Y(\\mathbf{s})\\) 的半变差函数，可以写为\
  \ \\(\\gamma_y(\\mathbf{h}) = C_y(\\mathbf{0}) - C_y(\\mathbf{h})\\)。如果它依赖于有限维参数\
  \ \\(\\boldsymbol{\\theta}\\)，则有\n$$\n\\gamma_y(\\mathbf{h}, \\boldsymbol{\\theta})\
  \ = C_y(\\mathbf{0}, \\boldsymbol{\\theta}) - C_y(\\mathbf{h}, \\boldsymbol{\\theta}).\
  \ \\quad (9.12)\n$$\n\n在本节中，我们考虑一些半变差函数的具体示例。参数模型在空间预测（如克里金法）中很有用。半变差函数的第一个示例是 Matérn\
  \ 半变差函数，其形式为\n\n$$\nC_y(\\mathbf{h}, \\boldsymbol{\\theta}) = \\sigma_0^2(\\|\\\
  mathbf{h}\\| = 0) + \\sigma_1^2 \\{ 2^{\\theta_2-1} \\Gamma(\\theta_2) \\}^{-1}\
  \ \\{ \\|\\mathbf{h}\\|/\\theta_1 \\}^{\\theta_2} K_{\\theta_2}(\\|\\mathbf{h}\\\
  |/\\theta_1), \\quad (9.13)\n$$\n\n其中 \\(K_{\\theta_2}(.)\\) 是第二类改良贝塞尔函数，阶次为 \\\
  (\\theta_2\\)（例如 Abramowitz and Stegun, 1964, pp. 374-379），\\(\\Gamma(.)\\) 是伽马函数，\\\
  (\\boldsymbol{\\theta} = (\\theta_1, \\theta_2, \\sigma_0^2, \\sigma_1^2)'\\)，且\
  \ \\(\\theta_1 > 0, \\theta_2 > 0, \\sigma_0^2 \\ge 0, \\sigma_1^2 \\ge 0\\)。Figure\
  \ 9.8(a) 显示了一个图\n\n\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_502_0.png)\n\n图\
  \ 9.8 选定半变异方差的 $C_y(\\boldsymbol{h}, \\boldsymbol{\\theta})$ 散点图。(a) 带 $\\boldsymbol{\\\
  theta} = (1, 1.5, 0.1, 0.9)'$ 的 Matérn 半变异方差。(b) 带 $\\boldsymbol{\\theta} = (1,\
  \ 1, 0.1, 0.9)'$ 的指数幂半变异方差。两个图均显示 10% 块头效应。\n\n为 $\\boldsymbol{\\theta} = (1, 1.5,\
  \ 0.1, 0.9)'$ 的公式 (9.13) 中 $C_y(\\boldsymbol{h}, \\boldsymbol{\\theta})$ 关于 $\\\
  |\\boldsymbol{h}\\|$ 的图，表明协方差函数随 $\\|\\boldsymbol{h}\\|$ 增加而平滑衰减至零。该图还显示 10% 块头效应。使用的\
  \ $\\boldsymbol{\\theta}$ 值取自 Cressie and Wikle (2011)。对于公式 (9.13) 中的模型，$\\sigma_0^2$\
  \ 是块头，$\\sigma_1^2$ 是方差，$\\theta_1$ 称为 *比例尺* 或 *量程* 参数，$\\theta_2$ 是 *形状* 或 *平滑度*\
  \ 参数。这是一个各向同性半变异方差。\n\n常用各向同性半变异方差的另一个例子是由下式给出的指数幂半变异方差\n\n$$C_y(\\boldsymbol{h},\
  \ \\boldsymbol{\\theta}) = \\sigma_0^2 I(\\|\\boldsymbol{h}\\| = 0) + \\sigma_1^2\
  \ \\exp[-(\\|\\boldsymbol{h}\\|/\\theta_1)^{\\theta_2}], \\quad (9.14)$$\n\n其中 $\\\
  boldsymbol{\\theta} = (\\theta_1, \\theta_2, \\sigma_0^2, \\sigma_1^2)'$，且 $\\theta_1\
  \ > 0, 0 < \\theta_2 \\le 2, \\sigma_0 \\ge 0$，以及 $\\sigma_1^2 \\ge 0$。图 9.8(b)\
  \ 显示了带 $\\boldsymbol{\\theta} = (1, 1, 0.1, 0.9)'$ 的公式 (9.14) 中 $C_y(\\boldsymbol{h},\
  \ \\boldsymbol{\\theta})$ 关于 $\\|\\boldsymbol{h}\\|$ 的图。从图中可以看出，协方差函数随 $\\|\\boldsymbol{h}\\\
  |$ 增加而快速平滑地衰减至零。图中也显示了 10% 块头效应。指数幂半变异方差在 Diggle and Ribeiro (2007) 中有讨论。在实践中，常使用\
  \ $\\theta_2 = 1$。\n\n以下无块头效应的各向同性半变异方差模型也在某些 R 包中可用：\n\n- 1. 线性模型：\n$$r_y(\\boldsymbol{h},\
  \ \\boldsymbol{\\theta}) = \\begin{cases} 0, & \\text{若 } \\boldsymbol{h} = \\boldsymbol{0},\
  \ \\\\ b_0 + b_1 \\|\\boldsymbol{h}\\|, & \\text{若 } \\boldsymbol{h} \\neq \\boldsymbol{0},\
  \ \\end{cases}$$\n\n其中 $\\boldsymbol{\\theta} = (b_0, b_1)'$，且 $b_0 \\ge 0$ 和 $b_1\
  \ \\ge 0$。\n\n- 2. 球形模型：对 $1 \\le d \\le 3$ 的 $R^d$ 有效。\n$$r_y(\\boldsymbol{h},\
  \ \\boldsymbol{\\theta}) = \\begin{cases} 0, & \\boldsymbol{h} = \\boldsymbol{0},\
  \ \\\\ b_0 + b_1 [1.5(\\|\\boldsymbol{h}\\|/b_2) - 0.5(\\|\\boldsymbol{h}\\|/b_2)^3],\
  \ & 0 < \\|\\boldsymbol{h}\\| \\le b_2, \\\\ b_0 + b_1, & \\|\\boldsymbol{h}\\|\
  \ \\ge b_2, \\end{cases}$$\n\n其中 $\\boldsymbol{\\theta} = (b_0, b_1, b_2)'$，且对 $i=1,\
  \ 2, 3$ 有 $b_i \\ge 0$。\n\n- 3. 指数模型：\n$$\\gamma_Y(\\mathbf{h}, \\boldsymbol{\\\
  theta}) = \\begin{cases} 0, & \\mathbf{h} = \\mathbf{0}, \\\\ b_0 + b_1 [1 - \\\
  exp(-\\|\\mathbf{h}\\|/b_2)], & \\mathbf{h} \\neq \\mathbf{0}, \\end{cases}$$\n\n\
  其中 $\\boldsymbol{\\theta} = (b_0, b_1, b_2)'$，且对 $i = 1, 2, 3$ 有 $b_i \\ge 0$。\n\
  \n在某些应用中，如果底层物理过程在空间中演变方式不同，即过程在空间不同方向上出现不同的动态依赖，则需要各向异性变异方差。例如，空气污染物的空间依赖性可能受监测站周围地理特征的影响，因此在不同方向上可能不同。在某些情况下，可以通过对滞后向量\
  \ $\\mathbf{h}$ 进行可逆线性变换来纠正各向异性。如果 $2\\gamma_Y(.)$ 可表示为\n\n$$2\\gamma_Y(\\mathbf{h})\
  \ = 2\\gamma_Y^*(\\|\\mathbf{A}\\mathbf{h}\\|), \\quad \\mathbf{h} \\in R^d, \\\
  quad (9.15)$$\n\n其中 $\\mathbf{A}$ 是一个可逆的 $d \\times d$ 矩阵，$\\gamma_Y^*(.)$ 的定义域为\
  \ $R$，则称其为 *几何各向异性*。\n\n### 9.3.3 静态协方差函数\n\n与使用公式 (9.9) 中的变异方差不同，如果空间过程 $Y(\\mathbf{s})$\
  \ 满足以下两个条件：\n\n$$C_y(\\mathbf{h}) = \\text{Cov}[Y(\\mathbf{s} + \\mathbf{h}), Y(\\\
  mathbf{s})], \\quad \\text{对所有 } \\mathbf{s}, \\mathbf{s} + \\mathbf{h} \\in D,\
  \ \\quad (9.16)$$\n\n和\n\n$$E[Y(\\mathbf{s})] = \\mu, \\quad \\text{对所有 } \\mathbf{s}\
  \ \\in D, \\quad (9.17)$$\n\n则称其为在 $D$ 中具有静态协方差函数 $C_y(.)$ 的二阶平稳过程。类似于时间序列分析，也可以使用相关函数\n\
  \n$$\\rho_y(.) = C_y(.) / C_y(\\mathbf{0})$$\n\n来研究协方差平稳空间过程。协方差函数 $C_y(.)$ 必须满足非负定性条件\n\
  \n$$\\sum_{i=1}^{\\ell} \\sum_{j=1}^{\\ell} \\alpha_i \\bar{\\alpha}_j C_y(\\mathbf{s}_i\
  \ - \\mathbf{s}_j) \\ge 0, \\quad (9.18)$$\n\n对任何正整数 $\\ell$、任何空间位置集合 $\\{\\mathbf{s}_1,\
  \ \\dots, \\mathbf{s}_\\ell\\}$ 和任何复数集合 $\\{\\alpha_1, \\dots, \\alpha_\\ell\\}$\
  \ 均成立。注意，公式 (9.18) 的非负定性条件必须对所有复数 $\\{\\alpha_i\\}$ 成立，而不仅仅是那些和为零的复数。因此，静态协方差函数比静态变异方差更强。如果\
  \ $C_y(\\mathbf{h}) = C_y^*(\\|\\mathbf{h}\\|)$，则称其为 *各向同性*，否则为 *各向异性*，其中 $C_y^*(.)$\
  \ 的定义域为 $R$。注意，公式 (9.16) 中的条件（意味着过程具有有限且常数的方差）对于过程具有静态变异方差不是必需的。\n\n### 9.3.4 变异方差估计\n\
  \n对于带数据 $\\boldsymbol{Z}$ 的二阶平稳空间过程 $Z(\\boldsymbol{s}_j) = Y(\\boldsymbol{s}_i)\
  \ + \\epsilon(\\boldsymbol{s}_i)$，通常使用矩法来估计共变量图或变异方差。Matheron (1962) 提出了估计量\n\n\
  $$2\\hat{\\gamma}(\\boldsymbol{h}) = \\frac{1}{|N(\\boldsymbol{h})|} \\sum_{N(\\\
  boldsymbol{h})} [Z(\\boldsymbol{s}_i) - Z(\\boldsymbol{s}_j)]^2, \\quad \\boldsymbol{h}\
  \ \\in R^d, \\tag{9.19}$$\n\n其中\n\n$$N(\\boldsymbol{h}) = \\{(\\boldsymbol{s}_i,\
  \ \\boldsymbol{s}_j)|\\boldsymbol{s}_i - \\boldsymbol{s}_j = \\boldsymbol{h}; i,\
  \ j = 1, \\dots, m\\},$$\n\n且 $|N(\\boldsymbol{h})|$ 是 $N(\\boldsymbol{h})$ 中不同对数的数量。\n\
  \n当数据在 $R^d$ 中不规则分布时，公式 (9.19) 的变异方差估计量通常通过使用以下内容进行平滑处理：\n\n$$2\\gamma^+(\\boldsymbol{h})\
  \ = \\text{ave}\\{[Z(\\boldsymbol{s}_i) - Z(\\boldsymbol{s}_j)]^2|(i,j) \\in N(\\\
  boldsymbol{h}), \\boldsymbol{h} \\in U(\\boldsymbol{h}(\\ell))\\}, \\tag{9.20}$$\n\
  \n其中区域 $U(\\boldsymbol{h}(\\ell))$ 是 $R^d$ 中 $\\boldsymbol{h}(\\ell)$ 附近的某个指定容差区域，$\\\
  ell = 1, \\dots, g$，$g$ 为正整数。容差区域的选择在 Journel and Huijbregts (1978) 中有讨论。遵循时间序列文献，也可以使用估计量\n\
  \n$$\\widehat{C}(\\boldsymbol{h}) = \\frac{1}{|N(\\boldsymbol{h})|} \\sum_{N(\\\
  boldsymbol{h})} [Z(\\boldsymbol{s}_j) - \\bar{Z}][Z(\\boldsymbol{s}_j) - \\bar{Z}],\
  \ \\tag{9.21}$$\n\n其中 $\\bar{Z} = \\sum_{i=1}^m Z(\\boldsymbol{s}_i)/m$，且 $N(\\\
  boldsymbol{h})$ 如前所述在公式 (9.19) 中定义。对于 $d=1$ 的情况，估计量 $\\widehat{C}(\\boldsymbol{h})$\
  \ 和 $2\\hat{\\gamma}(\\boldsymbol{h})$ 的渐近特性已在时间序列文献中研究。\n\n### 9.3.5 空间依赖性检验\n\n\
  给定空间数据 $\\boldsymbol{Z} = [Z(\\boldsymbol{s}_1), \\dots, Z(\\boldsymbol{s}_m)]'$，一个重要的问题是数据是否具有空间依赖性。即，我们有兴趣检验\
  \ $H_0 : Y(\\boldsymbol{s})$ 没有空间依赖性 与 $H_a : Y(\\boldsymbol{s})$ 具有空间依赖性。假设变异方差是各向同性的，即\
  \ $2\\gamma_y(\\boldsymbol{h}) = 2\\gamma^*(\\|\\boldsymbol{h}\\|)$，且 $Z(\\cdot)$（以及\
  \ $Y(\\cdot)$）的均值为常数，Cressie and Wikle (2011) 考虑了变异方差的估计量\n\n$$2\\hat{\\gamma}_z^*(\\\
  boldsymbol{h}) = \\text{ave}\\{[Z(\\boldsymbol{s}_i) - Z(\\boldsymbol{s}_j)]^2|\\\
  |\\boldsymbol{s}_i - \\boldsymbol{s}_j\\| \\in N(h); i,j = 1, \\dots, m\\}, \\tag{9.22}$$\n\
  \n其中 $N(h)$ 是 $h$ 附近的容差区域，例如某个小 $\\Delta > 0$ 的 $h \\pm \\Delta$。该估计量称为 *经验变异方差*。它类似于公式\
  \ (9.20) 中的平滑版本。这些作者提出了检验统计量\n\n$$Q = \\frac{\\hat{\\gamma}_z^*(h_1)}{\\hat{\\sigma}_z^2},\
  \ \\tag{9.23}$$\n\n其中 $\\hat{\\sigma}_z^2 = \\sum_{i=1}^m [Z(\\boldsymbol{s}_i)\
  \ - \\hat{\\mu}_z]^2/(m-1)$，$\\hat{\\mu}_z = \\sum_{i=1}^m Z(\\boldsymbol{s}_i)/m$，且\
  \ $h_1$ 是所有可能滞后量 $h_1, \\dots, h_L$ 中的最小滞后量。如果 $|Q - 1|$ 较大，则拒绝 $H_0$。$H_0$ 的基于置换的检验可以在不做任何分布假设的情况下进行。\n\
  \n\n\n\n\n关于 \\( Z \\) 的假设；数据位置被置换，然后对所有可能的置换计算 \\( Q \\)。然后使用置换后的 \\( Q \\) 值的经验分位数进行推断，例如，如果观察到的\
  \ Eq. (9.23) 中的 \\( Q \\) 大于置换后的 \\( Q \\) 值的第 97.5 百分位数或小于第 2.5 百分位数，则拒绝 \\( H_0\
  \ \\)。\n\n### 9.3.6 克里金\n\n克里金是一种空间预测方法；参见 Matheron (1963)。遵循 Cressie and Wikle\
  \ (2011)，我们使用 HM 框架介绍克里金法。感兴趣的空间过程是 \\( \\{Y(s)|s \\in D\\} \\)，对所有 \\( s \\in D\
  \ \\) 都有 \\( 0 < \\text{Var}[Y(s)] < \\infty \\)。注意 \\( Y(s) \\) 可能不是二阶平稳的。观测数据\
  \ \\( Z(s) \\) 带有噪声，并遵循 Eq. (9.8) 中的模型。暂时假设 \\( Y(s) \\) 的前两个矩方程已知并由\n\n\\(\\mu_y(s)\
  \ = E[Y(s)], \\quad s \\in D,\\) (9.24)\n\n\\(C_y(s_1, s_2) = \\text{Cov}[Y(s_1),\
  \ Y(s_2)], \\quad s_1, s_2 \\in D.\\) (9.25)\n\n此外，测量误差的方差 \\(\\sigma^2_e\\) 也是已知的。在\
  \ Eq. (9.25) 中，我们不假设 \\( C_y(s_1, s_2) \\) 是 \\( s_1 - s_2 \\) 的函数。\\( Y(s) \\)\
  \ 的变差图如下给出\n\n\\(2\\gamma_y(s_1, s_2) = \\text{Var}[Y(s_1) - Y(s_2)] = C_y(s_1,\
  \ s_1) + C_y(s_2, s_2) - 2C_y(s_1, s_2).\\)\n\n克里金是为了在条件为 \\( \\boldsymbol{Z} =\
  \ \\{Z(s_1), \\dots, Z(s_m)\\}\\) 时获得 \\( Y(s_0) \\) 的最优空间预测，其中 \\( s_0 \\in D \\\
  ) 是感兴趣的位置。文献中考虑了三种类型的克里金，取决于对 \\( Y(s) \\) 均值方程的假设。第一种是简单克里金，其中 \\( E[Y(s)] \\)\
  \ 是已知的。第二种是普通克里金，其中 \\( E[Y(s)] = \\mu \\) 是未知常数，最后一种是通用克里金，其中 \\( E[Y(s)] \\) 依赖于带有未知参数的一些协变量。\n\
  \n#### 9.3.6.1 简单克里金\n\n称为 *简单克里金* 的方法是搜索所有异质线性预测器，\\( \\{\\boldsymbol{a}'\\boldsymbol{Z}\
  \ + u | \\boldsymbol{a} \\in R^m, u \\in R\\} \\)，以获得 \\( Y(s_0) \\) 的最优空间预测器。与时间序列分析中最小化均方预测误差（MSPE）类似，人们通过对\n\
  \n\\(\\text{MSPE}(\\boldsymbol{a}, u) = E[Y(s_0) - \\boldsymbol{a}'\\boldsymbol{Z}\
  \ - u]^2,\\) (9.26)\n\n对 \\( \\boldsymbol{a} \\) 和 \\( u \\) 求偏导数来寻找 \\( \\boldsymbol{a}\
  \ \\) 和 \\( u \\)。方程 (9.26) 可以写成\n\n\\(\\text{MSPE}(\\boldsymbol{a}, u) = \\text{Var}[Y(s_0)\
  \ - \\boldsymbol{a}'\\boldsymbol{Z} - u] + \\{E[Y(s_0) - \\boldsymbol{a}'\\boldsymbol{Z}\
  \ - u]\\}^2.\\)\n\n第二项是 \\([\\mu_y(s_0) - \\boldsymbol{a}'\\mu_y - u]^2\\)，其中 \\\
  ( \\mu_y = [\\mu_y(s_1), \\dots, \\mu_y(s_m)]'\\)，如果 \\( u \\) 满足\n\n\\(u = \\mu_y(s_0)\
  \ - \\boldsymbol{a}'\\mu_y.\\) (9.27)\n\n则该项为零。\n\n给定 Eq. (9.27) 中的 \\( u \\)，MSPE\
  \ 的第一项为\n\n\\(C_y(s_0, s_0) - 2\\boldsymbol{a}' \\text{Cov}[Y(s_0), \\boldsymbol{Z}]\
  \ + \\boldsymbol{a}'\\Sigma_z \\boldsymbol{a},\\) (9.28)\n\n其中 \\( m \\times m \\\
  ) 协方差矩阵 \\( \\Sigma_z = [C_z(s_i, s_j)] \\) 由\n\n\\(\\begin{array}{ c }\nC_z(u,\
  \ v) = \\left\\{ \\begin{array}{ c c }\nC_y(v, v) + \\sigma_\\epsilon^2, & \\text{if\
  \ } u = v, v \\in D, \\\\\nC_y(u, v), & \\text{if } u \\neq v, \n\\end{array} \\\
  right. \\\\\n\\end{array}\\)\n\n给出，并且\n\n\\(\\text{Cov}[Y(s_0), Z] = [C_y(s_0, s_1),\
  \ \\dots, C_y(s_0, s_m)]' \\equiv c_y(s_0). \\quad (9.29)\\)\n\n对 Eq. (9.28) 关于\
  \ \\( a \\) 求偏导数并令结果等于 \\( \\mathbf{0} \\)，我们得到\n\n\\( -2c_y(s_0) + 2\\Sigma_z a\
  \ = \\mathbf{0}. \\)\n\n因此，最优系数向量是 \\( a_* = \\Sigma_z^{-1}c_y(s_0) \\)，因此 \\( u_*\
  \ = \\mu_y(s_0) - c_y(s_0)'\\Sigma_z^{-1}\\mu_y \\)。基于先前的推导，简单克里金预测器是\n\n\\( Y^*(s_0)\
  \ = \\mu_y(s_0) + c_y(s_0)'\\Sigma_z^{-1}(Z - \\mu_y), \\quad (9.30) \\)\n\n其中 \\\
  ( c_y(s_0) \\) 由 Eq. (9.29) 给出，\\( \\mu_y \\) 在 Eq. (9.27) 中定义。将 \\( u_* \\) 和 \\\
  ( a_* \\) 代入 Eq. (9.26)，最小化的 MSPE 是\n\n\\( \\sigma_{y,sk}^2(s_0) = \\text{MSPE}(a_*,\
  \ u_*) = C_y(s_0, s_0) - c_y(s_0)'\\Sigma_z^{-1}c_y(s_0), \\quad (9.31) \\)\n\n\
  其中下标 \\( sk \\) 用于表示简单克里金。Eq. (9.31) 中的量 \\( \\sigma_{y,sk}^2(s_0) \\) 经常被称为简单克里金方差。\n\
  \n当协变量可用且模型遵循 Eqs. (9.6) 到 (9.8) 时，我们有 \\( \\mu_y(s) = x(s)'\\beta \\)，简单克里金预测器变为\n\
  \n\\( Y^*(s_0) = x(s_0)'\\beta + c_y(s_0)'\\Sigma_z^{-1}(Z - X\\beta). \\quad (9.32)\
  \ \\)\n\nEq. (9.31) 中的简单克里金方差保持不变。\n\n请注意，简单克里金解和方差也可以在以下 HM 下得到：\n\n- Data model:\
  \ Conditional on \\( \\sigma_\\epsilon^2 \\),\n\n\\( Z(s_i)|Y(s_i), \\sigma_\\epsilon^2\
  \ \\sim_{ind} N[Y(s_i), \\sigma_\\epsilon^2], \\quad s_i \\in D, \\quad i = 1, \\\
  dots, m. \\)\n\n- Process model: Conditional on \\( \\beta \\) and \\( C_y(\\cdot,\
  \ \\cdot) \\), \\( Y(\\cdot) \\) is a Gaussian process satisfying\n\n\\( E[Y(s)]\
  \ = x(s)'\\beta, \\quad \\text{Cov}[Y(s_i, s_j)] = C_y(s_i, s_j), \\quad s_1, s_2\
  \ \\in D. \\)\n\n来自数据模型，我们有 \\( Z|Y \\sim N(Y, \\sigma_\\epsilon^2 I) \\)，其中 \\\
  ( Y \\) 在 Eq. (9.7) 中给出，\\( I \\) 是 \\( m \\times m \\) 单位矩阵。来自过程模型，我们有\n\n\\(\\\
  begin{bmatrix} Y(s_0) \\\\ Y \\end{bmatrix} \\sim N \\left( \\begin{bmatrix} x(s_0)'\
  \ \\\\ X \\end{bmatrix} \\beta, \\begin{bmatrix} C_y(s_0, s_0) & c_y(s_0)' \\\\\
  \ c_y(s_0) & \\Sigma_y \\end{bmatrix} \\right), \\quad (9.33)\\)\n\n其中 \\(\\Sigma_y\
  \ = \\text{Var}(Y)\\)。因此，根据多元正态分布的性质，\n\n\\(Y(s_0)|Y \\sim N[x(s_0)'\\beta + c_y(s_0)'\\\
  Sigma_y^{-1}(Y - X\\beta), C_y(s_0, s_0) - c_y(s_0)'\\Sigma_y^{-1}c_y(s_0)].\\)\
  \ (9.34)\n\n接下来，根据贝叶斯定理，\\([Y|Z] \\propto [Z|Y][Y]\\)，其中 \\([A|C]\\) 表示给定 \\(C\\\
  ) 时 \\(A\\) 的条件分布，\\([Y]\\) 表示 \\(Y\\) 的边缘分布。根据高斯分布的共轭性质，我们可以得到后验分布 \\([Y|Z]\\)\
  \ 为\n\n\\(Y|Z \\sim N[D^{-1}(\\sigma_\\epsilon^{-2}Z + \\Sigma_y^{-1}X\\beta), D^{-1}],\\\
  ) (9.35)\n\n其中 \\(D = \\sigma_\\epsilon^{-2}I + \\Sigma_y^{-1}\\) 是两个精度矩阵之和。使用众所周知的\
  \ Sherman-Morrison-Woodbury 矩阵恒等式，我们可以将条件分布重写为\n\n\\(Y|Z \\sim N(X\\beta + K(Z -\
  \ X\\beta), (I - K)\\Sigma_y),\\) (9.36)\n\n其中 \\(K = \\Sigma_y\\Sigma_z^{-1}\\\
  ) 与 \\(\\Sigma_z = \\Sigma_y + \\sigma_\\epsilon^2 I\\)。现在，使用迭代期望和事实 \\([Y(s_0)|Y,\
  \ Z] = [Y(s_0)|Y]\\)，我们有\n\n\\(E[Y(s_0)|Z] = E[\\{E[Y(s_0)|Y, Z]\\}|Z]\\)\n\\(=\
  \ E[x(s_0)'\\beta + c_y(s_0)'\\Sigma_y^{-1}(Y - X\\beta)|Z]\\)\n\\(= x(s_0)'\\beta\
  \ + c_y(s_0)'\\Sigma_y^{-1}K(Z - X\\beta) \\quad \\text{[Equation (9.36)]}\\)\n\\\
  (= x(s_0)'\\beta + c_y(s_0)'\\Sigma_z^{-1}(Z - X\\beta)\\)\n\\(= Y^*(s_0).\\) (9.37)\n\
  \n对于后验方差，我们有\n\n\\(\\text{Var}[Y(s_0)|Z] = E\\{\\text{Var}[Y(s_0)|Y]|Z\\} + \\text{Var}\\\
  {E[Y(s_0)|Y]|Z\\}\\)\n\\(= C_y(s_0, s_0) - c_y(s_0)'\\Sigma_y^{-1}c_y(s_0) + \\\
  text{Var}[c_y(s_0)'\\Sigma_y^{-1}Y|Z]\\)\n\\(= C_y(s_0, s_0) - c_y(s_0)'\\Sigma_y^{-1}Kc_y(s_0)\
  \ \\quad \\text{[Equation (9.36)]}\\)\n\\(= C_y(s_0, s_0) - c_y(s_0)'\\Sigma_z^{-1}c_y(s_0)\\\
  )\n\\(= \\sigma^2_{y.sk}(s_0).\\) (9.38)\n\n这完成了在 HM 框架下的推导。\n\n#### 9.3.6.2 普通克里金\n\
  \n简单克里金的推导假设均值和协方差函数已知。这里我们放松假设，允许均值函数未知，但强加某些无偏性，导致在空间预测中使用数据的齐次线性组合。普通克里金是指 \\\
  (Y(s)\\) 的均值是常数但未知的情况。\n\n普通克里金预测器是数据 \\(Z\\) 的线性组合，记为 \\(b'Z\\)，它最小化 MSPE\n\n\\\
  ( MSPE(b) = E[Y(s_0) - b'Z]^2, \\quad (9.39) \\)\n\n受无偏性条件 \\( E(b'Z) = E[Y(s_0)]\
  \ = \\mu \\) 对所有 \\( \\mu \\in R \\) 的约束。由于 \\( E[Z(s)] = E[Y(s)] = \\mu \\)，我们有\
  \ \\( E(Z) = \\mu 1 \\)，其中 \\( 1 \\) 是 1 组成的 \\( m \\)-维向量。无偏性条件则意味着\n\n\\( b'1\
  \ = 1, \\quad (9.40) \\)\n\n即普通克里金系数的和为 1。然后使用拉格朗日乘数法来最小化目标函数\n\n\\( \\ell(b) =\
  \ MSPE(b) - 2\\lambda(b'1 - 1). \\)\n\n更具体地说，目标函数是\n\n\\( \\ell(b, \\lambda) = C_y(s_0,\
  \ s_0) - 2b'c_y(s_0) + b'\\Sigma_z b - 2\\lambda(b'1 - 1), \\quad (9.41) \\)\n\n\
  其中，再次，\\( \\Sigma_z = Var(Z) \\)。对 \\( b \\) 和 \\( \\lambda \\) 求偏导数并令它们等于零，我们有\n\
  \n\\( -c_y(s_0) + \\Sigma_z b = \\lambda 1, \\\\ b'1 = 1. \\quad (9.42) \\)\n\n\
  求解上述方程，我们得到\n\n\\( b_* = \\Sigma_z^{-1}[c_y(s_0) + k_* 1], \\)\n\n和 \\( k_* = [1\
  \ - 1'\\Sigma_z^{-1}c_y(s_0)] / (1'\\Sigma_z^{-1}1) \\)。因此，普通克里金预测器是\n\n\\( \\widehat{Y}(s_0)\
  \ = b_*'Z = \\{c_y(s_0) + 1(1 - 1'\\Sigma_z^{-1}1) / (1'\\Sigma_z^{-1}1)\\}'\\Sigma_z^{-1}Z,\
  \ \\quad (9.43) \\)\n\n和最小化的 MSPE 是\n\n\\( \\sigma_{y,ok}^2 = C_y(s_0, s_0) - c_y(s_0)'\\\
  Sigma_z^{-1}c_y(s_0) + [1 - 1'\\Sigma_z^{-1}c_y(s_0)]^2 / (1'\\Sigma_z^{-1}1), \\\
  quad (9.44) \\)\n\n其中下标 \\( ok \\) 表示普通克里金。\\( \\sigma_{y,ok}^2 \\) 称为普通克里金方差。\n\
  \n#### 9.3.6.3 通用克里金\n\n通用克里金是指 \\( E[Y(s)] = x(s)'\\beta \\) 且 \\( \\beta \\) 未知的情况。这里\
  \ \\( \\beta \\) 由广义最小二乘法（gls）估计\n\n\n方法，并且可以证明通用克里金预测器为\n\n\\[\n\\widehat{Y}(s_0)\
  \ = x(s_0)'\\widehat{\\beta}_{gls} + c_y(s_0)'\\Sigma_z^{-1}(Z - X\\widehat{\\beta}_{gls}),\
  \ \\tag{9.45}\n\\]\n\n其中 \\(\\widehat{\\beta}_{gls} = (X'\\Sigma_z^{-1}X)^{-1}X'\\\
  Sigma_z^{-1}Z\\) 是 \\(\\beta\\) 的广义最小二乘估计量。通用克里金方差为\n\n\\[\n\\sigma^2_{y,uk}(s_0)\
  \ = c_y(s_0)'\\Sigma_z^{-1}c_y(s_0)\n+ [x(s_0) - X\\Sigma_z^{-1}c_y(s_0)]'(X'\\\
  Sigma_z^{-1}X)^{-1}[x(s_0) - X\\Sigma_z^{-1}c_y(s_0)], \\tag{9.46}\n\\]\n\n其中下标\
  \ _uk_ 表示通用克里金。\n\n在实际应用中，当存在一些协变量时，人们使用通用克里金。在没有协变量的情况下，可以使用普通克里金。实际上，大多数空间软件包都使用通用克里金。\n\
  \n## 9.4 格点过程\n\n格点过程 \\(\\{Y(s)|s \\in D\\}\\) 定义在有限或可数子集 \\(D \\subset R^d\\)\
  \ 上。它们用于研究并建模格点数据 **Z** = {_Z_(**_s_**<sub>1</sub>)_,...,Z_(**_s_**_<sub>m</sub>_)}，其中\
  \ {**_s_**<sub>1</sub>_,...,**s**<sub>m</sub>_} 是定义在离散空间特征（如网格节点或像素）上的数据位置。通常定义一个\
  \ \\(m \\times m\\) 空间邻域矩阵 **W** = [_w<sub>ij</sub>_]，其对角元素为零，如果位置 **_s_**_<sub>i</sub>_\
  \ 被视为位置 **_s_**_<sub>j</sub>_ 的邻居，则 _w<sub>ij</sub>_ = 1。术语 _邻居_ 由数据分析师基于其领域知识定义。例如，如果\
  \ \\(\\|s_i - s_j\\| \\le r\\) 对于某个正实数 _r_ 成立，则可将 **_s_**_<sub>i</sub>_ 和 **_s_**_<sub>j</sub>_\
  \ 定义为邻居。\n\nMoran (1950) 考虑了实直线的简单情况，其中 _s<sub>i</sub>_ = _i_ 且 _i_ = 1_,...,m_，并定义如果\
  \ \\(0 < |s_i - s_j| \\le 1\\) 则 _w<sub>ij</sub>_ = _w<sub>ji</sub>_ = 1。对于去趋势数据\
  \ **Z** 且 _E_(**Z**) = **0**，他提出了统计量\n\n\\[\nI = \\frac{Z'WZ}{Z'Z}, \\tag{9.47}\n\
  \\]\n\n用于检验原假设 _H_<sub>0</sub>:_Z_(**_s_**<sub>1</sub>)_,...,Z_(**_s_**_<sub>m</sub>_)\
  \ 是 _iid_。由于数据已进行均值调整，Eq. (9.47) 的分子和分母分别是该过程的邻域协方差和方差。因此，该检验属于相关检验。Cliff and Ord\
  \ (1981) 提议使用更一般的 **W**，其中 **W** 可能不是对称的，且其非对角元素不必为 1，并创造了检验统计量 _Moran’s I_。该统计量在文献中被广泛用于检验\
  \ **Z** 中不存在空间自相关的原假设。类似于 Eq. (9.23) 中经验变异函数的 _F_-统计量，基于置换的参考分布可用于 Moran’s I 检验。\n\
  \n### 9.4.1 马尔可夫类型模型\n\n空间过程与时间序列过程之间的一个关键区别在于，空间过程在 _R<sup>d</sup>_（其中 _d_ > 1）中没有自然的排序。在文献中，已为\
  \ _R<sup>d</sup>_ 中的空间过程开发了各种统计模型。其中许多利用具有特定邻域系统的马尔可夫性质。参见，例如，Besag (1974)。在本节中，我们简要介绍一些空间数据的马尔可夫类型模型。\n\
  \n格点过程最简单的马尔可夫模型是在 \\(R^1\\) 中的一阶单侧空间过程，其中 \\(D = \\{1, 2, \\dots, n\\}\\)，\\(n\\\
  ) 为样本量。该模型为\n\n\\[\nY(s) = \\phi Y(s-1) + \\epsilon(s), \\quad s = 2, \\dots, n,\
  \ \\tag{9.48}\n\\]\n\n其中 \\(|\\phi| < 1\\)，\\(\\{\\epsilon(s)\\} \\sim^{iid} N(0,\
  \ \\sigma^2)\\)，且 \\(\\epsilon(s)\\) 与 \\(Y(s-1)\\) 独立，这类似于一阶自回归模型，即第 2 章的 AR(1)\
  \ 模型。由于样本量 \\(n\\) 是有限的，需要一个初始条件使空间过程成为平稳高斯过程。初始条件为\n\n\\[\nY(1) \\sim N[0, \\sigma^2/(1\
  \ - \\phi^2)]. \\tag{9.49}\n\\]\n\n可以轻易看出 \\(\\text{cor}(Y(s), Y(s-1)) = \\phi\\\
  )，并且对于 \\(\\mathbf{Y} = [Y(1), \\dots, Y(n)]'\\)，有 \\(E(\\mathbf{Y}) = \\mathbf{0}\\\
  ) 以及\n\n\\[\n\\text{Var}(\\mathbf{Y}) = \\frac{\\sigma^2}{1 - \\phi^2} \\left[ \\\
  begin{array}{cccc} 1 & \\phi & \\cdots & \\phi^{n-1} \\\\ \\phi & 1 & \\cdots &\
  \ \\phi^{n-2} \\\\ \\vdots & \\vdots & \\ddots & \\vdots \\\\ \\phi^{n-1} & \\phi^{n-2}\
  \ & \\cdots & 1 \\end{array} \\right]_{n \\times n}. \\tag{9.50}\n\\]\n\n\\(\\mathbf{Y}\\\
  ) 的联合分布是高斯分布，并且可以轻易看出\n\n\\[\n[\\text{Var}(\\mathbf{Y})]^{-1} = \\frac{1}{\\sigma^2}\
  \ \\left[ \\begin{array}{cccccccc} 1 & -\\phi & 0 & 0 & \\cdots & 0 & 0 & 0 \\\\\
  \ -\\phi & 1 + \\phi^2 & -\\phi & 0 & \\cdots & 0 & 0 & 0 \\\\ 0 & -\\phi & 1 +\
  \ \\phi^2 & -\\phi & \\cdots & 0 & 0 & 0 \\\\ \\vdots & \\vdots & \\vdots & \\vdots\
  \ & & \\vdots & \\vdots & \\vdots \\\\ 0 & 0 & 0 & 0 & \\cdots & -\\phi & 1 + \\\
  phi^2 & -\\phi \\\\ 0 & 0 & 0 & 0 & \\cdots & 0 & -\\phi & 1 \\end{array} \\right].\n\
  \\]\n\n在空间统计中，该模型属于条件自回归（CAR）模型类。\n\n通常，假设 \\(D = \\{s_1, \\dots, s_n\\} \\subset\
  \ R^d\\)。令 \\(\\mathbf{Y} = [Y(s_1), \\dots, Y(s_n)]'\\)，对于 \\(i = 1, \\dots, n\\\
  )，令 \\(\\mathbf{Y}_{-i} = [Y(s_1), \\dots, Y(s_{i-1}), Y(s_{i+1}), \\dots, Y(s_n)]'\\\
  )。也就是说，\\(\\mathbf{Y}_{-i}\\) 由 \\(\\mathbf{Y}\\) 中除 \\(Y(s_i)\\) 之外的所有数据组成。此外，令\
  \ \\(N(s_i)\\) 为定义 \\(s_i\\) 的 _邻域_ 的一组预设位置，\\(i = 1, \\dots, n\\)。那么，\\(D\\) 上的\
  \ CAR 模型可以如下指定：条件分布序列 \\(\\{[Y(s_i) | \\mathbf{Y}_{-i}] | i = 1, \\dots, n\\}\\\
  ) 中的每个都服从具有均值和方差的高斯分布\n\n\\[\nE[Y(s_i) | \\mathbf{Y}_{-i}] = \\sum_{s_j \\in N(s_i)}\
  \ c_{ij} Y(s_j), \\tag{9.51}\n\\]\n\n\\[\n\\text{Var}[Y(s_i) | \\mathbf{Y}_{-i}]\
  \ = \\tau_i > 0, \\tag{9.52}\n\\]\n\n其中系数 \\(c_{ij}\\) 必须满足某些条件以保证 \\(\\mathbf{Y}\\\
  ) 的联合分布存在。参见，例如，下面的条件。\n\n由于 \\( s_i \\ni N(s_i) \\)，我们定义 \\( c_{ii} = 0 \\)。此处我们使用符号\
  \ \\(\\ni\\) 表示 *不在*。此外，如果 \\( s_j \\ni N(s_i) \\)，则令 \\( c_{ij} = 0 \\)。那么，Eq.\
  \ (9.51) 可以写成\n\n\\[\nE[Y(s_i)|\\boldsymbol{Y}_{-i}] = \\sum_{j=1}^n c_{ij} Y(s_j),\
  \ \\quad i=1, \\dots, n.\n\\]\n\n令 \\(\\boldsymbol{C} = [c_{ij}]\\) 为 \\( n \\times\
  \ n \\) 系数矩阵，\\(\\boldsymbol{M} = \\text{diag}\\{\\tau_1^2, \\dots, \\tau_n^2\\\
  }\\)。Besag (1974) 表明，如果 \\(\\boldsymbol{M}^{-1}(\\boldsymbol{I} - \\boldsymbol{C})\\\
  ) 是正定的，则 CAR 模型的联合分布为\n\n\\[\n\\boldsymbol{Y} \\sim N[\\boldsymbol{0}, (\\boldsymbol{I}\
  \ - \\boldsymbol{C})^{-1}\\boldsymbol{M}].\n\\]\n\n在此 HM 框架下，给出了此类马尔可夫模型的一个示例：\n\
  \n- 数据模型：对于 \\( i=1, \\dots, n \\)，\n  \\( Z(s_i)|Y(s_i) \\sim_{\\text{ind}} \\\
  text{Po}[\\exp\\{Y(s_i)\\}] \\)，\n  其中 \\(\\text{Po}(u)\\) 表示均值为 \\( u \\) 的泊松分布。\n\
  \n- 过程模型：在 \\( \\boldsymbol{\\beta}, \\tau^2, \\phi \\) 条件下，对于 \\( \\boldsymbol{Y}\
  \ = [Y(s_1), \\dots, Y(s_n)]' \\)，\n  \\( \\boldsymbol{Y} | \\boldsymbol{\\beta},\
  \ \\tau^2, \\phi \\sim N[\\boldsymbol{X}\\boldsymbol{\\beta}, \\tau^2(\\boldsymbol{I}\
  \ - \\phi\\boldsymbol{H})^{-1}] \\)，\n  其中 \\(\\boldsymbol{X} = [x_j(s_i)]\\) 是从\
  \ \\( k \\) 维协变量 \\( x(s_i) \\) 得到的 \\( n \\times k \\) 矩阵，\\(\\boldsymbol{H}\\\
  ) 是一个已知的邻域矩阵，其对角元素为零，且如果 \\( s_j \\in N(s_i) \\) 则 \\( h_{ij} = 1 \\)，并且 \\( \\\
  phi \\) 的参数空间确保矩阵逆存在。\n\n格点过程 \\( Y(s_i) \\) 的邻域 \\( N(s_i) \\) 通常定义为所有其他位置 \\(\
  \ s_j \\ (j \\neq i) \\) 的集合，使得\n\n\\[\n[Y(s_i)|\\boldsymbol{Y}_{-i}] = [Y(s_i)|\\\
  boldsymbol{Y}[N(s_i)]], \\quad i=1, \\dots, n,\n\\]\n\n其中 \\( \\boldsymbol{Y}[N(s_i)]\
  \ = [Y(s_j) : s_j \\in N(s_i)] \\)。如果 Eq. (9.55) 的条件分布定义了 \\( \\boldsymbol{Y} \\\
  ) 的联合分布，则过程 \\( \\{Y(s)|s \\in D\\} \\) 称为 *马尔可夫随机场*（MRF）。如果进一步假设\n\n\\[\nY(s_i)|Y[N(s_i)]\
  \ \\sim \\text{Po} \\left( \\exp \\left\\{ \\alpha_i + \\sum_{s_j \\in N(s_i)} \\\
  theta_{ij} Y(s_j) \\right\\} \\right), \\quad i=1, \\dots, n,\n\\]\n\n其中 \\( \\\
  theta_{ij} = \\theta_{ji} \\)，则该模型称为 *自泊松模型*；参见 Besag (1974)。在文献中，图用于表示 Eq. (9.55)\
  \ 的条件依赖性。有兴趣的读者请参阅 Cressie and Wikle (2011, chapter 4)。如果数据是二进制的，Besag (1974) 表明，在某些条件下，\n\
  \n\\[\n[Y(s_i)|\\boldsymbol{Y}[N(s_i)]] = \\frac{\\exp\\{\\alpha_i Y(s_i) + \\sum_{s_j\
  \ \\in N(s_i)} \\theta_{ij} Y(s_i) Y(s_j)\\}}{1 + \\exp\\{\\alpha_i Y(s_i) + \\\
  sum_{s_j \\in N(s_i)} \\theta_{ij} Y(s_j)\\}}, \\quad Y(s_i) \\in \\{0, 1\\},\n\\\
  ]\n\n\\( \\theta_{ij} = \\theta_{ji} \\)。这称为 *自逻辑模型*。\n\n\n\n\n最后，考虑 \\(D = \\{(u,v)|u,v\
  \ = 0,\\pm 1,\\pm 2, ...\\} \\subset R^2\\)，即 \\(\\mathbf{s} = (u,v)\\)。*Ising 模型*由公式\
  \ (9.56) 定义，假设 (a) 参数 \\(\\alpha(u,v) = \\alpha\\)（一个常数）和 (b) \\(N(u,v) = \\{(u-1,v),(u+1,v),(u,v-1),(u,v+1)\\\
  }\\)，即 *最近邻* 结构。在这种情况下，公式 (9.56) 的分子变为\n\\[\\exp[Y(u,v)\\{\\alpha + \\theta_1[Y(u-1,v)\
  \ + Y(u+1,v)] + \\theta_2[Y(u,v-1) + Y(u,v+1)]\\}]\\]\n其中 \\(\\theta_1\\) 和 \\(\\\
  theta_2\\) 是两个参数。参见 Ising (1925)，其中 \\(\\theta_1 = \\theta_2\\)。\n\n## 9.5 空间点过程\n\
  \n另一类空间过程是空间点过程，它关注感兴趣事件在域 \\(D \\subset R^d\\) 中的随机位置 \\(\\mathbf{s}_i\\)。此外，此类事件的数量也是随机的。例如，考虑一个给定区域，如伊利诺伊州\
  \ Cook 县的一个森林保护区。设 \\(n\\) 为森林保护区中白蜡树的数量，\\(\\mathbf{s}_i\\) 为第 \\(i\\) 棵树的位置。对于任何给定区域\
  \ \\(A \\subset D\\) 及其 \\(d\\) 维面积 \\(|A|\\)。在我们的特定示例中，\\(|A|\\) 是 \\(A\\) 在森林保护区中的二维面积。设\
  \ \\(Z(A)\\) 为 A 中白蜡树的数量。那么，\\(Z(.)\\) 是一个定义在 \\(D\\) 的勒贝格可测子集上的随机过程。由于 \\(D\\)\
  \ 是有界的，因此对于所有 \\(A \\subset D\\)，\\(Z(.)\\) 都是有限的。这样的过程 \\(Z(.)\\) 是一个计数点过程。\n\n\
  点过程的一个特殊但重要的例子是 *Poisson 点过程* \\(Z(.)\\)，对于该过程，\n\\[Z(A)|\\lambda(\\mathbf{s}) \\\
  sim \\text{Poi}(\\lambda(\\mathbf{s})|A|), \\quad A \\subset D, \\quad (9.57)\\\
  ]\n\n其中 \\(\\lambda(\\mathbf{s})\\) 是强度函数，单位为每 \\(d\\) 维体积，用于衡量事件在任何位置 \\(\\mathbf{s}\
  \ \\in D\\) 出现的潜在可能性。设 \\(d\\mathbf{s}\\) 表示位于 \\(\\mathbf{s}\\) 处、体积为 \\(|d\\mathbf{s}|\\\
  ) 的小区域。那么，点过程 \\(Z(.)\\) 的一阶强度函数定义为\n\\[\\lambda(\\mathbf{s}) = \\lim_{|d\\mathbf{s}|\\\
  to 0} \\frac{E[Z(d\\mathbf{s})]}{|d\\mathbf{s}|}, \\quad \\mathbf{s} \\in D, \\\
  quad (9.58)\\]\n\n前提是极限存在。因此，\n\\[E[Z(A)] = \\int_A \\lambda(\\mathbf{s}) d\\mathbf{s},\
  \ \\quad A \\subset D. \\quad (9.59)\\]\n\n空间点过程的统计推断关注 \\(\\lambda(\\mathbf{s})\\\
  ) 在 \\(\\mathbf{s} \\in D\\) 上的演变。如果 \\(\\lambda(\\mathbf{s}) = \\lambda_0\\) 是一个常数，则该点过程是齐次的。在这种情况下，\\\
  (\\lambda\\) 可以通过某些非参数核方法进行估计。例如，参见 Diggle (1985)。另一方面，如果 \\(\\lambda(\\mathbf{s})\\\
  ) 是 \\(\\mathbf{s}\\) 处可用的某些协变量 \\(\\mathbf{x}(\\mathbf{s})\\) 的函数，那么我们就有一个 *非齐次\
  \ Poisson 点过程*。\n\n例如 Poisson 点过程的空间点过程推断可以以与 HM 下先前讨论的其他空间过程类似的方式进行。\n\n- 数据模型：给定\
  \ \\(\\lambda(.)\\) 时，\\(Z(.)\\) 是强度为 \\(\\lambda(.)\\) 的非齐次 Poisson 点过程。\n- 过程模型：给定\
  \ \\(\\beta\\) 和 \\(C_Y(\\cdot, \\cdot)\\) 时，\\(Y(\\cdot) = \\log(\\lambda(\\cdot))\\\
  ) 是一个高斯过程，使得\n\n\\(E[Y(\\boldsymbol{s})] = \\boldsymbol{x}(\\boldsymbol{s})' \\\
  boldsymbol{\\beta}, \\quad C_Y(\\boldsymbol{s}_1, \\boldsymbol{s}_2) = \\text{Cov}[Y(\\\
  boldsymbol{s}_1), Y(\\boldsymbol{s}_2)],\\)\n\n其中，如同之前一样，\\(\\boldsymbol{x}(\\boldsymbol{s})\\\
  ) 表示 \\(\\boldsymbol{s}\\) 处的协变量向量。\n\n### 9.5.1 二阶强度\n\n为建模空间点过程的空间相互作用，通常使用二阶强度函数。参见\
  \ Cressie (1993)。对于 \\(\\boldsymbol{u}, \\boldsymbol{v} \\in D\\)，二阶强度定义为\n\n\\\
  (\\lambda_2(\\boldsymbol{u}, \\boldsymbol{v}) = \\lim_{|d\\boldsymbol{u}| \\to 0,\
  \ |d\\boldsymbol{v}| \\to 0} \\frac{E[Z(d\\boldsymbol{u})Z(d\\boldsymbol{v})]}{|d\\\
  boldsymbol{u}||d\\boldsymbol{v}|}, \\quad \\boldsymbol{u}, \\boldsymbol{v} \\in\
  \ D, \\quad (9.60)\\)\n\n前提是极限存在。当 \\(\\lambda(\\boldsymbol{u}, \\boldsymbol{v})\\\
  ) 存在时，由以下定义的双点相关函数\n\n\\(g(\\boldsymbol{u}, \\boldsymbol{v}) = \\frac{\\lambda_2(\\\
  boldsymbol{u}, \\boldsymbol{v})}{\\lambda(\\boldsymbol{u})\\lambda(\\boldsymbol{v})},\
  \ \\quad (9.61)\\)\n\n通常用于描述空间点过程的空间相关性。\n\n假设 \\(Z(.)\\) 是平稳且各向同性的，则 \\(\\lambda(\\\
  boldsymbol{s}) = \\lambda_*\\) 是一个常数，并且\n\n\\(\\lambda_2(\\boldsymbol{u}, \\boldsymbol{v})\
  \ = \\lambda_*^2(||\\boldsymbol{u} - \\boldsymbol{v}||), \\quad \\boldsymbol{u},\
  \ \\boldsymbol{v} \\in D.\\)\n\n在这种情况下，双点相关函数变为\n\n\\(g^*(h) = \\frac{\\lambda_*^2(h)}{\\\
  lambda_*^2}, \\quad h > 0.\\)\n\nStoyan 和 Stoyan (1994) 表明，当相距 \\(h\\) 的事件很少发生时，\\\
  (g^*(h)\\) 取较小值；当相距 \\(h\\) 的事件频繁出现时，\\(g^*(h)\\) 取较大值。对于齐次点泊松过程，\\(g^*(h) = 1\\\
  )。\n\n对于平稳且各向同性的空间点过程，还有另一种空间依赖度量，称为 \\(K\\) 函数。参见 Bartlett (1964) 和 Ripley (1976)。有兴趣的读者可参阅\
  \ Cressie and Wikle (2011) 以获取更多讨论。\n\n### 示例 9.1\n\n本节使用 R 包 gstat。该包可用于执行变函数建模、本章讨论的各种克里金方法以及空间绘图。使用的命令包括\
  \ variogram（用于从数据或拟合线性模型的残差中计算样本变函数）、fit.variogram（用于将参数变函数拟合到样本变函数）和 krige（用于执行克里金）。有关详细信息，请参见附带的\
  \ R 命令，其中我们省略了一些输出以节省空间。该包的一个良好参考是 R vignette (Pebesma, 2019)。考虑包 sp 中的 Meuse 河数据集。参见第\
  \ 9.1 节中的示例。图 9.9 显示了锌浓度的气泡图。与图 9.1 中的 Meuse 河图相比，可以清楚地看出，位置越靠近河流，锌浓度越高。图 9.10(a)\
  \ 显示了 log(zinc) 的样本半变函数，\n\n锌浓度 (ppm)\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_514_0.png)\n\

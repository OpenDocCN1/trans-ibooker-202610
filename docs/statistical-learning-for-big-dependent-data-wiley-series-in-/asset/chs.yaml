  ### 示例 7.10\n\n为了展示使用高频数据改善对感兴趣低频变量预测的效果，我们考虑一个简单的应用。图 7.30 显示了 2006 年 1 月 1 日至\
  \ 2015 年 12 月 31 日台湾高雄市某监测站每日最大 PM2.5 测量值的平方根变换的时间图。数据可在文件 TaiwanPM25.csv（监测站 1）中获取，为简单起见，2\
  \ 月 29 日的数据已被删除。从图中可以看出，如预期，存在明显的年度周期。我们采用平方根变换是因为每日最大 PM2.5 服从非高斯分布。我们保留最后两年作为预测子样本，我们的目标是证明，使用前几个小时的\
  \ PM2.5 测量值可以显著提高对 $y_t$ 的预测，相比于仅使用 $y_t$ 滞后值作为预测变量的 AR 模型。\n\n\n\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_432_0.png)\n\
  \n图 7.30 2006 年 1 月 1 日至 2015 年 12 月 31 日台湾高雄市某监测站每日最大 PM$_{2.5}$ 测量值平方根变换的时间序列图。2\
  \ 月 29 日的数据已被删除。\n\n具体而言，我们将数据分为估计子样本和预测子样本，预测子样本包含最后 730 个观测值。估计子样本有 2920 个数据点。AIC\
  \ 为 $y_t$ 选择了 AR(22) 模型，该模型确实拟合了数据。参见图 7.31 所示的模型检验统计量。例如，残差 Q-统计量未能拒绝残差中不存在序列相关性的原假设。\n\
  \n对于即时预测（nowcasting），我们采用以下模型\n\n```\n$y_t = \\phi_0 + \\sum_{i=1}^{22} \\phi_i\
  \ y_{t-i} + \\sum_{j=1}^{q} \\beta_j x_{t,j} + \\epsilon_t,$ (7.59)\n```\n\n其中 $q\
  \ = 1, ..., 6$，$x_{t,j}$ 表示每日第 $j$ 小时观测到的 PM$_{2.5}$ 的平方根变换。$q$ 的最大值为 6，表示可以在每天早晨\
  \ 6 点更新 $y_t$ 的预测。模型 Eq. (7.59) 是一个简单的 ARX 模型，非常容易估计。表 7.2 总结了样本外预测的结果，其中 AR(22)\
  \ 作为比较基准，AR(22)+q 表示即时预测中使用了前 q 个小时的数据。从表中可以清楚地看出，在即时预测中使用每小时数据确实相对于基准在样本外预测中提供了改进。本示例的\
  \ R 脚本如下。\n\n#### 示例 7.10 的 R 脚本：\n\n```\nda <- read.csv(\"TaiwanPM25.csv\",header=TRUE)\n\
  st1 <- sqrt(da[,4]) # Square-root transformation\ny <- NULL; X <- NULL# Find daily\
  \ maximum and first 6 hours data\nfor (i in 1:3650){\nist <- (i-1)*24+1\niend <-\
  \ i*24\ny <- c(y,max(st1[ist:iend]))\n```\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_433_0.png)\n\
  \n图 7.31 2006 年 1 月 1 日至 2015 年 12 月 31 日台湾高雄市某监测站每日最大 PM$_{2.5}$ 测量值平方根变换的标量 AR(22)\
  \ 模型检验。2 月 29 日的数据已被删除。\n\n#### 表 7.2 高雄市某站每日最大 PM$_{2.5}$ 平方根变换的样本外预测汇总统计量\n\n\
  | 模型 | 偏差 | RMSE | MAE |\n|---|---|---|---|\n| AR(22)+0 | −0.0991 | 1.145 | 0.886\
  \ |\n| AR(22)+1 | 0.0778 | 1.015 | 0.783 |\n| AR(22)+2 | 0.0135 | 0.985 | 0.760\
  \ |\n| AR(22)+3 | −0.0319 | 0.949 | 0.731 |\n| AR(22)+4 | −0.0045 | 0.917 | 0.697\
  \ |\n| AR(22)+5 | 0.0096 | 0.913 | 0.693 |\n| AR(22)+6 | −0.0050 | 0.884 | 0.683\
  \ |\n\n在表中，AR(22)+q 表示即时预测中使用了前 q 个小时的数据，Bias、RMSE 和 MAE 分别是平均偏差、均方根预测误差和平均绝对预测误差。\n\
  \n```\nX <- rbind(X, st1[ist:(ist+5)])\n}\nm1 <- ar(y)\np <- m1$order\np\nist <-\
  \ p+1\nnT <- 3650\nY <- y[ist:nT]\nZ <- NULL\nfor (i in 1:p) {\nZ <- cbind(Z, y[(ist-i):(nT-i)])\n\
  }\nnobe <- nT-p\nnfit <- nobe-730\nZfit <- Z[1:nfit,]\nYfit <- Y[1:nfit]\nZtest\
  \ <- Z[(nfit+1):nobe,]\nYtest <- Y[(nfit+1):nobe]\nm2 <- lm(Yfit~.,data=data.frame(Zfit))\
  \ #AR(22) model\npm2 <- predict(m2,newdata=data.frame(Ztest))\ns1 <- mean(Ytest-pm2)\n\
  s2 <- sqrt(mean((Ytest-pm2)^2))\ns3 <- mean(abs(Ytest-pm2))\nM <- c(s1,s2,s3)\n\
  #### select the corresponding time period.\nX1 <- X[ist:nT,] # Nowcasting\nfor (i\
  \ in 1:6) {\nZfitnow <- cbind(Zfit,X1[1:nfit,1:i])\nZtestnow <- cbind(Ztest,X1[(nfit+1):nobe,1:i])\n\
  m3 <- lm(Yfit~.,data=data.frame(Zfitnow))\npm3 <- predict(m3,newdata=data.frame(Ztestnow))\n\
  s1 <- mean(Ytest-pm3)\ns2 <- sqrt(mean((Ytest-pm3)^2))\ns3 <- mean(abs(Ytest-pm3))\n\
  M <- rbind(M,c(s1,s2,s3))\n}\nprint(M)\n```\n\n## 7.8 强序列依赖\n\n本章讨论的大多数方法在数据存在强序列相关性的情况下可能失效。例如，参见第\
  \ 7.1 节关于 Lasso 的讨论以及第 7.3 节中的条件。当存在强序列依赖时必须谨慎处理。但是，如果数据维度较高，处理强序列相关性并没有唯一方法。事实上，当数据具有强时相依赖性时，关于正则化估计性质的许多重要问题仍然悬而未决。理想情况下，基于可用的理论依据，人们希望将具有强序列依赖性的观测数据转换为具有短程依赖性的观测数据，以便本章讨论的方法可加以应用。对于多元时间序列，第\
  \ 3 章讨论的协整方法和第 6 章的动态因子模型可能有用。然而，在 HDTS 分析中如何分析协整过程仍在研究中。在本节中，我们考虑了两种处理强序列依赖下 HDTS\
  \ 的方法。第一种方法是对观测序列拟合带有一定正则化的 VAR(1) 模型，然后在后续分析中使用残差。只要任何单位根的重数为一，这种方法应该能够合理地工作。事实上，大多数宏观经济时间序列都是\
  \ I(1) 过程，即它们具有一个单位根。我们注意到，通常不是对个别时间序列进行差分以实现边际平稳的好主意，因为如第 3 章所讨论，这可能导致过度差分，进而引入不可逆时间序列。第二种方法是对所使用的任何统计模型进行残差分析。有限经验表明，欠差分和过度差分都容易导致残差中的序列相关性。因此，适当的残差分析可以检测强序列依赖的错误处理。\n\
  \n最后，一些关于高维单位根时间序列建模的最新研究包括 Zhang et al. (2019)，他们通过特征值分析研究识别协整，以及 Gao and Tsay\
  \ (2020)，他们研究高维单位根时间序列建模。\n\n## 练习\n\n- 1. 考虑第 7.3 节中使用的月度宏观经济数据集。感兴趣的因变量是通胀，即所有项目消费者价格指数\

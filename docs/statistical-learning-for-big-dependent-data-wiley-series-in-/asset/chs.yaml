  bic = -39.27051\n\n## 3.4 平稳 VARMA 模型\n\n### 3.4.1 VAR 模型是否足够？\n\nVAR 模型在多元时间序列分析中被广泛使用，原因多种多样。首先，它相对简单。该模型可以通过\
  \ OLS 方法估计，因此并不严重依赖正态性假设。其次，它避免了 VARMA 模型（公式 3.1）所遇到的可识别性困难。另一方面，VAR 模型也存在一些弱点。首先，如第\
  \ 2.2.4 节中标量情况所示，AR 模型类并不封闭，因为两个 AR 过程的线性组合通常不是 AR 过程。相同结果适用于向量情况。其次，VAR 模型可能无法产生简洁的参数化。当维度\
  \ $k$ 较大时尤其如此。为了说明，请考虑一个二维 VMA 过程\n\n$z_t = (I - \\theta B)a_t, \\quad \\theta =\
  \ \\left[ \\begin{matrix} 0.2 & 0.3 \\\\ -0.6 & 1.1 \\end{matrix} \\right], \\quad\
  \ \\Sigma_a = I_2.$\n\n很容易看出 $\\theta$ 的两个特征值为 0.8 和 0.5，因此 $z_t$ 是一个可逆时间序列。$z_t$\
  \ 的 VAR 表达式为\n\n$z_t = a_t + \\theta_1 z_{t-1} + \\theta^2 z_{t-2} + \\theta^3 z_{t-3}\
  \ + \\cdots .$\n\n还可以轻松计算得出\n\n$\\theta^6 \\approx \\left[ \\begin{matrix} -0.23\
  \ & 0.25 \\\\ -0.49 & 0.51 \\end{matrix} \\right], \\quad \\theta^7 \\approx \\\
  left[ \\begin{matrix} -0.19 & 0.20 \\\\ -0.40 & 0.41 \\end{matrix} \\right] .$\n\
  \n因此，建模 $z_t$ 时需要一个 VAR($p$) 模型且 \\( p \\ge 7 \\) 才能提供良好的近似。所使用的 AR 系数数量将超过 28 个，而数据生成过程的系数数量仅为\
  \ 4 个。\n\n在实际应用中，使用 VAR 模型还是 VARMA 模型取决于所研究问题的维度和样本量。如果维度 \\( k \\) 不大，例如 \\( k\
  \ \\le 10 \\)，则可以使用 VARMA 模型。对于其他情况，通常偏好 VAR 模型，因为其在理解数据动态结构和估计方面都很简单。我们将在后面讨论高维时间序列的\
  \ VARMA 模型。\n\n### 3.4.2 VARMA 模型的性质\n\n以下总结了公式 (3.1) 中 VARMA 模型的关键属性：\n\n- 稳定性条件：行列式方程\
  \ \\( |\\phi(B)| = 0 \\) 的所有零点的绝对值均大于 1。\n  平稳 VARMA 模型的 VMA 表达式为\n  \\[\n  z_t\
  \ = \\mu + a_t + \\sum_{i=1}^{\\infty} \\psi_i a_{t-i},\n  \\]\n  (3.60)\n  其中 \\\
  (\\mu = E(z_t)\\) 且 \\(\\psi\\)-权重系数 \\(\\psi_i\\) 由 \\([\\phi(B)]^{-1}\\theta(B)\
  \ = \\psi(B) = I + \\sum_{i=1}^{\\infty} \\psi_i B^i\\) 给出。\n\n- 可逆性条件：行列式方程 \\\
  ( |\\theta(B)| = 0 \\) 的所有零点的绝对值均大于 1。\n  可逆 VARMA 模型的 VAR 表达式为\n  \\[\n  z_t =\
  \ c + \\sum_{i=1}^{\\infty} \\pi_i z_{t-i} + a_t,\n  \\]\n  (3.61)\n  其中 \\(c =\
  \ [\\theta(1)]^{-1}c_0\\) 且 \\(\\pi\\)-权重系数矩阵 \\(\\pi_i\\) 由 \\(\\pi(B) = I - \\\
  sum_{i=1}^{\\infty} \\pi_i B^i = [\\theta(B)]^{-1}\\phi(B)\\) 给出。\n\n- 矩条件：对于公式\
  \ (3.1) 的平稳 VARMA 过程 \\( z_t \\)，我们有\n  - \\( E(z_t) = \\mu \\) 使得 \\( \\phi(1)\\\
  mu = c_0 \\)。即，\\( \\mu = [\\phi(1)]^{-1}c_0 \\)。\n  - \\( \\Gamma_z(\\ell) = \\\
  sum_{i=1}^p \\phi_i \\Gamma_z(\\ell-i) - \\sum_{j=\\ell}^q \\theta_j \\Sigma_a \\\
  psi'_{\\ell-j} \\)，对于 \\( \\ell = 1, \\dots, q \\)，其中 \\( \\psi_0 = I \\)。\n  -\
  \ \\( \\Gamma_z(\\ell) = \\sum_{i=1}^p \\phi_i \\Gamma(\\ell-i) \\) 对于 \\( \\ell\
  \ > q \\)。\n\n如果将第 3 个矩条件针对 \\( \\ell = q + 1, \\dots, q + p \\) 联合考虑，则我们将得到 \\\
  ( p \\) 个矩条件组成的系统，这被称为 VARMA(\\( p, q \\)) 模型的 *广义 Yule-Walker 方程*。\n\n### 3.4.3\
  \ VARMA 过程建模\n\nVARMA 过程建模的文献中有多种可用方法。Tiao 和 Tsay (1983) 提出的一种方法是拟合一个大型 VAR，以提供残差的一致估计，并利用这些估计残差来确定\
  \ MA 阶数。他们提出使用扩展交叉相关系数表来获取 ARMA 过程的阶数。第二种方法基于由研究过程过去和未来组成的两个长时间序列向量的协方差矩阵结构（称为汉克尔矩阵），并利用汉克尔矩阵及其相关\
  \ Kronecker 指数的性质来确定模型。参见 Akaike (1976)、Hannan and Deistler (1988) 和 Tsay (1991)。第三种方法是\
  \ Tiao 和 Tsay (1989) 提出的标量分量模型 (SCMs)，它们是具有特定结构的时间序列的线性组合。例如，SCMs 的一个重要概念是白噪声序列。设\
  \ \\(\\boldsymbol{v}\\) 为一个 \\(k\\) 维非零实向量。线性组合 \\(w_t = \\boldsymbol{v}' \\boldsymbol{z}_t\\\
  ) 称为阶数 \\((0,0)\\) 的 SCM，记为 \\(\\text{SCM}(0,0)\\)，如果 \\(w_t\\) 与 \\(\\boldsymbol{z}_t\\\
  ) 的所有滞后值不相关，因此是一个白噪声过程。换句话说，对于 \\(j \\ge 1\\)，\\(\\text{corr}(w_t, \\boldsymbol{z}_{t-j})\
  \ = \\boldsymbol{0}\\)。因此，\\(\\text{SCM}(0,0) w_t\\) 的存在意味着 \\(\\boldsymbol{z}_t\\\
  ) 的线性组合与 \\(F_{t-1}\\)（即 \\(t-1\\) 时刻可用的信息）不相关。\\(\\text{SCM}(0,0) w_t\\) 可用于简化模型说明。事实证明，\\\
  (\\text{SCM}(0,0)\\) 在时间序列数据的因子模型中也很有用，有关讨论见第 6 章。VARMA 建模的一个有用工具是典型相关分析。Tiao 和\
  \ Tsay (1989) 使用此工具来搜索 \\(\\text{SCM}(0,0)\\) 的数量及其相关线性向量。有关这些方法的介绍，请参见 Tsay (2014)。\n\
  \n### 3.4.4 VARMA 模型的应用\n\n一旦为向量时间序列构建了 VARMA 模型，即可使用该模型进行统计推断。如果对各分量序列之间的关系感兴趣，则可以使用\
  \ VMA 表达式中的 \\(\\boldsymbol{\\psi}\\)-权重系数矩阵来获得 *脉冲响应函数*，这与 VAR 模型中讨论的类似。在计量经济学文献中，这类研究被称为\
  \ *乘数研究*。它在政策决策和模拟中发挥着重要作用。\n\nVARMA 模型的另一个应用是预测。所涉及的思想和计算与第 2 章讨论的单变量时间序列类似。假设预测起点为\
  \ \\(t = n\\)。设 \\(F_n\\) 表示 \\(t = n\\) 时可用的信息，\\(h\\) 为预测起点，则\n\n\\(\\hat{z}_n(h)\
  \ = E(z_{n+h}|F_n) = c_0 + \\sum_{i=1}^p \\Phi_i \\hat{z}_n(h-i) - \\sum_{j=1}^q\
  \ \\theta_j \\hat{a}_n(h-j), \\quad (3.62)\\)\n\n其中\n\n\\(\\hat{z}_n(\\ell) = \\\
  begin{cases} \\hat{z}_n(\\ell) & \\text{如果 } \\ell > 0, \\\\ z_{n-\\ell} & \\text{如果\
  \ } \\ell \\le 0, \\end{cases} \\quad \\hat{a}_n(\\ell) = \\begin{cases} \\mathbf{0}\
  \ & \\text{如果 } \\ell > 0, \\\\ a_{n-\\ell} & \\text{如果 } \\ell \\le 0. \\end{cases}\\\
  )\n\n相关的预测误差为\n\n\\(e_n(h) = z_{n+h} - \\hat{z}_n(h) = a_{n+h} + \\sum_{i=1}^{h-1}\
  \ \\psi_i a_{n+h-i},\\)\n\n因此，预测误差的协方差矩阵为\n\n\\(\\text{Cov}[e_n(h)] = \\Sigma_a\
  \ + \\sum_{i=1}^{h-1} \\psi_i \\Sigma_a \\psi_i',\\)\n\n\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_164_0.png)\n\
  \n图 3.11 1992 年 1 月至 2018 年 12 月中国和美国月度出口和进口对数系列的时间图。原始数据来自 FRED，单位为美元。左侧面板显示出口系列，上部图表为中国。来源：联邦储备经济数据（FRED）。\n\
  \n这里默认我们将模型视为已知，\\(\\psi_t\\) 是方程 (3.60) 的 \\(\\psi\\)-权重系数矩阵。在实践中，预测值和预测误差的协方差矩阵可以递归计算。\n\
  \n### 示例 3.3\n\n考虑 1992 年 1 月至 2018 年 12 月中国和美国的月度出口和进口。数据从 FRED 下载，单位为美元且已季节调整。我们取自然对数变换，变换后的数据存储在文件\
  \ m-expimpcnus.csv 中。图 3.11 显示了四个对数时间序列的时间图，其中左侧面板显示出口，上部图表为中国。正如预期，这些图表证实了两国国际贸易的上升趋势。因此，我们进行一阶差分。设\
  \ \\(z_t = (\\text{exp-CN}_t, \\text{exp-US}_t, \\text{imp-CN}_t, \\text{imp-US}_t)'\\\
  ) 为月度国际贸易的增长系列。\\(z_t\\) 系列如图 3.12 所示。从图中可以看出存在一些异常观测值，但为简化起见，我们不考虑对这些离群值进行任何处理。\n\
  \n遵循 Tsay (2014, 第 3 章) 的建模方法，我们使用 Tiao 和 Tsay (1983) 的扩展互相关矩阵来确定 VARMA 阶数。输出细节见附带的\
  \ R 输出。对于本例，指定了 VARMA(1,2) 模型。最大似然估计（MLE）表明，拟合的 VARMA(1,2) 模型中存在许多不显著的估计值，因此我们通过同时移除所有绝对\
  \ t 值小于 0.8 的估计值来精炼模型。得到的模型是\n\n```\nz_t = \\begin{bmatrix} 0.01 \\\\ 0 \\\\ 0.01\
  \ \\\\ 0 \\end{bmatrix} + \\begin{bmatrix} -0.18 & 0 & 0 & 0.45 \\\\ 0.28 & -0.27\
  \ & 0 & 0.28 \\\\ 0 & 0.27 & -0.53 & 0 \\\\ 0.14 & 0.07 & 0.29 & 0 \\end{bmatrix}\
  \ z_{t-1} + a_t \\\\ - \\begin{bmatrix} 0.49 & 0 & -0.02 & 0 \\\\ 0.27 & 0 & 0 &\
  \ 0 \\\\ 0 & 0 & 0 & -0.37 \\\\ 0.13 & 0 & 0.23 & 0 \\end{bmatrix} a_{t-1} + \\\
  begin{bmatrix} 0 & 0.22 & -0.06 & 0.63 \\\\ 0.20 & -0.22 & 0 & 0.32 \\\\ 0 & 0.36\
  \ & -0.28 & 0.57 \\\\ 0.06 & 0 & 0.18 & 0 \\end{bmatrix} a_{t-2}\n```\n\n且 \\(a_t\\\
  ) 的协方差矩阵为\n\n```\n\\hat{\\Sigma}_a = 10^{-3} \\begin{bmatrix} 2.987 & 0.182 & 1.325\
  \ & 0.108 \\\\ 0.182 & 0.447 & 0.346 & 0.205 \\\\ 1.325 & 0.346 & 3.448 & 0.253\
  \ \\\\ 0.108 & 0.205 & 0.253 & 0.424 \\end{bmatrix}\n```\n\n模型检验表明，残差系列在季节性滞后 12\
  \ 处存在一些互相关，表明仍有一些季节性。然而，前 10 个滞后没有显著的序列相关。\n\n从拟合模型来看，四个国际贸易系列是相互关联的。这由模型的脉冲响应函数证实；见图\
  \ 3.13。然而，脉冲响应函数显示，中国进口对其他系列的依赖性相当弱。模型还显示，中国的出口和进口系列具有显著的常数项，支持了这样的普遍看法：过去二十年中国经济的强劲增长大大增加了其国际贸易。两个中国系列的波动性也大于美国的系列。\n\
  \n最后，拟合模型可用于生成预测。在本例中，四个系列的 1 步先行预测值分别为 0.063(0.055)、−0.001(0.021)、0.091(0.059)\
  \ 和 −0.021(0.021)，其中括号内的数字表示预测标准误。尽管近似 95% 预测区间包含零，但预测表明，尽管与美国存在贸易战，中国的出口和进口仍将继续增长。事实上，CNBC\
  \ 于 2019 年 2 月 13 日报道，1 月份中国出口较去年同期增长 9.1%，而进口下降 1.5%。在本例中，拟合模型似乎能够提供合理的预测。\n\n\

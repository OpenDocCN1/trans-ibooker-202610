  \ s1$BIC\n贝叶斯信息准则（BIC）：\n```\n        EII     VII     EEI     VEI     EVI     VVI\
  \     EEE\nEII 3 7209.426 7224.402 7322.735 7341.534 7306.48 7317.736 7298.159\n\
  EVE     VEE     VVE     EEV     VEV     EVV     VVV\n3 7342.181 7303.551 7362.747\
  \ 7297.843 7299.565 7266.905 7255.187\nTop 3 models based on the BIC criterion:\n\
  VVE,3   EVE,3   VEI,3\n7362.747 7342.181 7341.534\n> pp=s1$parameters\n> pp$mean\n\
  \        [,1]          [,2]          [,3]\n[1,]  0.19604984  0.10948809  0.007026086\n\
  [2,] -0.01327302 -0.07975918 -0.078649900\n[3,] -0.05420812 -0.08667588 -0.049024126\n\
  [4,] -0.08677588 -0.04970037 -0.027687299\n[5,] -0.05664926 -0.02840346 -0.023241266\n\
  ```\n\n图 5.25 显示了程序 mclustBIC 的输出，其中包含不同数量的组和协方差矩阵结构的 BIC 值（与后验概率成正比）。当组数为三且协方差矩阵为\
  \ VVE（椭圆型，特征值和特征向量取决于组）、EVE（椭圆型，特征值取决于组但特征向量相同）和 VEI（对角型，方差取决于组）时，出现最大的后验概率或 BIC\
  \ 值。如预期，它们根据自相关的强度将系列分开。概率最高的模型 VVE,3 有三组和用于自相关系数的一般协方差矩阵。\n\n### 5.3.4 基于投影的聚类\n\
  \n当特征向量 _x<sub>i</sub>_ 的维度 _p_ 和系列数量 _k_ 很高，且 _k > p_ 时，将特征向量投影到一个较低维度的子空间上以便轻松进行聚类将是有益的。寻找一个有助于总结高维数据的低维投影空间的想法，被\
  \ Friedman 和 Tukey (1974) 称为“_投影追踪_”。\n\nPeña 和 Prieto (2001) 提出了一种基于通过最大化或最小化峭度获得的方向的一维投影追踪算法\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_281_0.png)\n\n图 5.25 台湾 AirBox 数据不同组数和协方差结构的\
  \ BIC 值。\n\n投影数据的峭度系数。最小化峭度系数意味着最大化投影的双峰性，而最大化峭度系数意味着检测投影中与数据主体明显分离的异常值组。寻找双峰性会导致将样本分成两个大簇以供进一步分析。相对于中心分布寻找异常值组会导致识别出沿某些特定投影与其余数据明显分离的小簇。他们证明，如果数据是由具有相同协方差矩阵的两个正态分布的混合生成的，那么最小化峭度的方向就是我们将在第\
  \ 5.5 节中讨论的 Fisher 最佳线性判别方向。他们还展示了这些方向的其他最优性性质，当数据来自多个椭圆分布的混合时。基于这些结果，他们提出了一种迭代程序，在该程序中，数据被投影到这些极端峭度方向上，并沿着它们进行一维簇搜索。我们下面简要描述我们的算法，详细内容可见\
  \ Peña 和 Prieto (2001)，以及关于讨论投影峭度的截断值和最大化或最小化优化方法的内容。\n\n投影方向 \\(\\boldsymbol{d}_s\\\
  ) 通过以下步骤获得。从 \\(s = 1\\) 开始，令 \\(\\boldsymbol{y}_i^{(1)} = \\boldsymbol{x}_i\\)\
  \ 并定义\n\n```\n\\(\\bar{\\boldsymbol{y}}^{(s)} = \\frac{1}{k} \\sum_{i=1}^k \\boldsymbol{y}_i^{(s)}\
  \ ,\\)\n\n\\(\\boldsymbol{S}_s = \\frac{1}{(k-1)} \\sum_{i=1}^k [\\boldsymbol{y}_i^{(s)}\
  \ - \\bar{\\boldsymbol{y}}^{(s)}][\\boldsymbol{y}_i^{(s)} - \\bar{\\boldsymbol{y}}^{(s)}]'.\\\
  )\n```\n\n- 1. 找到一个求解以下问题的方向 \\(\\boldsymbol{d}_s\\)\n\n```\n\\(\\max \\quad s(\\\
  boldsymbol{d}_s) = \\frac{1}{k} \\sum_{i=1}^k (\\boldsymbol{d}_s'\\boldsymbol{y}_i^{(s)}\
  \ - \\boldsymbol{d}_s'\\bar{\\boldsymbol{y}}_s)^4\\)\n\ns.t. \\(\\boldsymbol{d}_s'\\\
  boldsymbol{S}_s \\boldsymbol{d}_s = 1,\\)\n(5.44)\n```\n\n即，一个最大化投影数据峭度系数的方向。\n\n\
  - 2. 将观测值投影到与方向 \\(\\mathbf{d}_1, \\dots, \\mathbf{d}_s\\) 为 \\(\\mathbf{S}_s\\\
  )-正交的子空间上。如果 \\(s < p\\)，定义\n\n  \\(\\mathbf{y}_i^{(s+1)} = (\\mathbf{I} - \\mathbf{d}_s\
  \ \\mathbf{d}_s' \\mathbf{S}_s) \\mathbf{y}_i^{(s)},\\)\n\n  令 \\(s \\leftarrow\
  \ s + 1\\) 并通过重复步骤 1 计算一个新方向。否则，停止。\n\n- 3. 通过重复步骤 1 和 2 计算另一组 \\(p\\) 个方向 \\(\\\
  mathbf{d}_{p+1}, \\dots, \\mathbf{d}_{2p}\\)，但现在 Eq. (5.44) 中的目标函数被最小化而不是最大化。\n\n\
  请注意，在每个步骤 \\(s\\)（\\(s > 1\\)）中，找到的方向与前一个方向为 \\(\\mathbf{S}_s\\)-正交（而不仅仅是正交）。做出此选择是为了确保算法的每个步骤都是仿射等价的，因此完整的程序（有关详细信息，请参见\
  \ Peña 和 Prieto, 2001）。\n\n投影数据中的组搜索是使用一阶间隙或间隔进行的，它们是顺序统计量之间的差异。当我们在一个投影中找到一个足够大的一阶间隙时，我们认为一组时间系列可以分为两个簇。在测试间隙中的显著值之前，我们首先标准化投影数据，并使用标准一元正态分布函数\
  \ \\(\\Phi\\) 的逆函数将这些观测值进行变换。这样，如果投影数据服从正态分布，则变换后的数据将呈均匀分布。然后我们可以利用这样一个事实：对于均匀数据，间隔是同分布的。用于识别显著间隙的结果算法已按如下方式实现：\n\
  \n- 1. 对于每个方向 \\(\\mathbf{d}_s, s = 1, \\dots, 2p\\)，计算原始观测值的一元投影 \\(u_{si} = \\\
  mathbf{x}'_i \\mathbf{d}_s\\)。\n- 2. 标准化这些观测值，\\(p_{si} = (u_{si} - m_s)/s_s\\)，其中\
  \ \\(m_s = \\sum_i u_{si}/k\\) 且 \\(s_s = \\sum_i (u_{si} - m_s)^2 / (k-1)\\)。\n\
  - 3. 对每个 \\(s\\) 值对投影 \\(p_{si}\\) 进行排序，以获得顺序统计量 \\(p_{s(i)}\\)，并使用标准正态分布函数的逆函数\
  \ \\(p_{si} = \\Phi^{-1}(p_{s(i)})\\) 对其进行变换。\n- 4. 计算连续值之间的间隔，\\(w_{si} = p_{s,i+1}\
  \ - p_{si}\\)。\n- 5. 在 \\(w_{si}\\) 中搜索显著间隙的存在。这些较大的间隔将是存在多个簇的指示。特别是，我们引入一个阈值 \\\
  (\\kappa = \\nu(c)\\)，其中 \\(\\nu(c) = 1 - (1 - c)^{1/k}\\) 表示间隔分布的 \\(c\\) 百分位数，定义\
  \ \\(i_{0s} = 0\\) 和\n\n  \\(r = \\inf_j \\{ k > j > i_{0s} : w_{sj} > \\kappa \\\
  }.\\)\n\n  如果 \\(r \\neq 0\\) 且一个或多个间隔 \\(w_{sj}\\) 大于 \\(\\kappa\\)，则在此方向中已检测到几个可能的簇，转到步骤\
  \ 6。否则，转到下一个投影方向。\n\n- 6. 将所有满足 \\(p_{sl} \\le p_{sr}\\) 的观测值 \\(l\\) 标记为属于与 \\\
  (p_{sl} > p_{sr}\\) 所具有的簇不同的簇。令 \\(i_{0s} = r\\) 并重复步骤 5。\n\n请注意，在每个方向中，如果存在 \\\
  (n\\) 个大于阈值的间隔，则检测到 \\(n + 1\\) 个组。这应用于所有 \\(2p\\) 个方向。在完成间隙分析后，算法执行最后一步\n\n\n通过使用马氏距离，将数据中已识别簇内的观测值重新分配。簇按大小排序，使得\
  \ \\(n_1 \\ge n_2 \\ge \\cdots \\ge n_G\\)，并且观测值被标记，使得前 \\(n_1\\) 个属于第一组，最后 \\(n_G\\\
  ) 个属于第 \\(G\\) 组。然后，从最大的簇开始，对于 \\(g = 1, \\dots, G\\)，计算簇中观测值的均值 \\(\\boldsymbol{m}_g\\\
  ) 和协方差矩阵 \\(\\boldsymbol{S}_g\\)，以及所有未分配给该簇 \\(g\\) 的观测值的马氏距离 \\(\\delta_j = (\\\
  boldsymbol{x}_j - \\boldsymbol{m}_j)^t \\boldsymbol{S}_g^{-1} (\\boldsymbol{x}_j\
  \ - \\boldsymbol{m}_j)\\)。如果此簇外的任何观测值满足 \\(\\delta_j \\le \\chi^2_{p, 0.99}\\)，则将该观测值添加到簇中。该程序在\
  \ Peña and Prieto (2001) 提出的 Monte Carlo 结果中似乎在 \\(p < k\\) 时优于 \\(k\\)-means 和\
  \ MCLUST。然而，当 \\(p\\) 很大时，由于算法计算变量的协方差矩阵，其性能可能会下降，除非 \\(k/p\\) 适中，比方说大于 10。\n\n\
  ### 示例 5.6\n\n我们再次分析台湾 AirBox 数据，以每天的平均值作为变量，因此 \\(p = 31\\)。如同示例 5.3，使用了 \\(k =\
  \ 508\\) 个序列。基于投影的聚类使用包含在 **SLBDD** 书籍包中的命令 `ClusKur` 和 `ClusMain` 进行应用。使用的数据在矩阵\
  \ `Data` 中，计算方式如示例 5.4。命令 `ClusKur` 的输出是找到的组数和观测值的标签。在这个特定实例中，找到了四个组，并且几个异常值，用标签\
  \ '-1' 标识，不属于之前的任何组。图 5.26 显示了各组的位置，图 5.27 显示了用于查找簇的三个方向。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_283_0.png)\n\
  \n图 5.26. 基于投影找到的五个组的位置，针对台湾 AirBox 数据，以每日 PM\\(_{2.5}\\) 测量的平均值作为变量。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_284_0.png)\n\
  \n图 5.27 用于为台湾 AirBox 数据查找簇的三个投影方向，以每日平均测量值作为变量。\n\n### 通过投影进行聚类的 R 命令。\n\n```\n\

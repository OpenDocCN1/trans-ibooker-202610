  这些时间图展示了多元时间序列的几个特征。首先，它们显示了金融市场的整体演变和交叉依赖。所有市场在2003年都出现了低谷，稳步上升并在2008年初达到高峰，然后因2008年金融危机出现急剧下跌。然而，一些市场在2009年后经历了逐步复苏。其次，当市场下跌时，世界金融市场的波动性似乎更高；见图

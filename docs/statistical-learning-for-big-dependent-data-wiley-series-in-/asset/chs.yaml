  #final value 5602.958497\n#converged\n\n#### 预测\n>x.final <- coef(SpatioTemporalfit,pars=\"\
  cov\")$par\n>spat_pred_grid <- expand.grid(lon=seq(-100, -80, length=20),\nlat=seq(32,46,length=20))\n\

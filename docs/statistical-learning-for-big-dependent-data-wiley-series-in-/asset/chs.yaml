- "# 4 处理许多时间序列中的异质性\n\n经验时间序列常受多种偶发事件影响，这些事件产生异质性的不同原因。在建模过程中应考虑这些事件的影响，因为它们可能导致参数估计有偏和/或模型误设定，进而导致预测性能差。我们考虑的第一类事件包括具有已知原因的情况，例如一组生产系列上的罢工、月度销售系列上的闰年、进出口系列上的关税变化，或空气污染指数上的极端气候事件。第二类事件涉及由仪器故障或人为错误引起的时间序列中的缺失值。此处我们假设缺失值是随机发生的，且对于向量系列，整个数据点或向量的某些元素可能缺失。对于这两类事件，我们知道其发生时间，并希望从研究中的时间序列集合中移除其影响。如何进行此类调整是本章第一部分的重点。\n\
  \n还存在其他情况，我们不知道是否发生过任何非典型事件，也不知道其发生时间（如果有的话）。然而，从数据的离群观测中，我们可以推断在抽样期间确实发生过一些意外事件。那些离群数据点通常被称为\
  \ *离群点* 并最早由 Fox (1972) 在时间序列中进行研究。它们在实际时间序列中经常发生。例如，Maravall et al. (2016) 分析了许多国家的超过15,000个月度经济和社会时间序列，发现超过60%的系列至少有一个明显的离群点，且时间序列中离群点的预期数量约为数据点的2%。离群点可能呈孤立状出现，也可能成组出现形成离群点区块。某些事件可能导致系列水平的永久变化，它们被称为\
  \ *水平移位* 或结构断点。另一方面，其他事件只会对底层时间序列造成暂时性变化。本章第二部分的重点是向量时间序列中的离群点检测。遵循文献，我们将离群点分为水平移位、暂时性变化、加性离群点、创新离群点和方差变化，并讨论检测这些离群点并调整其影响的方法。所讨论的方法包括时间序列文献中可用的传统方法以及高维数据分析中的一些最新进展。对于一组独立时间序列，我们可以逐个清洗系列。然而，对于一组相关时间序列，关于可能影响所有系列的事件的信息分布在各系列中。因此，开发联合利用系列中信息的检测程序更为有利。在本章中，我们首先定义一元离群点和多元离群点，并提出一种在每个系列中或在由向量自回归移动平均（VARMA）模型建模的时间序列向量中调整其影响的程序。然后，我们提出一种基于投影的方法，以清洗大量时间序列，而无需估计多元模型。\n\
  \n处理离群点或结构变化的另一种方法是使用对非典型事件不敏感的稳健估计方法。可以通过检查使用某些稳健参数估计计算得出的残差来检测离群点。关于一元时间序列稳健估计有大量文献，但只有少数文章涉及多元系列。本章对这些结果进行了简要总结。异质性也可能由于模型的一些参数随时间变化，或在特定时间点发生变化而出现。同样，这是一个重要且研究广泛的主题，本章最后一部分介绍了一些关于多元时间序列的可用结果。最后，另一种异质性是由时间序列中的某些非线性效应引入的，但本章不考虑此主题，我们将读者参考\
  \ Tsay 和 Chen (2018) 的著作。\n\n## 4.1 干预分析\n\n时间序列中外部事件的固定效应可被视为模型中某些解释变量的影响。Box 和\
  \ Tiao (1975) 将这种方法称为 *干预分析*（intervention analysis），其中各种虚拟变量或指示变量作为时间序列模型的外生变量。外生变量的参数量化干预的影响。在经济学文献中，干预分析被称为\
  \ *事件研究*（event study）。为说明这一点，假设我们有一个月度生产系列 \\(z_t\\)，该系列在月份 \\(t=h\\) 的一个工作日受到罢工的影响。由于罢工仅发生在一个工作日，我们预期其对系列的影响（如有）仅会发生在月份\
  \ \\(t=h\\)。因此，引入一个虚拟（或指示）变量是合理的\n\n\\[\nI_t^{(h)} = \\begin{cases} 1, & \\text{if\
  \ } t = h, \\\\ 0, & \\text{otherwise}, \\end{cases} \\tag{4.1}\n\\]\n\n并假设观测数据\
  \ \\(z_t\\) 为 \\(z_t = y_t + \\omega I_t^{(h)}\\)，其中 \\(\\omega\\) 表示罢工的影响，\\(y_t\\\
  ) 是底层的无离群时间序列。显然，当 \\(t \\neq h\\) 时，我们观测到 \\(z_t = y_t\\)，但当 \\(t = h\\) 时，有 \\\
  (z_h = y_h + \\omega\\)，表明我们观测到的内容在时间 \\(t = h\\) 处受到罢工污染。第二个例子，考虑一国的月度出口额 \\(z_t\\\
  )。假设该国的一个主要贸易伙伴从月份 \\(t=h\\) 开始实施永久性的重大关税上调，我们有兴趣评估关税对出口系列 \\(z_t\\) 的影响。此处我们可以定义一个阶跃函数为\n\
  \n\\[\nS_t^{(h)} = \\begin{cases} 1, & \\text{if } t \\ge h, \\\\ 0, & \\text{otherwise,}\
  \ \\end{cases} \\tag{4.2}\n\\]\n\n并假设观测到的月度出口数据为 \\(z_t = y_t + \\omega S_t^{(h)}\\\
  )，其中 \\(\\omega\\) 表示新关税的影响。显然，当 \\(t < h\\) 时，有 \\(z_t = y_t\\)，但当 \\(t \\ge h\\\
  ) 时，有 \\(z_t = y_t + \\omega\\)。这里预期新的重大关税一旦发生，其影响将持续存在。读者可立即看到，第二个例子也可以描述为 \\(z_t\
  \ = y_t + \\omega \\frac{1}{(1-B)} I_t^{(h)}\\)，其中 \\(B\\) 是后移算子。这是因为 \\((1-B)S_t^{(h)}\
  \ = I_t^{(h)}\\)。函数 \\(\\frac{1}{1-B}\\) 表示 \\(B\\) 中两个多项式的比值，在干预分析或离群点检测中被广泛使用。\n\
  \n通过结合指示变量和阶跃函数，并使用多项式比值来描述干预的影响，我们获得了一种灵活的干预分析方法。详情见下一节及 Box 和 Tiao (1975)。事实上，干预分析中的外生变量不一定是虚拟变量或阶跃函数。其他确定性变量也可以使用。例如，在许多月度经济或生产时间序列中，每月的工作日天数是一个重要考虑因素。我们可以通过将观测值除以每月的工作日天数来考虑此类工作日效应，从而得到用于分析的月平均日产量系列。更好的解决方案是将每月的星期几作为解释变量引入并纳入模型。这是因为一周中的不同日子可能具有不同的活动水平，例如，超市销售在周一和周五并不相同。我们可以通过包含七个解释变量来衡量每日效应，这些变量显示每月周一、周二等的天数。此外，许多月度系列受到不规则节假日的影响，这些节假日每年不同，例如欧洲的复活节和中国的农历新年。我们可以通过引入一个外生变量来衡量此类效应，该变量在节假日所在月份取值为一，一年中的其他月份取值为零。\n\
  \n为了更好地理解处理时间序列中异质性的方法，有必要考虑观测时间序列 \\(z_t\\) 受到某些外生效应污染。因此，我们说与观测到的 \\(z_t\\) 相对应，存在一个无污染（或无离群）系列\
  \ \\(y_t\\)。在实践中，我们只观测到 \\(z_t\\)，但本章的目标是尽可能准确地恢复 \\(y_t\\)。向量情况也适用类似的记法。\n\n###\
  \ 4.1.1 带指示变量的干预\n\n我们从一个观测到的标量时间序列 \\(z_t\\) 开始，并假设相应的无污染系列 \\(y_t\\) 遵循 ARIMA\\\
  ((p,d,q)\\) 模型，即 \\(\\phi(B)(1-B)^d y_t = \\theta(B)a_t\\)。如果 \\(d > 0\\)，则为简化起见，我们假设系列从\
  \ \\(t=1\\) 开始，带有一些零初始值。因此，我们可以使用自回归\n\n\n\n(AR) 表示中的时间序列 \\(\\pi(B)y_t = a_t\\\
  ) 或移动平均 (MA) 表示中的时间序列 \\(y_t = \\psi(B)a_t\\)，其中理解为 \\(\\pi(B) = \\phi(B)(1-B)^d/\\\
  theta(B)\\) 和 \\(\\psi(B) = \\theta(B)/[\\phi(B)(1-B)^d]\\) 且 \\(\\pi(B)\\psi(B)\
  \ = 1\\)。在实践中，\\(\\pi_i\\) 和 \\(\\psi_j\\) 均可通过对 \\(B\\) 中的两个多项式进行长除法得到。\n\n我们假设在时间\
  \ \\(t = h\\) 发生了大小为 \\(w_0\\) 的异常事件。在此情况下，通过使用公式 (4.1) 中的指示变量，我们可以将观测时间序列写为\n\n\
  \\(z_t = w_0 I_t^{(h)} + y_t = w_0 I_t^{(h)} + \\psi(B)a_t. \\quad (4.3)\\)\n\n\
  换言之，我们有\n\n\\(z_t = \\left\\{ \\begin{array}{ll} y_t, & \\text{if } t \\neq h, \\\
  \\ y_h + w_0, & \\text{if } t = h. \\end{array} \\right.\\)\n\n表示 (4.3) 是第 3 章中以输入变量\
  \ \\(I_t^{(h)}\\) 介绍的传递函数的特例。同样，在时间 \\(t = h\\) 发生的异常事件也可能在多个时间段内影响正在研究的时间序列。例如，芝加哥的一场大冬季暴风雪可能会导致奥黑尔国际机场的航空交通中断数天。在此情况下，我们可以将观测时间序列写为\n\
  \n\\(z_t = \\sum_{i=0}^m w_i I_t^{(h+i)} + \\psi(B)a_t, \\quad (4.4)\\)\n\n其中 \\\
  (m\\) 是有限正整数，\\(w_i\\) 是该事件对时间段 \\(t = h + i\\)（\\(i = 0, ..., m\\)）的影响。此处我们使用参数\
  \ \\(w_i\\) 来表示该事件在 \\(t = h + i\\) 时对序列的影响。在实践中，可能很难 *事先* 知道 \\(m\\) 的值。此外，影响可能会随时间流逝而平滑衰减。因此，为\
  \ \\(z_t\\) 假设以下模型是合理的：\n\n\\(z_t = \\frac{w_0}{1 - \\delta B} I_t^{(h)} + \\psi(B)a_t\
  \ = \\frac{w_0}{1 - \\delta B} I_t^{(h)} + y_t, \\quad (4.5)\\)\n\n其中 \\(w_0\\)\
  \ 是异常事件的初始影响，\\(0 < \\delta < 1\\) 表示影响的折现率。这是因为 \\(w_0/(1 - \\delta B) = w_0(1\
  \ + \\delta B + \\delta^2 B^2 + \\cdots)\\)。更具体地说，公式 (4.5) 显示\n\n\\(z_t = \\left\\\
  { \\begin{array}{ll} y_t, & \\text{if } t < h, \\\\ y_h + w_0, & \\text{if } t =\
  \ h, \\\\ y_{h+1} + w_0\\delta, & \\text{if } t = h+1, \\\\ y_{h+2} + w_0\\delta^2,\
  \ & \\text{if } t = h+2, \\\\ \\vdots & \\vdots \\end{array} \\right.\\)\n\n其中 \\\
  (y_t\\) 是未观测到的未受污染的时间序列。\n\n通常，用于描述在时间索引 \\(t = h\\) 处异常事件对时间序列影响的灵活模型是\n\n\\(z_t\
  \ = \\frac{w(B)}{\\delta(B)} I_t^{(h)} + y_t, \\quad (4.6)\\)\n\n其中 \\(w(B) = w_0\
  \ + w_1 B + \\cdots + w_m B^m\\) 和 \\(\\delta(B) = 1 - \\delta_1 B - \\cdots - \\\
  delta_r B^r\\) 是 \\(B\\) 中的两个多项式，阶数分别为有限的 \\(m\\) 和 \\(r\\)，且 \\(y_t = \\psi(B)a_t\\\
  ) 是未受污染的时间序列。\\(w(B)/\\delta(B)\\) 的灵活性可见 Box and Tiao (1975) 和第 3 章。显然，我们要求 \\\
  (w(B)\\) 和 \\(\\delta(B)\\) 在公式 (4.6) 中没有公因式。\n\n在实际应用中，时间序列可能会受到发生在时间 \\(t = h_i\\\
  )（\\(i = 1, \\dots, g\\)）的多个异常事件的影响，其中 \\(g\\) 是非负整数。在此情况下，我们为 \\(z_t\\) 假设以下模型：\n\
  \n\\( z_t = \\sum_{i=1}^g \\frac{w_i(B)}{\\delta_i(B)} I_t^{(h_i)} + \\psi(B)a_t,\
  \ \\tag{4.7} \\)\n\n其中 \\( w_i(B) = w_{i,0} + w_{i,1}B + \\cdots + w_{i,m_i}B^{m_i}\
  \ \\) 和 \\( \\delta_i(B) = 1 - \\delta_{i,1}B - \\cdots - \\delta_{i,r_i}B^{r_i}\
  \ \\)，且 \\(m_i\\) 和 \\(r_i\\) 为非负整数。\n\n标量时间序列上异常事件影响建模的前面讨论可以轻易推广到向量情况。例如，对于观测到的向量系列，公式\
  \ (4.3) 中的模型将变为\n\n\\( z_t = \\boldsymbol{w}_0 I_t^{(h)} + \\boldsymbol{y}_t = \\\
  boldsymbol{w}_0 I_t^{(h)} + \\boldsymbol{\\psi}(\\boldsymbol{B})\\boldsymbol{a}_t,\
  \ \\)\n\n其中 \\( \\boldsymbol{w}_0 = (w_{01}, \\dots, w_{0k})' \\) 是事件影响的向量，\\( w_{0i}\
  \ \\) 是对第 \\(i\\) 个分量 \\(z_{it}\\) 的影响，\\( \\boldsymbol{y}_t \\) 是相应的未受污染向量时间序列，而\
  \ \\( \\boldsymbol{\\psi}(\\boldsymbol{B}) = [\\boldsymbol{\\Phi}(\\boldsymbol{B})]^{-1}\\\
  theta(\\boldsymbol{B}) \\) 表示 \\( \\boldsymbol{y}_t \\) 的 \\(\\psi\\)-权重矩阵，其遵循 VARMA\
  \ 模型 \\( \\boldsymbol{\\Phi}(\\boldsymbol{B})\\boldsymbol{y}_t = \\theta(\\boldsymbol{B})\\\
  boldsymbol{a}_t \\)。关于 \\(\\psi\\)-权重矩阵的进一步讨论见第 3 章。同样，公式 (4.6) 中的模型可以推广为\n\n\\\
  ( \\boldsymbol{z}_t = [\\boldsymbol{\\delta}(\\boldsymbol{B})]^{-1} \\boldsymbol{w}(\\\
  boldsymbol{B}) I_t^{(h)} + \\boldsymbol{y}_t, \\tag{4.8} \\)\n\n其中 \\( \\boldsymbol{w}(\\\
  boldsymbol{B}) = \\boldsymbol{w}_0 + \\boldsymbol{w}_1 \\boldsymbol{B} + \\cdots\
  \ + \\boldsymbol{w}_m \\boldsymbol{B}^m \\) 和 \\( \\boldsymbol{\\delta}(\\boldsymbol{B})\
  \ = \\boldsymbol{I} - \\boldsymbol{\\delta}_1 \\boldsymbol{B} - \\cdots - \\boldsymbol{\\\
  delta}_r \\boldsymbol{B}^r \\) 分别是阶数为有限的 \\(m\\) 和 \\(r\\) 的两个矩阵多项式，且 \\( \\boldsymbol{w}_i\
  \ \\) 和 \\( \\boldsymbol{\\delta}_i \\) 是 \\(k \\times k\\) 实矩阵，\\(k\\) 为 \\( \\\
  boldsymbol{z}_t \\) 的维度。此处我们要求 \\( \\boldsymbol{w}(\\boldsymbol{B}) \\) 和 \\( \\\
  boldsymbol{\\delta}(\\boldsymbol{B}) \\) 左互素。公式 (4.8) 在应用中有用的一个特例是\n\n\\( \\boldsymbol{z}_t\
  \ = (1 - \\delta \\boldsymbol{B})^{-1} \\boldsymbol{w}_0 I_t^{(h)} + \\boldsymbol{y}_t,\
  \ \\)\n\n在此例中，异常事件对 \\( \\boldsymbol{z}_t \\) 每个分量的影响以相同的速率衰减。\n\n### 4.1.2 阶跃函数干预\n\
  \n在某些应用中，异常事件可能会永久影响正在研究的时间序列。例如，考虑某产品 A 品牌的市场份额，以及其制造商在时间索引 \\(t = h\\) 处进行的大型促销活动。如果促销在促销生效时间之前就已宣布，消费者可能会预期价格下降而推迟购买。随后，他们在促销期间购买了大量\
  \ A 品牌产品，导致促销结束后销售额立即下降。理论上，这种大型促销可能会永久改变 A 品牌的市场份额。为了描述这种复杂的市场反应，使用指示变量 \\( I_t^{(h)}\
  \ \\) 会变得更加困难。相反，可以使用公式 (4.2) 中的阶跃函数来简化模型。此类干预的一个候选模型是\n\n\\( z_t = (w_{-1}F + w_0\
  \ + w_1 B) S_t^{(h)} + y_t, \\)\n\n其中 \\(F = B^{-1}\\) 是前移算子，\\(y_t\\) 是没有促销时的基础市场份额，\\\
  (w_i\\) 是用于量化促销效果的参数。在这种情况下，人们会期望 \\(w_{-1} < 0\\)、\\(w_0 > 0\\) 和 \\(w_1 < 0\\\
  )，而促销的永久效应由 \\(w_{-1} + w_0 + w_1\\) 给出。\n\n转向向量时间序列的情况。始于 \\(t = h\\) 的异常事件的影响可以建模为\n\
  \n$$z_t = w_0 S_t^{(h)} + \\Psi(B) a_t,$$\n\n与之前一样，\\(w_0 = (w_{0,1}, \\dots, w_{0,k})'\\\
  )，其中 \\(k\\) 为 \\(z_t\\) 的维度。此处容易看出，当 \\(t < h\\) 时有 \\(z_t = y_t\\)，当 \\(t \\ge\
  \ h\\) 时有 \\(z_t = w_0 + y_t\\)，其中 \\(y_t\\) 是未受污染的向量时间序列。显然，我们可以将模型推广到包含多个干预的情况，每个干预对基础时间序列都有复杂的影响。\n\
  \n因为\n\n$$I_t^{(h)} = S_t^{(h)} - S_{t-1}^h = \\nabla S_t^{(h)},$$ (4.9)\n\n在实际应用中，为给定干预选择使用指示变量还是阶跃函数可能并不关键。可以让数据选择要使用的适当变量。例如，如果我们估计模型\n\
  \n$$z_t = (w_0 - w_1 B) S_t^{(h)} + \\Psi(B) a_t,$$ 并发现 \\(\\hat{w}_0 \\simeq \\\
  hat{w}_1\\)，那么可以将模型简化为\n\n$$z_t = \\hat{w}_0 \\nabla S_t^{(h)} + \\Psi(B) a = \\\
  hat{w}_0 I_t^{(h)} + \\Psi(B) a_t,$$\n\n表明干预效应仅发生在 \\(t = h\\)。如果在使用指示变量和阶跃函数之间存在疑问，始终可以使用模型选择方法（如信息准则）来选择合适的模型。\n\
  \n### 4.1.3 一般外生变量干预\n\n干预分析不仅限于使用指示变量或阶跃函数。事实上，只要变量在时间 \\(t\\) 已知，就可以使用任何外生变量进行干预分析。例如，设\
  \ \\(x_t\\) 为公司在其产品上的月度广告支出，\\(z_t\\) 为公司的月度总销售额。那么，广告对销售的影响可以建模为\n\n$$z_t = v(B)x_t\
  \ + y_t,$$\n\n其中 \\(y_t\\) 是没有任何广告时的月度销售额，而 \\(v(B) = v_0 + v_1 B + v_2 B^2 + \\\
  cdots\\) 是传递函数。在实践中，\\(v(B)\\) 通常可以用两个多项式的比值很好地近似，例如 \\(v(B) = w(B)B^b/\\delta(B)\\\
  )，其中 \\(w(B) = w_0 + w_1 B + \\cdots + w_m B^m\\) 和 \\(\\delta(B) = 1 - \\delta_1\
  \ B - \\cdots - \\delta_r B^r\\)，\\(m\\) 和 \\(r\\) 为非负整数，而 \\(b\\) 是一个通常被称为干预 *滞后*\
  \ 的整数。这属于第 3 章讨论的传递函数模型。\n\n### 4.1.4 构建干预模型\n\n再次，我们从在时间 \\(t = h\\) 处发生单次干预的标量情况开始，并考虑模型\n\
  \n$$z_t = v(B) I_t^{(h)} + \\psi(B) a_t. \\quad (4.10)\n\n\n\n\n\n如果 $h$ 足够大，可以使用数据\
  \ $\\{y_1, \\dots, y_{h-1}\\}$（等价于 $\\{z_1, \\dots, z_{h-1}\\}$）为不受污染的序列 $y_t$ 建立模型。换句话说，我们使用干预前的数据来推断\
  \ $\\psi(B)$。然后利用该模型预测 $\\ell = 1, \\dots, T-h+1$ 的 $\\hat{z}_{h-1}(\\ell)$，其中 $T$\
  \ 为样本量。预测误差 $e_{h-1-\\ell}(\\ell) = z_{h-1-\\ell} - \\hat{z}_{h-1-\\ell}(\\ell)$\
  \ 显示干预的影响，并提供关于 $\\upsilon(B)$ 函数形式的信息，进而可用于指定 $w(B)$ 和 $\\delta(B)$。Eq. (4.10)\
  \ 中指定的模型随后通过条件最大似然法进行估计，包括 $\\psi(B)$ 的参数。\n\n另一方面，如果 $h$ 不够大，无法用于指定 $\\psi(B)$，则通常使用包含以下三个步骤的迭代过程。\n\
  \n#### 建模过程：\n\n- 1. 首先对传递函数进行初始估计 \\(\\hat{\\nu}^{(0)}(B)\\)，以通过 \\(\\hat{y}_t\
  \ = z_t - \\hat{\\nu}^{(0)}(B)I_t^{(h)}\\) 获得 $y_t$ 的估计。\n\n- 2. 使用序列 \\(\\hat{y}_t\\\
  ) 估计 ARIMA 模型的参数 \\(\\hat{\\Psi}(B)\\)，并计算残差\n\n\\(\\hat{e}_t = \\hat{y}_t - \\\
  sum_{i=1}^{t-1} \\hat{\\Psi}_i \\hat{e}_{t-i} = \\hat{\\Psi}^{-1}(B)\\hat{y}_t =\
  \ \\hat{\\pi}(B)\\hat{y}_t.\\)\n\n- 3. 利用这些残差与传递函数参数之间的关系，通过 (4.10) 并假设 \\(\\hat{\\\
  Psi}(B) \\approx \\psi(B)$ 来估计干预传递函数的参数。具体地，使用回归方程：\n\n\\(\\hat{e}_t = \\upsilon(B)\\\
  hat{\\pi}(B)I_t^{(h)} + a_t,\\)\n\n其中参数为 $v_i$，回归变量为 \\(x_t = \\hat{\\pi}(B)I_t^{(h)}\\\
  )。得到新的估计 \\(\\hat{v}_i$ 后，转至步骤 1。\n\n这个三步过程重复进行直到收敛。在实践中，我们可以从 \\(\\hat{\\nu}^{(0)}(B)\
  \ = 0\\) 和 $\\hat{y}_t = z_t$ 开始。\n\n上述建模过程也适用于带干预的多元时间序列。然而，与使用 VARMA 模型相比，通常采用\
  \ VAR 模型来处理不受污染的序列 $y_t$ 以简化估计，尤其是当 $z_t$ 的维度 $k$ 较大时。此外，还使用 $\\upsilon(B) \\approx\
  \ \\boldsymbol{w}(B) = \\boldsymbol{w}_0 + \\boldsymbol{w}_1 B + \\cdots + \\boldsymbol{w}_m\
  \ B^m$ 来进一步简化估计。在这些简化假设下，多元干预模型的估计可以通过迭代普通最小二乘法进行。\n\n### 示例 4.1\n\n我们使用 R 语言 MTS\
  \ 包中的 VARX 命令来说明干预分析。所用数据是世界上 99 个最重要股市的股票指数系列，我们将两个由阶梯函数表示的外部事件视为干预。第一个干预发生在 2007\
  \ 年 11 月 21 日（$h = 2058$），标志着 2008 年金融危机的开端，当时美国财政部设立了一个超级基金来处理次级抵押贷款市场。第二个干预发生在\
  \ 2008 年 9 月 16 日（\\( h = 2273 \\)），标志着投资银行雷曼兄弟于 2008 年 9 月 15 日倒闭后的第一个交易日。\n\n\
  图 4.1 和 4.2 分别显示了对数股票指数和收益率的时间图。如前所述，如第 2 章中所述，数据包含一些离群的收益率。另见图 4.2。但是，为简单起见，这里不处理离群值。由于每日指数收益率的自相关和互相关都很小，我们假设收益率序列为白噪声。请注意，指数系列的阶梯函数对应于收益率系列的指示变量。因此，我们采用了\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_189_0.png)\n\n图 4.1 世界 99 个市场股票指数对数序列的时间图。\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_189_1.png)\n\n图 4.2 世界 99 个市场股票指数收益率序列的时间图。\n\
  \n以下是 99 个收益率系列 \\( z_t$ 的干预模型：\n\n\\( z_t = w_1 f_t^{(2057)} + w_2 f_t^{(2272)}\
  \ + \\mu + a_t \\) 。\n\n图 4.3 和 4.4 分别绘制了估计值 \\( \\widehat{w}_1$ 和 \\( \\widehat{w}_2$\
  \ 的 t 比值。从图中可以看出，正如预期，两个干预对\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_190_0.png)\n\
  \n**图 4.3** \\( t \\)-ratios for the coefficient estimates of the intervention variable\
  \ on 21 November 2007 for the 99 log return series of the world stock indexes.\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_190_1.png)\n\n**图 4.4** \\( t \\)-ratios\
  \ of the coefficient estimates of the intervention variable on 16 September 2008\
  \ for the 99 log return series of the world stock indexes.\n\n收益率系列。这一点对第二个干预（雷曼兄弟倒闭）尤其明显，因为图\
  \ 4.4 包含许多 _t_-比值 小于 -2.0。\n\n### 干预分析中使用的 R 命令：\n\n```\n> require(MTS)\n>da=read.csv2(\"\
  Stock_indexes_99world.csv\", header=FALSE)\n>x=da[,-1] # remove time index\n>lx=as.matrix(log(x))\n\
  >T=dim(lx) [1]\n>k=dim(lx) [2]\n>y=diff(lx) # log returns\n>sx=matrix(0,T,1)\n>sx1=sx\n\
  >sx2=sx\n>sx1[2058:T,1]=1 ## first step function\n>sx2[2273:T,1]=1 ## 2nd step function\n\
  >iy1=diff (sx1) ## Indicator\n>iy2=diff (sx2)\n>iy=cbind(iy1,iy2)\n#Estimation of\
  \ the intervention model for y, the return series,\n#with 2 indicators.\n#The model\
  \ is refined to eliminate coefficients with t-ratio\n#smaller than 1.3\n>r=VARX(y,0,iy,0)\n\
  >rl=refVARX(r, thres=1.3)\n#The variable coef of Object r1 (rl$coef) contains the\
  \ coefficient\n#Estimate. It is a 99-by-2 matrix.\n#The variable se.coef of Object\
  \ rl (rl$se.coef) contains the standard\n### errors of all parameter estimates,\
  \ including the constant in row 1.\n### It is a 3-by-99 matrix.\n>s=rl$se.coef[-1,]\
  \ # remove standard errors of the constant terms.\n>M=rl$coef/t(s)\n>#tt1=which(abs(M)>=3,\
  \ arr.ind=T)\n>plot(M[,1], main=\"t ratios for the 1st intervention \", ylab=\"\
  t-value\",\nxlab=\"series number\")\n>plot(M[,2], main=\"t ratios for the 2nd intervention\
  \ \", ylab=\"t-value\",\nxlab=\"series number\")\n```\n\n## 4.2 缺失值估计\n\n### 4.2.1\
  \ 一元插值\n\n时间序列的缺失值可能发生在单个时间点或某个区间内。用于收集数据的仪器故障就是一个例子。在本章中，我们假设缺失值在样本中随机发生。也就是说，没有系统性模式来决定缺失值的出现或其大小。在此假设下，我们讨论估计缺失值的方法，以便可以应用为完整数据集开发的传统统计方法。在某些情况下，可以将缺失值视为统计模型的附加参数，并与其他模型参数一起估计缺失值。\n\
  \n我们从零均值平稳时间序列 \\(z_t\\) 中的单个缺失值开始。假设 \\(z_h\\) 缺失。显然，\\(h$ 不能是第一个或最后一个时间点。\n\n\
  否则，可以减少样本量以避免缺失值。我们使用符号 $z_{(-h)} = \\{z_1, ..., z_{h-1}, z_{h+1}, ..., z_T\\}$\
  \ 表示可用数据。下标 $(-h)$ 表示 $z_h$ 缺失。要估计 $z_h$，可以在给定数据和模型的情况下最小化其平方估计误差。设 $M$ 表示 $z_t$\
  \ 的模型，$z_h$ 的估计值（记为 $\\hat{z}_h$）通过对 $z^*$ 最小化 $E[(z_h - z^*)^2 | M, z_{(-h)}]$\
  \ 得到。结果表明，该解仅为给定模型和可用数据下 $z_h$ 的条件期望。即，$\\hat{z}_h = E(z_h | M, z_{(-h)})$。如果模型\
  \ $M$ 已知，则该条件期望易于获得。例如，对于 ARMA 模型\n\n$$E(z_h|z_{(-h)}) = -\\sum_{j=1}^\\infty \\\
  rho_j^i(z_{h+j} + z_{h-j}),$$ (4.11)\n\n其中系数 $\\rho_j^i$ 是逆自相关系数，即逆 ARMA 模型的 ACF。也就是说，给定\
  \ ARMA$(p, q)$ 模型 $\\phi(B)z_t = \\theta(B)a_t$，逆自相关函数是对偶或逆过程 $\\theta(B)z_t = \\\
  phi(B)a_t$ 的常规自相关函数。这些系数衡量在消除所有其余观测值的影响后，相隔 $j$ 个周期的序列观测值之间的相关性（见 Ledolter, 1984）。式\
  \ (4.11) 表示一个对称滤波器。\n\n如果模型 $M$ 的参数未知，或者序列是非平稳的，我们可以通过第 4.1 节讨论的干预分析来共同估计缺失值和模型参数。估计算法如下：\n\
  \n### 标量滤波算法：\n\n- 1. 为 $z_h$ 插入一个任意值 $z_h^*$，例如 $z_h^* = 0$，以获得完整的数据集 $z^* = (z_1,\
  \ ..., z_{h-1}, z_h^*, z_{h+1}, ..., z_T)$。\n\n- 2. 对于完成的系列 $z^*$，估计包含式 (4.1) 的指示变量\
  \ $I_t^{(h)}$ 的干预模型。设 $\\hat{w}_0$ 为干预效应的估计值。\n\n- 3. 通过以下公式估计缺失值：\n\n$$\\hat{z}_h\
  \ = E(z_h|z_{(-h)}) = z_h^* - \\hat{w}_0.$$ (4.12)\n\n在上述算法中，我们考虑模型\n\n$$z_t^* =\
  \ w_0 I_t^{(h)} + \\psi(B)a_t = w_0 I_t^{(h)} + z_t.$$ (4.13)\n\n在 $t = h$ 时，条件于\
  \ $z_{(-h)}$ 的取值取期望，得到\n\n$$z_h^* = w_0 + E(z_h|z_{(-h)}),$$\n\n即式 (4.12)。\n\n有趣的是，缺失值的估计不依赖于任意初始值\
  \ $z_h^*$。为了说明这一点，假设 $z_t$ 遵循随机游走。干预模型为\n\n$$z_t^* = w_0 I_t^{(h)} + y_t,$\n\n\n\
  \n其中 $z_t^*$ 用于表示完整数据集，且在随机游走模型下 $(1-B)y_t = a_t$。对前文等式两边求一阶差分，得\n\n$$\n\\nabla\
  \ z_t^* = w_0 x_t + a_t,\n$$\n\n其中 $x_t = (1-B)I_t^{(h)}$，因此 $x_h = 1$，$x_{h+1}\
  \ = -1$，其余情况下 $x_t = 0$。该回归方程中 $w_0$ 的最小二乘估计量为\n\n$$\n\\hat{w}_0 = \\frac{\\sum_t\
  \ x_t \\nabla z_t^*}{\\sum (x_t)^2} = \\frac{\\nabla z_h^* - \\nabla z_{h+1}^*}{2}\
  \ = \\frac{z_h^* - z_{h-1} - z_{h+1} + z_h^*}{2} = z_h^* - \\frac{z_{h-1} + z_{h+1}}{2},\n\
  $$\n\n而缺失值的估计量（通过公式 (4.12)）为\n\n$$\n\\hat{z}_h = \\frac{z_{h-1} + z_{h+1}}{2},\n\
  $$\n\n该估计量不依赖于 $z_h^*$。注意，该等式是 (4.11) 的一个特例，因为随机游走的逆过程是一个单位参数的 MA(1) 过程，因此其一阶自相关系数明确定义且等于\
  \ $-0.5$。于是，缺失值仅由观测值 $z_{h-1}$ 和 $z_{h+1}$ 的平均值估计。当模型参数使用前述标量滤波算法同时估计时，$\\hat{z}_h$\
  \ 不依赖于 $z_h^*$ 的事实依然成立。\n\n若缺失一组共 $g$ 个观测值，该滤波方法可轻易推广，例如从 $h$ 到 $h+g-1$。设可用数据为 $\\\
  mathbf{z}_{1[-h:(h+g-1)]} = (z_1, \\dots, z_{h-1}, z_{h+g}, \\dots, z_T)'$。将这 $g$\
  \ 个缺失值填零以构造完整数据集 $\\mathbf{z}^*$，并为 $i=1, \\dots, g$ 定义 $g$ 个指示变量 $I_t^{(h+i-1)}$，我们估计干预模型\n\
  \n$$\nz_t^* = \\sum_{i=1}^g w_i I_t^{(h+i-1)} + z_t, \\quad (4.14)\n$$\n\n缺失值则由以下公式求得\n\
  \n$$\n\\hat{z}_{h+i} = z^*_{h+i} - \\hat{w}_i, \\quad i=0, \\dots, g-1.\n$$\n\n\
  该思路可推广到任意组合的缺失值。当然，该算法的有效性取决于缺失值的随机模式和数量。注意，若序列为具有非零均值的平稳序列，则该平均值应从所有观测值中减去，如前所述得到的插值结果再加回样本均值以获得原始值。对于整合时间序列，干预分析方法始终可用。\n\
  \n### 4.2.2 多元插值\n\n给定一组相关时间序列 $\\mathbf{z}_t$，缺失值可能出现在 $\\mathbf{z}_h$ 中的整个向量或其部分分量上。可以将上一节的标量滤波算法分别应用于各个单独的时间序列，但这种方法未能利用序列之间的相互依赖性。更好的做法是在共同估计缺失值时利用序列间的所有信息。与标量情形类似，可以将所有缺失值替换为零以获得完整数据集，记为\
  \ $z^*$。有了完整数据后，可以应用干预分析来估计模型参数和缺失值。此处干预模型将涉及基于缺失值位置构造的某些指示变量。\n\n考虑 $z_h$ 完全缺失的情况。此时\
  \ $z_h^*$ 为零向量，干预模型为\n\n$$\nz_t^* = w'I_t^{(h)} + z_t,\n$$\n\n其中 $z_t$ 遵循向量 ARMA\
  \ 模型。若 $z_t$ 的模型已知，则可轻易估计 $w$。缺失值的估计与公式 (4.12) 类似，由以下公式给出\n\n$$\n\\hat{z}_h = z_h^*\
  \ - \\hat{w} = -\\hat{w}.\n$$\n\n接下来，考虑 $z_h$ 仅部分缺失的情况。为简化，假设 $z_t$ 遵循 VAR(1) 模型且\
  \ $z_h$ 的前 $k_0$ 个分量缺失。将向量 $z_t = (z'_{1t}, z'_{2t})'$ 分块，其中 $z_{1t}$ 为 $k_0 \\\
  times 1$，$z_{2t}$ 为 $(k - k_0) \\times 1$，对创新项 $a_t = (a'_{1t}, a'_{2t})'$ 采用同样的处理。将\
  \ AR(1) 系数矩阵记为 $\\phi_1 = [\\phi_{ij}]$。则有\n\n$$\n\\begin{aligned}\nz_{1h} &= \\\
  phi_{11}z_{1,h-1} + \\phi_{12}z_{2,h-1} + a_{1h},\\\\\nz_{1,h+1} &= \\phi_{11}z_{1h}\
  \ + \\phi_{12}z_{2h} + a_{1,h+1}.\n\\end{aligned}\n$$\n\n因此，缺失值通过以下方式与观测数据相关\n\n\
  $$\n\\begin{bmatrix}\n\\phi_{11}z_{1,h-1} + \\phi_{12}z_{2,h-1} \\\\\nz_{1,h+1}\
  \ - \\phi_{12}z_{2h}\n\\end{bmatrix}\n=\n\\begin{bmatrix}\nz_{1h} \\\\\n-\\phi_{11}z_{1h}\n\
  \\end{bmatrix}\n+\n\\begin{bmatrix}\n-a_{1h} \\\\\na_{1,h+1}\n\\end{bmatrix}. \\\
  tag{4.15}\n$$\n\n公式 (4.15) 具有多元多元线性回归的形式，其中响应变量已知，解释变量为矩阵 $[I, -\\phi'_{11}]'$，未知参数位于\
  \ $z_{1h}$ 中。注意 $-a_{1h}$ 与 $a_{1h}$ 具有相同的分布。因此，只要 $\\phi_1$ 已知，$z_{1h}$ 即可通过最小二乘法估计。具体地，若将公式\
  \ (4.15) 改写为\n\n$$\nY = Xz_{1h} + e,\n$$\n\n则有\n\n$$\n\\hat{z}_{1h} = (X'X)^{-1}(X'Y).\n\
  $$\n\n在实际中，$\\phi_1$ 未知，因此可以使用迭代算法共同估计 $z_{1h}$ 和 $\\phi_1$。由此，缺失值的插值方法考虑了序列之间的所有关系。\n\
  \n在文献中，缺失值问题已被广泛研究。时间序列分析也不例外。一般而言，处理缺失值有两种方法。一种是 Dempster et al. (1977) 的期望最大化\
  \ (EM) 算法，另一种是马尔可夫链蒙特卡罗 (MCMC) 方法。本节讨论的插值方法属于 EM 算法。读者可参阅 Tsay (2014, chapter 6)\
  \ 以了解向量时间序列中缺失值的进一步讨论。\n\n### Example 4.2\n\n我们利用美国和中国的进出口序列来说明缺失值的估计；见第 3 章。我们关注一阶差分序列\
  \ $z_t$，并假设为了说明目的，$z_{125}$ 缺失。观测值为 $z_{125} = (0.04149, 0.0101, 0.01314, 0.01496)'$。首先，我们考虑第一个分量\
  \ $z_{1t}$，并应用标量滤波算法，利用 ARMA(3,1) 模型估计缺失值。在此标量情形下，缺失值的估计为 0.00495。\n\n接下来，我们联合使用四个序列，并应用带有\
  \ VAR(3) 模型的多元滤波算法来估计 $z_{125}$。$z_{1,125}$ 的估计缺失值为 0.0384，这与观测值要接近得多。这个简单的例子表明，当时间序列相关时，使用多元插值是有益的。\n\
  \n### R analysis for missing values:\n\n```\n> require(MTS)\n> da <- read.csv(\"\
  m-eximpcnus.csv\") # data in natural log\n### Missing value estimation example 4.2\n\
  > da=da[,-1] # remove the time index\n> da=as.ts(da)\n> xt=diff(da)\n> T=dim(xt)[1]\n\
  # Missing value is estimated at position tm for the first series\n# using an arma(3,1)\
  \ model.\n> tm=125\n> iv=matrix(0,T,1)\n> iv[tm]=1\n> xmis=xt\n> xmis[tm,1]=0\n\
  > ols=arima(xmis[,1],order=c(3,0,1),xreg=iv)\n> ols$coef\n   ar1      ar2      ar3\
  \      ma1   intercept       iv\n0.2569381 0.2881239 0.2053035 -0.807763  0.010267\
  \ -0.00495\n> xt[tm,1]\nexpcn\n0.04148874\n # The true value, 0.04148874, is estimated\
  \ as 0.004949534.\n # A multivariate estimation with a VAR(3) model is used.\n >\
  \ xmis[tm,]=c(0,0,0,0)\n > rr=VAR(xmis,3,iv,output=F) # output not shown\n > rr$beta\n\
  \       [,1]\nexpcn -0.03837700\nexpus -0.01457980\nimpcn -0.02445329\nimpus -0.01323786\n\
  \ > xt[tm,]\n   expcn   expus   impcn   impus\n0.04148874 0.01008952 0.01317370\
  \ 0.01496092\n```\n\n## 4.3 向量时间序列中的异常值\n\n异常观测值或离群点在时间序列应用中很常见。它们出现的原因各不相同，包括未预料到的外部事件，如仪器故障、罢工和病毒爆发。这些异常数据点会在未知的时间点随机出现，若被忽视，可能导致模型误设定、参数估计有偏以及预测次优。因此，在时间序列分析中，检测并处理由此类异常观测引起的异质性非常重要。\n\
  \n在时间序列分析中检测异常值具有多重目的。首先，t = h 时存在异常值可能导致发现此前被忽视的相关异常事件。其次，通过研究检测到的异常值的影响，可以改进模型估计和预测。然而，异常值检测较为复杂，因为异常值的数量、位置和类型事先均未知，此外模型本身也是未知的。\n\
  \n在本节中，我们通过考察异常事件在数据中留下的痕迹来识别其发生情况。我们主要关注两种类型的异常值，即加性异常值 (AO) 和水平移位。加性异常值代表由外部事件（如测量或记录错误）引起的异常观测。水平移位由对研究时间序列具有永久影响的事件引起。\n\
  \n我们还考虑其他类型的异常值，包括创新性异常值、暂时性变化和斜坡移位。与加性异常值和水平移位相比，这三种类型的异常值对时间序列分析的影响往往相对较小。暂时性变化指其对时间序列的影响仅持续几个时期的异常值，而创新性异常值表示异常创新，即\
  \ $a_t$ 序列中的异常值。异常值可能出现在平稳或非平稳序列中，但斜坡移位仅在建模整合序列时有用。\n\n### 4.3.1 多元加性异常值\n\n我们说，若在\
  \ t = h 时，向量时间序列在该时间点上的值受到某些外部事件污染，则该向量时间序列存在多元加性异常值 (MAO)。与前所述类似，设 $z_t$ 为观测向量时间序列，$y_t$\
  \ 为未受污染的序列。那么，t = h 时的 MAO 可定义为\n\n$$\nz_t = \\begin{cases}\ny_t, & t \\neq h, \\\
  \\\ny_t + \\omega_A, & t = h,\n\\end{cases}\n$$\n\n其中 $\\omega_A = (\\omega_{1A},\
  \ \\dots, \\omega_{kA})'$ 表示异常值的大小。若 $k = 1$，则为标量时间序列，该异常值即为加性异常值 (AO)。为简化，假设 $E(y_t)\
  \ = 0$ 且 $y_t$ 遵循 VAR(p) 模型\n\n$$\n\\Phi(B)y_t = a_t, \\qquad (4.16)\n$$\n\n具有 MA\
  \ 表示式 $y_t = \\Psi(B)a_t$。然后，利用指示变量 $I_t^{(h)}$，我们有以下模型\n\n$$\nz_t = \\omega_A I_t^{(h)}\
  \ + \\Psi(B)a_t = \\omega_A I_t^{(h)} + y_t. \\qquad (4.17)\n$$\n\n该等式呈干预模型的形式，但此处时间索引\
  \ h 未知。对公式 (4.17) 两边作用 AR 算子，得到\n\n$$\n\\Phi(B)z_t = \\Phi(B)\\omega_A I_t^{(h)}\
  \ + a_t. \\qquad (4.18)\n$$\n\n公式 (4.17) 和 (4.18) 可相互替换：任一均可用于定义 MAO。\n\n\n\n\n\n\
  #### 4.3.1.1 对残差和估计的影响\n\nMAO在\\(z_t\\)的残差序列中留下了某些痕迹，可用于检测异常值。为简化讨论，假设VAR模型的真实参数已知。然后，根据Eq.\
  \ (4.18)，有\n\n```\n\\(e_t = X_t^A \\omega_A + a_t,\\) \\tag{4.19}\n```\n\n其中\\(e_t\
  \ = \\Phi(B)z_t\\)是观测时间序列的残差，\\(X_t^A\\)是由\\(X_t^A = \\Phi(B)I_t^{(h)}\\)给出的方阵。利用\\\
  (B^j I_t^{(h)} = I_{t-j}^{(h)} = I_t^{(h+j)}\\)，很容易看出\n\n```\n\\(X_t^A = \\begin{cases}\
  \ \\mathbf{0}, & \\text{if } t < h, \\\\ I_k, & \\text{if } t = h, \\\\ -\\Phi_j,\
  \ & \\text{if } t = h + j, \\text{ with } j = 1, \\dots, p, \\\\ \\mathbf{0}, &\
  \ \\text{if } t > h + p, \\end{cases}\\)\n```\n\n其中\\(I_k\\)是\\(k \\times k\\)单位矩阵。因此，Eq.\
  \ (4.19)表明，\\(t = h\\)处的MAO会影响从\\(t = h\\)开始的\\(z_t\\)的\\(p + 1\\)个残差。具体而言，\n\n\
  ```\n\\(e_{h+j} = -\\Phi_j \\omega_A + a_{h+j}, \\quad j = 0, \\dots, p\\) \\tag{4.20}\n\
  ```\n\n其中\\(\\Phi_0 = -I_k\\)。方程(4.20)表明，\\(t = h\\)处的AO对序列\\(z_t\\)的残差\\(e_t\\\
  )有复杂的影响。理论上，MAO影响\\(t = h, \\dots, h + p\\)时的\\(e_t\\)。但是，对于某些\\(j\\)，可能存在\\(\\\
  Phi_j \\omega_A = \\mathbf{0}\\)的情况。在这种情况下，MAO不影响\\(e_{h+j}\\)。另外，如果\\(\\omega_A\\\
  )是第\\(i\\)个单位向量，即若\\(j = i\\)则\\(\\omega_{jA} = 1\\)，否则\\(\\omega_{jA} = 0\\)，则乘积\\\
  (-\\Phi_j \\omega_A\\)是\\(-\\Phi_j\\)的第\\(i\\)列，这表明仅发生在单个序列中的MAO可能影响所有其他时间序列。\n\n\
  这些结果可以通过其AR表示轻松推广到VARMA过程。对于\\(\\pi(B)y_t = a_t\\)，只要已知\\(\\pi(B)\\)，观测残差即为\\(e_t\
  \ = \\pi(B)z_t\\)，且Eq. (4.20)变为\n\n```\n\\(e_{h+j} = -\\pi_j \\omega_A + a_{h+j},\
  \ \\quad j = 0, 1, \\dots,\\)\n```\n\n其中\\(\\pi_0 = -I_k\\)。因此，理论上，向量时间序列\\(z_t\\\
  )中\\(t = h\\)处的MAO可能影响其所有\\(t \\ge h\\)时的残差\\(e_t\\)。在存在多个MAO的情况下，观测向量时间序列\\(z_t\\\
  )残差上的影响可能变得复杂。\n\n时间序列中AO或MAO的全局效应是将其样本ACF偏向零，并且取决于\\(\\omega_A\\)的分量，也可能将交叉相关偏向零。因此，该序列模型的参数估计也有偏差。我们利用标量零均值AR(1)过程在时间\\\
  (h\\)处具有大小为\\(\\omega_A\\)的AO的简单情况来说明这种影响。AR参数的最小二乘估计为\\(\\hat{\\phi} = \\sum (z_t\
  \ - \\bar{z})(z_{t-1} - \\bar{z}) / \\sum (z_t - \\bar{z})^2\\)，其中\\(\\bar{z}\\\
  )表示样本均值。由于\\(z_h = y_h + \\omega_A\\)，且\\(z_t = y_t, t \\neq h\\)，则\\(\\bar{z} =\
  \ \\bar{y} + \\frac{1}{T} \\omega_A\\)，并假设\\(T\\)较大，使得\\(\\omega_A / T \\simeq 0\\\
  )且\\(\\bar{z} \\simeq 0$，则有\n\n```\n\\(\\hat{\\phi} = \\frac{\\sum y_t y_{t-1} +\
  \ \\omega_A(y_{h-1} + y_{h+1})}{\\sum y_t^2 + \\omega_A^2 + 2\\omega_A y_h}.\\)\n\
  ```\n\n因此，异常值的大小在分子中呈线性出现，在分母中呈二次出现，这表明当\\(\\omega_A\\)非常大时，\\(\\hat{\\phi}\\)的值会很小。该结果可以推广到向量情况，取决于\\\
  (\\Phi_j \\omega_A\\)的值。一般来说，AO的影响随样本量和异常值幅度的增加而减小。\n\n### 4.3.2 多变量水平移位或结构性断裂\n\
  \n水平移位（LS），也称为结构性断裂，是另一种可能显著影响时间序列的扰动类型。我们说，向量时间序列在时间$t = h$处发生了水平移位，如果它遵循模型：\n\n\
  ```\n$z_t = \\omega_L S_t^{(h)} + \\psi(B)\\boldsymbol{a}_t = \\omega_L S_t^{(h)}\
  \ + \\boldsymbol{y}_t, \\quad (4.21)$\n```\n\n其中\\(S_t^{(h)}\\)是Eq. (4.2)中定义的阶跃函数，\\\
  (\\boldsymbol{\\omega}_L = (\\omega_{1L}, ..., \\omega_{kL})'\\)是移位大小。观测向量系列的值与未污染系列的值通过以下方式相关：\n\
  \n```\n$\\boldsymbol{z}_t = \\begin{cases} \\boldsymbol{y}_t, & t < h, \\\\ \\boldsymbol{y}_t\
  \ + \\boldsymbol{\\omega}_L, & t \\ge h. \\end{cases}$\n```\n\n如果向量过程是均值为\\(\\boldsymbol{\\\
  mu}\\)的平稳过程，则水平移位会使序列非平稳，因为\\(t < h$时每个观测值的期望为\\(\\boldsymbol{\\mu}$，而\\(t \\ge\
  \ h$时为\\(\\boldsymbol{\\mu} + \\boldsymbol{\\omega}_L$。\n\n#### 4.3.2.1 对残差和估计的影响\n\
  \n时间序列$\\boldsymbol{z}_t$在时间$h$处的LS可以写为\n\n```\n$\\boldsymbol{\\pi}(B)\\boldsymbol{z}_t\
  \ = \\boldsymbol{\\pi}(B)\\boldsymbol{\\omega}_L S_t^{(h)} + \\boldsymbol{a}_t.$\n\
  ```\n\n因此，残差$\\boldsymbol{e}_t = \\boldsymbol{\\pi}(B)\\boldsymbol{z}_t$变为\n\n```\n\
  $\\boldsymbol{e}_t = \\boldsymbol{X}_t^{LS} \\boldsymbol{\\omega}_L + \\boldsymbol{a}_t,\
  \ \\quad (4.22)$\n```\n\n其中方阵$\\boldsymbol{X}_t^{LS}$现在由以下给出\n\n```\n$\\boldsymbol{X}_t^{LS}\
  \ = \\begin{cases} \\mathbf{0}, & t < h, \\\\ \\boldsymbol{\\pi}(B)S_t^{(h)} = [\\\
  mathbf{I}_k - \\sum_{i=1}^j \\pi_i], & t = h + j, \\quad j \\ge 0 \\end{cases} \\\
  quad (4.23)$\n```\n\n该表达式表明，LS之后的所有残差都会受到影响，但影响量取决于模型以及时间索引$h$和$T$（即样本量）之间的距离。事实上，如果$h\
  \ = T$，LS与AO之间没有区别。\n\nLS对标量时间序列的一个显著影响是将序列推向单位根过程。为了说明，我们考虑标量平稳时间序列$z_t$在$h$处发生LS，该序列遵循均值为零的AR(1)模型。可以证明，AR参数的估计可以写为\n\
  \n```\n$\\hat{\\phi} = \\frac{\\hat{\\phi}_0 + T^{-1}S_3 + T^{-1}\\tilde{\\omega}_L^2(T-h)}{1\
  \ + T^{-1}2S_4 + T^{-1}\\tilde{\\omega}_L^2(T-h+1)},$\n```\n\n其中$\\tilde{\\omega}_L\
  \ = \\omega_L/s_y$和$\\tilde{y}_t = y_t/s_y$，其中$s_y$是$y_t$的样本标准误差，$\\hat{\\phi}_0\
  \ = \\sum y_t y_{t-1} / \\sum y_t^2$是从未污染序列$y_t$获得的估计，$S_3 = \\tilde{\\omega}_L(\\\
  tilde{y}_{h-1} + \\tilde{y}_h + 2\\tilde{y}_{h+1} + \\cdots + 2\\tilde{y}_T)$，且$S_4\
  \ = \\tilde{\\omega}_L \\sum_{j=0} \\tilde{y}_{h+j}$。如果$T - h$不是很小，则有\n\n```\n$\\\
  hat{\\phi} \\to 1 \\quad \\text{as} \\quad \\tilde{\\omega}_L \\to \\infty.$\n```\n\
  \n该结果表明，只要LS发生得不太靠近样本末尾，如果移位大小较大，则观测序列$z_t$的滞后-1样本ACF将趋近于1。该结果对其他样本ACF也继续成立。因此，发生在系列末尾足够远处的LS倾向于将样本ACF偏向单位根过程的ACF。\n\
  \n对于向量时间序列，发生在系列末尾足够远处的大型多变量水平移位（MLS）不仅会使序列趋向于单位根平稳性，还会趋向于协整系统。为了看到这一点，令u为与w_L正交的向量，使得u'w_L\
  \ = 0。然后，根据Eq. (4.21)，有\n\n```\nw_t \\equiv u' z_t = u' y_t,\n```\n\n这是一个平稳时间系列。一般来说，对于给定的w_L，存在k\
  \ - 1个这样的正交向量，这意味着发生在样本末尾远处的大型水平移位将导致z_t表现为具有k - 1个协整向量的协整系统。总之，MLS可能对平稳向量时间系列产生深远影响。\n\
  \n### 4.3.3 其他类型的异常值\n\n接下来，我们考虑另外三种类型的异常值。它们是多变量创新性异常值、多变量暂时性变化（MTC）和多变量斜坡变化。\n\
  \n#### 4.3.3.1 多变量创新性异常值\n\n向量序列中的多变量创新性异常值（MIO）表示在时间t = h时创新a_t受到某个未知事件的影响。由于创新代表时间序列的一步先验预测误差，我们可以说MIO是在时间索引h时系列预测误差中的异常增量。时间h处大小为w_I的MIO的模型为\n\
  \n```\nz_t = \\Psi(B)[\\omega_I I_t^{(h)} + a_t], \\quad (4.24)\n```\n\n或在VAR(\\\
  infty)表示中\n\n```\n\\pi(B)z_t = \\omega_I I_t^{(h)} + a_t.\n```\n\n与之前一样，令e_t = \\\
  pi(B)z_t为观测数据的残差，则有\n\n```\ne_t = \\omega_I I_t^{(h)} + a_t = X_t^I \\omega_I +\
  \ a_t, \\quad (4.25)\n```\n\n其中\n\n```\nX_t^I = I_k I_t^{(h)}.\n```\n\n因此，e_h =\
  \ \\omega_I + a_h，且若t \\neq h，则e_t = a_t。这意味着MIO仅在发生时影响单个残差。注意，如果z_t是白噪声序列，则MIO等效于MAO。\n\
  \n利用未污染序列y_t的\\Psi(B)y_t = a_t，我们可以将Eq. (4.24)改写为\n\n```\nz_t = y_t + \\Psi(B)\\\
  omega_I I_t^{(h)}. \\quad (4.26)\n```\n\n因此，z_t和y_t之间的关系是\n\n```\nz_t = \\begin{cases}\
  \ y_t, & t < h, \\\\ y_t + \\Psi_j \\omega_I, & t = h + j, \\ j \\ge 0, \\end{cases}\
  \ \\quad (4.27)\n```\n\n\n\nwhere $\\Psi_0 = I_k$. 因此，MIO 影响所有 $t \\ge h$ 的观测序列\
  \ $z_t$。具体而言，我们观察到：(1) 对于 $t = h$，观测值受异常值大小污染；(2) 对于平稳向量序列，MIO 对观测值的影响会随 $t$ 远离\
  \ $h$ 而减小，因为当 $i \\to \\infty$ 时 $\\Psi_i \\to 0$；(3) 对于单位根非平稳序列，MIO 的影响可能很复杂，取决于序列的协整阶数。MIO\
  \ 可以为各个组成部分的边缘模型引入不同的配置。其影响取决于向量模型、异常值大小以及两者之间的交互作用（参见 Tsay et al., 2000）。在某些情况下，它会导致边缘分量模型中出现一片异常值，该片段长度由各种因素决定。这一结果有助于解释实证发现，即单变量异常值检测常识别出连续异常值。这些结果展示了在多变量框架内研究异常值的优势。\n\
  \n为说明，考虑 MIO 对向量 MA(1) 模型 $y_t = (I - \\Theta_1 B)a_t$ 的影响，其中 $|\\Theta_1| = 0$。该向量\
  \ MA(1) 模型在实践中可能出现，尤其是当维度 $k$ 较大且 $\\Theta_1$ 中许多元素为零时。如果在时间 $h$ 发生大小为 $\\omega_t$\
  \ 的 MIO，且 $\\omega_t$ 属于 $\\Theta_1$ 的右零空间，则因为 $\\Theta_1 \\omega = 0$（零向量），异常值仅影响时间\
  \ $h$ 的单个观测，因此等同于 MAO。对于高阶模型，多变量与单变量情况之间的差异可能更为显著。\n\n#### 4.3.3.2 瞬态变化\n\n向量时间序列分析中另一种有趣的异常值类型是\
  \ MTC，定义为\n\n$z_t = \\frac{\\omega_{TC}}{1 - \\delta B} I_t^{(h)} + \\Psi(B)a_t,\
  \ \\quad (4.28)$\n\n其中 $0 \\le \\delta \\le 1$ 表示异常值影响的折现率。如果 $\\delta = 1$，则有 $\\\
  nabla^{-1} I_t^{(h)} = S_t^{(h)}$，因此异常值变为 MLS；如果 $\\delta = 0$，则得到 MAO。在实践中，这种异常值通过固定\
  \ $\\delta$ 的值（通常为 $\\delta = 0.7$）来使用，以避免与 MAO 或 MLS 混淆。尽管这种异常值在单变量时间序列分析中很有用，但在多变量情况中则不那么有用。这是因为常见的\
  \ $\\delta$ 值可能不适合 $z_t$ 的所有组成部分。\n\n#### 4.3.3.3 斜坡移\n\n在非平稳时间序列分析中（特别是 I(2) 序列）值得关注的一种异常值是斜坡移，定义为\n\
  \n$z_t = \\omega_R R_t^{(h)} + \\Psi(B)a_t,$\n\n其中斜坡变量 $R_t^{(h)}$ 由以下给出\n\n$R_t^{(h)}\
  \ = \\begin{cases} 0, & t < h, \\\\ t + 1 - h, & t \\ge h. \\end{cases}$\n\n斜坡变量从时间\
  \ $h$ 开始向向量时间序列中引入斜率为 $\\omega_R$ 的确定性趋势。该变量与阶跃函数和指示变量的关系为 $\\nabla R_t^{(h)} =\
  \ S_t^{(h)}$ 且 $\\nabla^2 R_t^{(h)} = I_t^{(h)}$。斜坡效应仅预期出现在非平稳序列中，并且很容易与需要二阶差分的序列中的\
  \ MIO 混淆。\n\n### 4.3.4 掩蔽与淹没\n\n当由于其他异常值存在引入的参数估计偏差，导致某个异常值或异常值群未被识别时，就会出现掩蔽。淹没则是相反的效应，即异常值产生的偏差导致某些良好观测被识别为异常值。这些效应在异常值群中尤其严重，但也可能发生在孤立异常值上。例如，考虑一个均值为零、方差为单位且参数为\
  \ \\(\\phi\\) 的标量 AR(1) 过程。假设在时间 \\(t = h$ 处有一个大小为 \\(w_h\\) 的 AO，并设 \\(\\hat{\\\
  phi}\\) 为使用受污染数据 \\(z_t$ 估计得到的参数。此时的估计残差为\n\n$$\\hat{e}_h = z_h - \\hat{\\phi}z_{h-1}\
  \ = a_h + w_h + (\\phi - \\hat{\\phi})y_{h-1}.$$\n\n由于存在异常值，通常有 \\(\\phi > \\hat{\\\
  phi}\\)。如果 \\(y_{h-1} < 0$，则异常值的影响 \\(w_h$ 可能会被参数估计中的偏差所掩蔽（减小）。对于下一个观测，有\n\n$$\\\
  hat{e}_{h+1} = z_{h+1} - \\hat{\\phi}z_h = a_{h+1} - \\hat{\\phi}w_h + (\\phi -\
  \ \\hat{\\phi})y_h.$$\n\n因此，即使观测 \\(z_{h+1}\\) 未受污染，如果异常值大小 \\(\\hat{\\phi}w_h$\
  \ 显著，其残差也可能很大。在这种情况下，良好观测 \\(z_{h+1}$ 将被异常值淹没。\n\n当存在一组连续异常值时，这些效应会更加显著。假设在时间 \\\
  (t = h$ 和 \\(t = h+1$ 处分别存在大小为 \\(w_h$ 和 \\(w_{h+1}$ 的异常值，则\n\n$$\\hat{e}_{h+1}\
  \ = z_{h+1} - \\hat{\\phi}z_h = a_{h+1} + w_{h+1} - \\hat{\\phi}w_h + (\\phi - \\\
  hat{\\phi})y_h,$$\n\n以及\n\n$$\\hat{e}_{h+2} = z_{h+2} - \\hat{\\phi}z_{h+1} = a_{h+2}\
  \ - \\hat{\\phi}w_{h+1} + (\\phi - \\hat{\\phi})y_{h+1}.$$\n\n如果 \\(w_{h+1} \\simeq\
  \ \\hat{\\phi}w_h$，则时间 \\(t = h + 1$ 处异常值的影响被完全掩蔽。如果 \\(-\\hat{\\phi}w_{h+1}$ 较大，则观测\
  \ \\(z_{h+2}$ 被淹没。同样的现象也可能出现在多变量情况中，其中不同参数矩阵和异常值影响向量配置下这两种效应发生的可能性会增加。\n\n## 4.4\
  \ 单变量异常值检测\n\n已有许多单变量异常值检测程序被提出。它们也可通过投影用于搜索多变量异常值，将在后面讨论。最常用的程序由 Chang et al. (1988)、Tsay\
  \ (1986) 和 Chen and Liu (1993) 提出。该程序进一步由 Bianco et al. (2001)、Sánchez and Peña\
  \ (2003) 和 Galeano et al. (2006) 等人改进，使其更加稳健并能够处理多个异常值，避免掩蔽和淹没。此处介绍的程序包含了这些改进。\n\
  \n给定一个观测到的单变量时间序列，可能异常值的检测分为四个步骤：(1) 获取参数的稳健估计并计算残差；(2) 识别水平移位（LS）的位置（如有），并清除检测到的效应；(3)\
  \ 识别其他异常值的位置和大小；(4) 联合估计序列及所有检测到的异常值效应的模型参数。为简单起见，检测程序中仅考虑 LS、AO 和 IO。如果需要，可以轻松纳入其他类型的异常值。\n\
  \n该程序基于使用残差来估计异常值大小。我们已经证明（参见等式 (4.19)、(4.25) 和 (4.22)），受异常值影响的单变量时间序列的残差可表示为\n\n\
  \\(e_t = x_t^C \\omega_C + a_t,\\) (4.29)\n\n其中 \\(C\\) 表示异常值类型，\\(C \\in (LS, AO,\
  \ IO)\\)，\\(\\omega_C\\) 是异常值大小，且如我们所展示，对于 LS，\\(x_t^{LS} = \\pi(B)S_t^{(h)}\\)，对于\
  \ AO，\\(x_t^{AO} = \\pi(B)I_t^{(h)}\\)，对于 IO，\\(x_t^I = I_t^{(h)}\\)。因此，估计异常值大小为\
  \ \\(\\hat{\\omega}_C = \\sum \\hat{e}_t x_t^C / \\sum (x_t^C)^2\\)，其标准差为 \\(s(\\\
  hat{\\omega}) = \\hat{\\sigma}_e / \\sqrt{\\sum (x_t^C)^2}\\)，而 \\(H_0 : \\omega\
  \ = 0\\) 的似然比（LR）检验统计量为 \\(\\lambda_h = \\hat{\\omega}_C / s(\\hat{\\omega}_C)\\\
  )，其中下标 \\(h\\) 用于表示该检验统计量对应时间索引 \\(h\\)。检测程序的详情如下。\n\n- 1. **初始参数与残差稳健估计**：识别序列的初始模型并估计其参数，\\\
  (\\hat{\\pi}^{(0)}(B)z_t = \\hat{e}_t^{(0)}\\)。该首个模型的残差方差由归一化的 \\(mad\\) 估计，\\(\\\
  hat{\\sigma}_e^{(0)} = 1.4815 * \\text{Median}(\\hat{e}_t^{(0)})\\)，且所有满足 \\(|\\\
  hat{e}_t^{(0)}| > 2.5\\hat{\\sigma}_e\\) 的残差都被识别为潜在异常值。设 \\(\\Omega\\) 表示这些可疑残差的时间索引集合。然后估计以下初始稳健模型\n\
  \n\\(z_t = \\sum_{i \\in \\Omega} w_i I_t^{(h_i)} + \\pi(B)^{-1} a_t.\\) (4.30)\n\
  \n设 \\(\\hat{\\pi}_R(B)\\) 为具有等式 (4.30) 参数估计值的 AR 表示。残差通过 \\(\\hat{a}_t = \\hat{\\\
  pi}_R(B)z_t\\) 重新计算，其 mad \\(\\hat{\\sigma}_e\\) 也得到更新。\n\n- 2. **搜索水平移位**。异常值搜索从水平移位开始，因为它们会影响时间索引\
  \ \\(h\\) 之后的所有残差。在每个时间索引 \\(h\\) 处，使用等式 (4.29) 估计水平移位的可能影响。设 \\(h_1\\) 为 \\(|\\\
  lambda_h|\\) 达到最大值的时间索引。如果 \\(|\\lambda_{h_1}| > c_1\\)，其中 \\(c_1\\) 是给定的临界值，则检测到\
  \ \\(h_1\\) 处的潜在水平移位。\\(h_1\\) 处 LS 的大小与模型参数联合估计，通过\n\n\\(z_t = w_L S_t^{(h_1)}\
  \ + \\pi(B)^{-1} a_t.\\) (4.31)\n\n随后可以再次检验 \\(w_L\\) 的显著性。如果估计值 \\(\\hat{w}_L\\\
  ) 确实具有统计显著性，则确认 \\(h_1\\) 处存在 LS，系列通过 \\(z_t^c = z_t - \\hat{w}_L S_t^{(h_1)}\\\
  ) 进行调整，并使用等式 (4.31) 中的新参数估计值重新计算残差。使用新调整后的系列 \\(z_t^{(c)}\\) 重复 LS 搜索。如果新水平移位的大小显著，则通过\
  \ \\(z_t^c = z_t - \\sum \\hat{w}_i S_t^{(h_i)}\\) 得到新的调整系列，并相应重新计算残差。检测过程重复进行，直至不再检测到显著的\
  \ LS。\n\n- 3. **搜索 AO 或 IO**。在每个时间索引 \\(h\\) 处，使用等式 (4.29) 估计这两种可能异常值（A 和 I）的大小。AO\
  \ 的相应效应估计值为 \\(\\hat{\\omega}_A = (\\hat{e}_h - \\pi_1 \\hat{e}_{h+1} - \\cdots\
  \ - \\pi_{T-h} \\hat{e}_T) / \\rho_A^2\\)，其中\n\n\n\n\\(\\rho_A^2 = (1 + \\pi_1^2\
  \ + \\cdots + \\pi_{T-h}^2)\\)，且 \\(\\hat{\\omega}_I = \\hat{\\varepsilon}_h\\)\
  \ 对于 IO。在每个时间 \\(h\\)，似然比检验（LRT）统计量 \\(\\lambda_h^C = \\hat{\\omega}_h / s(\\hat{\\\
  omega}_h)\\) 对于 \\(C = AO, IO\\)，其中标准误是按照线性回归模型计算的。令 \\(g\\) 为满足 \\(|\\lambda_g^A|\
  \ = \\max_h |\\lambda_h^A|\\) 的时间点，令 \\(m\\) 为满足 \\(|\\lambda_m^I| = \\max_h |\\\
  lambda_h^I|\\) 的时间点。令 \\(\\lambda_{Max} = \\max\\{|\\lambda_g^{AO}|, |\\lambda_m^{IO}|\\\
  }\\)。如果 \\(\\lambda_{Max} > c_2\\)，其中 \\(c_2\\) 是预设的临界值，我们得出结论：该序列检测到离群点。否则，序列中不存在离群点。检测到的离群点的影响在序列中被校正，对于\
  \ AO 为 \\(\\hat{\\varepsilon}_g = z_g - \\hat{\\omega}_A\\)，对于 IO 残差通过 \\(\\hat{\\\
  varepsilon}_m = \\hat{\\varepsilon}_m - \\hat{\\omega}_I\\) 校正。对 AO 或 IO 的搜索将持续进行，直到不再检测到离群点。\n\
  \n### 4. 离群点影响和参数的最终联合估计。\n\n当检测程序结束时，所有检测到的离群点影响和模型参数将被联合估计。假设在时间 \\(t_1, t_2,\
  \ ..., t_u\\) 检测到了水平变移，在时间 \\(t_1^*, t_2^*, ..., t_v^*\\) 检测到了离群点。最终模型变为\n\n```\n\
  \\(z_t = \\sum_{j=1}^u \\omega_j s_t^{(i)} + \\sum_{j=1}^v \\omega_j v_{t_j^*}(B)\
  \ l_t^{(t_j^*)} + \\psi(B) a_t,\\)\n```\n\n其中，如果离群点为 AO，则 \\(v_{t^*}(B) = 1\\)；如果为\
  \ IO，则 \\(v_{t_i^*}(B) = \\psi(B)\\)。统计上不显著的影响将被逐一消除，并重新估计模型，直到所有影响和估计系数均显著。\n\n\
  临界值 \\(c_1\\) 和 \\(c_2\\) 通常取在区间 [3, 3.5] 内，并通过 Chang et al. (1988) 的模拟得到。这些截断值必须取决于样本量，因为所使用的检验统计量是每个时间索引上的最大值。如果统计量\
  \ \\(\\lambda_h\\) 相互独立，则\n\n```\n\\(Pr(\\lambda_1 \\le a, ..., \\lambda_T \\le\
  \ a) = Pr(\\lambda_1 \\le a)^T = 1 - \\alpha,\\)\n```\n\n其中 \\(\\alpha\\) 是第一类错误。例如，如果我们希望不发生错误离群点检测的概率为\
  \ 0.95，即 \\(\\alpha = 0.05\\)，则必须选择临界值 \\(a = z_{0.95^{1/T}}\\)，其中 \\(z_v\\) 是标准高斯分布的\
  \ \\(100v\\) 分位数。然而，所使用的检验统计量 \\(\\lambda_i\\) 是相关的，先前的值 \\(a\\) 变成了保守的选择。检验统计量之间的依赖关系使得确定\
  \ \\(c_1\\) 和 \\(c_2\\) 的适当临界值变得困难，甚至不可能。从理论上讲，可以使用错误发现率（FDR）的概念来选择它们；例如，参见 Efron\
  \ and Hastie (2016) 第 15 章。然而，蒙特卡洛模拟表明，这种方法并不比使用最大值的分布提供更好的结果。\n\n应用此检测程序时，重要的是逐一进行水平变移的校正，并联合估计其影响。例如，假设一个序列有两个大小为\
  \ 5 和 10 的 LS。如果先检测到第二个变移，则由于第一个变移的存在，其大小估计将不准确。然而，当两个水平变移被识别并联合估计其影响时，偏差问题就不会出现。类似的偏差问题也可能出现在其余离群点中，虽然通常不如水平变移严重。为避免偏差和错误检测，建议逐一校正离群点，并始终将检测到的离群点纳入联合估计中。请注意，如果序列是非平稳的，IO\
  \ 可能会与其他离群效应混淆，例如 I(1) 序列中的水平变移和 I(2) 过程中的斜坡效应。在接受整合时间序列中的 IO 之前，应始终检查以确保它没有掩盖另一种类型的离群点。\n\
  \n### 4.4.1 单变量离群点检测的其他程序\n\n存在一些离群点检测的替代方法。我们将在下面简要提及其中一些。首先，有大量证据表明，对所有检验统计量使用相同的临界值可能会将水平变移误识别为创新离群点；参见\
  \ Balke (1993) 和 Sánchez and Peña (2003)。后者作者表明，检测水平变移的检验统计量的临界值与检验加性离群点或创新离群点的临界值不同。因此，在检查其他类型的离群点之前，识别序列中的水平变移很重要。Bai\
  \ (1994) 没有使用干预模型来检验水平变移，而是提出了一个累积和（cusum）统计量，相对于 LRT 干预模型具有多种优势。首先，不需要指定 ARMA 模型的阶数，在存在水平变移时这可能很困难。其次，该统计量似乎对其他离群点的存在具有鲁棒性，而\
  \ LRT 统计量则不然。Galeano et al. (2006) 在一项蒙特卡洛研究中表明，这种方法优于 LRT。该方法在附录中解释。\n\n其次，如果序列有多个离群点，参数估计可能会遇到显著偏差，进而影响检验统计量的效力。Luceño\
  \ (1998) 和 Justel et al. (2000) 研究了前一节初始清洗程序的一些替代方法。Hendry et al. (2008) 提出了一种使用高度饱和干预模型快速检测\
  \ AO 和水平变移的方法。为简化展示，假设我们有兴趣检测 AR(p) 过程中的 AO。这些作者建议通过以下方式估计模型：\n\n```\nz_t = \\sum_{i=1}^p\
  \ \\phi_i z_{t-i} + \\sum_{j=h_1}^{h_2} w_j I_t^{(j)} + u_t, \\quad t = 1, \\dots,\
  \ T, \\quad (4.32)\n```\n\n其中 \\(I_t^{(j)}\\) 是时间索引 \\(j\\) 的指示变量，\\(h_1\\) 和 \\\
  (h_2\\) 是两个正整数。该程序的工作方式如下：\n\n- 在观测值的前半部分引入指示变量，并使用 \\(h_1 = 1\\) 和 \\(h_2 = [n/2]\\\
  )（即 \\(n/2\\) 的整数部分）估计模型 (4.32)。识别具有显著 \\(\\hat{w}_j\\) 估计的观测值，并将这些数据点视为潜在离群点集合；\n\
  - 在样本的后半部分，使用 \\(h_1 = [n/2] + 1\\) 和 \\(h_2 = T\\) 估计模型 (4.32)。通过包括具有显著估计 \\(\\\
  hat{w}_j\\) 的数据点来扩充潜在离群点集合；\n- 为潜在离群点集合中的观测值估计带有指示变量的模型，并检查新估计 \\(\\hat{w}_i\\)\
  \ 的显著性。\n\n为控制该程序中进行的大量检验，\\(H_0 : w = 0\\) 的 \\(t\\) 检验显著性水平选择为 \\(\\alpha = 1/T\\\
  )，因此我们期望在样本中发现 \\(T\\alpha = 1\\) 个错误离群点。该方法的一个优点是它同时兼顾了鲁棒参数估计和离群点检测，因为可疑观测值的影响已被处理。然而，一个缺点是它可能无法正确识别离群点的数量。假设在\
  \ \\(t = h\\) 处发生一个 AO。关于其大小的信息包含在 \\(p\\) 个残差 \\(\\hat{e}_h, \\dots, \\hat{e}_{h+p}\\\
  ) 中，因此，我们可能会在时间点 \\(h + j\\) 发现几个由 \\(t = h\\) 处单个离群点引起的离群点。尽管如此，该程序为许多时间序列的 AO\
  \ 提供了一种快速进行鲁棒估计的方法。对于 LS，效率较低，因为所有阶跃变量高度相关，使得分离它们的影响以识别水平变移变得更加困难。\n\n### 示例 4.3\n\
  \n我们使用 tsoutliers 包来检测单变量时间序列中的离群点。该包基于 Chen and Liu (1993) 的检测程序，与第 4.4 节中描述的程序类似。我们使用了\
  \ 2017 年 3 月台湾 AirBox 每小时 PM2.5 测量的前两个系列。程序为第一个系列选择的模型是 ARIMA(1,0,1)，为第二个系列选择的是\
  \ ARIMA(2,0,0)。\n\n```\n> require(tsoutliers)\n>x= read.csv(\"TaiwanAirBox032017.csv\"\
  )\n>x=as.matrix(x)\n>x=x[,-1]   # Remove the row number\n>y1=as.ts(x[,1])\n>y2=as.ts(x[,2])\n\
  >M1=tso(y1)\n>M1$outliers\n```\n\n| 类型 | 索引 | 时间 | 系数估计   | t统计量     |\n|------|-----|------|-----------|-----------|\n\
  | TC   | 14  | 14   | -16.71296 | -4.207933 |\n| LS   | 86  | 86   | 17.30870  |\
  \ 6.124887  |\n| LS   | 464 | 464  | -10.35496 | -4.818682 |\n| TC   | 608 | 608\
  \  | 21.41543  | 5.225062  |\n| AO   | 609 | 609  | 20.87007  | 7.108145  |\n\n\
  ```\n>ylad=M1$yadj\n>ts.plot(y1,main=\"original and adjusted series\", ylab=\"PM2.5\"\
  ,\n      xlab=\"First series Taiwan AirBox data\",pch=0,  lty=1)\n>lines (ylad,col=\"\
  red\")\n>M2=tso(y2)\n>M2$outliers\nEight outliers were detected\n```\n\n因此，AirBox\
  \ 数据的第一个系列中发现了五个离群点，第二个系列中发现了八个离群点。第一个系列中检测到的离群点包括两个水平变移、两个临时水平变化和一个 AO。图 4.5 展示了原始序列和离群点调整后序列的时间图。\n\
  \n### 4.4.2 离群点检测的新方法\n\n随着高维统计分析的进步，可以使用惩罚线性回归方法以更直接的方式检测离群点，使新方法在处理许多时间序列的集合时在计算上更高效。本研究中使用的方法是\
  \ Lasso 回归，在第 1 章中简要提及，在第 7 章中详细讨论。这里我们使用带有阶跃函数的 Lasso 来检测水平变移，并使用指示变量来检测 AO。Lasso\
  \ 线性回归的一个优点是预测变量的数量可以大于样本量。因此，我们可以同时考虑时间序列中所有可能的水平变移或所有 AO。\n\n\n\n\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_206_0.png)\n\
  \n**图 4.5** AirBox 数据集第一系列的时间序列图。原始系列显示为黑色，去除两个水平移位和三个其他异常值影响后的调整系列显示为虚线红色。\n\n\
  接下来，我们介绍 Lasso 回归的基本概念，用于检测水平移位和 AOs。为简化计算，我们假设研究系列为 AR 模型，并使用交叉验证来选择 Lasso 惩罚参数。如方程\
  \ (4.23) 所示，在时间 t = h 存在水平移位的 AR(p) 过程的残差可写为\n\n$$\n\\begin{bmatrix} e_1 \\ \\vdots\
  \ \\ e_{h-1} \\ e_h \\ e_{h+1} \\ \\vdots \\ e_T \\end{bmatrix} = \\omega_h \\begin{bmatrix}\
  \ 0 \\ \\vdots \\ 0 \\ 1 \\ 1 - \\phi_1 \\ \\vdots \\ 1 - \\sum_{j=1}^{T-h} \\phi_j\
  \ \\end{bmatrix} + \\begin{bmatrix} a_1 \\ \\vdots \\ a_{h-1} \\ a_h \\ a_{h+1}\
  \ \\ \\vdots \\ a_T \\end{bmatrix}.\n$$\n\n或者，以向量形式，我们有\n\n$$\n\\boldsymbol{e} =\
  \ \\omega_h \\mathbf{x}_h + \\mathbf{a}.\n$$\n\n因此，如前所述，我们创建预测器 x_h 并通过最小二乘法（LS）估计\
  \ \\omega_h。由于在实际中 h 是未知的，我们可以创建许多预测器 {x_h | h = j_0, ..., T - j_0}，其中 j_0 是一个小的正整数。使用\
  \ j_0 的原因显而易见。例如，我们不能在 t = 1 或 t = T 处有水平移位。在文献中，可以对每个 h 进行此类估计。然而，使用 Lasso 等惩罚估计时，可以通过线性回归模型同时估计所有\
  \ \\omega_h\n\n$$\n\\boldsymbol{e} = \\sum_{h=j_0}^{T-j_0} \\omega_h \\mathbf{x}_h\
  \ + \\mathbf{a}, \\qquad (4.33)\n$$\n\n并使用惩罚 \\(\\lambda \\sum_{h=j_0}^{T-j_0} |\\\
  omega_h|\\) 进行惩罚估计，其中 \\(\\lambda\\) 是惩罚参数，其值通过交叉验证选择。\\(^1\\) 由于预测器高度相关且我们遇到强多重共线性，我们提出一个两步程序。我们假设，如同通常的\
  \ Lasso 回归一样，预测器已标准化，两步程序如下：\n\n- 1. 第 1 步。设 \\(\\hat{\\omega}_h\\) 为模型 (4.33) 中参数的\
  \ Lasso 估计值。选择那些 \\(|\\hat{\\omega}_{h_i}|\\) 大于所有 \\(|\\hat{\\omega}_h|\\) 的 90%\
  \ 分位数的值作为水平移位的可能候选项。用 \\(\\{h_1, ..., h_m\\}\\) 表示所选时间点，其中 \\(m \\approx [T/10]\\\
  )，\\(T\\) 为样本量。\n- 2. 第 2 步。执行线性回归\n\n\\(\\boldsymbol{e} = \\sum_{i=1}^m \\omega_{h_i}\
  \ \\mathbf{x}_{h_i} + \\boldsymbol{a}.\\) (4.34)\n\n设 \\(t_{h_i}\\) 为 Eq. (4.34)\
  \ 中 \\(\\omega_{h_i}\\) 最小二乘估计的 t 比值。那么，当且仅当 \\(|t_{h_i}| > c_1\\) 时，\\(z_t\\) 在\
  \ \\(t = h_i\\) 处具有大小为 \\(\\widehat{\\omega}_{h_i}\\) 的水平移位，其中 \\(c_1\\) 是临界值。基于时间序列分析异常值检测文献中使用的临界值，我们采用\
  \ \\(c_1 = 3.5\\)。如果所有 \\(t_{h_i}\\) 的大小均小于 \\(c_1$，则系列 \\(z_t\\) 没有水平移位。\n\n最后，可以通过以下方式获得水平移位调整后的创新系列\n\
  \n\\(\\tilde{\\boldsymbol{e}} = \\boldsymbol{e} - \\sum_{i \\in S} \\widehat{\\\
  omega}_{h_i} \\mathbf{x}_{h_i},\\)\n\n其中 \\(S = \\{h_i | |t_{h_i}| > c_1\\}\\)，\\\
  (\\widehat{\\omega}_{h_i}\\) 是 Eq. (4.34) 中的最小二乘估计值。然后可以通过用 AR 多项式 \\(\\phi(B)\\\
  ) 滤波 \\(\\tilde{\\boldsymbol{e}}\\) 来获得水平移位调整后的时间序列 \\(\\tilde{z}_t\\)。在实践中，\\(\\\
  phi(B)\\) 是未知的，但我们使用对 \\(z_t\\) 拟合 AR(\\(p\\)) 模型的估计值。如果需要，可以使用 AR(\\(p\\)) 模型的稳健估计来减轻\
  \ \\(z_t\\) 中水平移位和其他异常值的影响，或使用基于检测到的水平移位的迭代方法。\n\n还应注意，也可以使用惩罚线性回归方法来检测时间序列中的 AOs、暂时性变化或创新异常值。例如，考虑时间点\
  \ \\(t = h\\) 处的 AO，那么 \\(\\mathbf{x}_h\\) 将变为 \\((0, ..., 0, 1, -\\phi_1, ...,\
  \ -\\phi_p, 0, ..., 0)'\\)，其中 1 位于 \\(t = h\\)。在这种情况下，多重共线性问题不那么严重，我们可以应用上述两步程序来检测\
  \ AOs。\n\n### 示例 4.4\n\n为演示使用 Lasso 检测水平移位和 AOs，我们采用台湾 AirBox PM\\(_{2.5}\\) 系列。由于第\
  \ 2 章所示系列的特殊性，我们从本研究中移除了系列 29 和 70，因为这些系列仅有少量观测到的 PM\\(_{2.5}\\) 测量值。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_208_0.png)\n\

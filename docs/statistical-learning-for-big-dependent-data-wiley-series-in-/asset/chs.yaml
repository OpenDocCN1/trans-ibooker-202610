  ### 7.6.3 用于分类的 Boosting\n\nBoosting 的首个应用是使用 Freund 和 Schapire (1996, 1997) 的 AdaBoost\
  \ 算法进行二元分类。\n\n在统计文献中，Breiman (1998, 1999) 表明 AdaBoost 算法可以表示为函数空间中的最速下降算法。\n\n\
  如第 5 章所述，给定 n 个元素的集合和每个元素的分类变量向量 x，分类器是一个函数 C(x)，它为每个元素分配一个值 C(x_i) \\in {-1,1}，其中\
  \ 1 \\le i \\le n。\n\n假设我们有一个向量 y = (y_1, ..., y_n)'，其中 y_i \\in {-1,1} 为正确分类值，则分类器\
  \ C(x) 的误差率由下式给出\n\n\\[\\text{Err} = \\frac{1}{n} \\sum_{i=1}^n I(C(\\boldsymbol{x}_i)\
  \ \\neq y_i) \\quad (7.51)\\]\n\n其中 I(x) 是指示函数，即若 x 为真则 I(x) = 1，否则 I(x) = 0。\n\n\
  假设我们选择一个非常简单的分类器，例如 m 最近邻，或者更好的选择，下一章将要研究的分类树。令 \\( C(\\mathbf{x}) \\) 为所选的弱分类器。那么，AdaBoost\
  \ 算法的工作过程如下：\n\n- 设置权重 \\( w_i^{(1)} = 1/n \\)。\n- 对 \\( l = 1, \\dots, L \\)\n\
  \  - 使用权重 \\( w_i^{(l)} \\) 将分类器 \\( C_l(\\mathbf{x}) \\) 拟合到数据上。\n  - 使用权重 \\(\
  \ w_i^{(l)} \\) 计算误差率，\n\n    \\[\\text{Err}_l = \\frac{\\sum_{i=1}^n w_i^{(l)}\
  \ I(C_l(\\mathbf{x}_i) \\neq y_i)}{\\sum_{i=1}^n w_i^{(l)}}\\] (7.52)\n\n  - 计算\n\
  \n    \\[\\alpha_l = \\log((1 - \\text{Err}_l) / \\text{Err}_l)\\] (7.53)\n\n  -\
  \ 按如下方式修改权重\n\n    \\[ w_i^{(l+1)} = w_i^{(l)} \\exp\\{ \\alpha_l I(C_l(\\mathbf{x}_i)\
  \ \\neq y_i) \\}\\] (7.54)\n\n- 最终分类如下\n\n  \\[ C(\\mathbf{x}_i) = \\text{sign}\
  \ \\left[ \\sum_{l=1}^L \\alpha_l C_l(\\mathbf{x}_i) \\right] \\] (7.55)\n\n请注意，根据公式\
  \ (7.54)，每次迭代中每个观测值的权重都会被修改。如果该元素被正确分类，则权重保持不变，\\( w_i^{(l+1)} = w_i^{(l)} \\)。如果分类错误，则其权重增加为\
  \ \\( w_i^{(l+1)} = w_i^{(l)} \\exp\\{ \\alpha_l \\} \\)。因此，正确分类观测值的相对权重降低，而错误分类观测值的相对权重升高。权重的变化取决于\
  \ \\( \\alpha_l \\)，即成功率与误差率之比的 logit，参见公式 (7.53)，它是最终解中分类器的权重。图 7.28 显示了分类器误差率与其权重之间的关系。最后，最终分类器是所有分类器的线性组合。在第\
  \ 8 章中，我们将看到一个使用分类树作为弱分类器的 AdaBoost 示例。\n\n## 7.7 混合频率数据与实时预测\n\n数据丰富的环境也导致了不同频率观测数据广泛可用的情况。例如，考虑预测美国\
  \ GDP 季度增长率的问题。有许多可用的月度或周度经济数据可能对美国 GDP 增长有贡献。例如，月度失业率和周度（甚至日度）原油价格可能会影响美国经济，进而影响其\
  \ GDP 增长。那么问题就在于如何利用高频数据中蕴含的信息来辅助 GDP 的预测。可以将月度或周度经济数据汇总为季度数据，并使用季度汇总数据来预测 GDP。但汇总往往会因中心极限定理的影响而导致信息丢失。确实，季度数据比其周度或日度对应数据更接近正态分布。因此，直接使用可用的月度或周度数据来辅助季度\
  \ GDP 预测似乎是明智的。这种预测问题在计量经济学文献中通常被称为 MIDAS 方法。参见，例如，Andreou et al. (2010)。MIDAS 预测方法特别感兴趣的是使用新可用的高频数据来更新对较低频率因变量的预测。例如，在季度预测起点\
  \ t = n 时，可以使用合适的计量经济模型来预测季度 t = n + 1 的 GDP 增长率。这与传统的 1 步先行预测类似。然而，随着时间的推移，例如进入季度\
  \ t = n + 1 后的一个月，月度预测变量即可获得。然后可以使用混合频率模型来更新 GDP 预测。这种更新程序在文献中称为 nowcasting。在以下内容中，我们将简要介绍可用于\
  \ nowcasting 的 MIDAS 回归和计量经济模型。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_426_0.png)\n\
  \n图 7.28 AdaBoost 最终分类器中分类器误差率与其权重之间的关系。\n\n### 7.7.1 MIDAS 回归\n\n要介绍 MIDAS 回归，我们考虑较低频率因变量\
  \ \\( y_t \\) 与单个高预测变量 \\( x_{t,j}^{(g)} \\) 的简单情况，其中 \\( g > 1 \\) 是正整数，表示 \\(\
  \ t \\) 与 \\( t-1 \\) 之间预测变量的观测次数，且 \\( j = 1, \\dots, g \\)。例如，如果时间索引 \\( t \\\
  ) 表示季度，则月度变量的 \\( g = 3 \\)，而日度变量的 \\( g = 91 \\) 或 \\( 66 \\)，假设一个月平均有 30.4 天或\
  \ 22 个交易日。图 7.29 绘制了观测数据的大致时间戳，时间从左向右流逝，\\( y(t) \\) 是因变量，\\( x(t, j) \\) 是预测变量。为了记号简洁，在本节中我们将时间序列的下标\
  \ \\( i \\) 视为观测序列的纯索引。可以理解的是，对于低频因变量 \\( y_t \\)，索引 \\( i \\) 与时间 \\( t \\) 相同，但对于高频预测变量\
  \ \\( x_{t,j} \\)，索引 \\( i \\) 由 \\( i = (t-1)g + j = tg - (g-j) \\) 给出，这是时间段 \\\
  ( t \\) 中的第 \\( j \\) 次观测。为了说明，假设 \\( y_t \\) 为季度数据，\\( x_{t,j} \\) 为月度数据，且可用数据始于\
  \ 1980 年。那么，\\( y_1 \\) 和 \\( y_2 \\) 分别是 \\( y_t \\) 在 1980 年第一和第二季度的数据。另一方面，\\\
  ( x_1 \\) 和 \\( x_4 \\) 分别是 \\( x_{t,j} \\) 在 1980 年第一和第四个月的数据，其中 \\( 4 = (t-1)\
  \ \\times 3 + 1 \\) 且 \\( t = 2 \\)。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_427_0.png)\n\
  \n在预测起点 \\( t-1 \\) 处，混合频率数据的一个朴素模型可以采用如下形式\n\n$y_i = \\phi_0 + \\sum_{j=1}^p \\\
  phi_j y_{i-j} + \\sum_{v=1}^q \\beta_v \\left[ \\sum_{j=1}^g w_j x_{(i-1)g-(g-j)}\
  \ \\right] + e_i, \\quad (7.56)$\n\n其中 \\( p \\) 和 \\( q \\) 为正整数，\\( e_i \\) 表示误差项。在公式\
  \ (7.56) 中，\\( \\phi_j \\) 为 AR 参数，\\( \\beta_v \\) 衡量 \\( \\{x_{t-i\\cdot j}|j=1,\
  \ ..., g\\} \\) 的汇总对 \\( y_t \\) 的影响，\\( w_j \\) 为权重，假设满足条件 \\( 0 \\le w_j < 1 \\\
  ) 和 \\( \\sum_{j=1}^g w_j = 1 \\)。特别是，如果 \\( w_j = w \\)（非零常数），则采用简单汇总来处理预测变量。当存在许多具有较大\
  \ \\( g \\) 的高频预测变量时，公式 (7.56) 中的模型将使用许多权重系数 \\( w_j \\)，使得模型难以估计且效率低下。Andreou et\
  \ al. (2010) 假设权重 \\( w_j \\) 遵循某些仅由少量参数驱动的众所周知函数，例如指数 Almon 滞后多项式。例如，\n\n$w_j \\\
  equiv w_j(\\theta_1, \\theta_2) = \\frac{\\exp[\\theta_1 j + \\theta_2 j^2]}{\\\
  sum_{i=1}^g \\exp[\\theta_1 i + \\theta_2 i^2]},$\n\n其中 \\( \\theta_1 \\) 和 \\(\
  \ \\theta_2 \\) 为底层未知参数。这里定义的权重 \\( w_j \\) 使得当预测变量远离 \\( y_t \\) 时权重平滑衰减。也可以使用其他权重函数。Ghysels\
  \ et al. (2016) 提供了一些权重函数的选择。MIDAS 回归的关键思想是采用一个权重函数，从而为 \\( y_t \\) 得到一个简洁的回归模型。\n\
  \n在指定权重函数 \\( w_j \\) 后，公式 (7.56) 中的 MIDAS 回归模型可以通过非线性最小二乘法估计。该模型的一些性质在 Andreou\
  \ et al. (2010) 中给出。\n\n### 7.7.2 实时预测\n\n公式 (7.56) 中的 MIDAS 回归模型遵循使用时间 \\( t-1\
  \ \\) 时可用信息来预测 \\( y_t \\) 的传统。这种预测可以看作是\n\n\n初始预测。有了高频数据 $\\{x_{t,j}\\}$ 的可用性，可以利用新可用的信息来更新\
  \ $y_t$ 的预测。这种预测更新方法被称为 *即时预测*，因为预测中使用了当前时间段 $t$ 的一些信息。\n\n同样，我们使用单一因变量和单一高频预测变量\
  \ $\\{x_{t,j}|j = 1, ..., g\\}$ 来介绍即时预测。考虑季度 $t$ 中已进行 $j_o$ 的情况，其中 $1 \\le j_o <\
  \ g$。即时预测回归可采取以下形式\n\n```\n$y_i = \\phi_0 + \\sum_{j=1}^p \\phi_j y_{i-j} + \\sum_{v=1}^q\
  \ \\beta_v \\left[ \\sum_{j=1}^g w_j x_{(i-v)g-(g-j)} \\right] + \\sum_{j=1}^{j_o}\
  \ \\gamma_j x_{ig-(g-j)} + e_i, \\quad (7.57)$\n```\n\n其中除新增预测变量 $x_{i,j}$ 的参数外，所有参数均在\
  \ Eq. (7.56) 中定义，$\\gamma_j$ 表示在存在所有其他预测变量的情况下 $x_{i,j}$ 对 $y_i$ 的条件贡献。如果 $j_o$\
  \ 较大，则 $\\gamma_j$ 可能遵循与 Eq. (7.56) 中使用的某些权重函数相似。换言之，即时预测的另一种模型是\n\n```\n$y_i =\
  \ \\phi_0 + \\sum_{j=1}^p \\phi_j y_{i-j} + \\sum_{v=1}^q \\beta_v \\left[ \\sum_{j=1}^g\
  \ w_j x_{(i-v)g-(g-j)} \\right] + \\gamma \\sum_{j=1}^{j_o} v_j x_{ig-(g-j)} + e_i,\
  \ \\quad (7.58)$\n```\n\n其中 $v_j$ 是用于聚合时间段 $t$ 中预测变量 $\\{x_{t,j}|j = 1, ..., j_o\\\
  }$ 的权重。\n\n显然，当高频预测变量可用时，即时预测的想法适用于大多数统计预测模型。例如，不使用 MIDAS 回归的权重函数，可以将模型视为带外生变量的高维\
  \ AR 模型，并使用之前讨论过的某些正则化估计方法（例如 Lasso 方法）来估计该模型。\n\nMIDAS 回归可通过 R 中的 *midasr* 包使用。该包也可用于计算\
  \ Almon 滞后多项式的权重。有关该包的详细信息可参见 Ghysels et al. (2016)。\n\n### 示例 7.9\n\n为了说明 MIDAS\
  \ 回归，我们考虑美国季度 GDP 从 1986 年第一季度到 2019 年第二季度的增长率。使用的两个高频预测变量是 (a) 月度失业率变化，($x_{t,i}|i=1,\
  \ 2, 3$)，以及 (b) 每周原油价格（西得克萨斯中间基原油，俄克拉荷马州库欣）的变化，($z_{t,i}|i=1, ..., 12$)。因此，我们有一个月度外生预测变量和一个每周外生预测变量。对于\
  \ Eq. (7.56) 的预测模型，AR 部分使用 $p=2$，失业率使用 $q=2$，原油价格使用 $q=4$。此外，我们使用指数 Almon 滞后多项式（*midasr*\
  \ 中的 *nealmon* 命令）作为权重函数。对于月度失业率，使用的滞后为 3-5，对于每周原油价格，使用的滞后为 12-23。这些滞后涵盖了季度中的高频预测变量。此类\
  \ MIDAS 回归使用的 R 命令和相关输出如下所示于 R 演示中。在此特定情况下，输出显示高频预测变量的条件贡献不强。\n\n转向即时预测。考虑了两种情况。在第一种情况中，我们使用季度内一个月的高频数据。在这里，失业率使用\
  \ $q=2$，原油价格使用 q = 3。命令的详细信息和相关输出也在下面的 R 演示中给出。有趣的是，对于两个高频预测变量，并发值（即 unrate11 和\
  \ coilchg11）在常规 5% 水平上显著。在第二种情况中，我们使用季度内两个月的高频数据。结果与一个月的情况相似，因为并发高频数据有助于解释美国季度 GDP\
  \ 增长率。\n\n### R 演示：MIDAS 回归。R 脚本由罗格斯大学的 Han Yuefeng 博士提供。\n\n#### (A) 用于预测的 MIDAS\
  \ 回归。\n\n- (1) R 脚本\n\n```\ngdp8619<-read.csv(\"q-gdp8619.csv\", header = TRUE)\n\
  gdp<-gdp8619$A191RP1Q027SBEA\nunrate8619d.csv<-read.csv(\"m-unrate8619d.csv\", header\
  \ = TRUE)\nunrate<-unrate8619d.csv$ratechg\ncoilchg.csv<-read.csv(\"w-coilchg.csv\"\
  , header = TRUE)\ncoilchg<-coilchg.csv$coilchg\nlibrary(midasr)\nt=2 # time lag\
  \ for gdp\nt1=3 # time lag for unrate\nt2=12 # time lag for crude oil price\nfit<-midas_r(gdp~mls(gdp,1:t,1)+mls(unrate,3:(t1+2),3,nealmon)+\n\
  mls(coilchg,12:(t2+11),12,nealmon),\nstart=list(unrate=c(-1,-1),coilchg=rep(0,4)),\n\
  #aggregation within a quarter 2 and 4\nmethod=\"Nelder-Mead\")\n#print(fit); print(summary(fit))\n\
  ```\n\n- (2) 输出\n\n```\n> names(fit)\n[1] \"coefficients\"   \"midas_coefficients\"\

  \ is displayed\n> plot(g1lo, main=\"Group 1 of average days\")\n> plot(g2lo, main=\"\
  Group 2 of average days\")\n> plot(g3lo, main=\"Group 3 of average days\")\n> plot(g4lo,\
  \ main=\"Group 4 of average days\")\n> plot(g0lo, main=\"Group 0 of average days\"\
  )\n```\n\n## 5.4 时间序列分类\n\n判别，或分类，出现在人类活动的许多领域：从医疗诊断到信用评分，再从欺诈检测到识别艺术赝品。判别分析的首次应用由\
  \ R. A. Fisher 于 1935 年发明（参见 Fisher Box, 1978），包括通过利用人类头骨和其他类人猿头骨的物理颅骨测量值分布，将发掘中发现的头骨遗骸分类为人类或非人类。\n\
  \n在时间序列分析中，假设我们有一个系统，它处于 c 种可能状态之一，例如 S = (s1, ..., sc)，并且它生成一系列向量，其属性取决于状态。给定状态时，这些时间序列向量的特征是已知的，或者可以通过在每种状态下生成的序列样本来估计，我们的目标是给定状态时预测系统的预期输出。现在，观察到一个新的时间序列向量，但状态未知，我们想要估计系统的状态。在接下来的内容中，我们将状态和簇互换使用。\n\
  \n所使用的方法取决于簇的可用信息。对于第一类方法，我们知道每个簇的时间序列模型。因此，我们可以计算观察到的时间序列由给定簇的模型生成的概率，并将序列分类到概率最高的簇中。对于第二类方法，我们知道每个簇中时间序列的特征（或变量）向量的分布，并使用这些特征进行分类。这种情况类似于多变量分析中的标准判别问题。对于第三类方法，我们知道给定簇中特征向量的一些属性，但不知道它们的联合分布，并使用非参数方法进行分类。\n\
  \n### 5.4.1 一组模型中的分类\n\n首先假设系统的输出是一个单变量时间序列，并且给定状态时生成该序列的模型是已知的。因此，我们观察到一个序列，z =\
  \ (z1, ..., zT)'，它由 c 个过程中的一个生成，具有边缘均值向量 \\(\\mu_j = (\\mu_{j1}, \\dots, \\mu_{jT})'\\\
  )，其中 \\(j = 1, \\dots, c\\)，以及依赖于滞后的协方差矩阵，表示为 \\(\\Sigma_j = \\{\\gamma_j(\\ell)\
  \ : 0 \\le \\ell \\le T - 1\\}\\)，其中 \\(\\gamma_j(\\ell) = E[(z_t - \\mu_{j,t})(z_{t-\\\
  ell} - \\mu_{j,t-\\ell})]\\)。假设我们有系统处于第 \\(i\\) 个状态的先验概率 \\(p(s_i)\\)，其中 \\(\\sum_{i=1}^c\
  \ p(s_i) = 1\\)。根据贝叶斯定理，系统处于状态 \\(s_i\\) 的后验概率为\n\n```\n\\(p(s_i|\\mathbf{z}) =\
  \ \\frac{p(\\mathbf{z}|s_i)p(s_i)}{\\sum_{j=1}^c p(\\mathbf{z}|s_j)p(s_j)}.\\) (5.45)\n\
  ```\n\n要计算 \\(p(\\mathbf{z}|s_i)\\)，通常假设过程是高斯的，因此概率与似然成正比，我们有\n\n```\n\\(p(\\mathbf{z}|s_j)\
  \ \\propto |\\boldsymbol{\\Sigma}_j|^{-\\frac{1}{2}} \\exp \\left[ -\\frac{1}{2}\
  \ (\\mathbf{z} - \\boldsymbol{\\mu}_j)' \\boldsymbol{\\Sigma}_j^{-1} (\\mathbf{z}\
  \ - \\boldsymbol{\\mu}_j) \\right],\\) (5.46)\n```\n\n并且状态被估计为具有最高后验概率的状态\n\n```\n\
  \\(\\widehat{s}_i = \\arg \\max_{s_j \\in S} [p(\\mathbf{z}|s_j)p(s_j)].\\)\n```\n\
  \n当先验概率相等时，这相当于用 \\(c\\) 个模型拟合序列 \\(\\mathbf{z}\\) 并选择导致最佳拟合的状态。如我们在第 2 章（第 2.8.3\
  \ 节）中看到的，通过预测误差分解，\n\n```\n\\(p(\\mathbf{z}|s_i) = p(z_1|s_i)p(z_2|z_1, s_i)\\dots\
  \ p(z_T|z_1, \\dots, z_{T-1}, s_i).\\)\n```\n\n假设每个状态中的时间序列模型是一个 ARMA \\((p_j, q_j)\\\
  ) 模型，其中 \\(j = 1, \\dots, c\\)。令 \\(e_{jt} = z_t - \\mu_j\\)，\\(e_{jt}\\) 的模型可以写成\
  \ \\(\\pi_j(B)e_{jt} = \\epsilon_{jt}\\)，其中 \\(\\pi_j(B) = 1 - \\pi_{j1}B - \\pi_{j2}B^2\
  \ - \\cdots\\)。因此，\n\n```\n\\(\\left[ \\begin{array}{cccccc} 1 & 0 & 0 & \\cdots\
  \ & 0 & \\\\ -\\pi_{j1} & 1 & 0 & \\cdots & 0 & \\\\ -\\pi_{j2} & -\\pi_{j1} & 1\
  \ & \\cdots & 0 & \\\\ \\vdots & \\vdots & \\vdots & \\ddots & \\vdots & \\\\ -\\\
  pi_{jp} & -\\pi_{j,p-1} & \\cdots & \\cdots & 0 & \\\\ \\vdots & \\vdots & \\cdots\
  \ & \\cdots & \\vdots & \\\\ -\\pi_{j,T-1} & \\pi_{j,T-2} & -\\pi_{jp} & \\cdots\
  \ & 1 & \\end{array} \\right] \\left[ \\begin{array}{c} e_{j1} \\\\ e_{j2} \\\\\
  \ e_{j3} \\\\ \\vdots \\\\ \\vdots \\\\ e_{jT} \\end{array} \\right] = \\left[ \\\
  begin{array}{c} \\epsilon_{j1} \\\\ \\epsilon_{j2} \\\\ \\epsilon_{j3} \\\\ \\vdots\
  \ \\\\ \\vdots \\\\ \\epsilon_{jT} \\end{array} \\right].\\)\n```\n\n或者\n\n```\n\
  \\(\\Pi_j e_j = \\epsilon_j\\)\n```\n\n其中 \\(\\Pi_j\\) 是一个包含第 \\(j\\) 个 ARMA 模型参数的\
  \ Toeplitz 三角矩阵。令 \\(\\sigma_j^2 I\\) 为白噪声过程 \\(\\{\\epsilon_{jt}\\}\\) 的协方差矩阵，并将\
  \ \\(\\Sigma_j\\) 称为 \\(e_j\\) 的协方差矩阵，我们有\n\n```\n\\(\\Pi_j \\Sigma_j \\Pi'_j =\
  \ \\sigma_j^2 I,\\)\n```\n\n因此，\n\n```\n\\(\\Sigma_j^{-1} = \\frac{1}{\\sigma_j^2}\
  \ \\Pi' \\Pi_j.\\)\n```\n\n\n\n由于 $|\\Pi_j| = 1$，作为对角元素均为一的三角矩阵，则 $|\\Sigma_j^{-1}|\
  \ = \\sigma_j^{-2}$，在似然公式 (5.46) 中我们用 $\\sigma_j^{-1}$ 替换 $|\\Sigma_j|^{-\\frac{1}{2}}$。指数为\n\
  \n$$e'_j \\Sigma_j^{-1} e_j = e'_j \\frac{1}{\\sigma_j^2} (\\Pi'_j \\Pi_j) e_j =\
  \ \\frac{1}{\\sigma_j^2} \\sum_{t=1}^T e_{jt}^2.$$\n\n由于 $\\sigma_j^2$ 由 $\\hat{\\\
  sigma}_j^2 = \\sum_{t=1}^T e_{jt}^2 / T$ 估计，公式 (5.46) 中的概率仅取决于 $\\widehat{\\sigma}_j^2$，且后验概率最高的状态是\
  \ $\\widehat{\\sigma}_j^2$ 最小的状态。在这种情况下，判别分析将观测时间序列分配给对时间序列拟合最优（即模型）或一步前项平方预测误差最小的状态。不难看出，通过此过程我们也最小化了分类误差。为简化起见，假设\
  \ $c = 2$，当序列由状态 $s_1$ 生成但被分类到状态 $s_2$ 时的分类误差为\n\n$$p(z \\in s_2 | s_1) \\propto\
  \ p(s_1 | z \\in s_2) p(z \\in s_2)$$\n\n若 $p(s_1 | z \\in s_2)$ 最小，则 $p(z \\in\
  \ s_2 | s_1)$ 将达到最小，这意味着给定 $z$ 时 $s_1$ 的概率必须最小，或给定 $z$ 时 $s_2$ 的概率最大。这解释了所使用的准则。\n\
  \n扩展到多变量时间序列是直接的。假设给定状态时的输出为 $k$ 个时间序列的向量，数据在 $Z$ 中，即一个 $T \\times k$ 矩阵。我们希望选择使\
  \ $p(Z|s_j)$ 最大化的状态。假设所有状态的先验概率相同，则我们希望最大化给定每个可能模型的数据的似然。为简化起见，假设生成的模型为 $VAR(p_j)$。然后，使用第\
  \ 3.2.3 节的符号和第 3 章的结果，我们有\n\n$$\\log p(Z|s_j) \\propto - \\frac{T-p}{2} \\log |\\\
  Sigma_j^a| - \\frac{1}{2} S(\\beta_j),$$\n\n其中 $\\Sigma_j^a$ 是在模型 $VAR(p_j)$ 下估计的残差的协方差矩阵，$\\\
  beta_j$ 为该模型的参数。因此，估计的状态是拟合最优的状态，其优劣由 $|\\Sigma_j^a|$ 衡量。\n\n当各状态的模型未知时，可以使用状态中序列的相关矩阵或频谱进行分类。Kazizawa\
  \ et al. (1998) 提出使用时间序列静态向量的 Kullback-Leibler (KL) 散度，在地震学中区分地震与采矿或核爆炸。假设联合正态性且序列标准化为零均值和单位方差，带有相关矩阵\
  \ $R_0$ 的新观测序列 ($x_{01}, ..., x_{0T}$) 与状态 $s_j$ 的 $R_j$ 矩阵之间的 KL 散度为\n\n$$D_{KL}(0;\
  \ s_j) = \\frac{1}{2} \\left[ \\text{tr}(R_j R_0^{-1}) - \\log \\frac{|R_j|}{|R_0|}\
  \ - kT \\right], \\quad (5.47)$$\n\n序列被分类到使公式 (5.47) 最小的状态。另一种方法是将大的 $kT$ 平方协方差矩阵替换为\
  \ $h$ 取较小值时的 $kh$ 平方协方差矩阵，如前所述。\n\n### 5.4.2 检查分类规则\n\n分类规则估计后，通过某种形式的交叉验证（CV）检验其样本外性能很有用：将样本分为两部分，一部分用于估计分类模型，另一部分用于评估分类误差。对于独立数据，这通常采用\
  \ h 折 CV 或留 h 法 CV 进行，即从样本中随机选择 h 个观测作为测试子样，利用剩余大小为 $T - h$ 的数据（称为训练样本）估计模型，并用估计模型在大小为\
  \ h 的测试子样中计算分类误差。为改进分类误差的估计，可重复该过程多次并得到平均样本外分类误差。将样本划分为训练集和测试集的最佳方式取决于模型，而在实践中似乎效果较好的一般规则是：用\
  \ 60–70% 的样本进行估计，30–40% 用于估计分类误差。\n\n对于时间序列，若随机删除观测值，将面临缺失值问题。然后，如第 4 章所讨论，估计模型，并为被删除的观测值提供插值。最后，利用真实值可计算插值误差。然而，对于相关数据，若删除\
  \ $x_{t_0}$，则后续值 $x_{t_0+1}, \\dots, x_{t_0+k}$ 与 $x_{t_0}$ 相关，因此并未删除 $x_{t_0}$\
  \ 中的全部信息。其结果是，插值误差将小于样本外预测误差。对时间序列进行 CV 的更好方法是将样本分为两个连续时期 $(1, \\dots, t_0)$ 和 $(t_0\
  \ + 1, \\dots, T)$，在第一部分估计模型并在第二部分计算预测误差。为避免预测原点的依赖，对所有满足 $t_{\\min} \\le t_0 \\\
  le T - 1$ 的原点重复此过程，其中 $t_{\\min}$ 取样本中 $T/2$ 至 $2T/3$ 之间的值。该程序称为滚动预测。\n\n当我们使用将在下文讨论的序列特征进行分类时，可通过将样本分为训练样本和测试样本来应用标准\
  \ CV。\n\n## 5.5 基于特征的分类\n\n假设向量时间序列可以总结为一个维度为 $p$ 的特征向量 $\\mathbf{x}$。例如，若输出为平稳单变量时间序列，可通过其自相关系数或通过拟合小波得到的系数的周期图等对其进行总结。对于平稳向量时间序列，可通过交叉相关矩阵或拟合某些基函数的系数对其进行总结。对于非平稳时间序列，可将所选区间中的趋势、季节系数等作为特征。通常，特征的选择取决于具体应用。对于地震时间序列，Shumway\
  \ 和 Stoffer (2000) 使用峰谷振幅作为区分特征，Huang et al. (2004) 使用局部频谱特性处理同类数据。Maharaj 和 Alonso\
  \ (2014) 使用拟合到心电图时间序列的小波的方差和相关系数特征向量，以区分患病人员和健康人员。\n\n首先假设特征向量具有依赖于状态的已知分布。假设正态性，则有\
  \ $\\mathbf{x} \\in N_p(\\mu_j, V_j)$，其中 $j = 1, 2, \\dots, c$。给定观测特征 $\\mathbf{x}_0$\
  \ 的信息时，各状态的概率为 $p(s_i|\\mathbf{x}_0)$，后验概率变为 $p(\\mathbf{x}_0|s_j)$。将 $\\mathbf{z}$\
  \ 替换为 $\\mathbf{x}_0$ 得到的这些概率在公式 (5.45) 和 (5.46) 中给出。因此，解决方案是使用最大后验概率进行分类，或者，若假设先验概率相等，则使用\
  \ ML。\n\n若特征的分布未知，则假设每个状态生成的 $n$ 个向量时间序列样本形式为 $(s_i, \\mathbf{z}_i^T(i))$，其中 $s_i$\
  \ 指示状态，$\\mathbf{z}_1^T(i)$ 是时间序列向量，其被转换为样本 $(s_j, \\mathbf{x}_i)$，其中 $\\mathbf{x}_i$\
  \ 为特征向量。利用这些信息，我们估计给定状态下的特征联合分布 $f(\\mathbf{x}|s_j)$，其常被假设为多元正态分布。为简化后续章节的阐述，我们将参数\
  \ $\\mu_j$ 和 $V_j$ 视为已知，尽管它们通常以常规方式估计。\n\n### 5.5.1 线性判别函数\n\n假设所有状态的先验概率和协方差矩阵相同，即\
  \ $V_j = V$，并首先考虑 $c = 2$ 的情况。假设正态性，特征向量 $\\mathbf{x}_0$ 被分类到第一个状态，当\n\n\\((\\mathbf{x}_0\
  \ - \\mu_1)'\\mathbf{V}^{-1}(\\mathbf{x}_0 - \\mu_1) < (\\mathbf{x}_0 - \\mu_2)'\\\
  mathbf{V}^{-1}(\\mathbf{x}_0 - \\mu_2).\\)\n\n记\n\\(D_i = (\\mathbf{x}_0 - \\mu_i)'\\\
  mathbf{V}^{-1}(\\mathbf{x}_0 - \\mu_i), \\quad i = 1, 2,\\quad (5.48)\\)\n\n为 $\\\
  mathbf{x}_0$ 与均值向量之间的马氏距离，则当 $D_2 > D_1$ 时，输出序列将被分类到第一个总体。该规则的一个著名替代解释可通过将方程写为\n\
  \n\\((\\mu_1 - \\mu_2)'\\mathbf{V}^{-1}\\mathbf{x}_0 > \\frac{1}{2}(\\mu_1 - \\\
  mu_2)'\\mathbf{V}^{-1}(\\mu_1 + \\mu_2),\\)\n\n得到，这意味着特征被组合形成线性指标 $v = \\mathbf{w}'\\\
  mathbf{x}_0$，其中 $\\mathbf{w} = \\mathbf{V}^{-1}(\\mu_1 - \\mu_2)$，若该指标大于给定的\n$v_0\
  \ = \\frac{1}{2}(\\mu_1 - \\mu_2)'\\mathbf{V}^{-1}(\\mu_1 + \\mu_2),$\n\n则选择第一个状态。这就是著名的\
  \ Fisher 线性判别函数（LDF）。不难看出，该规则最小化了分类误差之和 $p(\\mathbf{z} \\in s_2|s_1) + p(\\mathbf{z}\
  \ \\in s_1|s_2)$，其中符号 $\\mathbf{z} \\in s_2$ 表示序列被分类到状态 $s_2$。\n\n在 $c$ 个状态的一般情况下，假设协方差矩阵相同，上述过程的扩展是对\
  \ $i = 1, \\dots, c$ 计算马氏距离 (5.48)，并将序列分类到其均值向量最接近观测特征向量的状态。该规则也可表述为寻找将空间划分为 $c$\
  \ 个区域的 $c-1$ 个分离超平面。\n\n当参数未知且从包含 $n_i$ 个第 $i$ 状态元素的大小为 $n$ 的训练样本中估计，其中 $n = \\\
  sum_{i=1}^c n_i$ 时，均值向量由样本均值估计，协方差矩阵由汇合协方差矩阵估计\n\\(\\widehat{\\mathbf{V}} = \\sum_{i=1}^c\
  \ \\sum_{j=1}^{n_i} (\\mathbf{x}_{ij} - \\bar{\\mathbf{x}}_i)(\\mathbf{x}_{ij} -\
  \ \\bar{\\mathbf{x}}_i)'/(n-c).\\quad (5.49)\\)\n\n\n\n\n### 5.5.2 二次分类与可接受函数\n\n\
  在时间序列分类中，状态的协方差矩阵通常不同。例如，我们看到两个平稳时间序列模型是由两个协方差矩阵不同的高斯总体生成的。这里 c = 2。因此，如果观测值 x_0\
  \ 更可能由状态 1 生成，我们将序列 x_{0t} 分类为状态 1，这意味着\n\n$$ \\log |V_1| + (\\mathbf{x}_0 - \\\
  boldsymbol{\\mu}_1)' \\mathbf{V}_1^{-1} (\\mathbf{x}_0 - \\boldsymbol{\\mu}_1) >\
  \ \\log |V_2| + (\\mathbf{x}_0 - \\boldsymbol{\\mu}_2)' \\mathbf{V}_2^{-1} (\\mathbf{x}_0\
  \ - \\boldsymbol{\\mu}_2), $$\n\n因此，如果\n\n$$ \\mathbf{x}_0' (\\mathbf{V}_1^{-1}\
  \ - \\mathbf{V}_2^{-1}) \\mathbf{x}_0 - 2\\mathbf{x}_0' (\\mathbf{V}_1^{-1} \\boldsymbol{\\\
  mu}_1 - \\mathbf{V}_2^{-1} \\boldsymbol{\\mu}_2) > c, \\quad (5.50) $$\n\n其中 \\\
  ( c = \\log(|V_2|/|V_1|) + \\boldsymbol{\\mu}_2' \\mathbf{V}_2^{-1} \\boldsymbol{\\\
  mu}_2 - \\boldsymbol{\\mu}_1' \\mathbf{V}_1^{-1} \\boldsymbol{\\mu}_1 \\)。这是一个二次判别规则。具体来说，定义\n\
  \n$$ \\mathbf{V}_d^{-1} = (\\mathbf{V}_1^{-1} - \\mathbf{V}_2^{-1}), $$\n\n以及新变量\n\
  \n$$ \\mathbf{y}_0 = \\mathbf{V}_d^{-1/2} \\mathbf{x}_0. $$\n\n设 \\( \\mathbf{y}_0\
  \ = (y_{01}, \\dots, y_{0p})' \\)，并定义 \\( \\mathbf{m} = (m_1, \\dots, m_p)'\\) 为\n\
  \n$$ \\mathbf{y} = \\mathbf{V}_d^{1/2} (\\mathbf{V}_1^{-1} \\boldsymbol{\\mu}_1\
  \ - \\mathbf{V}_2^{-1} \\boldsymbol{\\mu}_2), $$\n\n式 (5.50) 可以写为 \\( \\mathbf{y}_0'\
  \ \\mathbf{y}_0 - 2 \\mathbf{y}_0' \\mathbf{m} > c \\)，或\n\n$$ \\sum_{i=1}^p y_{0i}^2\
  \ - 2 \\sum_{i=1}^p y_{0i} m_i > c, $$\n\n这是关于新变量 \\( y_{0i} \\) 的二次方程。\n\n在 c 个状态的一般情况下，观测值\
  \ \\( \\mathbf{x}_0 \\) 被分类到以下状态中：\n\n$$ D_i(\\mathbf{x}_0) = \\log |\\mathbf{V}_i|\
  \ + (\\mathbf{x}_0 - \\boldsymbol{\\mu}_i)' \\mathbf{V}_i^{-1} (\\mathbf{x}_0 -\
  \ \\boldsymbol{\\mu}_i) \\quad (5.51) $$\n\n其中 \\( D_i(\\mathbf{x}_0) \\) 最大的状态。\n\
  \n当参数必须估计时，在线性情况下，我们需要估计 cp 个均值参数和协方差矩阵的 \\( p(p+1)/2 \\) 个参数。在二次情况下，这个数量增长到 \\\
  ( c(p + p(p+1)/2) \\)，如果特征向量的维度较大，这种估计需要大样本。Friedman (1989) 提议通过以下方式使用协方差矩阵的收缩估计量：\n\
  \n$$ \\widehat{\\mathbf{V}}_i(\\alpha) = \\alpha \\widehat{\\mathbf{V}}_i + (1 -\
  \ \\alpha) \\widehat{\\mathbf{V}}, $$\n\n其中 \\( \\widehat{\\mathbf{V}}_i \\) 是第\
  \ i 组协方差矩阵的估计，\\( \\widehat{\\mathbf{V}} \\) 是式 (5.49) 中的合并协方差矩阵。\n\n在这些情况下，另一种方法是根据某些标准获得良好的线性判别规则。这是\
  \ Anderson 和 Bahadur (1962) 的可接受线性程序的思想。可接受线性程序的集合形式为：\n\n$$ \\mathbf{w} = (t_1\
  \ \\mathbf{V}_1 + t_2 \\mathbf{V}_2)^{-1} (\\boldsymbol{\\mu}_2 - \\boldsymbol{\\\
  mu}_1), \\quad (5.52) $$\n其中 $t_1$ 和 $t_2$ 为正数，使得矩阵 $(t_1 V_1 + t_2 V_2)$ 为正定。那么分类的截断点\
  \ $\\tau$ 为 $\\tau = w' \\mu_1 + t_1 w' V_1 w = w' \\mu_2 - t_2 w' V_2 w$。为了找到 $t_1$\
  \ 和 $t_2$，我们可以固定 $t_1 = 1$，并通过计算分类误差并使其和尽可能小来找到 $t_2$。可接受线性程序可以通过信息度量获得。这些线性可接受程序的替代方法是在包含变量非线性变换的更大空间中寻找线性程序，这通过支持向量机进行讨论。\n\
  \n### 5.5.3 逻辑回归\n\n通常，特征分布的参数未知，必须从先前的时间序列数据中估计。当该分布为多元正态分布时，使用估计马氏距离的 Fisher LDF\
  \ 在协方差矩阵相等时是最优的，并且在大样本中通常效果良好。然而，当用于分类的特征分布不是正态时，我们无法保证 LDF 会是最优的。\n\n一种可能性是构建模型，使用特征作为解释变量来预测分类变量的值。例如，如果我们希望区分那些将被偿还的贷款和那些难以收回的贷款，可以向数据库中添加一个新变量\
  \ $y$，当贷款被偿还时取值为零，否则取值为一。分类问题变成了预测新元素中虚拟变量 $y$ 的值，而该元素中我们知道变量向量 $\\boldsymbol{x}$。如果预测变量更接近零而非一，我们将元素分类到第一状态；否则，将其放入第二状态。\n\
  \n假设构建分类器的样本由元素 $(y_i, x_i)$ 组成，其中 $y_i$ 是该元素中二元分类变量的值，$x_i$ 是作为解释变量使用的 $p$ 个特征的向量。预测已知变量\
  \ $x$ 的新元素中分类变量值的最简单方法是构建回归模型：\n\n```\ny = \\beta_0 + \\beta_1'x + u, (5.53)\n```\n\
  \n可以看出，使用最小二乘法估计该方程的分类等价于 Fisher 的 LDF。注意，给定固定值 $x = x_0$ 时，变量 $y$ 是二项分布，可能取值为一和零，概率\
  \ $p_0(x_0) = P(y = 0|x_0)$ 和 $p_1(x_0) = P(y = 1|x_0)$ 必须和为一，期望值为 $p_1(x_0)$。对\
  \ (5.53) 取期望，我们得到\n\n```\np_1(x_0) = \\beta_0 + \\beta_1'x_0. (5.54)\n```\n\n但是，我们不能保证值\
  \ $\\widehat{\\beta}_0 + \\widehat{\\beta}_1'x_0$ 会在零和一之间，以便解释为概率。为了避免这个问题，我们将 (5.54)\
  \ 转换为\n\n```\np_1(x) = F(\\beta_0 + \\beta_1'x), (5.55)\n```\n\n其中，取 $F$ 为任何分布函数，$p_1(x)$\
  \ 将在零和一之间。通常选择逻辑分布函数，因为此时\n\n```\np_1(x) = \\frac{e^{\\beta_0 + \\beta_1'x}}{1 +\
  \ e^{\\beta_0 + \\beta_1'x}}. (5.56)\n```\n\n并且 \\( p_1(\\mathbf{x}_0) = 1/(1 +\
  \ e^{\\beta_0 + \\beta'_1 \\mathbf{x}_0})。$ 我们可以通过 *Logit* 变量 \\( g_i \\) 来估计线性方程，该变量定义为：\n\
  \n\\( g_i = \\log \\frac{p_1(\\mathbf{x}_i)}{p_0(\\mathbf{x}_i)} = \\beta_0 + \\\
  beta'_1 \\mathbf{x}_i \\) (5.57)\n\n它表示在对数尺度上属于两个总体的概率之差。可以看出，如果特征服从正态分布，则它们服从逻辑模型，但在这种情况下，估计该模型比估计\
  \ Fisher LDF 效率更低。由概率 (5.57) 定义的逻辑模型可以通过 ML 估计；见 Hosmer and Lemeshow (1989)。逻辑模型是广义线性模型的特例；见\
  \ McCullagh (2018)。\n\n该模型可以轻松扩展到 G 个类，将一个类作为参考类，例如最后一个类，并假设每个类的概率已给出，推广 (5.57)，\n\
  \n\\( P_g(\\mathbf{x}) = \\frac{e^{\\beta_{0g} + \\beta'_{1g} \\mathbf{x}}}{1 +\
  \ \\sum_{j=1}^{G-1} e^{\\beta_{0j} + \\beta'_{1j} \\mathbf{x}}}, \\quad g = 1, \\\
  dots, (G-1). \\) (5.58)\n\n这些概率意味着 \\( G-1 \\) 个像 (5.57) 这样的 logit 模型，其中现在 \\( g_i\
  \ \\) 是第 i 个类的概率除以参考类概率的对数比。因此，由 (5.58) 定义的多项式模型具有 \\( (G-1)(p+1) \\) 个参数，即解释变量的系数，可以通过\
  \ ML 估计。一旦定义概率 (5.58) 的参数被估计，新数据将被分类到最可能的类。当有许多变量和类时，建议与许多相关变量的回归一样，使用收缩估计，即 Lasso\
  \ 方法，在第 7 章中讨论，这是一个好的替代方案。关于逻辑模型的 ML 估计及其应用的参考文献，见 McLachlan (2004)。\n\n### 示例 5.7\n\
  \n我们考虑 Andrzejak et al. (2001) 和 Maharaj 和 Alonso (2007) 研究的脑电图（EEG）系列。EEG 是大脑电活动的记录。我们有\
  \ 200 个个体的时间序列，T = 4096 次 EEG 观测。前 100 个系列，类型 A，对应于健康志愿者，而后 100 个系列，类型 E，由患者发作期间的\
  \ EEG 记录组成。图 5.28 和 5.29 显示了时间序列图，以及第 2 章中的三个 EDQ (prob = 0.01,0.5,0.95)。从图中可以看出，癫痫患者（类型\
  \ E）的 EEG 系列比健康个体（类型 A）的极端值多得多。此特征可用于区分。我们对两组系列使用命令 `SummaryModel` 拟合 ARIMA 模型，发现类型\
  \ A 的系列大多（76%）遵循 ARMA(5,3) 或 ARMA(5,2) 模型，而类型 E 的系列大多（55%）遵循其他 ARMA 模型。作为示例，在本例中，我们使用前\
  \ 5 个自相关系数来对数据进行分类。图 5.30 显示两组滞后-1 ACF 的直方图不同，但差异较小。我们将 LDF 和逻辑回归 (LG) 应用于 EEG 数据。首先将这两种方法应用于所有数据，然后在包含\
  \ 65% 数据的训练样本中进行估计，并在剩余 35% 数据的测试样本中进行评估。图 5.31 显示了投影\n\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_293_0.png)\n\
  \nFigure 5.28 健康个体脑电图数据的经验动态分位数（概率为 0.05、0.5 和 0.95）\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_293_1.png)\n\
  \nFigure 5.29 癫痫患者脑电图数据的经验动态分位数（概率为 0.05、0.5、0.95）\n\n用LDF计算的最大判别方向上的数据。LR的估计模型所有系数均具有统计显著性，如输出所示。使用全部数据时，LDF的判别错误为9，LR为2.5%。然而，当分割样本时，LDF在训练样本中有8%的错误，在测试样本中有16%的错误，而LR在训练样本中有3%的错误，在测试样本中有33%的错误。这些结果表明LR存在一定的过拟合。仅用一个样本比较两种方法可能具有误导性，使用多个训练和测试数据分割来复制分析是有用的。使用50个分割和运行程序\n\

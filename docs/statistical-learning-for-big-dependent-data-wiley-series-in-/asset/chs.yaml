  \ <- cbind(y[6:709, ], y[5:708, ], y[4:707, ], y[3:706, ], y[2:705, ], y[1:704,\
  \ ])\nm2 <- glmnet(X, Y, family=c(\"gaussian\"), alpha=1)\nplot(m2) #coefficient\
  \ profile plot (x-axis of ell-1 norm)\nplot(m2, xvar='lambda') #coefficient profile\
  \ plot (x-axis is log penalty)\ncv.m2 <- cv.glmnet(X, Y, family=c(\"gaussian\"),\
  \ alpha=1)\nplot(cv.m2)\nnames(cv.m2)\ncv.m2$lambda.min\nbeta <- coef(m2, s=cv.m2$lambda.min)\n\
  beta <- c(beta[-1, 1]) [-1]\nplot(1:732,beta,xlab=\"variable index\",ylab=\"beta-hat\"\
  ,pch=\"o\",cex=0.6)\nidx <- c(1:732) [abs(beta) > 0.04]\nidx\ncolnames(X) [idx]\n\
  #### glmnet with alpha = 0.8\nm3 <- glmnet(X, Y, family=c(\"gaussian\"), alpha=0.8)\n\
  plot(m3)\ncv.m3 <- cv.glmnet(X, Y, family=\"gaussian\", alpha=0.8)\nplot(cv.m3)\n\
  cv.m3$lambda.min\nbetal <- coef(m3, s=cv.m3$lambda.min)\nbeta1 <- c(betal[-1, 1])\
  \ [-1]\nplot(1:732,beta,xlab=\"variable index\",ylab=\"beta-hat\",pch=\"o\",cex=0.6)\n\
  idx <- c(1:732) [abs(betal) > 0.04]\nidx\ncolnames(X) [idx]\n```\n\n### 示例 7.2\n\
  \n对于 HDTS 分析，组 Lasso 可能很有用。在本节中，我们演示如何使用它。我们预期平稳时间序列数据的序列相关性随滞后增加而衰减至零。组 Lasso 使我们能够通过将滞后变量的预测变量分组来实现这一领域知识。考虑第\
  \ 3 章中使用的六个国家的季度 GDP 增长率。这六个国家是美国、英国、法国（FR）、澳大利亚（AU）、德国（GE）和加拿大（CA）。样本期为 1980 年至\
  \ 2018 年。假设我们有兴趣预测美国的 GDP 增长率，并将所有国家的滞后 GDP 增长率作为预测变量。这里因变量是 yt，即美国的 GDP 增长率。使用的预测变量包括所有国家的滞后\
  \ GDP 增长率。具体来说，我们有 \\( x_t = (y_{t-1}, \\dots, y_{t-8}, z'_{t-1}, \\dots, z'_{t-8})'\
  \ \\)，其中 \\( z_t \\) 是除美国外所有国家的季度 GDP 增长率。为了利用组 Lasso 的特性，我们考虑以下分组：\n\n- 1. 组 1：美国\
  \ GDP 增长率的滞后值，即 \\( y_{t-1}, \\dots, y_{t-8} \\)。\n- 2. 组 \\( i+1 \\)：其他国家滞后 \\\
  ( i \\) 期的 GDP 增长率，即 \\( z_{t-i} \\)，其中 \\( i = 1, \\dots, 8 \\)。\n\n因此，我们将 48 个预测变量划分为\
  \ 9 个组。我们的预测变量分组的基本思想是（a）美国 GDP 增长率的滞后值很重要\n\n\n并且 (b) 对于给定滞后，我们平等对待其他国家的增长率。对预测变量有其他分组方式，我们的分组主要用于说明目的。有多个可用于\
  \ Group Lasso 的 R 包，例如 gglasso 和 grplasso。我们在分析中使用 gglasso。使用的 R 命令如下所示，包括分组。图 7.9\
  \ 显示了 GDP 示例中 Group Lasso 的系数轮廓。此图可类似于 Lasso 的图进行解释。如预期，轮廓显示滞后预测变量在预测美国 GDP 增长率方面很有用。图\
  \ 7.10 显示了用于选择惩罚参数 \\(\\lambda\\) 的 10 折交叉验证结果。该图显示 LS 损失的最小值大约在 \\(ln(\\lambda)\
  \ = -3.4\\) 处达到。图 7.11 显示了 \\(\\lambda\\) 处于交叉验证最小值时 \\(\\hat{\\beta}_i\\)（包括常数项）的图。从图中可以看到，滞后\
  \ 1 阶预测变量比高阶滞后预测变量更重要。事实上，对于此特定实例，重要预测变量的预测变量索引为 1、10、14 和 2，分别对应截距以及英国、加拿大和美国的滞后\
  \ 1 阶 GDP 增长率。考虑到这三个经济体之间的紧密联系，这是合理的。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_396_0.png)\n\
  \n**图 7.9** 1980 至 2018 年六个国家季度 GDP 增长率的 Group Lasso 系数与 ln(lambda) 对比图。因变量为美国 GDP\
  \ 增长率。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_396_1.png)\n\n**图 7.10** GDP\
  \ 增长率序列 Group Lasso 的 10 折交叉验证结果。因变量为美国 GDP 增长率。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_397_0.png)\n\
  \n**图 7.11** GDP 数据集 Group Lasso 的系数估计值。因变量为美国 GDP 增长率，惩罚参数为 \\(\\lambda \\approx\
  \ 0.0353\\)。\n\n#### R 演示：GDP 增长率的 Group Lasso。\n\n```\n> da <- read.table(\"gdpsimple6c8018.txt\"\
  ,header=TRUE)\n> fix(da)\n> dim(da)\n[1] 153   6\n> da[1:2, ]\n      US        UK\
  \       FR        AU        GE        CA\n1 0.3145153 -0.9719569 1.1197030 0.4478638\
  \ 0.8012350 0.70678280\n2 -0.6064770 -1.9796670 -0.5731772 0.2604569 -0.6438022\
  \ -0.03293659\n> y <- da[9:153,1] ## Dependent variable\n> X <- NULL ## setup predictors\n\
  > grp <- NULL ## Grouping\n> for (i in 1:8) {\n+ X <- cbind(X,da[(9-i):(153-i),1])\n\
  + grp <- c(grp,i)\n+ }\n> for (i in 1:8) {\n+ X <- cbind(X,da[(9-i):(153-i),-1])\n\
  + grp <- c(grp,rep(i+1,5))\n+ }\n> dim(X)\n[1] 145  48\n> n1 <- paste(\"US\",1:8,sep=\"\
  \") ## name predictors\n> n2 <- colnames(da)[-1]\n> n2\n[1] \"UK\" \"FR\" \"AU\"\
  \ \"GE\" \"CA\"\n> nn1 <- paste(n2,1,sep=\"\")\n> nn2 <- paste(n2,2,sep=\"\")\n\
  > nn3 <- paste(n2,3,sep=\"\")\n> nn4 <- paste(n2,4,sep=\"\")\n> nn5 <- paste(n2,5,sep=\"\
  \")\n> nn6 <- paste(n2,6,sep=\"\")\n> nn7 <- paste(n2,7,sep=\"\")\n> nn8 <- paste(n2,8,sep=\"\
  \")\n> colnames(X) <- c(n1,nn1,nn2,nn3,nn4,nn5,nn6,nn7,nn8)\n> require(gglasso)\n\
  > X <- as.matrix(X)\n> m1 <- gglasso(X,y,group=grp,loss=c(\"ls\"))\n> plot(m1)\n\
  > cv.m1 <- cv.gglasso(X,y,group=grp,loss=c(\"ls\"))\n> names(cv.m1)\n[1] \"lambda\"\
  \       \"cvm\"          \"cvsd\"         \"cvupper\"      \"cvlo\"\n[6] \"name\"\
  \         \"gglasso.fit\"  \"lambda.min\"   \"lambda.1se\"\n> plot(cv.m1)\n> cv.m1$lambda.min\n\

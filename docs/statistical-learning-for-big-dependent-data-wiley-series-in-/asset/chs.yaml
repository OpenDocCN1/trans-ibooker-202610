  >covars_pred <- spat_pred_grid\n>STdata_pred <- createSTdata(obs=obs_pred_wide,covars=covars_pred)\n\
  >E <- predict(STmodel,x.final,STdata=STdata_pred)\n>names(E)\n#### 1993年8月14日预测值和预测误差的水平图\n\
  >t1 <- E$EX\n>t2 <- E$VX.pred\n>E1 <- matrix(t1[3,],20,20)\n>E2 <- matrix(sqrt(t2[3,]),20,20)\n\
  >k1 <- seq(32,46,length=20)\n>k2 <- seq(-100,-80,length=20)\n>colnames(E2) <- colnames(E1)\
  \ <- paste(round(k1,2))\n>rownames(E2) <- rownames(E1) <- paste(round(k2,2))\n>require(lattice)\n\
  #### 定义调色板\n>color_pal <- rev(colorRampPalette(brewer.pal(11,\"Spectral\"))(16))\n\
  >levelplot(E1,col.regions=color_pal,xlab=\"lon (deg) \",ylab=\"lat (deg) \",\nmain=\"\
  Predictions (deg Fahrenheit) \")\n>levelplot(E2,col.regions=color_pal,xlab=\"lon\
  \ (deg) \",ylab=\"lat (deg) \",\nmain=\"Prediction errors (deg Fahrenheit) \")\n\
  \n我们的讨论集中在高斯分布上。实际应用中存在许多非高斯 S-T 数据。例如，在流行病学研究中，S-T 计数数据（如特定地区在指定时间段内特定疾病的病例数）很常见。我们针对高斯数据讨论的分析可以推广到对非高斯\
  \ S-T 数据建模。有兴趣的读者可参阅 Cressie 和 Wikle (2011) 以及 Diggle (2013)。\n\n## 9.8 动态 S-T 模型\n\
  \n在本节中，我们考虑动态 S-T 统计模型。鉴于其复杂性，文献中存在许多此类模型，无法在此全部讨论。相反，我们仅提供一些可根据特定应用需求进行定制的通用模型。\n\
  \n### 9.8.1 空间-时间自回归移动平均模型\n\n假设位置为 s1, ..., sm，并将过程表示为 Yt = [Y(s1, t), ..., Y(sm,\
  \ t)]'，其中时间索引假设为离散且等距。那么，模型\n\n$$\nY_t = \\sum_{i=0}^p \\left( \\sum_{j=1}^{p_i}\
  \ f_{ij} U_{ij} \\right) Y_{t-i} + \\sum_{\\ell=0}^q \\left( \\sum_{j=1}^{q_\\ell}\
  \ g_{\\ell j} V_{\\ell j} \\right) W_{t-\\ell} \\quad (9.99)\n$$\n\n其中 {U_ij} 和\
  \ {V_{\\ell j}} 为已知权重矩阵，p 和 q 为非负整数，{p_i} 和 {q_\\ell} 分别表示 AR 部分和移动平均部分的阶数的非负整数，{f_ij}\
  \ 和 {g_{\\ell j}} 为模型参数，{W_t} 为均值为 0 且协方差矩阵为 Sigma_w（假设为正定）的 iid 随机向量。Eq. (9.99)\
  \ 中的模型称为空间-时间自回归移动平均（STARMA）模型。例如，参见 Ali (1979)、Pfeifer and Deutsch (1980) 和 Cressie\
  \ (1993, 第 450 页)。该模型需要一些额外假设才能被良好定义。使用权重矩阵 {U_ij} 和 {V_{\\ell j}} 可以指定 S-T 过程 Y_t\
  \ 的子结构，但代价是可能在 {f_ij} 和 {g_{\\ell j}} 中使用许多参数，尤其是当 p_i 和 q_l 较大时。\n\nEq. (9.99)\
  \ 中的 STARMA 模型可以重写为\n\n$$\nY_t = \\sum_{i=0}^p \\Phi_i Y_{t-i} + \\sum_{j=0}^q \\\
  Theta_j W_{t-j}, \\quad (9.100)\n$$\n\n其中，不失一般性，我们假设 Cov(W_t) = sigma_w^2 I，并且为了可识别性，Phi_0\
  \ 的对角元素为零。此外，我们假设 (I - Phi_0) 可逆。与第 3 章讨论的 VARMA 模型类似，Eq. (9.100) 中的 STARMA 模型可能难以应用，因为它可能包含过多参数，尤其是当\
  \ m、p 或 q 较大时。Eq. (9.100) 中 Y_t 的弱平稳性条件可以以类似于第 3 章 VARMA 模型的方式获得。\n\n如果 q = 0，则模型简化为空间-时间\
  \ AR 模型。如果 p = q = 0，则模型变为\n\n$$\nY_t = \\Phi_0 Y_t + \\Theta W_t,\n$$\n\n可写成\n\n\
  $$\nY_t = (I - \\Phi_0)^{-1} \\Phi_0 W_t.\n$$\n\n由于 W_t 在时间上不相关，Y_t 则成为一个空间过程。如果\
  \ Theta_0 = I，则上述模型称为同时自回归（SAR）模型。\n\n如果 p = 1 且 q = 0，则 Eq. (9.100) 中的模型变为\n\n\
  $$\nY_t = (I - \\Phi_0)^{-1} \\Phi_1 Y_{t-1} + (I - \\Phi_0)^{-1} \\Theta_0 W_t,\n\
  $$\n\n可写成\n\n$$\nY_t = M Y_{t-1} + \\eta_t,\n$$\n\n其中 M = (I - Phi_0)^-1 Phi_1，且\
  \ {eta_t} 是均值为零、协方差矩阵为 Cov(eta_t) = sigma_w^2 (I - Phi_0)^-1 Phi_0 Phi_0' (I - Phi_0)^-1\
  \ 的 iid 随机变量序列。\n\n文献中已提出一些特定的 S-T AR 模型。例如，Gao et al. (2019) 考虑带有带状 AR 系数矩阵的模型。\n\
  \n### 9.8.2 S-T 分量模型\n\nS-T 过程 \\(\\{Y(\\mathbf{s}, t)|\\mathbf{s} \\in D \\subset\
  \ R^d, t \\in D_t \\subset R\\}\\) 的一般可加分量模型为\n\\(Y(\\mathbf{s}, t) = \\mu(\\mathbf{s},\
  \ \\theta_t) + \\gamma(t, \\theta_s) + \\kappa(\\mathbf{s}, t, \\theta_{s,t}) +\
  \ \\eta(\\mathbf{s}, t),\\quad (9.101)\\)\n\n其中 \\(\\mu(\\mathbf{s}, \\theta_t)\\\
  ) 表示带有参数向量 \\(\\theta_t\\) 的*空间*趋势面，\\(\\theta_t\\) 可能随时间 \\(t\\) 变化，\\(\\gamma(t,\
  \ \\theta_s)\\) 表示带有参数向量 \\(\\theta_s\\) 的*时间*趋势，\\(\\theta_s\\) 可能随位置 \\(\\mathbf{s}\\\
  ) 变化，\\(\\kappa(\\mathbf{s}, t, \\theta_{s,t})\\) 表示带有参数向量 \\(\\theta_{s,t}\\) 的\
  \ S-T 随机过程，\\(\\theta_{s,t}\\) 可能同时依赖于位置 \\(\\mathbf{s}\\) 和时间 \\(t\\)，\\(\\eta(\\\
  mathbf{s}, t)\\) 表示微尺度 S-T 随机过程，其在 \\(D \\times D_t\\) 中遵循零均值不相关过程。该模型由 Wikle (2003)\
  \ 考虑。第一个分量 \\(\\mu(\\mathbf{s}, \\theta_t)\\) 可能包含协变量（如 \\(\\mathbf{x}(\\mathbf{s},\
  \ t)'\\beta\\)）的影响。第二个分量 \\(\\gamma(t, \\theta_s)\\) 可能包含季节性（如年度周期的三角级数）的影响，其参数依赖于位置\
  \ \\(\\mathbf{s}\\)。Eq. (9.101) 的第三和第四个分量可能是随机的，因此 \\(Y(\\mathbf{s}, t)\\) 的模型是一个随机效应模型。通常，为便于模型识别，假设随机分量相互独立。\n\
  \nEq. (9.101) 中的分量模型灵活且适用于许多情况。然而，估计在计算上可能较为密集，特别是当位置数 \\(m\\) 和/或样本量 \\(T\\) 较大时。Deb\
  \ and Tsay (2019) 采用此类模型对台湾南部 13 个监测站观测到的 PM\\(_{2.5}\\) 数据进行了建模。\n\n### 9.8.3 S-T\
  \ 因子模型\n\n与其他统计分析类似，也可以向 S-T 建模引入因子结构以降维并简化分析。然而，在假设因子模型时必须小心，因为需要尊重空间结构。一种自然的方法是让公共因子描述时间依赖性，而载荷矩阵仅依赖于空间。例如，参见\
  \ Lopes et al. (2011) 的广义空间动态因子（GSDF）模型。如前所述，令 \\(\\mathbf{Y}_t = [Y(\\mathbf{s}_1,\
  \ t), \\dots, Y(\\mathbf{s}_m, t)]'\\)，位置为 \\(\\{\\mathbf{s}_i \\in D \\subset R^d\
  \ \\text{ for } i = 1, \\dots, m\\}\\)。在 GSDF 模型下，\\(Y(\\mathbf{s}_i, t)\\) 遵循一参数自然指数分布，如下\n\
  \n\\(p(Y(\\mathbf{s}_i, t)|\\eta_{ii}, \\psi) = \\exp\\{\\psi[Y(\\mathbf{s}_i, t)\\\
  eta_{ii} - b(\\eta_{ii})] + c[Y(\\mathbf{s}_i, t), \\psi]\\},\\quad (9.102)\\)\n\
  \n其中 \\(\\eta_{ii}\\) 是自然参数，\\(\\psi\\) 是已知离散参数。\\(Y(\\mathbf{s}_i, t)\\) 的均值和方差分别为第一和第二导数\
  \ \\(b'(\\eta_{ii})\\) 和 \\(b''(\\eta_{ii})/\\psi\\)。该自然参数通过链接函数 \\(\\eta_{ii} =\
  \ v(\\theta_{ii})\\) 定义为空间和时间分量的线性组合，其中 \\(\\theta_{ii}\\) 是一个 S-T 过程。\n\n令 \\(\\\
  theta_t = (\\theta_{t1}, \\dots, \\theta_{tm})'\\)。GSDF 模型使用以下两级层次结构来描述 \\(\\mathbf{Y}_t\\\
  ) 的时间行为：\n\n\\(\\theta_t = \\mu_t + \\mathbf{L}\\mathbf{f}_t,\\quad (9.103)\\)\n\
  \n\\(\\mathbf{f}_t = \\mathbf{\\Phi}\\mathbf{f}_{t-1} + \\epsilon_t,\\quad (9.104)\\\
  )\n\n其中 \\(\\mu_t\\) 是空间-时间过程的均值，\\(\\mathbf{f}_t = (f_{t1}, \\dots, f_{tr})'\\\
  ) 是公共因子向量（\\(r \\ll m\\)），\\(\\mathbf{L}\\) 是稍后定义的载荷矩阵，\\(\\mathbf{\\Phi}\\) 是转移\n\
  \n\n\n公共因子的协方差矩阵，\\(\\epsilon_t\\) 是一个 \\(r \\times r\\) 独立同分布的高斯过程，均值为零，协方差为 \\\
  (\\Sigma_e > 0\\)，且 \\(f_0 \\sim N(m_0, C_0)\\)，其中超参数 \\(m_0\\) 和 \\(C_0\\) 已知。在应用中，\\\
  (\\mu_t\\) 和 \\(\\Phi\\) 均可考虑季节性，且 \\(\\mu_t\\) 还可包含协变量的影响。\n\n\\(Y_t\\) 的空间变异通过载荷矩阵\
  \ \\(L\\) 的列来建模。将 \\(L\\) 的第 \\(j\\) 列记为 \\(L_j = (L_{1j}, \\dots, L_{mj})'\\)，\\\
  (j=1, \\dots, r\\)。GSDF 模型假设 \\(L_j\\) 是条件独立的、基于距离的高斯过程（或高斯随机场）。即，\n\n\\(L_j \\\
  sim N(\\kappa_j, \\tau_j^2 R_j), \\quad j=1, \\dots, r,\\quad (9.105)\\)\n\n其中 \\\
  (\\kappa_j\\) 是 \\(m\\) 维均值向量，\\(\\tau_j\\) 是缩放参数，\\(R_j = [r_{uv}(\\phi_j)]\\)，且\
  \ \\(r_{uv}(\\phi_j) = \\rho_{\\phi_j}(||s_u - s_v||)\\)，\\(u, v = 1, \\dots, m\\\
  )，其中 \\(\\rho_{\\phi}(.)\\) 为适当定义的相关函数，\\(j=1, \\dots, r\\)。为简化起见，参数 \\(\\phi_j\\\
  ) 通常是标量或低维向量。例如，若 \\(\\rho_{\\phi}\\) 为指数函数 \\(\\rho_{\\phi_j}(h) = \\exp(-h/\\\
  phi_j)\\) 或球形函数 \\(\\rho_{\\phi_j}(h) = [1 - 1.5(h/\\phi_j) + 0.5(h/\\phi_j)^3]I_{h/\\\
  phi_j \\le 1}\\)，则 \\(\\phi_j\\) 为标量，其中 \\(h\\) 表示距离。\n\nGSDF 模型（公式 (9.103)-(9.105)）的估计可采用马尔可夫链蒙特卡罗方法，结合扩展卡尔曼滤波和\
  \ Metropolis-Hastings 算法的技术。当然，使用 GSDF 模型时需考虑的重要问题包括公共因子个数 \\(r\\) 的选择以及因子过程 \\\
  (f_t\\) 的估计。这些问题可通过信息准则或在贝叶斯框架下加以解决。更多细节及应用请参见 Lopes et al. (2011)。\n\n### 9.8.4\
  \ S-T HMs\n\n假设地点 \\(\\{s_1, \\dots, s_m\\}\\) 固定，其中 \\(s_i \\in D \\subset R^d\\\
  )，且时间点为离散且等距的，设为 \\(t=1, \\dots, T\\)。分析 S-T 数据的一般框架是层次动态 S-T 模型（DSTM），该模型在 Cressie\
  \ and Wikle (2011) 和 Wikle et al. (2019) 中有所讨论。另见综述文章 Harvill (2010)。\n\n在此框架下，数据模型为\n\
  \n\\(Z_t = H_t(Y_t, \\theta_{h,t}, \\epsilon_t), \\quad t=1, \\dots, T,\\quad (9.106)\\\
  )\n\n其中 \\(Z_t\\) 表示时间 \\(t\\) 的观测数据，\\(Y_t\\) 是感兴趣的潜在 S-T 过程，\\(H_t\\) 是连接数据与潜在过程的线性或非线性映射，\\\
  (\\epsilon_t\\) 是数据误差，代表测量误差和/或某些小规模时间变异性。模型参数记为 \\(\\theta_{h,t}\\)，可能随空间（由距离 \\\
  (h\\) 表示）和/或时间变化。\n\n在该模型下，假设数据 \\(\\{Z_t\\}\\) 在给定潜在过程 \\(Y_t\\) 和参数 \\(\\theta_{h,t}\\\
  ) 的条件下在时间上独立。因此，数据的联合分布可写成乘积形式\n\n\\(p[\\{Z_t\\}_{t=1}^T | \\{Y_t\\}_{t=1}^T, \\\
  {\\theta_{h,t}\\}_{t=1}^T] = \\prod_{t=1}^T p[Z_t | Y_t, \\theta_{h,t}].\\quad (9.107)\\\
  )\n\n通常，\\(Z_t\\) 的条件分布假设为正态分布，但也可使用指数族的其他成员。参见上一节。\n\n应用 DSTM 的另一个重要问题是对潜在 S-T\
  \ 过程 \\(\\{Y_t\\}\\) 的联合分布进行分解。为此，可使用时间序列分析技术，我们有\n\n\\( p[Y_1, ..., Y_T] = \\prod_{t=2}^T\
  \ p[Y_t|Y_{t-1}, ..., Y_1] \\times p(Y_1),\\) (9.108)\n\n为简化起见，分布函数中省略了参数。公式 (9.108)\
  \ 提供了一种自然方式来引入假设，从而使 \\(\\{Y_t\\}\\) 的联合分布易于计算。例如，若假设一阶马尔可夫性质成立，则\n\n\\( p[Y_t|Y_{t-1},\
  \ ..., Y_1, \\{\\theta_{h,t}\\}_{t=1}^T] = p[Y_t|Y_{t-1}, \\theta_{h,t}],\\) (9.109)\n\
  \n同样为简化起见，我们将所有参数（包括 \\(Y_t\\) 的时间演化参数）都放入参数向量 \\(\\theta_{h,t}\\) 中。因此，假设 \\(Y_t\\\
  ) 是一阶马尔可夫过程，则有\n\n\\( p[Y_T, ..., Y_1|\\{\\theta_{h,t}\\}] = \\left( \\prod_{t=2}^T\
  \ p[Y_t|Y_{t-1}, \\theta_{h,t}] \\right) p[Y_1|\\theta_{h,1}].\\) (9.110)\n\n在一阶马尔可夫性质下，我们可将\
  \ \\(Y_t\\) 的模型表示为\n\n\\( Y_t = M(Y_{t-1}, \\theta_{h,t}, \\eta_t),\\) (9.111)\n\
  \n其中 \\(M\\) 表示时间转移，\\(\\eta_t\\) 是时间上不相关的空间噪声过程。公式 (9.111) 中的转移 \\(M\\) 可以是线性或非线性的。例如，\\\
  (Y_t\\) 可能遵循 VAR(1) 模型或多状态阈值 VAR(1) 模型。有兴趣的读者可参阅 Tsay (2014) 和 Tsay and Chen (2019)，分别了解\
  \ VAR(1) 和阈值 VAR 模型的性质，以及其他多元时间序列书籍。上述模型可推广到任何有限阶马尔可夫过程，只要阶数足够小，使得计算仍可处理。\n\n估计\
  \ DSTM 有两种一般方法。第一种方法是使用 Dempster et al. (1977) 的期望-最大化（EM）算法，第二种方法是马尔可夫链蒙特卡罗（MCMC）方法。在某些非线性情况下，也可使用序列蒙特卡罗方法或粒子滤波，尤其是当维度\
  \ \\(m\\) 较小时。详情见 Cressie and Wikle (2011)。\n\n## 附录 9.A：一些 R 包和命令\n\n在本附录中，我们展示了用于生成本章中部分图表（尤其是第\

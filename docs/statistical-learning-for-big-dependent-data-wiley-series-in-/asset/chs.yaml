  | AR(13) | 0.161 | 0.123 | 0.107 | 14 |\n\nRMSE、MAE、MedAE 和 NP 分别代表均方根误差、平均绝对误差、中位数绝对误差和参数数量。\n\
  \n使用 keras 包进行深度学习的 R 演示：读者可参阅 https://keras.rstudio.com 以获取更多信息。\n\n```r\nrate\
  \ <- scan(\"unrate4820.txt\") # load data\nnT <- length(rate)\nnfore <- 200 # number\

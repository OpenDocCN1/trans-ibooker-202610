- '# 1 大依赖数据简介


  如今，大数据无处不在。能够从这些数据中提取有用信息（包括机器学习和人工智能）的统计方法，近年来在研究人员和从业者中引起了广泛关注。大多数可用于分析大数据的统计方法都是在观测来自独立样本的假设下开发的。例如，Bühlmann
  and van de Geer (2011) 中讨论的大多数方法即是如此。然而，在许多应用中，大数据的观测是相依赖的。这种依赖可能发生在数据获取的顺序中（例如时间序列数据），或发生在抽样单位所在的空间中（例如空间数据）。美国50个州每月平民失业率（16岁及以上）就是一个例子。失业率随着时间的推移往往具有黏性，地理上相邻的州可能共享相似的产业，因而具有相似的失业模式。对于依赖数据，空间和/或时间依赖通常是统计分析的重点。因此，有必要研究大规模依赖数据的分析方法。


  本书的主要焦点是为读者提供可用于分析大规模依赖数据的统计方法的全面介绍。我们从一些示例及其描述性分析的简单方法入手。更高级的方法将在后续章节中介绍。然而，请牢记，随着时间推移，大规模依赖数据的分析正在获得越来越多的关注。本书讨论的方法在很大程度上反映了我们的个人经验和偏好。我们希望本书能对不同科学领域的许多研究人员和从业者的数据分析有所帮助。此外，它还可能引起更多人对分析大规模依赖数据这一挑战性问题的关注，并激励进一步的研究。


  ## 1.1 依赖数据示例


  在本节中，我们将介绍本书中考虑的一些大规模依赖数据示例，介绍描述此类数据的一些统计方法，并提供进行统计推断的框架。所介绍方法的细节将在后续章节中给出。我们的目标是展示我们打算分析的数据，并强调忽略其依赖性的后果。在可能的情况下，我们还将说明为独立观测开发的统计方法在应用于大规模依赖数据时所面临的困难。


  所谓依赖数据，是指感兴趣变量的观测是在时间上或空间上（或两者同时）进行的。因此，在这些数据中，时间或空间的顺序很重要。所谓大数据，是指变量数 k 很大，或数据点数
  T 很大，或两者皆大，并且可能存在 k > T 的情况。图 1.1 展示了一个包含三个时间序列的数据集，表示1910年至2014年欧洲、北美和南美11月的相对平均温度。这些数据位于本书网站的文件
  Temperatures.csv 中。测量值是相对于20世纪11月的平均温度。这些数据是依赖的，因为相邻年份的观测值往往比相隔多年的观测值更接近。此外，南美的相对温度自1980年以来呈现出增长趋势，而这一趋势在欧洲仅从2000年开始出现，但在北美数据中未出现。


  对这些每月温度序列的统计分析相对容易，因为序列数量只有3个且样本量较小。它属于统计学中的多元时间序列分析。例如，参见 Tsay (2014)。本书的主要关注点是当时间序列数量很大或观测之间的时间间隔很小时的统计分析，从而产生具有大样本量的高频数据。在许多应用中，对大规模温度数据进行建模非常重要。事实上，世界各地许多地点会定期进行每日（甚至每小时）温度测量。这些温度影响着电力和燃油的需求，与空气污染测量（如颗粒物
  PM2.5 和臭氧浓度）高度相关，并在世界商品价格中发挥着重要作用。


  图 1.2 展示了从2000年1月3日至2015年12月16日、共4163个观测值的世界99个最重要金融市场的标准化每日股票指数。这些数据位于文件 `Stock_indexes_99world.csv`
  中。由于股票指数的幅度在不同市场之间差异显著，因此我们对图中的指数进行了标准化。具体来说，每个标准化指数序列的均值为零，方差为一。在应用中，我们通常分析股票指数的收益率。图
  1.3 和 1.4 分别展示了前六个指数及其对数收益率的时间图。对数收益率是通过取股票指数对数的第一阶差分得到的。



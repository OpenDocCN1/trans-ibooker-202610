  \         \"nu.log.sill.exp\"\n#[9] \"nu.log.nugget.(Intercept).exp\"\n>x.init <-\
  \ matrix(3,9,1)\n>rownames(x.init) <- loglikeSTnames(STmodel, all=FALSE)\n>SpatioTemporalfit\
  \ <- estimate(STmodel, x.init)\n#Optimisation using starting value 1/1\n#N = 9,\
  \ M = 5 machine precision = 2.22045e-16\n#At X0, 0 variables are exactly at the\
  \ bounds\n#At iterate   0 f =    7480.2 |proj g|=        18\n#At iterate  10 f =\
  \    5615.8 |proj g|=       16.617\n#At iterate  20 f =    5611.3 |proj g|=    \
  \    8.3644\n#At iterate  30 f =    5603.3 |proj g|=        4.4537\n\n#Iterations\

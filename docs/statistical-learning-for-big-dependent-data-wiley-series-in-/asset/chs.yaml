  \ paste(name,\"L4\",sep=\"\")\n> n5 <- paste(name,\"L5\",sep=\"\")\n> n6 <- paste(name,\"\
  L6\",sep=\"\")\n> colnames(X) <- c(n1,n2,n3,n4,n5,n6)\n> require(pls)\n> m.plsr\
  \ <- plsr(Y~.,data=data.frame(X),ncomp=30,validation=\"CV\")\n```\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_417_0.png)\n\

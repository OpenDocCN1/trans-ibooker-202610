  ) 和 \\(-0.6\\)。\n\n\n\n\n\n当线性回归模型的误差不相关时，(b) 当 \\(\\phi \\neq 0\\) 时，Lasso 显著低估了\
  \ \\(\\hat{\\beta}_i(\\phi)\\) 的标准误，这意味着忽略误差项中的序列相关性会影响使用 Lasso 进行统计推断，且 (c) 如果忽略序列相关性，95%\
  \ 置信区间的真实覆盖概率可能远低于 0.95。覆盖概率降低由两个因素引起。首先，残差中的序列相关性会导致系数估计值的变异性被低估（即经验标准误更小）。其次，序列相关性会在系数估计中引入向下偏差，如果真实的\
  \ \\(\\beta_i\\) 不是很大，这种负偏差可能非常显著。\n\n## 7.3 用于依赖数据的 LASSO\n\n上一节我们通过模拟证明，序列依赖性会影响\
  \ Lasso 方法的统计推断。在文献中，一些研究者在数据的序列依赖性不强时，为 Lasso 提供了某些理论依据。Wang 等人 (2007) 通过对线性回归模型中的回归系数和\
  \ AR 系数施加不同惩罚，提出了带 AR 误差的线性回归模型的 Lasso 估计量\n\n\\[\ny_t = \\mathbf{x}'_t \\boldsymbol{\\\
  beta} + e_t, \\quad (7.25)\n\\]\n\n其中，\\(e_t\\) 表示误差项，假设其遵循 AR(\\(p\\)) 模型 \\(\\\
  phi_p(B)e_t = a_t\\)。同前，\\(\\mathbf{x}_t = (x_{1t}, \\dots, x_{kt})'\\) 是预测变量的 \\\
  (k\\) 维随机向量。此处下标改为 \\(t\\) 以表明是时间序列数据。他们提出了估计方法\n\n\\[\n\\widehat{\\boldsymbol{\\\
  beta}}_{\\text{adapt}}(\\lambda) = \\arg \\min_{\\boldsymbol{\\beta}} \\left\\{\
  \ \\| \\mathbf{Y} - \\mathbf{X}\\boldsymbol{\\beta} \\|_2^2 / n + \\sum_{j=1}^k\
  \ \\lambda_j |\\beta_j| + \\sum_{i=1}^p \\gamma_i |\\phi_i| \\right\\}, \\quad (7.26)\n\
  \\]\n\n并表明，对于所研究的问题，这种修正的 Lasso 比传统的 Lasso 更有效。他们还提出了一种估计此修正 Lasso 估计量的算法。Gupta\
  \ (2012) 研究了模型 (7.25) 中的 Lasso 估计量，其中 \\(e_t\\) 是一个弱依赖过程。弱依赖过程具有自相关系数随滞后增大而趋于零的性质。这一条件是独立性的推广，在渐近分析中很有用。ARMA\
  \ 过程，以及一般来说，平稳和 ergodic 过程都是弱依赖的。参见 DeDecker 等人 (2007)。\n\n上述两篇文章关注样本量 \\(n\\) 大于预测变量数量\
  \ \\(k\\) 的情况。Basu 和 Michailidis (2015) 研究了高维高斯过程随机设计下 Lasso 估计量的理论性质。Kock 和 Callot\
  \ (2015) 为平稳 VAR 模型中高斯误差的 Lasso 回归建立了神谕不等式。Wu 和 Wu (2016) 分析了固定设计矩阵下的 Lasso 估计量，并假设满足受限特征值条件。Medeiros\
  \ 和 Mendes (2016) 研究了误差非高斯且可能存在条件异方差时自适应 Lasso 的渐近性质。Han 和 Tsay (2020) 在弱稀疏性条件下建立了\
  \ Lasso 估计量的收敛率，并给出了 Lasso 回归的符号一致性。本文将 Lasso 结果扩展到时间序列分析中的固定设计和精确稀疏性之外，其中真实非零系数的数量是有限的，且不假设样本协方差矩阵或总体协方差矩阵上满足受限特征值条件。下文中，对于\
  \ \\(k\\) 维随机向量 \\(z\\)，\\(q\\) 阶范数定义为 \\(\\|z\\|_q = (E|z|^q)^{1/q}\\)，其中 \\(1\
  \ \\le q \\le k\\)。\n\n考虑线性回归模型 (7.25)。设 \\(\\{\\epsilon_t\\}\\) 为随机向量的独立同分布序列，且\
  \ \\(F_t = \\sigma\\{\\epsilon_i \\mid i \\le t\\}\\) 为由 \\(i \\le t\\) 的 \\(\\\
  epsilon_i\\) 生成的 \\(\\sigma\\)-代数。我们假设 \\(x_t\\) 的分量和误差 \\(e_t\\) 是 \\(F_t\\) 的良好定义的实值可测函数，即，\n\
  \n\\[\nx_t = (g_1(F_t), \\dots, g_k(F_t))' \\quad \\text{and} \\quad e_t = g_e(F_t).\n\
  \\]\n\n为简单起见，可以将 \\(x_{it}\\) 和 \\(e_t\\) 视为 \\(F_t\\) 的线性函数。为了量化时间序列数据的序列依赖性，我们采用\
  \ Wu (2005) 的功能依赖度量。具体地，设\n\n\\[\n\\delta_{t,q,i} = \\|x_{it} - x_{it}^*\\|_q =\
  \ \\|g_i(F_t) - g_i(F_t^*)\\|_q, \\quad \\text{(7.27)}\n\\]\n\n\\[\n\\delta_{t,q,e}\
  \ = \\|e_t - e_t^*\\|_q = \\|g_e(F_t) - g_e(F_t^*)\\|_q, \\quad \\text{(7.28)}\n\
  \\]\n\n其中，\\(x_t^* = (g_1(F_t^*), \\dots, g_k(F_t^*))'\\) 且 \\(e_t^* = g_e(F_t^*)\\\
  )，这里 \\(F_t^* = \\sigma[\\{\\epsilon_i \\mid i \\le t \\cap i \\neq 0\\} \\cup \\\
  epsilon_0^*\\]]\\)，且 \\(\\epsilon_0^*\\) 是与 \\(\\{\\epsilon_i\\}\\) 独立但服从与 \\(\\\
  epsilon_0\\) 相同分布的随机向量。粗略地说，对于给定的时间索引 \\(t\\) 和正整数 \\(q\\)，式 (7.27) 中的 \\(\\delta_{t,q,i}\\\
  ) 以 \\(q\\) 阶范数衡量将 \\(\\epsilon_0\\) 更改为 \\(\\epsilon_0^*\\) 对 \\(x_{it}\\) 的影响。同样，式\
  \ (7.28) 中的 \\(\\delta_{t,q,e}\\) 量化了将 \\(\\epsilon_0\\) 更改为 \\(\\epsilon_0^*\\\
  ) 对误差项 \\(e_t\\) 的影响。这两个依赖度量在线性时间序列模型的移动平均表示的冲击响应权重 \\(\\psi_t\\) 中起着类似的作用。\n\n\
  对于正整数 \\(m\\)，定义累积依赖度量为\n\n\\[\n\\Delta_{m,q,i} = \\sum_{l=m}^\\infty \\delta_{t,q,l},\
  \ \\quad \\text{(7.29)}\n\\]\n\n\\[\n\\Delta_{m,q,e} = \\sum_{l=m}^\\infty \\delta_{t,q,e}.\
  \ \\quad \\text{(7.30)}\n\\]\n\n这两个度量分别量化了将 \\(\\epsilon_0\\) 更改为 \\(\\epsilon_0^*\\\
  ) 时对 \\(x_{it}\\) 和 \\(e_t\\) 的累积影响。同样，可以将这两个度量视为线性 ARMA 模型的 \\(\\psi\\)-权重的累积和。如果对于某个固定的\
  \ \\(m\\)，\\(\\Delta_{m,q,i} < \\infty\\) 且 \\(\\Delta_{m,q,e} < \\infty\\)，则我们说序列\
  \ \\(x_{it}\\) 和 \\(e_t\\) 是短程依赖。从定义可以看出，如果序列是短程依赖，则将 \\(\\epsilon_0\\) 更改为 \\(\\\
  epsilon_0^*\\) 对时间序列的影响是有界的，因为在短程依赖下，\\(\\delta_{t,q,i}\\) 和 \\(\\delta_{t,q,e}\\\
  ) 应趋近于零。\n\n在短程依赖下，可以使用累积依赖度量定义依赖调整范数（DAN）如下：\n\n\\[\n\\|x_i\\|_{q,a} = \\sup_{m\
  \ \\ge 0} (m+1)^\\alpha \\Delta_{m,q,i}, \\quad \\alpha \\ge 0,\n\\]\n\n\\[\n\\\
  |e\\|_{q,a} = \\sum_{m \\ge 0} (m+1)^\\alpha \\Delta_{m,q,e}, \\quad \\alpha \\\
  ge 0.\n\\]\n\n这些 DAN 用于推导依赖数据上 Lasso 估计量的一致性。\n\n接下来，转向 \\(\\boldsymbol{x}_t\\)\
  \ 的横截面依赖性。设 \\(\\boldsymbol{\\Sigma} = [\\sigma_{ij}]\\) 为 \\(\\boldsymbol{x}_t\\\
  ) 的协方差矩阵，假设序列是平稳的。定义 \\(L^\\infty\\) 功能依赖度量及其对应的 DAN 为\n\n\\[\nw_{t,q} = \\| \\\
  max_{1 \\le j \\le k} |x_{jt} - x_{jr}^*| \\|_q,\n\\]\n\n\\[\n\\| \\| \\boldsymbol{x}\
  \ \\|_\\infty \\|_{q, \\alpha} = \\sum_{m \\ge 0} (m+1)^\\alpha \\sum_{t=m}^{\\\
  infty} w_{t,q}, \\quad \\alpha \\ge 0.\n\\]\n\n此外，定义\n\n\\[\n\\Psi_{q, \\alpha}\
  \ = \\max_{1 \\le j \\le k} \\| \\boldsymbol{x}_{\\cdot j} \\|_{q, \\alpha} \\quad\
  \ \\text{and} \\quad \\Upsilon_{q, \\alpha} = \\left( \\sum_{j=1}^k \\| \\boldsymbol{x}_{\\\
  cdot j} \\|_{q, \\alpha}^q \\right)^{1/q} .\n\\]\n\n这里，\\(\\Psi_{q, \\alpha}\\)\
  \ 和 \\(\\Upsilon_{q, \\alpha}\\) 可以分别视为 \\(\\boldsymbol{x}_t\\) 的统一和整体 DAN。\n\n\
  考虑式 (7.25) 中的模型。我们施加以下弱稀疏性条件：存在某个满足 \\(0 \\le \\theta \\le 1\\) 的常数 \\(\\theta\\\
  ) 和一个均匀半径 \\(K_\\theta，使得\n\n\\[\n\\sum_{j=1}^k |\\beta_j|^\\theta \\le K_\\theta.\
  \ \\quad (7.31)\n\\]\n\n假设弱稀疏性条件成立，且 \\(x_{it} \\ (i=1, \\dots, k)\\) 和 \\(e_t\\\
  ) 均满足短程依赖。更具体地，假设 \\(\\Psi_{y, \\alpha_X} = M_X < \\infty\\)，其中 \\(\\gamma > 4\\\
  ) 和 \\(\\alpha_X > 0\\)，且 \\(\\| e \\|_{q, \\alpha_e} = M_e < \\infty\\)，其中 \\(q\
  \ > 2\\) 和 \\(\\alpha_e > 0\\)。定义\n\n\\[\nv = \\begin{cases} 1, & \\text{if } \\\
  alpha_X \\ge 1/2 - 2/\\gamma, \\\\ \\gamma/4 - \\alpha_X \\gamma/2, & \\text{if\
  \ } \\alpha_X < 1/2 - 2/\\gamma. \\end{cases}\n\\]\n\n设 \\(\\tau = q\\gamma/(q+\\\
  gamma) > 2\\) 且 \\(\\alpha = \\min(\\alpha_X, \\alpha_e)\\)。定义\n\n\\[\n\\rho = \\\
  begin{cases} 1, & \\text{if } \\alpha \\ge 1/2 - 1/\\tau, \\\\ \\tau/2 - \\alpha\
  \ \\tau, & \\text{if } \\alpha < 1/2 - 1/\\tau. \\end{cases}\n\\]\n\n设 \\(w = \\\
  sqrt{\\log(k)/n} M_X^2 + n^{2\\nu/\\gamma - 1} (\\log(k))^{3/2} \\| \\boldsymbol{x}\
  \ \\|_\\infty \\|_{\\tau, \\alpha_X}^2\\)。此外，假设 \\(\\boldsymbol{\\Sigma}\\) 的最小特征值远离零，即\
  \ \\(\\lambda_{\\min}(\\boldsymbol{\\Sigma}) \\ge \\kappa > 0\\)。在这些假设下，Han 和 Tsay\
  \ (2020) 推导了式 (7.25) 中线性回归的 Lasso 估计量的一致性，前提是惩罚参数 \\(\\lambda\\) 满足\n\n\\[\n\\lambda\
  \ \\ge \\sqrt{\\log(k)/n} M_e M_X + n^{\\rho/\\tau - 1} (\\log(k))^{3/2} M_e \\\
  | \\boldsymbol{x} \\|_\\infty \\|_{\\gamma, \\alpha_X}\n\\]\n\n并且量 \\(w\\) 满足 \\\
  (K_\\theta w \\lambda^{-\\theta} < \\infty\\)。具体地，以高概率，当 \\(n \\to \\infty\\) 时，有\n\
  \n\\[\n|\\hat{\\boldsymbol{\\beta}} - \\boldsymbol{\\beta} |_2 \\le \\sqrt{K_\\\
  theta} \\left( \\frac{\\lambda}{\\kappa} \\right)^{1-\\theta/2}, \\quad (7.32)\n\
  \\]\n\n\\[\n|\\hat{\\boldsymbol{\\beta}} - \\boldsymbol{\\beta} |_1 \\le \\sqrt{K_\\\
  theta} \\left( \\frac{\\lambda}{\\kappa} \\right)^{1-\\theta}. \\quad (7.33)\n\n\
  \n\n\n\n详情见 Han and Tsay (2020) 的定理 1。在强稀疏性条件下，即 \\(|\\beta|_0 = s < \\infty\\)，一致性结果可以得到改进。短程相关下\
  \ Lasso 估计的一致性条件看起来复杂且缺乏直觉，但核心观点很清晰。Lasso 估计的收敛速度慢于 i.i.d. 情况。可以通过考虑有效样本量来理解依赖数据的收敛速度。在存在序列相关的情况下，\\\
  (T\\) 个数据点的有效样本量小于 \\(T\\)。序列相关越强，有效样本量越小。因此，在存在序列相关时，收敛速度更慢。此外，对于模型选择一致性，Han and\
  \ Tsay (2020) 表明预测变量个数 \\(k\\) 只能以多项式速率而非指数速率增长。参见 Han and Tsay (2020) 的定理 3。同样，可以使用有效样本量来理解这一问题。由于依赖数据的有效样本量小于\
  \ i.i.d. 情况，允许的预测变量个数 \\(k\\) 应小于 i.i.d. 情况。在时间序列分析中，Lasso 估计的弱依赖假设下的其他应用包括 Nicholson\
  \ et al. (2017a)（研究大型向量自回归的结构正则化）和 Nicholson et al. (2017b)（用于建模稀疏 HDTS）。\n\n将 Lasso\
  \ 应用于依赖数据的另一个重要问题是惩罚参数 \\(\\lambda\\) 的选择。序列相关很容易使交叉验证（CV）方法失效。为了克服这一困难，可以将数据分为估计子样本和预测子样本，并使用样本外预测误差来选择惩罚参数，如第\
  \ 6 章中滚动预测所见。当然，如何将数据分为估计子样本和预测子样本需要仔细研究。一般来说，预测子样本的样本量不应太小，以使预测误差的汇总统计量保持稳定。关于\
  \ \\(\\lambda\\) 选择在正则化动态主成分中的应用，参见 Peña et al. (2021)。选择 \\(\\lambda\\) 的另一种方法是使用某些信息准则，例如贝叶斯信息准则（BIC）。关于\
  \ Lasso 回归的自由度，读者可参阅 Zou et al. (2007) 和 Tibshirani and Taylor (2012)。\n\n### 示例\
  \ 7.5\n\n再次考虑示例 7.1 中使用的月度宏观经济变量。因变量是美国 IPI 的月度增长率，预测变量包括所有变量的前六个滞后值。我们的目标是说明使用样本外估计预测来选择惩罚参数。为此，我们将数据分为估计子样本和预测子样本，前者由前\
  \ 670 个数据点组成，后者包含 34 个观测值。图 7.17 显示了通过命令 `cv.glmnet` 进行的 Lasso 线性回归的 10 折交叉验证结果。选定的值为\
  \ \\(\\lambda \\approx 5.956 \\times 10^{-4}\\)。图 7.18 显示了样本外均方误差与 \\(\\lambda\\\
  ) 的关系。选定的值为 \\(\\lambda \\approx 1.777 \\times 10^{-4}\\)。对于 \\(\\lambda = 5.956\
  \ \\times 10^{-4}\\) 和 \\(1.777 \\times 10^{-4}\\)，样本外预测的根均方误差分别为 0.00503 和 0.00467。这一差异并不令人意外，因为\
  \ CV 没有使用预测子样本中的数据。图 7.19 绘制了两种选择方法的估计值 \\(\\hat{\\beta}_j\\)。从图中可以清楚地看出，正如预期的那样，Lasso\
  \ 选择的非零估计数少于样本外预测。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_408_0.png)\n\n图 7.17\
  \ 使用前 670 个数据点的月度宏观经济数据的 10 折交叉验证结果。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_408_1.png)\n\
  \n图 7.18 月度宏观经济数据的样本外预测结果。估计子样本包含前 670 个数据点。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_408_2.png)\n\
  \n图 7.19 月度宏观经济数据中系数估计值 \\(\\hat{\\beta}_j\\) 与 j 的散点图。(a) 样本外预测和 (b) 交叉验证。\n\n\
  ### 使用的 R 命令：\n\n```\nrequire(SLBDD); require(glmnet)\nda <- read.csv(\"FREMDApril19.csv\"\
  ,header=TRUE)\nx <- as.matrix(da)\ndim(da)\n[1] 710 122\nY <- x[7:710, 6]\nX <-\
  \ cbind(x[6:709, ], x[5:708, ], x[4:707, ], x[3:706, ], x[2:705, ], x[1:704, ])\n\
  dim(X)\nm2 <- Lambda.sel(X[1:670,],Y[1:670],X[671:704,],Y[671:704])\nm2$lambda.min\n\
  [1] 0.0001777053\nm3 <- glmnet(X[1:670,],Y[1:670],family=\"gaussian\",alpha=1)\n\
  cv.m3 <- cv.glmnet(X[1:670,],Y[1:670],family='gaussian',alpha=1)\nplot(cv.m3)\n\
  coef <- coef(m3,s=cv.m3$lambda.min)\ncv.m3$lambda.min\n[1] 0.0005955974\npar(mfcol=c(2,1))\n\
  plot(1:733,m2$beta,xlab=\"predictors\",ylab=\"beta-hat\",\nmain=\"(a) Out-sample\"\
  )\nplot(1:733,coef[,1],xlab=\"predictors\",ylab=\"beta-hat\",\nmain=\"(b) Cross-validation\"\
  )\n```\n\n## 7.4 主成分回归与扩散指数\n\n考虑公式 (7.2) 的线性回归模型，包含 \\(n\\) 个数据点和 \\(X\\) 中的 \\\
  (k\\) 个预测变量，其中可以理解为 \\(X\\) 可能包含一列 1，或者 \\(Y\\) 和 \\(X\\) 均已均值调整。在某些应用中，矩阵 \\(X'X\\\
  ) 是奇异的，例如当 \\(n < k\\) 时，或当 \\(X\\) 的列高度相关（多重共线性）时，因此 \\(\\beta\\) 的最小二乘估计不是唯一的。文献中已提出许多方法来克服这一困难。主成分回归（PCR）和扩散指数（DI）是其中两种方法。这两种方法的想法很简单。它们对\
  \ \\(X\\) 执行常规主成分分析（PCA），然后使用前几个主成分来预测 \\(Y\\)。由于主成分彼此正交，多重共线性问题得以克服。剩下的问题是选择要使用的主成分数量，通常通过\
  \ CV 或样本外预测来解决。\n\n从数学上看，PCR 可以表述如下：\n\n```\n\\(X = OP', \\quad (7.34)\\)\n\\(Y\
  \ = F\\beta + E, \\quad (7.35)\\)\n```\n\n其中 \\(O\\) 是 \\(n \\times k\\) *得分矩阵*，\\\
  (P\\) 是 \\(k \\times k\\) *载荷矩阵*，\\(Y\\) 是 \\(n \\times 1\\) 响应向量，\\(F\\) 是由 \\\
  (O\\) 的前几个 \\(r\\) 列组成的 \\(n \\times r\\) 矩阵，且为了记号方便，\\(E\\) 继续表示误差项。载荷 \\(k \\\
  times k\\) 矩阵 \\(P\\) 是一个正交归一矩阵，满足 \\(P'P = PP' = I\\)。公式 (7.34) 可通过 X 的奇异值分解得到，即\
  \ X = UDP'，其中 U 是 XX' 对应非零特征值的 n x k 特征向量矩阵，D 是一个对角 k x k 矩阵，其元素为 XX' 特征值的平方根，P\
  \ 是含有 X'X 特征向量的 k x k 矩阵。显然，O = UD。\n\nStock and Watson (2002) 的 DI 可以被视为 PCR 的推广。它使用第\
  \ 6 章的因子模型概念并假设\n\n```\nX = FL' + \\eta, (7.36)\nY = F\\beta + Z\\gamma + E, (7.37)\n\
  ```\n\n其中 F 由维度为 n x r 的公共因子（潜变量）组成，且 r << k，\\(\\eta\\) 表示 X 的特征项矩阵，Z 包含因变量 \\\
  (y_{t+h}\\) 的某些滞后值，h 为预测步长，\\(\\gamma\\) 是 \\(y_{t+h}\\) 对其滞后值的（部分）依赖。在计量经济学文献中，公式\
  \ (7.36) 通常被称为近似因子模型。有关更多细节，请参见第 6 章。在实践中，使用 X 的 PCA 来估计 F 中的公共因子。如果将 X 扩展以包含 Z，则公式\
  \ (7.37) 可以替换为公式 (7.35)。从这个意义上说，DI 预测方法可以被视为 PCR 的扩展。\n\n有必要对 PCR 或 DI 方法进行一些讨论。首先，PCR\
  \ 寻求 k 个预测变量的正交线性组合，以尽可能多地解释 \\(x_t\\) 的方差，并使用前几个线性组合来预测因变量 \\(y_{t+h}\\)。然而，没有充分理由表明\
  \ \\(y_{t+h}\\) 确实仅依赖于前几个主成分。选择因子数量的一种方法是在拟合模型时使用 Lasso 回归，参见 Bai and Ng (2008)。其次，由于\
  \ PCA 严重依赖于所涉变量的量级，因此在应用 PCR 或 DI 之前标准化预测变量非常重要。第三，文献中已提出用于选择 DI 方法中公共因子数量 r 的方法。详情见第\
  \ 6 章。第四，有几个 R 包可用于执行 PCR，例如 pls 和 plsdeof。DI 预测方法可通过 MTS 中的命令 SWfore 使用。最后，对于 k\
  \ > T 的高维情况，可以应用稀疏 PCA 来推广 PCR。稀疏 PCA 可在 Zou et al. (2006) 中找到。\n\n### 示例 7.6\n\n\
  再次考虑示例 7.5 中使用的月度宏观经济数据集。我们的目标是演示 PCR 的用法，并且我们已经标准化了每个 732 个预测变量。为简单起见，我们设置使用的主成分数量为\
  \ 30。如果使用 CV 来选择主成分数量，则选择 4 个组成部分。参见图 7.20。另一方面，如果将主成分得分视为变量并使用 AIC 来选择主成分数量，则选择\
  \ 24 个主成分。参见图 7.21，该图显示了 AIC 准则与主成分数量的散点图。在此特定情况下，使用 30 个组成部分的 PCR 解释了 IPI 增长率约\
  \ 33% 的变异性。图 7.22 显示了使用 30 个组成部分的 PCR 的交叉验证预测。直线指示目标。从图中看，拟合模型似乎合理。\n\n\n\n\n\n\

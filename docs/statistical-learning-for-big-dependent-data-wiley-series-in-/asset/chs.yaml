  \n残差\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_514_2.png)\n\n图 9.10 Meuse 数据集\
  \ log(zinc) 的半变函数。部分 (a) 是样本半变函数，部分 (b) 是拟合线性趋势后的残差半变函数。\n\n而图 9.10(b) 显示了在带有坐标的线性模型拟合后残差的半变函数。log(zinc)\
  \ 及其线性模型残差的方差分别为 0.521 和 0.382，表明线性模型在解释锌沉积的变异性方面是有效的。这并不令人惊讶，因为如图 9.9 的气泡图清楚地所示，锌浓度与河流与位置之间的距离成反比关系。从两个半变函数图中，我们可以看到，正如预期的那样，log(zinc)\

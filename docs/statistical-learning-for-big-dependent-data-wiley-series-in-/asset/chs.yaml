  \ 3 4 4 4 4 5 5 5 5\n6 6 6 6 7 7 7 7 8 8 8 8 9 9 9 9\n```\n\n## 7.2 动态相关对 LASSO\
  \ 的影响\n\n如前一节所示，惩罚回归模型的大多数性质是在独立性假设下推导得出的。另一方面，在大多数应用中，数据在时间上、空间上或同时都可能存在动态相关。本节首先总结回归分析中动态相关的后果，然后讨论\
  \ Lasso 回归的情况。众所周知，见例如 Greene (2003) 或 Griffiths et al. (1985)，当将回归分析应用于时间序列数据时，噪声通常具有自相关。因此，使用普通最小二乘估计代替广义最小二乘估计存在以下缺陷：\n\
  \n- 1. 最小二乘估计量是无偏的，但效率低下；\n- 2. 系数估计的最小二乘方差是有偏的，并且通常低估系数的真实方差；\n- 3. 残差方差被低估。\n\n\
  最小二乘估计的这些特性可能会产生一些不良影响，例如 *伪回归*，其中与响应变量无关的解释变量可能会因其回归系数方差被低估而与标准 \\( t \\)-检验一起显得显著。\n\
  \n例如，考虑一个简单回归模型 \\( y_t = \\beta_t x_t + e_t \\)，包含 \\( T \\) 个数据点，其中解释变量 \\( x_t\
  \ \\) 遵循 AR(1) 模型，\\( x_t = \\phi x_{t-1} + a_t \\)，且误差 \\( e_t \\) 也遵循 AR(1) 模型，\\\
  ( e_t = \\alpha e_{t-1} + \\epsilon_t \\)。那么，\\( \\beta \\) 的通常最小二乘估计为 \\( \\widehat{\\\
  beta}_{\\text{dep}} = \\sum_{t=1}^T x_t y_t / \\sum_{t=1}^T x_t^2 \\)，其方差可近似为（见\
  \ Greene, 2003）\n\n\\(\\text{Var}(\\widehat{\\beta}_{\\text{dep}}) = \\text{Var}(\\\
  widehat{\\beta}_{\\text{ind}}) \\frac{(1 + \\phi \\alpha)}{(1 - \\phi \\alpha)},\\\
  ) (7.21)\n\n其中 \\(\\text{Var}(\\widehat{\\beta}_{\\text{ind}}) = \\sigma^2 / T \\\
  sigma_x^2\\) 是应用于独立数据时最小二乘估计的方差，即当 \\( \\phi = \\alpha = 0 \\) 时。假设通常情况 \\( \\phi\
  \ > 0 \\) 且 \\( \\alpha > 0 \\)，我们看到 \\( \\widehat{\\beta}_{\\text{dep}} \\) 的方差可能远大于假设独立性时计算出的方差。特别是，如果\
  \ \\( x_t \\) 和 \\( e_t \\) 过程均具有大 AR 系数的序列相关，则 \\(\\text{Var}(\\widehat{\\beta}_{\\\
  text{dep}})\\) 的方差可能非常大，因此，即使 \\( \\beta = 0 \\)，我们也可能以高概率得到一个较大的估计 \\( \\widehat{\\\
  beta}_{\\text{dep}} \\)，这将被视为使用常规回归公式计算的 \\( t \\) 统计量下的显著结果。这就是著名的伪回归问题。在存在强序列相关时，这种现象也经常发生。参见第\
  \ 3.5.1 节的讨论。\n\n在 Lasso 线性回归中，参数估计通常是有偏的，我们没有精确公式来计算其方差，但由于数据中的自相关，一些无关变量可能会出现大系数，且类似的伪回归问题很可能发生。我们在第\
  \ 1 章中看到，当时间依赖性很强时会出现这种影响。在本节中，我们使用模拟进一步演示序列相关对 Lasso 线性回归的一些影响。我们的目标是表明，当存在动态依赖时，不应忽视数据的动态依赖。\n\
  \n### 示例 7.3\n\n考虑我们写成标量 AR(2) 模型的 ARIMA(1,1,0) 模型\n\n\\( y_t = 1.4y_{t-1} - 0.4y_{t-2}\
  \ + a_t, \\quad t=1, \\dots, 400, \\) (7.22)\n\n其中 \\(\\{a_t\\}\\) 是 i.i.d. \\(\
  \ N(0, 1) \\)，且若 \\( t < 1 \\) 则 \\( y_t = 0 \\)。我们从模型中独立生成了 11 个序列。第一个序列称为 \\(\
  \ y_t \\)，其余 10 个序列记为 \\( \\boldsymbol{x}_t \\)。图 7.12 显示了这 11 个实现的时间图，其中 \\( y_t\
  \ \\) 用粗线表示。然后，我们考虑以下线性回归\n\n\\( y_{t+2} = \\boldsymbol{\\beta}'_1 \\boldsymbol{x}_{t+1}\
  \ + \\boldsymbol{\\beta}'_2 \\boldsymbol{x}_t + e_{t+2}, \\quad t=1, \\dots, 398.\
  \ \\) (7.23)\n\n该模型可以写成矩阵形式 \\( \\boldsymbol{Y} = \\boldsymbol{X} \\boldsymbol{\\\
  beta} + \\boldsymbol{E} \\)，其中 \\( \\boldsymbol{X} \\) 是设计矩阵，其第 \\( i \\) 行写为 \\\
  ( (\\boldsymbol{x}'_{t+1}, \\boldsymbol{x}'_t) \\)，且 \\( \\boldsymbol{Y} = (y_3,\
  \ \\dots, y_{400})' \\)。由于 \\( y_t \\) 和 \\( \\boldsymbol{x}_t \\) 独立，\\( \\boldsymbol{\\\
  beta} = \\mathbf{0} \\)。但是，我们将 Lasso 估计应用于模型 (7.23)，假装数据是序列独立的。请注意，在模型拟合中，预测变量 \\\
  ( \\boldsymbol{x}_t \\) 的各个分量被标准化，使得每个预测变量序列的样本方差为 1。\n\n图 7.13 显示了模型 (7.23) Lasso\
  \ 拟合的系数轮廓图。从图中可以看到，若干系数估计值相对较大。例如，当 \\( \\ell_1 \\) 范数为 10 时，有 12 个非零系数估计值。图 7.14\
  \ 显示了\n\n\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_400_0.png)\n\n图 7.12 示例 7.3\
  \ 中使用的 11 个标量时间序列的时间序列图。因变量 $y_t$ 用粗线表示。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_400_1.png)\n\
  \n图 7.13 Eq. (7.23) 中模型的 Lasso 拟合系数剖面图。x 轴为拟合系数向量的 $\\ell_1$ 范数。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_400_2.png)\n\
  \n图 7.14 Eq. (7.23) 中模型 Lasso 拟合的 10 折交叉验证结果。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_401_0.png)\n\
  \n图 7.15 当惩罚参数 \\(\\lambda\\) 由 10 折交叉验证选取时，Eq. (7.23) Lasso 拟合的估计系数 \\(\\hat{\\\
  beta}_i\\)。\n\n对模型 (7.23) 进行 Lasso 拟合的 10 折交叉验证结果。该图不具信息性，因为没有明显的极小值，表明惩罚参数 \\(\\\
  lambda\\) 存在广泛的选择范围。`cv.glmnet` 命令选取 \\(\\lambda \\approx 0.00765\\)。图 7.15 显示了当\
  \ \\(\\lambda\\) 由 10 折交叉验证选取时的 \\(\\hat{\\beta}_i\\)。从图中可以看到，尽管所有 \\(i\\) 的 \\\
  (\\beta_i = 0\\)，但若干估计值 \\(\\hat{\\beta}_i\\) 仍然相当大。事实上，图中有九个 \\(\\hat{\\beta}_i\\\
  ) 的绝对值大于 1。从理论上讲，我们模拟中发现的现象可简要说明如下。首先，由于所用序列为单位根非平稳序列，高效估计值 \\(\\hat{\\beta}_i\\\
  ) 的极限分布是非标准分布。它们是标准布朗运动的函数，因此 \\(\\hat{\\beta}_i\\) 的幅度可能很大，尽管它们不应具有统计显著性。其次，\\\
  (\\mathbf{x}_{t+1}\\) 和 \\(\\mathbf{x}_t\\) 中每个预测变量的标准化加剧了多重共线性问题。利用单位根性质，例如 Tsay\
  \ (2014, chapter 5) 及其中的参考文献，可以证明，对于任何固定的 \\(i\\)，当 \\(T \\to \\infty\\) 时，\\(\\\
  sum_{t=i+1}^T y_t y_{t-i} / \\sum_{t=1}^T y_t^2\\) 以 \\(T^{-1}\\) 的速率收敛于 1。为加以说明，将\
  \ Eq. (7.22) 中的模型改写为 \\(y_t = y_{t-1} + 0.4 \\nabla y_{t-1} + a_t\\)。则，\n\n$$\n\\\
  sum_t y_t y_{t-1} = \\sum_t y_{t-1}^2 + 0.4 \\sum_t y_{t-1} \\nabla y_{t-1} + \\\
  sum_t a_t y_{t-1}.\n$$\n\n由于 \\(\\sum_t y_{t-1} \\nabla y_{t-1} = O_p(T)\\) 且 \\\
  (\\sum_t a_t y_{t-1} = O_p(T)\\)（因为平稳性），但当 \\(T \\to \\infty\\) 时 \\(\\sum_t y_t^2\
  \ = O_p(T^2)\\)，可见 \\(\\sum_t y_t y_{t-1} / \\sum_t y_t^2 = 1 + O_p(T^{-1})\\)。这意味着，对于大的\
  \ \\(T\\)，与 \\(\\sum_t y_t^2\\) 相比，模型中平稳部分的影响会消失。因此，在存在单位根的情况下，对预测变量进行标准化会增加 Lasso\
  \ 回归的多重共线性。\n\n这个简单的例子表明，忽视数据中的强序列相关性可能导致 Lasso 回归中模型拟合错误。即使在平稳过程等弱依赖情况下，也可能出现同样的问题，尽管幅度较小。如果我们用系数为\
  \ 0.8 的 AR(1) 过程生成的序列重复此示例，则会发现四个系数的绝对值在 0.1 到 0.2 之间。如果将这四个变量作为解释变量拟合标准线性回归，其中两个变量的绝对\
  \ \\(t\\) 值大于 3.5，具有显著性。\n\n### 示例 7.3 使用的 R 命令\n\n```\nrequire(SLBDD) ## Package\
  \ for the book\nrequire(glmnet)\nset.seed(123)\nYt <- sim.uarima(T=400,ar=c(0.4),ma=NULL,D=0)\n\
  Xt <- NULL\nfor (i in 1:10) {\nxt <- sim.uarima(T=400,ar=c(0.4),ma=NULL,D=0)\nXt\
  \ <- cbind(Xt,xt)\n}\ny <- Yt[3:400]\nxt <- scale(Xt,scale=TRUE)\ncolnames(xt) <-\
  \ paste(\"xt\",1:10,sep=\"\")\nX <- cbind(xt[2:399,],xt[1:398,])\nm4 <- glmnet(X,y,family=\"\
  gaussian\",alpha=1)\nplot (m4)\ncv.m4 <- cv.glmnet(X,y,family=\"gaussian\",alpha=1)\n\
  plot(cv.m4)\ncv.m4$lambda.min\nbeta <- coef(m4,s=cv.m4$lambda.min)\nbeta <- c(beta[,1])[-1]\n\
  plot(1:20,beta,xlab=\"variable index\",ylab=\"beta-hat\",pch=\"o\",cex=0.6)\nabline\
  \ (h=0)\nidx <- c(1:20) [abs(beta) > 1]\nidx\n```\n\n### 示例 7.4\n\n考虑线性回归\n\n\\\
  (y_i = x_i'\\beta + \\epsilon_i, \\quad i=1, \\dots, 100,\\) (7.24)\n\n其中 \\(\\\
  mathbf{x}_i\\) 是一个 100 维随机向量，其元素独立服从 \\(N(0,1)\\)，误差项 \\(e_i\\) 遵循标量 AR(1) 模型 \\\
  (e_i = \\phi e_{i-1} + \\epsilon_i\\)，其中 \\(\\epsilon_i\\) 为独立同分布的 \\(N(0,1)\\)，系数向量\
  \ \\(\\beta\\) 定义如下\n\n\\(\\beta_i = \\left\\{ \\begin{array}{ll} U[-6, 6] & \\\
  text{for } i=1, \\dots, 10, \\\\ 0 & \\text{for } i>10, \\end{array} \\right.\\\
  )\n\n其中 \\(U[a,b]\\) 表示从区间 \\([a, b]\\) 上的均匀分布中进行随机抽取。本示例的目的是研究误差项 \\(e_i\\) 中的序列相关性对非零系数\
  \ Lasso 估计值 \\(\\hat{\\beta}_i\\) 置信区间的影响。也就是说，我们关注 \\(i=1, \\dots, 10\\) 的 Lasso\
  \ 估计值 \\(\\hat{\\beta}_i\\)。为此，我们进行以下模拟：\n\n- 1. 随机抽取真实系数 \\(\\beta_i\\)，\\(i=1,\
  \ \\dots, 10\\)。\n- 2. 真实 AR(1) 系数 \\(\\phi\\) 取三个值，即 \\(\\phi=0\\)、\\(0.6\\) 或\
  \ \\(-0.6\\)。\n- 3. 对于给定的 \\(\\phi\\)，执行以下程序 3000 次迭代：\n  - (a) 使用具有真实参数的 Eq. (7.24)\
  \ 模型生成数据。\n  - (b) 对数据集应用 Lasso。\n  - (c) 使用 10 折交叉验证选取惩罚参数 \\(\\lambda\\)。\n  -\
  \ (d) 存储 \\(i=1, \\dots, 10\\) 的估计值 \\(\\hat{\\beta}_i\\)。将得到的 \\(\\hat{\\beta}_i\\\
  ) 记为 \\(\\widehat{\\boldsymbol{\\beta}}(\\phi)\\)，对于给定的 \\(\\phi\\)，它是一个 3000 行\
  \ 10 列的矩阵。\n- 4. 对每个 \\(\\phi\\)，计算 \\(\\widehat{\\boldsymbol{\\beta}}(\\phi)\\\
  ) 的某些列汇总统计量。\n\n计算的列汇总统计量包括 (a) 样本均值、(b) 样本标准差，以及 (c) 常规 95% 置信区间包含真实 \\(\\beta_i\\\
  ) (\\(i=1, \\dots, 10\\)) 的经验覆盖概率。图 7.16 显示了 \\(\\phi = 0, 0.6, -0.6\\) 及 \\(i=1,\
  \ \\dots, 4\\) 时 \\(\\hat{\\beta}_i(\\phi)\\) 的箱线图。图中还给出了 \\(\\beta_i\\) 的真实值。从图中可以清楚地看出，如果忽视\
  \ Eq. (7.24) 中误差项 \\(e_i\\) 的序列相关性，将显著影响估计值 \\(\\hat{\\beta}_i\\) 的变异性。无论序列相关性为正还是负，情况均如此。表\
  \ 7.1 提供了一些选定 \\(\\hat{\\beta}_i(\\phi)\\) 的汇总统计量。同样，\\(\\phi=0\\) 是 Lasso 假设成立的情况。从表中可以看出，(a)\
  \ Lasso 估计值工作\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_403_0.png)\n\n图 7.16 \\\
  (i = 1, \\dots, 4\\) 时 \\(\\hat{\\beta}_i(\\phi)\\) 的箱线图。左侧箱线图为 \\(\\phi = 0\\)，中间箱线图为\
  \ \\(\\phi = 0.6\\)。估计值基于 3000 次迭代，模型为 Eq. (7.24)。\n\n表 7.1 Eq. (7.24) 模型中 Lasso\

  Sph\",700,1))\n> v2.fit\n   model    psill   range\n1   Nug 0.08234213   0.000\n\
  2   Sph 0.38866509 1098.571\n#### psill is the partial sill and range is the range\
  \ parameter\n#### of the variogram model.\n#### Fit a Matern semi-variogram\n> v2.fit\
  \ <- fit.variogram(v2,vgm(1,\"Mat\",900,1))\n> v2.fit\n   model    psill   range\
  \   kappa\n1   Nug 0.05029822   0.0000   0.0\n2   Mat 0.47614480 555.3679   0.5\n\
  #### psill is the partial sill (variance), range is the range parameter of\n####\
  \ the variogram model, and kappa is the smoothness parameter.\n#### See Equation\
  \ (9.12).\n> plot(v2,v2.fit)\n#### Universal kriging\n> data(meuse.grid)\n> coordinates(meuse.grid)\
  \ = ~x+y\n> gridded(meuse.grid) = TRUE\n> lz.krig <- krig(log(zinc)~x+y,meuse,meuse.grid,model=v2.fit)\n\
  [using universal kriging]\n> spplot(lz.krig[\"var1.pred\"])\n> spplot(lz.krig[\"\
  var1.var\"])\n```\n\n## 9.6 S-T 过程与分析\n\n转向 S-T 数据。考虑 STRbook 包中可用的海面温度（SST）异常数据。这些月度异常数据收集自东经\
  \ 124° 至 290° 和南纬 29° 至 29°，分辨率为 2° × 2°，因此每月有 2520（= 84 × 30）个观测值。令 Z(s,t) 为位置\
  \ s = (lon,lat)' 和时间 t 处的观测异常值。那么 Zt = {Z(s, t) | s ∈ D} 是上一节讨论的空间数据点。可用时间段为 1970\
  \ 年 1 月至 2002 年 12 月，因此我们拥有的数据集为 Z = {Z(t, s) | s ∈ D; t = 1, ..., 396}，其中 t = 1\
  \ 对应 1970 年 1 月。这是 S-T 数据的一个示例。由于存在缺失值，我们使用 1996 年 1 月至 2002 年 12 月的数据。所用数据在文件 SSTdf1.csv\
  \ 中。图 9.13 显示了 SST 异常子集的 Hovmöller 图，Y 轴为日历时间（从 1996 年 1 月到 2002 年 12 月），X 轴为经度（从\
  \ 124° 到 280°）。该图显示了沿经度方向平均异常值（随纬度平均）随时间的演变（从上到下）。然而\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_517_0.png)\n\
  \n图 9.13 1996 年 1 月至 2002 年 12 月海面温度异常的经度 Hovmöller 图（°C）。\n\n该图提供了数据的某些信息，例如，在给定年份内异常值似乎从东向西移动，但它无法揭示数据的许多其他特征。事实上，探索数据的方法有很多。首先，它们可以被视为具有\
  \ 84 个观测值（7 年）的 2520 维时间序列。其次，它们也可以被视为具有 84 个观测值的 84×30 矩阵变量时间序列。本节的目的是研究此类 S-T\
  \ 数据。\n\n### 9.6.1 基本性质\n\n考虑 S-T 过程 {Z(s, t) | s ∈ D; t ∈ Dt}，其中 D ⊂ R^d 且 d >\
  \ 0，Dt ⊂ R。在实际中，我们只在有限个地点（例如 {s_i | i = 1, ..., m}）和有限个时间点（例如 {t_j | j = 1, ...,\
  \ T}）处观测数据，其中 m 和 T 为正整数。为方便起见，我们写 Z'_{tj} = [Z(s_1, t_j), ..., Z(s_m, t_j)]′ 和\
  \ Z(s_i) = [Z(s_i, t_1), ..., Z(s_i, t_T)]′。也就是说，Z_{tj} 是时间 t_j 处的 m 维观测向量，Z(s_i)\
  \ 是位置 s_i 处的 T 维观测向量。我们从一些基本概念开始。与观测过程 Z(s, t) 相关，存在一个底层 S-T 过程 Y(s, t)，即 Z(s, t)\
  \ = Y(s, t) + ϵ(s, t)，其中 ϵ(s, t) 为独立同分布的测量误差。\n\n令 D 为感兴趣的域。对于空间过程，D ⊂ R^d。对于时间序列，若时间离散则\
  \ D 为整数集，若时间连续则 D ⊂ R。对于 S-T 过程，D ⊂ R^d × R 或 D ⊂ R^d × {..., -1, 0, 1, ...}。定义在\
  \ D × D 上的函数 {g(u, v) | u, v ∈ D} 称为非负定的，如果对于任意复数 {b_i | i = 1, ..., m}、D 中的任意位置\
  \ {u_i | i = 1, ..., m} 及任意正整数 m，我们有\n\n\\[\n\\sum_{i=1}^{m} \\sum_{j=1}^{m} b_i\
  \ \\bar{b}_j g(u_i, u_j) \\ge 0, \\tag{9.62}\n\\]\n\n其中 \\(\\bar{b}_i\\) 是 \\(b_i\\\
  ) 的共轭复数。如果不等式在公式 (9.62) 中对任何非零 \\(b = (b_1, ..., b_m)'\\) 成立，则 \\(g(\\cdot, \\cdot)\\\
  ) 称为 *正定的*。我们将关注协方差函数（即将定义）为正定的 S-T 过程。\n\n如果函数 \\(g(u, v)\\) 满足公式 (9.62) 的条件，并且可以写成如下形式，则称其为\
  \ \\(R^d \\times R\\) 上的 *静态 S-T 协方差函数*：\n\n\\[\ng((s_1, t_1), (s_2, t_2)) = C(s_1\
  \ - s_2, t_1 - t_2), \\quad s_i \\in R^d, t_i \\in R. \\tag{9.63}\n\\]\n\n如果 \\\
  (E[Y(s, t)] = \\mu\\) 为常数且 \\(Y(s, t)\\) 具有静态协方差函数，则称 S-T 过程 \\(Y(s, t)\\) 为 *二阶平稳*。更精确地说，\\\
  (Y(s, t)\\) 是二阶平稳的，当 \\(E[Y(s, t)] = \\mu\\) 且\n\n\\[\n\\sum_{i=1}^m \\sum_{j=1}^m\
  \ b_i \\bar{b}_j C_y(s_i - s_j, t_i - t_j) \\ge 0, \\tag{9.64}\n\\]\n\n对于任意 \\(b\
  \ = (b_1, ..., b_m)'\\)、任意 \\(\\{(s_i, t_i) | i = 1, ..., m\\}\\) 及任意 \\(m\\) 成立，其中\
  \ \\(C_y(\\cdot, \\cdot)\\) 是 \\(Y(s, t)\\) 的协方差函数。\n\n\\(Y(s, t)\\) 的静态 S-T 相关函数定义为\n\
  \n\\[\n\\rho_y(h, \\tau) = \\frac{C_y(h, \\tau)}{C_y(0, 0)}, \\quad h \\in R^d,\
  \ \\tau \\in R. \\tag{9.65}\n\\]\n\n该概念继续适用于连续空间和离散时间模型。协方差函数的一些相关概念如下：\n\n- 空间平稑性：\n\
  \  \\(\\text{Cov}[Y(s_1, t_1), Y(s_2, t_2)] = C_y(s_1 - s_2, t_1, t_2).\\)\n\n-\
  \ 时间平稑性：\n  \\(\\text{Cov}[Y(s_1, t_1), Y(s_2, t_2)] = C_y(s_1, s_2, t_1 - t_2).\\\
  )\n\n- 空间各向同性：\n  \\(\\text{Cov}[Y(s_1, t_1), Y(s_2, t_2)] = C_y(\\|s_1 - s_2\\\
  |, t_1, t_2).\\)\n\n- 几何空间各向异性：\n  \\(\\text{Cov}[Y(s_1, t_1), Y(s_2, t_2)] = C_y(\\\
  {h_1(s_{11} - s_{21})^2 + \\cdots + h_d(s_{1d} - s_{2d})^2\\}^{1/2}, t_1, t_2),\\\
  )\n  其中 \\(s_i = (s_{i1}, ..., s_{id})'\\) 且对于 \\(i = 1, ..., d\\) 有 \\(h_i > 0\\\
  )。\n\n- 几何 S-T 各向异性：\n  \\(\\text{Cov}[Y(s_1, t_1), Y(s_2, t_2)] = C_y(\\{h_1(s_{11}\
  \ - s_{21})^2 + \\cdots + h_d(s_{1d} - s_{2d})^2 + h(t_1 - t_2)^2\\}^{1/2}),\\)\n\
  \  其中 \\(s_i = (s_{i1}, ..., s_{id})'\\)，对于 \\(i = 1, ..., d\\) 有 \\(h_i > 0\\)，且\
  \ \\(h > 0\\)。\n\n另一个重要概念是 S-T 相关的可分性。如果对于所有 \\(s_i \\in R^d\\) 和 \\(t_i \\in R\
  \ (i = 1, 2)\\)，随机过程 \\(Y(s, t)\\) 满足\n\n\\[\n\\text{Cov}[Y(\\boldsymbol{s}_1, t_1),\
  \ Y(\\boldsymbol{s}_2, t_2)] = C^{(s)}(\\boldsymbol{s}_1, \\boldsymbol{s}_2) \\\
  times C^{(t)}(t_1, t_2), \\tag{9.66}\n\\]\n\n其中 \\(C^{(s)}\\) 和 \\(C^{(t)}\\) 分别为空间和时间协方差函数。对于静态函数，公式\
  \ (9.66) 变为\n\n\\[\nC_y(\\boldsymbol{h}, \\tau) = C^{(s)}(\\boldsymbol{h}) \\times\
  \ C^{(t)}(\\tau), \\quad \\boldsymbol{h} \\in R^d, \\tau \\in R. \\tag{9.67}\n\\\
  ]\n\n可分性还意味着 S-T 相关函数可以写成\n\n\\[\n\\rho(\\boldsymbol{h}, \\tau) = \\rho^{(s)}(\\\
  boldsymbol{h}, \\mathbf{0}) \\times \\rho^{(t)}(\\mathbf{0}, \\tau), \\quad \\boldsymbol{h}\
  \ \\in R^d, \\tau \\in R. \\tag{9.68}\n\\]\n\n在实际中，可分性意味着过程 \\(Y(\\boldsymbol{s},\
  \ t)\\) 的空间效应和时间效应相互正交，并可由分开的函数参数化。反之，如果 S-T 相关是空间相关函数和时间相关函数的乘积，则该过程是可分的。因此，公式\
  \ (9.68) 是二阶平稳过程中可分性的一种表征。因而，该方程提供了一种通过将 \\(C_y(\\boldsymbol{h}, \\tau)\\) 与 \\\
  (C_y(\\boldsymbol{h}, \\mathbf{0}) \\times C_y(\\mathbf{0}, \\tau)\\) 进行比较来检验可分性假设的方法。\n\
  \n图 9.14 显示了 Cressie and Wikle (2011) 公式 (6.3) 给出的一个不可分 S-T 相关的等值线图。从图中可以看出，相关性是空间距离\
  \ \\(h\\) 和时间滞后 \\(\\tau\\) 的非线性函数。在文献中，已为 S-T 过程提出了许多模型。这些模型在其 S-T 协方差函数中具有各种特征。例如，Reinsel\
  \ et al. (1981) 的区域效应模型和 Oehlert (1993) 的混合模型等。\n\n### 9.6.2 一些不可分协方差函数\n\n接下来，我们介绍两个特定的不可分且灵活的\
  \ S-T 协方差函数家族。第一个家族由 Cressie and Huang (1999) 提出\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_519_0.png)\n\
  \n图 9.14 Cressie and Wikle (2011) eq. (6.3) 给出的不可分 S-T 相关函数的等值线图。参数为 \\(\\alpha\
  \ = 1\\) 和 \\(\\beta = 20\\)。来源：Cressie and Wikle (2011)。©2011 John Wiley & Sons。\n\
  \n\n\n\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_520_0.png)\n\n**Figure 9.15**\
  \ 不可分离 S-T 协方差函数 Eq. (9.69) 在 $d = 1$ 时的水平图。部分 (a) 中 $\\sigma=1, a=1.5, b=0.3$，部分\
  \ (b) 中 $\\sigma=1, a=2.3, b=0.2$。\n\nand given by\n\n$$C_y(\\boldsymbol{h}, \\\
  tau) = \\frac{\\sigma^2 \\exp\\{-b^2 \\|\\boldsymbol{h}\\|^2 / (a^2 \\tau^2 + 1)\\\
  }}{(a^2 \\tau^2 + 1)^{d/2}}, \\quad \\boldsymbol{h} \\in R^d, \\tau \\in R, \\quad\
  \ (9.69)$$\n\nwhere $\\sigma^2 = C_y(\\boldsymbol{0}, 0)$ and $a \\ge 0$ and $b\
  \ \\ge 0$ are scaling parameters for time and space, respectively. Figure 9.15 shows\
  \ two examples of the nonseparable covariance function in Eq. (9.69), where $d=1$,\
  \ $\\sigma=1$, and $(a, b) = (1.5, 0.3)$ and $(2.5, 0.2)$, respectively, for part\
  \ (a) and (b). The effects of $(a, b)$ on the covariance functions are clearly seen.\
  \ This family of covariance function seems flexible.\n\nThe second family is proposed\
  \ by Gneiting (2002) and given by\n\n$$C_y(\\boldsymbol{h}, \\tau) = \\frac{\\sigma^2\
  \ \\phi(\\|\\boldsymbol{h}\\|^2 / \\psi(\\tau^2))}{(\\psi(\\tau^2))^{d/2}}, \\quad\
  \ \\boldsymbol{h} \\in R^2, \\tau \\in R, \\quad (9.70)$$\n\nwhere $\\{\\phi(x)|x\
  \ \\ge 0\\}$ is a completely monotone function and $\\{\\psi(x)|x \\ge 0\\}$ is\
  \ a positive function with completely monotone derivative. For instance, assuming\n\
  \n$$\\phi(x) = \\exp(-px^v), \\quad x \\ge 0, p > 0, 0 < v \\le 1,$$\n$$\\psi(x)\
  \ = (qx^a + 1)^\\beta, \\quad x \\ge 0, q > 0, 0 < a, \\beta \\le 1,$$\n\nwe have\n\
  \n$$C_y(\\boldsymbol{h}, \\tau) = \\frac{\\sigma^2 \\exp\\{-p \\|\\boldsymbol{h}\\\
  |^{2v} / (q \\|\\tau\\|^{2a} + 1)^\\beta\\}}{(q \\|\\tau\\|^{2a} + 1)^{\\beta d\
  \ / 2}}. \\quad (9.71)$$\n\nSeparable covariance functions can be obtained by using\
  \ the product of marginal models of nonseparable functions.\n\n### 9.6.3 S-T Variogram\n\
  \nThe S-T variogram of the process $Y(\\boldsymbol{s}, t)$ is defined as\n\n$$\\\
  text{Var}[Y(\\boldsymbol{s}_1, t_1) - Y(\\boldsymbol{s}_2, t_2)] = 2\\gamma(\\boldsymbol{s}_1,\
  \ \\boldsymbol{s}_2, t_1, t_2), \\quad (9.72)$$\n\nwhere \\(s_i \\in D\\) and \\\
  (t_i \\in R\\). If \\(Y(s,t)\\) is stationary, then Eq. (9.72) becomes \\(\\text{Var}[Y(s_1,\
  \ t_1) - Y(s_2, t_2)] = 2\\gamma(h, \\tau)\\), where \\(h = s_1 - s_2\\) and \\\
  (\\tau = t_1 - t_2\\). The function \\(\\gamma(\\cdot, \\cdot)\\) is called the\
  \ *semivariogram*. The process \\(Y(s,t)\\) is said to be *intrinsically stationary*\
  \ if \\(E[Y(s,t)] = \\mu\\) and its variogram is stationary. If \\(Y(s,t)\\) is\
  \ second-order stationary with covariance function \\(C_y(h, \\tau)\\), then\n\n\
  \\(\\gamma(h, \\tau) = C_y(0, 0) - C_y(h, \\tau), \\quad h \\in D, \\tau \\in R.\\\
  ) (9.73)\n\n### 9.6.4 S-T Kriging\n\nAs in the spatial case, the goal of kriging\
  \ is to predict \\(Y(s_0, t_0)\\) from observed noisy data \\(\\{Z(s_i, t_{ij})|i=1,\
  \ \\dots, m; j=1, \\dots, T_i\\}\\), where\n\n\\(Z(s_i, t_{ij}) = Y(s_i, t_{ij})\
  \ + \\epsilon(s_i, t_{ij}), \\quad i=1, \\dots, m; j=1, \\dots, T_i,\\) (9.74)\n\
  \nwhere \\(T_i > 0\\) and \\(\\{\\epsilon(s_i, t_{ij})\\}\\) is independent of \\\
  (Y(s,t)\\) and represents the measurement error that is assumed to be *iid* with\
  \ mean zero and variance \\(\\sigma_e^2\\). As before, \\(s_0\\) is a new location\
  \ of interest and \\(t_0\\) the time point of interest.\n\nLet \\(Z_i = [Z(s_i,\
  \ t_{i1}), \\dots, Z(s_i, t_{iT_i})]'\\) be the \\(T_i\\)-dimensional data vector\
  \ at location \\(s_i\\) and \\(Z = (Z'_1, \\dots, Z'_m)'\\) be the observed data\
  \ vector. Kriging is to find the optimal linear combination of \\(Z\\), say \\(Y^*(s_0,\
  \ t_0)\\), that minimizes the expected squared error \\(E[Y^*(s_0, t_0) - Y(s_0,\
  \ t_0)]^2\\). Similar to the spatial kriging discussed in the previous section,\
  \ different types of S-T kriging can be derived under different assumptions concerning\
  \ the mean \\(\\mu(s,t) = E[Y(s,t)]\\). For simple kriging, \\(\\mu(s,t)\\) is assumed\
  \ to be known. For ordinary kriging, \\(\\mu(s,t) = \\mu\\), an unknown constant,\
  \ and for universal-kriging, \\(\\mu(s,t)\\) is a linear function of some covariates\
  \ with unknown coefficient vector \\(\\beta\\).\n\nAssume that \\(Y(s,t)\\) and\
  \ \\(\\epsilon(s,t)\\) are both normal and write \\(\\Sigma_z = \\text{Var}(Z)\\\
  ), \\(c_0 = \\text{Cov}[Y(s_0, t_0), Z]\\), and \\(C_{0,0} = \\text{Var}[Y(s_0,\
  \ t_0)]\\). Also, write \\(Z = Y + \\epsilon\\) with \\(\\text{Cov}(Y) = \\Sigma_y\\\
  ) and \\(\\text{Cov}(\\epsilon) = \\Sigma_e\\). We have\n\n\\(\\begin{bmatrix} Y(s_0,\
  \ t_0) \\\\ Z \\end{bmatrix} \\sim N\\left( \\begin{bmatrix} \\mu(s_0, t_0) \\\\\
  \ \\mu \\end{bmatrix}, \\begin{bmatrix} C_{0,0} & c'_0 \\\\ c_0 & \\Sigma_z \\end{bmatrix}\
  \ \\right),\\) (9.75)\n\nwhere \\(\\mu = E(Z)\\) and \\(\\Sigma_z = \\Sigma_y +\
  \ \\Sigma_e\\). By Bayes' Theorem and properties of Gaussian distribution, we have\n\
  \n\\(Y(s_0, t_0)|Z \\sim N[\\mu(s_0, t_0) + c'_0\\Sigma_z^{-1}(Z - \\mu), C_{0,0}\
  \ - c'_0\\Sigma_z^{-1}c_0].\\) (9.76)\n\nSince the simple-kriging predictor of \\\
  (Y(s_0, t_0)\\) assumes the form \\(Y^*(s_0, t_0) = a'Z + c\\), where \\(a\\) and\
  \ \\(c\\) are chosen to minimize the MSPE, \\(E[Y(s_0, t_0) - a'Z - c]^2\\), we\
  \ can use joint-Gaussian distribution in Eq. (9.75) to see that\n\n\\(Y^*(s_0, t_0)\
  \ = E[Y(s_0, t_0)|Z] = \\mu(s_0, t_0) + c'_0\\Sigma_z^{-1}(Z - \\mu).\\) (9.77)\n\
  \nFurthermore, the minimized MSPE is the posterior variance of Eq. (9.76), i.e.\n\
  \n\\(\\sigma_{sk}^2(s_0, t_0) = E[Y(s_0, t_0) - Y^*(s_0, t_0)]^2 = C_{0,0} - c'_0\\\
  Sigma_z^{-1}c_0.\\) (9.78)\n\nNote that the joint Gaussian assumption is not critical\
  \ for the above results of simple kriging to hold. In practice, calculating the\
  \ S-T simple kriging could be time-consuming when the dimension of \\(\\mathbf{Z}\\\
  ) is large as it involves computing the inverse of \\(\\Sigma_z\\). Some simplifications\
  \ can be achieved with further assumptions. For instance, separability implies that\
  \ \\(\\Sigma_z\\) has block structure which can be used to simplify the computation.\
  \ More specifically, under separability and assuming \\(T_i = T\\) for all \\(i\\\
  ),\n\n\\(\\Sigma_z = \\Sigma_z^{(s)} \\otimes \\Sigma_z^{(t)}\\)\n\nwhere \\(\\\
  otimes\\) is the Kronecker product of two matrices, \\(\\Sigma_z^{(s)}\\) is an\
  \ \\(m \\times m\\) purely spatial covariance matrix, and \\(\\Sigma_z^{(t)}\\)\
  \ is a \\(T \\times T\\) purely temporal covariance matrix. In this case, instead\
  \ of inverting an \\(mT \\times mT\\) matrix, we only invert \\(\\Sigma_z^{(s)}\\\
  ) and \\(\\Sigma_z^{(t)}\\) because \\(\\Sigma_z^{-1} = [\\Sigma_z^{(s)}]^{-1} \\\
  otimes [\\Sigma_z^{(t)}]^{-1}\\).\n\nTurn to ordinary kriging for which \\(E[Y(\\\
  mathbf{s}, t)] = \\mu\\), an unknown constant. Let \\(\\mathbf{1}\\) be a \\(T\\\
  )-dimensional vector of ones, where \\(T = \\sum_{i=1}^m T_i\\), which is the dimension\
  \ of \\(\\mathbf{Z}\\). As the pure spatial case, the generalized least squares\
  \ estimator of \\(\\mu\\) is\n\n\\(\\widehat{\\mu}_{\\text{gls}} = \\frac{\\mathbf{1}'\\\
  Sigma_z^{-1}\\mathbf{Z}}{\\mathbf{1}'\\Sigma_z^{-1}\\mathbf{1}}. \\quad (9.79)\\\
  )\n\nTherefore, the ordinary-kriging predictor is\n\n\\(\\widehat{Y}(\\mathbf{s}_0,\
  \ t_0) = \\widehat{\\mu}_{\\text{gls}} + \\mathbf{c}'_0\\Sigma_z^{-1}(\\mathbf{Z}\
  \ - \\widehat{\\mu}_{\\text{gls}}\\mathbf{1}) = \\{\\mathbf{c}_0 + \\mathbf{1}(1\
  \ - \\mathbf{1}'\\Sigma_z^{-1}\\mathbf{c}_0)/(\\mathbf{1}'\\Sigma_z^{-1}\\mathbf{1})\\\
  }'\\Sigma_z^{-1}\\mathbf{Z}. \\quad (9.80)\\)\n\nand the associated minimized MSPE\
  \ is the ordinary-kriging variance\n\n\\(\\sigma^2_{ok}(\\mathbf{s}_0, t_0) = C_{0,0}\
  \ - \\mathbf{c}'_0\\Sigma_z^{-1}\\mathbf{c}_0 + (1 - \\mathbf{1}'\\Sigma_z^{-1}\\\
  mathbf{c}_0)^2/(\\mathbf{1}'\\Sigma_z^{-1}\\mathbf{1}). \\quad (9.81)\\)\n\nThe\
  \ results of universal kriging also extend easily to the S-T setting.\n\n### Example\
  \ 9.2\n\nConsider the daily maximum temperature of the NOAA data set mentioned in\
  \ Section 9.1. Here we only employ that data of August 1993, which are available\
  \ from the package STRbook. The data contains 10,168 observations and 12 variables.\
  \ The variables include longitude, latitude, year, month, day, location ID, and\
  \ maximum daily temperature, among others. There are 328 locations and each location\
  \ has 31 observations. Our goal here is to use the August 1993 data to demonstrate\
  \ S-T universal kriging using the semivariogram with the package gstat. Following\
  \ Wikle et al. (2019), we also use the package RColorBrewer to color some of the\
  \ surfaces in plotting. The empirical semivariogram of the August maximum temperature\
  \ is given in Figure 9.16, which is produced by the command variogram with a fixed\
  \ latitude effect (i.e. using latitude as an explanatory variable), spatial bin\
  \ of 80 km, points less than 1000 km apart, and time lags from 0 to 6 days. Details\
  \ of the R commands are given below.\n\n\n\n\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_523_0.png)\n\
  \n**图 9.16** 1993 年 8 月 NOAA 数据集中日最高气温的经验时空半变异图，使用 **gstat** 中的命令 `variogram` 计算。来源：NOAA（美国国家海洋和大气管理局）数据集。\n\
  \n对于时空克里金法，我们需要将参数模型拟合到经验半变异图。为此，我们采用形式的可分协方差函数\n\n$$\\gamma(\\boldsymbol{h}, \\\
  tau) = s \\times (\\bar{\\gamma}^{(s)}(\\|\\boldsymbol{h}\\|) + \\bar{\\gamma}^{(t)}(|\\\
  tau|) - \\bar{\\gamma}^{(s)}(\\|\\boldsymbol{h}\\|)\\bar{\\gamma}^{(t)}(|\\tau|)),$$\n\
  \n其中，标准化半变异图 $\\bar{\\gamma}^{(s)}$ 和 $\\bar{\\gamma}^{(t)}$ 具有独立的块缘效应，且 $s = 1$\
  \ 表示基准差。作为第二个模型，我们还采用协方差函数\n\n$$c_{st}(\\|v_a\\|) = b_1 \\exp(-\\phi \\|v_a\\|)\
  \ + b_2 I(\\|v_a\\| = 0),$$\n\n其中 $\\boldsymbol{v}_a = (\\boldsymbol{h}', a\\tau)'$，参数\
  \ $a$ 表示用于生成时空各向异性的缩放因子。事实证明，对于此特定实例，两个模型提供相似的拟合。可分模型的均方误差为 1.72，而各向异性模型的均方误差为 1.69。图\
  \ 9.17 显示了两个模型的拟合半变异图。\n\n由于我们将纬度视为协变量，在以下演示中使用通用克里金法。首先，我们为预测创建一个时空网格。对于空间网格，我们考虑\
  \ 100°W 至 80°W 之间的 20 个空间位置以及 32°N 至 46°N 之间的 20 个空间位置。对于时间网格，我们考虑 1993 年 8 月中等间隔的六天。然后，使用空间网格和时间网格在\
  \ **gstat** 中构建一个 STF 对象，用于我们的时空预测网格。最后，我们省略 1993 年 8 月 9 日的数据，以展示时空克里金法跨时预测的能力。\n\
  \n图 9.18 显示了使用拟合可分模型的通用克里金法的预测值及其相关标准误差。从图中可以看出，8 月 9 日的高标准误差是可以理解的，因为数据被省略了。\n\n\
  ![](img/d4c84ae3c2178f4c506af3dd2ed13122_524_0.png)\n\n图 9.17 NOAA 数据集 1993 年 8\
  \ 月日最高气温的参数模型拟合半变异图。所用模型为 (a) 可分模型和 (b) 带各向异性的度量模型。来源：NOAA（美国国家海洋和大气管理局）数据集。\n\n\
  ![](img/d4c84ae3c2178f4c506af3dd2ed13122_524_1.png)\n\n图 9.18 使用可分协方差函数对 1993 年\
  \ 8 月日最高气温进行时空克里金预测。部分 (a) 为预测值，部分 (b) 为相关标准误差。8 月 9 日的数据被省略。\n\n### R 演示：时空克里金法。\n\
  \n```\n> require(sp)\n> require(spacetime)\n> require(ggplot2)\n> require(dplyr)\n\
  > require(gstat)\n> require(RColorBrewer)\n> require(tidyr)\n> require(STRbook)\n\
  ##\n> data(\"STObj3\", package = \"STRbook\")\n> STObj4 <- STObj3[\"1993-08-01::1993-08-31\"\
  ]\n> da <- as.data.frame(STObj4)\n> names(da) ## show lon, lat, sp.ID, time, ...,\
  \ z.\n> dim(da) ## show 10168-by-12.\n> length(unique(da$id)) ## show 328.\n> v\
  \ <- variogram(object = z ~ 1 + lat, data = STObj4,\n     width = 80, cutoff = 1000,\
  \ tlags = 0.01:6.01)\n> plot(v)\n> print(v)\n> sepVGM <- vgmST(stModel = \"separable\"\
  , space = vgm(10, \"Exp\", 400, nugget = 0.1),\n     time = vgm(10, \"Exp\", 1,\
  \ nugget = 0.1), sill = 30)\n> sepVGM <- fit.StVariogram(v, sepVGM)\n> metricVGM\
  \ <- vgmST(stModel = \"metric\",\n     joint = vgm(100, \"Exp\", 400, nugget = 0.1),\
  \ sill = 20, stAni = 100)\n> metricVGM <- fit.StVariogram(v, metricVGM)\n> metricMSE\
  \ <- attr(metricVGM, \"optim\")$value\n> sepMSE <- attr(sepVGM, \"optim\")$value\n\
  > metricMSE\n#### [1] 1.697554\n> sepMSE\n#### [1] 1.723087\n> plot(v, list(sepVGM,\
  \ metricVGM), main = \"Semi-variance\")\n> spat_pred_grid <- expand.grid(lon = seq(-100,\
  \ -80, length = 20),\n     lat = seq(32, 46, length = 20)) %>%\n     SpatialPoints(proj4string\
  \ = CRS(proj4string(STObj3)))\n> gridded(spat_pred_grid) <- TRUE\n> temp_pred_grid\
  \ <- as.Date(\"1993-08-01\") + seq(3, 28, length = 6)\n> DE_pred <- STF(spat_pred_grid,\
  \ time = temp_pred_grid)\n> STObj5 <- as(STObj4[, -9], \"STIDF\")\n> STObj5 <- subset(STObj5,\
  \ !is.na(STObj5$z))\n> pred_kriged <- krigeST(z ~ 1 + lat, data = STObj5, newdata\
  \ = DE_pred,\n     modelList = sepVGM, computeVar = TRUE)\n> color_pal <- rev(colorRampPalette(brewer.pal(11,\
  \ \"Spectral\"))(16))\n> stplot(pred_kriged, main = \"Predictions (deg Fahrenheit)\"\
  ,\n     layout = c(3, 2), col.regions = color_pal)\n> pred_kriged$sse <- sqrt(pred_kriged$var1.var)\n\
  > stplot(pred_kriged[, , \"se\"], main = \"Prediction std. errors (deg Fahren.)\"\
  ,\n     layout = c(3, 2), col.regions = color_pal)\n```\n\n## 9.7 描述性时空模型\n\n分析时空数据的一大困难在于，直接对观测序列\
  \ \\( Z_t = [Z(s_1, t), \\dots, Z(s_m, t)]' \\) 进行建模会遇到大量参数，尤其是当位置数量 \\( m \\) 很大时。为克服这一困难，常常使用降维和/或参数约束。然而，无论是降维还是参数约束，利用空间和时间结构的知识都很重要。邻域系统是空间结构的一个例子，季节性模式是时间结构的一个例子。本节讨论文献中可用的某些方法，以对数据提供良好的描述。\n\
  \n### 9.7.1 带时空基函数的随机效应\n\n空间-时间建模的一种广泛使用的方法是采用带随机效应的加性模型。当协变量 x(s, t) 可用时，我们可以将模型写为\n\
  \n$$Y(s, t) = x(s, t)' \\beta + \\sum_{i=1}^{n_a} \\phi_i(s, t) a_i + \\nu(s, t),\
  \ \\qquad (9.82)$$\n\n其中，$\\beta$ 表示协变量的固定效应，$\\{\\phi_i(s, t) \\mid i = 1, \\dots,\
  \ n_a\\}$ 是在位置 $s$ 和时间 $t$ 处计算的预设时空基函数，$n_a$ 是正整数，$\\{\\alpha_i\\}$ 是随机效应，$\\nu(s,\
  \ t)$ 是一个时空（残差）过程，用于表示基函数未捕获的小尺度时空随机效应。\n\n假设数据在 $m$ 个位置可用，例如 $\\{s_1, \\dots, s_m\\\
  }$。那么，在每个时间点 $t$，我们可以用矩阵形式表示模型为\n\n$$Y_t = X_t \\beta + \\Phi \\alpha + \\nu_t,\
  \ \\qquad (9.83)$$\n\n其中，$Y_t = [Y(s_1, t), \\dots, Y(s_m, t)]'$，$\\Phi$ 是一个 $m\
  \ \\times n_a$ 矩阵，其第 $i$ 行为 $[\\phi_1(s_i, t), \\dots, \\phi_{n_a}(s_i, t)]$，$\\\
  alpha = (\\alpha_1, \\dots, \\alpha_{n_a})'$，$\\nu_t$ 定义的位置顺序与 $Y_t$ 相同。该模型的一个特殊特征是\
  \ $\\beta$ 和 $\\alpha$ 均在空间和时间上不变。通常，我们假设 $E(Y(s, t) \\mid x_t) = x_t'\\beta$ 且随机效应\
  \ $\\alpha$ 服从分布 $N(0, \\Sigma_a)$。此外，在假设 (a) $\\nu(s, t)$ 无时间依赖性和 (b) $\\nu_t \\\
  sim N(0, \\Sigma_v)$ 下，则有 $Y_t \\sim N(X_t \\beta, \\Sigma_{y,t})$，其中 $\\Sigma_{y,t}\
  \ = \\Phi_t \\Sigma_a \\Phi_t' + \\Sigma_v$。\n\n对于带有测量误差的观测数据 $Z(s, t) = Y(s, t)\
  \ + \\epsilon(s, t)$，我们有 $Z_t \\sim N(X_t \\beta, \\Sigma_{z,t})$，其中 $\\Sigma_{z,t}\
  \ = \\Sigma_{y,t} + \\Sigma_\\epsilon = \\Phi_t \\Sigma_a \\Phi_t' + \\Sigma_v +\
  \ \\Sigma_\\epsilon$。如果 $n_a \\ll m$，即所谓的行秩表示，则公式 (9.82) 中的模型相对容易估计，因为其似然函数可以使用矩阵反演公式有效评估\n\
  \n$$\\Sigma_{z,t}^{-1} = V^{-1} - V^{-1} \\Phi_t (\\Phi_t' V^{-1} \\Phi_t + \\Sigma_a^{-1})^{-1}\
  \ \\Phi_t' V^{-1},$$\n\n其中 $V = \\Sigma_v + \\Sigma_\\epsilon$。当 $\\Sigma_v$ 和 $\\\
  Sigma_\\epsilon$ 均遵循某些简单结构（例如对角矩阵）时，情况尤其如此。\n\n假设数据在 $t = 1, \\dots, T$ 处观测得到。那么，我们可以将所有数据放在一个矩阵形式中\n\
  \n$$Z = X \\beta + \\Phi \\alpha + \\nu + \\epsilon,$$\n\n其中，$Z = [Z_1', \\dots,\
  \ Z_T']'$ 是一个 $mT$ 维向量，$X$ 和 $\\Phi$ 是 $X_t$ 和 $\\Phi_t$ ($t = 1, \\dots, T$) 的堆叠矩阵，顺序与\
  \ $Z$ 相同。\n\n对于 $m = n_a$（满秩）和 $n_a > m$（过完备）情况，如果在随机效应的协方差矩阵 $\\Sigma_a$ 中引入稀疏性，该模型仍可享受一些计算优势。\n\
  \n基函数的选择和基函数的数量在应用公式 (9.83) 中的模型时起着作用。文献中有许多可用的基函数。例如，R 包 FRK 中可用的基函数\n\n\nZammit-Mangion\
  \ (2018b) 和 Tseng 等人 (2019) 的 **autoFRK**。另请参见下一节的讨论。通常，S-T 基函数是所选空间基函数与时间基函数的张量积。此外，在应用中，人们通常假设\
  \ $\\Sigma_a$ 取决于少量未知参数。例如，$\\alpha_i$ 之间的协方差随基函数中心之间距离的指数衰减。\n\n### 9.7.2 带空间基函数的随机效应\n\
  \n通过简化基函数，但增加随机效应的灵活性，可以假设 S-T 模型为\n\n$$\nY(\\mathbf{s}, t) = \\mathbf{x}(\\mathbf{s},\
  \ t)' \\boldsymbol{\\beta} + \\sum_{i=1}^{n_a} \\phi_i(\\mathbf{s}) \\alpha_i(t)\
  \ + \\nu(\\mathbf{s}, t), \\quad (9.84)\n$$\n\n其中 $\\{\\phi_i(\\mathbf{s}) | i =\
  \ 1, \\dots, n_a; \\mathbf{s} \\in D\\}$ 是预先指定的空间基函数，$\\{\\alpha_i(t) | i = 1, \\\
  dots, n_a\\}$ 是时间随机过程，其他组件如前文在 Eq. (9.82) 中定义。文献中有许多可用的空间基函数，例如双平方函数，\n\n$$\nb(\\\
  mathbf{s}_1, \\mathbf{s}_2) = \\begin{cases} [1 - (\\|\\mathbf{s}_1 - \\mathbf{s}_2\\\
  |/a)^2]^2, & \\|\\mathbf{s}_1 - \\mathbf{s}_2\\| \\le a, \\\\ 0, \\text{ otherwise,}\
  \ \\end{cases} \\quad (9.85)\n$$\n\n其中 $a > 0$ 且 $\\mathbf{s}_i \\in D$。空间基函数的其他选择包括小波、高斯函数、傅里叶函数和\
  \ Wendland 函数。图 9.19 展示了 $a = 0.5$ 时的一维和二维双平方函数。在应用中，基函数的选择并不关键，只要基函数的类型和数量足够灵活且足够多，以捕捉\
  \ $Y(\\mathbf{s}, t)$ 中的依赖性。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_527_0.png)\n\
  \n图 9.19 $a = 0.5$ 时的双平方基函数。部分 (a) 为一维，部分 (b) 为二维函数的等高线图。\n\n假设数据在位置 \\(\\{s_i|i=1,\
  \ ..., m\\}\\) 和时间点 \\(\\{t_1, ..., t_T\\}\\) 处观测到，其中 \\(m > 0\\) 且 \\(T > 0\\)。那么，在时间\
  \ \\(t = t_j\\) 时，模型变为\n\n\\(Y_{t_j} = X_{t_j}\\beta + \\Phi\\alpha_{t_j} + \\nu_{t_j},\\\
  ) (9.86)\n\n如前所述，\\(Y_{t_j} = [Y(s_1, t_j), ..., Y(s_m, t_j)]'$ 是一个 \\(m\\) 维向量过程，\\\
  (\\nu_{t_j} \\sim N(0, \\Sigma_\\nu)\\)，\\(\\Phi = [\\phi(s_1), ..., \\phi(s_m)]'$，对于\
  \ \\(j = 1, ..., m\\)，\\(\\phi(s_j) = [\\phi_1(s_j), ..., \\phi_{n_a}(s_j)]'$，且\
  \ \\(\\alpha_{t_j} = [\\alpha_1(t_j), ..., \\alpha_{n_a}(t_j)]'$。对于该模型，对 \\(\\alpha_{t_j}\\\
  ) 的规范需要仔细考虑。\n\n如果 \\(\\{\\alpha_{t_j}|j=1, ..., T\\}\\) 在时间上相互独立且 \\(\\alpha_j\
  \ \\sim N(0, \\Sigma_a)\\)，则 \\(Y_{t_j}\\) 的边缘分布为 \\(N(X_{t_j}\\beta, \\Phi\\Sigma_a\\\
  Phi' + \\Sigma_\\nu)\\)，且 \\(Y_{t_1}, ..., Y_{t_T}\\) 在时间上相互独立。因此，\\(Y = [Y'_{t_1},\
  \ ..., Y'_{t_T}]'\\) 的联合分布为多元高斯分布，协方差矩阵为 \\(\\Sigma_Y = I_T \\otimes (\\Phi\\Sigma_a\\\
  Phi' + \\Sigma_\\nu)\\)，其中 \\(I_T\\) 是一个 \\(T \\times T\\) 的单位矩阵。通常，\\(\\alpha_{t_j}\\\
  ) 在时间上相关，以便模型能更好地建模 \\(Y(s, t)\\) 中的 S-T 依赖性。例如，如果 \\(n_a\\) 不大且时间点 \\(\\{t_j\\\
  }\\) 等距，则可以使用第 3 章中的向量自回归移动平均 (VARMA) 或向量自回归 (VAR) 模型。\n\n### 9.7.3 固定秩克里金\n\n为了使随机效应模型在实践中可应用，尤其是当位置数量\
  \ \\(m\\) 很大时，会仔细简化数据的逆协方差矩阵 \\(\\Sigma_z^{-1}\\) 的计算。模型简化的一种方法是采用少量空间基函数，从而得到固定秩克里金方法。参见\
  \ Cressie 和 Johannesson (2008)。它在 Zammit-Mangion (2018b) 的 R 包 FRK 中可用。我们简要描述如下。\n\
  \n考虑 Eq. (9.86)。为简化起见，假设时间点等距，因此 \\(t = 1, ..., T\\) 且没有协变量。此外，假设 \\(Y_t\\) 是序列不相关的，S-T\
  \ 噪声 \\(\\nu_t\\) 服从协方差矩阵 \\(\\Sigma_\\nu = \\sigma^2 I\\) 的高斯分布。在这种情况下，观测数据 \\\
  (Z_t\\) 的协方差矩阵为 \\(\\Sigma_z = \\Phi\\Sigma_a\\Phi' + (\\sigma_v^2 + \\sigma_e^2)I\\\
  )，其中 \\(\\Phi\\Sigma_a\\Phi'\\) 的秩至多为 \\(n_a\\)。由此产生的克里金称为固定秩克里金 (Cressie and Johannesson,\
  \ 2008)。在此特定情况下，令 \\(\\sigma^2 = \\sigma_v^2 + \\sigma_e^2\\)，我们有\n\n\\(\\Sigma_z^{-1}\
  \ = \\frac{1}{\\sigma^2}I - \\frac{1}{\\sigma^2}\\Phi\\left(\\Sigma_a^{-1} + \\\
  frac{1}{\\sigma^2}\\Phi'\\Phi\\right)^{-1}\\Phi',\\)\n\n只要 \\(\\Sigma_a^{-1}\\)\
  \ 相对容易计算（例如当维度 \\(n_a\\) 不大时），这就可以处理。\n\nFRK 的一个潜在弱点是，空间基函数的选择没有考虑观测数据的特征。因此，对于某些应用，可能需要较大的\
  \ \\(n_a\\) 来对样本协方差矩阵提供良好近似，从而导致估计耗时。为克服这一困难，Tseng 和 Huang (2018) 提出了一类分辨率自适应的新基函数，并使用赤池信息量准则\
  \ (AIC) 来选择基函数的数量。特别值得注意的是，基于所提议的新基函数，\\(\\Sigma_a\\) 和 AIC 的最大似然估计有闭式表达式。新基函数从薄板样条中提取，并按其平滑度级别排序，高阶\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_529_0.png)\n\n图 9.20 单位区间 [0,1] 上带有 40\
  \ 个等距节点的前 20 个基函数图。这些基函数是 Tseng 和 Huang (2018) 的多分辨率薄板样条。来源：基于 Tseng 和 Huang (2018)。\n\
  \n函数对应较大尺度的特征，而低阶函数对应较小尺度的细节。因此，所使用的基函数数量决定了空间分辨率。新基函数还避免了节点分配的需要。有兴趣的读者可参阅 Tseng\
  \ 和 Huang (2018) 以获取更多细节。图 9.20 绘制了 Tseng 和 Huang (2018) 所提方法在单位区间 [0,1] 上带有 40\
  \ 个等距节点的一维情况下生成的前 20 个基函数。从图中可以清楚地看到，第一个基函数只是一个常数，第二个基函数是线性的，第三个基函数是二次的，依此类推。\n\n\
  ### 示例 9.3\n\n考虑美国中西部臭氧数据集。参见图 9.3。这里我们有 T = 89 和 m = 153。为消除时间趋势的可能性，我们使用 x_t =\
  \ (1, t)' 作为协变量，并专注于分析去趋势后的数据。此外，数据中存在一些缺失值，因此我们只使用没有缺失值的监测站。结果，在此示例中我们有 m = 67。我们的分析通过\
  \ Tseng 等人 (2019) 的 autoFRK 包进行。为便于阅读，autoFRK 考虑的随机效应模型为\n\n$$\nZ_t = \\mu + G w_t\
  \ + \\eta_t + \\epsilon_t, \\quad t = 1, \\dots, T, \\qquad (9.87)\n$$\n\n其中 Z_t\
  \ 是 n 个位置处观测数据的 n 维向量，\\(\\mu\\) 是确定性均值的 n 维向量，\\(\\epsilon_t \\sim N(0, sD)\\)，其中\
  \ D 是给定的 \\(n \\times n\\) 矩阵，s 是尺度参数，G 是给定的基函数 \\(n \\times K\\) 矩阵，K 是基函数数量，\\\
  (w_t\\) 是不可观测随机权重的 K 维向量，满足 \\(w_t \\sim N(0, M)\\)，\\(\\eta_t\\) 是空间平稳过程的 n 维向量。这里\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_530_0.png)\n\n图 9.21 美国中西部经纬度上 100 ×\
  \ 100 等距网格点处臭氧预测的特征函数。部分 (a) 是第一个特征函数，部分 (b) 是第二个特征函数。\n\n**_G_** 的列是一个有序的薄板样条函数类，而\
  \ **_η_**_<sub>t</sub>_ 被称为更细尺度的空间效应。\n\n在我们的演示中使用默认选项，因此 \\(\\mu = \\mathbf{0}\\\
  )，\\(\\eta_t = \\mathbf{0}\\)，且 \\(\\mathbf{D} = \\mathbf{I}\\)。基函数数量 _K_ 由 AIC\
  \ 选择。在此特定情况下，选择了 _K_ = 60，这相对较大，因为我们有 _n_ = 67，且 \\(\\hat{\\zeta} = 721\\)。程序提供\
  \ **_G_**，它是一个 \\(67 \\times 60\\) 矩阵，以及 \\(\\hat{\\mathbf{M}}\\) 的估计，它是 **_w_**_<sub>t</sub>_\
  \ 的 \\(60 \\times 60\\) 协方差矩阵。因此，展示结果并非易事。但是，我们可以计算 \\(\\hat{\\mathbf{G}}\\hat{\\\
  mathbf{M}}'\\) 矩阵两个最大特征值所对应的两个特征向量，对于所考虑的模型，该矩阵表示 _Y_(**_s_**_, t_) 的协方差矩阵。这两个特征向量可以与新位置处\
  \ _Y_(**_s_**_, t_) 的预测一起使用，以展示基于所考虑随机效应模型的预测的前两个特征函数。图 9.21 绘制了美国中西部经纬度上 \\(100\
  \ \\times 100\\) 等距网格点处预测的前两个特征函数。从图中，第一个特征函数证实了位于南威斯康星州和北伊利诺伊州附近密歇根湖西岸的高臭氧读数。第二个特征函数标志了研究区域内西北与东南地区之间的差异。\n\
  \n### 固定秩克里金的 R 演示：autoFRK 包。\n\n```\n>require(fields)\n>require(pracma)\n> require(autoFRK)\n\
  > require(maps)\n>data(ozone2)\n>names(ozone2)\n>loc <- ozone2$lon.lat\n>Y <- ozone2$y\n\
  >date <- as.Date(ozone2$date,format='%y%m%d')\n>good <- !colSums(is.na(Y))\n>YY\
  \ <- matrix(Y[,good],nrow=nrow(Y))\n>YY <- detrend(YY,\"linear\")\n>loc1 <- loc[good,]\n\
  >A1 <- autoFRK(t(YY),loc1)\n```\n\n\n```\n>names (A1)\n>A1$s\n#[1] 7.210554\n>dim(A1$G)\n\
  #[1] 67 60\n>dim(A1$M)\n#[1] 60 60\n>new <- 100\n>x_lon <- seq(min(loc1[,1]) , max(loc1[,1])\
  \ , length=new)\n>x_lat <- seq(min(loc1[,2]) , max(loc1[,2]) , length=new)\n>newloc\
  \ <- as.matrix(expand.grid(x=x_lon,y=x_lat))\n>Gpred <- predict(A1$G,newx=newloc)\n\
  >G <- A1$G\n>Mhat <- A1$M\n>dd <- eigen(G %*% Mhat %*% t(G) )\n>fhat <- Gpred %*%\
  \ Mhat %*% t(G) %*% dd$vector[,1:2]\n>quilt.plot(newloc , -fhat[,1] , nx=new , ny=new\
  \ , xlab=\"lon\" , ylab=\"lat\")\n>map(\"state\" , xlim=range(loc1[,1]) , ylim=range(loc1[,2])\
  \ , add=T)\n>map.text(\"state\" , xlim=range(x_lon) , ylim=range(x_lat) , add=T)\n\
  #\n>quilt.plot(newloc , -fhat[,2] , nx=new , ny=new , xlab=\"lon\" , ylab=\"lat\"\
  )\n>map(\"state\" , xlim=range(loc1[,1]) , ylim=range(loc1[,2]) , add=T)\n>map.text(\"\
  state\" , xlim=range(x_lon) , ylim=range(x_lat) , add=T)\n```\n\n### 9.7.4 空间主成分分析\n\
  \n与使用预设空间基函数不同，可以使用经验主成分分析（PCA）来为空间数据的随机效应建模选择合适的基函数。Wang 和 Huang (2017) 提出了一种正则化\
  \ PCA 方法，该方法相对易于使用且具有数据自适应性。\n\n为简化起见，假设没有协变量，且 \\(Y(\\mathbf{s}, t)\\) 均值为零，具有共同的空间协方差函数\
  \ \\(C_y(\\mathbf{s}_1,\\mathbf{s}_2) = \\text{Cov}[Y(\\mathbf{s}_1, t), Y(\\mathbf{s}_2,\
  \ t)]\\) 对所有 \\(t = 1, \\dots, T\\) 均成立。如前所述，我们假设数据在空间域 \\(D \\subset R^d\\) 上的位置\
  \ \\(\\mathbf{s}_1, \\dots, \\mathbf{s}_m\\) 处观测，并伴有独立的测量误差。此外，假设 \\(\\{Y(\\mathbf{s},\
  \ t)\\}\\) 在时间上互不相关。考虑 \\(Y(\\mathbf{s}, t)\\) 的秩 \\(K\\) 空间随机效应模型：\n\n```\nY(\\\
  mathbf{s}, t) = [\\psi_1(\\mathbf{s}), \\dots, \\psi_K(\\mathbf{s})]\\boldsymbol{\\\
  xi}_t = \\sum_{i=1}^K \\xi_{ti}\\psi_i(\\mathbf{s}), \\quad \\mathbf{s} \\in D;\
  \ t = 1, \\dots, T, \\quad (9.88)\n```\n\n其中 \\(\\{\\psi_i(\\mathbf{s})\\}\\) 为未知正交归一基函数，\\\
  (\\boldsymbol{\\xi}_t = (\\xi_{t1}, \\dots, \\xi_{tK})' \\sim (\\mathbf{0}, \\boldsymbol{\\\
  Lambda})\\) (\\(t = 1, \\dots, T\\)) 为不相关的随机变量，且 \\(\\boldsymbol{\\Lambda}\\) 为未知的对称半正定矩阵。\n\
  \n记 \\(\\boldsymbol{\\Lambda} = [\\lambda_{ij}]_{K \\times K}\\)。\\(Y(\\mathbf{s},\
  \ t)\\) 的空间协方差函数为\n\n```\nC_Y(\\mathbf{s}_1, \\mathbf{s}_2) = \\sum_{i=1}^K \\sum_{j=1}^K\
  \ \\lambda_{ij} \\psi_i(\\mathbf{s}_1)\\psi_j(\\mathbf{s}_2). \\quad (9.89)\n```\n\
  \n设 \\(\\boldsymbol{\\Lambda} = \\mathbf{V} \\boldsymbol{\\Lambda}^* \\mathbf{V}'\\\
  ) 为 \\(\\boldsymbol{\\Lambda}\\) 的特征值分解，其中 _V_ 由 _K_ 个正交归一特征向量组成，\\(\\boldsymbol{\\\
  Lambda}^* = \\text{diag}\\{\\lambda_1^*, \\dots, \\lambda_K^*\\}\\)，其中 \\(\\lambda_1^*\
  \ \\ge \\cdots \\ge \\lambda_K^*\\) 为相应的特征值。设 \\(\\boldsymbol{\\xi}_t^* = \\mathbf{V}'\
  \ \\boldsymbol{\\xi}_t\\) 且 \\([\\psi_1^*(\\mathbf{s}), \\dots, \\psi_K^*(\\mathbf{s})]\
  \ = [\\psi_1(\\mathbf{s}), \\dots, \\psi_K(\\mathbf{s})]\\mathbf{V}\\)。\n\n不难看出\
  \ \\(\\{\\psi_i^*(\\mathbf{s})\\}\\) 也是正交归一的，且 \\(\\xi_{ti}^* \\sim (0, \\lambda_i^*)\\\
  ) 对 \\(t = 1, \\dots, T\\) 和 \\(i = 1, \\dots, K\\) 互不相关。因此，有\n\n```\nY(s, t) =\
  \ [\\psi_1^*(\\mathbf{s}), \\dots, \\psi_K^*(\\mathbf{s})]\\boldsymbol{\\xi}_t^*\
  \ = \\sum_{i=1}^K \\xi_{ti}^*\\psi_i^*(\\mathbf{s}), \\quad \\mathbf{s} \\in D.\
  \ \\quad (9.90)\n```\n\n该展开式称为带有 \\(K\\) 个非零特征值的 \\(Y(s, t)\\) 的 Karhunen-Loève\
  \ 展开式，其中 \\(\\psi_i^*(\\mathbf{s})\\) 为 \\(C_y(\\cdot, \\cdot)\\) 的第 \\(i\\) 个特征函数，\\\
  (\\lambda_i^*\\) 为相应的特征值。参见 Karhunen (1947) 和 Loève (1978)。\n\n观测数据 \\(\\mathbf{Z}_t\
  \ = [Z(s_1, t), \\dots, Z(s_m, t)]'\\) 可写成\n\n```\n\\mathbf{Z}_t = \\mathbf{Y}_t\
  \ + \\boldsymbol{\\epsilon}_t = \\boldsymbol{\\Psi}\\boldsymbol{\\xi}_t + \\boldsymbol{\\\
  epsilon}_t, \\quad t = 1, \\dots, T, \\quad (9.91)\n```\n\n其中 \\(\\boldsymbol{\\\
  epsilon}_t\\) 表示独立测量误差向量，\\(\\boldsymbol{\\epsilon}_t \\sim (0, \\sigma^2\\mathbf{I})\\\
  )，\\(\\mathbf{Y}_t\\) 由潜在 S-T 过程 \\([Y(s_1, t), \\dots, Y(s_m, t)]'\\) 组成，\\(\\\
  boldsymbol{\\Psi} = [\\psi_1, \\dots, \\psi_K]\\) 是一个 \\(m \\times K\\) 矩阵，其 \\\
  ((i, j)\\) 个元素为 \\(\\psi_j(s_i)\\)，且 \\(\\boldsymbol{\\xi}_t\\) 与 \\(\\boldsymbol{\\\
  epsilon}_t\\) 不相关。此处目标是找到前 \\(p \\le K\\) 个占优势模式 \\(\\psi_1, \\dots, \\psi_p\\)，其具有较大的\
  \ \\(\\lambda_1^*, \\dots, \\lambda_p^*\\)，并估计协方差函数 \\(C_y(\\cdot, \\cdot)\\) 用于空间预测。公式\
  \ (9.91) 采用潜在因子模型形式，PCA 提供了一种实现我们目标的方法。然而，如果样本量 \\(T\\) 相对于维度 \\(m\\) 不够大，潜在因子和载荷的\
  \ PCA 估计将变化较大。为克服这一困难，Wang 和 Huang (2017) 提议在估计中使用正则化并施加某些平滑性约束。根据光滑样条理论（Green 和\
  \ Silverman, 1994），估计 \\(\\hat{\\boldsymbol{\\Psi}}(\\mathbf{s})\\) 在 \\(d=1\\)\
  \ 时为自然三次样条，在 \\(d=2\\) 或 \\(3\\) 时为薄板样条，节点位于 \\(\\{s_1, \\dots, s_m\\}\\)。更具体地，令\
  \ \\(\\mathbf{Z} = (\\mathbf{Z}_1, \\dots, \\mathbf{Z}_T)'\\) 为 \\(T \\times m\\\
  ) 数据矩阵，且默认 \\(\\mathbf{Z}_t\\) 的均值为零。样本协方差矩阵记为 \\(\\mathbf{S} = \\mathbf{Y}'\\mathbf{Y}\
  \ / T\\)。Wang 和 Huang (2017) 按如下方式估计 \\(\\boldsymbol{\\Psi}\\)：\n\n```\n\\hat{\\\
  boldsymbol{\\Psi}}_{\\tau_1,\\tau_2} = \\arg \\min_{\\boldsymbol{\\Psi}:\\boldsymbol{\\\
  Psi}'\\boldsymbol{\\Psi}=\\mathbf{I}_K} \\|\\mathbf{Z} - \\mathbf{Z}\\boldsymbol{\\\
  Psi}\\boldsymbol{\\Psi}'\\|_F^2 + \\tau_1 \\sum_{i=1}^K \\boldsymbol{\\psi}_i'\\\
  boldsymbol{\\Omega}_i\\boldsymbol{\\psi}_i + \\tau_2 \\sum_{i=1}^K \\sum_{j=1}^m\
  \ |\\psi_{ji}|, \\quad (9.92)\n```\n\n受约束于 \\(\\boldsymbol{\\psi}_1'\\mathbf{S}\\\
  boldsymbol{\\psi}_1 \\ge \\boldsymbol{\\psi}_2'\\mathbf{S}\\boldsymbol{\\psi}_2\
  \ \\ge \\dots \\ge \\boldsymbol{\\psi}_K'\\mathbf{S}\\boldsymbol{\\psi}_K\\)，其中\
  \ \\(\\tau_1\\) 和 \\(\\tau_2\\) 为惩罚参数，其值由交叉验证确定，\\(\\|\\mathbf{M}\\|_F = (\\sum_{i,j}\
  \ m_{ij}^2)^{1/2}\\) 为矩阵 \\(\\mathbf{M} = [m_{ij}]\\) 的 Frobenius 范数。此外，为估计协方差函数\
  \ \\(C_y(\\cdot, \\cdot)\\)，还需要估计 \\(\\sigma^2\\) 和 \\(\\boldsymbol{\\Lambda}\\\
  )。为此，Wang 和 Huang 应用 Tzeng 和 Huang (2015) 的正则化最小二乘法：\n\n```\n(\\hat{\\sigma}^2,\
  \ \\hat{\\boldsymbol{\\Lambda}}) = \\arg \\min_{\\sigma^2, \\boldsymbol{\\Lambda}\
  \ \\mid \\sigma^2 \\ge 0, \\boldsymbol{\\Lambda} \\ge 0} \\left\\{ \\frac{1}{2}\
  \ \\|\\mathbf{S} - \\hat{\\boldsymbol{\\Psi}}\\hat{\\boldsymbol{\\Lambda}}\\hat{\\\
  boldsymbol{\\Psi}}' - \\sigma^2\\mathbf{I}\\|_F^2 + \\gamma \\|\\hat{\\boldsymbol{\\\
  Psi}}\\hat{\\boldsymbol{\\Lambda}}\\hat{\\boldsymbol{\\Psi}}'\\|_* \\right\\}, \\\
  quad (9.93)\n```\n\n其中 \\(\\gamma \\ge 0\\) 为调整参数，\\(\\|\\mathbf{A}\\|_* = \\text{tr}[(\\\
  mathbf{A}'\\mathbf{A})^{1/2}]\\) 为 \\(\\mathbf{A}\\) 的核范数。\\(\\hat{\\boldsymbol{\\\
  Lambda}}\\) 和 \\(\\hat{\\sigma}^2\\) 均可得到解析解。详情见 Wang 和 Huang (2017, 提议 1)。最后，本节讨论的分析可通过\
  \ R 包 SpatPCA 进行。\n\n#### 示例 9.4\n\n再次考虑美国中西部的臭氧测量数据。在此例中，我们有 \\(T = 89\\) 和 \\\
  (m = 153\\)，因此样本协方差矩阵\n\n#### 第一特征函数\n\n#### 第二特征函数\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_533_0.png)\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_533_1.png)\n\n图 9.22 美国中西部趋势调整后臭氧数据的特征函数。部分\
  \ (a) 为第一特征函数，部分 (b) 为第二特征函数。\n\n为奇异矩阵，常规 PCA 并不实用。如同示例 9.2，我们关注趋势调整后的数据。图 9.22\
  \ 展示了趋势调整后臭氧数据的前两个特征函数。从图中不难看出，第一特征函数在北伊利诺伊州和南威斯康星州密歇根湖西岸沿线具有较大权重。另一方面，第二特征函数显示出某些地理效应，因为它在北部各州（威斯康星州、密歇根州、北伊利诺伊州）上权重较重，在南部各州（俄亥俄州和肯塔基州）上权重较轻。图\
  \ 9.23 展示了前两个主成分的时间图。这些图表明，这些成分在时间上似乎是平稳的。最后，应用估计的协方差函数，我们可以对臭氧数据进行空间预测。为演示，我们使用\
  \ 200 个\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_534_0.png)\n\n#### 图 9.24 基于正则化空间\
  \ PCA 的美国中西部臭氧测量值空间预测的第一个特征函数。\n\n沿使用的经度方向等距点和沿使用的纬度方向 200 个等距点。换言之，我们为美国中西部构建了一个\
  \ \\(200 \\times 200\\) 的新网格。图 9.24 绘制了预测臭氧测量值（趋势调整后）的第一个特征函数。令人欣慰的是，臭氧的主要集中区域位于北伊利诺伊州和南威斯康星州附近的密歇根湖西岸。\n\
  \n#### 空间 PCA：R 的 SpatPCA 包\n\n```\n>require(fields)\n>require(SpatPCA)\n>require(pracma)\n\
  >data(zone2)\n>x <- ozone2$lon.lat\n>Y <- ozone2$y\n>date <- as.Date(zone2$date,format='%y%m%d')\n\
  >rmma <- !colSums(is.na(Y))\n>YY <- matrix(Y[,rmma],nrow=nrow(Y))\n>YY <- detrend(YY,\"\
  linear\")\n>xx <- x[rmma,]\n>cv <- spatpca(x=xx,Y=YY)\n>quilt.plot(xx,cv$eigenfn[,1])\n\
  >map(\"state\",xlim=range(xx[,1]),ylim=range(xx[,2]),add=T)\n>map.text(\"state\"\
  ,xlim=range(xx[,1]),ylim=range(xx[,2]),cex=1,add=T)\n>title(main=\"First Eigen Function\"\
  )\n>quilt.plot(xx,cv$eigenfn[,2])\n>map(\"state\",xlim=range(xx[,1]),ylim=range(xx[,2]),add=T)\n\
  >map.text(\"state\",xlim=range(xx[,1]),ylim=range(xx[,2]),cex=1,add=T)\n>title(main=\"\
  Second Eigen Function\")\n#### Time plots\n>par(mfcol=c(2,1))\n>plot(date,YY%*%cv$eigenfn[,1],type=\"\
  l\",ylab=\"1st PCA\")\n>plot(date,YY%*%cv$eigenfn[,2],type=\"l\",ylab=\"2nd PCA\"\
  )\n>par(mfcol=c(1,1))\n```\n\n\n\n\n\n#### 预测\n```\n>new_loc <- 200\n>x_lon <- seq(min(xx[,\
  \ 1]), max(xx[, 1]), length=new_loc)\n>x_lat <- seq(min(xx[, 2]), max(xx[, 2]),\
  \ length=new_loc)\n>xx_new <- as.matrix(expand.grid(x=x_lon,y=x_lat))\n>eof <- spatpca(xx=xx,\
  \ Y=YY,K=cv$Khat,tau1=cv$stau1,tau2=cv$stau2,\n      x_new=xx_new)\n>quilt.plot(xx_new,eof$eigenfn[,1],nx=new_loc,ny=new_loc,xlab=\"\
  lon\",\n      ylab=\"lat\")\n>map(\"state\",xlim=range(x_lon),ylim=range(x_lat),add=T)\n\
  >map.text(\"state\",xlim=range(x_lon),ylim=range(x_lat),cex=1,add=T)\n```\n\n###\
  \ 9.7.5 具有时间基函数的随机效应\n\n或者，如果有人使用时间基函数并将随机效应扩展为空间，则公式 (9.82) 中的 S-T 模型变为\n\n\\(Y(\\\
  boldsymbol{s}, t) = \\boldsymbol{x}(\\boldsymbol{s}, t)' \\boldsymbol{\\beta} +\
  \ \\sum_{i=1}^{n_a} \\phi_i(t)\\alpha_i(\\boldsymbol{s}) + \\upsilon(\\boldsymbol{s},\
  \ t),\\) (9.94)\n\n其中 \\(\\{\\phi_i(t)|i=1, \\dots, n_a\\}\\) 是时间基函数，\\(\\{\\alpha_i(\\\
  boldsymbol{s})\\}\\) 是带空间索引的随机效应。设 \\(\\boldsymbol{\\alpha}(\\boldsymbol{s}) = [\\\
  alpha_1(\\boldsymbol{s}), \\dots, \\alpha_{n_a}(\\boldsymbol{s})]'\\) 表示 \\(n_a\\\
  ) 维空间过程。可以为 \\(\\boldsymbol{\\alpha}(\\boldsymbol{s})\\)（其中 \\(\\boldsymbol{s} \\\
  in D\\)）指定之前讨论过的空间模型。有许多可用的时间基函数，包括傅里叶函数和其他正交函数。也可以使用数据驱动的时间基函数。\n\n#### 示例 9.5\n\
  \n再次考虑 1993 年 8 月 NOAA 数据集中的每日最高气温。这里我们考虑一个具有时间基函数的随机效应模型。具体来说，所考虑的模型形式为\n\n\\(Y(\\\
  boldsymbol{s}, t) = \\sum_{i=1}^{3} \\phi_i(t)\\alpha_i(\\boldsymbol{s}) + \\upsilon(\\\
  boldsymbol{s}, t),\\) (9.95)\n\n其中 \\(\\{\\phi_i(t)|i=1,2,3\\}\\) 是数据驱动的时间基函数，\\\
  (\\{\\alpha_i(\\boldsymbol{s})\\}\\) 是作为多元空间随机场处理的时间基函数系数，而 \\(\\upsilon(\\boldsymbol{s},\
  \ t)\\) 是空间相关但时间独立的随机过程。在此演示中，我们不使用任何协变量，因此项 \\(\\boldsymbol{x}(\\boldsymbol{s},\
  \ t)' \\boldsymbol{\\beta}\\) 被省略。\n\n公式 (9.95) 中模型的实证分析可以通过 R 包 **SpatioTemporal**\
  \ 进行。所用 R 命令的详细信息如下。另见 Wikle et al. (2019, 第 4 章)。**SpatioTemporal** 使用的时空对象为类 `STdata`，由函数\
  \ `createSTdata` 创建。此外，该包假设 \\(\\upsilon(\\boldsymbol{s}, t)\\) 在时间上不相关。因此，时间依赖性应由协变量或时间基函数中的任一者来处理。由于公式\
  \ (9.95) 中的模型不使用任何协变量，每日最高气温中的时间依赖性必须由基函数捕获。我们进行一些初步数据分析以检查此类假设的有效性。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_536_0.png)\n\
  \n图 9.25 1993 年 8 月选定系列每日最高气温的样本自相关函数（ACF）。部分 (a) 是观测系列的 ACF，部分 (b) 是调整时间基函数效应后残差的\
  \ ACF。\n\n图 9.25(a) 显示了选定系列（ID = 3810）的样本自相关函数（ACF）。从图中可以看出，观测数据系列具有显著的序列相关性。图 9.25(b)\
  \ 提供了调整时间基函数效应后同一系列的样本 ACF。现在，图表明没有显著的序列依赖性。所使用的三个时间基函数在图 9.26 中显示。第一个基函数只是一个常数。\n\
  \n使用指定的时间基函数，公式 (9.95) 中的空间系数 \\(\\alpha_i(s)\\) 可以通过命令 `estimateBetaFields` 估计。估计结果提供两个数量。第一个数量包含参数估计，在程序中称为\
  \ beta，第二个是估计的标准误差，称为 beta.sd。图 9.27 显示了 \\(\\alpha_1(s)\\)、\\(\\alpha_2(s)\\) 和\
  \ \\(\\alpha_3(s)\\) 在\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_536_1.png)\n\n\
  图 9.26 1993 年 8 月每日最高气温的前三个时间基函数时间图。第二个和第三个基函数分别以虚线和点线显示。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_537_0.png)\n\
  \n**图 9.27** 每个地点处 \\(\\alpha_1(\\mathbf{s})\\)、\\(\\alpha_2(\\mathbf{s})\\) 和 \\\
  (\\alpha_3(\\mathbf{s})\\) 的实证估计值及 95% 置信区间，按纬度绘制。\n\n各地点处的每个 \\(\\alpha_i(\\mathbf{s})\\\
  ) 的实证估计值及 95% 置信区间，按纬度绘制。从图中可以容易看出，\\((a)\\) 如预期，\\(\\widehat{\\alpha}_1(\\mathbf{s})\\\
  ) 随纬度呈递减趋势。\\((b)\\) \\(\\widehat{\\alpha}_2(\\mathbf{s})\\) 在纬度较低时显示出较弱的趋势，但随着纬度增加，趋势会趋于平缓，\\\
  ((c)\\) \\(\\widehat{\\alpha}_3(\\mathbf{s})\\) 除纬度较大时外，对纬度没有明确的依赖关系。基于这些发现，将 \\\
  (\\alpha_i(\\mathbf{s})\\) 视为具有指数协方差函数的随机场是合理的。具体来说，我们假设模型：\n\n\\(E[\\alpha_1(\\\
  mathbf{s})] = \\alpha_{11} + \\alpha_{12}s_2, \\quad \\text{Cov}[\\alpha_1(\\mathbf{s}),\
  \ \\alpha_1(\\mathbf{s}+\\mathbf{h})] = \\sigma_1^2 \\exp \\left( \\frac{-\\|\\\
  mathbf{h}\\|}{r_1} \\right), \\quad (9.96)\\)\n\n\\(E[\\alpha_2(\\mathbf{s})] =\
  \ \\alpha_{21} + \\alpha_{22}s_2, \\quad \\text{Cov}[\\alpha_2(\\mathbf{s}), \\\
  alpha_2(\\mathbf{s}+\\mathbf{h})] = \\sigma_2^2 \\exp \\left( \\frac{-\\|\\mathbf{h}\\\
  |}{r_2} \\right), \\quad (9.97)\\)\n\n\\(E[\\alpha_3(\\mathbf{s})] = \\alpha_{31},\
  \ \\quad \\text{Cov}[\\alpha_3(\\mathbf{s}), \\alpha_3(\\mathbf{s}+\\mathbf{h})]\
  \ = \\sigma_3^2 \\exp \\left( \\frac{-\\|\\mathbf{h}\\|}{r_3} \\right), \\quad (9.98)\\\
  )\n\n其中 \\(s_2\\) 是地点 \\(\\mathbf{s} = (\\text{lon}, \\text{lat})' = (s_1, s_2)'\\\
  ) 的纬度，\\(r_i (i=1,2,3)\\) 是尺度参数，\\(\\sigma_i^2 (i=1,2,3)\\) 是平稳方差。我们进一步假设，当 \\(i\
  \ \\neq j\\) 时，\\(\\text{Cov}[\\alpha_i(\\mathbf{s}), \\alpha_j(\\mathbf{s})] =\
  \ 0\\)。后一个假设相对较强，我们使用它是为了演示方便。最后，仍需指定时间独立残差过程 \\(\\nu(\\mathbf{s}, t)\\) 的空间协方差函数。遵循\
  \ Wikle et al. (2019)，我们使用带有块头效应的指数协方差函数来考虑测量误差。指定的整体模型可以通过包 **SpatioTemporal**\
  \ 的命令 `createStmodel` 创建。需要估计的模型参数可以使用命令 `loglikeStnames` 找到。\n\n然后，拟合模型可用于预测每日最高气温。为了演示，我们创建一个\
  \ 20 乘 20 的网格，包含从 \\(-100^\\circ\\) 到 \\(-80^\\circ\\) 的 20 个等间距经度和从 \\(32^\\circ\\\
  ) 到 \\(46^\\circ\\) 的 20 个等间距纬度。我们还创建从 1993 年 8 月 1 日开始的六个时间天。预测可以通过命令 `predict`\
  \ 获得。图 9.28(a) 显示新网格上 8 月 14 日以华氏度为单位的点预测，而图 9.28(b) 显示相应的预测标准误差。\n\n#### R 演示和使用的命令：包\
  \ SpatioTemporal\n\n```\n`> require(dplyr)`\n`> require(ggplot2)`\n```\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_538_0.png)\n\
  \n图 9.28 基于公式 (9.95) 中拟合的 S-T 模型对 1993 年 8 月 14 日每日最高气温的预测。部分 (a) 表示点预测，部分 (b) 表示相应的预测标准误差。\n\
  \n```\n>require(gstat)\n>require(RColorBrewer)\n>require(sp)\n>require(spacetime)\n\

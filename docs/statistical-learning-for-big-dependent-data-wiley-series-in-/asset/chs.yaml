  ### 6.5.1 协整与 DFM\n\n正如第 3 章所讨论的，非平稳时间序列向量可以协整，该系列的一些线性组合是平稳的；参见 Banerjee 等人 (1993)\
  \ 和 Johansen (1995)。具有某些整合因子和平稳噪声的 DFM 意味着系列 \\(z_t\\) 的协整。令 \\(P_1^\\perp\\) 为\
  \ \\(P_1\\) 的 \\(k \\times (k - r_1)\\) 正交补矩阵，使得 \\(P'_1 P_1^\\perp = 0_{(r_1 \\\
  times k - r_1)}\\)，则有\n\n\\(P_1^{\\perp'} z_t = P_1^{\\perp'} P z_{2t} + P_1^{\\\
  perp'} n_t.\\)\n\n由于前一等式右边由平稳系列的线性组合构成，\\(P_1^{\\perp'} z_t\\) 中的 \\(k - r_1\\)\
  \ 个系列是平稳的。事实上，这些系列代表了 \\(z_t\\) 的协整系列。进一步分析见 Scribano and Peña (1994)。因此，DFM 提供了一种寻找协整关系的直接方法。关于通过\
  \ DFM 估计协整秩的一致性建议，参见 Zhang et al. (2018)。当有许多时间序列（即 \\(k\\) 很大）时，整合因子的数量 \\(r_1\\\
  ) 预计相对较小，因此协整关系的数量 \\(k - r_1\\) 将很大。有观点认为（参见 Barigozzi et al. (2016, 2017)），具有平稳噪声的\
  \ DFM 隐含的大量协整关系与实证证据不一致，这意味着在实际应用中噪声可能遵循整合过程。这些作者还考虑了因子具有降秩表示或因子之间存在协整的可能性，并提出了一种在某些噪声协整时估计它们的程序。噪声可能非平稳这一事实表明，FM\
  \ 中噪声的协方差矩阵可能有一些主导特征值，这可能导致通过 PCA 或检验特征值比率来识别共同因子数量时出现困难。该问题已在 Gao and Tsay (2018)\
  \ 中得到解决。\n\n## 6.6 非平稳系列的 GDFM\n\n关于非平稳数据的 GDFM 结果很少，大多数应用都是通过对系列进行差分来构建平稳 GDFM。基于频域中\
  \ DPC 的估计程序只能应用于平稳系列，但存在一种时域方法，即广义动态主成分（GDPC），由 Peña and Yohai (2016) 提出，该方法不需要平稳性假设，可以应用于非平稳时间序列。这些广义\
  \ DPC 是用于重构数据的最优函数，不限制为观测值的线性组合。请注意，Brillinger 的 DPC 和第 6.5 节中介绍的 ODPC 都是观测系列的线性组合。去除这一限制后，GDPC\
  \ 可以是观测值的非线性函数，因此可以更好地适应系列的非平稳行为。Smucer (2019) 证明，这些 GDPC 是 GDFM 共同部分的估计的一致估计量。\n\
  \n### 6.6.1 广义 DPC 估计\n\nGDPC 可以按如下计算。有关更详细的解释，参见 Peña and Yohai (2016)。\n\n假设我们观察到满足\
  \ $\\sum_{t=1}^T z_{j,t} = 0$ 的系列 $z_{j,t}$。考虑两个正整数 $c_1$ 和 $c_2$。我们定义具有 $c_1$ 个滞后和\
  \ $c_2$ 个超前的第一个 GDPC 为向量 $\\boldsymbol{f} = (f_t)_{-c_1+1 \\le t \\le T+c_2}$，使得将系列\
  \ $z_{j,t}$ ($1 \\le j \\le k$) 重构为 $\\{f_j t - c_1 \\le j \\le t + c_2\\}$ 元素的线性组合，关于\
  \ MSE 准则是最优的。更准确地说，原始系列 $z_{j,t}$ 的重构定义为\n\n$\\widehat{z}_{j,t} = \\sum_{i=-c_1}^{c_2}\
  \ \\beta_{j,i} f_{t+i}.$\n\n我们可以通过令 $L = c_1 + c_2$ 并定义新分量 $f_t^* = f_{t+c_2}$，仅使用分量的滞后来写出此表达式，这样值\
  \ $(f_{t+c_2}, \\dots, f_{t-c_1})$ 就转换为 $(f_t^*, \\dots, f_{t-L}^*)$，并将 $\\beta_{j,i}^*$\
  \ 称为对应于 $f_{t-i}^*$ 的新系数，它们与之前的系数的关系为 $\\beta_{j,i}^* = \\beta_{j,c_2-i}$。然后，重构系列也可以表示为\n\
  \n$\\widehat{z}_{j,t} = \\sum_{i=-c_1}^{c_2} \\beta_{j,i} f_{t+i} = \\sum_{h=0}^L\
  \ \\beta_{j,h}^* f_{t-h}^* .$\n\n因此，不失一般性，我们可以使用 PC 的 $L$ 个滞后来重构系列。定义 $(L+1) \\\
  times 1$ 向量 $\\boldsymbol{f}_t = (f_t, \\dots, f_{t-L})'$ 和具有行 $\\boldsymbol{b}_j'\
  \ = (\\beta_{j,0}, \\dots, \\beta_{j,L})$ 的 $k \\times (L+1)$ 矩阵 $\\boldsymbol{B}$，我们希望最小化\n\
  \n$\\text{MSE}(\\boldsymbol{f}, \\boldsymbol{B}) = \\frac{1}{Tk} \\sum_{j=1}^k \\\
  sum_{t=1}^T \\left( z_{j,t} - \\sum_{i=0}^L \\beta_{j,i} f_{t-i} \\right)^2 = \\\
  frac{1}{Tk} \\sum_{t=1}^T (\\boldsymbol{z}_t - \\boldsymbol{B f}_t)' (\\boldsymbol{z}_t\
  \ - \\boldsymbol{B f}_t) . \\quad (6.40)$\n\n请注意，即使在非平稳向量时间序列的情况下，该损失函数也定义良好。$T\
  \ + L$ 维向量 $\\boldsymbol{f} = (f_{1-L}, \\dots, f_T)'$ 和 $k \\times (L + 1)$ 矩阵\
  \ $\\boldsymbol{B}$ 的最优选择由以下给出\n\n$(\\widehat{\\boldsymbol{f}}, \\widehat{\\boldsymbol{B}})\
  \ = \\arg \\min_{\\boldsymbol{f} \\in \\mathbb{R}^{T+L}, \\boldsymbol{B} \\in \\\
  mathbb{R}^{k \\times (L+1)}} \\text{MSE}(\\boldsymbol{f}, \\boldsymbol{B}). \\quad\
  \ (6.41)$\n\n显然，如果 $\\boldsymbol{f}$ 是最优的，那么 $\\gamma \\boldsymbol{f} + \\boldsymbol{\\\
  delta}$ 也是最优的。因此，我们可以选择 $\\boldsymbol{f}$ 使得 $\\sum_{t=1-L}^T f_t = 0$ 且 $(1/(T\
  \ + L)) \\sum_{t=1-L}^T f_t^2 = 1$。我们称 $\\widehat{\\boldsymbol{f}}$ 为观测系列 $\\boldsymbol{z}_1,\
  \ \\dots, \\boldsymbol{z}_T$ 的阶数 $L$ 的第一个（可能非平稳）GDPC。请注意，阶数为 0 的第一个 GDPC 对应于数据的第一个常规\
  \ PC。由于\n\n$\\text{MSE}(\\boldsymbol{f}, \\boldsymbol{B}) = \\frac{1}{Tk} \\left[\
  \ \\sum_{t=1}^T \\boldsymbol{z}_t' \\boldsymbol{z}_t - 2 \\sum_{t=1}^T \\boldsymbol{z}_t'\
  \ \\boldsymbol{B} \\boldsymbol{f}_t + \\sum_{t=1}^T \\boldsymbol{f}_t' \\boldsymbol{B}'\
  \ \\boldsymbol{B} \\boldsymbol{f}_t \\right].$\n\n然后\n\n$\\frac{\\partial \\text{MSE}(\\\
  boldsymbol{f}, \\boldsymbol{B})}{\\partial \\boldsymbol{B}} = 0 = - \\sum_{t=1}^T\
  \ \\boldsymbol{f} \\boldsymbol{z}_t' + \\sum_{t=1}^T \\boldsymbol{f} \\boldsymbol{f}_t'\
  \ \\boldsymbol{B}'. \\quad (6.42)$\n\n定义 $\\boldsymbol{F}' = [\\boldsymbol{f}_1,\
  \ \\dots, \\boldsymbol{f}_T]$ 为包含重构数据 $\\boldsymbol{Z}$ 所需的分量所有滞后值的 $(L + 1) \\\
  times T$ 矩阵。等式 (6.42) 意味着\n\n$\\widehat{\\boldsymbol{B}}' = (\\boldsymbol{F}' \\\
  boldsymbol{F}')^{-1} \\boldsymbol{F}' \\boldsymbol{Z}. \\quad (6.43)$\n\n等式 (6.40)\
  \ 对 $f_t$ 的偏导数考虑到所有项 $z_{1,t}, \\dots, z_{j,t+L}$ 都使用 $f_t$ 进行重构，因此方程中会出现 $\\beta_{j,i}$\
  \ 系数的平方和交叉积。可以证明（参见 Peña and Yohai, 2016），$\\widehat{\\boldsymbol{f}}$ 的估计可以写成\n\
  \n$\\widehat{\\boldsymbol{f}} = \\boldsymbol{D}(\\boldsymbol{B})^{-1} \\sum_{j=0}^L\
  \ \\boldsymbol{C}_j(\\boldsymbol{Z}) \\boldsymbol{\\beta}_j, \\quad (6.44)$\n\n\
  其中，平方 $(T + L)$ 矩阵 $\\boldsymbol{D}(\\boldsymbol{B})$ 包含矩阵 $\\boldsymbol{B}$ 元素的交叉积，矩阵\
  \ $\\boldsymbol{C}_j(\\boldsymbol{Z})$ 包含 $\\boldsymbol{Z}$ 的元素，维度为 $(T + L) \\\
  times (L + 1)$。\n\n为了定义计算 $(\\widehat{\\boldsymbol{f}}, \\widehat{\\boldsymbol{B}})$\
  \ 的迭代算法，只需给出一个初始值 $\\boldsymbol{f}^{(0)}$ 和一个规则，描述在已知 $\\boldsymbol{f}^{(h)}$ 时如何计算\
  \ $\\boldsymbol{B}^{(h)}$ 和 $\\boldsymbol{f}^{(h+1)}$。对于等式 (6.43)，给定 $\\boldsymbol{f}^{(h)}$，系数\
  \ $\\boldsymbol{B}^{(h)}$ 可以通过线性回归方法获得\n\n$\\boldsymbol{B}^{(h)} = [\\boldsymbol{F}(\\\
  boldsymbol{f}^{(h)})' \\boldsymbol{F}(\\boldsymbol{f}^{(h)})]^{-1} \\boldsymbol{F}(\\\
  boldsymbol{f}^{(h)})' \\boldsymbol{Z},$\n\n并且根据等式 (6.44)，$\\boldsymbol{f}^{*(h+1)}$\
  \ 按以下方式计算\n\n$\\boldsymbol{f}^{*(h+1)} = \\boldsymbol{D}(\\boldsymbol{B}^{(h)})^{-1}\
  \ \\sum_{j=0}^L \\boldsymbol{C}_j(\\boldsymbol{Z}) \\boldsymbol{\\beta}_j^{(h)},$\n\
  \n并且将分量向量标准化为均值为零、方差为一。\n\n\n\n\n\n初始值 $f^{(0)}$ 可以设置为标准（非动态）第一主成分，并补齐 $L$ 个零。当\n\
  $$\\frac{\\text{MSE}(f^{(h)}, B^{(h)}) - \\text{MSE}(f^{(h+1)}, B^{(h+1)})}{\\text{MSE}(f^{(h)},\
  \ B^{(h)})} < \\varepsilon,$$\n对某个值 $\\varepsilon$ 时，我们停止迭代。\n\n请注意，计算 $f^{(h)},\
  \ B^{(h)}$ 所需逆矩阵的维数与时间序列数量无关，因此我们可以处理大量序列。\n\n第二个GDPC是使用残差 $r_{jt}(1) = z_{jt} -\
  \ \\widehat{z}_{jt}(1)$ 计算的，其中 $\\widehat{z}_{jt}(1)$ 是使用第一个GDPC重构得到的值。这些残差被用作观测数据，并据此计算新的分量。一般来说，如果我们已经计算了第\
  \ $h$ 个GDPC $\\widehat{z}_{jt}(h)$，使用残差 $r_{jt}(h-1)$，那么用于计算下一个 $(h+1)$ 个分量的新数据是\
  \ $r_{jt}(h) = r_{jt}(h-1) - \\widehat{z}_{jt}(h)$。通过这种方式，各分量在所有涉及的滞后阶数上都是不相关的。最后，分量数和滞后数的选择可以如ODPC情况中那样进行。\n\
  \n### 示例 6.6\n\n与示例 6.5 类似，我们直接使用水平值分析 19 个欧元国家的 GDP 序列。我们应用 CRAN 包 `gdpc` 中的程序\
  \ `auto.gdpc`。关于该包的说明，请参见 Peña et al. (2020)。我们使用默认选项运行该程序，其中 GDPC（或动态因子）的数量以及所需的滞后数通过交叉验证选择，如前文所述。选择了一个单一因子，配有\
  \ 10 个滞后，它解释了 99.2% 的变异性。请注意，该因子本身解释的变异性比例大于示例 6.5 中估计的两个因子（94.67%，即 79.72 + 14.95%\
  \ = 94.67%）。图 6.19 显示了该因子，图 6.20 显示了该因子中 11 个滞后（包括滞后零）的系列载荷。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_353_0.png)\n\
  \n图 6.19 EMU 中 19 个国家标准化 logGDP 序列的第一个 GDPC。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_354_0.png)\n\
  \n图 6.20 EMU 中 19 个国家 logGDP 序列具有 10 个滞后的 GDPC 的载荷。\n\n#### 示例 6.6 使用的 R 命令：\n\n\
  ```r\nrequire(gdpc)\nx=as.matrix(EMUdata)\nn=nrow(x)\nG=matrix(0,n,19)\nfor (i in\
  \ 1:19){G[,i]=x[,1+3*(i-1)]}\nG0=log(G)\nG1=scale(G0)\nsal<- auto.gdpc(G1, niter_max=1000)\n\
  sal\n#the summary of the fitted GDPC:\nNumber.of.lags LOO MSE Explained.Variance\n\
  Component 1 10 0.014 0.008 0.992\n#sal[[1]] has the information of the 1st component,\
  \ sal[[2]] of the\n#second component and so on\n> f1<- sal[[1]]$f\n> beta1<- sal[[1]]$beta\n\
  > y1 <- range(f1)\n> tdx <- c(1:76)/4+2000\n> plot(tdx,f1,xlab=\"year\",ylab=\"\
  Dynamic Factor\",\nmain=\"First Dynamic Factor Euro countries\", type=\"l\", ylim=y1)\n\
  > ts.plot(beta1,xlab=\"countries\",ylab=\"beta\",\nmain=\"Loadings for each country\
  \ for different lags\")\n```\n\n## 6.7 DFM中的异常值\n\n### 6.7.1 因子异常值和特有异常值\n\n我们考虑动态因子模型中两种类型的异常值。一种是影响所有或大多数时间序列的因子异常值，另一种是仅影响一个或几个时间序列的特有分量异常值。这两种异常值类似于第\
  \ 4 章中研究的多变量和单变量异常值。然而，通过在估计中纳入动态因子模型的结构，检测程序的功效得到了提高。\n\n设 \\(\\boldsymbol{f}_t\
  \ = (f_{1t}, \\dots, f_{rt})'\\) 为动态因子向量。如果在时间索引 \\(t=o\\) 时，第 \\(j\\) 个动态因子出现因子异常值，即代替\
  \ \\(\\boldsymbol{f}_t\\)，我们有一组潜在因子 \\(\\boldsymbol{f}_t^* = (f_{1t}^*, \\dots,\
  \ f_{rt}^*)'\\)，给定为\n\n\\(\\boldsymbol{f}_t^* = \\boldsymbol{f}_t + \\boldsymbol{w}_j^{(o)}\
  \ I_t^{(o)},\\) \\tag{6.45}\n\n其中 \\(\\boldsymbol{w}_j^{(o)} = (0, \\dots, 0, w_j^{(o)},\
  \ 0, \\dots, 0)'\\) 是第 \\(j\\) 个动态因子中异常值的大小，\\(I_t^{(o)}\\) 是时间 \\(t=o\\) 的指示变量；参见第\
  \ 4 章。方程 (6.45) 中的因子异常值可能根据载荷影响所有时间序列分量。还请注意，同一因子的所有异常值对系列的影响与该因子的载荷成正比。观测时间序列为\n\
  \n\\(\\boldsymbol{z}_t = \\boldsymbol{P}\\boldsymbol{f}_t^* + \\boldsymbol{n}_t\
  \ = \\boldsymbol{P}(\\boldsymbol{f}_t + \\boldsymbol{w}_j^{(o)} I_t^{(o)}) + \\\
  boldsymbol{n}_t = \\boldsymbol{y}_t + \\boldsymbol{P}\\boldsymbol{w}_j^{(o)} I_t^{(o)}\\\
  )\n\n其中 \\(\\boldsymbol{y}_t\\) 是无异常值系列，\\(\\boldsymbol{P}\\boldsymbol{w}_j^{(o)}\
  \ = w_j^{(o)} \\boldsymbol{p}_j\\) 是异常值的影响。\n\n另一方面，特有异常值是单个特有噪声分量中的加法异常值。因此，如果\
  \ \\(\\boldsymbol{n}_t = (n_{1t}, \\dots, n_{kt})'\\) 是特有噪声向量，则在时间 \\(t=i\\) 时，第\
  \ \\(l\\) 个特有噪声分量中出现特有异常值，即代替 \\(\\boldsymbol{n}_t\\)，我们有 \\(\\boldsymbol{n}_t^*\
  \ = (n_{1t}^*, \\dots, n_{kt}^*)'\\)，给定为\n\n\\(\\boldsymbol{n}_t^* = \\boldsymbol{n}_t\
  \ + \\boldsymbol{w}_l^{(i)} I_t^{(i)},\\) \\tag{6.46}\n\n其中 \\(\\boldsymbol{w}_l^{(i)}\
  \ = (0, \\dots, 0, w_l^{(i)}, 0, \\dots, 0)'\\) 是特有异常值的大小，\\(I_t^{(i)}\\) 是 \\(t=i\\\
  ) 的指示变量。方程 (6.46) 中的特有异常值仅影响一个时间序列，因为观测时间序列为\n\n\\(\\boldsymbol{z}_t = \\boldsymbol{P}\\\
  boldsymbol{f}_t + \\boldsymbol{n}_t^* = \\boldsymbol{P}\\boldsymbol{f}_t + (\\boldsymbol{n}_t\
  \ + \\boldsymbol{w}_l^{(i)} I_t^{(i)}) = \\boldsymbol{y}_t + \\boldsymbol{w}_l^{(i)}\
  \ I_t^{(i)}.\\) \\tag{6.47}\n\n因此，时间 \\(t=i\\) 时第 \\(l\\) 个噪声分量中的特有异常值在第 \\(l\\\
  ) 个观测时间序列中产生大小为 \\(w_l^{(i)}\\) 的异常值。\n\n在实践中，观测时间序列 \\(\\{\\boldsymbol{z}_1, \\\
  dots, \\boldsymbol{z}_T\\}\\) 可能受到多个因子和/或特有异常值的存在影响，如下所示\n\n\\(\\begin{aligned}\
  \ \\boldsymbol{z}_t = \\boldsymbol{P}\\left( \\boldsymbol{f}_t + \\sum_{i=1}^F \\\
  boldsymbol{w}_{j_i}^{(o_{j_i})} I_t^{(o_{j_i})} \\right) + \\left( \\boldsymbol{n}_t\
  \ + \\sum_{j=1}^I \\boldsymbol{w}_{l_j}^{(i_j)} I_t^{(i_j)} \\right) \\\\ = \\boldsymbol{y}_t\
  \ + \\sum_{i=1}^F \\boldsymbol{P}\\boldsymbol{w}_{j_i}^{(o_{j_i})} I_t^{(o_{j_i})}\
  \ + \\sum_{j=1}^I \\boldsymbol{w}_{l_j}^{(i_j)} I_t^{(i_j)}, \\end{aligned}\\) \\\
  tag{6.48}\n\n对于 \\(t=1, \\dots, T\\)，其中 \\(\\boldsymbol{w}_{j_1}^{(o_1)}, \\dots,\
  \ \\boldsymbol{w}_{j_F}^{(o_F)}\\) 分别是时间 \\(o_1, \\dots, o_F\\) 时第 \\(j_1\\) 个、...、第\
  \ \\(j_F\\) 个动态因子中的 \\(F\\) 个因子异常值的大小，\\(\\boldsymbol{w}_{l_1}^{(i_1)}, \\dots,\
  \ \\boldsymbol{w}_{l_I}^{(i_I)}\\) 分别是时间 \\(i_1, \\dots, i_I\\) 时第 \\(l_1\\) 个、...、第\
  \ \\(l_I\\) 个特有噪声分量中的 \\(I\\) 个特有异常值的大小。请注意，方程 (6.48) 的表达式足够灵活，可以涵盖诸如一组因子异常值在同一时间点影响不同动态因子，或因子异常值与特有异常值在同一时间点同时出现等情况。这些异常值的影响是在样本协方差矩阵中引入偏差，如果某些异常值较大，这种偏差可能很严重。\n\
  \n### 6.7.2 在动态因子模型中查找异常值的程序\n\nGaleano et al. (2020) 提出了一种用于平稳高维时间序列异常值检测的程序，分为以下五个步骤：\n\
  \n- 1. 对时间序列 \\(\\{x_{1t}^*, \\dots, x_{Tt}^*\\}\\) 进行初步清洗，得到数据 \\(\\{x_{1}^{\\\
  circ}, \\dots, x_{T}^{\\circ}\\}\\)。\n- 2. 使用清洗后的数据获得因子数 \\(r\\)、因子载荷矩阵 \\(P\\)\
  \ 及其正交补矩阵 \\(V\\) 的稳健估计值，分别记为 \\(\\hat{\\tau}\\)、\\(\\hat{P}\\) 和 \\(\\hat{V}\\\
  )。\n- 3. 用 \\(\\hat{V}'\\) 投影时间序列 \\(\\{x_{1t}^*, \\dots, x_{Tt}^*\\}\\) 以检测并清洗系列中的特有异常值，得到时间序列\
  \ \\(\\{x_{1}^{\\Diamond}, \\dots, x_{T}^{\\Diamond}\\}\\)。\n- 4. 用 \\(\\hat{P}'\\\
  ) 投影时间序列 \\(\\{x_{1}^{\\Diamond}, \\dots, x_{T}^{\\Diamond}\\}\\) 以检测并清洗系列中的因子异常值，得到时间序列\
  \ \\(\\{x_{1}^{\\bullet}, \\dots, x_{T}^{\\bullet}\\}\\)。\n- 5. 使用时间序列 \\(\\{x_{1}^{\\\
  bullet}, \\dots, x_{T}^{\\bullet}\\}\\) 再次估计因子载荷矩阵 \\(P\\) 和其正交补矩阵 \\(V\\)，并重复步骤\
  \ 3-5 直到不再发现异常值。\n\n这五个步骤可以自动执行。在该程序的第一步中，通过第 4 章中解释的 Galeano et al. (2006) 程序对观测数据进行初步时间序列清洗。在第二步中，使用步骤\
  \ 1 获得的清洁数据估计因子数 \\(r\\)、载荷矩阵 \\(P\\) 及其正交补 \\(V\\)。在第三步中，检测特有异常值并从观测时间序列 \\(\\\
  {x_{1t}^*, \\dots, x_{Tt}^*\\}\\) 中去除其影响。这是通过使用转换时间序列 \\(z_t = \\hat{V}'x_t^*\\\
  ) 的信息，对每个系列和每个时间点进行特有异常值检验来完成的，\\(t = 1, \\dots, T\\)。在第四步中，我们利用特有异常值已从时间序列 \\(\\\
  {x_{1}^{\\Diamond}, \\dots, x_{T}^{\\Diamond}\\}\\) 中移除这一事实，使用 \\(f_t^{\\Diamond}\
  \ = \\hat{P}'x_t^{\\Diamond}\\)（\\(t = 1, \\dots, T\\)）估计动态因子，其中 \\(\\hat{P}\\)\
  \ 是步骤 2 中获得的 \\(P\\) 的稳健估计值，然后，我们使用单变量时间序列算法检测每个动态因子中的因子异常值。在程序的最后一步中，我们迭代前面的步骤，直到不再发现异常值。\n\
  \n请注意，与第 4 章中的投影程序相比，一个重要的区别是，在这里我们将系列投影在因子空间和正交噪声空间上，而不是将它们投影在极端峰度方向上。动态因子模型引导每种异常值的搜索，而在之前的无模型算法中，我们只是希望从数据中清除严重错误。因此，可以在本节所介绍的算法的步骤\
  \ 1 中应用之前的程序，以对数据进行初步清洗并计算协方差矩阵的稳健估计。\n\n动态因子模型中的异常值最初由 Baragona and Battaglia (2007)\
  \ 研究。Breitung and Eickmeier (2011) 考虑了这些模型中的水平转移或结构性断点，并\n\n\n\nCheng 等 (2016) 提出了水平偏移的收缩估计。DFM\
  \ 中缺失值估计已由 Bai 和 Ng (2019) 研究。\n\n## 6.8 具有聚类结构的 DFM\n\n通常，有些因素会影响所有序列，而其他因素是特定于某组的，且仅影响该组中的部分序列。例如，我们可能有不同经济发展水平的国家群体、相互关联的产业部门以及双边贸易。那么，这些国家的经济时间序列的动态演变可能受到一些反映全球经济演变的一般因素，以及一些依赖于特定组的特定因素的影响。在这种情况下，我们得到一个具有聚类结构的\
  \ DFM（DFMCS）。此类模型已由 Wang (2010)、Hallin 和 Liška (2011)、Lin 和 Ng (2012)、Bonhomme 和\
  \ Manresa (2015)、Su 等 (2016)、Ando 和 Bai (2016, 2017) 以及 Alonso 等 (2020) 等学者研究。\n\
  \n将 $k$ 维时间序列分区为 $z_t = (z'_{1t}, z'_{2t}, \\dots, z'_{ct})'$，其中 $z_{it}$ 是一个满足\
  \ $\\sum_{i=1}^c k_i = k$ 的 $k_i$ 维时间序列。换句话说，我们有 $c$ 个时间序列聚类，第 $i$ 个聚类包含 $k_i$ 个时间序列。DFMCS\
  \ 可以写为\n\n$$\nz_t = P_0 f_{0t} + \\sum_{i=1}^c P_i f_{it} + n_t, \\quad (6.49)\n\
  $$\n\n其中 $n_t$ 是噪声向量，$f_{0t} = (f_{01t}, \\dots, f_{0r_0 t})'$ 是一个 $r_0$ 维的全局因素向量，$P_0$\
  \ 是一个 $k \\times r_0$ 的全局载荷矩阵。$f_{it} = (f_{i,1t}, \\dots, f_{i,r_i t})'$ 是第 $i$\
  \ 个聚类的 $r_i$ 维共同因子，$P_i$ 是第 $i$ 个聚类的 $k \\times r_i$ 载荷矩阵，满足 $P_i = [0'_{i-1}, w'_i,\
  \ 0'_{c-i}]'$，其中 $0_{i-1}$ 是当 $i > 1$ 时维度为 $(\\sum_{j=1}^{i-1} k_j)$ 行乘以 $r_i$ 列的零矩阵，$w_i$\
  \ 是第 $i$ 个聚类的 $k_i \\times r_i$ 载荷矩阵，而 $0_{c-i}$ 是当 $i < c$ 时另一个维度为 $(\\sum_{j=i+1}^c\
  \ k_j)$ 行乘以 $r_i$ 列的零矩阵。这样一来，$P_i f_{it}$ 仅影响第 $i$ 个聚类中的时间序列。因素总数为 $r = r_0 + r_1\
  \ + \\dots + r_c$。\n\nWang (2010) 研究了等式 (6.49) 中 DFMCS 的识别问题，所需条件为：(1) $P'_0 P_0\
  \ = I_{r_0}$，其中 $I_{r_0}$ 是阶数为 $r_0$ 的单位矩阵；(2) 对于 $i = 1, \\dots, c$，$P'_i P_i =\
  \ w'_i w_i = I_{r_i}$；(3) $P'_0 P_i = 0_{r_0 \\times r_i}$；以及 (4) $r = \\sum_{j=1}^c\
  \ r_j$ 个因素的协方差矩阵为对角矩阵。另需注意，按定义，当 $i \\neq j$ 时，$P'_i P_j = 0_{r_i \\times r_j}$。我们可以将该模型写为标准\
  \ DFM。令 $f_t = (f'_{0t}, f'_{1t}, \\dots, f'_{ct})'$，以及 $P = [P_0 | P_1 | \\dots\
  \ | P_c]$，则有\n\n$$\nz_t = P f_t + n_t, \\quad (6.50)\n$$\n\n前述条件意味着通常的识别限制 $P'P\
  \ = I_r$。\n\n特异项与因素的假设与先前相同。特异项或噪声 $n_t = (n_{1t}, \\dots, n_{kt})'$ 是一个一般平稳时间序列序列，均值为\
  \ $0_k$，并具有如 ADFM 一般的弱序列相关性。全局因素和特定因素彼此正交，并遵循对角 VARMA。此外，我们假设因子模型中出现的两个创新过程在所有滞后阶数上均不相关。然而，聚类的数量及序列归属各聚类的分配是未知的。\n\
  \nDFMCS 的估计需要获得以下参数：(1) 全局因素的数量 $r_0$，组的数量 $c$，以及每个 $c$ 个组中的特定因素数量 $r_1, \\dots,\
  \ r_c$；(2) 标签变量 $g_i \\in \\{1, \\dots, c\\}$，指示序列属于哪个组，我们称 $G$ 为分量为 $g_i$（$i =\
  \ 1, \\dots, k$）的 $k \\times 1$ 向量；(3) 全局和特定因素的载荷矩阵 $P_0, P_1, \\dots, P_c$ 以及这些因素的时间序列\
  \ $f_{0t}, f_{1t}, \\dots, f_{ct}$。在得到估计的因素和噪声，其中 $\\hat{n}_t = z_t - \\hat{P} f_t$\
  \ 后，可以获得因素和噪声的标量 ARMA 模型参数的估计量。\n\n### 6.8.1 拟合 DFMCS\n\n我们考虑的程序包含以下三个步骤：\n\n- 1.\
  \ 使用所有时间序列估计一组初始因素及其载荷，并用于构建每个时间序列的共同分量。然后，使用第 5 章提出的广义交叉相关（GCC）方法对这些共同分量进行基于依赖性的聚类，以找到各组。\n\
  \n- 2. 在上一步找到的每组时间序列中估计一组新的因素及其载荷。将各组中发现的所有因素以及第 1 步中发现的因素进行比较，并分类为全局因素或特定因素；\n\n\
  - 3. 从每个时间序列中移除全局因素的影响，并使用得到的组特异残差重新估计特定因素。最后，检查各组是否可能重新组合。\n\n在第一步中，因素和载荷的初始估计是通过对时间序列的样本协方差矩阵\
  \ $\\hat{\\Gamma}_z(0)$ 应用主成分分析（PCA）进行的。如我们所见，与该矩阵 $r_*$ 个最大特征值相关的特征向量为因素载荷矩阵 $\\\
  hat{P}$ 提供了估计，其列为 $\\hat{p}_1 \\dots \\hat{p}_{r_*}$。因素数量 $r_*$ 通过使用 Ahn 和 Horenstein\
  \ (2013) 提出的检验来确定，该检验基于矩阵 $\\hat{\\Gamma}_z(0)$ 连续特征值的比率。需要注意的是，矩阵 $\\hat{P}$ 预计应包含所有全局因素以及部分（或全部）组特异因素，因此该矩阵中的因素数量\
  \ $r_*$ 通常大于全局因素的真实数量 $r_0$。此外，在实际应用中，当因素的强度程度不同时，如果对特征值比率检验应用两次——首先检测少数几个主导因素，然后寻找其他因素——结果通常会更好，正如\
  \ Lam 和 Yao (2012) 所建议的。随后，因素通过 $\\hat{f}_{it} = \\hat{p}'_i z_t$ 估计，其中 $i = 1,\
  \ \\dots, r_*$，共同分量通过 $\\mathbf{f}_t = \\hat{\\mathbf{P}} \\hat{\\mathbf{p}}' \\\
  mathbf{z}_t$ 估计。\n\n现在，通过对使用 GCC 计算的离散矩阵应用单链接层次聚类算法来构建各组。聚类数量是通过对轮廓（Silhouette）算法进行修改获得的，增加了聚类必须具有最小大小的限制。我们通过在树状图分析中省略与其余序列具有相对较小依赖性的时间序列（例如，树状图合并的\
  \ 90% 分位数）来实现这一限制。一旦各组形成，被省略的时间序列会在单链接意义上被分配到最近的聚类。这样一来，我们得到了组数量 $c$ 的估计值，以及向量 $G$\
  \ 的估计器，该向量给出了序列到 $c$ 个组的分配。\n\n在第二步中，我们使用上一步找到的各组中的序列来估计新的因素集及其载荷。设 $r^s_1, \\dots,\
  \ r^s_c$ 为通过对各组时间序列样本协方差矩阵的特征值应用 Ahn 和 Horenstein (2013) 检验而在每个组中找到的因素数量。特定载荷矩阵\
  \ $\\widehat{P}_i$（维度为 $k \\times r^s_i$，列为 $\\widehat{p}_{i1}, \\dots, \\widehat{p}_{ir^s_i}$）是通过在\
  \ $i$ 个组中对应于最大 $r^s_i$ 个特征值的特征向量上添加一组不属于该组的观测值的零值来构建的。各组中的因素通过 $\\widehat{f}^s_{ij,t}\
  \ = \\widehat{p}'_{ij} z_t$ 估计，其中 $j = 1, \\dots, r^s_i$。这些组因素预计包含所有特定因素以及部分（或全部）全局因素。\n\
  \n接下来，为了决定某个因素是全局因素还是特定因素，我们将第 1 步中找到的 $r_*$ 个因素集与第二步中找到的 $\\sum_{i=1}^c r^s_i$\
  \ 个因素集进行比较。需要注意的是，第一个集合中的因素可能是第二个集合中因素的旋转，因此并不明显哪些应被分类为全局因素，哪些应被分类为特定因素。因此，我们首先通过应用以下三条简单规则来决定第一个\
  \ $r_*$ 个因素集中的每个因素 $f_t$ 是全局因素还是特定因素：\n\n- 1. 如果 $f_t$ 不属于第二个因素集中的任何因素，则它是全局因素。\n\
  \n- 2. 如果 $f_t$ 仅属于第二个因素集中的一个因素集，则它是该组中的特定因素。\n\n- 3. 如果 $f_t$ 属于第二个因素集中的多个因素集，则它是全局因素。\n\
  \n我们通过计算因素 $f_t$ 与该组中因素 $\\widehat{f}^s_{i1,t}, \\dots, \\widehat{f}^s_{ir^s_i,t}$（$i\
  \ = 1, \\dots, c$）之间的经验典型相关性来决定因素 $f_t$ 是否属于一组特定因素。当因素 $f_t$ 与该组元素的经验典型相关性高于某个阈值\
  \ $\\rho_0$ 时，我们说 $f_t$ 属于该组。阈值 $\\rho_0 = 0.9$ 在我们的蒙特卡罗练习中似乎效果良好。随后，我们检查带有 $r^s_1,\
  \ \\dots, r^s_c$ 个因素的任何组是否包含不属于第 2 步中找到的因素集的任何因素。如果是这种情况，则该因素被分类为相应组中的特定因素。\n\n\
  在第三步中，我们计算残差 $v_t = z_t - \\widehat{P}_0 \\widehat{f}_{0t}$，其中 $\\widehat{f}_{0t}$\
  \ 是在第 3 步中获得的估计全局因素向量，$\\widehat{P}_0$ 是这些因素对应的载荷矩阵，并使用对应于每个组的系列 $v_{it}$ 重新估计特定因素。然后，我们验证所获得的组是由于不同的特定因素而非全局因素中因素载荷的差异所致。这是通过检查所有组是否至少包含一个特定因素来完成的。我们可能面临以下情况：(1)\
  \ 找到的所有 $c$ 个组均至少包含一个特定因素，我们得到一个具有 $c$ 个组的 DFMCS；(2) $c_1$ 个组（$1 \\le c_1 < c$）包含特定因素，而\
  \ $c_2 = c - c_1$ 个组仅包含全局因素，那么我们得到一个具有 $c_1 + 1$ 个组的 DFMCS；以及 (3) 所有组仅包含全局因素，那么我们得到标准\
  \ DFM。\n\n为了证明这一最后验证，即检查各组是由不同的特定因素生成而非全局因素的不同载荷所致，请考虑下面的简单模型\n\n$$\n\\begin{bmatrix}\
  \ z_{1t} \\\\ z_{2t} \\end{bmatrix} = \\begin{bmatrix} a \\mathbf{1}_{k_1} \\\\\
  \ b \\mathbf{1}_{k_2} \\end{bmatrix} f_t + \\begin{bmatrix} n_{1t} \\\\ n_{2t} \\\
  end{bmatrix},\n$$\n\n其中 \\(z_{it}\\) 是 \\(k_i \\times 1\\)，且 \\(k = k_1 + k_2\\\
  )，而 \\(\\mathbf{1}_{k_i} = (1, \\dots, 1)'\\) 也是 \\(k_i \\times 1\\)。在此模型中，存在两个具有相似依赖性的时间序列组。为简化起见，\n\
  \n\n假设噪声是 i.i.d. 的，具有相同的方差 \\(\\sigma^2\\)，并令 \\(s = \\text{Var}(\\hat{f}_t)/\\\
  sigma^2\\) 为信噪比。那么，第一组和第二组系列中任何两个变量的互相关分别为 \\(r_1 = a^2s/(1+a^2s)\\) 和 \\(r_2 =\
  \ b^2s/(1+b^2s)\\)，而不同组别系列之间的相关性为 \\(r_{12} = abs/\\sqrt{(1+a^2s)(1+b^2s)}\\)。因此，如果\
  \ \\(a\\) 与 \\(b\\) 相差很大，聚类应该能够检测出两组时间序列。\n\n最后，给定估计的因子、载荷 (\\(\\hat{\\boldsymbol{P}}_0\\\
  hat{\\boldsymbol{f}}_{0t}, \\hat{\\boldsymbol{P}}_1\\hat{\\boldsymbol{f}}_{1t},\
  \ \\dots, \\hat{\\boldsymbol{P}}_c\\hat{\\boldsymbol{f}}_{ct}\\)) 和组别，我们可以为因子估计\
  \ AR 模型，并计算残差或特殊分量 \\(\\hat{\\boldsymbol{n}}_t = \\boldsymbol{z}_t - \\hat{\\boldsymbol{P}}_0\\\
  hat{\\boldsymbol{f}}_{0t} - \\sum_{i=1}^c \\hat{\\boldsymbol{P}}_i\\hat{\\boldsymbol{f}}_{it}\\\
  )，并对它们拟合 AR(\\(p\\)) 模型。\n\n### 示例 6.7\n\n我们分析了 ISO 新英格兰电力市场从 2004 年 1 月到 2016 年\
  \ 12 月的逐日前瞻小时需求数据集。该数据集在文件 `PElectricity1344.csv` 中可用，并在示例 2.1 中介绍。新英格兰地区分为八个负荷区：康涅狄格州\
  \ (CT)、缅因州 (ME)、新罕布什尔州 (NH)、罗得岛州 (RI)、佛蒙特州 (VT)、马萨诸塞州东北部和波士顿 (NEMA)、马萨诸塞州东南部 (SEMA)\
  \ 以及马萨诸塞州西部/中部 (WCMA)。\n\n每个时间序列 \\(D_{it}\\)，其中 \\(1 \\le i \\le 1344\\) 且 \\(1\
  \ \\le t \\le 678\\)，对应于八个地区中的某一个在一周中某一天的 24 小时中的某一小时的电力需求，即我们共有 \\(8 \\times 24\
  \ \\times 7 = 1344\\) 个时间序列。每个系列中的点数为 \\(T=678\\)，对应于 13 年中大约 52 周。这些系列需要进行季节性差分和对数变换才能变得平稳（见\
  \ García-Martos 和 Conejo, 2013）。此外，由于系列中有些值为负数，我们在对所有数据取对数变换前加上 15，分析的系列为 \\(z_{it}\
  \ = \\nabla_7 \\log(D_{it} + 15)\\)。\n\n图 6.21 显示了对数化并进行差分后的系列图。示例 2.1 中展示了更多系列图。这些图中显示了一些明显的离群值\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_360_0.png)\n\n图 6.21 新英格兰地区 13 年间 1344\
  \ 个周系列电力价格的时间序列图。\n\n图，并为了说明离群值检测的重要性，我们用原始时间序列 \\(z_{it}\\) 总结了聚类解，以便与使用离群值校正时间序列\
  \ \\(z_{it}^c\\) 获得的结果进行比较。使用 Ahn 和 Horenstein 的两步法对原始系列 \\(z_{it}\\) 选取了三个因子，并且很明显\

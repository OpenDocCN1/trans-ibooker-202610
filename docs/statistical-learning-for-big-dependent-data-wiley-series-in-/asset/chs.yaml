- "# 9 时空相关数据\n\n相关数据以多种方式出现，最常见的是随时间采集的观测数据，这些数据一直是前几章的主要关注点。在这里，我们转向另一种常见的相关数据类型，即在空间不同位置采集的观测数据。空间可以是地理空间、社会经济空间或网络空间。例如，考虑一个给定的地理区域，如加利福尼亚州或美国中西部。2019年10月1日加利福尼亚州各县的日平均气温，以及2020年1月1日上午8:00美国中西部所有监测站的PM2.5测量值，是空间相关数据的两个示例。这些数据被称为空间数据。令\
  \ $s_i$ 表示空间中的第 $i$ 个位置，例如 $s_i = (\\text{纬度}_i, \\text{经度}_i)$，并令 $t_{ij}$ 表示在位置\
  \ $s_i$ 处采集的第 $j$ 个数据点的时间。我们可以将数据表示为 $z(s_i, t_{ij})$。\n\n最简单的空间数据是那些对所有位置 $s_i$\
  \ 的 $t_{ij}$ 相同的数据，可以写为 $\\{z(s_i)|i = 1, ..., m\\}$，其中 $m$ 是研究的位置数量。这种数据可以被视为感兴趣变量在空间上的快照。另一方面，假设在每个位置\
  \ $s_i$ 上我们有多个观测值，那么观测值采集的时间点就变得重要，我们可以将数据集合表示为 $\\{z(s_i, t_{ij})|i = 1, ..., m;\
  \ j = 1, ..., n_i\\}$，其中 $n_i$ 是一个正整数，表示位置 $s_i$ 的样本量。这种数据被称为时空（S-T）数据。如果对所有 $i$\
  \ 都有 $t_{ij} = t_j$ 且序列 $\\{t_j\\}$ 是等距时间点，那么数据 $\\{z_{t_i} = [z(s_1, t_j), z(s_2,\
  \ t_j), ..., z(s_m, t_j)]'\\}$ 类似于第3章讨论的m维向量时间序列。总体而言，对于大多数S-T数据，$s_i$ 可以在空间上不规则分布，$\\\
  {t_{ij}\\}$ 可以在时间上不规则分布。\n\n对S-T数据的分析在文献中有着悠久的历史，该主题有几本优秀的书籍可供参考。有兴趣的读者可参阅 Cressie\
  \ (1993)、Cressie 和 Wikle (2011)、Diggle (2013) 以及 Wikle et al. (2019)。位置 $s = s_i$\
  \ 和时间 $t = t_{ij}$ 处的S-T数据 $\\{z(s_i, t_{ij})\\}$ 是S-T随机过程 $\\{Y(s, t)\\}$ 的实现。通常，$s\
  \ \\in \\mathbb{R}^d$，其中 $d=2$ 或 $d=3$。在本章中，我们简要研究这些过程的性质及S-T数据的分析。我们的目标是向读者介绍这一重要主题，探索空间和S-T数据的特征，并展示其应用。为此，我们充分利用了\
  \ Wikle et al. (2019) 的最近著作及其配套的 R 程序包 STRbook。我们还利用了几个用于空间-时序数据分析的有用 R 程序包，如 sp、gstat、SpatPCA、autoFRK\
  \ 和 SpatioTemporal。\n\n与多元或高维时间序列分析类似，研究S-T数据的目标包括（a）空间预测（包括平滑和滤波）、（b）时间预测，以及（c）理解各种S-T过程之间的关系。然而，S-T分析与多元时间序列分析之间存在一些差异。在S-T分析中，人们通常希望在没有可用数据的位置对感兴趣变量进行预测。例如，有人可能希望评估一所附近没有监测站的小学附近的PM2.5测量值。另一方面，这两种分析共享相同的基本概念和统计基础。\n\
  \n## 9.1 时空数据的示例与可视化\n\n首先，我们考虑一些S-T数据的示例，包括两个来自 Wikle et al. (2019) 的数据集，可在 Zammit-Mangion\
  \ (2018a) 的 R 程序包 STRbook 中获得。这些数据集将在本章中用于演示S-T分析。\n\n- 1. NOAA每日天气数据: 原始数据来自美国国家海洋和大气管理局（NOAA）国家气候数据中心，可从哥伦比亚大学的IRI/LDEO气候数据库获取。¹\
  \ 遵循 Wikle et al. (2019)，我们考虑四个变量：日最高气温（Tmax）、最低气温（Tmin）和露点温度（TDP），单位均为华氏度（°F），以及美国中部138个气象站（介于32°N–46°N和80°W–100°W之间）的降水量（英寸），记录年份为1990年至1993年（含首尾）。我们将此数据集称为NOAA数据集，可直接从STRbook程序包获取。\n\
  \n- 2. 海表温度异常: 这些海表温度（SST）异常数据来自NOAA气候预测中心，也可从哥伦比亚大学的IRI/LDEO气候数据库获取。² 数据以2°×2°分辨率分格，范围从124°E–70°W到30°S–30°N，表示相对于1970年1月至2003年12月气候学（时间平均）的月度异常值。同样，此数据集来自STRbook程序包。\n\

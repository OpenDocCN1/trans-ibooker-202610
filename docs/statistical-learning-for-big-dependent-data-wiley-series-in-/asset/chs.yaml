  > text(tree.fit, cex=0.5)\n```\n\n### 8.1.4 随机森林\n\nRF 是另一种用于分类和回归的集成方法。如在第 7 章中关于提升方法所见，集成方法结合不同的过程或算法，以获得优于任何单一组成算法所得预测的结果，例如在模型平均法中。RF\
  \ 是对装袋法（自助聚合）的扩展，用于避免基于树的方法中的过拟合。该方法由 Ho (1995) 提出，并由 Breiman (2001) 发展成为合适的统计工具。下面的讨论侧重于预测。基本上，随机森林使用许多简单的树来生成预测，然后结合这些预测以提供一致预测。该方法是非参数的，因为它不对底层数据假设任何特定模型。\n\
  \n再次考虑数据集 \\(\\{(x_t, y_t)|t = 1, ..., n\\}\\)，其中 $x_t$ 是预测变量 $X_t = (X_{1t}, ...,\
  \ X_{kt})'$ 的一个实现，$y_t$ 是因变量 $Y_t$ 的一个实现。目标是预测 $y_{t+h}$，其中 $h$ 为预测步距。在讨论随机森林之前，我们下面给出\
  \ _自助聚合_ 方法：\n\n- 1. 从数据集中抽取有放回的随机样本。将自助样本表示为 \\(\\{(x^*_t, y^*_t)|t = 1, ..., n\\\
  }\\)。\n- 2. 使用自助样本构建回归树，以获得对 $y_{t+h}$ 的预测。\n\n通过多次重复上述自助程序，可得到一组自助预测，进而可用于获取 $y_{t+h}$\
  \ 的一致预测。\n\n随机森林通过引入一种新想法来扩展装袋法，以充分探索 $y_{t+h}$ 与 $x_t$ 之间的关系。其思想是，对每个树分割，随机选取 $g$\
  \ 个预测变量作为分割的候选变量。令 $g$ 为满足 $1 \\leq g \\leq k$ 的正整数。通常使用 $g = \\lfloor k/3 \\rfloor$。为了从自助样本为随机森林构建回归树，从\
  \ $\\{1, ..., k\\}$ 中随机选取 $g$ 个预测变量，作为每次分割的候选变量。这一新步骤服务于多个目的。首先，它降低了计算强度，尤其是在 $k$\
  \ 很大时。其次，它缓解了预测变量之间的多重共线性，因为高度相关的预测变量可能不会被共同选中。最后，它避免了在集成中使用相似树的可能性。通常使用自助预测的简单平均值来生成一致预测。在给定损失函数下，也可以使用加权平均值。\n\
  \n**讨论**：有必要对随机森林进行一些讨论。首先，可以使用 R 包 **randomForest** 进行随机森林预测。请参见下面的演示。其次，为了有效地将随机森林应用于相关数据，需要进行一些修改。例如，在时间序列分析中，因变量的滞后\
  \ 1 期值通常比滞后 2 期值更重要。同样，因变量的季节性滞后在建模季节性时间序列时通常也很重要。因此，可以使用加权随机样本来选择每次分割的 $g$ 个预测变量作为候选变量，而不是使用纯随机样本。第三，在为相关数据绘制自助样本时必须小心，并应使用某种形式的块自助法；例如，参见\
  \ Alonso et al. (2004) 和 Lahiri (2013)。\n\n### 示例 8.2\n\n为演示随机森林的用法，我们还使用示例 8.1\
  \ 中使用的月度宏观经济数据。同样，因变量是美国月度\n\n\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_447_0.png)\n\
  \n**图 8.2** 将RFs应用于月度宏观经济数据的结果，以IP指数增长率作为因变量。使用了500棵树和 mtry = 20。\n\nIP指数和预测变量均为所有可用变量的滞后1期至滞后6期值。因此，n\
  \ = 704，k = 732。预测变量已标准化。我们运行两次 randomForest 命令以展示在每棵树分割中选择预测变量数量的影响。子命令 ntree 用于指定使用的树的数量，子命令\
  \ mtry 是每次分割中使用的预测变量数量。即，在我们的记法中为 g。我们使用默认选项，使树在生长时受到约束，即每个叶节点中的数据点数不能少于 5。另一种方法是指定树最多可以拥有的叶节点数量。分别参见\
  \ randomForest 的子命令 nodesize 和 maxnodes。\n\n使用 500 棵树和 mtry = 20 时，RFs 解释了因变量 23.92%\
  \ 的变异性。图 8.2 显示了使用的树的数量与 MSE 的关系，而图 8.3 显示了每个预测变量的 MSE 平均下降量。从\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_447_1.png)\n\
  \n**图 8.3** 月度宏观经济数据中每个预测变量的 MSE 平均下降量，以IP指数增长率作为因变量。使用了500棵树和 mtry = 20。\n\n从图\
  \ 8.2 可以看出，MSE 随使用的树的数量迅速下降。如果将 mtry 增加到 30，则 RFs 解释了因变量约 24.47% 的变异性。在这个特定示例中，mtry\
  \ 的选择似乎不敏感。\n\n### R 演示：随机森林\n\n```\n> require(randomForest)\n> set.seed(117)\n\
  > rf.fit <- randomForest(X1,Y,ntree=500,mtry=20,importance=TRUE)\n> rf.fit\nCall:\
  \ randomForest(x=X1,y=Y,ntree=500,mtry=20,importance=TRUE)\n   Type of random forest:\
  \ regression\n      Number of trees: 500\nNo. of variables tried at each split:\
  \ 20\n\n      Mean of squared residuals: 4.19353e-05\n         % Var explained:\
  \ 23.92\n> plot(rf.fit)\n> dim(rf.fit$importance)\n[1] 732   2\n> plot(1:732,rf.fit$importance[,2],ylab=\"\
  mean decrease in MSE\")\n> set.seed(117)\n> rf.fit <- randomForest(X1,Y,ntree=500,mtry=30,importance=TRUE)\n\
  > rf.fit\nCall: randomForest(x=X1,y=Y,ntree=500,mtry=30,importance=TRUE)\n   Type\
  \ of random forest: regression\n      Number of trees: 500\nNo. of variables tried\
  \ at each split: 30\n\n      Mean of squared residuals: 4.163187e-05\n         %\
  \ Var explained: 24.47\n```\n\n## 8.2 神经网络\n\nNNs（或人工神经网络）是一种半参数学习方法，模仿人脑处理信息。网络由多个节点层组成，这些节点也称为神经元。网络的第一层是输入层，每个预测变量作为一个节点。最后一层是输出层，包含与因变量维度相同数量的节点。所有中间神经元层称为隐藏层。在前馈网络中，信息从输入层流向第一个隐藏层，然后流向第二个隐藏层，依此类推，直到到达输出层。因此，信息只通过每个神经元一次。对于循环网络，允许从后层到前层的反馈，或从一个神经元回到其自身。或者，循环网络意味着信息处理可能多次经过同一层。前馈\
  \ NNs 也称为感知机。参见图 8.4，它是一个 P − m − k NN。\n\nNN 试图使用一组解释变量来近似响应函数。它依赖于普逼近理论，该理论指出，在响应函数满足某些光滑性条件下，可以提供适当的\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_449_0.png)\n\n用某些激活函数和网络结构进行近似。确实，已经有许多方法来获得普逼近函数。例如，我们可以使用多项式、根据泰勒定理或正弦函数（如傅里叶分析中）来近似区间上的任何连续函数。Kolmogorov\
  \ (1957) 表明，m 个变量的所有连续函数都可以用少量单变量函数的有限叠加和复合来很好地近似。NNs 不是寻找每个变量的函数，而是搜索所有输入变量线性组合的函数的近似。Cybenko\
  \ (1989) 和 Hornik 等人 (1989) 证明，m 个实变量的任何连续函数都可以通过变量的有限线性组合的复合来很好地近似，这意味着，具有单个隐藏层（任意宽度，即大量神经元或节点）的前馈\
  \ NN 可以以任何给定精度近似任何连续函数。\n\n用于处理网络中一层到下一层信息的函数称为激活函数。不同层可以使用不同的函数，尽管除了输出层外，通常使用相同的激活函数。单层\
  \ NN 的普逼近性质对任何非多项式激活函数都有效。输出层的激活函数由因变量是连续还是离散决定。详情后文介绍。文献中提出了许多激活函数，但以下函数常用于传统 NN。第\
  \ 8.3.3 节提供了一些用于深度学习或机器学习的其他函数。\n\n- 1. Logistic 函数（或 Sigmoid 函数）：\n\n```\n$$g(x)\
  \ = \\frac{1}{1 + \\exp(-x)} = \\frac{\\exp(b + \\sum_{i=1}^m w_i x_i)}{1 + \\exp(b\
  \ + \\sum_{i=1}^m w_i x_i)},$$\n```\n\n其中 \\( x = (x_1, \\dots, x_m)' \\)，m 为前一层的节点数，\\\
  ( b \\) 称为 *偏置*，\\( w_i \\) 为权重。该函数是逻辑回归中使用的函数，它将实线上的连续变量转换为 0 到 1 之间的变量。\n\n- 2.\
  \ 双曲正切（tanh）：\n\n$g(x) = \\frac{\\sinh(x)}{\\cosh(x)} = \\frac{\\exp(x) - \\exp(-x)}{\\\
  exp(x) + \\exp(-x)}$\n\n其中 $\\exp(x) = \\exp(b + \\sum_{i=1}^m w_i x_i)$ 与之前相同，偏置为\
  \ $b$，权重为 $w_i$。\n\n- 3. Heaviside 函数：\n\n$g(x) = \\begin{cases} 0, & \\text{if\
  \ } b + \\sum_{i=1}^m w_i x_i \\le 0, \\\\ 1, & \\text{if } b + \\sum_{i=1}^m w_i\
  \ x_i > 0. \\end{cases}$\n\n当因变量为二元时，Heaviside 函数用于输出层。另一方面，如果因变量是连续的，则通常使用线性函数作为输出层。我们将\
  \ NNs 称为半参数学习方法，因为一旦给定激活函数和网络结构，网络就成为由偏置和权重组成的具有未知参数的非线性统计模型。图 8.5 比较了 sigmoid 和\
  \ tanh 激活函数。第一个产生的输出数可以是正或负，而第二个总是给出正数。\n\n### 8.2.1 网络训练\n\n网络训练是估计给定网络的偏置和权重。这通常通过使用可用数据优化某个目标函数（或最小化某个损失函数）来完成。在实践中，人们通常将数据集\
  \ $\\{(\\mathbf{x}_t, y_t)|t = 1, ..., n\\}$ 划分为训练子样本和验证子样本。对于独立数据，训练子样本可以通过从数据集中不放回地随机抽取选择，剩余观测值构成验证子样本。例如，设\
  \ $n_1$ 为小于 $n$ 的正整数。可以从 $\\{1, ..., n\\}$ 中不放回地均匀抽取 $n_1$ 个观测值，例如 $\\{i_1, ...,\
  \ i_{n_1}\\}$。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_450_0.png)\n\n**图 8.5**\
  \ Logistic（绿色）和 tanh（红色）激活函数。\n\n然后，使用 \\(\\{(\\mathbf{x}_t, y_t)|t=i_1, \\dots,\
  \ i_{n_1}\\}\\) 作为训练子样本。另一方面，对于序列相关数据，通常使用前 \\(n_1\\) 个观测值作为训练子样本。\n\n接下来，我们简要讨论前馈\
  \ \\(P-M-K\\) 网络的训练，该网络有 \\(P\\) 个输入节点、一个包含 \\(M\\) 个节点的单隐藏层和 \\(K\\) 个输出节点。参见 Hastie\
  \ 等人 (2001)。该网络也称为 \\(P-M-K\\) 感知机。将输入表示为 \\(\\mathbf{x}_t=(x_{1t}, \\dots, x_{Pt})'\\\
  )，输出表示为 \\(\\mathbf{y}_t=(y_{1t}, \\dots, y_{Kt})'\\)，隐藏层输出向量表示为 \\(\\mathbf{h}_t=(h_{1t},\
  \ \\dots, h_{Mt})'\\)。我们可以写出网络模型如下：\n\n\\(h_{mt}=g(w_{m0}+\\boldsymbol{w}'_m\\mathbf{x}_t),\\\
  quad m=1, \\dots, M,\\) (8.4)\n\n\\(q_{vt}=\\beta_{v0}+\\boldsymbol{\\beta}'_v\\\
  mathbf{h}_t,\\quad v=1, \\dots, K,\\) (8.5)\n\n\\(y_{vt}\\equiv f_v(\\mathbf{x}_t)=g_v(\\\
  mathbf{q}_t),\\quad v=1, \\dots, K,\\) (8.6)\n\n其中 \\(g(.)\\) 和 \\(g_v(.)\\) 是激活函数，\\\
  (w_{m0}\\) 和 \\(\\boldsymbol{w}_m=(w_{m1}, \\dots, w_{mP})'\\) 是与隐藏层第 \\(m\\) 个神经元相关的偏置和权重，\\\
  (\\beta_{v0}\\) 和 \\(\\boldsymbol{\\beta}_v=(\\beta_{v1}, \\dots, \\beta_{vM})'\\\
  ) 分别是第 \\(v\\) 个输出神经元的偏置和权重，\\(\\boldsymbol{q}_t=(q_{1t}, \\dots, q_{Kt})'\\)。从统计学角度看，该模型可以解释为非线性因子模型，其中原始的\
  \ \\(P\\) 个解释变量被组合以创建 \\(M\\) 个线性组合或因子。然后以非线性方式转换每个因子以创建新的解释变量 \\(h_{mt}\\)，而 \\\
  (K\\) 个响应变量是这些新变量 \\(h_{nt}\\) 的线性组合的函数。此外，通过将输入变量重新定义为 \\(\\mathbf{x}_t=(1, x_{1t},\
  \ \\dots, x_{Pt})'\\) 并将隐藏节点重新定义为 \\(\\mathbf{h}_t=(1, h_{1t}, \\dots, h_{Mt})'\\\
  )，可以将偏置并入权重中。Eq. (8.6) 的函数 \\(f_{v(.)}\\) 用于表示第 \\(v\\) 个输出变量作为 \\(\\mathbf{x}_t\\\
  ) 函数的基础函数。对于连续因变量 \\(\\mathbf{y}_t\\)，\\(g_v(.)\\) 通常假设为线性函数 \\(g_v(\\mathbf{q}_t)=q_{vt}=\\\
  beta_{v0}+\\boldsymbol{\\beta}'_v\\mathbf{h}_t\\)。对于离散变量（如分类），\\(g_v(.)\\) 通常假设为多元\
  \ Logit 模型，即\n\n\\(f(\\mathbf{x}_t)=\\arg \\max_{1 \\le v \\le K} \\hat{f}_v(\\\
  mathbf{x}_t),\\) (8.7)\n\n其中 \\(\\hat{f}_v(.)\\) 表示 \\(f_v(.)\\) 在训练子样本中的拟合值，\\\
  (f(.)\\) 表示基础模型。在这种情况下，给定 \\(g(.)\\) 和 \\(g_v(.)\\)，网络包含以下参数：\n\n\\(\\{(\\boldsymbol{w}_{m0},\
  \ \\boldsymbol{w}_m|m=1, \\dots, M): M(P+1) \\text{ parameters},\\) (8.8)\n\n\\\
  (\\{(\\beta_{v0}, \\boldsymbol{\\beta}_v|v=1, \\dots, K): K(M+1) \\text{ parameters}.\\\
  ) (8.9)\n\n设 \\(\\boldsymbol{\\theta}\\) 为所有参数（偏置和权重）的集合。对于连续因变量 \\(\\mathbf{y}_t\\\
  )，通常使用平方误差损失函数\n\n\\(L(\\boldsymbol{\\theta})=\\sum_{v=1}^K \\sum_{t=1}^{n_1} [y_{vt}-f_v(\\\
  mathbf{x}_t)]^2,\\) (8.10)\n\n其中 \\(n_1\\) 是训练子样本的样本量。对于分类，通常使用交叉熵（或偏差），如 Eq. (8.3)\
  \ 定义，来衡量拟合优度\n\n\n拟合\n\n$L(\\boldsymbol{\\theta})=\\sum_{v=1}^{K} \\sum_{t=1}^{n_1}\
  \ y_{vt} \\log[f_v(\\boldsymbol{x}_t)],$ (8.11)\n\n分类基于式 (8.7)。\n网络训练则相当于在参数空间上对训练子样本中的损失函数进行最小化。这是一个非线性优化问题，可用多种方法求解，从简单的梯度方法到包括遗传算法在内的牛顿法和拟牛顿算法。对于大量变量，梯度算法计算速度快，只需保留一阶导数，而不需要像牛顿法那样保留二阶导数。在神经网络文献中，梯度算法通常称为反向传播。从输入变量开始，应用权重和激活函数计算中间变量\
  \ $\\boldsymbol{h}_t$ 的过程称为前向传播。将新权重应用于这些中间变量即可得到输出。反向传播是将输出与观测数据进行比较、计算预测误差并利用这些误差修正权重，从而降低预测误差的逆向过程。接下来我们介绍最简单的反向传播算法。其变体之一是带有或不带有权重回溯的弹性反向传播。参见\
  \ Riedmiller and Braun (1993)。梯度下降法需要计算激活函数的偏导数，因此实际使用的激活函数都具有简单的导数。\n\n接下来，我们详细说明式\
  \ (8.10) 中平方误差损失函数的反向传播。我们假设因变量为连续变量，输出激活函数为恒等函数，$g_v(\\boldsymbol{q}_t)=q_{vt}$，隐藏层的激活函数为\
  \ Sigmoid 函数。此外，为了简化且不失一般性，我们省略偏置项。问题可以重写为\n\n$L(\\boldsymbol{\\theta})=\\sum_{t=1}^{n_1}\
  \ L_t \\text{ with } L_t=\\sum_{v=1}^{K}\\left[y_{vt}-\\boldsymbol{b}_t^{\\prime}\
  \ \\boldsymbol{h}_t\\right]^2 .$ (8.12)\n\n对偏导数并使用链式法则，我们得到\n\n$\\frac{\\partial\
  \ L_t}{\\partial \\boldsymbol{\\beta}_v}=-2 h_t\\left(y_{vt}-\\boldsymbol{h}_t^{\\\
  prime} \\boldsymbol{\\beta}_v\\right),$ (8.13)\n\n$\\frac{\\partial L_t}{\\partial\
  \ \\boldsymbol{\\omega}_m}=-\\sum_{v=1}^{K} 2\\left(y_{vt}-\\boldsymbol{h}_t^{\\\
  prime} \\boldsymbol{\\beta}_v\\right) \\beta_{vm} g^{\\prime}\\left(\\boldsymbol{\\\
  omega}_m^{\\prime} \\boldsymbol{x}_t\\right) \\boldsymbol{x}_t,$ (8.14)\n\n可以很容易地看出，Sigmoid\
  \ 函数 $g(x)$ 的导数为 $g^{\\prime}(x)=g(x)[1 - g(x)]$。因此，\n\n$\\frac{\\partial L_t}{\\\
  partial \\boldsymbol{\\omega}_m}=-\\sum_{v=1}^{K} 2\\left(y_{vt}-\\boldsymbol{h}_t^{\\\
  prime} \\boldsymbol{\\beta}_v\\right) \\beta_{vm}\\left[g\\left(\\boldsymbol{\\\
  omega}_m^{\\prime} \\boldsymbol{x}_t\\right)\\left(1-g\\left(\\boldsymbol{\\omega}_m^{\\\
  prime} \\boldsymbol{x}_t\\right)\\right)\\right] \\boldsymbol{x}_t.$ (8.15)\n\n\
  式 (8.13) 表明，对 $t$ 求和后，当 $\\boldsymbol{h}_t$ 变量已知时，可得到 $\\boldsymbol{\\beta}_v$ 的最小二乘估计，表明残差必须与预测变量\
  \ $\\boldsymbol{h}_t$ 正交。式 (8.15) 在对 $t$ 求和后，给出了在已知 $\\boldsymbol{\\beta}_v$ 的情况下估计\
  \ $\\boldsymbol{\\omega}_m$ 的方法。对 \\(\\boldsymbol{\\omega}_m\\) 的估计必须满足\n\n\\(\\\
  sum_{t=1}^n \\sum_{v=1}^K (y_{vt} - \\boldsymbol{h}'_t \\boldsymbol{\\beta}_v) \\\
  beta_{vm} p_m \\mathbf{x}_t = \\mathbf{0}\\),\n\n且加权残差也必须与输入变量正交。\n\n给定导数后，从第 $i$\
  \ 次迭代到第 $(i+1)$ 次迭代的梯度下降更新形式为\n\n\\(\\boldsymbol{\\beta}_{vm}^{(i+1)} = \\boldsymbol{\\\
  beta}_{vm}^{(i)} - \\gamma_i \\sum_{t=1}^{n_1} \\frac{\\partial L_t}{\\partial \\\
  boldsymbol{\\beta}_{vm}^{(i)}},\\tag{8.17}\\)\n\n\\(\\mathbf{w}_{m\\ell}^{(i+1)}\
  \ = \\mathbf{w}_{m\\ell}^{(i)} - \\gamma_i \\sum_{t=1}^{n_1} \\frac{\\partial L_t}{\\\
  partial \\mathbf{w}_{m\\ell}^{(i)}},\\tag{8.18}\\)\n\n其中 \\(\\gamma_i\\) 为 *学习率*，必须满足某些条件以确保估计的收敛。例如，当\
  \ \\(i \\rightarrow \\infty\\) 时，\\(\\gamma_i \\rightarrow 0\\)。关于 \\(\\gamma_i\\\
  ) 的讨论见 Hastie et al. (2001)。在实践中，可以尝试不同的学习率值，并选择使损失函数最小的那个值。为实现更新，可以将式 (8.13) 和\
  \ (8.14) 重写为每个权重的 *反向传播方程*：\n\n\\(\\frac{\\partial L_t}{\\partial \\beta_{km}} \\\
  equiv \\delta_{vt} h_{mt},\\tag{8.19}\\)\n\n\\(\\frac{\\partial L_t}{\\partial w_{m\\\
  ell}} \\equiv s_{mt} x_{\\ell t},\\tag{8.20}\\)\n\n其中\n\n\\(\\delta_{vt} = -2(y_{vt}\
  \ - \\boldsymbol{h}'_t \\boldsymbol{\\beta}_v),\\)\n\n且\n\n\\(s_{mt} = p_m \\sum_{v=1}^K\
  \ \\beta_{vm} \\delta_{vt}.\\tag{8.21}\\)\n\n例如，假设 \\(K=1\\)，即只有一个输出变量，并令 \\(e_t^{(i)}\
  \ = y_t - \\boldsymbol{h}'_t \\boldsymbol{\\beta}_v^{(i)}\\)。更新方程为\n\n\\(\\boldsymbol{\\\
  beta}^{(i+1)} = \\boldsymbol{\\beta}^{(i)} - \\gamma_i \\sum_{t=1}^{n_1} \\mathbf{e}_t^{(i)}\
  \ \\mathbf{h}_t^{(i)},\\tag{8.22}\\)\n\n\\(\\mathbf{w}_m^{(i+1)} = \\mathbf{w}_m^{(i)}\
  \ - \\gamma_i \\beta_m^{(i)} p_m^{(i)} \\sum_{t=1}^{n_1} \\mathbf{e}_t^{(i)} \\\
  mathbf{x}_t,\\tag{8.23}\\)\n\n并且具有直观的解释：\\(\\boldsymbol{\\beta}^{(i)}\\) 权重的更新取决于预测误差与中间解释变量\
  \ \\(\\boldsymbol{h}_t^{(i)}\\) 的正交性；神经元 \\(m\\) 中的 \\(\\mathbf{w}_{m\\ell}^{(i)}\\\
  ) 权重的更新取决于预测误差与输入变量的正交性、该神经元对响应的重要性（由 \\(\\beta_m^{(i)}\\) 衡量），以及 \\(\\mathbf{w}_m^{(i)}\\\
  ) 的变化对 \\(\\boldsymbol{h}_t^{(i)}\\) 的影响（由激活函数的导数 \\(p_m^{(i)}\\) 衡量）。\n\n神经网络的训练过程如下：\n\
  \n- 1. 初始化：选择参数的初始值并设置训练算法的一些常数，例如 (a) 学习率；(b) 批量大小 $B$，即用于更新神经网络参数或联合处理的观测值块的观测数量；以及\
  \ (c) epoch 数，即使用 $n_1$ 个数据通过更新算法进行的迭代次数。\n- 2. 前向传播：使用当前权重（参数）输入下一批 $B$ 个输入变量，并使用式\
  \ (8.4)–(8.6) 计算神经网络的输出或预测值 $\\hat{f}_v(\\mathbf{x}_t)$。\n- 3. 计算预测误差：计算输出误差 $e_{vt}\
  \ = y_{vt} - \\hat{f}_v(\\mathbf{x}_t)$ 以及迄今已处理观测值的损失函数值。\n- 4. 反向传播：计算量 $\\delta_{vt}$，并通过式\
  \ (8.21) 反向传播以求得 $s_{mt}$。随后，$\\delta_{vt}$ 和 $s_{mt}$ 均用于计算式 (8.17) 和 (8.18) 中的梯度更新。\n\
  \n步骤 2–4 重复执行，直到分析完训练集的 $n_1$ 个观测值并完成一个 epoch。随后，该过程不断迭代，直到达到预设的 epoch 数量。\n\n关于网络训练，有几点讨论有必要。首先，预测变量的尺度可能会影响网络的实用性。因此，通常会对预测变量（或输入变量）进行标准化，使其均值为零、方差为一。其次，训练需要对偏置和权重进行一些初始估计。在使用标准化预测变量时，可以采用\
  \ $U[-w, w]$（其中 $0 < w < 1$）的随机抽样作为初始参数值。由于我们要最小化的函数可能存在多个局部极小值，因此用不同的初始值启动算法并在验证子样本中比较结果非常重要。第三，批量大小\
  \ $B$ 取决于样本量。如果子样本 $n_1$ 不大，可以取 $B=1$，在每次输入 $\\mathbf{x}_t$ 后更新参数，如在线递归估计中所做（参见第\
  \ 2.8.2 节）。对于较大的 $n_1$，为加快估计速度，$B$ 通常选取为数据的一部分。将 $B$ 个观测值按批处理以更新参数称为算法的一次迭代，处理 $n_1$\
  \ 个观测值一次所需的迭代次数为一个 epoch。（例如，若 $n_1=50000$ 且 $B=100$，则需要 500 次迭代才能完成一个 epoch。）第四，如果网络层数或节点过多，可能会发生过拟合。为了避免过拟合，验证子样本变得非常有价值。可以比较验证子样本中拟合网络的性能，并选择性能最佳的网络作为首选网络。最后，有几个\
  \ R 包可用于神经网络分析，包括 **nnet** 和 **neuralnet**。**nnet** 只允许一个隐藏层，而 **neuralnet** 更具灵活性。我们将在下面的演示中使用后者。\n\
  \n反向传播方法的优点包括简单性和局部性。隐藏层的每个神经元仅接收和传递与其有连接的神经元的信息。因此，该算法可以并行执行。另一方面，反向传播可能较慢，因此通常会使用其他一些方法，例如需要二阶导数的方法。\n\
  \n\n\n\n显然，训练思想可以推广到具有多个隐藏层的网络。但是，当隐藏层太多时，可能会出现一些计算困难。我们将在下一节深度学习中回到这个问题。\n\n###\
  \ 示例 8.3\n\n统计文献中广泛使用的一个数据集是波士顿房价数据集，可从 R 包 MASS 中获得。有关该数据集的详细分析，请参见 Belsley et\
  \ al. (2005)。此处我们仅将该数据集作为示例。感兴趣的因变量是波士顿郊区自有住房的中位数价值（以千为单位）。共有 13 个预测变量，包括 rm（每套住房的平均房间数）、age（1940\
  \ 年以前建成的自有住房单位比例）和 lstat（人口的低地位比例）。我们在此处的目标是演示 NN 的用法，因此在以下分析中仅考虑上述三个预测变量。\n\n首先，我们对因变量\
  \ medv 进行对数变换，并标准化输入变量，使每个预测变量的均值为 0、方差为 1。然后我们采用两个 NN 模型。第一个模型是 3-2-1 网络，包含 3 个输入变量、1\
  \ 个具有 2 个节点的单隐藏层和 1 个输出变量。图 8.6 显示了生成的网络，其中与每个箭头关联的数值表示权重，从圆圈 1 出发的箭头关联的数值表示偏置。我们使用默认选项，因此激活函数是逻辑函数。在此特定示例中，隐藏层的第一个节点由以下给出\n\
  \n```\nh_1(\\boldsymbol{x}_t) = \\frac{\\exp(2.923 - 0.404\\text{rm}_t - 1.373\\\
  text{age}_t - 2.08\\text{lstat}_t)}{1 + \\exp(2.923 - 0.404\\text{rm}_t - 1.373\\\
  text{age}_t - 2.08\\text{lstat}_t)},\n```\n\n输出节点为\n\n```\n\\widehat{\\text{medv}}_t\
  \ = 2.326 + 0.686h_1(\\boldsymbol{x}_t) + 0.871h_2(\\boldsymbol{x}_t).\n```\n\n\
  ![](img/d4c84ae3c2178f4c506af3dd2ed13122_455_0.png)\n\n图 8.6 以 rm、age 和 lstat 为预测变量的对数中位房价拟合\
  \ 3-2-1 NN。数据集为波士顿房价。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_456_0.png)\n\n\
  图 8.7 以 rm、age 和 lstat 为预测变量的对数中位房价拟合 3-2-2-1 NN。数据集为波士顿房价。\n\n该网络的残差均方误差为 0.2019，而\
  \ log(medv) 的样本标准误为 0.4088。\n\n图 8.7 显示了拟合的 3-2-2-1 网络，该网络有 2 个隐藏层，每个隐藏层有 2 个节点。该网络可以以类似的方式进行解释。该网络的残差均方误差也接近\
  \ 0.2019。在此特定示例中，额外的隐藏层贡献不大。\n\n### R 演示：使用 neuralnet 包的 NN\n\n```\n> require(MASS)\n\
  > require(neuralnet)\n> fix(Boston)\n> names(Boston)\n[1] \"crim\" \"zn\" \"indus\"\
  \ \"chas\" \"nox\" \"rm\" \"age\"\n[8] \"dis\" \"rad\" \"tax\" \"ptratio\" \"black\"\
  \ \"lstat\" \"medv\"\n> X = cbind (Boston$rm,Boston$age,Boston$lstat) #Input nodes\n\
  > X = scale (X,center=TRUE,scale=TRUE) #Standardization\n> colnames (X) <- c (\"\
  rm\", \"age\", \"lstat\")\n> medv <- log (Boston$medv)\n> netw <- neuralnet (medv~.,data=data.frame\
  \ (X),hidden=c(2) ,\nalgorithm=\"rprop+\")\n> names (netw)\n[1] \"call\" \"response\"\
  \ \"covariate\"\n[4] \"model.list\" \"err.fct\" \"act.fct\"\n[7] \"linear.output\"\
  \ \"data\" \"exclude\"\n[10] \"net.result\" \"weights\" \"generalized.weights\"\n\
  [13] \"startweights\" \"result.matrix\"\n> plot(netw)\n>\n> fitted.values <- as.numeric(netw$net.result[[1]])\n\
  > rmse <- sqrt(mean((medv-fitted.values)^2))\n> rmse\n[1] 0.2019246\n> sqrt(var(medv))\n\
  [1] 0.4087569\n> netw1 <- neuralnet(medv~.,data=data.frame (X),hidden=c(2,2) ,\n\
  algorithm=\"rprop+\")\n> fit1 <- as.numeric(netw1$net.result[[1]])\n> rmse1 <- sqrt(mean((medv-fit1)^2))\n\
  > rmse1\n[1] 0.2019169\n```\n\n## 8.3 深度学习\n\n深度学习是基于 NN 的更广泛的 *机器学习* 家族的一部分。它使用\
  \ NN 中的多个层来逐步从数据中提取更高级别的特征。DL 中的 *深* 字是指用于处理数据的层数，DL 通常意味着所使用的网络具有两个或多个隐藏层。本节我们简要介绍用于预测和分类的\
  \ DL。\n\n与传统 NN 类似，支持深度 NN 的基本理论是 *通用逼近定理*。这一性质适用于任意宽度的单层 NN，也适用于固定宽度但任意深度的多层 NN。此外，一些结果表明，具有多个层的\
  \ NN 相比于单层 NN，对任何函数提供了更高效（参数更少）的逼近。参见 Hornik (1991)、Hanin and Sellke (2017) 和 Lu\
  \ et al. (2017)。\n\n### 8.3.1 深度网络类型\n\n除前馈设计外，文献中为 DL 提出了各种类型的 NN。此处我们简要讨论一些常用的网络。在实践中，这些网络可以混合在一起形成一个复杂的网络。通常，NN\
  \ 是完全连接的，即一个层中的每个节点都连接到下一层的所有节点。这种网络在变深时训练会遇到各种困难，例如消失梯度问题，并且可能需要大量的计算成本。下一节将给出一些细节。下面讨论的网络结构旨在增强\
  \ NN 的能力和适用性，并简化网络训练。\n\n- **卷积神经网络 (CNN)**：它们是受规则化的多层感知机，模拟动物视觉皮层的功能，主要用于计算机视觉。在此，皮层神经元仅在视觉场的受限区域（称为感受野）对刺激作出反应。神经元的感受野相对较小，但可能重叠，从而使整个图像得到适当连接。通常，CNN\
  \ 的输入是一个或多个矩阵的标准化像素值 [红绿蓝 (RGB) 图像中为三个]。一些滤波器（卷积）应用于图像中小像素组，并重复该过程直到遍历整个图像。这些滤波器旨在提取特征，如边缘、颜色、直线等。该过程使用不同的滤波器重复多次，最终发现的特征是前馈\
  \ NN 的输入，用于对图像进行分类。CNN 常用的激活函数是斜坡函数，即整流单元。CNN 广泛用于分类。例如，Lawrence et al. (1997) 使用\
  \ CNN 进行人脸识别。它采用自组织映射（一种无监督学习过程，在没有任何类别信息的情况下学习一组模式的分布）和更新算法（采用类似于统计文献中核函数的邻域函数）来执行网络训练。Kalchbrenner\
  \ et al. (2014) 将 CNN 应用于句子建模。\n\n- **递归 NN**：递归网络是通过对结构化输入递归应用同一组权重来生成结构化预测而创建的深度\
  \ NN。它已应用于语音识别，因为句子是单词的总和，因此具有结构。每个单词由一个向量表示并形成一棵二叉树。递归 NN 对任何层次结构进行操作，将两个节点（子节点）中的信息组合为一个新节点（父节点），并采用树型结构处理信息。\n\
  \n- **循环神经网络 (RNN)**：这些网络可以被视为在时间线性进展上运行的递归 NN 表示的特例，它结合前一时间步和隐藏表示以获得当前时间步的输出。RNN\
  \ 旨在处理序列数据，特别适用于时间序列分析。它们最初是为带有某种序列结构的数据（如手写和语音识别）而创建的。例如，参见 Mikolov et al. (2010)。RNN\
  \ 已应用于时间序列向量的预测，假设具有外生变量的非线性自回归模型（NARX）。参见 Menezes and Barreto (2008)。RNN 的正则化问题由\
  \ Zaremba et al. (2015) 研究，RNN 的特性在文献中已得到调查。例如，参见 Hammer et al. (2005) 和 Hammer\
  \ (2007)。由于 RNN 关注动态依赖性，我们将在下一节提供更多细节。\n\n### 8.3.2 循环 NN\n\nRNN 是一组旨在处理序列数据的 NN。它们与动态系统相似\n\
  \n```\ns_t = f(s_{t-1}, x_t, \\theta),\n```\n\n其中 $s_t \\in \\mathbb{R}^d$ 表示时间\
  \ $t$ 的状态向量，$x_t \\in \\mathbb{R}^k$ 是时间 $t$ 的输入，$\\theta \\in \\mathbb{R}^p$ 是一组参数，$f(.)$\
  \ 表示从状态 $s_{t-1}$ 到 $s_t$ 并在新数据 $x_t$ 下的转换。动态系统的一个特殊特征是参数向量 $\\theta$ 是时不变的。即，所有时间索引\
  \ $t$ 共享相同的值。给定输入数据 $\\{x_1, ..., x_n\\}$，令 $h_t \\in \\mathbb{R}^d$ 为隐藏层的输出，其中\
  \ $h_0 = \\mathbf{0}$。然后，简单 RNN 可以符号化地描述为\n\n```\ns_t = b + W h_{t-1} + U x_t, \\\
  qquad (8.24)\n\nh_t = g(s_t), \\qquad (8.25)\n\n\\hat{y}_t = g_y(c + V h_t), \\\
  qquad (8.26)\n```\n\n其中 $g(.)$ 和 $g_y(.)$ 是如 tanh 之类的激活函数，$b$ 和 $c$ 是偏置项，$W$、$U$\
  \ 和 $V$ 是参数矩阵，$\\hat{y}_t \\in \\mathbb{R}^m$。在文献中，方程 (8.24)–(8.26) 中的 RNN 被称为 Elman\
  \ 网络；参见 Elman (1990)。图 8.8 是 RNN 的表示。在每个时间 $t$ 时，可用信息是输入 $x_t$ 和来自 $t-1$ 的内存向量 $h_{t-1}$。这两个向量线性组合以形成时间\
  \ $t$ 的状态向量 $s_t$。新的内存向量是一个非线性函数\n\n\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_459_0.png)\n\
  \n状态向量的预测（或输出）是作为记忆新向量 \\(\\mathbf{h}_t\\) 组件的线性组合构建的，该向量也会馈入下一周期。\n\n例如，考虑最简单的情况：平稳零均值单变量时间序列\
  \ \\(x_t\\)，且 \\(k=m=1\\)，采用线性激活函数和 \\(d=1\\)。此时，\\(s_t = wh_{t-1} + ux_t = h_t\\\
  )，状态也是记忆函数，且 \\(\\hat{y}_t = \\hat{x}_{t+1} = vh_t\\)。假设 \\((w, u, v) < 1\\)，则有\
  \ \\(s_t = u(1 + wB + w^2B^2 + \\cdots + w^tB^t)x_t\\)，并且当 \\(t\\) 很大时，\\((1 - wB)s_t\
  \ = ux_t\\) 且 \\(\\hat{x}_{t+1} = w\\hat{x}_t + uwx_t\\)。因此，这个简单 RNN 生成的预测对应于 ARMA(1,1)\
  \ 过程的预测。增大维度 \\(d\\) 且对于 \\(k=1\\)，可以生成其他单变量自回归积分滑动平均（ARIMA）预测。对于 \\(k > 1\\)，输出是一个向量时间序列。RNN\
  \ 可以为带外生变量的非线性自回归（NARX）模型生成预测。\n\n\\(\\hat{y}_t = F(\\mathbf{y}_{t-1}, \\dots, \\\
  mathbf{y}_{t-p}, \\mathbf{x}_t, \\dots, \\mathbf{x}_{t-h}).\\)\n\n参见 Siegelmann\
  \ et al. (1997)。另一种类型的 RNN 是 Jordan (1997) 网络，由\n\n\\(\\mathbf{h}_t = g_h(\\mathbf{W}\\\
  mathbf{y}_{t-1} + \\mathbf{U}\\mathbf{x}_t + \\mathbf{b}),\\) (8.27)\n\n\\(y_t =\
  \ g_y(\\mathbf{V}\\mathbf{h}_t + c),\\) (8.28)\n\n其中 \\(g_h(.)\\) 和 \\(g_y(.)\\\
  ) 是激活函数。此处省略了状态 \\(\\mathbf{s}_t\\)。\n\n通常，RNN 的输出 \\(y_t\\) 服从某些概率分布，并使用最大似然函数来估计参数。此外，深度\
  \ RNN 可以以多种方式假设反馈。反馈可以是从隐藏层到隐藏层再到隐藏层，也可以是从节点到节点。有关示例，请参见 Goodfellow et al. (2016)。可以将\
  \ RNN 视为允许信息多次通过某些神经元的网络。训练 RNN 也可以采用与前馈网络相似的方法。唯一需要的更改是递归计算梯度。\n\n### 8.3.3 深度学习的激活函数\n\
  \n除前面提到的线性、sigmoid 和 tanh 函数外，DL 还可使用其他类型的激活函数，如下所示。\n\n- 1. 整流线性单元（ReLU）：f(x) =\
  \ max(0, x)。该激活函数计算效率高，梯度函数简单。该函数的一个缺点是，当 x < 0 时其梯度为零，这可能会导致 x < 0 时神经元失效。\n\n\
  - 2. 带泄漏的整流线性单元（Leaky ReLU）：\n\n  $$f(x) = \\begin{cases} 0.1x, & \\text{if } x\
  \ < 0, \\\\ x, & \\text{if } x \\ge 0. \\end{cases}$$\n\n  该函数避免了与 ReLU 相关的失效问题。\n\
  \n- 3. 参数化整流线性单元（Parameterized ReLU）：\n\n  $$f(x, a) = \\begin{cases} x, & \\text{if\
  \ } x \\ge 0, \\\\ ax, & \\text{if } x < 0, \\end{cases}$$\n\n  其中 \\(a\\) 是常数，表示\
  \ \\(x < 0\\) 时的斜率。通常 \\(a\\) 是一个小的正数，例如 0.01。在实际应用中，\\(a\\) 也可以是估计中包含的参数。\n\n-\
  \ 4. 指数线性单元（ELU）：\n\n  $$f(x, a) = \\begin{cases} x, & \\text{if } x \\ge 0, \\\\\
  \ a[\\exp(x) - 1], & \\text{if } x < 0. \\end{cases}$$\n\n  该函数是带泄漏 ReLU 的一种修改，因为它允许在\
  \ \\(x < 0\\) 时具有非线性导数。\n\n- 5. Swish 函数：\n\n  $$f(x) = x \\times \\text{sigmoid}(x)\
  \ = \\frac{x}{1 + e^{-x}}.$$\n\n- 6. Softmax：对于 \\(\\mathbf{x} = (x_1, \\dots, x_m)'\\\
  ),\n\n  $$f(\\mathbf{x}) = \\frac{\\exp(\\mathbf{x})}{\\sum_{j=1}^m \\exp(x_j)}.$$\n\
  \n在有众多激活函数可供选择的情况下，应用中选择激活函数有一些通用准则。下面列出了一些准则：\n\n- ReLU 函数常用于 DL，因为它能缓解梯度消失问题。\n\
  - 如果可能存在死亡神经元，则使用 ReLU 函数效果更好。\n- ReLU 函数应仅用于隐藏层。输出层要么用于连续输出变量的线性函数，要么用于分类的 softmax\
  \ 函数。\n- Sigmoid 和 softmax 函数及其组合通常对分类器效果良好。\n\n当然，经验可能决定激活函数的选择，或者可以针对特定应用尝试不同类型的激活函数。\n\
  \n### 8.3.4 训练深度网络\n\n传统的反向传播方法在训练深度网络时会遇到各种困难。例如，链式法则被多次使用以获得梯度。然而，对于大多数激活函数，导数小于\
  \ 1。因此，梯度可能会迅速趋近于零，从而为下一步优化提供不明确的方向。这被称为梯度消失问题。另一个例子是，考虑等式 (8.24) 和 (8.25) 中的 RNN。动态的递归性质意味着\
  \ W 的特征值在梯度计算中起着重要作用。设 λ 为 W 的一个特征值。如果 |λ| < 1，则当 \\(t \\to \\infty\\) 时 \\(\\lambda^t\
  \ \\to 0\\)。另一方面，如果 |λ| > 1，则随着 \\(t\\) 增加，\\(|\\lambda|^t \\to \\infty\\)。因此，我们既有梯度消失问题也有梯度爆炸问题。梯度爆炸会使\
  \ DL 不稳定。事实上，较大的梯度本身可能会导致学习困难。最后，当网络较深时，还可能出现局部最小值、鞍点和平坦参数区域。\n\n#### 8.3.4.1 长短期记忆模型\n\
  \n梯度消失或梯度爆炸问题在机器学习中被称为长期依赖问题。这种困难对 RNN 特别相关。文献中提出了许多方法来克服这一困难，包括通过时间添加跳跃连接以及在多个时间尺度上组织\
  \ RNN 的状态，以便信息在较慢的时间尺度上更容易地传播长距离。Hochreiter 和 Schmidhuber (1997) 的长短期记忆（LSTM）模型引入了自循环，产生梯度可以长时间流动的路径。LSTM\
  \ 模型可以缓解梯度消失问题，但不能缓解梯度爆炸问题。考虑等式 (8.24)–(8.25) 中的 RNN。经典的 LSTM 循环网络采用 LSTM 单元，这些单元除了常规的外部递归外还具有内部循环。每个\
  \ LSTM 单元具有与普通 RNN 相同的输入和输出，但采用三个调节器（通常称为门）来控制单元内部的信息流。考虑等式 (8.24)。s_t 的状态节点 s_jt\
  \ 现在伴随三个门。第一个门称为遗忘门，定义为\n\n\\(f_{jt} = \\sigma \\left( b_j^f + \\sum_v U_{jv}^f\
  \ x_{vt} + \\sum_v W_{jv}^f h_{v,t-1} \\right), \\quad (8.29)\\)\n\n其中 σ(.) 表示 sigmoid（逻辑）函数，\\\
  (x_t\\) 是输入向量，\\(h_t\\) 是包含所有 LSTM 单元输出的当前隐藏层向量，\\(b^f\\)、\\(U^f\\) 和 \\(W^f\\)\
  \ 分别是遗忘门的偏置、输入权重和循环权重。第二个门是外部输入门 \\(i_{jt}\\)，它也使用 sigmoid 激活函数，但带有其自身参数，即，\n\n\\\
  (i_{jt} = \\sigma \\left( b_j^i + \\sum_v U_{jv}^i x_{vt} + \\sum_v W_{jv}^i h_{v,t-1}\
  \ \\right). \\quad (8.30)\\)\n\n第三个门是*输出门*，通过它可以关闭 LSTM 单元的输出 \\( h_{it} \\)。同样，常使用\
  \ sigmoid 激活函数，我们有\n\n\\( o_{jt} = \\sigma \\left( b_j^o + \\sum_v U_{jv}^o x_{vt}\
  \ + \\sum_v W_{jv}^o h_{v,t-1} \\right), \\) (8.31)\n\n如前所述，\\( b^o \\)、\\( U^o\
  \ \\) 和 \\( W^o \\) 分别是输出门的偏置、输入权重和循环权重。接下来，状态单元由以下给出：\n\n\\( s_{jt} = f_{jt} s_{j,t-1}\
  \ + i_{jt} \\sigma \\left( b_j + \\sum_v U_{jv} x_{vt} + \\sum_v W_{jv} h_{v,t-1}\
  \ \\right), \\) (8.32)\n\n其中激活函数 \\( \\sigma(.) \\) 通常采用 tanh 函数，\\( b \\)、\\( U\
  \ \\) 和 \\( W \\) 分别表示状态节点的偏置、输入权重和循环权重。显然，遗忘门和外部输入门控制状态节点的演化。最后，我们有\n\n\\( h_{jt}\
  \ = \\tanh(s_{jt}) o_{jt}, \\) (8.33)\n\n当 \\( o_{it} \\) 接近零时，可以舍弃 \\( h_{it} \\\
  )。\n\n从描述中可以看出，LSTM 使用更多参数，但三个门可以控制信息流，使得记忆长度变得灵活。同样清楚的是，门可以缓解梯度消失问题，因为它们可以在计算梯度时打破链式法则。上述\
  \ LSTM 单元有一些变体，但差异很小。\n\n#### 8.3.4.2 训练算法\n\n深度网络通常包含许多参数，这些参数可能高度相关。因此，通常需要一些正则化。之前针对高维线性回归讨论的\
  \ \\( \\ell_1 \\) 或 \\( \\ell_2\\) 罚概念在这里继续适用。\n\n随机梯度下降（SGD）及其变体可能是机器学习和深度学习中最常用的优化算法。SGD\
  \ 的基本思想是，通过从数据生成分布中随机抽取的 \\( \\ell \\) 个数据点的小批量上取平均梯度，可以获得梯度的无偏估计。换句话说，与其从全部可用数据中计算梯度，不如执行以下操作：\n\
  \n##### 训练迭代 \\( j \\) 中的 SGD：\n\n- 1. 指定一个学习率，例如 \\( \\epsilon_j \\)。\n- 2. 设初始参数为\
  \ \\( \\theta \\)。\n- 3. 当未满足停止准则时，执行以下操作：\n  - 采样一个包含 \\( \\ell \\) 个数据点的小批量，例如\
  \ \\( \\{(\\mathbf{x}^{(i)}, y^{(i)})|i = 1, ..., \\ell \\} \\)。\n  - 计算梯度估计：\n\
  \    \\( \\hat{g} = \\frac{1}{\\ell} \\nabla_\\theta \\sum_i L(f(\\mathbf{x}^{(i)},\
  \ \\theta), y^{(i)}). \\)\n  - 更新：\\( \\theta = \\theta - \\epsilon_j \\hat{g} \\\
  ).\n\n\n\n\n\n在该算法中，\\(\\nabla_\\theta\\) 表示对 \\(\\theta\\) 的偏导数，\\(L(f(.), y)\\\
  ) 表示 \\(f(.)\\) 与 \\(y\\) 之间的损失函数，其中 \\(f(.)\\) 表示深度网络的输出。SGD 算法收敛的充分条件是\n\n```\n\
  \\(\\sum_{j=1}^\\infty \\epsilon_j = \\infty \\quad \\text{and} \\quad \\sum_{j=1}^\\\
  infty \\epsilon_j^2 < \\infty.\\)\n```\n\n在实践中，可以从初始学习率 \\(\\epsilon_0\\) 开始，并按线性方式降低学习率，直到迭代\
  \ \\(\\tau\\)，如下所示\n\n```\n\\(\\epsilon_j = (1 - \\alpha)\\epsilon_0 + \\alpha\\\
  epsilon_\\tau,\\)\n```\n\n其中 \\(\\alpha = j/\\tau\\)。迭代 \\(\\tau\\) 之后，学习率变为常数。在某些应用中，甚至可以使用\
  \ \\(\\ell = 1\\)，即单个数据点。\n\n另一种有用的训练方法是 Polyak (1964) 的 **动量**，可以总结如下：\n\n#####\
  \ 带动量的 SGD:\n\n- 1. 指定学习率 \\(\\epsilon\\) 和动量参数 \\(\\alpha\\)。\n- 2. 设初始参数为 \\(\\\
  theta\\)，初始速度为 \\(\\mathbf{v}\\)。\n- 3. 直到满足停止准则，重复以下步骤\n    - 抽取一个包含 \\(\\ell\\\
  ) 个数据点的小批量，例如 \\(\\{(\\mathbf{x}^{(i)}, y^{(i)})|i = 1, \\dots, \\ell\\}\\)。\n \
  \   - 计算梯度估计：\n      \\(\\hat{\\boldsymbol{g}} = \\frac{1}{\\ell} \\nabla_\\theta\
  \ \\sum_i L(f(\\mathbf{x}^{(i)}, \\theta), y^{(i)}).\\)\n    - 计算速度更新：\\(\\mathbf{v}\
  \ = \\alpha \\mathbf{v} - \\epsilon \\hat{\\boldsymbol{g}}\\)。\n    - 更新：\\(\\theta\
  \ = \\theta + \\mathbf{v}\\)。\n\n训练深度网络还有许多其他可用方法，包括坐标下降、自适应学习率（AdaGrad 算法）、Hinton\
  \ (2012) 的 RMSProp 算法，以及 Kingma 和 Ba (2014) 的 Adam 方法。同样，有兴趣的读者可参阅 Goodfellow et\
  \ al. (2016)。\n\n## 8.4 一些应用\n\n我们使用多个真实数据集，演示 RNN 和 DL 的一些应用。对于 RNN 示例，我们使用 R 包\
  \ **rnn**；对于其他示例，我们使用包 **keras**，该包可从 RStudio 的 https://keras.rstudio.com 获得。该网站还包含安装信息以及在\
  \ R 中运行机器学习的多个示例。有关更多信息，有兴趣的读者可参阅 Chollet 和 Allaire (2020)。另外，R CRAN 上 **keras**\
  \ 的 vignettes 包含使用该包的多个教程，例如基本分类和基本回归。\n\n### 8.4.1 包：keras\n\nRStudio 中提供的 **keras**\
  \ 包是一个在 R 中学习 DL 的有用包。它为应用提供了一些内置函数。用户可以使用三种方法之一构建 NN 模型：(a) 顺序模型，(b) 函数式应用程序编程接口\
  \ (API)，以及 (c) 自定义模型。对于初学者，顺序模型易于学习。这是本书中使用的方法。一旦读者熟悉该包，就可以使用其他两种方法构建更复杂的 NN 模型。该包包含多种不同类型的网络层，包括\
  \ layer_dense（传统 NN 的全连接层）、layer_dropout（控制随机丢弃某些输入节点）、layer_lstm（LSTM 层）等众多层。该包还包含第\
  \ 8.3.3 节中的各种激活函数。顺序方法允许用户为 NN 指定一层接一层，并选择每一层的激活函数。建议读者通过实验来了解更多关于在 R 中进行 DL 的内容。\n\
  \n### 示例 8.4\n\n在本示例中，我们考虑从 1948 年 1 月到 2020 年 2 月的美国月度失业率。数据已进行季节调整，可直接从 FRED（圣路易斯联邦储备银行的经济数据库）下载。事实上，可以通过\
  \ R 包 quantmod 从互联网下载数据。详情见附带的 R 命令和输出。或者，数据也在文件 unrate4820.txt 中。图 8.9 显示了美国月度失业率数据的时间图。\n\
  \n失业率精确到小数点后一位，这使其适用于 R 包 rnn（一个将整数转换为二进制代码的循环神经网络包）。设 u_t 为观测到的失业率。我们使用 z_t = 10u_t，使\
  \ z_t 取整数值。然而，在与其他统计方法进行预测比较时，我们使用 u_t。样本量为 866，我们保留最后\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_464_0.png)\n\
  \n图 8.9 1948 年 1 月至 2020 年 2 月的美国月度失业率。该图由 R 包 quantmod 的 chartSeries 命令生成。\n\n\
  ![](img/d4c84ae3c2178f4c506af3dd2ed13122_465_0.png)\n\n图 8.10 美国月度失业率预测子样本中观测数据（圆圈）、RNN\
  \ 预测（蓝色）和 AR(13) 模型预测（红色）的时间图。\n\n200 个数据点用于样本外比较。预测子样本从 2003 年 7 月到 2020 年 2 月。\n\
  \n作为基准模型，我们使用标量 AR(13) 模型。因此，我们使用 z_{t-1}, ..., z_{t-13} 作为 RNN 网络的输入变量，此外，我们使用三个大小为\
  \ (5,5,5) 的隐藏层。所选激活函数是包含偏置项的 logistic（即 sigmoid）函数。训练以 0.05 的学习率和 20 个 epoch 进行。图\
  \ 8.10 显示了预测子样本中观测数据（圆圈）、RNN 预测（蓝色）和 AR(13) 预测（红色）的时间图。从图中可以看出，RNN 和标量 AR(13) 模型都能相当好地跟踪观测数据，但\
  \ RNN 在 2010 年左右有相对较大的偏差。标量 AR(13) 模型的均方根误差（RMSE）、平均绝对误差和中位绝对误差（MedAE）分别为 0.15、0.12\
  \ 和 0.11。另一方面，RNN 的三个指标分别为 0.22、0.13 和 0.1。RNN 相对较大的 RMSE 是由前文提到的 2010 年左右的较大误差引起的。\n\
  \n### R 演示：RNN 包\n\n```\n> require(quantmod)\n> require(rnn)\n> getSymbols(\"UNRATE\"\

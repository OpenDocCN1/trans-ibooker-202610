  **图 1.14** 99 个世界金融市场指数日度对数收益率滞后 CCM 的三个汇总统计量的散点图。汇总统计量为 (a) 检验 \( R(\ell) = 0 \)
  的 p 值，(b) \( \widehat{R}(\ell) \) 中显著对角元素的比例，以及 (c) \( \widehat{R}(\ell) \) 中显著非对角元素的比例。


  ## 1.4 非平稳过程


  若向量过程 \( z_t \) 未能满足平稳性条件，则称其为非平稳过程。简单来说，若 \( z_t \) 的某些联合分布随时间变化，则 \( z_t \) 为非平稳过程。在此情况下，\(
  z_t \) 的矩可能依赖于时间。由于我们通常在给定时间索引 \( t \) 处只有一个观测值，因此需要进一步假设才能使非平稳过程的估计成为可能。最常用的非平稳过程是整合过程。此类过程通常被称为单位根非平稳序列。


  标量时间序列 \( z_t \) 称为阶数为 1 的整合过程，若其增量 \( w_t = z_t - z_{t-1} \) 是平稳且可逆的过程。在计量经济学文献中，平稳且可逆的过程称为
  \( I(0) \) 过程，阶数为 1 的整合过程称为 \( I(1) \) 过程。随机游走序列是 \( I(1) \) 过程的一个例子。令 \( B \) 表示后移算子，使得
  \( Bz_t = z_{t-1} \)。那么，若 \( w_t = (1 - B)^d z_t \) 是 \( I(0) \) 过程，则 \( z_t \)
  为 \( I(d) \) 过程。遵循惯例，我们也可在描述整合过程时使用记号 \( \nabla = (1 - B) \)。算子 \( (1 - B) \) 称为一阶差分算子，过程
  \( w_t = (1 - B)z_t \) 为 \( z_t \) 的一阶差分序列。


  类似地，若 \( w_t = (1 - B)^d z_t \) 是平稳且可逆的序列，则向量过程 \( z_t \) 称为 \( I(d) \) 过程，其中 \(
  (1 - B)^d \) 作用于 \( z_t \) 的每个分量。当然，并无特别理由期望 \( z_t \) 的所有分量都具有相同的整合阶数 \( d \)。因此，令
  \( d = (d_1, ..., d_k)'' \)，其中 \( d_i \) 为非负整数且 \( \max\{d_i\} > 0 \)。若 \( w_t =
  (w_{1t}, ..., w_{kt})'' \)（其中 \( w_{it} = (1 - B)^{d_i} z_{it} \)）是平稳且可逆的过程，则称向量过程
  \( z_t \) 为 \( I(d) \) 过程。在此情况下，我们可定义 \( D = \text{diag}[\nabla^{d_1}, ..., \nabla^{d_k}]
  \) 并写出 \( w_t = Dz_t \)。


  整合向量过程 \( z_t \) 的一个重要概念是协整。假设分量 \( z_{it} \) 为 \( I(1) \) 过程。如果存在


  ![](img/d4c84ae3c2178f4c506af3dd2ed13122_43_0.png)


  **图 1.15** 2000 年 1 月至 2015 年 10 月，33 个欧洲国家月度对数价格指数一阶差分序列的时间图。


  一个 \( k \) 维向量 \(\boldsymbol{c} = (c_1, \dots, c_k)'' \neq \boldsymbol{0}\)，使得 \(
  w_t = \boldsymbol{c}'' \boldsymbol{z}_t \) 是 \( I(0) \) 过程，则称 \(\boldsymbol{z}_t\)
  为协整过程，\(\boldsymbol{c}\) 为协整向量。\( I(0) \) 过程 \( w_t \) 是协整序列，它是平稳且可逆的。一般而言，对于 \(
  k \) 维单位根过程 \(\boldsymbol{z}_t\)，可以存在多个协整过程。我们将在后面讨论协整及其相关性质。


  季节时间序列是非平稳过程的一个重要类别。对于季节时间序列，均值函数不是常数，而是随时间按照一定的周期性模式变化。该模式在给定年份的每个季节重复出现，例如每个季度、月或周。一年中的季节数称为
  *周期性*。对于月度序列，该模式通常年复一年地重复，周期性为 \( s = 12 \)。对于季度数据，\( s = 4 \)。考虑图 1.7 中的 33 个月度价格指数。所有序列都呈上升趋势，因此不是平稳的。图
  1.15 显示了对数价格指数一阶差分序列的时间图。从图中可以看出，如预期的那样，趋势消失，序列（即通货膨胀率）现在在零附近波动。因此，有证据表明对数价格指数是
  \( I(1) \) 过程。图 1.15 中显示的循环模式表明，某些月份的值高于其他月份，因此这些过程属于季节时间序列类别。我们将在后面讨论季节时间序列。目前，介绍
  *季节差分* 的概念即可。季节差分由 \( w_t = (1 - B^s)z_t = z_t - z_{t-s} \) 给出，表示年度增量。为方便起见，我们将
  \( 1 - B \) 称为常规差分。


  图 1.16 显示了图 1.7 中 40 个价格指数的常规差分和季节差分序列的时间图。具体而言，所示时间序列为 \( w_t = (1 - B)(1 - B^{12})z_t
  \)。从图中可以看出，季节模式在很大程度上被去除了。需要季节差分才能实现平稳性但仍保持可逆性的季节时间序列称为季节整合过程。协整的概念也推广到季节协整。具体细节见第
  3 章。


  另一种备受关注的非平稳性是局部平稳过程。随机过程若其均值和方差函数随时间缓慢演变，则称为局部平稳过程。此类过程的正式定义见 Dahlhaus (2012)。与传统时间序列分析不同，局部平稳过程的统计推断基于填充渐近性。为说明，考虑时变参数自回归过程


  $$

  z_t = \phi_t z_{t-1} + \sigma_t \epsilon_t, \quad (1.20)

  $$


  其中 \(\{\epsilon_t\}\) 是标准正态随机变量序列，\(\phi_t\) 和 \(\sigma_t\) 是重新缩放的平滑函数，满足 \(\phi_t
  \equiv \phi(t/T) : [0, 1] \to (-1, 1)\) 和 \(\sigma_t \equiv \sigma(t/T) : [0, 1]
  \to (0, \infty)\)，其中 \(T\) 为样本量。当 \(T\) 增加时，\(\phi(t/T)\) 和 \(\sigma(t/T)\) 的观测值在其域
  \([0, 1]\) 上变得更加密集，从而可以更好地估计时变参数。图 1.17 显示了来自公式 (1.20) 时变参数 AR(1) 模型的 300 个观测值的一个实现的时间图，其中
  \(\phi(t/T) = 0.2 + 0.4(t/T) - 0.2(t/T)^2\) 和 \(\sigma(t/T) = \exp(t/T)\)，\(T =
  300\)。如预期，序列在零附近波动且波动性增加。该过程是局部平稳的，因为它可以在小时间间隔内由平稳序列近似。例如，在此特定示例中，图 1.17 的前 120
  个观测值似乎是弱平稳的。


  ## 1.5 主成分分析


  维度灾难是分析大规模依赖数据中广为人知的困难。这是因为很难从高维时间序列中解读出有用信息。某些探索性数据分析在这种情况下有所帮助。探索向量时间序列中动态依赖性的一种强大工具是主成分分析（PCA）。尽管
  PCA 主要是为独立数据开发的，但已被证明在时间序列分析中也有用。例如，参见 Peña and Box (1987)、Tsay (2014, chapter 6)
  及其参考文献。另参见 Taniguchi and Krishnaiah (1987) 和 Chang et al. (2014) 了解一些理论发展。然而，将 PCA
  应用于独立数据与时间序列数据之间存在差异。主要区别在于 PCA 是


  ![](img/d4c84ae3c2178f4c506af3dd2ed13122_44_0.png)


  **图 1.16** 2000 年 1 月至 2015 年 10 月，30 个欧洲国家月度价格指数的一阶差分和季节差分序列的时间图。






  ![](img/d4c84ae3c2178f4c506af3dd2ed13122_45_0.png)


  **图 1.17** 来自阶为 1 的时变参数自回归模型（公式 (1.20)）的 300 个实现的时序图，其中 $\phi(t/T) = 0.2 + 0.4(t/T)
  - 0.2(t/T)^2$ 且 $\sigma(t/T) = \exp(t/T)$。


  主要关注协方差矩阵，而非滞后协方差矩阵，后者在时间序列分析中很重要。因此，PCA 的特征值和特征向量的极限性质对于时间序列数据有所不同。参见 Zhang 和 Tong
  (2020) 的最近论文以及第 1.6 节中的一些讨论。另外，我们在第 6 章介绍了一种更通用的程序，称为时间序列数据的动态主成分分析（DPCA），它考虑了向量时间序列的滞后依赖性。


  引入 PCA 有两种主要方式。第一种方式是方差分解，第二种是最优重构或插值。我们从总体水平上独立数据的方差分解入手。设 $\boldsymbol{z} = (z_1,
  ..., z_k)''$ 为一个 $k$ 维随机向量，均值为零，协方差矩阵 $\mathbf{\Gamma}(0)$ 为正定。$\boldsymbol{z}$
  的第一个总体主成分（PC）是一个线性组合 $y_1 = \boldsymbol{c}''_1 \boldsymbol{z}$，满足 $\boldsymbol{c}''_1
  \boldsymbol{c}_1 = 1$，使得 $\text{Var}(y_1)$ 在所有由单位长度向量构成的 $\boldsymbol{z}$ 的可能线性组合中达到最大。$\boldsymbol{z}$
  的第二个 PC 定义为 $\boldsymbol{z}$ 的一个线性组合，设 $y_2 = \boldsymbol{c}''_2 \boldsymbol{z}$，满足
  (i) $\boldsymbol{c}''_2 \boldsymbol{c}_2 = 1$ 和 (ii) $\boldsymbol{c}''_2 \boldsymbol{c}_1
  = 0$，使得 $\text{Var}(y_2)$ 在所有由单位长度向量构成的 $\boldsymbol{z}$ 的线性组合中具有最大方差，且第二个 PC 与第一个
  PC 不相关。一般而言，$\boldsymbol{z}$ 的第 $i$ 个 PC 是 $\boldsymbol{z}$ 的一个非零线性组合，设 $y_i = \boldsymbol{c}''_i
  \boldsymbol{z}$，使用一个单位长度向量，该向量在所有 $\boldsymbol{z}$ 的线性组合中具有最大方差，并且与所有先前的 PC 不相关，即
  $\boldsymbol{c}_i$ 满足 (iii) $\boldsymbol{c}''_i \boldsymbol{c}_i = 1$ 和 (iv) 对于
  $j = i - 1, ..., 1$，有 $\boldsymbol{c}''_i \boldsymbol{c}_j = 0$。单位长度归一化 $\boldsymbol{c}''_i
  \boldsymbol{c}_i = 1$ 是控制缩放效应所必需的；否则最大值将没有意义。


  利用附录中给出的正定矩阵性质，协方差矩阵 $\mathbf{\Gamma}(0)$ 为正定的平稳过程 $\boldsymbol{z}_t$ 的 PCA 可通过
  $\mathbf{\Gamma}(0)$ 的谱分解获得。具体而言，设 $(\lambda_i, \boldsymbol{e}_i)$ 为 $\mathbf{\Gamma}(0)$
  的第 $i$ 个特征值-特征向量对，其中特征值满足 $\lambda_1 \ge \lambda_2 \ge \cdots \ge \lambda_k$。$\mathbf{\Gamma}(0)$
  的谱分解为


  ```

  $\mathbf{\Gamma}(0) = \lambda_1 \boldsymbol{e}_1 \boldsymbol{e}''_1 + \cdots + \lambda_k
  \boldsymbol{e}_k \boldsymbol{e}''_k.$

  ```


  那么，第 $i$ 个 PCA 为 $y_{it} = \boldsymbol{e}''_i \boldsymbol{z}_t$。从定义可知，$\text{Var}(y_{it})
  = \text{Var}(\boldsymbol{e}''_i \boldsymbol{z}_t) = \boldsymbol{e}''_i \Gamma(0)
  \boldsymbol{e}_i = \lambda_i \boldsymbol{e}''_i \boldsymbol{e}_i = \lambda_i$。由于
  $\text{tr}[\Gamma(0)] = \sum_{i=1}^k \sigma_{ii} = \sum_{i=1}^k \lambda_i$，$\boldsymbol{z}$
  的第 $i$ 个 PC 解释的变异比例为 $\lambda_i / (\sum_{j=1}^k \lambda_j)$。类似地，前 $m$ 个 PC 解释的 $\boldsymbol{z}_t$
  的变异比例为 $(\sum_{i=1}^m \lambda_i) / (\sum_{j=1}^k \lambda_j)$。如果能找到一个较小的 $m$，使得前
  $m$ 个 PC 解释了 $\boldsymbol{z}$ 中较大比例的变异，那么可以将分析重点放在前 $m$ 个 PC 上。


  假设现在，我们不是拥有独立变量，而是拥有一个平稳向量时间序列 $\boldsymbol{z}_t$ 的随机实现 $\{\boldsymbol{z}_1, \dots,
  \boldsymbol{z}_T\}$。为简化起见，我们假设该过程已进行均值调整，即 $\sum_{t=1}^T \boldsymbol{z}_t / T =
  \boldsymbol{0}$。定义 $T \times k$ 矩阵 $\boldsymbol{Z} = [\boldsymbol{z}_{(1)}, \dots,
  \boldsymbol{z}_{(k)}]$，其中 $\boldsymbol{z}_{(j)} = (z_{j1}, \dots, z_{jT})''$ 是第
  $j$ 个分量 $z_{jt}$ 的观测值向量。那么，$\boldsymbol{z}_t$ 的协方差矩阵由样本协方差矩阵 $\widehat{\Gamma}(0)
  = \boldsymbol{Z}'' \boldsymbol{Z} / T$ 估计，该矩阵的特征值-特征向量对 $(\lambda_i, \boldsymbol{c}_i)$
  可用于构建 PC。第一个 PC 由 $\boldsymbol{y}_1 = \boldsymbol{Z} \boldsymbol{c}_1$ 给出，其中


  $$\frac{1}{T} \boldsymbol{Z}'' \boldsymbol{Z} \boldsymbol{c}_1 = \lambda_1 \boldsymbol{c}_1,
  \quad \boldsymbol{c}''_1 \boldsymbol{c}_1 = 1.$$


  对上述方程左侧乘以 $\boldsymbol{Z}$，得


  $$\frac{1}{T} \boldsymbol{Z} \boldsymbol{Z}'' \boldsymbol{y}_1 = \lambda_1 \boldsymbol{y}_1.
  \tag{1.21}$$


  因此，$\boldsymbol{z}_t$ 的第一个 PC $\boldsymbol{y}_1$ 与矩阵 $\boldsymbol{Z} \boldsymbol{Z}''$
  最大特征值对应的特征向量成正比。其他 PC 可以通过类似方式获得。


  引入 PCA 的另一种方法是基于数据的最优重构或插值。为简化起见，我们与之前一样考虑均值调整的平稳时间序列数据的样本版本，即 $\{\boldsymbol{z}_1,
  \dots, \boldsymbol{z}_T\}$。我们想要得到一个新的时间序列 $f_{1t}$，定义为 $\boldsymbol{z}_t$ 的一个线性组合，以最小化观测数据重构中的误差。更正式地说，令
  $f_{1t} = \boldsymbol{z}''_t \boldsymbol{\beta}_1$ 和 $\boldsymbol{f}_1 = \boldsymbol{Z}
  \boldsymbol{\beta}_1$，其中 $\boldsymbol{\beta}_1 = (\beta_{11}, \dots, \beta_{k1})''$
  且 $\boldsymbol{f}_1 = (f_{11}, \dots, f_{1T})''$。系数 $\beta_{i1}$ 通过最小化目标函数获得


  $$L(\boldsymbol{\beta}_1, \boldsymbol{f}_1) = \sum_{t=1}^T \sum_{i=1}^k (z_{it}
  - \beta_{i1} f_{1t})^2. \tag{1.22}$$


  由于 $f_{1t}$ 和 $\boldsymbol{\beta}_1$ 都是未知的，公式 (1.22) 的解没有明确定义，因为 $\beta_{i1} f_{1t}
  = (\beta_{i1} / h) (h f_{1t}) = \beta^*_{i1} f^*_{1t}$，其中 $h$ 是任意非零实数。为克服非唯一性的难题，我们假设
  $f_{1t}$ 满足 $\sum_{t=1}^T f_{1t}^2 = 1$。这样 $f_{1t}$ 的尺度即可确定，我们可以对 $\beta_{i1}$ 求
  $L$ 的偏导数。将偏导数设为零，我们得到


  $$\hat{\beta}_{i1} = \frac{\sum_{t=1}^T z_{it} f_{1t}}{\sum_{t=1}^T f_{1t}^2} =
  \sum_{t=1}^T z_{it} f_{1t}, \quad i=1, \dots, k, \tag{1.23}$$


  或者，以向量形式，$\widehat{\boldsymbol{\beta}}_1 = \boldsymbol{Z}'' \boldsymbol{f}_1$。使用
  $\boldsymbol{f}_1 = \boldsymbol{Z} \boldsymbol{\beta}_1$，我们得到


  $$\widehat{\boldsymbol{\beta}}_1 = \boldsymbol{Z}'' \boldsymbol{Z} \widehat{\boldsymbol{\beta}}_1,$$

  因此，\(\hat{\beta}_1\) 是矩阵 \(\mathbf{Z}''\mathbf{Z}\) 的一个未归一化特征向量。

  类似地，我们可以对 \(f_{1t}\) 求 \(L\) 的偏导数并得到


  \(f_{1t} = \frac{\sum_{i=1}^k z_{it} \beta_{1i}}{\sum_{i=1}^k \beta_{1i}^2}, \quad
  t = 1, \dots, T.\)


  公式 (1.24) 的分子可以写为 \(\mathbf{z}''_t(\mathbf{Z}''\mathbf{f}_1)\)。令 \(c = \sum_{i=1}^k
  \beta_{1i}^2$，将公式 (1.23) 代入公式 (1.24)，并使用矩阵表示法，我们得到


  \(\mathbf{ZZ}''\mathbf{f}_1 = c\mathbf{f}_1.\)


  这意味着 \(\mathbf{f}_1\) 是与特征值 \(c\) 相关的矩阵 \(\mathbf{ZZ}''\) 的一个特征向量。

  公式 (1.22) 中的函数是最小二乘估计的目标函数，拟合值由 \(\mathbf{ZZ}''\mathbf{f}_1\) 给出。因此，在估计值处计算的目标函数值为


  \(\begin{aligned} \widehat{L} &= \sum_{t=1}^T \sum_{i=1}^k z_{it}^2 - [\mathbf{ZZ}''\mathbf{f}_1]''(\mathbf{ZZ}''\mathbf{f}_1)
  \\ &= \sum_{t=1}^T \sum_{i=1}^k z_{it}^2 - \mathbf{f}_1''\mathbf{ZZ}''(c\mathbf{f}_1)
  \\ &= \sum_{t=1}^T \sum_{i=1}^k z_{it}^2 - c^2, \end{aligned}\)


  其中我们使用了 \(\mathbf{f}''_1\mathbf{f}_1 = \sum_{t=1}^T f_{1t}^2 = 1\)。因此，为使目标函数 \(\widehat{L}\)
  达到最小值，我们选择 \(c\) 为矩阵 \(\mathbf{ZZ}''\) 的最大特征值。向量 \(\mathbf{f}_1\) 不等于第一个 PC \(\mathbf{y}_1\)，因为它的方差为
  1，而 PC 的方差为 \(\lambda_1\)，但除此之外的缩放效应，它们是相同的，因为两者都与矩阵 \(\mathbf{ZZ}''\) 的特征向量成正比，如
  (1.21) 和 (1.25) 所示。


  对于第二个样本 PC，我们可以通过将观测数据 \(\mathbf{z}_t\) 替换为残差 \(\boldsymbol{\epsilon}_t = \mathbf{z}_t
  - \hat{\beta}_1 f_{1t}\) 来遵循类似程序。此过程可以重复，直到引入所有样本 PC。


  总之，两种方法得到了相同的结果，只是尺度不同。在第一种方法中，最大方差的线性组合由协方差矩阵的特征向量的单位范数向量定义，PC 具有不同的方差。在第二种方法中，最优插值由与协方差矩阵特征值成正比的向量定义，线性组合被标准化为具有单位方差。


  ### 1.5.1 讨论


  我们使用方差分解和重构方法都介绍了 PCA。然而，两个版本之间存在微妙差异。在第一种情况下，我们假设平稳性。另一方面，对于给定的数据集，重构方法可以应用于任何时间系列。






  ### 1.5.2 主成分的性质


  从介绍可知，平稳向量过程 \(\mathbf{z}_t\) 的主成分 \(\mathbf{y}_t = (y_{1t}, \dots, y_{kt})''\)
  是观测数据的线性变换，并按其变异性排序，使得 \(y_{1t}\) 具有最大方差。特别是，\(\text{Var}(y_{it}) = \lambda_i\)，这是
  \(\mathbf{z}_t\) 协方差矩阵的第 \(i\) 大特征值。由于 \(\sum_{i=1}^k \text{Var}(z_{it}) = \sum_{i=1}^k
  y_{it}(0) = \text{tr}[\Gamma(0)]\)，其中 \(\text{tr}[\Gamma(0)]\) 表示矩阵 \(\Gamma(0)\)
  的迹，且 \(\text{tr}[\Gamma(0)] = \sum_{i=1}^k \lambda_i\)，我们可以看出主成分保留了向量过程 \(\mathbf{z}_t\)
  的总变异性。


  接下来，令 \(\mathbf{e}_i\) 为 \(\Gamma(0)\) 与特征值 \(\lambda_i\) 相关联的特征向量，满足 \(\mathbf{e}''_i
  \mathbf{e}_i = 1\)。我们有 \(\mathbf{y}_t = \mathbf{P}'' \mathbf{z}_t\)，其中 \(\mathbf{P}
  = [\mathbf{e}_1, \dots, \mathbf{e}_k]\) 是特征向量矩阵。该变换矩阵是正交矩阵，因此 \(\mathbf{P}\mathbf{P}''
  = \mathbf{P}''\mathbf{P} = \mathbf{I}\)。因而，\(1 = |\mathbf{P}\mathbf{P}''| = |\mathbf{P}||\mathbf{P}''|\)。由变换得，\(\text{Cov}(\mathbf{y}_t)
  = \mathbf{P}''\text{Cov}(\mathbf{z}_t)\mathbf{P}\)。利用 \(|\mathbf{P}||\mathbf{P}''|
  = 1\)，可得 \(|\text{Cov}(\mathbf{y}_t)| = |\text{Cov}(\mathbf{z}_t)|\)，这意味着 \(\mathbf{y}_t\)
  的广义方差与 \(\mathbf{z}_t\) 相同。


  PCA 的一项重要应用是降低向量过程的维度。若一标量随机过程的方差接近零，则其接近常数序列。因此，与特征值 \(\lambda_i \approx 0\) 相关联的主成分对底层过程
  \(\mathbf{z}_t\) 所包含的信息很少。如前所述，前 \(m\) 个主成分对 \(\mathbf{z}_t\) 中变异性的解释比例为 \((\sum_{i=1}^m
  \lambda_i)/(\sum_{k=1}^k \lambda_k)\)。在实践中，可以选择一个 \(m\)，使得前 \(m\) 个主成分 \(\{y_{it}
  | i = 1, \dots, m\}\) 解释 \(\mathbf{z}_t\) 相当一部分的变异性。文献中已提出一些方法以辅助选择 \(m\)。一种常用但非正式的方法是
  *碎石图（scree plot）*，即 \(\lambda_i\) 关于 \(i\) 的散点图。为选择 \(m\)，需在碎石图中寻找拐点（转折点）。


  ## 示例 1.3


  为演示 PCA，我们再次考虑图 1.7 中所示的 33 个月度价格指数。在本示例中，我们采用价格指数的对数。令 \(\mathbf{z}_t\) 为 2000
  年 1 月至 2015 年 10 月间 33 个月度价格指数的对数序列，共 190 个观测值。图 1.7 中所示价格序列的一个关键特征是上升趋势。这些趋势并非同步变化，因为不同的价格序列可能以不同速度上升。我们对
  \(\mathbf{z}_t\) 应用 PCA 并得到表 1.1 中的结果。


  由表 1.1 可见，（a）特征值 \(\lambda_i\) 随 \(i\) 增加而快速衰减，（b）第一个主成分单独即解释了数据中约 95.8% 的变异性，（c）第二个主成分解释了总变异性约
  3.3%。事实上，前



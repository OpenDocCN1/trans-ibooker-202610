  \ has the information of the 1st component, sal[[2]] of the\n#### second component\
  \ and so on.\n> f1<- sal[[1]]$f\n> a1<- sal[[1]]$a\n> f2<- sal[[2]]$f\n> a2<- sal[[2]]$a\n\
  > y1 <- range(f1)\n> tdx <- c(5:76)/4+2000\n```\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_343_0.png)\n\

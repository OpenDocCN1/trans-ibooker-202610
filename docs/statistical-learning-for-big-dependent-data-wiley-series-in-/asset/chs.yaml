  \n作为第二个示例，我们使用文件 Pelectricity1344.csv 中的电价数据。数据涵盖美国新英格兰（NE）八个地区在 678 周内每天每小时的每周电价系列，共有\
  \ 1344 个系列。请注意，此处 k > T。系列对应于一周中的每一天、每天中的每个小时以及 NE 中的八个地区之一。即，7 × 24 × 8 = 1344。使用相同的\
  \ R 命令，得到图 5.6 和 5.7。两组数据的图表相似，但其尺度表明电价似乎比 PM2.5 测量值更具同质性。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_243_0.png)\n\
  \n图 5.4 台湾 AirBox 数据相关系数行列式之间距离的直方图。\n\n### 相关系数行列式的平均距离\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_243_1.png)\n\
  \n图 5.5 台湾 AirBox 数据相关系数行列式之间的平均距离。\n\n### 5.1.3 基于交叉线性依赖的不相异性\n\n前面的措施比较了一些刻画单个时间序列序列依赖的特征，但它们不考虑任何两个系列之间的依赖。我们已经看到，两个时间序列值之间的欧氏距离仅取决于滞后为零的自相关。比较两个系列线性依赖的替代方法是使用不相异性\
  \ D(xr, yi)，它们是\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_244_0.png)\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_244_1.png)\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_244_2.png)\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_244_3.png)\n\
  \n图 5.6 电价数据单变量系列之间四个距离措施的直方图。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_244_4.png)\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_244_5.png)\n\n图 5.7 电价数据行列式之间的直方图和距离。\n\
  \n为正且对称。此外，我们希望 0 ≤ D(xt, yt) ≤ 1，当两个系列相同时值为 0，且当且仅当两个时间序列之间所有交叉相关系数均为零时值为 1。因此，D(xt,\
  \ yt) 的极端值意味着完全线性依赖或完全缺乏线性依赖。最后，我们通常关心两个系列之间依赖的强度而非符号。这些考虑导致了以下措施。\n\n考虑交叉相关向量\n\
  \n$\\rho_{xy} = [\\rho_{xy}(-h), \\dots, \\rho_{xy}(-1), \\rho_{xy}(0), \\rho_{xy}(1),\
  \ \\dots, \\rho_{xy}(h)]'$,\n(5.13)\n\n其中 \\(h\\) 是正整数且 \\(\\rho_{xy}(-h) = \\rho_{yx}(h)\\\
  )。作为两个系列之间线性依赖的措施，我们可以使用欧几里得范数\n\n\\(\\|\\rho_{xy}\\| = \\sqrt{\\rho'_{xy}\\rho_{xy}}\
  \ = \\sqrt{\\sum_{j=-h}^{h} \\rho_{xy}^2(j)}\\)。\n\n但是 \\(\\|\\rho_{xy}\\|\\) 不是\
  \ \\(x_t\\) 和 \\(y_t\\) 之间的距离，因为它不满足三角不等式 \\(\\|\\rho_{xy}\\| \\le \\|\\rho_{xz}\\\
  | + \\|\\rho_{yz}\\|\\)。例如，假设 \\(x_t\\) 和 \\(y_t\\) 相关，使得 \\(\\|\\rho_{xy}\\| >\
  \ 0\\)，但 \\(z_t\\) 与这两个系列都不相关，使得 \\(\\|\\rho_{xz}\\| = \\|\\rho_{yz}\\| = 0\\)。另一方面，如果\
  \ \\(x_t\\) 和 \\(y_t\\) 独立，则 \\(\\|\\rho_{xy}\\| = 0\\)。另外，如果 \\(x_t = ay_t + b\\\
  )，其中 \\(a\\) 和 \\(b\\) 是实数且 \\(a \\neq 0\\)，则 \\(\\|\\rho_{xy}\\| = \\|\\rho_{xx}\\\
  | = \\|\\rho_{yy}\\|\\)，其中根据 (5.13)\n\n\\(\\rho_{yy} = [\\rho_y(-h), \\dots, \\\
  rho_y(-1), 1, \\rho_y(1), \\dots, \\rho_y(h)]'\\)。\n\n因此，我们可以基于线性依赖构建两个系列之间的不相异性\n\
  \n\\(D_{CC2}(x_t, y_t) = 1 - \\frac{\\|\\rho_{xy}\\|^2}{\\|\\rho_{xx}\\|\\|\\rho_{yy}\\\
  |}.\\)\n(5.14)\n\n显然，如果两个系列独立，则 \\(D_{CC2}(x_t, y_t) = 1\\)，如果两个系列相同，则 \\(D_{CC2}(x_t,\
  \ y_t) = 0\\)。然而，用交叉相关系数向量的范数来总结依赖关系的一个缺点是，该措施对滞后的排列具有不变性。因此，具有相同全局依赖关系的两个系列可能在滞后之间具有非常不同的系数分布。另外，时间上移位的两个相同时间序列可能表现为不同。例如，\\\
  (y_t = x_{t-1}\\)。\n\n总结全局线性依赖的更好方法是使用矩阵 \\(R_{yx,h}\\)，它对应于由平稳向量过程 \\(Z_t = (y_t,\
  \ y_{t-1}, \\dots, y_{t-h}, x_t, x_{t-1}, \\dots, x_{t-h})'\\) 给出的相关系数矩阵，即\n\n\\\
  (R_{yx,h} = \\begin{pmatrix} R_{y,h} & C'_{xy,h} \\\\ C_{xy,h} & R_{x,h} \\end{pmatrix},\\\
  )\n(5.15)\n\n其中 \\(R_{x,h}\\) 是前面定义的 \\(x_t\\) 的 \\((h+1) \\times (h+1)\\) 半正定相关系数矩阵，\\\
  (R_{y,h}\\) 对应于 \\(Y_{t,h} = (y_t, y_{t-1}, \\dots, y_{t-h})'\\) 的相关系数矩阵，而 \\(C_{xy,h}\\\
  ) 包含两个向量系列之间的交叉相关。请注意，\\(|R_{yx,h}| = |R_{xy,h}|\\)，且行列式验证了（1）\\(0 \\le |R_{yx,h}|\
  \ \\le 1\\)，当 \\(R_{yx,h}\\) 为对角矩阵且两个系列都序列不相关且线性无关时等号成立；（2）当存在非平凡线性组合 \\(a'Z_t =\
  \ 0\\) 使得系列恰好线性相关时，\\(|R_{yx,h}| = 0\\)。一种可能的相似性措施是两个时间序列之间的 *总相关*，如 (5.11) 所示，给出为\n\
  \n\\(TC_h = 1 - |R_{yx,h}|^{1/[2(h+1)]},\\)\n(5.16)\n\n\n\n\n但此指标既取决于两个系列的互相关，也取决于它们的自相关。如\n\
  \n```\n|R_{xy,h}| = |R_{x,h}| \\left| R_{y,h} - C_{xy,h} R_{x,h}^{-1} C'_{xy,h}\
  \ \\right|,\n```\n\n如果两个系列无关，且 C_{xy,h} = 0，则 |R_{xy,h}| = |R_{x,h}|/|R_{y,h}|，且该值可能远离\
  \ 1。事实上，如果两个系列都具有强自相关，则该值将非常小。例如，如果第一阶自相关系数接近 1，则 |R_{x,1}| = 1 - \\rho_x^2 将非常小。其次，如果两个系列相同，则\
  \ |R_{xy,h}| = 0 且 TC = 1，但行列式的小值或 TC 的大值并不意味着系列之间存在强关系。例如，如果 |R_{x,h}| 非常小，因为系列\
  \ x_t 中存在强自相关，则根据 (5.17)，|R_{yx,h}| 也将很小。\n\n两个系列 x_t 和 y_t 之间平均线性相关的一个度量是广义互相关度量\
  \ GCC(x_t, y_t)，由 Alonso 和 Peña (2019) 定义为\n\n```\nGCC(x_t, y_t) = 1 - \\left( \\\
  frac{|R_{yx,h}|}{|R_{x,h}| |R_{y,h}|} \\right)^{1/(h+1)}\n= 1 - \\frac{|R_{y,h}\
  \ - C_{xy,h} R_{x,h}^{-1} C'_{xy,h}|^{1/(h+1)}}{|R_{y,h}|^{1/(h+1)}}.\n```\n\nGCC\
  \ 验证：(1) GCC(x_t, y_t) = GCC(y_t, x_t)，因此该度量是对称的；(2) 根据 Fischer 不等式（参见 Lütkepohl,\
  \ 1996），0 <= GCC(x_t, y_t) <= 1；(3) GCC(x_t, y_t) = 1 当且仅当系列之间存在完美的线性相关；以及 (4) GCC(x_t,\
  \ y_t) = 0 当且仅当所有互相关系数均为零。\n\n要证明 (3)，由于 GCC(x_t, y_t) = 1 意味着 |R_{yx,h}| = 0（因为分母有界），因此至少存在一行（一列）是其他行（列）的线性组合。要证明\
  \ (4)，将 GCC(x_t, y_t) 写为\n\n```\nGCC(x_t, y_t) = 1 - \\left| \\begin{pmatrix} R_{x,h}^{-1}\
  \ & 0_{xy,h} \\\\ 0_{yx,h} & I_{y,h} \\end{pmatrix} \\begin{pmatrix} R_{x,h} & C_{xy,h}\
  \ \\\\ C'_{xy,h} & R_{y,h} \\end{pmatrix} \\begin{pmatrix} I_{x,h} & 0_{xy,h} \\\
  \\ 0_{yx,h} & R_{y,h}^{-1} \\end{pmatrix} \\right|^{1/(h+1)}\n= 1 - \\left| \\begin{pmatrix}\
  \ I_{x,h} & R_{x,h}^{-1} C_{xy,h} R_{y,h}^{-1} \\\\ C_{xy,h} & I_{y,h} \\end{pmatrix}\
  \ \\right|^{1/(h+1)}.\n```\n\n根据 Hadamard 不等式，右侧行列式小于或等于 1，当且仅当矩阵是对角矩阵时取等号，即当且仅当\
  \ C_{xy,h} = 0_{xy,h}。\n\n请注意，当 h = 0 时，GCC(x_t, y_t) 只是两个变量之间的平方相关系数。另外，对于任何 h，当两个系列都是白噪声，且对于某些\
  \ h != 0 有 \\rho_{xy}(h) != 0，而对所有 j != h 有 \\rho_x(j) = 0 时，则 GCC(x_t, y_t) = \\\
  rho_{xy}^2(h)。一般而言，对于 h > 0，可以证明（参见 Alonso 和 Peña, 2019），GCC(x_t, y_t) 表示双变量模型相对于单变量模型的预测精度提升，并且可以解释为当用另一个变量的值来解释一个变量的\
  \ AR 拟合残差时的平均平方相关系数。\n\n总之，两个平稳时间序列之间的一个有用差异度量是\n\n当两个系列线性相关（或如果标准化后相同）时取值 0，当它们的所有互相关系数均为\
  \ 0 时取值 1。对于仅具有瞬时相关 \\(\\rho_{xy}(0)\\) 的两个白噪声过程，\\(D_{GCC} = 1 - \\rho_{xy}^2(0)\
  \ = D_{CC2}(x_t, y_t)\\)。\n\n### 示例 5.2\n\n为了说明基于线性相关的差异计算，我们再次使用示例 5.1 中的台湾 AirBox\
  \ 数据和新英格兰电力价格数据。以下是用于计算公式 (5.14) 和 (5.19) 中差异度量的 R 命令。命令 `GCCmatrix` 是图书包的一部分。\n\
  \n```\n#######Compute the GCC measure\n### Continue from Example 5.1.\n> MCC=matrix(0,k,k)\n\
  > for (i in 1:k){\n> for (j in 1:k){\n> ab=ccf(x[,i],x[,j],lag.max=h,plot=FALSE)\n\
  > aa=acf(x[,i],lag.max=h, plot=FALSE)\n> bb=acf (x[,j],lag.max=h, plot=FALSE)\n\
  > aa2=c(aa$acf,aa$acf)\n> aa2=aa2 [-1]\n> bb2=c(bb$acf,bb$acf)\n> bb2=bb2 [-1]\n\
  > ma=sqrt (sum(aa2*aa2))\n> mb=sqrt (sum(bb2*bb2))\n> mab=sum (ab$acf*ab$acf)\n\
  > MCC [i,j]=1-mab/(ma*mb) } }\n> par (mfrow=c(1,2) )\n> hist (MCC[MCC>.01],main=\"\
  distribution of D (CC) \")\n##Compute the GCC matrix\n>res1=GCCmatrix (z, 4)\n>DM=res1$DM\n\
  >Dm=DM[Dm<1]\n>hist (Dm, main=\"distribution of D (GCC) \")\n```\n\n图 5.8 给出了台湾\
  \ AirBox 数据的 GCC 差异直方图。大多数系列具有较大的差异，表明它们不相关，但存在一小群高度相关的系列。例如，最相关系列（发生在第 312 系列和第\
  \ 315 系列之间）的平均平方相关系数为 GCC = 1 − 0.202 ≈ 0.8。电力价格数据的情况则相当不同，其中大多数系列都存在互相关，差异较小，如图\
  \ 5.9 所示。\n\n### D(CC) 的分布\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_248_0.png)\n\
  \n### D(GCC) 的分布\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_248_1.png)\n\n图 5.8\
  \ 台湾 Air-Box 数据中系列之间 CC 和 GCC 差异的直方图。参见公式 (5.14) 和 (5.19)。\n\n### D(CC) 的分布\n\n\
  ![](img/d4c84ae3c2178f4c506af3dd2ed13122_248_2.png)\n\n### D(GCC) 的分布\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_248_3.png)\n\
  \n图 5.9 电力价格数据中系列之间 CC 和 GCC 差异的直方图。参见公式 (5.14) 和 (5.19)。\n\n## 5.2 时间序列的层次聚类\n\n\
  层次聚类方法从时间序列之间的近接矩阵（距离或差异）**D** 开始，然后基于该矩阵构建层次结构。所使用的算法有以下两种类型。第一种是自底向上（聚合）方法，它从与单个系列数量相同的组开始，在随后的每个步骤中利用近接度合并两个组。该过程持续进行，直到所有系列都属于一个组。第二种是自顶向下（分割）方法，它从所有系列位于一个组开始，然后经过连续的分割直到到达单个系列。在两种方法中，都使用一个标准来选择适合观测数据的组数。但是，没有规定对早期步骤中错误分组的任何系列进行重新分配。换句话说，一旦两个组被合并或分割，它们在随后的任何步骤中都无法更改。对于大型时间序列集合，自底向上算法需要的计算时间较少，因此在实践中最常用。从现在起，层次方法将指代它们。一个层次自底向上算法通常包括以下三个步骤：\n\
  \n- 1. 将 k 个原始时间序列定义为待聚类的元素，并在元素 u 和 v 之间构建近接矩阵 **D**，其中 u, v = 1, ..., k。设置 i =\
  \ 1 且 **D**<sub>i</sub> = **D**。将 **D**<sub>i</sub> 的 (u, v) 元素表示为 d<sub>(uv)</sub>。\n\
  \n- 2. 在 **D**<sub>i</sub> 中找到最小距离，设 d<sup>(i)</sup> = min<sub>u,v</sub>{d<sub>(uv)</sub>}。选择一对元素，使其距离等于最小值\
  \ d<sup>(i)</sup>。将该对分组形成一个新元素。计算新元素与其他元素之间的距离。（计算这些距离的方法将在下一节中讨论）。元素总数减少 1。将 i\
  \ 增加 1，并将更新后的距离矩阵也表示为 **D**<sub>i</sub>。\n\n- 3. 使用更新后的 **D**<sub>i</sub> 矩阵返回步骤\
  \ 2，重复合并过程，直到元素数量变为 1。\n\n该聚类过程需要 k 次迭代才能完成，最小距离序列可表示为 d<sup>(1)</sup> ≤ d<sup>(2)</sup>\
  \ ≤ ... ≤ d<sup>(k)</sup>。我们稍后将使用这些最小距离来帮助确定聚类数量。\n\n### 5.2.1 定义组间距离的标准\n\n假设我们有一个元素\
  \ A，它是一个包含 n<sub>a</sub> ≥ 1 个时间序列的组，以及另一个包含 n<sub>b</sub> ≥ 1 个系列的元素 B。它们合并形成一个新元素\
  \ (AB)，该元素包含 n<sub>ab</sub> = n<sub>a</sub> + n<sub>b</sub> 个时间序列。这个新元素 (AB) 到另一个包含\
  \ n<sub>c</sub> 个时间序列的元素 C 之间的距离，通常使用以下三种方法之一计算：\n\n- 1. 最近邻法（或最邻近法）：C 与 (AB) 之间的距离是\
  \ C 中的时间序列与 A 或 B 中的时间序列之间距离的最小值。从数学上讲，我们有\n\n  d(C; AB) = min{d<sub>CA</sub>, d<sub>CB</sub>}。\n\
  \n\n\n由于该标准仅考虑最小距离，可能会发生 C 中的一个序列与 (AB) 中的一个序列相距很远的情况，即使 d(C, AB) 很小。在实践中，该标准倾向于产生绵长的聚类，这些聚类两端可能包含相当不相似的元素。\n\
  \n- 2. 全连接法或最远邻法：C 与新元素 (AB) 之间的距离是 C 中的一个序列与 A 或 B 中的一个序列之间的最大距离。即，\n  \\( d(C,\
  \ AB) = \\max\\{d_{CA}, d_{CB}\\} \\)。\n\n由于该标准查找最大距离，因此有可能元素 C 离 A 中的元素比离 B 中的元素更近，尽管\
  \ C 中的大多数时间序列离 B 中的时间序列比离 A 中的时间序列更近。在实践中，该标准倾向于产生球形聚类。\n\n- 3. 平均连接法：C 与新组 (AB)\
  \ 之间的距离是 C 与 (AB) 中元素之间的距离的平均值。即\n  \\( d(C, AB) = \\frac{\\sum_{c \\in C} \\sum_{g\
  \ \\in AB} d_{cg}}{n_c n_{ab}} \\),\n\n其中 \\( n_{ab} \\) 是 (AB) 中的时间序列数量。该标准是前两种标准之间的折中方案。主要缺点是，所得距离取决于\
  \ C 和 AB 中的元素数量，而另外两个标准则不取决于组中的元素数量。\n\n### 5.2.2 树状图\n\n树状图，或层次树状图，是一种使用层次算法展示聚类结果的树状图形显示。如果序列遵循层次结构，这种显示很有用，但否则可能会产生误导。此外，对于大型数据集，它很难理解。树状图的构建方式如下：\n\
  \n- 1. k 个初始序列显示在图表的底部。\n- 2. 序列之间的融合用三条直线表示：两条垂直直线连接序列，一条水平直线指示发生融合的（距离）水平。\n-\
  \ 3. 该过程重复进行，直到所有序列都由直线连接。\n\n如果在任何给定距离（高度或深度）处切断树状图，我们就能在该距离水平上得到时间序列的分组分类。每个组的成员也可用。在下一节中，我们将讨论确定组数的一些程序。\n\
  \n### 5.2.3 选择组数\n\n#### 5.2.3.1 高度图和步长图\n\n层次聚类的输出包括两个元素合并时的不相异性或距离序列 \\( d^{(1)}\
  \ \\le d^{(2)} \\le \\cdots \\le d^{(k)} \\)。这些距离对应于树状图中的高度。不难想象，如果 \\( d^{(i)}\
  \ \\) 和 \\( d^{(i+1)} \\) 很接近，那么由高度 \\( d^{(i)} \\) 形成的元素与由高度 \\( d^{(i+1)} \\)\
  \ 形成的元素之间的差异相对较小。因此，树状图中的高度及其增量\n\\(\\Delta_i = d^{(i+1)} - d^{(i)}\\) 提供了关于聚类数量的某些信息。为了利用这些信息来确定聚类数量，我们针对一组时间序列\
  \ \\(\\{\\boldsymbol{z}_1, \\dots, \\boldsymbol{z}_T\\}\\) 提出了 *高度图* 和 *步长图*，其中\
  \ \\(\\boldsymbol{z}_t\\) 是一个 k 维时间序列：\n\n- 1. 选择之前讨论的距离度量之一，例如 ACF 距离，为 \\(\\boldsymbol{z}_t\\\
  ) 构建树状图。\n- 2. 设 \\(y_t\\) 为从 \\(\\boldsymbol{z}_t\\) 中随机选择的序列。\n- 3. 为 \\(y_t\\\
  ) 构建时间序列模型。为简单起见，我们专注于 AR 模型，其阶数由信息准则选择，例如赤池信息准则 (AIC) 或贝叶斯信息准则 (BIC)。\n- 4. 执行以下模拟\
  \ \\(M\\) 次迭代：\n  - a. 对于第 \\(j\\) 次迭代，使用随机选择的系列 \\(y_t\\) 的 AR 模型生成 \\(k\\) 个样本量为\
  \ \\(T\\) 的时间序列。将第 \\(j\\) 次迭代的模拟数据表示为 \\(\\{z_t^{(j)}\\}\\)。\n  - b. 对 \\(\\{z_t^{(j)}\\\
  }\\) 应用相同的距离度量，以获得树状图，并将其最小距离集合称为 \\(\\{d_j^{(1)} \\le d_j^{(2)} \\le \\cdots \\\
  le d_j^{(k)}\\}\\)。\n- 5. 设 \\(\\lambda_{0.95}^{(i)}\\) 为集合 \\(\\{d_j^{(i)} | j=1,\
  \ \\dots, M\\}\\) 的第 \\(95\\%\\) 百分位数。\n- 6. 考虑观测数据 \\(\\{\\boldsymbol{z}_t\\}\\\
  ) 的 \\(\\{d^{(i)} | i=1, \\dots, k\\}\\) 关于 \\(i\\) 的散点图。在散点图中添加线 \\(\\{\\lambda_{0.95}^{(i)}\\\
  }\\) 关于 \\(i\\)。聚类数量则为 \\(g+1\\)，其中 \\(g\\) 是散点图右端位于 \\(\\lambda_{0.95}^{(i)}\\\
  ) 线上方的点的数量。\n\n我们将此图称为树状图的 *高度图*。由于模拟时间序列均来自单一模型，每组序列 \\(\\{z_t^{(j)}\\}\\) 应只有一个聚类。因此，高度\
  \ \\(\\{d_j^{(i)}\\}\\) 除了高度的尺度外没有特殊含义。那么，使用这些高度来为观测数据的高度 \\(\\{d^{(i)}\\}\\) 的行为提供参考点是合理的。如果观测数据来自单一聚类，则\
  \ \\(d^{(i)}\\) 的行为应与模拟参考相似。因此，由 \\(95\\%\\) 百分位数 \\(\\{\\lambda_{0.95}^{(i)} |\
  \ i=1, \\dots, k\\}\\) 给出的参考线的偏离，表明聚类的存在。\n\n与其直接使用高度 \\(d^{(i)}\\)，不如获得高度增量 \\\
  (\\{D_i | i=1, \\dots, k\\}\\)（即步长）关于索引 \\(i\\) 的散点图。这称为 *步长图*。参考线则是高度 \\(95\\%\\\
  ) 百分位数的增量。\n\n为说明这一点，我们考虑包含 PM\\(_{2.5}\\) 数据逐小时序列的 Taiwan AirBox 数据集。在移除离群序列（29\
  \ 和 70）后，我们有 \\(k=514\\) 和 \\(T=744\\)。图 5.10 显示了所得高度图。从图中看，有两个点相对于建议模拟程序（\\(M=100\\\
  ) 次迭代）所得参考线显得突出。因此，高度图表明数据集中存在三个聚类。图 5.11 显示了所得步长图。在此特定情况下，步长图表明 AirBox PM\\(_{2.5}\\\
  ) 数据集有两个聚类，但也为三个聚类提供了一些支持。这些图是通过本书包的命令 `stepp` 获得的。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_252_0.png)\n\
  \n图 5.10 Taiwan AirBox PM2.5 数据集树状图高度的散点图。实线是使用单一模型对数据中随机选择的系列进行模拟所得的参考线。距离度量使用\
  \ ACF。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_252_1.png)\n\n图 5.11 Taiwan AirBox\
  \ PM2.5 数据集树状图高度增量的散点图。实线是使用单一模型对数据中随机选择的系列进行模拟所得的参考线。距离度量使用 ACF。\n\n#### 5.2.3.2\
  \ 轮廓统计量\n\nRousseeuw (1987) 提出的轮廓统计量，用于计算最终聚类结果的质量度量，并选择聚类数量以最大化该质量度量。一个元素的分类质量可以定义为其与其组内成员的平均距离与其与其所属组中最近组成员的平均距离之差。因此，给定元素之间的距离度量和聚类结果后，一个元素到其组内所有成员的平均距离将与其到其最近组成员的平均距离进行比较。一个元素的最近组被定义为不同于该元素所属组、且具有与该元素最小平均距离的成员的组。如果元素分类良好，其到其组内元素的平均距离应小于到其最近组元素的平均距离，差异越大，该元素分类质量越好。此思想可以扩展到集合中的所有元素，并将给定分类的质量定义为所有元素分类质量的平均值。其计算方法如下。\n\
  \n假设我们有观测值分为 \\(g\\) 个组（例如 \\(G_1, \\dots, G_g\\)，且 \\(g > 1\\)）的分类。设 \\(d(i, i')\\\
  ) 为用于构建组的距离或不相异性。设 \\(a(i)\\) 为第 \\(i\\) 个元素到其组内其他元素的平均距离。例如，如果第 \\(i\\) 个观测值属于具有\
  \ \\(n_j\\) 个成员的组 \\(G_j\\)，且 \\(i'\\) 是该组的其他任何成员，则 \\(a(i)\\) 由以下公式给出：\n\n\\[a(i)\
  \ = \\frac{\\sum_{i' \\in G_j} d(i, i')}{n_j - 1} .\\]\n\n为了判断 \\(a(i)\\) 的值，即元素\
  \ \\(i\\) 是否分类良好，我们将 \\(a(i)\\) 与第 \\(i\\) 个元素到其他组 \\(G_h\\)（\\(h = (1, \\dots,\
  \ g, | h \\neq j)\\)）成员的平均距离进行比较。到具有 \\(n_h\\) 个元素的组 \\(G_h\\) 的平均距离由以下公式给出：\n\n\
  \\[b_{G_h}(i) = \\frac{\\sum_{j \\in G_h} d(i, j)}{n_h} .\\]\n\n将第 \\(i\\) 个观测值的最近组定义为平均距离最小的组。请注意，最近组的概念是针对特定元素定义的，且同一组的不同成员通常可能有不同的最近组。设\
  \ \\(c(i)\\) 为组 \\(G_j\\) 中第 \\(i\\) 个元素到其最近组的平均距离，计算如下：\n\n\\[c(i) = \\min_{h \\\
  neq j} [b_{G_h}(i)] .\\]\n\n然后，第 \\(i\\) 个观测值的分类质量定义为\n\n\\[s(i) = \\frac{c(i) -\
  \ a(i)}{\\max(a(i), c(i))} .\\]\n\n该度量称为元素 \\(i\\) 的 *轮廓度量*。如果 \\(c(i) > a(i)\\\
  )，则元素分类良好且 \\(s(i) > 0\\)。轮廓度量的最大值为 \\(s(i) = 1\\)，当 \\(a(i) = 0\\) 时发生此情况，因为此时观测值与其组内所有其他成员相同，表明完美拟合。一般来说，对于分类良好的观测值，\\\
  (a(i) < c(i)\\) 且 \\(0 < s(i) < 1\\)。另一方面，当观测值分类不良时 \\(s(i) < 0\\)，这意味着到其最近组的平均距离更小\n\
  \n比其所属组的相似度低。然后，我们应该将第 i 个观测值重新分类到其最近的组。通过这种重新分配，轮廓统计量的新值从 s(i) 移动到 -s(i) 并将为正值。统计量\
  \ s(i) 的最小值为 -1，当 c(i) = 0 时发生，即第 i 个元素与其他某个组的成员相同，暗示与其已被分类到的组完全缺乏相似性。\n\n我们可以查看\
  \ s(i) 值的分布来决定聚类数量。分类质量的一个明显的全局度量是该度量在所有观测值上的平均值。这就是轮廓统计量\n\nS = \\frac{\\sum_{i=1}^n\
  \ s(i)}{n}, (5.20)\n\n其中 n = \\sum n_j 是待分类元素的总数。该数值越大，全局分类效果越好，群组数量根据该准则选择为在 (5.20)\
  \ 中使 S 达到最大值的值。\n\n在实践中，该准则通过固定最大群组数 K_max、在不同高度切割树状图直到达到最大群组数、比较得到的轮廓统计量，并选择轮廓统计量最大的聚类结果，在层次聚类中得到应用。此外，我们可以使用\
  \ s(i) 的整个分布来做出选择。请注意，轮廓统计量不适合用于决定是否应形成聚类，因为当聚类数量为 1 时它未定义。\n\n当群组大小相似时，轮廓准则效果良好，但可能无法找到包含少量元素的群组。原因是，(5.20)\
  \ 中少数具有低负值的元素对平均值的影响较小。此外，异常值的存在可能会影响该统计量。一种稳健的轮廓统计量（以下简称 Rsilh）可以通过先清理相对于群组的离群系列来构建。离群系列可以按以下方式查找：（1）加入群组的距离大于距离分布给定阈值的系列，（2）形成大小小于给定最小尺寸群组的系列。在识别出任何离群系列后，群组分两步获得。首先，将轮廓统计量应用于未孤立的时间系列集合，其次，孤立系列是根据所选距离被分配到其最近群组的候选项，该距离可以是简单连接（群组中最近的元素）或其他距离。如果该系列被视为异常值，则将其包含在离群系列的群组\
  \ 0 中。\n\n#### 5.2.3.3 间隙统计量\n\n选择群组数量的替代方法是 Tibshirani 等人（2001）提出的间隙统计量。该统计量将聚类内部平均距离的度量与数据在其覆盖空间内由均匀分布生成时该度量的期望值进行比较。给定将观测值分类为\
  \ g > 1 个组 G_1, ..., G_g，第 j 个组分类同质性的一个指标是该组元素之间平方距离的平均值\n\nD_j = \\frac{1}{2n_j}\
  \ \\sum_{i, i' \\in G_j} d^2(i, i'),\n\n其中 \\(n_j\\) 是 \\(G_j\\) 中的元素数量，每个距离被包含两次，因此求和除以\
  \ \\(2n_j\\)。聚类的质量度量是平均平方距离之和：\n\n```\n\\( W_g = \\sum_{j=1}^g D_j. \\)\n```\n\n\
  例如，假设每个时间系列由前 \\(p\\) 个自相关系数描述，并记 \\(\\theta_{jr}\\) 为第 j 组（j = 1, ..., g）中第 r 个系列（r\
  \ = 1, ..., n_j）的 \\(p \\times 1\\) ACF 向量。第 j 组元素对之间的欧几里得距离为\n\n```\n\\( D_j =\
  \ \\sum_{r=1}^{n_j} \\sum_{s=1}^{n_j} (\\theta_{jr} - \\theta_{js})'(\\theta_{jr}\
  \ - \\theta_{js}) = 2n_j \\sum_{r=1}^{n_j} (\\theta_{jr} - \\bar{\\theta}_j)'(\\\
  theta_{jr} - \\bar{\\theta}_j) \\)\n```\n\n其中 \\(\\bar{\\theta}_j\\) 是第 j 组的均值向量。因此\n\
  \n```\n\\( W_g = \\sum_{j=1}^g \\sum_{r=1}^{n_j} (\\theta_{jr} - \\bar{\\theta}_j)'(\\\
  theta_{jr} - \\bar{\\theta}_j) = \\sum_{j=1}^g n_j s_j^2 \\)\n```\n\n其中 \\(s_j^2\
  \ = \\sum_{r=1}^{n_j} (\\theta_{jr} - \\bar{\\theta}_j)'(\\theta_{jr} - \\bar{\\\
  theta}_j)/n_j\\) 是第 j 组的方差。因此，\\(W_g\\) 是围绕群组均值的组内平方和，这是衡量分组质量的标准指标。间隙统计量考虑差值\n\n\
  ```\n\\(\\text{Gap}(g) = E(\\log W_g) - \\log W_g,\\)\n```\n\n其中期望是在假设所有数据均来自相同参考分布的前提下计算的。该假设下的期望值与观测平方和之间的差值越大，分类效果越好。参考分布通常取均匀分布，已证明这是最可能产生虚假聚类的分布。程序如下：\n\
  \n- 1. 将 \\(k\\) 个时间系列聚类为 \\(g = 1, 2, \\dots, M\\) 个组，并计算值 \\(W_1, \\dots, W_M\\\
  )。\n\n- 2. 生成 \\(C\\) 个样本，假设每个变量在样本值范围内服从均匀分布，并将聚类方法应用于每个模拟样本，以计算 \\(1 \\le g \\\
  le M\\) 和 \\(1 \\le b \\le C\\) 的值 \\(W_{gb}\\) 和 \\(\\log(W_{gb})\\)。计算第 g 组的均值\n\
  \n```\n\\(\\widehat{\\log(W_g)} = (1/C) \\sum_{b=1}^C \\log(W_{gb})\\)\n```\n\n\
  以及标准差\n\n```\n\\(sd_g = \\sqrt{(1/C) \\sum_{b=1}^C [\\log(W_{gb}) - \\widehat{\\\
  log(W_g)}]^2}\\)\n```\n\n以及间隙统计量\n\nGap(g) = \\widehat{\\log(W_g)} - \\log(W_g)\n\
  \n- 3. 选择聚类数量，使 g 为满足以下条件的最小值：\n\nGap(g) \\ge Gap(g + 1) - sd_g \\sqrt{1 + (1/C)}\n\
  \n### 示例 5.3\n\n再次考虑文件 TaiwanAirBox032017.csv 和 P_electricity1344.csv 中的台湾 AirBox\
  \ 和新英格兰电力价格数据，但使用一阶差分系列，即 z_t = V x_t，其中 x_t 是观测时间系列。与之前一样，我们从 AirBox 数据集中删除了系列\
  \ 29 和 70。图 5.12 显示了基于四个距离度量的 AirBox 数据层次聚类结果的树状图，这四个度量分别是 ACF 和 PACF 的前 5 个滞后、自动选择\
  \ AR 阶次的 PIC 距离以及 PER。从图中看，PACF 和 PIC 距离似乎提供相似的聚类结果。这并不奇怪，因为 PACF 与 AR 系数密切相关。另一方面，PER\
  \ 距离似乎提供略有不同的结果。然后，我们将基于 ACF 距离的轮廓统计量和间隙统计量应用于该数据集。轮廓统计量建议两个聚类，而间隙统计量指示四个聚类。此外，基于\
  \ ACF 距离，如果选择三个聚类，则聚类大小分别为 390、107 和 17。使用的 R 命令和包\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_256_0.png)\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_256_1.png)\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_256_2.png)\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_256_3.png)\n\n图 5.12 基于四个距离度量对台湾 AirBox\
  \ 数据一阶差分系列进行聚类的树状图。\n\n下面给出了一些输出，其中用于层次聚类的命令 hclust 是 R 包 stats 的一部分。\n\n#### 距离度量与层次聚类：台湾\
  \ AirBox 数据集\n\n```\n>x=as.matrix(TaiwanAirBox032017)\n>x=x[,-1]\n>x=x[,-c(29,70)]\n\
  >z=diff (x)\n##All the distances are computed with the package TSclust\n>require(TSclust)\n\

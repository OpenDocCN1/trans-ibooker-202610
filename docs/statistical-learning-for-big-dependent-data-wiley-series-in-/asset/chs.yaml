  \ 0.003581634\n\n```r\n### DLdata R script\n\"DLdata\" <- function(da,forerate=0.2,locY=1,lag=1){\n\
  #### Input:\n#### da: data matrix T-by-k matrix\n#### forerate: fraction of sample\
  \ size to form testing sample\n#### locY: locator for the dependent variable.\n\
  #### lag: number of lags to be used to form predictors\n#### output:\n#### Xtrain:\
  \ standardized predictors matrix\n#### Ytrain: dependent variable in training sample\n\
  #### Ytest: predictor in testing sample, standardized according to X_train\n####\
  \ Ytest: dependent variable in the testing sample\n#\nif(!is.matrix(da))da <- as.matrix(da)\n\
  k <- ncol(da)\nnT <- nrow(da)\nname <- colnames(da)\nif(is.null(name)) name <- paste(\"\
  Y\",1:k,sep=\"\")\nnfore <- floor(forerate*nT)\nnobe <- nT-lag\nist <- lag:1\nif(nfore\
  \ < nobe) {\nntrain <- nobe-nfore\n} else {nfore=0\nntrain=0\ncat(\"Not enough data\
  \ for testing\",\"\\n\")\n}\nXtrain = Ytrain = Xtest = Ytest <- NULL\nif(nfore >\
  \ 0) {\nY <- da[ist:nT,locY]\nX <- NULL\nna <- NULL\nnb <- paste(name,\"L\",sep=\"\
  \")\nfor (i in 1:lag) {\nX <- cbind(X,da[(ist-i):(nT-i),])\nna <- c(na,paste(nb,1:k,sep=\"\
  \"))\n}\ncolnames(X) <- na\nXtrain <- X[1:ntrain,]\nYtrain <- Y[1:ntrain]\nXtest\
  \ <- X[(ntrain+1):nobe,]\nYtest <- Y[(ntrain+1):nobe]\n#### standardization of predictors\
  \ in training sample\n#### Also, the same standardization of predictors in the test\
  \ sample.\nXtrain <- scale(Xtrain,center=TRUE,scale=TRUE)\ncol_means_train <- attr(Xtrain,\"\
  scaled:center\")\ncol_sds_train <- attr(Xtrain,\"scaled:scale\")\nXtest <- scale(Xtest,center=col_means_train,scale=col_sds_train)\n\
  }\nlist(Xtrain=Xtrain,Ytrain=Ytrain,Xtest=Xtest,Ytest=Ytest,nfore=nfore)\n}\n```\n\
  \n## 8.5 深度生成模型\n\n在文献中，已经为深度学习提出了各种生成模型。它们包括玻尔兹曼机、受限玻尔兹曼机、深度置信网络和深度玻尔兹曼机。不同模型服务于不同目的。例如，玻尔兹曼机是一种随机循环神经网络，已应用于认知科学。参见\
  \ Hinton (2007)。通常，网络是对称连接的，每个神经元（状态）都是二进制的。与网络相关联的能量函数，且可见节点与隐藏节点之间的每个连接都被分配一个概率。概率由训练样本中网络的权重和偏差决定。因此，能量函数是统计术语中的目标函数。我们将不讨论这些生成模型，因为我们的重点是对依赖数据进行预测。有兴趣的读者请参阅\
  \ Goodfellow et al. (2016)。\n\n## 8.6 强化学习\n\n强化学习（RL）是机器学习的另一个领域，关注程序（或机器或代理）应如何在环境中采取行动（或决策），以最大化某个明确定义的累积奖励。它是三种基本机器学习之一，与监督学习和无监督学习并列。RL\
  \ 的良好参考文献是 Sutton and Barto (2018)。\n\n强化学习是一种理解和自动化目标导向学习与决策的计算方法。它通过强调代理与环境的直接交互以及专注于实现长期目标，将其与其他机器学习方法区分开来。它使用马尔可夫决策过程，利用状态、行动和奖励的概念来定义代理与其环境之间的交互。它是统计文献中多臂老虎机问题的扩展。举个例子，考虑一名围棋选手。她通过（a）规划和预判可能的回应和反击，以及（b）在特定时刻（环境）可供她选择的特定棋局和走法的可取性来落子。目标是赢得比赛，在过程中她可能会以一定的小概率采取一些次优走法来探索环境，因为她的走法会导致环境的变化，从而影响她后续走法的选择。\n\
  \n可以将 RL 视为一个决策者（或代理），它在一系列观察中与环境交互，并选择行动以最大化随时间变化的奖励。因此，RL 模型由一个有限的环境状态集合（记为 $S$）、一个有限的代理行动集合（记为\
  \ $A$）和一组标量奖励（记为 $R$）组成。在时间（或步骤）$t$，代理观察环境的某个表示，例如 $s_t \\in S$。然后，代理选择一个动作 $a_t\
  \ \\in A(s_t)$，其中 $A(s_t) \\subset A$ 是状态 $s_t$ 下可用动作的集合。在选择动作 $a_t$ 后，代理接收一个奖励\
  \ $r_{t+1}$ 并观察一个新状态 $s_{t+1}$。从描述来看，状态序列 $\\{s_t\\}$ 是动态依赖的。\n\nRL 的目标是采取一系列行动以最大化总奖励\n\
  \n$R = \\sum_{t=0}^{\\infty} \\gamma^t r(s_t, a_t)$，\n\n其中 $\\gamma$ 被称为折扣因子，其值介于\
  \ 0 和 1 之间。在商业和经济学文献中，折扣因子是众所周知的，并与未来奖励的现值相关联。\n\n强化学习已在许多工程领域找到应用，但在商业和经济学中应用较少。一个相关应用是\
  \ Jin et al. (2018) 中的展示广告。关于 RL 算法的良好参考，读者请参阅 Szepesvari (2010)。R 中存在一个名为 reinforcementlearning\
  \ 的近期包用于运行 RL。然而，由于 RL 尚未成为商业和经济学中大规模依赖数据分析的重要领域，我们将该主题的详细讨论推迟到未来。\n\n## 练习\n\n\

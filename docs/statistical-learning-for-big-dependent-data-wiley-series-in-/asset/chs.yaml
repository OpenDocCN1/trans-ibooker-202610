  \ | -0.16847 | -0.05055 | 0.01896 | 0.04600 | 0.06561 | 0.04985 |\n\n近似的 2-标准误限为\
  \ 0.36\n\n#### 3.1.2 多输入和多输出\n\n在 TFM 的一些应用中，输入变量、输出变量或两者皆可为多变量。在这种情况下，预白化过程变得繁琐。一种更直接和简单的方法是应用多变量时间序列分析。实际上，TFM\
  \ 可以被视为 VARMA 模型的特例。详情如下。\n\n## 3.2 向量 AR 模型\n\n向量 AR（VAR）模型可以说是实践中应用最广泛的多变量时间序列模型。对于\
  \ _k_ 维时间系列 **_z_**_<sub>t</sub>_，VAR(_p_) 模型为\n\n```\n\\(z_t = \\phi_0 + \\sum_{i=1}^p\
  \ \\phi_i z_{t-i} + a_t,\\) (3.13)\n```\n\n其中 \\(\\phi_0\\) 是一个 _k_ 维向量，\\(\\phi_i\\\
  ) 是 \\(k \\times k\\) 实矩阵，而 **_a_**_<sub>t</sub>_ 是均值为零且协方差矩阵 \\(\\Sigma_a > 0\\\
  ) 为正定的白噪声序列。显然，我们假设阶数 _p_ 为非负，且若 _p_ > 0 则 \\(\\phi_p \\neq \\mathbf{0}\\)。设 \\\
  (\\phi(B) = I - \\sum_{i=1}^p \\phi_i B^i\\) 为 AR 矩阵多项式。若行列式方程 \\(|\\phi(B)| = 0\\\
  ) 的所有零点绝对值均大于 1，则系列 **_z_**_<sub>t</sub>_ 为弱平稳。考虑一个平稳系列。对 Eq. (3.13) 取期望，得\n\n```\n\
  \\(E(z_t) \\equiv \\mu = [\\phi(1)]^{-1} \\phi_0.\\)\n```\n\n其中 \\(\\phi(1) = I\
  \ - \\sum_{i=1}^p \\phi_i\\)，该矩阵可逆。利用上述方程，平稳的 VAR(_p_) 模型可重写为\n\n```\n\\(\\phi(B)(z_t\
  \ - \\mu) = a_t.\\) (3.14)\n```\n\n该模型在金融中常被使用，因为 \\(z_t - \\mu\\) 是均值偏差，且平稳系列 **_z_**_<sub>t</sub>_\
  \ 具有均值回归特性。将 Eq. (3.14) 右乘以 \\((z_{t-j} - \\mu)'\\) 并取期望，得\n\n```\n\\(\\Gamma_z(j)\
  \ = \\left\\{ \\begin{array}{ll} \\sum_{i=1}^p \\phi_i \\Gamma_z(j-i) + \\Sigma_a\
  \ & \\text{if } j = 0, \\\\ \\sum_{i=1}^p \\phi_i \\Gamma_z(j-i) & \\text{if } j\
  \ > 0, \\end{array} \\right.\\)\n```\n\n如前所述，\\(\\Gamma_z(j)\\) 是 \\(z_t\\) 的滞后-\\\
  (j\\) 自协方差矩阵。Eq. (3.15) 是平稳 VAR(_p_) 模型的矩方程。特别地，联合考虑 \\(j = 1, \\dots, p\\) 的方程，得\n\
  \n```\n[\\Gamma_z(1), \\dots, \\Gamma_z(p)] = [\\phi_1, \\dots, \\phi_p] \\left[\
  \ \\begin{array}{cccc} \\Gamma_z(0) & \\Gamma_z(1) & \\cdots & \\Gamma_z(p-1) \\\
  \\ \\Gamma_z(-1) & \\Gamma_z(0) & \\cdots & \\Gamma_z(p-2) \\\\ \\vdots & \\vdots\
  \ & \\ddots & \\vdots \\\\ \\Gamma_z(1-p) & \\Gamma_z(2-p) & \\cdots & \\Gamma_z(0)\
  \ \\end{array} \\right]\n```\n\n这被称为多变量 Yule-Walker 方程，可根据自协方差矩阵 \\(\\Gamma_z(j)\\\
  ) 求得 AR 系数矩阵 \\(\\phi_j\\)。例如，对 AR(1) 可得\n\n```\n\\(\\phi_1 = \\Gamma_z(1)[\\Gamma_z(0)]^{-1}.\\\
  )\n```\n\n另一方面，给定平稳 VAR(_p_) 模型，可通过 (3.15) 中的矩方程递归计算自协方差矩阵 \\(\\Gamma_z(j)\\)。递归的初始值可通过求解一组线性方程组得到。为举例说明，考虑平稳（零均值）VAR(1)\
  \ 模型，\\(z_t = \\phi_1 z_{t-1} + a_t\\)。对模型两边取协方差，并注意 \\(a_t\\) 与 \\(z_{t-1}\\) 不相关，得\n\
  \n```\n\\(\\Gamma_z(0) = \\phi_1 \\Gamma_z(0) \\phi_1' + \\Sigma_a.\\)\n```\n\n\
  因而，\n\n```\n\\(\\text{vec}[\\Gamma_z(0)] = (\\phi_1 \\otimes \\phi_1)\\text{vec}[\\\
  Gamma_z(0)] + \\text{vec}(\\Sigma_a),\\)\n```\n\n且\n\n```\n\\(\\text{vec}[\\Gamma_z(0)]\
  \ = [I - \\phi_1 \\otimes \\phi_1]^{-1} \\text{vec}(\\Sigma_a),\\)\n```\n\n其中 \\\
  (I\\) 是 \\(k^2 \\times k^2\\) 单位矩阵，\\(\\otimes\\) 表示克罗内克积。这是标量情况的推广，标量情况下 \\(\\\
  text{var}(z_t) = \\sigma_a^2 / (1 - \\phi_1^2)\\)。给定 \\(\\Gamma_z(0)\\) 后，可通过 (3.15)\
  \ 中的矩方程递归计算 VAR(1) 模型的 \\(\\Gamma_z(j)\\)。\n\n由于 _k_ 维 VAR(_p_) 模型总可重写为 \\(kp\\\
  ) 维 VAR(1) 模型，前述讨论适用于所有平稳 VAR(_p_) 模型。具体地，令 \\(Z_t = (z_t', z_{t-1}', \\dots, z_{t-p+1}')'\\\
  ) 为一个 \\(kp\\) 维错开时间序列。则容易看出\n\n```\nZ_t = \\left[ \\begin{array}{ccccc} \\phi_1\
  \ & \\phi_2 & \\cdots & \\phi_{p-1} & \\phi_p \\\\ I & 0 & \\cdots & 0 & 0 \\\\\
  \ 0 & I & \\cdots & 0 & 0 \\\\ \\vdots & \\vdots & \\ddots & \\vdots & \\vdots \\\
  \\ 0 & 0 & \\cdots & I & 0 \\end{array} \\right] Z_{t-1} + \\left[ \\begin{array}{c}\
  \ a_t \\\\ 0 \\\\ \\vdots \\\\ 0 \\\\ 0 \\end{array} \\right],\n```\n\n这是一个 $kp$\
  \ 维 VAR(1) 模型的形式。Eq. (3.18) 中 $Z_{t-1}$ 的系数矩阵称为 AR 矩阵多项式 \\(\\phi(B)\\) 的伴随矩阵。可证，伴随矩阵的特征值为方程\
  \ \\(|\\phi(B)| = 0\\) 解的倒数。这提供了描述 VAR(_p_) 模型弱平稳条件的另一种方式，即 \\(\\phi(B)\\) 的伴随矩阵所有特征值的绝对值均小于\
  \ 1。\n\n### 3.2.1 冲激响应函数\n\n平稳 VAR(_p_) 模型具有 MA 表示，\n\n```\n$z_t = \\mu + \\sum_{i=0}^{\\\
  infty} \\psi_i a_{t-i} \\equiv \\mu + \\psi(B)a_t, \\quad (3.19)$\n```\n\n其中 \\\
  (\\psi(B) = \\sum_{i=0}^{\\infty} \\psi_i B^i\\)，且 \\(\\phi(B)\\psi(B) = I\\)。系数矩阵\
  \ \\(\\psi_i\\) 是 \\(a_t\\) 对 \\(z_{t+i}\\) 的影响，可视为冲激响应矩阵。对于给定的 VAR 模型，\\(\\psi_i\\\
  ) 矩阵可通过令 \\(\\phi(B)\\psi(B) = I\\) 中 \\(B^i\\) 的系数矩阵相等来求得。另外，根据 Eq. (3.19)，有\n\n\
  ```\n$\\Gamma_z(j) = \\sum_{i=0}^{\\infty} \\psi_{i+j} \\Sigma_a \\psi'_i, \\quad\
  \ j \\ge 0.$\n```\n\nEq. (3.19) 的冲激响应矩阵 \\(\\psi_i\\) 可能难以解释，因为创新项 \\(a_{it}\\)\
  \ 通常是相关的。为缓解这一难题，可以进行变换，例如\n\n```\n$b_t = P'a_t,$\n```\n\n使得 \\(\\text{var}(b_t)\\\
  ) 为对角矩阵。实现此目的的方法有很多，一种可能是考虑 \\(\\Sigma_a\\) 的特征值-特征向量分析，即\n\n```\n$\\Sigma_a P =\
  \ P \\Lambda,$\n```\n\n其中 \\(\\Lambda = \\text{diag}\\{\\lambda_1, \\dots, \\lambda_k\\\
  }\\)，\\(\\lambda_i\\) 为 \\(\\Sigma_a\\) 的第 \\(i\\) 个有序特征值，\\(P\\) 为相应特征向量组成的矩阵。由于\
  \ \\(\\Sigma_a\\) 为正定，\\(P\\) 为正交矩阵，例如 \\(PP' = P'P = I\\)。令 \\(\\psi_i^* = P\\\
  psi\\)（\\(i \\ge 0\\)），则有\n\n```\n$z_t = \\mu + \\sum_{i=0}^{\\infty} \\psi_i^*\
  \ b_{t-i}. \\quad (3.20)$\n```\n\n系数矩阵 \\(\\psi_i^*\\) 称为正交创新项 \\(b_t\\) 的冲激响应矩阵。这是因为容易看出\
  \ \\(\\partial z_{ut} / \\partial b_{v,t-i} = \\psi_{i,uv}^*\\)，其中 \\(\\psi_{i,uv}^*\\\
  ) 表示矩阵 \\(\\psi_i^*\\) 的 \\((u, v)\\) 元素，这意味着 \\(b_{v,t-i}\\) 的一个单位变化将使 \\(z_{ut}\\\
  ) 受到 \\(\\psi_{i,uv}^*\\) 的影响。部分和矩阵\n\n```\n$\\Psi_v = \\sum_{i=0}^v \\psi_i^*,\
  \ \\quad (3.21)$\n```\n\n是累积冲激响应矩阵。注意，\\(\\Psi_v\\) 的 \\((i,j)\\) 元素是 \\(b_{j,t-v}\\\
  ) 对 \\(z_{it}\\) 的影响和累积影响。矩阵 \\(\\Psi_\\infty\\) 表示 VAR 模型的总乘数。在许多应用中，研究者关注拟合 VAR\
  \ 模型的冲激响应函数。\n\n\n\n\n\n### 3.2.2 一些特殊情况\n\nVAR(\\(p\\)) 模型的系数矩阵 \\(\\phi_i\\) 的结构可能传达关于底层时间序列的有用信息。本节将考虑一些特殊情况。\n\
  \n**情况 1：TFM。** 在这种情况下，不失一般性，我们假设 \\(z_t\\) 可以分为 \\(z_{1t}\\) 和 \\(z_{2t}\\)，使得模型变为\n\
  \n\\(\\begin{bmatrix} \\phi_{11}(B) & \\mathbf{0} \\\\ \\phi_{21}(B) & \\phi_{22}(B)\
  \ \\end{bmatrix} \\begin{bmatrix} z_{1t} \\\\ z_{2t} \\end{bmatrix} = \\begin{bmatrix}\
  \ a_{1t} \\\\ a_{2t} \\end{bmatrix} . \\quad (3.22)\\)\n\n这里 \\(z_{1t}\\) 是输入向量，遵循\
  \ VAR 模型 \\(\\phi_{11}(B)z_{1t} = a_{1t}\\)。输出向量是 \\(z_{2t}\\)，并满足方程\n\n\\(\\phi_{22}(B)z_{2t}\
  \ = -\\phi_{21}(B)z_{1t} + a_{2t} = -\\phi_{21}(B)[\\phi_{11}(B)]^{-1}a_{1t} + a_{2t}.\
  \ \\quad (3.23)\\)\n\n不过，方程 (3.23) 不是 TF 形式，因为 \\(a_{2t}\\) 和 \\(a_{1t}\\) 可能相关。为了将模型置于\
  \ TF 形式，我们需要进行一些正交化。具体来说，考虑多元多元线性回归\n\n\\(a_{2t} = \\beta a_{1t} + e_t, \\quad (3.24)\\\
  )\n\n并求得 \\(\\beta\\) 的最小二乘估计，记为 \\(\\hat{\\beta}\\)。残差序列 \\(\\hat{e}_t = a_{2t}\
  \ - \\hat{\\beta}a_{1t}\\) 与 \\(a_{1t}\\) 正交。因此，我们得到一个 TFM\n\n\\(z_{2t} = [\\phi_{22}(B)]^{-1}[-\\\
  phi_{21}(B) + \\hat{\\beta}\\phi_{11}(B)]z_{1t} + [\\phi_{22}(B)]^{-1}\\hat{e}_t.\
  \ \\quad (3.25)\\)\n\n在实践中，人们可能有兴趣检验原假设 \\(H_0 : \\phi_{12}(B) = \\mathbf{0}\\)\
  \ 对备择假设 \\(H_a : \\phi_{12}(B) \\neq \\mathbf{0}\\)。如果 \\(a_t\\) 的分布已知，例如多元高斯分布，则可以使用似然比检验。在文献中，这被称为\
  \ *格兰杰因果性* 检验。对于该检验，全模型是 \\(k\\) 维 VAR(\\(p\\)) 模型，缩减模型在方程 (3.22) 中。得到的似然比统计量渐近地服从\
  \ \\(\\chi^2_{df}\\) 分布，其中自由度 \\(d = pk_1k_2\\)，\\(k_i\\) 为 \\(z_{it}\\) 的维度。更多信息请参见，例如，Tsay\
  \ (2014)。\n\n直接使用 VAR 模型处理 TFM 有多个优势。首先，\\(z_{1t}\\) 和 \\(z_{2t}\\) 都是随机向量，因此该方法可以在不需要预白化的要求下处理多输入和多输出。其次，在数据分析中不需要识别哪个变量是输入、哪个是输出。第三，可以进行格兰杰因果性检验以确认从\
  \ \\(z_{1t}\\) 到 \\(z_{2t}\\) 的单向关系。另一方面，方程 (3.25) 中的模型对于真正的底层 TFM 可能不够精简。\n\n**情况\
  \ 2：** 块结构：如果方程 (3.22) 中的 \\(\\phi_{21}(B)\\) 也为零，则 \\(z_{1t}\\) 和 \\(z_{2t}\\)\
  \ 分别遵循两个独立的 VAR 模型，尽管这两个向量序列可能具有同时相关性。所谓同时相关，是指 \\(a_t\\) 元素之间的相关性。在 \\(\\phi(B)\\\
  ) 为对角矩阵的特殊情况下，\\(z_t\\) 由 \\(k\\) 个不相互动态依赖的标量 AR 时间序列组成。\n\n#### 情况 3：分层 TF：如果 $z_t\
  \ = (z'_{1t}, z'_{2t}, z'_{3t})'$ 并满足模型\n\n\\(\\begin{bmatrix} \\phi_{11}(B) & 0\
  \ & 0 \\\\ \\phi_{21}(B) & \\phi_{22}(B) & 0 \\\\ \\phi_{31}(B) & \\phi_{32}(B)\
  \ & \\phi_{33}(B) \\end{bmatrix} \\begin{bmatrix} z_{1t} \\\\ z_{2t} \\\\ z_{3t}\
  \ \\end{bmatrix} = \\begin{bmatrix} a_{1t} \\\\ a_{2t} \\\\ a_{3t} \\end{bmatrix}\
  \ . \\quad (3.26)\\)\n\n那么，$z_{1t}$ 是 \\(z_{2t}\\) 的输入向量，且 \\(z_{1t}\\) 和 \\(z_{2t}\\\
  ) 都是 \\(z_{3t}\\) 的输入向量。隐含的 TFM 可以使用情况 1 中提到的相同技术获得。\n\n#### 情况 4：假设 VAR 模型可以分解为：\n\
  \n\\(z_t = \\Phi_*(B)z_{t-1} + \\mathbf{a}_t = A(B)C(B)z_{t-1} + \\mathbf{a}_t \\\
  quad (3.27)\\)\n\n其中 \\(\\Phi_*(B) = \\sum_{i=1}^p \\Phi_i B^{i-1}\\)，\\(A(B) =\
  \ \\sum_{i=0}^{p_1} A_i B^i\\) 和 \\(C(B) = \\sum_{i=0}^{p_2} C_i B^i$ 是分别为 $k \\\
  times r$ 和 $r \\times k$ 维、次数为 $p_1$ 和 $p_2$ 的矩阵多项式算子，且 $p = p_1 + p_2 + 1$。令 $y_t\
  \ = C(B)z_t$ 为一个 $r$ 维时间序列，则可将 $z_t$ 的模型写为\n\\(z_t = A(B)y_{t-1} + \\mathbf{a}_t\\\
  )。\n\n这是 Velu 等人 (1986) 提出的低秩 AR 模型，当 $r$ 远小于 $k$ 时非常有用。另请参见 Ahn 和 Reinsel (1988)。它与第\
  \ 6 章中研究的因子模型相关。\n\n### 3.2.3 估计\n\n给定实现 \\(\\{z_1, \\dots, z_T\\}$，可以使用普通最小二乘（OLS）法、广义最小二乘（GLS）法或最大似然（ML）法来估计\
  \ VAR(\\(p\\)) 模型。结果表明，OLS 估计量与 VAR 模型的 GLS 估计量相同，并且在正态性假设下，OLS 估计量与 ML 估计量渐近等价。例如，请参见\
  \ Tsay (2014, chapter 2) 及其参考文献。因此，此处我们只考虑 OLS 估计。\n\n方程 (3.13) 中的 VAR(\\(p\\))\
  \ 模型可以写为\n\n\\(z'_t = x'_t \\beta + a'_t, \\quad (3.28)\\)\n\n其中 $x_t = (1, z'_{t-1},\
  \ \\dots, z'_{t-p})'$ 和 $\\beta' = [\\phi_0, \\phi_1, \\dots, \\phi_p]$ 是一个 \\((kp\
  \ + 1) \\times p$ 系数矩阵。对于 \\(t = p + 1, \\dots, T$ 使用方程 (3.28)，我们得到以下数据矩阵方程\n\n\\\
  (Z = X\\beta + A, \\quad (3.29)\\)\n\n其中 \\(Z, X\\) 和 \\(A$ 的第 \\(i$ 行分别为 \\(z'_{p+i},\
  \ x'_{p+i}\\) 和 \\(a'_{p+i}\\)。\\(Z\\) 和 \\(A$ 的维度为 \\((T - p) \\times k\\)，而 \\\
  (X$ 的维度为 \\((T - p) \\times (kp + 1)\\)。该模型的 OLS 估计目标函数为\n\n\\(S(\\beta) = \\text{tr}[(Z\
  \ - X\\beta)(Z - X\\beta)'],\\)\n\n其中 tr(\\(C\\)) 是方阵 \\(C$ 的迹。对 \\(\\beta\\) 对\
  \ \\(S(\\beta)$ 求偏导，我们可以获得一阶条件的线性方程组，从中得到 OLS 估计量为\n\n\\(\\hat{\\beta} = (X'X)^{-1}(X'Z)\
  \ = \\left( \\sum_{t=p+1}^T x_t x'_t \\right)^{-1} \\left( \\sum_{t=p+1}^T x_t z'_t\
  \ \\right). \\quad (3.30)\\)\n\n\\(\\Sigma_a$ 的 OLS 估计为\n\n$$\\hat{\\Sigma}_a =\
  \ \\frac{1}{T-(k+1)p-1} \\sum_{t=p+1}^T \\hat{a}_t \\hat{a}'_t \\quad (3.31)$$\n\
  \n其中 \\(\\hat{a}_t = z_t - \\hat{\\phi}_0 - \\sum_{i=1}^p \\hat{\\Phi}_i z_{t-i}$\
  \ 是残差序列。如果使用 ML 估计，则 \\(\\Sigma_a$ 的 ML 估计为\n\n$$\\hat{\\Sigma}_a = \\frac{1}{T-p}\
  \ \\sum_{t=p+1}^T \\hat{a}_t \\hat{a}'_t. \\quad (3.32)$$\n\n**定理 3.1** 假设 VAR(\\\
  (p\\)) 模型的 \\(a_t$ 是一组独立同分布的随机向量序列，均值为零，协方差矩阵 \\(\\Sigma_a$ 为正定。那么，OLS 估计给出 (a)\
  \ \\(E(\\hat{\\beta}) = \\beta$，(b) \\(E(\\hat{\\Sigma}_a) = \\Sigma_a$，(c) 残差 \\\
  (\\hat{A}$ 与 \\(\\hat{\\beta}$ 不相关，以及 (d) 参数估计量的协方差矩阵为\n\n$$Cov[vec(\\hat{\\beta})]\
  \ = \\tilde{\\Sigma}_a \\otimes (X'X)^{-1}.$$\n\n为了建立估计量 \\(\\hat{\\beta}$ 的渐近正态分布，我们进一步假设\n\
  \n$$E|a_{it}a_{ju}a_{ru}a_{vt}| < \\infty, \\quad \\text{for all } 1 \\le i, j,\
  \ u, v \\le k \\text{ and } t, \\quad (3.33)$$\n\n这意味着 \\(a_t$ 的所有四阶矩都是有限的。\n\n\
  **定理 3.2** 假设定理 3.1 和方程 (3.33) 的条件成立。那么，当 \\(T \\to \\infty$ 时，\n\n- (i) \\(\\hat{\\\
  beta} \\to_p \\beta,\\)\n- (ii) \\(\\sqrt{T-p}[vec(\\hat{\\beta}) - vec(\\beta)]\
  \ \\to_d N(0, \\Sigma_a \\otimes G^{-1}),\\)\n\n其中 \\(\\to_p$ 和 \\(\\to_d$ 分别表示概率收敛和分布收敛，并且\n\
  \n$$G = \\begin{bmatrix} 1 & 0' \\\\ 0 & \\Gamma_0^* \\end{bmatrix} + \\begin{bmatrix}\
  \ 0 \\\\ u \\end{bmatrix} [0, u']$$\n\n其中 0 是一个 \\(kp$ 维零向量，\\(u = 1_p \\otimes\
  \ \\mu\\)，其中 \\(1_p$ 是 \\(p$ 维全一向量，并且\n\n$$\\Gamma_0^* = \\begin{bmatrix} \\Gamma_z(0)\
  \ & \\Gamma_z(1) & \\cdots & \\Gamma_z(p-1) \\\\ \\Gamma_z(-1) & \\Gamma_z(0) &\
  \ \\cdots & \\Gamma_z(p-2) \\\\ \\vdots & \\vdots & \\ddots & \\vdots \\\\ \\Gamma_z(1-p)\
  \ & \\Gamma_z(2-p) & \\cdots & \\Gamma_z(0) \\end{bmatrix}.$$\n\n### 3.2.4 模型构建\n\
  \n**阶次选择：** 构建时间序列 \\(z_t$ 的 VAR 模型的第一步是选择阶次 \\(p$。文献中有多种方法可用。例如，请参见 Tsay (2014,\
  \ chapter 2)。最常用的方法是使用以下准则函数之一：\n\n\n\nAIC(p) = ln |\\hat{\\Sigma}_a| + \\frac{2pk^2}{T},\n\
  BIC(p) = ln |\\hat{\\Sigma}_a| + \\frac{ln(T)pk^2}{T},\nHannan and Quinn (HQ)(p)\
  \ = ln |\\hat{\\Sigma}_a| + \\frac{2ln(ln(T))pk^2}{T},\n\nwhere \\(\\hat{\\Sigma}_a\\\
  ) is the ML estimate of \\(\\Sigma\\) in Eq. (3.32), \\(T\\) is the sample size,\
  \ and \\(k\\) is the dimension. These criteria are the multivariate generalizations\
  \ of those studied in Section 2.8.4. See Akaike (1973), Schwarz (1978), and Hannan\
  \ and Quinn (1979). In practice, with a prespecified maximum order \\(P\\), one\
  \ selects the order that gives rise to the minimum value of a criterion function.\
  \ For instance, the order selected by AIC is\n\n\\(\\hat{p} = \\arg \\min_{0 \\\
  le p \\le P} \\text{AIC}(p),\\)\n\nwhere \\(p=0\\) corresponding to fitting a model\
  \ with constant term only. Under the assumption that \\(\\mathbf{z}_t\\) follows\
  \ a finite-order VAR model, both BIC and HQ criteria are shown to be consistent,\
  \ but AIC has some small probability to specify an order greater than the true order\
  \ \\(p\\). However, AIC is often used because there exists no true VAR model in\
  \ any real application. For further discussion of properties of AIC, see Shibata\
  \ (1980).\n\n#### 模型检验\n\n设 \\(\\mathbf{R}_j\\) 为 VAR(\\(p\\)) 模型（Eq. (3.13)）中创新序列\
  \ \\(\\mathbf{a}_t\\) 的滞后-\\(j\\) 交叉相关系数矩阵。就模型检验而言，感兴趣的原假设为 \\(H_0 : \\mathbf{R}_1\
  \ = \\cdots = \\mathbf{R}_m = \\mathbf{0}\\)，与备择假设 \\(H_a : \\mathbf{R}_i \\neq\
  \ \\mathbf{0}\\) 对某些 \\(1 \\le i \\le m\\) 相对立，其中 \\(m\\) 为预设的正整数。设 \\(\\hat{\\\
  mathbf{a}}_t\\) 为模型的残差序列，例如最小二乘残差。\\(\\mathbf{R}_j\\) 的自然估计量为\n\n\\(\\hat{\\mathbf{R}}_j\
  \ = \\hat{\\mathbf{D}}^{-1/2} \\hat{\\mathbf{C}}_j \\hat{\\mathbf{D}}^{-1/2},\\\
  )\n\n其中 \\(\\hat{\\mathbf{C}}_v\\) 是由以下公式给出的滞后-\\(v\\) 残差协方差矩阵\n\n\\(\\hat{\\mathbf{C}}_v\
  \ = \\frac{1}{T-p} \\sum_{t=p+v+1}^T \\hat{\\mathbf{a}}_t \\hat{\\mathbf{a}}_{t-v},\
  \ \\quad v = 0, 1, \\dots,\\)\n\n且 \\(\\hat{\\mathbf{D}} = \\text{diag}\\{\\hat{\\\
  mathbf{C}}_{0,11}, \\dots, \\hat{\\mathbf{C}}_{0,kk}\\}\\)，由 \\(\\hat{\\mathbf{C}}_0\\\
  ) 的对角元素组成。常用的检验统计量是多元 portmanteau 统计量，定义为\n\n\\(Q_k(m) = T^2 \\sum_{\\ell=1}^m \\\
  frac{1}{T-\\ell} \\text{tr}(\\hat{\\mathbf{R}}'_\\ell \\hat{\\mathbf{R}}_0^{-1}\
  \ \\hat{\\mathbf{R}}_\\ell \\hat{\\mathbf{R}}_0^{-1})\\)\n\\(= T^2 \\sum_{\\ell=1}^m\
  \ \\frac{1}{T-\\ell} \\text{tr}(\\hat{\\mathbf{R}}'_\\ell \\hat{\\mathbf{R}}_0^{-1}\
  \ \\hat{\\mathbf{R}}_\\ell \\hat{\\mathbf{R}}_0^{-1} \\hat{\\mathbf{D}}^{-1} \\\
  hat{\\mathbf{D}})\\)\n\\(= T^2 \\sum_{\\ell=1}^m \\frac{1}{T-\\ell} \\text{tr}(\\\
  hat{\\mathbf{D}}\\hat{\\mathbf{R}}'_\\ell \\hat{\\mathbf{D}}\\hat{\\mathbf{D}}^{-1}\
  \ \\hat{\\mathbf{R}}_0^{-1} \\hat{\\mathbf{R}}_0^{-1} \\hat{\\mathbf{D}} \\hat{\\\
  mathbf{D}}\\hat{\\mathbf{R}}_\\ell \\hat{\\mathbf{D}}\\hat{\\mathbf{D}}^{-1} \\\
  hat{\\mathbf{R}}_0^{-1} \\hat{\\mathbf{D}}^{-1})\\)\n\\(= T^2 \\sum_{\\ell=1}^m\
  \ \\frac{1}{T-\\ell} \\text{tr}(\\hat{\\mathbf{C}}'_\\ell \\hat{\\mathbf{C}}_0^{-1}\
  \ \\hat{\\mathbf{C}}_\\ell \\hat{\\mathbf{C}}_0^{-1}).\\)\n\n在定理 3.2 的假设下，可以证明检验统计量\
  \ $Q_k(m)$ 渐近服从自由度为 \\(d = (m-p)k^2\\) 的 \\(\\chi_d^2\\) 分布，前提是 \\(m > p\\)。有关更多信息，请参见\
  \ Li and McLeod (1981) 和 Hosking (1981)。\n\n#### 模型简化\n\n多元时间序列建模的一个难点在于，拟合模型通常包含许多高度相关但在通常\
  \ 5% 水平下边缘不显著的参数。模型简化已成为必要。然而，逐个删除不显著的参数会过于繁琐。有几种方法可以克服这一困难。一种方法是使用正则化，例如 \\(\\\
  ell_1\\) 惩罚估计。我们将在第7章的高维时间序列分析中讨论这种方法。第二种方法是 *thresholding*，即同时将所有 \\(t\\)-比率小于给定阈值的参数设为零。Tsay\
  \ (2014) 采用这种方法，并在 R 的 **MTS** 包中提供。实施 thresholding 时，选择合适的阈值必须谨慎。过大的阈值很容易使拟合模型失效，而过小的阈值往往会导致简化不足。遵循\
  \ Tsay (2014)，我们检查在给定阈值下重新拟合模型后的信息准则。如果信息准则（如 AIC）增加，则阈值过高。另一方面，如果所选信息准则下降，则可以提高阈值。有限的经验表明，这种\
  \ thresholding 方法在许多应用中效果良好。\n\n### 3.2.5 预测\n\n考虑 Eq. (3.13) 中的 VAR(\\(p\\)) 模型。假设有人有兴趣在预测原点\
  \ \\(t = n\\) 时预测 \\(z_{n+h}\\)。即，给定时间 \\(t = n\\) 时可用的信息（记为 \\(F_t\\)），希望了解 \\\
  (P(z_{n+h}|F_t)\\)，其中 \\(h\\) 是正整数，文献中称为预测步长。为简单起见，通常关注 \\(E(z_{n+h}|F_t)\\) 和 \\\
  (\\text{Var}(z_{n+h}|F_t)\\)，而非条件分布 \\(P(z_{n+h}|F_t)\\)。为此，我们采用最小化预测误差均方（MSFE）的准则，并考虑两种情况。其他预测准则也可使用，但会带来一些复杂性，且无法得到封闭式解来生成预测。\n\
  \n#### 情况 1\n\n假设模型已知，即将 VAR(\\(p\\)) 模型的估计参数视为真实参数。根据模型，我们有\n\n\\(z_{n+h} = \\\
  phi_0 + \\sum_{i=1}^p \\phi_i z_{n+h-i} + a_{n+h}.\\) (3.35)\n\n当 \\(h = 1\\) 时，Eq.\
  \ (3.35) 变为\n\n\\(z_{n+1} = \\phi_0 + \\phi_1 z_n + \\cdots + \\phi_p z_{n+1-p}\
  \ + a_{n+1}.\\)\n\n在 MSFE 准则下，1步先验点预测简单为\n\n\\(z_n(1) = E(z_{n+1}|F_t) = \\phi_0\
  \ + \\phi_1 z_n + \\cdots + \\phi_p z_{n+1-p},\\) (3.36)\n\n相关的预测误差及其方差为\n\n\\(e_n(1)\
  \ = z_{n+1} - z_n(1) = a_{n+1}, \\quad V[e_n(1)] = \\Sigma_a.\\) (3.37)\n\n根据 Eqs.\
  \ (3.36) 和 (3.37)，我们有\n\n\\(z_{n+1} = z_n(1) + a_{n+1}.\\) (3.38)\n\n对于 \\(h = 2\\\
  )，使用 Eqs. (3.35) 和 (3.38)，我们有\n\n\\(z_{n+2} = \\phi_0 + \\phi_1 z_{n+1} + \\phi_2\
  \ z_n + \\cdots + \\phi_p z_{n+2-p} + a_{n+2}\\)\n\\(= \\phi_0 + \\phi_1[z_n(1)\
  \ + a_{n+1}] + \\phi_2 z_n + \\cdots + \\phi_p z_{n+2-p} + a_{n+2}\\)\n\\(= \\phi_0\
  \ + \\phi_1 z_n(1) + \\phi_2 z_n + \\cdots + \\phi_p z_{n+2-p} + a_{n+2} + \\phi_1\
  \ a_{n+1}.\\)\n\n由此清楚，2步先验预测及其相关误差为\n\n\\(z_n(2) = E(z_{n+2}|F_n) = \\phi_0 + \\\
  phi_1 z_n(1) + \\phi_2 z_n + \\cdots + \\phi_p z_{n+2-p}\\) (3.39)\n\\(e_n(2) =\
  \ z_{n+2} - z_n(2) = a_{n+2} + \\phi_1 a_{n+1}\\) (3.40)\n\\(V[e_n(2)] = \\Sigma_a\
  \ + \\phi_1 \\Sigma_a \\phi_1'.\\)\n\n一般来说，可以重复该过程，得出 \\(h\\) 步先验预测为\n\n\\(z_n(h)\
  \ = \\phi_0 + \\sum_{i=1}^p \\phi_i z_n(h-i)\\) (3.41)\n\\(e_n(h) = a_{n+h} + \\\
  sum_{j=1}^{h-1} \\psi_j a_{n+h-j}\\) (3.42)\n\\(V[e_n(h)] = \\Sigma_a + \\sum_{j=1}^{h-1}\
  \ \\psi_j \\Sigma_a \\psi_j',\\) (3.43)\n\n其中 \\(\\psi_i\\) 是 \\(z_t\\) 的第 \\(i\\\
  ) 个 \\(\\psi\\)-权重系数矩阵；参见 Eq. (3.19)。在 Eq. (3.41) 中，理解为当 \\(\\ell \\le 0\\) 时 \\\
  (z_n(\\ell) = z_{n+\\ell}\\)，即 \\(z_n(0) = z_n\\) 和 \\(z_n(-1) = z_{n-1}\\)。Eqs.\
  \ (3.41) 和 (3.43) 意味着，VAR(\\(p\\)) 模型的预测及其相关协方差矩阵可以递归计算。\n\n使用 \\(\\phi_0 = (\\\
  mathbf{I} - \\sum_{i=1}^p \\phi_i)\\mu\\)，Eq. (3.41) 可重写为\n\n\\(z_n(h) - \\mu =\
  \ \\sum_{i=1}^p [z_n(h-i) - \\mu].\\)\n\n然后，通过使用 Eq. (3.18) 中的 \\(kp\\) 维模型表示，可以很容易地推导出，如果\
  \ \\(z_t\\) 是平稳时间序列，则当 \\(h \\to \\infty\\) 时有 \\(z_n(h) - \\mu \\to \\mathbf{0}\\\
  )。即，当 \\(h \\to \\infty\\) 时 \\(z_n(h) \\to \\mu\\)。这被称为平稳向量自回归过程的 *mean reverting*。此外，根据\
  \ Eq. (3.43)，当 \\(h \\to \\infty\\) 时有 \\(\\text{V}[e_n(h)] \\to \\text{V}(z_t)\\\
  )。\n\n#### 情况 2：参数不确定性\n\n在实践中，系数矩阵 \\(\\phi_i\\) 未知，人们可能在预测中考虑参数不确定性。对于 VAR 模型，结果相对简单。注意，给定\
  \ \\(F_n\\) 时，估计量 \\(\\hat{\\phi}_i\\) 和 \\(\\hat{\\Sigma}_a\\) 可用，因此模型可写成\n\n\\\
  (z_{n+h} = \\hat{\\phi}_0 + \\sum_{i=1}^p \\hat{\\phi}_i z_{n+h-i} + [\\phi_0 -\
  \ \\hat{\\phi}_0] + \\sum_{i=1}^p [\\phi_i - \\hat{\\phi}_i] z_{n+h-i} + a_{n+h}.\\\
  ) (3.44)\n\n\n\n\n\n对于 \\( j = 1, \\dots, h \\)，递归定义\n\n\\[\n\\hat{z}_n(j) = \\\
  hat{\\Phi}_0 + \\sum_{i=1}^p \\hat{\\Phi}_i \\hat{z}_n(j-i), \\tag{3.45}\n\\]\n\n\
  其中约定 \\(\\hat{z}_n(\\ell) = z_{n+\\ell}\\) 对 \\(\\ell \\le 0\\) 成立。另外，令\n\n\\[\n\
  \\hat{e}_n(j) = z_{n+j} - \\hat{z}_n(j), \\quad j=1, \\dots, h \\tag{3.46}\n\\]\n\
  \n为参数不确定性下的 \\( j \\) 步先行预报误差。根据 Eq. (3.46)，有\n\n\\[\n\\hat{e}_n(j) = z_{n+j} -\
  \ z_n(j) + z_n(j) - \\hat{z}_n(j) = e_n(j) + [z_n(j) - \\hat{z}_n(j)]. \\tag{3.47}\n\
  \\]\n\n由于 \\( e_n(j) = a_{n+j} + \\sum_{i=1}^{j-1} \\Psi_v a_{n+v} \\) 且 \\( z_n(j)\
  \ \\) 和 \\(\\hat{z}_n(j)\\) 均为 \\( F_n \\) 的函数，当 \\( j \\ge 1 \\) 时，Eq. (3.47) 右侧两项不相关，故有\n\
  \n\\[\n\\begin{aligned}\n\\text{V}[\\hat{e}_n(j)] &= \\text{V}[e_n(j)] + E\\{[z_n(j)\
  \ - \\hat{z}_n(j)][z_n(j) - \\hat{z}_n(j)]'\\} \\\\\n&\\equiv \\text{V}[e_n(j)]\
  \ + \\text{MSE}[z_n(j) - \\hat{z}_n(j)], \\tag{3.48}\n\\end{aligned}\n\\]\n\n其中\
  \ \\(\\equiv\\) 表示等价。尚需推导 MSE 项。对于 VAR 模型，可以推导出 MSE 的封闭式解。参见，例如，Tsay (2014, section\
  \ 2.9.2) 及其中的参考文献。对于 VAR(\\( p \\)) 模型和 1 步先行预测，有 MSE[\\( z_n(1) - \\hat{z}_n(1)\
  \ \\)] = \\( (kp+1)\\Sigma_a/(T - p) \\)。因此，得到\n\n\\[\n\\text{V}[\\hat{e}_n(1)]\
  \ = \\frac{(T - p) + kp + 1}{T - p} \\Sigma. \\tag{3.49}\n\\]\n\n由于 \\( kp + 1 \\\
  ) 是拟合 VAR(\\( p \\)) 模型中分量 \\( z_{it} \\) 的参数个数，Eq. (3.49) 意味着，对于 VAR(\\( p \\))\
  \ 模型的每个估计参数，都会以 \\( 1/(T - p) \\) 的因子增加 1 步先行预测的不确定性，其中 \\( T - p \\) 是拟合 VAR(\\\
  ( p \\)) 模型时使用的有效观测数。在实践中，该结果表明，在预测中使用适当且精简的 VAR 模型是有益的。\n\n### 3.2.6 预报误差方差分解\n\
  \n考虑 Eq. (3.42) 中的 \\( h \\) 步先行预报误差。此外，令 \\( \\eta_t = \\Sigma_a^{-1/2} a_t \\\
  )，其中 \\(\\Sigma_a^{1/2}\\) 表示 \\(\\Sigma_a\\) 的平方根矩阵。则有 V(\\( \\eta_t \\)) = \\\
  ( I_k \\)，即 \\( k \\times k \\) 单位矩阵。预报误差可写为\n\n\\[\ne_n(h) = \\Psi_0 \\eta_{n+h}\
  \ + \\sum_{j=1}^{h-1} \\Psi_j \\eta_{n+h-j}, \\tag{3.50}\n\\]\n\n其中 \\( \\Psi_0\
  \ = \\Sigma_a^{1/2} \\) 和 \\( \\Psi_j = \\Psi_j \\Sigma_a^{1/2} \\)。根据 Eq. (3.50)，有\n\
  \n\\[\n\\text{V}[e_n(h)] = \\sum_{j=0}^{h-1} \\Psi_j \\Psi_j'. \\tag{3.51}\n\\]\n\
  \n因此，对于第 \\( i \\) 个分量 \\( e_{n,t}(h) \\)，有\n\n\\[\nVar[e_{n,t}(h)] = \\sum_{j=0}^{h-1}\
  \ \\sum_{v=1}^k \\Psi_{j,iv}^2 = \\sum_{v=1}^k \\left[ \\sum_{j=0}^{h-1} \\Psi_{j,iv}^2\
  \ \\right], \\tag{3.52}\n\\]\n\n其中 \\(\\Psi_{j,iv}\\) 是 \\(\\Psi_j\\) 的第 \\( (i,\
  \ v) \\) 个元素。令 \\( w_{iv}(h) = \\sum_{j=0}^{h-1} \\Psi_{j,iv}^2 \\)，则有\n\n\\[\n\
  Var[e_{n,t}(h)] = \\sum_{v=1}^k w_{iv}(h), \\tag{3.53}\n\\]\n\n这被称为预报误差方差分解，因为 \\\
  ( w_{iv}(h) \\) 是第 \\( v \\) 个分量对 \\( z_{i,n+h} \\) 预报误差方差的影响。在文献中，比值 \\( w_{iv}(h)/Var[e_{n,t}(h)]\
  \ \\) 是预测 \\( z_{i,n+h} \\) 时归因于第 \\( v \\) 个分量的不确定性比例。\n\n#### 示例 3.2\n\n为说明利用\
  \ VAR 模型分析多元时间序列的方法，我们考虑 1980 年第一季度至 2018 年第一季度六个国家的不变价季度支出国内生产总值（GDP）。原始数据可从圣路易斯联邦储备银行的\
  \ FRED 网站获取。所考虑的国家为 (i) 美国 (US)、(ii) 英国 (UK)、(iii) 法国 (FR)、(iv) 澳大利亚 (AU)、(v) 德国\
  \ (GE) 和 (vi) 加拿大 (CA)。令 \\( z_t = (z_{1t}, \\dots, z_{6t})' \\) 为上一季度的增长率序列，即 \\\
  ( z_{it} = 100(Z_{it} - Z_{i,t-1})/Z_{i,t-1} \\)，其中 \\( Z_{it} \\) 是以 2010 年为基期且经季节调整的\
  \ GDP 指数。图 3.4 显示了 \\( z_t \\) 的时间图，左侧面板包含 US、UK 和 FR（从上到下），右侧面板包含 AU、GE 和 CA。从图中可清楚地看到\
  \ 2008 年金融危机导致的 GDP 下降（2008 年最后一季度）。唯一例外是 AU。\n\n接下来，我们使用 R 的 **MTS** 包进行分析。分析详情见附带的\
  \ R 输出。首先，我们使用信息准则来选择 \\( z_t \\) 的 VAR 阶数。在此例中，AIC、BIC 和 HQ 选取的阶数分别为 13、1 和 1。为简单起见，我们考虑\
  \ VAR(1) 模型。采用最小二乘法，得到拟合模型\n\n\\[\nz_t = \\begin{bmatrix} 0.32 \\\\ 0.28 \\\\ 0.13\
  \ \\\\ 0.54 \\\\ 0.12 \\\\ 0.07 \\end{bmatrix} + \\begin{bmatrix} 0.16 & 0.44 &\
  \ -0.18 & -0.02 & -0.02 & 0.17 \\\\ 0.15 & 0.50 & -0.00 & -0.14 & -0.05 & 0.06 \\\
  \\ 0.08 & 0.16 & 0.43 & -0.02 & -0.05 & 0.04 \\\\ 0.04 & 0.19 & -0.34 & 0.10 & 0.03\
  \ & 0.29 \\\\ 0.21 & 0.08 & 0.64 & -0.16 & -0.13 & 0.03 \\\\ 0.31 & 0.30 & -0.24\
  \ & 0.10 & 0.09 & 0.24 \\end{bmatrix} z_{t-1} + a_t,\n\\]\n\n其中某些估计量在 5% 水平下不显著。该拟合模型的信息准则分别为\
  \ AIC、BIC 和 HQ 的 \\(-6.87, -6.16, \\text{和} -6.59\\)。模型检验表明，该拟合模型的残差不具有\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_150_0.png)\n\
  \n有显著的序列相关性。然而，该模型包含若干个不显著的参数估计量。遵循建议的模型简化方法，我们使用阈值法来改进拟合的 VAR(1) 模型。\n\n我们从 t 比率的阈值\
  \ 1 开始，得到的信息准则均下降。详情见 R 输出。我们将阈值提高到 1.3，相关模型为\n\n\\[\nz_t = \\begin{bmatrix} 0.31\
  \ \\\\ 0.27 \\\\ 0.13 \\\\ 0.54 \\\\ - \\\\ - \\end{bmatrix} + \\begin{bmatrix}\
  \ 0.15 & 0.43 & -0.20 & - & - & 0.17 \\\\ 0.17 & 0.49 & - & -0.13 & - & - \\\\ 0.08\
  \ & 0.16 & 0.39 & - & - & - \\\\ - & 0.20 & -0.31 & 0.11 & - & 0.31 \\\\ 0.19 &\
  \ - & 0.61 & - & - & - \\\\ 0.32 & 0.31 & -0.21 & 0.13 & 0.09 & 0.25 \\end{bmatrix}\
  \ z_{t-1} + a_t. \\tag{3.54}\n\\]\n\n改进模型的信息准则分别为 AIC、BIC 和 HQ 的 \\(-7.00, -6.57,\
  \ \\text{和} -6.83\\)。阈值法从 VAR(1) 模型中移除了 16 个不显著参数。图 3.5 显示了 Eq. (3.54) 模型残差的 Ljung-Box\
  \ 统计量的 p 值。这些 p 值表明该模型拟合合理。图 3.6 显示了 Eq. (3.54) 中 VAR(1) 模型残差的时间图。\n\n为了解六国 GDP\
  \ 增长率之间的关系，我们可以研究 Eq. (3.54) 中拟合模型的脉冲响应函数。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_151_0.png)\n\
  \n图 3.5 Eq. (3.54) 模型残差的 Ljung-Box 统计量 p 值。横轴表示滞后阶数。\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_151_1.png)\n\
  \n图 3.6 模型 (3.54) 残差的时间图。横轴表示时间序列。\n\n图 3.7 和图 3.8 分别显示了模型的脉冲响应函数和累积脉冲响应函数。这些函数采用正交创新计算。从图中可以看出，美国季度\
  \ GDP 增长率几乎不依赖于澳大利亚和德国的增长率，但受英国、加拿大和法国增长率的影响。此外，如预期，GDP 增长率在很大程度上依赖于其自身过去值。最后，可以使用拟合模型\n\
  \n![](img/d4c84ae3c2178f4c506af3dd2ed13122_152_0.png)\n\n图 3.7 Eq. (3.54) 模型的脉冲响应函数。采用正交创新。\n\
  \n用于生成预报。1 步至 4 步先行预报及其相关误差的详情见 R 输出。预报误差方差分解也已给出。\n\n### GDP 数据的 R 输出：为节省空间，输出已编辑。\n\
  \n```\n> gdp <- read.table(\"gdpsimple6c8018.txt\",header=T)\n> dim(gdp)\n[1] 153\
  \  6\n> tdx <- c(1:153)/4 + 1980 ## Define calendar time (quarters)\n> MTSplot(gdp,tdx)\
  \   ### Time series plots\n> VARorder(gdp) ## Order selection\nselected order: aic\
  \ =  13\nselected order: bic =  1\nselected order: hq =  1\n```\n\n| p   | AIC \
  \   | BIC    | HQ     | M(p)   | p 值   |\n|-----|--------|--------|--------|--------|--------|\n\
  | 0   | -6.8887| -6.8887| -6.8887| 0.0000 | 0.0000 |\n| 1   | -7.7959| -7.0829|\
  \ -7.5063| 182.5630| 0.0000 |\n| 2   | -7.7156| -6.2895| -7.1362| 49.3614 | 0.0681\
  \ |\n| 3   | -7.5512| -5.4121| -6.6823| 36.9038 | 0.4269 |\n| 4   | -7.5679| -4.7157|\

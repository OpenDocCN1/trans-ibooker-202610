  \ 9.12(b) 显示了通用克里金的方差。有趣的是，当观测位置密集时方差较小，而当位置远离河流时方差较高。\n\n```\nR packages and commands\
  \ used: Spatial data analysis.\n> require(gstat)\n> require(sp)\n```\n\n\n\n```\n\
  > data(meuse)\n> names(meuse)\n> var(log(meuse$zinc)) ## 0.521\n> coordinates(meuse)\

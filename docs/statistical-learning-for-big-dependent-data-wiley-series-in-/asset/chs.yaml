- "# 3 多元时间序列分析\n\n本章中，我们共同考虑多个时间序列，目的是寻找它们之间的线性动态关系，并探索提高预测准确性的方法。我们关注低维时间序列。高维情况的扩展将在后面讨论。参见第\
  \ 6 章和第 7 章。在文献中，多个时间序列的分析也称为多元时间序列分析，并已得到广泛研究。参见，例如，Hannan and Deistler (1988)、Tiao\
  \ and Box (1981)、Reinsel (1993)、Lütkepohl (2005)、Tsay (2014)及其中的参考文献。我们在此的讨论简要，并强调应用。\n\
  \nLet \\(\\mathbf{z}_t = (z_{1t}, \\dots, z_{kt})'\\) be a \\(k\\)-dimensional time\
  \ series. A general class of linear models for \\(\\mathbf{z}_t\\) is the autoregressive\
  \ moving-average (VARMA) model\n\n\\[\n\\phi(B)\\mathbf{z}_t = \\mathbf{c}_0 + \\\
  theta(B)\\mathbf{a}_t, \\quad (3.1)\n\\]\n\nwhere \\(\\phi(B) = \\mathbf{I} - \\\
  sum_{i=1}^p \\phi_i B^i\\) and \\(\\theta(B) = \\mathbf{I} - \\sum_{i=1}^q \\theta_i\
  \ B^i\\) are matrix polynomials of degrees \\(p\\) and \\(q\\), respectively, \\\
  (B\\) is the back-shift operator such that \\(B\\mathbf{z}_t = \\mathbf{z}_{t-1}\\\
  ), \\(\\mathbf{c}_0\\) is a \\(k\\)-dimensional constant, and \\(\\{\\mathbf{a}_t\\\
  }\\) is a sequence of independent and identically distributed random vectors with\
  \ mean zero and positive-definite covariance matrix \\(\\Sigma_a\\). We assume that\
  \ the absolute values of the solutions of \\(|\\phi(B)| = 0\\) are greater than\
  \ or equal to 1 and those of \\(|\\theta(B)| = 0\\) are greater than 1. In other\
  \ words, we focus on the case that \\(\\mathbf{z}_t\\) is a causal time series.\
  \ Furthermore, for identifiability, we assume that (a) the rank of \\([\\phi_p,\
  \ \\theta_q]\\) is \\(k\\) and (b) \\(\\phi(B)\\) and \\(\\theta(B)\\) are left\
  \ coprime, i.e. if \\(\\phi(B) = \\mathbf{U}(B)\\phi_*(B)\\) and \\(\\theta(B) =\
  \ \\mathbf{U}(B)\\theta_*(B)\\), then \\(|\\mathbf{U}(B)|\\) is a non-zero constant.\
  \ Assumption (b) is easy to understand as there should be no non-trivial left common\
  \ factor between \\(\\phi(B)\\) and \\(\\theta(B)\\). Assumption (a) is more involved\
  \ and has been discussed in Dunsmuir and Hannan (1976), Hannan and Deistler (1998,\
  \ section 2.7), and Tsay (2014). These two assumptions are referred to as the *block\
  \ identifiability* conditions.\n\nIf the absolute values of the solutions of \\\
  (|\\phi(B)| = 0\\) are all greater than 1, then \\(z_t\\) is a weakly stationary\
  \ time series; otherwise, \\(z_t\\) is a unit-root nonstationary series. Analysis\
  \ of unit-root nonstationary multivariate time series is harder in the sense that\
  \ there exists the possibility of co-integration. By co-integration, we mean that\
  \ if some linear combinations of unit-root nonstationary series become stationary,\
  \ then the nonstationary series are co-integrated. See Box and Tiao (1977) and Engle\
  \ and Granger (1987). We discuss analysis of co-integrated series later. In what\
  \ follows, we consider some commonly used multivariate time series models and discuss\
  \ their properties and applications.\n\n## 3.1 传递函数模型\n\n传递函数模型（TFMs），在计量经济学文献中也称为分布滞后模型，在控制工程和预测中很有用。参见\
  \ Box and Jenkins (1976)。它们是通过将 \\(z_t = (x'_t, y'_t)'\\) 划分为输入（或外生）变量 \\(x_t\\\
  ) 和输出（或内生）变量 \\(y_t\\) 得到的 VARMA 模型 Eq. (3.1) 的特例。输入变量在动态上不依赖于输出变量，但输出变量依赖于输入变量。这种关系称为单向关系。在计量经济学文献中，该关系与格兰杰因果性相关，参见第\
  \ 3.2.2 节，因为 \\(x_t\\) 导致 \\(y_t\\)，但 \\(y_t\\) 不导致 \\(x_t\\)。\n\n### 3.1.1 单输入单输出\n\
  \n为简化起见，我们从单输入 \\(x_t\\) 和单输出 \\(y_t\\) 的情况开始。TFM 则变为\n\n\\(\\phi_x(B)x_t = c_x\
  \ + \\theta_x(B)b_t,\\) (3.2)\n\n\\(y_t = c_y + \\frac{\\omega(B)}{\\delta(B)}x_t\
  \ + n_t\\) (3.3)\n\nwhere \\(c_x\\) and \\(c_y\\) are constants, \\(\\phi_x(B) =\
  \ 1 - \\sum_{i=1}^{p_x} \\phi_{x,i}B^i\\) and \\(\\theta_x(B) = 1 - \\sum_{i=1}^{q_x}\
  \ \\theta_{x,i}B^i\\) are autoregressive (AR) and moving-average (MA) polynomials\
  \ of \\(x_t\\) with degrees \\(p_x\\) and \\(q_x\\), which are nonnegative integers,\
  \ \\(b_t\\) is a sequence of independent and identically distributed random variables\
  \ with mean zero and variance \\(\\sigma_b^2 > 0\\), \\(\\omega(B) = B^b(\\omega_0\
  \ + \\cdots + \\omega_s B^s)\\) and \\(\\delta(B) = 1 - \\delta_1 B - \\cdots -\
  \ \\delta_r B^r\\), \\(b\\) is a nonnegative integer and the absolute values of\
  \ the solutions of \\(\\delta(B) = 0\\) are greater than or equal to 1, and \\(n_t\\\
  ) is a disturbance term which follows a scalar ARMA model and is independent of\
  \ \\(x_t\\). In Eq. (3.2), \\(\\phi_x(B)\\) and \\(\\theta_x(B)\\) have no common\
  \ factors. Similarly, in Eq. (3.3), \\(\\omega(B)\\) and \\(\\delta(B)\\) have no\
  \ common factors. Since the scale of \\(\\omega(B)\\) is not fixed, we can start\
  \ \\(\\delta(B)\\) with 1 without causing any problem. The parameter \\(b\\) of\
  \ operator \\(\\omega(B)\\) in Eq. (3.3) is called the *dead time* or *delay* of\
  \ the model and it plays an important role in the application of TF models. It denotes\
  \ the time periods needed for the effect of the input \\(x_t\\) to appear in the\
  \ output \\(y_t\\).\n\nLet \\(v(B) = \\frac{\\omega(B)}{\\delta(B)} = v_0 + v_1\
  \ B + v_2 B^2 + \\cdots\\). The coefficients \\(v_i\\) are called the *impulse response\
  \ function* of the TFM. They are the main subject of interest in transfer function\
  \ (TF) modeling. Specifically, \\(v_i\\) is the effect on \\(y_{t+i}\\) when there\
  \ is a unit change in \\(x_t\\) and \\(\\sum_{j=0}^i v_j\\) is the cumulative effect\
  \ on \\(y_t, \\dots, y_{t+i}\\) when there is a unit change in \\(x_t\\). In particular,\
  \ \\(g = \\sum_{j=0}^\\infty v_j = v(1)\\) is the *steady-state gain* of the TFM\
  \ provided that it exists. Under the assumptions of the model in Eq. (3.3), \\(g\\\
  ) is finite if no solutions of \\(\\delta(B) = 0\\) lie on the unit circle.\n\n\
  The impulse response function \\(v_i\\) can be obtained by equating the coefficients\
  \ of \\(B^i\\) in the following equation\n\n\\((1 - \\delta_1 B - \\cdots - \\delta_r\
  \ B^r)(v_0 + v_1 B + v_2 B^2 + \\cdots) = \\omega_0 B^b + \\omega_1 B^{b+1} + \\\
  cdots + \\omega_s B^{b+s}\\).\n\nSpecifically, we have\n\n\\(v_i = \\begin{cases}\
  \ 0, & i < b, \\\\ \\omega_0, & i = b, \\\\ \\delta_1 v_{i-1} + \\delta_2 v_{i-2}\
  \ + \\cdots + \\delta_r v_{i-r} + \\omega_{i-b}, & i = b+1, \\dots, b+s, \\\\ \\\
  delta_1 v_{i-1} + \\delta_2 v_{i-2} + \\cdots + \\delta_r v_{i-r}, & i > b+s. \\\
  end{cases} \\quad (3.4)\\)\n\nIn general, the coefficients \\(v_i\\) consist of\n\
  \n- 1. $b$ zero values $v_0, v_1, \\dots, v_{b-1}$ provided that $b > 0$.\n- 2.\
  \ A further $s-r+1$ values $v_b, v_{b+1}, \\dots, v_{b+s-r}$ following no fixed\
  \ pattern provided that $s \\ge r$.\n- 3. Values $v_i$ with $i \\ge b+s-r+1$ satisfying\
  \ the $r$th order difference equation \\(\\delta(B)v_i = 0\\) with starting values\
  \ $v_{b+s}, v_{b+s-1}, \\dots, v_{b+s-r+1}$.\n\nIt pays to study the relationships\
  \ between $v_i, \\omega_j$, and $\\delta_\\ell$ as they are useful in specifying\
  \ $b, r$, and $s$ in practice.\n\nThe polynomial ratio $\\frac{B^b \\omega(B)}{\\\
  delta(B)}$ of Eq. (3.3) is sufficiently flexible for handling the impulse response\
  \ function $v_i$ in most applications, even with lower orders $r$ and $s$. For instance,\
  \ Figure 3.1 shows the impulse response functions and cumulative impulse response\
  \ functions of (a) $v(B) = \\frac{(0.4+0.48B)B^2}{1-0.5B}$ (left panel) and (b)\
  \ $v(B) = \\frac{0.5B^2}{1-1.3B+0.4B^2}$ (right panel). The steady-state gain of\
  \ Example (a) is $g = 1.6$, whereas that for Example (b) is $g = 5$.\n\nGiven the\
  \ observations $\\{x_t, y_t | t = 1, \\dots, T\\}$, TF modeling is concerned with\
  \ identifying a suitable model in Eqs. (3.2) and (3.3). The model for the input\
  \ variable $x_t$ can be obtained by applying the methods of scalar series discussed\
  \ in Chapter 2. Thus, we focus on identifying the model in Eq. (3.3). For simplicity,\
  \ assume $c_y = c_x = 0$ and rewrite the model as\n\n$$y_t = v(B)x_t + n_t = v_0\
  \ x_t + v_1 x_{t-1} + v_2 x_{t-2} + \\cdots + n_t. \\quad (3.5)$$\n\nSince $n_t$\
  \ and $x_t$ are independent, one can multiply Eq. (3.5) by $x_{t-j} (j \\ge 0)$\
  \ and take expectation to obtain\n\n$$\\gamma_{yx}(j) = v_0 \\gamma_{xx}(j) + v_1\
  \ \\gamma_{xx}(j-1) + v_2 \\gamma_{xx}(j-2) + \\cdots ,$$\n\nwhere $\\gamma_{yx}(j)\
  \ = \\text{cov}(y_t, x_{t-j})$ and $\\gamma_{xx}(j) = \\text{cov}(x_t, x_{t-j})$.\
  \ The prior equation, however, is not particularly useful because $x_t$ is typically\
  \ serially dependent with many non-zero\n\n\n\n\n![](img/d4c84ae3c2178f4c506af3dd2ed13122_135_0.png)\n\
  \n图 3.1 两个传递函数示例的冲激响应与累积冲激响应函数。左侧面板：\\(v(B) = \\frac{0.4+0.4B+0.3B^2}{1-0.5B}\\\
  ) 和右侧面板：\\(v(B) = \\frac{0.5B^2}{1-1.3B+0.4B^2}\\)。\n\n\\(\\gamma_{xx}(j)\\)。缓解\
  \ \\(x_t\\) 中序列相关性影响的一种方法是预白化法，我们将在下一节介绍。有关预白化的更多细节可参见 Box et al. (2015)。\n\n###\
  \ 预白化\n\n将等式 (3.5) 两边乘以 \\(\\frac{\\phi_x(B)}{\\theta_x(B)}\\)，得\n\n\\(\\frac{\\\
  phi_x(B)}{\\theta_x(B)}y_t = v(B)\\frac{\\phi_x(B)}{\\theta_x(B)}x_t + \\frac{\\\
  phi_x(B)}{\\theta_x(B)}n_t.\\)\n\n令 \\(\\eta_t = \\frac{\\phi_x(B)}{\\theta_x(B)}y_t\\\
  ) 且 \\(\\tilde{n}_t = \\frac{\\phi_x(B)}{\\theta_x(B)}n_t\\)。则前一等式变为\n\n\\(\\eta_t\
  \ = v(B)b_t + \\tilde{n}_t = v_0 b_t + v_1 b_{t-1} + v_2 b_{t-2} + \\cdots + \\\
  tilde{n}_t, \\quad (3.6)\\)\n\n其中，\\(b_t\\) 是白噪声序列且与 \\(\\tilde{n}_t\\) 独立，\\(\\\
  eta_t\\) 被称为 \\(y_t\\) 的预白化序列。将等式 (3.6) 两边乘以 \\(b_{t-j} (j \\ge 0)\\) 并取期望，得\n\n\
  \\(\\gamma_{\\eta b}(j) = v_j \\gamma_{bb}(0), \\quad j \\ge 0, \\quad (3.7)\\)\n\
  \n再次说明，\\(\\gamma_{\\eta b}(j) = \\text{cov}(\\eta_t, b_{t-j})\\) 且 \\(\\gamma_{bb}(j)\
  \ = \\text{cov}(b_t, b_{t-j})\\)。等式 (3.7) 提供了冲激响应权重 \\(v_j\\) 的一个一致估计量。具体地，有\n\n\
  \\(\\rho_{\\eta b}(j) = v_j \\sqrt{\\frac{\\gamma_{bb}(0)}{\\gamma_{\\eta\\eta}(0)}},\
  \ \\quad j = 0, 1, 2, \\dots, \\quad (3.8)\\)\n\n其中 \\(\\rho_{\\eta b}(j)\\) 是 \\\
  (\\eta_t\\) 与 \\(b_{t-j}\\) 之间的相关性。换句话说，\n\n\\(v_j = c \\times \\rho_{\\eta b}(j),\
  \ \\quad j \\ge 0, \\quad (3.9)\\)\n\n其中 \\(c\\) 表示 \\(\\eta_t\\) 与 \\(b_t\\) 的标准误之比。在实际中，\\\
  (b_t\\) 由 \\(x_t\\) 的残差序列估计，\\(\\eta_t\\) 是通过 \\(x_t\\) 的模型得到的输出变量 \\(y_t\\) 的预白化序列。\n\
  \n为指定阶数 \\(r, s\\) 和 \\(b\\)，可以利用等式 (3.4) 中所示的 \\(v_i\\) 模式，特别是对于 \\(i > b+s\\)\
  \ 的差分方程 \\(v_i - \\sum_{j=1}^r \\delta_j v_{i-j} = 0\\) 以及对于 \\(i < b\\) 的 \\(v_i\
  \ = 0\\)。这可以通过 _角形法_ 完成，如下所示。\n\n### 角形法\n\n角形法旨在展示传递函数模型（TFM）冲激响应权重 \\(v_j\\) 的模式。构建一个双向表，行编号为\
  \ \\(0, 1, 2, \\dots\\)，列编号为 \\(1, 2, 3, \\dots\\)。表中的每个元素都是标准化冲激函数值 \\(u(B) = v(B)/v_{\\\
  max}\\) 组成的矩阵的行列式，其中 \\(v_{\\max} = \\max_j \\{|v_j|\\}\\)。双向表的第 \\((i, j)\\) 个元素是\
  \ \\(j \\times j\\) 矩阵的行列式\n\n\\( M(i, j) = \\left[ \\begin{array}{cccc} u_i & u_{i-1}\
  \ & \\cdots & u_{i-j+1} \\\\ u_{i+1} & u_i & \\cdots & u_{i-j+2} \\\\ \\vdots &\
  \ \\vdots & \\ddots & \\vdots \\\\ u_{i+j-1} & u_{i+j-2} & \\cdots & u_i \\end{array}\
  \ \\right], \\)\n\n其中，若 \\(i < 0\\)，则 \\(u_i = 0\\)。根据等式 (3.4) 中 \\(v_i\\) 的模式，我们看到\
  \ (a) 对于 \\(i \\le b - 1\\)，\\(|M(i, j)| = 0\\)，因为当 \\(i \\le b - 1\\) 时 \\(M(i,\
  \ j)\\) 第一行的所有元素均为零；(b) 对于 \\(j > r\\) 且 \\(i > b + s\\)，\\(|M(i, j)| = 0\\)，因为\
  \ \\(M(i, j)\\) 的行由 \\(v_i\\) 的差分方程引入线性相关；(c) 对于 \\(i = b, \\dots, b + s\\)，\\(|M(i,\
  \ j)| \\neq 0\\)，因为存在 \\(w_{i-b}\\)。因此，角形法表应呈现图 3.1 所示的模式，从中可以识别出 \\((r, s, b)\\\
  ) 的值。\n\n具体地，从表 3.1 中，我们可以按如下方式识别 \\(b, r, s\\)：\n\n- \\(b\\) 表示表中包含一些非零项的第一行。\n\
  - 存在一个左上角位于 \\((s + b + 1, r + 1)\\) 的零矩形，从中可以识别出 \\(r\\) 和 \\(s\\)。\n\n为演示，表 3.2\

  0.47。与欧洲和北美相比，南美 11 月的平均气温似乎较低且变动相对较小。转到样本 CCM。在此特定情况下，\(k=3\)，因此每个 CCM 包含 9 个实数。假设我们想使用样本
  CCM 的前 12 个滞后来检查三个序列的动态依赖性。这将要求我们同时破译 108 个数字。另一方面，通过检查简化 CCM，动态依赖模式相对容易理解，如下所示。



  ## 备注。以下是一些需要说明的事项。


  - 示例 1.1 的演示由 R 中的 **MTS** 包完成。使用的命令是 `ccm`，采用默认选项。


  ```

  da <- read.table("temperatures.txt", header=TRUE)

  da <- da[,-1] # remove time index

  require(MTS)

  ccm(da)

  ```


  - 如果维度 k 接近或大于样本量 T，则上述样本 CCM 的性质不再成立。我们将在后续章节（例如第 6 章）讨论这种情况。


  - 当维度 k 较大时，即使是简化 CCM S(l) 也难以理解，必须使用一些汇总统计量。在本书中，我们提供三种汇总统计量来提取样本 CCM 中嵌入的有用信息。它们如下：


  - P 值图：原假设 H0 : R(l) = 0 的 p 值与滞后 l 的散点图。在 z_t 对 l > 0 不存在串行或交叉相关性的原假设下，所使用的检验统计量渐近地服从
  chi^2_{k^2} 分布。检验统计量的细节在第 3 章给出。


  - 对角线元素图：R^(l) 的显著对角线元素比例与 l 的散点图。此处，若 R^(l) 的某元素绝对值大于 2/sqrt(T)，则称其为显著。


  - 非对角线元素图：R^(l) 的显著非对角线元素比例与 l 的散点图。同样，R^(l) 元素的显著性是相对于 2/sqrt(T) 的。


  这三个汇总图的 R 命令是 SLBDD 包中的 Summaryccm，该包与本书相关联。


  ## 示例 1.2


  考虑图 1.2 中世界 99 个金融市场指数的日收益率。此处 k = 99，理解任何 99×99 交叉相关系数矩阵都会很困难。图 1.14 显示了日收益率的三种汇总统计量。上图是
  p 值的散点图。从图中可以看出，所有 p 值都接近于零，表明滞后 1 到 12 时，99 维收益率中存在串行相关和交叉相关。中间图显示 R(l) 显著对角线元素的比例。该图显示，世界
  99 个金融指数的日收益率中存在显著的串行相关。但是，正如预期的那样，串行相关衰减很快，因此随着 l 增大，比例趋近于零。底图显示 R(l) 对 l 的显著非对角线元素比例。该图表明，当
  l 较小时，世界金融市场指数的日收益率之间存在显著的交叉依赖。正如预期的那样，随着 l 增大，交叉依赖也会很快衰减到零。


  ## 汇总 CCM 图所用的 R 命令：


  ```

  require(SLBDD)

  da <- read.csv2("Stock_indexes_99world.csv",header=FALSE)

  da <- as.matrix(da[,-1]) # remove the time index

  rt <- diff(log(da)) # log returns

  Summaryccm(rt)

  ```





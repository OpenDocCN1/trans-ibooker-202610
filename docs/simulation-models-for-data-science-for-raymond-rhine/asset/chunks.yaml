- raw: 'In the terminology of network theory, each bank can be described in terms
    of two degree properties: the in-degree or the number of incoming links representing
    assets owed to the bank, and out-degree or the number of outgoing links representing
    liabilities to other banks.


    In addition to modeling relationships between banks, the study authors also modeled
    properties of each bank. These included the banks assets and liabilities. . Assets
    were broken down into two type: interbank assets, which are claims on other banks,
    and illiquid external assets, such as mortgages. Liabilities also come in two
    forms: liabilities owed to other banks and customer deposits, which are funds
    owed to customers.


    The capital buffer of a bank is the difference between the value of the bank’s
    assets and liabilities. A bank is considered solvent if as long as its assets
    are greater than its liabilities. A bank fails when its losses on interbank assets
    plus any lost value on mortgages exceed its capital buffer. The authors also defined
    a bank as vulnerable when it did not have sufficien capital buffer to cover the
    loss if one of its neighboring banks defaulted and could not pay its obligations
    to the bank.


    The authors built a benchmark network of 1,000 banks and randomly defined links
    between banks. (They also modeled 10,000 banks but the increase in nodes did not
    change the overall results of the study). They then ran simulations that started
    with all banks solvent, and then introduced an initial shock. There were two types
    of shocks. One was a single bank failure. In this study, a bank failure was modeled
    as the loss of all of a banks assets. The authors also modeled aggregate shocks,
    in which all banks experience a loss in value of external assets, like mortgage
    backed securities. This second type of shock modeled the impact of marking asset
    values to their current market value at times when the value of those assets are
    dropping in general across the market.


    The model simulates financial contagion through the network using two transmission
    methods: direct exposure to a failing bank and indirect contagion through a loss
    of liquidity in assets held by the bank.


    When a bank fails, such as at the start of a simulation, then all of its neighboring
    banks that are its creditors incur a loss. The creditor banks loss all of the
    value of the interbank assets held against the defaulting bank. Now, the creditor
    banks have to update their capital buffer to reflect this loss. If their capital
    buffer is not sufficient to cover this loss, then they too become a failed bank.
    Failures in the creditor banks trigger another round of contagion possibly leading
    to other bank failures. The process continues until no new banks are sent into
    default.


    ![](assets/figure_1-7_financial_contagion_diagram.png)


    The model also captures the impact of asset-related contagion in which a default
    leads the defaulting bank to sell its assets. The sudden sales of large volumes
    of an asset, known as a fire sale, can cause the price to drop. When that happens,
    all banks have to mark to market and adjust the value of their capital buffer.
    If their buffer drops too much, they become vulnerable.


    # The Results


    Running multiple simulations, the authors were able to identify a number of important
    characteristics of how financial contagion spread in the network.


    The most imporant finding is that financial networks exhibit a “robust-but-fragile
    tendency.” In highly connected financial networks, a large number of links from
    a failed bank allow the losses to be distributed to more institutions. This provides
    risk-sharing benefits and leads to a low probability of contagion. At the same
    time though, a high number of links increases the potential for contagion to spread.
    This leads to fragility in the network. The probability of a contagion peaks at
    intermediate levels of connectivity before falling off. The risk of contagion
    continues to increase as the interconnectedness of the network increases. This
    is because banks are exposed to multiple defaults of interconnected banks, an
    increase chance of vulnerability to second-round defaults which can further deplete
    capital buffers.


    The overall result is that high connectivity lowers the probability of contagion
    because losses are widely shared, but it also dramatically increases the severity
    of default event if a cascade begins, because banks are linked to so many others,
    making them susceptible to multiple hits during the contagion process.


    ![](assets/figure_1-8_robust_fragile_paradox.png)


    In this study, simulation allowed researchers to clarify and quantify the complex,
    non-linear dynamics of contagion in a realistic network model. For example, is
    showed that probability of contagion is not monotonically related to connectivity
    and instead, the probability peaks at intermediate levels of connectivity and
    then drops off as connectivity increases. This reflects the impact of both the
    spreading of risk while increasing the routes by which contagion can spread. Overall,
    the use of simulation allowed the authors to generate quantitative and testable
    model results that captured some of the non-linear, high-complexity processes
    at work in financial networks.


    ## Comparison of Modeling Approaches


    Different modeling approaches have different strengths and weaknesses. Table 1-1
    compares statistical models, machine learning approaches, and simulation modeling
    across several dimensions to help you choose the right tool for your specific
    problem. Statistical and machine learning methods excel at analyzing historical
    patterns and predicting known outcomes. Simulation modeling is well suited to
    exploring novel scenarios, revealing causal mechanisms, and discovering emergent
    phenomena like tipping points and cascading dynamics.


    |  || Traditional Statistical Methods || Machine Learning Approaches || Simulation
    Modeling |


    | --- | --- | --- | --- |


    | **Description** || Regression analysis, correlation studies, time series models
    (ARIMA, VAR), probability distributions from historical data || Neural networks,
    random forests, support vector machines, deep learning models trained on historical
    patterns || Agent-based models, network simulations, Monte Carlo methods that
    recreate system dynamics and test scenarios |


    | --- | --- | --- | --- |


    | **Data Requirements** || Historical failure data; Interbank exposures; Financial
    time series; Regulatory reports || Large training datasets; Labeled examples of
    failures; Multiple crisis episodes; Feature engineering data || Network structure;
    Balance sheet data; Behavioral rules/assumptions; Estimating parameters |


    | **Key Strengths** || Well-established theory; Interpretable results; Clear assumptions;
    Fast computation; Confidence intervals; Hypothesis testing || Captures complex
    patterns; Non-linear relationships; Handles big data well; Scales with data ||
    Tests “what-if” scenarios; Explores novel situations; Reveals causal mechanisms;
    No historical data needed; Models emergence; Experiments possible |


    | **Key Limitations** || Assumes future is like past; Rare events not adequately
    represented; Linear relationships; Misses emergent behavior; Cannot test new scenarios;
    Correlations without insights about causation || “Black box” decisions; Needs
    massive data; Overfitting risk; Poor on rare events; Cannot extrapolate well;
    Doesn’t explain “why” || Model uncertainty; Parameter estimation; Computational
    cost; Validation challenges; Requires domain expertise; Simplified assumptions
    |


    | **Best Use Cases** || Analyzing historical patterns; Testing specific hypotheses;
    Measuring correlations; Short-term forecasting; When data is abundant || Pattern
    recognition tasks; Predicting known outcomes; Large dataset analysis; Real-time
    risk scoring; Classification problems || Novel scenarios; Policy experiments;
    Understanding mechanisms; Rare event analysis; Network structure effects |'

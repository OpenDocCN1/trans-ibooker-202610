    code. This democratization does not eliminate the need for expertise and domain
    knowledge in complex simulation projects, but it reduces the barrier to entry
    for many use cases.


    Spreadsheets democratized financial modeling and SQL democratized data analysis.
    Now AI-assisted simulation is making systems thinking and what-if analysis available
    to data professionals and software developers who can clearly specify their business
    problem, identify appropriate modeling techniques, and validate models. Simulation
    is no longer a specialized niche capability; it is a general-purpose tool that
    should be in every data professional’s toolkit.



    容量边界是硬性限制。无论我们多么努力，生产速度最高为每分钟 20 个单位的机器都不会生产出每分钟 30 个单位的产品，无论线性预测说什么。我们经常使用拟合历史数据的线性模型，假设趋势可以无限持续。实际上，当我们接近容量约束时，会遇到破坏流程并导致系统行为突然变化的不连续性。例如，一家货运公司每班可处理
    15,000 至 25,000 个包裹。运送的包裹越多，每个包裹的运送时间就越长。基于历史数据的线性模型发现，每增加 1,000 个日包裹，耗时增加 0.2
    小时。节假日高峰期某一天，公司一天处理了 32,000 个包裹。预测的交付时间为 8.6 小时，但实际交付时间接近 15 小时。问题在于该设施每班最多可处理
    28,000 个包裹，因此有 4,000 个包裹留给了下一班。用于构建线性模型的数据并未反映超出容量时会发生的情况。


    ## 竞争共享资源


    共享资源尤其容易在系统中引入难以建模的行为。当多个流程依赖于同一资源时，系统的输出就会受到对共享资源总需求的影响，以及到达时间、优先级规则和各种处理请求之间交互模式的影响。对共享资源的竞争会在系统中产生连锁反应。一个流程的需求激增会消耗共享资源的容量，从而阻碍其他依赖同一共享资源的独立流程。共享资源竞争的这类情况表现出所谓的路径依赖，即到达的顺序除了整体工作负载之外也会影响系统输出。


    ## 不确定性和风险传播


    我们投入数据分析和决策支持的大部分精力都集中在降低不确定性上。执行决策者最后希望听到的是，对如何推进的提问的回答是“视情况而定”。同样，决策者也不希望被意想不到的风险打个措手不及。


    ### 复合不确定性


    我们习惯于在处理历史数据时使用单点估计。我们可以确定上季度的收入为 420 万美元。我们无法确定下季度的收入将为 460 万美元。我们能知道的更准确的描述是“我们预计下季度收入将在
    390 万美元至 500 万美元之间，其中 460 万美元最有可能。” 除了提供虚假的确定性感之外，单点估计还会隐藏在可能值分布中潜藏的重要信息。例如，如果低估
    20% 的负面影响大于高估 20%，那么决策者就需要知道各自的概率。单点估计并不能告诉我们太多关于分布尾部的<|message|>。我们可能预计下季度为 460
    万美元，但达到仅 360 万美元的概率是多少？了解分布可以提供对可能结果范围的洞察，而不仅仅关注单一、最可能发生的事件。


    下季度的实际收入将受到多个因素的影响，例如进入商店的客户数量、平均订单价值以及退货数量。每个因素最好用分布而不是单点估计来描述。蒙特卡洛模拟对于理解多种不确定性的组合如何影响感兴趣的结果，例如季度总收入，特别有帮助。（有关蒙特卡洛方法的更多信息，请参阅第
    3 章。）


    ![](img/figure_2-3_point_estimate_vs_distribution.png)


    ### 脂肪尾分布和罕见事件


    当我们提到“分布”这个词时，你可能会想到钟形、正态曲线。正态分布被假设用于许多统计检验，而且有充分的理由。现实生活中我们遇到的许多分布都是正态分布。正态分布的一个特征是值倾向于围绕中心值聚集。另一个特征是极值迅速递减。随着我们远离中心趋势的值，极值的可能性急剧下降。事实上，在正态分布中，分布的尾部呈指数衰减。这意味着这些极端范围内的事件极其罕见，可想而知是十亿分之一的机会。


    另一类分布被称为脂肪尾分布。在这些分布中，极端事件发生的频率远高于正常情况。这是因为脂肪尾分布呈多项式衰减而不是指数衰减。许多现实世界现象表现出幂律分布，包括财富分布、城市人口、网站流量和图书销售。亿万富翁的数量不断增加，超级城市自然源于增长动力，少数网站主导网络流量，而畅销书的销量远高于大多数书籍。


    正常和幂律分布尾部行为差异的实际意义在于，在正态分布下极其罕见或几乎不可能发生的事件，在幂律分布下是可能发生的，并且以可知的频率发生。2008 年金融危机就是历史数据分析未能预测到的幂律尾部事件的一个例子。


    在构建模拟时，我们需要特别小心地选择分布。在幂律分布中，没有典型事件规模可供其他事件围绕其聚集。这意味着极值会强烈影响平均值，并误导我们对中心趋势的假设。在某些幂律分布中，标准差和方差可能为无穷大，因此这些统计数据对决策毫无用处。传统的置信区间假设分布的方差是有限的，并且存在中心趋势，而对于某些幂律分布来说，这两者都不成立。尽管常用的统计数据在处理幂律分布时没有帮助，但使用适当的幂律分布的模拟可以帮助我们更好地理解肥尾风险。


    ![](img/figure_2-4_power_law_normal_comparison.png)


    图 2.4 显示了正态分布如何形成对称的钟形曲线，其尾部很薄，在均值三倍标准差处消失。幂律分布则在小值处达到峰值，然后缓慢衰减，遵循公式：


    > P(X>x)∼x−α


    幂律分布中的参数 α（alpha）决定了尾部的厚重程度。α 值较低的幂律分布具有更重的尾部。


    ## 自适应行为


    系统的自适应行为可能难以预测。当我们使用统计数据来理解过去的行为并将这些发现应用于对未来的期望时，我们隐含地假设驱动过去结果的因素将以类似的方式继续驱动未来的结果。在许多情况下这是合理的假设。如果一家分销商有
    1 年的历史记录，显示零售商每周订购该产品的 1,000 至 1,100 个单位，那么假设这种模式将在下周继续是合理的。在这种情况下，系统中的参与者表现出易于预测的方式。零售商和分销商有共同的利益，双方都从可预测的协作行为中受益。这并不总是如此。



    供应链并不是唯一受到这些现象影响的业务流程。\n\n## 产能规划：平均值是不够的\n\n想象你是一家医疗保健公司的数据科学家。你被要求帮助为急诊室建模产能规划。你开发了一个模型来预测按小时、按天和按季节的平均患者到达量。你仔细研究了历史数据的变化，并考虑了流感季节、恶劣天气条件和当地高流量事件等因素。你也知道验证模型的重要性，因此你使用时间序列交叉验证并跟踪诸如平均绝对误差（`MAE`）、平均绝对百分比误差（`MAPE`）和均方根误差（`RMSE`）等指标。你的模型效果良好，日均预测\
    \ `MAPE` 为 8%，每小时到达预测 `MAPE` 为 15%。\n\n验证结果很有前景，但它们与现实相比如何？让我们选一个时间段，比如周一晚上 7\
    \ 点到 8 点，看看一年的数据是什么样子的。\n\n图 1-2 显示了 52 周内周一 7 点到 8 点的实际到达人数。\n\n| Week | Arrivals\
    \ | Week | Arrivals | Week | Arrivals | Week | Arrivals |\n| --- | --- | --- |\
    \ --- | --- | --- | --- | --- |\n| 1 | 12 | 14 | 9 | 27 | 11 | 40 | 8 |\n| ---\
    \ | --- | --- | --- | --- | --- | --- | --- |\n| 2 | 11 | 15 | 13 | 28 | 10 |\
    \ 41 | 12 |\n| 3 | 10 | 16 | 8 | 29 | 14 | 42 | 9 |\n| 4 | 13 | 17 | 12 | 30 |\
    \ 9 | 43 | 11 |\n| 5 | 9 | 18 | 10 | 31 | 13 | 44 | 10 |\n| 6 | 11 | 19 | 11 |\
    \ 32 | 8 | 45 | 13 |\n| 7 | 8 | 20 | 9 | 33 | 12 | 46 | 9 |\n| 8 | 12 | 21 | 13\
    \ | 34 | 10 | 47 | 11 |\n| 9 | 10 | 22 | 8 | 35 | 11 | 48 | 8 |\n| 10 | 14 | 23\
    \ | 12 | 36 | 9 | 49 | 12 |\n| 11 | 9 | 24 | 10 | 37 | 13 | 50 | 10 |\n| 12 |\
    \ 11 | 25 | 11 | 38 | 8 | 51 | 11 |\n| 13 | 10 | 26 | 9 | 39 | 12 | 52 | 9 |\n\
    \n![](img/figure_1-2_er_distribution.png)\n\n你的模型预测该时段每小时平均 10.5 名患者。实际数据的平均值也是每小时\
    \ 10.5 名患者。你的模型在平均值上是准确的。问题是“平均值”并不能说明全部情况。\n\n在全年的 52 周中，急诊室有 10 或 11 名患者 32\
    \ 次（占 62% 的周）。有 8 或 9 名患者 15 次（占 29% 的周），有 12、13 或 14 名患者 5 次（占 10% 的周）。如果急诊室按平均值配备人员，他们将有\
    \ 10% 的时间人手不足，有 29% 的时间人手过剩。\n\n这就是理解变异性变得至关重要的地方。到达人数的标准差为 1.7 名患者。如果我们希望 90%\
    \ 的时间确保人员配备充足，我们需要计划大约每小时 12.7 名患者（均值 + 1.3 个标准差）。如果我们希望 95% 的覆盖率，我们需要计划每小时 13.3\
    \ 名患者（均值 + 1.65 个标准差）。\n\n但到达率只是故事的一部分。服务时间也会变化。如果平均服务时间为 45 分钟，标准差为 15 分钟，且有两名医生值班，排队理论告诉我们系统利用率为：\n\
    \n> 利用率 = （到达率 × 服务时间）/ 服务器数量 = （10.5 × 0.75）/ 2 = 0.39 或 39%\n\n![](img/figure_1-3_queueing_utilization.png)\n\
    \n在 39% 的利用率下，平均等待时间是可以管理的。但当到达人数激增至每小时 14 名患者时会发生什么？利用率跃升至 52.5%，平均等待时间由于非线性排队效应而超过一倍。在\
    \ 80% 的利用率下，系统接近瘫痪，等待时间可能超过数小时。\n\n模拟可以帮助我们识别变异性的全范围，以便我们可以解决不同的多种可能情景，而不是只关注平均情景。\n\
    \n## 竞争市场动态\n\n竞争动态为传统分析方法带来了另一个挑战。考虑一个零售定价问题。两家竞争商店销售类似产品。你拥有不同价格点的历史销售数据，并建立了价格弹性模型。你的模型表明，将价格下调\
    \ 10% 将使销量增加 18%，从而使毛收入增加 6%。\n\n你实施了降价并观察你的竞争对手。一周内，他们匹配了你的降价。你的销量仅增加 9% 而不是\
    \ 18%，毛收入下降了 2%。你的模型未能考虑竞争反应。\n\n让我们用一个简单的例子来量化这一点。假设两家商店目前每周各售出 1,000 件单位，单价为\
    \ $50，每周收入为 $50,000。以下是不同情景下发生的情况：\n\n*   **基准**\n    *   你的价格：$50\n    *   竞争对手价格：$50\n\
    \    *   你的销量：1,000\n    *   竞争对手销量：1,000\n    *   你的收入：$50,000\n    *   竞争对手收入：$50,000\n\
    *   **你降价，他们维持**\n    *   你的价格：$45\n    *   竞争对手价格：$50\n    *   你的销量：1,800\n \
    \   *   竞争对手销量：600\n    *   你的收入：$81,000\n    *   竞争对手收入：$30,000\n*   **你降价，他们匹配**\n\
    \    *   你的价格：$45\n    *   竞争对手价格：$45\n    *   你的销量：1,090\n    *   竞争对手销量：1,090\n\
    \    *   你的收入：$49,050\n    *   竞争对手收入：$49,050\n*   **两者都提高**\n    *   你的价格：$55\n\
    \    *   竞争对手价格：$55\n    *   你的销量：850\n    *   竞争对手销量：850\n    *   你的收入：$46,750\n\
    \    *   竞争对手收入：$46,750\n\n“你降价，他们匹配”情景说明了现实中发生的情况。竞争对手的理性反应是匹配你的降价以防止失去市场份额。结果是两家公司在较低价格点上赚取的收入更少。仿真建模可以帮助我们识别对我们行动的反应效果，并提供更现实的可能结果图景。\n\
    \n# 传统分析的局限性\n\n为什么传统数据科学方法在这些业务问题上会遇到困难？局限性分为五类：依赖历史模式、将相关性与因果性混淆、动态系统的静态快照、关注中心趋势而忽视极端情况，以及对延迟和滞后的处理不足。\n\
    \n## 依赖历史模式和新情况的问题\n\n机器学习模型是在历史数据上训练的。它们从过去学习模式并假设这些模式会延续到未来。当未来与过去相似时，这效果很好。当条件发生变化时就会失败。\n\
    \n考虑产能规划示例。如果我们根据历史急诊室到达数据训练模型，它将准确预测平均到达率。但如果附近开了一家新的急诊护理中心？或者一家大型雇主关闭，改变了该地区的\
    \ demographics？或者大流行改变了人们寻求医疗的行为模式？历史模式可能不再适用。\n\n牛鞭效应示例说明了另一个局限性。历史数据可能显示需求模式稳定，因为供应链一直处于均衡状态。但当需求突然激增时会发生什么？如果没有历史的大需求冲击示例，预测模型就无法预见到放大效应。\n\
    \n仿真模型并不完全依赖历史模式。它们对产生结果的潜在机制进行建模。通过表示组件和交互规则，仿真可以探索从未在历史上发生过的情景。\n\n## 理解相关性但不理解因果性\n\
    \n大多数预测模型在数据中识别相关性。这些相关性可能具有高度预测性，但可能并不反映因果关系。如果不了解因果关系，我们就无法可靠地预测干预的效果。\n\n"

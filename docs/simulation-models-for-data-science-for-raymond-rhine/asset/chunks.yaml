- raw: 'In competitive environments, actors have incentive to adjust their own behavior
    in response to compentitors actions. Consider how traders behave in equity markets.
    High frequency traders take advantage differneces in stock prices on different
    exchanges. For example, a company announces better than expected earnings and
    this price of that stock on one exchange goes up while the price on a second exchange
    does not go up for fractions of a second. A high frequency trading algorithm detects
    the difference, buys shares on the slower exchange and sells them on the faster
    exchange. The time period when there is a difference in stock price across markets
    is known as an arbitrage window. Anytime there is an arbitrage window, actors
    have incentives to adapt their behavior to take advantage of it.


    Customers adapt their behavior to changes in the quality or cost of a service.
    If a streaming company increases the cost of their premium service by $3 per month,
    some customers will absorb the cost, some will cancel, and some will down grade
    to a lower-tier service.There may be secondary effects, too, such as increased
    account sharing and shifting viewing time to competitor services. The change may
    also prompt streaming service competitors to offer special discounts to customers
    still paying for the premium service. The overall result of the price change may
    be an increase in reveneue in the short term but there is also a risk that over
    the long term customers will cancel or downgrade their service while customers
    that remain be less satisfied with the service.


    ## Path Dependence and Historical Contingency


    Path dependecies describe how the state of a system are an outcome of present
    conditions as well as some sequence of events that occurred earlier in the history
    of the system. The historicial events may seem insignificant at the time but can
    lock a system into trajectories that last a long time. For example, in the 1970s
    two companies developed competing video cassette recording formats: Sony created
    Betamax and JVC created VHS. Betamax provided better picture quality and smaller
    cassettes. VHS offered longer recording time, 2 hours instead of 1 hour. In addition,
    JVC licensed VHS to competitors while Sony maintained stricter controls over Betamax.
    JVC’s approach lead to more manufacturers selling VHS players and that drove down
    costs. Lower costs drove higher adoption by consumers and higher adoption drove
    studios to prodouce more VHS formatted content, which incentivized even more adoption
    of the VHS format. This example shows how a single feature, video length, create
    an early adoption trend that is reinforced by other factors and leads to an insurmontable
    lead that competitors cannot overcome.


    Other examples of path dependence occur when cities make choices about infrastructure.
    One city decides to develop a highway through downtown. This makes suburban areas
    more easily accessible prompting businesses to move stores and offices near highway
    exits in the suburbs where land costs and rents are less expensive. People move
    to the suburbs for larger houses and short commutes to work in the city. Over
    time, the ability of the city to generate tax revenue from businesses declines.
    Meanwhile, another city that choose to develop dense clusters around public transit
    stations with walkable neighborhoods finds its tax base grows over time as the
    city amenities and services drive up the value of the urban land. Each decision
    was made at a point in time but had lasting impact long into the future.


    Traditional analytics, like any tool, work well for the uses it was designed for.
    When we vary from the assumptions underlying these tools, we run into problems.
    We have seen how feedback loops create dynamics that linear models miss and how
    delays can generate costs that are immediately obvious. Non-linear effects can
    cause phase transitions which are sudden and dramatic shifts in the state of a
    system while capacity constraints can invalidate our projections when we hit those
    capacity limits. Mulitple sources of uncertainty can compound difficulties in
    making predictions while adaptive behaviors undermine assumptions about the past
    being a good indicator of the future. Path dependencies can lock us into trajectories
    that are difficult and costly to undo. Fortunately for us, simulation models can
    help us understand systems subject to any of these factors.


    # How to Identify Simulation Opportunities in Your Organization


    By now it is clear there are use cases where traditional analytics are not a good
    fit, but how can we identify those? When should we consider using simulation models
    to address these use cases? To identify simulation opportunties in your organizaiton,
    you should:


    *   Look for warning signs that traditional analytics will not be sufficient


    *   Assess decision context characteristics and modeling feasibility


    *   Build and evaluate the business case for simulation modeling


    These steps will help us understand both the charcteristics of the problem and
    the importance of the problem to our organizaiton.


    ## Recognizing Simulation Modeling Opportunities


    We can often find simulation modeling opportunties by considering use cases where
    traditiona analytics will be challenged and by looking for system characteristics
    that commonly appear in simulation use cases. Some examples of cases where traditional
    analytics will be challenged include:


    *   If you are confronted with “what if” scenarios involving conditions that have
    never been observed historically, you have an obvious case where analytics base
    on historical data will not help.


    *   Cases where feedback effects influence the outcome


    *   Resource allocation problems with capacity constraints and queueing dynamics


    Here are some examples of problems exhibiting classic simulation indicators: \*
    Persistent boom-bust cycles that seem irrational or unpredictable \* Unanticipated
    fragility in a system despite redundancy in the system \* Sudden drop in performance
    as the systems starts to approach capacty \* Unintended consequences from well-intentioned
    policy changes


    Once you have candidate problem, the next step is to assess how well simulaton
    modeling can address the problem.


    ## Evaluating Simulation Fit


    To determine if simulation modeling will prove useful, we need to consider the
    context in which decisons are made. Good candidates are problems which:


    *   Involve high stakes choices where the wrong answer will incur high costs


    *   The system operates over long time periods and delays and feedback matter


    *   You are dealing with complex systems with multiple interacting stakeholders
    and competing objectives


    *   There is no options to test or experiment in the real world


    If we have a problem that is a good fit for simulation, we’ll want to make sure
    we can actually build and evaluate the model. For this, we’ll need:


    *   A sufficient understanding of causal mechanisms in the system we are modeling


    *   A commitment from stakeholders to engage with the process


    *   Access to domain experts who can help with parameter estimation and validation


    The last step in identifying simulation opportunities in your organization is
    building the busines case.


    ## Building the Business Case'

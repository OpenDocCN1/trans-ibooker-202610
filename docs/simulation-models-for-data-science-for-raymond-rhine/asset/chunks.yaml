    Next, we will move on to look at the limits of traditional analytics methods,
    which includes dependence on historical patterns and the problem of novel situations,
    understanding correlation but not causation, using static snapshots to describe
    dynamic systems, focusing on central tendency without enough attention to extremes,
    and the risks of not understanding delays and latency in system dynamics. These
    issues motivate us to adopt a systems thinking approach to understanding dynamic
    and complex systems. Systems thinking employs several constructs including stocks
    and flows, feedback loops, delays and accumulations, as well as emergence and
    nonlinearity. Together, systems thinking and simulation modeling provide a powerful
    tool for analyzing problems with significant uncertainty, emergent properties,
    and the need to analyze novel, what-if scenarios. Keeping in mind the aphorism
    that in theory, theory and practice are the same, but in practice they are not,
    we conclude the chapter with a case study. It describes a financial contagion
    that was not anticipated by traditional analytic tools but was elucidated by simulation
    modeling. This demonstrates the need for expanding our data science toolkit to
    include simulation.


    # Understanding Complex Business Systems


    There are numerous tools and techniques for analyzing and understanding data.
    Sometimes, it is pretty obvious which tools should be used for a particular problem.
    For example, if you want to compare two groups of customers, you might start with
    descriptive statistics about each group, such as the average amount spent per
    customer and the number of customers in each group. If you want to predict customer
    churn, you might start with a baseline machine learning model based on logistic
    regression, which is fast to train, works with both categorical and numerical
    features, and outputs probabilities. Many times, we do not have such obvious solutions
    to our problems. Let’s consider three such scenarios a data scientist might encounter
    when working in logistics, healthcare, and retail.


    ## Supply Chain Bullwhip Effect


    Let’s start with a simple question of how a change in one part of a supply chain
    can affect other parts of that supply chain. If a retailer decides to increase
    their average order size, it sounds reasonable to assume that change will lead
    to linear changes in other parts of the supply chain. That is often not what happens.


    A retailer sells 100 units per day with a standard deviation of 20. One week,
    the retailer sells 110 units per day for one week, totaling 770 units for the
    week. That is 70 more units sold than expected. The retailer assumes the daily
    average is increasing and they adjust their order from the distributor to accommodate
    the new increased level plus replenish the inventory that was drawn down during
    the week of higher-than-expected orders.


    If the retailer assumes the new level is 110 units per day, they may increase
    the inventory buffer they have on hand. This compounding of expected increase,
    replenishing stock, and increased inventory buffer might lead to a 30% increase
    in the number of products ordered from the distributor—from 700 units per week
    to 910 units per week.


    When the distributor sees this jump in order size, they may assume the retailer
    will continue with the 30% increase level, triggering the distributor to increase
    their orders from manufacturers. The distributor increases orders from 2,800 units
    per month to 3,780 units per month (a 35% increase). The manufacturers see an
    increase in orders and follow the pattern of increasing their target production.
    Manufacturers have to order raw materials and they tend to have longer lead times
    than retailers or distributors, so they place a large order for materials that
    may be 50% higher than what they would have ordered if the original retailer orders
    had stayed constant—from 11,200 units per quarter to 16,800 units per quarter.


    The amplification is striking: a 10% increase in retail demand cascades into a
    50% increase in raw material orders. The amplification factor is 5× as shown in
    Figure 1-1.


    ![](assets/figure_1-1_bullwhip_cascade.png)


    Now imagine what happens the following week when demand for the retailer’s products
    drops back to 100. The retailer has excess inventory, so it cancels some orders
    while it works down stock on hand. The distributor sees a significant drop in
    orders and cancels outstanding orders to manufacturers. The manufacturer sees
    a precipitous drop in orders and cancels some of its production plans.


    The result of retailers, distributors, and manufacturers all making rational choices
    without full information about the state of the larger business system they operate
    in is highly disruptive. This phenomenon is known as the bullwhip effect in supply
    chains. It is caused by a combination of factors.


    Each actor in this system has limited information. They act only on information
    about their orders, not the demand of the end consumer. When all of the actors
    in the system order weekly instead of continuously, we risk having synchronization
    effects that can amplify swings. Also, each actor reasonably decides to accumulate
    stock instead of risking not being able to meet demand. Manufacturers and others
    with long lead times to fulfill orders require larger inventory positions. These
    multiple factors interact to create an outcome that is difficult to predict unless
    we consider all the factors that influence the outcome.


    Simulation is a tool that can help us better understand situations like the amplification
    phenomenon we see in the bullwhip effect. Simulation is especially helpful when
    we are dealing with:


    *   Dynamic systems, such as groups of actors making different kinds of choices


    *   Nonlinear impacts, such as when small changes in one part of a system trigger
    much larger changes in other parts of the system'

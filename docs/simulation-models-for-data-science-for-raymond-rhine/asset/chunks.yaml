    ## 基础：Python 数值计算库


    ### NumPy 用于数值计算


    `NumPy` 是一个用于科学和数值计算的数值 `Python` 包。它提供高效的实现和对大型多维数组和矩阵的支持，包括广泛的数学函数集合。`NumPy`
    包含核心数据结构 `ndarray`，这是一种高效的数组结构。其关键特性之一是它能够一次性将计算应用于整个数组，而不是遍历单个元素。这被称为向量化操作。


    对于构建仿真的数据科学家来说，使用 `NumPy` 有许多优势。对于构建仿真的数据科学家来说，向量化操作由编译的 C 语言代码执行。这使得仿真和其他计算密集型模型运行速度比使用纯
    `Python` 快几个数量级。`NumPy` 的随机数生成模块支持仿真建模中广泛使用的多种概率分布。


    ### SciPy 用于统计分布和优化


    `SciPy` 是一个 `Python` 包，在 `NumPy` 的基础上增加了支持优化、积分、插值、信号处理、线性代数和统计的模块。`SciPy` 中的
    `stats` 模块提供了与概率分布相关的


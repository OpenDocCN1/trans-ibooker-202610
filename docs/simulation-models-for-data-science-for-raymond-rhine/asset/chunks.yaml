    Capacity boundries are hard limits. No matter how hard we try, a machine that
    produces at most 20 units per minute will not produce 30 units per minute not
    matter what a linear projection says. Too often, we use linear models fit to historical
    data that assume the trend can continue indefinetly. In practice, as we approach
    capacity constraints, we hit dicontinuities that disrupt that the process and
    cause a sudden change in behavior of the system. For example, a shipping company
    can process 15,000 to 25,000 packages per shift. The more packages they ship,
    the longer it takes to ship each package. A linear model from historical data
    finds a 0.2-hour increase per 1,000 additional daily packages. One day during
    peak holiday season, the company processes 32,000 packages in one day. The predicated
    delivery time is 8.6 hours but in fact the actual delviery time was closer to
    15 hours. The problem is that facility could process at most 28,000 packages per
    shift so 4,000 packages were left for the next shift. The data that was used to
    build the linear model did not reflect what happens when capacity is exceeded.


    ## Competition for shared resources


    Shared resources are especially prone to introducing difficutl to model behaviors
    in systems. When multiple processes depend on the same resource, then the output
    of the system is affected by both the total demand for the shared resource as
    well as the timing of arrivals, priority rules, and interactin patterns between
    the various requests for processing. Contention for a shared resource can create
    a ripple effect in a system. A spike in demand in one process can consume the
    capacity of a shared resource and this blocks other independent processes tha
    depend on the same shared resource even. These kinds of contentions for shared
    resources exhibt what is known as path dependennce, that is the sequence of arrivals,
    in addition to the overall workload, affects the system output.


    ## Uncertainty and Risk Propagation


    Much of the effort we put into data analysis and decsion support is focused on
    reducing uncertaintly. The last thing an executive decsion maker wants to hear
    in response to a question about how to proceed is “it depends.” In similar vein,
    decsion makers don’t want to be blindsided by unanticipated risks.


    ### Compound uncertainties


    We can get use to have single point estimates when dealing with historical data.
    We can know for sure that last quarters revenue was $4.2 million dollars. We can’t
    know for sure that next quarters revenue will be $4.6 million. A more accurate
    description of what we can know is “We expect next quarter’s revenue to be between
    $3.9 million and $5.0 million with $4.6 million the most probable.” In addition
    to providing a false sense of certainty, single point estimate can hide important
    information lurking withing the distribution of possible values. For example,
    if being 20% under estimate has more negative impacts than being 20% over estimate,
    then decision makers need to know the probability of each. Single point estimates
    don’t tell us much about the tails of distributions. We might expect $4.6 million
    next quarter, but what is the probability of hitting only $3.6 million? Understanding
    the distribution can provide insight in the range of likely outcomes and not just
    focus on the single, most likely event.


    The actual revenue next quarter will be influenced by multiple factors such as
    the nubmer of customers entering stores, the average order value, and the number
    of retruned items. Each of these factors is best described by a distribution rather
    than a single point estiamte. Monte Carlo simulations are especially helpful for
    understanding how the combinations of multiple uncertainties can affect an outcome
    of interest, such as the total quarterly revenue. (See Chapter 3 for more on Monte
    Carlo methods.)


    ![](assets/figure_2-3_point_estimate_vs_distribution.png)


    ### Fat-tailed Distributions and Rare Events


    When we mention the word “distribution” you might think of a bell-shaped, normal
    curve. The normal distribution is assumed in many statistical tests and with good
    reason. Many distributions we encounnter in real life are normally distributed.
    One of the charactereistics of a normal distribution is that values tend to cluster
    around a central value. Another characteristics is that extreme values tapper
    off quickly. As we get farther away from the value of central tendency, the likelihood
    of an extreme value decrease percipitously. In fact, in normal distirbutions,
    the tails of the distribution decay exponentially. This means that events in these
    extreme ranges are vanishinly rare, think 1 in a billion chance.


    Another class of distributions are refered to as fat-taile distributions. In these
    distributions, extreme events occur far more frequently. This is because fat-tailed
    distributions decay polynomally instead of exponentioally. Many real world phenomenon
    exhibit power law distributions, including wealth distribution, city populations,
    website traffic, and book sales. Billionares exist in increasing numbers, megacities
    natually occur from growth dynamics, a few websites dominate web traffic, and
    best selling books sell far more than most books.


    The practical implication of the difference in tail behavior or normal and power
    law distributions is that extremely rare of virtually impossible events under
    a normal distribuiton is possible and occur with a knowable frequency under a
    power law distribution. The 2008 financial crisis is one example of a power law
    tail event that historical data analysis failed to predict.


    When building simulations, we need to be particularly careful with choosing distributions.
    In power law distributions there are no typical events size around which others
    cluster. This means extreme values can strongly influence averages and mislead
    us about assumptions around central tendency. Standard deviations and variance
    can be infinite in some power law distributions so those statistics are useless
    for decision making. Conventional confidence intervals assume the variance of
    a distribution is finite and there is a central tendency, neither of which are
    true for some power law distributions. Although commonly used statistics are not
    helpful when dealing with power law distributions, simulations with appropriate
    power law distributions can help us better understand fat tail risks.


    ![](assets/figure_2-4_power_law_normal_comparison.png)


    Figure 2.4 shows how the normal distribution forms a symmetric bell curve with
    thin tails that vanish by three standard deviations from the mean. Power law distributions,
    however, peak at small values and then decay slowly following the formula:


    > P(X>x)∼x−α


    The parameter, α (alpha), in a power law distribution determines how heavy the
    tail is. Power law distributions with with lower α values have heavier tails.


    ## Adaptive Behaviors


    Adaptive behaviors in systems can be hard to predict. When we use use statistics
    to understand past behviors and apply those findings to expectations for the future,
    we implicitly assume the factors that drove past outcomes will continue to drive
    future outcomes in similar ways. This is a reasonable assumption in many cases.
    If a distributor has a 1 year history of recieving weekly orders for 1,000 to
    1,100 units of a product from a retailer, then it reasonable to assume that pattern
    will continue for the next week. In cases like this, the actors in the system
    are behaving in a readily predictable way. The retailer and the distributor have
    shared interests and both benefit from predictable, collaborative behavior. This
    is not always the case.


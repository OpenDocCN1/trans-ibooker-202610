    \ Enough\n\nImagine you are a data scientist working for a healthcare company.\
    \ You have been tasked with helping model capacity planning for an emergency room.\
    \ You develop a model that predicts the average patient arrival by hour, day,\
    \ and season. You have carefully researched variation in historical data and accounted\
    \ for things like flu season, adverse weather conditions, and local high-traffic\
    \ events. You also know how important it is to validate your model, so you use\
    \ time series cross-validation and track metrics like mean absolute error (MAE),\
    \ mean absolute percentage error (MAPE), and root mean square error (RMSE). Your\
    \ model works well, with average daily prediction MAPE of 8% and hourly arrival\
    \ prediction MAPE of 15%.\n\nThe validation results are promising, but how do\
    \ they compare to reality? Let’s pick one time period, say Monday evenings 7 p.m.\

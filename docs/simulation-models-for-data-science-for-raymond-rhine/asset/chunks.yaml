- raw: 'Models are complex and details matter. Undisciplined vibe coding without a
    clear appreciation for the need for a structured development approach will lead
    to failure. In this book, we will use a specification driven development approach
    to defining simulation models. With this development practice, we define what
    a model should do rather than specify how to implement it. Model requirements
    are expressed in a combination of natural language for describing system components
    and their relationships and formal specifications which we we use for precise
    specificaitons, such as when specifying a mathematical formula. With well defined
    specifications, LLMs can translate specificaitons into executable simulation code.
    LLMs can be also be used to create unit tests and validation scenarios from model
    specifications. Another advantage of specification-driven development is that
    specifications can serve as documentaion as well.


    ## Production Deployment and Operations Infrastructure


    Deploying simulations to production environments requires infrastructure that
    are reproducibile, scalable, and reliable. This combinations of non-functional
    requirements is not the result of any single component in the simulation tech
    stack, it is a by product of the way we combine and use several elements of the
    simulation tech stack. In particular, we will see throughout this book how we
    use the following to ensure a reliable and scalable production environment.


    *   Docker containers package simulations components, including Python, libraries,
    and configuration files. Containers help guarantee consistent execution across
    development, testing, and production environments.


    *   Cloud providers offer elastic compute resources that scale with variable simulation
    workloads. For example, you can run a Monte Carlo simulation requiring that requies
    10,000 runs can distribute work across a large much less time than if we run the
    same simulation on a single server.


    *   Orchestration tools help us manage complexity at scale. Kubernetes is designed
    to coordinate container deployment, scaling, and recovery of failed deployments.
    Workflow managers like Airflow manage complex simulation pipelines from data ingestion
    and preprocessing through model execution and result aggregation, to reporting.


    *   Observability tools including metrics and log collection provide insights
    into the state of simulation runs.


    Simulation modeling should leverage infrasturcture and tools already in place
    in your production environment. Our goal with simulation modeling is to expand
    the range of analysis we can peform, we are not trying to incrase the complexity
    of your computing infrastructure.


    # Summary


    Traditional analytics excels at describing the past but struggles when systems
    entail feedback, delays, non-linearities, and emergent behaviors. As data scientists,
    we need to expand our toolbox to include simulation modeling when we are dealing
    with these challenging dynamics. An expaned analytics technology stack makes simulation
    accessible through AI-assisted development and cloud deployments while integrating
    with existing workflows. In the next chapter, we will shift focus from the genearl
    simulation landscape to understanding how to analyze business problems with multiple
    uncertainties by using Monte Carlo simulations.


    # About the Author


    **Dan Sullivan** is an author, instructor, and architect specializing in data
    science, machine learning, and cloud computing. He is the author of several books
    about databases, cloud architecture, data engineering, and machine learning. His
    data science, data engineering, machine learning, and cloud architecture courses
    are available on O’Reilly, LinkedIn Learning, and Udemy. Dan has worked in multiple
    industries as well as academic research and holds a Ph.D. in bioinformatics and
    computational biology.'

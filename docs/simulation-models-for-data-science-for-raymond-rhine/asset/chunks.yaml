- raw: "In the pricing example, historical data shows a correlation between your prices\
    \ and your sales volume. But the correlation does not reveal how competitors will\
    \ respond. A causal model would need to represent:\n\n*   How customers perceive\
    \ value and make purchase decisions\n\n*   How competitors monitor market conditions\
    \ and decide whether to respond\n\n*   How market share shifts based on relative\
    \ pricing\n\n*   How these dynamics unfold over time\n\nTraditional regression\
    \ or machine learning models treat these as exogenous variables or ignore them\
    \ entirely. Simulation models can explicitly represent causal mechanisms.\n\n\
    This distinction matters because correlation-based models fail when we intervene\
    \ in the system. A model that predicts sales based on historical correlations\
    \ between price and volume may work for forecasting, but it cannot reliably predict\
    \ the effect of a planned price change when competitors will respond.\n\n## Static\
    \ Snapshots to Describe Dynamic Systems\n\nMany analytical methods take a snapshot\
    \ view of systems. They analyze data at a point in time or aggregate data across\
    \ time periods, losing information about dynamics.\n\nConsider the emergency room\
    \ capacity planning problem. A cross-sectional analysis might calculate average\
    \ daily patient volume and average service time, then recommend staffing levels\
    \ based on those averages. This approach misses:\n\n*   How patient backlogs accumulate\
    \ during busy periods\n\n*   How service times increase when staff are overwhelmed\n\
    \n*   How the queue clears during slower periods\n\n*   How daily or weekly cycles\
    \ create predictable patterns of congestion\n\nDynamic systems have memory. What\
    \ happens at time t depends not only on conditions at time t but also on what\
    \ happened at t-1, t-2, and earlier. Backlogs accumulate, feedback loops operate,\
    \ and systems can exhibit hysteresis where the current state depends on the path\
    \ taken to reach it.\n\nSimulation models are inherently dynamic. They advance\
    \ through time, updating system state at each time step. This allows us to observe\
    \ how systems evolve and how interventions affect trajectories.\n\n## Focusing\
    \ on Central Tendency Without Enough Attention to Extremes\n\nMost statistical\
    \ methods focus on means, medians, and other measures of central tendency. This\
    \ is appropriate for many applications but can be misleading when extremes matter.\n\
    \n![](assets/figure_1-4_distribution_comparison.png)\n\nIn the emergency room\
    \ example, planning for average arrival rates leaves the system understaffed during\
    \ peak periods. Patients experience long waits, staff become overwhelmed, and\
    \ quality of care suffers. Understanding the distribution of arrivals and service\
    \ times is as important as understanding the mean.\n\nRisk management requires\
    \ understanding tail events. In supply chains, the cost of stockouts during demand\
    \ spikes may far exceed the cost of holding extra inventory. In financial systems,\
    \ rare but severe events like market crashes or bank failures can destroy more\
    \ value than years of normal returns create.\n\nTraditional methods often assume\
    \ normal distributions or rely on measures like standard deviation that may not\
    \ fully characterize tail behavior. Fat-tailed distributions, where extreme events\
    \ are more likely than a normal distribution would suggest, are common in business\
    \ contexts but poorly captured by methods that focus on central tendency.\n\n\
    Simulation models can generate full probability distributions of outcomes. By\
    \ running thousands of scenarios with varying inputs, we can understand the range\
    \ of possible outcomes, identify extreme cases, and quantify tail risks.\n\n##\
    \ Not Understanding Delays and Latency in System Dynamics\n\nMany business processes\
    \ involve delays. Orders take time to fulfill. Customers take time to respond\
    \ to price changes. Manufacturing capacity takes time to add. Information takes\
    \ time to propagate through organizations.\n\nDelays create dynamics that are\
    \ difficult to analyze with static methods. In the bullwhip effect example, the\
    \ long lead time for raw materials causes manufacturers to over-order when they\
    \ perceive demand increases. The delay amplifies the cycle because manufacturers\
    \ cannot quickly adjust when demand falls.\n\nDelays can create oscillations,\
    \ where systems repeatedly overshoot and undershoot equilibrium. They can create\
    \ instability, where small perturbations grow over time. They can create phase\
    \ shifts, where systems transition from one regime to another.\n\nSimulation models\
    \ explicitly represent delays. We can model information delays, transportation\
    \ delays, production delays, and decision-making delays. By observing how these\
    \ delays affect system behavior, we can design better policies and identify interventions\
    \ that dampen oscillations or prevent instability.\n\n# Systems Thinking: A Framework\
    \ for Complex Systems\n\nThe limitations of traditional analytics motivate a different\
    \ approach to understanding complex business systems. Systems thinking provides\
    \ a conceptual framework for reasoning about dynamics, feedback, and emergence.\
    \ Simulation provides the computational tools to implement and test systems thinking\
    \ models.\n\nSystems thinking employs several key constructs: stocks and flows,\
    \ feedback loops, delays and accumulations, emergence and nonlinearity, and what-if\
    \ scenarios.\n\n## Stocks and Flows\n\nStocks are accumulations. They represent\
    \ quantities that build up or drain over time. In a supply chain, inventory is\
    \ a stock. In healthcare, the backlog of patients waiting for service is a stock.\
    \ In finance, account balances are stocks.\n\nFlows are rates of change. They\
    \ represent how quickly stocks increase or decrease. Customer orders are a flow\
    \ that increases retailer inventory. Sales are a flow that decreases inventory.\
    \ Patient arrivals increase the backlog, while patient service decreases it.\n\
    \nThe fundamental relationship between stocks and flows is:\n\n> Stock(t) = Stock(t-1)\
    \ + Inflow(t) - Outflow(t) \n\n![](assets/figure_1-5_stock_flow_diagram.png)\n\
    \nThis simple equation captures how systems accumulate or deplete resources over\
    \ time. When inflows exceed outflows, stocks grow. When outflows exceed inflows,\
    \ stocks shrink. When they balance, the system is in equilibrium.\n\nMany business\
    \ problems involve understanding how stocks respond to changes in flows. If a\
    \ manufacturer increases production (inflow) faster than customers buy products\
    \ (outflow), finished goods inventory (stock) accumulates. If an emergency room\
    \ experiences a spike in patient arrivals (inflow) while service capacity (outflow)\
    \ remains constant, the waiting room backlog (stock) grows.\n\nSimulations allows\
    \ us to model stocks and flows explicitly and observe how they evolve under different\
    \ conditions. A spreadsheet model can help us understand the stock-flow equation\
    \ at a single point in time but it can be hard to model how inflows and outflows\
    \ change dynamically based on the state of the system. A simulation model lets\
    \ us define the rules governing flows and then observe how stocks behave over\
    \ weeks, months, or years. This is especially useful when multiple stocks are\
    \ interconnected, such as when raw material inventory, work-in-progress, and finished\
    \ goods all interact through shared flows.\n\n## Feedback Loops\n\nFeedback loops\
    \ occur when the output of a system influences its own input. Positive feedback\
    \ amplifies changes. Negative feedback dampens changes and promotes stability.\n\
    \n![](assets/figure_1-6_positive_and_negative_feedback_loops.png)\n\nThe bullwhip\
    \ effect is an example of positive feedback. When retailers see increased demand,\
    \ they increase orders to distributors. Distributors see increased orders and\
    \ amplify their orders to manufacturers. The system overshoots demand, creating\
    \ excess inventory. When demand falls, the feedback operates in reverse, creating\
    \ stockouts."
  fmt: '

    In the pricing example, historical data shows a correlation between your prices
    and your sales volume. But the correlation does not reveal how competitors will
    respond. A causal model would need to represent:


    * How customers perceive value and make purchase decisions

    * How competitors monitor market conditions and decide whether to respond

    * How market share shifts based on relative pricing

    * How these dynamics unfold over time


    Traditional regression or machine learning models treat these as exogenous variables
    or ignore them entirely. Simulation models can explicitly represent causal mechanisms.


    This distinction matters because correlation-based models fail when we intervene
    in the system. A model that predicts sales based on historical correlations between
    price and volume may work for forecasting, but it cannot reliably predict the
    effect of a planned price change when competitors will respond.


    ## Static Snapshots to Describe Dynamic Systems


    Many analytical methods take a snapshot view of systems. They analyze data at
    a point in time or aggregate data across time periods, losing information about
    dynamics.


    Consider the emergency room capacity planning problem. A cross-sectional analysis
    might calculate average daily patient volume and average service time, then recommend
    staffing levels based on those averages. This approach misses:


    * How patient backlogs accumulate during busy periods

    * How service times increase when staff are overwhelmed

    * How the queue clears during slower periods

    * How daily or weekly cycles create predictable patterns of congestion


    Dynamic systems have memory. What happens at time `t` depends not only on conditions
    at time `t` but also on what happened at `t-1`, `t-2`, and earlier. Backlogs accumulate,
    feedback loops operate, and systems can exhibit hysteresis where the current state
    depends on the path taken to reach it.


    Simulation models are inherently dynamic. They advance through time, updating
    system state at each time step. This allows us to observe how systems evolve and
    how interventions affect trajectories.


    ## Focusing on Central Tendency Without Enough Attention to Extremes


    Most statistical methods focus on means, medians, and other measures of central
    tendency. This is appropriate for many applications but can be misleading when
    extremes matter.


    ![](assets/figure_1-4_distribution_comparison.png)


    In the emergency room example, planning for average arrival rates leaves the system
    understaffed during peak periods. Patients experience long waits, staff become
    overwhelmed, and quality of care suffers. Understanding the distribution of arrivals
    and service times is as important as understanding the mean.


    Risk management requires understanding tail events. In supply chains, the cost
    of stockouts during demand spikes may far exceed the cost of holding extra inventory.
    In financial systems, rare but severe events like market crashes or bank failures
    can destroy more value than years of normal returns create.


    Traditional methods often assume normal distributions or rely on measures like
    standard deviation that may not fully characterize tail behavior. Fat-tailed distributions,
    where extreme events are more likely than a normal distribution would suggest,
    are common in business contexts but poorly captured by methods that focus on central
    tendency.


    Simulation models can generate full probability distributions of outcomes. By
    running thousands of scenarios with varying inputs, we can understand the range
    of possible outcomes, identify extreme cases, and quantify tail risks.


    ## Not Understanding Delays and Latency in System Dynamics


    Many business processes involve delays. Orders take time to fulfill. Customers
    take time to respond to price changes. Manufacturing capacity takes time to add.
    Information takes time to propagate through organizations.


    Delays create dynamics that are difficult to analyze with static methods. In the
    bullwhip effect example, the long lead time for raw materials causes manufacturers
    to over-order when they perceive demand increases. The delay amplifies the cycle
    because manufacturers cannot quickly adjust when demand falls.


    Delays can create oscillations, where systems repeatedly overshoot and undershoot
    equilibrium. They can create instability, where small perturbations grow over
    time. They can create phase shifts, where systems transition from one regime to
    another.


    Simulation models explicitly represent delays. We can model information delays,
    transportation delays, production delays, and decision-making delays. By observing
    how these delays affect system behavior, we can design better policies and identify
    interventions that dampen oscillations or prevent instability.


    # Systems Thinking: A Framework for Complex Systems


    The limitations of traditional analytics motivate a different approach to understanding
    complex business systems. Systems thinking provides a conceptual framework for
    reasoning about dynamics, feedback, and emergence. Simulation provides the computational
    tools to implement and test systems thinking models.


    Systems thinking employs several key constructs: stocks and flows, feedback loops,
    delays and accumulations, emergence and nonlinearity, and what-if scenarios.


    ## Stocks and Flows


    Stocks are accumulations. They represent quantities that build up or drain over
    time. In a supply chain, inventory is a stock. In healthcare, the backlog of patients
    waiting for service is a stock. In finance, account balances are stocks.


    Flows are rates of change. They represent how quickly stocks increase or decrease.
    Customer orders are a flow that increases retailer inventory. Sales are a flow
    that decreases inventory. Patient arrivals increase the backlog, while patient
    service decreases it.


    The fundamental relationship between stocks and flows is:


    > `Stock(t) = Stock(t-1) + Inflow(t) - Outflow(t)`


    ![](assets/figure_1-5_stock_flow_diagram.png)


    This simple equation captures how systems accumulate or deplete resources over
    time. When inflows exceed outflows, stocks grow. When outflows exceed inflows,
    stocks shrink. When they balance, the system is in equilibrium.


    Many business problems involve understanding how stocks respond to changes in
    flows. If a manufacturer increases production (inflow) faster than customers buy
    products (outflow), finished goods inventory (stock) accumulates. If an emergency
    room experiences a spike in patient arrivals (inflow) while service capacity (outflow)
    remains constant, the waiting room backlog (stock) grows.


    Simulations allows us to model stocks and flows explicitly and observe how they
    evolve under different conditions. A spreadsheet model can help us understand
    the stock-flow equation at a single point in time but it can be hard to model
    how inflows and outflows change dynamically based on the state of the system.
    A simulation model lets us define the rules governing flows and then observe how
    stocks behave over weeks, months, or years. This is especially useful when multiple
    stocks are interconnected, such as when raw material inventory, work-in-progress,
    and finished goods all interact through shared flows.


    ## Feedback Loops


    Feedback loops occur when the output of a system influences its own input. Positive
    feedback amplifies changes. Negative feedback dampens changes and promotes stability.


    ![](assets/figure_1-6_positive_and_negative_feedback_loops.png)


    The bullwhip effect is an example of positive feedback. When retailers see increased
    demand, they increase orders to distributors. Distributors see increased orders
    and amplify their orders to manufacturers. The system overshoots demand, creating
    excess inventory. When demand falls, the feedback operates in reverse, creating
    stockouts.


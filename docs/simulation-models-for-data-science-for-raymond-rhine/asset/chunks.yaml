    Simulation is a better approach to understanding the nature of the dealth spiral.
    It allows us to model how customer make decisions about cost vs risk tolerance
    as well as modeling the changing compositon of the pool of insured and how that
    affects costs. Simulations can help us identify thresholds, such as when the death
    spiral becomes irreversible becaue the rate of customer loss is so high. We can
    also use simulations to test different assumptions about price sensitivity and
    introduce new product features, like wellness incentives that can influence the
    cost dynamics for the insurer.


    Another example of a feedback loop occurs with marketing campaigns. Changes in
    the way a retailer uses different marketing channels may show initial success.
    We may measure a 5% increase in sales revenues and rightly assume the new marketing
    strategy is the cause. If we stop at that level of analysis we’ll miss the response
    of our competitors. If, instead of measuring the change in revenue at one point

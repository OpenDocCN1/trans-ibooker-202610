    \ / Number of servers = (10.5 × 0.75) / 2 = 0.39 or 39%\n\n![](assets/figure_1-3_queueing_utilization.png)\n\
    \nAt 39% utilization, average wait times are manageable. But what happens when\
    \ arrivals spike to 14 patients per hour? Utilization jumps to 52.5%, and average\
    \ wait times more than double due to nonlinear queueing effects. At 80% utilization,\
    \ the system approaches gridlock, and wait times can exceed several hours.\n\n\
    Simulations can help us identify the full range of variability so we can address\
    \ different multiple likely scenarios rather than focus on only the average scenario.\n\
    \n## Competitive Market Dynamics\n\nCompetitive dynamics present another challenge\
    \ for traditional analytical methods. Consider a retail pricing problem. Two competing\
    \ stores sell similar products. You have historical data on your own sales at\
    \ different price points and have built a price elasticity model. Your model suggests\
    \ that dropping your price by 10% will increase sales volume by 18%, leading to\
    \ a 6% increase in gross revenue.\n\nYou implement the price reduction and watch\
    \ your competitor. Within a week, they match your price cut. Your sales volume\
    \ increases by only 9% instead of 18%, and gross revenue drops by 2%. Your model\
    \ failed to account for competitive response.\n\nLet’s quantify this with a simple\
    \ example. Suppose both stores currently sell 1,000 units per week at $50 per\
    \ unit, generating $50,000 in weekly revenue. Here’s what happens under different\
    \ scenarios:\n\n*   **Baseline**\n    *   Your Price: $50\n    *   Competitor\
    \ Price: $50\n    *   Your Volume: 1,000\n    *   Competitor Volume: 1,000\n \
    \   *   Your Revenue: $50,000\n    *   Competitor Revenue: $50,000\n*   **You\
    \ cut, they hold**\n    *   Your Price: $45\n    *   Competitor Price: $50\n \
    \   *   Your Volume: 1,800\n    *   Competitor Volume: 600\n    *   Your Revenue:\
    \ $81,000\n    *   Competitor Revenue: $30,000\n*   **You cut, they match**\n\
    \    *   Your Price: $45\n    *   Competitor Price: $45\n    *   Your Volume:\
    \ 1,090\n    *   Competitor Volume: 1,090\n    *   Your Revenue: $49,050\n   \
    \ *   Competitor Revenue: $49,050\n*   **Both increase**\n    *   Your Price:\
    \ $55\n    *   Competitor Price: $55\n    *   Your Volume: 850\n    *   Competitor\
    \ Volume: 850\n    *   Your Revenue: $46,750\n    *   Competitor Revenue: $46,750\n\
    \nThe “You cut, they match” scenario illustrates what happened in reality. The\
    \ competitor’s rational response was to match your price cut to prevent losing\
    \ market share. The result is both companies earn less revenue at the lower price\
    \ point. Simulation modeling can help us identify the effects of responses to\
    \ our actions and provide a more realistic picture of likely outcomes.\n\n# The\
    \ Limits of Traditional Analytics\n\nWhy do traditional data science methods struggle\
    \ with these business problems? The limitations fall into five categories: dependence\
    \ on historical patterns, confusion of correlation with causation, static snapshots\
    \ of dynamic systems, focus on central tendency without attention to extremes,\
    \ and inadequate treatment of delays and latency.\n\n## Dependence on Historical\
    \ Patterns and the Problem of Novel Situations\n\nMachine learning models are\
    \ trained on historical data. They learn patterns from the past and assume those\
    \ patterns will continue into the future. This works well when the future resembles\
    \ the past. It fails when conditions change.\n\nConsider the capacity planning\
    \ example. If we train a model on historical emergency room arrival data, it will\
    \ predict average arrival rates accurately. But what if a new urgent care center\
    \ opens nearby? Or a major employer closes, changing the demographics of the area?\
    \ Or a pandemic changes patterns of healthcare-seeking behavior? Historical patterns\
    \ may no longer apply.\n\nThe bullwhip effect example illustrates another limitation.\
    \ Historical data may show stable demand patterns because the supply chain has\
    \ been in equilibrium. But what happens when demand suddenly spikes? Without historical\
    \ examples of large demand shocks, predictive models cannot anticipate the amplification\
    \ effect.\n\nSimulation models do not depend solely on historical patterns. They\
    \ model the underlying mechanisms that generate outcomes. By representing components\
    \ and interaction rules, simulation can explore scenarios that have never occurred\
    \ historically.\n\n## Understanding Correlation but Not Causation\n\nMost predictive\
    \ models identify correlations in data. These correlations can be highly predictive\
    \ but may not reflect causal relationships. Without understanding causation, we\
    \ cannot reliably predict the effects of interventions.\n"

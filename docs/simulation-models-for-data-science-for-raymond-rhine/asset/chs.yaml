  \ || 坚韧却脆弱悖论；最优连通性；因果路径 || N/A - 最适合用于发现新颖见解 |\n\n## Summary\n\n仿真建模通过能够分析表现出涌现行为、反馈回路和相变的复杂业务系统，从而补充了传统的数据科学技术。毫无疑问，统计方法对于描述性分析至关重要，而机器学习在识别历史数据中的模式方面表现出色。仿真为数据科学工具箱增加了其他重要能力。它允许数据专业人员探索从未发生过的、面向未来的、假设性场景。\n\
  \n传统分析方法并不总是足以理解复杂系统，因为它们依赖于历史模式，识别相关性而非因果关系，并提供动态系统的静态快照。它们还存在风险，即关注中心趋势而非极端情况，并且可能无法考虑动态过程中的延迟和滞后。供应链中的鞭子效应、医疗保健中的产能规划挑战以及竞争性定价动态都表明，小变化会级联成不成比例的系统范围效应，而传统方法无法轻易预测。\n\

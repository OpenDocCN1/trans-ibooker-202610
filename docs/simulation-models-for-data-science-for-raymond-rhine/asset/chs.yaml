  \ | 神经网络、随机森林、支持向量机、基于历史模式训练的深度学习模型 | 基于代理的模型、网络模拟、蒙特卡洛方法，重现系统动态并测试情景 |\n| **数据需求**\
  \ | 历史失败数据；银行间风险敞口；金融时间序列；监管报告 | 大型训练数据集；失败的标记示例；多个危机事件；特征工程数据 | 网络结构；资产负债表数据；行为规则/假设；参数估计\

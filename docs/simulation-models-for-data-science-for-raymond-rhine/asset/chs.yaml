  \ 测试“what-if”情景；探索新颖情况；揭示因果机制；无需历史数据；建模涌现；可进行实验 |\n| **主要局限** | 假设未来与过去相似；罕见事件未得到充分代表；线性关系；遗漏涌现行为；无法测试新情景；相关性而无因果见解\
  \ | “黑箱”决策；需要海量数据；过拟合风险；罕见事件表现不佳；外推能力差；无法解释“为什么” | 模型不确定性；参数估计；计算成本；验证挑战；需要领域专业知识；假设简化\

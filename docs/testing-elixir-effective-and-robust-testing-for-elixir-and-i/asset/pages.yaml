    \ _4_hours_in_seconds = 4 * 60 * 60)\n21\n22      6  DateTime.compare(weather_datetime,\
    \ now) in [:gt, :eq] and\n23      5  DateTime.compare(weather_datetime, four_hours_from_now)\
    \ in [:lt, :eq]\n24     end\n    end\n```\n\nReading this report is straightforward.\
    \ The lines highlighted in green are the ones that’ve been executed during the\

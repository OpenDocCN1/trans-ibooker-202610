- pgno: 151
  md: '# Testing Singleton Resources


    It’s quite common in Elixir and Erlang applications to have *singleton resources*.
    A singleton resource exists in your application as a single and unique unit. For
    example, a process with a globally registered name is a singleton resource, since
    no other process with that same name can exist in the system at the same time.
    That example is a bit oversimplified.


    A more common and realistic example is a process that does something that should
    be done by at most one process at a time—for example, a process that needs exclusive
    access to a file on the file system or a process that periodically notifies users
    via SMS that it’s going to rain soon. See where we’re going with the latter? If
    we have more than one of this kind of process, we’re going to have a bad time
    because each of those processes will try to send text messages, resulting in users
    getting notified more than once. The solution could be to have a list of the notified
    users shared between the processes, for example in an ETS table. However, we’re
    just moving the problem around: the singleton resource is now the ETS table. Ouch.
    So, how do we test these scenarios?


    We truly believe singletons often are one of the nastiest things to test. *Writing*
    singleton resources isn’t usually challenging, since you’ll have one instance
    of the resource running at any given time. However, when you want to *test* these
    instances, you’ll usually want to spin up additional instances of the singleton
    resource in order to test them in isolation. We’re going to cover a few workarounds
    to test singleton resources, but don’t expect strong recommendations on clean
    and established testing patterns. In this landscape, testing might have to be
    thought out on a case-by-case basis, and it seems that the Elixir community hasn’t
    found a widely accepted solution yet.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'In general when testing a singleton resource, we suggest you identify *what
    makes it a singleton resource* in the first place. Is it the registered name?
    Is it the fact that it’s the only thing allowed to work with a particular file?
    Maybe it’s the only connection to an external system? Let’s see how to find this
    out and how to go about testing.


    # Making the Essence of a Singleton Resource Customizable


    In the previous sections, when we added the mode: :manual option to SoggyWaffle.WeatherChecker,
    we broke our core belief that application code shouldn’t be changed just to make
    testing easier. Well, we’ll have to break that belief again. One of the easiest,
    simplest, and most efficient ways to test singleton resources is to make whatever
    makes them singleton resources *customizable*.


    Since we already worked with a singleton resource in the previous sections (SoggyWaffle.WeatherChecker),
    we’ll use that as our case study. In this case, the thing that makes SoggyWaffle.WeatherChecker
    a singleton resource is the fact that it’s the only thing allowed to send SMS
    messages to users (in order to avoid multiple messages to the same user). In code,
    we can translate that idea to this statement: SoggyWaffle.WeatherChecker is the
    only thing allowed to use SoggyWaffle.Twilio.send_sms/2 at any given time.


    The contents of Chapter 2, *Integration and End-to-End Tests*, are going to apply
    well here. Our weather checker GenServer already reads the module to use for the
    Twilio interface from the application environment at compile time.


    As we mentioned when discussing integration testing, and in particular in *Stubbing
    Entire Interfaces*, a useful and flexible technique with dependency doubles is
    to use a no-op fake in most tests that make up'

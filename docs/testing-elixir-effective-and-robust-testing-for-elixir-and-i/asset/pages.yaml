  md: 'We understand how “unclean” this practice can feel. Luckily, during our professional
    careers we haven’t encountered too many cases where we had to resort to such extreme
    measures. In those few cases, though, we found this approach to be the “least
    terrible” solution, and we like it much more than the different-supervision-trees

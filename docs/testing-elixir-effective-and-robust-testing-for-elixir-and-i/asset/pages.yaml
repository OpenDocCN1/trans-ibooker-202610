    Our next step is to run the test and see what happens. At the root level of the
    application, run `mix test` and look for the response. If the test is written
    correctly, it’ll pass and you’ll see a lovely dot representing a passed test.
    If the test doesn’t pass, it’s likely that you have a typo somewhere. The errors
    produced should guide you toward your mistake.


    We mentioned before that we’d be adding more tests. But before we do, let’s dive
    into some terminology so that we’re set up for success throughout the rest of
    the book.


    # Running Tests Without Mix


    ![](img/c08a369b9a1934f7c9c3b485727eca8e_34_0.png)


    While ExUnit works without utilizing Mix, it’s very unlikely that you’ll find
    yourself writing many, if any, tests outside of a Mix application. As a result,
    we’ll focus on using Mix and the test flow that it entails.


    # Anatomy of a Test


    As we begin our journey into the land of unit tests, let’s establish some basic
    vocabulary and test theory. Software tests, no matter how complicated they are,
    are comprised of no more than four stages. They have different names depending
    on who you ask, so in this book we’ll use *setup*, *exercise*, *verify*, and *teardown*.
    Simple tests may only have two of these stages; complex ones might have cycles
    that repeat'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'phases. Sometimes the order isn’t straightforward, but every test can be broken
    down into these four stages. Let’s take a look at each one individually in the
    order that they “normally” occur.


    Depending on the scope of the test, setup can be as simple as preparing data to
    pass in as parameters to the code under test or it can mean staging data in some
    sort of shared state, like a database. This stage is very common; but when testing
    purely functional code, setup is often not needed.


    The exercise phase is always present. This is the call to run the code under test.
    Without it, there’d be nothing to do.


    Your tests make their assertions about the behavior of your code during the verify
    phase. While sometimes inline with the exercise step, the verify stage is always
    present in a test. Without verifying that your code behaves a certain way, well,
    your tests would be pointless.


    If your setup phase involved any impact on shared state, you’ll need to return
    things to how they were beforehand during the teardown phase. If there’s no shared
    state, like for a database, then this stage isn’t necessary. Often tools are used
    to take care of this step automatically, like Ecto’s sandbox, but that doesn’t
    mean this step doesn’t happen. Often when there are “random” test failures, it’s
    because a test did not properly tear down the data that was set up.


    We mentioned that the order of the stages isn’t guaranteed to be setup, exercise,
    verify, and teardown. Sometimes test code has to be written in a different order
    than it is executed in. The most common case for this is when a test double (a
    concept we’ll cover later) is used. If that test double utilizes assertions, the
    code defining it will have to be written before the exercise step, even though
    the actual assertions won’t be executed until after the exercise step.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Earlier, we stated that complex tests may actually repeat some of these stages.
    When you’re working in unit tests, a sign that your test might be doing too much
    is if you see a second (or later) recurrence of a phase. User interface tests,
    though, might need to have repeated stages, mirroring successive steps through
    a user’s experience. We will cover that kind of testing in Chapter 6, Testing
    Phoenix. Within the context of this chapter, and of unit tests, you can think
    of tests having each stage only once.


    Now let’s look into how to structure your tests and what tools ExUnit provides
    to help organize tests, group them, and make your test suite easier to maintain.'

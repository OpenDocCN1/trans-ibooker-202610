- pgno: 74
  md: "# What Is an Integration Test?\n\nTests that cover the integration of different\
    \ components (be they external systems or different parts of an application) are\
    \ often referred to as *integration tests*. In this book, when we use the term\
    \ integration test, we mean a test that covers a piece of code that calls out\
    \ to two or more parts of a system or external systems. Integration tests are\
    \ fundamental to testing a system. Unit tests give you confidence that your functions\
    \ and modules behave correctly; but you’ll need to test that your system functions\
    \ correctly as a whole, and to do that you need to test the glue between the components\
    \ of the system. Let’s start by looking at an example of integration testing.\n\
    \nA common scenario in HTTP-based web applications is having a router that routes\
    \ requests to different functions based on the request URI. Those functions are\
    \ usually contained in modules called *controllers*. A controller function is\
    \ responsible for doing any necessary manipulation on the request data, formulating\
    \ an output, and sending a response back to the client. The code for the router\
    \ and the controller could look something like this:\n\n```\nintegration_tests/pseudocode_controller_and_router.ex\n\
    \ndefmodule MyApp.Router do\n  route(\"POST\", \"/perform_action\", {MyApp.Controller,\
    \ :perform_action})\nend\n\ndefmodule MyApp.Controller do\n  def perform_action(connection,\
    \ params) do\n    parsed_params = parse_params(params)\n    action_result = perform_action(parsed_params)\n\
    \    response = build_response(action_result)\n    send_response(connection, response)\n\
    \  end\nend\n```"
  merge: -1
  img_proc: true
- pgno: 75
  md: "We know how to write unit tests. We can unit-test the single functionalities\
    \ like the manipulation of the input (parse_params/1), the isolated actions performed\
    \ by the controller (perform_action/1), and the building of the response (build_response/1).\
    \ That would give us confidence that the single pieces work correctly, but we’re\
    \ not confident that the pieces work well together: we need to test the integration\
    \ of these pieces. To get in the right frame of mind, think of an airplane. You\
    \ can test that the metal of the outer shell of the plane resists bending, the\
    \ engines turn on correctly, and the shape of the plane is correct for flying.\
    \ But if the plane hadn’t been tested to see if it would actually fly, would you\
    \ hop on it?\n\nThe idea behind integration testing is the same. We want to test\
    \ that our components work together correctly, even if we’re confident that the\
    \ components work by themselves, thanks to unit tests. In our web router and controller\
    \ example, we want an integration test that simulates an HTTP request to the /perform_action\
    \ endpoint with raw parameters and then asserts that the response returned by\
    \ the controller is correct.\n\n```\nintegration_tests/pseudocode_controller_and_router_test.exs\n\
    \ndefmodule IntegrationTest do\n  use ExUnit.Case\n\n  test \"POST /perform_action\"\
    \ do\n    params = %{\"some\" => \"params\"}\n    response = simulate_http_call(\"\
    POST\", \"/perform_action\", params)\n    assert response.status == 200\n    assert\
    \ response.body == \"OK\"\n  end\nend\n```\n\nIntegration tests that deal with\
    \ the integration of components within the same system, like the router and controller\
    \ in this example, are the simplest kind of integration tests. Everything happens\
    \ in a system you have control over, so the behavior is predictable. The difficulties\
    \ start"
  merge: -1
  img_proc: true

    \ndef start_link(max_measurements) do\n  GenServer.start_link(__MODULE__, max_measurements)\n\
    end\n\ndef add_element(pid, element) do\n  GenServer.cast(pid, {:add_element,\
    \ element})\nend\n\ndef average(pid) do\n  GenServer.call(pid, :average)\nend\n\
    ```\n\nWe have a function to start the GenServer, a function to store a new element\
    \ in the GenServer, and a function to get the average of the elements that the\
    \ GenServer is storing at a given time. From the public API, we know that this\
    \ is going to be a GenServer (because of the calls to GenServer functions), but\
    \ we don’t know what the internal state of the"

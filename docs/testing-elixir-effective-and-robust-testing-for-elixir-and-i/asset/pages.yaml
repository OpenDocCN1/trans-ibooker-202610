- pgno: 135
  md: "# Controlling the Life Cycle of OTP Processes in Tests\n\nUntil now, when we\
    \ needed to start a GenServer in our tests, we always called the GenServer’s start_link/1\
    \ function directly. We even went as far as having assertions on the return value\
    \ of this function.\n\n```\nassert {:ok, pid} = RollingAverageServer.start_link(max_measurements:\
    \ n)\n```\n\nThis kind of assertion might be useful to test that the start_link/1\
    \ function behaves properly, but it has a few drawbacks. The most important one\
    \ is that the process that we start is tied to the life cycle of the test process\
    \ but not in a clean way. The processes are just linked. When the test finishes\
    \ executing, the test process will terminate (peacefully); and since our GenServer\
    \ process is linked to it, the GenServer will die too. However, the test process\
    \ doesn’t know that it has to wait for the process we started with start_link/1\
    \ to properly shut down. In other words, the GenServer process we start could\
    \ still be shutting down when the next test starts, potentially leading to some\
    \ nasty bugs and race conditions.\n\nYou can imagine why this situation is problematic:\
    \ if we have two tests that start the same process and register it using the same\
    \ name, for example, there might be name clashes if there’s not enough time between\
    \ the first test finishing and the next one starting up. Let’s see an example\
    \ of this and imagine that our RollingAverage server takes a :name option when\
    \ starting, which registers it with a name:\n\n```\ntesting_otp/rolling_average/server_with_name_start_link_test.exs\n\
    \ntest \"some test\" do\n  assert {:ok, _pid} =\n    RollingAverageServer.start_link(\n\
    \      name: :my_server,\n      max_measurements: 3\n```"
  merge: -1
  img_proc: true
- pgno: 136
  md: "```\n) \n# assertions\nend\n\ntest \"some other test\" do\n  assert {:ok, _pid}\
    \ =\n    RollingAverageServer.start_link(\n      name: :my_server,\n      max_measurements:\
    \ 3\n    )\n\n  # other assertions\n  end\n```\n\nIn both tests, the server is\
    \ started with the same name: :my_server option. When ExUnit finishes running\
    \ one of the tests and starts the other one, there’s no guarantee that the server\
    \ registered under the :my_server name (started in the previous test) has terminated.\
    \ Thus, there’s a chance that the second test fails because another server registered\
    \ with same :my_server name can’t be started.\n\nLucky for us, ExUnit provides\
    \ a useful workaround:\nExUnit.Callbacks.start_supervised/1. This function takes\
    \ a child specification to start your process under an on-the-fly supervisor that\
    \ it sets up for you. Let’s first see it in action:\n\ntesting_otp/rolling_average/thin_genserver_test_with_start_supervised.exs\n\
    \n```\ndefmodule RollingAverageServerTest do\n  use ExUnit.Case\n\n  describe\
    \ \"initialization\" do\n    test \"accepts a measurement count on start\" do\n\
    \      assert {:ok, _pid} =\n        start_supervised(\n          {RollingAverageServer,\
    \ max_measurements: 3}\n        )\n    end\n  end\nend\n```"

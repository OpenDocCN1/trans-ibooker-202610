  md: "```\nstub(SoggyWaffle.WeatherAPIMock, :get_forecast, fn city ->\n  Logger.info(\"\
    Getting forecast for city: #{city}\")\n\n  response = %{\n    \"list\" => [\n\
    \      %{\n        \"dt\" => DateTime.to_unix(DateTime.utc_now()) + _seconds =\
    \ 60,\n        \"weather\" => [%{\"id\" => _thunderstorm = 231}]\n      }\n  \
    \  ]\n  }\n\n  {:ok, response}\nend)\n\nlog =\n  capture_log(fn ->\n    assert\

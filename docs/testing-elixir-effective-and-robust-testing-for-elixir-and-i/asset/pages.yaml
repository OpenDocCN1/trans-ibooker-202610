- pgno: 360
  md: "# Coveralls and the Excoveralls Library\n\nThe built-in test coverage tool\
    \ provides a useful set of functionalities out of the box: percentage summaries\
    \ and line-by-line HTML visual reports. However, many of us might want a more\
    \ “complete” package, with additional functionality, such as hosting for those\
    \ HTML reports, CI-friendly integrations, and insights into test coverage history\
    \ of a given project.\n\nA common service that provides such features is Coveralls.[57]\
    \ This service allows you to “post” test coverage results on their platform and\
    \ then browse projects, see insights, browse file-by-file and line-by-line reports,\
    \ and more. The service is free for open-source projects and has a paid option\
    \ for businesses.\n\nThe Excoveralls library integrates Elixir projects with Coveralls\
    \ and allows reporting of test coverage to Coveralls.[58] To try it out, let’s\
    \ add it as a dependency in our mix.exs file and set it as the test coverage tool\
    \ via the :tool option under :test_coverage:\n\n```\ndefmodule SoggyWaffle.MixProject\
    \ do\n  use Mix.Project\n\n  def project do\n    [\n      app: :soggy_waffle,\n\
    \      version: \"0.1.0\",\n      elixir: \"~> 1.9\",\n      start_permanent:\
    \ Mix.env() == :prod,\n      deps: deps(),\n      test_coverage: [tool: [ExCoveralls]],\n\
    \    ]\n    end\n\n    defp deps do\n    [\n\n```"
  merge: -1
  img_proc: true
- pgno: 361
  md: "```\n{:excoveralls, \"~> 0.13.0\", only: :test}\n  rest of the dependencies\n\
    ]\nend\n\nrest of mix.exs contents\n```\n\nNow, running `mix test --cover` will\
    \ use Excoveralls as its \"coverage tool\" instead of the built-in tool:\n\n```\n\
    mix test --cover\nCompiling 5 files (.ex)\nGenerated soggy_waffle app\n................\n\

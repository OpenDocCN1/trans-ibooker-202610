    message. We use the :timer.send_interval/3 Erlang function on line 19 to send
    the :tick message to the GenServer itself (self()) every time interval milliseconds
    have passed.[24] Then, we handle the :tick message in a handle_info/2 callback
    (on line 25). To handle a tick, the GenServer hits up the weather API; if the
    weather API says it’s going to rain, then the GenServer sends an SMS to the provided
    phone number with a rain alert.



- pgno: 327
  md: 'Let’s make sense of these generated lists. The first one is [], which is a
    sorted list, so our test passes. Same goes for [-1] and [1, 2]. Then, our generator
    spits out [1, 1, 0], which makes our test fail. Why wasn’t that the list shown
    in the test failure?


    The reason is that property-based testing frameworks like stream_data perform
    a process, called shrinking, on the terms that cause a property to fail. Shrinking
    consists of simplifying the generated terms so that they keep causing the test
    to fail but make them simpler to understand. In our example, we can see the shrinking
    process in action in the highlighted lines. [1, 1, 0] is first reduced to [1,
    0] by removing the first element. [1, 0] still fails, so stream_data tries to
    shrink it even more by taking more elements out. It tries [0] and [1], but those
    are sorted lists, so our properties hold and we have to take a step back to [1,
    0]. 0 and 1 are the simplest possible integers from the perspective of stream_data,
    so the framework doesn’t try to simplify their values. This means that the simplest
    list to cause the failure was found.


    It might be hard to see the value of shrinking in such a simple example. However,
    imagine you are generating complex data and feeding them to complex code. In those
    cases, shrinking is fundamental since it can make it much easier to understand
    what aspect of the generated data is causing the failure. However, it’s important
    to understand that the shrinking process is heuristic, which means that it doesn’t
    always find the simplest possible term that causes a failure. Exploring the many
    possibilities of simpler data takes time, so stream_data will go ahead and try
    a few ways of shrinking the generated data. After a while, however (a hundred
    tries by default), it’ll stop and report the simplest term it could come up with.
    This is why this same test might conclude that the simplest list that causes a
    failure would be [0, -1], [2, 1], or similar, and why you might see slightly different
    results when running the test.'
  merge: -1
  img_proc: true
- pgno: 328
  md: "# Shrinking and Generators\n\nRemember how, when talking about data generators,\
    \ we said that even if they’re Elixir streams, you should use StreamData functions\
    \ to manipulate them? Well, the reason for that is shrinking—stream_data generators\
    \ produce terms that carry their own shrinking logic with them. For example, the\
    \ integer/0 generator produces integers that know how to “shrink themselves.”\
    \ When you compose generators through StreamData functions, the composition carries\
    \ over to the shrinking logic as well. This is one of the most valuable reasons\
    \ to use a property-based testing framework in the first place over rolling out\
    \ your own randomness-based tests. Let’s look at a quick example. Let’s take our\
    \ friend bind/2 and use it to generate a tuple with two elements: a list and a\
    \ random element from that list:\n\n```\nbind(list_of(term()), fn list ->\n  tuple({constant(list),\
    \ member_of(list)})\nend)\n```\n\nWe’re using constant/1 to turn a simple term\
    \ into a generator, and we’re using tuple/1 to return a generator of tuples. When\
    \ shrinking, the term generated by the inner tuple generator is shrunk first,\
    \ but then the initial list generated by list_of(term()) is shrunk and used to\
    \ produce a new tuple generator in the anonymous function. This behavior might\
    \ seem complex, but most of the time the user doesn’t need to care that this is\
    \ happening behind the scenes when composing generators. Even so, stream_data\
    \ documents how every generator shrinks and how every composition function affects\
    \ the shrinking."
  merge: -1
  img_proc: true

    \ on delete is complicated and requires restructuring our code solely for testing.\
    \ In this case, the payoff isn’t there. When that’s the case, we typically let\
    \ our applications crash instead of trying to handle every possible failure. Let’s\
    \ write our final test and then review what it does:\n\n```\ndescribe \"delete/1\"\
    \ do\n  test \"success: it deletes the user\" do\n    user = Factory.insert(:user)\n\
    \n    assert {:ok, _deleted_user} = Users.delete(user)\n\n    refute Repo.get(User,\
    \ user.id)\n  end\nend\n```\n\nOur test sets up by inserting a user. It then exercises\
    \ the delete/1 function, asserting that it returns a success tuple. The last line\
    \ is an assertion that the data is no longer in the database. In our case, we\

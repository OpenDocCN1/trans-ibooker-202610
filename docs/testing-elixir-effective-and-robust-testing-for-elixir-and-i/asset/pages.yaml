- pgno: 236
  md: "# Testing Create\n\nWe’re going to start by looking at part of the logic file\
    \ with our queries. The file, called Users, contains the basic CRUD actions, in\
    \ this case called create/1, get/1, update/2, and delete/1. We’ve provided a file\
    \ in the copy of testing_ecto included with the book. You’re welcome to copy that\
    \ over or type it in yourself. The file and the create/1 function look like this:\n\
    \n```\ntesting_ecto/lib/users/users.ex\n\ndefmodule TestingEcto.Users do\n  @moduledoc\
    \ false\n  alias TestingEcto.Repo\n  alias TestingEcto.Schemas.User\n\n  def create(params)\
    \ do\n    params\n    |> User.create_changeset()\n    |> Repo.insert()\n  end\n\
    end\n```\n\nIt’s pretty basic, as most CRUD queries are. As a result, testing\
    \ it won’t be very complicated, either. First we’ll write a success path test.\
    \ Open up a new file at testing_ecto/test/users/users_test.ex. In it, we’ll set\
    \ up a basic test file structure and then add a describe block for create/1 and\
    \ our first test:\n\n```\ntesting_ecto/test/users/users_test.exs\n\n1: defmodule\
    \ TestingEcto.UsersTest do\n-   use TestingEcto.DataCase\n-   alias TestingEcto.Users\n\
    -   alias TestingEcto.Schemas.User\n5:\n-   setup do\n-     Ecto.Adapters.SQL.Sandbox.checkout(TestingEcto.Repo)\n\
    -   end\n```"
  merge: -1
  img_proc: true

    Be careful, though, because helper functions like this can become a maintenance
    nightmare. When writing helper functions for your tests, try to keep them defined
    in the same file as the tests using them, and try to keep them simple in functionality,
    with clear, explanatory names. If you design the helper function’s signature to
    enhance the readability of your tests, all the better. In the case of our datetime_struct/1,
    the signature takes a keyword list, letting the call itself highlight what’s important
    about the return value.


    The keys aren’t necessary since plain values would have sufficed, but they make
    it fairly easy to understand the difference in the return values at lines 7 and
    8 of the test body from the SoggyWaffle.WeatherTest code sample. All the other
    values will be the same. By contrast, weather_struct/2 only takes plain values;
    but intentional parameter naming, both of the variable name and that atom, still
    keep the call easy to understand.


    For unit testing, injecting dependencies through the API will help keep your code
    clean and your tests easy and controlled. As you move on to dealing with integration
    testing, you’ll need to explore other methods of dependency injection since you
    won’t necessarily have the ability to pass a dependency in from your tests like
    you would with a unit test. Both of these ways of injecting dependencies are simple
    and easy to understand. Ultimately, that’s the best argument for using them.'

- pgno: 310
  md: '# Data Generation


    One of the design goals of stream_data is to provide a set of tools for data generation
    that could also work outside of property-based testing. For example, generating
    random data can be useful when seeding databases with fake data.


    At the core of data generation are generators. A generator is a data structure
    that contains logic that stream_data uses to generate data. Essentially, a generator
    is like a function that we can call to generate random terms. Let’s start with
    a simple instance of a generator, StreamData.integer/0. This generator produces
    random integers. We can use all the stream_data generators as Elixir streams since
    they implement the Enumerable protocol.


    ```

    iex> StreamData.integer() |> Enum.take(5)

    [-1, 2, -3, 0, 2]

    ```


    stream_data generators are infinite streams of random data, so we only had to
    take a few items out of the stream using Enum.take/2 in this example. If we had
    called Enum.to_list/1 passing the generator as the argument, we would’ve waited
    forever.


    stream_data comes equipped with a few generators for simple data types, like the
    ones for integers or booleans, plus a bunch of ways to combine generators. For
    example, there’s no built-in generator for non-negative integers (positive integers
    plus zero), but we can easily build one using StreamData.map/2 to map the abs/1
    function over the StreamData.integer/0 generator. This is similar to how Enum.map/2
    maps a function over an enumerable.


    ```

    non_negative_integer = StreamData.map(StreamData.integer(), &abs/1)

    ```


    Wait, why are we using StreamData.map/2 instead of Stream.map/2, given that generators
    are Elixir streams? Stream.map/2 would work in the'

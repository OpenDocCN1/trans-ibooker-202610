    end\n```\n\nIn our simple example, the oracle is just a small pure function, but\
    \ this pattern can be useful even when the oracle is an entire system.\n\n# Smoke\
    \ Testing\n\nSmoke testing refers to the practice of testing that code doesn’t\
    \ behave in unexpected ways rather than testing for the exact behavior of the\
    \ code. The idea is to run tests that only verify that nothing major is severely\
    \ broken. For example, our list-sorting function should always either return a\

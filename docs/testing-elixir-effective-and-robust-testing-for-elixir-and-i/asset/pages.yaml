- pgno: 56
  md: '# Testing Pure Functions


    The simplest code to test is a pure function.[12] A function is “pure” if, every
    single time you call the function with the same parameters, it returns the exact
    same answer and if it has no side effects. If a dependency can change the result,
    the function is not pure. When testing a pure function, the test is able to focus
    on the data going in —the function parameters—and the response. That’s it.


    With pure functions, the only setup we need is to prepare the data for the parameters.
    The exercise step for the test is a function call, passing the input parameters.
    The verify stage is just assertions on the response, and only the response. There
    is no teardown because setup was only creating the parameters, which have no impact
    outside of the test. Let’s take a look at some examples of tests on a pure function.


    The one function that we’ve tested so far, SoggyWaffle.WeatherAPI.ResponseParser.parse_response/1,
    is a pure function. Our tests never had to worry about side effects and they consistently
    get the same response from the code under test, no matter how many times they’re
    run.


    While testing pure functions is simple, most applications can’t be comprised entirely
    of pure functions, so we have to look at two strategies for testing code that
    has state: moving logic into pure functions or designing functions to use one
    of the available methods of dependency injection, allowing us to isolate our code.
    We’ll explore moving our logic first and then start to delve into code isolation.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Refactoring Toward Pure Functions


    When you have a module that’s really hard to test, refactoring as much of the
    logic into pure functions is the easiest way to simplify testing, if you can make
    it work. We’ll deep dive into an example of this in the GenServer section of Chapter
    3, Testing OTP, but let’s make sure we understand the basic ideas before we move
    on. When code has an external dependency, it rarely acts as a straight pass-through
    of the values of that dependency. Most of the time, it will make a call to a dependency
    and then manipulate the response before returning the result of the function call.
    The more manipulation your code does of that data, the better a candidate it is
    for refactoring the logic into a pure function.


    Let’s look at a visual representation of a function that both calls out to a dependency
    and manipulates that data before returning its response.


    ![](img/c08a369b9a1934f7c9c3b485727eca8e_57_0.png)


    The section of our drawing labeled “manipulate data” is code that changes the
    data without any external dependencies. If the code has significantly different
    outcomes, testing this function can be pretty painful, depending on the data returned
    from the dependency. Each test, for each possible way that logic can behave, will
    have to use some kind of mechanism to guarantee that the dependency returns a'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'predictable, known response. We’ll talk about one of the ways to do that in
    the next section, but the alternative is to refactor your code so that specifically
    that portion of logic (“manipulate data”) is pulled out of the function and into
    a new, pure function. That way it becomes a new dependency for our original function,
    as you can see in the following figure.


    ![](img/c08a369b9a1934f7c9c3b485727eca8e_58_0.png)


    This may seem as though it makes things more complicated, but it doesn’t. What
    we’ve done is pulled that code into a place where we can test it easily, having
    multiple tests with either a simple setup or no setup, an exercise phase, and
    a verify phase. When we learn about isolating code, you’ll get a better idea of
    the complexity we’re able to avoid. Once that individual piece of logic is well
    tested, it can now be considered safe to pull into the testing black box for our
    original function. We know that code works and that it’ll behave consistently
    every time it’s given the same input. We no longer need to figure out how to create
    scenarios where the original dependency returns different values, and we can reduce
    the number of tests needed to test the original function.


    Refactoring to pure functions works if you want to pull the logic into a new function
    in your existing module or into a new function in a new module. The only thing
    to remember is that it needs to be a public function and it needs to be well tested.'
  merge: -1
  img_proc: true

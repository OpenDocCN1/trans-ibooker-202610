  md: "```\nwith {:ok, response} <- Task.await(weather_api_task) do\n  weather_data\
    \ =\n    SoggyWaffle.WeatherAPI.ResponseParser.parse_response(response)\n\n  SoggyWaffle.Weather.imminent_rain?(weather_data,\

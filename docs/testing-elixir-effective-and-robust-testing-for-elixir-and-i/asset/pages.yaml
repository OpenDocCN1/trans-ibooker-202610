- pgno: 241
  md: "```\nassert {:error, %Changeset{valid?: false}} =\n    Users.create(missing_params)\n\
    end\n```\n\nThis test can be so simple because we've already tested the error\
    \ cases thoroughly for the schema. Ecto has standardized the way that Repo errors\
    \ and Changeset errors are handled. All our test is doing is making sure that\
    \ if there is an error, the return value is shaped correctly: a tuple with :error\
    \ as the first element and a changeset carrying errors as the second element.\
    \ If any other functions use that same underlying changeset function on the schema,\
    \ they can make the same assumptions, unless the function itself needs to change\
    \ the behavior.\n\nThese two tests set up a pattern that will continue for the\
    \ rest of the functions in this file: one success test and one error test. Let’s\
    \ test our next function and see it play out."

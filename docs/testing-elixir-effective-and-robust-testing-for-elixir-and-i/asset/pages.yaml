    ...> StreamData.scale(generator, fn size ->

    ...>   round(:math.sqrt(size))

    ...> end)

    iex> scaled_generator |> Stream.drop(50) |> Enum.take(3)

    [[""], ["#HdJ", "x>", "3y[/", "D", "FFe?"], ["", "", "+,"]]

    ```



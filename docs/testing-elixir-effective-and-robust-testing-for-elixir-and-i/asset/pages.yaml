  md: "```\n|> Map.drop([:__meta__, :updated_at])\n|> Map.put(:first_name, params[\"\
    first_name\"])\n\nfor {field, expected} <- expected_user_data do\n\n  actual =\
    \ Map.get(user_from_db, field)\n\n  assert actual == expected,\n    \"Values did\
    \ not match for field: #{field}\\n expected: #{inspect(expected)}\n\n    }\\nactual:\
    \ #{inspect(actual)}\"\n  end\n\n  refute user_from_db.updated_at == existing_user.updated_at\n\
    \  assert %DateTime{} = user_from_db.updated_at\n\nend\nend\n```\n\nThe test uses\
    \ the factory to insert a user on line 3. On line 5, the test is creating a parameter\
    \ map to pass in. It’s using the factory to provide the data for consistency,\
    \ but it’s then using Map.take/2 to grab only a single key/value pair. This is\
    \ to keep the test as simple and unlikely to become stale as possible. If the\
    \ test updated every field allowed on the schema, the likelihood of the test becoming\
    \ outdated with any changes to the schema is higher. By choosing a single field,\
    \ and one that’s less likely to change, this test will be easier to keep current.\
    \ Additionally, the testing for update_changeset/2 does cover the logic around\
    \ which fields can be updated, so we don’t need to be robust in this test.\n\n\

- pgno: 300
  md: "# Example-Based Tests\n\nWhen writing tests, we usually write something that\
    \ we could call *example-based* tests. In this section, we’ll have a new look\
    \ at them from the perspective of the inputs that we feed to our code. We’ll define\
    \ terminology to identify example-based tests, which will help us later compare\
    \ them to property-based tests.\n\nLet’s start with an example. Let’s say we want\
    \ to test that the Enum.sort/1 function correctly sorts lists. We could call the\
    \ following an example-based test because it verifies that the code we want to\
    \ test (Enum.sort/1 in this case) works by giving a few examples of how it should\
    \ work:\n\nproperty_based_testing/sorting/test/example_based_sort_test.exs\n\n\
    ```\n```elixir\ndefmodule ExampleBasedSortTest do\n  use ExUnit.Case\n\n  test\
    \ \"Enum.sort/1 sorts lists\" do\n    assert Enum.sort([]) == []\n    assert Enum.sort([1,\
    \ 2, 3]) == [1, 2, 3]\n    assert Enum.sort([2, 1, 3]) == [1, 2, 3]\n  end\nend\n\
    ```\n```\n\nIn this example, we’re verifying that sorting an empty list returns\
    \ an empty list, that sorting an ordered list leaves it unchanged, and that sorting\
    \ an unsorted list returns the sorted version of that list. We chose three examples\
    \ that we thought would cover a representative sample of all the possible inputs\
    \ to Enum.sort/1. This works, but you can see that there are a lot more inputs\
    \ we could test, such as negative numbers, lists with duplicates in them, and\
    \ so on.\n\nSometimes, we try to test more inputs and simplify the test at the\
    \ same time by extracting the inputs and corresponding expected outputs and then\
    \ running the test on those inputs and outputs:"
  merge: -1
  img_proc: true
- pgno: 301
  md: "```\nproperty_based_testing/sorting/test/tabular_sort_test.exs\n\ndefmodule\
    \ TabularSortTest do\n  use ExUnit.Case\n\n  test \"Enum.sort/1 sorts lists\"\
    \ do\n    inputs_and_outputs = [\n      {[], []},\n      {[1, 2, 3], [1, 2, 3]},\n\
    \      {[2, 1, 3], [1, 2, 3]},\n      {[2, 1, 2], [1, 2, 2]},\n      {[0, -1,\
    \ -2], [-2, -1, 0]}\n    ]\n\n    for {input, expected_output} <- inputs_and_outputs\
    \ do\n      assert Enum.sort(input) == expected_output\n    end\n  end\nend\n\
    ```\n\nWhen using this kind of approach, tests look like *assertion tables*. An\
    \ assertion table is a table of inputs and outputs, and the tests assert that\
    \ running the code on the input of each row of the table results in the output\
    \ on that same row. For this reason, an alternative name for example-based tests\
    \ is *tabular tests*.\n\nThis kind of test has many benefits. First of all, tests\
    \ like these are easy to write since we know how our code works, and it’s usually\
    \ straightforward to come up with inputs for the code we’re testing. Another benefit\
    \ of these tests is that, since we’re specifying all inputs, we can choose to\
    \ test corner cases that we suspect might be problematic for our code. In our\
    \ trivial sorting example, we know that the empty list is a corner case because\
    \ it’s a peculiar list, so we can just go ahead and test our code on it every\
    \ time we run the test.\n\nHowever, these tests have some downsides as well. Testing\
    \ the same known inputs on every test run means that it’s hard to discover unknown\
    \ corner cases because, well, they’re unknown. At the same"
  merge: -1
  img_proc: true

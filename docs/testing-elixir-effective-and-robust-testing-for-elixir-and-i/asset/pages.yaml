  md: "# Creating a SchemaCase for Shared Test Code\n\nCase templates are very useful\
    \ when we identify a pattern for test files that would benefit from shared code.\
    \ Our refactors on the basic schema tests created two helper functions, valid_params/1\
    \ and invalid_params/1, that would be good to move into a common place to be reused\
    \ by all our schema tests. We’ll create a case template called SchemaCase and\
    \ move the helper functions there. Create a new file called testing_ecto/test/schema_case.ex\
    \ and add the basic structure for a case template:\n\n```\ntesting_ecto/test/schema_case.ex\n\
    \ndefmodule TestingEcto.SchemaCase do\n  use ExUnit.CaseTemplate\n\n  using do\n\
    \    quote do\n      alias Ecto.Changeset\n      import TestingEcto.SchemaCase\n\
    \    end\n  end\n\nend\n```\n\nFor now, it’s pretty simple. We can alias Ecto.Changeset\
    \ into the case template because all future schema tests will need it. We have\
    \ import TestingEcto.SchemaCase included; so when we add the helper functions,\
    \ anything that “uses” the template will get those functions. Our last step is\
    \ to copy the two functions, valid_params/1 and invalid_params/1, into the file,\
    \ below the “using” block. Just be sure to make both functions public (def instead\
    \ of defp), as import only works with public functions. The case template is now\
    \ ready to go, but we need to make sure it’s compiled in our app when running\
    \ tests. We’ll also make one last refactor pass on our test file, making sure\
    \ it uses the case template and no longer contains the code locally."
  merge: -1
  img_proc: true

    # Exploratory Manual Testing


    As it turns out, we find that in practice there is a way of testing supervision
    trees that strikes a nice balance between increasing your confidence in the resiliency
    of your application without having to write complex, convoluted, and fragile test
    suites. We’re talking about exploratory manual testing. We’re using this terminology
    exclusively to sound fancy, because what we really mean is this: fire up observer,
    go right-click on random processes in your application, kill them without mercy,
    and see what happens.


    As crude as it sounds, this method is pretty efficient and practical. What we
    do is start our application and simulate a situation in which it’s operating under
    normal conditions. We could generate a constant flow of web requests if we’re
    building an application with an HTTP interface, for example. Then, we kill random
    processes in the supervision tree and observe what happens. Of course, the expected
    outcome of a process being killed depends on the process: if we kill the top-level
    supervisor, we’ll surely see our application stop replying to HTTP requests. However,
    what happens if we, say, kill a process handling a single web request? We should
    see one dropped request but nothing else. This isn’t hard to observe. What happens
    if we kill the whole pool of database connections? We’ll probably start to see
    a bunch of requests return some 4xx or 5xx HTTP status codes. In most cases you
    should know what happens when a part of the supervision tree crashes, because
    that exact knowledge should drive how to design the shape of the supervision tree
    in the first place. If you want your database connections to fail in isolation
    while your application keeps serving HTTP requests, for example, then you need
    to isolate the supervision tree of the database connections from the supervision
    tree'

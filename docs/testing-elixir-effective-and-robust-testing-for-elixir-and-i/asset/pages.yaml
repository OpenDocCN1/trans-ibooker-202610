- pgno: 230
  md: '# Creating a Factory to Help with Setup


    In testing, we create factories to give ourselves consistent, repeatable ways
    to provide data for our setup phase. One of the areas where this kind of tooling
    is the most useful is when interacting with the database.


    When we write tests that interact with database tables, we need two sets of data
    that are either valid or invalid with regard to the table’s definition. As our
    applications grow larger, we’ll find that having a single source of setup data
    helps us keep the test suite maintainable. If we update our schema definition,
    that single source is often the only place (aside from the tests for the schema
    file itself) that’ll need to be updated in your test suite.


    It’s totally possible to write a factory for your application entirely from scratch.
    When we were testing our Ecto schemas, we started to do that by creating a helper
    function called valid_params. It took a set of fields and types and returned a
    set of randomized parameters that met the minimum requirements of the schema’s
    definition. That function has some notable limitations, however. It was written
    to be generic and therefore the data it returns isn’t very specific to the exact
    field for which it’s making the data. An example is that since the email field
    was a string, the function returned a single word string, not an email address.
    This isn’t guaranteed to be an issue, but odd data can make the debugging of failed
    tests a little harder. Additionally, when we had a test that required the data
    to be inserted into the database, we had to write the code to do the insertion
    as well.


    We can solve this by creating common code that handles the insert for you. While
    you can write your factory from scratch, we don’t suggest it. If you go that route,
    you’ll keep finding edge cases (like overrides on values or handling nested schemas)
    that require you to continue to update and upgrade your factory. Many people have
    worked to solve these problems, and we can build on their work. While there’s
    no'
  merge: -1

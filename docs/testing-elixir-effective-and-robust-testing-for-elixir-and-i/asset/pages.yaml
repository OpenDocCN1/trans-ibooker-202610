- pgno: 91
  md: "your mix.exs file. Usually, you want to choose compilation paths based on the\
    \ Mix environment so that mocks are only compiled and loaded during testing and\
    \ won’t be included in your production code.\n\n```\ndef project do\n  [\n   \
    \ # other options,\n    elixirc_paths: elixirc_paths(Mix.env())\n  ]\nend\n\n\
    defp elixirc_paths(:test), do: [\"lib\", \"test/support\"]\ndefp elixirc_paths(_env),\
    \ do: [\"lib\"]\n```\n\nMox provides two main functions to create stubs and mocks\
    \ of functions in the behaviour. The first one is called Mox.stub/3. This function\
    \ takes the mock module, the name of the function to be stubbed, and an anonymous\
    \ function of the same arity of the function to be stubbed. This anonymous function\
    \ is what will be executed when the stubbed function is invoked on the mock module.\
    \ Usually, stub/3 is used inside single tests. We can rewrite the test for our\
    \ weather API example so that instead of using SoggyWaffle.FakeWeatherAPI, it\

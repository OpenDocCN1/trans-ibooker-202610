    during the given interval, but we could change this value or turn it into an argument
    to the wait_for_passing function to make it customizable. wait_for_passing/2 isn’t
    the most efficient function since it repeatedly runs the assertion and “wastes”
    a few hundred milliseconds between runs, but it’s a good and effective tool that
    in the real world we’ve ended up using in more than a few places.


    This section has turned out to be more about the code to test than the tests themselves,

    ,\n\n10:\n  %{weather_data: weather_data} do\n  assert {:ok, parsed_response}\
    \ =\n    ResponseParser.parse_response(weather_data)\n\n  for weather_record <-\
    \ parsed_response do\n\n15:\n  assert match?(\n    %Weather{datetime: %DateTime{},\
    \ rain?: _rain},\n    weather_record\n  )\n\n20:\n  assert is_boolean(weather_record.rain?)\n\
    \  end\n  end\n```\n\nLet’s update our test to use a setup block (line 2). In\
    \ the setup code, you’ll see that we’re reading the contents of a JSON file (line\
    \ 3) and then decoding it to an Elixir map (line 6). This leaves us with data\
    \ parsed just like it would have been by other parts of the application before\
    \ being passed to ResponseParser.parse_response/1. We now have real data, so let’s\
    \ use it in the test.\n\nOur test has been modified at line 11 to accept a test\
    \ context. This is how the data gets from the setup block into the test. Note\
    \ that we destructured the map so that we have immediate access to the variable,\
    \ weather_data. After that, we need to remove the old data setup and replace the\
    \ parameter in the exercise call with the new variable (line 12). Run mix test;\
    \ because our test was focused on the shape of the data and not on specific values,\
    \ it should pass.\n\nThere are trade-offs to writing our test this way. As mentioned\
    \ earlier, we benefit from the comfort of knowing that our test data is as realistic\
    \ as it gets. To get there, though, we’ve sacrificed some of the readability"

  md: "# Testing Read\n\nThis next test is very simple. First, let’s take a look at\
    \ the code in our Users module. We used “Read” in the section header to keep it\
    \ in line with CRUD, but you’ll notice that we prefer to call our function get/1.\
    \ This is entirely user preference.\n\n```\ntesting_ecto/lib/users/users.ex\n\n\
    def get(user_id) do\n  if user = Repo.get(User, user_id) do\n    {:ok, user}\n\
    \  else\n    {:error, :not_found}\n  end\nend\n```\n\nOur function isn’t a straight\
    \ pass-through to the Ecto code. Instead, if the query returns a result, it wraps\
    \ that result in a success (:ok) tuple, and if the user doesn’t exist, it returns\
    \ an error tuple. Our tests will be pretty straightforward as well. For success,\
    \ we’ll need to insert a user into the database before the exercise step. We’ll\
    \ assert on the shape of the return value and then make sure that the actual data\
    \ matches what was inserted into the database prior. The error test will try to\
    \ “get” a user for a nonexisting ID. Open up your test file, testing_ecto/test/users/users_test.ex,\
    \ and add the following describe block:\n\n```\n1:  describe \"get/1\" do\n  \
    \  -  test \"success: it returns a user when given a valid UUID\" do\n    -  \
    \  existing_user = Factory.insert(:user)\n    - \n5:    assert {:ok, returned_user}\
    \ = Users.get(existing_user.id)\n    - \n    -  assert returned_user == existing_user\n\
    \    -  end\n    - \n    test \"error: it returns an error tuple when a user doesn’t\
    \ exist\" do\n10:\n```"

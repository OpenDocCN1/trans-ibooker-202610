  img_proc: true
- pgno: 69
  md: "*Notice the one-second difference between “now” and the weather data. This\
    \ is a practice called boundary testing.* Our code is looking for values in the\
    \ future, and we have made the future as close to the boundary as we can so that\
    \ we can be certain that any time more recent than that will also pass the test.\
    \ While technically our data could have been one microsecond in the future, the\
    \ data our application will get from the weather API is granular only down to\
    \ the second, so we’ll stick with a unit of time that most people are more familiar\
    \ with, the second. Whenever you’re writing tests for code that does comparisons,\
    \ you should strive to test right at the boundaries. This is even more important\
    \ if you’re dealing with any time zone–based logic, as testing too far from a\
    \ boundary can hide bad time-zone logic.\n\nIn our test, there are calls to two\
    \ helper functions, datetime_struct/1 and weather_struct/2. They can be explained\
    \ fairly easily: datetime_struct/1 returns a %DateTime{} struct where all the\
    \ values are the same each time except the overrides for hour, minute, and second,\
    \ while weather_struct/2 returns SoggyWaffle.Weather structs as defined in the\
    \ module of the same name in our application. These allow us to easily construct\
    \ test data in a way that improves the readability of the test. Let’s see the\
    \ definitions for these helper functions:\n\n```\nunit_tests/soggy_waffle_examples/test/soggy_waffle/weather_test.exs\n\
    \ndefp weather_struct(datetime, condition) do\n  %Weather{\n    datetime: datetime,\n\
    \    rain?: condition == :rain\n  }\nend\n\ndefp datetime_struct(options) do\n\
    \  %DateTime{\n    calendar: Calendar.ISO,\n    day: 1,\n    hour: Keyword.fetch!(options,\
    \ :hour),\n    microsecond: {0, 0},\n```"

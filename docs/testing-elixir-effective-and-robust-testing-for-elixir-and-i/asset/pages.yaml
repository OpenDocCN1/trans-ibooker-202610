- pgno: 23
  md: '# Chapter 1


    # Unit Tests


    For most engineers, the testing experience starts with the unit test. Unit tests
    are the easiest to write since they have a limited focus and therefore usually
    deal with less complexity than tests that involve large portions of an application,
    such as integration tests. While unit tests are less complicated, the testing
    tools and skills we use for them form the basis for all testing, making unit tests
    the perfect place to start our exploration.


    A lot of engineers coming to Elixir have experience with unit testing in some
    other language with various testing frameworks. Most of that experience transfers
    over pretty well to Elixir, but implementing some of the concepts in Elixir can
    be a little different. For example, stubbing, a technique common in interpreted
    languages is more complex in Elixir, which is compiled. The functional nature
    of Elixir allows us to open up the definition of what constitutes a “unit,” giving
    us new flexibility in our test design.


    The ExUnit tools we use in unit tests are the basis of all of our testing. While
    integration tests may introduce additional tooling, all of our tests will still
    be structured similarly to unit tests and use the same assertions. In this chapter,
    we’re going to learn how to define the scope of our tests, write tests for functional
    code, learn how to'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'structure a test file, and then explore some ways to isolate your code under
    test.


    By the end of the chapter, you’ll have a better idea of how to write unit tests
    in Elixir and will understand how to organize both your application and test code
    in ways that make it easier to maintain and write effective tests. You’ll have
    a better understanding of how your code organization impacts testing, and you’ll
    start to build a sense of how to define the scope of your unit tests. These skills
    will transfer to all the tests you write for your Elixir code.


    The first thing we need to cover is the scope of a unit test. Since the beginning
    of software tests, engineers have been discussing how to define the scope of these
    tests.


    # Why We Didn’t Test-Drive in This Book


    Test-driven development, often called TDD, is a development practice that suggests
    that you write your tests first, have them fail since you haven’t implemented
    your code yet, and then run them continuously as you write your code until those
    tests pass. It’s a common technique that we often like to use. However, we won’t
    practice TDD in this book. Since the focus of our book is testing, we won’t pay
    much attention to the application code, and we’ll only use the application code
    in order to provide context for testing concepts. TDD conflicts with this: if
    we wanted to practice TDD, we’d have to start with writing the tests but then
    write the application code in order to make them pass. Instead, we’ll usually
    show you some application code that we already wrote and then you’ll write the
    tests for that code alongside us.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Defining the Unit in Unit Test


    A unit test is a software test that focuses on a subset of an application, often
    removing the overarching context for how the code is used. It’s common to find
    a unit test focused on a single function and just the logic in that function,
    possibly encapsulating private functions available to it. Sometimes it makes more
    sense to include code from multiple modules, or processes, inside the scope of
    your unit tests, expanding the scope of the “unit.” Keeping a narrow scope can
    be beneficial to finding errors faster, but learning when it makes sense to expand
    the scope can greatly reduce the complexity of your codebase and your tests. If
    the scope of your unit tests, the unit itself, can be expanded slightly to include
    other modules, your tests can sometimes end up being simpler and easier to maintain
    while still providing all the benefits of a traditional, narrowly scoped unit
    test.


    Before we dive into when and how to expand the scope of your unit tests, let’s
    touch on why we test. We need to keep four goals in mind when designing our tests:


    +   - Prove that your code does what it’s supposed to do.

    +   - Prevent breaking changes (regressions).

    +   - Make it easy to find where your code is broken.

    +   - Write the least amount of test code possible.


    It’s likely you’re already on board with the first two goals. However, the last
    two goals are what will guide you in choosing how much of your code should constitute
    the unit in the scope of your tests. Your tests should draw a black box around
    the code in their scope, which we’ll call the code under test or the application
    code. This black box defines the places where your test code interacts with your
    application code. In the case of a unit test, this black box would often'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'treat a single function as the unit. The advantage of keeping the scope narrow
    is that if the code under test has issues, keeping the scope small helps you quickly
    identify where the issue is. The downside to a narrow scope is that often, in
    order to isolate the code under test, you need to write more code in your tests,
    which can make it hard to follow what’s happening. Allowing your test scope (black
    box) to include a well-tested, functional dependency can help you take advantage
    of the narrow scope while avoiding some of the steps of isolating the code that
    uses that dependency.


    Your tests need to interact with the code under test in two ways. The first is
    the more obvious one: your test will call a function (or send a message) with
    parameters and it will get a return value. The second is more complex. Your tests
    might need to intercept the calls out and return responses, stepping in for a
    dependency, if your code depends on other code in your codebase. We call this
    “isolating your code under test.” We will cover isolating code later in this chapter,
    but first we’ll look at when we can get away without strict isolation. The following

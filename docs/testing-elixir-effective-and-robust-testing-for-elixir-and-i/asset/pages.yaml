    \ you want HTML reports as well, you can run `MIX_ENV=test mix coveralls.html`\
    \ instead. Excoveralls also provides other output formats, such as JSON (`MIX_ENV=test\
    \ mix coveralls.json`) and XML (`MIX_ENV=test mix coveralls.xml`), which allow\
    \ developers to integrate the output of test coverage runs in different systems\
    \ and platforms programmatically.\n\nAs far as integrations go, Excoveralls provides\
    \ a few ways to post coverage results to Coveralls. You can post to Coveralls\
    \ from"

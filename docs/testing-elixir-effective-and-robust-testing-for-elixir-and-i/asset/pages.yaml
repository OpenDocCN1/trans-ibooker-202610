    # Avoid Logging Tokens


    ![](img/c08a369b9a1934f7c9c3b485727eca8e_285_0.png)


    This isn’t testing-related, but it’s important to call out if you are using a
    pattern similar to the one we have in our sample code. The JWT authentication

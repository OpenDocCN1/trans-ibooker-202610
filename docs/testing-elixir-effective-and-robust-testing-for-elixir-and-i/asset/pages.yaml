- pgno: 324
  md: "# Shrinking\n\nIn this section, we’ll look at what happens when a property-based\
    \ test fails. As we mentioned at the beginning of the chapter, property-based\
    \ testing frameworks such as stream_data help you in those cases by shrinking\
    \ the input that caused the test to fail and coming up with a simpler input that\
    \ still causes the failure. Shrinking plays a fundamental role in the usefulness\
    \ of property-based testing, and it’s important to understand how it works in\
    \ order to take full advantage of the testing framework.\n\n# What a Property\
    \ Failure Looks Like\n\nWe’ve seen how property-based testing helps us write robust\
    \ tests, in part by covering a larger space of inputs to feed to our code. However,\
    \ we haven’t discussed what happens when the tests find an error in the code.\
    \ To see what happens in that case, let’s come up with a sorting function that\
    \ we know won’t work well. The simplest one that comes to mind is the identity\
    \ function, which is a function that takes one argument and returns that argument\
    \ unchanged. This is a terrible sorting function because, well, it doesn’t do\
    \ anything to the input list. However, this “sort” function still holds at least\
    \ one of the two properties we’ve been testing: the length of the sorted list\
    \ is the same as the length of the input list. That makes sense, since it’s the\
    \ same list. However, the identity function definitely doesn’t hold the property\
    \ of the output list being sorted. Let’s write this up in a property and see what\
    \ happens when it fails:\n\n```\nproperty_based_testing/sorting/test/bad_sort_test.exs\n\
    \n1: defmodule BadSortTest do\n  - use ExUnit.Case\n  - use ExUnitProperties\n\
    \  -\n5: property \"bad_sort/1 sorts lists\" do\n```"
  merge: -1
  img_proc: true
- pgno: 325

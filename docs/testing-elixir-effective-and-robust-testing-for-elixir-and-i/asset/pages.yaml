  md: 'parameter evaluates to false or nil. Be careful, though, as refute doesn’t
    work with a pattern match in the way you’d expect. If a pattern doesn’t match,
    a MatchError is raised. We’ll find a way to handle this, if needed, shortly. Also,
    don’t make the common mistake of—that it’s enumerable. If the result can’t be

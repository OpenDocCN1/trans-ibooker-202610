- pgno: 87
  md: "# Interfacing to External Dependencies with Behaviours\n\nThe interface that\
    \ the SoggyWaffle.WeatherAPI module provides is simple, as it’s made of just one\
    \ function. However, if we expanded the functionalities of the SoggyWaffle.WeatherAPI\
    \ module, it would be hard to keep SoggyWaffle.FakeWeatherAPI up to datedate to\
    \ mirror SoggyWaffle.WeatherAPI. This situation is a great use case for behaviours,\
    \ Elixir modules that define a set of functions (an interface) that other modules\
    \ can agree to implement. We can define a behaviour that specifies how we want\
    \ to interface with the weather API and then implement that behaviour both in\
    \ the real weather API interface as well as the fake one.\n\n```\nintegration_tests/soggy_waffle/weather_api_behaviour.ex\n\
    \ndefmodule SoggyWaffle.WeatherAPI.Behaviour do\n  @callback get_forecast(city\
    \ :: String.t()) ::\n    {:ok, term()} | {:error, term()}\nend\n```\n\nNow we\
    \ can add the @behaviour SoggyWaffle.WeatherAPI.Behaviour line to both our SoggyWaffle.WeatherAPI\
    \ module as well as our SoggyWaffle.FakeWeatherAPI module. Having a behaviour\
    \ for our interface has two benefits. The first is that the behaviour will be\
    \ checked at compile time; so if we add a function to SoggyWaffle.WeatherAPI.Behaviour\
    \ but forget to add it to all the modules that implement that behaviour, then\
    \ we’ll get a compile-time warning. The other benefit is that a behaviour will\
    \ clearly define the boundaries of the external system: the behaviour represents\
    \ the interface that we use to work with the external system.\n\nBehaviours are\
    \ a great tool for working with doubles, but there are easier approaches to doubles\
    \ than manually creating “fake” modules."
  merge: -1
  img_proc: true

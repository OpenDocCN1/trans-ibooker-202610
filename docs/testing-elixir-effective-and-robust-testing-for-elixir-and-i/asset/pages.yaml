- pgno: 72
  md: '# Chapter 2


    # Integration and End-to-End Tests


    In the real world, it’s rare that our applications are made only of pure functions.
    More frequently, a production application is made of many moving pieces that interact
    with each other and, perhaps most importantly, with external systems as well.
    We want to be confident that all the pieces work together and that the integrations
    with external systems work correctly. However, testing becomes more complex in
    this scenario. For example, say our application consumes the Twitter API for sending
    status updates as tweets. How do we test this behavior in an automated way without
    publishing any tweets? How do we avoid going over the rate limits imposed by Twitter?
    These kinds of problems require us to rethink how we write reproducible and automated
    tests when the number of moving parts increases.


    In this chapter we’ll learn how to design tests for Elixir systems with separate
    pieces interacting with each other and with external systems. This knowledge,
    alongside what we learned in the previous chapters, will make us able to test
    a system both from the perspective of simple functions and modules as well as
    the interactions between the components of the system.'
  merge: -1
  img_proc: true

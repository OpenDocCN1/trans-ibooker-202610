    \ we want, and we can modify the data inside it however we want. The same isn’t\
    \ true for external services like third-party APIs. For example, if your application\
    \ uses the Twitter API, then we can’t create tweets and hit the API whenever we\
    \ want since we need to abide by the rules imposed by the API. This distinction\
    \ between external dependencies that our application owns (like the database)\
    \ and external dependencies that we don’t own (like a third-party API) is a fundamental\
    \ one. When we have dependencies that we own, it’s usually better to test against\
    \ the running dependency so as to have our test suite be as close as possible\
    \ to the code that runs in production. In these cases, we trade off the speed\
    \ of our test suite for the gained confidence that our code works correctly."

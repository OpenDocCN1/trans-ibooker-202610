  md: '# Built-In Test Coverage


    ExUnit provides a built-in test coverage tool. You can use it right out of the
    gate in a Mix project via the --cover flag passed to mix test.


    Let’s use the code we wrote for Chapter 1, Unit Tests, to try things out. Open
    up the unit_tests/soggy_waffle directory in your terminal and run mix test --cover:


    ```

    > mix test --cover

    Cover compiling modules ...

    ..............


    Finished in 1.8 seconds

    15 tests, 0 failures


    Randomized with seed 384102


    Generating cover results ...


    | Percentage | Module |

    |------------|--------|

    | 0.00%      | SoggyWaffle.SmsApi |

    | 75.00%     | SoggyWaffle |

    | 85.71%     | SoggyWaffle.Weather |

    | 100.00%    | SoggyWaffle.WeatherAPI |

    | 100.00%    | SoggyWaffle.WeatherAPI.ResponseParser |

    |------------|--------|

    | 85.00%     | Total |


    Generated HTML coverage results in "cover" directory

    ```


    As seen in the output above, we get a list of the modules contained in our Mix
    project. Each module is listed alongside a percentage: that’s our code coverage
    ratio right there. A result of 100% means that every single line in a module is
    executed at least once during'
  merge: -1
  img_proc: true

    \ do\n  query = \"losangeles\"\n  app_id = \"MY_APP_ID\"\n\n  use_cassette \"\
    weather_api_successful_request\" do\n    assert {:ok, body} =\n      SoggyWaffle.WeatherAPI.get_forecast(\"\
    Los Angeles\")\n  end\n\n  assert %{\"list\" => [weather | _]} = body\n  assert\
    \ %{\"dt\" => _, \"weather\" => _} = weather\n  # potentially more assertions\
    \ on the weather\nend\n```\n\nThe first time this test is run, the request is\
    \ issued against the real weather API. After the weather API returns a response,\
    \ that response is recorded into a cassette called weather_api_successful_request.\
    \ We use a descriptive and unique name so that it won’t conflict with other cassettes.\
    \ When the same test is run again, no HTTP requests are made and the response\
    \ recorded into the cassette is returned to the HTTP client.\n\nThis approach\
    \ differs from a test server because it focuses less on asserting that the request\
    \ is made correctly. The main goal of a cassette is to behave exactly like the\
    \ real third-party service without having to write code to emulate that third-party\
    \ service. The workflow is, in fact, simpler than the test server: we just wrap\
    \ our code with use_cassette/2 and go on about our day. However, cassettes present\

    We feel that the lack of more widely used or prominent tooling around testing
    supervisors is a good sign that the Erlang and Elixir communities aren’t so keen
    on having robust automated testing of supervision trees either. Maybe one day
    the communities will figure out a good way of having simple and effective testing

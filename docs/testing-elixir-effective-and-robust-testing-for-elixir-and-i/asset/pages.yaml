- pgno: 157
  md: '# Testing Resiliency


    Let’s start this section with a bold statement: we are not fans of testing process
    crashes. We’ll get philosophical. Why does a process crash? Most of the time,
    because of an *unexpected error*. In some cases, the best thing to do might be
    to raise an exception or exit from a process for an error condition that we know
    can happen (an *expected error*). However, we find that tends to be the exception
    rather than the rule, because if the error is expected then you likely want to
    handle it gracefully (think of TCP connections dropping or user input error).
    In cases where you’re raising or exiting on purpose, it might make sense to test
    that behavior.


    Regardless of that, one of the most powerful features of the OTP architecture
    is that if a process bumps into an unexpected error and crashes, there will likely
    be a supervisor bringing it back up. That’s not behavior we want to test; supervisors
    work and have been tested with automated and on-the-field techniques for decades
    now. At the same time, we don’t really want to test that processes *can crash*.
    But if they crash because of an unexpected error, how do we test that if the error
    itself is unexpected? If you can test an unexpected error, we believe that error
    is by definition not unexpected. There’s your philosophy right there.


    So, we don’t want to test that processes are restarted if they crash and we don’t
    want to test that processes can crash because of unexpected errors. So what do
    we test? Well, one interesting thing to test about processes crashing is the *aftermath*
    of a crash: the *crash recovery*, so to speak. Most of OTP is designed in a way
    so as to have most things automatically cleaned up when a process crashes, using
    things like links between processes and ports. For example, if a GenServer starts
    a TCP socket using `:gen_tcp`, that socket will be linked to the GenServer. If
    the GenServer were to crash, the socket would be closed thanks to the existing
    link.'
  merge: -1
  img_proc: true
- pgno: 158
  md: "However, there are some cases where your processes start or open resources\
    \ aren’t automatically stopped or closed when their “parent process” dies. A straightforward\
    \ example could be a GenServer process that creates and opens a file when starting\
    \ and uses it to dump some internal state during its life cycle. It’s likely that\
    \ you would want this file to be deleted and cleaned up if the GenServer were\
    \ to crash unexpectedly. This is something that we believe is worth testing, so\
    \ we’ll explore it a bit later in this section.\n\nWhen it comes to supervision\
    \ trees, we believe the thing that *might* be worth testing is that your supervision\
    \ tree is *laid out correctly*. However, we'll be frank here: that’s hard and\
    \ messy to test. We'll explore some solutions and alternatives toward the end\
    \ of this section, but we want to set the expectations pretty low.\n\n# Testing\
    \ Cleanup After Crashes\n\nIf you want to perform some cleanup after a process\
    \ crashes in order to ensure that the crash doesn’t leave anything behind, your\
    \ best option will often be a different and *very straightforward* process that\
    \ monitors the first process and whose job is to perform only the necessary cleanup\
    \ when the first process crashes. Let’s go back to the example we mentioned at\
    \ the end of the last section: a GenServer that dumps some terms to a file during\
    \ its life cycle to avoid keeping such state in memory:\n\n```\ntesting_otp/cleanup_after_crashes/genserver_that_uses_file.ex\n\
    \ndefmodule GenServerThatUsesFile do\n  use GenServer\n\n  def start_link(opts)\
    \ do\n    GenServer.start_link(__MODULE__, opts, name: __MODULE__)\n  end\n\n\
    \  def store(pid, term) do\n    GenServer.cast(pid, {:store, term})\n  end\n```"
  merge: -1
  img_proc: true

- pgno: 321
  md: "```\nassert member in list\nend\n```\n\nGiven the example here, it might be\
    \ a little easier to understand why StreamData.bind/2, which we learned about\
    \ earlier, is so important.\nGenerating a list and then generating a random element\
    \ out of that list is essentially a call to bind/2.\n\ncheck all also supports\
    \ options passed in after the <- clauses. You can find a comprehensive list of\
    \ options in the documentation for check all, but an important one to know about\
    \ is :max_runs. :max_runs lets you configure the maximum number of times that\
    \ check all should generate all inputs and check that the property holds. By default,\
    \ check all runs one hundred times, but it can be useful to decrease the number\
    \ of runs for slower properties or to increase it to cover more of the input space.\
    \ Here’s an example of how to decrease the maximum number of runs for slower properties:\n\
    \n```\n# This is executed only 10 times.\ncheck all value <- some_generator(),\
    \ max_runs: 10 do\n  slow_code(value)\nend\n```\n\n# The Reason for “Check All”\n\
    \nA common question about stream_data is why check all is written as two words\
    \ instead of one (check_all). The reason is that check all needs to trick the\
    \ Elixir compiler in order to work. Elixir supports macros, which are functions\
    \ executed at compile time that take code as Abstract Syntax Tree (AST, a representation\
    \ of the code as data) and return AST. Elixir doesn’t allow macros with a variable\
    \ number of arguments since the arity of functions and macros must be fixed. The\
    \ AST for <- clauses is the AST for the application of the :<- operator to the\
    \ left side and right side. This means that every <- clause would be an argument\
    \ to a possible check_all macro. However, we want the number of clauses to be\
    \ variable, so that wouldn’t work. The trick we use is that the compiler will\
    \ parse the code and then call the check/2 macro with the AST for the call to\
    \ all(clause1, ...). The all function doesn’t exist, but this isn’t known yet\
    \ at parsing time, so the AST is happily passed to check/2, which can then manipulate\
    \ it as desired. for"

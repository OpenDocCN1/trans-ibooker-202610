- pgno: 114
  md: 'similar problem to the test server, which is that they can get out of sync
    with the actual API. The solution for cassettes is somewhat simpler though, since
    we only have to delete the stale cassette and rerun our tests in order to re-create
    an up-to-date cassette.


    To push the idea of keeping cassettes up to date further, we can always force
    real requests to be made when running tests in a continuous integration (CI) server.
    This way, we’ll avoid making real HTTP requests when developing on our local machine,
    but the CI server (which usually runs much less frequently) will make sure that
    the cassettes haven’t gotten out-of-date. This approach heavily depends on what
    making a request to the real API implies. In the weather API example, making real
    requests to /data/2.5/forecast is feasible: if it’s only done in CI then it’s
    unlikely that we’ll negatively affect our rate limiting. In other cases, making
    requests might cost money or break things, so making real requests on every CI
    run might not be ideal. Furthermore, we usually want CI to be reproducible and
    consistent between runs, and depending on the availability of an external API
    might not be feasible.


    Our favorite use case for cassettes is an external service that allows you to
    set up and tear down resources through its API. For example, the weather API could
    expose endpoints to register and delete named queries. Now, if we wanted to test
    that we can query the forecast through a named query, we could create the named
    query, test the appropriate functions, and delete the named query all in the same
    test. In this use case, the cassette merely becomes a “cache” of HTTP requests.
    Even when not using cassettes (such as in CI), the test would create and destroy
    all necessary resources to run the test, leaving the external service’s state
    unchanged.


    One important practice to keep in mind when working with ExVCR is to never reuse
    cassettes. If you have two tests that make the same request, you might be tempted
    to use the same cassette, but there’s a good chance that at some point the request
    made in one of the two tests will change slightly and then things won’t work anymore.
    If you'
  merge: -1

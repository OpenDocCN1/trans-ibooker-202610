- pgno: 254
  md: '# Testing JSON-Based APIs


    We’re going to start by looking at testing a JSON-based API. This is a very common
    use case for Phoenix and it’s the least complex of the interfaces we’ll test.
    This will allow us to focus on some concepts that will apply across all of the
    interface types we’ll cover, without getting too lost in the specifics of the
    interface itself.


    # What Controller Tests Need to Cover


    We strive to keep our controllers as small as possible, with as little branching
    logic as possible. This accomplishes two goals: it keeps our business logic out
    of the web part of our application, and it keeps the number of test cases needed
    to a minimum. Controller tests are some of our most expensive (in terms of running
    time) since they often require the most setup. Ideally, we have as few of them
    as possible while still leaving our application with solid coverage.


    The logic for most controller actions can be tested with two tests: a happy path
    test and an error case test. There will always be exceptions to this, but it should
    be your starting goal.


    Beyond testing the logic in the actions themselves, you may need to include tests
    to verify that certain plugs are included in your application’s call stack. In
    this section, we’ll test a JSON-based endpoint, with a happy path and an error
    case, and we’ll test for the presence of a plug.


    Before we start writing tests, let’s look at the code we’ll test and how it fits
    into the application.


    # Familiarizing Ourselves with the User Controller


    Our application is a simple game. It’s a pared-down version of a classic game
    called Skull and Roses. In our version, players simply take turns'

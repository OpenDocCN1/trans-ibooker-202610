  md: "valid paths, headers, and bodies. We’d also need to be able to come up with\
    \ properties of responses to those calls. Quite often, this is hard to do. However,\
    \ we know that by design our API can return responses with a status code of 200\
    \ if everything went well, 400 if there was an error with the request, or 404\
    \ if the URL was not found.\n\nWithout knowing anything else about our system,\
    \ we can write a property that generates random HTTP requests (with random paths,\
    \ headers, and bodies), sends them to our API, and then asserts that the API returns\
    \ only one of the expected codes. We’re not interested in whether the response\
    \ returned by the API is the correct response to the request that we sent; we\
    \ only care about the API not blowing up with something unexpected. We’re just\
    \ asserting that nothing is majorly broken. Let’s see what this property could\
    \ look like in pseudocode:\n\n```\nproperty_based_testing/misc/api_smoke_test.exs\n\
    \nproperty \"API only returns a response with status of 200, 400, or 404\" do\n\
    \  host = \"myapi.example.com\"\n\n  check all method <- http_method_generator(),\n\
    \          path <- path_generator(),\n          headers <- headers_generator(),\n\
    \          body <- binary() do\n    response = send_http_request(host, method,\
    \ path, headers, body)\n    assert response.status in [200, 400, 404]\n  end\n\
    end\n```\n\nThis pattern is powerful. It tests a broad range of inputs to our\
    \ system using a small amount of code, with the chance of finding inputs that\
    \ our system blows up on, and it doesn’t require us to come up with good properties.\n\
    \n# Avoiding Reimplementing Your Logic to Test It"

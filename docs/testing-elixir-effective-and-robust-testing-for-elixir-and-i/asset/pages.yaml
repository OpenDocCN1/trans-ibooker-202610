- pgno: 298
  md: '# Property-Based Testing in Practice in the Elixir Standard Library


    A while ago, an issue was opened in the Elixir language repository reporting a
    problem with String.replace/3.[48] String.replace/3 is a function that takes a
    subject string, a pattern string, and a replacement string. The job of the function
    is to replace the pattern string with the replacement string in the subject string.
    The issue reported that the function failed when given an empty string "" as the
    pattern string (the second argument). In other terms, replacing the empty string
    in any string with something else wouldn’t work. It was soon pointed out that
    the behavior of an empty string as the pattern string is tricky to define: on
    one hand, you would think that the empty string is not contained in any string,
    so you should never replace it and the code below should fail or return the subject
    string unchanged:


    ```

    String.replace(any_string, "", "some other string")

    ```


    On the other hand, what if you try to use the empty string as the pattern string
    but also as the subject string? That is, what if you replace the empty string
    in the empty string?


    ```

    String.replace("", "", "x")

    ```


    Intuitively, you should get "x", right? To settle this discussion, the Elixir
    core team ended up coming up with a property of String.replace/3. A property of
    a piece of code is something that “holds” (stays true) regardless of the input
    given to that code. In this case, a property of String.replace/3 could be something
    that’s true regardless of the subject string and the string to replace. Ignore
    the check all syntax here, which we’ll cover later on in the chapter, and just
    focus on the semantics.'
  merge: -1
  img_proc: true
- pgno: 299
  md: "```\ncheck all subject <- string(:printable),\n    replacement <- string(:printable)\
    \ do\n  assert String.replace(subject, subject, replacement) == replacement\n\
    end\n```\n\nThe property states that for any random string as subject string and\
    \ for any random string as replacement string, if you use the same string as the\
    \ subject string and the pattern string, then String.replace/3 should return the\
    \ replacement. As soon as tests were run to check this property, the empty string\
    \ was found to make the property not true. Since the Elixir team was confident\
    \ that String.replace/3 should have had this property, it meant that the implementation\
    \ of String.replace/3 was effectively wrong. String.replace/3 was fixed to handle\
    \ the empty pattern string in a way that would make the property hold.\n\n```\n\
    iex> String.replace(\"ELIXIR\", \"\", \".\")\n\".E.L.I.X.I.R.\"\n```\n\n```\n\
    iex> String.replace(\"ELIXIR\", \"\", \"\")\n\"ELIXIR\"\n```\n\nThis story about\
    \ the replacement string is just an example of a property used in the real world\
    \ to drive the design of a piece of code and verify that it behaves as expected.\
    \ However, it shows the power of thinking about code in terms of properties and\
    \ generating random data to verify those properties when testing. In the rest\
    \ of the chapter, we’re going to learn more about the techniques and tools around\
    \ property-based testing. We’ll start by looking at the tests we’ve written so\
    \ far and how they fit in from the perspective of property-based testing."

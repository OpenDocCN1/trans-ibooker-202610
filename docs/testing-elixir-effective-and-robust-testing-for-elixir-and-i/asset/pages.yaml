  md: 'context of generating data for purposes that lie outside of property-based
    testing, such as seeding a database with random data:


    ```

    non_negative_integer = Stream.map(StreamData.integer(), &abs/1)

    ```


    In general, all functions that operate on streams (such as many functions found
    in the Enum and Stream standard-library modules) work on stream_data generators.
    However, you should only use those functions in the context of data generation
    and not in property-based tests. When using generators in property-based tests,
    using Stream functions instead of StreamData ones will render the generators unusable.
    In the example above, Stream.map/2 would return a plain stream of non-negative
    integers, while StreamData.map/2 would return a stream of non-negative integers
    that also provides specific functionality for property-based testing. We''ll learn
    more about this a little later, when we talk about shrinking the generated data.


    Mapping is just one of the ways to combine generators. There’s also filtering
    as well as a few ways to create more complex data types based off simpler generators.
    An example is StreamData.list_of/1, which takes a generator and returns a new
    generator that produces lists of elements produced by the generator we passed
    to it. For example, to generate lists of integers we can use the StreamData.list_of(StreamData.integer())
    generator.


    ```

    iex> StreamData.list_of(StreamData.integer()) |> Enum.take(3)

    [[1], [], [1, -2]]

    ```



  md: "By default, check all runs the assertions one hundred times, but that's configurable\
    \ in a number of different ways. Sometimes, you'll have generators that take more\
    \ time to generate complex values or you'll need to use many generators for a\
    \ single property. In those cases, it might help to lower the number of check\
    \ all runs.\n\nRunning our SortTest case is the same as running any test case.\
    \ If we were in a Mix project, we would use mix test. The only difference in the\
    \ output is that properties will be reported as properties instead of tests.\n\
    \n```\n> mix test\n..\n\n1 property, 1 test, 0 failures\n```\n\nDon't worry about\
    \ the “1 test” part of the output. That's coming from the dummy test that mix\
    \ new generates when scaffolding the project.\n\nThe check all macro is important\
    \ to understand in order to take advantage of many stream_data features. Let's\
    \ look at it more closely.\n\n# The Check All Macro\n\ncheck all supports multiple\
    \ <- clauses. It also supports simple assignments (with =) as well as expressions\
    \ that are used as filters, similar to what for supports. To show a more complex\
    \ use of check all, let's write an example of a test that first generates a list,\
    \ filters out empty lists, generates an element taken out of that list, and finally\
    \ checks that the in operator always returns true for the two generated terms:\n\
    \n```\nproperty_based_testing/misc/check_all_clauses.exs\n\ncheck all list <-\
    \ list_of(term()),\n    list != [],\n    member <- member_of(list) do\n```"

    \ algorithm down in a ListSort.quicksort/1 function:\n\n```\nproperty_based_testing/sorting/lib/list_sort.ex\n\
    \ndefmodule ListSort do\n  def quicksort([head | rest]) do\n    {smaller_elements,\
    \ larger_elements} =\n      Enum.split_with(rest, &(&1 <= head))\n```"

- pgno: 319
  md: "```\nproperty_based_testing/sorting/test/first_property_sort_test.exs\n\n1:\
    \ defmodule FirstPropertySortTest do\n  -   use ExUnit.Case\n  -   use ExUnitProperties\n\
    \  -\n5:   property \"Enum.sort/1 sorts lists\" do\n  -     check all list <-\
    \ list_of(integer()) do\n  -       sorted_list = Enum.sort(list)\n  -\n  -   \
    \    assert length(list) == length(sorted_list)\n          assert sorted?(sorted_list)\n\
    10:\n  -\n  -     end\n  -   end\n  -\n  -   defp sorted?([first, second | rest]),\n\
    \        do: first <= second and sorted?([second | rest])\n15:\n  -\n  -\n  -\
    \   defp sorted?(_other), do: true\n  - end\n```\n\nThe first thing we need in\
    \ order to use the property-based testing tools that stream_data provides is the\
    \ use ExUnitProperties call on line 3. This will import all the generator functions\
    \ (like list_of/1 or integer/0) as well as make the stream_data DSL available.\
    \ The DSL is made up of the StreamData.check/2 macro that we used on line 6. This\
    \ macro resembles the syntax of for comprehensions, with clauses (<-) that have\
    \ a generator on the right side and a generic pattern on the left side (in our\
    \ case, that pattern is a simple variable). With this syntax, stream_data will\
    \ take care of generating an element out of the generator, matching it on the\
    \ left side of the <- clause, then running the contents of the do/end body. If\
    \ the assertions don’t fail, then stream_data will repeat the process."

  md: 'function is “pure” if it returns the exact same answer and has no side effects
    every single time you call the function with the same parameters. We’ll expand
    on this later in this chapter. When your dependency is purely functional and well
    tested on its own, you can expand your black box to include that dependency, as
    seen in the diagram shown.


    ![](img/c08a369b9a1934f7c9c3b485727eca8e_27_0.png)


    scope of tests


    Expanding the black box allows us to skip the extra work of isolating your code
    while not giving up the ability to easily locate your broken code. Your tests
    are still narrowly focused on the code under test, and—because your code is purely
    functional—the environment in which you’re testing your code is completely controlled,
    preventing inconsistent results. When you’re able to include dependencies in this
    fashion, your tests are easier to write, understand, and maintain. Because your
    dependency is tested on its own, you can write less test code while still being
    able to identify where your code is broken when a test fails. If your dependency’s
    tests don’t fail but you have failures in the tests where you pulled it in, you
    know that your failures are in the new code and not in your dependency.


    The challenge is finding the balance for when you should include your purely functional
    dependencies in your test scope. Tuning this sense will take some trial and error
    and learning from pain points. Start off by expanding your black box to include
    those dependencies and then tighten the scope if you find yourself having issues'

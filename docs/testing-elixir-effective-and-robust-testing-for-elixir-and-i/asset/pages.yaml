    1: domains = ["gmail.com", "yahoo.com", "icloud.com"]

    2: random_domain_generator = StreamData.member_of(domains)

    3: username_generator = StreamData.string(:alphanumeric, min_length: 1)

    4:

    5: random_email_generator =

    6:   StreamData.bind(random_domain_generator, fn domain ->

    7:     StreamData.map(username_generator, fn username ->

    8:       "#{username}@#{domain}"

    9:     end)

    10:   end)

    ```

    ```


    In the first couple of lines, we can see our random domain generator, which uses
    StreamData.member_of/1 to produce elements taken at random from the given list.
    On line 3, we have our username generator, which produces alphanumeric strings.
    Then we have our bind/2 call. We bind on the value produced by the random domain
    generator, which is passed to the function we give to bind/2. That function should
    return a new generator. On line 9, we start with the username generator and map
    a function that concatenates an @ plus the domain to the values that the username
    generator produces. The result of the StreamData.map/2 call is a generator. When
    random_email_generator needs to produce a random email, it will first create a
    random domain, then use the generator returned by the anonymous function passed

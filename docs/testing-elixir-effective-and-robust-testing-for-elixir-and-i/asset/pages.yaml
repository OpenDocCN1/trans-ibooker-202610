    itself. This one extra step is very relevant when dealing with return values that
    aren’t inherently serializable to JSON, for example an Ecto schema struct. This’ll
    help make sure that the code in your Channel takes care of the necessary conversion
    of data before the Phoenix Channel framework tries to serialize the data.


    The two biggest takeaways from this test should be that assert_broadcast takes
    a pattern and that your payloads won’t be serialized. These lessons also apply
    to assert_push/3 and assert_reply/4, which are the two most common test helpers
    that we aren’t covering. It will help to demystify testing Phoenix Channels, as
    well as build a foundation for robust coverage, if you remember that the test
    process itself is subscribed to the Channel and that the Phoenix.ChannelTest.NoopSerializer
    is always used.'

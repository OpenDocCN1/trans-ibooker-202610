- pgno: 37
  md: '# Organizing Your Tests


    As well as making sure our code works, our test suite serves a secondary purpose.
    If written well, it becomes a source of documentation for our code, with text
    descriptions of how we expect the code to work and working examples of how to
    exercise the code. This sounds like a lofty goal, but with a little organization,
    it’s entirely achievable. Imagine a *future you* looking back at code that you
    haven’t seen in months and trying to remember how it works and how to use it.
    The more organized your test suite is, the more *future you* will love *past you*
    for reducing the complexity of this challenge. That alone can serve as motivation
    to think about the overall design of your tests. Fortunately, ExUnit ships with
    some useful functions (and macros) that allow us to organize an individual file
    in a way that’s readable and maintainable.


    As we build more and more complicated tests, you’ll see these organizational tools
    showing up in our examples. Let’s start by looking at those tools and code examples
    and how you can use them to keep your test suite easier to read and maintain.


    # Describing Your Tests


    While it’s possible to have a readable test file with a flat organizational structure,
    ExUnit gives us a good tool for grouping tests together within a file, describe.
    This tool allows us to pass a description for the grouping and, as we’ll discover
    shortly, to group tests that share a common setup. It’s important to note that,
    unlike some other testing frameworks, the creators of ExUnit made the decision
    to only allow one level of grouping, so you can’t nest describe blocks. While
    this may seem counterintuitive at first, it strikes a healthy balance between
    organizing your tests and avoiding a nesting nightmare for setup.'
  merge: -1
  img_proc: true
- pgno: 38
  md: "As a general guideline, grouping your tests by function is a good place to\
    \ start, as laid out in the following example:\n\n```\nunit_tests/misc/describe.exs\n\
    \ndefmodule YourApp.YourModuleTest do\n  use ExUnit.Case\n\n  describe \"thing_to_do/1\"\
    \ do\n    test \"it returns :ok, calls the function if the key is correct\"\n\
    \    test \"it does not call the function if the key is wrong\"\n  end\nend\n\
    ```\n\nYou might have noticed that the description includes a /1 to denote arity\
    \ (the number of parameters the function takes). This is a style choice. You may\
    \ group your tests however you feel is most logical. Later in this book, when\
    \ we tackle integration tests, you may group your tests by something like the\
    \ endpoint they’re hitting. The point is to make it easier to read your tests\
    \ so you (and your collaborators) can decide what makes the most sense. One guide\
    \ that can help drive your design is whether or not your functions have a common\
    \ setup.\n\n# Setup Blocks\n\nWhile an individual test can contain its own setup\
    \ code, sometimes you realize you’re writing the same setup over and over. This\
    \ situation is an opportunity to consider a setup block instead. The code in a\
    \ setup block will be executed before each test inside of its scope. Since the\
    \ code has the same name as the stage in the test design, we’ll call the executable\
    \ code a setup block while referring to the stage of testing as setup.\n\nA setup\
    \ block needs to return a value that makes sense for what comes after it. If the\
    \ setup is to set state elsewhere and none of the values are useful in the tests\
    \ following it, the return value can be as simple as :ok. More often, the return\
    \ value from a setup block is passed to the tests it"
  merge: -1
  img_proc: true
- pgno: 39
  md: "precedes. As Elixir and ExUnit have matured, the common practice has become\
    \ to have your setup return a map of values that can be used in the subsequent\
    \ test. When testing purely functional code, this is often the only time you would\
    \ use a setup block, since there’s no shared state to set up. Let’s look at an\
    \ example of a setup block where no state is changed but we’ve decided that we\
    \ don’t want to redefine the same anonymous functions for each test.\n\nunit_tests/misc/callbacks.exs\n\
    \n```\n```elixir\nsetup do\n  function_to_not_call = fn ->\n    flunk(\"this function\
    \ should not have been called\")\n  end\n\n  function_to_call = fn -> send(self(),\
    \ :function_called) end\n\n  %{bad_function: function_to_not_call, good_function:\
    \ function_to_call}\nend\n```\n```\n\nRemember that when you pull logic into a\
    \ setup block, it makes it a little harder to read an individual test. Not every\
    \ value in your setup will be used in every test, but if you’re pulling a value\
    \ into your setup block, it should be used in multiple tests. In the preceding\
    \ example, it’s very unlikely that both the bad function and the good function\
    \ would ever be used in the same tests, since one is used for success cases and\
    \ the other for failure cases, but since each is going to be used by multiple\
    \ tests, they’re both worth pulling into the common setup.\n\nAccepting values\
    \ from a setup in your tests requires a slight modification to your test definition:\n\
    \nunit_tests/misc/callbacks.exs\n\n```\n```elixir\ntest \"does not call the function\
    \ if the key is wrong\",\n  %{bad_function: bad_function} do\n  assert {:error,\
    \ _} =\n    YourModule.thing_to_do(:bad_first_arg, bad_function)\n```\n```"
  merge: -1
  img_proc: true
- pgno: 40
  md: "end\n\nAdding a pattern as a second parameter to your test allows you to pull\
    \ in anything passed from the setup. If you have too many things being passed\
    \ in so that destructuring the map makes your test unreadable, you can always\
    \ just use a variable and pull what you need from it when you need it.\n\n```\n\
    unit_tests/misc/callbacks.exs\n\ntest \"does not call the function if the key\
    \ is wrong\", context do\n  assert {:error, _} =\n    YourModule.thing_to_do(:bad_first_arg,\
    \ context.bad_function)\nend\n```\n\n# Choosing What to Move Into Common Setup\n\
    \n![](img/c08a369b9a1934f7c9c3b485727eca8e_40_0.png)\n\nIt can be easy to overreach\
    \ on what code should be moved into your setup. If you move too much into a common\
    \ block, the purpose of an individual test is hard to understand. You can avoid\
    \ this by choosing names that describe the things that you’re accepting from the\

    \ =~ \"Getting forecast for city: Los Angeles\"\nend\nend\nend\n```\n\nWhen a\
    \ function like get_forecast/1 is stubbed, it can be called any number of times\
    \ on the mock module. Stubs are usually used when you don’t really need logic\
    \ in the stubbed function but you want to return a value. For example, say get_forecast/1\
    \ could return {:error, reason} to signal an error when talking to the weather\
    \ API. In tests that aren’t strictly testing the weather API functionality, we\
    \ might want to stub out get_forecast/1 to just return :ok, effectively not doing\
    \ anything.\n\nIn our case, where we are performing an action in the stubbed function\
    \ so that we can test the results of the action later, a better tool than a stub\
    \ is a mock. A mock works the same way a stub does, but it lets you assert that\
    \ the mocked function is called a specific number of times. In our example, we\
    \ want to assert that rain?/2 calls get_forecast/1 only once. Semantically, mocks\
    \ are also used when you have some general"

- pgno: 334
  md: "A problem that often arises for novice users of property-based testing (and\
    \ possibly testing in general) is the feeling of having to reimplement the logic\
    \ of a piece of code in order to test it. In our examples, we didn’t suffer too\
    \ much from this problem, but we could see it creeping up when we had to implement\
    \ a sorted?/1 function to test if a list was sorted. That function is simpler\
    \ than a function that actually sorts the list. But we can imagine cases where,\
    \ in order to check that our logic is correct, we have to reimplement a lot of\
    \ the original logic in the properties.\n\nSometimes rewriting a working implementation\
    \ can be a useful technique. The trick is to not just rewrite the same implementation\
    \ but to focus on writing an implementation that makes us more confident that\
    \ the logic works at the expense of something else, like performance. If we write\
    \ an inefficient version of our code that we’re confident works correctly, we\
    \ can use that as the oracle for the code we’re trying to test.\n\n# Are Properties\
    \ Enough?\n\nAre properties enough to ensure that your code works and behaves\
    \ correctly? Sometimes, yes. Most times, no. A property verifies invariants of\
    \ your code, that is, properties of your code that stay the same regardless of\
    \ the input. Sometimes, the wrong code can maintain the same invariants that you’re\
    \ testing. Let’s see an example. Imagine we have a property that asserts that\
    \ when we concatenate two strings, then we can use String.contains?/2 to verify\
    \ that the concatenated string contains both the original strings:\n\n```\nproperty_based_testing/misc/property_and_example_test.exs\n\
    \n```elixir\nproperty \"concatenation of a and b contains both\" do\n  check all\
    \ left <- string(),\n    right <- string(),\n    concatenated = left <> right\
    \ do\n  assert String.contains?(concatenate, left)\n```\n```"
  merge: -1
  img_proc: true

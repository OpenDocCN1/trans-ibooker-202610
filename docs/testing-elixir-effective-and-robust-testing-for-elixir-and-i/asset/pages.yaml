  md: "# Testing Update\n\nTesting update is a bit of a combination of the testing\
    \ for the create and read functions. Let’s first look at the function we’re going\
    \ to test:\n\n```\ntesting_ecto/lib/users/users.ex\n\ndef update(%User{} = existing_user,\
    \ update_params) do\n  existing_user\n  |> User.update_changeset(update_params)\n\
    \  |> Repo.update()\nend\n```\n\nYou can see that, like create/1, this function\
    \ is a very lightweight wrapper around calls to the schema’s changeset function\
    \ (update_changeset/2 in this case) and then to Repo.update/1. Testing it will\
    \ be similar, but you’ll need to insert an existing user to be updated by the\
    \ code. Let’s write our success test first:\n\n```\ndescribe \"update/2\" do\n\
    \  test \"success: it updates database and returns the user\" do\n    existing_user\
    \ = Factory.insert(:user)\n\n    params =\n      Factory.string_params_for(:user)\n\
    \      |> Map.take([\"first_name\"])\n\n    assert {:ok, returned_user} = Users.update(existing_user,\
    \ params)\n\n    user_from_db = Repo.get(User, returned_user.id)\n    assert returned_user\
    \ == user_from_db\n\n    expected_user_data =\n      existing_user\n      |> Map.from_struct()\n\
    ```"

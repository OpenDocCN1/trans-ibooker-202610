    The first thing we’ll need is to add Plug and Cowboy to our dependencies, which
    can be done by adding the :plug_cowboy dependency. We’ll only add this dependency
    in the :test environment so that it won’t be shipped with our application (assuming
    our application doesn’t use Plug and Cowboy itself):


    ```

    integration_tests/soggy_waffle_actual_integrations/mix_with_plug_cowboy.exs


    defp deps do

    ```'

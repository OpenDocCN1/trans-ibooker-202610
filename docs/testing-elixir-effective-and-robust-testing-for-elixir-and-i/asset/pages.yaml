    Let’s now look at the assertions inside the code block. The first one is passing
    match?(%Weather{datetime: %DateTime{}, rain?: _rain}, weather_record) to assert.
    match?/2 is the other way of asserting on a pattern match. If you want to use
    refute with pattern matching, this is how you would do it. Even though match?
    doesn’t bind a value like using = would, you’ll still get a compile warning if
    you don’t use an _ before the variable in the pattern. This assertion is focused
    solely on the shape of the data and not on the values provided. Our parser is
    doing more than one thing, and it’s often a best practice to split testing of
    different responsibilities into multiple tests. If you have a failure in your

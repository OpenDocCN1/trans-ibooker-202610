    \ block of code are recorded to and replayed from the specified cassette. Let’s\
    \ rewrite the get_forecast/1 test to use use_cassette/2.\n\n```\nintegration_tests/soggy_waffle_actual_integrations/test/soggy_waffle/weather_api_t\n\

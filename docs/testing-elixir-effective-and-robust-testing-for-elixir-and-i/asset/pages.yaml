    \ setup is still the last line of the block. on_exit will return :ok, which is\
    \ likely not useful for your setup. In this example, the setup has a return of\
    \ the file name, giving the tests access to a file that’s guaranteed to be there.\
    \ As with all anonymous functions in Elixir, the function you pass to on_exit\
    \ is a closure, so you can reference any variables defined before the function\
    \ is defined.\n\non_exit is powerful because even if your test fails spectacularly,\
    \ the anonymous function will still be executed. This helps guarantee the state\
    \ of your test environment, no matter the outcome of an individual test. It isn’t\
    \ as common, but on_exit is available to you in an individual test as well. If\
    \ you want to keep your setup inside of a single test but need the guarantee that\
    \ your teardown will be done, no matter the test outcome, use on_exit.\n\nNow\
    \ that we have more tools for keeping our tests organized, we can jump back to\
    \ writing more tests utilizing these organizational tools.\n\n# Where Are Doctests?\n\
    \nElixir makes documentation a first-class citizen, something few other languages\
    \ do. Anyone writing Elixir code is encouraged to add documentation to their public\
    \ functions. Part of that functionality is doctests. While they have “test” in\
    \ their name, they’re actually a tool to make sure the examples in your documentation\
    \ are up-to-date. We wholeheartedly encourage you to learn more about doctests,\
    \ but we felt like they were out of scope for this book, given that doctests aren’t\
    \ part of your test suite and aren’t focused on the behavior of your code but\
    \ on the accuracy of your documentation. Elixir’s Getting Started guide"

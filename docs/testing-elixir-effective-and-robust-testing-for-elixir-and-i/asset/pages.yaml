- pgno: 366
  md: "example, function definitions aren’t counted toward code coverage and neither\
    \ are lines that contain multiline expressions.\n\nCode coverage reports like\
    \ the HTML ones generated by mix test -- cover are fundamental in order to spot\
    \ and address potential problems. Knowing only the coverage percentage of a module\
    \ is useful to have an idea of which modules might need more attention, but a\
    \ detailed line-by-line report allows us to know exactly what tests we might be\
    \ missing in order to increase the coverage of our code.\n\nA few aspects of the\
    \ coverage can be configured through a handful of options to return from the project/0\
    \ function of a mix.exs file. An option that’s often useful is the :ignore_modules\
    \ option. In our example above, the SoggyWaffle.SmsApi module has 0% coverage\
    \ because it’s the “real” implementation of the HTTP API that reaches out to an\
    \ external system, and we don’t have any integration tests or end-to-end tests\
    \ executing it. Let’s pretend we don’t want to write such tests and that we don’t\
    \ want to count this particular module toward the total coverage. We can include\
    \ it in the list of ignored modules in mix.exs:\n\n```\n```elixir\ndefmodule SoggyWaffle.MixProject\
    \ do\n  use Mix.Project\n\n  def project do\n    [\n      app: :soggy_waffle,\n\
    \      version: \"0.1.0\",\n      elixir: \"~> 1.9\",\n      start_permanent:\
    \ Mix.env() == :prod,\n      deps: deps(),\n      test_coverage: [ignore_modules:\
    \ [SoggyWaffle.SmsApi]]\n    ]\n  end\nend\n```\n```\n\nrest of mix.exs contents"

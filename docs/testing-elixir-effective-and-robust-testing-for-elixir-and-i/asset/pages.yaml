  md: "anything other than a list. If that would be the case, it would mean that something\
    \ is very wrong. The list-sorting example is a bit too simple to understand the\
    \ benefits of smoke testing. But when the system under test is complex, then a\
    \ smoke test can be significantly faster to write and to run, thus providing a\
    \ lot of value. When it’s hard to generate precise data for your code and it’s\
    \ hard to find accurate properties to ensure that code works correctly, property-based\
    \ testing can still help with smoke testing. Let’s take a look at our list-sorting\
    \ example:\n\n```\nproperty_based_testing/sorting/test/list_sort_smoke_test.exs\n\
    \ndefmodule ListSortSmokeTest do\n  use ExUnit.Case\n  use ExUnitProperties\n\n\
    \  property \"quicksort/1 returns a list or fails with FunctionClauseError\" do\n\
    \    check all term <- term() do\n      try do\n        ListSort.quicksort(term)\n\
    \      rescue\n        FunctionClauseError ->\n          :ok\n\n        other\
    \ ->\n          raise \"raised unexpected exception: #{inspect(other)}!\"\n  \
    \    else\n        term ->\n          assert is_list(term)\n      end\n    end\n\
    \  end\nend\n```\n\nAs we mentioned, this example is contrived because we saw\
    \ that it’s easy to come up with properties to test a list-sorting function. However,\
    \ when the system under test gets more complex, this pattern becomes useful. For\
    \ example, let’s imagine we have an HTTP API. To write property-based tests that\
    \ cover the interaction with the API, we would need complex generators capable\
    \ of generating valid API calls with"

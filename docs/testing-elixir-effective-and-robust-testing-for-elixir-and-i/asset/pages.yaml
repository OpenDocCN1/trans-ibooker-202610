    \ Model\n\nMost of the time we tend to write code from scratch, but sometimes\
    \ we need to rewrite an existing piece of functionality. For example, sometimes\
    \ we need to rewrite something in a different language or rewrite some code to\
    \ make it more performant. In these scenarios, we can refer to the existing system\
    \ as the oracle. When we have an oracle and we’re writing a system that has the\
    \ same functionality as the oracle, we can take advantage of property-based testing\
    \ by testing that our system behaves like the oracle.\n\nLet’s have a look at\
    \ a concrete example. Imagine we wanted to write the function for sorting lists\

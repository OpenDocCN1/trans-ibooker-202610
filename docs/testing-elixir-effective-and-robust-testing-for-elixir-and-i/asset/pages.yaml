    chapters to help you architect your tests using things like dependency doubles
    and message passing.


    Let’s move on to the final enemy of easy testing in the OTP landscape: supervisors.


    # Testing Supervision Trees


    Supervisors are one of the strongest selling points of Erlang/Elixir and the OTP
    set of abstractions. They allow you to structure the life cycle of the processes
    inside your application in a resilient way, and they make isolating failures a
    breeze. However, supervisors are one of the toughest things to test that we’ve
    come across. The reason for this is that their main job is to allow your application
    to recover from complex'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'and cascading failures that are hard to trigger on purpose during testing.


    Imagine having a complex and “deep” supervision tree (with several levels between
    the root of the tree and the leaf processes). Now imagine that a child in a corner
    of the tree starts crashing and doesn’t recover just by being restarted on its
    own. OTP works beautifully and propagates the failure to the parent supervisor
    of that child, which starts crashing and restarting all of its children. If that
    doesn’t solve the problem, then the failure is propagated up and up until restarting
    enough of your application fixes the problem (or the whole thing crashes, if it’s
    a really serious problem). Well, how do you test this behavior? Do you even want
    to extensively test it?


    It’s hard to inject a failure during testing that isn’t solved by a simple restart
    but that also doesn’t bring down the whole application. At the same time, we know
    that supervisors work: that is, we know that the failure isolation and “bubble
    up” restarting behavior work. We know that because supervisors have been battle-tested
    for decades at this point. As already discussed, that’s not what we want to test
    because it falls in the antipattern of “testing the abstraction” instead of testing
    your own logic.


    Our advice? In practice, we tend to just not have automated testing for supervision
    trees. We test the individual components of our applications, and sometimes those
    components are made of a set of processes organized in a “subtree” of the main
    application supervision tree. In order to stay true to the black box testing model,
    we often test the component as a whole regardless of whether it’s made of multiple
    processes living inside a supervision tree. If components are unit-tested and
    integration tested, then we happily rely on OTP to make sure that supervisors
    behave in the right way.


    However, we don’t fly completely blind. Most of the time, we spend some time every
    now and then manually firing up our application and'

- pgno: 206
  md: '# Testing an Ecto Schema for Database Interactions


    The most common use case for Ecto schemas is to enable easy interaction with a
    database. While we keep our schemas to a minimum of logic—just the schema definition
    and changeset function or functions—we still need to make some changes in order
    to use our schema with a database. We’ll update the basic schema we wrote (skipping
    the changes we made for using it as a validator) and then update our tests. Once
    we’ve covered the schema aspects, we’ll move on to cover testing queries that
    use the schema.


    # Adding a Database into Our Application


    Before we can make the necessary changes, we need to make sure that we have a
    local running database. Given that every reader will have a different local setup,
    we’re going to leverage Docker to reduce the chance issues due to local environment
    differences. We have to make the assumption that you already have or are able
    to set up Docker on your computer.[31] We’ve provided, with the testing_ecto application
    code, two files that you should copy into your application directory: testing_ecto/docker-compose.yml
    and testing_ecto/Makefile. Keep them at the root level of your local testing_ecto
    application.


    The docker-compose.yml file has the specifications to start and run a Postgres
    container that matches the username and password used in this book. To make things
    easier, we’ve included a Makefile to give you simple commands to get up and running.
    Once the files are in place, open a new shell session in the same directory. This
    will allow us to jump between interacting with the database and the application
    more easily. Run make up to download the image and then create and start a running
    container with Postgres. You should see the image get downloaded (the first time
    you run it) and then confirmation that it’s running. The Make command runs it
    in daemon mode, meaning that it’s'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'running in the background until you explicitly shut it down. Later, when you’re
    ready to shut it down, running make down will take care of it. The only place
    where you might have trouble is if you’re running another copy of Postgres on
    your computer. Our container will bind to port 5432, the default for Postgres.
    If you get errors over port collisions, you’ll need to shut down your other running
    Postgres while working through the book examples.


    # Updating Our Application to Work with the Database


    Now that we have a database, we need to set up our application to connect to it.
    The first thing is that we need to add in two new dependencies,{ :ecto_sql, "~>
    3.4"} and {:postgrex, "~> 0.15.0"}, into the deps section of your mix.exs file.
    Ecto SQL provides your application with the additional code needed to connect
    to a database, and Postgrex provides the adapter that Ecto SQL needs to be able
    to work specifically with a Postgres database. Run mix deps.get at the root directory
    of your testing_ecto application to pull down the new libraries.


    In the testing_ecto codebase, you’ll find that we’ve included a couple of very
    basic configuration files (testing_ecto/config/config.exs and testing_ecto/config/test.exs)
    and a very basic repo file (testing_ecto/lib/repo.ex). These are hard-coded with
    values that will work with the instance of Postgres created by the docker-compose
    file we provided. The only thing that might not be standard boilerplate is that
    we’ve added the option migration_timestamps: [type: :utc_datetime_usec] to our
    database configs. This will make our timestamps default to a UTC time zone, unless
    explicitly overridden, and include microseconds in their definition. We’ll have
    to remember this for later. Copy those into your project.


    We need to make sure that the TestingEcto.Repo application is started with our
    application so that we can interact with the database in later'
  merge: -1
  img_proc: true

- pgno: 101
  md: "To address this issue, we came up with a pattern that takes advantage of Mox.stub_with/2.\
    \ The idea might sound confusing but here it goes: use a double as the default\
    \ module during testing, and stub it with the real module when you need to test\
    \ the actual interaction with the external system. Essentially, you’re using a\
    \ double and stubbing the double with the real module. Crazy pants. Let’s see\
    \ it in action.\n\nWe’ll keep reading from the application environment at compile\
    \ time and storing the weather API module in @weather_api_module. In the dev and\
    \ prod environments, this module will be SoggyWaffle.WeatherAPI, the real module.\
    \ In the test environment, we’ll set the module to SoggyWaffle.WeatherAPIMock.\
    \ However, when we want to test some code through real interactions with the API,\
    \ we’ll call stub_with/2:\n\n```\nintegration_tests/soggy_waffle/test/soggy_waffle_test_stub_with.exs\n\
    \ndescribe \"rain?/2\" do\n  test \"success: using the real API\" do\n    Mox.stub_with(SoggyWaffle.WeatherAPIMock,\
    \ SoggyWaffle.WeatherAPI)\n\n    # rest of the test\n  end\nend\n```\n\nIn this\
    \ test, the weather API mock will “route” function calls to the real SoggyWaffle.WeatherAPI\
    \ module, letting us test that.\n\nThis pattern has zero runtime impact in the\
    \ dev and prod environment, which is where performance matters the most. By using\
    \ this trick you’ll effectively be as close as you can to not changing your production\
    \ code to accommodate for tests while still using dependency injection and being\
    \ able to test in isolation.\n\nNow that we have learned about the different kinds\
    \ of dependency doubles, let’s discuss the benefits that doubles bring to the\
    \ design of your system."
  merge: -1
  img_proc: true
- pgno: 102
  md: '# The Hidden Benefits of Dependency Doubles


    Let’s take a step back. We talked about integration tests from the perspective
    of external dependencies. As we saw in the previous sections, it’s usually a good
    rule of thumb to use external dependencies directly in tests if we own the dependencies
    and go with dependency doubles otherwise.


    Dependency doubles are a great tool for testing, but their benefits extend to
    the design of our applications as well. If we look back at the changes we made
    to be able to use a double for the weather API interface, there were two key points:
    making the interface swappable at the call site (in rain?/2) and defining a behaviour
    for the interface. Both of these things end up making our application less tightly
    coupled and better architected. Now, we have a clear point of separation between
    our system and the external system. The interface with the external system is
    clearly defined by the behaviour, which forces us to reason about how we interface
    with the dependency.


    Finally, making the interface to the external system swappable means that we can
    be flexible and change it to whatever is appropriate for a specific environment.
    For example, we might want to use SoggyWaffle.WeatherAPIMock in tests, SoggyWaffle.FakeWeatherAPI
    when developing the application and trying it out locally, and the real SoggyWaffle.WeatherAPI
    module when in the acceptance, staging, or production environments.'
  merge: -1
  img_proc: true
- pgno: 103
  md: "# Testing the Actual Interaction with Services\n\nWhen working with third-party\
    \ APIs like the weather API, we push the code that integrates with the API to\
    \ the outside of our application in a lightweight wrapper. When we’re testing\
    \ our application, we’re able to swap out that small part with a double to run\
    \ the rest of our application. At some point, though, we also need to make sure\
    \ that the code that talks to the API works. In this section, we’ll learn about\
    \ the different approaches to do that.\n\nIn our weather API application, the\
    \ code that talks to the weather API is this:\n\n```\nintegration_tests/soggy_waffle/weather_api.ex\n\
    \ndefmodule SoggyWaffle.WeatherAPI do\n  @spec get_forecast(String.t()) ::\n \
    \   {:ok, map()} | {:error, reason :: term()}\n  def get_forecast(city) when is_binary(city)\
    \ do\n    app_id = SoggyWaffle.api_key()\n    query_params = URI.encode_query(%{\"\
    q\" => city, \"APPID\" => app_id})\n\n    url =\n      \"https://api.openweathermap.org/data/2.5/forecast?\"\
    \ <> query_params\n\n    case HTTPoison.get(url) do\n      {:ok, %HTTPoison.Response{status_code:\
    \ 200} = response} ->\n        {:ok, Jason.decode!(response.body)}\n\n      {:ok,\
    \ %HTTPoison.Response{status_code: status_code}} ->\n        {:error, {:status,\
    \ status_code}}\n\n      {:error, reason} ->\n        {:error, reason}\n    end\n\
    \  end\nend\n```"

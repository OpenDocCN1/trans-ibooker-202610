- pgno: 303
  md: "# Introducing Randomness and Property-Based Testing\n\nWe can solve some of\
    \ the problems that example-based tests suffer from by introducing a bit of chaos\
    \ in our tests. Using randomness to generate inputs will allow us to test a wider\
    \ range of inputs against our code and potentially create inputs that trigger\
    \ edge cases.\n\nIn our sorting example, what we really want to test is that the\
    \ output of Enum.sort/1 is a sorted version of the input. For any random input,\
    \ we can think of a few properties that the output will always retain. For example,\
    \ the output list always has the same length as the input list. Another property\
    \ is that the output list is always sorted, which is something that we can check\
    \ in a pretty straightforward way by checking that each element is smaller than\
    \ or equal to the following one. Now that we’ve thought of these properties, we\
    \ could change our test so that we generate random lists and test these properties\
    \ on the output of our code instead of checking what the output is. Let’s see\
    \ how to do that:\n\n```\nproperty_based_testing/sorting/test/randomized_sort_test.exs\n\
    \n```elixir\n1: defmodule RandomizedSortTest do\n  use ExUnit.Case\n\n  test \"\
    Enum.sort/1 sorts lists\" do\n5:   for _ <- 1..10 do\n      random_list = random_list()\n\
    \      sorted_list = Enum.sort(random_list)\n\n      assert length(random_list)\
    \ == length(sorted_list)\n      assert sorted?(sorted_list)\n10:\n    end\n  end\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 304
  md: "```\n- defp random_list do\n  Stream.repeatedly(fn -> Enum.random(-100..100)\
    \ end)\n15:\n- |> Enum.take(_length = Enum.random(0..10))\n- end\n- \n- defp sorted?([first,\
    \ second | rest]),\n  do: first <= second and sorted?([second | rest])\n20:\n\
    - \n- defp sorted?(_other), do: true\n- end\n```\n\nThe random_list/0 function\
    \ creates an infinite stream of random numbers between -100 and 100 and then picks\
    \ a random number of elements from the stream using Enum.take/2. The number of\
    \ elements we pick from the stream is the length of the random list, which we\
    \ keep between 0 and 10 elements. The sorted?/1 function checks that the first\
    \ two elements of the list are sorted and then recursively checks the rest of\
    \ the list until it arrives at an empty or one-element list, which is always sorted.\
    \ On line 9, we check our first property, that the sorted list has the same number\
    \ of elements as the input list. On line 10, we check the second property, that\
    \ the sorted list is sorted.\n\nThis approach to testing has a few benefits. One\
    \ of the most obvious is that it can potentially test on a lot more inputs than\
    \ example-based testing can. In our example, if we want to change the number of\
    \ tested lists to a hundred or a thousand, we can just change the right end of\
    \ the range on line 5. However, the usefulness of testing on many inputs is limited\
    \ unless the inputs vary.\n\n# The Role of Randomness\n\nThis is where randomness\
    \ comes into play. By having a lot of inputs generated at random, our hope is\
    \ to cover a decent part of the possible inputs to our code and at the same time\
    \ cover a good variety of inputs."
  merge: -1
  img_proc: true
- pgno: 305
  md: 'Essentially, we want a good sample of inputs that represents the *input space*,
    which is the set of all possible inputs. In our example, we’re still covering
    a tiny part of our input space (all lists of numbers), but covering the whole
    input space is often unfeasible. Random generation gives us a nice compromise,
    especially considering that every time the tests are run, possibly different lists
    are generated. Generating random elements also helps us to uncover potential corner
    cases that we didn’t anticipate.


    You might be asking yourself how much randomness is *enough*, that is, how many
    inputs you need to generate or how many times you need to run these tests to have
    confidence that they cover enough of the input space. In many cases, the input
    space is infinite or too vast to cover, but only you will know how far to push
    it based on the specific use case.


    The test we wrote for Enum.sort/1 is an example of a kind of test called *property-based
    tests*. They are called that because of the method we used to come up with this
    kind of test: we think of *properties* that our code holds regardless of the input
    we feed to it, provided the input is valid.


    The benefits of property-based testing don’t end with what we’ve just discussed.
    Coming up with valid inputs and properties is a huge part of property-based testing,
    but it’s also a helpful design tool. If you have to write down in clear terms
    what the valid inputs of your code are, you could end up expanding or shrinking
    the space of valid inputs. Coming up with properties, instead, forces you to think
    about what your code should do regardless of the specific input you feed to it,
    which might help with the design or implementation of the code. In the list-sorting
    example, the functionality is trivial, so it’s hard to see the design benefits
    of property-based testing; but in more complex contexts, it can be useful to think
    about these things.'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'Property-based testing is rarely done in a hand-rolled way like we did in our
    example, as there’s a plethora of frameworks (for all kinds of programming languages)
    that facilitate the implementation of property-based tests. Usually, property-based
    testing frameworks provide powerful ways of generating data and an infrastructure
    for verifying properties against that generated data. There’s also one important
    feature that makes using a property-based testing framework a clear advantage
    over rolling out your own randomness-based tests: frameworks *simplify* the randomly
    generated inputs when a failure occurs, and they present error messages that tend
    to be significantly easier to understand and address than if you handwrite tests
    with random data like we did.


    For Elixir, the property-based testing framework we’re going to use from now on
    is called stream_data.[49]


    # Why Use stream_data?


    The Elixir and Erlang ecosystems have good support for property-based testing
    through well-established libraries such as Quviq’s QuickCheck and PropEr for Erlang,[50][51]
    and PropCheck,[52] Quixir,[53] and stream_data for Elixir.


    However, we’re biased toward stream_data since Andrea wrote the original library,
    which means we know it well and are comfortable with it. In any case, the property-based
    testing concepts we’re going to illustrate work well with all libraries.


    We feel like having some context on why stream_data was created in the first place,
    even if other property-based testing frameworks were already available, could
    be helpful to readers. One reason was that originally the plan was to include
    stream_data in the Elixir standard library, which meant having to write something
    from scratch to make sure licensing wasn’t a problem and that the Elixir core
    team would be able to maintain the code. The team later realized that stream_data
    worked well enough as a library and so it didn’t end up in Elixir itself. Another
    reason was that all existing property-based testing frameworks would only generate
    random data in the context of property-based testing, without taking advantage
    of Elixir streams to make data generation a general-purpose tool.'
  merge: -1
  img_proc: true
- pgno: 307
  md: "# Introducing stream_data\n\nstream_data is a property-based testing framework\
    \ for Elixir. It provides two main functionalities, data generation and a framework\
    \ for writing and running properties. The data generation aspect of the library\
    \ is usable outside of property-based testing as a standalone feature, but it’s\
    \ the backbone of the whole framework and is also used extensively when writing\
    \ properties.\n\nTo follow along in the next few sections, create a new Mix project\
    \ with $ mix new sorting and then add :stream_data as a dependency in your mix.exs\
    \ file:\n\n```\nproperty_based_testing/sorting/mix.exs\n\ndefp deps do\n  [{:stream_data,\
    \ \">= 0.0.0\", only: [:dev, :test]}]\nend\n```\n\nNow, run $ mix deps.get to\
    \ fetch the dependency. As you can see in the code, we’ve only added :stream_data\
    \ in the :test environment since we’ll only be using the library when testing.\n\
    \nBefore diving into the framework, let’s rewrite the RandomizedSortTest test\
    \ we hand-rolled earlier to use the tools that stream_data provides:\n\n```\n\
    property_based_testing/sorting/test/randomized_sort_stream_data_test.exs\n\n1:\
    \ defmodule FirstStreamDataPropertySortTest do\n   use ExUnit.Case\n   use ExUnitProperties\n\
    \n5:   property \"Enum.sort/1 sorts lists\" do\n     check all list <- list_of(integer())\
    \ do\n       sorted_list = Enum.sort(list)\n```"
  merge: -1

- pgno: 137
  md: "# end\n\nstart_supervised/1 still returns {:ok, pid} if successful, or {:error,\
    \ reason} if unsuccessful. Behind the scenes, it sets up an on-the-fly supervision\
    \ tree with the given process as one of its children. For what we’ve seen so far,\
    \ it works almost identically to our manual start_link/1 assertion. The magic\
    \ happens when the test shuts down. Since ExUnit knows you started this process\
    \ under its on-the-fly supervisor, it also knows that it has to shut the child\
    \ process down when the test finishes executing and the test process exits. When\
    \ the test finishes executing, ExUnit will gracefully shut down all the processes\
    \ you started with start_supervised/1, using the proper supervisor shutdown semantics.\
    \ That means it will wait for the processes to shut down before starting the next\
    \ test.\n\nWhen you have to repeatedly start a process in many of your tests,\
    \ there’s no point in having assert {:ok, pid} every time, since you’re not effectively\
    \ testing that the process starts correctly every time. That is, it should start\
    \ correctly every time, but that’s not the focus of your test. We can see this\
    \ happening exactly as we just described in our original RollingAverageServerTest\
    \ on line 14, where we assert that start_link/1 returns {:ok, pid}, even though\
    \ that’s not the focus of the test. In those cases, ExUnit provides another helpful\
    \ utility, start_supervised!/1. It works the same as start_supervised/1, but raises\
    \ an exception if the process fails to start. We can use that in our test to make\
    \ sure that we start the process but without the need to assert on the {:ok, pid}\
    \ tuple:\n\n```\ntesting_otp/rolling_average/thin_gen_server_test_with_start_supervised.exs\n\
    \ndescribe \"adding and averaging\" do\n  test \"it returns the rolling average\
    \ for the elements\" do\n    pid = start_supervised!({RollingAverageServer, max_measurements:\
    \ 2})\n\n    RollingAverageServer.add_element(pid, 5)\n    RollingAverageServer.add_element(pid,\
    \ 6)\n\n    assert RollingAverageServer.average(pid) == 5.5\n```"
  merge: -1

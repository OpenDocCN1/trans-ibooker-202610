    where it’s easy to come up with good properties that give us confidence in our
    code. However, one of the biggest challenges of property-based testing in less-straightforward
    situations is coming up with good properties. Right at the beginning of this chapter,
    we saw how the Elixir team used property-based testing in a real-world scenario
    and how they came up with a property that helped test code *and* drive its behavior.


    In this section, we’ll discuss ways to make it easier to design properties for
    your own code. We’ll start by showing you some design patterns that you can recognize
    and apply to your code. Then we’ll quickly cover some common pitfalls made when
    coming up with properties.


    # Design Patterns


    Let’s dive into a few patterns that can help with the design of properties. These
    patterns can help you with the difficult task of designing efficient, accurate,
    and useful properties to test your code. The examples and ideas we’re going to
    discuss aren’t specific to stream_data because they apply to property-based testing
    in general, regardless of the framework.


    # Circular Code


    This pattern can be applied any time you have two pieces of code where the first
    piece does something and the second “undoes” it. This is where the name *circular
    code* comes from. A common example of this kind of code is encoding and decoding.
    Take the JSON protocol. If you write a JSON encoder/decoder, it’s likely that
    it’ll provide a function to encode a term into JSON and a function to decode the
    term from JSON. When you spot circular code, it’s usually straightforward to'

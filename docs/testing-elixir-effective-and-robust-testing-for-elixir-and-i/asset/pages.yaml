- pgno: 71
  md: '# Wrapping Up


    After writing our first tests, we dug into how to define the scope of a unit test.
    We then explored the tools ExUnit provides us to organize our tests, rounding
    out our exploration with ways to design our code to be more testable: refactoring
    to pure functions or leveraging dependency injection. The foundation we’ve created—organizing
    test files, understanding the stages of a test, combining list comprehensions
    with assertions, and designing our code to be testable—will serve as a starting
    point for all of the additional concepts in this book.


    In the next chapter, we’ll expand the scope of our testing black box through integration
    testing. You’ll see how most of the patterns can be scaled when testing across
    large parts of the application.



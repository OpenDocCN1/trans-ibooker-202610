  md: '# Wrapping Up


    We’ve spent this chapter focusing on testing Ecto schemas. We used that topic
    as a way to visit case templates and helper functions, and we touched on the Ecto
    Sandbox. We also delved into building tests that either safely update themselves
    or let you know when your test file is out of sync with the schema definition,
    both of which reduce the work to maintain your test file.


    In the next chapter, we’ll learn about testing queries and leveraging the factory
    pattern to speed up writing tests and make robust setup easier.



    \ doesn’t support stateful property-based testing yet, we still wanted to mention\
    \ it and go over the basic concepts behind it since it’s a powerful and useful\
    \ tool. All of the benefits of property-based testing that we’ve discussed in\
    \ this chapter apply to stateful property-based testing as well.\n\nAn especially\
    \ useful behavior of stateful property-based testing is that the random lists\
    \ of commands that we generate is shrunk in case of failure. This means that when\
    \ a property fails, the framework will present us a small list of commands with\
    \ small inputs that cause the failure. This can turn out to be invaluable. A great\
    \ testimony of this is Google’s leveldb, where as mentioned in Joseph Wayne Norton’s"

- pgno: 341
  md: '# Wrapping Up


    We saw how property-based testing is a powerful tool that can help strengthen
    your test suite and increase confidence in your code by testing it against randomly
    generated inputs. You learned to use the stream_data library both for data generation
    as well as for property-based testing. Then, we looked at some patterns that can
    help when designing properties. Finally, we had a quick look at stateful property-based
    testing. An important thing to remember is that property-based testing is not
    a silver bullet and it doesn’t replace other kinds of testing, but it can be a
    great addition to your test suite.


    This is the last chapter of the book. You made it! You’re now a skilled tester
    of Elixir code. We hope you’ll have fun (or at least productive times) with the
    things you learned. Happy testing!



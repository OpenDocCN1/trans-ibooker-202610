- pgno: 169
  md: '# Chapter 4


    # Testing Ecto Schemas


    As Elixir matures, the community is settling on certain libraries as *the* libraries
    for certain use cases. Both because of the involvement of José Valim and due to
    its inclusion in Phoenix, the de facto Elixir web framework, Ecto has found itself
    positioned as *the* relational database library for Elixir. Due to Ecto’s composition
    of a few discreet parts, Ecto.Schema has found a second purpose, that of a casting
    and validation library separate from database-related needs. This leaves us with
    the two most common use cases of Ecto: validation and database interactions. Both
    uses have their own sets of tests, and we’ll cover both in this chapter.


    The common saying “Don’t test your framework” often leads people to undertest
    their database code. Before we begin testing our Ecto code, let’s examine this
    saying and identify what practical implications it brings. Ecto is one of the
    most used libraries in the Elixir community and has a great team behind it who
    are putting out very solid work. The library “just works.” If there are bugs,
    they’re discovered very quickly. When we write our tests, we *should not* test
    the actual functionality of the library, but we *should* test that our code uses
    that library’s functionality correctly.


    This can be confusing, but we can provide you a heuristic that’ll help you know
    whether or not to test code: is it in your codebase? If yes,'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'then generally you should test it. If not, then generally you shouldn’t. That
    means that you should not test that a function in Ecto works correctly, but you
    should test that that function is called correctly from your codebase to the library
    code. If you think about the code that uses Ecto, your tests should actually be
    focused on the interface presented by that code. That means that your tests should,
    in theory, not know or care if you’re using the library. They should just be focused
    on input, return values, and side effects (in this case, changes to the data in
    the database).


    During our journey through testing Ecto, we’ll start by testing it as a validation
    library and as a database schema. Then we’ll move on to testing your database
    interactions. Finally, we’ll look at tooling, factories, and test cases that can
    drastically speed up writing your tests. As a bonus, we’ll also hit on some test
    tips and tricks that can be used in other tests as well.


    # Ecto’s Second Use Case


    ![](img/c08a369b9a1934f7c9c3b485727eca8e_170_0.png)


    As of Ecto 3.0, the Ecto team has tipped their hat to Ecto’s secondary purpose
    as a validation library. They’ve actually separated the library into two parts,
    allowing the use of schemas without having to pull the database-specific code
    into your application if you don’t need it.


    This separation of concerns is a great example of discreet, composable parts being
    used to build a flexible library.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Testing Your Schema Through Changesets


    As we mentioned, Ecto can be used for more than just database interactions, the
    most common case being as a validator of data. Either way you use it, there’s
    a common core of code in the schema file and therefore there are common tests.
    We’ll start by testing that common code, and then we’ll make some refactors to
    make our tests easier to maintain. After that, we’ll branch out and refactor our
    code and tests twice, once for each use case. We’ll call it out when it happens.
    This means that we’ll be working in very similar code but switching between file
    names to keep the concepts separate.


    Our Ecto-based code and tests are going to be written to reflect the belief that
    schema files should contain a bare minimum of logic, usually just the schema definition
    and functions that are focused on translating data to or from that schema definition.
    If you like to put more logic in your modules, you’ll be on your own for testing
    it.


    Ecto provides two modules, Ecto.Schema and Ecto.Changeset, that we’ll use to define
    our basic schema and core validation behavior. Ecto.Schema allows us to define
    (Ecto) structs and their types using a domain-specific language (DSL). Ecto.Changeset
    is code that, among other things, provides type casting and validation logic.
    When you define a schema with Ecto.Schema, you’re defining a container for data,
    but code tests are focused on behavior. On our first pass, we’ll test code using
    Ecto.Changeset functions under the hood to allow our tests to explore and validate
    both the definition of the schema as well as the behavior of a single function.


    Let’s start with a basic schema and then look at how it can be tested. We’ll make
    a generic Ecto schema for a user and build onto it as we learn. Create a new Mix
    project called testing_ecto with a supervision tree ($ mix new --sup testing_ecto).
    Next, add {:ecto, "~> 3.0"} to the deps'

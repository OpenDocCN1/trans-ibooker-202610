- pgno: 115
  md: 'use a different cassette in each test, you’re guaranteed to not mess things
    up in this regard.


    Let’s recap what we discussed in this section and see which approach is best for
    different use cases.


    # What Approach Is Best for Testing External Services?


    We saw three possible approaches to testing third-party HTTP services: making
    real requests, running a test server that mocks the service, or recording real
    requests and replaying them. As is often the case in our industry, there’s no
    definitive best approach among these. Each one fits some use cases better.


    If you can get away with making real requests to a service, then it’s often a
    good idea to do that. Many HTTP services provide sandbox environments specifically
    for testing or are idempotent, meaning that you can make requests without affecting
    the state of the service. Even in these cases, though, you might want to avoid
    the real requests approach if you don’t want to rely on an Internet connection
    in your tests. Nowadays it’s rare to not have an Internet connection available,
    but there are situations (like being on a flight) that take your Internet connection
    away. Relying on an Internet connection can also cause all sorts of weird problems
    if the connection is unstable. Personally, we’re fans of a workaround that gives
    you a nice way to deal with this: we tag our tests that use the Internet as @tag
    :requires_internet. This way, if you don’t have a connection available, you can
    run `mix test --exclude` `requires_internet` and still run all the tests that
    don’t require the connection. This is a good workaround if you’re rarely without
    a connection. One thing to consider is that this approach doesn’t necessarily
    let you test different kinds of responses from an external service (such as temporary
    errors), so you might have to mix this in with other approaches.'

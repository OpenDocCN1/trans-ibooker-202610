  md: 'of the HTTP request handlers, and maybe make them siblings in their parent
    supervision tree.


    Let’s talk about the downsides of this testing technique. The main one is that
    this type of testing isn’t automated. You need to have a human do all the steps
    manually: start the application, generate some work for it to perform, run observer,
    kill processes, and observe the behavior. We’re all about automated testing, as
    you can imagine, so we aren’t big fans of this. However, in our experience, the
    supervision trees of many applications tend to be changed relatively rarely compared
    to the rest of the code. As such, this kind of manual testing might be required
    only a few times during the life cycle of the application. When comparing the
    time it takes to run such manual tests to the time it would take to build automated
    testing for the failure behavior, it might make practical sense to just run those
    manual tests a few times.


    Another observation that we have from experience is that many Elixir and Erlang
    applications have a relatively “flat” supervision tree, with only a handful of
    children. The exploratory manual testing technique works significantly better
    with smaller and simpler supervision trees since, well, there are fewer failure
    cases to manually test in the first place. Testing a flat supervision tree tends
    to be easier than testing a nested tree.


    # Property-Based Testing for Supervision Trees


    Property-based testing is a technique that we’ll discuss more extensively in Chapter
    7, Property-Based Testing. In short, it revolves around generating random input
    data for your code and making sure your code maintains a given set of properties
    regardless of the (valid) input data. This might sound alien, but you’ll have
    time to dig in and understand these ideas in the chapter. However, we just wanted

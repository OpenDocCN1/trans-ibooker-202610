- pgno: 352
  md: '# Test Cases


    Every module whose name ends with a trailing Test and that contains a call to
    use ExUnit is considered a test case. A test case is essentially a collection
    of setup callbacks and tests.


    The most important thing to know here is that test cases can be executed either
    concurrently or sequentially in relation to other test cases. All the test cases
    that use the async: true option in use ExUnit are executed concurrently. Then,
    the rest of the test cases are executed sequentially (in the order they were defined),
    by default in random order.


    ![](img/c08a369b9a1934f7c9c3b485727eca8e_352_0.png)


    As we mentioned, a test case by itself doesn’t contain any logic. It’s only a
    container for setup callbacks and tests. The execution of a test case goes like
    this:


    +   1. All `setup_all` callbacks are executed.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '+   2. All tests are executed with their test-specific setup and teardown callbacks.


    Let’s start from `setup_all`. All `setup_all` callbacks are executed in the order
    they’re defined in the test case, and they’re executed in the *same process*.
    Essentially, before running any tests, the test case spawns a process, runs all
    the `setup_all` callbacks in that process, and then starts running tests.


    After the `setup_all` callbacks, the test case runs tests. Tests inside a single
    test case are *always run sequentially*, by default in random order (unless a
    suite seed is provided). If you’re curious as to why single tests are not run
    in parallel, the reason is performance: in most cases, single tests are quick
    enough that the overhead of executing them in parallel and each in its own process
    is bigger than the time it takes to run the tests.


    The only thing left to understand is the life cycle of single tests.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# Executing Tests


    When executing a single test, the test case does roughly this:


    +   1. Runs all the setup callbacks in the order they were defined.

    +   2. Runs the test body.

    +   3. Runs all the on_exit callbacks in the order they were registered.


    Let''s look at each of these steps separately.


    The first thing a test case does when running a test is spawn a new process to
    run that test in. All the setup callbacks are run sequentially inside that process.


    After the setup callbacks are executed, the test case runs the body of the test
    itself inside the test process.


    Once the test body exits (by finishing or by exiting explicitly, for example through
    an exception), it''s time to run the on_exit callbacks. A new process is spawned
    for the purpose of running all on_exit callbacks. All on_exit callbacks are executed
    in that process, one after the other (that is, sequentially). on_exit callbacks
    are not executed in the test process because, after all, the test process just
    exited so it''s not alive anymore.'
  merge: -1
  img_proc: true
- pgno: 355
  md: "# An Example and a Drawing\n\nIn this short section, we’ll provide a very artificial\
    \ example of a test case with some tests, setup callbacks, and teardown callbacks\
    \ in it. We’ll also provide a visual representation of the processes involved\
    \ in running this test case, as well as the output of running the test case. You\
    \ can run this file yourself and see the results by calling elixir test_case_example.exs.\n\
    \n```\ntest_lifecycle/test_case_example.exs\n\n# We use an empty list of formatters\
    \ so that ExUnit doesn't\n# output anything on the standard output.\nExUnit.start(autorun:\
    \ false, formatters: [])\n\ndefmodule TestCaseExampleTest do\n  use ExUnit.Case\n\
    \n  setup_all do\n    IO.puts(\"setup_all #1 in process: #{inspect(self())}\"\
    )\n  end\n\n  setup_all do\n    IO.puts(\"setup_all callback #2 in process: #{inspect(self())}\"\
    )\n  end\n\n  setup do\n    IO.puts(\"setup callback #1 in process: #{inspect(self())}\"\
    )\n  end\n\n  setup do\n    IO.puts(\"setup callback #2 in process: #{inspect(self())}\"\
    )\n  end\n\n  test \"#1\" do\n    on_exit(fn ->\n      IO.puts(\n        \"on_exit\
    \ callback #1 (test #1) in process: #{inspect(self())}\"\n      )\n    )\n```"

    \ need to define a get command to retrieve the current value for the key in our\
    \ model:\n\nproperty_based_testing/misc/stateful_testing.exs\n\n```\ndef get({key,\
    \ value}, key) do\n  value\nend\n```\n\nWe have our commands reflected in the\
    \ model. Now comes the fun part. We generate a random list of commands. Then,\

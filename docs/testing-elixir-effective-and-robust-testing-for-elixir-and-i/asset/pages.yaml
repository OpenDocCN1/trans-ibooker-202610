  md: '# Setting Up Sandbox Mode


    Our database keeps state, and right now this test is leaving new rows in the database.
    In the short run, it’s very unlikely to create a problem because we’re using a
    new, random string every time we run the test. In the long run, having persistent
    data between test runs increases the likelihood of having test failures due to
    unforeseen data collisions. If the same random string did happen to be picked
    in different test runs, the test would fail on the first inserted user, which
    was supposed to be part of the setup.


    Working against your database in tests is one of the most common places where
    leftover state changes can cause problems. We managed to avoid issues with our
    test on the unique constraint by using randomized data. But even with that, every
    successive test run is leaving one new row in the database. Each test works best
    when operating in a known good environment because that’s the only way they can
    guarantee that their own setup is complete and reliable. If a test can’t assume
    a clean working environment, we need to write a lot more defensive code, checking
    the environment for existing data, instead of just making what’s needed for the
    test and moving on. This approach both slows down writing the tests, because more
    code is needed, but it also slows down the tests themselves. While an extra database
    check or two isn’t really an issue from a time standpoint, if you’re writing enough
    tests, they’ll add up. In an isolated test, we’d focus on just making sure the
    test cleaned up whatever it created. Fortunately, Ecto provides us a very nice
    solution so that each individual test doesn’t have to track and clean up after
    itself: the Ecto Sandbox.[35]


    The Ecto Sandbox provides two key values to our tests. The first is by managing
    the connection pool: when properly configured, concurrent tests can run without
    sharing state in the database. This means leveraging the speed boost of concurrent
    tests without the kind of'
  merge: -1
  img_proc: true
- pgno: 224
  md: "defensive programming we’re trying to avoid. It’s a little bit complicated\
    \ when setting it up, but it works well. The second value that the Ecto Sandbox\
    \ provides is that each database connection is operating in a database transaction,\
    \ and when a test is complete, the transaction is rolled back. This means that\
    \ there are no changes to the state of the database when the tests are complete;\
    \ in other words, the Ecto Sandbox gives us automated teardown for the changes\
    \ in our database.\n\nWe’re going to set up the Sandbox, choosing a mode that\
    \ works well for the limited scope of unit tests. We’ll discuss other modes, where\
    \ the same Sandbox needs to be shared by multiple processes, in our chapter on\
    \ testing Phoenix. In your case template file, testing_ecto/test/schema_case.ex,\
    \ we’ll add a setup block that will be used by all tests that use this case template.\
    \ In that file, under the using block, above the valid_params/1 function, add\
    \ a setup block that looks like this:\n\n```\ntesting_ecto/test/schema_case.ex\n\
    \nsetup do\n  Ecto.Adapters.SQL.Sandbox.mode(TestingEcto.Repo, :manual)\nend\n\
    ```\n\nEvery test that uses this case template will now run this code before the\
    \ test executes as part of the setup steps. This applies to the tests that don’t\
    \ cause any interactions with the database as well. Fortunately, this is a very\
    \ fast, lightweight call and it shouldn’t impact your test suite’s overall runtime\
    \ significantly.\n\nIn order for the Sandbox to be available in our tests, we\
    \ need to make sure that the configuration in config/test.exs sets TestingEcto.Repo\
    \ to use the Sandbox. If you’re using the file we provided with our copy of the\
    \ application, you should be all set, but we’ll call out the step to make sure\
    \ you know how to set it up. In the Ecto part of your test config, you"

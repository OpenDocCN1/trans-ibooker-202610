    \n```\ndefmodule SoggyWaffleTest do\n  use ExUnit.Case\n\n  import ExUnit.CaptureLog\n\
    \  import Mox\n\n  require Logger\n\n  describe \"rain?/2\" do\n    test \"success:\
    \ gets forecasts, returns true for imminent rain\" do\n```"

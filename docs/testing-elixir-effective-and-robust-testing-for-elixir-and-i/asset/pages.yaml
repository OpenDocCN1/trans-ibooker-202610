- pgno: 48
  md: 'of our test. The data we’re passing in is hidden in another file in JSON, a
    format that isn’t as easy to read as a pared-down Elixir map. Additionally, to
    make the fixture data available to other tests, we’ve moved it into a setup block.


    Setup blocks are wonderful for test organization and for preventing repetition
    in our test suite, but they remove some of the test setup from the test and move
    it to another part of the file. Anytime the logic of a test extends outside of
    the test itself, it’s harder to read and understand. That said, like everything
    we do, we need to make a call on which way to go and which test design gives us
    the best balance of coverage and readability/maintainability.


    # Setting Module Attributes in Test Files


    Now that our first test is using a fixture, we’ll add tests that focus on specific
    values in the weather API response, meaning we won’t use the fixture data because
    we don’t know the specific values. Since the module under test (SoggyWaffle.WeatherAPI.ResponseParser)
    is focused on translating data specific to an external API into internal data,
    the module must have a lot of knowledge specific to that API. This shows up in
    the form of all the various weather condition IDs at the top of the module.


    Our tests will have to have that same level of knowledge so that they can test
    the code thoroughly. This means adding a copy of all of the IDs to our test file.
    It may seem like a good idea to put them somewhere where both the test and the
    code under test can access them, but that’s discouraged. Any accidental modifications
    to that list could cause our test to miss a needed case, allowing our code under
    test to make it to production with a bug. You should avoid using the Don’t Repeat
    Yourself (DRY) principle when the instances are split between your tests and your
    code under test.[10]'

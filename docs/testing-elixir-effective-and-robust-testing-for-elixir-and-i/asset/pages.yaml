    \ how the mock module is called. We want to stub the functions in SoggyWaffle.WeatherAPIMock\
    \ so that they do the bare minimum to pretend everything went fine when interfacing\
    \ with the weather API.\n\nHowever, stubbing all the functions in each test that\
    \ somehow end up calling get_forecast/1 quickly becomes a pain. For this reason,\
    \ Mox provides a Mox.stub_with/2 function to stub all of the functions in a mock\
    \ module with the implementations in another module. For example, we could define\
    \ a NoOpWeatherAPI module that implements the SoggyWaffle.WeatherAPI.Behaviour\
    \ behaviour but does absolutely nothing in the get_forecast/1 function.\n\n```\n\

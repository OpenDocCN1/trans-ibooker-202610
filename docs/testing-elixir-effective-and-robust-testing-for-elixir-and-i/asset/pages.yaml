- pgno: 238
  md: "```\n40:    end\n  -\n  - end\n```\n\nThe first thing to note in this test\
    \ file is that common setup block at line 7. Because this test file is for our\
    \ queries, we can safely assume that every test will require a database connection.\
    \ Since our case template, DataCase, is setting the Ecto Sandbox to :manual, we’ll\
    \ need to check out a connection for each test. Remember that at the end of the\
    \ test, the connection will be released and the database transaction holding all\
    \ of our interactions will be rolled back.\n\nWe see our first use of a factory\
    \ function in the test itself, at line 12. We are calling string_params_for/2\
    \ (even though we’re only passing one argument, there is a second, optional argument).\
    \ Under the hood, this takes the atom being passed to it, in our case :user, and\
    \ will call user_factory/0 in our factory. Even though our function, user_factory/0,\
    \ returns a User schema, ExMachina will take the return value and convert it to\
    \ a string-keyed map in order to provide “string_params”. There’s a similar function\
    \ called params_for/2, which returns an atom-keyed map instead. We’re requesting\
    \ string params because that’s the shape that most web-based input takes.\n\n\
    There’s a general pattern that starts to play out in this test. When a test is\
    \ exercising code that writes to the database, the test itself will need to read\
    \ from the database during the assertion phase in order to verify the side effect(s).\
    \ If a test is exercising code read from the database, the test will need to write\
    \ directly to the database during the setup phase. Don’t use your own application’s\
    \ code to do those reads and writes. On line 17, you’ll see that our test is calling\
    \ TestingEcto.Repo directly. You don’t want your test to depend on your application\
    \ code. If you do use application code and something changes in your code, breaking\
    \ its functionality, your test suite will blow up with a lot of failing tests.\
    \ Most"

- pgno: 104
  md: 'We’re using HTTP Poison as our HTTP client. The get/1 function lets us send
    a GET HTTP request to the URL we pass to it and returns an {:ok, response} tuple.
    However, we still want to make sure that the URL is correct for our request, that
    the request is performed correctly, and that the response is actually a 200 status
    code with a body that we’re able to parse. There’s no way out of this other than
    to send the real request to the weather API, but there are a few approaches on
    how to do it reliably and in a reproducible way.


    # Sending Real Requests


    The simplest approach is to send the real request to the weather API in the tests
    and assert on the response sent back by the API. The advantage of this approach
    is that we test the real API directly, so if the API changes or if the code that
    interacts with it changes, the tests will possibly fail. However, there are some
    important disadvantages. First of all, our tests now depend on the availability
    of a third-party system, which we don’t control. If the weather API goes down
    or we don’t have access to the Internet, our tests will fail even if the code
    is correct, which means that our tests are brittle and not reproducible. Another
    disadvantage is that the API could change some returned data that the test relies
    on without breaking the contract. In that case, the test might start failing without
    signaling a real issue. The other main disadvantage of this approach is that making
    real HTTP requests can cause problems in many use cases. For example, the weather
    API we’re using is rate-limited (as most APIs are in some way), which means that
    our tests could affect the rate limiting of the API without providing a service
    to the users.


    The disadvantages of the real requests approach can be mitigated in some cases.
    For example, some third-party APIs provide a “staging” or “sandbox” API with the
    same interface as the real API but with different behaviour. For example, with
    a weather API like the one we’re using, the sandbox API could always return the
    same weather data without'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'actually talking to any forecasting service. This would significantly reduce
    the load on the weather API itself, allowing its developers to possibly lift the
    rate limiting in this environment. However, many third-party APIs don’t provide
    anything like this, so we have to come up with ways to avoid making real requests
    in tests but still test the code that makes those requests. Let’s see the two
    most common approaches next.


    # Building an Ad-hoc HTTP Server


    The first approach we’re going to examine is building an ad-hoc HTTP server we
    can send requests to that runs alongside our test suite. We’ll have control over
    the server itself, so we’ll be able to control its behaviour and send as many
    requests to it as we want during testing.


    Let’s go back to the weather API use case. The weather API exposes a GET /data/2.5/forecast
    endpoint that we hit from our application. This endpoint accepts two parameters
    in the query string: q, which is the query, and APPID, which identifies the credentials
    of our application. The endpoint returns a 200 OK HTTP response with a JSON body
    containing information about the weather forecast. Let’s build an HTTP server
    that mimics this API.


    The Elixir ecosystem has established libraries to build HTTP servers. For now,
    we’re going to use Plug.[15] Plug is a library that provides a common interface

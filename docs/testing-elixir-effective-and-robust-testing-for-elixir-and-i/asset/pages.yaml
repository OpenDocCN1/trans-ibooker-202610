- pgno: 93
  md: "expectations about the way the mock module should be called. To create mock\
    \ functions, Mox provides Mox.expect/4, which takes the name of the mock module,\
    \ the name of the function, the number of times the mocked function can be invoked,\
    \ and an anonymous function (similarly to stub/3).\n\n```\nintegration_tests/soggy_waffle/test/soggy_waffle_test_with_mox_expect.exs\n\
    \ndescribe \"rain?/2\" do\n  test \"success: gets forecasts, returns true for\
    \ imminent rain\" do\n    expect(SoggyWaffle.WeatherAPIMock, :get_forecast, 1,\
    \ fn city ->\n      assert city == \"Los Angeles\"\n\n      response = %{\n  \
    \      \"list\" => [\n          %{\n            \"dt\" => DateTime.to_unix(DateTime.utc_now())\
    \ + _seconds = 60,\n            \"weather\" => [%{\"id\" => _thunderstorm = 231}]\n\
    \          }\n        ]\n      }\n\n      {:ok, response}\n    end)\n\n    assert\
    \ SoggyWaffle.rain?(\"Los Angeles\", DateTime.utc_now())\n\n    verify!(SoggyWaffle.WeatherAPIMock)\n\
    \  end\nend\n```\n\nWe changed the call to the stub/3 function with a call to\
    \ expect/4. We expect get_forecast/1 to be called only once, so we use 1 as the\
    \ expected number of invocations (that's the default, but we like to be explicit).\
    \ In the anonymous function passed to expect/4, we're making assertions on how\
    \ we expect the mock to be called. By combining the expected number of invocations\
    \ and the assertions in the anonymous functions, we're setting clear expectations\
    \ on how the weather API interface should be used by rain?/2."

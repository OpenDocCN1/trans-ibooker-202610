- pgno: 89
  md: "# Test Doubles: Stubs, Mocks, and Fakes\n\nUntil now, we’ve just used the term\
    \ *external dependency double* to refer to something that doubles as the external\
    \ dependency. However, we can be more precise than that and define three kinds\
    \ of doubles: stubs, mocks, and fakes. We already saw an example of a *fake* with\
    \ SoggyWaffle.FakeWeatherAPI. A fake is just something that acts as the external\
    \ dependency without calling out to the external dependency. A *stub* is a double\
    \ where function implementations can be replaced on demand to do something in\
    \ isolation, for example by replacing a function to do something in one test and\
    \ something else in another. Stubs can be used to provide a different behavior\
    \ of a given function based on the need of the test. Stubs are most useful when\
    \ combined with *mocks*. A mock is essentially a stub that can be used for asserting\
    \ on how and how many times the double is called.\n\nStubs and mocks require a\
    \ little more work than fakes, since we have to be able to work with the specific\
    \ functions of an interface instead of faking the whole interface at once. Luckily,\
    \ in Elixir we can use a library called Mox.[14] Mox lets us define test doubles\
    \ based on behaviours and provides functionalities to make mocks or stubs of single\
    \ functions in the behaviour. The library works by defining dynamic modules on\
    \ demand that have an interface of functions that implements the behaviour you’re\
    \ building the mock for. It’s pretty cool.\n\nThe first thing we want to do is\
    \ add Mox to the dependencies of our application. We add the dependency only to\
    \ the test environment since we don’t want to bring Mox into a production application:\n\
    \n```\nintegration_tests/soggy_waffle/mix_with_mox.exs\n\ndefp deps do\n  [\n\
    \    # other dependencies\n    {:mox, \">= 0.0.0\", only: :test}\n  ]\n```"
  merge: -1
  img_proc: true
- pgno: 90
  md: "```\n]\\nend\n```\n\nTo start with Mox, we can use the Mox.defmock/2 function.\
    \ This function takes a module name and a :for option as the second argument.\
    \ The module name will be the name of the test double that Mox will generate.\
    \ In our weather API example, that module name could be SoggyWaffle.WeatherAPIMock.\
    \ :for should be a module (or a list of modules) that will act as a test double\
    \ for the first module passed to the function. The modules passed to :for should\
    \ be behaviours, since that’s how Mox will generate a module that provides the\
    \ correct interface. In our weather API example, we can generate a test double\
    \ for the SoggyWaffle.WeatherAPI.Behaviour behaviour. A great place to use Mox.defmock/2\
    \ is your application’s test/test_helper.exs, which is executed by ExUnit when\
    \ starting the test suite.\n\n```\nintegration_tests/soggy_waffle/test/test_helper.exs\n\
    ```\n\n```\nMox.defmock(SoggyWaffle.WeatherAPIMock,\n  for: SoggyWaffle.WeatherAPI.Behaviour\n\
    )\n```\n\n# Where to Stick Mock Definitions?\n\nTo get started, put Mox.defmock/2\
    \ calls in test/test_helper.exs. Mix will let Mox define the mocks dynamically\
    \ right before running the test suite.\n\nHowever, you might find that defining\
    \ mocks like this at runtime can cause some compilation warnings if you use some\
    \ of the techniques in this book, such as reading the dependency double module\
    \ at compile time in your application code. If that’s the case, you can choose\
    \ to define mock modules through Mox at compile time, too. This way, the mock\
    \ modules will be compiled like other modules in your application before running\
    \ any of the test suite.\n\nTo do that, we suggest you create a file such as test/support/mocks.ex\
    \ and put all your Mox.defmock/2 calls in there. This file won’t automatically\
    \ be compiled by Elixir because it doesn’t live inside the lib directory, so we\
    \ need to tweak mix.exs. You can tell Elixir where the files you want to compile\
    \ are by listing the “compilation paths” under the :elixirc_paths options in the\
    \ project/0 function of"

- pgno: 250
  md: '# Chapter 6


    # Testing Phoenix


    While Elixir is flexible enough to be used in countless ways, most people writing
    Elixir will end up writing an application using the Phoenix framework at some
    point. The framework provides a lot of tooling to build a web server with relative
    ease and speed. Phoenix is rare among web frameworks, though, in that it doesn’t
    have strong opinions on your application’s architecture or file structure. It
    provides a standardized way of defining various web interfaces and connecting
    them to application code. This chapter will cover the different ways in which
    a Phoenix application can be tested, focusing on testing the application as a
    whole via the web and websocket interfaces.


    While we’ll cover testing Phoenix-specific patterns, it’s really important to
    understand that for the most part, testing a Phoenix application will use everything
    we’ve already covered in the previous chapters: unit tests, integration tests,
    OTP tests, and Ecto tests (which really are just specific variations of unit and
    integration testing). We won’t rehash those ideas here. As a result, this chapter
    isn’t entirely stand-alone. If you aren’t familiar with the basics of testing,
    this chapter won’t be very helpful. Instead, we highly recommended that you read
    the preceding chapters first so you’re familiar with the basics of unit testing,
    integration tests, testing OTP, and testing Ecto.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# The Role of Phoenix in Your Application


    What we think of as the Phoenix framework is really a combination of libraries:
    Ranch,[37] Cowboy,[38] Plug,[39] Phoenix,[40] and Ecto.[41] This combination provides
    a lot of tools to spin up web-server applications fairly easily, drawing on the
    history of many other frameworks, but it works very hard to not drive the design
    of your application. That ultimately means that a standard Phoenix application
    can be broken down into two main parts, the incoming web interface part (which
    includes Ranch, Cowboy, Plug, and Phoenix) and the rest of the application (mostly
    Elixir and Ecto code). In Phoenix lingo, that’s YourAppWeb and YourApp. While
    Phoenix’s generators and documentation nudge users to use the concept of contexts
    to organize their nonweb code, the truth is that you can write and organize the
    application however you want. As a result, testing the business logic of your
    application isn’t Phoenix-specific in any way. It’s going to look like the unit
    and integration testing in any Mix application.


    Phoenix allows users to interact with it in several different ways: server-rendered
    HTML, JSON-based endpoints, and Phoenix Channels (web sockets). A new library,
    Phoenix LiveView, combines elements of server-rendered HTML and web sockets to
    provide interactive clients. It’s not in the Phoenix core and so we won’t cover
    it in this book. If you want to learn more about it and how to test it, check
    out Programming Phoenix LiveView [TD21].


    As part of testing these interfaces, we’ll also rope in testing routes, plugs,
    and views. Code that calls out to other services while using the Internet to do
    so isn’t included in this. This topic is covered under integration testing, and
    that code would normally live in the nonweb part of your application.'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'There’s a lot of overlap between testing each kind of interface. To avoid very
    repetitious examples, we’ll skip things we’ve already covered if there aren’t
    any caveats. For example, if we cover testing plugs as part of testing a JSON
    API, we won’t cover plugs in testing server-rendered HTML endpoints.


    # Plugs


    The Phoenix library has been hugely helpful to the productivity of anyone wanting
    to write an Elixir-based web application, but it’s useful to know that it owes
    a lot of its success to another library, Plug.[42] Plug is a basic specification
    and tooling set that allows users to create composable web applications. In this
    chapter, we’ll mention “plugs” as a reference to middleware that you might be
    using in your application. Additionally, the Plug library provides some of the
    testing tools that we’ll require. Don’t worry, though: because Plug is a dependency
    of the Phoenix framework, if you’re working in a Phoenix-based application, you
    already have Plug and its testing tools available to you. We’ll refer to any modules,
    both those provided by Phoenix and those custom written, that match the interface
    defined by Plug as plugs.


    # How to Use the Provided Application


    With this book, we’ve provided an application, called NotSkull, that will serve
    as the code samples for most of this chapter and the next. NotSkull is a working
    application, complete with tests.


    The tests you’ll write while working through this chapter will all be in new files.
    If you’re having trouble, you’ll find a complete test file that exists under the
    same name of the file we’ll have you create, but with .bak.exs as the file extension
    instead of .exs.'

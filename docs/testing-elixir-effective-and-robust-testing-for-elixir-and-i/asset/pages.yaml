    \ need to remove from the test scenario, which is why we call this code isolation,\
    \ is the call to the weather API at line 4. It very easily could return different\
    \ results depending on when the code is executed, preventing our test from being\
    \ able to expect exact results.\n\nNow that we added a mechanism to inject the\
    \ dependency, let’s write a test that can leverage that mechanism to create a\
    \ scenario where the result should always be the same. Add the following test\
    \ file (test/soggy_waffle_test.exs) to your application.\n\n```\nunit_tests/soggy_waffle_examples/test/soggy_waffle_test.exs\n\

- pgno: 239
  md: 'of those will be misleading because they won’t be tests that are focused on
    the failing code. One of our goals when designing tests is to make it so that
    if there is a failure, it’s quick and easy to find where our code isn’t behaving
    correctly.


    On the line to exercise the code (line 15), we are asserting that the return value
    is an :ok tuple and binding the returned user to a variable. We typically strive
    to have a function do a single thing, focusing either on a return value or a side
    effect. Unfortunately, query code like this typically has both a significant return
    value (in our case the user that was inserted) as well as an important side effect
    (that data was inserted into the database). There are two common mistakes made
    when testing functions like these.


    The first mistake is that people tend to only focus on the return value. If, under
    the hood, your code is as straightforward as this is, with the final call being
    to Repo.insert/1, it would be fine. The problem is that code can change over time,
    and testing only the return value doesn’t guarantee what’s arguably the most important
    responsibility of the function under test: inserting data into the database. Our
    test isn’t only binding the return value but also then grabbing the data from
    the database. We’re fairly safe to assume that the ID on the returned user is
    the same as that of the row in the database. At this point, we have both the return
    value from the exercise line and the data straight from the database. We compare
    them on line 18 to make sure they’re identical (as they really should be). Once
    we know they’re the same, we can pick either one to continue our testing. That
    leads us to the second common mistake.


    It’s incredibly common to see tests like this that make assertions on one or two
    of the values and then assume that the rest are good to go. This is unfortunate,
    because the point of the test is to make sure that the insertion code is correct.
    How can it prove that if it doesn’t check all of the values? This is where a list
    comprehension comes in. We run'
  merge: -1

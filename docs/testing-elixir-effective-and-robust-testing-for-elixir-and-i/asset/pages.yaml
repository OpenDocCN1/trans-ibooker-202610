    \ Sometimes a long name can save a lot of work for those who come after you.\n\
    \nThe scope of your setup is set by the logical grouping of your tests. If your\
    \ setup is inside of a describe, it’ll be run before the tests grouped inside\
    \ of that describe. If it’s at the top of your test file—outside of any describes—it’ll\
    \ be run before all the tests in that file."

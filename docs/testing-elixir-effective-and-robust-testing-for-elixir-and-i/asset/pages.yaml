  md: 'may use the generation size differently: for example, binary/1 uses it to determine
    the length of the generated binary. Composite generators (such as list_of/1) will
    pass the generation size down to the inner generators. For example, list_of(integer())
    will use the generation size to determine both the length of the generated list
    as well as the “complexity” of the integers in that list.


    You might be wondering how the generation size is passed to a generator when we
    want to produce an element out of that generator. There’s no way to directly pass
    the generation size because generation is hidden from the user, either by stream_data
    when using generators in property-based testing or by the implementation of the
    Enumerable protocol. This is a design decision in the library itself.


    When using generators as streams, the implementation of the Enumerable protocol
    doesn’t allow for extra information to be passed alongside functions (which would
    allow passing the generation size). In fact, when generators are used as streams
    they start generating with a size of 1 and increase by one every time a term is
    generated. This means that if we use Enum.take(generator, 5) to take five elements
    out of a generator, the fifth element will be produced with a generation size
    of 5. While there’s no way to *directly* pass the generation size when producing
    elements, there are a few indirect ways to manipulate it. These effectively “wrap”
    the generator so that it can carry the generation size information around.



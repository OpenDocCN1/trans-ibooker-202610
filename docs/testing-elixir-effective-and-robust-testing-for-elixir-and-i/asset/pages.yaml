  md: "The idea behind ExVCR is to issue a request to the real third-party API the\
    \ first time and record the response into a file called a *cassette*. Then, when\
    \ we need to make that same request to the third-party API, ExVCR will *replay*\
    \ that request and return the response from the cassette without making any real\
    \ HTTP calls. By now you probably get why it’s called ExVCR: cassettes, recording,\
    \ replaying…. It makes sense.\n\nThe way ExVCR works is by creating implicit mocks\
    \ of widely used Erlang and Elixir HTTP clients, such as the built-in httpc or\
    \ hackney.[19][20] These mocks intercept requests and record them if there’s no\
    \ cassette for them, or replay the requests from the respective cassette. This\
    \ approach is limiting in cases where you don’t use one of the HTTP clients supported\
    \ by ExVCR, since ExVCR won’t work. However, many applications do use clients\
    \ supported by ExVCR so it’s still worth exploring.\n\nLet’s see how to change\
    \ the SoggyWaffle.WeatherAPI test to make use of ExVCR. Start by adding :ex_vcr\
    \ as a dependency:\n\n```\nintegration_tests/soggy_waffle_actual_integrations/mix_with_ex_vcr.exs\n\
    \ndefp deps do\n  [\n    # other dependencies\n    {:ex_vcr, \">= 0.0.0\", only:\
    \ :test}\n  ]\nend\n```\n\nThe get_forecast/1 function uses HTTP poison as its\
    \ HTTP client and HTTP poison uses :hackney under the hood, so ExVCR will work.\
    \ Now we need to call use ExVCR.Mock to make the ExVCR DSL available in our tests\
    \ and we’ll have to use the ExVCR.Adapter.Hackney adapter.\n\n```\nintegration_tests/soggy_waffle_actual_integrations/test/soggy_waffle/weather_api_t_ex_vcr.exs\n\
    ```"

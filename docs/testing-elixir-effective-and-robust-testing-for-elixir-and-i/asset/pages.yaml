- pgno: 234
  md: "# Adding a DataCase to Help with Setup\n\nWhen testing our Ecto schemas, we\
    \ made a case template called SchemaCase. That was very specific to an exact kind\
    \ of test. While the exercise of making that was useful, you’ll likely find that\
    \ a slightly higher-level case template can cover your needs for anything that’s\
    \ dealing with data as it’s needed for database interactions. We’re going to create\
    \ a new case template that will look very similar and, if you took the time, would\
    \ be able to replace the SchemaCase that we used in the schema tests. Create a\
    \ new file called testing_ecto/test/data_case.ex and add the following code:\n\
    \n```\ntesting_ecto/test/data_case.ex\n\ndefmodule TestingEcto.DataCase do\n \
    \ use ExUnit.CaseTemplate\n\n  using do\n    quote do\n      alias Ecto.Changeset\n\
    \      import TestingEcto.DataCase\n      alias TestingEcto.{Factory, Repo}\n\
    \    end\n  end\n\n  setup_tags? do\n    Ecto.Adapters.SQL.Sandbox.mode(TestingEcto.Repo,\
    \ :manual)\n  end\nend\n```\n\nRight now, using this file brings only two advantages\
    \ over using ExUnit.Case. First, it provides the common sandbox setup, like our\
    \ SchemaCase did in the last chapter. Second, it adds an alias for TestingEcto.Factory\
    \ and TestingEcto.Repo on line 8. We’ll need both of those"
  merge: -1
  img_proc: true

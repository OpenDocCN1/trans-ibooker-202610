- pgno: 14
  md: '# Introduction


    Charles Kettering, an American inventor and the longtime head of research for
    General Motors, has a quote that applies well to our approach to software tests:


    > > A problem well stated is a problem half-solved.


    Think of your tests as stating the problem that your code solves. Once that’s
    done, writing that code becomes easier. Moreover, tests not only state the problem,
    but they also *verify* that the solution is correct. They’re an almost indispensable
    part of software engineering, and we believe it’s important to understand why
    and how to use them.


    Some developers write tests for their software. Some developers don’t. There is
    code running all over the world that doesn’t have a single test behind it. So,
    why do we test? We do it for a plethora of reasons, but they fit into just a few
    categories.


    First of all, we test to increase confidence that our software does what it’s
    supposed to do. Testing gives us *confidence* that our code works as expected.
    This is true for all kinds of testing, whether for automated tests performed by
    a machine or for manual tests performed by a human.


    The other main reason for testing is to *prevent breaking changes* (also called
    *regressions*). Imagine you have an existing codebase'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'that you have to work on in order to add a new feature. How can you feel confident
    that adding the new feature won’t break any of the existing features? In most
    cases, testing is the answer. If the existing codebase is well tested (automated,
    manual, or both), then you’ll feel safer making changes if the testing suite reveals
    that nothing broke.


    In this book we''ll focus on *automated testing*. Manual testing, such as QA (Quality
    Assurance), is fundamental for many reasons, but as developers we often get more
    value from automated testing. A good automated test suite allows us to have a
    fast feedback cycle during development and gives us tight control over how we
    test specific parts of our applications.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Why Do We Need a Book for Testing in Elixir?


    Elixir is an interesting and fairly unique programming language. It provides features
    and concepts that can be hard to test if you’ve never dealt with anything like
    them. Some of those features are common in other programming languages but are
    more prominent in Elixir (and Erlang), such as concurrency and immutability. Other
    features, such as resiliency or the OTP framework, are more unique to Erlang and
    Elixir and can be challenging to test effectively.


    From a more practical perspective, Elixir is a great language to write a testing
    book about because the tools and patterns we use when testing Elixir code are
    pretty consolidated in the Elixir community. One reason for this is that Elixir
    comes equipped with its own testing framework, *ExUnit*. We’ll explore ExUnit
    inside and out and we’ll learn how to use it in many different situations in order
    to test our applications on different levels.


    Elixir is closely tied to its “parent” language, Erlang. As you likely know, Elixir
    compiles to the same bytecode as Erlang and runs on the Erlang virtual machine
    (commonly known as the *BEAM*). Elixir code often seamlessly calls out to Erlang
    code, and Elixir applications almost always depend on a few Erlang libraries.
    However, testing seems to be an area where the two languages have a bit less in
    common. The sets of tools and libraries used by the two languages don’t intersect
    much. For these reasons, we won’t really talk about testing in Erlang and will
    focus exclusively on testing in Elixir. We feel this statement is worth clarifying
    since the two languages are so close to each other.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Who This Book Is For


    This book was written for people with a basic Elixir background who want to get
    better at the testing tools and practices in the Elixir ecosystem. We will skim
    over most Elixir concepts, such as the language constructs and data types, OTP,
    Ecto, and Phoenix. Instead of covering those, we’ll learn how to *test* those
    concepts and tools. Whether you’ve used Elixir just for a bit or you’re an Elixir
    expert, we think you’ll learn a few new things throughout the book.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# How to Read This Book


    Each chapter in the book addresses a different aspect of testing in Elixir.


    In Chapter 1, Unit Tests, we’ll get going and learn about the “smallest” kind
    of testing: unit testing. We will cover how and when to write unit tests, the
    tools to write them in Elixir, and techniques to isolate code under test.


    In Chapter 2, Integration and End-to-End Tests, we’ll move on to testing different
    components of your system that interact with each other. We’ll learn how to test
    components together, as well as how to isolate components to run more focused
    integration tests. We’ll also touch on end-to-end testing, that is, testing the
    whole system from the perspective of an outside entity.


    In Chapter 3, Testing OTP, we’ll learn about testing one of Erlang and Elixir’s
    most unique features, OTP. OTP and processes in general present quite a few challenges
    when it comes to testing. We’re going to talk about those and learn techniques
    to make testing these abstractions easier.


    In Chapter 4, Testing Ecto Schemas, and Chapter 5, Testing Ecto Queries, we’ll
    talk about testing code that uses the Ecto framework to validate data and interact
    with databases. Ecto is a widely used library in the Elixir landscape, and the
    community has created patterns on how to test code that makes use of it.


    In Chapter 6, Testing Phoenix, we’ll cover Elixir’s most used web framework, Phoenix.
    Phoenix provides several moving pieces. We’ll learn how to test those pieces in
    isolation as well as how to test that the pieces of your Phoenix application work
    correctly together.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'In the last chapter, Chapter 7, Property-Based Testing, we''ll explore a technique
    for introducing randomness in your testing suite in order to cover large amounts
    of inputs to your code and increase the chances of finding inconsistencies.


    Note: The chapters in the book don''t have to be read in the order they''re laid
    out. For example, if you''re particularly interested in testing code that uses
    the Ecto framework, you can jump directly to Chapter 4, Testing Ecto Schemas.
    Most chapters are self-contained. However, we recommend that you read Chapter
    1, Unit Tests, and Chapter 2, Integration and End-to-End Tests, in order: these
    chapters lay the foundations for the terminology, tools, and techniques that we''ll
    use throughout the book.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# About the Code


    A testing book is a strange beast. Most programming books show “application code”
    when discussing examples and often omit or give little attention to tests. In
    this book, we want to focus on testing, but we need application code since there’s
    no point in testing if you don’t have anything to test. At the same time, we don’t
    want to focus on the application code since it would take away from what we want
    to talk about, which is testing. As we said, it’s a strange beast.


    Throughout the book we’ll work on two main applications. In the first three chapters,
    Chapter 1, Unit Tests, Chapter 2, Integration and End-to-End Tests, and Chapter
    3, Testing OTP, we’ll work on Soggy Waffle. Soggy Waffle is an application that
    reads the weather forecast for a given area off the Internet and can send SMS
    alerts in case rain is expected in the next few hours. It’s not a broadly useful
    application, but it helps illustrate many Elixir testing concepts.


    In the next two chapters, Chapter 4, Testing Ecto Schemas, and Chapter 5, Testing
    Ecto Queries, we’ll use a very basic application, called Testing Ecto, to illustrate
    how to test applications that use the Ecto framework.


    Chapter 6, Testing Phoenix, will have a single application with examples covering
    the different interfaces provided in the standard Phoenix library.


    The last chapter, Chapter 7, Property-Based Testing, won’t follow a particular
    application in order to focus on different concepts related to property-based
    testing.


    We’ll have to continuously “escape” these applications over and over again. We
    made this choice because our focus is testing, and many'
  merge: -1
  img_proc: true
- pgno: 21
  md: times we would have had to come up with artificial and forced features for these
    applications in order to talk about some testing topic. In those cases, we’ll
    just go with self-contained examples that allow us to directly address some testing
    topics without making our main application a total mess.
  merge: -1
  img_proc: true

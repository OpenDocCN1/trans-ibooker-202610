    an expectation. This way, if that dependency is never called, the test will fail.
    This kind of expectation is mostly useful when there’s an expected side effect
    of your code and your tests are concerned with making sure it happens. Admittedly
    our test is just making a query via the function call, so the expectation isn’t
    totally necessary in this case, but it still illustrates well how to add an expectation
    to a test double.



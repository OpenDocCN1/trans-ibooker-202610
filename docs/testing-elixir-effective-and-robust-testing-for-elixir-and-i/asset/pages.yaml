- pgno: 94
  md: 'There’s one more difference between using stub/3 and using expect/4. When we
    use expect/4, we need to call Mox.verify!/1 at the end of the test. verify!/1
    takes the name of a mock module (in this case it’s SoggyWaffle.WeatherAPIMock)
    and verifies the expectations we set on the mock functions. If we call the mock
    function less or more times than specified in expect/4, we won’t get an error
    unless we call verify!/1.


    In this case, a mock is the cleanest solution to testing that the rain?/2 function
    uses the weather API interface correctly. When using a fake or a stub, we had
    to resort to a Logger call (which is a global side effect) in order to test that
    the weather API interface was called the correct number of times and with the
    correct arguments. With a mock, however, we can put the assertions right in the
    mock function and call it a day.


    Let’s quickly talk about verifying expectations. A manual call to verify!/1 isn’t
    used very often in real-world code, since Mox provides a few alternatives that
    are less repetitive. The first one isn’t much more concise but it can simplify
    things a little bit: instead of calling verify!/1 with the mock module name, we
    can call Mox.verify!/0 with no arguments. When we do that, Mox will verify all
    the expectations on all the mock modules used in the test where it’s called. Another
    useful function is Mox.verify_on_exit!/1. When invoked, this function sets up
    an on_exit hook for the current test that will verify all the expectations in
    the test (similarly to verify!/0) when the test process exits. verify_on_exit!/1
    takes an optional argument, which is the test context. This is done for convenience,
    since a great way to use verify_on_exit!/1 is to use it as a setup callback.


    ```

    integration_tests/soggy_waffle/test/soggy_waffle_test_verify_on_exit_setup.exs


    import Mox


    » setup :verify_on_exit!

    ```'
  merge: -1
  img_proc: true
- pgno: 95
  md: "When used in the global test context, Mox will verify expectations at the end\
    \ of each test. If we want more control, we can always use describe blocks (as\
    \ mentioned in Describing Your Tests) and only use the setup callback in the blocks\
    \ where we need it.\n\n# Allowing Mocks to Be Used from Different Processes\n\n\
    We haven’t discussed how Mox decides who’s allowed to call the mock or stub functions.\
    \ When a function of a double is stubbed or mocked, that stub or mock by default\
    \ only works when that function is invoked from the process that defines the stub\
    \ or mock. In our weather API example, this doesn’t cause any problems since the\
    \ weather API interface is used directly from the process that calls rain?/2,\
    \ which is the test process. However, let’s slightly change the code for the rain?/2\
    \ function so that the weather API interface is invoked in a different process.\
    \ We’ll use Task.async/1 to spawn the new process and Task.await/1 to block until\
    \ the call to the weather API is done. We’re really forcing the code to use another\
    \ process since it doesn’t make sense in this particular case to call the API\

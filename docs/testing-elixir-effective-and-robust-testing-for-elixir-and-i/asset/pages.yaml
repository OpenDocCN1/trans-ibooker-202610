    Bypass.expect_once/4 expects the specified request to be issued exactly once.
    The function passed to it takes a conn data structure (a Plug.Conn struct) that
    we can use to make assertions and to send a response. As you can see, this API
    is similar to what Mox provides and allows us to have fine-grained control over
    the test server and set different expectations in each test.


    This “real requests” approach has the advantage of letting us send as many real
    HTTP requests as we want during testing so that we can exercise the code that
    interfaces with the real HTTP API as well as the HTTP client we’re using. However,
    this approach has a disadvantage as well. When building the test server and setting
    request expectations, we’re effectively copying what the third-party API does,
    and by doing so we’re tying ourselves to a specific behaviour of that API. If
    the weather API were to change and we were only relying on test-server-based tests,
    we wouldn’t notice the change when running the test suite. This is important to
    keep in mind, as there’s no clear and straightforward solution for this problem.
    The only way around it is to periodically check that the weather API still behaves
    in the same way as the test server. We can do that either manually or by running

  md: 'reasons to do it and then follow up with the arguments often made against it.


    Randomizing your incidental data has a couple of benefits. If you’re reading an
    existing test and you see that data is being randomized, it can be a very quick
    indicator that the data is incidental. This will help you to reason about behavior
    of the code under test from the test itself.


    If you write your code before your tests, it’s entirely possible to accidentally
    have hard-coded values present. Normally your tests would help you find this mistake;
    but if you just wrote the code, that hard-coded value might be fresh in your memory
    and you could use the same value in your test. This will result in a false sense
    of security that your code under test is behaving correctly, though it’s actually
    quite broken. This is another case where randomized data would help.


    Randomizing your incidental test data has potential risks as well. People who
    are opposed to randomizing often cite examples where the random values actually
    cause issues that can be hard to replicate. An example that we’ve seen is a test
    that selected a random time zone for a timestamp in the test, with the code under
    test converting between time zones. As it turned out, our test would occasionally
    pick a time zone that was offset from UTC by half an hour. The code under test
    couldn’t handle anything that wasn’t offset by complete hours. Given that the
    application only needed to serve time zones that were offset by whole hours, it
    could be viewed that the random failures were an issue with the test and not the
    code.


    The problem was that it took some debugging time to understand why the test was
    failing in the first place. Fortunately, ExUnit provides the ability to pass the
    seed for randomization to the test run. If the seed reported in the output of
    a failed test run is 654321, you can replicate the test run by passing the flag
    `--seed 654321` when you run `mix test`. Combined with some additional test output
    (`IO.inspect/1` calls), we were able to identify the problem. But if we’d written
    the test with a known'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'valid value in the first place, we never would’ve lost time on this issue,
    and our code still would’ve operated as intended.


    Remember that if you’re ever intentionally trying to find values that will break
    your code, property-based testing is the correct solution. Randomizing your test
    inputs finds specific value dependencies in your code, but it won’t help you guarantee
    that your code works for a wide variety of inputs in a single test run.


    Having good failure output from your tests and being able to pass a random seed
    can help reduce issues like this, but the more asynchronous your test runs are,
    the more likely that you can’t replicate a previous test run exactly.


    Whether you prefer to randomize your incidental data is up to you. But either
    way, understanding the difference between essential and incidental data will help
    you design your tests in a thoughtful and intentional way.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# Appendix 2


    # Test Life Cycle


    Once you get familiar with ExUnit as the tool you use to write Elixir tests, you’ll
    probably want to have a deeper understanding of the exact life cycle of a test
    and of your whole test suite. In this appendix, we’ll look at how ExUnit executes
    your test suite, including setup, running tests, and teardown. We’ll also learn
    about how tests, setup callbacks, and teardown callbacks relate to *processes*,
    that is, what the “process architecture” of an ExUnit test suite is.


    This knowledge isn’t only useful to improve your understanding of ExUnit as a
    tool. At some point, you’ll likely need to come up with unconventional strategies
    in order to test particular pieces of code (for a number of possible reasons).
    In those cases, it’s important to know which process your test code is running
    on, which steps in the testing suite are blocking and which are asynchronous,
    and which test processes are linked between each other.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# The Life Cycle of an ExUnit Suite


    When you run mix test, Mix is essentially compiling your project, loading all
    the files ending in _test.exs from the test directory of your project and then
    running test/test_helper.exs. Mix is taking care of starting the ExUnit suite
    for you. However, there’s no magic involved.


    What Mix executes is a single call to ExUnit.start/1 that Mix itself includes
    in all test/test_helper.exs files, which typically look like the snippet below:


    ```

    ExUnit.start()

    ```


    The documentation for ExUnit.start/1 does a good job at summing up the role of
    this function:[55]


    > Starts ExUnit and automatically runs tests right before the VM terminates.


    ExUnit.start/1 relies on System.at_exit/1 to actually run the whole test suite
    right before shutting down the virtual machine. This gives you a chance to load
    everything you need and compile every test case module before running any tests.
    That’s all Mix is doing when you run mix test.


    If you want to run the test suite “on demand” and not before shutting down the
    VM, you can use ExUnit.run/0. It’s what ExUnit.start/1 also uses under the hood,
    after all. However, you’ll need to somehow start the :ex_unit application before
    running ExUnit.run/0. A common way of doing this is to call ExUnit.start/1 with
    the autorun: false option, which tells ExUnit to not run the test suite before
    shutting down the VM. A possible example of manually running the test suite is
    included below:'
  merge: -1
  img_proc: true
- pgno: 350
  md: "```\n```elixir\nExUnit.start(autorun: false)\n\nIO.puts(\"About to run the\
    \ test suite!\")\n\nresult = ExUnit.run()\n\nIO.puts(\"The test suite finished\
    \ running.\")\nIO.puts(\"The result is: #{inspect(result)}\")\n```\n```\n\nTo\
    \ run some code after your ExUnit suite finishes running, you can use the ExUnit.after_suite/1\
    \ callback available since Elixir 1.8. Before Elixir 1.8, you would’ve used System.at_exit/1\
    \ directly, but ExUnit.after_suite/1 gives you handy additional information about\
    \ the results of the suite itself. ExUnit.after_suite/1 takes a callback function\
    \ and runs that function when the suite finishes executing. The callback function\
    \ must take one argument, a map that contains non-negative integers representing\
    \ the numbers of different categories of tests in the suite.\n\n```\n```elixir\n\
    %{\n  excluded: 2,\n  failures: 1,\n  skipped: 0,\n  total: 84\n}\n```\n```\n\n\
    You can call ExUnit.after_suite/1 as many times as you want. All callbacks that\
    \ you register will be executed, in reverse order to how you registered them,\
    \ at the end of the test suite. All the callbacks are executed sequentially in\
    \ the same process that calls ExUnit.run/0. If you use ExUnit.start/1, all the\
    \ callbacks are going to be executed in the separate process that System.at_exit/1\
    \ creates to execute its callback.\n\nExUnit.after_suite/1 is useful for different\
    \ things, but we found it most useful for any sort of teardown or notification.\
    \ You can use some Internet of Things magic to make a smart light in your house\
    \ turn red"
  merge: -1
  img_proc: true
- pgno: 351
  md: 'if there are any failures in the suite. You can use it to delete all the temporary
    directories you set up in your tests. Your imagination is the limit.


    We looked at code and callbacks related to the ExUnit suite as a whole. Let’s
    move on and learn how *cases* are executed.'

  md: "> and with, two built-in constructs in Elixir that use the same syntax, can\
    \ avoid this trick because they're special forms that are handled directly at\
    \ the language level. With this trick we can have a syntax that looks like for\
    \ and with, but without having to change the compiler or the runtime of Elixir.\
    \ Awesome, right?\n\nstream_data also provides a syntax similar to check all to\
    \ create generators. We'll look at that in the next section.\n\n# The Gen All\
    \ Macro\n\nWriting new generators by composing other generators with functions\
    \ like bind/2 works fine, but for complex generators the syntax can become a bit\
    \ convoluted. For this reason, stream_data provides a gen all macro. This macro\
    \ looks exactly like check all, but it creates a generator instead. The values\
    \ produced by the generator are whatever is returned from the block passed to\
    \ gen all. Let's see an example of how to use this macro to generate an email,\
    \ starting from a random alphanumeric username and a random domain chosen from\
    \ a list of domains.\n\n```\nproperty_based_testing/misc/email_generator_gen_all.exs\n\
    \ndomains = [\"gmail.com\", \"yahoo.com\", \"icloud.com\", \"hotmail.com\"]\n\n\
    email_generator =\n  gen all username <- string(:alphanumeric),\n    domain <-\
    \ member_of(domains) do\n  username <> \"@\" <> domain\nend\n```\n\nAs you can\
    \ see, the <- clauses are used to take values out of generators, exactly like\
    \ in check all. The generated value is the content of the do/end block, in our\
    \ case the concatenated strings that make up the email."

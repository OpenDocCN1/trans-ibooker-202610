    The truth is, the more intertwined and complex the code gets and the more it interacts
    with complex parts of the world (like the host machine, or *time itself* when
    talking about periodic actions), the harder it gets to have control over those
    parts of the world and make testing clean. The good news is that there are some
    workarounds to these problems. The bad news is that they aren’t always nice and
    tidy.



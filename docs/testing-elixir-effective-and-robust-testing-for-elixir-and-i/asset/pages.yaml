- pgno: 240
  md: "through all the values that we’re expecting and check that the same value is\
    \ present in the database (and the returned User schema).\n\nWe have another layer\
    \ of thoroughness in this test that we should discuss. We’re checking that the\
    \ two timestamps, :inserted_at and :updated_at, are the same, and we’re checking\
    \ that they’re newer than the time the test started. Line 13 grabs a timestamp\
    \ from before the test exercises the code, and then line 37 compares the timestamps\
    \ to the pre-exercise time. Updating the values for the timestamps is the default\
    \ behavior of the Ecto code. As long as your code is using Ecto.Repo’s functions,\
    \ this just happens. Additionally, the only built-in function to compare datetimes\
    \ has a pretty awkward API. It’s your call, but this might be a place where you\
    \ can feel comfortable skipping a validation.\n\nAside from the assertions on\
    \ the timestamps, the assertions in this test probably feel a whole lot like the\
    \ assertions we made in the testing for the schema itself. While it’s very similar,\
    \ it’s not the same, so don’t skip out on one or the other. The schema tests are\
    \ making sure that the schema's changeset function handles “correct” data, but\
    \ it does nothing to cover whether or not that “correct” data is valid against\
    \ the database table definition itself, whereas successfully inserting it does\
    \ prove that. Why not skip the schema testing then? A schema changeset function\
    \ can be used by multiple queries, sometimes even in different files. One of the\
    \ nice things about having a well-tested schema is that when we test code that’s\
    \ using the schema, we don’t need to write exhaustive tests for all of the error\
    \ cases. The tests for the schema cover that. So, for testing a function like\
    \ our create/1, we only need a single success test and a single error test. We’ll\
    \ write that error test next.\n\nAdd a new test into your existing describe block\
    \ for a failure:\n\n```\ntest \"error: returns an error tuple when user can't\
    \ be created\" do\n  missing_params = %{}\n\n```"

- pgno: 116
  md: 'If you want tight control over how the third-party API should behave, then
    building a test server is the way to go. This lets you test different responses
    from the API and gives you flexibility. However, the trade-off is that you have
    to build the test server and then keep it up to date with the real API.


    If you want to mimic the API perfectly and use one of the supported HTTP clients,
    then ExVCR is a good alternative. The trade-off is that you have to keep cassettes
    up to date, but that’s something that you can only avoid by going with the real
    requests approach anyway.


    # Testing Non-HTTP Services


    In the previous sections, we mostly talked about testing HTTP-based third-party
    services. We explored how to build doubles for those services and then how to
    test the interaction with the actual services. The concepts we discussed mostly
    apply to non-HTTP services as well. If you’re talking with a service that exposes
    a binary protocol, for example, you can build an interface (with a behaviour)
    that specifies how to interact with the service. Then you can use dependency doubles
    to test components that talk to the service through the interface. However, testing
    the actual interaction with a service that doesn’t expose an HTTP interface is
    a bit more complex because fewer tools are available. If you want to build a test
    server, you’ll often have to implement that yourself on top of lower-level protocols
    like TCP. If you want cassettes, you’ll have to implement all of the infrastructure
    needed for them yourself because there isn’t an ExVCR counterpart for protocols
    other than HTTP.


    Luckily, most third-party services provide HTTP APIs. Usually, the external systems
    that do not provide HTTP APIs are the ones we have control over, such as databases
    or message queues.


    Now that we have a good mental image of how to test external services, let’s quickly
    discuss end-to-end tests.'

- pgno: 50
  md: 'Once you’ve got the code in, run mix test to make sure that your tests are
    passing.


    Before we talk about the list comprehension, let’s look at the data that we’re
    passing into the function at the exercise step. It’s a hand-coded map. Now that
    we’ve tested that our code handles correctly shaped data by passing a real response,
    we can trust that if we pass in correctly shaped data, the code will work fine.
    The payload has been distilled to the parts that our code cares about: a map with
    “dt” and “weather” keys, with the ID nested in a list of maps under the “weather”
    key. Keeping the input payload so small will help us keep our tests easier to
    understand. Additionally, because we’re defining the values inside our test file
    (and inside the test in this case), we’re safe to make assertions on specific
    values without worrying about hard-to-maintain tests.


    The list comprehension actually adds three new tests, one for each kind of weather
    condition that we’re interested in: thunderstorms, drizzle, and rain. List comprehensions
    are useful when you have nearly identical tests but want your errors separated.
    You’ll see that we had to use unquote,[11] a metaprogramming macro, to have access
    to the information inside the test. This can be especially confusing since it’s
    not inside of a quote block, but it works and it’s the only piece of metaprogramming
    we’ll introduce in this book. You’ll need to have a way to provide a unique test
    name for each iteration, like the way we’re using the condition in the test name.
    If any of these tests fail, the output from ExUnit will tell you which test it
    is, making it easier to hunt down the issue.


    > » 1) test parse_response/1 success: recognizes drizzle as a rainy condition

    > (SoggyWaffle.WeatherAPI.ResponseParserTest)

    > test/soggy_waffle/weather_api/response_parser_test.exs:32


    # Writing Custom Test Failure Messages'

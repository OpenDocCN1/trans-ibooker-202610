  md: "# Appendix 1\n\n# When To Randomize Test Data\n\nMany of the test examples\
    \ in this book show the use of randomized test data. This is a topic where experienced\
    \ software developers have differing opinions. We’re adding this appendix to help\
    \ you understand when it’s safe to use randomized data and to give you enough\
    \ background to help you decide if you’ll take that approach.\n\nWhen setting\
    \ up data for a test, the values can fall into two categories: essential data\
    \ and incidental data. Explaining the difference is easier if we start with incidental\
    \ data. Data is incidental if it should have no impact on the behavior of your\
    \ code under test. In Chapter 1, Unit Tests, we used this example:\n\n```\nwhen_to_randomize_data/soggy_waffle.ex\n\
    \n1: defmodule SoggyWaffle do\n  - alias SoggyWaffle.WeatherAPI\n  - \n  - def\
    \ rain?(city, datetime, weather_fn \\\\ &WeatherAPI.get_forecast/1) do\n5:   with\
    \ {:ok, response} <- weather_fn.(city) do\n  -   {:ok, weather_data} =\n  -  \
    \   SoggyWaffle.WeatherAPI.ResponseParser.parse_response(response)\n  - \n  -\
    \   SoggyWaffle.Weather.imminent_rain?(weather_data, datetime)\n  end\n10:\n \
    \ - end\n  - end\n```"
  merge: -1
  img_proc: true

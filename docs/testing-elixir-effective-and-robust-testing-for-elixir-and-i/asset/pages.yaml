  md: "An alternative to injecting a whole function is to pass in a single value.\
    \ An example you might see in code is when the outside dependency is the system\
    \ time. If your code under test needs to do something with system time, it’s very\
    \ difficult for your tests to assert a known response or value unless you can\
    \ control system time. While controlling your code’s concept of system time is\
    \ easy in some languages, it isn’t in Elixir. That makes this scenario a perfect\
    \ candidate for injecting a single value. The following code allows for an injected\
    \ value, but it defaults to the result of a function call if no parameter is passed:\n\
    \n```\nunit_tests/soggy_waffle/lib/soggy_waffle/weather.ex\n\n1: defmodule SoggyWaffle.Weather\
    \ do\n   @type t :: %__MODULE__{}\n   defstruct [:datetime, :rain?]\n5: @spec\
    \ imminent_rain?([t()], DateTime.t()) :: boolean()\n   def imminent_rain?(weather_data,\
    \ now \\\\ DateTime.utc_now()) do\n     Enum.any?(weather_data, fn\n       %__MODULE__{rain?:\
    \ true} = weather ->\n         in_next_4_hours?(now, weather.datetime)\n10:\n\
    \       _ ->\n         false\n     end)\n   end\n15:\n   defp in_next_4_hours?(now,\
    \ weather_datetime) do\n     four_hours_from_now =\n       DateTime.add(now, _4_hours_in_seconds\
    \ = 4 * 60 * 60)\n20:\n     DateTime.compare(weather_datetime, now) in [:gt, :eq]\
    \ and\n       DateTime.compare(weather_datetime, four_hours_from_now) in [:lt,\
    \ :eq]\n```"
  merge: -1
  img_proc: true
- pgno: 68
  md: "+   - end\n+   - end\n\nLooking at our function signature in line 7, we can\
    \ see that without a value passed in, the result of DateTime.utc_now/0 will be\
    \ bound to the variable datetime. Our tests will pass a value in, overriding the\
    \ default, but the code will use the current time when running in production.\
    \ By allowing our function to take a known time, we can remove the unknown. When\
    \ running in production, your code will never be passed another value, but testing\
    \ it just got a lot easier. Our tests can now create a controlled environment\
    \ in which to test our code.\n\n```\nunit_tests/soggy_waffle_examples/test/soggy_waffle/weather_test.exs\n\
    \n1: defmodule SoggyWaffle.WeatherTest do\n  - use ExUnit.Case\n  - alias SoggyWaffle.Weather\n\
    \  -\n5: describe \"imminent_rain?/2\" do\n  - test \"returns true when it will\
    \ rain in the future\" do\n  - now = datetime_struct(hour: 0, minute: 0, second:\
    \ 0)\n  - one_second_from_now = datetime_struct(hour: 0, minute: 0, second: 1)\n\
    \  -\n    weather_data = [weather_struct(one_second_from_now, :rain)]\n10:\n \
    \ -\n  - assert Weather.imminent_rain?(weather_data, now) == true\n  - end\n```\n\
    \nOur code under test is all time-based, with “the future” being very important.\
    \ By passing in a value, we’re able to strictly control the conditions in which\
    \ our code is executed, isolating our code under test from its dependency, system\
    \ time (via DateTime.utc_now/0). This is especially important because we need\
    \ alignment between “now,” when the code is executing, and the time in the weather\
    \ data passed into the function."

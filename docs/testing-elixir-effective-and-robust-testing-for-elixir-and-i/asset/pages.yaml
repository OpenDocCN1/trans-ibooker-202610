- pgno: 29
  md: '# Testing with ExUnit


    From the beginning, Elixir was developed with ExUnit, the test framework, as part
    of the core library. As a result, most of the test tooling we’ve come to utilize
    in our production applications is straight out of the Elixir core. This means
    that if you have Elixir and you’re familiar with what’s available, you can write
    effective tests without needing to bring in other libraries.


    To learn how to use ExUnit, we’re going to start by writing our first test and
    then discuss some test theory, specifically the stages of testing. We’ll look
    at how to organize test files and then explore using common Elixir to help maximize
    the effectiveness of our tests. Finally, we’ll cover how to design code so that
    it’s well organized and easy to test.


    # Our First Test


    Let’s write our first test in our rain alert app, Soggy Waffle. Soggy Waffle makes
    calls to an API and gets data back from it. It then standardizes the data to its
    own terms and data structures for the rest of the application to use. While those
    calls out to the API aren’t something we’ll focus on in this chapter (but will
    in Chapter 2, Integration and End-to-End Tests), the response transformation is
    a great example of code that can be tested in isolation. Let’s look at the code
    that we’ll be testing.


    We have included a copy of Soggy Waffle in the code with this book. Most of the
    application files we’ll show in this chapter are from that code. The example test
    files in Soggy Waffle have the extension .bak.exs so that they won’t run when
    you run your tests, but they’re there for reference. If you want to code along
    with the examples, you should do so inside of the provided Soggy Waffle application,
    adding test files in the locations we indicate before the examples.'
  merge: -1
  img_proc: true

  md: "```\n```elixir\nassert String.contains?(concatenate, right)\nend\nend\n```\n\
    ```\n\nThis is a good property for String.contains?/2 to hold. However, if this\
    \ is the only kind of testing that we’re doing on String.contains?/2, it means\
    \ we can implement String.contains?/2 as a function that always returns true.\n\
    \n```\n```elixir\ndef contains?(_string, _substring), do: true\n```\n```\n\nThis\
    \ obviously wrong implementation still passes our property. For this reason, it’s\
    \ important that we still have unit or integration tests that actually verify\
    \ that our code works as we expect for some given inputs. Having tests alongside\
    \ properties is also useful for testing known corner cases of our code, because\
    \ those problematic inputs might not always be produced by the generators. In\
    \ the String.contains?/2 example, we’d probably have a test like the one below\
    \ alongside our property:\n\nproperty_based_testing/misc/property_and_example_test.exs\n\
    \n```\n```elixir\ntest \"String.contains?/2 works on known inputs\" do\n  assert\
    \ String.contains?(\"foobar\", \"foo\")\n  assert String.contains?(\"foobar\"\
    , \"bar\")\n  assert String.contains?(\"foobar\", \"ob\")\n  refute String.contains?(\"\
    foobar\", \"baz\")\nend\n```\n```\n\nThis test makes the dummy implementationation\
    \ that always returns true fail right away. The combination of properties and\
    \ example-based tests is powerful: the properties assert that our code holds invariants,\
    \ while example-based tests verify that our code works for a few known (and corner)\
    \ cases. This can give us a high confidence in the correctness of the code.\n\n\
    In general, property-based testing is not a tool that can usually replace example-based\
    \ testing. Instead, it’s a tool that can complement example-based testing. When\
    \ it makes sense and when coming up with properties isn’t too hard, then property-based\
    \ testing can make it"

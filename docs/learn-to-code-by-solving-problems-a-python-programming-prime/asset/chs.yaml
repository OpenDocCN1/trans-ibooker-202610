  \ 问题 coci18c2p1 (Preokret) 和 DMOJ 问题 ccc00s2 (Babbling Brooks)。\n\n## 注释\n\nCard\
  \ Game 最初来自 1999 年加拿大计算竞赛。Action Figures 最初来自 2019 年乌拉尔学校编程竞赛。\n\n许多现代编程语言，包括 Python，都支持两种不同的编程范式。一种基于函数；这就是本章所研究的。另一种基于对象，导致了被称为面向对象编程\
  \ (OOP) 的范式。OOP 涉及定义新类型并为这些类型编写方法。我们在全书中都使用 Python 类型（如整数和字符串），但我们不会进一步讨论 OOP。有关\
  \ OOP 的介绍以及 OOP 在实践中的案例研究，我推荐 Eric Matthes 所著的《Python Crash Course, 2nd edition》\
  \ (No Starch Press, 2019)。\n\n## 读写文件\n\n![](img/3e15323aee4cec3bf673834bfafe8024_220_0.png)\n\
  \n到目前为止，我们一直使用 input 函数读取所有输入，并使用 print 函数写入所有输出。这些函数分别从标准输入（默认为键盘）和标准输出（默认为屏幕）读取和写入。虽然我们可以使用输入和输出重定向来更改这些默认值，但有时程序需要对其文件有更多的控制。例如，你的文字处理器允许你打开任意文档文件并以任意名称保存文件，而无需你处理标准输入和标准输出。\n\
  \n在本章中，我们将学习如何编写操作文本文件的程序。我们将使用文件解决两个问题：正确格式化一篇论文和为喂养奶牛播种农场。\n\n## 问题 #16：论文格式化\n\
  \n这个问题与我们到目前为止解决的所有问题有一个重要的区别：它要求我们从特定文件读取并向特定文件写入！在阅读问题描述时请注意这一点。\n\n这是 USACO 2020\
  \ 年 1 月青铜赛问题 Word Processor。这是本书中来自 USACO (USA Computing Olympiad) 评测的第一道题。要找到该问题，请前往\
  \ *http://usaco.org/*，点击 **Contests**，点击 **2020 January Contest Results**，然后点击 Word\
  \ Processor 下的 **View problem**。\n\n## 挑战\n\n奶牛 Bessie 正在写一篇论文。论文中的每个单词只包含小写或大写字符。她的老师指定了每行最多可以出现的字符数，不计空格。为了满足这一要求，Bessie\
  \ 按以下规则写下论文中的单词：\n\n-   - 如果下一个单词能放入当前行，则将其添加到当前行。行上每对单词之间包含一个空格。\n-   - 否则，将此单词放在新行；此行成为新的当前行。\n\
  \n输出论文中每行的正确单词。\n\n## 输入\n\n从名为 word.in 的文件读取输入。\n\n输入包含两行。\n\n-   - 第一行包含两个由空格分隔的整数。第一个整数\
  \ n 是论文中的单词数；它在 1 到 100 之间。第二个整数 k 是每行最多可以出现的字符数（不计空格）；它在 1 到 80 之间。\n-   - 第二行包含\
  \ n 个单词，每对单词之间有一个空格。每个单词最多有 k 个字符。\n\n## 输出\n\n将输出写入名为 word.out 的文件。\n\n输出正确格式化的论文。\n\
  \n## 使用文件\n\n论文格式化问题要求我们从文件 word.in 读取并向文件 word.out 写入。但在我们能做到这些之前，我们需要学习如何在程序中打开文件。\n\
  \n## 打开文件\n\n使用你的文本编辑器，创建一个名为 word.in 的新文件。将其放在你一直用于 .py Python 程序的同一目录中。\n\n这是我们第一次创建不以\
  \ .py 结尾的文件。相反，它以 .in 结尾。确保文件名为 word.in，而不是 word.py。in 是 input 的缩写；你会经常看到它用于包含程序输入的文件。\n\
  \n在该文件中，让我们放置论文格式化问题的有效输入。输入以下内容到文件中：\n\n```\n12 13  \nperhaps better poetry will\
  \ be written in the language of digital computers\n```\n\n保存文件。\n\n要在 Python 中打开文件，我们使用\
  \ open 函数。我们传递两个参数：第一个是文件名，第二个是打开文件的模式。模式决定了我们如何与文件交互。\n\n这是我们如何打开 word.in 的示例：\n\
  \n```\n>>> open('word.in', 'r')\n<_io.TextIOWrapper name='word.in' mode='r' encoding='cp1252'>\n\
  ```\n\n在此函数调用中，我们提供了 'r' 模式。r 代表 \"read\"，打开文件以便从中读取。模式碰巧是一个可选参数，其默认值为 'r'，因此如果我们愿意可以省略它。但我将在全书中为保持一致性而明确包含\
  \ 'r'。\n\n当我们使用 open 时，Python 会给我们一些关于文件如何被打开的信息 ❶。例如，它会确认文件名和模式。关于编码的部分表示文件如何从磁盘上的状态解码为我们可以读取的形式。文件可以使用多种编码进行编码，但在本书中我们不需要担心编码。\n\
  \n如果我们尝试打开一个不存在的文件进行读取，我们会得到一个错误：\n\n```\n>>> open('blah.in', 'r')\nTraceback (most\
  \ recent call last):\n  File \"<stdin>\", line 1, in <module>\nFileNotFoundError:\
  \ [Errno 2] No such file or directory: 'blah.in'\n```\n\n如果你在打开 word.in 时遇到此错误，请仔细检查文件是否命名正确并且位于你启动\
  \ Python 的目录中。\n\n除了用于读取的 'r' 模式外，还有用于写入的 'w' 模式。如果我们使用 'w'，那么我们就是打开文件以便在其中写入文本。\n\
  \n请注意 'w' 模式。如果使用 'w' 打开已存在的文件，该文件的内容将被删除。我刚刚不小心用它删除了我的 word.in 文件。没什么大不了的，因为很容易重新创建。但如果我们不小心覆盖了重要文件，就不会有人高兴。\n\
  \n如果你使用 'w' 且文件名不存在，它会创建一个空文件。\n\n让我们使用 'w' 模式创建一个名为 blah.in 的空文件：\n\n```\n```python\n\
  >>> open('blah.in', 'w')\n<_io.TextIOWrapper name='blah.in' mode='w' encoding='cp1252'>\n\
  ```\n```\n\n现在 blah.in 存在了，我们可以不报错地打开它进行读取：\n\n```\n```python\n>>> open('blah.in',\
  \ 'r')\n<_io.TextIOWrapper name='blah.in' mode='r' encoding='cp1252'>\n```\n```\n\
  \n那我们一直看到的 _io.TextIOWrapper 是什么？那是我们 open 返回的值的类型：\n\n```\n```python\n>>> type(open('word.in',\
  \ 'r'))\n<class '_io.TextIOWrapper'>\n```\n```\n\n把这个类型看作文件类型。它的值代表打开的文件，你很快就会看到它具有我们可以调用的方法。\n\
  \n与任何函数一样，如果我们不将 open 的返回值赋给变量，那么它的返回值就会丢失。我们到目前为止调用 open 的方式并不能让我们引用已打开的文件！\n\n\
  这是我们如何让变量引用打开文件的方式：\n\n```\n```python\n>>> input_file = open('word.in', 'r')\n>>>\
  \ input_file\n<_io.TextIOWrapper name='word.in' mode='r' encoding='cp1252'>\n```\n\
  ```\n\n我们将能够使用 input_file 从 'word.in' 读取。\n\n在解决论文格式化问题时，我们还需要一种方法来写入文件 'word.out'。以下变量将帮助我们做到这一点：\n\
  \n\n\n```python\n>>> output_file = open('word.out', 'w')\n>>> output_file\n<_io.TextIOWrapper\
  \ name='word.out' mode='w' encoding='cp1252'>\n```\n\n## 从文件读取\n\n要从打开的文件中读取一行，我们使用文件对象的\
  \ `readline` 方法。该方法返回一个包含文件下一行内容的字符串。就这一点而言，它与 `input` 函数类似。然而，与 `input` 不同，`readline`\
  \ 是从文件读取而不是从标准输入读取。\n\n让我们打开 `word.in` 并读取它的两行：\n\n```python\n>>> input_file = open('word.in',\
  \ 'r')\n>>> input_file.readline()\n'12 13\\n'\n>>> input_file.readline()\n'perhaps\
  \ better poetry will be written in the language of digital computers\\n'\n```\n\n\
  这里令人意外的是每个字符串末尾的 `\\n`。我们在使用 `input` 读取一行时肯定没有看到那个。字符串中的 `\\` 符号是一个 *转义字符*。它跳出字符的标准解释并改变其含义。我们不会把\
  \ `\\n` 当作两个独立的字符 `\\` 和 `n` 来处理。相反，`\\n` 只是一个字符：换行符。文件中所有行，或许除了最后一行，都以换行符结束。如果没有的话，一切都会在一行上！`readline`\
  \ 方法字面地给了我们整行，包括其终止的换行符。\n\n下面是如何在我们自己的字符串中嵌入换行符：\n\n```python\n>>> 'one\\ntwo\\\
  nthree'\n'one\\ntwo\\nthree'\n>>> print('one\\ntwo\\nthree')\none\ntwo\nthree\n\
  ```\n\nPython shell 不会处理转义字符的效果，但 `print` 会。\n\n`\\n` 序列在字符串中很有用，因为它帮助我们添加多行。但我们很少希望从文件中读取的行中保留这些换行符。为了去掉它们，我们可以使用字符串\
  \ `rstrip` 方法。此方法与 `strip` 类似，只是它仅从字符串右侧移除空白（而不是左侧）。就它而言，换行符与空格一样是空白：\n\n```python\n\
  >>> 'hello\\nthere\\n\\n'\n'hello\\nthere\\n\\n'\n>>> 'hello\\nthere\\n\\n'.rstrip()\n\
  'hello\\nthere'\n```\n\n让我们再次从文件中读取，这次去掉换行符：\n\n```python\n>>> input_file = open('word.in',\
  \ 'r')\n>>> input_file.readline().rstrip()\n'12 13'\n>>> input_file.readline().rstrip()\n\
  'perhaps better poetry will be written in the language of digital computers'\n```\n\
  \n此时，我们已经读取了两行，所以文件里没有东西可读了。`readline` 方法通过返回一个空字符串来表示这一点。\n\n```python\n>>> input_file.readline().rstrip()\n\
  ''\n```\n\n空字符串意味着我们已到达文件末尾。如果我们想再次读取行，必须重新打开文件以从开头开始。\n\n让我们这样做，这次使用变量保存每一行：\n\n\
  ```python\n>>> input_file = open('word.in', 'r')\n>>> first = input_file.readline().rstrip()\n\
  >>> second = input_file.readline().rstrip()\n>>> first\n'12 13'\n>>> second\n'perhaps\
  \ better poetry will be written in the language of digital computers'\n```\n\n如果我们需要读取文件中的所有行，无论有多少行，我们可以使用\
  \ `for` 循环。Python 中的文件充当行序列，因此我们可以像遍历字符串和列表一样遍历它们：\n\n```python\n>>> input_file\
  \ = open('word.in', 'r')\n>>> for line in input_file:\n...     print(line.rstrip())\n\
  ...\n```\n\n不过，与字符串或列表不同，我们不能第二次遍历文件，因为第一次遍历会把我们带到文件末尾。如果我们尝试，就什么也得不到：\n\n```python\n\
  >>> for line in input_file:\n...   print(line.rstrip())\n...\n```\n\n### 概念检查\n\n\
  我们想使用 `while` 循环输出打开文件 `input_file` 的每一行。 （该文件可以是任意文件；我没有假设它与论文格式有关。）以下哪段代码能正确做到这一点？\n\
  \n**A.**\n\n```python\nwhile input_file.readline() != \"\":\n    print(input_file.readline().rstrip())\n\
  ```\n\n**B.**\n\n```python\nline = 'x'\nwhile line != \"\":\n    line = input_file.readline()\n\
  \    print(line.rstrip())\n```\n\n**C.**\n\n```python\nline = input_file.readline()\n\
  while line != \"\":\n    line = input_file.readline()\n    print(line.rstrip())\n\
  ```\n\n- D. 以上全部\n- E. 以上皆非\n\n在查看答案之前，我鼓励你创建一个包含四到五行内容的文件并在该文件上尝试每段代码。你也可以考虑在输出的每一行开头添加一个字符如\
  \ `*`，以便能看到否则为空的空白行。\n\n**答案：** E. 每段代码都有细微的错误。\n\n代码 A 只输出文件的每隔一行。例如，`while` 循环的布尔表达式导致第一行被读取……然后丢失，因为它没有被赋给变量。因此循环的第一次迭代输出的是文件的第二行。\n\
  \n代码 B 非常接近正确。它输出文件的全部行，但也在末尾输出了一行多余的空白行。\n\n代码 C 未打印文件的第一行。那是因为第一行在循环之前被读取，但循环随后读取第二行而没有打印第一行。它也像代码\
  \ B 一样在末尾产生了一行多余的空白行。\n\n下面是正确读取并打印每一行的代码：\n\n```python\nline = input_file.readline()\n\
  while line != \"\":\n    print(line.rstrip())\n    line = input_file.readline()\n\
  ```\n\n## 写入文件\n\n要向打开的文件写入一行，我们使用文件对象的 `write` 方法。我们传递一个字符串，该字符串会被添加到文件末尾。\n\n\
  为了解决论文格式问题，我们将写入 `word.out`。我们还不准备解决那个问题，所以让我们改写到 `blah.out`。下面是如何向该文件写入一行的示例：\n\
  \n```python\n>>> output_file = open('blah.out', 'w')\n>>> output_file.write('hello')\n\
  5\n```\n\n这里的 5 是做什么的？`write` 方法返回写入的字符数。这是一个很好的确认，表明我们写入了预期数量的文本。\n\n如果你在文本编辑器中打开\
  \ `blah.out`，你应该在其中看到文本 `hello`。\n\n让我们尝试向文件写入三行。开始：\n\n```python\n>>> output_file\
  \ = open('blah.out', 'w')\n>>> output_file.write('sq')\n2\n>>> output_file.write('ui')\n\
  2\n>>> output_file.write('sh')\n2\n```\n\n根据我迄今为止告诉你的内容，你可能会期望 `blah.out` 看起来像这样：\n\
  \n```text\nsq\nui\nsh\n```\n\n但如果你在文本编辑器中打开 `blah.out`，你应该会看到以下内容：\n\n```text\n\
  squish\n```\n\n字符之所以在一行上，是因为 `write` 不会为我们添加换行符！如果我们想要单独的行，我们需要明确指定，像这样：\n\n```python\n\
  >>> output_file = open('blah.out', 'w')\n>>> output_file.write('sq\\n')\n3\n>>>\
  \ output_file.write('ui\\n')\n3\n>>> output_file.write('sh\\n')\n3\n```\n\n注意在每种情况下\
  \ `write` 都写入了三个字符，而不是两个。换行符算作一个字符。现在如果你打开 `blah.out`，你应该会看到文本分布在三行上：\n\n与 `print`\
  \ 不同，`write` 仅在你用字符串调用它时才有效。要向文件写入数字，先将其转换为字符串：\n\n```python\n>>> num = 7788\n>>>\
  \ output_file = open('blah.out', 'w')\n>>> output_file.write(str(num) + '\\n')\n\
  5\n```\n\n## 关闭文件\n\n完成后关闭文件是良好的实践。它向代码的阅读者表明文件不再被使用。\n\n关闭文件也有助于操作系统管理计算机的资源。当你使用\
  \ `write` 方法时，你写入的内容可能不会立即进入文件。相反，Python 或操作系统可能会等待积累一批写入请求，然后一次性写入。关闭你写入的文件可保证你写入文件的内容已安全存储在文件中。\n\
  \n要关闭文件，调用其 `close` 方法。下面是打开文件、读取一行并关闭它的示例：\n\n```python\n>>> input_file = open('word.in',\
  \ 'r')\n>>> input_file.readline()\n'12 13\\n'\n>>> input_file.close()\n```\n\n一旦你关闭了文件，就不能再从中读取或写入：\n\
  \n```python\n>>> input_file.readline()\nTraceback (most recent call last):\n  File\
  \ \"<stdin>\", line 1, in <module>\nValueError: I/O operation on closed file.\n\
  ```\n\n## 解决问题\n\n回到论文格式。现在我们知道如何从 `word.in` 读取并写入 `word.out`。这解决了输入和输出要求。\n\n\n\
  \n\n是时候解决这个问题本身了。\n\n让我们先从探索一个测试用例开始，确保我们清楚如何解决这个问题。然后我们会看到代码。\n\n## 探索测试用例\n\n\
  这是我一直在使用的 word.in 文件：\n\n```\n12 13\nperhaps better poetry will be written in the\
  \ language of digital computers\n```\n\n一共有 12 个单词，每行最多可容纳的字符数（不计算空格）为 13。只要单词能放下，我们就应将其添加到当前行；一旦某个单词放不下，我们就用该单词另起一行。\n\
  \n单词 perhaps 包含 7 个字符，所以它可以放在第一行。单词 better 包含 6 个字符。我们也可以把它放在第一行；加上已经放在第一行的 perhaps，目前总共有\
  \ 13 个字符（不包括两个单词之间的空格）。\n\n单词 poetry 放不进第一行，所以我们以 poetry 作为第一个单词另起一行。单词 will 可以放在第二行的\
  \ poetry 后面。类似地，be 可以放在 will 后面。到目前为止，我们有 12 个非空格字符。现在轮到单词 written，而第二行只剩下 1 个字符的空位，所以我们只能以\
  \ written 作为第一个单词再起一行。\n\n按照这个过程一直进行到最后，我们需要写入 word.out 的完整文章如下：\n\n```\nperhaps\
  \ better\npoetry will be\nwritten in the\nlanguage of\ndigital\ncomputers\n```\n\
  \n## 代码\n\n我们的解决方案见清单 7-1。\n\n```\n① input_file = open('word.in', 'r')\n② output_file\
  \ = open('word.out', 'w')\n\n③ lst = input_file.readline().split()\nn = int(lst[0])\
  \  # n not needed\nk = int(lst[1])\nwords = input_file.readline().split()\n\nline\
  \ = \"\"\nchars_on_line = 0\n\nfor word in words:\n    if chars_on_line + len(word)\
  \ <= k:\n        line = line + word + ' '\n        chars_on_line = chars_on_line\
  \ + len(word)\n    else:\n        output_file.write(line[:-1] + '\\n')\n       \
  \ line = word + ' '\n        chars_on_line = len(word)\n\noutput_file.write(line[:-1]\
  \ + '\\n')\n\ninput_file.close()\noutput_file.close()\n```\n\n## 清单 7-1：解决文章格式化问题\n\
  \n首先，我们打开输入文件❶和输出文件❷。注意模式：我们以 'r' 模式（读取）打开输入文件，以 'w' 模式（写入）打开输出文件。我们本可以晚一点再打开输出文件，就在使用它之前打开，但我选择在这里同时打开两个文件，以简化程序结构。类似地，我们本可以在不再需要某个文件时立刻关闭它，但在这本书中，我选择在程序结束时一起关闭所有文件。对于长时间运行且操作多个文件的程序，你可能希望只在需要时才保持文件打开。\n\
  \n接下来，我们读取输入文件的第一行❸。这一行包含两个以空格分隔的整数：n 表示单词数量，k 表示每行允许的最大字符数（不计算空格）。和往常处理空格分隔的值一样，我们使用\
  \ split 来分离它们。然后我们读取第二行，其中包含文章的单词。我们再次使用 split，这次是把单词字符串拆分成一个单词列表。这样输入就处理好了。\n\n\
  两个变量驱动着程序的主要部分：line 和 chars_on_line。line 变量表示当前行；我们一开始让它指向空字符串❹。chars_on_line 变量表示当前行上不计空格的字符数量。\n\
  \n你可能想知道我为什么要维护 chars_on_line。难道我们不能直接用 len(line) 吗？嗯，如果真这么做，我们就会把空格也算进去，而空格并不计入每行允许的字符数。我们可以通过减去空格数来修正这一点；如果你觉得这样比维护\
  \ chars_on_line 变量更直观，我鼓励你自己试试。\n\n现在该遍历所有单词了。对于每个单词，我们必须判断它是放在当前行还是下一行。\n\n如果当前行上的非空格字符数加上当前单词的字符数不超过\
  \ k，那么当前单词可以放在当前行⑤。在这种情况下，我们将该单词加一个空格加到当前行，并更新行上的非空格字符数。\n\n否则，当前单词放不进当前行，当前行就完成了！因此，我们将这一行写入输出文件⑥，并更新\
  \ line 和 chars_on_line 变量，以反映该单词是当前新行上的唯一单词。\n\n关于写入调用⑥，有两点需要注意。第一，[:-1] 切片用于避免我们输出行末最后一个单词后面的空格。第二，你可能以为我会在这里使用\
  \ f-string，像这样：\n\n```\noutput_file.write(f'{line[:-1]}\\n')\n```\n\n然而，在我撰写本文时，USACO\
  \ 评测系统运行的 Python 版本较旧，不支持 f-string。\n\n为什么我们要在循环结束后输出 line⑦？原因是 for 循环的每次迭代都保证会让\
  \ line 中还剩一个或多个尚未输出的单词。考虑一下我们处理的每个单词会发生什么：如果当前单词能放在当前行，我们不会输出任何内容；如果当前单词放不进当前行，我们会输出当前行，但不会输出下一行的那个单词。因此，我们需要在循环结束后把\
  \ line 写入输出文件⑦；否则，文章的最后一行就会丢失。\n\n最后要做的是关闭这两个文件。\n\n向文件而不是屏幕写入的一个恼人之处在于，运行程序时我们看不到输出。要查看输出，我们必须在文本编辑器中打开输出文件。\n\
  \n一块牧场可能是多头奶牛的最爱。但可以保证，一块牧场最多是三头奶牛的最爱。\n\n确定每块牧场应使用的草种类型。每个牧场需要使用 1 到 4 之间的草种类型，而且每头奶牛所喜爱的两块牧场的草种类型必须不同。\n\
  \n## 输入\n\n从名为 revegetate.in 的文件中读取输入。\n\n输入由以下几行组成：\n\n- 一行包含两个以空格分隔的整数。第一个整数是\
  \ n，表示牧场数量；它的取值范围在 2 到 100 之间。第二个整数是 m，表示奶牛数量；它的取值范围在 1 到 150 之间。\n- m 行，每行给出一头奶牛所喜爱的两个牧场编号。这些牧场编号是介于\
  \ 1 和 n 之间的整数，并且以空格分隔。\n\n## 输出\n\n将输出写入名为 revegetate.out 的文件。\n\n输出一种给牧场播种的有效方式。输出是一个包含\
  \ n 个字符的行，每个字符是 '1'、'2'、'3' 或 '4'。第一个字符是牧场 1 的草种类型，第二个字符是牧场 2 的草种类型，依此类推。\n\n我们可以把这\
  \ n 个字符看作一个有 n 位的整数。例如，如果有五个草种类型 '11123'，那么我们可以把它看作整数 11123。\n\n当我们需要选择输出内容时，这种整数解释就派上了用场。如果有多种有效的牧场播种方式，我们必须输出按整数解释时最小的那个。例如，如果\
  \ '11123' 和 '22123' 都有效，我们输出字符串 '11123'，因为 11123 小于 22123。\n\n## 探索测试用例\n\n我们将使用自顶向下的设计来得出这个问题的解决方案。仔细分析一个测试用例有助于我们梳理任务。\n\
  \n下面是测试用例：\n\n```\n8 6\n5 4\n2 4\n3 5\n4 1\n2 1\n5 2\n```\n\n测试用例的第一行告诉我们有 8 块牧场，编号从\
  \ 1 到 8。第一行还告诉我们有 6 头奶牛。题目没有指定奶牛的编号方式，所以我就从 0 开始编号。为了便于查阅，每头奶牛所喜爱的两块牧场列在表 7-1 中。\n\
  \n### 表 7-1：农场播种示例（奶牛）\n\n| 奶牛 | 牧场 1 | 牧场 2 |\n|---|---|---|\n| 0 | 5 | 4 |\n|\
  \ 1 | 2 | 4 |\n| 2 | 3 | 5 |\n| 3 | 4 | 1 |\n| 4 | 2 | 1 |\n| 5 | 5 | 2 |\n\n在这个问题中，我们需要做出\
  \ n 个决定。牧场 1 应该使用什么草种类型？牧场 2 应该使用什么草种类型？牧场 3？牧场 4？依此类推，一直到牧场 n。对于这类问题，一种策略是一次做一个决定，并且不在任何一个决定上出错。如果我们能一直做到第\
  \ n 个决定，并且途中没有犯任何错误，那么我们的解决方案一定是正确的。\n\n让我们从 1 到 8 逐个检查牧场，看看能否为每个牧场分配一种草种类型。我们需要优先选择编号较小的草种类型，这样按整数解释时，我们最终会得到最小的草种类型组合。\n\
  \n牧场 1 应该选择什么草种类型？只有奶牛 3 和奶牛 4 在意牧场 1，所以我们只关注这两头奶牛。如果我们已经为这些奶牛的部分牧场选择了草种类型，那么\n\n\
  我们必须谨慎选择牧场 1 的草类型。我们不想让某头奶牛的两个牧场拥有相同的草类型，因为那会违反规则！我们还没有选择任何草类型，所以无论为牧场 1 选择什么都不会出错。不过，由于我们希望草类型的编号尽可能小，我们会选择草类型\
  \ 1。\n\n我会把草类型的决定记录在表格中。以下是我们刚刚做出的决定：牧场 1 使用草类型 1：\n\n| 牧场 | 草类型 |\n|---|---|\n\
  | 1 | 1 |\n\n接着往下看。我们应该为牧场 2 选择什么草类型？关心牧场 2 的奶牛是奶牛 1、4 和 5，所以我们关注这些奶牛。奶牛 4 的其中一个牧场是牧场\
  \ 1，而我们已经为牧场 1 选择了草类型 1，所以草类型 1 被排除，不能用于牧场 2。如果我们在牧场 2 使用草类型 1，那么奶牛 4 的两个牧场就拥有了相同的草类型，这会违反规则。然而，奶牛\
  \ 1 和 5 并没有排除任何其他草类型，因为我们还没有为它们的牧场选择草类型。因此，我们选择草类型 2，即编号最小的可用草类型。目前的情况如下：\n\n| 牧场\
  \ | 草类型 |\n|---|---|\n| 1 | 1 |\n| 2 | 2 |\n\n我们应该为牧场 3 选择什么草类型？唯一关心牧场 3 的奶牛是奶牛\
  \ 2。奶牛 2 的牧场是牧场 3 和 5。但该奶牛并没有排除任何草类型，因为我们还没有为牧场 5 分配草类型！为了得到最小编号，我们会在牧场 3 使用草类型\
  \ 1。下一个快照如下：\n\n| 牧场 | 草类型 |\n|---|---|\n| 1 | 1 |\n| 2 | 2 |\n\n| 牧场 | 草类型 |\n\
  |---|---|\n| 3 | 1 |\n\n在这里，我可以看到自顶向下设计中的三个任务逐渐成形。第一，我们需要获取关心当前牧场的奶牛。第二，我们需要确定这些奶牛会排除哪些草类型。第三，我们需要选择未被排除的最小编号的草类型。其中每一个都是函数的绝佳候选。\n\
  \n我们继续。有三头奶牛关心牧场 4：奶牛 0、1 和 3。奶牛 0 没有排除任何草类型，因为我们还没有为它的牧场分配草类型。奶牛 1 排除了草类型 2，因为我们为牧场\
  \ 2（它的另一个牧场）分配了草类型 2。奶牛 3 排除了草类型 1，因为我们为牧场 1（它的另一个牧场）分配了草类型 1。那么，编号最小的可用草类型是 3，所以牧场\
  \ 4 使用草类型 3：\n\n| 牧场 | 草类型 |\n|---|---|\n| 1 | 1 |\n| 2 | 2 |\n| 3 | 1 |\n| 4 |\
  \ 3 |\n\n接着看牧场 5。关心牧场 5 的奶牛是奶牛 0、2 和 5。奶牛 0 排除了草类型 3；奶牛 2 排除了草类型 1；奶牛 5 排除了草类型 2。因此草类型\
  \ 1、2 和 3 都被排除了。我们唯一的选择是草类型 4。\n\n好险！我们差点就用光了草类型。幸运的是，没有其他奶牛关心牧场 5 并排除草类型 4。\n\n\
  或者，等等。这根本不是运气，因为题目描述中有这样一句话：“保证每个牧场最多成为三头奶牛的最爱。”这意味着每个牧场最多只能被排除三种草类型。我们永远不会走投无路！而且我们甚至不必担心过去的选择会对下一个决定产生什么影响。无论过去做了什么，我们总是至少有一种可用的草类型。\n\
  \n我们把牧场 5 加入表格：\n\n| 牧场 | 草类型 |\n|---|---|\n| 1 | 1 |\n| 2 | 2 |\n| 3 | 1 |\n| 4\
  \ | 3 |\n| 5 | 4 |\n\n还剩三个牧场。但是没有奶牛关心它们，所以我们只需在每种情况下使用草类型 1。结果如下：\n\n| 牧场 | 草类型\
  \ |\n|---|---|\n| 1 | 1 |\n| 2 | 2 |\n| 3 | 1 |\n| 4 | 3 |\n| 5 | 4 |\n| 6 | 1 |\n\
  | 7 | 1 |\n| 8 | 1 |\n\n我们可以从上到下读取草类型，得到这个示例的正确输出。输出如下：\n\n12134111\n\n## 自顶向下设计\n\
  \n在清楚理解了我们需要完成的任务之后，我们转而对这个问题进行自顶向下设计。\n\n## 顶层\n\n在上一节中，我们通过一个测试用例发现了三个任务。在程序解决其中任何一个任务之前，我们需要读取输入，所以这是第四个任务。我们还需要写出输出。这需要一些思考，以及几行代码，所以我们就把它称为第五个任务。\n\
  \n以下是我们的五个主要任务：\n\n- 1. 读取输入。\n- 2. 找出关心当前牧场的奶牛。\n- 3. 为当前牧场排除草类型。\n- 4. 为当前牧场选择编号最小的草类型。\n\
  - 5. 写出输出。\n\n和我们在第 6 章解决 Action Figures 问题时一样，我们会从包含 TODO 注释的框架开始，并在解决每个任务时移除相应的\
  \ TODO。\n\n我们首先以注释为主。由于我们需要在开始时打开文件，并在结束时关闭文件，我也添加了这些代码。\n\n我们从这里开始：\n\n```\n# Main\
  \ Program\n\ninput_file = open('revegetate.in', 'r')\noutput_file = open('revegetate.out',\
  \ 'w')\n\n# TODO: Read input\n\n# TODO: Identify cows that care about pasture\n\n\
  # TODO: Eliminate grass types for pasture\n\n# TODO: Choose smallest-numbered grass\
  \ type for pasture\n\n# TODO: Write output\n\ninput_file.close()\noutput_file.close()\n\
  ```\n\n## 任务 1：读取输入\n\n读取输入的第一行，其中包含整数 n 和 m，是我们已经知道如何做的事情。它足够直接，我认为不需要为它编写函数，所以我们就直接做。接下来，我们需要读取\
  \ m 头奶牛的牧场信息，这里似乎值得使用一个函数。让我们移除“读取输入”注释中的 TODO，处理输入的第一行，并调用 read_cows 函数，我们稍后会编写该函数：\n\
  \n```\n# Main Program\n\ninput_file = open('revegetate.in', 'r')\noutput_file =\
  \ open('revegetate.out', 'w')\n\n# Read input\nlst = input_file.readline().split()\n\
  num_pastures = int(lst[0])\nnum_cows = int(lst[1])\n① favorites = read_cows(input_file,\
  \ num_cows)\n\n# TODO: Identify cows that care about pasture\n\n# TODO: Eliminate\
  \ grass types for pasture\n\n# TODO: Choose smallest-numbered grass type for pasture\n\
  \n# TODO: Write output\n\ninput_file.close()\noutput_file.close()\n```\n\n我们正在调用的\
  \ read_cows 函数 ① 会接收一个已打开供读取的文件，并读取每头奶牛的两个最爱牧场。它会返回一个列表的列表，其中每个内部列表包含给定奶牛的两个牧场编号。代码如下：\n\
  \n```\ndef read_cows(input_file, num_cows):\n    \"\"\"\n    input_file is a file\
  \ open for reading; cow information is next to read.\n    num_cows is the number\
  \ of cows in the file.\n\n    Read the cows' favorite pastures from input_file.\n\
  \    Return a list of each cow's two favorite pastures;\n    each value in the list\
  \ is a list of two values giving the\n    favorite pastures for one cow.\n    \"\
  \"\"\n    favorites = []\n```\n\n```\nfor i in range(num_cows):\n    ① lst = input_file.readline().split()\n\
  \    lst[0] = int(lst[0])\n    lst[1] = int(lst[1])\n    ② favorites.append(lst)\n\
  return favorites\n```\n\n这个函数将奶牛们的最爱牧场累积到 favorites 列表中。它使用一个 for 循环，循环 num_cows\
  \ 次，每次处理一头奶牛。我们需要这个循环，因为要读取的行数取决于文件中的奶牛数量。\n\n在循环的每次迭代中，我们读取下一行，并将其分成两个组成部分 ①。然后使用\
  \ int 将这些组成部分从字符串转换为整数。当我们把这个列表追加到 favorites ② 时，我们追加的其实是一个包含两个整数的列表。\n\n最后，我们返回这个最爱牧场的列表。\n\
  \n在继续之前，让我们确保知道如何调用这个函数。我们会单独调用它来练习，而不是在我们正在构建的更大程序中调用。像这样测试函数很有用，这样我们可以修复在过程中可能发现的任何错误。\n\
  \n使用文本编辑器创建一个名为 revegetate.in 的文件，内容如下（与之前研究的测试用例相同）：\n\n```\n8 6\n5 4\n2 4\n3 5\n\
  4 1\n2 1\n5 2\n```\n\n现在，在 Python shell 中输入我们的 read_cows 函数代码。我们这样调用 read_cows：\n\
  \n```\n>>> input_file = open('revegetate.in', 'r')\n① >>> input_file.readline()\n\
  '8 6\\n'\n② >>> read_cows(input_file, 6)\n[[5, 4], [2, 4], [3, 5], [4, 1], [2, 1],\
  \ [5, 2]]\n```\n\nread_cows 函数只读取奶牛的信息。由于我们是在程序之外单独测试这个函数，我们需要\n\n\n\nto read the\
  \ first line of the file ourselves before we call it ①. When we then call read_cows,\
  \ we get back a list giving the favorite pastures for each cow. Also notice that\
  \ we’re calling read_cows with an open file, not a filename ②.\n\nBe sure to include\
  \ our read_cows function, along with the functions we’ll write for other tasks,\
  \ before our # Main Program comment. Then we can move on to Task 2.\n\n## Task 2:\
  \ Identify Cows\n\nOur overall strategy for solving this problem is to consider\
  \ each pasture in turn, deciding which grass type to use. We’ll organize this work\
  \ inside a loop, with each iteration of the loop responsible for seeding one pasture.\
  \ For each pasture, we need to identify the cows that care about the pasture, eliminate\
  \ the used grass types, and choose the smallest-numbered available grass type. These\
  \ three tasks must run for each pasture, so we’ll indent them inside the loop.\n\
  \nWe’ll write a function called cows_with_favorite that tells us the cows who care\
  \ about the current pasture.\n\nHere’s what we’ve got now for our main program:\n\
  \n```\n# Main Program\n\ninput_file = open('revegetate.in', 'r')\noutput_file =\
  \ open('revegetate.out', 'w')\n\n# Read input\nlst = input_file.readline().split()\n\
  num_pastures = int(lst[0])\nnum_cows = int(lst[1])\nfavorites = read_cows(input_file,\
  \ num_cows)\n\nfor i in range(1, num_pastures + 1):\n    # Identify cows that care\
  \ about pasture\n    ① cows = cows_with_favorite(favorites, i)\n    # TODO: Eliminate\
  \ grass types for pasture\n    # TODO: Choose smallest-numbered grass type for pasture\n\
  \n# TODO: Write output\n\ninput_file.close()\noutput_file.close()\n```\n\nThe cows_with_favorite\
  \ function that we’re calling ① takes a list of the cows’ favorite pastures and\
  \ a pasture number and returns the cows that care about that pasture. Here’s the\
  \ code:\n\n```\ndef cows_with_favorite(favorites, pasture):\n    \"\"\"\n    favorites\
  \ is a list of favorite pastures, as returned by read_cows.\n    pasture is a pasture\
  \ number.\n\n    Return list of cows that care about pasture.\n    \"\"\"\n    cows\
  \ = []\n    for i in range(len(favorites)):\n        if favorites[i][0] == pasture\
  \ or favorites[i][1] == pasture:\n            cows.append(i)\n    return cows\n\
  ```\n\nThe function loops through favorites, looking for cows that care about pasture\
  \ number pasture. Each cow that cares about the pasture is added to the cows list\
  \ that is ultimately returned.\n\nLet’s do a little test. Enter our cows_with_favorite\
  \ function into the Python shell. Here’s the call that we’ll try:\n\n```\n>>> cows_with_favorite([[5,\
  \ 4],[2, 4],[3, 5]], 5)\n```\n\nWe have three cows here, and we’re asking which\
  \ ones care about pasture 5. The cows at indices 0 and 2 care about pasture 5, and\
  \ that’s exactly what the function tells us:\n\n```\n[0, 2]\n```\n\n## Task 3: Eliminate\
  \ Grass Types\n\nNow we know the cows that care about the current pasture. Our next\
  \ step is to figure out which grass types these cows eliminate from consideration\
  \ for the current pasture. We eliminate the grass types that are used in a pasture\
  \ associated with one or more of these cows. We’ll write a function called types_used\
  \ that tells us the grass types that have already been used (and are therefore eliminated\
  \ for the current pasture).\n\nHere is our main program, updated with a call to\
  \ this function:\n\n```\n# Main Program\n\ninput_file = open('revegetate.in', 'r')\n\
  output_file = open('revegetate.out', 'w')\n\n# Read input\nlst = input_file.readline().split()\n\
  num_pastures = int(lst[0])\nnum_cows = int(lst[1])\nfavorites = read_cows(input_file,\
  \ num_cows)\n\npasture_types = [0]\n\nfor i in range(1, num_pastures + 1):\n   \
  \ # Identify cows that care about pasture\n    cows = cows_with_favorite(favorites,\
  \ i)\n\n    # Eliminate grass types for pasture\n    eliminated = types_used(favorites,\
  \ cows, pasture_types)\n\n    # TODO: Choose smallest-numbered grass type for pasture\n\
  \n# TODO: Write output\n\ninput_file.close()\noutput_file.close()\n```\n\nIn addition\
  \ to calling the `types_used` function ❷, I’ve also added a variable called `pasture_types`\
  \ ❶. The list referred to by this variable will keep track of the grass type for\
  \ each pasture.\n\nRecall that the pastures are numbered starting from 1. Python\
  \ lists, on the other hand, are indexed starting from 0. I don’t like this discrepancy;\
  \ if we simply started adding grass types to pasture_types, then the grass type\
  \ for pasture 1 would be at index 0, the grass type for pasture 2 would be at index\
  \ 1, and so on, always off by one. That’s why I added a bogus 0 at the beginning\
  \ of the list ❶; when we later add the grass type for pasture 1, it’ll be placed\
  \ at index 1 to match.\n\nSuppose we’ve figured out the grass types for the first\
  \ four pastures. Here’s how pasture_types might look at that point:\n\n```\n[0,\
  \ 1, 2, 1, 3]\n```\n\nIf we want the grass type for pasture 1, we look at index\
  \ 1; if we want the grass type for pasture 2, we look at index 2; and so on. If\
  \ we want the grass type for pasture 5? Well, no, we can’t have that, because we\
  \ haven’t figured it out yet. If the length of pasture_types is 5, it means that\
  \ we’ve figured out the grass types for only the first four pastures. In general,\
  \ the number of grass types that we’ve figured out is one less than the list’s length.\n\
  \nNow we’re ready for the types_used function. It takes three parameters: the list\
  \ of favorite pastures for each cow, the cows that care about the current pasture,\
  \ and the grass types chosen for pastures so far. It returns the list of grass types\
  \ that are already used and therefore eliminated for the current pasture. Here goes:\n\
  \n```\ndef types_used(favorites, cows, pasture_types):\n    \"\"\"\n    favorites\
  \ is a list of favorite pastures, as returned by read_cows.\n    cows is a list\
  \ of cows.\n    pasture_types is a list of grass types.\n\n    Return a list of\
  \ the grass types already used by cows.\n    \"\"\"\n    used = []\n    for cow\
  \ in cows:\n        pasture_a = favorites[cow][0]\n        pasture_b = favorites[cow][1]\n\
  \        ① if pasture_a < len(pasture_types):\n            used.append(pasture_types[pasture_a])\n\
  \        ② if pasture_b < len(pasture_types):\n            used.append(pasture_types[pasture_b])\n\
  \    return used\n```\n\nEach cow has two favorite pastures, which I refer to by\
  \ pasture_a and pasture_b. For each of these pastures, we check whether a grass\
  \ type has already been chosen for it at ① and ②. A grass type has already been\
  \ chosen if that pasture is already an index in pasture_types. These grass types\
  \ are all added to the used list, which the function returns after looping through\
  \ all of the relevant cows.\n\nWhat if more than one cow uses the same pasture—what\
  \ does our code do then? Let’s come up with a simple test case to answer that question.\n\
  \nEnter our types_used function into the Python shell. Here’s a call of that function;\
  \ let’s predict what it returns:\n\n```\n>>> types_used([[5, 4], [2, 4], [3, 5]],\
  \ [0, 1], [0, 1, 2, 1, 3])\n```\n\nLet’s be careful so we don’t get lost. The first\
  \ argument gives the favorite pastures for three cows. The second argument gives\
  \ the cows that care about a particular pasture; these are cows 0 and 1. And the\
  \ third argument gives the grass types that we’ve decided on so far.\n\nNow, what\
  \ are the grass types already used, and therefore eliminated, by cows 0 and 1? Cow\
  \ 0 cares about pasture 4, and pasture 4 uses grass type 3, so grass type 3 is eliminated.\
  \ Cow 1 cares about pasture 2, and pasture 2 uses grass type 2, so grass type 2\
  \ is eliminated. Cow 1 also cares about pasture 4—but we already know, from cow\
  \ 0, that pasture 4’s grass type 3 is eliminated.\n\nThe return value of our function\
  \ is this:\n\n```\n[3, 2, 3]\n```\n\nTwo 3s in there, one coming from cow 0 and\
  \ the other from cow 1.\n\nIt may seem tidier to have just one 3 in there, but what\
  \ we have—with the duplicate—is just fine. If a grass type is in that list, then\
  \ it’s eliminated, no matter whether it’s in there once, twice, or three times.\n\
  \n## Task 4: Choose Smallest-Numbered Grass Type\n\nHaving obtained the grass types\
  \ that are eliminated, we can move on to our next task: choosing the smallest-numbered\
  \ available grass type for the current pasture. To solve this one, we’ll call a\
  \ new function, smallest_available. It will return the grass type that we should\
  \ use for the current pasture.\n\nHere’s the main program, updated with a call to\
  \ the smallest_available function:\n\n```\n# Main Program\n\ninput_file = open('revegetate.in',\
  \ 'r')\noutput_file = open('revegetate.out', 'w')\n\n# Read input\nlst = input_file.readline().split()\n\
  num_pastures = int(lst[0])\nnum_cows = int(lst[1])\nfavorites = read_cows(input_file,\
  \ num_cows)\n\npasture_types = [0]\n\nfor i in range(1, num_pastures + 1):\n```\n\
  \n\n\n\n\n# 识别关心牧场的奶牛\ncows = cows_with_favorite(favorites, i)\n\n# 消除牧场的草类型\neliminated\
  \ = types_used(favorites, cows, pasture_types)\n\n# 选择牧场最小编号的草类型\n❶ pasture_type\
  \ = smallest_available(eliminated)\n❷ pasture_types.append(pasture_type)\n\n# TODO:\
  \ 写入输出\n\ninput_file.close()\noutput_file.close()\n\n一旦我们获得了当前牧场最小编号的草类型 ❶，我们就将其添加到我们选择的草类型列表中\
  \ ❷。下面是 smallest_available 函数本身：\n\n```\ndef smallest_available(used):\n    \"\"\
  \"\n    used is a list of used grass types.\n\n    Return the smallest-numbered\
  \ grass type that is not in used.\n    \"\"\"\n    grass_type = 1\n    while grass_type\
  \ in used:\n        grass_type = grass_type + 1\n    return grass_type\n```\n\n\
  该函数以草类型 1 开始。然后它循环直到找到一个尚未使用的草类型，每次迭代将草类型增加一。一旦找到空闲的草类型，函数就会返回它。记住，最多有三种草类型已被使用，四种可用，因此该函数保证成功。\n\
  \n## 任务 5：写入输出\n\n我们已经有了答案，就在 pasture_types 中！现在我们要做的就是输出它。下面是最终版的主程序：\n\n```\n\
  # Main Program\n\ninput_file = open('revegetate.in', 'r')\noutput_file = open('revegetate.out',\
  \ 'w')\n```\n\n```\n# Read input\nlst = input_file.readline().split()\nnum_pastures\
  \ = int(lst[0])\nnum_cows = int(lst[1])\nfavorites = read_cows(input_file, num_cows)\n\
  \npasture_types = [0]\n\nfor i in range(1, num_pastures + 1):\n    # Identify cows\
  \ that care about pasture\n    cows = cows_with_favorite(favorites, i)\n    # Eliminate\
  \ grass types for pasture\n    eliminated = types_used(favorites, cows, pasture_types)\n\
  \    # Choose smallest-numbered grass type for pasture\n    pasture_type = smallest_available(eliminated)\n\
  \    pasture_types.append(pasture_type)\n\n# Write output\n① pasture_types.pop(0)\n\
  ② write_pastures(output_file, pasture_types)\n\ninput_file.close()\noutput_file.close()\n\
  ```\n\n在写入输出之前，我们删除 pasture_types 开头的错误 0 ①。我们不想输出那个 0，因为它不是真正的草类型。然后，我们调用 write_pastures\
  \ 来实际写入输出 ②。\n\n现在我们需要的只是 write_pastures 函数。它接受一个打开用于写入的文件和一个草类型列表，并将草类型输出到文件中。下面是代码：\n\
  \n```\ndef write_pastures(output_file, pasture_types):\n    \"\"\"\n    output_file\
  \ is a file open for writing.\n    pasture_types is a list of integer grass types.\n\
  \n    Output pasture_types to output_file.\n    \"\"\"\n    pasture_types_str =\
  \ []\n    ① for pasture_type in pasture_types:\n        pasture_types_str.append(str(pasture_type))\n\
  \    ② output = \" \".join(pasture_types_str)\n    ③ output_file.write(output +\
  \ '\\n')\n```\n\n目前，pasture_types 是一个整数列表。正如我们稍后会看到的，使用字符串列表在这里更方便，因此我创建一个新列表，将每个整数作为字符串\
  \ ①。我不会修改 pasture_types 列表本身，因为这可能会震惊该函数的调用者。调用者调用此函数时期望的只是输出被写入 output_file，而不是其\
  \ pasture_types 列表被修改。该函数无权修改其列表参数。\n\n为了生成输出，我们需要调用 write 并传入一个字符串，而不是一个列表。我们需要以不带空格的方式输出列表中的字符串。字符串\
  \ join 方法在这里非常有用。正如我们在第 5 章“将列表连接成字符串”中所学的那样，我们调用 join 的字符串充当放置在列表值之间的分隔符。由于我们不希望值之间有任何分隔符，因此我们使用空字符串作为分隔符\
  \ ②。join 方法仅适用于字符串列表，而不是整数列表，这就是为什么我在该函数的开头将整数列表转换为字符串列表 ①。\n\n有了作为单个字符串的输出，我们就可以将其写入文件\
  \ ③。\n\n## 把所有东西放在一起\n\n完整程序在列表 7-2 中。\n\n```\ndef read_cows(input_file, num_cows):\n\
  \    \"\"\"\n    input_file is a file open for reading; cow information is next\
  \ to read.\n    num_cows is the number of cows in the file.\n\n    Read the cows'\
  \ favorite pastures from input_file.\n    Return a list of each cow's two favorite\
  \ pastures;\n    each value in the list is a list of two values giving the\n   \
  \ favorite pastures for one cow.\n    \"\"\"\n    favorites = []\n    for i in range(num_cows):\n\
  \        lst = input_file.readline().split()\n        lst[0] = int(lst[0])\n   \
  \     lst[1] = int(lst[1])\n        favorites.append(lst)\n    return favorites\n\
  \ndef cows_with_favorite(favorites, pasture):\n    \"\"\"\n    favorites is a list\
  \ of favorite pastures, as returned by read_cows.\n    pasture is a pasture number.\n\
  ```\n\n```\noutput = \"\".join(pasture_types_str)\noutput_file.write(output + '\\\
  n')\n\n# Main Program\n\ninput_file = open('revegetate.in', 'r')\noutput_file =\
  \ open('revegetate.out', 'w')\n\n# Read input\nlst = input_file.readline().split()\n\
  num_pastures = int(lst[0])\nnum_cows = int(lst[1])\nfavorites = read_cows(input_file,\
  \ num_cows)\n\npasture_types = [0]\n\nfor i in range(1, num_pastures + 1):\n\n \
  \   # Identify cows that care about pasture\n    cows = cows_with_favorite(favorites,\
  \ i)\n\n    # Eliminate grass types for pasture\n    eliminated = types_used(favorites,\
  \ cows, pasture_types)\n\n    # Choose smallest-numbered grass type for pasture\n\
  \    pasture_type = smallest_available(eliminated)\n    pasture_types.append(pasture_type)\n\
  \n# Write output\npasture_types.pop(0)\nwrite_pastures(output_file, pasture_types)\n\
  \ninput_file.close()\noutput_file.close()\n```\n\n列表 7-2：解决农场播种问题\n\n我们做到了！一个令人望而生畏的问题，通过自顶向下设计的运用变得更易管理。欢迎将我们的工作提交给\
  \ USACO 评委。\n\n当你第一次阅读问题时，很容易被问题压倒。但请记住，你不需要一步完成它。将其分解，解决你能解决的每个任务，你就会朝着整体问题的解决方案迈进。你在\
  \ Python 知识量以及设计程序和解决问题的能力方面取得了巨大进步。解决这些问题在你的能力范围内！\n\n## 概念检查\n\n让我们思考一个没有限制关心牧场的奶牛数量的农场播种新版本。牧场可能是四头奶牛、五头奶牛甚至更多奶牛的最爱。我们仍然不允许给一头奶牛两个相同草类型的牧场。\n\
  \n假设我们在解决这个新版本的问题，并且有一个测试用例，其中一个牧场是超过三头奶牛的最爱。以下哪一项对该测试用例是正确的？\n\n- A. *保证* *没有办法*\
  \ 用只有四种草类型来解决它。\n- B. 可能有办法解决它。如果有，我们的原始解决方案（列表 7-2）*会* 做到这一点。\n- C. 可能有办法解决它。如果有，我们的原始解决方案（列表\
  \ 7-2）*保证会* 做到这一点。\n- D. 可能有办法解决它。如果有，我们的原始解决方案（列表 7-2）*保证不会* 做到这一点。\n\n答案：B。我们可以找到一个由我们的程序正确解决的测试用例，也可以找到一个可以解决但不能由我们的程序解决的测试用例。前者排除了\
  \ A 和 D 作为正确答案；后者排除了 C 作为正确答案。\n\n这里有一个由我们的程序正确解决的测试用例：\n\n```\n2 4\n1 2\n1 2\n\
  1 2\n1 2\n```\n\n每个牧场都是四头奶牛的最爱。尽管如此，我们仍然只能使用两种草类型来解决这个测试用例。尝试我们的程序，你应该会看到它正确解决了这个测试用例。\n\
  \n现在这里有一个可以解决但不能由我们的程序解决的测试用例：\n\n```\n```text\n6 10\n2 3\n2 4\n3 4\n2 5\n3 5\n\
  4 5\n1 6\n3 6\n4 6\n5 6\n```\n```\n\n我们的程序犯的错误是为牧场 1 使用草类型 1。这样一来，它就被迫为牧场 6 使用草类型\
  \ 5——这是不允许的！我们的程序失败了，但不要得出结论说没有办法解决这个测试用例。特别是，使用草类型 2 为牧场 1，你应该能够找到一种仅使用四种草类型来解决这个测试用例的方法。可以更复杂的程序解决这类测试用例，如果你感兴趣，我鼓励你自己思考这个问题。\n\
  \n## 总结\n\n在本章中，我们学习了如何打开、从中读取、写入和关闭文件。每当你需要存储信息并稍后将其用作输入时，文件就很有用。它们也很有用，可以将信息传达给你的用户。我们还了解到，我们处理文件的方式与处理标准输入和标准输出的方式相似。\n\

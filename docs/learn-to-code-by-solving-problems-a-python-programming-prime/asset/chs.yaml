- "# 重复代码：不定循环\n\n![](img/3e15323aee4cec3bf673834bfafe8024_105_0.png)\n\n你在第 3 章学到的\
  \ for 循环和 range for 循环非常适合遍历字符串或索引范围。但当我们没有字符串，或者索引不遵循固定模式时，该怎么办呢？我们使用 while 循环，这正是本章的主题。while\
  \ 循环比 for 循环更通用，能处理 for 循环无法应对的情况。\n\n我们将解决三个 for 循环力不能及的问题：确定老虎机能玩多少次、整理歌曲播放列表直到用户想停止，以及解码一条编码消息。\n\
  \n## 问题 #8：老虎机\n\n在钱花光之前，老虎机可以玩多少次？这个问题很微妙，它不仅取决于我们一开始有多少钱，还取决于游戏过程中的中奖模式。我们会发现，这种情况需要用\
  \ while 循环，而不是 for 循环。\n\n这是 DMOJ 题目 ccc00s1。\n\n## 挑战\n\n玛莎带着 n 枚 25 美分硬币来到赌场。赌场有三台老虎机，她按顺序玩，直到硬币用完。也就是说，她先玩第一台老虎机，然后第二台，然后第三台，再回到第一台，然后是第二台，依此类推。每玩一次花费一枚\
  \ 25 美分硬币。\n\n老虎机按以下规则运行：\n\n- 第一台老虎机每当被玩到第 35 次时支付 30 枚 25 美分硬币。\n- 第二台老虎机每当被玩到第\
  \ 100 次时支付 60 枚 25 美分硬币。\n- 第三台老虎机每当被玩到第 10 次时支付 9 枚 25 美分硬币。\n- 其他游玩不会支付任何硬币。\n\
  \n确定玛莎在硬币用完之前一共玩了多少次。\n\n## 输入\n\n输入由四行组成。\n\n- 第一行包含一个整数 n，表示玛莎带到赌场的 25 美分硬币数量。n\
  \ 在 1 到 1,000 之间。\n- 第二行包含一个整数，表示第一台老虎机自上次支付以来已被玩过的次数。这些游玩发生在玛莎到达之前，玛莎的游玩从该次数之后继续。例如，假设第一台老虎机自上次支付以来已被玩过\
  \ 34 次。那么，玛莎第一次玩它就会赢得 30 枚 25 美分硬币。\n- 第三行包含一个整数，表示第二台老虎机自上次支付以来已被玩过的次数。\n- 第四行包含一个整数，表示第三台老虎机自上次支付以来已被玩过的次数。\n\
  \n## 输出\n\n输出以下句子，其中 x 是玛莎在硬币用完之前玩的次数：\n\n```\nMartha plays x times before going\
  \ broke.\n```\n\n## 探索一个测试用例\n\n让我们完整地看一个例子，确保这个问题中的所有内容都清楚明了。我们将使用以下测试用例：\n\n```\n\
  7\n28\n0\n8\n```\n\n为了仔细追踪玛莎的每一次游玩，我们需要记录六项信息。用表格来记录会很方便，因为每一行可以告诉我们每次游玩后的状态。以下是我们的列：\n\
  \n- **游玩次数**：玛莎已经玩过的老虎机数量\n- **硬币数**：玛莎当前拥有的 25 美分硬币数量\n- **下次游玩**：玛莎接下来会玩的老虎机\n\
  - **第一台游玩次数**：第一台机器自上次支付以来已被玩过的次数\n- **第二台游玩次数**：第二台机器自上次支付以来已被玩过的次数\n- **第三台游玩次数**：第三台机器自上次支付以来已被玩过的次数\n\
  \n开始时，玛莎已经玩了 0 次老虎机，她有 7 枚 25 美分硬币，接下来她会玩第一台老虎机。第一台老虎机自上次支付以来已被玩过 28 次，第二台已被玩过 0\
  \ 次，第三台已被玩过 8 次。我们的状态如下：\n\n| 游玩次数 | 硬币数 | 下次游玩 | 第一台游玩次数 | 第二台游玩次数 | 第三台游玩次数 |\n\
  |---:|---:|:---:|---:|---:|---:|\n| 0 | 7 | 第一台 | 28 | 0 | 8 |\n\n玛莎首先玩第一台老虎机。这花费一枚\
  \ 25 美分硬币。因为这是该机器自上次支付以来第 29 次被玩，而不是第 35 次，所以老虎机不会支付任何硬币。接下来玛莎将玩第二台老虎机。这是我们的新状态：\n\
  \n| 游玩次数 | 硬币数 | 下次游玩 | 第一台游玩次数 | 第二台游玩次数 | 第三台游玩次数 |\n|---|---|---|---|---|---|\n\
  | 1 | 6 | 第二台 | 29 | 0 | 8 |\n\n玩第二台老虎机花费一枚 25 美分硬币。因为这是该机器自上次支付以来第 1 次被玩，而不是第 100\
  \ 次，所以老虎机不会支付任何硬币。接下来玛莎将玩第三台老虎机。这是我们的新状态：\n\n| 游玩次数 | 硬币数 | 下次游玩 | 第一台游玩次数 | 第二台游玩次数\
  \ | 第三台游玩次数 |\n|---|---|---|---|---|---|\n| 2 | 5 | 第三台 | 29 | 1 | 8 |\n\n玩第三台老虎机花费一枚\
  \ 25 美分硬币。因为这是该机器自上次支付以来第 9 次被玩，而不是第 10 次，所以老虎机不会支付任何硬币。接下来，玛莎将循环回到第一台老虎机。这是我们的新状态：\n\
  \n| 游玩次数 | 硬币数 | 下次游玩 | 第一台游玩次数 | 第二台游玩次数 | 第三台游玩次数 |\n|---|---|---|---|---|---|\n\
  | 3 | 4 | 第一台 | 29 | 1 | 9 |\n\n现在玛莎玩第一台老虎机：\n\n| 游玩次数 | 硬币数 | 下次游玩 | 第一台游玩次数 |\
  \ 第二台游玩次数 | 第三台游玩次数 |\n|---|---|---|---|---|---|\n| 4 | 3 | 第二台 | 30 | 1 | 9 |\n\
  \n然后玛莎玩第二台老虎机：\n\n| 游玩次数 | 硬币数 | 下次游玩 | 第一台游玩次数 | 第二台游玩次数 | 第三台游玩次数 |\n|---|---|---|---|---|---|\n\
  | 5 | 2 | 第三台 | 30 | 2 | 9 |\n\n要编写 while 循环，我们使用 Python 的 while 语句。while 循环由布尔表达式控制。如果布尔表达式为\
  \ True，Python 会执行 while 循环的一次迭代。如果表达式仍为 True，Python 会再执行一次 while 循环迭代，如此反复，直到布尔表达式变为\
  \ False。如果布尔表达式一开始就是 False，那么循环根本不会运行。\n\nwhile 循环是 *不定循环*：迭代次数可能事先无法知道。\n\n## 使用\
  \ while 循环\n\n让我们从下面这个 while 循环示例开始：\n\n```python\n>>> num = 0\n>>> while num <\
  \ 5:\n...     print(num)\n...\n...     num = num + 1\n...\n0\n1\n2\n3\n4\n```\n\n\
  在 for 循环中，循环变量由 Python 替我们创建；我们不必在循环之前使用赋值语句来创建变量。但在 while 循环中，没有什么是白来的。如果我们需要一个变量在\
  \ while 循环中遍历各个值，就必须自己创建这个变量。我们在这里通过在循环之前让 num 指向 0 来完成这一点 ❶。\n\nwhile 循环本身由布尔表达式\
  \ num < 5 控制 ❷。如果 num < 5 为 True，循环块中的代码就会运行。此时 num 指向 0，所以布尔表达式为 True。因此我们运行循环块，输出\
  \ 0，然后把 num 增加到 1 ❸。\n\n我们跳回循环顶部，再次计算 num < 5 这个布尔表达式。由于 num 指向 1，表达式为 True。因此我们再次运行循环块，输出\
  \ 1，然后把 num 增加到 2。\n\n回到循环顶部：num < 5 仍然为 True 吗？是的，因为 num 才等于 2。这会启动循环的另一次迭代，输出\
  \ 2，并把 num 增加到 3。\n\n这种模式会继续，循环还会再迭代两次：一次是 num 指向 3 时，另一次是 num 指向 4 时。当 num 指向 5\
  \ 时，num < 5 这个布尔表达式终于为 False，从而终止循环。\n\n重要的是，我们必须记得增加 num ③。for 循环会自动让循环变量遍历合适的值。但同样，在\
  \ while 循环中一切都不是白来的，我们必须自己更新变量，使自己一步步接近循环终止。如果我们忘记增加 num，就会发生这种情况：\n\n```\n>>> num\
  \ = 0\n>>> while num < 5:\n...     print(num)\n...\n0\n0\n0\n0\n0\n0\n0\n... forever\n\
  ```\n\n如果你在自己的计算机上运行这段代码，屏幕会被 0 填满，你必须终止程序。你可以按 CTRL-C 或关闭 Python 窗口来做到这一点。\n\n\
  问题在于 num < 5 永远为 True；循环中没有任何东西能让它变成 False。这种循环永不终止的情况被称为无限循环。令人惊讶的是，无意中写出无限 while\
  \ 循环非常容易。如果你看到相同的值不断重复，或者程序似乎什么也没做，那么很可能你陷入了无限循环。请仔细检查 while 循环的布尔表达式，并确保循环块正在朝终止的方向前进。\n\
  \n我们可以对 num 变量做任何我们想做的事。下面是一个每次加 3 的 while 循环：\n\n```\n>>> num = 0\n>>> while num\
  \ < 10:\n...     print(num)\n...     num = num + 3\n...\n0\n3\n6\n9\n```\n\n\n\n\
  \n下面是一个从 4 倒数到 0 的 while 循环：\n\n```\n>>> num = 4\n>>> while num >= 0:\n...   print(num)\n\
  ...   num = num - 1\n...\n4\n3\n2\n1\n0\n```\n\n注意，这里我使用的是 >= 而不是 >。这样，当 num 为 0\
  \ 时，while 循环仍会执行，这正是我们想要的效果。\n\n## 概念检查\n\n以下代码的输出是什么？\n\n```\nn = 3\nwhile n >\
  \ 0:\n    if n == 5:\n        n = -100\n    print(n)\n    n = n + 1\n```\n\nA.\n\
  \n3\n4\n\nB.\n\n3\n4\n5\n\nC.\n\n3\n4\n-100\n\nD.\n\n3\n4\n5\n-100\n\n答案：C。while\
  \ 循环的布尔表达式只在每次迭代开始时检查。即使它在迭代过程中某一点变为 False，当前迭代的剩余部分仍会执行完毕。\n\n因为 3 大于 0，所以执行一轮循环迭代。if\
  \ 语句块被跳过（因为其布尔表达式为 False），因此这次迭代输出 3 并将 n 设为 4。由于 4 大于 0，我们再进行一轮循环迭代，这次输出 4 并将 n\
  \ 设为 5。由于 5 大于 0，我们再执行一轮循环迭代。这一次，if 语句块被执行，将 n 设为 -100。接下来，输出 -100，并将 n 设为 -99。然后我们停下来，因为\
  \ n > 0 为 False。\n\n## 概念检查\n\n以下代码的输出是什么？\n\n```\nx = 6\nwhile x > 4:\n    x =\
  \ x - 1\n    print(x)\n```\n\nA.\n\nB.\n\n6\n5\n4\n\nC.\n\n5\n4\n\nD.\n\n5\n4\n\
  3\n\nE.\n\n6\n5\n4\n3\n\n答案：C。许多 while 循环先执行某些操作，然后更新循环变量，但这个循环不是这样。它先递减循环变量 x，然后输出它。因为\
  \ 6 大于 4，所以执行一轮循环迭代，将 x 赋值为 5，然后输出 5。接下来，5 大于 4，所以我们再进行一轮迭代，这次将 x 赋值为 4 并输出 4。就是这样：4\
  \ 不大于 4，所以循环终止。\n\n## 在循环中嵌套循环\n\n我们可以像在 for 循环中嵌套循环一样，在 while 循环中嵌套循环。在第 3 章的“嵌套”一节中，我提到内部\
  \ for 循环\n\n会在外层循环开始下一次迭代之前完成其所有迭代。while 循环也是如此。下面是一个示例：\n\n```\n>>> i = 0\n>>>\
  \ while i < 3:\n...     j = 8\n...     while j < 11:\n...         print(i, j)\n\
  ...         j = j + 1\n...     i = i + 1\n...\n0 8\n0 9\n0 10\n1 8\n1 9\n1 10\n\
  2 8\n2 9\n2 10\n```\n\ni 的每一个值都会产生三行输出，分别对应内层 j 循环的每一次迭代。\n\n## 概念检查\n\n以下嵌套循环会输出多少行？\n\
  \n```\nx = 0\ny = 1\nwhile x < 3:\n    while y < 3:\n        print(x, y)\n     \
  \   y = y + 1\n    x = x + 1\n```\n\n- A. 2\n- B. 3\n- C. 6\n- D. 8\n- E. 9\n\n\
  答案：A。外层循环的布尔表达式 x < 3 为 True，因此我们执行一次外层循环迭代。这将导致内层循环执行两次迭代：一次 y 为 1，一次 y 为 2，每次迭代都会输出一行。所以目前已经输出了两行。\n\
  \n但代码中没有重置 y 的值！因此，y < 3 永远不会再为 True，内层循环也不会再有后续迭代。\n\n在处理嵌套 while 循环时，忘记重置循环变量是一个常见错误。\n\
  \n## 添加布尔运算符\n\n为了解决老虎机问题，我们希望在 Martha 至少有一枚硬币时进行循环。代码如下：\n\n```\nwhile quarters\
  \ >= 1:\n```\n\n这个简单的布尔表达式就足以解决这个问题。但和 if 语句一样，while 后面的布尔表达式也可以包含关系运算符或布尔运算符。下面是一个示例：\n\
  \n```\n>>> x = 4\n>>> y = 10\n>>> while x <= 10 and y <= 13:\n...     print(x, y)\n\
  ...     x = x + 1\n...     y = y + 1\n...\n4 10\n5 11\n6 12\n7 13\n```\n\n这个 while\
  \ 循环由布尔表达式 x <= 10 and y <= 13 控制。与任何 and 运算符一样，要使整个表达式为 True，其两个操作数都必须为 True。当\
  \ x 为 8、y 为 14 时，循环终止，因为 y <= 13 这个操作数为 False。\n\n## 解决问题\n\n为了解决老虎机问题，我们知道需要使用\
  \ while 循环而不是 for 循环，因为我们无法提前预测迭代次数。循环的每次迭代将玩当前这台老虎机。当循环终止时，Martha 将没有硬币剩余，我们将输出她玩的次数。\n\
  \n每次迭代我们需要做以下事情：\n\n- 将 Martha 的硬币减少一枚（因为玩一次老虎机需要一枚硬币）。\n- 如果 Martha 当前在第一台老虎机，就玩那台机器。这包括增加该机器已被玩的次数。如果这是第\
  \ 35 次玩，则给 Martha 奖励，并将该机器已被玩的次数重置为 0。\n- 如果 Martha 当前在第二台老虎机，就玩那台机器（与玩第一台机器的方式类似）。\n\
  - 如果 Martha 当前在第三台老虎机，就玩那台机器（与玩第一台机器的方式类似）。\n- 增加 Martha 的游玩次数（因为我们刚玩了一台机器）。\n-\
  \ 移到下一台机器。如果 Martha 刚玩了第一台，我们想移到第二台；如果她刚玩了第二台，我们想移到第三台；如果她刚玩了第三台，我们想循环回到第一台。\n\n\
  我们的程序现在变得越来越长，所以像我刚才那样列出计划是控制复杂性并引导我们写出正确代码的有用技巧。我们可以利用这个计划来确保我们遵循步骤，并且没有遗漏任何东西。\n\
  \n我们的代码在清单 4-1 中。\n\n```\nquarters = int(input())\nfirst = int(input())\nsecond\
  \ = int(input())\nthird = int(input())\n\nplays = 0\nmachine = 0\n\nwhile quarters\
  \ >= 1:\n```\n\n```\nquarters = quarters - 1\n\nif machine == 0:\n    first = first\
  \ + 1\n    if first == 35:\n        first = 0\n        quarters = quarters + 30\n\
  elif machine == 1:\n    second = second + 1\n    if second == 100:\n        second\
  \ = 0\n        quarters = quarters + 60\nelif machine == 2:\n    third = third +\
  \ 1\n    if third == 10:\n        third = 0\n        quarters = quarters + 9\n\n\
  plays = plays + 1\nmachine = machine + 1\nif machine == 3:\n    machine = 0\n\n\
  print('Martha plays', plays, 'times before going broke.')\n```\n\n## 清单 4-1：解决老虎机问题\n\
  \nquarters 变量记录 Martha 拥有的硬币数量。first、second 和 third 变量分别记录第一、第二和第三台老虎机自上次赔付以来的游玩次数。\n\
  \nmachine 变量记录 Martha 接下来要玩的老虎机。第一台老虎机用数字 0 表示，第二台用 1 表示，第三台用 2 表示。因此，让 machine\
  \ 指向 0 表示接下来将玩第一台老虎机。\n\n我们也可以用 1、2、3 来代替 0、1、2 表示老虎机。或者使用字符串：'first'、'second' 和\
  \ 'third'。但从零开始编号是惯例，所以我在这里就是这样做的。\n\n这个程序中的最后一个变量是 plays，它记录 Martha 已玩过的老虎机数量。一旦\
  \ Martha 没有硬币了，我们就输出这个值。\n\n程序的主体是一个 while 循环，只要 Martha 还有硬币就会一直循环。\n\n循环的每次迭代玩一台老虎机。因此，我们做的第一件事是把\
  \ Martha 的硬币减少一枚。接下来，我们玩当前这台老虎机。\n\n我们是在老虎机 0 吗？还是老虎机 1？老虎机 2？我们需要一个 if 语句来回答这个问题。\n\
  \n我们首先检查是否在老虎机 0 上。如果是，我们就将该老虎机自上次赔付以来的游玩次数增加 1。为了确定 Martha 是否会获得赔付，我们接着检查该机器自上次赔付以来是否正好被玩了\
  \ 35 次。如果是，我们就把该机器的游玩次数重置为 0，并将 Martha 的硬币增加 30。\n\n这里有好几层嵌套，所以请花些时间确认代码逻辑是正确的。特别要注意，每次我们玩第一台机器时，都会将其游玩次数增加\
  \ 1。但我们只在每玩 35 次后给 Martha 赔付——这就是我们使用内层 if 语句的原因！\n\n我们处理第二台和第三台老虎机的方式与处理第一台完全相同。唯一的区别是，每台老虎机在各自的游玩次数达到要求后向\
  \ Martha 赔付，并且赔付的硬币数量也各自不同。\n\n玩完一台老虎机后，我们将 Martha 的游玩次数增加 1。剩下的就是移到下一台机器，这样如果循环还有下一次迭代，我们就会处于正确的机器位置。\n\
  \n要移到下一台机器，我们将 machine 增加 1。如果之前在机器 0，这会将我们移到机器 1。如果之前在机器 1，会移到机器 2。如果之前在机器 2，会移到机器\
  \ 3。\n\n……机器 3？根本没有机器 3！如果我们刚玩了机器 2，那么我们希望从机器 0 重新开始。为此，我们添加一个检查：如果我们刚移到机器 3，就知道我们刚玩了机器\
  \ 2，所以我们将 machine 重置为机器 0。\n\n当循环终止时，我们知道 Martha 已经没有硬币了。作为最后一步，我们输出所需的句子，包括 Martha\
  \ 的游玩次数。\n\n这段代码包含了很多内容：在 Martha 没有硬币时停止、跟踪当前机器、在适当的时候给 Martha 赔付，以及统计 Martha 的游玩次数。你可以随时提交这段代码，但也要考虑一下，你是否会以\n\
  \n不同的方式。如果你在循环顶部而不是底部将 plays 增加 1，会发生什么？在循环顶部还是底部将 quarters 减少 1 有关系吗？你原本会不会使用新变量来记录\
  \ Martha 玩每台老虎机的次数，而不是修改 first、second 和 third？我强烈鼓励你对我们在此处的代码进行各种变体实验。如果你做了修改，而代码无法再通过测试，那太好了！现在你又有了新的学习机会来修复代码，并了解为什么你的修改会导致不想要的行为。\n\
  \n接下来的两节将进一步改进代码。我们将使用 % 运算符来减少所需的变量数量，并学习 f-string 以简化字符串的构建方式。\n\n## 取模运算符\n\n\
  在第 1 章的“整数和浮点数”中，我介绍了用于计算整数除法余数的取模（%）运算符。例如，16 除以 5 的余数为 1：\n\n```\n>>> 16 % 5\n\
  1\n```\n\n而 15 除以 5 的余数为 0（因为 5 能整除 15）：\n\n```\n>>> 15 % 5\n0\n```\n\n第二个操作数决定了\
  \ % 可能返回的值的范围。可能的返回值为从 0 到第二个操作数（但不包括第二个操作数）之间的整数。例如，如果第二个操作数是 3，那么 % 唯一能返回的值就是\
  \ 0、1 和 2。此外，随着我们增大第一个操作数，我们会循环遍历所有可能的返回值。下面是一个例子：\n\n```\n>>> 0 % 3\n0\n>>> 1 %\
  \ 3\n1\n>>> 2 % 3\n2\n>>> 3 % 3\n0\n>>> 4 % 3\n1\n>>> 5 % 3\n2\n>>> 6 % 3\n0\n>>>\
  \ 7 % 3\n1\n```\n\n注意这个模式：0、1、2、0、1、2，依此类推。这种行为对于计数到指定数字然后循环回到 0 非常有用。这正是我们玩老虎机时所需的行为：我们先玩\
  \ 0 号老虎机，然后 1 号，然后 2 号，然后 0 号，然后 1 号，然后 2 号，然后 0 号，然后 1 号，依此类推。（这也是我使用 0、1、2 而不是其他值来指代老虎机的另一个原因。）\n\
  \n假设变量 plays 表示 Martha 已经玩的次数。要确定下一台要玩的老虎机（0、1 或 2），我们可以使用 % 运算符。例如，假设 Martha 到目前为止已经玩了一台老虎机，我们想知道她接下来会玩哪一台。她接下来会玩\
  \ 1 号老虎机，% 运算符会告诉我们这一点：\n\n```\n>>> plays = 1\n>>> plays % 3\n1\n```\n\n如果 Martha\
  \ 到目前为止已经玩了六次，那么她玩过的老虎机依次是 0、1、2、0、1、2。她接下来要玩的老虎机是 0 号。而且，由于她将三台老虎机各玩了两遍，除此之外没有其他游玩次数，%\
  \ 运算符会给出 0：\n\n```\n>>> plays = 6\n>>> plays % 3\n0\n```\n\n作为最后一个例子，假设 Martha 到目前为止已经玩了\
  \ 11 次。她已经完成了三个完整循环：0、1、2、0、1、2、0、1、2。这占了九次游玩。剩下的两次游玩将使 Martha 在下一局中玩 2 号老虎机：\n\n\
  ```\n>>> plays = 11\n>>> plays % 3\n2\n```\n\n也就是说，我们无需显式维护一个机器变量，就能计算出要玩哪台老虎机。\n\
  \n我们还可以使用 % 来简化判断当前老虎机的下一次游玩是否会让 Martha 赢钱的逻辑。以第一台老虎机为例。在代码清单 4-1 中，我们统计了自该老虎机上次赢钱以来的游玩次数。如果这个数字是\
  \ 35，我们就让 Martha 赢钱并将计数重置为 0。但如果使用 % 运算符，则无需重置计数。我们只需检查该老虎机是否已被游玩了 35 的倍数次，如果是，就让\
  \ Martha 赢钱。要测试一个数字是否是 35 的倍数，可以使用 % 运算符。如果一个数字除以 35 没有余数，它就是 35 的倍数：\n\n```\n>>>\
  \ first = 35\n>>> first % 35\n0\n>>> first = 48\n>>> first % 35\n13\n>>> first =\
  \ 70\n>>> first % 35\n0\n>>> first = 175\n>>> first % 35\n0\n```\n\n我们可以直接检查 `first\
  \ % 35 == 0` 来决定是否让 Martha 赢钱。\n\n我已经将代码清单 4-1 更新为使用 % 运算符。新代码见代码清单 4-2。\n\n```python\n\
  quarters = int(input())\nfirst = int(input())\nsecond = int(input())\nthird = int(input())\n\
  \nplays = 0\n\nwhile quarters >= 1:\n  machine = plays % 3\n  quarters = quarters\
  \ - 1\n\n  if machine == 0:\n    first = first + 1\n  if first % 35 == 0:\n    quarters\
  \ = quarters + 30\n  elif machine == 1:\n    second = second + 1\n```\n\n```python\n\
  >>> num3 = 11\n>>> 'We have ' + str(num1) + ', ' + str(num2) + ', and ' + str(num3)\
  \ + '.'\n'We have 7, 82, and 11.'\n```\n\n我们可不想去跟踪所有这些引号、加号和空格。\n\n构建由字符串和数字组成的字符串，最灵活的方法是使用\
  \ *f-string*。下面就是前面的例子使用 f-string 的样子：\n\n```python\n>>> num1 = 7\n>>> num2 = 82\n\
  >>> num3 = 11\n>>> f'We have {num1}, {num2}, and {num3}.'\n'We have 7, 82, and 11.'\n\
  ```\n\n注意字符串开头的引号前的 *f*。*f* 代表 format（格式化），因为 f-string 允许你格式化字符串的内容。在 f-string 内部，我们可以把表达式放在花括号中。在构建字符串时，每个表达式都会被其值替换并插入到字符串中。结果只是一个普通的字符串——这里没有新的类型：\n\
  \n```python\n>>> type(f'hello')\n<class 'str'>\n>>> type(f'{num1} days')\n<class\
  \ 'str'>\n```\n\n花括号中的表达式可以比单独的变量名更复杂：\n\n```python\n>>> f'The sum is {num1 + num2\
  \ + num3}'\n'The sum is 100'\n```\n\n我们可以在《老虎机》的最后一行动态构建字符串。如下所示：\n\n```python\n\
  print(f'Martha plays {plays} times before going broke.')\n```\n\n即使在这样最简单的字符串格式化场景中，我认为\
  \ f-string 也能增加清晰度。当你发现自己正在用零碎部分构建字符串时，请记住这一点。\n\n关于 f-string 有一个警告：它们是在 Python\
  \ 3.6 中新增的，在撰写本文时，Python 3.6 仍算一个比较新的版本。在较旧版本的 Python 中，f-string 会导致语法错误。\n\n如果你使用\
  \ f-string，请务必确认你提交代码的评测系统使用的是 Python 3.6 或更高版本来测试你的代码。\n\n在继续之前，你可能想尝试解决第 99 页“章节练习”中的练习\
  \ 1。\n\n## 问题 #9：歌曲播放列表\n\n有时我们无法预先知道会提供多少输入。我们将在本问题中看到，在这种情况下，while 循环正是我们所需要的。\n\
  \n这是 DMOJ 问题 ccc08j2。\n\n### 挑战\n\n我们有五首最喜欢的歌曲，分别名为 A、B、C、D 和 E。我们为这些歌曲创建了一个播放列表，并使用一款应用来管理它。歌曲初始顺序为\
  \ A、B、C、D、E。该应用有四个按钮：\n\n- 按钮 1：将播放列表中的第一首歌移动到播放列表末尾。例如，如果当前播放列表是 A、B、C、D、E，则变为\
  \ B、C、D、E、A。\n- 按钮 2：将播放列表中的最后一首歌移动到播放列表开头。例如，如果当前播放列表是 A、B、C、D、E，则变为 E、A、B、C、D。\n\
  - 按钮 3：交换播放列表中的前两首歌。例如，如果当前播放列表是 A、B、C、D、E，则变为 B、A、C、D、E。\n- 按钮 4：播放播放列表！\n\n我们会收到用户的按键输入。当用户按下按钮\
  \ 4 时，输出播放列表中歌曲的顺序。\n\n### 输入\n\n输入由成对的行组成，其中每对的第一行给出按钮编号（1、2、3 或 4），第二行给出用户按下该按钮的次数（介于\
  \ 1 和 10 之间）。也就是说，第一行是按钮编号，第二行是次数\n\n字符串的第一个字符位于索引 0，而不是 1。我们可以将该字符放到字符串末尾，像这样：\n\
  \n```python\n>>> songs = 'ABCDE'\n>>> songs = songs[1] + songs[2] + songs[3] + songs[4]\
  \ + songs[0]\n>>> songs\n'BCDEA'\n```\n\n这种做法相当笨拙，而且只适用于正好有五首歌的情况。我们可以使用字符串切片来编写更通用、更不容易出错的代码。\n\
  \n*切片*是一个 Python 特性，它允许我们引用字符串的子串。（事实上，它对任何序列都适用，我们将在本书后面看到。）它接受两个索引：我们希望开始的位置索引，以及我们希望结束位置右侧的那个索引。例如，如果我们使用索引\
  \ 4 和 8，那么我们会得到索引 4、5、6 和 7 处的字符。切片使用方括号，两个索引之间用冒号分隔：\n\n```python\n>>> s = 'abcdefghijk'\n\
  >>> s[4:8]\n'efgh'\n```\n\n切片操作不会改变 s 所引用的内容。我们可以使用赋值语句让 s 引用这个切片：\n\n```python\n\
  >>> s\n'abcdefghijk'\n>>> s = s[4:8]\n>>> s\n'efgh'\n```\n\n这里很容易出现差一错误，以为 `s[4:8]`\
  \ 包含索引 8 处的字符。但事实并非如此，就像 `range(4, 8)` 不包含 8 一样。因此，虽然这个行为可能有点违反直觉，但它在 `range` 和切片中的表现是一致的。\n\
  \n在执行字符串切片时，我们必须始终包含冒号，但开始和结束索引是可选的。如果我们省略开始索引，Python 会从索引 0 开始切片：\n\n```python\n\
  >>> s = 'abcdefghijk'\n>>> s[:4]\n'abcd'\n```\n\n\n\n## 概念检查\n\n以下代码的输出是什么？\n\n\
  ```\ngame = 'Lost Vikings'\n\nprint(game[2:-6])\n```\n\n- A. st V\n- B. ost V\n\
  - C. iking\n- D. st Vi\n- E. Viking\n\n答案：A。索引 2 处的字符是 'Lost' 中的 's'。索引 -6 处的字符是\
  \ 'Vikings' 中的第一个 'i'。由于我们从索引 2 开始，直到但不包括索引 -6 结束，因此我们得到切片 'st V'。\n\n## 概念检查\n\n\
  哪个密码能让我们退出以下循环？\n\n```\nvalid = False\n\nwhile not valid:\n    s = input()\n   \
  \ valid = len(s) == 5 and s[:2] == 'xy'\n```\n\n- A. xyz\n- B. xyabc\n- C. abcxy\n\
  - D. 上述多个密码都能让我们退出循环\n- E. 没有；循环从不执行，因此无法获取任何密码\n\n答案：B。当 valid 为 True 时，while 循环终止（因为此时\
  \ not valid 为 False）。给定的密码中，只有 xyabc 的长度为 5 且前两个字符为 'xy'。因此，它是唯一能使 valid 设为 True\
  \ 并结束循环的给定密码。\n\n## 解决问题\n\n既然我们已经练习了使用 while 循环在仍有按钮待处理时进行循环，以及使用切片进行字符串操作，我们现在准备解决“歌曲播放列表”问题。代码请参见清单\
  \ 4-3。\n\n```\nsongs = 'ABCDE'\n\nbutton = 0\n\nwhile button != 4:\n    button =\
  \ int(input())\n    presses = int(input())\n    for i in range(presses):\n     \
  \   if button == 1:\n            songs = songs[1:] + songs[0]\n        elif button\
  \ == 2:\n            songs = songs[-1] + songs[:-1]\n        elif button == 3:\n\
  \            songs = songs[1] + songs[0] + songs[2:]\n\noutput = ''\nfor song in\
  \ songs:\n    output = output + song + ' '\n\nprint(output[:-1])\n```\n\n*清单 4-3：解决歌曲播放列表*\n\
  \n只要还没有按下按钮 4，while 循环就会继续 ❶。在 while 循环的每次迭代中，我们读取按钮编号，然后读取该按钮被按下的次数。\n\n现在，嵌套在外部\
  \ while 循环内部，我们需要为每次按钮按下循环一次。在决定使用哪种循环时，请记住所有的循环类型。在这里，range for 循环是最佳选择 ②，因为它是我们指定确切循环次数最容易的方式。\n\
  \nrange for 循环内部的行为取决于按下了哪个按钮。因此，我们使用 if 语句检查按钮编号并相应地修改播放列表。如果按下按钮 1，我们使用切片将第一首歌移到播放列表的末尾\
  \ ③。如果按下按钮 2，我们使用切片将最后一首歌移到播放列表的开头 ④。为此，我们从字符串右端的字符开始，然后使用切片附加所有其他字符。对于按钮 3，我们需要修改播放列表，使前两首歌交换位置。我们构建一个新的字符串，包含索引\
  \ 1 处的字符，然后是索引 0 处的字符，然后是索引 2 及之后的所有字符 ⑤。\n\n一旦我们退出 while 循环，我们需要输出歌曲，每对歌曲之间有一个空格。我们不能直接输出\
  \ songs，因为它没有空格。相反，我们构建一个带有适当空格的输出字符串。为此，我们从空字符串开始 ⑥，然后使用 for 循环连接每首歌曲和一个空格。一个小麻烦是，这会在字符串末尾，即最后一首歌之后，添加一个空格，而这是我们不想要的。因此，我们使用切片移除该末尾空格字符\
  \ ⑦。\n\n现在你准备好提交给评判系统了。\n\n在继续之前，你可能想尝试解决第 99 页“章节练习”中的练习 3。\n\n## 问题 #10：秘密句子\n\
  \n即使我们有一个字符串，并且知道将提供多少输入，while 循环仍可能是所需的循环类型。这个问题说明了为什么会出现这种情况。\n\n这是 DMOJ 问题 coci08c3p2。\n\
  \n### 挑战\n\nLuka 正在课堂上写一个秘密句子。他不希望老师能读懂它，所以他没有写下原始句子，而是写下了编码后的版本。在句子中的每个元音（a, e,\
  \ i, o 或 u）之后，他加上字母 p 以及该元音。例如，而不是写下句子 *i like you*，他会写下 *ipi lipikepe yopoupuu*。\n\
  \n老师获得了 Luka 的编码句子。为老师恢复 Luka 的原始句子。\n\n### 输入\n\n输入是一行文本，即 Luka 的编码句子。它由小写字母和空格组成。每对单词之间恰好有一个空格。行的最大长度是\
  \ 100 个字符。\n\n### 输出\n\n输出 Luka 的原始句子。\n\n### for 循环的另一个局限性\n\n在第 3 章中，我们学习了如何使用\
  \ for 循环处理字符串。for 循环逐字符地从字符串的开头到结尾逐步遍历。在许多情况下，这正是我们想要的。例如，在“三个杯子”中，我们需要从左到右查看每次交换，因此我们使用针对交换字符串的\
  \ for 循环。\n\n在其他情况下，这种限制过于严格，range for 循环可能更合适。range for 循环让我们能够访问索引而不是字符。它还允许我们以我们选择的任意步长跳过序列。例如，我们可以使用\
  \ range for 循环访问字符串中每隔两个字符（即第三个字符）：\n\n```\n```python\n>>> s = 'zephyr'\n>>> for\
  \ i in range(0, len(s), 3):\n...     print(s[i])\n...\nz\nh\n```\n```\n\n我们还可以使用\
  \ range for 循环从右到左而不是从左到右处理字符串：\n\n```\n```python\n>>> for i in range(len(s) - 1,\
  \ -1, -1):\n...     print(s[i])\n...\n```\n```\n\nr\ny\nh\np\ne\nz\n\n所有这些都假设我们希望每次迭代时以固定数量步进。\n\
  \n如果我们有时希望向右移动一个字符，而其他时候希望向右移动三个字符，该怎么办？这并不完全异想天开。事实上，如果我们能做到这一点，我们就在解决“秘密句子”问题的道路上迈出了重要一步。\n\
  \n为了解释原因，考虑这个测试用例：\n\nipi lipikepe yopoupu\n\n假设我们正在通过向 Luka 的原始句子复制字符来重建它。编码句子中的第一个字符是元音\
  \ i。这也是 Luka 原始句子的第一个字符。根据 Luka 编码句子，我们知道接下来的两个字符将是 p 和 i。我们不希望将这些字符包括在 Luka 的原始句子中，因此我们需要跳过它们。也就是说，在处理完索引\
  \ 0 之后，我们希望跳转到索引 3。\n\n索引 3 是一个空格字符。由于它不是元音，我们原封不动地将此字符复制到 Luka 的原始句子中，然后移动到索引 4。索引\
  \ 4 是 l，另一个非元音，因此我们也复制它并移动到索引 5。在索引 5 这里，我们有一个元音；复制它之后，我们希望跳转到索引 8。\n\n这里的步长是多少？有时我们跳跃三个，但并不总是如此。有时我们跳跃一个，但并不总是如此。这是三和一的混合。for\
  \ 循环并不是为这种处理设计的。\n\n使用 while 循环，我们可以按照自己的意愿在字符串中快速移动，不受预定义步长的束缚。\n\n### 通过索引使用 while\
  \ 循环\n\n编写遍历字符串索引的 while 循环与编写其他任何类型的 while 循环没有不同。我们只需要融入字符串的长度。以下是如何从左到右遍历字符串中每个字符的方法：\n\
  \n```\n>>> s = 'zephyr'\n>>> i = 0\n① >>> while i < len(s):\n...     print('We have\
  \ ' + s[i])\n...     i = i + 1\n...\nWe have z\nWe have e\nWe have p\nWe have h\n\
  We have y\nWe have r\n```\n\n变量 i 允许我们访问字符串中的每个字符。它从 0 开始，每次循环迭代增加 1。\n\n我在循环的布尔表达式中使用\
  \ < ① 以便在未达到字符串长度之前继续。如果我使用 <= 代替 <，我们将收到一个 IndexError：\n\n```\n>>> i = 0\n>>> while\
  \ i <= len(s):\n...     print('We have ' + s[i])\n...     i = i + 1\n...\nWe have\
  \ z\nWe have e\nWe have p\nWe have h\nWe have y\nWe have r\nTraceback (most recent\
  \ call last):\n  File \"<stdin>\", line 2, in <module>\nIndexError: string index\
  \ out of range\n```\n\n字符串的长度为 6。我们收到此错误是因为循环试图访问 s[6]，这不是字符串中的有效索引。\n\n想要每次跳跃三个字符而不是一个来遍历字符串？没问题；只需将\
  \ i 增加 3 而不是 1：\n\n```\n>>> i = 0\n>>> while i < len(s):\n...     print('We have\
  \ ' + s[i])\n...     i = i + 3\n```\n\n\n\n\n\nWe have z\nWe have h\n\nWe can also\
  \ go from right to left instead of left to right. We have to start at len(s) - 1\
  \ instead of 0, and we have to decrease i on each iteration rather than increase\
  \ it. We also have to change the loop’s Boolean expression to detect when we’re\
  \ at the beginning of the string rather than the end. Here’s how we go from right\
  \ to left, looping through each character:\n\n```\n>>> i = len(s) - 1\n>>> while\
  \ i >= 0:\n...   print('We have ' + s[i])\n...   i = i - 1\n...\n```\n\nWe have\
  \ r\nWe have y\nWe have h\nWe have p\nWe have e\nWe have z\n\nA final use case for\
  \ a while loop on a string: stopping at the first index that meets some criterion.\n\
  \nThe strategy is to use the Boolean and operator to continue while there are more\
  \ characters to check and we haven’t yet met our criterion. For example, here is\
  \ how we can find the index of the first 'y' in a string:\n\n```\n>>> i = 0\n>>>\
  \ while i < len(s) and s[i] != 'y':\n...   i = i + 1\n...\n>>> print(i)\n4\n```\n\
  \nIf there’s no 'y' anywhere in the string, the loop stops when i equals the string\
  \ length:\n\n```\n>>> s = 'breeze'\n>>> i = 0\n>>> while i < len(s) and s[i] !=\
  \ 'y':\n...   i = i + 1\n...\n>>> print(i)\n6\n```\n\nWhen `i` refers to 6, the\
  \ first operand of `and` is False, so the loop terminates. You might wonder why\
  \ the second operand of `and` doesn’t cause an error here, since index 6 is not\
  \ a valid index in the string. The reason is that the Boolean operators use *short-circuiting\
  \ evaluation*, which means that they stop evaluating their operands if the result\
  \ of the operator is already known. For `and`, if the first operand is False, then\
  \ we know that, no matter what the second operand is, `and` will return False; Python\
  \ therefore doesn’t evaluate the second operand. Similarly, for `or`, if the first\
  \ operand is True, then `or` is guaranteed to return True, so Python doesn’t evaluate\
  \ the second operand.\n\n## Solving the Problem\n\nNow we know how to use a while\
  \ loop to loop through a string.\n\nFor Secret Sentence, we need to do something\
  \ different depending on whether we’re looking at a vowel or a nonvowel. If we’re\
  \ looking at a vowel, then we need to copy the character and jump ahead by three\
  \ characters (to skip over the p and the second occurrence of this vowel). If we’re\
  \ looking at a nonvowel, then we need to copy the character and move to the next\
  \ character. So, we always copy the current character but then move by three or\
  \ one based on whether the current character is a vowel. We can use an if statement\
  \ inside the while loop to make this decision for each character that we see.\n\n\
  A solution for Secret Sentence is in Listing 4-4.\n\n```\nsentence = input()\n\n\
  ① result = \"\"\n   i = 0\n\n② while i < len(sentence):\n      result = result +\
  \ sentence[i]\n      ③ if sentence[i] in 'aeiou':\n            i = i + 3\n     \
  \    else:\n            i = i + 1\n\n   print(result)\n```\n\n*Listing 4-4: Solving\
  \ Secret Sentence*\n\nThe result variable ① is used to build the original sentence,\
  \ one character at a time.\n\nThe while loop’s Boolean expression is the standard\
  \ one for looping until we reach the end of a string ②. In that loop, we first concatenate\
  \ the current character to the end of the result. Then we check whether the current\
  \ character is a vowel ③. Recall from “Relational Operators” in Chapter 2 that the\
  \ in operator can be used to check whether the first string occurs in the second.\
  \ If the current character is found in the string of vowels, we jump ahead by three\
  \ characters; if not, we move to the next character.\n\nOnce the loop terminates,\
  \ we have gone through the entire encoded sentence and copied the correct characters\
  \ into result. The last thing to do is therefore to output this variable.\n\nYou’re\
  \ ready to submit our code to the judge. Grepeapat wopork!\n\n## break and continue\n\
  \nIn this section, I’ll show you two other loop keywords that Python supports: break\
  \ and continue. It’s my experience that introducing these keywords leads learners\
  \ to overuse them to the detriment of the clarity of their loops, so I’ve decided\
  \ to avoid them elsewhere in the book. Nonetheless, they are occasionally useful,\
  \ and you’re likely to see them in other Python code, so let’s have a brief discussion.\n\
  \n### break\n\nThe break keyword immediately terminates a loop, no questions asked.\n\
  \nBack when we solved Song Playlist, we used a while loop that looped while the\
  \ button was not 4. We could also solve that problem using break; see Listing 4-5\
  \ for the code.\n\n```\nsongs = 'ABCDE'\n\n① while True:\n    button = int(input())\n\
  \    ② if button == 4:\n        ③ break\n    presses = int(input())\n    for i in\
  \ range(presses):\n        if button == 1:\n```\n\n```\nsongs = songs[1:] + songs[0]\n\
  elif button == 2:\n    songs = songs[-1] + songs[:-1]\nelif button == 3:\n    songs\
  \ = songs[1] + songs[0] + songs[2:]\n\noutput = \"\"\nfor song in songs:\n    output\
  \ = output + song + \" \"\n\nprint(output[:-1])\n```\n\n*Listing 4-5: Solving Song\
  \ Playlist using **break***\n\nThe loop’s Boolean expression ❶ looks suspicious:\
  \ True is always True, so at first glance it seems that this loop never terminates.\
  \ (That’s the downside to `break`. We can’t just look at the Boolean expression\
  \ to understand what must happen for the loop to terminate.) But it can terminate,\
  \ because of our use of break. If button 4 is pressed ❷, then we hit a break ❸,\
  \ which terminates the loop.\n\nLet’s see one more example of using break. In “while\
  \ Loops Through Indices” in this chapter, we wrote code to find the index of the\
  \ first 'y' in a string. Here’s how that looks using break:\n\n```\n>>> s = 'zephyr'\n\
  >>> i = 0\n>>> while i < len(s):\n...     if s[i] == 'y':\n...         break\n...\
  \     i = i + 1\n...\n>>> print(i)\n4\n```\n\nAgain, notice that the loop’s Boolean\
  \ expression is misleading: it suggests that the loop always runs until the end\
  \ of the string, but further scrutiny reveals that a break is lurking and can influence\
  \ termination.\n\nA break terminates only its own loop, not any outer loops. Here’s\
  \ an example:\n\n```\n>>> i = 0\n>>> while i < 3:\n...     j = 10\n...     while\
  \ j <= 50:\n...         print(j)\n...         if j == 30:\n```\n\n```\n❶ ...   \
  \     break\n   ...        j = j + 10\n   ...        i = i + 1\n   ...\n   10\n\
  \   20\n   30\n   10\n   20\n   30\n   10\n   20\n   30\n```\n\nNotice how the break\
  \ ❶ cuts the j loop short. But it doesn’t affect the i loop: there are three iterations\
  \ of that loop, exactly as there would be without the break ❶.\n\n### continue\n\
  \nThe continue keyword ends the current iteration of the loop without running any\
  \ more of its code. Unlike break, it does not end the loop altogether. If the loop\
  \ condition is True, then further iterations of the loop occur.\n\nHere’s an example\
  \ that uses continue to print each vowel and its index in a string:\n\n```\n>>>\
  \ s = 'zephyr'\n>>> i = 0\n>>> while i < len(s):\n❶ ...    if not s[i] in 'aeiou':\n\
  \   ...        i = i + 1\n❷ ...        continue\n❸ ...    print(s[i], i)\n   ...\
  \    i = i + 1\n   ...\n   e 1\n```\n\nIf the current character is not a vowel ❶,\
  \ then we don’t want to print it. So, we increase i by 1 to take us past this character\
  \ and then use continue ❷ to end the current iteration. If we get below the if statement\
  \ ❸, then it must mean that we’re looking at a vowel (otherwise continue would have\
  \ prevented us from getting here). We therefore output that character and increase\
  \ i by 1 to take us past this character.\n\nThe continue keyword is enticing because\
  \ it seems to give us a way to get us out of an iteration that we don’t want to\
  \ be in. “This isn’t a vowel. I’m out of here!” But an if statement can also be\
  \ used to obtain the same behavior, and the logic is often clearer:\n\n```\n>>>\
  \ s = 'zephyr'\n>>> i = 0\n>>> while i < len(s):\n...   if s[i] in 'aeiou':\n...\
  \     print(s[i], i)\n...   i = i + 1\n...\ne 1\n```\n\nRather than skip the iteration\
  \ when the current character is not a vowel, the if statement processes it when\
  \ it is a vowel.\n\n## Summary\n\nThe unifying feature of the problems in this chapter\
  \ is that we don’t know in advance how many iterations of a loop will be required.\n\
  \n- **Slot Machines** The number of iterations depends on the initial number of\
  \ quarters and the payouts of the slot machines.\n- **Song Playlist** The number\
  \ of iterations depends on how many buttons were pressed.\n- **Secret Sentence**\
  \ The number of iterations, and what to do on each iteration, depends on where vowels\
  \ are located in a string.\n\nWhen the number of iterations is unknown, we turn\
  \ to the while loop, which runs as long as needed. Using a while loop is more error-prone\
  \ than code that uses a for loop. It’s also more flexible, as we are freed from\
  \ the for loop constraint of systematically looping through a sequence.\n\nIn the\
  \ next chapter, we’ll learn about lists, which allow us to store large amounts of\
  \ numeric or string data. And how do you suppose we’ll process all of that data?\
  \ Yes: loops! Practice the following exercises to hone your loop skills. You’ll\
  \ be using them a lot when we solve problems using lists.\n\n\n\n\n"
- "## 5\n\n## 使用列表组织值\n\n![](img/3e15323aee4cec3bf673834bfafe8024_142_0.png)\n\n我们已经看到可以使用字符串来处理字符序列。在本章中，我们将学习列表（list），它帮助我们处理其他类型值的序列，例如整数和浮点数。我们还将学习如何在列表中嵌套列表，从而处理数据网格。\n\
  \n我们将使用列表解决三个问题：找出若干村庄的最小邻域、判断学校旅行是否筹集到足够的资金，以及计算面包店提供的奖励数量。\n\n## 问题 #11：村庄邻域\n\
  \n在这个问题中，我们要找出一组村庄中最小邻域的大小。我们发现存储所有邻域大小会很有帮助。不过村庄可能有100个之多，为每个村庄使用单独的变量将是一场噩梦。我们将看到，列表允许我们把本来会是单独的变量聚合到一个集合中。我们还将学习\
  \ Python 强大的列表操作，用于修改、搜索和排序列表。\n\n这是 DMOJ 问题 ccc18s1。\n\n## 挑战\n\n一条直路上有 $n$ 个村庄，位于不同的点上。每个村庄由一个整数表示，该整数表示它在道路上的位置。\n\
  \n一个村庄的左邻居是位置次小的村庄；右邻居是位置次大的村庄。一个村庄的*邻域*由该村庄与其左邻居之间距离的一半，加上该村庄与其右邻居之间距离的一半组成。例如，如果一个村庄位于位置10，其左邻居位于位置6，右邻居位于位置15，那么这个村庄的邻域从位置8（6和10的中点）开始，到位置12.5（10和15的中点）结束。\n\
  \n最左边和最右边的村庄只有一个邻居，因此邻域的定义对它们不适用。在这个问题中，我们将忽略这两个村庄的邻域。\n\n邻域的*大小*计算为邻域最右位置减去邻域最左位置。例如，从8到12.5的邻域大小为\
  \ $12.5 - 8 = 4.5$。\n\n确定最小邻域的大小。\n\n### 输入\n\n输入由以下行组成：\n\n+   - 一行包含整数 $n$，即村庄数量。$n$\
  \ 介于 3 和 100 之间。\n+   - $n$ 行，每行给出一个村庄的位置。每个位置是介于 $-1,000,000,000$ 和 $1,000,000,000$\
  \ 之间的整数。位置不一定要从左到右依次排列；某个村庄的邻居可能出现在这些行中的任何位置。\n\n### 输出\n\n输出最小邻域的大小。在小数点后包含一位数字。\n\
  \n### 为什么使用列表？\n\n在读取输入时，我们需要读取 $n$ 个整数（表示村庄位置的整数）。我们在第3章解决 Data Plan 问题时已经处理过这种情况。当时我们使用\
  \ range for 循环精确循环了 *n* 次。我们在这里也会这样做。\n\nData Plan 和 Village Neighborhood 之间有一个关键区别。在\
  \ Data Plan 中，我们读取一个整数，使用它，之后不再引用它。我们不需要保留它。但在 Village Neighborhood 中，只看每个整数一次是不够的。一个村庄的邻域取决于其左邻居和右邻居。如果不能访问这些邻居，我们就无法计算该村庄邻域的大小。我们需要存储所有村庄位置以供后续使用。\n\
  \n关于为什么需要存储所有村庄位置，考虑这个测试用例：\n\n```\n6\n20\n50\n4\n19\n15\n1\n```\n\n这里有六个村庄。要找到某个村庄邻域的大小，我们需要该村庄的左邻居和右邻居。\n\
  \n输入中的第一个村庄位于位置20。这个村庄的邻域大小是多少？要回答这个问题，我们需要访问所有村庄位置，以便找到它的左邻居和右邻居。扫描这些位置，你可以确定左邻居位于位置19，右邻居位于位置50。因此这个村庄的邻域大小为\
  \ (20 − 19)/2 + (50 − 20)/2 = 15.5。\n\n输入中的第二个村庄位于位置50。这个村庄的邻域大小是多少？同样，我们需要查看这些位置才能弄清楚。这个村庄恰好是最右边的村庄，所以我们忽略这个村庄的邻域。\n\
  \n输入中的第三个村庄位于位置4。左邻居位于位置1，右邻居位于位置15，所以这个村庄的邻域大小为 (4 − 1)/2 + (15 − 4)/2 = 7。\n\n\
  输入中的第四个村庄位于位置19。左邻居位于位置15，右邻居位于位置20，所以这个村庄的邻域大小为 (19 − 15)/2 + (20 − 19)/2 = 2.5。\n\
  \n唯一还需要考虑的村庄位于位置15。如果你计算它的邻域大小，应该得到7.5。\n\n比较我们计算的所有邻域大小，可以看到最小值——也是这个测试用例的正确回答——是2.5。\n\
  \n我们需要一种方法来存储所有村庄位置，以便能够找到每个村庄的邻居。字符串不行，因为字符串存储字符，而不是整数。Python 列表来拯救我们！\n\n## 列表\n\
  \n*列表*是一种 Python 类型，存储一个值序列。（你有时会看到列表值被称为*元素*。）我们使用左方括号和右方括号来界定列表。\n\n我们只能在字符串中存储字符，但可以在列表中存储任何类型的值。这个整数列表保存了前一部分中的村庄位置。\n\
  \n```\n>>> [20, 50, 4, 19, 15, 1]\n[20, 50, 4, 19, 15, 1]\n```\n\n这是一个字符串列表：\n\n\
  ```\n>>> ['one', 'two', 'hello']\n['one', 'two', 'hello']\n```\n\n我们甚至可以创建一个包含不同类型值的列表：\n\
  \n```\n>>> ['hello', 50, 365.25]\n['hello', 50, 365.25]\n```\n\n你学到的关于字符串的许多内容也适用于列表。例如，列表支持\
  \ + 运算符进行连接，以及 * 运算符进行复制：\n\n```\n>>> [1, 2, 3] + [4, 5, 6]\n[1, 2, 3, 4, 5, 6]\n\
  >>> [1, 2, 3] * 4\n[1, 2, 3, 1, 2, 3, 1, 2, 3, 1, 2, 3]\n```\n\n我们甚至还有 in 运算符，它可以告诉我们一个值是否在列表中：\n\
  \n```\n>>> 'one' in ['one', 'two', 'hello']\nTrue\n```\n\n```\n>>> 'n' in ['one',\
  \ 'two', 'three']\nFalse\n```\n\n我们还有 len 函数来获取列表的长度：\n\n```\n>>> len(['one', 'two',\
  \ 'hello'])\n3\n```\n\n列表是一个序列，我们可以使用 for 循环遍历其值：\n\n```\n>>> for value in [20,\
  \ 50, 4, 19, 15, 1]:\n... print(value)\n20\n50\n4\n19\n15\n1\n```\n\n我们可以让变量引用列表，就像我们让它们引用字符串、整数和浮点数一样。让我们让两个变量引用列表，然后将它们连接起来生成一个新列表。\n\
  \n```\n>>> lst1 = [1, 2, 3]\n>>> lst2 = [4, 5, 6]\n>>> lst1 + lst2\n[1, 2, 3, 4,\
  \ 5, 6]\n```\n\n虽然我们显示了连接后的列表，但我们并没有存储它，这可以通过再次查看列表来确认：\n\n```\n>>> lst1\n[1, 2,\
  \ 3]\n>>> lst2\n[4, 5, 6]\n```\n\n要让一个变量引用连接后的列表，我们使用赋值：\n\n```\n>>> lst3 = lst1\
  \ + lst2\n>>> lst3\n[1, 2, 3, 4, 5, 6]\n```\n\n当不需要更具体地说明列表包含什么时，可以使用 `lst`、`lst1`\
  \ 和 `lst2` 这样的名称。\n\n但不要使用 `list` 本身作为变量名。它已经是一个可以用来将序列转换为列表的名称：\n\n```\n>>> list('abcde')\n\
  ['a', 'b', 'c', 'd', 'e']\n```\n\n如果你命名一个变量为 `list`，你将失去这个有价值的行为，并且会让读者感到困惑，因为他们期望\
  \ `list` 不被篡改。\n\n最后，列表支持索引和切片。索引返回单个值，切片返回一个值的列表：\n\n```\n>>> lst=[50, 30, 81,\
  \ 40]\n>>> lst[1]\n30\n>>> lst[-2]\n81\n>>> lst[1:3]\n[30, 81]\n```\n\n如果我们有一个字符串列表，我们可以通过两次索引访问其中一个字符串的字符：第一次选择一个字符串，第二次选择一个字符：\n\
  \n```\n>>> lst= ['one', 'two', 'hello']\n>>> lst[2]\n'hello'\n>>> lst[2][1]\n'e'\n\
  ```\n\n## 概念检查\n\n以下代码在 total 变量中存储了什么？\n\n```\nlst= [a list of numbers]\ntotal\
  \ = 0\ni = 1\n\nwhile i <= len(lst):\n```\n\n\n\n\n```python\ntotal = total + i\n\
  i = i + 1\n```\n\n- A. 列表的总和\n- B. 列表的总和，但不包括它的第一个值\n- C. 列表的总和，但不包括它的第一个和最后一个值\n\
  - D. 这段代码会导致错误，因为它访问了列表中的一个无效索引\n- E. 以上都不对\n\n答案：E. 这段代码将 1、2、3 等数字相加，一直加到列表的长度。它并没有把列表中的数字相加，也完全没有对列表进行索引！\n\
  \n## 列表的可变性\n\n字符串是*不可变的*，这意味着它们无法被修改。当我们看起来是在修改一个字符串时（例如使用字符串拼接），实际上是在创建一个新的字符串，而不是修改一个已经存在的字符串。\n\
  \n另一方面，列表是*可变的*，这意味着它们*可以*被修改。\n\n我们可以通过索引来观察这种差异。如果我们试图修改字符串中的一个字符，就会得到一个错误：\n\n\
  ```python\n>>> s = 'hello'\n>>> s[0] = 'j'\nTraceback (most recent call last):\n\
  \  File \"<stdin>\", line 1, in <module>\nTypeError: 'str' object does not support\
  \ item assignment\n```\n\n错误消息说明字符串不支持元素赋值，也就是说我们不能修改它们的字符。\n\n但因为列表是可变的，所以我们可以修改它们的值：\n\
  \n```python\n>>> lst = ['h', 'e', 'l', 'l', 'o']\n>>> lst\n['h', 'e', 'l', 'l',\
  \ 'o']\n>>> lst[0] = 'j'\n>>> lst\n['j', 'e', 'l', 'l', 'o']\n>>> lst[2] = 'x'\n\
  >>> lst\n['j', 'e', 'x', 'l', 'o']\n```\n\n如果对赋值语句没有精确的理解，可变性可能会导致看似令人费解的行为。下面是一个例子：\n\
  \n```python\n>>> x = [1, 2, 3, 4, 5]\n➊ >>> y = x\n>>> x[0] = 99\n>>> x\n[99, 2,\
  \ 3, 4, 5]\n```\n\n到目前为止还没有什么意外。但这个结果可能会让你感到惊讶：\n\n```python\n>>> y\n[99, 2, 3,\
  \ 4, 5]\n```\n\n那个 99 是怎么进到 y 里去的？\n\n当我们在➊处将 x 赋值给 y 时，y 被设置为引用与 x 相同的列表。赋值语句并不会复制列表。这里只有一个列表，只不过它恰好有两个名字（或称别名）指向它。因此，如果我们对该列表做了修改，无论我们用\
  \ x 还是 y 来引用这个列表，都会看到这个修改。\n\n可变性很有用，因为它直接模拟了我们可能想对列表中各个值进行的操作。如果我们想改变某个值，直接修改它即可。如果没有可变性，就无法修改一个值。我们就必须创建一个新列表，除了我们想要修改的那个值之外，其余和旧列表相同。这样做虽然可行，但修改值的方式绕了弯子，也不够直观。\n\
  \n如果你确实想要列表的一个副本，而不只是它的另一个名字，可以使用切片。省略起始索引和结束索引，就会得到整个列表的副本：\n\n```python\n>>> x\
  \ = [1, 2, 3, 4, 5]\n>>> y = x[:]\n>>> x[0] = 99\n>>> x\n[99, 2, 3, 4, 5]\n>>> y\n\
  [1, 2, 3, 4, 5]\n```\n\n请注意，这一次当 x 列表改变时，y 列表并没有改变。它们是两个独立的列表。\n\n### 概念检查\n\n下面这段代码的输出是什么？\n\
  \n```python\nlst = ['abc','def','ghi']\nlst[1] = 'wxyz'\n\nprint(len(lst))\n```\n\
  \n- A. 3\n- B. 9\n- C. 10\n- D. 4\n- E. 这段代码会产生一个错误\n\n答案：A. 修改列表中的值是允许的（因为列表是可变的）。但把索引\
  \ 1 处的值改成一个更长的字符串，并不能改变列表仍然有三个值这一事实。\n\n## 了解方法\n\n与字符串一样，列表也有很多有用的方法。在下一节中我会介绍其中的一些，但首先我想让你知道如何自己了解一个方法。\n\
  \n你可以使用 Python 的 dir 函数来获取某个特定类型的方法列表。只要调用 dir 并以一个值作为参数，你就会得到该值所属类型的方法。\n\n下面是我们用一个字符串值作为参数调用\
  \ dir 时得到的结果：\n\n```python\n>>> dir('')\n['__add__', '__class__', '__contains__',\
  \ '__delattr__',\n<more stuff with underscores>\n'capitalize', 'casefold', 'center',\
  \ 'count', 'encode',\n'endswith', 'expandtabs', 'find', 'format',\n'format_map',\
  \ 'index', 'isalnum', 'isalpha', 'isascii',\n'isdecimal', 'isdigit', 'isidentifier',\
  \ 'islower',\n'isnumeric', 'isprintable', 'isspace', 'istitle',\n'isupper', 'join',\
  \ 'ljust', 'lower', 'lstrip',\n'maketrans', 'partition', 'replace', 'rfind', 'rindex',\n\
  'rjust', 'rpartition', 'rsplit', 'rstrip', 'split',\n'splitlines', 'startswith',\
  \ 'strip', 'swapcase', 'title',\n'translate', 'upper', 'zfill']\n```\n\n注意，我们是用一个空字符串调用\
  \ dir 的。我们也可以用任意字符串值来调用 dir；空字符串只是输入起来最快而已。\n\n忽略顶部那些带下划线的名称；这些名称是 Python 内部使用的，通常程序员不会关注它们。其余名称都是你可以调用的字符串方法。在这个列表中，你会看到一些你已经知道的字符串方法，比如\
  \ isupper 和 count，还有许多我们还没遇到过的其他方法。\n\n要了解某个方法的用法，可以在调用 help 时使用该方法的名称。下面是我们针对字符串的\
  \ count 方法获得的帮助：\n\n```python\n>>> help(''.count)\nHelp on built-in function count:\n\
  \ncount(...) method of builtins.str instance\n    S.count(sub[, start[, end]]) ->\
  \ int\n\n    Return the number of non-overlapping occurrences of\n    substring\
  \ sub in string S[start:end]. Optional\n    arguments start and end are interpreted\
  \ as in\n    slice notation.\n```\n\n帮助信息告诉了我们如何调用该方法（①）。\n\n方括号表示可选参数。如果你只想在字符串的某个切片内统计\
  \ sub 的出现次数，就可以使用 start 和 end。\n\n浏览方法列表是值得的，这样可以看看是否有方法能帮助你完成当前的编程任务。即使你以前用过某个方法，查看帮助也可能让你发现一些之前不知道的功能！\n\
  \n要查看有哪些列表方法可用，可以调用 `dir([])`。要了解它们，可以调用 `help([].xxx)`，其中 **xxx** 是某个列表方法的名称。\n\
  \n### 概念检查\n\n下面是字符串 center 方法的帮助信息：\n\n```python\n>>> help(\".center\")\nHelp on\
  \ built-in function center:\n\ncenter(width, fillchar=' ', /) method of builtins.str\
  \ instance\n    Return a centered string of length width.\n\n    Padding is done\
  \ using the specified fill character\n    (default is a space).\n```\n\n下面这段代码生成的字符串是什么？\n\
  \n```python\n'cave'.center(8, 'x')\n```\n\n- A. `'xxcavexx'`\n- B. `' cave '`\n\
  - C. `'xxxxcavexxxx'`\n- D. `'  cave  '`\n\n答案：A. 我们以宽度 8 和 fillchar 为 'x' 调用 center。（如果我们只提供一个参数，fillchar\
  \ 就会使用空格。）因此，结果字符串的长度为 8。字符串 'cave' 有 4 个字符，所以还需要 4 个字符才能达到长度 8。于是 Python 在字符串开头和结尾各添加两个空格，使其居中。\n\
  \n![](img/3e15323aee4cec3bf673834bfafe8024_153_0.png)\n\n## 列表方法\n\n是时候在“村庄邻里”问题上取得进展了。我能想到两种对列表的操作，它们能帮助解决这个问题。\n\
  \n第一种是向列表中添加元素。我们一开始没有任何村庄位置，而是从输入中一次读取一个位置。因此，我们需要一种方法，把每个位置逐个添加到一个不断增长的列表中：一开始列表为空，然后包含一个村庄位置，接着两个，以此类推。\n\
  \n第二种是对列表进行排序。读入所有村庄位置后，我们需要找出最小的邻里。这需要查看每个村庄位置以及它到左、右邻居的距离。村庄位置可能以任意顺序输入，所以一般来说，要找到一个给定村庄的邻居并不容易。回想一下我们在本章“为什么需要列表？”一节中所做的工作。当时对每个村庄，我们都要扫描整个列表才能找到它的邻居。如果村庄按照位置排序，就会容易得多。那样我们就能确切地知道邻居在哪里：它们就在一个村庄的紧左边和紧右边。\n\
  \n例如，下面是我们样例中的村庄按读取顺序排列的样子：\n\n```\n20 50 4 19 15 1\n```\n\n这简直一团糟！在真实的街道上，它们会按照位置顺序排列，就像这样：\n\
  \n```\n1 4 15 19 20 50\n```\n\n想知道位于位置 4 的村庄的邻居？只要看紧挨着它的左边和右边：1 和 15。位置 15 的村庄的邻居呢？瞧，它们就在那里——4\
  \ 和 19。不用再到处搜索了。我们将对村庄位置列表进行排序，以简化代码。\n\n我们可以使用 append 方法向列表中添加元素，使用 sort 方法对列表进行排序。我们会学习这两个方法，以及另外几个在你继续使用列表时可能会觉得有用的方法，然后再回来解决“村庄邻里”问题。\n\
  \n\n\n\n这里有一个示例：\n\n```python\n>>> lst1 = [1, 2, 3]\n>>> lst2 = [4, 5, 6]\n>>> lst1.extend(lst2)\n\
  >>> lst1\n[1, 2, 3, 4, 5, 6]\n>>> lst2\n[4, 5, 6]\n```\n\n如果你想在列表的末尾以外的位置插入元素，可以使用\
  \ insert 方法。它接受一个索引和一个值，并将该值插入到索引处：\n\n```python\n>>> lst = [10, 20, 30, 40]\n>>>\
  \ lst.insert(1, 99)\n>>> lst\n[10, 99, 20, 30, 40]\n```\n\n## 对列表进行排序\n\nsort 方法会对列表进行*排序*，将其值按顺序排列。如果我们不带参数调用它，它会从小到大排序：\n\
  \n```python\n>>> positions = [20, 50, 4, 19, 15, 1]\n>>> positions.sort()\n>>> positions\n\
  [1, 4, 15, 19, 20, 50]\n```\n\n如果我们在调用时传入 reverse 参数，值为 True，则会从大到小排序：\n\n```python\n\
  >>> positions.sort(reverse=True)\n>>> positions\n[50, 20, 19, 15, 4, 1]\n```\n\n\
  我使用的语法 reverse=True 是新的。基于我们到目前为止在本书中调用方法和函数的方式，你可能会认为单独的 True 就可以工作。但并非如此：sort\
  \ 要求必须提供完整的 reverse=True，原因我将在第 6 章解释。\n\n## 从列表中删除值\n\npop 方法按索引删除值。如果未提供参数，pop\
  \ 会删除并返回最右边的值。\n\n```python\n>>> lst = [50, 30, 81, 40]\n>>> lst.pop()\n40\n```\n\
  \n我们可以将待删除值的索引作为参数传给 pop。这里，我们删除并返回索引 0 处的值：\n\n```python\n>>> lst.pop(0)\n50\n\
  ```\n\n由于 pop 会返回一些东西——不像 append 和 sort 等方法——将其返回值赋给变量是有意义的：\n\n```python\n>>> lst\n\
  [30, 81]\n>>> value = lst.pop()\n>>> value\n81\n>>> lst\n[30]\n```\n\nremove 方法按值删除，而不是按索引。将要删除的值传给它，它会从列表中删除该值的第一次出现。如果该值不存在，remove\
  \ 会产生错误。在下面的示例中，列表中有两个 50，因此 remove(50) 执行两次后才产生错误：\n\n```python\n>>> lst = [50,\
  \ 30, 81, 40, 50]\n>>> lst.remove(50)\n>>> lst\n[30, 81, 40, 50]\n>>> lst.remove(50)\n\
  >>> lst\n[30, 81, 40]\n>>> lst.remove(50)\nTraceback (most recent call last):\n\
  \  File \"<stdin>\", line 1, in <module>\nValueError: list.remove(x): x not in list\n\
  ```\n\n## 概念检查\n\n以下代码运行后，lst 的值是什么？\n\n```python\nlst = [2, 4, 6, 8]\nlst.remove(4)\n\
  lst.pop(2)\n```\n\n- A. [2, 4]\n- B. [6, 8]\n- C. [2, 6]\n- D. [2, 8]\n- E. This\
  \ code produces an error\n\n答案：C。remove 调用删除了值 4，剩下 [2, 6, 8]。现在 pop 调用删除索引 2 处的值，即值\
  \ 8。最终列表为 [2, 6]。\n\n## 解决问题\n\n假设我们已经成功读取并排序了村庄位置。此时我们的列表如下所示：\n\n```python\n>>>\
  \ positions = [1, 4, 15, 19, 20, 50]\n>>> positions\n[1, 4, 15, 19, 20, 50]\n```\n\
  \n为了找到最小邻居的大小，我们首先找到索引 1 处的村庄的邻居大小。（注意，我们不是从索引 0 开始：索引 0 处的村庄是最左边的，根据问题描述，我们可以忽略它。）我们可以这样找到该邻居大小：\n\
  \n```python\n>>> left = (positions[1] - positions[0]) / 2\n>>> right = (positions[2]\
  \ - positions[1]) / 2\n>>> min_size = left + right\n>>> min_size\n7.0\n```\n\nleft\
  \ 变量存储邻居左部分的大小，right 存储右部分的大小。然后将它们相加得到邻居的总大小。我们得到的值为 7.0。\n\n这是要超越的值。我们如何知道是否有其他村庄的邻居更小？我们可以使用循环来处理其他村庄。如果我们找到一个比当前最小值更小的邻居，我们就将当前最小值更新为该更小的值。\n\
  \n我们解决方案的代码在清单 5-1 中。\n\n```python\nn = int(input())\n\n❶ positions = []\n\n❷ for\
  \ i in range(n):\n    ❸ positions.append(int(input()))\n\n❹ positions.sort()\n\n\
  ❺ left = (positions[1] - positions[0]) / 2\nright = (positions[2] - positions[1])\
  \ / 2\nmin_size = left + right\n\n❻ for i in range(2, n - 1):\n    left = (positions[i]\
  \ - positions[i - 1]) / 2\n    right = (positions[i + 1] - positions[i]) / 2\n \
  \   size = left + right\n    ❼ if size < min_size:\n        min_size = size\n\n\
  print(min_size)\n```\n\n*清单 5-1：解决村庄邻居问题*\n\n我们首先从输入中读取 n，即村庄数量。我们还将 positions 设为引用一个空列表❶。\n\
  \n第一个 range for 循环的每次迭代❷负责读取一个村庄位置并将其追加到 positions 列表。它通过使用 input 读取下一个村庄位置，使用 int\
  \ 将其转换为整数，并使用列表方法 append 将该整数追加到列表❸来完成。这一行❸等价于以下三个独立的行：\n\n```python\nposition =\
  \ input()\nposition = int(position)\npositions.append(position)\n```\n\n读取村庄位置后，我们接下来按递增顺序对它们排序❹。然后我们找到索引\
  \ 1 处村庄的邻居大小，并将其存储到 min_size 中❺。\n\n接下来，在第二个循环中，我们遍历每个需要计算邻居大小的其他村庄❻。这些村庄从索引 2 开始，到索引\
  \ n - 2 结束。（我们不想考虑索引 n - 1 处的村庄，因为那是最右边的村庄。）因此，我们使用 range，第一个参数为 2（因此从 2 开始），第二个参数为\
  \ n - 1（因此到 n - 2 结束）。\n\n在循环内部，我们计算当前村庄的邻居大小，与我们对第一个村庄所做的方式完全相同。到目前为止找到的最小邻居大小由\
  \ min_size 表示。当前村庄的邻居是否比我们目前的最小值更小？为了回答这个问题，我们使用一个 if 语句❼。如果这个村庄的邻居比 min_size 小，我们将\
  \ min_size 更新为这个邻居的大小。如果这个村庄的邻居不比 min_size 小，那么我们什么都不做，因为这个村庄不会改变最小邻居的大小。\n\n遍历完所有村庄后，min_size\
  \ 必定是最小邻居的大小。因此我们输出 min_size 的值。\n\n本问题描述中的“输出”部分指定了“在小数点后包含一位数字”。如果最小大小是像 6.25\
  \ 或 8.33333 这样的值呢？我们不应该对此做些什么吗？\n\n不，我们目前的做法是安全的。我们能得到的唯一邻居大小是像 3.0（小数点后为 0）和 3.5（小数点后为\
  \ .5）这样的数字。原因如下：当我们计算邻居的左部分时，我们减去两个整数并将结果整数除以 2。如果除以 2 之前是偶数，那么除法得到 .0 数字（没有余数）；如果除以\
  \ 2 之前是奇数，那么除法得到 .5 数字。右部分也是如此：大小将是 .0 数字或 .5 数字。因此，将左部分和右部分相加得到的总大小也必然是 .0 或 .5\
  \ 数字。\n\n## 避免代码重复：另外两种解决方案\n\n有点令人失望的是，我们在第二个 range for 循环之前和之中都包含了“计算邻居大小”的代码。\n\
  \n一般来说，重复的代码表明我们可能能够改进代码的设计。我们希望避免重复代码，因为它增加了我们必须维护的代码量，并且如果重复的代码有缺陷，则会使修复问题变得更加困难。在这里，重复的代码在我看来是可以接受的（只有三行），但让我们讨论两种避免它的方法。这些是你可以应用于其他类似问题的一般方法。\n\
  \n### 使用一个极大值\n\n我们在循环之前计算村庄邻居大小的唯一原因是让循环有东西可以比较其他邻居大小。如果我们在没有 `min_size` 值的情况下进入循环，当代码尝试将其与当前村庄的大小进行比较时，我们会收到错误。\n\
  \n如果我们在循环前将 `min_size` 设置为 0.0，那么循环将永远找不到更小的值，并且无论测试用例如何，我们都会错误地输出 0.0。使用 0.0 会是一个\
  \ bug！\n\n但一个极大的值，一个至少与所有可能的邻居大小一样大的值，*会*有效。我们只需要让它足够大，保证循环的第一次迭代能找到不超过它的值，从而确保我们假的大值永远不会被输出。\n\
  \n根据本问题描述中的“输入”部分，我们知道每个位置在 −1,000,000,000 到 1,000,000,000 之间。那么，我们可能拥有的最大邻居出现在：一个村庄位于位置\
  \ −1,000,000,000，另一个位于位置 1,000,000,000，还有一个村庄位于两者之间。这个中间村庄的邻居大小将是 1,000,000,000。因此，我们可以将\
  \ `min_size` 初始化为 1000000000.0 或更大的值。这种替代方法见清单 5-2。\n\n```python\nn = int(input())\n\
  \npositions = []\n\nfor i in range(n):\n    positions.append(int(input()))\n\npositions.sort()\n\
  \nmin_size = 1000000000.0\n\nfor i in range(1, n - 1):\n    left = (positions[i]\
  \ - positions[i - 1]) / 2\n```\n\n\nright = (positions[i + 1] - positions[i]) /\
  \ 2\nsize = left + right\nif size < min_size:\n    min_size = size\n\nprint(min_size)\n\
  \n## 清单 5-2：使用极大值解决村庄邻域问题\n\n注意！我们现在需要从索引 1 ❶ 开始计算大小（而不是索引 2）；否则，我们会忘记包含索引 1 处村庄的邻域。\n\
  \n### 构建大小列表\n\n另一种避免代码重复的方法是将每个邻域大小存储在一个大小列表中。Python 有一个内置的 `min` 函数，它接受一个序列并返回其最小值：\n\
  \n```\n>>> min('qwerty')\n'e'\n>>> min([15.5, 7.0, 2.5, 7.5])\n2.5\n```\n\n（Python\
  \ 还有一个 `max` 函数，返回序列的最大值。）\n\n参见清单 5-3，它展示了如何在邻域大小列表上使用 `min` 的解决方案。\n\n```\nn =\
  \ int(input())\n\npositions = []\n\nfor i in range(n):\n    positions.append(int(input()))\n\
  \npositions.sort()\n\nsizes = []\n\nfor i in range(1, n - 1):\n    left = (positions[i]\
  \ - positions[i - 1]) / 2\n    right = (positions[i + 1] - positions[i]) / 2\n \
  \   size = left + right\n    sizes.append(size)\n\nmin_size = min(sizes)\nprint(min_size)\n\
  ```\n\n## 清单 5-3：使用 `min` 解决村庄邻域问题\n\n你可以随意将这两个解决方案中的任何一个提交给评测系统，选你最喜欢的即可！\n\n在继续之前，你可以尝试解决第\
  \ 134 页“章节练习”中的练习 1。\n\n## 问题 #12：学校旅行\n\n你会遇到的许多问题的输入每行都有多个整数或浮点数。到目前为止，我们一直在回避这些问题，但它们无处不在！我们现在就来学习如何使用列表处理这类问题的输入。\n\
  \n这是 DMOJ 问题 ecoo17r1p1。\n\n### 挑战\n\n学生们想在年末去学校旅行，但他们需要钱来支付费用。为了筹钱，他们组织了一顿早午餐。参加早午餐时，一年级学生付\
  \ 12 美元，二年级学生付 10 美元，三年级学生付 7 美元，四年级学生付 5 美元。\n\n在早午餐筹到的所有钱中，50% 可以用于支付学校旅行（另外 50%\
  \ 用于支付早午餐本身的费用）。\n\n我们已知学校旅行的费用、每个年级学生的比例以及学生总数。请判断学生们是否还需要为学校旅行筹集更多钱。\n\n### 输入\n\
  \n输入包含 10 个测试用例，每个测试用例有三行（共 30 行）。以下是每个测试用例的三行：\n\n- 第一行包含学校旅行的费用（以美元为单位）；它是一个介于\
  \ 50 和 50,000 之间的整数。\n- 第二行包含四个数字，分别表示参加早午餐的学生中一年级、二年级、三年级和四年级的比例。每对数字之间有一个空格。每个数字在\
  \ 0 和 1 之间，它们的和为 1（即 100%）。\n- 第三行包含整数 n，即参加早午餐的学生人数。n 在 4 和 2,000 之间。\n\n### 输出\n\
  \n对于每个测试用例：如果学生们需要为学校旅行筹集更多钱，则输出 YES；否则，输出 NO。\n\n### 一个陷阱\n\n假设有 50 名学生，其中 10%（即比例为\
  \ 0.1）是四年级学生。那么我们可以计算出 50 * 0.1 = 5 名四年级学生。\n\n现在假设有 50 名学生，但其中 15%（即比例为 0.15）是四年级学生。如果我们相乘，得到\
  \ 50 * 0.15 = 7.5 名四年级学生。\n\n有 7.5 名学生毫无意义，而且我还没有告诉你在这种情况下我们应该怎么做。完整的问题描述规定我们应该向下取整——所以这里我们应该取整为\
  \ 7。这可能导致一年级、二年级、三年级和四年级学生人数之和不等于学生总数。对于未被计入的学生，我们要把他们加到学生人数最多的年级。题目保证恰好有一个年级的学生人数最多（不会出现多个年级并列最多的情况）。\n\
  \n我们将先忽略这个陷阱来解决问题。然后我们会加入这个陷阱，给出完整的解决方案。\n\n### 拆分字符串与连接列表\n\n每个测试用例的第二行由四个比例组成，如下所示：\n\
  \n```\n0.2 0.08 0.4 0.32\n```\n\n我们需要一种方法从字符串中提取这四个数字，以便进一步处理。我们将学习字符串的 `split`\
  \ 方法，用于将字符串拆分成其组成部分的列表。同时，我们还将学习字符串的 `join` 方法，它让我们反方向操作，将列表合并成单个字符串。\n\n### 将字符串拆分为列表\n\
  \n请记住，无论输入看起来如何，`input` 函数返回的都是字符串。如果输入应解释为整数，我们需要将字符串转换为整数。如果输入应解释为浮点数，我们需要将字符串转换为浮点数。如果输入应解释为四个浮点数呢？那么，我们最好在转换任何内容之前先把它拆分成单独的浮点数！\n\
  \n字符串 `split` 方法将字符串拆分成其组成部分的列表。默认情况下，`split` 按空格拆分，这正是我们处理四个浮点数所需要的：\n\n```\n>>>\
  \ s = '0.2 0.08 0.4 0.32'\n>>> s.split()\n['0.2', '0.08', '0.4', '0.32']\n```\n\n\
  `split` 方法返回一个字符串列表，此时我们可以独立访问每个元素。这里，我保存了 `split` 返回的列表，然后访问了其中的两个值：\n\n```\n>>>\
  \ proportions = s.split()\n>>> proportions\n['0.2', '0.08', '0.4', '0.32']\n>>>\
  \ proportions[1]\n'0.08'\n>>> proportions[2]\n'0.4'\n```\n\n实际中的数据通常是以逗号分隔的，而不是以空格分隔的。小菜一碟：我们可以调用\
  \ `split` 并传入一个参数，告诉它用什么作为分隔符：\n\n```\n>>> info = 'Toronto,Ontario,Canada'\n>>>\
  \ info.split(',')\n['Toronto', 'Ontario', 'Canada']\n```\n\n### 将列表连接成字符串\n\n要反方向操作，从列表到字符串而不是从字符串到列表，我们可以使用字符串的\
  \ `join` 方法。调用 `join` 的字符串被用作列表值之间的分隔符。这里有两个例子：\n\n```\n>>> lst = ['Toronto', 'Ontario',\
  \ 'Canada']\n>>> ','.join(lst)\n'Toronto,Ontario,Canada'\n```\n\n```\n>>> '**'.join(lst)\n\
  'Toronto**Ontario**Canada'\n```\n\n严格来说，`join` 可以连接任何序列中的值，而不仅仅是列表。这里有一个连接字符串中字符的例子：\n\
  \n```\n>>> '*'.join('abcd')\n'a*b*c*d'\n```\n\n### 修改列表值\n\n当我们对包含四个部分的字符串使用 `split`\
  \ 时，会得到一个字符串列表：\n\n```\n>>> s = '0.2 0.08 0.4 0.32'\n>>> proportions = s.split()\n\
  >>> proportions\n['0.2', '0.08', '0.4', '0.32']\n```\n\n在第 1 章的“在字符串和整数之间转换”中，我们学到了看起来像数字的字符串不能用于数值计算。因此，我们需要将这个字符串列表转换为浮点数列表。\n\
  \n我们可以使用 `float` 将字符串转换为浮点数，如下所示：\n\n```\n>>> float('45.6')\n45.6\n```\n\n这只是一个浮点数。我们如何将整个字符串列表转换为浮点数列表呢？尝试使用下面的循环来实现这一点是非常诱人的：\n\
  \n```\n>>> for value in proportions:\n...     value = float(value)\n```\n\n逻辑是这样的：这个循环应该遍历列表中的每个值，并将其转换为浮点数。\n\
  \n遗憾的是，它不起作用。列表仍然引用的是字符串：\n\n```\n>>> proportions\n['0.2', '0.08', '0.4', '0.32']\n\
  ```\n\n哪里可能出错了？是 `float` 不起作用吗？我们可以通过查看转换后 `value` 的类型来看到 `float` 工作得很好：\n\n```\n\
  >>> for value in proportions:\n...   value = float(value)\n...   type(value)\n...\n\
  <class 'float'>\n<class 'float'>\n<class 'float'>\n<class 'float'>\n```\n\n四个浮点数！但列表仍然顽固地是字符串列表。\n\
  \n这里发生的情况是，我们并没有改变列表中引用的值。我们改变的是变量 `value` 所引用的对象，但这并不能改变列表仍然引用旧字符串值的事实。要真正改变列表引用的值，我们需要在列表的索引处赋予新值。做法如下：\n\
  \n```\n>>> proportions\n['0.2', '0.08', '0.4', '0.32']\n>>> for i in range(len(proportions)):\n\
  ...   proportions[i] = float(proportions[i])\n...\n>>> proportions\n[0.2, 0.08,\
  \ 0.4, 0.32]\n```\n\n`range` for 循环遍历每个索引，赋值语句改变了该索引所引用的对象。\n\n### 解决大部分问题\n\n我们现在已经具备了解决这个问题的良好条件（暂时忽略陷阱）。\n\
  \n我们先用一个例子来强调我们的代码需要做什么。然后我们进入代码本身。\n\n### 探索一个测试用例\n\n这个问题的输入包含 10 个测试用例，但我这里只展示一个。如果你从键盘输入这个测试用例，你会看到答案。但程序不会就此终止，因为它还在等待下一个测试用例。如果你对这个测试用例使用输入重定向，你同样会看到答案。但随后你会遇到一个\
  \ `EOFError`。EOF 代表“文件结束”；这个错误是由于程序试图读取比可用输入更多的输入而导致的。一旦你的代码能正确处理一个测试用例，你\n\n\n\
  你可以在输入中再多加几个数据，确保这些也能正常运行。一旦凑满 10 个测试用例，程序就会运行到底。\n\n下面是我想和你一起追踪的测试用例：\n\n```\n\
  504\n0.2 0.08 0.4 0.32\n125\n```\n\n学校旅行的费用是 504 美元，有 125 名学生参加早午餐会。\n\n要确定早午餐会筹到了多少钱，我们需要计算每个年级的学生筹集的金额。一年级学生人数为\
  \ 125 * 0.2 = 25，每人支付 12 美元。所以一年级学生筹集了 25 * 12 = 300 美元。我们可以用同样的方法计算二、三、四年级学生筹集的金额。具体计算见表\
  \ 5-1。\n\n**表 5-1：学校旅行示例**\n\n| 年级 | 该年级学生人数 | 每名学生费用 | 筹集金额 |\n|---|---|---|---|\n\
  | 一年级 | 25 | 12 | 300 |\n| 二年级 | 10 | 10 | 100 |\n| 三年级 | 50 | 7 | 350 |\n| 四年级\
  \ | 40 | 5 | 200 |\n\n每个年级筹集的金额等于该年级学生人数乘以该年级每名学生的费用，见表格最右列。要计算所有学生筹集的总金额，我们将最右列四个数相加：300\
  \ + 100 + 350 + 200 = 950 美元。其中只有 50% 可用于学校旅行，所以我们剩下 950 / 2 = 475 美元，不足以支付 504\
  \ 美元的旅行费用。因此正确输出是 YES，因为还需要筹集更多资金。\n\n## 代码\n\n这个部分解决方案能够正确处理所有“比例乘以学生人数得到整数学生人数”的输入（比如我们刚才测试的用例）。代码见清单\
  \ 5-4。\n\n```python\nYEAR_COSTS = [12, 10, 7, 5]  # ①\n\nfor dataset in range(10):\
  \  # ②\n    trip_cost = int(input())\n    proportions = input().split()  # ③\n \
  \   num_students = int(input())\n\n    for i in range(len(proportions)):  # ④\n\
  \        proportions[i] = float(proportions[i])\n\n    students_per_year = []  #\
  \ ⑤\n\n    for proportion in proportions:\n        students = int(num_students *\
  \ proportion)  # ⑥\n        students_per_year.append(students)\n\n    total_raised\
  \ = 0\n    for i in range(len(students_per_year)):  # ⑦\n        total_raised =\
  \ total_raised + students_per_year[i] * YEAR_COSTS[i]\n\n    if total_raised / 2\
  \ < trip_cost:  # ⑧\n        print('YES')\n    else:\n        print('NO')\n```\n\
  \n**清单 5-4：解决学校旅行问题的大部分情况**\n\n首先，我们使用变量 YEAR_COSTS 来引用参加早午餐会的费用列表：分别对应一、二、三、四年级学生的费用\
  \ ①。一旦确定了每个年级的学生人数，我们将乘以这些值来计算筹集的金额。这些费用不会改变，所以我们永远不会修改这个变量所引用的内容。对于这样的“常量”变量，Python\
  \ 的惯例是用大写字母书写其名称，就像我这里做的一样。\n\n输入包含 10 个测试用例，因此我们循环 10 次 ②，每次处理一个测试用例。程序的其余部分都位于这个循环内部，因为我们需要将整个过程重复\
  \ 10 次。\n\n对于每个测试用例，我们读取三行输入。第二行包含四个比例，所以我们用 split 将其拆分成包含四个字符串的列表 ③。我们使用 range\
  \ 循环将每个字符串转换为浮点数 ④。\n\n现在让我们看看为什么当前程序在某些测试用例上会出错，以及我们将使用哪些 Python 特性来修复它。\n\n##\
  \ 探索一个测试用例\n\n下面是一个当前代码会出错的测试用例：\n\n```\n50\n0.7 0.1 0.1 0.1\n9\n```\n\n这次学校旅行费用为\
  \ 50 美元，有 9 名学生参加早午餐会。对于一年级学生人数，当前程序会计算 9 * 0.7 = 6.3，然后向下取整为 6。正是因为这个向下取整的步骤，我们在这个测试用例上需要格外小心。要了解当前程序对四个年级分别的计算结果，见表\
  \ 5-2。\n\n**表 5-2：学校旅行中当前程序会算错的一个示例**\n\n| 年级 | 该年级学生人数 | 每名学生费用 | 筹集金额 |\n|---|---:|---:|---:|\n\
  | 一年级 | 6 | 12 | 72 |\n| 二年级 | 0 | 10 | 0 |\n| 三年级 | 0 | 7 | 0 |\n| 四年级 | 0 | 5\
  \ | 0 |\n\n除一年级外，其他年级的学生人数都为 0，因为 9 * 0.1 = 0.9 向下取整为 0。这样看来我们只筹集了 72 美元。72 美元的一半是\
  \ 36 美元，不足以支付 50 美元的学校旅行费用。当前程序输出 YES，表示需要筹集更多资金。\n\n……但实际并非如此。我们这里应该有 9 名学生，而不是\
  \ 6 名！因为取整我们丢失了 3 名学生。题目描述规定，应该将这些学生加到人数最多的年级中，在这个例子中就是一年级。如果我们这样做，就会发现实际上我们筹集了\
  \ 9 * 12 = 108 美元。108 美元的一半是 54 美元，所以实际上我们*并不*需要为这次 50 美元的学校旅行筹集更多资金！正确输出是 NO。\n\
  \n## 更多列表操作\n\n要修复程序，我们需要做两件事：计算因取整丢失了多少学生，并将这些学生加到人数最多的年级。\n\n### 对列表求和\n\n要确定因取整丢失的学生人数，我们可以将\
  \ students_per_year 列表中的学生人数加起来，然后用总学生人数减去这个总和。Python 的 sum 函数接受一个列表并返回其值的总和：\n\n\
  ```\n>>> students_per_year = [6, 0, 0, 0]\n>>> sum(students_per_year)\n6\n>>> students_per_year\
  \ = [25, 10, 50, 40]\n>>> sum(students_per_year)\n125\n```\n\n### 查找最大值的索引\n\nPython\
  \ 的 max 函数接受一个序列并返回其最大值：\n\n```\n>>> students_per_year = [6, 0, 0, 0]\n>>> max(students_per_year)\n\
  6\n>>> students_per_year = [25, 10, 50, 40]\n>>> max(students_per_year)\n50\n```\n\
  \n我们想要的是最大值的索引，而不是最大值本身，这样我们才能增加该索引处的学生人数。有了最大值，我们可以使用 index 方法找到它的索引。它会返回所提供值第一次出现的最左侧索引，如果该值根本不在列表中，则会产生错误：\n\
  \n```\n>>> students_per_year = [6, 0, 0, 0]\n>>> students_per_year.index(6)\n0\n\
  >>> students_per_year.index(0)\n1\n>>> students_per_year.index(50)\nTraceback (most\
  \ recent call last):\n  File \"<stdin>\", line 1, in <module>\nValueError: 50 is\
  \ not in list\n```\n\n我们搜索的值肯定在列表中，所以不用担心出现错误。\n\n### 解决问题\n\n我们做到了！现在可以更新部分解决方案，以处理任何有效的测试用例。新程序见清单\
  \ 5-5。\n\n```python\nYEAR_COSTS = [12, 10, 7, 5]\n\nfor dataset in range(10):\n\
  \    trip_cost = int(input())\n    proportions = input().split()\n    num_students\
  \ = int(input())\n\n    for i in range(len(proportions)):\n        proportions[i]\
  \ = float(proportions[i])\n\n    students_per_year = []\n\n    for proportion in\
  \ proportions:\n        students = int(num_students * proportion)\n        students_per_year.append(students)\n\
  \n    counted = sum(students_per_year)  # ①\n    uncounted = num_students - counted\n\
  \    most = max(students_per_year)\n    where = students_per_year.index(most)\n\
  \    students_per_year[where] = students_per_year[where] + uncounted  # ②\n\n  \
  \  total_raised = 0\n\n    for i in range(len(students_per_year)):\n        total_raised\
  \ = total_raised + students_per_year[i] * YEAR_COSTS[i]\n\n    if total_raised /\
  \ 2 < trip_cost:\n        print('YES')\n    else:\n        print('NO')\n```\n\n\
  **清单 5-5：解决学校旅行问题**\n\n唯一新增的代码是从 ① 开始的那五行。我们使用 sum 计算到目前为止已经计入的学生人数，然后从总学生人数中减去它，得到未计入的学生人数。接着使用\
  \ max 和 index 来找出需要增加人数的年级索引。\n\n输入包含 10 个测试用例。每个测试用例包含以下几行：\n\n- 一行包含整数 $f$（加盟商数量）和整数\
  \ $d$（天数），以空格分隔。$f$ 在 4 到 130 之间，$d$ 在 2 到 4745 之间。\n- 之后是 $d$ 行，每行包含 $f$ 个以空格分隔的整数。每个整数表示一个销售额。第一行给出每个加盟商第一天的销售额，第二行给出每个加盟商第二天的销售额，以此类推。每个整数在\
  \ 1 到 13000 之间。\n\n## 输出\n\n对于每个测试用例，输出发放奖金的总数。\n\n## 表示表格\n\n这个问题的数据可以可视化为一个表格。我们从一个示例开始，然后研究如何将表格表示为列表。\n\
  \n## 探索一个测试用例\n\n如果我们有 $d$ 天和 $f$ 个加盟商，就可以将数据排列成一个有 $d$ 行和 $f$ 列的表格。\n\n下面是一个示例测试用例：\n\
  \n```\n6 4\n1 13 2 1 1 8\n2 12 10 5 11 4\n39 6 13 52 3 3\n15 8 6 2 7 14\n```\n\n\
  该测试用例对应的表格如表 5-3 所示。\n\n**表 5-3：面包师奖金表**\n\n|   | 0 | 1 | 2 | 3 | 4 | 5 |\n|---|---|---|---|---|---|---|\n\
  | 0 | 1 | 13 | 2 | 1 | 1 | 8 |\n| 1 | 2 | 12 | 10 | 5 | 11 | 4 |\n| 2 | 39 | 6 |\
  \ 13 | 52 | 3 | 3 |\n| 3 | 15 | 8 | 6 | 2 | 7 | 14 |\n\n\n\n|   | 0 | 1 | 2 | 3\
  \ | 4 | 5 |\n|---|---|---|---|---|---|---|\n| 3 | 15 | 8 | 6 | 2 | 7 | 14 |\n\n\
  我将行和列从 0 开始编号，以与我们稍后将把此数据存储在列表中的方式相一致。\n\n此测试用例中颁发了多少奖金？让我们先查看表格的行，对应于天数。行 0 的销售额之和为\
  \ 1 + 13 + 2 + 1 + 1 + 8 = 26。由于 26 是 13 的倍数，此行给我们 26 / 13 = 2 个奖金。行 1 的和为 44。这不是\
  \ 13 的倍数，因此没有奖金。行 2 的和为 116——同样没有奖金。行 3 的和为 52，这给我们 52 / 13 = 4 个奖金。\n\n现在让我们查看列，对应于加盟商。列\
  \ 0 的和为 1 + 2 + 39 + 15 = 57。这不是 13 的倍数，因此没有奖金。事实上，唯一给我们奖金的列是列 1。其和为 39，给我们 39 /\
  \ 13 = 3 个奖金。\n\n颁发的奖金总数为 2 + 4 + 3 = 9。所以，9 是此测试用例的正确输出。\n\n## 嵌套列表\n\n到目前为止，我们已经看到整数、浮点数和字符串的列表。我们也可以创建列表的列表，称为嵌套列表。此类列表的每个值本身就是一个列表。常用像\
  \ grid 或 table 这样的变量名来引用嵌套列表。以下是对应于表 5-3 的 Python 列表：\n\n```\n>>> grid = [[ 1, 13,\
  \ 2, 1, 1, 8],\n...   [ 2, 12, 10, 5, 11, 4],\n...   [39, 6, 13, 52, 3, 3],\n...\
  \   [15, 8, 6, 2, 7, 14]]\n```\n\n每个列表值对应一行。如果我们索引一次，我们得到一行，它本身就是一个列表：\n\n```\n\
  >>> grid[0]\n[1, 13, 2, 1, 1, 8]\n>>> grid[2]\n[39, 6, 13, 52, 3, 3]\n```\n\n如果我们索引两次，我们得到一个单一值。以下是第\
  \ 1 行第 2 列的值：\n\n```\n>>> grid[1][2]\n10\n```\n\n与行相比，处理列有点棘手，因为每一列都分布在多个列表中。要访问一列，我们需要从每一行聚合一个值。我们可以用循环来做到这一点，该循环逐步构建一个代表列的新列表。在这里，我获取列\
  \ 1：\n\n```\n>>> column = []\n>>> for i in range(len(grid)):\n...     column.append(grid[i][1])\n\
  ...\n>>> column\n[13, 12, 6, 8]\n```\n\n注意第一个索引（行）在变化，但第二个（列）没有变化①。这选择了具有相同列索引的每个值。\n\
  \n行和列的求和呢？要对一行求和，我们可以使用 sum 函数。以下是行 0 的和：\n\n```\n>>> sum(grid[0])\n26\n```\n\n\
  我们也可以使用循环，如下所示：\n\n```\n>>> total = 0\n>>> for value in grid[0]:\n...     total\
  \ = total + value\n...\n>>> total\n26\n```\n\n使用 sum 是更容易的选择，所以我们将使用它。\n\n要对一列求和，我们可以构建一个列列表并对该列表使用\
  \ sum，或者我们可以直接计算而不创建新列表。以下是后一种方法用于列 1：\n\n```\n>>> total = 0\n>>> for i in range(len(grid)):\n\
  ...     total = total + grid[i][1]\n...\n```\n\n## 概念检查\n\n以下代码的输出是什么？\n\n```\n\
  lst = [[1, 1],\n    [2, 3, 4]]\nx = 0\n\nfor i in range(len(lst)):\n    for j in\
  \ range(len(lst[0])):\n        x = x + lst[i][j]\n\nprint(x)\n```\n\n-   A. 2\n\
  -   B. 7\n-   C. 11\n-   D. 此代码产生错误（它使用了无效的索引）\n\n答案：B。变量 i 遍历值 0 和 1（因为 lst 的长度为\
  \ 2）；变量 j 也遍历值 0 和 1（因为 lst[0] 的长度为 2）。因此被求和的列表中的值是每个索引都为 0 或 1 的那些值。特别是，这不包括 lst[1][2]\
  \ 中的 4。\n\n## 概念检查\n\n以下代码包含两个 print 调用。输出是什么？\n\n```\nlst = [[5, 10], [15, 20]]\n\
  x = lst[0]\nx[0] = 99\nprint(lst)\n\nlst = [[5, 10], [15, 20]]\ny = lst[0]\ny =\
  \ y + [99]\nprint(lst)\n```\n\n-   A.\n    \n    ```text\n    [[99, 10], [15, 20]]\n\
  \    [[5, 10], [15, 20]]\n    ```\n-   B.\n    \n    ```text\n    [[99, 10], [15,\
  \ 20]]\n    [[5, 10, 99], [15, 20]]\n    ```\n-   C.\n    \n    ```text\n    [[5,\
  \ 10], [15, 20]]\n    [[5, 10], [15, 20]]\n    ```\n-   D.\n    \n    ```text\n\
  \    [[5, 10], [15, 20]]\n    [[5, 10, 99], [15, 20]]\n    ```\n\n答案：A。x 引用 lst\
  \ 的第一行；它是引用 lst[0] 的另一种方式。因此，当我们执行 x[0] = 99 时，该更改在通过 lst 查看列表时也会反映出来。\n\n接下来，y\
  \ 也引用 lst 的第一行。但随后我们将一个新列表分配给 y——并且是该列表，而不是 lst 的第一行，被附加了 99。\n\n## 解决问题\n\n我们解决此问题的代码在列表\
  \ 5-6 中。\n\n```\nfor dataset in range(10):\n    ① lst = input().split()\n    franchisees\
  \ = int(lst[0])\n    days = int(lst[1])\n    grid = []\n\n    ② for i in range(days):\n\
  \        row = input().split()\n        ③ for j in range(franchisees):\n       \
  \     row[j] = int(row[j])\n        ④ grid.append(row)\n\n    bonuses = 0\n\n  \
  \  ⑤ for row in grid:\n        ⑥ total = sum(row)\n        if total % 13 == 0:\n\
  \            bonuses = bonuses + total // 13\n\n    ⑦ for col_index in range(franchisees):\n\
  \        total = 0\n        ⑧ for row_index in range(days):\n            total =\
  \ total + grid[row_index][col_index]\n        if total % 13 == 0:\n            bonuses\
  \ = bonuses + total // 13\n\n    print(bonuses)\n```\n\n列表 5-6：解决 Baker Bonus\n\n\
  与 School Trip 一样，输入包含 10 个测试用例，因此我们将所有代码放在一个迭代 10 次的循环中。\n\n对于每个测试用例，我们读取输入的第一行并调用\
  \ split 将其拆分为一个列表①。该列表将包含两个值——加盟商数量和天数——我们将它们转换为整数并分配给适当命名的变量。\n\ngrid 变量最初是一个空列表。它最终将引用一个行列表，其中每一行都是给定一天的销售额列表。\n\
  \n我们使用 range for 循环对每一天循环一次②。然后我们从输入中读取一行并调用 split 将其拆分为单独的销售额列表\n\n值。这些值目前是字符串，因此我们使用嵌套循环将它们全部转换为整数③。然后，我们将该行添加到我们的\
  \ grid 中④。\n\n我们现在已经读取了输入并存储了 grid。是时候计算奖金数量了。我们分两步进行：首先是来自行的奖金，其次是来自列的奖金。\n\n为了找到来自行的奖金，我们在\
  \ grid 上使用 for 循环⑤。与对列表的任何 for 循环一样，它一次给我们一个值。在这里，每个值都是一个列表，因此 row 在每次迭代中引用不同的列表。sum\
  \ 函数适用于任何数字列表，因此我们在这里使用它来加总当前行的值⑥。如果和能被 13 整除，则我们添加奖金数量。\n\n我们不能像处理行那样遍历列表的列，因此我们必须求助于遍历索引。我们通过使用\
  \ range for 循环遍历列的索引来实现这一点⑦。使用 sum 对当前列求和不是一个选项，因此我们需要一个嵌套循环。该嵌套循环遍历行⑧，将所需列中的每个值加起来。然后我们检查该总数是否能被\
  \ 13 整除，如果能则添加任何奖金。\n\n最后打印总奖金数。\n\n评判时间！如果您提交我们的代码，您应该会看到所有测试用例都通过了。\n\n## 总结\n\
  \n在本章中，我们学习了列表，它帮助我们处理我们选择的任何类型的集合。数字列表、字符串列表、列表的列表：Python 支持我们所需的一切。我们还学习了列表方法以及为什么对列表进行排序可以使处理列表中的值变得更容易。\n\
  \n与字符串不同，列表是可变的，这意味着我们可以更改其内容。这有助于我们更轻松地操作列表，但我们必须小心修改我们认为正在修改的列表。\n\n我们在学习中已经到了可以编写包含许多行代码的程序的地步。我们可以使用\
  \ if 语句和循环来指导程序的行为。我们可以使用字符串和列表来存储和操作信息。我们可以编写程序来解决具有挑战性的问题。这样的程序可能变得难以设计和阅读。幸运的是，\n\
  \n\n\n有一个工具可以帮助我们组织程序以保持其复杂性 under control，我们将在下一章学习该工具。完成以下部分练习可能会加深你对编写大量代码的困难的认识。然后你就可以继续了！\n\
  \n## Chapter Exercises\n\n这里有一些练习供你尝试。\n\n- 1. DMOJ problem ccc07j3, Deal or No\
  \ Deal Calculator\n- 2. DMOJ problem coci17c1p1, Cezar\n- 3. DMOJ problem coci18c2p1,\
  \ Preokret\n- 4. DMOJ problem ccc00s2, Babbling Brooks (Check out Python’s round\
  \ function.)\n- 5. DMOJ problem ecoo18r1p1, Willow’s Wild Ride\n- 6. DMOJ problem\
  \ ecoo19r1p1, Free Shirts\n- 7. DMOJ problem dmopc14c7p2, Tides\n- 8. DMOJ problem\
  \ wac3p3, Wesley Plays DDR\n- 9. DMOJ problem ecoo18r1p2, Rue’s Rings (If you use\
  \ f-strings here, you’ll need a way to include the { and } symbols themselves. You\
  \ can include a { in the f-string by using {{ and a } by using }}.)\n- 10. DMOJ\
  \ problem coci19c5p1, Emacs\n- 11. DMOJ problem coci20c2p1, Crtanje (You’ll need\
  \ to support rows from −100 to 100. But how do we support negative-indexed rows\
  \ when Python lists start at index 0? Here’s a trick: use index x + 100 any time\
  \ you need access to row x. That shifts the row numbers to be between 0 and 200\
  \ rather than between −100 and 100. Also, one small annoyance here with strings:\
  \ \\ is a special character, so you’ll have to use '\\\\' rather than '\\' if you\
  \ want a \\ character.)\n- 12. DMOJ problem dmopc19c5p2, Charlie’s Crazy Conquest\
  \ (You’ll have to be careful with indices and the game rules for this one!)\n\n\
  ## Notes\n\nVillage Neighborhood is originally from the 2018 Canadian Computing\
  \ Competition, Senior Level. School Trip is originally from the 2017 Educational\
  \ Computing Organization of Ontario Programming Contest, Round 1. Baker Bonus is\
  \ originally from the 2017 Educational Computing Organization of Ontario Programming\
  \ Contest, Round 3.\n"
- "# 6\n\n## DESIGNING PROGRAMS WITH FUNCTIONS\n\n![](img/3e15323aee4cec3bf673834bfafe8024_183_0.png)\n\
  \n编写大型程序时，重要的是将我们的代码组织成较小的逻辑块，每个块都为整体目标做出贡献。这样，我们就能独立思考每个块，而不必担心其他块在做什么。然后我们将这些块组合起来。这些块称为\
  \ *functions*。\n\n在本章中，我们将使用 *functions* 来分解并解决两个问题：计算两名玩家纸牌游戏的得分以及判断动作人偶的盒子是否可以整齐地组织。\n\
  \n### Problem #14: Card Game\n\n在这个问题中，我们将实现一个两名玩家的纸牌游戏。在思考问题的过程中，我们会发现同一段逻辑出现了多次。我们将学习如何将这段代码打包成一个\
  \ Python 函数，以避免代码重复并增强代码清晰度。\n\n这是 DMOJ problem ccc99s1。\n\n#### *The Challenge*\n\
  \n两名玩家 A 和 B 正在玩一个纸牌游戏。 （你不需要了解纸牌或纸牌游戏就能理解这个问题。）\n\n游戏开始时有一副 52 张牌的牌堆。玩家 A 从牌堆中取一张牌，然后玩家\
  \ B 从牌堆中取一张牌，然后玩家 A，再然后玩家 B，直到牌堆中没有牌为止。\n\n牌堆中有 13 种牌型。牌型如下：\ntwo, three, four,\
  \ five, six, seven, eight, nine, ten, jack, queen, king, ace.\n每种牌型各有四张牌。例如，有四张二、四张三，等等，一直到四张\
  \ A。 （这就是为什么牌堆中有 52 张牌：13 种牌型乘以每种 4 张牌。）\n\n*high card* 是 jack、queen、king 或 ace\
  \ 的牌。当玩家取到一张高牌时，他们可能会得分。以下是计分规则：\n\n- 如果玩家取到一张 jack，随后牌堆中至少还剩一张牌，并且牌堆中的下一张牌不是高牌，则该玩家得\
  \ 1 分。\n- 如果玩家取到一张 queen，随后牌堆中至少还剩两张牌，并且牌堆中接下来的两张牌都不是高牌，则该玩家得 2 分。\n- 如果玩家取到一张 king，随后牌堆中至少还剩三张牌，并且牌堆中接下来的三张牌都不是高牌，则该玩家得\
  \ 3 分。\n- 如果玩家取到一张 ace，随后牌堆中至少还剩四张牌，并且牌堆中接下来的四张牌都不是高牌，则该玩家得 4 分。\n\n我们被要求在每次玩家得分时输出信息，以及游戏结束时每个玩家的总得分。\n\
  \n### Input\n\n输入由 52 行组成。每行包含牌堆中一张牌的类型。行是按从牌堆中取牌的顺序排列的；也就是说，第一行是从牌堆中取出的第一张牌，第二行是从牌堆中取出的第二张牌，以此类推。\n\
  \n### Output\n\n每当玩家得分时，输出以下行：\n\n| |\n|---|\n| Player *p* scores *q* point(s).\
  \ |\n\n其中 **p** 是玩家 A 的 A 或玩家 B 的 B，**q** 是他们刚刚得分的分数。\n\n游戏结束时，输出以下两行：\n\n```\n\
  Player A: *m* point(s).\nPlayer B: *n* point(s).\n```\n\n其中 **m** 是玩家 A 的总得分，**n**\
  \ 是玩家 B 的总得分。\n\n### Exploring a Test Case\n\n如果你思考如何解决这个问题，你可能会想知道我们是否可以直接解决它，而无需学习新东西。确实可以！我们准备得很充分。我们可以使用一个列表来表示牌堆。我们知道如何使用列表\
  \ append 方法向牌堆添加一张牌。我们可以访问列表中的值来查找高牌。我们甚至有 f-strings 来帮助我们输出玩家和分数信息。\n\n不过，在深入之前，让我们先通过一个小例子。\
  \ 这样做会突出我们缺少 Python 的一个关键特性，这将使我们更容易组织解决方案并解决这个问题。\n\n如果我们使用 52 张牌的例子，我们将在这里待一整年，所以让我们使用一个只有\
  \ 10 张牌的更小的例子。这不是一个完整的测试用例，所以我们编写的程序在上面不会工作，但它足以让我们理解游戏的机制以及我们的解决方案需要做什么。以下是测试用例：\n\
  \n```\nqueen\nthree\nseven\nking\nnine\njack\neight\nking\njack\nfour\n```\n\n玩家\
  \ A 取第一张牌，即 queen。 Queen 是一张高牌，玩家 A 在这里可能会得 2 分。首先，我们确认在这张 queen 之后牌堆中至少还剩两张牌。接下来，我们必须检查这两张牌，希望其中没有高牌。接下来的两张牌不是高牌——它们是\
  \ three 和 seven——所以玩家 A 得 2 分。\n\n玩家 B 现在取第二张牌，即 three。 Three 不是高牌，所以玩家 B 没有得分。\n\
  \n玩家 A 现在取 seven。没有得分。\n\n玩家 B 现在取 king，所以玩家 B 有机会得 3 分。在这张 king 之后牌堆中至少还剩三张牌。我们必须检查这三张牌，希望其中没有高牌。可惜，其中有一张高牌，是一张\
  \ jack。玩家 B 没有得分。\n\n玩家 A 现在取 nine。没有得分。\n\n玩家 B 现在取第一张 jack。在这张 jack 之后牌堆中至少还剩一张牌。我们必须检查下一张牌，希望它不是高牌。好消息：它不是高牌——它是一张\
  \ eight——所以玩家 B 得 1 分。\n\n只有一次得分是由玩家 A 在他们取到倒数第二张牌（jack）时获得的。\n\n因此，这个测试用例的输出为：\n\
  \n- Player A scores 2 point(s).\n- Player B scores 1 point(s).\n- Player A scores\
  \ 1 point(s).\n- Player A: 3 point(s).\n- Player B: 1 point(s).\n\n注意，每当玩家取到一张高牌时，我们需要检查两件事：牌堆中至少还剩一定数量的牌，以及这些牌中没有高牌。第一点我们应该可以通过使用一个变量来告诉我们已经取了多少张牌来管理。第二点更困难。我们需要一些代码来检查给定数量的牌是否包含高牌。更糟糕的是，如果我们不小心，我们最终会重复四次非常相似的代码：一次检查\
  \ jack 之后的牌，一次检查 queen 之后的两个牌，一次检查 king 之后的三个牌，一次检查 ace 之后的四个牌。如果我们后来发现逻辑有缺陷，我们将不得不修复多达四个不同的地方。\n\
  \n是否有 Python 特性让我们可以只打包一次“这里没有高牌”的逻辑，然后调用四次？有。它被称为函数，它只是一个执行小任务的命名代码块。\n\n\n\n\n\
  \n函数对于代码的组织性和清晰度至关重要。所有程序员都会使用它们。如果没有函数，编写像游戏和文字处理器这样的大型软件系统将变得不可行。让我们来学习如何使用函数。\n\
  \n## 定义和调用函数\n\n我们已经学习了如何调用 Python 自带的函数。例如，我们使用了 input 函数来读取输入。以下是一个没有参数的 input\
  \ 调用示例：\n\n```\n```python\n>>> s = input()\nhello\n>>> s\n'hello'\n```\n```\n\n\
  我们还使用了 Python 的 print 函数来输出文本。以下是一个带有一个参数的 print 调用示例：\n\n```\n```python\n>>> print('well,\
  \ well')\nwell, well\n```\n```\n\nPython 的内置函数是通用的，旨在用于各种广泛的环境。当我们希望一个函数解决特定任务时，我们就必须自己定义它。\n\
  \n### 无参函数\n\n为了*定义*或创建一个函数，我们使用 Python 的 def 关键字。以下是一个输出三行内容的函数的定义：\n\n```\n```python\n\
  >>> def intro():\n...     print('**********')\n...     print('*WELCOME*')\n... \
  \    print('**********')\n...\n```\n```\n\n函数定义的结构与 if 语句或循环的结构类似。def 后面的名称是我们正在定义的函数的名称；在这里，我们定义了一个名为\
  \ intro 的函数。在函数名称之后，有一对空括号 ()。稍后我们会看到，可以在这些括号中包含信息以向函数传递参数。这个 intro 函数不接收任何参数，这就是为什么括号是空的。括号后面是一个冒号；与\
  \ if 语句或循环一样，省略冒号会导致语法错误。在接下来的几行中，我们提供了一个缩进的语句块，该语句块将在每次调用函数时执行。\n\n当你定义 intro 函数时，你可能期望看到以下输出：\n\
  \n```\n**********\n*WELCOME*\n**********\n```\n\n但并没有：到目前为止，我们只是定义了该函数，并未调用它。定义函数没有可观察到的效果；它只是将函数存储在计算机内存中，以便我们稍后调用。我们调用自己定义的函数，就像调用\
  \ Python 的任何内置函数一样。由于这个 intro 函数不接收任何参数，我们在调用时使用一组空括号：\n\n```\n>>> intro()\n**********\n\
  *WELCOME*\n**********\n```\n\n你可以随意调用这个函数多次。只要我们需要，它就在那里。\n\n## 带参数的函数\n\n我们的 intro\
  \ 函数不太灵活，因为它每次被调用时都执行相同的操作。我们可以修改函数，使其能够接收参数，并且传递的参数可以影响函数的行为。以下是 intro 函数的一个新版本，它允许我们传递单个参数：\n\
  \n```\n>>> def intro2(message):\n...     line_length = len(message) + 2\n...   \
  \  print('*' * line_length)\n...     print(f'* {message} *')\n...     print('*'\
  \ * line_length)\n...\n```\n\n要调用这个函数，我们需要提供一个字符串参数：\n\n```\n>>> intro2('HELLO')\n\
  *******\n*HELLO*\n*******\n>>> intro2('WIN')\n*****\n*WIN*\n*****\n```\n\n如果我们不传参数就无法调用这个\
  \ intro2 函数——如果我们尝试这样做，会得到一个错误：\n\n```\n>>> intro2()\nTraceback (most recent call\
  \ last):\n  File \"<stdin>\", line 1, in <module>\nTypeError: intro2() missing 1\
  \ required positional argument: 'message'\n```\n\n该错误提醒我们，我们没有为 message 提供参数。名称\
  \ message 被称为函数参数。当我们调用 intro2 时，Python 首先让 message 指向我们的参数所指向的内容；也就是说，message 成为我们参数的别名。\n\
  \n我们可以创建具有多个参数的函数。以下是一个接受两个参数的函数：一个要打印的信息和打印的次数：\n\n```\n>>> def intro3(message,\
  \ num_times):\n...     for i in range(num_times):\n...         print(message)\n\
  ...\n```\n\n要调用这个函数，我们需要提供两个参数。Python 从左到右处理，将第一个参数赋值给第一个参数名，将第二个参数赋值给第二个参数名。在下一次调用中，'high'\
  \ 被赋值给 message 参数，5 被赋值给 num_times 参数：\n\n```\n>>> intro3('high', 5)\nhigh\nhigh\n\
  high\nhigh\nhigh\n```\n\n请务必提供正确数量的参数。对于 intro3，我们需要两个参数。其他任何情况都是错误：\n\n```\n>>>\
  \ intro3()\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n\
  TypeError: intro3() missing 2 required positional arguments: 'message' and 'num_times'\n\
  >>> intro3('high')\nTraceback (most recent call last):\n  File \"<stdin>\", line\
  \ 1, in <module>\nTypeError: intro3() missing 1 required positional argument: 'num_times'\n\
  ```\n\n我们还必须确保提供正确类型的值。错误类型不会阻止我们调用函数，但会导致函数内部出现错误：\n\n```\n>>> intro3('high', 'low')\n\
  Traceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n  File\
  \ \"<stdin>\", line 2, in intro3\nTypeError: 'str' object cannot be interpreted\
  \ as an integer\n```\n\n这个 TypeError 出现是因为 intro3 使用了一个基于变量 num_times 的 range for\
  \ 循环。如果为 num_times 提供的参数不是整数，range for 循环就会失败。\n\n## 关键字参数\n\n在调用函数时，可以覆盖参数与参数名之间的从左到右的对应关系。要做到这一点，我们可以按照自己喜欢的顺序使用参数名。使用参数名的参数称为关键字参数。以下是其工作方式：\n\
  \n```\n>>> def intro3(message, num_times):\n...   for i in range(num_times):\n...\
  \     print(message)\n...\n>>> intro3(message='high', num_times=3)\nhigh\nhigh\n\
  high\n>>> intro3(num_times=3, message='high')\nhigh\nhigh\nhigh\n```\n\n这里的每个函数调用都使用了两个关键字参数。关键字参数由参数名、等号及其对应的参数组成。\n\
  \n你甚至可以以常规参数开始，并以关键字参数结束：\n\n```\n>>> intro3('high', num_times=3)\nhigh\nhigh\n\
  high\n```\n\n但一旦你使用了关键字参数，就不能再回到常规参数：\n\n```\n>>> intro3(message='high', 3)\n  File\
  \ \"<stdin>\", line 1\nSyntaxError: positional argument follows keyword argument\n\
  ```\n\n在第 5 章的“排序列表”部分，我们在调用 sort 方法时使用了一个 reverse 关键字参数。Python 设计者决定 reverse 应该是一个仅关键字参数，这意味着如果不使用关键字参数，就无法填入它的值。Python\
  \ 也允许我们在自己的函数中做到这一点，但在这本书中我们不需要这种程度的控制。\n\n## 局部变量\n\n参数名像常规变量一样工作，但仅限于定义它们的函数内部。也就是说，函数参数在其函数外部不存在：\n\
  \n```\n>>> def intro2(message):\n...   line_length = len(message) + 2\n...   print('*'\
  \ * line_length)\n...   print(f'*{message}*')\n...   print('*' * line_length)\n\
  >>> intro2('hello')\n*******\n*hello*\n*******\n>>> message\nTraceback (most recent\
  \ call last):\n  File \"<stdin>\", line 1, in <module>\nNameError: name 'message'\
  \ is not defined\n```\n\n那么 line_length 变量呢——它也是局部的吗？是的：\n\n```\n>>> line_length\n\
  Traceback (most recent call last):\n    File \"<stdin>\", line 1, in <module>\n\
  NameError: name 'line_length' is not defined\n```\n\n如果你有一个变量，然后调用一个使用同名参数或局部变量的函数，会发生什么？你的值会丢失吗？让我们看看：\n\
  \n```\n>>> line_length = 999\n>>> intro2('hello')\n*******\n*hello*\n*******\n>>>\
  \ line_length\n999\n```\n\n松了一口气——它仍然是 999，正如我们离开时那样。局部变量在函数被调用时创建，在函数终止时销毁，这一切都不会影响其他同名的变量。\n\
  \n一个函数可以访问在该函数外部创建的变量。尽管不建议依赖于此，因为这会使该函数不再自包含，而是期望它需要的变量实际存在。在这本书中，我们将编写仅使用局部变量的函数。函数所需的所有信息将通过其参数提供给函数。\n\
  \n## 可变参数\n\n由于参数是其对应参数的别名，因此它可以用于修改变量值。以下是一个从列表 lst 中移除所有 value 出现的函数：\n\n```\n\
  >>> def remove_all(lst, value):\n...     while value in lst:\n...         lst.remove(value)\n\
  ...\n>>> lst = [5, 10, 20, 5, 45, 5, 9]\n>>> remove_all(lst, 5)\n>>> lst\n[10, 20,\
  \ 45, 9]\n```\n\n\n\n\n\n注意，我们通过变量向 `remove_all` 传递了一个列表。如果你直接用列表值（而不是用一个引用列表的变量）来调用这个函数，那么它不会产生任何有用的效果：\n\
  \n```\n>>> remove_all([5, 10, 20, 5, 45, 5, 9], 5)\n```\n\n函数确实从列表中删除了所有的 5，但由于我们没有使用变量，以后就再也没有办法引用那个列表了。\n\
  \n## 概念检查\n\n下面代码的输出是什么？\n\n```\ndef mystery(s, lst):\n    s = s.upper()\n    lst\
  \ = lst + [2]\n\ns = 'a'\nlst = [1]\nmystery(s, lst)\n\nprint(s, lst)\n```\n\n+\
  \   A. a [1]\n+   B. a [1, 2]\n+   C. A [1]\n+   D. A [1, 2]\n\n**答案：** A. 调用 `mystery`\
  \ 时，它的 `s` 参数被设置为引用 `s` 实参所引用的对象，即字符串 'a'。类似地，它的 `lst` 参数被设置为引用 `lst` 实参所引用的对象，即列表\
  \ [1]。在 `mystery` 内部，`s` 和 `lst` 都是局部变量。\n\n现在我们来研究函数本身的两个语句。\n\n首先，s = s.upper()。这使局部变量\
  \ s 引用 'A'（大写）。但它并没有改变函数外部 s 所引用的内容；外部的 s 仍然引用 'a'（小写）。\n\n其次，lst = lst + [2]。对列表使用\
  \ + 会创建一个新列表（它不会改变现有列表！），所以这使局部变量 lst 引用新列表：[1, 2]。但同样，它并没有改变函数外部 lst 所引用的内容；外部的\
  \ lst 仍然是 [1]。\n\n这是怎么回事——我之前不是告诉过你，函数可以改变可变参数吗？我确实说过；但要实现这一点，你真的需要改变值本身，而不是改变局部变量所引用的对象。请把之前的程序和下面这个程序比较一下，它们的输出是不同的：\n\
  \n```\ndef mystery(s, lst):\n    s.upper() # upper creates a new string\n    lst.append(2)\
  \ # append changes the list\n\ns = 'a'\nlst = [1]\nmystery(s, lst)\n\nprint(s, lst)\n\
  ```\n\n## 返回值\n\n让我们回到“纸牌游戏”问题。我们的目标是定义一个函数，判断牌列表中是否没有大牌。我们把这个函数命名为 no_high。我们还没有编写\
  \ no_high，但我们仍然可以说明我们想要实现的目标。以下是我们期望的效果：\n\n```\n>>> no_high(['two', 'six'])\nTrue\n\
  >>> no_high(['eight'])\nTrue\n>>> no_high(['two', 'jack', 'four'])\nFalse\n>>> no_high(['queen',\
  \ 'king', 'three', 'queen'])\nFalse\n```\n\n```\n...           print(i, j)\n...\
  \           if j == 4:\n...               return\n...\n>>> func()\n0 0\n0 1\n0 2\n\
  0 3\n0 4\n```\n\nreturn 就像一种超级 break！有些人不喜欢在循环中使用 return，原因和不喜欢 break 一样：它可能会掩盖循环的目的和逻辑。方便的时候我会在循环中使用\
  \ return。与可以出现在任何地方的 break 不同，return 只能出现在函数内部，与其他代码分隔开。如果我们保持函数短小精悍，那么在循环中使用 return\
  \ 可以帮助我们写出清晰的代码，而不会干扰周围的代码。\n\n![](img/3e15323aee4cec3bf673834bfafe8024_196_0.png)\n\
  \n答案：E. if-else 语句使循环在第一次迭代时总是终止。如果第一张牌是大牌，函数终止并返回 False；如果第一张牌不是大牌，函数终止并返回 True。它不会查看任何其他牌！这就是它在\
  \ ['two', 'jack'] 上失败的原因：第一张牌不是大牌，所以函数返回 True。返回 True 告诉我们列表中没有大牌。但这是错误的：里面有一张 jack！函数做错了。它本应返回\
  \ False。\n\n## 函数文档\n\n现在，我们的 no_high 函数是做什么的、应该怎样调用，我们都一清二楚。但几个月后，当旧代码的用途不再那么容易想起时怎么办？而且，一旦我们积累了大量自己的函数，很难记住每个函数是做什么的，又该怎么办？\n\
  \n对于我们编写的每个函数，我们都会添加文档，说明每个参数的含义以及函数的返回值。这种文档称为 docstring，也就是“文档字符串”（documentation\
  \ string）。docstring 应该写在函数块的第一行。下面是 no_high 函数，这次带上了文档：\n\n```\n>>> def no_high(lst):\n\
  ...     \"\"\"\n...     lst is a list of strings representing cards.\n...\n... \
  \    Return True if there are no high cards in lst, False otherwise.\n...     \"\
  \"\"\n...     if 'jack' in lst:\n...         return False\n...     if 'queen' in\
  \ lst:\n...         return False\n...     if 'king' in lst:\n...         return\
  \ False\n...     if 'ace' in lst:\n...         return False\n...     return True\n\
  ...\n```\n\ndocstring 以三个双引号（\"\"\"）开头和结尾。和单引号（'）或双引号（\"）一样，三个双引号也可以用来开始和结束任何字符串。用三个引号创建的字符串称为三引号字符串。（三个单引号也可以，但\
  \ Python 的惯例是使用三个双引号。）它们还有一个好处：只要在每一行后面按 ENTER，就可以把多行文本添加到字符串中；而用 ' 或 \" 创建的字符串不能这样跨行。我们使用三引号字符串作为\
  \ docstring，这样就可以包含我们想要的任意多行内容。\n\n这里的 docstring 告诉我们 lst 是什么：它是一个表示牌的字符串列表。它还告诉我们函数返回\
  \ True 或 False，以及每个返回值表示什么。这些信息足以让调用者无需查看代码即可调用该函数。只要知道函数做什么，就可以直接使用它。我们一直在使用 Python\
  \ 函数，却从未查看过它们的代码。print 是如何工作的？input 是如何工作的？我们不知道！但这并不重要：我们知道这些函数的功能，所以只需专注于调用它们。\n\
  \n对于有多个参数的函数，docstring 应该列出每个参数的名称，并说明其预期类型。下面是本章“可变参数”一节中的 remove_all，以及一个合适的 docstring：\n\
  \n```\n>>> def remove_all(lst, value):\n... \"\"\"\n... lst is a list.\n... value\
  \ is a value.\n...\n... Remove all occurrences of value from lst.\n... \"\"\"\n\
  ... while value in lst:\n...     lst.remove(value)\n...\n```\n\n注意，这个 docstring\
  \ 没有提到返回任何内容。那是因为这个函数不会返回任何有用的东西！它从 lst 中移除元素，这正是 docstring 所描述的功能。\n\n## 解决问题\n\
  \n我们刚刚学习了定义和调用函数的基础知识。在本书的剩余部分，每当我们面对一个需要解决的大问题时，我们都能把它的解决方案拆分成更小的任务，每个任务由一个函数来解决。\n\
  \n让我们把 no_high 函数用到“纸牌游戏”的解决方案中。代码见清单 6-1。\n\n```\n① NUM_CARDS = 52\n\n② def no_high(lst):\n\
  \    \"\"\"\n    lst is a list of strings representing cards.\n\n    Return True\
  \ if there are no high cards in lst, False otherwise.\n    \"\"\"\n    if 'jack'\
  \ in lst:\n        return False\n    if 'queen' in lst:\n        return False\n\
  \    if 'king' in lst:\n        return False\n    if 'ace' in lst:\n        return\
  \ False\n    return True\n\n③ deck = []\n\n④ for i in range(NUM_CARDS):\n    deck.append(input())\n\
  \nscore_a = 0\nscore_b = 0\nplayer = 'A'\n\n⑤ for i in range(NUM_CARDS):\n    card\
  \ = deck[i]\n    points = 0\n⑥ remaining = NUM_CARDS - i - 1\n⑦ if card == 'jack'\
  \ and remaining >= 1 and no_high(deck[i+1:i+2]):\n    points = 1\nelif card == 'queen'\
  \ and remaining >= 2 and no_high(deck[i+1:i+3]):\n    points = 2\nelif card == 'king'\
  \ and remaining >= 3 and no_high(deck[i+1:i+4]):\n    points = 3\nelif card == 'ace'\
  \ and remaining >= 4 and no_high(deck[i+1:i+5]):\n    points = 4\n\n⑧ if points\
  \ > 0:\n```\n\n```\nprint(f'Player {player} scores {points} point(s).')\n\nif player\
  \ == 'A':\n    score_a = score_a + points\n    player = 'B'\nelse:\n    score_b\
  \ = score_b + points\n    player = 'A'\n\nprint(f'Player A: {score_a} point(s).')\n\
  print(f'Player B: {score_b} point(s).')\n```\n\n# 清单 6-1：解决纸牌游戏\n\n我引入了常量 NUM_CARDS\
  \ 来表示 52 ❶。我们会在代码中用到它几次，而记住 NUM_CARDS 的含义比记住 52 的含义更容易。\n\n接下来，我们定义已经深入讨论过的 no_high\
  \ 函数，包括其 docstring ❷。我们总是把函数放在程序靠前的位置。这样，后面的任何代码都可以调用这些函数。\n\n程序的主要部分首先创建一个列表，用来存放牌堆中的牌\
  \ ❸。然后我们从输入中读取牌 ❹，把每张牌追加到牌堆中。你会注意到，牌从未真正从牌堆中移除或取走（在程序执行期间，牌堆始终保持原样）。我们本可以那样做。相反，我选择跟踪牌堆中的位置，以便知道接下来会移除哪张牌。\n\
  \n我们还维护了另外三个关键变量：score_a，玩家 A 的当前总分；score_b，玩家 B 的当前总分；以及 player，当前玩家的名字。\n\n我们的下一个任务是查看牌堆中的每张牌，为玩家计分。普通的\
  \ for 循环可以让我们查看当前牌。但这还不够：如果当前牌是大牌，我们还必须能够查看后面的牌。为了方便这一点，我们使用 range for 循环 ❺。\n\n\
  在这个循环的每次迭代中，我们根据当前玩家从牌堆中取出的牌来确定该玩家获得的分数。每条得分规则都依赖于牌堆中剩余一定数量的牌。变量 remaining ❻ 告诉我们剩余牌的数量。当\
  \ i 为 0 时，剩余牌数为 51，因为我们刚刚取走了第一张牌。当 i 为 1 时，剩余牌数为\n\n\n\n剩余卡片数为 50，因为我们刚刚取出了第二张卡片。一般来说，剩余卡片数的表达式为卡片总数减去\
  \ i 再减去 1。\n\n现在我们有四个测试，对应每种得分方式 ⑦。每个测试都会检查当前卡片和剩余卡片数。如果这两个条件都为 True，则会调用我们的 no_high\
  \ 函数，并传入包含适当数量卡片的牌堆切片。例如，如果当前卡片是 'jack' 且至少还剩 1 张卡片，则我们向 no_high ⑦ 传递长度为 1 的列表。如果\
  \ no_high 返回 True，则说明切片列表中没有高牌，因此当前玩家得 points。points 变量决定了将授予的分数数；它在循环的每次迭代中从 0\
  \ 开始，并根据情况设置为 1、2、3 或 4。\n\n如果玩家得分了 points ⑧，则我们输出一条消息，指示得分的玩家以及他们得分的数量。\n\n当前迭代剩下的唯一工作就是将分数加到当前玩家的分数上并轮到另一位玩家。我们通过\
  \ if-else 语句 ⑨ 完成这两个任务。（如果本次迭代 points 为 0，则会向玩家的分数中添加一个无害的 0。没有理由显式地测试并避免这种情况。）\n\
  \n最后两个 print 调用输出每个玩家的总分。\n\n好了：一个使用函数来组织代码并使其更易于阅读的问题解决方案。随时将我们的代码提交给评测，你应该会看到所有测试用例都通过了。\n\
  \n## 问题 #15：行动人物\n\n为了解决 Card Game，我们首先通过了一个示例，而该示例突出了函数可能有用的地方。现在，我们将使用函数解决另一个问题，但我们将使用更系统的方法来发现所需的函数。\n\
  \n这是 Timus 问题 2144。这是本书中唯一来自 Timus 评测的问题。要找到该问题，请访问 https://acm.timus.ru/，点击 Problem\
  \ set，点击 Volume 12，并找到问题 2144（在评测中称为 Cleaning the Room）。\n\n## 挑战\n\nLena 有 n 个未开封的行动人物盒子。盒子不能打开（否则行动人物会失去价值），因此盒子中行动人物的顺序不能改变。此外，盒子不能旋转（否则行动人物会面向错误的方向）。\n\
  \n每个行动人物都由其高度指定。例如，其中一个盒子可能从左到右有三个行动人物，高度分别为 4、5 和 7。当我谈论一个行动人物盒子时，我总是从左到右列出高度。\n\
  \nLena 想整理盒子，这意味着要排列盒子，使行动人物的高度从左到右递增或保持不变。\n\n她是否能整理盒子取决于盒子中行动人物的高度。例如，如果第一个盒子有高度为\
  \ 4、5 和 7 的行动人物，而第二个盒子有高度为 1 和 2 的行动人物，那么她可以通过将第二个盒子放在前面来整理这些盒子。但如果我们保持第一个盒子不变并将第二个盒子改为有高度为\
  \ 6 和 8 的行动人物，那么就无法整理这些盒子。\n\n判断 Lena 是否有可能整理盒子。\n\n## 输入\n\n输入由以下几行组成：\n\n- 包含整数\
  \ n 的一行，表示盒子的数量。n 在 1 到 100 之间。\n- n 行，每行对应一个盒子。每行以整数 k 开头，表示该盒子中行动人物的数量。k 在 1 到\
  \ 100 之间。（由于 k 至少为 1，我们不必担心空盒子。）k 之后有 k 个整数，给出该盒子中从左到右的行动人物高度。每个高度都是 1 到 10,000\
  \ 之间的整数。行中每对整数之间有一个空格。\n\n## 输出\n\n如果 Lena 能整理盒子，输出 YES；否则，输出 NO。\n\n## 表示盒子\n\n\
  这个问题由几个小问题组成，我们可以通过编写函数来解决每个小问题。让我们先看看如何在 Python 中表示盒子，然后再设计我们需要的函数。\n\n在第 5 章中，当我们解决\
  \ Baker Bonus 时，我们了解到列表的值可以是其他列表。这使我们能够在列表内嵌套列表。我们可以使用这种安排来表示行动人物盒子。例如，这里有一个表示两个盒子的列表：\n\
  \n```\n>>> boxes = [[4, 5, 7], [1, 2]]\n```\n\n第一个盒子有三个行动人物，第二个有兩個。我们可以单独访问每个盒子：\n\
  \n```\n>>> boxes[0]\n[4, 5, 7]\n>>> boxes[1]\n[1, 2]\n```\n\n我们将从输入中读取盒子的内容并将该信息放入嵌套列表中，如我所示。然后我们将使用该嵌套列表来确定盒子是否可以整理。\n\
  \n## 自顶向下设计\n\n我们将使用一种称为自顶向下设计的方法来解决这个问题。自顶向下设计将一个大问题分解为几个小问题。这很有用，因为每个小问题都更容易解决。然后我们可以将这些子问题解决方案组合起来解决原始问题。\n\
  \n## 进行自顶向下设计\n\n自顶向下设计的工作方式如下。我们首先编写一个不完整的 Python 程序，捕捉解决方案中的主要任务。其中一些任务不需要太多代码，因此我们可以直接解决它们。其他任务需要我们更多的工作，我们会将每个任务变成一个我们将调用的函数。我们也可能通过编写少量代码并调用一个函数来解决一个任务。然而，这些函数还不存在。我们必须编写它们！\n\
  \n要编写所需的函数，我们对该函数的任务重复相同的过程。也就是说，我们首先写下该函数的任务。如果我们可以直接为任务编写代码，那么我们就这样做；否则，我们调用另一个函数（我们稍后会编写）来处理该任务。\n\
  \n我们一直这样做，直到没有更多函数需要编写为止。此时，我们将拥有问题的解决方案。\n\n它被称为自顶向下设计，因为我们从顶部或最高级别的问题开始，并向下深入问题的内部，直到每个任务都完全用代码编写。我们现在将用它来解决\
  \ Action Figures。\n\n## 顶层\n\n为了开始我们的设计，我们关注需要解决的主要任务。\n\n我们当然必须读取输入，所以这是我们的第一个任务。\n\
  \n现在，假设我们已经读取了输入。我们应该做什么来确定盒子是否可以整理？一个重要事项是检查每个盒子本身，以确保其行动人物的高度是有序的。例如，假设我们有盒子 [18,\
  \ 20, 4]。这个盒子高度无序，意味着我们没有机会整理所有盒子。我们甚至无法整理这个盒子！\n\n所以，这是我们的第二个任务：确定每个盒子本身的行动人物高度是否有序。如果这些盒子中的任何一个行动人物高度无序，那么我们就知道盒子不能被整理。如果所有盒子都\
  \ OK，那么我们还有更多要检查。\n\n如果每个盒子本身都 OK，下一个问题是我们是否可以整理所有盒子。这里我们可以做一个重要的观察：从现在开始，我们只关心每个盒子左右两侧的行动人物。盒子之间的行动人物不再重要。\n\
  \n考虑这个有三个盒子的例子：\n\n```\n[[9, 13, 14, 17, 25],\n[32, 33, 34, 36],\n[1, 6]]\n```\n\
  \n第一个盒子以高度为 9 的行动人物开始，以高度为 25 的行动人物结束。放置在此盒子左侧的所有行动人物必须全部高度为 9 或更小；例如，我们可以将第三个盒子放在此盒子左侧。放置在此盒子右侧的所有行动人物必须全部高度为\
  \ 25 或更大；例如，我们可以将第二个盒子放在此盒子右侧。高度为 13、14 和 17 的行动人物什么都不会改变；它们就好像不存在一样。\n\n那么，这是我们的第三个任务：忽略除盒子两端行动人物之外的所有行动人物。\n\
  \n完成第三个任务后，我们将得到一个如下所示的列表：\n\n```text\n[[9, 25],\n [32, 36],\n [1, 6]]\n```\n\n\
  如果我们先对这些盒子进行排序，就更容易判断是否可以整理这些盒子，如下所示：\n\n```text\n[[1, 6],\n [9, 25],\n [32, 36]]\n\
  ```\n\n现在很容易看出一个盒子的邻居盒子必须是什么。（我们在第 5 章解决 Village Neighborhood 时使用了类似的方法。）所以，我们的第四个任务是对这些新盒子进行排序。\n\
  \n我们的第五个也是最后一个任务是确定这些排序后的盒子是否已整理。它们是有序的，如果行动人物的高度从左到右排序。高度为 1、6、9、25、32 和 36 的行动人物排序合适，因此之前的盒子可以整理。但考虑这个例子：\n\
  \n```text\n[[1, 6],\n [9, 50],\n [32, 36]]\n```\n\n这些盒子不能整理，因为第二个盒子中有一个巨大的行动人物。那个第二个盒子占据了\
  \ 9 到 50 的高度；第三个盒子不能放在第二个盒子的右边，因为它的高度太小。\n\n我们现在已经完成了对问题的研究，并确定了五个主要任务：\n\n- 1.\
  \ 读取输入。\n- 2. 检查所有盒子是否 OK。\n- 3. 获取一个仅包含每个盒子左右行动人物高度的新盒子列表。\n- 4. 对这些新盒子进行排序。\n\n\
  \n\n\n\n# 5. 判断这些整理过的箱子是否有序。\n\n你可能好奇为什么我们有一个“读取输入”的任务，却没有“写出输出”的任务。对于这个问题，写出输出只需要按需输出\
  \ YES 或 NO，没什么内容。另外，我们一知道答案就会输出 YES 或 NO，因此输出会与其他任务交错进行。基于这些原因，我决定不把它列为主要任务。在你自行进行自顶向下设计时，如果后来发现自己漏掉了一个任务，不用太担心。你只需把它补上并继续你的设计即可。\n\
  \n下面是如何用代码来体现我们所需的任务：\n\n```\n❶ # Main Program\n\n  # TODO: Read input\n\n  # TODO:\
  \ Check whether all boxes are OK\n\n  # TODO: Obtain a new list of boxes with only\
  \ left and right heights\n\n  # TODO: Sort boxes\n\n  # TODO: Determine whether\
  \ boxes are organized\n```\n\n我将其称为主程序 ❶。我们编写的任何函数都应包含在此注释之前。\n\n目前每个任务都只写成了一个注释。其中的\
  \ TODO 标记是为了强调这些是我们需要从英语转为 Python 的任务。一旦我们完成某个任务，就会去掉它的 TODO。这样，我们就能跟踪哪些任务已完成、哪些尚未完成。让我们开始吧！\n\
  \n## 任务 1：读取输入\n\n我们需要读取包含 *n*（箱子数量）的那一行，然后读取各个箱子。读取一个整数可以用一行代码完成，所以我们直接读取 *n*。另一方面，读取箱子是一个定义明确的任务，需要几行代码，所以让我们用一个函数来解决它；我们将它命名为\
  \ read_boxes。这是我们主程序目前的进展：\n\n```\n# Main Program\n```\n\n```\n```python\n# Read\
  \ input\nn = int(input())\nboxes = read_boxes(n)\n\n# TODO: Check whether all boxes\
  \ are OK\n\n# TODO: Obtain a new list of boxes with only left and right heights\n\
  \n# TODO: Sort boxes\n\n# TODO: Determine whether boxes are organized\n```\n```\n\
  \n我已经从注释 ❶ 中移除了 TODO，因为从主程序的角度来看，我们已经解决了该任务。当然，我们还需要编写 read_boxes 函数，现在就来写吧。\n\n\
  read_boxes 函数接受一个整数 n 作为参数，并读取和返回 n 个箱子。代码如下：\n\n```\n```python\ndef read_boxes(n):\n\
  \    \"\"\"\n    n is the number of boxes to read.\n\n    Read the boxes from the\
  \ input, and return them as a\n    list of boxes; each box is a list of action figure\
  \ heights.\n    \"\"\"\n    boxes = []\n    for i in range(n):\n        box = input().split()\n\
  \        box.pop(0)\n        for i in range(len(box)):\n            box[i] = int(box[i])\n\
  \        boxes.append(box)\n    return boxes\n```\n```\n\n我们需要读取 n 个箱子，所以循环 n 次\
  \ ❶。在每次循环迭代中，我们读取当前行，并将其拆分为一个个动作人偶高度。该行以表示高度数量的整数开头，因此我们在继续之前将该值从列表中移除（它位于索引 0 处）❷。然后我们将每个高度转换为整数，并将当前箱子添加到箱子列表中。最后，我们返回箱子列表。\n\
  \n我们没有把 read_boxes 的任何部分推迟到尚未编写的函数中，所以这个任务完成了！我们会把这个函数以及我们编写的其他函数放在 `# Main Program`\
  \ 注释之前。\n\nreturn False\nreturn True\n\n我在注释中使用了“非递减”一词，而不是“递增”，因为动作人偶的高度允许相等。例如，箱子\
  \ [4, 4, 4] 完全没问题；声称这个箱子是“递增”则是不正确的。\n\n我们已经把 all_boxes_ok 任务的一部分推给了 box_ok，所以接下来编写这个函数。如下：\n\
  \n```\ndef box_ok(box):\n    \"\"\"\n    box is the list of action figure heights\
  \ in a given box.\n\n    Return True if the heights in box are in nondecreasing\
  \ order,\n    False otherwise.\n    \"\"\"\n    for i in range(len(box)):\n    \
  \    if box[i] > box[i + 1]:\n            return False\n    return True\n```\n\n\
  如果任何高度大于其右侧的高度，我们就返回 False，因为这些高度没有按顺序排列。如果我们顺利通过 for 循环，说明没有高度违规，因此返回 True。\n\n\
  使用自顶向下设计的一个很好的副作用是，我们会得到一些小块的代码，封装成函数，可以单独测试。例如，将 box_ok 的代码输入 Python shell。然后我们可以测试它：\n\
  \n```\n>>> box_ok([4, 5, 6])\n```\n\n我们当然希望这里返回 True，因为该箱子是从小到大排列的。但我们肯定不希望看到实际得到的结果：\n\
  \n```\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n\
  \  File \"<stdin>\", line 9, in box_ok\nIndexError: list index out of range\n```\n\
  \n错误从来都不好玩，而当我们需要翻遍一页又一页的代码来查找它们时，就更不好玩了。但在这里，我们知道错误仅限于这个小函数，因此我们查找它的工作量大大减少了。这里的问题在于，我们最终会将最右侧的高度与其右侧的高度进行比较——而后者当然不存在！所以我们需要提前一个迭代停止，将倒数第二个高度与最后一个高度进行比较。以下是更新后的代码：\n\
  \n```\ndef box_ok(box):\n    \"\"\"\n    box is the list of action figure heights\
  \ in a given box.\n\n    Return True if the heights in box are in nondecreasing\
  \ order,\n    False otherwise.\n    \"\"\"\n    for i in range(len(box) - 1):\n\
  \        if box[i] > box[i + 1]:\n            return False\n    return True\n```\n\
  \n唯一的变化在调用 range 处 ①。如果你测试这个版本的函数，你会看到它按要求工作。任务 2 完成了！\n\n## 任务 3：获取仅包含左右两端高度的新箱子列表\n\
  \n现在我们已经掌握了自顶向下设计的要领。在这个任务中，我们需要一种方法，从包含所有动作人偶的箱子，转换为仅包含最左侧和最右侧动作人偶的箱子。我将最左侧和最右侧的动作人偶称为箱子的端点。\n\
  \n一种方法是创建一个仅包含端点的新的箱子列表，我在这里就是这么做的。你也可以考虑直接从原箱子中移除高度，不过那会稍微棘手一些。\n\n我将这个任务的函数命名为\
  \ boxes_endpoints。这是主程序的主要部分，已更新为该函数的调用：\n\n```\n# Main Program\n\n# Read input\n\
  n = int(input())\nboxes = read_boxes(n)\n\n# Check whether all boxes are OK\nif\
  \ not all_boxes_ok(boxes):\n    print('NO')\nelse:\n```\n\n```\n# Obtain a new list\
  \ of boxes with only left and right heights\n① endpoints = boxes_endpoints(boxes)\n\
  \n# TODO: Sort boxes\n\n# TODO: Determine whether boxes are organized\n```\n\n当我们用一个箱子列表调用\
  \ boxes_endpoints 时 ①，我们期望得到一个新的、仅包含箱子端点的列表。下面是符合该描述的 boxes_endpoints 代码：\n\n```\n\
  def boxes_endpoints(boxes):\n    \"\"\"\n    boxes is a list of boxes; each box\
  \ is a list of action figure heights.\n\n    Return a list, where each value is\
  \ a list of two values:\n    the heights of the leftmost and rightmost action figures\
  \ in a box.\n    \"\"\"\n    ① endpoints = []\n    for box in boxes:\n        ②\
  \ endpoints.append([box[0], box[-1]])\n    return endpoints\n```\n\n我们创建一个新的列表 ①，用来保存每个箱子的端点。然后我们遍历这些箱子。对于每个箱子，我们使用索引找到箱子里最左侧和最右侧的高度，并将它们添加到我们的端点列表中\
  \ ②。最后，我们返回端点列表。\n\n等等：如果有一个箱子里面只有一个动作人偶会怎样？我们的 boxes_endpoints 函数会如何处理它？根据其文档字符串，对于任何有效的箱子，它都会返回一个包含两个值的列表。所以这里最好能做到；否则，该函数就没有履行它的承诺。让我们测试一下。将\
  \ boxes_endpoints 函数输入 Python shell，并用一个包含单个动作人偶的单个箱子来测试：\n\n```\n>>> boxes_endpoints([[2]])\n\
  [[2, 2]]\n```\n\n成功！最左侧高度是 2，最右侧高度也是 2，所以我们得到一个包含两个 2 的列表。在这种情况下，我们的函数工作正常，因为当 box\
  \ 只有一个值时，box[0] 和 box[-1] 引用的是同一个值。（不用担心空箱子的情况。问题描述中禁止出现空箱子。）\n\n\n\n\n\n## 任务 4：对箱子进行排序\n\
  \n至此，我们有了一个端点列表，类似这样：\n\n```python\n>>> endpoints = [[9, 25], [32, 36], [1, 6]]\n\
  >>> endpoints\n[[9, 25], [32, 36], [1, 6]]\n```\n\n我们想对它们进行排序。需要再写一个函数吗？某种 `sort_endpoints`\
  \ 函数？\n\n这次不用了！列表的 `sort` 方法正好满足我们的需求：\n\n```python\n>>> endpoints.sort()\n>>> endpoints\n\
  [[1, 6], [9, 25], [32, 36]]\n```\n\n当对一个由两个值的列表组成的列表调用 `sort` 时，它会使用第一个值进行排序。（如果第一个值相同，则进一步使用第二个值排序。）\n\
  \n我们可以立即更新程序的主部分，加入对 `sort` 的调用，然后划掉又一个 TODO。以下是更新后的代码：\n\n```python\n# Main Program\n\
  \n# Read input\nn = int(input())\nboxes = read_boxes(n)\n\n# Check whether all boxes\
  \ are OK\nif not all_boxes_ok(boxes):\n    print(\"NO\")\nelse:\n    # Obtain a\
  \ new list of boxes with only left and right heights\n    endpoints = boxes_endpoints(boxes)\n\
  \n    # Sort boxes\n    endpoints.sort()\n\n    # TODO: Determine whether boxes\
  \ are organized\n```\n\n我们快要完成了。只剩一个 TODO 了。\n\n## 任务 5：判断箱子是否有序\n\n最后一项任务是检查端点。它们可能是有序的，像这样：\n\
  \n```python\n[[1, 6],\n[9, 25],\n[32, 36]]\n```\n\n也可能不是，像这样：\n\n```python\n[[1,\
  \ 6],\n[9, 50],\n[32, 36]]\n```\n\n对于前一种情况，我们应输出 `YES`；对于后一种情况，我们应输出 `NO`。我们需要一个函数来告诉我们端点是否有序。最后一次更新程序的主部分，最终得到如下代码：\n\
  \n```python\n# Main Program\n\n# Read input\nn = int(input())\nboxes = read_boxes(n)\n\
  \n# Check whether all boxes are OK\nif not all_boxes_ok(boxes):\n    print('NO')\n\
  else:\n    # Obtain a new list of boxes with only left and right heights\n    endpoints\
  \ = boxes_endpoints(boxes)\n\n    # Sort boxes\n    endpoints.sort()\n\n    # Determine\
  \ whether boxes are organized\n    if all_endpoints_ok(endpoints):\n        print('YES')\n\
  \    else:\n        print('NO')\n```\n\n距离完整解决问题，只剩我们调用的那个 `all_endpoints_ok` 函数了。它接收一个列表，其中每个值都是一个端点列表，如果端点有序则返回\
  \ `True`，否则返回 `False`。\n\n让我们通过一个例子来感受如何实现这个函数。这里是我们将要使用的端点列表：\n\n```python\n[[1,\
  \ 6],\n[9, 25],\n[32, 36]]\n```\n\n第一个盒子的右端点高度为 6。因此，第二个盒子的左端点高度最好为 6 或更大。如果不是，则返回\
  \ `False`，表示端点无序。但这里没问题，因为第二个盒子的左端点高度为 9。\n\n现在我们用第二个盒子的右端点 25 重复这个检查。第三个盒子的左端点是\
  \ 32，所以 32 至少是 25，同样没问题。\n\n一般来说，如果某个盒子的左端点小于前一个盒子的右端点，我们返回 `False`。否则，如果所有这些检查都通过，我们返回\
  \ `True`。\n\n代码如下：\n\n```python\ndef all_endpoints_ok(endpoints):\n    \"\"\"\n\
  \    endpoints is a list, where each value is a list of two values:\n    the heights\
  \ of the leftmost and rightmost action figures in a box.\n\n    Requires: endpoints\
  \ is sorted by action figure heights.\n\n    Return True if the endpoints came from\
  \ boxes that can be\n    put in order, False otherwise.\n    \"\"\"\n    maximum\
  \ = endpoints[0][1]\n    for i in range(1, len(endpoints)):\n        if endpoints[i][0]\
  \ < maximum:\n            return False\n        maximum = endpoints[i][1]\n    return\
  \ True\n```\n\n我在 docstring 中添加了一些信息，提醒我们调用该函数时需要满足的条件。具体来说，在调用此函数之前，我们必须先对端点进行排序。否则，函数可能返回错误的值。\n\
  \n`endpoints` 中的每个值都是一个包含两个值的列表：索引 0 是最左（最小）高度，索引 1 是最右（最大）高度。代码使用 `maximum` 变量来跟踪一个盒子的最大高度。在\
  \ for 循环之前，它指向第一个盒子中的最大高度。for 循环将下一个盒子的最小值与该最大值进行比较。如果下一个盒子的最小值太小，我们返回 `False`，因为这两个盒子无法正确排列。每次迭代中要做的最后一件事是更新\
  \ `maximum`，使其指向下一个盒子的最大值。\n\n## 整合所有代码\n\n在完成了所有任务的代码编写之后，包括设计中产生的各个函数，我们可以将所有代码整合成一个完整的解决方案。主程序部分是否保留注释由你决定。我把它们保留了下来，但在实际中，这可能属于过度注释的情况，因为函数名本身就已选择用来传达代码的意图。完整代码见清单\
  \ 6-2。\n\n```python\ndef read_boxes(n):\n    \"\"\"\n    n is the number of boxes\
  \ to read.\n\n    Read the boxes from the input, and return them as a\n    list\
  \ of boxes; each box is a list of action figure heights.\n    \"\"\"\n    boxes\
  \ = []\n    for i in range(n):\n        box = input().split()\n        box.pop(0)\n\
  \        for i in range(len(box)):\n            box[i] = int(box[i])\n        boxes.append(box)\n\
  \    return boxes\n\ndef box_ok(box):\n    \"\"\"\n    box is the list of action\
  \ figure heights in a given box.\n\n    Return True if the heights in box are in\
  \ nondecreasing order,\n    False otherwise.\n    \"\"\"\n    for i in range(len(box)\
  \ - 1):\n        if box[i] > box[i + 1]:\n            return False\n    return True\n\
  \ndef all_boxes_ok(boxes):\n    \"\"\"\n    boxes is a list of boxes; each box is\
  \ a list of action figure heights.\n\n    Return True if each box in boxes has its\
  \ action figures in\n    nondecreasing order of height, False otherwise.\n    \"\
  \"\"\n    for box in boxes:\n        if not box_ok(box):\n            return False\n\
  \    return True\n\ndef boxes_endpoints(boxes):\n    \"\"\"\n    boxes is a list\
  \ of boxes; each box is a list of action figure heights.\n\n    Return a list, where\
  \ each value is a list of two values:\n    the heights of the leftmost and rightmost\
  \ action figures in a box.\n    \"\"\"\n    endpoints = []\n    for box in boxes:\n\
  \        endpoints.append([box[0], box[-1]])\n    return endpoints\n\ndef all_endpoints_ok(endpoints):\n\
  \    \"\"\"\n    endpoints is a list, where each value is a list of two values:\n\
  \    the heights of the leftmost and rightmost action figures in a box.\n\n    Requires:\
  \ endpoints is sorted by action figure heights.\n\n    Return True if the endpoints\
  \ came from boxes that can be\n    put in order, False otherwise.\n    \"\"\"\n\
  \    maximum = endpoints[0][1]\n    for i in range(1, len(endpoints)):\n       \
  \ if endpoints[i][0] < maximum:\n            return False\n        maximum = endpoints[i][1]\n\
  \    return True\n\n# Main Program\n\n# Read input\nn = int(input())\nboxes = read_boxes(n)\n\
  \n# Check whether all boxes are OK\nif not all_boxes_ok(boxes):\n    print('NO')\n\
  else:\n    # Obtain a new list of boxes with only left and right heights\n    endpoints\
  \ = boxes_endpoints(boxes)\n\n    # Sort boxes\n    endpoints.sort()\n\n    # Determine\
  \ whether boxes are organized\n    if all_endpoints_ok(endpoints):\n        print('YES')\n\
  \    else:\n        print('NO')\n```\n\n## 清单 6-2：解决动作人偶问题\n\n这是本书到目前为止我们编写的最大的程序。但看看主程序部分是多么整洁和精简：它主要是函数调用，加上一点\
  \ if-else 逻辑将它们粘合在一起。\n\n我们在这里每个函数只调用了一次。想想我们调用了四次的 `no_high` 纸牌游戏函数。即使一个函数只被调用一次，它仍然有助于代码的组织性和可读性。\n\
  \n是时候提交到 Timus 评测系统了。你应该会看到所有测试用例都通过。\n\n## 概念检查\n\n在任务 2 中，我们编写了函数 `box_ok`，用于判断单个箱子的高度是否有序。它使用了一个\
  \ range for 循环。下面是 `box_ok` 的 while 循环版本，请问它正确吗？\n\n```python\ndef box_ok(box):\n\
  \    \"\"\"\n    box is the list of action figure heights in a given box.\n\n  \
  \  Return True if the heights in box are in nondecreasing order,\n    False otherwise.\n\
  \    \"\"\"\n    ok = True\n    i = 0\n    while i < len(box) - 1 and ok:\n    \
  \    if box[i] > box[i + 1]:\n            ok = False\n        i = i + 1\n    return\
  \ ok\n```\n\n\n\n\n\n+   A. 是\n+   B. 否；它会引发 IndexError\n+   C. 否；它不会引发任何错误，但可能会返回错误的值\n\
  \n答案：A. 这等价于我们之前使用 range for 循环的版本。ok 变量初始为 True，意味着我们检查过的所有高度都正常（因为我们还没有检查任何一个！）。只要还有盒子需要检查并且没有高度违规，while\
  \ 循环就会继续。如果某个动作人偶顺序错误，ok 会被设为 False，从而终止循环。如果所有动作人偶都按顺序排列，那么 ok 的值永远不会从 True 变为\
  \ False。因此，当我们在函数底部返回 ok 时，如果所有动作人偶都按顺序排列，我们返回 True，否则返回 False。\n\n## 摘要\n\n在本章中，我们学习了函数。函数是解决较大问题中较小部分的一段自包含代码。我们学习了如何通过参数向函数传递信息，以及通过返回值获取信息。\n\
  \n为了确定首先要编写哪些函数，我们可以使用自顶向下设计。自顶向下设计帮助我们将解决大问题的方案分解为若干较小的任务；对于每个任务，如果可以直接解决就直接解决，否则为其编写函数。如果某个任务过于复杂，我们可以对其进行进一步的自顶向下设计。\n\
  \n在下一章中，我们将学习如何处理我们选择的文​​件，而不是使用标准输入和标准输出。随着我们不断拓展所知边界，我们将在本章及本书其余部分发现许多函数的使用方式。练习以下一些练习，以提高你使用函数的信心。\n\

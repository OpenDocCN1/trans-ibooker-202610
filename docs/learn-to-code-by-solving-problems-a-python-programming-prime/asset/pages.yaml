  md: 'It’s time to tackle the problem itself.


    Let’s start by exploring a test case to make sure we know how to solve this problem.
    Then we’ll see the code.


    # Exploring a Test Case


    Here’s the word.in file I’ve been using:


    ```

    12 13

    perhaps better poetry will be written in the language of digital computers

    ```


    There are 12 words, and the maximum number of characters on a line (not counting
    spaces) is 13. We should add words to the current line as long as they fit; once
    a word doesn’t fit, we’ll start a new line with that word.


    The word perhaps contains seven characters, so it fits on the first line. The
    word better contains six characters. We can put that on the first line, too; with
    perhaps already there, we’re at a total of 13 characters (not including the space
    between the two words).


    The word poetry can’t go on the first line, so we start a new line with poetry
    as its first word. The word will fits next to poetry on the second line. Similarly,
    be fits next to will. We’re at 12 nonspace characters so far. Now we have the
    word written, and with only one character of room on line 2, we’re forced to start
    the next line with written as its first word.


    Following this process to the end, the full essay that we need to write to word.out
    is this:


    ```

    perhaps better

    poetry will be

    written in the

    language of

    digital

    computers

    ```


    # The Code


    Our solution is in Listing 7-1.


    ```

    ① input_file = open(''word.in'', ''r'')

    ② output_file = open(''word.out'', ''w'')


    ③ lst = input_file.readline().split()

    ```'

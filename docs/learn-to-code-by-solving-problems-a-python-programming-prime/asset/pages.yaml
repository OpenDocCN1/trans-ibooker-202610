    How many bonuses are awarded in this test case? Let’s first look at the rows of
    the table, which correspond to days. The sum of the sales for row 0 is 1 + 13
    + 2 + 1 + 1 + 8 = 26. As 26 is a multiple of 13, this row gives us 26 / 13 = 2

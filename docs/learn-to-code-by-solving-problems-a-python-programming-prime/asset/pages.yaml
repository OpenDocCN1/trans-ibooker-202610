- pgno: 279
  md: 'Dictionaries have methods that let us access the keys, values, or both. The
    keys method gives us the keys, and the values method gives us the values:


    ```

    >>> d.keys()

    dict_keys([''cut'', ''gully'', ''storm'', ''brook''])

    >>> d.values()

    dict_values([4, 3, 2, 2])

    ```


    These aren’t lists, but we can pass them to list to convert them:


    ```

    >>> keys = list(d.keys())

    >>> keys

    [''cut'', ''gully'', ''storm'', ''brook'']

    >>> values = list(d.values())

    >>> values

    [4, 3, 2, 2]

    ```


    With the keys available as a list, we can sort the keys and then loop through
    them in sorted order:


    ```

    >>> keys.sort()

    >>> keys

    [''brook'', ''cut'', ''gully'', ''storm'']

    >>> for word in keys:

    ...     print(''key'', word, ''has value'', d[word])

    ...

    key brook has value 2

    key cut has value 4

    key gully has value 3

    key storm has value 2

    ```


    We can also loop through the values:


    ```

    >>> for num in d.values():

    ...     print(''number'', num)

    ...

    number 4

    number 3

    number 2

    number 2

    ```


    Looping through keys is often preferred over looping through values. It’s easy
    to go from a key to its value. As we’ll see in the next subsection, though, it’s
    not as easy to go from a value back to its key.'

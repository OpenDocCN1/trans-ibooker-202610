    # **Problem #25: Ribbon Painting**


    Here\''s another problem where the first algorithm that we might come up with
    is too slow. We won\''t waste much time on that algorithm, though, because our
    big O analysis will tell us all we need to know before we consider implementing
    the code. We\''ll then spend our time designing a faster algorithm.


    This is DMOJ problem dmojc17c4p1.


    # *The Challenge*


    You have a purple ribbon whose length is $n$ units. The first unit goes from position
    0 up to but not including position 1, the second unit goes from position 1 up
    to but not including position 2, and so on. You then carry out $q$ paint strokes,
    each of which colors a segment of the ribbon blue.


    Your goal is to determine the number of units of the ribbon that are still purple
    and the number of units of the ribbon that are now blue.


    # *Input*


    The input consists of the following lines:


    +   * A line containing the integer ribbon length $n$ and integer number of paint
    strokes $q$, separated by a space. $n$ and $q$ are each between 1 and 100,000.

    +   * $q$ lines, one per paint stroke, containing two integers separated by a
    space. The first integer gives the starting position of the paint stroke; the
    second gives the ending position of the paint stroke. The starting position is
    guaranteed to be less than the ending position; each integer is between 0 and
    $n$. The paint stroke goes from the starting position up to but not including
    the ending position. As a quick example here, if a paint stroke has a starting
    position of 5 and an ending position of 12, then the stroke paints the ribbon
    from position 5 up to but not including position 12.'

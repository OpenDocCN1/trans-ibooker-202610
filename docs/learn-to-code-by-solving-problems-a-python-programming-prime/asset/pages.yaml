- pgno: 259
  md: 'I use find to determine the index of the leftmost + symbol ①. If there is no
    + symbol at all, then there’s nothing to do for this step. If there is one, however,
    then we find the index of the @ symbol ② and remove characters from the + symbol
    up to but not including the @ symbol.


    The second step is to remove any dots before the @ symbol. To do that, I use a
    new string, before_at, to accumulate the part of the address before the @ symbol.
    Each character before the @ symbol that is not a . is added to before_at ③.


    The before_at string doesn’t include the @ symbol or any characters following
    it. We don’t want to lose that part of the email address, so I use a new variable,
    cleaned, to refer to the whole email address ④.


    The third step is to convert the entire email address to lowercase ⑤. After that,
    the email address is clean, so we can return it.


    Let’s test this a little. Enter the code for our clean function into the Python
    shell. Here’s the function cleaning a few email addresses:


    ```

    >>> clean(''daniel.zingaro+book@gmail.com'')

    ''danielzingaro@gmail.com''

    >>> clean(''da.nielz.in.gar.o..@gmail.com'')

    ''danielzingaro@gmail.com''

    >>> clean(''DAnIELZIngARO+Flurry@gmAIL.COM'')

    ''danielzingaro@gmail.com''

    >>> clean(''a.b.c@d.e.f'')

    ''abc@d.e.f''

    ```


    If the email address is already clean, clean returns it as is:


    ```

    >>> clean(''danielzingaro@gmail.com'')

    ''danielzingaro@gmail.com''

    ```



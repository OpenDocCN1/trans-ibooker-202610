  md: "When `i` refers to 6, the first operand of `and` is False, so the loop terminates.\
    \ You might wonder why the second operand of `and` doesn’t cause an error here,\
    \ since index 6 is not a valid index in the string. The reason is that the Boolean\
    \ operators use *short-circuiting evaluation*, which means that they stop evaluating\
    \ their operands if the result of the operator is already known. For `and`, if\
    \ the first operand is False, then we know that, no matter what the second operand\
    \ is, `and` will return False; Python therefore doesn’t evaluate the second operand.\
    \ Similarly, for `or`, if the first operand is True, then `or` is guaranteed to\
    \ return True, so Python doesn’t evaluate the second operand.\n\n# Solving the\
    \ Problem\n\nNow we know how to use a while loop to loop through a string.\n\n\
    For Secret Sentence, we need to do something different depending on whether we’re\
    \ looking at a vowel or a nonvowel. If we’re looking at a vowel, then we need\
    \ to copy the character and jump ahead by three characters (to skip over the p\
    \ and the second occurrence of this vowel). If we’re looking at a nonvowel, then\
    \ we need to copy the character and move to the next character. So, we always\
    \ copy the current character but then move by three or one based on whether the\
    \ current character is a vowel. We can use an if statement inside the while loop\
    \ to make this decision for each character that we see.\n\nA solution for Secret\
    \ Sentence is in Listing 4-4.\n\n```\nsentence = input()\n\n❶ result = \"\"\n\
    \   i = 0\n\n❷ while i < len(sentence):\n      result = result + sentence[i]\n\
    \      ❸ if sentence[i] in 'aeiou':\n            i = i + 3\n         else:\n \
    \           i = i + 1\n\n   print(result)\n```\n\n*Listing 4-4: Solving Secret\
    \ Sentence*"

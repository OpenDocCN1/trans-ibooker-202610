  md: 'Names like `lst`, `lst1`, and `lst2` can be used when there’s no need to be
    more specific about what a list contains.


    But don’t use `list` itself as a variable name. It’s already a name that we can
    use to convert a sequence to a list:


    ```

    >>> list(''abcde'')

    [''a'', ''b'', ''c'', ''d'', ''e'']

    ```


    If you make a variable named `list`, you’ll lose this valuable behavior, and you’ll
    confuse readers who will expect `list` not to be tampered with.


    Finally, lists support indexing and slicing. Indexing returns a single value,
    and slicing returns a list of values:


    ```

    >>> lst=[50, 30, 81, 40]

    >>> lst[1]

    30

    >>> lst[-2]

    81

    >>> lst[1:3]

    [30, 81]

    ```


    If we have a list of strings, we can access one of its string’s characters by
    indexing twice, first to select a string and then to select a character:


    ```

    >>> lst= [''one'', ''two'', ''hello'']

    >>> lst[2]

    ''hello''

    >>> lst[2][1]

    ''e''

    ```



  md: 'Functions are essential to the organization and clarity of our code. All programmers
    use them. Without them, writing large software systems like games and word processors
    would be untenable. Let’s learn how to use functions.


    # Defining and Calling Functions


    We’ve already learned how to call functions that come with Python. For example,
    we’ve used the input function to read input. Here’s a call of input with no arguments:


    ```

    ```python

    >>> s = input()

    hello

    >>> s

    ''hello''

    ```

    ```


    We’ve also used Python’s print function to output text. Here’s a call of print
    with one argument:


    ```

    ```python

    >>> print(''well, well'')

    well, well

    ```

    ```


    The built-in Python functions are general-purpose, designed to be used in a wide
    variety of settings. When we want a function to solve a problem-specific task,
    we’ll have to define it ourselves.


    # *Functions Without Arguments*


    To *define*, or create, a function, we use Python’s def keyword. Here’s the definition
    of a function that outputs three lines:


    ```

    ```python

    >>> def intro():

    ...     print(''**********'')

    ...     print(''*WELCOME*'')

    ...     print(''**********'')

    ...

    ```

    ```


    The structure of a function definition mirrors that of an if statement or loop.
    The name after def is the name of the function that we’re defining; here, we’re
    defining a function named intro. Following the name of the function, we have a
    pair of empty parentheses, (). We’ll see later that we can include information
    in these parentheses to pass'

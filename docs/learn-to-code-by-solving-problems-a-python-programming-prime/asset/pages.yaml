  md: '# The Challenge


    You have a scarf whose length is n feet, and each foot has a specific color.


    You also have m relatives. Each relative indicates what their desired scarf looks
    like by specifying the color of its first foot and last foot.


    Your goal is to cut your original scarf in such a way as to produce the longest
    desired scarf for one of your relatives.


    # Input


    The input consists of the following lines:


    +   - A line containing the integer scarf length n and integer number of relatives
    m, separated by a space. n and m are each between 1 and 100,000.

    +   - A line containing n integers separated by spaces. Each integer specifies
    the color of one foot of scarf in order from the first foot to the last foot.
    Each integer is between 1 and 1,000,000.

    +   - m lines, one per relative, containing two integers separated by a space.
    These numbers describe the relative’s desired scarf: the first integer is the
    desired color of the first foot, and the second integer is the desired color of
    the last foot.


    # Output


    Output the length of the longest desired scarf that can be produced by cutting
    your original scarf.


    The time limit for solving the test cases is 0.4 seconds.


    # Exploring a Test Case


    Let’s make sure we know exactly what is being asked by working through a small
    test case. Here it is:


    ```

    6 3

    18 4 4 2 1 2

    1 2

    4 2

    18 4

    ```'

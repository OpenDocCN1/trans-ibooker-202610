  md: '# # Summary


    In this chapter, we learned how to use if statements to direct what our programs
    do. The key ingredient of an if statement is a Boolean expression, which is an
    expression with a True or False value. To build up Boolean expressions, we use
    relational operators such as == and >=, and we use Boolean operators such as and
    and or.


    Deciding what to do based on what is True and False makes our programs more flexible,
    able to adapt to the situation at hand. But our programs are still limited to
    handling small amounts of input and output—whatever we can do with individual
    calls to input and print. In the next chapter, we’ll start learning about loops,
    which let us repeat code so that we can process as much input and output as we
    like.


    Want to work with 100 values? How about 1,000? And with just a small amount of
    Python code? It is a little early for me to be provoking you, I know, because

  md: 'Answer: A. The outer loop’s Boolean expression, x < 3, is True, so we perform
    an iteration of the outer loop. That leads to two iterations of the inner loop:
    one when y is 1 and one when y is 2, each of which prints a line of output. So
    that’s two lines of output so far.


    But nothing in the code resets y’s value! Therefore, y < 3 will never be True
    again, and there won’t be any further iterations of the inner loop.


    Forgetting to reset a loop variable is a common mistake when dealing with nested
    while loops.


    # Adding Boolean Operators


    To solve Slot Machines, we want to loop while Martha has at least one quarter.
    That looks like this:


    ```

    while quarters >= 1:

    ```


    That simple Boolean expression will suffice for this problem. But just like for
    if statements, the Boolean expression following the word while can include relational
    or Boolean operators. Here’s an example:


    ```

    >>> x = 4

    >>> y = 10

    >>> while x <= 10 and y <= 13:

    ...     print(x, y)

    ...     x = x + 1

    ...     y = y + 1

    ...

    4 10

    5 11

    6 12

    7 13

    ```


    The while loop is controlled by the Boolean expression x <= 10 and y <= 13. As
    with any and operator, both of its operands must be True for the whole expression
    to be True. When x refers to 8 and y refers to 14, the loop terminates because
    the y <= 13 operand is False.'

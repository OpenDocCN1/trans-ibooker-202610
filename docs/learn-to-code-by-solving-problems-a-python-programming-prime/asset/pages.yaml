    # Problem #21: Lifeguards


    In this problem, we’ll need to determine which lifeguard to fire that leaves us
    with the maximum schedule coverage of a pool. We’ll try separately firing each
    one and observing the results—that’s a complete-search algorithm!


    This is USACO 2018 January Bronze Contest problem Lifeguards.


    # The Challenge


    Farmer John has purchased a swimming pool for his cows. The pool is open from
    time 0 to time 1000.


    Farmer John hires n lifeguards to monitor the pool. Each lifeguard monitors the
    pool for a given interval of time. For example, a lifeguard might start at time
    2 and end at time 7. I’ll denote such an interval as 2–7. The number of units
    of time covered by an interval is the ending time minus the starting time. For
    example, the lifeguard whose time interval is 2–7 covers 7 − 2 = 5 units of time.
    Those time units are from time 2 to 3, 3 to 4, 4 to 5, 5 to 6, and 6 to 7.


    Unfortunately, Farmer John only has enough money to pay for n − 1 lifeguards,
    not n lifeguards, so he must fire one lifeguard.


    Determine the maximum number of units of time that can still be covered after
    firing one lifeguard.


    # Input


    Read input from the file named lifeguards.in.


    The input consists of the following lines:


    +   - A line containing n, the number of lifeguards who were hired. n is between
    1 and 100.

    +   - n lines, one per lifeguard. Each line gives the time when the lifeguard
    starts, a space, and the time when the lifeguard ends. The'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'start and end times are all integers between 0 and 1,000 and are all distinct.


    # Output


    Write output to the file named lifeguards.out.


    Output the maximum number of units of time that can be covered by n − 1 of the
    lifeguards.


    The time limit for solving each test case is four seconds.


    # Exploring a Test Case


    Let’s explore a test case to help justify why a complete-search algorithm makes
    sense for this problem. Here’s the test case:


    ```

    4

    5 8

    10 15

    17 25

    9 20

    ```


    One simple rule you might try to use to solve this problem is to fire the lifeguard
    with the shortest time interval. That makes some intuitive sense, because it seems
    as though that lifeguard contributes the least to covering the pool.


    Does this rule give us a correct algorithm? Let’s see. It tells us to fire the
    5–8 lifeguard, since that lifeguard has the shortest time interval. That leaves
    us with the three lifeguards whose time intervals are 10–15, 17–25, and 9–20.
    These three remaining lifeguards cover exactly the interval 9–25, which consists
    of 25 − 9 = 16 units of time. Is 16 the correct answer?


    Unfortunately, no. It turns out that what we should have done is fire the 10–15
    lifeguard. If we do that, then we’re left with the three lifeguards whose time
    intervals are 5–8, 17–25, and 9–20. These three remaining lifeguards cover the
    intervals 5–8 and 9–25. (Careful: they don’t cover the unit of time from 8 to
    9.) The first of these intervals covers 8 − 5 = 3 units of time, and the second
    covers 25 − 9 = 16 units of time, for a total of 19 units of time.


    The correct answer is 19, not 16. Firing the lifeguard with the shortest time
    interval didn’t work.'

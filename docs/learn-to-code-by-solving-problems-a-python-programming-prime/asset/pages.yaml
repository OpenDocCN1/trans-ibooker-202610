    # Range for loops


    Python’s range function generates ranges of integers, and we can use those ranges
    to control for loops. Rather than looping through the characters of a string,
    a range for loop loops through integers. If we provide one argument to range,
    we get a range from 0 to 1 less than that argument:


    ```

    >>> for num in range(5):

    ...     print(num)

    ...

    0

    1

    2

    3

    4

    ```


    Notice that 5 is not output.


    If we provide two arguments to range, we get a sequence from the first argument
    up to but not including the second argument:


    ```

    >>> for num in range(3, 7):

    ...     print(num)

    ...

    3

    4

    5

    6

    ```'

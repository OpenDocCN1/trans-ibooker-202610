  md: 'Each iteration of the loop plays one slot machine. As such, the first thing
    we do is decrease Martha’s quarters by one ③. Next, we play the current slot machine.


    Are we on slot machine 0? Slot machine 1? Slot machine 2? We need an if statement
    to answer that.


    We first check whether we’re on slot machine 0 ④. If we are, then we increase
    the number of plays since this slot machine paid by one. To determine whether
    Martha gets paid, we then check whether this machine has been played exactly 35
    times since it last paid ⑤. If it has, then we reset this machine’s plays to 0
    and increase Martha’s quarters by 30.


    There are several levels of nesting here, so take some time to convince yourself
    that the logic of the code is correct. In particular, note that every time we
    play the first machine, we increase its number of plays by one. But we only pay
    Martha after every 35 plays—that’s why we have the inner if statement ⑤!


    We handle the second and third slot machines just as we handled the first. The
    only difference is that each slot machine pays Martha after its own number of
    plays and pays Martha its own amount of quarters.


    Having played a slot machine, we increase Martha’s number of plays by one ⑥. Now
    all that’s left is to move to the next machine so that we’ll be at the right machine
    if there’s a next iteration of the loop.


    To move to the next machine, we increase machine by one ⑦. If we were on machine
    0, this would move us to machine 1. If we were on machine 1, this would move us
    to machine 2. If we were on machine 2, this would move us to machine 3.


    . . . Machine 3? There’s no machine 3! If we just played machine 2, then we want
    to start over at machine 0. To do that, we add a check: if we just moved to machine
    3 ⑧, then we know that we just played machine 2, so we reset machine to machine
    0.


    When the loop terminates, we know that Martha has no quarters left. As a last
    step, we output the required sentence, including Martha’s number of plays.


    This code has a lot going on: stopping when Martha has no quarters left, keeping

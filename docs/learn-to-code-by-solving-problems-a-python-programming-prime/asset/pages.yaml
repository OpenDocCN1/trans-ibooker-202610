- pgno: 299
  md: "It’s not easy to come up with a simple rule that always works to solve this\
    \ problem. We don’t need to worry, though: with a complete-search algorithm, we\
    \ dodge this requirement entirely.\n\nHere’s what our complete-search algorithm\
    \ will do to solve our test case:\n\n+   1. First, it will ignore the first lifeguard\
    \ and determine the number of units of time that the three remaining lifeguards\
    \ cover. It will obtain an answer of 16. It will remember 16 as the score to beat.\n\

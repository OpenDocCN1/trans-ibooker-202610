    >>> i = 0\n>>> while i < len(s):\n❶ ...    if not s[i] in 'aeiou':\n   ...   \
    \     i = i + 1\n❷ ...        continue\n❸ ...    print(s[i], i)\n   ...    i =\
    \ i + 1\n   ...\n   e 1\n```\n```\n\nIf the current character is not a vowel ❶,\
    \ then we don’t want to print it. So, we increase i by 1 to take us past this\

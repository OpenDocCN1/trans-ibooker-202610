    Notice the pattern: 0, 1, 2, 0, 1, 2, and so on. This behavior is useful for counting
    up to a specified number and then cycling back to 0. It’s exactly the behavior
    that we need when playing the slot machines: we play slot machine 0, then 1, then
    2, then 0, then 1, then 2, then 0, then 1, and so on. (This is another reason
    why I used 0, 1, and 2, rather than other values, to refer to the slot machines.)


    Suppose that variable plays refers to the number of times that Martha has played.
    To determine the next machine to play (0, 1, or 2), we can use the % operator.
    For example, suppose that Martha has played one slot machine so far, and we want
    to know which she will play next. She’ll play slot machine 1 next, and the % operator
    tells us that:


    ```

    >>> plays = 1

    >>> plays % 3

    1

    ```


    If Martha has played six times so far, then she’s played slot machines 0, 1, 2,
    0, 1, 2. The next slot machine she’ll play is machine 0. And, as she’s played
    all three machines twice, with no other plays beyond that, the % operator gives
    us 0:


    ```

    >>> plays = 6

    >>> plays % 3

    0

    ```


    As a final example, suppose that Martha has played 11 times so far. She’s done
    three complete cycles: 0, 1, 2, 0, 1, 2, 0, 1, 2. That’s nine of the plays. The
    remaining two plays put Martha on slot machine 2 for her next play:


    ```

    >>> plays = 11

    >>> plays % 3

    2

    ```'

    A *high card* is a card that is a jack, queen, king, or ace. When a player takes
    a high card, they may score some points. Here are the rules by which points are
    scored:


    +   - If a player takes a jack, after which there is at least one card remaining
    in the deck, and the next card in the deck is not a high card, then the player

    # Summary


    In this chapter, we learned about lists, which help us work with collections of
    whatever type we choose. Lists of numbers, lists of strings, lists of lists: Python
    supports whatever we need. We also learned about list methods and why sorting
    a list can make it easier to process the values in a list.


    In contrast to strings, lists are mutable, which means that we can change their
    contents. This helps us more easily manipulate lists, but we must be careful to
    modify the list that we think we’re modifying.



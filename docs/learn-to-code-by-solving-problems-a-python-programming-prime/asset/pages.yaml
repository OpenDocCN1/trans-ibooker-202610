  md: 'Now, what do we do if *k* were 2? We could answer this by scanning through
    the words again and counting occurrences, but there’s a different way to organize
    the words that would make our task considerably easier. Rather than a list of
    words, let’s look at each word associated with its number of occurrences. See
    Table 8-1.


    **Table 8-1: Words and Number of Occurrences**


    | Word | Number of occurrences |

    |---|---:|

    | cut | 4 |

    | gully | 3 |

    | storm | 2 |

    | brook | 2 |

    | magma | 1 |

    | cliff | 1 |

    | blast | 1 |


    I’ve sorted the words based on their number of occurrences. Looking at the top
    row, we can reaffirm that cut is the word to output for *k* = 1. Looking at the
    second row, we see that gully is the word to output for *k* = 2. The word gully
    is the only word that has exactly one word with more occurrences.


    Now for *k* = 3. This time, there are **two words** to output, storm and brook,
    because they both have the same number of occurrences. Each of these words has
    exactly two words with more occurrences. This shows that we sometimes need to
    output more than one word.


    It’s also possible that we need to output zero words! For example, consider *k*
    = 4. There are *no* words that have exactly three words with more occurrences.
    Looking down the table, you might wonder why we don’t output magma for *k* = 4.
    We don’t output magma, because magma has exactly four words (not exactly three
    words) with more occurrences.


    When *k* = 5, we have three words to output: magma, cliff, and blast. Before continuing,
    verify for yourself that there are no words to output for any other value of *k*—no
    words for *k* = 6, *k* = 7, *k* = 8, *k* = 9, *k* = 100, and so on.'

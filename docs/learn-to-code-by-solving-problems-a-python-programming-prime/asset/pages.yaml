  md: '# 5


    # ORGANIZING VALUES USING LISTS


    ![](img/3e15323aee4cec3bf673834bfafe8024_142_0.png)


    We’ve seen that we can use strings to work with a sequence of characters. In this
    chapter, we’ll learn about lists, which help us work with sequences of other types
    of values, such as integers and floats. We’ll also learn that we can nest lists
    inside of lists, which lets us work with grids of data.


    We’ll solve three problems using lists: finding the smallest neighborhood of a
    collection of villages, determining whether sufficient money has been raised for
    a school trip, and calculating the number of bonuses offered by a bakery.


    # Problem #11: Village Neighborhood


    In this problem, we’re going to find the size of the smallest neighborhood of
    a collection of villages. We’ll find it helpful to store all of the neighborhood
    sizes. We might have as many as 100 villages, though, and using a separate variable
    for each village would be a nightmare. We’ll see that lists allow us to aggregate
    what would otherwise be separate variables into one collection. We’ll also learn
    about Python’s powerful list operations for modifying, searching, and sorting
    a list.


    This is DMOJ problem ccc18s1.


    # The Challenge'

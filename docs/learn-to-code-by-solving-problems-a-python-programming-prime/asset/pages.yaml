  md: '# READING AND WRITING FILES


    ![](img/3e15323aee4cec3bf673834bfafe8024_220_0.png)


    To this point, we’ve read all input using the input function and written all output
    using the print function. These functions read from standard input (defaulting
    to the keyboard) and write to standard output (defaulting to the screen), respectively.
    While we can change these defaults using input and output redirection, sometimes
    a program needs more control over its files. For example, your word processor
    allows you to open whichever document file you like and save a file with whatever
    name you like, without you messing around with standard input and standard output.


    In this chapter, we’ll learn how to write programs that manipulate text files.
    We’ll solve two problems using files: correctly formatting an essay and seeding
    a farm to feed cows.


    # Problem #16: Essay Formatting


    There’s one important difference between this problem and all the problems we’ve
    solved to this point: this one requires us to read from and write to specific
    files! Look out for this as you read the problem description.


    This is USACO 2020 January Bronze Contest problem Word Processor. This is the
    first problem in the book from the USACO (USA Computing Olympiad) judge. To find
    the problem, go to *http://usaco.org/*, click **Contests**, click **2020 January
    Contest Results**, and then click **View problem** under Word Processor.'

- pgno: 291
  md: 'The next key is ''NANH''; its value is 1. To find special pairs of cities involving
    ''NANH'', we need to look up the value for ''NHNA''. But ''NHNA'' isn’t a key
    in the dictionary! There are no special pairs of cities involving these combos.
    We still have a total of 7.


    Pay close attention to this next one. The next key is ''PASC''; its value is 1.
    To find special pairs of cities involving ''PASC'', we need to look up the value
    for ''SCPA''. That value is also 1. We multiply the two values together, yielding
    1 * 1 = 1 special pair of cities involving these combos. But wait: we already
    accounted for this pair when we processed the key ''SCPA''. If we add 1 here,
    then we’ll end up double-counting this pair. In fact, by processing each key we
    will double-count every special pair of cities. Not to worry, though: we’ll make
    an adjustment later when we’re ready to print the final answer. Let’s add this
    1 in there. With the 7 we found previously, we now have a total of 8.


    The next key is ''LACO''; its value is 2. The value for ''COLA'' is 1, giving
    2 * 1 = 2 special pairs of cities involving these combos. With the 8 we found
    previously, we now have a total of 10.


    There are two keys to go, ''MIMA'' and ''COLA''. The first leads us to add 6 to
    our total; the second leads us to add 2. With the 10 we found previously, we now
    have a total of 18.


    Remember that we’ve double-counted every special pair of cities. We don’t have
    18 unique special pairs of cities, then. We have only 18 / 2 = 9 special pairs
    of cities. All we need to do is divide by 2 to undo the double counting.


    If you compare the dictionary we just went through to the cities in the test case,
    you’ll notice that something is missing from the dictionary. It’s that city WASHOUGAL
    WA! Its combo is WAWA, but there’s no ''WAWA'' key in our dictionary. We’re not
    accounting for this city, and we need to understand why.


    The first two characters of WASHOUGAL WA are WA. This means that the only way
    for WASHOUGAL WA to be part of a special pair of cities is to find another city

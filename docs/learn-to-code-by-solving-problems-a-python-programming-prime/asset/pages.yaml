  md: "Cleaning an email address is a small, self-contained task, so let’s write a\
    \ function for it. This clean function will take a string representing an email\
    \ address, clean it up, and return the cleaned email address. We’ll carry out\
    \ three cleaning steps: removing characters from a + symbol to just before the\
    \ @ symbol, removing dots before the @ symbol, and converting to lowercase. The\
    \ code for this function is in Listing 8-1.\n\n```\ndef clean(address):\n    \"\
    \"\"\n    address is a string email address.\n\n    Return cleaned address.\n\
    \    \"\"\"\n    # Remove from '+' up to but not including '@'\n    plus_index\
    \ = address.find('+')\n    if plus_index != -1:\n        at_index = address.find('@')\n\
    \        address = address[:plus_index] + address[at_index:]\n\n    # Remove dots\
    \ before @ symbol\n    at_index = address.find('@')\n    before_at = \"\"\n  \
    \  i = 0\n    while i < at_index:\n        if address[i] != '.':\n           \
    \ before_at = before_at + address[i]\n        i = i + 1\n\n    cleaned = before_at\
    \ + address[at_index:]\n\n    # Convert to lowercase\n    cleaned = cleaned.lower()\n\
    \n    return cleaned\n```\n\n*Listing 8-1. Cleaning an email address*\n\nThe first\
    \ step is to remove characters from a + symbol to just before the @ symbol. The\
    \ string find method is useful here. It returns the index of the leftmost occurrence\
    \ of its argument, or -1 if the argument isn’t found:\n\n```\n>>> 'abc+def'.find('+')\n\
    3\n>>> 'abcdef'.find('+')\n-1\n```"

    # Function Documentation


    It’s clear to us right now what our no_high function does and how we should call
    it. But what about in a few months, when the purpose of our old code doesn’t come
    readily to mind? And what about once we’ve amassed a large collection of our own
    functions, making it difficult to remember what each one does?


    For each function we write, we’ll add documentation that specifies the meaning
    of each parameter and what the function returns. Such documentation is called
    a docstring, for “documentation string.” The docstring should be written starting
    at the first line of the function’s block. Here’s the no_high function, this time
    with documentation:


    ```

    >>> def no_high(lst):

    ...     """

    ...     lst is a list of strings representing cards.

    ...

    ...     Return True if there are no high cards in lst, False otherwise.

    ...     """

    ...     if ''jack'' in lst:

    ...         return False

    ...     if ''queen'' in lst:

    ...         return False

    ...     if ''king'' in lst:

    ...         return False

    ...     if ''ace'' in lst:

    ...         return False

    ...     return True

    ...

    ```'

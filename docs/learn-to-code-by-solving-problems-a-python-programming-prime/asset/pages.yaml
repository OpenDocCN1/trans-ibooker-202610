    \ len(word) <= k:\n        line = line + word + ' '\n        chars_on_line = chars_on_line\
    \ + len(word)\n    else:\n        output_file.write(line[:-1] + '\\n')\n     \
    \   line = word + ' '\n        chars_on_line = len(word)\n\noutput_file.write(line[:-1]\
    \ + '\\n')\n\ninput_file.close()\noutput_file.close()\n```\n\n# Listing 7-1: Solving\
    \ Essay Formatting\n\nTo begin, we open the input file ❶ and output file ❷. Notice\
    \ the modes: we open the input file with mode 'r' (for reading) and open the output\
    \ file with mode 'w' (for writing). We could have opened the output file a little\
    \ later, right before we use it, but I’ve chosen to open both files here to simplify\
    \ the organization of the program. Similarly, we could close a file as soon as\
    \ we no longer need it, but in this book, I’ve chosen to close all files together\
    \ at the end of the program. For long-running programs that manipulate many files,\
    \ you likely want to keep files open only when needed.\n\nNext, we read the first\
    \ line of the input file ❸. This line contains two space-separated integers: n,\
    \ the number of words, and k, the maximum number of allowed characters (not counting\
    \ spaces) per line. As always with space-separated values, we use split to separate\
    \ them. We then read the second line, which contains the essay words. Again we\
    \ use split, this time to split the string of words into a list of words. That\
    \ takes care of the input.\n\nTwo variables drive the main portion of the program:\
    \ line and chars_on_line. The line variable refers to the current line; we start\
    \ out with it referring to the empty string ❹. The chars_on_line variable refers\
    \ to the number of characters, not counting spaces, on the current line."

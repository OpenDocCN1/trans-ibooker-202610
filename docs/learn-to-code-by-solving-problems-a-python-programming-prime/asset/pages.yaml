  md: 'It’s sometimes more convenient to use the `get` method rather than indexing
    to look up the value for a key. The `get` method never produces an error, even
    if the key doesn’t exist:


    ```

    >>> print(d.get(''cut''))

    4

    >>> print(d.get(''storm''))

    None

    ```


    If the key exists, get returns its value. Otherwise, it returns None to signify
    that the key does not exist.


    In addition to looking up the value for a key, we can use square brackets to add
    keys to a dictionary or change the value that a key maps to. Here’s some code
    that shows how to do each of these, starting with an empty dictionary:


    ```

    >>> d = {}

    >>> d[''gully''] = 1

    >>> d

    {''gully'': 1}

    >>> d[''cut''] = 1

    >>> d

    {''gully'': 1, ''cut'': 1}

    >>> d[''cut''] = 4

    >>> d

    {''gully'': 1, ''cut'': 4}

    >>> d[''gully''] = d[''gully''] + 1

    >>> d

    {''gully'': 2, ''cut'': 4}

    >>> d[''gully''] = d[''gully''] + 1

    >>> d

    {''gully'': 3, ''cut'': 4}

    ```


    # CONCEPT CHECK


    Use help({}.get) to learn more about the dictionary get method.


    What is the output of the following code?


    ```

    d = {3: 4}

    d[5] = d.get(4, 8)

    ```'

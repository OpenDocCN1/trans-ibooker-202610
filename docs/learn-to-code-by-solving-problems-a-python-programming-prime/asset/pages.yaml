    Another way to avoid the code duplication is to store each neighborhood size in\
    \ a list of sizes. Python has a built-in min function that takes a sequence and\
    \ returns its minimum:\n\n```\n>>> min('qwerty')\n'e'\n>>> min([15.5, 7.0, 2.5,\
    \ 7.5])\n2.5\n```\n\n(Python also has a max function that returns the maximum\
    \ of a sequence.)\n\nSee Listing 5-3 for a solution that uses min on a list of\
    \ neighborhood sizes.\n\n```\nn = int(input())\n\npositions = []\n\nfor i in range(n):\n\

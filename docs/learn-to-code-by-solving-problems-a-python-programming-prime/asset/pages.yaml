    Here’s a test case that our current code gets wrong:\n\n```\n50\n0.7 0.1 0.1 0.1\n\
    9\n```\n\nThis time, the school trip costs $50, and there are nine students that\
    \ attend the brunch. For the number of students in their first year, our current\
    \ program would calculate 9 * 0.7 = 6.3 and then round down to 6. The fact that\
    \ we have to round down is why we have to be careful with this test case. To see\
    \ what our current program would do for all four years, see Table 5-2.\n\n# **Table\
    \ 5-2:** An Example Case from School Trip That Our Current Program Gets Wrong\n\
    \n| Year | Students in year | Cost per student | Money raised |\n|---|---:|---:|---:|\n\
    | First year | 6 | 12 | 72 |\n| Second year | 0 | 10 | 0 |\n| Third year | 0 |\
    \ 7 | 0 |\n| Fourth year | 0 | 5 | 0 |\n\nIn each year besides the first year,\
    \ there are 0 students because 9 * 0.1 = 0.9 rounds down to 0. So it looks like\
    \ all we raise is $72. Half of $72 is $36, not sufficient to pay for the $50 school\
    \ trip. Our current program outputs YES. We need to raise more money.\n\n . .\
    \ . Or not. We’re supposed to have nine students here, not six! We’ve lost three\
    \ students to rounding. The problem description specifies that we should add those\
    \ students to the year with the most students, which in this case is the first\
    \ year. If we do that, we see that we actually raise 9 * 12 = 108 dollars. Half\
    \ of $108 is $54, so in fact we do *not* need to raise any more money for the\
    \ $50 school trip! The correct output is NO."

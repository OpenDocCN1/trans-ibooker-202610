    ```


    And we have the len function to give us the length of a list:


    ```

    >>> len([''one'', ''two'', ''hello''])

    3

    ```


    A list is a sequence, and we can use a for loop to loop through its values:


    ```

    >>> for value in [20, 50, 4, 19, 15, 1]:

    ... print(value)

    20

    50

    4

    19

    15

    1

    ```


    We can make variables refer to lists, just as we make them refer to strings, integers,
    and floats. Let’s make two variables refer to lists and then concatenate them
    to produce a new list.


    ```

    >>> lst1 = [1, 2, 3]

    >>> lst2 = [4, 5, 6]

    >>> lst1 + lst2

    [1, 2, 3, 4, 5, 6]

    ```


    While we displayed the concatenated list, we did not store it, as we can see by
    looking at the lists again:


    ```

    >>> lst1

    [1, 2, 3]

    >>> lst2

    [4, 5, 6]

    ```


    To make a variable refer to the concatenated list, we use assignment:


    ```

    >>> lst3 = lst1 + lst2

    >>> lst3

    [1, 2, 3, 4, 5, 6]

    ```'

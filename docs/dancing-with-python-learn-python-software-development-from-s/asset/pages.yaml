  md: 'I will use slashes, and most Python routines that work with pathnames will
    work with either on Windows. You may find it convenient to use a raw string as
    in section 4.1 with a Windows pathname. Raw strings reduce the number of characters
    you must escape.


    ```

    "C:\\src\\part-I\\Working-with-Files.html"

    ''C:\\src\\part-I\\Working-with-Files.html''

    r"C:\src\part-I\Working-with-Files.html"

    ''C:\\src\\part-I\\Working-with-Files.html''

    ```


    The / directory is the root directory.


    We use the os package and the os.path module to manipulate pathnames. “os” stands
    for “operating system.”


    ```

    import os


    pn = "/src/part-I/Working-with-Files.html"

    ```


    ```

    os.path.split(pn)


    (''/src/part-I'', ''Working-with-Files.html'')

    ```


    The second item in the tuple is the basename.


    ```

    os.path.basename(pn)


    ''Working-with-Files.html''

    ```


    Get the extension by splitting the filepath or the basename with splitext.


    ```

    os.path.splitext(pn)


    (''/src/part-I/Working-with-Files'', ''.html'')

    ```


    ```

    os.path.splitext(os.path.basename(pn))


    (''Working-with-Files'', ''.html'')

    ```


    On Windows, use splitdrive to get the drive letter and the following colon.


    ```

    os.path.splitdrive("C:\\src\\part-I\\Working-with-Files.html")


    (''C:'', ''\\src\\part-I\\Working-with-Files.html'')

    ```'

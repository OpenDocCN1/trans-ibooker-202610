- pgno: 647
  md: 'Next, we double the dimension of our quantum computational space every time
    we add a qubit because of entanglement. If we have 10 qubits, the dimension of
    the space in which the quantum states reside is $2^{10}=1,024$. With 64 qubits,
    the dimension is $2^{65}=18,446,744,073,709,551,616$, or eighteen quintillion,
    four hundred forty-six quadrillion, seven hundred forty-four trillion, seventy-three
    billion, seven hundred nine million, five hundred fifty-one thousand, six hundred
    sixteen.


    While we will never need that many features in a dataset, researchers are looking
    at how we can use the “good” growth of dimensions in quantum computing to control
    the “bad” growth of features and computational structures like matrices in AI.


    The techniques we saw in this chapter were developed over time by many people,
    and there are many more activation functions, algorithms, hidden layer types,
    and methods than I have discussed. Can the fundamentally different ideas in quantum
    computing like superposition and entanglement give us new ways to match patterns?
    Can we create better kernels with less training for classification?


    Quantum computers are not “big data machines.” They cannot ingest gigabytes of
    data and then process it. What we can do, though, is look at how to combine the
    best classical and new quantum ideas to create better AI for the benefit of society.


    # 15.10 Summary


    In this chapter, we took a brief tour of machine learning, neural networks, and
    deep learning. We focused on the core ideas behind these technologies, and I showed
    you how to get started with several **sklearn** coding examples in Python.


    But, for the appendices and back matter, this chapter concludes this introduction
    to Python. Together, we explored classical programming techniques and saw how
    quantum computing is a natural complement and extension of those. The future of
    coding is the integration of classical and quantum objects, constructs, controls,
    and algorithms. I wish you much success on your personal journey to that exciting
    future!'
  merge: -1
  img_proc: true

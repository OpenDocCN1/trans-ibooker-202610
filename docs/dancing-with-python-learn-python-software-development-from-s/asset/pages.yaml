    # 1.7 Loops


    If I ask you to close your eyes, count to 10, then open them, the steps look like
    this:


    +   1. Close your eyes

    +   2. Set count to 1

    +   3. While count is not equal 10, increment count by 1

    +   4. Open your eyes


    Steps 2 and 3 together constitute a loop. In this loop, we repeatedly do something
    while a condition is met. We do not move to step 4 from step 3 while the test
    returns true.



  md: 'or


    −(√2/2)|01⟩ + (√2/2)|10⟩


    Applying the 2-qubit CX gate yields


    −(√2/2)|01⟩ + (√2/2)|11⟩


    followed by the second id ⊗ H


    −(1/2)|00⟩ + (1/2)|01⟩ + (1/2)|10⟩ − (1/2)|11⟩


    Almost done! Apply the second X ⊗ X


    −(1/2)|00⟩ + (1/2)|01⟩ + (1/2)|10⟩ − (1/2)|11⟩



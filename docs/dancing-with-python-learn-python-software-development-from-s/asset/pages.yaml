- pgno: 721
  md: '# Other Books

    You May Enjoy


    If you enjoyed this book, you may be interested in these other books by Packt:


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_721_0.png)


    # Learn Quantum Computing with Python and IBM Quantum Experience


    Robert Loredo


    ISBN: 978-1-83898-100-6


    +   - Explore quantum computational principles such as superposition and quantum
    entanglement

    +   - Become familiar with the contents and layout of the IBM Quantum Experience

    +   - Understand quantum gates and how they operate on qubits

    +   - Discover the quantum information science kit and its elements such as Terra
    and Aer

    +   - Get to grips with quantum algorithms such as Bell State, Deutsch-Jozsa,
    Grover’s algorithm, and Shor’s algorithm

    +   - How to create and visualize a quantum circuit'
  merge: -1
  img_proc: true
- pgno: 722
  md: '# Quantum Computing in Practice with Qiskit® and IBM Quantum Experience®


    Hassi Norlén


    ISBN: 978-1-83882-844-8


    +   - Visualize a qubit in Python and understand the concept of superposition

    +   - Install a local Qiskit® simulator and connect to actual quantum hardware

    +   - Compose quantum programs at the level of circuits using Qiskit® Terra

    +   - Compare and contrast Noisy Intermediate-Scale Quantum computing (NISQ) and
    Universal Fault-Tolerant quantum computing using simulators and IBM Quantum® hardware

    +   - Mitigate noise in quantum circuits and systems using Qiskit® Ignis

    +   - Understand the difference between classical and quantum algorithms by implementing
    Grover’s algorithm in Qiskit®


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_722_0.png)'
  merge: -1
  img_proc: true

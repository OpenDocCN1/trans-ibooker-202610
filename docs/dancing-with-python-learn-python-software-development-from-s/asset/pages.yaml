    \nThe information a machine learning algorithm uses to “learn” is called the *training\
    \ set*. For supervised learning, the training set has one or more *label* features.\
    \ When we get new unlabeled data, we run the algorithm and hope it matches the\
    \ expected results. When we *fit* the training data with an algorithm to make\
    \ predictions, we create a machining learning *model*.\n\nA common method to test\
    \ the machine learning algorithm is to select 50% of all the labeled data randomly\

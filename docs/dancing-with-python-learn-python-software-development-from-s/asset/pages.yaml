  md: "It is as simple as adding or deleting the @decorator line to get or remove\
    \ the extra functionality.\n\n# Exercise 10.7\n\nWrite a decorator function assert_first_arg_is_int\
    \ that inserts an assert statement that checks whether the first argument passed\
    \ to a function is an int.\n\nAlthough I coded return func(*args, **kwargs), I\
    \ could have saved the result in a variable, done more work in the wrapper function,\
    \ and then returned the value.\n\n```\ndef enter_and_exit(func):\n    def wrapper(*args,\
    \ **kwargs):\n        print(f\">>> Entering {func.__name__}\")\n        result\
    \ = func(*args, **kwargs)\n        print(f\">>> Exiting {func.__name__} with {result}\"\
    )\n        return result\n    return wrapper\n\n@enter_and_exit\ndef adder_with_carry(a,\
    \ b, carry=0):\n    return a + b + carry\n\nadder_with_carry(10, 20, carry=1)\n\
    ```\n\n>>> Entering adder_with_carry\n>>> Exiting adder_with_carry with 31\n31\n\
    \n# Exercise 10.8\n\nExtend the last definition of enter_and_exit to print the\
    \ argument values in the \"Entering ...\" message.\n\n# Exercise 10.9\n\nUse one\
    \ or more functions from the time module to create a decorator that displays how\
    \ long it takes to execute func within wrapper."

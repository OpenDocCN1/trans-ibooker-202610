    We now look at support vector machines for binary classification and *k*-nearest
    neighbors for multi-class classification. You will encounter other techniques
    if you learn more about machine learning, including logistic regression and decision
    trees.


    # 15.6.1 Support vector machines (SVM)


    Given data with two features, as in Figure 15.4, can we use the data and the labels
    to draw a line between them to help us make predictions? In this case, the points
    are the initial field locations for two baseball players, a left fielder and a
    right fielder. Given a new point, if it lies to the left of the line, then it
    is where the left fielder is standing. Similarly, if it is to the right of the
    line, it is the location of the right fielder. We are performing binary classification.


    There are many such lines, and I show five of them in Figure 15.5. Is there a
    “best” line that has nice mathematical properties?


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_624_1.png)


    Figure 15.5: Lines separating clusters of points'

    \ nonlocal\n\nThere is one case that global cannot fix. How do I handle a variable\
    \ defined in a function that I want to reassign in a nested function?\n\n```\n\
    my_variable = \"SET AT GLOBAL SCOPE\"\nprint(f\"Global: {my_variable}\")\n```\n\
    \n```\nGlobal: SET AT GLOBAL SCOPE\n```\n\n```\ndef h():\n    my_variable = \"\
    SET IN h\"\n    print(f\"Inside h: {my_variable}\")\n    def inner_h():\n    \
    \    my_variable = \"SET IN inner_h\"\n        print(f\"Inside inner_h: {my_variable}\"\
    )\n    inner_h()\n    print(f\"Inside h: {my_variable}\")\n\nh()\n```\n\n```\n\
    Inside h: SET IN h\nInside inner_h: SET IN inner_h\nInside h: SET IN h\n```\n\n\
    ```\nprint(f\"Global: {my_variable}\")\n```\n\n```\nGlobal: SET AT GLOBAL SCOPE\n\
    ```\n\nThe nesting is acting as we expect, and we have three variables called\
    \ `my_variable` in different scopes. How can I get `my_variable` in `inner_h`\
    \ to be the same as `my_variable` in `h`? Let’s see what happens when we use global:\n\
    \n```\nmy_variable = \"SET AT GLOBAL SCOPE\"\nprint(f\"First global: {my_variable}\"\
    )\n```\n\n```\nFirst global: SET AT GLOBAL SCOPE\n```\n\n```\ndef h():\n    my_variable\
    \ = \"SET IN h\"\n    print(f\"In h: {my_variable}\")\n```"

  md: '# 13.4 Pie charts


    Another common chart type is the pie chart, where we visualize data as wedges.
    The size of each wedge is related to its data value compared to the sum of the
    values. We use the pie function to create a pie chart.


    ```

    import matplotlib.pyplot as plt


    days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]

    support_calls = [21, 14, 10, 9, 19]



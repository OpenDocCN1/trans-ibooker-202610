  md: 'The *Pearson correlation coefficient*, often just called the correlation coefficient
    *r*, is the covariance divided by the standard deviation of each dataset. This
    division normalizes the covariance to be between -1.0 and 1.0. Values close to
    either extreme are “strongly correlated.” Another way to say this is that there
    is a very strong linear relationship between the datasets. It does not imply causality.


    ```

    ```python

    correlation_coefficients = np.corrcoef(ages, concerts_attended_in_1995)

    correlation_coefficients[0, 1]

    ```


    0.8480108438760603

    ```


    You may see the correlation coefficient written as ρ instead of *r*. ρ is the
    Greek letter “rho.”


    Given two datasets *D* and *E* with values *d*₀ through *d*ₙ and *e*₀ through
    *e*ₙ, the formulas for covariance Cov(*D*, *E*) and correlation coefficient *r*
    are shown in Figure 14.3.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_565_0.png)


    Figure 14.3: Formulas for covariance and correlation'

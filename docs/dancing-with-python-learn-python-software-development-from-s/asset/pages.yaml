  md: '# Exercise 8.9


    What does copytree from shutil do? Use help(shutil.copytree) after importing shutil.


    One way to “move” a file is to copy it and then delete the original. To do it
    in one step, use move from shutil with the same arguments as the copy functions.
    You can rename the file as you move it.


    move also works with directories if both arguments are directories. The directory
    in the first argument is moved to be a child of the directory in the second argument.


    To delete a directory, its files, its subdirectories, and their content, use shutil.rmtree.
    To delete an empty directory, call os.rmdir. As we saw above, to delete a file,
    use os.remove.


    Before you try to delete a file or directory, you should know that it exists or
    use a try / except block.


    # 8.6 Types of files


    Files fall into two main types: text and binary. We can think of a text file as
    something that is humanly readable. It could be plain text with words, numbers,
    and punctuation. It could be an HTML file with all those, plus markup that tells
    us what the information means and how we should display it. The text file could
    contain code that you read, create, update, and extend in a programming editor.
    The information is likely in a Unicode encoding.


    We read and write text files as strings, with newline characters separating individual
    lines. We might read and write the file as a list of strings or one long string.


    Examples of binary files include photos, images, and videos. We don’t represent
    the data as characters in strings but as bytes. Each byte contains eight 0s and
    1s. Instead of asking for the next line as you would for a text file, you ask
    for the next n bytes, for some n > 0. Once you have those bytes, you would process
    them appropriately. If you were looking for something and found it, you would
    be done. Otherwise, you would request more bytes.


    Here’s one way to remember the difference between the file types: we would use
    the string character "2" for the digit two for text. For binary, we would use
    the byte 00000010 for the number two.'

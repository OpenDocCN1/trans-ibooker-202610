- pgno: 177
  md: "Python does not provide any built-in function for factoring integers. Integer\
    \ factorization can be very hard, and this difficulty is the basis for several\
    \ encryption protocols, including RSA. Peter Shor’s 1997 paper on gaining a significant\
    \ improvement for factoring using quantum computers has been a topic of interest,\
    \ concern, and confusion for many years. Should anyone eventually use Shor’s Algorithm\
    \ for factoring large integers, we do know it will require a quantum system with\
    \ hundreds of thousands, if not millions, of qubits. [P.TA]\n\nNevertheless, there\
    \ are some tools we can use that may help us factor specific integers or tell\
    \ if they are prime. The methods I show are basic and often not suitable for large\
    \ integers.\n\nOur first and probably most important tool is the remainder operation\
    \ “%”. If n and m are integers, then n is divisible by m if n% m = 0.\n\n```\n\
    for m in (2, 3, 5, 7):\n    if 14 % m == 0:\n        print(f\"14 is divisible\
    \ by {m}\")\n    else:\n        print(f\"14 is not divisible by {m}\")\n```\n\n\
    14 is divisible by 2\n14 is not divisible by 3\n14 is not divisible by 5\n14 is\
    \ divisible by 7\n\nIt’s necessary to have a list of primes if we want to perform\
    \ these zero-remainder checks. This function uses the ancient Sieve of Eratosthenes\
    \ algorithm to create a list of all prime numbers less than or equal to a positive\
    \ integer.\n\n```\ndef sieve_of_eratosthenes(n):\n    # Return a list of the primes\
    \ less than or equal to n.\n    # First check that n is an integer greater than\
    \ 1.\n\n    if not isinstance(n, int) or not n > 1:\n        print(\n        \
    \    \"The argument to sieve_of_eratosthenes \"\n            \"must be an integer\
    \ greater than 1.\")\n        return []\n\n    # Make a list holding the integers\
    \ from 0 to n.\n\n    potential_primes = list(range(n + 1))\n```"

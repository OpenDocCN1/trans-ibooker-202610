  md: '+   5. Cover the bowl and let it sit in a warm place for 1 hour.

    +   6. Punch down the dough and knead for 5 minutes. Place in a buttered baking
    pan for 30 minutes.

    +   7. Bake in a pre-heated 375° F (190° C, gas mark 5) oven for 45 minutes.

    +   8. Turn out the loaf of bread and let it cool.


    # Problems


    I call that a “straight-through” recipe because you do one step after another
    from the beginning to the end. The flow proceeds in a straight line with no detours.
    However, the recipe is too simple because it does not include conditions that
    must be met before moving to later steps.


    +   - In step 1, your bread will not rise if the yeast is dead. We must ensure
    that the mixture is active and foamy.

    +   - In step 2, we need to add more flour in little portions until the stirred
    dough pulls away from the bowl.

    +   - In step 3, if the dough gets too sticky, we need to add even more flour.

    +   - In step 5, an hour is only an estimate for the time it will take for the
    dough to double in size. It may take more or less time.

    +   - In step 6, we want the dough to double in size in the loaf pan.

    +   - In step 7, 45 minutes is an estimate for the baking time for the top of
    the bread to turn golden brown.


    # Conditional recipe


    +   1. Combine sugar, water, and yeast in a large bowl. Let sit for 10 minutes.
    If the mixture is foamy, then continue to the next step. Otherwise, discard the
    mixture, and combine sugar, water, and fresh yeast in a large bowl. Let sit for
    10 minutes.

    +   2. Mix in the salt, milk, butter, and flour. Stir with a spatula or wooden
    spoon for 5 minutes. If the mixture does not pull aside from the sides of the
    bowl, then add 1 tablespoon of flour and stir for 1 more minute. Otherwise, continue
    to the next step.'

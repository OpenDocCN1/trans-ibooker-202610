    of *set_xlabel* and *set_ylabel* in section 13.1.2.


    # 13.6.1 Drawing a curve


    Our first approach to 3D plotting is to take what we did with points, lines, and
    curves in two dimensions and give them a vertical component. Essentially, they
    are 0- and 1-dimensional objects in three dimensions. Let’s draw the cosine:


    ```

    import matplotlib.pyplot as plt

    from mpl_toolkits.mplot3d import Axes3D

    import numpy as np


    # create the plot figure and 3D axes

    figure = plt.figure()

    axes = plt.axes(projection=''3d'')


    # x will range from -10 to 10 for 1000 values

    xs = np.linspace(-10, 10, 1000)


    # y will always be 0

    ys = np.full(1000, 0)


    # z is the cosine of x

    zs = np.cos(xs)


    # draw the curve

    the_plot = axes.plot(xs, ys, zs, color=''black'')

    ```



  md: "Python printed the date and the time. When we reverse the decorators, the time\
    \ and then the date are displayed.\n\n```\n@say_the_time\n@say_the_date\ndef one_million():\n\
    \    return 100000\n\none_million()\n```\n\nThe time is 12:48:28\nThe day is August\
    \ 11, 2021\n1000000\n\nYou can use a decorator with a function with regular and\
    \ keyword arguments (section 6.5). In the next example, I use *args and **kwargs\
    \ to collect positional and keyword arguments and pass them to the inner wrapper.\n\
    \n```\n# first define without the decorator\ndef adder_with_carry(a, b, carry=0):\n\
    \    return a + b + carry\n\nadder_with_carry(10, 20, carry=1)\n```\n\n31\n\n\
    ```\ndef say_the_date(func):\n    def wrapper(*args, **kwargs):\n        now =\
    \ datetime.datetime.now().strftime(\"%B %d, %Y\")\n        print(f\"The day is\
    \ {now}\")\n        return func(*args, **kwargs)\n    return wrapper\n\n# now\
    \ use the decorator\n\n@say_the_date\ndef adder_with_carry(a, b, carry=0):\n \
    \   return a + b + carry\n\nadder_with_carry(10, 20, carry=1)\n```\n\nThe day\
    \ is August 11, 2021\n31"

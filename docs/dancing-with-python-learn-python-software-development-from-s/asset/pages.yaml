  md: '# 8.5 Names and locations


    If you wish to change the name of a directory, call *rename*.


    ```

    os.rename("recipes/cookies", "recipes/moms-cookies")

    os.rename("recipes", "moms-recipes")

    ```


    We can also *rename* files. The file stays in the same directory but has a new
    name.


    ```

    os.rename("test.py", "chapter-test.py")

    os.rename("recipes/cookies/shortbread.docx", "recipes/cookies/moms-shortbread.docx")

    ```


    To make a copy of a file’s contents, you can duplicate it using a new name in
    its current or another directory, or use its current name in a different directory.
    The **shutil** module provides several functions to copy files. They take the
    same arguments.


    ```

    import shutil


    shutil.copyfile("t.py", "test-01.py")      # same dir, new name

    ```


    ''test-01.py''


    ```

    shutil.copy("t.py", "/tests")      # different dir, same name

    ```


    ''tests\\t.py''


    ```

    shutil.copy2("t.py", "/tests/test-01.py")  # different dir, different name

    ```


    ''tests/test-01.py''


    *copyfile* preserves no metadata, *copy* preserves the permission metadata, and
    *copy2* preserves the permission and time metadata. Each function returns the
    new pathname if the copy operation was successful. I usually use *copy2* unless
    I have a good reason to use one of the other two.



- pgno: 633
  md: '# 15.7 Linear regression


    *Linear regression* is a technique we use to fit a hyperplane to a training set
    of independent variables and one dependent variable.


    A common use is determining the “best” line that best approximates the points
    in a 2-dimensional scatter plot. Here, the *x* coordinate is the independent variable,
    and the *y* coordinate is the dependent variable. This is *simple linear regression*.


    If we have more than one independent variable, we are performing *multiple linear
    regression*. In this section, we look at a simple case and the ordinary least
    squares algorithm.


    Given a new independent observation, *x*, the line’s equation allows us to compute
    an estimated value for its dependent *y*. Let *x*ₘᵢₙ and *x*ₘₐₓ be the minimum
    and maximum values of *x* in the training set. If


    *x*ₘᵢₙ ≤ *x* ≤ *x*ₘₐₓ


    then the prediction of *y* is *interpolation*. Otherwise, the prediction is *extrapolation*
    or *forecasting*.


    # Exercise 15.25


    Why is linear regression a supervised technique?


    The equation for a line in the Cartesian *xy*-plane is


    *y* = *m x* + *b*


    where *m* is the slope, and *b* is the *y*-intercept because *y* = *b* when *x*
    = 0. Statisticians call *m* and *b* the *unknown parameters* until we fit the
    line to the training data.


    # Exercise 15.26


    How many different points do you need to define a line in the plane? How many
    different points do you need to determine a hyperplane?


    Relate your answers to these questions to the minimum number of rows you need
    in your testing set DataFrame.'

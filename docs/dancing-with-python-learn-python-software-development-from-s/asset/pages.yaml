    # Exercise 5.12


    From the previous code, describe how to use f-strings to print numbers in binary
    and hexadecimal.


    Coders usually shorten “hexadecimal” to “hex.” Hex is often used in RGB color
    definitions within HTML and CSS for the web. For example, #fff68f is a light yellow.
    The first two “hexits” are the red component, 3 and 4 are the green component,
    and 5 and 6 are the blue component. #000000 is black, #ffffff is white, and gray
    shades have all three parts equal. You may use lower or uppercase letters in hexadecimal.


    # 5.2.5 Unicode


    This section is about characters in strings, but I delayed introducing the topic
    until we had seen hexadecimal.


    A byte is eight bits or two hexits. The largest integer you can fit into a byte
    is 255 decimal or FF hex, so if you use single bytes for characters in a string,
    you are limited to 256 characters. The original character encoding was ASCII,
    and it used 7 bits for 128 characters.


    Since the English language has 52 uppercase and lowercase letters, 10 digits,
    and less than 20 punctuation marks, 256 may seem more than enough. However, there
    are many languages, mathematical symbols, and emoji. The Unicode standard represents
    all these characters. As of May 2021, there are 144,697 of them in draft version
    14.0. [UNI]


    A mapping from characters to sequences of bytes is called an encoding. The most
    common encoding, and the one used by the majority of websites, is UTF-8. It uses
    one to four bytes. Its specification includes the ASCII characters in the first
    byte. The sequences of bytes represent integers, and we call them code points.'

  md: 'Our final regular expression function is *split*, an advanced version of the
    core **str** method we saw in section 4.8.


    I want to split a string that consists of several of my cats’ names and the ages
    they would have been now. The result I expect is a list of the cats’ names.


    ```

    string = "Hilbert 40 Charlie 35 Gideon 28"

    ```


    I will split at any match that is optional whitespace followed by two digits,
    followed by optional whitespace.


    ```

    pattern = re.compile(r"\s*\d{2}\s*")

    pattern.split(string)

    ```


    ```

    [''Hilbert'', ''Charlie'', ''Gideon'', '''']

    ```


    To include the matches in the list, put parentheses in the pattern.


    ```

    pattern = re.compile(r"(\s*\d{2}\s*)")

    pattern.split(string)

    ```


    ```

    [''Hilbert'', '' 40 '', ''Charlie'', '' 35 '', ''Gideon'', '' 28'', '''']

    ```



  md: '# A.1 The operating system command line


    At several points in this book, I ask you to enter and execute a statement from
    “the operating system command line.” For example, in section 10.1.3, I ask you
    to run `pytest unipoly.py` from the command line.


    The way to get a command line varies by the operating system you are using:


    +   - For Microsoft Windows, open **Windows PowerShell** or **Windows Command
    Prompt** from the **Start** menu or by typing “PowerShell” or “Prompt” in the
    search box.

    +   - For Apple macOS, start the **Terminal** application from **Launchpad** or
    the **Application/Utilities** folder.

    +   - For Linux, if you are in a graphical environment, try typing Ctrl-Alt-T
    to open the **terminal**. Otherwise, look for a “Terminal” application in the
    system menus. If you are not in a graphical environment, you are in a terminal!


    The command line is also called “the shell prompt” in several operating systems.


    # A.2 Installing Python


    You may already have Python 3 installed on your system. Try running


    ```

    ```text

    python -VV

    ```

    ```


    or


    ```

    ```text

    python3 -VV

    ```

    ```


    from the operating system command line. If you see a version and description of
    the Python 3 application, it is already installed. Some systems may have Python
    version 2 installed, and the `python -VV` command may start and show information
    about that. Try `python3 -VV` to see if Python 3 is also installed.


    This book uses Python 3.9, and some examples may not work for versions less than
    that. The process to upgrade to a newer version of Python may require you to have
    special permissions for installing software on your computer. For current information
    about upgrading your system, do a web search for one of


    ```

    ```text

    windows upgrade python

    mac upgrade python

    linux upgrade python

    ```

    ```'
  merge: -1
  img_proc: true

  md: "+   9. **Don’t** include spaces around the equal sign in a keyword or default\
    \ argument.\n+   \n+   10. In arithmetic expressions, **don’t** put a space between\
    \ a negative sign and a number, variable, or expression. **Don’t** put spaces\
    \ around “**” for exponentiation. **Do** put spaces around “+”, “-”, and “*” for\
    \ addition, subtraction, and multiplication. However, you may leave out the spaces\
    \ when multiplying a variable by an integer or when grouping terms closely makes\
    \ your expression easier to read. For example, 2*x - x*y. Use your judgment, but\
    \ be consistent.\n\n# 6.8 Nested functions\n\nYou can define a function inside\
    \ another function. We say that the inner function is *nested* inside the outer.\n\
    \n```\n```python\ndef f(x, y):\n    w = 10\n    def g(z):\n        return z**3\
    \ + w\n    return g(x + y)\n```\n```\n\n```\n```python\nf(2, 3)\n```\n\n135\n\
    ```\n\nThe nested function g on line 3 can see and use w outside its definition\
    \ but within *f*.\n\nYou cannot call a nested function by name outside its enclosing\
    \ function.\n\n```\n```python\ng(3)\n```\n\n`NameError: name 'g' is not defined`\n\
    ```\n\nTo avoid confusion, do not use a parameter name for a nested function that\
    \ you also use for the containing function. You cannot return from a nested function\
    \ all the way out of the function in which you defined it. You may code this behavior\
    \ using an exception via try and except.\n\nYou may define more than one nested\
    \ function, and a nested function may contain additional function definitions\
    \ within it."

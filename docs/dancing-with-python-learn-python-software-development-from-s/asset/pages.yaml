    # Exercise 9.10


    Implement the function `bit_swap` in Python using a simultaneous assignment.


    # 9.2.4 Gates on more than two bits


    We can extend many of the 2-bit gates to three or more inputs. The 3-bit **and**
    returns 1 if all its inputs are 1, and 0 otherwise. For example,


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_369_0.png)


    Though these are useful in electrical engineering, they are less so in coding.


    The Toffoli or **CCNOT** gate is a reversible 3-bit gate. The first two bits are
    control bits, and the third is the target gate. If both the control bits are 1,
    we apply **not** to the target. Otherwise, we leave the target bit alone. We draw
    it as shown on the right.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_369_1.png)


    # Exercise 9.11


    Show that **CCX** is reversible.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_369_2.png)


    The Fredkin or **CSWAP** gate is another reversible 3-bit gate. The first bit
    is the control bit, and its value determines whether we swap the values of the
    second and third bits. If the control bit is 1, we do the swap. Otherwise, we
    leave bits 2 and 3 alone. We draw it as shown on the left.


    # Exercise 9.12


    Show that **CSWAP** is reversible.'

- pgno: 308
  md: "# 7.12 Class and static methods\n\nClass methods and static methods are both\
    \ defined within a class. Unlike an instance method, Python does not bind a class\
    \ method to a particular instance. It is bound to and knows about the entire class.\
    \ A static method is a function that sits within a class but knows nothing special\
    \ about the class or its instances.\n\nYou create a class method by placing the\
    \ @classmethod decorator on the line before the method’s definition. Instead of\
    \ using self for the first parameter as you would in an instance method, use “cls”.\
    \ At runtime, Python passes the class object to the method as the first argument.\n\
    \n```\n@classmethod\ndef get_count_class(cls):\n    return cls.number_of_guitars\n\
    ```\n\nIf you refer to a class variable within a class method, prefix the variable\
    \ name with cls and a “.”. Do not hardcode the name of the class into the call,\
    \ as this can interfere with inheritance.\n\nIf you call the class method from\
    \ the Python command line, you may use either the class name or an instance name\
    \ as the prefix.\n\n```\nGuitar.get_count_class(), g.get_count_class()\n\n(3,\
    \ 3)\n```\n\nWe define a static method with the @staticmethod decorator instead\
    \ of @classmethod, and there is no special first parameter. You can access objects\
    \ inside the class using the class’s hardcoded name, but you do not have the class\
    \ object in hand.\n\n```\n@staticmethod\ndef get_count_static():\n    return Guitar.number_of_guitars\n\
    ```\n\n```\nGuitar.get_count_class(), g.get_count_static()\n\n(3, 3)\n```"
  merge: -1
  img_proc: true
- pgno: 309
  md: "The differences between class and static methods seem slight and subtle.\n\n\
    +   - If you want to package related functions into a class and don’t plan to\
    \ instantiate class objects, use class methods if you have class variables and\
    \ static methods otherwise.\n+   - If you write a non-instance method that creates\
    \ new instances of the class, use a class method.\n+   - If you plan to redefine\
    \ the method in a subclass (next section), use a class method.\n\n# 7.13 Inheritance\n\
    \nStarting from one class, we can derive other classes that inherit and modify\
    \ the original’s behavior and functionality. Inheritance allows us to specialize\
    \ instances while reusing code from the class hierarchy.\n\nIn section 1.10, we\
    \ focused on Bay leaves, but here we return to guitars and their various types.\
    \ Let’s begin with a basic definition of the Guitar class. The full and documented\
    \ code that we develop here is in Appendix D.\n\n```\nclass Guitar:\n    def __init__(self,\
    \ brand, model, year_built, strings=6):\n        self._brand = brand\n       \
    \ self._model = model\n        self._year_built = year_built\n        self._strings\
    \ = strings\n\n    def __str__(self):\n        return f\"{self._strings}-string\
    \ \" \\\n            + f\"{self._year_built} \" \\\n            + f\"{self._brand}\
    \ {self._model}\"\n\nprint(Guitar(\"Fender\", \"Stratocaster\", \"2012\"))\n```\n\
    \n6-string 2012 Fender Stratocaster\n\nIn the Guitar class, we have\n\n+   - instance\
    \ methods __init__ and __str__, and\n+   - instance variables _brand, _model,\
    \ _year_built, and _strings."

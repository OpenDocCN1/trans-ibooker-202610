  md: "# 7.10.6 Exponentiation\n\nTo implement exponentiation by a non-negative integer,\
    \ we code the __pow__ instance method.\n\nIf p is a polynomial, then p⁴ is p ×\
    \ p × p × p. Generally, pⁿ requires n − 1 multiplication operations if we do it\
    \ this way. The algorithm is O(n − 1).\n\nNote, though, that p⁴ is also q × q\
    \ if q = p × p. We only need to do two multiplications instead of three! For p⁵,\
    \ we compute p × q × q. If n = 8,\n\np⁸ = p⁴ × p⁴\n\nand we do 3 multiplications\
    \ instead of 7. We are using the repeated squaring algorithm for exponentiation.\
    \ It is recursive.\n\n**Exercise 7.19**\nAre you suspicious that 3 = log₂(8)?\
    \ Do an O() analysis for repeated squaring.\n\nTo compute pⁿ via repeated squaring,\n\
    \n+   - Return 1 if n is 0.\n+   - Return p if n is 1.\n+   - Return p × p if\
    \ n is 2.\n+   - Recursively compute q = pⁿ // 2. (Remember that \"//\" is integer\
    \ division, so that 7 // 2 == 3, for example.)\n+   - Set q equal to q × q.\n\
    +   - If n is even, return q.\n+   - Return p × q.\n\n```\ndef __pow__(self, exponent):\n\
    \    \"\"\"Raises a polynomial to a non-negative integer exponent.\n\n    `__pow__`\
    \ used by both `**` and `pow`.\n\n    Parameters\n    ----------\n    exponent\
    \ : int\n        The non-negative exponent to which self is raised.\n```"

  md: "```\n- > 19: x = 8  y = 8\n- > 20: x = 0  y = 8\n\ngcd = 8\n```\n\nWe can do\
    \ better with a version using division. Recall that divmod(x, y) returns the tuple\
    \ (x // y, x % y). If we let q, r = divmod(x, y), then x == q*y + r and x - q*y\
    \ = r.\n\n# Exercise 6.18\n\nShow that this equality implies that if prime p divides\
    \ x and y, then p divides r.\n\n```\ndef gcd(x, y, step=1):\n    print(f\"-> {step:>2}:\
    \ {x = }  {y = }\")\n    x, y = abs(x), abs(y)\n\n    if x < y:\n        x, y\
    \ = y, x\n\n    if y == 0:\n        return x\n\n    # at this point, we know that\
    \ x and y and positive integers > 1\n    # with x >= y > 0\n\n    return gcd(y,\
    \ x % y, step + 1)\n```\n\n```\nprint(f\"\\ngcd = {gcd(-24, 400)}\")\n```\n\n\
    ```\n- >  1: x = -24  y = 400\n- >  2: x = 24   y = 16\n- >  3: x = 16   y = 8\n\
    - >  4: x = 8    y = 0\n\ngcd = 8\n```"

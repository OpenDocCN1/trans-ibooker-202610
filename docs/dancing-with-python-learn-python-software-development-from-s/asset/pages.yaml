- pgno: 486
  md: "If we define a group within a group, the numbering descends before continuing\
    \ to the right.\n\n```\n```python\npattern = re.compile(r\"\\b([A-Z]([a-z]*)\\\
    s+([A-Z])\\.\\s+([A-Z][a-z]*)\\b\")\nresult = pattern.search(\"My name is Robert\
    \ S. Sutor\")\n```\n```\n\n```\n```text\nfor g in range(1 + len(result.groups())):\n\
    \    print_match(result, g)\n\ngroup(0) = Robert S. Sutor\"  start(0) = 11  end(0)\
    \ = 26\ngroup(1) = Robert\"  start(1) = 11  end(1) = 17\ngroup(2) = obert\"  start(2)\
    \ = 12  end(2) = 17\ngroup(3) = S\"  start(3) = 18  end(3) = 19\ngroup(4) = Sutor\"\
    \  start(4) = 21  end(4) = 26\n```\n```\n\nHere, group 2 is the part of the first\
    \ name after the first letter. Group 3 is the middle initial.\n\nWe also use group\
    \ numbers for *back-references*. In the following pattern, “\\1” means “what you\
    \ matched for group 1 must also appear here verbatim”:\n\n```\n```python\npattern\
    \ = re.compile(r\"\\b(.+)\\s+City\\s+is\\s+in\\s+\\1\\b\")\nprint_match(pattern.search(\"\
    New York City is in New York\"))\n\ngroup(0) = New York City is in New York\"\
    \  start(0) = 0  end(0) = 28\n```\n```\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_486_0.png)\n\
    \n```\n```text\nprint_match(pattern.search(\"Iowa City is in Iowa\"))\n\ngroup(0)\
    \ = Iowa City is in Iowa\"  start(0) = 0  end(0) = 20\n```\n```\n\n```\n```text\n\
    print_match(pattern.search(\"Jefferson City is in Missouri\"))\n\nNone\n```\n\
    ```\n\nIf you want to use a group but have no intention of referencing it later,\
    \ insert “?:” immediately after the opening parenthesis.\n\n```\n```python\npattern\
    \ = re.compile(r\"\\b(?:[A-Z][a-z]*)\\s+([A-Z])\\.\\s+(?:[A-Z][a-z]*)\\b\")\n\
    result = pattern.search(\"My name is Robert S. Sutor\")\nfor g in range(1 + len(result.groups())):\n\
    \    print_match(result, g)\n\ngroup(0) = Robert S. Sutor\"  start(0) = 11  end(0)\
    \ = 26\ngroup(1) = S\"  start(1) = 18  end(1) = 19\n```\n```\n\nIn this example,\
    \ I only want the middle initial when it appears in the context of a name."

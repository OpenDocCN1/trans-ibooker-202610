  md: "# 8.4 Lists of files and folders\n\nIf I have the five file names\n\nguitar_01.py,\n\
    guitar_02.py,\nunipoly_01.py,\nunipoly_02.py, and\nunipoly_10.py,\n\nthen I can\
    \ use *wildcard characters* to match some of the names. Here are some examples:\n\
    \n+   - The pattern \"*.py\" matches all of them since the pattern means \"the\
    \ name may start with any characters but must end in \".py\".\n+   - The pattern\
    \ \"*01*\" matches **guitar_01.py** and **unipoly_01.py**.\n+   - \"unipoly_0?.py\"\
    \ matches **unipoly_01.py** and **unipoly_02.py**. The \"?\" is a single character\
    \ wildcard and matches anything in that one position.\n\nUsing patterns like these\
    \ to match file names is called \"globbing\" and goes back to the early days of\
    \ UNIX in the late 1960s and early 1970s. The **glob** module implements globbing\
    \ in Python.\n\nThe module’s two most important functions are *glob*, which returns\
    \ a list of matches, and *iglob*, which produces an iterator that gives you the\
    \ matches on demand. Unless you want a list, I recommend you use *iglob* in loops.\n\
    \nThis is how I list all source HTML files in Part I of this book:\n\n```\nimport\
    \ glob\n\nfor html_file in glob.iglob(\"src/part-I/*.html\"):\n    html_file =\
    \ os.path.normcase(html_file)\n    print(html_file)\n```\n\nsrc\\part-i\\collecting-things-together.html\n\
    src\\part-i\\computing-and-calculating.html\nsrc\\part-i\\defining-and-using-functions.html\n\
    src\\part-i\\organizing-objects-into-classes.html"

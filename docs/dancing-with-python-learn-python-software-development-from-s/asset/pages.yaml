    # 14.1.3 Standard deviation and variance


    Let’s look at two datasets of 99 numbers. The first contains each integer from
    1 to 99. The second contains 99 copies of the integer 50. In each case, the mean
    is 50.


    ```

    ```python

    data_1 = np.arange(1, 100)

    data_2 = np.repeat(50, 99)

    (np.mean(data_1), np.mean(data_2))

    ```

    ```


    (50.0, 50.0)


    In the first case, the values are well spread out from the mean. In the second,
    every value is centered at the mean. We use the *standard deviation*, written
    as the Greek letter sigma = σ, to measure this spread. The **numpy function**
    *std* computes the standard deviation of a 1-dimensional array of values.


    ```

    ```python

    (np.std(data_1), np.std(data_2))

    ```

    ```


    (28.577380332470412, 0.0)'

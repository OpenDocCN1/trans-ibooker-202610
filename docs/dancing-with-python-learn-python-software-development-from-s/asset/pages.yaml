  md: "# D\n\n# The Complete Guitar\nClass Hierarchy\n\nThis appendix contains the\
    \ complete and final definition of the **Guitar** class for guitars that we developed\
    \ in *Chapter 7. Organizing Objects into Classes*.\n\n```\n```python\n\"\"\"The\
    \ guitar module implements the class hierarchy from Chapter 7.\n\nWooden     \
    \  MusicalInstrument (ABC)\n|            |\n|            +-- Clarinet (ABC)\n\
    |            |\n|            +-- Guitar\n|                 |\n|              \
    \   +-- ElectricGuitar\n|                 |\n+-------------+-- AcousticGuitar\n\
    \"\"\"\nfrom abc import ABC, abstractmethod\nfrom enum import Enum\n\n\nclass\
    \ MusicalInstrument(ABC):\n    \"\"\"Abstract base class for musical instruments.\n\
    \n    Parameters\n    ----------\n    brand : str\n```\n```"

  md: '# 3.9.5 None


    Have you ever asked someone what they were thinking, only to have them reply,
    “Nothing”? Well, None of type NoneType is the explicit “nothing” of Python. Here
    are two example coding situations in which you might use it:


    +   - You are writing a function to search a new collection type. When the user
    looks for an item that isn’t there, you don’t want to raise an exception. The
    search can return None. Just make sure users can’t look for None!

    +   - You are writing code to format text, and you use True or False to state
    whether the text should be italicized. However, you want a way to preserve whatever
    the surrounding paragraph is doing for italics. Use None to mean, “Don’t turn
    italics on or off, leave it the way it is.”


    Exercise 3.27


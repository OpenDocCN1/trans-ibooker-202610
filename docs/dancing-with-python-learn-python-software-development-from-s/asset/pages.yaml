- pgno: 274
  md: '# 7.4.4 “is” versus “==”


    Suppose I have the three polynomial definitions


    ```

    p = UniPoly(-3, ''z'', 10)

    ```


    ```

    q = p

    ```


    ```

    r = UniPoly(-3, ''z'', 10)

    ```


    They all look the same:


    ```

    p, q, r

    ```


    ```

    (-3*z**10, -3*z**10, -3*z**10)

    ```


    and they all test the same using "==":


    ```

    p == q, p == r, q == r

    ```


    ```

    (True, True, True)

    ```


    However, we get different answers when we use is.


    ```

    p is q, p is r, q is r

    ```


    ```

    (True, False, False)

    ```


    We use is when we want to know if two objects are literally the same within Python.
    We’re not testing if they look the same; we’re asking, “if I go to the location
    in my computer’s system memory where Python stores p, will this be the same location
    where Python stores q?”.


    Now let’s change the indeterminate in the polynomial p.


    ```

    p

    ```


    ```

    -3*z**10

    ```


    ```

    p.indeterminate = ''M''

    ```


    ```

    p, q, r

    ```


    ```

    (-3*M**10, -3*M**10, -3*z**10)

    ```


    As you can see, I changed p, but I also changed q. They are the same Python objects
    addressed by two different names. As an analogy, you can call me “Bob” or “Robert”,
    but I’m still me.


    You do not need to do anything special to implement is.'

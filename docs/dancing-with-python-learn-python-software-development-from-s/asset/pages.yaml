- pgno: 562
  md: 'There is no deviation from the mean in the second case. The box plots in Figure
    14.1 show the different distributions in the two datasets.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_562_0.png)


    Figure 14.1: Box plots of two distributions of the numbers 1 to 99


    Informally, we want to get an idea of how much each data value is different from
    the mean, on average. This would give us an “average deviation,” and we could
    imagine computing it as the average of the absolute values of the values minus
    the mean. If the data values are numbers *d*₁ to *d*ₙ, then this would be the
    second line in


    $$\text{mean}=\mu=\frac{d_1+\cdots+d_n}{n}=\frac{1}{n}\sum_{j=1}^{n}d_j$$


    $$\text{average deviation}=\frac{|\mu-d_1|+\cdots+|\mu-d_n|}{n}=\frac{1}{n}\sum_{j=1}^{n}|\mu-d_j|$$


    $$\text{standard deviation}=\sigma=\sqrt{\frac{(\mu-d_1)^2+\cdots+(\mu-d_n)^2}{n}}=\sqrt{\frac{1}{n}\sum_{j=1}^{n}(\mu-d_j)^2}$$


    The average deviation is not easy to manipulate mathematically, and so we use
    the standard deviation defined in the third line. The standard deviation also
    has the advantage of giving more weight to values further from the mean.


    The right-most expressions in the formulas for mean, average deviation, and standard
    deviation use the Σ sum notation if you have seen that in school. The definition
    of each Σ expression is the formula to its left.'

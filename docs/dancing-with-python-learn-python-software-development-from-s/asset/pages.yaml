- pgno: 408
  md: '# 9.7.8 Entangling qubits


    In this section, we work with two qubits. If qubit $q_0$ has the quantum state


    $|\psi_0\rangle = a_0 |0\rangle + b_0 |1\rangle$


    and qubit $q_1$ has the quantum state


    $|\psi_1\rangle = a_1 |0\rangle + b_1 |1\rangle,$


    then their 2-qubit quantum state is


    $|\psi_0\rangle \otimes |\psi_1\rangle = (a_0 |0\rangle + b_0 |1\rangle) \otimes
    (a_1 |0\rangle + b_1 |1\rangle) =$

    $a_0 a_1 |00\rangle + a_0 b_1 |01\rangle + b_0 a_1 |10\rangle + b_0 b_1 |11\rangle.$


    Can we write all 2-qubit quantum states in this form? **No.**


    If a 2-qubit quantum state can be written as $|\psi_0\rangle \otimes |\psi_1\rangle$
    for single-qubit states $|\psi_0\rangle$ and $|\psi_1\rangle$, then the qubits
    are *separable*. Otherwise, the qubits are *entangled*. Entanglement is a fundamental
    property of quantum computing.


    A simple separable state is $(\sqrt{2}/2)|00\rangle + (\sqrt{2}/2)|01\rangle$
    because it is $|0\rangle \otimes ((\sqrt{2}/2)|0\rangle + (\sqrt{2}/2)|1\rangle)$.
    Here $|\psi_0\rangle = |0\rangle$ and $|\psi_1\rangle = (\sqrt{2}/2)|0\rangle
    + (\sqrt{2}/2)|1\rangle$. When I measure $|\psi_0\rangle$, it tells me nothing
    about $|\psi_1\rangle$.


    In contrast, consider


    $(\sqrt{2}/2)|00\rangle + (\sqrt{2}/2)|11\rangle.$


    Let’s measure the first qubit and leave the second alone. If we get 0, we must
    have gotten it from $|00\rangle$ because the first qubit in $|11\rangle$ would
    have delivered a 1. So the second qubit **must** measure to 0, the second entry
    in $|00\rangle$. Similarly, if we measure the second qubit and get a 1, the first
    qubit also must measure to 1 coming from $|11\rangle$. The qubits’ behavior is
    entangled, and they have lost their independence.


    The quantum state $(\sqrt{2}/2)|00\rangle + (\sqrt{2}/2)|11\rangle$ is one of
    the four entangled Bell states:


    $|\Phi^+\rangle (\sqrt{2}/2)|00\rangle + (\sqrt{2}/2)|11\rangle \quad |\Psi^+\rangle
    (\sqrt{2}/2)|01\rangle + (\sqrt{2}/2)|10\rangle$


    $|\Phi^-\rangle (\sqrt{2}/2)|00\rangle - (\sqrt{2}/2)|11\rangle \quad |\Psi^+\rangle
    (\sqrt{2}/2)|01\rangle - (\sqrt{2}/2)|10\rangle$


    There are two things here I want you to remember:


    +   1. When you see √2/2, think of the **H** gate.

    +   2. When you need entanglement, think of the **CNOT** gate.'

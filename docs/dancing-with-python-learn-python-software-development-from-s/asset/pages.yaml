- pgno: 621
  md: 'Here is an outline of the algorithm:


    +   1. If your features represent different kinds of data or value ranges, normalize
    or standardize them as we did in section 15.3.

    +   2. Number the n points as x₀ to xₙ₋₁. We must have k ≤ n.

    +   3. Choose k different points, c₀ to cₖ₋₁, at random as your initial guesses
    for the centroids. This is why the KMeans function has the optional random_state
    argument for the seed.

    +   4. We now generate our first guesses for the clusters. We call the clusters
    C₀ to Cₖ₋₁ Starting with x₀, compute the squares of the distances between x₀ and
    each centroid. If the centroid cⱼ has the smallest squared distance and j is the
    smallest integer with this value, put x₀ in Cⱼ. For example, if x₀ has the same
    squared distance from c₂, c₃, and c₇, put x₀ in C₂ because 2 < 3 < 7.

    +   5. Repeat the last step for every point. We have now placed every point in
    a cluster.

    +   6. Recalculate each centroid as the mean of all the points in its cluster.

    +   7. Repeat the assignments of points to the k clusters.

    +   8. Are we done yet? Recalculate the centroids, and if they have not changed
    since the last time, we are finished. Exit the algorithm with the computed centroids
    and clusters. If the centroids did change, go back to the previous step and assign
    the points to clusters.


    # Exercise 15.16


    Why do we know the clusters each contain at least one point after step 4?


    Unfortunately, this algorithm is not always guaranteed to converge to a unique
    set of clusters. It may keep bouncing back and forth between different centroids.
    You may want to limit the last steps to a fixed number of iterations, such as
    10 or 50. Experiment!


    In the final step, I said, “if they have not changed since the last time.” You
    might want to change this to something like “if they have not changed by more
    than 0.1 since the last iteration.” That is, settle for close but not perfect.


    Not all datasets and subsets of features cluster well. It is worth trying clustering
    as a first technique to understand if there is some apparent structure to the
    information.'
  merge: -1
  img_proc: true

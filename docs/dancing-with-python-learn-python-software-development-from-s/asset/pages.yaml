- pgno: 463
  md: 'After the CZ oracle which does a sign flip on |11⟩, the 2-qubit quantum state
    is


    (1/2) |00⟩ + (1/2) |01⟩ + (1/2) |10⟩ − (1/2) |11⟩


    We next apply H gates to each qubit. This is the 2-qubit H⊗2 gate we saw at the
    end of section 9.6.4.


    (1/2) (H⊗2) |00⟩ + (1/2) (H⊗2) |01⟩ + (1/2) (H⊗2) |10⟩ − (1/2) (H⊗2) |11⟩


    This is a very messy calculation with 16 terms. The applications of H⊗2 on the
    standard basis kets are


    H⊗2 |00⟩ = (1/2) (|00⟩ + |01⟩ + |10⟩ + |11⟩)

    H⊗2 |01⟩ = (1/2) (|00⟩ − |01⟩ + |10⟩ − |11⟩)

    H⊗2 |10⟩ = (1/2) (|00⟩ + |01⟩ − |10⟩ − |11⟩)

    H⊗2 |11⟩ = (1/2) (|00⟩ − |01⟩ − |10⟩ + |11⟩)


    Inserting these values and collecting terms, the result is


    (1/2) |00⟩ + (1/2) |01⟩ + (1/2) |10⟩ − (1/2) |11⟩


    It may surprise you that this is the original value, but it is nevertheless the
    result in this case.


    Next, we look at the effect of X⊗2 on the standard basis kets:


    X⊗2 |00⟩ = |11⟩

    X⊗2 |01⟩ = |10⟩

    X⊗2 |10⟩ = |01⟩

    X⊗2 |11⟩ = |00⟩


    Applying this to the previous result, we get


    − (1/2) |00⟩ + (1/2) |01⟩ + (1/2) |10⟩ + (1/2) |11⟩


    Now we examine id ⊗ H. Since


    id ⊗ H |00⟩ = (√2/2) |00⟩ + (√2/2) |01⟩

    id ⊗ H |01⟩ = (√2/2) |00⟩ − (√2/2) |01⟩

    id ⊗ H |10⟩ = (√2/2) |10⟩ + (√2/2) |11⟩

    id ⊗ H |11⟩ = (√2/2) |10⟩ − (√2/2) |11⟩


    the result of the next step is


    − (1/2) ((√2/2) |00⟩ + (√2/2) |01⟩) + (1/2) ((√2/2) |00⟩ − (√2/2) |01⟩) + (1/2)
    ((√2/2) |10⟩ + (√2/2) |11⟩) + (1/2) ((√2/2) |10⟩ − (√2/2) |11⟩)'

- pgno: 320
  md: "# 7.14 Iterators\n\nWhat really happens when Python iterates over a list?\n\
    \n```\nfor i in [2, 3, 5]:\n    print(i)\n```\n\n2\n3\n5\n\nPython keeps track\
    \ of your position in the list and returns the “next” item every time you ask\
    \ for it. When you reach the end of the list, the loop terminates. It behaves\
    \ something like this:\n\n```\nthe_list = [2, 3, 5]\nthe_index = 0\n\nwhile True:\n\
    \    if the_index < len(the_list):\n        print(the_list[the_index])\n     \
    \   the_index += 1\n    else:\n        break\n```\n\n2\n3\n5\n\nThis iteration\
    \ looks like normal progression through the list from the beginning to the end.\
    \ What “iteration” means is up to you: you can define it to do anything you wish.\n\
    \n```\nthe_list = [2, 3, 5]\nthe_index = len(the_list) - 1\n\nwhile True:\n  \
    \  if the_index >= 0:\n        print(the_list[the_index])\n        the_index -=\
    \ 1\n    else:\n        break\n```\n\n5\n3\n2"
  merge: -1
  img_proc: true
- pgno: 321
  md: 'In this case, the iteration framework we have set up selects the items from
    the last to the first. The “next” item is before the one we last accessed in the
    list.


    An *iterator* object has a `__next__` magic method defined for it by its class.
    The first time you call `__next__`, it returns the “initial” object. The Python
    code remembers your position and subsequent calls to `__next__` work their way
    through all the items.


    An *iterable* object has a `__iter__` magic method that returns an iterator object.
    An object may be both an iterable and an iterator. In this case, `__iter__` often
    just returns self.


    # An iterable returns an iterator via `__iter__`.


    **Exercise 7.35**

    Is an object returned by *range* an iterable, an iterator, or both?


    Python calls `__iter__` and `__next__` automatically in a for loop via *iter*
    and *next*. You can call them yourself.


    ```

    my_iter = iter([2, 3, 5])

    print(next(my_iter))

    ```


    2


    ```

    print(next(my_iter))

    ```


    3


    ```

    print(next(my_iter))

    ```


    5


    If you call it one more time, *next* raises the **StopIteration** exception.


    ```

    print(next(my_iter))

    ```


    StopIteration


    You should raise this exception in your `__next__` code so that for works correctly.
    Look for and catch **StopIteration** in a try block.


    If your object changes while you are iterating over it, you may get errors or
    at least unexpected results. For example, you likely do not want to insert or
    remove items from a list while working with it in a loop.'
  merge: -1

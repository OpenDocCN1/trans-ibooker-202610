    in blue, purple, red, green, and orange, starting with Monday, though they may
    appear monochromatically to you depending on the medium in which you are reading
    this book.


    We provide many of the stylistic controls for the display of the chart as keyword
    arguments to pie. If I add the argument autopct="%1.1f%%" to the call to pie,

- pgno: 495
  md: '| making | make | VERB | ROOT |

    | more | more | ADV | advmod |

    | fried | fried | ADJ | amod |

    | green | green | ADJ | amod |

    | tomatoes | tomato | NOUN | dobj |

    | . | . | PUNCT | punct |


    Column 1 contains the tokens themselves. The only surprising entries are the first
    and second, where spacy split “I’m” into “I” and “’m”. If we had first expanded
    the contraction to “I am”, we would have seen two tokens as well.


    Column 2 lists the word roots, also known as lemmas. In lemmatization, we choose
    a unique word among all the forms it can take on. Here, “’m” has the lemma “be”,
    as would “am,” “are,” “is,” “be,” “was,” and so forth. The lemma for “making”
    is “make,” and the lemma for “tomatoes” is “tomato.”


    Column 3 shows the parts of speech. [SCA]


    +   - ADJ: adjective

    +   - ADV: adverb

    +   - AUX: auxiliary verb

    +   - NOUN: noun

    +   - PRON: pronoun

    +   - PUNCT: punctuation

    +   - VERB: verb


    There are a dozen other parts, including ADP for adposition (often a preposition),
    PROPN for proper noun, CONJ for conjunction (“and,” “but,” “or”), and DET for
    determiner (“a,” “an,” “the”).


    # Dependencies


    Column 4 contains the dependency tags.


    +   - advmod: adverbial modifier

    +   - amod: adjectival modifier

    +   - aux: auxiliary

    +   - dobj: the direct object

    +   - nsubj: the nominal subject

    +   - punct: punctuation

    +   - root: the root verb of the sentence'

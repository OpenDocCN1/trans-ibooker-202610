  md: '# 15.6 Classification


    Classification provides answers to questions like the following:


    +   - Wear the blue, white, or yellow shirt?

    +   - Buy or lease the car?

    +   - Hire or don’t hire the person?

    +   - Watch or don’t watch the movie?

    +   - Take or don’t take the class?

    +   - Read the email or move it to the spam folder?

    +   - Issue the credit card or not?


    Classification looks at an *observation* and places it in one of several *classes*.
    In the first question, the observation is the situation for which I am choosing
    the shirt and my past behavior. There are three possible shirts, and so three
    classes. The other questions require *binary classification* because they each
    have only two possible answers, “yes” or “no.”


    The general classification discipline of statistics and machine learning does
    not limit itself to two classes, though binary classification is very common.
    The *classifier* assigns the observation to a class by using a model previously
    built using a training set. Classification is an example of supervised machine
    learning.


    A classifier may produce the probability of an observation being in a class instead
    of the class label. Consider the information about the gender of cats in section
    14.8. If you present me with a cat that is either calico or tortoiseshell, I can
    place it in the F class with very high probability. For cats of other colors,
    the chances are much closer to 50–50 that the cat is female or male.


    Before we look at some classification techniques, let’s load a DataFrame with
    the outfielder position coordinates and computed cluster labels from section 15.5.
    We only consider points lying in cluster 1 or cluster 2, and I show these in Figure
    15.4.


    ```

    df = pd.read_csv("src/examples/clustering-xy-labels.csv")

    df = df[df["label"] != 0]

    df.head()

    ```


    x y label

    0 13.4832 3.2657 1

    2 2.9279 2.9603 2

    4 3.3011 2.4642 2'

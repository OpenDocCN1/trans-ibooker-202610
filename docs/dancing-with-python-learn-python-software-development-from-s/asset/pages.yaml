    # B.3 Python expert sites


    There are dozens of websites where you can find information about doing this or
    that in Python. Many of them are correct, and many of them use Python 3. Look
    for articles written in the last five years. If you see code that uses *print*
    without a following open parenthesis, stop reading. They are discussing Python
    2, not Python 3.'

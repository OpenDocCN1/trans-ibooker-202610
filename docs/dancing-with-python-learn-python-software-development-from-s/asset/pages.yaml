- pgno: 640
  md: 'Figure 15.15 shows the three input nodes, four nodes in the hidden layer, and
    two output nodes. I’ve also shown the *weights* $w_{i,1}$ for the input nodes
    going to the first hidden node $h_1$. We also have weights relating the input
    nodes to $h_2$, $h_3$, and $h_4$, and relating those to the output nodes. I have
    not shown them to keep the diagram less cluttered.


    Another name for a node is *neuron*, and Figure 15.15 shows a *neural network*.
    More precisely, this is an *artificial neural network (ANN)* because of its similarity
    to what we believe happens in the brain. As we shall see, we can do machine learning
    with such networks.


    Important questions include:


    +   - Can we have more inputs? (Yes)

    +   - Can we have more hidden nodes? (Yes)

    +   - Can we have more outputs? (Yes)

    +   - What happens in the nodes in the hidden layer?

    +   - Can we have more hidden layers?


    I answered the first three, so let’s look inside a hidden node to answer the fourth
    question. I use $h_1$ as an example. As with linear regression, we compute


    ```

    $$w_{1,1}x_1 + w_{2,1}x_2 + w_{3,1}x_3 + b_1$$

    ```


    where I have adjusted the subscripts to indicate we are working with $h_1$. I
    call this result $z_1$. What now? What do we send on to $y_1$ and $y_2$ in the
    output layer?


    # 15.8.1 Activation functions


    Inside $h_1$, we compute $z_1$ and then apply an *activation function*, which
    I call $af$.


    ```

    $$af(z_1) = af(w_{1,1}x_1 + w_{2,1}x_2 + w_{3,1}x_3 + b_1)$$

    ```


    We send the result of $af$ to $y_1$ and $y_2$. If the result we send is 0, we
    are saying, “this node has nothing to contribute.” Alternatively, a non-zero result
    says, “this node/neuron has activated.”


    If $af$ is a linear function, this neural network implements linear regression
    and so is not very interesting as a new technique. Nevertheless, machine learning
    practitioners sometimes use the identity function $af(x)=x$ as an activation function.
    Its effect is to take $z_1$ and pass it forward to $y_1$ and $y_2$ without change.'

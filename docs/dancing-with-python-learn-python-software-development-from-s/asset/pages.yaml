  md: '# 3.2.6 Slicing: Referencing sub-lists


    Slice notation is a convenient way to specify a group of zero or more items in
    a list. When you first start slicing, it can appear both powerful and mystifying.
    Over time, you’ll appreciate its elegance, and your comfort will increase.


    We start by looking at how we use slicing to pull out a sub-list of items from
    the original list. The items might not be next to each other in the original,
    though they are picked out from the usual or reverse item sequence. For a list
    called the_list, a slice looks like


    ```

    the_list[start=0 : end=len(the_list)] : step=1

    ```


    There are three parameters separated by colons, and they each have default values.


    # Exercise 3.7


    For each of the following examples, shade the item boxes in a diagram like that
    in Figure 3.5 to show the list items in the slice.



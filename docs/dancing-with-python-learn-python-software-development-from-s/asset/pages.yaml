- pgno: 516
  md: "getsiz​​eof measures an object’s size, **but not the size of the objects to\
    \ which it refers.** In this example, `getsizeof` is not including the sizes of\
    \ the strings in the lists. We can get a better approximation of the true total\
    \ amount of memory used with a function like the following:\n\n```\n```python\n\
    def getsizeof_list(the_list):\n    size = getsizeof(list)\n    for item in the_list:\n\
    \        size += getsizeof(item)\n    return size\n```\n```\n\n```\n```python\n\
    x_values = list(range(1000))\ngetsizeof_list(x_values)\n```\n```\n\n28404\n\n\
    # Exercise 13.2\n\n> Is the result from `getsizeof_list` correct if the list contains\
    \ a set, dictionary, or another list? Write a new function that recursively measures\
    \ the size of an object and everything it contains.\n\nThere are more efficient\
    \ ways of storing numeric data by packing it closely together consecutively in\
    \ memory. Such a structure is called an *array*, and NumPy is a widely used Python\
    \ package that includes powerful multi-dimensional array support. NumPy calls\
    \ itself “The fundamental package for scientific computing with Python,” and I\
    \ agree. [ANN] [NPY] [NUM] By tradition, we import the NumPy package as np.\n\n\
    ```\n```python\nimport numpy as np\n```\n```\n\nThe *arange* function is similar\
    \ to *range*, but it builds an array more efficiently than using an iterator,\
    \ generator, or list.\n\n```\n```python\nx_values_array = np.arange(1000)\n\n\
    getsizeof(x_values_array)\n```\n```\n\n4104"

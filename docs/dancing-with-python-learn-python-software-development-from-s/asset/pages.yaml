    # Exercise 14.1


    How do you calculate the median if the number of data values is even? Odd?


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_558_0.png)


    The first quartile, commonly called *Q1*, is the median of the data values less
    than the median. Approximately 25% of the smallest data values are in the first
    quartile. We compute it using the *quantile* function.


    ```

    Q1 = np.quantile(ages, 0.25)

    ```


    The third quartile, commonly called *Q3*, is the median of the data values greater
    than the median. Approximately 25% of the largest data values are in the third
    quartile.


    ```

    Q3 = np.quantile(ages, 0.75)

    Q1, Q3

    ```


    ```

    (38.0, 43.0)

    ```


    # Exercise 14.2


    What is `np.quantile(ages, 0.1)`? What does it represent? What about `np.quantile(ages,
    2.0/3.0)`?


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_558_1.png)


    The interquartile range, commonly called *IQR*, is the difference between *Q3*
    and *Q1*.


    ```

    IQR = np.quantile(ages, 0.75) - np.quantile(ages, 0.25)

    ```


    Data is often associated with units like meters, feet, hours, nanoseconds, gallons,
    and liters. The unit for each value in ages is “years.” Therefore, the unit for
    mean, median, and standard deviation is also years.'

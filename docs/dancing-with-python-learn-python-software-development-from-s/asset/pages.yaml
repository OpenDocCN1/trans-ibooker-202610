  md: '# 12.3.4 Other NLP tools to consider


    I used spaCy in this chapter because it is relatively new and quite fast. You
    have other NLP options in Python, and even more if you use tools written in other
    languages or for specialized purposes. You should choose the package that gives
    you the ease of use, speed, and multiple language support that you need for your
    work. I think the two other top candidates for your consideration are


    +   - TextBlob – easy to use and to get started, perhaps not as fast as spaCy.
    [TBL]

    +   - Natural Language Toolkit (NLTK) – extensive and has almost everything you
    can imagine for linguistic analysis. [NLTK]


    I consider spaCy as roughly between TextBlob and NLTK, though their authors might
    debate that. Since the three packages are constantly evolving, experiment with
    each to see which performs best and most easily for your tasks.


    Another option is a cloud-based NLP service. The major providers, such as IBM
    that I mentioned for speech-to-text in section 12.3.1, have NLP APIs and can do
    all computation and data storage on the cloud. [INL]


    # 12.4 Summary


    In this chapter, we looked at text. We started with strings and the characters
    in them and moved on to regular expressions to perform sophisticated matching
    and substitution. While character patterns are interesting, they do not tell us
    much about linguistic content. For that, we saw many examples of natural language
    processing (NLP) using the spacy Python package.


    Understanding text is complicated, even for people sometimes. Use these tools
    carefully, and do not assume your results represent the absolute truth. For example,
    compare



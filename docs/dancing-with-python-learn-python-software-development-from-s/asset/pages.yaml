  md: 'This result says that "dream" is at index 13. We say that "dream" is a substring
    of "perchance to dream". It also illustrates a form of function application we
    have not seen before. In this case, find is a method within the class str, and
    so operates on objects of that class. The format is


    ```

    object.method_name(argument₁, argument₂, ...)


    The find method on strings is defined within Python to have three parameters with
    the last two having default values.


    ```

    string_to_be_searched.find(string_to_be_found, start_index, end_index)

    ```


    The default value of start_index is 0: if you do not include it, Python assumes
    it is 0. If you provide an explicit value for start_index, you can then also give
    a value for end_index. Its default otherwise is len(string_to_be_searched). We
    search from index start_index to but not including end_index.



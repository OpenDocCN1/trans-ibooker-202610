  md: '# 12.2.2 More general patterns


    When we have a character class containing a single character, we may omit the
    surrounding square brackets. This is why the pattern `r"ABC"` is the same as `r"[A][B][C]"`.


    # Alphanumeric characters


    Use a hyphen “-” to specify a range of characters within a character class in
    brackets. Instead of using this pattern for matching a lowercase letter:


    ```

    r"[abcdefghijklmnopqrstuvwyz]"

    ```


    the simpler


    ```

    r"[a-z]"

    ```


    suffices. To match an upper or lowercase letter, use the pattern


    ```

    r"[a-zA-Z]"

    ```


    To match a decimal digit, use `r"[0-9]"` or `r"\d"`. To match any character that
    is **not** a decimal digit, use either `r"[^0-9]"` or `r"\D"`. When you use “^”
    inside square brackets, it negates what immediately follows.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_479_0.png)


    To match an alphanumeric character, which in Python is a letter or a decimal digit
    or an underscore, use `\w`. Use `\W` to match a non-alphanumeric character.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_479_1.png)


    To match any character, use a period, “.”.


    # Beginnings and endings


    When “^” starts a pattern like `r"^Eco"`, it means “match "Eco" only at the start
    of the string.” A dollar sign “$” at the end of a pattern means to match at the
    end of the string.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_479_2.png)


    ```

    ```python

    string = "economic ecosystem center"


    # match ''e'' followed by any lowercase letter


    re.compile(r"e[a-z]").findall(string)

    ```


    ```text

    [''ec'', ''ec'', ''em'', ''en'', ''er'']

    ```

    ```'

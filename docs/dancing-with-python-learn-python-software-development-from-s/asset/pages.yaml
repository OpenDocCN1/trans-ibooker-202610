- pgno: 265
  md: 'The polynomial 0 is [ ].


    When I display a polynomial like 3x⁶ − 5x⁴ + x in mathematical format, I do so
    in descending order of exponents. I could also do it in ascending order, but one
    or the other is needed to make it easy to read the polynomial. Not coincidentally,
    I used descending sort order for the inner lists based on the second item, the
    exponent, in the Python representation. Is this necessary? Do I need to keep the
    list of terms sorted?


    If I do, every time I multiply two polynomials and create new terms for the product,
    I have to either insert the new terms in the correct sequence or sort the terms
    at the end.


    ```

    unsorted_terms = [[-5, 4], [1, 1], [3, 6]]

    unsorted_terms

    ```


    [[-5, 4], [1, 1], [3, 6]]


    ```

    sorted(unsorted_terms, key=(lambda term: term[1]), reverse=True)

    ```


    [[3, 6], [-5, 4], [1, 1]]


    The optional keyword argument key for sorted takes a function that returns some
    value for comparison. In this case, it returns the second item in a term, the
    exponent. sorted uses “<” to compare the results of key. If you set reverse=True,
    sorted uses “>”.


    # Exercise 7.4


    The default value of key is None. What comparison values does sorted use then?


    You may think that careful term insertion or repeated sorting is not onerous,
    but it can become a severe performance bottleneck when polynomials have tens or
    hundreds of terms. I now decide that I will not worry about the exponent order
    in the representation, and I will sort only if I need to display the polynomial.


    Dropping the ordered sequence of exponents seems better, but what if I am adding
    two polynomials and I must look at the terms in each that have the same exponent?
    If I have a term for the first polynomial in hand, I must search each term in
    the second polynomial to try to locate the corresponding one with the same exponent,
    if it is there.'

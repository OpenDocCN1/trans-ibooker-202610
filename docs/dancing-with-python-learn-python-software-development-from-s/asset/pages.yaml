  md: 'Operating systems keep track of a lot of data about files, and os.path provides
    ways of getting that. Figure 8.2 shows the file information that Windows 10 had
    for the source file for this chapter at one point during in its development:


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_336_0.png)


    Figure 8.2: Windows Explorer file information


    The getctime, getmtime, and getatime functions give you the file creation time,
    last modification time, and last access time.


    ```

    mod_time = os.path.getmtime("src/part-I/Working-with-Files.html")

    mod_time

    ```


    1628111739.0


    This result is the time someone last modified the file, and it is the number of
    seconds since the epoch.


    The epoch is a peculiar computer system concept, with second 0 being midnight
    on January 1, 1970, for many operating systems. We can make more sense of mod_time
    if we use gmtime and asctime.'

- pgno: 537
  md: '![](img/4ffeafa3e3f1373f02971e43b0755ea6_537_0.png)


    Figure 13.7: The pie chart with wedge percentages


    The format specifier "%1.1f%%" comes from the time before Python supported f-strings.
    The first “%” says, “this is a format string.” “1.” says, “show at least one digit
    followed by a decimal point.” “1f” means, “show one digit after the decimal point
    of this floating-point number.” Finally, “%%” will insert a percentage sign.


    Use the colors keyword argument to give a sequence of color names or hex RGB values.
    Typically, the sequence is a list or tuple. If you give fewer colors than there
    are data values, **matplotlib** cycles through them again starting at the beginning
    of the sequence. I defined


    ```

    gray_shades = ["#A0A0A0", "#B0B0B0", "#C0C0C0", "#D0D0D0", "#E0E0E0"]

    ```


    and then passed them to *pie* via colors=gray_shades. The updated chart is in
    Figure 13.8.



    <re.Match object; span=(45, 48), match=''red''>


    The first is in the middle of the word "credit", the second is at the start of
    the word "reduction", and the third is "red" itself at the end of the sentence.
    What if we want the free-standing third case? Use \b at the beginning or end of
    a pattern to signify that any match should be at a word boundary.



  md: 'When we have two points, say (2.0, 2.0) and (8.0, 5.0), it is trivial to compute
    the line through them. In this case, $m = 0.5$ and $b = 1.0$, and Figure 15.11
    shows the plot.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_634_0.png)


    Figure 15.11: Simple linear regression on two points


    What happens when we add the point (4.0, 5.0)? There is no line that passes through
    all three points, so we seek a line that somehow represents the data better than
    any other line.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_634_1.png)


    Figure 15.12: Simple linear regression on three points


    I’ve labeled the line we want as $L$ in Figure 15.12. The three initial points
    are the black-filled circles. We need to compute the equation of $L$ so that we
    minimize the sum of the squares of the vertical distances from our points to $L$.
    The white circles are the points on $L$ closest to our initial points, and their
    vertical distances are $e_1$, $e_2$, and $e_3$.'

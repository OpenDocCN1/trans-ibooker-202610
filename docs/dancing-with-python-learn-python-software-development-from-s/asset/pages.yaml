    \ Boolean values `True` and `False`.\n\n+   - The number 0 (or 0.0) is false,\
    \ and all other numbers are true.\n+   - An empty list is false, but a list with\
    \ any items in it is true.\n+   - The empty string `\"\"` is false, and all other\
    \ strings are true.\n\nSuppose `cookies_in_stock` is a list of the kinds of cookies\
    \ we have available for purchase.\n\n```\ncookies_in_stock = [\"shortbread\",\

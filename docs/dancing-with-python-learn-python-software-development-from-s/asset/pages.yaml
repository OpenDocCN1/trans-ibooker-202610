  md: '# 5.2.1 Permutations and combinations


    Suppose my daughter grows heirloom tomatoes, and she gives me four plants she
    grew from seed. They are of the varieties V₁, V₂, V₃, and V₄.


    I have space in my garden for only four plants, and I number the locations where
    I can put them L₁, L₂, L₃, and L₄. In how many different ways can I put the four
    plants in the ground?


    We begin with L₁. Since this is the first location, I have my choice of any of
    the four varieties. Once chosen, there are three varieties left to put in L₂.
    I have two options for L₃, and finally, just one for L₄.


    The number of permutations in which I can plant the tomatoes is


    4 × 3 × 2 × 1 = 4! = 24.


    ```

    import math


    math.factorial(4)

    ```


    24


    What if I only have two locations available, L₁ and L₂? Then I have 4 × 3 = 4!
    / (4 − 2)! permutations of plant placements. We use perm to compute the answer.


    ```

    math.perm(4, 2)

    ```


    12


    Figure 5.1 shows the 12 permutations.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_175_0.png)


    Figure 5.1: Permutations of 4 items taken 2 at a time


    # Exercise 5.2


    Verify that this works for four plants and one and three locations.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'In general, if I have *n* objects with no duplicates, and I look at ordered
    sub-collections of *k* objects, I have *n! / k!* permutations.


    For a *combination*, the order doesn’t count. If I have *n* objects with no duplicates,
    and I want to look at unordered sub-collections of *k* objects, I have *n! / (n
    − k)! k!* combinations.


    For four plants and four locations, I have just one combination. I put all four
    plants in the ground, and I don’t care about the sequence.


    ```

    math.comb(4, 4)

    ```


    1


    # Exercise 5.3


    How many combinations would there be if I had five unique varieties and three
    planting locations?


    # Exercise 5.4


    Multiply out the polynomial $(x + 1)^5$ and look at the coefficients. What is
    the relationship between those numbers and values returned by *comb* when the
    first argument is 5?


    # 5.2.2 Factoring


    An integer *n > 0* is *prime* if its only integer factors are 1 and itself. So
    11 is prime, but


    48 = 2 × 2 × 2 × 2 × 3 = 2⁴ 3


    is not. For 48, its prime factors are 2 and 3, and 2 occurs with *multiplicity*
    4.


    In general, any non-zero integer can be factored uniquely into ± 1 times zero
    or more primes. ± 1 are called *units* because they have an absolute value of
    1. The factorization of 0 is just 0.


    # Exercise 5.5


    Factor each of the following: -111; 10,000,000; 1,024; and -210.'

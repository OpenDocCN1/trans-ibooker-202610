    \     \"The exponent for a UniPoly must \"\n        \"be a non-negative int.\"\
    )\n\n# Validate that the indeterminate is an alphabetic\n# string of length 1.\n\
    if (not isinstance(indeterminate, str) or\n    len(indeterminate) != 1 or\n  \
    \  not indeterminate[0].isalpha()):\n    raise ValueError(\n        \"The indeterminate\
    \ for a UniPoly must \"\n        \"be an alphabetic str of length 1.\")\n\nself.coefficient\
    \ = coefficient\nself.indeterminate = indeterminate\nself.exponent = exponent\n\
    \ndef __repr__(self):\n    # create the object representation of the polynomial\n\
    \    return f\"UniPoly({self.coefficient}, \" + \\\n           f\"{repr(self.indeterminate)},\
    \ {self.exponent})\"\n\ndef __str__(self):\n    # create the displayable string\
    \ form of the polynomial\n    return f\"{self.coefficient}*\" + \\\n         \
    \  f\"{self.indeterminate}**{self.exponent}\"\n```\n\nOur initial definition for\
    \ UniPoly begins with the class keyword, followed by the name of the class. The\
    \ first line ends with a colon “:”. I then define three instance methods using\
    \ def.\n\nThese are instance methods because they are functions I define within\
    \ the class that operate upon instances that the class creates. The first parameter\
    \ for each is required, and it is named “self”. self represents the instance to\

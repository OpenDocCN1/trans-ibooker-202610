  md: "The “+” operator concatenates two strings. “Concatenate” is a fancy word meaning\
    \ “stick them together, one after the other.” You can assign the new value to\
    \ the variable or use operator assignment, as I did here.\n\nString concatenation\
    \ is very powerful, allowing you to mix text with other strings and other data\
    \ types.\n\n```\nbrands = [\n    \"Fender\",\n    \"Gibson\",\n    \"Ibanez\"\n\
    ]\n```\n\n```\n\"I own \" + str(len(brands)) + \" brands of guitars\"\n```\n\n\
    ```\n'I own 3 brands of guitars'\n```\n\n# 4.4.1 f-strings\n\nIt’s usually simpler\
    \ and clearer to use an f-string.\n\n```\nf\"I own {len(brands)} brands of guitars\"\
    \n```\n\n```\n'I own 3 brands of guitars'\n```\n\nSometimes you need to format\
    \ data, especially numbers. You can include the formatting details within the\
    \ braces. [PYF]\n\n```\nf\"This is 1/7 to 3 decimal places: {(1/7):.3f}\"\n```\n\
    \n```\n'This is 1/7 to 3 decimal places: 0.143'\n```\n\n```\nf\"This is 1/7 to\
    \ 6 decimal places: {(1/7):.6f}\"\n```\n\n```\n'This is 1/7 to 6 decimal places:\
    \ 0.142857'\n```\n\nFor floating-point scientific notation, use an e or E instead\
    \ of f within the braces.\n\n```\nf\"{(1/7000):.5E}\"\n```\n\n```\n'1.42857E-04'\n\
    ```"

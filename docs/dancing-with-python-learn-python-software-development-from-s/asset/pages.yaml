    −|11⟩


    When we measure this, the result must be |11⟩, subject to any hardware noise.
    So with just one call to the oracle and one inversion about the mean, we find
    the search value with 100% accuracy.


    Exercise 11.20

    Verify that the Grover search algorithm works when we use the oracles for |00⟩,
    |01⟩, and |10⟩.


    While I just showed you that a series of gates on two qubits computes the inversion
    about the mean, who discovered the circuit? The simple answer is a “quantum algorithm
    developer.” [GSA] From qubit idioms to small circuits to algorithmic components,
    we learn and extend our set of techniques for attacking problems.


    # 11.7 Summary


    In this chapter, we looked at classical linear and binary search. In the first
    case, the items in the collection were not ordered initially, and so we were forced
    to look at each item in turn to locate the one we sought. When we could assume
    the items were sorted, the binary search method was much more efficient as we
    could iteratively divide the problem size in half until we got our result. We
    then turned to one of the most accessible quantum algorithms, Grover search. Using
    Grover, the search time became proportional to the square root of the number of
    items.'

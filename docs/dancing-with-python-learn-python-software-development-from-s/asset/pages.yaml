  md: "# 10\n\n# Optimizing and Testing\nYour Code\n\n> *Experience is the name everyone\
    \ gives to their mistakes.*\n> \n> —Oscar Wilde, *Lady Windermere’s Fan*\n\nIt\
    \ would be wonderful if the code we wrote were perfect. It would run in the most\
    \ efficient way possible, and it would perform exactly as we intended from the\
    \ first time. There would not be one unused line or expression. It would execute\
    \ correctly for the standard cases and every bizarre twist our software users\
    \ can throw at us.\n\nIn this chapter, we face reality. Code usually has one or\
    \ more bugs in it at the beginning. Your programming editor, such as Visual Studio\
    \ Code, may help you with the syntax errors, but the semantic ones can be harder\
    \ to find. We first learn about widely used techniques for testing your code,\
    \ from simple sanity checks to organized and repeatable processes. We then look\
    \ at timing how long your code takes to run and then suggestions for improving\
    \ performance. Is all your code being used? We examine the idea of “coverage,”\
    \ where we see if all that code we wrote is being tested and executed. Finally,\
    \ we investigate Python decorators and learn how they can add extra features to\
    \ your functions and methods without modifying the original code."

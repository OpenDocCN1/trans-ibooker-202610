- pgno: 494
  md: "# 12.3.3 NLP with spaCy\n\nTo go beyond characters, words, numbers, whitespace,\
    \ and patterns, we need more sophisticated tools trained on many documents to\
    \ recognize parts of speech, word roots, phrases, structure, names of people and\
    \ locations, and other language features. One such Python tool is spaCy, which\
    \ you install from the command line as the **spacy** package.\n\n```\n```sh\n\
    pip install spacy\npython -m spacy download en_core_web_sm\n```\n```\n\nThis section\
    \ introduces the basic functionality of **spacy**, but I encourage you to read\
    \ the tutorial and documentation to see more examples and the breadth of functionality.\
    \ [SCY]\n\n# Tokenization\n\nWe begin by importing **spacy** and loading the “small\
    \ English database” into the nlp engine.\n\n```\n```python\nimport spacy\n\nnlp\
    \ = spacy.load(\"en_core_web_sm\")\n```\n```\n\nWe now process our document, which\
    \ is the string we have been using for the previous examples. In practice, the\
    \ document might be a paragraph, an article, a book, a web page, a collection\
    \ of social media entries, a customer’s purchase history, chatbot questions, or\
    \ any *corpus* of text we wish to analyze. The result is a sequence of *tokens*:\n\
    \n```\n```python\ndoc = nlp(\"I'm making more fried green tomatoes.\")\n\nprint(\"\
    \ | \".join([token.text for token in doc]))\n```\n```\n\n```\n```text\nI | 'm\
    \ | making | more | fried | green | tomatoes | .\n```\n```\n\nA token is a word\
    \ or word fragment, and *tokenization* is the process of creating tokens.\n\n\
    # Lemmas and parts of speech\n\nIn addition to its contained characters, each\
    \ token in the document includes language properties. Here is a formatted table\
    \ of the document’s tokens and some of their properties:\n\n```\n```python\nfor\
    \ token in doc:\n    print(f\"{token.text:9} {token.lemma_:8} \"\n          f\"\
    {token.pos_:8} {token.dep_:8}\")\n```\n```\n\n| Token | Lemma | POS | Dep |\n\
    |---|---|---|---|\n| I | I | PRON | nsubj |\n| 'm | be | AUX | aux |"

- pgno: 517
  md: 'See how much less memory the array of the integers from 0 to 999 uses compared
    to the list above? The size function returns the number of items in an array.


    ```

    x_values_array.size

    ```


    1000


    Python can compute with arbitrarily large integers, as we saw in section 5.2.
    When we know the integers are bounded in value, we can use a fixed number of bytes
    to contain the numbers. The items size property gets the size used by each item.


    ```

    x_values_array.itemsize

    ```


    4


    This result says each integer value uses 4 bytes. Multiply this by the number
    of items and you get the value of the nbytes property, which is the total number
    of bytes for all the array data.


    ```

    x_values_array.nbytes

    ```


    4000


    # Exercise 13.3


    Why is x_values_array.nbytes different from getsizeof(x_values_array)?


    If you have a list of a tuple of numbers, use array to create an array. NumPy
    forces all numbers in the array to have the same type, which it calls the dtype.


    ```

    np.array([2, 3.4])

    ```


    array([2., 3.4])


    ```

    np.array((-1, 3.1415926j))

    ```


    array([-1.+0.j , 0.+3.1415926j])'

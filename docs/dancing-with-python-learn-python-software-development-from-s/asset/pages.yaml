  md: "# 7.15 Generators\n\nClosely related to an iterator is the Python concept of\
    \ a generator. A generator g is a special function with this behavior:\n\n+  \
    \ - The first time you call g, it initializes itself, passes back a value, and\
    \ freezes its state.\n+   - The next time you call g, it continues processing\
    \ until it passes back a value and then freezes its state again.\n+   - These\
    \ actions continue until the function terminates, and then it returns no additional\
    \ values.\n\nWe use yield to tell Python to pass back a value and freeze everything\
    \ until the next call to the generator.\n\n```\ndef create_odd_number_generator():\n\
    \    n = 1\n    while True:\n        yield n\n        n += 2\n```\n\n```\nodd_number_generator\
    \ = create_odd_number_generator()\nodd_number_generator\n```\n\n<generator object\
    \ create_odd_number_generator at 0x0000024A93102660>\n\n```\nnext(odd_number_generator)\n\
    ```\n\n1\n\n```\nnext(odd_number_generator)\n```\n\n3\n\n```\nnext(odd_number_generator)\n\
    ```\n\n5\n\n```\nfor n in odd_number_generator:\n    print(f\"{n} \", end=\"\"\
    )\n    if n > 20:\n        break\n```\n\n7 9 11 13 15 17 19 21"

  md: '# Exercise 12.3


    What line would you change if you wanted a case-insensitive search? Rewrite my_search
    to take a keyword parameter, case_insensitive=False, and use this option to respect
    letter case or ignore it.


    I now change terminology: instead of “finding a substring,” we are “matching a
    pattern.” In the previous example, the pattern is "ecos". This pattern is an initial
    ''e'', followed by a ''c'', followed by an ''o'', followed by a terminating ''s''.


    If I change “followed by a terminating ''s''” to “followed by a terminating lowercase
    character,” it is more apparent that I am not matching a literal substring. If
    we modify my_search to support this form of pattern matching, either "ecom" or
    "ecos" as the second argument will return the same result.


    We write regular expressions in a definition language that allows us to specify
    both simple and sophisticated patterns with options and conditions. The following
    section begins our discussion of the core features of regular expressions in Python.


    my_search shows the general idea of finding a match to a pattern: move to the
    right until you are at the beginning of a candidate, keep trying to match characters,
    and then either succeed or backtrack to where you last made a choice. Repeat as
    necessary.


    Implementations of regular expressions vary across programming languages and applications.
    Code editors such as Visual Studio Code, vi/vim, Emacs, Sublime Text, TextMate,
    Notepad++, Bluefish, and PyCharm support varying forms of regular expression search
    and replace.


    # 12.2.1 Searching and basic character classes


    A regular expression often contains special characters and backslashes. Here,
    I adopt the convention of writing a pattern as a raw Python string, even if it
    is not strictly necessary. For example, I now write r"ecos" instead of "ecos".


    Given a pattern, we first transform it into a form the re matching engine can
    use by calling compile.


    ```

    import re


    string = "Economic, ecological ecosystem"

    ```'

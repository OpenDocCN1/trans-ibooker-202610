  md: "one_hundred is a function and a first-class Python object. I want to print\
    \ the current time whenever one_hundred runs. I could just change the function:\n\
    \n```\nimport datetime\n\ndef one_hundred():\n    now = datetime.datetime.now()\n\
    \    print(f\"The time is {now.strftime('%H:%M:%S')}\")\n    return 100\n```\n\
    \n```\none_hundred()\n```\n\nThe time is 12:48:28\n100\n\nA decorator simplifies\
    \ this process considerably, and I do not have to alter the original function\
    \ body. I reset one_hundred to its original definition and create say_the_time.\n\
    \n```\ndef one_hundred():\n    return 100\n```\n\n```\ndef say_the_time(func):\n\
    \    def wrapper():\n        now = datetime.datetime.now().strftime(\"%H:%M:%S\"\
    )\n        print(f\"The time is {now}\")\n        return func()\n    return wrapper\n\
    ```\n\nsay_the_time takes a single argument func, which is a function with no\
    \ arguments. It defines an inner function wrapper, which prints the time, evaluates\
    \ func(), and returns the result. say_the_time then returns the function wrapper.\
    \ Let’s see it in action for one_hundred:\n\n```\nh = say_the_time(one_hundred)\n\
    ```\n\n```\nh\n```\n\n<function __main__.say_the_time.<locals>.wrapper()>\n\n\
    ```\nh()\n```\n\nThe time is 12:48:28\n100"

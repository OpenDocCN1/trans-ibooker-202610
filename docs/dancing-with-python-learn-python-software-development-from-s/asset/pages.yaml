  md: '# Optionality and repetition


    What if we want to specify that part of a pattern is optional? Use a question
    mark “?” after the optional part to say that either zero or one occurrence is
    acceptable.


    ```

    print_matches(string, r"c\s?e")

    ```


    <re.Match object; span=(7, 10), match=''c e''>

    <re.Match object; span=(19, 21), match=''ce''>


    Using the question mark in a pattern is shorthand for {0, 1}. {x, y} means, “match
    at least x instance but no more than y.” If you want to match precisely x instances,
    use {x}.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_481_0.png)


    ```

    string = "economic ecosystem bookkeeping center"


    print_matches(string, r"[eko]{2}")

    ```


    <re.Match object; span=(20, 22), match=''oo''>

    <re.Match object; span=(22, 24), match=''kk''>

    <re.Match object; span=(24, 26), match=''ee''>


    # Exercise 12.8


    Why didn’t we match "ok" or "ke"?


    There are two other repetition modifiers we frequently use. The first is “*”,
    which specifies that the re engine should match zero or more instances. Use a
    “+” to match one or more.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_481_1.png)


    ```

    re.compile(r"[cb]o*").findall(string)

    ```


    [ ''co'', ''c'', ''co'', ''boo'', ''c'' ]


    ```

    re.compile(r"[cb]o+").findall(string)

    ```


    [ ''co'', ''co'', ''boo'' ]'

- pgno: 490
  md: '# 12.2.5 Advice for working with regular expressions


    Though I have covered much of the Python implementation of regular expressions,
    there are several additional features and subtleties that you can read about in
    the official documentation. [PYR1] [PYR2] Here are a few points you should remember
    as you start using this powerful and sometimes complicated tool:


    +   - If `str` methods, such as `find` and `replace`, accomplish your task, use
    those instead of bringing in the extra `re` machinery.

    +   - Remember that `search` returns `None` when it does not find a match.

    +   - Keep in mind the size of the string you are searching. You might choose
    a different approach if the text is 50 characters versus 5 megabytes. For example,
    you might use `finditer` instead of `findall` in the latter case.

    +   - Be aware of diminishing returns when you are creating the regular expression
    pattern. For example, you can use `strip` on the strings in the list returned
    by `split`.

    +   - Search the web for regular expressions that may come close to doing what
    you want.

    +   - Regular expression matching can be very slow with badly written patterns.
    Be as specific as you can. Try not to use ".*" instead of \w* if you know you
    are looking for alphanumeric characters, for example. [FIT]

    +   - It’s easy to forget the regular expression syntax and all the special characters.
    Don’t be scared to look them up when you need them.

    +   - When creating a pattern, ask yourself, “should I be using ‘\b’ or ‘\w’ somewhere?”.


    # 12.3 Introduction to Natural Language Processing


    Natural Language Processing (NLP) takes text and its contained characters to meaning.
    From meaning, we get knowledge and insights and possibly take action. This section
    surveys some of the tools available to you in Python to do NLP. Please follow
    the references to find more information and examples about the specific tools.


    Suppose I stand in my kitchen and say,


    “I’m making more fried green tomatoes.”


    How does that translate into my cooking the food?


    The first step is knowing if anyone or anything is listening to me, but that’s
    not a coding issue. Perhaps, my daughter is with me in the kitchen, or a virtual
    personal assistant (VPA) like Apple’s Siri®, Amazon’s Echo® with Alexa®, Google
    Home™, or Microsoft Cortana®.'

  md: 'The *show* function displays the plot.


    ```

    plt.show()

    ```


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_505_0.png)


    The *color* keyword argument sets the color of the point, and you can use "black",
    "blue", "cyan", "green", "magenta", "red", "white", and "yellow". You can also
    use HTML color names like "ForestGreen" or "MediumSlateBlue", or hexadecimal RGB
    color specifications like "#4169E1".


    # Exercise 13.1


    What is the HTML color name corresponding to "#4169E1"?


    The *marker* keyword argument sets the shape of the point. In this example, I
    use "o", which is a filled circle. The **matplotlib.pyplot** module documentation
    lists the 22 marker shapes, including "s" for a square, "*" for a star, and "x"
    for an "x".


    We call all the data and the style information the *figure*. **matplotlib** uses
    many assumptions and default settings when it creates this very bare plot. Let’s
    see how we can begin to customize how the plot looks.'

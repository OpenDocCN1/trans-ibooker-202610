    \ prints whether the point is\n\n+   - at the origin (0, 0)\n+   - on the *x*-axis\
    \ (if *y* = 0)\n+   - on the *y*-axis (if *x* = 0)\n+   - in the first quadrant\
    \ (if *x* and *y* > 0)\n+   - in the second quadrant (if *x* < 0 and *y* > 0)\n\
    +   - in the third quadrant (if *x* < 0 and *y* < 0)\n+   - in the fourth quadrant\
    \ (if *x* > 0 and *y* < 0)\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_428_0.png)\n\
    \nThe implementation is straightforward, and I follow it with some examples:\n\
    \n```\ndef plane_location(x, y):\n    if x == 0:\n        if y == 0:\n       \
    \     message = \"at the origin\"\n        else:\n            message = \"on the\
    \ y-axis\"\n    elif y == 0:\n        message = \"on the x-axis\"\n    elif x\
    \ > 0:\n        if y > 0:\n            message = \"in the first quadrant\"\n \
    \       else:\n            message = \"in the fourth quadrant\"\n    elif y >\
    \ 0:\n        message = \"in the second quadrant\"\n    else:\n```"

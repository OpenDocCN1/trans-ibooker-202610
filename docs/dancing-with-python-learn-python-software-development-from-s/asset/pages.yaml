  md: "# Exercise 12.18\n\nWhat entities does **spacy** recognize in the sentence:\
    \ [C.N.W]\n\n> “American Bill Gates was estimated to be worth $60 billion in 2000.”\n\
    \n# Matching\n\nNow that we know some of what **spacy** can recognize, let’s do\
    \ some matches based on literal text, lemmas, and parts of speech. We begin by\
    \ importing the **Matcher** class.\n\n```\n```python\nfrom spacy.matcher import\
    \ Matcher\n```\n```\n\nMy goal is to create a pattern that can determine whether\
    \ someone in my family is cooking, did cook, or will cook some food. A **spacy**\
    \ pattern is a list of Python dictionaries. From top to bottom, I am looking for\
    \ parts of the document that match these components:\n\n```\n```python\npattern\
    \ = [\n    {\"TEXT\": {\"IN\": [\"I\", \"brother\", \"father\", \"mother\", \"\
    sister\"]}},\n    {\"OP\": \"*\"},\n    {\"POS\": \"VERB\", \"LEMMA\": {\"IN\"\
    : [\"bake\", \"cook\", \"make\"]}},\n    {\"OP\": \"*\"},\n    {\"LEMMA\": {\"\
    IN\": [\"cake\", \"peach\", \"bean\", \"pea\", \"tomato\"]}}\n]\n```\n```\n\n\
    The pattern begins on line 2 with explicit TEXT that can be IN a list of possibilities.\
    \ If I only wish to match \"brother\", I would have coded this as {\"TEXT\": \"\
    brother\"}. You can use ORTH instead of TEXT if you wish to be more linguistic-technical.\n\
    \nOn line 3, I allow zero or more instances of anything via {\"OP\": \"*\"}. This\
    \ form is similar to the regular expression r\".*\".\n\nLine 4 is the most interesting\
    \ so far. It says, “match a verb with the root-form \"bake\", cook, or make.”\n\
    \nI then again allow zero or more arbitrary tokens, and I terminate the pattern\
    \ on line 6 by trying to match one of a list of foods. I use the lemma forms so\
    \ I can match the singular or plural forms of the foods."

  md: 'Generally, you do want to tell when one instance is equal to another, so you
    should implement __eq__. For completeness, I often define __ne__ as well. Python
    uses these for “==” and “!=”, respectively. If __ne__ is missing, Python negates
    the result of __eq__.


    If you plan to sort the list, you need a way to compare items to know which object
    is “less than” another. For the sorted function and the in-place sort method,
    Python looks for __lt__ to implement “<”. If it is not present, you get an error
    message.


    ```

    polys.sort()

    ```


    TypeError: '' < '' not supported between instances

    of ''UniPoly'' and ''UniPoly''


    When working with mathematical objects, you must be careful in mixing algebraic
    meanings of operations with structural interpretations. Mathematically, you cannot
    say when one UniPoly polynomial is less than another. For some subsets such as
    constants, you can decide this, but it does not generally work. Structurally,
    we could compare the polynomials lexicographically by tuples of their exponents
    and coefficients.


    Given


    p = x² + 7x + 1   and   q = 4x² − 7x + 3


    look at the tuples of the highest degree. For p, this is (2, 1), and for q, it
    is (2, 4). If one exponent were smaller, that polynomial would be “less than”
    the other. In this case, the exponents are equal, so we compare the coefficients.
    Since 1 < 4, p is “less than” q. Had they been equal, we would have moved to the
    terms of the next lower degree.


    # Exercise 7.42


    sort and sorted each accept a key optional function argument that returns objects
    the functions use to compare with “<”. Write a method for UniPoly to use with
    key that returns a suitable tuple of tuples.



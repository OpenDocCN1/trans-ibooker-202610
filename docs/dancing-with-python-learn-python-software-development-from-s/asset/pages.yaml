  md: '# Contributors


    # About the author


    **Robert S. Sutor** has been a technical leader and executive in the IT industry
    for over 35 years. More than two decades of that have been spent in IBM Research
    in New York. During his time there, he worked on and led efforts in symbolic mathematical
    computation, mathematical programming languages, optimization, AI, blockchain,
    and quantum computing. He is the author of *Dancing with Qubits: How quantum computing
    works and how it can change the world*, also with Packt. He is the published co-author
    of several research papers and the book *Axiom: The Scientific Computation System*
    with the late Richard D. Jenks.


    Sutor was an IBM executive on the software side of the business in areas including
    Java web application servers, emerging industry standards, software on Linux,
    mobile, and open source. He’s a theoretical mathematician by training, has a Ph.D.
    from Princeton University, and an undergraduate degree from Harvard College. He
    started coding when he was 15 and has used most of the programming languages that
    have come along.


    *I want to thank my wife, Judith Hunter, and children, Katie and William, for
    their love, patience, and humor while this book was being written.*


    *I also want to thank the following for their conversations, insight, and inspiration
    regarding coding, Python, Computer Science, and Quantum Computing: Abe Asfaw,

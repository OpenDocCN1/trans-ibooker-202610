    We use the **matplotlib.pyplot** module, which we always import as `plt`.


    # 13.1.1 Plotting a point


    In its most basic form, the *plot* function takes a point’s *x* coordinate, *y*
    coordinate, and some keyword arguments that state how to display the point.


    ```

    import matplotlib.pyplot as plt


    the_plot = plt.plot(1, 0.5, color="black", marker=''o'')

    ```


    ```


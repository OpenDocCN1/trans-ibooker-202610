- pgno: 443
  md: 'Sorting a collection does not necessarily involve physically moving the items.
    Imagine, for example, that you wanted to “sort” boxes of products in a warehouse.
    You can leave the boxes where they are, but create an index of them. The first
    entry in the index is the location of the box whose product name comes first alphabetically,
    and so on. In this way, you can create multiple indices by which you access the
    products by different characteristics.


    While binary search is a significant improvement, the requirement that the list
    is sorted is substantial. It seems like we are stuck with being O(n) for items
    in arbitrary order. Or are we?


    # 11.2 Quantum searching via Grover


    So how can we do better than looking at every one of n items in an unordered collection?
    If we had ten classical systems, we could divide the collection ten ways and search
    each chunk. This process is still O(n) because the time is still proportional
    to the collection’s size. We would also be adding overhead to parallelize the
    search over multiple systems.


    The remainder of this chapter shows the basic ideas of how the Grover search algorithm
    finds the result in O(√n) time. [GSA] The detailed mathematics of the algorithm
    is well described elsewhere.


    > I cover the Grover search algorithm in sections 9.5 through 9.7 of Dancing with
    Qubits. [DWQ]


    Suppose I have a box of 8 dimmable light bulbs. They are all distinct in some
    way so that I can tell them apart. I number them 0 through 7, or, in binary, 000
    through 111. Even better, I label them with the kets |000⟩ to |111⟩, as we saw
    in section 9.6.5. I start with them each in a half-dimmed state, as shown in Figure
    11.2. This example is an analogy, so the bulbs do not really behave in a quantum
    manner.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_443_0.png)'
  merge: -1
  img_proc: true
- pgno: 444
  md: 'If I use qubit terminology, I say that we have a balanced “dimming” superposition
    of the light bulbs. In this analogy, if a bulb is closer to being fully on, the
    likelihood of my “measuring” it to be fully on is greater than measuring it to
    be off. If it is closer to being fully off, I will more likely measure it to be
    that way.


    Since they are half-dimmed, if I “measure” them using the laws of probability
    to turn them on or off, I expect roughly half of the lights to be on and half
    of them to be off. Figure 11.3 shows this situation.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_444_0.png)


    Figure 11.3: Eight light bulbs, half off, half on


    Before we continue with the dimming, I’m going to drop the light bulbs.


    What?


    If I drop the bulbs sequentially onto the floor one at a time, the process is
    O(n), where n is 8 in this case. If I get eight people to drop one bulb each at
    the same time, distributing the bulbs is O(n), and so the whole process is also
    O(n). If I drop the entire box at once, I am doing something to every bulb simultaneously.
    This is O(1).


    I now have a new box of eight dimmable bulbs. If we can somehow search for a specific
    bulb in a way that does something to the bulbs simultaneously, perhaps I can do
    better than O(n). This is the idea of Grover’s search algorithm. I perform some
    action O(√n) times so that when I “measure” all the bulbs afterward, the brightest
    bulb is the one I seek.


    Suppose I want to find the bulb labeled |000⟩. After one iteration of the action,
    the bulbs look as in Figure 11.4. One bulb is a little brighter, and the other
    seven are dimmer.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_444_1.png)


    Figure 11.4: Eight light bulbs, one getting brighter than the others'

    \ with 0 and 1\n\npotential_primes[0] = 0\npotential_primes[1] = 0\n\np = 2  #\
    \ 2 is prime, so start with that.\n\nwhile p <= n:\n    # If at an index whose\
    \ value in potential_primes\n    # is not 0, it is prime.\n\n    if potential_primes[p]:\n\
    \        i = 2 * p\n\n        # Mark p+p, p+p+p, etc. as not prime.\n        while\
    \ i <= n:\n            if i != p:\n                potential_primes[i] = 0\n \
    \           i += p\n    p += 1\n\n# The only non-zero integers left in potential_primes\n\
    # are primes. Return a list of those.\n\nreturn [prime for prime in potential_primes\
    \ if prime]\n```\n\nWhile you are developing code, use comments together with\

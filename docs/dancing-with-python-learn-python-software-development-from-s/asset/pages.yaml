  md: "We call **X** a bit flip because X(|0⟩) = |1⟩ and X(|1⟩) = |0⟩. It does more\
    \ because quantum states are infinitely more varied than bit states. For example,\n\
    \nX: (√3/2) |0⟩ − (1/2) |1⟩ ↦ (−1/2) |0⟩ + (√3/2) |1⟩.\n\nThe last quantum state\
    \ expression used the exact quantity √3/2. When we convert it to a **float** in\
    \ Python, we get an approximation. Rounding errors will creep in as we use quantum\
    \ gates and circuits.\n\n```\n```python\nimport math\n\na = math.sqrt(3)/2\nb\
    \ = 1/2\n(a, b)\n```\n```\n\n`(0.8660254037844386, 0.5)`\n\n```\n```python\nabs(a)**2\
    \ + abs(b)**2\n```\n```\n\n`0.9999999999999999`\n\nYou will learn to recognize\
    \ several numbers that repeatedly occur in quantum calculations. In particular,\
    \ the **float** and **complex** approximations to ±√2/2 and ±√2/2 i are\n\n```\n\
    ```python\nfor x in (1, -1, 1j, -1j):\n    print(x * math.sqrt(2)/2)\n```\n```\n\
    \n`0.7071067811865476`\n\n`-0.7071067811865476`\n\n`0.7071067811865476j`\n\n`-0.7071067811865476j`\n\
    \nIn the literature, you may sometimes see √2/2 written as the equivalent 1/√2.\n\
    \n![](img/4ffeafa3e3f1373f02971e43b0755ea6_378_0.png)\n\n# The Z quantum gate\n\
    \nThe **Z** gate changes the sign of the amplitude of |1⟩.\n\nZ: a |0⟩ + b |1⟩\
    \ ↦ a |0⟩ − b |1⟩\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_378_1.png)\n\nWe\
    \ call **Z** a *phase flip* for reasons coming from the physics of quantum mechanics."

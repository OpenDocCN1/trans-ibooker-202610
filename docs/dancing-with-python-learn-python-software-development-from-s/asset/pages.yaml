  md: "The number 17 is not in the list.\n\n```\nfind_number(17, numbers)\n```\n\n\
    (None, 16)\n\nCan we do better if we sort the list?\n\n```\nnumbers.sort()\nnumbers\n\
    ```\n\n[2, 4, 5, 15, 16, 20, 22, 24, 30, 32, 34, 36, 40, 46, 49, 50]\n\nIn the\
    \ next version of find_number, we stop searching when the number in the list is\
    \ greater than the search value. We use both \"==\" and \"<\".\n\n```\ndef find_number(n,\
    \ list_of_numbers):\n    # list_of_numbers must be sorted in ascending order\n\

- pgno: 440
  md: "We are not taking full advantage of the list being sorted. Our next version\
    \ of find_number takes a divide-and-conquer binary search approach.\n\n+   1.\
    \ Look at the value in the “middle of the list.” If it is the number we seek,\
    \ we are finished.\n+   2. If the list has length one, the number is not in the\
    \ list, so we return None.\n+   3. If our number is less than the value, go to\
    \ step 1 but only consider the first half of the list.\n+   4. If our number is\
    \ greater than the value, go to step 1 but only consider the second half of the\
    \ list.\n\nIn this way, we repeatedly cut the size of the list we search in half,\
    \ hence the name “binary search.”\n\n```\ndef find_number(n, list_of_numbers):\n\
    \    \"\"\"Returns index of found number via binary search or None\n\n    Parameters\n\
    \    ----------\n    n : `int` or `float` or `Fraction`\n        The number we\
    \ seek.\n    list_of_numbers: `list`\n        Sorted list of numbers.\n\n    Returns\n\
    \    -------\n    `int` or None\n        The index of n in list_of_numbers if\
    \ found,\n        None otherwise.\n    \"\"\"\n\ndef print_num(j):\n    # Utility\
    \ function to display search progress\n    if j is not None:\n        print(f\"\
    -> {list_of_numbers[j]}\", end=' ')\n    else:\n        print(\"-> None\", end='\
    \ ')\n\ndef binary_find(start, end, count):\n    # Recursive binary search\n \
    \   # start and end are list indices, count is the\n    # number of times this\
    \ function is called.\n\n    count += 1\n\n    # Handle the case when the list\
    \ has one item.\n    if start + 1 == end:\n        if n == list_of_numbers[start]:\n\
    \            print_num(start)\n```"

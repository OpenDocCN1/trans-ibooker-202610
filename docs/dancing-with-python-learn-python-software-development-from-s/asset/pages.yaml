  md: "# 7.10.8 Objects as functions\n\nAt the beginning of this chapter, I showed\
    \ how we could think of polynomials as mathematical functions. We implement function\
    \ behavior for instances with `__call__`.\n\n```\n```python\ndef __call__(self,\
    \ x):\n    \"\"\"Evaluates a polynomial by substituting `x` for the indeterminate.\n\
    \n    Python calls this when it sees a polynomial being used\n    in function\
    \ application. If `p` is a polynomial, then\n    `p(3.4)` substitutes 3.4 for\
    \ the indeterminate and\n    does the math as expressed by the polynomial.\n\n\
    \    Parameters\n    ----------\n    x : any object that supports -, +, *, **\n\
    \        The value to be substituted for the indeterminate.\n\n    Returns\n \
    \   -------\n    Probably `type(x)`\n    \"\"\"\n    result = 0\n\n    for exponent,\
    \ coefficient in self.__terms.items():\n        result += coefficient * x**exponent\n\
    \n    return result\n```\n```\n\nNow we define a polynomial and show that it produces\

  md: '# 2.4.1 Naming rules


    The rules for identifiers and naming variables are simple:


    +   1. You may use an uppercase letter A-Z in any part of the name.

    +   2. You may use a lowercase letter a-z in any part of the name.

    +   3. You may use an underscore "_" in any part of the name.

    +   4. You may use a digit 0-9 in any part of the name, except in the first position.


    The name revenue_2021 is valid, but 2021_revenue is not. Python has conventions
    for using the variable name "_" and names that start or end with an underscore.
    We’ll see them when we discuss function parameters in section 6.3 and methods
    in classes in section 7.2.


    # 2.4.2 List unpacking


    Let’s look at one kind of expression where you take apart a list and assign the
    pieces to variables. The assignment


    ```

    robins_age, roberts_age, robertas_age = ages

    ```


    gives the first value to robins_age


    ```

    robins_age

    ```


    12


    and the others to roberts_age and robertas_age.


    ```

    roberts_age

    ```


    16


    ```

    robertas_age

    ```


    19


    This example shows list unpacking, and we discuss it in detail in section 3.2.9.


    # 2.4.3 Multiple assignments


    We can combine several assignments into a single statement.


    ```

    a = b = 10

    a

    ```


    10'

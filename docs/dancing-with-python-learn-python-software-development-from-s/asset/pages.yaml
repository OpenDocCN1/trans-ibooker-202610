- pgno: 584
  md: 'What do we do with these rows?


    +   - We could go to the data provider and see if we can get correct values that
    are either F or M. This action might be easy, hard, or impossible.

    +   - We could delete the rows. This is simple but could throw off the statistical
    analysis elsewhere. What if one of these rows corresponded to a unique cat of
    a given breed or colour? What if it was for the lone cat that lives in a locality
    or postcode area?

    +   - We could replace the fields with values that maintain the statistical distribution
    of the entire column. There is roughly the same number of female cats as male
    cats, so we could randomly assign three of the cats F and three of the cats M.

    +   - We could replace the fields with values that maintain the distribution within
    locality, postcode, breed, or colour. Which do we choose? See section 14.8 for
    an interesting case connecting gender and colour.


    Whatever you do, write it down, and be sure to note all changes to the original
    dataset in any exercise, paper, study, or report you write. Failure to do so will
    bring into doubt your results and your reputation. Editors of prestigious journals
    have withdrawn previously published papers when subsequent analysis showed that
    the authors ignored or modified significant data.


    Suppose we find out that the gender of that cat in the row with the index 611
    should be F. We change it using iloc on the left of an assignment:


    ```

    df.loc[611, ["Gender"]] = ''F''


    df[df["Gender"] == "U"]

    ```



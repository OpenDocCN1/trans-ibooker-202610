  md: 'I cover the √NOT gate in section 7.6.12 of Dancing with Qubits. [D.W.Q]


    # 9.7 Quantum circuits


    We have now seen all the quantum gates we will need in this book, and it’s time
    to compose them into circuits.


    The goal of a quantum algorithm as implemented in a circuit is to manipulate the
    qubits’ states so that the 0s and 1s we get when we measure have a very high probability
    of being the correct answer.


    # 9.7.1 A basic circuit


    I’ve done this already in simple cases, but let’s see what a basic circuit looks
    like from beginning to end.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_393_0.png)


    Figure 9.12: A basic quantum circuit


    The circuit in Figure 9.12 contains a quantum register with one qubit. The initialization
    phase is to the left of the first vertical dotted line. In this phase, we initialize
    qubit q0 to |0⟩. If we do not explicitly display |0⟩, you may assume that the
    qubit starts in that state. We call the horizontal line a wire.


    Between the first and second dotted lines, we apply gates to qubits. From the
    second to the third lines, we measure the qubits. Afterward, we see if each measurement
    yields |0⟩ or |1⟩, which we interpret as the bits 0 or 1.


    When quantum computers were first made available on the cloud by IBM in 2016,
    you could only put measurement at the end of a circuit. You can now measure mid-circuit
    and continue in the circuit with the |0⟩ or |1⟩ you saw.


    The second operation is a reset and forces the quantum state to |0⟩. It is not
    a gate, and it is not reversible. Nevertheless, it is a useful feature that allows
    you to reuse ancillary or “scratch” qubits in algorithms. We draw the reset operation
    as shown on the right.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_393_1.png)'

  md: 'Finally, you can always precede a single quote or double quote within a string
    with a backslash. You then don’t need to worry about which delimiters you use.
    We call using a backslash this way “escaping a character.”


    ```

    ''I\''ll use a backslash in front of my single quote.''

    ```


    ```

    "I''ll use a backslash in front of my single quote."

    ```


    The type of a string is **str**. We’ll see additional rules for using quotes,
    both for strings (section 4.1) and the descriptions you add to your code (section
    7.8).


    # 2.3 Lists


    If we could only write down numbers and strings, Python would not be a practical
    programming environment. Of course, we want to do things to numbers such as add
    them, multiply them, and use them to count things. For strings, we’d like to search
    and construct text we display to our users.


    More than that, we need ways to hold collections of data together. If I had three
    children, I could hold their ages together as a list:


    ```

    [12, 16, 19]

    ```


    ```

    [12, 16, 19]

    ```


    and use another list for their names:


    ```

    ["Robin", "Robert", "Roberta"]

    ```


    ```

    [''Robin'', ''Robert'', ''Roberta'']

    ```


    I could put the names and ages in the same list:


    ```

    ["Robin", 12, "Robert", 16, "Roberta", 19]

    ```


    ```

    [''Robin'', 12, ''Robert'', 16, ''Roberta'', 19]

    ```


    Square brackets “[” and “]” delimit the items of the list. Python uses the type
    **list** for lists.


    It’s awkward to keep repeating the data like this. Using a variable is a better
    way of referencing and using the information.'

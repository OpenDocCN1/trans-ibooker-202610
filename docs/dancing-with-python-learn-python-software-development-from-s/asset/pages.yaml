  md: "A successful match always has at least one group, and it is group number 0,\
    \ the entire match. That's why my earlier definition of print_match takes a default\
    \ value for the group_number argument:\n\n```\ndef print_match(result, group_number=0):\n\
    \    if result is not None:\n        # Display the matched substring\n       \
    \ print(f\"group({group_number}) = \"\n              f'{result.group(group_number)}'\
    \ , end=\"\")\n\n        # Display the starting index and index after end of match\n\
    \        print(f\"start({group_number}) = {result.start(group_number)}  \"\n \
    \             f\"end({group_number}) = {result.end(group_number)}\")\n    else:\n\
    \        print(None)\n```\n\nSince I put explicit groups in the pattern with parentheses,\
    \ I can access them as well, starting with number 1:\n\n```\nfor g in range(1,\
    \ 4):\n    print_match(result, g)\n```\n\ngroup(1) = Robert\"  start(1) = 11 \
    \ end(1) = 17\ngroup(2) = S\"  start(2) = 18  end(2) = 19\ngroup(3) = Sutor\"\
    \  start(3) = 21  end(3) = 26\n\nUse len on the value returned from the groups\
    \ method to find out how many groups were matched.\n\n```\nlen(result.groups())\n\
    ```\n\n# Exercise 12.11\n\nDefine a function number_of_groups that returns the\
    \ obvious value whether a search is successful or not."

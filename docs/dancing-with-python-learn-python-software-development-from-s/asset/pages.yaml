  md: "```\nhash((4, 3, 2, 1))\n```\n\n1111739957947434390\n\n__hash__ must return\
    \ an integer, and your implementation must adhere to one rule: if a == b for instances\
    \ a and b, then hash(a) == hash(b). Ideally, the opposite is true, but that does\
    \ not need to be the case.\n\nYour __hash__ method should be non-trivial. Don’t,\
    \ for example, always return 0. A common method that coders use is to make a tuple\
    \ of the instance variables and then call hash on that. You could also sum the\
    \ hash values for the instance variables.\n\nThe full and final code for UniPoly\
    \ is in Appendix C, and it creates immutable instances. I define __hash__ in this\
    \ way:\n\n```\ndef __hash__(self):\n    \"\"\"Computes a hash code for a polynomial.\n\
    \n    If p and q are equal polynomials, then their hash codes\n    are equal.\n\
    \n    Returns\n    ------\n    int\n        An integer hash code.\n    \"\"\"\n\
    \    h = hash(self.__indeterminate)\n    for exponent_coefficient in self.__terms:\n\
    \        h += hash(exponent_coefficient)\n    return h\n```\n\n```\nhash(UniPoly(10,\
    \ 'z', 100))\n```\n\n-483907656708034775\n\n```\nhash(UniPoly(10, 'w', 100))\n\

- pgno: 675
  md: 'I think **Real Python** at


    `https://realpython.com/`


    has consistently helpful and comprehensive articles about most aspects of coding
    with Python. You can only see so many articles at no charge before they ask you
    to join and pay. (I have no commercial relationship with them.)


    The Python Tutorial at **W3Schools**


    `https://www.w3schools.com/python/`


    is a great place to find Python examples. These might remind you of syntax or
    the functions or methods that accomplish a particular task.


    I recommend you visit and use the websites for four of the major Python packages
    we used in this book: **matplotlib**, **numpy**, **pandas**, and **sklearn**:


    `https://matplotlib.org/`

    `https://numpy.org/`

    `https://pandas.pydata.org/`

    `https://sklearn.org/`


    # B.4 Asking questions and getting answers


    When you do a web search about how to do something in Python, there is an excellent
    chance you will end up at **Stack Overflow**:


    `https://stackoverflow.com/questions/tagged/python`


    You will see questions and answers to straightforward and challenging problems.
    If you sign in and participate, over time, you can up-vote and down-vote questions
    and answers. Many answers are helpful, but some are incorrect or posted by non-experts.
    In any case, you will likely find some code that you can use or modify for your
    project.


    You can learn a lot by browsing the questions people ask, even if you don’t have
    an immediate need for the code. You will learn what others are doing with Python.
    You can ask your own questions but **always** do a thorough web search first.
    It is frustrating to experts if you do not respect their time by doing your basic
    research first.'

- pgno: 659
  md: 'After displaying version information, Python displays a “>>>” prompt. I enter
    the first command: 2 + 3.


    +   - Python *reads* 2 + 3 and *parses* it into an internal data structure it
    can manipulate.

    +   - It then determines that it must *evaluate* the expression by applying “+”
    to **int** 2 and **int** 3. It does so and produces the result 5.

    +   - Since the result is not None, Python prints 5.

    +   - It then displays another “>>>” and waits for input.


    The next expression is import math. Python reads and evaluates this code and loads
    the **math** module into your workspace. It produces no output.


    The input in Figure A.1 is a list comprehension, and Python shows the computed
    result.


    The final expression raises a **ZeroDivisionError** exception. Python shows the
    traceback to the code that caused the problem.


    The Python interpreter has limited editing capabilities. You can use the keyboard
    arrow keys to move backward and forward in what you type, and you can delete and
    enter characters. Cut-and-paste also works. For more sophisticated editing and
    to work with files, you need a more sophisticated Python environment.



  md: "We define and use a *callback function* when we want to be notified when something\
    \ happens in another function. For example, we might pass the callback to a function\
    \ containing a conditional test. That function invokes the callback when the test\
    \ evaluates to True. The keyword argument for the callback usually has a None\
    \ default value.\n\nWhen **spacy** finds a match, it creates a tuple of an internal\
    \ identifier for the rule that matched, the starting token index, and the index\
    \ after the ending token. We code the callback function *on_match* to print the\
    \ document part that matches:\n\n```\n```python\ndef on_match(matcher, doc, id,\
    \ matches):\n    # Callback function for matcher\n    # Show the span of text\
    \ that we matched\n    for id, start, end in matches:\n        print(doc[start:end])\n\
    ```\n```\n\nIn your work, you may want to display more information, such as the\
    \ parts of speech. Now we build a matcher object and add the pattern to it. The\
    \ first argument to *add* is a name for a list of patterns, and the second is\
    \ that list. I also pass in *on_match*.\n\n```\n```python\nmatcher = Matcher(nlp.vocab)\n\
    matcher.add(\"Cooking\", [pattern], on_match=on_match)\n```\n```\n\nNow we see\
    \ what **spacy** yields for three sentences about family cooking:\n\n```\n```python\n\
    doc = nlp(\"I'm making more fried green tomatoes.\")\nmatches = matcher(doc)\n\
    ```\n```\n\n```\n```text\nI'm making more fried green tomatoes\n```\n```\n\n```\n\
    ```python\nmatches = matcher(nlp(\"My sister cooked peas.\"))\n```\n```\n\n```\n\
    ```text\nsister cooked peas\n```\n```\n\n```\n```python\nmatches = matcher(nlp(\"\
    My father will bake three cakes.\"))\n```\n```\n\n```\n```text\nfather will bake\
    \ three cakes\n```\n```\n\nSince I no longer need the \"Cooking\" list of patterns,\
    \ I remove it from the matcher.\n\n```\n```python\nmatcher.remove(\"Cooking\"\
    )\n```\n```\n\nI could just as quickly have created a new matcher with no rules\
    \ since there was only one rule in the set."

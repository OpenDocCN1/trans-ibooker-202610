    # Exercise 9.44


    Which of |11⟩, |01⟩, |00⟩, and |10⟩ produce each of the four Bell states?


    We use entanglement in many places in quantum computing, including algorithms
    where you might otherwise have made copies of data. Einstein did not initially
    believe in entanglement and called it “spooky action at a distance.” Entangled
    quantum particles maintain their correlation over large, sometimes astronomical,
    distances.


    Entanglement ties together different parts of a quantum system so that you cannot
    learn about all the information contained within it by looking at individual components.
    Professor John Preskill compares this to having to read a section of a book all
    at once to understand its content rather than reading it page by page. [QEF]


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_409_2.png)


    I cover qubit entanglement in section 8.2 of Dancing with Qubits. [DWQ]'

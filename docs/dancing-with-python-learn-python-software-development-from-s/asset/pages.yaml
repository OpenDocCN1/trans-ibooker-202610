  md: "# # The Complete UniPoly Class\n\nThis appendix contains the complete and final\
    \ definition of the **UniPoly** class for univariate polynomials that we developed\
    \ in *Chapter 7, Organizing Objects into Classes*.\n\n```\n```python\n\"\"\"The\
    \ unipoly module contains the UniPoly class for polynomials.\n\"\"\"\n\n# The\
    \ next line is for the spell-checker in Visual Studio Code\n# cspell:ignore radd\
    \ rsub rmul\n\nclass UniPoly:\n    \"\"\"Polynomial with one variable and integer\
    \ coefficients.\n\n    UniPoly creates a univariate polynomial with a single term\n\
    \    and an integer coefficient. Polynomials may use different\n    variables,\
    \ here called 'indeterminates', but their names\n    must each be a single alphabetic\
    \ character. These polynomials\n    are immutable.\n\n    Parameters\n    ----------\n\
    \    coefficient : int, optional\n        The coefficient of the term. Default\
    \ value is 1.\n    indeterminate : str, optional\n        The \"variable.\" Must\
    \ be a single alphabetic character.\n        Default value is 'x'.\n    exponent\
    \ : int, optional\n```\n```"
  merge: -1
  img_proc: true

- pgno: 346
  md: '# Working with Files


    We open a file to start using it and close it when we are finished. When we open
    the file, we tell Python the access mode we need. The modes are:


    +   - **r** – open as a text file to read from it. This is the default mode.

    +   - **rb** – open as a binary file to read from it.

    +   - **w** – open as a text file to write to it.

    +   - **wb** – open as a binary file to write to it.

    +   - **r+** – open as a text file to read from and write to it.

    +   - **rb+** – open as a binary file to read from and write to it.


    We begin working at the beginning of the file when using the preceding modes.


    If you open a file in the following modes, Python will position you at the end
    of the file’s contents.


    +   - **a** – open as a text file to append to it.

    +   - **ab** – open as a binary file to append to it.

    +   - **a+** – open as a text file to read from and append to it.

    +   - **ab+** – open as a binary file to read from and append to it.


    Python creates a new file for the modes that write or append if the specified
    file does not already exist. I mostly work with text files, so I frequently use
    **w** and **r**, and occasionally **a**.



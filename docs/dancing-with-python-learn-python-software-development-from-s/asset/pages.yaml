  md: "One of the most popular Python documentation conventions is part of the *Google\
    \ Python Style Guide.* [GSG, Section 3.8] To add lightweight markup for formatting,\
    \ many coders use “reStructuredText” within their docstrings. [RST] The NumPy\
    \ and SciPy package developers combined and tweaked these into the “numpydoc docstring\
    \ guide.” I use their conventions from this point forward in this book. [NDG]\n\
    \n# 7.8.1 Structure\n\nFor a function or method, the documentation consists of\
    \ a brief one-line description, an optional longer multi-line description, and\
    \ several sections with headings like\n\n+   - **Parameters**\n+   - **Raises**\n\
    +   - **Yields**\n+   - **Notes**\n+   - **Examples**\n+   - **References**\n\
    +   - **Returns**\n\nEach heading is “underlined” with dashes.\n\nAs we saw in\
    \ section 7.4.2, __bool__ implements the behavior of “falseness” for polynomials\
    \ equal to zero. It needs minimal documentation: a brief functional description\
    \ and the statement of what it returns.\n\n```\ndef __bool__(self):\n    \"\"\"\
    Returns True if the polynomial is non-zero, False otherwise.\n\n    Returns\n\
    \    ------\n    bool\n    \"\"\"\n\n    return bool(self.__terms)\n```"

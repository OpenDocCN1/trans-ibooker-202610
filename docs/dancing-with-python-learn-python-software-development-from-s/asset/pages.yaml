- pgno: 361
  md: 'We have gates and circuits within the hardware and the software layers. These
    are the most primitive operations, and we make compositions of them into useful
    processes.


    Assembly languages allow us to code gates into custom circuits. They let us control
    the underlying hardware and, in the classical case, access and use system memory.
    OpenQASM3 is an example of a quantum computing assembly language developed by
    IBM and others.


    Coders and researchers have created dozens of high-level programming languages
    above classical computing assembly languages. These include Python, C, C++, Swift,
    Java, JavaScript, PHP, Go, Rust, and R. Should we develop a new language for quantum
    computing or take advantage of existing languages?


    Though it may seem geeky, it is fun to write new languages. It’s less fun to support
    them and convince thousands of programmers to learn yet another way of creating
    code. With qiskit, you take everything you know from Python and use the open source
    code developed by hundreds of quantum experts. That is the approach we take in
    this book.


    With this hardware and software foundation, we design and implement algorithms.
    Domain-expert model developers create the computational building blocks for solutions
    and applications using algorithms. From there, we construct apps for consumers
    and workflows for industry use cases.


    Classical software development is decades ahead of its quantum counterpart. In
    the next section, I show how to code higher-level functions such as addition using
    logic gates and circuits. In Python and other languages, addition itself is low-level
    compared to other language features and the code in thousands of libraries. Nevertheless,
    we can then analogously examine quantum gates and circuits and begin our trek
    toward algorithms.


    # 9.2 Boolean operations and bit logic gates


    As we saw in section 2.5, there is a direct correspondence between Booleans and
    bits, equating True to 1 and False to 0. I first learned about Booleans and their
    operations in a logic course in my college Philosophy department. [MQL] You can
    also take a mathematical approach and look at Boolean algebra. Bits and circuits
    are fundamental to electrical engineering and computer science. Perceived distinctions
    among these approaches can be misleading because we talk about the same ideas
    using different words.


    In this section, I work with bits and use their associated gate language.'

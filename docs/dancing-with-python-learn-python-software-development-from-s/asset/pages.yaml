  md: "The instance variable names start with an underscore, and this indicates to\
    \ us that the variables should only be used privately by other coders within this\
    \ and any derived classes. Python does not enforce this, but it is a convention.\n\
    \n# 7.13.1 Parent and child classes\n\n**Guitar** is a standalone class, but if\
    \ we look at the brand, model, and build year attributes, they could apply to\
    \ any commercial musical instrument. So let’s define **MusicalInstrument**:\n\n\
    ```\nclass MusicalInstrument:\n    def __init__(self, brand, model, year_built):\n\
    \        self._brand = brand\n        self._model = model\n        self._year_built\
    \ = year_built\n\n    def __str__(self):\n        return f\"{self._year_built}\
    \ \" \\\n            + f\"{self._brand} {self._model}\"\n```\n\nIn **MusicalInstrument**,\
    \ we have\n\n+   - instance methods __init__ and __str__, and\n+   - instance\
    \ variables _brand, _model, and _year_built.\n\nNow we derive **Guitar** from\
    \ **MusicalInstrument**.\n\n```\nclass Guitar(MusicalInstrument):\n    def __init__(self,\
    \ brand, model, year_built, strings=6):\n        super().__init__(brand, model,\
    \ year_built)\n        self._strings = strings\n\n    def __str__(self):\n   \
    \     return f\"{self._strings}-string \" \\\n            + super().__str__()\n\
    ```\n\n**Guitar** adds the instance variable _strings."

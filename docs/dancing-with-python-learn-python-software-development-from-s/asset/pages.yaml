- pgno: 278
  md: '# 7.6 Naming conventions and encapsulation


    In section 6.3, we covered naming conventions for functions. Let’s complete the
    story for classes and their contents.


    Although many built-in classes like int and float have lowercase names, your class
    names should begin with a capital letter. If the name has multiple “words”, start
    those with capital letters as well. Don’t use underscores. Examples are BreadRecipe,
    ElectricGuitar, and Matrix.


    Instance variables should follow the same naming conventions as other variables,
    and methods should follow the conventions for functions. All letters should be
    lowercase, and you may use underscores.


    End a name with an underscore to avoid confusion with a Python keyword.


    ```

    class_ = "Quantum Computing 101"

    class_


    ''Quantum Computing 101''

    ```


    Magic methods (section 7.4) begin and end with two underscores.


    Python does not thoroughly enforce hiding methods and variables from outside the
    class. Begin a name with an underscore to tell others and remind yourself that
    the variable or method is “private” to the class. For example, you may have a
    helper method called only by other instance methods.


    If you start a name with two underscores and end it with no more than one underscore,
    Python “mangles” the name to make it hard for you to access outside the class.
    Of course, you can look up how Python does the mangling and then get to the variable
    or methods. Behave yourself and don’t do this! We say that a method or variable
    that does not start with an underscore is public.


    If you are familiar with C++, Python has no corresponding public, private, and
    protected concepts or keywords.


    Defining a class with contained data and methods, along with some way of limiting
    access to them, is called encapsulation. Think of it as putting a protective “capsule”
    around your class and its instances. Python’s capsules are relatively porous compared
    to the C++, Java, and PHP programming languages.


    Encapsulation helps hide your class data and implementation from its users. As
    the class author, this allows you to change the representations and implementations
    without breaking code that relies on your code’s functionality. As a class user,
    do not reach into the class and use variables that start with an underscore, “_”.'

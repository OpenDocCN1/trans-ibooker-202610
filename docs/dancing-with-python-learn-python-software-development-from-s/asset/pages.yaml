  md: "# Searching and Changing Text\n\nWith replace, I would have needed to match\
    \ against a specific phone number. With the regular expression, I can match against\
    \ anything that looks like a phone number.\n\nFor privacy reasons, I might want\
    \ to mask the number with asterisks. This substitution will do that:\n\n```\n\
    ```python\npattern.sub(\"***-***-****\", string)\n```\n```\n\n`'My phone number\
    \ is ***-***-****.'`\n\nI can use a back-reference to a group to modify the general\
    \ text that the engine matched. Here, I am adding a US country code:\n\n```\n\
    ```python\npattern.sub(r\"+1-1\", string)\n```\n```\n\n`'My phone number is +1-914-555-1234.'`\n\
    \nBy default, `sub` works on all non-overlapping matches. If you give it a third\
    \ positive `int` argument, it will perform at most that many substitutions. The\
    \ default value for this argument is 0, which means “make all substitutions.”\n\
    \n```\n```python\nstring = \"212-555-0123    585-555-9876    320-555-3467\"\n\
    pattern.sub(\"***-***-****\", string)\n```\n```\n\n`'***-***-****    ***-***-****\
    \    ***-***-****'`\n\n```\n```python\npattern.sub(r\"+1-1\", string, 2)\n```\n\
    ```\n\n`'+1-212-555-0123    +1-585-555-9876    320-555-3467'`\n\nThe *subn* function\
    \ returns the new string in a tuple with the number of substitutions performed.\n\
    \n```\n```python\nstring = \"212-555-0123    185-555-9876    320-555-3467\"\n\
    pattern.subn(\"***-***-****\", string)\n```\n```\n\n`('***-***-****    185-555-9876\
    \    ***-***-****', 2)`\n\n> **Exercise 12.13**\n> \n> Why were there two substitutions\
    \ and not three?"

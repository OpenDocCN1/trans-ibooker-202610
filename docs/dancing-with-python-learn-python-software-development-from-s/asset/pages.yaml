    # 9.1 The software stack


    Software runs on hardware, and you use both to build applications and solve problems.
    This is true whether you are working entirely on a laptop or access computing
    resources on the cloud. Software is not monolithic. It begins with a layer very
    close to the hardware. On top of that, we implement abstractions and higher-level
    features to make it easier to code and develop solutions.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_360_0.png)


    Figure 9.1: Classical and quantum software stack'

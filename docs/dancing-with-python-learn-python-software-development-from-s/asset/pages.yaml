  md: "# Topics covered in this chapter\n\n+   10.1 Testing your code  384\n+   10.2\
    \ Timing how long your code takes to run  391\n+   10.3 Optimizing your code \
    \ 393\n+   10.4 Looking for orphan code  400\n+   10.5 Defining and using decorators\
    \  403\n+   10.6 Summary  408\n\n# 10.1 Testing your code\n\nThe code you write\

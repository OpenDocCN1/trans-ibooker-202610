    # Whitespace characters


    A whitespace character is a space " ", tab \t, newline \n, carriage return \r,
    form feed \f, or vertical tab \v. The last two are historic control characters
    for printers.


    To match a specific whitespace character, use a space or one of these escape characters
    in a pattern. To match any whitespace character, use \s. For anything that is
    not whitespace, use \S.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_480_0.png)



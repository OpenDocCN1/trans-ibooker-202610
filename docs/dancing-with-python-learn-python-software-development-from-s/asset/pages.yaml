  md: "To get the key-value pairs as tuples, use *items*.\n\n```\nfor model, year\
    \ in guitars.items():\n    print(f\"The {model} was introduced in {year}\")\n\n\
    The Fender Stratocaster was introduced in 1954\nThe Fender Telecaster was introduced\
    \ in 1950\nThe Gibson Les Paul was introduced in 1952\nThe Gibson Flying V was\
    \ introduced in 1958\nThe Ibanez RG was introduced in 1987\n```\n\nThe dictionary\
    \ and its keys are ordered in the sequence in which the key-value pairs are added.\
    \ This is different from the previous behavior where the order was random and\
    \ unspecified. If you are writing code that may be run on older versions of Python,\
    \ you should not depend on the order being consistent.\n\nI’ve found that *sorted*\
    \ and *reversed* are useful functions for working with dictionaries. Here I use\
    \ them both:\n\n```\nfor model in reversed(sorted(guitars)): print(model)\n\n\
    Ibanez RG\nGibson Les Paul\nGibson Flying V\nFender Telecaster\nFender Stratocaster\n\
    ```\n\n# 3.9.8 Adding items to a dictionary\n\nUse the dictionary square-bracket\
    \ syntax on the left-hand side of an assignment to add key-value pairs.\n\n```\n\
    numbers = {1: \"one\", 2: \"two\"}\n\nnumbers[3] = \"three\"\n\nnumbers\n\n{1:\
    \ 'one', 2: 'two', 3: 'three'}\n```"

  md: '# 3.9.6 Accessing items in a dictionary, again


    The get method for dictionaries returns the value for a key or returns None if
    the key is not valid.


    ```

    guitars.get("Gibson Les Paul")

    ```


    1952


    ```

    guitars.get("Martin BC-16E") is None

    ```


    True


    You can state what should be returned for an invalid key via a second argument
    to get. None is the default value for this second argument. In our example dictionary,
    the values are the years in which the guitar models were introduced.


    ```

    guitars.get("Martin BC-16E", "Sometime in the 20th century")

    ```


    ''Sometime in the 20th century''


    # 3.9.7 Iterating over items in a dictionary


    If you iterate across a dictionary using a for loop, you get the keys. In our
    example, either guitars or guitars.keys() works.


    ```

    for model in guitars: print(model)

    ```


    Fender Stratocaster

    Fender Telecaster

    Gibson Les Paul

    Gibson Flying V

    Ibanez RG


    You can also get the values:


    ```

    for year in guitars.values(): print(year)

    ```


    1954

    1950

    1952

    1958

    1987'

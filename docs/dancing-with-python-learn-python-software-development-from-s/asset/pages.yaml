  md: "```\nnot indeterminate[0].isalpha():\n    raise ValueError(\n        \"The\
    \ indeterminate for a UniPoly must \"\n        \"be an alphabetic str of length\
    \ 1.\")\n\nself.__indeterminate = indeterminate\n\nif coefficient != 0:\n    self.__terms\
    \ = {exponent: coefficient}\nelse:\n    self.__terms = dict()\n\n# ----------------------------------------------------------------------------\n\
    # Magic methods\n# ----------------------------------------------------------------------------\n\
    \ndef __add__(self, other):\n    \"\"\"Adds a polynomial to a polynomial or an\
    \ integer.\n\n    Parameters\n    ----------\n    other : :class:`UniPoly` or\
    \ int\n        A polynomial or integer.\n\n    Notes\n    -----\n    If the second\
    \ argument is not a polynomial or integer,\n    or if the indeterminates in non-constant\
    \ polynomials\n    are different, returns NotImplemented.\n\n    Returns\n   \
    \ -------\n    :class:`UniPoly` or NotImplemented\n        The sum of self and\
    \ other, or NotImplemented.\n    \"\"\"\n\n    if not self.__terms:\n        return\
    \ other\n\n    # if other is an integer, create a constant polynomial\n    if\
    \ isinstance(other, int):\n        other = UniPoly(other, self.__indeterminate,\
    \ 0)\n```"

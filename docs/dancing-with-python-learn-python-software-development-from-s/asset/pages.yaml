  md: '# 5.1 Using Python modules


    So far, all the code we have seen or used has been built into Python, or we wrote
    it ourselves. Python uses *modules* to collect together function, class, and constant
    definitions so that you can reuse them by selectively bringing them into your
    environment. We can group modules in a hierarchical, tree-like structure to create
    *packages*. Together, these provide the functionality of libraries that we saw
    in section 1.4.


    # 5.1.1 How do you get a module?


    More than 200 modules come with the Python Standard Library. [PSL] Other than
    loading them into your environment via import, you don’t need to install anything
    extra to use them. The math, fractions, random, and cmath modules we use in this
    chapter are part of the standard library.


    That’s not the full extent of pre-written code you can use. More than 200,000
    modules are available from the Python Package Index. [PYPI]


    In appendix section A.3, I discuss the pip application and how to install the
    modules and packages you need. As I write this, I have over 140 Python packages
    on my computer. Packages can depend on other packages, so when you install one,
    it may trigger the installation of several others.


    The sympy package that I introduce in this chapter is from the Python Package
    Index.


    # 5.1.2 How do you import and use a module?


    The math module contains five constant definitions and about 50 functions. An
    example of a constant in the module is Euler’s number e, which is approximately
    2.718281828459045. factorial is one of the functions, and it computes n! = 1 ×
    2 × ⋯ × n for n ≥ 0.


    The import statement brings in these constant and function definitions and allows
    you to use them if you precede their names with “math.”. math is a namespace,
    and you are qualifying a constant or function name with it.'
  merge: -1
  img_proc: true

  md: '# 2.1 Numbers


    The two most frequently used forms of numbers in Python are integers and floating-point.
    An integer contains no decimal point and can be negative, zero, or positive.


    ```

    -4

    ```


    -4


    ```

    0

    ```


    0


    ```

    837375400388826538847463290993837000004846673

    ```


    837375400388826538847463290993837000004846673


    As you can see, integers can be quite large. Python uses the type int for integers.
    We’ll learn more about this later, but it’s common to say something like “-17
    is an int.”


    A floating-point number, known as a float, contains a decimal point but is sometimes
    limited in how much information the system retains from what you type or what
    is computed.


    ```

    -3.6836

    ```


    -3.6836


    ```

    17.9817359935767429962445362777253636

    ```


    17.98173599357674'

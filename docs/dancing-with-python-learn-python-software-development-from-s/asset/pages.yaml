    # 15.3.2 Standardization


    Let μ be the mean of a column and let σ be its non-zero standard deviation. The
    standardization of a column value x_old is


    x_new = (x_old - μ) / σ


    If x_old = μ + σ, then x_new = 1. Similarly, if x_old = μ - σ, then x_new = -1.'

  md: 'Now we compute a PCA for our DataFrame. Instead of reducing the number of features,
    let’s see what the statistics of the result tell us if we maintain five dimensions.


    ```

    ```python

    from sklearn.decomposition import PCA


    pca = PCA(n_components=5)

    pca.fit(df)


    pca.explained_variance_ratio_

    ```

    ```


    ```

    ```text

    array([0.4045, 0.2060, 0.1977, 0.1917, 0.0000])

    ```

    ```


    PCA creates the new first feature by trying to capture the maximum amount of variance.
    That is, the first feature contains as much of the information as we can transform
    into one feature. The first item in `pca.explained_variance_ratio_` is 0.4045,
    which means that the first feature includes approximately 40.45% of the original
    information in the DataFrame.


    The second feature is “orthogonal” to the first, which means that it includes
    other information not represented in that first new feature. The second feature
    represents another dimension compared to the first. It captures an additional
    20.6% of the information in the DataFrame.


    The PCA algorithm then continues, building out the dimensions up to the number
    you specify in the `n_components` keyword argument.


    Note that something strange happens by the time we get to the end of `pca.explained_variance_ratio_`.
    Subject to round-off error, we have captured 100% of the original information
    in only four new features. The fifth adds nothing at all.


    This should not surprise us because we already know that we only need one of F
    and M! All our useful information is in four features.


    If we compute the PCA but ask for three components, we get this:


    ```

    ```python

    pca = PCA(n_components=3)

    pca.fit(df)


    pca.explained_variance_ratio_

    ```

    ```


    ```

    ```text

    array([0.4045, 0.2060, 0.1977])

    ```

    ```'

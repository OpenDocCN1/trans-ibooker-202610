  md: "Make your code correct, and then make your code faster when necessary.\n\n\
    # 10.3.1 Use existing code\n\nIs there a Python library that provides functionality\
    \ close to what you want or need? If so, research what people think about the\
    \ library and its implementation. If you can use code written by experts, there’s\
    \ a good chance it will be better than what you create from scratch. [PYL] [PYPI]\n\
    \n# 10.3.2 Choose a good algorithm\n\nWhen we looked at implementations of the\
    \ factorial and Fibonacci functions in Chapter 6, Defining and Using Functions,\
    \ we saw that selecting the right algorithm can make a large difference in execution\
    \ time or memory usage. Note that you might not see this until the problem gets\
    \ big enough, so you may not need to over-analyze what to do in small cases.\n\
    \nFor example, do you really need to call sorted for a list of two items?\n\n\
    Suppose you want to add together all positive integers less than or equal to a\
    \ given integer. You might code:\n\n```\ndef adder_1(n):\n    sum = 0\n    for\
    \ j in range(1, n + 1):\n        sum += j\n    return sum\n\nadder_1(100)\n```\n\
    \n5050\n\n```\nt = timeit.timeit(stmt=\"adder_1(1000000)\",\n                number=3,\
    \ globals=globals())\nprint(f\"{t:.10f}\")\n```\n\n2.0824539000\n\nOr, you could\
    \ note that this sum is n (n + 1)/2.\n\n```\ndef adder_2(n):\n    return n * (n\
    \ + 1) // 2\n```"

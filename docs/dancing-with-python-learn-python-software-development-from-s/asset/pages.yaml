  md: '# 12.1 Core string search and replace methods


    This section lists the primary `str` methods for finding and replacing substrings.
    Though we discussed several of these in *Chapter 4, Stringing You Along*, it is
    helpful to have their descriptions together before discussing more advanced regular
    expression functions.


    In each of the following methods that includes optional arguments `start=0` and
    `end=len(string)`, the search is within the substring given by the slice coordinates
    `start:end`.


    # substring in string


    Returns True if substring is in string, and False otherwise. See section 4.2.


    ```

    ```python

    "z Fe" in "Franz Ferdinand"

    ```


    True

    ```


    # substring not in string


    Returns True if substring is not in string, and False otherwise. See section 4.2.


    ```

    ```python

    "Ferd" not in "Franz Ferdinand"

    ```


    False

    ```


    # string.count(substring, start=0, end=len(string))


    Returns the number of times that count occurs in string. `count` does not include
    overlapping instances of substring, so `"ZZZ".count("ZZ")` is 1 and not 2.


    ```

    ```python

    "a aa aaa aaaa aaaaa".count("aa")

    ```


    6

    ```


    ```

    ```python

    "a aa aaa aaaa aaaaa".count("aa", 8, 13)

    ```


    2

    ```


    # string.find(substring, start=0, end=len(string))


    Returns -1 if substring is not contained in string. Otherwise, it returns the
    index of the first occurrence of substring in string. See section 4.3.


    ```

    ```python

    len("a aa aaa aaaa aaaaa")

    ```


    19

    ```


    ```

    ```python

    "a aa aaa aaaa aaaaa".find("B")

    ```


    -1

    ```'

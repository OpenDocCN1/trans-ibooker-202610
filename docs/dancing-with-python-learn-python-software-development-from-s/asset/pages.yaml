    # A.4 Installing a virtual environment


    In Appendix F, Production Notes, I list the Python modules I have installed on
    my computer. There are almost 200 of them.


    I wish I could say that each of these modules works flawlessly with every other,
    but that’s not the case. When a developer updates one module, it could break other
    code that depends on it.


    Instead of having one big Python environment of your system, you can create smaller
    virtual environments. A virtual environment holds the Python interpreter, tools,
    standard libraries, and only the compatible pip-installed modules and packages
    you need for your project. This feature is especially useful when you work on
    several projects that require different sets of modules because you can set up
    a virtual environment for each. [P.Y.Y]


    Once you have installed Python, as I discussed in section A.2, you can install
    a virtual environment. First, decide where you want to put it. A common choice
    is to place it in a subdirectory of your home directory and call it .venv. On
    a command line for Linux, Mac, or Windows PowerShell, issue the following:


    ```

    cd ~

    python -m venv .venv

    ```


    These commands move you to your home directory and install the core Python tools
    you require. To use this virtual environment, enter


    ```

    .venv\Scripts\activate.bat

    ```


    on Windows or


    ```

    source .venv/bin/activate

    ```


    on Linux or Mac.


    Now you can go ahead and use pip as in section A.3 to install whatever modules
    and packages you need.'

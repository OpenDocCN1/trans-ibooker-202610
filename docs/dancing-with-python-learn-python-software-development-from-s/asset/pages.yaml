    I now show several examples of how to slice lists.


    ```

    the_list = ["a", "b", "c", "d", "e", "f"]

    the_list

    ```


    [''a'', ''b'', ''c'', ''d'', ''e'', ''f'']


    +   - the_list[0:] and the_list[:] return a copy of the_list.


    ```

    the_list[0:]


  md: "The IBM Quantum Composer is a powerful tool that runs in the cloud. You need\
    \ not download anything to your machine if you wish to use Python and qiskit together\
    \ to create quantum circuits and programs.\n\n# A.12 Linting\n\nA linter is an\
    \ application that scans your code looking for errors or variations from stylistic\
    \ conventions. Many IDEs like Visual Studio Code have built-in support for one\
    \ or more linters. [VSL] A linter does static analysis in that it does not run\
    \ your code and only looks at what you have written.\n\nA linter usually has three\
    \ classes of messages:\n\n+   - **Informational** – “You might want to know about\
    \ this, but you will likely get annoyed if I keep telling you.”\n+   - **Warning**\
    \ – “You did something here that might cause problems, or you are not following\
    \ formatting conventions. Don’t procrastinate, and take a look now.”\n+   - **Error**\
    \ – “Fix this. Now.”\n\nA good Python linter to start with is pylint. Install\
    \ it via:\n\n```\npip install pylint\n```\n\nOnce you have it installed, issuing\
    \ pylint --help from the operating system command line will display several screens\
    \ of information about the options.\n\nIf we store the incorrect code\n\n```\n\
    def f(x=1, y)\n    return x+y\n```\n\nin the file src\\code\\linting\\lint-01.py,\
    \ or src/code/linting/lint-01.py on non-Windows systems, and then run\n\n```\n\
    pylint src\\code\\linting\\lint-01.py\n```\n\nfrom the operating system command\
    \ line, we see the output\n\n```\n************ Module lint-01\nsrc\\code\\linting\\\
    lint-01.py:1:13: E0001: non-default argument follows default\nargument (<unknown>,\
    \ line 1) (syntax-error)\n```"

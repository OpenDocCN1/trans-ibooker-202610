  md: 'These different schemes affect how easy it is to retrieve a specific guitar
    from the collection. In the first and third cases, you might need to look at every
    guitar to find the one you need. In the second case, you only need to start at
    the left and move to the right until you either find the guitar or see one where
    the model name is alphabetically later than the one you seek.


    You could be even smarter and look at the guitar in the middle of the collection.
    If that is the guitar you seek, you are finished. If your model is before it,
    you only need to search the first half of the guitars. If it is after, you search
    the second half. Repeat this kind of search in your chosen half.


    As with guitars, collections in Python have different storage and retrieval schemes.
    They are more or less efficient for a given use. In this chapter, we look at the
    three core collection types in Python: lists, dictionaries, and sets. Along the
    way, we encounter *tuples*, which we saw when we did multiple assignments in section
    2.4.



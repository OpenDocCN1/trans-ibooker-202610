  md: "```\ndef p(x):\n    return x**3 - 5*x**2 + 7*x + 1\n\n[p(x) for x in range(-2,\
    \ 4)]\n```\n\n[-41, -12, 1, 4, 3, 4]\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_259_0.png)\n\
    \nFigure 7.1: Plot of the univariate polynomial x³ - 5x² + 7x + 1\n\nIn our definition\
    \ of p, there are four coefficients: 1, -5, 7, and 1. These are the explicit or\
    \ implicit numbers before x³, x², x, and the invisible x⁰ = 1, respectively. Every\
    \ one of our coefficients must be an int in our implementation.\n\nAn individual\
    \ coefficient-indeterminate-exponent expression is a term. A term is zero if and\
    \ only if its coefficient is zero. A polynomial with one term is a monomial.\n\
    \nFor any given exponent, there is at most one term with that exponent. That is,\
    \ we always simplify anything like 3x² - 5x² to -2x².\n\nEvery exponent must be\
    \ an int greater than or equal to 0. The largest exponent belonging to a non-zero\
    \ term is the degree of the polynomial. The zero polynomial has degree 0. A polynomial\
    \ of degree 0 is called a constant polynomial.\n\nIf we have two polynomials\n\
    \np = x² + 7x + 1    and    q = 4x² - 7x + 3\n\nthen\n\n2p = 2x² + 14x + 2   \
    \ and    p + q = 5x² + 4.\n\nNote that the addition of two polynomials sums the\
    \ coefficients of corresponding terms with equal exponents."

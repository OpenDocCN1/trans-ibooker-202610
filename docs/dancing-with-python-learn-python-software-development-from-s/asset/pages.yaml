- pgno: 643
  md: 'Within $h_1$, we compute


    $$w_{1,1}x_1+w_{2,1}x_2+b_1$$


    and then apply the binary step activation function. We must define the input variables,
    the weights, and the bias.


    $x_1$ is a binary-valued variable. It has the value 0 if you do **not** have two
    hours to go to the grocery store, come home, and prepare dinner. It has the value
    1 if you do. When $x_1$ is 0, I am ordering pizza because I don’t have time to
    go shopping.


    $x_2$ is a **float** from 0.0 to 1.0. The value is 1.0 if you very much want pizza
    and is 0.0 if you don’t want to eat pizza. I assume that you can eat pizza, but
    0.0 means you very much prefer to eat something else.


    Consider


    $$z_1=-10x_1+20x_2+1$$


    after which I apply the binary step function $H$. When $x_1$ is 0, $z_1$ is positive
    for all allowable values of $x_2$. Therefore, we pass 1 forward to $y_1$: we will
    order pizza.


    When $x_1$ is 1, meaning that I do have time to go shopping,


    $$z_1=-10\times1+20x_2+1=20x_2-9$$


    When $x_2=0.45$, $z_1=0.0$. When $x_2=0.5$, $z_1=1.0$. This implies that when
    I have time and my desire for pizza is greater than 0.45, I will order pizza.
    Otherwise, I will go to the store.


    In practice, we would have more input and hidden nodes. We would collect many
    example numeric inputs from people about the features they consider essential.
    Then we would split all this data into training and testing sets. Remember that
    for the training set, we know if people ordered pizza or not: this is structured
    learning.


    After running a training example, we mathematically adjust the weights, and then
    process the next example. We successively tune the weights and bias. If we have
    enough data and it is linearly separable, we will stabilize eventually. Then we
    use the testing set to confirm that we have a model that correctly predicts the
    output a large percentage of the time.'
  merge: -1
  img_proc: true
- pgno: 644
  md: 'This is only a sketch of what machine learning software and practitioners do
    with simple neural networks, but I hope it is enough to give you an idea.


    # 15.8.3 Deep learning


    When we have more than one hidden layer, we are performing *deep learning*. People
    vary in their views of the minimum layers you need for deep learning, but, for
    simplicity, I say it is two. Figure 15.19 shows a network with three hidden layers.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_644_0.png)


    Figure 15.19: Deep neural network with 4 inputs, 3 hidden layers, and 3 outputs


    Note that it is not always the case that every hidden layer has the same number
    of nodes as every other. We may not have every node in one layer connected to
    every node in the next. When we do, the network is *fully connected*.


    What happens within each level? A fully connected layer may multiply its inputs
    by weights and then add a bias value. Another layer may have the sole function
    to apply one of the activation functions we saw previously.


    A *normalization layer* applies a normalization or standardization transformation
    we discussed in *section 15.3* or another transformation appropriate to the data
    type. This activity might be part of other layers, such as the input layer.'
  merge: -1
  img_proc: true
- pgno: 645
  md: 'Many examples of deep learning networks involve image recognition. Here, you
    might imagine that the input is a 3-dimensional array of pixels. With two of those
    dimensions, we represent the rectangular layout of the image pixels, and in the
    third, we hold the RGB values for each pixel.


    If a photo has a resolution of 4,032 by 3,024, it has 12,192,768 pixels. If we
    multiply this by 3, we get 36,578,304. That’s a lot of input! If the first hidden
    layer has 100 nodes and we fully connect the input to this hidden layer, we have
    over 36 million weights. This leads to a lot of computation.


    Given this input, we might have a *pooling layer* that looks at square blocks
    of pixels and produces the mean or maximum RGB values of the pixels in each square.
    In this way, we can reduce the image size, albeit while losing resolution.


    Another type of layer performs *convolution*. Think of convolution as a process
    that filters or concentrates aspects of the input. For example, given an input
    photo, we can use convolution to detect the edges of objects.


    A *cropping layer* cuts off parts of the image, possibly creating a smaller image.
    For example, we might want to remove extra whitespace around an image.


    We move from our 36 million inputs to image recognition by connecting and applying
    these and other kinds of layers. Yes, we might say, “here are the three cats in
    the photo” or “this is a dog and not a fish,” but we can also possibly recognize
    tumors in medical images.


    Deep learning has driven extraordinary advances in Natural Language Processing
    (NLP), a topic we discussed in *section 12.3*. Practitioners use deep neural networks
    for sentiment analysis, named entity resolution, text and speech generation, and
    implementing chatbots and other applications.


    We train a deep learning network by inputting data, running it through the layers,
    and comparing the computed output with what we expected. Remember that this is
    supervised learning, so we know the output for data in the training set. Using
    linear algebra and calculus, we work backward from the difference between the
    expected and received output to adjust the weights and other internal parameters
    in the layers. This technique is called *backpropagation*.


    To learn about the mathematics and techniques of neural networks and deep learning,
    I highly recommend the book *Deep Learning* by Ian Goodfellow, Yoshua Bengio,
    and Aaron Courville. [DLG]'

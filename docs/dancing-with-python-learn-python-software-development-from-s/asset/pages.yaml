    # A.9 Jupyter notebooks


    **Jupyter** is a browser-based interactive environment mainly written in Python.
    While you can use it to edit and run Python immediately, it also supports other
    installable runtime environments called *kernels* and is widely used by data scientists.
    Developers have written over one hundred kernels and these support languages like
    R, Scala, Go, Java, Ruby, Rust, and even Fortran. [JUP.]


    **Jupyter** creates *notebooks*, which are combinations of text, images, code,
    and code execution results. A notebook is persistent, which means that you can
    save it and restart it later. By default, **Jupyter** uses the Markdown description
    language for formatting text.


    Install and start **Jupyter** from the command line:


    ```

    ```bash

    pip install jupyter

    jupyter notebook

    ```

    ```


    You may get a windowed prompt asking you which browser you would like to use.
    Pick one, and in the upper right-hand corner, click “New”. Choose “Python 3”.
    You should now see a browser window similar to Figure A.6.'

    \n```\ncoverage --help\ncoverage report --help\ncoverage json --help\ncoverage\
    \ html --help\n```\n\n# 10.5 Defining and using decorators\n\nWe’ve used Python\
    \ decorators several times so far, but it’s time we learned how to code them ourselves.\
    \ We saw the decorators\n\n+   - `@abstractmethod` in section 7.1.3.2 to indicate\
    \ a method from an abstract base class that coders must override\n+   - `@classmethod`\
    \ and `@staticmethod` in section 7.1.2 to define class and static methods\n+ \
    \  - `@property` in section 7.5 to define properties from parameter-less class\
    \ instance methods\n\nHere’s the core idea with decorators: given a function `my_function`,\
    \ I want to wrap it with additional code that calls `my_function`. I’m *decorating*\
    \ the outside of `my_function` with extra capability. For extra credit, I want\
    \ to use `my_function` to access my original code with the new decorations.\n\n\
    I’ll begin with a simple function that prints 100.\n\n```\ndef one_hundred():\n\
    \    return 100\n\none_hundred()\n```\n\n100\n\n```\none_hundred\n```\n\n<function\
    \ __main__.one_hundred()>"

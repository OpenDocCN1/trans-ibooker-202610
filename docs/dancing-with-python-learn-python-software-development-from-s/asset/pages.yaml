- pgno: 32
  md: 'When we put characters next to each other, we get *strings*. Thus "abcd" is
    a string of length four. I''ve used the double quotes to delimit the beginning
    and end of the string. They are not part of the string itself. Some languages
    treat characters as special objects unto themselves, while others consider them
    to be strings of length one.


    This is a good start for our programming needs: we have bits and Booleans, numbers,
    characters, and strings of multiple characters to form text. Now we need to do
    something with these kinds of data.


    # 1.2 Expressions


    An *expression* is a written combination of data with operations to perform on
    that data. That sounds quite formal, so imagine a mathematical formula like:


    15 × 6² + 3 × 6 − 4 .


    This expression contains six pieces of data: 15, 6, 2, 3, 6, and 4. There are
    five operations: multiplication, exponentiation, addition, multiplication, and
    subtraction. If I rewrite this using symbols often used in programming languages,
    it is:


    ```

    15 * 6**2 + 3 * 6 - 4

    ```


    See that repeated 6? Suppose I want to consider different numbers in its place.
    I can write the formula:


    15 × x² + 3 × x − 4


    and the corresponding code expression:


    ```

    15 * x**2 + 3 * x - 4

    ```


    If I give x the value 6, I get the original expression. If I give it the value
    11, I calculate:


    ```

    15 * 11**2 + 3 * 11 - 4

    ```


    We call x a *variable* and the process of giving it a value *assignment*. The
    expression


    x = 11


    means "assign the value 11 to x and wherever you see x, substitute in 11." There
    is nothing special about x. I could have used y or something descriptive like
    *kilograms*.


    An expression can contain multiple variables.'

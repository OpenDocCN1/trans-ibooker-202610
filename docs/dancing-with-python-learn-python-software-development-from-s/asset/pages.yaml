  md: 'One important feature is *debugging*. **IDLE** allows you to walk step by step
    through your code.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_661_0.png)


    Figure A.4: Python IDLE in debug mode


    In Figure A.4, I first turn on debug mode from the menu. I define a function *f*
    and then call f(3). By repeatedly clicking the “Step” button, I move through my
    code. At the bottom of the Debug Control window, you can see the values of all
    local variables.


    This form of debugging helps you understand if your code is doing what you expect
    it to do and, if not, see where the problem is occurring. You can also set a *breakpoint*,
    a location in your code at which debug execution will stop. Rather than run your
    code line by line, you can say, “execute everything up to this point and then
    stop so I can look around.” [IDL]


    # A.8 Visual Studio Code


    An *IDE* is an Integrated Development Environment. These tools are sometimes dedicated
    to one programming language, but I think the best offer uniform and consistent
    support for several languages. **Visual Studio Code** is the IDE I use now, and
    it is my favorite by far. I wrote the content for this book using **Visual Studio
    Code**. [VSC]'

  md: 'For example, the distance between (-3, -1) and (2, 1.5) is approximately 5.6.
    Note the double bars around the difference of the points.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_609_0.png)


    In words, we say that the distance between any two points is the square root of
    the sum of the squares of the differences between corresponding coordinates. In
    three dimensions, the distance formula is


    ```

    ||v - w|| = sqrt((v₁ - w₁)² + (v₂ - w₂)² + (v₃ - w₃)²)

    ```


    for points (v₁, v₂, v₃) and (w₁, w₂, w₃). Note the convention of using a bold
    italic font for the point when it has two or more dimensions: v = (v₁, v₂, v₃).


    These are generalizations of the formula for the distance between two numbers,
    v and w, on a line, which is the absolute value.


    ```

    |v - w| = sqrt((v - w)²)

    ```


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_609_1.png)



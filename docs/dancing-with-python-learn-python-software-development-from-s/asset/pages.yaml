    field in the first record is DANDENONG NORTH. The data includes codes such as
    DOMSH for “domestic short hair,” “TAB” for “tabby,” and “F” for “female.”


    # 14.3 pandas DataFrames


    A DataFrame is a flexible 2-dimensional data structure that represents rows and
    columns. The rows are records, and the columns are data of a particular feature.
    For example, we will see a DataFrame where the rows correspond to cats, and the
    columns include their breed and color.


    We can access the rows and columns in ways that resemble both lists and dictionaries;
    that is, we can use numeric indices or string labels/keys. pandas is built on
    numpy and matplotlib, so you can use their functions and methods for computation
    and visualization. We discussed those packages in Chapter 13, Creating Plots and
    Charts.


    pandas is a very large Python package and has many functions and methods for working
    with DataFrames. [PAN] You can often get the result you seek by using Pythonic
    combinations of row and column operations together with indexing and slicing.
    Other times, you may use loops on lists or arrays. I give examples of both styles
    of pandas coding. For any particular task, there are likely several ways of getting
    the same result.


    # 14.3.1 Loading a DataFrame


    We begin by importing pandas as pd and using the read_csv function to load our
    cat data from a file.


    ```

    import pandas as pd


    df = pd.read_csv("src/examples/registered-cats.csv")

    ```


    Now we use info to tell us about the data:


    ```

    df.info()

    ```


    ```

    <class ''pandas.core.frame.DataFrame''>

    RangeIndex: 3485 entries, 0 to 3484

    Data columns (total 6 columns):

    ```'

  md: 'Figure 1.11 is a diagram of a logic circuit with two logic gates that does
    simple addition.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_55_0.png)


    Figure 1.11: A logical addition circuit


    Try it out with different bit values for a and b. Confirm that the sum s and the
    carry bit c are correct.


    By analogy to the function application and logic cases, we also have quantum gates
    and circuits. These operate on and include one or more qubits.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_55_1.png)


    Figure 1.12: A quantum reverse CNOT circuit


    This is a 2-qubit circuit containing one quantum X gate and four quantum H gates.
    Both X and H are reversible gates. We cover their definitions and uses later,
    but note that X interchanges the north and south poles in our qubit sphere model.
    The H gate moves the poles to locations on the equator of the sphere.


    Coders who have done classical programming know that arithmetic and algebra are
    involved. When we bring in quantum computing, geometry also becomes useful!


    The gates that look like dials on the right of the quantum circuit perform quantum
    measurements. These produce the final bit values.


    There is one more gate in the circuit, and that is CNOT. It is an essential and
    core gate in quantum computing. It looks like a • on the horizontal line from
    qubit q0, a ⊕ on the q1 line, and a line segment between them. It has two inputs
    and two outputs. Unlike the logic gates and, or, and xor, it is a reversible gate.'

    Suppose we have three cats, which we represent by (locality, breed) pairs as (0,
    0), (0, 1), and (0, 52). The breeds do not represent ordered and continuous data:
    there is no reason to think breeds 0 and 52 are “closer” than breeds 0 and 1.
    Nevertheless, the “distance” between the first two cats is 1, and the second two
    cats is 51. This second and larger number might sway our calculations so that
    we think those cats are much more different from the first two.


    To make the values more comparable across columns, we will normalize or scale
    the values in each column. Some algorithms require normalization, and others run
    much faster if you normalize beforehand. There are several techniques for normalizing
    data, and I next highlight three of them.


    # 15.3.1 Min-max normalization


    Min-max scaling or normalization produces values between 0 and 1, inclusive. Effectively,
    we subtract the minimum column value from each number in a column and then divide
    by the new maximum. You would not do this if the minimum and maximum were both
    zero.


    Mathematically, this is


    ```

    x_new = (x_old - x_min) / (x_max - x_min)

    ```


    for a column value x_old. After computation, we replace x_old with x_new in the
    column.



- pgno: 377
  md: 'Since $a$ is a complex number, $a = a_1 + a_2 i$ with real part $a_1$ and imaginary
    part $a_2$. These are both real numbers. $|a| = \sqrt{(a_1^2 + a_2^2)}$, by definition.
    So, $|a|^2 = a_1^2 + a_2^2$. Similar statements hold for $b$.


    We can write


    $(a, b) = a\,(1, 0) + b\,(0, 1) = a\,|0\rangle + b\,|1\rangle.$


    This equation for the quantum state is called *superposition*. $a$ is the *amplitude*
    of $|0\rangle$, and $b$ is the amplitude of $|1\rangle$. You will often see $a\,|0\rangle
    + b\,|1\rangle$ simplified to $|\psi\rangle$ in quantum computing texts and articles.


    Though this notation may look strange to you, suppose I asked you to “walk 3 blocks
    east and 4 blocks north.” Using ket notation, this would be:


    $3\,|\text{east}\rangle + 4\,|\text{north}\rangle.$


    As a result of this, you are “east and north simultaneously.” This is the source
    of the statement people sometimes make when they say, “a qubit is 0 and 1 simultaneously!”


    The amplitudes 3 and 4 don’t work for a quantum state because $|3|^2 + |4|^3 \neq
    1$.


    Two quantum states $a_0\,|0\rangle + b_0\,|1\rangle$ and $a_1\,|0\rangle + b_1\,|1\rangle$
    are *equivalent* if there exists a complex number $c$ with $|c| = 1$ such that
    $a_0 = c\,a_1$ and $b_0 = c\,b_1$. We say that the quantum states “differ by the
    *global phase* $c$.”


    Now let’s look at quantum gates on one qubit. I show how gates work with the notation


    $a\,|0\rangle + b\,|1\rangle \mapsto c\,|0\rangle + d\,|1\rangle$


    The arrow “$\mapsto$” means “maps to.” For each gate that follows, verify that
    $|c|^2 + |d|^2 = 1$.


    All quantum gates are reversible.


    # The id quantum gate


    As in the bit case, the identity **id** gate does nothing. We use the symbol to
    the right for the **id** gate in circuit diagrams.


    **id**: $a\,|0\rangle + b\,|1\rangle \mapsto a\,|0\rangle + b\,|1\rangle$


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_377_0.png)


    # The X quantum gate


    The **X** gate generalizes the **not** bit gate to qubits.


    **X**: $a\,|0\rangle + b\,|1\rangle \mapsto b\,|0\rangle + a\,|1\rangle$


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_377_1.png)'

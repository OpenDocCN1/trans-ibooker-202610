  md: '# Exercise 1.16


    Written in functional form, **CNOT** has the following behavior.


    ```

    CNOT(|0⟩, |0⟩) = |0⟩, |0⟩

    CNOT(|0⟩, |1⟩) = |0⟩, |1⟩

    CNOT(|1⟩, |0⟩) = |1⟩, |1⟩

    CNOT(|1⟩, |1⟩) = |1⟩, |0⟩

    ```


    The gate has two outputs, which I separated with a comma. The first qubit input
    is called the *control*, and the second is the *target*.


    In what way is **CNOT** a reversible xor?


    Quantum gates and circuits are the low-level building blocks that will allow us
    to see significant advantages over classical methods alone. You will see qubits,
    quantum gates, and quantum circuits as we progress through this book. In *Chapter
    11, Searching for the Quantum Improvement*, we focus on quantum algorithms and
    how they obtain their speed-ups.


    # 1.13 Summary


    In my coding career, I have used dozens of programming languages and created several.
    [AXM] When I have a new problem to solve or am considering a new project, I research
    how languages have evolved and improved. For each language I investigate, I ask
    myself,


    +   • “can this language do what I have in mind?”,

    +   • “can this language do what I want better than the others?”, and

    +   • “what are the special features and idioms within the language that enable
    me to produce an elegant result?”.


    This chapter introduced many of the ideas widely used today in languages for coding.
    It showed that you could think about features and functionality separately from
    what one specific language provides. In the next chapter, we get concrete and
    see how Python implements these and other concepts.'

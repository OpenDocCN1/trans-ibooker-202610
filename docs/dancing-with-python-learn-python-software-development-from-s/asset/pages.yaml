    This breakdown of our sentence allows us to analyze it:


    +   - Start at the root and ask, “What is being done?”: **making**

    +   - “Is it extended with an auxiliary verb?” [aux]: yes – **am**

    +   - “Who is making?” [nsubj]: **I**


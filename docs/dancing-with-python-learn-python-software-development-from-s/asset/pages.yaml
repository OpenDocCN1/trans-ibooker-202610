- pgno: 22
  md: 'However, there is another kind of computer that has only been available on
    the cloud for general users since 2016. That is the *quantum computer*. Coding
    a quantum computer is radically different from classical device programming at
    the level close to the hardware. However, if you know or can learn Python, a programming
    language estimated to be used by over 8 million software developers globally and
    taught in many universities, you have a tremendous advantage in that you can do
    both classical and quantum computing together.


    Classical hardware and software have proven themselves over the last seven decades,
    while quantum computing is new. It promises to help solve some kinds of problems
    that would take too much time, too much processing power, or too much memory,
    even for a classical supercomputer. Experts expect quantum computing to be useful
    in the future in areas including financial services, logistics, chemistry, materials
    science, drug discovery, scientific simulation of physical systems, optimization,
    and artificial intelligence.


    If you plan to be a professional software developer or someone who needs high-performance
    computing for research, you should learn about quantum computing systems and how
    to code for them.


    # Why did I write this book?


    How do you learn to code in this new world that involves both classical and quantum
    hardware?


    One way to do it is to learn classical computing by itself. This is the traditional
    way of doing it, using a language such as C, C++, JavaScript, Java, Go, or Python.
    Along the way, you would learn how to use extra functionality in libraries of
    code along with the programming tools or from a third-party provider. Examples
    of these are the C++ Standard Library; the Java Platform, Enterprise Edition;
    the Python Standard Library; or the thousands of Python packages listed in the
    Python Package Index. [PYPI]


    Once you have the philosophy, syntax, structure, and idioms of the classical programming
    language understood, you then learn quantum computing on top of that. For example,
    you could use the Qiskit open source quantum computing software development kit
    (SDK) along with Python. [QIS] These mesh together and operate exceptionally well.
    Thousands of people are already Qiskit coders. If you know Python, this is a great
    approach.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/4ffeafa3e3f1373f02971e43b0755ea6_23_0.png)


    Figure 0.1: Our learning strategy


    But what if you are learning to code or have only a small amount of experience?
    What if I could offer you the chance to learn classical and quantum computing
    in a unified manner? Would it be useful if I could help you understand the concepts
    of both so that you don’t see them as different disciplines? That’s what I do
    in this book.


    # For whom did I write this book?


    I believe this book will be useful and engaging if one or more of these descriptions
    apply to you:


    +   - You are learning to code as part of a class or course.

    +   - Through self-study, you want to learn to think like someone who writes software.

    +   - You want to understand and use the fundamentals of modern Python programming.

    +   - You recognize that quantum computing will be one of the most important technologies
    of this century, and you want to learn the basics of how to code for it.

    +   - You think that solving a problem through software means you use all the
    tools available to you, and you want to employ both classical and the newer quantum
    coding techniques.


    # Assumed reader prerequisites


    I do not expect you to have any experience in coding or using Python. Some of
    the discussion and implementation in Chapter 11, Searching for the Quantum Improvement,
    presumes comfort with some mathematics, but nothing that isn’t typically covered
    before a calculus course. This includes algebra, geometry, trigonometry, and logarithms.'
  merge: -1
  img_proc: true

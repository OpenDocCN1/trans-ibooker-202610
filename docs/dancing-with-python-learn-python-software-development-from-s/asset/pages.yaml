- pgno: 625
  md: 'Finding that best line is the task of a *support vector machine (SVM)* performing
    *linear support vector classification (SVC)*. We need some terminology before
    I show you how to compute it using Python and **sklearn**.


    From your mathematics classes in school, you know what a “plane” is. It could
    be the Cartesian plane I have been using for 2-dimensional plots or any one of
    the infinite planes in three dimensions. For example, the set of all points (x,
    y, 0) is the plane in 3D that lies flat with all vertical coordinates equal to
    0.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_625_0.png)


    A *hyperplane* is a linear object that has one less dimension than the space in
    which it lives. A plane is 2-dimensional, so a plane in three dimensions is a
    hyperplane. A line has one dimension, so a line in a plane is a hyperplane. A
    point on a line is a hyperplane. If we have 16 features, a 15-dimensional linear
    subspace within it is a hyperplane.


    SVC finds the best hyperplane to separate data, if it exists. The definition of
    the SVC hyperplane ensures that the hyperplane maximizes the distance from it
    to the closest point in either group.


    Figure 15.6 shows two groups of points marked by white circles on the left and
    black-filled circles on the right. There is a gap between them, and so the groups
    are *linearly separable*. The *support vectors* are 5, the maximum of the left-most
    points, and 7, the minimum of the right-most points. The hyperplane is the point
    6, which is halfway between the support vectors.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_625_1.png)


    Figure 15.6: Linear support vector classification in one dimension


    Returning to our baseball players and their 2-dimensional locations, we use the
    **SVC** class from **sklearn** to compute the support vectors.


    ```

    ```python

    from sklearn import svm


    classifier = svm.SVC(kernel="linear")

    classifier.fit(df[[''x'', ''y'']], df["label"])

    ```

    ```


    SVC(kernel=''linear'')'

- pgno: 156
  md: '# 4.1 Single, double, and triple quotes


    You may use single quotes or double quotes to delimit a literal string. Python
    usually prints a string with single quotes.


    ```

    "Franz"

    ```


    ```

    ''Franz''

    ```


    ```

    ''Ferdinand''

    ```


    ```

    ''Ferdinand''

    ```


    If your string contains one kind of quote, use the other as the delimiter or escape
    the quote mark.


    ```

    "That is Franz''s cat toy."

    ```


    ```

    "That is Franz''s cat toy."

    ```


    ```

    ''The ball is Ferdinand\''s.''

    ```


    ```

    "The ball is Ferdinand''s."

    ```


    Use the character `\n` character to embed a newline in your string.


    ```

    "You can see the\nnewline character here."

    ```


    ```

    ''You can see the\nnewline character here.''

    ```


    ```

    print("But ''print'' breaks\nthe line at the character.")

    ```


    ```

    But ''print'' breaks

    the line at the character.

    ```


    For very long strings, you can concatenate them together or use triple quotes.
    You may use either three single quotes or three double quotes, though the Style
    Guide for Python Code recommends the latter. [PEP008]


    ```

    """

    I''ve broken

    this string

    over several lines.

    """

    ```


    ```

    "\nI''ve broken\nthis string\nover several lines.\n"

    ```'

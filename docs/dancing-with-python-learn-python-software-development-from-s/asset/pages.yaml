    \ to display the lemmas under the words in the sentence.\n\n# Named entities\n\
    \nNow, let’s look at named entities. spacy has an extensive database it uses to\
    \ guess when a word or a phrase is a specific person, organization, place, quantity,\
    \ date, amount of money, and so on. I say “guess” because choosing the correct\
    \ entity depends on context. If I have a sentence discussing Fiona Apple’s songs\

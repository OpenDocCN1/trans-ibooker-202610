  md: '# Exercise 11.3


    Explain what is happening with print in the last for loop and in find_number to
    obtain the formatting you see.


    The search sequence in find_number is in Figure 11.1.


    ![](img/4ffeafa3e3f1373f02971e43b0755ea6_442_0.png)


    Figure 11.1: Binary search sequence for the list of numbers


    Figure 11.1 shows a graph. The numbers in circles are nodes, and the lines connecting
    them are edges. When you travel from a node along a left edge, you get to a node
    of lesser value. When you take a right edge, you arrive at a node of greater value.
    Let’s use the graph to locate 36.


    We begin at the node at the very top, which is the root node. It has the value
    30. Since 36 > 30, we follow the right edge from 30 to get to the node with the
    value 40. Since 36 < 40, we follow the left edge from 40 to get to 34. We have
    36 > 34, so we take the left edge to land on 36. We are done!



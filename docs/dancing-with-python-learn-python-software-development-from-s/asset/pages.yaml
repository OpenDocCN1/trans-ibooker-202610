- pgno: 380
  md: "# The Y quantum gate\n\nThe **Y** gate is the first 1-qubit gate we have seen\
    \ that uses a non-real complex number.\n\n**Y**: $a\\lvert 0\\rangle + b\\lvert\
    \ 1\\rangle \\mapsto -bi\\lvert 0\\rangle + ai\\lvert 1\\rangle$\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_380_0.png)\n\
    \n**Y** is both a bit flip and a phase flip. We can rewrite this as\n\n**Y**:\
    \ $a\\lvert 0\\rangle + b\\lvert 1\\rangle \\mapsto (-i)(b\\lvert 0\\rangle -\
    \ a\\lvert 1\\rangle) = (-i)\\,\\mathbf{ZX}(a\\lvert 0\\rangle + b\\lvert 1\\\
    rangle)$\n\nSince $\\lvert-i\\rvert=1$, the quantum state we get by applying **Y**\
    \ is equivalent to what we get by applying **X** and then **Z**. If we have **X**\
    \ and **Z**, **Y** is superfluous.\n\n+   **Exercise 9.26**\n+   \n+   Show that\
    \ $XY=-YX$, $ZY=-YZ$, and $YY=\\mathrm{id}$.\n\nI cover the **Y** gate in section\
    \ 7.6.3 of *Dancing with Qubits*. [**DWQ**]\n\n# The H quantum gate\n\nThe **H**\
    \ gate, also known as the Hadamard gate after Jacques Hadamard, operates on $\\\
    lvert 0\\rangle$ and $\\lvert 1\\rangle$ as\n\n$\\mathbf{H}(\\lvert 0\\rangle)=(\\\
    sqrt{2}/2)(\\lvert 0\\rangle+\\lvert 1\\rangle)$ and $\\mathbf{H}(\\lvert 1\\\
    rangle)=(\\sqrt{2}/2)(\\lvert 0\\rangle-\\lvert 1\\rangle)$.\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_380_1.png)\n\
    \nWith a bit of algebra, we get\n\n```\n$\\begin{aligned}\n\\mathbf{H}(a\\lvert\
    \ 0\\rangle+b\\lvert 1\\rangle)\n&=a\\,\\mathbf{H}(\\lvert 0\\rangle)+b\\,\\mathbf{H}(\\\
    lvert 1\\rangle)\\\\\n&=a(\\sqrt{2}/2)(\\lvert 0\\rangle+\\lvert 1\\rangle)+b(\\\
    sqrt{2}/2)(\\lvert 0\\rangle-\\lvert 1\\rangle)\\\\\n&=a(\\sqrt{2}/2)\\lvert 0\\\
    rangle+a(\\sqrt{2}/2)\\lvert 1\\rangle+b(\\sqrt{2}/2)\\lvert 0\\rangle-b(\\sqrt{2}/2)\\\
    lvert 1\\rangle\\\\\n&=(\\sqrt{2}/2)(a+b)\\lvert 0\\rangle+(\\sqrt{2}/2)(a-b)\\\
    lvert 1\\rangle.\n\\end{aligned}$\n```"

  md: "# √n inversions\n\nThis is the Grover search algorithm in practice. We are\
    \ searching for some object X within a collection of size n. We put the items\
    \ in the collection in correspondence with the standard basis kets for m qubits,\
    \ where n ≤ 2^m. In the example in this section, n = 8 and m = 3.\n\nNow assume\
    \ someone gives us an oracle that acts in this way: when given X, the oracle flips\
    \ the sign of the amplitude of the ket corresponding to X. When given any object\
    \ other than X, it does not change the amplitude.\n\nWe now do the sign-flip-inversion\
    \ process approximately √n times. At the end of this iteration, we get the correct\
    \ ket corresponding to X with very high probability. The probability of the answer\
    \ being wrong is O(1/n). We repeat the search until we are confident we have found\
    \ the correct result.\n\nI have skipped over the parts “put the items in the collection\
    \ in correspondence with the standard basis kets for m qubits” and “assume someone\
    \ gives us an oracle.” These are particular to each specific problem. In our example,\
    \ the collection is the set of standard basis kets for three qubits, and we code\
    \ the oracle as we saw in section 11.3.3.\n\n# Exercise 11.19\n\nWhat should we\
    \ do if the size of our collection is not a power of two?\n\n# 11.6 Searching\
    \ over two qubits\n\nGo back and look at Figure 11.7. What does this tell you\

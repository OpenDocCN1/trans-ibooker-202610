    in the original list starting with the item at position the_first_index up to
    but not including the item at the_second_index.


    ```

    the_list[1:3]

    [''b'', ''c'']

    ```


    +   - the_list[::2] returns a new list from the items in the original list starting
    with the first, and then including every second item.


    ```

    the_list[::2]

    [''a'', ''c'', ''e'']

    ```


    +   - the_list[1::3] returns a new list from the items in the original list starting
    with the second, and then including every third item.


    ```

    the_list[1::3]

    [''b'', ''e'']

    ```


    +   - the_list[::-1] returns a copy of the_list in reverse order.


    ```

    the_list[::-1]

    [''f'', ''e'', ''d'', ''c'', ''b'', ''a'']

    ```


    I think the technique of reversing the list is marvelous.'

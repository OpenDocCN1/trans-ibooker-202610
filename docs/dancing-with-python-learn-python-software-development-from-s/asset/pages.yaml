  md: '# 7.8.2 Formatting


    Python code tools such as **Sphinx** understand how to translate reStructuredText
    markup to create web and print documentation from your code.


    Surround text with double asterisks to embolden it: "**This is so bold**" yields
    **This is so bold**. Single asterisks give you italic text: "*I am italic*" yields
    *I am italic*. For a monospace font, use double backticks: "``This looks like
    code``" produces `This looks like code`.


    We separate paragraphs with a blank line. For bulleted lists, start each line
    with an asterisk:


    ```

    * The first item

    * The second item

    * The third item

    ```


    The markup produces


    +   - The first item

    +   - The second item

    +   - The third item


    Use "#" instead of "*" to get a numbered list.


    Your Python code and what you see from *help* and looking at `__doc__` will contain
    this formatting. It is only once a tool like **Sphinx** processes your code that
    you will see it beautifully displayed.


    The documentation for `__add__` contains markup like `:class:`UniPoly``. This
    is semantic markup that says, "**UniPoly** is a Python class, and you should format
    it in whatever fancy way you display classes." It also allows **Sphinx** to cross-reference
    the class and provide an automatic link to its definition.


    :class: is called a *role*. Others roles include


    +   - :attr: (data attribute / instance variable),

    +   - :const: (module-level constant),

    +   - :data: (module-level non-constant variable),

    +   - :exc: (exception),

    +   - :func: (function),

    +   - :meth: (method), and

    +   - :mod: (module).'

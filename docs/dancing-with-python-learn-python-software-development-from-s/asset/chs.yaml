  \n# D\n\n# The Complete Guitar\nClass Hierarchy\n\nThis appendix contains the complete\
  \ and final definition of the **Guitar** class for guitars that we developed in\
  \ *Chapter 7. Organizing Objects into Classes*.\n\n```\n```python\n\"\"\"The guitar\

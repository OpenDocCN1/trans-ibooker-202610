  \n图 13.5：水平条形图\n\n### 13.2.3 Adding colors and grid lines\n\n默认情况下，matplotlib 将每个条形显示为蓝色。如果使用单个颜色的\
  \ color 关键字参数，每个条形都将使用该颜色。你也可以提供一个颜色列表，为水平轴上的每个条形提供一种颜色。\n\n在下一个示例中，我使用三种灰色阴影来显示代表三类每日支持呼叫计数的条形。我还用水平黑色虚线绘制了网格。alpha\
  \ 参数决定线的不透明度。\n\n```\nimport matplotlib.pyplot as plt\n\ndays = [\"Monday\", \"\
  Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\"]\nsupport_calls = [21, 14, 10,\
  \ 9, 19]\n\n# create a list of colors for ranges of daily call values\ncolors =\
  \ []\nfor calls in support_calls:\n    if calls >= 15:\n        colors.append(\"\
  #505050\")\n    elif calls >= 10:\n        colors.append(\"#808080\")\n    else:\n\
  \        colors.append(\"#B0B0B0\")\n\n# add the bar chart title\nplt.title(\"Number\
  \ of Support Calls Per Day\")\n\n# draw horizontal lines\nplt.grid(color=\"black\"\
  , alpha=0.6, axis='y', linewidth=1, linestyle='--')\n\n# draw the bar chart\nbar_chart\
  \ = plt.bar(days, support_calls, color=colors)\n```\n\n<Figure size 432x288 with\

  \n我们预计当时非常年轻的人在 1995 年参加的音乐会很少或为零。对于 16 岁以上的人，我们预计会看到一些非零计数。此外，如果人们年纪较大并且在工作，他们可能会去参加更多的音乐会。散点图似乎支持这些假设。\n\
  \n两个等长数据集的协方差让我们了解一个数据集中的值是否随另一个数据集中的值线性增加或减少。如果协方差接近 0，我们不期望两个数据集中测量的特征之间存在线性关系。协方差为正意味着它们一起增加或减少，而为负则意味着一个增加时另一个减少。图\
  \ 14.2 表示协方差为正。\n\nnumpy 可以计算一般的协方差矩阵，但我们只需要其中的第一行的第二个位置的值。也就是说，索引 [0, 1] 处的值。\n\
  \n```\ncovariance_matrix = np.cov(ages, concerts_attended_in_1995)\ncovariance_matrix[0,\
  \ 1]\n```\n\n8.792323232323243\n\n我在第 14.5 节解释了为什么我们需要 [0, 1]。\n\n*皮尔逊相关系数*，通常简称为相关系数\
  \ *r*，是协方差除以每个数据集的标准差。这种除法将协方差归一化到 -1.0 到 1.0 之间。接近两个极端的值为“强相关”。另一种说法是，两个数据集之间存在非常强的线性关系。它并不意味着因果关系。\n\
  \n```\n```python\ncorrelation_coefficients = np.corrcoef(ages, concerts_attended_in_1995)\n\
  correlation_coefficients[0, 1]\n```\n\n0.8480108438760603\n```\n\n你可能会看到相关系数写成 ρ\
  \ 而不是 *r*。ρ 是希腊字母“rho”。\n\n给定两个数据集 *D* 和 *E*，其值分别为 *d*₀ 到 *d*ₙ 和 *e*₀ 到 *e*ₙ，协方差\
  \ Cov(*D*, *E*) 和相关系数 *r* 的公式如图所示 14.3。\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_565_0.png)\n\

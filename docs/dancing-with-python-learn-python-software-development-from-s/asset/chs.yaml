  \n# 12.2.5 使用正则表达式的建议\n\n虽然我已经涵盖了 Python 正则表达式实现的很多内容，但官方文档中还有几个额外的特性和微妙之处供你阅读。[PYR1]\
  \ [PYR2] 在你开始使用这个强大但有时也很复杂的工具时，下面几点你应该记住：\n\n- 如果 `str` 方法（如 `find` 和 `replace`）能完成你的任务，就使用那些方法，而不是引入额外的\
  \ `re` 机制。\n- 记住，`search` 在找不到匹配时返回 `None`。\n- 注意你要搜索的字符串的大小。如果文本是 50 个字符而不是 5 兆字节，你可能会选择不同的方法。例如，在后一种情况下，你可能会使用\
  \ `finditer` 而不是 `findall`。\n- 在创建正则表达式模式时，要注意收益递减的问题。例如，你可以对 `split` 返回的列表中的字符串使用\
  \ `strip`。\n- 在网上搜索可能接近你需求的正则表达式。\n- 正则表达式匹配在模式写得不好时可能会非常慢。要尽可能具体。例如，如果你知道自己要找的是字母数字字符，就不要用\
  \ `\".*\"` 而要用 `\\w*`。[FIT]\n- 正则表达式语法和所有特殊字符很容易忘记。需要的时候不要害怕去查阅。\n- 创建模式时，问问自己：“我是否应该在某个地方使用\
  \ `\\b` 或 `\\w`？”。\n\n# 12.3 自然语言处理入门\n\n自然语言处理（NLP）将文本及其包含的字符转化为含义。从含义中，我们获得知识和洞见，并可能采取行动。本节概述了\
  \ Python 中可用于 NLP 的一些工具。请参阅参考资料以获取关于具体工具的更多信息和示例。\n\n假设我站在厨房里说：\n\n“我正在做更多的油炸绿番茄。”\n\
  \n这如何转化为我烹饪食物的过程？\n\n第一步是知道是否有人或什么东西在听我说话，但这并不是编码问题。也许，我的女儿和我一起在厨房里，或者是一个虚拟个人助理（VPA），比如\
  \ Apple 的 Siri®、Amazon 的 Echo®（搭载 Alexa®）、Google Home™ 或 Microsoft Cortana®。\n\n\
  \n\n\n\n也许我们可以使用字符串替换：\n\n```python\ndef clean_text(text):\n    for wrong, right\
  \ in corrections.items():\n        text = text.replace(wrong, right)\n    return\
  \ text\n\nresult = clean_text(the_text)\nresult\n```\n\n“我在做更多油炸绿番茄。”\n\n不错！再看看如果我再次调用会怎样：\n\
  \n```python\nclean_text(result)\n```\n\n“我在做更多油炸绿番茄。”\n\n哎呀。我们忘了词边界。应该试试正则表达式。\n\
  \n```python\nimport re\n\ndef clean_text(text):\n    for wrong, right in corrections.items():\n\
  \        pattern = re.compile(fr\"\\b({wrong})\\b\")\n        text = pattern.sub(f\"\
  {right}\", text)\n    return text\n\nresult = clean_text(the_text)\nresult\n```\n\
  \n“我在做更多油炸绿番茄。”\n\n```python\nclean_text(result)\n```\n\n“我在做更多油炸绿番茄。”\n\n## 练习\
  \ 12.16\n\n为什么我在正则表达式模式字符串中使用了 `fr`？\n\n正则表达式方法奏效了。在实践中，我们会使用一个更大的拼写纠正列表。我们还可能将城市、州或国家缩写转换为其全称。我们也可以展开缩略词，例如将“I’ll”变为“I\
  \ will”。另一个常见任务是去除多余的空白。\n\n## 练习 12.17\n\n扩展 `clean_text`，将任何连续两个或更多空格的出现减少为单个空格。对连续的换行符也做同样处理。\n\
  \n我们在 `clean_text` 中使用 `sub` 来扫描整个字符串中的每一对错误词-正确词。对于大量文本上的数百个替换，`flashtext` 模块可能高效得多。`flashtext`\
  \ 不是 Python 标准库的一部分，你必须从操作系统命令行安装它。\n\n```\npip install flashtext\n```\n\n要处理替换，从\
  \ `flashtext` 导入 `KeywordProcessor`，加载纠正项，然后调用 `replace_keywords`：\n\n```python\n\
  from flashtext import KeywordProcessor\n\nkeyword_processor = KeywordProcessor(case_sensitive=True)\n\
  \nfor wrong, right in corrections.items():\n    keyword_processor.add_keyword(wrong,\
  \ right)\n\nresult = keyword_processor.replace_keywords(the_text)\nresult\n```\n\
  \n“我在做更多油炸绿番茄。”\n\n```python\nkeyword_processor.replace_keywords(result)\n```\n\n\
  “我在做更多油炸绿番茄。”\n\n对于超出词边界内精确文本的更复杂匹配，请使用正则表达式。\n\n## 12.3.3 使用 spaCy 进行 NLP\n\n为了超越字符、单词、数字、空白和模式，我们需要经过大量文档训练的更复杂工具，以识别词性、词根、短语、结构、人名和地名以及其他语言特征。一个这样的\
  \ Python 工具是 spaCy，你可以从命令行安装它作为 **spacy** 包。\n\n```sh\npip install spacy\npython\
  \ -m spacy download en_core_web_sm\n```\n\n本节介绍 **spacy** 的基本功能，但我鼓励你阅读教程和文档，以查看更多示例和功能广度。[SCY]\n\
  \n### 分词\n\n我们首先导入 **spacy**，并将“小型英语数据库”加载到 `nlp` 引擎中。\n\n```python\nimport spacy\n\
  \nnlp = spacy.load(\"en_core_web_sm\")\n```\n\n现在我们处理我们的文档，也就是前面示例中一直使用的字符串。在实践中，文档可能是一个段落、一篇文章、一本书、一个网页、一组社交媒体条目、一位客户的购买历史、聊天机器人问题，或任何我们想要分析的文本*语料库*。结果是一系列*词元*：\n\
  \n```python\ndoc = nlp(\"I'm making more fried green tomatoes.\")\n\nprint(\" |\
  \ \".join([token.text for token in doc]))\n```\n\n```text\nI | 'm | making | more\
  \ | fried | green | tomatoes | .\n```\n\n词元是一个单词或单词片段，*分词* 是创建词元的过程。\n\n### 词元与原形及词性\n\
  \n除了其包含的字符外，文档中的每个词元还包括语言属性。以下是文档词元及其一些属性的格式化表格：\n\n```python\nfor token in doc:\n\
  \    print(f\"{token.text:9} {token.lemma_:8} \"\n          f\"{token.pos_:8} {token.dep_:8}\"\
  )\n```\n\n| 词元 | 原形 | 词性 | 依存关系 |\n|---|---|---|---|\n| I | I | PRON | nsubj |\n\
  | 'm | be | AUX | aux |\n| making | make | VERB | ROOT |\n| more | more | ADV |\
  \ advmod |\n| fried | fried | ADJ | amod |\n| green | green | ADJ | amod |\n| tomatoes\
  \ | tomato | NOUN | dobj |\n| . | . | PUNCT | punct |\n\n第 1 列包含词元本身。唯一令人意外的条目是第一个和第二个，spacy\
  \ 将“I’m”拆分成了“I”和“’m”。如果我们先将缩略词展开为“I am”，我们也会看到两个词元。\n\n第 2 列列出了词根，也称为原形。在词形还原中，我们选择一个在所有可能形式中唯一的词。这里，“’m”的原形是“be”，就像“am”“are”“is”“be”“was”等一样。“making”的原形是“make”，“tomatoes”的原形是“tomato”。\n\
  \n第 3 列显示词性。[SCA]\n\n+   - ADJ：形容词\n+   - ADV：副词\n+   - AUX：助动词\n+   - NOUN：名词\n\
  +   - PRON：代词\n+   - PUNCT：标点符号\n+   - VERB：动词\n\n还有十几种其他词性，包括 ADP（附置词，通常是介词）、PROPN（专有名词）、CONJ（连词，如“and”“but”“or”）和\
  \ DET（限定词，如“a”“an”“the”）。\n\n### 依存关系\n\n第 4 列包含依存关系标签。\n\n+   - advmod：状语修饰语\n\
  +   - amod：形容词修饰语\n+   - aux：助动词\n+   - dobj：直接宾语\n+   - nsubj：名词性主语\n+   - punct：标点符号\n\
  +   - root：句子的根动词\n\n这些以及另外四十个依存标签超出了大多数人在学校所学的内容。当你想理解一个句子及其结构时，可能需要这种详细程度。\n\n\
  对我们句子的这种分解使我们能够分析它：\n\n+   - 从根开始问：“正在做什么？”：**making**\n+   - “它是否由助动词扩展？”[aux]：是——**am**\n\
  +   - “谁在做？”[nsubj]：**I**\n+   - “正在做什么？”[dobj]：**tomatoes**\n+   - “关于 tomatoes\
  \ 有更多信息吗？”[amod]：是——**green tomatoes**\n+   - “关于 green tomatoes 有更多信息吗？”[amod]：是——**fried\
  \ green tomatoes**\n+   - “关于 fried green tomatoes 有更多信息吗？”[advmod]：是——**more fried\
  \ green tomatoes**\n+   - “完成了吗？”[punct]：是！\n\n这在图 12.2 中由 spacy 生成的依存关系可视化中更容易看到：\n\
  \n```python\nfrom spacy import displacy\n\nnlp = spacy.load(\"en_core_web_sm\")\n\
  doc = nlp(\"I'm making more fried green tomatoes.\")\nformat_options = {\"distance\"\
  : 125, \"add_lemma\": True}\n```\n\n```python\ndisplacy.render(doc, style=\"dep\"\
  , options=format_options)\n```\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_496_0.png)\n\
  \n图 12.2：spaCy 生成的句子可视化\n\n`render` 生成一个可缩放矢量图形（SVG）文件，你可以直接使用它，或将其转换为 jpg 或 png\
  \ 图像。`options` 关键字参数是一个字典，控制图表格式的几个方面。`distance` 决定单词之间应以像素为单位的距离。默认值为 175，但我选择了\
  \ 125 以获得更紧凑的显示。通过 `add_lemma`，我告诉 `render` 在句子中的单词下方显示原形。\n\n### 命名实体\n\n现在，让我们看看命名实体。spacy\
  \ 有一个庞大的数据库，用于猜测某个单词或短语是否是一个特定的人、组织、地点、数量、日期、金额等。我说“猜测”是因为选择正确的实体取决于上下文。如果我的句子在讨论\
  \ Fiona Apple 的歌曲，然后下一句以“Apple”开头，那么我是在谈论这位歌手，还是在指水果或电脑公司？比“猜测”更好更准确的说法是“统计预测”。\n\
  \nspacy 在处理文本时会自动进行命名实体识别。\n\n```python\ndoc = nlp(\"William Shakespeare ate crumpets\
  \ in England in 1597.\")\n\nfor ent in doc.ents:\n    print(f'{ent.label_}: \"{ent.text}\"\
  ')\n```\n\nPERSON: \"William Shakespeare\"\nGPE: \"England\"\nDATE: \"1597\"\n\n\
  句子中的三个命名实体是：\n\n+   - William Shakespeare：PERSON（人名）\n+   - England：GPE（地缘政治实体）\n\
  +   - 1597：DATE（日期）\n\nspacy 可以通过生成带注释的 HTML 来帮助你可视化实体，如图 12.3 所示。\n\n```python\n\
  displacy.render(doc, style=\"ent\")\n```\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_497_0.png)\n\
  \n图 12.3：spaCy 生成的实体可视化\n\n\n\n\n\n# 练习 12.18\n\n**spacy** 在句子中识别出哪些实体：[C.N.W]\n\
  \n> “American Bill Gates was estimated to be worth $60 billion in 2000.”\n\n# 匹配\n\
  \n现在我们知道了 **spacy** 能识别出一些什么，让我们基于字面文本、词元和词性来进行一些匹配。我们首先导入 **Matcher** 类。\n\n```\n\
  ```python\nfrom spacy.matcher import Matcher\n```\n```\n\n我的目标是创建一个模式，可以判断我家里的某个人是否正在做饭、做过饭或将要做饭某种食物。**spacy**\
  \ 的模式是一个 Python 字典的列表。从上到下，我正在寻找与这些组件匹配的文档部分：\n\n```\n```python\npattern = [\n \
  \   {\"TEXT\": {\"IN\": [\"I\", \"brother\", \"father\", \"mother\", \"sister\"\
  ]}},\n    {\"OP\": \"*\"},\n    {\"POS\": \"VERB\", \"LEMMA\": {\"IN\": [\"bake\"\
  , \"cook\", \"make\"]}},\n    {\"OP\": \"*\"},\n    {\"LEMMA\": {\"IN\": [\"cake\"\
  , \"peach\", \"bean\", \"pea\", \"tomato\"]}}\n]\n```\n```\n\n模式从第 2 行开始，以可以 IN\
  \ 一个可能性列表中的显式 TEXT 开头。如果我只想匹配 \"brother\"，我会将其编码为 {\"TEXT\": \"brother\"}。如果你想更具语言技术性，可以使用\
  \ ORTH 代替 TEXT。\n\n第 3 行，我允许通过 {\"OP\": \"*\"} 出现零个或多个任意实例。这种形式类似于正则表达式 r\".*\"\
  。\n\n到目前为止，第 4 行是最有趣的。它说：“匹配一个词根形式为 \"bake\"、cook 或 make 的动词。”\n\n我再次允许零个或多个任意 token，并在第\
  \ 6 行通过尝试匹配一份食物列表来终止模式。我使用词元形式，以便我可以匹配食物的单数或复数形式。\n\n我们定义并使用 *callback function*，当我们在另一个函数中想要在某事发生时得到通知时。例如，我们可能会将回调传递给包含条件测试的函数。当测试评估为\
  \ True 时，该函数会调用回调。回调的关键字参数通常具有 None 默认值。\n\n当 **spacy** 找到匹配时，它会创建一个包含规则匹配的内部标识符、起始\
  \ token 索引以及结束 token 之后的索引的元组。我们编写回调函数 *on_match* 来打印匹配的文档部分：\n\n```\n```python\n\
  def on_match(matcher, doc, id, matches):\n    # Callback function for matcher\n\
  \    # Show the span of text that we matched\n    for id, start, end in matches:\n\
  \        print(doc[start:end])\n```\n```\n\n在你的工作中，你可能希望显示更多信息，例如词性。现在我们构建一个 matcher\
  \ 对象并向其添加模式。*add* 的第一个参数是模式列表的名称，第二个是该列表。我还传入了 *on_match*。\n\n```\n```python\nmatcher\
  \ = Matcher(nlp.vocab)\nmatcher.add(\"Cooking\", [pattern], on_match=on_match)\n\

  \n```\ncoverage --help\ncoverage report --help\ncoverage json --help\ncoverage html\
  \ --help\n```\n\n## 10.5 定义和使用装饰器\n\n到目前为止，我们已经多次使用 Python 装饰器，但现在是时候学习如何亲自编写装饰器了。我们见过以下装饰器：\n\
  \n+   - `@abstractmethod`：在第 7.1.3.2 节中，用于指示抽象基类中的某个方法，编写代码时必须重写该方法\n+   - `@classmethod`\
  \ 和 `@staticmethod`：在第 7.1.2 节中，用于定义类方法和静态方法\n+   - `@property`：在第 7.5 节中，用于从无参数的类实例方法定义属性\n\
  \n装饰器的核心思想如下：给定一个函数 `my_function`，我希望用一段调用 `my_function` 的附加代码将它包装起来。也就是说，我正在用额外的功能*装饰*\
  \ `my_function` 的外部。更进一步，我希望能够通过 `my_function` 使用添加了新装饰的原始代码。\n\n我将从一个打印 100 的简单函数开始。\n\
  \n```\ndef one_hundred():\n    return 100\n\none_hundred()\n```\n\n100\n\n```\n\
  one_hundred\n```\n\n<function __main__.one_hundred()>\n\none_hundred 是一个函数，也是一个一等\
  \ Python 对象。我希望每次运行 one_hundred 时都打印当前时间。我可以直接修改这个函数：\n\n```\nimport datetime\n\n\
  def one_hundred():\n    now = datetime.datetime.now()\n    print(f\"The time is\
  \ {now.strftime('%H:%M:%S')}\")\n    return 100\n```\n\n```\none_hundred()\n```\n\
  \nThe time is 12:48:28\n100\n\n装饰器可以大幅简化这一过程，而且我不必修改原始函数体。我将 one_hundred 重置为其原始定义，并创建\
  \ say_the_time。\n\n```\ndef one_hundred():\n    return 100\n```\n\n```\ndef say_the_time(func):\n\
  \    def wrapper():\n        now = datetime.datetime.now().strftime(\"%H:%M:%S\"\
  )\n        print(f\"The time is {now}\")\n        return func()\n    return wrapper\n\
  ```\n\nsay_the_time 接受一个参数 func，它是一个不带参数的函数。它定义了一个内部函数 wrapper，该函数会打印时间、计算 func()，并返回结果。然后，say_the_time\
  \ 返回 wrapper 函数。让我们看看它对 one_hundred 的作用：\n\n```\nh = say_the_time(one_hundred)\n\
  ```\n\n```\nh\n```\n\n<function __main__.say_the_time.<locals>.wrapper()>\n\n```\n\
  h()\n```\n\nThe time is 12:48:28\n100\n\nPython 打印出了日期和时间。当我们反转装饰器的顺序时，会先显示时间，然后显示日期。\n\
  \n```\n@say_the_time\n@say_the_date\ndef one_million():\n    return 100000\n\none_million()\n\
  ```\n\nThe time is 12:48:28\nThe day is August 11, 2021\n1000000\n\n你可以将装饰器用于带有普通参数和关键字参数的函数（第\
  \ 6.5 节）。在下一个示例中，我使用 *args 和 **kwargs 收集位置参数和关键字参数，并将它们传递给内部的 wrapper。\n\n```\n\
  # first define without the decorator\ndef adder_with_carry(a, b, carry=0):\n   \
  \ return a + b + carry\n\nadder_with_carry(10, 20, carry=1)\n```\n\n31\n\n```\n\
  def say_the_date(func):\n    def wrapper(*args, **kwargs):\n        now = datetime.datetime.now().strftime(\"\
  %B %d, %Y\")\n        print(f\"The day is {now}\")\n        return func(*args, **kwargs)\n\
  \    return wrapper\n\n# now use the decorator\n\n@say_the_date\ndef adder_with_carry(a,\
  \ b, carry=0):\n    return a + b + carry\n\nadder_with_carry(10, 20, carry=1)\n\
  ```\n\nThe day is August 11, 2021\n31\n\n只需添加或删除 `@decorator` 行，就可以添加或移除额外功能。\n\n\
  ### 练习 10.7\n\n编写一个装饰器函数 assert_first_arg_is_int，插入一条 assert 语句，用于检查传递给函数的第一个参数是否为\
  \ int。\n\n虽然我编写了 return func(*args, **kwargs)，但我也可以将结果保存到一个变量中，在 wrapper 函数中执行更多操作，然后再返回该值。\n\
  \n```\ndef enter_and_exit(func):\n    def wrapper(*args, **kwargs):\n        print(f\"\
  >>> Entering {func.__name__}\")\n        result = func(*args, **kwargs)\n      \
  \  print(f\">>> Exiting {func.__name__} with {result}\")\n        return result\n\
  \    return wrapper\n\n@enter_and_exit\ndef adder_with_carry(a, b, carry=0):\n \
  \   return a + b + carry\n\nadder_with_carry(10, 20, carry=1)\n```\n\n>>> Entering\
  \ adder_with_carry\n>>> Exiting adder_with_carry with 31\n31\n\n### 练习 10.8\n\n\

  \ NumPy 数组会更高效。\n\n## 13.1.7 NumPy 数组\n\n如果我们以字节为单位测量，Python 对象的大小是多少？让我们看看一个空字符串的大小。\n\
  \n```\nfrom sys import getsizeof\n\ngetsizeof(\"\")\n```\n\n`getsizeof` 是 **sys**\
  \ 模块中的一个函数，它返回对象使用的内存字节数。对于字符串的情况，它包括长度、字符本身，以及垃圾回收等过程的系统开销。如果我们添加一些文本，大小会变大，正如我们所期望的。\n\
  \n```\n```python\na = \"Better a witty fool, than a foolish wit.\"\nlen(a)\n```\n\
  ```\n\n40\n\n```\n```python\ngetsizeof(a)\n```\n```\n\n89\n\n一个包含字符数是 100 倍的字符串对象的大小大约是\
  \ 100 倍大，考虑到开销。\n\n```\n```python\nb = 100 * a\nlen(b)\n```\n```\n\n4000\n\n```\n\
  ```python\ngetsizeof(b)\n```\n```\n\n4049\n\n如果包含这两个字符串的列表呢？\n\n```\n```python\n\
  getsizeof([a, b])\n```\n```\n\n72\n\n这很奇怪，而且远小于字符串大小的总和。如果我们有一个包含较长字符串两个副本的列表，大小也是相同的。\n\
  \n```\n```python\ngetsizeof([b, b])\n```\n```\n\n72\n\n如果我们包含第三个副本，字节数会适度增加。\n\n\
  ```\n```python\ngetsizeof([b, b, b])\n```\n```\n\n80\n\ngetsiz​​eof 测量对象的大小，**但不测量它所引用的对象的大小。**\
  \ 在这个例子中，`getsizeof` 没有包含列表中字符串的大小。我们可以用以下类似的函数来更好地近似实际使用的总内存量：\n\n```\n```python\n\
  def getsizeof_list(the_list):\n    size = getsizeof(list)\n    for item in the_list:\n\
  \        size += getsizeof(item)\n    return size\n```\n```\n\n```\n```python\n\
  x_values = list(range(1000))\ngetsizeof_list(x_values)\n```\n```\n\n28404\n\n###\
  \ 练习 13.2\n\n> 如果列表包含集合、字典或另一个列表，`getsizeof_list` 的结果是否正确？编写一个新函数，递归地测量对象及其包含内容的大小。\n\
  \n通过将数据紧密地连续打包在内存中，可以更高效地存储数值数据。这种结构称为 *array*，NumPy 是一个广泛使用的 Python 包，包含强大的多维数组支持。NumPy\
  \ 自称“Python 科学计算的基础包”，我同意。[ANN] [NPY] [NUM] 按照传统，我们将 NumPy 包导入为 np。\n\n```\n```python\n\
  import numpy as np\n```\n```\n\n*arange* 函数类似于 *range*，但它比使用迭代器、生成器或列表更高效地构建数组。\n\
  \n```\n```python\nx_values_array = np.arange(1000)\n\ngetsizeof(x_values_array)\n\
  ```\n```\n\n4104\n\n看看数组从 0 到 999 的整数使用的内存比上面的列表少多少？size 函数返回数组中的项目数。\n\n```\nx_values_array.size\n\
  ```\n\n1000\n\n正如我们在第 5.2 节看到的那样，Python 可以计算任意大的整数。当我们知道整数的值是有界的时，我们可以使用固定数量的字节来容纳数字。items\
  \ size 属性获取每个项目使用的大小。\n\n```\nx_values_array.itemsize\n```\n\n4\n\n这个结果说明每个整数值使用\

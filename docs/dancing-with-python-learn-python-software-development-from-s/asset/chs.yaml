  \ √n 次符号翻转-反转过程。在此迭代结束时，我们以非常高的概率得到对应于 X 的正确 ket。答案错误的概率为 O(1/n)。我们重复搜索，直到确信找到了正确的结果。\n\
  \n我跳过了“将集合中的项目与 m 个量子比特的标准基 ket 对应起来”和“假设有人给我们一个 oracle”这两个部分。这些是特定于每个具体问题的。在我们的示例中，集合是三个量子比特的标准基\
  \ ket 的集合，我们按第 11.3.3 节中看到的方式编码 oracle。\n\n### 练习 11.19\n\n如果我们集合的大小不是 2 的幂，该怎么办？\n\

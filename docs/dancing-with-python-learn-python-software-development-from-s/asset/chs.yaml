  \ Python 3。请寻找最近五年内撰写的文章。如果你看到使用 *print* 且后面没有左括号的代码，那就不要读了。他们讨论的是 Python 2，而不是\
  \ Python 3。\n\n我认为 **Real Python** 网站\n\nhttps://realpython.com/\n\n一直提供关于 Python\
  \ 编码大多数方面的有用且全面的文章。你可以免费阅读的文章数量有限，之后他们会要求你注册并付费。（我与他们没有商业关系。）\n\n**W3Schools** 上的\

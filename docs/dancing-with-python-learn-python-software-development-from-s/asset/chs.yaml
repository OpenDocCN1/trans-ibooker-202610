  \ 0.1917, 0.0000])\n```\n\nPCA 通过尝试捕获最大量的方差来创建新的第一个特征。也就是说，第一个特征包含了我们能够转换到一个特征中的尽可能多的信息。`pca.explained_variance_ratio_`中的第一个元素是\
  \ 0.4045，这意味着第一个特征包含了 DataFrame 中原始信息的大约 40.45%。\n\n第二个特征与第一个特征“正交”，这意味着它包含了第一个新特征未表示的其他信息。与第一个特征相比，第二个特征代表了另一个维度。它捕获了\
  \ DataFrame 中额外 20.6% 的信息。\n\n随后，PCA 算法会继续构建维度，直到达到你在`n_components`关键字参数中指定的数量。\n\

  假设我有一个盒子，里面装有 8 个可调光的灯泡。它们在某种程度上都是不同的，所以我能区分它们。我给它们编号为 0 到 7，或者用二进制表示为 000 到 111。更好的是，我用量子态\
  \ |000⟩ 到 |111⟩ 来标记它们，正如我们在 9.6.5 节中看到的那样。开始时，每个灯泡都处于半暗状态，如图 11.2 所示。这个例子只是一个类比，所以灯泡并不是真的以量子方式运作。\n\
  \n![](img/4ffeafa3e3f1373f02971e43b0755ea6_443_0.png)\n\n如果我使用量子比特术语，我会说我们拥有灯泡的一个平衡的“变暗”叠加态。在这个类比中，如果一个灯泡更接近于完全点亮，那么我“测量”它为完全点亮的可能性就大于测量它为熄灭的可能性。如果它更接近于完全熄灭，那么我更有可能测到它是熄灭的。\n\
  \n因为它们处于半暗状态，如果我根据概率法则对它们进行“测量”来决定它们是亮还是灭，我预计大约一半的灯会亮，一半会灭。图 11.3 展示了这种情况。\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_444_0.png)\n\
  \n图 11.3：八个灯泡，一半灭，一半亮\n\n在我们继续调暗之前，我打算把灯泡扔掉。\n\n什么？\n\n如果我把灯泡一个接一个地依次扔到地板上，这个过程是\
  \ O(n)，这里 n 是 8。如果我让八个人同时各扔一个灯泡，分发灯泡的过程是 O(n)，所以整个过程也是 O(n)。如果我一次性把整个盒子扔下去，我就是同时对每个灯泡做了一件事。这是\
  \ O(1)。\n\n我现在有一个新的装有八个可调光灯泡的盒子。如果我们能设法以某种同时对灯泡起作用的方式来搜索某个特定的灯泡，也许我可以做得比 O(n) 更好。这就是\
  \ Grover 搜索算法的思想。我执行某个动作 O(√n) 次，这样当之后我“测量”所有灯泡时，最亮的那一个就是我寻找的。\n\n假设我想找到标记为 |000⟩\

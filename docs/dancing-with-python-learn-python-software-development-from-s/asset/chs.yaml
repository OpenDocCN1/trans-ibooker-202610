  \ bd |11⟩\n\n我们也可以对两个 1 量子比特门取张量积。\n\n如果 A 和 B 是两个 1 量子比特门，那么\n\n(A ⊗ B)(|φ⟩ ⊗ |ψ⟩)\
  \ = (A |φ⟩) ⊗ (B |ψ⟩)\n\n就是一个 2 量子比特门。\n\n例如，如果 A = B = H，即哈达玛门，那么\n\nH |0⟩ = (√2/2)\
  \ |0⟩ + (√2/2) |1⟩\n\n### 练习 9.38\n\n证明 |a|² + |(cos(φ) + sin(φ) i) b|² = 1。\n\n\

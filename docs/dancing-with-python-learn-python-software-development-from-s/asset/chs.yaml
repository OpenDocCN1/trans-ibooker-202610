  \ 中把它转换为**浮点数**时，会得到一个近似值。随着我们使用量子门和量子电路，舍入误差会悄然出现。\n\n```python\nimport math\n\n\
  a = math.sqrt(3)/2\nb = 1/2\n(a, b)\n```\n\n`(0.8660254037844386, 0.5)`\n\n```python\n\
  abs(a)**2 + abs(b)**2\n```\n\n`0.9999999999999999`\n\n你会学会识别一些在量子计算中反复出现的数。特别是，$\\\
  pm\\sqrt{2}/2$ 和 $\\pm\\sqrt{2}/2\\,i$ 的**浮点**和**复数**近似值如下：\n\n```python\nfor x\
  \ in (1, -1, 1j, -1j):\n    print(x * math.sqrt(2)/2)\n```\n\n```text\n0.7071067811865476\n\
  -0.7071067811865476\n0.7071067811865476j\n-0.7071067811865476j\n```\n\n在文献中，你有时会看到\
  \ $\\sqrt{2}/2$ 被写成与之等价的 $1/\\sqrt{2}$。\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_378_0.png)\n\
  \n### Z 量子门\n\n**Z** 门改变 $|1\\rangle$ 振幅的符号。\n\n**Z**: $a\\,|0\\rangle + b\\,|1\\\
  rangle \\mapsto a\\,|0\\rangle - b\\,|1\\rangle$\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_378_1.png)\n\
  \n我们称 **Z** 为*相位翻转*，原因来自量子力学的物理。\n\n### Y 量子门\n\n**Y** 门是我们见到的第一个使用非实数复数的单量子比特门。\n\
  \n**Y**: $a\\,|0\\rangle + b\\,|1\\rangle \\mapsto -bi\\,|0\\rangle + ai\\,|1\\\
  rangle$\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_380_0.png)\n\n**Y** 既是比特翻转，也是相位翻转。我们可以把它重写为\n\
  \n**Y**: $a\\,|0\\rangle + b\\,|1\\rangle \\mapsto (-i)(b\\,|0\\rangle - a\\,|1\\\
  rangle) = (-i)\\,\\mathbf{ZX}(a\\,|0\\rangle + b\\,|1\\rangle)$\n\n因为 $|-i| = 1$，所以应用\
  \ **Y** 得到的量子态与应用 **X** 后再应用 **Z** 得到的量子态等价。如果我们有 **X** 和 **Z**，那么 **Y** 就是多余的。\n\
  \n### 练习 9.26\n\n证明 $XY = -YX$，$ZY = -YZ$，以及 $YY = \\mathrm{id}$。\n\n我在 *《与量子比特共舞》*\
  \ 的 7.6.3 节中介绍了 **Y** 门。[DWQ]\n\n### H 量子门\n\n**H** 门又称阿达马门，得名于雅克·阿达马，它作用在 $|0\\\
  rangle$ 和 $|1\\rangle$ 上如下：\n\n$\\mathbf{H}(|0\\rangle) = (\\sqrt{2}/2)(|0\\rangle\
  \ + |1\\rangle)$，且 $\\mathbf{H}(|1\\rangle) = (\\sqrt{2}/2)(|0\\rangle - |1\\rangle)$。\n\
  \n![](img/4ffeafa3e3f1373f02971e43b0755ea6_380_1.png)\n\n经过简单的代数运算，我们得到\n\n\\[\n\
  \\begin{aligned}\n\\mathbf{H}(a|0\\rangle + b|1\\rangle)\n&= a\\,\\mathbf{H}(|0\\\
  rangle) + b\\,\\mathbf{H}(|1\\rangle)\\\\\n&= a(\\sqrt{2}/2)(|0\\rangle + |1\\rangle)\
  \ + b(\\sqrt{2}/2)(|0\\rangle - |1\\rangle)\\\\\n&= a(\\sqrt{2}/2)|0\\rangle + a(\\\
  sqrt{2}/2)|1\\rangle + b(\\sqrt{2}/2)|0\\rangle - b(\\sqrt{2}/2)|1\\rangle\\\\\n\
  &= (\\sqrt{2}/2)(a+b)|0\\rangle + (\\sqrt{2}/2)(a-b)|1\\rangle.\n\\end{aligned}\n\
  \\]\n\n这是一张占位图片。我用它来测试 API。\n\n### CNOT 量子门\n\n在量子情形下，CNOT 更准确的说法是受控 X 门或 CX 门。\n\
  \n![](img/4ffeafa3e3f1373f02971e43b0755ea6_385_0.png)\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_385_1.png)\n\
  \n如果第一个量子比特的量子态是 $|1\\rangle$，就对第二个量子比特施加 X；如果状态是 $|0\\rangle$，则第二个量子比特的状态保持不变。\n\
  \n上方的门作用为\n\n$\\mathrm{CNOT}(|0\\rangle \\otimes (a|0\\rangle + b|1\\rangle)) =\
  \ |0\\rangle \\otimes (a|0\\rangle + b|1\\rangle) = a|00\\rangle + b|01\\rangle$。\n\
  \n下方的门作用为\n\n$\\mathrm{CNOT}(|1\\rangle \\otimes (a|0\\rangle + b|1\\rangle)) =\
  \ |1\\rangle \\otimes X(a|0\\rangle + b|1\\rangle) = |1\\rangle \\otimes (b|0\\\
  rangle + a|1\\rangle) = b|10\\rangle + a|11\\rangle$。\n\n我在 *《与量子比特共舞》* 的 8.3.3\
  \ 节中介绍了 CNOT / CX 门。[D.W.Q]\n\n### SWAP 量子门\n\nSWAP 交换两个量子比特的量子态。\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_385_2.png)\n\
  \n\n### 其他受控门\n\n我们可以为任何量子门的执行添加一个控制量子比特，不仅仅是 X 门。在图 9.10 的电路中，顶部量子比特的状态控制着我们是否将\
  \ X、Y、Z 和 H 门应用到其他量子比特上。从左到右，我们有 CX（= CNOT）、CY、CZ、CZ（另一种形式）和 CH。\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_387_0.png)\n\
  \n图 9.10：CX、CY、CZ 和 CH 量子门\n\n控制端不必从上到下。它们可以沿任一方向，而且如你所见，可以跨量子比特跳跃。\n\n### 张量积门\n\
  \n正如我们可以对两个单独的量子态取张量积\n\n|φ⟩ = a |0⟩ + b |1⟩ 和 |ψ⟩ = c |0⟩ + d |1⟩\n\n得到一个 2 量子比特的量子态，\n\

  \n### 7.4.1 取负\n\n我现在通过`__neg__`定义取负运算，通过对每个系数应用“ - ”来创建新的多项式。在`UniPoly`的第三个版本中，我扩展了`__init__`，使其接受一个系数和一个指数。\n\
  \n```python\nclass UniPoly:\n    # UniPoly creates univariate polynomials with integer\
  \ coefficients\n    # Version 3\n\n    def __init__(self,\n        coefficient=1,\n\
  \        indeterminate='x',\n        exponent=0):\n\n        # Create a UniPoly\
  \ object from an integer coefficient,\n        # string indeterminate, and non-negative\
  \ integer\n        # exponent\n\n        if not isinstance(coefficient, int):\n\
  \            raise ValueError(\n                \"The coefficient for a UniPoly\
  \ must \"\n                \"be an int.\")\n\n        if not isinstance(exponent,\
  \ int) or exponent < 0:\n            raise ValueError(\n                \"The exponent\
  \ for a UniPoly must \"\n                \"be a non-negative int.\")\n\n       \
  \ if (not isinstance(indeterminate, str) or\n            len(indeterminate) != 1\
  \ or\n            not indeterminate[0].isalpha()):\n            raise ValueError(\n\
  \                \"The indeterminate for a UniPoly must \"\n                \"be\
  \ an alphabetic str of length 1.\")\n\n        # The 'variable' for the polynomial\n\
  \        self.indeterminate = indeterminate\n\n        # The terms in the polynomial.\
  \ Each key is an int\n        # exponent and each value is the int coefficient.\n\
  \n        if coefficient != 0:\n            self.terms = {exponent: coefficient}\n\
  \        else:\n            self.terms = dict()\n\n    def __neg__(self):\n    \
  \    # Negate the polynomial term-wise unless it is already 0.\n        if not self.terms:\n\
  \            return self\n\n        new_poly = UniPoly(0, self.indeterminate)\n\
  \        for exponent in self.terms:\n            new_poly.terms[exponent] = -self.terms[exponent]\n\
  \n        return new_poly\n\n    def __repr__(self):\n        return str(self)\n\
  \n    def __str__(self):\n        # Do a very rough and incomplete conversion to\
  \ str.\n\n        if not self.terms:\n            return '0'\n\n        print_terms\
  \ = [\n            f\"{self.terms[exponent]}*{self.indeterminate}**{exponent}\"\n\
  \            for exponent in sorted(self.terms, reverse=True)\n        ]\n\n   \
  \     return \" + \".join(print_terms)\n```\n\n现在我们验证一下我们可以对多项式取负：\n\n```python\n\
  p = UniPoly(2, 'z', 5)\n```\n\n```python\np, -p\n```\n\n```\n(2*z**5, -2*z**5)\n\
  ```\n\n```python\nUniPoly(0), -UniPoly(0)\n```\n\n```\n(0, 0)\n```\n\n在我的`__neg__`定义中（第43行），我复制了`self`的实例数据，只是对系数取了负。我没有改变`self`中`terms`字典里的系数。如果我改变了，任何指向原始多项式的变量都将指向一个取负后的版本。\n\
  \n### 7.4.2 布尔转换\n\n虽然我本可以通过以下方式定义`__bool__`：\n\n```python\ndef __bool__(self):\n\

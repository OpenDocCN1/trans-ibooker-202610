  np_float_formatter = \"{:.4f}\".format\nnp.set_printoptions(formatter={'float_kind':np_float_formatter})\n\
  ```\n\n### 15.3 Feature scaling\n\n由于我们现在有了维度，几何学进入画面也就顺理成章了。如果我在笛卡尔平面上有两个点，v =\
  \ (v₁, v₂) 和 w = (w₁, w₂)，那么它们之间的欧几里得距离，或简单地说是距离，为\n\n‖v − w‖ = √((v₁ − w₁)² + (v₂\
  \ − w₂)²)\n\n\n\n例如，点 (-3, -1) 和 (2, 1.5) 之间的距离约为 5.6。请注意两点之差周围的双竖线。\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_609_0.png)\n\
  \n用文字表述，我们说任意两点之间的距离等于对应坐标之差的平方和的平方根。在三维空间中，距离公式为\n\n```\n||v - w|| = sqrt((v₁ -\
  \ w₁)² + (v₂ - w₂)² + (v₃ - w₃)²)\n```\n\n其中点为 (v₁, v₂, v₃) 和 (w₁, w₂, w₃)。请注意，当点具有两个或更多维度时，使用粗斜体字体的约定：v\
  \ = (v₁, v₂, v₃)。\n\n这些是数轴上两个数 v 和 w 之间距离公式的推广，该距离即绝对值。\n\n```\n|v - w| = sqrt((v\
  \ - w)²)\n```\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_609_1.png)\n\n我们的 DataFrame\

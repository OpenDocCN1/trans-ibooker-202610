  在本节中，我们处理两个量子比特。如果量子比特 $q_0$ 的量子态为\n\n$|\\psi_0\\rangle = a_0 |0\\rangle + b_0 |1\\\
  rangle$\n\n且量子比特 $q_1$ 的量子态为\n\n$|\\psi_1\\rangle = a_1 |0\\rangle + b_1 |1\\rangle,$\n\
  \n那么它们的2量子比特量子态为\n\n$|\\psi_0\\rangle \\otimes |\\psi_1\\rangle = (a_0 |0\\rangle\
  \ + b_0 |1\\rangle) \\otimes (a_1 |0\\rangle + b_1 |1\\rangle) =$\n$a_0 a_1 |00\\\
  rangle + a_0 b_1 |01\\rangle + b_0 a_1 |10\\rangle + b_0 b_1 |11\\rangle.$\n\n我们能把所有2量子比特量子态都写成这种形式吗？**不能。**\n\
  \n如果一个2量子比特量子态可以写成单量子比特态 $|\\psi_0\\rangle$ 和 $|\\psi_1\\rangle$ 的 $|\\psi_0\\rangle\
  \ \\otimes |\\psi_1\\rangle$ 形式，那么这些量子比特就是*可分离的*。否则，量子比特就是*纠缠的*。纠缠是量子计算的一个基本性质。\n\
  \n一个简单的可分离态是 $(\\sqrt{2}/2)|00\\rangle + (\\sqrt{2}/2)|01\\rangle$，因为它等于 $|0\\rangle\
  \ \\otimes ((\\sqrt{2}/2)|0\\rangle + (\\sqrt{2}/2)|1\\rangle)$。这里 $|\\psi_0\\rangle\
  \ = |0\\rangle$，$|\\psi_1\\rangle = (\\sqrt{2}/2)|0\\rangle + (\\sqrt{2}/2)|1\\\
  rangle$。当我测量 $|\\psi_0\\rangle$ 时，它不会告诉我关于 $|\\psi_1\\rangle$ 的任何信息。\n\n相反，考虑\n\n\
  $(\\sqrt{2}/2)|00\\rangle + (\\sqrt{2}/2)|11\\rangle.$\n\n让我们测量第一个量子比特，而暂时不管第二个。如果我们得到0，我们必定是从\
  \ $|00\\rangle$ 得到它的，因为 $|11\\rangle$ 中的第一个量子比特会给出1。因此，第二个量子比特**必须**测量为0，即 $|00\\\
  rangle$ 中的第二个分量。类似地，如果我们测量第二个量子比特并得到1，那么第一个量子比特也必定测量为1，这来自 $|11\\rangle$。这些量子比特的行为是纠缠的，它们失去了独立性。\n\
  \n量子态 $(\\sqrt{2}/2)|00\\rangle + (\\sqrt{2}/2)|11\\rangle$ 是四个纠缠贝尔态之一：\n\n$|\\\
  Phi^+\\rangle (\\sqrt{2}/2)|00\\rangle + (\\sqrt{2}/2)|11\\rangle \\quad |\\Psi^+\\\
  rangle (\\sqrt{2}/2)|01\\rangle + (\\sqrt{2}/2)|10\\rangle$\n\n$|\\Phi^-\\rangle\
  \ (\\sqrt{2}/2)|00\\rangle - (\\sqrt{2}/2)|11\\rangle \\quad |\\Psi^+\\rangle (\\\
  sqrt{2}/2)|01\\rangle - (\\sqrt{2}/2)|10\\rangle$\n\n这里有两件事我想让你记住：\n\n- 1. 当你看到\
  \ √2/2 时，想到 **H** 门。\n- 2. 当你需要纠缠时，想到 **CNOT** 门。\n\n右侧的电路片段创建了贝尔态。把它看作一个可复用的量子函数。我们可以很容易地用Python中的Qiskit构建它。\n\
  \n![](img/4ffeafa3e3f1373f02971e43b0755ea6_409_0.png)\n\n```\ncircuit = QuantumCircuit(2)\n\
  circuit.h(0)\ncircuit.cnot(0, 1)\n```\n\n```\ncircuit.draw(**draw_kwargs)\n```\n\
  \n![](img/4ffeafa3e3f1373f02971e43b0755ea6_409_1.png)\n\n# 练习 9.44\n\n|11⟩、|01⟩、|00⟩\
  \ 和 |10⟩ 中哪一个产生了四个贝尔态中的每一个？\n\n我们在量子计算的许多地方使用纠缠，包括在您可能本想复制数据的算法中。爱因斯坦起初并不相信纠缠，并称之为“幽灵般的超距作用”。纠缠的量子粒子在很大、有时甚至天文学尺度的距离上保持其相关性。\n\
  \n纠缠将量子系统的不同部分联系在一起，因此您无法通过观察单个组件来了解其中包含的所有信息。John Preskill教授将这一情况比作必须一次读完一本书的一个章节才能理解其内容，而不是一页一页地阅读。[QEF]\n\
  \n![](img/4ffeafa3e3f1373f02971e43b0755ea6_409_2.png)\n\n我在《Dancing with Qubits》一书的8.2节中介绍了量子比特纠缠。[DWQ]\n\
  \n\n\n\n\n## 9.8 量子门的普适性\n\n对于一本编程书籍来说，量子计算中通用门集的存在性大多是学术性的，但值得简单讨论一下，以与经典情况互补。\n\
  \n与经典情况不同，1量子比特门有无限多个。RX_φ、RY_φ和RZ_φ就给出了这样一个集合，其中0 ≤ φ < 2π。如果我们无法精确地生成这些门，就需要尽量接近地逼近它们。我们修改定义：如果我们可以用这些门构建一个电路，并以任意精度逼近任何n量子比特门，那么这组量子门就是普适的。[TCN]\n\
  \n我们需要量子比特纠缠，这在经典中没有对应物。\n\n最后，在X、Y、Z、H和CNOT这些优雅的门之下，我们需要了解在任何给定的量子计算技术中，工程师在硬件中实现了哪些门。例如，这些门在“超导transmon”、“离子阱”、“量子点”和“光子”量子比特方法中有所不同，并且可能在每个类别内部也有差异。[DRQ]\
  \ 我们能否从硬件门出发近似生成我们想要的任何门？\n\n研究人员已经发现了几个量子门的通用集，包括：\n\n-   所有1量子比特门加上CNOT，\n-  \
  \ Toffoli CCX、Hadamard H和S\n\n以及\n\n-   CNOT、Hadamard H和T。\n\n在实践中，通过Qiskit可用或你可以用电路自行构建的门集非常大。我们重点讨论这些门。\n\
  \n## 9.9 小结\n\n本章探讨了经典计算的门与电路基础。它展示了底层编码者如何构建位加法和更高级别的函数。然后，我们转向量子门与电路。虽然我们使用了相同的术语，但编程模型有着根本性的不同。特别是，叠加和纠缠带来了仅靠经典技术无法获得的行为和工具。\n\
  \n下一章，我们将研究测试和优化代码的技术，无论是经典代码还是量子代码。我们已经通过使用Qiskit的transpile函数为通用和硬件特定用途优化量子门时看到了一些相关内容。\n"
- "## 10\n\n## 优化和测试你的代码\n\n> *经验是每个人赋予自己错误的名称。*\n> \n> ——奥斯卡·王尔德，*《温德米尔夫人的扇子》*\n\n\
  如果我们的代码完美无缺，那将是多么美妙。它会以最有效的方式运行，并且会完全按照我们的意图从第一次就表现出来。不会有任何一行或一个表达式是无用的。它会在标准情况下以及软件用户扔给我们的每一个怪异的转折中正确执行。\n\
  \n在本章中，我们面对现实。代码在开始时通常有一个或多个bug。你的编程编辑器（例如Visual Studio Code）可能会帮助你处理语法错误，但语义错误可能更难发现。我们首先学习广泛使用的测试代码的技术，从简单的健全性检查到有组织的、可重复的过程。然后，我们查看代码运行所需的时间，并给出提高性能的建议。你的所有代码都被使用了吗？我们考察一下“覆盖率”的概念，看看我们编写的所有代码是否都被测试和执行。最后，我们研究Python装饰器，学习如何在不修改原始代码的情况下向函数和方法添加额外功能。\n\
  \n## 本章涵盖的主题\n\n-   10.1 测试你的代码  384\n-   10.2 测量代码运行时间  391\n-   10.3 优化你的代码  393\n\
  -   10.4 查找孤立代码  400\n-   10.5 定义和使用装饰器  403\n-   10.6 小结  408\n\n## 10.1 测试你的代码\n\
  \n你编写的代码必须在所有可能的情况下对所有可能的输入都能工作。因此，你必须设计一个测试系统，确保所有可能性都被覆盖，并且结果是正确的。\n\n这是一个强有力的说法，如果你编写“快速而粗糙”的一次性代码或仅供自己使用，你可能会放宽规则。如果你要分享你的代码，或者它将作为生产环境的一部分，测试是必不可少的。\n\
  \n### 10.1.1 __debug__\n\n默认情况下，系统变量__debug__为True。此设置允许你编写如下代码：\n\n```\nfrom src.code.unipoly\
  \ import UniPoly\n\nx = UniPoly(1, \"x\", 1)\n\ndef square_poly(p):\n    if __debug__:\n\
  \        print(f\"Argument {p = }\\n\")\n    return p*p\n\nsquare_poly(x**2 - 3*x\
  \ + 7)\n```\n\nArgument p = x**2 - 3*x + 7\n\nx**4 - 6*x**3 + 23*x**2 - 42*x + 49\n\
  \n注意，我从特定文件夹路径“src.code.unipoly”导入了UniPoly。你可能需要根据你对该模块的使用情况将其更改为其他路径。我在第7章“将对象组织成类”中介绍了UniPoly。\n\
  \n```\niterative_factorial(1.3)\n\nFile \"<stdin>\", line 1, in \"<module>\"\nFile\
  \ \"<stdin>\", line 2, in iterative_factorial\nAssertionError\n```\n\n更具体地说，在条件后面包含一条消息：\n\
  \n```\ndef iterative_factorial(n):\n    assert isinstance(n, int), \"n not an int\"\
  \n    assert n >= 0, \"n < 0\"\n\n    product = 1\n    for i in range(1, n + 1):\n\
  \        product *= i\n    return product\n```\n\n```\niterative_factorial(-1.3)\n\
  \nFile \"<stdin>\", line 1, in \"<module>\"\nFile \"<stdin>\", line 2, in iterative_factorial\n\
  AssertionError: n not an int\n```\n\n```\niterative_factorial(-17)\n\nFile \"<stdin>\"\
  , line 1, in \"<module>\"\nFile \"<stdin>\", line 3, in iterative_factorial\nAssertionError:\
  \ n < 0\n```\n\n你可以在一个assert语句中测试多个条件，但我更喜欢将它们分开，以便查看哪个测试失败了。\n\n使用assert是有开销的，因为Python必须计算每个条件。如果你在代码开发早期添加了断言，一旦你确信一切正常，就可以删除它们。启动Python时使用-O或-OO会关闭所有assert条件检查。\n\
  \n### 10.1.3 pytest\n\n假设你编写了一个函数或类。通常，它们不会单独存在，而是包含在模块、包或项目中。尽管如此，对每个组件进行正确行为测试是合理的。运行并强调一段代码的软件称为单元测试。\n\
  \n```\n\"\"\"Tests that a multiplication fails.\"\"\"\nx = UniPoly(1, 'x', 1)\n\
  p = x + 1\nq = x - 1\n>     assert p * q == x * x + 1\nE     assert x**2 - 1 ==\
  \ x**2 + 1\nE       Use -v to get the full diff\n\nunipoly.py:732: AssertionError\n\
  =========================== short test summary info ===========================\n\
  FAILED unipoly.py::test_bad_multiplication - assert x**2 - 1 == x**2 + 1\n===========================\
  \ 1 failed, 1 passed in 0.10s ============================\n```\n\n这里有很多信息，包括操作系统、pytest版本、已安装的测试插件、断言失败的代码、原始断言以及求值后的断言。输出中未提及test_good_addition，因为断言条件为True。\n\
  \npytest会查看输入文件，并处理所有名称以“test_”开头的函数。\n\n通常，我不会定义像test_bad_multiplication这样的函数，而是会编写类似这样的代码：\n\
  \n```\ndef test_multiplication():\n    \"\"\"Tests polynomial multiplication.\"\"\
  \"\n    x = UniPoly(1, 'x', 1)\n    p = x + 1\n    q = x - 1\n    assert 0 * p ==\
  \ 0\n    assert p * 0 == 0\n    assert 1 * p == p\n    assert -1 * p == -p\n   \
  \ assert p * 1 == p\n    assert 2 * p == p * 2\n    assert p * q == q * p\n    assert\
  \ p * q == x * x - 1\n    # ... more multiplication tests\n```\n\n我会对每个函数和方法都这样做。\n\
  \n## 练习10.1\n\n在图10.1中，对于60 ≤ n ≤ 65的2ⁿ的*timeit*时间曲线中，当n = 64时出现了奇怪的现象。解释为什么我们会看到执行时间的大幅增加。（提示：参见5.2节。）\n\
  \n![](img/4ffeafa3e3f1373f02971e43b0755ea6_420_0.png)\n\n你可以通过定义一个函数，来评估比容易放入`stmt`字符串中更多的代码。\n\
  \n```\ndef f(n):\n    assert n > 6\n\n    the_list = []\n    for x in range(n):\n\
  \        the_list.append(x)\n    for _ in range(10):\n        the_list += the_list\n\
  \        the_list = the_list[5:]\n```\n\n*f*是一个低效的无意义函数，它创建一个列表，将其追加到自身，进行切片，并重复十次。使用`globals`关键字参数，让*timeit*可以使用你的局部定义。\n\
  \n```\ncount = 1000\ntimeit.timeit(stmt=\"f(100)\", number=count, globals=globals())\n\
  ```\n\n0.9215112999999997\n\n\n\n\n先让你的代码正确，然后在必要时让代码更快。\n\n## 10.3.1 使用现有代码\n\n\
  是否存在一个 Python 库，提供与你想要或需要的功能接近的功能？如果有，请研究人们对这个库及其实现的看法。如果你可以使用专家编写的代码，那么它很可能比你从头开始创建的代码更好。[PYL]\
  \ [PYPI]\n\n## 10.3.2 选择一个好的算法\n\n在第六章“定义和使用函数”中查看阶乘和斐波那契函数的实现时，我们看到选择正确的算法会在执行时间或内存使用上产生很大差异。请注意，你可能直到问题规模足够大时才会看到这一点，因此你可能不需要在小型情况下过度分析该怎么做。\n\
  \n例如，你真的需要对只有两个元素的列表调用 sorted 吗？\n\n```\ndef adder_1(n):\n    sum = 0\n    for j\
  \ in range(1, n + 1):\n        sum += j\n    return sum\n\nadder_1(100)\n```\n\n\

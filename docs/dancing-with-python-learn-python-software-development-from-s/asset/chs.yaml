  - 图 A.12：Visual Studio Code 代码检查设置 ...... 643\n\n\n\n\n然而，还有一种计算机，自 2016 年起才面向普通用户提供云端服务，那就是*量子计算机*。对量子计算机进行编程，在接近硬件的层次上与经典设备编程截然不同。然而，如果你已经掌握或能够学会\
  \ Python——根据估计，全球有超过 800 万软件开发者正在使用它，并且许多大学都在教授它——那么你就拥有一个巨大的优势：你可以同时进行经典计算和量子计算。\n\
  \n经典硬件和软件在过去七十年中已经证明了自身价值，而量子计算则是新生事物。它有望帮助解决某些类型的问题，这些问题即使对于经典超级计算机来说，也需要耗费过多的时间、过多的处理能力或过多的内存。专家预计，量子计算未来将在金融服务、物流、化学、材料科学、药物发现、物理系统科学模拟、优化和人工智能等领域发挥作用。\n\
  \n如果你计划成为一名专业软件开发人员，或者你是需要高性能计算进行研究的人，你就应该学习量子计算系统以及如何为其编写代码。\n\n## 我为什么写这本书？\n\n\
  在这个同时涉及经典硬件和量子硬件的新世界中，你该如何学习编程？\n\n一种方法是先单独学习经典计算。这是传统的做法，使用诸如 C、C++、JavaScript、Java、Go\
  \ 或 Python 之类的语言。在此过程中，你会学习如何使用代码库中的额外功能，这些功能可能来自编程工具本身，也可能来自第三方提供商。例如 C++ 标准库、Java\
  \ 平台企业版、Python 标准库，以及 Python 包索引中列出的数千个 Python 包。[PYPI]\n\n一旦你理解了经典编程语言的哲学、语法、结构和惯用法，就可以在此之上学习量子计算。例如，你可以将\
  \ Qiskit 开源量子计算软件开发工具包（SDK）与 Python 一起使用。[QIS] 它们能很好地融合在一起，运行效果极佳。已经有成千上万的人在用 Qiskit\
  \ 编写代码。如果你懂 Python，这是一个很好的方法。\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_23_0.png)\n\
  \n图 0.1：我们的学习策略\n\n但如果你正在学习编程，或者只有很少的经验呢？如果我能为你提供一个以统一方式学习经典计算和量子计算的机会呢？如果我能够帮助你理解两者的概念，使你不会将它们视为不同的学科，这对你有用吗？这就是本书要做的。\n\
  \n## 我为谁写这本书？\n\n如果你符合以下一条或多条描述，我相信本书会对你有用，并能吸引你：\n\n-   你正在通过课堂或课程学习编程。\n-   你想通过自学，学会像软件开发者一样思考。\n\
  -   你想理解并运用现代 Python 编程的基础知识。\n-   你认识到量子计算将成为本世纪最重要的技术之一，并且你想学习如何为其编写代码的基础知识。\n\
  -   你认为通过软件解决问题意味着要使用所有可用的工具，并且你想同时运用经典的和更新的量子编程技术。\n\n## 对读者的前提要求\n\n我不要求你具备任何编程或使用\
  \ Python 的经验。第 11 章“寻找量子改进”中的部分讨论和实现，需要你熟悉一些数学知识，但这些知识都不会超出微积分课程之前通常涵盖的范围，包括代数、几何、三角学和对数。\n\
  \n## 本书使用哪些约定？\n\n本书使用 Python 3.9 或更高版本。大多数特性在早期版本的 Python 3 中也可用，但我们不会展示或再提及已不再受支持的\
  \ Python 2。\n\n可执行的 Python 代码及其产生的结果以等宽字体显示，并在正文中按如下方式标出：\n\n```\n2**50\n```\n\n\
  1125899906842624\n\n第二个表达式是缩进的，是运行代码的结果。\n\n代码也可以跨越多行，例如下面的示例，我们创建并显示一个不包含重复数字的集合：\n\
  \n```\nprint({1, 2, 3, 2, 4,\n    1, 5, 3, 6, 7,\n    1, 3, 8, 2})\n```\n\n{1, 2,\
  \ 3, 4, 5, 6, 7, 8}\n\n对于较长的函数、方法和类定义，我会给行编号，以便在正文中更容易引用它们。这些编号不属于 Python 输入的一部分，如果你自行输入代码，不应输入这些编号。\n\
  \n```\n1 def display_string(the_string, put_in_uppercase=False):\n2     if put_in_uppercase:\n\
  3         print(the_string.upper())\n4     else:\n5         print(the_string)\n\
  ```\n\n当我在正文中提及 Python 函数、方法和属性名时，它们会像这样显示：print、__add__ 和 left。正文中 Python 类型和类名示例为\
  \ int、Fraction 和 Guitar。Python 模块和包名则显示为 math、os.path 和 qiskit。\n\n本书在正文中穿插了练习。请在继续之前，遇到它们时就动手解决。\n\
  \n练习 0.1\n这是一个示例练习吗？\n\n当我们把字符依次排列在一起时，就得到了*字符串*。因此，\"abcd\" 就是一个长度为四的字符串。我用双引号来限定字符串的开始和结束。它们本身并不属于字符串的一部分。有些语言将字符视为独立存在的特殊对象，而另一些语言则将它们视为长度为\
  \ 1 的字符串。\n\n对于我们的编程需求来说，这是一个很好的开端：我们有了比特和布尔值、数字、字符，以及由多个字符组成的字符串来构成文本。现在，我们需要用这些类型的数据来做一些事情。\n\
  \n## 1.2 表达式\n\n*表达式*是数据与要对这些数据执行的操作的书面组合。这听起来相当正式，那么想象一个数学公式：\n\n15 × 6² + 3 ×\
  \ 6 − 4 .\n\n这个表达式包含六项数据：15、6、2、3、6 和 4。有五个运算：乘法、乘方、加法、乘法和减法。如果我使用编程语言中常用的符号重写它，就是：\n\
  \n```\n15 * 6**2 + 3 * 6 - 4\n```\n\n看到那个重复出现的 6 了吗？假设我想用不同的数字来代替它。我可以把公式写成：\n\n\
  15 × x² + 3 × x − 4\n\n以及相应的代码表达式：\n\n```\n15 * x**2 + 3 * x - 4\n```\n\n如果我给 x\
  \ 赋值为 6，就得到原来的表达式。如果给它赋值为 11，我可以计算：\n\n```\n15 * 11**2 + 3 * 11 - 4\n```\n\n我们称\
  \ x 为*变量*，而给它赋值的过程称为*赋值*。表达式\n\nx = 11\n\n的意思是“将值 11 赋给 x，并在任何看到 x 的地方用 11 来替换。”x\
  \ 并没有什么特殊之处。我本可以使用 y 或像*千克*这样具有描述性的名称。\n\n一个表达式可以包含多个变量。\n\n## 1.4 库\n\n虽然现在许多书都是数字化的，可以在线获取，但实体图书馆在城镇中仍然很常见。你可以利用图书馆来避免亲自做某件事，那就是买书。你可以借书来读。如果它是一本烹饪书，你可以使用其中的食谱来烹饪食物。\n\
  \n编程语言及其环境也存在类似的思想。我可以将可复用的数据和函数打包在一起，然后放到一个库中。通过下载或其他共享方式，程序员可以使用我的库来节省时间。例如，如果我构建了一个数学库，它可以包含像*最大值*、*最小值*、*绝对值*和*是否为素数*这样的函数。它还可以包含\
  \ π 等特殊值的近似值。\n\n一旦你通过将库安装到系统上从而得以使用它，你需要告诉你的编程环境你想利用它。不同语言对库内容的称呼以及如何使它们可用，使用了不同的术语。\n\
  \n-   Python 导入模块和包。\n-   Go 导入包。\n-   JavaScript 从模块导入绑定。\n-   Ruby 需要 gem。\n-\
  \   C 和 C++ 包含与运行时编译库对应的源头文件。\n\n在像 Python 和 Java 这样的语言中，你可以从包中导入特定的构造（如类），也可以导入其中的所有内容。通过所有这些例子，目的是让你的环境拥有一套丰富且可扩展的预构建功能，你可以在代码中使用它们。有些库随核心环境一同提供。你也可以选择安装第三方库。本书的第三部分将介绍一系列常用的\
  \ Python 库。\n\n如果你导入两个库，而它们各自有一个同名函数，会发生什么？如果发生这种情况，我们就遇到了*命名冲突*和歧义。避免这一问题的解决方案是在函数名上再附加一些内容，例如库名。这样，你就可以明确地说：“从这里使用这个函数，从那边使用另一个函数。”例如，Python\
  \ 中的 math.sin 表示“使用 math 模块中的 sin 函数。”这就是*命名空间*的概念。\n\n\n\n\n\n计算机科学教材的作者通常会在数据结构中包含集合。凭借上面提到的这三种集合，你可以完成惊人的编码量。有时你需要专门的功能，例如一个不包含重复项的有序列表。大多数编程库都会为你提供广泛的此类结构，并允许你创建自己的结构。\n\
  \nC. S. Lewis 写了许多其他书籍和小说。我们可以创建的另一个字典可能会使用“1930s”、“1940s”、“1950s”和“1960s”作为键。值可以是按时间顺序排列的每个十年跨度内出版的标题列表。\n\
  \n集合可以是其他集合的一部分。例如，我可以将公司收益表表示为数字和字符串的列表的列表。然而，一些语言要求所包含的对象全部是同一类型。例如，也许一个列表需要全部是整数或全部是字符串。其他语言，包括\
  \ Python，允许你存储不同种类的对象。\n\n## Exercise 1.4\n\n在关于函数的部分，我们研究了有两个参数的**maximum**。思考并用文字描述一个类似的函数如何工作，该函数只接受一个参数，即数字列表。\n\
  \n我们可以更改的对象称为*mutable*。书籍列表在作者写作和出版时是可变的。一旦作者去世，我们可能会锁定集合并将其声明为*immutable*。没有人可以再做任何更改。对于字典，键通常需要是不可变的，并且经常是文本字符串或数字。\n\
  \n## Exercise 1.5\n\n字符串是一个集合吗？如果是的话，它应该是可变的还是不可变的？\n\n## 1.6 Conditional processing\n\

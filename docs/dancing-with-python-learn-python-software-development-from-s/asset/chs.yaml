  ### 7.4.3 相等性测试\n\n我们实现的下一个魔术方法是`__eq__`，当调用`==`时，它测试两个多项式是否相等。\n\n我把相等性测试搞得比较复杂，因为我想在常数多项式等于某个整数时返回\
  \ True。记住，常数是零次多项式。\n\n我测试两个多项式是否相等的策略，是查看所有它们可能不相等的方式。一旦我把这些方式都排除掉，这两个多项式就一定相同。\n\
  \n```python\ndef __eq__(self, other):\n    # Tests for equality between a polynomial\
  \ and an int\n    # or between two polynomials.\n\n    if isinstance(other, int):\n\
  \        # If we have a constant polynomial and the\n        # coefficient is the\
  \ int, return True.\n\n        if not self.terms:\n            # self is the zero\
  \ polynomial.\n            return other == 0\n        if other == 0:\n         \
  \   # self is not 0 but other is 0.\n            return False\n        if len(self.terms)\
  \ > 1:\n            return False\n        if 0 not in self.terms:\n            return\
  \ False\n        # self is a constant polynomial.\n        if self.terms[0] == other:\n\
  \            return True\n        return False\n\n    if isinstance(other, UniPoly):\n\
  \        # Both are polynomials.\n\n        if self.indeterminate != other.indeterminate:\n\
  \            # The indeterminates are different.\n            return False\n   \
  \     if len(self.terms) != len(other.terms):\n            # They have different\
  \ numbers of terms.\n            return False\n\n        for exponent in self.terms:\n\
  \            if exponent not in other.terms:\n                # An exponent in self\
  \ is missing from other.\n                return False\n            if self.terms[exponent]\
  \ != other.terms[exponent]:\n                # The coefficients of terms of equal\
  \ exponent\n                # are different.\n                return False\n\n \
  \       return True\n\n    return NotImplemented\n```\n\n我们首先检查与常数进行比较的情况：\n\n```python\n\
  UniPoly(0) == 0, UniPoly(3, 'w', 0) == 3\n```\n\n```\n(True, True)\n```\n\n现在用一些非平凡的多项式来测试：\n\
  \n```python\np = UniPoly(3, 'w', 1)\np\n```\n\n```\n3*w\n```\n\n```python\np ==\
  \ 3\n```\n\n```\nFalse\n```\n\n```python\nUniPoly(3, 'x', 7) == UniPoly(3, 'y',\
  \ 7)\n```\n\n```\nFalse\n```\n\n```python\nq = UniPoly(3, 'x', 7)\nq == q\n```\n\
  \n```\nTrue\n```\n\n你可能会惊讶地发现，“!=” 现在也能正常工作。\n\n```python\nq != q\n```\n\n```\n\
  False\n```\n\n```python\nUniPoly(3, 'x', 7) != UniPoly(3, 'y', 7)\n```\n\n```\n\
  True\n```\n\n实现 `!=` 的魔术方法是`__ne__`。如果你没有实现它，Python 会计算 `not (a == b)` 而不是 `a !=\
  \ b`。\n\n我实现了判断多项式 `p` 是否等于整数 `n` 的测试：`p == n`。我没有显式实现 `n == p`。必要时 Python 会替我们反转参数并执行测试。\n\
  \n```python\n-5 == UniPoly(-5, 'w', 0)\n```\n\n```\nTrue\n```\n\n虽然这在这里是合适的，但对于减法之类的运算就不合适了。\n\
  \n注意`__eq__`的最后一行：`return NotImplemented`。在这个定义中，我检查了多项式与整数之间以及两个多项式之间的相等性。我返回 NotImplemented\
  \ 的意思是：“我已经在此处做了所有能做的。看看周围是否还有其他方法可用于测试相等性。”例如，我以后可能会编写另一个数学类，并测试其实例与多项式之间的相等性。\n\
  \n### 7.4.4 “is” 与 “==”\n\n假设我有以下三个多项式定义：\n\n```python\np = UniPoly(-3, 'z', 10)\n\
  ```\n\n```python\nq = p\n```\n\n```python\nr = UniPoly(-3, 'z', 10)\n```\n\n它们看起来都一样：\n\
  \n```python\np, q, r\n```\n\n```\n(-3*z**10, -3*z**10, -3*z**10)\n```\n\n并且使用`==`测试时它们都相等：\n\
  \n```python\np == q, p == r, q == r\n```\n\n```\n(True, True, True)\n```\n\n然而，当我们使用`is`时，会得到不同的结果。\n\
  \n```python\np is q, p is r, q is r\n```\n\n```\n(True, False, False)\n```\n\n当我们想知道两个对象在\
  \ Python 中是否真的是同一个对象时，我们使用`is`。我们不是在测试它们看起来是否相同；我们是在问：“如果我前往计算机系统内存中 Python 存储`p`的位置，这个位置是否也是\
  \ Python 存储`q`的位置？”\n\n现在让我们更改多项式`p`中的不定元。\n\n```python\np\n```\n\n```\n-3*z**10\n\
  ```\n\n```python\np.indeterminate = 'M'\n```\n\n```python\np, q, r\n```\n\n```\n\
  (-3*M**10, -3*M**10, -3*z**10)\n```\n\n正如你所见，我更改了`p`，但`q`也随之更改。它们是同一个 Python 对象，只是通过两个不同的名称来引用。打个比方，你可以叫我“鲍勃”或“罗伯特”，但我还是我。\n\
  \n实现`is`不需要你做任何特殊处理。\n\n\n\n\n\n## 7.5 属性和特性\n\n由 UniPoly 创建的每个多项式都有一个名为 `indeterminate`\
  \ 的属性，以及另一个名为 `terms` 的属性；这些就是我们定义的实例变量。UniPoly 也有与每个实例方法对应的属性，无论这些方法是你定义的，还是 Python\
  \ 自动创建的。如果 `obj` 是一个 Python 对象，那么 `dir(object)` 会返回一个属性名列表。\n\n```\n\"indeterminate\"\
  \ in dir(p)\nTrue\n```\n\n```\n\"terms\" in dir(p)\nTrue\n```\n\n```\n\"__init__\"\
  \ in dir(p)\nTrue\n```\n\n实例变量是一种读写属性，也就是说，你可以使用 `.` 表示法获取和设置它的值。\n\n在设计类时，你可能希望允许用户直接、公开地访问某个实例变量。如果不希望这样，可以在变量名前加上两个下划线\
  \ `__`。Python 会在内部重命名这个变量，使它更难以访问，但并不是不能访问。我们把这种重命名称为“名称改写（mangling）”。\n\n现在，我们就在自己的类中实践一下。下面是\
  \ `__init__` 现在的样子：\n\n```\ndef __init__(self,\n    coefficient=1,\n    indeterminate='x',\n\
  \    exponent=0):\n\n    # Create a UniPoly object from an integer coefficient,\n\
  \    # string indeterminate, and non-negative integer\n    # exponent\n\n    if\
  \ not isinstance(coefficient, int):\n        raise ValueError(\n            \"The\
  \ coefficient for a UniPoly must \"\n            \"be an int.\")\n\n    if not isinstance(exponent,\
  \ int) or exponent < 0:\n        raise ValueError(\n            \"The exponent for\
  \ a UniPoly must \"\n            \"be a non-negative int.\")\n```\n\n## 7.6 命名约定与封装\n\
  \n在第 6.3 节中，我们介绍了函数的命名约定。现在，让我们把类和类中内容的命名约定也补全。\n\n虽然 `int` 和 `float` 等许多内置类的名称是小写，但你的类名应以大写字母开头。如果名称包含多个“单词”，这些单词也应以大写字母开头，而且不要使用下划线。例如\
  \ `BreadRecipe`、`ElectricGuitar` 和 `Matrix`。\n\n实例变量应遵循与其他变量相同的命名约定，方法应遵循与函数相同的约定。所有字母都应小写，可以使用下划线。\n\
  \n在名称末尾加一个下划线，可以避免与 Python 关键字混淆。\n\n```\nclass_ = \"Quantum Computing 101\"\nclass_\n\
  \n'Quantum Computing 101'\n```\n\n魔术方法（第 7.4 节）以两个下划线开头和结尾。\n\nPython 并不会严格强制从类外部隐藏方法和变量。在名称开头加一个下划线，可用来告诉他人并提醒自己：该变量或方法是类的“私有”成员。例如，你可能会有一个仅供其他实例方法调用的辅助方法。\n\
  \n如果名称以两个下划线开头，并且结尾处的下划线不超过一个，Python 就会对该名称进行“名称改写（mangling）”，使你在类外部难以访问它。当然，你可以查清\
  \ Python 的改写方式，然后照样访问这些变量或方法。但请守规矩，不要这样做！我们说，不是以下划线开头的方法或变量是公有的（public）。\n\n如果你熟悉\
  \ C++，那么你会知道 Python 没有与之对应的 `public`、`private` 和 `protected` 概念或关键字。\n\n定义一个包含数据和方法的类，并同时提供某种限制访问的方式，这被称为封装（encapsulation）。可以把它想象成在类及其实例外面套上一个保护性的“胶囊”。与\
  \ C++、Java 和 PHP 等编程语言相比，Python 的“胶囊”相对多孔。\n\n封装有助于向使用者隐藏类的数据和实现。作为类的作者，这使你可以更改表示和实现，而不会破坏依赖你代码功能的代码。作为类的使用者，不要深入到类内部去使用以下划线（“_”）开头的变量。\n\
  \n```\n# If index is not prime, set potential_primes[index] to 0.\n# We start with\
  \ 0 and 1\n\npotential_primes[0] = 0\npotential_primes[1] = 0\n\np = 2  # 2 is prime,\
  \ so start with that.\n\nwhile p <= n:\n    # If at an index whose value in potential_primes\n\
  \    # is not 0, it is prime.\n\n    if potential_primes[p]:\n        i = 2 * p\n\
  \n        # Mark p+p, p+p+p, etc. as not prime.\n        while i <= n:\n       \
  \     if i != p:\n                potential_primes[i] = 0\n            i += p\n\
  \    p += 1\n\n# The only non-zero integers left in potential_primes\n# are primes.\
  \ Return a list of those.\n\nreturn [prime for prime in potential_primes if prime]\n\
  ```\n\n在开发代码时，可以把注释和 `pass` 语句结合起来，创建并填写实现的骨架。以 `# TODO:` 开头的注释很容易找到，以 `# BUG:`\
  \ 开头的注释也是一样。\n\n关于注释，我最后的建议是：写注释时要注意措辞，让你的代码不是“只写（write-only）”的。所谓“只写”代码，是指你创建它时完全清楚它的作用，但现在无论你还是其他人都无法再理解它。\n\
  \n## 7.8 为 Python 代码编写文档\n\n*docstring*（文档字符串）是一个由三个双引号括起来的独立字符串，用来描述代码的功能。\n\n\
  开发人员在浏览你的代码时会阅读文档字符串。Python 根据文档字符串所在的位置，将它们与你的模块、类、函数和方法关联起来。Python 会收集这些文档字符串，并通过像\
  \ *help* 这样的函数提供给代码使用者。像 **Sphinx** 这样的第三方工具可以处理你的代码，生成漂亮的网页和 PDF 文档，供你的用户参考。[SPH]\n\
  \n最流行的 Python 文档约定之一出自《*Google Python 风格指南*》。[GSG, 第 3.8 节] 为了添加轻量级标记以实现格式化，许多程序员会在文档字符串中使用\
  \ “reStructuredText”。[RST] NumPy 和 SciPy 包的开发者将这些做法结合并调整，形成了 “numpydoc 文档字符串指南”。在本书中，从现在开始我将采用他们的这些约定。[NDG]\n\
  \n### 7.8.1 结构\n\n对于函数或方法，文档包含一行简短的描述、可选的多行详细描述，以及几个带标题的章节，例如：\n\n- **参数**\n- **异常**\n\
  - **生成**\n- **备注**\n- **示例**\n- **参考**\n- **返回**\n\n每个标题都用短横线作下划线。\n\n正如我们在第 7.4.2\
  \ 节中所见，`__bool__` 实现了等于零的多项式的“假值”行为。它只需要极简的文档：一段简短的功能描述，以及关于其返回内容的说明。\n\n```\ndef\
  \ __bool__(self):\n    \"\"\"Returns True if the polynomial is non-zero, False otherwise.\n\
  \n    Returns\n    ------\n    bool\n    \"\"\"\n\n    return bool(self.__terms)\n\
  ```\n\n函数和方法的简短描述应以 “Computes”“Calculates”“Extracts”“Copies” 等词开头。万不得已时，用 “Returns”。\n\
  \n如果你在 Python 中运行 `help(UniPoly)`，你会看到该类的完整文档，包括它的方法。如果只想查看顶层类的文档，请查看 `__doc__`\
  \ 属性。\n\n```\nprint(UniPoly.__doc__)\n```\n\n具有一个变量和整数系数的多项式。\n\nUniPoly 创建一个只含一项且系数为整数的单变量多项式。多项式可以使用不同的变量（这里称为“不定元”），但每个变量名都必须是单个字母字符。这些多项式是不可变的。\n\
  \n参数\n----------\ncoefficient : int，可选\n    该项的系数。默认值为 1。\nindeterminate : str，可选\n\
  \    “变量”。必须是单个字母字符。默认值为 'x'。\nexponent : int，可选\n    该项的指数。默认值为 1。\n\n异常\n------\n\
  ValueError\n    如果系数不是整数。\nValueError\n    如果指数不是非负整数。\nValueError\n    如果不定元不是单个字母字符。\n\
  \n我对类简短描述的习惯是：它应当是“This creates a …（这创建一个……）”这个句子的后半部分。类的参数就是 `__init__` 的参数，而属性则是实例变量和类变量。\n\
  \n在后续遇到更多文档特性时，我会再指出来。\n\n\n\n\n\n### 7.8.2 格式化\n\nPython 代码工具如 **Sphinx** 理解如何将\
  \ reStructuredText 标记翻译为从代码创建网页和印刷文档。\n\n用双星号包围文本使其加粗：\"**This is so bold**\" 会得到\
  \ **This is so bold**。单星号会得到斜体文本：\"*I am italic*\" 会得到 *I am italic*。对于等宽字体，使用双反引号：\"\
  ``This looks like code``\" 会生成 `This looks like code`。\n\n我们用一个空行分隔段落。对于项目符号列表，每行以星号开头：\n\
  \n```\n* The first item\n* The second item\n* The third item\n```\n\n标记会生成\n\n-\
  \ The first item\n- The second item\n- The third item\n\n使用 `#` 代替 `*` 来得到编号列表。\n\
  \n你的 Python 代码以及从 *help* 和查看 `__doc__` 得到的内容会包含这种格式。只有当像 **Sphinx** 这样的工具处理你的代码后，你才会看到它漂亮地显示出来。\n\
  \n`__add__` 的文档包含类似 :class:`UniPoly` 的标记。这是语义标记，表示“**UniPoly** 是一个 Python 类，你应该以你显示类的方式以某种花哨的方式格式化它。”它还允许\
  \ **Sphinx** 跨引用该类并提供指向其定义的自动链接。\n\n`:class:` 被称为 *role*。其他角色包括\n\n- `:attr:`（数据属性\
  \ / 实例变量），\n- `:const:`（模块级常量），\n- `:data:`（模块级非常量变量），\n- `:exc:`（异常），\n- `:func:`（函数），\n\
  - `:meth:`（方法），以及\n- `:mod:`（模块）。\n\n如果你不想使用这种语义标记，请用单反引号包围名称。\n\n要包含数学标记，请在反引号内使用\
  \ :math: 和 LaTeX。例如，:math:`2x^3-5z^2` 将显示为 2x³ − 5z²。\n\n如果愿意，你可以为文档中的每个 Python\
  \ 元素使用格式和语义标记。这会创建漂亮的网页和印刷文档，但会使代码难以阅读。在可读性和足以使代码文档具有吸引力的标记之间取得平衡。\n\n创建文档字符串可能很乏味，但像\
  \ Visual Studio Code 的 Python Docstring Generator 这样的工具可能会加快工作。\n\n## 7.9 枚举\n\n\
  Bob’s Bakery Bistro 制作并出售四种饼干：巧克力、糖、燕麦和短面包。Bob 雇佣了高手程序员 Will 为酒吧使用 Python 编写新的饼干库存应用程序。\n\
  \nWill 应该如何表示饼干？一种方法是使用全局常量。\n\n```\nCHOCOLATE_COOKIE = 0\nSUGAR_COOKIE = 1\nOATMEAL_COOKIE\
  \ = 2\nSHORTBREAD_COOKIE = 3\n\nCOOKIE_NAMES = [\n    \"chocolate\",\n    \"sugar\"\
  ,\n    \"oatmeal\",\n    \"shortbread\"\n]\n```\n\n如果你有饼干常量，很容易得到名称：\n\n```\nCOOKIE_NAMES[SUGAR_COOKIE]\n\
  ```\n\n'sugar'\n\n从名称到饼干常量的转换就不那么明显了，除非我们对位置和索引做出一些假设。如果你开始添加更多种类的饼干，很容易在代码中引入错误。\n\
  \n在 Python 中以更简单且面向对象的方式做到这一点会很好。这种功能就是 *枚举* 的作用。\n\n```\nfrom enum import Enum\n\
  \nclass Cookie(Enum):\n    CHOCOLATE = \"chocolate\"\n    SUGAR = \"sugar\"\n  \
  \  OATMEAL = \"oatmeal\"\n    SHORTBREAD = \"shortbread\"\n```\n\n分配枚举值给其名称的行末尾没有逗号。每个名称-值对称为一个\
  \ *枚举成员*。\n\n我们使用“.”语法访问成员：\n\n```\nCookie.SHORTBREAD\n```\n\n```\n<Cookie.SHORTBREAD:\
  \ 'shortbread'>\n```\n\n```\nCookie.SUGAR\n```\n\n```\n<Cookie.SUGAR: 'sugar'>\n\
  ```\n\n### 练习 7.10\n\n枚举成员的类型是什么？\n\n如果你有一个成员，你可以检索其名称和值。\n\n```\ncookie = Cookie.OATMEAL\n\
  cookie.name\n```\n\n```\n'OATMEAL'\n```\n\n```\ncookie.value\n```\n\n```\n'oatmeal'\n\
  ```\n\n给定值，你可以得到成员。\n\n```\nCookie(\"sugar\")\n```\n\n```\n<Cookie.SUGAR: 'sugar'>\n\
  ```\n\n### 练习 7.12\n\n如果使用无效的枚举名称如 CatAge.GEORGE，Python 会引发什么异常？\n\n## 7.10 更多多项式魔法\n\
  \n现在我们为多项式奠定了基础，是时候实现加法、减法和乘法等运算了。由于我们将系数限制为整数，因此不实现除法。\n\n### 7.10.1 更好的 __str__\n\
  \n我们将看到不止一个项，并且需要更健壮的 __str__ 实现。\n\n```\ndef __str__(self):\n    \"\"\"Creates\
  \ a human-readable string representation.\n\n    This returns forms that look like\
  \ 2x**6 + x**3 - 1.\n\n    Returns\n    ------\n    str\n        Mathematical human-readable\
  \ form of the polynomial.\n    \"\"\"\n    if not self.__terms:\n        return\
  \ '0'\n\ndef format_term(coefficient, exponent):\n    \"\"\"Format a single term\
  \ in the polynomial.\n\n    This function formats a term and handles the special\n\
  \    cases when the coefficient is +/- 1 or the exponent is\n    0 or 1.\n\n   \
  \ Parameters\n    ----------\n    coefficient : int\n        The coefficient of\
  \ the term.\n    exponent : int\n        The exponent of the term.\n```\n\n```\n\
  UniPoly(-1, 'z', 1)\n```\n\n-z\n\n```\nUniPoly(3, 'x', 7)\n```\n\n3*x**7\n\n###\
  \ 7.10.2 不断思考常数\n\n常数系数是指指数为 0 的项的系数。我将 constant_coefficient 实现为 Python 属性，因为它是一个多项式的内在部分。\n\
  \n```\n@property\ndef constant_coefficient(self):\n    \"\"\"The coefficient of\
  \ the term with exponent 0.\"\"\"\n    if self.__terms and 0 in self.__terms:\n\
  \        return self.__terms[0]\n    return 0\n```\n\n```\nUniPoly(3, 'x', 0).constant_coefficient\n\
  ```\n\n3\n\n同样，is_constant 是一个布尔值属性，告诉我们是否存在指数大于 0 的项。我推迟到第 7.14 节末尾再向你展示其实现，因为我需要先介绍其他\
  \ Python 特性。\n\n```\nUniPoly(3, 'x', 7).is_constant, UniPoly(2, 'y', 0).is_constant\n\
  ```\n\n(False, True)\n\n### 7.10.3 加法\n\n我们用 __add__ 实例方法定义加法。\n\n```\ndef __add__(self,\
  \ other):\n    \"\"\"Adds a polynomial to a polynomial or an integer.\n\n    Parameters\n\
  \    ----------\n    other : :class:`UniPoly` or int\n        A polynomial or integer.\n\
  ```\n\n这种实现有效，因为我们的多项式加法是可交换的：p + q = q + p 且 p + n = n + p 对于 UniPoly p 和 q，以及\
  \ int n。\n\n### 练习 7.13\n\n__radd__ 中的“r”代表“right-side”还是“reverse”？\n\n### 练习 7.14\n\
  \n在 Python 中我们使用“+”进行字符串连接。这是可交换的吗？\n\n### 7.10.4 减法\n\n__sub__ 的减法定义几乎与 __add__\
  \ 相同。一些注释应该有所不同，并且一些“+”操作应该改为“-”。\n\n### 练习 7.15\n\n实现 __sub__。\n\n```\nw = UniPoly(1,\
  \ 'w', 1)\nw, w - w, w - -w\n```\n\n(w, 0, 2*w)\n\n```\nUniPoly(3, 'x', 7) - UniPoly(5,\
  \ 'x', 3) + 1\n```\n\n3*x**7 - 5*x**3 + 1\n\n```\nUniPoly(3, 'x', 7) - UniPoly(-5,\
  \ 'x', 3) + 1\n```\n\n3*x**7 + 5*x**3 + 1\n\n```\nUniPoly(3, 'x', 7) - 2\n```\n\n\
  3*x**7 - 2\n\n### 练习 7.16\n\n在数学上 p - q = p + -q 是正确的，为什么用 __neg__ 和 __add__ 实现\
  \ __sub__ 是低效的？如果 q 有 10,000 个项会怎样？\n\n### 练习 7.17\n\n这个 __rsub__ 的实现：\n\n```\n\
  def __rsub__(self, other):\n    \"\"\"Computes other - self.\n\n    Returns\n  \
  \  ------\n    :class:`UniPoly`\n        The difference of other and self.\n   \
  \ \"\"\"\n\n    # other - self == -(self - other)\n    # For efficiency, this should\
  \ be computed like __sub__\n    # so we create fewer intermediate polynomials.\n\
  \n    return self.__sub__(other).__neg__()\n```\n\n是否尽可能高效？\n\n```\n2 - UniPoly(3,\
  \ 'x', 7)\n```\n\n-3*x**7 + 2\n\n如果写出并使用一个仅内部的实例方法 __destructive_negate 在原地否定 self\
  \ 的系数会怎样？\n\n### 7.10.5 乘法\n\n要实现乘法“*”，我们编写 __mul__ 和 __rmul__ 实例方法。由于我们的多项式乘法是可交换的，__rmul__\
  \ 很简单：\n\n```\ndef __rmul__(self, other):\n    \"\"\"Computes other * self.\n\n\
  \    Returns\n    ------\n    :class:`UniPoly`\n        The product of other and\
  \ self.\n    \"\"\"\n\n\n\n```\nif self.__indeterminate != other.__indeterminate:\n\
  \    if self.is_constant and other.is_constant:\n        return UniPoly(self.constant_coefficient\
  \ * other.constant_coefficient, self.__indeterminate, 0)\n    return NotImplemented\n\
  \nnew_poly = UniPoly(0, self.__indeterminate, 0)\n\nfor exponent_1, coefficient_1\
  \ in self.__terms.items():\n    for exponent_2, coefficient_2 in other.__terms.items():\n\
  \        new_poly += UniPoly(coefficient_1 * coefficient_2, self.__indeterminate,\
  \ exponent_1 + exponent_2)\n\nreturn new_poly\n\nreturn NotImplemented\n```\n\n\
  ```\nz = UniPoly(1, 'z', 1)\n(z + 1) * (z - 1)\n```\n\nz**2 - 1\n\n```\n(z + 1)\
  \ * (z + 1)\n```\n\nz**2 + 2*z + 1\n\n```\n(2*z + 1) * (-3*z*z*z + 4)\n```\n\n-6*z**4\
  \ - 3*z**3 + 8*z + 4\n\n## Exercise 7.18\n\n在“new_poly +=”这一行，我们执行的是不可变加法。这会创建并复制许多项。定义一个仅限内部使用的实例方法\
  \ __destructive_add，使其就地修改 self，使其成为自身与 other 的和。在改进版的 __mul__ 中使用它。\n\n我们的数学看起来不错！我们还有一个基本代数运算需要编码。\n\
  \n## 7.10.6 指数运算\n\n要实现非负整数的指数运算，我们编码 __pow__ 实例方法。\n\n如果 p 是一个多项式，那么 p⁴ 就是 p ×\
  \ p × p × p。一般来说，按这种方式计算 pⁿ 需要 n − 1 次乘法运算。算法是 O(n − 1)。\n\n不过，p⁴ 也可以是 q × q，其中\
  \ q = p × p。我们只需要做两次乘法而不是三次！对于 p⁵，我们计算 p × q × q。如果 n = 8，\n\np⁸ = p⁴ × p⁴\n\n我们只需做\
  \ 3 次乘法而不是 7 次。我们使用的是指数运算的重复平方算法。它是递归的。\n\n**Exercise 7.19**\n你是否怀疑 3 = log₂(8)？对重复平方做一个\
  \ O() 分析。\n\n要通过重复平方计算 pⁿ，\n\n- 如果 n 为 0，则返回 1。\n- 如果 n 为 1，则返回 p。\n- 如果 n 为 2，则返回\
  \ p × p。\n- 递归计算 q = pⁿ // 2。记住“//”是整数除法，例如 7 // 2 == 3。\n- 将 q 设为 q × q。\n- 如果\
  \ n 为偶数，则返回 q。\n- 返回 p × q。\n\n```\ndef __pow__(self, exponent):\n    \"\"\"Raises\
  \ a polynomial to a non-negative integer exponent.\n\n    `__pow__` used by both\
  \ `**` and `pow`.\n\n    Parameters\n    ----------\n    exponent : int\n      \
  \  The non-negative exponent to which self is raised.\n```\n\n## 文档编辑助手\n\n这是一个示例段落，用于演示文档编辑助手的功能。经过仔细的检查，这个示例展示了如何从图片中提取文本内容。\n\

  \ 1.0000 |\n\n为了进一步分析猫的 DataFrame，我们可以而且应该删除 F 和 M 列中的一列。\n\n*主成分分析（PCA）* 是一种在保持数据许多统计特性的同时减少特征数量的技术。\n\
  \n请注意，我说的是“减少特征数量”。我并没有说“选择现有特征的子集”。通常，PCA 通过数学组合现有数据来创建更少且不同的特征。如果你熟悉线性代数，PCA 会计算一个线性变换矩阵，将我们的数据映射到更低维度。一般来说，我们会丢失一些信息，但可能保留足够的信息，以实现足够快的计算和有用的结果。\n\
  \n在执行 PCA 之前，我们需要对数据进行归一化或标准化。我选择对每一列进行标准化（第 15.3.2 节），使它们具有相同的均值和标准差（舍入误差允许范围内）。\n\
  \n```\ndef standardize_DataFrame_column(df, column_label):\n    data = df[column_label].values\n\
  \    mu = data.mean()\n    sigma = data.std()\n    assert sigma != 0  # don't forget\
  \ this!\n    df[column_label] = (data - mu)/sigma\n```\n\n```\nfor label in df.columns.values:\n\

  \n## 9.2 布尔运算和位逻辑门\n\n正如我们在第 2.5 节中看到的，布尔值和位之间存在直接对应关系，将 True 等同于 1，将 False 等同于\
  \ 0。我第一次在大学哲学系的逻辑课程中学习了布尔值及其运算。[MQL] 您也可以采用数学方法并查看布尔代数。位和电路是电气工程和计算机科学的基础。这些方法之间的\
  \ perceived 区别可能具有误导性，因为我们用不同的词谈论相同的想法。\n\n在本节中，我使用位及其相关的门语言进行工作。\n\n我在《Dancing\
  \ with Qubits》的第 2 章中介绍了逻辑门和电路。[D.W.Q]\n\n### 9.2.1 1 位门\n\n最简单的 1 位门是 id，它使 0 和\

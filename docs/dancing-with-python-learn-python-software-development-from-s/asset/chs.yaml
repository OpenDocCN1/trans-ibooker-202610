  \n为了使各列的值更具可比性，我们将对各列的值进行归一化或缩放。有些算法需要归一化，而另一些算法如果事先归一化则运行得更快。归一化数据有几种技术，接下来我将重点介绍其中的三种。\n\
  \n## 15.3.1 最小-最大归一化\n\n最小-最大缩放或归一化产生的值介于 0 和 1 之间（包含端点）。实际上，我们从一列中的每个数字中减去该列的最小值，然后除以新的最大值。如果最小值和最大值都为零，则不应进行此操作。\n\
  \n数学上，这表示为\n\n```\nx_new = (x_old - x_min) / (x_max - x_min)\n```\n\n其中 x_old 是列值。计算完成后，我们将列中的\
  \ x_old 替换为 x_new。\n\n### 练习 15.3\n\n有什么方法可以调整此变换，使值范围介于 -1 和 1 之间？\n\n为了计算地区的这一变换，我们使用\
  \ values 属性提取列项，然后调用 sklearn 中的 minmax_scale：\n\n```\nfrom sklearn.preprocessing\
  \ import minmax_scale\n\nnew_locality = minmax_scale(df[\"Locality\"].values)\n\
  new_locality[:10]\n```\n\narray([0.2222, 0.2222, 0.1111, 0.8889, 0.1111, 0.1111,\
  \ 0.2222, 0.2222, 0.2222, 0.2222])\n\n虽然我现在不这样做，但可以通过执行 df[\"Locality\"] = new_locality\
  \ 来将地区列设置为这些新的缩放值。\n\n### 练习 15.4\n\n验证 new_locality 中的最小值和最大值分别是 0.0 和 1.0。\n\n\

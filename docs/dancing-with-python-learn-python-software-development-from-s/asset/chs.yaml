  \ 和 qiskit 一起创建量子电路和程序，则无需将任何东西下载到你的机器上。\n\n## A.12 Linting\n\nLinter 是一种扫描你的代码查找错误或与风格约定不一致的应用程序。许多\
  \ IDE 如 Visual Studio Code 都有内置支持一个或多个 linter。 [VSL] Linter 执行静态分析，即它不运行你的代码，只查看你所写的内容。\n\
  \nLinter 通常有三类消息：\n\n- **Informational** – “你可能想知道这一点，但如果你一直告诉我，我可能会感到厌烦。”\n- **Warning**\
  \ – “你在这里做了一些可能导致问题的事情，或者你没有遵循格式约定。不要拖延，现在就看一下。”\n- **Error** – “修复它。现在。”\n\n一个不错的\
  \ Python linter 入门选择是 pylint。通过以下方式安装它：\n\n```\npip install pylint\n```\n\n一旦安装完成，从操作系统命令行发出\
  \ pylint --help 将显示关于选项的几屏信息。\n\n如果我们将错误的代码\n\n```\ndef f(x=1, y)\n    return x+y\n\
  ```\n\n存储在文件 src\\code\\linting\\lint-01.py 中，或在非 Windows 系统上为 src/code/linting/lint-01.py，然后从操作系统命令行运行\n\
  \n```\npylint src\\code\\linting\\lint-01.py\n```\n\n我们看到输出\n\n```\n************\
  \ Module lint-01\nsrc\\code\\linting\\lint-01.py:1:13: E0001: non-default argument\
  \ follows default\nargument (<unknown>, line 1) (syntax-error)\n```\n\n由于消息代码为“E0001”并且以“E”开头，这是一个错误。\n\
  \n**flake8** 是另一个 Python linting 应用程序。通过以下方式安装它：\n\n```\npip install flake8\n```\n\
  \n现在我在目录中放置另一个文件，这次命名为 **src\\code\\linting\\lint-02.py**，或在非 Windows 系统上为 **src/code/linting/lint-02.py**。它包含代码：\n\
  \n```\ndef f(x, y):\n    #useless comment\n    return x+y\n```\n\n在 **directory**\
  \ 上运行 **flake8**，\n\n```\nflake8 src\\code\\linting\n```\n\n我们看到：\n\n```\nsrc\\\
  code\\linting\\lint-01.py:1:13: E999 SyntaxError: non-default\nargument follows\
  \ default argument\nsrc\\code\\linting\\lint-01.py:2:3: E111 indentation is not\
  \ a multiple of four\nsrc\\code\\linting\\lint-01.py:2:3: E113 unexpected indentation\n\
  src\\code\\linting\\lint-01.py:2:13: W292 no newline at end of file\nsrc\\code\\\
  linting\\lint-02.py:2:5: E265 block comment should start with '# '\nsrc\\code\\\
  linting\\lint-02.py:3:15: W292 no newline at end of file\n```\n\n我们得到了关于 **lint-01.py**\
  \ 和 **lint-02.py** 的消息。\n\n我发现“W292”警告很烦人，所以我关闭它：\n\n```\nflake8 --ignore=W292 src\\\
  code\\linting\n```\n\n然后得到\n\n```\nsrc\\code\\linting\\lint-01.py:1:13: E999 SyntaxError:\
  \ non-default\nargument follows default argument\nsrc\\code\\linting\\lint-01.py:2:3:\
  \ E111 indentation is not a multiple of four\nsrc\\code\\linting\\lint-01.py:2:3:\
  \ E113 unexpected indentation\nsrc\\code\\linting\\lint-01.py:2:11: E226 missing\
  \ whitespace around arithmetic operator\nsrc\\code\\linting\\lint-02.py:2:5: E265\
  \ block comment should start with '# '\nsrc\\code\\linting\\lint-02.py:3:13: E226\
  \ missing whitespace around arithmetic operator\n```\n\n### Exercise A.2\n\n我们从\
  \ **flake8** 看到代码中的哪个新的错误消息？你能在代码中找到问题吗？ [PEP008]\n\n其他你应该调查并考虑使用的 linter 包括 **prospector**、**pycodestyle**、**pydocstyle**\
  \ 和 **pylama**。其中一些 linter 在其处理中整合了其他 linting 应用程序。还考虑使用 **mccabe** 评估代码复杂性以及 **bandit**\
  \ 进行安全检查。\n\n我不从命令行运行 linter，只在 IDE 中使用它们。 **Visual Studio Code** 通过其 Python 扩展支持我提到的所有\
  \ linter。图 A.11 显示了编辑器中 **lint-02.py** 的消息和问题位置。\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_671_0.png)\n\

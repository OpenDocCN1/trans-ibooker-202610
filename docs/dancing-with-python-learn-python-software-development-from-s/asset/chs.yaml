  \ 标准差和方差\n\n让我们来看两个包含 99 个数字的数据集。第一个包含从 1 到 99 的每个整数。第二个包含 99 个整数 50 的副本。在每种情况下，均值都是\
  \ 50。\n\n```python\ndata_1 = np.arange(1, 100)\ndata_2 = np.repeat(50, 99)\n(np.mean(data_1),\
  \ np.mean(data_2))\n```\n\n```text\n(50.0, 50.0)\n```\n\n在第一种情况下，值从均值广泛分布。在第二种情况下，每个值都集中在均值。我们使用\
  \ *标准差*，写为希腊字母 sigma = σ，来衡量这种离散程度。**numpy 函数** *std* 计算一维数组值的标准差。\n\n```python\n\
  (np.std(data_1), np.std(data_2))\n```\n\n```text\n(28.577380332470412, 0.0)\n```\n\
  \n\n\n\n\n第二种情况下均值没有偏差。图 14.1 中的箱线图显示了两个数据集中不同的分布。\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_562_0.png)\n\
  \n图 14.1：数字 1 到 99 的两个分布的箱线图\n\n非正式地说，我们想要了解每个数据值在平均值上平均相差多少。这将给出一个“平均偏差”，我们可以想象将其计算为值减去均值的绝对值的平均值。如果数据值是数字\
  \ *d*₁ 到 *d*ₙ，则这将是\n\n$$\\text{mean}=\\mu=\\frac{d_1+\\cdots+d_n}{n}=\\frac{1}{n}\\\
  sum_{j=1}^{n}d_j$$\n\n$$\\text{average deviation}=\\frac{|\\mu-d_1|+\\cdots+|\\\
  mu-d_n|}{n}=\\frac{1}{n}\\sum_{j=1}^{n}|\\mu-d_j|$$\n\n$$\\text{standard deviation}=\\\
  sigma=\\sqrt{\\frac{(\\mu-d_1)^2+\\cdots+(\\mu-d_n)^2}{n}}=\\sqrt{\\frac{1}{n}\\\
  sum_{j=1}^{n}(\\mu-d_j)^2}$$\n\n中的第二行\n\n平均偏差在数学上不容易操作，因此我们使用第三行定义的标准差。标准差也有利于给离均值更远的值赋予更大的权重。\n\
  \n均值、平均偏差和标准差公式中的最右侧表达式使用 Σ 求和符号，如果你在学校见过的话。每个 Σ 表达式的定义是其左侧的公式。\n\n## Exercise 14.3\n\
  \n定义一个函数来计算一维 **numpy** 数组的标准差，而不使用 std。你能在一行内完成吗？\n\n## Exercise 14.4\n\n定义一个函数来计算一维\
  \ **numpy** 数组的平均偏差。你能在一行内完成吗？data_1 的平均偏差是多少？\n\n*方差* 是标准差的平方，因此为 σ²。与标准差一样，它衡量数据值与其均值的离散程度。\n\
  \nvariance = σ² = ((μ − d₁)² + ··· + (μ − dₙ)²) / n = (1 / n) ∑ⱼ₌₁ⁿ (μ − dⱼ)²\n\n\
  在第 14.1 节开头的数据集 ages 中，有一百名音乐会观众的年龄，方差的单位为 years²（年平方）。\n\n我们使用 *var* 函数计算方差。\n\n\
  ```\nnp.var(ages)\n```\n\n20.555599999999995\n\n## 14.1.4 Covariance and correlation\n\
  \n我们有一些关于我们 1990 年代翻唱乐队音乐会观众的额外（虚构）数据。除了他们的年龄外，我们还知道他们在 1995 年参加了多少场音乐会。\n\n```\n\
  concerts_attended_in_1995 = np.array(\n    [0, 0, 0, 0, 2, 0, 4, 4, 4, 0, 0, 4,\

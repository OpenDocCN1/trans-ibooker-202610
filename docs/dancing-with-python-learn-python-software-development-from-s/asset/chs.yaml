  \n- 5. 盖上碗盖，让它在温暖的地方静置 1 小时。\n- 6. 压下面团并揉面 5 分钟。放在抹了黄油的烤盘中 30 分钟。\n- 7. 在预热至 375°\
  \ F（190° C，瓦斯标记 5）的烤箱中烘烤 45 分钟。\n- 8. 取出面包并让其冷却。\n\n# Problems\n\n我称之为“直通”配方，因为你从头到尾按顺序做一个步骤接一个步骤。流程直线进行，没有任何岔路。然而，配方太简单了，因为它没有包含在进入后续步骤之前必须满足的条件。\n\
  \n- - 在步骤 1 中，如果酵母已死，你的面包就不会发酵。我们必须确保混合物活跃且起泡。\n- - 在步骤 2 中，我们需要分少量添加更多面粉，直到搅拌好的面团从碗中脱落。\n\
  - - 在步骤 3 中，如果面团变得太粘，我们需要添加更多面粉。\n- - 在步骤 5 中，一个小时只是面团变大一倍所需时间的估计。它可能需要更长或更短的时间。\n\
  - - 在步骤 6 中，我们希望面团在烤盘中变大一倍。\n- - 在步骤 7 中，45 分钟是面包顶部变成金黄色的烘烤时间的估计。\n\n# Conditional\
  \ recipe\n\n- 1. 在一个大碗中混合糖、水和酵母。静置 10 分钟。如果混合物起泡，则继续下一步。否则，丢弃混合物，并在大碗中混合糖、水和新鲜酵母。静置\
  \ 10 分钟。\n- 2. 拌入盐、牛奶、黄油和面粉。用刮刀或木勺搅拌 5 分钟。如果混合物没有从碗壁脱落，则添加 1 汤匙面粉并再搅拌 1 分钟。否则，继续下一步。\n\

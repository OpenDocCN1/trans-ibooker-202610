  - 14.10 总结 574\n\n### 14.1 统计学\n\n本节介绍用于分析数据的几个核心统计函数。我们使用的数据是 2021 年在一场虚构的 1990\
  \ 年代音乐翻唱乐队音乐会上的一百名与会者的年龄。\n\n```python\nimport numpy as np\n\nages = np.array(\n\

  \ = (√2/2) |00⟩ − (√2/2) |01⟩\nid ⊗ H |10⟩ = (√2/2) |10⟩ + (√2/2) |11⟩\nid ⊗ H |11⟩\
  \ = (√2/2) |10⟩ − (√2/2) |11⟩\n\n下一步的结果为\n\n− (1/2) ((√2/2) |00⟩ + (√2/2) |01⟩)\
  \ + (1/2) ((√2/2) |00⟩ − (√2/2) |01⟩) + (1/2) ((√2/2) |10⟩ + (√2/2) |11⟩) + (1/2)\
  \ ((√2/2) |10⟩ − (√2/2) |11⟩)\n\n或\n\n−(√2/2)|01⟩ + (√2/2)|10⟩\n\n应用 2 量子比特 CX 门得到\n\
  \n−(√2/2)|01⟩ + (√2/2)|11⟩\n\n随后是第二个 id ⊗ H\n\n−(1/2)|00⟩ + (1/2)|01⟩ + (1/2)|10⟩\
  \ − (1/2)|11⟩\n\n几乎完成了！应用第二个 X ⊗ X\n\n−(1/2)|00⟩ + (1/2)|01⟩ + (1/2)|10⟩ − (1/2)|11⟩\n\
  \n最后加上 H⊗2，得到\n\n−|11⟩\n\n当我们测量它时，结果必须是 |11⟩，除非有硬件噪声。因此，只用一次 oracle 调用和一次关于均值的反转，我们就能以\
  \ 100% 的准确率找到搜索值。\n\n### 练习 11.20\n\n验证当我们使用 |00⟩、|01⟩ 和 |10⟩ 的 oracle 时，Grover\
  \ 搜索算法是否有效。\n\n虽然我刚刚向你展示了一系列门在两个量子比特上计算关于均值的反转，但谁发现了这个电路？简单的答案是一个“量子算法开发者”。[GSA]\
  \ 从量子比特习惯用法到小型电路再到算法组件，我们学习并扩展了我们解决问题的技术集合。\n\n### 11.7 总结\n\n在本章中，我们研究了经典的线性搜索和二分搜索。在第一种情况下，集合中的项目最初没有排序，因此我们被迫逐一查看每个项目以找到我们想要的那个。当我们可以假设项目已排序时，二分搜索方法效率高得多，因为我们可以迭代地将问题规模减半，直到得到结果。然后我们转向最容易理解的量子算法之一——Grover\
  \ 搜索。使用 Grover，搜索时间与项目数量的平方根成正比。\n\nGrover 算法的一个重要警告是，今天的量子计算机无法处理足够大的数据集合，使得它在实践中比经典方法更有效。尽管如此，它仍然是我们可以获得量子优势的地点和方式的一个绝佳例子。\n"

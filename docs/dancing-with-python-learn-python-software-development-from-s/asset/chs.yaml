  \ 12.13**\n>\n> 为什么是两次替换而不是三次？\n\n我们最后一个正则表达式函数是 `split`，它是我们在 4.8 节中见到的核心 `str`\
  \ 方法的高级版本。\n\n我想分割一个由我几只猫的名字以及它们现在的年龄组成的字符串。我期望的结果是一个包含猫名字的列表。\n\n```python\nstring\

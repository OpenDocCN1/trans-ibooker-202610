  \ a human-readable string representation.\n\n    Returns\n    ------\n    :class:`NotImplementedType`\n\
  \        NotImplemented\n    \"\"\"\n    return NotImplemented\n\nclass Guitar(MusicalInstrument):\n\
  \    \"\"\"Guitar.\n\n    Parameters\n    ----------\n    brand : str\n        Manufacturer\
  \ brand name. E.g., \"Fender\".\n    model : str\n        Instrument model name.\

  \n均值是数据值的平均值。我们通常将均值写为希腊字母 mu = μ，尽管你也可能看到“m。”\n\n```python\nmean = np.mean(ages)\n\
  mean\n```\n\n```text\n40.62\n```\n\n你也可以通过将值的总和除以值的数量来直接计算均值。\n\n```python\nnp.sum(ages)/ages.size\n\

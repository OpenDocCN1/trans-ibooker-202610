  Execution time = {t_2:.10f}\")\n```\n\nExecution time = 0.0098197000\n\n如果你正在过滤项目或对它们进行计算，执行时间的差异可能远小于我们刚才看到的构建简单列表的差异。列表推导式可能不是每种情况下最快的解决方案，因为\
  \ Python 知道如何从 range 等函数创建其内置集合。\n\n```\ndef build_list_3(n):\n    list(range(n))\n\
  \nt_3 = timeit.timeit(stmt=\"build_list_3(100000)\",\n                    number=3,\

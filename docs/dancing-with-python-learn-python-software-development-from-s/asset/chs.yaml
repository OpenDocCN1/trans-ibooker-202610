  \ dream'\n\n我们执行以下操作来提取从索引 3 开始、长度为 6 的子字符串：\n\n```\nquote[3:9]\n```\n\n'chance'\n\
  \n冒号前面的数字是起始索引，冒号后面的数字是起始索引加上子字符串长度。表达式 **quote[3:9]** 的意思是：\n\n> 从索引 3 开始，收集 quote\
  \ 中\n> 该索引以及所有小于 9 的有效索引处的字符。\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_79_0.png)\n\
  \n与加法类似，我们可以使用乘法来重复字符串多次。\n\n```\n3 * text\n```\n\n'la la la '\n\n```\n10 * text\n\
  ```\n\n'la la la la la la la la la la '\n\n```\n0 * text\n```\n\n''\n\nPython 提供了多种将数据和文本格式化为字符串的方式。最新的一种称为格式化字符串字面量，或者更简单地说，称为\
  \ f-string。\n\n要创建 f-string，请在起始引号定界符前加上 f 或 F。在字符串内部，花括号“{”和“}”中的任何表达式都会被求值，结果会被粘贴回字符串的相应位置。\n\
  \n```\na = 2\nb = 5\nf\"The sum of a and b is {a + b}\"\n```\n\n'The sum of a and\
  \ b is 7'\n\n如果你不在 f-string 中求值表达式，就不要使用它们，因为 Python 会浪费时间扫描花括号。我经常将 f-string 与\
  \ print 函数一起使用，来格式化显示给用户的信息。\n\n我将在第 4 章“字符串伴你同行”中更详细地介绍字符串及其操作。\n\n## 2.8 列表操作\n\
  \n你可以在列表上执行许多与字符串相同的操作，包括切片。\n\n```\nyears = [2021, 1983, 1976, 1997, 1990]\nyears\n\
  ```\n\n[2021, 1983, 1976, 1997, 1990]\n\n```\nlen(years)\n```\n\n5\n\n```\nyears[0]\n\
  ```\n\n2021\n\n```\nyears[-2]\n```\n\n1997\n\n```\nyears[1:3]\n```\n\n[1983, 1976]\n\
  \n字符串和列表之间的一个主要区别是，你可以更改列表中的元素：列表是可变的。\n\n```\nyears[0] = 2000\nyears\n```\n\n[2000,\
  \ 1983, 1976, 1997, 1990]\n\n对于字符串，任何修改都必须构造一个新的、不同的字符串。字符串是不可变的，这意味着你不能更改它们的结构或内容。我可以让一个变量指向新字符串，但我不能更改字符串对象本身。\n\
  \n```\nletters = \"abcd\"\nletters\n```\n\n'abcd'\n\n```\nletters[0] = \"A\"\n```\n\
  \nTypeError: 'str' object does not support item assignment\n\n```\nletters = \"\
  A\" + letters[1:]\nletters\n```\n\n'Abcd'\n\n既然我们知道可以更改列表，我们就可以看看一些原地修改列表的操作和方法。\n\
  \n```\nyears = [2021, 1983, 1976, 1997, 1990]\nyears\n```\n\n[2021, 1983, 1976,\
  \ 1997, 1990]\n\n“+” 运算符将两个列表拼接成一个新列表。\n\n```\nyears + [1961, 1980]\n```\n\n[2021,\
  \ 1983, 1976, 1997, 1990, 1961, 1980]\n\n```\nyears\n```\n\n[2021, 1983, 1976, 1997,\
  \ 1990]\n\n*扩展* 方法将第二个列表中的元素追加到第一个列表元素的后面。\n\n```\nyears.extend([1961, 1980])\n\
  years\n```\n\n[2021, 1983, 1976, 1997, 1990, 1961, 1980]\n\n使用 *追加* 方法将新元素放置在**列表**的末尾。\n\
  \n```\nyears.append(2012)\nyears\n```\n\n[2021, 1983, 1976, 1997, 1990, 1961, 1980,\
  \ 2012]\n\n程序员在处理信息和构建数据列表时经常这样做。例如，他们可能以编程方式扫描收入报告，并列出所有收入超过 100 万美元的年份。\n\n*插入*\
  \ 方法将新元素放置在指定索引处。该索引及更高索引处的所有元素都会向右移动一位。此示例将数字 100 插入到第二个位置。请记住：第二个位置的索引是 1。\n\n\
  ```\nyears.insert(1, 1812)\nyears\n```\n\n[2021, 1812, 1983, 1976, 1997, 1990, 1961,\
  \ 1980, 2012]\n\n我们可以使用 *弹出* 方法再将其取出。\n\n```\nyears.pop(1)\n```\n\n1812\n\n```\n\
  years\n```\n\n[2021, 1983, 1976, 1997, 1990, 1961, 1980, 2012]\n\n如果你不带参数使用 *弹出*，它会移除并返回列表中的最后一个元素。从这个意义上说，它与\
  \ *追加* 相反。\n\n```\nyears.pop()\n```\n\n2012\n\n```\nyears\n```\n\n[2021, 1983, 1976,\
  \ 1997, 1990, 1961, 1980]\n\n我将在 3.2 节中详细介绍列表及其操作。\n\n## 2.9 打印\n\n到目前为止，我们只看到了\
  \ Python 显示对象或表达式求值后的值。\n\n```\n\"This is a sample string\"\n```\n\n'This is a sample\
  \ string'\n\n如果你是向代码的使用者显示信息，则需要更复杂的工具来从数据生成文本。*打印* 函数是一种将字符串和对象组合成可读形式的通用方法。\n\n\
  在最简单的形式中，*打印* 接受一个**字符串**，或一个可以转换为**字符串**的对象，并将其显示在控制台上。Python 不会显示定界引号。\n\n```\n\
  print(\"This is a sample string\")\n```\n\nThis is a sample string\n\n```\nprint(17\
  \ + 4)\n```\n\n21\n\n你可以一次打印多个对象，Python 会用空格分隔它们。\n\n```\nprint(57, 99, -4.3)\n\
  ```\n\n57 99 -4.3\n\n### 2.9.1 拼接字符串\n\n你可以在 print 中使用 “+” 拼接字符串。以这种方式连接字符串时，请对任何非字符串对象使用\
  \ str。\n\n```\nprint(\"Last year's revenue was \" + \"3\" + \" million euros\")\n\
  ```\n\nLast year's revenue was 3 million euros\n\n```\nprint(\"Last year's revenue\
  \ was \" + 3 + \" million euros\")\n```\n\nTypeError: can only concatenate str (not\
  \ \"int\") to str\n\n```\nprint(\"Last year's revenue was \" + str(3) + \" million\
  \ euros\")\n```\n\nLast year's revenue was 3 million euros\n\n### 2.9.2 f-字符串\n\n\
  更好的是，使用 f-string。\n\n```\nprint(f\"Last year's revenue was {3} million euros\")\n\
  ```\n\nLast year's revenue was 3 million euros\n\n在这种情况下，我们可以在花括号内编写表达式或函数调用。\n\n\
  ```\nprint(f\"Last year's revenue was {revenue(2020)} million euros\")\n```\n\n\
  Last year's revenue was 3 million euros\n\n我在这里没有定义 revenue，但你可以假设它能访问数据库，或者从列表或其他数据结构中获取结果。\n\
  \n我们在 2.2 节中看到，可以在字符串中使用与定界符相同类型的引号：\n\n```\n\"Don't use \\\"odd\\\" quoted words\
  \ in your prose.\"\n```\n\n'Don\\'t use \"odd\" quoted words in your prose.'\n\n\
  Python 在输出中插入了一个反斜杠来转义单引号。\n\n### 2.9.3 换行符\n\n这就是通过在字符前插入反斜杠来*转义*字符。另一个例子是在**字符串**中放置换行符：使用\
  \ '\\n' 插入换行。\n\n```\n\"See how I broke\\nthis line?\"\n```\n\n```\n'See how I broke\\\
  nthis line?'\n```\n\n当你打印这个字符串时，换行是显而易见的。\n\n```\nprint(\"See how I broke\\nthis\
  \ line?\")\n```\n\n```\nSee how I broke\nthis line?\n```\n\n空格和换行是字符串中*空白字符*的示例。\n\
  \n默认情况下，*打印* 在显示输出后会插入一个换行符。你可以使用可选的*关键字参数* end 来将其改为其他内容。end 最常见的值是空格 ' ' 和空字符串\
  \ \"\"。\n\n```\nprint(\"First string\")\nprint(\"Second string\")\n```\n\n```\n\
  First string\nSecond string\n```\n\n```\nprint(\"First string\", end=' ')\nprint(\"\
  Second string\")\n```\n\n```\nFirst string Second string\n```\n\n默认行为使用换行符 '\\n'\
  \ 作为 end。我们将在 6.5 节中学习更多关于关键字参数的内容。\n\n## 2.10 条件语句\n\n条件语句是这样一种语句：“如果这是真的，就做那件事，否则就做另一件事。”\
  \ 我们需要自己决定“这”、“那件事”和“另一件事”的含义。\n\n条件语句会改变执行流程。条件语句不是按顺序逐个求值表达式，而是允许我们根据某个条件是否为真来分支执行不同操作。\n\
  \n\n\n\n\n虽然在这个示例中我们需要 else 子句，但如果你不需要，也可以不包含它。你可能只想在条件为真时做某事，然后继续执行。\n\n```\nif\
  \ number_of_shortbread_cookies == 0:\n    print(\"Shortbread cookies are out of\
  \ stock.\")\n\nif number_of_sugar_cookies == 0:\n    print(\"Sugar cookies are out\
  \ of stock.\")\n```\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_89_0.png)\n\n图 2.8：酥饼和砂糖饼干流程图\n\
  \n### 2.10.2 “elif”\n\n一个或多个 elif 子句也是可选的。elif 是“else if”的缩写。\n\n```\nif number_of_shortbread_cookies\
  \ > 0:\n    print(\"Here is a shortbread cookie.\")\nelif number_of_sugar_cookies\
  \ > 0:\n    print(\"Here is a sugar cookie.\")\nelse:\n    print(\"Sorry, I have\
  \ no cookies to give you.\")\n```\n\n### 练习 2.15\n\n为这个 `elif` 示例绘制流程图。\n\n你可以随意使用任意数量的\
  \ `elif` 子句，但在超过三四个之后，可能有更高效的方式来编写代码。\n\nPython 在条件中判断真假时非常灵活，除了字面量或计算出的布尔值 `True`\
  \ 和 `False` 之外。\n\n- 数字 0（或 0.0）为假，所有其他数字为真。\n- 空列表为假，但包含任意元素的列表为真。\n- 空字符串 `\"\"\
  ` 为假，所有其他字符串为真。\n\n假设 `cookies_in_stock` 是我们可以购买到的饼干种类列表。\n\n```\ncookies_in_stock\
  \ = [\"shortbread\", \"sugar\", \"oatmeal\"]\n\nif not cookies_in_stock:\n    print(\"\
  We are out of cookies.\")\n```\n\n该条件不为真，因此 Python 不会显示这条消息。你应该总是使用这种形式来测试列表是否为空，而不是计算其长度并与\
  \ 0 比较。\n\n## 2.11 循环\n\n当条件为真时，我们使用循环来重复执行某个动作或一组动作。\n\n### 2.11.1 while\n\n假设我们想要知道小于或等于\
  \ 5 的正整数之和。直接输入并计算对你来说并不难。\n\n```\n1 + 2 + 3 + 4 + 5\n\n15\n```\n\n我使用了一个 f-string，在花括号内放置了一种新的表达式。如果你在变量后面加上等号“=”，Python\
  \ 会同时打印出变量的名称和值。“=”两边的空格是可选的，但为了可读性我加上了。\n\n### 练习 2.17\n\n重写对 print 的调用，以获得等效的输出，但只使用\
  \ {count} 和 {sum}。\n\n### 2.11.2 break\n\nbreak 关键字允许你立即退出循环。\n\n```\nsum, count\
  \ = 0, 1\n\nwhile True:\n    sum += count\n    count += 1\n    if count > 500:\n\
  \        break\n\nsum\n```\n\n```\n125250\n```\n\n代码 `while True` 表示：“以下代码应无限重复，直到发生某些事情来停止重复。”而\
  \ break 就是那个“某些事情”。\n\n### 练习 2.18\n\n在这个 while 循环中，我们执行了多少次加法运算？\n\n我觉得带有终止条件和\
  \ break 埋在代码中的 while 循环，比上面第一个版本更难阅读和调试。你的目标应该是让任何看一眼你代码的人都能尽快看出它在做什么。\n\n### 2.11.3\
  \ continue\n\ncontinue 关键字告诉 Python：“停止你正在做的事情，立即返回到循环顶部，即测试条件之前的位置。”下面的代码将小于或等于\
  \ 500 的奇数相加：\n\n```\nsum, count = 0, 1\n\nwhile count <= 500:\n    if count % 2\
  \ == 0:\n        count += 1\n        continue\n\n    sum += count\n    count +=\
  \ 1\n\nsum\n```\n\n```\n62500\n```\n\n请注意我是如何用取余运算符 % 来判断 count 是否为偶数的。\n\n### 练习\
  \ 2.19\n\n你会如何测试 count 是否为奇数？你会如何测试 count 是否能被 5 整除？\n\n### 2.11.4 for 循环\n\n如果要在值序列上迭代，for\
  \ 循环通常比 while 循环简洁得多。我们经常使用 range 函数来生成一个整数序列，该序列从第一个参数开始，到第二个参数之前结束（不包括第二个参数）。\n\
  \n```\nsum = 0\n\nfor count in range(1, 501):\n    sum += count\n\nsum\n```\n\n\
  ```\n125250\n```\n\n我们将 sum 初始化为零，并将 count 从值 1 开始。这是 range 的第一个参数。当 count 小于 501（range\
  \ 的第二个参数）时，我们重复 for 循环的主体。\n\n我们可以给 range 提供第三个参数，即步长。如果只提供一个参数，起始 int 默认为 0，步长默认为\
  \ 1，给定的数字是结束值。提供两个参数时，步长默认为 1。\n\n```\nsum = 0\n\nfor count in range(1, 501, 2):\n\
  \    sum += count\n\nsum\n```\n\n```\n62500\n```\n\n这里我们遍历了大于或等于 1 且小于 501 的奇数。\n\
  \n### 练习 2.20\n\nrange 的第一个参数不必小于第二个参数，参数可以是任意整数，包括负数。编写一个 for 循环，在一行中打印 5, 4, 3,\
  \ 2, 1。首先按指定顺序打印这些数字，然后试验一下 print。\n\n使用 for 来遍历列表中的元素或字符串中的字符。\n\n```\nfor year\
  \ in [2020, 2022, 2025, 2026]:\n    print(year)\n```\n\n```\n2020\n2022\n2025\n\
  2026\n```\n\n```\nfor character in \"abc\":\n    print(character)\n```\n\n```\n\
  a\nb\nc\n```\n\n表达式 range(0, x) 等价于 range(x)。这里我们展示一个给定字符串从第一个字符开始的子串：\n\n```\n\
  string = \"Zdrasti\"\n\nfor index in range(len(string)):\n    print(string[0:index\
  \ + 1])\n```\n\n```\nZ\nZd\nZdr\nZdra\nZdras\nZdrast\nZdrasti\n```\n\n请仔细研究这个示例，因为它汇集了\
  \ Python 的几个非常有用的特性和函数。\n\n### 练习 2.21\n\n修改这个示例，使其展示以最后一个字符结尾的字符串子串。\n\nPython\
  \ 最让我喜欢的地方之一是可以用 for 循环来构建列表。下面的示例是一个列表推导式，它创建了前五个平方数的列表：\n\n```\n[x*x for x in\
  \ range(1, 6)]\n```\n\n```\n[1, 4, 9, 16, 25]\n```\n\n我们将在 3.5 节再次讨论这些内容。\n\n##\
  \ 2.12 函数\n\n在本节中，我们将本章的许多技术组合成函数的示例。\n\n### 2.12.1 一个简单的函数\n\n下面的 Python 代码是一个\
  \ *identity*（恒等）函数的定义：\n\n```\ndef identity(x):\n    return x\n```\n\n*identity*\
  \ 接受一个参数 x，不对它做任何操作，直接返回它。\n\n函数定义以 def 开头，后跟函数名。之后，我们在括号中列出零个或多个命名参数。我们以冒号结尾。函数体从下一行开始，并缩进。\n\
  \n由于我编写 *identity* 的方式，它不关心 x 的类型。它是重载的，可以处理任何类型的输入。\n\n```\nidentity(7)\n```\n\n\
  ```\n7\n```\n\n```\nidentity(\"just a string\")\n```\n\n```\n'just a string'\n```\n\
  \n```\nidentity([\"one\", 2, 3.0])\n```\n\n```\n['one', 2, 3.0]\n```\n\n*identity*\
  \ 的定义定义了 *参数* x。参数是在函数调用时被赋值为 *实参* 值的变量。在 identity(7) 中，参数 x 被赋值为实参 7。\n\n一个更有趣的函数是“加倍”其输入的函数。\n\
  \n```\ndef double(x):\n    return 2 * x\n```\n\n```\ndouble(7)\n```\n\n```\n14\n\
  ```\n\n为明确思路，让我们先考虑一个数字列表。我们要操作这个列表，将其中最小的数字移动到索引 0 处。在编写函数之前，先编写一些测试代码。这是列表：\n\n\
  ```\nnumbers = [3, 2, 1, 4]\n```\n\n下面是将最小数字渗透到第一个位置的代码。注意循环、条件语句和同时赋值。\n\n```\n\
  for index in range(1, 4):\n    if numbers[0] > numbers[index]:\n        numbers[0],\
  \ numbers[index] = numbers[index], numbers[0]\n\nnumbers\n```\n\n```\n[1, 3, 2,\
  \ 4]\n```\n\n### 练习 2.23\n\n在 range 函数调用中，1 和 4 是什么？\n\n结果符合预期。图 2.9 展示了代码是如何转换这个列表的。你可以看到最小的数字\
  \ 1 是如何被移到列表开头的。只需要两次交换，我用末端带有圆圈的线段表示这些交换，\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_98_0.png)\n\
  \n图 2.9：排序时列表项的移动\n\n\n\n\n现在，我们将这段代码封装到一个函数中，并允许传入参数。\n\n```\n```python\ndef least_first(items):\n\
  \    for index in range(1, len(items)):\n        if items[0] > items[index]:\n \
  \           items[0], items[index] = items[index], items[0]\n    return items\n\n\
  least_first([3, 2, 1, 4])\n```\n```\n\n```\n```text\n[1, 3, 2, 4]\n```\n```\n\n\
  ```\n```python\nleast_first([5, -1, 8, -3, 0])\n```\n```\n\n```\n```text\n[-3, 5,\
  \ 8, -1, 0]\n```\n```\n\n这种技术效果不错，但如果列表只有一个项或为空呢？我们会不会遇到错误？\n\n```\n```python\n\
  least_first([10])\n```\n```\n\n```\n```text\n[10]\n```\n```\n\n```\n```python\n\
  least_first([])\n```\n```\n\n```\n```text\n[]\n```\n```\n\n这些*边界情况*之所以有效，是因为 *range*\
  \ 的工作方式，以及我们没有对空列表访问 `items[0]`。\n\n变量 `items` 和 `index` 都*局部于* `least_first`。我没有在\
  \ Python 环境中定义它们，因此在那里它们是未知的。\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_99_0.png)\n\
  \n图 2.10：“least_first”函数中的局部变量\n\n```\n```text\nitems\n```\n```\n\n```\n```text\n\
  NameError: name 'items' is not defined\n```\n```\n\n虽然你应该尽量为变量使用描述性名称，但程序员通常使用 i、j、k\
  \ 作为索引，我在这个函数定义中也是如此。\n\n# 练习 2.24\n\n请记住，`range` 可以返回一个 `int`，其范围直到第二个参数（但不包括它）。为什么这个第二个参数对于\
  \ i 是 `len(items) - 1`，而对于 j 是 `len(items)`？\n\n# 练习 2.25\n\n如果要按降序对列表排序，你会更改什么？请向\

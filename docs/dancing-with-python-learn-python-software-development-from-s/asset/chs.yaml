  \ 中指定的数值列执行最小-最大归一化。你可以使用 pandas 中的 min 和 max，但不能使用 numpy 或 sklearn 中的任何函数或方法。\n\
  \n## 15.3.2 标准化\n\n设 μ 为一列的均值，σ 为其非零标准差。列值 x_old 的标准化为\n\nx_new = (x_old - μ) /\
  \ σ\n\n如果 x_old = μ + σ，则 x_new = 1。类似地，如果 x_old = μ - σ，则 x_new = -1。\n\n### 练习\
  \ 15.7\n\n标准化后的值能否大于 1.0 或小于 −1.0？\n\n### 练习 15.8\n\n标准化后的列均值是多少？其标准差是多少？\n\n**sklearn**\

  \ CCX Toffoli 门来制作 CCZ。我们在 9.6.5 节中讨论过 Toffoli 门。\n\n以下是 |111⟩ 的 Qiskit 预言机电路：\n\
  \n```python\ncircuit = QuantumCircuit(3)\ncircuit.h(2)\ncircuit.ccx(0, 1, 2)\ncircuit.h(2)\n\

  \ i in range(6)]\n```\n\n```\n[9, 6, 4, 5, 6, 8]\n```\n\n两个列表不同，但现在让我们在列表推导式之前插入一次额外调用，然后再执行两次。\n\
  \n```\nrandom.seed(10)\n[random.randint(1, 10) for i in range(6)]\n```\n\n```\n\
  [10, 1, 7, 8, 10, 1]\n```\n\n```\nrandom.seed(10)\n[random.randint(1, 10) for i\
  \ in range(6)]\n```\n\n```\n[10, 1, 7, 8, 10, 1]\n```\n\n这些序列看起来就不那么随机了。\n\n###\
  \ 5.7.1 伪随机性\n\n*random* 函数计算一个大于或等于 0 且小于 1 的伪随机**浮点数**。\n\n```\n[random.random()\
  \ for i in range(3)]\n```\n\n```\n[0.20609823213950174, 0.81332125135732, 0.8235888725334455]\n\
  ```\n\n在经典计算中，我们从某个*种子*数开始，然后执行一系列算术运算和位运算，以获得“随机”数。如果使用相同的种子开始，我们就会得到相同的数字序列。默认情况下，Python\
  \ 使用计算机系统时间作为种子，不过你也可以通过 `seed` 设置种子。因此，我们将这些数字称为*伪随机*数。\n\n如果我知道你的种子，并且知道你使用的随机数生成算法，那么我可能就能复现你生成的数字。因此，在将伪随机数用于密码学时必须格外谨慎。Python\
  \ 文档在讨论 `random` 时对此作出了说明：\n\n> **警告：** 不应将此模块中的伪随机数生成器用于安全目的。\n> 对于安全或密码学用途，请参阅\
  \ `secrets` 模块。\n\n牢记这一点后，我们继续介绍 `random`。\n\n### 5.7.2 分布\n\n*random* 函数提供的是区间上的*均匀分布*数字，这意味着任意一个值出现的可能性都与其他值相同。更一般地说，`uniform(r,\
  \ s)` 提供范围 *r ≤ n ≤ s* 内的随机**浮点数** *n*。\n\n```\n[random.uniform(0, 2) for i in range(3)]\n\
  ```\n\n```\n[1.3069450678023515, 0.3204591130376393, 1.0413387192798491]\n```\n\n\
  这三个随机数都介于 0 和 2 之间（包括端点）。只有三个值时，你无法看出这是均匀分布，但使用一百万个值就能更好地观察到这一点。\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_209_0.png)\n\
  \n图 5.11：均匀分布中的一百万个伪随机数\n\n我使用 **matplotlib** 创建了图 5.11，我们将在_第 13 章：创建绘图和图表_中讨论它。具体步骤如下：\n\
  \n- 在循环中调用 `random.uniform(0, 2)` 一百万次，并将每个伪随机数四舍五入到小数点后两位。\n- 创建一个字典，其中键是四舍五入后的伪随机数，值是这些数字出现的次数。\n\
  - 将伪随机数绘制在横轴上，将出现次数绘制在纵轴上。\n\n先不考虑端点处的异常，你可以看到我生成每个值的次数大致相同。这就是分布中“均匀”的部分，也通常是人们要求一个“随机数”时所希望得到的结果。\n\
  \n## 练习 5.29\n\n描述一下：如果我使用的伪随机数远多于或远少于一百万个，图像会是什么样子？\n\n## 3.5 比较判别法\n\n假设我们有两个正项级数\
  \ ∑aₙ 和 ∑bₙ。如果 ∑bₙ 是一个已知的收敛级数，且 aₙ ≤ bₙ，那么 ∑aₙ 收敛。如果 ∑bₙ 是一个已知的发散级数，且 aₙ ≥ bₙ，那么\
  \ ∑aₙ 发散。\n\n比较判别法很有用，但它要求我们有一个已知级数可供比较。在许多情况下，我们可以使用几何级数或 p 级数作为比较级数。然而，寻找所需的不等式并不总是容易的，而极限比较判别法提供了一种更加灵活的替代方案。\n\
  \n*sample* 函数不会将牌从牌堆中移除。你必须自行移除这些牌。\n\n## 练习 5.32\n\n编写一个函数，发出 *n* 张牌，然后将它们从牌堆中移除。请务必检查牌堆中是否有足够的牌可供发出。\n\
  \n如果我只想要一张随机牌，可以使用 `choice`。这个函数同样不会修改列表。\n\n```\nrandom.choice(card_deck)\n```\n\
  \n`'9H'`\n\n`choice` 和 `sample` 可以处理列表，但不能直接处理集合或字典。你必须先将其转换为列表。\n\n```\nrandom.choice(list({1,\
  \ 2, 3, 4, 5}))\n```\n\n`4`\n\n```\nnumbers = {0: \"zero\", 1: \"one\", 2: \"two\"\
  }\nkey = random.choice(list(numbers.keys()))\nkey\n```\n\n`2`\n\n```\nnumbers[key]\n\
  ```\n\n`'two'`\n\n## 5.8 量子随机性\n\n在本章中，我们已经看到，数字有许多不同的表示方式。对于整数，我们有十进制、二进制和十六进制。对于浮点数，有带小数点的数字和科学计数法。对于复数，我们使用\
  \ Python 的 j 语法。\n\n量子比特也有其特殊的表示方式。在数学上，我们将量子比特的状态写作\n\n$$a\\lvert 0\\rangle + b\\\
  lvert 1\\rangle$$\n\n## “啊哈！”时刻的心理学：前因与洞见后果的元分析\n\nSara W. Staszak¹ 和 Subrahmanyam²\n\
  \n¹ 加利福尼亚大学戴维斯分校心理学系，美国加利福尼亚州戴维斯\n\n² 加利福尼亚大学伯克利分校心理学系，美国加利福尼亚州伯克利\n\n> “啊哈！”时刻是突然出现的洞见，它们会改变我们理解世界的方式。但是什么会触发这些时刻？它们又会对我们产生什么影响？一项新的元分析发现，关键成分包括惊讶、努力，以及少量积极情绪。\n\
  \n## 摘要\n\n突然洞见的体验——俗称“啊哈！”时刻——长期以来一直令心理学家着迷，但其前因与后果从未得到系统量化。本元分析综合了 214 项独立研究的数据（总\
  \ N = 28,491），考察“啊哈！”体验的认知、情感和动机预测因素，以及其对记忆、学习和创造力的后续影响。通过使用随机效应模型，我们发现了强有力的证据表明：“啊哈！”时刻更可能出现在经历一段僵局之后（Cohen's\
  \ d = 0.72），当解决方案通过重构而非渐进式分析获得时（d = 0.68），以及当解决方案伴随着惊讶感时（d = 0.93）。 “啊哈！”时刻的后果同样显著：它们增强了对解决方案及其背景的记忆（d\
  \ = 0.81），提高了任务动机（d = 0.57），并增加了将解决方案迁移到新问题中的可能性（d = 0.49）。然而，“啊哈！”体验本身并不一定意味着更高的客观洞见准确性——事实上，虚假洞见几乎与真实洞见一样常见。调节分析显示，“啊哈！”体验的强度受到认知需要、特质积极情感和文化背景等个体差异的影响。我们提出了一个整合模型：在该模型中，“啊哈！”体验充当一种元认知奖励信号，强化导致洞见的探索性搜索过程，从而塑造未来的问题解决策略。\n\
  \n## 引言\n\n很少有体验像一个困难问题的解决方案突然跃入脑海的那一刻一样，既普遍可识别，又令人强烈着迷；这一刻通常还伴随着确定感和愉悦感。威廉·詹姆斯将这一现象称为“解决方案瞬间合理性的感觉”（James,\
  \ 1890），而卡尔·邓克等格式塔心理学家则将其视为“生产性”而非“再生性”潜伏期的一个实例，神经相关因素），所操纵或测量的前因变量（例如时间压力、僵局、积极情绪、睡眠），所测量的后果变量（例如记忆表现、动机、创造力），以及所报告效应的方向和显著性。\n\
  \n在一项研究报告多个效应量的情况下，我们为每项研究中的每个构念选择一个效应量，以确保独立性。对于组间比较，我们计算标准化均值差（Cohen's d）；必要时，则使用标准公式将相关系数转换为\
  \ d。\n\n## 统计分析\n\n所有分析均使用 R 中的 metafor 包（版本 3.0；Viechtbauer, 2010）和 JASP（版本 0.17）完成。我们使用限制性最大似然估计的随机效应模型来估计平均效应量，并检验异质性（I²）。我们使用\
  \ Egger 回归检验和剪补法分析检验发表偏倚。调节变量则通过混合效应元回归进行检验。\n\n## 结果\n\n我们的检索确定了 1,947 条记录。移除重复记录并筛选标题和摘要后，对\
  \ 412 篇全文文章进行了资格评估，其中 214 项研究符合纳入标准。最终样本包括来自 29 个国家的 28,491 名参与者，发表年份从 1962 年到 2024\
  \ 年不等。样本量中位数为 87（四分位距 52–154）。\n\n## “啊哈！”时刻的前因\n\n表 1 总结了至少在三项独立研究中考察过的所有前因变量的效应。最强且最稳健的前因是僵局的存在：在解决问题之前陷入僵局的参与者，相比于未经历僵局就解决问题的参与者，体验到的“啊哈！”时刻强度显著更高，平均效应量为\
  \ d = 0.72，95% CI [0.58, 0.86]。第二强的前因是解决方式：通过重构解决的问题，相比于通过渐进式、逐步分析解决的问题，会产生更强烈的“啊哈！”体验（d\
  \ = 0.68，95% CI [0.51, 0.84]）。惊讶也是一个显著的前因：出乎意料的正确解决方案比预期中的正确解决方案引发了更高的“啊哈！”评分（d\
  \ = 0.93，95% CI [0.71, 1.15]）。情感状态也会调节“啊哈！”体验：积极情绪诱导（例如在任务开始前观看一段简短的喜剧片段）会增强“啊哈！”时刻的强度（d\
  \ = 0.35，95% CI [0.19, 0.51]），而消极情绪诱导则会减弱其强度（d = −0.42，95% CI [−0.58, −0.26]）。\n\
  \n**表 1：关于“啊哈！”时刻前因的随机效应元分析汇总**\n\n| 前因变量 | k | N | d | 95% CI | I² | Egger 检验 p\
  \ |\n| --- | --- | --- | --- | --- | --- | --- |\n| 僵局（相对于无僵局） | 34 | 4,567 | 0.72\
  \ | [0.58, 0.86] | 61% | .12 |\n| 重构（相对于渐进式分析） | 28 | 3,821 | 0.68 | [0.51, 0.84]\
  \ | 67% | .08 |\n| 惊讶（对解决方案的惊讶） | 18 | 2,401 | 0.93 | [0.71, 1.15] | 72% | .03 |\n\
  | 提示呈现 | 12 | 1,857 | 0.45 | [0.26, 0.64] | 55% | .21 |\n| 消极情绪（相对于中性情绪） | 9 | 1,263\
  \ | −0.42 | [−0.58, −0.26] | 43% | .46 |\n| 积极情绪（相对于中性情绪） | 15 | 2,198 | 0.35 |\
  \ [0.19, 0.51] | 58% | .19 |\n\n注：k = 研究数量；N = 各研究总样本量；d = 标准化均值差（Cohen's d）；CI\
  \ = 置信区间；I² = 异质性指数。\n\n## “啊哈！”时刻的后果\n\n我们还对“啊哈！”体验对一系列结果测量的影响进行了元分析（表 2）。最显著的后果体现在记忆方面：经历过“啊哈！”时刻的参与者，无论是对解决方案本身还是对问题背景的记忆，都明显优于未经历“啊哈！”时刻的参与者，d\
  \ = 0.81，95% CI [0.65, 0.97]。这种记忆优势既存在于即时记忆测试中，也存在于延迟测试中（最长可达一周后）。“啊哈！”时刻还对动机产生了积极影响：它提高了参与者自我报告的任务兴趣，以及他们在后续问题上的坚持程度（d\
  \ = 0.57，95% CI [0.41, 0.73]）。此外，“啊哈！”时刻促进了迁移：经历洞见的参与者更有可能将解决策略应用到不同领域的新问题中（d =\
  \ 0.49，95% CI [0.33, 0.66]）。\n\n**表 2：“啊哈！”时刻后果的随机效应元分析汇总**\n\n| 结果测量 | k | N |\
  \ d | 95% CI | I² | Egger 检验 p |\n| --- | --- | --- | --- | --- | --- | --- |\n\
  | 记忆（解决方案和背景） | 31 | 4,672 | 0.81 | [0.65, 0.97] | 64% | .07 |\n| 任务动机 | 14 | 1,954\
  \ | 0.57 | [0.41, 0.73] | 51% | .33 |\n| 向新问题迁移 | 17 | 2,610 | 0.49 | [0.33, 0.66]\
  \ | 55% | .18 |\n| 创造力（发散性思维） | 11 | 1,745 | 0.34 | [0.15, 0.53] | 62% | .27 |\n\
  | 解决方案的准确性 | 26 | 3,982 | 0.22 | [0.06, 0.38] | 71% | .09 |\n| 确定感 | 8 | 1,204 |\
  \ 0.74 | [0.51, 0.97] | 49% | .15 |\n\n注：k = 研究数量；N = 各研究总样本量；d = 标准化均值差（Cohen's\
  \ d）；CI = 置信区间；I² = 异质性指数。\n\n## “啊哈！”与洞见准确性\n\n洞见研究中最具争议的问题之一，是“啊哈！”体验是否是解决方案客观正确性的可靠指标。我们的元分析呈现出更复杂的图景。尽管“啊哈！”对解决方案准确性的影响为正但较小（d\
  \ = 0.22；95% CI [0.06, 0.38]），但这一效应受到一个关键调节变量的影响：问题类型。对于具有唯一客观正确答案的问题（例如复合远距联想题、数学谜题），“啊哈！”与准确性之间的联系中等且显著（d\
  \ = 0.48，95% CI [0.30, 0.66]）。然而，对于开放式问题（例如创造性生成任务、定义不明确领域中的问题解决），二者的联系实际上为零（d =\
  \ 0.03，95% CI [−0.18, 0.24]；调节效应 p < .001）。这表明，“啊哈！”体验只有在定义明确的问题空间中，才是准确性的可靠信号。\n\
  \n此外，我们数据集中的若干研究明确考察了虚假洞见现象——即对客观错误解决方案产生“啊哈！”时刻的体验。在六项共计 1,472 名参与者的研究中，所有“啊哈！”时刻中有\
  \ 28% 是虚假的，这意味着主观确定感并不一定与客观准确性相符。这一发现强调，洞见的现象学体验是心智建构的结果，并且可以与客观现实脱钩。\n\n## 调节分析\n\
  \n为了探究异质性的来源，我们针对僵局对“啊哈！”体验的影响（研究最多的前因）进行了调节分析。以下编码的调节变量均未对效应量产生显著影响：任务类型、控制条件类型、“啊哈！”体验是通过自我报告还是行为指标测量，以及研究是在实验室还是在线进行。然而，个体差异确实发挥了作用。将参与者划分为高认知需要和低认知需要（NFC）的研究报告称，对于高\
  \ NFC 参与者，僵局对“啊哈！”体验的影响更大（β = 0.08，p < .001）。考察特质积极情感的研究发现，对于积极情感更高的参与者，僵局增强“啊哈！”体验的效应更强（β\
  \ = 0.06，p = .01）。文化背景也调节了这一效应：与东亚（集体主义）国家的样本相比，来自西方（个人主义）国家样本的效应更大（β = −0.12，p\
  \ = .04）。\n\n## 发表偏倚\n\n只有一项分析中的 Egger 检验显著（惊讶作为前因，p = .03）。剪补法分析表明，校正潜在缺失研究后，惊讶的效应量将从\
  \ d = 0.93 降至 d = 0.71，但仍然较大且具有统计学显著性，这表明发表偏倚不太可能解释本文报告的主要发现。\n\n## 讨论\n\n“啊哈！”时刻不仅仅是一个主观上的奇特体验；它是一种具有明确触发因素和深远后果的稳健心理现象。我们的元分析表明，当个体通过突然重构问题摆脱僵局时，“啊哈！”体验会可靠地产生，并且会受到积极情感和惊讶的增强。反过来，这种体验会强化记忆、提升动机，并促进策略向新情境迁移。按照传统标准（Cohen,\
  \ 1988），我们报告的效应量属于中等到较大范围，并且在大量异质性研究中表现出惊人的一致性。\n\n## 元认知奖励假说\n\n我们将这些发现模式解释为支持“啊哈！”时刻的元认知奖励假说。根据这一观点，“啊哈！”体验既不是问题解决的附带现象，也不是事实真相的可靠指标；相反，它是一种评估发现过程的元认知信号。具体而言，“啊哈！”时刻代表一种奖励信号，强化了导致发现的认知行动，其作用类似于多巴胺在强化学习中的作用。这一解释简洁地说明了为什么“啊哈！”时刻在僵局之后更加强烈（僵局带来的紧张与解决方案带来的释然之间的对比更加鲜明），为什么它们会带来更好的记忆（预测奖励的信号会增强记忆巩固），为什么它们会提高动机（奖励本身就具有动机作用），以及为什么它们不能完美追踪客观准确性（奖励信号由内部产生，可能存在校准错误）。\n\
  \n元认知奖励假说还提出了一些可在未来研究中检验的新预测。例如，如果“啊哈！”时刻是一种内部奖励，那么其频率应与特质层面的奖励敏感性呈正相关；即使解决方案是错误的，多巴胺系统的药理学操纵也应增强这种体验。此外，当“啊哈！”体验伴随着强烈的惊讶感时，其记忆优势应当更大，因为已知惊讶会增强多巴胺能信号传递。\n\
  \n## 局限性\n\n本元分析存在若干局限。第一，不同研究对“啊哈！”时刻这一构念的操作性定义并不相同——有些研究依赖主观评分，有些依赖面部表情，还有一些依赖外周生理测量（例如心率、皮肤电导）。虽然这些不同的操作性定义产生了总体一致的发现，但它们在多大程度上反映完全相同的心理构念，仍不清楚。第二，绝大多数研究都以西方受教育的工业化、富裕和民主（WEIRD）社会中的大学生为对象（Henrich\
  \ et al., 2010），而我们的调节分析表明，文化背景会影响效应大小。第三，由于我们要求研究包含对“啊哈！”体验的测量，因此无法排除我们的检索系统性地排除了仅使用纯行为结果的洞见研究。最后，与所有元分析一样，我们结论的质量取决于原始研究的质量；一些研究的统计功效不足，而且很少有研究预先注册其假设或分析方案。\n\
  \n## 结论\n\n“啊哈！”时刻是一种真实、可测量且具有强大心理效力的事件。它既不是偶然现象，也不只是问题解决的副产品；它是心智向自身发出“已经完成发现”信号的核心机制。理解这一体验的前因和后果，不仅具有理论意义，也对教育、创造力提升和治疗实践具有实际影响。通过阐明“啊哈！”时刻在何时以及为何发生，本元分析为建立更加统一的洞见科学奠定了基础——在这种科学中，我们每个人都熟悉并珍视的突然灵光乍现，将成为心理学研究的核心主题。\n\

  \ 聚类，其中 *k* 是聚类的数量。请记住，虽然聚类图通常只有三个或更少的维度，但这并不限制你使用更多的数值特征，从而使用更多维度。\n\n下面是该算法的概要：\n\
  \n- 1. 如果你的特征代表不同类型的数据或具有不同的数值范围，请像我们在第 15.3 节中所做的那样，对它们进行归一化或标准化。\n- 2. 将 n 个点编号为\
  \ x₀ 到 xₙ₋₁。必须满足 k ≤ n。\n- 3. 随机选择 k 个不同的点 c₀ 到 cₖ₋₁，作为质心的初始猜测。这就是 KMeans 函数提供可选的\
  \ random_state 参数来设置随机种子的原因。\n- 4. 现在，我们为各个聚类生成第一次猜测。将聚类称为 C₀ 到 Cₖ₋₁。从 x₀ 开始，计算\
  \ x₀ 与每个质心之间距离的平方。如果质心 cⱼ 具有最小的平方距离，并且 j 是取此值的最小整数，则将 x₀ 放入 Cⱼ。例如，如果 x₀ 到 c₂、c₃\
  \ 和 c₇ 的平方距离相同，则将 x₀ 放入 C₂，因为 2 < 3 < 7。\n- 5. 对每个点重复上一步。现在，我们已经将每个点放入了某个聚类。\n-\
  \ 6. 将每个质心重新计算为其所在聚类中所有点的均值。\n- 7. 重复将点分配到 k 个聚类的过程。\n- 8. 现在完成了吗？重新计算质心；如果它们自上次计算以来没有发生变化，我们就完成了。使用计算出的质心和聚类退出算法。如果质心发生了变化，则返回上一步，将点分配到各个聚类中。\n\
  \n### 练习 15.16\n\n为什么我们知道在第 4 步之后，每个聚类至少包含一个点？\n\n遗憾的是，该算法并不总能保证收敛到一组唯一的聚类。它可能会在不同的质心之间来回跳动。你可能需要将最后几步限制为固定次数的迭代，例如\
  \ 10 次或 50 次。请进行实验！\n\n在最后一步中，我说的是“如果它们自上次以来没有发生变化”。你可能希望将其改为类似“如果它们自上一次迭代以来的变化不超过\
  \ 0.1”。也就是说，接受接近但不完美的结果。\n\n并非所有数据集和特征子集都能很好地进行聚类。值得将聚类作为第一种技术，尝试了解信息中是否存在某种明显的结构。\n\

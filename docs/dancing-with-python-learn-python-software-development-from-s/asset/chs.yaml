  \ 图形。我使用 text 函数为电路的每个部分标注。有关详细信息，请参阅第 13 章《创建图表》。\n\n在解释电路中关于均值反转部分的工作原理之前，让我们通过在模拟器上运行电路来验证结果。\n\
  \n```\nfrom qiskit import execute, Aer\nfrom qiskit.visualization import plot_histogram\n\

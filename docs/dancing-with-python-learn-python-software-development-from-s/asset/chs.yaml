  \n在一般的多维情形下，我们有多个输入，我将其称为 *x*。在四维空间中，超平面的方程是\n\n$$y = w_1x_1 + w_2x_2 + w_3x_3 +\
  \ b$$\n\n其中 $w_j$ 和 $b$ 是常数，$x_j$ 是自变量。你可能会看到其他字母代替 $w$：$a$ 和 $c$ 也很常见。$b$ 是一个常数，通常为\
  \ 0。在机器学习中，我们称 $b$ 为“偏置”（bias）。\n\n除了预测之外，我们还可以将线性回归用于二分类，如图 15.14 所示。例如，如果 $y \\\
  geq 0$，则当新观测为“真”时返回 1；否则，返回 0 表示“假”。\n\n图 15.15 显示了三个输入节点、隐藏层中的四个节点和两个输出节点。我还展示了输入节点到第一个隐藏节点\
  \ $h_1$ 的*权重* $w_{i,1}$。我们还有连接输入节点与 $h_2$、$h_3$、$h_4$ 的权重，以及连接这些节点与输出节点的权重。为了保持图表简洁，我没有画出它们。\n\
  \n节点的另一个名称是*神经元*，图 15.15 展示了一个*神经网络*。更准确地说，这是一个*人工神经网络（ANN）*，因为它与我们相信在大脑中发生的事情相似。正如我们将看到的，我们可以用这类网络进行机器学习。\n\
  \n重要的问题包括：\n\n- 我们可以有更多输入吗？（可以）\n- 我们可以有更多隐藏节点吗？（可以）\n- 我们可以有更多输出吗？（可以）\n- 隐藏层中的节点会发生什么？\n\
  - 我们可以有更多隐藏层吗？\n\n我已经回答了前三个问题，所以让我们看看隐藏节点的内部来回答第四个问题。我以 $h_1$ 为例。与线性回归一样，我们计算\n\n\
  ```\n$$w_{1,1}x_1 + w_{2,1}x_2 + w_{3,1}x_3 + b_1$$\n```\n\n我调整了下标以表示我们在处理 $h_1$。我把这个结果称为\
  \ $z_1$。接下来呢？我们向输出层中的 $y_1$ 和 $y_2$ 发送什么？\n\n### 15.8.1 激活函数\n\n在 $h_1$ 内部，我们计算\
  \ $z_1$，然后应用一个*激活函数*，我称之为 $af$。\n\n```\n$$af(z_1) = af(w_{1,1}x_1 + w_{2,1}x_2 +\
  \ w_{3,1}x_3 + b_1)$$\n```\n\n我们将 $af$ 的结果发送给 $y_1$ 和 $y_2$。如果我们发送的结果是 0，就等于在说“这个节点没有贡献”。反过来，非零结果则表示“这个节点/神经元已被激活”。\n\
  \n如果 $af$ 是线性函数，那么这个神经网络实现的就是线性回归，因此作为一种新技术并不十分有趣。然而，机器学习从业者有时会使用恒等函数 $af(x)=x$\
  \ 作为激活函数。其作用是接收 $z_1$ 并将其原样传递到 $y_1$ 和 $y_2$。\n\n\n\n\n\n在 $h_1$ 中，我们计算\n\n$$w_{1,1}x_1+w_{2,1}x_2+b_1$$\n\
  \n然后应用二进制阶跃激活函数。我们必须定义输入变量、权重和偏置。\n\n$x_1$ 是一个二值变量。如果你**没有**两个小时去杂货店、回家并准备晚餐，它的值为\
  \ 0；如果你有，则值为 1。当 $x_1$ 为 0 时，我会点披萨，因为我没有时间去购物。\n\n$x_2$ 是一个取值范围在 0.0 到 1.0 之间的**浮点数**。如果你非常想吃披萨，值为\
  \ 1.0；如果你不想吃披萨，值为 0.0。我假设你可以吃披萨，但 0.0 表示你更想吃别的东西。\n\n考虑\n\n$$z_1=-10x_1+20x_2+1$$\n\
  \n之后我应用二进制阶跃函数 $H$。当 $x_1$ 为 0 时，$z_1$ 对所有允许的 $x_2$ 值都为正。因此，我们将 1 传递给 $y_1$：我们会点披萨。\n\
  \n当 $x_1$ 为 1 时，意味着我确实有时间去购物，\n\n$$z_1=-10\\times1+20x_2+1=20x_2-9$$\n\n当 $x_2=0.45$\
  \ 时，$z_1=0.0$。当 $x_2=0.5$ 时，$z_1=1.0$。这意味着当我有时间并且对披萨的渴望大于 0.45 时，我会点披萨。否则，我会去商店。\n\
  \n在实践中，我们会有更多的输入和隐藏节点。我们会从人们那里收集许多关于他们认为重要特征的示例数字输入。然后，我们会将所有数据划分为训练集和测试集。请记住，对于训练集，我们知道人们是否点了披萨：这就是结构化学习。\n\
  \n在运行一个训练示例后，我们用数学方法调整权重，然后处理下一个示例。我们不断调整权重和偏置。如果我们有足够的数据并且这些数据是线性可分的，最终我们会稳定下来。然后我们使用测试集来确认我们拥有一个能在大多数情况下正确预测输出的模型。\n\
  \n这只是机器学习软件和从业者处理简单神经网络的一个粗略概述，但我希望它足以让你有所了解。\n\n## 15.8.3 深度学习\n\n当我们有多个隐藏层时，我们就在进行*深度学习*。对于深度学习所需的最少层数，人们看法不一，但简单来说，我认为是两层。图15.19展示了一个具有三个隐藏层的网络。\n\
  \n![](img/4ffeafa3e3f1373f02971e43b0755ea6_644_0.png)\n\n图15.19：具有4个输入、3个隐藏层和3个输出的深度神经网络\n\
  \n请注意，并非每个隐藏层的节点数都与其他隐藏层相同。一个层中的每个节点也未必与下一层中的每个节点相连。当所有节点都相连时，该网络就是*全连接*的。\n\n每一层内部会发生什么？一个全连接层可能将其输入乘以权重，然后加上一个偏置值。另一个层可能唯一的功能就是应用我们之前见过的某个激活函数。\n\
  \n*归一化层*应用我们在*第15.3节*中讨论过的归一化或标准化变换，或其他适合数据类型的变换。该操作可能是其他层（如输入层）的一部分。\n\n许多深度学习网络的例子都涉及图像识别。在这里，你可以想象输入是一个三维像素数组。其中两个维度表示图像像素的矩形布局，第三个维度存储每个像素的RGB值。\n\
  \n如果一张照片的分辨率是 4,032 × 3,024，那么它有 12,192,768 个像素。如果我们将此乘以 3，得到 36,578,304。这是大量的输入！如果第一个隐藏层有\
  \ 100 个节点，并且我们将输入与这个隐藏层全连接，那么我们将有超过 3600 万个权重。这会导致大量的计算。\n\n对于这种输入，我们可能会使用*池化层*，它查看像素的方形块，并计算每个方块中像素的平均或最大RGB值。这样，我们可以缩小图像尺寸，尽管会损失分辨率。\n\
  \n另一种类型的层执行*卷积*操作。可以把卷积理解为一种过滤或聚焦输入特征的过程。例如，给定一张输入照片，我们可以使用卷积来检测物体的边缘。\n\n*裁剪层*会截去图像的一部分，可能会生成更小的图像。例如，我们可能想要移除图像周围的额外空白区域。\n\
  \n我们通过连接和应用这些以及其他类型的层，从 3600 万个输入走向图像识别。是的，我们可能会说“照片里有三只猫”或“这是一只狗，不是一条鱼”，但我们也许还能识别医学图像中的肿瘤。\n\
  \n深度学习推动了自然语言处理（NLP）领域的巨大进步，我们曾在*第12.3节*中讨论过这一主题。从业者使用深度神经网络进行情感分析、命名实体解析、文本和语音生成，以及实现聊天机器人和其他应用。\n\
  \n我们训练深度学习网络的方法是：输入数据，让数据通过各层，并将计算出的输出与我们的预期进行比较。请记住，这是监督学习，因此我们知道训练集中数据的输出。利用线性代数和微积分，我们从期望输出与实际输出之间的差异反向计算，以调整各层中的权重和其他内部参数。这种技术称为*反向传播*。\n\
  \n如果想学习神经网络和深度学习的数学原理与技术，我强烈推荐 Ian Goodfellow、Yoshua Bengio 和 Aaron Courville 合著的《深度学习》一书。[DLG]\n\
  \n接下来，由于纠缠，每增加一个量子比特，我们的量子计算空间的维度就会翻倍。如果我们有 10 个量子比特，量子态所处的空间维度为 $2^{10}=1,024$。对于\
  \ 64 个量子比特，维度为 $2^{64}=18,446,744,073,709,551,616$，也就是一千八百四十四京六千七百四十四兆零七百三十七亿零九百五十五万一千六百一十六。\n\
  \n虽然我们在数据集中永远不会需要那么多特征，但研究人员正在探索如何利用量子计算中维度增长的“有益”一面，来控制人工智能中特征和计算结构（如矩阵）的“有害”增长。\n\
  \n我们在本章中看到的技术是许多人长期发展而来的，还有更多我未讨论的激活函数、算法、隐藏层类型和方法。量子计算中像叠加和纠缠这样根本不同的想法能否为我们提供新的模式匹配方法？我们能否用更少的训练创建更好的核函数来进行分类？\n\
  \n量子计算机不是“大数据机器”。它们无法摄入 GB 级的数据并对其进行处理。然而，我们能做的是研究如何将最好的经典思想和新的量子思想结合起来，创造出更好的AI，造福社会。\n\
  \n## 15.10 小结\n\n在本章中，我们简要了解了机器学习、神经网络和深度学习。我们聚焦于这些技术背后的核心思想，并向你展示了如何通过几个 Python\
  \ 中的**sklearn**编码示例来入门。\n\n但是，就附录和书末内容而言，本章结束了这次 Python 入门介绍。我们一起探索了经典编程技术，并看到了量子计算如何成为这些技术的自然补充和延伸。编码的未来是经典与量子对象、构造、控制和算法的集成。祝愿你在通往那个激动人心的未来的个人旅程中取得巨大成功！\n"

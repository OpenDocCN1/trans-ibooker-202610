  \nFigure A.7: Jupyter session with matplotlib output\n\n我鼓励你探索 **Jupyter** 窗口中提供的其他命令。你可以从\
  \ Python 以非交互模式运行该应用程序：我执行了本书中的 Python 命令，并通过未使用浏览器界面的 **Jupyter** 笔记本收集了它们的输出。\n\

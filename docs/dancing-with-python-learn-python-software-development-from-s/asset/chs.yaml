  \nFigure 1.5: A for-loop flowchart\n\n## 1.8 Exceptions\n\n在许多科幻故事、小说、电影和电视剧中，角色使用“传送”将人和物体从一个地方移动到另一个地方。例如，主角可以瞬间从多伦多传送到东京，而无需经历耗时的航空旅行。\n\
  \n它也在此类情节中用于让角色从危险和意外的情况下逃脱。也许一只怪物可能把团队困在山洞的后面，没有办法为安全而战。领导者通过通信设备匆忙呼叫可能会要求“把我们带离这里！”或“现在把我们传上来！”\
  \ STAR TREK® 系列和电影经常出现后者感叹。\n\n因此，角色使用传送进行常规运输，也用于通常危及生命的特殊情况。许多编程语言也有异常的概念和机制。\n\
  \n在一个循环或一个写得很好的函数中，你可以看到你的代码的执行如何从一个步骤移动到另一个步骤。有了异常，你会说，“试试这个，如果不行，就回到这里。”或者，你可能在想，“我做我的事，但可能会不时发生一些事情，我需要处理它如果发生的话。”你处理异常的代码位置称为其捕获点。\n\
  \n假设你想删除一个文件。你有它的名字，并调用一个函数来删除该文件。唯一的问题是该文件不存在。你如何处理这个问题？一种方法是使用条件：如果文件存在，则删除它。另一种方法是使用异常：尝试删除文件，如果出现问题（例如它不存在），则引发异常，并返回并决定你应该如何处理它。\n\
  \n另一个可能引发异常的好例子是除以零。如果你的代码尝试这样做，你的代码中肯定存在严重错误，并且解决方案可能对你来说并不明显。使用异常可以帮助你找到处理或代码设计错误。\n\
  \n异常通常包含解释其被引发原因的信息。也许我们无法删除文件，因为它不存在。或者，也许我们没有权限删除它。当我们捕获异常时，我们可以看到发生了什么并相应地继续。\n\
  \n\n\n\n\n一个异常可以在单个函数内部被引发并捕获。或者，它可能起源于距离捕获点数百步之外的位置。函数经常调用其他函数，而这些函数又调用其他函数。异常可能来自于这些深度嵌套的函数执行之一。\n\
  \n使用异常的哲学和被接受的惯例因编程语言而异。像软件开发中的许多主题一样，异常可以成为热情和激烈辩论的焦点。\n\n## 1.9 记录\n\n考虑这个包含粗体和斜体格式文本的一句话段落：\n\

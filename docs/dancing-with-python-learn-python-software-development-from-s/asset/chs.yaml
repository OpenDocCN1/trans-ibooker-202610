  \n### 9.6.1 单量子比特门简介\n\n我们将量子比特的值或状态表示为两个复数 $(a, b)$，满足\n\n$|a|^2 + |b|^2 = 1$。\n\
  \n例如，我们可能有 $a = 1$、$b = 0$，或者反过来。这些是重要的情形，我们为它们起了专门的名字。$(1, 0)$ 是 $|0\\rangle$，读作“ket-0”，而\
  \ $(0, 1)$ 是 $|1\\rangle$，读作“ket-1”。\n\n如果你熟悉线性代数，$|0\\rangle$ 和 $|1\\rangle$ 合在一起被称为单量子比特的计算基或标准基。用线性代数的列向量记号表示，它们就是\n\
  \n$|0\\rangle = \\begin{bmatrix} 1 \\\\ 0 \\end{bmatrix}, \\qquad |1\\rangle = \\\
  begin{bmatrix} 0 \\\\ 1 \\end{bmatrix}$。\n\n由于 $a$ 是复数，$a = a_1 + a_2 i$，其中实部为 $a_1$、虚部为\
  \ $a_2$。它们都是实数。根据定义，$|a| = \\sqrt{a_1^2 + a_2^2}$。因此 $|a|^2 = a_1^2 + a_2^2$。对 $b$\
  \ 也有类似的结论。\n\n我们可以写成\n\n$(a, b) = a\\,(1, 0) + b\\,(0, 1) = a\\,|0\\rangle + b\\\
  ,|1\\rangle$。\n\n这个描述量子态的方程被称为*叠加*。$a$ 是 $|0\\rangle$ 的*振幅*，$b$ 是 $|1\\rangle$ 的振幅。在量子计算教材和文章中，你常会看到\
  \ $a\\,|0\\rangle + b\\,|1\\rangle$ 被简写为 $|\\psi\\rangle$。\n\n虽然这种记号对你来说可能有些奇怪，但假设我请你“向东走\
  \ 3 个街区，再向北走 4 个街区”。用 ket 记号表示，就是：\n\n$3\\,|\\text{east}\\rangle + 4\\,|\\text{north}\\\
  rangle$。\n\n这样一来，你就“同时既向东又向北”。这就是人们有时会说“量子比特同时是 0 和 1”的由来。\n\n振幅 3 和 4 不能用于量子态，因为\
  \ $|3|^2 + |4|^2 \\neq 1$。\n\n如果存在一个复数 $c$，满足 $|c| = 1$，且 $a_0 = c\\,a_1$、$b_0 =\
  \ c\\,b_1$，则两个量子态 $a_0\\,|0\\rangle + b_0\\,|1\\rangle$ 和 $a_1\\,|0\\rangle + b_1\\\
  ,|1\\rangle$ 是*等价*的。我们说这两个量子态“相差一个*全局相位* $c$”。\n\n现在来看作用于单个量子比特的量子门。我用下面的记号展示门的工作方式：\n\
  \n$a\\,|0\\rangle + b\\,|1\\rangle \\mapsto c\\,|0\\rangle + d\\,|1\\rangle$\n\n\
  箭头“$\\mapsto$”表示“映射到”。对于下面每个门，请验证 $|c|^2 + |d|^2 = 1$。\n\n所有量子门都是可逆的。\n\n### id\
  \ 量子门\n\n与比特情形一样，恒等门 **id** 不做任何操作。在电路图中，我们用右侧的符号表示 **id** 门。\n\n**id**: $a\\,|0\\\
  rangle + b\\,|1\\rangle \\mapsto a\\,|0\\rangle + b\\,|1\\rangle$\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_377_0.png)\n\
  \n### X 量子门\n\n**X** 门将经典比特的**非门**推广到量子比特。\n\n**X**: $a\\,|0\\rangle + b\\,|1\\\
  rangle \\mapsto b\\,|0\\rangle + a\\,|1\\rangle$\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_377_1.png)\n\
  \n我们称 **X** 为比特翻转，因为 $X(|0\\rangle) = |1\\rangle$ 且 $X(|1\\rangle) = |0\\rangle$。它能做的更多，因为量子态比比特状态丰富得多。例如，\n\

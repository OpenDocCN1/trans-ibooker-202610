  \ 在你想要重复某事指定次数时非常有用。此示例使用 Go 语言：\n\n```\n```go\nsum := 0\nfor n := 1; n <= 50; n++\
  \ {\n    sum += n\n}\n```\n```\n\n它将 1 到 50 之间的所有数字相加，结果存储在 sum 中。这里，:= 是赋值，n++\
  \ 表示“用其先前值加 1 替换 n 的值”，sum += n 表示“用其先前值加上 n 的值替换 sum 的值”。\n\n这种特定语法 for-loop 有四个部分：\n\
  \n- - 初始化：n := 1\n- - 条件：n <= 50\n- - 主体后处理代码：n++\n- - 主体：sum += n\n\n顺序是：执行一次初始化；测试条件，如果为真则执行主体；执行主体后代码；再次测试条件并重复。如果条件在任何时候为假，循环停止，我们转到循环后跟随的代码。\n\

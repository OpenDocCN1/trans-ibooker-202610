  s = UniPoly(1, 's', 1)\n\nfor exp_coef in (s - 1)**4:\n    print(exp_coef)\n```\n\
  \n(4, 1)\n(3, -4)\n(2, 6)\n(1, -4)\n(0, 1)\n\n我在 __iter__ 的文档中使用了一个 Notes 部分。\n\n\
  如果一个对象同时是可迭代对象和迭代器，那么该对象很可能将迭代状态存储在其自身内部。这就是为什么 __iter__ 可能返回 self 的原因。不过，正如我们所见，你可能希望以多种方式迭代一个对象。在这种情况下，你会像\
  \ Python 对字典所做的那样，创建单独的可迭代对象。\n\n### 练习 7.37\n\n在我们的 UniPoly 类中，我定义了一个属性 is_constant，它告诉我们一个多项式是否为常数。请记住，常数多项式没有自变量指数大于\
  \ 0 的项。\n\n```\n@property\ndef is_constant(self):\n    \"\"\"True if the polynomial\

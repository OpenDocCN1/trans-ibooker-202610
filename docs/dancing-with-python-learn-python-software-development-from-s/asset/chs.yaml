  \n图 11.11：关于均值的第三次反转\n\n### √n 次反转\n\n这就是 Grover 搜索算法的实际应用。我们正在一个大小为 n 的集合中搜索某个对象\
  \ X。我们将集合中的项目与 m 个量子比特的标准基 ket 对应起来，其中 n ≤ 2^m。本节的示例中，n = 8 且 m = 3。\n\n现在假设有人给我们一个按如下方式作用的\

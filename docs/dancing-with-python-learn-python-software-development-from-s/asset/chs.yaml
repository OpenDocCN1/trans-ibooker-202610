  ```\n\n{'11': 1000}\n\n在对 |11⟩ 进行符号翻转的 CZ oracle 之后，2 量子比特量子态为\n\n(1/2) |00⟩ + (1/2)\
  \ |01⟩ + (1/2) |10⟩ − (1/2) |11⟩\n\n我们接下来对每个量子比特应用 H 门。这是我们在第 9.6.4 节末尾看到的 2 量子比特\
  \ H⊗2 门。\n\n(1/2) (H⊗2) |00⟩ + (1/2) (H⊗2) |01⟩ + (1/2) (H⊗2) |10⟩ − (1/2) (H⊗2)\
  \ |11⟩\n\n这是一个包含 16 项的非常繁琐的计算。H⊗2 在标准基 ket 上的应用为\n\nH⊗2 |00⟩ = (1/2) (|00⟩ + |01⟩\
  \ + |10⟩ + |11⟩)\nH⊗2 |01⟩ = (1/2) (|00⟩ − |01⟩ + |10⟩ − |11⟩)\nH⊗2 |10⟩ = (1/2)\
  \ (|00⟩ + |01⟩ − |10⟩ − |11⟩)\nH⊗2 |11⟩ = (1/2) (|00⟩ − |01⟩ − |10⟩ + |11⟩)\n\n\
  代入这些值并整理项，结果为\n\n(1/2) |00⟩ + (1/2) |01⟩ + (1/2) |10⟩ − (1/2) |11⟩\n\n这可能让你惊讶这是原始值，但在这种情况下它确实是结果。\n\

  \n图 15.10 中的圆圈显示朋友在房间中的站立位置。我已将朋友及其位置标记为 A、B 和 C。\n\n\n\n\n\n## 15.7 线性回归\n\n*线性回归*是一种将超平面拟合到包含自变量和一个因变量的训练集上的技术。\n\
  \n一个常见用途是确定一条“最佳”直线，使其尽可能逼近二维散点图中的点。这里，*x* 坐标是自变量，*y* 坐标是因变量。这就是*简单线性回归*。\n\n如果我们有多个自变量，就是在执行*多元线性回归*。在本节中，我们考察一个简单案例以及普通最小二乘算法。\n\
  \n给定一个新的自变量观测值 *x*，直线方程使我们能够计算其因变量 *y* 的估计值。设 *x*ₘᵢₙ 和 *x*ₘₐₓ 分别为训练集中 *x* 的最小值和最大值。如果\n\
  \n*x*ₘᵢₙ ≤ *x* ≤ *x*ₘₐₓ\n\n那么对 *y* 的预测称为*插值*。否则，该预测称为*外推*或*预测*。\n\n### 练习 15.25\n\
  \n为什么线性回归是一种监督式技术？\n\n笛卡尔 *xy* 平面中直线的方程是\n\n*y* = *m x* + *b*\n\n其中 *m* 是斜率，*b*\
  \ 是 *y* 截距，因为当 *x* = 0 时，*y* = *b*。在将直线拟合到训练数据之前，统计学家将 *m* 和 *b* 称为*未知参数*。\n\n###\
  \ 练习 15.26\n\n在平面中定义一条直线需要多少个不同的点？确定一个超平面需要多少个不同的点？\n\n将你对这些问题的答案与你在测试集 DataFrame\
  \ 中所需的最少行数联系起来。\n\n当我们有两个点，例如 (2.0, 2.0) 和 (8.0, 5.0) 时，计算穿过它们的直线很简单。在这种情况下，$m =\
  \ 0.5$，$b = 1.0$，图 15.11 显示了该直线。\n\n![](img/4ffeafa3e3f1373f02971e43b0755ea6_634_0.png)\n\
  \n图 15.11：两个点上的简单线性回归\n\n当我们加上点 (4.0, 5.0) 时会发生什么？不存在一条直线同时穿过这三个点，因此我们要找一条在某种程度上比其他任何直线都更好地代表这些数据的直线。\n\
  \n![](img/4ffeafa3e3f1373f02971e43b0755ea6_634_1.png)\n\n图 15.12：三个点上的简单线性回归\n\n\
  我在图 15.12 中将我们想要的直线标记为 $L$。最初的三个点是黑色实心圆。我们需要计算 $L$ 的方程，使得从我们的点到 $L$ 的垂直距离的平方和最小。白色圆圈是\
  \ $L$ 上离初始点最近的点，它们的垂直距离分别是 $e_1$、$e_2$ 和 $e_3$。\n\n可以把 e₀ 中的“e”看作数据与理想直线 L 之间的“误差”（error）。你可能会看到有些人用希腊字母\
  \ epsilon = ε 来代替 e。\n\n我们将以下技术称为线性最小二乘算法，因为我们想要最小化\n\ne₁² + e₂² + e₃²\n\n更一般地，这个总和除以观测数量称为均方误差（Mean\
  \ Squared Error，MSE）：\n\nMSE = (e₁² + e₂² + e₃²) / 3\n\n这是代价函数（cost function）的一个例子。我们在机器学习中，以及更一般地在优化问题中，经常定义和使用这类函数。在将机器学习模型最佳拟合到训练数据时，最小化代价函数的输出往往是目标。\n\
  \n另一个代价函数是平均绝对误差（Mean Absolute Error，MAE）：它取 eⱼ 的绝对值而不是平方。\n\nMAE = (|e₁| + |e₂|\
  \ + |e₃|) / 3\n\n我们在第 14.1.3 节定义绝对偏差和标准差时，已经考虑过绝对值与平方的比较。\n\n我们有三个点\n\n(x₁, y₁)\
  \ = (2.0, 2.0)\n(x₂, y₂) = (4.0, 5.0)\n(x₃, y₃) = (8.0, 5.0)\n\n设 y = m x + b 为直线\
  \ L 的方程。我们希望找到 m 和 b，使得\n\n(y₁ − m x₁ − b)² + (y₂ − m x₂ − b)² + (y₃ − m x₃ − b)²\n\
  \n尽可能小。\n\n计算这个的数学内容超出了本书的范围，但如果我们令 μₓ 为原始点的 x 坐标均值，μᵧ 为原始点的 y 坐标均值，那么\n\nm = [(x₁\
  \ − μₓ)(y₁ − μᵧ) + (x₂ − μₓ)(y₂ − μᵧ) + (x₃ − μₓ)(y₃ − μᵧ)] / [(x₁ − μₓ)² + (x₂\
  \ − μₓ)² + (x₃ − μₓ)²]\nb = μᵧ − m μₓ\n\n使用求和记号并推广到 $n$ 个点，我们得到\n\n$$m = \\frac{\\\
  sum_{j=1}^{n}(x_j-\\mu_x)(y_j-\\mu_y)}{\\sum_{j=1}^{n}(x_j-\\mu_x)^2} = \\frac{n\\\
  sum_{j=1}^{n}x_jy_j-\\left(\\sum_{j=1}^{n}x_j\\right)\\left(\\sum_{j=1}^{n}y_j\\\
  right)}{n\\sum_{j=1}^{n}x_j^2-\\left(\\sum_{j=1}^{n}x_j\\right)^2}$$\n\n$$b = \\\
  mu_y-m\\mu_x$$\n\n诚然，这看起来很复杂。$m$ 的第二种定义很容易用 **numpy** 转化为一个 Python 函数：\n\n```\n\
  def simple_linear_regression(xs, ys):\n    # return the slope and y-intercept of\
  \ the simple\n    # linear regression line\n\n    n = xs.size\n    assert n == ys.size\n\
  \n    numer = n * (xs * ys).sum() - xs.sum() * ys.sum()\n    denom = n * (xs * xs).sum()\
  \ - (xs.sum())**2\n    slope = numer / denom\n    y_intercept = ys.mean() - slope\
  \ * xs.mean()\n    return slope, y_intercept\n```\n\n注意，用 **numpy** 表达这些求和多么容易。现在计算\
  \ $m$ 和 $b$，从而得到 $L$：\n\n```\nxs = np.array([2.0, 4.0, 8.0])\nys = np.array([2.0,\
  \ 5.0, 5.0])\n\nsimple_linear_regression(xs, ys)\n```\n\n(0.42857142857142855, 2.0)\n\

  \ 7.8 中，我用双线展示了这个菱形。\n\n## 7.14 迭代器\n\n当 Python 遍历一个列表时，实际会发生什么？\n\n```\nfor i in\
  \ [2, 3, 5]:\n    print(i)\n```\n\n2\n3\n5\n\nPython 会跟踪你在列表中的位置，并在你每次请求时返回“下一个”项目。当你到达列表末尾时，循环终止。它的行为类似于这样：\n\
  \n```\nthe_list = [2, 3, 5]\nthe_index = 0\n\nwhile True:\n    if the_index < len(the_list):\n\
  \        print(the_list[the_index])\n        the_index += 1\n    else:\n       \
  \ break\n```\n\n2\n3\n5\n\n这种迭代看起来像是从列表开头到末尾的正常推进。“迭代”的含义由你决定：你可以定义它来做任何你想做的事情。\n\
  \n```\nthe_list = [2, 3, 5]\nthe_index = len(the_list) - 1\n\nwhile True:\n    if\
  \ the_index >= 0:\n        print(the_list[the_index])\n        the_index -= 1\n\
  \    else:\n        break\n```\n\n5\n3\n2\n\n在这种情况下，我们设置的迭代框架会从最后一个到第一个选择项目。“下一个”项目位于列表中我们最后访问的项目之前。\n\
  \n*迭代器*对象有一个由它的类定义的 `__next__` 魔术方法。第一次调用 `__next__` 时，它会返回“初始”对象。Python 代码会记住你的位置，随后对\
  \ `__next__` 的调用会逐个处理所有项目。\n\n*可迭代对象*有一个 `__iter__` 魔术方法，它返回一个迭代器对象。一个对象可能同时是可迭代对象和迭代器。在这种情况下，`__iter__`\
  \ 通常只返回 self。\n\n可迭代对象通过 `__iter__` 返回一个迭代器。\n\n### 练习 7.35\n*range* 返回的对象是可迭代对象、迭代器，还是两者都是？\n\
  \nPython 在 for 循环中通过 *iter* 和 *next* 自动调用 `__iter__` 和 `__next__`。你也可以自己调用它们。\n\n\
  ```\nmy_iter = iter([2, 3, 5])\nprint(next(my_iter))\n```\n\n2\n\n```\nprint(next(my_iter))\n\
  ```\n\n3\n\n```\nprint(next(my_iter))\n```\n\n5\n\n如果你再调用一次，*next* 会引发 **StopIteration**\
  \ 异常。\n\n```\nprint(next(my_iter))\n```\n\nStopIteration\n\n你应该在 `__next__` 代码中引发这个异常，以便\
  \ for 循环正确工作。在 try 块中查找并捕获 **StopIteration**。\n\n如果你在迭代对象时修改了它，你可能会遇到错误，或者至少会得到意外结果。例如，你可能不希望在循环处理列表时向其中插入或删除项目。\n\

  \n\n\n\n\n## PART I\n## 认识 Python\n\n## 2.1 数字\n\nPython 中最常用的两种数字形式是整数和浮点数。整数不包含小数点，可以为负数、零或正数。\n\
  \n```python\n-4\n```\n\n```text\n-4\n```\n\n```python\n0\n```\n\n```text\n0\n```\n\
  \n```python\n837375400388826538847463290993837000004846673\n```\n\n```text\n837375400388826538847463290993837000004846673\n\
  ```\n\n正如你所见，整数可以非常大。Python 使用类型 int 表示整数。我们稍后会了解更多，但通常会说“-17 是一个 int”。\n\n浮点数，也称为\
  \ float，包含小数点，但有时系统在保留你输入的内容或计算结果时会有信息上的限制。\n\n```python\n-3.6836\n```\n\n```text\n\
  -3.6836\n```\n\n```python\n17.9817359935767429962445362777253636\n```\n\n```text\n\
  17.98173599357674\n```\n\n这里当小数点右侧的位数太多，Python 无法存储时，我们丢失了精度。如果左侧位数太多，Python 会使用指数形式。\n\

- "# 应用安全项目手册：软件工程师和团队领导的指南 (MEAP V02)\n\n\n\n\n\n\n\n\n\n![](img/cc84747f93d290964598894b4f5c153b_0_0.png)\n\
  \n![](img/cc84747f93d290964598894b4f5c153b_0_1.png)\n\n\n![](img/cc84747f93d290964598894b4f5c153b_1_0.png)\n\
  \n\n\n\n\n## welcome\n\nThank you for your interest in this book *Application Security\
  \ Program Handbook*. This book is intended for developers, architects, and leaders\
  \ that are looking to understand the purpose and benefit of building security into\
  \ the development lifecycle. Although you don’t need to be a developer, having an\
  \ understanding of how code is developed and delivered to production will make the\
  \ content easier to understand.\n\nI have been working in application security for\
  \ nearly a decade and have seen the successes and failures in organizations that\
  \ are fighting the good fight of delivering secure software. Although the fundamentals\
  \ of application security haven’t changed much in that time, the tools, processes,\
  \ and technology have. The threats have changed, the attacker’s techniques are getting\
  \ more robust, and the risks to organizations have grown. Organizations need to\
  \ change with them and develop the framework that enables them to build security\
  \ in from the start.\n\nMy desire for this book is that it will show how application\
  \ security is applied in organizations and where it can provide the most amount\
  \ of assistance in delivering secure software. The book is made up of three sections\
  \ that take the reader through an effective application security program. The first\
  \ section is dedicated to what are common application security practices and technology\
  \ that you find in an organization. The second section dives more into how application\
  \ security is evolving to meet the current demands of rapid development. This includes\
  \ how application security should be developed as a service and not as the gated\
  \ exercises. The last section will focus on delivering application security in an\
  \ organization and measuring success.\n\nI appreciate you picking up this book and\
  \ my hope is that it brings you an appreciation for what it takes to deliver secure\
  \ software in today’s complex systems. Please be sure to post any questions, comments,\
  \ or suggestions you have about the book in the liveBook discussion forum. Your\
  \ feedback is essential in developing the best book possible.\n\n-Derek Fisher\n\
  \n\n\n\n\n\n\n\n# 1\n\n# Why do we need application security?\n\nThis chapter covers:\n\
  \n- Current state of application security\n- Going right or going left\n- Breaches\
  \ as a result of insecure applications\n- The cost of inaction\n\nEvery company\
  \ uses software to function. Whether they are a Fortune 500 technology company or\
  \ a sole proprietor landscaping company, software is integral to businesses large\
  \ and small. Software provides a means to track employees, customers, inventory,\
  \ and scheduling. Data moves from a myriad of systems, networks, and software providing\
  \ insights to businesses looking to stay competitive. Some of that software used\
  \ is built within the organization or it is purchased and integrated. What this\
  \ means is that every organization, regardless of size and industry, has a software\
  \ need. It enables organizations to move quickly and stay ahead of their competition.\
  \ In the United States, the growth of software in various industries including finance,\
  \ sales, human resource, and supply chain has seen a steady increase with that trend\
  \ continuing. Over the next decade these industries will see a steady increase of\
  \ market size. For instance, in 2020 the market size of nearly 390 billion USD in\
  \ the global business software and services. This is expected to have an annual\
  \ growth of 11% from 2021-2028. This expansion is based on the increasing need for\
  \ automation and processing solutions in nearly every sector on the economy.\n\n\
  The shift to software driven organizations can be seen in several prominent examples.\
  \ Movies were rented at a physical store before Netflix began streaming them in\
  \ 2007 directly to your television. Books were purchased in a shop before Amazon\
  \ upended not just the book buying experience but the overall retail market for\
  \ any item you can think of. It used to take a phone call to order food, now a mobile\
  \ app allows you to not only order your food but track it from the restaurant to\
  \ your front door. Moreover, software is used in all parts of the supply chain for\
  \ every organization. Leaders in these organizations can get real-time updates on\
  \ product as it moves around the world and to their customers hands. This isn’t\
  \ a nice to have any more for organizations but is critical to any organization’s\
  \ ability to compete.\n\n> \"In short, software is eating the world\" Marc Andreessen.\n\
  \nEach new piece of software brings new capabilities but also new challenges, especially\
  \ when that software is available over a network where it is open to a wide audience.\
  \ More capabilities mean more software. More software means more data. This data\
  \ is intended to assist an organization and its customers to gain insight into the\
  \ services the organization offers. However, the additional software and data means\
  \ more opportunity for bad actors to leverage weaknesses that might exist. Data\
  \ is a lucrative target for attackers and difficult for organizations to protect\
  \ especially when the organization collects a large amount of it. By the beginning\
  \ of 2020, the amount of data created worldwide had reached 44 zettabytes and this\
  \ is expected to reach 463 exabytes by 2025.\n\nThe increasing software landscape\
  \ and the repository of data growing every second offers a target rich environment\
  \ for malicious actors looking for a way in and access to the data. There is constant\
  \ background noise of malicious activity that pervades the internet. The moment\
  \ that any software becomes available online, it is immediately probed and prodded.\
  \ Some of that activity is from automated tools that will then alert when it finds\
  \ software that can be compromised. Some of it is from bad actors waiting for the\
  \ latest vulnerability to become public so they can hunt the internet for applications\
  \ that are vulnerable to it and create exploitation software. Other activity comes\
  \ from well financed bad actors that are simply looking for any weaknesses so that\
  \ they can gain a foothold in an organization in order to come back later for exploitation.\
  \ If ever there was a more fitting metaphor for software on the internet, it would\
  \ be the Wild West of the early United States where lawlessness was rampant, and\
  \ sheriffs were often overwhelmed and outgunned by the range of activity.\n\nSoftware,\
  \ data, attackers, oh my! When organizations don’t take software security seriously,\
  \ they run the risk of not only putting their client’s data at risk, but the organizations\
  \ future as well. Most organizations that are not in the software building industry\
  \ will often say that they are not a prime target, or that their data is not interesting\
  \ to an attacker. They would be wrong. Almost all data that is collected and processed\
  \ by an organization can be used and misused by an attacker. Nothing is too unimportant.\
  \ And although many large organizations can weather a data breach, smaller companies\
  \ often cannot while remaining in business.\n\nIt is often said that data is the\
  \ new oil. Mining, processing, and selling data is a lucrative business both for\
  \ the organizations that do so openly and the malicious actors who are looking for\
  \ ways to profit off an organization’s missteps. Building security into the software\
  \ from the start is the first, and primary, step to ensuring that organizations\
  \ have the means to protect their software, their data, and their livelihood.\n\n\
  \n\n\n\n## 1.1 应用安全计划的作用\n\n应用安全是通过在开发生命周期中实施安全实践、工具、技术、人员和流程来实现的。本书的其余部分将介绍应用安全如何在整个开发生命周期中使用，以确保组织降低了对其软件的风险，并且这种做法不会妨碍组织及时交付软件的能力。重要的是要知道，解决安全问题永远没有万能的灵丹妙药。没有任何一种工具、流程或个人可以声称做到这一点，因为攻击不断演变，技术也在不断发展。然而，确保你拥有一个健全的应用安全方法，该方法不仅包括应用安全计划的基础，还包括持续适应和不断发展方法的能力，这才是区分良好计划与不良计划的关键。这正是我们将在本书中发现的内容。\n\
  \n产品始于客户或组织内部某人的一个想法。将这个想法从概念、到纸面、到最小可行产品、再到生产应用，需要来自多个学科的一支团队来将其变为现实。大多数人首先会想到所有参与打造成功产品的开发人员、测试人员和产品人员，但那些让产品安全的人呢？目标不仅仅是打造一个满足客户需求的产品，而且要使其免受缺陷和安全问题的影响，否则这些问题不仅会贬低产品本身，还会贬低整个组织。\n\
  \n### 1.1.1. 从概念到生产的 安全\n\n软件开发生命周期在每个组织中定义方式都不同，但总体而言，每个组织从概念到生产都有类似的路径。图 1.1 描述了标准的软件开发生命周期，其中：\n\
  \n- 客户或产品负责人设想一个新功能或增强功能。\n- 用例和需求被开发出来。团队确定在即将到来的版本中安排工作的位置。\n- 开发团队随后决定需求将如何通过技术选择来实现。开发开始，代码被集成到功能分支中。\n\
  - 功能随后被移至较低环境，如测试或暂存环境，以便进行测试。产品负责人将接受测试结果，并同意将其发布到生产环境供客户使用。\n- 功能发布给客户，组织通过客户和技术支持将该功能作为更大应用的一部分进行管理。最终，该功能将被停用，以支持新版本。\n\
  \n![](img/cc84747f93d290964598894b4f5c153b_7_0.png)\n\n图 1.1 SDLC 的阶段\n\n在第一步中，产品可能已经存在，在这种情况下客户会请求增强或新功能。例如，也许需要在应用内访问报告的新方法，或在用户界面中提供新的数据集。否则，产品负责人可能会从多个客户收集信息，并为新功能提交增强请求。在这两种情况下，组织都会以用例的形式收集客户需求。一个简单的用例可以写成：\n\
  \n> “作为管理员，我希望能够创建每周报告，显示我组织中用户对应用的使用情况。”\n\n这是一个简单的用例，适用于基于 SaaS（软件即服务）的应用，该应用被许多组织用于提供某种服务。在这种情况下，细节并不重要，因为无论行业如何，每个组织都不同。在大多数情况下，一个功能会包含多个用例。\n\
  \n一旦客户或产品负责人定义了用例，这将与产品的开发负责人一起评审。架构师、主导开发人员和开发团队的运营成员评审用例并确定请求的合理性。\n\n这就将用例带到了流程的下一步，即定义功能和非功能需求。与存在多个用例一样，每个用例都可能有许多需求。以下是针对前述用例的功能和非功能需求示例：\n\
  \n> 功能：“应用应提供按用户创建应用使用情况报告的能力。”\n> 非功能：“报告创建仅应对管理员可用。”\n\n这不是一本关于如何编写需求的书，但简单解释是，功能需求描述功能应该做什么，而非功能需求描述功能应该如何做。大多数关于需求的信息将安全描述为非功能需求。然而，将安全功能描述为功能需求并不罕见，尤其是在加密、身份验证和访问等事项上。\n\
  \n### 1.1.2. 应用安全计划在哪里\n\n产品负责人将确定需求并与开发团队一起决定可能需要调整的优先级以及新功能交付日期。到目前为止，还缺少一些东西。带来产品安全的人员、工具和流程在哪里？如前所述，安全通常是非功能需求。然而，这些非功能需求不应由产品负责人和开发团队自行决定。更成熟的组织会引入应用安全团队，不仅评审用例和需求，还定义应作为功能开发一部分的安全要求。如果产品团队在与应用安全团队接触之前就定义了需求并开始编码，他们就有可能在功能接近完成或准备发布时产生更难解决的安全问题。例如，开发团队可能知道需要提供授权，并可能决定开发内部解决方案来管理授权，而不考虑组织内使用且更符合行业标准（如\
  \ OAUTH）的更合适的解决方案。\n\n在初始阶段融入安全，是通过采用行业和组织的标准和最佳实践，并将其构建到创建需求的流程中来实现的。例如，使用行业对加密的指导将导致对密钥管理和加密强度设置要求。或者组织可能有标准要求开发遵循某些架构或监管要求，例如使用特定的分析工具。此外，在构建这些需求时，团队将从威胁模型和风险评估等项目中获取输入，以进一步开发与业务需求一致的需求，以便尽可能早地将安全构建到流程中。我们将在后续章节中更深入地讨论威胁模型和风险评估。\n\
  \n## 1.2 应用安全的现状\n\n如前所述，应用安全是将安全实施到开发组织中的过程。现实情况是，应用安全团队如果在组织中存在的话，通常与他们合作的工程团队是外部的。他们可能隶属于企业范围的功能，如企业架构组织，或隶属于更广泛的安全组织。后者是最典型的。这些应用安全团队会引入工具、流程和人员来识别软件漏洞，然后将这些漏洞排入待修复的积压任务中。这些漏洞是通过以下几个机会发现的，包括：\n\
  \n- 通过应用安全团队为工程提供的工具。\n- 通过应用安全团队或外部供应商分别完成的外部或内部渗透测试。\n- 通过客户或其他外部来源（如漏洞赏金计划或漏洞披露政策）发现的问题。有关这些内容将在后续章节中介绍。\n\
  \n如果应用安全团队和组织被认为成熟，那么一旦发现这些漏洞，就会阻止构建。你可以看到这如何导致两者之间出现问题\n\n\n\n工程团队正致力于代码的发布，却突然被外部团队设立的工具和流程阻断。阻止构建是应用安全团队确保产品安全时最青睐的方法，但这很容易成为争执的焦点。在不够成熟的组织中，会设立流程让工程团队继续进行构建和部署，同时将发现的漏洞排期到未来解决。\n\
  \n应用安全团队与功能发布持续竞争。每次新发布都会带来新功能。新功能带来新缺陷。新缺陷带来新的安全漏洞。如前所述，在某些情况下这些漏洞会破坏构建并阻断功能的发布。然而，大多数组织会优先考虑功能发布而非模糊的漏洞。我稍后会更详细讨论这一点，但许多扫描工具噪音很大，产生的结果开发人员难以消化。此外，并非所有应用安全团队都擅长将工具和其他测试的结果转化为工程团队无需开会或工作会议即可理解的内容。这在大型组织中显然无法很好地扩展。\n\
  \n安全问题被排期积压，并附带一个“欠条”承诺在未来解决。但每次新发布都会为不断增长的积压带来更多漏洞，循环持续。大多数组织会采取系统性方法来减少漏洞，例如只关注高危和严重级别的漏洞，或特定类型的漏洞如\
  \ SQL 注入或跨站脚本。其他组织可能会根据产品能力和暴露面关注风险最高的漏洞，例如处理敏感账户信息的金融机构。一些组织甚至会采取“安全发布”的做法，在一次发布中集中解决大量安全问题。这些不同方法有助于集中减少漏洞，但并未解决整体问题。\n\
  \n就像查尔斯·狄更斯《圣诞颂歌》中的雅各布·马利一样，这些漏洞变成了拖累开发团队的锁链，并最终会困扰组织。漏洞的持续累积形成了所谓的“安全债务”，组织不断将新漏洞添加到已存在的旧漏洞之上。这种安全债务增加了所开发产品和销售该产品的组织的风险水平。最终，其中一个或多个漏洞会导致恶意行为者利用该应用。这与技术债务的概念类似，当组织选择快速便捷的方式将功能交付给客户，而不是选择更可持续的设计方案时就会产生技术债务。\n\
  \n进一步复杂化应用安全团队工作的是，他们通常在开发过程的太晚阶段才被引入。通常是在功能或产品已经经过多个设计和架构决策之后。代码开发可能已经在进行中，甚至更糟糕的是，在应用安全团队介入时已接近完成。这意味着许多“单向”决策可能已经做出，应用安全团队只能对设计和代码提供某种认可，或为发现的威胁识别缓解措施。这并非到处都是如此，但在足够大的组织中这种情况会发生。如果应用安全团队有机会在早期提供指导、要求和安全工具，潜在漏洞就可以减少。不幸的是，应用安全团队早期介入的案例少之又少，尽管这种做法有效。这使得应用安全团队陷入两难：要么成为“那个阻断发布的人”以在生产前强制执行安全要求，要么因允许存在已知弱点的代码发布而面临整个组织的后果。\n\
  \n这就是应用安全现状的图景，其中存在着在推动业务和降低组织整体风险之间不断斗争。\n\n## 1.3 为什么将安全内置具有挑战性\n\n> “总有一天，我们需要停止只是在河里救人。我们需要上游去找出他们为何落水。”\n\
  > \n> — 德斯蒙德·图图\n\n应用安全团队拥有最先进的工具，包括机器学习、人工智能、自然语言处理和自动化等技术。然而，其中一些工具在代码编写后才检测问题，并且很可能已签入并正走向你附近的生产环境。我将在后续章节中谈论各种工具，但如前所述，现代开发流水线中通常会发现与安全相关的几种工具。静态应用安全测试（SAST）可以扫描已编写的软件，查找常见的硬编码密码和\
  \ SQL 注入等安全问题。动态应用安全测试（DAST）会尝试在 Web 应用在环境中运行时对其进行实时安全测试。软件成分分析（SCA）工具会查找构建整体应用所使用的第三方和开源软件中已知的漏洞和许可问题。此外，还有云架构、容器、基础设施模板和移动安全工具可以产生扫描结果，识别代码或软件部署中的漏洞或其他弱点。\n\
  \n当检测到漏洞时，工具可以向应用安全团队和工程团队打开工单，前提是安全工具与缺陷跟踪工具之间已设置集成。然后问题由应用安全和工程团队进行分诊、优先级排序并处理到关闭。\n\
  \nEXERCISE 查看 OWASP 关于源代码分析工具的页面并回顾一些可用工具。其中有几个是“开源或免费”。其中一个开源工具是 APIsecurity.io\
  \ 安全审计（https://apisecurity.io/tools/audit/）。你可以使用此工具上传 OpenAPI JSON 文件以检测可能的漏洞。如果你没有自己的\
  \ OpenAPI JSON 文件可以使用，你可以在线搜索一个，或使用类似以下示例：\n\nhttps://github.com/OAI/OpenAPI-Specification/blob/main/examples/v2.0/json/api-with-examples.json#L31\n\
  \n查看 APIsecurity.io 返回的结果并判断问题是否为真阳性。开始思考如何缓解发现的问题。\n\n### 1.3.1. 尝试在运行时保护\n\n尽管上述工具是检测工具，但也有保护工具，它们会部署在运行中的应用前面，尝试阻止看起来恶意的活动。Web\
  \ 应用防火墙（WAF）可防止攻击者利用运行中 Web 应用的弱点。运行时应用安全保护（RASP）提供类似 WAF 的功能，不同之处在于 RASP 通常与应用并行运行，甚至在应用内部运行。机器人缓解软件和拒绝服务保护都会尝试阻止发送大量恶意流量以致使应用瘫痪或执行重复任务如暴力破解的流量攻击。安全网关也会通过阻止未经授权的访问和活动并提供实时监控来提供类似保护。\n\
  \n同样，这些保护工具使用最新的技术如机器学习和人工智能来尝试提供保护。其中一些工具非常擅长阻止恶意行为者的不受欢迎活动，但与此同时，一些工具如果未正确调优，则存在阻止组织客户按预期使用软件的风险。一个常见的例子是批处理作业在短时间内调用\
  \ API 或函数数百或数千次。这可能看起来像保护工具眼中的自动化恶意活动，并可能阻止合法流量。为了区分两者，应用安全团队和工程组织必须共同合作，将行为模式化为规则集，以阻止恶意流量并允许正常流量。这可以采用为某些\
  \ URL 和 IP 建立允许列表的形式。启用保护工具需要克服陡峭的障碍，因为许多组织可以理解地会担心性能和对合法流量的可能中断。\n\n### 1.3.2.\
  \ 仅获得工具输出是不够的\n\n就像舒适的毯子一样，在开发过程和流水线中分层的安全工具可以给组织带来安心感。然而，与大多数工具一样，其有效性取决于工具与组织的集成程度以及其保护或提供合法结果的能力。组织仅为了说自己使用这些工具，或（*cringe*）说自己阻断了\
  \ OWASP Top Ten 而启用一个或多个工具，并不会对自己或组织有任何帮助。\n\n**DEFINITION** OWASP 是开放 Web 应用安全项目，是一个由应用安全专业人员组成的开源社区，开发标准、工具和项目以协助组织在其应用中开发安全。\n\
  \n当然，在审计期间，组织可以说他们在开发生命周期中使用工具 ‘x’ 或 ‘y’。无论审计员的铅笔是否开始打勾，组织可能实际上并未更安全。\n\n现实是，这些工具会为工程团队和应用安全团队制造大量噪音。扫描工具不断输出需要分诊、评级和分配的发现，其中许多是误报。阻止工具会产生误报并引发对合法活动影响的担忧。并且很多时候，存在一个\n\
  \n\n\n过度依赖安全工具来提供保护，尤其是在存在已存在很长时间且没有修复计划的漏洞时。例如，一个组织可能会严重依赖 WAF 来保护一个被指定为“日落”状态且有多年退役计划的应用程序中发现的\
  \ SQL 注入漏洞。我们在讨论漏洞管理时将更详细地谈论这一点。\n\n### 1.3.3. 在安全工具中区分信号与噪音\n\n组织中使用的安全工具可能像任何其他工具一样昂贵且配置不当。此外，那些未精细调校的工具会产生大量误报。就像那些开启后就被遗忘的工具一样。这不仅为应用安全和工程团队增加了额外的工作量，还降低了对这些工具的信心水平，进而降低了对应用安全团队的信心。当误报变得正常时，它们就为工程团队提供了一个容易的逃避途径，让他们找到一种说法，声称他们的应用程序并非漏洞百出。如果工具标记的最后十个\
  \ SQL 注入问题都是误报，为什么这个新问题就不是呢？这就使得应用安全团队和工程团队在证明一个发现是真正的漏洞还是误报时陷入僵局。对于通常不具备工程团队对其自身应用的广泛上下文的应用安全团队来说，这极具挑战性。召集合适的主题专家（SME）来仔细研究代码细节与发现相关的过程也是耗时的。\n\
  \n随着各种工具及其各自产生的发现数量的增加，成熟的应用安全团队专注于从噪音中筛选出信号，并向工程团队提供高质量的结果。这提高了发现的可信度，并在安全与工程之间建立了更稳固的关系。\n\
  \n应用安全团队将与工程团队密切合作，尽可能获取尽可能多的应用上下文，以便将举证负担从工程团队手中移开。换句话说，应用安全团队的目标是确保以下几点：\n\n-\
  \ 结果是已被应用安全团队分拣过的真正阳性。\n- 工程团队清楚地理解修复漏洞的步骤。如果可能或适用，应用安全团队应提供展示利用和修复的代码示例。\n- 根据漏洞的严重程度，对修复时间线有明确的预期。\n\
  \n我们将在未来章节中更深入地探讨这个问题，但现在让我们看看安全如何集成到开发生命周期中。\n\n## 1.4 开发中向右移与向左移\n\n尽管每个组织以自己的方式发布软件，但对于大多数组织而言，从想法到生产的过程是相对相同的。图\
  \ 1.2 显示了常见的发布模式。\n\n从客户端需求到生产发布的代码开发的常见阶段\n\n![](img/cc84747f93d290964598894b4f5c153b_13_0.png)\n\
  \n图 1.2 代码部署的开发流水线示例\n\n短语 shift left 是将安全尽可能移至软件开发生命周期开始的概念。在图 1.2 中，这意味着在收集和构建需求的初始阶段以及开发阶段。这一术语在应用安全领域被频繁使用，用来描述能够在开发生命周期的尽可能早的阶段发现安全问题的构建实践和工具。其中许多我之前已经提到过。挑剔的人会告诉你，实现这一目标的最佳方式是确保安全人员在开发者用键盘创建新功能时就在场。那些挑剔的人是对的。纠正安全漏洞的最佳时机是在它被创建时。\n\
  \n向左移比向右移更不显眼。在向右移模型中，工具被策略性地放置在整个开发生命周期和生产环境中，以确保漏洞被识别并得到保护。渗透测试被执行以识别问题。你可以验证工具是否正常工作，并且可以生成报告来展示所实施工具的有效性或无效性。这依赖于一种检测和响应范式，它非常被动，并增加了我之前谈到的漏洞积压，其中关键和高风险的通常被优先处理，而其他则进入积压。这也可能扰乱\
  \ DevOps 模型，该模型希望快速进行更改，并且对构建中断或门禁处理得并不好。\n\n让开发者创建更安全的代码通常意味着使用以下控制措施：\n\n- 安全培训。\n\
  - 用于制定安全程序、流程和标准的顶层安全政策。\n- 集成到开发环境和流水线中、提供更快反馈的工具\n- 构建可重用的安全架构。\n\n然而，其中一些可以被规避。像大多数培训一样，安全教育可能很快被遗忘或为交付新功能的速度而搁置。开发者也会更换角色、职位和职能，并且经常被截止日期、工单、请求、突发事件和会议所困扰，这更倾向于快速推进而非安全。这使得即使是最有善意的、具有安全意识的开发者也会将安全推到优先级更低的位置。尤其是在依赖之前描述的保护工具来检测和提醒安全问题时。安全很快就变成了别人的问题。此外，工具成为业务阻碍，这为产品负责人提供了机会，当功能发布因发现的安全问题而面临风险时请求例外。架构经常被误用或在组织内没有得到很好的推广，这意味着并非所有开发团队都了解提供更多安全的、频繁变化的架构模式。\n\
  \n### 1.4.1. 在开发生命周期中向右移\n\n当组织决定其安全态势将主要是向右移时，他们将工具集成到开发生命周期中以检测问题并向安全或开发团队打开工单。这些工具中的大多数用于在生产环境或开发过程后期发现问题。这些组织将启用一些保护机制，如\
  \ Web 应用防火墙（WAF），并主要通过跟踪传入的漏洞、对它们进行分拣和优先级排序，并分配给团队解决来采取防御姿态。\n\n![](img/cc84747f93d290964598894b4f5c153b_15_0.png)\n\
  \n向右移时，工具用于在开发生命周期后期检测问题。\n\n图 1.3 向右移方法中使用安全工具\n\n众所周知，解决缺陷，在本例中为安全漏洞，在金钱和时间上的成本高于在生命周期早期解决的问题。解决已在生产环境中的缺陷所需的努力和中断可能比在需求阶段解决时贵数十倍，每个逐步的开发阶段成本都会更高。还有服务等级协议可能面临风险，如果在生产中修复漏洞时发生停机。\
  \ 这进一步使组织暴露于超出工程修复成本的额外成本之上。安全漏洞还具有可能导致可报告事件甚至声誉损害的额外影响，如果漏洞导致大规模泄露，暴露客户数据或使应用程序离线。\n\
  \n然而，向右移确实允许开发团队以快速的速度生产功能，因为当软件已在生产中运行时，安全在很大程度上是防御性的。这使开发团队可以花费更少的时间在早期解决問題，而转而依赖现有的保护机制。依赖右侧工具和流程的决定是通过在风险与回报之间取得平衡而做出的，因为未能按时交付功能也会对组织的底线产生影响。\n\
  \n\n\n\n\n### 修复缺陷的相对成本\n\n![](img/cc84747f93d290964598894b4f5c153b_16_0.png)\n\n\
  ### 1.4.2. 向右转移会失败\n\n安全控制已到位却未能阻止更大规模入侵或泄露的故事并不少见。这发生在多种原因之下：警报疲劳、安全是别人的问题、竞争优先级太多。在安全行业工作的人都知道，总会有开放的端口、软件的不安全版本，以及缺乏安全控制的地方。而攻击者对这些情况的了解程度与安全人员一样。攻击者只需要一次在正确的时间出现在正确的位置。防御者则需要每次都正确。\n\
  \n如果你是僵尸故事的粉丝，你会熟悉这样一个场景：一个或一群活人被困在一栋建筑物内，四周是流着口水、呻吟的亡灵。在大多数情况下，他们所在的建筑物表面和弱点实在太多。随着外面的群潮不断壮大，防御变得越来越薄弱，建筑物内的幸存者能用来抵御僵尸的选项也越来越少。在网络安全领域工作有时会让人有这种感觉。每次你加固一道防御弱点时，又会发现新的弱点，你的团队被要求制定计划来关闭弱点并提供有意义的防御。此外，攻击者并不总是像无脑的僵尸一样冲击你的防御，他们往往聪明、耐心，并且清楚自己想要什么。好在防御者也是如此。\n\
  \n恶意行为者发现攻击应用的方式越来越多，而对这些应用的防御者来说，感觉漏洞比他们能管理的还要多。更多的功能意味着更多的攻击面，这意味着恶意行为者有更多机会窃取数据、冒充用户、实施欺诈或其他恶意活动。此外，与内部或外部应用和服务的集成越多，就可能存在组织无法控制的暴露面。\n\
  \n例如：在 2018 年，Facebook 的一个漏洞导致数千万个 Facebook 账户被攻破。该缺陷存在于一个允许用户从不同账户视角查看其个人资料的功能中。毫不奇怪，这个功能被称为“查看为”。恶意行为者能够窃取\
  \ Facebook 账户的访问令牌，从而以访问令牌关联的用户身份登录。他们首先从自己的好友开始，继而窃取好友好友的访问令牌，直到收集了数十万个账户，然后是数百万个账户。他们能够收集个人数据，包括姓名、联系信息、用户签到地点等常见信息，以及其他私人数据。\n\
  \n这个例子展示了为数百万用户提供开放且功能众多的安全产品的难度。即便是非常重视安全的庞大组织也是如此。我们之前提到的工具可能有助于在代码发布之前识别此问题，或在生产环境运行后检测并阻止它。然而，这些工具的一个局限性在于它们无法发现业务逻辑或工作流相关的漏洞。此外，很难指望工具比终端用户更快地发现这些问题。这就是为什么在开发生命周期的早期拥有适当的流程、需求和测试会提高尽早发现此问题的机会，此时工具、测试和敏锐的安全目光的集体力量得以发挥。\n\
  \n### 1.4.3. 在开发生命周期中向左转移\n\n向右转移意味着组织试图在生命周期的后期投入更多精力来保护和检测安全问题，而向左转移则是将这些工作提前到生命周期的早期。这无疑是开发安全的首选方法，因为它成本更低、效果更好。然而，它更难实施，并且在需要时可能被迅速绕过。\n\
  \n![](img/cc84747f93d290964598894b4f5c153b_18_0.png)\n\n向左转移时，组织会更强调将安全工具提前到生命周期中，以便在进入生产环境之前捕获问题。\n\
  \n图 1.4 显示了在向右转移方法中使用的安全工具\n\n想象一下建房子。你有一张建筑图纸、材料清单和实际的建筑材料。你召集一群工人开始建房。在建造房屋时就安装窗户和门的锁、建造逃生窗、安装烟雾报警器要好得多。等到房子建好后，或房子被抢劫后、或烧毁后才做就太晚了。是的，你在建造过程中会节省时间和金钱，但安全性会降低。这个例子听起来很荒谬，但现实是这种情况在软件开发中经常发生。有时是因为在软件构建后才发现了更新的安全模式和架构，但通常是因为一开始就没有在构建中加入安全。\n\
  \n在开发过程中从设计决策和需求收集开始分层加入安全要实用得多。采取这种方法时，组织正在采取必要的步骤来培养更好的习惯并产生更持久的影响。考虑一下你的个人健康。研究表明，调整习惯而不是追求快速减肥的节食不仅对你更健康，而且为更可持续的健康提供了更长久的路径。向左转移培养了这些健康的安全习惯，确保组织站在正确的起点上，并能维持更安全的整体态势。\n\
  \n一个健康的安全开发环境始于做出正确的架构和设计决策并将安全纳入考虑。这意味着在会话管理、加密、授权等领域选择合适的安全控制。它还包括利用来自 OWASP 等知名且经过验证的组织的可信模式和标准。例如，选择合适的数据保护方案的时间应在围绕数据流和数据库技术做出架构决策时确定。加密策略的需求应得到充分记录，并根据数据分类提供适当的保护级别。此外，像字段级加密以及适当的加密密钥生命周期管理这样的需求，在数据库中还没有数\
  \ TB 数据需要对大型数据集应用加密之前，更容易开发。复杂之处在于遗留应用，大多数组织由于旧技术可能不支持更精细、更强大、更现代的加密，因此无法提供磁盘级别之外的加密。这仅仅是因为该应用可能从未被设计为处理加密数据。\n\
  \n甚至所选择的语言也会影响应用的安全性。开发人员可以选择的开发语言 literally 有数百种。每种语言都有其针对特定用例的优缺点。然而，许多现代语言提供了一些护栏，可以防止开发人员产生不安全的代码。例如，Java\
  \ 和 C++ 在易受攻击的代码方面往往名列前茅，这并不令人意外。很大程度上可以归因于这两种语言的强大功能以及开发人员可以“自伤”的能力。\n\n**NOTE**\
  \ 使用 C++ 等强大语言最常见的问题之一是其手动管理内存的能力。大多数现代语言会出于便利性将这种能力从开发人员手中夺走。C++ 的一个具体例子是调用 free()\
  \ 的能力，允许开发人员释放内存地址。如果对同一个内存地址调用两次，就会变成双重释放问题。攻击者能够利用由此产生的内存泄漏并注入代码，可能允许攻击者获得具有提升权限的交互式\
  \ shell。\n\n此外，这些语言在全球数十亿台设备中被广泛使用。覆盖面越大，找到安全问题的机会就越多。其他语言如 Python、Ruby 和 Go 显示出总体漏洞更少，但这些语言编写的代码行数也更少。\n\
  \n\n\n\n\n![](img/cc84747f93d290964598894b4f5c153b_20_0.png)\n\nFigure 1.5 Application\
  \ with high-severity flaws by language 2020\n\n语言和设计选择对左移策略的影响很大，测试同样如此。单元测试、QA、集成测试和系统测试都可以用于在生命周期早期识别安全问题，并为开发团队在问题进入生产环境之前纠正问题争取时间。这假设已经创建了适当的安全测试，理想情况下是自动化的，并且在发现问题时会提醒团队。进一步假设发现的问题不会消失在待办清单的安全漏洞深渊中。\n\
  \n我们将在后面的章节中更多地谈论左移，包括威胁建模、衡量风险、创建滥用案例、使用开发工具、提高意识等内容。不要误会，将安全左移是将应用安全带到您身边的组织中最具成本效益和可持续的方法。\n\
  \n### 1.4.4. 左移失败\n\n通常，开发团队中的一两个人会被指定为团队的“安全负责人”[我们不会称他们为冠军。那是后来的事]，团队的大部分安全相关工作都会被推给他们。这个人有责任参加做出安全决策的会议，对安全相关的变更进行代码审查，为团队做出决策，并且通常有责任纠正或设定漏洞管理方向。顺便说一下，这个人还有一份日常工作，通常是团队的开发人员或架构师。他们可能甚至不想担任“安全负责人”的角色，但他们可能被自愿指派了。这对个人以及整个团队都有巨大影响。这个人很快就会不堪重负，几乎没有休息或反对的机会。\n\
  \n这通常就是漏洞管理崩溃的地方。在其中一种安全工具中发现了新的漏洞，或在渗透测试中发现了漏洞。该漏洞被放入缺陷跟踪工具中并分配给安全负责人，然后他们放下可能正在进行中的常规开发工作来对安全问题进行分类并尝试解决。与此同时，已经识别出另外几个漏洞，积累了我们之前谈到的安全债务。这通常是产品负责人、Scrum\
  \ Master 或开发经理介入询问为什么开发交付物落后的时候。\n\n这种类型的失败过去曾多次出现。其中一起最近的高调案例是 Equifax 泄露事件，导致超过\
  \ 1.43 亿美国人的个人和财务信息暴露。Equifax 是美国三大信用局之一，为美国人提供消费者信用报告。2017 年 3 月，在 Apache Struts\
  \ 中发现了一个漏洞，Apache Struts 是一个用于开发 Web 应用程序的框架。补丁发布后，大多数组织开始修补其软件。这通常说起来容易做起来难，因为某些框架升级可能需要额外的开发更改和测试。在最坏的情况下，应用程序可能需要重新架构或完成重大的开发工作。到\
  \ 2017 年 5 月，Apache 发布补丁两个月后，攻击者已获得 Equifax 数据库的访问权限并开始窃取信息。Equifax 在 7 月才意识到泄露事件。安全组织中的几次失败导致了个人身份信息\
  \ [PII] 的泄露。虽然问题在内部被识别出来，但已知问题的电子邮件通知发送到了一个旧的邮件分发列表，因此从未被适当团队接收到。此外，数据库未与剩余网络隔离，允许攻击者横向移动到其他服务器，在那里他们找到了未加密的凭据，使他们能够升级攻击。\n\
  \n我们很容易坐下来挑剔此案中缺乏修补和其他安全控制。然而，从初始披露到被利用的两个月对于许多组织来说是一个很短的窗口。其中一些组织可能运行着技术，其未被修补的时间远比这更长。更重要的是，如今从漏洞披露到被利用的时间要短得多，攻击者能够在几天甚至几小时内收集足够的信息来逆向工程补丁并构建利用代码。但开发团队中的安全负责人有责任与为发布而安排的其他功能进行协调，并确保应用程序得到保护。鉴于\
  \ Apache Struts 漏洞在被利用时仅有两月历史，团队手中很可能已有更旧、更关键的漏洞，使这个 Struts 漏洞深陷于安全历史的尘埃中。这也凸显了早先的事实，即每个公司都是软件公司。Equifax\
  \ 并非以技术为业，但由于其由使他们及其客户得以运行的软件层驱动，他们发现自己身处软件业务中。\n\n## 1.5 左移比右移更好吗\n\n正如我提到的，将安全左移将为组织带来更好的结果。它使开发团队能够建立一种更可持续的安全文化，能够管理安全漏洞“何时”而非“是否”会被引入的问题。\n\
  \n任何组织的任何软件都无法编写成对所有时间 100% 安全。会有漏洞。组织需要具备管理这一点的文化、流程、人员和技术。\n\n没有错误或正确[双关语并非有意]的应用安全方法。无论阶段和目的如何，应用安全相关的人员、流程和技术在整个生命周期中都是必需的。为了说明这一点，让我描述两个不同组织及其对应用安全的方法。\n\
  \n第一个组织名为 Acme Services，已决定在发布前让应用安全团队执行简单的扫描和渗透测试，以确定开发过程中是否引入了任何漏洞。这是之前描述过的右移方法。第二家公司\
  \ Superior Products 知道，尽早引入安全不仅更容易，而且比等到后来更具成本效益。他们要求尽早让应用安全团队参与进来。更妙的是，他们团队中有安全冠军\
  \ Dashing Danielle，可以在整个开发过程中提供指导。\n\nSuperior Products 拥有一个成熟的应用安全团队，时刻关注安全行业的动态。他们在整个组织中整合了安全冠军团队，并与该团队保持开放沟通，以确保他们了解行业变化。凭借这些信息和结构，他们能够执行威胁情报，为新需求和技术决策提供信息。在许多情况下，这使他们能够在客户提出请求之前就实施安全功能。Acme\
  \ Services 通常会被客户对更严格的安全和隐私的要求弄得措手不及，因为他们决定在流程后期才实施安全。\n\nSuperior Products 雇用 Dashing\
  \ Danielle 来审查来自产品所有权的用例。她能够对该功能进行快速威胁建模，以确定影响该功能的安全问题。根据她之前与产品和应用安全团队进行的风险评估，她知道该应用程序和报告中的信息被视为组织敏感信息。这意味着她希望创建安全需求来维护数据中包含的信息的保密性，并确保访问仅限于适当组织内的少量用户。\n\
  \nDashing Danielle 能够在审查用户故事和需求期间根据她掌握的信息提出有关报告访问的问题。在与应用安全团队讨论她认为对新功能存在担忧的问题后，她提出了以下有助于保护生成报告中的数据并维护访问控制的需求：\n\
  \n- Security Requirement: \"Application shall ensure that access to the report is\
  \ limited to authenticated users of the organization that the report belongs to.\"\
  \n- Security Requirement: \"Application shall log information related to the admin\
  \ accounts that create and change the reports.\"\n\n开发团队同意这些需求很重要，并且有能力在不影响产品功能发布时间表的情况下实现它们。\n\
  \n\n\n\n\nDashing Danielle 支持开发团队在白板上梳理工作流程，以便开发团队明确并理解需求。\n\n![](img/cc84747f93d290964598894b4f5c153b_23_0.png)\n\
  \nFigure 1.6 Superior Products path to more secure code\n\n在 Acme Services 那边，一名开发人员提出了一个担忧，即未通过身份验证的用户是否可以访问报告。由于产品负责人承诺在很短的时间窗口内交付此功能，这一担忧很快被驳回，而且开发团队也不知道报告中的数据是否真的被视为敏感数据。大家耸耸肩，然后继续前进。\n\
  \n这是一个相当清晰的区分，说明应用安全在哪些地方有效、在哪些地方无效。这则故事看起来可能有些夸张，但请理解，这类故事是典型的。选择这本书意味着你希望更像 Superior\
  \ Products。\n\n## 1.6 Application security needs you!\n\n要做成任何有价值的事情都需要众人齐心。安全也不例外。通常，安全团队只占整个组织的很小比例，并且主要依靠自动化以及其合作的工程组织的善意来扩展以满足需求。应用安全团队没有“正确”的规模，但规模并不能说明有效性。应用安全与工程师的规模比例在不同组织之间差异很大。\n\
  \n> DEFINITION Building Security in Maturity Model (BSIMM) is a study on the posture\
  \ of software security initiatives and programs by quantifying the application security\
  \ practices of different organizations across industries, sizes, and geographies.\n\
  \n在 BSIMM 中，他们将软件安全组（SSG）定义为专注于组织内软件安全的团队。他们发现，SSG 团队规模可能大到 160 人，也可能小到 1 人，团队平均规模为\
  \ 13.9 人。这当然取决于组织的规模以及软件安全组需要管理的覆盖范围。而且，当你看到安全支出相对于整体 IT 预算的总支出时，就不足为奇了，应用安全在整个工程组织中仍是较小的部分。根据\
  \ Gartner 在 2019 年的一项研究，在大多数情况下这一比例约为 5-6%。应用安全在该安全预算中占比更小，因为很大一部分资金用于边界防御以及检测和响应能力。\n\
  \n**EXERCISE** Take a look at BSIMM’s website for SSDL Touchpoints:\n\nhttps://www.bsimm.com/framework/software-security-development-lifecycle.html\n\
  \n根据我所描述的左移和右移，这些触点都是左移模型的一部分。如果你在预算有限的组织中，你认为将你和你的团队的重点放在哪里以便将安全构建到开发生命周期中是最好的地方？思考架构分析的影响。这需要资源来深入基层。安全测试可以扩展，但可能很昂贵，并且需要时间来实施。\n\
  \n### 1.6.1. Democratizing application security\n\n应用安全与其说是一个专职团队，不如说更多是建立支持安全开发的习惯、文化和基础设施。无论规模大小，应用安全团队都严重依赖开发组织内部的其他人来在更广泛的组织内推广和宣传安全。对于一个相对较小的应用安全团队来说，不可能与每个开发团队集成并参与每一次设计决策。没有从开发组织借用资源，应用安全很少会被集成。为了推进应用安全，能够找到盟友、建立信任并将安全民主化给整个工程组织至关重要。在整本书中我将概述实现这一进步的方法，然而要明确的是，应用安全需要一种安全文化，并在所有层级获得认同。\n\
  \n这里的关键部分是助手。一些组织称他们为冠军、传教士或教练。无论称呼如何，主题都是一样的。我们将在未来的章节中更多地谈论冠军计划；然而，基本原则是这些冠军是工程组织与应用安全计划之间的联系。他们在那里代表应用安全计划的利益，并确保他们所代表领域的的安全标准、设计和架构得到正确实施。冠军通常是来自工程组织内部的某个应用或业务单元的资深或经验丰富的工程资源。冠军的存在很重要，因为他们是自愿在那里，而不是被迫在那里，因为成功的冠军会欣赏安全。\n\
  \n这些冠军通过在应用安全团队无法到场的地方提供存在感来帮助应用安全团队推进安全。许多决策是在站会、走廊里或开发人员之间的即兴对话中做出的。拥有更接近代码开发地点的眼睛和耳朵有助于确保安全在软件开发生命周期的每个部分都被考虑。\n\
  \n应用安全民主化成功的一个条件是确保这些冠军精通组织的 安全文化，了解在哪里找到与需求、标准和架构相关信息的地方，并最终能够自如地代表应用安全团队发言。甚至在冠军可以承担该角色之前，可能还会有正式的培训和评估计划。为了确保这些冠军拥有成功所需的\
  \ 信息，应用安全团队需要公开其文档和指导，并在定期基础上与冠军一起审查并就新项目达成共识。这可以通过正式的定期论坛或通过电子论坛来完成。这取决于组织的文化和最实用的受众覆盖方式。\n\
  \n### 1.6.2. Users will be users\n\n冠军不足以增强应用安全团队。听到开发人员、终端用户、领导者或其他技术人员说“我们有安全团队负责这件事”并不罕见。我们可以为系统构建所有技术安全控制，但一旦用户接触到系统，就会引入不可预测性。用户希望完成工作或找到完成某项活动的方法。我们都曾遇到过因安全控制而被系统限制的情况。大多数人不会束手无策地离开。我们会寻找其他方法来完成我们设定的目标。用户对你构建的应用也是如此，他们会寻找完成工作的方法，无论应用是否允许。此外，恶意用户正在探测应用以寻找弱点。他们不会局限于你开发的应用范围内。事实上，他们正试图做与你的应用设计目的完全相反的事情，以便制造他们可以利用的错误条件。应用安全始终在努力跟上好奇的用户和恶意攻击者，没有任何工具能给我们带来我们所寻求的安心程度。它需要一个致力于应用安全的村庄，从一开始就致力于构建安全的应用。\n\
  \n我一开始就说过，每家公司都是软件公司，这意味着每家公司都需要一定程度的软件安全。同样，软件安全是每个人的问题。这是一个相当常见的说法，但这到底意味着什么。这类似于公共服务公告敦促人们“看到异常，说出来”。这并不意味着旅客应该尝试打开他们在机场航站楼发现的、有电线垂出并发出蜂鸣声的行李。这意味着旅客应提醒最近的权威人士，以便他们进行调查。安全人员没有要求终端用户对\
  \ Web 应用中的 SQL 注入漏洞进行分类并编写代码来解决它。他们只是要求向最近的冠军或安全人员发出警报。把拆弹交给专业人士吧！\n\n\n\n\n\n##\
  \ 1.7 软件安全失败的案例\n\n新闻中充斥着各种安全失败的案例，应用程序因多种原因被攻破。介绍这些案例的目的并不是为了嘲笑这些组织，而是为了聚焦于如何发生以及为何发生。相信我，如果你的组织销售或使用软件，那么问题不是是否会遇到安全事件，而是何时遇到。事件可能很小且无需上报，但你的组织总会在某个时间、某个地方遭遇软件安全事件。\n\
  \n**练习** 去你喜欢的搜索引擎查找最新安全漏洞的文章。你也可以访问 www.threatpost.com 或 www.securityweek.com 查看近期报道。我敢肯定，如果你今天看不到相关报道，至少本周内会看到。深入阅读文章，并设身处地为安全团队着想。你会如何应对？如果文章中没有说明，推测问题出在哪里。我经常看这些报道并问自己“自己或我的团队如何避免这种情况？”\n\
  \n### 1.7.1. SolarWinds\n\nSolarWinds 是一个令人不寒而栗的例子，展示了复杂的软件生态系统及其构成组件如何导致大规模且影响深远的入侵。这种类型的入侵通常被称为供应链攻击，原因显而易见。攻击者只需攻破构建整体软件时使用的一个组件，就能让其恶意载荷广泛传播。这利用了供应链中的一个根本性复杂问题，即主软件开发者与用于构建最终产品的第三方软件之间存在固有信任。\n\
  \nSolarWinds 的 Orion 产品是一种监控解决方案，用于监控组织的网络和应用程序。在 2020 年攻击发生时，SolarWinds 被美国大多数顶尖组织使用，包括大多数财富\
  \ 500 强公司、大学以及许多顶级政府机构和军方。\n\n攻击者能够修改名为 SolarWinds.Orion.Core.BusinessLayer.dll\
  \ 的插件。攻击者使用名为 SUNSPOT 的工具，能够注入恶意版本的 dll 并由 SolarWinds 数字签名后发送给数千名客户。恶意 dll 包含 SUNBURST，使攻击者能够与命令与控制（C2）服务器通信。攻击者煞费苦心地隐藏其活动，在一段时间内潜伏等待后再检索和执行命令，同时伪装成合法的\
  \ Orion 流量并使用阻止列表来识别取证和防病毒工具以规避它们。\n\n一旦插件进入目标系统，它就会使用删除-创建-执行-删除-创建的模式劫持合法任务，运行恶意活动，然后恢复为合法任务。这种复杂性进一步表明攻击者为保持活动隐蔽付出了多大努力。\n\
  \n该行动持续了数月，直到攻击者入侵了领先的网络安全公司 FireEye 后才最终被发现。攻击者获得了 FireEye 的攻击模拟和其他安全相关工具的访问权限，但被发现，这导致了更广泛活动的检测。\n\
  \n如此复杂的攻击很难防御。加密这里、清理那里是不够的。FireEye 的警惕性、SolarWinds 迅速发布补丁的能力，以及受影响组织积极的补丁管理，显示了我们的数字世界已发生变化，我们不能再依赖将精力投入到保护软件上，而是需要转向始终假设已被入侵的世界。关键在于我们如何应对，更重要的是，当检测到恶意行为时，我们响应的速度有多快。\n\
  \n### 1.7.2. Accellion\n\n对于我们这些拥有房屋或任何需要维护和持续关注的物品的人来说，我们有时会故意走过那个嘈杂的电器，或吱嘎作响的门，想着总有一天会修好它。\n\
  \n软件也差不多如此。让旧软件继续运行有很多原因。客户坚持继续与旧软件集成，使得组织难以将其停用。组织保留旧软件是因为保持运行比升级或更换更便宜。无论原因如何，几乎所有组织中都普遍存在旧软件。\n\
  \nAccellion 为医疗、金融和教育组织开发软件。其文件传输设备（FTA）产品被医疗组织用于执行大文件传输。该产品在 2020 年底遭到网络攻击时已近二十年历史，接近生命周期结束。攻击者首先窃取了\
  \ Accellion 的数据，然后转向直接攻击 Accellion 客户，目的是窃取数据并勒索钱财。初始攻击利用了针对 document_root.html\
  \ 文件的 SQL 注入攻击，使其能够检索用于生成合法访问令牌的密钥。这些令牌随后被用于访问 sftp_account_edit.php 文件，攻击者在此能够利用操作系统命令注入，从而向主机系统发出命令。这最后一步使攻击者能够创建\
  \ shell。此时攻击者能够上传更复杂的工具并开始窃取信息并转向客户服务器。\n\nAccellion 的医疗客户被迫根据 HIPAA 泄露通知规则通知受影响患者、媒体以及卫生与公众服务部。随后提起诉讼，最终近\
  \ 350 万患者的受保护健康信息（PHI）被窃。更糟的是，攻击者随后向 UC Davis 的学生发送威胁邮件，在该大学发现其信息属于泄露范围后。\n\n组织无法停用旧软件的影响是广泛的。组织大多运行最新最好的软件版本，但有一个客户运行的是几个版本之前的软件版本，这也不罕见。这是产品所有权未能推动客户向前发展的失败，使组织及其服务的客户都面临风险。组织必须制定并坚持日落和生命周期结束政策。两个关键要点：\n\
  \n- 软件的停用是软件生命周期的最后阶段\n- 记住技术债务就是安全债务。\n\n#### 有趣事实\n\n微软宣布 Windows 7 的生命周期结束日期为\
  \ 2020 年 1 月 14 日。2020 年 1 月到来时，这款深受喜爱的系统仍在 39% 的 PC 上使用。许多人推测这是因为终端用户不愿迁移到 Windows\
  \ 10。这表明即使是微软也难以说服用户升级到新版本。相反，他们采取更强硬的做法，即停止为旧版本提供补丁。即便如此，这也阻止不了用户使用它，微软甚至允许用户和企业付费以继续接收更新。\n\
  \n### 1.7.3. 假软件\n\nSolarWinds 展示了攻击者如何利用构建最终产品所用组件之间的信任。然而，这个故事并不罕见。攻击者总是在寻找将软件引入供应链的方法以最大化其影响范围。为什么要专门针对一个组织进行入侵，而可以通过进入供应链来入侵多个组织呢。\n\
  \n进入供应链还有其他方式。如果可以相信的话，还有更大的方式。2021 年，明尼苏达大学的两名学生发布了一篇研究论文，称之为“伪善提交”。这些提交据称旨在为 Linux\
  \ 内核提供价值，但反而引入了关键问题。就像你的父母会把蔬菜藏在饭菜里让你吃一样。也许你也这样对你的孩子。没什么好羞愧的！\n\n这种提交不仅在 Linux 社区不受欢迎，也在更广泛的安全和工程社区不受欢迎。Linux\
  \ 内核被全球数十亿系统使用，从最小到最大的计算机。这两名学生的行为导致该大学被禁止未来向 Linux 内核贡献代码。他们之前的 Linux 提交也被撤销。\n\
  \n开源社区依赖于向其开放分支提交高质量、经过充分审查且出于善意的提交。尽管两名明尼苏达大学学生的例子表明该系统可以被滥用。\n\n用于构建整体应用程序的开源软件的爆炸式增长进一步加剧了组织在此方面的暴露。根据\
  \ SonaType 2020 年软件供应链状况报告，2020 年开发者将请求 1.5 万亿个开源软件组件和容器。大多数软件都是由第三方库、软件论坛的代码以及一小群软件工程师和架构师手工编写的逻辑组成的拼凑物。根据\
  \ Synopsys 2020 年开源安全与风险分析报告，平均应用程序的 70% 由开源软件组成。依赖第三方软件会导致恶意行为者进入供应链并添加恶意代码的风险。拥有如此高比例第三方开源软件的组织需要采取防御性方法来管理其供应链，通过扫描第三方库中的漏洞、仅使用来自可靠来源的库，以及维护强大的补丁管理计划，以便在漏洞被识别后迅速修补易受攻击的库。\n\
  \n\n\n\n\n## 1.8 总结\n\n- 应用安全团队通常来得比较晚，导致发现的问题被移至待办清单。\n- 该待办清单会持续增长，成为安全债务。\n-\
  \ 应用安全团队使用的扫描工具通常是检测工具，并不会修复或阻止不良代码。\n- 保护工具可以启用，但由于担心会阻止合法流量，有时很难让工程团队接受。\n- 向右转移是后期才发现缺陷，而向左转移则能更早发现。\n\
  - 向左转移不仅仅是培训和培养倡导者。\n- 在生产环境中修复问题比在生产前修复要昂贵得多。\n"
- "# 2 定义问题\n\n本章涵盖：\n\n- 定义软件需要遵守的安全原则\n- 识别并理解影响软件的风险\n- 软件开发生命周期中安全的概述\n\n在上一章中，我以没有给门窗装锁就建房子的例子来说明。用房子作例子非常好，因为它能让你思考用来限制房屋因入侵、火灾、洪水等而受损风险的控制措施。我们在安全领域花费的大部分时间都是在尝试限制风险和应对威胁，而不是消除它们。风险和威胁永远无法被消除。就像房子一样，你无法消除火灾、洪水或入侵的风险，我们只能进行检测和响应。\n\
  \n**风险**\n风险是资产遭受损失或损坏的可能性。\n\n**威胁**\n威胁是利用资产弱点的活动。\n\n示例：在房屋火灾的情况下，火灾是威胁，房屋被烧毁是风险。\n\
  \n而火灾、洪水和入侵是影响房屋的风险，我们的软件则有一套不同的威胁和风险。这些范围从物理到数字。是的，存在影响我们软件的物理威胁，数据中心发生洪水就会对正在运行的应用造成物理风险。\n\
  \n在本章中，我们不会深入探讨各种具体的保护方法，而是概述软件和数据需要被保护的不同位置，以及一些需要留意的最佳实践。\n\n## 2.1 CIA 三要素\n\n\
  在安全领域有三个基本原则，我们集成到系统和软件中的所有保护机制最终都会回归到这些原则。它通常被称为 *CIA 三要素*。它代表机密性、完整性和可用性。\n\n\
  - 机密性 – 保护数据，仅允许应该访问的人访问。\n- 完整性 – 数据是已知正确且可信的。\n- 可用性 – 系统和数据应在可信实体请求时可用。\n\n安全领域的大多数人都比较熟悉这些概念，但我将在此处提供进一步的定义，以便为本书后续主题提供共同基础。\n\
  \n## 2.2 机密性\n\n在开发软件时，你可以做出的最重要的安全设计考虑之一是 *机密性*，即设计软件以提供数据的最佳保护。现实是，这比听起来要困难得多。如我所说，数据是新的商品。这意味着它无处不在。软件可能正在处理它并非保管人的数据。\n\
  \n**数据保管人负责数据的收集、处理、存储以及与数据相关的业务规则的实施。**\n\n有些数据是暂时的，有些数据在系统中不持久，只在内存中存在一段时间。图 2.1\
  \ 使用简单的 数据流图（DFD）向你展示数据如何在你的系统和其他系统间流动。\n\n数据流经示例电子商务网站\n\n![](img/cc84747f93d290964598894b4f5c153b_31_0.png)\n\
  \n在图 2.1 中，一旦客户完成订单，一系列其他流程将与支付公司协调，处理订单并存储数据。在每个环节，对该数据的保护都至关重要。尤其是当它是敏感数据如支付信息时。今天，我们有方法来保护此信息，主要通过静态加密，当数据驻留在数据库或其他系统中时，通过传输中加密在网络上传输时，以及使用中加密在内存中处理时。这些方法使我们能够在数据穿越系统时提供一定程度的保护，在某些情况下甚至包括你的软件发送数据到的服务。\n\
  \n### 2.2.1 数据保护策略\n\n组织为保持数据保护需要采取的第一步是创建并维护一份政策，明确规定哪些数据必须加密。大多数组织会称之为数据保护政策，并定义需要保护的数据，但除高层级指导外不会涉及具体如何操作。该政策中定义的数据将遵循组织的数据分类方案（稍后会详细介绍），并指出数据必须加密，且访问仅限于必要人员。大多数政策还将包括以下内容：\n\
  \n- 明确定义数据可能驻留的每个位置必须执行的操作，例如文件系统、终端用户设备、数据库等。\n- 加密密钥生命周期的定义，例如创建、分发和销毁。\n- 定义哈希和加密算法。\n\
  - 对加密密钥访问的审计。\n\n一旦该政策建立，组织就可以着手将加密标准和架构映射到该政策，但在此开发标准和架构时必须考虑两个主要因素：\n\n- 尽管加密提供了额外保护，但在需要访问密钥、加密数据并将其发送时，会产生额外的时间开销。这种延迟通常以毫秒计，但对于关键应用而言，这额外的时间需要被考虑。\n\
  - 系统还必须确保足够健壮，能够克服因加密密钥不可用或加密/解密过程出现故障而导致的停机，例如密码服务离线。\n\n这增加了额外的运营复杂性和可用性问题的潜在暴露，必须予以考虑。\n\
  \n##### EXERCISE\n\n完成对称加密的练习，了解单个密钥如何用于加密和解密数据：\n\nhttps://www.khanacademy.org/computing/computers-and-internet/xcae6f4a7ff015e7d:online-data-security/xcae6f4a7ff015e7d:data-encryption-techniques/a/symmetric-encryption-techniques\n\
  \n完成公钥加密的练习，了解密钥生成以及使用密钥对进行加密和解密：\n\nhttps://www.khanacademy.org/computing/computers-and-internet/xcae6f4a7ff015e7d:online-data-security/xcae6f4a7ff015e7d:data-encryption-techniques/a/public-key-encryption\n\
  \n#### 2.2.2 静态数据\n\n保护静态数据的第一步是认识到你有一个问题——数据清单问题。简单来说，数据清单是指知道组织中数据位置的能力。在安全事件期间，组织需要能够知道哪些数据可能已被泄露，以及泄露的数据是否存在风险。是否是在刚刚被入侵的数据库上存在关键的客户信息？如果无法回答，则说明对数据的位置和性质的理解存在差距。再次回顾图\
  \ 2.1：你知道传递给你的应用和支付公司之间信息发生了什么吗？你知道他们是否在有意或无意地与他人共享数据吗？你或你的应用的消费者是否有政策禁止开发人员将数据从生产环境复制到较低环境？如果有，是否得到执行？\n\
  \n这些例子并非旨在制造恐慌，而是为了提高人们的认识，即数据无处不在，而保护数据的第一步是进行清单。对于小型组织，可以通过在电子表格或数据库中维护数据目录、位置和分类来完成。分类稍后会详细介绍。对于大型组织，可能更适合使用能够主动扫描数据、根据组织规则对其进行分类，并提供报告和仪表板以跟踪组织整体数据的工具。然而，无论你如何识别数据，建立健全的数据清单仍有以下基本步骤：\n\
  \n- 创建清单，使用自动化工具或前面描述的手动流程。\n- 数据清单需要包括所有数据，结构化和非结构化，涵盖本地、云和第三方位置。\n- 去重数据并确保准确性。\n\
  - 确保清单通过用于最初收集数据的工具和流程得到维护并保持最新。\n\n尽管有工具可协助收集数据清单，但创建此清单更多是组织和流程问题，而非技术问题。取而代之\n\
  \n\n\n对于工具的一种方法是使用调查或问卷来确定数据的类型、分类和位置。这些问卷性质简单，应由负责系统内数据技术实施和维护的数据管理员来完成。每个组织都应创建自己的调查，以尝试确定系统中流动的数据类型，并应侧重于与组织使用的分类相符的数据敏感性。他们还负责确保随着架构的变化，该调查保持最新。以下是一个问卷可能包含的示例。\n\
  \n| 应用程序是否保留支付卡信息？ | Y/N | 如果是，请列出数据存储的位置。 | 数据是否在静态时加密？ |\n| 应用程序是否保留社会安全号码？ |\
  \ Y/N | 如果是，请列出数据存储的位置。 | 数据是否在静态时加密？ |\n| 应用程序是否保留受保护的健康信息？ | Y/N | 如果是，请列出数据存储的位置。\
  \ | 数据是否在静态时加密？ |\n\n如果你的组织像今天许多大型组织一样，将会有数据湖或数据仓库，它是组织的大部分结构化和非结构化数据的单一位置，所有组织的应用程序都可以利用。这在尝试定位和分类数据时无疑使事情变得容易得多，因为它是集中的，并且更容易应用工具或流程来收集敏感数据所在的位置。事实上，许多云提供商在其生态系统中提供的服务能够自动识别和分类数据。\n\
  \nNOTE Macie 是亚马逊网络服务（AWS）提供的一项服务，它使用机器学习和人工学习等技术来检测 AWS 中的敏感数据。目前它在服务中查找数据的能力存在一些限制，但预计随着时间的推移会有所改善。\n\
  \n然而，总会有与数据湖断开连接的遗留系统，以及为了运行而需要维护本地数据副本的应用程序。很难想象任何大型组织的数据完全集中在一个中心位置。这意味着组织仍需依赖问卷或本地工具来定位和分类数据。\n\
  \n无论组织如何盘点数据，接下来都需要对其进行分类。这使组织能够根据数据的分类提供适当的保护级别。虽然根据行业和需求而有所不同，但大多数组织会有四种分类数据的方式。\n\
  \n#### 表 1.1 大多数组织中的基本数据分类\n\n| 列标题 | 列标题 |\n|---|---|\n| 公开 | 这是可以供任何人访问的信息，包括公司外部的个人。一个例子可能是营销发布中的信息。\
  \ |\n| 内部 | 此信息仅供组织内部的个人使用。这并不根据角色对访问进行分类，个人只需是组织的一部分即可。这可能是关于商业计划的沟通。 |\n| 机密 |\
  \ 这是敏感信息，需要授权才能访问。例如，内部数据库中的某些数据，如社会安全号码或账号，不能供组织内所有人访问，仅限于需要访问的人。这应该是一个非常有限的受众。\
  \ |\n| 受限 | 这是关键信息，如果被泄露可能会对组织造成严重损害。这就像源代码或其他知识产权。 |\n\n这种分类水平使组织能够根据分类大致应用加密方法。例如，组织可能要求所有机密数据在静态和传输中都必须加密，并且所有受限数据只能与组织中需要知情的一小部分人共享。\n\
  \n### 2.2.3 应用加密\n\n那么，你已经确定了数据的位置，并使用前面描述的方法对其进行了分类。现在怎么办？\n\n> **加密**\n> 我们在 iler\
  \ 过程中会更多地谈论加密，但简单地说，它是通过算法和加密密钥将明文更改为密文的能力。需要记住的一个主要点是加密是可逆的，因此相同的密钥或配对密钥将能够解密。这绝不是一本关于加密的书。相信我，我无法像密码学家那样解释它。然而，关于加密如何应用于工程的杰出著作之一是\
  \ Bruce Schneier 的《应用密码学》。如果你正在寻找一些关于加密的更基本信息，请查看维基百科上的加密条目，其中介绍了加密的历史、未来和用途（https://en.wikipedia.org/wiki/Encryption）\n\
  \n要正确加密，你需要几样东西。你需要加密和解密密钥（有时是同一个密钥），安全创建加密密钥的方法，安全存储密钥的位置，以及以编程方式分发和访问密钥的方法。\n\n\
  根据应用程序的架构和部署，安全生成和存储密钥的能力可能有限。大多数遗留系统在存储加密和解密密钥方面有限制。密钥通常存储在配置文件中，或者更糟糕的是，硬编码在软件中。更现代的架构将利用硬件安全模块（HSM），该模块允许应用程序对存储加密密钥的物理设备进行安全\
  \ API 调用，并且可以配置为自动过期、轮换和生成密钥。如今，许多组织在监管或合同义务下必须提供更好的加密方法，例如使用 HSM 来加密敏感数据，甚至允许其客户管理自己的密钥。然而，尽管\
  \ HSM 将提供对数据加密和解密密钥的最高安全访问级别，但它们价格昂贵，如果硬件不可用，可能会成为单点故障。\n\n#### 使用 HSM 加密数据\n\n\
  ![](img/cc84747f93d290964598894b4f5c153b_36_0.png)\n\n根据你的组织和所在行业，你很可能至少需要加密受限和机密数据。例如，在金融机构中，包含账号、社会安全号码和类似数据的的数据集必须根据合规要求进行加密。在医疗行业，你需要加密保险信息和患者记录信息。这些组织需要考虑的一个问题是，信息可能位于数据库之外，而是在非结构化数据中，如文本文档、PDF\
  \ 或图像文件。例如，你医生办公室的打印表格可能包含你的社会安全号码，并会被扫描并上传到健康信息交换（HIE）。组织在处理结构化和非结构化数据加密时有几个选择：\n\
  \n- 全盘加密以提供数据所在磁盘的加密。然而，这并不能在文件级别提供更细粒度的加密。\n- 文件级加密，加密保存敏感信息（如机密和受限数据）的单个文件。\n\
  - 列或行级加密，加密数据库中一组数据，如社会安全号码或账号列。\n\n加密的正确应用并不是挥挥魔杖那么简单。根据数据的位置，加密可能有限或不可行。遗留系统通常难以访问像\
  \ HSM 这样的更现代的加密技术。然而，组织需要不断考虑如果数据暴露会发生什么。这可能发生在物理上，当数据库驱动器被不当处置并落入错误的人手中时，或通过内部人员或恶意活动数字方式访问系统中的数据库数据时。数据逃离组织的一些例子是：\n\
  \n- 不当销毁或退役包含敏感数据的旧驱动器。\n- 组织的内部人员可能通过不当的访问管理访问数据库。\n- 攻击者可能获得应用程序数据库所在主机的访问权限。\n\
  - 开发人员可能将数据从生产数据库复制到其本地环境或较低的测试环境，而不是使用更适合这些非生产环境的模拟数据。\n\n在数据可能随时暴露给对手的心态下，组织必须确保已根据数据的分类应用了适当的加密级别。如果数据库所在的物理驱动器或具有数据库访问权限的设备落入错误的人手中，组织是否有足够的信心认为其安全控制措施有效？对手或竞争对手能否访问该数据库上的数据，还是组织已应用适当的加密级别使其无法访问？\n\
  \n除了适当的加密技术外，组织还需要确保对静态数据有适当的访问控制，以及对可以加密和解密的密钥的访问控制。如果用户有权访问数据库管理工具，他们很可能有权查看数据库中数据的明文。此外，如果用户有权访问加密或解密密钥，他们也能够查看此数据或像合法服务一样加密数据。这些敏感活动的可追溯性可以通过使用提供特权账户访问同时提供审计能力的工具来实现。通常，工具内的审计是通过屏幕活动捕获、击键记录和自动填充密码完成的，以便最终用户无法访问。在这种情况下，组织将知道谁执行了敏感活动，更重要的是，他们在获得访问权限时做了什么。\n\
  \n### 2.2.4 传输中的数据\n\n如果我们只需要保护数据在数据库或文件系统中安静不动时，保护信息的工作会容易得多。现实情况是数据会移动。事实上，数据交换是组织赚钱的方式。它是组织获得竞争优势的方式。简而言之，数据需要在运动中才能盈利。\n\
  \n不久前，大多数网站使用基本的 HTTP 或 FTP 来传输数据。使用明文 HTTP 或 FTP 意味着当数据从一个位置移动到另一个位置时，它以明文形式存在，任何有权查看流量的任何人都可以查看。安全套接层（SSL）是首次尝试为传输中的数据带来加密，将\
  \ HTTP 转换为 HTTP over SSL（HTTPS）。尽管由于安全问题从未发布 1.0 版，2.0 版\n\n\n\n于1995年发布。自那时起，我们有了许多版本的SSL，随后是取代SSL的传输层安全（TLS）。TLS主要用于保护HTTP和FTP流量。\n\
  \n#### HTTPS 确保窃听者无法读取发往 Web 服务器的流量\n\n![](img/cc84747f93d290964598894b4f5c153b_38_0.png)\n\
  \n图 2.3 HTTP 与 HTTPS\n\n在一切皆为 HTTPS 的时代之前，网站仅在进行登录等敏感活动时才使用安全传输。如今，你访问的几乎每个网站都已启用\
  \ TLS，如果你尝试仅使用 HTTP 访问某个站点，系统会将你重定向到 HTTPS。TLS 的采用有几个因素推动。浏览器在这方面发挥了很大作用，因为它们开始将未使用\
  \ TLS 的站点标记为“不安全”，甚至在使用已知较弱版本的 TLS 时也是如此。此外，多年来，安全不再只是组织中的一个偏僻角落，而是日益成为普通用户的关注点。用户可能不知道，也不想知道\
  \ TLS 如何工作。但他们确实希望知道，当他们将信用卡号码输入网站时，该号码会受到保护。如今大多数用户已经习惯于确保他们看到某种锁形图标或其他指示，表明他们所在的站点正在使用安全连接。\n\
  \nTLS 的优点在于它很容易启用。这通过 Web 服务器中的简单配置以及来自受信任证书颁发机构（CA）的签名数字证书来完成。\n\nDEFINITION 公钥和私钥对，也称为非对称密钥对，是一组用于加密和解密数据的数字密钥。这些密钥是成对生成的，但其中一个旨在保密，而另一个则用于公开。它们用于加密和解密，并提供数字签名。\n\
  \n在 Web 服务器上生成公钥和私钥对。私钥由 Web 服务器保留，理想情况下永远不会离开服务器。公钥用于创建证书签名请求（CSR），然后将其传递给 CA 使用其私钥进行签名。其产物是公用证书，用于表明\
  \ Web 服务器控制其私钥并且已由 CA 验证。\n\n#### 生成证书签名请求\n\n![](img/cc84747f93d290964598894b4f5c153b_39_0.png)\n\
  \n图 2.4 – 使用 Entrust 作为 CA 生成用于 HTTPS 的证书\n\n一旦该证书被签名，它就会通知任何用户代理，如 Web 浏览器或命令行\
  \ HTTP 工具，他们可以信任 Web 服务器。用户代理将在其信任库中查找并确定签署该证书的证书颁发机构是否可信。如果证书由知名 CA 签署，浏览器已经建立了信任关系，并会接受\
  \ Web 服务器是可信的。在某些情况下，如果不是知名 CA，用户代理需要通过将其证书放入其信任库来建立信任。\n\n证书管理很有趣。没人这么说过。正如你所见，启用\
  \ TLS 大多很简单，但存在运营成本。与前面讨论的密钥管理问题类似，证书具有生命周期，需要定期续订或更换。此外，技术的一些基本底层架构偶尔会发生变化，从而导致需要进行重大更改。事实上，在\
  \ 2016 年，浏览器开始对使用 SHA-1 哈希算法生成的证书显示安全警告，用户可以点击消息继续访问该站点。到 2018 年底，像 Chrome 这样的浏览器开始提醒用户，他们将在\
  \ 2019 年初禁止访问使用不太安全的 SHA-1 的站点。\n\n我曾有幸在一个大型组织中领导一个项目，其指令是将我们所有的证书更新为 SHA-2。这不是一个小任务。识别这些证书用于的各种用例，如单点登录\
  \ SAML 证书、TLS、FTP、数字签名等是困难的。此外，定位这些证书的存储位置也是一个进一步的复杂因素。它们存储在文件系统、密钥库、Web 服务器和数据库中。在不造成中断的情况下进行更改需要开发、安全、客户和运营团队之间的紧密协调。不可避免地，当某些事情没有按计划进行时，会出现回滚。\n\
  \n不过不用担心，就像加密密钥一样，有工具可以用来管理、轮换、签发证书并提醒证书过期。还有像自动化证书管理环境（ACME）这样的协议，可用于创建 CSR 并管理密钥和证书。它是\
  \ Let's Encrypt 证书颁发机构的业务模式的一部分，使其能够快速、高效地签发证书，并提供约 90 天的短有效期。这种短有效期使 Web 服务器能够频繁更改证书，并减少证书在流通中的时间。过去不久，证书的有效期可能为五年、十年甚至三十年。出于安全考虑，行业已开始远离这种做法，并寻求更短的时间线以提供更好的安全性。这只有在具备自动化措施以使过期证书的轮换过程顺畅时才有效。\n\
  \n### 2.2.5 传输前加密\n\n一种确保在两个组织之间或组织内两个应用程序之间发送数据时数据安全的方法是在发送数据之前进行本地加密。这确实要求双方已经确定共享加密密钥，或者使用密钥对，允许一方加密而另一方解密。数据将在两个实体之间传输，无论是否通过非安全通道（如\
  \ HTTP）传输，都受到保护。然而，你仍然依赖于密钥管理。传输密钥会使每个端点都面临可能的泄露风险。另一个需要考虑的问题是，如果密钥被泄露，双方都需要进行另一次交换和重新设置密钥。\n\
  \nPretty good privacy 是一种在 1991 年开发的知名工具，用于在传输前提供加密。它可用于电子邮件和文件传输。PGP 可以使用单一加密密钥或公钥和私钥对。后者提供了两个实体即使从未见过面或没有交换单一密钥的手段也能相互发送信息的能力。\n\
  \n### 2.2.6 使用中的数据\n\n当谈到保护数据时，传输中和静态数据的加密会得到大量关注，而对使用中数据的加密则复杂得多。保护使用中的数据是指当数据在非持久状态下被访问时，如内存或\
  \ CPU 中。此外，这意味着当结合静态数据和传输中数据的加密时，数据在其整个生命周期内都受到保护。一般来说，设计良好的系统会确保对使用中数据的访问仅限于应有权访问的系统部分。这将限制恶意软件和其他进程对内存的访问。这应防止不仅写入和读取，还防止在不允许时执行代码。\n\
  \n许多保护方法是通过主机级或操作系统级控制实现的，例如使用分段、保护环或分页虚拟内存。此外，地址空间布局随机化是在操作系统级别设置的，其中内存被随机化以限制恶意活动找到特定地址进行跳转的能力。\n\
  \n可以在系统级别使用飞地，确保使用中的数据被加密，并且仅在读取时对 CPU 或 CPU 缓存可用，而在其他任何时候都处于加密状态，无法被系统的其他部分读取。另一个值得提及的保护方法是\
  \ CPU 能够在寄存器中管理加密密钥，而不是将密钥存储在 RAM 中。这使得攻击者或恶意代码访问加密密钥的机会窗口变小。\n\n### 2.2.7 并非如此机密\n\
  \n几乎每天都会发生泄露或某种类型的网络事件。机密性泄露意味着本应保持机密或受限的数据被无意中泄露。这可能通过恶意活动或意外泄露发生。\n\n电子邮件是泄露数据的快速高效方法。虽然电子邮件中包含的信息可能令人担忧，但重要的是要知道，按大多数标准，仅电子邮件地址本身就被视为个人身份信息。2020\
  \ 年 2 月，英国首相鲍里斯·约翰逊的父亲在给英国官员的电子邮件中意外抄送了 BBC，内容涉及鲍里斯·约翰逊与中国国家之间因冠状病毒爆发而缺乏联系的问题，引发了一场国际风波。同年晚些时候，由于一名员工在发送有关因冠状病毒限制而滞留在其他国家的公民的紧急贷款和重新入境配额的信息时未能使用密送，澳大利亚外交贸易部泄露了\
  \ 1,000 名公民的个人数据。\n\n然而，尽管电子邮件是泄露信息的绝佳途径，但其规模往往小于大规模泄露。2021 年 5 月，生产联网健身器材、因高端固定自行车而闻名的公司\
  \ Peloton，不得不发布声明，称其应用程序编程接口（API）允许任何人从 Peloton 服务器提取私人数据，即使用户个人资料设置为私密。该 API 允许未经身份验证的访问，意味着你不需要拥有账户或特殊访问权限。Peloton\
  \ 最初仅将 API 访问限制为拥有 Peloton 账户的用户，然而这只限制了受众，任何人都可以注册 Peloton 账户并访问 API 以收集其他用户的个人信息。最终\
  \ Peloton 完全纠正了身份验证问题，但他们无法确认或否认由于该问题，其超过三百万用户的数据是否被访问或窃取。\n\n### 2.2.8 我甚至需要这个吗？\n\
  \n你可能熟悉 Marie Kondo，她因在 Netflix 上播出的节目《Tidying Up》而闻名。她使用 KonMari 方法来识别你应该保留的东西和你应该扔掉的东西。通常，她会问这个问题：“这会带来快乐吗？”这与安全，特别是数据安全有什么关系？当我参与审查涉及敏感数据的<|message|>\n\
  \n\n他们不需要这些数据。因此，限制对这种敏感数据的收集是保护它的最佳方式。然而，组织和应用开发团队往往会倾向于收集更多数据，因为你可能在某个时候需要它，而且存储成本很低。\n\
  \n关于数据，你需要问的一些问题：\n\n- 你需要存储这些数据吗？\n- 你是否有法规或合同要求保留这些数据？\n- 你能正确地对这些数据进行分类吗？\n-\
  \ 你能为收集到的数据提供适当的保护级别吗？\n- 你知道何时不再需要它并可以销毁它吗？\n\n如果你能肯定地回答这些问题，那么你就走在正确的道路上。如果不能，那么请遵循之前关于对数据进行分类、盘点和加密的建议。\n\
  \nEXERCISE 如果你目前在一支开发团队或收集数据的团队工作。查看数据库模式，至少识别出一组包含敏感信息的数据，例如数据库中的一列。问问你自己或你的团队，正在收集的数据对于应用程序的运行是否至关重要，以及没有这些数据是否会影响应用程序。答案可能是肯定的，事实上很可能就是肯定的，但定期提出这些问题会让你养成质疑是否需要保留敏感信息的习惯。\n\
  \n## 2.3 可用性\n\n当谈到 CIA 三要素时，可用性不如机密性那样引人注目，主要是因为通过正确加密数据可以获得最大的收益。可用性听起来更像是 IT\
  \ 运营或站点可靠性工程（SRE）的工作，他们主要关注系统的正常运行时间。现实情况是，对于停机可能意味着生死攸关的应用而言，可用性可能至关重要。很难想象没有这种场景的例子。医院、紧急服务、关键基础设施等对正常运行时间有很高的需求。\n\
  \n并非所有正常运行时间的需求都是为了公共安全。那些纯粹是线上零售商的组织，如果其系统不可用就会损失金钱。2021 年初，线上零售巨头亚马逊每分钟的收入约为 830,000\
  \ 美元。很明显，亚马逊的停机会让公司损失数百万美元，具体取决于持续时间。\n\n你可能没有运营亚马逊或医院，但请不要误以为应用正常运行时间对组织仍然很重要，并且确实有财务影响。组织会定期报告其正常运行时间，这是一个必须达到的关键指标。大多数组织都有合同义务要求他们满足服务等级协议（SLA），否则将产生罚款。通常以向客户支付货币补偿的形式出现。\n\
  \n### 2.3.1 DoS 和 DDoS\n\n大多数人听到会使服务或应用程序瘫痪的攻击时想到的就是一件事。DoS，即拒绝服务，是一种故意用大量请求淹没服务或应用程序的攻击。它的“大哥”是\
  \ DDoS，即分布式拒绝服务，其中请求来自许多不同的来源，而不是 DoS 模型中的一个来源。然后系统就会不堪重负，无法为其他合法流量完成请求。保护免受 DDoS\
  \ 攻击的最大复杂性之一是流量通常看起来是合法的，这使得阻止这种流量变得困难。\n\n有一部老牌的美国电视节目叫做《我爱露西》。其中最具标志性的一集是露西和她的朋友埃塞尔在一家糖果工厂工作以赚取一些钱。她们被分配到糖果包装站，糖果会沿着传送带通过，两人必须包装每一颗。自然地，一开始传送带运行平稳，两位朋友能够成功包装经过的每一颗糖果。不久，传送带开始移动得快得多，糖果也越来越多。两位朋友很快就不堪重负，开始把糖果塞进口袋和嘴里，同时错过了大部分经过的糖果。\n\
  \n这是一个简单的 DoS 攻击示例，系统可以被诱骗接受看似正常流量、但由恶意行为者以高流量发送的流量。换句话说，传送带上来的糖果仍然是合法的，应该在那里，但设置来正确处理这些糖果的系统无法处理发送的大量糖果。现在，在这个例子中，很容易一笑置之，因为它是一个简单但视觉上准确的拒绝服务示例。在现实世界中，这些攻击可能是致命的。多年来，这些攻击的规模也在不断增长。早期的\
  \ DDoS 攻击规模很小，会使用类似 SYN 洪水的方式发送大量未关闭的 TCP 同步（SYN）数据包。它很简单，但很有效。更重要的是，几乎任何人都可以做到。今天的攻击要复杂得多，规模也更大，有些情况下达到每秒两太比特以上。换句话说，这相当于每秒\
  \ 1,000,000,000,000 比特，或大约 1,000 小时的电影。\n\nDDoS 攻击不仅限于网络层攻击。第七层，即应用层攻击也很常见。这类攻击通常规模较小，因为它针对的是破坏应用程序流程或数据处理，攻击的是提供应用程序的特定资源。这可能是通过针对数据库使其不可用，或用\
  \ HTTP 流量淹没应用程序，使其无法处理用户的合法请求来实现的。\n\n#### 最大已知的 DDoS 攻击\n\n![](img/cc84747f93d290964598894b4f5c153b_44_0.png)\n\
  \n图 2.5 – 自 2010 年以来 DDoS 攻击的增长\n\n### 2.3.2 意外停机\n\n并非所有可用性问题都是由于恶意活动造成的。如果应用程序没有构建为具有弹性，那么像软件更新这样无害的事情也可能导致应用程序停机。其他可能的操作是系统重启、补丁或软件安装失败。大多数组织会在对客户影响较低的时候进行系统维护。\n\
  \n2019 年，英国正走向脱离欧洲联盟之际，许多希望留在欧洲联盟的英国公民试图在英国议会网站上签署一份请愿书。网站上不寻常的流量激增让许多公民遇到了 HTTP\
  \ 502 错误，表明网站无法处理大量请求。\n\n也有保护机制本身会造成可用性问题的情况。Akamai 是 DDoS 保护领域的领先公司之一。他们提供的内容分发网络（CDN）为许多公司提供对\
  \ DDoS 等容量型攻击的保护。2021 年 6 月，Akamai 发生停机，导致全球多个网站无法访问。受影响的主要是澳大利亚和新西兰的金融机构，不过西南航空和美国航空也受到了影响。停机的原因并非网络攻击，而是\
  \ Akamai 路由表值配置错误造成的。这发生在 Akamai 的竞争对手 Fastly 和 Cloudflare 发生类似停机之后不久，显示出过度依赖第三方提供保护会给应用程序带来额外的风险。\n\
  \n### 2.3.3 勒索软件的作用\n\n保护免受用合法或垃圾数据淹没你的网络或应用程序的容量型攻击是一回事，但通过加密应用程序所依赖的设备或数据来制造可用性混乱则是完全不同的方法。勒索软件并非新鲜事物，但在过去几年里它越来越受欢迎。我们可以花一整章来讨论勒索软件，但我在这里做个总结。\n\
  \n勒索软件是成功恶意软件攻击的结果，其唯一目的是加密设备（锁定型勒索软件）或更流行的方法是加密数据（加密型勒索软件）。恶意软件的投递方式从网络钓鱼到更复杂的远程代码执行不等。那么，这对你的\
  \ Web 应用程序或服务意味着什么？显然，加密的数据库在大多数情况下会使你的应用程序无用。恢复正常运营通常意味着以匿名加密货币的形式向攻击者支付赎金，以获得解密密钥来解锁数据。成熟的组织可能能够通过从未被加密的备份中恢复来克服这种中断。\n\
  \n勒索软件在过去几年中持续增长，并将网络安全推向主流，例如 WannaCry、亚特兰大市、圣地亚哥港和 Colonial Pipeline 攻击等著名事件。随着勒索软件即服务（RaaS）的兴起以及附属攻击者重复使用流行的勒索软件，趋势将继续对组织不利。\n\
  \n勒索软件是对组织的持续且日益增长的威胁。想到你的数据被加密而没有解密方法，这令人难以置信地令人窒息。网络安全和基础设施安全局（CISA）提出了几项避免勒索软件风险的建议：\n\
  \n- 确保你的组织有软件修补程序的流程。\n- 定期备份数据并测试备份。\n- 遵循最小权限原则限制对系统和软件的访问。\n\n### 2.3.4 赌场下注离线\n\
  \n并非所有组织都面临同等的 DDoS 攻击风险。有些组织由于其业务性质，面临的风险更高。Imperva 是通过包括 Web 应用防火墙（WAF）在内的一套工具提供应用层\
  \ DDoS 保护的领先提供商。他们在 2020 年发布的《全球 DDoS 威胁态势报告》显示，游戏行业和赌博行业继续是互联网上攻击最多的网站。这很容易理解。这些网站必须在重大活动期间始终可用，否则就会损失收入。\n\
  \n2020 年，一名攻击者使用数据报拥塞控制协议（DCCP）绕过了针对其他网络协议如 TCP 和 UDP 的 DDoS 保护，以实施有史以来最大规模的 DDoS\
  \ 活动之一。他们利用新的攻击向量进行所谓的 DDoS 勒索或赎金。RDoS（勒索 DDoS）顾名思义，是攻击者威胁组织支付费用，否则就对其发动 DDoS 攻击的一种方式。到\
  \ 2021 年 2 月，这些攻击者能够聚集超过 800 Gbps 的流量指向其受害者。在这种情况下，是欧洲的一家赌博网站。\n\n\n\n\n\n### 2.3.5\
  \ 健康组织仍是攻击目标\n\n尽管全球爆发了大流行，医疗保健行业仍然诱人到足以让攻击者无法却步。许多最知名的网络犯罪团伙（稍后会详细介绍）声称他们会避免攻击健康组织以显示其敏感的一面。然而，正如俗话所说，攻击者并不都持相同看法。\n\
  \n在 Covid-19 大流行期间，针对健康组织的攻击和企图攻击不计其数。美国的 HHS（卫生与公众服务部）和巴黎 AP-HP 都成为 DDoS 攻击的攻击目标。在\
  \ HHS 的案例中，旨在破坏疫情应对工作的威胁性 DDoS 攻击被挫败。然而，运营着法国数十家医院并提供研究和疾病预防的巴黎 AP-HP 则遭受了 DDoS\
  \ 攻击，该攻击被网络提供商吸收。\n\n针对医疗保健组织的一点很明确：攻击者总是会选择最容易下手的目标、付出最少努力且最有可能支付费用的目标。医疗保健组织并不是工程组织。它们的首要目的是为有需要的患者提供医疗服务。对其能力的任何中断都会危及生命，这将促使决策迅速寻求解决办法。技术通常落后于最先进水平数年，且技术团队规模小或外包，最快的解决办法通常是向攻击者支付费用。\n\
  \n### 2.3.6 建立韧性\n\n可用性在世界上只有一个最好的朋友。那就是韧性。世界上最具标志性的桥梁之一是旧金山的金门大桥。被誉为现代世界奇迹之一，金门大桥连接着旧金山湾与太平洋。建设始于\
  \ 1933 年，四年后完工。金门大桥是构建韧性的绝佳现实案例。不仅大桥的建造是极端的现代奇迹，而且对于旧金山这样地方还有独特的考量。主要是地震，因为金门大桥靠近圣安德烈断层，该断层会产生频繁的地震活动，其中一些可能对该地区造成毁灭性打击。它在八十多年的存在中幸存了多次大地震，但并非不需要持续审查和返工。目前正在进行多个项目，使其不仅更能抵御地震，还能抵御强风。这与软件有什么关系？无论是建造横跨半岛的桥梁还是开发向客户交付价值的应用程序，架构中的风险管理都相差无几。架构、设计和开发都需要考虑各种“如果”场景并为可能的攻击、故障或错误做好计划，其中一些可能是故意的。\n\
  \n你的应用程序应该以考虑到可能寻找你特定应用程序弱点的风险类型和威胁行为者的方式进行设计和架构。就像金门大桥需要建造以承受风力以及可能的大地震一样，医疗保健应用程序需要建造以承受试图勒索你客户数据的网络攻击，从而将停机时间转化为利润。你的赌博应用程序必须考虑犯罪分子试图\
  \ DDoS 你的应用程序以勒索你的组织。你的关键基础设施应用程序必须准备好处理试图关闭你的系统以瘫痪国家关键部分的先进持续性威胁。我们将在下一节中详细介绍这些内容。\n\
  \n建立韧性的简单方法之一是增加更多处理能力。垂直扩展意味着你正在创建更大的系统。水平扩展意味着你正在添加更多系统。这说起来容易做起来难。然而，迁移到云优先架构使这变得更容易，尽管代价昂贵。此外，将分段构建到你的架构中可以减少潜在攻击的“爆炸半径”。如果你始终假设你的某个系统已被入侵，你将以完全不同的方式审视你的架构。同样，已经出版了关于混沌工程原则的书籍，其最简单的形式意味着向系统中注入一点混乱以识别问题，从而防止全面中断。想象一下试图在轮胎上找到针孔。你可能会在轮胎周围涂抹一些肥皂水并加压以寻找气泡出现的位置。这与混沌工程的概念类似。\n\
  \n- 制定假设：“如果外部服务不可用，应用程序将优雅地响应”。\n- 测试假设：将应用程序的 HTTP 路由到不存在的服务并观察故障情况。\n\n修复：如果需要，识别问题，解决它们并改进流程。\n\
  \n关于建立韧性的最后一点评论。事情会出错，流程会失败，系统会崩溃。如何利用这些信息对长期改进系统至关重要。从错误和失败中学习是建立更具韧性系统的最佳方法。从失败中学习的一个典型组成部分是事后分析或根本原因分析。在这里，团队回顾发生了什么以及失败在哪里。从那里他们将研究成果纳入行动计划，以确保控制、流程和自动化到位，以确保故障不再发生。\n\
  \n## 2.4 完整性\n\n当我们打开最喜欢的饮料瓶时，我们期望听到瓶盖从保护盖上弹开的声音。数据在某种程度上也类似，我们希望在查看或处理时确信它是正确的。完整性是指能够知道数据是良好且可信的。这要求应用程序信任数据在传输中或静态时未被篡改。完整性需要在两个应用程序之间的通信中、在数据库或文件系统中，或硬件或软件中得到确认。数据存在或移动的任何地方都需要被使用它的应用程序继续信任。\n\
  \n与可用性和保密性一样，完整性问题可能是故意的，也可能是意外的。它可能来自攻击者向业务流程注入垃圾从而破坏随后存储或处理的数据，也可能是写入失败从而破坏你计划用于从潜在勒索软件攻击中恢复的备份。\n\
  \n### 2.4.1 完整性始于访问\n\n你是否曾经走到办公桌前，坐进车里，或进入家中的房间，注意到有些东西被移动了，而你知道你没有移动它？你的思绪开始回溯上次在那个空间时的情况。你真的把那支笔放在那里吗？那本书一直都在桌子的那一侧吗？如果不是你，那会是谁？如果只有一种方法可以看到除了你之外谁在那个房间并当场抓住罪犯就好了。我告诉你一个消息。很可能就是你。\n\
  \n想想从你的浏览器到 Web 服务器的简单 Web 请求。请求以 GET 或 POST 的形式离开浏览器，作为数据包穿越网络，经过多个网络设备，被负载均衡器或代理或\
  \ WAF 接收，它到达 Web 服务器、应用程序服务器和数据库。顺便说一下，它很可能已在这些位置中的一些被记录并发送到单独的集中式日志系统。并非所有系统路径都相同，但总体而言，这对今天大多数\
  \ HTTP 请求都成立。在每一步中，用户或账户都有可能获得访问权限以查看、复制或破坏数据。\n\nReverse Proxy Flow\n\n![](img/cc84747f93d290964598894b4f5c153b_48_0.png)\n\
  \n图 2.6 – 带有反向代理的简单 HTTP 请求\n\n访问控制和监控主要用于确定哪些账户在数据通过系统时与数据有过接触。它可以通过为某些文件、目录和资源提供访问日志监控系统这样简单的方式实现。也可以像特权访问管理（PAM）系统那样复杂，该系统要求用户签出对敏感系统的账户访问权限，其中操作和击键都会被记录。中间还有系统和安全模型可提供不同级别的访问控制。关键要点是确保你能够追溯访问权限，直至单个文件，追溯到具体的个人或用户账户。一旦你有了像共享账户这样的东西，你就失去了将活动追溯到单个账户或个人的能力。这些账户是有一组个人共用的用户名和密码。\n\
  \n\n\n\n\n不可否认性是一种访问控制形式，它授予应用程序将操作或活动追溯到身份的能力。不可否认性和访问控制最重要的概念可以用 FDA 对 *审计跟踪*\
  \ 的定义来概括。\n\n> **定义** 审计跟踪是一个安全、计算机生成的、带时间戳的电子记录，允许重建与电子记录的创建、修改或删除相关的事件过程。\n\n\
  攻击者可能会寻找将自己的活动归咎于不同账户或将责任推到别处的方法。当攻击者对应用程序发起攻击时，其目的是明确的，也许是数据外泄或 DoS。在这些情况下，他们还会尝试通过污染或破坏日志来隐藏自己的活动，从而使审查事件的团队无法拼凑出攻击者的活动。验证进入日志的输入非常重要，并确保对日志工作流的访问得到严格控制。同样重要的是要记录足够的信息以帮助潜在事件的取证。没有这条审计跟踪，就无法将行为追溯到实体，组织将无法确定活动的根本原因。\n\
  \n### 2.4.2 版本控制的作用\n\n版本控制是一种确保如果数据被损坏，就有手段恢复到良好状态的方法。对于我们中从事过任何软件开发的人来说，我们都知道在编码过程中，你可能会破坏其他东西。或者也许只有我这样。你通常会尝试回滚到已知良好的状态，或者至少能够查看旧文件并将其与当前文件进行比较，以便确定出了什么问题。版本控制软件执行提供对文件随时间变化的控制和可见性的功能。如前所述，这提供了在数据损坏、删除或只是糟糕编码的情况下进行比较和回滚的能力。\n\
  \n版本控制还为一支软件人员团队提供在大型应用程序上工作的机会。很少有应用程序是由个人开发的。构建用于商业用途的应用程序需要一个团队。版本控制系统（VCS）的使用使团队能够同时在同一应用程序上工作，同时提供跟踪代码签入、解决冲突以及启用回滚更改的手段。\n\
  \n许多较新的 VCS 包括执行代码审查、跟踪缺陷以及利用任务控制的能力，这些任务控制可以执行与持续集成相关的作业，如合并代码、运行测试套件，并创建可部署到可进行测试的环境中的软件包。关于软件安全而言，所使用的\
  \ VCS 允许应用程序安全团队对敏感代码执行代码审查。例如，代码中可能已进行更改，影响了应用程序的身份验证。在这种情况下，工程团队可能会要求应用程序安全团队审查代码，以查看更改是否带来额外风险。此外，如果\
  \ VCS 提供了运行任务的能力，应用程序安全团队可以利用这一点执行自动安全测试以发现漏洞，例如使用静态分析工具。\n\n### 2.4.3 数据验证\n\n\
  在维护数据完整性时，另一个需要考虑的问题是，在数据通过用户或服务首次进入系统时保持数据的完整性。在应用程序安全领域，我们通常称之为数据清理或验证。\n\n> 注意\
  \ 如果你只能记住本书中的一件事，那就是你永远不能信任你的终端用户或你的应用程序所工作的服务会向你发送正确的数据。无论是有意还是无意，未经适当验证的数据都可能导致应用程序出现故障，或使恶意行为者能够入侵它。\n\
  \n这意味着简单的概念，如在期望电话号码或社会安全号码时只接受特定长度的数值。它可以复杂到编写查找特定字符和其他要求的正则表达式。许多开发框架甚至可能已将数据验证内置于框架中。然而，最终，验证策略应确保输入数据既在预期值的约束范围内，也在逻辑上是有意义的。\n\
  \n根据你的开发框架，验证技术可原生使用，并可用于检查大小、类型、模式等常见约束。在使用框架的原生元素开发验证或自行开发验证时，需要考虑的一点是，采用允许列表方法比拒绝列表更有效。这意味着应用程序应指定允许的内容，而不是阻止的内容。显而易见的是，拒绝列表需要不断维护，并且不会总是能捕捉到规避验证的新方法。允许列表只会允许应用程序预期要处理的值，是一种更安全的方法。\n\
  \n关于输入验证的最后一点是，仅在客户端检查输入是不够的。此检查还必须在服务器端执行。代理工具和像 cURL 这样的项目允许攻击者操纵输入或向应用程序发送请求，而无需经过\
  \ UI。换句话说，大多数攻击者将很容易规避可能已实施的客户端验证。\n\n### 2.4.4 数据复制\n\n数据复制通常被认为是数据备份。然而，它不仅仅是这样。数据复制涉及在不同位置制作数据的多个副本，以便能够吸收一个副本中潜在的数据丢失或损坏。这不仅提供更好的可用性和更低的延迟，还提供在出现问题时恢复到已知良好状态的能力。虽然应实施文件和系统备份，但应用程序架构应包括通过集群数据库分发数据的能力。在这种方案中，数据被拆分，以便不同的片段发送到不同的节点，并在检索时以一种将不同片段重新整合为原始数据的方式进行。数据的复制将提供额外的保障，确保一个节点的故障不会限制集群检索数据的能力。\n\
  \n### 2.4.5 数据检查\n\n如果你在技术领域工作的时间足够长，你就很清楚校验和背后的概念。这些值提供了给定输入的指纹。这本质上是对输入的哈希，这意味着它只能单向进行。换句话说，明文被转换为哈希值，但哈希值无法转换回明文。校验和和哈希不一定不同，只是它们的用途不同。哈希是数学函数的输出，旨在创建唯一值，而校验和用于进行比较，然后决定值是否已更改。\n\
  \n![](img/cc84747f93d290964598894b4f5c153b_51_0.png)\n\n图 2.7 – 哈希验证实用程序\n\n提供数据完整性保证的另一种生成代码示例是消息认证码（MAC）。这些是加密校验和，不仅用于证明数据在保存或传输过程中未被篡改，而且当在\
  \ MAC 生成期间使用加密密钥时，它还提供了一种验证其来源的手段。\n\n## 2.5 身份验证和授权\n\n身份验证和授权是维护应用程序安全至关重要的另外两个支柱。它们是通常更广泛地被视为身份和访问管理（IAM）的组成部分。深入探讨这一主题超出了本书的范围，但了解它们的含义及其在安全中的作用很重要。\n\
  \n\n\n\n\n### 身份验证 vs 授权\n\n![](img/cc84747f93d290964598894b4f5c153b_52_0.png)\n\
  \n图 2.8 身份验证 vs 授权\n\n### 2.5.1 身份验证\n\n身份验证（或 AuthN）是确认用户或账户确实是其所声称的身份的做法。这是通过以下方式证明身份来实现的：\n\
  \n- 用户名和密码，即你所知道的东西。\n- 通过硬件设备或软件的令牌，即你所拥有的东西。\n- 生物特征，如指纹或视网膜扫描，即你所是的东西。\n\n在大多数情况下，单个因素足以验证账户。我们的用户名和密码组合被广泛用于让我们登录应用程序。更严格的应用程序或服务可能需要额外的因素，如令牌或生物特征（或全部三种）来提供足够的账户验证。使用一个以上因素被认为是多因素身份验证。例如，密码结合令牌就是用于提供身份验证的两个因素。重要的是要指出，一旦账户经过身份验证，并不意味着可以访问系统内的所有内容。这是身份验证和授权之间的重要区别。你能够登录像\
  \ Amazon.com 这样的网站并因此完成身份验证，并不意味着你有权访问包括管理功能在内的所有内容。\n\n### 2.5.2 授权\n\n授权是向用户或账户授予对应用程序中某些功能或活动的访问权限的过程。这发生在身份验证过程中或之后。重要的是要考虑在授权过程中采用最小权限原则，以确保账户仅有权访问执行其任务所需的<|message|>功能。这可以通过几种访问模型实现。\n\
  \n- MAC（强制访问控制）– 将访问控制权交给系统或数据的所有者和保管者。\n- RBAC（基于角色的访问控制）– 根据账户在某个组或角色中的参与情况提供访问权限。\n\
  - DAC（自主访问控制）– 将访问控制的完全控制权交给系统或数据的所有者。\n- RBAC（基于规则的访问控制）– 为账户定义访问权限，该权限由保管者或系统管理员定义。\n\
  \n一种常见的思考授权及其在身份中作用的方式是常见的访问卡、护照或驾照。这些类型的身份识别物品通常带有照片、你的姓名、地址和其他身份信息。拥有其中之一有助于他人确认你的身份，因为你是照片中的那个人。这是身份验证。然而，拥有该身份识别物品并不意味着你会被授予访问某些地点的权限。例如，你的驾照不会让你进入军事基地的敏感区域。当然，驾照上的照片和信息可以识别你，但绝不意味着你有权进入禁区。\n\
  \n## 2.6 攻击者\n\n构建纵深防御方法来应对安全问题的基石之一是知道应预期何种类型的攻击。以下是一句经常被引用的话，适合我们的需求：\n\n> 如果你知道敌人和知道自己，就不必担心百战的结局。如果你知道自己但不知道敌人，每获得一次胜利也会遭受一次失败。如果你既不知道敌人也不知道自己，你将在每场战斗中失败。\n\
  > \n> 孙子《孙子兵法》\n\n当然，我们每天上班时并不是要去打仗，但这在网络安全背景下仍然适用。了解攻击者、他们的方法以及他们在你组织中的目标，可以让你知道将精力\
  \ and 金钱投入到哪里。我们接下来会更多地谈论一般风险，但在那之前，让我们先谈谈你可能会遇到的各种对手。\n\n### 2.6.1 脚本小子\n\n在网络安全领域，我们可以预期看到的最普遍的对手之一是“脚本小子”。这不是一个好名字，但这些通常是技能较低的攻击者，其动机除了报复或名声之外几乎没有。他们会寻找购买或重用他人开发的漏洞利用，而对漏洞利用的工作原理毫无了解或理解。他们只是想将其指向目标并点击按钮。\n\
  \n尽管这些攻击者的技能水平较低，但他们通常使用自动化类型的攻击，使他们能够大规模运行这些攻击。不要弄错了，组织每天都处于近乎持续的攻击之下。其中一些是来自互联网的噪音，其他活动是由于这些对手，他们只是想测试自己的技能或向朋友炫耀。尽管这种动机可能使他们的攻击影响较小，但它们仍然十分普遍。\n\
  \n#### 僵尸网络\n\n僵尸网络是脚本小子常用的攻击工具。这是一种用于大规模执行 DDoS 攻击的方法。这些僵尸网络是由恶意代码注入的受损设备网络，以便在未来的攻击中被使用。大多数时候，它们被用于针对组织进行体积型攻击，如\
  \ DDoS。它们可以是物联网（IoT）设备、笔记本电脑、台式机、打印机，或任何具有互联网连接并可用于进行网络调用的设备。其中一些僵尸网络甚至可以出售或按时间段出租。对于这种类型的攻击，大多数组织无法自行缓解，需要寻找外部帮助，例如在应用层和网络层的防火墙。其他控制措施要求你的组织了解其预期看到的流量类型以及其来源，以便可以实施控制来将活动限制在仅这些已知位置。这可能需要地理围栏，限制流量仅来自已知的好国家或位置。\n\
  \n### 2.6.2 内部人员\n\n内部威胁是一个经常被忽视的类别。这些是通常拥有外部人员无法访问的数据和系统权限的用户。想想你组织域控制器的系统管理员。现在你脑海中有这个人了，想想这个人感到不满的情况。想想医疗机构中可以访问病历的后台管理员呢？如果他们不再“喜欢”自己的工作怎么办。这些事情确实会发生。尽管可以公平地说，大多数内部泄露是意外发生的，而不是恶意行为者的活动所致。\n\
  \n内部威胁的数字因并非所有内容都需要报告而有所不同。然而，Ponemon Institute 发布的“2020 年内部威胁成本：全球报告”显示，刑事内部人员约占内部事件的\
  \ 23%，而 14% 是由于冒充内部人员的罪犯所致。这类攻击通常被认为是由信息安全团队来处理的问题，但请记住，软件工程团队不仅可以访问组织的知识产权形式专有代码，而且通常对可能包含敏感信息的环境拥有提升的权限。\n\
  \n内部人员的动机可能各不相同。如前所述，一些由内部人员造成的泄露是意外的。这是由于缺乏围绕信息访问的控制所致，例如缺乏适当的隔离或最小权限模型，该模型强制仅让需要的人访问。还应实施控制措施，以保证敏感数据和生产数据无法从生产环境移动到其他位置。当动机是为了对组织\
  \ perceived 的轻视进行报复时，防御变得更加复杂。然而，达到零信任类型的模型意味着你应该不幸地怀疑任何有权访问你最敏感数据的人都是恶意的，并对访问该数据提供适当的审计和保护。\n\
  \n\n\n\n\n### 2.6.3 网络罪犯\n\n根据你所在的行业，网络罪犯可能是最令人担忧的。像金融或医疗等行业的绝大多数组织，在应对网络罪犯时面临着最困难的挑战。有一样东西激励着网络罪犯：金钱。\n\
  \n正如前面提到的，有很多次，数据是新的石油。它是一种商品，组织会收集、交易和将其货币化。有一则民间传说将一句评论归于 1900 年代著名的银行抢劫犯威利·萨顿。据传说，威利·萨顿曾被问及为何继续抢银行。他的著名回答据称是：“因为钱就在那里。”\
  \ 结果证明这可能并不完全准确，根据威利·萨顿本人所述，这或许只是编辑试图显得精辟。无论如何，这句话是正确的，并且很好地概括了网络罪犯为何继续针对组织及其数据的原因。\n\
  \n他们的技术各不相同。勒索软件、DDoS、数据外泄，甚至是设备的物理盗窃。目标是获取数据，将其放到黑市上，并快速获利。他们的技术能力各不相同，但他们比前面提到的行为者更擅长从外部渗透组织。他们会使用现成的或购买的工具，或者他们可以进一步开发和定制自己的漏洞利用来针对特定实体。他们的手法更具针对性，并会寻找低垂的果实以便入侵组织。\n\
  \n### 2.6.4 黑客行动主义者与恐怖分子\n\n我并不想把黑客行动主义者和恐怖分子归为同一类别，因为他们的目标不同，但他们都受推动去公开树立某个个人或组织的榜样以推进议程。对于这两个行为者来说，这通常具有政治性质。但这就是比较通常分歧的地方。\n\
  \n黑客行动主义者会为人们或运动承担起事业，旨在实现共同目标而推动变革。他们通常是拥有高水平技能的松散个人团体。他们会寻找他们不同意的组织的网站进行篡改甚至 DDoS。他们的目标是提高对某一事业的认识，其方法会有所不同。\n\
  \n网络恐怖分子超越了政治动机，并经常会为宗教或意识形态事业而战，并据此针对组织。目标可以是个人，也可以是组织，并且经常会瞄准国家的关键基础设施，意图造成身体伤害。\n\
  \n### 2.6.5 高级持续性威胁\n\n高级持续性威胁，即 APT，最近随着俄罗斯、中国、朝鲜、以色列和美国等国家将它们的网络分歧置于公众视野中而获得更多关注。APT\
  \ 是资金雄厚、由国家支持的实体，其唯一意图是相对于对手获得战术和战略优势。这体现在它们努力获取特定行业组织、关键基础设施、军事实体等的访问权限。在大多数情况下，APT\
  \ 会潜伏等待并保持隐藏，直到命令到来为止。\n\n正如前面提到的，这些是资金雄厚的团体，是任何组织将面临的最熟练的对手。APT 通常是国家内已建立组织的分支，如情报机构或军队。它们的重点是进入另一个国家，意图制造国内混乱、摧毁军事能力或瘫痪国家的经济。\n\
  \n防御这类攻击者并不容易，最好的建议通常是做好监控和保护的基本工作。然而，罗布·乔伊斯曾领导 NSA 精英定制访问小组，其目的就是入侵对手系统，他在 2016\
  \ 年一次会议上总结了每个组织的噩梦：\n\n> 我们投入时间……去比设计该网络的人和保护它的人更了解[该网络]，”他说。“你知道你打算在该网络中使用的技术。我们知道该网络中实际使用的技术。细微差别。你会惊讶于网络上运行的东西与你认为应该在那里的东西之间的差异。\n\
  \n罗布·乔伊斯\n\n这里重要的是要强调最后的陈述。系统很复杂，在任何大型组织中，运行的应用程序和服务的数量都可能巨大。复杂的攻击者指望大型组织没有带宽、人员或工具来快速检测恶意活动。他们通常是对的。\n\
  \n### 2.6.6 为什么我们在乎？\n\n防御这些威胁行为者需要不同的技术。组织经常发现自己成为与自己无关的更广泛地缘政治攻击的受害者。尤其是当涉及到黑客行动主义者、网络恐怖分子和\
  \ APT 时。\n\n![](img/cc84747f93d290964598894b4f5c153b_56_0.png)\n\n图 2.9 威胁行为者与防御的关系\n\
  \n了解你的对手是生存的关键。知道脚本小子主要使用已识别的自动化攻击意味着你现成的扫描和保护工具通常就足够了。防御更复杂的攻击者如黑客行动主义者、网络恐怖分子、网络罪犯和\
  \ APT 意味着你的防御需要更强大，并且需要业务连续性计划以便从潜在攻击中恢复。对于这类攻击者，你需要从预防性思维转向检测和响应思维。攻击者越复杂，防御所需的资源就越多。无论攻击者是谁，安全基础都必须得到整合。扫描、修补、漏洞管理、可视性和纵深防御都是无论威胁行为者如何都必需的。\n\
  \n## 2.7 衡量风险\n\n本书并不是关于风险的，尽管它是安全软件开发不可或缺的一部分。有大量资源可帮助组织理解和平衡其风险。本节的目标是强调与组织相关的风险概念。理解这种关系将帮助应用程序所有者了解为何使用某些控制措施以及为何需要它们。这将导致更强大的纵深防御模型。如果不了解所面临的风险，你就会冒着过度纠正那些并非真正担忧的风险的风险。\n\
  \n正如前面提到的，有许多不同的方法来衡量风险。为了本书的目的，我们将使用开放式 Web 应用程序安全项目（OWASP）的方法，恰当地命名为 OWASP 风险评级方法，它允许你通过一系列步骤识别风险。它使用\
  \ 0 到 9 的数字范围为特定评级分配值。数字越低，级别越低，反之亦然。虽然这不是完美的系统，但目标是为评分安全问题创造一种手段。\n\n> **OWASP**\n\
  > 在整本书中，我们将利用 OWASP 的许多项目。当谈到应用程序安全时，OWASP 通常是大多数应用程序安全专业人士的首选。它是一个开源的思想领袖社区，构建了今天使用的许多基础安全实践。其中最广为人知的应用程序安全项目之一是\
  \ OWASP 十大 Web 应用程序安全风险。该文件记录了 Web 应用程序面临的前 10 个最具影响力的安全风险。 (https://owasp.org/)\n\
  \n使用 OWASP 风险评级方法，测量的风险归结为一个简单的等式：\n\n```\nRisk = Likelihood * Impact\n```\n\n可能性是通过询问与威胁代理和发现的漏洞相关的问题来计算的。稍后会详细介绍。这些问题的目的是揭示利用发现的漏洞的可能性有多大。在影响计算中，还有另外八个问题，旨在确定如果利用成功，组织和技术会发生什么。这将引导你得出风险的最终评级，从而让你能够优先排序并应用适当的控制措施以消除或减轻风险。\n\
  \n\n\n\n\n在深入研究 OWASP 的风险评级方法之前，有一点很重要，那就是在风险被评级后，组织可以用这些信息和风险做很多事情。\n\n### 2.7.1\
  \ 补救、缓解、接受\n\n总体而言，管理已识别风险有三种方法。第一种是补救风险。这要求组织采取纠正措施以完全实现风险消除。一个例子是应用程序面临表单劫持风险的情况。\n\
  \n**DEFINITION** Formjacking 是一种攻击，攻击者能够注入代码从 HTML 表单中窃取数据。最知名的表单劫持类型之一是名为 Magecart\
  \ 的攻击，它专门针对结账页面，通过在网站的第三方代码中注入恶意代码来窃取用户信息。\n\n这就是攻击者能够接管网站上的表单，从而注入窃取信息的代码的情况。为了补救此风险，组织需要通过工具和渗透测试进行定期测试，以识别其使用的表单被注入代码的机会。他们将监控流量并创建允许列表，仅允许向已知良好位置发出外发流量。此外，他们可能会利用子资源完整性标签（SRI）来创建应用程序使用的内容的哈希值，以便确定内容是否已被篡改。他们甚至可能进一步在不再需要时消除表单。\n\
  \n如果由于业务或技术原因无法进行补救，下一步就是通过放置补偿控制来识别缓解风险的方法。这也可以被视为降低风险，因为它可能并不能完全消除风险，而是使其发生的可能性降低并提高攻击者的门槛。在大多数情况下，缓解涉及额外的工具，如\
  \ WAF，或通过将受众限制为尽可能少的账户来缩小攻击面并密切监控这些账户。同样，补救的目标不是消除，如果这不可行，而是将攻击面尽可能缩小。\n\n最后一个选项是接受开放风险。这是一个不太理想的选项，因为它意味着组织意识到风险，但选择将其保持开放并接受它。这仍应与风险降低相结合，以使风险尽可能最小。一个风险被接受的典型例子是旧应用程序根本无法关闭的情况。这可能是因为组织未能让客户迁移到新产品或给定应用程序的新版本，但无论情况如何，组织由于业务决策需要让风险保持开放。在许多情况下，风险的接受是在业务影响较低时进行的。换句话说，企业愿意接受一次泄露，并且知道对企业的总成本会很低。\n\
  \n风险的其他方面也可能发挥作用，例如网络保险和风险转移。然而，本节的目的是涵盖组织对其创建的产品和应用程序处理风险的主要方式。\n\n### 2.7.2 识别风险\n\
  \n使用 OWASP 风险评级方法对风险的严重性进行评级的第一步是识别对应用程序或组织的实际风险是什么。这可能是由于组织的性质、使用中的应用程序类型或地缘政治因素造成的。风险不断演变，甚至可能因风险和技术变化而在不采取任何行动的情况下被消除。\n\
  \n这就是了解你的威胁行为者（对手）、完善的架构文档以及对应用程序如何部署和使用有深入了解会派上用场的地方。识别风险可以来自与组织内业务和技术人员的对话，可以由报告其识别的风险的客户显现出来，可以来自同行业合作伙伴，或可以来自内部工具。无论风险识别的方法如何，最重要的是要知道你存在风险。\n\
  \n在 OWASP 风险评级方法中，每个组件都有相关分数。分数越高，风险越高。进行风险评级时，重要的是让合适的资源参与测量。这不仅包括技术资源，还包括了解特定风险对业务和组织影响的业务资源。风险的测量可能需要几分钟到几个小时不等，具体取决于所涉及的资源和风险的复杂性。还重要的是要强调风险评级很大程度上是主观的，具体取决于所涉及的资源，很容易在关于风险的对话中陷入死胡同。一个例子是流程参与者可能对风险的感知或可用的缓解措施各不相同而产生分歧。成功的关键在于制定基本规则，随时准备好之前的示例，并让参与者保持在主题上。\n\
  \n### 2.7.3 估计可能性\n\n可能性就是识别风险可能被利用的时间。我们都熟悉驾驶车辆的统计数据以及潜在事故的可能性。尽管我们许多人都意识到这种风险，但它并不会阻止我们定期上车。这是我们愿意承担或需要承担的风险。底线是我们永远不知道事故是否会在通勤到办公室或其他地点的路上发生，甚至是否会发生，我们只是知道统计上它可能会发生。此外，某些因素会影响这一类比。我们开车的速度多快，道路上其他车辆，前往目的地的路线安全性等等。理解风险的可能性也同样适用。OWASP\
  \ 为我们提供了八个威胁行为者和漏洞的因素来帮助我们衡量可能性。与每个项目相关的分数是代表该项目影响的权重。这用于实际风险的最终计算。\n\n威胁行为者因素：\n\
  \n- Skill Level - 这个威胁代理组的技术技能如何？无技术技能 (1)，一些技术技能 (3)，高级计算机用户 (5)，网络和编程技能 (6)，安全渗透技能\
  \ (9)，\n- Motive - 这个威胁代理组发现和利用此漏洞的动机如何？奖励低或无 (1)，可能有奖励 (4)，奖励高 (9)\n- Opportunity\
  \ - 这个威胁代理组发现和利用此漏洞需要什么资源和机会？需要完全访问或昂贵资源 (0)，需要特殊访问或资源 (4)，需要一些访问或资源 (7)，无需访问或资源\
  \ (9)\n- Size - 这个威胁代理组有多大？开发人员 (2)，系统管理员 (2)，内网用户 (4)，合作伙伴 (5)，已认证用户 (6)，匿名互联网用户\
  \ (9)\n\n漏洞因素：\n\n- Ease of Discovery - 这个威胁代理组发现此漏洞有多容易？几乎不可能 (1)，困难 (3)，容易 (7)，有自动化工具可用\
  \ (9)\n- Ease of Exploit - 这个威胁代理组实际利用此漏洞有多容易？理论上 (1)，困难 (3)，容易 (5)，有自动化工具可用 (9)\n\
  - Awareness - 这个漏洞对这个威胁代理组来说有多为人所知？未知 (1)，隐藏 (4)，明显 (6)，公开知识 (9)\n- Intrusion Detection\
  \ - 利用是否可能被检测到？应用程序中主动检测 (1)，已记录并审查 (3)，已记录但未审查 (8)，未记录 (9)\n\n正如你所见，可能性因素是查看威胁行为者与漏洞的关系。组织可以利用这些信息来确定漏洞被利用的可能性如何，基于技能水平和对漏洞的了解。\n\
  \n### 2.7.4 估计影响\n\n影响在衡量时有点不同，因为它不仅仅基于技术人员可以确定的内容。影响必须利用与业务相关的信息，因为影响是衡量如果漏洞被利用，组织可能发生什么的指标。影响的一个重要考虑是，影响有两种类型。技术影响是对我们核心安全问题保密性、完整性和可用性的风险。这主要关注运行和管理我们应用程序的系统。第二种是业务影响，它优先考虑运行应用程序的业务所重视的内容，通常是财务性质的。\n\
  \n技术影响因素：\n\n\n-  机密性丧失 - 可能泄露多少数据以及其敏感程度如何？泄露少量非敏感数据（2），泄露少量关键数据（6），泄露大量非敏感数据（6），泄露大量关键数据（7），泄露所有数据（9）\n\
  -  完整性丧失 - 可能损坏多少数据以及损坏程度如何？少量轻微损坏数据（1），少量严重损坏数据（3），大量轻微损坏数据（5），大量严重损坏数据（7），所有数据完全损坏（9）\n\
  -  可用性丧失 - 可能丢失多少服务以及其重要程度如何？少量次要服务中断（1），少量主要服务中断（5），大量次要服务中断（5），大量主要服务中断（7），所有服务完全丢失（9）\n\
  -  可追责性丧失 - 威胁行为者的行为是否可追溯到个人？完全可追溯（1），可能可追溯（7），完全匿名（9）\n\n业务影响因素：\n\n-  财务损失 - 利用漏洞会造成多少财务损失？低于修复漏洞的成本（1），对年度利润有轻微影响（3），对年度利润有显著影响（7），破产（9）\n\
  -  声誉损失 - 利用漏洞是否会导致声誉受损而损害业务？最小损害（1），失去主要客户（4），失去 goodwill（5），品牌受损（9）\n-  不合规 -\
  \ 不合规会带来多少风险敞口？轻微违规（2），明确违规（5），高调违规（7）\n-  隐私违规 - 可能泄露多少个人身份信息？一名个人（3），数百人（5），数千人（7），数百万人（9）\n\
  \n### 2.7.5 风险严重性\n\n现在我们已经确定了可能性和影响因素，我们可以将它们结合起来以了解整体严重性。如前所述，每个因素的评级越高，整体风险就越高。\n\
  \n| 0 to <3 | Low |\n| 3 to <6 | Medium |\n| 6 to 9 | High |\n\n### 2.7.6 风险示例\n\
  \n借用前面提到的 formjacking 示例，我们可以做出一些假设并逐步分析一个场景。我将使用上一章中的示例组织 Superior Products。Dashing\
  \ Danielle 已获悉影响其旗舰产品之一的 formjacking 问题，该问题是由最近完成的一次内部渗透测试提出的。虽然，经过一些研究后，她知道这个问题很重要，但完成风险评级将有助于她与工程团队一起确定问题的优先级。受影响的应用程序有一个用于购买和提交评论的部分。该部分中有一个表单，用户可以在其中提供信用卡详细信息以进行购买。\n\
  \n根据这些基本信息，我们可以对威胁行为者和漏洞做出一些假设，以便得出整体可能性。对于此示例，成功攻击的能力需要中等技能，而回报则很大，形式为窃取信用卡信息。威胁行为者类别为网络犯罪分子，且普遍存在。对于漏洞本身，其可利用性取决于自动化工具不仅可以检测而且可以创建可用于攻击的脚本这一事实。目前，Superior\
  \ Products 几乎没有能力检测攻击。考虑到这一点，我们可以在下表中确定可能性。\n\n#### Table 1.2 Sample of a threat\
  \ likelihood using a formjacking attack\n\n| Threat agent factors |  |  |  | Vulnerability\
  \ factors |  |  |  |\n|---|---|---|---|---|---|---|---|\n| Skill Level | Motive\
  \ | Opportunity | Size | Ease of Discovery | Ease of Exploit | Awareness | Intrusion\
  \ Detection |\n| 4 | 8 | 6 | 6 | 7 | 7 | 5 | 3 |\n| Overall likelihood = 5.75 |\
  \  |  |  |  |  |  |  |\n\n对于影响，我们将其分为两部分。一部分是技术影响，另一部分是业务影响。查看此特定风险，由于威胁行为者可以获取信用卡信息，因此机密性丧失很高。完整性或可用性没有影响。可追责性会很困难，因为攻击者可以在不被应用程序知晓的情况下执行此攻击。对于业务影响，如果没有得到很好的检测，这可能会在很长一段时间内未被发现，因此影响会很大。虽然财务影响会很低，但声誉和合规性影响也会很高，以及可能发生的隐私违规，具体取决于将被窃取的信息。\n\
  \n#### Table 1.3 Sample of a threat impact using a formjacking attack\n\n| Technical\
  \ Impact |  |  |  | Business Impact |  |  |  |\n|---|---|---|---|---|---|---|---|\n\
  | Loss of Confidentiality | Loss of Integrity | Loss of Availability | Loss of Accountability\
  \ | Financial damage | Reputation Damage | Non-Compliance | Privacy Violation |\n\
  | 8 | 1 | 1 | 8 | 7 | 7 | 7 | 3 |\n| Overall technical impact = 4.5 |  |  |  | Overall\
  \ business impact = 6 |  |  |  |\n| Overall impact = 5.25 |  |  |  |  |  |  |  |\n\
  \n这个示例告诉我们什么？发生的可能性和影响都为中等。然而，业务影响是低的。这使得 Superior Products 可以采取这样一种方法：尽管技术影响较高，但风险成本可能低到足以让他们以不同的方式处理解决方案。Dashing\
  \ Danielle 与产品负责人和安全组织合作，将此漏洞的优先级定为低，并向适当的开发团队开具工单，其中包含他们解决所需的所有信息。\n\n拥有这种方法将使组织能够查看风险，定义补救或缓解策略，从而消除或至少降低风险，并适当优先考虑解决方案。\n\
  \nEXERCISE 使用 OWASP Risk Rating 的在线版本（https://www.owasp-risk-rating.com/）。使用网络攻击新闻报道中的一个场景。选取报道中的一个特定威胁并通过风险评级计算器进行分析。记录你的场景、最终得分以及你学到的内容。你将不得不发挥想象力来填补未知数据。这是发挥创造力的机会。\n\
  \n### 2.7.7 其他方法\n\n虽然本节的重点是 OWASP 风险评级方法，但还有几种其他知名的方法值得考虑。这里的目标并不是说哪一种更好，而是简单地说明在风险评级方法方面有多种选择。\n\
  \n另外两种值得提及的方法是美国国家标准与技术研究院（National Institute of Standards and Technology，NIST）《特殊出版物\
  \ 800-30》中的风险评估指南以及 Mozilla 快速风险评估。对于熟悉 NIST 的人来说，你会知道这是一种记录完善且全面的风险评估方法。NIST 的方法更广泛，涵盖的不仅仅是一个简单的活动，而是专注于组织整体框定风险、然后监控、评估和响应的能力。\n\
  \n**DEFINITION** NIST 是另一个为安全进步做出巨大贡献的组织。它是一个总部位于美国的组织，其任务是提供创新和技术进步。通过这项工作，NIST\
  \ 定义了许多实践，这些实践不仅用于应用安全，也用于希望提高整体安全实践的组织。（https://www.nist.gov/）\n\nMozilla RRA（快速风险评估）采用的方法与\
  \ OWASP 类似，因为它旨在具有离散性和快速性。它从这样一个角度来看待风险：即给定平台是否具有适当的安全控制来托管特定数据。RRA 的输入是一个包含服务所使用的数据类型的数据流图（DFD）。此外，还需要了解或记录服务的工作方式。从这里开始，流程类似于威胁建模（我们稍后会讨论这些），其中会对服务及其目的进行基本讨论。数据会突出显示，重点关注其存储和用途方式。然后采用系统化的方法来审查可能威胁场景，重点关注数据的机密性、完整性和可用性。完成后，会提出关于如何最好地提供保护的建议。\n\
  \n识别风险使组织能够优先考虑和框定所呈现的漏洞。这意味着组织可以专注于对他们最重要的问题产生最大影响的风险。\n\n## 2.8 总结\n\n-  CIA 三要素（机密性、完整性和可用性）是保护数据和确保系统在需要时可用所做的每个决策的基础。\n\
  -  了解潜在的威胁行为者将有助于定义所需的适当保护级别。如果你唯一的对手是脚本小子，就不需要军事级保护。\n-  随着威胁行为者的增强，攻击也会变得更强。防御需要与所要防范的威胁保持一致。\n\
  -  NIST 和 OWASP 等组织是标准和项目的优秀资源，可帮助确保你的应用程序内置安全。\n-  OWASP 风险评级方法提供了一种通过计算来定义对组织构成的风险的方法，该计算考虑了技术和业务影响以及威胁行为者。\n\
  -  风险可以得到补救、缓解或接受。每种方法都有其自身的利弊。\n\n\n\n\n\n## 3\n## 应用安全组件\n\n本章涵盖：\n\n- 构建威胁模型\n\
  - 使用开发工具缓解软件安全问题\n- 开发流水线中使用的安全分析工具\n- 运行应用程序可用的保护工具\n- 漏洞收集、关联和优先级排序\n- 错误赏金和漏洞披露计划\n\
  - 安全在 SDLC 中的位置\n\n因此，你已经看到了将应用安全集成到生命周期中缺失所导致的问题，并且你开始提出一个很好的问题：从哪里开始。没有一种适用于所有组织的万能方案。很多取决于以下因素：\n\
  \n- 组织规模\n- 行业以及影响组织的法规\n- 组织的文化\n- 组织的安全预算\n\n很容易忽视组织的文化对应用安全有效性的影响，但这是一个巨大的组成部分。如果你不能让工程组织和更广泛的组织想要变得更安全或对安全持积极态度，你就无法推动变革。将安全构建到开发生命周期中取决于组织号召工程师投身此事的能力。但组织中的人员单靠自己只能做这么多。提供合适的工具和流程对于成功的应用安全至关重要。在本章的剩余部分，我将讨论构成成功应用安全计划的几种常见工具和流程。这绝不是一个详尽的清单，每年都会出现新的工具和解决应用安全问题的新颖方法。然而，这里概述了基本工具和流程，以便你了解其在整体应用安全图景中的位置。\n\
  \n## 3.1 威胁建模\n\n已经有很多书籍写过*威胁建模*。本节的目的是让你熟悉用于执行威胁模型的不同技术和工具。\n\n**DEFINITION** 威胁建模是一种结构化的方法，用于识别、量化并解决与应用程序相关的安全威胁和风险。它是一种识别应用程序安全风险/危害的调查技术，这些风险/危害是技术性的甚至是实现特定的。威胁建模是早期阶段的活动，用于为设计定义安全需求。理想情况下，威胁建模应在架构开发的初始阶段进行。\n\
  \n**NOTE** 有助于威胁建模的额外阅读材料是 Adam Shostack 所著的 Threat Modeling: Designing for Security\
  \ https://www.amazon.com/Threat-Modeling-Designing-Adam-Shostack/dp/1118809998。\n\
  \n威胁建模是安全中最基础的部分之一。它不仅仅是应用安全的一个特定部分，而是用于工程和安全的各个部分，包括网络和运营团队。它可以简单到提出一个问题：“如果恶意用户这样做会发生什么？”也可以复杂到召集合适的主题专家来审查复杂的架构，并明确列出行动项目、要点以及相关风险和漏洞清单。\n\
  \n威胁建模的目的是识别可能影响系统或架构的潜在威胁，并定义可用于解决发现风险的对策。如我所述，它可以简单到只是问会发生什么，但更复杂的架构需要更多关注。大多数现代架构包括多个进出应用程序的外部连接。它也可能具有来自组织内其他应用程序的可重用组件。这代表了一大套经常变化的移动部件，在完成威胁模型时带来了独特的挑战，因为攻击面比更简单的架构大得多。对于这些更复杂的架构，可以使用诸如\
  \ *block architecture* 之类的工具，例如 Microsoft Visio 或其他图形工具，允许你在画布上拖放方块并绘制连线。还有专门的商业工具可用于不仅绘制架构，还帮助识别可能影响所绘制架构的风险。威胁建模最全面的方法更手动，需要花费时间和资源来白板化架构并手动识别风险。每种方法都有其优势和劣势。\n\
  \n![](img/cc84747f93d290964598894b4f5c153b_67_0.png)\n\n图 3.1 安全 SDLC 中的威胁建模\n\n\
  ### 3.1.1 基本威胁建模术语\n\n在我们实际执行威胁模型之前，你需要了解在过程中使用的一些术语。\n\n- Attacker - 那些会故意或无意地误用所考虑系统元素的个人。这可能是我之前提到的威胁行为者之一，如脚本小子、黑客行动主义者或其他人。\n\
  - Asset – 你认为具有价值且系统必须保护免受攻击者侵害的任何事物。一些物理示例是金钱和贵金属。数字示例是数据，尤其是敏感数据，如受保护的健康信息或个人身份信息。\n\
  - Threat - 攻击者可能以成功为潜在可能的方式损害资产的手段。威胁可以包括从黑客和恶意软件到地震和战争的一切。此外，在考虑威胁时，意图不是一个因素。数据中心硬盘的机械故障与攻击者的协同攻击同等构成威胁。\n\
  - Risk – 由于威胁利用漏洞而导致资产遭受损失、损坏或毁灭的可能性。在前面关于硬盘机械故障和攻击者攻击的例子中，机械故障的总体风险较低，因为架构中通常内置了冗余来管理故障，这意味着影响较小。\n\
  \n当你想要理解风险和威胁时，重要的是确保将情绪和直觉排除在外。看图 3.2 中的两个视觉效果。许多人对熊有非常强烈的反应，而把楼梯视为日常活动，但实际风险是什么？\n\
  \n#### 哪个风险更高？\n\n![](img/cc84747f93d290964598894b4f5c153b_68_0.png)\n\nvs\n\n![](img/cc84747f93d290964598894b4f5c153b_68_1.png)\n\
  \n图 3.2 – 一组完全正常的楼梯和一只灰熊。\n\n现实是楼梯比熊杀死的人多得多。平均每年有 12,000 人死于楼梯坠落。每年只有几十人被熊杀死。然而，大多数人面对熊时会因多种因素而产生即时恐惧。这与风险和安全有什么关系？当我们审视影响我们组织和软件的风险时，重要的是将风险置于适当的视角。大多数从楼梯上摔下来的人可能会带着一些擦伤和瘀伤重新站起来，而被熊攻击的极小几率可能要致命得多。被类似高级持续威胁（APT）的国家行为体攻击当然令人担忧。然而，大多数组织更应关注来自自动化攻击和不太复杂的攻击者的日常噪音。虽然这不如来自\
  \ APT 的攻击那样引人注目，但组织更可能遇到自动化攻击。\n\n现在我们了解了一些基本术语并对风险有了一些认识，让我们转向威胁建模。对于许多人来说，先看看手动方法更容易理解威胁建模的概念。\n\
  \n### 3.1.2 手动威胁建模\n\n假设一个组织确定需要识别新功能可能面临的潜在威胁和风险，该功能他们希望交付给客户。虽然威胁模型可以在开发生命周期的后期进行，但与大多数安全工具和技术一样，最大的收益来自于尽早执行此活动。成功威胁模型需要以下几个输入：\n\
  \n- 已完成的架构图和功能描述。\n- 显示数据如何在系统中流动的数据流图。\n- 软件物料清单（SBOM），提供在应用程序开发中使用的软件组件列表。\n-\
  \ Web 服务集成点，如与第三方或内部系统交互的 API 和其他 Web 服务。\n\n\n\n\n\n一旦这些项目收集完毕，工程团队、 安全团队和业务代表的成员将腾出时间，具体取决于复杂程度，可能需要数小时甚至数天。为了使这些会议尽可能有效，需要有合适的人员参与。工程代表需要熟悉整体架构以及应用程序在正常活动中的使用方式。更重要的是，他们应熟悉数据流。安全代表应了解组织最关心的哪些漏洞和风险，以及熟悉应用程序和影响所用技术栈的问题和风险。这应包括\
  \ Web 服务器、数据库、部署方法以及编程语言。业务代表应出席以帮助确定应用程序在现实世界中的使用方式，并对已识别的风险及其对业务的影响进行权衡。\n\n准备好材料后，相关人员将找一个有白板的房间。虽然这可以在使用虚拟会议技术进行远程设置时实现，但身处同一地点会更有效。在本次练习中，他们将使用\
  \ STRIDE 来识别可能影响应用程序的风险。STRIDE 是一种由微软开发的威胁建模方法（https://docs.microsoft.com/en-us/archive/msdn-magazine/2006/november/uncover-security-design-flaws-using-the-stride-approach），并在免费的威胁建模工具中使用。STRIDE\
  \ 是 Spoofing、Tampering、Repudiation、Information Disclosure、Denial of Service 和 Elevation\
  \ of Privilege 的缩写。\n\n#### 其他威胁建模技术\n\n由于 STRIDE 是今天使用较为熟悉的方法之一，我将在本书中始终使用 STRIDE。然而，还有几种其他方法可以使用，如\
  \ OCTAVE、PASTA、Trike 和 VAST。选择哪一种方法主要取决于组织和目标。\n\n像运营关键威胁资产和漏洞评估（OCTAVE）这样的威胁建模方法关注的是因数据泄露而产生的非技术风险，并由卡内基梅隆大学开发。在此方法中，资产被识别和分类，有助于定义范围。通过三个阶段，该方法制定需求，识别漏洞以及政策或实践中的差距，然后制定应对安全风险的总体策略。\n\
  \n在《攻击模拟和威胁分析流程》（PASTA）方法中，组织采取攻击者视角，然后制定威胁管理、枚举和评分流程。这可以提升到关键决策者，以确定要解决的风险，而不是在\
  \ SDLC 层级制定需求。此方法主要关注资产，尤其是缓解策略。\n\n再次，威胁建模方法有很多选择，然而 STRIDE 方法较为全面，是学习威胁建模的好方法。此外，Microsoft\
  \ Threat Modeling Tool 在对威胁进行分类时使用 STRIDE。\n\n### 3.1.3 开始手动流程\n\n组织已收集信息，召集了合适的利益相关者，并找到了一个带白板的房间，以便开始流程。虽然安全代表不必领导练习，但他们通常是最适合保持专注并确保团队朝着适当的风险努力的人。\n\
  \n除了少数例外外，此项工作没有太多基本规则：\n\n- 不要假设你的环境是安全或可靠的。硬件和软件会发生故障。攻击者会冲击你的防御。最好假设你的环境既不安全也不稳定。\n\
  - 不要假设你的环境配置正确。类似于安全和可靠，配置漂移是真实存在的，并非所有系统都配置相同。\n- 不要假设你的纵深防御能捕获一切。并非所有安全工具都得到同等应用或配置。\n\
  - 保持对话在现实场景上，而非“好莱坞”场景。想象地下组织的特工用偷来的卡车物理突破你的防御并偷走服务器很有趣，但极不可能。坚持更实际、更可能发生的场景，如硬件故障、注入攻击或权限提升。\n\
  \n在理解了基本规则后，安全代表开始在白板上作图。他们开始绘制以下几项：\n\n- 架构的简单复制，用块表示架构中不同的资产和技术。这应包括任何第三方服务。其目的是拥有一个每个人都能看到的视觉地图。\n\
  - 缩写 STRIDE，并分别写出 spoofing、tampering、repudiation、information disclosure、denial of\
  \ service、elevation of privilege。\n- 一些练习也会在白板上放一个“好莱坞”框，用于任何被认为过于极端的场景。\n- 最后是一个网格，列标题如下，并在下方留出添加内容的空间：\n\
  \n| What | Who | Why | How | Impact | Counter Measure |\n|------|-----|-----|-----|--------|------------------|\n\
  |      |     |     |     |        |                  |\n\n网格作为剩余练习的工作区。小组将开始识别风险并在标题下方填写行。标题定义如下：\n\
  \n- What：给定场景中有什么风险。这应具体，例如“数据库中的信用卡号码”。\n- Who：哪些威胁行为者可能影响“什么？”中识别的对象。这应具体，例如“有权访问生产数据库的开发人员”。\n\
  - Why：“谁”将“什么”置于风险之下的动机。例如：“开发人员想在暗网上出售信用卡号码”。\n- How：这有点困难，应避免不切实际的场景。一个合理的场景是“开发人员将生产数据复制到其开发设备上”。\n\
  \n### 3.1.4 使用链接银行账户进行威胁建模\n\n我们可以利用前几章中的例子，Superior Products 正在其电子商务网站中推出一项新功能，允许用户在应用程序中链接其银行账户，以便他们可以在应用程序内转售商品时获得付款。Superior\
  \ Products 该应用程序的安全代表 Dashing Danielle 开始从开发团队收集作为输入所需的内容。她审阅架构和数据流图以及软件物料清单，以了解应用程序的构建和使用方式。她随后就几个未决问题与开发团队跟进，然后与开发团队的首席架构师、两位正在处理该功能的开发人员以及产品负责人组织了一次工作会议。\n\
  \nDashing Danielle 开始会议时，在白板上绘制应用程序的简单架构以及 STRIDE、“好莱坞”和网格。小组同意架构完整并包含新功能的关键组件。她随后提出一个基本问题：“我们试图保护什么？”最明显的第一个答案是组织必须保护发送和存储的银行账户信息。Dashing\
  \ Danielle 在“什么”列中添加银行账户信息。\n\n| What | Who | Why | How | Impact | Counter Measure\
  \ |\n|---|---|---|---|---|---|\n| Bank Account Numbers |  |  |  |  |  |\n\n接下来 Dashing\
  \ Danielle 问：“谁会想要这些信息？”与“什么”问题类似，对“谁”几乎没有争议。显然，攻击者会被窃取银行账户号码所带来的经济利益所驱动。有了这些信息，攻击者将能够访问应用程序用户的银行账户，获取有关用户的额外信息，并可能将银行账户链接到攻击者拥有的账户。考虑到这一点，Dashing\
  \ Danielle 将信息添加到“谁”和“为什么”中。\n\n| What | Who | Why | How | Impact | Counter Measure\
  \ |\n|---|---|---|---|---|---|\n| Bank Account Numbers | Cyber-criminals | Financial\
  \ gains with the information. |  |  |  |\n\n容易的部分完成后，现在轮到小组确定攻击者如何窃取银行账户信息以及它对组织的影响是什么。此外，他们将考虑可以采取哪些对策来保护此特定攻击，以及这些对策是否已存在。如果它们已存在，则\
  \ Dashing Danielle 将在“对策”下将其划掉。\n\n\n\n\n\n这就是团队需要发挥创造力的时候。有几种方式攻击者可以获取这些信息，因此最好从更高层面的主题开始。这里有一些他们考虑的案例：\n\
  \n- 某人可能意外地，或故意地，将数据移动到开发环境中用于测试，并使用实时数据。\n- 数据可能被直接从数据库中窃取，攻击者通过在网络中部署恶意代码来获取对数据库的访问权限。\n\
  - 该应用程序可能容易受到泄露数据的攻击，例如 SQL 注入、跨站脚本或跨帧脚本。\n- 银行账户信息可能以明文形式记录到日志系统中。\n\n为本次练习的目的，团队决定首先关注攻击者利用应用程序中的弱点，通过利用跨帧脚本（XFS）来获利的能力。其他攻击机会可以在第一个之后按顺序审查。\n\
  \n| What | Who | Why | How | Impact | Counter Measure |\n|---|---|---|---|---|---|\n\
  | Bank Account Numbers | Cyber-criminals | Financial gains with the information.\
  \ | Cross-Frame Scripting (XFS) |  |  |\n\n### 3.1.5 What to do with the found threats\n\
  \nDashing Danielle 转向产品负责人，了解泄露此信息的影响，是否涉及任何可能要求公司向客户支付费用的合同条款。产品负责人承认，与数据丢失直接相关的明确财务影响确实存在，并提出了品牌损害的担忧，这可能难以克服，因为市场上存在与\
  \ Superior Products 应用程序直接竞争的其他供应商和解决方案。Dashing Danielle 还提出了与攻击相关的可能支持和恢复成本，以及可能需要为受影响的账户购买信用监控。\n\
  \n| What | Who | Why | How | Impact | Counter Measure |\n|---|---|---|---|---|---|\n\
  | Bank Account Numbers | Cyber-criminals | Financial gains with the information.\
  \ | Cross-Frame Scripting (XFS) | Financial payments to clients, credit monitoring,\
  \ support and recover costs, brand damage |  |\n\n由于团队不熟悉 XFS 攻击的具体细节，Dashing Danielle\
  \ 能够向团队描述它。在这种情况下，攻击者将使用恶意 JavaScript 在 iframe 中\n\n加载页面，意图窃取数据。可以使用多种缓解技术来防止 XFS。考虑到它类似于点击劫持攻击，Dashing\
  \ Danielle 建议以下缓解措施：\n\n- 使用 X-Frame-Options 或 Content Security Policy（frame-ancestors）HTTP\
  \ 头防止浏览器在框架中加载页面。\n- 使用 SameSite cookie 属性防止在页面在框架中加载时包含会话 cookie。\n- 在页面中实现 JavaScript\
  \ 代码以尝试防止其在框架中加载（称为“frame-buster”）。\n\nDashing Danielle 将缓解措施放在板上的“Counter Measures”下。团队讨论了这些缓解技术并审查了当前实施的代码和架构。\n\
  \n| What | Who | Why | How | Impact | Counter Measure |\n|---|---|---|---|---|---|\n\
  | Bank Account Numbers | Cyber-criminals | Financial gains with the information.\
  \ | Cross-Frame Scripting (XFS) | Financial payments to clients, credit monitoring,\
  \ support and recover costs, brand damage | X-Frame-Options, SameSite cookie attribute,\
  \ Frame-busting |\n\n在审查架构和代码后，发现应用程序已将会话 cookie 设置为 SameSite 属性设为 strict：\n\n```\n\
  Set-Cookie: CookieName=CookieValue; SameSite=Strict;\n```\n\n然而，其他缓解措施尚未实施，需要解决。产品负责人询问，提出的额外对策是否足以解决开放问题，以及攻击发生的可能性是否足够高以证明额外的努力是合理的。Dashing\
  \ Danielle 能够提供研究，显示用于攻击其竞争对手的自动化工具。产品负责人同意继续进行，Dashing Danielle 描述并记录了将 X-Frame-Options\
  \ 设置为“Deny”以及 Content Security Policy 设置 frame-ancestors 'none' 所需的步骤。Dashing Danielle\
  \ 还与开发团队合作，创建可在代码中实现的概念验证代码，以拒绝将该功能嵌入到另一个站点中。\n\n团队对与窃取银行账户号码相关的此威胁建模问题的结果感到满意。然而，他们并未止步于此，而是继续进行下一个可能的威胁。尽管手动威胁建模方法耗时，但你可以看到它可以非常彻底，特别是与我们接下来要讨论的工具方法相比。\n\
  \n### 3.1.6 Threat modeling using a tool\n\n与手动威胁建模方法一样，用于开发威胁模型也有多种工具选项。这些工具各有其优点和缺点。有些是免费的，有些是商业工具，有些甚至可以简单到使用图形工具绘制架构并标注潜在威胁。使用专门为定义威胁而构建的威胁建模工具的最大好处之一是它们会为你识别威胁，从而使这些工具在识别问题方面更高效。结果仍应与适当的利益相关者一起审查，以确保发现确实有效。\n\
  \n**THREAT MODELING TOOLS** 花点时间回顾一下用于威胁建模的可用工具。有几个商业工具，如 SecuriCad、ThreatModeler\
  \ 和 Irius Risk。然而，应用安全领域的这个角落的工具较少且成熟度较低。两个可免费获得的威胁建模工具是 Microsoft Threat Modeling\
  \ Tool 和 OWASP 的 Threat Dragon。\n\nMicrosoft Threat Modeling Tool（https://docs.microsoft.com/en-us/azure/security/develop/threat-modeling-tool）和\
  \ OWASP 的 Threat Dragon（https://owasp.org/www-project-threat-dragon/）都提供拖放项目到板上以构建架构并显示数据流的能力。从那里，每个工具都会生成架构的潜在威胁列表。下面显示了来自\
  \ OWASP Threat Dragon 的一个简单图表。\n\n#### OWASP Threat Dragon – Simple Diagram\n\n\
  ![](img/cc84747f93d290964598894b4f5c153b_74_0.png)\n\nFigure 3.3 – Simple diagram\
  \ from OWASP Threat Dragon\n\nThreat Dragon 可以将威胁放置在 STRIDE 模型中，并且对于这个简单图表，工具自动识别出两个简单威胁。一个与伪装有关，\n\
  \n另一个与否认有关。两者都在 actor 和 process 之间交互。这意味着 actor 可能冒充另一用户并可能访问其通常不被允许访问的系统组件。为了解决这个问题，应用程序必须建立一种验证用户身份并确认确实是正确用户的机制。\n\
  \n我不会介绍使用这些工具之一进行威胁建模的步骤，因为工作量与我之前描述的手动方法类似。有了工具在手，组织可以扩展威胁建模流程并集中审查和存储威胁模型。这也允许组织对可重用组件进行一次威胁建模。例如，组织中的许多应用程序可能使用相同的身份验证架构。在这种情况下，组织可以对身份验证进行一次威胁建模，并将该威胁模型用于每个应用程序。\n\
  \n以 Superior products 为例，Dashing Danielle 审查了几种商业威胁建模工具，并决定 OWASP 的 Threat Dragon\
  \ 是最适合工作和预算的工具。她创建了一个流程图和文档，指导开发人员使用 Threat Dragon。她创建了一个存储库，所有来自 Threat Dragon\
  \ 的威胁模型都将存储在其中。\n\n#### Side notes about using a threat model tool\n\n这种通过工具实现威胁建模去中心化和民主化的方式允许组织中大多数技术资源使用类似\
  \ Threat Dragon 的工具创建威胁模型。如果由应用安全资源创建，他们将与工程团队审查其模型。如果由工程团队的资源创建自己的威胁模型，则会分配给应用安全团队在存储库中进行审查。\n\
  \nDashing Danielle 开始收集 Superior Products 中使用的通用架构信息，以便她可以对这些架构进行威胁建模并确定开放威胁以便进行修复。一旦她完成对通用架构的威胁建模，她就与工程组织中的一些资源合作，评估她的发现，以确保她没有遗漏任何内容。她还讨论了发现的开放威胁的修复选项。针对在手动威胁建模会话中使用的功能，她与适当的工程团队合作，在工具中定义架构。她生成威胁并将其与手动工作中发现的结果进行比较。\n\
  \n很可能，在上面的故事中，Dashing Danielle 会发现 Threat Dragon 的发现与团队在手动流程中发现的结果之间存在差异。这是可以预期的，因为它们是两种非常不同的流程。此外，手动流程的发现往往更具体且针对架构。Threat\
  \ Dragon 中的发现会更通用。可能需要同时使用两种方法，先使用 Threat Dragon 识别整体情况，然后使用 Threat Dragon 的输出作为手动会话的输入，深入细节进行手动会话。\n\
  \n威胁建模是可以在安全 SDLC 早期使用的工具，但我接下来将介绍如何在编码时识别安全问题。\n\n\n\n\n\n**练习** 从各自的下载站点下载 Microsoft\
  \ Threat Modeling Tool 或 OWASP 的 Threat Dragon。\n\n- 1. 熟悉该工具及其导航方式。\n- 2. 创建一个与图\
  \ 3.3 中所示类似的简单模型。\n- 3. 一旦你的模型已完成，包含多个模板并绘制了它们之间的交互，就定位工具识别出的威胁。\n- 4. 花一些时间思考建议的缓解措施，并判断你是否认为它们会有效。如果不是，针对威胁会有什么更强的缓解措施。\n\
  - 5. 你可以在工具中记录你的缓解策略。\n\n## 3.2 安全分析工具\n\n在开发过程中，安全问题可能会无意中引入，也较少见地会被有意引入。这些安全问题可能涉及各种风险等级和技术影响。然而，组织不必仅依赖渗透测试和其他工具和技术来在开发生命周期的后期发现问题。开发团队可以使用大量工具，以便在问题成为生产事故之前就定位问题。\n\
  \n![](img/cc84747f93d290964598894b4f5c153b_76_0.png)\n\n图 3.4 安全 SDLC 中的扫描工具\n\n\
  在我们深入介绍可用工具之前，你应该首先知道，市场上的许多工具都是*嘈杂的*。这意味着信号之外有大量噪音，组织必须确保已降低噪音，否则就冒着工具采用失败的风险。这种噪音通常被称为*误报*，这意味着工具识别出的问题并非实际的安全问题。判断扫描工具的输出确实是安全问题还是误报，需要安全团队和开发团队付出努力。例如，工具可能会从扫描工具中识别出\
  \ SQL 注入问题。根据团队如何管理工具的结果，开发团队或安全团队将首先对问题进行初步评估，以了解它是否确实存在。如果你曾经在软件支持团队工作过，或以其他方式参与过应用程序缺陷或\
  \ bug 的审查，你会熟悉这个\n\n过程。它需要了解应用程序实际使用方式的知识，以及访问代码以跟随逻辑的能力。\n\n误报似乎只是处理问题、关闭误报并保留真阳性的事。事实是，误报对组织的影响更大。时间花在识别它们上，而不是处理其他优先事项。此外，大量误报会降低对所使用工具的信心，进而降低对安全团队的信心。\n\
  \n与误报类似，使用分析工具时也需要考虑误报。这是指工具未能识别出真阳性。假设你已将分析工具集成到开发管道中，这将使开发团队和安全团队确信问题会被识别并解决。然而，之后可能对应用程序完成渗透测试，发现了一个跨站脚本（XSS）问题。根据分析工具的不同，这本应更早被发现并解决。这就是误报的一个例子。\n\
  \n不要误会，误报可能与误报一样糟糕，甚至更糟。而误报会因需要过滤问题的[content]\n\n**练习** 从各自的下载站点下载 Microsoft Threat\
  \ Modeling Tool 或 OWASP 的 Threat Dragon。\n\n- 1. 熟悉该工具及其导航方式。\n- 2. 创建一个与图 3.3 中所示类似的简单模型。\n\
  - 3. 一旦你的模型已完成，包含多个模板并绘制了它们之间的交互，就定位工具识别出的威胁。\n- 4. 花一些时间思考建议的缓解措施，并判断你是否认为它们会有效。如果不是，针对威胁会有什么更强的缓解措施。\n\
  - 5. 你可以在工具中记录你的缓解策略。\n\n## 3.2 安全分析工具\n\n在开发过程中，安全问题可能会无意中引入，也较少见地会被有意引入。这些安全问题可能涉及各种风险等级和技术影响。然而，组织不必仅依赖渗透测试和其他工具和技术来在开发生命周期的后期发现问题。开发团队可以使用大量工具，以便在问题成为生产事故之前就定位问题。\n\
  \n![](img/cc84747f93d290964598894b4f5c153b_76_0.png)\n\n图 3.4 安全 SDLC 中的扫描工具\n\n\
  在我们深入介绍可用工具之前，你应该首先知道，市场上的许多工具都是*嘈杂的*。这意味着信号之外有大量噪音，组织必须确保已降低噪音，否则就冒着工具采用失败的风险。这种噪音通常被称为*误报*，这意味着工具识别出的问题并非实际的安全问题。判断扫描工具的输出确实是安全问题还是误报，需要安全团队和开发团队付出努力。例如，工具可能会从扫描工具中识别出\
  \ SQL 注入问题。根据团队如何管理工具的结果，开发团队或安全团队将首先对问题进行初步评估，以了解它是否确实存在。如果你曾经在软件支持团队工作过，或以其他方式参与过应用程序缺陷或\
  \ bug 的审查，你会熟悉这个\n\n过程。它需要了解应用程序实际使用方式的知识，以及访问代码以跟随逻辑的能力。\n\n误报似乎只是处理问题、关闭误报并保留真阳性的事。事实是，误报对组织的影响更大。时间花在识别它们上，而不是处理其他优先事项。此外，大量误报会降低对所使用工具的信心，进而降低对安全团队的信心。\n\
  \n与误报类似，使用分析工具时也需要考虑误报。这是指工具未能识别出真阳性。假设你已将分析工具集成到开发管道中，这将使开发团队和安全团队确信问题会被识别并解决。然而，之后可能对应用程序完成渗透测试，发现了一个跨站脚本（XSS）问题。根据分析工具的不同，这本应更早被发现并解决。这就是误报的一个例子。\n\
  \n不要误会，误报可能与误报一样糟糕，甚至更糟。而误报会因需要过滤问题的\n\n\n\n\n![](img/cc84747f93d290964598894b4f5c153b_80_0.png)\n\
  \n## Figure 3.6 – FindSecBugs in Eclipse\n\n除了显示存在漏洞的代码行外，FindSecBugs 还会提供其存在漏洞的原因以及可能的解决方案。还有大量类似的其他工具，而且正如前面提到的，大多数在安全解决方案领域的厂商，特别是在\
  \ SAST 和 SCA 领域，都拥有开发者工具。\n\n此处的目标是为开发者提供在他们将代码检入代码分支之前解决潜在漏洞所需的资源。管道中其他工具，如我之前概述的那些，仍然是需要的；然而，能够在代码离开开发者\
  \ IDE 之前捕获问题意味着对这些工具的依赖减少，因为它们在代码已经移出开发者 IDE 后才发现漏洞，并且可能减少在这些其他工具上花费用于查找和解决问题的工作量。\n\
  \n### 3.2.3 Dynamic application security testing\n\nSAST 和 IDE 集成工具是在代码的静态形式下查看代码，而动态应用安全测试（DAST）则会在环境中运行应用程序时对其进行扫描。它可以被视为由工具执行的渗透测试，因为它是一种从外部向内部进行的安全测试，尝试定位诸如参数篡改、跨站脚本、不当重定向等弱点。DAST\
  \ 工具通常由渗透测试人员用来识别正在运行的应用程序中的低垂果实，并减少渗透测试中的手工工作。\n\nDAST 工具在很大程度上与技术无关，因为它们查看的是正在运行的应用程序并尝试查找弱点。它们采用从外部向内部的方法，依赖于\
  \ HTTP 会话作为共同基础，因此不关心底层语言或框架。\n\nDAST 工具依赖于语言无关性，并且能够扫描正在运行的应用程序，从而提供在生产环境中扫描应用程序甚至不由组织拥有的应用程序的能力。尽管这两种情况都需要事先获得应用程序所有者的批准，因为这些扫描可能具有破坏性并对应用程序造成干扰。此外，与\
  \ SAST 工具相比，DAST 通常会产生更少的误报，因为许多发现是在正在运行的应用程序中识别出来的。\n\n然而，与 SAST 相比 DAST 提供的额外灵活性也有一些缺点。例如，除非应用程序已被植入探针，否则\
  \ DAST 工具将无法告诉你问题所在的代码行。稍后会详细介绍这一点。DAST 还倾向于在开发生命周期的后期运行，这意味着问题是在生命周期中更靠右的位置才被发现，而不是像\
  \ SAST 那样。可以在开发人员的本地环境中更早运行 DAST，但这种情况并不常见。DAST 也不会发现代码特定问题，例如硬编码密码。最后，DAST 的发现仍需要由安全主题专家进行分类，以确定是否为真阳性。\n\
  \n#### Open Source DAST\n\nOWASP 提供了一个开源 DAST 工具，令人惊讶的是来自 OWASP。它被称为 Zed Attack\
  \ Proxy（ZAP）。它可以免费下载和使用，是熟悉 DAST 工具的绝佳方式。你通常只需提供一个 URL，就能在几分钟内设置好对应用程序进行未认证扫描。然而，ZAP\
  \ 的真正威力在于使用经过认证的会话来爬取站点，确定站点地图，然后开始运行常见的攻击模式以报告漏洞。这是一个很好的学习工具，但许多组织也将其作为唯一的 DAST\
  \ 工具使用。 (https://www.zaproxy.org/)\n\nDAST 的另一种变体称为交互式应用安全测试（IAST）。IAST 的独特性在于它结合了\
  \ SAST 和 DAST 的优势。它通过对代码进行插桩从内部评估应用程序。这意味着供应商会提供一个库，应用程序在构建时使用该库，因此 IAST 工具作为应用程序的一部分运行。这使它能够访问代码、HTTP\
  \ 会话、库信息、后端连接和配置信息。\n\nIAST 的缺点之一是某些可用工具要求应用程序实际上受到攻击才能检测到漏洞。只要组织拥有强大的测试以实现应用程序的大部分测试，这可能不是什么大问题。未能进行这种强大的测试意味着漏洞可能在该功能被使用之前未被检测到。一个典型的例子是报告功能仅定期运行。如果这不是正常质量保证或回归测试的一部分，那么报告功能中的漏洞就有可能进入生产环境。在这种情况下，如果组织对其日志和报告功能有良好的集成，漏洞将在生产环境中被发现，从而使组织能够做出相应响应。\n\
  \nIAST 的优势在于能够很好地在 DevOps 模型中工作。我将在后续章节中介绍 DevOps，更具体地说 DevSecOps，但现在只需知道 IAST 可对应用程序进行漏洞的持续监控，并且误报率要低得多。你还可以根据时间因素定制\
  \ IAST 以专注于特定区域。这意味着你可以专注于应用程序的小部分进行测试并查看 IAST 工具的结果。\n\n不过并非全是好消息。IAST 意味着构建的复杂性增加。你集成到软件中的那个库需要定期更新，并且可能导致构建失败。这意味着工程团队需要更多开发和部署工作。正如前面提到的，IAST\
  \ 只能报告它所看到的内容。如果应用程序的某个部分未被使用，则工具将不会发现任何问题。\n\nDAST 和 IAST 是在正在运行的应用程序中发现问题的绝佳方式，可以增强安全软件开发生命周期中的整体工具链，并尝试模拟真实攻击者的行为。重要的是要记住这些工具只是纵深防御模型的一个组成部分，并不能提供所有漏洞都已被找到的保证。那如何找到用于构建应用程序但不由你拥有的软件中的漏洞呢？这就是软件成分分析发挥作用的地方。\n\
  \n### 3.2.4 Software composition analysis\n\n房子或汽车从外部看起来结构完整，看起来像一个整体。我们都知道，然而，构建最终产品使用了多个组件。其中一些是微小而隐蔽的物品，如螺丝、螺栓和钉子。其他则是更复杂的独立系统，如带有电子系统的组件，以整体套件形式出售。\n\
  \n软件也一样。实际由开发者编写的代码只占很小一部分。在大多数情况下，开发者会将库和包拉入其整体项目中以满足需求。例如，开发者不会为处理数学方程创建自己的项目，因为框架中或来自其他来源已有该库的库。这很方便，但管理整体项目中使用的库的蔓延变得困难。你如何知道所使用的库是安全的或没有违反许可使用？\n\
  \n#### Standard Dependency Structure\n\n![](img/cc84747f93d290964598894b4f5c153b_83_0.png)\n\
  \nFigure 3.7 – Example dependency structure\n\n这就是软件成分分析（SCA）可以提供帮助的地方。大多数典型的 SCA\
  \ 软件用于管理开源组件使用和许可证跟踪。SCA 工具执行：\n\n- 对应用程序代码库的扫描，包括相关工件，如容器和注册表。\n- 识别所有开源组件以帮助构建软件物料清单\n\
  - 库的许可证合规数据以及可能已知的任何安全漏洞。\n- 一些 SCA 工具还通过优先级排序和自动修复来帮助修复开源漏洞。\n\n听起来很不错。然而，使用 SCA\
  \ 工具的一个问题是它经常在库运行在生产环境后才标记该库。想象一下，你在当年一月构建并部署了应用程序，而在七月你的 SCA 工具标记你使用的其中一个库不安全。在你最初构建软件时并没有问题。情况变得更加复杂，如果要解决发现的问题，库需要你升级其他库或对架构进行更大规模的更改怎么办？另一个可能的情况是\
  \ SCA 标记的库本身并不不安全，而是它所依赖的库。\n\n> 直接依赖是指库、API 或任何软件组件导出的功能，该功能被程序本身直接引用\n\n> 传递依赖是指通过各种软件组件之间的传递性而成立的功能依赖。\n\
  \nSCA 可以在识别第三方库的潜在问题方面为开发团队带来巨大益处。然而，如果没有在短时间内提供更新库的手段，\n\n\n\n有时开发团队会明知其运行的是存在漏洞的库而陷入停滞。判断漏洞是否存在于直接依赖项还是传递依赖项可能很困难，通常需要开发团队进行调试或彻底的代码审查，以确定应用程序是否真正存在漏洞。一旦确认存在漏洞，最可能的解决方案是升级到该库的最新版本。很少能够“使库失效”，从而使应用程序不再易受攻击。\n\
  \nSCA 的另一个缺点是，其中大多数依赖于已知弱点，主要来自像国家漏洞数据库（NVD）这样的来源，NVD 通过通用语言即通用漏洞披露（CVE）对已知漏洞进行编目。这些已识别的漏洞通过各种来源提交，并提供给工具使用。你可以通过访问\
  \ https://nvd.nist.gov/ 查看更多内容，查看最新开放的漏洞、回顾旧漏洞，并按组件搜索。需要考虑的是，报告 CVE 的 SCA 工具仅针对已知漏洞，并不涵盖库中的零日漏洞。在这种情况下，漏洞尚未被报告，因此无法发布修复程序。\n\
  \n如前所述，这些都是很好的信息，但如果无法对信息采取行动，组织只能知道自己正处于易受攻击的状态。我们将在后续章节中更多地讨论 DevSecOps，但对于 SCA\
  \ 来说，这里至关重要的结论是：一旦检测到库不安全，就需要快速且明确地制定交付软件更新、更安全版本的路径。\n\nSCA 是纵深防御模型中的一个关键组件，它不仅提供安全扫描，还能帮助收集和编目应用程序使用的各种库。\n\

- pgno: 110
  md: '# 4.3.1 Threat modeling in DevSecOps


    I covered threat modeling in earlier chapters where I described the process of
    identifying threats that impact a given design or architecture with the goal of
    identifying threats that can impact an architecture as early as possible. One
    key difference with threat modeling in the DevSecOps methodology is the need to
    address operational threats early as well. This means finding threats that impact
    the code once it is deployed to a running environment. Some example threats that
    impact the operational environment are:


    +   - Lateral movement in an operational environment where a compromise allows
    the attacker to pivot to another system.

    +   - Changes to configuration after the application has been deployed that open
    the environment up to potential attacks. For instance, turning off security controls
    during a troubleshooting session.

    +   - Improper segmentation between production and non-production environments
    that lead to the ability of an attacker to compromise a non-production environment
    in order to pivot to a production one.

    +   - An attack on the any of the key resources for application security such
    as hardware security modules (HSMs), and secrets used by the application which
    potentially lead to an availability issue.


    Threat modeling is still a valid input into the development of requirements in
    DevSecOps by simply asking “what can go wrong” and “what can we do about it?”
    One of the key benefits of having operational resources assist with the exercise
    of threat modeling is that they are in the unique position of seeing first-hand
    how the application can be abused. If you ever listen in on a conversation between
    a developer of and application and a person responsible for the deployment and
    operation of that application, you will hear two different voices on how the application
    actually works. The operational resource will have a much different perspective
    on how the application is actually used by end users. Chances are, they will see
    the application being used in creative ways that were not considered by the developer
    or even the application security team. This is the power of threat modeling in
    DevSecOps. Identifying potential flaws with those that understand how the product
    works, and can be broken, will improve the quality and security of the application
    when the design decisions are being made.


    One of the hurdles with threat modeling in the DevSecOps methodology is that it
    does not react well to slow processes. As I described in previous chapters, threat
    modeling can be done through a manual process with a whiteboard and subject matter
    experts or through a tool such as Microsoft Threat Modeling Tool. Neither of these
    can feasibly be used in an environment where releases are happening multiple times
    a day. This means that threat modeling has to occur at a higher-level during design
    and architecture decisions when requirements can be outlined and integrated.


    To complete a threat model in the DevSecOps methodology, the team will engage
    in the same threat modeling process as in any other methodology. This means that
    during the design phase, while requirements are being determined, the subject
    matter experts will gather to perform a more formal threat model that takes into
    consideration the design choices being made and the impacts to the application
    based on those choices. The threat'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'model should be well documented and included in the requirements tracking tool
    or the code repository tool that the development team is using so that it is available
    for review as well as updates as new alterations are made.


    However, in the DevSecOps model, some critical decisions are being made at impromptu
    meetings in the team room or in virtual meetings. In this case, threat modeling
    is less of a formal activity and instead relies on security minded resources being
    able to think on their feet about the different issues that may impact the design
    choice that they are making. This requires security to be tightly integrated with
    the DevSecOps team. A successful approach to this is to have application security
    resources embedded in the actual DevSecOps team that can raise questions about
    the various threats that may impact a given decision. This security minded team
    should understand the following:


    +   - What are the current threats to the application based on the design choices
    and architecture?

    +   - How do these threats impact the application and are there known weak points?

    +   - What current counter measures are in place, or need to be implemented to
    eliminate the threat or reduce the risk?


    Even taking a moment to stop and ask these questions will help the team determine
    what the basic risk is on the decisions that they may be making during discussions
    that fall outside of the more formal threat modeling process. Getting to this
    point will require a culture change within the organization since it requires
    people rather than tools like the ones we’ll cover next.


    # 4.3.2 SAST in DevSecOps


    Static application security testing (SAST) is not known for its blinding speed.
    In fact, as security tools go SAST typically gets a bad rap. I’ve done my fair
    share of complaining about SAST tools, their speed, and their abundance of false
    positives. I’ve seen others liken it to the shotgun approach. Not very precise,
    but effective if you are looking for results. This can become exacerbated if the
    organization has not taken the time to properly tune the SAST tool. This can be
    a recipe for disaster. It produces a lot of results, that then need to be triaged
    and processed. What’s more, it adds a lot of time to the build process further
    upsetting the development team.


    As I mentioned, DevSecOps only works well when there is actionable information
    that can be utilized by the development team in a timely manner. Although SAST
    tools can be noisy with potential for a lot of false positives, it’s actually
    an extremely useful tool for detecting issues early in the development pipeline.
    Especially when the application security team and the products they support use
    SAST in their IDEs and tune the SAST tool per-application with specific invariant
    enforcement, anti-pattern detection, and specific issue detection.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# SAST in DevSecOps


    ![](img/cc84747f93d290964598894b4f5c153b_112_0.png)


    Figure 4.7 SAST in DevSecOps


    As you can see, integrating SAST with the intention of getting feedback to the
    developer as soon as possible provides the ability for the development team to
    respond and resolve issues quickly. As an example, one of the developers at Superior
    Products is working on a new feature and is ready to check in their code. Prior
    to doing so, the developer runs the SAST tool that is integrated into their IDE
    and scans the code for potential vulnerabilities. During the scan it is discovered
    that the developer has a potential cross site scripting vulnerability that was
    coded since the code takes input from the user through a form but does not validate
    that the input does not include script. The integrated SAST tool provides recommendations
    on how to resolve the issue and the developer confirms with Dashing Danielle that
    the recommended remediation will resolve the issue. The developer codes the fix,
    rebuilds, and rescans with a clean output from the SAST tool.


    Once the developer commits their code to the code branch, additional static analysis
    scans are performed where the entire application is taken into consideration as
    opposed to the targeted and incremental scan at the IDE level. The branch scan
    detects a possible buffer overflow that was introduced when the developers code
    was merged with another developer’s code. The buffer overflow is reviewed by Dashing
    Danielle and the team, and a remediation plan is devised. With the code resolution
    in place, the local and branch builds both successfully complete with no further
    findings from the static analysis scans.


    # 4.3.3 DAST and IAST in DevSecOps


    Once the code has proceeded through the pipeline, from the developer’s environment
    through the build process and is deployed to a test environment, it is ready for
    further security testing. One of the methods I spoke of previously is dynamic
    application security testing (DAST). This provides a look inward at the application
    and attempt to discover security issues as it runs in an environment. Likewise,
    interactive application security testing (IAST) can be used run inside the application
    and see attacks as they happen allowing the tool to observe and report on vulnerabilities.
    As you can assume, you may not want to run'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'DAST or IAST in a production environment as it has the potential of disrupting
    normal, legitimate traffic and create a production outage. However, there are
    some DevSecOps models that organizations use that allow for at least DAST to be
    run in both the pre-production and production environments.


    ![](img/cc84747f93d290964598894b4f5c153b_113_0.png)


    Figure 4.8 IAST and DAST in DevSecOps


    Ideally DAST and IAST would be run in the same testing environments that are being
    used for other testing like regression and integration testing as these environments
    should already be setup and configured for testing. One of the benefits of this
    setup is that IAST tools need to see activity in order to report on a finding.
    In other words, to uncover a vulnerability in the code, the application is instrumented
    with an agent that continuously monitors the application for incoming attacks
    and reports on the findings. Having a suite of regression tests will help the
    IAST instrumentation detect potential attacks.


    Fortunately, many IAST tools can be run even earlier in the process. Developers
    will have running application environments that are local on their machine or
    will at least have an environment where early testing can be done prior to pushing
    code to a branch. If the organization has decided to make IAST available to the
    developers in their local environment, the developer will be able run the chosen
    IAST tool in that initial environment to uncover issues prior to pushing code
    to a branch. If the organization has made the commitment to integrate IAST in
    the developer''s environment, then the developer will be able to run unit tests
    that will intentionally execute workflows that should trigger alerts in the IAST
    tool. When something is found, the developer will be able to react quickly to
    resolve the issue.


    In the pre-production environment is where more functionality has been integrated
    with the application and the IAST tool will be able to discover broader issues
    that can only be located once the code has been integrated in an environment that
    moves beyond the unit tests and begins to run integration and system tests. It
    will take additional time for the developer to resolve the issue since it would
    be found later in the process, but it is still preferable to finding an issue
    in the production environment.


    Complimentary to IAST, DAST can be pointed to an environment and run as a security
    test against that environment. Although it can be used in the development environment,
    same as IAST, it is more effective as a point-and-shoot tool in pre-production
    environments where all the code and features are integrated. Ideally, the DAST
    tool will only test what has changed in an application, perhaps a new feature,
    UI, or API. This can be accomplished using'
  merge: -1
  img_proc: true

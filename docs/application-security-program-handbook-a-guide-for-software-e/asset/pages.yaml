  img_proc: true
- pgno: 129
  md: 'application security team to make sure that the engineering team understands
    what needs to be done and provides the most amount of support they can.


    One approach to making this work is by engaging with the engineering leadership
    on a regular basis to ensure that priorities are aligned. This isn''t just application
    security priorities, but also the priorities of the product. You will not advance
    security if you are bringing only your problems and needs to the table. Listening
    to the product team and the engineering team about their concerns with security
    and their pain points when it comes to balancing security with feature releases
    will go a long way. To effectively spread security in the engineering organization
    you need to build a relationship that is developed with mutual trust and support
    in mind.


    # 5.2 Security education


    I admit that I believe in the power of training and education. I have taught undergraduate
    and graduate computer science students and have led training programs at organizations
    on application security. Training is a cheap and effective way to raise the security
    IQ of the development organization. But this goes beyond the annual training and
    handful of courses throughout the year that is usually obligatory and ineffective.
    In fact, although the vast majority of organizations have your standard security
    education in the form of phishing and social engineering training, most organizations
    do not focus on engineering security training. This is a huge gap.


    There are a multitude of approaches to bringing security education to the engineering
    teams. Each approach has its benefits and are delivered in different manners in
    order to be most effective. On-line training, just in time training, and microlearning
    can be delivered pretty quickly and efficiently to the engineer to address an
    immediate need. Alternatively, conferences, lunch and learn, and in-person training
    can be long but much more in depth.


    ![](img/cc84747f93d290964598894b4f5c153b_129_0.png)


    Figure 5.1 Security training options for a development team'

  md: 'parameters for a targeted DAST. This type of incremental scan fits well into
    the DevSecOps model.


    As I mentioned, DAST can be run in a production environment, but in most cases
    the risk of hindering production traffic is too high. Additionally, if the tools
    have been properly integrated in the lower environments and the developer’s environment,
    then the need for production environment testing is less critical. I prefer to
    avoid running testing style tools in the production environments and instead focus
    on the run-time protection tools in production.


    ![](img/cc84747f93d290964598894b4f5c153b_114_0.png)


    Figure 4.9 IAST and DAST in developer’s environment


    One additional point of DAST and IAST in the DevSecOps model is that it is necessary
    to have a feedback loop back into the developer’s collaboration and defect tracking
    tool. When this is working well the findings in either of these tools will be
    able to alert the developer of a finding. This is more critical the further right
    in the pipeline that the issue is found, like the pre-production or even the production
    environment.


    At Superior Products, the developers have the appropriate static analysis tools
    running in their environment as mentioned previously. To take their scanning tools
    and techniques a step further they integrate both DAST and IAST to ensure they
    are able to get additional security issues identified and resolved in a timely
    manner. Dashing Danielle has helped them devise a process to leverage the IAST
    tool in combination with unit tests, and other testing suites. This has been integrated
    into the developer’s local environment which provides them the advantage of only
    seeing the vulnerabilities that impact the code changes that they made, before
    the code is checked into a code branch. The tool can identify issues during the
    running of the tests and point to specific lines of code so that the developer
    has the ability to make the needed changes.


    Prior to code check-in, one of the developers at Superior Products leverages their
    IAST tool in combination with their unit test to determine whether any vulnerabilities
    are present with the new code that has been written. The IAST tool discovers that
    there are a few SQL'

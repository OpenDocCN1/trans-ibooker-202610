- pgno: 103
  md: 'The development team that works in an Agile methodology is typically small,
    and tend to be cross functional, or full-stack, where the team has ownership of
    all components of the application development and deployment. This means that
    the team will own the user interface, the business logic development, the database
    schema and development, the configuration management, the deployment, and the
    operational aspects of the application. A team that strictly follows Agile will
    follow the twelve principles in the Manifesto of Agile Software Development.


    +   - Customer satisfaction by early and continuous delivery of valuable software.

    +   - Welcome changing requirements, even in late development.

    +   - Deliver working software frequently (weeks rather than months)

    +   - Close, daily cooperation between businesspeople and developers

    +   - Projects are built around motivated individuals, who should be trusted

    +   - Face-to-face conversation is the best form of communication (co-location)

    +   - Working software is the primary measure of progress

    +   - Sustainable development, able to maintain a constant pace

    +   - Continuous attention to technical excellence and good design

    +   - Simplicity—the art of maximizing the amount of work not done—is essential

    +   - Best architectures, requirements, and designs emerge from self-organizing
    teams

    +   - Regularly, the team reflects on how to become more effective, and adjusts
    accordingly


    Agile focuses more on individuals contributing to the greater good, than relying
    on technology and processes to bring software to a reality. This leads to quicker,
    and sometimes more impactful, decisions being made at the lowest level within
    the develop team. The teams are empowered but also reap the consequences should
    something go wrong. For instance, a poor design decision made by one developer,
    could impact the rest of the team when it comes to support.


    How does security integrate in the Agile methodology? Similar to the DevOps methodology,
    Agile allows for quick development and deployment of fixes for security vulnerabilities.
    These found vulnerabilities can be triaged by the application security team, presented
    to the Scrum team for prioritization, and worked in a future sprint. This means
    that, in theory, a fix for a security issue could be in production within a few
    weeks. Shorter if the issue is severe enough. Where there are some potential issues
    is getting security vulnerabilities prioritized and understood by the development
    team and the product owners. There will almost always be pushback especially when
    timeframes are short and client features need to go out. However, similar to Waterfall,
    the Agile team may have a separate Scrum team that is responsible for resolving
    defects found in production and potentially picking up security issues as well.
    When there is a separate work stream like this it allows the development to continue
    unimpeded while support and security work would be merged into the development
    branch or released as its own fix pack.


    # 4.2.3 Lean


    Lean has been in practice for over decades going back to the early automobile
    assembly lines in order to streamline processes, optimize people and resources,
    and more importantly'

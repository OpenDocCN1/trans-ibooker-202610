    # 4.2.4 DevOps supports security better


    DevSecOps, SecDevOps, DevOps with Security, it’s been called many things. I’ve
    mostly heard it referred to as DevSecOps, so that is the term I will use here.
    Like the parent term of DevOps, the DevSecOps definition can depend on the process
    and technology.


    > **DEFINITION** IBM defines DevSecOps as automatically baking in security at
    every phase of the software development lifecycle, enabling development of secure
    software at the speed of Agile and DevOps.


    The methodologies I covered previously each provide a means for security to be
    integrated, however the DevOps methodology provides a unique opportunity for security
    to be more rapidly combined with other features in the development pipeline. As
    described, DevOps, and by extension DevSecOps, allows for development teams to
    have security fixes deployed to a production environment as quickly as the CI/CD
    pipeline can support.


    In today’s environments, where your applications are running, security issues
    are ever present. In early 2021, Redscan released a report that reviewed the trends
    in vulnerabilities that were added to the National Vulnerability Database (NVD)
    from 1989 to 2020. This report highlighted how much has changed over that time
    and specifically how 2020 was a banner year for new vulnerabilities. The report
    found the following:


    +   - More security vulnerabilities were disclosed in 2020 (18,103) than in any
    other year to date – at an average rate of 50 CVEs per day

    +   - 57% of vulnerabilities in 2020 were classified as being ‘critical’ or ‘high
    severity’ (10,342)

    +   - There were more high and critical severity vulnerabilities in 2020 than
    the total number of all vulnerabilities recorded in 2010 (4,639 including low,
    medium, high, and critical)

    +   - Nearly 4,000 vulnerabilities disclosed in 2020 can be described as ‘worst
    of the worst’ – meeting the worst criteria in all NVD filter categories

    +   - Low complexity CVEs are on the rise, representing 63% of vulnerabilities
    disclosed in 2020


    What does this tell us about what we are up against in application security? Vulnerabilities
    are being released at a rapid pace and they are becoming easier to exploit. This
    means that in order stay ahead of significant issues, application security needs
    to be able to move swiftly as well. With this in mind, the methodology that the
    engineering organization has decided to use matters. For instance, in the Waterfall
    methodology, waiting possibly weeks or even months to release a resolution to
    a found vulnerability would leave the organization exposed much longer than necessary.
    Even in an Agile organization, a fix might be weeks away. Pretty fast, but not
    fast enough for an attacker that might already'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'have code that exploits a CVE that was just publicly released. Attackers today
    can take information from a CVE and turn it into an exploit within hours.


    This is where a methodology like DevSecOps can support the rapid deployment of
    security fixes. A well-tuned pipeline should allow, depending on the vulnerability,
    for a fix to a security issue to be deployed within hours assuming that the application
    security team has a well-defined process for triaging and assigning found vulnerabilities,
    and the DevSecOps team has the ability to pull in code changes, test, and deploy
    in a rapid manner.


    ![](img/cc84747f93d290964598894b4f5c153b_107_0.png)


    Figure 4.5 DevSecOps process diagram


    There are several key practices to keep in mind when building security into a
    DevOps pipeline.


    +   - Security issues are no different than any other software defects. In fact,
    they should be indistinguishable from software defects considering that vulnerabilities
    are essentially a software defect that has security implications. Consider a defect
    like a memory leak in a software program. This can be leveraged by an attacker
    to consume the resources on the server and make the application unavailable. However,
    even without the security considerations, this is still an application issue that
    impacts the performance.

    +   - Automation of security should be a priority. Just like there are automated
    tasks within the CI/CD that run tests, perform deployment, and run checks. Security
    should be no different. In this case, the running of SAST, DAST, SCA, infrastructure
    code configuration checks, and the like should be made part of the CI/CD with
    feedback to the development team.

    +   - Once the previous step is integrated in order to ensure that security is
    an automated part of the CI/CD, the findings in those tools need to be presented
    to the development team as early as possible and enabled to block the build from
    completing successfully and deploying vulnerable code. This last point is critical.
    Code should not be allowed to continue to a production environment with known
    vulnerabilities. Just like the failure of a regression test would stop the build
    from progressing.

    +   - Once the application is deployed to a production environment, it is important
    to continue to monitor it for security related issues. As I mentioned previously,
    things like insecure third-party libraries are of a constant concern and can be
    introduced after the code is deployed to production. If everything goes well in
    the CI/CD and there were no found vulnerabilities with the developed code, that
    still doesn’t mean that a third-party library that is used by the application
    would always be secure.'

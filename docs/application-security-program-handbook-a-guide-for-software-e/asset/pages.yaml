- pgno: 85
  md: '# 3.3 Penetration Testing


    One thing about the tools that I just covered is that they will never replace
    a good old fashion penetration test. These are performed by highly skilled researchers
    that are skilled at finding ways into a system and application. They are not limited
    to the confines of the rules that govern the tools that we previously talked about.


    EXERCISE Do a quick search for a job description of a penetration tester. The
    range of skills needed is quite impressive. Not only do you need to have technical
    abilities, but you will also be able to perform social engineering and physical
    security testing. It’s no surprise that these jobs are in high demand.


    ![](img/cc84747f93d290964598894b4f5c153b_85_0.png)


    Figure 3.8 Penetration testing in the Secure SDLC


    There are several types of penetration tests. At the high level there are penetration
    tests that occur from an internal team, like a red team within the security organization.
    There is also a penetration test that can be coordinated with an external party.


    DEFINITION Internal penetration testing is completed by a team inside the organization,
    often referred to as a red team, who are employed at the target company. This
    is a team/group that has other duties at the company but is engaged for a period
    of time to target a specific system/application. External penetration testing
    is an external party that is engaged to test the system/application. The scope
    is defined, and the party is given a timeframe for completion.


    Which testing path the organization goes depends on a few factors. In many cases,
    the organization is not staffed to support a full or part time, internal penetration
    testing team which makes it difficult to complete internal testing. Additionally,
    the organization may be required for compliance, or contractual reasons to complete
    a penetration test from an external organization. Most organizations will opt
    for the external source of penetration testing which allows them to pull a vendor
    in when needed. Regardless of the direction, there are several high-level approaches
    to penetration testing:'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'DEFINITION White box testing is where the organization provides information
    about the system to the tester. This can include code, credentials, network maps
    and other system information. Black box testing is where the organization provides
    little to no system information. This resembles a typical attack where the information
    that can be gathered is generally only public information. Grey box testing is
    the in-between state. Some information is offered, but it is limited to just essential
    information.


    Each of the approaches can be used whether it is an internal or external test.
    The outcome is more important. For instance, in a black box test the tester is
    given no information to start with, which will closely mimic an outside attacker.
    This is much harder to achieve with an internal team given their alignment within
    the organization. This testing tends to be more closely associated with a grey
    box test where the attacker has some, but not all information. Most testing that
    is done through an engagement with an external vendor, or with the internal team,
    is a white box test. Especially if the output from that test is used to meet an
    obligation such as compliance and contractual agreements. There is no right answer
    on which is best. Each type needs to be considered against the goals of the organization.
    However, as mentioned, white box testing tends to be more for compliance and black
    box is generally more for a true understanding of the security of the application
    and organization.


    The great thing about penetration testing is that the findings tend to be true
    positives that are actionable considering it was found by a simulated attack.
    However, in the case of white box testing, the true external security controls
    may not have been in place. For instance, it may be required that to exploit a
    particular vulnerability, that the attacker would need access to an elevated account.
    If that elevated account information was given to the attacker at the time of
    the test, which is well within the parameters of a white box attack, this means
    that a true attacker would need to compromise that account. Perhaps there is good
    privilege access controls and multi-factor authentication that are associated
    with that account and therefore the risk is very low.


    Other benefits of a penetration test are that they can be scoped to specific areas
    and time. This means that you can request that a test only focus on a particular
    feature for a set amount of time, like 24 hours. The penetration test can also
    be used in combination with other security methods like threat modeling and scan
    reports. Providing this information to the penetration tester will help them cut
    down on steps and provide them a map to weaker areas of the application so that
    they may be able to focus their time and effort there. Additionally, some of the
    work that was done in your threat model can then be verified through the penetration
    test, like the security controls that you described as being in place to mitigate
    a found threat.


    # 3.4 Run-time protection tools


    Where the tools and processes that I talked about before are geared toward identifying
    vulnerabilities and risks, there are tools that are used to provide protection
    against application-level attacks during run-time in a production environment.


    Run-time application security protection (RASP) is a security technology that
    uses runtime instrumentation to detect and block computer attacks by taking advantage
    of information from inside the running software. This will sound very similar
    to IAST where the tool has the ability to see into the application and watch attacks
    as they happen. There is not'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'a lot of difference between RASP and IAST with the exception that RASP functions
    as a runtime protection tool and IAST is focused on observing and reporting on
    found vulnerabilities.


    RASP technology can improve the security of software by monitoring its inputs,
    and blocking those that could allow attacks, while protecting the runtime environment
    from unwanted changes and tampering. RASP can also prevent exploitation and possibly
    take other actions, including terminating a user''s session, shutting the application
    down, alerting security personnel and sending a warning to the user.


    Another common tool used to provide runtime protection is a web application firewall
    (WAF) or sometimes referred to as application security manager (ASM). A WAF is
    an application firewall for HTTP applications that applies a set of rules to an
    HTTP conversation and analyzes bi-directional web-based traffic. Generally, these
    rules cover common attacks such as cross-site scripting (XSS) and SQL injection.
    When the WAF recognizes a pattern that looks malicious it will either report or
    block the attack depending on the configuration. Most WAF vendors also offer protection
    against robotic attacks (bots) like DDoS. This is largely a volumetric protection,
    by many vendors are becoming savvier by including machine learning and artificial
    intelligence to be more proactive in its overall protection against bots and other
    abusive behavior.


    # Web Application Firewall (WAF) Flow


    ![](img/cc84747f93d290964598894b4f5c153b_87_0.png)


    Figure 3.9 WAF integration with web servers


    This is similar to RASP in the spirit of blocking malicious traffic. However,
    where RASP is typically run within the application itself or on the same host
    system, WAF can be cloud-based or otherwise external to the application. Most
    organizations today are moving to a cloud-based solution for WAF so that they
    have a managed platform for protection and a much faster adoption path. WAFs may
    come in the form of an appliance, server plugin, or filter.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '![](img/cc84747f93d290964598894b4f5c153b_88_0.png)


    Figure 3.10 Runtime tools in the Secure SDLC


    These protection tools, whether WAF or RASP, help the organization by providing
    the runtime reporting and blocking when an attack is discovered in real-time.
    The drawbacks are few and simple. The tools need to see something happening in
    order to report or block so they cannot provide any information to the development
    team so that they can prevent a vulnerability from going out in the first place.
    There is also the very real potential for one of these tools to block legitimate
    traffic. There are plenty of scenarios where a customer may be using the system
    within the parameters and still trigger an alert or a block. Especially when volumetric
    types of activity are detected like running large batch jobs.


    Another consideration when running any of these protection tools is that the rules
    that govern these tools need to be well vetted and managed. Both WAF and RASP
    require rules to be configured that tell the tools what to look for and what to
    do when it sees something that has been configured. For instance, if the WAF sees
    an HTTP conversation that includes patterns matching a SQL Injection attack, should
    it alert, or block. If it alerts, where does the alert go and what is the expected
    action. If it blocks, what is the user experience. Taking the out-of-the-box rules
    that come with the tool are often too broad and will alert on everything that
    it sees. Most organizations are not prepared for the flood of potential alerts.
    Additionally, some behavior that looks suspicious for one application may be completely
    legitimate for another. The rules for these tools must be well understood, tested,
    and managed between the application security team and the application development
    team.


    # 3.5 Vulnerability collection and prioritization


    All the tools have been integrated, and you are successfully running penetration
    testing. Great! You now have, most likely, a ton of vulnerabilities to process.
    Each from a different tool, found in a different part of the process. You may
    not even know whether they are true positives or false ones. In most organizations
    you are running at least 2-3 of the tools that I discussed. For instance, the
    organization is probably running a SAST, SCA, and DAST tool at the least. Others
    might be running just a SCA, DAST, and a WAF. Some may be running all of them.
    Each of these can be noisy if they are not properly tuned to the organizations
    needs and processes. Additionally, the may each have their own user interface
    with a dashboard of some sort. This means that the development and security team
    will have to log in to multiple tools just to get the vulnerability information
    that they need.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# 3.5.1 Integrating with defect tracking


    In order to be effective at managing vulnerabilities the first thing that most
    organizations will do is integrate the security tools with their defect tracking
    tool. That might be Jira, or Bugzilla, or something else, but in any case, this
    will allow the developers to see the vulnerability information as it becomes known
    from the various scanning tools in the organization. For instance, the DAST tool
    that is integrated with the testing environment may detect a vulnerability when
    the developer''s code was deployed to the testing environment. This DAST tool
    can then call an API with the defect tracking tool and open an issue to either
    the application security team to triage, or directly to the development team to
    resolve. Which one depends on the confidence of the security tool that detected
    the vulnerability and the maturity of the organization.


    Opening defects on teams will help get the organization to resolution on the open
    vulnerabilities but being able to have visibility in to the all the open vulnerabilities
    across an organization can be challenging. There are usually different defect
    tracking tools being used unless the organization has tried to standardize. This
    means that the application security team cannot necessarily rely on building a
    dashboard in a single defect tracking tool. Often the application security team
    will build their own dashboards that pull information from the different defect
    tracking tools, or the security analysis tools that are being used. The application
    security team is then on the hook for managing this dashboard and enhancing it
    along the way as technology changes.


    Assuming that the organization has access to a centralized dashboard that shows
    the various open vulnerabilities, the hard part becomes apparent:


    +   - How do you get these vulnerabilities closed?

    +   - How do you prioritize the vulnerabilities?

    +   - Who owns the vulnerabilities?

    +   - What if the vulnerability cannot be closed?

    +   - Is there enough information for the development team to provide mitigation?


    These are all questions that each application security team faces when the begin
    to review the open vulnerabilities. One of the most critical questions above is
    regarding ownership. Software is complex and is pieced together by several different
    components as I discussed earlier. When a vulnerability is found, for instance,
    in a specific part of an application, it is often difficult to locate the team
    that has developed that code. This is especially true where an organization has
    something like a team that develops common components that are leveraged by most
    of the applications in the organization. The application security team needs to
    have an inventory of the applications in the organization as well as resources
    to contact that are responsible for resolving found vulnerabilities. This may
    be not just the engineering leader for the application like the technical manager,
    but also the project manager and even the product owner. Both of the later resources
    typically maintain the control over what gets worked on in a given timeframe,
    not the engineering leader.


    # 3.5.2 Prioritizing vulnerabilities


    Before even being able to request that the engineering team tackle a vulnerability,
    it’s important to ensure that they organization has clear direction on timeframes
    for resolution.'

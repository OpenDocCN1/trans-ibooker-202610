- pgno: 4
  md: '# 1


    # Why do we need application security?


    This chapter covers:


    +   - Current state of application security

    +   - Going right or going left

    +   - Breaches as a result of insecure applications

    +   - The cost of inaction


    Every company uses software to function. Whether they are a Fortune 500 technology
    company or a sole proprietor landscaping company, software is integral to businesses
    large and small. Software provides a means to track employees, customers, inventory,
    and scheduling. Data moves from a myriad of systems, networks, and software providing
    insights to businesses looking to stay competitive. Some of that software used
    is built within the organization or it is purchased and integrated. What this
    means is that every organization, regardless of size and industry, has a software
    need. It enables organizations to move quickly and stay ahead of their competition.
    In the United States, the growth of software in various industries including finance,
    sales, human resource, and supply chain has seen a steady increase with that trend
    continuing. Over the next decade these industries will see a steady increase of
    market size. For instance, in 2020 the market size of nearly 390 billion USD in
    the global business software and services. This is expected to have an annual
    growth of 11% from 2021-2028. This expansion is based on the increasing need for
    automation and processing solutions in nearly every sector on the economy.


    The shift to software driven organizations can be seen in several prominent examples.
    Movies were rented at a physical store before Netflix began streaming them in
    2007 directly to your television. Books were purchased in a shop before Amazon
    upended not just the book buying experience but the overall retail market for
    any item you can think of. It used to'
  merge: -1
  img_proc: true
- pgno: 5
  md: 'take a phone call to order food, now a mobile app allows you to not only order
    your food but track it from the restaurant to your front door. Moreover, software
    is used in all parts of the supply chain for every organization. Leaders in these
    organizations can get real-time updates on product as it moves around the world
    and to their customers hands. This isn’t a nice to have any more for organizations
    but is critical to any organization’s ability to compete.


    > "In short, software is eating the world" Marc Andreessen.


    Each new piece of software brings new capabilities but also new challenges, especially
    when that software is available over a network where it is open to a wide audience.
    More capabilities mean more software. More software means more data. This data
    is intended to assist an organization and its customers to gain insight into the
    services the organization offers. However, the additional software and data means
    more opportunity for bad actors to leverage weaknesses that might exist. Data
    is a lucrative target for attackers and difficult for organizations to protect
    especially when the organization collects a large amount of it. By the beginning
    of 2020, the amount of data created worldwide had reached 44 zettabytes and this
    is expected to reach 463 exabytes by 2025.


    The increasing software landscape and the repository of data growing every second
    offers a target rich environment for malicious actors looking for a way in and
    access to the data. There is constant background noise of malicious activity that
    pervades the internet. The moment that any software becomes available online,
    it is immediately probed and prodded. Some of that activity is from automated
    tools that will then alert when it finds software that can be compromised. Some
    of it is from bad actors waiting for the latest vulnerability to become public
    so they can hunt the internet for applications that are vulnerable to it and create
    exploitation software. Other activity comes from well financed bad actors that
    are simply looking for any weaknesses so that they can gain a foothold in an organization
    in order to come back later for exploitation. If ever there was a more fitting
    metaphor for software on the internet, it would be the Wild West of the early
    United States where lawlessness was rampant, and sheriffs were often overwhelmed
    and outgunned by the range of activity.


    Software, data, attackers, oh my! When organizations don’t take software security
    seriously, they run the risk of not only putting their client’s data at risk,
    but the organizations future as well. Most organizations that are not in the software
    building industry will often say that they are not a prime target, or that their
    data is not interesting to an attacker. They would be wrong. Almost all data that
    is collected and processed by an organization can be used and misused by an attacker.
    Nothing is too unimportant. And although many large organizations can weather
    a data breach, smaller companies often cannot while remaining in business.


    It is often said that data is the new oil. Mining, processing, and selling data
    is a lucrative business both for the organizations that do so openly and the malicious
    actors who are looking for ways to profit off an organization’s missteps. Building
    security into the software from the start is the first, and primary, step to ensuring
    that organizations have the means to protect their software, their data, and their
    livelihood.'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# 1.1 The role of an application security program


    Application security is the implementation of security through practices, tools,
    technology, people, and processes in the development lifecycle. The rest of this
    book will cover how application security is used throughout the development lifecycle
    to ensure that an organization has reduced the risk posed to its software and
    has done so in a way that does not impede an organization’s ability to deliver
    that software in a timely manner. It is important to know that there is never
    a silver bullet to solving security issues. No one tool, process, or person can
    claim that as attacks are constantly evolving and technology keeps moving. However,
    ensuring that you have a robust approach to application security that includes
    not just the fundamentals of an application security program but also the ability
    to adapt and evolve your approach on an ongoing basis is what sets apart a good
    program from a bad one. This is what we will discover throughout this book.


    Products start as an idea in a client or someone at an organization’s head. Transferring
    that idea from concept, to paper, to minimum viable product, to a production application
    takes a team of people from multiple disciplines to bring it to life. Most will
    think first about all the developers, testers, and product people that go into
    making a successful product, but what about those that make the product secure?
    The goal is to not just make a product that does what the customer wants, but
    also is free from defects and security issues that would otherwise devalue not
    just the product but the organization as a whole.


    # 1.1.1. Security from concept to production


    The Software Development Life Cycle is defined differently in every organization,
    but in general, every organization has a similar path from concept to production.
    Figure 1.1 depicts a standard software development lifecycle, where:


    +   - The client or product owner envisions a new feature or enhancement.

    +   - Use cases and requirements are developed. The team determines where to slot
    the work for an upcoming release.

    +   - The development team then makes decisions on how the requirements will be
    implemented through technology choices. Development begins and the code is integrated
    into a feature branch.

    +   - The feature is then moved to a lower environment like a test or staging
    environment where tests can be performed. The product owner will accept the results
    of the test and agree to have it released to production for the clients to use.

    +   - The feature is released to clients and the organization manages the feature
    as a set of a larger application through client and technical support. Eventually,
    the feature is decommissioned in favor of a new release.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '![](img/cc84747f93d290964598894b4f5c153b_7_0.png)


    Figure 1.1 Phases of an SDLC


    In the first step, the product may already exist in which case the client would
    request an enhancement or a new feature. For instance, perhaps a new method of
    accessing reports within the application, or a new dataset to be available in
    the user interface. Otherwise, the product owner may be collecting information
    from several clients and put in an enhancement request for a new feature. In either
    of these cases an organization will gather the client needs in the form of use
    cases. A simple use case could be written as:


    > "As an administrator I want to be able to create weekly reports that show the
    application usage among users in my organization."


    This is a simple use case for an application that is SaaS (software as a service)
    based and is used by many organizations to provide some service. The details are
    not important in this case as every organization is different regardless of the
    industry they are in. In most cases, a feature would include multiple use cases.


    Once the client or product owner has the use case defined this is then reviewed
    with the development leaders of the product. The architects, lead developers,
    and operational members of the development team review the use cases and determine
    the feasibility of the request.


    This brings the use case to the next step in the process where the functional
    and non-functional requirements are defined. Like having multiple use cases, each
    use case can have numerous requirements. Following is a functional and non-functional
    example of requirements for the previous use case:


    > Functional: "Application shall provide the ability to create a report of application
    usage by user."

    > Non-functional: "Report creation shall be available to only administrators."


    This is not a book on writing requirements, but a simple explanation is that functional
    requirements describe what the feature should do, and non-functional requirements
    are how the feature should do it. Most information on requirements describe security
    as a non-functional requirement. However, it is not uncommon to find security
    features being described as functional requirements, especially as it comes to
    things like encryption, authentication, and access.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# 1.1.2. Where does application security program


    The product owner will take the defined requirements and decide with the development
    team what priorities might need to shift and when delivery dates are for the new
    feature. There is something missing so far. Where are the people, tools, and processes
    that bring security into a product? As mentioned, security is typically a non-functional
    requirement. However, those non-functional requirements should not be left up
    to the product owner and the development team to determine on their own. A more
    mature organization would bring in the application security team to not just review
    the use case and requirements, but also define security requirements that should
    be in place as part of the feature development. If the product team defines their
    requirements, and begins coding before engaging the application security team,
    they run the risk of creating security issues that are more difficult to resolve
    once the feature is nearing completion or ready for release. For instance, a development
    team may know that they need to provide authorization and may decide to develop
    an internal solution to manage the authorization without looking at a more fitting
    solution that is used across the organization and is more industry aligned like
    OAUTH.


    Fitting security in during the initial phases is done by taking industry and organizations
    standards and best practices and building them in to the process of creating requirements.
    For instance, using industry guidance on encryption would lead to setting requirements
    on key management and encryption strength. Or the organization may have standards
    that require the development to adhere to certain architecture or regulatory requirements
    like using a specific analysis tool. Additionally, when building these requirements,
    the team will take inputs from items like threat models, and risk assessments
    to further develop requirements that align to the business requirements so that
    security can be built into the process as early as possible. We will discuss threat
    models and risk assessments more in depth in future chapters.


    # 1.2 The current state of application security


    As mentioned, application security is the implementation of security into a development
    organization. The reality is that application security teams, if they exist in
    an organization at all, are often external to the engineering teams they work
    with. They can be found under an enterprise-wide function like the enterprise
    architecture organization, or under a broader security organization. The last
    one is the most typical. These application security teams will bring in tools,
    processes, and people to identify software vulnerabilities that are then backlogged
    for remediation. These vulnerabilities are found through several opportunities,
    including the following:


    +   - Through the tools that are provided to engineering by the application security
    team.

    +   - Through external or internal penetration tests completed by the application
    security team or an external vendor, respectively.

    +   - Through identified issues from clients, or other external sources like a
    bug bounty program, or vulnerability disclosure policy. More on these in later
    chapters.


    If the application security team and the organization are considered mature, these
    vulnerabilities, when found, will block builds. You can see how this can cause
    issues between'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'the engineering team that is working toward a release of code and is suddenly
    stopped by tools and processes that have been put in place by an external team.
    Blocking a build is by far the most preferred method for an application security
    team that wants to ensure a secure product, but this can become an instant point
    of contention. In less mature organizations a process is in place to allow the
    engineering team to continue with their build and deployment as by having the
    found vulnerability backlogged for future resolution.


    The application security team is in regular competition with feature release.
    Every new release brings new features. New features bring new defects. New defects
    bring new security vulnerabilities. As mentioned previously, in some cases these
    vulnerabilities can break a build and block the release of a feature. However,
    most organizations will prioritize their feature release over a nebulous vulnerability.
    I will discuss this more later, but many scanning tools are noisy and produce
    results that are not easily consumed by developers. Furthermore, not all application
    security teams are great at translating results from tools and other tests into
    something that is understandable by engineering without having a meeting or work
    session to understand. This obviously doesn’t scale well in large organizations.


    The security issues are backlogged with an I-owe-you to address the issue in a
    future. But every new release brings more vulnerabilities to the growing backlog
    and the cycle continues. Most organizations will take a systematic approach to
    reducing vulnerabilities such as focusing on only the high and critical ones,
    or ones of a certain type like SQL injection or cross-site scripting. Other organizations
    may focus on the riskiest vulnerabilities based on product capability and exposure
    like a financial organization processing sensitive account information. Some organizations
    may even take the approach to have a "security release" where their focus is on
    resolving a large number of security issues in a single release. These different
    methods help reduce vulnerabilities in burst but don’t address the overall issue.


    Like Jacob Marely from the Charles Dicken’s ‘A Christmas Carol’ story, these vulnerabilities
    become chains that weigh down the development team and will eventually haunt an
    organization. The continued accumulation of vulnerabilities adds to what is called
    security debt where an organization continues to add new vulnerabilities to the
    old ones that were already existing. This security debt increases the risk level
    of the product being developed and the organization that is selling it. Eventually
    one, or several, of those vulnerabilities will lead to an exploitation of the
    application by a bad actor. This is similar to the concept of technical debt that
    builds when an organization takes a quick and easy path to getting features to
    their customers instead of choosing more sustainable design choices.


    Further complicating the job of the application security team is the fact that
    they are often brought in too late in the development process. Usually, it is
    once the feature or product has gone through several design and architectural
    decisions. The code development may have already been well underway, or worse,
    nearly complete by the time the application security team has been involved. This
    means that many "one-way" decisions may have already been made and it is up to
    the application security team to provide some blessing of the design and code,
    or identify mitigations for discovered threats. This is not the case everywhere,
    but in a sufficiently large organization, this will happen. If the application
    security team has had the opportunity to provide guidance, requirements, and security
    tooling early in the process, potential vulnerabilities can be reduced. Unfortunately,
    the cases where the application security team is involved early are few and far
    between, despite it'
  merge: -1
  img_proc: true

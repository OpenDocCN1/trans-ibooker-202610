- pgno: 135
  md: 'the organization that are outside of security to attend security conferences.
    However, many engineering-oriented conferences usually run a security track. These
    tracks are great considering that they are normally on topic for the specific
    conference. For example, if the conference is specific to deployment technology
    and methodologies, you’ll see the security track cover the security of infrastructure
    code and the running environment.


    # 5.3 Standards, requirements and reference architecture


    Tools and training can provide some reasonably good security controls by alerting,
    defending and teaching. However, building a house first requires a good blueprint.
    That blueprint needs to be built on solid guidance, historical evidence, heuristics,
    and best practices. Translated to the software development business this means
    having a solid foundation built on standards, requirements, and architectures.
    These should come from:


    +   - Input from the industry that the organization is in like healthcare or finance

    +   - Input from the broader security industry that apply to the organizations
    services

    +   - Input from within the organization based on previous discoveries and learnings


    However, writing standards, requirements, and architecture is only the first step.
    Getting buy-in requires structure.


    # 5.3.1 Creating and driving standards


    In many organizations you will find a group that is dedicated to ensuring that
    the organization is following a body of standards. This often is driven from an
    enterprise function, like the enterprise architecture team if it exists, but can
    also be from a Center of Excellence (CoE) or a Community of Practice (CoP). Regardless
    of where the direction comes from, having a central group that defines standards
    for the organization helps establish the foundations needed to build security
    in early. Often organizations will take the approach of running what’s called
    an architecture review board (ARB) to drive standards and best practices across
    the organization. This team is commonly decentralized and spans several domains
    with experts in each domain. Every organization is structured differently so the
    domains may vary by name and practice, however, the guiding principle here is
    to ensure that representatives that have a vested interest in ensuring that the
    organization has a common approach to building solutions and provide the appropriate
    leadership and oversight at the domain level while using domain expertise to create
    and validate architecture.'

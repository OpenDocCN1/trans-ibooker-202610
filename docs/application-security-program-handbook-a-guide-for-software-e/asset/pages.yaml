    | What | Who | Why | How | Impact | Counter Measure |

    |---|---|---|---|---|---|

    | Bank Account Numbers | Cyber-criminals | Financial gains with the information.
    | Cross-Frame Scripting (XFS) | Financial payments to clients, credit monitoring,
    support and recover costs, brand damage | X-Frame-Options, SameSite cookie attribute,
    Frame-busting |


    After reviewing the architecture and code, it was recognized that the application
    already sets its session cookies with the SameSite attribute set to strict:


    ```

    Set-Cookie: CookieName=CookieValue; SameSite=Strict;

    ```


    However, the other mitigations are not in place and require a resolution. The
    product owner asks whether the proposed additionally countermeasures will be sufficient
    to resolve the open issue and whether the likelihood of an attack is high enough
    to warrant the additional effort. Dashing Danielle is able to produce research
    that shows automated tools that are used to attack their competitors. The product
    owner agrees to proceed, and Dashing Danielle describes and documents the steps
    that are needed to set the X-Frame-Options to "Deny" as well as the Content Security
    Policy setting frame-ancestors ''none''. Dashing Danielle also works with the
    development team to create proof of concept code that can be implemented in the

- pgno: 2
  md: '# welcome


    Thank you for your interest in this book *Application Security Program Handbook*.
    This book is intended for developers, architects, and leaders that are looking
    to understand the purpose and benefit of building security into the development
    lifecycle. Although you don’t need to be a developer, having an understanding
    of how code is developed and delivered to production will make the content easier
    to understand.


    I have been working in application security for nearly a decade and have seen
    the successes and failures in organizations that are fighting the good fight of
    delivering secure software. Although the fundamentals of application security
    haven’t changed much in that time, the tools, processes, and technology have.
    The threats have changes, the attacker’s techniques are getting more robust, and
    the risks to organizations have grown. Organizations need to change with them
    and develop the framework that enables them to build security in from the start.


    My desire for this book is that it will show how application security is applied
    in organizations and where it can provide the most amount of assistance in delivering
    secure software. The book is made up of three sections that take the reader through
    an effective application security program. The first section is dedicated to what
    are common application security practices and technology that you find in an organization.
    The second section dives more into how application security is evolving to meet
    the current demands of rapid development. This includes how application security
    should be developed as a service and not as the gated exercises. The last section
    will focus on delivering application security in an organization and measuring
    success.


    I appreciate you picking up this book and my hope is that it brings you an appreciation
    for what it takes to deliver secure software in today’s complex systems. Please
    be sure to post any questions, comments, or suggestions you have about the book
    in the liveBook discussion forum. Your feedback is essential in developing the
    best book possible.


    -Derek Fisher'
  merge: -1
  img_proc: true

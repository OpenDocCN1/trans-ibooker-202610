    The application security team has a unique opportunity to augment the training
    approach of the organization. This is the team that is seeing the daily activity
    across the organization and knows where the organization is most vulnerable. This
    gives the application security team the ability to take the information they have
    to formulate more specific training for the engineering organization. Take for
    example if the organization is seeing SQL injection vulnerabilities consistently
    appearing in scans and penetration testing. The Application Security team can
    provide training for the engineering organization that focuses on SQL injection.
    Taking it a step further, if the vulnerabilities are frequently coming from one
    development team, they can provide specific training just for that team. This
    doesn’t have to be a significant investment of effort. An hour or two with the

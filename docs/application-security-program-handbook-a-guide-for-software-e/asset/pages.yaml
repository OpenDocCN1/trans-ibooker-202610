  md: 'development team has seen a reduction in new vulnerabilities being introduced
    in their code. A win-win for all parties involved.


    # 5.6 Summary


    +   - Security is not just an activity that security teams are responsible for.
    Each team has a responsibility to ensure that they are considering the security
    implications of the design choices they make.

    +   - Security teams are not able to scale to meet the demands of security in
    any sufficiently large organization. This raises the need for more security minded
    individuals in the organization.

    +   - Security education is not just for security teams, developers and those
    who support the development process can and should take advantage of security
    training. This raises the security IQ of the organization and helps spread the
    knowledge.

    +   - Training comes in many different forms, and can be microlearning, traditional
    classroom training, conferences, brownbag sessions, and others. A mix of some
    or all of these will help the organization raise the security awareness.

    +   - Standards, requirements, reference architecture are methods to create content
    that can be leveraged by the development teams which helps to decentralize the
    application security function.

    +   - Maturity models can be used to determine where your organization is today
    and where you want to take it. For maturity models like BSIMM, you can measure
    your organization against similar organizations in the same industry. This is
    helpful when you need to understand where others are placing their efforts.

    +   - A decentralized application security model depends on having well trained
    individuals that are prepared to address security concerns for their area. This
    is commonly solved through a security champion’s style program that builds security
    minded individuals into the development teams.'

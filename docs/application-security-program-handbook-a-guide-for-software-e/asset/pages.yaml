    # 5.2.3 It’s more than just training


    Training doesn’t have to be boring. Something as simple as an hour presentation
    on a security topic once a month goes a long way. Some organizations call this
    a lunch-and-learn or a brown-bag session. These can provide a quick and interactive
    method of discussing security topics that are relevant to the organization. What
    is most effective with these types of sessions is when they are led by people
    from the engineering organization that are working on something that has security
    implications like the following:


    +   - New authentication or session management framework being developed in an
    application

    +   - A technology change that requires a different security model

    +   - Applying encryption using a new database technology

    +   - Secure messaging for clients


    The engineering team can be nudged by the application security team, but it’s
    an even bigger win when the engineers bring topics to one of these talks. The
    goal is to bring topics that the rest of the organization can learn from. What
    did they encounter when developing the new feature that might cut down on the
    churn for others? What makes the new feature a better security model than previously?
    When it comes from a peer team in engineering the other teams are more likely
    to welcome the conversation and take advantage of the retrospective, especially
    if the technology stack is the same or similar.


    When such an event cannot be coordinated with the engineering organization, the
    application security team should take advantage of the time to bring in new topics
    that are important to the security of the organization. For example, a change
    in the industry that requires support from engineering, like the retirement of
    insecure standards, is a prime topic to be discussed in this forum. The application
    security team can also use this time to present what other similar organizations
    are doing the provide better security. For instance, if the organization is in
    the healthcare space the application security team can bring in topics related
    to new regulations that impact the security and privacy of the data that the organization
    collects.


    The application security team should also look to bring in speakers that are external
    to the organization if appropriate. It’s one thing to have an engineering team
    or the application security team discuss certain security topics, but an entirely
    different thing if a speaker from the industry presents a topic that is relevant
    to the organization.


    Conferences, meetups, and other forums are also a good source of security information
    for the engineering organization. As security leaders, we should be encouraging
    members of'

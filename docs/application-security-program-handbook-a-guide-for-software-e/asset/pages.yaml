    using the code base that the engineering team is working in.


    # 5.2.2 Microlearning & just-in-time training


    Microlearning is by no means a new concept but it has been taking off in the past
    few years. The goal is to break down larger training into quick bite-sized training
    that is easily consumed by the intended audience. Although there is no real measuring
    stick on time and size of the microlearning it is commonly less than five minutes
    long. This allows the learner to understand a distilled concept and take away
    the key points in a short period of time.


    This type of learning works well in the DevSecOps model that I covered previously.
    The fundamental goal of microlearning is to provide quick learning while the learner
    is performing their job. A great example would be if a developer has coded a SQL
    injection vulnerability identified in through their SAST tool that is integrated
    into their IDE. In this case they can take a quick microlearning module that describes
    the impact and remediation of SQL injection vulnerabilities. This provides enough
    information to the developer to understand the issue and provide a remediation
    that resolves the vulnerability.


    Microlearning doesn’t have to be video based, it can be delivered in other mediums
    like blogs, e-learning, games, podcasts, and infographics. How this works in your
    organization really depends on the culture and the learning habits of the engineering
    teams. It also depends on the content that is being taught. Something that is
    complex in nature may'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'require a hands-on activity like a game or interactive learning, whereas something
    a bit simpler might be well received with just a short read or infographic.


    Microlearning also works well when it is used as a refresher or a reinforcement
    of concepts that were taught in longer form training. The organization may have
    more formal annual training that is used to teach core concepts, but microlearning
    that is targeted to specific topics that were covered in the formal training can
    be sprinkled throughout the year to help reinforce those topics. This is especially
    helpful when it ties in resources that the organization maintains like documentation.


    When considering an approach to microlearning the organization should consider
    the following:


    +   - Find the optimum length and delivery mechanism. As mentioned, microlearning
    can be delivered in more than just a video format.

    +   - Ensure that the approach has support from the organization and the leadership.
    This will ensure that it is not considered as an optional training but is instead
    considered part of the overall education of the audience.

    +   - Make sure that the training has clear objectives and that there is an approach
    to measuring success. This could be as setting an objective to reduce a certain
    type of vulnerability in a particular development team. This can be measured by
    tracking net new vulnerabilities of that type.

    +   - Considering mixing up the delivery methods so that the training doesn’t
    become repetitive and stale. This means that not every microlearning on a topic
    like cross-site scripting needs to be an infographic. Have several options including
    a hands-on option.

    +   - Keep metrics on the microlearning like frequency, most visited, and who
    is accessing. This will help with making improvements over time.


    One of the most critical aspects of microlearning is that it is delivered and
    available at the right time. As I mentioned previously, you want to be able to
    reinforce good habits when the bad habits are being identified. If you cannot
    integrate with your developers’ IDE to link out to a microlearning module, then
    look to your organization’s learning management system (LMS) or collaboration
    environment to host the content. The important thing is to make sure that when
    an issue is found, the developer has access to resources that will provide them
    guidance.



  img_proc: true
- pgno: 104
  md: 'eliminate waste. When the Lean concept was introduced to the world of software
    development its purpose was to focus on reducing waste and maximizing value to
    deliver quality products quicker. It was not surprising to see development practices,
    thereafter, leveraging both Lean and Agile to optimize software development practices
    in what is commonly called Lean Agile. There are 5 key principles that lay the
    foundations of Lean.


    +   - Defining value – This is what the customer is looking for and is willing
    to part with their money to get.

    +   - Map the value stream – Identifying the tasks and components that make that
    value a reality. Those that do not add value are wasted motions.

    +   - Creating flow – This is where impediments are removed, and the process is
    defined well enough to ensure that the value stream is smooth.

    +   - Establish pull – This is where the work in progress is reduced while ensuring
    that just enough is being done for a smooth flow of work. The goal here is to
    eliminate context switching which is ineffective.

    +   - Pursue perfection – This is reducing overall waste and always looking for
    process improvement by asking questions around the efficiency of the current process.


    These key principles can be applied in various fields and practices including
    software development. It may not be surprising that many people adopt Lean practices
    even in their daily lives for non-technical practices.


    Since the introduction of Lean Agile, the software development practice has been
    able to reduce rework and waste by replacing Waterfall development in many organizations.
    This would increase the ability to deliver marketable features quicker and continue
    to improve the development practice along the way. The Lean culture not only allows
    teams to continue to improve but creates a culture where discovering ways to become
    more valuable for the collective team becomes an acceptable practice.


    Today most mature software development teams are practicing Lean Agile as an inherent
    byproduct of the two methodologies combined. Lean software development principles
    incorporate the original Lean and Agile principles by:


    +   - Identifying and eliminating wasteful steps and practices.

    +   - Build in quality through paired programming and test automation.

    +   - Encourage knowledge sharing practices with other team members.

    +   - Defer commitments and plans without having full knowledge of scope/plan/work.

    +   - Deliver faster with targeted scope and features.

    +   - Embracing and respecting people’s opinions/input/feedback for continuous
    improvement.

    +   - Optimizing the whole by seeing the bigger reward and not focus solely on
    one function or one practice.


    In software development, reducing waste means focusing on the most needed requirements
    that are the most marketable and consumable for the users. In addition, leveraging
    Lean also supports the concept of having a full stack team where the team includes
    not only the core developers, testers and project managers but environments, network,
    and security resources as well. These specialized roles are also included to ensure
    delivery of the product at the highest value.'

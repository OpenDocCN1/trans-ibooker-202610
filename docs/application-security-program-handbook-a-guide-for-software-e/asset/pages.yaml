  md: 'newly discovered vulnerability that needs to be resolved quickly. Waiting for
    the next release cycle for a critical or high vulnerability to be resolved is
    unlikely to win over any fans.


    Although Waterfall can create latency in the process of releasing software, the
    lines for injecting security in the process are pretty clear. Need to get security
    requirements in? Do that during the early phases. Found a vulnerability after
    the code is in production? Open a ticket with the support team. What happens when
    the process is kicked up another notch?


    # 4.2.2 Agile


    Agile is another methodology that allows for development teams to deliver software
    to clients. However, in this case the process is continuous and has the intent
    of getting software to the client often and quick. Agile methodology is typically
    associated with Scrum and Kanban frameworks where there are short iterations and
    clear work items outlined for a given timeframe.


    ![](img/cc84747f93d290964598894b4f5c153b_102_0.png)


    Figure 4.3 Agile process diagram


    Agile methodology focuses on delivering software quickly through collaboration
    within the organization as well as with the client. Agile is also able to adapt
    to changes without impacting the delivery of software, hence the name. Unlike
    Waterfall that requires a more structured approach to intake of new requirements,
    Agile allows for changes to be integrated in a short period of time. If the development
    organization is using something like Scrum in their Agile methodology, the development
    team would work in sprints that are a short burst of work over two, three, or
    four weeks. The goal in a sprint is to complete some minimal viable product by
    the end of that sprint that can be delivered to a client. In most cases, a two-week
    time period for code release will not provide enough time to release a large change,
    but a small viable proof of concept on a feature is possible. This can then be
    delivered to an environment for clients to "touch and feel" and provide their
    feedback.'

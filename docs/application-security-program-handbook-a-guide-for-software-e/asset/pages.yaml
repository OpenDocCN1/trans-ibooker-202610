  md: 'organizations spend 5-15% of their IT budget on security. The bulk of this
    spend goes to security operations and perimeter defense tools like a security
    information and event management (SIEM), network detection and protection, firewalls,
    and others. The application security team typically gets a small portion of that
    budget that is mostly dedicated to personnel.


    Despite spending most of their budget on personnel the application security team
    can never scale to the size needed. However, this is not the biggest problem facing
    the application security team. It’s actually very difficult to hire the people
    you need. There has been a term that has been used a lot in the industry called
    “negative unemployment.” This means that there are more jobs open than qualified
    people to fill them. To be clear, this is not just application security, but across
    the board in security like analyst, network security, information security specialist
    and others. This means there are millions of jobs left unfilled in security. Those
    of you reading this book that work in security know exactly what I’m talking about.


    The reality is that application security resources are even more difficult to
    locate than other personnel in their peer groups. Generally, you are looking for
    someone that has not only security expertise but also development experience.
    Your best bet is to find someone that has been a developer and gained an interest
    in security. The importance of finding someone that has development experience
    cannot be overstated. Someone with this background brings the following to the
    team when they join:


    +   - Understands the development pipeline

    +   - Can interpret code and perform code reviews

    +   - Understands the overall development process

    +   - Can speak the language of the development team


    Having these qualities as well as an understanding of security will be an asset
    to any application security team. This allows them to take vulnerabilities that
    impact an application and be able to interpret this issue in a way that is understood
    by the development team. For instance, a prototype pollution issue may have been
    discovered through a DAST tool and assigned to be triaged by the application security
    team. These issues can be complex to describe and walk through with the engineering
    team if the application security member cannot describe how prototypes works in
    JavaScript. Having a background in development means that the application security
    person can at least describe the issue, how it impacts the application and help
    develop mitigations. More importantly, when the development team makes the claim
    that the vulnerability does not impact them, which they will do, then an application
    security person who knows development will be able to determine whether the impact
    is real.


    You can see how these types of hires can be hard to find. With a constrained budget,
    and a small pool of resources to hire from, the application security team will
    struggle to find the right people that can deliver security to a development organization.


    Organizations can also make it difficult on themselves when they don’t have a
    good job description or even job title for what they are looking for. An application
    security architect is different than a solution architect. A security engineer
    is different than a security analyst. Even worse, some organizations will have
    their own internal titles that may map to industry'

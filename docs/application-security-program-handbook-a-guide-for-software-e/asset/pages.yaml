    A defect is opened, the team is alerted on their collaboration tool and the developer
    is visited by Dashing Danielle who spends time outlining the purpose of the IAST
    tool and the benefits to the organization who is not only more secure but has
    saved potential costs related to detecting and resolving the vulnerability in
    production.


    In this pre-production environment, Superior Products has integrated their DAST
    tool as well to uncover additional issues. The DAST tool will complement the IAST
    tool nicely where findings from IAST rely on indirect testing of the application
    to provoke a finding, the DAST tool will crawl the entire application and send
    attack patterns to weak areas of the site to test whether an attack would be successful.
    The results from the DAST tool will be less precise than the IAST tool leading
    the development team to work with Dashing Danielle to triage and discover duplicates
    from the IAST tool. In this instance, the DAST tool identified a potential buffer
    overflow issue when the DAST tool overwhelmed one of the inputs through fuzzing.
    The development team worked with Dashing Danielle to identify whether this issue
    was discovered in the IAST or other tools in the DevSecOps pipeline. However,
    once the duplication review and triaging of the issue is complete, the development

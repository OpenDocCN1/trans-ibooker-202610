- pgno: 130
  md: 'With a well-rounded approach to security education, the organization begins
    to build the ecosystem that supports a more security minded engineer. This is
    a cost effective, and scalable approach to reducing the burden on an often-small
    application security team and ultimately raising the awareness of security in
    those that are responsible for writing code.


    # 5.2.1 Raising the security IQ


    Creating a culture of secure engineering is a multipronged effort, but it starts
    with effective training. Some examples of training that can be done on a periodic
    basis in the organization include the following:


    | Self-paced training online | There are a lot of options for online training
    platforms. Some are more general training platforms that offer courses in various
    disciplines. Others are specific for security like awareness or secure engineering.
    |

    | Instructor led training | Depending on the organization, there may be a learning
    and development team that can run training. However, much of this will be training
    that is specific to the organization, and most of the times will not be security
    related. If the organization is looking specifically for security training, they
    will need to leverage a third-party company that can come on-site to perform the
    training. |

    | Application Security led training | The Application Security team can also provide
    training to the engineering organization both online and in person. One of the
    benefits of this is that the Application Security team can focus on known issues
    within the organization to focus on. However, this requires the Application Security
    team to maintain the training and keep it relevant. |


    Each of these are effective means of delivering security education to the engineering
    organization. There are varying costs in terms of budget as well as time. For
    example, online training through a third-party platform can be expensive, especially
    if you are paying per user. But you’re able to quickly roll it out to a large
    audience simply by assigning it to engineers. In-person training led by a third-party
    can be expensive per person and doesn’t scale well. When you compare it to the
    costs of an online platform, in-person training is highly focused and the opportunity
    to ask questions and follow up with the instructor adds a benefit that is often
    not there for online training. Many organizations will take the approach of having
    training where the targeted in-person training is done infrequently and specific
    to a core group, and the online training is open and available to the wider organization
    to take advantage of on-demand.'

    this information, Dashing Danielle is able to put the ARB at ease on the required
    change and the impact to customers. With this hurdle overcome, Dashing Danielle
    brings the standard to review and approval in the ARB where it becomes a formal
    standard that is now required to be adhered to by January 1, 2022, by the products
    within the organization.'

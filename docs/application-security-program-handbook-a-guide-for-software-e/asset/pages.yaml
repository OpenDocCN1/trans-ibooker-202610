    members of the ARB and leadership in the organization to make sure that it remains
    a priority in the organization.


    Although this is a simple illustration, the reality is that this would most likely
    be a much larger project in most organizations led by a project manager with all
    the stakeholders involved. The purpose of this illustration is to show how external
    pressure from the industry can lead to the creation of a standard, and the process
    to get that standard approved and eventually realized by the organization.


    **EXERCISE** Take a look at your organization and think about an area that lacks
    standardization. Some of the easy ones are around encryption, technical debt,
    versions of protocols, or even use of certain software. Draft a standard that
    would address the gap. If your organization is ready for it, take it to the ARB
    or equivalent. If your organization does not have an ARB, bring it to your engineering
    leadership for review.


    # 5.3.2 Creating reference architecture


    The ARB described in the previous section has another function as well. This is
    to review and approve architecture that should be implemented across the organization.
    This doesn’t mean that all architecture designs need to go through and be approved
    by the ARB, it means that architectures that have broad impact or can bring savings
    to the organization should be reviewed and built with consensus. A well-devised
    ARB addresses architecture decisions to provide the following benefits to the
    organization:


    +   - Scalable education to stakeholders and architects on new standards, architecture,
    and strategic direction.

    +   - Communication channel to deliver documentation including the boards decisions,
    metrics, and current projects

    +   - Review of high impact projects that are business critical, and impact architectural
    quality and alignment


    With these benefits in mind the organization leverages the ARB to approve of cross-business
    critical architecture that has a business impact. This is often called *reference
    architecture.*'

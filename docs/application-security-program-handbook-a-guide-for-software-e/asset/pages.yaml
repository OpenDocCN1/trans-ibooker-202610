- pgno: 30
  md: '# 2

    Defining the problem


    This chapter covers:


    +   - Defining the security tenants that software needs to adhere to

    +   - Identifying and understanding risk that impacts software

    +   - Overview of security in the software development life cycle


    In the previous chapter, I used the example of building a house without the locks
    on the doors and windows. Using a house is a great example as it allows you to
    think about the controls you use to limit your risk of the house being compromised
    due to break-in, fire, flooding and so forth. We spend most of our time in security
    attempting to limit risk and counter threats, not eliminate them. Risk and threats
    can never be eliminated. Similar to a house, you can’t eliminate the risk of fire,
    flood, or a break-in we can only detect and respond.


    **Risk**

    Risk is the potential for loss of an asset or damage to an asset.


    **Threat**

    Threat is the activity that takes advantage of a weakness in an asset.


    Example: In the case of a house fire, the fire is the threat, the house burning
    down is the risk.


    Whereas fire, flood, and break-in are risks that impact a house, our software
    has a different set of threats and risks. These range from the physical to the
    digital. Yes, physical threats exist that impact our software, a flood in a data
    center would be a physical risk to our running application.


    In this chapter we will not dive into the various specific methods of protection,
    but rather outline the different places where our software and data need to be
    protected and some best practices to be on the lookout for.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# 2.1 The CIA Triad


    There are three basic tenets in security that all protection mechanism that we
    integrate into our systems and software will come back to. It’s commonly referred
    to as the *CIA Triad*. This stands for Confidentiality, Integrity, and Availability.


    +   - Confidentiality – Protecting data and only allowing those that should have
    access.

    +   - Integrity – Data is known to be correct and trusted.

    +   - Availability – Systems and data should be available when requested by a
    trusted entity.


    Most people in the security field are pretty familiar with these concepts, but
    I will provide further definition here to provide common ground for future topics
    in this book.


    # 2.2 Confidentiality


    Perhaps the most important security design consideration you can make when developing
    software is *confidentiality*, where you are designing the software to provide
    optimal protection of data. The reality is that this is much more difficult than
    it sounds. As I mentioned, data is the new commodity. This means that it is everywhere.
    Software may be processing data that it is not the custodian of.


    **Data custodians are responsible for the collection, processing, storage, and
    implementation of business rules related to the data.**


    Some data is transient, some data is not persistent in a system and reside in
    memory for only a period of time. Figure 2.1 uses a simple data flow diagram (DFD)
    to show you how data moves through your system and others.


    Data flows through an example e-commerce site


    ![](img/cc84747f93d290964598894b4f5c153b_31_0.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'In Figure 2.1, once the customer completes an order, a series of other processes
    will coordinate with the payment company, process the order, and store the data.
    At each point, the protection of that data is paramount. Especially if it is sensitive
    data like payment information. Today, we have methods to protect this information,
    primarily through encryption at rest when it resides in a database or other system,
    encryption in transit as it moves over the network, and encryption in use as it
    is processed in memory. These methods allow us to provide some protection of data
    as it traverses our systems, and in some cases even the services that your software
    sends data to.


    # 2.2.1 Data protection policy


    The first step an organization needs to take in order to maintain data protection
    is to create and maintain a policy that clearly outlines what data must be encrypted.
    Most organizations will call this their data protection policy and will define
    what data needs to be protected but will not get into the how aside from a high-level
    direction. The data defined in this policy will follow the organizations data
    classification scheme (more on that later) and call out that data must be encrypted,
    and access is limited to only required personnel. Most policies will additionally
    include the following:


    +   - Clear definition of what must be done at each location that data can reside
    such as file system, end user devices, databases, and others.

    +   - Definition of the encryption key lifecycle such as creation, distribution,
    and destruction.

    +   - Define algorithms for hashing and encryption.

    +   - Auditing of access to encryption keys.


    Once this policy is established, the organization can get to the business of mapping
    encryption standards and architecture to this policy but must give thought to
    two primary considerations when developing these standards and architecture:


    +   - Although encryption provides extra protection, there is additional time
    that is incurred when you need to access a key, encrypt data, and send it along
    its way. This latency is usually measured in milliseconds, but for critical applications
    this additional time needs to be considered.

    +   - The system must also ensure that it is resilient enough to be able to overcome
    an outage that may occur due to the encryption keys being unavailable, or a failure
    in the encryption or decryption process such as the cryptographic service being
    offline.


    This adds an additional layer of operational complexity and potential exposure
    to an availability issue and must be considered.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# EXERCISE


    Go through the assignment on Symmetric Encryption and get familiar with the way
    a single key can be used to encrypt and decrypt data:


    https://www.khanacademy.org/computing/computers-and-internet/xcae6f4a7ff015e7d:online-data-security/xcae6f4a7ff015e7d:data-encryption-techniques/a/symmetric-encryption-techniques


    Go through the assignment on Public Key Encryption to get familiar with key generation
    as well as encryption and decryption using a key pair:


    https://www.khanacademy.org/computing/computers-and-internet/xcae6f4a7ff015e7d:online-data-security/xcae6f4a7ff015e7d:data-encryption-techniques/a/public-key-encryption


    # 2.2.2 Data at rest


    One of the first steps to protecting data at rest is to recognize that you have
    a problem— a data inventory problem. Put simply, data inventory is the ability
    to know where data is located in an organization. During a security incident,
    an organization needs to be able to know what data may have been compromised and
    whether there is a risk related to the data that was compromised. Is it critical
    client information that was on that database that was just breached? If this can’t
    be answered then there is a gap with understanding where the data is and what
    the nature is of that data. Review figure 2.1 again: Do you know what is happening
    to that information that is passed between your application and the payment company?
    Do you know whether they are sharing data with others, knowingly or not? Do you
    or the consumers of your application have a policy that disallows developers to
    copy data from a production environment to a lower environment? If so, is it enforced?


    These examples are not intended to frighten, but to bring awareness to the fact
    that data is everywhere and that the first step in securing this data is to get
    an inventory. For smaller organizations, this can be done by keeping a catalog
    of data, location, and classification in a spreadsheet or database. More on classification
    in a bit. For larger organizations, a tool may be more appropriate that can actively
    scan for data, classify it based on the organization’s rules, and provides reporting
    and dashboards to track the organizations overall data. However, regardless of
    how you identify your data, there is still fundamental steps in order to have
    a robust data inventory, including the following:


    +   - Create an inventory, using an automated tool or the manual process described
    previously.

    +   - Data inventory needs to include all data, structured and unstructured, across
    on-premise, cloud, and third-party locations.

    +   - De-duplicate the data and ensure accuracy.

    +   - Ensure that the inventory is maintained and kept up to date through the
    tools and processes used to initially gather the data.


    Although there are tools available to assist with collecting a data inventory,
    creating this inventory is more of an organization and process problem than a
    technology problem. In lieu'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'of a tool, one method is through surveys or questionnaires that are used to
    determine the type, classification, and location of the data. These questionnaires
    are simple in nature and should be completed by the data custodian who is responsible
    for the technical implementation and maintenance of data within the system. Each
    organization should create their own survey that attempts to determine the type
    of data that is moving through the system and should focus on the sensitivity
    of the data that aligns to classification that the organization uses. They are
    also responsible for ensuring that this survey is kept up to date as the architecture
    changes. Below is a sample of what a questionnaire might contain.


    | Does the application retain payment card information? | Y/N | If yes, list the
    locations where the data is stored. | Data encrypted at rest? |

    | Does the application retain social security numbers? | Y/N | If yes, list the
    locations where the data is stored. | Data encrypted at rest? |

    | Does the application retain protected health information? | Y/N | If yes, list
    the locations where the data is stored. | Data encrypted at rest? |


    If your organization is like many large organizations today, there will be a data
    lake or data warehouse that is a single location for most of your structured and
    unstructured data that all of the organization’s applications can leverage. This
    certainly makes things much easier when attempting to locate and classify data
    considering that it is centralized and easier to apply tooling or processes to
    collect where sensitive data is located. In fact, many cloud providers offer the
    ability to automatically identify and classify data through the services they
    offer in their ecosystem.


    NOTE Macie is a service offered by Amazon Web Services (AWS) that uses techniques
    like machine learning and artificial learning to detect sensitive data in AWS.
    Currently it has some limitations on where it can find data within its services,
    but this is expected to improve over time.


    However, there will always be legacy systems that are disconnected from the data
    lake, and applications that need to maintain local copies of data in order to
    operate. It is hard to imagine any large organization having their data exclusively
    in a central location. Which means that the organization will still have to rely
    on questionnaires or on-premises tools to located and classify data.


    Regardless of how an organization inventories data, they then need classify it.
    This allows the organization to provide the appropriate level of protection based
    on the classification of the data. Although it varies depending on the industry
    and needs most organizations will have four ways that they classify data.


    # Table 1.1 Basic data classification in most organizations'
  merge: -1
  img_proc: true
- pgno: 35
  md: '| Column heading | Column heading |

    |---|---|

    | Public | This is freely accessible to anyone including individuals that are
    external to the company. An example might information in a marketing release.
    |

    | Internal | This information is intended for just individuals internal to the
    organization. This doesn’t classify the access based on role, the individual just
    has to be a part of the organization. This could be communications regarding business
    plans. |

    | Confidential | This is information that is sensitive and requires authorization
    to access. For instance, certain data that is in an internal database like social
    security, or account numbers would not be accessible to everyone in the organization
    and is limited to those that require access. This should be a very limited audience.
    |

    | Restricted | This is critical information that could lead to severe damage to
    the organization should it be released. This is something like source code or
    other intellectual property. |


    Having this level of classification allows the organization to apply, broadly,
    encryption methods based on the classification. For instance, the organization
    may require that all Confidential data be encrypted at rest and transit and that
    all Restricted data be shared only with a small audience of people in the organization
    with a need to know.


    # 2.2.3 Applying encryption


    So, you’ve identified where your data is located, and you’ve used the methods
    described previously to classify it. Now what?


    > **Encryption**

    > We will talk more about encryption as we progress, but a simple way to think
    about it is the ability to change plain text to cipher text through an algorithm
    with an encryption key. One main point to remember is that encryption is reversible
    so that either the same key or a paired key will be able to decrypt. This is by
    no means a book on encryption. Trust me, I can’t explain it like a cryptographer.
    However, one of the preeminent books on encryption as it applies to engineering
    is Applied Cryptography by Bruce Schneier. If you are looking for some more basic
    information regarding encryption, look at the Wikipedia on encryption that follows
    the history, future, and uses of encryption (https://en.wikipedia.org/wiki/Encryption)


    To encrypt properly you need a few things. You need an encryption and decryption
    key (sometimes the same key), a secure method to create an encryption key, and
    a secure location to store the key, and a way to distribute and access the key
    in a programmatic way.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Depending on the architecture and deployment of your application the ability
    to securely generate and store a key may be limited. Most legacy systems are limited
    in their ability to store an encryption and decryption key. The key or keys are
    often stored in a configuration file, or worse, hardcoded in software. More modern
    architectures will take advantage of a Hardware Security Module (HSM) that allows
    the application to make secure API calls to a physical device that stores encryption
    keys and can be configured to auto expire, rotate, and generate keys. Today, many
    organizations are under regulatory or contractual obligations to provide better
    encryption methods such as the use of an HSM to encrypt sensitive data and even
    allow for their customers to manage their own keys. However, although an HSM will
    provide the highest level of secure access to data encryption and decryption keys,
    they are expensive and can be a single point of failure if the hardware becomes
    unavailable.


    # Encrypting data with an HSM


    ![](img/cc84747f93d290964598894b4f5c153b_36_0.png)


    Depending on your organization and the industry you are in, you will most likely
    have to encrypt at least restricted and confidential data. For instance, in financial
    organizations, datasets that contain account numbers, social security numbers,
    and similar data will have to be encrypted based on compliance requirements. In
    the healthcare industry, you will have to encrypt insurance information, and patient
    record information. One of the considerations for these organization is that information
    could be located outside of a database and could instead be in unstructured data
    like text documents, PDFs, or image files. For instance, a printed form from your
    doctor''s office may have your social security number and would be scanned and
    uploaded to a health information exchange (HIE). Organizations have a few options
    when dealing with structured and unstructured data encryption:


    +   - Full Disk Encryption to provide encryption of the disk that the data sits
    on. However, this does not give you more granular encryption at the file level.

    +   - File level encryption that encrypts the individual files that hold sensitive
    information like confidential and restricted data.

    +   - Column or row level encryption that encrypts a set of data in a database
    like the social security number, or account number column.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'Proper application of encryption is not as easy as waving a wand. Based on
    the location of the data, the ability to encrypt might be limited or infeasible.
    Legacy systems often struggle to access more modern encryption technology like
    HSMs. However, the organization needs to constantly consider what might occur
    if data is exposed. This can happen physically when a database drive is improperly
    disposed of and falls into the wrong hands, or digitally through an insider or
    malicious activity that is able to access the data in the database through the
    system. Some examples of data escaping the organization are:


    +   - Improper destruction or retirement of old drives that contain sensitive
    data.

    +   - An insider of the organization could have access to the database through
    improper access management.

    +   - An attacker could gain access to the host that the application database
    resides.

    +   - A developer could copy data from a production database to their local environment
    or a lower test environment instead of using mock data that is more suited for
    these non-production environments.


    With the mindset that the data in the organization could be exposed to an adversary
    at any time means that the organization has to ensure that they have applied the
    appropriate level of encryption based on the classification of the data. If the
    physical drive that the database is on or a device with access to the database
    falls into the wrong hands, does the organization have enough confidence that
    its security controls will work? Can an adversary or competitor access the data
    on that database, or has the organization applied the proper level of encryption
    so that it cannot be accessed?


    In addition to proper encryption techniques the organization needs to ensure that
    there are proper access controls around the data at rest and access controls to
    the keys that can encrypt and decrypt. If a user has access to the database management
    tools, they will most likely have access to view the plain text of the data in
    the database. Additionally, if a user has access to the encryption or decryption
    keys, they are also able to view this data or encrypt data as if they were a legitimate
    service. Traceability of these sensitive activities can be met by using tools
    that provide access to the privileged account while also providing auditing capability.
    Usually, the auditing within the tool is completed through screen activity captures,
    key stroke logging, and auto filling passwords so that it’s not accessible to
    the end user. In this scenario an organization will know who performed sensitive
    activity, and more importantly, what they did while provided that access.


    # 2.2.4 Data in transit


    The job of protecting information would be much easier if we had to protect data
    only when it is sitting nice and still in a database or a file system. The reality
    is that data moves. In fact, the exchange of data is how organizations make money.
    It’s how organizations gain competitive advantages. In short, data needs to be
    in motion in order to be profitable.


    It wasn’t that long ago that most web sites were using basic HTTP or FTP to transmit
    data. Using plain HTTP or FTP means that as the data moves from one location to
    another, it is in plain text and open to view by anyone that has access to see
    the traffic. Secure Sockets Layer (SSL) was the first attempt to bring encryption
    to data in transit, turning HTTP to HTTP over SSL (HTTPS). Although version 1.0
    was never released due to security concerns, 2.0'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'was released in 1995. Since then, we have had many versions of SSL and then
    Transport Layer Security (TLS) that replaced SSL. TLS is primarily used to protect
    HTTP and FTP traffic.


    # HTTPS ensures that an eavesdropper cannot read traffic to a web server


    ![](img/cc84747f93d290964598894b4f5c153b_38_0.png)


    Figure 2.3 HTTP vs HTTPS


    Prior to the time when everything was HTTPS, sites used the secure transit only
    during sensitive activities like login. Today, almost every website you go to
    is now TLS enabled and you will be redirected to HTTPS if you attempt to go to
    a site with just HTTP. Several factors played into the adoption of TLS. The browsers
    played a large role in this as they began to mark sites “insecure” if they did
    not use TLS or even if they used a known weak version of TLS. Additionally, security
    over the years has been become not just an obscure corner of an organization,
    but increasingly a concern for everyday users. Users may not know, or want to
    know, how TLS works. But they do want to know that when they input their credit
    card number into a website, that the number will be protected. Most users today
    are becoming accustomed to making sure that they see some version of a padlock
    or other indicator that the site they are on is using a secure connection.


    The great thing about TLS is that it is easily enabled. This is completed through
    a simple configuration in the web server and a signed digital certificate from
    a trusted Certificate Authority (CA).


    DEFINITION A public and private key pair, also known as asymmetric key pair, is
    a set of digital keys that are used to encrypt and decrypt data. These keys are
    a generated together, but one is intended to be kept secret and private, where
    the other is used publicly. They are used to encrypt and decrypt, and provide
    digital signatures,'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'A private and public key pair is generated on the web server. The private key
    is retained by the web server and ideally, never leaves the server. The public
    key is used to create a certificate signing request (CSR) that is then passed
    to the CA to sign with their private key. The product of this is a public certificate
    that is used to show that the web server has control of their private key and
    has been verified by the CA.


    # Generating a Certificate Signing Request


    ![](img/cc84747f93d290964598894b4f5c153b_39_0.png)


    Figure 2.4 – Generating a certificate for HTTPS using Entrust as the CA


    Once this certificate is signed it is used to announce to any user agent, like
    a web browser or command line HTTP tool, that they can trust the web server. The
    user agent will look in its trust store and determine whether the certificate
    authority that signed the certificate can be trusted. If the certificate is signed
    by a well-known CA, the browser will already have a trust relationship and will
    accept that the web server is trusted. In some cases, if it is not a well-known
    CA, the user agent needs to establish the trust by placing the certificates in
    its trust store.


    Certificate management is fun. Said nobody ever. As you can tell, enabling TLS
    can be mostly simple, but there are operational costs. Similar to the key management
    problems discussed earlier, certificates have a lifecycle and need to be renewed
    or replaced periodically. Additionally, some of the fundamental underpinnings
    of the technology can occasionally change and lead to the need to make drastic
    changes. In fact, in 2016 browsers began to display security warnings for certificates
    that were generated using the SHA-1 hashing algorithm with users being able to
    click through the message and continue to the site. By the end of 2018, browsers
    like Chrome were alerting users that they would disallow access to sites using
    the less secure SHA-1 at the beginning of 2019.


    I had the pleasure of leading a project at a large organization with the directive
    to update all the certificates we had to SHA-2. This was no small task. Identifying
    all the use cases where these certifications were used like single sign-on SAML
    certificates, TLS, FTP, digital signing, and others was difficult. Additionally,
    locating where these certificates were stored'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'was a further complication. They are found on file systems, key stores, web
    servers, and databases. Changing them without creating an outage required tight
    coordination between the development, security, client, and operational teams.
    Inevitably, there were rollbacks when something did not go as planned.


    Never fear though, as with encryption keys there are tools that can be used to
    manage, rotate, issue, and alert on the expiration of certificates. There are
    also protocols such as the Automated Certificate Management Environment (ACME)
    that can be used to create CSRs and manage keys and certificates. It is part of
    the business model for Let’s Encrypt certificate authority which allows them to
    issue certificates quickly, efficiently, and provide short expirations of around
    90 days. This short expiration date provides the ability for web servers to frequently
    change certificates and reduce the amount of time that a certificate is in circulation.
    Not that long ago, certificates would have an expiration of five, ten, or even
    thirty years. For the sake of security, the industry has begun moving away from
    this practice and is looking for much shorter timelines to provide better security.
    This only works effectively if there is automation in place to make the rotation
    of expired certificates a smooth process.


    # 2.2.5 Encryption prior to transmission


    A method for ensuring that data is secure when sending between two organizations
    or two applications in an organization is to encrypt locally before sending the
    data. This does require the two parties to have either a shared encryption key
    that they have already determined or to use a key pair that allows one party to
    encrypt and the other to decrypt. The data will be transferred between the two
    entities and is protected regardless of whether it is transmitted over a non-secure
    channel like HTTP. However, you still have a dependency on the key management.
    Transmitting the key opens each end to a possible compromise. Another consideration
    is if the key is compromised there needs to be another exchange and re-keying
    effort by both entities.


    Pretty good privacy is a well-known tool developed in 1991 that is used to provide
    encryption prior to transmission. It can be used for email and file transmission.
    PGP can use either a single encryption key or a private and public key pair. The
    latter offers the ability for two entities to send information to each other even
    if they never met or don’t have the means to exchange a single key.


    # 2.2.6 Data In Use


    Where encryption in transit and rest get a lot of attention when it comes to protecting
    data, doing this for data in use is much more complex. Protection of data in use,
    means when it is being accessed in non-persistent states like memory or in the
    CPU. Additionally, this means that data is protected throughout its entire lifecycle
    when combined with encryption of data at rest and transit. In general, well-designed
    systems will ensure that access to data in use is only accessible to the parts
    of the system that should have access. This will limit access to memory by malware
    and other processes. This should protect against not just writing and reading,
    but also executing of code when not allowed.


    Many of the methods for protection are through the host level or operating system
    level controls like using segmentation, protection rings, or paged virtual memory.
    Additionally,'

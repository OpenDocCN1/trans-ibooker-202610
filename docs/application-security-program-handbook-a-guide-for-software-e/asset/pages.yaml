- pgno: 43
  md: '# 2.3.1 DoS and DDoS


    Most people think of one thing when they hear about attacks that bring down a
    service or application. DoS, or denial of service, is an attack that purposely
    floods the service or application with a large number of requests. Its bigger
    brother is the DDoS, or distributed denial of service where the requests are from
    many different sources instead of just one in the DoS model. The system is then
    overwhelmed and is unable to complete requests for other legitimate traffic. One
    of the greatest complications with protecting against DDoS attacks is that the
    traffic often looks legitimate which makes the job of blocking this traffic difficult.


    There is an old American television show called "I Love Lucy". One of the most
    iconic episodes was when Lucy and her friend Ethel work in a candy factory to
    make some money. They were assigned to the candy wrapping station where candy
    would pass by on a conveyor belt and the two would have to wrap each one. Naturally,
    at first the conveyor belt is moving along, and the two friends are able to successfully
    wrap each piece of candy that goes by. Soon the belt begins to move much quicker
    with more candy coming. The two friends are quickly overwhelmed and begin to stuff
    candy in the pockets, and mouth while missing most of the candy that goes by.


    This is a simple example of a DoS attack where the system can be tricked into
    accepting what appears to be normal traffic, at high volume, by a malicious actor.
    In other words, the candy coming down the belt is still legitimate and should
    be there, but the system setup to properly handle that candy is unable to handle
    the large amount being sent. Now, in this example, it’s easy to laugh it off because
    it’s a simple yet visually accurate example of a denial of service. In the real
    world these attacks can be dire. Increasingly over the years these attacks have
    also grown in size. Early DDoS attacks were small in size and would use something
    like a SYN flood that would send a large number of TCP synchronize (SYN) packets
    without closing them out. It was simple, yet effective. More importantly, almost
    anyone could do this. Attacks today are much more sophisticated and larger, reaching
    over two terabits per second in some cases. To put that into perspective that
    is 1,000,000,000,000 bits per second, or roughly 1,000 hours’ worth of movies.


    DDoS attacks are not limited to just network level attacks. Layer-7, or application
    layer attacks are common as well. These types of attacks are generally smaller
    in nature as it is targeted at disrupting the flow of the application or processing
    of data by going after the specific resources that serve up the application. This
    could be by targeting the database to make it unavailable or flooding the application
    with HTTP traffic that keeps it from processing legitimate requests from users.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Largest known DDoS attacks


    ![](img/cc84747f93d290964598894b4f5c153b_44_0.png)


    Figure 2.5 – Growth of DDoS attacks since 2010


    # 2.3.2 Accidental outage


    Not all availability issues are due to malicious activity. If the application
    is not built to be resilient, it is possible that something as benign as a software
    update could bring down an application. Other possible actions are system reboots,
    patches, or failed software installations. Most organizations will perform system
    maintenance during times where the client impact is low.


    In 2019, while Britain was moving towards an exit from the European Union, many
    citizens of Britain that wanted to remain in the European Union attempted to sign
    a petition on the UK’s Parliament website. The sudden spike in traffic that was
    unusual for the site presented many of the citizens with a HTTP 502 error signifying
    that the site was incapable of handling the large number of requests.


    There are also cases where the protection mechanisms in use can create their own
    availability issues. Akamai is one of the leading companies in DDoS protection.
    They offer a content delivery network (CDN) that includes protection for many
    companies against volumetric type of attacks like DDoS. In June of 2021, an outage
    at Akamai lead to several sites around the world becoming unavailable. Most were
    financial institutions in Australia and New Zealand, however both Southwest and
    American Airlines were impacted as well. The cause of the outage was not due to
    a cyber-attack, but rather a misconfiguration at Akamai related to a routing table
    value. This came shortly after similar outages at some of Akamai’s rivals Fastly
    and Cloudflare showing that an overreliance on third parties to deliver protection
    can be an additional risk to an application.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# 2.3.3 The role of ransomware


    Protecting against volumetric attacks that flood your network or application with
    legitimate or junk data is one thing, but an entirely different approach to availability
    chaos is by encrypting the devices or data that your application depends on. Ransomware
    is not new, but in the past few years it is gaining popularity. We could spend
    an entire chapter on ransomware, but I’ll summarize it here.


    Ransomware is the outcome of a successful malware attack with the sole intention
    of encrypting a device (locker ransomware) or the more popular method of encrypting
    data (crypto ransomware). The methods of delivery of the malware vary from phishing
    to more sophisticated remote code execution. So, what does this mean for your
    web application or service? Obviously, an encrypted database will render your
    application useless in most cases. Returning to normal operations will typically
    mean paying a ransom to the attackers in the form of anonymous cryptocurrency
    in order to gain access to a decryption key that will unlock the data. Mature
    organizations may be able to overcome this disruption by restoring from backups
    that have not been encrypted.


    Ransomware has continued to rise in the past several years and has catapulted
    cybersecurity to the mainstream with such famous attacks like WannaCry, the City
    of Atlanta, the Port of San Diego, and the Colonial Pipeline attacks. With Ransomware
    as a Service (RaaS) on the rise and affiliate attackers reusing popular ransomware
    software the trend will continue to go against organizations.


    Ransomware is a persistent and growing threat to organizations. The idea of having
    your data encrypted with no method of decryption is paralyzing to think about.
    Cybersecurity & Infrastructure Security Agency (CISA) has several recommendations
    to avoid the risks of ransomware:


    +   - Ensure that your organization has a procedure for patching software.

    +   - Backup data on a regular basis and test the backups.

    +   - Restrict access to systems and software following the principle of least
    privilege.


    # 2.3.4 Casino Betting Offline


    Not all organizations face DDoS attacks equally. Some, due to the nature of their
    business, face an increased risk. Imperva is a leading provider of application
    layer DDoS protection through a suite of tools including a Web Application Firewall
    (WAF). Their Global DDoS Threat Landscape Report released in 2020 showed that
    gaming industry and the gambling industry continue to be the most attacked websites
    on the internet. It is easy to see why this is the case. These sites need to be
    universally available especially during big events or risk losing revenue.


    In 2020 an attacker used Datagram Congestion Control Protocol (DCCP) to slip past
    DDoS protections that are geared toward other network protocols like TCP and UDP
    in order to perpetrate one of the largest DDoS campaigns ever seen. They used
    the new attack vector to perform what is known as DDoS extortion or ransom. RDoS
    (Ransom DDoS) is, as it sounds, a way for the attacker to threaten an organization
    to either pay a fee or be the subject of a DDoS attack. By February of 2021 these
    attackers were able to muster over 800 Gbps of traffic to direct toward their
    victim. In this case, a gambling site in Europe.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 2.3.5 Health organizations are still fair game


    Despite a global pandemic, the healthcare industry was still too juicy of a target
    to keep attackers at bay. Many of the most well-known cyber-criminal gangs (more
    on these later) claimed that they would avoid attacking health organizations to
    show their sensitive side. However, there are plenty of fish in the sea as it
    were that did not feel the same.


    There were countless attacks and attempted attacks against health organizations
    during the Covid-19 pandemic. Both the HHS (Health and Human Services) in the
    United States and the Paris AP-HP were in the crosshairs of DDoS attacks. In the
    case of the HHS, the threatened DDoS attack whose aim it was to create disruption
    in the pandemic response, was thwarted. However, the Paris AP-HP which operates
    dozens of hospitals across France as well as providing research and disease prevention
    was impacted by a DDoS attack that was absorbed by the network provider.


    One thing that is clear with the targeting of healthcare organizations is that
    attackers will always go for the lowest hanging fruit, the least amount of effort,
    and the most likely to pay a fee. Healthcare organizations are not engineering
    organizations. Their primary purpose is to provide healthcare services to patients
    in need. Any disruption to their capabilities puts lives at risk, which will drive
    decisions to move quickly to a resolution. With technology that is usually years
    behind the state of the art, and small or outsourced technology teams, the quickest
    resolution is usually processing a payment to an attacker.


    # 2.3.6 Building in resiliency


    Availability has one best friend in the world. That’s resiliency. One of the most
    iconic bridges in the world is San Francisco’s Golden Gate Bridge. Known as one
    of the Wonders of the Modern World, the Golden Gate Bridge connects the San Francisco
    Bay with the Pacific Ocean. Construction began in 1933 and was completed four
    years later. The Golden Gate Bridge is a great real-world example of building
    for resiliency. Not only was the construction of the bridge an extreme modern
    marvel, but there are unique considerations for places like San Francisco. Namely
    earthquakes, as the Golden Gate Bridge is within close proximity of the San Andres
    Fault which produces frequent seismic activity, some of which can be devastating
    to the area. It has survived several large earthquakes over its eighty plus years
    of existence, but not without the need of constant review and rework. Several
    projects are ongoing to make it not only more secure against earthquakes but also
    high winds. What does this have to do with software? Risk management in architecture
    is not much different whether you are building a bridge across a peninsula or
    developing an application to deliver value to your customers. Architecture, design,
    and development all need to consider the what-if scenarios and plan for possible
    attacks, failures, or errors. Some of which could be intentional.


    Your application should be designed and architected in a way that takes into consideration
    the type of risks and threat actors that may be looking for weaknesses in your
    specific application. Similar to the Golden Gate Bridge needing to be built to
    withstand winds as well as potentially large earthquakes, a healthcare application
    needs to be built to withstand a cyber-attack that is attempting to ransomware
    your client data in order to turn the downtime into a profit. Your gambling application
    must consider criminals looking to'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'DDoS your application to extort your organization. Your critical infrastructure
    application must be prepared to handle an advanced persistent threat looking to
    shut down your system to cripple key parts of a nation. We will talk more about
    these in the next sections.


    One of the simple methods of building in resiliency is to add more processing
    power. Scaling vertically means you are creating bigger systems. Scaling horizontally
    means you are adding more systems. This is easier said than done. However, the
    migration to cloud first architecture makes this easier, albeit expensive. Additionally,
    building segmentation into your architecture reduces the "blast radius" of a potential
    attack. If you always assume that one of your systems is compromised, you will
    look at your architecture much differently. Similarly, there have been books written
    on the principles of chaos engineering which in its simplest form means injecting
    a bit of chaos into a system to identify issues in order to prevent full-on outages.
    Think of trying to find a pin hole in a tire. You might rub some soapy water around
    it and put it under pressure to look for where the bubbles show. This is similar
    to the concept of chaos engineering.


    +   - Develop a hypothesis: "The application will respond gracefully if an external
    service is not available".

    +   - Test the hypothesis: Route HTTP from the application to a non-existent service
    and observe the failure condition.


    Fix: If required, identify the issues, resolve them, and improve processes.


    One last comment regarding building resiliency in. Things will break, processes
    will fail, systems will crash. What is done with that information is critical
    to improving the system long term. Learning from mistakes and failures is the
    best method of building more resilient systems. A typical component of learning
    from failures is in a post-mortem or a root cause analysis. Here, the team reviews
    what happened and where the failures were. From there they build incorporate the
    findings into an action plan to ensure that controls, processes, and automation
    are in place to ensure the failures don’t occur again.


    # 2.4 Integrity


    When we open a bottle of our favorite beverage, we expect to hear the sound of
    the cap snapping away from the protective top. Data is little different in the
    sense that we want to have confidence that it is correct when we view or process
    it. Integrity is the ability to know that data is known to be good and trusted.
    This requires the application to trust that data has not been tampered with whether
    in transit or at rest. Integrity needs to be confirmed in communication between
    two applications, in databases or file systems, or a piece of hardware or software.
    Anywhere data resides or moves requires it to continue to be trusted by the applications
    that use it.


    As with availability and confidentiality, integrity issues can be intentional
    or accidental. It can be from an attacker injecting junk into a business process
    that corrupts data that is then stored or processed, or it can be a write failure
    that then corrupts those backups you were planning on using to recover from a
    potential ransomware attack.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# 2.4.1 Integrity starts with access


    Have you ever walked to your desk, got in your car, or entered a room in your
    house and noticed that something was moved that you know you didn’t move? Your
    mind begins to walk back over the last time you were in that space. Did you really
    put that pen there? Was that book always on that side of the table. If it wasn’t
    you, then who was it? If only you had a method to see who was in that room other
    than you and catch the perpetrator red handed. I got news for you. It was probably
    you.


    Think about a simple web request from your browser to a web server. The request
    leaves the browser in a GET or POST, traverses the network as a packet, which
    lands on several network devices, it is received by a load balancer or proxy or
    a WAF, it hits a web server, an application server, and a database. By the way,
    it’s most likely been logged in a few of those locations and sent to separate,
    centralized logging system. Not all paths through a system are the same, but in
    general this holds true for most HTTP requests made today. At each one of those
    steps there is the potential for a user or an account to gain access to view,
    copy, or corrupt the data.


    # Reverse Proxy Flow


    ![](img/cc84747f93d290964598894b4f5c153b_48_0.png)


    Figure 2.6 – Simple HTTP request with a reverse proxy


    Access control and monitoring is primarily used to determine what accounts have
    had contact with data as it has gone through a system. It can be achieved through
    means as simple as providing a monitoring system for logging access to certain
    files, directories, and resources. Or it can be as complex as a privilege access
    management (PAM) system that requires a user to check out account access to sensitive
    systems where actions and keystrokes are logged. There are systems and security
    models in between that will provide varying level of access control. The key takeaway
    is to ensure that you can trace access, down to the individual file, to a physical
    person or user account. The moment that you have something like a shared account
    you lose the ability to trace activity to a single account or individual. These
    accounts are ones that have a shared username and password that is used by a group
    of individuals.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Non-repudiation is a form of access control that grants the application the
    ability to track an action or activity back to an identity. The most important
    concept with non-repudiation and access control can be summarized by the FDA’s
    definition of an *audit trail*.


    > **DEFINITION** An audit trail is a secure, computer-generated, time-stamped
    electronic record that allows for reconstruction of the course of events relating
    to the creation, modification, or deletion of an electronic record.


    Attackers may look for ways to ascribe their activity to a different account or
    otherwise pin the blame somewhere else. When an attacker performs an attack on
    an application there is a goal in mind, perhaps data exfiltration or DoS. In these
    cases, they will also attempt to hide their activity through poisoning or corrupting
    the logs so that the team that reviews the incident is not able to piece together
    the attacker’s activity. It is important to validate the input that is coming
    into your logs and make sure that access to logging workflows is tightly controlled.
    It is also important that enough information is logged to aid in the forensics
    of a potential incident. Without this audit trail, the ability to trace behavior
    back to an entity will leave the organization unable to determine root cause of
    activity.


    # 2.4.2 The role of version control


    Version control is a method for making certain that if data is corrupted, that
    there is a means to return to a good state. For those of us that have done any
    software development, we know that there have been times that, while coding, you
    broke something else in the process. Or maybe that only happened to me. You would
    usually attempt to roll back to a known good state or at least be able to view
    an older file and compare it to the current so that you can determine what broke.
    Version control software performs the function of providing control and visibility
    into files over time. As mentioned, this provides the ability to compare and rollback
    in the event of data becoming corrupted, deleted, or just bad coding.


    Version control also offers the opportunity for a team of software personnel to
    work on a large application. Rarely is an application developed by one individual.
    It takes a team to build an application that is developed for commercial use.
    The use of a version control system (VCS) allows for the team to work simultaneously
    on the same application while providing the means to track code check-ins, resolve
    conflicts, and enable the ability to revert changes.


    Many newer VCS include the ability to perform code reviews, track defects, and
    leverage task controls that can perform jobs related to continuous integration
    like merging code, running test suites, and creating a software package that can
    then be deployed to an environment where it can be tested. In relation to software
    security, the VCS that is used allows for the application security team to perform
    code reviews on sensitive code. For instance, a change may have been made in the
    code that impacts the authentication of the application. In this case, the engineering
    team may request that the application security team review the code for any increased
    risk due to the change. Additionally, if the VCS provides the ability to run tasks,
    the application security team can use this point to perform automated security
    testing to uncover vulnerabilities, like using a static analysis tool.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# 2.4.3 Data Validation


    An additional consideration when maintaining data integrity is to maintain the
    data as it is initially brought into your system through a user or service. In
    the application security space, we typically call this data scrubbing or validation.


    > NOTE If there is only one thing that you remember from this book, let it be
    the fact that you can never trust your end-users or the services your application
    work with to send you correct data. Whether intentional or not, data that is not
    properly validated can lead to failures in your application or a malicious actor
    being able to compromise it.


    This means simple concepts like only accepting numeric values of certain length
    when expecting a phone number or social security number. It can be as complex
    as writing regular expressions that look for specific characters and other requirements.
    Many development frameworks may even have data validation built into the framework.
    However, ultimately, the validation strategy should ensure that the input data
    is both within the constraints of the value it is expecting and also makes sense
    from a logic perspective.


    Depending on your development framework, validation techniques are natively available
    and can be leveraged to check common constraints on size, type, schema, and others.
    One consideration when developing validation either using the native elements
    of your framework or developing your own is that taking the allow list approach
    is more effective than the deny list. What this means is that the application
    should specify what it allows, and not what it blocks. It is apparent that a deny
    list will need constant maintenance and will not always catch novel approaches
    to circumventing the validation. An allow list will only permit the values that
    the application is expecting to work with and is a more secure method.


    One last point on the input validation is that it is not sufficient to only examine
    the input on the client side. This check must also be done at the server side.
    Proxy tools, and projects like cURL allow an attacker to manipulate an input or
    send requests to your application without needing to go through the UI. In other
    words, most attackers will easily circumvent your client-side validations that
    might be in place.


    # 2.4.4 Data Replication


    Data replication is usually thought of as data backup. However, there is more
    to it than that. Data replication entails making multiple copies of data in different
    locations to be able to absorb potential data loss or corruption in one copy.
    This provides not only better availability and lower latency but also the ability
    to restore to a known good state should something go wrong. Although there is
    file and system backups that should be in place, the application architecture
    should include the ability to distribute data through a clustered database. While
    in this scheme data is split so that different fragments go to different nodes
    and are retrieved in a manner that will then consolidate the different fragments
    back to the original data. Replication of the data will provide the additional
    layer of making sure that a failure at one node does not limit the ability for
    the cluster to retrieve the data.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# 2.4.5 Data Checks


    If you have worked in technology long enough you are well aware of the concept
    behind checksums. These are values that provide a fingerprint for a given input.
    This is essentially a hash of an input which means that it can only be done in
    one direction. In other words, the plain text is turned into a hash value, but
    the hash cannot be returned to the plain text. Checksums and hashes are not necessarily
    different from each other except for their purposes. Where hashes are an output
    of a mathematical function that is intended to create a unique value, a checksum
    is used to make a comparison and then decide whether a value has changed or not.


    ![](img/cc84747f93d290964598894b4f5c153b_51_0.png)


    Figure 2.7 – Hash validation utility


    Another example of a generated code for that provides data integrity assurance
    is the message authentication code (MAC). These are cryptographic checksums that
    are used to not just prove that data has not been tampered while it was saved
    or transmitted, but it also provides a means to authenticate who it came from
    when a cryptographic key is used during the MAC generation.


    # 2.5 Authentication and authorization


    Authentication and authorization are two additional tenants that are vital to
    maintaining the security of an application. They are components of what is typically
    thought of more broadly as identity and access management (IAM). Diving deep on
    this topic is out of scope for this book, but it is important to know what they
    mean and their roles in security.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Authentication vs Authorization


    ![](img/cc84747f93d290964598894b4f5c153b_52_0.png)


    Figure 2.8 Authentication vs Authorization


    # 2.5.1 Authentication


    Authentication (or AuthN) is the practice of confirming that a user or account
    is who they say they are. This is accomplished by proving identity through the
    following:


    +   - Username and password which accounts for something you know.

    +   - A token through either a hardware device or software which is something
    you have.

    +   - Biometrics like a fingerprint or retinal scan which is known as something
    you are.


    In most cases, a single factor is enough to verify the account. Our username and
    password combination is widely used to allow us to login to applications. More
    strict applications or services may require additional factors like token or biometrics
    (or all three) to provide enough verification of the account. The use of more
    than one factor is considered multifactor authentication. For instance, password
    combined with a token would be two factors that are used to provide authentication.
    It is important to point out that once an account has been authenticated, it does
    not grant access to everything within a system. That is an important distinction
    between authentication and authorization. Your ability to login, and therefore
    authenticate, to a site like Amazon.com does not entitle you to access everything
    including administrative functions.


    # 2.5.2 Authorization


    Authorization is the process of granting access to a user or account to certain
    features or activity within an application. This occurs during or after the authentication
    process. It''s important to consider that during the authorization process that
    the least privilege approach is taken to ensure that the account only has access
    to the features that it needs to perform its tasks. That can be achieved through
    several access models.'
  merge: -1
  img_proc: true
- pgno: 53
  md: "+   - MAC (Mandatory Access Control) – Gives the access control to the owner\
    \ and custodian of the system or data.\n+   - RBAC (Role based access control)\
    \ – Provides access based on the account’s participation in a group or role.\n\
    +   - DAC (Discretionary access control) – Gives complete control of the access\
    \ control to the owner of a system or data.\n+   - RBAC (Rule based access control)\
    \ – Defines access for an account that is defined by the custodian or system administrator.\n\
    \nOne common way to think of authorization and its role in identity is the common\
    \ access card, passport, or license. These types of identifying items usually\
    \ have a photo, your name, address, and other identifying information. Having\
    \ one of these helps someone confirm your identity since you are the person in\
    \ the picture. This is authentication. However, having that identifying item doesn’t\
    \ mean that you are granted access to certain locations. For instance, your license\
    \ will not allow you access into sensitive areas of military base. Sure, the picture\
    \ and information on the license identifies you but it by no means grants you\
    \ access to off-limits areas.\n\n# 2.6 Adversaries\n\nOne of the foundations to\
    \ developing a defense in depth approach to addressing security is to know what\
    \ types of attacks you should be expecting. The following is an often-quoted line\
    \ that suits our needs here:\n\n> If you know the enemy and know yourself, you\
    \ need not fear the result of a hundred battles. If you know yourself but not\
    \ the enemy, for every victory gained you will also suffer a defeat. If you know\
    \ neither the enemy nor yourself, you will succumb in every battle.\n> \n> Sun\
    \ Tzu The Art of War\n\nOf course, we are not headed to battle every day when\
    \ we head off to work, but this still works in the context of cybersecurity. Knowing\
    \ the attackers, their methods, and what their targets are in your organization\
    \ allows you to know where to spend your effort and money. We’ll talk more about\
    \ general risk next, but first let’s talk about who the various adversaries are\
    \ that you will likely encounter.\n\n# 2.6.1 Script Kiddies\n\nOne of the most\
    \ prevalent adversaries that we can expect to see in the cybersecurity space is\
    \ the \"script kiddie\". It’s not a great name, but these are typically low skill\
    \ attackers that have little motivation outside of revenge or fame. They will\
    \ look to purchase, or reuse exploits that others have developed with no knowledge\
    \ or understanding of how the exploit works. They simply want to point it to a\
    \ target and click a button.\n\nAlthough the skill level of these attackers is\
    \ low, they are generally using automated type of attacks that allow them to run\
    \ these attacks at scale. Make no mistake, organizations are under near constant,\
    \ daily attacks. Some of this is noise from the general internet, other"
  merge: -1

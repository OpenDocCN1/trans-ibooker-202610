    # 3.2 Security analysis tools


    During development there is potential for security issues to be introduced unintentionally,
    and less commonly, intentionally. These security issues can come in all levels
    of risk and technical implications. However, organizations do not need to rely
    solely on penetration testing and other tools and techniques to uncover issues
    later in the development life cycle. There is an abundance of tools that development
    teams are able to use in order to locate an issue before it becomes a production
    incident.


    ![](img/cc84747f93d290964598894b4f5c153b_76_0.png)


    Figure 3.4 Scanning tools in the Secure SDLC


    Before we jump into the available tools, you should first know that a lot of tools
    on the market are *noisy*. This means that there is a lot more noise than signal
    and it is up to the organization to ensure that they have reduced the noise or
    run the risk of a failed adoption of the tool. This noise is often referred to
    as *false positives*, which means that the issue identified by the tool is not
    an actual security issue. Determining whether output from a scanning tool is indeed
    a security issue versus a false-positive takes effort by the security team and
    the development team. For example, a tool may identify a SQL Injection issue from
    the scanning tool. Depending on how the team manage results from the tool, the
    development team or security team will first triage the issue to understand whether
    it is indeed an issue. If you’ve ever worked on a software support team or otherwise
    have been involved with reviewing defects or bugs in an application, you will
    be familiar with this'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'process. It requires knowledge of how the application is actually being used
    as well as the access to the code to follow the logic.


    false-positives may seem like it''s just a matter of just working through the
    issues and closing the false-positives while keeping the true positives. The truth
    is that false positives have a larger impact on the organization. Time is spent
    identifying them instead of working on other priorities. Additionally, a large
    number of false positives will reduce the confidence in the tools being used,
    and by extension, the confidence of the security team.


    Similar to false-positives, false-negatives need to be considered when using analysis
    tools. This is where the tool failed to identify a true-positive. Consider that
    you have integrated an analysis tool into your development pipeline, this will
    give your development team and your security team the confidence that issues will
    be identified and resolved. However, down the road perhaps a penetration test
    is completed on the application and a cross-site scripting (XSS) issue is found.
    Depending on the analysis tool, this most likely should have been found earlier
    and resolved. This is an example of a false-negative.


    Make no mistake, false-negatives can be as bad, if not worse than, false-positives.
    Whereas false-positives will grind teams down with the amount of work that is
    required to filter out the issues, false-negatives have the result of giving the
    organization the false sense of security. You expect your tools to provide the
    comfort that they are uncovering the issues so that you may resolve them.


    There are many different tools out there to analyze code and applications, and
    many of them fall into more than one category. However, when it comes to security
    analysis tools there are three main ones: static application security testing,
    dynamic application security testing, and software composition analysis. We''ll
    cover static analysis first.


    # 3.2.1 Static application security testing


    Static application security testing (SAST) tools look at code as it sits. In other
    words, it is doing a code analysis on the source code and is looking for security
    issues. One common finding with SAST tools is plain text passwords that are hardcoded
    in the code. SAST will do this by source code by using techniques such as taint
    analysis and data flow analysis.


    +   - Taint Analysis – This allows the analysis tool to follow user input throughout
    the application to determine whether it is ever sanitized before it is used.

    +   - Data Flow Analysis — This is where the analysis tool attempts to gather
    run-time information while the code is static.


    SAST tools are primarily used at the time of development so that issues can be
    uncovered and resolved earlier in the development lifecycle. Many of the SAST
    vendors today have integrated development environment (IDE) plugins that allow
    the developer to run a scan when code is being written. Some of these plugins
    are free, but I often say, "you get what you pay for", so always take the free
    tools with some healthy skepticism. These free tools are often offered without
    support or are not as frequently updated as a commercial tool.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Many of the tools I will talk about are used in conjunction with one another
    as there is not silver bullet tool that will solve all of your security issues.
    For instance, static analysis tools are great to get an understanding of “hot
    spots” where the application appears to be weak from a security point of view.
    It can also be input into threat modeling exercises to allow the participants
    to focus on mitigations in trouble areas.


    Each SAST vendor has a different way of scanning however most follow a pattern
    of compile, model extraction, pattern matching, and flow analysis as shown in
    figure 3.5


    # Generic Static Application Security Testing Flow


    ![](img/cc84747f93d290964598894b4f5c153b_78_0.png)


    Figure 3.5 High Level SAST Process


    There are certainly strengths and weaknesses with SAST tools. Some of the primary
    considerations are that SAST tools are usually bound by limitations in the languages
    that they cover which means that if you work in most large organizations, you
    will have several languages that are used by the different teams. You may be forced
    to use more than one SAST product to get coverage of all the languages in the
    organization. Additionally, SAST products are the most notorious products for
    producing a lot of false positives. You may be able to tune the product to reduce
    this noise, but this will take time and coordination with the security and engineering
    teams. Lastly, the SAST tools are only able to see the static code and cannot
    see how it runs in an environment. This limits its ability to locate potential
    run-time security issues like parameter tampering.


    There are a few things that SAST does well. It is ideal for locating low hanging
    fruit like hard coded secrets or passwords as well as locating poor secure code
    practices like SQL injection type flaws or poor encryption methods. It can also
    pinpoint exactly in the code where an issue will manifest and give recommendations
    on how to fix it. This is extremely helpful for developers, and security folks,
    who want to fix a security issue as close to the code as possible.


    Ultimately, SAST tools are as close to the developer as it gets. For those, myself
    included, that want to ensure that the right tools are available to the developer
    while they are creating the code, nothing really beats SAST. This needs to be
    weighed with the strengths and weaknesses mentioned above. Static analysis tools
    are decent at finding vulnerabilities early,'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'but in order to get information to the developers as early as possible, you
    need to go to where they are.


    # 3.2.2 Tools in the development environment


    When we look at the development pipeline the goal is to identify and resolve potential
    security issues before they are deployed to a production environment. This requires
    that tools are available, properly tuned, and that the developers know how to
    resolve a found issue when it’s been identified. This also means that the organization
    should strive to find issues as early in the development pipeline as possible
    in order to provide the appropriate mitigations before it becomes a production
    vulnerability that puts the organization at risk.


    To make this a reality, many of the tools that I mentioned previously have developed
    plugins or other tools to provide developers guidance on secure code as early
    as possible. For instance, many vendors will have an integration with development
    environments (IDE) that developers work in to write code. Others will have standalone
    tools that developers will be able to leverage to do things like locate secure
    third-party libraries before they use them in their project. This can come in
    the form of internet browser plugins or other services.


    As with the other tools in the develop pipeline I covered earlier, there are commercially
    developed ones as well as free and open-source ones. However, you get what you
    pay for. The free ones, in general, will have less features and less support,
    but will still create a quick feedback loop for developers and identify the low
    hanging fruit.


    The goal of these developer tools is to enable the developer to get in front of
    a potential vulnerability while they are in the process of writing the code. There
    is one tool that we can look at as an example here. It’s a plugin called FindSecBugs
    that can be enabled in several well-known IDEs like Eclipse, IntelliJ, and NetBeans.
    This plugin provides a general static analysis security scan to locate potential
    vulnerabilities in the code. Developers can initiate the scan and FindSecBugs
    will produce a listing of the vulnerabilities that were found and when the developer
    clicks on the finding, FindSecBugs will take them to the line of code in the IDE.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '![](img/cc84747f93d290964598894b4f5c153b_80_0.png)


    # Figure 3.6 – FindSecBugs in Eclipse


    Along with showing the line of code that has the vulnerability, FindSecBugs will
    provide reasons why it is vulnerable and possible solutions. There is a myriad
    of other similar tools, and as mentioned, most vendors with security solutions,
    especially in the SAST and SCA space have developer tools.


    The goal here is to provide the developer the resources to resolve a potential
    vulnerability prior to them checking the code in to the code branch. Other tools
    in the pipeline, like the ones I outlined previously, are still needed however
    having the ability to catch an issue before it goes to a code branch means that
    there is less reliance on these tools to find vulnerabilities when the code has
    already moved out of the developer IDE, and may reduce the amount of effort spent
    in these other tools to find and resolve issues.


    # 3.2.3 Dynamic application security testing


    Where SAST and IDE integration tools are looking at the code in its static form,
    dynamic application security testing (DAST) will scan the application as it is
    running in an environment. It can be thought of as a penetration test that is
    performed by a tool considering that it is a security test that is looking from
    the outside in and attempts to locate weaknesses such as parameter tampering,
    cross-site scripting, improper redirects, and so forth. DAST tools are often used
    by penetration testers to identify low-hanging fruit in a running application
    and take some of the manual work out of a penetration test.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'DAST tools are mostly technology independent since they are looking at the
    running application and attempting to find weaknesses. They are taking the outside-in
    approach and rely on the HTTP conversation as the common ground and therefore
    is not concerned about the underlying language or framework.


    DAST tools rely on being language independent, and able to scan running applications
    to deliver the ability to scan applications in production environments and even
    applications that are not owned by the organization. Although both of these require
    prior approval from the application owner since these scans can be destructive
    and create disruption for the application. Additionally, DAST tends to produce
    fewer false positives over SAST tools since many of the findings are identified
    in the running application.


    However, with the additional flexibility that DAST provides over SAST, there are
    some drawbacks. For instance, DAST tools will not be able to tell you the line
    of code where an issue is found unless it has been instrumented into the application.
    More on that in a moment. DAST also tends to be run later in the development lifecycle
    meaning that the issues are found farther right in the life cycle as opposed to
    SAST. It is possible to run DAST earlier on a developer’s local environment, however,
    this is not frequently done. DAST will also not discover code specific issues
    such as hardcoded password. Lastly, the findings from DAST still need to be triaged
    by a security subject matter expert to determine whether it is a true positive.


    # Open Source DAST


    There is an open source DAST tool available from, surprise, OWASP. It is called
    Zed Attack Proxy (ZAP). It is free to download and use and is a great way to get
    your feet wet with a DAST tool. You can usually set it up to run an unauthenticated
    scan against an application in under a few minutes by just providing a URL. However,
    the real power of ZAP comes from using an authenticated session that crawls the
    site, determines the site map, and then begins to run through common attack patterns
    to report on vulnerabilities. It is a great tool to learn with, but many organizations
    use ZAP as their sole DAST tool as well. (https://www.zaproxy.org/)


    There is another variation on DAST called interactive application security testing
    (IAST). The uniqueness of IAST is that it combines the strengths of SAST and DAST.
    It assesses the application from within through instrumenting the code. This means
    that the vendor will provide a library that the application then uses in its overall
    build of their application so that the IAST tool is running as part of the application.
    This allows it to have access to code, the HTTP conversation, library information,
    backend connections, and configuration information.


    One of the drawbacks of IAST is that some tools available require the application
    to actually be attacked in order to detect a vulnerability. This may not be a
    huge deal for the organization so long as they have robust testing that enables
    the bulk of the application to be tested. Failing to have this robust testing
    means that a vulnerability could go undetected until that feature is exercised.
    A prime example of this would the case where a reporting function is only periodically
    run. If this is not run as part of normal quality assurance or regression testing,
    then it is possible that a vulnerability in the report function would pass through
    to production. In this case, if the organization has good integration with its
    logging'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'and reporting functions, the vulnerability would be picked up in production
    and allow the organization to respond accordingly.


    Where IAST shines is the ability to work well in a DevOps model. I will cover
    DevOps, and more specifically DevSecOps in coming chapters but for now just know
    that IAST provides constant monitoring of the application for vulnerabilities,
    and a much lower case of false positives. You are also able to tailor IAST to
    focus on specific areas if time is a factor. This means that you can focus on
    a small section of the application for testing and review the results from the
    IAST tool.


    It’s not all great news though. IAST means more complexity with your build. That
    library that you integrate into your software needs to be updated periodically
    and could cause build failures. This means more development and deployment work
    by the engineering team. As mentioned IAST can only report on what it sees. If
    the part of the application is not exercised, then the tool will not uncover any
    issues.


    DAST and IAST are great ways to uncover issues in a running application and can
    augment the overall tool chain in a secure software development lifecycle and
    attempt to model the behavior of a real attacker. It’s important to remember that
    these tools are only a component of the defense in depth model and are not used
    to provide assurance that all vulnerabilities have been found. What about finding
    vulnerabilities in software that you use to build your application, but it’s not
    actually owned by you? That is where software composition analysis comes in.


    # 3.2.4 Software composition analysis


    A house or a car from the outside looks well put together and looks like one object.
    We all know, however, that there are multiple components that are used in building
    that final product. Some of them are small and discreet items like screws, bolts,
    and nails. Others are more complex individual systems like assemblies with electronic
    systems that are sold as a total package.


    Software is no different. A small percentage of code is actually written by a
    developer. In most cases the developer pulls libraries and packages into their
    overall project that meet a need. For instance, a developer is not going to create
    their own project that handles math equations, there is already a library for
    that either existing in their framework or from another source. This is convenient,
    but it becomes difficult to manage the sprawl of libraries that are used in an
    overall project. How do you know the libraries being used are secure or are not
    running afoul of license use?'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Standard Dependency Structure


    ![](img/cc84747f93d290964598894b4f5c153b_83_0.png)


    Figure 3.7 – Example dependency structure


    That’s where software composition analysis (SCA) can help. Most typical SCA software
    is used to manage open-source component use and tracking of the licenses. SCA
    tools perform:


    +   - Scans of an application’s code base, including related artifacts such as
    containers and registries.

    +   - Identify all open-source components to help build a software bill of materials

    +   - The libraries license compliance data and any security vulnerabilities that
    may be known.

    +   - Some SCA tools also help fix open-source vulnerabilities through prioritization
    and auto remediation.


    Sounds pretty good. However, one of the issues with using an SCA tools is that
    it can often flag a library after it is running in production. Image that you
    built and deployed your application in January of the year, and in July your SCA
    tool flags one of the libraries you used as being insecure. At the time you initially
    built the software there was no issue. It gets even more complicated, what if
    the library requires you to upgrade other libraries or otherwise make a larger
    change to the architecture in order to resolve the finding? Another possible scenario
    is that the library that is flagged by the SCA may itself not be insecure, but
    rather a library that it depends on.


    > A direct dependency is functionality exported by a library, or API, or any software
    component that is referenced directly by the program itself


    > A transitive dependency is a functional dependency which holds by virtue of
    transitivity among various software components.


    SCA can be a huge benefit to the development team in identifying potential issues
    with third-party libraries. However, without the means to provide an updated library
    in a short period of'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'time the development team will be stuck knowingly running a vulnerable library.
    Finding out whether something vulnerable in a direct dependency or a transitive
    dependency can by difficult and often requires the development team to debug or
    do a thorough code review to determine whether the application is truly vulnerable.
    Once the vulnerability has been confirmed, the most likely resolution is to upgrade
    to the latest release of the library. Rarely is it possible to “neuter” the library
    so that the application is no longer susceptible.


    One other drawback of SCA is that the majority of them rely on known weaknesses,
    primarily from sources like the National Vulnerability Database (NVD) that catalogs
    known vulnerabilities through a common language called the Common Vulnerability
    Enumeration (CVE). These identified vulnerabilities are submitted through various
    sources and made available for consumption by tools. You can see more by going
    to the https://nvd.nist.gov/ and review the latest opened vulnerabilities, review
    older ones, and search by component. What needs to be considered with SCA tools
    that report CVE’s is that this is only for the known vulnerabilities and does
    not cover zero-day vulnerabilities in a library. This is where the vulnerability
    has not been reported and therefore there is no fix that can be released.


    As mentioned, this is all great information, but without being able to act on
    the information the organization is only able to know that they are running in
    a vulnerable state. We’ll talk more about DevSecOps in future chapters, but the
    critical takeaway here for SCA is to know that once a library has been detected
    as being insecure, a path to deliver the newer and more secure version of the
    software needs to be quick and clearly defined.


    SCA is one critical component in the defense in depth model to provide not just
    security scanning, but also aid in the collection and cataloging of the various
    libraries used by an application.


    # EXERCISE


    +   1. Find a CVE on the NVD. You can find CVE''s by browsing by Year and Month.
    Click on an individual CVE to get the information on that specific vulnerability.

    +   2. Use the following CVSS Examples

    +   3. Use the CVSS Scoring Calculator to determine the CVSS v3.0 Base Score.

    +   4. Document your finding using the following format on the CVS Examples Site:

    +      a) What''s the Vulnerability?

    +      b) What''s the Attack?

    +      c) What is the CVSS v3.0 Base Score'

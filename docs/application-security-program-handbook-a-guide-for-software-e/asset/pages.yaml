- pgno: 138
  md: 'However, Dashing Danielle is not able to rest on her laurels at this point,
    it’s now time to do the hard work of driving the change across the organization.
    Although the ARB has approved this standard, it’s up to Dashing Danielle to help
    drive the change across the organization. With the data that she gathered as part
    of the development of the standard, she begins to work with the customer services
    teams to develop a communication plan to the customers. She works with the operational

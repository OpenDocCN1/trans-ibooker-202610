  img_proc: true
- pgno: 108
  md: 'Additionally, as infrastructure is today being setup and configured as code,
    called Infrastructure as Code (IaC), there is a unique opportunity to apply a
    consistent approach to secure infrastructure, but in order to do this the organization
    needs to have a method of monitoring for configuration drift. This is where a
    single change is made in a production environment, often through manual means,
    which varies from the IaC templates that the organization normally uses.


    Considering these practices when developing the pipeline will give the organization
    the better protection against the deluge of vulnerabilities. Practices aren’t
    always enough. Having the right tools integrated at the right time matters as
    well.


    # 4.2.5 DevSecOps Example


    Taking the example of Superior Products, they have been using the DevOps methodology
    for some time and their development teams consist of developers, testers, operational
    people and, of course, Dashing Danielle. She has worked tirelessly over the past
    few months building in the following tools and processes:


    +   - SAST (static application security testing) has been integrated into the
    developers IDE (integrated development environment) where the developer has the
    opportunity to scan their code for security issues early.

    +   - SCA (software composition analysis) is integrated into the IDE as well as
    in each developer’s browser as a plugin. The IDE integration allows for the developer
    to identify issues in the third-party libraries that they are using in the building
    of their software. The browser plugin allows the developer to research new libraries
    with confidence that there are no known security vulnerabilities impacting the
    library they are reviewing

    +   - When the developer issues a pull request to submit code, they code repository
    tool requires the developer to submit the results of their SCA and SAST in the
    pull request.

    +   - The Continuous Integration tools have SAST and SCA tools enabled that incrementally
    scan the code changed when the developers code is integrated with additional code
    changes from other developers.

    +   - DAST (dynamic analysis security testing) is integrated into the testing
    environment to ensure that once the code is integrated and deployed to the testing
    environment, security test used to scan while the application is running are triggered.
    This also includes the use of automated penetration testing tools to augment the
    DAST scan.

    +   - Dashing Danielle integrated the ticketing system that is used in Superior
    Products so that any tools that identifies a security issue will generate a defect,
    assign it to the appropriate development team, and alert them of a new finding
    on their collaboration channels. The defect is opened with recommendations from
    the scanning tools on how to resolve the found issue.


    This setup allows Superior Products to rapidly identify security issues, get them
    to the right team, provide resources on how to resolve, a criticality and timeline
    for resolution based on the organizations resolution policy. This well-oiled machine
    is capable of finding and resolving security issues rapidly before the code is
    deployed to production.'

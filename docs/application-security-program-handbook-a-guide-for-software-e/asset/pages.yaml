- pgno: 96
  md: '# 3.8 Summary


    +   - Threat modeling is the process of identifying threats that may impact an
    architecture. It''s used to understand the who, what, why, how, and counter measures
    as it relates to threats.

    +   - There are two prominent methods to performing threat models. One through
    a manual process, the other by using tools.

    +   - Analysis tools throughout the software development lifecycle provide feedback
    to the development team as early as possible. These tools are used to find issues
    in static code, running applications, and in the software components that are
    used to build the final product.

    +   - Developer security tools are used to give developers quick access to potential
    vulnerabilities as early as possible. Many of these are available as plug-ins
    within the developers IDE.

    +   - Run-time protection tools are used to provide protection when an application
    has been deployed to a production environment. Two of these tools are RASP and
    WAF.

    +   - Penetration testing is the closest method to mimic an actual attack by a
    threat actor. These tests are performed by skilled people who are able to locate
    weaknesses in the application within scope.

    +   - Vulnerability management becomes quickly overwhelming when multiple tools
    are finding vulnerabilities. The organization needs a common approach that builds
    confidence in the data and enables developers to act on the information. This
    gives the organization the greatest chance of getting ahead of the vulnerabilities.

    +   - Bug bounty and vulnerability disclosure programs provide an avenue for researchers
    that are external to the organization to submit reports that identify vulnerabilities
    within the scope that the organization has provided. In the BBP, researchers are
    paid for their findings.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# 4

    Releasing secure code


    # This chapter covers:


    +   - How organizations can release secure code leveraging people, process, and
    technology.

    +   - What a DevSecOps pipeline looks like and why it supports security better
    than other release methods.

    +   - What differentiates a DevOps model compared to other models like Waterfall,
    Agile, Lean.

    +   - How to take advantage of a fast feedback loop in order to provide security
    issues to the development team as rapidly as possible.


    In this chapter I will show some of release methods that are in practice in most
    organizations. While some of these methods have been in practice for a long time,
    they can still be found in most organizations. While each have their pros and
    cons, release methods such as DevOps can support a more secure method of delivering
    software. If you are not familiar with DevOps, it is a set of practices that bring
    together development and operations to deliver software in an efficient manner.


    > DEFINITION Microsoft defines DevOps as a compound of development (Dev) and operations
    (Ops). DevOps is the union of people, process, and technology to continually provide
    value to customers.


    What has been historically the case for software development and release is that
    there is a product team, a development team, a testing team, and an operational
    team that all take part in the delivery of features and products to a production
    environment. This is typically done in a way where each team has gates that start
    and finish their part of the process. DevOps intends to streamline that process
    and reduce or eliminate the hand-offs between teams. Most organizations will accomplish
    this by creating a single team that owns not just the development of the code,
    but the testing and delivery as well. In some smaller organizations there may
    only be a few people on the team that do all of these activities'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'themselves, in larger organizations specialists would be used to perform specific
    tasks within the team. For instance, in these larger teams, there would be one
    or more people focused solely on the deployment, or just the testing, as well
    as having developers focused on the code. However, in all of these cases, the
    team would share the work items as one team.


    DevOps is primarily a function of automation, tooling, and processes. This model
    works best when there is little to no manual work or processes. Some of the most
    successful organizations that use a DevOps model are able to deploy code from
    a development environment to a production environment in minutes. And they can
    do this multiple times a day. To achieve this level of speed and confidence, the
    organization will build a CI/CD pipeline.


    > DEFINITION A CI/CD pipeline is where code is continuously integrated (CI) using
    an integration tool like Jenkins, and continuously delivered or deployed (CD)
    using deployment tools like Octopus or Ansible. Code is built into packages that
    are automatically pushed to a production environment (continuously deployed) or
    could require a manual step to push code to production (continuously delivered).


    The confidence in deployment is built in through strong controls around how source
    code is tracked, merged, and versioned. Testing must occur all throughout this
    model, from the developer’s unit test at the lowest level, up to the testing of
    API integration and system testing. Lastly, monitoring of the application in production
    for potential issues and having a rapid feedback loop to the development team
    will reduce the time to fix issues as they are found. This gives greater confidence
    to the development team that they can deploy and fix code rapidly. This certainly
    enables the developer to feel empowered, but where does security fit?


    # 4.1 Security in DevOps


    The general appeal of DevOps is that it allows for a rapid resolution of discovered
    issues. As an application security person myself, this makes me happy. This means
    that if the developer has the right information and knows how to resolve a vulnerability,
    then they can fix a vulnerability and have it running in production in a short
    period of time. Maybe even within a day! But getting to this point requires a
    few things to be in place and working well. Without getting into the specific
    tools, a successful DevSecOps pipeline provides the following capabilities:


    +   - Educating, enabling, and empowering the development team to make security
    decisions during the development process.

    +   - Fewer security gates in favor of a faster more targeted testing using automation.

    +   - Vulnerability management that provides a fast discover>triage>report>resolve
    process.


    I’ll break each of these down here in this chapter. But first it’s important to
    understand that the basic security tools and processes that I’ve covered in the
    previous chapters still hold true even in a DevOps model. There is still room
    for threat modeling, SAST, and penetration testing for example. However, where
    they are integrated and by whom changes.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# 4.1.1 DevOps pipelines


    As described previously, a DevOps pipeline consists of automation that integrates
    and delivers code to a production environment. The tools that are part of that
    pipeline vary in each organization, but the fundamental pipeline for code to be
    delivered will resemble figure 4.1.


    # Common DevOps Pipeline


    ![](img/cc84747f93d290964598894b4f5c153b_99_0.png)


    Figure 4.1 Standard components of a DevOps pipeline


    In figure 4.1 the automation occurs at every step with the exception unless the
    organization has decided to add a manual step for deployment. For simplicity,
    in the rest of this chapter we will assume continuous deployment where the code
    is sent to production automatically as long as it has cleared all automated testing
    and checks.


    For the pipeline as shown in figure 4.1 the code goes through the following process:


    +   - The code is committed by the developer once they have completed development.

    +   - It enters a build process that pulls together the different libraries and
    components together in order to create the application.

    +   - The unit tests are run that test the code changes for any potential regression
    issues.

    +   - If the build and test complete on the local level the code is merged to
    a trunk where additional tests are initiated in order to perform tests with the
    code change in the context of other components of the overall system, like API’s
    and other products in the organization.

    +   - If the merge and integration testing complete without failure, then the
    artifact like a jar, or war file are deployed to a pre-production environment
    where additional testing is run as the final stage prior to production.

    +   - Lastly, assuming that there are no issues found in the pre-production environment,
    the artifact is delivered to a production environment and is now live for customer
    interaction.


    At each stage of the pipeline the processes and tools ensure that all checks are
    complete before it is moved to the next stage. For instance, if the build breaks
    in the developer’s environment, then unit tests are not triggered. Likewise, if
    integration tests fail, then the code is not delivered to a pre-production environment.
    This model moves code rapidly through the system with each component tied to the
    next through automation. Although there are many steps in figure 4.1, some organizations
    can accomplish most or all of these steps through one platform and can do so rapidly.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'NOTE. GitLab is a common platform that can perform most of these components
    allowing organizations to build, test, deploy, and monitor their application.


    This process of code deployment can occur many times a week, a day, or an hour.
    With each release bringing new features to customers at a rapid pace.


    # 4.2 DevOps isn’t the only game in town


    There are many different processes and models to release software. Similar to
    choosing the right security controls that align to the actual risk it is attempting
    to protect, the right release methodology needs to be in line with the organization’s
    goals. If you are an organization that needs to release software multiple times
    a day like Facebook, Amazon, Netflix, or Google do then a DevOps model works well.
    If you are an organization that requires more strict control over your code releases
    like a healthcare, or critical infrastructure organization a Lean or Waterfall
    methodology may work better. The important takeaway with these different methods
    is that every organization approaches their release cycle differently. In fact,
    in many organizations, they will not follow just one approach across the organization.
    There may be some teams following a DevOps model while others are Lean. I will
    describe these methodologies next.


    # 4.2.1 Waterfall


    The Waterfall methodology is a methodology that depends on each part of the process
    acting as a checkpoint where formal signoff must be achieved before the next part
    of the process can begin. This, of course, leads to a long deployment process
    and can have the impact of the organization releases features that are no longer
    considered cutting edge.


    In a typical Waterfall model, there are several stages. Much of this will sound
    familiar to what has been described in previous chapters. This is largely due
    to the fact that the many organizations built their application security programs
    while their engineering teams still worked in a Waterfall methodology.


    +   - Requirements gathering where product requirements from the client or internally
    within the organization are defined and documented.

    +   - The Analysis phase is where the scaffolding of the application is defined
    including the database schema and business rules that will govern the way the
    application works. For instance, that the application will require authorization
    from an administrator for certain critical functions.

    +   - The Design phase begins to build the architecture of the application and
    makes key decisions on technology.

    +   - Coding is where the real fun begins. Everything to this stage has been to
    clearly define what needs to be created while coding.

    +   - The Testing phase is when code has been considered complete and begins to
    go through the process of testing which is likely to uncover defects that will
    need to be resolved before the final product reaches production.

    +   - The Operations phase is where the operations team takes over an ensures
    the uptime and patching of the application as it’s running.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Waterfall Methodology


    ![](img/cc84747f93d290964598894b4f5c153b_101_0.png)


    Figure 4.2 Waterfall methodology


    Once these phases complete and the code is running in production, the process
    starts again with a new set of requirements. The release could have been a monthly,
    quarterly, or even a bi-annual release. These releases tend to be large with many
    features, hence the heavy process to ensure that everything is accounted for and
    production ready. However, in this process, there is typically a part of the development
    team that is needed to manage the incoming production defects. They process these
    defects and push fixes to production in something like a fix pack, but still with
    the proper oversight of a change control entity that ensures that changes are
    properly considered by an audience of stakeholders.


    Security in Waterfall is handled primarily through two avenues. One is through
    the methodology itself during the requirements gathering, the design phase, as
    well as the testing phase where the security team or tools within the organization
    will impose security. Some of the requirements that are pressed may be part of
    regulatory, compliance, or contractual needs. New security technology will also
    be required by the security team if it provides better protection for the organization.
    The security tools that are either integrated with the development environment,
    or during the testing phase, will uncover different security issues that will
    be treated as defects where they will be triaged, assigned, and resolved.


    The second way that security makes it into the Waterfall methodology is through
    the support path. If a vulnerability is found in production the support team will
    typically be alerted and required to triage and resolve it in a fix release. This
    is true for not only issues that may be reported by external parties, like clients,
    but also for issues that are discovered when components that are used in the application
    become vulnerable. This can happen when a weakness is discovered in something
    like the web server, or a parsing library that has a'

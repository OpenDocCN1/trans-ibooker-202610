- pgno: 74
  md: '# 3.1.6 Threat modeling using a tool


    Just like with the manual method of threat modeling, there are several options
    when it comes to tools that can be used to develop a threat model. Each of these
    tools has their own benefits and drawbacks. Some are free, some are commercial
    tools, some can even be as simple as using a graphical tool to just draw the architecture
    and annotate the potential threats. One of the biggest benefits of using a threat
    modeling tool that is purpose built to define threats is that they will identify
    the threats for you making these tools more efficient at identifying issues. The
    results should still be reviewed with the appropriate stakeholders to ensure that
    the findings are indeed valid.


    **THREAT MODELING TOOLS** Take some time to review the available tools that are
    out there for threat modeling. There are several commercial ones Like SecuriCad,
    ThreatModeler, and Irius Risk. However, this corner of application security has
    fewer tools and less mature ones than in other spaces. Two threat modeling tools
    that are freely available are the Microsoft Threat Modeling Tool and Threat Dragon
    by OWASP.


    Both Microsoft Threat Modeling Tool (https://docs.microsoft.com/en-us/azure/security/develop/threat-modeling-tool)
    and Threat Dragon by OWASP (https://owasp.org/www-project-threat-dragon/) offer
    the ability to drag-and-drop items to a board in order to build the architecture
    out and show the dataflow. From there, each will generate a list of potential
    threats to the architecture. A simple diagram from OWASP Threat Dragon is shown
    below.


    # OWASP Threat Dragon – Simple Diagram


    ![](img/cc84747f93d290964598894b4f5c153b_74_0.png)


    Figure 3.3 – Simple diagram from OWASP Threat Dragon


    Threat Dragon can place threats in the STRIDE model, and with this simple diagram
    there are two simple threats identified automatically by the tool. One is related
    to spoofing and the'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'other repudiation. Both are on the interaction between the actor and the process.
    What this means is that there is potential for the actor to impersonate another
    user and potentially access components of the system that they would not typically
    be allowed to do. To fix this, the application must put in place a means of authenticating
    the user and knowing that it is indeed the correct user.


    I won’t go through the steps of the threat model using one of these tools since
    the effort is similar to what I described in the previous section using the manual
    method. With a tool in hand, the organization can scale the threat modeling process
    and centralize the review and storage of the threat model. This also allows the
    organization to threat model reusable components once. For instance, many of the
    applications in an organization may use the same authentication architecture.
    In this case the organization can threat model the authentication once and reuse
    that threat model for each application.


    Using the example of Superior products, Dashing Danielle has reviewed several
    commercial tools for threat modeling, and has decided that the best tool for the
    job, and budget, is OWASP’s Threat Dragon. She has created a process diagram and
    documentation that walks the developer through the use of Threat Dragon. She created
    a repository where all threat models from Threat Dragon will be stored.


    # Side notes about using a threat model tool


    This approach to decentralizing and democratizing threat modeling with a tool
    allows for most technical resources in the organization to create a threat model
    using something like Threat Dragon. If an application security resource creates
    it, they will review their model with the engineering team. If a resource from
    the engineering team creates their own threat model, then it will be assigned
    to the application security team for review in the repository.


    Dashing Danielle begins to gather the information on the common architecture that
    is used in Superior Products so that she can threat model those architectures
    and determine the open threats in order to get them remediated. Once she completes
    the threat modeling of the common architectures, she works with some of the resources
    in the engineering organization to evaluate her findings to make sure she was
    not missing anything. She also discusses the remediation options for the open
    threats that are found. Taking the feature that was used in the manual threat
    modeling session, she works with the appropriate engineering team to define the

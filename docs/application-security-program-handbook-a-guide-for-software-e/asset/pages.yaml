  md: 'address space layout randomization is set at the operating system level where
    memory is randomized to limit the ability of malicious activity from finding specific
    addresses to jump to.


    Enclaves can be used at the system level that ensures that the data in use is
    encrypted and only available to the CPU or CPU cache at read time, but at all
    other times it is encrypted and not readable to any other parts of the system.
    One other protection method worth mentioning is the ability for the CPU to manage
    encryption keys in a register as opposed to the keys being stored in RAM. This
    makes the window of opportunity smaller for an attacker or malicious code to access
    encryption keys.


    # 2.2.7 Not so confidential


    Hardly a day goes by where a breach or some type of cyber event occurs. A breach
    of confidentiality means that the data that was intended to stay confidential
    or restricted was released unintentionally. This can occur through malicious activity,
    or accidental release.


    Email is a quick and efficient method of leaking data. While information contained
    in an email can be concerning, it’s also important to know that by most standards,
    an email address alone is considered PII. In February of 2020 the father of U.K.
    Prime Minister Boris Johnson caused a bit of an international stir when he accidentally
    copied the BBC on an email to British officials regarding the lack of contact
    between Boris Johnson and the Chinese state over the coronavirus outbreak. Later
    that year, Australia’s Department of Foreign Affairs and Trade exposed 1,000 citizens
    personal data when an employee failed to use BCC to send information regarding
    emergency loans and reentry quotas for citizens stuck in other countries due to
    coronavirus restrictions.


    However, where email is an excellent avenue for leaking information, it tends
    to be smaller than the big breaches. In May of 2021 the company Peloton who makes
    connected exercise equipment and is most famous for their high-end stationary
    bicycles, had to release a statement regarding an application program interface
    (API) that allowed anyone to pull private data from Peloton’s servers, even if
    the users profile was set to private. This API allowed unauthenticated access,
    meaning that you did not have to have an account or special access. Peloton initially
    only limited access to the API to users with a Peloton account, however, this
    only limited the audience, and anyone could sign up for a Peloton account and
    access the API to gather the personal information of other users. Eventually Peloton
    corrected the authentication issue fully, but they were not able to confirm or
    deny whether their over three million users had their data accesses or stolen
    due to the issue.


    # 2.2.8 Do I even need this?


    You may be familiar with Marie Kondo who is famous for her show on Netflix called
    "Tidying Up." She uses the KonMari Method to identify things that you should keep
    and things you should get rid of. Often, she asks the question: "Does this spark
    joy?" What does this have to do with security and specifically data security?
    One of the first things I usually ask when I get involved with reviewing security
    decisions and architecture that involves sensitive data is whether the data needs
    to actually be collected and retained. If you don’t need to keep it or act upon
    it, then you don’t need to worry about securing it. To be clear, securing it means
    more cost and effort. Something that not many product owners will be willing to
    spend if'

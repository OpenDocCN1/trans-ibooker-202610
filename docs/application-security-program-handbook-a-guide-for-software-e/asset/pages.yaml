- pgno: 105
  md: '![](img/cc84747f93d290964598894b4f5c153b_105_0.png)


    Figure 4.4 Lean process diagram


    How does application security work inside of a Lean methodology? Security involves
    many different aspects including application, infrastructure, and business risk.
    Because these aspects are so vast, identifying and prioritizing the security risks
    has become more complex and manual. In the Lean world, this may amount to potential
    wastes and rework. Lean in application security should be used to unblock security
    processes and procedures and insert security into the software development life
    cycle. This is accomplished by aligning security practices into software development
    that will increase participation and reduce rework by incorporating security requirements
    and practices during requirements, analysis and design phases. In addition, Lean
    in security includes establishing security monitoring and continuous improvements
    as the product evolves and mature through the software development life cycle.


    One important callout related to Lean in application security is that it works
    well with other software development methodologies such as DevOps and Agile considering
    that Lean is an approach that looks for continuous process improvement. As mentioned
    with other methodologies, the tools that are used elsewhere to provide security
    are still applicable here. Threat modeling, code reviews, test automation, monitoring
    are all still needed to provide assurance that security is baked into the product
    when it is delivered to the customer. The major difference is the focus on a "test
    and learn" approach that attempts to continuously review the security processes
    in each stage in order to understand where improvements should be made. An example
    of this would be in the case of threat modeling. When performing a threat model,
    regardless of the methodology, it’s important to validate that the model is accurate.
    After a recently completed threat model for an application, it may be'

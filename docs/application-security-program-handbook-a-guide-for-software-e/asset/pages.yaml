- pgno: 116
  md: '| Tool | Pro''s | Con''s |

    |---|---|---|

    | **SAST (Static Application Security Testing)** | - Can find line number where
    issue exists

    - Applied early in the lifecycle

    - Can make remediation recommendations | - Tool may not support all languages
    in the organization.

    - Can produce many false positives.

    - Does not see the code while it''s running. |

    | **DAST (Dynamic Application Security Testing)** | - Not language or technology
    dependent

    - Not as many false positives as SAST

    - Can test software you don''t own | - Can''t always locate the impacted line
    of code

    - Can''t find code specific issues

    - Found later in the SDLC |

    | **IAST (Interactive Application Security Testing)** | - Agents or library that
    is continuously monitoring

    - Lower cases of false positives

    - Works well in DevSecOps | - More difficult to deploy and maintain.

    - Potential development work in order to integrate it

    - Can usually only see something as it''s tested |


    As I previously mentioned, DAST can be run in a production environment, but this
    not recommended as it can have unforeseen impacts such as availability issues
    or corruption of data. There are options to have DAST run less destructive testing,
    but the organization needs to weigh the cost and benefit. Another alternative
    reason for running DAST in production would be for testing the security tooling
    and alerting for the security organization. Perhaps the organization would like
    to learn whether the security operations center (SOC) is able to detect incoming
    attacks. Otherwise, so long as the organization has confidence that its pre-production
    environment mirrors its production environment (and it really should) then running
    DAST in the pre-production environment should suffice.


    > **NOTE** In reality, most organizations will only choose one lower environment
    to run these types of tools. License cost can quickly explode if you are being
    charged "per environment". It depends on the vendor and their license structure.


    # 4.3.4 SCA in DevSecOps


    As I covered in previous chapters, software composition analysis (SCA) is used
    to detect issues with libraries used to build the application that are from a
    source outside of the organization. These are typically libraries that are from
    third-party sources or within the frameworks used to build and run the application.
    An example would be log4j used by Apache as a logging framework. Frequently, these
    third-party libraries will be found to have vulnerabilities in their code that
    require patching. Nothing different than what any organization would do if they
    found a security issue within their own code that required a'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'patch. In order for an organization to resolve this issue that was found in
    the third-party library, they will need to package the latest, non-vulnerable
    version of the library in their own application. SCA tools are used to match the
    third-party libraries that are used in the application against a list of known
    vulnerable libraries that are publicly disclosed. Usually on a well-managed repository
    like the National Vulnerability Database. It should be no surprise that the earlier
    in the process that this can be completed, the better for the organization as
    a change in a library could mean a redesign of the application depending on the
    library.


    What this means in the DevSecOps pipeline is that the developer needs access to
    information regarding the safety of the libraries that they are considering and
    packaging within their application. This can be accomplished in a few ways. Most
    vendors today have IDE plugins or even browser plugins that will let the developer
    know that the library they are reviewing or about to leverage in their application
    has a known vulnerability associated with it. Keep in mind that with SCA, the
    library must have a known weakness, usually in the form of a published CVE that
    is reported in the National Vulnerability Database (NVD). Some SCA vendors will
    have their own process for detecting weak libraries, but all of them will leverage
    a public repository like the NVD to locate known CVE''s that are associated with
    the library.


    ![](img/cc84747f93d290964598894b4f5c153b_117_0.png)


    Figure 4.10 SCA in DevSecOps


    With this early access to CVE information, the developer can make the decision
    to use a non-vulnerable version of the software prior to even writing the first
    line of code that integrates that library into the application. However, new CVEs
    are being released daily. This constant flood means that the day after a developer
    has chosen a secure library to use, it could become vulnerable to a newly discovered
    issue. Or worse, this can and usually does happen when the library is already
    packaged and deployed to an environment. This is where the rest of the DevSecOps
    pipeline needs to pick up the burden. As with the other tools in the DevSecOps
    pipeline, the earlier in the process, the better. Once the code has been committed
    to a branch the integration server that performs the build and test tasks needs
    to perform the task of calling the integrated SCA tool, usually through an API,
    to determine if any of the libraries in the software bill of material (SBOM) are
    considered vulnerable. During this build process, any finding can be resolved
    by breaking the build and requiring a change to the library.


    This sounds great, but you’re probably already thinking about the implications
    of finding a vulnerability at this stage in the development pipeline. If you checked
    in the code and you have a library that has been identified as vulnerable, it
    will be difficult to package and test a new library in a short period of time.
    Additionally, there may not be an immediate path to a secure library. In other
    words, there may be a library with no secure version released yet.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'This is where a robust risk management process needs to be in place. Knowing
    what the application risk appetite is and the organizations overall risk appetite
    means that the team can prioritize a resolution that matches their risk. For instance,
    consider a found vulnerability in a library that is used by one of the applications
    at Superior Products. The library is used to provide a graphing function in the
    UI to display charts. The particular vulnerability is related to how the graph
    is rendered. After the build is broken due to this finding by the SCA tool, Dashing
    Danielle reviews it and recognizes that this particular rendering function is
    not actually being used in the application, as they are using the library for
    a different purpose. With this in mind the risk is identified as being a low risk
    and the build is allowed to proceed after the application security provides what’s
    called a waiver, meaning that the build can proceed for a set period of time.
    When the waiver expires the build will be broken again but this buys the development
    team time to provide a secure library once it is available.


    # 4.3.5 Run-time protection in DevSecOps


    Run-time application self-protection (RASP) and web application firewalls (WAF)
    play an important part in the protection of the application once it is running
    in a production environment. Throughout the DevSecOps pipeline, the goal is minimizing
    the risk to the organization as code is deployed at a rapid pace. When the organization
    either cannot catch an issue before it is released to production, or an issue
    is found after the code has been released, the organization then needs to rely
    on run-time protection to limit the risk.


    As mentioned, the best approach in the DevSecOps pipeline is to perform incremental
    scans using the security tools as early in the process as possible in order to
    locate and resolve issues as close to when the code is being developed as possible.
    As the code progresses, the security scanning becomes more aggressive to locate
    any issues that require more overall application visibility.


    However, at some point the code needs to make its way to a production environment
    where it will face the test of real-world attacks. This is where protection mechanisms
    are required to provide defenses against attacks that were not found earlier in
    the development lifecycle. Not all of these attacks could even be found during
    the earlier stages of the lifecycle. Novel means of attack are constantly being
    developed by attackers which means that the scanning of the application is simply
    not enough. A prime example is the fact that many attackers will leverage multiple
    vulnerabilities chained together to compromise a system. Meaning that it’s more
    than just a single critical, but instead it could be a few lows that turn out
    to be the culprit in an organization’s compromise.


    ![](img/cc84747f93d290964598894b4f5c153b_118_0.png)


    Figure 4.11 Run-time protection in DevSecOps'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'One of the key features of run-time protection tools like a WAF is that many
    are offered as software as a service (SaaS). This means that the management of
    the tool is transferred to a third-party who hosts the software. The organization
    can also choose to host their own WAF within their network, but there is an increased
    cost of managing the internal WAF. This SaaS based WAF has its benefits and drawbacks.
    When a new attack method or vulnerability is identified, the third-party is generally
    responsible for delivering a ruleset in the WAF to protect the application going
    forward. If the WAF is internally maintained, then the security or the operations
    team will be responsible for delivering the new ruleset from the vendor. One way
    is no better or worse than the other in the DevSecOps model, it’s just important
    to know that the management and the timing of when the rulesets are delivered
    to the WAF need to be considered.


    With RASP, by its nature, it is integrated with the application and runs alongside
    of it. This means that there is no SaaS offering and the DevSecOps team is required
    to ensure that it is functioning and up to date. New rulesets may come in from
    the vendor of the RASP tool, but similar to the WAF, the team will need to ensure
    that the rulesets are deployed and do not create a performance or availability
    issue. Additionally, as new attacks are discovered, it is up to the organization
    to integrate those signatures into the RASP or WAF. For example, the organization
    may see a specific type of attack that is not related to the generic rules that
    are applied by the vendor of either a RASP or WAF. This specific attack might
    only impact the organization or the industry they are in, as in the case of a
    coordinated attack against something like a sports betting application that shares
    a common technology stack with other sprots betting applications. In this case,
    if there is a coordinated attack against sports betting with a specific exploit
    that is only being leveraged against this industry, then the organizations will
    want the ability to deploy custom rules that can block these incoming attacks
    quickly. This assumes that the vendor does not have a generic rule to block the
    exploit.


    For both WAF and RASP, one of the key considerations is the testing of any new
    rulesets that are deployed. As I mentioned previously, most organizations will
    not use multiple licenses in their protection tools to test multiple lower environments.
    Especially for run-time protection tools, you are only getting the benefit from
    them when you are running them in an environment that has the potential to see
    and block active attacks. These lower environments are not likely to see external
    attacks unless they are open to internet to allow customers to test in them, or
    they are used in penetration testing. One recommendation is to have these runtime
    tools in a pre-production environment where broad testing is done to ensure that
    a new ruleset that is enabled in the tools does not create a regression issue.
    The most common issues are where the new rules block legitimate traffic or otherwise
    case the application to no longer function as expected.


    With these tools deployed and providing protection for the application, the DevSecOps
    team will have more confidence in delivering new features to production


    # 4.3.6 Security orchestration


    Application security orchestration and correlation (ASOC) was introduced as a
    concept in 2019 by Gartner.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'DEFINITION Gartner defines ASOC tools as those that "streamline software vulnerability
    testing and remediation by automating workflows. They automate security testing
    by ingesting data from multiple sources (static, dynamic, and interactive [SAST/DAST/IAST];
    software composition analysis [SCA]; vulnerability assessments; and others) into
    a database. ASOC tools correlate and analyze findings to centralize and prioritize
    remediation efforts. They act as a management layer between application development
    and security testing tools."


    ASOC is a combination of two different tools that both assist in the DevSecOps
    pipeline. One is the application vulnerability correlation (AVC) and the other
    is the application security testing orchestrations (ASTO). AVC tools ingest vulnerability
    information from multiple sources so that the vulnerabilities can be de-duplicated
    automatically therefore reducing the amount of time and effort that the team has
    to spend in doing this work manually. ASTO tools can orchestrate and automate
    multiple commercial security tools in the DevOps pipeline in order to ensure that
    security testing is not only happening but that it is integrated with the continuous
    integration platform that the organization is using.


    # ASOC in a DevSecOps Pipeling


    ![](img/cc84747f93d290964598894b4f5c153b_120_0.png)


    Figure 4.12 ASOC in the DevSecOps Pipeline


    ASOC tools are becoming more prevalent as vendors are recognizing the need to
    provide this capability to the organizations that are looking to integrate the
    following capabilities in the DevSecOps pipeline:


    +   - Correlation and analysis of vulnerability information multiple application
    security testing tools like SAST, DAST, IAST and others.

    +   - Integration with defect-tracking tools that are used by the development
    organization to address defects and vulnerabilities.

    +   - Integration with CI/CD tools and platforms used by the development organization
    to build and deploy their applications.

    +   - Rapid speed and accuracy of results to reduce the noise. Ideally, the vendor
    will leverage some level of artificial intelligence or machine learning to help
    reduce false positives and provide more actionable results.

    +   - Reporting that can be used to measure an organizations success with reducing
    new vulnerabilities.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'ASOC can simplify the prioritization process by discovering whether the vulnerability
    is applicable and then assigning a criticality to it so that it can be prioritized.
    If the ASOC tool is using machine learning (ML) it may look to see how past responses
    to vulnerabilities may influence future behavior. Additionally, when the ASOC
    is integrated with the defect tracking tool used by the development team, they
    can be sure that the results they receive are actionable. This also allows the
    application security team to see vulnerabilities across the organization and build
    reports that are valuable to leadership. As described an ASOC fits well in the
    DevSecOps methodology given it ability to automate, deliver quality results, and
    provide a single pane of glass across the organization.


    # 4.3.7 Security education


    Security education is near and dear to my heart. It’s the underdog when it comes
    to security process, tools, and technology. Why is this important for DevSecOps?
    Simple. Having security minded developers and operational people when decisions
    are being made rapidly reduces the burden on the application security team and
    helps to deliver more secure code from the start.


    When most people hear security education they think about the video or slide material
    with a quiz at the end. This is still widely used across probably all organizations
    at some level. Although there is a time and place for this type of training, it’s
    not effective for raising the security IQ of the organization in a sustained manner.
    This only occurs when the organization has invested in a training platform that
    can deliver training on-demand, or even better, at the time when an issue is discovered.
    Some technology solutions can integrate with defect tracking tools in order to
    provide a link to application security training modules for the specific vulnerability
    that was found. For instance, perhaps a SQL injection vulnerability was found
    in a penetration test. When the application security team opens the vulnerability
    in the defect tracking tool the application security training module can detect
    that the ticket was opened and add a link to the training platform so that the
    developer has access to information on how to resolve the found SQL injection.


    One of the key conditions of training is it must be quick and to the point. Most
    of us get pretty aggravated when we have to sit through not just boring, but also
    long, training. The most effective training is timely, brief, and often if necessary.
    As we’ve been talking about DevSecOps it’s important to point out that many SAST
    tools have IDE plugins that allow for coordination of vulnerability discovery
    with some quick hit training module. This allows the developer to immediately
    see why the line of code may lead to a vulnerability. These don’t need to be long
    either otherwise what keeps the developer from simply going to the internet for
    help? These quick hit modules should be just a few minutes long and in the language
    of the developer. No corny videos please.


    To augment this quick hit training, it’s important to ensure that more traditional
    training is still available. However, not all security education needs to be death
    by PowerPoint. Many of training platforms today are engaging and approachable
    by a potentially hostile audience. However, the organization has other options
    for delivering security training. Some application security training platforms
    offer the option to host tournaments that will provide a training ground for a
    large group of developers where they can test their skills in something like a
    hack-a-thon. Other platforms offer gamified training that intends on providing
    training where'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'the learner has the ability to test their skills right there and then through
    training that provides real world, hands on, scenarios.


    Some large organizations will host internal developer conferences that include
    a security component. This provides a platform for the security organization to
    showcase some of the new technology and processes that are working around the
    organization. This is even more effective when development teams bring their experiences
    with security and show how it has better enabled them while making them more secure.
    It’s worth mentioning that the organization doesn’t have to draw on their internal
    resources exclusively. Brining in security speakers from the outside is also helpful
    in showing with some of the organization’s peers are doing. This is a great example
    of where you can generally get free, or near free, security awareness.


    The biggest payoff with developer training is that it reduces the burden on the
    rest of the organization and application security team. Anyone that has run an
    application security function will tell you that there is no way your team can
    scale to cover all the various applications and areas of concern. The team must
    rely on the organization to build security in when they are developing code and
    the tools that are layered into the development lifecycle can only do so much.
    Secure code starts with security minded developers.


    # 4.4 Feedback Loop


    One of the unique features of DevSecOps is that it is a constantly moving pipeline.
    This means that in a mature DevSecOps pipeline, there will always be code moving
    through the various parts of the assembly line until it is deployed to production.
    The security gates are gone from the process. So how do we make sure that developers
    are getting the feedback, the code is secure, and the organization is safe from
    increased risk?


    ![](img/cc84747f93d290964598894b4f5c153b_122_0.png)


    Figure 4.13 DevSecOps feedback loop'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'To do this, the pipeline needs to have hooks throughout that provide constant
    feedback to the developer, regardless of where in the process the issue is found.
    The SAST tool running during code check-in may append the output of that analysis
    to the code check-in. The integration server will run tasks that execute security
    scans such as IAST and DAST once the code has been deployed to a workable environment.
    The output from those tools may trigger a message in the development team’s collaboration
    tool as well as automatically open a ticket in the defect tracking tool. It’s
    also possible that the organization has a policy to block a build on vulnerabilities
    of a certain type or of a certain criticality level, like a criticality of High
    or above or if it’s a SQL Injection vulnerability. In which case the build would
    break, and the developer would be notified through email or their collaboration
    tools that the build has been broken due to a change that was made during their
    check-in.


    This type of feedback loop allows for the pipeline to continue moving while performing
    an event-driven approach to the security feedback loop. This means that it is
    occurring asynchronously and does not create the more state-machine style pipeline
    where each stage is waiting on the next to complete cleanly before proceeding.
    This still needs to rely on a “go/no-go” decision before deploying to production.
    The organization may take the position that they will allow certain vulnerabilities
    of a particular level into production as long as there is a path to resolution
    in a short period of time. Say a few days. However, the more mature organization
    will not allow any discovered vulnerabilities to be delivered to a production
    environment and will require a clean production build in order for deployment
    to occur.


    As you can see, the DevSecOps pipeline serves the same purpose for two different
    work streams. On the one hand, being able to deliver value to the customer in
    a matter of hours is immensely desirable. Likewise, every security person should
    want that same capability to deliver security resolutions to the organization
    in a rapid manner. It’s a win-win.


    # 4.5 Summary


    +   - DevSecOps plays a critical role in enabling the development team to deliver
    software with confidence that security is built into their pipeline.

    +   - There are other development methodologies that can still deliver security
    but struggle to do so at the speed that is required in the modern development
    lifecycle.

    +   - DevSecOps breaks down the segmentation between the security team and the
    development team and integrates security throughout the pipeline.

    +   - The common tools used in application security still apply (threat modeling,
    SAST, DAST, IAST, RASP, and WAF). In fact, they are able to be applied earlier
    with a faster feedback loop to the development team.

    +   - Feedback loops are critical to the success of resolving found vulnerabilities
    by getting the information to the development team where they collaborate the
    most.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# 5


    # Security belongs to everyone


    This chapter covers:


    +   - Expanding application security through standards, requirements, and reference
    architecture

    +   - Building a culture of security that includes education

    +   - The maturity models that can be used in an application security program

    +   - Decentralized AppSec in software development


    Stop me if you heard this before, but security is everyone''s problem. We''ve
    all heard this many times, but what does it really mean? In my experience, the
    ability to scale an application security team to meet the need of a large organization
    is difficult if not impossible. Many of the organizations that I have worked with
    have had hundreds or even thousands of developers. In these organizations, even
    what I would consider a large application security team was no match for the sheer
    volume of work in the organization. This means that organizations must find other,
    more creative ways to bring security to the overall development of software.


    As I mentioned in previous chapters, the best defense against attackers is to
    ensure that all members of the organization are able to understand the security
    risks that the organization faces. This does not mean that everyone needs to be
    a security specialist but having at least basic security knowledge goes a long
    way. Nothing makes me happier than someone reaching out to me asking about the
    security impacts to a design choice. This means that they are at least thinking
    about security and how their choices can affect it. And I''ll admit, I don''t
    always have the answers, but being able to work through an issue with someone
    else teaches both of us. I can''t imagine that I''m the only security person who
    feels that way. Not because we''re actually wanted, but because when more people
    think this way, the security folks have the right advocates in the organization.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'Getting to this little bit of heaven takes an organization that has put the
    effort into building a culture that not only takes security seriously but thinks
    about it as much as the security teams do.


    # 5.1 Security is everyone’s problem


    I try to draw parallels when I am thinking about security, and one that comes
    to mind here is your common household. One person in the house is not generally
    the security person who goes around the house everyday making sure that the doors
    and windows are locked, that the alarm is on, the stove is off, that the cars
    are locked, and that everything in the house is secure. I suppose that might happen
    in some households, but the point is that this is not an efficient way to approach
    the security of the house. In reality, it is the responsibility of everyone in
    the house to ensure that they are considering the security and safety of the house
    and those inside. If the smoke detector is out of batteries and begins to beep,
    yes maybe the tallest person in the house has to change the battery, but others
    in the house can hear it beeping and can let the tall person know so they can
    change the battery. This is a silly example, but the point should be clear.


    In an organization, the security team should not be the only ones aware of or
    looking out for security issues. Yes, they are the ones that typically manage
    the tools and processes that manage the security risk of the organization, but
    they don’t always have 100% visibility into all the areas of the organization.
    More importantly, organizations are releasing new features, and functionality
    all the time. It is unlikely that the application security team has insight into
    those new features until they are about to be released. That is often too late
    for the application security team to react, and it becomes more of an exercise
    in reducing or accepting the identified risk than building security into the design
    early in the process.


    When the organization takes the steps to build a security culture, they will be
    able to augment the application security team and create more secure code. However,
    this requires an application security team that has built the frameworks, processes,
    tools, and education that is needed to enable the development organization to
    achieve that level of security.


    # 5.1.1 Structure of an application security team


    It is extremely difficult to hire enough resources in the application security
    team that will fit all the needs of the organization. Although every application
    security team is structured differently and has different needs, most application
    security teams provide the following core functions:


    +   - Threat modeling and risk assessment

    +   - Penetration testing

    +   - Implementing scanning tools

    +   - Triaging discovered vulnerabilities

    +   - Code and architecture review

    +   - DevSecOps and automation support

    +   - Secure education and evangelism

    +   - Documentation, whitepapers, standards, and requirements development'

    # Definition


    Each organization has a different description for common roles. Here are a few
    of the common application security roles and a brief description:


    +   - Application Security Architect – Represent the application security team
    on strategy in the organization and develop secure architecture, standards, and
    documentation.

    +   - Application Security Engineer – Work closely with the application development
    team to ensure that security is integrated in the development process for the
    development team.

    +   - DevSecOps Engineer – Take the responsibility of the application security
    engineer with the added responsibility of automating the processes in the development
    pipeline.

    +   - Penetration Tester – Provide testing of applications for security related
    issues and develop summary reports on findings.


    One last point I will make regarding hiring in application security. Sometimes
    the right person for the team has no clue about security. The application security
    team is usually operating parallel to the engineering teams they work with, which
    means that having members of the team that understand the engineering process
    is as important and, depending on the role, sometimes more important than understanding
    security. The team will need people that can integrate tools, develop and understand
    code, speak intelligently about the software development process, and operate
    and tune tools. To achieve this, the team does not always need to hire the best
    and brightest security people as these gaps need to be filled with a team that
    is diverse in thought and background.


    # 5.1.3 How to close the gap


    So, what does this mean for an organization that wants to raise their security
    posture without having to hire a massive army of penetration testers, security
    engineers, and security architects? When you can’t afford a car, but you need
    to drive to the store, find a friend that has one and borrow theirs.


    > ''Look for the helpers. You will always find people who are helping.''


    Fred Rogers


    Getting anything done in application security usually means that you will be borrowing
    time from the resources in engineering or at least working with the product and
    engineering teams to jostle for space in their releases. In most cases you will
    want to make this as transparent and open as possible. Nothing drives a manager
    crazy, me included, more than their team getting pulled into tasks that are unrelated
    to the work that they should be doing. However, security is everyone’s responsibility,
    right? It’s also the responsibility of the'

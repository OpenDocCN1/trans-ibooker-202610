- pgno: 65
  md: '# 3


    # Components of application security


    This chapter covers:


    +   - Building a threat model

    +   - Using developer tools to mitigate software security issues

    +   - Security Analysis tools used in the development pipeline

    +   - Protection tools that are available for running applications

    +   - Vulnerability collection, correlation, and prioritization

    +   - Bug Bounty and Vulnerability Disclosure programs

    +   - Where security fits in the SDLC


    So, you have seen the issues that are caused by not having application security
    integrated into your lifecycle and you’re starting to ask the great question of
    where to start. There is a not a one size fits all package that works for all
    organizations. A lot depends on the following:


    +   - Size of the organization

    +   - The industry and the regulations impacting the organization

    +   - The culture of the organization

    +   - The security budget at the organization


    It’s often easy to overlook the organizations'' culture having an impact on the
    effectiveness of the application security being applied, but this is a huge component.
    You cannot effect change if the engineering organization and the broader organization
    does not want to be more secure or is passive about security. Building security
    into the development lifecycle depends on the organizations ability to rally its
    engineers to the cause. But people in the organization can only do so much on
    their own. Providing the right tools and processes is critical to successful application
    security. Through the remainder of this chapter, I discuss several of the more
    common tools and processes that make up of a successful application'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'security program. This is by no means an exhaustive list and new tools and
    novel ways of solving application security issues are coming each year. However,
    the basics tools and processes are outlined here to give you an understanding
    of where it fits in the overall application security picture.


    # 3.1 Threat modeling


    There are many books that have been written on *threat modeling*. The intention
    of this section is to familiarize you with the different techniques and tools
    that are used to perform a threat model.


    **DEFINITION** Threat Modeling is a structured approach to identify, quantify,
    and address the security threats and risks associated with an application. It
    is an investigative technique for identifying application security risks/hazards
    that are technical (and even implementation specific). Threat modeling is an early-stage
    activity that is used to define security requirements for a design. Ideally, threat
    modeling would occur during the initial stages of the architecture development.


    **NOTE** Some additional reading that is helpful with threat modeling is Threat
    Modeling: Designing for Security by Adam Shostack https://www.amazon.com/Threat-Modeling-Designing-Adam-Shostack/dp/1118809998.


    Threat modeling is one of the most fundamental parts of security. It is not just
    a specific part of application security but is used in all parts engineering and
    security including in networking, and operational teams. It can be as simple as
    asking a question like, "What could happen if a malicious user does this?" and
    can be as elaborate as gathering the appropriate subject matter experts to review
    a complex architecture with clear action items and takeaways with a list of associated
    risks and vulnerabilities.


    The purpose of threat modeling is to identify the potential threats that might
    impact a system or architecture and define the counter measure that can be used
    to address the found risks. As I mentioned, it can be as simple as just asking
    what could happen, but more complex architecture needs more attention. Most modern
    architecture includes multiple external connections that are coming in and going
    out of the application. It may also have reusable components from other internal
    applications within the organizations. This represents a large set of moving parts
    that are often changing and present a unique challenge when completing a threat
    model as the attack surface is much larger than a simpler architecture. For these
    more complex architectures there are tools that can be used such as *blockactecture*
    tools like Microsoft Visio or another graphical tool that allow you to drag and
    drop blocks down on a canvas and draw lines. There are also specialized commercial
    tools that can be used to not only draw the architecture, but to also help identify
    the risks that can impact the drawn architecture. One of the most comprehensive
    methods of threat modeling is more manual and requires time and resources to spend
    the effort to whiteboard the architecture and manually identify the risks. Each
    of these methods have their strengths and weaknesses.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '![](img/cc84747f93d290964598894b4f5c153b_67_0.png)


    Figure 3.1 Threat modeling in the Secure SDLC


    # 3.1.1 Basic threat modeling terminology


    Before we get into actually performing a threat model you need to know a few terms
    that are used during the process.


    +   - Attacker - Those who would misuse intentionally or unintentionally an element
    of the system under consideration. This could be one of the threat actors I spoke
    of earlier like a script kiddie, hacktivist, or others.

    +   - Asset – Anything you deem to have value and something that the system must
    protect from an attacker. Some physical examples are money and precious metals.
    Digital examples are data, especially sensitive data like protected health information,
    or personally identifiable information.

    +   - Threat - A means by which an attacker might compromise an asset that has
    potential for success. Threats can include everything from hackers and malware,
    from earthquakes to wars. Additionally, intention is not a factor when considering
    threats. A mechanical failure of a hard drive in a data center is an equal threat
    to a coordinated attack by an attacker.

    +   - Risk – The potential for loss, damage, or destruction of an asset as a result
    of a threat exploiting a vulnerability. In the example previously about the mechanical
    failure of a hard drive and an attack by an attacker, the mechanical failure is
    lower overall risk since there is usually redundancy built into an architecture
    to manage a failure meaning the impact is smaller.


    When you want to understand risk and treats, it’s important to ensure that you
    take emotion and gut feeling out of the equation. Take the two visuals in figure
    3.2. Many people have a very visceral reaction to the bear and view the stairs
    as just another daily activity, but what are the actual risks?'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# What’s the higher risk?


    ![](img/cc84747f93d290964598894b4f5c153b_68_0.png)


    vs


    ![](img/cc84747f93d290964598894b4f5c153b_68_1.png)


    Figure 3.2 – A set of perfectly normal stairs and a grizzly bear.


    The reality is that stairs kill far more people than bears do. On average, 12,000
    people a year die from falling down the stairs. A few dozen people are killed
    per year by bears. However, most people will feel instant fear when faced with
    bear due to many different factors. What does this have to do with risk and security?
    When we look at the risks that impact our organization and software, it’s important
    to put our risks in perspective. Most people that fall down the stairs may get
    right back up with some bumps and bruises, while the off chance of being attacked
    by a bear is likely to be much more fatal. Being under attack by an advanced persistent
    threat (APT) like a nation state is of course concerning for any organization.
    However, most organizations should be more concerned about the daily noise that
    comes from automated attacks and less sophisticated attackers. Although this is
    not as flashy as the attacks that come from an APT, the organization is more likely
    to see automated attacks.


    Now that we understand some basic terminology and have some perspective on risk,
    let’s turn to threat modeling. For many, it’s easier to understand the concept
    of threat modeling by first taking a look at the manual method.


    # 3.1.2 Manual threat modeling


    Imagine that an organization has determined that they need to identify potential
    threats and risks to a new feature that they want to deliver to their clients.
    Although threat models can be done later in the development life cycle, as with
    most security tools and techniques, the most benefit will come from performing
    this activity as early as possible. There are several inputs that are required
    for a successful threat model:


    +   - A completed architecture diagram and description of the feature.

    +   - A data flow diagram that shows how data will flow through the system.

    +   - A software bill of materials (SBOM) that provides a list of the software
    components used in the development of the application.

    +   - Web service integration points such as APIs and other web services with
    third-party or internal systems.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Once these items have been gathered, members of the engineering team, security
    team, and business representatives would set aside time, potentially several hours
    or even days depending on the complexity. To make these sessions as effective
    as possible, the right people need to be involved. The engineering representatives
    need to be familiar with the overall architecture and the way the application
    is used in normal activity. More importantly, they should be familiar with the
    data flows. The security representatives should have knowledge of which vulnerabilities
    and risks that the organization is most concerned about as well as have familiarity
    with the application and the issues and risks that impact the technology stack
    that is used. This should include the web server, database, deployment methodology,
    and coding language. The business representative should be there to help identify
    the way the application is being used in the real world as well as weighing in
    on the identified risks and their impact to the business.


    With materials in hand, the appropriate people will locate a room with a whiteboard.
    Although this can work in remote settings using virtual conference technology,
    it is far more effective to be physically together. For this exercise they will
    be using STRIDE to identify the risks that can impact the application. STRIDE
    is a threat modeling methodology developed by Microsoft (https://docs.microsoft.com/en-us/archive/msdn-magazine/2006/november/uncover-security-design-flaws-using-the-stride-approach)
    and is used in their free Threat Model Tool. STRIDE is an acronym that stands
    for Spoofing, Tampering, Repudiation, Information Disclosure, Denial of Service,
    and Elevation of Privilege.


    # Other Threat Modeling Techniques


    I will use STRIDE throughout this book since it is one of the more familiar ones
    used today. However, there are several other methods that can be used like OCTAVE,
    PASTA, Trike, and VAST. Which one to use really depends on the organization and
    the goals.


    Threat modeling methods like Operational Critical Threat Asset and Vulnerability
    Evaluation (OCTAVE) focus on the non-technical risk that resulted from breached
    data and was developed by Carnegie Mellon University. In this method, assets are
    identified and classified which helps define the scope. Through three stages this
    method develops requirements, identifies vulnerabilities and gaps in policy or
    practices, and then develops an overall strategy to address the security risk.


    In the Process for Attack Simulation and Threat Analysis (PASTA) method the organization
    takes and attacker view and then develops a threat management, enumeration, and
    scoring process. This can then be elevated to key decision makers to determine
    what risk to tackle as opposed to developing requirements at the SDLC level. This
    method is primarily asset focused especially with the mitigation strategies.


    Again, there are several options when it comes to using a threat model methodology
    however, the STRIDE method is broad and is a good way to learn about threat modeling.
    Additionally, Microsoft Threat Modeling Tool uses STRIDE when it classifies threats.


    # 3.1.3 Starting the manual process


    The organization has the information gathered, the appropriate stakeholders, and
    has found a room with a whiteboard so that they may begin the process. Although
    the security representative does not have to lead the exercise, they are usually
    the most appropriate'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'person to keep focused on the task and make sure that the team is working toward
    the appropriate risks.


    There are not a lot of ground rules for this effort with a few exceptions:


    +   - Don’t assume that your environment is secure or reliable. Hardware and software
    fail. Attackers will be pushing on your defenses. It is better to assume that
    your environment is neither secure nor stable.

    +   - Don’t assume that your environment is properly configured. Similar to the
    secure and reliable, configuration drift is real, and not all systems are configured
    the same way.

    +   - Don’t assume that your defense in depth will catch everything. Not all security
    tools are evenly applied or configured.

    +   - Keep the conversation on to realistic scenarios and not “Hollywood” ones.
    It’s fun to think that secret agents from an underground organization will physically
    breach your defenses with a stolen truck and steal your servers. This is extremely
    unlikely. Stick to the more practical and likely scenarios like a hardware failure,
    an injection attack, or elevation of privilege.


    With the ground rules understood the security representative starts to draw on
    the whiteboard. They begin by drawing a few items:


    +   - A simple copy of the architecture as blocks representing the different assets
    and technology in the architecture. This should include any third-party services.
    The purpose of this is to have a visual map that everyone can see.

    +   - The acronym STRIDE with each spelled out as spoofing, tampering, repudiation,
    information disclosure, denial of service, elevation of privilege.

    +   - Some exercises will put a “Hollywood” box on the whiteboard as well for
    any scenarios deemed too extreme.

    +   - Lastly a grid with the following column headers and space to add items below:


    | What | Who | Why | How | Impact | Counter Measure |

    |------|-----|-----|-----|--------|------------------|

    |      |     |     |     |        |                  |


    The grid serves as the working area for the remainder of the exercise. The group
    will begin by identifying a risk and completing the rows below the header. The
    headers are defined as:


    +   - What: What is at risk in a given scenario. This should be specific such
    as "credit card numbers in the database."

    +   - Who: What threat actors can potentially impact the identified object in
    the "What?" This should be specific such as "a developer with access to the production
    database."

    +   - Why: What is the motivation of the "Who" to put the "What" at risk. Such
    as: "The developer wants to sell the credit card numbers on the dark web."

    +   - How: This is a bit more difficult and should avoid unrealistic scenarios.
    A plausible scenario would be "The developer copies the production data to their
    developer device."'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 3.1.4 Threat modeling with linking bank accounts


    We can use our examples from previous chapters of Superior Products who is launching
    a new feature in their e-commerce site that allows users to link their bank account
    in the application so that they can get paid for reselling items within the application.
    Dashing Danielle, the security representative in Superior Products for this application,
    begins by gathering the items needed as inputs from that development team. She
    reviews the architecture, and dataflow diagram as well as the software bill of
    materials to understand how the application is built and used. She follows up
    with the development team on a few outstanding questions and then organizes a
    work session with the development teams lead architect, two developers that have
    been working on the feature, and the product owner.


    Dashing Danielle begins the session by drawing the simple architecture for the
    application along with, STRIDE, “Hollywood,” and the grid on a whiteboard. The
    group agrees that the architecture is complete and includes the critical components
    of the new feature. She then asks a basic question of “what are we trying to protect?”
    The obvious first answer is that the organization must protect the bank account
    information that is sent and stored. Dashing Danielle adds bank account information
    in the “What” column.


    | What | Who | Why | How | Impact | Counter Measure |

    |---|---|---|---|---|---|

    | Bank Account Numbers |  |  |  |  |  |


    Next Dashing Danielle ask, “who would want this information”? Similar to the question
    of “What”, there is little debate on “Who”. Clearly the attackers would be motivated
    by the financial gain that they would achieve by stealing bank account numbers.
    With this information, attackers would be able to access the bank accounts of
    the users of the application, gain additional information on the user, and potentially
    link the bank account to an attacker owned account. With this in mind, Dashing
    Danielle adds the information in to the “Who” and “Why”.


    | What | Who | Why | How | Impact | Counter Measure |

    |---|---|---|---|---|---|

    | Bank Account Numbers | Cyber-criminals | Financial gains with the information.
    |  |  |  |


    With the easy part done, it is now up for the group to determine how an attacker
    could steal bank account information and what impact it would have on the organization.
    Additionally, they will consider what counter measures they could put in place
    to protect against this specific attack, and whether those already exist. If they
    do already exist, then Dashing Danielle will cross it off the list under “Counter
    Measures”.'

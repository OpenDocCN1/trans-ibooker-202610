- pgno: 11
  md: '# 1.3.1. Trying to protect at runtime


    Although the aforementioned tools are detection tools, there are protection tools
    as well that will sit in front of a running application and attempt to block activity
    that looks malicious. Web application firewalls (WAF) provide protection against
    attackers looking to take advantage of weaknesses in a running web application.
    Run-time application security protection (RASP) will provide similar function
    as the WAF with the exception that RASP generally runs alongside, or even inside,
    the application. Bot mitigation software and denial of service protection both
    will attempt to stop volumetric attacks that send large quantities of malicious
    traffic that attempt to bring down the application or perform repeated tasks like
    brute force activity. Secure gateways will provide similar protection by blocking
    unauthorized access and activity as well as provide real-time monitoring.


    Again, these protection tools use all the latest and greatest techniques to attempt
    to provide protection like machine learning, and artificial intelligence. Some
    of these tools are great at blocking unwanted activity by malicious actors but
    at the same time, some tools run the risk of blocking an organization’s clients
    from using the software as it was intended if the tool is not properly tuned.
    An example of this that is common is when a batch job runs and calls an API or
    function hundreds or thousands of times in a short period of time. This could
    look like automated malicious activity to the protection tools and could block
    the legitimate traffic. To separate the two, the application security team and
    the engineering organization have to work together to pattern behavior into rulesets
    that block malicious traffic and allow the good traffic. This can come in the
    form of allow-lists for certain URLs and IPs. There is a steep hill to climb to
    enable protection tools since many organizations, understandably, will be concerned
    with performance and possible interruptions of legitimate traffic.


    # 1.3.2. Getting output from tools is not enough


    Like a comfortable blanket, security tools that are layered in during the development
    process and pipeline can become a reassuring to an organization. However, as with
    most tools, the effectiveness is determined by how well the tool integrates with
    the organization and how well it protects or provides legitimate results. Organizations
    that enable one or many of these tools simply to say they use them, or (*cringe*)
    say that they block the OWASP Top Ten, are not doing themselves or the organization
    any favors.


    **DEFINITION** OWASP is the Open Web Application Security Project that is an opensource
    community of application security professionals that develop standards, tools,
    and projects to assist organizations with the development of security in their
    applications.


    Sure, during an audit the organization can say that they are using tool ‘x’ or
    ‘y’ during their development lifecycle. Regardless of whether the auditors pencil
    gets to work checking a box, the organization may or may not actually be more
    secure.


    The reality is that these tools can create a lot of noise for both the engineering
    team and the application security team. The scanning tools churn out findings
    that need to be triaged, rated, and assigned. Many are false positives. The blocking
    tools create false alarms and raise concerns about the impacts on legitimate activity.
    And many times, there is an'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'overreliance on the security tools to provide protection especially when there
    is a vulnerability that is long in the tooth with no plan to remediate. For instance,
    an organization may rely heavily on a WAF to provide protection for a SQL injection
    vulnerability found in an application that has been designated as "sun-set" with
    a multi-year decommission. We''ll talk more about that as we get into vulnerability
    management.


    # 1.3.3. Sifting signal from noise in security tools


    The security tools that are used in an organization can be expensive and misconfigured
    like any other tool. Further, those tools that are not finely tuned will generate
    an abundance of false positives. Like the ones that are turned on and walked away
    from. This not only creates additional work on the application security and engineering
    teams, but also reduces the confidence level in those tools and, by extension,
    the application security team. When false positives become normal, they become
    an easy escape route for engineering teams looking to find a way to say that their
    application is not riddled with vulnerabilities. If the last ten SQL injection
    issues flagged by a tool were false positive, why would this new one not be? Which
    brings the application security and engineering teams to a standoff on proving
    a finding to be a true vulnerability or a false positive. This can be extremely
    challenging for the application security team which typically does not have the
    extensive context that the engineering team has of their own application. It is
    also a time-consuming process to bring together the appropriate subject matter
    experts (SME) to pour over the details of the code in relation to the finding.


    With the varying tools and the number of findings from each of them, mature application
    security teams focus on sifting the signal from the noise and providing quality
    results to the engineering teams. This raises the confidence level of the findings
    and establishes a more robust relationship between security and engineering.


    The application security team will work closely with the engineering team and
    attempt to have as much application context as possible so as to take the burden
    of proof out of the engineering teams hands. In other words, the application security
    teams goal is to ensure the following:


    +   - Results are true positives that have already been triaged by the application
    security team.

    +   - The steps to remediate the vulnerability are clearly understood by the engineering
    team. If possible or applicable, the application security team should provide
    code samples that show exploitation and resolution.

    +   - Clear expectations on timeline to resolution based on the criticality of
    the vulnerability.


    We will dive into this more in future chapters, but for now let''s look at how
    security can be integrated into the development lifecycle.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# 1.4 Shifting right versus shifting left in development


    Whereas every organization releases software in their own manner, for most organizations
    the path from idea to production is relatively the same. Figure 1.2 shows the
    common pattern to release.


    Common stages of code development from client requirements to production release


    ![](img/cc84747f93d290964598894b4f5c153b_13_0.png)


    Figure 1.2 Example of a development pipeline for code deployment


    The phrase shift left is the concept of moving security as close to the beginning
    of the software development life cycle as possible. In Figure 1.2, that means
    during the initial stages of gathering and building requirements as well as in
    the development phase. The term has been used frequently in the application security
    space as a way to describe building practices, and tools that can uncover security
    issues as soon as possible in the development lifecycle. Many of them I’ve mentioned
    previously. Sticklers will tell you that the best way to accomplish this is to
    ensure that security is there when the developer’s hands are on the keyboard creating
    that new function. Those sticklers would be right. The time to correct a security
    vulnerability is when it is being created.


    Shifting left is less visible than shifting right. In the shift right model, tools
    are placed strategically throughout the development lifecycle and production environment
    to ensure that vulnerabilities are identified and protected against. Penetration
    tests are executed to identify issues. You can verify that the tools are working,
    and you can generate reports that show you the effectiveness, or the ineffectiveness,
    of the tools that you implemented. This relies on a detect and respond paradigm
    that is very reactive and adds to the backlog of vulnerabilities that I talked
    about earlier where the critical and high ones are usually'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'prioritized while others go to the backlog. This can also disrupt the DevOps
    model that looks to move quickly with changes and doesn’t handle broken builds
    or gates very well.


    Getting to the goal of developers creating more secure code usually means using
    controls like:


    +   - Security training.

    +   - Top level security policies that are used to develop security procedures,
    processes, and standards.

    +   - Tools that are integrated into the development environments and pipeline
    that offer faster feedback

    +   - Building reusable secure architecture.


    However, some of these can be circumvented. Like most training, security education
    can quickly be forgotten or pushed aside for the sake of speed of delivery of
    new features. Developers also change roles, jobs, and functions and are often
    overburdened with deadlines, tickets, requests, fires, and meetings which favors
    moving fast as opposed to secure. This leaves even the most well-meaning security
    conscience developer to push security further down in priority. Especially when
    there is a reliance on the protection tools, as described previously, that will
    detect and alert on security issues. Security quickly becomes someone else’s problem.
    Additionally, the tools become a business blocker which opens the opportunity
    for the product owner to request exceptions when a feature release is at risk
    due to a found security issue. Architecture is frequently misused or not well
    socialized across the organization meaning that not all development teams are
    aware of frequently changing architectural patterns that offer more security.


    # 1.4.1. Shifting right in the development lifecycle


    When an organization decides that their security posture will be mostly a shift-right
    one, they integrate tools into the development lifecycle that will detect issues
    and open tickets to the security or development team. Most of these tools are
    used to finding issues in production, or late in the development process. These
    organizations will enable a few protection mechanisms like a Web Application Firewall
    (WAF) and primarily play defense by tracking the incoming vulnerabilities, triaging,
    and prioritizing them, and assigning them to teams to be resolved.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '![](img/cc84747f93d290964598894b4f5c153b_15_0.png)


    When shifting right, tools are used to detect issues later in the development
    lifecycle.


    Figure 1.3 Security tools that are used in a shift-right approach


    It is well known that resolving defects, in this case security vulnerabilities,
    cost more in terms of money and time than an issue that is resolved early in the
    life cycle. The effort and disruption that is required to resolve a defect that
    is already in a production environment can be multiple tens of times more expensive
    than resolving it at the requirements phase with each progressive phase of development
    becoming more expensive. There are also service level agreements that could be
    at risk when a vulnerability gets resolved in production if an outage is incurred
    through resolving the vulnerability. This further expose the organization to additional
    costs above and beyond the engineering cost of resolution. Security vulnerabilities
    have the added impact of potentially leading to a reportable event or even reputational
    damage should the vulnerability lead to a large-scale breach that exposes client
    data or takes an application offline.


    However, shifting right does allow the development team to produce features at
    a rapid pace since security is largely a defensive position when the software
    is already running in production. This allows for the development team to spend
    less time resolving issues early, and instead rely on the protection mechanisms
    in place. The decision to rely on the right-sided tools and processes is one that
    is made by balancing risk versus reward since failing to deliver a feature on
    time has its own impacts on the organizations bottom line.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# THE RELATIVE COST

    OF FIXING DEFECTS


    ![](img/cc84747f93d290964598894b4f5c153b_16_0.png)


    # 1.4.2. Shifting right fails


    There is no shortage of stories where security controls were in place but failed
    to stop a larger breach or exposure. This happens for a myriad of reasons: alarm
    fatigue, security is someone else’s problem, too many competing priorities. Those
    that work in the security industry know that there is always an open port, an
    insecure version of software, and a place where there is a lack of security controls.
    And attackers are just as in-tune to this as the security workers. Attackers only
    need to be in the right place at the right time, once. Defenders need to be right
    every time.


    If you’re a fan of zombie stories, you’ll be familiar with the individual or band
    of living humans that find themselves inside of a building surrounded by the drooling,
    groaning undead. In most cases there is simply too many surfaces and weaknesses
    in whatever building they find themselves in. As the horde outside grows the defenses
    become weaker and the living inside have fewer and fewer options to keep the zombies
    out. Working in the cybersecurity field can sometimes feel this way. Every time,
    you shore up a weakness in your defenses a new one is discovered, and your team
    is tasked with devising a plan to close the weakness and provide a meaningful
    defense. Additionally, attackers are not always the'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'mindless zombies pressing your defenses, they are often smart, patient, and
    know exactly what they want. Good thing the defenders are too.


    Bad actors are finding more ways to attack applications and to the defenders of
    those applications, it continues to feel like there are more vulnerabilities than
    they can manage. More features, mean more attack surfaces, which means more opportunities
    for a bad actor to find a way to steal data, impersonate a user, perform fraud,
    or other nefarious activity. Furthermore, the more integration with internal or
    external applications and services means that there can be exposures that the
    organization can’t control.


    Case in point: In 2018 a vulnerability in Facebook led to the compromise of tens
    of millions of Facebook accounts. The flaw was in a feature that allowed a user
    to view their profile from the point of view of a different account. No surprise,
    this feature was called "View As." Bad actors were able to steal the access tokens
    of Facebook accounts which allowed them to then log in as the user that the access
    tokens were associated with. They started with their own connected friends and
    from there stole the access tokens from their friends’ connections until they
    had collected several hundred thousand accounts and then several million. They
    were able to collect personal data including the usual suspects of name, contact
    information, places the user checked-in, and other private data.


    This example shows the difficulty in providing a secure product that is open to
    millions of users with a multitude of features. Even for a large organization
    that takes security seriously. The tools that we spoke of previously may have
    helped identify this issue prior to allowing the code to go out the door or would
    have detected and blocked it once it was running in production. However, one of
    the limitations with these tools is their inability to discover business logic,
    or workflow related vulnerabilities. Furthermore, it can be challenging to rely
    on tools to uncover these issues quicker than end users do. This is where having
    the proper processes, requirements, and testing early in the development lifecycle
    would raise the opportunities to uncover this issue early where the collective
    effort of tools, testing, and keen security eyes are brought to bear.


    # 1.4.3. Shifting left in the development lifecycle


    Where shifting right means that the organization attempts to put as much effort
    into protecting and detecting security issues later in the lifecycle, shifting
    left is pulling that effort earlier in the lifecycle. This is by far the preferred
    method of development security due to the fact that it is less expensive and more
    effective. However, it is more difficult to implement and can be bypassed rather
    quickly if the need arises.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '![](img/cc84747f93d290964598894b4f5c153b_18_0.png)


    When shifting left, the organization places more emphasis on bringing security
    tools earlier in the lifecycle in order to catch issues before they go to production.


    Figure 1.4 Shows the security tools that are used in a shift-right approach


    Imagine building a house. You have an architectural drawing, a bill of materials,
    and the actual building materials. You get a group of laborers together and you
    get to work building the house. It is far more preferable to put the locks on
    the windows and doors, build the egress window, install smoke alarms while you’re
    building the house. Waiting until the house is built, or after the house has been
    robbed, or burned down, is too late. Yes, you will save time and money during
    the building process, but you are less secure for it. This example sounds silly
    when stated, but the reality is that this routinely happens in software development.
    Sometimes it is because newer security patterns and architecture are discovered
    after the software is built, but it is commonly due to the lack of building security
    in at the beginning.


    It is far more practical to layer in security throughout the development process
    starting with the design decisions being made and requirements being gathered.
    When this approach is taken, the organization is taking the necessary steps to
    build better habits and have longer lasting impacts. Take into consideration your
    personal health. Studies have shown that adjusting habits rather than going for
    a quick fix diet are not only healthier for you but provides a more sustainable
    path to better health. Shifting left builds those healthy security habits that
    will ensure that the organization is on the right footing and can sustain a more
    secure overall posture.


    A healthy secure development environment starts with making the right architecture
    and design decisions that take security into consideration. This means picking
    the right security controls in areas like session management, encryption, authorization,
    and the like. It also includes leveraging tried and true patterns and standards
    from well-regarded and vetted organizations like OWASP. For instance, the time
    for picking the right data protection scheme should be determined while architecture
    decisions around data flow, and database technology are being made. Requirements
    for the encryption strategy should be well'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'documented and provide the appropriate level of protection based on the data
    classification. Additionally, requirements like field level encryption with proper
    encryption key lifecycle management are much easier to develop before there is
    terabytes of data in the database that would require applying encryption to a
    large dataset. Where this can get complicated is with legacy applications where
    most organizations cannot provide encryption beyond the disk level due to older
    technology that may not support more granular, robust, and modern encryption.
    This is simply due to the fact that the application may never have been designed
    to work with encrypted data.


    Even the language that is chosen can have an impact on how secure an application
    will be. There are literally hundreds of development languages that developers
    can choose from. Each with their own strengths and weaknesses for the given use
    cases. However, many modern languages provide some guardrails that can keep developers
    from producing insecure code. For instance, it should be no surprise that Java,
    and C++ tend to rise to the top when it comes to vulnerable code. Much of this
    can be attributed to the power in each of these languages and the ability for
    developers to shoot themselves in the foot.


    **NOTE** One of the most common issues with powerful languages like C++ is its
    ability to manually manage memory. Most modern languages will take this ability
    away from the developer as a convenience. One specific example with C++ is the
    ability to call free() that allows the developer to free a memory address. If
    this is called twice with the same memory address, this becomes a doubly freeing
    issue. An attacker is able to leverage the memory leak that is made and inject
    code possibly allowing the attacker to have an interactive shell with elevated
    privileges.


    Additionally, these languages are widely used in billions of devices across the
    globe. An increased footprint means more opportunity to find security issues.
    Other languages such as Python, Ruby, and Go show fewer overall vulnerabilities
    but there are also fewer lines of code written in these languages.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/cc84747f93d290964598894b4f5c153b_20_0.png)


    Figure 1.5 Application with high-severity flaws by language 2020


    As much as language and design choices have an impact in the shift left strategy,
    so does testing. Unit, QA, integration, and system test can all be used to identify
    security issues early in the lifecycle and allow time for the development team
    to correct an issue before it goes out to a production environment. This does
    assume that the appropriate security tests have been created, ideally automated,
    and are alerting the team when an issue is found. It further assumes that the
    findings do not disappear into the security vulnerability abyss of a backlog.


    We will talk more about shifting left in the coming chapters, including items
    like threat modeling, measuring risk, creating abuse cases, using development
    tools, raising awareness and more. Make no mistake, shifting left is the most
    cost effective and sustainable method of bringing application security to an organization
    near you.


    # 1.4.4. Shifting left fails


    Often, one or two members of a development team are designated as the "security
    person" (We won’t call them champions. That comes later) for the team where much
    of the security related work is dumped. This person becomes responsible for being
    at the meetings where security decisions are being made, they perform code reviews
    on security related changes, have to make decisions for the team, and is generally
    responsible for correcting or setting a direction on vulnerability management.
    By the way, this person also has a day job that is usually as a developer or architect
    for the team. They may not even want the role of the "security person" but they
    may have been voluntold. This has a huge impact not just on that individual but
    on the team as a whole. This person is quickly overwhelmed without much opportunity
    for rest or objection.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'This is generally where things like vulnerability management falls apart. A
    new vulnerability is discovered in one of the security tools, or a penetration
    test. The vulnerability is placed in the defect tracking tool and assigned to
    the security person who then puts aside the regular development work that they
    were possibly working on to triage the security issue and attempt to resolve it.
    Meanwhile several other vulnerabilities have been identified building the security
    debt we talked about earlier. This is usually when the product owner, scum master,
    or development manager comes in asking why a development deliverable is behind.


    This type of failure has been seen several times in the past. One of the recent
    high-profile cases was with the Equifax breach that led to the exposure of over
    143 million American’s personal and financial information. Equifax is one of the
    big three credit bureaus in the United States providing consumer credit reporting
    to Americans. In March of 2017 a vulnerability was found in Apache Struts, a framework
    for developing web applications. A patch was released, and most organizations
    set out patching their software. This is generally easier said than done as some
    framework upgrades may need additional development changes and testing. In worst
    cases, an application may need to be re-architected or have major development
    work completed. By May of 2017, two months after Apache released a patch, attackers
    had gained access to the Equifax database and began to steal information. Equifax
    became aware of the breach in July. There were several failures in the security
    organization that led to the exposure of personally identifiable information (PII).
    Although the issue was internally identified, the email notifications for the
    known issue went to an old distribution list and therefore was never picked up
    by the appropriate team. Additionally, the databases were not segmented from the
    remaining network allowing the attackers to pivot to other servers where they
    found unencrypted credentials allowing them to escalate the attack.


    It’s easy for us to sit back and pick apart the lack of patching and other security
    controls in this case. However, two months from initial disclosure to exploit
    is a short window for many organizations. Some of these same organizations may
    have technology running that hasn’t been patched in a much longer timeframe. More
    importantly, the time to exploit these days is much shorter where attackers are
    able to gather enough information to reverse engineering patches and build exploits
    in days or even hours. But the security person in the development team has the
    responsibility to jockey with the rest of the features that are slotted for a
    release and ensure that the application is protected. Given that the Apache Struts
    vulnerability was only two months old when it was exploited, there were most likely
    older and more critical vulnerabilities that were already on the team’s plate
    ensconcing this Struts vulnerability in the annals of security history. This also
    highlights the earlier fact that every company is a software company. Equifax
    is not a technology company by trade but yet they find themselves in the software
    business due to being powered by layers of software that enable them and their
    customers.


    # 1.5 Is going left better than going right


    As I mentioned, shifting security to the left will result in better outcomes for
    an organization. It allows the development teams to build a culture of security
    that is more sustainable and able to manage the “when” not “if” of security vulnerabilities
    that are sure to be introduced.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'No software is in any organization can be written to be 100% secure for all
    time. There will be vulnerabilities. The organization needs to have the culture,
    processes, people, and technology in place to manage this.


    There is no wrong or right (no pun intended) way of approaching application security.
    The people, process, and technology related to application security is needed
    throughout the lifecycle regardless of the stage and its purpose. To put it into
    context let me describe two different organizations and their approaches to application
    security.


    The first organization called Acme Services has decided to engage the application
    security team prior to release to perform simple scanning and penetration testing
    to make the determination as to whether there are any vulnerabilities introduced
    into the product during development. This is the shift-right approach that has
    been described previously. The second company, Superior Products, knows that brining
    in security earlier is not just easier, but more cost effective than waiting until
    later. They requested that the application security team is engaged earlier. Even
    better, they have a security champion, Dashing Danielle, in their team that can
    provide guidance throughout the development process.


    Superior Products has a mature application security team that keeps their finger
    on the pulse of the security industry. They’ve integrated a security champions
    team across the organization and maintain open communication with that team to
    ensure that they are kept informed of changes in the industry. With this information
    and structure, they are able to perform threat intelligence that informs decisions
    on new requirements and technology. In many cases, this allows them to implement
    security features ahead of client requests to do so. Acme Services is often caught
    off guard by requests for stricter security and privacy from their clients due
    to the fact that they have decided to take the approach of implementing security
    later in the process.


    Superior Products employs Dashing Danielle to review the use cases that come in
    from product ownership. She is able to perform a quick threat model on the feature
    to determine the open security concerns that impact the feature. Based on a risk
    assessment that she has done previously with the product and the application security
    team she knows that the application and the information in the report is considered
    sensitive information for the organization. This means that she will want to create
    security requirements that maintain the confidentiality of the information that
    is contained with the data and ensure that access is limited to a small audience
    of users within the appropriate organization.


    Dashing Danielle is able to raise these questions about the access to the reports
    during the review of the user stories and requirements based on the information
    she has. After she speaks with the application security team on what she feels
    are concerns with the new feature she presents the following requirements that
    help protect the data in the generated reports as well as maintain access control:


    +   - Security Requirement: "Application shall ensure that access to the report
    is limited to authenticated users of the organization that the report belongs
    to."

    +   - Security Requirement: "Application shall log information related to the
    admin accounts that create and change the reports."


    The development team agrees that these are important requirements and are capable
    of making them a reality without impacting the release timeframe for the product
    feature.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Dashing Danielle supports the development team in whiteboarding the workflow
    so that the requirements are clear and understood by the development team.


    ![](img/cc84747f93d290964598894b4f5c153b_23_0.png)


    Figure 1.6 Superior Products path to more secure code


    Over at Acme Services, one of the developers raises some concerns about whether
    unauthenticated users could access the report. This is quickly dismissed since
    the product owner promised this feature in a short time window, and the development
    team doesn’t know whether the data in the reports is actually considered sensitive.
    Everyone shrugs and moves on.


    This is a pretty clear distinction of where application security works and doesn’t.
    It may seem like this story is far-fetched, but please understand that this type
    of story is typical. Picking up this book means that you want to be more like
    Superior Products.


    # 1.6 Application security needs you!


    It takes a village to do anything worthwhile. Security is no different. Generally,
    security teams are a slim percentage of the overall organization and relies mostly
    on automation and the goodwill of the engineering organization that it works with
    in order to scale to meet the demands. There is no “correct” size of the application
    security team, but size is not indicative of effectiveness. The variance in the
    size of application security to engineers varies from organization to organization.


    > DEFINITION Building Security in Maturity Model (BSIMM) is a study on the posture
    of software security initiatives and programs by quantifying the application security
    practices of different organizations across industries, sizes, and geographies.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'In BSIMM they define the software security group (SSG) as the team that is
    focused on software security within an organization. They found that an SSG group
    can be as large as 160 or as small as 1 with the average size of the team as 13.9
    people. This of course depends on the size of the organization and the amount
    of coverage that the software security group needs to manage. And it’s no surprise
    that application security continues to be a smaller part of the overall engineering
    organization when you see the total spend for security relative to the overall
    IT budget. In most cases this is around 5-6% based on a Gartner study in 2019.
    Application security is yet a smaller portion of that security budget since much
    of the funding goes to perimeter defense as well as detection and response capabilities.


    **EXERCISE** Take a look at BSIMM’s website for SSDL Touchpoints:


    https://www.bsimm.com/framework/software-security-development-lifecycle.html


    Based on what I’ve described about shifting left and shifting right, these touchpoints
    are all part of the shift-left model. If you were in an organization with limited
    budget, where do you think the best place to put you and your team’s focus in
    order to build security into the development lifecycle? Think about the implications
    of the architecture analysis. This takes resources to be on the ground level.
    Security testing can scale but can be expensive and take time to implement.


    # 1.6.1. Democratizing application security


    Application security is less about a dedicated team and more about building the
    habits, culture, and infrastructure to support secure development. An application
    security team, regardless of size, relies heavily on others within the development
    organization to socialize and promote security within the broader organization.
    It is not possible for an application security team that is relatively small to
    be able to be integrated with every development team and be a part of every design
    decision. Without this borrowing of resources from the development organization,
    application security would rarely be integrated. It is critical for the advancement
    of application security to be able to find allies, build trust, and democratize
    security with the overall engineering organization. Throughout this book I will
    outline the methods used to achieve that advancement however, to be clear, application
    security requires a culture of security and requires buy in at all levels.


    The critical part here is the helpers. Some organizations call them champions,
    evangelists, or coaches. The theme is the same regardless of what they are called.
    We will talk more about a champions program in future chapters; however, the basic
    principle is that these champions are the connection between the engineering organization
    and the application security program. They are there to represent the interests
    of the application security program as well as ensure that security standards,
    designs, and architecture are properly implemented in the areas that they represent.
    The champion is usually a senior or well-seasoned engineering resource within
    an application or business unit and comes from within the engineering organization.
    It is important for the champion to be there because they want to, and not because
    they have to since a successful champion will be one that appreciates security.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'These champions help the application security team advance security by being
    present where the application security team cannot be. Many decisions get made
    at the stand-ups, in the hallways, or in impromptu conversations between developers.
    Having eyes and ears that are closer to where the code is developed helps ensure
    that security is considered in every part of the software development lifecycle.


    One condition of a successful democratization of application security is to ensure
    that these champions are well versed in the organization’s security culture, know
    where to find information related to requirements, standards, and architecture,
    and can ultimately feel comfortable speaking for the application security team.
    There may even be a formal training and assessment program before a champion can
    assume the role. To ensure these champions have the information that they need
    to be successful, the application security team needs to publicize their documentation
    and guidance and review and gain consensus on new items with the champions on
    a regular basis. This can be done in a formal reoccurring forum, or through electronic
    forums. It depends on the organizations culture and the most practical way of
    reaching an audience.


    # 1.6.2. Users will be users


    Champions are not enough to augment the application security team. It’s not that
    rare to hear a developer, an end user, a leader, or other technologist say that
    "we have a security team for that". We can build all the technical security controls
    into a system, but once a user contacts a system an element of unpredictability
    is introduced. Users want to get their job done or find a way to complete some
    activity. We have all been in the situation where we were halted by system limitations
    due to security controls. Most of us do not throw up our hands and walk away.
    We look for other ways to complete what we set out to do. Users are doing the
    same thing with the applications you are building, they look for ways to accomplish
    their work, regardless of whether the application allows it or not. Additionally,
    malicious users are probing the application looking for weaknesses. They are not
    staying within the confines of the application that you developed. In fact, they
    are looking to do the exact opposite of what your application is designed to do
    in order to create an error condition that they can take advantage of. Application
    security is always working to keep up with the curious user and the malicious
    attacker and no amount of tools will give us the level of comfort we are looking
    for. It requires a village dedicated to the security of the application that is
    devoted to building a secure application from the start.


    I stated at the beginning that every company is a software company which means
    that every company needs some level of software security. Likewise, software security
    is everyone’s problem. This is a pretty common refrain, but what does this actually
    mean. This is similar to the public service announcements urging people that if
    they "See something, say something". This doesn’t mean that a traveler should
    attempt to open a bag that they find in an airport terminal that has wires hanging
    out of it and is beeping. This means that the traveler should alert the nearest
    authority so that they may investigate. Nobody in security is asking for an end
    user to triage a SQL injection flaw in a web application and write code to resolve
    it. They’re simply asking to alert the nearest champion, or security personnel.
    Leave the bomb disposal to the professionals!'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 1.7 Examples of failing to secure the software


    The news is littered with examples of failures in security where applications
    were compromised for a slew of different reasons. The point of covering some examples
    is not so we can point and laugh at these organizations, but rather to focus on
    the how and why. Trust me, if your organization sells or uses software, it''s
    not a question of if, but when you will encounter a security incident. It might
    be a small and non-reportable event, but your organization will have a software
    security incident somewhere, sometime.


    **EXERCISE** Go to your favorite search engine and look up articles on the latest
    security breach. You can also go to sites like www.threatpost.com or www.securityweek.com
    for recent stories. I''m pretty sure that if you don''t see one for today, you''ll
    at least see one for this week. Dig into the article and put yourself in the shoes
    of the security organization. How would you have responded? Speculate on where
    things went wrong if they are not spelled out in the article. I often look at
    these stories and ask myself ''how could myself or my team have avoided this?''


    # 1.7.1. SolarWinds


    SolarWinds was a chilling example that showed how a complex ecosystem of software,
    and the various components that make up that software, can lead to a massive and
    impactful breach. This type of compromise is commonly called a supply-chain attack
    for good reason. Attackers can compromise just one component used to build the
    overall software and have their malicious payload spread far and wide. This takes
    advantage of a fundamental complication with the supply-chain in that there is
    inherent trust between the developer of the primary software and the third-party
    software that is used to build the final product.


    SolarWind''s Orion product is a monitoring solution that is used to monitor an
    organizations network and applications. At the time of the attack in 2020, SolarWinds
    was being used by a majority of the top organizations across the United States
    including most of the Fortune 500 companies, universities, and many of the top
    government agencies as well as the military.


    Attackers were able to modify a plug-in called SolarWinds.Orion.Core.BusinessLayer.dll.
    The attackers used a tool called SUNSPOT that allowed them to inject a malicious
    version of the dll and was digitally signed by SolarWinds and sent to thousands
    of customers. The malicious dll contained SUNBURST which allowed the attackers
    to communicate with command and control (C2) servers. The attackers went through
    great pains to hide their activity by lying in wait for a period of time before
    retrieving and executing commands as well as masquerading as legitimate Orion
    traffic and using block lists to identify forensic and anti-virus tools so they
    could evade them.


    Once the plug-in was within a target system it would use a delete-create-execute-delete-create
    pattern that would hijack a legitimate task, run malicious activity, and then
    revert back to the legitimate task. This type of sophistication further shows
    how far the attackers went to keep their activity quiet.


    The campaign went on for several months before it was eventually detected when
    the attackers compromised FireEye, one of the leading cybersecurity companies.
    The attackers'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'gained access to FireEye’s attack simulation and other security related tools
    but were spotted which led to the detection of the more widespread activity.


    Attacks that are this sophisticated are difficult to defend against. Encrypting
    there and scrubbing here will not suffice. The vigilance of FireEye, the ability
    for SolarWinds to rapidly produce a patch, and the impacted organizations aggressive
    patch management shows how our digital world has changed to where we can no longer
    rely on putting our efforts into protecting our software, but we need to pivot
    to a world where we always assume breach. It’s how we respond and more importantly,
    how rapidly we respond when something malicious is detected that makes the difference.


    # 1.7.2. Accellion


    For those of us that own a home or any other type of item that requires maintenance
    and constant attention we sometimes willingly walk past that noisy appliance,
    or creaky door thinking that one day we’ll fix it.


    Software is little different. There are many reasons to keep old software running.
    Clients insist on continuing to integrate with older software and make it difficult
    for organizations to decommission it. Organizations hold on to old software because
    it’s cheaper to keep it running than to upgrade or replace it. Regardless of the
    reason, old software is prevalent in almost all organizations.


    Accellion develops software for healthcare, financial, and education organizations.
    Their File Transfer Appliance (FTA) product is used by healthcare organizations
    to perform large file transfers. The product was almost twenty years old and nearing
    end of life when it was the target of a cyberattack at the end of 2020. The attackers
    first stole data from Accellion and then pivoted to attack Accellion clients directly
    with the goal of stealing data and extorting money. The initial attack was leveraged
    using a SQL injection attack against the document_root.html file which allowed
    them to retrieve keys to generate legitimate access tokens. These tokens were
    then used to access the sftp_account_edit.php file where the attacker was able
    to then exploit an OS command injection which allows the attacker to make commands
    to the host system. This last piece gave the attackers the ability to create a
    shell. The attackers at this point had the ability to upload more sophisticated
    tools and begin siphoning information and pivoting to customer servers.


    Accellion’s healthcare clients were left to notify the affected patients, the
    media, and the Department of Health and Human Services due to the HIPAA Breach
    Notification Rule. Lawsuits followed and, in the end, nearly 3.5 million patients
    had their protected health information (PHI) stolen. What made matters worse was
    the attackers then sent threatening emails to students at UC Davis after the university
    discovered that their information was part of the breach.


    The impact of an organizations inability to decommission old software is wide.
    It is also not rare for organizations to be mostly running the latest and greatest
    version of software but have one client running a version of software that is
    several versions back. This is a failure of product ownership to move clients
    forward and leaves both the organization, and the customers they provide service
    to at risk. It is critical for an organization to have, and stick to, a sunset
    and end-of-life policy. Two key takeaways:'
  merge: -1
  img_proc: true
- pgno: 28
  md: '+   - Decommission of software is the final stage of the software lifecycle

    +   - Remember that technical debt is security debt.


    # Fun Fact


    Microsoft announced the end-of-life date for Windows 7 as January 14, 2020. When
    January of 2020 came, the much-loved OS was still being used on 39% of PCs. Many
    speculate this was due to the lack of desire for end-users to move to Windows
    10. This shows that even Microsoft has issues coaxing users to newer versions.
    Instead, they take a more forceful approach by eliminating patches for the older
    versions. Even then, this doesn’t stop users from using it, and Microsoft even
    allows users and corporations to pay a fee to continue to receive updates.


    # 1.7.3. Fake software


    SolarWinds showed how attackers can take advantage of the trust between components
    that are used to build a final product. However, this story is not unusual. Attackers
    are always looking for ways to get software into the supply chain in order to
    maximize their reach. Why try to compromise one organization by specifically targeting
    them, when you can get into the supply chain and compromise multiple organizations.


    There are other ways into the supply chain. Bigger ways if you can believe it.
    In 2021 two students from the University of Minnesota released a research paper
    on what they called "hypocrite commits". These commits were supposedly intended
    to provide value to the Linux kernel but instead introduced critical issues. Sort
    of like when your parents would hide vegetables in your meals to get you to eat
    them. Maybe you do this too your kids too. There is no shame in that!


    This sort of commit was not well received, not only from Linux, but from the broader
    security and engineering community. The Linux kernel is used by billions of systems
    around the world from the smallest to largest computers. The two student’s actions
    led to the ban of the University from contributing to the Linux kernel in the
    future. They also had their previous commits to Linux revoked.


    The open-source community depends upon the submission of high quality, well vetted,
    and in good-faith, commits to its open branches. Although the example of what
    the two students from the University were able to accomplish shows that this system
    can be abused.


    The explosion of open-source software that is used to build an overall application
    further exasperates this exposure for organizations. According to the SonaType
    State of Software Supply Chain Report in 2020 1.5 trillion open-source software
    components and containers will be requested by developers. Most software is an
    amalgamation of third-party libraries, code from software forums, and hand-coded
    logic by a small group of software engineers and architects. Per Synopsys Open-Source
    Security and Risk Analysis report in 2020, 70% of an average application is made
    up of open-source software. Reliance on the third-party software leads to exposure
    to malicious actors getting into the supply chain and adding nefarious code. Organizations
    that have this level of third party, open-source software need to take a defensive
    approach to managing their supply chain through scanning of third-party libraries
    for vulnerabilities, only using libraries from a reputable source, and maintaining
    a robust patch management program that allows them to rapidly patch a vulnerable
    library as soon as a vulnerability has been identified.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 1.8 Summary


    +   - Application Security teams generally come late to the party which leads
    to findings that get moved to a backlog.

    +   - This backlog continues to grow as security debt.

    +   - Scanning tools used by the Application Security team are generally detection
    tools and do not remediate or block bad code.

    +   - Protection tools can be enabled but are sometimes hard to sell to engineering
    due to concerns with blocking legitimate traffic.

    +   - Shifting right is catching defects late, while shifting left will find them
    earlier.

    +   - Shifting left involves more than just training and champions.

    +   - Fixing issues in production is significantly more expensive than fixing
    prior to production.'
  merge: -1

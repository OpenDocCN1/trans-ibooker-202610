- pgno: 152
  md: '# Table 5.3 Expectations of a Security Champion


    | Sharing security knowledge | Help in making key security decisions | Create
    and drive security best practices |

    | Build threat models | Perform security reviews | Participate in research and
    development initiatives |

    | Participate in bug bounties | Attend security conferences | Prioritize security
    work in the backlog |

    | Monitor for vulnerabilities in the application | Write security test cases as
    part of the overall application testing |  |


    Now that the expectations have been set and the teams identified, it''s time to
    nominate champions. This process is as simple as working with the leadership in
    engineering to identify potential candidates. Once identified, a formal nomination
    is made of the candidates. This includes communication to leadership, the rest
    of the champions team, and the engineering team that they are a part of. The organization
    may also put the nominated security champions through formal training to achieve
    a level of security knowledge. This is not an uncommon approach in most organizations
    and can be achieved with either internal or external training. Training can be
    assigned with target levels to attain or certifications to complete. Some security
    training platforms include education paths designed specifically for training
    champions. The organization can also take the approach of leveraging internally
    developed education from the application security team if it exists.


    Communication and the storage of information also need to be defined. Depending
    on the collaboration tools that are used in the organization, it could be as simple
    as setting up a channel just for champions in the collaboration tool like Microsoft
    Teams, Slack, or Discord. Additionally, the champions team will periodically develop
    content that needs to be stored for easy retrieval. Again, depending on the organization,
    this could be tools like Confluence, Hive, SharePoint or the like. This content
    should be used as the knowledge base for all activities for the champions team
    and the development teams that they are part of and include:


    +   - The champions team charter

    +   - The members of the team and the teams/applications they serve

    +   - Activities and meeting minutes

    +   - Processes for threat modeling, vulnerability management, and performing
    security reviews

    +   - Training program and opportunities

    +   - External resources


    Although nobody likes more meetings, periodic touch points with the group of champions
    is a required activity. This can be just a simple bi-weekly or monthly that is
    used to discuss upcoming activities, ongoing projects, and current vulnerabilities.
    This also aids in keeping the participants engaged in the champions team and raising
    the visibility across the organization. One way to reduce the effectiveness of
    the champions team is to allow it to lapse or reduce the engagement of the team
    members.'

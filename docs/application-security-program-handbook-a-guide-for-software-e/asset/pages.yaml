  img_proc: true
- pgno: 139
  md: '**DEFINITION** Reference architecture is used to provide a template and common
    taxonomy for a solution in a given domain. It aims to create commonality for developing
    a solution. Additionally, the purpose of creating reference architecture is to
    align the organization''s strategy around a specific set of tools, standards,
    guidance, and implementation. This helps drive lower costs in not just licensing
    but also in development time and effort.


    Similar to creating standards, reference architecture is a prime opportunity for
    security to be injected into a process whose goal it is to develop and design
    a common approach to solving a problem. There are several opportunities to inject
    security into reference architecture. Some examples are:


    +   - Federated identity management

    +   - Secrets management when encrypting client data

    +   - Authorization model using OAuth


    These examples provide an opportunity to bring together architecture that meets
    the organization''s need to solve a problem, like an authorization model, but
    does so with the intention of building security in. Once this reference architecture
    is developed and approved by the ARB, it is ready to be used by the organization
    when various applications are looking to develop a solution. Leaning on the example
    of the authorization model, building this reference architecture means that each
    application will have the same approach to designing authorization into their
    application. When the reference architecture is built with security in mind, and
    it is reused, this cuts down on the security concerns of that application going
    forward. It also means that if issues are discovered or changes need to be made
    to the reference architecture, that those changes can be easily communicated to
    the impacted applications through the ARB.


    It’s clear to see why this is important from a security perspective. Being able
    to design securely once and reuse everywhere is powerful. However, in reality
    there will be nuance to the adoption of that reference architecture. Not every
    application will be able to leverage the reference architecture verbatim and it
    is impractical to build a reference architecture that covers all possible scenarios.
    This is where local architects will need to interpret the architecture in a way
    that meets the spirit of the design, especially the security aspects, while applying
    it in the context of the application.


    I’ll use our favorite organization Superior Products to illustrate this further.
    Superior Products has several applications that are accessed through an API gateway.
    The user logs in through a mobile device or other user agent to the API gateway
    which then provides the access to the services through an API provider. This is
    a less than ideal scenario since Superior Products has to manage the user credentials
    in a datastore. The organization would like to move to a solution that allows
    for decentralized authentication through a third-party identity provider.


    **DEFINITION** An identity provider (IdP) is used to create, maintain, and manage
    identity information through a decentralized network. This distributed network
    provides authentication information and services.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'Dashing Danielle has heard the pain points from several different applications
    on the management of credentials and ensuring that users are able to gain access
    to the API services they offer. With this in mind she sets off on some research
    to determine what opportunities there are to develop a pattern and reference architecture
    that can be used by the applications in Superior Products. She comes across several
    different options but lands on a solution that leverages a third party IdP solution
    that is popular in the industry.


    > **NOTE** There are many IdP solutions on the market. One of the leaders is Okta,
    but there are others like Ping Identity, RSA, Microsoft, and Oracle.


    Dashing Danielle works with the third party to develop a basic architecture that
    can be used to bring to the ARB to get buy in. The architecture consists of a
    simple diagram that includes an unnamed IdP, the API gateway, and the backend
    services.


    # Simple reference architecture for API access


    ![](img/cc84747f93d290964598894b4f5c153b_140_0.png)


    Figure 5.5 API architecture to be used as reference architecture


    Dashing Danielle documents the following workflow to help establish the basic
    understanding of how the IdP will be used in accessing Superior Products APIs:


    +   - A user will login through the mobile or web application where the IdP will
    then be used to check the credentials and issue a token.

    +   - Another token is created for that user and app through the API gateway’s
    OAuth token generation service. This is used to access the application going forward.

    +   - The API gateway and the IdP ensure that the request is within the boundaries
    of the user’s permissions and returns a token to the end-user application that
    is used to call the actual API.

    +   - The API gateway verifies the token before serving up the requested API.


    Dashing Danielle brings this architecture pattern to the ARB where, after several
    iterations and clarifications, it is approved as a reference architecture in the
    ARB. Dashing Danielle is then able to take this approved architecture to the various
    applications that are currently experiencing issues with managing users of their
    API’s. She coordinates with the chosen third-party IdP to bring the solution across
    the board at Superior Products.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '> **NOTE** To learn more about APIs and security, check out API Security in
    Action by Neil Madden.


    At Acme Services, things are not going as well. There is no ARB which means that
    there is little opportunity to coalesce around a common architecture or standard.
    Each product finds themselves often developing a design that resembles their peer
    applications but using different solutions. This drives up the cost to the organization.
    Because there is no ARB, two of the teams came to the same conclusion that they
    wanted to leverage a third-party to manage identities for them but ended up pursuing
    two different third parties leading to additional complexities in the organization’s
    architecture. Eventually, their API economy is accessed in a disjointed way that
    increases cost, reduces supportability, and becomes a nightmare to manage.


    # 5.3.3 Bringing requirements into the organization


    One of the benefits of creating the reference architecture and standards is that
    these will lead to the development of requirements that can be easily consumed
    by development teams. Where standards and reference architecture focus primarily
    on the strategic level, requirements bring it down to the level where the code
    is actually being developed. As a reminder, requirements are part of the initial
    steps of software development. These are used to describe how the software should
    behave and the various goals it is being designed to achieve.


    As I have been laying out in this section, the ARB is used to approve and manage
    the various architecture and standards, but it does not deal with requirements
    as that is in the hands of the local development team, including the product owners
    and architects. However, the reference architecture, standards, and industry practices
    are used as guidelines for developing those requirements. For instance, in the
    case of the reference architecture described previously, there would be several
    requirements around the access of the API gateway, the token generation, the IdP,
    and others. From a security standpoint, these requirements would focus more on
    ensuring that the architecture is applied in a way that does not compromise the
    confidentiality, integrity, and availability of the application and the data.
    That means that, as an example, the requirements will be written to state that
    tokens will be send over a secure channel (for example TLS), that the tokens will
    be short-lived which reduces the potential exposure, and that the design is able
    to handle potential disruptions with the IdP.


    > **EXERCISE** Using the reference architecture earlier, write a requirement that
    can be used to implement a portion of that architecture. Even better, if your
    organization already has reference architecture in place, access it and write
    a requirement that meets a portion of that architecture. If the team you work
    in is required to meet that architecture, introduce the requirement in your team.


    When creating requirements, it’s important to ensure that they provide sufficient
    guidance on what is being asked and that, especially when they are tied to an
    architecture or industry standards, they meet the spirit of the overall guidance.
    Being able to create requirements that meet the overall framework means that the
    architecture can be met by'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'the development team through prescriptive statements. There are other guiding
    means that can assist in generating requirements. I''ll talk about those next.


    # 5.4 Maturity models


    Where reference architecture and standards are primarily developed within the
    organization to give specific guidance on what the organization believes is best
    practices for developing software, frameworks and maturity models are used to
    help organizations measure themselves against the industry.


    > **DEFINITION** A maturity model looks at the people, processes, and technology
    in an organization and measures that against a numbers-based maturity level. It
    is a measure of the organizations current position in a given disciple and provides
    steps on how to raise the maturity to a higher level. Although in our case we
    are curious to know the security maturity of an organization, maturity models
    are used broadly in other technology domains.


    There are two well-known maturity models that are used for developing security.
    One is OWASP''s software assurance maturity model (SAMM) and the other is building
    security in maturity model (BSIMM).


    +   - OWASP SAMM: https://owaspsamm.org/

    +   - BSIMM: https://www.bsimm.com/


    Both are useful ways for an organization to understand where they need to put
    their focus when it comes to developing security practices. However, as you will
    see, each of their approaches are different.


    # 5.4.1 OWASP SAMM


    OWASPs SAMM is a maturity model that follows a more traditional approach to raising
    the security maturity of an organization. SAMM focuses on the secure software
    development lifecycle while being designed to be technology agnostic. There are
    three levels of maturity in SAMM with one being the lowest and three being the
    highest. It is not important for every organization to put together a roadmap
    that gets them to level three, as every organization has a different risk appetite.
    If the organization does not process or manage any sensitive data, and is not
    have any critical products, level one or two might suffice. The current version
    of SAMM contains five functions:


    +   - Governance

    +   - Design

    +   - Implementation

    +   - Verification

    +   - Operations


    If this looks familiar, it''s because this tracks well with the SDLC and enables
    the organization to assess and then build a plan to address gaps in each stage
    of the SLDC. Within the five business functions there are fifteen security practices
    that align to those functions. Each practice dives into the specific items that
    are used to meet that practice and'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'have a set of activities that align to three maturity levels. With each level
    becoming increasingly more difficult to achieve.


    # OWASP Software Assurance Maturity Model (SAMM)


    ![](img/cc84747f93d290964598894b4f5c153b_143_0.png)


    Figure 5.6 Overview of the SAMM version 2


    For example, table 5.1 shows the security practice of Threat Assessment under
    the Design function in SAMM. The focus is around application risk profile and
    threat modeling so each of the questions are related to the organizations practices
    around risk profiling and threat modeling to identify the current maturity level.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Table 5.1 Example questions in SAMM related to the Threat Assessment practice


    | Maturity Level | Question |

    |---|---|

    | 1 | Do you identify and manage architectural design flaws with threat modeling?
    |

    |  | You perform threat modeling for high-risk applications

    You use simple threat checklists, such as STRIDE

    You persist the outcome of a threat model for later use |

    | 2 | Do you use a standard methodology, aligned on your application risk levels?
    |

    |  | You train your architects, security champions, and other stakeholders on
    how to do practical threat modeling

    Your threat modeling methodology includes at least diagramming, threat identification,
    design flaw mitigations, and how to validate your threat model artifacts

    Changes in the application or business context trigger a review of the relevant
    threat models

    You capture the threat modeling artifacts with tools that are used by your application
    teams |

    | 3 | Do you regularly review and update the threat modeling methodology for your
    applications? |

    |  | The threat model methodology considers historical feedback for improvement

    You regularly (e.g., yearly) review the existing threat models to verify that
    no new threats are relevant for your applications

    You automate parts of your threat modeling process with threat modeling tools
    |


    Each of these questions is designed to highlight processes that the organization
    should follow to provide better overall security in their SDLC, with each process
    becoming more difficult to obtain. In this case, simply performing a threat model
    is a foundational step. Having a process that revisits that threat model and methodology
    on a regular basis is a more mature approach to identifying application business
    risk.


    With the assess and build process the organization can leverage SAMM on existing
    products and lifecycles. Should the organization purchase another company or product,
    SAMM can be used to measure the security of newly acquired software. There are
    four basic steps to SAMM that assist the organization into assessing their current
    level and implementing a roadmap to a more secure level.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Software Assurance Maturity Model Structure


    ![](img/cc84747f93d290964598894b4f5c153b_145_0.png)


    Figure 5.7 Structure of the SAMM


    Similar to other maturity models the first step is to obtain the organizations
    current maturity. In this stage the organization will evaluate its current posture
    and practices by identifying and interviewing stakeholders. OWASP has developed
    a handy toolbox that provides interview questions that should be used during the
    assessment: https://owaspsamm.org/assessment/


    Here are some example questions:


    +   - Do you understand the enterprise-wide risk appetite for your applications?

    +   - Do you regularly review and update the strategic plan for application security?

    +   - Do you publish the organization’s policies as test scripts or run books
    for easy interpretation by development teams?

    +   - Do you require employees involved with application development to take SDLC
    training?


    The goal of these questions and the responses is to build a rating that is used
    to ultimately provide the maturity level of the organization. Although not all
    questions are yes/no, the SAMM toolbox allows the responder to provide some nuance
    to the answers such as yes with a caveat. In other words, "Yes, we review x annually"
    or "Yes, we review x before significant decisions". Once the interviews have been
    completed, a score will be associated with each of the functions and security
    practices that shows how the organization meets the maturity in that given function.
    This score is then combined with the other areas to create an overall maturity
    score for the organization. In order to successfully perform an interview, you’ll
    want to ensure consistency with the interview process with the interviewer and
    be flexible with the process. Look at different formats for performing the interview
    like anonymous questionnaires, workshops, or in-person interviews. The organizations
    culture should be taken into consideration during this activity to ensure the
    organization gets the most benefit.


    Now that the organization understands it current posture, it’s time to set a target
    and define a plan. As was mentioned before the target does not necessarily need
    to be level three across the board. In some cases, the organization may take the
    approach that they will accept a certain level of risk due to not being at the
    highest level, or the application is not'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'sensitive enough to warrant the overhead of the higher maturity level. Although
    each effort varies, when setting the target, it’s critical to understand what
    the effort might be for the application team. This also means that the team must
    include the dependencies that might be on each of the activities with other teams
    and external sources.


    With the assessment complete, and the targets defined, the team can follow a general
    roadmap planning exercise that outlines how the organization will gradually builds
    the maturity to the desired level over time. Although there is no prescriptive
    timeframe related to SAMM the organization may be under internal or external pressure
    to obtain a particular level by a certain time. For instance, the organization
    may be asked by clients to adopt a formal process around something like threat
    modeling by the year end. If the organization does not currently have a threat
    model process, they would want to prioritize the threat modeling activities in
    the roadmap and work backwards from the year end date in order to define the milestones.


    Lastly, the fun part: implementing the path to a more mature secure SDLC. With
    the roadmap in hand the application security team will work with the organization
    to help adopt the new processes. It is important for the stakeholders to be aware
    of the changes, the purpose, and the milestones all throughout this phase. The
    application security team will need to collect metrics and track progress along
    the way to ensure that the organization is on target for the desired level.


    The SAMM provides an organization a well-defined approach to discovering their
    current security posture as it relates to software security. It is a prescriptive
    approach to building maturity. But wouldn’t it be nice to see what other organizations
    are doing to build security into their development process?


    # 5.4.2 Building Security in Maturity Model


    Where SAMM allows the organization to look at their current security posture in
    the secure software development process and build a roadmap that reflects OWASP’s
    guidance maturing, BSIMM looks at the industry peers of the organization to help
    build that roadmap. BSIMM is built on interviews with 128 organizations over nine
    industries. Like SAMM, BSIMM is organized into four domains with twelve software
    security practices and 122 activities.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Building Security in Maturity Model (BSIMM)


    ![](img/cc84747f93d290964598894b4f5c153b_147_0.png)


    Figure 5.8 BSIMM structure and organization


    As of this writing, the current version of BSIMM is version 12 which included
    9,000 software security members in both the security groups as well as security
    champions in the organization. The industries that were included in BSIMM 12 were:


    +   - Financial

    +   - FinTech

    +   - Independent software vendors

    +   - Tech

    +   - Retail

    +   - Insurance

    +   - Healthcare

    +   - Cloud

    +   - IoT


    BSIMM includes three levels of maturity that relate to the observed frequency
    of the given activity, with level 1 being infrequently observed and level 3 being
    most frequently observed.


    > DEFINITION Activity are actions carried out or facilitated by a software security
    group (SSG) as part of a practice. Activities are divided into three levels in
    the BSIMM based on observation rates. Frequently observed activities are designated
    level 1, with less frequent and infrequently observed activities designated as
    levels 2 and 3, respectively.


    For each of these activities the organization can measure their posture against
    others in their particular industry. Although this is not the prescriptive approach
    that OWASP takes with SAMM, it helps the measuring organization know how it measures
    up compared to its peers. One of considerations with BSIMM is that the best practices
    that are outlined may not be a great fit for your organization, but it is hard
    to argue if you come across activities that are being completed by many organizations
    in your industry. One example of this is identifying your personally identifiable
    information (PII) obligations which means knowing the'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'requirements related to the capture and retention of PII in your system as
    well as building an inventory of PII across the organization. When the vast majority
    of the organizations that participate in BSIMM are doing this activity, it’s a
    safe bet that your organization should be as well.


    To this point the BSIMM provides five of the top activities that most organizations
    should pursue regardless of their industry. These are activities that are being
    integrated in almost all of the organizations that are part of the BSIMM. Once
    again, peer pressure is a strong motivator and these activities have consistently
    ranked at the top five for several years.


    # Table 5.2 Example questions in SAMM related to the Threat Assessment practice


    | Activity Name | Domain and Practice | Description |

    |---|---|---|

    | Implement life cycle instrumentation and use to define governance | Governance:
    Strategy and metrics | This can be best defined as applying application security
    tools into the SDLC process in order to gather metrics as it relates to the security
    policies in the organization. |

    | Ensure host and network security basics are in place | Deployment: Software
    environment | Before running your developed software, ensuring that the environment
    it will be deployed to is secure. That means having the systems and network that
    it’s deployed to properly secured. |

    | Identify PII obligations | Governance: Compliance and policy | No surprise,
    but this is related to the data that an organization accumulates. More importantly,
    it’s about knowing what type of data is being stored and where it is being stored.
    |

    | Perform security feature review | SSDL touchpoints: Architecture analysis |
    When architecture changes that impacts the security level or model, an architecture
    review should occur to understand the risk. |

    | Use external penetration testers to find problems | Deployment: Penetration
    testing | Your internal testers and tools are great at finding certain issues,
    but nothing brings a security issue to the forefront quicker than an issue uncovered
    by an external tester. |'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'While these activities are the most common across the organizations that are
    part of BSIMM, it''s important to see the trends of where organizations are showing
    the most growth over the past versions. For instance, the top three activities
    that have seen the biggest growth in the past several versions are:


    +   - Use orchestration for containers and virtualized environments

    +   - Ensure cloud security basics

    +   - Use application containers to support security goals


    Each of these have seen several hundred percent increases from the past versions,
    meaning that more organizations are beginning to adopt these activities over the
    past few years. This is no surprise given the increase in adoption of cloud and
    container technology. As these technologies expand, the need to increase the security
    around them grows.


    What do these metrics show about an organization’s software security initiative?
    It shows not only how an organization measures up to its peers, but how the industry
    in general is moving and how the organizations are addressing the new concerns.
    Armed with this knowledge, it’s time to build a plan around how to attack any
    known deficiencies in the organization with a Maturity Action Plan (MAP). This
    helps the organization address the open challenges and objectives by building
    an action plan that raises the maturity. Currently Synopsis offers services that
    help the organization determine what steps need to be taken to build the MAP.
    This includes first looking at the organizations current posture with an assessment
    of the security program. From there a future state is defined and the gaps are
    highlighted to build the roadmap. The last step is to develop the action plan
    to achieve the desired state.


    As I mentioned, BSIMM is a great measure against peers in your respective industries.
    One of the key aspects to understand with BSIMM is that if most of your peers
    are tackling software security with the same or similar activities, then this
    is a good indicator that you should be doing it as well. This is the power of
    BSIMM.


    # 5.4.3 Addressing your security immaturity


    Both BSIMM and SAMM take two different approaches to building secure software.
    So, which makes the most sense? Of course, it depends. If you absolutely need
    to see how you measure up against the other organizations in and out of your organization,
    then conducting a BSIMM engagement makes sense. However, if you are looking to
    do a basic self-assessment that shows your current software security posture then
    SAMM is the better option as it is open, and assessments are conducted by the
    organization.


    The most important factor in following a maturity model is to understand what
    your organization can bear. Getting a BSIMM assessment and a MAP that shows where
    you should be in the next 12-24 months will be worthless if your organization
    is not prepared to do the work of increasing the maturity. This means that the
    leadership must be bought in to the strategy, and the engineering organization
    must be aligned with the application security function. More importantly, the
    right resources must be dedicated to the initiative. Take for example that in
    both the SAMM and BSIMM that architecture analysis is an activity. This activity
    requires knowledgeable resources both in the engineering team and the application
    security team to be able to review the architecture for security control effectiveness,
    and'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'mitigation of threats. Not all of the organization’s resources will be able
    to perform this level of activity effectively.


    The last comparison points to make about the BSIMM and SAMM is to know whether
    you require or need an external assessment. Since BSIMM is proprietary to Synopsys,
    the BSIMM assessment is by default external. The SAMM allows you to perform a
    self-assessment, however, like I stated previously you will need expertise in
    your organization to conduct that assessment. You can have a third party perform
    a SAMM assessments if that is the preference though.


    There is no right answer with a maturity model, but it is an important factor
    in what I will talk about next. With a maturity model, especially BSIMM, it makes
    it easier to sell an overall software security initiative to the stakeholders
    in an organization and build a better path towards a democratized and decentralized
    security program that builds security into software early.


    # 5.5 Decentralized application security


    As I have mentioned numerous times at this point, securing software requires a
    village of security minded individuals and teams. Application security resources
    cannot be in every coding decision, every design review, and every assessment.
    The current approach of a centralized team that applies software security tools
    which create an output of security vulnerabilities that need to be resolved in
    a certain time period creates friction, frustration, and drag on the development
    of software. Moreover, this centralized application security function becomes
    a team of ankle biters that are attempting to provide security by telling the
    development teams that they are awful at writing secure code.


    Centralized vs Decentralized AppSec


    ![](img/cc84747f93d290964598894b4f5c153b_150_0.png)


    Figure 5.9 Application security centralized approach vs decentralized


    Taking the decentralized approach means that the application security team focuses
    their efforts on building the structure of secure software development as opposed
    to the daily operational aspects of managing tool and driving closure of vulnerabilities.
    These are still important and needed in all organizations, however, application
    security teams cannot scale to the level needed in order to be the ever present.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'Building the structure to support the secure development of software, the application
    security team will create the reference architecture, the standards, and requirements
    to be used by the engineering organization. Additionally, it is critical that
    they become a part of the fabric of developing software. This means that they
    should sit on review boards and other architecture or leadership groups to ensure
    that security is made part of the process. Lastly, the application security team
    should focus on building an education structure that helps create champions or,
    at the very least, raises the security education of the develop organization.
    I will cover this more in depth in the next chapter, but the critical takeaway
    here is that security needs to become part of the culture of the organization
    in order for the software to be developed in a secure manner. One popular method
    of building or expanding the security culture is with a security champions program.


    # 5.5.1 Security champions program


    I’ve talked about them a bit in previous chapters. They’re called many things,
    mostly champions or coaches, but the goal of security champions is to spread the
    wealth of security across the organization. Starting a program that build security
    champions will rely on a change of culture in the organization and includes buy-in
    from the engineering leadership and organization as a whole.


    The general definition of a security champion is a non-security employee that
    is part of the organization usually in some type of development or development
    support role. They can be from one of the following roles:


    +   - Developer

    +   - Quality assurance

    +   - Architect

    +   - Designer

    +   - DevOps


    To start the security champions program the application security team will first
    need to identify what teams and applications are part of the program. Not every
    team or application may take part especially if they are a small team or low risk
    to the organization. Obviously, the focus will be on the highest risk applications
    in the organization to begin with. This list should be well vetted and approved
    by the appropriate leadership in both security and engineering. This will help
    ensure that no team was missed and that the ones that are intentionally left off
    the list are agreed upon.


    Once the list of teams is agreed upon, the role of the security champion should
    be defined. The most critical qualification is that they should want to be there
    and have a passion for security. Forcing employees into the champion program will
    lead to a failed program. These champions will be required to spend a certain
    amount of their time on driving security. In some cases, this can be as low as
    5% of their time dedicated to driving security in the product area that they are
    a part of. However, the organization needs to set the time effort expectation
    early so that there is no confusion around priority and activity. The expectations
    of a security champion vary from organization to organization, and it depends
    on their goals.'

    +   - Preventing the browser from loading the page in frame using the X-Frame-Options
    or Content Security Policy (frame-ancestors) HTTP headers.

    +   - Preventing session cookies from being included when the page is loaded in
    a frame using the SameSite cookie attribute.

    +   - Implementing JavaScript code in the page to attempt to prevent it being

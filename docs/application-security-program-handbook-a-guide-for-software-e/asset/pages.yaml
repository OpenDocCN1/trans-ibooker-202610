    her champion role. Brilliant Brian has been working in the team for several years
    and has strong knowledge of the product. He has also been in many of the same
    meetings as Dashing Danielle where security has been the prime topic. He has become
    increasingly interested in the security space and gladly raises his hand when
    the opportunity came up to be part of the security functions in Superior Products.


    Dashing Danielle first works with Brilliant Brian to develop a training path that
    will get him to the champion level. At Superior Products, they are using a leading

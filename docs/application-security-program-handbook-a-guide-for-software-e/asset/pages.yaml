- pgno: 54
  md: 'activity is due to these adversaries that are just looking to test their skills
    or gain bragging rights with their friends. This type of motivation may make their
    attacks less impactful, but they are still widespread.


    # Botnets


    Botnets are a common attack tool used by script kiddies. This is a method used
    to perform DDoS attacks at scale. These networks of bots are compromised devices
    that have malicious code injected into them so that they may be used in a future
    attack. Most of the time they are used to target organizations for volumetric
    types of attacks like DDoS. They can be Internet of Things (IoT) devices, laptops,
    desktops, printers, or any other device that has an internet connection and can
    be used to make web calls. Some of these botnets are even for sale or can be rented
    for a period of time. For this type of attack most organizations are not equipped
    to mitigate it themselves and need to look for outside help in the form of firewalls
    both at the application and the network layer. Other controls require your organization
    to know the type of traffic that it is expecting to see and where it comes from
    so that the controls can be put in place to limit activity to just those known
    locations. This might require geofencing that limits traffic to known good countries
    or locations.


    # 2.6.2 Insider


    The insider threat is an often-overlooked category. These are users that usually
    have privileges to data and systems that outsiders would not. Think about the
    system administrator for your organizations domain controller. Now that you have
    that person in your mind, think about that person being disgruntled. What about
    the back-office admin in a medical facility that has access to patient records?
    What if they are no longer "feeling" their job. These things do happen. Although
    it is fair to say that most insider leaks are accidental and not due to the activity
    of a malicious actor.


    The numbers vary on insider threats since not everything is required to be reported.
    However, Ponemon Institute produced the "2020 Cost of Insider Threats: Global
    Report" that showed that criminal insiders accounted for around 23% of insider
    incidents and 14% were due to criminals posing as insiders. These types of attacks
    are usually thought of as a problem for the Information Security team to deal
    with, but keep in mind that software engineering teams not only have access to
    the organization’s intellectual property in the form of proprietary code, but
    also usually have elevated rights to environments that may have sensitive information.


    The motivations for an insider can vary. As mentioned, some leaks at the hands
    of an insider are accidental. This is due to the lack of controls around access
    to information like a lack of proper segmentation or a least privilege model that
    enforces access to only those that need it. Controls should also be in place to
    guarantee that sensitive data and production data is not able to be moved from
    a production environment to another location. When motivation is to take revenge
    on the organization for a perceived slight, this becomes more complicated to defend.
    However, getting to a zero-trust type of model means that you should, unfortunately,
    suspect that anyone that has access to your most sensitive data is malicious and
    provide the appropriate auditing and protections around access to that data.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# 2.6.3 Cybercriminal


    Depending on the industry that you are working in, cybercriminals may be the most
    worrisome. Most organizations that are in industries like the financial or healthcare
    industries perhaps face the most difficult challenges when it comes to cybercriminals.
    There is one thing that motivates cybercriminals: Money.


    As mentioned, many times, data is the new oil. It’s a commodity and organizations
    collect, trade, and monetize it. There is some folk lore that attributes a comment
    to Willie Sutton, a famous bank robber in the 1900s. As the lore goes, Willie
    Sutton was once asked why he continues to rob banks. His famous reply supposedly
    states, "Because that’s where the money is." Turns out that may not have been
    totally accurate according to Willie Sutton himself and was perhaps just an editor
    attempting to be pithy. Regardless, the statement is true and sums up, pretty
    well, why cybercriminals continue to target organizations and their data.


    Their techniques vary. Ransomware, DDoS, data exfiltration, or even physical theft
    of devices. The goal is to get to the data, put it on the black market, and make
    some quick money. Their technical abilities vary, but they are more adept at infiltrating
    an organization from the outside than the previously mentioned actors. They will
    use off-the-shelf or purchased tools, or they can go as far as developing and
    customizing their own exploits to target specific entities. They are more targeted
    in their approach and will look for low hanging fruit in order to compromise an
    organization.


    # 2.6.4 Hacktivist & Terrorist


    I don’t mean to lump hacktivist and terrorist in the same category since they
    have different goals, but they are both propelled by the desire to publicly make
    an example of someone or some organization in order to advance an agenda. For
    both actors this tends to be of a political nature. But that’s where comparisons
    usually diverge.


    Hacktivist will take up causes for people or movements aimed to effect change
    towards a shared goal. They are usually a loose band of individuals with a high
    level of skills. They will look to deface websites of organizations they don’t
    agree with or even DDoS them. Their goal is to raise awareness around a cause
    and their methods will vary.


    Cyber terrorists move beyond political motivations and will often take up religious
    or ideological causes and target organizations accordingly. The targets can be
    individuals, or organizations and will often look to target key infrastructure
    of nations with the intent of causing physical harm.


    # 2.6.5 Advanced Persistent Threat


    Advanced persistent threats, or APTs, are gaining more recognition recently as
    nations such as Russia, China, North Korea, Israel, and the United States find
    their cyber differences (putting it mildly) out in the public space. APTs are
    deep pocketed, nation backed entities whose sole intention is to gain tactical
    and strategic advantage over adversaries. This shows up in their effort to gain
    access to organizations in specific industries, critical infrastructure, military
    entities, and so forth. In most cases, the APT will lie in wait and stay hidden
    until an order comes.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'As mentioned, these are deep pocketed groups and are the highest skilled adversary
    that any organization will face. APTs are usually branches of an already established
    organization within the nation such as intelligence services or the military.
    Their focus is to gain a foothold into another nation with the intention of creating
    domestic chaos, take out military capability, or cripple a nation’s economy.


    Defending against these types of attackers is not easy and the best advice is
    often to do the basics of monitoring and protection. However, Rob Joyce who led
    the NSA’s elite Tailored Access Group whose purpose was to break into adversaries’
    systems, summed up every organization nightmare during a conference in 2016:


    > We put the time in ...to know [that network] better than the people who designed
    it and the people who are securing it," he said. "You know the technologies you
    intended to use in that network. We know the technologies that are actually in
    use in that network. Subtle difference. You’d be surprised about the things that
    are running on a network vs. the things that you think are supposed to be there.


    Rob Joyce


    It’s important to highlight the last statement here. Systems are complex, and
    in any large organization the amount of applications and services running can
    be immense. Sophisticated attackers are counting on large organizations not having
    the bandwidth, personnel, or tools to detect malicious activity quickly. Their
    often right.


    # 2.6.6 Why do we care?


    Defending against these threat actors requires varying techniques. Organizations
    often find themselves as victims to broader geo-political attacks that have nothing
    to do with them. Especially when it comes to hacktivist, cyberterrorist, and APTs.


    ![](img/cc84747f93d290964598894b4f5c153b_56_0.png)


    Figure 2.9 Relation of threat actors vs defense


    Knowing your adversary is key to survival. Knowing that script kiddies will largely
    use already identified, automated attacks means that you’re off the shelf tools
    used for scanning'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'and protection will usually suffice. Defending against more sophisticated attackers
    like the hacktivist, cyberterrorist, cybercriminal, and APT mean that your defenses
    need to be more robust and a plan for business continuity is required in order
    to recover from a potential attack. For these types of attackers, you need to
    move from the preventative mindset and pivot to a detect and respond mindset.
    The more sophisticated the attacker is, the more resources are needed to defend.
    Regardless of the attacker, the basics of security need to be integrated. Scanning,
    patching, vulnerability management, visibility, and defense in depth are all required
    regardless of the threat actor.


    # 2.7 Measuring risk


    This book is not about risk, though it is an integral part of secure software
    development. There are plenty of resources available to help organizations understand
    and balance their risk. The goal of this section it to highlight some of the concepts
    with risk as it relates to an organization. Understanding this relationship will
    help application owners know why certain controls are used and needed. This leads
    to a stronger defense in depth model. Without knowing the risks that are posed
    you run the risk of overcorrecting for risks that are not of a legitimate concern.


    As mentioned, there are many different methods for measuring risk. For the purpose
    of this book, we will use the Open Web Application Security Project (OWASP) methodology
    aptly named the OWASP Risk Rating Methodology that allows you to identify risks
    through a series of steps. It uses a number range from 0 to 9 to assign a value
    to a particular rating. The lower the number, the lower the level and vice versa.
    Although this is not a perfect system, the goal is to create a means for scoring
    security issues.


    > **OWASP**

    > Throughout this book we will leverage many of the projects from OWASP. When
    it comes to application security, OWASP is generally the first stop for most application
    security professionals. It is an open-source community of thought leaders that
    have built many of the foundational security practices used today. One of the
    most widely recognized application security projects is the OWASP Top Ten Web
    Application Security Risks. This documents the top 10 most impactful security
    risks that a web application faces. (https://owasp.org/)


    Using the OWASP Risk Rating Methodology the measured risk comes down to a simple
    equation:


    ```

    Risk = Likelihood * Impact

    ```


    The likelihood is calculated by asking questions related to the threat agent and
    the found vulnerability. More on this in a bit. The aim of these questions is
    to uncover how likely an exploitation of the found vulnerability may be. With
    the impact calculation there are another eight questions that are geared toward
    identifying what will happen to the organization and technology should the exploit
    be successful. This will lead you to the ultimate rating of the risk which allows
    you to prioritize and apply the appropriate controls to eliminate or mitigate
    the risk properly.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'Before diving into the risk rating methods with OWASP, it’s important to callout
    that once a risk has been rated there are several things that an organization
    can then do with that information and that risk.


    # 2.7.1 Remediate, mitigate, accept


    In general, there are three methods to managing an identified risk. The first
    is to remediate the risk. This requires the organization to take corrective action
    to fully implement risk elimination. An example would be a case where the application
    faces the risk of formjacking.


    **DEFINITION** Formjacking is an attack where an attacker is able to inject code
    that skims data from an HTML form. One of the most well-known types of formjacking
    is an attack called Magecart which specifically targets checkout pages to steal
    users’ information by injecting malicious code in third party supplied code to
    a website.


    This is where an attacker is capable of taking over a form on a website that allows
    them to inject code that steals information. To remediate this risk, the organization
    will need to perform regular testing through tools and penetration tests to identify
    opportunity of code injection into the forms they use. They will monitor traffic
    and create an allow list that only allows outbound traffic to known good locations.
    Additionally, they may look to leverage subresource integrity tags (SRI) to create
    a hash of content that is used by the application so that it can determine whether
    the content has been tampered with. They may even go as far as eliminating forms
    if they are no longer needed.


    If remediation is not feasible for business or technology reasons. The next step
    is to identify ways to mitigate the risk by placing in compensating controls.
    This can also be considered reducing of the risk since it may not completely eliminate
    it, but instead makes it less likely and raises the bar for an attacker. In most
    cases, mitigation involves additional tools like a WAF or by reducing the size
    of the attack surface by limiting the audience down to as few accounts as possible
    and monitoring those accounts closely. Again, the goal of remediation is not to
    eliminate, if this isn’t possible, but to reduce the attack surface to as small
    as possible.


    The last option is to accept the open risk. This is less than an ideal option
    as it means that the organization is aware of the risk but has chosen to leave
    it open and accept it. This is should still be coupled with risk reduction so
    that the risk is as minimal as possible. A prime example of where risk is accepted
    is in the case of an older application that simply cannot be shutdown. It may
    be due to the fact that the organization has been unsuccessful in getting clients
    to move to a new product or a new version of the given application, but whatever
    the case is the organization requires the risk to remain open due to a business
    decision. In many cases, the acceptance of risk is taken when the impact to the
    business is low. In other words, the business is willing to accept a breach and
    knows that the total cost to the business would be low.


    There are other facets of risk that can come into play such as cyber insurance
    and risk transfer. However, the purpose of this section is to cover the primary
    ways that organizations treat risk as it applies to the products and applications
    they create.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# 2.7.2 Identify the risk


    The first step in rating the criticality of a risk using the OWASP Risk Rating
    Methodology is to identify what the actual risk is to the application or organization.
    This could come through due to the nature of the organization, the type of application
    in use, or geo-political factors. Risk is ever evolving and may even be eliminated
    by doing nothing as both risk and technology changes.


    This is where knowledge of your threat actors (adversaries), a well-documented
    architecture, and strong knowledge of how your application is deployed and used
    will come in handy. Identifying risk can come from conversations with the business
    and technical people within the organization, it can be made apparent by a client
    who reports a risk they identified, it can come from fellow industry partners,
    or it can come from your internal tools. Regardless of method of risk identification
    the most important part is to know you have risk.


    In the OWASP Risk Rating Methodology there are scores associated with each component.
    The higher the score, the higher the risk. When performing a risk rating it is
    important to have the right resources involved with the measurement. This includes
    not just technical resources, but also business resources that understand what
    the impact to the business and organization would be for a given risk. Measuring
    of the risk can take anywhere from a few minutes to a few hours depending on the
    resources involved and the complexity of the risk. It is also important to highlight
    that much of the risk rating is subjective where, depending on the resources involved,
    it is easy to go down a rabbit hole on conversations over the risk. An example
    of this is where participants in the process may differ on their perception of
    the risk or aspects of the mitigations that are available. Key to success here
    is to lay out ground rules, have previous examples handy, and keep the participants
    on topic.


    # 2.7.3 Estimating likelihood


    Likelihood is as simple as identifying when a risk may be exploited. We are all
    familiar with the statistics around driving a vehicle and the likelihood of a
    potential accident. Although many of us are aware of this risk, it doesn’t stop
    us from getting into our vehicles on a regular basis. It’s a risk we are willing
    to or need to take. The bottom line is that we never know when or even if an accident
    will occur on a commute to the office or another location, we simply know that
    statistically it may occur. Additionally, certain factors come in to play with
    this analogy. How fast we drive, other vehicles on the road, the safety of the
    route to our destination, and so on. The same applies with understanding the likelihood
    of a risk. OWASP gives us eight factors for the threat actor and the vulnerability
    to help us measure the likelihood. The scores associated with each item is a weight
    that represents the impact of that item. This is used in the final calculation
    of the actual risk.


    Threat Actor Factors:'
  merge: -1
  img_proc: true
- pgno: 60
  md: '+   - Skill Level - How technically skilled is this group of threat agents?
    No technical skills (1), some technical skills (3), advanced computer user (5),
    network and programming skills (6), security penetration skills (9),

    +   - Motive - How motivated is this group of threat agents to find and exploit
    this vulnerability? Low or no reward (1), possible reward (4), high reward (9)

    +   - Opportunity - What resources and opportunities are required for this group
    of threat agents to find and exploit this vulnerability? Full access or expensive
    resources required (0), special access or resources required (4), some access
    or resources required (7), no access or resources required (9)

    +   - Size - How large is this group of threat agents? Developers (2), system
    administrators (2), intranet users (4), partners (5), authenticated users (6),
    anonymous Internet users (9)


    Vulnerability Factors:


    +   - Ease of Discovery - How easy is it for this group of threat agents to discover
    this vulnerability? Practically impossible (1), difficult (3), easy (7), automated
    tools available (9)

    +   - Ease of Exploit - How easy is it for this group of threat agents to actually
    exploit this vulnerability? Theoretical (1), difficult (3), easy (5), automated
    tools available (9)

    +   - Awareness - How well known is this vulnerability to this group of threat
    agents? Unknown (1), hidden (4), obvious (6), public knowledge (9)

    +   - Intrusion Detection - How likely is an exploit to be detected? Active detection
    in application (1), logged and reviewed (3), logged without review (8), not logged
    (9)


    As you can see the likelihood factors are looking at the threat actors as it relates
    to the vulnerability. The organization can then take this information to determine
    how likely a vulnerability is to be exploited based on the skill level and knowledge
    of the vulnerability.


    # 2.7.4 Estimating impact


    Impact is a bit different when it comes to measuring as it is not based solely
    on what can be determined by just technical folks. Impact must leverage information
    related to the business considering that the impact is a measure of what is likely
    to happen to the organization should a vulnerability be exploited. One important
    consideration with impact is that there are two types of impact. Technical impact
    is a risk to our core security concerns of confidentiality, integrity, and availability.
    This focuses primarily on the systems that run and manage our application. Second
    is the business impact which prioritizes what is important for the business that
    is running the application and is usually financial in nature.


    Technical Impact Factors:'
  merge: -1
  img_proc: true
- pgno: 61
  md: '+   - Loss of Confidentiality - How much data could be disclosed and how sensitive
    is it? Minimal non-sensitive data disclosed (2), minimal critical data disclosed
    (6), extensive non-sensitive data disclosed (6), extensive critical data disclosed
    (7), all data disclosed (9)

    +   - Loss of Integrity = How much data could be corrupted and how damaged is
    it? Minimal slightly corrupt data (1), minimal seriously corrupt data (3), extensive
    slightly corrupt data (5), extensive seriously corrupt data (7), all data totally
    corrupt (9)

    +   - Loss of Availability - How much service could be lost and how vital is it?
    Minimal secondary services interrupted (1), minimal primary services interrupted
    (5), extensive secondary services interrupted (5), extensive primary services
    interrupted (7), all services completely lost (9)

    +   - Loss of Accountability - Are the threat agents’ actions traceable to an
    individual? Fully traceable (1), possibly traceable (7), completely anonymous
    (9)


    Business Impact Factors:


    +   - Financial damage - How much financial damage will result from an exploit?
    Less than the cost to fix the vulnerability (1), minor effect on annual profit
    (3), significant effect on annual profit (7), bankruptcy (9)

    +   - Reputation damage - Would an exploit result in reputation damage that would
    harm the business? Minimal damage (1), Loss of major accounts (4), loss of goodwill
    (5), brand damage (9)

    +   - Non-compliance - How much exposure does non-compliance introduce? Minor
    violation (2), clear violation (5), high profile violation (7)

    +   - Privacy violation - How much personally identifiable information could be
    disclosed? One individual (3), hundreds of people (5), thousands of people (7),
    millions of people (9)


    # 2.7.5 Risk severity


    Now that we identified the likelihood and impact factors, we are able to put it
    together to understand the overall severity. As mentioned previously, the higher
    the rating for each of the factors the higher the overall risk.


    | 0 to <3 | Low |

    | 3 to <6 | Medium |

    | 6 to 9 | High |


    # 2.7.6 Risk example


    Reusing the example earlier of the formjacking we can make some assumptions and
    walk through a scenario. I will use the example organization from the previous
    chapter, Superior Products. Dashing Danielle has been made aware of the formjacking
    issue impacting one of their flagship products that was raised up by an internal
    penetration test that was recently'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'completed. Although, after some research, she knows that this issue is significant,
    however completing a risk rating will help her prioritize the issue with the engineering
    team. The impacted application has a section for making purchases and submitting
    reviews. There is a form in the section where the user can provide their credit
    card details in order to make purchase.


    Given this basic information we can make some assumptions about the threat actors
    and vulnerability in order to come up with the overall likelihood. For this example,
    the ability to perform a successful attack requires moderate skill for a big reward
    in the form of stealing credit card information. The threat actor category would
    be cybercriminals and would be generally widespread. For the vulnerability itself,
    the ability to act on it is determined by the fact that automated tools are available
    to not only detect but to also create the script that can be used for the attack.
    As of now, Superior Products has minimal ability to detect an attack. With this
    in mind we can determine the likelihood in the following table.


    # Table 1.2 Sample of a threat likelihood using a formjacking attack


    | Threat agent factors |  |  |  | Vulnerability factors |  |  |  |

    |---|---|---|---|---|---|---|---|

    | Skill Level | Motive | Opportunity | Size | Ease of Discovery | Ease of Exploit
    | Awareness | Intrusion Detection |

    | 4 | 8 | 6 | 6 | 7 | 7 | 5 | 3 |

    | Overall likelihood = 5.75 |  |  |  |  |  |  |  |


    For the impact we will break this into two. One for the technical impact and one
    for the business impact. Looking at this particular risk, the loss of confidentiality
    is high due to the fact that the threat actor can gain credit card information.
    There is no impact to integrity, or availability. Accountability would be difficult
    since the attacker would be able to perform this attack without being known to
    the application. For the business impact, this would be significant given that
    if this is not well detected it could go on for a long period of time before being
    noticed. Although financial impact would be low, the reputational and compliance
    impacts would be high as well as the possibility of this being a privacy violation
    depending on what information would be stolen.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Table 1.3 Sample of a threat impact using a formjacking attack


    | Technical Impact |  |  |  | Business Impact |  |  |  |

    |---|---|---|---|---|---|---|---|

    | Loss of Confidentiality | Loss of Integrity | Loss of Availability | Loss of
    Accountability | Financial damage | Reputation Damage | Non-Compliance | Privacy
    Violation |

    | 8 | 1 | 1 | 8 | 7 | 7 | 7 | 3 |

    | Overall technical impact = 4.5 |  |  |  | Overall business impact = 6 |  |  |  |

    | Overall impact = 5.25 |  |  |  |  |  |  |  |


    What does this example show us? The likelihood of occurrence and the impact are
    both medium. However, the business impact is low. This allows the Superior Products
    to take the approach that although there is a higher technical impact, the cost
    of the risk might be low enough that they would approach the resolution differently.
    Dashing Danielle works with the product owner and security organization to prioritize
    this vulnerability as low, opens a ticket with the appropriate development team
    with all the information needed for them to resolve.


    Having this type of methodology will allow the organization to look at the risk,
    define a remediation or mitigation strategy that could eliminate or at least reduce
    the risk and properly prioritize the resolution.


    EXERCISE Use the online version of OWASP Risk Rating (https://www.owasp-risk-rating.com/).
    Use a scenario from a cyberattack news story. Take a particular threat from the
    story and walk through the risk rating calculator. Document your scenario, the
    final score and what you learned. You will have to use your imagination to fill
    in the unknown data. This is a chance to be creative.


    # 2.7.7 Other methodologies


    While the focus in this section is on OWASP Risk Rating Methodology, there are
    several other well-known methodologies that should be considered. The goal here
    is not to say that one is better than another but to simply outline that there
    are multiple options when it comes to risk rating methodologies.


    Two of the other methodologies worth mentioning is the National Institute of Standards
    and Technology (NIST) Guide for Conducting Risk Assessments in Special Publication
    800-30 and the Mozilla Rapid Risk Assessment. For those that are familiar with
    NIST you will know that this is a well-documented and thorough approach to risk
    assessment. The NIST approach is broader and encompasses more than a simple activity
    and instead focusses on the overall ability of an organization to frame the risk
    then monitor, assess, and respond.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '**DEFINITION** NIST is another organization that has contributed greatly to
    the advancement of security. It is an organization based in the United States
    and is tasked with providing innovation and technical advancement. Through this
    effort NIST has defined many of the practices that are used not just in application
    security but in organizations who want to raise their overall security practices.
    (https://www.nist.gov/)


    The Mozilla RRA (Rapid Risk Assessment) takes a similar approach to measuring
    risk as OWASP does in the sense that it aims to be discrete and quick. It looks
    at the risk from the point of view of whether the given platform has the appropriate
    level of security controls to host specific data. The input into an RRA is a data
    flow diagram (DFD) that includes the type of data that is used by the service
    being assessed. Additionally, an understanding or documentation, of how the service
    works. From here, the process is similar to a threat model (we’ll talk about these
    later) where basic discussions occur on the service and its purpose. Data is highlighted
    with attention on how it’s stored and used. Then a methodical approach is taken
    to review possible threat scenarios that focus on the confidentiality, integrity,
    and availability of the data. Once this is complete, recommendations are made
    on how best to provide protection.


    Identifying risks allows the organization to prioritize and frame vulnerabilities
    that are presented. This means the organization can focus on the risks that have
    the biggest impact on what matters most to them.


    # 2.8 Summary


    +   - The CIA triad (confidentiality, integrity, and availability) is the foundation
    for every decision that is made in protecting data and ensuring that our systems
    are available when needed.

    +   - Knowing your potential threat actors will assist in the definition of the
    appropriate level of protection that is needed. You don’t need military grade
    protection if your only adversary is a script kiddy.

    +   - Attacks get stronger as the threat actors get better. Defenses need to align
    with the treats that they are protecting against.

    +   - Organizations such as NIST and OWASP are great resources for standards,
    and projects to help with ensuring your applications build security in.

    +   - The OWASP Risk Rating Methodology provides a means to define the risk posed
    to an organization through a calculation that takes into consideration the technical
    and business impacts as well as the threat actors.

    +   - Risks can be remediated, mitigated, or accepted. Each have their own benefits
    and disadvantages.'
  merge: -1

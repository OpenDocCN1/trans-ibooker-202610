  img_proc: true
- pgno: 136
  md: '# Sample Architecture Review Board (ARB) with domains


    ![](img/cc84747f93d290964598894b4f5c153b_136_0.png)


    Figure 5.3 Overview of an architecture review board


    The ARB will be tasked with creating a consistent method to how architecture problems
    are solved and setting guidelines on technology that is to be used in architecture.
    This is often a consensus board meaning that representatives from the various
    stakeholders in the organization will participate and have a voting interest in
    the decisions and the setting of standards. There are a few things that are gained
    by an ARB in an organization.


    +   - Better visibility of the solutions across the organization

    +   - More consistency in an architectural approach

    +   - Reduce the complexity of systems by potentially reusing patterns

    +   - Potential consolidation through visibility

    +   - Awareness and education through shared knowledge


    So, what is security’s role in the ARB? It’s clear that if you want to drive good
    security standards and patterns, this is the place to be. A prime example of levering
    the ARB to drive a security standard is to standardize on the version of transport
    layer security (TLS) that is used in the organization. It is not uncommon for
    organizations that have several business units or multiple products with different
    customers aligned to the products, to have varying versions of TLS running in
    their environments. The security representative in the ARB, who is usually a senior
    architect within the security organization or the security architect in the enterprise
    architecture team, will be able to bring forward a requirement to standardize
    the organization on a particular TLS version.


    To illustrate this, I’ll turn to Superior Products again. Dashing Danielle, due
    to her exceptional security leadership and trust among her peers has been brought
    in as the formal security representative in the ARB after the previous security
    representative on the ARB left to pursue a career in asparagus farming. For her
    first task on the ARB, Dashing Danielle is determined to move the organization
    to a more secure version of TLS. As of this writing, the most common and secure
    TLS version is TLS 1.2. Although, TLS 1.3 is out and available, the technical
    hurdles for client migration to using 1.3 are substantial. With this in mind Dashing
    Danielle crafts a short presentation that describes why the need to standardize
    on the'

    exposed for weeks and shows the power of having tools integrated throughout the
    process.


    # 4.3 Application security tooling in the pipeline


    As I mentioned most of the tools that have been discussed previously in this book
    are still valid in a DevSecOps pipeline with subtle differences. There are also
    platforms and tools that are built specifically for the rapid release cycle of
    DevSecOps that can aid in the development and delivery of code in a secure manner.


    ![](img/cc84747f93d290964598894b4f5c153b_109_0.png)


    Figure 4.6 DevSecOps according to OWASP


    In the Rugged DevOps pipeline your initial entry is through intake where there
    are still manual, and people led activities such as threat modeling and a secure
    design assessment. From here a well-tuned pipeline lets the tools do the work
    of identifying and coordinating the vulnerabilities that may have been uncovered.
    I’ll cover these next.'

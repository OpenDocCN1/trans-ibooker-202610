- pgno: 90
  md: 'Although every organization is different, and there is not a well-established
    industry standard on timeframes, the organization should strive for resolving
    critical and high as quickly as possible, while still having expectations on closing
    the medium and low.


    | Severity | Time to closure |

    |---|---|

    | Critical | < 30 days |

    | High | < 60 days |

    | Medium | < 90 days |

    | Low | < 365 days |


    Although the above is generally what is seen in the industry, each organization
    may have different closure expectations and may even be directed by regulation,
    contracts, and other external pressures to have tighter timelines. Keep in mind
    that these vulnerabilities require code changes. This is separate from vulnerabilities
    that are found at the host level, like a Windows patch, which might have much
    shorter time frames for resolution. However, without clearly describing the expectations
    on closure, the organization will have a difficult time giving the engineering
    organization a target with the open vulnerabilities.


    # 3.5.3 Closing vulnerabilities


    Getting to resolution on the open vulnerabilities will take a very close partnership
    with the engineering teams that are responsible for resolving them. Frequent touch
    points to review the vulnerabilities and ensuring that they are true positives,
    have clear expectations on timeline for closure, clear steps to resolve, and a
    method in place to retest are the responsibility of the application security team.
    Application security will help the engineering team prioritize what is the highest
    risk to the organization using the methods I talked about before with a risk rating
    process. This can be done through weekly meetings between the application security
    team and the engineering team where consensus will be reached on when the vulnerabilities
    will be resolved in an upcoming release. To accomplish this the engineering team
    may take on a burst of effort to resolve a batch of issues like in a bug blitz
    or a security defect release which are concentrated and focused efforts to remediate
    open vulnerabilities.


    It is important for the application security team to identify common threads in
    the vulnerability data that they are collecting. For instance, are there frequent
    issues with encryption that should be addressed holistically by a more general
    approach like a centralized encryption program that addresses the key management,
    and sets standards on how, where, and when data should be encrypted. With this
    type of approach, it is possible to eliminate several vulnerabilities in on larger
    project a while creating a more sustainable security model going forward.


    The most important component of being able successfully tackle the abundance of
    vulnerabilities that will be produced from the security tools that are integrated
    is getting senior leadership buy-in on the resolution effort. To facilitate this,
    it is critical to provide data that is trustworthy, complete, and shows the impact
    to the organization. One pitfall to avoid with bringing vulnerability information
    to senior leadership is to ensure that there is'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'confidence in the data that is being presented. Nothing will hurt your cause
    more than having numbers that are frequently different with little explanation.
    Numbers will change as you resolve issues and bring on more or different tools.
    But if your method of gathering information is unreliable, your data will become
    unreliable, and therefore undermine your effort to convince senior leadership
    that you need them to help you drive down vulnerabilities. If the senior leaders
    feel that you will be wasting their team’s time and resources, they will be less
    likely to support your effort.


    # 3.6 Bug bounty and vulnerability disclosure program


    Vulnerabilities that you generated from your tools and processes are pouring in,
    but what if you are looking for a different set of eyes and hands on your application?
    A common method for mature organizations to receive vulnerabilities from a broad
    audience is through a bug bounty program (BBP) or a vulnerability disclosure program
    (VDP). Both programs open the organization to receive vulnerabilities from external
    sources that are not affiliated with the organization. For instance, in a VDP,
    the organization will create the boundaries, communication paths, and expectations
    for individuals that want to locate security issues with the organization’s applications.
    The organization will post their policy on their main website, usually on a security
    page, so that it is easy to locate for those that find issues within the organizations
    applications. These individuals, often called security researchers, will be able
    to look for security issues in the organizations applications and then submit
    them through the appropriate channels in order to get a resolution. This differs
    from the BBP where researchers are paid a bounty for issues that they find in
    the application, sometimes by an intermediary organization.


    # 3.6.1 Vulnerability disclosure program


    VDP’s follow the simple idea of “see something, say something” and allow for researchers
    to uncover security vulnerabilities without the fear of retribution. Additionally,
    a VDP simplifies the process of getting this security information to the right
    team. One of the issues that many researchers have is knowing where to send information.
    Additionally, once the information has been submitted, the path to resolution
    is often opaque to the researcher. In many cases, the researcher may not even
    get a response from the organization. The VDP attempts to solve this by providing
    the following five components of the policy.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Table 3.1 Components of a VDP


    | Component | Details |

    |---|---|

    | Purpose of the policy | This section should include the purpose of the VDP for
    your organization and to demonstrate the commitment to more secure applications.
    |

    | Scope | Probably the most important part of the policy. This is where the organization
    sets the boundaries for what is allowed and what is out of scope for any issues
    reported. For instance, the policy could specify that client data is never to
    be accessed or removed from the applications and that only certain parts of the
    application are allowed to be tested. |

    | Safe Harbor | This provides assurances to the researcher that they will not
    be prosecuted or have legal actions taken against them by the organization as
    long as they stay within the scope identified within the VDP. |

    | Process for submission | This section sets the expectations for how the researcher
    should submit their findings as well as the expected quality and content that
    is expected in the report. |

    | Expectations | This is what the researcher should expect from the organization
    as it responds to the submitted report. Examples would be the time between submission
    and response, when the finder may publicly disclose their finding, and what the
    communication will look like between the researcher and the organization. |


    # 3.6.2 Bug bounty program


    The BBP builds on the VDP by providing an incentive structure to the submitted
    vulnerabilities. In the VDP the organization will pay based on a predefined set
    of guidance. This will put a price on specific vulnerabilities like SQL Injection,
    or the organization may structure the cost by severity where critical issues are
    priced higher than low ones. Regardless of the structure this need to be determined
    ahead of time and the leadership team needs to be ready to provide periodic payouts
    for bounties. The common BBP has two options:


    **DEFINITIONS** *Private BBP* is a VDP program that is only available to researchers
    that are invited to the program. Whereas a *Public BBP* opens the program to any
    researcher that wants to participate.


    As vulnerabilities are submitted, the organization will need to triage them. This
    is typically completed by the application security team in conjunction with the
    engineering team. The vulnerability should be determined to be a true positive,
    and the severity agreed upon. Depending on how the policy is written, it may allow
    for the public disclosure of the vulnerability should it pass the allowed timeframes.
    This means that it is imperative that the organization has a clear process for
    resolving the issue within the timeframes that are in their policy and maintain
    communication and coordination with the researcher. The news is'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'littered with cases of a vulnerability disclosed to an organization where that
    organization failed to stick to their own policy, and it instead became a very
    public matter.


    # 3.6.3 Third party help with vulnerabilities


    There are several third-party programs that exist that will assist the organization
    with setting up and maintaining both a VDP and BBP. These services will assist
    you in creating the VDP and host it on their site. They will also be the middleperson
    that accepts reports, checks them for quality, and in some cases they will de-duplicate
    them against a list of vulnerabilities that you may have already identified through
    your internal tools. For instance, a researcher may uncover a XSS issue in your
    application. In this case, the third party will match that against vulnerabilities
    that you have already identified and provided to them in order to determine whether
    this is a new issue or existing. They will then respond to the researcher that
    the issue is already identified and provide expectations for remediation.


    There are several prominent companies that provide this type of service like HackerOne
    and BugCrowd. However, there are also many companies that run their own bug bounty
    like Intel, Facebook, Google, Apple, Microsoft, and many others. In these cases,
    the payouts and rules of engagement are clear and provide these organizations
    with the ability to have another channel for getting vulnerability information.


    **EXERCISE** Take a look at Microsoft''s:


    https://www.microsoft.com/en-us/msrc/bounty?rtc=1


    and Google''s:


    https://www.google.com/about/appssecurity/reward-program/


    **Bug Bounty Program (BBP). Understand the scope and the rules of engagement and
    think about how this would work in your own organization.**


    # 3.7 Putting it together


    I covered a lot of ground in this chapter on the different tools and processes
    that may be used during the secure development lifecycle. You may be wondering
    how all of these fit in and where they make the most amount of sense. As I mentioned
    previously, security is the business of applying the right amount of mitigation
    to reduce risk to as low as possible for an organization. It’s critical to ensure
    that you are not overspending. The simple example that most of us can relate to
    is a car repair. Most of us would never pay for a repair that cost more than the
    actual vehicle worth. Security is no different. You can apply every tool that
    I mentioned in this chapter, every process, build a massive application security
    team and pay for a massive BBP. Will that make you more secure? Yes. Will it cost
    you more than what it is that you’re actually trying to protect? Most likely.'
  merge: -1
  img_proc: true

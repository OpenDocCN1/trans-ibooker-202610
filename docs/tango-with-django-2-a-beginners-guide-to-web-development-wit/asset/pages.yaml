    \ choose to create a new module, you’ll need to import everything that is required!\n\
    \n```\n```python\ndef get_category_list(max_results=0, starts_with=''):\n    category_list\
    \ = []\n\n    if starts_with:\n        category_list = Category.objects.filter(name__istartswith=starts_with)\n\
    \n    if max_results > 0:\n        if len(category_list) > max_results:\n    \
    \        category_list = category_list[:max_results]\n\n    return category_list\n\
    ```\n```\n\nNote that this function meets the requirements we defined above in\
    \ that it takes two parameters – max_results, allowing one to specify how many\
    \ items to return, and starts_with, the user’s input string. Note how we used\
    \ the filter method to perform the __istartswith filter, looking for matches to\
    \ starts_with. If max_results=0, we assume that all results are to be returned;\
    \ otherwise, we chop the list using a standard Python list sub indexing operation.\n\
    \n# The CategorySuggestionView\n\nWith our helper function defined, we can then\

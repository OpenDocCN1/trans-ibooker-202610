- pgno: 308
  md: "```\n```python\nclass LikeCategoryView(View):\n    @method_decorator(login_required)\n\
    \    def get(self, request):\n        category_id = request.GET['category_id']\n\
    \n        try:\n            category = Category.objects.get(id=int(category_id))\n\
    \        except Category.DoesNotExist:\n            return HttpResponse(-1)\n\
    \        except ValueError:\n            return HttpResponse(-1)\n\n        category.likes\
    \ = category.likes + 1\n        category.save()\n\n        return HttpResponse(category.likes)\n\
    ```\n```\n\nUpon examination of the code above, you can see that we are only allowing\
    \ users who are logged in to access this view—hence the `@method_decorator(login_required)`\
    \ decorator. We also implement some rudimentary error handling. If the user provides\
    \ a category ID that does not exist, or the category ID supplied cannot be converted\
    \ to an integer, -1 is returned in the response. Otherwise, the likes attribute\
    \ for the given category is incremented by one. The updated value is then returned\
    \ by itself.\n\nYou should have all of the necessary import statements required\
    \ for this to work—but double-check that the following is present. This one was\
    \ used right back at the beginning of the book—you may have taken it out when\
    \ cleaning up your code in previous chapters. You definitely need it now!\n\n\
    ```\n```python\nfrom django.http import HttpResponse\n```\n```\n\nOf course, this\
    \ view would be useless without a URL mapping to it. To comply with our requirements,\
    \ let’s add one. Add the following to the urlpatterns list in Rango’s urls.py\
    \ module.\n\n```\n```python\npath('like_category/', views.LikeCategoryView.as_view(),\
    \ name='like_category'),\n```\n```\n\nYou should now be ready to proceed to the\
    \ next step—making the AJAX request."

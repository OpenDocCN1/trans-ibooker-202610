  md: "To give you more of an idea about how class-based views work, let’s try converting\
    \ the `about()` view from a function-based to a class-based approach. First, in\
    \ Rango’s `views.py` module, define a class called `AboutView` which inherits\
    \ from the `View` base class. This base class needs to be imported from `django.views`,\
    \ as shown in the example code below.\n\n```\nfrom django.views import View\n\n\
    class AboutView(View):\n    def get(self, request):\n        context_dict = {}\n\
    \n        visitor_cookie_handler(request)\n        context_dict['visits'] = request.session['visits']\n\
    \n        return render(request,\n                      'rango/about.html',\n\
    \                      context_dict)\n```\n\nNote that we have simply taken the\
    \ code from the existing `about()` function-based view, and added it to the `get()`\
    \ method of our new class-based `AboutView` approach.\n\n# Defining Methods in\
    \ Classes\n\nWhen defining a method within a class in Python, the method must\
    \ always take at minimum one parameter, `self`. `self` denotes the instance of\
    \ the class being used, and you can use it to obtain access to other methods within\
    \ the instance, or instance variables defined using the `self.object_name`. This\
    \ is the same technique as accessing instance-specific items in Java using the\
    \ `this.` approach.\n\nYou can create static methods in Python classes, meaning\
    \ that the `self` parameter need not be passed – but you should use the `staticmethod`\
    \ decorator. This is more advanced, and we don’t make use of static methods here.\
    \ However, you can [read more about this online](https://docs.python.org/3/library/functions.html#staticmethod).\n\
    \nNext, you need to update Rango’s `urls.py` module. Find and update the entry\
    \ in the `urlpatterns` list that deals with the about mapping to make use of the\
    \ new `AboutView`."

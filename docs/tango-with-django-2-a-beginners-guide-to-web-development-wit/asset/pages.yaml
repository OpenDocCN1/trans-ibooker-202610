  md: '# ## 2.6 Testing your Implementation


    As you work through your implementation of the requirements for the Rango app,
    we want you to have the confidence to know that *what you are coding up* is correct.
    We can’t physically sit next to you, so we’ve gone and done the next best thing
    – **we’ve implemented a series of different tests that you can run against your
    codebase to see what’s correct, and what can be improved.** We’ve got tests for
    the core chapters (up to Chapter 10).


    These are available from our sample codebase repository, [available on GitHub](https://github.com/maxwelld90/tango_with_django_2_code/tree/master/progress_tests).
    The `progress_tests` directory on this repository contains a number of different
    Python modules, each containing a series of different test modules you can run
    against your Rango implementation. Note that they are for individual chapters
    – for example, you should run the module `tests_chapter3.py` against your implementation
    *after* completion of Chapter 3, but before starting Chapter 4. Note that not
    every chapter will have tests at the end of it – some portions of the book are
    very difficult to write automated tests for without resorting to having to download
    sizable support libraries.


    ![](img/75169a27287f7c945bf2cbf7dede5251_30_0.png)


    # ### Complete the Exercises!


    These tests assume that you complete all of the exercises for a chapter! If you
    don’t do this, it’s likely some tests will not pass.


    We check the basic functionality that should be working up to the point you are
    testing at. We also check what is returned from the server when a particular URL
    is accessed – and if the response doesn’t match *exactly* what we requested in
    the book, *the test will fail*. This might seem overly harsh, but we want to drill
    into your head that *you must satisfy requirements exactly as they are laid out*
    – no deviation is acceptable. This also drills into your head the idea of *test-driven
    development*, something that we outline [at the start of the testing chapter](#).'

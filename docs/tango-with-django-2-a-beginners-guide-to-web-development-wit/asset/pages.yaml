    # 1. Starting Off


    Before you can start work on your project, you must prepare Git. If you haven’t
    yet sorted out your project’s Git workspace, you’ll need to **clone your repository
    to set it up**.


    If you’ve already cloned your repository, it’s good practice to get into the habit
    of updating your local copy by using the `git pull` command. This *pulls* the
    latest changes from the remote repository onto your computer. By doing this, you’ll
    be working with the most up-to-date version of the repository. This will reduce
    the possibility of conflicting versions of files, which really can make your life
    a bit of a nightmare.'

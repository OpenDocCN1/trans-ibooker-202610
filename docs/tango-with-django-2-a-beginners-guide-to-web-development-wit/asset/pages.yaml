  md: 'use the Bing Search API, you will need to sign up for an *API key*. The key
    currently provides subscribers with access to 1000 queries per month, which should
    be more than enough for our experimental purposes.


    # Application Programming Interface (API)


    ![](img/75169a27287f7c945bf2cbf7dede5251_233_0.png)


    An [Application Programming Interface](https://en.wikipedia.org/wiki/Application_programming_interface)⁵
    specifies how software components should interact with one another. In the context
    of web applications, an API is considered as a set of HTTP requests along with
    a definition of the structures of response messages that each request can return.
    Any meaningful service that can be offered over the Internet can have its API.
    We aren’t limited to web search! For more information on web APIs, [Luis Rei provides
    an excellent tutorial on APIs](http://blog.luisrei.com/articles/rest.html)⁶.


    # Registering for a Bing API Key


    To obtain a Bing API key, you must first register for a Microsoft Azure account.
    The account provides you with access to a wide range of Microsoft services. If
    you already have a Microsoft account, you do not need to register – simply enter
    your details to login with your existing account details. Otherwise, you can go
    online and create a free account with Microsoft at https://account.windowsazure.com⁷.


    When you have logged in, go to the portal. The link is at the top right of the
    page.


    Once the portal has loaded, you should see a list of options at the top of the
    viewport (or down the side, depending on your screen size). Find the top option
    called `Create a resource` and click it. The right-hand side of the page will
    then be populated with more lists. From there, find the `AI + Machine Learning`
    option and select that. Scroll through the options on the subsequent menu that
    appears, and select the `Bing Search` option.


    ⁵http://en.wikipedia.org/wiki/Application_programming_interface

    ⁶http://blog.luisrei.com/articles/rest.html

    ⁷https://account.windowsazure.com'
  merge: -1

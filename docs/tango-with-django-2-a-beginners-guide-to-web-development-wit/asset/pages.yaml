    coding up the URLs, views and templates. However, such functionality is common
    to many web applications. Because of this, developers have created numerous add-on
    apps that can be included in your Django project to reduce the amount of code
    required to provide user-related functionality, such as logging in, registration,
    one-step and two-step authentication, password changing, password recovery, and
    so forth. In this chapter, we will change Rango’s login and register functionality
    so that it uses a package called `django-registration-redux`.


    This will mean we will need to refactor our code to remove the login and registration
    functionality we previously created. From there, we will then work through setting
    up and configuring Rango and our wider `tango_with_django_project` code-base to

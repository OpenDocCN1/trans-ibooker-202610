    # 9.7 Implementing Login Functionality


    With the ability to register accounts completed, we now need to provide users
    of Rango with the ability to login. To achieve this, we’ll need to undertake the
    workflow outlined below.


    +   - Create a login in view to handle the processing of user credentials.

    +   - Create a login template to display the login form.

    +   - Map the login view to a URL.

    +   - Provide a link to login from the index page.'

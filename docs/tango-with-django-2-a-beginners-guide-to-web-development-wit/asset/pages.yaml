- pgno: 247
  md: '# 14. Making Rango Tango Exercises


    So far, we have added in several key pieces of functionality to Rango. We’ve been
    building the app up in a manner that hopefully gets you familiar with using the
    Django framework and to learn how to construct the various parts of a modern web
    application.


    However, Rango at the moment is not very cohesive or interactive. In this chapter,
    we challenge you to improve the app and its user experience further by bringing
    together some of the functionality we have implemented along with some new features.
    To make Rango more coherent, integrated and interactive, let’s look at implementing
    the following functionality.


    In Rango’s Category and Page models, we’ve included a views field. However, we
    haven’t used them yet, so why not implement the functionality to track views to
    both types of content? Specifically, we’ll be looking at:


    +   - counting the number of times that a category is viewed; and

    +   - counting the number of times a page is clicked from a Rango category view.


    We’ll also be wanting to collect likes for different categories, as this is also
    something that we have not yet implemented. We’ll be looking at implementing this
    with AJAX (see [AJAX in Django](#)). We’ll also make use of AJAX to allow users
    to filter the categories that they see on the left-hand categories bar.


    In addition to these new features, we’ll be working to provide further services
    to registered users of Rango. Specifically, we’ll be working to:


    +   - allow users registering to the site to again specify a profile image and
    website (if you worked through the [chapter on django-registration-redux](#),
    this functionality will have been lost);

    +   - let users view and edit their profile; and

    +   - let users who are logged in view a list of other users and their profiles.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# ## Note


    As we have alluded to above, we won’t be working through all of these tasks in
    this chapter. The AJAX-related tasks (as well as a definition of what AJAX is!)
    will be left to the [AJAX in Django] later on, while others will be left to you
    to complete as additional exercises.


    Before we start to add this additional functionality, we will make a *todo list*
    to plan our workflow for each task. Breaking tasks down into smaller sub-tasks
    will greatly simplify the implementation process. We’ll then be attacking each
    main activity with a clear plan. In this chapter, we’ll be providing you with
    the workflow for a number of the above tasks. From what you have learnt so far,
    you should now be able to fill in the gaps and implement most of it on your own
    (except for those requiring AJAX, where we’ll talk about that in more detail in
    a [later chapter]).


    We’ve included hints, tips and code snippets to help you along. Of course, if
    you get stuck, you can always check out [our implementation for the exercises
    on GitHub¹]. Let’s get started with tracking page clicks!


    # ## 14.1 Tracking Page Clickthroughs


    Currently, Rango provides direct links to external pages. While simple, this approach
    does not allow us to record how many clicks each page receives – a click takes
    you away from Rango without any ability to record information on what has just
    happened. To address this, we can implement a simple view to record a click –
    and *then* redirect the user to the request page.


    This is what happens in many contemporary social media platforms, as an example
    – if someone sends you a link in Facebook Messenger, for instance, Facebook inserts
    a simple redirect device to be able to track that you clicked the link.


    To implement functionality to track page links, have a go at the following steps.


    +   1. First, create a new view called `goto_url()`. This should be mapped to
    the URL `/rango/goto/`, with a URL mapping name of `goto`.


    ¹ [https://github.com/maxwelld90/tango_with_django_2_code](https://github.com/maxwelld90/tango_with_django_2_code)'

    # Problems Installing `pillow`?\n\nWhen installing Pillow, you may receive an\
    \ error stating that the installation failed due to a lack of JPEG support. This\
    \ error is shown as the following:\n\n```\n```text\nValueError: jpeg is required\
    \ unless explicitly disabled using\n            --disable-jpeg, aborting\n```\n\
    ```\n\nIf you receive this error, try installing Pillow *without* JPEG support\
    \ enabled, with the following command.\n\n```\n```bash\npip install pillow==5.4.1\
    \ --global-option=\"build_ext\"\n                         --global-option=\"--disable-jpeg\"\
    \n```\n```\n\nWhile you obviously will have a lack of support for handling JPEG\
    \ images, Pillow should then install without problem. Getting Pillow installed\
    \ is enough for you to get started with this tutorial. For further information,\
    \ check out the [Pillow documentation](https://pillow.readthedocs.io/en/stable/installation.html)¹².\n\
    \n# Working within in a Virtual Environment\n\nSubstitute pip3 with pip when working\
    \ within your virtual environment. The command pip is aliased to the correct one\
    \ for your virtual environment."

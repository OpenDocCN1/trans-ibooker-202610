  md: "# Naming Conventions\n\nIt’s good practice to make sure your new class-based\
    \ views conform to [Python naming conventions](https://www.python.org/dev/peps/pep-0008/).\
    \ For classes, use CamelCase. Capitalise the start of a class name, then capitalise\
    \ each subsequent term – without spaces between them. Hence the new add category\
    \ view becomes AddCategoryView. Tack View on the end to make sure those who look\
    \ at your code later will know they are dealing with a class-based view.\n\nMethods\
    \ within your classes should follow the same convention as naming functions. Use\
    \ lower case names, and separate individual terms with underscores – like some_method_name().\n\
    \n# Mapping the IndexView\n\nWhen you create a class-based view for your old index()\
    \ view, be wary that you will have mapped it in both Rango’s urls.py module *and\
    \ your project’s urls.py module, too!*\n\n# Passing URL parameters\n\nEarlier\
    \ on, you created a view show_category(). Aside from taking the obligatory request\
    \ object, it also took a category_name_slug – it was a *parameterised view*, with\
    \ the parameter coming from the URL. For all views implemented like this, you’ll\
    \ need to make sure that their class-based equivalent not only contain self and\
    \ request as parameters, but the one or more URL parameters, too. In the example\
    \ above, a get() method definition may look like the example below.\n\n```\nclass\
    \ ShowCategoryView(View):\n    def get(self, request, category_name_slug):\n \
    \       ...\n```\n\nIf you’re dealing with a view with both get() and post() methods,\
    \ you’ll need the parameter(s) for both!"

    # Enabling HTTPS


    PythonAnywhere also provides really straightforward support for enabling [HTTPS](https://en.wikipedia.org/wiki/HTTPS)
    functionality, adding a layer of encryption between the client and the server.
    PythonAnywhere can provide you with a security certificate to say your app is
    genuine. It’s super easy, and definitely worth doing!


    To enable HTTPS, go to the *Web* tab of the PythonAnywhere interface, and look
    for the *Security* section. Find the switch for *Force HTTPS*, and switch this
    feature on. Once you have done this, scroll up to the top of the page and *Reload*
    your app once more. If you then navigate to your app’s URL, you should then notice
    that you are redirected to `https://rangodemo2020.pythonanywhere.com` (of course,
    replacing rangodemo2020 with your username!) – denoting that you are using your
    app using HTTPS.



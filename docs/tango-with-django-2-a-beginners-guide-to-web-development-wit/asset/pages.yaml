- pgno: 65
  md: "# Loading other Static Files\n\nThe {% static %} template tag can be used whenever\
    \ you wish to reference static files within a template. The code example below\
    \ demonstrates how you could include JavaScript, CSS and images into your templates\
    \ with correct HTML markup.\n\n```\n<!DOCTYPE html>\n{% load staticfiles %}\n\n\
    <html>\n\n    <head>\n        <title>Rango</title>\n        <!-- CSS -->\n   \
    \     <link rel=\"stylesheet\" href=\"{% static \"css/base.css\" %}\" />\n   \
    \     <!-- JavaScript -->\n        <script src=\"{% static \"js/jquery.js\" %}\"\
    ></script>\n    </head>\n\n    <body>\n        <!-- Image -->\n        <img src=\"\
    {% static \"images/rango.jpg\" %}\" alt=\"Picture of Rango\" />\n    </body>\n\
    \n</html>\n```\n\nDon’t update the index.html template here – this is merely a\
    \ demonstration to show you how the {% static %} template function works. You’ll\
    \ be adding CSS and JavaScript later on in this tutorial.\n\nStatic files you\
    \ reference will obviously need to be present within your static directory. If\
    \ a requested file is not present or you have referenced it incorrectly, the console\
    \ output provided by Django’s development server will show a HTTP 404 error¹⁶.\
    \ Try referencing a non-existent file and see what happens. Looking at the output\
    \ snippet below, notice how the last entry’s HTTP status code is 404.\n\n```\n\
    [24/Mar/2019 17:05:54] \"GET /rango/ HTTP/1.1\" 200 366\n[24/Mar/2019 17:05:55]\
    \ \"GET /static/images/rango.jpg HTTP/1.1\" 200 0\n[24/Mar/2019 17:05:55] \"GET\
    \ /static/images/not-here.jpg HTTP/1.1\" 404 0\n```\n\nFor further information\
    \ about including static media you can read through the official Django documentation\
    \ on working with static files in templates¹⁷."
  merge: -1

  md: 'There will be times when you will have to delete your database. Sometimes it’s
    easier to just start afresh. Perhaps you might end up caught in a loop when trying
    to make further migrations, and something goes wrong.


    When you encounter the need to refresh the database, you can go through the following
    steps. Note that for this tutorial, you are using an SQLite database – Django
    does support a [variety of other database engines](https://docs.djangoproject.com/en/2.1/ref/databases/).


    +   1. If you’re running it, stop your Django development server.

    +   2. For an SQLite database, delete the `db.sqlite3` file in your Django project’s
    directory. It’ll be in the same directory as the `manage.py` file.

    +   3. If you have changed your app’s models, you’ll want to run the `$ python
    manage.py makemigrations <app_name>` command, replacing `<app_name>` with the
    name of your Django app (i.e. rango). Skip this if your models have not changed.

    +   4. Run the `$ python manage.py migrate` command to create a new database file
    (if you are running SQLite), and migrate database tables to the database.

    +   5. Create a new admin account with the `$ python manage.py createsuperuser`
    command.

    +   6. Finally, run your population script again to insert credible test data
    into your new database.'

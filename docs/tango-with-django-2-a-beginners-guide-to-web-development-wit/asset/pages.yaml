  md: '# # A CSS Crash Course


    In web development, we use *Cascading Style Sheets (CSS)* to describe the presentation
    of an HTML document (i.e. its look and feel). Each element within an HTML document
    can be *styled*. The CSS for a given HTML element describes how it is to be rendered
    on screen. This is done by ascribing *values* to the different *properties* associated
    with an element to change its appearance. In this chapter, we’ll be introducing
    you to the basics of CSS – and how you can manipulate the elements that appear
    on your webpages. Consider the material in this chapter supplementary to the main
    book; we use the Twitter [Bootstrap CSS](https://getbootstrap.com/) toolkit to
    do most of the styling for us in an [earlier chapter](#).


    ![](img/75169a27287f7c945bf2cbf7dede5251_405_0.png)


    # ## CSS Properties


    There are many, many different CSS properties that you can use in your stylesheets.
    Each provides different functionality. Check out the [W3C web-site](https://www.w3.org/Style/CSS/all-properties.en.html)
    for a huge list of available properties. [pageresource.com](http://www.pageresource.com/dhtml/cssprops.htm)
    also has a neat list of properties, with descriptions of what each one does. Check
    out Section css-course-reading-label for a more comprehensive set of links.


    CSS works by following a *select and apply pattern*. For a specified element,
    a set of styling properties are applied. Take a look at the following example
    in the [figure below](#), where we have some HTML containing `<h1>` tags. In the
    CSS code example, we specify that all h1 be styled. We’ll come back to [selectors](#)
    later on in this chapter. For now, though, you can assume the CSS style defined
    will be applied to our `<h1>` tags. The style contains four properties:


    +   - `font-size`, setting the size of the font to 16pt;

    +   - `font-style`, which when set to *italic* italicises the contents of all
    `<h1>` tags within the document;'

  md: "data to the database in the first instance. Why do this? Remember that information\
    \ from the `UserProfileForm` form is passed onto a new instance of the `UserProfile`\
    \ model. The `UserProfile` contains a foreign key reference to the standard Django\
    \ `User` model – but the `UserProfile` does not provide this information! Attempting\
    \ to save the new instance in an incomplete state would raise a referential integrity\
    \ error. *The link between the two models is required.*\n\nTo counter this problem,\
    \ we instruct the `UserProfileForm` to *not* save straight away, as seen on line\
    \ 29 above. This then allows us to add the `User` reference in with the line `profile.user=user`,\
    \ as shown on line 30. After this is done, we can then call the `profile.save()`\
    \ method on line 39 to manually save the new instance to the database. This time,\
    \ referential integrity is guaranteed, and everything works as it should.\n\n\
    # Creating the *Registration* Template\n\nNow we need to make the template that\
    \ will be used by the new `register()` view. Create a new template file, `rango/register.html`,\
    \ and add the following code.\n\n```\n1 {% extends 'rango/base.html' %}\n2 {%\
    \ load staticfiles %}\n3 \n4 {% block title_block %}\n5     Register\n6 {% endblock\
    \ %}\n7 \n8 {% block body_block %}\n9 <h1>Register for Rango</h1>\n10 {% if registered\
    \ %}\n11 Rango says: <strong>thank you for registering!</strong>\n12 <a href=\"\
    {% url 'rango:index' %}\">Return to the homepage.</a><br />\n13 {% else %}\n14\
    \ Rango says: <strong>register here!</strong><br />\n15 <form id=\"user_form\"\
    \ method=\"post\" action=\"{% url 'rango:register' %}\"\n16     enctype=\"multipart/form-data\"\
    >\n17 \n18     {% csrf_token %}\n19 \n20     <!-- Display each form  -->\n```"

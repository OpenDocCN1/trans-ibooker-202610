- pgno: 13
  md: '# 1.4 Rango: Initial Design and Specification


    The focus of this book will be to develop an application called *Rango*. As we
    develop this application, it will cover the core components that need to be developed
    when building any web application. To see a fully-functional version of the application,
    you can visit our [How to Tango with Django website](http://www.tangowithdjango.com/)¹⁹.


    # Design Brief


    Let’s imagine that we would like to create a website called *Rango* that lets
    users browse through user-defined categories to access various web pages. In [Spanish,
    the word rango](https://www.vocabulary.com/dictionary/es/rango)²⁰ is used to mean
    “*a league ranked by quality*” or “*a position in a social hierarchy*” – so we
    can imagine that at some point, we will want to rank the web pages in Rango.


    +   - For the **main page** of the Rango website, your client would like visitors
    to be able to see:

    +     - *the five most viewed pages;*

    +     - *the five most viewed (or rango’ed) categories;* and

    +     - *some way for visitors to browse and/or search through categories.*

    +   - When a user views a **category page**, your client would like Rango to display:

    +     - *the category name, the number of visits, the number of likes,* along
    with the list of associated pages in that category (showing the page’s title,
    and linking to its URL); and

    +     - *some search functionality (via the search API)* to find other pages that
    can be linked to this category.

    +   - For a **particular category**, the client would like: *the name of the category
    to be recorded;* the *number of times each category page has been visited;* and
    how many users have *clicked a “like” button* (i.e. the page gets rango’ed, and
    voted up the social hierarchy).

    +   - *Each category should be accessible via a readable URL* – for example, `/rango/books-about-django/`.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '+   - Only *registered users* will be able to search and add pages to categories.
    Therefore, visitors to the site should be able to register for an account.


    At first glance, the specified application to develop seems reasonably straightforward.
    In essence, it is just a list of categories that link to pages. However, there
    are several complexities and challenges that need to be addressed. First, let’s
    try and build up a better picture of what needs to be developed by laying down
    some high-level designs.


    # Exercises


    Before going any further, think about these specifications and draw up the following
    design artefacts.


    +   - What is the high-level architecture going to be? Draw up a **N-Tier** or
    **System Architecture** diagram to represent the high-level system components.

    +   - What is the interface going to look like? Draw up some **Wireframes** of
    the main and category pages.

    +   - What are the URLs that users visit going to look like? Write down a series
    of **URL mappings** for the application.

    +   - What data are we going to have to store or represent? Construct an **Entity-Relationship
    (ER)**²¹ diagram to describe the data model that we’ll be implementing.


    Try these exercises out before moving on – even if you aren’t familiar with system
    architecture diagrams, wireframes or ER diagrams, how would you explain and describe,
    formally, what you are going to build so that someone else can understand it.'
  merge: -1
  img_proc: true

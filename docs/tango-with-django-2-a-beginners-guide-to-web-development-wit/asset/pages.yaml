- pgno: 29
  md: '# Exercises


    To get comfortable with your environment, try out the following exercises.


    +   - Get up to speed with Python if you’re new to the language. Try out one or
    more of the tutorials we listed earlier.

    +   - Install Python 3.7. Make sure pip3 (or pip within your virtual environment)
    is also installed and works on your computer.

    +   - Play around with your *command line interface (CLI)*, whether it be the
    Command Prompt (Windows) or a terminal (macOS, Linux, UNIX, etc.).


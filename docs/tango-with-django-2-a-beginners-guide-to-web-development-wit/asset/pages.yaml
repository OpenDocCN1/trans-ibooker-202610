  md: "```\ndef show_category(request, category_name_slug):\n    # Create a context\
    \ dictionary which we can pass\n    # to the template rendering engine.\n    context_dict\
    \ = {}\n\n    try:\n        # Can we find a category name slug with the given\
    \ name?\n        # If we can't, the .get() method raises a DoesNotExist exception.\n\
    \        # The .get() method returns one model instance or raises an exception.\n\
    \        category = Category.objects.get(slug=category_name_slug)\n\n        #\
    \ Retrieve all of the associated pages.\n        # The filter() will return a\
    \ list of page objects or an empty list.\n        pages = Page.objects.filter(category=category)\n\
    \n        # Adds our results list to the template context under name pages.\n\
    \        context_dict['pages'] = pages\n        # We also add the category object\
    \ from\n        # the database to the context dictionary.\n        # We'll use\
    \ this in the template to verify that the category exists.\n        context_dict['category']\
    \ = category\n    except Category.DoesNotExist:\n        # We get here if we didn't\
    \ find the specified category.\n        # Don't do anything -\n        # the template\
    \ will display the \"no category\" message for us.\n        context_dict['category']\
    \ = None\n        context_dict['pages'] = None\n\n    # Go render the response\
    \ and return it to the client.\n    return render(request, 'rango/category.html',\
    \ context=context_dict)\n```\n\nOur new view follows the same basic steps as our\
    \ index() view. We first define a context dictionary. Then, we attempt to extract\
    \ the data from the models and add the relevant data to the context dictionary.\
    \ We determine which category has been requested by using the value passed category_name_slug\
    \ to the show_category() view function (in addition to the request parameter).\n\
    \nIf the category slug is found in the Category model, we can then pull out the\
    \ associated pages, and add this to the context dictionary, context_dict. If the\
    \ category requested was not found, we set the associated context dictionary values\
    \ to None. Finally, we render() everything together, using a new category.html\
    \ template."

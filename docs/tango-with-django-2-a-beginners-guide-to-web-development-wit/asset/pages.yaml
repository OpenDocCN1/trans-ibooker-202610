- pgno: 293
  md: "fired internally within the browser – but what about trying different events?\
    \ In this section, we’ll work on a more concrete example making use of user interactions.\n\
    \nThe goal of this simple exercise will be to add a button to Rango’s `about.html`\
    \ template and show you how events are bound to different elements of a page.\
    \ When the user clicks the button, a popup alert appears. We will, of course,\
    \ need to work with the `about.html` template and the new `rango-jquery.js` static\
    \ JavaScript file.\n\nWithin the `about.html` template, let’s first add a button\
    \ that achieves what we want using vanilla JavaScript. This demonstrates a very\
    \ simple way of *binding code to an event*. Add the code underneath the closing\
    \ `</div>`, but before the closure of the `body_block` template block. If you\
    \ still have your images of Rango and the cat from earlier, place this markup\
    \ *before* the images so the button is easy to see. You may want to also add a\
    \ line break (`<br />`) to separate the button from the images.\n\n```\n```html\n\
    <button class=\"btn btn-primary\"\n        onclick=\"alert('You clicked the button\
    \ using inline JavaScript.');\">\n    Click me - I run on vanilla JavaScript!\n\
    </button>\n```\n```\n\nWith this code in place, navigate to the about page in\
    \ your browser. You should see a blue button underneath your image. Click it,\
    \ and you will be greeted with a popup box with the message 'You clicked the button\
    \ using inline JavaScript.'. What happens with this markup is we use the `onclick`\
    \ attribute that is present for HTML elements – and add some simple JavaScript\
    \ code within it. This binds the code you provide to the event for when a user\
    \ clicks on the element within the DOM – in this case, the button. When the user\
    \ clicks, the code is executed. [HTML has heaps of different attributes](https://www.w3schools.com/tags/ref_eventattributes.asp)⁷\
    \ used for assigning code to different events.\n\nHowever, is embedding code within\
    \ a template a neat solution? We argue no. By incorporating code within your markup,\
    \ you are adding code *inline*. This violates the principle of separation of concerns.\
    \ Templates should contain presentational aspects only. Code should be placed\
    \ in a separate location, such as the `rango-jquery.js` file.\n\nTo move towards\
    \ a more elegant solution, add a further button to the `about.html` template."
  merge: -1
  img_proc: true
- pgno: 294
  md: "```\n```html\n<button class=\"btn btn-primary\" id=\"about-btn\">\n    Click\
    \ me - I'm using JQuery!\n</button>\n```\n```\n\nThis time, we have another button,\
    \ but there is no code associated with it. Instead, we replaced the `onclick`\
    \ attribute with a unique identifier—or id—that allows us to reference the button\
    \ within our external JavaScript file. If we then add the following code to `rango-jquery.js`,\
    \ we’ll start to see what is going on.\n\n```\n```javascript\n$(document).ready(function()\
    \ {\n\n    $('#about-btn').click(function() {\n        alert('You clicked the\
    \ button using JQuery!');\n    });\n\n});\n```\n```\n\nReload the page, and try\
    \ things out. Hopefully, you will see that when you click both buttons, you will\
    \ be greeted with a popup message from both, albeit with different messages.\n\
    \nLike the JQuery code that we tried earlier on, our code sample above starts\
    \ by selecting the document object and includes a function that is only executed\
    \ when the page has been loaded (i.e. `ready()`). Within this anonymous function,\
    \ we then *select* the `about-btn` element (by a unique identifier, as instructed\
    \ to by prepending the ID with a #). A further anonymous function is bound to\
    \ the event when the element with ID `about-btn` is *clicked* (`click()`)—and\
    \ this function contains a further call to the `alert()` function that displays\
    \ a popup box to the user.\n\nFor more complex functions, this approach is much\
    \ more desirable. Why? The JavaScript/JQuery code is maintained in a separate\
    \ file to the template. Here, we programmatically assign the event to a handler\
    \ at *runtime*, rather than *statically* within the HTML markup. Therefore, this\
    \ achieves separation of concerns between the JavaScript/JQuery code and the HTML\
    \ markup."
  merge: -1
  img_proc: true

    # Using the url Template Tag


    Note that we are using the url template tag in the above template code e.g. {%
    url ''rango:register'' %}. This means we will have to ensure that when we map
    the URL, we name it register.


    The first thing to note here is that this template makes use of the registered
    variable we used in our view indicating whether registration was successful or
    not. Note that registered must be False for the template to display the registration
    form – otherwise the success message is displayed.


    Next, we have used the as_p template method on the user_form and profile_form.
    This wraps each element in the form in a paragraph (denoted by the <p> HTML tag).
    This ensures that each element appears on a new line.


    Finally, in the <form> element, we have included the attribute enctype. This is
    because if the user tries to upload a picture, the response from the form may
    contain binary data. This is different from text data, derived from the user’s
    inputs into the form fields. The response therefore will have to be broken into
    multiple parts to be transmitted back to the server. As such, we need to denote
    this with enctype="multipart/form-data". This tells the HTTP client (the web browser)
    to package and send the data accordingly. Otherwise, the server won’t receive
    all the data submitted by the user.'

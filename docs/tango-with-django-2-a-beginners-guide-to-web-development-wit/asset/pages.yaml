    use the following titles. If you use our tests at the end of each chapter, these
    changes will be important.

    +     - In `about.html`, use the title `About Rango`.

    +     - In `add_category.html`, use the title `Add a Category`.

    +     - In `add_page.html`, use the title `Add a Page`.

    +     - In `category.html`, use the category’s name – and if a non-existent category
    is supplied, use `Unknown Category`. You’ll need to write a basic conditional
    check (i.e. `{% if ... %}`) here.

    +     - Finally, in `index.html`, use the title `Homepage`.'

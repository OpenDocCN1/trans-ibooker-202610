- pgno: 145
  md: "# Extract Common Structures\n\nYou should always aim to extract as much reoccurring\
    \ content for your base templates as possible. While it may be a hassle to do,\
    \ the time you will save in maintenance will far outweigh the initial overhead\
    \ of doing it upfront.\n\n> *Thinking hurts, but it is better than doing lots\
    \ of grunt work!*\n\n# Abstracting Further\n\nNow that you have an understanding\
    \ of blocks within Django templates, let’s take the opportunity to abstract our\
    \ base template a little bit further. Reopen the `rango/base.html` template and\
    \ modify it to look like the following.\n\n```\n```html\n<!DOCTYPE html>\n{% load\
    \ staticfiles %}\n\n<html>\n    <head>\n        <title>\n            Rango -\n\
    \            {% block title_block %}\n                How to Tango with Django!\n\
    \            {% endblock %}\n        </title>\n    </head>\n    <body>\n     \
    \   <div>\n            {% block body_block %}\n            {% endblock %}\n  \
    \      </div>\n        <hr />\n        <div>\n            <ul>\n             \
    \   <li><a href=\"{% url 'rango:add_category' %}\">Add a New Category</a></li>\n\
    \                <li><a href=\"{% url 'rango:about' %}\">About</a></li>\n    \
    \            <li><a href=\"{% url 'rango:index' %}\">Index</a></li>\n        \
    \    </ul>\n        </div>\n```\n```"
  merge: -1

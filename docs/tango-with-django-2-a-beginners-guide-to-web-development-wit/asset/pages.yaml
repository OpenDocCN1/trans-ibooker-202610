  md: '# Missing Categories?


    If you play around with this new functionality and add several different categories,
    remember that they will not always appear on the index page. This is because we
    coded up our index view to only show the *top five categories* in terms of the
    number of likes they have received. If you log into the admin interface, you should
    be able to view all the categories that you have entered.


    For confirmation that the category is being added, you can update the `add_category()`
    method in `rango/views.py` and change the line `form.save(commit=True)` to `cat
    = form.save(commit=True)`. This will give you a reference to an instance of the
    created Category object. You can then print the category (e.g. `print(cat, cat.slug)`).


    # Cleaner Forms


    Recall that our Page model has a url attribute set to an instance of the URLField
    type. In a corresponding HTML form, Django would reasonably expect any text entered
    into a url field to be a correctly formatted, complete URL. However, users can
    find entering something like `http://www.url.com` to be cumbersome – indeed, users
    may not even know what forms a correct URL⁸!


    # URL Checking


    Most modern browsers will now check to make sure that the URL is well-formed for
    you, so this example will only work on older browsers. However, it does show you
    how to clean the data before you try to save it to the database. If you don’t
    have an old browser to try this example (in case you don’t believe it), try changing
    the URLField to a CharField. The rendered HTML will then not instruct the browser
    to perform the checks on your behalf, and the code you implemented will be executed.


    In scenarios where user input may not be entirely correct, we can *override* the
    `clean()` method implemented in `ModelForm`. This method is called upon before
    saving form data to a new model instance, and thus provides us with a logical
    place


    ⁸ https://support.google.com/webmasters/answer/76329?hl=en'

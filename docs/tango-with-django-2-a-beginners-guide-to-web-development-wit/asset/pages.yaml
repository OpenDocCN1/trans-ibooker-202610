- pgno: 254
  md: "# 15. Making Rango Tango Hints\n\nHopefully, you will have been able to complete\
    \ the exercises in the previous chapter using only the workflows we provided.\
    \ If not, or if you need a little push in the right direction, this chapter is\
    \ for you. We provide model solutions to each of the exercises we set, and you\
    \ can incorporate them within your version of Rango if you need some help.\n\n\
    > **Got a better solution?**\n> \n> The solutions provided in this chapter are\
    \ only one way to solve each problem. There are many ways you could approach each\
    \ problem, and use solutions that exclusively use techniques that we have learnt\
    \ so far. However, if you successfully implement them differently, please feel\
    \ free to share your solution(s) with us – and tweet links to [@tangowithdjango](https://www.twitter.com/tangowithdjango)¹\
    \ for others to see!\n\n# 15.1 Track Page Clickthroughs\n\nAs we said when we\
    \ introduced this problem earlier, Rango provides only a direct link to the pages\
    \ of external pages saved to each category. This approach limits our ability to\
    \ track (or simply count) the number of times a particular link is clicked. To\
    \ be able to track clicks, we’ll need to work on the following steps. The subsections\
    \ we provide here correspond to the four main steps we outlined earlier in our\
    \ workflow.\n\n# Creating a URL Tracking View\n\nFirst, create a new view called\
    \ `goto_url()` in Rango’s `views.py` module. The view which takes a parameterised\
    \ HTTP GET request (i.e. `rango/goto/?page_id=1`) and updates the number of views\
    \ for the page. The view should then redirect to the actual URL."

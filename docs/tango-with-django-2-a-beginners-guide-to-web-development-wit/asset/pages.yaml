- pgno: 290
  md: "This now points the browser to look for JQuery in your `static/js` directory,\
    \ rather than directly from the JQuery servers. Once you have done this, you’ll\
    \ want to then create a new, blank file in the `js` directory called `rango-query.js`.\
    \ We’ll be adding in some JavaScript code that uses JQuery to add functionality\
    \ to our Rango app. Of course, we’ll also need to add a reference to this new\
    \ file in our `base.html` template, too. Underneath the line you just tweaked,\
    \ add the following.\n\n```\n```html\n<script src=\"{% static \\\"js/rango-jquery.js\\\
    \" %}\" crossorigin=\"anonymous\"></script>\n```\n```\n\nMake sure this new markup\
    \ is *underneath* the line including the JQuery framework. As a sanity check,\
    \ make sure your static files have been set up correctly (see [Templates and Media\
    \ Files]), and that you have `{% load staticfiles %}` at the top of `base.html`.\n\
    \n# ## 16.2 Testing your Setup\n\nWith the above steps completed, you should now\
    \ be ready to try things out! Open the new `rango-jquery.js` file, and add the\
    \ following lines of code.\n\n```\n```javascript\n$(document).ready(function()\
    \ {\n    alert('Hello, world!');\n});\n```\n```\n\nThis small piece of code utilises\
    \ JQuery. But how does it work? We’ve broken it down into a series of different\
    \ steps to show you what’s going on.\n\n+   1. We first select the document object\
    \ via `$(document)`. The `$()` is the shortcut that you can use to access the\
    \ JQuery framework – everything that uses JQuery will have commands that start\
    \ with a $. The command `$(document)` tells the JQuery framework to *select* the\
    \ [HTML document object³](https://www.w3schools.com/jsref/dom_obj_document.asp)\
    \ – the object that a complete HTML page becomes when a web browser loads it into\
    \ memory. This object encapsulates the entirety of the page. When we select something\
    \ like this, we call the mechanism a *selector*."
  merge: -1
  img_proc: true
- pgno: 291
  md: "+   2. With the document selected, we then *chain* a function onto our selector.\
    \ In this instance, we chain the `ready()` function. As stated in the [JQuery\
    \ documentation](https://api.jquery.com/ready/), this is a function that JQuery\
    \ executes *when the DOM/page is fully loaded in memory, and is ready to go*.\
    \ It’s pretty typical to want to wait until everything on the page has been loaded\
    \ (including external resources), so you can get a guarantee that everything will\
    \ be there when the code starts executing. If you don’t wait, the code can begin\
    \ executing before everything that is expected to be present is ready – and the\
    \ user will get a broken website.\n+   \n+   3. Inside `ready()`, we define an\
    \ *anonymous function* to execute when the DOM is ready to go. Just like any other\
    \ function in JavaScript, it can take parameters and is surrounded by braces (like\
    \ `{` and `}`). This is different from Python in that Python relies solely on\
    \ indentation to tell it what lines of code to execute, and when. With a C-style\
    \ language such as JavaScript and Java, braces are used to this effect.\n+   \n\
    +   4. Inside the function, we have the line `alert(\"Hello, world!\");`. Note\
    \ that at the end of each line/command, place a semicolon (`;`). The `alert()`\
    \ function takes a string, and displays it as a popup box in the browser. In this\
    \ instance, it will display the string `Hello, world!`.\n\nTo summarise, this\
    \ code displays the message `Hello, world!`, just like in the [screenshot we show\
    \ below](#). However, the key here is that the browser waits until everything\
    \ is loaded, then displays the message. We strongly encourage you to keep the\
    \ [JQuery API documentation](https://api.jquery.com/) open in a separate tab to\
    \ help you understand the different concepts we demonstrate here better.\n\n>\
    \ [^4]: https://api.jquery.com/ready/\n> [^5]: https://www.w3.org/TR/WD-DOM/introduction.html\n\
    > [^6]: https://api.jquery.com/"
  merge: -1
  img_proc: true
- pgno: 292
  md: '![](img/75169a27287f7c945bf2cbf7dede5251_292_0.png)


    **The result of the code we demonstrate above – a small popup box that displays
    `Hello, world!` when the page is loaded. This should be visible on every page
    of Rango.**


    You should, of course, remove the `alert()` function call once you have seen it
    working in front of your very eyes – this is perhaps the simplest demonstration
    we can implement. Being greeted with this popup on every page is very annoying!


    # Select and Act Pattern


    JQuery requires you to think in a more *functional* programming style, as opposed
    to typical JavaScript which is written in a more *procedural* way. For all JQuery
    commands, they follow a similar pattern: **Select and Act.** Select an element,
    and then perform some kind of action on/with the element.


    # Acting on Mouse Clicks


    In the previous example, we executed the `alert()` function call when the page
    had been loaded, and everything was ready to go. This is based upon an *event*
    being'
  merge: -1

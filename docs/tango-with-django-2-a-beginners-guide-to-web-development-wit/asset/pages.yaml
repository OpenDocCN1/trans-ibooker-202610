    # 17.4 Further AJAX-ing


    Having gone through two examples of how to incorporate AJAX within the Rango app,
    why not try one more? This time, *treat this as an exercise*. We’ll lay out the
    specification for you and provide code snippets that will help you towards a solution.
    However, we implore you to solve it for yourself. If you need help, try going
    online and searching for a solution. Figuring out what query to type into a search
    engine can sometimes be half the battle in getting the help you require.


    # Specification


    We added several new categories to test out our category suggestion feature earlier
    on. If you didn’t add pages to those categories, they’ll just be blank. With the
    Bing Search functionality integrated within a category page, one missing link
    that we have not yet covered is providing a user with the ability to *add a page
    from search results*.


    That is when a registered user issues a query and retrieves results, can we provide
    an Add button next to a search result to let the user add this page to the category
    they are looking at? Furthermore, can this be done through the use of AJAX?


    Here’s a rough workflow to assist you in finding a solution to this problem.


    +   1. First, update Rango’s `category.html` template.

    +      - Add a small button next to each search result. Within the `<button>`
    element, you’ll want to add `data` attributes that provide the page title and
    page URL. Doing this will make it easier for JQuery to pick out this information.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '+   - Where pages are listed, you’ll want to wrap that block of markup and
    template code with a `<div>` with a unique ID. Once again, this is so that JQuery
    can easily select this element and update the contents within it.

    +   - Remove the link to the existing Add Page view – this is now essentially
    redundant.

    +   2. With the changes in place to the template, you then need to create a new
    view to handle the addition of a new page.

    +      - The view will accept a GET request, containing the new title and url
    for a page, as well as the `category_id` for the category the page is being added
    to. This view should then add the new page to the given category.

    +      - Map the new view to a URL – `/rango/search_add_page/`.

    +      - The new view should return an updated list of pages for the category.
    This may involve the addition of a new template to generate this list.

    +   3. Glue the new view together with the updated `category.html` infrastructure.
    When an Add button is clicked, JQuery code should then be executed, issuing an
    AJAX GET request to your new view. The data returned from the new view should
    then be placed within your `<div>` container for the list of pages.


    # 🔑 Use a class for the Add Button!


    Until now, we’ve selected buttons in JQuery using a unique id. This is because
    until now, only one such button has existed on a page.


    However, having an Add button for *each page* returned from the Bing Search API
    presents a problem. How do you get JQuery to be able to bind code to all of them?
    Use the class selected (`.`) instead of the ID selector (`#`)! You can create
    a new class, apply it to each button, and then select items using that class with
    JQuery.


    # Code Snippets


    We’ve included several code snippets to help you along with this exercise. Our
    sample markup and template code that provides a `<button>` to Add a new page from
    search results are shown below.'

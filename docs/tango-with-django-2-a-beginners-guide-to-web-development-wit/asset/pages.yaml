- pgno: 385
  md: '# ## What is a Repository?


    We keep repeating the word *repository*, but what do we mean by that? When considering
    version control, a repository is a data structure which contains metadata (a set
    of data that describes other data, hence *meta*) concerning the files which you
    are storing within the version control system. The kind of metadata that is stored
    can include aspects such as the historical changes that have taken place within
    a given file so that you have a record of all changes that take place.


    If you want to learn more about the metadata stored by Git, there is a [technical
    tutorial available](http://www.sbf5.com/~cduan/technical/git/git-1.shtml) for
    you to read through.


    For now, though, let’s provide an overview of each of the different aspects of
    the Git system. We’ll recap some of the things we’ve already mentioned just to
    make sure it makes sense to you.


    +   - As already explained, the **remote repository** is the copy of your project’s
    repository stored on some remote server. This is particularly important for Git
    projects that have more than one contributor – you require a central place to
    store all the work that your team members produce. You could set up a Git server
    on a computer with Internet access and a properly configured firewall (check out
    [this Server Fault question](https://serverfault.com/questions/189070/what-firewall-ports-need-to-be-open-to-allow-access-to-external-git-repositories),
    for example), or simply use one of many services providing free Git repositories.
    One of the most widely used services available today is [GitHub](https://github.com/).
    In fact this book has a [Git repository](https://github.com/maxwelld90/tango_with_django_2_code/)
    on GitHub!

    +   - The **local repository** is a copy of the remote repository stored on your
    computer (locally). This is the repository to which you make all your additions,
    changes and deletions. When you reach a particular milestone, you can then *push*
    all your local changes to the remote repository. From there, you can instruct
    your team members to retrieve your changes. This concept is known as *pulling*
    from the remote repository. We’ll subsequently explain pushing and pulling in
    a bit more detail.'
  merge: -1
  img_proc: true

  md: "# Cross Site Request Forgery Tokens\n\nYou should also take note of the code\
    \ snippet `{% csrf_token %}`. This is a *Cross-Site Request Forgery (CSRF) token*,\
    \ which helps to protect and secure the HTTP POST request that is initiated on\
    \ the subsequent submission of a form. *The Django framework requires the CSRF\
    \ token to be present. If you forget to include a CSRF token in your forms, a\
    \ user may encounter errors when he or she submits the form.* Check out the official\
    \ Django documentation on CSRF tokens⁶ for more information about this.\n\n# Mapping\
    \ the Add Category View\n\nNow we need to map the add_category() view to a URL.\
    \ In the template, we have used the URL `/rango/add_category/` in the form’s action\
    \ attribute. We now need to create a mapping from the URL to the view. In `rango/urls.py`\
    \ modify the `urlpatterns` list to make it look like the following.\n\n```\nurlpatterns\
    \ = [\n    path('', views.index, name='index'),\n    path('about/', views.about,\
    \ name='about'),\n    path('category/<slug:category_name_slug>/', views.show_category,\n\
    \        name='show_category'),\n    path('add_category/', views.add_category,\
    \ name='add_category'),\n]\n```\n\nOrdering doesn’t necessarily matter in this\
    \ instance. However, take a look at the official Django documentation on how Django\
    \ processes a request⁷ for more information. The URL for adding a category is\
    \ `/rango/add_category/`, with the name of `add_category`.\n\n# Modifying the\

- pgno: 160
  md: 'The User model has five key attributes. They are:


    +   - the *username* for the user account;

    +   - the account’s *password*;

    +   - the user’s *email address*;

    +   - the user’s *first name*; and

    +   - the user’s *surname*.


    The User model also comes with other attributes such as `is_active`, `is_staff`
    and `is_superuser`. These are boolean fields used to denote whether the account
    is active, owned by a staff member, or has superuser privileges respectively.
    Check out the Django documentation on the user model¹⁰ for a full list of attributes
    provided by the base User model.


    # 9.5 Additional User Attributes


    If you would like to include other user related attributes than what is provided
    by the User model, you will needed to create a model that is *associated* with
    the User model. For our Rango app, we want to include two more additional attributes
    for each user account. Specifically, we wish to include:


    +   - a `URLField`, allowing a user of Rango to specify their personal website’s
    URL; and

    +   - a `ImageField`, which allows users to specify a picture for their user profile.


    This can be achieved by creating an additional model in Rango’s `models.py` file.
    Let’s add a new model called `UserProfile`:'
  merge: -1
  img_proc: true
- pgno: 161
  md: "```\nclass UserProfile(models.Model):\n    # This line is required. Links UserProfile\
    \ to a User model instance.\n    user = models.OneToOneField(User, on_delete=models.CASCADE)\n\
    \n    # The additional attributes we wish to include.\n    website = models.URLField(blank=True)\n\
    \    picture = models.ImageField(upload_to='profile_images', blank=True)\n\n \
    \   def __str__(self):\n        return self.user.username\n```\n\nNote that we\
    \ reference the User model using a one-to-one relationship. Since we reference\
    \ the default User model, we need to import it within the models.py file:\n\n\
    ```\nfrom django.contrib.auth.models import User\n```\n\nFor Rango, we’ve added\
    \ two fields to complete our user profile. We have also provided a __str__() method\
    \ to return a meaningful value when a string representation of a UserProfile model\
    \ instance is requested.\n\nFor the two fields website and picture, we have set\
    \ blank=True for both. This allows each of the fields to be blank if necessary,\
    \ meaning that users do not have to supply values for the attributes.\n\nFurthermore,\
    \ it should be noted that the ImageField field has an upload_to attribute. The\
    \ value of this attribute is conjoined with the project’s MEDIA_ROOT setting to\
    \ provide a path with which uploaded profile images will be stored. For example,\
    \ a MEDIA_ROOT of <workspace>/tango_with_django_project/media/ and upload_to attribute\
    \ of profile_images will result in all profile images being stored in the directory\
    \ <workspace>/tango_with_django_project/media/profile_images/. Recall that in\
    \ the chapter on templates and media files we set up the media root there.\n\n\
    # What about Inheriting to Extend?\n\nIt may have been tempting to add the additional\
    \ fields defined above by inheriting from the User model directly. However, because\
    \ other applications may also want access to the User model, it is not recommended\
    \ to use inheritance – but rather to instead use a one-to-one relationship within\
    \ your database."

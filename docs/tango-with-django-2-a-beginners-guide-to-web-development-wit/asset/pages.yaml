  md: "```\n{% if user.is_authenticated %}\n    howdy {{ user.username }}!\n{% else\
    \ %}\n    hey there partner!\n{% endif %}\n```\n\nAs you can see, we have used\
    \ Django’s template language to check if the user is authenticated with {% if\
    \ user.is_authenticated %}. If a user is logged in, then Django gives us access\
    \ to the user object. We can tell from this object if the user is logged in (authenticated).\
    \ If he or she is logged in, we can also obtain details about him or her. In the\
    \ example above, the user’s username will be presented to them if logged in –\
    \ otherwise the generic hey there partner! message will be shown.\n\n# Demo\n\n\
    Start the Django development server and attempt to login to the application. The\
    \ figure below shows a screenshot of the login page as it should look.\n\n![](img/75169a27287f7c945bf2cbf7dede5251_176_0.png)\n\
    \nScreenshot of the login page, complete with username and password fields."

- pgno: 154
  md: "```\n```python\ndef get_category_list(current_category=None):\n    return {'categories':\
    \ Category.objects.all(),\n            'current_category': current_category}\n\
    ```\n```\n\nNote the `current_category` parameter for `get_category_list()`. If\
    \ a parameter is not passed along, `None` is used instead (implying there is no\
    \ currently selected category).\n\nWe can then update our `base.html` template\
    \ which makes use of the custom template tag to pass in the current category –\
    \ but only if it exists.\n\n```\n```html\n<div>\n    {% block sidebar_block %}\n\
    \        {% get_category_list category %}\n    {% endblock %}\n</div>\n```\n```\n\
    \nWe can now also update the `categories.html` template, too. This block of code\
    \ lives inside the existing `{% if categories %}` conditional check; it doesn’t\
    \ replace the entire template.\n\n```\n```html\n{% for c in categories %}\n  \
    \  {% if c == current_category %}\n    <li>\n    <strong>\n        <a href=\"\
    {% url 'rango:show_category' c.slug %}\">{{ c.name }}</a>\n    </strong>\n   \
    \ </li>\n    {% else %}\n    <li>\n        <a href=\"{% url 'rango:show_category'\
    \ c.slug %}\">{{ c.name }}</a>\n    </li>\n    {% endif %}\n{% endfor %}\n```\n\
    ```\n\nIn the template, we check to see if the category being displayed is the\
    \ same as the category being passed through during the `for` loop (i.e. `c ==\
    \ current_category`). If so, we highlight the category name by making it **bold**\
    \ through use of the `<strong>` tag."

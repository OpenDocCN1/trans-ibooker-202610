- pgno: 383
  md: '# # A Git Crash Course


    We strongly recommend that you spend some time familiarising yourself with a version
    control⁸⁰ system for your application’s codebase. This chapter provides you with
    a crash course in how to use Git⁸¹, one of the many version control systems available.
    Originally developed by Linus Torvalds⁸², Git is today one of the most popular
    version control systems in use⁸³, and is used by open-source and closed-source
    projects alike.


    This tutorial demonstrates at a high level how Git works, explains the basic commands
    that you can use, and explains Git’s workflow. By the end of this chapter, you’ll
    be able to make contributions to a Git repository, enabling you to work solo,
    or in a team.


    # ## Why Use Version Control?


    As your software engineering skills develop, you will find that you can plan and
    implement solutions to ever more complex problems. As a rule of thumb, the larger
    the problem specification, the more code you have to write. The more code you
    write, the greater the emphasis you should put on software engineering practices.
    Such practices include the use of design patterns and the DRY (Don’t Repeat Yourself)⁸⁴
    principle.


    Think about your experiences with programming thus far. Have you ever found yourself
    in any of these scenarios?


    +   - Made a mistake to code, realised it was a mistake and wanted to go back?

    +   - Lost code (through a faulty drive), or had a backup that was too old?'
  merge: -1
  img_proc: true
- pgno: 384
  md: <!-- no content -->

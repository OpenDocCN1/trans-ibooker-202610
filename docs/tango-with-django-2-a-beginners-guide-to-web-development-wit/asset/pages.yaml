    to include the field in the form. If in `fields` we excluded `views`, then the
    form would not contain that field (despite it being specified). This would mean
    that the form would not return the value zero for that field. This may raise an
    error depending on how the model has been set up. If in the model we specified
    that the `default=0` for these fields, then we can rely on the model to automatically
    populate the field with the default value – and thus avoid a `not null` error.
    In this case, it would not be necessary to have these hidden fields. We have also
    included the field `slug` in the `CategoryForm`, and set it to use the `widget=forms.HiddenInput()`.


    However, rather than specifying an initial or default value, we have said the
    field is not required by the form. This is because our model will be responsible
    for populating the field when the form is eventually saved. Essentially, you need
    to be careful when you define your models and forms to make sure that the form
    is going to contain and pass on all the data that is required to populate your
    model correctly.


    Besides the `CharField` and `IntegerField` widgets, many more are available for
    use. As an example, Django provides `EmailField` (for e-mail address entry), `ChoiceField`
    (for radio input buttons), and `DateField` (for date/time entry). There are many
    other field types you can use, which perform error checking for you (e.g. *is
    the value provided a valid integer?*).



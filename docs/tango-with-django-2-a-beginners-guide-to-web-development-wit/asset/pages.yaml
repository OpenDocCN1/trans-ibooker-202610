  img_proc: true
- pgno: 169
  md: "# Multipart Messages and Binary Files\n\nYou should be aware of the enctype\
    \ attribute for the <form> element. When you want users to upload files from a\
    \ form – whether it be an image or some other document – it’s an absolute must\
    \ to set enctype to multipart/form-data. This attribute and value combination\
    \ instructs your browser to send form data in a special way back to the server.\
    \ Essentially, the data representing your file is split into a series of chunks\
    \ and sent. For more information, check out this great Stack Overflow answer¹³.\n\
    \nFurthermore, remember to include the CSRF token, i.e. {% csrf_token %} within\
    \ your <form> element! If you don’t do this, Django’s cross-site forgery¹⁴ protection\
    \ middleware layer will refuse to accept the form’s contents, returning an error.\
    \ This provides a layer of security, preventing form submissions to succeed from\
    \ a spoof website. This is often called phishing.\n\n# The register() URL Mapping\n\
    \nWith our new view and associated template created, we can now add in the URL\
    \ mapping. In Rango’s URLs module rango/urls.py, modify the urlpatterns tuple\
    \ as shown below.\n\n```\nurlpatterns = [\n    path('', views.index, name='index'),\n\
    \    path('about/', views.about, name='about'),\n    path('category/<slug:category_name_slug>/add_page/',\
    \ views.add_page,\n        name='add_page'),\n    path('category/<slug:category_name_slug>/',\
    \ views.show_category,\n        name='show_category'),\n    path('add_category/',\
    \ views.add_category, name='add_category'),\n    path('register/', views.register,\
    \ name='register'),  # New mapping!\n]\n```\n\nThe newly added pattern (at the\
    \ bottom of the list) points the URL /rango/register/ to the register() view.\
    \ Also note the inclusion of a name for our new URL, register,"
  merge: -1
  img_proc: true

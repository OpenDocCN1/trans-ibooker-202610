- pgno: 195
  md: '# ## 10.6 Session Data


    The previous example shows how we can store and manipulate client-side cookies
    – or the data stored on the client. However, a more secure way to save session
    information is to store any such data on the server-side. We can then use the
    session ID cookie that is stored on the client-side (but is effectively anonymous)
    as the key to access the data.


    To use session-based cookies you need to perform the following steps.


    +   1. Make sure that the `MIDDLEWARE_CLASSES` list found in the `settings.py`
    module contains `django.contrib.sessions.middleware.SessionMiddleware`.

    +   2. Configure your session backend. Make sure that `django.contrib.sessions`
    is in your `INSTALLED_APPS` in `settings.py`. If not, add it, and run the database
    migration command `python manage.py migrate`.

    +   3. By default, a database backend is assumed, but you might want to use a
    different setup (i.e. a cache). See the [Django documentation on sessions for
    other back-end configurations](https://docs.djangoproject.com/en/2.1/topics/http/sessions/).


    Instead of storing the cookies directly in the request (and thus on the client’s
    machine), you can access server-side data via the method `request.session.get()`
    and store them with `request.session[]`. Note that a session ID cookie is still
    used to remember the client’s machine (so technically a browser-side cookie exists).
    However, all the user/session data is stored server-side. Django’s session middleware
    handles the client-side cookie and the storing of the user/session data.


    To use the server-side data, we need to refactor `views.py`. First, we need to
    update the `visitor_cookie_handler()` function so that it accesses the cookies
    on the server-side. We can do this by calling `request.session.get()`, and store
    them by placing them in the dictionary `request.session[]`. To help us along,
    we have made a helper function called `get_server_side_cookie()` that asks the
    request for a cookie. If the cookie is in the session data, then its value is
    returned. Otherwise, the default value is returned.'

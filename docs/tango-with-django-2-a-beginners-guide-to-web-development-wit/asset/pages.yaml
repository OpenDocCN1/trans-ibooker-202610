  md: "# ## User Management\n\nThe Django admin interface is also your port of call\
    \ for user management through the Authentication and Authorisation section. Here,\
    \ you can create, modify and delete user accounts, and vary privilege levels.\
    \ [More on this later.](#)\n\n# ## Plural vs. Singular Spellings\n\nNote the typo\
    \ within the admin interface (Categorys, not Categories). This typo can be fixed\
    \ by adding a nested Meta class into your model definitions with the `verbose_name_plural`\
    \ attribute. Check out a modified version of the Category model below for an example,\
    \ and [Django’s official documentation on models](#) for more information about\

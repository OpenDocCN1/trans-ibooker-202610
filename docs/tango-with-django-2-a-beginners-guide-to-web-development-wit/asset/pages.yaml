  md: '![](img/75169a27287f7c945bf2cbf7dede5251_17_0.png)


    # Pages and URL Mappings


    From the specification, we have already identified two pages that our application
    will present to the user at different points in time. To access each page, we
    will need to describe URL mappings. Think of a URL mapping as the text a user
    would have to enter into a browser’s address bar to access a given page. The basic
    URL mappings for Rango are shown below.


    +   - `/` or `/rango/` will point to the main `/` index page.

    +   - `/rango/about/` will point to the about page.

    +   - `/rango/category/<category_name>/` will point to the category page for `<category_name>`,
    where the category might be:

    +     - `games`;

    +     - `python-recipes`; or

    +     - `code-and-compilers`.'
  merge: -1
  img_proc: true

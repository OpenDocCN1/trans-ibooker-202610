    \ == '__main__'` Represent?\n\nThe `__name__ == '__main__'` trick is a useful\
    \ one that allows a Python module to act as either a reusable module or a standalone\
    \ Python script. Consider a reusable module as one that can be imported into other\
    \ modules (e.g. through an `import` statement), while a standalone Python script\
    \ would be executed from a terminal/Command Prompt by entering `python module.py`.\n\
    \nCode within a conditional `if __name__ == '__main__'` statement will therefore\

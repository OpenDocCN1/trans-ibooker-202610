- pgno: 377
  md: 'When you are using the terminal, it is important to know where you are in the
    file system. To find out where you are, you can issue the command `pwd`. This
    will display your *Present Working Directory* (hence pwd). For example, check
    the example terminal interactions below.


    ```

    Last login: Sun Jul 21 15:47:24 2019

    sibu:~ david$ pwd

    /users/grad/david

    sibu:~ david$

    ```


    You can see that the present working directory in this example is `/users/grad/david`.


    You’ll also note that the prompt indicates that the present working directory
    is a tilde `~`. The tilde is used as a special symbol which represents your *home
    directory*. The base directory in any UNIX based file system is the *root directory*.
    The path of the root directory is denoted by a single forward-slash `/`. As folders
    (or directories) are separated in UNIX paths with a `/`, a single `/` denotes
    the root!


    If you are not in your home directory, you can *Change Directory* (`cd`) by issuing
    the following command:


    ```

    sibu:/ david$ cd ~

    sibu:~ david$

    ```


    Note how the present working directory switches from `/` to `~` upon issuing the
    `cd ~` command.'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# Path Shortcuts


    UNIX shells have several different shorthand ways for you to move around your
    computer’s filesystem. You’ve already seen that a forward slash (/) represents
    the root directory⁷⁰, and the tilde (~) represents your home directory in which
    you store all your files. However, there are a few more special characters you
    can use to move around your filesystem in conjunction with the cd command.


    +   - Issuing `cd ~` will always return you to your home directory. On some UNIX
    or UNIX derivatives, simply issuing `cd` will return you to your home directory,
    too.

    +   - Issuing `cd ..` will move your present working directory **up one level**
    of the filesystem hierarchy. For example, if you are currently in `/users/grad/david/code/`,
    issuing `cd ..` will move you to `/users/grad/david/`.

    +   - Issuing `cd -` will move you to the **previous directory you were working
    in**. Your shell remembers where you were, so if you were in `/var/tmp/` and moved
    to `/users/grad/david/`, issuing `cd -` will move you straight back to `/var/tmp/`.
    This command only works if you’ve moved around at least once in a given terminal
    session.


    Now, let’s create a directory within the home directory called `code`. To do this,
    you can use the *Make Directory* command, called `mkdir`.


    ```

    sibu:~ david$ mkdir code

    sibu:~ david$

    ```


    There’s no confirmation that the command succeeded. We can change the present
    working directory with the `cd` command to change to `code`. If this succeeds,
    we will know the directory has been successfully created.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '```

    ```text

    sibu:~ david$ cd code

    sibu:code david$

    ```

    ```


    Issuing another `pwd` command to confirm our present working directory returns
    the output `/users/grad/david/code`. This is our home directory with `code` appended
    to the end. You can also see from the prompt in the example above that the present
    working directory changes from `~` to `code`.


    # Change Back


    Now issue the command to change back to your home directory. What command do you
    enter?


    From your home directory, let’s now try out another command to see what files
    and directories exist. This new command is called `ls`, shorthand for *list*.
    Issuing `ls` in your home directory will yield something similar to the following.


    ```

    ```text

    sibu:~ david$ ls

    code

    ```

    ```


    This shows us that there is something present in our home directory called `code`,
    as we would expect. We can obtain more detailed information by adding a `l` switch
    to the end of the `ls` command – with `l` standing for *list*.


    ```

    ```text

    sibu:~ david$ ls -l

    drwxr-xr-x  2 david  grad  68 21 Jul 15:00 code

    ```

    ```


    This provides us with additional information, such as the modification date (2
    Apr 11:07), whom the file belongs to (user david of group grad), the size of the
    entry (68 bytes), and the file permissions (`drwxr-xr-x`). While we don’t go into
    file permissions here, the key thing to note is the `d` at the start of the string
    that denotes the entry is a directory. If we then add some files to our home directory
    and reissue the `ls -l` command, we then can observe differences in the way files
    are displayed as opposed to directories.'
  merge: -1
  img_proc: true
- pgno: 380
  md: '```

    ```text

    sibu:~ david$ ls -l

    drwxr-xr-x  2 david  grad       68 21 Jul 15:00 code

    -rw-r--r--@ 1 david  grad   303844  2 Apr 16:16 document.pdf

    -rw-r--r--  1 david  grad       14  2 Apr 11:14 readme.md

    ```

    ```


    One final useful switch to the ls command is the a switch, which displays *all*
    files and directories. This is useful because some directories and files can be
    *hidden* by the operating system to keep things looking tidy. Issuing the command
    yields more files and directories!


    ```

    ```text

    sibu:~ david$ ls -la

    -rw-r--r--  1 david  grad      463 20 Feb 19:58 .profile

    drwxr-xr-x 16 david  grad      544 25 Mar 11:39 .virtualenvs

    drwxr-xr-x  2 david  grad       68 21 Jul 15:00 code

    -rw-r--r--@ 1 david  grad   303844  1 Apr 16:16 document.pdf

    -rw-r--r--  1 david  grad       14  2 Apr 11:14 readme.md

    ```

    ```


    This command shows a hidden directory `.virtualenvs` and a hidden file `.profile`.
    Note that hidden files on a UNIX based computer (or derivative) start with a period
    (`.`). There’s no special hidden file attribute you can apply, unlike on Windows
    computers.


    ![](img/75169a27287f7c945bf2cbf7dede5251_380_0.png)


    # ## Combining ls Switches


    You may have noticed that we combined the l and a switches in the above ls example
    to force the command to output a list displaying all hidden files. This is a valid
    command – and there are **even more switches you can use**[^71] to customise the
    output of ls.


    Creating files is also easy to do, straight from the terminal. The touch command
    creates a new, blank file. If we wish to create a file called `new.txt`, issue
    `touch new.txt`. If we then list our directory, we then see the file added.


    [^71]: http://man7.org/linux/man-pages/man1/ls.1.html'
  merge: -1
  img_proc: true
- pgno: 381
  md: '```

    sibu:~ david$ ls -l

    drwxr-xr-x  2 david  grad       68 21 Jul 15:00 code

    -rw-r--r--@ 1 david  grad   303844  1 Apr 16:16 document.pdf

    -rw-r--r--  1 david  grad        0  2 Apr 11:35 new.txt

    -rw-r--r--  1 david  grad       14  2 Apr 11:14 readme.md

    ```


    Note the filesize of new.txt – it is zero bytes, indicating an empty file. We
    can start editing the file using one of the many available text editors that are
    available for use directly from a terminal, such as nano⁷² or vi⁷³. While we don’t
    cover how to use these editors here, you can have a look online for a simple how-to
    tutorial⁷⁴. We suggest starting with nano – while there are not as many features
    available compared to other editors, using nano is much simpler.


    # Core Commands


    In the short tutorial above, you’ve covered a few of the core commands such as
    pwd, ls and cd. There are however a few more standard UNIX commands that you should
    familiarise yourself with before you start working for real. These are listed
    below for your reference, with most of them focusing upon file management. The
    list comes with an explanation of each and an example of how to use them.


    +   - **pwd:** As explained previously, this command displays your *present working
    directory* to the terminal. The full path of where you are presently is displayed.

    +   - **ls:** Displays a list of files in the present working directory to the
    terminal.

    +   - **cd:** In conjunction with a path, `cd` allows you to change your present
    working directory. For example, the command `cd /users/grad/david/` changes the
    present working directory to `/users/grad/david/`. You can also move up a directory
    level without having to provide the *absolute path*⁷⁵ by using two dots, e.g.
    `cd ..`.

    +   - **cp:** Copies files and/or directories. You must provide the *source* and
    the *target*. For example, to make a copy of the file `input.py` in the same directory,
    you could issue the command `cp input.py input_backup.py`.'

  md: 'If you take a close look at the modified Bootstrap dashboard HTML source, you’ll
    notice it has a lot of structure in it created by a series of `<div>` tags. Essentially
    the page is broken into two parts – the top navigation bar which is contained
    by `<header>` tags, and the main content pane denoted by the `<main ...>` tag.
    Within the main content pane, there is a `<div>` which houses two other `<div>`s
    for the `sidebar_block` and the `body_block`.


    The code above assumes that you have completed the chapters on user authentication
    and used `django-registration-redux`, as outlined in the previous chapter. If
    you haven’t done both of these activities, you will need to update the template
    and remove/modify the references to those links in the navigation bar in the header.


    Also of note is that the HTML template makes references to external websites to
    request the required css and js files. For everything to work, you will need to
    be connected to the Internet for the styles and JavaScript files to be loaded
    when you run Rango.


    # Working Offline?


    Rather than including external references to the css and js files, you could download
    all the associated files and store them in your project’s static directory. We
    recommend storing CSS files in `static/css/`, with JavaScript files in `static/js/`.
    If you do this, you will need to update the `bootstrap-base.html` to point to
    the correct files locally using the `{% static ''...'' %}` template function.


    # 12.2 Quick Style Change


    To give Rango a much-needed facelift, we need to update our base template to make
    use of the new `bootstrap-base.html` template. It’s now ready to go! There are
    many ways to do this, with one option being to rename `base.html` to `bootstrap-base.html`
    in all your other templates. However, a quicker solution would be to do the following.


    +   1. Rename the `base.html` template in `templates/rango/` to `base-old.html`.

    +   2. Rename the `bootstrap-base.html` template in `templates/rango/` to `base.html`.'

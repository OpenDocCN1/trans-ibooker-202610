  md: '# # URL Design and Mapping


    Let’s start by considering the URL problem. One way we could handle this problem
    is to use the unique ID for each category within the URL. For example, we could
    create URLs like `/rango/category/1/` or `/rango/category/2/`, where the numbers
    correspond to the categories with unique IDs 1 and 2 respectively. However, it
    is not possible to infer what the category is about just from the ID.


    Instead, we could use the category name as part of the URL. For example, we can
    imagine that the URL `/rango/category/python/` would lead us to a list of pages
    related to Python. This is a simple, readable and meaningful URL. If we go with
    this approach, we’ll also have to handle categories that have multiple words,
    like Other Frameworks, for example. **Putting spaces in URLs is generally regarded
    as bad practice** (as we describe below). Spaces need to be *percent-encoded*².
    For example, the percent-encoded string for `Other Frameworks` would read `Other%20Frameworks`.
    This looks messy and confusing!


    ![](img/75169a27287f7c945bf2cbf7dede5251_104_0.png)


    # ## Clean your URLs


    Designing clean and readable URLs is an important aspect of web design. See [Wikipedia’s
    article on Clean URLs](https://en.wikipedia.org/wiki/Clean_URL)³ for more details.


    To solve this problem, we will make use of the so-called `slugify()` function
    provided by Django.


    # ## Update the Category Table with a Slug Field


    To make readable URLs, we need to include a [slug](https://prettylinks.com/2018/03/url-slugs/)⁴
    field in the `Category` model. First, we need to import the function `slugify`
    from Django that will replace whitespace with hyphens, circumnavigating the percent-encoded
    problem. For example, "how do i create a slug in django" turns into "how-do-i-create-a-slug-in-django".'
  merge: -1
  img_proc: true
- pgno: 105
  md: "# Unsafe URLs\n\nWhile you can use spaces in URLs, it is considered to be unsafe\
    \ to use them. Check out the Internet Engineering Task Force Memo on URLs⁵ to\
    \ read more.\n\nNext, we need to override the save() method of the Category model.\
    \ This overridden function will call the slugify() function and update the new\
    \ slug field with it. Note that every time the category name changes, the slug\
    \ will also change – the save() method is always called when creating or updating\
    \ an instance of a Django model. Update your Category model as shown below.\n\n\
    ```\nclass Category(models.Model):\n    name = models.CharField(max_length=128,\
    \ unique=True)\n    views = models.IntegerField(default=0)\n    likes = models.IntegerField(default=0)\n\
    \    slug = models.SlugField()\n\n    def save(self, *args, **kwargs):\n     \
    \   self.slug = slugify(self.name)\n        super(Category, self).save(*args,\
    \ **kwargs)\n\nclass Meta:\n    verbose_name_plural = 'categories'\n\ndef __str__(self):\n\
    \    return self.name\n```\n\nDon’t forget to add in the following import at the\
    \ top of the module, either.\n\n```\nfrom django.template.defaultfilters import\
    \ slugify\n```\n\nThe overridden save() method is relatively straightforward to\
    \ understand. When called, the slug field is set by using the output of the slugify()\
    \ function as the new field’s value. Once set, the overridden save() method then\
    \ calls the parent (or super) save() method defined in the base django.db.models.Model\
    \ class. It is this call that performs the necessary logic to take your changes\
    \ and save the said changes to the correct database table."

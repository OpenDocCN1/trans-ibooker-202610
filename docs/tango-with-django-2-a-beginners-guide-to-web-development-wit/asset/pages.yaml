- pgno: 260
  md: "```\n```python\ndef show_category(request, category_name_slug):\n    context_dict\
    \ = {}\n\n    try:\n        category = Category.objects.get(slug=category_name_slug)\n\
    \        pages = Page.objects.filter(category=category).order_by('-views')\n\n\
    \        context_dict['pages'] = pages\n        context_dict['category'] = category\n\
    \    except Category.DoesNotExist:\n        context_dict['category'] = None\n\
    \        context_dict['pages'] = None\n\n    # Start new search functionality\
    \ code.\n    if request.method == 'POST':\n        if request.method == 'POST':\n\
    \            query = request.POST['query'].strip()\n\n            if query:\n\
    \                context_dict['result_list'] = run_query(query)\n    # End new\
    \ search functionality code.\n\n    return render(request, 'rango/category.html',\
    \ context_dict)\n```\n```\n\nWe keep the `show_category()` view the same at the\
    \ top, and add in an additional block of code towards the end to handle the processing\
    \ of a search request. If a POST request is made, we then attempt to take the\
    \ query from the request and issue the query to the `run_query()` function we\
    \ defined in the [Bing Search chapter](#). This then returns a list of results\
    \ which we put into the `context_dict` with a key of `result_list` – exactly the\
    \ variable name that is expected in the updated `category.html` template.\n\n\
    Search functionality should then all work as expected. Try it out! Navigate to\
    \ a category page, and you should see a search box. Enter a search query, submit\
    \ it, and see what happens.\n\nOnce you are satisfied, you can safely delete the\
    \ existing `search.html` template from your codebase, along with the decommissioned\
    \ `search()` view."
  merge: -1

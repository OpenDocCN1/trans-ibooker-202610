- pgno: 228
  md: '# ON THE THEORY OF CATALOGUING / CLASSIFICATION


    A catalogue is a systematic arrangement of materials in a library or information
    centre, designed to enable users to identify, locate and access resources efficiently.
    The modern catalogue has evolved from simple manuscript lists to complex digital
    databases supporting remote access and interoperability.


    # 1. PRINCIPLES OF CATALOGUING


    +   - The function of the catalogue is to state which works a library possesses
    and where they may be found.

    +   - Cataloguing rules must be applied consistently to ensure uniformity and
    predictability.

    +   - Bibliographic records should describe both the intellectual content and
    the physical carrier of the item.

    +   - Authority control ensures that names, titles and subjects are standardised.


    # 2. CLASSIFICATION SCHEMES


    | Scheme | Base | Focus | Use |

    |--------|------|-------|-----|

    | Dewey Decimal | Numeric | Knowledge by discipline | Public libraries |

    | Universal Decimal | Numeric + symbols | Faceted knowledge | Specialised libraries
    |

    | Library of Congress | Alpha-numeric | Broad knowledge classes | Academic libraries
    |


    # 3. STRUCTURAL FRAMEWORK OF CATALOGUE ENTRIES


    ![](img/75169a27287f7c945bf2cbf7dede5251_228_0.png)


    Each catalogue entry typically comprises a heading (main entry), a description
    of the item, and tracings. The heading may be a personal author, a corporate body,
    or a title. The description follows a standard order of areas: title and statement
    of responsibility, edition, publication, physical description, series and notes.


    # 4. MAINTENANCE AND PRESERVATION


    Catalogues require continuous maintenance to reflect acquisitions, withdrawals
    and corrections. Preservation of the catalogue itself is fundamental to sustained
    access. In digital environments this includes backups, data migration and format
    migration to guard against technological obsolescence.


    # 5. CONCLUSION


    The theoretical foundations of cataloguing and classification remain central to
    the organisation of knowledge. A robust catalogue not only provides physical access
    but also intellectual access to the world''s recorded knowledge.'
  merge: -1
  img_proc: true

- pgno: 181
  md: "# 9.10 Tidying up the `base.html` Hyperlinks\n\nNow that all the machinery\
    \ for logging a user out has been completed, we can add some finishing touches.\
    \ Providing a link to log out as we did above is good, but is it smart? If a user\
    \ is not logged in, what would the point be of providing a link to logout? Conversely,\
    \ if a user is already logged in, would it be sensible to provide a link to login?\
    \ Perhaps not – you can make the argument that the links presented to the user\
    \ in `base.html` should change *depending on their circumstances*. We need to\
    \ do some more work to make sure our Rango app satisfies the requirements we set\
    \ off with.\n\nLet’s modify the links in the `base.html` template. We will employ\
    \ the `user` object in the template’s context to determine what links we want\
    \ to show to a particular user. Find your growing list of links at the bottom\
    \ of the page, and replace it with the following code. Feel free to copy and paste\
    \ things around here, because all you are doing here is adding in some conditional\
    \ statements, and moving existing links around.\n\n```\n```html\n<ul>\n{% if user.is_authenticated\
    \ %}\n    <!-- Show these links when the user is logged in -->\n    <li><a href=\"\
    {% url 'rango:restricted' %}\">Restricted Page</a></li>\n    <li><a href=\"{%\
    \ url 'rango:logout' %}\">Logout</a></li>\n{% else %}\n    <!-- Show these links\
    \ when the user is NOT logged in -->\n    <li><a href=\"{% url 'rango:register'\
    \ %}\">Sign Up</a></li>\n    <li><a href=\"{% url 'rango:login' %}\">Login</a></li>\n\
    {% endif %}\n<!-- Outside the conditional statements, ALWAYS show -->\n<li><a\
    \ href=\"{% url 'rango:add_category' %}\">Add New Category</a></li>\n<li><a href=\"\
    {% url 'rango:about' %}\">About</a></li>\n<li><a href=\"{% url 'rango:index' %}\"\
    >Index</a></li>\n</ul>\n```\n```\n\nThis markup and template code states that\
    \ when a user is authenticated and logged in, he or she can see the `Restricted\
    \ Page` and `Logout` links. If he or she isn’t logged in, `Login` and `Sign Up`\
    \ are presented. As `Add New Category`, `About` and `Index` are not within"

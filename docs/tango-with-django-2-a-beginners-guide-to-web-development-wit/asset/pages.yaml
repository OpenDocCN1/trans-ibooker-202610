    +   - `apps.py`, that provides a place for any app-specific configuration;

    +   - `models.py`, a place to store your app’s data models – where you specify
    the entities and relationships between data;

    +   - `tests.py`, where you can store a series of functions to test your implementation;

    +   - `views.py`, where you can store a series of functions that handle requests
    and return responses; and

    +   - the `migrations` directory, which stores database specific information related
    to your models.


    `views.py` and `models.py` are the two files you will use for any given app and
    form part of the main architectural design pattern employed by Django, i.e. the
    *Model-View-Template* pattern. You can check out [the official Django documentation](https://docs.djangoproject.com/en/2.1/intro/overview/)

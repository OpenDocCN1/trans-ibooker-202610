- pgno: 429
  md: 'the elements or boxes that you create, and how they are rendered in your web
    browser’s viewport. Each element or box consists of *four separate areas*, all
    of which are illustrated in the figure below. The surrounding box of an element
    can be split into three divisions, and these are (from inside to outside): the
    *padding area*, the *border area* and the *margin area*. The actual element itself
    (whether it be text or an image sits in the middle as the *content area*).


    ![](img/75169a27287f7c945bf2cbf7dede5251_429_0.png)


    An illustration demonstrating the CSS box model, complete with legend showing
    the four areas of the model.


    For each element within a webpage, you can create a margin, apply some padding
    or a border with the respective properties `margin`, `padding` and `border`. Margins
    clear a transparent area around the border of your element; meaning margins are
    incredibly useful for creating a gap between elements. In contrast, padding creates
    a gap between the content of an element and its border. This gives the impression
    that the element appears wider. If you supply a background colour for an element,
    the background colour is extended with the element’s padding. Finally, borders
    are what you might expect them to be – they provide a border around your element’s
    content and padding.


    For more information on the CSS box model, check out Mozilla’s excellent explanation
    of the model¹⁴¹. Why not even order a t-shirt with the box model on it¹⁴²?


    ¹⁴¹ https://developer.mozilla.org/en-US/docs/Learn/CSS/Introduction_to_CSS/Box_model

    ¹⁴² http://cssboxmodel.com/'
  merge: -1
  img_proc: true
- pgno: 430
  md: '# Watch out for the width!


    As you may gather from the box model illustration, the width of an element isn’t
    defined simply by the value you enter as the element’s width. Rather, you should
    always consider the width of the border and padding on both sides of your element.
    This can be represented mathematically as:


    ```

    total_width = content_width + left padding + right padding + left border

    + left margin + right margin

    ```


    Don’t forget this. You’ll save yourself a lot of trouble if you don’t!


    # Borders and Padding


    If you find yourself working with elements that have a border and/or padding,
    working out precise widths can be hard. In a scenario where the widths are crucial,
    you might want to explore the box-sizing property¹⁴³ to better control widths
    and heights. Read the linked W3CSchools article for more information. This property
    has saved us on numerous occasions!


    # Styling Lists


    Lists are everywhere. Whether you’re reading a list of learning outcomes for a
    course, or reading a list of times for the train, you know what a list looks like
    and appreciate its simplicity. If you have a list of items on a webpage, why not
    use an HTML list? Using lists within your webpages promotes good HTML document
    structure, allowing text-based browsers, screen readers and other browsers that
    do not support CSS to render your page sensibly.


    Lists however by default do not look particularly appealing to end-users. Take
    the following HTML list that we’ll be styling as we go along trying out different
    things.'
  merge: -1
  img_proc: true

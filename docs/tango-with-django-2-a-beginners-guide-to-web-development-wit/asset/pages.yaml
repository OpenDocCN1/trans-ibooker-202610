- pgno: 355
  md: '# 20. Final Thoughts


    In this tutorial, we have gone through the process of web development from specification
    to deployment. Along the way, we have shown how to use the Django framework to
    construct the necessary models, views and templates associated with a sample web
    application, *Rango*. We have also demonstrated how toolkits and services like
    Bootstrap, jQuery and PythonAnywhere can be integrated within an application.
    However, the road doesn’t stop here.


    We have only painted the broad brush strokes of a web application in this tutorial.
    As you have probably noticed, there are lots of improvements that could be made
    to Rango – and these finer details often take a lot more time to complete as you
    polish the application. By developing your application with solid foundations,
    you will be able to construct up to 80% of your site very rapidly and get a working
    demo online.


    In future versions of this book, we intend to provide some more details on various
    aspects of the framework – along with covering the basics of some of the other
    fundamental technologies associated with web development. If you have any suggestions
    or comments about how to improve the book please get in touch.


    Please report any typos, bugs, or other issues online via [Twitter](https://twitter.com/tangowithdjango),
    or submit change requests via [GitHub](https://github.com/leifos/tango_with_django_2).
    Thank you!


    # One Last Exercise


    ![](img/75169a27287f7c945bf2cbf7dede5251_355_0.png)


    There’s one last little thing that we’re sure you can now address. On Rango’s
    index page, page links currently go straight to the URL stored in the database.
    We’re not tracking these clicks! *What would you have to do to ensure when a link
    here is clicked, it’s tracked?*'
  merge: -1
  img_proc: true

    # Bad Gateway Errors


    During deployment sometimes you might receive `HTTP 502 - Bad Gateway` errors
    instead of your application. Try reloading your application again, and then waiting
    a little longer. If the problem persists, try reloading again. If the problem
    persists, check out your log files to see if any errors are occurring before contacting
    the PythonAnywhere support.


    # Setting the Secret Key


    It is wise not to commit your secret key to your git repository – and instead
    load the key in from a separate, uncommitted file. To do this, open your project’s
    `settings.py` file and either change the secret key that you are using in production
    (a hacky solution), or load it from a file, as we demonstrate with the example
    below.'

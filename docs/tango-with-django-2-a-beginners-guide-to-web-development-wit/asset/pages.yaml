    # Your Username


    Your username will vary from the one we have used to demonstrate the functionality
    of PythonAnywhere. We chose `rangodemo2020`, and you’ll see this throughout the
    screenshots and code snippets in this chapter. Simply substitute rangodemo2020
    with your username when required.


    # 19.2 The PythonAnywhere Web Interface


    The PythonAnywhere web interface contains a *dashboard* which in turn provides
    a series of different components allowing you to manage your application. The
    components as [illustrated in the figure below](#) include:


    +   - *Consoles*, allowing you to create and interact with Python and Bash console
    instances;

    +   - *Files*, which allows you to upload to and organise files within your disk
    quota; and

    +   - *Web apps*, allowing you to configure settings for your hosted web application;


    Other components exist, such as *Notebooks*, but we won’t be using them here –
    we’ll be working primarily with the *consoles* and *web app* components. The [PythonAnywhere
    Wiki](https://www.pythonanywhere.com/wiki/) provides a series of detailed explanations
    on how to use the other components if you are interested in finding out more.'

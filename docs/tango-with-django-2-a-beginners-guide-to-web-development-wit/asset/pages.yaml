  md: "# Don’t git push your Database!\n\nIf you are using Git, you might be tempted\
    \ to add and commit the database file. However, we don’t think that this is a\
    \ particularly good idea. What if you are working on your app with other people?\
    \ It would be highly likely that they will change the database as they test features.\
    \ Different versions of database files (which ultimately do not matter in development)\
    \ **will** cause endless conflicts.\n\nInstead, add `db.sqlite3` to your `.gitignore`\
    \ file so that it won’t be added when you `git commit` and `git push`. You can\
    \ also do this for other files like `*.pyc` and machine specific files. For more\
    \ information on how to set your `.gitignore` file up, you can refer to our [Git\
    \ familiarisation chapter](#) in the appendices.\n\n![](img/75169a27287f7c945bf2cbf7dede5251_75_0.png)\n\
    \n# Using other Database Engines\n\nThe Django database framework has been created\
    \ to cater for a variety of different database backends, such as [PostgreSQL](http://www.postgresql.org/)³,\
    \ [MySQL](https://www.mysql.com/)⁴ and [Microsoft’s SQL Server](https://en.wikipedia.org/wiki/Microsoft_SQL_Server)⁵.\
    \ For other database engines, other keys like `USER`, `PASSWORD`, `HOST` and `PORT`\
    \ exist for you to configure the database with Django.\n\nWhile we don’t cover\
    \ how to use other database engines in this book, there are guides online which\
    \ show you how to do this. A good starting point is the [official Django documentation](https://docs.djangoproject.com/en/2.1/ref/databases/#storage-engines)⁶.\n\
    \nNote that SQLite is sufficient for demonstrating the functionality of the Django\
    \ ORM. When you find your app has become viral and has accumulated thousands of\
    \ users, you may want to consider [switching the database backend to something\
    \ more robust](http://www.sqlite.org/whentouse.html)⁷.\n\n![](img/75169a27287f7c945bf2cbf7dede5251_75_1.png)\n\
    \n# 5.3 Creating Models\n\nWith your database configured in `settings.py`, let’s\
    \ create the two initial data models for the Rango application. Models for a Django\
    \ app are stored in the\n\n³ http://www.postgresql.org/  \n⁴ https://www.mysql.com/\
    \  \n⁵ https://en.wikipedia.org/wiki/Microsoft_SQL_Server  \n⁶ https://docs.djangoproject.com/en/2.1/ref/databases/#storage-engines\
    \  \n⁷ http://www.sqlite.org/whentouse.html"
  merge: -1
  img_proc: true
- pgno: 76
  md: "respective `models.py` module. This means that for Rango, models are stored\
    \ within `<workspace>/tango_with_django_project/rango/models.py`.\n\nFor the models\
    \ themselves, we will create two classes — one class representing each model.\
    \ Both must [inherit](https://en.wikipedia.org/wiki/Inheritance_(object-oriented_programming))\
    \ from the Model base class, `django.db.models.Model`. The two Python classes\
    \ will be the definitions for models representing *categories* and *pages*. Define\
    \ the `Category` and `Page` model as follows.\n\n```\n```python\nclass Category(models.Model):\n\
    \    name = models.CharField(max_length=128, unique=True)\n\n    def __str__(self):\n\
    \        return self.name\n\nclass Page(models.Model):\n    category = models.ForeignKey(Category,\
    \ on_delete=models.CASCADE)\n    title = models.CharField(max_length=128)\n  \
    \  url = models.URLField()\n    views = models.IntegerField(default=0)\n\n   \
    \ def __str__(self):\n        return self.title\n```\n```\n\n# ## Check import\
    \ Statements\n\nAt the top of the `models.py` module, you should see `from django.db\
    \ import models`. If you don’t see it, add it in.\n\nWhen you define a model,\
    \ you need to specify the list of fields and their associated types, along with\
    \ any required or optional parameters. By default, all models have an auto-increment\
    \ integer field called `id` which is automatically assigned and acts a primary\
    \ key.\n\nDjango provides a [comprehensive series of built-in field types](https://docs.djangoproject.com/en/2.1/ref/models/fields/#model-field-types).\
    \ Some of the most commonly used are detailed below.\n\n+   - `CharField`, a field\
    \ for storing character data (e.g. strings). Specify `max_length` to provide a\
    \ maximum number of characters that a `CharField` field can store."

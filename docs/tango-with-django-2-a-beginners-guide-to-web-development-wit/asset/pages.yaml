    # Testing the Rendered Page


    Django’s test suite also allows you to perform tests that load up your web app,
    and programmatically interact with the DOM elements on the rendered HTML pages.
    This is incredibly useful, as you can test your web app as a human would – by
    ‘clicking’ links, or entering information into form fields and submitting them.
    This is achieved with some further third-party “driver” software that controls
    interactions on a webpage for you.


    We don’t explicitly cover how to set these tests up here, but you should refer
    to the [official Django documentation](https://docs.djangoproject.com/en/2.2/topics/testing/tools/#liveservertestcase)
    to learn more and see how this is achieved.


    If you really want us to include examples of how to run tests this way, let us
    know!


    # 18.2 Examining Testing Coverage


    One further point of discussion about testing is *coverage*. Code coverage measures
    how much of your codebase has been tested. You can install an additional package
    called coverage (`$pip install coverage`) that can automatically analyse how much
    of your codebase that has been covered by tests. Once coverage is installed, run
    the following command at your terminal or Command Prompt.


    ```

    ```bash

    $ coverage run --source=''.'' manage.py test rango

    ```

    ```


    This will run through all of the tests that you have implemented so far, and collect
    coverage data for the Rango app. To see the report, you then need to type the
    following command once the first command is completed.'

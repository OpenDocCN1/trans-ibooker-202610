  md: '![](img/75169a27287f7c945bf2cbf7dede5251_84_0.png)


    # The Django admin interface, sans Rango models.


    While this looks good, we are missing the Category and Page models that were defined
    for the Rango app. To include these models, we need to let Django know that we
    want to include them.


    To do this, open the file rango/admin.py. With an include statement already present,
    modify the module so that you register each class you want to include. The example
    below registers both the Category and Page class to the admin interface.


    ```

    from django.contrib import admin

    from rango.models import Category, Page


    admin.site.register(Category)

    admin.site.register(Page)

    ```


    Adding further classes which may be created in the future is as simple as adding
    another call to the admin.site.register() method, making sure that the model is
    imported at the top of the module.'

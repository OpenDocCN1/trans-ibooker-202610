- pgno: 139
  md: '# # 8. Working with Templates


    So far, we’ve created several HTML templates for different pages within our Rango
    application. As you created each additional template, you may have noticed that
    a lot of the HTML code is repeated. Does that feel a bit strange, or wasteful?


    It should! Anytime you repeat similar code, you are violating the [DRY Principle](https://en.wikipedia.org/wiki/Don%27t_repeat_yourself)
    – which states: **DO NOT REPEAT YOURSELF!** You might have noticed that in the
    templates we have written so far, we have referred to different pages with *hard-coded*
    URL paths. This is bad practice, as paths will invariably change over time.


    Taken together, repetition and hard coding will result in a maintenance nightmare.
    If we want to make a change to the general site structure or change a URL path,
    you will have to modify *all* the templates which contain either the structure
    we want to change – or the URL. This might be tractable if your site has a few
    pages. However, what if your site had hundreds of pages? How long would it take
    to update everything? How likely would it be that you will make a mistake somewhere?


    Luckily for us, the Django developers have already thought about how to solve
    such problems and provided solutions. In this chapter, we will use *template inheritance*
    to overcome the first problem, and the *URL template tag* to solve the second
    problem. We will start by addressing the latter problem first.


    # ## 8.1 Using Relative URLs in Templates


    So far, we have been directly coding the URL of the page or view we want to show
    within the template, i.e. `<a href="/rango/about/">About</a>`. This kind of hard
    coding of URLs means that if we change our URL mappings in `urls.py`, then we
    will have to also change all of the associated URL references in our templates.
    The preferred way is to use the template tag `url` to look up the *URL mapping
    name* in the `urls.py` modules, and dynamically insert the matching URL path.'
  merge: -1
  img_proc: true
- pgno: 140
  md: "It’s pretty simple to include relative URLs in your templates. To refer to\
    \ the *About* page, we would insert the following line into our templates:\n\n\
    ```\n<a href=\"{% url 'rango:about' %}\">About</a>\n```\n\nThe Django template\
    \ engine will look up any `urls.py` module for a URL pattern with the attribute\
    \ `name` set to `about` (`name='about'`) for the app with `app_name` set to `rango`,\
    \ and then perform a reverse lookup on the URL. This means if we change the URL\
    \ mappings in `urls.py`, we don’t need to go through each template that refer\
    \ to them.\n\nOne can also reference a URL pattern without a specified name, by\
    \ referencing the view directly as shown below.\n\n```\n<a href=\"{% url 'rango.views.about'\
    \ %}\">About</a>\n```\n\nIn this example, we must ensure that the app `rango`\
    \ has the view `about`, contained within its `views.py` module. In your app’s\
    \ `index.html` template, you will notice that you have a parameterised URL pattern\
    \ (the `show_category()` URL/view takes the `category.slug` as a parameter). To\
    \ handle this, you can pass the `url` template tag the name of the URL/view and\
    \ the slug within the template, as follows:\n\n```\n{% for category in categories\
    \ %}\n    <li>\n        <a href=\"{% url 'rango:show_category' category.slug %}\"\
    >\n            {{ category.name }}\n        </a>\n    </li>\n{% endfor %}\n```\n\
    \nBefore you run off to update all the URLs in all your templates with relative\
    \ URLs, we need to restructure and refactor our templates by using inheritance\
    \ to remove excessive repetition."
  merge: -1
  img_proc: true
- pgno: 141
  md: "# URLs and Multiple Django Apps\n\nThis book focuses on the development of\
    \ a single Django app, Rango. However, you may find yourself working on a Django\
    \ project with multiple apps being used at once. This means that you could literally\
    \ have hundreds of potential URLs with which you may need to reference. This scenario\
    \ begs the question: *how can we organise these URLs?* Two apps may have a view\
    \ of the same name, meaning a potential conflict would exist.\n\nDjango provides\
    \ the ability to *namespace* URL configuration modules² for each individual app\
    \ that you employ in your project. **As we did earlier**, adding an `app_name`\
    \ variable to your app’s `urls.py` module is enough. The example below specifies\
    \ the namespace for the Rango app to be `rango`.\n\n```\nfrom django.conf.urls\
    \ import url\nfrom rango import views\n\napp_name = 'rango'\n\nurlpatterns = [\n\
    \    path('', views.index, name='index'),\n    path('about/', views.about, name='about'),\n\
    \    path('category/<slug:category_name_slug>/add_page/', views.add_page, name='add_page'),\n\
    \    ...\n]\n```\n\nAdding an `app_name` variable means that any URL you reference\
    \ from the `rango` app is done so like:\n\n```\n<a href=\"{% url 'rango:about'\
    \ %}\">About</a>\n```\n\nwhere the colon in the `url` command separates the namespace\
    \ from the actual URL name.\n\nIf an `app_name` is not specified, you would have\
    \ to reference a URL with just the name of the mapping you want to refer to, such\
    \ as in the example shown below.\n\n```\n<a href=\"{% url 'about' %}\">About</a>\n\
    ```\n\nOf course, as we discuss above, this approach opens up the door to potential\
    \ conflicts. If in doubt, it is good practice to specify an `app_name`!"
  merge: -1
  img_proc: true
- pgno: 142
  md: '# 8.2 Dealing with Repetition


    While pretty much every professionally made website that you use will have a series
    of repeated components (such as page headers, sidebars, and footers, for example),
    repeating the HTML for each of these repeating components is not a particularly
    wise way to handle this. What if you wanted to change part of your website’s header?
    You’d need to go through every page and change each copy of the header to suit.


    Instead of spending (or wasting!) large amounts of time copying and pasting your
    HTML markup, we can minimise repetition in Rango’s codebase by employing template
    inheritance provided by Django’s template language.


    The basic approach to using inheritance in templates is as follows.


    +   1. Identify the reoccurring parts of each page that are repeated across your
    application (i.e. header bar, sidebar, footer, content pane). Sometimes, it can
    help to draw, on paper, the basic structure of your different pages to help you
    spot what components are used in common.

    +   2. In a base template, provide the skeleton structure of a basic page, along
    with any common content (i.e. the copyright notice that goes in the footer, the
    logo and title that appears in the section). Then define several blocks which
    are subject to change depending on which page the user is viewing.

    +   3. Create specific templates for your app’s pages – all of which inherit from
    the base template – and specify the contents of each block.


    # Reoccurring HTML and The Base Template


    Given the templates that we have created so far, it should be pretty obvious that
    we have been repeating a fair bit of HTML code. Below, we have abstracted away
    any page-specific details to show the skeleton structure that we have been repeating
    within each template.'
  merge: -1
  img_proc: true

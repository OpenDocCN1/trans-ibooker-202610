- pgno: 77
  md: '+   - `URLField`, much like a `CharField`, but designed for storing resource
    URLs. You may also specify a `max_length` parameter.

    +   - `IntegerField`, which stores integers.

    +   - `DateField`, which stores a Python `datetime.date` object.


    # Other Field Types


    Check out the Django documentation on model fields¹⁰ for a full listing of the
    Django field types you can use, along with details on the required and optional
    parameters that each has.


    For each field, you can specify the `unique` attribute. If set to `True`, the
    given field’s value must be unique throughout the underlying database table that
    is mapped to the associated model. For example, take a look at our `Category`
    model defined above. The field `name` has been set to unique, meaning that every
    category name must be unique. This means that you can use the field as a primary
    key.


    You can also specify additional attributes for each field, such as stating a default
    value with the syntax `default=''value''`, and whether the value for a field can
    be blank (or NULL¹¹) (`null=True`) or not (`null=False`).


    Django provides three types of fields for forging relationships between models
    in your database. These are:


    +   - `ForeignKey`, a field type that allows us to create a one-to-many relationship¹²;

    +   - `OneToOneField`, a field type that allows us to define a strict one-to-one
    relationship¹³; and

    +   - `ManyToManyField`, a field type which allows us to define a many-to-many
    relationship¹⁴.


    From our model examples above, the field `category` in model `Page` is a `ForeignKey`.
    This allows us to create a one-to-many relationship with model/table `Category`,'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'which is specified as an argument to the field’s constructor. When specifying
    the foreign key, we also need to include instructions to Django on how to handle
    the situation when the category that the page belongs to is deleted. `CASCADE`
    instructs Django to delete the pages associated with the category when the category
    is deleted. However, there are other settings which will provide Django with other
    instructions on how to handle this situation. See the [Django documentation on
    Foreign Keys](https://docs.djangoproject.com/en/2.1/ref/models/fields/#django.db.models.ForeignKey)
    for more details.


    Finally, it is good practice to implement the `__str__()` method. Without this
    method implemented it will show as `<Category: Category object>` if you were to
    `print()` the object (perhaps in the Django shell, as we discuss later in this
    chapter). This isn’t very useful when debugging or accessing the object. How do
    you know what category is being shown? When including `__str__()` as defined above,
    you will see `<Category: Python>` (as an example) for the Python category. It
    is also helpful when we go to use the admin interface later because Django will
    display the string representation of the object, derived from `__str__()`.


    ![](img/75169a27287f7c945bf2cbf7dede5251_78_0.png)


    # Always Implement `__str__()` in your Classes


    Implementing the `__str__()` method in your classes will make debugging so much
    easier—and also permit you to take advantage of other built-in features of Django
    (such as the admin interface). If you’ve used a programming language like Java,
    `__str__()` is the Python equivalent of the `toString()` method!


    # 5.4 Creating and Migrating the Database


    With our models defined in `models.py`, we can now let Django work its magic and
    create the tables in the underlying database. Django provides what is called a
    [migration tool](https://en.wikipedia.org/wiki/Data_migration) to help us set
    up and update the database to reflect any changes to your models. For example,
    if you were to add a new field, then you can use the migration tools to update
    the database.'

    # Installing Additional Software with MacPorts


    MacPorts provides an extensive, preconfigured library of open-source software
    suited specifically for development environments. When you need something new,
    it’s a cinch to install. **For example**, you want to install the *LaTeX* typesetting
    system, search [the MacPorts ports list](https://www.macports.org/ports.php) —
    the resultant package name being `texlive-latex`. This could then be installed
    with the command `$ sudo port install texlive-latex`. All software that LaTeX
    is dependent upon is also installed. This saves you significant amounts of time
    trying to find all the right bits of software to make things work.


    To view the packages MacPorts has already installed on your system, issue the
    command `$ port list installed`. You will see python37 listed!


    # Linux Distributions


    There are many different ways in which you can download, install and run an updated
    version of Python on your Linux distribution. Unfortunately, methodologies vary
    from distribution to distribution. To compound this, almost all distributions
    of Linux don’t have a precompiled version of Python 3.7 ready for you to download
    and start using (at the time of writing), although the latest release of Ubuntu
    uses Python 3.6 (which is sufficient).


    If you do choose to install a new version of Python, we’ve put together a series
    of steps that you can follow. These will allow you to install Python 3.7.2 from
    scratch.'
  merge: -1
  img_proc: true

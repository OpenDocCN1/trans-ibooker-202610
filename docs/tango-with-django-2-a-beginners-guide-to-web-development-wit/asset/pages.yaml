  md: '![](img/75169a27287f7c945bf2cbf7dede5251_235_0.png)


    # Creating a free Bing Search API resource in the Microsoft Azure web application.


    You’ll then need to wait for the resource to be created – this will take a few
    minutes. After it has been created, you should see a screen confirming that your
    new resource has been created. On that screen, click the Go to resource button.



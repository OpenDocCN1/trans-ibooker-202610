  md: "command `pip3`. If these don’t work, you have a setup issue – refer to our\
    \ [pip setup guide](#) for help.\n\nWith your virtual environment switched on,\
    \ execute the following two commands to install Django and Pillow.\n\n```\n```bash\n\
    $ pip install django==2.1.5\n$ pip install pillow==5.4.1\n```\n```\n\nInstalling\
    \ these two packages will be sufficient to get you started. As you work through\
    \ the tutorial, there will be a couple more packages that we will require. We’ll\

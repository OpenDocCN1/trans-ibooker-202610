- pgno: 58
  md: '# ## 4.2 Serving Static Media Files


    While you’ve got templates working, your Rango app is admittedly looking a bit
    plain right now – there’s no styling or imagery. We can add references to other
    files in our HTML template such as *Cascading Style Sheets (CSS)*⁸, *JavaScript*⁹
    and images to improve the presentation. These are called *static files*, because
    they are not generated dynamically by a web server; they are simply sent as is
    to a client’s web browser. This section shows you how to set Django up to serve
    static files, and shows you how to include an image within your simple template.


    # ### Configuring the Static Media Directory


    To start, you will need to set up a directory in which static media files are
    stored. In your project directory (e.g. `<workspace>/tango_with_django_project/`),
    create a new directory called `static` and a new directory called `images` inside
    `static`. Check that the new static directory is at the same level as the templates
    directory you created earlier in this chapter.


    Next, place an image inside the `images` directory. As shown in below, we chose
    a picture of [the chameleon Rango](https://www.imdb.com/title/tt1192628/)¹⁰ —
    a fitting mascot, if ever there was one.


    > ⁸ http://en.wikipedia.org/wiki/Cascading_Style_Sheets

    > ⁹ https://en.wikipedia.org/wiki/JavaScript

    > ¹⁰ http://www.imdb.com/title/tt1192628/'

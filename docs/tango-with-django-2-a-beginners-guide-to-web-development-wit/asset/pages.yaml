- pgno: 261
  md: "# Restricting Access to Search Functionality\n\nOur final requirement was to\
    \ restrict the migrated search functionality only to those who are logged into\
    \ Rango. This step is straightforward – one can simply wrap the search-handling\
    \ template code added to `category.html` with a conditional template check to\
    \ determine if the user is authenticated.\n\n```\n```django\n{% if user.is_authenticated\
    \ %}\n<div>\n    ....\n</div>\n{% endif %}\n```\n```\n\nToo easy! You could also\
    \ go further and add checks within the `show_category()` view to ensure the search\
    \ functionality part is not executed when the current user is not logged in. Be\
    \ wary, though – don’t be inclined to add the `login_required()` decorator to\
    \ the view. Doing so will restrict all category-viewing functionality to logged\
    \ in users only – you only want to restrict the *search* functionality!\n\n# Query\
    \ Box Exercise\n\nAt the end of the Bing Search API chapter, we set an exercise.\
    \ We noted that in its current state, users would issue a query and then be presented\
    \ with the results. However, the query box would then be blanked again – thus\
    \ making *query reformulation* more taxing.\n\nIn our code examples above, we’ve\
    \ deliberately kept our model solution to this particular exercise out. How could\
    \ you allow the results page to ‘*remember*’ the query that was entered, and place\
    \ it back in the search box?\n\nThe easiest solution to this problem would be\
    \ to simply place the query variable into the `context_dict` of `show_category()`,\
    \ and then make use of the variable within the `category.html` template by specifying\
    \ its value as the value attribute for the search box `<input>` element.\n\nIn\
    \ Rango’s `show_category()` view, locate the code block that deals with the search\
    \ functionality, and add the query to the `context_dict`, like so."

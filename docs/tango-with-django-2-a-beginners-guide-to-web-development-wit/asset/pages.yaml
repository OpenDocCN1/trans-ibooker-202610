  md: '# ## 🔑 Classes and Helper Methods


    You may find that when you’re implementing your class-based views that you are
    repeating yourself. For instance, in the `show_category()` function-based view,
    we have some reasonably extensive code that deals with populating a dictionary
    for use as the context dictionary when we pass it to `render()`. This code is

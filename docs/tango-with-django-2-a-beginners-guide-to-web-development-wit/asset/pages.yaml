  md: '# Entering Personal Information


    ![](img/75169a27287f7c945bf2cbf7dede5251_234_0.png)


    At this stage, you may be redirected to a page where you have to supply details
    such as your address and payment card. Microsoft says that this information is
    required to ensure that spammers and bots do not infiltrate their services – and
    rest assured, if you need to provide payment details, no money will be taken from
    your bank account unless you specifically authorise it. We will be using the free
    Bing Search API allowance, so no money will need to be transferred. If you do
    need to provide this information, you’ll need to head back to the portal and look
    for the Bing Search v7 option once more.


    You’ll then be greeted with a page similar to the one below. Here, you need to
    provide a name for your Bing Search service – something like `rango_bing_search`
    will do the job nicely. Ensure that you select `Free Trial` for the subscription,
    and pricing tier `F0` or `F1` (allowing 1000 free requests per month). Selecting
    these options will ensure that you will not be charged for access to the API.
    You’ll also need to make a new group – we made one called `rango`. The resource
    location doesn’t matter as we won’t be worrying about things like response times
    and the like. Once you are happy, click Create at the bottom of the page.'

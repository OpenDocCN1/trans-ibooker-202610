- pgno: 172
  md: "# Creating the login() View\n\nFirst, open up Rango's views module at rango/views.py\
    \ and create a new view called user_login(). This view will handle the processing\
    \ of data from our subsequent login form, and attempt to log a user in with the\
    \ given details.\n\n```\ndef user_login(request):\n    # If the request is a HTTP\
    \ POST, try to pull out the relevant information.\n    if request.method == 'POST':\n\
    \        # Gather the username and password provided by the user.\n        # This\
    \ information is obtained from the login form.\n        # We use request.POST.get('<variable>')\
    \ as opposed\n        # to request.POST['<variable>'], because the\n        #\

  md: '# 7. Forms


    As part of the Rango application, we will want to capture new categories and new
    pages from users. In this chapter, we will run through how to capture data through
    web forms. Django comes with some excellent form handling functionality, making
    it a pretty straightforward process to collect information from users and save
    it to the database via the models. According to Django’s documentation on forms¹,
    the form handling functionality allows you to:


    +   1. display an HTML form with automatically generated *form widgets* (like
    a text field or date picker);

    +   2. check submitted data against a set of validation rules;

    +   3. redisplay a form in case of validation errors; and

    +   4. convert submitted form data to the relevant Python data types.


    One of the major advantages of using Django’s forms functionality is that it can
    save you a lot of time and hassle creating the HTML forms.


    # 7.1 Basic Workflow


    The basic steps involved in creating a form and handling user input is as follows.


    +   1. If you haven’t already got one, create a `forms.py` module within your
    Django app’s directory (`rango`) to store form-related classes.

    +   2. Create a `ModelForm` class for each model that you wish to represent as
    a form.

    +   3. Customise the forms as you desire.

    +   4. Create or update a view to handle the form...

    +      - including *displaying* the form,

    +      - *saving* the form data, and'
  merge: -1
  img_proc: true
- pgno: 121
  md: '+   • *flagging up errors* which may occur when the user enters incorrect data
    (or no data at all) in the form.

    +   5. Create or update a template to display the form.

    +   6. Add a `urlpattern` to map to the new view (if you created a new one).


    This workflow is a bit more complicated than those we have previously seen, and
    the views that we have to construct are lot more complex, too. However, once you
    undertake the process a few times, it will become clearer how everything pieces
    together. Trust us.


    # 7.2 Page and Category Forms


    Here, we will implement the necessary infrastructure that will allow users to
    add categories and pages to the database via forms.


    First, create a file called `forms.py` within the `rango` application directory.
    While this step is not necessary (you could put the forms in the `models.py`),
    this makes your codebase tidier and easier to work with.


    # Creating ModelForm Classes


    Within Rango’s `forms.py` module, we will be creating several classes that inherit
    from Django’s `ModelForm`. In essence, a `ModelForm` is a *helper* class that
    allows you to create a Django Form from a pre-existing model. As we’ve already
    got two models defined for Rango (`Category` and `Page`), we’ll create ModelForms
    for both.


    In `rango/forms.py` add the following code.'

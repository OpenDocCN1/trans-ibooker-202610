    the views and likes fields in each form. Note that we have set the widget to be
    hidden with the parameter setting `widget=forms.HiddenInput()`, and then set the
    value to zero with `initial=0`. This is one way to set the field to zero by default.
    Since the fields will be hidden, the user won’t be able to enter a value for these
    fields.



- pgno: 371
  md: '# # Multiple Python Versions


    If you have multiple versions of Python installed, you can choose what version
    of Python to use when you create a virtual environment. If you have installations
    for python (which launches 2.7.15) and python3 (which launches 3.7.2), you can
    issue the following command to create a Python 3 virtual environment.


    ```

    ```shell

    $ mkvirtualenv -p python3 someenv

    $ python

    $ python 3.7.2

    >>>

    ```

    ```


    Note that when you enable your virtual environment, the command you enter to start
    Python is simply python. The same is applied for pip – if you launch pip3 outside
    a virtual environment, pip will be the command you use inside the virtual environment.


    # ## Using pip


    The Python package manager is very straightforward to use and allows you to keep
    track of the various Python packages (software) that you have installed. We highly
    recommend that you use pip alongside a virtual environment, as packages installed
    using pip appear only within the said virtual environment.


    When you find a package that you want to install, the command required is `$ pip
    install <packagename>==<version>`. Note that the version component is optional;
    omitting the version of a particular package will mean that the latest available
    version is installed.


    You can find the name of a package by examining the [PyPi package index](https://pypi.org/)⁵⁹,
    from which pip downloads software. Simply search or browse the index to find what
    you are looking for. Once you know the package’s name, you can issue the installation
    command in your Terminal or Command Prompt.


    pip is also super useful for listing packages that are installed in your environment.


    > ⁵⁹ https://pypi.org/'
  merge: -1
  img_proc: true

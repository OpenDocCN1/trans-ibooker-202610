  md: "times the user has visited the Rango app, and the other to track the last time\
    \ they accessed the site. Keeping track of the date and time of the last access\
    \ will allow us to only increment the site counter once per day (for example)\
    \ and thus avoid people spamming the site to increment the counter.\n\nThe sensible\
    \ place to assume where a user enters the Rango site is at the index page. Open\
    \ Rango’s views.py file. Let’s first make a function – given a handle to both\
    \ the request and response objects – to handle cookies (visitor_cookie_handler()).\
    \ We can then make use of this function in Rango’s index() view. In views.py,\
    \ add in the following function. Note that it is not technically a view, because\
    \ it does not return a response object – it is just a helper function¹².\n\n```\n\
    def visitor_cookie_handler(request, response):\n    # Get the number of visits\
    \ to the site.\n    # We use the COOKIES.get() function to obtain the visits cookie.\n\
    \    # If the cookie exists, the value returned is casted to an integer.\n   \
    \ # If the cookie doesn't exist, then the default value of 1 is used.\n    visits\
    \ = int(request.COOKIES.get('visits', '1'))\n\n    last_visit_cookie = request.COOKIES.get('last_visit',\
    \ str(datetime.now()))\n    last_visit_time = datetime.strptime(last_visit_cookie[:-7],\n\
    \        '%Y-%m-%d %H:%M:%S')\n\n    # If it's been more than a day since the\
    \ last visit...\n    if (datetime.now() - last_visit_time).days > 0:\n       \
    \ visits = visits + 1\n        # Update the last visit cookie now that we have\
    \ updated the count\n        response.set_cookie('last_visit', str(datetime.now()))\n\
    \    else:\n        # Set the last visit cookie\n        response.set_cookie('last_visit',\
    \ last_visit_cookie)\n\n    # Update/set the visits cookie\n    response.set_cookie('visits',\
    \ visits)\n```\n\nThis helper function takes the request and response objects\
    \ – because we want to be able to access the incoming cookies from the request,\
    \ and add or update cookies in the response. In the function, you can see that\
    \ we call the request.COOKIES.get() function, which is a further helper function\
    \ provided by Django. If the cookie exists,"

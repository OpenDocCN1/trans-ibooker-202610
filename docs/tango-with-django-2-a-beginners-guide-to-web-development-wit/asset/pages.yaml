    # ## Search Box Exercise


    You may have noticed that when you issue a query, the query disappears when the
    results are shown. This is not very user-friendly, because research has shown
    that people like to *reformulate their queries* (or in different words, *tweak
    their original query*). Your exercise here is to figure out how to update the
    view and template so that the user’s query is displayed within the search box
    when results are returned.'

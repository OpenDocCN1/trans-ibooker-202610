    \ view.\n\n# 15.4 Class-Based Views\n\nWhat is a class-based view, though? What\
    \ *exactly* have we made implement up in the example solution above? Class-based\
    \ views are a more sophisticated and elegant mechanism for handling requests.\
    \ Rather than taking a functional approach as we have done so far in this tutorial—that\
    \ is creating *functions* in Rango’s `views.py` module to serve requests—the class-based\
    \ approach means creating classes that inherit and implement a series of methods\
    \ to handle your app’s requests.\n\nFor example, rather than checking if a request\
    \ was an HTTP GET or an HTTP POST request, class-based viewed allow you to implement\
    \ a `get()` and `post()` method within the class handling your request for a given\
    \ view. When your project and handlers become more complex, using a class-based\
    \ approach is the more preferable solution. You can look at the [Django Documentation\
    \ for more information about class-based views](https://docs.djangoproject.com/en/2.1/topics/class-based-views/)."

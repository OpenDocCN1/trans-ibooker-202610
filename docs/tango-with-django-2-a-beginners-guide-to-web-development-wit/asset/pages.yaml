  md: 'can occur with this setup. [Earlier in the book](#), we discussed a scenario
    of two pieces of software requiring two different versions of the *same dependency*.
    This presents a headache; you cannot typically install two different versions
    of the same software into your Python environment!


    The solution to this is to use a *virtual environment*. Using a virtual environment,
    each different piece of software that you wish to run can be given its environment,
    and by definition, its set of installed dependencies. If you have `ProjectA` requiring
    Django 1.11 and `ProjectB` requiring Django 2.1, you could create a virtual environment
    for each with their packages installed.


    The five basic commands one would use to manipulate virtual environments are listed
    below.


    +   - `mkvirtualenv <name>` creates and activates a new virtual environment of
    name `<name>`.

    +   - `workon <name>` switches on a virtual environment of name `<name>`.

    +   - `deactivate` switches off a virtual environment you are currently using.

    +   - `rmvirtualenv <name>` deletes a virtual environment of name `<name>`.

    +   - `lsvirtualenv` lists all user-created virtual environments.


    Following the examples above, we can then create an environment for each, installing
    the required software in the relevant environment. For `ProjectA`, the environment
    is called `projAENV`, with `projBENV` used for `ProjectB`. Note that to install
    software to the respective environments we use `pip`. The commands used for pip
    [are discussed below](#).'
  merge: -1
  img_proc: true
- pgno: 369
  md: '```

    ```bash

    $ mkvirtualenv projAENV

    (projAENV) $ pip install Django==1.11

    (projAENV) $ pip freeze

    Django==1.11


    (projAENV) $ deactivate

    $ pip

    <Command not found>


    $ workon projAENV

    (projAENV) $ pip freeze

    Django==1.11


    (projAENV) $ cd ProjectA/

    (projAENV) $ python manage.py runserver

    ...


    (projAENV) $ deactivate

    $

    ```

    ```


    The code blocks above create the new virtual environment, `projAENV`. We then
    install Django 1.11 to that virtual environment, before issuing `pip freeze` to
    list the installed packages – confirming that Django was installed. We then deactivate
    the virtual environment. `pip` then cannot be found as we are no longer in the
    virtual environment! By switching the virtual environment back on with `workon`,
    our Django package can once again be found. The final two commands launch the
    Django development server for `ProjectA`.


    We can then create a secondary virtual environment, `projBENV`.'

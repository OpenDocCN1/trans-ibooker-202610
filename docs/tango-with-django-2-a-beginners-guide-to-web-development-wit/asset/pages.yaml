- pgno: 288
  md: '# # 16. JQuery Crash Course


    So far in this tutorial, we have focused primarily on *server-side* coding. In
    other words, a lot of our energy has been spent on figuring out the mechanics
    of writing Python code to make Django do things *on the server*. We’ve also been
    writing HTML markup (and used the Twitter Bootstrap toolkit) for use on the *client-side*,
    or your web browser.


    However, did you know you can do so much more on the client-side? You can use
    JavaScript¹ to add functionality to your web application on the client-side, from
    changing the way things are presented to obtaining additional information from
    the server *without* having to reload the entire webpage.


    In this chapter, we’ll be introducing you to the basics of JavaScript while using
    the JQuery² framework. JQuery makes writing JavaScript code easier – and much
    more enjoyable! A few lines of JQuery can encapsulate hundreds of lines of pure
    JavaScript. JQuery also provides a suite of APIs that are mainly focused on manipulating
    HTML elements. We’ll be looking at:


    +   - how to incorporate JQuery within Rango;

    +   - explaining how to interpret basic JQuery code; and

    +   - providing several small examples to show you how everything works.


    # ## 16.1 Including JQuery


    To include JQuery (or any other JavaScript file), you need to tell the *client*
    where to find JQuery. At the end of the day, the web browser will be the part
    of the chain that utilises the JavaScript code to provide additional functionality
    to the user. Thinking about Rango, how can we do this? We will need to modify
    your *templates*, as when'
  merge: -1
  img_proc: true

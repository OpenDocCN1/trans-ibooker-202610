- pgno: 22
  md: '# 2. Getting Ready to Tango


    Before we start coding, it’s really important that we set your development environment
    up correctly so that you can *Tango with Django* with ease. You’ll need to make
    sure that you have all of the necessary components installed on your computer,
    and that they are configured correctly. This chapter outlines the six key components
    you’ll need to be aware of, setup and use. These are:


    +   - the [terminal](https://en.wikipedia.org/wiki/Terminal_emulator) (on macOS
    or UNIX/Linux systems), or the [Command Prompt](https://en.wikipedia.org/wiki/Cmd.exe)
    (on Windows);

    +   - *Python 3*, including how to code and run Python scripts;

    +   - the Python Package Manager *pip*;

    +   - *Virtual Environments*;

    +   - your *Integrated Development Environment (IDE)*, if you choose to use one;
    and

    +   - a *Version Control System (VCS)* called *Git*.


    We also touch on the merits of *unit testing*, discussing how being able to test
    your implementation at different points can help keep you on track.


    If you already have Python 3 and Django 2 installed on your computer and are familiar
    with the technologies listed above, you can skip straight ahead to the [Django
    Basics chapter](#). If you are not familiar with some or all of the technologies
    listed, we provide an overview of each below. These go hand in hand with later
    [supplementary chapter](#) that provides a series of pointers on how to set the
    different components up, if you need help doing so.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# You Development Environment is Important!


    Setting up your development environment can be a tedious and frustrating process.
    It’s not something that you would do every day. The pointers we provide in this
    chapter (and the [additional supplementary chapter](#)) will help you in getting
    everything to a working state. The effort you expend now in making sure everything
    works will ensure that development can proceed unhindered, without you needing
    to go back and patch things up.


    From experience, we can also say with confidence that as you set your environment
    up, it’s a good idea to note down the steps that you took. You will probably need
    that workflow again one day – maybe you will purchase a new computer, or be asked
    to help a friend set their environment up, too. *Don’t think short-term, think
    long-term!*


    # 2.1 Python 3


    To work with Tango with Django, we require you to have installed on your computer
    a copy of the *Python 3* programming language. A Python version of 3.5 or greater
    should work fine with Django 2.0, 2.1 and 2.2 – although the official Django website
    recommends that you have the most recent version of Python installed. As such,
    we recommend you install *Python 3.7*. At the time of writing, the most recent
    release is *Python 3.7.2*. If you’re not sure how to install Python and would
    like some assistance, have a look at [our quick guide on how to install Python](#).


    # Running macOS, Linux or UNIX?


    On installations of macOS, Linux or UNIX, you will find that Python is already
    installed on your computer – albeit a much older version, typically 2.x. This
    version is required by your operating system to perform essential tasks such as
    downloading and installing updates. While you can use this version, it won’t be
    compatible with Django 2, and you’ll need to install a newer version of Python
    to run *side-by-side* with the old installation. *Do not uninstall or hack away
    at deleting Python 2.x* if it is already present on your system; you may break
    your operating system!'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Django 2.0, 2.1 or 2.2?


    In this book, we explicitly use Django version 2.1.5. However, we have also tested
    the instructions provided with versions 2.0.13, 2.1.10, and 2.2.3. Therefore,
    you will be able to use version 2.2 if you wish! If you do use a different version,
    substitute 2.1.5 with the version you are using.


    We’ll be regularly checking the compatibility of the instructions provided with
    future Django releases. If you notice any issues with later versions, feel free
    to get in touch with us. You can [send us a tweet](https://twitter.com/tangowithdjango),
    [raise an issue on GitHub](https://github.com/leifos/tango_with_django_2/issues),
    or e-mail us – our addresses are available on the [www.tangowithdjango.com](https://www.tangowithdjango.com)
    website.


    You must however make sure you are using *at least* Python version 3.5. Version
    3.4 and below are incompatible with these releases of Django.


    # Python Skills Rusty?


    If you haven’t used Python before – or you simply want to brush up on your skills
    – then we highly recommend that you check out and work through one or more of
    the following guides:


    +   - [The Official Python Tutorial](https://docs.python.org/3/tutorial/);

    +   - [Think Python: How to Think like a Computer Scientist](https://greenteapress.com/wp/think-python-2e/)
    by Allen B. Downey; or

    +   - [Learn Python in 10 Minutes](https://www.stavros.io/tutorials/python/) by
    Stavros;

    +   - [Learn to Program](https://www.coursera.org/course/programming1) by Jennifer
    Campbell and Paul Gries.


    These guides will help you familiarise yourself with the basics of Python so you
    can start developing with Django. Note you don’t need to be an expert in Python
    to work with Django – Python is straightforward to use, and you can pick it up
    as you go, especially if you already know the ins and outs of at least one other
    programming language.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# ## 2.2 Virtual Environments


    With a working installation of Python 3 (and the basic programming skills to go
    with it), we can now setup our environment for the Django project (called Rango)
    we’ll be creating in this tutorial. One super useful tool we *strongly encourage*
    you to use is a virtual environment. Although not strictly necessary, it provides
    a useful separation between your computer’s Python installation and the environment
    you’ll be using to develop Rango with.


    A virtual environment allows for multiple installations of Python packages to
    exist in harmony, within unique *Python environments*. Why is this useful? Say
    you have a project, `projectA` that you want to run in Django 1.11, and a further
    project, `projectB` written for Django 2.1. This presents a problem as you would
    normally only be able to install one version of the required software at a time.
    By creating virtual environments for each project, you can then install the respective
    versions of Django (and any other required Python software) within each unique
    environment. This ensures that the software installed in one environment does
    not tamper with the software installed on another.


    You’ll want to create a virtual environment using Python 3 for your Rango development
    environment. Call the environment `rangoenv`. If you are unsure as to how to do
    this, go to the supplementary chapter detailing [how to set up virtual environments
    before continuing](#). If you do choose to use a virtual environment, remember
    to activate the virtual environment by issuing the following command.


    ```

    ```shell

    $ workon rangoenv

    ```

    ```


    From then on, all of your prompts with the terminal or Command Prompt will precede
    with the name of your virtual environment to remind you that it is switched on.
    Check out the following example to know what we are discussing.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '```

    ```bash

    $ workon rangoenv

    (rangoenv) $ pip install django==2.1.5

    ...

    (rangoenv) $ deactivate

    $

    ```

    ```


    The penultimate line of the example above demonstrates how to switch your virtual
    environment off after you have finished with it – note the lack of `(rangoenv)`
    before the prompt. Again, [refer to the system setup chapter in the appendices
    of this book](#) for more information on how to setup and use virtual environments.


    # ## 2.3 The Python Package Manager


    Going hand in hand with virtual environments, we’ll also be making use of the
    Python package manager, *pip*, to install several different Python software packages
    – including Django – to our development environment. Specifically, we’ll need
    to install two packages: Django 2 and *Pillow*. Pillow is a Python package providing
    support for handling image files (e.g. `.jpg` and `.png` files), something we’ll
    be doing later in this tutorial.


    A package manager, whether for Python, your [operating system](#)¹⁰ or [some other
    environment](#)¹¹, is a software tool that automates the process of installing,
    upgrading, configuring and removing *packages* – that is, a package of software
    which you can use on your computer that provides some functionality. This is opposed
    to downloading, installing and maintaining software manually.


    Maintaining Python packages is pretty painful. Most packages often have *dependencies*
    – additional packages that are required for your package to work! This can get
    very complex very quickly. A package manager handles all of this for you, along
    with issues such as conflicts regarding different versions of a package. Luckily,
    *pip* handles all this for you.


    Try and run the command `$ pip` to execute the package manager. Make sure you
    do this with your virtual environment activated. Globally, you may have to use
    the


    ¹⁰ https://en.wikipedia.org/wiki/Advanced_Packaging_Tool

    ¹¹ https://docs.npmjs.com/cli/install'
  merge: -1
  img_proc: true

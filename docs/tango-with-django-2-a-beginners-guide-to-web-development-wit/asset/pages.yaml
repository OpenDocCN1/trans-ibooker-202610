- pgno: 388
  md: '# How to Clone a Remote Repository


    Cloning your repository is a straightforward process with the `git clone` command.
    Supplement this command with the URL of your remote repository — and if required,
    authentication details, too. The URL of your repository varies depending on the
    provider you use. If you are unsure of the URL to enter, it may be worth querying
    it with your search engine or asking someone in the know.


    For GitHub, try the following command, replacing the parts below as appropriate:


    ```

    ```bash

    $ git clone https://github.com/<OWNER>/<REPO_NAME> <workspace>

    ```

    ```


    where you replace


    +   - `<OWNER>` with the username of the person who owns the repository;

    +   - `<REPO_NAME>` with the name of your project’s repository; and

    +   - `<workspace>` with the name for your workspace directory. This is optional;
    leaving this option out will simply create a directory with the same name as the
    repository.


    If all is successful, you’ll see some text like the example shown below.


    ```

    ```text

    $ git clone https://github.com/maxwelld90/tango_with_django_2_code/ twd2code

    Cloning into ''twd2cc''...

    remote: Enumerating objects: 354, done.

    remote: Counting objects: 100% (354/354), done.

    remote: Compressing objects: 100% (253/253), done.

    remote: Total 354 (delta 217), reused 223 (delta 86), pack-reused 0

    Receiving objects: 100% (354/354), 1.11 MiB | 1.78 MiB/s, done.

    Resolving deltas: 100% (217/217), done.

    ```

    ```


    If the output lines end with `done`, everything should have worked. Check your
    filesystem to see if the directory has been created by running `$ ls` – is the
    directory now listed?'
  merge: -1
  img_proc: true
- pgno: 389
  md: '# Not using GitHub?


    Many websites provide Git repositories – some free, some paid. While this chapter
    uses GitHub, you are free to use whatever service you wish. Other providers include
    Atlassian Bitbucket⁹⁵ and Unfuddle⁹⁶. You will have to change the URL from which
    you clone your repository if you use a service other than GitHub.


    # The Directory Structure


    Once you have cloned your remote repository onto your local computer, navigate
    into the directory with your terminal, Command Prompt or GUI file browser. If
    you have cloned an empty repository the workspace directory should appear empty.
    This directory is your blank workspace with which you can begin to add your project’s
    files.


    However, the directory isn’t blank at all! On closer inspection, you will notice
    a hidden directory called `.git`. Stored within this directory are both the local
    repository and local index. **Do not alter the contents of the .git directory.**
    Doing so could damage your Git setup and break version control functionality.
    *Your newly created workspace therefore actually contains within it the local
    repository and index.*


    # Final Tweaks


    With your workspace setup, now would be a good time to make some final tweaks.
    Here, we discuss two useful features you can try which could make your life (and
    your team members’) a little bit easier.


    When using your Git repository as part of a team, any changes you make will be
    associated with the username you use to access your remote Git repository. However,

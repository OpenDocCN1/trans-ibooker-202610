- pgno: 66
  md: '# ## 4.3 Serving Media


    Static media files can be considered files that don’t change and are essential
    to your application. However, often you will have to store *media files* which
    are dynamic. These files can be uploaded by your users or administrators, and
    so they may change. As an example, a media file would be a user’s profile picture.
    If you run an e-commerce website, a series of media files would be used as images
    for the different products that your online shop has.


    To serve media files successfully, we need to update the Django project’s settings.
    This section details what you need to add – [but we won’t be fully testing it
    out until later](#) where we implement the functionality for users to upload profile
    pictures.


    # ### Serving Media Files


    ![](img/75169a27287f7c945bf2cbf7dede5251_66_0.png)


    Like serving static content, Django provides the ability to serve media files
    in your development environment. This allows you to test and make sure everything
    is working. The methods that Django uses to serve this content are highly unsuitable
    for a production environment, so you should be looking to host your app’s media
    files by some other means (through a production-grade web server like Apache).
    The [deployment chapter](#) will discuss this in more detail.


    # ## Modifying `settings.py`


    First, open your Django project’s `settings.py` module. In here, we’ll be adding
    a couple more things. Like static files, media files are uploaded to a specified
    directory on your filesystem. We need to tell Django where to store these files.


    At the top of your `settings.py` module, locate your existing `BASE_DIR`, `TEMPLATE_DIR`
    and `STATIC_DIR` variables — they should be close to the top. Underneath, add
    a further variable, `MEDIA_DIR`.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '```

    MEDIA_DIR = os.path.join(BASE_DIR, ''media'')

    ```


    This line instructs Django that media files will be uploaded to your Django project’s
    root, plus ‘/media’ – or <workspace>/tango_with_django_project/media/. As we previously
    mentioned, keeping these path variables at the top of your settings.py module
    makes it easy to change paths later on if necessary.


    Now find a blank spot in settings.py, and add two more variables. The variables
    MEDIA_ROOT and MEDIA_URL will be picked up and used by Django to set up media
    file hosting¹⁸.


    ```

    MEDIA_ROOT = MEDIA_DIR

    MEDIA_URL = ''/media/''

    ```


    # Once again, don’t Forget the Forward Slashes!


    Like the STATIC_URL variable, ensure that MEDIA_URL ends with a forward slash.
    Make sure you use something like /media/, not /media. The extra slash at the end
    ensures that the root of the URL (e.g. /media/) is separated from the filenames
    of content uploaded by your app’s users.


    The two variables tell Django where to look in your filesystem for media files
    (MEDIA_ROOT) that have been uploaded and stored, and what URL to serve them from
    (MEDIA_URL). With the configuration we defined above, a user uploading the file
    sample.pdf will, for example, be then made available on your Django development
    server through the URL http://localhost:8000/media/sample.pdf.


    When we come to working with templates later on in this book, it’ll be handy for
    us to obtain a reference to the MEDIA_URL path when we need to reference uploaded
    content. Django provides a template context processor¹⁹ that’ll make it easy for
    us to do. While we don’t strictly need this set up now, it’s a good time to add
    it in.


    To do this, find the TEMPLATES list that resides within your project’s settings.py

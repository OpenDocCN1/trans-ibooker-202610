- pgno: 359
  md: '# # Setting up your System


    This supplementary chapter provides additional setup guides that complement the
    [initial setup chapter](#). We provide setup guides for installing and configuring
    the various technologies that you will be using within Tango with Django tutorial.
    Refer to the section that is relevant to you; you do not need to work through
    all of this chapter if things are already working for you.


    ![](img/75169a27287f7c945bf2cbf7dede5251_359_0.png)


    # ## Common Guides


    This chapter provides instructions on how to set up the various technologies that
    you’ll be using throughout Tango with Django that we *believe* will work on the
    largest number of systems. However, every computer setup is different. Different
    versions of software exist, complete with subtle differences. These differences
    make providing universal setup guides a very difficult thing to do.


    If you are using this book as part of a course, you may be provided with setup
    instructions unique to your lab computers. Follow these instructions instead –
    a majority of the setup work will likely be taken care of for you already.


    However if you are working solo on your computer and you follow the instructions
    provided in this chapter without success, we recommend heading to your favourite
    search engine and entering the problem you’re having. Typically, this will involve
    copying and pasting the error message you see at whatever step you’re struggling
    at. By pasting in the message verbatim, chances are you’ll find someone who suffered
    the same issue as you – and from that point, you’ll hopefully find a solution
    to resolve your problem.


    # ## Installing Python 3 and pip


    How do you go about installing Python 3.7 on your computer? This section answers
    that question. As we [discussed previously](#), you may find that you already'
  merge: -1
  img_proc: true
- pgno: 360
  md: 'have Python installed on your computer. If you are using a Linux distribution
    or macOS, you will have it installed. Some of your operating system’s functionality
    is implemented in Python⁴⁷, hence the need for an interpreter! Unfortunately,
    most modern operating systems that come preloaded with Python use a version that
    is much older than what we require. Exceptions include Ubuntu, coming with version
    3.6.5 which should be sufficient for your needs. If you do need to install 3.7,
    we must install this version of Python *side-by-side* with the old one.


    There are many different ways in which you can install Python. We demonstrate
    here the most common approaches that you can use on Apple’s macOS, various Linux
    distributions and Windows 10. Pick the section associated with your operating
    system to proceed. Note that we favour the use of package managers⁴⁸ where appropriate
    to ensure that you have the means of maintaining and updating the software easily
    (when required).


    # Apple macOS


    The simplest way to acquire Python 3 for macOS is to download a .dmg image file
    from the official Python website⁴⁹. This will provide you with a step-by-step
    installation interface that makes setting everything up straightforward. If your
    development environment will be kept lightweight (i.e. Python only), this option
    makes sense. Simply download the installer, and Python 3 should then be available
    on your Mac’s terminal!


    However, package managers make life easier⁵⁰ when development steps up and involves
    a greater number of software tools. Installing a package manager makes it easy
    to maintain and update the software on your computer – and even to install new
    software, too. macOS does not come preinstalled with a package manager, so you
    need to download and install one yourself. If you want to go down this route,
    we’ll introduce you to *MacPorts*, a superb package manager offering a large host
    of tools⁵¹ for you to download and use. We recommend that you follow this route.
    Although more complex, the result will be a complete development environment,


    ⁴⁷http://en.wikipedia.org/wiki/Yellowdog_Updater,_Modified

    ⁴⁸https://en.wikipedia.org/wiki/Package_manager

    ⁴⁹https://www.python.org/downloads/mac-osx/

    ⁵⁰https://softwareengineering.stackexchange.com/questions/372444/why-prefer-a-package-manager-over-a-library-folder

    ⁵¹https://www.macports.org/ports.php'
  merge: -1
  img_proc: true

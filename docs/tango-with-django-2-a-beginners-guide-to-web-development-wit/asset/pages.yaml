    \ page in pages %}\n                            <li><a href=\"{{ page.url }}\"\
    >{{ page.title }}</a></li>\n                        {% endfor %}\n           \
    \         </ul>\n                    {% else %}\n                        <strong>No\
    \ pages currently in category.</strong>\n                    {% endif %}\n   \
    \         {% else %}\n                The specified category does not exist.\n\
    \            {% endif %}\n        </div>\n    </body>\n\n</html>\n```\n\nThe HTML\
    \ code example again demonstrates how we utilise the data passed to the template\
    \ via its context through the tags {{ }}. We access the category and pages objects\

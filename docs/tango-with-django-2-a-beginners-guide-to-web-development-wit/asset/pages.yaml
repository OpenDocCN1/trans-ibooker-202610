- pgno: 19
  md: '# Take Note!


    Get into the habit of noting down any working assumptions that you make, just
    like the one-to-many relationship assumption that we assume above. You never know
    when they may come back to bite you later on! By noting them down, this means
    you can communicate it with your development team and make sure that the assumption
    is sensible, and that they are happy to proceed under such an assumption.


    With this assumption, we can produce a series of tables that describe each entity
    in more detail. The tables contain information on what fields are contained within
    each entity. We use Django `ModelField` types to define the type of each field
    (i.e. `IntegerField`, `CharField`, `URLField` or `ForeignKey`). Note that in Django
    *primary keys* are implicit such that Django adds an id to each Model, but we
    will talk more about that later in the [Models and Databases chapter].


    # Category Model Fields and Data Types


    | Field | Data Type |

    |---|---|

    | name | `CharField` |

    | views | `IntegerField` |

    | likes | `IntegerField` |


    # Page Model Fields and Data Types


    | Field | Data Type |

    |---|---|

    | category | `ForeignKey` |

    | title | `CharField` |

    | url | `URLField` |

    | views | `IntegerField` |


    We will also have a model for the User so that they can register and login. We
    have not shown it here but shall introduce it later in the book when we discuss
    user authentication. In subsequent chapters, we will see how to instantiate these
    models in Django, and how we can use the built-in ORM to interact with the database.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 1.5 Summary


    These high-level design and specifications will serve as a useful reference point
    when building our web application. While we will be focusing on using specific
    technologies, these steps are common to most database-driven websites. It’s a
    good idea to become familiar with reading and producing such specifications and
    designs so that you can communicate your designs and ideas with others. Here,
    we will be focusing on using Django and the related technologies to implement
    this specification.


    # Cut and Paste Coding


    As you progress through the tutorial, you’ll most likely be tempted to cut and
    paste the code from the book to your code editor. **However, it is better to type
    in the code.** We know that this is a hassle, but it will help you to remember
    the process and get a feel for the commands that you will be using again and again.


    Furthermore, cutting and pasting Python code is asking for trouble. Whitespace
    can end up being interpreted as spaces, tabs or a mixture of spaces and tabs.
    This will lead to all sorts of weird errors, and not necessarily indent errors.
    If you do cut and paste code be wary of this. Pay particular attention to this
    with regards to tabs and spaces – mixing these up will likely lead to a TabError.


    Most code editors will show the ‘hidden characters’, which in turn will show whether
    whitespace is either a tab or a space. If you have this option, turn it on. You
    will likely save yourself a lot of confusion.'
  merge: -1
  img_proc: true

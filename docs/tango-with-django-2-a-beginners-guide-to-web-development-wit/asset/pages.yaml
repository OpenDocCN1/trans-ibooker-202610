- pgno: 408
  md: '+   - `rel`, which allows you to specify the relationship between the HTML
    document and the resource you’re linking to (i.e., a stylesheet);

    +   - `type`, in which you should specify the [MIME type](http://en.wikipedia.org/wiki/Internet_media_type)
    for CSS; and

    +   - `href`, the attribute which you should point to the URL of the stylesheet
    you wish to include.


    With this tag added, your stylesheet should be included with your HTML page, and
    the styles within the stylesheet applied to elements within the page. You should
    be aware that CSS stylesheets are considered as a form of **static media**, meaning
    you should place them within your project’s static directory.


    # Inline CSS


    ![](img/75169a27287f7c945bf2cbf7dede5251_408_0.png)


    You can also add CSS to your HTML documents *inline*, meaning that the CSS is
    included as part of your HTML page. However, this isn’t generally advised because
    it removes the abstraction between presentational semantics (CSS) and content
    (HTML).


    # Basic CSS Selectors


    CSS selectors are used to map particular styles to particular HTML elements. In
    essence, a CSS selector is a *pattern*. Here, we cover three basic forms of CSS
    selector: *element selectors*, *id selectors* and *class selectors*. Later on
    in this chapter, we also touch on what are known as *pseudo-selectors*.


    # Element Selectors


    Taking the CSS example from the [rendering example shown above](#), we can see
    that the selector h1 matches to any `<h1>` tag. Any selector referencing a tag
    like this can be called an *element selector*. We can apply element selectors
    to any HTML element such as `<body>`, `<h1>`, `<h2>`, `<h3>`, `<p>` and `<div>`.
    These can be all styled similarly. However, using element selectors is pretty
    crude – styles are applied'
  merge: -1
  img_proc: true
- pgno: 409
  md: 'to *all* instances of a particular tag. We usually want a more fine-grained
    approach to selecting what elements we style, and this is where *id selectors*
    and *class selectors* come into play.


    # ID Selectors


    The *id selector* is used to map to a unique element on your webpage. Each element
    on your webpage can be assigned a unique id via the `id` attribute, and it is
    this identifier that CSS uses to latch styles onto your element. This type of
    selector begins with a hash symbol (#), followed directly by the identifier of
    the element you wish to match to. Check out the figure below for an example.


    ![](img/75169a27287f7c945bf2cbf7dede5251_409_0.png)


    An illustration demonstrating the use of an id selector in CSS. Note the blue
    header has an identifier which matches the CSS attribute #blue_header.


    # Class Selectors


    The alternative option is to use *class selectors*. This approach is similar to
    that of *id selectors*, with the difference that you can legitimately target multiple
    elements with the same class. If you have a group of HTML elements that you wish
    to apply the same style, use a class-based approach. The selector for using this
    method is'
  merge: -1
  img_proc: true
- pgno: 410
  md: 'to precede the name of your class with a period (.) before opening up the style
    with curly braces ({ }). Check out the figure below for an example.


    ![](img/75169a27287f7c945bf2cbf7dede5251_410_0.png)


    **An illustration demonstrating the use of a class selector in CSS. The blue headers
    employ the use of the .blue CSS style to override the red text of the h1 style.**


    # Ensure ids are Unique


    Try to use id selectors sparingly. [Ask yourself:](https://net.tutsplus.com/tutorials/html-css-techniques/the-30-css-selectors-you-must-memorize/)
    *do I need to apply an identifier to this element in order to target it?* If you
    need to apply a given set of styles to more than one element, the answer will
    always be **no**. In cases like this, you should use a class or element selector.


    # Fonts


    Due to the huge number available, using fonts has historically been a pitfall
    when it comes to web development. Picture this scenario: a web developer has installed
    and uses a particular font on his or her webpage. The font is pretty arcane –
    so the probability that the font is present on other computers is relatively small.'
  merge: -1
  img_proc: true
- pgno: 411
  md: "A user who visits the developer’s webpage subsequently sees the page rendered\
    \ incorrectly as the font is not present on their system. CSS tackles this particular\
    \ issue with the `font-family` property.\n\nThe value you specify for `font-family`\
    \ can be a *list* of possible fonts – and the first one your computer or other\
    \ device has installed is the font that is used to render the webpage. Text within\
    \ the specified HTML element subsequently has the selected font applied. The example\
    \ CSS shown below applies *Arial* if the font exists. If it doesn’t, it looks\
    \ for *Helvetica*. If that font doesn’t exist, any available **sans-serif font**\
    \ is applied.\n\n```\nh1 {\n    font-family: 'Arial', 'Helvetica', sans-serif;\n\
    }\n```\n\nIn 1996, Microsoft started the [core fonts for the web](http://en.wikipedia.org/wiki/Core_fonts_for_the_Web)\
    \ initiative to guarantee a particular set of fonts to be present on all computers.\
    \ However, you can today use pretty much any font you like – check out [Google\
    \ Fonts](http://www.google.com/fonts) for examples of fonts that you can use,\
    \ and [this W3Schools article](https://www.w3schools.com/howto/howto_google_fonts.asp)\
    \ on how to use such fonts. Always make sure you comply with licencing agreements\
    \ when using fonts!\n\n# ## Colours and Backgrounds\n\nColours are important in\
    \ defining the look and feel of your website. You can change the colour of any\
    \ element within your webpage, ranging from background colours to borders and\
    \ text. In this book, we make use of words and *hexadecimal colour codes* to choose\
    \ the colours we want. As you can see from the list of basic colours shown in\
    \ the [figure below], you can supply either a *hexadecimal* or *RGB (red-green-blue)*\
    \ value for the colour you want to use. You can also [specify words to describe\
    \ your colours](https://www.w3schools.com/colors/colors_names.asp), such as green,\
    \ yellow or blue.\n\n¹²⁵ http://en.wikipedia.org/wiki/Sans-serif\n¹²⁶ http://en.wikipedia.org/wiki/Core_fonts_for_the_Web\n\
    ¹²⁷ http://www.google.com/fonts\n¹²⁸ https://www.w3schools.com/howto/howto_google_fonts.asp\n\
    ¹²⁹ https://www.w3schools.com/colors/colors_names.asp"
  merge: -1
  img_proc: true
- pgno: 412
  md: <!-- no content -->

    # The .gitignore File


    Git also provides you with the capability to stop – or ignore – particular files
    from being added to version control. For example, you may not wish a file containing
    unique keys to access web services from being added to version control. If the
    file were to be added to the remote repository, anyone could theoretically access
    the file by cloning the repository. With Git, files can be ignored by including
    them in the .gitignore file, which resides in the root of <workspace>. When adding
    files to version control, Git parses this file. If a file that is being added
    to version control is listed within .gitignore, the file is ignored. Each line
    of .gitignore should be a separate file entry.


    Check out the following example of a .gitignore file:


    ```

    .pyc

    .DS_Store

    __pycache__/

    db.sqlite3

    *.key

    thumbs.db

    ```


    In this example .gitignore file, there are six entries – one on each line. We
    detail each of the entries below.


    +   - The first entry prompts Git to ignore any file with an extension of .pyc
    – the wildcard * denoting anything. A .pyc file is a bytecode representation of
    a Python module⁹⁷, something that Python creates for modules to speed up execution.
    These can be safely ignored when committing to version control.


    ⁹⁷https://stackoverflow.com/a/2998228'
  merge: -1
  img_proc: true
- pgno: 391
  md: '+   - The second entry, `.DS_Store`, is a hidden file created by macOS systems.
    These files contain custom attributes that you set when browsing through your
    filesystem using the Finder. Custom attributes may, for example, represent the
    position of icons, or the view that you use to show your files in a given directory.

    +   - The third entry represents any directory of the name `__pycache__`. This
    directory is new to Python 3, and is where the bytecode representation⁹⁸ of your
    modules live. Again, these directories can be safely ignored.

    +   - `db.sqlite3` is your database. Read the note below for a detailed explanation
    on why this should always be excluded from your repository.

    +   - `*.key` is the fifth entry. This represents any file with the extension
    `key`, a convention we use where files with this extension contain sensitive information
    – like keys for API authentication. These should never be committed – doing so
    would be the equivalent of publicly sharing your password!

    +   - The final entry is `thumbs.db`. Like the `.DS_Store` file created by macOS,
    this is the Windows equivalent.


    Remember, wildcards are a neat feature to use here. If you ever have a type of
    file you do not wish to commit, then just use a `*.abc` to denote any filename,
    with the extension `.abc`.


    # .gitignore – What else should I ignore?


    There are many kinds of files you could safely ignore from being committed and
    pushed to your Git repositories. Examples include temporary files, databases (that
    can easily be recreated) and operating system-specific files. Operating system-specific
    files include configurations for the appearance of the directory when viewed in
    a given file browser. Windows computers create `thumbs.db` files, while macOS
    creates `.DS_Store` files.


    ⁹⁸https://stackoverflow.com/a/16869074'
  merge: -1
  img_proc: true
- pgno: 392
  md: '# (Not) Committing your Database


    You should also take steps to ignore other binary-based files that will frequently
    change within your repository. As an example in this book, you’ll want to consider
    ignoring the database (as we demonstrate above). Why? When working in a team,
    everyone’s copy of the database is likely going to be different. Different team
    members may add sample data that will differ from others. If all team members
    were to continually push up different versions of the database, the chance of
    creating conflicts increases. This issue is also the reason why we encourage the
    development of a population script to quickly fill a new database with sample
    data! The rule of thumb here is: don’t commit a database to your project’s repository.
    Do commit the necessary infrastructure to create the database from scratch, and
    as a bonus, provide the functionality to fill this blank database with sample
    data.


    # Basic Commands and Workflow


    With your repository cloned and ready to go on your local computer, you’re ready
    to get to grips with the Git workflow. This section shows you the basic Git workflow,
    and the associated Git commands you can issue.'

    Here, the `redirect()` function is called which in turn calls the `reverse()`
    function. `reverse()` looks up URL names in your urls.py modules – in this instance,
    `rango:show_category`. If a match is found against the name provided, the complete
    URL is returned. The added complication here is that the `show_category()` view
    takes an additional parameter `category_name_slug`. By providing this value in
    a dictionary as kwargs to the `reverse()` function, it has all of the information
    it needs to formulate a complete URL. This completed URL is then used as the parameter
    to the `redirect()` method, and the response is complete!


    **Note also from the new view that when attempting to add a new page to a category
    that does not exist, we simply redirect the user back to the index page.** This
    removes the need for you to implement something to cover this scenario in your
    template. Your template needs to only focus on displaying a form.



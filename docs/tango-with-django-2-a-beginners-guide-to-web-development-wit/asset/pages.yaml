- pgno: 73
  md: '# 5. Models and Databases


    Typically, web applications require a backend to store the dynamic content that
    appears on the app’s webpages. For Rango, we need to store pages and categories
    that are created, along with other details. The most convenient way to do this
    is by employing the services of a relational database. These will likely use the
    *Structured Query Language (SQL)* to allow you to query the data store.


    However, Django provides a convenient way in which to access data stored in databases
    by using an *Object Relational Mapper (ORM)*¹. In essence, data stored within
    a database table is encapsulated via Django *models*. A model is a Python object
    that describes the database table’s data. Instead of directly working on the database
    via SQL, Django provides methods that let you manipulate the data via the corresponding
    Python model object. Any commands that you issue to the ORM are automatically
    converted to the corresponding SQL statement on your behalf.


    This chapter walks you through the basics of data management with Django and its
    ORM. You’ll find it’s incredibly easy to add, modify and delete data within your
    app’s underlying database, and see how straightforward it is to get data from
    the database to the web browsers of your users.


    # 5.1 Rango’s Requirements


    Before we get started, let’s go over the data requirements for the Rango app that
    we are developing. Full requirements for the application are provided in detail
    earlier on. Let’s look at the database requirements again here.


    +   - Rango is essentially a *web page directory* – it is a website that houses
    links to other, external websites.


    ¹ https://en.wikipedia.org/wiki/Object-relational_mapping'
  merge: -1
  img_proc: true
- pgno: 74

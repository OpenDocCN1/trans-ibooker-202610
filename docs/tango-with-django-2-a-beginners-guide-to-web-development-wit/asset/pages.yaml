- pgno: 395
  md: '# 2. Doing Some Work!


    Once your workspace has been cloned or updated with the latest changes, it’s time
    for you to get some work done! Within your workspace directory, you can take existing
    files and modify them. You can delete them too, or add new files to be version
    controlled.


    When you modify your repository in any way, you need to keep Git up-to-date of
    any changes you make – this does not take place automatically. Telling Git what
    has changed allows you to keep your local index updated. The list of files stored
    within the local index is then used to perform your next *commit*, which we’ll
    be discussing in the next step. To keep Git informed, several Git commands let
    you update the local index. Three of the commands are near identical to those
    that were discussed in the Unix Crash Course (e.g. cp, mv), save for the addition
    of a git prefix.


    +   - The first command `git add` allows you to request Git to add a particular
    file to *staging* for the next commit. For any file that you wish to include in
    version control – whether it is new or updated, you must `git add` it. The command
    is invoked by typing `git add <filename>`, where `<filename>` is the name of the
    file you wish to add to your next commit. Multiple files and directories can be
    added with the command `git add .` – **but be careful with this**¹⁰⁰.

    +   - `git mv` performs the same function as the Unix `mv` command – it moves
    files. The only difference between the two is that `git mv` updates the local
    index for you before moving the file. Specify the filename with the syntax `git
    mv <current_filename> <new_filename>`. For example, with this command, you can
    move files to a different directory within your repository. This will be reflected
    in your next commit. The command is also used to rename files – from the current
    filename to the new.

    +   - `git cp` allows you to make a copy of a file or directory while adding references
    to the new files into the local index for you. The syntax is the same as `git
    mv` above where the filename or directory name is specified thus: `git cp <current_filename>
    <copied_filename>`.

    +   - The command `git rm` adds a file or directory delete request into the local
    index. While the `git rm` command does not delete the file straight away, the
    requested'
  merge: -1
  img_proc: true
- pgno: 396
  md: 'file or directory is removed from your filesystem and the Git repository upon
    the next commit. The syntax is similar to the `git add` command, where a filename
    can be specified thus: `git rm <filename>`. Note that you can add a large number
    of requests to your local index in one go, rather than removing each file manually.
    For example, `git rm -rf media/` creates delete requests in your local index for
    the `media/` directory. The `r` switch enables Git to *recursively* remove each
    file within the `media/` directory, while `f` allows Git to *forcibly* remove
    the files. Check out the [Wikipedia page](http://en.wikipedia.org/wiki/Rm_(Unix))
    on the `rm` command for more information.


    Lots of changes between commits can make things pretty confusing. You may easily
    forget what files you’ve already instructed Git to remove, for example. Fortunately,
    you can run the `git status` command to see a list of files which have been modified
    from your current working directory but haven’t been added to the local index
    for processing. Have a look at the typical output from the command below to get
    a taste of what you can see.


    ![](img/75169a27287f7c945bf2cbf7dede5251_396_0.png)


    # Working with `.gitignore`


    If you have [set up your `.gitignore` file correctly](#), you’ll notice that files
    matching those specified within the `.gitignore` file is ignored when you `git
    add` them. This is the intended behaviour — these files are not supposed to be
    committed to version control! If you however really do need a file to be included
    that is in `.gitignore`, you can *force* Git to include it if necessary with the
    `git add -f <filename>` command.'

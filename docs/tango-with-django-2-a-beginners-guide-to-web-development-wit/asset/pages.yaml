    ```


    Now that this is all done, confirm it all works by clicking on categories and
    then pages. Go back to the category and refresh the page to see if the number
    of clicks has increased. Remember to refresh your browser; the updated count may
    not show up straight away!


    # 15.2 Searching Within a Category Page


    The main aim of Rango is to provide users of the app with a helpful directory
    of page links. At the moment, the search functionality is essentially independent
    of the categories. It would be better to integrate the search functionality within
    an actual category page.


    Let us assume that a user will first navigate to and browse their category of
    interest first. If they cannot find the page that they want, they will then be
    able to search for it. Once they examine their search results and find the page
    they are looking for, they will be able to add the page to the category they are
    browsing.


    We’ll tackle the first part of the description here – adding search functionality
    to the category page. To accomplish this, we first need to remove the [search
    functionality](#) that we added in a previous chapter. This will essentially mean
    decommissioning the current search page and associated infrastructure (including
    the view and URL mapping). After this, there are several tasks we will need to
    undertake. The subsections listed here again correspond to the five main steps
    we outlined in the previous chapter.


    ![](img/75169a27287f7c945bf2cbf7dede5251_257_0.png)


    # Don’t Delete your Code!


    When decommissioning your existing search functionality, don’t delete it. Simply
    comment things out where appropriate (such as in the `urls.py` module). You’ll
    be copying some of the code across to a new home later on, anyway.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Decommissioning Generic Search


    The first step for this exercise is to decommission the existing search functionality
    that you implemented in a previous chapter.


    +   1. First, open Rango’s `base.html` template and find the navigation bar markup
    (found at the top of the page). Locate the `<li>` element for the `Search` link
    that you added earlier on and delete it. This needs to be deleted as you''ll be
    commenting out the URL mapping shortly, meaning that a reverse URL lookup for
    `rango:search` will no longer work. Wrapping this with an HTML comment tag (`<!--
    ... -->`) won’t work either, as the Django template engine will still process
    what’s inside of it!

    +   2. Second, open Rango’s `urls.py` module and locate the URL mapping for the
    `/rango/search/` URL. Comment this line out by adding a `#` to the start of the
    line. This will prevent users from reaching the `search` URL.

    +   3. Finally, open Rango’s `views.py` module and locate the `search()` view
    you implemented previously. Again, comment out this function by prepending a `#`
    to the start of each line.


    You’ll still have the `search.html` template in Rango’s templates directory; don’t
    remove this as we will be using the contents of this template as the basis for
    integrating search functionality within the category template.


    # Migrating search.html to category.html


    As we will be wanting to provide search functionality to users who are browsing
    a category, we need to add in the search presentation functionality (e.g. displaying
    the search form and results area) to the `category.html` template. This is essentially
    a simple copy and paste job!


    Let’s split this into two main steps. First, open your decommissioned `search.html`
    template and locate the `<div>` element containing the entire search form. This
    will be the `<div>` whose child is a `<form>` element. Select and copy the `<div>`
    and its contents, then open Rango’s `category.html` file.'
  merge: -1
  img_proc: true
- pgno: 259
  md: "We now need to paste the code from `search.html` into `category.html`. As the\
    \ brief for this problem was to add the search functionality *underneath* the\
    \ list of pages in the category, find and locate the link inside the `{% block\
    \ body_block %}` to add a page. Paste the contents from `search.html` underneath\
    \ that link.\n\nYou can then go back to `search.html` and repeat the process,\
    \ this time selecting the `<div>` for displaying the results list. You can identify\
    \ this by looking for the `<div>` with Django template code that iterates through\
    \ the `result_list` list. Copy that and then move back over to `category.html`.\
    \ Now paste that in underneath the `<div>` containing the form that you previously\
    \ pasted in.\n\n# Updating the category.html Search Form\n\nNow that the markup\
    \ required has been added to `category.html`, we need to make one simple change.\
    \ Instead of submitting the contents of the search form to the `/rango/search/`\
    \ URL, we instead will simply direct submitted responses to the category URL (`/rango/category/<slug:category_name_slug>`).\
    \ This is as simple as finding the `<form>` definition in `category.html` and\
    \ changing the `action` attribute to Rango’s `show_category()` URL mapping.\n\n\
    ```\n```html\n<form class=\"form-inline\"\n      id=\"user-form\"\n      method=\"\
    post\"\n      action=\"{% url 'rango:show_category' category.slug %}\">\n```\n\
    ```\n\n# Updating the show_category() View\n\nYou should have identified that\
    \ since we are now redirecting search requests to the `show_category()` view,\
    \ we’ll need to make some changes within that view so that it can handle the processing\
    \ of the search request, as well as being able to handle the generation of a list\
    \ of pages for a given category.\n\nThis is again a relatively straightforward\
    \ process in which we update the view based upon code from our decommissioned\
    \ `search()` view. We provide the complete listing of our model `show_category()`\
    \ view below. Notice the comments denoting the start of the code we have taken\
    \ from our existing `search()` view."

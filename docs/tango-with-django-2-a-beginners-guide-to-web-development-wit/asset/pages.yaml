- pgno: 53
  md: '# Don’t hard code Paths!


    The road to hell is paved with hard-coded paths. Hard-coding paths³ is a software
    engineering anti-pattern⁴, and will make your project less portable⁵ – meaning
    that when you run it on another computer, it probably won’t work! (Or it will
    work, just with a lot of effort!)


    # Dynamic Paths


    A better solution is to make use of built-in Python functions to work out the
    path of your templates directory automatically. This way, an absolute path can
    be obtained regardless of where you place your Django project’s code. This, in
    turn, means that your project becomes more portable.


    At the top of your settings.py file, there is a variable called BASE_DIR. This
    variable stores the path to the directory in which your project’s settings.py
    module is contained. This is obtained by using the special Python __file__ attribute,
    which is set to the path of your settings module⁶. Using this as a parameter to
    os.path.abspath() guarantees the absolute path to the settings.py module. The
    call to os.path.dirname() then provides the reference to the absolute path of
    the directory containing the settings.py module. Calling os.path.dirname() again
    removes another directory layer, so that BASE_DIR then points to your project
    directory, or <workspace>/tango_with_django_project/. If you are curious, you
    can see how this works by adding the following lines to your settings.py file.


    ```

    print(__file__)

    print(os.path.dirname(__file__))

    print(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))

    ```


    Having access to the value of BASE_DIR makes it easy for you to reference other
    aspects of your Django project. Using the BASE_DIR variable, we can now create
    a new variable called TEMPLATE_DIR that will reference your new templates directory.
    We can make use of the os.path.join() function to join up multiple paths, leading


    ³http://en.wikipedia.org/wiki/Hard_coding

    ⁴http://sourcemaking.com/antipatterns

    ⁵http://en.wikipedia.org/wiki/Software_portability

    ⁶http://stackoverflow.com/a/9271479'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'to a variable definition like the example below. Make sure you put this underneath
    the definition of `BASE_DIR`!


    # Delete those Lines!


    If you included the three `print()` statements above to see what’s going on, make
    sure you remove them once you understand. Don’t just leave them lying there. They
    will clutter your settings module, and clutter the output of the Django development
    server!


    ```

    TEMPLATE_DIR = os.path.join(BASE_DIR, ''templates'')

    ```


    Here, we make use of the `os.path.join()` function to join together (or *concatenate*)
    the value of the `BASE_DIR` variable, and the string `''templates''`. Upon completion,
    this concatenation yields `<workspace>/tango_with_django_project/templates/`.
    From here, we can then use our new `TEMPLATE_DIR` variable to replace the hard-coded
    path we defined earlier in `TEMPLATES`. Update the DIRS key/value pairing to look
    like the following code snippet.


    ```

    ''DIRS'': [TEMPLATE_DIR, ]

    ```


    # Why `TEMPLATE_DIR`?


    You’ve created a new variable called `TEMPLATE_DIR` at the top of your `settings.py`
    file because it’s easier to access should you ever need to change it. For more
    complex Django projects, the DIRS list allow you to specify more than one template
    directory to draw templates from. For this book however, one location is sufficient
    to get everything working.


    # Concatenating Paths


    **When concatenating system paths together, always use `os.path.join()`.** Using
    this built-in function ensures that the correct path separators are used. On a
    UNIX operating system (or derivative of), forward slashes (`/`) would be used
    to separate directories, whereas a Windows operating system would use backward
    slashes (`\`). If you manually append slashes to paths, you may end up with path
    errors when attempting to run your code on a different operating system, thus
    reducing your project’s portability.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Adding a Template


    With your template directory and path now set up, create a file called index.html
    and place it in the templates/rango/ directory. Within this new file, add the
    following HTML markup and Django template code.


    ```

    <!DOCTYPE html>

    <html>


    <head>

    <title>Rango</title>

    </head>


    <body>

    <h1>Rango says...</h1>

    <div>

    hey there partner! <br />

    <strong>{{ boldmessage }}</strong><br />

    </div>

    <div>

    <a href="/rango/about/">About</a><br />

    </div>

    </body>


    </html>

    ```


    From this HTML code, it should be clear that a simple HTML page is going to be
    generated that greets a user with a hello world message. You might also notice
    some non-HTML in the form of {{ boldmessage }}. This is a Django template variable.
    We can set values to these variables so they are replaced with whatever we want
    when the template is rendered. We’ll get to that in a moment.


    To use this template, we need to reconfigure the index() view that we created
    earlier. Instead of dispatching a simple response, we will change the view to
    dispatch our template.


    In rango/views.py, check to see if the following import statement exists at the
    top of the file. Django should have added it for you when you created the Rango
    app. If it is not present, add it, but you should have kept it from earlier.'
  merge: -1
  img_proc: true
- pgno: 56
  md: "```\n```python\nfrom django.shortcuts import render\n```\n```\n\nYou can then\
    \ update the `index()` view function as follows. Check out the inline commentary\
    \ to see what each line does.\n\n```\n```python\ndef index(request):\n    # Construct\
    \ a dictionary to pass to the template engine as its context.\n    # Note the\
    \ key boldmessage matches to {{ boldmessage }} in the template!\n    context_dict\
    \ = {'boldmessage': 'Crunchy, creamy, cookie, candy, cupcake!'}\n\n    # Return\
    \ a rendered response to send to the client.\n    # We make use of the shortcut\
    \ function to make our lives easier.\n    # Note that the first parameter is the\
    \ template we wish to use.\n    return render(request, 'rango/index.html', context=context_dict)\n\
    ```\n```\n\nFirst, we construct a dictionary of key/value pairs that we want to\
    \ use within the template. Then, we call the `render()` helper function. This\
    \ function takes as input the user’s request, the template filename, and the context\
    \ dictionary. The `render()` function will take this data and mash it together\
    \ with the template to produce a complete HTML page that is returned with a `HttpResponse`.\
    \ This response is then returned and dispatched to the user’s web browser.\n\n\
    # What is the Template Context?\n\n![](img/75169a27287f7c945bf2cbf7dede5251_56_0.png)\n\
    \nWhen a template file is loaded with the Django templating system, a *template\
    \ context* is created. In simple terms, a template context is a Python dictionary\
    \ that maps template variable names with Python variables. In the template we\
    \ created above, we included a template variable name called `boldmessage`. In\
    \ our updated `index(request)` view example, the string `Crunchy, creamy, cookie,\
    \ candy, cupcake!` is mapped to template variable `boldmessage`. The string `Crunchy,\
    \ creamy, cookie, candy, cupcake!` therefore replaces *any* instance of `{{ boldmessage\
    \ }}` within the template.\n\nNow that you have updated the view to employ the\
    \ use of your template, start the Django development server and visit `http://127.0.0.1:8000/rango/`.\
    \ You should see your simple HTML template rendered in your browser – and it should\
    \ look just like the [example screenshot shown below](#)."

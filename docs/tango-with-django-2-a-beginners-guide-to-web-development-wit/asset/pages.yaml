  md: '# Django User Registration Applications


    It is important to note that there are several off the shelf user registration
    applications available which reduce a lot of the hassle of building your own registration
    and login forms.


    However, it’s a good idea to get a feeling for the underlying mechanics before
    using such applications. This will ensure that you have some sense of what is
    going on under the hood. *No pain, no gain.* It will also reinforce your understanding
    of working with forms, how to extend upon the User model, and how to upload media
    files.


    To provide user registration functionality, we will now work through the following
    four steps:


    +   - creating a `UserForm` and `UserProfileForm`;

    +   - adding a view to handle the creation of a new user;

    +   - creating a template that displays the `UserForm` and `UserProfileForm`;
    and

    +   - mapping a URL to the view created.


    As a final step to integrate our new registration functionality, we will also:


    +   - link the index page to the register page.


    # Creating the UserForm and UserProfileForm


    In `rango/forms.py`, we need to create two classes inheriting from `forms.ModelForm`.
    We’ll be creating one for the base User class, as well as one for the new UserProfile
    model that we just created. The two `ModelForm`-inheriting classes allow us to
    display a HTML form displaying the necessary form fields for a particular model,
    taking away a significant amount of work for us.


    In `rango/forms.py`, let’s create our two classes which inherit from `forms.ModelForm`.
    Add the following code to the module.'

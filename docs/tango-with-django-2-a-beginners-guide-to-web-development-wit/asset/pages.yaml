  md: '# ## 10.7 Browser-Length and Persistent Sessions


    When using cookies, you can use Django’s session framework to set cookies as either
    *browser-length sessions* or *persistent sessions*. As the names of the two types
    of sessions may suggest to you,


    +   - **browser-length** sessions expire when the user closes his or her browser;
    and

    +   - **persistent sessions** can last over several browser instances – expiring
    at a time of your choice. This could be half an hour, or even as far as a month
    in the future.


    By default, browser-length sessions are disabled. You can enable them by modifying
    your Django project’s `settings.py` module. Add the new, boolean variable `SESSION_EXPIRE_AT_BROWSER_CLOSE`,
    setting it to `True`.


    Alternatively, persistent sessions are enabled by default, with the settings variable
    `SESSION_EXPIRE_AT_BROWSER_CLOSE` either set to `False`, or not being present
    in your project’s `settings.py` file (defaulting to `False`). Persistent sessions
    have an additional setting, `SESSION_COOKIE_AGE`, which allows you to specify
    how long the cookie can live for. This value should be an integer, representing
    the number of seconds the cookie can live for. For example, specifying a value
    of 1209600 will mean your website’s cookies expire after a two week (14 day) period.


    Check out the available settings you can use on the [official Django documentation
    on cookies](https://docs.djangoproject.com/en/2.1/ref/settings/#session-cookie-age)
    for more details. You can also check out [Eli Bendersky’s blog](http://eli.thegreenplace.net/2011/06/24/django-sessions-part-i-cookies/)
    for an excellent tutorial on cookies and Django.


    # ## 10.8 Clearing the Sessions Database


    Sessions accumulate easily, and the data store that contains session information
    does too. If you are using the database backend for Django sessions, you will
    have to periodically clear the database that stores the cookies. This can be done
    using


    ```

    `$ python manage.py clearsessions`

    ```


    The [Django documentation](https://docs.djangoproject.com/en/2.1/topics/http/sessions/#clearing-the-session-store)
    suggests running'

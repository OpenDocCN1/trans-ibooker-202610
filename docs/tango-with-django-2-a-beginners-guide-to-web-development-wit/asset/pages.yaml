  md: "+   2. Take the search form and results template markup from `search.html`,\
    \ and place it into `category.html` *underneath* the list of pages. You’ll only\
    \ want to show the search functionality if the category exists in the database.\n\
    +   \n+   3. Update the search form definition such that the action refers back\
    \ to the category URL, rather than the search URL.\n+   \n+   4. Update the `show_category()`\
    \ view to handle a HTTP POST request. The view must then include any search results\
    \ in the context dictionary for the template to render. Remember that the search\
    \ query will be provided as part of the POST request in field `query`.\n+   \n\
    +   5. Finally, update Rango so that only users who are logged in can view and\
    \ use the updated search functionality. To restrict access within the `category.html`\
    \ template, we can use something along the lines of the following code snippet.\n\
    \n```\n```django\n{% if user.is_authenticated %}\n    <!-- Your search code goes\
    \ here -->\n{% endif %}\n```\n```\n\nThe markup and template code for the third\
    \ step can be seen below.\n\n```\n```html\n<form class=\"form-inline\"\n     \
    \ id=\"user-form\"\n      method=\"post\"\n      action=\"{% url 'rango:show_category'\
    \ category.slug %}\">\n```\n```\n\n# Commenting out Code\n\nCommenting out code\
    \ stops the interpreter or compiler from using the selected code. Although it\
    \ cannot see it and execute it, you can still read it and use it. In Python, the\
    \ simplest way to comment out a line of code is to prepend a `#` to the line –\
    \ put it before any text.\n\nOther languages will have different commenting syntax.\
    \ HTML, for example, uses `<!--` to denote the start of a commented-out block\
    \ of markup, and `-->` to denote the end."

- pgno: 151
  md: "# render() and Context\n\nAs a quick example of the checks you must carry out,\
    \ have a look at the about() view. Initially, this was implemented with a hard-coded\
    \ string response, as shown below. Note that we only send the string – we don’t\
    \ make use of the request passed as the request parameter.\n\n```\ndef about(request):\n\
    \    return HttpResponse('Rango says: Here is the about page. <a href=\"/rango/\"\
    >Index</a>')\n```\n\nTo employ the use of a template, we call the render() function\
    \ and pass through the request object. This will allow the template engine to\
    \ access information such as the request type (e.g. GET/POST), and information\
    \ relating to the user’s status (have a look at the user authentication chapter).\n\
    \n```\ndef about(request):\n    # prints out whether the method is a GET or a\
    \ POST\n    print(request.method)\n    # prints out the user name, if no one is\
    \ logged in it prints 'AnonymousUser'\n    print(request.user)\n    return render(request,\
    \ 'rango/about.html', {})\n```\n\nRemember, the last parameter of render() is\
    \ the context dictionary with which you can use to pass additional data to the\
    \ Django template engine. As we have no additional data to give to the template,\
    \ we pass through an empty dictionary, {}. Alternatively, we can simply take the\
    \ third parameter off completely.\n\n# 8.5 Custom Template Tags\n\nIt would be\
    \ nice to show the different categories that users can browse through in the sidebar\
    \ on each page. Given what we have learnt so far, we could do the following:\n\
    \n+   - in the base.html template, we could add some code to display an item list\
    \ of categories; and"
  merge: -1
  img_proc: true
- pgno: 152
  md: "+   - within each view, we could access the `Category` object, get all the\
    \ categories, and return that in the context dictionary.\n\nHowever, this is a\
    \ pretty nasty solution because we will need to include the same code in all views.\
    \ A [DRY](https://en.wikipedia.org/wiki/Don%E2%80%99t_repeat_yourself) solution\
    \ would be to create custom template tags that are included in the template, and\
    \ which can request *their* data.\n\n# Using Template Tags\n\nCreate a directory\
    \ `<workspace>/tango_with_django_project/rango/templatetags`, and create two new\
    \ modules within it. One must be called `__init__.py`, and this will be kept blank.\
    \ Name the second module `rango_template_tags.py`. Add the following code to `rango_template_tags.py`.\n\
    \n```\n```python\nfrom django import template\nfrom rango.models import Category\n\
    \nregister = template.Library()\n\n@register.inclusion_tag('rango/categories.html')\n\
    def get_category_list():\n    return {'categories': Category.objects.all()}\n\
    ```\n```\n\nThere is a new method called `get_category_list()` in this snippet.\
    \ This method returns a dictionary with one key/value pairing. `categories` represents\
    \ a list of all the `Category` objects present in the database. From the `register.inclusion_tag()`\
    \ decorator above, you will see that `rango/categories.html` is referred to –\
    \ another new template. This new template is used by the Django template engine\
    \ to render the list of categories you provide in the dictionary that is returned\
    \ in the function. This rendered list can then be injected into the response of\
    \ the view that initially called the template tag!\n\nNow would be a good time\
    \ to create the new template, `categories.html`, and add the following HTML markup.\
    \ Note the similarity in the name of the template with the existing `category.html`\
    \ template. This is done by design to make sure you are kept on your toes!\n\n\
    > [^10]: https://en.wikipedia.org/wiki/Don%E2%80%99t_repeat_yourself"
  merge: -1
  img_proc: true

  md: '# Without Cookies


    An alternative way of persisting state information *without cookies* is to encode
    the Session ID within the URL. For example, you may have seen PHP pages with URLs
    like this one: `http://www.site.com/index.php?sessid=some seemingly random and
    long string.` This means you don’t need to store cookies on the client machine,
    but the URLs become rather ugly. These URLs go against the principles of Django,
    which is to provide clean, simple and human-friendly URLs.


    # 10.3 Setting up Sessions in Django


    Although this should already be setup and working correctly, it’s nevertheless
    good practice to learn which Django modules provide which functionality. In the
    case of sessions, Django provides middleware¹⁰ that implements session functionality.


    To check that everything is in order, open your Django project’s `settings.py`
    file. Within the file, locate the `MIDDLEWARE` list. You should find within this
    list a module represented by the string `django.contrib.sessions.middleware.SessionMiddleware`.
    If you can’t see it, add it to the list now. It is the `SessionMiddleware` middleware
    that enables the creation of unique `sessionid` cookies.


    The `SessionMiddleware` is designed to work flexibly with different ways to store
    session information. Many approaches can be taken – you could store everything
    in a file, in a database, or even in an in-memory cache. The most straightforward
    approach is to use the `django.contrib.sessions` application to store session
    information in a Django model/database. Specifically, we are referring to the
    Django model `django.contrib.sessions.models.Session`. To use this approach, you’ll
    also need to make sure that `django.contrib.sessions` is in the `INSTALLED_APPS`
    tuple of your Django project’s `settings.py` file. Remember, if you add the application
    now, you’ll need to update your database with the usual migration commands.


    ¹⁰ https://docs.djangoproject.com/en/2.1/topics/http/middleware/'

- pgno: 144
  md: "```\n```html\n<!DOCTYPE html>\n{% load staticfiles %}\n\n<html>\n    <head\
    \ lang=\"en\">\n        <meta charset=\"UTF-8\" />\n        <title>Rango</title>\n\
    \    </head>\n    <body>\n        {% block body_block %}\n        {% endblock\
    \ %}\n    </body>\n</html>\n```\n```\n\nRecall that standard Django template commands\
    \ are denoted by {% and %} tags. To start a block, the command is {% block <NAME>\
    \ %}, where <NAME> is the name of the block you wish to create. You must also\
    \ ensure that you close the block with the correct {% endblock %} command, again\
    \ enclosed within Django template tags.\n\nYou can also specify *default content*\
    \ for your blocks, which will be used if no inheriting template defines the given\
    \ block (see [further down](#)). Specify default content by adding markup between\
    \ {% block %} and {% endblock %} template commands, just like in the example below.\n\
    \n```\n```django\n{% block body_block %}\n    This is body_block's default content.\n\
    {% endblock %}\n```\n```\n\nWhen we create templates for each page, we will inherit\
    \ from rango/base.html and override the contents of body_block. However, you can\
    \ place as many blocks in your templates as you so desire. For example, you could\
    \ create a block for the page title, a block for the footer, a block for the sidebar,\
    \ and more. Blocks are a really powerful feature of Django’s templating system,\
    \ and you can learn more about them check on [Django’s official documentation\
    \ on templates](https://docs.djangoproject.com/en/2.1/topics/templates/)."

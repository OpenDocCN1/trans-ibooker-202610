- pgno: 398
  md: '# 3. Committing your Changes


    We’ve mentioned *committing* several times in the previous step – but what does
    it mean? Committing is when you save changes – which are listed in the local index
    – that you have made within your workspace. The more often you commit, the greater
    the number of opportunities you’ll have to revert to an older version of your
    code if things go wrong. It’s like a checkpoint in a game – reach the checkpoint
    and you can save your status, perhaps giving you the ability to roll back in the
    future if you need to.


    Make sure you commit often, **but don’t commit an incomplete or broken version
    of a particular module or function. Your colleagues will hate you for it.** There’s
    a lot of discussion as to when the ideal time to commit is. [Have a look at this
    Stack Overflow page](http://stackoverflow.com/questions/1480723/dvcs-how-often-and-when-to-commit-changes)
    for the opinions of several developers. However, it does make sense to commit
    only when everything is working. To reiterate, put yourself in the shoes of a
    developer who has found their colleague has committed something that is broken.
    How would you feel?


    To commit, you issue the `git commit` command. Any changes to existing files that
    you have indexed will be saved to version control at this point. Additionally,
    any files that you’ve requested to be copied, removed, moved or added to version
    control via the local index will be undertaken at this point. When you commit,
    you are updating the *HEAD* of your local repository.


    # Commit Requirements


    ![](img/75169a27287f7c945bf2cbf7dede5251_398_0.png)


    To successfully commit, you need to modify at least one file in your repository
    and instruct Git to commit it, through the `git add` command. See the previous
    step for more information on how to do this.


    As part of a commit, it’s incredibly useful to your future self and others to
    explain why you committed when you did. You can supply an optional message with
    your commit if you wish to do so. Instead of simply issuing `git commit`, run
    the following amended command.


    > 103 http://stackoverflow.com/questions/1480723/dvcs-how-often-and-when-to-commit-changes

    > 104 http://stackoverflow.com/questions/2304087/what-is-git-head-exactly'
  merge: -1
  img_proc: true
- pgno: 399
  md: '```

    $ git commit -m "Chapter 5 exercises completed"

    ```


    From the example above, you can see that using the -m switch followed by a string
    provides you with the opportunity to append a message to your commit. Be as explicit
    as you can, but don’t write too much. People want to see at a glance what you
    did and do not want to be bored or confused with a long essay. At the same time,
    don’t be too vague. Simply specifying Updated models.py may tell a developer what
    file you modified, but they will require further investigation to see exactly
    what you changed.


    # Sensible Commits


    Although frequent commits may be a good thing, you will want to ensure that what
    you have written works before you commit. This may sound silly, but it’s an incredibly
    easy thing to not think about. To reiterate (for the third time), committing code
    which doesn’t roll back work can be infuriating to your team members if they then
    rollback to a version of your project’s codebase which is broken!


    # 4. Synchronising your Repository


    # Important when Collaborating


    Synchronising your local repository before making changes is crucial to ensure
    you minimise the chance for conflicts occurring. Make sure you get into the habit
    of doing a pull before you push.


    After you’ve committed your local repository and committed your changes, you’re
    just about ready to send your commit(s) to the remote repository by pushing your
    changes. However, what if someone within your group pushes their changes before
    you do? This means your local repository will be out of sync with the remote repository,
    meaning that any git push command that you issue will fail.


    It’s therefore always a good idea to check whether changes have been made on the
    remote repository before updating it. Running a git pull command will pull down'

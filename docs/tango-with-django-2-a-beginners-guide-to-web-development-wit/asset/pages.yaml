    # ## Cloning your Git Repository


    Now that your virtual environment for Rango is all set up, you can now clone your
    Git repository to obtain a copy of your project’s files. On PythonAnywhere, clone
    your repository by issuing the following command from your home directory.


    ```

    ```shell

    $ git clone https://github.com/<OWNER>/<REPO_NAME>

    ```

    ```


    You will of course be looking to replace <OWNER> with the username of the person
    who owns the repository and <REPO_NAME> with the name of your project’s repository.
    For example, a repository `tango_with_django_project` hosted by `djangolearner`
    would have the following command.


    ```

    ```shell

    $ git clone https://github.com/djangolearner/tango_with_django_project

    ```

    ```



- pgno: 312
  md: 'a list of potential filtered down category matches. This list of categories
    can then be rendered within the loaded page. To ensure this functionality is present
    across the Rango app, we’ll be looking to implement it on the left-hand category
    listing section.


    # ## Workflow


    To implement this, we’ll need to undertake the following steps.


    +   1. First, we’ll need to create a parameterised function called `get_category_list()`.
    This function will take two parameters, namely `max_results` (defaulting to 0),
    and `starts_with` (defaulting to an empty string, `''''`). The function will return
    a list of categories that match what the user is looking for.

    +      - `max_results` will limit how many results to return. If 0 is specified,
    no limit is placed on how many categories are returned.

    +      - `starts_with` will represent what the user has supplied so far. Imagine
    if the user is looking for `python`, a potential string being passed here could
    be `pyt` — meaning that the user has supplied the first three characters of what
    they are looking for.

    +   2. A further view will need to be created. We’ll call this `CategorySuggestionView`.
    This will again be class-based and will be accessed through the URL mapping `/rango/suggest/`
    (with a name of `suggest`). This view will take the user’s suggestion, and will
    return a list of the top eight suggestions for what the user has provided.

    +      - We will assume that this is achieved through an HTTP GET request.

    +      - We will check if the querystring provided to the view is empty. If it
    contains something, we’ll call `get_category_list()` to get the top eight results
    for the supplied string.

    +      - The results from `get_category_list()` will be munged together in an
    existing template, `categories.html`. This is what we used to display the category
    listing on the left-hand side of Rango’s pages, through the custom template tag
    we implemented earlier.'

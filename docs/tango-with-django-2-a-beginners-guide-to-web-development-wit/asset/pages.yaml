    \ has a name, several visits, and several likes.\n+   - A page belongs to a particular\
    \ category, has a title, a URL, and several views.\n\n![](img/75169a27287f7c945bf2cbf7dede5251_74_0.png)\n\
    \nThe Entity Relationship Diagram of Rango's two main entities.\n\n# 5.2 Telling\

  md: '# 6. Models, Templates and Views


    Now that we have the models set up and populated the database with some sample
    data, we can now start connecting the models, views and templates to serve up
    dynamic content. In this chapter, we will go through the process of showing categories
    on the main page, and then create dedicated category pages which will show the
    associated list of links.


    # 6.1 Workflow: A Data-Driven Page


    To do this, there are five main steps that you must undertake to create a data-driven
    webpage in Django.


    +   1. In the `views.py` module, `import` the models you wish to use.

    +   2. In the view function, query the model to get the data you want to present.

    +   3. Also in the view, pass the results from your model into the template’s
    context.

    +   4. Create/modify the template so that it displays the data from the context.

    +   5. If you have not done so already, map a URL to your view.


    These steps highlight how we need to work within Django’s framework to bind models,
    views and templates together.


    # 6.2 Showing Categories on Rango’s Homepage


    One of the requirements regarding the main page was to show the top five categories
    present within your app’s database. To fulfil this requirement, we will go through
    each of the above steps.'

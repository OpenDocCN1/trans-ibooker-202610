- pgno: 413
  md: "and their associated six-character hexadecimal code. You can also try sites\
    \ such as color-hex.com¹³² which gives you fine-grained control over the colours\
    \ you can choose.\n\n# Hexadecimal Colour Codes\n\nFor more information on how\
    \ colours are coded with hexadecimal, check out this thorough tutorial¹³³.\n\n\
    # Watch your English!\n\nAs you may have noticed, CSS uses American English to\
    \ spell words. As such, there are a few words that are spelt slightly differently\
    \ compared to their British counterparts, like color and center. If you have grown\
    \ up in the United Kingdom or Australia for instance, double-check your spelling\
    \ and be prepared to spell it the wrong way!\n\n# Text Colours\n\nTo change the\
    \ colour of text within an element, you must apply the color property to the element\
    \ containing the text you wish to change. The following CSS, for example, changes\
    \ all the text within an element using class red to red.\n\n```\n.red {\n  color:\
    \ #FF0000;\n}\n```\n\nYou can alter the presentation of a small portion of text\
    \ within your webpage by wrapping the text within <span> tags. Assign a class\
    \ or unique identifier to the element, and from there you can simply reference\
    \ the <span> tag in your stylesheet while applying the color property. In the\
    \ example markup below, the text fire engine would appear in red, using the red\
    \ class defined above."
  merge: -1
  img_proc: true
- pgno: 414
  md: "```\n```html\n<span>\n    I saw a police car and <span class=\"red\">fire engine</span>\
    \ drive past me.\n</span>\n```\n```\n\n# Borders\n\nYou can change the colour\
    \ of an element’s *borders*, too. We’ll discuss what borders are discussed as\
    \ part of the [CSS box model](#). For now, we’ll show you how to apply colours\
    \ to them to make everything look pretty.\n\nBorder colours can be specified with\
    \ the `border-color` property. You can supply one colour for all four sides of\
    \ your border, or specify a different colour for each side. To achieve this, you’ll\
    \ need to supply different colours, each separated by a space.\n\n```\n```css\n\
    .some-element {\n    border-color: #000000 #FF0000 #00FF00;\n}\n```\n```\n\nIn\
    \ the example above, we use multiple colours to specify a different colour for\
    \ three sides. Starting at the top, we rotate clockwise. Thus, the order of colours\
    \ for each side would be `top right bottom left`.\n\nOur example applies any element\
    \ with class `some-element` with a black top border, a red right border and a\
    \ green bottom border. No left border value is supplied, meaning that the left-hand\
    \ border is left transparent. To specify a colour for only one side of an element’s\
    \ border, consider using the `border-top-color`, `border-right-color`, `border-bottom-color`\
    \ and `border-left-color` properties where appropriate.\n\n# Background Colours\n\
    \nYou can also change the colour of an element’s background through the use of\
    \ the CSS `background-color` property. Like the `color` property described above,\
    \ the `background-color` property can be easily applied by specifying a single\
    \ colour as its value. Check out the example below which applies a bright green\
    \ background to the entire webpage. Not very pretty!"
  merge: -1
  img_proc: true
- pgno: 415
  md: "```\nbody {\n  background-color: #00FF00;\n}\n```\n\n# Background Images\n\n\
    Of course, specifying a colour isn’t the only way to change your backgrounds.\
    \ You can also apply background images to your elements, too. We can achieve this\
    \ through the background-image property.\n\n```\n#some-unique-element {\n  background-image:\
    \ url('../images/filename.png');\n  background-color: #000000;\n}\n```\n\nThe\
    \ example above makes use of filename.png as the background image for the element\
    \ with the identifier some-unique-element. The path to your image is specified\
    \ relative to the path of your CSS stylesheet, not the webpage itself. Our example\
    \ above uses the double dot notation to specify the relative path¹³⁴ to the image.\
    \ We also apply a black background colour to fill the gaps left by our background\
    \ image – it may not fill the entire size of the element.\n\n![](img/75169a27287f7c945bf2cbf7dede5251_415_0.png)\n\
    \n# Background Image Positioning\n\nBy default, background images default to the\
    \ top-left corner of the relevant element and are repeated on both the horizontal\
    \ and vertical axes. You can customise this functionality by altering how the\
    \ image is repeated¹³⁵ with the background-image property. You can also specify\
    \ where the image is placed¹³⁶ with the background-position property."
  merge: -1
  img_proc: true
- pgno: 416
  md: '# # Containers, Block-Level and Inline Elements


    Throughout the crash course thus far, we’ve introduced you to the `<span>` element
    but have neglected to tell you what it is. All will become clear in this section
    as we explain *inline* and *block-level* elements.


    A `<span>` is considered to be a so-called *container element*. Along with a `<div>`
    tag, these elements are themselves meaningless and are provided only for you to
    con- tain and separate your page’s content in a logical manner. For example, you
    may use a `<div>` to contain markup related to a navigation bar, with another
    `<div>` to contain markup related to the footer of your webpage. Alternatively,
    you could use the `<nav>` and `<footer>` container elements! As containers themselves
    are meaningless, styles are usually applied to help control the presentational
    semantics of your webpage.


    Containers come in two kinds: *block-level elements* and *inline elements*. Check
    out the figure below for an illustration of the two kinds in action, and read
    on for a short description of each.


    ![](img/75169a27287f7c945bf2cbf7dede5251_416_0.png)


    **Diagram demonstrating how block-level elements and inline elements are rendered
    by default.** With block-level elements as green, note how a line break is taken
    between each element. Conversely, inline elements can appear on the same line
    beside each other. You can also nest block-level and inline elements within each
    other, but block-level elements cannot be nested within an inline element.'
  merge: -1
  img_proc: true

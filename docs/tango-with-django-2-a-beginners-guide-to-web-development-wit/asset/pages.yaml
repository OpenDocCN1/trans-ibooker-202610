    \ declaration³ on the first line may mean that the resultant page generated from\
    \ your template will not comply with W3C HTML guidelines⁴.\n\n# Template Blocks\n\
    \nNow that we’ve created our base template, we can add template tags to denote\
    \ what parts of the template can be overridden by templates that inherit from\
    \ it. To do this, we will be using the `block` tag. For example, we can add a\
    \ `body_block` to the base template in `base.html` as follows:"

- pgno: 403
  md: 'From this list, you can choose a commit to rollback to. For the commit you
    want to rollback to, you must take the commit hash – the long string of letters
    and numbers. To demonstrate, the top (or `HEAD`) commit hash in the example output
    above is 88f41317640a2b62c2c63ca8d755feb9f17cf16e. You can select this in your
    terminal and copy it to your computer’s clipboard.


    With your commit hash selected, you can now rollback your workspace to the previous
    revision. You can do this with the `git checkout` command. The following example
    command would rollback to the commit with the aforementioned hash.


    ```

    $ git checkout 88f41317640a2b62c2c63ca8d755feb9f17cf16e .

    ```


    Make sure that you run this command from the root of your workspace, and do not
    forget to include the dot at the end of the command! The dot indicates that you
    want to apply the changes to the entire workspace directory tree. After this has
    completed, you should then immediately commit with a message indicating that you
    performed a rollback. Push your changes and alert your collaborators – perhaps
    with a pull request. From there, you can start to recover from the mistake by
    putting your head down and getting on with your project.


    # Exercises


    If you haven’t undertaken what we’ve been discussing in this chapter already,
    you should go through everything now to ensure your Git repository is ready to
    go. To try everything out, you can create a new file `README.md` in the root of
    your `<workspace>` directory. The file [will be used by GitHub¹¹³](#footnote-113)
    to provide information on your project’s GitHub homepage.


    +   - Create the file and write some introductory text to your project.

    +   - Add the file to the local index upon completion of writing and commit your
    changes.

    +   - Push the new file to the remote repository and observe the changes on the
    GitHub website.


    Once you have completed these basic steps, you can then go back and edit the readme
    file some more. Add, commit and push – and then try to revert to the initial version
    to see if it all works as expected.


    ¹¹³ https://help.github.com/articles/github-flavored-markdown'

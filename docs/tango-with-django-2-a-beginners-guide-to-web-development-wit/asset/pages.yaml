    earlier in the book to populate the database with sample data. As we’ll be running
    the module, you must ensure that you are using the rangoenv virtual environment
    (i.e. you see `(rangoenv)` as part of your prompt – if not, invoke `workon rangoenv`).


    From your home directory (denoted by the ~ in your prompt), you want to navigate
    to the directory containing your `manage.py` and `populate_rango.py` scripts.
    Following the instructions we provided earlier, this would be at `~/tango_with_django_project/`
    – the directory that you just cloned. If you chose to follow a different structure,
    navigate to the location where these files are stored.


    ![](img/75169a27287f7c945bf2cbf7dede5251_343_0.png)


    # How do I navigate?


    In a Bash terminal, you can change the directory with the `cd` command, followed
    by the path you wish to change to. In this instance, you would issue the command
    `cd ~/tango_with_django_project/`.


    Note that when you change directory, your prompt will change to reflect your *present
    working directory*. `~ $` would change to `~/tango_with_django_project $`, for
    instance.


    Once you have changed directory, issue the following commands. These should be
    second nature to you by now!


    ```

    ```bash

    $ python manage.py makemigrations rango

    $ python manage.py migrate

    $ python populate_rango.py

    $ python manage.py createsuperuser

    ```

    ```


    You should know exactly what all of these commands do. Of course, the final command
    will require some interaction on your part to create an administrator’s account
    for your Django project.



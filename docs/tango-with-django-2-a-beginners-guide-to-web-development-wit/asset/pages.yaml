    # Mapping the View to a URL


    We then need to map our new `ProfileView` to a URL. This involves editing Rango’s
    `urls.py` module. We want to add a further line to the urlpatterns list, as shown
    below.


    ```

    path(''profile/<username>/'', views.ProfileView.as_view(), name=''profile''),

    ```


    Note the inclusion of a username variable – this matches to anything after /profile/.
    This means that the URL /rango/profile/maxwelld90/ would have a username of maxwelld90.
    This is in turn passed to the get() or post() methods in our class-based view
    as parameter username. This is how we are able to determine what user has been
    requested.



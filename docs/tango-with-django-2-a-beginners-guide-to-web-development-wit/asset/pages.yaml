  md: '# Caching Sessions


    If you want faster performance, you may want to consider a cached approach for
    storing session information. You can check out the [Django documentation for advice
    on cached sessions](https://docs.djangoproject.com/en/2.1/topics/http/sessions/#using-cached-sessions).


    # 10.4 A Cookie Tasting Session


    While all modern web browsers support cookies, certain cookies may get blocked
    depending on your browser’s security level. Check that you’ve enabled support
    for cookies before continuing. However, it’s likely you’re ready to go.


    # Testing Cookie Functionality


    To test out cookies, you can make use of some convenience methods provided by
    Django’s request object. The three of particular interest to us are `set_test_cookie()`,
    `test_cookie_worked()` and `delete_test_cookie()`. In one view, you will need
    to set the test cookie. In another, you’ll need to test that the cookie exists.
    Two different views are required for testing cookies because you need to wait
    to see if the client has accepted the cookie from the server.


    We’ll use two pre-existing views for this simple exercise, `index()` and `about()`.
    Instead of displaying anything on the pages themselves, we’ll be making use of
    the terminal output from the Django development server to verify whether cookies
    are working correctly.


    In Rango’s `views.py` file, locate your `index()` view. Add the following line
    to the view. To ensure the line is executed, make sure you put it in before the
    return line.


    ```

    ```python

    request.session.set_test_cookie()

    ```

    ```


    In the `about()` view, add the following three lines. Again, make sure these go
    *before* the `return` statement to ensure they are executed. A return statement
    curtails execution at that point.'

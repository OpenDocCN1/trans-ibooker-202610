  md: "```\n```python\nclass IndexViewTests(TestCase):\n    def test_index_view_with_no_categories(self):\n\
    \        \"\"\"\n        If no categories exist, the appropriate message should\
    \ be displayed.\n        \"\"\"\n\n        response = self.client.get(reverse('rango:index'))\n\
    \n        self.assertEqual(response.status_code, 200)\n        self.assertContains(response,\
    \ 'There are no categories present.')\n        self.assertQuerysetEqual(response.context['categories'],\
    \ [])\n```\n```\n\nAs we are using the Django reverse() function to perform a\
    \ URL lookup, we’ll need to make sure that the correct import statement is included\
    \ at the top of the tests.py module, too.\n\n```\n```python\nfrom django.urls\
    \ import reverse\n```\n```\n\nLooking at the code above, the Django TestCase class\
    \ has access to a client object which can make requests. Here, it uses the helper\
    \ function reverse() to lookup the URL of Rango’s index page. It then tries to\
    \ issue an HTTP GET request on that page. The response is returned and stored\
    \ in response. The test then checks several things: whether the page loaded successfully\
    \ (with a 200 status code returned); whether the response’s HTML contains the\
    \ string ‘There are no categories present.’; and whether the context dictionary\
    \ used to render the response contains an empty list for the categories supplied.\n\
    \nRecall that when you run tests, a new database is created, which by default\
    \ is not populated. This is true for each test method – and explains why the categories\
    \ you create in the two CategoryMethodTests tests are not visible to the test\
    \ in IndexViewTests.\n\nNow let’s check the index view when categories are present.\
    \ We can add a helper function for us to achieve this. This simple function doesn’t\
    \ live within a class – just place it in the test.py module."

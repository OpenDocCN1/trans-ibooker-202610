- pgno: 178
  md: "Django provides a decorator called `login_required()`, which we can attach\
    \ to any view where we require the user to be logged in. If a user is not logged\
    \ in and attempts to access a view decorated with `login_required()`, they are\
    \ then redirected to another page ([that you can set](https://docs.djangoproject.com/en/2.1/ref/settings/#login-url))\
    \ – typically the login page.\n\n# Restricting Access with a Decorator\n\nTo try\
    \ this out, create a view in Rango’s `views.py` module called `restricted()`,\
    \ and add the following code.\n\n```\n```python\n@login_required\ndef restricted(request):\n\
    \    return HttpResponse(\"Since you're logged in, you can see this text!\")\n\
    ```\n```\n\nNote that to use a decorator, you place it *directly above* the function\
    \ signature, and put a `@` before naming the decorator. Python will execute the\
    \ decorator before executing the code of your function/method. As a decorator\
    \ is still a function, you’ll still have to import it if it resides within an\
    \ external module. As `login_required()` exists elsewhere, the following import\
    \ statement is required at the top of `views.py`.\n\n```\n```python\nfrom django.contrib.auth.decorators\
    \ import login_required\n```\n```\n\nWe’ll also need to add in another URL mapping\
    \ to Rango’s `urlpatterns` list in the `urls.py` file. Add the following line\
    \ of code.\n\n```\n```python\npath('restricted/', views.restricted, name='restricted'),\n\
    ```\n```\n\nTo make the new restricted page accessible, you can also add another\
    \ link to Rango’s `base.html` template."
  merge: -1
  img_proc: true
- pgno: 179
  md: "```\n```html\n<ul>\n    ...\n    <li><a href=\"{% url 'rango:restricted' %}\"\
    >Restricted Page</a></li>\n</ul>\n```\n```\n\nWe will also need to robustly handle\
    \ scenarios where users attempt to access the `restricted()` view, but are not\
    \ logged in. What do we do with the user? The simplest approach is to redirect\
    \ them to a page they can access, e.g. the registration page. Django allows us\
    \ to specify this in our project’s `settings.py` module, located in the project\
    \ configuration directory. In `settings.py`, define the variable `LOGIN_URL` with\
    \ the URL you’d like to redirect users to that aren’t logged in. In Rango’s case,\
    \ we can redirect to the login page located at `/rango/login/`:\n\n```\n```python\n\
    LOGIN_URL = '/rango/login/'\n```\n```\n\nHowever, hardcoding URLs like this, regardless\
    \ of where they are placed, is bad practice. We want to avoid this at all costs!\
    \ Thankfully, you can rewrite this using the URL mapping that you defined in Rango’s\
    \ `urls.py` module, like so.\n\n```\n```python\nLOGIN_URL = 'rango:login'\n```\n\
    ```\n\nMuch better! Django supports URL names here, too. By entering a URL name\
    \ here, Django will direct users to the right place, even if the URL for logging\
    \ in is changed.\n\nRegardless of what you enter as the value of `LOGIN_URL`,\
    \ providing a value here ensures that the `login_required()` decorator will redirect\
    \ any user not logged in to the URL you specify.\n\n# 9.9 Logging Out\n\nTo enable\
    \ users to log out gracefully, it would be nice to provide a logout option to\
    \ users. Django comes with a handy `logout()` function that takes care of ensuring\
    \ that the users can properly and securely log out. The `logout()` function will\
    \ ensure that their session is ended, and that if they subsequently try to access\
    \ a view that requires authentication then they will not be able to access it,\
    \ unless they then decide to log back in."
  merge: -1
  img_proc: true
- pgno: 180
  md: "To provide logout functionality in `rango/views.py`, add the view called `user_logout()`\
    \ with the following code.\n\n```\n```python\n# Use the login_required() decorator\
    \ to ensure only those logged in can\n# access the view.\n@login_required\ndef\
    \ user_logout(request):\n    # Since we know the user is logged in, we can now\
    \ just log them out.\n    logout(request)\n    # Take the user back to the homepage.\n\
    \    return redirect(reverse('rango:index'))\n```\n```\n\nYou’ll also need to\
    \ import the logout function at the top of `views.py`.\n\n```\n```python\nfrom\
    \ django.contrib.auth import logout\n```\n```\n\nIf you like, you can also append\
    \ the logout import to the end of your existing import from the same module, like\
    \ in the following example.\n\n```\n```python\nfrom django.contrib.auth import\
    \ authenticate, login, logout\n```\n```\n\nWith the view created, map the URL\
    \ `/rango/logout/` to the `user_logout()` view by modifying the urlpatterns list\
    \ in Rango’s `urls.py`.\n\n```\n```python\npath('logout/', views.user_logout,\
    \ name='logout'),\n```\n```\n\nFinally, we can add a further link to our `base.html`\
    \ template.\n\n```\n```html\n<ul>\n    ...\n    <li><a href=\"{% url 'rango:logout'\
    \ %}\">Logout</a></li>\n    ...\n</ul>\n```\n```"
  merge: -1

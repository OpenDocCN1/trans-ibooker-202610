    The new add_category() view adds several key pieces of functionality for handling
    forms. First, we create a CategoryForm(), then we check if the HTTP request was
    a POST (did the user submit data via the form?). We can then handle the POST request
    through the same URL. The add_category() view function can handle three different
    scenarios:


    +   - showing a new, blank form for adding a category;

    +   - saving form data provided by the user to the associated model, and redirecting
    to the Rango homepage; and

    +   - if there are errors, redisplay the form with error messages.


    # GET and POST


    What do we mean by GET and POST? They are HTTP requests.


    +   - An HTTP GET is used to request a representation of the specified resource.
    In other words, we use a HTTP GET to retrieve a particular resource, whether it
    is a webpage, image or some other file.

    +   - In contrast, an HTTP POST submits data from the client’s web browser to
    be processed. This type of request is used for example when submitting the contents
    of a HTML form.

    +   - Ultimately, an HTTP POST may end up being programmed to create a new resource
    (e.g. a new database entry) on the server. This could later be accessed through
    an HTTP GET request.

    +   - Check out the w3schools page on GET vs. POST⁴ for more details.'

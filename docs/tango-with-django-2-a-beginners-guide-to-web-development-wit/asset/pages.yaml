  md: "# 19. Deploying Your Project\n\nThis chapter provides a step-by-step guide\
    \ on how to deploy your Django application on PythonAnywhere¹. PythonAnywhere\
    \ is an online IDE and web hosting service, geared towards hosting Python applications.\
    \ The service provides in-browser access to the server-based Python and Bash command\
    \ line interfaces, meaning you can interact with PythonAnywhere’s servers just\
    \ like you would with a regular terminal instance on your computer. Currently,\
    \ PythonAnywhere is offering a free beginner account, which is perfect to get\
    \ started. It provides you with an adequate amount of storage space and CPU time\
    \ to get a single Django project up and running.\n\n> **Are you using Git?**\n\
    > \n> You can do this chapter independently as we have already implemented Rango\
    \ – our implementation is available from GitHub². If you haven’t used Git/GitHub\
    \ before, you can check out our chapter on using Git.\n\n# 19.1 Creating a PythonAnywhere\
    \ Account\n\nFirst, sign up for a Beginner PythonAnywhere account³. We recommend\
    \ that you take the seven-step tour to get familiar with the PythonAnywhere interface.\
    \ If your application takes off and becomes popular, you’ll always have the ability\
    \ to upgrade your account at a later date to gain more storage space and CPU time\
    \ along with several other benefits, such as hosting specific domains and the\
    \ ability to SSH⁴ in, for example.\n\nOnce your account has been created and you\
    \ have confirmed your email, you will have your little slice of the World Wide\
    \ Web at http://<username>.pythonanywhere.com,"
  merge: -1

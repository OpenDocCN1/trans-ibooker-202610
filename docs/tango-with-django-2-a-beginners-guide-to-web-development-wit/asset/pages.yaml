    </body>

    </html>

    ```


    From the example above, we have introduced two new features into the base template.


    +   - The first is a template block called `title_block`. This will allow us to
    specify a custom page title for each page inheriting from our base template. If
    an inheriting page does not override the block, then the `title_block` defaults
    to `How to Tango with Django!`, resulting in a complete title of `Rango - How
    to Tango with Django!`. Look at the contents of the `<title>` tag in the above
    template to see how this works.

    +   - We have also included the list of links from our current `index.html` template
    – along with a new link to the index page – and placed them into an HTML `<div>`
    tag underneath our `body_block` block. This will ensure the links are present
    across all pages inheriting from the base template. The links are preceded by
    a *horizontal rule* (`<hr />`) which provides visual separation for the user between
    the content of the `body_block` block and the links.


    # 8.3 Template Inheritance


    Now that we’ve created a base template with blocks, we can now update all the
    templates we have created so that they inherit from the base template. Let’s start
    by refactoring the template `rango/category.html`.


    You can achieve this by first removing all the repeated HTML code, leaving only
    the HTML and template tags/commands specific to the page. Then at the beginning
    of the template add the following line of code:


    ```

    {% extends ''rango/base.html'' %}

    ```


    The `extends` command takes one parameter – the template that is to be extended/inherited
    from (i.e. `rango/base.html`). The parameter you supply to the `extends` command
    should be relative from your project’s `templates` directory. For example, all
    templates we use for Rango should extend from `rango/base.html`, not `base.html`.'
  merge: -1

- pgno: 375
  md: "# # A Crash Course in UNIX-based Commands\n\nDepending on your computing background,\
    \ you may or may not have encountered a UNIX-based system – or a derivative of.\
    \ This small crash course focuses on getting you up to speed with the *terminal*,\
    \ an application in which you issue commands for the computer to execute. This\
    \ differs from a point-and-click *Graphical User Interface (GUI)*, the kind of\
    \ interface that has made computing so much more accessible. A terminal-based\
    \ interface may be more complex to use, but the benefits of using such an interface\
    \ include getting things done quicker – and more accurately, too.\n\n> **Not for\
    \ Windows!**\n> \n> Note that we’re focusing on the Bash shell, a shell for UNIX-based\
    \ operating systems and their derivatives, including macOS and Linux distributions.\
    \ If you’re a Windows user, you can use the [Windows Command Prompt](http://www.ai.uga.edu/mc/winforunix.html)\
    \ or [Windows PowerShell](https://msdn.microsoft.com/en-us/powershell/mt173057.aspx).\
    \ Users of Windows 10 can now install the necessary infrastructure [straight from\
    \ Microsoft](https://docs.microsoft.com/en-us/windows/wsl/install-win10) to use\
    \ Bash on your Windows installation! You could also experiment by [installing\
    \ Cygwin](https://www.cygwin.com/) to bring Bash commands to Windows.\n\n# ##\
    \ Using the Terminal\n\nUNIX based operating systems and derivatives – such as\
    \ macOS and Linux distributions – all use a similar-looking terminal application,\
    \ typically using the [Bash shell](https://en.wikipedia.org/wiki/Bash_(Unix_shell)).\
    \ All possess a core set of commands that allow you to navigate through your computer’s\
    \ filesystem and launch programs – all without the need for any graphical interface."
  merge: -1
  img_proc: true

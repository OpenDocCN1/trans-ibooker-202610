- pgno: 435
  md: "```\n```html\n<div id=\"dark\">\n    <a href=\"http://www.google.co.uk/\">Google\
    \ Search</a>\n</div>\n\n<div class=\"light\">\n    <a href=\"http://www.bing.co.uk/\"\
    >Bing Search</a>\n</div>\n```\n```\n\nThe resultant output looks similar to the\
    \ example shown below. Code up the example above, and hover over the links in\
    \ your browser to see the text colours change!\n\n![](img/75169a27287f7c945bf2cbf7dede5251_435_0.png)\n\
    \nWith a small amount of CSS, you can make some big changes in the way your webpages\
    \ appear to users.\n\n# The Cascade\n\nIt’s worth pointing out where the *Cascading*\
    \ in *Cascading Style Sheets* comes into play. [Looking back at the CSS rendering\
    \ example way back at the start of this chapter](#), you will notice that the\
    \ red text shown is **bold**, yet no such property is defined in our h1 style.\
    \ This is a perfect example of what we mean by *cascading styles*. Most HTML elements\
    \ have associated with them a *default style* which web browsers apply. For `<h1>`\
    \ elements, the [W3C website provides a typical style that is applied](#)¹⁴⁸.\
    \ If you check the typical style, you’ll notice that it contains a `font-weight:\
    \ bold;` property and value pairing, explaining where the **bold** text comes\
    \ from. As we define a further style for `<h1>` elements, typical property/value\
    \ pairings *cascade* down into our style. If we define a new value for an existing\
    \ property/value pairing (such as we do for `font-size`), we *override* the existing\
    \ value. This process can be repeated many times – and the property/value pairings\
    \ at the end of the process are applied to the relevant element. Check out the\
    \ [figure below](#) for a graphical representation of the cascading process."

- pgno: 327
  md: "statement. Every time you create a new Django app, this nearly-blank `tests.py`\
    \ module is created for you to encourage you to write tests!\n\nFrom the output\
    \ shown above, you might also notice that a database called `default` is referred\
    \ to. When you run tests, a temporary database is constructed, which your tests\
    \ can populate and perform operations on. This way your testing is *performed\
    \ independently* of your live database, satisfying one of the rules we listed\
    \ above.\n\n# ## Testing Rango’s Models\n\nGiven that there are presently no tests,\
    \ let’s create one! In the `Category` model, we want to ensure that the number\
    \ of views received is zero or greater because you cannot have a negative number\
    \ of views. To create a test for this, we can put the following code into Rango’s\
    \ `tests.py` module, being careful to keep the existing `import` statement.\n\n\
    ```\n```python\nclass CategoryMethodTests(TestCase):\n    def test_ensure_views_are_positive(self):\n\
    \        \"\"\"\n        Ensures the number of views received for a Category are\
    \ positive or zero.\n        \"\"\"\n        category = Category(name='test',\
    \ views=-1, likes=0)\n        category.save()\n\n        self.assertEqual((category.views\
    \ >= 0), True)\n```\n```\n\nYou’ll also want to make sure that you import the\
    \ `Category` model.\n\n```\n```python\nfrom rango.models import Category\n```\n\
    ```\n\nThe first thing to notice about the test we have written is that we must\
    \ place the tests within a class. This class must inherit from `django.test.TestCase`.\
    \ Each method implemented within a class tests a particular piece of functionality.\
    \ These methods should always have a name that starts with `test_`, and should\
    \ always contain some form of assertion. In this example, we use `assertEqual`\
    \ which checks whether two items are equal. However, there are lots of other assert\
    \ checks you can use – as demonstrated in the [official Python documentation](https://docs.python.org/3/library/unittest.html#assert-methods).\
    \ Django’s testing machinery\n\n⁴https://docs.python.org/3/library/unittest.html#assert-methods"

- pgno: 418
  md: "# # Basic Positioning\n\nAn important concept that we have not yet covered\
    \ in this CSS crash course regards the positioning of elements within your webpage.\
    \ Most of the time, you’ll be satisfied with inline elements appearing alongside\
    \ each other, and block-level elements appearing underneath each other. These\
    \ elements are said to be *positioned statically*.\n\nHowever, there will be scenarios\
    \ where you require a little bit more control on where everything goes. In this\
    \ section, we’ll briefly cover three important techniques for positioning elements\
    \ on your webpage: *floats, relative positioning* and *absolute positioning*.\n\
    \n# ## Floats\n\nCSS *floats* are one of the most straightforward techniques for\
    \ positioning elements within your webpage. Using floats allows us to position\
    \ elements to the left or right of a particular container – or page.\n\nLet’s\
    \ work through an example. Consider the following HTML markup and CSS code.\n\n\
    ```\n```html\n<div class=\"container\">\n    <span class=\"yellow\">Span 1</span>\n\
    \    <span class=\"red\">Span 2</span>\n</div>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 419
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 420
  md: "![](img/75169a27287f7c945bf2cbf7dede5251_420_0.png)\n\nThis would float the\
    \ `.yellow` element, removing it from the natural flow of the webpage. In effect,\
    \ it is now not sitting within the `.container` container. This explains why the\
    \ parent container does not now fill down with the `<span>` elements like you\
    \ would expect. You can apply the `overflow: hidden;` property to the parent container\
    \ as shown below to fix this problem. For more information on how this trick works,\
    \ have a look at [this QuirksMode.org online article](http://www.quirksmode.org/css/clearing.html).\n\
    \n```\n```css\n.container {\n    border: 1px solid black;\n    overflow: hidden;\n\
    }\n```\n```\n\n![](img/75169a27287f7c945bf2cbf7dede5251_420_1.png)\n\nApplying\
    \ `overflow: hidden` ensures that our `.container` pushes down to the appropriate\
    \ height.\n\n# Relative Positioning\n\n*Relative positioning* can be used if you\
    \ require a greater degree of control over where elements are positioned on your\
    \ webpage. As the name may suggest to you, relative positioning allows you to\
    \ position an element *relative to where it would otherwise be located*. We make\
    \ use of relative positioning with the `position: relative;` property and value\
    \ pairing. However, that’s only part of the story.\n\nLet’s explain how this works.\
    \ Consider our previous example where two `<span>` elements are sitting within\
    \ their container."
  merge: -1
  img_proc: true
- pgno: 421
  md: "```\n<div class=\"container\">\n    <span class=\"yellow\">Span 1</span>\n\
    \    <span class=\"red\">Span 2</span>\n</div>\n\n.container {\n    border: 1px\
    \ solid black;\n    height: 200px;\n}\n\n.yellow {\n    background-color: yellow;\n\
    \    border: 1px solid black;\n}\n\n.red {\n    background-color: red;\n    border:\
    \ 1px solid black;\n}\n```\n\nThis produces the following result – just as we\
    \ would expect. Note that we have artificially increased the height of our container\
    \ element to 200 pixels. This will allow us more room with which to play.\n\n\
    ![](img/75169a27287f7c945bf2cbf7dede5251_421_0.png)\n\nNow let’s attempt to position\
    \ our .red <span> element relatively. First, we apply position: relative to our\
    \ .red class, like so."
  merge: -1
  img_proc: true
- pgno: 422
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 423
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 424
  md: "```\n.red {\n    background-color: red;\n    border: 1px solid black;\n   \
    \ float: right;\n    position: relative;\n    right: 100px;\n}\n```\n\n![](img/75169a27287f7c945bf2cbf7dede5251_424_0.png)\n\
    \nThis means that relative positioning works from the position at which the element\
    \ would have otherwise been at – regardless of any other position changing properties\
    \ being applied.\n\n# Absolute Positioning\n\nOur final positioning technique\
    \ is *absolute positioning*. While we still modify the `position` parameter of\
    \ a style, we use `absolute` as the value instead of `relative`. In contrast to\
    \ relative positioning, absolute positioning places an element *relative to its\
    \ first parent element that has a position value other than static*. This may\
    \ sound a little bit confusing, but let’s go through it step by step to figure\
    \ out what exactly happens.\n\nFirst, we can again take our earlier example of\
    \ the two coloured <span> elements within a <div> container. The two <span> elements\
    \ are placed side-by-side as they would naturally.\n\n```\n<div class=\"container\"\
    >\n    <span class=\"yellow\">Span 1</span>\n    <span class=\"red\">Span 2</span>\n\
    </div>\n```"
  merge: -1
  img_proc: true
- pgno: 425
  md: "```\n```css\n.container {\n    border: 1px solid black;\n    height: 70px;\n\
    }\n\n.yellow {\n    background-color: yellow;\n    border: 1px solid black;\n\
    }\n\n.red {\n    background-color: red;\n    border: 1px solid black;\n}\n```\n\
    ```\n\nThis produces the output shown below. Note that we again set our `.container`\
    \ height to an artificial value of 70 pixels to give us more room.\n\n![](img/75169a27287f7c945bf2cbf7dede5251_425_0.png)\n\
    \nWe now apply absolute positioning to our `.red` element.\n\n```\n```css\n.red\
    \ {\n    background-color: red;\n    border: 1px solid black;\n    position: absolute;\n\
    }\n```\n```\n\nLike with relative positioning, this has no overall effect on the\
    \ positioning of our red element in the webpage. We must apply one or more of\
    \ top, bottom, left or right for a new position to take effect. As a demonstration,\
    \ we can apply top and left properties to our red element like in the example\
    \ below."
  merge: -1
  img_proc: true
- pgno: 426
  md: "```\n.red {\n    background-color: red;\n    border: 1px solid black;\n   \
    \ position: absolute;\n    top: 0;\n    left: 0;\n}\n```\n\n![](img/75169a27287f7c945bf2cbf7dede5251_426_0.png)\n\
    \nWow, what happened here? Our red element is now positioned outside of our container!\
    \ You'll note that if you run this code within your web browser window, the red\
    \ element appears in the top left-hand corner of the viewport. This therefore\
    \ means that when applying top, bottom, left and right properties to an element\
    \ with absolute positioning, it is positioned absolutely within the viewport –\
    \ with (0,0) at the top left.\n\nAs our container element’s position is by default\
    \ set to position: static, the red and yellow elements are moving to the top left\
    \ and bottom right of our screen respectively. Let’s now modify our .yellow class\
    \ to move the yellow <span> to 5 pixels from the bottom right-hand corner of our\
    \ page. The .yellow class now looks like the example below.\n\n```\n.yellow {\n\
    \    background-color: yellow;\n    border: 1px solid black;\n    position: absolute;\n\
    \    bottom: 5px;\n    right: 5px;\n}\n```\n\nThis produces the following result."
  merge: -1
  img_proc: true
- pgno: 427
  md: "But what if we don’t want our elements to be positioned absolutely with respect\
    \ to the entire page? More often than not, we’ll be looking to adjusting the positioning\
    \ of our elements with respect to a container. If we recall our definition for\
    \ absolute positioning, we will note that absolute positions are calculated *relative\
    \ to the first parent element that has a position value other than static*. As\
    \ our container is the only parent for our two <span> elements, the container\
    \ to which the absolutely positioned elements is therefore the <body> of our HTML\
    \ page. We can change this by adding position: relative to our .container class,\
    \ just like in the example below.\n\n```\n.container {\n  border: 1px solid black;\n\
    \  height: 70px;\n  position: relative;\n}\n```\n\nThis produces the following\
    \ result. .container becomes the first parent element with a position value of\
    \ anything other than relative, meaning our <span> elements latch on!\n\n![](img/75169a27287f7c945bf2cbf7dede5251_427_0.png)\n\
    \nOur elements are now absolutely positioned in relation to .container. Great!\
    \ Now, let’s adjust the positioning values of our two <span> elements to move\
    \ them around."
  merge: -1
  img_proc: true

- pgno: 61
  md: '# Test your Configuration


    As a small exercise, test to see if everything is working correctly. Try and view
    the `rango.jpg` image in your browser when the Django development server is running.
    If your `STATIC_URL` is set to `/static/` and `rango.jpg` can be found at `images/rango.jpg`,
    what is the complete URL that you would enter into your web browser’s window to
    access this resource?


    **Try to figure this out before you move on! It’ll help you understand how to
    interpret static URLs.** The answer is coming up if you are struggling to figure
    it out.


    # Don’t Forget the Slashes!


    When setting `STATIC_URL`, check that you end the URL you specify with a forward
    slash (e.g. `/static/`, not `/static`). As per the [official Django documentation](https://docs.djangoproject.com/en/2.1/ref/settings/#std:setting-STATIC_URL),
    not doing so can open you up to a world of pain. The extra slash at the end ensures
    that the root of the URL (e.g. `/static/`) is separated from the static content
    you want to serve (e.g. `images/rango.jpg`).


    # Serving Static Content


    While using the Django development server to serve your static media files is
    fine for a development environment, it’s highly unsuitable for a production environment.
    The [official Django documentation on deployment](https://docs.djangoproject.com/en/2.1/howto/static-files/deployment/)
    provides further information about deploying static files in a production environment.
    We’ll look at this issue in more detail however when we [deploy Rango].


    If you haven’t managed to figure out where the image should be accessible from,
    point your web browser to `http://127.0.0.1:8000/static/images/rango.jpg`.


    # Static Media Files and Templates


    Now that you have your Django project set up to handle static files, you can now
    make use of these files within your templates to improve their appearance and
    add additional functionality.'

- pgno: 432
  md: "![](img/75169a27287f7c945bf2cbf7dede5251_432_0.png)\n\nWhile we may have the\
    \ correct orientation, our list now looks awful. Where does one element start\
    \ and the other end? It’s a complete mess! Let’s adjust our list element style\
    \ and add some contrast and padding to make things look nicer.\n\n```\n.example-list\
    \ li {\n    display: inline;\n    background-color: #333333;\n    color: #FFFFFF;\n\
    \    padding: 10px;\n}\n```\n\nWhen applied, our list looks so much better – and\
    \ quite professional, too!\n\n![](img/75169a27287f7c945bf2cbf7dede5251_432_1.png)\n\
    \nFrom the example, it is hopefully clear that lists can be easily customised\
    \ to suit the requirements of your webpages. For more information and inspiration\
    \ on how to style lists, you can check out some of the selected links below.\n\
    \n+   - Have a look at this excellent tutorial on styling lists on A List Apart¹⁴⁴.\n\
    +   - Check out this advanced tutorial from Web Designer Wall¹⁴⁵ that uses graphics\
    \ to make awesome looking lists. In the tutorial, the author uses Photoshop –\
    \ you could try using a simpler graphics package if you don’t feel confident with\
    \ Photoshop.\n+   - This site¹⁴⁶ provides some great inspiration and tips on how\
    \ you can style lists.\n\nThe possibilities of styling lists are endless! You\
    \ could say it’s a never-ending list...\n\n¹⁴⁴ https://alistapart.com/article/taminglists/\n\
    ¹⁴⁵ https://webdesignerwall.com/tutorials/advanced-css-menu\n¹⁴⁶ https://learn.shayhowe.com/html-css/creating-lists/"
  merge: -1
  img_proc: true
- pgno: 433
  md: "# Styling Links\n\nCSS provides you with the ability to easily style hyperlinks\
    \ in any way you wish. You can change their colour, their font or any other aspect\
    \ that you wish – and you can even change how they look when you hover over them!\n\
    \nHyperlinks are represented within an HTML page through the <a> tag, which is\
    \ short for anchor. We can apply styling to all hyperlinks within your webpage\
    \ as shown in the following example.\n\n```\na {\n  color: red;\n  text-decoration:\
    \ none;\n}\n```\n\nEvery hyperlink’s text colour is changed to red, with the default\
    \ underline of the text removed. If we then want to change the color and text-decoration\
    \ properties again when a user hovers over a link, we can create another style\
    \ using the so-called pseudo-selector :hover. Our two styles now look like the\
    \ example below.\n\n```\na {\n  color: red;\n  text-decoration: none;\n}\n\na:hover\
    \ {\n  color: blue;\n  text-decoration: underline;\n}\n```\n\nThis produces links\
    \ as shown below. Notice the change in colour of the second link – it is being\
    \ hovered over.\n\n![](img/75169a27287f7c945bf2cbf7dede5251_433_0.png)\n\nHowever,\
    \ you may not wish for the same link styles across the entire webpage. For example,\
    \ your navigation bar may have a dark background while the rest of your"

    # Testing in Django


    This chapter provides the very basics of testing with Django, and follows a similar
    structure to the [Django Tutorial](https://docs.djangoproject.com/en/2.1/intro/tutorial05/)
    – with some additional notes. If there is a strong desire from readers for us
    to expand this chapter further, we will! Get in touch if you think this would
    be advantageous to you.


    # 18.1 Running Tests


    Django comes complete with a suite of tools to test the apps that you build. You
    can test your developed Rango app by using the terminal or Command Prompt. Simply
    issue the following command, and observe the output you see.


    ```

    ```text

    $ python manage.py test rango


    Creating test database for alias ''default''...


    -----------------------------------------------------------------

    Ran 0 tests in 0.000s


    OK

    Destroying test database for alias ''default''...

    ```

    ```


    This command will run through all tests that have been created for the Rango app.
    However, at the moment, nothing much happens. This is because the tests.py that
    lives inside the rango app directory is pretty much blank, except for a single
    import'

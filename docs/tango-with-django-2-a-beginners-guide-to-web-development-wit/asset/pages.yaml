    While you won’t be using the lightweight development server to deploy your application,
    it’s nice to be able to demo your application on another machine in your network.
    Running the server with your machine’s IP address will enable others to enter
    in `http://<your_machines_ip_address>:<port>/` and view your web application.
    **Of course, this will depend on how your network is configured. There may be
    proxy servers or firewalls in the way that would need to be configured before
    this would work. Check with the administrator of the network you are using if
    you can’t view the development server remotely.**


    # 3.3 Creating a Django App


    A Django project is a collection of *configurations* and *apps* that together
    make up a given web application or website. One of the intended outcomes of using
    this approach is to promote good software engineering practices. By developing
    a series of small applications, the idea is that you can theoretically drop an
    existing application into a different Django project and have it working with
    minimal effort.


    A Django application exists to perform a particular task. You need to create specific
    apps that are responsible for providing your site with particular kinds of functionality.
    For example, we could imagine that a project might consist of several apps including
    a polling app, a registration app, and a specific content related app. In another
    project, we may wish to re-use the polling and registration apps, and so can include
    them in other projects. We will talk about this later. For now, we are going to
    create the app for the *Rango* app.


    To achieve this, you need to make sure you’re in your Django project’s directory
    (e.g. `<workspace>/tango_with_django_project`). From there, run the following
    command.


    ```

    ```bash

    $ python manage.py startapp rango

    ```

    ```'

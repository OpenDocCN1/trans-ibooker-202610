- pgno: 253
  md: '+   4. Finally, you should add a link in the `base.html` navigation bar called
    *Profile*. This link should only be available to users who are logged in (those
    that pass the check `{% if user.is_authenticated %}`).


    To allow users to browse through other user profiles, you can also create a *users
    page* that lists all users registered on Rango. If you click on a username, you
    will then be redirected to their *profile page*. However, **you must ensure that
    a user is only able to edit their profile**, and that logged in users can see
    the users page!


    To allow users to view different profiles, you’ll need to tweak the URL mapping
    to allow for the provision of a username, too. Instead of simply using `/rango/profile/`,
    you should allow for a username using the mapping `/rango/profile/<username>/`.
    For this to work, you will, of course, need to update the view you create, too.


    # Referencing Uploaded Content in Templates


    If you have completed all of the *Templates and Media Files* chapter, your Django
    setup should be ready to deal with the uploading and serving of user-defined media
    files (in this case, profile images). You should be able to reference the `MEDIA_URL`
    URL (defined in `settings.py`) in your templates through use of the `{% MEDIA_URL
    %}` tag, provided by the [media template context processor](https://docs.djangoproject.com/en/2.1/howto/static-files/).
    We asked you to try this out as an exercise much earlier in the book. Displaying
    an image `cat.jpg`, the associated HTML markup would be `<img src="{% MEDIA_URL
    %}cat.jpg">`.


    The next chapter provides you with complete solutions to each of the exercises
    we outlined here. Try and do as much of them as you can by yourself without turning
    over to the next chapter!'

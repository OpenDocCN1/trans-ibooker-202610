    # 17.3 Adding Inline Category Suggestions


    With a simple AJAX example implemented, let’s try something more complex. Let’s
    imagine a scenario where Rango has been populated with dozens of categories. If
    a user wishes to find one specific category, they would currently need to examine
    a long list of categories. That’s annoying!


    A faster way to allow users to find the category they are looking for would be
    to provide a suggestion component. Users can start typing in the name of the category
    they are searching for, and Rango would respond with a list of suggested categories
    that the user can then select from. In essence, this feature would provide a form
    of *filtering* to allow the user to narrow down the options available to him or
    her.


    We can, of course, achieve this with AJAX. Whenever the user types in a letter
    from their keyboard, we can send a request off to the Django server, and ask it
    to return'

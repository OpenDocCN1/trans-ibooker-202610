  md: "```\n# until we're ready to avoid integrity problems.\nprofile = profile_form.save(commit=False)\n\
    profile.user = user\n\n# Did the user provide a profile picture?\n# If so, we\
    \ need to get it from the input form and\n#put it in the UserProfile model.\n\
    if 'picture' in request.FILES:\n    profile.picture = request.FILES['picture']\n\
    \n# Now we save the UserProfile model instance.\nprofile.save()\n\n# Update our\
    \ variable to indicate that the template\n# registration was successful.\nregistered\
    \ = True\nelse:\n    # Invalid form or forms - mistakes or something else?\n \
    \   # Print problems to the terminal.\n    print(user_form.errors, profile_form.errors)\n\
    else:\n    # Not a HTTP POST, so we render our form using two ModelForm instances.\n\
    \    # These forms will be blank, ready for user input.\n    user_form = UserForm()\n\
    \    profile_form = UserProfileForm()\n\n# Render the template depending on the\
    \ context.\nreturn render(request,\n    'rango/register.html',\n    context =\
    \ {'user_form': user_form,\n               'profile_form': profile_form,\n   \
    \            'registered': registered})\n```\n\nWhile the view looks pretty complicated,\
    \ it’s actually very similar to how we implemented the add category and add page\
    \ views. However, the key difference here is that we have to handle two distinct\
    \ ModelForm instances – one for the User model, and one for the UserProfile model.\
    \ We also need to handle a user’s profile image, if he or she chooses to upload\
    \ one.\n\nOne trick we use here that has caught many people out in the past is\
    \ the use of commit=False when saving the UserProfile form. This stops Django\
    \ from saving the"

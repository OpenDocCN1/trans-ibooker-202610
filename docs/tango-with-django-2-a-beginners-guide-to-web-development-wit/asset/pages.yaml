- pgno: 156
  md: '# 9. User Authentication


    Most web applications ask users to sign up and register, so that they can manage
    their account and have access to special features. For Rango, we want to control
    what actions are available to different users. Therefore, this next part of the
    tutorial aims to get you familiar with the basic user authentication mechanisms
    provided by Django. We’ll be using the auth app provided as part of a standard
    Django installation, located in package django.contrib.auth. According to the
    Django documentation on authentication¹, the app provides the following concepts
    and functionality.


    +   - The concept of a *User* and the *User Model*.

    +   - *Permissions*, a series of binary flags (e.g. yes/no) that determine what
    a user may or may not do.

    +   - *Groups*, a method of applying permissions to more than one user.

    +   - A configurable *password hashing system*, a must for ensuring data security.

    +   - *Forms and view tools for logging in users*, or restricting content.


    There’s lots that Django can do for you regarding user authentication. In this
    chapter, we’ll be covering the basics to get you started. This will help you build
    your confidence with the available tools and their underlying concepts. Note that
    we’ll be showing you how to set up the user authentication manually, from first
    principles using Django, but in a later chapter we will show you how we can use
    a pre-made application that handles the registration process for us.


    # 9.1 Setting up Authentication


    Before you can begin to play around with Django’s authentication offering, you’ll
    need to make sure that the relevant settings are present in your Rango project’s
    `settings.py` file.'
  merge: -1
  img_proc: true
- pgno: 157
  md: "Within the `settings.py` file find the `INSTALLED_APPS` list. Once you’ve found\
    \ it, check that `django.contrib.auth` and `django.contrib.contenttypes` are listed,\
    \ so that the list then looks similar to the example below.\n\n```\nINSTALLED_APPS\
    \ = [\n    'django.contrib.admin',\n    'django.contrib.auth',\n    'django.contrib.contenttypes',\n\
    \    'django.contrib.sessions',\n    'django.contrib.messages',\n    'django.contrib.staticfiles',\n\
    \    'rango',\n]\n```\n\nWhile `django.contrib.auth` provides Django with access\
    \ to the provided authentication system, the package `django.contrib.contenttypes`\
    \ is used by the authentication app to track models installed in your database.\n\
    \n# Migrate, if necessary!\n\nIf you had to add `django.contrib.auth` and `django.contrib.contenttypes`\
    \ applications to your `INSTALLED_APPS` tuple, you will need to update your database\
    \ with the `$ python manage.py migrate` command. This will add the underlying\
    \ tables to your database e.g. a table for the User model.\n\nIt’s generally good\
    \ practice to run the `migrate` command whenever you add a new app to your Django\
    \ project – the app could contain models that’ll need to be synchronised to your\
    \ underlying database.\n\n# 9.2 Password Hashing\n\n*Storing passwords as plaintext\
    \ within a database is something that should never be done under any circumstances.*²\
    \ If the wrong person acquired a database full of user accounts to your app, they\
    \ could wreak havoc. Fortunately, Django’s auth app by default\n\n²http://stackoverflow.com/questions/1197417/why-are-plain-text-passwords-bad-and-how-do-i-convince-my-boss-that-his-treasur"

    +   - Update all other previously defined templates in the Rango app to extend
    from the new `base.html` template. Follow the same process as we demonstrated
    above. Once completed, your templates should all inherit from `base.html`.

    +   - While you’re at it, make sure you remove the links from our `index.html`
    template. We don’t need them anymore! This is because we moved them into `base.html`
    earlier. You can also remove the link to Rango’s homepage within the `about.html`
    template.

    +   - When you refactor `index.html` and `about.html`, keep the images that are
    served up from the static files and media server.

    +   - Update all references to Rango URLs by using the `url` template tag. You
    can also do this in your `views.py` module too – check out the [`reverse()` helper
    function](https://docs.djangoproject.com/en/2.1/ref/urlresolvers/#reverse). Don’t
    forget to update the URLs provided in the `action` attributes of your `<form>`

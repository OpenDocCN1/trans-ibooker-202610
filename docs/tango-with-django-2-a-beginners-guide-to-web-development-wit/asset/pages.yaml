    \ to learn more about the different tags.\n\n![](img/75169a27287f7c945bf2cbf7dede5251_112_0.png)\n\
    \n# Note on Conditional Template Tags\n\nThe Django template conditional tag –\
    \ represented with `{% if condition %}` – is a really neat way of determining\
    \ the existence of an object within the template’s context. Make sure you check\
    \ the existence of an object to avoid errors when rendering your templates, especially\
    \ if your associated view’s logic doesn’t populate the context dictionary in all\
    \ possible scenarios.\n\nPlacing conditional checks in your templates – like `{%\
    \ if category %}` in the example above – also makes sense semantically. The outcome\
    \ of the conditional check directly affects how the rendered page is presented\
    \ to the user. Remember, presentational aspects of your Django apps should be\
    \ encapsulated within templates.\n\n# Parameterised URL Mapping\n\nNow let’s have\
    \ a look at how we pass the value of the `category_name_url` parameter to our\
    \ function `show_category()` function. To do so, we need to modify Rango’s `urls.py`\
    \ file (remember, the file located at `<workspace>/tango_with_django_project/rango/`),\
    \ and update the urlpatterns tuple as follows.\n\n```\n```python\nurlpatterns\
    \ = [\n    path('', views.index, name='index'),\n    path('about/', views.about,\
    \ name='about'),\n    path('category/<slug:category_name_slug>/',\n         views.show_category,\
    \ name='show_category'),\n]\n```\n```\n\nA parameter, represented by `<slug:category_name_slug>`,\
    \ is added to a new mapping. This indicates to Django that we want to match a\
    \ string which is a slug, and to assign it to variable `category_name_slug`. You\
    \ will notice that this variable"

  \ 上的练习实现]。让我们开始跟踪页面点击！\n\n### 14.1 跟踪页面点击\n\n目前，Rango 为外部页面提供直接链接。虽然简单，但这种方法不允许我们记录每个页面收到的点击次数——点击会将你带离\

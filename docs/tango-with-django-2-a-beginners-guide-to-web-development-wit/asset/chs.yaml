  \ 元素的 value 属性。\n\n在 Rango 的 `show_category()` 视图中，找到处理搜索功能的代码块，并将查询添加到 `context_dict`\
  \ 中，如下所示。\n\n```python\n# Start new search functionality code.\nif request.method\
  \ == 'POST':\n    query = request.POST['query'].strip()\n\n    if query:\n     \
  \   context_dict['result_list'] = run_query(query)\n        context_dict['query']\
  \ = query\n# End new search functionality code.\n```\n\n完成此操作后，打开 Rango 的 `category.html`\
  \ 模板，并像这样修改查询 `<input>` 字段。\n\n```html\n<input class=\"form-control\"\n    type=\"\
  text\"\n    size=\"50\"\n    name=\"query\"\n    value=\"{{ query }}\"\n    id=\"\
  query\" />\n```\n\n模板变量 `{{ query }}` 将被用户的查询替换，从而在页面加载时将其设置为 `<input>` 字段的默认值。\n\
  \n一旦所有工作完成，你应该会得到一个与下面示例类似的分类页面。干得好！\n\n![](img/75169a27287f7c945bf2cbf7dede5251_263_0.png)\n\
  \nRango 更新后的分类视图，集成了 Bing 搜索 API 的搜索功能。还要注意搜索框中包含了搜索词——它们仍然被保留！\n\n## 15.3 创建 UserProfile\
  \ 实例\n\n本部分提供了一种与 django-registration-redux 包结合创建 Rango UserProfile 账户的解决方案。回想一下，标准的\
  \ `django.contrib.auth.models.User` 模型包含几个与用户账户相关的标准字段，例如用户名和密码。然而，我们选择在 Rango 中实现一个额外的\
  \ `UserProfile` 模型，以存储额外信息，例如用户的网站 URL 和个人资料图片。在这里，我们将逐步介绍实现此功能所需的步骤。我们将处理的步骤列在下面，每一步都对应下面的一个小节。\n\
  \n1. 我们首先将创建一个新的 `profile_registration.html` 模板，该模板将是我们现有的 `UserProfileForm` Django\
  \ 表单。\n2. 然后我们将创建一个新的 `register_profile()` 视图，以捕获新 `UserProfile` 实例的详细信息。\n3. 之后，应用标准流程。我们首先将新视图映射到一个新的\
  \ URL——在本例中，该 URL 是 `/rango/register_profile/`。尽管这涉及用户账户，但它是 *Rango 特有* 的，因此将其放在\
  \ `/rango/` URL 模式中是有意义的。\n4. 然后我们需要为 `django-registration-redux` 包编写一些代码，告诉它在创建\
  \ User 对象时重定向到另一个地方——换句话说，将用户重定向到新的 `/rango/register_profile/` URL。\n\n第四步需要一些额外的代码，这些代码需要一些\
  \ `django-registration-redux` 包的专业知识。我们已经为你处理好了，但我们会指出相关文档的相关部分，向你展示我们是如何弄清楚一切的。\n\
  \n完成后，用户注册 Rango 的基本流程/体验如下。\n\n1. 用户将跳转到 Rango 网站。\n2. 然后他们会点击导航栏上的 `Register Here`\
  \ 链接。\n3. 然后他们会被重定向到 `django-registration-redux` 注册表单。该表单位于 `/accounts/register`\
  \ URL。\n4. 一旦此表单填写完成，表单将被提交并处理。如果成功，他们将被重定向到新的 `/rango/register_profile/` 页面，允许他们创建\
  \ `UserProfile` 实例。\n5. 完成并提交后，用户将被重定向到主页。注册随即完成。\n\n这里的顺序很重要，因为我们实现新 `register_profile()`\
  \ 视图的方式将假定用户事先已创建了标准 User 实例。这将用于关联他们的新 UserProfile 实例并确保保持引用完整性！\n\n### 创建个人资料注册模板\n\
  \n首先，让我们专注于创建一个简单的模板，该模板将提供必要的 HTML 标记来显示 UserProfileForm 表单字段。如前所述，我们将 django-registration-redux\
  \ 表单与新的个人资料注册表单分开——这个新模板将属于 rango 模板目录。请记住，我们在这里处理的不是内置的 Django 模型——我们处理的是自定义模型实例的创建。\n\
  \n在 `templates/rango/` 中创建一个名为 `profile_registration.html` 的新模板。在此新模板中，添加以下 HTML\
  \ 标记和 Django 模板代码。\n\n```html\n{% extends 'rango/base.html' %}\n{% load staticfiles\
  \ %}\n\n{% block title_block %}\n    Register - Step 2\n{% endblock %}\n\n{% block\
  \ body_block %}\n<div class=\"jumbotron p-4\">\n    <div class=\"container\">\n\
  \        <h1 class=\"jumbotron-heading\">Register Here - Step 2</h1>\n    </div>\n\
  </div>\n\n<div class=\"container\">\n    <div class=\"row\">\n        <form method=\"\
  post\"\n              action=\"{% url 'rango:register_profile' %}\"\n          \
  \    enctype=\"multipart/form-data\">\n            {% csrf_token %}\n          \
  \  {{ form.as_p }}\n            <input type=\"submit\" value=\"Create Profile\"\
  \ />\n        </form>\n    </div>\n</div>\n{% endblock %}\n```\n\n与我们之前创建的 django-registration-redux\
  \ 表单（此处有示例）一样，此模板继承自 Rango 的 base.html 模板。回想一下\n\n\n此模板包含了我们 Rango 应用的基本布局。我们还在\
  \ `body_block` 块中创建了一个 HTML `<form>`。该表单将填充来自表单对象的字段，这些字段将由相应的视图传递给模板——我们下一步就来处理这件事。你还应该注意我们使用的新\
  \ URL 映射 `register_profile`。我们将在第三步中定义它。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_266_0.png)\n\
  \n## 别忘了 `multipart/form-data`！\n\n在创建表单时，别忘了在 `<form>` 标签中包含 `enctype=\"multipart/form-data\"\
  ` 属性。我们需要设置该属性，以[告知 Web 浏览器和服务器不使用任何字符编码](https://stackoverflow.com/questions/4526273/what-does-enctype-multipart-form-data-mean)。为什么？因为在这里，我们可能会执行文件*上传*（用户头像图片）。如果你不包含此属性，使用此表单上传图片将无法工作。\n\
  \n## 创建个人资料注册视图\n\n此过程的第二步是为我们新的 `profile_registration.html` 模板创建相应的视图。这个新视图将处理我们在[用户认证章节](#)中创建的\
  \ `UserProfileForm` 表单，并指示 Django 使用我们的新模板渲染任何响应。\n\n到目前为止，你应该能够很直接地实现这一系列操作。处理表单意味着能够处理渲染表单的请求（通过\
  \ HTTP GET 请求），并能够处理任何输入的信息（通过 HTTP POST 请求）。下面展示了该视图的一种可能实现。你可以将其添加到 Rango 的 `views.py`\
  \ 模块中。\n\n```python\n@login_required\ndef register_profile(request):\n    form =\
  \ UserProfileForm()\n\n    if request.method == 'POST':\n        form = UserProfileForm(request.POST,\
  \ request.FILES)\n\n        if form.is_valid():\n            user_profile = form.save(commit=False)\n\
  \            user_profile.user = request.user\n            user_profile.save()\n\
  \n            return redirect(reverse('rango:index'))\n        else:\n         \
  \   print(form.errors)\n\n    context_dict = {'form': form}\n    return render(request,\
  \ 'rango/profile_registration.html', context_dict)\n```\n\n请记住，还要检查 `views.py` 模块顶部是否有相关的导入语句。到目前你应该已经从前面的章节中拥有了所有这些语句，但无论如何检查一下是好的！\n\
  \n```python\nfrom django.contrib.auth.decorators import login_required\nfrom rango.forms\
  \ import UserProfileForm\nfrom django.shortcuts import render, redirect\n```\n\n\
  在创建新的 `UserProfileForm` 实例后，我们检查请求对象以确定发出的是 GET 还是 POST 请求。如果请求是 POST，我们将重新创建 `UserProfileForm`，这次使用从\
  \ POST 请求（`request.POST`）收集的数据。由于我们还处理文件图片上传（用户头像图片），我们还需要从 `request.FILES` 中提取上传的文件。然后我们检查提交的表单是否有效——这意味着表单字段是否正确填写。在这种情况下，我们实际上只需要检查提供的\
  \ URL 是否有效——因为 URL 和头像字段是可选的（我们在 `UserProfile` 模型中为网站和图片字段都指定了 `blank=True` 属性）。\n\
  \n有了有效的 `UserProfileForm`，我们就可以通过 `user_profile = form.save(commit=False)` 这行代码创建\
  \ `UserProfile` 模型的新实例。设置 `commit=False` 让我们有时间在将新的 `UserProfile` 实例提交到数据库之前对其进行操作。这时我们可以添加必要的步骤，将新的\
  \ `UserProfile` 实例与关联的 `User` 实例关联起来（请参考[本部分顶部](#)的用户流程/体验列表以刷新记忆）。在保存新的 `UserProfile`\
  \ 实例后，我们使用 `reverse()` URL 查找将拥有新账户的用户重定向到 Rango 的索引视图。如果表单验证因任何原因失败，错误将简单地打印到控制台。你很可能希望以更好的方式处理这种情况，使错误处理更健壮，从而对用户更直观。\n\
  \n如果请求是以 HTTP GET 方式发送的，那么用户只是想要一个空表单来填写。在这种情况下，我们通过简单地渲染上面创建的 `rango/profile_registration.html`\
  \ 模板来响应，并传入一个空白的 `UserProfileForm` 实例，作为 `form` 传递给渲染上下文字典。这样做满足了我们在新模板中先前创建的要求。\n\
  \n因此，这个解决方案应该处理所有需要的场景，用于创建、解析和保存来自 `UserProfileForm` 表单的数据。\n\n### 为什么使用 `login_required`？\n\
  \n请记住，一旦新注册的用户访问此视图，他们就已经被创建了新账户。这意味着我们可以安全地假设他或她现在已登录 Rango。这就是为什么我们在视图顶部使用 `@login_required`\
  \ 装饰器，以防止未经授权的个人访问该视图。\n\n有关身份验证的更多详细信息，请参阅 [Django 文档](https://docs.djangoproject.com/en/2.1/topics/auth/default/)³。\n\
  \n### 将 `register_profile()` 视图映射到 URL\n\n既然我们的模板和相应的视图已经实现，一位经验丰富的 Django 开发者应该会想到：*映射它！*\
  \ 我们需要将新视图映射到一个 URL，以便用户可以访问新创建的内容。打开 Rango 的 `urls.py` 模块，并将以下行添加到 `urlpatterns`\
  \ 列表中即可实现这一点。**位于 accounts/ URL 的现有条目之后——不是之前！** 为了确保你将其放在正确的位置，我们提供了你的 `urlpatterns`\
  \ 列表应该是什么样子的完整副本。\n\n```python\nurlpatterns = [\n    path('', views.index, name='index'),\n\
  \    path('rango/', include('rango.urls')),\n    path('admin/', admin.site.urls),\n\
  \n    # New line below - don't forget the slash after register!\n    path('accounts/register/',\n\
  \         MyRegistrationView.as_view(),\n         name='registration_register'),\n\
  \n    path('accounts/', include('registration.backends.simple.urls')),\n] + static(settings.MEDIA_URL,\
  \ document_root=settings.MEDIA_ROOT)\n```\n\n这会覆盖标准的开箱即用的 django-registration-redux\
  \ urls.py 模块中现有的 `registration_register` URL 映射，并将我们跳转到的 URL 替换为指向我们新的基于类的视图的映射。\n\
  \n## 15.4 基于类的视图\n\n那么，什么是基于类的视图？在上面示例解决方案中，我们到底实现了什么？基于类的视图是一种更复杂、更优雅的处理请求的机制。我们目前在本教程中一直采用函数式方法——即在\
  \ Rango 的 `views.py` 模块中创建*函数*来服务请求——而基于类的方法则是创建继承并实现一系列方法来处理应用请求的类。\n\n例如，基于类的视图不是检查请求是否为\
  \ HTTP GET 或 HTTP POST，而是允许你在处理给定视图请求的类中实现 `get()` 和 `post()` 方法。当你的项目和处理器变得更加复杂时，使用基于类的方法是更可取的解决方案。你可以查看\
  \ [Django 文档了解更多关于基于类的视图的信息](https://docs.djangoproject.com/en/2.1/topics/class-based-views/)。\n\
  \n为了让你更了解基于类的视图是如何工作的，让我们尝试将 `about()` 视图从基于函数的方法转换为基于类的方法。首先，在 Rango 的 `views.py`\
  \ 模块中，定义一个名为 `AboutView` 的类，该类继承自 `View` 基类。这个基类需要从 `django.views` 导入，如下面的示例代码所示。\n\
  \n```python\nfrom django.views import View\n\nclass AboutView(View):\n    def get(self,\
  \ request):\n        context_dict = {}\n\n        visitor_cookie_handler(request)\n\
  \        context_dict['visits'] = request.session['visits']\n\n        return render(request,\n\
  \                      'rango/about.html',\n                      context_dict)\n\
  ```\n\n请注意，我们只是将现有 `about()` 基于函数的视图中的代码，添加到新基于类的 `AboutView` 方法的 `get()` 方法中。\n\
  \n### 在类中定义方法\n\n在 Python 的类中定义方法时，该方法必须始终至少接受一个参数 `self`。`self` 表示正在使用的类实例，你可以通过它访问实例中的其他方法，或使用\
  \ `self.object_name` 定义的实例变量。这与使用 `this.` 方法在 Java 中访问特定于实例的项目是相同的技术。\n\n你可以在 Python\
  \ 类中创建静态方法，这意味着无需传递 `self` 参数——但你应该使用 `staticmethod` 装饰器。这更高级，我们这里不使用静态方法。不过，你可以[在线阅读更多相关信息](https://docs.python.org/3/library/functions.html#staticmethod)。\n\
  \n接下来，你需要更新 Rango 的 `urls.py` 模块。找到并更新 `urlpatterns` 列表中处理 about 映射的条目，以使用新的 `AboutView`。\n\
  \n\n\n\n\n```python\nurlpatterns = [\n    ...\n\n    # Updated path that points\
  \ to the new about class-based view.\n    path('about/', views.AboutView.as_view(),\
  \ name='about')\n\n    ...\n]\n```\n\n由于我们现有的导入语句只是导入了 Rango 的 `views.py`，因此我们必须指定\
  \ `views.AboutView`，以精确告诉 Python 新类的位置。当然，你始终可以单独导入 `AboutView`，如下面的示例所示。\n\n```python\n\
  from rango.views import AboutView\n\nurlpatterns = [\n    ...\n\n    # Updated path\
  \ that points to the new about class-based view.\n    path('about/', AboutView.as_view(),\
  \ name='about')\n\n    ...\n]\n```\n\n注意，我们还调用了 `as_view()` 函数。这是基础 `View` 类的一部分，它提供了必要的代码，让\
  \ Django 能够使用你在 `get()` 方法中定义的逻辑来处理视图。\n\n对于这样一个简单的视图，你可能会觉得改用基于类的方法并不会节省多少时间或空间。不过，现在你应该已经明白其中的思路了——而且你应该能够开始重构更复杂的视图，使其使用基于类的方法。\n\
  \n一个同时考虑 HTTP GET 和 HTTP POST 的较复杂视图可以是 `add_category()` 视图。要将其从基于函数的视图转换为基于类的视图，我们可以在\
  \ Rango 的 `views.py` 中创建一个新的 `AddCategoryView` 类。然后，我们就可以开始将代码从函数迁移到新类中，如下所示。仔细看看\
  \ `get()` 和 `post()` 方法中的代码——它们来自哪里呢？\n\n```python\nclass AddCategoryView(View):\n\
  \    @method_decorator(login_required)\n    def get(self, request):\n        form\
  \ = CategoryForm()\n        return render(request, 'rango/add_category.html', {'form':\
  \ form})\n\n    @method_decorator(login_required)\n    def post(self, request):\n\
  \        form = CategoryForm(request.POST)\n\n        if form.is_valid():\n    \
  \        form.save(commit=True)\n            return redirect(reverse('rango:index'))\n\
  \        else:\n            print(form.errors)\n\n        return render(request,\
  \ 'rango/add_category.html', {'form': form})\n```\n\n将你目前在 `add_category()` 函数式视图中编写的代码与上面的代码进行比较——HTTP\
  \ `get()` 请求的逻辑镜像到了 `get()` 方法中，HTTP POST 请求的逻辑同样镜像到了 `post()` 方法中。你还会注意到，我们使用了一个名为\
  \ `method_decorator` 的新装饰器函数。这需要导入，因此请在 `views.py` 模块顶部添加以下导入语句。\n\n```python\n\
  from django.utils.decorators import method_decorator\n```\n\n通过将 `@method_decorator(login_required)`\
  \ 同时关联到 `get()` 和 `post()` 方法，我们可以确保未登录 Rango 的用户无法访问这两个方法。如果我们从 `get()` 方法中移除装饰器，你觉得会发生什么？用户将看到添加新类别的表单，但由于\
  \ `post()` 方法仍然受保护，未登录的用户将无法创建新类别！\n\n## 为什么需要 @method_decorator？\n\n我们需要 `@method_decorator`，因为函数装饰器需要被转换为方法装饰器⁶——`method_decorator()`\
  \ 可以为我们实现这一点。\n\n> ⁶ https://docs.djangoproject.com/en/2.2/topics/class-based-views/intro/#decorating-the-class\n\
  \n最后一件事——我们还需要更新 Rango 的 `urls.py` 模块，以反映我们现在要使用基于类的视图这一事实。在 `urlpatterns` 列表中，找到\
  \ `add_category` 映射，并将该条目修改为如下示例所示。\n\n```python\npath('add_category/', views.AddCategoryView.as_view(),\
  \ name='add_category'),\n```\n\n仔细观察这个示例，我们只是更改了目标视图。我们不再指向 `add_category()` 视图，而是指向新的\
  \ `AddCategoryView` 类——并调用 Django 提供的 `as_view()` 方法，该方法会根据收到的请求将控制权传递给我们相应的某个方法（我是要执行\
  \ `get()` 还是 `post()` 呢？）。\n\n## 类视图练习\n\n既然你已经了解了在 Django 中实现类视图的基础知识，现在正是动手实践的好时机。\n\
  \n- 查看 [Django 文档](https://docs.djangoproject.com/en/2.1/topics/class-based-views/)，寻找更多关于如何创建类视图的示例。\n\
  - 更新你的 Rango 应用，确保 Rango 的 `views.py` 模块中的*所有*视图都使用类视图！\n  - 有一个节省时间的提示：请记住，你一直在使用的两个\
  \ `urls.py` 模块都引用了当前的 `index()` 视图！当你实现一个基于类的替代方案时，务必记住这一点。\n\n这不会像你想的那么耗时。最难的部分在于那些同时具有\
  \ HTTP GET 和 HTTP POST 功能的较复杂视图。能够区分每种请求类型的流程，并将必要的代码放入不同的方法中，这将检验你对代码的理解！\n\n在你完成这个练习时，我们还有几点希望你思考一下。我们将其作为单独的小贴士列在下面。\n\
  \n### 命名约定\n\n确保你的新类视图符合 [Python 命名约定](https://www.python.org/dev/peps/pep-0008/)是一种良好的实践。对于类，请使用\
  \ CamelCase（驼峰命名法）。将类名的开头大写，然后每个后续单词的首字母也大写——单词之间不留空格。因此，新的添加类别视图变为 `AddCategoryView`。在末尾加上\
  \ `View`，以确保以后查看你代码的人知道他们正在处理的是一个基于类的视图。\n\n类中的方法应遵循与命名函数相同的约定。使用小写名称，并用下划线分隔各个单词——例如\
  \ `some_method_name()`。\n\n### 映射 IndexView\n\n当你为旧的 `index()` 视图创建基于类的视图时，请注意你已经在\
  \ Rango 的 `urls.py` 模块*以及*项目的 `urls.py` 模块中对其进行了映射！\n\n### 传递 URL 参数\n\n之前你创建了一个\
  \ `show_category()` 视图。除了必需的 `request` 对象之外，它还接受一个 `category_name_slug`——这是一个*参数化视图*，参数来自\
  \ URL。对于所有以这种方式实现的视图，你需要确保它们基于类的等效视图不仅包含 `self` 和 `request` 作为参数，还要包含一个或多个 URL 参数。在上面的示例中，`get()`\
  \ 方法的定义可能如下所示。\n\n```python\nclass ShowCategoryView(View):\n    def get(self, request,\
  \ category_name_slug):\n        ...\n```\n\n如果你要处理同时具有 `get()` 和 `post()` 方法的视图，那么这两个方法都需要这个（或这些）参数！\n\
  \n### \U0001F511 类和辅助方法\n\n你可能会发现，在实现基于类的视图时，你会重复自己的代码。例如，在基于函数的 `show_category()`\
  \ 视图中，我们有一些相当冗长的代码，用于填充一个字典，作为传递给 `render()` 的上下文字典。这段代码对于 HTTP GET 和 HTTP POST\
  \ 请求都会执行。在基于类的实现中，一种解决方案是将这些代码简单地添加到 `get()` 和 `post()` 方法中……但请记住，[不要重复自己（DRY）](https://en.wikipedia.org/wiki/Don%E2%80%99t_repeat_yourself)！你如何设计一种解决方案，使得只需要一份生成上下文字典的代码实例？\n\
  \n一个可能的解决方案是在你的基于类的实现中创建一个*辅助方法*。你可以随意命名——但要成功为 `show_category()` 视图生成上下文字典的基础内容，你还需要\
  \ `category_name_slug`。你该如何实现这一点？我们在上面的提示中给了你一个暗示。一旦你弄明白了，你还可以将同样的技术应用到你代码中的其他类视图上。\n\
  \n## 15.5 查看你的个人资料\n\n现在，恢复使用 `UserProfile` 模型的代码已经就位，我们可以实现功能，允许用户查看自己的个人资料——并进行编辑。这个过程同样与我们之前多次完成的操作类似。我们需要考虑以下三步。\n\
  \n1. 首先，我们需要创建一个新模板，这次名为 `profile.html`。它将位于 `rango` 模板目录中。\n2. 我们必须创建一个新的视图来渲染这个新模板。我们这次从一开始就将其作为基于类的视图来创建！\n\
  3. 最后，新视图必须映射到一个 URL——在本例中，即 `/rango/profile`。\n\n当然，为了让新页面可访问，我们还需要在 Rango 的 `base.html`\
  \ 模板中提供一个额外的超链接，以便轻松访问。对于这个解决方案，\n\n\n我们将创建一个通用视图，使你能访问 Rango 任何用户的信息。该代码还将允许已登录应用的用户编辑自己的个人资料——*但也仅限于本人的资料*——从而满足[本练习的要求](https://example.org)。\n\
  \n## 创建模板\n\n首先，我们来创建一个用于显示用户个人资料的简单模板。以下 HTML 标记和 Django 模板代码应放置在 Rango 模板目录下新建的\
  \ `profile.html` 文件中。\n\n```django\n{% extends 'rango/base.html' %}\n{% load staticfiles\
  \ %}\n\n{% block title_block %}\n    Profile for {{ selected_user.username }}\n\
  {% endblock %}\n\n{% block body_block %}\n<div class=\"jumbotron p-4\">\n    <div\
  \ class=\"container\">\n        <h1 class=\"jumbotron-heading\">{{ selected_user.username\
  \ }}'s Profile</h1>\n    </div>\n</div>\n\n<div class=\"container\">\n    <div class=\"\
  row\">\n        <img src=\"{{ MEDIA_URL }}{{ user_profile.picture }}\"\n       \
  \      width=\"300\"\n             height=\"300\"\n             alt=\"{{ selected_user.username\
  \ }}'s profile image\" />\n        <br />\n        <div>\n            {% if selected_user\
  \ == user %}\n                <form method=\"post\" action=\".\" enctype=\"multipart/form-data\"\
  >\n                    {% csrf_token %}\n                    {{ form.as_p }}\n\n\
  \                    <input type=\"submit\" value=\"Update\" />\n              \
  \  </form>\n            {% else %}\n                <p>\n<strong>Website:</strong>\n\
  <a href=\"{{ user_profile.website }}\">{{ user_profile.website }}</a>\n</p>\n{%\
  \ endif %}\n</div>\n</div>\n</div>\n{% endblock %}\n```\n\n请注意，在模板中我们使用了几个变量（即 `selected_user`、`user_profile`\
  \ 和 `form`），需要确保这些变量在模板的上下文中已定义。在此模板中，我们假定：\n\n- `selected_user` 代表一个 Django User\
  \ 实例，即我们要显示其个人资料的用户；\n- `user_profile` 代表 Rango UserProfile 实例，即与我们要显示的关联用户对应的个人资料；\n\
  - `form` 代表一个 UserProfileForm 实例，用于显示必要的字段，允许用户编辑自己的个人资料（即网站和/或个人头像），并在必要时预填网站字段。\n\
  \n我们将在下一节中确保该模板的上下文获得所需变量。\n\n此处值得关注的模板块当然是 `body_block` 块。在顶部，我们显示所选用户的个人头像，尺寸设为\
  \ 300x300 像素。同时，我们还提供了替代文本，以便在无法找到图片时显示。\n\n然而，这个模板的妙处在于其下方的内容。我们使用条件语句来判断当前正在查看某个个人资料的用户是否为该资料所属的用户（`selected_user\
  \ == user`）——如果是，则显示一个表单，允许该用户编辑自己的资料。如果用户不匹配，我们就不希望提供编辑表单——因此，此时我们只是简单地显示个人资料。\n\
  \n另外请注意，在定义 `<form>` 时，我们再次使用了 `enctype=\"multipart/form-data\"`，因为用户可以上传新的个人头像——请记住，只要涉及文件上传，**必须**指定此属性。\n\
  \n## 创建 `profile()` 视图\n\n基于上面创建的模板，我们可以实现一个简单的视图来处理用户个人资料的查看和表单数据的提交。在 Rango 的\
  \ `views.py` 模块中，创建一个名为 `ProfileView` 的新类视图。将如下代码添加到新视图中。\n\n```python\nclass ProfileView(View):\n\
  \    def get_user_details(self, username):\n        try:\n            user = User.objects.get(username=username)\n\
  \        except User.DoesNotExist:\n            return None\n\n        user_profile\
  \ = UserProfile.objects.get_or_create(user=user)[0]\n        form = UserProfileForm({'website':\
  \ user_profile.website,\n                                'picture': user_profile.picture})\n\
  \n        return (user, user_profile, form)\n\n    @method_decorator(login_required)\n\
  \    def get(self, request, username):\n        try:\n            (user, user_profile,\
  \ form) = self.get_user_details(username)\n        except TypeError:\n         \
  \   return redirect(reverse('rango:index'))\n\n        context_dict = {'user_profile':\
  \ user_profile,\n                        'selected_user': user,\n              \
  \          'form': form}\n\n        return render(request, 'rango/profile.html',\
  \ context_dict)\n\n    @method_decorator(login_required)\n    def post(self, request,\
  \ username):\n        try:\n            (user, user_profile, form) = self.get_user_details(username)\n\
  \        except TypeError:\n            return redirect(reverse('rango:index'))\n\
  \n        form = UserProfileForm(request.POST, request.FILES, instance=user_profile)\n\
  \n        if form.is_valid():\n            form.save(commit=True)\n            return\
  \ redirect('rango:profile', user.username)\n        else:\n            print(form.errors)\n\
  \n        context_dict = {'user_profile': user_profile,\n                      \
  \  'selected_user': user,\n                        'form': form}\n\n        return\
  \ render(request, 'rango/profile.html', context_dict)\n```\n\n我们还需要导入两个此前尚未使用过的类。一个是标准的\
  \ Django User 模型，另一个是 Rango 的 UserProfile 模型。请注意，我们之前确实导入过 UserProfileForm——那是不同的东西！\n\
  \n```python\nfrom django.contrib.auth.models import User\nfrom rango.models import\
  \ UserProfile\n```\n\n我们新的类视图要求用户必须登录——因此在对 `get()` 和 `post()` 方法都使用了 `@method_decorator(login_required)`\
  \ 装饰器。\n\n在 `ProfileView` 类中，我们还创建了一个 `get_user_details()` 辅助方法，以确保代码不重复。该方法首先从数据库中查找\
  \ `django.contrib.auth.User` 实例——如果该用户存在的话。如果用户不存在，该方法直接返回 `None`，这向 `get()` 和 `post()`\
  \ 方法发出信号，让它们简单地重定向到 Rango 的主页，而不是向用户展示一条定制错误消息。毕竟我们无法显示一个不存在用户的信息！如果用户确实存在，`get_user_details()`\
  \ 方法则会获取 UserProfile 实例（如果不存在，则创建一个空白的实例）。然后，我们获取所选用户的详细信息，并利用这些信息来填充一个 UserProfileForm\
  \ 实例。最后，用户、user_profile 和已填充的表单对象以元组形式返回，并由调用该辅助方法的 `get()` 和 `post()` 方法解包¹⁰。\n\
  \n在 `post()` 方法中，我们处理用户希望更新其个人资料信息的情况。为此，我们从表单中提取信息到一个 UserProfileForm 实例中，该实例可以引用它正在保存到的\
  \ UserProfile 实例——而不是每次都创建一个新的 UserProfile 实例。请记住，我们是*更新*，不是创建！随后保存有效的表单。无效的表单（或\
  \ HTTP GET 请求）则会触发 `profile.html` 模板的渲染，并将相关变量通过其上下文传递到模板中。\n\n## 认证练习\n\n我们如何修改上面的代码，以防止未授权用户更改不属于自己的用户账户信息？需要添加什么条件语句来强制执行这一额外检查？\n\
  \n## 将视图映射到 URL\n\n然后，我们需要将新的 `ProfileView` 映射到 URL。这涉及编辑 Rango 的 `urls.py` 模块。我们需要在\
  \ urlpatterns 列表中添加一行代码，如下所示。\n\n```\npath('profile/<username>/', views.ProfileView.as_view(),\
  \ name='profile'),\n```\n\n注意其中包含一个 `username` 变量——它会匹配 `/profile/` 之后的任何内容。这意味着\
  \ URL `/rango/profile/maxwelld90/` 的 username 就是 `maxwelld90`。该值随即作为参数 `username`\
  \ 传递给类视图中的 `get()` 或 `post()` 方法。正是通过这种方式，我们能够确定所请求的用户是谁。\n\n## 调整基础模板\n\n现在一切应该按预期工作了——但用户如何访问新功能呢？我们可以通过修改\
  \ Rango 的 `base.html` 模板来提供一个链接。找到前面在书中创建的构成导航栏的一组 `<li>` 元素。添加一个新链接，允许用户跳转到自己的个人资料——确保该链接*仅在用户登录（已认证）时可见*。如果是这种情况，下面的链接需要放在哪个模板条件语句中？\n\
  \n\n\n\n\n```\n```html\n<li class=\"nav-item\">\n    <a class=\"nav-link\" href=\"\
  {% url 'rango:profile' user.username %}\">Profile</a>\n</li>\n```\n```\n\n一切顺利的话，你应该能看到如下示例。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_282_0.png)\n\n**一个完成的 Rango 个人资料页面，显示\
  \ david 的资料。请注意，这是从同一账户查看的——编辑网站和个人资料图片的功能都可用。**\n\n## 15.6 列出所有用户\n\n我们的最后一个挑战是创建一个进一步的页面，允许用户查看在\
  \ Rango 应用上注册的所有用户列表。这相对直接——再次需要实现一个模板、视图和 URL 映射——但此视图中的代码与我们上面添加的代码相比很简单。我们将创建一个\
  \ Rango 注册用户的列表——并提供一个超链接来查看他们的个人资料，使用我们在上一节中实现的代码。*请注意，此新视图只能由已登录的用户访问。*\n\n##\
  \ 创建用户资料列表模板\n\n你现在应该很熟悉流程了。创建一个新模板！再次，这属于 Rango，但这次我们将把它命名为 `list_profiles.html`。在文件中，添加以下\
  \ HTML 标记和 Django 模板代码。\n\n```\n```django\n{% extends 'rango/base.html' %}\n{% load\
  \ staticfiles %}\n\n{% block title_block %}\n    User Profiles\n{% endblock %}\n\
  \n{% block body_block %}\n<div class=\"jumbotron p-4\">\n    <div class=\"container\"\
  >\n        <h1 class=\"jumbotron-heading\">User Profiles</h1>\n    </div>\n</div>\n\
  \n<div class=\"container\">\n    <div class=\"row\">\n        {% if user_profile_list\
  \ %}\n            <div class=\"panel-body\">\n                <div class=\"list-group\"\
  >\n                    {% for list_user in user_profile_list %}\n              \
  \          <div class=\"list-group-item\">\n                            <h4 class=\"\
  list-group-item-heading\">\n                                <a href=\"{% url 'rango:profile'\
  \ list_user.user.username %}\">\n                                    {{ list_user.user.username\
  \ }}\n                                </a>\n                            </h4>\n\
  \                        </div>\n                    {% endfor %}\n            \
  \    </div>\n            </div>\n        {% else %}\n            <p>There are no\
  \ users present on Rango.</p>\n        {% endif %}\n    </div>\n</div>\n```\n```\n\
  \n```html\n</div>\n{% endblock %}\n```\n\n如前所述，与我们最近所做的相比，这个模板相当直接！使用各种 Bootstrap\
  \ 类创建了一系列 `<div>` 标签来设置列表样式。对于每个用户，我们显示其用户名并提供一个链接到其个人资料页面。请注意，由于我们传递的是 `UserProfile`\
  \ 对象列表，因此我们需要传递 `user` 属性来指向用户的用户名！\n\n## 创建用户资料列表视图\n\n模板创建完成后，我们现在可以创建相应的视图来从\
  \ `UserProfile` 模型中选择所有用户。我们还假设当前用户必须登录才能查看 Rango 的其他用户，如上所述。\n\n以下简单的基于类的视图应该能很好地满足这些要求。同样，这是一个直接的视图——通过\
  \ ORM 查询选择所有 `UserProfile` 实例可能是这里最棘手的部分。请记住，列表在上下文字典中的名称必须是 `userprofile_list`，以便与我们上面定义的模板匹配。此代码应位于\
  \ `views.py` 中。\n\n```\n```python\nclass ListProfilesView(View):\n    @method_decorator(login_required)\n\
  \    def get(self, request):\n        profiles = UserProfile.objects.all()\n\n \
  \       return render(request,\n                      'rango/list_profiles.html',\n\
  \                      {'userprofile_list': profiles})\n```\n```\n\n## 映射和链接视图\n\
  \n我们的最后一步是将 URL 映射到新的 `ListProfilesView` 基于类的视图。将以下模式添加到 Rango `urls.py` 中提供的 `urlpatterns`\
  \ 列表中。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_286_0.png)\n\n完成的个人资料列表功能。在此示例中，有三个用户注册使用\
  \ Rango：david、adelka 和 leifos。\n\n## 个人资料页面练习\n\n完成以上内容后，请查看以下附加练习以进一步测试你的知识和理解。\n\
  \n- 更新个人资料列表以包含用户个人资料图片的缩略图。\n- 如果用户没有个人资料图片，则使用 LoremPixel 提供的服务插入替代图片，该服务可让你自动生成图片。\n\
  - 更新负责渲染 `profile.html` 的用户个人资料视图，如果未提供个人资料图片，也使用占位符图片。\n\n> https://lorempixel.com/\n"
- "## 16. JQuery 速成课程\n\n到目前为止，本教程主要集中在 *服务器端* 编程上。换句话说，我们花费了大量精力来弄清编写 Python 代码以使\
  \ Django 在 *服务器上* 执行操作的机制。我们还编写了 HTML 标记并使用了 Twitter Bootstrap 工具包用于 *客户端*，即你的网络浏览器。\n\
  \n然而，你是否知道客户端可以做更多的事情？你可以使用 JavaScript¹ 在客户端为你的 Web 应用程序添加功能，从改变呈现方式到从服务器获取额外信息\
  \ *而无需* 重新加载整个网页。\n\n在本章中，我们将向你介绍 JavaScript 的基础知识，同时使用 JQuery² 框架。JQuery 使编写 JavaScript\
  \ 代码变得更容易——也更有趣！几行 JQuery 代码可以封装数百行纯 JavaScript。JQuery 还提供了一套主要专注于操作 HTML 元素的 API。我们将介绍：\n\
  \n- 如何在 Rango 中集成 JQuery；\n- 如何解释基本的 JQuery 代码；以及\n- 提供几个小示例来展示一切是如何工作的。\n\n###\
  \ 16.1 包含 JQuery\n\n要包含 JQuery 或任何其他 JavaScript 文件，你需要告诉 *客户端* 在哪里找到 JQuery。最终，网络浏览器将是利用\
  \ JavaScript 代码为用户提供额外功能的链条的一部分。考虑到 Rango，我们如何做到这一点？我们需要修改你的 *模板*，因为当\n\n这现在指示浏览器在你的\
  \ `static/js` 目录中查找 JQuery，而不是直接从 JQuery 服务器获取。一旦你完成了此操作，你还需要在 `js` 目录中创建一个新的空白文件，命名为\
  \ `rango-query.js`。我们将添加一些使用 JQuery 为 Rango 应用添加功能的 JavaScript 代码。当然，我们还需要在 `base.html`\
  \ 模板中添加对这个新文件的引用。在你刚刚调整的那行下方，添加以下内容。\n\n```\n```html\n<script src=\"{% static \\\
  \"js/rango-jquery.js\\\" %}\" crossorigin=\"anonymous\"></script>\n```\n```\n\n\
  确保此新标记 *在* 包含 JQuery 框架的那行 *下方*。作为健全性检查，确保你的静态文件已正确设置，请参阅 Templates and Media Files，并且\
  \ `base.html` 顶部有 `{% load staticfiles %}`。\n\n### 16.2 测试你的设置\n\n完成上述步骤后，你现在应该准备好尝试了！打开新的\
  \ `rango-jquery.js` 文件，并添加以下代码行。\n\n```\n```javascript\n$(document).ready(function()\
  \ {\n    alert('Hello, world!');\n});\n```\n```\n\n这段小代码使用了 JQuery。但它是如何工作的？我们将其分解为一系列不同的步骤，以向你展示正在发生的事情。\n\
  \n- 1. 我们首先通过 `$(document)` 选择文档对象。 `$()` 是你用来访问 JQuery 框架的快捷方式——所有使用 JQuery 的内容都将以\
  \ $ 开头的命令。命令 `$(document)` 告诉 JQuery 框架 *选择* HTML 文档对象³——当网络浏览器将完整的 HTML 页面加载到内存中时，页面变成的对象。此对象封装了整个页面。当我们选择类似的东西时，我们称该机制为\
  \ *选择器*。\n\n\n\n\n2. 选中文档后，我们再将一个函数*链式*调用到选择器上。在此例中，我们链式调用了 `ready()` 函数。正如 [JQuery\
  \ 文档](https://api.jquery.com/ready/) 所述，该函数会在 *DOM/页面完全加载到内存并准备就绪时* 由 JQuery 执行。通常情况下，我们都希望等到页面上的所有内容（包括外部资源）都加载完毕后再执行代码，这样才能确保代码开始执行时所有内容都已就绪。如果不等，代码可能会在预期存在的内容准备好之前就开始执行——从而导致网站异常。\n\
  \n3. 在 `ready()` 内部，我们定义了一个*匿名函数*，它会在 DOM 准备就绪时执行。与 JavaScript 中的其他函数一样，它可以接受参数，并用花括号（如\
  \ `{` 和 `}`）包裹。这与 Python 不同，Python 仅依赖缩进来决定执行哪些代码行以及何时执行。而对于 C 风格语言（如 JavaScript\
  \ 和 Java），则使用花括号来实现这一目的。\n\n4. 在函数内部，我们有一行代码 `alert(\"Hello, world!\");`。注意，每一行/命令的末尾都要加上分号（`;`）。`alert()`\
  \ 函数接收一个字符串，并在浏览器中以弹出框的形式显示它。在此例中，它将显示字符串 `Hello, world!`。\n\n总而言之，这段代码会显示消息 `Hello,\
  \ world!`，就像我们在[下面的截图](#)中看到的那样。但关键在于，浏览器会等待所有内容加载完毕，然后才显示消息。我们强烈建议你在单独的标签页中保持打开\
  \ [JQuery API 文档](https://api.jquery.com/)，以帮助你更好地理解我们在这里演示的不同概念。\n\n> [^4]: https://api.jquery.com/ready/\n\
  > [^5]: https://www.w3.org/TR/WD-DOM/introduction.html\n> [^6]: https://api.jquery.com/\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_292_0.png)\n\n**上面我们展示的代码运行结果——页面加载时显示一个弹出小框，内容为\
  \ `Hello, world!`。这个弹窗应该在 Rango 的每个页面上都能看到。**\n\n当然，当你亲眼看到它工作正常之后，就应该移除 `alert()`\
  \ 函数调用——这也许是我们能实现的最简单的演示了。每个页面都弹出这个弹窗是非常烦人的！\n\n## 选择并操作模式\n\nJQuery 要求你以更*函数式*的编程风格来思考，而不是典型\
  \ JavaScript 那种更*过程式*的写法。所有 JQuery 命令都遵循一个相似的模式：**选择并操作**——先选择一个元素，然后对该元素执行某种操作。\n\
  \n## 响应鼠标点击\n\n在前面的示例中，我们在页面加载完成、一切准备就绪时执行了 `alert()` 函数调用。这依赖于浏览器内部触发的*事件*——但如果尝试不同的事件呢？在本节中，我们将通过一个更具体的示例来使用用户交互。\n\
  \n这个简单练习的目标是向 Rango 的 `about.html` 模板中添加一个按钮，并向你展示事件如何绑定到页面的不同元素。当用户点击按钮时，会弹出一个提示框。当然，我们需要处理\
  \ `about.html` 模板和新的 `rango-jquery.js` 静态 JavaScript 文件。\n\n在 `about.html` 模板中，我们首先使用原生\
  \ JavaScript 添加一个按钮来实现我们的目标。这演示了一种将*代码绑定到事件*的非常简单的方式。将代码添加到闭合的 `</div>` 下方，但要在 `body_block`\
  \ 模板块结束之前。如果你还保留着之前 Rango 和猫的图片，请将此标记放在图片*之前*，以便按钮易于看到。你可能还想添加一个换行符（`<br />`）来将按钮与图片分开。\n\
  \n```html\n<button class=\"btn btn-primary\"\n        onclick=\"alert('You clicked\
  \ the button using inline JavaScript.');\">\n    Click me - I run on vanilla JavaScript!\n\
  </button>\n```\n\n添加这段代码后，在浏览器中打开 about 页面。你应该会在图片下方看到一个蓝色按钮。点击它，就会出现一个弹出框，显示消息\
  \ 'You clicked the button using inline JavaScript.'。此标记的作用是，我们使用了 HTML 元素自带的 `onclick`\
  \ 属性——并在其中添加了一些简单的 JavaScript 代码。这会将你提供的代码绑定到用户点击 DOM 中该元素（此处即按钮）时触发的事件。当用户点击时，代码就会执行。[HTML\
  \ 有大量不同的属性](https://www.w3schools.com/tags/ref_eventattributes.asp)⁷，可用于将代码分配到不同的事件。\n\
  \n然而，将代码嵌入模板是否是一个整洁的解决方案？我们认为不是。通过将代码合并到标记中，实际上是在以*内联*方式添加代码。这违反了关注点分离的原则。模板应该只包含呈现方面的内容。代码应放在单独的位置，例如\
  \ `rango-jquery.js` 文件中。\n\n为了迈向更优雅的解决方案，请在 `about.html` 模板中添加另一个按钮。\n\n```html\n\
  <button class=\"btn btn-primary\" id=\"about-btn\">\n    Click me - I'm using JQuery!\n\
  </button>\n```\n\n这一次，我们有另一个按钮，但没有任何与其关联的代码。相反，我们用唯一标识符（或称 id）替换了 `onclick` 属性，这样我们就能够在外部\
  \ JavaScript 文件中引用该按钮。如果我们再把以下代码添加到 `rango-jquery.js` 中，就会开始看到效果了。\n\n```javascript\n\
  $(document).ready(function() {\n\n    $('#about-btn').click(function() {\n     \
  \   alert('You clicked the button using JQuery!');\n    });\n\n});\n```\n\n重新加载页面，然后试一试。希望你会看到，当你点击这两个按钮时，两者都会弹出消息，尽管消息不同。\n\
  \n与我们之前尝试的 JQuery 代码一样，上面的代码示例首先选择 document 对象，并包含一个只在页面加载完成后才会执行的函数（即 `ready()`）。在这个匿名函数内部，我们然后*选择*\
  \ `about-btn` 元素（通过唯一标识符，根据指示在 ID 前加上 #）。另一个匿名函数绑定到 ID 为 `about-btn` 的元素被*点击*（`click()`）时的事件——该函数内部又调用了\
  \ `alert()` 函数，向用户显示一个弹出框。\n\n对于更复杂的函数，这种方法更可取。为什么？因为 JavaScript/JQuery 代码与模板分离，维护在单独的文件中。在这里，我们以编程方式将事件在*运行时*分配给处理程序，而不是在\
  \ HTML 标记中*静态*分配。因此，这实现了 JavaScript/JQuery 代码与 HTML 标记之间的关注点分离。\n\n```javascript\n\
  $('p').hover(\n    function() {\n        $(this).css('color', 'red');\n    },\n\
  \    function() {\n        $(this).css('color', 'black');\n    }\n);\n```\n\n将此\
  \ JavaScript 添加到你的 `rango-jquery.js` 中。然后，在 `about.html` 模板中，你应该在按钮下方添加一个段落——类似\
  \ `<p>This is some text for the JQuery example.</p>` 就可以了。看看代码，想一想会发生什么...然后试一试！它是否如你所预期的那样？\n\
  \n在这里，我们选择了所有的 p HTML 元素。我们为这些元素分配了一个 `hover()` 事件。`hover()` 需要两个函数——一个在你*悬停*在某个元素上时执行（第一个函数），另一个在你离开时执行（第二个函数）。这意味着当用户悬停在一个\
  \ p 元素上时，元素内的文本颜色将变为红色。当用户的光标离开该元素时，它又变为黑色。有关更多信息，请查看 `hover()` 事件的[文档](https://api.jquery.com/hover/)。\n\
  \n请注意，我们可以使用 `this` 变量来引用*正在被悬停的元素*，并使用 `css()` 函数（属于 JQuery 的一部分）将该元素的颜色属性设置为我们想要的任何值（在第二个参数中指定）。\n\
  \n## \U0001F511 记住——`ready()`！\n\n请记住，将你的 JQuery 代码放在 `$(document).ready()` 函数调用中是很好的实践。这样做可以确保代码仅在页面完全加载到内存后才会执行，从而降低代码以非常奇怪的方式出错的可能性。\n\
  \n内容下载到客户端计算机需要时间；请确保你的代码有耐心！\n\n\n\n\n### 动手实践\n\n动手试一试你刚刚编写的代码。查看 [jQuery 文档](https://api.jquery.com/category/events/mouse-events/)\
  \ 看看还能做些什么。另外还有一个小问题：你觉得如果把上面两处 `$(this)` 改成 `$('p')` 会发生什么？先想一想，等你得出答案后，再动手实验，看看你是否想对了！\n\
  \n## 16.3 更多 DOM 操作示例\n\n在上面的例子中，我们使用了 `hover()` 函数为鼠标悬停进入和悬停离开事件分配了事件处理程序。对于每个事件，我们又使用\
  \ `css()` 函数来改变被悬停元素的文字颜色。`css()` 函数是 *DOM 操作* 的一个例子——或者说，是对动态加载的页面进行修改。然而，`css()`\
  \ 并不是操作页面的唯一方式。jQuery 还提供了其他操作页面的方法！\n\n例如，我们可以使用 `removeClass()` 函数从元素中移除一个类，并使用\
  \ `addClass()` 函数向元素添加类。\n\n```javascript\n$(\"#about-btn\").removeClass('btn-primary').addClass('btn-success');\n\
  ```\n\n这是一个 *链式调用* 的例子。这段代码选中了 `about-btn` 元素（通过其唯一 ID），并从该元素中移除 `btn-primary` 类，然后添加一个新类\
  \ `btn-success`。这样做的效果是让按钮从蓝色变为绿色。为什么？Bootstrap 工具包实现了这些类——`btn-success` 恰好将元素的背景颜色设置为绿色。\n\
  \n我们还可以访问指定元素的 *内部 HTML*——换句话说，就是嵌套在指定元素中的标记。例如，让我们在 Rango 的 `about.html` 模板中，在我们的示例\
  \ `<p>` 元素下方放置一个新的 `<div>` 元素。\n\n```html\n<div id=\"msg\">Hello! I'm a further\
  \ example for jQuery testing.</div>\n```\n\n添加完这个新元素后，进入 `rango-jquery.js` 文件并添加以下代码。记得一定要把这段代码添加在\
  \ `$(document).ready()` 调用 *内部*！\n\n```javascript\n$('#about-btn').click(function()\
  \ {\n    msgStr = $('#msg').html();\n    msgStr = msgStr + ' ooo, fancy!';\n\n \
  \   $('#msg').html(msgStr);\n});\n```\n\n当匹配 `#about-btn` 选择器的元素（也就是你的第二个按钮）被点击时，我们首先使用\
  \ `html()` 函数调用获取 `#msg` 所选元素内部的 HTML 标记。由于这只是一个字符串，我们可以在末尾追加 `' ooo, fancy!'`，然后将\
  \ `msg` 元素的 `html()` 设置为存储在 `msgStr` 中的新值。\n\n## 16.4 调试提示\n\n有一件常常让初学者头疼的事情，就是如何弄明白你的\
  \ JavaScript 代码哪里出了问题！你很可能遇到了错误，但你的浏览器很擅长把错误隐藏起来！这是有意设计的——难道一个普通用户希望在打开网页时看到一大堆\
  \ JavaScript 错误吗？我们很怀疑这一点！\n\n大多数现代浏览器内部都有一系列 *开发者工具*，可以让你查看客户端 JavaScript 代码的运行情况。如何访问这些工具取决于你使用的浏览器。在\
  \ Chrome 中，你可以点击选项菜单（三个点），选择 `更多工具`，然后点击 `开发者工具` 来访问开发者工具。\n\n当工具加载后，你可以点击 `控制台`\
  \ 选项卡，查看 JavaScript 解释器的输出——包括任何错误消息！在下面的 [示例截图](#) 中，你可以看到一个错误阻止了代码运行。简单看一下错误消息，会发现我们在\
  \ `msgStr` 变量中多写了一个 r，这为我们找出问题提供了重要线索。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_299_0.png)\n\
  \n**Google Chrome 中的开发者工具，显示控制台输出。查看控制台输出，找出代码未按预期运行时的错误所在。**\n\n控制台的另一个功能是，你 *也可以输入命令！*\
  \ 下面的截图展示了这一点——调用了 `alert()` 函数，输出结果显示为一个弹窗。你可以在这个控制台中执行 jQuery 命令、检查数组、哈希映射的内容，或者做任何你需要做的事情。这是调试现代高代码量应用的必备工具。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_300_0.png)\n\nGoogle Chrome 中的开发者工具，显示控制台输出。查看控制台输出，找出代码未按预期运行时的错误所在。\n\
  \n### 始终使用开发者工具\n\n在编写客户端 JavaScript 时，始终保持浏览器的开发者工具处于打开状态。当事情不按预期运行时，这会让你更容易查明原因！\n\
  \n本章提供了一个非常基础的 jQuery 使用指南，以及如何将其整合到你的 Web 应用中。从现在开始，你应该能够理解 jQuery 的工作方式，并尝试使用\
  \ jQuery 框架提供的各种函数——甚至包括第三方开发者提供的函数。在下一章中，我们将使用 jQuery 为 Rango 提供简单的 AJAX¹ 功能。\n\
  \n> ¹https://en.wikipedia.org/wiki/Ajax_(programming)\n\n某个类别收到的点赞数。我们没有实现让用户增加这个计数的功能！这正是我们本章要做的。具体来说，我们将：\n\
  \n- 添加一个 *点赞按钮*，让注册用户可以对特定类别“点赞”；\n- 添加内联类别建议，让用户在输入时可以快速找到特定类别；以及\n- 添加一个 *添加按钮*，让注册用户在执行搜索时可以快速轻松地向类别中添加新页面。\n\
  \n所有这些功能都将使用 AJAX 技术来实现，从而使用户体验更加流畅。不过，在我们深入之前，先创建一个名为 `rango-ajax.js` 的新 JavaScript\
  \ 文件。这个文件将存放我们本章实现功能所需的所有 AJAX 代码。与现有的 JavaScript 文件一样，请在你的项目的 `static/js/` 目录下创建该文件。你还需要在\
  \ Rango 的 `base.html` 模板中添加对该文件的引用，放在上一章中我们处理的现有引用下方。提醒一下，这些引用位于模板的底部附近。\n\n###\
  \ jQuery 前提假设\n\n我们假设你已经完成了上一章关于 jQuery 的内容——并且本次练习使用的是 jQuery 3.3.1 版本。如果 *至少*\
  \ 你还没有完成该章节的设置步骤，我们强烈建议你现在就去完成。\n\n现在一切都已经设置好并准备就绪，让我们开始工作吧。\n\n## 17.2 添加“点赞”按钮\n\
  \n按点赞数排序类别的功能在之前的一章中已经实现。查看 Rango 的主页，类别是按收到的点赞数（降序）排列的。然而，如果能让 Rango 的注册用户通过 *点赞*\
  \ 来表达他们对某个类别的喜爱，那就更好了！\n\n为了直观地展示我们想要实现的效果，请看下面的图表。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_305_0.png)\n\
  \n**我们打算使用 AJAX 和 jQuery 实现的事件序列。** 左侧是客户端事件，由用户点击 Python 类别的“点赞类别”按钮触发。沿着箭头，你可以推算出接下来发生的事件。\n\
  \n仔细研究这张图表，以帮助你理解将要实现的内容。左侧是发生在客户端（浏览器内）的事件，右侧是发生在服务器端（Django 中间件）的事件。一切都从用户点击 `点赞类别`\
  \ 按钮开始。我们将实现的 jQuery 代码会向服务器发送一个 AJAX GET 请求。Django 中间件接收请求，执行相应的视图，并发送一个简单的响应。在本练习中，响应将只是给定类别的新点赞数——仅此而已。这个响应随后被我们的\
  \ jQuery 代码接收，返回的值被放入包含计数的元素中（使用 `.html()` 方法）。最后，我们将“点赞类别”按钮从视图中隐藏！\n\n### 更新类别模板\n\
  \n我们的第一步是为新的 AJAX 功能准备 Rango 的 `category.html` 模板。我们需要添加一个“点赞类别”按钮，并为其赋予唯一 ID `like_btn`，同时添加一个新元素来显示类别收到的点赞数。\n\
  \n为此，请打开 `category.html` 模板，找到显示 `{{ category.name }}` 的 `<h1>` 标签。在 `<h1>` 标签关闭后，换行，并添加以下标记和模板代码。\n\
  \n```html\n<div>\n    <strong id=\"like_count\">{{ category.likes }}</strong> likes\n\
  \    {% if user.is_authenticated %}\n    <button id=\"like_btn\"\n            data-categoryid=\"\
  {{ category.id }}\"\n            class=\"btn btn-primary btn-sm\"\n            type=\"\
  button\">\n        <span data-feather=\"thumbs-up\"></span>\n        Like Category\n\
  \    </button>\n    {% endif %}\n</div>\n```\n\n添加完成后，已登录 Rango 的用户应该会看到一个类似于下面所示的页面。这个标记添加了一个\
  \ `<div>`，其中包含了所需的所有基础设施——从专门显示给定类别点赞数的 `<strong>` 标签，到一个允许人们增加点赞数的新 `<button>`\
  \ 元素。请注意，在按钮内部，我们还添加了一个小的竖起大拇指图标（由 `<span>` 元素表示）。这个图标由\n\n\n由 Feather²（https://feathericons.com/）提供，并作为\
  \ Bootstrap 框架的一部分被包含在内。另请注意，`<strong>` 和 `<button>` 元素都包含了 `id` 属性。我们赋予的 `id` 值非常重要，因为我们的\
  \ jQuery 代码会用到它们。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_307_0.png)\n\n更新 `category.html`\
  \ 模板后的结果。注意“点赞分类”按钮，其旁边有点赞数——所有这些都位于分类标题的正下方。如果你在未登录状态下查看同一页面，该按钮将不可见。\n\n## 创建点赞分类视图\n\
  \n现在，既然已经在 Rango 的 `category.html` 中打下了基础，让我们把注意力转向服务器端，集中实现处理点赞分类请求的视图。回想一下，在我们的概述中，我们提到将使用\
  \ GET 请求来点赞分类。这些请求将通过形如 `/rango/like_category/?category_id=1` 的 URL 来服务。根据这两个需求，我们的基于类的视图只需要实现\
  \ `get()` 方法，该方法从 GET 对象中提取 `category_id` 查询字符串。\n\n我们的实现如下所示，将位于 Rango 的 `views.py`\
  \ 模块中。\n\n```python\nclass LikeCategoryView(View):\n    @method_decorator(login_required)\n\
  \    def get(self, request):\n        category_id = request.GET['category_id']\n\
  \n        try:\n            category = Category.objects.get(id=int(category_id))\n\
  \        except Category.DoesNotExist:\n            return HttpResponse(-1)\n  \
  \      except ValueError:\n            return HttpResponse(-1)\n\n        category.likes\
  \ = category.likes + 1\n        category.save()\n\n        return HttpResponse(category.likes)\n\
  ```\n\n检查上面的代码，你可以看到我们只允许已登录用户访问此视图——因此使用了 `@method_decorator(login_required)` 装饰器。我们还实现了一些基本的错误处理。如果用户提供的分类\
  \ ID 不存在，或者提供的分类 ID 无法转换为整数，则会在响应中返回 -1。否则，给定分类的 likes 属性会增加 1。更新后的值随后会被单独返回。\n\n\
  你应该已经拥有了所有必要的 import 语句——但请再次确认以下内容存在。这个语句在本书开头就使用过——你在前几章清理代码时可能把它删掉了。你现在绝对需要它！\n\
  \n```python\nfrom django.http import HttpResponse\n```\n\n当然，如果没有对应的 URL 映射，这个视图将毫无用处。为了满足需求，让我们添加一个映射。将以下内容添加到\
  \ Rango 的 `urls.py` 模块的 `urlpatterns` 列表中。\n\n```python\npath('like_category/',\
  \ views.LikeCategoryView.as_view(), name='like_category'),\n```\n\n现在，你应该可以进入下一步了——发出\
  \ AJAX 请求。\n\n## 发出 AJAX 请求\n\n为了实现 AJAX 功能，请打开位于项目 `static` 目录下的空白 `rango-ajax.js`\
  \ 文件，并添加以下 JavaScript 代码。\n\n```javascript\n$(document).ready(function() {\n   \
  \ $('#like_btn').click(function() {\n        var categoryIdVar;\n        categoryIdVar\
  \ = $(this).attr('data-categoryid');\n\n        $.get('/rango/like_category/',\n\
  \            { 'category_id': categoryIdVar},\n            function(data) {\n  \
  \              $('#like_count').html(data);\n                $('#like_btn').hide();\n\
  \            }\n        );\n    });\n});\n```\n\n这段 JavaScript/jQuery 代码会在页面加载完成后触发，然后将代码绑定到“点赞分类”按钮（通过唯一标识符\
  \ `like_btn` 识别）的事件处理程序上。当用户点击此按钮时，`category_id` 会从按钮的 `data-categoryid` 属性中提取。如果你仔细查看本章前面定义的模板代码，`data-categoryid`\
  \ 属性是由 Django 模板引擎在服务器端渲染页面时，用分类的唯一 ID 填充的！一旦获得 `category_id`，我们就调用 `$.get()`。\n\
  \n`$.get()` 是一个 jQuery 函数，用于处理 AJAX GET 请求。我们首先指定要访问的 URL（在此实例中是硬编码的，这并不理想！），然后传入一个类似字典的对象作为第二个参数。根据提供的键/值对，会构造出一个查询字符串。这意味着\
  \ jQuery 构建的最终请求将类似于 `GET /rango/like_category/?category_id=<category_id_var>`。实际的\
  \ ID 值当然会被插入到 URL 末尾的相应位置。\n\n我们提供的最后一个参数是另一个匿名函数，这次它接收一个 `data` 参数。当服务器对请求作出响应时，该函数会被调用，`data`\
  \ 包含服务器的响应。在我们的例子中，其中将包含该分类的点赞数。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_311_0.png)\n\
  \nDjango 开发服务器的输出，显示了正在进行的 AJAX 请求（以红色突出显示）。该请求显示传递的 `category_id` 被设置为 1——从上面的日志（显示初始分类页面加载）可以看出，该请求是针对\
  \ Python 分类的。\n\n## 17.3 添加内联分类建议\n\n在实现了一个简单的 AJAX 示例之后，让我们尝试一些更复杂的东西。假设 Rango\
  \ 中已经填充了几十个分类。如果用户想查找一个特定的分类，他们目前需要浏览一长串分类。这太烦人了！\n\n要让用户更快地找到他们想要的分类，一种方法是提供一个建议组件。用户可以开始输入他们正在搜索的分类名称，Rango\
  \ 会返回一个建议分类列表，供用户选择。本质上，此功能将提供一种*过滤*形式，让用户能够缩小可用的选项范围。\n\n当然，我们可以通过 AJAX 实现这一点。每当用户从键盘输入一个字母时，我们就可以向\
  \ Django 服务器发送一个请求，要求它返回一个潜在过滤后的分类匹配列表。然后，这个分类列表可以在已加载的页面中渲染。为了确保这一功能在 Rango 应用中都能使用，我们将把它实现在左侧的分类列表部分。\n\
  \n### 工作流程\n\n要实现这一点，我们需要执行以下步骤。\n\n1. 首先，我们需要创建一个带参数的函数 `get_category_list()`。此函数将接受两个参数，即\
  \ `max_results`（默认为 0）和 `starts_with`（默认为空字符串 `''`）。该函数将返回一个匹配用户查找条件的分类列表。\n   -\
  \ `max_results` 将限制返回的结果数量。如果指定为 0，则对返回多少分类不设限制。\n   - `starts_with` 表示用户到目前为止输入的内容。想象一下，如果用户正在查找\
  \ `python`，那么这里可能传入的字符串是 `pyt`——意味着用户已经输入了他们要查找内容的前三个字符。\n2. 还需要创建一个进一步的视图。我们将其命名为\
  \ `CategorySuggestionView`。这同样将是基于类的视图，并通过 URL 映射 `/rango/suggest/`（名称为 `suggest`）进行访问。该视图将接收用户的建议，并返回用户输入内容的前八条建议列表。\n\
  \   - 我们假设这是通过 HTTP GET 请求实现的。\n   - 我们将检查提供给视图的查询字符串是否为空。如果其中包含内容，我们将调用 `get_category_list()`\
  \ 来获取所提供字符串的前八个结果。\n   - 来自 `get_category_list()` 的结果将在现有模板 `categories.html` 中组合呈现。我们之前就是通过自定义模板标签，用这个模板来显示\
  \ Rango 页面左侧的分类列表。\n\n\n\n\n```html\n<div class=\"w-75 ml-3\">\n    <input type=\"\
  search\"\n           id=\"search-input\"\n           class=\"form-control ds-input\"\
  \n           placeholder=\"Search...\" />\n</div>\n\n<div class=\"sidebar-sticky\"\
  \ id=\"categories-listing\">\n    {% block sidebar_block %}\n        {% get_category_list\
  \ category %}\n    {% endblock %}\n</div>\n```\n\n我们新的输入元素是 `search` 类型（允许字符串输入），并被分配了一个\
  \ `search-input` 的 id。我们还使用了 `Search...` 作为占位提示信息，以告知用户可以使用此框在提供的列表中搜索类别。请注意其中包含的几个\
  \ Bootstrap 类，它们有助于样式设置。\n\n稍后我们会回到如何将这些组件与服务器端代码结合起来的问题。\n\n## 填充练习\n\n更新 Rango\
  \ 的填充脚本。添加以下类别：Pascal、Perl、PHP、Prolog、PostScript 和 Programming。运行填充脚本，将这些新类别添加到你的数据库中。你不需要为每个新类别添加页面，当然如果你愿意也可以添加。如果你不想这样做，只需为\
  \ `pages` 的值传入一个空列表（`[]`）。通过添加这些附加类别，稍后体验新的内联类别建议功能时，效果会更令人印象深刻。\n\n## `get_category_list()`\
  \ 辅助函数\n\n回想一下，这个辅助函数的作用是返回名称与用户提供字符串紧密匹配的类别列表。我们可以使用 Django ORM 中的筛选操作来查找所有名称以给定字符串开头的类别。这个筛选器叫做\
  \ `istartswith`，顾名思义，它会筛选出 *以* 给定字符串 *开头* 的类别。它是大小写不敏感的，所以即使数据库中有首字母大写的 Python，而用户开始输入\
  \ `pyt`——这仍然会匹配到 Python。\n\n这个函数可以添加到 Rango 的 `views.py` 模块中。如果你愿意，也可以创建一个新模块——比如\
  \ `helpers.py`——并将其放在那里。目前我们暂时把它放在 `views.py` 中。但如果你确实选择创建一个新模块，你需要导入所有必需的内容！\n\n\
  ```python\ndef get_category_list(max_results=0, starts_with=''):\n    category_list\
  \ = []\n\n    if starts_with:\n        category_list = Category.objects.filter(name__istartswith=starts_with)\n\
  \n    if max_results > 0:\n        if len(category_list) > max_results:\n      \
  \      category_list = category_list[:max_results]\n\n    return category_list\n\
  ```\n\n请注意，这个函数满足我们上面定义的要求：它接受两个参数——`max_results`，允许指定返回多少项；以及 `starts_with`，即用户的输入字符串。注意我们如何使用\
  \ `filter` 方法执行 `__istartswith` 筛选，查找与 `starts_with` 匹配的项。如果 `max_results=0`，我们假设返回所有结果；否则，我们使用标准的\
  \ Python 列表子索引操作来截断列表。\n\n## CategorySuggestionView 视图\n\n定义好辅助函数后，我们可以创建一个新的基于类的视图来使用它。记住，这里我们只处理\
  \ GET 请求——所以，和之前的例子一样，我们的视图只会实现一个 `get()` 方法。该方法也将对所有用户开放，因此无需将其限制为仅登录用户。\n\n##\
  \ 提示\n\n这只是一个普通的 HTTP GET 请求，就像*你在浏览器中输入网址或点击链接时发出的任何请求*一样。当你将浏览器指向 `http://127.0.0.1:8000/rango/suggest/?suggestion=pro`\
  \ 时会发生什么？\n\n## 为请求建议添加 AJAX\n\n如果你已经测试了服务器端功能并对其满意，那么现在是时候将 Rango 页面左侧组件与服务器粘合起来。我们将通过向\
  \ `static rango-ajax.js` 文件添加更多代码来实现这一点。请注意，你应该 *在* `$(document).ready(function()\
  \ { ... }` 块 *内* 添加此代码，以确保页面的所有部分在代码执行之前都已加载完成。\n\n```javascript\n$('#search-input').keyup(function()\
  \ {\n    var query;\n    query = $(this).val();\n\n    $.get('/rango/suggest/',\n\
  \          {'suggestion': query},\n          function(data) {\n              $('#categories-listing').html(data);\n\
  \          }\n    );\n});\n```\n\n当 `search-input` 元素获得焦点时，这段代码会绑定一个按键事件（当用户在键盘或智能手机屏幕上按下某个键时）。换句话说，当用户在搜索框中输入一个字母时，该代码被触发。然后提取输入框的值（`$(this).val()`），并将其传递到\
  \ AJAX GET 请求中。我们将用户提供的字符串包装在一个类似字典的对象中，再次帮助构造正确的 URL 和查询字符串。\n\n一旦服务器响应，匿名函数就会被调用，其中\
  \ `data` 包含响应内容——即与用户查询匹配的类别列表。然后，这个列表会被简单地放置在我们之前更新的 `categories-listing` `<div>`\
  \ 元素内——替换掉 `<div>` 中的任何现有内容。查看下面的截图，看看新功能的实际效果。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_318_0.png)\n\
  \n内联类别建议的示例。注意，当用户键入每个字符时，建议是如何填充和变化的。\n\n## 17.4 进一步的 AJAX 实践\n\n我们已经看了两个如何将 AJAX\
  \ 集成到 Rango 应用中的示例，为什么不尝试再多一个呢？这一次，*把它当作一个练习*。我们将为你列出规格说明，并提供有助于你找到解决方案的代码片段。然而，我们恳请你自行解决。如果需要帮助，试着上网搜索解决方案。弄清楚要在搜索引擎中输入什么查询，有时是获得所需帮助的一半关键。\n\
  \n## 规格说明\n\n我们之前添加了几个新类别来测试类别建议功能。如果你没有为这些类别添加页面，它们就会是空白的。随着 Bing 搜索功能集成到类别页面中，我们尚未涉及的一个缺失环节是让用户能够*从搜索结果中添加页面*。\n\
  \n也就是说，当注册用户发起查询并获取结果时，我们能否在搜索结果旁边提供一个“添加”按钮，让用户将此页面添加到他们正在查看的类别中？此外，能否通过使用 AJAX\
  \ 来实现这一点？\n\n下面是一个粗略的工作流程，帮助你找到解决这个问题的方法。\n\n1. 首先，更新 Rango 的 `category.html` 模板。\n\
  \   - 在每个搜索结果旁边添加一个小按钮。在 `<button>` 元素中，你需要添加 `data` 属性，提供页面标题和页面 URL。这样做会让 jQuery\
  \ 更容易提取这些信息。\n   - 在页面列表的位置，你需要用带有唯一 ID 的 `<div>` 包裹那一块标记和模板代码。同样，这是为了让 jQuery 能够轻松选择该元素并更新其中的内容。\n\
  \   - 移除指向现有“添加页面”视图的链接——现在它基本上多余了。\n2. 模板修改完成后，你需要创建一个新视图来处理新页面的添加。\n   - 该视图将接受一个\
  \ GET 请求，其中包含新页面的标题和 URL，以及页面所属类别的 `category_id`。然后，此视图应将新页面添加到给定类别中。\n   - 将新视图映射到\
  \ URL – `/rango/search_add_page/`。\n   - 新视图应返回该类别的更新页面列表。这可能涉及添加一个新模板来生成此列表。\n\
  3. 将新视图与更新后的 `category.html` 基础结构粘合起来。当“添加”按钮被点击时，应执行 jQuery 代码，向你的新视图发出 AJAX GET\
  \ 请求。然后，新视图返回的数据应放置在你的 `<div>` 容器中，用于显示页面列表。\n\n## \U0001F511 为“添加”按钮使用类！\n\n到目前为止，我们一直在\
  \ jQuery 中使用唯一的 id 来选择按钮。这是因为到目前为止，页面上只存在一个这样的按钮。\n\n然而，为 Bing 搜索 API 返回的*每个页面*都提供一个“添加”按钮会带来一个问题。如何让\
  \ jQuery 能够将代码绑定到所有这些按钮？使用类选择器（`.`）而不是 ID 选择器（`#`）！你可以创建一个新类，将其应用到每个按钮，然后使用该类在 jQuery\
  \ 中选择元素。\n\n## 代码片段\n\n我们提供了几个代码片段来帮助你完成这个练习。下面显示了我们的示例标记和模板代码，它提供了一个用于从搜索结果中添加新页面的\
  \ `<button>`。\n\n\n\n```html\n<button class=\"btn btn-info btn-sm rango-page-add\"\
  \n        type=\"button\"\n        data-categoryid=\"{{ category.id }}\"\n     \
  \   data-title=\"{{ result.title }}\"\n        data-url=\"{{ result.link }}\">\n\
  \    Add\n</button>\n```\n\n注意以 `data-` 开头的三个属性，它们提供了要添加页面的类别 ID，以及我们要添加页面的 `title`\
  \ 和 `url` 值。你还应该注意到我们分配给按钮的额外类名——`rango-page-add`——这将帮助我们编写 jQuery 代码，用于在按钮被点击时选择和绑定代码。\n\
  \n请记得通过在其周围包裹一个 `<div>` 元素来更新你的页面列表组件。对于下面的示例，我们假设你给这个 `<div>` 一个 id 为 `page-listing`。\n\
  \n鉴于我们为上面每个页面添加的按钮，我们还需要一些 jQuery 代码来请求添加新页面，并处理从初始请求返回的、更新后的页面列表。下面是一个模型解决方案。\n\
  \n```javascript\n$('.rango-page-add').click(function() {\n    var categoryid = $(this).attr('data-categoryid');\n\
  \    var title = $(this).attr('data-title');\n    var url = $(this).attr('data-url');\n\
  \    var clickedButton = $(this);\n\n    $.get('/rango/search_add_page/',\n    \
  \      {'category_id': categoryid, 'title': title, 'url': url},\n          function(data)\
  \ {\n              $('#page-listing').html(data);\n              clickedButton.hide();\n\
  \          }\n    );\n});\n```\n\n到现在为止，这段代码应当相对不言自明，而且你也应该知道要将此代码放在 `$(document).ready`\
  \ 块中！我们从被点击按钮的属性（例如 `title`、`url`、`categoryid`）中提取所需信息，然后发起一个 AJAX GET 请求。我们将所需信息传递到\
  \ URL `/rango/search_add_page/`。\n\n在给定适当的 URL 映射（我们将留给你去实现）之后，我们将控制权交给新的视图。在这个示例解决方案中，我们调用视图\
  \ `SearchAddPageView`。它实现了所需的单个 `get()` 方法。\n\n```python\nclass SearchAddPageView(View):\n\
  \    @method_decorator(login_required)\n    def get(self, request):\n        category_id\
  \ = request.GET['category_id']\n        title = request.GET['title']\n        url\
  \ = request.GET['url']\n\n        try:\n            category = Category.objects.get(id=int(category_id))\n\
  \        except Category.DoesNotExist:\n            return HttpResponse('Error -\
  \ category not found.')\n        except ValueError:\n            return HttpResponse('Error\
  \ - bad category ID.')\n\n        p = Page.objects.get_or_create(category=category,\n\
  \                                       title=title,\n                         \
  \              url=url)\n\n        pages = Page.objects.filter(category=category).order_by('-views')\n\
  \        return render(request, 'rango/page_listing.html', {'pages': pages})\n```\n\
  \n这个基于类的示例视图符合所有要求——它只允许那些已登录的人添加页面，并且它期望来自客户端的输入，其键名与我们之前实现的 jQuery AJAX 调用一致。虽然错误处理非常简单（看看\
  \ `except` 块），但它至少能捕获基本的错误情况。通过了所有这些之后，代码会创建（如果已存在则获取）一个包含传递信息的页面，获取与该类别关联的所有页面列表，并使用新的\
  \ `page_listing.html` 模板调用 `render()`。\n\n在这个新的 `rango/page_listing.html` 模板中，我们只需复制并粘贴\
  \ Rango 的 `category.html` 模板中处理页面列表的标记和模板代码。\n\n```django\n{% if pages %}\n<ul>\n\
  \    {% for page in pages %}\n    <li>\n        <a href=\"{% url 'rango:goto' %}?page_id={{\
  \ page.id }}\">{{ page.title }}</a>\n        {% if page.views > 1 %}\n         \
  \   ({{ page.views }} views)\n        {% elif page.views == 1 %}\n            ({{\
  \ page.views }} view)\n        {% endif %}\n    </li>\n    {% endfor %}\n</ul>\n\
  {% else %}\n<strong>No pages currently in category.</strong>\n{% endif %}\n```\n\
  \n这与现有模板*完全相同*。不要剪切它——你需要原始的标记和模板代码来进行首次渲染，当类别视图页面第一次被请求时！\n\n一旦你添加了 URL 映射，你就应该能看到一切正常工作。在你选择的类别中发起一个查询，然后点击其中一个搜索结果旁边的\
  \ Add 按钮。按钮应该消失，类别视图顶部的页面列表应该更新，以包含你添加的页面。看看下面的两张截图——[第一张截图](#)展示了 PHP 类别，没有任何页面。我们输入了搜索词\
  \ `php hello world`，并想把第一个结果添加到 PHP 类别中。点击结果旁边的 Add 按钮会触发 jQuery 代码，向服务器发出 AJAX\
  \ GET 请求，服务器添加页面并返回该类别的页面列表——在本例中只有一个！然后页面会使用这个新列表进行更新，Add 按钮被隐藏——如[第二张截图](#)所示。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_323_0.png)\n\n类别页面，显示 PHP 类别且未添加任何页面。我们向搜索功能发出了查询\
  \ php hello world，并希望将第一个结果添加到该类别。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_324_0.png)\n\
  \n**更新后的 PHP 类别页面，AJAX 功能已添加第一个结果。注意现在有一个页面列表（虽然只有一项），并且 Add 按钮已经消失。**\n\n实现了这个功能后，你就快大功告成了！期待着你能够将项目在线部署，让全世界的人都能看到你的成果！\n\
  \n### 完全卡住了？\n\n我们已经在我们模型解决方案的 Git 仓库中实现了本书中的所有内容。本次练习有一个提交，你可以[在此](https://github.com/maxwelld90/tango_with_django_2_code/tree/073f876e461333b6f03100499758bc59260e574d)查看。然而，我们再次恳请你**不要**使用此资源，除非你绝对、确实不确定该怎么做。\n\
  \n- 2. 测试应有*明确的目的*。\n- 3. 测试应与*你现有的代码库独立*。\n- 4. 在编写代码之前运行测试。确保在你开始之前一切都能运行。\n-\
  \ 5. 在编写代码之后、提交和推送之前运行测试。确保你没有破坏任何东西。\n  - 为什么不写一个钩子，让你每次提交时执行测试？\n- 6. 你给测试起的名字越长、越具有描述性，越好。\n"
- "## 在 Django 中测试\n\n本章提供了 Django 测试的基础知识，结构类似于 [Django 教程](https://docs.djangoproject.com/en/2.1/intro/tutorial05/)——并附带一些额外说明。如果有读者强烈希望我们进一步扩展本章，我们会！如果你认为这对你有帮助，请与我们联系。\n\
  \n### 18.1 运行测试\n\nDjango 附带了一整套工具来测试你所构建的应用。你可以使用终端或命令提示符来测试你开发的 Rango 应用。只需发出以下命令，并观察输出。\n\
  \n```text\n$ python manage.py test rango\n\nCreating test database for alias 'default'...\n\
  \n-----------------------------------------------------------------\nRan 0 tests\
  \ in 0.000s\n\nOK\nDestroying test database for alias 'default'...\n```\n\n此命令将运行为\
  \ Rango 应用创建的所有测试。然而，目前什么也没有发生。这是因为 rango 应用目录中的 `tests.py` 几乎是空白的，只有一条导入语句。每次你创建新的\
  \ Django 应用时，都会为你创建这个近乎空白的 `tests.py` 模块，以鼓励你编写测试！\n\n从上面显示的输出中，你可能还会注意到引用了一个名为\
  \ `default` 的数据库。当你运行测试时，会构建一个临时数据库，你的测试可以在其中填充数据并进行操作。这样，你的测试就*独立于*你的实际数据库运行，满足了我们上面列出的规则之一。\n\
  \n### 测试 Rango 的模型\n\n鉴于目前没有测试，让我们创建一个！在 `Category` 模型中，我们想要确保接收的浏览量大于或等于零，因为你不能有负的浏览量。为此，我们可以将以下代码放入\
  \ Rango 的 `tests.py` 模块中，注意保留现有的 `import` 语句。\n\n```python\nclass CategoryMethodTests(TestCase):\n\
  \    def test_ensure_views_are_positive(self):\n        \"\"\"\n        Ensures\
  \ the number of views received for a Category are positive or zero.\n        \"\"\
  \"\n        category = Category(name='test', views=-1, likes=0)\n        category.save()\n\
  \n        self.assertEqual((category.views >= 0), True)\n```\n\n你还需要确保导入 `Category`\
  \ 模型。\n\n```python\nfrom rango.models import Category\n```\n\n关于我们编写的测试，首先要注意的是，我们必须将测试放在一个类中。这个类必须继承自\
  \ `django.test.TestCase`。类中实现的每个方法测试一个特定功能。这些方法的名字应始终以 `test_` 开头，并且应始终包含某种断言。在本例中，我们使用\
  \ `assertEqual` 来检查两个项是否相等。但是，你还可以使用许多其他断言检查——如[官方 Python 文档](https://docs.python.org/3/library/unittest.html#assert-methods)所示。Django\
  \ 的测试机制⁴\n\n⁴https://docs.python.org/3/library/unittest.html#assert-methods\n\n\n\
  源自Python实现，但也提供了几个Django和Web开发特有的断言和测试用例。\n\n如果我们随后运行测试，将会看到以下输出。\n\n```text\n$\
  \ python manage.py test rango\n\nCreating test database for alias 'default'...\n\
  F\n======================================================================\nFAIL:\
  \ test_ensure_views_are_positive (rango.tests.CategoryMethodTests)\n----------------------------------------------------------------------\n\
  Traceback (most recent call last):\n  File \"/Users/maxwellld90/Workspace/tango_with_django_project/rango/tests.py\"\
  , line 12, in test_ensure_views_are_positive\n    self.assertEqual((cat.views>=0),\
  \ True)\nAssertionError: False != True\n\n----------------------------------------------------------------------\n\
  Ran 1 test in 0.001s\n\nFAILED (failures=1)\n```\n\n我们可以看到Django识别到了我们唯一的测试，并且它失败了。这是因为模型没有检查`views`的值是否小于零。既然我们希望确保该字段的值非零，我们需要更新模型以确保满足这一要求。现在更新模型，在Rango的`models.py`模块中的`Category`模型的`save()`方法里添加一些代码。代码应该检查`views`属性的值，如果提供的值小于零，则将其设置为零。对`self.views`进行简单的条件检查就足够了。\n\
  \n更新模型后，重新运行测试。看看你的代码现在是否通过了测试。如果没有，再试一次，找出一个能通过测试的解决方案。\n\n我们尝试添加另一个测试，确保创建了适当的slug。这意味着slug用破折号代替空格（`-`），并且全部为小写。将以下测试方法添加到你的新`CategoryMethodTests`类中。\n\
  \n```python\nclass IndexViewTests(TestCase):\n    def test_index_view_with_no_categories(self):\n\
  \        \"\"\"\n        If no categories exist, the appropriate message should\
  \ be displayed.\n        \"\"\"\n\n        response = self.client.get(reverse('rango:index'))\n\
  \n        self.assertEqual(response.status_code, 200)\n        self.assertContains(response,\
  \ 'There are no categories present.')\n        self.assertQuerysetEqual(response.context['categories'],\
  \ [])\n```\n\n由于我们使用Django的`reverse()`函数来执行URL查找，我们还需要确保在`tests.py`模块顶部包含正确的导入语句。\n\
  \n```python\nfrom django.urls import reverse\n```\n\n查看上面的代码，Django的`TestCase`类可以访问一个能够发出请求的`client`对象。这里，它使用辅助函数`reverse()`来查找Rango索引页面的URL。然后尝试对该页面发出HTTP\
  \ GET请求。响应被返回并存储在`response`中。然后测试会检查几件事：页面是否成功加载（返回200状态码）；响应的HTML是否包含字符串“There\
  \ are no categories present.”；以及用于渲染响应的上下文字典中，所提供的categories是否是一个空列表。\n\n回忆一下，当运行测试时，会创建一个新的数据库，默认情况下该数据库是空的。这对每个测试方法都是如此——这解释了为什么你在两个`CategoryMethodTests`测试中创建的类别对`IndexViewTests`中的测试不可见。\n\
  \n现在让我们检查存在类别时的索引视图。我们可以添加一个辅助函数来实现这一点。这个简单的函数不在类内部——只需将其放在`tests.py`模块中。\n\n运行测试。它能通过吗？\n\
  \n## 更新你现有的测试\n\n更新你目前已经创建的现有测试，以使用辅助函数`add_category()`。\n\n## 测试渲染后的页面\n\nDjango的测试套件还允许你执行加载Web应用并程序化地与渲染后HTML页面上的DOM元素进行交互的测试。这非常有用，因为你可以像人类一样测试Web应用——通过‘点击’链接，或在表单字段中输入信息并提交。这需要借助一些额外的第三方“驱动程序”软件，它们为你控制网页上的交互。\n\
  \n我们在这里没有明确介绍如何设置这些测试，但你应该参考[官方Django文档](https://docs.djangoproject.com/en/2.2/topics/testing/tools/#liveservertestcase)来了解更多并了解如何实现。\n\
  \n如果你真的希望我们提供如何以这种方式运行测试的示例，请告诉我们！\n\n## 18.2 检查测试覆盖率\n\n关于测试的另一个讨论点是*覆盖率*。代码覆盖率衡量你的代码库中有多少已经被测试。你可以安装一个名为coverage的额外包（`$\
  \ pip install coverage`），它可以自动分析你的代码库中有多少已被测试覆盖。安装coverage后，在终端或命令提示符中运行以下命令。\n\n\
  ```bash\n$ coverage run --source='.' manage.py test rango\n```\n\n这将运行你到目前为止实现的所有测试，并为Rango应用收集覆盖率数据。要查看报告，你需要在第一条命令完成后输入以下命令。\n\
  \n```text\n$ coverage report\nName                                      Stmts  \
  \ Miss  Cover\n-------------------------------------------------------------\nmanage.py\
  \                                     9      2    78%\npopulate_rango.py       \
  \                     33     33     0%\nrango/__init__.py                      \
  \        0      0   100%\nrango/admin.py                                10     \
  \ 0   100%\nrango/apps.py                                  3      3     0%\nrango/bing_search.py\
  \                          38     32    16%\nrango/forms.py                    \
  \            34      6    82%\nrango/migrations/0001_initial.py               6\
  \      0   100%\nrango/migrations/0002_auto_20200111_1313.py     4      0   100%\n\
  rango/migrations/0003_category_slug.py          4      0   100%\nrango/migrations/0004_auto_20200111_1702.py\
  \     6      0   100%\nrango/migrations/__init__.py                    0      0\
  \   100%\nrango/models.py                                33      3    91%\nrango/templatetags/__init__.py\
  \                  0      0   100%\nrango/templatetags/rango_template_tags.py  \
  \     6      0   100%\nrango/tests.py                                 34      0\
  \   100%\nrango/urls.py                                   4      0   100%\nrango/views.py\
  \                                207    139    33%\ntango_with_django_project/__init__.py\
  \           0      0   100%\ntango_with_django_project/settings.py          28 \
  \     0   100%\ntango_with_django_project/urls.py              12      1    92%\n\
  tango_with_django_project/wsgi.py               4      4     0%\n-------------------------------------------------------------\n\
  TOTAL                                         475    223    53%\n```\n\n从该命令的输出中，我们可以看到代码的关键部分尚未被测试。例如，`views.py`的覆盖率相当低，仅34%。因此，这个输出可以为你提供一种基于度量的方法，以确定应将测试编写工作重点放在哪里。\n\
  \ncoverage包[还有更多功能](https://coverage.readthedocs.io/en/latest/)，你可以探索这些功能，使你的测试更加全面！\n\
  \n### 提示\n\n你需要使用Django的时区感知功能来获取当前日期和时间。这需要你导入：`from django.utils import timezone`，通过`timezone.now()`来访问当前日期和时间。\n\
  \n为了比较两个日期，你需要使用`assertTrue()`方法进行断言。该方法接受一个布尔表达式，你可以在其中执行评估，例如`page.last_visit\
  \ < timezone.now()`。\n\n在进行第二个测试时，你需要调用`rango:goto`视图，并将`page_id`作为参数传递。你可以使用`client.get()`方法，通过提供一个字典作为第二个参数来实现，其中键为`page_id`，值为你希望访问的页面的ID。根据你实现该测试的方式，可能还需要从数据库刷新模型实例。这可以使用`refresh_from_db()`方法来完成。\n\
  \n作为最后的提示，编写一个额外的辅助函数来向给定类别添加页面也可能有所帮助。如果遇到困难，我们已经在GitHub上实现了一个[模型解决方案](https://github.com/maxwelld90/tango_with_django_2_code/tree/ce0911025891970d6ee3ac5b8745ea970477151c/)。\n\
  \n### 其他测试资源\n\n- 浏览[官方Django教程第五部分](https://docs.djangoproject.com/en/2.1/intro/tutorial05/)以了解更多关于测试的内容。\n\
  - 查看[Harry Percival关于测试驱动开发的教程](https://www.obeythetestinggoat.com/book/part1.harry.html)。\n\
  \n\n\n"
- "## 19. 部署你的项目\n\n本章提供关于如何在 PythonAnywhere¹ 上部署你的 Django 应用的分步指南。PythonAnywhere\
  \ 是一个在线 IDE 和 Web 托管服务，专为托管 Python 应用而设计。该服务允许你通过浏览器访问服务器端的 Python 和 Bash 命令行接口，这意味着你可以像操作自己电脑上的常规终端实例一样与\
  \ PythonAnywhere 的服务器进行交互。目前，PythonAnywhere 提供免费的入门级账户，非常适合上手。它为你提供足够的存储空间和 CPU\
  \ 时间，让单个 Django 项目能够启动并运行起来。\n\n> **你在使用 Git 吗？**\n>\n> 你可以独立完成本章，因为我们已经实现了 Rango——我们的实现可在\
  \ GitHub² 上获取。如果你之前没有使用过 Git/GitHub，可以查看我们关于使用 Git 的章节。\n\n### 19.1 创建 PythonAnywhere\
  \ 账户\n\n首先，注册一个 PythonAnywhere 入门级账户³。我们建议你体验七步导览，以熟悉 PythonAnywhere 的界面。如果你的应用取得成功并开始流行，你随时可以在日后升级账户，以获得更多存储空间和\
  \ CPU 时间，以及多项其他好处，例如托管特定域名和 SSH⁴ 登录等。\n\n一旦你创建了账户并确认了电子邮件，你就在万维网上拥有了一小块天地：`http://<username>.pythonanywhere.com`，其中\
  \ `<username>` 是你的 PythonAnywhere 用户名。你托管的应用将通过该 URL 进行访问。\n\n> **你的用户名**\n>\n>\
  \ 你的用户名会与我们用于演示 PythonAnywhere 功能的用户名不同。我们选择了 `rangodemo2020`，你会在本章的截图和代码片段中看到它。必要时，只需将\
  \ `rangodemo2020` 替换为你的用户名即可。\n\n### 19.2 PythonAnywhere Web 界面\n\nPythonAnywhere\
  \ Web 界面包含一个 *仪表板*（dashboard），它提供了一系列不同的组件，让你能够管理自己的应用。如下图所示，这些组件包括：\n\n- *控制台*（Consoles），允许你创建并操作\
  \ Python 和 Bash 控制台实例；\n- *文件*（Files），允许你在磁盘配额内上传和组织文件；\n- *Web 应用*（Web apps），允许你配置托管\
  \ Web 应用的设置。\n\n还存在着其他组件，例如 *笔记本*（Notebooks），但我们在这里不会使用它们——我们主要使用 *控制台* 和 *Web 应用*\
  \ 组件。[PythonAnywhere Wiki](https://www.pythonanywhere.com/wiki/) 提供了关于如何使用其他组件的详细说明，如果你有兴趣进一步了解，可以前往查看。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_338_0.png)\n\n*PythonAnywhere 仪表板，展示了你可以使用的主要组件。这里我们以\
  \ rangodemo2020 登录。你可以看到 Consoles、Files、Notebooks（我们这里不使用）以及 web apps（或 web apps\
  \ 设置）的链接。*\n\n### 19.3 创建虚拟环境\n\n作为其标准默认 Bash 环境的一部分，PythonAnywhere 自带 Python 2.7+\
  \ 和几个预装的 Python 包（包括 *Django*）。由于我们使用的是不同的环境配置，因此需要通过创建虚拟环境来手动设置 Python 3 版本。\n\n\
  首先，在 New console 标题下方点击 `$ Bash`，打开一个 Bash 控制台。如果你运行 `python --version`，你会看到 Python\
  \ 是 2.7+。要设置我们的 Python 3.7+ 环境，需要执行以下命令。\n\n```text\n$ mkvirtualenv -p python3.7\
  \ rangoenv\nRunning virtualenv with interpreter /usr/bin/python3.7\nUsing base prefix\
  \ '/usr'\nNew python executable in /home/rangodemo2020/.virtualenvs/rangoenv/bin/python3.7\n\
  Also creating executable in /home/rangodemo2020/.virtualenvs/rangoenv/bin/python\n\
  Installing setuptools, pip, wheel...done.\nvirtualenvwrapper.user_scripts creating\n\
  \    /home/rangodemo2020/.virtualenvs/rangoenv/bin/predeactivate\nvirtualenvwrapper.user_scripts\
  \ creating\n    /home/rangodemo2020/.virtualenvs/rangoenv/bin/postdeactivate\nvirtualenvwrapper.user_scripts\
  \ creating\n    /home/rangodemo2020/.virtualenvs/rangoenv/bin/preactivate\nvirtualenvwrapper.user_scripts\
  \ creating\n    /home/rangodemo2020/.virtualenvs/rangoenv/bin/postactivate\nvirtualenvwrapper.user_scripts\
  \ creating\n    /home/rangodemo2020/.virtualenvs/rangoenv/bin/get_env_details\n\
  ```\n\n上面我们使用了 Python 3.7，但你可以检查自己正在使用的 Python 版本，并使用该版本。请记住，`rangodemo2020` 将被替换为你的用户名。创建虚拟环境的过程需要一些时间才能完成（因为你使用的是与他人共享的主机）。环境创建完成后，你会看到一个略有不同的提示符。令人兴奋吧！\n\
  \n```text\n(rangoenv) ~ $\n```\n\n注意与之前的提示符相比，现在多了 `(rangoenv)`。这表示 `rangoenv` 虚拟环境已被激活，因此所有包的安装都将在该虚拟环境中进行，而不会影响更广泛的系统环境。如果你执行命令\
  \ `ls -la`，你会看到一个名为 `.virtualenvs` 的目录已被创建。这个目录用于存放你所有的虚拟环境及关联的包。为了确认设置，执行命令 `which\
  \ pip`。这会打印当前激活的 pip 可执行文件所在的位置——希望是在 `.virtualenvs` 和 `rangoenv` 内，如下例所示。\n\n```text\n\
  /home/rangodemo2020/.virtualenvs/rangoenv/bin/pip\n```\n\n要查看已安装的包，请输入 `pip list`。现在我们可以通过为\
  \ Rango 应用安装所需的包来定制虚拟环境。执行以下命令来安装所有必需的包。\n\n```bash\n$ pip install django==2.1.5\n\
  $ pip install pillow==5.4.1\n$ pip install django-registration-redux==2.2\n$ pip\
  \ install requests\n$ pip install coverage\n```\n\n如果你决定使用可选的 Bcrypt 密码哈希器，还需要安装\
  \ Bcrypt 库。\n\n```bash\n$ pip install bcrypt\n```\n\n**请确保将上面指定的 Django 版本替换为你开发时使用的版本。**\
  \ 这里我们使用的是 2.1.5 版本。请记住，本书支持 2.0 到 2.2 的一系列版本。如果不使用与开发机器相同的版本，可能会导致一些奇怪的错误，至少会让人非常沮丧。为了确保你拥有相同的设置，我们建议在本地开发机器上使用\
  \ `pip freeze > requirements.txt`。这会记录下你当前开发环境中的所有包。然后在 PythonAnywhere 上，你可以运行 `pip\
  \ install -r requirements.txt` 一次性安装所有包。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_340_0.png)\n\
  \n> **使用 `requirements.txt`？**\n>\n> 如果你在计算机上使用 `pip freeze` 创建了包含所有包的 `requirements.txt`\
  \ 文件，那么该文件应该已经添加到你的 Git 仓库中。\n>\n> 在这种情况下，请先跳到克隆仓库的部分，然后再回到这里。当你克隆仓库后，就可以访问你的 requirements\
  \ 文件，这意味着你可以使用命令 `pip install -r requirements.txt` 在 PythonAnywhere 的 `rangoenv`\
  \ 虚拟环境中安装所有包。\n\n> **等待下载...**\n>\n> 由于你使用的是共享主机，下载和安装这些包所需的时间将比在你自己电脑上长得多。如果你觉得它好像崩溃了，别担心——给它一点时间！\n\
  \n安装完成后，检查 Django 是否已正确安装。你可以使用命令 `which django-admin.py` 进行检查。你应该会看到类似下面的输出。\n\n\
  ```text\n/home/rangodemo2020/.virtualenvs/rangoenv/bin/django-admin.py\n```\n\n\
  > **PythonAnywhere 上的虚拟环境**\n>\n> PythonAnywhere 还提供了如何设置虚拟环境的说明。[查看他们的 Wiki 文档了解更多信息](https://help.pythonanywhere.com/pages/VirtualEnvForNewerDjango)。\n\
  \n> **虚拟环境切换**\n>\n> 在虚拟环境之间切换非常容易。PythonAnywhere 应该已经为你考虑到了这一点。下面我们提供一个关于如何在虚拟环境之间切换的快速教程。\n\
  >\n> 你可以使用 `workon` 命令进入一个已有的虚拟环境。例如，使用以下命令加载 `rangoenv` 环境。\n>\n> ```shell\n> ~\
  \ $ workon rangoenv\n> ```\n>\n> 在这里，`rangoenv` 可以替换为你想要使用的虚拟环境的名称。之后，你的提示符应该会发生变化，以表示你正在虚拟环境中工作。这体现为提示符中增加了\
  \ `(rangoenv)`。\n>\n> ```shell\n> (rangoenv) ~ $\n> ```\n>\n> 然后，你可以使用 `deactivate`\
  \ 命令退出虚拟环境。之后，你的提示符应该不再包含 `(rangoenv)` 前缀，如下例所示。这确认了环境已成功停用。\n\n\n\n\n\n```shell\n\
  (rangoenv) ~ $ deactivate\n~ $\n```\n\n## 克隆你的 Git 仓库\n\n现在，你的 Rango 虚拟环境已经全部设置好了，你可以克隆\
  \ Git 仓库来获取项目文件的副本。在 PythonAnywhere 上，从你的主目录发出以下命令来克隆仓库。\n\n```shell\n$ git clone\
  \ https://github.com/<OWNER>/<REPO_NAME>\n```\n\n当然，你需要将 `<OWNER>` 替换为仓库所有者的用户名，将\
  \ `<REPO_NAME>` 替换为项目仓库的名称。例如，一个由 `djangolearner` 托管的仓库 `tango_with_django_project`\
  \ 对应的命令如下。\n\n```shell\n$ git clone https://github.com/djangolearner/tango_with_django_project\n\
  ```\n\n你会看到以下输出，表明仓库克隆成功。\n\n```text\n$ git clone https://github.com/djangolearner/tango_with_django_project/\n\
  Cloning into 'tango_with_django_project'...\nremote: Enumerating objects: 335, done.\n\
  remote: Counting objects: 100% (335/335), done.\nremote: Compressing objects: 100%\
  \ (239/239), done.\nremote: Total 335 (delta 203), reused 213 (delta 81), pack-reused\
  \ 0\nReceiving objects: 100% (335/335), 1.11 MiB | 484.00 KiB/s, done.\nResolving\
  \ deltas: 100% (203/203), done.\nChecking connectivity... done.\nChecking out files:\
  \ 100% (54/54), done.\n```\n\n## 设置数据库\n\n克隆仓库后，你需要准备数据库。如果仓库中已经提交了数据库，请删除该副本。我们将从头开始。\n\
  \n我们还会使用本书前面创建的 `populate_rango.py` 模块，用示例数据填充数据库。由于我们要运行该模块，你必须确保正在使用 rangoenv\
  \ 虚拟环境（即提示符中能看到 `(rangoenv)`——如果没有，请执行 `workon rangoenv`）。\n\n从你的主目录（提示符中的 `~` 表示）开始，导航到包含\
  \ `manage.py` 和 `populate_rango.py` 脚本的目录。按照我们之前提供的说明，这个目录是 `~/tango_with_django_project/`——也就是你刚刚克隆的目录。如果你选择了不同的结构，请导航到这些文件存储的位置。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_343_0.png)\n\n### 如何导航？\n\n在 Bash 终端中，你可以使用\
  \ `cd` 命令来切换目录，后面跟上你想切换到的路径。在这个例子中，你应该发出命令 `cd ~/tango_with_django_project/`。\n\n\
  请注意，当你切换目录时，提示符会随之改变，以反映你的*当前工作目录*。例如，`~ $` 会变成 `~/tango_with_django_project $`。\n\
  \n切换目录后，发出以下命令。这些命令现在对你来说应该已经是家常便饭了！\n\n```bash\n$ python manage.py makemigrations\
  \ rango\n$ python manage.py migrate\n$ python populate_rango.py\n$ python manage.py\
  \ createsuperuser\n```\n\n你应该完全清楚这些命令各自的作用。当然，最后一条命令需要你进行一些交互操作，为你的 Django 项目创建管理员账户。\n\
  \n## 19.4 设置你的 Web 应用程序\n\n现在数据库已经设置好了，我们需要配置 PythonAnywhere 的 *NGINX* Web 服务器来提供你的应用程序。为此，请返回\
  \ PythonAnywhere 仪表盘，找到 *Web 应用* 部分，点击 *打开 Web 标签页* 按钮。在出现的页面左侧，点击 *添加新的 Web 应用*。\n\
  \n随后会弹出一个对话框。按照屏幕上的说明操作，当需要时，选择 *手动配置* 选项并完成向导。确保你选择的 Python 版本与之前选择的相同。点击 *下一步*，PythonAnywhere\
  \ 将设置你的 Web 应用，并将你重定向到更新后的 *Web 应用* 页面，页面带有一个绿色的重新加载应用按钮。\n\n在 Web 浏览器的新标签页或新窗口中，访问你的\
  \ PythonAnywhere 子域名地址 `http://<username>.pythonanywhere.com`。你应该会看到默认的 *Hello,\
  \ World!* 网页，如下所示。这是因为当前的 WSGI 脚本正在提供这个简单页面，而不是你的 Django 应用程序。这是接下来我们需要处理的事情——更新\
  \ WSGI，让它提供你的 Django 应用！\n\n![](img/75169a27287f7c945bf2cbf7dede5251_344_0.png)\n\
  \n默认的 PythonAnywhere 你好世界网页。\n\nWSGI 脚本是服务器与应用之间的链接，它将发送到你的子域名的传入请求映射到你的 Web 应用程序。\n\
  \n要配置 WSGI 脚本，请导航到 PythonAnywhere 界面中的 *Web* 标签页。在 *代码* 标题下，你可以看到代码部分中指向 WSGI 配置文件的链接：例如\
  \ `/var/www/rangodemo2020_pythonanywhere_com_wsgi.py`。当然，`rangodemo2020` 部分将替换为你的用户名。\n\
  \nPythonAnywhere 的人员为我们设置了一个示例 WSGI 文件，其中包含几种可能的配置。对于你的 Web 应用程序，你需要通过点击链接打开一个简单的编辑器，来配置文件的\
  \ Django 部分。下面的例子可以作为你的应用程序的 WSGI 配置。\n\n```python\nimport os\nimport sys\n\n# Add\
  \ your project’s directory to the PYTHONPATH\npath = '/home/rangodemo2020/tango_with_django_project/'\n\
  if path not in sys.path:\n    sys.path.append(path)\n\n# Move to the project directory\n\
  os.chdir(path)\n\n# Tell Django where the settings.py module is located\nos.environ.setdefault('DJANGO_SETTINGS_MODULE',\n\
  \                      'tango_with_django_project.settings')\n\n# Set up Django\
  \ -- let it instantiate everything!\nimport django\ndjango.setup()\n\n# Import the\
  \ Django WSGI to handle requests\nimport django.core.handlers.wsgi\napplication\
  \ = django.core.handlers.wsgi.WSGIHandler()\n```\n\n再次强调，请确保将 `rangodemo2020` 替换为你的\
  \ PythonAnywhere 用户名，并根据你的应用程序调整其他路径设置。`path` 变量应包含包含你的 `manage.py` 脚本的目录的绝对路径。你还应该从\
  \ WSGI 配置脚本中删除所有其他代码，确保不会发生冲突，只留下我们在上面提供的代码。\n\n```python\nALLOWED_HOSTS = ['rangodemo2020.pythonanywhere.com']\n\
  ```\n\n如果你在计算机上编辑了文件，现在可以执行（希望你已经熟悉的）`git add settings.py`、`git commit` 和 `git push`\
  \ 命令流程，将更改提交到你的 Git 仓库。完成后，你应该通过控制台在你的 PythonAnywhere 账户上运行 `git pull` 命令来获取更改。如果你直接在\
  \ PythonAnywhere 上编辑了文件，只需保存文件即可。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_348_0.png)\n\
  \n### 无比怀念 `127.0.0.1`\n\n在调试时，你可能还想将主机 `127.0.0.1` 添加到你的 `ALLOWED_HOSTS` 列表中，这样你就可以继续在本地开发你的应用。当然，这应该在生产环境中删除。\n\
  \n接下来剩下的事情就是重新加载你的 PythonAnywhere 应用。这可以通过点击 PythonAnywhere *Web* 页面上的 *重新加载* 按钮来完成。完成此操作后，访问你的应用\
  \ URL，你应该能看到[你的应用可以运行，但没有静态媒体](#)。我们稍后会解决这个问题。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_349_0.png)\n\
  \nRango 的索引页面，几乎成功部署。静态文件没有生效，红框标出。Rango 的图片没有显示！\n\n### 网关错误\n\n在部署过程中，有时你可能会收到\
  \ `HTTP 502 - Bad Gateway` 错误，而不是看到你的应用程序。尝试再次重新加载你的应用，然后多等一会儿。如果问题仍然存在，请再试一次重新加载。如果问题持续存在，请在联系\
  \ PythonAnywhere 支持之前，检查你的日志文件，看看是否有任何错误发生。\n\n### 设置密钥\n\n明智的做法是不要将你的密钥提交到 Git\
  \ 仓库中——而是从一个单独的、未提交的文件中加载密钥。为此，请打开项目的 `settings.py` 文件，要么更改你在生产环境中使用的密钥（这是一种粗糙的解决方案），要么从一个文件中加载它，如下面的例子所示。\n\
  \n\n\n\n\npath 应该看起来像 `/home/rangodemo2020/tango_with_django_project/static`。本质上，你应该将此路径指向项目中\
  \ static 目录的位置。对于我们的示例，此路径有效 – rangodemo2020 是我们的 PythonAnywhere 用户名，而 tango_with_django_project\
  \ 是我们克隆 Git 仓库所在的目录。\n\n完成后，你的应用将能够访问其样式表、图像和 JavaScript 文件。Django 管理界面同样适用。不要忘记在应用了这些路径后\
  \ *Reload* 你的应用！\n\n### Enabling HTTPS\n\nPythonAnywhere 还为启用 [HTTPS](https://en.wikipedia.org/wiki/HTTPS)\
  \ 功能提供了非常直接的支持，在客户端和服务器之间增加了一层加密。PythonAnywhere 可以为你提供安全证书，证明你的应用是真实的。操作超级简单，绝对值得做！\n\
  \n要启用 HTTPS，请进入 PythonAnywhere 界面的 *Web* 选项卡，并查找 *Security* 部分。找到 *Force HTTPS*\
  \ 的开关，并打开此功能。完成后，滚动到页面顶部并再次 *Reload* 你的应用。如果你随后导航到你的应用 URL，你应该会注意到你被重定向到 `https://rangodemo2020.pythonanywhere.com`（当然，用你的用户名替换\
  \ rangodemo2020！）——表示你正在使用 HTTPS 使用你的应用。\n\n¹² https://en.wikipedia.org/wiki/HTTPS\n"
- '## 20. Final Thoughts


  在本教程中，我们从规范到部署完整地介绍了 Web 开发流程。在此过程中，我们展示了如何使用 Django 框架构建与示例 Web 应用 *Rango* 相关的必要模型、视图和模板。我们还演示了如何将
  Bootstrap、jQuery 和 PythonAnywhere 等工具包和服务集成到应用中。然而，道路并未止步于此。


  在本教程中，我们仅勾勒了 Web 应用的粗略轮廓。正如你可能已经注意到的，Rango 仍有很多改进空间——而这些细节往往需要花费大量时间来完善应用。通过以坚实的基础开发你的应用，你将能够非常迅速地构建出高达
  80% 的网站并将可用的演示上线。


  在本书的未来版本中，我们打算提供有关框架各个方面的更多细节——以及涵盖与 Web 开发相关的其他基本技术的入门知识。如果你对如何改进本书有任何建议或意见，请与我们联系。


  请通过 [Twitter](https://twitter.com/tangowithdjango) 在线报告任何错别字、错误或其他问题，或通过 [GitHub](https://github.com/leifos/tango_with_django_2)
  提交更改请求。谢谢！


  ### One Last Exercise


  ![](img/75169a27287f7c945bf2cbf7dede5251_355_0.png)


  还有一件小事，我们确信你现在可以解决了。在 Rango 的索引页面，分页链接目前直接指向数据库中存储的 URL。我们没有跟踪这些点击！*你需要做什么才能确保当这里的链接被点击时，它会被跟踪？*


  ### 20.1 Acknowledgements


  本书的编写目的是帮助教授计算科学学生 Web 应用开发。在编写本书和教程时，我们不得不依靠强大的 Django 社区和 Django 文档来获取答案和解决方案。本书实际上是将这些知识结合起来，在构建
  Rango 的背景下拼凑而成。


  我们还要感谢所有通过发送评论、建议、Git 问题和拉取请求帮助改进此资源的人。如果你多年来发送了更改，请提醒我们，如果你不在名单上！



- "## Appendices\n\n### Setting up your System\n\n本补充章节提供了补充 [initial setup chapter](#)\
  \ 的额外设置指南。我们提供了安装和配置你在 Tango with Django 教程中将使用的各种技术的设置指南。参考与你相关的部分；如果你已经一切正常，则无需通读本章的全部内容。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_359_0.png)\n\n#### Common Guides\n\n\
  本章提供了有关如何设置你在整个 Tango with Django 中将使用的各种技术的说明，我们 *认为* 这些技术在最大数量的系统上都能正常工作。然而，每台计算机的设置都不同。存在不同版本的软件，其中包含细微差异。这些差异使得提供通用设置指南变得非常困难。\n\
  \n如果你将本书作为课程的一部分使用，你可能会获得针对你的实验室计算机的独特设置说明。请遵循这些说明——大部分设置工作可能已经为你完成。\n\n然而，如果你独自在自己的计算机上工作，并且按照本章提供的说明操作未成功，我们建议你前往你喜欢的搜索引擎并输入你遇到的问题。通常，这涉及复制并粘贴你在遇到困难的步骤中看到的错误消息。通过逐字粘贴消息，很可能你会找到有人遇到与你相同的问题——从那时起，你希望能找到解决问题的方案。\n\
  \n#### Installing Python 3 and pip\n\n如何在你的计算机上安装 Python 3.7？本节回答了这个问题。正如我们 [之前讨论的](#)，你可能会发现你已经\n\
  \n\n\n确保你的计算机上安装了 Python。如果你使用的是 Linux 发行版或 macOS，那么系统已经自带了 Python。你的操作系统的某些功能是用\
  \ Python⁴⁷ 实现的，因此需要解释器！遗憾的是，大多数预装 Python 的现代操作系统，其版本都比我们所需的版本旧得多。但也有一些例外，比如 Ubuntu\
  \ 自带 3.6.5 版本，应该足以满足你的需求。如果你确实需要安装 3.7，那么必须将此版本的 Python 与旧版本*并排*安装。\n\n安装 Python\
  \ 的方法有很多种。我们将在这里演示最常用的方法，适用于 Apple 的 macOS、各种 Linux 发行版和 Windows 10。请选择与你的操作系统对应的部分继续阅读。请注意，我们倾向于在适当的情况下使用包管理器⁴⁸，以确保你能够轻松地维护和更新软件（在需要时）。\n\
  \n## Apple macOS\n\n在 macOS 上获取 Python 3 的最简单方法是从 Python 官方网站⁴⁹ 下载 .dmg 镜像文件。它会为你提供分步安装界面，使一切设置变得非常简单。如果你的开发环境会保持轻量化（即只使用\
  \ Python），那么这个选项就很合理。只需下载安装程序，Python 3 就应该可以在你的 Mac 终端中使用了！\n\n然而，当开发升级并涉及更多软件工具时，包管理器会让事情变得更容易⁵⁰。安装包管理器可以轻松维护和更新计算机上的软件，甚至还可以安装新软件。macOS\
  \ 没有预装包管理器，因此你需要自行下载并安装一个。如果你想走这条路，我们将向你介绍 *MacPorts*，一个出色的包管理器，提供了大量工具⁵¹ 供你下载和使用。我们建议你遵循这条路线。虽然更复杂，但最终结果将是一个完整的开发环境，让你准备好编写代码并处理任何交给你的项目（或未来的你！）。\n\
  \n⁴⁷ http://en.wikipedia.org/wiki/Yellowdog_Updater,_Modified\n⁴⁸ https://en.wikipedia.org/wiki/Package_manager\n\
  ⁴⁹ https://www.python.org/downloads/mac-osx/\n⁵⁰ https://softwareengineering.stackexchange.com/questions/372444/why-prefer-a-package-manager-over-a-library-folder\n\
  ⁵¹ https://www.macports.org/ports.php\n\n使用 MacPorts 的前提是已安装 Apple 的 *Xcode* 环境。该下载大小为数\
  \ GB。获取它的最简单方法是通过你 macOS 上的 App Store。你需要使用 Apple 账户下载该软件。安装 Xcode 后，请按照以下步骤设置 MacPorts。\n\
  \n1. 启动 Xcode 以确认其已安装。你应该会看到一个欢迎屏幕。如果看到，说明一切就绪，然后可以退出应用。\n2. 打开“终端”窗口。输入以下命令安装 Xcode\
  \ 命令行工具：\n\n   ```bash\n   $ xcode-select --install\n   ```\n\n   这将下载 Xcode 和你稍后安装的其他开发软件所需的附加软件工具。\n\
  \n3. 如果你尚未同意 Xcode 许可，请同意。你可以通过输入以下命令来执行此操作：\n\n   ```bash\n   $ sudo xcodebuild\
  \ -license\n   ```\n\n   从头到尾阅读条款，然后输入 Y 完成——但前提是你同意这些条款！\n\n4. 从 [MacPorts 安装页面](https://www.macports.org/install.php)\
  \ 下载适用于你的 macOS 版本的 MacPorts 安装程序。\n5. 在 Mac 的“访达”中，打开你下载安装程序的目录，然后双击该文件以启动安装过程。\n\
  6. 按照步骤操作，并提供你的密码以安装软件。\n7. 完成后，删除安装程序文件——你不再需要它。关闭所有仍然打开的终端窗口。\n\nMacPorts 安装完成后，安装\
  \ Python 就很简单了。\n\n1. 打开一个新的终端窗口。务必在 MacPorts 安装后启动一个新窗口，以确保安装程序所做的所有更改生效！\n2. 输入以下命令：\n\
  \n   ```bash\n   $ sudo port install python37\n   ```\n\n   输入密码后，这将需要几分钟。需要安装一些依赖项——输入\
  \ Y 同意安装这些依赖项。\n\n3. 安装完成后，激活你新安装的 Python。输入命令：\n\n   ```bash\n   $ sudo port select\
  \ --set python python37\n   ```\n\n4. 通过输入命令 `$ python` 测试命令是否成功。然后你应该会看到 Python\
  \ 3.7.2 的解释器（或你刚安装的任何版本——只要以 3.7 开头，就没问题）。\n\n完成后，Python 已成功安装并可以使用。但是，我们仍然需要设置虚拟环境以配合你的安装。\n\
  \n1. 输入以下命令安装 `virtualenv` 以及用户友好包装器中提供的辅助函数。\n\n   ```bash\n   $ sudo port install\
  \ py37-virtualenv\n   $ sudo port install py37-virtualenvwrapper\n   ```\n\n2. 使用以下命令激活\
  \ `py37-virtualenv`。\n\n   ```bash\n   $ sudo port select --set virtualenv virtualenv37\n\
  \   ```\n\n3. 编辑你的 `~/.profile` 文件。在 macOS 中，可以通过输入命令 `$ open ~/.profile` 使用 *TextEdit*\
  \ 应用完成此操作。在文件末尾添加以下四行。\n\n   ```bash\n   export VIRTUALENVWRAPPER_PYTHON='/opt/local/bin/python3.7'\n\
  \   export VIRTUALENVWRAPPER_VIRTUALENV='/opt/local/bin/virtualenv-3.7'\n   export\
  \ VIRTUALENVWRAPPER_VIRTUALENV_CLONE='/opt/local/bin/virtualenv-clone-3.7'\n   source\
  \ /opt/local/bin/virtualenvwrapper.sh-3.7\n   ```\n\n4. 保存文件并关闭所有打开的终端。完成后，打开一个新终端。现在一切应该都能正常工作并可供你使用。使用以下命令测试。你**不应**看到\
  \ `command not found` 错误。\n\n   ```bash\n   $ mkvirtualenv\n   ```\n\n### 使用 MacPorts\
  \ 安装附加软件\n\nMacPorts 提供了一个广泛的、预配置的开源软件库，特别适用于开发环境。当你需要新软件时，安装起来非常容易。**例如**，你想安装\
  \ *LaTeX* 排版系统，搜索 [MacPorts 软件包列表](https://www.macports.org/ports.php)——生成的包名为 `texlive-latex`。然后可以使用命令\
  \ `$ sudo port install texlive-latex` 安装它。LaTeX 所依赖的所有软件也会一并安装。这为你节省了大量时间，无需再费力寻找所有正确的软件来使一切正常工作。\n\
  \n要查看 MacPorts 已在你的系统上安装的软件包，请输入命令 `$ port list installed`。你会看到 python37 已被列出！\n\
  \n## Linux 发行版\n\n在 Linux 发行版上，有很多不同的方法可以下载、安装和运行更新版本的 Python。遗憾的是，不同发行版的方法各不相同。更复杂的是，几乎所有\
  \ Linux 发行版都没有预编译的 Python 3.7 版本可供你直接下载使用（在撰写本文时），尽管最新版本的 Ubuntu 使用 Python 3.6（这已经足够了）。\n\
  \n如果你确实选择安装新版本的 Python，我们整理了一系列步骤供你参考。这些步骤将允许你从零开始安装 Python 3.7.2。\n\n这些步骤已在 Ubuntu\
  \ 18.04 LTS 上进行了全面测试；其他发行版经过微小调整后也应该可以工作，特别是步骤 1 中使用的包管理器。在你喜欢的搜索引擎上粗略搜索一下，就能找到正确的命令。例如，在\
  \ *Red Hat Enterprise Linux* 安装中，系统包管理器是 yum 而不是 apt。\n\n### 知识假设\n\n要完成这些步骤，我们假设你了解\
  \ Bash 交互的基础知识，例如波浪号（~）的含义。请小心使用 sudo 命令，除下面列出的需要 sudo 的步骤外，不要执行它。\n\n1. 安装成功构建\
  \ Python 所需的软件包。这些包在下面逐行列出。可以直接将它们输入到 Ubuntu 终端中；其他 Linux 发行版可能需要进行细微修改。\n\n   ```bash\n\
  \   $ sudo apt install wget\n   $ sudo apt install build-essential\n   $ sudo apt\
  \ install libssl-dev\n   $ sudo apt install libffi-dev\n   $ sudo apt install python-dev\n\
  \   $ sudo apt install zlib1g-dev\n   $ sudo apt install libbz2-dev\n   $ sudo apt\
  \ install libreadline-dev\n   $ sudo apt install libsqlite3-dev\n   ```\n\n2. 安装完上述软件包后，下载\
  \ Python 3.7.2 的源代码。我们创建一个 pytemp 目录用于下载文件。所有操作完成后，我们将删除该目录。\n\n   ```bash\n   $\
  \ mkdir ~/pytemp\n   $ cd ~/pytemp\n   $ wget https://www.python.org/ftp/python/3.7.2/Python-3.7.2.tgz\n\
  \   ```\n\n3. 解压 .tgz 文件。\n\n\n\n\n这种设置下可能会发生。[本书前面](#)我们讨论过一个场景：两个软件需要*同一个依赖*的两个不同版本。这很令人头疼；你通常无法在\
  \ Python 环境中安装同一软件的两个不同版本！\n\n解决方案是使用*虚拟环境*。使用虚拟环境时，每个你想要运行的软件都可以拥有自己的环境，并随之拥有其已安装的依赖集合。如果你有需要\
  \ Django 1.11 的 `ProjectA` 和需要 Django 2.1 的 `ProjectB`，你可以为它们各自创建虚拟环境并安装相应的包。\n\n\
  下面列出了用于管理虚拟环境的五个基本命令。\n\n- `mkvirtualenv <name>` 创建并激活名为 `<name>` 的新虚拟环境。\n- `workon\
  \ <name>` 切换到名为 `<name>` 的虚拟环境。\n- `deactivate` 关闭你当前正在使用的虚拟环境。\n- `rmvirtualenv\
  \ <name>` 删除名为 `<name>` 的虚拟环境。\n- `lsvirtualenv` 列出所有用户创建的虚拟环境。\n\n以上面的示例为基础，我们可以为每个项目创建一个环境，并在相应环境中安装所需软件。对于\
  \ `ProjectA`，环境名为 `projAENV`，而 `ProjectB` 使用 `projBENV`。请注意，要向相应环境安装软件，我们使用 `pip`。用于\
  \ `pip` 的命令[下面讨论](#)。\n\n```bash\n$ mkvirtualenv projAENV\n(projAENV) $ pip install\
  \ Django==1.11\n(projAENV) $ pip freeze\nDjango==1.11\n\n(projAENV) $ deactivate\n\
  $ pip\n<Command not found>\n\n$ workon projAENV\n(projAENV) $ pip freeze\nDjango==1.11\n\
  \n(projAENV) $ cd ProjectA/\n(projAENV) $ python manage.py runserver\n...\n\n(projAENV)\
  \ $ deactivate\n$\n```\n\n上面的代码块创建了新虚拟环境 `projAENV`。然后我们将 Django 1.11 安装到该虚拟环境，再执行\
  \ `pip freeze` 列出已安装的包——从而确认 Django 已安装。接着我们停用虚拟环境。此时 `pip` 命令找不到了，因为我们已不在虚拟环境中！通过\
  \ `workon` 重新启用该虚拟环境后，我们的 Django 包就能再次被找到。最后两条命令为 `ProjectA` 启动了 Django 开发服务器。\n\
  \n然后我们可以创建第二个虚拟环境 `projBENV`。\n\n## 多个 Python 版本\n\n如果你安装了多个 Python 版本，你可以在创建虚拟环境时选择使用哪个版本的\
  \ Python。如果你安装了 `python`（启动 2.7.15）和 `python3`（启动 3.7.2），可以执行以下命令来创建 Python 3 虚拟环境。\n\
  \n```shell\n$ mkvirtualenv -p python3 someenv\n$ python\nPython 3.7.2\n>>>\n```\n\
  \n注意，启用虚拟环境后，启动 Python 时输入的命令就是 `python`。`pip` 也是一样——如果你在虚拟环境外使用 `pip3`，那么在虚拟环境内应使用\
  \ `pip`。\n\n### 使用 pip\n\nPython 包管理器使用起来非常直接，可以让你跟踪已安装的各种 Python 包（软件）。我们强烈建议你将\
  \ `pip` 与虚拟环境配合使用，因为使用 `pip` 安装的包只会出现在该虚拟环境中。\n\n当你找到想要安装的包时，需要使用的命令是 `$ pip install\
  \ <packagename>==<version>`。注意版本部分是可选的；省略特定包的版本将意味着会安装最新的可用版本。\n\n你可以通过查阅 [PyPi\
  \ 包索引](https://pypi.org/)⁵⁹ 来找到包名称，`pip` 会从该索引下载软件。只需搜索或浏览索引即可找到所需内容。一旦了解了包名，就可以在终端或命令提示符中执行安装命令。\n\
  \n`pip` 在列出环境中已安装的包时也非常有用。\n\n> ⁵⁹ https://pypi.org/\n\n这可以通过 `pip freeze` 命令实现。示例输出如下。\n\
  \n```text\n(rangeenv) $ pip freeze\nDjango==2.1.5\nPillow==5.4.1\npytz==2018.9\n\
  ```\n\n这显示在给定环境中安装了三个包：Django、Pillow 和 pytz。该命令的输出通常保存到名为 `requirements.txt` 的文件中，并存储在\
  \ Python 项目的根目录。如果有人想使用你的软件，他们可以连同 `requirements.txt` 文件一起下载你的软件。利用该文件，他们可以创建一个新的虚拟环境，其中安装好所需包，从而使软件正常工作。\n\
  \n创建你自己的 `requirements.txt` 文件的推荐方法是，将 `pip freeze` 命令的输出通过管道重定向到该文件。导航到想要创建文件的目录，并执行以下命令。\n\
  \n```text\n$ cd awesome_python_project\n$ pip freeze > requirements.txt\n```\n\n\
  这样就会创建你的 `requirements.txt` 文件。然后你可以将其添加到项目的版本控制中。看到 `requirements.txt` 文件的 Python\
  \ 开发者应该很清楚该怎么使用它！\n\n如果你遇到这种情况，可以带 `-r` 开关运行 `pip`。假设在 `downloaded_project` 目录中有一个\
  \ `requirements.txt`，其中只列有 `pytz==2018.9`，那么一个示例 CLI 会话大致如下。\n\n```text\n$ git\n\
  usage: git [--version] [--help] [-C <path>] [-c name=value]\n                  \
  \       [--exec-path[=<path>]] [--html-path] [--man-path] [--info-path]\n      \
  \                   [-p | --paginate | -P | --no-pager] [--no-replace-objects] [--bare]\n\
  \                         [--git-dir=<path>] [--work-tree=<path>] [--namespace=<name>]\n\
  \                         <command> [<args>]\n```\n\n## UNIX 命令快速入门\n\n根据你的计算背景，你可能见过也可能没见过\
  \ UNIX 系统——或其衍生系统。这门小型速成课程重点帮助你快速上手*终端*，即你向计算机发出命令来执行的应用。这与点击式的*图形用户界面（GUI）*不同，后者大大降低了计算的使用门槛。基于终端的界面使用起来可能更复杂，但使用这种界面的好处包括更快、更准确地完成任务。\n\
  \n> **不适用于 Windows！**\n> \n> 请注意，我们关注的是 Bash shell，一种用于 UNIX 操作系统及其衍生系统（包括 macOS\
  \ 和 Linux 发行版）的 shell。如果你是 Windows 用户，可以使用 [Windows 命令提示符](http://www.ai.uga.edu/mc/winforunix.html)\
  \ 或 [Windows PowerShell](https://msdn.microsoft.com/en-us/powershell/mt173057.aspx)。Windows\
  \ 10 用户现在可以[直接从 Microsoft 安装](https://docs.microsoft.com/en-us/windows/wsl/install-win10)必要的基础设施，从而在\
  \ Windows 安装中使用 Bash！你也可以尝试[安装 Cygwin](https://www.cygwin.com/) 将 Bash 命令带到 Windows。\n\
  \n### 使用终端\n\nUNIX 操作系统及其衍生系统——如 macOS 和 Linux 发行版——都使用外观相似的终端应用，通常采用 [Bash shell](https://en.wikipedia.org/wiki/Bash_(Unix_shell))。它们都拥有一套核心命令，使你能够浏览计算机的文件系统并启动程序——整个过程都无需任何图形界面。\n\
  \n使用终端时，知道自己在文件系统中的位置非常重要。要查看当前位置，可以执行 `pwd` 命令。这会显示你的*当前工作目录*（即 pwd）。例如，请看下面的终端交互示例。\n\
  \n```text\nLast login: Sun Jul 21 15:47:24 2019\nsibu:~ david$ pwd\n/users/grad/david\n\
  sibu:~ david$\n```\n\n你可以看到，本示例中的当前工作目录是 `/users/grad/david`。\n\n你还会注意到，提示符显示当前工作目录为波浪号\
  \ `~`。波浪号是代表你的*主目录*的特殊符号。任何 UNIX 文件系统中的基础目录是*根目录*。根目录的路径用单个正斜杠 `/` 表示。由于文件夹（或目录）在\
  \ UNIX 路径中用 `/` 分隔，因此单个 `/` 就表示根目录！\n\n如果你不在主目录中，可以执行以下命令来*更改目录*（`cd`）：\n\n```text\n\
  sibu:/ david$ cd ~\nsibu:~ david$\n```\n\n注意执行 `cd ~` 命令后，当前工作目录如何从 `/` 切换到 `~`。\n\
  \n\n\n\n## 路径快捷方式\n\nUNIX shell 提供了多种简写方式，方便你在计算机的文件系统中移动。你已经看到，正斜杠 (/) 表示根目录⁷⁰，波浪号\
  \ (~) 表示存储所有文件的主目录。不过，还有一些特殊字符可以与 `cd` 命令结合使用，帮助你在文件系统中移动。\n\n- 执行 `cd ~` 将始终返回你的主目录。在某些\
  \ UNIX 或 UNIX 衍生系统中，直接执行 `cd` 也会返回主目录。\n- 执行 `cd ..` 会将当前工作目录在文件系统层级中**上移一级**。例如，如果你当前位于\
  \ `/users/grad/david/code/`，执行 `cd ..` 将移动到 `/users/grad/david/`。\n- 执行 `cd -` 将移动到**你之前所在的工作目录**。你的\
  \ shell 会记住之前的位置，所以如果你曾在 `/var/tmp/` 并移动到了 `/users/grad/david/`，执行 `cd -` 将直接返回\
  \ `/var/tmp/`。此命令仅在当前终端会话中至少切换过一次目录时才有效。\n\n现在，让我们在主目录中创建一个名为 `code` 的目录。为此，你可以使用*创建目录*命令\
  \ `mkdir`。\n\n```text\nsibu:~ david$ mkdir code\nsibu:~ david$\n```\n\n没有命令成功的确认信息。我们可以使用\
  \ `cd` 命令将当前工作目录切换到 `code`。如果切换成功，我们就知道目录已成功创建。\n\n```text\nsibu:~ david$ cd code\n\
  sibu:code david$\n```\n\n再执行一次 `pwd` 命令来确认当前工作目录，返回的输出是 `/users/grad/david/code`。这是我们的主目录，末尾附加了\
  \ `code`。你也可以从上面的示例提示符中看到，当前工作目录从 `~` 变为了 `code`。\n\n### 返回主目录\n\n现在执行命令返回主目录。你输入什么命令？\n\
  \n从主目录开始，让我们尝试另一个命令，看看存在哪些文件和目录。这个新命令叫做 `ls`，是 *list*（列表）的缩写。在主目录中执行 `ls` 会得到类似下面的输出。\n\
  \n```text\nsibu:~ david$ ls\ncode\n```\n\n这显示主目录中有一个名为 `code` 的条目，正如我们预期的那样。我们可以通过在\
  \ `ls` 命令末尾添加 `l` 开关来获取更详细的信息——其中 `l` 代表 *list*（列表）。\n\n```text\nsibu:~ david$ ls\
  \ -l\ndrwxr-xr-x  2 david  grad  68 21 Jul 15:00 code\n```\n\n这为我们提供了额外的信息，例如修改日期（4月2日\
  \ 11:07）、条目所有者（用户 david，组 grad）、条目大小（68 字节）以及文件权限（`drwxr-xr-x`）。虽然这里不深入讨论文件权限，但需要注意的关键点是字符串开头的\
  \ `d` 表示该条目是一个目录。如果我们在主目录中添加一些文件并重新执行 `ls -l` 命令，就能观察到文件与目录显示方式的差异。\n\n```text\n\
  sibu:~ david$ ls -l\ndrwxr-xr-x  2 david  grad       68 21 Jul 15:00 code\n-rw-r--r--@\
  \ 1 david  grad   303844  2 Apr 16:16 document.pdf\n-rw-r--r--  1 david  grad  \
  \     14  2 Apr 11:14 readme.md\n```\n\n`ls` 命令最后一个有用的开关是 `a` 开关，它会显示*所有*文件和目录。这很有用，因为某些目录和文件可能被操作系统*隐藏*，以保持界面整洁。执行该命令会显示更多的文件和目录！\n\
  \n```text\nsibu:~ david$ ls -la\n-rw-r--r--  1 david  grad      463 20 Feb 19:58\
  \ .profile\ndrwxr-xr-x 16 david  grad      544 25 Mar 11:39 .virtualenvs\ndrwxr-xr-x\
  \  2 david  grad       68 21 Jul 15:00 code\n-rw-r--r--@ 1 david  grad   303844\
  \  1 Apr 16:16 document.pdf\n-rw-r--r--  1 david  grad       14  2 Apr 11:14 readme.md\n\
  ```\n\n这个命令显示了一个隐藏目录 `.virtualenvs` 和一个隐藏文件 `.profile`。请注意，在 UNIX 基础（或衍生）计算机上，隐藏文件以句点\
  \ (`.`) 开头。与 Windows 计算机不同，这里没有可以应用的特殊隐藏文件属性。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_380_0.png)\n\
  \n### 组合 ls 开关\n\n你可能已经注意到，在上面的 `ls` 示例中，我们组合了 `l` 和 `a` 开关，以强制命令输出显示所有隐藏文件的列表。这是一个有效的命令——而且还有**更多可以使用的开关**[^71]\
  \ 来自定义 `ls` 的输出。\n\n直接从终端创建文件也非常简单。`touch` 命令可以创建一个新的空白文件。如果我们想创建一个名为 `new.txt`\
  \ 的文件，执行 `touch new.txt`。然后如果我们列出目录，就会看到该文件已被添加。\n\n[^71]: http://man7.org/linux/man-pages/man1/ls.1.html\n\
  \n```text\nsibu:~ david$ ls -l\ndrwxr-xr-x  2 david  grad       68 21 Jul 15:00\
  \ code\n-rw-r--r--@ 1 david  grad   303844  1 Apr 16:16 document.pdf\n-rw-r--r--\
  \  1 david  grad        0  2 Apr 11:35 new.txt\n-rw-r--r--  1 david  grad      \
  \ 14  2 Apr 11:14 readme.md\n```\n\n注意 `new.txt` 的文件大小——它是 0 字节，表示这是一个空文件。我们可以使用终端中可用的众多文本编辑器之一来开始编辑文件，例如\
  \ nano⁷² 或 vi⁷³。虽然这里不介绍如何使用这些编辑器，但你可以在网上查找简单的教程⁷⁴。我们建议从 nano 开始——虽然与其他编辑器相比功能较少，但使用\
  \ nano 要简单得多。\n\n### 核心命令\n\n在上述简短教程中，你已经了解了 `pwd`、`ls` 和 `cd` 等核心命令。不过，在真正开始工作之前，你还需要熟悉一些其他的标准\
  \ UNIX 命令。下面列出这些命令供你参考，其中大部分侧重于文件管理。列表中包含每个命令的说明和使用示例。\n\n- **pwd：** 如前所述，此命令会在终端中显示你的*当前工作目录*。它会显示你当前所在位置的完整路径。\n\
  - **ls：** 在终端中显示当前工作目录中的文件列表。\n- **cd：** 结合路径使用，`cd` 允许你更改当前工作目录。例如，命令 `cd /users/grad/david/`\
  \ 将当前工作目录更改为 `/users/grad/david/`。你也可以使用两个点向上移动一个目录层级，而无需提供*绝对路径*⁷⁵，例如 `cd ..`。\n\
  - **cp：** 复制文件和/或目录。你必须提供*源*和*目标*。例如，要在同一目录中复制文件 `input.py`，可以执行命令 `cp input.py\
  \ input_backup.py`。\n\n## Git 速成课程\n\n我们强烈建议你花一些时间熟悉用于应用程序代码库的版本控制⁸⁰系统。本章为你提供如何使用\
  \ Git⁸¹ 的速成课程，Git 是众多可用版本控制系统之一。Git 最初由 Linus Torvalds⁸² 开发，如今已成为使用最广泛的版本控制系统之一⁸³，开源和闭源项目均在使用它。\n\
  \n本教程在高层次上演示了 Git 的工作原理，解释了你可以使用的基本命令，并讲解了 Git 的工作流程。学完本章后，你将能够对 Git 仓库做出贡献，从而支持你独立工作或团队协作。\n\
  \n### 为什么使用版本控制？\n\n随着软件工程技能的发展，你会发现自己能够规划和实现越来越复杂问题的解决方案。通常来说，问题规格越大，需要编写的代码就越多。编写的代码越多，就越应重视软件工程实践。这些实践包括设计模式的使用以及\
  \ DRY（Don't Repeat Yourself，不要重复自己）⁸⁴ 原则。\n\n想想你迄今为止的编程经历。你是否遇到过以下任何一种情况？\n\n- 代码写错了，意识到错误后想回退？\n\
  - 丢失了代码（由于驱动器故障），或者备份太旧？\n\n\n\n\n\n## 什么是仓库？\n\n我们不断重复使用 *repository* 这个词，但它到底是什么意思？在考虑版本控制时，仓库是一个数据结构，其中包含有关你在版本控制系统中存储的文件的元数据（一种描述其他数据的*元*数据）。所存储的元数据种类可能包括诸如给定文件中发生的历史变更等内容，以便你记录所有发生的变更。\n\
  \n如果你想了解更多 Git 存储的元数据，可以阅读这篇 [技术教程](http://www.sbf5.com/~cduan/technical/git/git-1.shtml)。\n\
  \n现在，让我们先概述 Git 系统的各个不同方面。我们会回顾一些我们已经提到过的内容，只是为了确保你能理解。\n\n- 如前所述，**远程仓库** 是存储在某个远程服务器上的项目仓库的副本。对于拥有多个贡献者的\
  \ Git 项目来说，这一点尤其重要——你需要一个中央位置来存储团队成员产生的所有工作。你可以在一台具有互联网访问权限且防火墙配置良好的计算机上设置 Git 服务器（例如查看\
  \ [这个 Server Fault 问题](https://serverfault.com/questions/189070/what-firewall-ports-need-to-be-open-to-allow-access-to-external-git-repositories)），或简单地使用众多提供免费\
  \ Git 仓库的服务之一。今天最广泛使用的服务之一是 [GitHub](https://github.com/)。事实上，本书在 GitHub 上也有一个 [Git\
  \ 仓库](https://github.com/maxwelld90/tango_with_django_2_code/)！\n- **本地仓库** 是存储在你计算机（本地）上的远程仓库的副本。这是你进行所有添加、更改和删除操作的仓库。当你达到某个里程碑时，你可以将所有本地更改\
  \ *push* 到远程仓库。从那里，你可以指示团队成员检索你的更改。这个概念被称为从远程仓库 *pull*。我们随后会更详细地解释推送和拉取。\n\n## 如何克隆远程仓库\n\
  \n克隆你的仓库使用 `git clone` 命令是一个直接的过程。用你的远程仓库的 URL 补充此命令——如果需要，还包括身份验证详细信息。你的仓库的 URL\
  \ 根据你使用的提供商而有所不同。如果你不确定要输入的 URL，可以尝试用搜索引擎查询或向知情人士询问。\n\n对于 GitHub，请尝试以下命令，并根据需要替换以下部分：\n\
  \n```bash\n$ git clone https://github.com/<OWNER>/<REPO_NAME> <workspace>\n```\n\
  \n其中你将\n\n- `<OWNER>` 替换为拥有该仓库的人的用户名；\n- `<REPO_NAME>` 替换为你项目仓库的名称；以及\n- `<workspace>`\
  \ 替换为你的工作区目录的名称。这是可选的；省略此选项将简单地创建一个与仓库同名的目录。\n\n如果一切成功，你会看到如下示例所示的文本。\n\n```text\n\
  $ git clone https://github.com/maxwelld90/tango_with_django_2_code/ twd2code\nCloning\
  \ into 'twd2code'...\nremote: Enumerating objects: 354, done.\nremote: Counting\
  \ objects: 100% (354/354), done.\nremote: Compressing objects: 100% (253/253), done.\n\
  remote: Total 354 (delta 217), reused 223 (delta 86), pack-reused 0\nReceiving objects:\
  \ 100% (354/354), 1.11 MiB | 1.78 MiB/s, done.\nResolving deltas: 100% (217/217),\
  \ done.\n```\n\n如果输出行以 `done` 结尾，一切应该都已正常工作。检查你的文件系统，看看目录是否已创建，运行 `$ ls` ——目录现在是否列出？\n\
  \n## 不使用 GitHub？\n\n许多网站提供 Git 仓库——有些免费，有些付费。虽然本章使用 GitHub，但你可以使用任何你喜欢的服务。其他提供商包括\
  \ Atlassian Bitbucket⁹⁵ 和 Unfuddle⁹⁶。如果你使用除 GitHub 之外的服务，你将需要更改克隆仓库的 URL。\n\n> ⁹⁵\
  \ https://bitbucket.org/\n> ⁹⁶ https://unfuddle.com/\n\n## 目录结构\n\n一旦你将远程仓库克隆到你的本地计算机，使用终端、命令提示符或\
  \ GUI 文件浏览器导航到该目录。如果你克隆的是一个空仓库，工作区目录看起来应该为空。这个目录是你开始添加项目文件的空白工作区。\n\n然而，该目录并非完全空白！仔细检查，你会注意到一个名为\
  \ `.git` 的隐藏目录。存储在此目录中的是本地仓库和本地索引。**请勿更改 .git 目录的内容。** 这样做可能会损坏你的 Git 设置并破坏版本控制功能。*因此，你新建的工作区实际上在其内部包含了本地仓库和索引。*\n\
  \n## 最后的调整\n\n工作区设置好后，现在是进行一些最后调整的好时机。在这里，我们讨论两个有用的功能，你可以尝试一下，这可能会让你的生活（以及你的团队成员的生活）变得更轻松一些。\n\
  \n在使用 Git 仓库作为团队的一部分时，你所做的任何更改都将与你用于访问远程 Git 仓库的用户名相关联。然而，你也可以指定你的全名和电子邮件地址，以便包含在你在远程仓库上所做的更改中。只需打开命令提示符或终端并导航到你的工作区。从那里，发出两个命令：一个告诉\
  \ Git 你的全名，另一个告诉 Git 你的电子邮件地址。\n\n```bash\n$ git config user.name \"Ivan Petrov\"\
  \n$ git config user.email \"ivanpetrov123@me.bg\"\n```\n\n将示例姓名和电子邮件地址替换为你自己的——除非你的名字是\
  \ John Doe！\n\n## .gitignore 文件\n\nGit 还为你提供了停止——或忽略——特定文件不被添加到版本控制的能力。例如，你可能不希望包含用于访问网络服务的唯一密钥的文件被添加到版本控制中。如果该文件被添加到远程仓库，任何人理论上都可以通过克隆仓库来访问该文件。在\
  \ Git 中，文件可以通过包含在 `.gitignore` 文件中来忽略，该文件位于 `<workspace>` 的根目录。当添加文件到版本控制时，Git 会解析此文件。如果要添加到版本控制的文件在\
  \ .gitignore 中列出，则该文件将被忽略。 .gitignore 的每一行都应是一个单独的文件条目。\n\n查看以下 .gitignore 文件的示例：\n\
  \n```gitignore\n.pyc\n.DS_Store\n__pycache__/\ndb.sqlite3\n*.key\nthumbs.db\n```\n\
  \n在此示例 .gitignore 文件中，有六个条目——每行一个。我们在下面详细说明每个条目。\n\n- 第一个条目提示 Git 忽略任何扩展名为 `.pyc`\
  \ 的文件——通配符 `*` 表示任何内容。 .pyc 文件是 Python 模块的字节码表示⁹⁷，Python 为模块创建它以加快执行速度。在提交到版本控制时，这些文件可以安全地忽略。\n\
  - 第二个条目 `.DS_Store` 是 macOS 系统创建的隐藏文件。这些文件包含你在 Finder 中浏览文件系统时设置自定义属性。自定义属性可能例如表示图标的位置，或你在给定目录中显示文件时使用的视图。\n\
  - 第三个条目表示名称为 `__pycache__` 的任何目录。此目录是 Python 3 的新功能，是你的模块字节码表示⁹⁸ 的存放位置。同样，这些目录可以安全地忽略。\n\
  - `db.sqlite3` 是你的数据库。请阅读下面的注释，了解为什么它应始终从你的仓库中排除的详细解释。\n- `*.key` 是第五个条目。这表示任何扩展名为\
  \ `key` 的文件，这是我们使用的约定，其中扩展名为此的文件包含敏感信息——如 API 身份验证的密钥。这些文件永远不应被提交——这样做相当于公开分享你的密码！\n\
  - 最后一个条目是 `thumbs.db`。与 macOS 创建的 `.DS_Store` 文件一样，这是 Windows 的等效文件。\n\n> ⁹⁷ https://stackoverflow.com/a/2998228\n\
  > ⁹⁸ https://stackoverflow.com/a/16869074\n\n记住，通配符在这里是一个很棒的功能。如果你有任何你不希望提交的文件类型，只需使用\
  \ `*.abc` 来表示任何文件名，扩展名为 `.abc`。\n\n## .gitignore – 我还应该忽略什么？\n\n有许多种文件可以安全地从 Git\
  \ 仓库中忽略提交和推送。示例包括临时文件、数据库（可以轻松重新创建）和特定于操作系统的文件。特定于操作系统的文件包括在给定文件浏览器中查看目录时外观的配置。Windows\
  \ 计算机创建 `thumbs.db` 文件，而 macOS 创建 `.DS_Store` 文件。\n\n\n\n\n\n## （不）提交你的数据库\n\n你还应该采取措施忽略存储库中其他会频繁变化的基于二进制的文件。以本书为例，你需要考虑忽略数据库（正如我们在上面演示的那样）。为什么？在团队中工作时，每个人对数据库的副本可能都会有所不同。不同的团队成员可能会添加与其他成员不同的示例数据。如果所有团队成员都不停地推送不同版本的数据库，产生冲突的可能性就会增加。这也是我们鼓励开发一个填充脚本来快速用示例数据填充新数据库的原因！这里的经验法则是：不要将数据库提交到项目存储库中。要提交从头创建数据库所需的基础设施，并且作为额外福利，提供用示例数据填充这个空白数据库的功能。\n\
  \n## 基本命令与工作流程\n\n当你已将存储库克隆到本地计算机并准备就绪后，就可以开始掌握 Git 工作流程了。本节将向你展示基本的 Git 工作流程，以及你可以发出的相关\
  \ Git 命令。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_393_0.png)\n\nGit 工作流程图。\n\
  \n我们在上面提供了基本 Git 工作流程的示意图。将黑色圆圈中的每个编号与下方的编号描述对应起来，以了解更多关于每个阶段的信息。**当你对下一步应该做什么不确定时，请参考此图——它非常有用！**\n\
  \n### 1. 起步\n\n在开始项目工作之前，你必须先准备好 Git。如果你还没有整理好项目的 Git 工作区，则需要**克隆你的存储库来进行设置**。\n\
  \n如果你已经克隆了存储库，养成使用 `git pull` 命令更新本地副本的习惯是一个好做法。这会*拉取*远程存储库中的最新更改到你的计算机上。通过这样做，你将使用存储库的最新版本。这将减少文件版本冲突的可能性，而冲突真的会让你的生活变得有些糟糕。\n\
  \n要执行 `git pull`，首先在命令提示符或终端中导航到你的存储库目录，然后发出 `git pull` 命令。查看下面来自 Bash 终端的片段，了解你需要做什么，以及应该看到什么输出。\n\
  \n```\n$ cd somerepository/\n$ git pull\nremote: Counting objects: 3, done.\nremote:\
  \ Compressing objects: 100% (2/2), done.\nremote: Total 3 (delta 0), reused 0 (delta\
  \ 0), pack-reused 0\nUnpacking objects: 100% (3/3), done.\nFrom https://github.com/someuser/somerepository\n\
  \    86a0b3b..a7cec3d  master     -> origin/master\nUpdating 86a0b3b..a7cec3d\n\
  Fast-forward\n    README.md | 1 +\n 1 file changed, 1 insertion(+)\n create mode\
  \ 100644 README.md\n```\n\n此示例显示，通过最新一次拉取，README.md 文件已被更新或创建。\n\n### 遇到错误？\n\n\
  如果你收到 `fatal: Not a git repository (or any of the parent directories): .git`，说明你不在正确的目录中。你需要\
  \ `cd` 到你的本地存储库目录——即你克隆存储库的那个目录。大多数 Git 命令只有在 Git 存储库中才能正常工作。\n\n### 先拉取再推送！\n\n\
  在开始工作之前，始终在你的存储库本地副本上执行 `git pull`。务必如此！在你即将推送之前，再执行一次拉取，以确保你拥有最新的更改。\n\n记住要与团队沟通以协调你的活动，这样你们就不会处理相同的文件，或者使用分支⁹⁹来保持内容独立。分支在某个时候会涉及合并回单个分支。\n\
  \n### 2. 开始工作！\n\n一旦你的工作区已克隆或更新为最新更改，就是时候开始干活了！在你的工作区目录中，你可以修改现有文件。你也可以删除它们，或添加新文件以进行版本控制。\n\
  \n当你以任何方式修改存储库时，都需要让 Git 了解你所做的任何更改——这不会自动发生。告诉 Git 发生了什么变化，可以让你保持本地索引更新。本地索引中存储的文件列表随后将用于执行你的下一次*提交（commit）*，我们将在下一步中讨论。为了让\
  \ Git 保持同步，有几个 Git 命令可以让你更新本地索引。其中三个命令与 Unix 速成课程中讨论的命令（例如 cp、mv）几乎相同，只是多了个 git\
  \ 前缀。\n\n- 第一个命令 `git add` 允许你请求 Git 将某个特定文件添加到*暂存区（staging）*，以供下一次提交使用。对于任何你想要纳入版本控制的文件——无论它是新文件还是已更新的文件，你都必须\
  \ `git add` 它。通过输入 `git add <filename>` 来调用该命令，其中 `<filename>` 是你希望添加到下一次提交中的文件的名称。可以使用\
  \ `git add .` 命令一次添加多个文件和目录——**但请务必小心**¹⁰⁰。\n- `git mv` 的功能与 Unix 的 `mv` 命令相同——它用于移动文件。两者唯一的区别在于，`git\
  \ mv` 会在移动文件之前为你更新本地索引。使用语法 `git mv <current_filename> <new_filename>` 指定文件名。例如，使用此命令，你可以将文件移动到存储库中的另一个目录。这将在你的下一次提交中体现出来。该命令也用于重命名文件——从当前文件名改为新文件名。\n\
  - `git cp` 允许你复制文件或目录，同时为你把新文件的引用添加到本地索引中。语法与上面的 `git mv` 相同，指定文件名或目录名的方式如下：`git\
  \ cp <current_filename> <copied_filename>`。\n- `git rm` 命令将文件或目录的删除请求添加到本地索引中。虽然\
  \ `git rm` 命令不会立即删除文件，但在下一次提交时，所请求的文件或目录会从你的文件系统和 Git 存储库中移除。语法与 `git add` 命令类似，可以这样指定文件名：`git\
  \ rm <filename>`。请注意，你可以一次性向本地索引添加大量请求，而不是手动逐个删除文件。例如，`git rm -rf media/` 会在本地索引中为\
  \ `media/` 目录创建删除请求。`r` 开关使 Git 能够*递归地*删除 `media/` 目录中的每个文件，而 `f` 则允许 Git *强制*删除这些文件。有关\
  \ `rm` 命令的更多信息，请查看 [Wikipedia 页面](http://en.wikipedia.org/wiki/Rm_(Unix))。\n\n提交之间的大量更改可能会让事情变得相当混乱。例如，你可能会轻易忘记已经指示\
  \ Git 删除哪些文件。幸运的是，你可以运行 `git status` 命令查看已从当前工作目录修改但尚未添加到本地索引进行处理的文件列表。看看下面命令的典型输出，以便了解你可以看到什么。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_396_0.png)\n\n### 使用 `.gitignore` 文件\n\
  \n如果你已经[正确设置了 `.gitignore` 文件](#)，你会注意到，当你 `git add` 时，与 `.gitignore` 文件中指定模式匹配的文件会被忽略。这是预期行为——这些文件不应该被提交到版本控制中！然而，如果你确实需要包含一个位于\
  \ `.gitignore` 中的文件，你可以在必要时使用 `git add -f <filename>` 命令*强制* Git 包含它。\n\n```\nOn\
  \ branch master\nYour branch is up-to-date with 'origin/master'.\n\nChanges not\
  \ staged for commit:\n  (use \"git add <file>...\" to update what will be committed)\n\
  \  (use \"git checkout -- <file>...\" to discard changes in working directory)\n\
  \n        modified:   chapter-git.md\n        modified:   chapter-system-setup.md\n\
  \nUntracked files:\n  (use \"git add <file>...\" to include in what will be committed)\n\
  \n        images/screenshot_template.ai\n\nno changes added to commit (use \"git\
  \ add\" and/or \"git commit -a\")\n```\n\n文件 `chapter-git.md`、`chapter-system-setup.md`\
  \ 和 `images/screenshot_template.ai` 都列在上面的示例输出中。所有路径都是相对于你当前工作目录的，因此最后一个文件添加了 `images/`\
  \ 前缀——它位于一个 images 子目录中。\n\n仔细阅读 `git status` 命令的输出，我们可以看到 `chapter-git.md` 和 `chapter-system-setup.md`\
  \ 文件已被你的 Git 存储库知晓，但它们与上一次提交相比已被*修改*。命令的输出告诉你，为了让这些更改反映在下一次提交中，你必须 `git add` 这些文件。与上一次提交相关的已删除或移动的文件也会出现在这里。\n\
  \n还有一个*未跟踪文件（untracked files）*部分。这些文件从未被提交到版本控制中——因此不会出现在任何 Git 提交中。你刚刚创建的文件会出现在这个部分。要提交它们，你只需依次\
  \ `git add` 每个文件。如果你再次运行 `git status`，你会看到它们移到了第一个部分。\n\n### 检查状态\n\n有关 `git status`\
  \ 命令的更多信息，请查看 [官方 Git 文档](https://git-scm.com/docs/git-status)。\n\n\n\n\n\n## 3.\
  \ 提交你的更改\n\n在前面的步骤中，我们已经多次提到*提交*——但这到底是什么意思呢？提交就是保存你在工作区内所做的更改，这些更改会列在本地索引中。你提交得越频繁，在代码出错时，你能够回退到旧版本的机会就越多。这就像游戏中的检查点——到达检查点后你可以保存当前状态，也许还能在将来需要时回滚。\n\
  \n请务必经常提交，**但不要提交某个模块或功能的不完整或损坏版本，你的同事会因此恨你的。** 关于什么时候是理想的提交时机，有很多讨论。[看看这个 Stack\
  \ Overflow 页面](http://stackoverflow.com/questions/1480723/dvcs-how-often-and-when-to-commit-changes)了解几位开发者的看法。不过，只有在一切正常工作时才提交确实是合理的做法。再次强调，设身处地想一想：如果你发现同事提交了一个损坏的版本，你会作何感想？\n\
  \n要提交更改，需要执行 `git commit` 命令。此时，你在索引中已有的对现有文件的任何更改都会被保存到版本控制中。此外，你通过本地索引请求复制、删除、移动或添加到版本控制中的任何文件，也会在这一步得到处理。当你提交时，你是在更新本地仓库的\
  \ *HEAD*。\n\n### 提交要求\n\n![](img/75169a27287f7c945bf2cbf7dede5251_398_0.png)\n\n\
  要成功提交，你需要在仓库中至少修改一个文件，并通过 `git add` 命令指示 Git 提交它。有关如何执行此操作的更多信息，请参阅上一步。\n\n在提交时，向未来的自己和其他人解释你提交的原因是非常有用的。如果你愿意，可以在提交时附上一条可选的消息。不要只是简单地运行\
  \ `git commit`，而是运行下面修改后的命令。\n\n> 103 http://stackoverflow.com/questions/1480723/dvcs-how-often-and-when-to-commit-changes\n\
  > 104 http://stackoverflow.com/questions/2304087/what-is-git-head-exactly\n\n```bash\n\
  $ git commit -m \"Chapter 5 exercises completed\"\n```\n\n从上面的示例可以看出，使用 -m 开关并在其后跟一个字符串，可以让你在提交时附加一条消息。消息要尽可能明确，但也不要写得太多。人们希望一眼就能看出你做了什么，不想被一篇冗长的文章弄得无聊或困惑。同时，也不要太含糊。仅仅写上\
  \ `Updated models.py` 可能能告诉开发者你修改了哪个文件，但他们需要进一步调查才能确切知道你改了些什么。\n\n### 合理的提交\n\n\
  虽然频繁提交可能是好事，但你应该确保在提交之前，你所写的内容是可用的。这听起来可能有些愚蠢，但这确实是一个非常容易忽略的问题。再次强调（这是第三次了），提交无法工作的代码可能会让你的团队成员非常恼火，因为如果他们回滚到你的项目代码库中一个损坏的版本，那可就麻烦了！\n\
  \n## 4. 同步你的仓库\n\n### 协作时的要点\n\n在做出更改之前同步你的本地仓库至关重要，这能确保你最大限度地减少冲突发生的可能性。请务必养成在推送之前先拉取的习惯。\n\
  \n在你提交了本地仓库并完成更改之后，你差不多就可以通过推送更改将提交发送到远程仓库了。但是，如果你的团队中有人在你之前推送了他们的更改怎么办？这意味着你的本地仓库将与远程仓库失去同步，你执行任何\
  \ `git push` 命令都会失败。\n\n因此，在更新远程仓库之前，检查远程仓库是否已有更改总是一个好主意。运行 `git pull` 命令会拉取下更新。团队中每个人都在自己的本地工作区执行拉取命令。`git\
  \ push` 命令不像提交那样频繁使用——*你需要一次或多次提交才能执行推送。* 你可以争取每天推送一次，或者在某个特定功能完成时推送，也可以在需要你更新后的代码的团队成员提出请求时推送。\n\
  \n要推送你的更改，最简单的命令是：\n\n```bash\n$ git push origin master\n```\n\n正如[这个 Stack Overflow\
  \ 问答页面](http://stackoverflow.com/questions/7311995/what-is-git-push-origin-master-help-with-gits-refs-heads-and-remotes)中所解释的，这个命令指示\
  \ `git push` 命令将你的本地 master 分支（你的更改保存在那里）推送到 *origin*（你最初克隆的远程服务器）。如果你使用的是涉及[分支和合并](http://git-scm.com/book/en/Git-Branching-Basic-Branching-and-Merging)的更复杂设置，请将\
  \ master 改为你想要推送的分支名称。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_401_0.png)\n\n\
  ### 重要的推送？\n\n如果你的 git 推送特别重要，你也可以通过发出*拉取请求*来提醒其他团队成员应该拉取你的更改以更新他们的本地仓库。在你推送最新更改后，执行\
  \ `git request-pull master` 命令即可，其中 master 是你的分支名称（这是默认值）。如果你使用的是 GitHub 之类的服务，Web\
  \ 界面允许你无需输入命令即可生成请求。查看[官方 GitHub 网站的教程](https://help.github.com/articles/using-pull-requests)以了解更多信息。\n\
  \n## 从错误中恢复\n\n本节将介绍一个程序员最糟糕的噩梦的解决方案：如果你发现代码不再工作了怎么办？也许是重构出了问题，或者是另一个团队成员未经讨论就修改了某些内容。无论什么原因，使用某种形式的版本控制总能给你最后的办法：回滚到之前的提交。本节将详细介绍如何做到这一点。我们遵循这个\
  \ Stack Overflow¹¹¹问答页面提供的信息。\n\n### 更改可能会丢失！\n\n你应该知道，本指南会将你的工作区回滚到以前的某个迭代版本。你所做的任何未提交的更改都将丢失，而且找回的可能性微乎其微！请务必小心。如果你只是某个文件有问题，你总可以查看这些文件的不同版本进行比较。看看这个\
  \ Stack Overflow 页面¹¹²了解如何做到这一点。\n\n将工作区回滚到之前的提交包括两个步骤：确定要回滚到哪个提交，以及执行回滚。要确定回滚到哪个提交，可以使用\
  \ `git log` 命令。在工作区目录下执行此命令，将显示你最近提交的列表、你的姓名以及提交日期。此外，每次提交时保存的消息也会显示出来。这就是为什么提供包含足够信息的提交消息是非常有益的，它能解释你在每次提交时做了什么！看看下面从\
  \ `git log` 调用中得到的输出来自己验证一下。\n\n```text\ncommit 88f41317640a2b62c2c63ca8d755feb9f17cf16e\
  \                     <- 提交哈希\nAuthor: John Doe <someaddress@domain.com>       \
  \                    <- 作者\nDate:   Mon Jul 8 19:56:21 2019 +0100              \
  \                 <- 日期/时间\n    Nearly finished initial version of the requirements\
  \ chapter <- 提交消息\ncommit f910b7d557bf09783b43647f02dd6519fa593b9f\nAuthor: John\
  \ Doe <someaddress@domain.com>\nDate:   Wed Jul 3 11:35:01 2019 +0100\n    Added\
  \ in the Git figures to the requirements chapter.\ncommit c97bb329259ee392767b87cfe7750ce3712a8bdf\n\
  Author: John Doe <someaddress@domain.com>\nDate:   Tue Jul 2 10:45:29 2019 +0100\n\
  \    Added initial copy of Sphinx documentation and tutorial code.\ncommit 2952efa9a24dbf16a7f32679315473b66e3ae6ad\n\
  Author: John Doe <someaddress@domain.com>\nDate:   Mon Jul 1 03:56:53 2019 -0700\n\
  \    Initial commit\n```\n\n\n\n## 练习\n\n如果你还没有完成本章所讨论的内容，现在就应该全部过一遍，以确保你的 Git 仓库准备就绪。为了尝试所有内容，你可以在你的\
  \ `<workspace>` 目录根目录下创建一个新文件 `README.md`。GitHub¹¹³ 将使用该文件在你项目的 GitHub 主页上提供信息。\n\
  \n- 创建该文件，并为你的项目写入一些介绍性文本。\n- 在完成编写后，将文件添加到本地暂存区并提交你的更改。\n- 将新文件推送到远程仓库，并在 GitHub\
  \ 网站上观察更改。\n\n完成这些基本步骤后，你可以返回并进一步编辑 readme 文件。进行 add、commit 和 push——然后尝试恢复到初始版本，看看一切是否按预期工作。\n\
  \n¹¹³ https://help.github.com/articles/github-flavored-markdown\n\n## 还有更多！\n\n\
  Git 还有其他一些本章未涉及的高级功能。例如，**分支（branching）**和**合并（merging）**，它们对于有不同发布版本的项目非常有用。如果你有兴趣将你的超强版本控制技能进一步提升，网上有很多很棒的教程。关于这些功能的更多细节，请查看这个\
  \ [Git 入门教程](https://veerasundar.com/blog/2011/06/git-tutorial-getting-started/)、[Git\
  \ 指南](https://rogerdudler.github.io/git-guide/)或[学习 Git 分支](https://pcottle.github.io/learnGitBranching/)。\n\
  \n然而，如果你只是把本章作为掌握 Git 的简单指南，那么我们已经涵盖的内容应该足够了。祝你好运！\n\n![](img/75169a27287f7c945bf2cbf7dede5251_404_0.png)\n"
- "## CSS 快速入门\n\n在 Web 开发中，我们使用*层叠样式表（CSS）*来描述 HTML 文档的呈现方式（即其外观和感觉）。HTML 文档中的每个元素都可以被*设置样式*。给定\
  \ HTML 元素的 CSS 描述了它在屏幕上的渲染方式。这是通过为与元素关联的不同*属性*赋予*值*来改变其外观。在本章中，我们将向你介绍 CSS 的基础知识——以及如何操作出现在网页上的元素。请将本章内容视为本书的补充材料；我们在[前面的章节](#)中使用\
  \ Twitter 的 [Bootstrap CSS](https://getbootstrap.com/) 工具包来完成大部分样式设计。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_405_0.png)\n\
  \n### CSS 属性\n\n你可以在样式表中使用许多许多不同的 CSS 属性。每个属性都提供不同的功能。查看 [W3C 网站](https://www.w3.org/Style/CSS/all-properties.en.html)以获得可用属性的完整列表。[pageresource.com](http://www.pageresource.com/dhtml/cssprops.htm)\
  \ 也有一个简洁的属性列表，并附有每个属性作用的描述。请查看 css-course-reading-label 一节以获取更全面的链接列表。\n\nCSS 遵循*选择并应用*模式工作。对于指定元素，将应用一组样式属性。请看下面的[图示](#)中的示例，其中有一些包含\
  \ `<h1>` 标签的 HTML。在 CSS 代码示例中，我们指定所有 h1 都将被设置样式。在本章后面，我们将再次讨论[选择器](#)。不过，目前你可以假设所定义的\
  \ CSS 样式将应用于我们的 `<h1>` 标签。该样式包含四个属性：\n\n- `font-size`，将字体大小设置为 16pt；\n- `font-style`，当设置为\
  \ *italic* 时，会将文档中所有 `<h1>` 标签的内容变为斜体；\n- `text-align`，将 `<h1>` 标签的文本居中（当设置为 `center`\
  \ 时）；以及\n- `color`，通过[十六进制颜色代码](https://htmlcolorcodes.com/) `#FF0000` 将文本颜色设置为红色。\n\
  \n应用所有这些属性后，可以在浏览器中看到最终的页面渲染效果，如下面的图所示。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_406_0.png)\n\
  \n- `rel`，用于指定 HTML 文档与所链接资源（即样式表）之间的关系；\n- `type`，用于指定 CSS 的 [MIME 类型](http://en.wikipedia.org/wiki/Internet_media_type)；以及\n\
  - `href`，应指向你要包含的样式表 URL 的属性。\n\n添加此标签后，你的样式表将与 HTML 页面一起包含在内，并且样式表中的样式将应用于页面中的元素。你应该知道，CSS\
  \ 样式表被视为一种**静态媒体**，因此应将它们放在项目的静态目录中。\n\n### 内联 CSS\n\n![](img/75169a27287f7c945bf2cbf7dede5251_408_0.png)\n\
  \n你也可以*内联*地将 CSS 添加到 HTML 文档中，也就是说，CSS 作为 HTML 页面的一部分包含在内。但通常不建议这样做，因为它消除了表现语义（CSS）与内容（HTML）之间的抽象。\n\
  \n### 基础 CSS 选择器\n\nCSS 选择器用于将特定样式映射到特定的 HTML 元素。本质上，CSS 选择器是一种*模式*。在这里，我们介绍三种基本的\
  \ CSS 选择器形式：*元素选择器*、*id 选择器*和*类选择器*。在本章后面，我们还会涉及所谓的*伪选择器*。\n\n### 元素选择器\n\n以上面的[渲染示例](#)中的\
  \ CSS 示例为例，我们可以看到选择器 h1 匹配任何 `<h1>` 标签。任何引用此类标签的选择器都可以称为*元素选择器*。我们可以将元素选择器应用于任何\
  \ HTML 元素，例如 `<body>`、`<h1>`、`<h2>`、`<h3>`、`<p>` 和 `<div>`。这些元素都可以进行类似的样式设置。但是，使用元素选择器相当粗糙——样式会应用于特定标签的*所有*实例。我们通常需要更精细的方法来选择要设置样式的元素，这时就轮到\
  \ *id 选择器*和*类选择器*登场了。\n\n### ID 选择器\n\n*id 选择器*用于映射到网页上的唯一元素。网页上的每个元素都可以通过 `id`\
  \ 属性分配一个唯一的 id，CSS 正是利用这个标识符将样式应用到元素上。这种选择器以井号（#）开头，后面紧跟你要匹配的元素的标识符。请看下面的图示例。\n\n\
  ![](img/75169a27287f7c945bf2cbf7dede5251_409_0.png)\n\n一幅演示如何在 CSS 中使用 id 选择器的插图。请注意，蓝色标题的标识符与\
  \ CSS 属性 #blue_header 相匹配。\n\n### 类选择器\n\n另一种选择是使用*类选择器*。这种方法与 *id 选择器*类似，区别在于你可以合法地将多个元素作为同一类的目标。如果你有一组希望应用相同样式的\
  \ HTML 元素，请使用基于类的方法。使用此方法的选择器是\n\n\n\n在类名前面加上句点（.），然后用花括号（{ }）打开样式。请看下面的图例。\n\n\
  ![](img/75169a27287f7c945bf2cbf7dede5251_410_0.png)\n\n**该图演示了 CSS 中类选择器的使用。蓝色标题通过使用\
  \ `.blue` CSS 样式来覆盖 `h1` 样式的红色文本。**\n\n## 确保 id 是唯一的\n\n尽量少用 id 选择器。[问问自己：](https://net.tutsplus.com/tutorials/html-css-techniques/the-30-css-selectors-you-must-memorize/)\
  \ *我是否需要为此元素应用标识符才能定位它？* 如果你需要将一组给定的样式应用于多个元素，答案永远是**否**。在这种情况下，你应该使用类或元素选择器。\n\n\
  ## 字体\n\n由于可用的字体数量庞大，在 Web 开发中使用字体历来是一个陷阱。设想这样一个场景：一位 Web 开发人员在其网页上安装并使用了一种特定字体。这种字体相当晦涩——因此该字体出现在其他计算机上的概率相对较小。\n\
  \n访问开发者网页的用户随后会因为其系统中没有该字体而看到页面渲染不正确。CSS 通过 `font-family` 属性解决了这个特定问题。\n\n你为 `font-family`\
  \ 指定的值可以是一个*可能的字体列表*——你的计算机或其他设备安装的第一个字体就是用于渲染网页的字体。随后，指定 HTML 元素内的文本将应用所选字体。下面显示的示例\
  \ CSS 在存在 *Arial* 字体时应用它。如果没有，则查找 *Helvetica*。如果该字体不存在，则应用任何可用的**无衬线字体**。\n\n```css\n\
  h1 {\n    font-family: 'Arial', 'Helvetica', sans-serif;\n}\n```\n\n1996 年，微软发起了[核心网页字体](http://en.wikipedia.org/wiki/Core_fonts_for_the_Web)计划，以保证所有计算机上都存在一组特定的字体。然而，如今你几乎可以使用任何你喜欢的字体——查看\
  \ [Google Fonts](http://www.google.com/fonts) 了解你可以使用的字体示例，以及[这篇 W3Schools 文章](https://www.w3schools.com/howto/howto_google_fonts.asp)了解如何使用此类字体。使用字体时，请务必遵守许可协议！\n\
  \n## 颜色和背景\n\n颜色对于定义网站的外观和感觉非常重要。你可以更改网页中任何元素的颜色，从背景颜色到边框和文本。在本书中，我们使用单词和*十六进制颜色代码*来选择我们想要的颜色。正如你从下图所示的基本颜色列表中所看到的，你可以为你想要使用的颜色提供*十六进制*或*RGB（红-绿-蓝）*值。你也可以[指定描述颜色的单词](https://www.w3schools.com/colors/colors_names.asp)，例如绿色、黄色或蓝色，以及它们对应的六字符十六进制代码。你也可以尝试诸如\
  \ color-hex.com¹³² 之类的网站，它可以让你对可选择的颜色进行精细控制。\n\n- ¹²⁵ http://en.wikipedia.org/wiki/Sans-serif\n\
  - ¹²⁶ http://en.wikipedia.org/wiki/Core_fonts_for_the_Web\n- ¹²⁷ http://www.google.com/fonts\n\
  - ¹²⁸ https://www.w3schools.com/howto/howto_google_fonts.asp\n- ¹²⁹ https://www.w3schools.com/colors/colors_names.asp\n\
  \n### 十六进制颜色代码\n\n有关如何使用十六进制对颜色进行编码的更多信息，请查看这份详细的教程¹³³。\n\n### 注意你的英语！\n\n你可能已经注意到，CSS\
  \ 使用美式英语拼写单词。因此，有一些单词与英式拼写略有不同，比如 color 和 center。如果你是在英国或澳大利亚长大的，请仔细检查你的拼写，并准备好拼成那种“错误”的方式！\n\
  \n### 文本颜色\n\n要更改元素内文本的颜色，必须将 color 属性应用于包含要更改文本的元素。例如，以下 CSS 将使用类 `red` 的元素中的所有文本改为红色。\n\
  \n```css\n.red {\n  color: #FF0000;\n}\n```\n\n你可以通过将文本包裹在 `<span>` 标签内来更改网页中一小部分文本的呈现方式。为元素分配一个类或唯一标识符，然后你就可以在样式表中引用该\
  \ `<span>` 标签并应用 color 属性。在下面的示例标记中，使用上面定义的 `red` 类，文本 `fire engine` 将以红色显示。\n\n\
  ```html\n<span>\n    I saw a police car and <span class=\"red\">fire engine</span>\
  \ drive past me.\n</span>\n```\n\n### 边框\n\n你也可以更改元素*边框*的颜色。我们将在 [CSS 盒模型](#) 中讨论什么是边框。现在，我们将向你展示如何为它们应用颜色，使一切看起来更漂亮。\n\
  \n边框颜色可以使用 `border-color` 属性指定。你可以为边框的四边提供一种颜色，也可以为每一边指定不同的颜色。要实现这一点，你需要提供不同的颜色，每个颜色之间用空格分隔。\n\
  \n```css\n.some-element {\n    border-color: #000000 #FF0000 #00FF00;\n}\n```\n\n\
  在上面的示例中，我们使用多种颜色为三个边指定不同的颜色。从顶部开始，顺时针旋转。因此，每条边的颜色顺序应为 `top right bottom left`。\n\
  \n我们的示例为任何具有类 `some-element` 的元素应用黑色顶部边框、红色右侧边框和绿色底部边框。未提供左侧边框值，这意味着左侧边框保持透明。若要仅为元素边框的一侧指定颜色，请考虑在适当情况下使用\
  \ `border-top-color`、`border-right-color`、`border-bottom-color` 和 `border-left-color`\
  \ 属性。\n\n### 背景颜色\n\n你也可以通过使用 CSS `background-color` 属性来更改元素背景的颜色。与上面描述的 `color`\
  \ 属性一样，`background-color` 属性可以通过指定单个颜色作为其值来轻松应用。看看下面的示例，它为整个网页应用了亮绿色背景。不是很漂亮！\n\n\
  ```css\nbody {\n  background-color: #00FF00;\n}\n```\n\n### 背景图像\n\n当然，指定颜色并不是更改背景的唯一方法。你也可以将背景图像应用于元素。我们可以通过\
  \ `background-image` 属性来实现这一点。\n\n```css\n#some-unique-element {\n  background-image:\
  \ url('../images/filename.png');\n  background-color: #000000;\n}\n```\n\n上面的示例使用\
  \ filename.png 作为标识符 `some-unique-element` 的元素的背景图像。图像的路径是相对于你的 CSS 样式表的路径指定的，而不是相对于网页本身。我们上面的示例使用双点表示法来指定图像的相对路径¹³⁴。我们还应用了黑色背景颜色来填充背景图像留下的空隙——它可能不会填满元素的整个大小。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_415_0.png)\n\n### 背景图像定位\n\n默认情况下，背景图像位于相关元素的左上角，并在水平和垂直轴上重复。你可以通过使用\
  \ `background-repeat` 属性更改图像的重复方式¹³⁵来自定义此功能。你也可以使用 `background-position` 属性指定图像放置的位置¹³⁶。\n\
  \n## 容器、块级元素和内联元素\n\n到目前为止，在整个速成课程中，我们已经向你介绍了 `<span>` 元素，但一直没有告诉你它是什么。在本节中，当我们解释*内联*和*块级*元素时，一切都会变得清晰。\n\
  \n`<span>` 被认为是所谓的*容器元素*。与 `<div>` 标签一样，这些元素本身没有意义，只是为了让你以逻辑方式包含和分隔页面内容。例如，你可以使用\
  \ `<div>` 包含与导航栏相关的标记，再用另一个 `<div>` 包含与网页页脚相关的标记。或者，你可以使用 `<nav>` 和 `<footer>` 容器元素！由于容器本身没有意义，通常应用样式来帮助控制网页的呈现语义。\n\
  \n容器有两种：*块级元素*和*内联元素*。请查看下图了解这两种元素的实际效果，并继续阅读每种元素的简短描述。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_416_0.png)\n\
  \n**该图演示了块级元素和内联元素默认的渲染方式。** 在图中，块级元素以绿色显示，注意每个元素之间是如何换行的。相反，内联元素可以出现在同一行上并彼此相邻。你也可以将块级元素和内联元素相互嵌套，但块级元素不能嵌套在内联元素中。\n\
  \n\n\n\n\n## 基本定位\n\n在本 CSS 速成课程中，我们尚未涉及的一个重要概念是网页中元素的位置。大多数情况下，你会满意内联元素并排出现，而块级元素在下方依次出现。这些元素被称为\
  \ *静态定位*。\n\n然而，会有需要对所有内容放置位置进行更多控制的场景。在本节中，我们将简要介绍在网页上定位元素的三种重要技术：*浮动、相对定位* 和 *绝对定位*。\n\
  \n### 浮动\n\nCSS *浮动* 是在网页中定位元素的最直接技术之一。使用浮动可以让我们将元素定位到特定容器 – 或页面 – 的左侧或右侧。\n\n让我们通过一个示例来说明。考虑以下\
  \ HTML 标记和 CSS 代码。\n\n```html\n<div class=\"container\">\n    <span class=\"yellow\"\
  >Span 1</span>\n    <span class=\"red\">Span 2</span>\n</div>\n```\n\n![](img/75169a27287f7c945bf2cbf7dede5251_420_0.png)\n\
  \n这将使 `.yellow` 元素浮动，使其脱离网页的自然流。实际上，它现在不再位于 `.container` 容器内。这就解释了为什么父容器现在不会随着 `<span>`\
  \ 元素向下填充，就像你期望的那样。你可以如下面所示将 `overflow: hidden;` 属性应用于父容器来修复此问题。有关此技巧的工作原理的更多信息，请查看\
  \ [这篇 QuirksMode.org 在线文章](http://www.quirksmode.org/css/clearing.html)。\n\n```css\n\
  .container {\n    border: 1px solid black;\n    overflow: hidden;\n}\n```\n\n![](img/75169a27287f7c945bf2cbf7dede5251_420_1.png)\n\
  \n应用 `overflow: hidden` 可确保我们的 `.container` 延伸到适当的高度。\n\n### 相对定位\n\n如果需要在网页上对元素的位置进行更大程度的控制，可以使用\
  \ *相对定位*。正如名称可能暗示的那样，相对定位允许你将元素 *相对于它原本所在的位置* 进行定位。我们使用 `position: relative;` 属性和值配对来实现相对定位。然而，这只是故事的一部分。\n\
  \n让我们解释一下其工作原理。考虑我们之前的示例，其中两个 `<span>` 元素位于其容器内。\n\n```\n<div class=\"container\"\
  >\n    <span class=\"yellow\">Span 1</span>\n    <span class=\"red\">Span 2</span>\n\
  </div>\n\n.container {\n    border: 1px solid black;\n    height: 200px;\n}\n\n\
  .yellow {\n    background-color: yellow;\n    border: 1px solid black;\n}\n\n.red\
  \ {\n    background-color: red;\n    border: 1px solid black;\n}\n```\n\n这会产生以下结果\
  \ – 正如我们所期望的那样。请注意，我们人为地将容器元素的高度增加到 200 像素。这将为我们提供更多可操作的空间。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_421_0.png)\n\
  \n现在让我们尝试相对定位我们的 `.red` `<span>` 元素。首先，我们将 `position: relative` 应用于我们的 `.red` 类，如下所示。\n\
  \n```css\n.red {\n    background-color: red;\n    border: 1px solid black;\n   \
  \ float: right;\n    position: relative;\n    right: 100px;\n}\n```\n\n![](img/75169a27287f7c945bf2cbf7dede5251_424_0.png)\n\
  \n这意味着相对定位的工作基准是元素原本所在的位置 – 无论是否应用了其他改变位置的属性。\n\n### 绝对定位\n\n我们的最后一种定位技术是 *绝对定位*。虽然我们仍然修改样式的\
  \ `position` 参数，但我们使用 `absolute` 作为值而不是 `relative`。与相对定位不同，绝对定位将元素放置 *相对于其第一个位置值不为\
  \ static 的父元素*。这听起来可能有点令人困惑，但让我们逐步进行，以弄清楚到底发生了什么。\n\n首先，我们可以再次采用两个彩色 `<span>` 元素位于\
  \ `<div>` 容器内的早期示例。两个 `<span>` 元素像自然那样并排放置。\n\n```html\n<div class=\"container\"\
  >\n    <span class=\"yellow\">Span 1</span>\n    <span class=\"red\">Span 2</span>\n\
  </div>\n```\n\n```css\n.container {\n    border: 1px solid black;\n    height: 70px;\n\
  }\n\n.yellow {\n    background-color: yellow;\n    border: 1px solid black;\n}\n\
  \n.red {\n    background-color: red;\n    border: 1px solid black;\n}\n```\n\n这会产生下面所示的输出。请注意，我们再次将\
  \ `.container` 高度设置为人为值 70 像素，以给我们更多空间。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_425_0.png)\n\
  \n我们现在对 `.red` 元素应用绝对定位。\n\n```css\n.red {\n    background-color: red;\n    border:\
  \ 1px solid black;\n    position: absolute;\n}\n```\n\n与相对定位一样，这对网页中红色元素的位置没有总体影响。我们必须应用\
  \ `top`、`bottom`、`left` 或 `right` 中的一个或多个，新的位置才会生效。作为演示，我们可以像下面的示例中那样将 `top` 和 `left`\
  \ 属性应用于红色元素。\n\n```css\n.red {\n    background-color: red;\n    border: 1px solid\
  \ black;\n    position: absolute;\n    top: 0;\n    left: 0;\n}\n```\n\n![](img/75169a27287f7c945bf2cbf7dede5251_426_0.png)\n\
  \n哇，这里发生了什么？我们的红色元素现在位于容器之外！你会注意到，如果在浏览器窗口中运行此代码，红色元素会出现在视口的左上角。这因此意味着，当对具有绝对定位的元素应用\
  \ `top`、`bottom`、`left` 和 `right` 属性时，它是相对于视口绝对定位的 – (0,0) 在左上角。\n\n由于我们的容器元素的默认位置设置为\
  \ `position: static`，红色和黄色元素分别移动到屏幕的左上角和右下角。让我们现在修改我们的 `.yellow` 类，将黄色 `<span>`\
  \ 移动到页面右下角的 5 像素处。`.yellow` 类现在看起来像下面的示例。\n\n```css\n.yellow {\n    background-color:\
  \ yellow;\n    border: 1px solid black;\n    position: absolute;\n    bottom: 5px;\n\
  \    right: 5px;\n}\n```\n\n这会产生以下结果。\n\n但如果我们不想让元素相对于整个页面绝对定位怎么办？更常见的是，我们希望根据容器调整元素的位置。如果我们回顾绝对定位的定义，我们会注意到绝对位置是\
  \ *相对于第一个位置值不为 static 的父元素* 计算的。由于我们的容器是两个 `<span>` 元素的唯一父元素，因此绝对定位元素相对的容器因此是 HTML\
  \ 页面的 `<body>`。我们可以通过向 `.container` 类添加 `position: relative` 来更改此设置，就像下面的示例中一样。\n\
  \n```css\n.container {\n  border: 1px solid black;\n  height: 70px;\n  position:\
  \ relative;\n}\n```\n\n这会产生以下结果。`.container` 成为第一个位置值不为 `static` 的父元素，这意味着我们的 `<span>`\
  \ 元素会附着其上！\n\n![](img/75169a27287f7c945bf2cbf7dede5251_427_0.png)\n\n我们的元素现在相对于\
  \ `.container` 绝对定位。太好了！现在，让我们调整两个 `<span>` 元素的位置值以移动它们。\n\n你创建的元素或框，以及它们在浏览器视口中的呈现方式。每个元素或框由\
  \ *四个独立区域* 组成，所有这些区域都在下图中说明。元素的周围框可以分为三个部分，从内到外分别是：*填充区域*、*边框区域* 和 *外边距区域*。元素本身（无论是文本还是图像）位于中间作为\
  \ *内容区域*。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_429_0.png)\n\n展示 CSS 盒模型的插图，附带图例显示模型四个区域。\n\
  \n对于网页中的每个元素，你可以使用相应的属性 `margin`、`padding` 和 `border` 创建外边距、应用填充或边框。外边距在元素边框周围清除一个透明区域；这意味着外边距对于在元素之间创建间隙非常有用。相比之下，填充在元素的内容与其边框之间创建间隙。这给人一种元素显得更宽的感觉。如果你为元素提供背景颜色，背景颜色会随元素的填充一起扩展。最后，边框就是你所期望的\
  \ – 它们在元素的内容和填充周围提供边框。\n\n有关 CSS 盒模型的更多信息，请查看 Mozilla 对该模型的优秀解释¹⁴¹。为什么不甚至订购一件印有盒模型的\
  \ T 恤¹⁴²？\n\n¹⁴¹ https://developer.mozilla.org/en-US/docs/Learn/CSS/Introduction_to_CSS/Box_model\n\
  ¹⁴² http://cssboxmodel.com/\n\n\n\n\n\n## 注意宽度！\n\n正如你可能从盒模型插图中了解到的那样，元素的宽度并不是简单地由你为元素宽度输入的值来定义的。相反，你应该始终考虑元素两侧边框和内边距的宽度。这可以用数学公式表示为：\n\
  \n```\ntotal_width = content_width + left padding + right padding + left border\n\
  \              + right border + left margin + right margin\n```\n\n别忘了这一点。记住它，你将省去很多麻烦！\n\
  \n## 边框与内边距\n\n如果你发现自己正在处理带有边框和/或内边距的元素，那么计算出精确的宽度可能会很困难。在宽度至关重要的情况下，你可能想要探索 `box-sizing`\
  \ 属性¹⁴³，以更好地控制宽度和高度。请阅读链接的 W3Schools 文章了解更多信息。这个属性已经在很多情况下帮了我们大忙！\n\n## 样式化列表\n\n\
  列表无处不在。无论你是在阅读课程的学习成果列表，还是阅读火车的时刻表列表，你都知道列表是什么样子，并且欣赏它的简洁性。如果你的网页上有一组项目，为什么不使用 HTML\
  \ 列表呢？在网页中使用列表有助于形成良好的 HTML 文档结构，使基于文本的浏览器、屏幕阅读器和其他不支持 CSS 的浏览器能够合理地呈现你的页面。\n\n\
  然而，默认情况下，列表对最终用户来说并不是特别吸引人。以下面的 HTML 列表为例，我们将一边尝试不同的事物，一边对其进行样式设置。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_432_0.png)\n\
  \n虽然我们可能有正确的方向，但现在我们的列表看起来很糟糕。一个元素从哪里开始，另一个从哪里结束？完全是一团糟！让我们调整列表元素的样式，并添加一些对比度和内边距，使其看起来更美观。\n\
  \n```\n.example-list li {\n    display: inline;\n    background-color: #333333;\n\
  \    color: #FFFFFF;\n    padding: 10px;\n}\n```\n\n应用之后，我们的列表看起来好多了——而且相当专业！\n\n\
  ![](img/75169a27287f7c945bf2cbf7dede5251_432_1.png)\n\n从这个示例中，希望可以清楚地看出，列表可以很容易地定制，以满足你网页的需求。关于如何样式化列表的更多信息和灵感，你可以查看下面的一些精选链接。\n\
  \n- 看看这篇关于在 A List Apart¹⁴⁴ 上样式化列表的优秀教程。\n- 查看来自 Web Designer Wall¹⁴⁵ 的高级教程，该教程使用图形制作出令人惊叹的列表。在教程中，作者使用了\
  \ Photoshop——如果你对 Photoshop 不自信，你可以尝试使用更简单的图形软件包。\n- 这个网站¹⁴⁶ 提供了一些关于如何样式化列表的很好的灵感和技巧。\n\
  \n列表样式化的可能性是无穷无尽的！你可以说这是一个永无止境的列表……\n\n¹⁴⁴ https://alistapart.com/article/taminglists/\n\
  ¹⁴⁵ https://webdesignerwall.com/tutorials/advanced-css-menu\n¹⁴⁶ https://learn.shayhowe.com/html-css/creating-lists/\n\
  \n## 样式化链接\n\nCSS 使你能够轻松地以你希望的任何方式设置超链接的样式。你可以更改它们的颜色、字体或任何其他你想要的方面——甚至可以在鼠标悬停在它们上方时更改它们的外观！\n\
  \n超链接在 HTML 页面中通过 `<a>` 标签表示，`<a>` 是 anchor（锚）的缩写。我们可以按照以下示例，对网页中的所有超链接应用样式。\n\n\
  ```\na {\n  color: red;\n  text-decoration: none;\n}\n```\n\n每个超链接的文本颜色都变为红色，并且移除了文本默认的下划线。如果我们随后想在用户悬停在链接上时再次更改\
  \ color 和 text-decoration 属性，我们可以使用所谓的伪选择器 `:hover` 来创建另一个样式。我们的两个样式现在如下面的示例所示。\n\
  \n```\na {\n  color: red;\n  text-decoration: none;\n}\n\na:hover {\n  color: blue;\n\
  \  text-decoration: underline;\n}\n```\n\n这将产生如下所示的链接。注意第二个链接的颜色变化——它正被鼠标悬停。\n\n\
  ![](img/75169a27287f7c945bf2cbf7dede5251_433_0.png)\n\n然而，你可能不希望整个网页上的链接样式都相同。例如，你的导航栏可能有深色背景，而你的其余部分\n\
  \n```html\n<div id=\"dark\">\n    <a href=\"http://www.google.co.uk/\">Google Search</a>\n\
  </div>\n\n<div class=\"light\">\n    <a href=\"http://www.bing.co.uk/\">Bing Search</a>\n\
  </div>\n```\n\n最终输出类似于下面显示的示例。将上面的示例编码，然后在浏览器中悬停在这些链接上，查看文本颜色的变化！\n\n![](img/75169a27287f7c945bf2cbf7dede5251_435_0.png)\n\
  \n只需少量的 CSS，你就能在网页呈现给用户的方式上做出一些重大改变。\n\n## 层叠\n\n值得指出的是*层叠样式表*中的*层叠*是如何发挥作用的。回顾本章开头处的\
  \ CSS 渲染示例，你会注意到显示的红色文本是**粗体**，但我们的 `h1` 样式中并没有定义这样的属性。这就是我们所说的*层叠样式*的一个完美示例。大多数\
  \ HTML 元素都有与之关联的*默认样式*，由 Web 浏览器应用。对于 `<h1>` 元素，W3C 网站提供了一个会被应用的典型样式¹⁴⁸。如果你检查这个典型样式，你会注意到它包含一个\
  \ `font-weight: bold;` 属性和值配对，这就解释了**粗体**文本的来源。当我们为 `<h1>` 元素定义进一步的样式时，典型的属性/值配对会*层叠*到我们的样式中。如果我们为现有的属性/值配对定义一个新值（例如我们为\
  \ `font-size` 所做的），我们就会*覆盖*现有的值。这个过程可以重复多次——过程结束时得到的属性/值配对将应用于相关元素。查看下图以了解层叠过程的图形表示。\n\
  \n"

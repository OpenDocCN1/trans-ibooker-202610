  \n3. 更新搜索表单定义，使其 action 指向分类 URL，而不是搜索 URL。\n\n4. 更新 `show_category()` 视图以处理 HTTP\
  \ POST 请求。视图必须在上下文字典中包含任何搜索结果，以便模板渲染。记住搜索查询将作为 POST 请求的一部分在字段 `query` 中提供。\n\n5.\

  \ *“cookie 法”*，要求欧盟境内托管的所有网站在用户首次访问网站时应显示 cookie 警告消息。上图展示了 BBC News 网站上的此类警告。你可以在\
  \ [这里](https://ico.org.uk/for-organisations/guide-to-pecr/cookies-and-similar-technologies/)\
  \ 阅读关于该法律的内容。\n\n如果你正在开发一个网站，你需要了解该法律，以及关于可访问性和更近期的可解释性等其他法律。\n\n> https://ico.org.uk/for-organisations/guide-to-pecr/cookies-and-similar-technologies/\n\
  \n现在亲自看看——查看 [下面的屏幕截图]。对于 Google Chrome，你可以通过访问 Chrome 的开发者工具来查看当前打开网站的 cookies，具体路径为\
  \ *Chrome 设置 > 更多工具 > 开发者工具*。当开发者工具面板打开时，点击 *Application* 选项卡，并在左侧的 *Storage* 子类别下查找\
  \ *Cookies*。如果你在 [你的电脑上] 打开了一个 Rango 页面，你将看到一个名为 *sessionid* 的 cookie。sessionid\
  \ cookie 包含 Django 用于唯一标识你的计算机与给定会话的一串字母和数字。有了此会话 ID，所有你的会话详情都可以访问——但它们仅存储在 *服务器端*。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_188_0.png)\n\n**Google Chrome 开发者工具的屏幕截图，其中突出显示了\
  \ sessionid cookie。**\n\n[^9]: http://127.0.0.1:8000/rango/\n\n## 无 Cookie\n\n在\
  \ *不使用 cookies* 的情况下持久化状态信息的一种替代方法是，将会话 ID 编码在 URL 中。例如，你可能见过像这样的 PHP 页面 URL：`http://www.site.com/index.php?sessid=some\
  \ seemingly random and long string.` 这意味着你不需要在客户端机器上存储 cookies，但 URL 会变得相当难看。这些\
  \ URL 违背了 Django 的原则，即提供简洁、简单且对人类友好的 URL。\n\n## 10.3 在 Django 中设置会话\n\n虽然这应该已经设置好并正常工作，但了解哪些\
  \ Django 模块提供哪些功能仍然是良好的实践。在会话的情况下，Django 提供了实现会话功能的中间件¹⁰。\n\n为了检查一切是否正常，打开你的 Django\
  \ 项目的 `settings.py` 文件。在文件中找到 `MIDDLEWARE` 列表。你应该在此列表中找到由字符串 `django.contrib.sessions.middleware.SessionMiddleware`\
  \ 表示的模块。如果看不到它，现在将其添加到列表中。正是 `SessionMiddleware` 中间件使创建唯一的 `sessionid` cookies 成为可能。\n\
  \n`SessionMiddleware` 设计为可灵活地与不同的会话信息存储方式配合使用。可以采用多种方法——你可以将所有内容存储在文件中、数据库中，甚至是内存缓存中。最直接的方法是使用\
  \ `django.contrib.sessions` 应用将会话信息存储在 Django 模型/数据库中。具体来说，我们指的是 Django 模型 `django.contrib.sessions.models.Session`。要使用此方法，你还需要确保\
  \ `django.contrib.sessions` 在你的 Django 项目 `settings.py` 文件的 `INSTALLED_APPS` 元组中。记住，如果你现在添加该应用，你需要使用通常的迁移命令更新数据库。\n\
  \n¹⁰ https://docs.djangoproject.com/en/2.1/topics/http/middleware/\n\n\n\n\n## 缓存会话\n\
  \n如果你希望获得更快的性能，不妨考虑使用缓存方式来存储会话信息。你可以查阅 [Django 文档中关于缓存会话的建议](https://docs.djangoproject.com/en/2.1/topics/http/sessions/#using-cached-sessions)。\n\
  \n## 10.4 Cookie 品尝会话\n\n虽然所有现代 Web 浏览器都支持 Cookie，但根据浏览器的安全级别，某些 Cookie 可能会被阻止。在继续之前，请确保你已启用对\
  \ Cookie 的支持。不过，很可能你已经准备好了。\n\n### 测试 Cookie 功能\n\n要测试 Cookie，可以使用 Django 的 request\
  \ 对象提供的一些便捷方法。我们特别感兴趣的有三个：`set_test_cookie()`、`test_cookie_worked()` 和 `delete_test_cookie()`。在其中一个视图中，你需要设置测试\
  \ Cookie。在另一个视图中，你需要测试 Cookie 是否存在。测试 Cookie 需要两个不同的视图，因为你需要等待查看客户端是否接受了来自服务器的 Cookie。\n\
  \n我们将使用两个已有的视图来完成这个简单练习：`index()` 和 `about()`。我们不会在页面本身上显示任何内容，而是利用 Django 开发服务器的终端输出，来验证\
  \ Cookie 是否正常工作。\n\n在 Rango 的 `views.py` 文件中，找到你的 `index()` 视图。在视图中添加下面这一行。为了确保该行被执行，请确保将它放在\
  \ return 语句之前。\n\n```python\nrequest.session.set_test_cookie()\n```\n\n在 `about()`\
  \ 视图中，添加下面三行。同样，请确保这些代码放在 `return` 语句*之前*，以确保它们被执行。return 语句会在该处终止执行。\n\n用户访问 Rango\
  \ 应用的次数，另一个则用于追踪他们最近一次访问网站的时间。跟踪最近一次访问的日期和时间，可以让我们（例如）每天只递增一次网站计数器，从而避免人们通过频繁刷新网站来增加计数器。\n\
  \n合理的假设是，用户进入 Rango 网站的入口是首页。打开 Rango 的 `views.py` 文件。我们首先创建一个函数——它接收 request 和\
  \ response 对象的句柄——用于处理 Cookie（`visitor_cookie_handler()`）。然后我们可以在 Rango 的 `index()`\
  \ 视图中使用这个函数。在 `views.py` 中添加以下函数。请注意，从技术上讲它并不是一个视图，因为它不返回 response 对象——它只是一个辅助函数¹²。\n\
  \n```python\ndef visitor_cookie_handler(request, response):\n    # Get the number\
  \ of visits to the site.\n    # We use the COOKIES.get() function to obtain the\
  \ visits cookie.\n    # If the cookie exists, the value returned is casted to an\
  \ integer.\n    # If the cookie doesn't exist, then the default value of 1 is used.\n\
  \    visits = int(request.COOKIES.get('visits', '1'))\n\n    last_visit_cookie =\
  \ request.COOKIES.get('last_visit', str(datetime.now()))\n    last_visit_time =\
  \ datetime.strptime(last_visit_cookie[:-7],\n        '%Y-%m-%d %H:%M:%S')\n\n  \
  \  # If it's been more than a day since the last visit...\n    if (datetime.now()\
  \ - last_visit_time).days > 0:\n        visits = visits + 1\n        # Update the\
  \ last visit cookie now that we have updated the count\n        response.set_cookie('last_visit',\
  \ str(datetime.now()))\n    else:\n        # Set the last visit cookie\n       \
  \ response.set_cookie('last_visit', last_visit_cookie)\n\n    # Update/set the visits\
  \ cookie\n    response.set_cookie('visits', visits)\n```\n\n这个辅助函数接收 request 和 response\
  \ 对象——因为我们希望从 request 中访问传入的 Cookie，并在 response 中添加或更新 Cookie。在函数中，你会看到我们调用了 `request.COOKIES.get()`\
  \ 函数，这是 Django 提供的另一个辅助函数。如果 Cookie 存在，它会返回该值。如果不存在，我们可以提供一个默认值。一旦我们获取了每个 Cookie\
  \ 的值，就可以计算自上次访问以来是否已经过去了一天（`.days`）。\n\n如果你想测试这段代码而不用等上一天，可以把 `days` 改成 `seconds`。这样，访问计数器就可以每秒钟更新一次，而不是每天更新一次。\n\
  \n**请注意，所有 Cookie 值都以字符串形式返回；** *不要以为存储整数的 Cookie 会返回整数。* 你必须自己手动将其转换为正确的类型，因为 Cookie\
  \ 中没有任何位置可以存储关于值类型的附加信息。\n\n如果某个 Cookie 不存在，你可以使用所创建的 response 对象的 `set_cookie()`\
  \ 方法来创建 Cookie。该方法接受两个值：你想创建的 Cookie 的名称（作为字符串）和 Cookie 的值。在这种情况下，你传入的值是什么类型并不重要——Django\
  \ 会自动将该值转换为字符串。\n\n由于我们使用了 datetime 对象，需要在 `views.py` 模块顶部将其导入。导入语句如下所示。\n\n```python\n\
  from datetime import datetime\n```\n\n接下来，更新 `index()` 视图以调用 `visitor_cookie_handler()`\
  \ 辅助函数。为此，我们需要先获取 response。注意，我们还要移除 `set_test_cookie()` 方法调用。此时，你也应该移除 `about()`\
  \ 视图中的测试 Cookie 代码。\n\n```python\ndef index(request):\n    category_list = Category.objects.order_by('-likes')[:5]\n\
  \    page_list = Page.objects.order_by('-views')[:5]\n\n    context_dict = {}\n\
  \    context_dict['boldmessage'] = 'Crunchy, creamy, cookie, candy, cupcake!'\n\
  \    context_dict['categories'] = category_list\n    context_dict['pages'] = page_list\n\
  \n    # Obtain our Response object early so we can add cookie information.\n   \
  \ response = render(request, 'rango/index.html', context=context_dict)\n```\n\n\
  ## 10.6 会话数据\n\n前面的示例展示了如何存储和操作客户端 Cookie——即存储在客户端的数据。然而，一种更安全的保存会话信息的方式是，将这些数据存储在服务器端。然后，我们可以使用存储在客户端（但实际上是无记名的）的会话\
  \ ID Cookie 作为访问数据的密钥。\n\n要使用基于会话的 Cookie，你需要执行以下步骤。\n\n1. 确保 `settings.py` 模块中的\
  \ `MIDDLEWARE_CLASSES` 列表包含 `django.contrib.sessions.middleware.SessionMiddleware`。\n\
  2. 配置你的会话后端。确保 `settings.py` 中的 `INSTALLED_APPS` 里有 `django.contrib.sessions`。如果没有，请添加它，并运行数据库迁移命令\
  \ `python manage.py migrate`。\n3. 默认情况下，会假定使用数据库后端，但你可能想使用不同的设置（例如缓存）。请参阅 [Django\
  \ 会话文档，了解其他后端配置](https://docs.djangoproject.com/en/2.1/topics/http/sessions/)。\n\
  \n你可以通过 `request.session.get()` 方法访问服务器端数据，并用 `request.session[]` 存储它们，而不是直接将 Cookie\
  \ 存储在 request 中（因而存储在客户端机器上）。请注意，仍然会使用会话 ID Cookie 来记住客户端的机器（所以从技术上讲，浏览器端 Cookie\
  \ 是存在的）。然而，所有用户/会话数据都存储在服务器端。Django 的会话中间件负责处理客户端 Cookie 以及用户/会话数据的存储。\n\n要使用服务器端数据，我们需要重构\
  \ `views.py`。首先，我们需要更新 `visitor_cookie_handler()` 函数，使其访问服务器端的 Cookie。我们可以通过调用 `request.session.get()`\
  \ 来实现这一点，并通过将它们放入字典 `request.session[]` 来存储。为了帮助我们，我们编写了一个名为 `get_server_side_cookie()`\
  \ 的辅助函数，它向 request 请求一个 Cookie。如果该 Cookie 在会话数据中，则返回其值。否则，返回默认值。\n\n\n\n\n\n下面。注意方法调用的顺序不同，因为我们不再需要在响应中操作\
  \ cookie。\n\n```python\ndef index(request):\n    category_list = Category.objects.order_by('-likes')[:5]\n\
  \    page_list = Page.objects.order_by('-views')[:5]\n\n    context_dict = {}\n\
  \    context_dict['boldmessage'] = 'Crunchy, creamy, cookie, candy, cupcake!'\n\
  \    context_dict['categories'] = category_list\n    context_dict['pages'] = page_list\n\
  \n    visitor_cookie_handler(request)\n    context_dict['visits'] = request.session['visits']\n\
  \n    response = render(request, 'rango/index.html', context=context_dict)\n   \
  \ return response\n```\n\n在重新启动 Django 开发服务器之前，删除现有的客户端 cookie 以重新开始。**混用来自之前实现的\
  \ cookie 可能会导致奇怪、令人沮丧的行为。**\n\n![](img/75169a27287f7c945bf2cbf7dede5251_197_0.png)\n\
  \n### 避免 Cookie 混淆\n\n强烈建议你在开始使用基于会话的数据之前删除 Rango 的所有客户端 cookie。你可以在浏览器 cookie 检查器中逐个删除每个\
  \ cookie，或者直接清空浏览器缓存——确保在此过程中删除了 cookie。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_197_1.png)\n\
  \n### 数据类型和 Cookie\n\n将会话数据存储在服务器端的额外优势在于其能够将数据从字符串转换为所需类型。然而，这仅适用于内置类型¹⁴，例如 int、float、long、complex\
  \ 和 boolean。如果你想存储字典或其他复杂类型，就不要指望它能工作。在这种情况下，你可能需要考虑 pickle 你的对象¹⁵。\n\n¹⁴ http://docs.python.org/3/library/stdtypes.html\
  \  \n¹⁵ https://wiki.python.org/main/UsingPickle\n\n## 10.7 浏览器长度和持久会话\n\n使用 cookie\
  \ 时，你可以使用 Django 的会话框架将 cookie 设置为 *浏览器长度会话* 或 *持久会话*。正如这两种会话类型的名称可能暗示的那样，\n\n-\
  \ **浏览器长度** 会话在用户关闭浏览器时过期；并且\n- **持久会话** 可以跨多个浏览器实例持续存在——在你选择的时间过期。这可能是半小时，甚至是未来一个月的时间。\n\
  \n默认情况下，浏览器长度会话是禁用的。你可以通过修改 Django 项目的 `settings.py` 模块来启用它们。添加新的布尔变量 `SESSION_EXPIRE_AT_BROWSER_CLOSE`，将其设置为\
  \ `True`。\n\n或者，持久会话默认启用，设置变量 `SESSION_EXPIRE_AT_BROWSER_CLOSE` 设置为 `False`，或在项目\
  \ `settings.py` 文件中不存在该变量（默认为 `False`）。持久会话还有一个额外的设置，`SESSION_COOKIE_AGE`，它允许你指定\
  \ cookie 可以存活多长时间。该值应为整数，表示 cookie 可以存活的秒数。例如，指定值为 1209600 意味着你的网站 cookie 在两周（14\
  \ 天）后过期。\n\n查看 [官方 Django 文档关于 cookie](https://docs.djangoproject.com/en/2.1/ref/settings/#session-cookie-age)\
  \ 上可用的设置以获取更多详细信息。你也可以查看 [Eli Bendersky 的博客](http://eli.thegreenplace.net/2011/06/24/django-sessions-part-i-cookies/)\
  \ 以获取关于 cookie 和 Django 的优秀教程。\n\n## 10.8 清除会话数据库\n\n会话很容易累积，包含会话信息的存储也会累积。如果你使用\
  \ Django 会话的数据库后端，你将需要定期清除存储 cookie 的数据库。这可以使用以下命令完成\n\n```\n$ python manage.py\
  \ clearsessions\n```\n\n[Django 文档](https://docs.djangoproject.com/en/2.1/topics/http/sessions/#clearing-the-session-store)\
  \ 建议运行\n\n在方括号之间。记住，cookie 全部以字符串形式返回，无论它们包含什么内容。因此，你必须准备好将其转换为正确的类型（例如使用 `int()`\
  \ 或 `float()`）。\n\n3. 如果 cookie 不存在，或你希望更新 cookie，将你希望保存的值传递给生成的响应。你将调用的用于创建或更新\
  \ cookie 的函数是 `response.set_cookie('<cookie_name>', value)`。提供两个参数：cookie 的名称，以及你希望设置的值。\n\
  \n如果你需要更安全的 cookie，则使用基于会话的 cookie。\n\n1. 首先，确保项目 `settings.py` 模块中的 `MIDDLEWARE_CLASSES`\
  \ 列表包含 `django.contrib.sessions.middleware.SessionMiddleware`。如果没有，请将其添加到列表中。\n\
  2. 配置你的会话后端 `SESSION_ENGINE`。请参阅 [Django 文档关于会话](https://docs.djangoproject.com/en/2.1/topics/http/sessions/)\
  \ 以了解各种后端配置。\n3. 通过 `request.session.get()` 检查 cookie 是否存在。\n4. 通过会话字典更新或设置 cookie。你可以在视图中使用以下语法访问\
  \ cookie：`request.session['<cookie_name>']`。将 `<cookie_name>` 替换为你希望访问的 cookie 的名称。\n"
- "# 11. 使用 Django-Registration-Redux 进行用户身份验证\n\n在前一章中，我们通过手动编写 URL、视图和模板添加了登录和注册功能。然而，此类功能对许多\
  \ Web 应用程序来说都很常见。正因为如此，开发人员创建了许多可添加到 Django 项目中的附加应用，以减少提供用户相关功能所需的代码量，例如登录、注册、一步和两步身份验证、密码更改、密码恢复等。在本章中，我们将更改\
  \ Rango 的登录和注册功能，使其使用名为 `django-registration-redux` 的包。\n\n这意味着我们需要重构代码以删除我们之前创建的登录和注册功能。从那里开始，我们将逐步设置和配置\
  \ Rango 以及更广泛的 `tango_with_django_project` 代码库以使用 `django-registration-redux` 应用程序。本章还将为你提供使用外部\
  \ Django 应用的经验，并展示将其集成到项目中是多么容易。\n\n## 11.1 设置 Django Registration Redux\n\n首先，我们需要使用\
  \ pip 将 `django-registration-redux` 版本 2.2 安装到你的开发环境中。在终端/命令提示符下执行以下命令。确保你的虚拟环境已激活！\n\
  \n```bash\n$ pip install -U django-registration-redux==2.2\n```\n\n安装包后，我们接下来需要告诉\
  \ Django 框架我们将使用 `django-registration-redux` Python 包中提供的注册应用。打开项目 `settings.py`\
  \ 模块，并滚动直到\n\n![](img/75169a27287f7c945bf2cbf7dede5251_209_0.png)\n\n如上图所示，注意注册表单包含新用户密码的两个字段。这在如今几乎每个网站上都是标准做法，并为验证用户输入的密码提供了一种方式。尝试注册，但输入不同的密码。\n\
  \n注意注册应用如何为你处理所有逻辑。该应用还能够在成功注册后将你重定向到 Rango 的主页，正如它根据项目 settings.py 模块中指定的 `LOGIN_REDIRECT_URL`\
  \ 设置所指示的那样。此时你是登录还是注销？\n\n### 重构现有项目\n\n现在你对注册代码感到满意，我们需要更新现有的 Rango 代码库以指向新的 django-registration-redux\
  \ URL。\n\n在 `rango/base.html` 模板中，更新以下 URL。\n\n\n\n\n\n## 提示\n\n为了帮助你完成上面的练习，以下提示可能会派上用场。\n\
  \n- 看看 [Anders Hofstee 的模板](https://github.com/macdhuiibh/django-registration-templates/tree/master/registration)\
  \ 来入门。特别是，查看这个仓库将非常有助于弄清楚你在此练习中需要的两个新模板应该如何命名。\n- 参考 [我们本章前面提供的表格]，来确定此练习所需的 URL\
  \ 和名称映射。\n\n## 12.1 模板\n\n### ⚠️ 复制和粘贴\n\n在入门章节中，我们说过不要复制粘贴——但这是一个例外。然而，如果你直接剪切和粘贴，最终会带入你不想要的额外文本。为了快速开始，请访问我们的\
  \ GitHub 页面，获取下面显示的[基础模板](http://bit.ly/twd2-bootstrap-base-template)。\n\n如果你不明白特定的\
  \ Bootstrap 类有什么作用，请查阅 [Bootstrap 文档](https://getbootstrap.com/docs/4.3/getting-started/introduction/)\
  \ 以加深理解。\n\n```html\n<!DOCTYPE html>\n\n{% load staticfiles %}\n{% load tango_template_tags\
  \ %}\n\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <meta name=\"\
  viewport\"\n          content=\"width=device-width, initial-scale=1, shrink-to-fit=no\"\
  >\n    <meta name=\"description\" content=\"\">\n    <meta name=\"author\"\n   \
  \       content=\"Mark Otto, Jacob Thornton, and Bootstrap contributors\">\n   \
  \ <meta name=\"generator\"\n          content=\"Jekyll v3.8.5\">\n    <link rel=\"\
  icon\" href=\"{% static 'images/favicon.ico' %}\">\n    <title>\n        Rango -\

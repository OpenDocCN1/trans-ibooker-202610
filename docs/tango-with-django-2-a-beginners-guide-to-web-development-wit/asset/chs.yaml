- "# 6. 模型、模板和视图\n\n既然我们已经设置了模型，并用一些示例数据填充了数据库，现在可以开始连接模型、视图和模板，以提供动态内容。在本章中，我们将逐步完成在主页面显示类别的过程，然后创建专门的类别页面，用于显示相关的链接列表。\n\
  \n## 6.1 工作流：数据驱动页面\n\n要做到这一点，在 Django 中创建数据驱动的网页有五个主要步骤。\n\n1. 在 `views.py` 模块中，`import`\
  \ 你想要使用的模型。\n2. 在视图函数中，查询模型以获取你想要展示的数据。\n3. 同样在视图中，将模型的结果传递到模板的 context（上下文）中。\n\
  4. 创建/修改模板，使其显示来自 context 的数据。\n5. 如果你还没有这样做，请将一个 URL 映射到你的视图。\n\n这些步骤强调了我们需要如何在\
  \ Django 框架内将模型、视图和模板绑定在一起。\n\n## 6.2 在 Rango 主页面上显示类别\n\n关于主页面的要求之一是在应用的数据库内显示前五个类别。为了满足这一要求，我们将逐一完成上述步骤。\n\
  \n#### 导入所需的模型\n\n首先，我们需要完成第一步。打开 `rango/views.py`，在文件顶部、其他导入语句之后，从 Rango 的 `models.py`\
  \ 文件中导入 `Category` 模型。\n\n```python\n# Import the Category model\nfrom rango.models\
  \ import Category\n```\n\n#### 修改索引视图\n\n在这里，我们将完成第二步和第三步，需要修改 `index()` 视图函数。记住，`index()`\
  \ 函数负责主页面视图。按如下方式修改 `index()`：\n\n```python\ndef index(request):\n    # Query the\
  \ database for a list of ALL categories currently stored.\n    # Order the categories\
  \ by the number of likes in descending order.\n    # Retrieve the top 5 only --\
  \ or all if less than 5.\n    # Place the list in our context_dict dictionary (with\
  \ our boldmessage!)\n    # that will be passed to the template engine.\n    category_list\
  \ = Category.objects.order_by('-likes')[:5]\n\n    context_dict = {}\n    context_dict['boldmessage']\
  \ = 'Crunchy, creamy, cookie, candy, cupcake!'\n    context_dict['categories'] =\
  \ category_list\n\n    # Render the response and send it back!\n    return render(request,\
  \ 'rango/index.html', context=context_dict)\n```\n\n这里，表达式 `Category.objects.order_by('-likes')[:5]`\
  \ 查询 `Category` 模型以获取前五个类别。可以看到，它使用 `order_by()` 方法按点赞数降序排序。`-likes` 中的 `-` 表示我们希望按降序排列（如果去掉\
  \ `-`，结果将按升序返回）。由于返回的是一个 `Category` 对象列表，我们使用了 Python 的列表运算符¹ 从列表中取出前五个对象（`[:5]`），以返回\
  \ `Category` 对象的子集。\n\n查询完成后，我们将列表的引用（存储为变量 `category_list`）传递给了字典 `context_dict`。然后，这个字典会作为\
  \ context 的一部分，在 `render()` 调用中传递给模板引擎。注意，在上面的代码中，我们仍然在 `context_dict` 中包含了 `boldmessage`\
  \ —— 现有模板仍然需要它！这意味着我们的 context 字典现在包含两个键/值对：`boldmessage`，代表我们的 `Crunchy, creamy,\
  \ cookie, candy, cupcake!` 消息；以及 `categories`，代表从数据库中提取的前五个类别。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_101_0.png)\n\
  \n### 警告\n\n要想实现这一点，你必须完成前一章中的练习，即需要将 `likes` 字段添加到 `Category` 模型。正如我们之前所说，我们假定你会随着本书的进度完成所有练习。\n\
  \n#### 修改索引模板\n\n视图更新后，我们可以完成第四步，更新位于项目 `templates` 目录中的模板 `rango/index.html`。修改\
  \ HTML 和 Django 模板代码，使其看起来像下面所示的示例。请注意，主要更改从第 15 行开始。\n\n```html\n<!DOCTYPE html>\n\
  \n{% load staticfiles %}\n\n<html>\n\n    <head>\n        <title>Rango</title>\n\
  \    </head>\n\n    <body>\n        <h1>Rango says...</h1>\n        <div>\n    \
  \        hey there partner! <br/>\n            <strong>{{ boldmessage }}</strong>\n\
  ```\n\n标签和括号在将完整响应发送回客户端之前，会由 Django 模板引擎解释。\n\n现在，保存模板文件，然后打开你的 Web 浏览器。刷新 http://127.0.0.1:8000/rango/\
  \ 上的 Rango 主页，你应该会在页面标题和粗体消息下方看到类别列表，如下图所示。干得好，这是你的第一个 *数据驱动网页！*\n\n![](img/75169a27287f7c945bf2cbf7dede5251_103_0.png)\n\
  \nRango 主页——现在是动态生成的——显示类别列表。\n\n## 6.3 创建详情页面\n\n根据 Rango 的规格说明，我们还需要显示与每个类别相关联的页面列表。要实现这一点，我们需要克服几个不同的挑战。首先，必须创建一个新的视图。*这个新视图必须参数化。*\
  \ 我们还需要创建对类别名称进行编码的 URL 模式和 URL 字符串。\n\n\n\n\n\n## URL 设计与映射\n\n让我们先从 URL 问题开始考虑。处理这个问题的一种方法是在\
  \ URL 中使用每个类别的唯一 ID。例如，我们可以创建像 `/rango/category/1/` 或 `/rango/category/2/` 这样的 URL，其中数字分别对应唯一\
  \ ID 为 1 和 2 的类别。然而，仅从 ID 无法推断出该类别是关于什么的。\n\n相反，我们可以将类别名称作为 URL 的一部分。例如，我们可以想象 URL\
  \ `/rango/category/python/` 会引导我们到与 Python 相关的页面列表。这是一个简单、可读且有意义的 URL。如果采用这种方法，我们还需要处理包含多个单词的类别，比如\
  \ `Other Frameworks`。**在 URL 中使用空格通常被认为是不好的做法**（如下所述）。空格需要进行 *百分号编码*²。例如，`Other\
  \ Frameworks` 的百分号编码字符串将是 `Other%20Frameworks`。这看起来杂乱且令人困惑！\n\n![](img/75169a27287f7c945bf2cbf7dede5251_104_0.png)\n\
  \n### 清理你的 URL\n\n设计干净且可读的 URL 是网页设计的一个重要方面。更多详情请参阅[维基百科关于 Clean URLs 的文章](https://en.wikipedia.org/wiki/Clean_URL)³。\n\
  \n为了解决这个问题，我们将使用 Django 提供的所谓 `slugify()` 函数。\n\n### 使用 Slug 字段更新类别表\n\n为了创建可读的\
  \ URL，我们需要在 `Category` 模型中添加一个 [slug](https://prettylinks.com/2018/03/url-slugs/)⁴\
  \ 字段。首先，我们需要从 Django 导入 `slugify` 函数，该函数会将空白字符替换为连字符，从而避开百分号编码问题。例如，“how do i create\
  \ a slug in django” 会变成 “how-do-i-create-a-slug-in-django”。\n\n### 不安全的 URL\n\n\
  虽然你可以在 URL 中使用空格，但使用它们被认为是不安全的。请查阅互联网工程任务组关于 URL 的备忘录⁵以了解更多信息。\n\n接下来，我们需要重写 `Category`\
  \ 模型的 `save()` 方法。这个重写的函数将调用 `slugify()` 函数并用其结果更新新的 slug 字段。请注意，每次类别名称改变时，slug\
  \ 也会随之改变——在创建或更新 Django 模型实例时，`save()` 方法总会被调用。如下所示更新你的 `Category` 模型。\n\n```python\n\
  class Category(models.Model):\n    name = models.CharField(max_length=128, unique=True)\n\
  \    views = models.IntegerField(default=0)\n    likes = models.IntegerField(default=0)\n\
  \    slug = models.SlugField()\n\n    def save(self, *args, **kwargs):\n       \
  \ self.slug = slugify(self.name)\n        super(Category, self).save(*args, **kwargs)\n\
  \n    class Meta:\n        verbose_name_plural = 'categories'\n\n    def __str__(self):\n\
  \        return self.name\n```\n\n另外，不要忘记在模块顶部添加以下导入语句。\n\n```python\nfrom django.template.defaultfilters\
  \ import slugify\n```\n\n重写的 `save()` 方法相对容易理解。当被调用时，slug 字段通过将 `slugify()` 函数的输出作为新字段值来设置。一旦设置完成，重写的\
  \ `save()` 方法就会调用在基础 `django.db.models.Model` 类中定义的父类（或超类）`save()` 方法。正是这个调用执行了必要的逻辑，获取你的更改并将这些更改保存到正确的数据库表中。\n\
  \n既然模型已经更新，这些更改现在必须传播到数据库。然而，由于前面章节中数据库里已存在数据，我们需要考虑这一更改的影响。本质上，对于所有现有的类别名称，我们想把它们转换成\
  \ slug（这会在记录最初保存时执行）。当我们通过迁移工具更新模型时，它会添加 slug 字段，并提供以默认值填充该字段的选项。当然，我们希望每个条目都有一个特定的值——因此我们需要先执行迁移，然后重新运行填充脚本。这是因为填充脚本会显式调用每个条目的\
  \ `save()` 方法，触发上面实现的 `save()`，从而相应地为每个条目更新 slug。\n\n要执行迁移，请运行以下命令（详见 [模型与数据库工作流](#)）。\n\
  \n```bash\n$ python manage.py makemigrations rango\n```\n\n由于我们没有为 slug 提供默认值，并且模型中已有既有数据，`makemigrations`\
  \ 命令会给你两个选项。选择提供默认值的选项（选项 1），然后输入一个空字符串——用两个引号表示（即 `''`）。\n\n随后你会看到确认迁移已创建的输出。\n\
  \n```text\nYou are trying to add a non-nullable field 'slug' to category without\
  \ a default;\n    we can't do that (the database needs something to populate existing\
  \ rows).\nPlease select a fix:\n1) Provide a one-off default now (will be set on\
  \ all existing rows with a null\n       value for this column)\n2) Quit, and let\
  \ me add a default in models.py\nSelect an option: 1\nPlease enter the default value\
  \ now, as valid Python\nThe datetime and django.utils.timezone modules are available,\
  \ so you can do\n    e.g. timezone.now\nType 'exit' to exit this prompt\n>>> ''\n\
  Migrations for 'rango':\n    rango/migrations/0003_category_slug.py\n    - Add field\
  \ slug to category\n```\n\n从那里，你可以迁移更改，并重新运行填充脚本以更新新的 slug 字段。\n\n```bash\n$ python\
  \ manage.py migrate\n$ python populate_rango.py\n```\n\n现在运行命令 `$ python manage.py\
  \ runserver` 启动开发服务器，并通过管理界面检查模型中的数据。请记住，通过将浏览器指向 `http://127.0.0.1:8000/admin/`\
  \ 即可访问管理界面。\n\n如果你通过管理界面添加新类别，你可能会遇到一个问题——或者两个！\n\n- 1. 假设我们添加了类别 `Python User Groups`。如果你尝试保存记录，除非你也填写\
  \ slug 字段，否则 Django 不会允许你保存。虽然我们可以输入 `python-user-groups`，但依赖用户填写字段总是容易出错，而且无法提供良好的用户体验。最好让\
  \ slug 自动生成。\n\n- 2. 下一个问题出现在当我们有一个名为 `Django` 的类别和一个名为 `django` 的类别时。由于 `slugify()`\
  \ 会将 slug 转换为小写，因此无法识别哪个类别对应 `django` 这个 slug。\n\n要解决第一个问题，有两种可能的方案。最简单的方案是更新我们的模型，使\
  \ slug 字段允许空白条目，即：\n\n```python\nslug = models.SlugField(blank=True)\n```\n\n然而，这并非理想之选。空白的\
  \ slug 可能毫无意义，而且那样的话，你可以定义多个空白的 slug！那我们如何识别用户指的是哪个类别呢？**一个更好的解决方案**是自定义管理界面，使它在您输入类别名称时自动预填\
  \ slug 字段。要做到这一点，请用以下代码更新 `rango/admin.py`。\n\n```python\ndef show_category(request,\
  \ category_name_slug):\n    # Create a context dictionary which we can pass\n  \
  \  # to the template rendering engine.\n    context_dict = {}\n\n    try:\n    \
  \    # Can we find a category name slug with the given name?\n        # If we can't,\
  \ the .get() method raises a DoesNotExist exception.\n        # The .get() method\
  \ returns one model instance or raises an exception.\n        category = Category.objects.get(slug=category_name_slug)\n\
  \n        # Retrieve all of the associated pages.\n        # The filter() will return\
  \ a list of page objects or an empty list.\n        pages = Page.objects.filter(category=category)\n\
  \n        # Adds our results list to the template context under name pages.\n  \
  \      context_dict['pages'] = pages\n        # We also add the category object\
  \ from\n        # the database to the context dictionary.\n        # We'll use this\
  \ in the template to verify that the category exists.\n        context_dict['category']\
  \ = category\n    except Category.DoesNotExist:\n        # We get here if we didn't\
  \ find the specified category.\n        # Don't do anything -\n        # the template\
  \ will display the \"no category\" message for us.\n        context_dict['category']\
  \ = None\n        context_dict['pages'] = None\n\n    # Go render the response and\
  \ return it to the client.\n    return render(request, 'rango/category.html', context=context_dict)\n\
  ```\n\n我们的新视图遵循与 `index()` 视图相同的基本步骤。我们首先定义一个上下文字典。然后，我们尝试从模型中提取数据，并将相关数据添加到上下文字典中。我们通过传递给\
  \ `show_category()` 视图函数的 `category_name_slug` 值（除了 `request` 参数之外）来确定请求了哪个类别。\n\
  \n如果在 `Category` 模型中找到了该类别 slug，我们就可以提取关联的页面，并将其添加到上下文字典 `context_dict` 中。如果请求的类别未找到，我们将相关的上下文字典值设为\
  \ `None`。最后，我们使用一个新的 `category.html` 模板将所有内容一起 `render()` 出来。\n\n\n\n\n\n## 类别模板\n\
  \n在你的 `<workspace>/tango_with_django_project/templates/rango/` 目录中，创建一个名为 `category.html`\
  \ 的新模板。在新文件中，添加以下代码。\n\n```\n<!DOCTYPE html>\n\n<html>\n\n    <head>\n        <title>Rango</title>\n\
  \    </head>\n\n    <body>\n        <div>\n            {% if category %}\n     \
  \           <h1>{{ category.name }}</h1>\n                {% if pages %}\n     \
  \               <ul>\n                        {% for page in pages %}\n        \
  \                    <li><a href=\"{{ page.url }}\">{{ page.title }}</a></li>\n\
  \                        {% endfor %}\n                    </ul>\n             \
  \       {% else %}\n                        <strong>No pages currently in category.</strong>\n\
  \                    {% endif %}\n            {% else %}\n                The specified\
  \ category does not exist.\n            {% endif %}\n        </div>\n    </body>\n\
  \n</html>\n```\n\n上面的 HTML 代码示例再次演示了如何通过标签 `{{ }}` 访问经上下文传递给模板的数据。我们访问 `category`\
  \ 和 `pages` 对象及其字段——例如 `category.name` 和 `page.url`。\n\n如果该类别存在，那么我们检查该类别中是否有任何页面。如果有，我们使用\
  \ `{% for page in pages %}` 模板标签遍历返回的页面。对于 `pages` 列表中的每个页面，我们将它们的 `title` 和 `url`\
  \ 属性作为超链接呈现（例如，放在 `<li>` 和 `<a>` 元素中）。这些内容显示在一个无序 HTML 列表（由 `<ul>` 标签表示）中。如果你对 HTML\
  \ 不太熟悉，可以查看 [W3Schools.com 的 HTML 教程](http://www.w3schools.com/html/)⁶ 以了解更多关于不同标签的信息。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_112_0.png)\n\n## 关于条件模板标签的说明\n\nDjango\
  \ 模板条件标签——用 `{% if condition %}` 表示——是判断模板上下文中对象是否存在的一种非常简洁的方法。请务必检查对象是否存在，以避免渲染模板时出错，尤其是当你的关联视图逻辑并非在所有可能场景下都会填充上下文字典时。\n\
  \n在模板中放置条件检查——比如上面示例中的 `{% if category %}`——在语义上也很合理。条件检查的结果直接影响渲染后页面如何呈现给用户。请记住，Django\
  \ 应用的表现层方面应该封装在模板中。\n\n## 参数化 URL 映射\n\n现在，让我们看看如何将 `category_name_slug` 参数的值传递给我们的\
  \ `show_category()` 函数。为此，我们需要修改 Rango 的 `urls.py` 文件（请记住，该文件位于 `<workspace>/tango_with_django_project/rango/`），并按如下方式更新\
  \ `urlpatterns` 元组。\n\n```python\nurlpatterns = [\n    path('', views.index, name='index'),\n\
  \    path('about/', views.about, name='about'),\n    path('category/<slug:category_name_slug>/',\n\
  \         views.show_category, name='show_category'),\n]\n```\n\n一个由 `<slug:category_name_slug>`\
  \ 表示的参数被添加到了新的映射中。这向 Django 表明，我们想要匹配一个作为 slug 的字符串，并将其赋值给变量 `category_name_slug`。你会注意到，这个变量名正是我们传递给视图\
  \ `show_category()` 的。如果这两个名字不完全匹配，Django 就会混淆并引发错误。除了 slug，你还可以提取字符串和整数等其他变量。更多细节请参阅\
  \ [Django 文档中有关 URL 路径的部分](https://docs.djangoproject.com/en/2.1/ref/urls/)。如果你需要解析更复杂的表达式，可以使用\
  \ `re_path()` 而不是 `path()`。这将允许你匹配各种正则（及非正则）表达式。幸运的是，Django 为最常见的模式提供了匹配。\n\n作为\
  \ Django 应用的一部分定义的所有视图函数*必须*至少接受一个参数。该参数通常被称为 `request`——它提供对用户发出的给定 HTTP 请求相关信息的访问。在对\
  \ URL 进行参数化时，你需要为给定视图的函数签名提供额外的命名参数。这就是为什么 `show_category()` 被定义为 `def show_category(request,\
  \ category_name_slug)`。\n\n> #### 正则表达式地狱\n>\n> > “有些人在遇到问题时，会想：*‘我知道了，我会用正则表达式。’*\

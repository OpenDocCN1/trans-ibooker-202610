  >\n> Django 的 `path()` 方法通常能让你避免正则表达式地狱——但如果你确实需要使用正则表达式（例如使用 `re_path()` 函数），这份[速查表](http://cheatography.com/davechild/cheat-sheets/regular-expressions/)会非常有用。\n\

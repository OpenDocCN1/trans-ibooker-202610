  \ 模板，让它通过 slug 包含指向类别页面的链接。\n\n找到模板代码 `{% for category in categories %}`，并将 `<li>`\
  \ 元素调整为与下面的示例一致。\n\nDjango 页面的链接。注意鼠标正悬停在第一个链接上——你可以在 Google Chrome 窗口的左下角看到该链接对应的\
  \ URL。\n\n## 练习\n\n巩固你在本章学到的知识！\n\n- 更新填充脚本，为每个**页面**的 `views` 计数添加一些值。你可以选择任何整数——只要每个页面获得一个大于零的整数即可。\n\

  \ 函数，使其接收 views 和 likes 的值。\n  - 你需要在 `add_cat()` 的定义中添加两个参数，以便将 views 和 likes 的值以及类别名称传递给函数。为它们设置默认值\
  \ 0（即 `views=0`）。\n  - 然后，你可以使用这些参数，在 `add_cat()` 函数中创建的新 `Category` 模型实例里设置 views\
  \ 和 likes 字段。该模型实例在填充脚本中被赋值给变量 `c`，正如本章前面所定义的那样。例如，你可以使用 `c.likes` 表示法访问 likes 字段。别忘了对实例调用\
  \ `save()`！\n  - 然后，你需要更新填充脚本中 `populate()` 函数里的 `cats` 字典。查看该字典，每个键/值对都表示：类别 *名称*\
  \ 作为键，以及一个包含与该类别相关附加信息的附加字典作为 *值*。你需要修改这第二个嵌套字典，使其包含每个类别的 views 和 likes。\n  - 最后一步涉及修改你调用\
  \ `add_cat()` 函数的方式。现在你需要传递三个参数（name、views 和 likes）；而你的代码目前只提供了 name。你需要在函数调用中添加另外两个参数。如果你不确定\
  \ `for` 循环如何遍历字典，请查看[这个在线 Python 教程](https://www.tutorialspoint.com/python/python_dictionary.htm)。从那里，你可以弄清楚如何从字典中访问\

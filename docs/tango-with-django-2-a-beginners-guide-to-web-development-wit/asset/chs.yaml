- "## 15. Rango Tango 提示\n\n希望你能仅凭我们提供的工作流程完成前一章的练习。如果没有，或者你需要一点正确的方向指引，本章就是为你准备的。我们为每个练习提供了模型解决方案，如果你需要帮助，可以将它们整合到你自己的\
  \ Rango 版本中。\n\n> **有更好的解决方案吗？**\n>\n> 本章提供的解决方案只是解决每个问题的一种方式。你可以用许多不同的方法来处理每个问题，也可以使用仅包含目前已学技巧的解决方案。然而，如果你成功采用了不同的实现方式，请随时与我们分享你的解决方案——并在推特上分享链接给\
  \ [@tangowithdjango](https://www.twitter.com/tangowithdjango)¹，供其他人参考！\n\n### 15.1\
  \ 跟踪页面点击量\n\n正如我们之前介绍这个问题时所说，Rango 仅提供指向每个分类中保存的外部页面的直接链接。这种方法限制了我们跟踪（或简单计数）特定链接被点击次数的能力。为了能够跟踪点击量，我们需要完成以下步骤。我们在此提供的小节对应该工作流程中先前概述的四个主要步骤。\n\
  \n### 创建 URL 跟踪视图\n\n首先，在 Rango 的 `views.py` 模块中创建一个名为 `goto_url()` 的新视图。该视图接受带参数的\
  \ HTTP GET 请求（即 `rango/goto/?page_id=1`），更新页面的浏览计数。然后该视图应重定向到实际的 URL。\n\n```python\n\
  pages = Page.objects.filter(category=category).order_by('-views')\n```\n\n完成所有这些操作后，通过点击分类然后点击页面来确认一切正常。返回分类页面并刷新页面，查看点击次数是否增加。记得刷新浏览器；更新后的计数可能不会立即显示！\n\
  \n### 15.2 在分类页面内搜索\n\nRango 的主要目标是为应用程序用户提供有用的页面链接目录。目前，搜索功能基本上与分类无关。更好的做法是将搜索功能集成到实际的分类页面中。\n\
  \n让我们假设用户首先会导航并浏览他们感兴趣的分类。如果他们找不到想要的页面，他们就能进行搜索。当他们查看搜索结果并找到所需页面后，就能够将该页面添加到他们正在浏览的分类中。\n\
  \n我们将在这里处理描述的第一部分——将搜索功能添加到分类页面。要实现这一点，我们首先需要移除前一章中添加到[搜索功能](#)的代码。这基本上意味着停用当前的搜索页面及相关基础设施（包括视图和\
  \ URL 映射）。之后，我们还需要完成几项任务。这里列出的小节同样对应前一章中概述的五个主要步骤。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_257_0.png)\n\
  \n### 不要删除代码！\n\n在停用现有搜索功能时，不要删除它。只需在适当位置注释掉相关内容（例如在 `urls.py` 模块中）。稍后你会将某些代码复制到新的位置。\n\
  \n### 停用通用搜索\n\n此练习的第一步是停用你在前一章中实现的现有搜索功能。\n\n1. 首先，打开 Rango 的 `base.html` 模板，找到导航栏标记（位于页面顶部）。找到你之前添加的用于\
  \ `Search` 链接的 `<li>` 元素并删除它。之所以需要删除，是因为你即将注释掉 URL 映射，这意味着对 `rango:search` 的反向 URL\
  \ 查找将不再有效。用 HTML 注释标签（`<!-- ... -->`）包裹它也不行，因为 Django 模板引擎仍会处理其中的内容！\n2. 其次，打开 Rango\
  \ 的 `urls.py` 模块，找到 `/rango/search/` 的 URL 映射。在行首添加一个 `#` 将该行注释掉。这将阻止用户访问 `search`\
  \ URL。\n3. 最后，打开 Rango 的 `views.py` 模块，找到你之前实现的 `search()` 视图。同样地，通过在该函数的每一行前面加上\
  \ `#` 将其注释掉。\n\nRango 的模板目录中仍会保留 `search.html` 模板；不要删除它，因为我们将使用该模板的内容作为在分类模板中集成搜索功能的基础。\n\
  \n### 将 search.html 迁移到 category.html\n\n由于我们希望为浏览分类的用户提供搜索功能，因此需要将搜索展示功能（例如显示搜索表单和结果区域）添加到\
  \ `category.html` 模板中。这基本上就是一个简单的复制粘贴工作！\n\n让我们将其分为两个主要步骤。首先，打开你已停用的 `search.html`\
  \ 模板，找到包含整个搜索表单的 `<div>` 元素。这是一个子元素为 `<form>` 元素的 `<div>`。选择并复制该 `<div>` 及其内容，然后打开\
  \ Rango 的 `category.html` 文件。\n\n现在我们需要将 `search.html` 中的代码粘贴到 `category.html` 中。由于此问题的要求是将搜索功能添加到分类页面页面列表的*下方*，请找到\
  \ `{% block body_block %}` 内用于添加页面的链接。将 `search.html` 中的内容粘贴到该链接下方。\n\n然后你可以回到 `search.html`，重复此过程，这次选择用于显示结果列表的\
  \ `<div>`。你可以通过查找包含遍历 `result_list` 列表的 Django 模板代码的 `<div>` 来识别它。复制该内容，然后返回到 `category.html`。将其粘贴到之前粘贴的包含表单的\
  \ `<div>` 下方。\n\n### 更新 category.html 搜索表单\n\n现在所需的标记已添加到 `category.html` 中，我们需要做一个简单的更改。不再将搜索表单的内容提交到\
  \ `/rango/search/` URL，而是将提交的响应直接指向分类 URL（`/rango/category/<slug:category_name_slug>`）。只需在\
  \ `category.html` 中找到 `<form>` 定义，并将 `action` 属性改为 Rango 的 `show_category()` URL\
  \ 映射即可。\n\n```html\n<form class=\"form-inline\"\n      id=\"user-form\"\n      method=\"\
  post\"\n      action=\"{% url 'rango:show_category' category.slug %}\">\n```\n\n\
  ### 更新 show_category() 视图\n\n你应该已经注意到，由于我们现在将搜索请求重定向到 `show_category()` 视图，我们需要对该视图进行一些修改，使其能够处理搜索请求的处理，同时也能处理为给定分类生成页面列表的功能。\n\
  \n这又是一个相对直接的过程，我们根据已停用的 `search()` 视图中的代码来更新该视图。我们在下面提供了 `show_category()` 视图模型的完整代码清单。请注意标注我们取自现有\
  \ `search()` 视图的代码起始位置的注释。\n\n\n\n\n```python\ndef show_category(request, category_name_slug):\n\
  \    context_dict = {}\n\n    try:\n        category = Category.objects.get(slug=category_name_slug)\n\
  \        pages = Page.objects.filter(category=category).order_by('-views')\n\n \
  \       context_dict['pages'] = pages\n        context_dict['category'] = category\n\
  \    except Category.DoesNotExist:\n        context_dict['category'] = None\n  \
  \      context_dict['pages'] = None\n\n    # Start new search functionality code.\n\
  \    if request.method == 'POST':\n        query = request.POST['query'].strip()\n\
  \n        if query:\n            context_dict['result_list'] = run_query(query)\n\
  \    # End new search functionality code.\n\n    return render(request, 'rango/category.html',\
  \ context_dict)\n```\n\n我们保持顶部的 `show_category()` 视图不变，并在末尾添加一段额外的代码来处理搜索请求。如果发出\
  \ POST 请求，我们尝试从请求中获取查询，并将其提交给我们之前在 [Bing 搜索章节](#) 中定义的 `run_query()` 函数。然后该函数返回一个结果列表，我们将其放入\
  \ `context_dict` 中，键为 `result_list`——这正是更新后的 `category.html` 模板中所期望的变量名。\n\n搜索功能应该就能如预期般工作了。试一试！导航到一个分类页面，你应该会看到一个搜索框。输入搜索查询，提交，看看会发生什么。\n\
  \n一旦你感到满意，就可以安全地从代码库中删除现有的 `search.html` 模板，以及已停用的 `search()` 视图。\n\n## 限制对搜索功能的访问\n\
  \n我们的最终要求是仅将迁移过来的搜索功能限制为已登录 Rango 的用户。这一步很简单——只需将添加到 `category.html` 中的搜索处理模板代码用条件模板检查包裹起来，以确定用户是否已通过身份验证。\n\
  \n```django\n{% if user.is_authenticated %}\n<div>\n    ....\n</div>\n{% endif %}\n\
  ```\n\n太简单了！你还可以更进一步，在 `show_category()` 视图中添加检查，以确保当前用户未登录时不执行搜索功能部分。不过要注意——不要倾向于给该视图添加\
  \ `login_required()` 装饰器。这样做会将所有分类浏览功能限制为仅登录用户可用——而你只想限制*搜索*功能！\n\n## 搜索框练习\n\n\
  在 Bing 搜索 API 章节的末尾，我们设置了一个练习。我们注意到，在当前状态下，用户发出查询后会看到结果。但是，查询框随后又会清空——这使得*重新构造查询*更加费力。\n\
  \n在我们上面的代码示例中，我们故意没有给出这个特定练习的模型解决方案。你能如何让结果页面‘*记住*’输入的查询，并将其放回搜索框中呢？\n\n解决这个问题最简单的方法是将查询变量放入\

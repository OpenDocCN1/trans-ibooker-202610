- '# Django 2 探戈：Django 2 Web 开发初学者指南 (v.2020-01a)

  '
- "## 在 Twitter 上分享本书！\n\n请通过在 [Twitter](https://twitter.com) 上宣传这本书来帮助 Leif Azzopardi\
  \ 和 David Maxwell。\n\n本书的建议推文是：\n\n我也准备好 @tangowithdjango 了！看看 https://www.tangowithdjango.com\n\
  \n本书的建议话题标签是 #tangowithdjango。\n\n点击此链接在 Twitter 上搜索该话题标签，看看其他人对这本书的评价：\n\n#tangowithdjango\n\
  \n## 作者的其他著作\n\n[Leif Azzopardi](#) 的著作\n\n- [如何与 Django 1.9/1.10/1.11 共舞](#)\n\n\
  [David Maxwell](#) 的著作\n\n- [如何与 Django 1.9/1.10/1.11 共舞](#)\n\n## 1.4 Rango：初始设计与规格说明\n\
  \n本书的重点是开发一个名为 *Rango* 的应用程序。在开发这个应用程序的过程中，我们将涵盖构建任何 Web 应用程序时需要开发的核心组件。要查看该应用程序的完整功能版本，你可以访问我们的[如何与\
  \ Django 共舞网站](http://www.tangowithdjango.com/)¹⁹。\n\n### 设计简报\n\n让我们设想一下，我们希望创建一个名为\
  \ *Rango* 的网站，让用户通过浏览用户自定义的分类来访问各种网页。在[西班牙语中，rango 一词](https://www.vocabulary.com/dictionary/es/rango)²⁰\
  \ 用来表示\"*按质量排名的联盟*\"或\"*社会层级中的位置*\"——所以我们可以想象，在某个时候，我们会希望对 Rango 中的网页进行排名。\n\n-\
  \ 对于 Rango 网站的**主页**，你的客户希望访问者能够看到：\n  - *浏览次数最多的五个页面；*\n  - *浏览次数最多（或被 rango 化）的五个分类；*以及\n\
  \  - *某种让访问者浏览和/或搜索分类的方式。*\n- 当用户查看**分类页面**时，你的客户希望 Rango 能够显示：\n  - *分类名称、访问次数、点赞数*，以及该分类中关联页面的列表（显示页面标题，并链接到其\
  \ URL）；以及\n  - *一些搜索功能（通过搜索 API）*，用于查找可以链接到该分类的其他页面。\n- 对于**特定分类**，客户希望：*记录分类的名称；*\
  \ *每个分类页面被访问的次数；* 以及有多少用户*点击了\"点赞\"按钮*（即该页面被 rango 化，并在社会层级中被投票提升）。\n- *每个分类都应当能通过可读的\
  \ URL 访问*——例如，`/rango/books-about-django/`。\n- 只有*注册用户*才能搜索页面并将页面添加到分类中。因此，网站访问者应该能够注册账户。\n\
  \n乍一看，要开发的这个指定应用程序似乎相当简单。本质上，它只是一个链接到页面的分类列表。然而，还有一些复杂性和挑战需要解决。首先，让我们通过制定一些高层设计，试着更清楚地了解需要开发的内容。\n\
  \n### 练习\n\n在继续之前，请思考这些规格说明，并绘制出以下设计产物。\n\n- 高层架构将会是什么样的？绘制一个 **N 层**或**系统架构**图来表示高层系统组件。\n\
  - 界面将会是什么样子的？绘制主页和分类页面的一些**线框图**。\n- 用户访问的 URL 会是什么样子的？为应用程序写下一系列 **URL 映射**。\n\
  - 我们将需要存储或表示哪些数据？构建一个**实体-关系（ER）**²¹ 图来描述我们将要实现的数据模型。\n\n在继续之前试着完成这些练习——即使你不熟悉系统架构图、线框图或\
  \ ER 图，你如何正式地解释和描述你要构建的内容，以便其他人能够理解呢？\n\n### 线框图\n\n线框图是让客户了解应用程序外观及其将提供哪些功能的好方法。根据你手头可用的工具，线框图可以从手绘草图到精确的模拟图各不相同。对于我们的\
  \ Rango 应用程序，我们希望网站的索引页面看起来像下面的截图。我们的分类页面也如下所示。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_16_0.png)\n\
  \n**索引页面，左侧有一个分类搜索栏，同时显示前五个页面和前五个分类。**\n\n![](img/75169a27287f7c945bf2cbf7dede5251_17_0.png)\n\
  \n### 页面与 URL 映射\n\n根据规格说明，我们已经确定了应用程序在不同时间点将向用户呈现的两个页面。要访问每个页面，我们需要描述 URL 映射。可以把\
  \ URL 映射理解为用户为了访问某个页面而需要在浏览器地址栏中输入的文字。Rango 的基本 URL 映射如下所示。\n\n- `/` 或 `/rango/`\
  \ 将指向主 `/` 索引页面。\n- `/rango/about/` 将指向关于页面。\n- `/rango/category/<category_name>/`\
  \ 将指向 `<category_name>` 对应的分类页面，其中分类可能是：\n  - `games`；\n  - `python-recipes`；或\n\
  \  - `code-and-compilers`。\n\n### 注意！\n\n养成记录你所作出的任何工作假设的习惯，就像我们在上面假设的一对多关系假设一样。你永远不知道它们什么时候会回过头来给你带来麻烦！通过将它们记录下来，你可以与开发团队沟通，并确保该假设是合理的，而且他们乐意在这样的假设下继续推进。\n\
  \n基于这个假设，我们可以生成一系列表格，更详细地描述每个实体。这些表格包含每个实体中字段的信息。我们使用 Django `ModelField` 类型来定义每个字段的类型（即\
  \ `IntegerField`、`CharField`、`URLField` 或 `ForeignKey`）。请注意，在 Django 中，*主键*是隐式的，Django\
  \ 会为每个 Model 添加一个 id，但我们将在后面的[模型与数据库章节]中更详细地讨论这一点。\n\n### 分类模型字段与数据类型\n\n| 字段 |\
  \ 数据类型 |\n| --- | --- |\n| name | `CharField` |\n| views | `IntegerField` |\n| likes\
  \ | `IntegerField` |\n\n### 页面模型字段与数据类型\n\n| 字段 | 数据类型 |\n| --- | --- |\n| category\
  \ | `ForeignKey` |\n| title | `CharField` |\n| url | `URLField` |\n| views | `IntegerField`\
  \ |\n\n我们还会为 User 建立一个模型，以便用户能够注册和登录。我们这里没有展示它，但将在后面讨论用户认证时介绍它。在后续章节中，我们将看到如何在 Django\
  \ 中实例化这些模型，以及如何使用内置的 ORM 与数据库交互。\n\n## 1.5 小结\n\n这些高层设计和规格说明将在构建我们的 Web 应用程序时作为有用的参考点。虽然我们将专注于使用特定的技术，但这些步骤对于大多数数据库驱动的网站来说是通用的。最好熟悉阅读和编写此类规格说明和设计，以便你能够与他人沟通你的设计和想法。在这里，我们将专注于使用\
  \ Django 和相关技术来实现这个规格说明。\n\n### 复制粘贴编码\n\n在阅读本教程的过程中，你很可能会想把书中的代码剪切并粘贴到你的代码编辑器中。**然而，最好还是手动输入代码。**我们知道这很麻烦，但它会帮助你记住流程，并让你熟悉那些你会反复使用的命令。\n\
  \n此外，剪切和粘贴 Python 代码是在自找麻烦。空白最终可能会被解释为空格、制表符或空格与制表符的混合。这将导致各种奇怪的错误，而且不一定是缩进错误。如果你确实剪切和粘贴代码，请务必警惕这一点。特别要注意制表符和空格的问题——将它们混用很可能会导致\
  \ TabError。\n\n大多数代码编辑器会显示\"隐藏字符\"，这些字符进而会显示空白是制表符还是空格。如果你的编辑器有这个选项，请将其打开。你很可能会因此避免很多困惑。\n"
- "# 2. 准备与 Django 共舞\n\n在我们开始编码之前，正确设置你的开发环境非常重要，这样你才能轻松地*与 Django 共舞*。你需要确保计算机上已安装所有必要的组件，并且它们已正确配置。本章概述了你需要了解、设置和使用的六个关键组件。它们是：\n\
  \n- [终端](https://en.wikipedia.org/wiki/Terminal_emulator)（在 macOS 或 UNIX/Linux 系统上），或[命令提示符](https://en.wikipedia.org/wiki/Cmd.exe)（在\
  \ Windows 上）；\n- *Python 3*，包括如何编写和运行 Python 脚本；\n- Python 包管理器 *pip*；\n- *虚拟环境*；\n\
  - 你的*集成开发环境（IDE）*，如果你选择使用的话；以及\n- 名为 *Git* 的*版本控制系统（VCS）*。\n\n我们还会简要讨论*单元测试*的优点，探讨能够在不同节点测试你的实现如何帮助你保持正轨。\n\
  \n如果你已经在计算机上安装了 Python 3 和 Django 2，并且熟悉上面列出的技术，你可以直接跳到[Django 基础章节](#)。如果你不熟悉所列的部分或全部技术，我们在下面提供了每一项的概述。这些内容与后面的[补充章节](#)相辅相成，该章节提供了一系列关于如何设置不同组件的指导，如果你需要这方面的帮助。\n\
  \n\n\n\n\n## 你的开发环境很重要！\n\n搭建开发环境可能是一个繁琐且令人沮丧的过程。这并非你每天都会做的事情。我们在本章（以及[补充章节](#)）中提供的指引，将帮助你让一切进入可工作的状态。你现在为确保一切正常运转所付出的努力，将确保后续开发不受阻碍，无需你回头再修补问题。\n\
  \n根据经验，我们也可以自信地说，在搭建环境时，最好记下你所采取的步骤。你很可能有一天会再次用到这套流程——也许你买了新电脑，或者被要求帮朋友搭建环境。*不要只考虑眼前，要放眼长远！*\n\
  \n## 2.1 Python 3\n\n要使用 Tango with Django，我们要求你的电脑上安装有 *Python 3* 编程语言。Python 3.5\
  \ 或更高版本应该可以与 Django 2.0、2.1 和 2.2 正常配合使用——尽管 Django 官方网站建议你安装最新版本的 Python。因此，我们建议你安装\
  \ *Python 3.7*。在撰写本文时，最新版本是 *Python 3.7.2*。如果你不确定如何安装 Python 并希望获得一些帮助，请查看[我们关于如何安装\
  \ Python 的快速指南](#)。\n\n#### 你使用的是 macOS、Linux 还是 UNIX？\n\n在 macOS、Linux 或 UNIX 系统上，你会发现电脑上已经安装了\
  \ Python——尽管是较旧的版本，通常是 2.x 版本。你的操作系统需要这个版本来执行下载和安装更新等基本任务。虽然你可以使用这个版本，但它与 Django\
  \ 2 不兼容，你需要安装一个较新版本的 Python，使其与旧安装*并排*运行。*如果系统中已存在 Python 2.x，请勿卸载或费尽心思去删除它*；否则你可能会弄坏操作系统！\n\
  \n#### Django 2.0、2.1 还是 2.2？\n\n在本书中，我们明确使用 Django 2.1.5 版本。不过，我们也已对 2.0.13、2.1.10\
  \ 和 2.2.3 版本提供了的说明进行了测试。因此，如果你愿意，也可以使用 2.2 版本！如果你确实使用了不同版本，请将 2.1.5 替换为你所使用的版本。\n\
  \n我们会定期检查所提供的说明与未来 Django 版本的兼容性。如果你发现后续版本存在任何问题，欢迎随时与我们联系。你可以[给我们发推文](https://twitter.com/tangowithdjango)、[在\
  \ GitHub 上提交 issue](https://github.com/leifos/tango_with_django_2/issues)，或给我们发送电子邮件——我们的地址可以在\
  \ [www.tangowithdjango.com](https://www.tangowithdjango.com) 网站上找到。\n\n但你必须确保使用的是*至少*\
  \ Python 3.5 版本。3.4 及以下版本与这些 Django 版本不兼容。\n\n#### Python 技能生疏了？\n\n如果你以前没有用过 Python——或者只是想复习一下技能——那么我们强烈建议你查看并学习以下一个或多个指南：\n\
  \n- [官方 Python 教程](https://docs.python.org/3/tutorial/)；\n- Allen B. Downey 所著的《[像计算机科学家一样思考\
  \ Python：Think Python](https://greenteapress.com/wp/think-python-2e/)》；或\n- Stavros\
  \ 所著的《[10 分钟学会 Python](https://www.stavros.io/tutorials/python/)》；\n- Jennifer Campbell\
  \ 和 Paul Gries 的《[学习编程](https://www.coursera.org/course/programming1)》。\n\n这些指南将帮助你熟悉\
  \ Python 的基础知识，从而可以开始使用 Django 进行开发。请注意，你不需要成为 Python 专家才能使用 Django——Python 使用起来非常直接，你可以边学边用，尤其是如果你已经至少精通另一种编程语言的话。\n\
  \n## 2.2 虚拟环境\n\n在成功安装 Python 3（以及相应的基础编程技能）之后，我们现在可以为将在本教程中创建的 Django 项目（名为 Rango）设置环境了。我们*强烈鼓励*你使用的一个超级有用的工具是虚拟环境。虽然并非严格必需，但它在你的电脑\
  \ Python 安装与用于开发 Rango 的环境之间提供了有用的隔离。\n\n虚拟环境允许多个 Python 包安装在独特的 *Python 环境*中和谐共存。为什么这很有用？假设你有一个项目\
  \ `projectA` 要在 Django 1.11 中运行，另一个项目 `projectB` 是为 Django 2.1 编写的。这就会产生问题，因为通常你一次只能安装所需软件的一个版本。通过为每个项目创建虚拟环境，你可以在每个独立环境中安装相应版本的\
  \ Django（以及任何其他所需的 Python 软件）。这确保了一个环境中安装的软件不会干扰另一个环境中安装的软件。\n\n你需要为你的 Rango 开发环境创建一个使用\
  \ Python 3 的虚拟环境。将该环境命名为 `rangoenv`。如果你不确定如何操作，请在继续之前查阅详细介绍[如何设置虚拟环境](#)的补充章节。如果你确实选择使用虚拟环境，请记得通过执行以下命令来激活它。\n\
  \n```shell\n$ workon rangoenv\n```\n\n此后，你在终端或命令提示符中的所有提示符前面都会出现虚拟环境的名称，以提醒你它处于开启状态。请看下面的示例，了解我们所说的情况。\n\
  \n```bash\n$ workon rangoenv\n(rangoenv) $ pip install django==2.1.5\n...\n(rangoenv)\
  \ $ deactivate\n$\n```\n\n上面示例的倒数第二行演示了如何在用完后关闭虚拟环境——请注意提示符前缺少 `(rangoenv)`。同样，有关如何设置和使用虚拟环境的更多信息，请[参阅本书附录中的系统设置章节](#)。\n\
  \n## 2.3 Python 包管理器\n\n与虚拟环境相辅相成，我们还将使用 Python 包管理器 *pip* 来为我们的开发环境安装几个不同的 Python\
  \ 软件包——包括 Django。具体来说，我们需要安装两个包：Django 2 和 *Pillow*。Pillow 是一个 Python 包，提供处理图像文件（例如\
  \ `.jpg` 和 `.png` 文件）的支持，我们将在本教程后面用到它。\n\n包管理器，无论是用于 Python、你的[操作系统](#)¹⁰ 还是[其他环境](#)¹¹，都是一种软件工具，可自动执行*软件包*的安装、升级、配置和移除过程——即你可以用于电脑上提供某些功能的软件包。这与手动下载、安装和维护软件形成对比。\n\
  \n维护 Python 包相当痛苦。大多数包通常都有*依赖项*——即你的包运行所需的附加包！这很快就会变得非常复杂。包管理器会为你处理所有这些，以及诸如不同版本包之间冲突等问题。幸运的是，*pip*\
  \ 会为你处理所有这一切。\n\n尝试运行命令 `$ pip` 来执行包管理器。请确保在虚拟环境激活状态下执行。全局环境下，你可能需要使用 `pip3` 命令。如果这些都不起作用，说明你的环境设置有误——请参阅我们的\
  \ [pip 设置指南](#) 寻求帮助。\n\n在虚拟环境开启的情况下，执行以下两条命令来安装 Django 和 Pillow。\n\n```bash\n$\
  \ pip install django==2.1.5\n$ pip install pillow==5.4.1\n```\n\n安装这两个包就足以让你开始了。在完成本教程的过程中，我们还需要另外几个包。我们会告诉你在需要时安装它们。现在，你可以开始行动了。\n\
  \n#### 安装 `pillow` 时遇到问题？\n\n在安装 Pillow 时，你可能会收到一个错误，指出由于缺少 JPEG 支持而导致安装失败。此错误显示如下：\n\
  \n```text\nValueError: jpeg is required unless explicitly disabled using\n     \
  \       --disable-jpeg, aborting\n```\n\n如果你收到此错误，请尝试在*不*启用 JPEG 支持的情况下安装 Pillow，使用以下命令。\n\
  \n```bash\npip install pillow==5.4.1 --global-option=\"build_ext\" --global-option=\"\
  --disable-jpeg\"\n```\n\n虽然你显然会缺少处理 JPEG 图像的支持，但 Pillow 应该可以顺利安装。安装完成 Pillow 就足以让你开始本教程了。有关更多信息，请查看\
  \ [Pillow 文档](https://pillow.readthedocs.io/en/stable/installation.html)¹²。\n\n\
  #### 在虚拟环境中工作\n\n在虚拟环境中工作时，请将 pip3 替换为 pip。pip 命令已为你该虚拟环境正确设置了别名。\n\n¹⁰ https://en.wikipedia.org/wiki/Advanced_Packaging_Tool\
  \  \n¹¹ https://docs.npmjs.com/cli/install\n\n\n\n\n\n### 练习\n\n为了熟悉你的环境，请尝试完成以下练习。\n\
  \n- 如果你刚接触 Python，请先熟悉这门语言。尝试我们之前列出的一个或多个教程。\n- 安装 Python 3.7。确保 `pip3`（或虚拟环境中的\
  \ `pip`）也已安装并能在你的计算机上正常工作。\n- 熟悉你的*命令行界面（CLI）*，无论是命令提示符（Windows）还是终端（macOS、Linux、UNIX\
  \ 等）。\n- 使用 Python 3.7 创建一个新的虚拟环境。这一步是可选的，但我们*强烈建议你使用虚拟环境*。\n- 在你的环境中，安装 Django\
  \ 2 和 Pillow 5.4.1。\n- 如果你还没有账号，请在 [GitHub](https://github.com/) 或 [BitBucket](https://bitbucket.org/)\
  \ 等 Git 仓库网站上注册一个账号。\n- 下载并安装一个 IDE，如 [PyCharm](https://www.jetbrains.com/pycharm/)，或者配置你喜欢的文本编辑器来处理\
  \ Python 文件。\n\n如前所述，我们已经将应用程序的代码发布在 [GitHub 仓库](https://github.com/maxwelld90/tango_with_django_2_code)\
  \ 上。\n\n- 如果你在书中发现任何错误或问题，请通过[在 GitHub 上提 issue](https://github.com/leifos/tango_with_django_2/issues)\
  \ 告诉我们。\n- 如果你在练习中遇到任何问题，可以查看我们的仓库，看看我们是如何完成这些练习的。\n- 如果你在我们提供的单元测试和/或示例解答中发现任何错误或问题，也可以通过在该[相关仓库](https://github.com/maxwelld90/tango_with_django_2_code/issues)中提\
  \ issue 来告知我们。\n\n## 2.6 测试你的实现\n\n在你按照 Rango 应用的要求进行实现的过程中，我们希望你有信心知道自己*编写的代码*是否正确。我们无法亲自坐在你身边，因此我们做了次优选择——**我们实现了一系列不同的测试，你可以针对自己的代码库运行这些测试，看看哪些是正确的，哪些可以改进。**我们为核心章节（到第\
  \ 10 章）准备了测试。\n\n这些测试可以从我们的示例代码仓库中获取，[可在 GitHub 上找到](https://github.com/maxwelld90/tango_with_django_2_code/tree/master/progress_tests)。该仓库中的\
  \ `progress_tests` 目录包含多个不同的 Python 模块，每个模块都包含一系列不同的测试模块，你可以针对你的 Rango 实现运行这些测试。请注意，它们是针对各个章节的——例如，你应该*在*完成第\
  \ 3 章后、开始第 4 章前，针对你的实现运行 `tests_chapter3.py` 模块。请注意，并不是每章末尾都有测试——书中有些部分很难在不下载大型支持库的情况下编写自动化测试。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_30_0.png)\n\n### 完成所有练习！\n\n这些测试假设你完成了某一章的所有练习！如果你没有完成，很有可能一些测试无法通过。\n\
  \n我们会检查到你所测试的节点为止应该已经正常工作的基本功能。我们还会检查当访问特定 URL 时服务器返回的内容——如果响应与你书中要求的内容*完全*不匹配，*测试就会失败*。这看起来可能过于严苛，但我们希望在你的脑海中刻下一个观念：*你必须完全按照规定的要求来满足需求*——任何偏差都是不可接受的。这也能让你逐步树立*测试驱动开发*的意识，我们在[测试章节开始时](#)对此进行了概述。\n\
  \n### 运行单元测试\n\n那么，如何运行这些测试呢？下面的分步流程演示了基本操作过程。我们假设你想运行[第 3 章 Django 基础](#)的测试。\n\
  \n1. 首先，确定你要运行哪一章的测试。\n2. 在计算机上克隆我们的[示例代码仓库](https://github.com/maxwelld90/tango_with_django_2_code)，或者从\
  \ [GitHub 网页界面](https://github.com/maxwelld90/tango_with_django_2_code/tree/master/progress_tests)访问你想要的具体测试模块。\n\
  \   - 如果选择后者，请点击你需要的模块（例如 `tests_chapter3.py`）。在 GitHub 网站上看到代码后，点击 **Raw** 按钮并保存随后加载的页面。\n\
  3. 将 `tests_chapter3.py` 模块移动到你的项目的 `rango` 目录中。现在你可能觉得这一步没什么意义；随着你逐步阅读本书，之后回到这里复习操作时，就会明白它的意义。\n\
  4. 运行命令 `$ python manage.py test rango.tests_chapter3`。这将启动测试。\n\n你还需要确保在运行这些测试时，你的\
  \ `rangoenv` 虚拟环境处于激活状态。\n\n当所有测试完成后，你应该会看到 **OK**。这意味着全部测试都通过了！如果你没有看到 **OK**，说明有测试失败了——请查看测试输出，找出哪个测试失败以及失败原因。有时，你可能遗漏了某些内容，导致测试尚未执行就抛出了异常。在这种情况下，你需要查看预期结果，然后回头补充缺失的内容。你可以调整代码并重新运行测试，看看它们是否能够通过。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_31_0.png)\n\n### 测试你的实现\n\n当你阅读完书中足够多的内容，进入下一轮测试时，我们会用这样的方式提示你。我们会告诉你该运行哪个模块，并始终把你指引回这里，以便你忘记如何运行测试时可以重新温习。\n\
  \n### 完成后删除！\n\n当你完成某一章的测试后，我们**强烈建议**你删除移动到 `rango` 目录中的那个模块。在上面的例子中，我们会删除 `tests_chapter3.py`。一旦你确认自己的解决方案通过了我们提供的测试，就不再需要这个模块了。直接删除即可——不要用这些模块弄乱你的仓库！\n\
  \n### 测试更新\n\n随着时间的推移，如果出现 issue，或者我们认为有足够需求需要添加额外测试，我们会发布单元测试文件的更新。你应该关注仓库的任何变更——如果你已将仓库克隆到计算机上，只需执行\
  \ `git pull` 即可获取更新。\n"
- "# 3. Django 基础\n\n让我们开始 Django 吧！在本章中，我们将为你概述创建过程。你将建立一个新项目和一个新的 Web 应用程序。到本章结束时，你将拥有一个由\
  \ Django 驱动的简单网站！\n\n## 3.1 测试你的环境设置\n\n首先，让我们检查你的 Python 和 Django 安装是否适合本教程。为此，请打开一个新的终端/命令提示符窗口，并激活你的\
  \ `rangoenv` 虚拟环境。\n\n激活后，执行以下命令。输出将告诉你当前的 Python 版本。\n\n```\n$ python --version\n\
  ```\n\n响应应该类似于 3.7.2，但 Python 3.5+ 的任意版本都可以正常工作。如果你需要升级或安装 Python，请参阅[设置系统](#)章节。\n\
  \n如果你使用虚拟环境，请确保已激活它——如果你忘记了如何激活，请参阅我们关于[虚拟环境](#)的章节。\n\n验证完 Python 安装后，再检查你的 Django\
  \ 安装。在终端窗口中，通过执行以下命令运行 Python 解释器。\n\n```\n$ python\nPython 3.7.2 (default, Mar\
  \ 30 2019, 05:40:15)\n[Clang 9.0.0 (clang-900.0.39.2)] on darwin\nType \"help\"\
  , \"copyright\", \"credits\" or \"license\" for more information.\n>>>\n```\n\n\
  在提示符下，输入以下命令：\n\n```\n>>> import django\n>>> django.get_version()\n'2.1.5'\n>>>\
  \ exit()\n```\n\n一切顺利的话，你应该会看到正确版本的 Django，然后可以使用 `exit()` 退出 Python 解释器。如果 `import\
  \ django` 导入失败，请检查你是否处于虚拟环境中，并在终端窗口中使用 `pip list` 查看已安装的包。\n\n如果你在安装包时遇到问题，或者安装了不同版本，请参阅“系统设置”章节，或查阅\
  \ Django 官方文档中关于安装 Django 的内容¹。\n\n> ¹ https://docs.djangoproject.com/en/2.1/topics/install/\n\
  \n\n\n\n我们建议你在主目录中创建一个工作区目录。这样，`/Users/maxwelld90/Workspace/` 对于 Mac 上的用户 maxwelld90\
  \ 来说就是一个有效的目录。\n\n## 找不到 `django-admin.py`？\n\n请尝试输入 `django-admin`。根据你的设置，有些系统可能无法识别\
  \ `django-admin.py`。在 Windows 计算机上尤其如此——你可能必须使用 `django-admin.py` 脚本的完整路径，例如：\n\n\
  ```\npython c:\\Users\\maxwelld90\\.virtualenvs\\rangeonv\\bin\\django-admin.py\n\
  \        startproject tango_with_django_project\n```\n\n正如 [StackOverflow](http://stackoverflow.com/questions/8112630/cant-create-django-project-using-command-prompt)\
  \ 上所建议的那样。请注意，该路径在你自己的计算机上很可能会有所不同。\n\n此命令将调用 `django-admin.py` 脚本，为你创建一个名为 `tango_with_django_project`\
  \ 的新 Django 项目。命名约定要求我们通常会在 Django 项目目录末尾附加 `_project`，以便我们确切知道其中包含什么——但实际上，命名完全由你决定。\n\
  \n现在你会注意到，工作区内有一个目录，其名称与你的新项目 `tango_with_django_project` 相同。在这个新创建的目录中，你应该会看到两项内容：\n\
  \n- `tango_with_django_project`，另一个与你的主项目目录同名（哎呀！）的*嵌套目录*；以及\n- 一个名为 `manage.py`\
  \ 的 Python 脚本。\n\n在本教程中，我们将这个 `tango_with_django_project` 嵌套目录称为*项目配置目录*。在这个目录中，你会发现四个\
  \ Python 脚本。稍后我们会详细讨论这些脚本，但现在你应该可以看到：\n\n- `__init__.py`，一个空白的 Python 脚本，它的存在向 Python\
  \ 解释器表明该目录是一个 Python 包；\n- `settings.py`，用于存储 Django 项目所有设置的地方；\n- `urls.py`，一个用于存储项目\
  \ URL 模式的 Python 脚本；以及\n- `wsgi.py`，一个用于帮助运行开发服务器并将项目部署到生产环境的 Python 脚本。\n\n在项目目录中，你会看到一个名为\
  \ `manage.py` 的文件。在开发项目的过程中，我们会一次又一次地调用这个脚本。它为你提供了一系列可运行的命令，用于维护你的 Django 项目。例如，`manage.py`\
  \ 允许你运行内置的 Django 开发服务器、测试你的应用程序，以及运行各种数据库命令。几乎我们想要运行的每个 Django 命令，都会用到这个脚本。\n\n\
  ## Django Admin 与 Manage 脚本\n\n有关 Django admin 脚本的更多信息，请参阅 Django 文档，了解 [Admin 和\
  \ Manage 脚本](https://docs.djangoproject.com/en/2.1/ref/django-admin/#django-admin-py-and-manage-py)\
  \ 的更多细节。\n\n请注意，如果运行 `python manage.py help`，你可以看到可用命令的列表。\n\n你现在可以尝试使用 `manage.py`\
  \ 脚本，方法是执行下面的命令。\n\n```bash\n$ python manage.py runserver\n```\n\n执行此命令会启动 Python，并指示\
  \ Django 启用其轻量级开发服务器。你应该会在终端窗口中看到类似下面示例的输出：\n\n```text\n$ python manage.py runserver\n\
  \nPerforming system checks...\n\nSystem check identified no issues (0 silenced).\n\
  \nYou have 14 unapplied migration(s).\nYour project may not work properly until\
  \ you apply the migrations for app(s):\nadmin, auth, contenttypes, sessions.\n\n\
  Run 'python manage.py migrate' to apply them.\n\nJuly 23, 2019 - 17:12:34\nDjango\
  \ version 2.1.5, using settings 'tango_with_django_project.settings'\nStarting development\
  \ server at http://127.0.0.1:8000/\nQuit the server with CONTROL-C.\n```\n\n在输出中，你可以看到几件事。首先，没有任何问题阻止应用程序运行。然而，你会注意到一个警告——存在未应用的迁移。当我们设置数据库时会更详细地讨论这个问题，但现在我们可以忽略它。第三，也是最重要的一点，你会看到一个\
  \ URL 已被指定：http://127.0.0.1:8000/，这是 Django 开发服务器正在运行的地址。\n\n现在打开你的 Web 浏览器，将上述\
  \ URL 输入到浏览器的地址栏中——[http://127.0.0.1:8000/](http://127.0.0.1:8000/)。你应该会看到一个类似于[下图所示](http://127.0.0.1:8000/)的网页。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_38_0.png)\n\n**首次运行开发服务器时，你将看到的初始 Django\
  \ 页面截图。**\n\n你可以随时在终端或命令提示符窗口中按 CTRL + C 来停止开发服务器。这对 Mac 和 PC 都适用！如果你希望在不同端口上运行开发服务器，或者允许其他机器上的用户访问它，可以通过提供可选参数来实现。请看下面的命令。\n\
  \n```bash\n$ python manage.py runserver <your_machines_ip_address>:5555\n```\n\n\
  执行此命令将强制开发服务器在 TCP 端口 5555 上响应传入请求。你需要将 `<your_machines_ip_address>` 替换为你计算机的 IP\
  \ 地址或 127.0.0.1。\n\n## 不知道你的 IP 地址？\n\n如果你使用 0.0.0.0，Django 会自行识别你的 IP 地址。尽管试试：\n\
  \n```bash\npython manage.py runserver 0.0.0.0:5555\n```\n\n在设置端口时，你很可能无法使用 TCP 端口\
  \ 80 或 8080，因为这些端口传统上是为 HTTP 流量保留的。此外，任何低于 1024 的端口都会被你的操作系统视为[特权端口](http://www.w3.org/Daemon/User/Installation/PrivilegedPorts.html)。\n\
  \n虽然你不会使用轻量级开发服务器来部署应用程序，但能够在你网络中的另一台机器上演示你的应用程序还是不错的。使用你机器的 IP 地址运行服务器，其他人就可以输入\
  \ `http://<your_machines_ip_address>:<port>/` 来查看你的 Web 应用程序。**当然，这取决于你的网络配置方式。中间可能会有代理服务器或防火墙，需要先进行配置才能正常工作。如果你无法远程查看开发服务器，请向你所用网络的管理员咨询。**\n\
  \n## 3.3 创建一个 Django 应用\n\nDjango 项目是*配置*和*应用*的集合，它们共同构成一个给定的 Web 应用或网站。使用这种方法的目的之一是促进良好的软件工程实践。通过开发一系列小型应用，理论上，你可以将一个现有应用放入另一个不同的\
  \ Django 项目，并以最小的代价让其正常工作。\n\nDjango 应用的存在是为了执行特定任务。你需要创建专门的应用，负责为你的网站提供特定类型的功能。例如，我们可以想象一个项目可能由多个应用组成，包括一个投票应用、一个注册应用，以及一个与特定内容相关的应用。在另一个项目中，我们可能希望重用投票应用和注册应用，因此可以将它们包含在其他项目中。我们稍后会讨论这一点。现在，我们将创建\
  \ *Rango* 应用。\n\n要实现这一点，你需要确保你位于 Django 项目目录中（例如 `<workspace>/tango_with_django_project`）。然后在该目录下运行以下命令。\n\
  \n```bash\n$ python manage.py startapp rango\n```\n\n`startapp` 命令会在项目根目录中创建一个新目录。不出所料，这个目录名为\
  \ `rango`——其中包含几个 Python 脚本：\n\n- 另一个 `__init__.py`，其用途与之前讨论的相同；\n- `admin.py`，你可以在其中注册模型，从而受益于一些\
  \ Django 机制，这些机制会为你创建管理界面；\n- `apps.py`，为任何应用特定的配置提供位置；\n- `models.py`，用于存储应用的数据模型——你可以在其中指定数据实体及数据之间的关系；\n\
  - `tests.py`，用于存放一系列函数来测试你的实现；\n- `views.py`，用于存放一系列处理请求并返回响应的函数；以及\n- `migrations`\
  \ 目录，用于存储与你的模型相关的数据库特定信息。\n\n`views.py` 和 `models.py` 是你在任何给定应用中都会使用的两个文件，它们构成了\
  \ Django 采用的主要架构设计模式的一部分，即*模型-视图-模板*模式。你可以查阅[官方 Django 文档](https://docs.djangoproject.com/en/2.1/intro/overview/)来更详细地了解模型、视图和模板之间如何相互关联。\n\
  \n在开始创建模型和视图之前，你必须先让 Django 项目知道你新应用的存在。为此，你需要修改项目配置目录中的 `settings.py` 文件。打开该文件，找到\
  \ `INSTALLED_APPS` 列表。将 `rango` 应用添加到元组的末尾，之后它应该类似下面的示例。\n\n\n\n```python\nfrom\
  \ django.http import HttpResponse\n\ndef index(request):\n    return HttpResponse(\"\
  Rango says hey there partner!\")\n```\n\n逐行分析这三行代码，我们可以观察到创建这个简单视图的以下几点。\n\n- 我们首先从\
  \ `django.http` 模块中导入 `HttpResponse` 对象。\n- 每个视图都以一系列独立函数的形式存在于 `views.py` 文件中。在这个例子中，我们只创建了一个视图——名为\
  \ `index`。\n- 每个视图至少接受一个参数——一个 `HttpRequest` 对象，它也位于 `django.http` 模块中。按照惯例，这个参数命名为\
  \ `request`，但如果你愿意，也可以随意重命名。\n- 每个视图必须返回一个 `HttpResponse` 对象。一个简单的 `HttpResponse`\
  \ 对象接受一个字符串参数，该参数代表我们希望发送给请求该视图的客户端的页面内容。\n\n创建好视图后，只是让用户可以访问它的一部分工作。要让用户看到你的视图，你必须将一个统一资源定位符（URL）映射到该视图。\n\
  \n要创建初始映射，请打开位于项目配置目录中的 `urls.py`（即 `<workspace>/tango_with_django_project/tango_with_django_project`——注意是第二个\
  \ `tango_with_django_project` 目录！），并在文件顶部 `from django.urls import path` 下方添加以下导入语句。\n\
  \n```python\nfrom rango import views\n```\n\n接下来，将 urlpatterns 列表修改为如下示例所示。\n\n\
  ```python\nurlpatterns = [\n    path('', views.index, name='index'),\n    path('admin/',\
  \ admin.site.urls),\n]\n```\n\n这会将基本 URL 映射到 `rango` 应用中的 `index` 视图。运行开发服务器（例如\
  \ `python manage.py runserver`），然后访问 http://127.0.0.1:8000 或你的开发服务器所运行的任何地址，你就会看到\
  \ `index` 视图渲染后的输出。\n\n## 3.5 URL 映射\n\n与其将 URL 直接从项目映射到应用，我们可以通过改变将传入 URL 路由到视图的方式，使应用更加模块化（从而也更可复用）。要做到这一点，我们首先需要修改项目的\
  \ `urls.py`，让它指向应用来处理任何特定的 Rango 应用请求，然后我们需要指定 Rango 如何处理这些请求。\n\n首先，打开位于项目配置目录中的\
  \ `urls.py`。相对于工作区目录的路径是 `<workspace>/tango_with_django_project/tango_with_django_project/urls.py`。将模块更新为如下示例所示。\n\
  \n```python\nfrom django.contrib import admin\nfrom django.urls import path\nfrom\
  \ django.urls import include\nfrom rango import views\n\nurlpatterns = [\n    path('',\
  \ views.index, name='index'),\n    path('rango/', include('rango.urls')),\n    #\
  \ The above maps any URLs starting with rango/ to be handled by rango.\n    path('admin/',\
  \ admin.site.urls),\n]\n```\n\n你会看到 urlpatterns 是一个 Python 列表，这正是 Django 框架所期望的。新增的映射会查找与模式\
  \ `rango/` 匹配的 URL 字符串。一旦匹配，URL 字符串的其余部分就会通过 django.urls 包中的 include() 函数被传递给 rango.urls\
  \ 并由其处理。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_44_0.png)\n\n**协议与域名**\n\n\
  ![](img/75169a27287f7c945bf2cbf7dede5251_44_1.png)\n\n![](img/75169a27287f7c945bf2cbf7dede5251_44_2.png)\n\
  \n**一幅以链条形式展示 URL 的插图，显示了域名之后的不同 URL 部分分别由不同的 `urls.py` 文件负责处理。**\n\n可以把它想象成一条处理\
  \ URL 字符串的链——如 [URL 链图] 所示。在这条链中，域名被剥离，URL 字符串的剩余部分（`rango/`）被传递给 `tango_with_django`\
  \ 项目，在该项目中找到匹配项并剥离 `rango/`，留下一个空字符串传递给 rango 应用进行处理。\n\n因此，我们需要在 rango 应用目录中创建一个名为\
  \ `urls.py` 的新文件，来处理剩余的 URL 字符串（并将空字符串映射到 index 视图）：\n\n```python\nfrom django.urls\
  \ import path\nfrom rango import views\n\napp_name = 'rango'\n\nurlpatterns = [\n\
  \    path('', views.index, name='index'),\n]\n```\n\n这段代码从 `rango` 中导入了 URL 映射所需的\
  \ Django 机制以及 `views` 模块。这让我们能够调用 `url` 函数，并在 `urlpatterns` 中指向 index 视图进行映射。\n\n\
  当我们谈论 URL 字符串时，我们假设给定 URL 的主机部分*已经被剥离*。URL 的主机部分表示映射到 Web 服务器的主机地址或域名，例如 `http://127.0.0.1:8000`\
  \ 或 `http://www.tangowithdjango.com`。剥离主机部分意味着 Django 机制只需要处理 URL 字符串的其余部分。例如，给定\
  \ URL `http://127.0.0.1:8000/rango/about/`，Django 将处理 URL 字符串的 `/rango/about/` 部分。\n\
  \n我们上面创建的 URL 映射调用了 Django 的 `path()` 函数，其中第一个参数是要匹配的字符串。由于我们使用了空字符串 `''`，Django\
  \ 只在 `http://127.0.0.1:8000/` 之后没有任何内容时才会匹配。第二个参数告诉 Django 在模式 `''` 被匹配时调用哪个视图。在这种情况下，将调用\
  \ `views.index()`。第三个可选参数名为 `name`。它提供了一种便捷的方式来引用视图，并且通过命名 URL 映射，我们可以采用*反向 URL\
  \ 匹配*。也就是说，我们可以通过名称而不是 URL 来引用 URL 映射。[稍后，我们将解释并展示为什么这非常有用。](#) 随着应用变得越来越复杂，它可以为你节省时间和麻烦。这与我们同样放在新\
  \ `urls.py` 模块中的 `app_name` 变量密切相关。\n\n现在重启 Django 开发服务器并访问 `http://127.0.0.1:8000/rango/`。如果一切顺利，你应该会看到文本\
  \ “Rango says hey there partner!”。它看起来应该与下面的截图一样。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_46_0.png)\n\
  \n**一个网页浏览器显示我们第一个由 Django 驱动的网页的截图。你好，Rango！**\n\n在每个应用中，你都会创建几个 URL 映射。最初的映射非常简单，但随着本书内容的推进，我们将创建更复杂、带参数的\
  \ URL 映射。\n\n对 Django 中 URL 的处理方式有一个良好的理解也很重要。现在可能看起来有些令人困惑，但随着本书内容的阅读，我们会创建越来越多的\
  \ URL 映射，你很快就会成为专家。要了解更多信息，可以查阅 [Django 官方 URL 文档](https://docs.djangoproject.com/en/2.1/topics/http/urls/)，获取更多细节和示例。\n\
  \n如果你正在使用版本控制，现在是提交你工作区中所做更改的好时机。如果你不记得相关命令和步骤，请参阅提供 Git 速成课程的章节。\n\n## 练习\n\n现在，你已经让\
  \ Django 和新应用成功运行，请尝试以下练习来巩固所学内容。达到这个阶段是 Django 开发中的一个重要里程碑。创建视图并将 URL 映射到视图，是迈向开发更复杂、更实用的\
  \ Web 应用的第一步。\n\n- 复习这个过程，确保你理解了 URL 是如何映射到视图的。\n- 创建一个名为 `about` 的新视图方法，它返回以下 `HttpResponse`：`'Rango\
  \ says here is the about page.'`\n- 将此视图映射到 `/rango/about/`。在此步骤中，你只需要编辑 Rango 应用的\
  \ `urls.py`。请记住，`/rango/` 部分由项目的 `urls.py` 处理。这个新映射的名称为 `about`。\n- 修改 `index()`\
  \ 视图中的 `HttpResponse`，使其包含一个指向 about 页面的超链接（或 *锚点*）。**这是响应的一部分——意味着它也与 “Rango says\
  \ hey there partner!” 位于同一个字符串中。**\n- 在 about 视图的响应中包含一个返回 index 页面的链接。\n- 既然你已经开始阅读本书，如果你有\
  \ Twitter，可以关注我们——我们的账号是 [@tangowithdjango](https://twitter.com/tangowithdjango)。让我们知道你的进展如何！\n\
  \n\n\n\n\n## 提示\n\n如果你在完成练习时遇到困难，以下提示将为你提供一些灵感，帮助你推进。\n\n- 在你的 `views.py` 中，创建一个名为\
  \ `def about(request)` 的函数，并让该函数返回一个 `HttpResponse()`。在此 `HttpResponse()` 中，插入你想要返回的消息。\n\
  - 用于匹配第二个视图的表达式是 `'/about/'`。这意味着在 `rango/urls.py` 中，你需要添加一条新的路径映射到 `about()` 视图。\n\
  - 在 `index()` 视图中，你需要包含一个 HTML [超链接](https://en.wikipedia.org/wiki/Hyperlink) 来提供指向关于页面的链接。一个完整的\
  \ `<a>` 标签，带有 `href` 属性（`<a href='/rango/about/'>About</a>`）就足够了。\n- 同样的链接也会添加到\
  \ `about()` 视图中，不过这次它指向 `/rango/`，即首页——而不是 `/rango/about/`。一个示例看起来像：`<a href='/rango/'>Index</a>`。\n\
  - 如果你还没有完成，现在是去完成官方 [Django 教程](https://docs.djangoproject.com/en/2.1/intro/tutorial01/)\
  \ 第一部分的好时机。\n\n## 测试你的实现\n\n如果你已完成本章到练习为止的所有内容，你可以测试目前的实现。 [按照我们之前提供的指南](#)，使用测试模块\
  \ `tests_chapter3.py`。运行这些测试时，它们能通过你的实现吗？\n"
- "# 4. 模板和媒体文件\n\n在本章中，我们将介绍 Django 模板引擎，并展示如何同时提供 *静态* 文件和 *媒体* 文件。与其通过返回字符串来手工制作每个页面作为响应，我们可以使用\
  \ *模板* 来提供页面骨架结构的文件。从生成响应的视图中，我们可以向模板提供必要的數據来完整渲染该页面。为了整合 JavaScript 和 CSS（以及图像和其他媒体内容），我们将使用\
  \ Django 提供的机制来包含并分发此类文件给客户端，这将反过来允许我们提供附加功能（在 JavaScript 的情况下），或为页面提供样式。\n\n##\
  \ 4.1 使用模板\n\n到目前为止，我们只将 URL 映射连接到一个视图。然而，Django 框架基于 *模型-视图-模板* 架构。在本节中，我们将介绍 *模板*\
  \ 如何与 *视图* 协同工作。在后续章节中，我们将把这些与 *模型* 结合起来。\n\n为什么需要模板？网站页面之间的布局通常是相同的。无论你在网站的页面上看到共同的页眉或页脚，[页面布局的重复](https://www.techrepublic.com/blog/web-designer/effective-design-principles-for-web-designers-repetition/)都有助于用户导航并强化连续感。\
  \ [Django 提供模板](https://docs.djangoproject.com/en/2.1/ref/templates/) 使开发人员更容易实现这一设计目标，同时将应用程序逻辑（视图中的代码）与展示层关注点（应用的外观和感觉）分离。\n\
  \n在本章中，你将创建一个基本模板，用于生成 HTML 页面。然后该模板将通过 Django 视图分发。在 [有关数据库和模型的章节](https://docs.djangoproject.com/en/2.1/topics/db/models/)\
  \ 中，我们将更进一步，使用模板结合模型来分发动态生成的数据。\n\n### 摘要：什么是模板？\n\n在 Django 的世界里，将 *模板* 视为构建完整\
  \ HTML 网页所需的脚手架。模板包含网页的 *静态部分*（即永不改变的部分），其中包含特殊语法（或 *模板标签*），可以被覆盖并替换为 *动态内容*，你的\
  \ Django 应用的视图可以替换这些内容以生成最终的 HTML 响应。\n\n### 配置模板目录\n\n要让模板与你的 Django 应用一起运行，你需要创建两个存储模板文件的目录。\n\
  \n在你的 Django 项目目录中（例如 `<workspace>/tango_with_django_project/`），创建一个名为 `templates`\
  \ 的新目录。需要说明的是，这应该与项目中的 `manage.py` 脚本处于同一层级。在新的 templates 目录中，你还需要创建一个名为 `rango`\
  \ 的进一步目录。这意味着路径 `<workspace>/tango_with_django_project/templates/rango/` 是我们存储与\
  \ rango 应用相关模板的位置。\n\n### 保持模板有序\n\n将模板按每个应用的目录分开是良好的实践。这就是为什么我们在 templates 目录内创建了\
  \ rango 目录。如果你将应用打包分发给其他开发者，这样就能更轻松地知道哪些模板属于哪个应用！\n\n要告诉 Django 项目模板存储在哪里，请打开项目的\
  \ `settings.py` 文件。接下来，定位 `TEMPLATES` 数据结构。默认情况下，当你创建一个新的 Django 项目时，它看起来如下。\n\n\
  ```python\nTEMPLATES = [\n    {\n        'BACKEND': 'django.template.backends.django.DjangoTemplates',\n\
  \        'DIRS': [],\n        'APP_DIRS': True,\n        'OPTIONS': {\n        \
  \    'context_processors': [\n                'django.template.context_processors.debug',\n\
  \                'django.template.context_processors.request',\n               \
  \ 'django.contrib.auth.context_processors.auth',\n                'django.contrib.messages.context_processors.messages',\n\
  \            ],\n        },\n    },\n]\n```\n\n我们需要做的是通过修改 `DIRS` 列表来告诉 Django 我们的模板存储位置，默认情况下它是一个空列表。将字典键/值对更改为如下所示。\n\
  \n```python\n'DIRS': ['<workspace>/tango_with_django_project/templates']\n```\n\n\
  请注意，你*必须使用绝对路径*来定位模板目录。如果你与团队成员协作或在不同的计算机上工作，这就会成为一个问题。你会有不同的用户名和不同的驱动结构，这意味着 `<workspace>`\
  \ 目录的路径会不同。一个解决方案是为每个不同的配置添加路径。例如：\n\n```python\n'DIRS': [ '/Users/leifos/templates',\n\
  \           '/Users/maxwelld90/templates',\n           '/Users/davidm/templates',\
  \ ]\n```\n\n然而，这有几个问题。首先，你每次都要为每个设置添加路径。其次，如果你在不同的操作系统上运行应用，反斜杠需要以不同的方式构造。\n\n###\
  \ 不要硬编码路径！\n\n通往地狱的路是用硬编码路径铺成的。硬编码路径[^3]是一种软件工程反模式[^4]，会使你的项目可移植性更差[^5]——意味着当你在另一台计算机上运行时，它可能无法工作！（或者能工作，只是需要很多努力！）\n\
  \n### 动态路径\n\n更好的解决方案是利用内置的 Python 函数自动计算模板目录的路径。这样，无论你将 Django 项目代码放在何处，都可以获得绝对路径。这反过来意味着你的项目更具可移植性。\n\
  \n在你的 settings.py 文件顶部，有一个名为 BASE_DIR 的变量。该变量存储包含你的项目 settings.py 模块的目录的路径。这是通过使用特殊的\
  \ Python __file__ 属性获得的，该属性设置为 settings 模块的路径[^6]。使用它作为 os.path.abspath() 的参数可保证\
  \ settings.py 模块的绝对路径。调用 os.path.dirname() 然后提供 settings.py 模块所在目录的绝对路径的引用。再次调用\
  \ os.path.dirname() 去除另一个目录层级，因此 BASE_DIR 指向你的项目目录，即 `<workspace>/tango_with_django_project/`。如果你好奇，可以通过在\
  \ settings.py 文件中添加以下行来查看其工作原理。\n\n```\nprint(__file__)\nprint(os.path.dirname(__file__))\n\
  print(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n```\n\n能够访问\
  \ BASE_DIR 的值使你很容易引用 Django 项目的其他方面。使用 BASE_DIR 变量，我们现在可以创建一个名为 TEMPLATE_DIR 的新变量来引用你的新模板目录。我们可以利用\
  \ os.path.join() 函数连接多个路径，从而\n\n[^3]: http://en.wikipedia.org/wiki/Hard_coding\n\
  [^4]: http://sourcemaking.com/antipatterns\n[^5]: http://en.wikipedia.org/wiki/Software_portability\n\
  [^6]: http://stackoverflow.com/a/9271479\n\n\n\n\n\nto a variable definition like\
  \ the example below. Make sure you put this underneath the definition of `BASE_DIR`!\n\
  \n### Delete those Lines!\n\nIf you included the three `print()` statements above\
  \ to see what’s going on, make sure you remove them once you understand. Don’t just\
  \ leave them lying there. They will clutter your settings module, and clutter the\
  \ output of the Django development server!\n\n```python\nTEMPLATE_DIR = os.path.join(BASE_DIR,\
  \ 'templates')\n```\n\nHere, we make use of the `os.path.join()` function to join\
  \ together (or *concatenate*) the value of the `BASE_DIR` variable, and the string\
  \ `'templates'`. Upon completion, this concatenation yields `<workspace>/tango_with_django_project/templates/`.\
  \ From here, we can then use our new `TEMPLATE_DIR` variable to replace the hard-coded\
  \ path we defined earlier in `TEMPLATES`. Update the DIRS key/value pairing to look\
  \ like the following code snippet.\n\n```python\n'DIRS': [TEMPLATE_DIR, ]\n```\n\
  \n### Why `TEMPLATE_DIR`?\n\nYou’ve created a new variable called `TEMPLATE_DIR`\
  \ at the top of your `settings.py` file because it’s easier to access should you\
  \ ever need to change it. For more complex Django projects, the DIRS list allow\
  \ you to specify more than one template directory to draw templates from. For this\
  \ book however, one location is sufficient to get everything working.\n\n### Concatenating\
  \ Paths\n\n**When concatenating system paths together, always use `os.path.join()`.**\
  \ Using this built-in function ensures that the correct path separators are used.\
  \ On a UNIX operating system (or derivative of), forward slashes (`/`) would be\
  \ used to separate directories, whereas a Windows operating system would use backward\
  \ slashes (`\\`). If you manually append slashes to paths, you may end up with path\
  \ errors when attempting to run your code on a different operating system, thus\
  \ reducing your project’s portability.\n\n### Adding a Template\n\nWith your template\
  \ directory and path now set up, create a file called index.html and place it in\
  \ the templates/rango/ directory. Within this new file, add the following HTML markup\
  \ and Django template code.\n\n```html\n<!DOCTYPE html>\n<html>\n\n<head>\n<title>Rango</title>\n\
  </head>\n\n<body>\n<h1>Rango says...</h1>\n<div>\nhey there partner! <br />\n<strong>{{\
  \ boldmessage }}</strong><br />\n</div>\n<div>\n<a href=\"/rango/about/\">About</a><br\
  \ />\n</div>\n</body>\n\n</html>\n```\n\nFrom this HTML code, it should be clear\
  \ that a simple HTML page is going to be generated that greets a user with a hello\
  \ world message. You might also notice some non-HTML in the form of `{{ boldmessage\
  \ }}`. This is a Django template variable. We can set values to these variables\
  \ so they are replaced with whatever we want when the template is rendered. We’ll\
  \ get to that in a moment.\n\nTo use this template, we need to reconfigure the `index()`\
  \ view that we created earlier. Instead of dispatching a simple response, we will\
  \ change the view to dispatch our template.\n\nIn `rango/views.py`, check to see\
  \ if the following import statement exists at the top of the file. Django should\
  \ have added it for you when you created the Rango app. If it is not present, add\
  \ it, but you should have kept it from earlier.\n\n```python\nfrom django.shortcuts\
  \ import render\n```\n\nYou can then update the `index()` view function as follows.\
  \ Check out the inline commentary to see what each line does.\n\n```python\ndef\
  \ index(request):\n    # Construct a dictionary to pass to the template engine as\
  \ its context.\n    # Note the key boldmessage matches to {{ boldmessage }} in the\
  \ template!\n    context_dict = {'boldmessage': 'Crunchy, creamy, cookie, candy,\
  \ cupcake!'}\n\n    # Return a rendered response to send to the client.\n    # We\
  \ make use of the shortcut function to make our lives easier.\n    # Note that the\
  \ first parameter is the template we wish to use.\n    return render(request, 'rango/index.html',\
  \ context=context_dict)\n```\n\nFirst, we construct a dictionary of key/value pairs\
  \ that we want to use within the template. Then, we call the `render()` helper function.\
  \ This function takes as input the user’s request, the template filename, and the\
  \ context dictionary. The `render()` function will take this data and mash it together\
  \ with the template to produce a complete HTML page that is returned with a `HttpResponse`.\
  \ This response is then returned and dispatched to the user’s web browser.\n\n###\
  \ What is the Template Context?\n\n![](img/75169a27287f7c945bf2cbf7dede5251_56_0.png)\n\
  \nWhen a template file is loaded with the Django templating system, a *template\
  \ context* is created. In simple terms, a template context is a Python dictionary\
  \ that maps template variable names with Python variables. In the template we created\
  \ above, we included a template variable name called `boldmessage`. In our updated\
  \ `index(request)` view example, the string `Crunchy, creamy, cookie, candy, cupcake!`\
  \ is mapped to template variable `boldmessage`. The string `Crunchy, creamy, cookie,\
  \ candy, cupcake!` therefore replaces *any* instance of `{{ boldmessage }}` within\
  \ the template.\n\nNow that you have updated the view to employ the use of your\
  \ template, start the Django development server and visit `http://127.0.0.1:8000/rango/`.\
  \ You should see your simple HTML template rendered in your browser – and it should\
  \ look just like the [example screenshot shown below](#). If you don’t, read the\
  \ error message presented to see what the problem is, and then double-check all\
  \ the changes that you have made. One of the most common issues people have with\
  \ templates is that the path is set incorrectly in `settings.py`. Sometimes it’s\
  \ worth adding a print statement to `settings.py` to report the `BASE_DIR` and `TEMPLATE_DIR`\
  \ to make sure everything is correct.\n\nThis example demonstrates how to use templates\
  \ within your views. However, we have only touched on a fraction of the functionality\
  \ provided by the Django templating engine. We will use templates in more sophisticated\
  \ ways as you progress through this book. In the meantime, you can find out more\
  \ about [templates from the official Django documentation](https://docs.djangoproject.com/en/2.1/ref/templates/).\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_57_0.png)\n\n**What you should see when\
  \ your first template is working correctly. Note the bold text – Crunchy, creamy,\
  \ cookie, candy, cupcake! – which originates from the view, but is rendered in the\
  \ template.**\n\n## 4.2 Serving Static Media Files\n\nWhile you’ve got templates\
  \ working, your Rango app is admittedly looking a bit plain right now – there’s\
  \ no styling or imagery. We can add references to other files in our HTML template\
  \ such as *Cascading Style Sheets (CSS)*⁸, *JavaScript*⁹ and images to improve the\
  \ presentation. These are called *static files*, because they are not generated\
  \ dynamically by a web server; they are simply sent as is to a client’s web browser.\
  \ This section shows you how to set Django up to serve static files, and shows you\
  \ how to include an image within your simple template.\n\n### Configuring the Static\
  \ Media Directory\n\nTo start, you will need to set up a directory in which static\
  \ media files are stored. In your project directory (e.g. `<workspace>/tango_with_django_project/`),\
  \ create a new directory called `static` and a new directory called `images` inside\
  \ `static`. Check that the new static directory is at the same level as the templates\
  \ directory you created earlier in this chapter.\n\nNext, place an image inside\
  \ the `images` directory. As shown in below, we chose a picture of [the chameleon\
  \ Rango](https://www.imdb.com/title/tt1192628/)¹⁰ — a fitting mascot, if ever there\
  \ was one.\n\n> ⁸ http://en.wikipedia.org/wiki/Cascading_Style_Sheets  \n> ⁹ https://en.wikipedia.org/wiki/JavaScript\
  \  \n> ¹⁰ http://www.imdb.com/title/tt1192628/\n\n### Test your Configuration\n\n\
  As a small exercise, test to see if everything is working correctly. Try and view\
  \ the `rango.jpg` image in your browser when the Django development server is running.\
  \ If your `STATIC_URL` is set to `/static/` and `rango.jpg` can be found at `images/rango.jpg`,\
  \ what is the complete URL that you would enter into your web browser’s window to\
  \ access this resource?\n\n**Try to figure this out before you move on! It’ll help\
  \ you understand how to interpret static URLs.** The answer is coming up if you\
  \ are struggling to figure it out.\n\n### Don’t Forget the Slashes!\n\nWhen setting\
  \ `STATIC_URL`, check that you end the URL you specify with a forward slash (e.g.\
  \ `/static/`, not `/static`). As per the [official Django documentation](https://docs.djangoproject.com/en/2.1/ref/settings/#std:setting-STATIC_URL),\
  \ not doing so can open you up to a world of pain. The extra slash at the end ensures\
  \ that the root of the URL (e.g. `/static/`) is separated from the static content\
  \ you want to serve (e.g. `images/rango.jpg`).\n\n### Serving Static Content\n\n\
  While using the Django development server to serve your static media files is fine\
  \ for a development environment, it’s highly unsuitable for a production environment.\
  \ The [official Django documentation on deployment](https://docs.djangoproject.com/en/2.1/howto/static-files/deployment/)\
  \ provides further information about deploying static files in a production environment.\
  \ We’ll look at this issue in more detail however when we [deploy Rango].\n\nIf\
  \ you haven’t managed to figure out where the image should be accessible from, point\
  \ your web browser to `http://127.0.0.1:8000/static/images/rango.jpg`.\n\n### Static\
  \ Media Files and Templates\n\nNow that you have your Django project set up to handle\
  \ static files, you can now make use of these files within your templates to improve\
  \ their appearance and add additional functionality.\n\n\n\n\n\n```html\n<img src=\"\
  /static/images/rango.jpg\" alt=\"Picture of Rango\" />\n```\n\n如果由于某种原因图片无法加载，指定一段替代文本是个好主意。这就是\
  \ `alt` 属性在 `img` 标签内所提供的作用。你可以在下图中看到会发生什么。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_63_0.png)\n\
  \n**如果找不到 Rango 的图片，就会用包含 img 标签 alt 属性文本的占位符代替。**\n\n经过这些小幅修改之后，再次启动 Django 开发服务器，并访问\
  \ http://127.0.0.1:8000/rango。如果一切操作正确，你将看到一个与下面截图类似的网页。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_64_0.png)\n\
  \n**我们的第一个 Rango 模板，配有一张变色龙 Rango 的图片。**\n\n## 始终把 `<!DOCTYPE>` 放在最前面！\n\n在创建 HTML\
  \ 模板时，务必确保 `DOCTYPE` 声明¹⁴出现在**第一行**。如果你先把 `{% load staticfiles %}` 模板命令放在前面，那么渲染后的模板中会在\
  \ DOCTYPE 声明之前添加空白字符。这些空白字符会导致你的 HTML 标记无法通过验证¹⁵。\n\n¹⁴http://www.w3schools.com/tags/tag_doctype.asp\
  \  \n¹⁵https://validator.w3.org/\n\n## 加载其他静态文件\n\n只要你希望在模板中引用静态文件，就可以使用 {% static\
  \ %} 模板标签。下面的代码示例演示了如何使用正确的 HTML 标记在模板中包含 JavaScript、CSS 和图片。\n\n```\n<!DOCTYPE\
  \ html>\n{% load staticfiles %}\n\n<html>\n\n    <head>\n        <title>Rango</title>\n\
  \        <!-- CSS -->\n        <link rel=\"stylesheet\" href=\"{% static \"css/base.css\"\
  \ %}\" />\n        <!-- JavaScript -->\n        <script src=\"{% static \"js/jquery.js\"\
  \ %}\"></script>\n    </head>\n\n    <body>\n        <!-- Image -->\n        <img\
  \ src=\"{% static \"images/rango.jpg\" %}\" alt=\"Picture of Rango\" />\n    </body>\n\
  \n</html>\n```\n\n在这里不要更新 index.html 模板——这仅仅是为了演示 {% static %} 模板函数如何工作的示例。在本教程后面，你将添加\
  \ CSS 和 JavaScript。\n\n你引用的静态文件显然必须存在于你的静态目录中。如果请求的文件不存在，或者你引用的方式不正确，Django 开发服务器的控制台输出会显示\
  \ HTTP 404 错误¹⁶。试着引用一个不存在的文件，看看会发生什么。请看下面的输出片段，注意最后一条的 HTTP 状态码是 404。\n\n```\n[24/Mar/2019\
  \ 17:05:54] \"GET /rango/ HTTP/1.1\" 200 366\n[24/Mar/2019 17:05:55] \"GET /static/images/rango.jpg\
  \ HTTP/1.1\" 200 0\n[24/Mar/2019 17:05:55] \"GET /static/images/not-here.jpg HTTP/1.1\"\
  \ 404 0\n```\n\n关于包含静态媒体的更多信息，你可以阅读 Django 官方文档中关于在模板中使用静态文件的说明¹⁷。\n\n## 4.3 提供媒体文件服务\n\
  \n静态媒体文件可以被认为是那些不会改变且对你的应用程序至关重要的文件。然而，你通常还需要存储动态的*媒体文件*。这些文件可以由你的用户或管理员上传，因此它们可能会发生变化。例如，一个媒体文件就是用户的个人资料图片。如果你运营一个电子商务网站，一系列媒体文件将被用作网店不同产品的图片。\n\
  \n要成功提供媒体文件服务，我们需要更新 Django 项目的设置。本节详细介绍了你需要添加的内容——[但我们要到后面才会进行完整测试](#)，届时我们将实现让用户上传个人资料图片的功能。\n\
  \n### 提供媒体文件服务\n\n![](img/75169a27287f7c945bf2cbf7dede5251_66_0.png)\n\n与提供静态内容一样，Django\
  \ 提供了在开发环境中提供媒体文件服务的能力。这使你能够进行测试并确保一切正常。Django 用于提供这些内容的方法非常不适合生产环境，因此你应该考虑通过其他方式（例如像\
  \ Apache 这样的生产级 Web 服务器）来托管应用程序的媒体文件。[部署章节](#)将更详细地讨论这一点。\n\n## 修改 `settings.py`\n\
  \n首先，打开你的 Django 项目的 `settings.py` 模块。在这里，我们将再添加一些内容。与静态文件一样，媒体文件会上传到你的文件系统中的一个指定目录。我们需要告诉\
  \ Django 将这些文件存储在哪里。\n\n在 `settings.py` 模块的顶部，找到现有的 `BASE_DIR`、`TEMPLATE_DIR` 和\
  \ `STATIC_DIR` 变量——它们应该在靠近顶部的位置。在它们下面，再添加一个变量 `MEDIA_DIR`。\n\n```\nMEDIA_DIR = os.path.join(BASE_DIR,\
  \ 'media')\n```\n\n这行代码告诉 Django，媒体文件将被上传到你的 Django 项目根目录下的‘/media’目录中——即 <workspace>/tango_with_django_project/media/。正如我们之前提到的，将这些路径变量放在\
  \ settings.py 模块的顶部，可以在以后必要时轻松更改路径。\n\n现在，在 settings.py 中找一个空白位置，再添加两个变量。Django\
  \ 会读取并使用变量 MEDIA_ROOT 和 MEDIA_URL 来设置媒体文件托管¹⁸。\n\n```\nMEDIA_ROOT = MEDIA_DIR\n\
  MEDIA_URL = '/media/'\n```\n\n## 再次强调：不要忘记正斜杠！\n\n与 STATIC_URL 变量一样，确保 MEDIA_URL\
  \ 以正斜杠结尾。请务必使用类似 /media/ 的形式，而不是 /media。末尾多出的斜杠可以确保 URL 的根（例如 /media/）与你的应用用户上传内容的文件名分开。\n\
  \n这两个变量告诉 Django 在文件系统中的哪个位置查找已上传和存储的媒体文件（MEDIA_ROOT），以及使用什么 URL 来提供它们（MEDIA_URL）。根据我们上面定义的配置，例如，用户上传文件\
  \ sample.pdf 后，该文件将通过 URL http://localhost:8000/media/sample.pdf 在你的 Django 开发服务器上提供。\n\
  \n在本书后面处理模板时，当我们需要引用上传的内容时，获取对 MEDIA_URL 路径的引用会非常方便。Django 提供了一个模板上下文处理器¹⁹，使我们能够轻松做到这一点。虽然我们现在并不是严格需要设置这个，但现在添加它是一个好时机。\n\
  \n¹⁸https://docs.djangoproject.com/en/2.1/howto/static-files/#serving-files-uploaded-by-a-user-during-development\
  \  \n¹⁹https://docs.djangoproject.com/en/2.1/ref/templates/api/#django-template-context-processors-media\n\
  \n要做到这一点，请找到项目 settings.py 模块中的 TEMPLATES 列表。该列表包含一个字典；请在嵌套字典中找到 context_processors\
  \ 列表。在 context_processors 列表中，添加一个新字符串以包含一个额外的上下文处理器：`'django.template.context_processors.media'`。你的\
  \ context_processors 列表应该类似下面的示例。\n\n```\n'context_processors': [\n    'django.template.context_processors.debug',\n\
  \    'django.template.context_processors.request',\n    'django.contrib.auth.context_processors.auth',\n\
  \    'django.contrib.messages.context_processors.messages',\n    'django.template.context_processors.media',\
  \  # Check/add this line!\n],\n```\n\n## 调整你的 URL\n\n在开发环境中设置提供媒体服务的最后一步，是告诉 Django\
  \ 从 MEDIA_URL 提供静态内容。这可以通过打开项目的 urls.py 模块来实现。请记住，项目的 urls.py 模块位于 tango_with_django_project/tango_with_django_project\
  \ 目录中——而不是 tango_with_django_project/rango/urls.py 模块！\n\n在 urls.py 模块中，首先在顶部添加以下导入语句。如果你发现其中一行已经存在，则无需再次输入。\n\
  \n```\nfrom django.conf import settings\nfrom django.conf.urls.static import static\n\
  ```\n\n一旦导入了这些内容，你就需要修改下面的 urlpatterns 列表。修改的方法是附加一个对你刚刚导入的 static() 函数的调用，并传入相关设置，告诉该函数你的文件系统中文件存储在哪里（MEDIA_ROOT），以及它们应该通过什么\
  \ URL 提供（MEDIA_URL）。\n\n```\nurlpatterns = [\n    ...\n    ...\n] + static(settings.MEDIA_URL,\
  \ document_root=settings.MEDIA_ROOT)\n```\n\n完成这些更改后，你应该能够通过 /media/ URL 从项目的 media\
  \ 目录提供内容。\n\n\n\n\n\n## 练习\n\n尝试完成以下练习，以巩固你从本章学到的知识。\n\n- 将关于页面也改为使用模板。为此，请使用名为\
  \ `about.html` 的模板，并将该文件的内容基于 `index.html`。在新模板的 `<h1>` 元素中，保留 `Rango says...` ——\
  \ 但在其下方的一行中，添加文本 `'here is the about page.'`。\n- 记得更新 `views.py` 中的 `about()` 视图！你认为这个视图需要上下文（context）字典吗？\n\
  - 你的新 `about.html` 必须包含一个返回首页的链接。如果你复制了现有的 `index.html` 模板，则需要做一处小修改才能实现这一点。\n-\
  \ 在新的 `about.html` 模板中，添加一张存储在你项目静态文件中的图片。请复用你在 `index()` 视图中用过的 `rango.jpg` 图片。确保使用与之前相同的替代文本（alt\
  \ text）！\n- 在关于页面上，添加一行文字，内容为 `This tutorial has been put together by <your-name>`。如果你是从\
  \ `index.html` 复制过来的，那么替换 `{{ boldmessage }}` 的位置正是放置这句话的理想之处。\n- 在你的 Django 项目目录中，创建一个名为\
  \ `media` 的新目录（如果尚未创建）。下载一张猫咪的 JPEG 图片，并将其保存到 media 目录下，命名为 `cat.jpg`。\n- 在你的 `about.html`\
  \ 模板中，添加一个 `<img>` 标签来显示猫咪图片，以确保你的媒体文件能被正确提供。**在首页中保留 Rango 的静态图片**，这样你的关于页面就能同时展示静态文件和媒体文件的工作示例。猫咪图片的替代文本应为\
  \ `Picture of a Cat`。**这意味着在你渲染出的关于页面中，你应该同时看到 Rango（来自静态文件）和猫咪（来自媒体文件）两张图片。** 对于这最后一个任务，你不需要修改\
  \ `about()` 视图 —— 只需要修改 `about.html`。\n\n## 静态文件和媒体文件\n\n请记住，**静态文件，顾名思义，是不会变化的。**\
  \ 这些文件构成了你网站的核心组件。**媒体文件则是由用户定义的，因此它们可能经常变化！**\n\n静态文件的一个例子可以是样式表文件（CSS），它决定了你的应用网页的外观。媒体文件的一个例子可以是用户个人资料图片，当用户在你的应用上创建账户时上传。\n\
  \n## 测试你的实现\n\n如果你已经完成了本章中包括练习在内的所有内容，你就可以测试目前所实现的成果了。[按照我们之前提供的指南](), 使用测试模块 `tests_chapter4.py`\
  \ 来测试。你的实现能通过我们的测试吗？\n"
- "# 5. 模型与数据库\n\n通常，Web 应用需要一个后端来存储应用网页上出现的动态内容。对于 Rango，我们需要存储创建的页面和分类，以及其他详细信息。最方便的方法是使用关系型数据库的服务。这些数据库很可能使用\
  \ *结构化查询语言（SQL）* 来让你查询数据存储。\n\n然而，Django 提供了一种便捷的方式来访问存储在数据库中的数据，即通过使用 *对象关系映射器（ORM）*¹。本质上，存储在数据库表中的数据是通过\
  \ Django *模型* 封装的。模型是一个 Python 对象，用于描述数据库表中的数据。Django 不会让你直接通过 SQL 操作数据库，而是提供了一些方法，让你可以通过相应的\
  \ Python 模型对象来操作数据。你向 ORM 发出的任何命令都会自动转换为对应的 SQL 语句，并由系统代为执行。\n\n本章将带你了解使用 Django\
  \ 及其 ORM 进行数据管理的基础知识。你会发现，在你的应用底层数据库中添加、修改和删除数据非常容易，并且你会看到将数据从数据库传递到用户 Web 浏览器是多么简单。\n\
  \n## 5.1 Rango 的数据需求\n\n在开始之前，让我们先梳理一下正在开发的 Rango 应用的数据需求。前文已经详细提供了完整的应用需求。我们在这里再次回顾一下数据库需求。\n\
  \n- Rango 本质上是一个 *网页目录* —— 它是一个存放指向其他外部网站链接的网站。\n\n¹ https://en.wikipedia.org/wiki/Object-relational_mapping\n\
  \n- 有几种不同的 *网页分类*，每个分类包含零个、一个或多个链接。我们在概览章节中假设这是一种一对多的关系。请查看下面的实体关系图。\n- 一个分类有一个名称、若干访问量和若干点赞数。\n\
  - 一个页面属于特定的分类，它有一个标题、一个 URL 和若干浏览量。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_74_0.png)\n\
  \nRango 两个主要实体的实体关系图。\n\n## 5.2 告诉 Django 你的数据库\n\n在创建任何模型之前，我们需要先设置好用于 Django 的数据库。在\
  \ Django 中，当你建立新项目时，`settings.py` 模块中会自动创建一个 `DATABASES` 变量。除非你更改过它，否则它应该类似下面的示例。\n\
  \n```\nDATABASES = {\n    'default': {\n        'ENGINE': 'django.db.backends.sqlite3',\n\
  \        'NAME': os.path.join(BASE_DIR, 'db.sqlite3'),\n    }\n}\n```\n\n对于我们的 Rango\
  \ 应用，这部分基本上可以保持原样。你可以看到一个由轻量级数据库引擎 SQLite² 提供支持的默认数据库（参见 `ENGINE` 选项）。这个数据库的 `NAME`\
  \ 条目是数据库文件的路径，默认是 `<workspace>/tango_with_django_project/db.sqlite3` —— 也就是位于你的\
  \ Django 项目根目录下的 `db.sqlite3` 文件。\n\n> ² https://www.sqlite.org/\n\n### 不要把数据库推送到\
  \ Git！\n\n如果你在使用 Git，你可能会想把数据库文件添加并提交。但我们认为这不是一个好主意。如果你和其他人一起开发应用会怎样？他们很可能会在测试功能时更改数据库。不同版本的数据库文件（在开发过程中最终并不重要）**会**导致无休止的冲突。\n\
  \n相反，请将 `db.sqlite3` 添加到你的 `.gitignore` 文件中，这样当你执行 `git commit` 和 `git push` 时它就不会被添加。你也可以对\
  \ `*.pyc` 等文件或机器特定文件执行同样的操作。关于如何设置 `.gitignore` 文件的更多信息，你可以参考附录中的 [Git 熟悉章节](#)。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_75_0.png)\n\n### 使用其他数据库引擎\n\nDjango\
  \ 数据库框架的创建是为了适配各种不同的数据库后端，例如 [PostgreSQL](http://www.postgresql.org/)³、[MySQL](https://www.mysql.com/)⁴\
  \ 和 [微软的 SQL Server](https://en.wikipedia.org/wiki/Microsoft_SQL_Server)⁵。对于其他数据库引擎，还存在像\
  \ `USER`、`PASSWORD`、`HOST` 和 `PORT` 这样的键，供你配置 Django 与数据库的连接。\n\n虽然本书不涉及如何使用其他数据库引擎，但在线有相关指南展示如何操作。一个好的起点是\
  \ [Django 官方文档](https://docs.djangoproject.com/en/2.1/ref/databases/#storage-engines)⁶。\n\
  \n请注意，SQLite 足以演示 Django ORM 的功能。当你发现应用爆红并积累了成千上万的用户时，你可能需要考虑 [将数据库后端切换为更强大的引擎](http://www.sqlite.org/whentouse.html)⁷。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_75_1.png)\n\n## 5.3 创建模型\n\n在 `settings.py`\
  \ 中配置好数据库后，让我们为 Rango 应用创建两个初始数据模型。Django 应用的模型存储在\n\n³ http://www.postgresql.org/\
  \  \n⁴ https://www.mysql.com/  \n⁵ https://en.wikipedia.org/wiki/Microsoft_SQL_Server\
  \  \n⁶ https://docs.djangoproject.com/en/2.1/ref/databases/#storage-engines  \n\
  ⁷ http://www.sqlite.org/whentouse.html\n\n\n\n\n各自的 `models.py` 模块。这意味着对于 Rango\
  \ 来说，模型存储在 `<workspace>/tango_with_django_project/rango/models.py` 中。\n\n对于模型本身，我们将创建两个类——每个模型对应一个类。这两个类都必须从\
  \ Model 基类 `django.db.models.Model` [继承](https://en.wikipedia.org/wiki/Inheritance_(object-oriented_programming))。这两个\
  \ Python 类将是代表 *类别* 和 *页面* 的模型定义。定义 `Category` 和 `Page` 模型如下。\n\n```python\nclass\
  \ Category(models.Model):\n    name = models.CharField(max_length=128, unique=True)\n\
  \n    def __str__(self):\n        return self.name\n\nclass Page(models.Model):\n\
  \    category = models.ForeignKey(Category, on_delete=models.CASCADE)\n    title\
  \ = models.CharField(max_length=128)\n    url = models.URLField()\n    views = models.IntegerField(default=0)\n\
  \n    def __str__(self):\n        return self.title\n```\n\n### 检查导入语句\n\n在 `models.py`\
  \ 模块的顶部，你应该会看到 `from django.db import models`。如果没有看到，请添加进去。\n\n定义模型时，你需要指定字段列表及其关联类型，以及任何必需或可选参数。默认情况下，所有模型都有一个名为\
  \ `id` 的自增整数字段，该字段被自动分配并充当主键。\n\nDjango 提供了[一系列全面的内置字段类型](https://docs.djangoproject.com/en/2.1/ref/models/fields/#model-field-types)。下面详细介绍了其中一些最常用的字段类型。\n\
  \n- `CharField`，用于存储字符数据（例如字符串）的字段。指定 `max_length` 以提供 `CharField` 字段可以存储的最大字符数。\n\
  - `URLField`，很像 `CharField`，但设计用于存储资源 URL。你也可以指定 `max_length` 参数。\n- `IntegerField`，用于存储整数。\n\
  - `DateField`，用于存储 Python `datetime.date` 对象。\n\n### 其他字段类型\n\n查阅 Django 文档中关于模型字段¹⁰的内容，以获取你可以使用的\
  \ Django 字段类型的完整列表，以及每种字段所拥有的必需和可选参数的详细信息。\n\n对于每个字段，你可以指定 `unique` 属性。如果设置为 `True`，则给定字段的值在与关联模型映射的底层数据库表中必须是唯一的。例如，看看我们上面定义的\
  \ `Category` 模型。字段 `name` 已被设置为唯一，这意味着每个类别名称都必须是唯一的。这意味着你可以将该字段用作主键。\n\n你还可以为每个字段指定其他属性，例如使用语法\
  \ `default='value'` 声明默认值，以及字段的值是否可以为空（或 NULL¹¹）（`null=True`）或不能为空（`null=False`）。\n\
  \nDjango 提供了三种字段类型来在数据库中的模型之间建立关系。这些是：\n\n- `ForeignKey`，一种允许我们创建一对多关系¹²的字段类型；\n\
  - `OneToOneField`，一种允许我们定义严格的一对一关系¹³的字段类型；以及\n- `ManyToManyField`，一种允许我们定义多对多关系¹⁴的字段类型。\n\
  \n从上面的模型示例中，模型 `Page` 中的字段 `category` 是一个 `ForeignKey`。这允许我们与模型/表 `Category` 建立一对多关系，该关系作为参数传递给字段的构造函数。在指定外键时，我们还需要向\
  \ Django 提供如何处理页面所属类别被删除这一情况的指令。`CASCADE` 指示 Django 在类别被删除时删除与该类别关联的页面。但是，还有其他设置可以为\
  \ Django 提供如何处理这种情况的其他指令。有关更多详细信息，请参阅 [Django 文档中的外键](https://docs.djangoproject.com/en/2.1/ref/models/fields/#django.db.models.ForeignKey)。\n\
  \n最后，实现 `__str__()` 方法是一个好习惯。如果不实现这个方法，当你 `print()` 该对象时（也许在 Django shell 中，我们将在本章后面讨论），它会显示为\
  \ `<Category: Category object>`。这在调试或访问对象时不太有用。你怎么知道显示的是哪个类别？当像上面那样包含 `__str__()`\
  \ 时，你会看到 Python 类别的 `<Category: Python>`（例如）。这在我们稍后使用管理界面时也很有帮助，因为 Django 将显示源自\
  \ `__str__()` 的对象的字符串表示。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_78_0.png)\n\
  \n### 始终在你的类中实现 `__str__()` 方法\n\n在类中实现 `__str__()` 方法将使调试变得容易得多，并且还允许你利用 Django\
  \ 的其他内置功能（例如管理界面）。如果你使用过像 Java 这样的编程语言，那么 `__str__()` 是 `toString()` 方法在 Python\
  \ 中的对应物！\n\n## 5.4 创建并迁移数据库\n\n现在我们的模型定义在 `models.py` 中，我们可以让 Django 施展魔法，在底层数据库中创建表。Django\
  \ 提供了一个所谓的[迁移工具](https://en.wikipedia.org/wiki/Data_migration)来帮助我们设置和更新数据库，以反映对模型所做的任何更改。例如，如果你要添加一个新字段，那么你可以使用迁移工具来更新数据库。\n\
  \n### 设置\n\n首先，数据库必须*初始化*。这意味着创建数据库及其所有相关表，以便随后将数据存储在其中。为此，你必须打开终端或命令提示符，并导航到项目的根目录——即\
  \ `manage.py` 模块所在的位置。运行以下命令，*请注意，输出可能会与下方看到的内容略有不同。*\n\n```text\n$ python manage.py\
  \ migrate\n```\n\n```text\nOperations to perform:\n              Apply all migrations:\
  \ admin, auth, contenttypes, sessions\nRunning migrations:\n              Applying\
  \ contenttypes.0001_initial... OK\n              Applying auth.0001_initial... OK\n\
  \              Applying admin.0001_initial... OK\n              Applying admin.0002_logentry_remove_auto_add...\
  \ OK\n              Applying contenttypes.0002_remove_content_type_name... OK\n\
  \              Applying auth.0002_alter_permission_name_max_length... OK\n     \
  \         Applying auth.0003_alter_user_email_max_length... OK\n              Applying\
  \ auth.0004_alter_user_username_opts... OK\n              Applying auth.0005_alter_user_last_login_null...\
  \ OK\n              Applying auth.0006_require_contenttypes_0002... OK\n       \
  \       Applying auth.0007_alter_validators_add_error_messages... OK\n         \
  \     Applying auth.0008_alter_user_username_max_length... OK\n              Applying\
  \ auth.0009_alter_user_last_name_max_length... OK\n              Applying sessions.0001_initial...\
  \ OK\n```\n\n当执行此命令时，Django 项目中安装的所有应用（请检查 `settings.py` 中的 `INSTALLED_APPS`）都将被调用来更新其数据库表示。此命令执行后，你应该会在\
  \ Django 项目的根目录中看到一个 `db.sqlite3` 文件。\n\n接下来，创建一个超级用户来管理数据库。运行以下命令。\n\n```text\n\
  $ python manage.py createsuperuser\n```\n\n超级用户帐户将用于访问 Django 管理界面，该界面将在本章后面使用。输入帐户的用户名、电子邮件地址，并在提示时提供密码。完成后，脚本应成功结束。请确保记下超级用户帐户的用户名和密码。\n\
  \n### 创建和更新模型/表\n\n每当你对应用的模型进行更改时，都需要通过 `manage.py` 中的 `makemigrations` 命令来*登记*更改。将\
  \ `rango` 应用指定为我们的目标，然后从 Django 项目的根目录发出以下命令。\n\n```text\n$ python manage.py makemigrations\
  \ rango\n\nMigrations for 'rango':\n    rango/migrations/0001_initial.py\n    -\
  \ Create model Category\n    - Create model Page\n```\n\n此命令完成后，检查 `rango/migrations`\
  \ 目录，可以看到已创建一个 Python 脚本。它名为 `0001_initial.py`，其中包含为该特定迁移创建数据库模式所需的全部详细信息。\n\n###\
  \ 检查底层 SQL\n\n如果你想检查 Django ORM 为给定迁移向数据库引擎发出的底层 SQL，可以发出以下命令。\n\n```text\n$ python\
  \ manage.py sqlmigrate rango 0001\n```\n\n在此示例中，`rango` 是你的应用的名称，`0001` 是你想要查看其\
  \ SQL 代码的迁移。这样做可以让你更好地理解数据库层到底发生了什么，例如创建了哪些表。对于包含多对多关系的复杂数据库模式，你会发现会为你创建额外的表。\n\n\
  为应用创建迁移后，需要将其提交到数据库。为此，请再次发出 `migrate` 命令。\n\n\n\n\n```text\n$ python manage.py\
  \ migrate\n\nOperations to perform:\n        Apply all migrations: admin, auth,\
  \ contenttypes, rango, sessions\nRunning migrations:\n        Applying rango.0001_initial...\
  \ OK\n```\n\n此输出确认数据库表已在你的数据库中创建完成，随后你便可以开始使用新的模型和表了。\n\n然而，你可能已经注意到，我们的 `Category`\
  \ 模型目前还缺少 Rango 需求中规定的一些字段。**别担心，这些字段稍后会被添加，届时你将再次经历一次迁移过程。**\n\n## 5.5 Django 模型与\
  \ Shell\n\n在我们转向演示 Django 管理界面之前，值得注意的是，你可以直接在 Django Shell 中与 Django 模型交互——这是一个非常有用的调试工具。我们将演示如何使用这种方法创建一个\
  \ Category 实例。\n\n要进入 Shell，我们需要再次在 Django 项目的根目录下调用 `manage.py`。运行以下命令。\n\n```text\n\
  $ python manage.py shell\n```\n\n这会启动一个 Python 解释器实例，并为你加载项目的设置。然后你就可以与模型交互了，下面的终端会话演示了这一功能。请查看我们添加的内联注释，了解每条命令的作用。\n\
  \n```text\n# Import the Category model from the Rango application\n>>> from rango.models\
  \ import Category\n\n# Show all the current categories\n>>> print(Category.objects.all())\n\
  # Since no categories have been defined we get an empty QuerySet object.\n<QuerySet\
  \ []>\n\n# Create a new category object, and save it to the database.\n>>> c = Category(name='Test')\n\
  >>> c.save()\n\n# Now list all the category objects stored once more.\n>>> print(Category.objects.all())\n\
  # You'll now see a 'Test' category.\n<QuerySet [<Category: Test>]>\n\n# Quit the\
  \ Django shell.\n>>> quit()\n```\n\n在示例中，我们首先导入要操作的模型。然后打印出所有现有的类别。由于底层的 Category\
  \ 表是空的，因此返回了一个空列表。接着我们创建并保存一个 Category，然后再次打印出所有类别。第二次打印显示了刚刚添加的新 Category。注意，第二次打印中出现了名字\
  \ Test——这是 `__str__()` 的输出，它很好地说明了为什么包含这些方法很重要！\n\n### 完成官方教程\n\n上面的示例只是让你初步体验了在\
  \ Django Shell 中可以执行的数据库相关操作。如果你还没有完成，现在是完成[官方 Django 教程第二部分](https://docs.djangoproject.com/en/2.1/intro/tutorial02/)的好时机，以了解更多关于模型交互的知识。此外，还可以查看[官方\
  \ Django 文档中关于可用命令列表](https://docs.djangoproject.com/en/2.1/ref/django-admin/#available-commands)的部分，用于处理模型。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_84_0.png)\n\nDjango 管理界面，未包含 Rango 模型。\n\
  \n虽然看起来不错，但我们缺少为 Rango 应用定义的 Category 和 Page 模型。要包含这些模型，我们需要告知 Django 我们想包含它们。\n\
  \n为此，请打开文件 rango/admin.py。文件中已有一条 import 语句，请修改该模块，以便注册你想要包含的每个类。下面的示例将 Category\
  \ 和 Page 类都注册到了管理界面。\n\n```python\nfrom django.contrib import admin\nfrom rango.models\
  \ import Category, Page\n\nadmin.site.register(Category)\nadmin.site.register(Page)\n\
  ```\n\n未来要添加其他的类，只需再调用一次 admin.site.register() 方法，并确保在模块顶部导入该模型即可。\n\n保存这些更改后，重新启动\
  \ Django 开发服务器，并再次访问管理界面 http://127.0.0.1:8000/admin/。你将看到 Category 和 Page 模型，如下所示。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_85_0.png)\n\nDjango 管理界面，已包含 Rango 模型。\n\
  \n尝试点击 Rango 部分中的 Categorys 链接。在这里，你应该会看到我们之前通过 Django Shell 创建的 Test 类别。\n\n###\
  \ 尝试使用管理界面\n\n随着你继续推进 Rango 的开发，你将大量使用管理界面来验证数据是否存储正确。请尝试使用它，了解它的运作方式。这个界面不言自明，容易理解。\n\
  \n删除之前创建的 Test 类别。我们很快会用示例数据填充数据库。你可以从管理界面删除 Test 类别：点击它旁边的复选框，然后从页面顶部的下拉菜单中选择 Delete\
  \ selected categorys。最后点击出现的红色大按钮来确认你的操作！\n\n### 用户管理\n\nDjango 管理界面也是你进行用户管理的首选之地，通过“认证和授权”部分即可实现。在这里，你可以创建、修改和删除用户账户，并调整权限级别。稍后会有更多介绍。\n\
  \n### 复数与单数拼写\n\n注意管理界面中的拼写错误（Categorys，而不是 Categories）。这个拼写错误可以通过在模型定义中添加一个带有 `verbose_name_plural`\
  \ 属性的嵌套 Meta 类来修复。下面是一个修改后的 Category 模型示例，更多关于 Meta 类中可以存储什么的信息，请参阅 [Django 官方模型文档](https://docs.djangoproject.com/en/2.1/topics/db/models/#meta-options)。\n\
  \n```python\nclass Category(models.Model):\n    name = models.CharField(max_length=128,\
  \ unique=True)\n\n    class Meta:\n        verbose_name_plural = 'Categories'\n\n\
  \    def __str__(self):\n        return self.name\n```\n\n### 扩展 `admin.py`\n\n\
  需要说明的是，Rango 应用中的示例 `admin.py` 模块是目前最简单、最实用的示例。但是，你可以通过多种方式自定义管理界面。如果你感兴趣，可以查看 [官方\
  \ Django 管理界面文档](https://docs.djangoproject.com/en/2.1/ref/contrib/admin/) 了解更多信息。在教程的后续部分，我们将探讨如何操作\
  \ admin.py 模块。\n\n## 5.7 创建填充脚本\n\n手动向数据库输入测试数据很麻烦。许多开发者会通过随机敲击键盘来添加一些虚假的测试数据，比如\
  \ wTFzmN00bz7。与其这样做，不如编写一个脚本来自动用**真实且可信的数据**填充数据库。这是因为当你演示或测试应用时，你需要在数据库中看到一些可信的示例。如果你在团队中工作，自动化脚本意味着每个协作者都可以直接在他们的电脑上运行该脚本，使用与你相同的示例数据初始化数据库。因此，创建一个我们称之为*填充脚本*的东西是一个好习惯。\n\
  \n要创建填充脚本，请新建一个名为 `populate_rango.py` 的文件。将该文件放在 `<workspace>/tango_with_django_project/`\
  \ 中，也就是你的 Django 项目的根目录下。创建文件后，添加以下代码。\n\n```python\nimport os\nos.environ.setdefault('DJANGO_SETTINGS_MODULE',\n\
  \    'tango_with_django_project.settings')\n\nimport django\ndjango.setup()\nfrom\
  \ rango.models import Category, Page\n\ndef populate():\n    # First, we will create\
  \ lists of dictionaries containing the pages\n    # we want to add into each category.\n\
  \    # Then we will create a dictionary of dictionaries for our categories.\n  \
  \  # This might seem a little bit confusing, but it allows us to iterate\n    #\
  \ through each data structure, and add the data to our models.\n\n    python_pages\
  \ = [\n        {'title': 'Official Python Tutorial',\n        'url':'http://docs.python.org/3/tutorial/'},\n\
  \        {'title':'How to Think like a Computer Scientist',\n        'url':'http://www.greenteapress.com/thinkpython/'},\n\
  \        {'title':'Learn Python in 10 Minutes',\n        'url':'http://www.korokithakis.net/tutorials/python/'}\
  \ ]\n\n    django_pages = [\n\n```\n\n\n\n```python\n{'title': 'Official Django\
  \ Tutorial',\n 'url': 'https://docs.djangoproject.com/en/2.1/intro/tutorial01/'},\n\
  {'title': 'Django Rocks',\n 'url': 'http://www.djangorocks.com/'},\n{'title': 'How\
  \ to Tango with Django',\n 'url': 'http://www.tangowithdjango.com'} ]\n\nother_pages\
  \ = [\n    {'title': 'Bottle',\n     'url': 'http://bottlepy.org/docs/dev/'},\n\
  \    {'title': 'Flask',\n     'url': 'http://flask.pocoo.org'} ]\n\ncats = {'Python':\
  \ {'pages': python_pages},\n        'Django': {'pages': django_pages},\n       \
  \ 'Other Frameworks': {'pages': other_pages} }\n\n# If you want to add more categories\
  \ or pages,\n# add them to the dictionaries above.\n\n# The code below goes through\
  \ the cats dictionary, then adds each category,\n# and then adds all the associated\
  \ pages for that category.\nfor cat, cat_data in cats.items():\n    c = add_cat(cat)\n\
  \    for p in cat_data['pages']:\n        add_page(c, p['title'], p['url'])\n\n\
  # Print out the categories we have added.\nfor c in Category.objects.all():\n  \
  \  for p in Page.objects.filter(category=c):\n        print(f'- {c}: {p}')\n\ndef\
  \ add_page(cat, title, url, views=0):\n    p = Page.objects.get_or_create(category=cat,\
  \ title=title)[0]\n    p.url=url\n    p.views=views\n    p.save()\n    return p\n\
  \ndef add_cat(name):\n    c = Category.objects.get_or_create(name=name)[0]\n   \
  \ c.save()\n    return c\n```\n\n```python\n# Start execution here!\nif __name__\
  \ == '__main__':\n    print('Starting Rango population script...')\n    populate()\n\
  ```\n\n## 理解这段代码！\n\n**再次强调，不要简单地复制、粘贴然后就不管了。** 把代码添加到你的新模块中，然后逐行阅读，弄清楚每行代码在做什么。这将有助于你的理解！\n\
  \n我们在下面提供了解释，帮助你从我们的代码中学习！\n\n你还应该注意代码旁边的行号。我们加上行号是为了让复制粘贴变成一件麻烦事——为什么不自己动手敲一遍，同时思考每一行代码呢？\n\
  \n虽然这段代码看起来很多，但本质上只是对两个小函数 `add_page()` 和 `add_cat()` 的一系列调用，这两个函数都定义在模块末尾。通读代码，我们会发现执行是从模块的*底部*开始的——请看第\
  \ 71 和 72 行。这是因为在此之上，我们定义了一些函数；除非我们调用它们，否则这些函数不会被执行。当解释器执行到 `if __name__ == '__main__'`\
  \ 时，我们调用 `populate()` 函数并开始执行它。\n\n## `__name__ == '__main__'` 代表什么？\n\n`__name__\
  \ == '__main__'` 这个技巧非常有用，它可以让一个 Python 模块既可以作为可复用模块，也可以作为独立的 Python 脚本使用。可复用模块是指可以被其他模块导入的模块（例如通过\
  \ `import` 语句），而独立 Python 脚本则是通过在终端/命令提示符中输入 `python module.py` 来执行的。\n\n因此，只有当模块作为独立的\
  \ Python 脚本运行时，`if __name__ == '__main__'` 条件语句中的代码才会被执行。导入该模块时不会运行这些代码；但其中定义的任何类或函数对你来说都是完全可用的。\n\
  \n## 导入模型\n\n在导入 Django 模型时，请确保你已经导入了项目的设置：导入 `django` 并设置环境变量 `DJANGO_SETTINGS_MODULE`\
  \ 为你的项目设置文件，如上文第 1 到 6 行所示。然后调用 `django.setup()` 来导入你的 Django 项目设置。\n\n如果你不执行这一关键步骤，**在尝试导入模型时将会出现异常。这是因为必要的\
  \ Django 基础设施尚未初始化。** 这就是为什么我们在第 7 行加载设置*之后*才导入 `Category` 和 `Page`。\n\n第 47-50\
  \ 行的 `for` 循环负责反复调用 `add_cat()` 和 `add_page()` 函数。这些函数又负责创建新的分类和页面。`populate()`\
  \ 会跟踪所创建的分类。例如，新分类的引用存储在局部变量 `c` 中——请查看上文第 48 行。之所以要存储它，是因为 `Page` 需要一个 `Category`\
  \ 引用。在 `populate()` 中调用 `add_cat()` 和 `add_page()` 之后，函数最后会遍历所有新建的 `Category` 及其关联的\
  \ `Page` 对象，并在终端上显示它们的名称。\n\n```text\n$ python populate_rango.py\n\nStarting Rango\
  \ population script...\n- Python: Official Python Tutorial\n- Python: How to Think\
  \ Like a Computer Scientist\n- Python: Learn Python in 10 Minutes\n- Django: Official\
  \ Django Tutorial\n- Django: Django Rocks\n- Django: How to Tango with Django\n\
  - Other Frameworks: Bottle\n- Other Frameworks: Flask\n```\n\n接下来，验证填充脚本是否按预期工作并填充了数据库。为此，请重启\
  \ Django 开发服务器，然后导航到管理界面（`http://127.0.0.1:8000/admin/`）。到达那里后，检查你是否看到一些新的分类和页面。如果你点击\
  \ Pages，是否能看到所有页面，如下图所示？\n\n![](img/75169a27287f7c945bf2cbf7dede5251_92_0.png)\n\
  \n**Django 管理界面，显示了通过新的填充脚本填充的 Page 模型。成功了！**\n\n虽然编写填充脚本最初可能会花费一些时间，但从长远来看，它会为你节省大量时间。当你在其他地方部署应用时，完成所有设置后运行填充脚本，意味着你可以立即开始演示应用。在你对代码进行单元测试时，它也会非常方便。\n\
  \n## 5.8 工作流：模型设置\n\n既然我们已经介绍了处理 Django ORM 的核心原则，那么现在是总结所有设置过程的好时机。我们将核心任务分成了几个独立的部分。当你需要快速回顾不同步骤时，请查看本节。\n\
  \n### 设置数据库\n\n对于一个新的 Django 项目，你应该首先告诉 Django 你打算使用的数据库（即在 `settings.py` 中配置 `DATABASES`）。你还可以在应用的\
  \ `admin.py` 模块中注册任何模型，以便通过基于 Web 的管理界面访问它们。\n\n### 添加模型\n\n添加模型的工作流可以分为五个步骤。\n\n\
  - 1. 首先，在你的 Django 应用的 `models.py` 文件中创建新模型。\n- 2. 如果你希望新模型可以在管理界面中访问，请更新 `admin.py`\
  \ 以包含并注册它们。\n- 3. 执行迁移 `$ python manage.py makemigrations <app_name>`。\n- 4. 应用更改\
  \ `$ python manage.py migrate`。这将在数据库中为新模型创建必要的基础设施（表）。\n- 5. 为新模型创建/编辑填充脚本。\n\n\
  有时候你不得不删除数据库。有时重新开始会更容易。也许当你想进行更多迁移时，可能会陷入循环，导致出现问题。\n\n当你需要刷新数据库时，可以按照以下步骤操作。请注意，在本教程中，你使用的是\
  \ SQLite 数据库——Django 确实支持[其他各种数据库引擎](https://docs.djangoproject.com/en/2.1/ref/databases/)。\n\
  \n- 1. 如果服务器正在运行，请停止你的 Django 开发服务器。\n- 2. 对于 SQLite 数据库，请删除 Django 项目目录中的 `db.sqlite3`\
  \ 文件。它与 `manage.py` 文件位于同一目录中。\n- 3. 如果你更改了应用的模型，你需要运行 `$ python manage.py makemigrations\
  \ <app_name>` 命令，将 `<app_name>` 替换为你的 Django 应用的名称（例如 rango）。如果你的模型没有更改，请跳过此步骤。\n\
  - 4. 运行 `$ python manage.py migrate` 命令，以创建新的数据库文件（如果你使用的是 SQLite），并将数据库表迁移到数据库中。\n\
  - 5. 使用 `$ python manage.py createsuperuser` 命令创建新的管理员账户。\n- 6. 最后，再次运行填充脚本，将可信的测试数据插入到新数据库中。\n\
  \n\n\n\n\n![](img/75169a27287f7c945bf2cbf7dede5251_96_0.png)\n\n更新后的管理界面 Page 视图，包含类别和\
  \ URL 列。\n\n### 练习提示\n\n如果你需要一些帮助或灵感来完成这些练习，这里有一些提示。\n\n- 修改 `Category` 模型，添加两个\

- "# 7. 表单\n\n作为 Rango 应用的一部分，我们需要从用户那里获取新的分类和新的页面。在本章中，我们将介绍如何通过 Web 表单捕获数据。Django\
  \ 自带一些出色的表单处理功能，使得从用户那里收集信息并通过模型保存到数据库变得相当直接。根据 Django 关于表单¹的文档，表单处理功能允许你：\n\n-\
  \ 1. 显示一个带有自动生成的*表单组件*的 HTML 表单（例如文本字段或日期选择器）；\n- 2. 根据一组验证规则检查提交的数据；\n- 3. 在验证错误时重新显示表单；以及\n\
  - 4. 将提交的表单数据转换为相应的 Python 数据类型。\n\n使用 Django 表单功能的一大优势是它可以为你节省大量创建 HTML 表单的时间和麻烦。\n\
  \n## 7.1 基本工作流程\n\n创建表单和处理用户输入所涉及的基本步骤如下。\n\n- 1. 如果你还没有创建，就在你的 Django 应用目录（`rango`）中创建一个\
  \ `forms.py` 模块，用于存放与表单相关的类。\n- 2. 为你希望表示为表单的每个模型创建一个 `ModelForm` 类。\n- 3. 根据需要自定义表单。\n\
  - 4. 创建或更新一个视图来处理表单……\n  - 包括*显示*表单，\n  - *保存*表单数据，以及\n  - *标记错误*，这些错误可能在用户在表单中输入不正确的数据（或根本没有输入数据）时发生。\n\
  - 5. 创建或更新一个模板来显示表单。\n- 6. 添加一个 `urlpattern` 映射到新视图（如果你创建了一个新视图）。\n\n这个工作流程比我们之前看到的要复杂一些，我们必须构造的视图也要复杂得多。然而，一旦你多次执行这个过程，你就会更清楚地理解各个部分是如何组合在一起的。相信我们。\n\
  \n## 7.2 页面与分类表单\n\n在这里，我们将实现必要的基础设施，允许用户通过表单向数据库添加分类和页面。\n\n首先，在 `rango` 应用目录中创建一个名为\
  \ `forms.py` 的文件。虽然这一步不是必须的（你可以把表单放在 `models.py` 中），但这会让你的代码库更整洁、更容易处理。\n\n### 创建\
  \ ModelForm 类\n\n在 Rango 的 `forms.py` 模块中，我们将创建几个继承自 Django 的 `ModelForm` 的类。本质上，`ModelForm`\
  \ 是一个*辅助*类，它允许你根据已有的模型创建 Django 表单。既然我们已经为 Rango 定义了两个模型（`Category` 和 `Page`），我们将为这两个模型创建\
  \ ModelForms。\n\n在 `rango/forms.py` 中添加以下代码。\n\n```python\nfrom django import forms\n\
  from rango.models import Page, Category\n\nclass CategoryForm(forms.ModelForm):\n\
  \    name = forms.CharField(max_length=128,\n                           help_text=\"\
  Please enter the category name.\")\n    views = forms.IntegerField(widget=forms.HiddenInput(),\
  \ initial=0)\n    likes = forms.IntegerField(widget=forms.HiddenInput(), initial=0)\n\
  \    slug = forms.CharField(widget=forms.HiddenInput(), required=False)\n\n    #\
  \ An inline class to provide additional information on the form.\n    class Meta:\n\
  \        # Provide an association between the ModelForm and a model\n        model\
  \ = Category\n        fields = ('name',)\n\nclass PageForm(forms.ModelForm):\n \
  \   title = forms.CharField(max_length=128,\n                            help_text=\"\
  Please enter the title of the page.\")\n    url = forms.URLField(max_length=200,\n\
  \                         help_text=\"Please enter the URL of the page.\")\n   \
  \ views = forms.IntegerField(widget=forms.HiddenInput(), initial=0)\n\n    class\
  \ Meta:\n        # Provide an association between the ModelForm and a model\n  \
  \      model = Page\n\n        # What fields do we want to include in our form?\n\
  \        # This way we don't need every field in the model present.\n        # Some\
  \ fields may allow NULL values; we may not want to include them.\n        # Here,\
  \ we are hiding the foreign key.\n        # we can either exclude the category field\
  \ from the form,\n        exclude = ('category',)\n        # or specify the fields\
  \ to include (don't include the category field).\n        #fields = ('title', 'url',\
  \ 'views')\n```\n\n我们需要通过 `fields` 指定表单中包含哪些字段，或通过 `exclude` 指定要排除哪些字段。\n\nDjango\
  \ 为我们提供了几种自定义表单的方式，这些表单是代表我们创建的。在上面的代码示例中，我们指定了希望用于显示每个字段的组件。例如，在 PageForm 类中，我们为\
  \ `title` 字段定义了 `forms.CharField`，为 `url` 字段定义了 `forms.URLField`。这两个字段都为用户提供文本输入。注意我们提供给字段的\
  \ `max_length` 参数——我们指定的长度与我们在底层数据模型中为每个字段指定的最大长度相同。回到模型章节自己检查一下，或者查看 Rango 的 `models.py`\
  \ 模块。\n\n你还会注意到，在每个表单中，我们为 views 和 likes 字段包含了几个 `IntegerField` 条目。注意，我们通过参数设置 `widget=forms.HiddenInput()`\
  \ 将组件设置为隐藏，然后通过 `initial=0` 将值设置为零。这是默认将字段设为零的一种方法。由于这些字段是隐藏的，用户将无法为这些字段输入值。\n\n\
  然而，即使我们在 `PageForm` 中有一个 `hidden` 字段，我们仍然需要在表单中包含该字段。如果在 `fields` 中排除了 `views`，那么表单将不包含该字段（尽管它被指定了）。这意味着表单不会为该字段返回零值。这可能会引发错误，具体取决于模型是如何设置的。如果在模型中我们为这些字段指定了\
  \ `default=0`，那么我们可以依赖模型自动用默认值填充该字段——从而避免 `not null` 错误。在这种情况下，就不需要这些隐藏字段了。我们还在\
  \ `CategoryForm` 中包含了 `slug` 字段，并将其设置为使用 `widget=forms.HiddenInput()`。\n\n然而，我们没有指定初始值或默认值，而是声明该字段不是表单必填的。这是因为当表单最终保存时，我们的模型将负责填充该字段。本质上，在定义模型和表单时，你需要小心，确保表单将包含并传递所有必需的数据，以便正确填充模型。\n\
  \n除了 `CharField` 和 `IntegerField` 组件之外，还有更多组件可供使用。例如，Django 提供了 `EmailField`（用于输入电子邮件地址）、`ChoiceField`（用于单选输入按钮）和\
  \ `DateField`（用于日期/时间输入）。还有许多其他字段类型可供使用，它们会为你执行错误检查（例如，*提供的值是否是有效的整数？*）。\n\n也许继承自\
  \ `ModelForm` 的类最重要的方面是需要定义*我们想为哪个模型提供表单*：我们通过\n\n```python\n# just print them to\
  \ the terminal.\nprint(form.errors)\n\n# Will handle the bad form, new form, or\
  \ no form supplied cases.\n# Render the form with error messages (if any).\nreturn\
  \ render(request, 'rango/add_category.html', {'form': form})\n```\n\n你还需要在模块顶部添加以下两条导入语句。\n\
  \n```python\nfrom rango.forms import CategoryForm\nfrom django.shortcuts import\
  \ redirect\n```\n\n新的 `add_category()` 视图增加了几个处理表单的关键功能。首先，我们创建一个 `CategoryForm()`，然后检查\
  \ HTTP 请求是否为 POST（用户是否通过表单提交了数据？）。随后，我们可以通过同一个 URL 处理该 POST 请求。`add_category()`\
  \ 视图函数可以处理三种不同的场景：\n\n- 显示一个用于添加类别的新空白表单；\n- 将用户提供的表单数据保存到关联模型，并重定向到 Rango 首页；以及\n\
  - 如果有错误，则重新显示带有错误消息的表单。\n\n## GET 与 POST\n\n我们所说的 GET 和 POST 是什么意思？它们是 HTTP 请求。\n\
  \n- HTTP GET 用于请求指定资源的表示。换句话说，我们使用 HTTP GET 来获取特定资源，无论是网页、图像还是其他文件。\n- 相比之下，HTTP\
  \ POST 会从客户端浏览器提交数据以进行处理。例如，在提交 HTML 表单内容时，就会使用这种类型的请求。\n- 最终，HTTP POST 可能被编程为在服务器上创建新资源（例如新的数据库条目）。之后可以通过\
  \ HTTP GET 请求访问该资源。\n- 有关更多细节，请查看 w3schools 上关于 GET 与 POST 的页面⁴。\n\nDjango 的表单处理机制会通过\
  \ HTTP POST 请求处理来自用户浏览器返回的数据。它不仅能将表单数据保存到所选模型，还会自动为每个表单字段生成错误消息（如果需要）。这意味着 Django\
  \ 不会存储任何缺少信息的已提交表单，因为这些缺失信息可能会对你的数据库的[参照完整性](https://en.wikipedia.org/wiki/Referential_integrity)造成问题。例如，如果类别名称字段中没有提供值，就会返回错误，因为该字段不能为空白。\n\
  \n从 `render()` 调用中，你会看到我们引用了 `add_category.html` —— 一个新模板（我们将在下面定义它！）。该模板将包含表单和页面的相关\
  \ Django 模板代码及 HTML。\n\n## 创建 *添加类别* 模板\n\n创建文件 `templates/rango/add_category.html`。在该文件中，添加以下\
  \ HTML 标记和 Django 模板代码。\n\n```html\n<!DOCTYPE html>\n<html>\n    <head>\n      \
  \  <title>Rango</title>\n    </head>\n\n    <body>\n        <h1>Add a Category</h1>\n\
  \        <div>\n            <form id=\"category_form\" method=\"post\" action=\"\
  /rango/add_category/\">\n                {% csrf_token %}\n                {% for\
  \ hidden in form.hidden_fields %}\n                    {{ hidden }}\n          \
  \      {% endfor %}\n                {% for field in form.visible_fields %}\n  \
  \                  {{ field.errors }}\n                    {{ field.help_text }}\n\
  \                    {{ field }}\n                {% endfor %}\n               \
  \ <input type=\"submit\" name=\"submit\" value=\"Create Category\" />\n        \
  \    </form>\n        </div>\n    </body>\n</html>\n```\n\n## 跨站请求伪造令牌\n\n你还应该注意代码片段\
  \ `{% csrf_token %}`。这是一个*跨站请求伪造（CSRF）令牌*，有助于保护后续提交表单时发起的 HTTP POST 请求的安全。*Django\
  \ 框架要求必须存在 CSRF 令牌。如果你忘记在表单中包含 CSRF 令牌，用户在提交表单时可能会遇到错误。* 有关此内容的更多信息，请查看 Django 官方文档中关于\
  \ CSRF 令牌的说明⁶。\n\n## 映射 *添加类别* 视图\n\n现在我们需要将 `add_category()` 视图映射到 URL。在模板中，我们在表单的\
  \ action 属性中使用了 URL `/rango/add_category/`。现在我们需要创建从 URL 到视图的映射。在 `rango/urls.py`\
  \ 中，修改 `urlpatterns` 列表，使其看起来如下所示。\n\n```python\nurlpatterns = [\n    path('', views.index,\
  \ name='index'),\n    path('about/', views.about, name='about'),\n    path('category/<slug:category_name_slug>/',\
  \ views.show_category,\n        name='show_category'),\n    path('add_category/',\
  \ views.add_category, name='add_category'),\n]\n```\n\n在这种情况下，顺序并不一定重要。不过，有关更多信息，请查看\
  \ Django 官方文档中关于 Django 如何处理请求的说明⁷。添加类别的 URL 是 `/rango/add_category/`，名称为 `add_category`。\n\
  \n## 修改首页视图\n\n最后一步，我们可以在首页上放置一个链接，以便用户可以轻松导航到允许他们添加类别的页面。编辑模板 `rango/index.html`，并在包含关于链接的\
  \ `<div>` 元素中添加以下 HTML 超链接。\n\n```html\n<a href=\"/rango/add_category/\">Add a New\
  \ Category</a><br />\n```\n\n## 演示\n\n现在让我们试试吧！启动或重新启动你的 Django 开发服务器，然后将你的 Web\
  \ 浏览器指向 `http://127.0.0.1:8000/rango/` 的 Rango。使用你的新链接跳转到“添加类别”页面，并尝试添加一个类别。下面的[图](#)显示了*添加类别*和*首页*页面的截图。在截图中，我们添加了名为*Assembly*的类别。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_130_0.png)\n\n*使用我们的新表单向 Rango 添加新类别。*\n\
  \n## 类别缺失？\n\n如果你尝试这个新功能并添加了几个不同的类别，请记住它们并不总是出现在首页上。这是因为我们编写的首页视图只显示收到的点赞数最多的*前五个类别*。如果你登录管理界面，你应该能够查看所有已输入的类别。\n\
  \n为了确认类别已成功添加，你可以更新 `rango/views.py` 中的 `add_category()` 方法，并将 `form.save(commit=True)`\
  \ 这一行改为 `cat = form.save(commit=True)`。这将为你提供对所创建的 Category 对象实例的引用。然后你可以打印该类别（例如\
  \ `print(cat, cat.slug)`）。\n\n## 更简洁的表单\n\n回想一下，我们的 Page 模型有一个 url 属性，设置为 URLField\
  \ 类型的实例。在相应的 HTML 表单中，Django 会合理地期望输入到 url 字段中的任何文本都是格式正确的完整 URL。然而，用户可能会觉得输入类似\
  \ `http://www.url.com` 的内容很麻烦——事实上，用户甚至可能不知道正确 URL 的形式⁸！\n\n### URL 检查\n\n现在大多数现代浏览器都会为你检查\
  \ URL 格式是否正确，因此这个示例只适用于较旧的浏览器。然而，它确实向你展示了如何在尝试将数据保存到数据库之前清理数据。如果你没有旧浏览器来尝试这个示例（以防你不相信），试着将\
  \ URLField 改为 CharField。渲染后的 HTML 将不会指示浏览器替你执行检查，你实现的代码将会被执行。\n\n在用户输入可能不完全正确的场景中，我们可以*覆盖*\
  \ `ModelForm` 中实现的 `clean()` 方法。该方法在将表单数据保存到新模型实例之前被调用，因此为我们提供了一个合理的位置来插入代码，以验证甚至修复用户输入的任何表单数据。我们可以检查用户输入的\
  \ url 字段值是否以 http:// 开头——如果不是，我们可以在用户输入前添加 http://。\n\n```python\nclass PageForm(forms.ModelForm):\n\
  \    ...\n    def clean(self):\n        cleaned_data = self.cleaned_data\n     \
  \   url = cleaned_data.get('url')\n\n        # If url is not empty and doesn't start\
  \ with 'http://',\n        # then prepend 'http://'.\n        if url and not url.startswith('http://'):\n\
  \            url = f'http://{url}'\n            cleaned_data['url'] = url\n\n  \
  \      return cleaned_data\n```\n\n在 `clean()` 方法中，你可以看到一个简单的模式，你可以在自己的 Django 表单处理代码中复制这个模式。\n\
  \n1. 从 ModelForm 的字典属性 `cleaned_data` 中获取表单数据。\n2. 然后可以从 `cleaned_data` 字典中取出你想要检查的表单字段。使用字典对象提供的\
  \ `.get()` 方法获取表单的值。如果用户没有在表单字段中输入值，则其条目不会存在于 `cleaned_data` 字典中。在这种情况下，`.get()`\
  \ 会返回 `None`，而不是引发 `KeyError` 异常。这会让你的代码看起来更简洁！\n3. 对于你想要处理的每个表单字段，检查是否取到了值。如果输入了内容，检查该值是什么。如果它不是你所期望的，你可以在\
  \ `cleaned_data` 字典中重新赋值之前，添加一些逻辑来修复这个问题。\n4. 你必须在 `clean()` 方法结束时返回 `cleaned_data`\
  \ 字典的引用。否则，更改将不会生效。\n\n这个简单的例子展示了我们如何在数据通过表单传递并在存储之前进行清理。这非常方便，尤其是在特定字段\n\n⁶ https://docs.djangoproject.com/en/2.1/ref/csrf/\n\
  ⁷ https://docs.djangoproject.com/en/2.1/topics/http/urls/#how-django-processes-a-request\n\
  ⁸ https://support.google.com/webmasters/answer/76329?hl=en\n\n\n\n\n## 练习\n\n读完本章后，思考以下问题，以及你如何解决它们。\n\
  \n- 如果在添加分类表单中没有输入分类名称，会发生什么？\n- 当你尝试添加一个已经存在的分类时，会发生什么？\n- 在上面我们实现`ModelForm`类的部分，我们重复了之前在模型章节中定义的字段的`max_length`值。这是不好的实践，因为我们在*重复自己*！你如何重构代码，使你不会*不*重复相同的`max_length`值？\n\
  - 如果你还没有完成官方Django教程¹⁰的第四部分，请完成它以巩固你在这里学到的内容。\n- 现在，实现功能，让用户向每个分类添加页面。有关说明（和提示！）请参见下文。\n\
  \n## 创建*添加页面*视图、模板和URL映射\n\n下一个合乎逻辑的步骤是允许用户向给定分类添加页面。为此，重复上述相同的工作流程，但针对的是添加页面。\n\
  \n- 创建一个新视图 `add_page()`。\n- 创建一个新模板 `rango/add_page.html`。\n- 在 `/rango/category/<category_name_slug>/add_page/`\
  \ 与新视图之间创建映射。\n- 更新分类页面/视图，从分类添加页面功能提供一个链接。\n\n为了让你上手，这里是 `add_page()` 视图函数的代码。\n\
  \n¹⁰ https://docs.djangoproject.com/en/2.1/intro/tutorial04/\n\n```python\nfrom\
  \ rango.forms import PageForm\n\ndef add_page(request, category_name_slug):\n  \
  \  try:\n        category = Category.objects.get(slug=category_name_slug)\n    except\
  \ Category.DoesNotExist:\n        category = None\n\n    # You cannot add a page\
  \ to a Category that does not exist...\n    if category is None:\n        return\
  \ redirect('/rango/')\n\n    form = PageForm()\n\n    if request.method == 'POST':\n\
  \        form = PageForm(request.POST)\n\n        if form.is_valid():\n        \
  \    if category:\n                page = form.save(commit=False)\n            \
  \    page.category = category\n                page.views = 0\n                page.save()\n\
  \n                return redirect(reverse('rango:show_category',\n             \
  \                           kwargs={'category_name_slug':\n                    \
  \                            category_name_slug}))\n        else:\n            print(form.errors)\n\
  \n    context_dict = {'form': form, 'category': category}\n    return render(request,\
  \ 'rango/add_page.html', context=context_dict)\n```\n\n注意，在上面的例子中，页面创建后我们需要将用户重定向到\
  \ `show_category()` 视图。这涉及到使用 `redirect()` 和 `reverse()` 辅助函数，分别用于重定向用户和查找适当的URL。因此，在Rango的\
  \ `views.py` 模块顶部需要以下导入才能让此代码工作——但你应该已经有 `redirect` 了。\n\n```python\nfrom django.shortcuts\
  \ import redirect\nfrom django.urls import reverse\n```\n\n这里调用了 `redirect()` 函数，它又调用了\
  \ `reverse()` 函数。`reverse()` 在你的 `urls.py` 模块中查找URL名称——在此例中为 `rango:show_category`。如果找到与提供的名称匹配的内容，则返回完整的URL。这里增加的复杂性在于\
  \ `show_category()` 视图接受一个额外的参数 `category_name_slug`。通过将这个值作为kwargs以字典形式提供给 `reverse()`\
  \ 函数，它就拥有了构造完整URL所需的全部信息。这个完整的URL随后被用作 `redirect()` 方法的参数，响应就完成了！\n\n**另请注意，在这个新视图中，当尝试向一个不存在的分类添加新页面时，我们只是将用户重定向回索引页。**\
  \ 这免除了你在模板中实现覆盖此场景的需求。你的模板只需要专注于显示表单。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_136_0.png)\n\
  \n### 更多关于 `reverse()`\n\n这是我们第一次接触 `reverse()` 辅助函数。它是一个极其有用且强大的函数，我们将在本书的[下一章]中广泛使用它，以使我们的视图更易于维护。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_138_0.png)\n\n### 测试你的实现\n\n我们已经实现了一系列单元测试，让你可以在此刻检查你的实现。按照我们之前提供的指南，使用测试模块\
  \ `tests_chapter7.py`。你的实现与我们的测试相比如何？请记住，你的实现应该完全完成上面列出的练习，测试才能通过。\n"
- "# 8. 使用模板\n\n到目前为止，我们已经为Rango应用中的不同页面创建了几个HTML模板。当你创建每个额外的模板时，你可能会注意到大量的HTML代码是重复的。这感觉有点奇怪，或者有点浪费吗？\n\
  \n确实如此！每当你重复类似的代码时，你就违反了[DRY原则](https://en.wikipedia.org/wiki/Don%27t_repeat_yourself)——该原则指出：**不要重复自己！**\
  \ 你可能已经注意到，在我们目前编写的模板中，我们使用*硬编码*的URL路径来引用不同的页面。这是不好的实践，因为路径终究会随着时间而改变。\n\n综合来看，重复和硬编码将导致维护噩梦。如果我们想对网站的整体结构进行更改或更改URL路径，你将不得不修改*所有*包含我们想更改的结构或URL的模板。如果你的网站只有几个页面，这可能还可以处理。但是，如果你的网站有数百个页面呢？更新所有内容需要多长时间？你有多大的可能在某个地方犯错？\n\
  \n幸运的是，Django开发人员已经考虑了如何解决这类问题并提供了解决方案。在本章中，我们将使用*模板继承*来解决第一个问题，使用*URL模板标签*来解决第二个问题。我们先从解决第二个问题开始。\n\
  \n## 8.1 在模板中使用相对URL\n\n到目前为止，我们一直在模板中直接编写我们想要显示的页面或视图的URL，即 `<a href=\"/rango/about/\"\
  >About</a>`。这种URL硬编码意味着，如果我们更改 `urls.py` 中的URL映射，那么我们也必须更改模板中所有相关的URL引用。首选的方法是使用模板标签\
  \ `url` 来在 `urls.py` 模块中查找*URL映射名称*，并动态插入匹配的URL路径。\n\n在模板中包含相对URL非常简单。要引用*关于*页面，我们将在模板中插入以下行：\n\
  \n```\n<a href=\"{% url 'rango:about' %}\">About</a>\n```\n\nDjango模板引擎会在任何 `urls.py`\
  \ 模块中查找具有 `name` 属性设置为 `about`（`name='about'`）且 `app_name` 设置为 `rango` 的URL模式，然后对URL执行反向查找。这意味着如果我们更改\
  \ `urls.py` 中的URL映射，就不必逐个检查引用它们的模板。\n\n也可以直接引用视图，来引用没有指定名称的URL模式，如下所示。\n\n```\n\
  <a href=\"{% url 'rango.views.about' %}\">About</a>\n```\n\n在这个例子中，我们必须确保应用 `rango`\
  \ 在 `views.py` 模块中包含视图 `about`。在你的应用的 `index.html` 模板中，你会注意到有一个参数化的URL模式（`show_category()`\
  \ URL/视图将 `category.slug` 作为参数）。要处理此情况，你可以在模板中向 `url` 模板标签传递URL/视图的名称以及slug，如下所示：\n\
  \n```\n{% for category in categories %}\n    <li>\n        <a href=\"{% url 'rango:show_category'\
  \ category.slug %}\">\n            {{ category.name }}\n        </a>\n    </li>\n\
  {% endfor %}\n```\n\n在你匆匆去用相对URL更新所有模板中的所有URL之前，我们需要通过使用继承来重构我们的模板，以去除过多的重复。\n\n\
  \n\n\n\n## 8.1 URLs 和多个 Django 应用\n\n本书重点介绍单个 Django 应用 Rango 的开发。然而，你可能会发现自己正在处理一个使用多个应用同时工作的\
  \ Django 项目。这意味着你可能 literally 有数百个潜在的 URL 需要引用。这个场景引出了一个问题：*我们如何组织这些 URL？* 两个应用可能有同名的视图，从而存在潜在冲突。\n\
  \nDjango 提供了为项目中使用的每个单独应用 *命名空间* URL 配置模块² 的能力。**正如我们之前所做的那样**，在应用的 `urls.py` 模块中添加一个\
  \ `app_name` 变量就足够了。下面示例将 Rango 应用的命名空间指定为 `rango`。\n\n```python\nfrom django.urls\
  \ import path\nfrom rango import views\n\napp_name = 'rango'\n\nurlpatterns = [\n\
  \    path('', views.index, name='index'),\n    path('about/', views.about, name='about'),\n\
  \    path('category/<slug:category_name_slug>/add_page/', views.add_page, name='add_page'),\n\
  \    ...\n]\n```\n\n添加 `app_name` 变量意味着你从 `rango` 应用引用的任何 URL 都是这样完成的：\n\n```html\n\
  <a href=\"{% url 'rango:about' %}\">About</a>\n```\n\n其中 `url` 命令中的冒号将命名空间与实际的 URL\
  \ 名称分隔开。\n\n如果未指定 `app_name`，你将不得不仅使用映射名称来引用 URL，如下例所示。\n\n```html\n<a href=\"{%\
  \ url 'about' %}\">About</a>\n```\n\n当然，正如我们上面所讨论的，这种方法会打开潜在冲突的大门。如果有疑问，指定 `app_name`\
  \ 是一个良好的实践！\n\n## 8.2 处理重复\n\n虽然你使用的几乎每个专业制作的网站都会有一系列重复的组件（例如页面头部、侧边栏和页脚），但为每个重复组件重复\
  \ HTML 并不是一个特别明智的处理方式。如果想更改网站头部的某个部分？你需要遍历每个页面并更改每个头部副本以满足需求。\n\n与其花费（或浪费！）大量时间复制粘贴\
  \ HTML 标记，我们可以通过使用 Django 模板语言提供的模板继承来最小化 Rango 代码库中的重复。\n\n使用继承在模板中的基本方法如下。\n\n\
  1. 识别每个页面中在整个应用中重复出现的部分（即头部栏、侧边栏、页脚、内容窗格）。有时，在纸上绘制不同页面的基本结构可以帮助你发现哪些组件是共用的。\n2.\
  \ 在基础模板中，提供基本页面的骨架结构，以及任何通用内容（即页脚中的版权声明、部分中出现的标志和标题）。然后定义几个块，这些块会根据用户查看的页面而有所变化。\n\
  3. 为应用的页面创建特定的模板——所有这些都继承自基础模板——并指定每个块的内容。\n\n### 重复的 HTML 和基础模板\n\n鉴于我们到目前为止创建的模板，应该很明显我们重复了相当多的\
  \ HTML 代码。下面，我们抽象掉了任何页面特定的细节，以显示我们在每个模板中重复的骨架结构。\n\n```html\n<!DOCTYPE html>\n{%\
  \ load staticfiles %}\n\n<html>\n  <head lang=\"en\">\n    <meta charset=\"UTF-8\"\
  \ />\n    <title>Rango</title>\n  </head>\n  <body>\n    <!-- Page specific content\
  \ goes here -->\n  </body>\n</html>\n```\n\n暂时，让我们把这个简单的 HTML 页面作为应用的基础模板。保存此标记到\
  \ Rango 的 `base.html` 模板中。\n\n### DOCTYPE 放在最前面！\n\n请记住，`<!DOCTYPE html>` 声明**始终需要放在模板的第一行**。如果在第一行没有文档类型声明³，则从模板生成的页面可能不符合\
  \ W3C HTML 指南⁴。\n\n### 模板块\n\n现在我们创建了基础模板，我们可以添加模板标签来表示模板中哪些部分可以被继承它的模板覆盖。为此，我们将使用\
  \ `block` 标签。例如，我们可以在 `base.html` 中的基础模板中添加一个 `body_block`，如下所示：\n\n```html\n<!DOCTYPE\
  \ html>\n{% load staticfiles %}\n\n<html>\n    <head lang=\"en\">\n        <meta\
  \ charset=\"UTF-8\" />\n        <title>Rango</title>\n    </head>\n    <body>\n\
  \        {% block body_block %}\n        {% endblock %}\n    </body>\n</html>\n\
  ```\n\n请记住，标准的 Django 模板命令由 {% 和 %} 标签表示。要开始一个块，命令是 `{% block <NAME> %}`，其中 `<NAME>`\
  \ 是你希望创建的块的名称。你还必须确保使用正确的 `{% endblock %}` 命令关闭块，同样包含在 Django 模板标签中。\n\n你还可以为块指定\
  \ *默认内容*，如果没有继承模板定义给定块，则会使用该内容（见[下面](#)）。通过在 `{% block %}` 和 `{% endblock %}` 模板命令之间添加标记来指定默认内容，就像下面的示例一样。\n\
  \n```django\n{% block body_block %}\n    This is body_block's default content.\n\
  {% endblock %}\n```\n\n当我们为每个页面创建模板时，我们将继承 `rango/base.html` 并覆盖 `body_block` 的内容。然而，你可以在模板中放置任意数量的块。例如，你可以为页面标题创建一个块，为页脚创建一个块，为侧边栏创建一个块，等等。块是\
  \ Django 模板系统的非常强大的功能，你可以了解更多关于它们的信息，请查看 [Django 的官方模板文档](https://docs.djangoproject.com/en/2.1/topics/templates/)。\n\
  \n### 提取通用结构\n\n你应该始终努力为基础模板提取尽可能多的重复内容。虽然这样做可能很麻烦，但你在维护上节省的时间将远远超过前期投入的开销。\n\n\
  > *思考很痛苦，但比做大量繁重的工作要好！*\n\n### 进一步抽象\n\n现在你对 Django 模板中的块有了了解，让我们有机会进一步抽象我们的基础模板。重新打开\
  \ `rango/base.html` 模板并将其修改为如下所示。\n\n```html\n<!DOCTYPE html>\n{% load staticfiles\
  \ %}\n\n<html>\n    <head>\n        <title>\n            Rango -\n            {%\
  \ block title_block %}\n                How to Tango with Django!\n            {%\
  \ endblock %}\n        </title>\n    </head>\n    <body>\n        <div>\n      \
  \      {% block body_block %}\n            {% endblock %}\n        </div>\n    \
  \    <hr />\n        <div>\n            <ul>\n                <li><a href=\"{% url\
  \ 'rango:add_category' %}\">Add a New Category</a></li>\n                <li><a\
  \ href=\"{% url 'rango:about' %}\">About</a></li>\n                <li><a href=\"\
  {% url 'rango:index' %}\">Index</a></li>\n            </ul>\n        </div>\n  \
  \  </body>\n</html>\n```\n\n从上面的示例中，我们在基础模板中引入了两个新功能。\n\n- 第一个是名为 `title_block`\
  \ 的模板块。这将允许我们为继承自基础模板的每个页面指定自定义页面标题。如果继承页面未覆盖该块，则 `title_block` 默认为 `How to Tango\
  \ with Django!`， resulting in 完整的标题为 `Rango - How to Tango with Django!`。查看上面模板中\
  \ `<title>` 标签的内容即可了解其工作原理。\n- 我们还将当前 `index.html` 模板中的链接列表——以及指向索引页面的新链接——包含在内，并将其放置在\
  \ `body_block` 块下方的 HTML `<div>` 标签中。这将确保链接存在于继承自基础模板的所有页面中。链接前面有一个 *水平线*（`<hr />`），为用户在\
  \ `body_block` 块的内容和链接之间提供视觉分隔。\n\n## 8.3 模板继承\n\n现在我们创建了一个带有块的基础模板，我们可以更新我们创建的所有模板，使其继承自基础模板。让我们从重构模板\
  \ `rango/category.html` 开始。\n\n你可以通过首先删除所有重复的 HTML 代码，只留下特定于页面的 HTML 和模板标签/命令来实现。然后在模板开头添加以下代码行：\n\
  \n```django\n{% extends 'rango/base.html' %}\n```\n\n`extends` 命令接受一个参数——要扩展/继承的模板（即\
  \ `rango/base.html`）。你提供给 `extends` 命令的参数应相对于项目的 `templates` 目录。例如，我们为 Rango 使用的所有模板都应扩展自\
  \ `rango/base.html`，而不是 `base.html`。\n\n\n\n\n\n然后我们可以进一步修改 `category.html` 模板，使其看起来像下面这个完整示例。\n\
  \n```\n1 {% extends 'rango/base.html' %}\n2 {% load staticfiles %}\n3\n4 {% block\
  \ title_block %}\n5     {% if category %}\n6         {{ category.name }}\n7    \
  \ {% else %}\n8         Unknown Category\n9     {% endif %}\n10 {% endblock %}\n\
  11\n12 {% block body_block %}\n13     {% if category %}\n14 <h1>{{ category.name\
  \ }}</h1>\n15     {% if pages %}\n16 <ul>\n17         {% for page in pages %}\n\
  18             <li><a href=\"{{ page.url }}\">{{ page.title }}</a></li>\n19    \
  \     {% endfor %}\n20 </ul>\n21     {% else %}\n22 <strong>No pages currently in\
  \ category.</strong>\n23     {% endif %}\n24\n25     <a href=\"{% url 'rango:add_page'\
  \ category.slug %}\">Add Page</a> <br />\n26     {% else %}\n27     The specified\
  \ category does not exist.\n28     {% endif %}\n29 {% endblock %}\n```\n\n## 练习\n\
  \n现在你已经完成了本章的第一部分，有几个练习可以帮助你巩固所学的关于 Django 和模板的知识。\n\n- 更新 Rango 应用中所有之前定义的模板，使它们继承新的\
  \ `base.html` 模板。按照我们上面演示的相同过程操作。完成后，你的所有模板都应该继承自 `base.html`。\n- 同时，确保移除 `index.html`\
  \ 模板中的链接。我们不再需要它们了！这是因为我们之前已经将它们移到了 `base.html` 中。你也可以移除 `about.html` 模板中指向 Rango\
  \ 主页的链接。\n- 在重构 `index.html` 和 `about.html` 时，保留从静态文件和媒体服务器提供的图片。\n- 使用 `url` 模板标签更新所有对\
  \ Rango URL 的引用。你也可以在 `views.py` 模块中这么做——查看 [`reverse()` 辅助函数](https://docs.djangoproject.com/en/2.1/ref/urlresolvers/#reverse)。别忘了更新\
  \ `<form>` 元素的 `action` 属性中提供的 URL！\n- 确保你所有的新模板都在 HTML `<title>` 标签中使用了 `{% block\
  \ title_block %}`。记住在 `base.html` 中使用 `'Rango - '`，这样所有标题都会带有 `'Rango - '` 前缀。对于继承模板，请使用以下标题。如果你使用每章末尾的测试，这些更改将很重要。\n\
  \    - 在 `about.html` 中，使用标题 `About Rango`。\n    - 在 `add_category.html` 中，使用标题\
  \ `Add a Category`。\n    - 在 `add_page.html` 中，使用标题 `Add a Page`。\n    - 在 `category.html`\
  \ 中，使用分类的名称——如果提供了不存在的分类，则使用 `Unknown Category`。这里你需要编写一个基本的条件检查（即 `{% if ... %}`）。\n\
  \    - 最后，在 `index.html` 中，使用标题 `Homepage`。\n\n## 提示\n\n- 首先开始重构 `about.html` 模板。\n\
  - 在每个模板中先更新 `title_block`，然后更新 `body_block`。\n- 要检查模板中分类是否存在，记得你可以直接使用条件语句 `{% if\
  \ category %}`——只要 `category` 对象在你的模板上下文中以该名称传递即可！\n- 让开发服务器保持运行，并在修改页面时随时检查。不要等到整个页面都改完了才发现它不工作。增量修改并随时测试这些修改是更安全的做法。\n\
  - 要引用指向分类页面的链接，你可以使用以下模板代码，特别注意 Django 模板 `{% url %}` 命令。\n\n```\n<a href=\"{% url\
  \ 'rango:show_category' category.slug %}\">\n    {{ category.name }}\n</a>\n```\n\
  \n## 8.4 `render()` 方法和 `request` 上下文\n\n在编写视图时，我们使用了一些不同的方法，其中首选方式是 Django 快捷方法\
  \ `render()`。`render()` 方法要求你将 `request` 作为第一个参数传入。`request` 上下文中包含了许多有关会话的信息（例如，包括有关用户的信息）。请参阅\
  \ Django 官方文档中关于 Request 对象的内容[^9]。\n\n通过将 `request` 传递给模板，这意味着你在创建模板时也可以访问这些信息。在下一章中，我们将访问与\
  \ `user` 相关的信息——但现在，请检查你所有的视图，确保它们都是使用 `render()` 方法实现的。否则，你的模板将无法获得我们后续需要的信息。\n\
  \n[^9]: https://docs.djangoproject.com/en/2.1/ref/request-response/#httprequest-objects\n\
  \n### render() 和 Context\n\n作为你必须执行的检查的一个快速示例，看看 `about()` 视图。最初，它是用硬编码的字符串响应实现的，如下所示。注意我们只发送了字符串——我们没有使用作为\
  \ `request` 参数传入的请求。\n\n```\ndef about(request):\n    return HttpResponse('Rango\
  \ says: Here is the about page. <a href=\"/rango/\">Index</a>')\n```\n\n为了使用模板，我们调用\
  \ `render()` 函数并传入 `request` 对象。这将允许模板引擎访问诸如请求类型（例如 GET/POST）以及有关用户状态的信息（请参阅用户认证章节）。\n\
  \n```\ndef about(request):\n    # prints out whether the method is a GET or a POST\n\
  \    print(request.method)\n    # prints out the user name, if no one is logged\
  \ in it prints 'AnonymousUser'\n    print(request.user)\n    return render(request,\
  \ 'rango/about.html', {})\n```\n\n记住，`render()` 的最后一个参数是上下文字典，你可以用它向 Django 模板引擎传递额外的数据。由于我们没有额外的数据要提供给模板，我们传入一个空字典\
  \ `{}`。或者，我们可以完全去掉第三个参数。\n\n## 8.5 自定义模板标签\n\n在每个页面的侧边栏中显示用户可以浏览的不同分类将会很不错。根据我们目前所学到的知识，我们可以这样做：\n\
  \n- 在 `base.html` 模板中，我们可以添加一些代码来显示分类的项目列表；以及\n- 在每个视图中，我们可以访问 `Category` 对象，获取所有分类，并在上下文字典中返回它们。\n\
  \n然而，这是一个相当糟糕的解决方案，因为我们需要在所有视图中包含相同的代码。一个 [DRY](https://en.wikipedia.org/wiki/Don%E2%80%99t_repeat_yourself)（不要重复自己）的解决方案[^10]\
  \ 是创建自定义模板标签，将它们包含在模板中，并让它们可以请求*自己的*数据。\n\n### 使用模板标签\n\n创建一个目录 `<workspace>/tango_with_django_project/rango/templatetags`，并在其中创建两个新模块。一个必须命名为\
  \ `__init__.py`，并且保持空白。将第二个模块命名为 `rango_template_tags.py`。将以下代码添加到 `rango_template_tags.py`\
  \ 中。\n\n```python\nfrom django import template\nfrom rango.models import Category\n\
  \nregister = template.Library()\n\n@register.inclusion_tag('rango/categories.html')\n\
  def get_category_list():\n    return {'categories': Category.objects.all()}\n```\n\
  \n这段代码中有一个名为 `get_category_list()` 的新方法。该方法返回一个包含一个键/值对的字典。`categories` 表示数据库中存在的所有\
  \ `Category` 对象的列表。从上面的 `register.inclusion_tag()` 装饰器中，你会看到引用了 `rango/categories.html`——这是另一个新模板。Django\
  \ 模板引擎使用这个新模板来渲染你在函数返回的字典中提供的分类列表。然后，这个渲染后的列表可以被注入到最初调用模板标签的视图的响应中！\n\n现在是创建新模板\
  \ `categories.html` 的好时机，并添加以下 HTML 标记。请注意这个模板的名称与现有的 `category.html` 模板有相似之处。这是有意设计的，以确保你始终保持警惕！\n\
  \n[^10]: https://en.wikipedia.org/wiki/Don%E2%80%99t_repeat_yourself\n\n\n\n\n```python\n\
  def get_category_list(current_category=None):\n    return {'categories': Category.objects.all(),\n\
  \            'current_category': current_category}\n```\n\n注意 `get_category_list()`\
  \ 的 `current_category` 参数。如果没有传入参数，则使用 `None`（意味着当前没有选中的类别）。\n\n然后我们可以更新 `base.html`\
  \ 模板，它使用自定义模板标签来传入当前类别——但仅当该类别存在时。\n\n```html\n<div>\n    {% block sidebar_block\
  \ %}\n        {% get_category_list category %}\n    {% endblock %}\n</div>\n```\n\
  \n我们现在也可以更新 `categories.html` 模板。这段代码位于现有的 `{% if categories %}` 条件检查内部；它并不会替换整个模板。\n\
  \n```html\n{% for c in categories %}\n    {% if c == current_category %}\n    <li>\n\
  \    <strong>\n        <a href=\"{% url 'rango:show_category' c.slug %}\">{{ c.name\
  \ }}</a>\n    </strong>\n    </li>\n    {% else %}\n    <li>\n        <a href=\"\
  {% url 'rango:show_category' c.slug %}\">{{ c.name }}</a>\n    </li>\n    {% endif\
  \ %}\n{% endfor %}\n```\n\n在模板中，我们检查当前显示的类别是否与 `for` 循环中传入的类别相同（即 `c == current_category`）。如果是，我们就通过使用\
  \ `<strong>` 标签将类别名称以**粗体**突出显示。\n"
- "# 9. 用户认证\n\n大多数 Web 应用都会要求用户注册和登记，以便他们管理自己的账户并访问特殊功能。对于 Rango，我们希望控制不同用户可用的操作。因此，本教程的下一部分旨在让你熟悉\
  \ Django 提供的基本用户认证机制。我们将使用标准 Django 安装中附带的 auth 应用，它位于 `django.contrib.auth` 包中。根据\
  \ Django 关于认证的文档¹，该应用提供了以下概念和功能。\n\n- *用户（User）* 和 *用户模型（User Model）* 的概念。\n- *权限（Permissions）*，一系列二进制标志（如是/否），决定用户可以做什么或不能做什么。\n\
  - *组（Groups）*，一种将权限应用于多个用户的方法。\n- 可配置的 *密码哈希系统（password hashing system）*，是确保数据安全的必备条件。\n\
  - *用于用户登录或限制内容的表单和视图工具（Forms and view tools for logging in users）*。\n\n在用户认证方面，Django\
  \ 可以为你做很多事情。在本章中，我们将介绍一些基础知识，帮助你入门。这将帮助你建立对现有工具及其底层概念的信心。请注意，我们将从第一性原则出发，使用 Django\
  \ 手动设置用户认证，但在后面的章节中，我们将向你展示如何使用一个预先制作的应用来处理注册过程。\n\n## 9.1 设置认证\n\n在开始使用 Django\
  \ 提供的认证功能之前，你需要确保 Rango 项目的 `settings.py` 文件中有相关设置。\n\n在 `settings.py` 文件中找到 `INSTALLED_APPS`\
  \ 列表。找到后，检查其中是否列出了 `django.contrib.auth` 和 `django.contrib.contenttypes`，使得列表与下面的示例类似。\n\
  \n```python\nINSTALLED_APPS = [\n    'django.contrib.admin',\n    'django.contrib.auth',\n\
  \    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n    'django.contrib.messages',\n\
  \    'django.contrib.staticfiles',\n    'rango',\n]\n```\n\n`django.contrib.auth`\
  \ 为 Django 提供对内置认证系统的访问，而 `django.contrib.contenttypes` 包则被认证应用用来跟踪数据库中安装的模型。\n\n\
  #### 如有必要，请进行迁移！\n\n如果你必须将 `django.contrib.auth` 和 `django.contrib.contenttypes`\
  \ 应用添加到 `INSTALLED_APPS` 元组中，则需要使用 `$ python manage.py migrate` 命令更新数据库。这将向数据库添加底层表，例如\
  \ User 模型的表。\n\n通常，每当你向 Django 项目添加新应用时，运行 `migrate` 命令是一个好习惯——该应用可能包含需要同步到底层数据库的模型。\n\
  \n## 9.2 密码哈希\n\n*在任何情况下，都不应该将密码以明文形式存储在数据库中。*² 如果心怀不轨的人获取了包含你应用全部用户账户的数据库，他们可能会造成严重破坏。幸运的是，Django\
  \ 的 auth 应用默认会\n\n² http://stackoverflow.com/questions/1197417/why-are-plain-text-passwords-bad-and-how-do-i-convince-my-boss-that-his-treasur\n\
  \nUser 模型有五个关键属性。它们是：\n\n- 用户账户的 *用户名（username）*；\n- 账户的 *密码（password）*；\n- 用户的\
  \ *电子邮件地址（email address）*；\n- 用户的 *名字（first name）*；以及\n- 用户的 *姓氏（surname）*。\n\n\
  User 模型还带有其他属性，如 `is_active`、`is_staff` 和 `is_superuser`。这些布尔字段分别用于表示账户是否激活、是否属于员工，以及是否具有超级用户权限。查看\
  \ Django 关于用户模型的文档¹⁰，了解基础 User 模型提供的完整属性列表。\n\n## 9.5 附加用户属性\n\n如果你希望包含 User 模型以外的其他与用户相关的属性，你需要创建一个与\
  \ User 模型 *关联（associated）* 的模型。在我们的 Rango 应用中，我们希望为每个用户账户增加两个附加属性。具体来说，我们希望包括：\n\
  \n- `URLField`，允许 Rango 用户指定其个人网站的 URL；以及\n- `ImageField`，允许用户为其个人资料指定一张图片。\n\n\
  这可以通过在 Rango 的 `models.py` 文件中创建额外的模型来实现。让我们添加一个名为 `UserProfile` 的新模型：\n\n```python\n\
  class UserProfile(models.Model):\n    # This line is required. Links UserProfile\
  \ to a User model instance.\n    user = models.OneToOneField(User, on_delete=models.CASCADE)\n\
  \n    # The additional attributes we wish to include.\n    website = models.URLField(blank=True)\n\
  \    picture = models.ImageField(upload_to='profile_images', blank=True)\n\n   \
  \ def __str__(self):\n        return self.user.username\n```\n\n注意，我们使用一对一关系引用 User\
  \ 模型。由于我们引用默认的 User 模型，需要在 `models.py` 文件中导入它：\n\n```python\nfrom django.contrib.auth.models\
  \ import User\n```\n\n对于 Rango，我们添加了两个字段来完成用户资料。我们还提供了 `__str__()` 方法，以便在请求 `UserProfile`\
  \ 模型实例的字符串表示时返回一个有意义的数值。\n\n对于 `website` 和 `picture` 两个字段，我们都设置了 `blank=True`。这使得每个字段在必要时都可以为空，也就是说用户不必为这些属性提供值。\n\
  \n此外，应注意 `ImageField` 字段有一个 `upload_to` 属性。该属性的值会与项目的 `MEDIA_ROOT` 设置拼接起来，为上传的个人资料图片提供存储路径。例如，`MEDIA_ROOT`\
  \ 为 `<workspace>/tango_with_django_project/media/`，`upload_to` 属性为 `profile_images`，则所有个人资料图片将存储在目录\
  \ `<workspace>/tango_with_django_project/media/profile_images/` 中。回想一下，在关于模板和媒体文件的章节中，我们就在那里设置了媒体根目录。\n\
  \n#### 那么通过继承来扩展呢？\n\n也许有人会想通过直接继承 User 模型来添加上面定义的附加字段。然而，由于其他应用可能也需要访问 User 模型，不建议使用继承——而应该在你的数据库中使用一对一关系。\n\
  \n\n\n\n## Django 用户注册应用\n\n值得注意的是，市面上有一些现成的用户注册应用，能够减少很多自行构建注册和登录表单的麻烦。\n\n然而，在使用这些应用之前，最好先对底层机制有所了解。这能确保你对幕后发生的一切有一定感知。*一分耕耘，一分收获。*\
  \ 这也会加深你对表单处理、如何扩展 User 模型以及如何上传媒体文件的理解。\n\n为了提供用户注册功能，我们现在将逐步完成以下四个步骤：\n\n- 创建\
  \ `UserForm` 和 `UserProfileForm`；\n- 添加一个视图来处理新用户的创建；\n- 创建一个显示 `UserForm` 和 `UserProfileForm`\
  \ 的模板；以及\n- 将 URL 映射到所创建的视图。\n\n作为整合新注册功能的最后一步，我们还将：\n\n- 将首页链接到注册页面。\n\n## 创建 UserForm\
  \ 和 UserProfileForm\n\n在 `rango/forms.py` 中，我们需要创建两个继承自 `forms.ModelForm` 的类。我们将为基本的\
  \ User 类创建一个，也为刚创建的新 UserProfile 模型创建一个。这两个继承自 `ModelForm` 的类允许我们显示一个 HTML 表单，展示特定模型所需的表单字段，从而为我们省去大量工作。\n\
  \n让我们在 `rango/forms.py` 中创建这两个继承自 `forms.ModelForm` 的类。请将以下代码添加到模块中。\n\n```\n# until\
  \ we're ready to avoid integrity problems.\nprofile = profile_form.save(commit=False)\n\
  profile.user = user\n\n# Did the user provide a profile picture?\n# If so, we need\
  \ to get it from the input form and\n#put it in the UserProfile model.\nif 'picture'\
  \ in request.FILES:\n    profile.picture = request.FILES['picture']\n\n# Now we\
  \ save the UserProfile model instance.\nprofile.save()\n\n# Update our variable\
  \ to indicate that the template\n# registration was successful.\nregistered = True\n\
  else:\n    # Invalid form or forms - mistakes or something else?\n    # Print problems\
  \ to the terminal.\n    print(user_form.errors, profile_form.errors)\nelse:\n  \
  \  # Not a HTTP POST, so we render our form using two ModelForm instances.\n   \
  \ # These forms will be blank, ready for user input.\n    user_form = UserForm()\n\
  \    profile_form = UserProfileForm()\n\n# Render the template depending on the\
  \ context.\nreturn render(request,\n    'rango/register.html',\n    context = {'user_form':\
  \ user_form,\n               'profile_form': profile_form,\n               'registered':\
  \ registered})\n```\n\n虽然这个视图看起来相当复杂，但它实际上与我们实现 add_category 和 add_page 视图的方式非常相似。不过，这里的关键区别在于我们必须处理两个不同的\
  \ ModelForm 实例——一个用于 User 模型，一个用于 UserProfile 模型。此外，如果用户选择上传个人资料图片，我们还需要处理它。\n\n\
  我们在这里使用的一个技巧（过去曾让很多人栽过跟头）是在保存 UserProfile 表单时使用 `commit=False`。这会让 Django 在第一次保存时不会将数据写入数据库。为什么要这样做？请记住，来自\
  \ `UserProfileForm` 表单的信息会被传递到 `UserProfile` 模型的新实例上。`UserProfile` 包含一个对标准 Django\
  \ `User` 模型的外键引用——但 `UserProfile` 本身并不提供这个信息！试图以不完整的状态保存新的实例会引发引用完整性错误。*两个模型之间的关联是必需的。*\n\
  \n为了解决这个问题，我们让 `UserProfileForm` *不要*立即保存，如上文第 29 行所示。这样我们就可以通过第 30 行的 `profile.user=user`\
  \ 来添加 `User` 引用。完成后，我们可以在第 39 行调用 `profile.save()` 方法，手动将新实例保存到数据库。此时引用完整性得到保证，一切都会按预期工作。\n\
  \n## 创建*注册*模板\n\n现在我们需要创建新 `register()` 视图将要使用的模板。请创建一个新的模板文件 `rango/register.html`，并添加以下代码。\n\
  \n```\n1 {% extends 'rango/base.html' %}\n2 {% load staticfiles %}\n3 \n4 {% block\
  \ title_block %}\n5     Register\n6 {% endblock %}\n7 \n8 {% block body_block %}\n\
  9 <h1>Register for Rango</h1>\n10 {% if registered %}\n11 Rango says: <strong>thank\
  \ you for registering!</strong>\n12 <a href=\"{% url 'rango:index' %}\">Return to\
  \ the homepage.</a><br />\n13 {% else %}\n14 Rango says: <strong>register here!</strong><br\
  \ />\n15 <form id=\"user_form\" method=\"post\" action=\"{% url 'rango:register'\
  \ %}\"\n16     enctype=\"multipart/form-data\">\n17 \n18     {% csrf_token %}\n\
  19 \n20     <!-- Display each form  -->\n21    {{ user_form.as_p }}\n22    {{ profile_form.as_p\
  \ }}\n23\n24    <!-- Provide a button to click to submit the form. -->\n25    <input\
  \ type=\"submit\" name=\"submit\" value=\"Register\" />\n26 </form>\n27 {% endif\
  \ %}\n28 {% endblock %}\n```\n\n## 使用 url 模板标签\n\n请注意，在上述模板代码中我们使用了 url 模板标签，例如\
  \ {% url 'rango:register' %}。这意味着我们在映射 URL 时必须将其命名为 register。\n\n这里需要注意的第一点是，该模板使用了我们在视图中用来表示注册是否成功的\
  \ registered 变量。请注意，模板必须将 registered 设为 False 才会显示注册表单——否则会显示成功消息。\n\n接下来，我们对 user_form\
  \ 和 profile_form 使用了 as_p 模板方法。这会将表单中的每个元素包裹在一个段落中（由 <p> HTML 标签表示）。这样可以确保每个元素都出现在新的一行上。\n\
  \n最后，在 <form> 元素中，我们包含了 enctype 属性。这是因为如果用户尝试上传图片，表单的响应可能包含二进制数据。这与从用户输入表单字段中得到的文本数据不同。因此，响应必须分成多个部分才能传回服务器。因此，我们需要用\
  \ enctype=\"multipart/form-data\" 来标明这一点。这告诉 HTTP 客户端（Web 浏览器）相应地打包并发送数据。否则，服务器将无法收到用户提交的所有数据。\n\
  \n## 多部分消息与二进制文件\n\n你应该了解 <form> 元素的 enctype 属性。当你希望用户通过表单上传文件时——无论是图片还是其他文档——绝对必须将\
  \ enctype 设置为 multipart/form-data。这种属性和值的组合会指示浏览器以特殊方式将表单数据发送回服务器。本质上，代表文件的数据会被拆分成一系列数据块并发送。有关更多信息，请查看这个很棒的\
  \ Stack Overflow 回答¹³。\n\n此外，请务必在 <form> 元素中包含 CSRF 令牌，即 {% csrf_token %}！如果你不这样做，Django\
  \ 的跨站伪造¹⁴ 保护中间件层将拒绝接受表单内容并返回错误。这提供了一层安全保护，防止来自伪造网站的提交通信成功。这通常被称为网络钓鱼。\n\n## register()\
  \ URL 映射\n\n创建好新的视图和关联模板后，我们现在可以添加 URL 映射。在 Rango 的 URLs 模块 rango/urls.py 中，按如下所示修改\
  \ urlpatterns 元组。\n\n```\nurlpatterns = [\n    path('', views.index, name='index'),\n\
  \    path('about/', views.about, name='about'),\n    path('category/<slug:category_name_slug>/add_page/',\
  \ views.add_page,\n        name='add_page'),\n    path('category/<slug:category_name_slug>/',\
  \ views.show_category,\n        name='show_category'),\n    path('add_category/',\
  \ views.add_category, name='add_category'),\n    path('register/', views.register,\
  \ name='register'),  # New mapping!\n]\n```\n\n新添加的模式（位于列表底部）将 URL /rango/register/\
  \ 指向 register() 视图。另请注意，我们为新的 URL 指定了名称 register。\n\n\n\n\n\n![](img/75169a27287f7c945bf2cbf7dede5251_171_0.png)\n\
  \n这张截图展示了你在本教程中创建的基础注册表单。\n\n看到提示表明你的详细信息已成功注册后，数据库中的 User 和 UserProfile 模型中应该会有新条目。进入\
  \ Django Admin 界面来确认这一点。\n\n## 9.7 实现登录功能\n\n完成注册账户的功能后，我们现在需要为 Rango 的用户提供登录能力。为此，我们需要完成下面概述的工作流程。\n\
  \n- 创建一个登录视图来处理用户凭据。\n- 创建一个登录模板来显示登录表单。\n- 将登录视图映射到 URL。\n- 在首页提供登录链接。\n\n### 创建\
  \ `login()` 视图\n\n首先，打开 Rango 的视图模块 `rango/views.py`，创建一个名为 `user_login()` 的新视图。这个视图将处理后续登录表单提交的数据，并尝试使用给定的详细信息登录用户。\n\
  \n```python\ndef user_login(request):\n    # If the request is a HTTP POST, try\
  \ to pull out the relevant information.\n    if request.method == 'POST':\n    \
  \    # Gather the username and password provided by the user.\n        # This information\
  \ is obtained from the login form.\n        # We use request.POST.get('<variable>')\
  \ as opposed\n        # to request.POST['<variable>'], because the\n        # request.POST.get('<variable>')\
  \ returns None if the\n        # value does not exist, while request.POST['<variable>']\n\
  \        # will raise a KeyError exception.\n        username = request.POST.get('username')\n\
  \        password = request.POST.get('password')\n\n        # Use Django's machinery\
  \ to attempt to see if the username/password\n        # combination is valid - a\
  \ User object is returned if it is.\n        user = authenticate(username=username,\
  \ password=password)\n\n        # If we have a User object, the details are correct.\n\
  \        # If None (Python's way of representing the absence of a value), no user\n\
  \        # with matching credentials was found.\n        if user:\n            #\
  \ Is the account active? It could have been disabled.\n            if user.is_active:\n\
  \                # If the account is valid and active, we can log the user in.\n\
  \                # We'll send the user back to the homepage.\n                login(request,\
  \ user)\n                return redirect(reverse('rango:index'))\n            else:\n\
  \                # An inactive account was used - no logging in!\n             \
  \   return HttpResponse(\"Your Rango account is disabled.\")\n        else:\n  \
  \          # Bad login details were provided. So we can't log the user in.\n   \
  \         print(f\"Invalid login details: {username}, {password}\")\n          \
  \  return HttpResponse(\"Invalid login details supplied.\")\n\n    # The request\
  \ is not a HTTP POST, so display the login form.\n    return render(request, 'rango/login.html',\
  \ {})\n```\n\nDjango 提供了所有这些函数和类。因此，你需要将其导入。现在必须在 `rango/views.py` 的顶部添加以下导入语句。\n\
  \n```python\nfrom django.contrib.auth import authenticate, login\nfrom django.http\
  \ import HttpResponse\nfrom django.urls import reverse\nfrom django.shortcuts import\
  \ redirect\n```\n\n你会发现其中一些导入语句在之前的 Rango `views.py` 模块中已经存在——请检查避免重复！例如，`HttpResponse`\
  \ 应该已经从前面就有了。\n\n### 创建*登录*模板\n\n创建好新视图后，我们需要创建一个新模板 `login.html`，让用户输入凭据。我们知道模板将位于\
  \ `templates/rango/` 目录中，但文件名留给你自己确定。查看上面的代码示例，根据新的 `user_login()` 视图的代码来确定文件名。在新的模板文件中，添加以下代码。\n\
  \n```html\n{% extends 'rango/base.html' %}\n{% load staticfiles %}\n\n{% block title_block\
  \ %}\n    Login\n{% endblock %}\n\n{% block body_block %}\n<h1>Login to Rango</h1>\n\
  <form id=\"login_form\" method=\"post\" action=\"{% url 'rango:login' %}\">\n  \
  \  {% csrf_token %}\n    Username: <input type=\"text\" name=\"username\" value=\"\
  \" size=\"50\" />\n    <br />\n    Password: <input type=\"password\" name=\"password\"\
  \ value=\"\" size=\"50\" />\n    <br />\n    <input type=\"submit\" value=\"submit\"\
  \ />\n</form>\n{% endblock %}\n```\n\n```html\n{% if user.is_authenticated %}\n\
  \    howdy {{ user.username }}!\n{% else %}\n    hey there partner!\n{% endif %}\n\
  ```\n\n如你所见，我们使用了 Django 模板语言通过 `{% if user.is_authenticated %}` 来检查用户是否已认证。如果用户已登录，Django\
  \ 会让我们访问 user 对象。我们可以从这个对象判断用户是否已登录（已认证）。如果他或她已登录，我们还可以获取其详细信息。在上面的示例中，如果用户已登录，则会显示其用户名——否则会显示通用的\
  \ `hey there partner!` 消息。\n\n### 演示\n\n启动 Django 开发服务器并尝试登录应用。下图显示了登录页面的截图，应符合预期效果。\n\
  \n![](img/75169a27287f7c945bf2cbf7dede5251_176_0.png)\n\n登录页面截图，包含用户名和密码输入框。\n\n\
  ### 使用装饰器限制访问\n\nDjango 提供了一个名为 `login_required()` 的装饰器，我们可以将其附加到任何需要用户登录的视图上。如果用户未登录并尝试访问带有\
  \ `login_required()` 装饰器的视图，他们将被重定向到另一个页面（[你可以自行设置](https://docs.djangoproject.com/en/2.1/ref/settings/#login-url)）——通常是登录页面。\n\
  \n要尝试这个功能，在 Rango 的 `views.py` 模块中创建一个名为 `restricted()` 的视图，并添加以下代码。\n\n```python\n\
  @login_required\ndef restricted(request):\n    return HttpResponse(\"Since you're\
  \ logged in, you can see this text!\")\n```\n\n注意，要使用装饰器，你需要将它放在函数签名的*正上方*，并在装饰器名称前加上\
  \ `@`。Python 会在执行函数/方法代码之前先执行装饰器。由于装饰器本质上也是一个函数，如果它位于外部模块中，你仍然需要导入它。因为 `login_required()`\
  \ 在其他地方定义，所以需要在 `views.py` 顶部添加以下导入语句。\n\n```python\nfrom django.contrib.auth.decorators\
  \ import login_required\n```\n\n我们还需要在 `urls.py` 文件的 Rango `urlpatterns` 列表中添加另一个\
  \ URL 映射。添加以下代码行。\n\n```python\npath('restricted/', views.restricted, name='restricted'),\n\
  ```\n\n为了使新的受限页面可访问，你还可以在 Rango 的 `base.html` 模板中添加另一个链接。\n\n```html\n<ul>\n   \
  \ ...\n    <li><a href=\"{% url 'rango:restricted' %}\">Restricted Page</a></li>\n\
  </ul>\n```\n\n我们还需要稳健地处理用户尝试访问 `restricted()` 视图但未登录的情况。我们应该如何处理该用户？最简单的方法是将其重定向到他们可以访问的页面，例如注册页面。Django\
  \ 允许我们在项目配置目录中的 `settings.py` 模块里进行指定。在 `settings.py` 中，定义变量 `LOGIN_URL`，指定你希望将未登录用户重定向到的\
  \ URL。对于 Rango，我们可以重定向到位于 `/rango/login/` 的登录页面：\n\n```python\nLOGIN_URL = '/rango/login/'\n\
  ```\n\n然而，像这样硬编码 URL，无论放在哪里，都是不好的做法。我们要不惜一切代价避免这种情况！幸运的是，你可以使用在 Rango 的 `urls.py`\
  \ 模块中定义的 URL 映射来重写它，如下所示。\n\n```python\nLOGIN_URL = 'rango:login'\n```\n\n好多了！Django\
  \ 在这里同样支持 URL 名称。通过输入 URL 名称，Django 会将用户引导到正确的位置，即使登录 URL 发生更改也没关系。\n\n无论你为 `LOGIN_URL`\
  \ 设置什么值，只要提供了值，就能确保 `login_required()` 装饰器会将任何未登录的用户重定向到你指定的 URL。\n\n## 9.9 退出登录\n\
  \n为了让用户能够优雅地退出登录，提供一个退出选项会很好。Django 自带一个方便的 `logout()` 函数，它可以确保用户能够正确、安全地退出登录。`logout()`\
  \ 函数会结束用户的会话，如果之后他们尝试访问需要认证的视图，将无法访问，除非他们随后决定重新登录。\n\n\n\n\n\n要为 `rango/views.py`\
  \ 提供注销功能，请添加名为 `user_logout()` 的视图，并使用以下代码。\n\n```python\n# Use the login_required()\
  \ decorator to ensure only those logged in can\n# access the view.\n@login_required\n\
  def user_logout(request):\n    # Since we know the user is logged in, we can now\
  \ just log them out.\n    logout(request)\n    # Take the user back to the homepage.\n\
  \    return redirect(reverse('rango:index'))\n```\n\n你还需要在 `views.py` 顶部导入 logout\
  \ 函数。\n\n```python\nfrom django.contrib.auth import logout\n```\n\n如果你愿意，也可以将 logout\
  \ 导入追加到你现有的同一模块导入语句末尾，如以下示例所示。\n\n```python\nfrom django.contrib.auth import authenticate,\
  \ login, logout\n```\n\n创建视图后，通过修改 Rango 的 `urls.py` 中的 urlpatterns 列表，将 URL `/rango/logout/`\
  \ 映射到 `user_logout()` 视图。\n\n```python\npath('logout/', views.user_logout, name='logout'),\n\
  ```\n\n最后，我们可以在 `base.html` 模板中添加进一步的链接。\n\n```html\n<ul>\n    ...\n    <li><a href=\"\
  {% url 'rango:logout' %}\">Logout</a></li>\n    ...\n</ul>\n```\n\n## 9.10 整理 `base.html`\
  \ 中的超链接\n\n现在注销用户的全部机制已经完成，我们可以添加一些收尾工作。像上面那样提供注销链接是好的，但明智吗？如果用户未登录，提供注销链接有什么意义呢？反之，如果用户已登录，提供登录链接是否合理？也许不合理——可以认为\
  \ `base.html` 中向用户展示的链接应 *根据其情况而变化*。我们需要做更多工作，以确保我们的 Rango 应用满足我们最初设定的要求。\n\n让我们修改\
  \ `base.html` 模板中的链接。我们将使用模板上下文中的 `user` 对象来确定要向特定用户展示哪些链接。找到页面底部的链接列表，并将其替换为以下代码。随意在此处复制粘贴，因为你所做的只是添加一些条件语句，并移动现有链接。\n\
  \n```html\n<ul>\n{% if user.is_authenticated %}\n    <!-- Show these links when\
  \ the user is logged in -->\n    <li><a href=\"{% url 'rango:restricted' %}\">Restricted\
  \ Page</a></li>\n    <li><a href=\"{% url 'rango:logout' %}\">Logout</a></li>\n\
  {% else %}\n    <!-- Show these links when the user is NOT logged in -->\n    <li><a\
  \ href=\"{% url 'rango:register' %}\">Sign Up</a></li>\n    <li><a href=\"{% url\
  \ 'rango:login' %}\">Login</a></li>\n{% endif %}\n<!-- Outside the conditional statements,\
  \ ALWAYS show -->\n<li><a href=\"{% url 'rango:add_category' %}\">Add New Category</a></li>\n\
  <li><a href=\"{% url 'rango:about' %}\">About</a></li>\n<li><a href=\"{% url 'rango:index'\
  \ %}\">Index</a></li>\n</ul>\n```\n\n此标记和模板代码表示当用户已通过身份验证并登录时，他或她可以看到 `Restricted\
  \ Page` 和 `Logout` 链接。如果他或她未登录，则会显示 `Login` 和 `Sign Up`。由于 `Add New Category`、`About`\
  \ 和 `Index` 不在\n\n## 练习\n\n现在，练习以下两个练习以巩固本章所学内容。\n\n- 自定义 Rango，使只有注册用户可以添加分类和页面，而未注册用户只能查看或使用分类和页面。记住，你需要在\
  \ `views.py` 中添加一些代码，并且还需要更新 `base.html` 中关于链接的模板代码——以及 `category.html` 中的添加页面链接！\n\
  - 通过将受限页面视图转换为使用模板来保持你的模板知识新鲜。将模板命名为 `restricted.html`，并确保它也扩展自 Rango 的 `base.html`\
  \ 模板。确保为此页面提供标题块值为 `Restricted Page`。\n\n## 测试你的实现\n\n我们实现了一系列单元测试，让你检查到目前为止的实现。按照我们之前提供的指南，使用测试模块\
  \ `tests_chapter9.py`。你的实现与我们的测试相比如何？本章的测试相当广泛！请记住，只有在完全完成上述练习后，测试才能通过。\n\n![](img/75169a27287f7c945bf2cbf7dede5251_186_0.png)\n\

- raw: 'In art, as in life, we can often learn more from these mistakes than from
    our triumphs. It is valuable to take the time to consider our mistakes objectively
    as they can teach us lessons. Remind yourself that creating pages in your sketchbook
    that you don’t like is much better than creating nothing. The pain of not creating
    is greater than the pain of creating something you don’t like. Taking risks is
    an integral part of learning and creativity. Embrace the imperfect, enjoy the
    process, and guard against perfectionism.


    Our mistakes can lead us to a breakthrough and encourage us to tackle our subject
    matter differently next time. When we allow ourselves to take risks in art, we
    find they can pay off beautifully sometimes. Other times, we learn what they can
    teach us. Our failures, mishaps, and mistakes contain lessons and growth.


    ![Image](images/f0135-01.jpg)


    When we are trying things out or learning new approaches, our sketchbook pages
    will not always turn out the way we would like them to. We can learn from our
    mistakes and mishaps.


    #### Getting Perspective


    If you dislike what you’ve created or don’t know what to do next, walk away from
    it and return to it in a few minutes or hours, or the next day. Sometimes a little
    distance allows us to see our work more objectively. We’re able to avoid being
    caught up in the finer details and instead view the work as a whole.


    Achieve instant objectivity by holding up your artwork to a mirror, taking a photograph
    of it on your phone, or even looking at it upside down. Another way to get perspective
    is to move yourself physically away from what you are working on. Look at it from
    a more removed vantage point: try propping up your sketchbook on a desk and move
    away or just put it on the floor to achieve some distance. These simple techniques
    allow you to see what you are making with a little detachment.


    ![Image](images/f0136-01.jpg)


    To help gain a little objectivity or perspective on your art, look at it from
    a more removed vantage point.


    ### SELF-EVALUATION


    Evaluation is an important part of the learning process. The great thing about
    a sketchbook is that you can look back through it and see your progression. Earlier
    in this book, I encouraged you to set some intentions around the use of your sketchbook.
    It can be useful to revisit these intentions, checking in from time to time to
    keep yourself accountable. Take inventory and ask yourself questions about your
    art making, such as the following:


    • Am I learning?


    • What have I learned?


    • Am I doing what I set out to do?


    • What aspects have I enjoyed?


    • Am I allowing myself to experiment?


    • Am I beginning to find a process that expresses my creativity?


    • How do I feel about what I have created?


    • How do I feel when I am making art?


    • What would I like to do more of?


    ![Image](images/f0137-01.jpg)


    Ask yourself about your art making and artistic development. For example, have
    you unearthed a process that serves your art and allows you to express your creativity?


    ### SELF-SABOTAGE


    When we step out of our comfort zone and try something new to develop our artistic
    practice, we need to guard against the ways our minds may try to keep us safe
    and stuck within a negative, internal narrative.


    Our minds can play certain tricks to prevent us from creating. We self-sabotage
    or allow our negative internal dialogue to get in the way of our intent to create.
    We may have anxiety and fear about not being good enough. We may be critical of
    our skills and abilities. We may allow procrastination and distraction to prevent
    us from creating art. We may not even try as a method of protecting ourselves
    from the pain of failing.


    All these mental tricks may prevent us from making art as a way to avoid our inner
    critic, our judgment, and our failure. We may stop creating to prevent fear, but
    this also limits our joy. These safety mechanisms that our mind uses to protect
    us can stop us from playing, enjoying the process, improving, and expressing ourselves.


    While we can’t silence our inner art critic entirely, we can learn how to work
    alongside it. Let your negative inner dialogue chatter away in the background,
    but keep reminding yourself that you have so much to gain from making your own
    art.


    ![Image](images/f0138-01.jpg)


    Learn to work alongside your internal art critic. Be clear on your intent, take
    action, make art, keep going, and keep growing.


    ![Image](images/f0139-01.jpg)


    ### SELF-KINDNESS


    Self-kindness is the key to developing an artistic journey that is meaningful.
    This doesn’t mean that we love everything we create, but rather we don’t judge
    our creative worth purely on the end result of what we have made. Conduct a more
    nuanced conversation with yourself about why you may not like something you have
    drawn or created. Insert a little objectivity, step back, and consider why you
    don’t like it, how you could improve it, and what you have learned. Meet your
    vulnerability with kindness, as kindness helps your creativity flourish.


    We live in a society that increasingly values consumption over creating, competition
    over kindness, and outcomes over effort. In your sketchbook practice, I encourage
    you to turn all these assumptions upside down. Relish the act of making something
    from nothing. Be more compassionate than competitive. Prioritize the act of creating
    art over your attachment to the end result.


    ![Image](images/f0140-01.jpg)![Image](images/f0141-01.jpg)


    As children, we draw and color with an unselfconscious abandon. As we get older,
    we begin to censor our own creativity, comparing our worst results to others’
    best results. We can be unkind to ourselves, criticize our output, and dismiss
    our abilities.


    #### Self-Confidence


    The word *courage* comes from an old Latin word meaning “to come from the heart.”
    When we create our own art with courage and confidence, we let what is in our
    heart pour onto the page. Confidence is listening to and trusting our inner wisdom
    and letting it be our guide. Become aware of your instincts and intuition, pay
    attention to them, and you will become your own mentor.


    Think of your creative practice as a continuum of small choices. Creating art
    is a process of constantly making tiny choices and selections. We select our subject
    matter, our materials, where to place the next mark, when to start and stop, when
    to add, and when to subtract.


    I’ve noticed that it is easier to follow my intuition and be more confident in
    my art making when I slow down and really pay attention. When I’m present and
    more focused on what is happening in the moment, I find that I release my attachment
    to judgment and better able to let the process flow.


    ![Image](images/f0142-01.jpg)


    Understand and trust your choices. Also listen to your instinct to be bold and
    fearless in your art making. This level of consciousness means that you are making
    art that is truly personal to you and that more of you is showing up on the page.
    Setting your intentions and following your intuition can take you to wonderful
    places.


    ![Image](images/f0142-02.jpg)


    Confidence comes from tuning in and listening to your inner wisdom—it goes hand-in-hand
    with awareness. Being conscious of the choices you are making at every stage of
    your process helps you to understand more about who you are as an artist.


    ![Image](images/f0142-03.jpg)


    Self-confidence comes from listening to your inner voice while also connecting
    with your art as it develops on the page. Art making can sometimes feel like a
    delicate dance between your awareness and your art.


    #### Developing a Practice


    Creativity is a habit and a practice. Take pleasure in developing your own set
    of processes and approaches. Delight in your discovery as you begin to feel emboldened
    and brave in your artistic practice. Let your sketchbook be a place for your artistic
    voice to exist and flourish. Don’t be afraid of the mishaps, mistakes, and wrong
    turns, as they contain wonderful lessons. Create art—*your* art.'

  fmt: '

    Sketchbooks have helped me to develop my confidence, uncover my inner artist,
    and express myself. When I first started using a sketchbook regularly, it became
    a safe space in which my creativity and art could flourish, a place to develop
    my skills, and a springboard to a more expressive and creative life. I encourage
    you to explore your own motivations for working in a sketchbook.


    I’m a great believer in writing things down because sometimes the act of putting
    pen to paper can turn the intangible into the tangible. Asking ourselves questions
    and writing down our answers helps us articulate our intentions, allowing us to
    find clarity. I invite you to think about your motivation for working in a sketchbook.
    Write your answers in your sketchbook or, if that doesn’t feel right, just explore
    them on a piece of paper. It is powerful to ask yourself why you’d like to develop
    a sketchbook practice, what you’d like to achieve, how you’d like to feel, and
    when and where you intend to work in your sketchbook. Use the following prompts:


    • I’d like to develop a sketchbook practice because …

    • When I’m working in my sketchbook, I’d like to feel …

    • I’d like my sketchbook to be a place where I can …

    • I will use my sketchbook every (frequency) for (specify) amount of time

    • I will use my sketchbook at (place)


    ![Image](images/f0029-01.jpg)


    Clarity of intention is a powerful place to start.


    ![Image](images/f0030-01.jpg)


    Define your personal motivations and set your intentions.


    ### UNEARTH YOUR INTERESTS


    Take a little time to complete the simple yet illuminating exercise that follows.
    It focuses on thinking and writing about the things that fascinate you. It asks
    you to identify the topics, subject areas, objects, or ideas that resonate with
    you and that you might like to explore in your sketchbook.


    ### CAPTURING IDEAS ON ONE PAGE


    The premise of this exercise is to capture all or some of the things that you
    might like to delve into in your sketchbook. Think of this as a stream-of-consciousness
    brain dump on to a page. You might think you don’t really know the answer to this
    question, so spending a little time thinking and writing can be a wonderful way
    to get the ball rolling.


    ### PERSONAL MAP OF INSPIRATION


    Ask yourself this simple question: What would I like to explore in my sketchbook?
    Then sit quietly and think about your answers. Write down everything that comes
    to mind. Do not edit yourself. It doesn’t matter if your list sounds like a disparate
    collection of weirdness. Weird is wonderful. I now believe that my “weirdness”
    is the most interesting part about me. My lifelong obsession with patterns is
    one example of my weirdness (I can still remember all the carpet and wallpaper
    patterns in a house we left when I was five.) Then there are my all-consuming
    love affairs with random items from the natural world (shells, feathers, pinecones,
    leaves, seaweed, fish scales, and so on). All these things come out in my art
    and my sketchbook. Unearth your quirks and idiosyncrasies, then embrace them,
    nurture them, celebrate them, and use them.


    Think of this writing, thinking, and note-taking exercise as a starting point
    for capturing your tiny curiosities. It’s a way to record your interests, whether
    they are fleeting fragments or full-fledged ideas. It’s a treasure map of the
    things you’d like to explore in your sketchbook. You list subjects that interest,
    fascinate, or intrigue you or pique your curiosity. Spend at least 20 minutes
    writing down the tiny and large things that spark your interest.


    ![Image](images/f0030-02.jpg)


    Explore your interests, obsessions, and curiosities. What subject matters are
    you fascinated by?


    ![Image](images/f0031-01.jpg)


    Here is an example of one of my inspiration maps. Yours will look completely different
    and contain things that are special to you. We are all unique and have our own
    set of influences, interests, and inspirations. Listen to your inner whisper,
    your inner wisdom, and write about it. Writing out these ideas will allow you
    to follow their unique threads.


    ### BEING MINDFUL ABOUT YOUR INTERESTS


    This exercise is something that you can return to, add to, or do again from start
    to finish. You may find that after you do this exercise, when you are just going
    about your daily routine, new ideas spring to mind. It’s as if the act of writing
    these things down primes your brain to seek out inspiration at other times. When
    you are mindful about seeking out inspiration, you’ll find that it is all around
    you.


    ### QUESTIONS TO ASK YOURSELF


    Complete this exercise in your sketchbook or on a blank piece of paper—your choice.
    I tend to do mine on a large piece of paper to allow me freedom and space to write
    as much as I like.


    Ask yourself some or all of the following questions to get your ideas flowing:


    • How would you describe the art that moves you?

    • What art subject matter are you most drawn to?

    • What did you enjoy creating or drawing as a child?

    • Consider your creativity up to this point. What have you enjoyed?

    • Is there an artistic approach that you have always wanted to try?

    • What art materials interest you?

    • Which subject areas excite you?

    • Which subject areas fascinate you?

    • What are you intrigued by?

    • What kinds of objects do you like to collect?

    • What sort of places do you like to visit again and again?



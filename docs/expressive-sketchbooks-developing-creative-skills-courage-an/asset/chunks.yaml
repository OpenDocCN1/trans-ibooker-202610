- raw: 'Much of my artistic practice is informed by the colors and patterns in nature.
    I actively seek out visual references that appeal to me, looking for shapes, textures,
    patterns, silhouettes, colors, and layers. As with most things in life, the more
    mindful and curious I am, the more I see and discover. The more I look, the more
    I find.


    Take your camera outside when you are looking for stimulus. Use the photographs
    you’ve taken as a springboard to create pages in your sketchbook. Use the color
    inspiration you have collected or the reference shapes or patterns as a starting
    point.


    ![Image](images/f0076-01.jpg)


    The natural world is a wonderful source of reference material. Seek out aspects
    that interest you and that you want to explore further in your sketchbook. Try
    selecting one photo or prompt and use it as a starting point to create multiple
    pages, experimenting with different techniques, materials, or colors. Here are
    some photographs of my local park and the corresponding pages in my sketchbook.


    ![Image](images/f0077-01.jpg)


    #### Collecting Reference Material


    Go on your own inspiration safari to seek reference material and stimuli. Take
    photographs of the inspiring things you find in your neighborhood. It might be
    worth revisiting some of the items you put on your original inspiration map. You
    will be attracted to a completely different set of stimuli than me. Think about
    shapes, light, textures, colors, layers, juxtapositions, and creating a story.
    You might get excited about the built environment, straight lines, cityscapes,
    people, crowds, or graffiti.


    Take lots of photographs of the things that interest you. Part of the joy of this
    exercise is getting to know what lights you up and fills you with a sense of creative
    potential. The magic in going outside and seeking inspiration is that you must
    question and then try to understand what makes you inspired, curious, or energized.
    The more you look for inspiration, the more you will find it and, importantly,
    the better you will understand your own creativity.


    ![Image](images/f0078-01.jpg)![Image](images/f0079-01.jpg)


    On a walk through my neighborhood park, I was attracted to this blossoming rhododendron
    bush. I then used this one photograph to paint three pages in my sketchbook.


    ![Image](images/f0080-01.jpg)


    Select a photograph that interests you. Begin with bold paint marks to represent
    the areas of the photo that fascinate you the most. I started with a loose and
    quick representation of the flowers in watercolor on all three pages.


    Start with a big brush as it can make your first marks more expressive and courageous.
    It is always a good idea to start with bold, self-assured marks and then add more
    detail.


    Leave these initial marks to dry. When you add your next layer, try to respond
    to the marks already on the page. My color choices bear little resemblance to
    the original photograph as I responded to what was already on the page and chose
    colors that I thought worked well with the original pink marks.


    Finish the page by drawing in detail with a pen or pencil and emphasize the parts
    of the original photo that appeal to you.


    ![Image](images/f0080-02.jpg)![Image](images/f0080-03.jpg)![Image](images/f0080-04.jpg)![Image](images/f0080-05.jpg)![Image](images/f0080-06.jpg)![Image](images/f0081-01.jpg)![Image](images/f0081-02.jpg)![Image](images/f0081-03.jpg)


    #### Collecting Interesting Objects to Draw


    When you are in nature or just walking around your neighborhood, be on the lookout
    for small natural objects or interesting items and artifacts such as leaves, twigs,
    a fallen flower, pinecones, or found objects. Seek out small and interesting items
    with detail that you would like to explore further and that you can take home
    and draw at your leisure. Select items you would like to understand better through
    drawing. In contrast to the speed-drawing exercises earlier in this book, taking
    your time with a drawing can also be rewarding.


    When you spend a few hours drawing an object, you learn so much more about it,
    which allows you to fully appreciate its complexity and beauty. The extra detail
    and understanding you gain from looking at the real thing rather than a photograph
    can be quite amazing. By slowing down and observing, you can connect with your
    found object in a way that is quite special.


    ![Image](images/f0082-01.jpg)![Image](images/f0083-01.jpg)


    Slowing down and taking your time to draw something can be revealing and rewarding.
    You see and appreciate intricate details that you may have never noticed before.


    #### Taking Your Sketchbook Outside


    In addition to seeking reference material that you can use when you get home,
    create and draw while outside. Getting into nature can be good for your art practice
    and your spirit. There is an increasing amount of scientific research that links
    being in nature with mental well-being, stress reduction, and increased creativity.
    For me, going to a park, to the coast, or to the countryside to draw or paint
    can be a beautiful and affecting experience.


    You might find energy and interest in a cityscape, townscape, or the built environment.
    Choose the type of setting that resonates with you. Being in the location as you
    draw can lead to a real richness and vibrancy in your art.


    Your eyes see so much more detail and nuance than you can ever discern from a
    photograph. I frequently draw from photographs but drawing what I see and experience
    outside brings a whole new dimension to my work. A photograph is flat. Being in
    the actual setting you are drawing allows you to understand the three-dimensional
    quality of the space. It also allows you to interpret and experience the place
    with all your senses. You are creating a sensory memory: hearing, feeling, smelling,
    and touching.


    Drawing or painting outside means you are absorbing a whole array of sensory information
    that aids your understanding. It also takes a certain amount of confidence and
    lugging materials around, but the rewards are worth it.


    ![Image](images/f0084-01.jpg)


    Here are a few techniques to help you create art when outside:


    ##### SELECT A VIEW


    Consider using a viewfinder when selecting a scene to help you think about composition
    and the elements you want to concentrate on. You can create a simple, expandable,
    cheap, and cheerful viewfinder with two L-shaped pieces of card that you move
    around to create a rectangular frame. Or you can use your camera or phone to help
    select the area on which you’d like to concentrate. These techniques frame or
    crop the landscape so you can think about what attracts your attention and what
    you want to leave out. They can help you design the composition on your page as
    you frame the landscape to reflect the shape of your paper. You then put away
    the viewfinder and draw what you see in the area you have selected.


    ![Image](images/f0085-01.jpg)


    ##### RULE OF THIRDS


    The rule of thirds is a composition guideline that can be an effective aid when
    selecting a landscape to draw. Imagine your page with a virtual grid over it which
    splits the page into three sections horizontally and three sections vertically.
    The theory behind the rule is that significant aspects of your composition will
    be more visually pleasing if they are placed along or at the intersection of these
    lines. Think about the rule of thirds when selecting a horizon line or when positioning
    a tree or building. The basic premise is that a focal point is more interesting
    and a composition more dynamic if the key elements are off to the side and not
    right in the center of the page.


    ![Image](images/f0087-01.jpg)'

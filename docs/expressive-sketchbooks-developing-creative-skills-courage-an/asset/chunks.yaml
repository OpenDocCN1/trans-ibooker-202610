- raw: 'Consider the orientation of your sketchbooks. I like to work in a portrait
    (vertical) format. Many other artists prefer to work in a landscape (horizontal)
    format. Think about your preference when purchasing a sketchbook as this will
    influence where the binding is. Bindings may be spiral bound or stitched and glued
    like a hardcover book. Spiral-bound books allow you to easily lay the pages totally
    flat and turn them with ease. If you like to work across double-page spreads,
    however, you may find the spiral wire disruptive to your flow.


    #### Look for a Comfortable Sketchbook


    Find a sketchbook that feels good to use, is comfortable in your hands, and is
    worthy of sharing your creative journey. Avoid books that you think are too formal
    or too good to use. If you want to save your sketchbook only for your best work,
    you won’t feel comfortable putting it through its artistic paces.


    ![Image](images/f0038-01.jpg)


    I have several sketchbooks in the works at any one time. I usually have a small,
    portable notebook in my pocket or bag and a variety of larger sketchbooks that
    I use only in my home studio.


    ### MATERIALS AND ART SUPPLIES


    Consider the art materials that most appeal to you, the ones you really enjoy
    using. In the same way that we all have our own distinct lexicon of marks, we
    all have a special affinity or natural attraction to certain materials.


    When working in your sketchbook, be conscious of which materials make you feel
    excited, at ease, and expansive, and which materials make you feel restricted
    or awkward. Try completing the same exercise with different materials. Experiment
    and see what works for you.


    Many of us love experimenting with new products. But instead of buying new products
    in the hope of boosting creativity, always begin with the materials you already
    have on hand. I am as guilty as the next person in believing that a certain new
    paint or new type of ink will elevate my artistic practice. Shopping for new supplies
    can easily become a substitute activity for just getting started with the perfectly
    good supplies you already have.


    The following are some of the supplies I enjoy using. You might have a completely
    different selection of favorite supplies, and that’s great. I encourage you to
    embrace the materials you love using and adapt the exercises accordingly.


    ![Image](images/f0039-01.jpg)


    There is a world of possibility when it comes to art materials and supplies.


    #### Pencils and Graphite


    There is something wonderful about the humble pencil. H (which stands for “hard”)
    pencils are hard, precise, and great for detailed work. Softer B (black) pencils
    are for smudgy, darker, and thicker lines. I enjoy using water-soluble graphite
    pencils, which can be used with or without water. Add water to the drawn line
    and it will turn your marks into an ink-like wash. You can also dip your water-soluble
    graphite pencil straight into the water and draw with the wet flowing line.


    ![Image](images/f0040-01.jpg)


    Pencils are versatile art tools.


    #### Pens


    I use a lot of black fine-line pens in my sketchbook, either on their own or to
    draw over collage and dry paint. As a child, I loved felt-tip pens and still love
    the process of coloring with them. When I’m not using a felt-tip pen (also called
    a marker pen), I sometimes use a blue ballpoint pen.


    #### Paint


    I frequently use watercolor paint in my sketchbook and art. There is something
    about the unpredictability of this kind of paint that I find alluring. I love
    the way the color mixes with the water on the page and creates unexpected patterns.
    I also enjoy using gouache paint, which is more opaque than watercolor. Acrylic
    paint comes in a stunning array of colors and textures and can be used in techniques
    that require you to have distinct layers of paint over something.


    ![Image](images/f0041-01.jpg)


    I enjoy the qualities of watercolor paint. Look for materials that help you to
    feel at ease and expressive.


    #### Ink


    I enjoy the fluidity of ink. One way to use ink is to simply brush clean water
    over a sketchbook page and then drip ink onto it to create expanding dots, circles,
    and happy accidents.


    #### Collage Materials


    I have a collection of interesting papers including old book pages, pages from
    magazines, found papers, and abandoned art works. I also create, print, and draw
    on scrap pieces of paper with the intention of incorporating them into my sketchbook.
    To paste them into the sketchbook, I use a PVA-based glue, which is inexpensive
    and works with all sorts of paper.


    #### Brushes


    Most of my brushes are inexpensive and come in a variety of sizes and shapes.
    Using a variety of brushes on one page adds visual interest. For example, I often
    use decorator brushes to create big, bold marks in tandem with tiny brushes to
    add details, dashes, and dots.


    ![Image](images/f0042-01.jpg)


    Collect or make papers to incorporate into your sketchbook pages.


    ### COLOR


    My sketchbook is colorful. I love using the power and beauty of color. To harness
    the magical qualities of color, it helps to know a little about color theory.


    #### The Color Wheel


    The color wheel organizes colors in a circle according to how they relate to each
    other. Artists often reference a color wheel to see which colors work well together.


    ![Image](images/f0043-01.jpg)


    ##### PRIMARY COLORS


    The three primary colors are the building blocks. They’re called primary because
    they can’t be made from mixing other colors together.


    ![Image](images/f0043-02.jpg)


    ##### SECONDARY COLORS


    When you mix two primary colors together, you create a secondary color:


    ![Image](images/f0043-03.jpg)


    ##### OPPOSITES ATTRACT


    Complementary colors are pairs of colors that are opposite each other on the color
    wheel. When complementary colors are used together, they create a dynamic effect.
    Because they are high-contrasting opposites, complementary colors seem to pop
    and fizz when placed next to each other, bringing out each other’s best qualities:


    Blue + orange


    Yellow + purple


    Red + green


    ![Image](images/f0044-01.jpg)


    Experiment with using opposite pairs of colors in your sketchbook.


    ##### HARMONIOUS TRIOS


    Analogous colors, or harmonious colors, are groups of three colors that sit right
    next to each other on the color wheel. They tend to harmonize with each other
    nicely but can lack contrast:


    Red + orange + yellow


    Purple + blue + green


    Green + yellow + orange


    Blue + purple + red


    ![Image](images/f0045-01.jpg)


    Colors that sit next to each other on the color wheel harmonize well together.


    ##### DYNAMIC TRIOS


    If you pick three colors that are equally spaced on the color wheel, they always
    work well together:


    Red + yellow + blue


    Orange + green + purple


    ![Image](images/f0045-02.jpg)


    Here are examples of harmonious trios painted in watercolor paint.


    ##### COLOR TEMPERATURE


    It can be helpful to think about the temperature of colors as either cool or warm.
    The colors that are closest to yellow on the color wheel are the warmest, with
    yellow being the warmest of all. Warm colors that contain a lot of yellow tend
    to come forward on the page, as if they are moving toward you. Cool colors—those
    closest to blue on the color wheel—tend to recede or appear to go back in space.
    This is because our eyes perceive warmer colors first, before cooler tones.


    If you were to paint a yellow blob next to a blue one, the yellow blob might look
    as if it were coming toward you while the blue one might look as if it were receding.
    You can use this trick if you are painting a landscape or want to create depth.
    Use warmer colors in the foreground and cooler colors in the background to create
    the sense of near and far.


    ![Image](images/f0046-01.jpg)


    Warmer colors tend to come forward and look closer, while cooler shades tend to
    recede and look farther away.


    ##### VIVID AND MUTED'

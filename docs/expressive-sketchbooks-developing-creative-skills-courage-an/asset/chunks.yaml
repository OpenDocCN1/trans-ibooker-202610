    aware of the intensities and saturation of the colors. Consider pairing bright
    and bold colors with more muted and subtle colors to create contrast and variety.


    If you are drawn to the bright and brilliant colors, use them with more subdued
    hues for greater impact. When you use only super-bright colors together, their
    combined impact is likely to be dulled and diminished. Bright pink used next to
    a bright orange doesn’t stand out and look as extraordinary as it might if the
    pink were used next to a subdued gray or dull olive green.


    A page that uses only highly saturated hues with no muted colors to counterbalance
    them can look a little naïve. Conversely, a painting that uses only very muted
    tones may lack dynamic energy, but adding a splash of bright color can draw the
    eye and act as a focal point.


    Using both bright and muted colors in tandem can help your work to appear more
    nuanced and interesting. These six images were created by painting stripes of
    acrylic paint in my sketchbook. The sketchbook was upright and standing on my
    desk so the color from above dripped and blended into the colors below.


    You can usually create a more muted shade of any color by mixing it with a little
    of the color that is opposite it on the color wheel.


    ![Image](images/f0047-01.jpg)


    These pages contain only bright and vivid stripes.


    ![Image](images/f0047-02.jpg)


    #### Color Experiments


    Here are a few ways to experiment with color:


    • Mix your own secondary colors.


    • Find paintings by artists you admire that use complementary colors.


    • Create your own color wheel in your sketchbook.


    • Create a page or several pages in your sketchbook that are based on complementary
    colors.


    • Paint stripes to see how different colors react when placed next to each other.
    Create several pages of stripes: one with only bright and bold colors, one with
    only muted colors, and one that combines both bright and muted tones.


    ![Image](images/f0048-01.jpg)


    These pages contain only muted color stripes.


    ![Image](images/f0048-02.jpg)![Image](images/f0048-03.jpg)


    These pages contain both vivid and muted color stripes.


    ![Image](images/f0048-04.jpg)


    ### THE JOY OF DRAWING


    I’d love for you to fall in love with drawing. Here’s a collection of art exercises
    to get you going in your sketchbook. The exercises are designed to be flexible
    so that you can adapt them and make them your own.


    #### Mark-Making Exercise


    I believe that everyone can draw. Drawings are made up of lines and marks. Simple
    mark-making exercises can be very powerful and are an easy way to free you up
    and get you started. Making marks on paper might sound like a childish thing to
    do, but it’s a valuable exercise. It puts you in a place of inquiry and allows
    you to develop your own visual language.


    Get to know the types of marks that appeal to you and are personal to you. We
    all have a lexicon of expressive marks and unearthing your own can be a rewarding
    experience. The lines and marks that come naturally to you are the handwriting
    of your art. Our natural way of making marks on the page is the essence of our
    art.


    Try this exercise with a pencil: How many different marks can you make with the
    pencil on one or two pages of your sketchbook? Think about the speed of your mark
    making and the pressure you exert. Also consider the scale, size, and range of
    tones. Experiment with using your nondominant hand.


    ![Image](images/f0049-01.jpg)


    Try this mark-making exercise over several pages, finding your intuitive and instinctive
    approach to marks.


    ![Image](images/f0050-01.jpg)


    When you draw something in front of you, you are interpreting your subject matter,
    understanding it, and developing your own response to what you see.


    #### Exploratory Drawing


    Drawing is not necessarily about producing a perfectly realistic rendition of
    what you see. Rather it is a way to interpret the world. Drawing is not so much
    about the thing you are drawing, but more about how you interpret the thing you
    are drawing. The importance comes from you and your personal lens.


    When you draw something, you see it differently and you explore it. When drawing
    something, you must spend time really looking at the object or subject. It’s not
    just about seeing the shapes and lines of what’s in front of you, it’s about determining
    its intrinsic nature and purpose and discovering your response to it.


    As you begin to draw, you may feel awkward or apprehensive, yet with most things
    in life, the more you do something, the more confident and at ease you become.
    Try to approach the page with a sense of curiosity and possibility. Asking yourself
    questions as you make your art is a good way to stay conscious and connected to
    what you are making. Consider the following questions:


    • What is it about this subject matter that interests or excites me?


    • What about the subject’s essence would I like to convey in my drawing or painting?
    Is there something about its shape, form, texture, shadow, or silhouette that
    particularly appeals to me?


    • Which materials are best suited to my subject matter?


    • What do I want to learn through doing?


    • How do I want to feel as I create?


    • What do I actually feel as I create?


    ![Image](images/f0051-01.jpg)


    Select objects to draw that have meaning to you. Here I have drawn my mother’s
    button box and sewing materials. This drawing is made with fine line and felt-tip
    pens.


    ![Image](images/f0051-02.jpg)


    When you draw something, you are making a connection with it. As your pen or pencil
    dances around the paper trying to represent what you see, you have an opportunity
    to understand the thing you are looking at better than you did before.


    #### Selecting Something to Draw


    Select your objects or subject matter carefully as they are important. What you
    draw or paint should matter to you in some way. It’s very hard to draw things
    that you have no interest in or connection with.


    The item or items you select to draw should have something in their essence that
    interests you, intrigues you, and appeals to you.


    ![Image](images/f0052-01.jpg)


    Be mindful when you select something to draw or paint. Selecting your subject
    is an important part of the process.


    #### More Looking Than Drawing


    Spend more time looking than drawing, even if you are completing the super-quick
    exercises. By being mindful and slowing down to see and study your subject, you
    are more likely to capture what you are trying to draw.


    Taking the time to look closely helps us draw what is in front of us rather than
    what we think is in front of us. I tend to draw items as I think they should look,
    instead of how they look. When I spend more time focusing and really observing,
    my drawings better reflect the reality of what I am drawing.


    ![Image](images/f0053-01.jpg)


    Drawing helps you see and understand your subject matter with new eyes.


    #### Ways to Start Drawing


    There is an energy and vibrancy about a quick drawing, an off-the-cuff quality
    that can be very liberating. A speedy drawing can have a certain beauty and an
    immediacy. When you practice quick drawing, try drawing several images on one
    page or do one drawing over and over again. Approach the same drawing with a variety
    of art tools, such as a pencil or thick felt-tip pen. If you haven’t drawn in
    many years, you may feel reticent to start. I am cheering for you! I encourage
    you to take action, dive in, and start drawing.


    The following are simple exercises to try on your subject of choice. They are
    designed so you have the freedom to experiment with them and make them your own.


    ![Image](images/f0054-01.jpg)


    Drawing is not just about the result; it is also about the practice, the experience,
    being in the moment, the actual doing, and all the lovely learning that happens
    along the way.


    #### Don’t Look at the Page'

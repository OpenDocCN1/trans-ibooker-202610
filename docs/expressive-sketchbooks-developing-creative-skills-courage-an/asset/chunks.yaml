  trans: '

    遇到一张空白的白纸感到有些 daunting 并非罕见。如果这也是你的情况，试试以下几种消除大片空白的方法。这些简单的方法会在页面上留下一些痕迹或一点颜色，然后你可以在其上作画或上色。这些方法增添了一点趣味，为你提供了可以回应的内容，并作为一个起点来消除那种白茫茫的感觉。


    ### 剩余颜料


    通常当我的调色板上剩下颜料时，我会用它在素描本的空白页上点几下或做一些随意的标记。这些标记会在你下次使用素描本时提供视觉趣味，让你可以在其上或周围进行创作。


    ![图像](img/f0066-01.jpg)


    **A** 用颜料做随意的标记来消除空白页。通过使用大号画笔并在笔尖同时蘸取两种或更多颜色，可以实现彩虹效果。


    ![图像](img/f0066-02.jpg)


    **B** 让原来的标记干透后再在其上进行创作。思考如何让页面上的原始标记成为亮点。这里我快速画了一个树形，然后在铅笔周围上色，利用负空间形成树形。


    ![图像](img/f0066-03.jpg)


    **C** 考虑在你的作品中构建许多不同的层次。让每一层干透后再添加更多细节或使用不同的画笔。


    ![图像](img/f0067-01.jpg)


    这里有两页以随机线条开始的素描本页面。较大的那一页用黑色记号笔绘制了图案。较小的一页是在深蓝色墨水上使用白色墨水。两页的起点都是几条线条。在黑白页面中，一条波浪线被画下并横跨页面。这有助于结构化图案。


    ### 一些随意的线条


    我可能会在页面上随手涂鸦一两条完全随意的线条。试着闭上眼睛画几条线。或者在画线时听你最喜欢的音乐。然后考虑你想如何发展这些线条。尝试用三种不同的艺术材料画三条线。我可能会用这种方式填满五六页，然后当我再次回到素描本时，我常常会发现可以回应的某个微小开端。


    ### 拼贴


    将有趣的纸片拼贴或粘贴到空白页上，然后在其上进行创作。


    ![图像](img/f0068-01.jpg)


    选择一个有趣的纸片碎片粘贴到你的素描本中。


    ![图像](img/f0068-02.jpg)


    将拼贴元素作为起点或跳板来回应它。


    ### 彩色底色


    我经常把一页纸涂成粉色或绿色，然后在其上作画或进行创作。尝试使用彩色背景或底色（第一层或基础层）是值得的，看看它们对你的作品会产生什么效果。尝试不同的颜料和颜色，看看什么适合你。例如，在黑页上使用白色笔，或尝试不同不透明度的颜料，比如先用水彩，晾干后再用丙烯颜料覆盖。


    ![图像](img/f0069-01.jpg)


    **A** 尝试使用不同的背景颜色。将页面涂上颜色并晾干。


    ![图像](img/f0069-02.jpg)


    **B** 在你选择的媒介上覆盖彩色区域。这里我在粉色页面上使用了黑色细线笔。


    ![图像](img/f0069-03.jpg)


    **C** 尝试不同的彩色背景，了解它们对成品可能产生的影响。


    ![图像](img/f0069-04.jpg)


    随意的背景绘画可以为你提供一个起点和回应的刺激。


    ![图像](img/f0070-01.jpg)


    在页面上添加一种或多种颜色作为背景，然后画一些随意的线条。问问自己如何发展这个起点。这里的例子让我想起了山上的雨，于是我将其发展成了一幅印象派风景画。


    ![图像](img/f0070-02.jpg)![图像](img/f0070-03.jpg)


    添加你所选媒介的层次来构建你的素描本页面。


    ![图像](img/f0070-04.jpg)


    尝试在丙烯颜料上喷水并移动素描本以制造有意的滴落效果。


    ![图像](img/f0071-01.jpg)


    一旦一层干透，就通过强调某些区域来增强冲击力和视觉趣味。


    ![图像](img/f0071-02.jpg)


    选择与你想要的效果相符的画笔。大而厚的画笔会创造出大胆且富有表现力的痕迹。


    ![图像](img/f0071-03.jpg)


    尝试滴落和飞溅来创造动感。这里我在飞溅上有点过头了。如果要重做这一页，我会限制这些飞溅，并确保它们不要太均匀。


    ![图像](img/f0071-04.jpg)


    思考你页面的明暗色调。在这里的例子中，一切看起来都很中间调，所以我在地平线上添加了深蓝色水彩和一点白色颜料来变化色调。


    # 第 3 章


    ## 探索与实验技巧


    本节包含我在创作艺术时使用的许多实用技巧。我解释了不同的探索和实验方法，并分享了你可以如何创造性地混合艺术材料。我希望你能应用、改编和改变这些技巧，使用你所拥有的艺术用品。


    ![图像](img/f0072-01.jpg)


    ### 约束


    无限的可能性有时比解放更令人瘫痪。知道你可以做或创造任何事情可能会让人感到 daunting。你可能会发现为自己设定一些参数和界限是有用的，以帮助你克服选择无限制的问题。


    有时太多的自由会让我们不知道该做什么，于是我们选择什么都不做。在这种情况下，几个自我设定的参数能让我们的创造力有所依托。阅读以下约束的选择并挑选最能引起你共鸣的一个。考虑制定自己的约束清单，在灵感不足时使用：


    • 在你现在所在的位置可以看到的东西启发下，在素描本中创作一页。

    • 选择一本你喜欢的书，随机打开一页，并根据该页创作一些东西。

    • 打开你的冰箱并挑选一样东西来画。

    • 选一种颜色，然后在家里四处寻找该颜色的物品或物品集合来画。

    • 创作只使用蓝色和橙色的页面。

    • 在 30 分钟内创作三页，设定计时器，每 10 分钟换到下一页。

    • 重复或重访你已经画过或涂过的主体；我们经常通过重复获得新的见解。


    挑选以下十个词中的一个作为起点，在你的素描本中创作一页或一系列页面。例如，制作一个快速的想法地图并列出你对这个词或概念感兴趣的所有事物。思考如何在素描本中探索这个主题，然后看看它会带你去哪里。


    1\. 天气

    2\. 地图

    3\. 家

    4\. 归属

    5\. 科学

    6\. 老化

    7\. 庆祝

    8\. 不公

    9\. 自我

    10\. 季节


    ![图像](img/f0075-01.jpg)


    约束可以帮助你克服选择瘫痪。一个约束的例子可能是限制自己画或涂你厨房里找到的主体。我在冰箱里找到了这块西兰花。


    ![图像](img/f0075-02.jpg)![图像](img/f0075-03.jpg)


    当你在作画时，考虑你想要强调或突出的主体方面。当我开始画这块西兰花时，它让我想起了雄伟的橡树，所以我通过用粗黑记号笔涂满背景来强调它的轮廓。


    ### 在外部寻求灵感


    我鼓励你积极寻求世界上的奇妙和敬畏。放慢脚步，花时间环顾四周，可以有效地找到素描本中绘画或作画的主题。通过放慢脚步、注意观察、更专注并意识到周围环境，我们可以获得见解和灵感。


    #### 走进自然


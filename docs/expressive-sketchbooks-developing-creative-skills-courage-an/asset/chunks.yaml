  trans: '

    通过在同一页上使用你最喜欢的艺术材料和用品进行实验。尽情发挥不同的组合，发现混合带来的炼金术。有时组合效果美妙，有时则不然。惊喜元素是发现过程的一部分。“什么都行”的心态可以帮助你在不过于担心或评判结果的情况下享受过程。当我们给自己探索和实验的自由时，我们会更了解自己作为艺术家和创意人士的身份。


    ![图像](img/f0096-01.jpg)


    使用多种材料可以让人在创作艺术时产生发现感和可能性。


    玩弄我们的材料可以让我们更好地了解它们的特性和独特品质。对艺术材料的这种开放探究让我们能够品味和享受制作艺术的感官和触觉性质。在触摸材料时，我们与工具和创作建立了身体上的联系。大胆一些。通过以各种组合使用你手头的材料，培养冒险和启示的感觉。以下是我的常用混合媒介组合：


    ### 颜料与钢笔


    使用水彩或其他类型的颜料创作色彩丰富的背景或底色层，然后用黑色细线笔在其上作画。直觉地进行，不要有计划或外部刺激；只要让想象力引导你。然后再试一次，这次根据外部参考物如照片或物体进行创作。考虑你更喜欢哪种过程以及原因。你越了解自己喜欢的工作方式，就越能创造出感觉个人化且有意义的过程。


    ![图像](img/f0097-01.jpg)


    在这几页上，我用颜料做了标记，没有计划或目的。我只是享受探索颜料的过程，并见证颜色彼此之间的作用，在放置新标记时回应页面上的上一个标记，并让已有的创作指导我的下一步。你也可以试试。创作一幅没有固定计划的初始绘画；只要跟随你的直觉，倾听你内心的智慧。


    ![图像](img/f0097-02.jpg)


    初始层干燥后，用铅笔或钢笔添加细节。你可以强调原作的某些方面。思考你自己的表现性标记词汇，以及如何将其融入其中。


    ### 阻染技法


    蜡笔或蜡烛在水彩下方可作为颜料的阻抗，产生有趣的效果。使用儿童蜡笔绘制图像，然后用水彩覆盖其上。蜡阻挡了刷上去的颜料，颜料会在原来的蜡笔画上汇聚成小点。


    ![图像](img/f0098-02.jpg)


    蜡笔在水彩下方形成悦目的对比，因为蜡对颜料起阻抗作用。尝试不同的色彩组合以创造不同的效果。


    ![图像](img/f0098-03.jpg)![图像](img/f0098-01.jpg)![图像](img/f0099-01.jpg)


    用蜡笔完成一幅画。


    ![图像](img/f0099-02.jpg)


    用蜡笔作画然后用水彩覆盖其上。这里我使用了三种不同水彩的条纹来营造景观的错觉。


    ### 底色绘制


    底色绘制是指你先涂一层底漆，作为后续艺术层的基底。尝试使用各种工具、颜色和技巧创作狂野而美妙的底色涂层。在这一第一层上尽情做任何你想做的事，因为你知道之后会覆盖它。底色涂层干燥后，在其上创作更具计划性的构图。原底色涂层的幽灵或元素会透出来，使你的速写本页面更复杂且独特。


    ![图像](img/f0100-01.jpg)


    创作初始层。你可以在这一层大胆而富有表现力，因为你知道之后会覆盖它。这给了你创造任何东西的自由——在这自由中常会发生神奇的事情。我使用了水彩颜料，创作了许多色彩斑斓的色块和斑点，然后在标记上喷雾以促进颜料在页面上混合。完成这一层后，让它干燥。


    ![图像](img/f0100-02.jpg)


    这一第二层是用黑色墨水创作的，但你可以用丙烯颜料或其他材料进行实验。我用铅笔快速勾勒出叶子的轮廓，然后用黑色墨水填充负空间。在决定放置叶子位置时，我选择了最喜欢且希望保持可见的底色涂层部分。选择你想要突出的区域和你愿意消除的区域。你的选择将决定你覆盖什么以及如何定位你的构图。你可能会在底色涂层中看到一些能激发下一层灵感的东西。


    ![图像](img/f0100-03.jpg)![图像](img/f0101-01.jpg)


    继续叠加层次并尝试不同的材料和色彩组合。此页的第三层使用了丙烯颜料。


    你可能会在底色涂层中看到一些能激发下一层灵感的东西。


    ![图像](img/f0101-02.jpg)


    我挑选了几种丙烯颜料放在调色板上。尝试使用管装颜料时调色板设置的各种方式。考虑布局如何影响你在创作时的感受以及你所产生的艺术。三到四色的有限调色板鼓励你混合它们并有意选择使用什么。你可能更喜欢有组织的调色板，或是混乱且直觉式的。


    ![图像](img/f0101-03.jpg)


    从大胆开始，随着每一层逐渐过渡到更详细和细腻的应用。在最后一层添加更精细的最终细节。


    ### 多层混合


    ![图像](img/f0102-01.jpg)


    我从想象中创作了这幅双页绘画，但受到了植物和叶子的影响。第一层用蜡笔绘制。第二层是阻抗蜡笔的水彩颜料。第三层是丙烯颜料。这种材料三重组合，按此顺序，是我特别喜欢且经常回用的。蜡笔创造出高强度的兴趣点，而水彩提供微妙的背景，有助于顶层的丙烯颜料脱颖而出。


    ![图像](img/f0103-01.jpg)


    我使用相同的三层组合创作了这两个跨页——首先是蜡笔，然后是水彩，最后是丙烯颜料。以独特有趣的方式混合材料会让你的艺术和速写本更具个人特色。尝试找到能反映你和你想要创作的艺术的材料组合。


    ### 自制工具


    尝试并从废弃、采集和找到的零碎物品中自制标记工具。在你的家中或邻里寻找可以蘸墨水制作有趣且不寻常标记的物品。考虑你丢弃的物品或使用废弃的天然材料，例如：


    • 细绳


    • 钉子和螺丝


    • 旧信用卡


    • 纸板碎片


    • 旧包装材料


    • 小树枝


    • 叶子


    • 羽毛


    • 松果


    如果需要让你的物品更容易使用或蘸墨水，可以将其粘在旧铅笔或棍子上，有效地将其变成画笔和工具。在旧盘子或容器上倒墨水并将工具蘸入其中。发现它们在你的页面上留下的标记。保持自由轻松：玩耍并看看你是否能创造出一系列标记，这些标记你可能希望永久融入你的速写本页面或艺术实践中。我经常使用这种技术在便宜的复印纸上制作自己的图案纸，然后将其用作速写本的拼贴材料。


- raw: 'It is not uncommon to find a blank white page a little daunting. If this is
    the case for you, try some of the following ways to get rid of the expanse of
    white. These simple methods create a few marks or a little color on the page that
    you then draw or paint over. These approaches add a little interest, put something
    on the page for you to respond to, and act as a starting point that takes away
    the whiteness.


    #### Leftover Paint


    Often when I have leftover paint in my palette, I use it to make a few dabs or
    random marks on blank pages in my sketchbook. These marks provide visual interest
    to work into or around when you use your sketchbook next.


    ![Image](images/f0066-01.jpg)


    **A** Get rid of a blank page by making random marks with paint. Achieve a rainbow
    effect by using a big brush and picking up two or more colors simultaneously on
    the brush tip.


    ![Image](images/f0066-02.jpg)


    **B** Allow your original marks to dry and work over them. Think about how you
    could feature some of the original marks on the page. Here I drew a quick tree
    shape and painted around the pencil to create a tree shape with the negative space.


    ![Image](images/f0066-03.jpg)


    **C** Consider building up many different layers in your artwork. Let each layer
    dry and add more detail or use a different brush.


    ![Image](images/f0067-01.jpg)


    Here are two sketchbook pages that were started with random lines. The larger
    one features patterns drawn with a black felt-tip pen. The smaller one features
    white ink on dark blue ink. The starting point for both pages was a few lines.
    In the black and white pages, a wiggly line was drawn down the page and across
    the page. This helped structure the pattern.


    #### Some Random Lines


    I might just draw one or two completely random lines across a page in a bit of
    a scribble. Try closing your eyes and drawing a few lines. Or listen to your favorite
    music while drawing lines. Then consider how you might like to develop your lines.
    Try drawing three lines with three different art materials. I might cover five
    or six pages this way, and then when I come back to my sketchbook, I often find
    the smallest beginning of something to respond to.


    #### Collage


    Collage or glue an interesting scrap of paper onto a blank page and then work
    over it.


    ![Image](images/f0068-01.jpg)


    Select an interesting fragment of paper to glue into your sketchbook.


    ![Image](images/f0068-02.jpg)


    Respond to the collaged element by using it as a starting point or springboard.


    #### Colored Ground


    I often paint a page pink or green and then draw or work over it. It is worth
    experimenting with colored backgrounds or grounds (the first or foundation layer)
    and see what they do to your artwork. Try different paints and colors and see
    what works for you. For example, use a white pen on a black page or experiment
    with different opacities of paint, such as starting with watercolor, letting it
    dry, and then painting over it with acrylic paint.


    ![Image](images/f0069-01.jpg)


    **A** Experiment with using different background colors. Paint your page and let
    it dry.


    ![Image](images/f0069-02.jpg)


    **B** Work over the colored area in your chosen medium. Here I used a black fine-line
    pen over a pink page.


    ![Image](images/f0069-03.jpg)


    **C** Experiment with different colored backgrounds and learn about the effect
    they can have on your finished work.


    ![Image](images/f0069-04.jpg)


    A randomly painted background can provide you with a starting point and stimuli
    to respond to.


    ![Image](images/f0070-01.jpg)


    Add a color or colors to a page as a background and then draw in some random lines.
    Ask yourself how you could develop this starting point. The example here reminded
    me of rain on hills, so I developed it into an impressionistic landscape.


    ![Image](images/f0070-02.jpg)![Image](images/f0070-03.jpg)


    Add layers of your chosen medium to build up your sketchbook page.


    ![Image](images/f0070-04.jpg)


    Experiment with spraying water on acrylic paint and moving your sketchbook around
    to create deliberate drips.


    ![Image](images/f0071-01.jpg)


    Once one layer is dry, build impact and visual interest by accentuating certain
    areas.


    ![Image](images/f0071-02.jpg)


    Select a brush to correspond with the type of effect you are after. A big, fat
    brush will create bold and gestural marks.


    ![Image](images/f0071-03.jpg)


    Experiment with drips and splashes to create movement. Here I went rather overboard
    on the splashes. If I were to redo this page, I would limit these and ensure they
    were not as uniform.


    ![Image](images/f0071-04.jpg)


    Think about the value tones of your page. In the example here, everything was
    looking very midtone, so I added dark blue watercolor paint and a little white
    paint on the horizon to vary the tones.


    ## CHAPTER 3


    ## TECHNIQUES FOR EXPLORING AND EXPERIMENTING


    This section contains a host of practical techniques that I use when making art.
    I explain different methods to explore and experiment, and share ways in which
    you can be inventive with mixing art materials. My hope is that you apply, adapt,
    and alter these techniques to use the art supplies you have.


    ![Image](images/f0072-01.jpg)


    ### CONSTRAINTS


    Infinite possibilities can sometimes be more paralyzing than liberating. It can
    feel daunting to know that you could do or create absolutely anything. Limitless
    options can lead to lack of action. You may find it useful to set some parameters
    and boundaries for yourself to help you overcome the issue of limitless choice.


    Sometimes too much freedom can prevent us from knowing what to do so we respond
    by doing nothing. When this is the case, a few self-imposed parameters give our
    creativity something to push against. Read through the selection of constraints
    that follow and pick the one that most resonates with you. Consider developing
    your own list of constraints to use when your inspiration is lacking:


    • Create a page in your sketchbook inspired by something you can see from where
    you are now.


    • Select a book you love, open it at random, and create something inspired by
    that page.


    • Open your fridge and pick out something to draw.


    • Pick a color and then wander around your home seeking an item or collection
    of items to draw that are that color.


    • Create pages that only use blue and orange.


    • Create three pages in 30 minutes, set a timer, and move to the next page after
    10 minutes.


    • Repeat or revisit a subject you have already drawn or painted; we often gain
    new insight through repetition.


    Pick one of these ten words as a starting point to create a page or series of
    pages in your sketchbook. For example, create a quick ideas map and list all the
    things that interest you about this word or concept. Think about how you could
    explore this theme in your sketchbook and then see where it takes you.


    1\. Weather


    2\. Maps


    3\. Home


    4\. Belonging


    5\. Science


    6\. Aging


    7\. Celebration


    8\. Injustice


    9\. Self


    10\. Seasons


    ![Image](images/f0075-01.jpg)


    Constraints can help you overcome option paralysis. An example of a constraint
    could be limiting yourself to draw or paint a subject you find in your kitchen.
    I found this piece of broccoli in my fridge.


    ![Image](images/f0075-02.jpg)![Image](images/f0075-03.jpg)


    When you are drawing, consider the aspect of your subject that you want to emphasize
    or accentuate. As I started to draw the piece of broccoli, it reminded me of a
    majestic oak tree, so I emphasized its silhouette by coloring in the background
    with a thick black felt-tip pen.


    ### SEEKING INSPIRATION OUTSIDE


    I encourage you to actively seek the wonder and awe in the world. Slowing down
    and taking the time to look around you can be an effective way to find subjects
    to paint or draw in your sketchbook. By slowing down, paying attention, and being
    more present and aware of our surroundings, we gain insight and inspiration.


    #### Getting into Nature'

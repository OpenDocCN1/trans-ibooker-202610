    When inspiration is elusive, assign yourself a small, achievable task or project
    that will somehow manufacture your missing inspiration. Work in your sketchbook,
    even if you don’t feel like it, to find and nurture that inspiration. Ideas can
    come from action. Select an exercise to do, dive in, and see where it takes you.
    Small, incremental actions tend to build on each other.


    ![Image](images/f0132-01.jpg)


    Your art should contain the essence of you, as it reflects how you see the world
    and how you capture that vision on a page.


    ![Image](images/f0133-01.jpg)


    If you’re waiting to feel truly inspired before you begin, you may never begin.
    Instead, start. Take action to find inspiration.


    ### ASSESSING WORK


    When you assess what you have created, turn away from negative judgment and instead
    explore your work with a sense of openness, curiosity, and detachment. If something
    isn’t working, turn the page and start over or come back to it another day.


    Never tear a page out of your sketchbook. If you absolutely must, repurpose it.
    If you don’t like how a page has turned out, either paint over it or cover it
    with a collaged page. But before you do anything with it, take some time to think
    it over. I often flick past a page that I actively disliked when I first made
    it, only to find that a few weeks later I really rather like it. If you don’t
    like a page, ask yourself the following questions before you do anything:


    • What do I not like about it?


    • What aspects do I like?


    • What elements were successful?


    • What elements were not as successful?


    • What would I do differently next time?


    ![Image](images/f0134-01.jpg)


    If you have created something in your sketchbook that you aren’t happy with, ask
    yourself questions about why you don’t like it and listen to your answers.


    ![Image](images/f0134-02.jpg)


    #### Embracing Mistakes


    There is always something of value in our mistakes. When we experiment, inevitably
    a page or pages of our sketchbook will look like a horrible mess.

    '
  trans: '

    从你的灵感地图中选择两个想法，并在同一页上将它们结合、对比或并置。以只有你能做到的方式将这些想法编织在一起。做出有趣的组合、关联或令人惊讶的联系。


    随着你艺术实践的发展，你在寻找自己的刺激物方面会变得更加自信。花时间思考和拆解你希望通过艺术实现的目标，会使定义你的方向变得更容易。意图的清晰指导行动。


    ![Image](img/f0124-01.jpg)


    从你的灵感地图中结合两个截然不同的想法，看看会发生什么。有时将想法结合起来可以产生一个比其构成部分更大的新概念。在我的原始灵感地图上，我写下了两个独立的想法：1)
    用垃圾制作速写本艺术，以及 2) 鸽子。我将这两个想法结合起来，用垃圾做了一只鸽子。


    ## 研究与探究


    一旦你有了想法，研究可以帮助你理解其背景并帮助你成长和加强它。研究可以帮助你对主题形成自己的回应，并为你提供多条可进入的途径。以下是研究你的主题的几种方法：


    • 寻找探索过类似主题的艺术家。在网上或书籍中阅读他们的资料。如果有机会，参观画廊并观看他们的作品。做笔记、绘画或直接从原作中汲取灵感都可能带来启发。


    • 将其他艺术家的作品作为跳板。这可以帮助你学习并发展自己的方法和风格。


    • 回顾你自己的作品和速写本，并记录下你喜欢且希望进一步探索的主题、过程或元素。你可能希望对你的速写或页面进行注释，并写下扩展它们的方法。


    ![Image](img/f0125-01.jpg)


    ## 收集与珍藏


    收集一些可以放入速写本的东西，例如想法片段、明信片、照片，以及你想进一步探索其作品的艺术家的名字。


    我可能会粘贴在我其他地方完成的但想保留的已完成作品的片段，或是我找到的东西、一张小复印纸、一个视觉提醒，或是一个我可以回头参考的提示。珍藏这些片段并安全地收集在速写本的页面中，让我能够翻阅我现在的和旧的速写本，并追溯久远的线索。


    ![Image](img/f0126-01.jpg)


    速写本可以是你收集手中、头脑和心中的东西的地方。将你以后可能想要重访的物品粘贴到速写本中。


    ![Image](img/f0126-02.jpg)


    你的速写本可以成为信息和想法的绝佳储存库。


    ![Image](img/f0127-01.jpg)![Image](img/f0127-02.jpg)


    使用你的速写本收集你认为在视觉上有趣的东西，例如杂志上的图片、明信片，或你想为将来参考而保留的艺术实验的小片段。


    ## 写作


    我经常通过写作建立联系和发展想法。如果有一个我感兴趣的主题，我可能会去图书馆、网上搜索，或阅读书籍以了解更多。我在阅读时做笔记，帮助我思考如何回应它、我个人对它感兴趣的是什么，或我可以在速写本中做什么来发展我的回应。有时意识流写作，即我不间断地写下所有我能想到、对某个主题感兴趣或知道的事情，可以是一种有用的工具。这种头脑倾倒可能包含有趣想法的种子。


    你可能想在速写本中做笔记。这是你的速写本用来实验的，所以做对你有意义的事情。尝试以下方法：


    • 写一些简短的笔记，描述你对所创作内容的回应，或反思你在创作过程中喜欢的部分。


    • 你可能想写一些技术笔记，关于你使用的颜色、如何调配某种特定色调的油漆，或你想记住的关于所用工具或材料的任何其他信息。


    • 如果你在实地作画，记下场景中最吸引你的元素。


    • 随意将你的速写本用作视觉笔记本，记录艺术家、想法或思想的笔记，以在未来提醒和激发你——某种程度上是供你回顾并取用东西的想法文件柜。


    • 描述一个想法的进展、你采取的步骤，或你如何发展你的思维过程。创建书面记录，以便日后可以复制该过程。


    • 记录关于如何推进一个想法、扩展它，或将其带向新方向或不同方向的想法。


    ![Image](img/f0129-01.jpg)


    在速写本中写作可以帮助你与所创作的内容建立联系。它可以是一个盘点和反思你所创作的内容的过程和成果的机会，或是一种记录你的观察和回应的方式。或者它也可以是记住你使用的材料、颜色或组合的一种方式。


    ![Image](img/f0129-02.jpg)


    # 第 5 章


    ## 练习与进步


    你已经掌握了技巧，并学会了如何在速写本中构思出富有创意的页面，这些页面是你独特的体现。现在是时候学习可能最重要的一部分：如何保持你的表达性速写本习惯，并将艺术长期融入你的生活。以下是一些你可以克服常见陷阱并以体贴和善良的心态培养你的艺术实践的想法。


    ![Image](img/f0130-01.jpg)


    ### 缺乏灵感


    当你灵感不足时该怎么办？不要坐等灵感找到你。相反，要主动去寻找它。在我感觉明显缺乏灵感的日子里，我会制造灵感。迈出微小的一步，做点什么，接近空白页面，开始行动，往往足以让事情运转起来。


    当灵感难以捉摸时，给自己分配一个小而可实现的目标或项目，以某种方式制造你缺少的灵感。即使你不想做，也在速写本中工作，以找到并培养那种灵感。想法可以源于行动。选择一个练习，投入其中，看看它会带你去哪里。小而渐进的行动往往会相互累积。


    ![Image](img/f0132-01.jpg)


    你的艺术应该包含你的本质，因为它反映了你如何看待世界以及你如何在页面上捕捉这种视野。


    ![Image](img/f0133-01.jpg)


    如果你在开始之前等待真正感到灵感，你可能永远不会开始。相反，开始吧。采取行动去寻找灵感。


    ### 评估作品


    当你评估自己创作的内容时，远离负面评判，而是带着开放、好奇和抽离的心态探索你的作品。如果某件事行不通，翻页重新开始或改天再回来。


    永远不要从速写本中撕掉一页。如果绝对必须这样做，请重新利用它。如果你不喜欢一页的成品，要么在上面重新上色，要么用拼贴页覆盖它。但在对它做任何事之前，花点时间思考一下。我经常翻过一页，而我第一次制作它时非常不喜欢它，但几周后我发现我其实相当喜欢它。如果你不喜欢一页，在做任何事之前问自己以下问题：


    • 我不喜欢它什么？


    • 我喜欢哪些方面？


    • 哪些元素是成功的？


    • 哪些元素没有那么成功？


    • 下次我会做哪些不同的事情？


    ![Image](img/f0134-01.jpg)


    如果你在速写本中创作了一些你不满意的东西，问问自己为什么不喜欢它，并倾听你的答案。


    ![Image](img/f0134-02.jpg)


    #### 拥抱错误


    我们的错误中总是有一些有价值的东西。当我们进行实验时，速写本中不可避免地会出现一页或几页看起来像可怕的混乱。


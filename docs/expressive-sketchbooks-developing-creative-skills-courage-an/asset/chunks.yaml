- raw: 'Use the rule of thirds in landscape painting and drawing: mentally draw lines
    across your view, splitting it horizontally and vertically into thirds or nine
    virtual boxes. Place important aspects of your composition on the lines or at
    the line intersections. Off-center compositions tend to be more interesting and
    reflect the way our eyes travel around a page. Any rule is, of course, made to
    be broken, so experiment with where you place key elements of your drawing or
    painting and consider the effect it has.


    ##### SIMPLIFY


    Decide on the essential aspect of the view you have selected and simplify your
    art to reflect this. Distill the view into its most crucial aspects. Experiment
    by drawing or painting only the most important part of what you see. Mentally
    break down your view into bold shapes and eliminate the details. Squinting or
    scrunching up your eyes while you look at your view can help you to focus on the
    dominant shapes and silhouettes.


    ![Image](images/f0088-01.jpg)


    Experiment by making quick studies and slower ones and see which you prefer. If
    you prefer to paint quickly and intuitively, you may want to take a stack of small
    pieces of thick watercolor paper and make quick studies on these prior to painting
    in your sketchbook.


    The following ten studies were painted in watercolor on pieces of paper only 2
    × 3 inches (5 cm × 7.5 cm) in diameter. The landscape has been simplified to little
    more than three stripes of color and painted with a big, fat brush. Painting many
    quick, small studies is a technique to help simplify your approach and get into
    the flow of painting without being too self-conscious about the outcome.


    ![Image](images/f0088-02.jpg)![Image](images/f0088-03.jpg)![Image](images/f0088-04.jpg)![Image](images/f0088-05.jpg)![Image](images/f0088-06.jpg)![Image](images/f0089-01.jpg)![Image](images/f0089-02.jpg)![Image](images/f0089-03.jpg)![Image](images/f0089-04.jpg)


    ##### ELIMINATE OR ILLUMINATE


    I encourage you to interpret the landscape you are viewing in your own unique
    way. Paint and draw the elements that interest you. We all see things differently
    and are moved by different elements. Before you start drawing or painting, ask
    yourself about what you see and why it appeals to you. Which aspect is most important?


    Your sketchbook page doesn’t have to be a superrealistic copy; you can choose
    to completely ignore parts, move trees around, and eliminate areas while illuminating
    others. Seek out the aspects that most intrigue you and think about how the landscape
    makes you feel, so you can capture a moment in time. Your drawing or painting
    is your interpretation. Your response is as much about you within the space as
    it is about the space itself.


    ![Image](images/f0090-01.jpg)


    Distill the view to its simplest shapes and aspects.


    ##### NEAR AND FAR


    When painting a landscape, know that the farther away something is from us, the
    bluer, duller, and fainter it looks. When something is closer to us, it looks
    darker, brighter, and more detailed. Use this knowledge to create the effect of
    space when painting a landscape that stretches into the distance.


    ##### PATHWAYS THROUGH


    Consider the metaphorical pathway through your artwork and how you can direct
    the eye to your focal point. In a landscape, think about a path to your focal
    point, i.e., how you can lead the eye to the element that you want to emphasize.
    Our eyes often follow lines in paintings, so experiment with how you use directional
    lines to point to the area of most interest. This can be an actual path or the
    removal of dark or heavy shapes that appear to block the way.


    ![Image](images/f0090-02.jpg)


    Small watercolor paintings tend to wrinkle and warp. An easy way to straighten
    them out is to let them dry completely, fold them inside an old tea towel, and
    iron them. Then paste them into your sketchbook.


    ### SEEKING INSPIRATION INSIDE


    Inspiration is everywhere. I invite you to walk around your home, thinking about
    the objects you surround yourself with, the things you have chosen to live with—the
    items, clothes, juxtapositions, patterns, books, and furniture that you have invited
    into your living space.


    ![Image](images/f0091-01.jpg)


    #### Beauty in the Mundane


    The act of seeking and finding more beauty in our day-to-day lives can have a
    cumulative effect. The more beauty and interest we appreciate, the more beautiful
    and interesting our lives become. Sometimes the ordinary can be extraordinary.
    Try to see things with different, fresh eyes to uncover and discover what interests
    you as you go about your normal everyday routines.


    Walk around your home with your camera or camera phone. Take photos of anything
    you find visually appealing—a small corner, an interesteing juxtaposition, or
    a shadow. Think about how you frame your photograph and whether it captures the
    area or element that interests you the most.


    Gather three or four objects that have some meaning to you and use them together
    in a still life arrangement. It may be that you don’t actually draw or paint the
    objects themselves in a representational way, but instead explore something of
    their essence in your sketchbook.


    ![Image](images/f0092-01.jpg)


    When selecting a subject to draw or paint in your sketchbook, consider both its
    aesthetics and its meaning and importance to you. This small pot was made at a
    pottery class with dear friends and reminds me of the special time we had. As
    well as its sentimental meaning, I am also drawn to the interesting patterns,
    cracks, and fissures in its glaze.


    ![Image](images/f0092-02.jpg)


    Try to find inspiration in your daily life. This scarf was scrunched up in my
    laundry pile. I appreciated the shapes it created and the colors as they folded
    together. I used it as a starting point for some abstract pages in my sketchbook.


    ![Image](images/f0093-01.jpg)


    Select something of interest to draw or paint in your home. Consider the color
    palette you would like to use if you’re using paint. Perhaps test out a limited
    color palette on a scrap of paper to see how your chosen colors work together.


    ![Image](images/f0093-02.jpg)


    Think about how you could distill your subject’s essence into some basic shapes
    or abstracted patterns. Here I made a few quick watercolor brushstrokes in response
    to the photograph of the scarf. I immediately sprayed water on it to make the
    painted lines flow, dance, drip, and merge into each other.


    ![Image](images/f0093-03.jpg)


    Let your initial marks dry and then respond to them, adding more detail with your
    chosen materials. I added hand-drawn detail using pencil, a fine-line black pen,
    and wax crayons.


    ![Image](images/f0094-01.jpg)


    Find subjects in your home to explore in your sketchbook. This is a tangle of
    embroidery thread that was in an old bag of sewing accessories.


    ![Image](images/f0094-02.jpg)


    This page in my sketchbook was inspired by the interwoven lines of the embroidery
    thread. When you select something to draw from your home, always consider what
    it is about your subject that appeals to you. Be curious about your own interests
    to better understand them.


    ![Image](images/f0095-01.jpg)


    This bag of zippers caught my eye. I was attracted to the shapes, the zig-zag
    texture of the fabric, and the patterns created by the metal teeth.


    ![Image](images/f0095-02.jpg)


    The zippers inspired these pages in my sketchbook. Take your own photographs and
    seek tiny inspirations in your home to kickstart some exploratory pages in your
    sketchbook. It only takes a small flicker of enthusiasm to get going. Once you
    have a small starting point or something to respond to, you can push off from
    the harbor and set sail.


    ### MIXED MEDIA'

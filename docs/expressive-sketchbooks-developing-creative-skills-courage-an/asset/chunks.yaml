    ![Image](images/f0004-01.jpg)


    ## INTRODUCTION


    ## WHAT IS AN EXPRESSIVE SKETCHBOOK?


    ### Nurture Your Creativity


    An expressive sketchbook is a playground for your imagination—a place to nurture
    your creativity and develop your own artistic style. In this book, I provide lots
    of guideposts to light your way and help you develop a sketchbook that feels uniquely
    yours.


    This book is about exploring your call to create and coaxing those ideas out onto
    the page. It is about helping you make art that only you can create.


    Know that your sketchbook will not be filled with flawless drawings or perfect
    outcomes. But the sometimes messy and joyful experiments will pave the way to
    discovering and refining your own visual style and artistic voice. Keep in mind
    that sketchbooks are where you develop an artistic practice, not where you turn
    up fully formed. They are part of the artistic journey; they are not the final
    destination.


    ![Image](images/f0006-01.jpg)


    Become confident through creating and experimenting. By making art more frequently,
    the art you make will improve.


    ![Image](images/f0007-01.jpg)


    Explore subjects and ideas that matter to you. A sketchbook is a safe place to
    try things out and learn more about your own interests and fascinations.


    ### Incorporate Art into Your Life


    A great sketchbook is not about perfect outcomes. It’s about learning and growing
    through doing. The sketchbook is a safe place to become more confident and courageous
    about your own creativity. It’s also where you can develop an approach to art
    and a process that lights you up, filling you with energy and enthusiasm. Think
    of your sketchbook as a place to have a creative conversation with yourself.


    ![Image](images/f0007-02.jpg)


    Become more inspired by creating more art. Don’t wait to feel ready to begin;
    by beginning and taking action, we become ready.


    ### Experimentation and Discovery


    There are no rules when it comes to sketchbooks, apart from experimentation and
    discovery. We become creative by creating. Your sketchbook may contain very few
    actual sketches. For some people, a sketchbook may be all about sketching from
    life, while for others it is about exploring color and composition or recording
    thoughts, memories, or ideas. My hope is that this book gives you a little creative
    rocket fuel to allow you to take off in your own artistic direction.


    ![Image](images/f0008-01.jpg)


    Make your sketchbook unique to you. It must reflect you as a person and be a place
    where you can explore topics and themes that resonate with you.


    ![Image](images/f0008-02.jpg)


    A sketchbook is an art adventure. Try different approaches and discover and uncover
    your artistic voice as you go.


    ![Image](images/f0009-01.jpg)


    My sketchbooks look like I made them. Your sketchbooks will contain pages that
    reflect you, and they will look like you made them.


    ![Image](images/f0009-02.jpg)


    A sketchbook is a place to create art that has personal value.


    ## CHAPTER 1


    ## MAGIC AND MOTIVATION


    Why develop your own sketchbook practice? Keeping a sketchbook will help you cultivate
    your own self-expression and creativity. This chapter is designed to help you
    unpack any obstacles and barriers that may be blocking your creativity. It will
    also help you understand your reason for starting a sketchbook and what you’d
    like your sketchbook to be. Look for tips on ways in which you can reflect upon
    and document your artistic interests and inspirations.


    ![Image](images/f0010-01.jpg)


    ### REASONS TO START A SKETCHBOOK


    You may not realize it now, but using a sketchbook can be life enhancing. The
    more you sketch, the more creative alchemy you are inviting into your life. Here
    are a few reasons to begin your very own sketchbook (or to continue in those moments
    when you feel stuck).


    ![Image](images/f0012-02.jpg)![Image](images/f0012-01.jpg)


    Play in a sketchbook to develop artistic skills. A sketchbook is a place to learn
    and grow—it will not be full of flawless masterpieces. Some pages will look like
    a mess, but that doesn’t matter.


    #### Explore Ideas


    Your sketchbook is a great place for you to understand, develop, and explore your
    artistic interests or preoccupations. Unpack what makes you curious about art
    and life and sketch those thoughts out on the pages. In developing a sketchbook,
    you take ideas from your head or your heart and bring them to life on paper.


    ![Image](images/f0013-01.jpg)


    A sketchbook offers an opportunity to spot patterns and recurring themes. These
    two sketchbook pages were created years apart. Notice the use of white floral
    silhouettes against a patterned background. By flicking through old sketchbooks,
    you can spot recurring themes and find connections.


    #### Log Your Creative Journey


    Use a sketchbook to record your creative awakening. Think of your sketchbook as
    a friend and companion on your artistic journey.


    ![Image](images/f0013-02.jpg)


    A sketchbook is a place to understand and explore what makes you curious. Take
    a germ of an idea and expand and explore it.


    #### Intimate/Safe Place


    Your sketchbook is for you. It can be a private and personal playground. You don’t
    have to share it with anyone. You don’t need to display its contents or put them
    on a wall. If you want to, you can close the cover and keep what is inside private,
    like your own conversation with yourself.


    ![Image](images/f0014-01.jpg)


    The contents of a sketchbook do not need to be shared publicly. Create art just
    for yourself, just for the joy of being creative. Sketchbook pages are for discovery,
    not display.


    ![Image](images/f0014-02.jpg)


    Sketchbooks record your artistic development and growth.


    #### Develop Your Skills


    We learn to create by creating. We get better by doing. Your sketchbook is a place
    to create and do, develop and progress.


    ![Image](images/f0015-01.jpg)


    Find pleasure in making something from nothing. Discover and develop by doing.
    Small, incremental actions build upon each other over time to grow skills and
    confidence.


    #### Look Back in Months or Years to Come


    Your sketchbook captures a season of your life. It can be very rewarding to keep
    all your sketchbooks and look back on where you were or what interested you at
    a certain time of your life. Social media has made it so easy for us to compare
    ourselves, our lives, our creative output, and our artwork with others. We often
    tend to compare our very worst efforts with someone else’s best efforts. Instead
    we should compare our work against our work and ask ourselves: Am I learning?
    Am I developing? Am I expressing myself? Am I feeling fulfilled by my output?
    Am I pushing myself?


    ![Image](images/f0015-02.jpg)


    Look back at old sketchbooks and discover past interests or fascinations. A sketchbook
    allows you to track ideas and progress over time.


    ![Image](images/f0016-01.jpg)


    A sketchbook is a ready-made filing system for your ideas.


    ![Image](images/f0016-02.jpg)


    The completed pages of art sit together in one bound volume.


    #### All in One Place


    Your sketchbook is a brilliant filing cabinet of ideas, all kept safe and sound
    in one place.


    #### A Beautiful Object


    Your sketchbook can develop into a beautiful object. You may really appreciate
    the way the completed pages of your sketchbook remain together in one bound volume.


    #### Rewarding


    Making art for yourself can be nourishing and rewarding. Experimenting in your
    sketchbook can lift your spirits and bring joy to your life. There is something
    extremely satisfying about turning a blank page into something filled with meaning
    or learning, color or line.


    ![Image](images/f0017-01.jpg)


    It is gratifying and fulfilling to turn a blank page into a page alive with art
    and personal meaning.


    #### Process, Not Outcome'

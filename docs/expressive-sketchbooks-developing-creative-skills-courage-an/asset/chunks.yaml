    of your signature style. Play with pressure and speed and see what you can make
    from very little. Use many pages, don’t limit yourself, and be expansive.


    ![Image](images/f0106-01.jpg)


    Discover the mark-making possibilities of each item and which ones resonate with
    you.


    ![Image](images/f0106-02.jpg)![Image](images/f0106-03.jpg)


    Consider how you can incorporate the marks you have made into your sketchbook
    practice. Perhaps you would like to create papers for collage use or draw and
    paint with these tools. Here I used nails and twigs to create leaf shapes. I used
    black ink on white paper and white ink on a page I prepared with a base coat of
    black ink.


    ![Image](images/f0106-04.jpg)


    ## Collecting and Making Papers for Collage


    Keep a collection of interesting, diverse papers to use for collaging in your
    sketchbook. Use them to create a background or cut them up to incorporate into
    an artwork. Just sorting and sifting through a pile of hand-chosen papers can
    prompt ideas. Enjoy the tactile nature of sifting through a stack of lovingly
    collected papers.


    ![Image](images/f0107-01.jpg)


    Looking through a selection of papers you have made or collected can prompt ideas
    and spark a starting point from which to create.


    I invite you to collect your own papers for collage. Consider exploring the following
    ideas:

    - Go through old magazines and cut out sections of pattern or color that appeal
    to you.

    - Repurpose found papers, maps, old envelopes, old letters, and various tickets
    or receipts.

    - Consider using the pages of old and worn books.

    - Photocopy sections from your sketchbook to play around with, cut up, and alter
    into something new. I especially like to do this if there is a drawing or page
    I really like and want to preserve. Photocopying it and experimenting with the
    copy is a low-risk strategy that keeps the original intact.

    - Keep interesting pieces of packaging or wrapping paper, shiny candy wrappers,
    or foil wrapping.

    - Gather bits and pieces from past artistic experiments or pages on which you’ve
    cleaned your brushes or tested color choices.

    - If you have leftover paint, use it to paint blank sheets of paper to incorporate
    later into collage pieces. Try using bold and exaggerated brush marks to create
    interesting textures. Also, use the mark-making tools exercise (shown [here](#ch03.xhtml#page_104))
    to create pages for collaging.


    ![Image](images/f0108-01.jpg)


    When collecting or making papers for use in your sketchbook, consider those that
    hold aesthetic appeal or some meaning to you.


    ![Image](images/f0108-02.jpg)


    ## Using Collage Papers


    The following are collage techniques that I use in my sketchbook. Use them as
    a starting point for developing your own practices.


    ![Image](images/f0109-01.jpg)


    Choose a photograph as a reference or starting point. I selected a photograph
    I had taken of leaves on a wet day.


    ### COLLAGE USING A REFERENCE PHOTOGRAPH


    ![Image](images/f0110-01.jpg)


    Look through the papers you have collected. Select those that you want to incorporate
    into this collage. They may mirror an aspect of your reference photograph in some
    way. I selected a patterned page of dots I created with a nail and a twig dipped
    in ink.


    ![Image](images/f0110-02.jpg)


    Select the areas of the collage paper to incorporate into your sketchbook. You
    may find it helpful to draw the shapes you want with a pencil before you cut them
    out. Reference your photograph and use it as a guide to the shapes you draw and
    cut.


    ![Image](images/f0110-03.jpg)


    Reference photograph.


    ![Image](images/f0111-01.jpg)


    Experiment with different placements on the page before gluing anything down.
    Move your collage pieces around until you find a pleasing composition. When you
    are happy with the placements, glue the pieces onto the page. I use an old brush
    to paint a thin layer of water-based glue that dries with a matte finish onto
    the back of the shapes.


    ![Image](images/f0111-02.jpg)


    Let the glue dry and finish by adding drawn details, if needed. I used a black
    fine-line pen to connect the leaves to the stalk.


    ### COLLAGE FROM IMAGINATION


    ![Image](images/f0112-01.jpg)


    Use your collection of papers to spark ideas. Create a collage from your imagination.
    Experiment by working instinctively with no plan and no intended outcome. Choose
    a few papers from your collection and let this selection alone be your starting
    point. Cut out shapes and elements intuitively.


    ![Image](images/f0112-02.jpg)


    Consider how your collage elements relate to one another, arrange them on your
    sketchbook page in various ways, and choose a composition that appeals to you.
    Paint a thin layer of glue on the back of each collage piece and press them on
    your sketchbook page. Wait for the glue to dry.


    ![Image](images/f0112-03.jpg)


    Consider using your art materials to add drawn or painted elements to your composition.
    When I returned to this collage after the glue dried, I was reminded of rocks
    and a waterfall. I added drawn lines with a black felt-tip pen and a fine-line
    pen to emphasize this aspect.


    ### COLLAGE AND PAINT


    ![Image](images/f0113-01.jpg)


    As described earlier in the mixed-media section (shown [here](#ch03.xhtml#page_100)),
    create an underpainting in your sketchbook, a wild and wonderful creation where
    anything goes. This is just the foundation layer for your collage; it helps cover
    the white page and give your collage a background. I painted this one with watercolors.
    If you are using a reference source or photograph to inspire you, use it to inform
    the colors and types of marks in the underpainting.


    ![Image](images/f0113-02.jpg)


    Once the underpainting is dry, make a few selections from your collage paper collection.
    Cut out the shapes and elements you want to include and arrange them on the page
    before gluing. This allows you to experiment and move them around to find the
    most pleasing composition. Glue them when you are happy with their placement.


    ![Image](images/f0113-03.jpg)


    Once the collage elements are glued in place and this layer has dried, consider
    whether you would like to incorporate additional drawn or painted elements. I
    drew additional lines to emphasize the leaves.


    ## Black and White Versus Color


    Experiment with both monochrome and colorful applications. You may want to re-create
    the same image over and over again, using different colors and techniques each
    time. This sort of repetition can be enlightening. It can become an iterative
    process where you learn about your subject, hone your preferred color palette,
    and discover the techniques that best serve your art.


    Experiment by mixing black and white components with colorful elements on the
    same sketchbook page. You may find the high contrast between the achromatic and
    the multicolored elements to be pleasing. The following are ways to explore monochrome
    and color:


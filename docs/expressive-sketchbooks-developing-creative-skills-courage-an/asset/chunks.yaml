- raw: 'Select two ideas from your inspiration map and combine, contrast, or juxtapose
    them on one page. Weave these ideas together in a way that only you can. Make
    interesting combinations, associations, or surprising connections.


    As you develop your artistic practice, you will become more confident in finding
    your own stimuli. Spending time considering and unpacking what it is you want
    to achieve through your art makes it easier to define your direction. Clarity
    of intention informs action.


    ![Image](images/f0124-01.jpg)


    Combine two disparate ideas from your inspiration map and see what happens. Sometimes
    joining ideas can lead to a new concept that is bigger than its constituent parts.
    On my original inspiration map, I had written two separate ideas: 1) making sketchbook
    art from rubbish, and 2) pigeons. I combined these two and made a pigeon from
    rubbish.


    #### Researching and Investigating


    Once you come up with an idea, research can help you understand its context and
    help you to grow and strengthen it. Research can help you develop your own response
    to a theme and provide multiple doorways for you to step through. The following
    are a few ways to research your topic:


    • Look for artists who have explored similar themes. Read about them online or
    in books. If you have the chance, visit galleries and look at their work. Taking
    notes, drawing, or engaging directly from an original artwork can be illuminating.


    • Use other artists’ work as a springboard. This can help you learn and develop
    your own approach and style.


    • Look back at your own artwork and sketchbook and take notes about the subjects,
    processes, or elements that you enjoyed and would like to explore further. You
    may want to annotate your sketches or pages and write down ways in which to expand
    on them.


    ![Image](images/f0125-01.jpg)


    ### COLLECTING AND TREASURING


    Collect things to include in your sketchbook, such as fragments of ideas, postcards,
    photographs, and the names of artists whose work you want to explore further.


    I might paste in a fragment of a finished artwork I completed elsewhere but want
    to keep, or something I have found, a small photocopy, a visual reminder, or a
    prompt that I can return to. Treasuring these fragments and collecting them safely
    in the pages of my sketchbook allows me to flick through my current and old sketchbooks
    and follow a thread from long ago.


    ![Image](images/f0126-01.jpg)


    A sketchbook can be your place to gather the things you have collected in your
    hands, your head, and your heart. Paste items into your sketchbook that you may
    want to revisit later.


    ![Image](images/f0126-02.jpg)


    Your sketchbook can be a wonderful repository of information and ideas.


    ![Image](images/f0127-01.jpg)![Image](images/f0127-02.jpg)


    Use your sketchbook to collect things that you find visually interesting, such
    as images from magazines, postcards, or small fragments of your art experiments
    that you want to keep for future reference.


    ### WRITING


    I often make connections and develop ideas through writing. If there is a subject
    I am interested in, I might go to the library, poke around online, or read books
    to learn more about it. I make notes as I read to help me think through how I
    could respond to it, what interests me personally about it, or what I could do
    in my sketchbook to develop my response. Sometimes stream-of-consciousness writing,
    in which I write down everything I can think of that interests me or that I know
    about a topic without stopping, can be a useful tool. This kind of brain-dump
    may contain the seed of an interesting idea.


    You may want to make notes in your sketchbook. It is your sketchbook to experiment
    with, so do what makes sense for you. Try the following:


    • Write some brief notes that describe your response to what you have created
    or reflect upon what you enjoyed about the process of creation.


    • You might want to write technical notes about the colors you used, how you mixed
    a particular shade of paint, or anything else you want to remember about the tools
    or materials you used.


    • If you are drawing on location, take notes about the elements of the scene that
    most appeal to you.


    • Feel free to use your sketchbook as a visual notebook, capturing notes of artists,
    ideas, or thoughts to remind and stimulate you in the future—an idea filing cabinet
    of sorts for you to look back on and pull things out of.


    • Describe the progression of an idea, the steps you took, or how you developed
    your thought process. Create a written record so you can replicate the process
    later.


    • Capture thoughts about how to progress an idea, expand on it, or take it in
    a new or different direction.


    ![Image](images/f0129-01.jpg)


    Writing in your sketchbook can help you connect with what you have created. It
    can be an opportunity to take stock and reflect on the process and outcome of
    what you have created or a way to record your observations and response. Or it
    can also be a way to remember the materials, colors, or combinations you used.


    ![Image](images/f0129-02.jpg)


    ## CHAPTER 5


    ## PRACTICE AND PROGRESS


    You’ve tackled the techniques and learned how to dream up creative pages in your
    sketchbook that are a unique reflection of you. Now it’s time to learn what may
    be the most important part of the process: how to maintain your expressive sketchbook
    routine and incorporate art into your life for the long term. Here are a few ideas
    for ways you can overcome common pitfalls and nurture your artistic practice thoughtfully
    and with a kind heart.


    ![Image](images/f0130-01.jpg)


    ### LACK OF INSPIRATION


    What do you do when you have little inspiration? Don’t wait around for it to find
    you. Instead, go and actively seek it out. On days when I’m feeling decidedly
    uninspired, I manufacture it. Taking a tiny step, doing something, approaching
    the blank page, and just starting are often enough to get the ball rolling.


    When inspiration is elusive, assign yourself a small, achievable task or project
    that will somehow manufacture your missing inspiration. Work in your sketchbook,
    even if you don’t feel like it, to find and nurture that inspiration. Ideas can
    come from action. Select an exercise to do, dive in, and see where it takes you.
    Small, incremental actions tend to build on each other.


    ![Image](images/f0132-01.jpg)


    Your art should contain the essence of you, as it reflects how you see the world
    and how you capture that vision on a page.


    ![Image](images/f0133-01.jpg)


    If you’re waiting to feel truly inspired before you begin, you may never begin.
    Instead, start. Take action to find inspiration.


    ### ASSESSING WORK


    When you assess what you have created, turn away from negative judgment and instead
    explore your work with a sense of openness, curiosity, and detachment. If something
    isn’t working, turn the page and start over or come back to it another day.


    Never tear a page out of your sketchbook. If you absolutely must, repurpose it.
    If you don’t like how a page has turned out, either paint over it or cover it
    with a collaged page. But before you do anything with it, take some time to think
    it over. I often flick past a page that I actively disliked when I first made
    it, only to find that a few weeks later I really rather like it. If you don’t
    like a page, ask yourself the following questions before you do anything:


    • What do I not like about it?


    • What aspects do I like?


    • What elements were successful?


    • What elements were not as successful?


    • What would I do differently next time?


    ![Image](images/f0134-01.jpg)


    If you have created something in your sketchbook that you aren’t happy with, ask
    yourself questions about why you don’t like it and listen to your answers.


    ![Image](images/f0134-02.jpg)


    #### Embracing Mistakes


    There is always something of value in our mistakes. When we experiment, inevitably
    a page or pages of our sketchbook will look like a horrible mess.'

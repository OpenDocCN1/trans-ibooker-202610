- raw: "![Image](images/f0143-01.jpg)\n\n## ACKNOWLEDGMENTS\n\nA huge debt of gratitude\
    \ to all the lovely folks at Quarry Books for their vision, patience, and book-making\
    \ brilliance, including Mary Ann Hall, Marissa Giambrone, Renae Haines, Joy Aquilino,\
    \ and Lydia Anderson.\n\nAlso, a huge thanks to Georgina Piper for the wonderful\
    \ photographs she took for me.\n\n## ABOUT HELEN WELLS\n\n**Helen Wells** is an\
    \ artist from the South Coast of England. Her artworks are intricate, organic,\
    \ and depict illusionary surfaces or landscapes. With multiple layers, fragments,\
    \ colors, and obsessive decorative details, her ethereal, patterned works bring\
    \ to mind elements of the natural world or magical otherworlds.\n\nHer artworks\
    \ are in private collections all over the world and have been featured on numerous\
    \ products from book covers to wine bottles. In 2014, as a cowinner of the Winsor\
    \ & Newton Water Colour Revolution competition, her painting was displayed in\
    \ London’s Saatchi Gallery. She has appeared in magazines and exhibited her work\
    \ at one of Gordon Ramsay’s restaurants in London.\n\nShe became an artist later\
    \ in life after working in an office job for many years. She credits her use of\
    \ sketchbooks with finding her artistic style and the courage to develop her art\
    \ outside of their pages. She is passionate about sketchbooks as a tool for self-discovery,\
    \ play, and creativity and keen to share everything she has learned along the\
    \ way.\n\n**[www.helenwellsartist.com](http://www.helenwellsartist.com)**\n\n\
    This book is dedicated to my wonderful husband, Mark Barker, who has always encouraged\
    \ me to color outside of the lines.\n\n[![Image](images/copy.jpg)](http://www.QuartoKnows.com)\n\

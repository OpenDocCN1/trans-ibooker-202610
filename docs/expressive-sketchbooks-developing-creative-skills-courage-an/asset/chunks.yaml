    pages, i.e., courage, truth, or equality.


    ![Image](images/f0118-01.jpg)


    This example of an imaginary landscape was made with a twig dipped in ink.


    #### People and Places

    - Draw a series of self-portraits that highlight something important about you
    or include symbols or motifs that are personal to you.

    - Create pages in your sketchbook that explore aspects of a place that has meaning
    to you.

    - Use where you live as a starting point and create art in your sketchbook that
    is inspired by home.

    - Create a page in your sketchbook dedicated to a person who is special to you.


    #### Emotion and Imagination

    - Select an emotion that resonates with you and try to depict it.

    - Create art pages inspired by a childhood memory.

    - Create an imaginary world, city, or landscape in your sketchbook.

    - Dedicate a page of your sketchbook to a dream.

    - Select a poem or song you love and use it to inspire a page in your sketchbook.
    For example, you could try the expressive mark-making exercise while listening
    to the song and see what it does to the quality and variety of your marks.


    ![Image](images/f0119-01.jpg)


    Try creating a landscape or cityscape from your imagination. This patchwork forest
    was drawn with a fine-liner pen and marker pen. Experiment with incorporating
    patterns and marks from the mark-making exercise.


    #### Objects and Things

    - The objects we surround ourselves with have meaning. Select a few items that
    have significance to you and use them as a starting point for a sketchbook page.

    - Pick an object that you find beautiful and draw it repeatedly on the same page
    or with different materials.

    - Dedicate a page to something you were going to throw out, such as a piece of
    overripe fruit, a vegetable, or a piece of packaging.

    - Reserve a page for a found object. It could be something that someone else has
    discarded or something from nature, such as a pinecone or branch that you found
    on a walk.


    ![Image](images/f0120-01.jpg)


    Beauty can be found in simple discarded items. This sketchbook page was inspired
    by some jumbled string.


    ![Image](images/f0120-02.jpg)


    Experiment by drawing an object over and over again on the same page. This page
    contains lots of quick drawings of a small piece of seaweed I found on the beach.


    ![Image](images/f0121-01.jpg)


    A single interesting starting point can take you in many different directions.
    Experiment by using repetition on the same page. I created these leaves using
    many different art materials, including collage, black fine-line pen, watercolor,
    and a permanent white marker pen.


    Pick one of the following themes and look for examples of it in your home or neighborhood.
    Take photographs to use as reference material for your sketchbook pages:

    - Looking through

    - Balance/imbalance

    - Juxtapositions

    - Weathered/rusting

    - Circles

    - Lines and angles

    - Skyline

    - Relationships and connections


    ![Image](images/f0121-02.jpg)


    A small, seemingly insignificant item can be fascinating to draw. Try drawing
    a found twig or a dried weed, for example.


    ### EXPANDING AN IDEA


    One way to grow your ideas is to revisit your inspiration map and pick one of
    its threads to expand upon. New ideas can come from expanding a single concept
    on your map.


    Begin by taking the one idea and placing it at the center of a new map. Write
    down all the ways you may want to explore this theme—anything at all that comes
    to mind. Write down everything—don’t edit yourself—and just let the ideas and
    associations flow. On my original ideas map, I wrote down “fish scales.” I grew
    this idea by scribbling down ways in which I might employ the inspiration of fish
    scales in my sketchbook. Some of my ideas included using iridescent paint, looking
    at the shape of fish scales under a microscope, making fish scales from aluminum
    foil, investigating the purpose of fish scales, and researching different patterns.


    ![Image](images/f0122-01.jpg)![Image](images/f0123-01.jpg)


    Use your sketchbook to capture ideas. Your sketchbook doesn’t need to be full
    of completed artworks; instead use it as a repository for fledgling ideas, the
    beginnings of something, or the seeds of a thought you may want to revisit later
    to grow and nurture.


    ![Image](images/f0123-02.jpg)


    #### Combining Ideas


    Make interesting and personal art works by not only layering art supplies, but
    by mixing layers of meaning and combining ideas.


    Your sketchbook can be a place to integrate your interests and allow them to intersect
    and intertwine.


    Taking two disparate ideas from your inspiration map and fusing them together
    on one sketchbook page can be a starting point for creating art that is personal
    and has a unique significance for you.


- raw: 'This is a super-quick exercise in which you draw the object without looking
    at the page. Instead, focus on your subject matter. Don’t let your pencil or pen
    leave the page—it should follow your eyes as you look at the contours and outlines
    of the object. Your drawing may look weird and distorted at first, but this technique
    helps to free you up, allowing you to really examine and understand what you are
    drawing, and not worry about the end result.


    You can’t be too precious about a drawing if you’re not allowed to even look at
    the page as you draw. The drawing can capture the essence of your subject and
    create an interesting starting point that you may add to and develop or leave
    just as it is.


    ![Image](images/f0055-01.jpg)


    Quick, simple drawings are a good way to find your rhythm and not overthink what
    you are creating.


    #### Draw the Space Around the Object


    It is useful to think about the area around your subject—the negative space. We
    often assume we know what a certain object looks like, so we draw how we *think*
    it looks rather than what we actually see. Drawing the space around the object
    is one way to capture its true form.


    By drawing the space around the object instead of the object itself, you bypass
    your assumptions. You are not drawing the thing, you are drawing the space that
    the thing sits in, which encourages you to draw from observation rather than assumption.


    ![Image](images/f0056-01.jpg)


    Drawing the space around your object can lead to dynamic and complex results.


    #### Timed Sketches


    Setting time limits can be particularly helpful when getting started. Because
    you only allow yourself a limited amount of time, this technique takes the pressure
    off. The lower the expectations, the freer and more expressive you become. Draw
    the same subject with different time limits and then compare each drawing. Try
    the following:


    • 1 minute


    • 5 minutes


    • 20 minutes


    • 1 hour


    ![Image](images/f0057-01.jpg)


    This drawing took less than a minute. Two drawings that took longer are on the
    next page.


    ![Image](images/f0058-01.jpg)


    This drawing was completed in fewer than 5 minutes.


    ![Image](images/f0058-02.jpg)


    This drawing was completed in 1 hour. Try drawing the same subject in different
    time allowances and compare the drawings.


    #### Developing Your Drawings


    There are many ways to adapt these simple drawing exercises to make them your
    own. Here are a few examples:


    • Try the same exercise using different materials or combining materials that
    you have, such as felt-tip pens, pencils, biro pens, ink and a brush, or watercolors.


    • Draw the same subject again and again on the same page.


    • Try doing more than one of these exercises on the same page.


    • Complete one drawing and then turn your sketchbook to a different angle and
    draw a second similar drawing over the top of the first.


    • Draw your subject at a massive scale so only part of it fits on the page. Then
    draw it much smaller on the same page.


    • Add color to highlight certain aspects of your drawing.


    ![Image](images/f0059-01.jpg)


    Experiment by drawing the same thing multiple times on one page. Turn the sketchbook
    sideways or upside down and draw over the top of another drawing at a different
    angle.


    ![Image](images/f0059-02.jpg)


    Draw a couple of quick one-line drawings on top of each other. Look for the interesting
    shapes that are created by the two drawings. Select areas to shade or color to
    create a composition.


    ### REVEL IN VISUAL VARIETY


    When working in your sketchbook, consider how you create variety and variation
    on one page or on a double spread. Difference, contrast, and variation can be
    what makes a page interesting, dynamic, and full of energy. There are so many
    ways to incorporate visual variations. Here are some:


    #### Light and Dark


    Consider the tonal differences in the art pages you create. Incorporate a variety
    of light, mid-tone, and dark areas. For example, if you are using a pencil, alter
    the pressure to experiment with making a variety of tones. When using colored
    materials, consider the tonal value in addition to the actual color.


    ![Image](images/f0060-01.jpg)


    Our eyes are visual sensors that are particularly sensitive to light and dark.
    Tonal differences and contrast on a page help our eyes to travel around the page.


    ![Image](images/f0060-02.jpg)


    Incorporate a mixture of light and dark areas to add energy to your art.


    ![Image](images/f0060-03.jpg)


    The light and dark values of a piece of art are its most important visual aspects.


    #### Big and Small Marks


    It can be useful to use a variety of different marks, both big and small, to create
    interest and variation. Try using a big brush and a small brush on the same page.
    Contrast quick marks with slower, more deliberate marks.


    ![Image](images/f0061-01.jpg)


    Vary the marks to create visual interest. Test the difference between marks made
    in different ways. Explore a diversity of ways to make the same mark, fast or
    slow, large or small, with heavy pressure or gentle pressure.


    #### Delicate and Bold Areas


    If you have a particularly bold area on a page, you may want to consider also
    having an area that is softer, more delicate, or fainter.


    ![Image](images/f0062-01.jpg)


    Be conscious of how you use bold and delicate areas. On these sketchbook pages,
    the delicate watercolor washes are contrasted with more definitive pen drawings.


    ![Image](images/f0062-02.jpg)


    On this double-page spread, the dark, bold sections are surrounded by softer areas.


    ![Image](images/f0062-03.jpg)


    These pages were created with collaged papers and incorporate confident, bold
    areas with parts that are fainter and more subtle.


    #### Busy and Quiet Areas


    Incorporate quiet areas, which are more restful, to allow the intense areas of
    your work of art to breathe.


    ![Image](images/f0063-01.jpg)


    Contrast the busy areas on your page with quieter sections that feel more restful.
    This provides breathing space and contrast. On this page that was created with
    a base of bright watercolor blobs, a layer of pale pink acrylic paint over the
    top creates a quieter foil for the more intense areas.


    ![Image](images/f0063-02.jpg)


    A white space or quieter area in the center of a page can act as an invitation
    to look into the page, a space through which you can enter the artwork.


    ![Image](images/f0063-03.jpg)


    #### Variety of Tools and Materials


    Using a variety of tools and materials and their contrasting properties can bring
    energy and interest to your artwork.


    ![Image](images/f0064-01.jpg)


    These pages were made using acrylic paint, collage, a white pen, and colored felt-tip
    pens. Try mixing unusual combinations of art materials on one page.


    #### Curves and Straight Edges


    Another way to bring contrast is to be mindful about your use of curved, straight,
    or angular lines and shapes.


    ![Image](images/f0064-02.jpg)


    Experiment by including organic and geometric shapes on the same page.


    ![Image](images/f0064-03.jpg)


    Incorporate both straight and curved lines into your artwork.


    #### Variety of Colors


    You can incorporate visual variety by using color in several ways. Try using black
    and white with color on the same page. Use both warm and cool tones, and muted
    and vibrant tones, on the same page. Employ colors that are opposite each other
    on the color wheel on the same page.


    ![Image](images/f0065-01.jpg)


    The base for this page is green and red, which are opposites on the color wheel.


    ![Image](images/f0065-02.jpg)


    Blue and orange are opposite each other on the color wheel, as are purple and
    yellow. Try using a color with its opposite.


    ### GETTING RID OF THE WHITE PAGE'

    The wax crayon creates high-intensity points of interest and the watercolor provides
    a subtle background that helps the top layer of acrylic paint stand out.


    ![Image](images/f0103-01.jpg)


    I created these two spreads using the same combination of three layers—first wax
    crayon, then watercolor paint, and finally acrylic paint. Mixing materials in
    unique and interesting ways will make your art and sketchbook feel personal to
    you. Experiment to find a combination of art materials that reflects you and the

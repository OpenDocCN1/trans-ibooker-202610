    something, you must spend time really looking at the object or subject. It’s not
    just about seeing the shapes and lines of what’s in front of you, it’s about determining
    its intrinsic nature and purpose and discovering your response to it.


    As you begin to draw, you may feel awkward or apprehensive, yet with most things
    in life, the more you do something, the more confident and at ease you become.
    Try to approach the page with a sense of curiosity and possibility. Asking yourself
    questions as you make your art is a good way to stay conscious and connected to
    what you are making. Consider the following questions:


    • What is it about this subject matter that interests or excites me?

    • What about the subject’s essence would I like to convey in my drawing or painting?
    Is there something about its shape, form, texture, shadow, or silhouette that
    particularly appeals to me?

    • Which materials are best suited to my subject matter?

    • What do I want to learn through doing?

    • How do I want to feel as I create?

    • What do I actually feel as I create?


    ![Image](images/f0051-01.jpg)


    Select objects to draw that have meaning to you. Here I have drawn my mother’s
    button box and sewing materials. This drawing is made with fine line and felt-tip
    pens.


    ![Image](images/f0051-02.jpg)


    When you draw something, you are making a connection with it. As your pen or pencil
    dances around the paper trying to represent what you see, you have an opportunity
    to understand the thing you are looking at better than you did before.


    ### Selecting Something to Draw


    Select your objects or subject matter carefully as they are important. What you
    draw or paint should matter to you in some way. It’s very hard to draw things
    that you have no interest in or connection with.


    The item or items you select to draw should have something in their essence that
    interests you, intrigues you, and appeals to you.


    ![Image](images/f0052-01.jpg)


    Be mindful when you select something to draw or paint. Selecting your subject
    is an important part of the process.


    ### More Looking Than Drawing


    Spend more time looking than drawing, even if you are completing the super-quick
    exercises. By being mindful and slowing down to see and study your subject, you
    are more likely to capture what you are trying to draw.


    Taking the time to look closely helps us draw what is in front of us rather than
    what we think is in front of us. I tend to draw items as I think they should look,
    instead of how they look. When I spend more time focusing and really observing,
    my drawings better reflect the reality of what I am drawing.


    ![Image](images/f0053-01.jpg)


    Drawing helps you see and understand your subject matter with new eyes.


    ### Ways to Start Drawing


    There is an energy and vibrancy about a quick drawing, an off-the-cuff quality
    that can be very liberating. A speedy drawing can have a certain beauty and an
    immediacy. When you practice quick drawing, try drawing several images on one
    page or do one drawing over and over again. Approach the same drawing with a variety
    of art tools, such as a pencil or thick felt-tip pen. If you haven’t drawn in
    many years, you may feel reticent to start. I am cheering for you! I encourage
    you to take action, dive in, and start drawing.


    The following are simple exercises to try on your subject of choice. They are
    designed so you have the freedom to experiment with them and make them your own.


    ![Image](images/f0054-01.jpg)


    Drawing is not just about the result; it is also about the practice, the experience,
    being in the moment, the actual doing, and all the lovely learning that happens
    along the way.


    ### Don’t Look at the Page


    - 保留有趣的包装或包装纸、闪亮的糖果包装或箔纸包装。

    - 收集过去艺术实验的碎片或用来清洗画笔、测试色彩选择的页面。

    - 如果有剩余颜料，可用它给空白纸张上色，以便日后融入拼贴作品。尝试使用大胆夸张的笔触创造有趣的纹理。另外，使用制笔触工具练习（所示 此处）来制作拼贴用纸。



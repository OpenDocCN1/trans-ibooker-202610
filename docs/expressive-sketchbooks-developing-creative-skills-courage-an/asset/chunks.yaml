    Experiment by using your favorite art materials and supplies on the same page.
    Go wild with different combinations to discover the alchemy that can come from
    mixing things up. Sometimes combinations work beautifully and sometimes they don’t.
    The element of surprise is part of the process of discovery. The “anything goes”
    mentality can help you enjoy the process without being too concerned or judgmental
    about the outcome. When we give ourselves the freedom to explore and experiment,
    we learn more about ourselves as artists and creative people.


    ![Image](images/f0096-01.jpg)


    Using a wide variety of materials can lead to a sense of discovery and possibility
    when creating art.


    Playing with our materials allows us to better understand their properties and
    unique qualities. This open inquiry about our art materials allows us to relish
    and enjoy the sensory and tactile nature of making art. In touching the materials,
    we create a physical connection to our tools and our creations. Be bold. Foster
    a sense of adventure and revelation by using the materials you have in various
    combinations. Here are some of my go-to mixed-media combinations:


    ### Paint and Pen


    Create a colorful background or foundation layer using watercolor or another type
    of paint, then draw over it with a black fine-line pen. Do this intuitively, with
    no plan or external stimuli; just let your imagination be your guide. Then try
    it again, this time responding to an external reference such as a photo or object.
    Consider which process you prefer and why. The more you understand the way in
    which you like to work, the more you can create a process that feels personal
    and meaningful.


    ![Image](images/f0097-01.jpg)


    On these pages, I made marks using paint with no plan or purpose. Instead I just
    enjoyed exploring the paint and witnessing how the colors worked in relation to
    each other, responding to the last mark on the page when I placed my new mark,
    and letting what I had already created inform my next step. Try this yourself.
    Create an initial painting with no set plan; just follow your instincts and listen
    to your inner wisdom.


    ![Image](images/f0097-02.jpg)


    Once the initial layer has dried, add details in pencil or pen. You may emphasize
    certain aspects of your original painting. Think about your own vocabulary of
    expressive marks and how you can incorporate them.


    ### Resist Technique


    Wax crayons or candles under watercolor paint act as a resist to the paint, creating
    an interesting effect. Use children’s wax crayons to draw an image and then paint
    over it with watercolors. The wax resists the paint that has been brushed over
    the top, and the paint pools into small dots on the original crayon drawing.


    ![Image](images/f0098-02.jpg)


    Wax crayons under watercolor paint create a pleasing contrast as the wax acts
    as a resist to the paint. Experiment with different color combinations to create
    different effects.


    ![Image](images/f0098-03.jpg)![Image](images/f0098-01.jpg)![Image](images/f0099-01.jpg)


    Complete a drawing in wax crayon.


    ![Image](images/f0099-02.jpg)


    Draw with wax crayons and then paint over them with watercolors. Here I used three
    stripes of different watercolors to create the illusion of a landscape.


    ### Underpainting


    Underpainting is when you paint an initial layer of paint and this serves as a
    base for subsequent layers of art. Experiment with creating a wild and wonderful
    underpainting using a variety of tools, colors, and techniques. Do absolutely
    anything you want on this first layer, knowing that you will later paint over
    it. Once the underpainting has dried, create a more planned composition over it.
    A ghost or elements of your original underpainting will show through, giving your
    sketchbook page a more complex and distinctive look.


    ![Image](images/f0100-01.jpg)


    Create an initial layer. You can be bold and expressive on this layer as you know
    you will be painting over it. This gives you the freedom to create anything—magical
    things often happen in this freedom. I used watercolor paint and created many
    colorful blobs and splotches and then misted water over the marks to encourage
    the paint to mix on the page. Once you complete this first layer, leave it to
    dry.


    ![Image](images/f0100-02.jpg)


    This second layer was created with black ink, but you can experiment with acrylic
    paint or another material. I drew a quick outline of the leaves in pencil and
    then filled the negative space with black ink. When deciding where to place the
    leaves, I selected the aspects of the underpainting I liked the most and wanted
    to remain visible. Choose the areas you want to highlight and those you are happy
    to eliminate. Your choices will dictate what you paint over and how you position
    your composition. You may see something in your underpainting that sparks an idea
    for the next layer.


    ![Image](images/f0100-03.jpg)![Image](images/f0101-01.jpg)


    Keep building up layers and experimenting with different materials and color combinations.
    The third layer on this page used acrylic paint.


    You may see something in your underpainting that sparks an idea for the next layer.


    ![Image](images/f0101-02.jpg)


    I selected a few colors of acrylic paint to put on my palette. Experiment with
    the way you set up your palette when you use paint from a tube. Consider how the
    layout affects how you feel as you create and the art you produce. A limited palette
    of three or four colors encourages you to mix them and be intentional about what
    you use. You may prefer an organized palette or to be messy and intuitive.


    ![Image](images/f0101-03.jpg)


    Start bold and progress to more detailed and nuanced applications with each subsequent
    layer. Add finer and final detail to your last layer.


    ### Mixing It All Up with Multiple Layers


    ![Image](images/f0102-01.jpg)


    I created this double-page painting from my imagination but was influenced by
    flora and foliage. I drew the first layer in wax crayon. The second layer is watercolor
    paint that resists the wax crayon. The third layer is acrylic paint. This trio
    of materials, in this order, is one I particularly like and come back to often.
    The wax crayon creates high-intensity points of interest and the watercolor provides
    a subtle background that helps the top layer of acrylic paint stand out.


    ![Image](images/f0103-01.jpg)


    I created these two spreads using the same combination of three layers—first wax
    crayon, then watercolor paint, and finally acrylic paint. Mixing materials in
    unique and interesting ways will make your art and sketchbook feel personal to
    you. Experiment to find a combination of art materials that reflects you and the
    art you want to create.


    ### Making Your Own Tools


    Experiment and create your own mark-making tools from discarded, foraged, and
    found bits and pieces. Search your home or neighborhood for items you could dip
    into ink to make interesting and unusual marks. Consider the items you throw away
    or use discarded natural pieces such as:


    • String


    • Nails and screws


    • Old credit cards


    • Bits of cardboard


    • Old packaging materials


    • Twigs


    • Leaves


    • Feathers


    • Pinecones


    If you need to make your objects easier to work with or dip into the ink, tape
    them to an old pencil or stick to effectively turn them into brushes and tools.
    Pour ink on an old plate or container and dip your tools into it. Discover the
    marks they make on your page. Be free and easy: play and see whether you can create
    a series of marks that you may want to permanently incorporate into your sketchbook
    pages or artistic practice. I often use this technique to make my own patterned
    papers on cheap copier paper that I then use as collage material for my sketchbook.


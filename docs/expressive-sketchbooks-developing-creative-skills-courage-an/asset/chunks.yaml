  trans: "\n![图片](img/f0143-01.jpg)\n\n## 致谢\n\n对 Quarry Books 的所有可爱伙伴们致以深深的谢意，感谢他们的远见、耐心和出色的图书制作才华，包括\
    \ Mary Ann Hall、Marissa Giambrone、Renae Haines、Joy Aquilino 和 Lydia Anderson。\n\
    \n特别感谢 Georgina Piper 为我拍摄的精彩照片。\n\n## 关于 Helen Wells\n\n**Helen Wells** 是来自英格兰南岸的艺术家。她的作品精致、富有有机感，描绘了幻觉般的表面或风景。作品多层叠加、碎片化、色彩丰富且装饰细节近乎偏执，她空灵且富有图案的作品让人联想到自然世界或魔幻异界的元素。\n\
    \n她的作品被收藏于世界各地的私人收藏中，并曾出现在从书封到酒瓶等众多产品上。2014 年，她作为 Winsor & Newton 水彩革命大赛的并列获奖者，其作品在伦敦的\
    \ Saatchi 画廊展出。她曾出现在杂志上，并在伦敦戈登·拉姆齐的一家餐厅展出作品。\n\n她在从事多年办公室工作后才晚年成为艺术家。她认为正是使用速写本帮助她找到了自己的艺术风格，并获得了将艺术发展到书页之外的勇气。她热衷于将速写本作为自我发现、游戏和创造力的工具，并渴望分享自己一路以来的所学。\n\
    \n**[www.helenwellsartist.com](http://www.helenwellsartist.com)**\n\n本书献给我美好的丈夫\

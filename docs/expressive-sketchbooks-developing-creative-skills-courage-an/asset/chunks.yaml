- raw: 'Your sketchbook is a place to enjoy and learn from the process of creating.
    A sketchbook is not about completed art works. It is a place to explore process,
    expand on small fragments, and develop your own artistic language and lexicon.
    I often learn the most from my failed attempts, my worst pages—the pages I don’t
    like. Think about your sketchbook as a place where you gain insight and wisdom
    from the “doing” and that this insight isn’t necessarily based on whether you
    like the result. Sometimes the magic happens in your brain and not on the page.
    The value can come from what you have learned in the process of creating, not
    from what you created.


    ![Image](images/f0018-01.jpg)


    A sketchbook practice is an exercise in self-discovery. Creating art pages is
    a way to unearth the things that excite, interest, and expand you.


    #### Creating Meaning


    Using sketchbooks can help you connect with yourself. It can prompt you to be
    more conscious about the things in life that energize and enliven you. Using a
    sketchbook is an exercise in discovery; it invites you to think about what lights
    you up, what makes you curious, what fascinates you, and what makes you feel expansive.
    Your sketchbooks will become a place where you define what matters to you, where
    you unearth messages to yourself, from yourself.


    ![Image](images/f0018-02.jpg)


    What you learn through creating can be more significant than what you create.
    The larger sketchbook features felt-tip pen floral patterns pasted over with collaged
    leaf shapes. It has been finished with a splash of hot pink paint that I allowed
    to drip down the page. The medium-size sketchbook features felt-tip pen, scribbles
    of pastels, a splash of watercolor, and blue felt-tip pen marks. In the smaller
    sketchbook, I was exploring how colors work together.


    #### Interpreting the World


    Creating art is a way to interpret the world. When you start to draw, you’ll often
    find that you begin to see things with new eyes. When I draw an object, I learn
    about it, I appreciate its form, its complexity, its structures, and its patterns.


    The act of really looking at something invites you to see it differently. You
    gain new insight on your subject matter and you might discover something about
    it that you hadn’t noticed before. The act of drawing something, even a mundane
    object, often reveals a hidden beauty in the subject.


    ![Image](images/f0019-01.jpg)


    Seek the extraordinary in the ordinary. Drawing can reveal a hidden beauty in
    an object. By drawing a subject, you’ll see it differently and gain a greater
    understanding of it.


    #### A Springboard


    Your sketchbook can be the start of a stimulating conversation with yourself.
    Its pages can contain the beginnings of ideas that you may want to develop into
    paintings or larger artworks. It’s a place to capture those ideas that otherwise
    may dissipate or be lost in the ether. It’s the start of something that takes
    you on a path to discovery.


    ![Image](images/f0019-02.jpg)


    The pages in your sketchbook may contain ideas or fragments of ideas that you
    may want to expand beyond the pages into larger and more complete artworks.


    ### OVERCOMING OBSTACLES


    Overcoming obstacles is an integral part of being creative, so let’s take a moment
    to reflect on what these obstacles might be.


    Some of us would like to be more creative but we are scared to try and scared
    to fail. We start and then get lost, or become blocked, or don’t know the next
    step to take. My goal is to help you overcome these obstacles and work through
    them.


    Meet your own creative vulnerabilities with compassion and curiosity.


    ![Image](images/f0021-01.jpg)


    #### I Can’t Draw


    There were many years of my life when I stopped drawing and didn’t start again.
    I was so critical of everything I produced. The sad thing is that my mental chatter
    and self-criticism about not being able to draw well got in the way of me doing
    something I loved. I listened to my own negative talk and believed it, whether
    it was true or not.


    When we are small children, we draw with an innate sense of joy and curiosity.
    We draw rainbows and stick people and houses and lollipop trees. When we are young,
    we draw because it is a way of understanding and exploring the world around us
    and because it is fun. We need to bring this playful child back to the page and
    not allow our own criticism to prevent us from enjoying the process.


    ![Image](images/f0022-01.jpg)


    A sketchbook is part of the artistic journey, not the destination. Its contents
    may be incomplete and experimental. Aim for playful over perfection.


    #### I Don’t Like What I’ve Produced


    I used to allow my self-criticism and unkind self-judgment to dictate my actions.
    I used to start a new sketchbook and abandon it because I was such a perfectionist
    and I didn’t think my work was good enough. I’d want my sketchbook to be a masterpiece
    of brilliance. I wanted every page to be gorgeous and worthy of hanging in a gallery.
    I wanted to prove to myself that I was a talented and worthy artist. I wanted
    my sketchbook to fulfil too much.


    All this pressure, all these expectations, and all this perfectionism led to a
    graveyard of abandoned sketchbooks.


    Remember to nurture yourself rather than criticize your work. Compassion toward
    your art and yourself helps you to develop, grow, and learn, while pressured perfectionism
    gets you stuck. Lowering your standards a little and expecting a little less from
    yourself can allow you to achieve more. The freedom that comes with not being
    perfect allows you to be more in the flow. You’ll find that with this mindset
    you will create better work and enjoy the process. The pain of not creating is
    so much more crippling than the pain of creating something you don’t like.


    Any new creative endeavor can make you feel exposed and vulnerable; it may stir
    feelings of doubt, fear, judgment, or criticism. Be kind and gentle with yourself
    as you start to create.


    ![Image](images/f0025-01.jpg)


    #### I Don’t Know What To Do/Where To Start


    Many times I haven’t really known what to do or haven’t felt inspired to do anything
    in my sketchbook. My foolproof response is to always do something. The power of
    taking a tiny action and going from there can be a way to engineer inspiration.
    Turn the page and just start. We can spend our lives thinking, planning, pondering,
    and considering. Often all this thinking and planning can be the thing that stops
    us from doing. So rather than thinking about starting, take a deep breath and
    start. There are so many ideas and prompts in this book, but only you can be the
    one who acts. Starting is vital; reading about starting is not enough.


    Starting can be the hardest part, but by taking action you gain momentum.


    ![Image](images/f0027-01.jpg)


    #### Obstacles Are Part of Being Creative


    It’s easy to find obstacles that stop us from starting or carrying on. Sometimes
    roadblocks appear once we’re already underway. Try to examine and acknowledge
    your own blocks and obstacles. You need to know what they are in order to surmount
    them. Use the exercises in this book to navigate your way around your creative
    blocks and bumps. Listen to what you say to yourself—is it helpful?


    Think of the blocks and obstacles as integral parts of being creative and know
    that any worthy journey has a few setbacks along the way. These blocks are part
    of the learning process and part of your expansion and development, so don’t let
    them be the end of your creative road like I did for too many years.


    ![Image](images/f0028-01.jpg)


    Obstacles are part of the artistic process. By learning to overcome or work around
    them, we become more confident and creative.


    #### Your Motivation and Intentions'

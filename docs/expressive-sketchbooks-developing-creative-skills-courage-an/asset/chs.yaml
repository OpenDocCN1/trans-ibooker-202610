  ### 拼贴与绘画


  ![图片](img/f0113-01.jpg)


  如混合媒体部分所述（所示 此处），在素描本中创作一幅底色绘画，一个随心所欲的狂野而美妙的创作。这只是拼贴的基础层；它有助于覆盖白纸并为拼贴提供背景。我用水彩画了这幅。如果使用参考资料或照片作为灵感来源，请利用它来指导底色绘画中的色彩和笔触类型。


  ![图片](img/f0113-02.jpg)


  底色绘画干燥后，从拼贴纸收藏中挑选几张。剪出想要包含的形状和元素，并在粘贴前将它们排列在页面上。这让你可以尝试并移动它们以找到最令人满意的构图。当你对摆放满意时，将它们粘上。


  ![图片](img/f0113-03.jpg)


  拼贴元素粘贴就位且该层干燥后，考虑是否想融入额外的绘制或绘画元素。我画了额外的线条以强调叶子。


  ## 黑白与色彩


  尝试单色和彩色应用。你可能想一遍又一遍地重现同一图像，每次使用不同的颜色和技巧。这种重复可以令人启发。它可以成为一个迭代过程，让你了解你的主题，磨练你偏好的色彩调色板，并发现最适合你的艺术的技巧。


  通过在同一素描本页面上混合黑白元素与彩色元素进行实验。你可能会发现无彩色与多彩元素之间高对比度令人愉悦。以下是探索单色和色彩的方法：




  -   在大多数手机相机中，将彩色照片转为黑白照片很容易，或者你也可以通过将图像以黑白而非彩色打印来实现。这项练习能让你更好地观察和理解主体或绘画中的明暗区域。

  -   思考你对某些色调所联想的意义。某些颜色可以承载强大的象征意义和联想，你可以在作品中探索或利用这些意义。写下你对某些颜色的词语或联想。例如，蓝色可以代表冬季、寒冷、距离、情绪低落、精神性、天空等等。

  -   使用不同的主色多次创作同一幅图像。然后思考颜色如何影响你的创作。思考各种色调能传达的故事或情感，以及你赋予它们的意义。同一幅图像如果涂成红色，其意义可能与涂成黑色或黄色时大不相同。


  通过使用各种颜色和技巧重新创作同一幅图像，可以有效了解你的艺术风格和偏好。


  ![Image](img/f0114-01.jpg)


  我以多种方式重新创作了这个花瓶。我先用黑色钢笔绘制，然后用黑色马克笔渲染背景，使花瓶的细节更加突出。


  ![Image](img/f0114-02.jpg)![Image](img/f0114-03.jpg)


  通过使用不同的艺术材料重新创作同一主题进行实验。我使用了蜡阻法，用白色蜡笔绘制花瓶，然后用黑色水彩颜料覆盖。


  ![Image](img/f0115-01.jpg)


  在同一页上使用单色元素和色彩可以增加视觉趣味。这里我先在底色中使用大胆的水彩笔触。一旦颜料干了，我就用粗马克笔绘制花瓶和背景的剪影。我在每一页上颠倒了色彩和单色元素的搭配。


  ![Image](img/f0115-02.jpg)![Image](img/f0115-03.jpg)![Image](img/f0115-04.jpg)

  '
- '# 第 4 章

  ## 拓展你的创意


  现在是时候拿起你在前几章中学到的实用工具和技巧并在此基础上进行拓展了。从一个让你着迷的主题或话题开始，并进行实验！


  ![Image](img/f0116-01.jpg)![Image](img/f0117-01.jpg)


  ### 主题


  正在寻找一个激发素描本艺术创作的主题吗？以这些起点为基础，发挥它们，并使其成为你自己的。选择对你最有意义和重要性的主题和话题。


  #### 经历

  -   选择你去过的地方，并利用记忆或照片创作回应这次访问的艺术作品。

  -   创作反映你认为重要的个人经历、一段旅程、一个爱好或生活变化的页面。

  -   选择一个你关心的事业，并考虑它如何成为素描本艺术的起点。

  -   创作反映你世界观、信念或你知道为真的事物的页面。

  -   画出你人生的故事或关键时刻。

  -   思考你的个人价值观，并以其中一个作为创作艺术页面的起点，即，勇气、真理或平等。


  ![Image](img/f0118-01.jpg)


  这个想象风景的例子是用蘸墨的树枝制作的。


  #### 人与地点

  -   画一系列自画像，突出你认为重要的东西，或包含对你个人有意义的符号或母题。

  -   在你的素描本中创作探索对你有意义的地方各方面的页面。

  -   以你居住的地方为起点，创作受家乡启发的素描本艺术。

  -   在你的素描本中创作一页献给对你特别重要的人。


  #### 情感与想象

  -   选择一种与你产生共鸣的情感并尝试描绘它。

  -   创作受童年记忆启发的艺术页面。

  -   在你的素描本中创造一个想象中的世界、城市或风景。

  -   为一个梦境专门留出一页素描本。

  -   选择一首你喜欢的诗或歌曲，用它来启发素描本中的一页。例如，你可以在听歌的同时尝试表现性标记练习，看看它对你的标记质量和多样性有何影响。


  ![Image](img/f0119-01.jpg)


  尝试从想象中创作风景或城市景观。这片拼贴森林是用细头笔和马克笔绘制的。尝试将标记练习中的图案和标记融入其中。


  #### 物件与事物

  -   我们周围的物件都有意义。选择几件对你有意义的物品，并以它们作为素描本页面的起点。

  -   选择一件你认为美丽的物件，并在同一页上反复绘制它，或使用不同的材料绘制。

  -   为一件你本打算丢弃的东西专门留一页，例如一块过熟的水果、蔬菜或包装。

  -   为一件发现的物件预留一页。它可能是别人丢弃的东西，也可能是自然界的东西，例如你在散步时找到的松果或树枝。


  ![Image](img/f0120-01.jpg)


  美丽可以在简单的丢弃物品中找到。这页素描本的灵感来自一些杂乱的线绳。


  ![Image](img/f0120-02.jpg)


  通过在同一页上反复绘制一个物体来进行实验。这页包含我从海滩找到的一小块海藻的许多快速素描。


  ![Image](img/f0121-01.jpg)


  一个有趣的起点可以带你走向许多不同的方向。通过在同一页上使用重复进行实验。我使用多种不同的艺术材料创作了这些叶子，包括拼贴、黑色细线笔、水彩和永久性白色马克笔。


  选择以下主题之一，并在家中或邻里寻找它的例子。拍照以用作素描本页面的参考资料：

  -   透视

  -   平衡/不平衡

  -   并置

  -   风化/锈蚀

  -   圆形

  -   线条与角度

  -   天际线

  -   关系与联系


  ![Image](img/f0121-02.jpg)


  一件小而看似无关紧要的物品可能非常有趣可画。例如，试着画一根找到的树枝或一株干枯的杂草。


  ### 拓展创意


  拓展创意的一种方法是重新审视你的灵感地图，并挑选其中一个线索进行拓展。新的创意可以来自于拓展地图上的单一概念。


  首先取一个想法并将其置于新地图的中心。写下你可能想要探索这个主题的所有方式——任何想到的东西。写下所有内容——不要自我编辑——只是让想法和联想自由流动。在我的原始创意地图上，我写下了“鱼鳞”。我通过写下我可能如何在素描本中运用鱼鳞灵感的方式来拓展这个想法。我的一些想法包括使用珠光漆、在显微镜下观察鱼鳞的形状、用铝箔制作鱼鳞、研究鱼鳞的作用以及研究不同的图案。


  ![Image](img/f0122-01.jpg)![Image](img/f0123-01.jpg)


  利用你的素描本捕捉想法。你的素描本不需要充满完成的艺术作品；相反，将其用作萌芽想法、某事的开端或你可能想稍后重新审视以培养和滋养的思考种子的储存库。


  ![Image](img/f0123-02.jpg)


  #### 结合创意


  通过不仅叠加艺术用品，还混合意义的层次和结合创意来制作有趣且个人化的艺术作品。


  你的素描本可以成为整合你兴趣、让它们相交和交织的地方。


  从你的灵感地图中取两个不同的想法并将它们融合在同一页素描本上，可以成为创作对你个人且具有独特意义的艺术的起点。




  从你的灵感地图中选择两个想法，并在同一页上将它们结合、对比或并置。以只有你能做到的方式将这些想法编织在一起。做出有趣的组合、关联或令人惊讶的联系。


  随着你艺术实践的发展，你在寻找自己的刺激物方面会变得更加自信。花时间思考和拆解你希望通过艺术实现的目标，会使定义你的方向变得更容易。意图的清晰指导行动。


  ![Image](img/f0124-01.jpg)


  从你的灵感地图中结合两个截然不同的想法，看看会发生什么。有时将想法结合起来可以产生一个比其构成部分更大的新概念。在我的原始灵感地图上，我写下了两个独立的想法：1)
  用垃圾制作速写本艺术，以及 2) 鸽子。我将这两个想法结合起来，用垃圾做了一只鸽子。


  ## 研究与探究


  一旦你有了想法，研究可以帮助你理解其背景并帮助你成长和加强它。研究可以帮助你对主题形成自己的回应，并为你提供多条可进入的途径。以下是研究你的主题的几种方法：


  • 寻找探索过类似主题的艺术家。在网上或书籍中阅读他们的资料。如果有机会，参观画廊并观看他们的作品。做笔记、绘画或直接从原作中汲取灵感都可能带来启发。


  • 将其他艺术家的作品作为跳板。这可以帮助你学习并发展自己的方法和风格。


  • 回顾你自己的作品和速写本，并记录下你喜欢且希望进一步探索的主题、过程或元素。你可能希望对你的速写或页面进行注释，并写下扩展它们的方法。


  ![Image](img/f0125-01.jpg)


  ## 收集与珍藏


  收集一些可以放入速写本的东西，例如想法片段、明信片、照片，以及你想进一步探索其作品的艺术家的名字。


  我可能会粘贴在我其他地方完成的但想保留的已完成作品的片段，或是我找到的东西、一张小复印纸、一个视觉提醒，或是一个我可以回头参考的提示。珍藏这些片段并安全地收集在速写本的页面中，让我能够翻阅我现在的和旧的速写本，并追溯久远的线索。


  ![Image](img/f0126-01.jpg)


  速写本可以是你收集手中、头脑和心中的东西的地方。将你以后可能想要重访的物品粘贴到速写本中。


  ![Image](img/f0126-02.jpg)


  你的速写本可以成为信息和想法的绝佳储存库。


  ![Image](img/f0127-01.jpg)![Image](img/f0127-02.jpg)


  使用你的速写本收集你认为在视觉上有趣的东西，例如杂志上的图片、明信片，或你想为将来参考而保留的艺术实验的小片段。


  ## 写作


  我经常通过写作建立联系和发展想法。如果有一个我感兴趣的主题，我可能会去图书馆、网上搜索，或阅读书籍以了解更多。我在阅读时做笔记，帮助我思考如何回应它、我个人对它感兴趣的是什么，或我可以在速写本中做什么来发展我的回应。有时意识流写作，即我不间断地写下所有我能想到、对某个主题感兴趣或知道的事情，可以是一种有用的工具。这种头脑倾倒可能包含有趣想法的种子。


  你可能想在速写本中做笔记。这是你的速写本用来实验的，所以做对你有意义的事情。尝试以下方法：


  • 写一些简短的笔记，描述你对所创作内容的回应，或反思你在创作过程中喜欢的部分。


  • 你可能想写一些技术笔记，关于你使用的颜色、如何调配某种特定色调的油漆，或你想记住的关于所用工具或材料的任何其他信息。


  • 如果你在实地作画，记下场景中最吸引你的元素。


  • 随意将你的速写本用作视觉笔记本，记录艺术家、想法或思想的笔记，以在未来提醒和激发你——某种程度上是供你回顾并取用东西的想法文件柜。


  • 描述一个想法的进展、你采取的步骤，或你如何发展你的思维过程。创建书面记录，以便日后可以复制该过程。


  • 记录关于如何推进一个想法、扩展它，或将其带向新方向或不同方向的想法。


  ![Image](img/f0129-01.jpg)


  在速写本中写作可以帮助你与所创作的内容建立联系。它可以是一个盘点和反思你所创作的内容的过程和成果的机会，或是一种记录你的观察和回应的方式。或者它也可以是记住你使用的材料、颜色或组合的一种方式。


  ![Image](img/f0129-02.jpg)

  '
- '# 第 5 章


  ## 练习与进步


  你已经掌握了技巧，并学会了如何在速写本中构思出富有创意的页面，这些页面是你独特的体现。现在是时候学习可能最重要的一部分：如何保持你的表达性速写本习惯，并将艺术长期融入你的生活。以下是一些你可以克服常见陷阱并以体贴和善良的心态培养你的艺术实践的想法。


  ![Image](img/f0130-01.jpg)


  ### 缺乏灵感


  当你灵感不足时该怎么办？不要坐等灵感找到你。相反，要主动去寻找它。在我感觉明显缺乏灵感的日子里，我会制造灵感。迈出微小的一步，做点什么，接近空白页面，开始行动，往往足以让事情运转起来。


  当灵感难以捉摸时，给自己分配一个小而可实现的目标或项目，以某种方式制造你缺少的灵感。即使你不想做，也在速写本中工作，以找到并培养那种灵感。想法可以源于行动。选择一个练习，投入其中，看看它会带你去哪里。小而渐进的行动往往会相互累积。


  ![Image](img/f0132-01.jpg)


  你的艺术应该包含你的本质，因为它反映了你如何看待世界以及你如何在页面上捕捉这种视野。


  ![Image](img/f0133-01.jpg)


  如果你在开始之前等待真正感到灵感，你可能永远不会开始。相反，开始吧。采取行动去寻找灵感。


  ### 评估作品


  当你评估自己创作的内容时，远离负面评判，而是带着开放、好奇和抽离的心态探索你的作品。如果某件事行不通，翻页重新开始或改天再回来。


  永远不要从速写本中撕掉一页。如果绝对必须这样做，请重新利用它。如果你不喜欢一页的成品，要么在上面重新上色，要么用拼贴页覆盖它。但在对它做任何事之前，花点时间思考一下。我经常翻过一页，而我第一次制作它时非常不喜欢它，但几周后我发现我其实相当喜欢它。如果你不喜欢一页，在做任何事之前问自己以下问题：


  • 我不喜欢它什么？


  • 我喜欢哪些方面？


  • 哪些元素是成功的？


  • 哪些元素没有那么成功？


  • 下次我会做哪些不同的事情？


  ![Image](img/f0134-01.jpg)


  如果你在速写本中创作了一些你不满意的东西，问问自己为什么不喜欢它，并倾听你的答案。


  ![Image](img/f0134-02.jpg)


  #### 拥抱错误


  我们的错误中总是有一些有价值的东西。当我们进行实验时，速写本中不可避免地会出现一页或几页看起来像可怕的混乱。




  在艺术中，就像在生活中一样，我们往往能从这些错误中学到比从成功中更多的东西。花时间客观地审视我们的错误是有价值的，因为它们能教会我们道理。提醒自己，在速写本上创作一些你不喜欢的页面，远比一无所获要好得多。不创作的痛苦大于创作自己不喜欢的东西的痛苦。冒险是学习和创造力的不可或缺的一部分。拥抱不完美，享受过程，并警惕完美主义。


  我们的错误可能引领我们走向突破，并鼓励我们在下一次以不同的方式处理主题。当我们允许自己在艺术中冒险时，有时会发现它们能带来美妙的回报。其他时候，我们从中学习它们能教给我们的东西。我们的失败、失误和错误都包含着教训和成长。


  ![图像](img/f0135-01.jpg)


  当我们在尝试新事物或学习新方法时，速写本上的页面并不总是能达到我们期望的样子。我们可以从错误和失误中学习。


  ## 获得视角


  如果你不喜欢自己创作的东西，或者不知道下一步该做什么，就暂时离开它，几分钟、几个小时后，或第二天再回来。有时一点距离能让我们更客观地看待自己的作品。我们能够避免陷入细枝末节，而是将作品作为整体来看待。


  通过把作品举到镜子前、用手机拍照，甚至倒过来观看，可以瞬间获得客观性。获得视角的另一种方法是身体上远离正在创作的东西。从更疏远的视角来看：试着把速写本立在桌上然后走开，或直接把它放在地上以获得一些距离。这些简单的技巧能让你带着一点抽离感来看自己正在创作的东西。


  ![图像](img/f0136-01.jpg)


  为了在艺术上获得一点客观性或视角，请从更疏远的视角来看它。


  ## 自我评估


  评估是学习过程的重要组成部分。速写本的好处在于，你可以回头翻阅它，看到自己的进步。在本书前面，我鼓励你为使用速写本设定一些意图。不时回顾这些意图，检查自己的进展，保持自律，这是有用的。清点一下，并就你的艺术创作问自己以下问题，例如：


  • 我在学习吗？

  • 我学到了什么？

  • 我在做我当初设定的事情吗？

  • 我喜欢哪些方面？

  • 我允许自己进行实验吗？

  • 我开始找到表达我创造力的方法了吗？

  • 我对自己创作的东西感觉如何？

  • 我在创作艺术时感觉如何？

  • 我想做更多什么？


  ![图像](img/f0137-01.jpg)


  问问自己关于艺术创作和艺术发展。例如，你是否挖掘出一种服务于你的艺术并让你表达创造力的方法？


  ## 自我破坏


  当我们走出舒适区，尝试新事物来发展艺术实践时，我们需要警惕大脑试图让我们保持安全并困在消极的内在叙事中的方式。


  我们的思想会耍一些花招来阻止我们创作。我们会自我破坏，或让消极的内心对话阻碍我们创作的意图。我们可能对自己不够好感到焦虑和恐惧。我们可能会批评自己的技能和能力。我们可能会让拖延和分心阻止我们创作艺术。我们甚至可能不尝试，以此作为保护自己免受失败之痛的方法。


  所有这些心理花招都可能阻止我们创作艺术，以此避免内心的批评者、评判和失败。我们可能为了防止恐惧而停止创作，但这也限制了我们的快乐。我们大脑用来保护我们的这些安全机制会阻止我们玩耍、享受过程、提升和表达自我。


  虽然我们无法完全让内心的艺术批评者沉默，但我们可以学会如何与之共存。让你的消极内心对话在背景中喋喋不休，但要不断提醒自己，从创作自己的艺术中能获得如此多的收获。


  ![图像](img/f0138-01.jpg)


  学会与你的内心艺术批评者共存。明确你的意图，采取行动，创作艺术，继续前进，不断成长。


  ![图像](img/f0139-01.jpg)


  ## 自我善待


  自我善待是发展有意义的艺术旅程的关键。这并不意味着我们要爱上自己创作的一切，而是指我们不单纯以作品的最终结果来评判自己的创造价值。就你为何不喜欢自己画或创作的东西，与自己进行更细致的对话。加入一点客观性，退一步思考，你为何不喜欢它，如何改进它，以及你学到了什么。用善意迎接你的脆弱，因为善意有助于你的创造力蓬勃发展。


  我们生活在一个越来越重视消费而非创造、竞争而非善意、结果而非努力的社会。在你的速写本练习中，我鼓励你颠覆所有这些假设。享受从无到有创造事物的过程。做一个比竞争更富同情心的人。将创作艺术的行为置于对最终结果的执着之上。


  ![图像](img/f0140-01.jpg)![图像](img/f0141-01.jpg)


  作为孩子，我们会无意识地放纵地绘画和着色。随着年龄增长，我们开始审查自己的创造力，将自己的最差成果与他人的最佳成果相比较。我们会对自己不善良，批评自己的产出，否定自己的能力。


  ### 自信心


  词语 *勇气* 源自古老的拉丁语，意思是“来自心灵”。当我们怀着勇气和自信创作自己的艺术时，我们让心中的东西倾注到纸面上。自信就是倾听并信任内在的智慧，让它成为我们的指引。意识到你的直觉和本能，注意它们，你就会成为自己的导师。


  把你的创造性实践看作是一系列小选择的连续体。创作艺术是一个不断做出微小选择和挑选的过程。我们选择主题、材料、下一次落笔的位置、何时开始何时停止、何时添加、何时减去。


  我注意到，当我放慢脚步，真正关注时，更容易遵循直觉并在艺术创作中更有信心。当我活在当下，更专注于此刻正在发生的事情时，我发现自己释放了对评判的执着，更能让过程自然流淌。


  ![图像](img/f0142-01.jpg)


  理解并信任你的选择。也倾听你在艺术创作中大胆无畏的直觉。这种意识水平意味着你正在创作真正属于你的个人艺术，纸面上展现出更多真实的你。设定意图并遵循直觉可以带你去到美妙的地方。


  ![图像](img/f0142-02.jpg)


  自信来自于调谐并倾听内在的智慧——它与觉察密不可分。在过程的每个阶段都意识到自己所做的选择，有助于你更深入地了解自己作为艺术家是谁。


  ![图像](img/f0142-03.jpg)


  自信心来自于倾听内在的声音，同时与纸面上逐渐成形的艺术建立联系。艺术创作有时会感觉像是在你的觉察与艺术之间的一场微妙舞蹈。


  ### 培养实践


  创造力是一种习惯，也是一种实践。享受发展自己的一套流程和方法的过程。当你在艺术实践中开始感到更有勇气和胆量时，享受你的发现。让你的速写本成为你的艺术声音存在并蓬勃发展的地方。不要害怕失误、错误和走弯路，因为它们包含着美妙的教训。创作艺术——*你的*艺术。




  ![图片](img/f0143-01.jpg)


- '# 第 2 章


  ## 开始


  本章提供了开始使用素描本所需的一切。它邀请你考虑最适合你的素描本类型以及可用的各种材料。各种练习的设计目的是让你可以将其作为跳板，然后再根据自己的风格进行调整。


  ![Image](img/f0032-01.jpg)![Image](img/f0034-01.jpg)


  我在混合媒介和艺术用品以创造引人注目或意想不到的效果时找到了真正的快乐和创造性的炼金术。我经常将拼贴元素与手绘细节混合，将钢笔与颜料混合，将蜡笔与水彩混合。在整本书中，我建议通过结合手头的材料来实验，制作属于你个人的艺术。


  ![Image](img/f0034-02.jpg)![Image](img/f0034-03.jpg)![Image](img/f0034-04.jpg)![Image](img/f0035-01.jpg)![Image](img/f0035-02.jpg)


  ### 素描本的类型


  让我们探索可用的不同类型的素描本，以及在选择时需要考虑什么。我帮助你选择完美适合你的素描本，让你乐于使用。素描本可以被称为许多东西，例如日记、笔记本、视觉创意书、艺术书和视觉日记。只要名称对你有共鸣，你怎么称呼它都无关紧要。


  #### 考虑媒介


  如果你打算在素描本中使用大量湿性颜料，你需要一本纸张重量较重的书，能够承受你泼洒的液体和颜料量。使用至少 200 gsm（每平方米克数或 g/m2）的纸张，大约相当于
  137 磅。


  #### 考虑使用地点


  考虑你使用素描本时会身处何地。我主要在家或工作室使用较大的素描本，因此它们的整体重量和尺寸不是重要因素。但如果你计划每天随身携带素描本，那么你需要使用更轻、更便携的素描本。


  ![Image](img/f0037-01.jpg)


  素描本有多种类型、尺寸和格式可供选择。在为自己选择最佳类型时，请考虑你打算在哪里以及如何使用它。


  #### 竖版还是横版？




  考虑你的速写本的朝向。我喜欢使用竖向（垂直）格式。许多其他艺术家更喜欢横向（水平）格式。购买速写本时请考虑你的偏好，因为这会影响装订位置。装订可以是螺旋装订，也可以像精装书一样缝合并粘合。螺旋装订的书籍可以让你轻松地将页面完全摊平并方便翻页。然而，如果你喜欢在跨页上作画，你可能会发现螺旋线会干扰你的创作流畅度。


  ### 寻找舒适的速写本


  找到一本使用起来感觉良好、手感舒适、值得记录你创作旅程的速写本。避免那些你认为过于正式或太好用不敢用的书。如果你只想把速写本留给最好的作品保存，你就不会感到舒适地让它经历艺术创作的过程。


  ![图像](img/f0038-01.jpg)


  我同时进行着几本速写本。通常我口袋或包里会有一本小巧便携的笔记本，还有各种只在家工作室使用的较大速写本。


  ## 材料与艺术用品


  考虑最吸引你的艺术材料，也就是你真正喜欢使用的材料。就像我们每个人都有自己独特的标记词汇一样，我们每个人对某些材料都有特殊的亲和力或自然的吸引力。


  在速写本中作画时，要注意哪些材料让你感到兴奋、放松和开阔，哪些材料让你感到受限或别扭。尝试用不同材料完成相同的练习。实验一下，看看什么适合你。


  我们许多人都喜欢尝试新产品。但与其买新产品来希望提升创造力，不如始终从手头已有的材料开始。我和下一个人一样有罪，相信某种新颜料或新型墨水会提升我的艺术实践。购买新用品很容易成为代替真正开始使用你已有的、完全够好的用品的替代活动。


  以下是我喜欢使用的一些用品。你可能有完全不同的最爱用品选择，这很好。我鼓励你拥抱你喜欢使用的材料，并相应地调整练习。


  ![图像](img/f0039-01.jpg)


  艺术材料和用品的世界充满可能性。


  ### 铅笔与石墨


  朴素的铅笔有其美妙之处。H（代表“硬”）铅笔较硬、精确，非常适合细节工作。较软的 B（黑）铅笔则用于模糊、较深、较粗的线条。我喜欢使用水溶性石墨铅笔，可用水或不用水使用。往画好的线条上加水，你的标记就会变成类似墨水的晕染。你也可以直接将水溶性石墨铅笔蘸入水中，用湿润流动的线条作画。


  ![图像](img/f0040-01.jpg)


  铅笔是多功能的艺术工具。


  ### 笔


  我在速写本中使用大量黑色细线笔，有时单独使用，有时在拼贴和干画上作画。作为孩子时，我喜欢毡尖笔，到现在仍喜欢用它们上色的过程。当我不用毡尖笔（也称为记号笔）时，有时会使用蓝色圆珠笔。


  ### 颜料


  我经常在速写本和艺术作品中使用水彩颜料。这种颜料的不可预测性让我着迷。我喜欢颜色在纸面上与水混合并形成意想不到的图案的方式。我也喜欢使用比水彩更不透明的水粉颜料。丙烯颜料有令人惊艳的色彩和质地范围，可以用于需要在其上叠加明显颜料层的技巧。


  ![图像](img/f0041-01.jpg)


  我喜欢水彩颜料的特性。寻找能让你感到放松和富有表现力的材料。


  ### 墨水


  我喜欢墨水的流动性。使用墨水的一种方法是先用清水刷过速写本页面，然后滴上墨水，创造出扩散的点、圆圈和意外的惊喜。


  ### 拼贴材料


  我收藏了一些有趣的纸张，包括旧书页、杂志页、拾得的纸张和废弃的艺术作品。我还在纸屑上创作、印刷和绘画，目的是将其融入速写本。为了将它们粘贴到速写本中，我使用基于
  PVA 的胶水，它价格便宜且适用于各种纸张。


  ### 画笔


  我的大多数画笔价格便宜，尺寸和形状各异。在一页上使用多种画笔会增加视觉趣味。例如，我经常使用装饰画笔创造大胆的粗线条，同时用细小画笔添加细节、短线和点。


  ![图像](img/f0042-01.jpg)


  收集或制作纸张以融入你的速写本页面。


  ## 颜色


  我的速写本色彩丰富。我喜欢使用色彩的力量和美感。为了发挥色彩的魔力，了解一点色彩理论会有所帮助。


  ### 色彩轮


  色彩轮按照颜色之间的关系将颜色组织成一个圆圈。艺术家经常参考色彩轮来查看哪些颜色搭配得好。


  ![图像](img/f0043-01.jpg)


  #### 原色


  三种原色是构成基础。它们被称为原色，因为它们不能通过混合其他颜色制成。


  ![图像](img/f0043-02.jpg)


  #### 间色


  当你混合两种原色时，你会创造出一种间色：


  ![图像](img/f0043-03.jpg)


  #### 相反相吸


  互补色是色彩轮上彼此相对的一对颜色。当互补色一起使用时，会产生动态效果。因为它们是高对比度的对立色，互补色放在一起时会显得突出并产生活力，展现彼此的最佳特质：


  蓝色 + 橙色


  黄色 + 紫色


  红色 + 绿色


  ![图像](img/f0044-01.jpg)


  在你的速写本中尝试使用相反配对的颜色。


  #### 和谐三色


  类似色，或和谐色，是色彩轮上彼此紧挨着的三组颜色。它们往往能很好地和谐搭配，但可能缺乏对比度：


  红色 + 橙色 + 黄色


  紫色 + 蓝色 + 绿色


  绿色 + 黄色 + 橙色


  蓝色 + 紫色 + 红色


  ![图像](img/f0045-01.jpg)


  色彩轮上彼此相邻的颜色搭配得很好。


  #### 动态三色


  如果你选择色彩轮上等距分布的三种颜色，它们总是搭配得很好：


  红色 + 黄色 + 蓝色


  橙色 + 绿色 + 紫色


  ![图像](img/f0045-02.jpg)


  以下是用水彩颜料绘制的和谐三色的例子。


  #### 色彩温度


  将色彩的温度视为冷或暖是有帮助的。色彩轮上最接近黄色的颜色是最暖的，其中黄色是最暖的。含有大量黄色的暖色往往会向前突出，仿佛向你移动。冷色——色彩轮上最接近蓝色的颜色——往往会后退或显得向后延伸。这是因为我们的眼睛先感知暖色，然后才是冷色调。


  如果你在蓝色旁边画一个黄色斑块，黄色斑块可能会看起来像在向你靠近，而蓝色斑块则可能看起来像在后退。你可以在绘制风景或想要创造深度时使用这个技巧。在前景使用暖色，在背景使用冷色，以营造近远的感觉。


  ![图像](img/f0046-01.jpg)


  暖色往往向前突出，看起来更近，而冷色调往往后退，看起来更远。


  #### 鲜艳与柔和




  想想你在同一件作品中如何同时使用鲜艳和柔和的色调。注意色彩的明度和饱和度。考虑将明亮大胆的颜色与更柔和、更细腻的颜色搭配，以创造对比和变化。


  如果你被明亮耀眼的颜色吸引，请用更沉稳的色调搭配以获得更大冲击力。当你只把超亮的颜色放在一起时，它们的综合效果很可能会被削弱和降低。明亮的粉色放在明亮的橙色旁边并不会显得突出和非凡，就像它放在柔和的灰色或暗淡的橄榄绿旁边时可能的效果一样。


  一页如果只使用高饱和度的色调，而没有柔和的颜色来平衡，就可能看起来有点天真。相反，一幅只使用非常柔和色调的画可能缺乏动感，但加入一点亮色可以吸引视线并起到焦点的作用。


  同时使用明亮和柔和的颜色可以让你的作品显得更细腻有趣。这六幅图像是通过在我的速写本上画丙烯颜料条纹创作的。速写本直立放在我的桌上，所以上面的颜色滴落并与下面的颜色融合。


  通常，你可以通过将任何颜色与色轮上与其相对的颜色少量混合来创造更柔和的色调。


  ![Image](img/f0047-01.jpg)


  这些页面只包含明亮鲜艳的条纹。


  ![Image](img/f0047-02.jpg)


  ## 色彩实验


  以下是几种尝试色彩实验的方法：


  • 混合你自己的间色。

  • 寻找你钦佩的艺术家使用互补色的绘画作品。

  • 在你的速写本中制作自己的色轮。

  • 在你的速写本中创建一页或几页基于互补色的页面。

  • 画条纹来观察不同颜色并置时的反应。创建几页条纹：其中一页只用明亮大胆的颜色，一页只用柔和的颜色，还有一页结合明亮和柔和的色调。


  ![Image](img/f0048-01.jpg)


  这些页面只包含柔和色调的条纹。


  ![Image](img/f0048-02.jpg)![Image](img/f0048-03.jpg)


  这些页面同时包含鲜艳和柔和的色调条纹。


  ![Image](img/f0048-04.jpg)


  ## 绘画的乐趣


  我希望你能爱上绘画。这里有一系列艺术练习，可以帮助你在速写本中开始创作。这些练习设计得灵活多变，以便你可以根据自己的需要进行调整和个性化。


  ### 造痕练习


  我相信每个人都能画画。绘画由线条和痕迹组成。简单的造痕练习可以非常有力，也是一种轻松释放自我、开始创作的方式。在纸上做标记听起来可能像个孩子气的行为，但它是一种宝贵的练习。它让你处于探索的状态，并能帮助你发展自己的视觉语言。


  了解吸引你且属于你的标记类型。我们都有表达性标记的词汇表，发掘自己的标记可以是一次令人满意的体验。自然流露的线条和标记就是你艺术的笔迹。我们在纸上自然做标记的方式就是我们艺术的本质。


  用铅笔试试这个练习：在速写本的一两页上，你能用铅笔做出多少种不同的标记？思考你的标记速度和施加的压力。还要考虑尺度、大小和色调范围。尝试使用非惯用手进行练习。


  ![Image](img/f0049-01.jpg)


  在多页上尝试这个造痕练习，找到你直觉和本能的标记方式。


  ![Image](img/f0050-01.jpg)


  当你画眼前的事物时，你是在诠释你的主题，理解它，并对所见之物发展出自己的回应。


  ### 探索性绘画


  绘画不一定是要对所见之物做出完美逼真的再现。更确切地说，它是一种诠释世界的方式。绘画与其说是关于你画的东西，不如说是关于你如何诠释所画之物。重要性来自于你和你个人的视角。


  当你画某样东西时，你会以不同的方式看待它并探索它。绘画时，你必须花时间真正观察物体或主题。它不仅仅是看到眼前的形状和线条，而是要确定其内在本质和目的，并发现你对它的反应。


  当你开始绘画时，你可能会感到笨拙或忐忑不安，但生活中的大多数事情都是如此，做的越多，你就越自信、越自在。尝试带着好奇心和可能性去面对纸张。在创作时自问自答是保持觉察并与作品保持联系的好方法。请考虑以下问题：


  • 这个主题有什么吸引我或让我兴奋的地方？

  • 我想在绘画或作品中传达主题本质的哪些方面？它的形状、形态、质感、阴影或轮廓有什么特别吸引我的地方吗？

  • 哪些材料最适合我的主题？

  • 通过实践我想要学到什么？

  • 我希望在创作时感受到什么？

  • 我在创作时实际感受到什么？


  ![Image](img/f0051-01.jpg)


  选择对你有意义的物体来画。这里我画了母亲的纽扣盒和缝纫材料。这幅画是用细线和马克笔完成的。


  ![Image](img/f0051-02.jpg)


  当你画某样东西时，你是在与它建立联系。当你的笔或铅笔在纸上舞动试图表现你所见时，你有机会比以前更好地理解你正在观察的事物。


  ### 选择绘画对象


  仔细选择你的物体或主题，因为它们很重要。你所画或所绘的东西在某种程度上应该对你有意义。画你不感兴趣或没有联系的东西是非常困难的。


  你选择的绘画对象在其本质上应该有一些能引起你兴趣、让你好奇并吸引你的东西。


  ![Image](img/f0052-01.jpg)


  在选择绘画或作画对象时要保持觉察。选择主题是创作过程中的重要部分。


  ### 多看少画


  即使在完成超快速练习时，也要花更多时间观察而不是绘画。通过保持觉察、放慢速度来观察和研究你的主题，你更有可能捕捉到你想要画的东西。


  花时间仔细观察有助于我们画出眼前的事物，而不是我们认为眼前的事物。我倾向于按我认为它们应该的样子画，而不是它们实际的样子。当我花更多时间专注和真正观察时，我的绘画更能反映我所画事物的真实性。


  ![Image](img/f0053-01.jpg)


  绘画帮助你用新的眼光看待和理解你的主题。


  ### 开始绘画的方法


  快速素描具有一种能量和活力，临场发挥的特质可以非常令人解放。快速的绘画可以具有某种美感和即时性。当你练习快速绘画时，尝试在一页上画几幅图像，或反复画同一幅画。用各种艺术工具，如铅笔或粗马克笔，来表现同一幅画。如果你多年未曾绘画，你可能会感到不愿开始。我为你加油！我鼓励你采取行动，投入其中，开始绘画。


  以下是在你选择的主题上尝试的简单练习。它们的设计让你有自由去尝试并使它们成为自己的。


  ![Image](img/f0054-01.jpg)


  绘画不仅仅关乎结果；它还关乎练习、体验、活在当下、实际的创作过程，以及沿途发生的美好学习。


  ### 不要看纸面




  This is a super-quick exercise in which you draw the object without looking at the
  page. Instead, focus on your subject matter. Don’t let your pencil or pen leave
  the page—it should follow your eyes as you look at the contours and outlines of
  the object. Your drawing may look weird and distorted at first, but this technique
  helps to free you up, allowing you to really examine and understand what you are
  drawing, and not worry about the end result.


  You can’t be too precious about a drawing if you’re not allowed to even look at
  the page as you draw. The drawing can capture the essence of your subject and create
  an interesting starting point that you may add to and develop or leave just as it
  is.


  ![Image](img/f0055-01.jpg)


  Quick, simple drawings are a good way to find your rhythm and not overthink what
  you are creating.


  ### 描绘物体周围的空间

  It is useful to think about the area around your subject—the negative space. We
  often assume we know what a certain object looks like, so we draw how we *think*
  it looks rather than what we actually see. Drawing the space around the object is
  one way to capture its true form.


  By drawing the space around the object instead of the object itself, you bypass
  your assumptions. You are not drawing the thing, you are drawing the space that
  the thing sits in, which encourages you to draw from observation rather than assumption.


  ![Image](img/f0056-01.jpg)


  Drawing the space around your object can lead to dynamic and complex results.


  ### 定时速写

  Setting time limits can be particularly helpful when getting started. Because you
  only allow yourself a limited amount of time, this technique takes the pressure
  off. The lower the expectations, the freer and more expressive you become. Draw
  the same subject with different time limits and then compare each drawing. Try the
  following:


  • 1 minute

  • 5 minutes

  • 20 minutes

  • 1 hour


  ![Image](img/f0057-01.jpg)


  This drawing took less than a minute. Two drawings that took longer are on the next
  page.


  ![Image](img/f0058-01.jpg)


  This drawing was completed in fewer than 5 minutes.


  ![Image](img/f0058-02.jpg)


  This drawing was completed in 1 hour. Try drawing the same subject in different
  time allowances and compare the drawings.


  ### 发展你的绘画

  There are many ways to adapt these simple drawing exercises to make them your own.
  Here are a few examples:


  • Try the same exercise using different materials or combining materials that you
  have, such as felt-tip pens, pencils, biro pens, ink and a brush, or watercolors.

  • Draw the same subject again and again on the same page.

  • Try doing more than one of these exercises on the same page.

  • Complete one drawing and then turn your sketchbook to a different angle and draw
  a second similar drawing over the top of the first.

  • Draw your subject at a massive scale so only part of it fits on the page. Then
  draw it much smaller on the same page.

  • Add color to highlight certain aspects of your drawing.


  ![Image](img/f0059-01.jpg)


  Experiment by drawing the same thing multiple times on one page. Turn the sketchbook
  sideways or upside down and draw over the top of another drawing at a different
  angle.


  ![Image](img/f0059-02.jpg)


  Draw a couple of quick one-line drawings on top of each other. Look for the interesting
  shapes that are created by the two drawings. Select areas to shade or color to create
  a composition.


  ## 享受视觉多样性

  When working in your sketchbook, consider how you create variety and variation on
  one page or on a double spread. Difference, contrast, and variation can be what
  makes a page interesting, dynamic, and full of energy. There are so many ways to
  incorporate visual variations. Here are some:


  ### Light and Dark

  Consider the tonal differences in the art pages you create. Incorporate a variety
  of light, mid-tone, and dark areas. For example, if you are using a pencil, alter
  the pressure to experiment with making a variety of tones. When using colored materials,
  consider the tonal value in addition to the actual color.


  ![Image](img/f0060-01.jpg)


  Our eyes are visual sensors that are particularly sensitive to light and dark. Tonal
  differences and contrast on a page help our eyes to travel around the page.


  ![Image](img/f0060-02.jpg)


  Incorporate a mixture of light and dark areas to add energy to your art.


  ![Image](img/f0060-03.jpg)


  The light and dark values of a piece of art are its most important visual aspects.


  ### Big and Small Marks

  It can be useful to use a variety of different marks, both big and small, to create
  interest and variation. Try using a big brush and a small brush on the same page.
  Contrast quick marks with slower, more deliberate marks.


  ![Image](img/f0061-01.jpg)


  Vary the marks to create visual interest. Test the difference between marks made
  in different ways. Explore a diversity of ways to make the same mark, fast or slow,
  large or small, with heavy pressure or gentle pressure.


  ### Delicate and Bold Areas

  If you have a particularly bold area on a page, you may want to consider also having
  an area that is softer, more delicate, or fainter.


  ![Image](img/f0062-01.jpg)


  Be conscious of how you use bold and delicate areas. On these sketchbook pages,
  the delicate watercolor washes are contrasted with more definitive pen drawings.


  ![Image](img/f0062-02.jpg)


  On this double-page spread, the dark, bold sections are surrounded by softer areas.


  ![Image](img/f0062-03.jpg)


  These pages were created with collaged papers and incorporate confident, bold areas
  with parts that are fainter and more subtle.


  ### Busy and Quiet Areas

  Incorporate quiet areas, which are more restful, to allow the intense areas of your
  work of art to breathe.


  ![Image](img/f0063-01.jpg)


  Contrast the busy areas on your page with quieter sections that feel more restful.
  This provides breathing space and contrast. On this page that was created with a
  base of bright watercolor blobs, a layer of pale pink acrylic paint over the top
  creates a quieter foil for the more intense areas.


  ![Image](img/f0063-02.jpg)


  A white space or quieter area in the center of a page can act as an invitation to
  look into the page, a space through which you can enter the artwork.


  ![Image](img/f0063-03.jpg)


  ### Variety of Tools and Materials

  Using a variety of tools and materials and their contrasting properties can bring
  energy and interest to your artwork.


  ![Image](img/f0064-01.jpg)


  These pages were made using acrylic paint, collage, a white pen, and colored felt-tip
  pens. Try mixing unusual combinations of art materials on one page.


  ### Curves and Straight Edges

  Another way to bring contrast is to be mindful about your use of curved, straight,
  or angular lines and shapes.


  ![Image](img/f0064-02.jpg)


  Experiment by including organic and geometric shapes on the same page.


  ![Image](img/f0064-03.jpg)


  Incorporate both straight and curved lines into your artwork.


  ### Variety of Colors

  You can incorporate visual variety by using color in several ways. Try using black
  and white with color on the same page. Use both warm and cool tones, and muted and
  vibrant tones, on the same page. Employ colors that are opposite each other on the
  color wheel on the same page.


  ![Image](img/f0065-01.jpg)


  The base for this page is green and red, which are opposites on the color wheel.


  ![Image](img/f0065-02.jpg)


  Blue and orange are opposite each other on the color wheel, as are purple and yellow.
  Try using a color with its opposite.


  ## 摆脱空白页




  遇到一张空白的白纸感到有些 daunting 并非罕见。如果这也是你的情况，试试以下几种消除大片空白的方法。这些简单的方法会在页面上留下一些痕迹或一点颜色，然后你可以在其上作画或上色。这些方法增添了一点趣味，为你提供了可以回应的内容，并作为一个起点来消除那种白茫茫的感觉。


  ### 剩余颜料


  通常当我的调色板上剩下颜料时，我会用它在素描本的空白页上点几下或做一些随意的标记。这些标记会在你下次使用素描本时提供视觉趣味，让你可以在其上或周围进行创作。


  ![图像](img/f0066-01.jpg)


  **A** 用颜料做随意的标记来消除空白页。通过使用大号画笔并在笔尖同时蘸取两种或更多颜色，可以实现彩虹效果。


  ![图像](img/f0066-02.jpg)


  **B** 让原来的标记干透后再在其上进行创作。思考如何让页面上的原始标记成为亮点。这里我快速画了一个树形，然后在铅笔周围上色，利用负空间形成树形。


  ![图像](img/f0066-03.jpg)


  **C** 考虑在你的作品中构建许多不同的层次。让每一层干透后再添加更多细节或使用不同的画笔。


  ![图像](img/f0067-01.jpg)


  这里有两页以随机线条开始的素描本页面。较大的那一页用黑色记号笔绘制了图案。较小的一页是在深蓝色墨水上使用白色墨水。两页的起点都是几条线条。在黑白页面中，一条波浪线被画下并横跨页面。这有助于结构化图案。


  ### 一些随意的线条


  我可能会在页面上随手涂鸦一两条完全随意的线条。试着闭上眼睛画几条线。或者在画线时听你最喜欢的音乐。然后考虑你想如何发展这些线条。尝试用三种不同的艺术材料画三条线。我可能会用这种方式填满五六页，然后当我再次回到素描本时，我常常会发现可以回应的某个微小开端。


  ### 拼贴


  将有趣的纸片拼贴或粘贴到空白页上，然后在其上进行创作。


  ![图像](img/f0068-01.jpg)


  选择一个有趣的纸片碎片粘贴到你的素描本中。


  ![图像](img/f0068-02.jpg)


  将拼贴元素作为起点或跳板来回应它。


  ### 彩色底色


  我经常把一页纸涂成粉色或绿色，然后在其上作画或进行创作。尝试使用彩色背景或底色（第一层或基础层）是值得的，看看它们对你的作品会产生什么效果。尝试不同的颜料和颜色，看看什么适合你。例如，在黑页上使用白色笔，或尝试不同不透明度的颜料，比如先用水彩，晾干后再用丙烯颜料覆盖。


  ![图像](img/f0069-01.jpg)


  **A** 尝试使用不同的背景颜色。将页面涂上颜色并晾干。


  ![图像](img/f0069-02.jpg)


  **B** 在你选择的媒介上覆盖彩色区域。这里我在粉色页面上使用了黑色细线笔。


  ![图像](img/f0069-03.jpg)


  **C** 尝试不同的彩色背景，了解它们对成品可能产生的影响。


  ![图像](img/f0069-04.jpg)


  随意的背景绘画可以为你提供一个起点和回应的刺激。


  ![图像](img/f0070-01.jpg)


  在页面上添加一种或多种颜色作为背景，然后画一些随意的线条。问问自己如何发展这个起点。这里的例子让我想起了山上的雨，于是我将其发展成了一幅印象派风景画。


  ![图像](img/f0070-02.jpg)![图像](img/f0070-03.jpg)


  添加你所选媒介的层次来构建你的素描本页面。


  ![图像](img/f0070-04.jpg)


  尝试在丙烯颜料上喷水并移动素描本以制造有意的滴落效果。


  ![图像](img/f0071-01.jpg)


  一旦一层干透，就通过强调某些区域来增强冲击力和视觉趣味。


  ![图像](img/f0071-02.jpg)


  选择与你想要的效果相符的画笔。大而厚的画笔会创造出大胆且富有表现力的痕迹。


  ![图像](img/f0071-03.jpg)


  尝试滴落和飞溅来创造动感。这里我在飞溅上有点过头了。如果要重做这一页，我会限制这些飞溅，并确保它们不要太均匀。


  ![图像](img/f0071-04.jpg)


  思考你页面的明暗色调。在这里的例子中，一切看起来都很中间调，所以我在地平线上添加了深蓝色水彩和一点白色颜料来变化色调。


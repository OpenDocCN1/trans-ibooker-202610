  bar\" [1]=\"baz\" [2]=\"one\" [3]=\"two\" [4]=\"three four\")\ndeclare -a mylist=([0]=\"\
  bar\" [1]=\"baz\" [2]=\"one\" [3]=\"two\")\n```\n\nDelete element 2 using unset\
  \ (dumped before and after):\n\n```\ndeclare -a mylist=([0]=\"bar\" [1]=\"baz\"\
  \ [2]=\"one\" [3]=\"two\")\ndeclare -a mylist=([0]=\"bar\" [1]=\"baz\" [3]=\"two\"\
  )\n```\n\n## Hashes\n\n也称为哈希、字典或 dict，关联数组是索引为任意字符串而不是整数的列表。它们在计数或“唯一化”（即忽略或删除重复）字符串等方面非常方便。\n\
  \n与列表不同，这些*必须*使用 `declare -A`、`local -A` 或 `readonly -A` 声明，并且下标始终是必需的。\n\n*Table\
  \ 4-2. Sample bash Hash*\n\n| Element | Value |\n|---|---|\n| myhash[oof] | foo\
  \ |\n| myhash[rab] | bar |\n| myhash[zab] | baz |\n\n对关联数组或哈希或 dict 的常见操作有：\n\n\
  - 声明一个变量为关联数组（我们在这里称之为“哈希”因为标志是 -A）\n- 为其分配一个或多个值\n- 显示（dump）所有值用于调试或复用\n- 引用一个或所有值（`for`，或\
  \ `for each`）\n- 引用特定值（查找）\n- 删除一个或多个值\n- 删除整个哈希\n\n同样，与其谈论所有这些，我们只是向你展示以便挑选所需的惯用法：\n\
  \n### Example 4-3. Bash Hash Example: Code\n\n```\n#!/usr/bin/env bash\n#### hashes.sh:\
  \ bash Hash example code\n#### Original Author & date: _bash Idioms_ 2022\n####\
  \ bash Idioms filename: examples/ch07/hashes.sh\n#\n________________________________________________________\n\
  \n#### Declare a hash\ndeclare -A myhash   # MUST do this, or `local -A` or `readonly\
  \ -A`\n\n#### Assign to it, note no \"+\"\n##myhash=(bar)               # Would\
  \ create or overwrite myhash[0]\nmyhash[a]='foo'\nmyhash[b]='bar'\nmyhash[c]='baz'\n\
  myhash[d]='one two'          # Different than our list example\nmyhash[e]='three\
  \ four'\n\n#### OR\n#myhash=( [a]=foo [b]=bar [c]=baz [d]=\"one two\" [e]=\"three\
  \ four\")\n\n#### Display or dump the details and values\necho -e \"\\nThe key count\
  \ is: ${#myhash[@] } or ${#myhash[*]}\"\n```\n\n```\necho -e \"\\nThe length of\
  \ the value of key [e] is:\n${#myhash[e]}\"\n\necho -e \"\\nDump or list:\"\ndeclare\
  \ -p myhash\necho -n \"\\${myhash[@}]      = \" ; printf \"%q|\"\n${myhash[@]}\n\
  echo -en \"\\n\\${myhash[*]}      = \" ; printf \"%q|\"\n${myhash[*]}\necho -en\
  \ \"\\n\\\"\\${myhash[@]}\\\" = \" ; printf \"%q|\"\n\"${myhash[@]}\"\necho -en\
  \ \"\\n\\\"\\${myhash[*]}\\\" = \" ; printf \"%q|\"\n\"${myhash[*]}\"\necho '' \
  \ # No newline in above\n#### See `help printf` or chapter 6, we need this to show\
  \ the correct words:\n#### %q    quote the argument in a way that can be reused\
  \ as shell input\n\n#### Iterate over the keys and values\n④\necho -e \"\\nforeach\
  \ \\\"\\${!myhash[@]}\\\":\"\nfor key in \"\\${!myhash[@]}\"; do\n    echo -e \"\
  \\tKey: $key; value: ${myhash[$key]}\"\ndone\n\necho -e \"\\nBut don't do this:\
  \ \\${myhash[*]}\"\nfor key in ${myhash[*]}; do\n    echo -e \"\\tKey: $key; value:\
  \ ${myhash[$key]}\"\ndone\n\n#### Handle slices (sub-sets) of the hash\n⑤\necho\
  \ -e \"\\nStart from element 3 and show a slice of 2 elements:\"\nprintf \"%q|\"\
  \ \"${myhash[@]:3:2}\"\necho ''  # No newline in above\n\n#echo -e \"\\nShift FIRST\
  \ key [0]:\"   = makes no sense in a hash!\n#echo -e \"\\nPop LAST key:\"      \
  \    = makes no sense in a hash!\n\n#### Delete keys or the entire hash\n⑥\necho\
  \ -e \"\\nDelete key c using unset (dumped before and after):\"\n```\n\n\n\n\n\n\
  declare -p myhash\nunset -v 'myhash[c]'\ndeclare -p myhash\n\n#### Delete the entire\
  \ hash\nunset -v myhash\n\n- 1. Declare a hash\n- 2. Assign to a hash\n- 3. Display\
  \ or dump the details and values\n- 4. Iterate over the keys and values\n- 5. Handle\
  \ slices (sub-sets) of the hash\n- 6. Delete elements or the entire hash\n\nThat\
  \ looks like this when you run it:\n\n### Example 4-4. Bash Hash Example: Output\n\
  \n```\nThe key count is: 5 or 5\n\nThe length of the value of key [e] is: 10\n\n\
  Dump or list:\ndeclare -A myhash=([a]=\"foo\" [b]=\"bar\" [c]=\"baz\" [d]=\"one\
  \ two\" [e]=\"three four\")\n${myhash[@] }    = foo|bar|baz|one|two|three|four|\n\
  ${myhash[*] }    = foo|bar|baz|one|two|three|four|\n\"${myhash[@]}\" = foo|bar|baz|one\\\
  \ two|three\\ four|\n\"${myhash[*]}\" = foo\\ bar\\ baz\\ one\\ two\\ three\\ four|\n\
  \nforeach \"${!myhash[@]}\":\n    Key: a; value: foo\n    Key: b; value: bar\n \
  \   Key: c; value: baz\nKey: d; value: one two\nKey: e; value: three four\n\nBut\
  \ don't do this: ${myhash[*]}\n    Key: foo; value:\n    Key: bar; value:\n    Key:\
  \ baz; value:\n    Key: one; value:\n    Key: two; value:\n    Key: three; value:\n\
  \    Key: four; value:\n\nStart from element 3 and show a slice of 2 elements:\n\
  baz|one\\ two|\n\nDelete key c using unset (dumped before and after):\ndeclare -A\
  \ myhash=( [a]=\"foo\" [b]=\"bar\" [c]=\"baz\" [d]=\"one two\" [e]=\"three four\"\
  \ )\ndeclare -A myhash=( [a]=\"foo\" [b]=\"bar\" [d]=\"one two\" [e]=\"three four\"\
  \ )\n\n## A simple word count example\n\nAs we said, one of the most common uses\
  \ of a hash is to count and/or “uniq” items, so here is a simple but concrete example.\n\
  \n### Example 4-5. Bash word count example: Code\n\n```\n#!/usr/bin/env bash\n####\
  \ word-count-example.sh: More examples for bash lists and hashes, and $RANDOM\n\
  #### Original Author & date: _bash Idioms_ 2022\n#### bash Idioms filename: examples/ch07/word-count-example.sh\n\
  #### ________________________________\n#### See also: `man uniq`\n```\n\n```\nWORD_FILE='/tmp/words.txt'\n\
  > $WORD_FILE\n①\ntrap \"rm -f $WORD_FILE\" ABRT EXIT HUP INT QUIT TERM\n\ndeclare\
  \ -A myhash\n②\n```\n\n```\necho \"Creating & reading random word list in: $WORD_FILE\"\
  \n\n#### Create a list of words to use for the hash example\nmylist=(foo bar baz\
  \ one two three four)\n\n#### Loop, and randomly pick elements out of the list\n\
  range=\"${#mylist[@]}\"\nfor ((i=0; i<35; i++)); do\n  random_element=\"$(( $RANDOM\
  \ % $range ))\"\n  echo \"${mylist[$random_element]}\" >> $WORD_FILE\ndone\n\n####\
  \ Read the word list into a hash\nwhile read line; do\n  (( myhash[$line]++ ))\n\
  done < $WORD_FILE\n\necho -e \"\\nUnique words from: $WORD_FILE\"\nfor key in \"\
  ${!myhash[@]}\"; do\n  echo \"$key\"\ndone | sort\n\necho -e \"\\nWord counts, ordered\
  \ by word, from: $WORD_FILE\"\nfor key in \"${!myhash[@]}\"; do\n  printf \"%s\\\
  t%d\\n\" $key ${myhash[$key]}\ndone | sort\n\necho -e \"\\nWord counts, ordered\
  \ by count, from: $WORD_FILE\"\nfor key in \"${!myhash[@]}\"; do\n  printf \"%s\\\
  t%d\\n\" $key ${myhash[$key]}\ndone | sort -k2,2n\n```\n\nWe’ll create a temporary\
  \ file and set a trap (Chapter 9) to clean it up.\n\n2 We have to `declare -A` the\
  \ hash as a bash *associative array* (again, we say that instead of “hash” here\
  \ because of the flag).\n\n3 Get the count of elements, or the *range* for the random\
  \ number we want.\n\n4 Use the bash `$RANDOM` variable to pick a random list element\
  \ (Chapter 4).\n\n5 Echo the random word into the temp file. We used three lines\
  \ (<3>, <4>, and <5>) to do something we could do in one line like `echo \"${mylist[$\
  \ $RANDOM % ${#mylist[@]}]}\" >> $WORD_FILE` but we think that one line would be\
  \ a lot harder to re-read six months from now.\n\n6 Read the file we just created,\
  \ note the location of the file name *after* the `done` keyword <8>.\n\n7 Increment\
  \ the “key” value in hash for the word we saw in the line in the file.\n\n8 Note\
  \ the location of the file name *after* the `done` keyword, from the loop in <6>.\n\
  \n9 Iterate over the keys to display a list of the words, without duplicates, and\
  \ without using the `uniq` external command. Note the `sort` command we did use\
  \ after the `done` keyword.\n\n10\n\nIterate over the keys again, but this time\
  \ display the “value” of the count as well.\n\n- 10. Iterate over the keys one last\
  \ time to display the count again, but this time sorted the second field as a number\
  \ (sort -k2,2n).\n\n### Example 4-6. Bash word count example: Output\n\n```\nCreating\
  \ & reading random word list in: /tmp/words.txt\n\nUnique words from: /tmp/words.txt\n\
  bar\nbaz\nfoo\nfour\none\nthree\ntwo\n\nWord counts, ordered by word, from: /tmp/words.txt\n\
  bar      7\nbaz      6\nfoo      4\nfour     3\none      5\nthree    4\ntwo    \
  \  6\n\nWord counts, ordered by count, from: /tmp/words.txt\nfour     3\nfoo   \
  \   4\nthree    4\none      5\nbaz      6\ntwo      6\nbar      7\n```\n\n## Style\
  \ and Readability\n\nWhen you get the data structure correct, the rest of the code\
  \ practically writes itself. When you get the data structure wrong,\n\neverything\
  \ is a struggle. Bash has the building blocks for simple data structures, and once\
  \ you get used to a little extra punctuation, they’re not that hard to use and read.\
  \ Just remember you almost always want [@] and not [*], and refer back to your cheat\
  \ sheet examples when you need to.\n\n## Summary\n\nIn this chapter we’ve demystified\
  \ bash array (list and hash) handling and showed idiomatic solutions for the common\
  \ use-cases.\n\nSee also:\n\n- - https://www.gnu.org/software/bash/manual/html_node/Arrays.html#Arrays\n\
  - - http://wiki.bash-hackers.org/syntax/arrays\n- - http://tldp.org/LDP/Bash-Beginners-Guide/html/sect_10_02.html\n\
  - - man uniq\n- - man sort\n\nunderstanding. Sure, modern systems and circumstances\
  \ are complex, so try hard not to make it any worse than it already is.\n\n- - The\
  \ corollary, as Brian Kernighan famously said, is that debugging is twice as hard\
  \ as writing the code in the first place, so if your code is as clever as you can\
  \ make it, you are—by definition—not smart enough to debug it.\n- - Try not to re-invent\
  \ the wheel. Whatever you are trying to do has probably been done before, and there’s\
  \ likely a tool or library for it. If that tool is already installed, just use it.\
  \ No matter how how hard you try you are never going to be able to match the effort\
  \ and testing that went into `rsync`, so just use it. If you find random code on\
  \ the internet…well, think about that one for a bit.\n- - Plan ahead for special\
  \ cases or overrides, since they will happen. Take a page out of Linux distribution\
  \ packaging systems and provide an `/etc/thing/global.cfg` for defaults that you\
  \ can blindly overwrite, then allow for overrides in `/etc/thing/config.d/` or similar,\
  \ see *The dropin directories section in Chapter 9*.\n- - If it’s not in revision\
  \ control it doesn’t exist! (And sooner or later, it will be lost and then *really*\
  \ won’t exist.)\n- - Document everything. (But you don’t have to write a book about\
  \ it…oh wait…) Write your code, your comments, and your docs for the new person\
  \ who will join the team a year from now, when you’ve forgotten *why* you did it\
  \ *that* way, so you can’t explain it to them. Document what *didn’t* work, and\
  \ maybe why, and cross-reference things, especially things that you can predict\
  \ can hurt you. (Yes, `rm -rf /$undefined_variable` turned out to be a *really bad\
  \ idea!*)\n\n- - Keep your code and documentation DRY; Don’t Repeat Yourself. As\
  \ soon as you end up with more than one copy, it’s guaranteed they will get out\
  \ of sync sooner or later, the only question is when. Use functions and libraries,\
  \ don’t be WET (We Enjoy Typing).\n\n## BASH IDIOMS STYLE GUIDE IS NOT PORTABLE\n\
  \nThis Bash Idioms Style Guide is specifically for Bash, so it is not portable to\
  \ POSIX, Bourne, Dash or other shells.! If you need to write for those shells you\
  \ will need to test and tweak this guide to account for the supported syntax and\
  \ feature of those shells.\n\nGetting down into more detail, what types of things\
  \ should be captured in your style guide? We’ll cover some of them in the following\
  \ sections.\n\n## Readability\n\nReadability of your code is important! Or as Python\
  \ says, *Readability counts*. You only write it once, but you (and others) will\
  \ probably read it many times. Spend the extra few seconds or minutes thinking about\
  \ the poor clueless person trying to read the code next year…it’s very likely to\
  \ be you. There’s a balance and a tension between abstraction (Don’t Repeat Yourself)\
  \ and readability.\n\n- - KISS (Keep it Simple, Stupid!)\n- - READABILITY: don’t\
  \ be “clever,” be clear\n- - Good names are critical!\n- - ALWAYS USE A HEADER\n\
  - - If at all possible, emit something useful for `-h`, `--help` and incorrect arguments!\n\
  \n\n\n\n\n- 优先使用“here”文档（以前导 TAB 开头）而不是一堆 echo 行\n- 使用 `source`（而不是 `.`）来包含配置文件，这些文件应以\
  \ `.cfg`（或 `.conf` 或你使用的标准）结尾\n- 如果可能，对所有内容都使用 ISO-8601 日期\n- 如果可能，保持事物列表（例如 ip\
  \ 地址、主机名、要安装的软件包等）按字母顺序排列；这可以防止重复并使添加或删除项目更容易\n  - 这适用于 `case` 语句、变量或数组/列表的内容，以及任何有意义的地方\n\
  - 如果可能，使用命令的长参数以提高可读性，例如使用 `diff --quiet` 而不是 `diff -q`，不过要注意在非 GNU/Linux 系统上的可移植性\n\
  \  - 如果任何选项很短或晦涩，请添加注释。\n  - 还应强烈考虑记录你选择或需要这些选项的原因，甚至记录你考虑过但因某种原因未使用的选项。\n  - 一定要记录那些看起来像是好主意但实际上可能导致问题的选项，尤其是那些你在其他地方经常使用的选项。\n\
  \n对于变量命名，要注意像以下这样的通用变量名：\n\n```\n`${GREP} ${pattern} ${file}`\n```\n\n这被抽象得非常厉害，也许可以重用，但它也非常缺乏上下文。我们已将旧的\
  \ `` 替换为更新且更\n\n添加 *有用* 的注释来解释 *为什么* 你这样做以及你的意图！例如：\n\n```\ncontinue # to the next\
  \ file in for loop\n```\n\n理论上，如果你写出清晰的代码，就不需要解释 *什么* 东西在做什么。但有时 bash 本身就很繁琐或晦涩，例如变量替换：\n\
  \n```\nPROGRAM=${0##*/}   # Basename in bash, see \"Prefix Removal\" in Chapter\
  \ 4\n```\n\n分隔符对于分隔代码的逻辑块通常很有用。但不要在底部添加关闭分隔符来“框”住它，这只会增加混乱并减少你屏幕上的代码行数 1 行。\n\n\
  无论如何，*不要* 在右侧用字符构建框！这完全没有必要，你会浪费大量时间让它“看起来正确”。更糟糕的是，这会强烈阻碍以后修复或更新注释，因为你又得重新修复框。\n\
  \n不要这样做：\n\n```\n################################################################################################\n\
  ######\n#### Please don't build boxes like this!\n#\n#\n#\n#### They make it VERY\
  \ painful to edit the comments later,\nbecause #\n#### now you have to worry about\
  \ the closing character on the\n#\n#### right-hand-side.  This example isn't too\
  \ bad, but it gets\n#\n#### out of hand quickly.\n#\n################################################################################################\n\
  ######\n```\n\n这样做：\n\n```\n######################################\n######\n####\
  \ Please DO build boxes like this!\n#\n#### This one is easier to edit, because\
  \ while you still have to\n#### worry about text wrapping, it's just a simple leading\
  \ \"####\" when\n#### do do re-wrap.\n```\n\n## Names\n\n命名 **很重要**。我们不能再强调这一点。`$file`\
  \ 和 `$critical_process_daily_log_file` 之间的区别现在看起来除了多打字 *之外* 什么都没有，当所有细节都在你脑子里时。但我们保证，如果你花额外的时间认真思考你命名的对象以及它在代码中读起来如何，这很快就会得到回报，减少编码错误，并在将来重读、调试和增强时受益。以下是与名称相关的风格指南：\n\
  \n- 好的名字至关重要！\n- 全局变量和常量使用大写\n  - 尽量不要更改全局变量，但有时这样做要简单得多\n  - 对常量使用 `readonly` 或\
  \ `declare -r`\n- 其他变量使用小写\n- 函数使用 Mixed_Case\n- 使用 \"_\" 代替空格或 CamelCase（记住 \"\
  -\" 不允许在变量名中使用）\n\n- 函数必须在被使用前定义\n  - 将它们分组在顶部，并在每个函数之间使用两行空白和函数分隔符。\n  - 不要在函数之间穿插代码！\n\
  - 使用 Camel_Case 和 \"_\" 使函数名与变量名区分开来。\n- 使用 `function My_Func_Name {` 而不是 `My_Func_Name()\
  \ {` 因为它更清晰，更容易 `grep -P '^\\s*function '`。\n- 每个函数都应有注释定义：它做什么、输入（包括 GLOBALS）和输出\n\
  - 当你有有用的、独立的代码片段时，将其做成函数。\n- 只要你多次使用相同（或基本相似）的代码块，就使用函数。如果它们很常见，比如日志记录或邮件发送，请考虑创建一个“库”，即一个你可以按需\
  \ source 的单一公共文件。\n  - 为“库”函数加上前缀 \"_\"，如 `_Log`，或其他前缀。\n- 如果有意义，考虑在参数中使用“填充”词以提高可读性，然后将其定义为\
  \ `local junk1=\"$2\" # unused filler`，例如：\n  - `_Create_File_If_Needed \"/path/to/$file\"\
  \ containing important value`\n- 在函数中设置变量时请使用 `local` 内置命令。\n\n- 但要注意它会掩盖返回码，因此如果使用命令替换，请在单独的行上声明和赋值，例如\
  \ `local my_input` 然后 `my_input=\"$(some-command)\"`。\n- 对于任何超过约 25 行的函数，使用 `} \
  \ # end of function MyFuncName` 来关闭它，以便在屏幕上更容易跟踪你在代码中的位置。对于少于 25 行的函数这是可选的，但鼓励使用，除非变得太混乱。\n\
  - 不要使用 `main` 函数，它几乎总是多余的一层。\n  - 尽管如此，使用“main”对 Python 和 C 程序员来说是有意义的，或者如果代码也用作库，并且如果你做大量单元测试时可能需要。\n\
  - 考虑在主部分上方使用 2 行空白和主分隔符，尤其是在顶部有很多函数和定义时。\n\n另外，在你的库中定义一个单一的日志函数（例如 `_Log`），并使用它！否则你最终会得到各种各样的日志函数、样式和目的地。理想情况下，正如我们上面所说，将日志记录到\
  \ syslog，让操作系统担心最终目的地、日志轮转等。\n\n## Quoting\n\n引用很简单，直到它变得不简单然后你就头疼了。我们知道这是怎么回事，我们仍然有时会做试错，尤其是尝试创建作为另一用户通过\
  \ `sudo` 运行或通过 `ssh` 在另一节点上运行的一行命令时。添加一些 `echo` 行，小心。以下是与引用相关的风格指南：\n\n- 确实要在变量和字符串周围加上引号，因为它使它们更突出并澄清你的意图\n\
  \  - 除非变得太混乱\n  - 或它们需要不加引号以进行展开\n- 不要引用整数\n- 除非需要插值，否则使用单引号\n- 不要使用 `${var}` 除非需要，它太混乱了\n\
  \  - 但有时确实需要，例如\n    `${variable}_suffix` 或\n    `${being_lower_cased,,}`\n- 对命令替换加引号，例如：`var=\"\
  $(command)\"`\n- 对任何测试语句的两侧 *始终* 加引号，例如 [[\n  \"$foo\" == bar ]]\n  - FIXME-TOOLS:\
  \ AsciiDoc missing single quotes again!\n  - 除非你使用 ~=，在这种情况下你不能引用正则表达式！\n- 考虑在 echo\
  \ 语句中对变量使用单引号，例如 echo \"cd to $DIR failed.\" 因为当变量意外未定义或为空时更清晰\n  - FIXME-TOOLS:\
  \ AsciiDoc missing single quotes again!\n  - 或 echo \"cd to [$DIR] failed.\" 随你喜欢\n\
  - 优先在 printf 格式周围使用单引号（参见第 6 章）\n\n和一个 IDE。首先，这取决于团队和个人，可能并非如此，其次即使是这样，当它 *真的* 坏掉并且你最终在\
  \ 80x24 控制台上的 `vi` 中在火线调试时，你不会欣赏 200+ 列的代码。\n\n换行。\n\n在重要部分 *之前* 换行，这样当你扫描列的左侧时，续行会跳出来。我们还喜欢对换行的行使用通常缩进的一半。我们无法在此书中做一个好的（坏的？）长行示例，因为它只会在奇怪的地方断开。但我们可以提供一个简单且我们认为可读的示例：\n\
  \n```\n... Lots of code, indented a ways...\n    /long/path/to/some/interesting/command\
  \ \\\n      | grep \"$re_stuff_we_care_about \\\n      | grep -v \"$re_stuff_to_ignore\
  \ \\\n      | /path/to/email_or_log_command ...\n...more code\n```\n\n## Syntax\n\
  \n以下是与语法相关的风格指南：\n\n- 编写 bash 代码时使用 `#!/bin/bash` 或 `#!/usr/bin/env bash`，而不是 `#!/bin/sh`\n\
  \  - FIXME-TOOLS: there’s a Markdown/Asciidoctor rendering issue with the three\
  \ # ! above\n- 除非你 *真的* 确定需要 `$*`，否则使用 `$@`\n- 使用 `==` 而不是 `=` 进行相等比较，以减少与赋值的混淆\n\
  - 使用 `$()` 而不是反引号/反引号\n\n\n\n\n\n- FIXME-TOOLS: Markdown/Asciidoctor 渲染在反引号处存在问题\n\
  - 使用 [[ 而不是 [\n- 使用 0 1 和 2 3 进行整数运算时按需使用，避免使用 let 和 expr\n- 当简单且可读时使用 [[ expression\
  \ ]] && block 或 [[ expression ]] || block。不要使用 [[ expression ]] && block || block，因为它不会按你想的那样工作，对于这种情况请使用\
  \ if .. (elif ..) then .. else。\n\n## Other\n\n其他指南：\n\n- 对于“system”脚本，将日志记录到 syslog，让操作系统处理最终目的地、日志轮转等。\n\
  - 错误信息应输出到 STDOUT，如 echo 'A Bad Thing happened' >&2\n- 检查外部工具是否可用\n- 失败时提供有用的信息\n\
  - 设置退出码，尤其是在失败时\n\n## Script Template\n\n这是一个示例骨架或模板脚本，你可以将其复制作为提醒，并在创建新脚本时节省一些输入。\n\
  \n```\n#!/bin/bash -\n#### Or possibly: ####!/usr/bin/env bash\n#### <Name>: <description>\n\
  ```\n```\n#### Original Author & date:\n#### Current maintainer?\n#### Copyright/License?\n\
  #### Where this code belongs?  (Hosts, paths, etc.)\n#### Project/repo?\n#### Caveats/gotchas?\n\
  #### Usage?  (Better to have `-h` and/or `--help` options!)\n#### $URL$  #### If\
  \ using SVN\nID=' '    # If using SVN\n#\n________________________________________________________\n\
  ________________________________________________________\nPROGRAM=${0##*/}  # bash\
  \ version of `basename`\n\n#### GLOBAL and constant variables are in UPPER case\n\
  LOG_DIR='/path/to/log/dir'\n\n#### Functions are in Mixed Case\n#####################################################################\n\
  ################\n#### Define functions\n\n#--------------------------------------------------------------------\n\
  ----------------\n#### Example function\n#### Globals: none\n#### Input:   nothing\n\
  #### Output: nothing\nfunction foo {\n    local var1=\"$1\"\n    ...\n} # end of\
  \ function foo\n\n#--------------------------------------------------------------------\n\
  ----------------\n#### Another example function\n#### Globals: none\n#### Input:\
  \   nothing\n#### Output: nothing\nfunction bar {\n    local var1=\"$1\"\n    ...\n\
  } # end of function bar\n```\n```\n##############################\n################\n\
  #### Main\n...\n```\n\n## Other Style Guides\n\n我们强烈建议你制定一份风格指南并使用它！如果你不喜欢我们的，并且你也不想自己调整，你可以从别处偷一个。\n\
  \n- https://google.github.io/styleguide/shellguide.html\n  - 虽然我们对其中一些内容有一些异议，但它非常好且相当全面。最好你可以直接使用它，最差的情况它也是一个起点。有很多值得喜欢的地方，你可以做得更差（比如什么都没有），而且很多其他项目也采用了它，所以…\n\
  \  - 除其他事项外，我们不同意：\n    - 100 行限制。我们看到了这一点，尤其是在 Google 这样的环境中，但我们有很多超过该限制的脚本，它们“主要是调用其他实用程序并且数据操作相对较少。”\n\
  \    - “缩进 2 个空格”对我们来说有点浅，我们喜欢对续行使用 2 个空格，其他情况使用 4 个空格。（哎呀，我们本来不想承认的，是吧？）\n    -\
  \ \"${var}\" 太繁琐了，我们在可能的情况下更喜欢 \"$var\"。\n    - function cleanup() {? 哎呀，不行。\n\n\
  - } } 关闭 +case..esac 块，应与块的开头保持相同的缩进，而不是与块中代码的缩进相同\n\n- 以下是可以参考的其他指南：\n\n  - https://linuxcommand.org/lc3_adv_standards.php\n\
  \n  - https://www.ovirt.org/develop/infra/infra-bash-style-guide.html\n\n  - https://wiki.bash-hackers.org/scripting/style\n\
  \n  - http://mywiki.wooledge.org/BashGuide/Practices\n\n  - 很好的信息\n    http://mywiki.wooledge.org/BashPitfalls\n\
  \n- 或在网上搜索\n\n  - \"Shell Style Guide\"\n\n  - \"Bash Style Guide\"\n\n  - \"Shell\
  \ script coding standards\"\n\n## Bash Linter\n\n使用“linter”作为风格指南的替代或补充也很方便。说实话，我们没有使用，但我们认为应该涵盖一下。我们知道的是\
  \ shellcheck，我们对结果有 mixed feelings，它对引号特别挑剔，我们也不总是同意它关于引号或其他方面的建议，但这些东西或多或少是可以调整的。话虽如此，它仍然非常酷，值得一看。\n\
  \n- Bash linter: https://www.shellcheck.net/\n\n  - https://github.com/koalaman/shellcheck\
  \ (Haskell)\n\n- History: https://www.vidarholen.net/contents/blog/?p=859\n- Checks:\n\
  \  https://github.com/koalaman/shellcheck/wiki/Checks\n- Tweaking:\n  https://github.com/koalaman/shellcheck/wiki/Directive\n\
  - Ignoring errors:\n  https://github.com/koalaman/shellcheck/wiki/Ignore\n- 注意，Eol\
  \ (2020) CentOS-6 太旧了：\n  https://github.com/koalaman/shellcheck/wiki/CentOS6\n\n\
  如果你通过包管理系统安装，请记住版本可能相当旧。Linux 版本是一个包含单个编译二进制文件的 tarball，所以很容易将当前版本放到你的路径中的某个位置。\n\
  \n## Summary\n\n希望，这本书能让你更好地理解如何阅读和编写“bashistic”代码，本章也为你开始定义一个适合你的风格（和指南）提供了一个起点。\n\
  \nHappy bashing!\n"

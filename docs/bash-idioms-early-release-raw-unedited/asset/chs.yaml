  \ GitHub 仓库将在稍后激活。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系作者 carl@bashcookbook.com。\n\
  \n这是第 5 章中要点的副本，但没有评论和示例。示例目录中还有一个 Markdown 文件，因此你可以下载并按需调整，然后使用 pandoc 或其他工具进行渲染或包含。\n\
  \n## BASH IDIOMS STYLE GUIDE IS NOT PORTABLE\n\n本 Bash Idioms Style Guide 专门针对 Bash，因此不能移植到\
  \ POSIX、Bourne、Dash 或其他 shell！如果你需要为这些 shell 编写，你将需要测试并调整本指南以适应支持的语法和功能。\n\n## Readability\n\
  \n代码的可读性很重要！或者正如 Python 所说，*可读性很重要*。你只写一次，但你（和其他人）可能会阅读很多次。花额外的几秒钟或几分钟思考明年试图阅读代码的可怜的糊涂的人……很可能就是你。抽象（不要重复自己）和可读性之间存在平衡和张力。\n\
  \n- KISS (Keep it Simple, Stupid!)\n- 可读性：不要“聪明”，要清晰\n- 好的名字至关重要！\n- 一定要使用头部\n-\
  \ 如果可能的话，为 `-h`、`--help` 和错误参数发出有用的内容！\n  - 优先使用“here”文档（带前导 TAB）而不是一堆 echo 行\n\
  - 使用 `source`（而不是 `.`）来包含配置文件，后者应以 `.cfg`（或 `.conf` 或你标准的任何名称）结尾\n- 如果可能的话，对所有内容都使用\
  \ ISO-8601 ¹ 日期\n- 如果可能，保持事物列表（例如，ip 地址、主机名、要安装的包等）的字母顺序；这可以防止重复并使添加或删除项目更容易\n \
  \ - 这适用于 `case` 语句、变量或数组/列表的内容，以及任何有意义的地方\n- 如果可能，使用命令的长参数以提高可读性，例如，使用 `diff --quiet`\
  \ 而不是 `diff -q`，不过要注意对非 GNU/Linux 系统的可移植性\n\n- 如果任何选项简短或晦涩，请添加注释。\n- 还应强烈考虑记录你选择或需要选项的原因，甚至记录你考虑过但出于某种原因未使用的选项。\n\
  - 一定要记录任何看起来像个好主意但实际上可能导致问题的选项，尤其是你在其他地方常用到的选项。\n\n## Comments\n\n- 一定要使用头部\n- 为一年后团队中的新人写你的注释\n\
  - 对你的函数进行注释\n- 不要对你做了什么进行注释。对你为什么做或不做某事进行注释\n  - 例外：当 bash 本身晦涩时，对你做了什么进行注释\n- 考虑添加关于外部程序选项的注释，尤其是当它们简短或晦涩时\n\
  \n## Names\n\n- 好的名字至关重要！\n- 全局变量和常量使用大写\n  - 尽量不要更改全局变量，但有时这样做要简单得多\n\n\n\n\n\n\
  - 使用 `readonly` 或 `declare -r` 来定义常量\n- 其他变量使用小写\n- 函数使用 Mixed_Case\n- 用 \"_\" 代替空格或\
  \ CamelCase（记住变量名中不允许使用 \"-\"）\n- 谨慎使用 bash 数组，它们可能难以阅读（参见第 4 章）。`for var in $regular_var`\
  \ 通常也能工作。\n- 尽快用可读的名称替换 $1, $2, .. $N\n  - 这样会使一切更易于调试和阅读，同时也便于设置默认值和增添或重新排列参数\n\
  - 区分引用类型的不同，例如 `$input_file` 与 `$input_dir`\n- 使用一致的 \"FIXME\" 和 \"TODO\" 标签，如有需要加上名称和工单号\n\
  \n## Functions\n\n- 一定要使用头部注释\n- 好的名称至关重要！\n- 函数必须在被使用前定义\n  - 将它们分组放在顶部，并在每个函数之间使用两个空行和一个函数分隔符。\n\
  \  - 不要在函数之间穿插代码！\n\n- 使用 Camel_Case 和 \"_\" 使函数名与变量名区分开来。\n- 使用 `function My_Func_Name\
  \ {` 而不是 `My_Func_Name() {` 因为它更清晰，也更容易通过 grep -P '^\\s*function ' 查找。\n- 每个函数都应有注释说明：它做什么，输入（包括\
  \ GLOBALS），以及输出\n- 当你有有用的、独立的代码片段时，将其做成一个函数。\n- 只要你多次使用相同（或基本相同）的代码块，就使用一个函数。如果它们很常见，比如日志记录或发送邮件，考虑创建一个“库”，即一个可以按需\
  \ source 的单一公共文件。\n  - 为“库”函数加上前缀 \"_\"，如 `_Log`，或其他前缀。\n- 如果在参数中加入“填充”词有助于可读性，可以考虑使用，然后将其定义为\
  \ `local junk1=\"$2\" # unused filler`，例如：\n  - `_Create_File_If_Needed \"/path/to/$file\"\
  \ containing important value`\n- 在函数中设置变量时请使用 `local` 内置命令。\n  - 但要注意它会掩盖返回码，因此如果使用命令替换，请将声明和赋值分开写，如\
  \ `local my_input` 然后 `my_input=\"$(some-command)\"`。\n- 对于任何超过约 25 行的函数，用 `} #\
  \ end of function MyFuncName` 来关闭它，以便在屏幕上更容易追踪\n\n你当前在代码中的位置。对于少于 25 行的函数这是可选的，但如果不会显得杂乱则建议使用。\n\
  \n- 不要使用 `main` 函数，它几乎总是多余的一层。\n  - 尽管如此，对于 Python 和 C 程序员来说使用“main”是有意义的，或者如果代码也用作库，并且如果你做大量单元测试时可能需要。\n\
  - 考虑在主部分上方使用 2 个空行和一个主分隔符，尤其是在顶部有大量函数和定义时。\n\n## Quoting\n\n- 对变量和字符串加上引号，因为这样会使其更突出并明确你的意图\n\
  \  - 除非变得过于杂乱\n  - 或它们需要不加引号以便展开\n- 不要给整数加引号\n- 除非需要插值，否则使用单引号\n- 不要使用 `${var}`\
  \ 除非必要，它太杂乱了\n  - 但有时确实需要，比如\n    `${variable}_suffix` 或\n    `${being_lower_cased,,}`\n\
  - 对命令替换加上引号，如：`var=\"$(command)\"`\n\n- 对任何测试语句的两侧都始终加上引号，如 [[ \"$foo\" == bar ]]\n\
  \  - FIXME-TOOLS: AsciiDoc 又缺少单引号了！\n  - 除非你使用 ~=，在这种情况下你不能给正则表达式加引号！\n\n- 考虑在 echo\
  \ 语句中对变量使用单引号，如 echo \"cd to $DIR failed.\" 因为当变量意外未定义或为空时更清晰\n  - FIXME-TOOLS:\
  \ AsciiDoc 又缺少单引号了！\n  - 或 echo \"cd to [$DIR] failed.\" 随你喜欢\n\n- 在 printf 格式中优先使用单引号（参见第\
  \ 6 章）\n\n## Layout\n\n- 对齐行！在 bash 中多个空格几乎无关紧要（= 两侧除外），而对齐相似的命令使阅读更容易，也便于看到相似性和差异。\n\
  \n- 不要允许尾随空白！这会在 VCS（版本控制系统）中在后续移除时产生噪音。\n\n- 使用 4 个空格缩进，但在 here-doc 中根据需要使用 TAB\n\
  \n- 在约 78 列处换行长行，续行缩进 2 个空格，并在 | 或 > 之前换行，这样在扫描代码时这些部分会突出\n\n- 打开块的代码放在一行中，如：\n\
  \  - `if expression; then`\n  - `for expression; do`\n- `case..esac` 中的列表元素缩进 4\
  \ 个空格，闭合的 `;;` 与该缩进级别相同，每个项目的块也缩进 4 个空格\n  - 单行元素应在同一行用 `;;` 闭合\n  - 优先对齐每个元素中的\
  \ `)`，除非变得杂乱或失控\n  - 参见 *Chapter 8* 中的示例代码\n\n## Syntax\n\n- 编写 bash 代码时使用 `#!/bin/bash`\
  \ 或 `#!/usr/bin/env bash`，不要使用 `#!/bin/sh`\n  - FIXME-TOOLS: 三个 # ! 上方存在 Markdown/Asciidoctor\
  \ 渲染问题\n- 除非你 *真的* 确定需要 `$*`，否则使用 `$@`\n- 使用 `==` 而不是 `=` 进行相等比较，以减少与赋值的混淆\n- 使用\
  \ `$()` 而不是 `<code>``</code>` 反引号/反引号\n  - FIXME-TOOLS: 反引号存在 Markdown/Asciidoctor\
  \ 渲染问题\n- 使用 `[ [` 而不是 `[`\n\n- 根据需要使用 `0 1` 和 `2 3` 进行整数运算，避免使用 `let` 和 `expr`\n\
  - 当简单且可读时使用 `[[ expression ]] && block` 或 `[[ expression ]] || block`。不要使用 `[[ expression\
  \ ]] && block || block` 因为它不会按你想的那样工作，对于这种情况使用 `if .. (elif .. ) then .. else`\n\
  \n## Other\n\n- 对于“系统”脚本，记录到 syslog，让操作系统处理最终目标、日志轮转等\n- 错误信息应发送到 STDOUT，如 `echo\
  \ 'A Bad Thing happened' >&2`\n- 检查外部工具是否可用\n- 失败时提供有用的信息\n- 设置 `exit` 代码，尤其是在失败时\n\
  \n## Script Template\n\n```\n#!/bin/bash -\n#### Or possibly: ####!/usr/bin/env\
  \ bash\n#### <Name>: <description>\n#### Original Author & date:\n#### Current maintainer?\n\
  #### Copyright/License?\n#### Where this code belongs?  (Hosts, paths, etc.)\n####\
  \ Project/repo?\n#### Caveats/gotchas?\n#### Usage?  (Better to have `-h` and/or\
  \ `--help` options!)\n#### $URL$  #### If using SVN\nID=''      # If using SVN\n\
  #### ____________________________________________________________\n```\n\n```\n\
  PROGRAM=${0##*/}  # bash version of `basename`\n\n#### GLOBAL and constant variables\
  \ are in UPPER case\nLOG_DIR='/path/to/log/dir'\n\n#### Functions are in Mixed Case\n\
  ######################################################################\n################\n\
  #### Define functions\n\n#--------------------------------------------------------------------\n\
  ----------------\n#### Example function\n#### Globals: none\n#### Input:  nothing\n\
  #### Output: nothing\nfunction foo {\n    local var1=\"$1\"\n    ...\n} # end of\
  \ function foo\n\n#--------------------------------------------------------------------\n\
  ----------------\n#### Another example function\n#### Globals: none\n#### Input:\
  \  nothing\n#### Output: nothing\nfunction bar {\n    local var1=\"$1\"\n    ...\n\
  } # end of function bar\n\n######################################################################\n\
  ################\n#### Main\n...\n```\n"

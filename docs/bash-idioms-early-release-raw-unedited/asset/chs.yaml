  \ baz\\ one\\ two\\ three\\ four|  # But this is broken!\n\nforeach \"${!mylist[@]}\"\
  :\n    Element: 0;  value: foo\n    Element: 1;  value: bar\n    Element: 2;  value:\
  \ baz\n    Element: 3;  value: one\n    Element: 4;  value: two\n    Element: 5;\
  \  value: three four\n\nBut don't do this: ${mylist[*]}\n    Element: foo; value:\
  \ foo\n    Element: bar; value: foo\n    Element: baz; value: foo\n    Element:\
  \ one; value: foo\n    Element: two; value: foo\n    Element: three; value: foo\n\
  \    Element: four; value: foo\n\nStart from element 3 and show a slice of 2 elements:\n\
  one|two|\n\nShift FIRST element [0] (dumped before and after):\ndeclare -a mylist=([0]=\"\
  foo\" [1]=\"bar\" [2]=\"baz\" [3]=\"one\"\n[4]=\"two\" [5]=\"three four\")\ndeclare\
  \ -a mylist=([0]=\"bar\" [1]=\"baz\" [2]=\"one\" [3]=\"two\" [4]=\"three four\"\

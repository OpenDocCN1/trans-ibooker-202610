    \ {` 而不是 `My_Func_Name() {` 因为它更清晰，也更容易通过 grep -P '^\\s*function ' 查找。\n- 每个函数都应有注释说明：它做什么，输入（包括\
    \ GLOBALS），以及输出\n- 当你有有用的、独立的代码片段时，将其做成一个函数。\n- 只要你多次使用相同（或基本相同）的代码块，就使用一个函数。如果它们很常见，比如日志记录或发送邮件，考虑创建一个“库”，即一个可以按需\
    \ source 的单一公共文件。\n  - 为“库”函数加上前缀 \"_\"，如 `_Log`，或其他前缀。\n- 如果在参数中加入“填充”词有助于可读性，可以考虑使用，然后将其定义为\
    \ `local junk1=\"$2\" # unused filler`，例如：\n  - `_Create_File_If_Needed \"/path/to/$file\"\
    \ containing important value`\n- 在函数中设置变量时请使用 `local` 内置命令。\n  - 但要注意它会掩盖返回码，因此如果使用命令替换，请将声明和赋值分开写，如\
    \ `local my_input` 然后 `my_input=\"$(some-command)\"`。\n- 对于任何超过约 25 行的函数，用 `}\
    \ # end of function MyFuncName` 来关闭它，以便在屏幕上更容易追踪\n\n你当前在代码中的位置。对于少于 25 行的函数这是可选的，但如果不会显得杂乱则建议使用。\n\
    \n- 不要使用 `main` 函数，它几乎总是多余的一层。\n  - 尽管如此，对于 Python 和 C 程序员来说使用“main”是有意义的，或者如果代码也用作库，并且如果你做大量单元测试时可能需要。\n\
    - 考虑在主部分上方使用 2 个空行和一个主分隔符，尤其是在顶部有大量函数和定义时。\n\n## Quoting\n\n- 对变量和字符串加上引号，因为这样会使其更突出并明确你的意图\n\
    \  - 除非变得过于杂乱\n  - 或它们需要不加引号以便展开\n- 不要给整数加引号\n- 除非需要插值，否则使用单引号\n- 不要使用 `${var}`\
    \ 除非必要，它太杂乱了\n  - 但有时确实需要，比如\n    `${variable}_suffix` 或\n    `${being_lower_cased,,}`\n\
    - 对命令替换加上引号，如：`var=\"$(command)\"`\n\n- 对任何测试语句的两侧都始终加上引号，如 [[ \"$foo\" == bar\
    \ ]]\n  - FIXME-TOOLS: AsciiDoc 又缺少单引号了！\n  - 除非你使用 ~=，在这种情况下你不能给正则表达式加引号！\n\n\
    - 考虑在 echo 语句中对变量使用单引号，如 echo \"cd to $DIR failed.\" 因为当变量意外未定义或为空时更清晰\n  - FIXME-TOOLS:\
    \ AsciiDoc 又缺少单引号了！\n  - 或 echo \"cd to [$DIR] failed.\" 随你喜欢\n\n- 在 printf 格式中优先使用单引号（参见第\
    \ 6 章）\n\n## Layout\n\n- 对齐行！在 bash 中多个空格几乎无关紧要（= 两侧除外），而对齐相似的命令使阅读更容易，也便于看到相似性和差异。\n\
    \n- 不要允许尾随空白！这会在 VCS（版本控制系统）中在后续移除时产生噪音。\n\n- 使用 4 个空格缩进，但在 here-doc 中根据需要使用 TAB\n\
    \n- 在约 78 列处换行长行，续行缩进 2 个空格，并在 | 或 > 之前换行，这样在扫描代码时这些部分会突出\n\n- 打开块的代码放在一行中，如：\n\
    \  - `if expression; then`\n  - `for expression; do`\n- `case..esac` 中的列表元素缩进\
    \ 4 个空格，闭合的 `;;` 与该缩进级别相同，每个项目的块也缩进 4 个空格\n  - 单行元素应在同一行用 `;;` 闭合\n  - 优先对齐每个元素中的\
    \ `)`，除非变得杂乱或失控\n  - 参见 *Chapter 8* 中的示例代码\n\n## Syntax\n\n- 编写 bash 代码时使用 `#!/bin/bash`\
    \ 或 `#!/usr/bin/env bash`，不要使用 `#!/bin/sh`\n  - FIXME-TOOLS: 三个 # ! 上方存在 Markdown/Asciidoctor\
    \ 渲染问题\n- 除非你 *真的* 确定需要 `$*`，否则使用 `$@`\n- 使用 `==` 而不是 `=` 进行相等比较，以减少与赋值的混淆\n-\
    \ 使用 `$()` 而不是 `<code>``</code>` 反引号/反引号\n  - FIXME-TOOLS: 反引号存在 Markdown/Asciidoctor\
    \ 渲染问题\n- 使用 `[ [` 而不是 `[`\n\n- 根据需要使用 `0 1` 和 `2 3` 进行整数运算，避免使用 `let` 和 `expr`\n\
    - 当简单且可读时使用 `[[ expression ]] && block` 或 `[[ expression ]] || block`。不要使用 `[[\
    \ expression ]] && block || block` 因为它不会按你想的那样工作，对于这种情况使用 `if .. (elif .. ) then\
    \ .. else`\n\n## Other\n\n- 对于“系统”脚本，记录到 syslog，让操作系统处理最终目标、日志轮转等\n- 错误信息应发送到\
    \ STDOUT，如 `echo 'A Bad Thing happened' >&2`\n- 检查外部工具是否可用\n- 失败时提供有用的信息\n- 设置\
    \ `exit` 代码，尤其是在失败时\n\n## Script Template\n\n```\n#!/bin/bash -\n# Or possibly:\
    \ #!/usr/bin/env bash\n# <Name>: <description>\n# Original Author & date:\n# Current\
    \ maintainer?\n# Copyright/License?\n# Where this code belongs?  (Hosts, paths,\
    \ etc.)\n# Project/repo?\n# Caveats/gotchas?\n# Usage?  (Better to have `-h` and/or\
    \ `--help` options!)\n# $URL$  # If using SVN\nID=''      # If using SVN\n# ____________________________________________________________\n\
    ```\n\n```\nPROGRAM=${0##*/}  # bash version of `basename`\n\n# GLOBAL and constant\
    \ variables are in UPPER case\nLOG_DIR='/path/to/log/dir'\n\n# Functions are in\
    \ Mixed Case\n######################################################################\n\
    ################\n# Define functions\n\n#--------------------------------------------------------------------\n\
    ----------------\n# Example function\n# Globals: none\n# Input:  nothing\n# Output:\
    \ nothing\nfunction foo {\n    local var1=\"$1\"\n    ...\n} # end of function\
    \ foo\n\n#--------------------------------------------------------------------\n\
    ----------------\n# Another example function\n# Globals: none\n# Input:  nothing\n\
    # Output: nothing\nfunction bar {\n    local var1=\"$1\"\n    ...\n} # end of\
    \ function bar\n\n######################################################################\n\
    ################\n# Main\n...\n```\n"

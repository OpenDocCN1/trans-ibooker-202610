    # Chapter 1. A Big “If” Idiom


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 1st chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the authors at bash-idioms@jpsdomain.org.


    To get you started in your understanding bash idioms we’ll look at a bash construct
    that allows you to do what you might normally do with an if/then/else construct
    but with sparser syntax. The idiomatic expression we’ll show you in this chapter
    has some real advantages - mostly terseness - and some pitfalls to avoid. But
    if you don’t know bash idioms you might not recognize or realize what is going
    on.


    Take a look at this piece of code:


    ```

    [ -n "$DIR" ] && cd "$DIR"

    ```


    Do you think that looks like an “if” statement? If you’re conversant in bash you’ll
    recognize that it is functionally the same thing; you’ll understand it as an “if”
    statement even though the “if” keyword doesn’t appear in the code.


    What’s going on?'
  - '[PAGE 12]


    # The Big “if”


    Let’s now look at a similar but simpler example:


    ```

    cd tmp && rm scratchfile

    ```


    This too, is, in effect, an if statement. If the cd command succeeds then (and
    only then) execute the rm command. The “idiom” here is the use of the double ampersand
    "&&" (typically read as “and”) to separate the two commands.


    Logic or philosophy classes teach the rule: the expression “A AND B” is true if
    and only if both A and B are each true. Therefore if A is false, there is no need
    to even consider the value of B. For example, consider “I own a dog AND I own
    a cat”. If I do not own a dog then this compound expression is false for me, regardless
    of my cat situation.


    Let’s apply this to bash. Remember that the basic function of bash is to execute
    programs. The first part of this statement has the cd command execute. Similar
    to the logic of the AND, if this first command fails, bash will not bother to
    execute the second part, the rm command.


    The use of the && is meant to remind you of the AND behavior. bash isn’t actually
    performing an “AND” operation on these two results. (If this were C/C++ that would
    be a different story, though the conditional execution is the same.) However,
    this bash idiom does provide the conditional execution of the second command -
    it isn’t run if the first command fails.


    Let’s go back and look at the original example we gave, namely this expression:


    ```

    [ -n "$DIR" ] && cd "$DIR"

    ```'

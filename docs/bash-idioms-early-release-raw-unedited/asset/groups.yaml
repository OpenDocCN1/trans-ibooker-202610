    let "median_loc = len / 2"


    (( dist *= 4 ))    # is the same as:

    let "dist*=4"

    ```


    But be careful — if you don’t use quotes around the let expression then you better
    not have any spaces in that expression at all. (The first let in our example doesn’t
    need the quotes, but it’s a good habit to always use them.) Spaces will divide
    your command into separate words and let only takes a single word, so you’ll get
    a syntax error if there is more than one word.



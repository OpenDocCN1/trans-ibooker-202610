    +   - FIXME-TOOLS: there’s a Markdown/Asciidoctor rendering issue with the backticks

    +   - Use [[ instead of [

    +   - Use 0 1 and 2 3 as needed for integer arithmetic, avoid let and expr

    +   - Use [[ expression ]] && block or [[ expression ]] || block when simple and
    readable. Do not use [[ expression ]] && block || block because that doesn’t do
    what you think it does, use if .. (elif ..) then .. else for that.


    # Other


    Other guidelines:


    +   - For “system” scripts, log to syslog and let the OS worry about final destination(s),
    log rotation, etc.

    +   - Error messages should go to STDOUT, like echo ''A Bad Thing happened'' >&2

    +   - Sanity check that external tools are available

    +   - Provide useful messages when things fail

    +   - Set exit codes, especially when you fail


    # Script Template


    This is a sample skeleton or template script you can copy as a reminder and to
    save some typing when you create a new script.


    ```

    #!/bin/bash -

    # Or possibly: #!/usr/bin/env bash

    # <Name>: <description>

    ```'

    # Hashes


    Also known as hashes, dictionaries, or dicts, associative arrays are lists where
    the index is an arbitrary string instead of an integer. They are amazingly handy
    for counting or “uniqueing” (that is, ignoring or removing duplicate) strings,
    among other things.


    Unlike lists, these *must* be declared using `declare -A`, `local -A`, or `readonly
    -A` and the subscript is always required.


    *Table 4-2. Sample bash Hash*


    | Element | Value |

    |---|---|

    | myhash[oof] | foo |

    | myhash[rab] | bar |

    | myhash[zab] | baz |


    The common operations on an associative array or hash or dict are:


    +   - Declare a variable as an associative array (we say that instead of “hash”
    here because the flag is -A)

    +   - Assign one or more values to it'
  - '[PAGE 50]


    +   - Display (dump) all values for debugging or reuse

    +   - Reference one or all values (`for`, or `for each`)

    +   - Reference a specific value (lookup)

    +   - Delete one or more values

    +   - Delete the entire hash


    Again, rather than talk about all of that, we’re just going to show you so pick
    out the idioms you need:


    # Example 4-3. Bash Hash Example: Code


    ```

    #!/usr/bin/env bash

    # hashes.sh: bash Hash example code

    # Original Author & date: _bash Idioms_ 2022

    # bash Idioms filename: examples/ch07/hashes.sh

    #

    ________________________________________________________


    # Declare a hash

    declare -A myhash   # MUST do this, or `local -A` or `readonly -A`


    # Assign to it, note no "+"

    ##myhash=(bar)               # Would create or overwrite myhash[0]

    myhash[a]=''foo''

    myhash[b]=''bar''

    myhash[c]=''baz''

    myhash[d]=''one two''          # Different than our list example

    myhash[e]=''three four''


    # OR

    #myhash=( [a]=foo [b]=bar [c]=baz [d]="one two" [e]="three four")


    # Display or dump the details and values

    echo -e "\nThe key count is: ${#myhash[@] } or ${#myhash[*]}"

    ```'

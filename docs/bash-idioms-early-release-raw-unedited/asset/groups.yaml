    Shell Style Guide\"\n\n  - \"Bash Style Guide\"\n\n  - \"Shell script coding standards\"\
    \n\n## Bash Linter\n\n使用“linter”作为风格指南的替代或补充也很方便。说实话，我们没有使用，但我们认为应该涵盖一下。我们知道的是\
    \ shellcheck，我们对结果有 mixed feelings，它对引号特别挑剔，我们也不总是同意它关于引号或其他方面的建议，但这些东西或多或少是可以调整的。话虽如此，它仍然非常酷，值得一看。\n\
    \n- Bash linter: https://www.shellcheck.net/\n\n  - https://github.com/koalaman/shellcheck\
    \ (Haskell)\n\n- History: https://www.vidarholen.net/contents/blog/?p=859\n- Checks:\n\
    \  https://github.com/koalaman/shellcheck/wiki/Checks\n- Tweaking:\n  https://github.com/koalaman/shellcheck/wiki/Directive\n\
    - Ignoring errors:\n  https://github.com/koalaman/shellcheck/wiki/Ignore\n- 注意，Eol\
    \ (2020) CentOS-6 太旧了：\n  https://github.com/koalaman/shellcheck/wiki/CentOS6\n\
    \n如果你通过包管理系统安装，请记住版本可能相当旧。Linux 版本是一个包含单个编译二进制文件的 tarball，所以很容易将当前版本放到你的路径中的某个位置。\n\
    \n## Summary\n\n希望，这本书能让你更好地理解如何阅读和编写“bashistic”代码，本章也为你开始定义一个适合你的风格（和指南）提供了一个起点。\n\
    \nHappy bashing!\n\n## Appendix A. Bash Idioms Style Guide\n\n## A NOTE FOR EARLY\
    \ RELEASE READERS\n\n对于 Early Release 电子书，你可以在官方发布这些标题之前很久就利用这些技术——在作者撰写时获得书籍的最原始和未编辑内容。\n\
    \n这将是最终书籍的附录。请注意 GitHub 仓库将在稍后激活。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系作者\
    \ carl@bashcookbook.com。\n\n这是第 5 章中要点的副本，但没有评论和示例。示例目录中还有一个 Markdown 文件，因此你可以下载并按需调整，然后使用\
    \ pandoc 或其他工具进行渲染或包含。\n\n## BASH IDIOMS STYLE GUIDE IS NOT PORTABLE\n\n本 Bash\
    \ Idioms Style Guide 专门针对 Bash，因此不能移植到 POSIX、Bourne、Dash 或其他 shell！如果你需要为这些 shell\
    \ 编写，你将需要测试并调整本指南以适应支持的语法和功能。\n\n## Readability\n\n代码的可读性很重要！或者正如 Python 所说，*可读性很重要*。你只写一次，但你（和其他人）可能会阅读很多次。花额外的几秒钟或几分钟思考明年试图阅读代码的可怜的糊涂的人……很可能就是你。抽象（不要重复自己）和可读性之间存在平衡和张力。\n\
    \n- KISS (Keep it Simple, Stupid!)\n- 可读性：不要“聪明”，要清晰\n- 好的名字至关重要！\n- 一定要使用头部\n\
    - 如果可能的话，为 `-h`、`--help` 和错误参数发出有用的内容！\n  - 优先使用“here”文档（带前导 TAB）而不是一堆 echo 行\n\
    - 使用 `source`（而不是 `.`）来包含配置文件，后者应以 `.cfg`（或 `.conf` 或你标准的任何名称）结尾\n- 如果可能的话，对所有内容都使用\
    \ ISO-8601 ¹ 日期\n- 如果可能，保持事物列表（例如，ip 地址、主机名、要安装的包等）的字母顺序；这可以防止重复并使添加或删除项目更容易\n\
    \  - 这适用于 `case` 语句、变量或数组/列表的内容，以及任何有意义的地方\n- 如果可能，使用命令的长参数以提高可读性，例如，使用 `diff\
    \ --quiet` 而不是 `diff -q`，不过要注意对非 GNU/Linux 系统的可移植性\n\n- 如果任何选项简短或晦涩，请添加注释。\n-\
    \ 还应强烈考虑记录你选择或需要选项的原因，甚至记录你考虑过但出于某种原因未使用的选项。\n- 一定要记录任何看起来像个好主意但实际上可能导致问题的选项，尤其是你在其他地方常用到的选项。\n\
    \n## Comments\n\n- 一定要使用头部\n- 为一年后团队中的新人写你的注释\n- 对你的函数进行注释\n- 不要对你做了什么进行注释。对你为什么做或不做某事进行注释\n\
    \  - 例外：当 bash 本身晦涩时，对你做了什么进行注释\n- 考虑添加关于外部程序选项的注释，尤其是当它们简短或晦涩时\n\n## Names\n\n\
    - 好的名字至关重要！\n- 全局变量和常量使用大写\n  - 尽量不要更改全局变量，但有时这样做要简单得多\n\n"

    \ because, as we’ll show, if you get it wrong you can hurt yourself. We’ve used\
    \ printf \"%q\" with a pipe (|) delimiter in the example code below to show “shell\
    \ quoted” strings (technically “words”) in a way that is visible in the output\
    \ on the screen or on this page. The quoting rules are actually the same as we\
    \ cover in Chapter 2, just in the context of a list or hash.\n\n## BEWARE OF UNSET\n\
    \nWe use unset below, and there’s a subtle catch. If you happen to have a file\
    \ with the same name as a variable, globbing ¹ can hurt you and you can clobber\
    \ unexpected things. To avoid that it’s best to quote your variable. It’s even\
    \ safer to use -v to force unset to treat your argument as a shell variable, like\
    \ unset -v 'list'.\n\n## Lists\n\nAs we said, arrays, also known as lists, are\
    \ variables containing multiple elements that are indexed or referred to by an\
    \ integer.\n\nIn bash they start from zero and may be declared using declare -a,\
    \ local -a, readonly -a or by just assigning to a new variable like mylist[0]=foo\
    \ or mylist=() (empty list). Once a variable is declared as a list, a simple assignment\
    \ like mylist+=(bar) is the same as a push, but note the \\+ and () both of which\
    \ are critical.\n\nTable 4-1. Sample bash List\n\n| Element | Value |\n|---|---|\n\
    | mylist[0] | foo |\n| mylist[1] | bar |\n| mylist[2] | baz |\n"
  mdcn: "\n\n如果要进行算术表达式和比较运算，更好的选择是使用双括号语法。这样可以获得更熟悉的 C/Java/Python 风格的比较运算符，并且对空格的使用更自由：\n\
    \n```\nif (( OTHERVAL * 10 <= VAL / 5 )) ; then ...\n```\n\n## Style and Readability\n\
    \n面对如此多的选择，你应该选择哪种 if 语句风格？我们选择最适合所考虑计算的风格。当表达式非常数学化时，我们使用双括号。由于在双括号内部获取变量值时不需要使用\
    \ $，我们会尽量一致地省略它们。对于文本密集的比较，我们使用双括号，特别是因为这样可以让我们使用正则表达式。\n\n对于算术表达式，有些人可能更喜欢在表达式周围使用双括号，与\
    \ if 语句保持一致。然而，对于其他人来说，简单的 let 内置命令读起来更清晰简洁。虽然 bash 在变量声明为仅整数时允许不使用括号或 let 的算术运算，但我们避免这种风格。很容易混用变量，其中一些可能未声明为整数。由此会产生混淆。将表达式放在双括号中（或使用\
    \ let）可以保证它始终保持算术求值。\n\n## Summary\n\n作为一条规则，在 bash 中，双括号表示正在进行算术运算。美元符号表示你想要返回表达式的值，否则你只会得到成功/失败的结果状态。但运算符丰富的\
    \ bash 使得使用以下两种方式做类似的事情成为可能\n\n双括号语法或 `let` 内置命令。你可以冒险通过将变量声明为整数来跳过双括号，但我们不能推荐这样做。\n\
    \n对于条件判断，更新的 [ [ 语法要比 [ 好得多。然而，如果你的条件是算术比较，更好的选择甚至是 ( ( 语法。\n\n## Chapter 4. List\
    \ and Hash Handling\n\n### A NOTE FOR EARLY RELEASE READERS\n\n对于 Early Release\
    \ 电子书，你可以在官方发布这些书之前很久就获得书籍的早期形式——作者在写作时的原始未编辑内容——从而利用这些技术。\n\n这将是最终书籍的第 7 章。请注意\
    \ GitHub 仓库将在稍后激活。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系作者 bash-idioms@jpsdomain.org。\n\
    \n正如我们所知，计算机在计数和组织数据方面非常擅长。我们可以使用代码来计数和组织数据，使用 *数据结构*，而其构建块就是数组。Bash 从一开始就有了数组，并在\
    \ 4.0 版本中添加了“关联数组”。你在 bash 数组中会遇到难以阅读的代码，部分原因是 bash 有很多历史和向后兼容性需要维护，正如我们前面提到的，但也因为一些开发者倾向于过度复杂化。数组实际上并不难实现，只要稍加思考，你就可以清晰地写出它们。\n\
    \n作为复习，在计算机科学和编程中，数组是包含多个元素并由整数索引或引用的变量。换句话说，数组是一个包含\n\n列表而不是标量或单个值的变量。关联数组是一种按字符串而不是整数索引的列表类型。所以它是一个键值对列表，从根本上形成了一个字典或查找表，其中键在内部被哈希以形成内存位置。差不多就是这样。\n\
    \nbash 文档使用“array”和“associative arrays”术语，但根据你的背景，“lists”和“hashes”，或者可能是“dictionaries”或“dicts”，可能更熟悉，而且它们肯定更容易输入和说。bash\
    \ 文档还使用“subscript”，而其他人可能会说“index”。我们通常为了保持一致而遵循 bash 文档，但对于这些，我们将使用更常见且更易于理解的“list”、“hash”和“subscript”术语。\n\
    \n尽管列表（数组）出现得更早，但哈希（关联数组）稍微简单一些，因为永远不会对提供索引（下标）产生疑问，因为它是必需的。列表的整数索引可能是隐含的，虽然它并不复杂，但有一些操作适用于它们，而对哈希则毫无意义。\n\
    \n正如 bash 参考手册所说，*Bash provides one-dimensional indexed and associative array\
    \ variables.* 虽然可以创建非常丑陋的多维结构，但在 bash 中这样做很可能会以眼泪告终。如果你真的需要这样做，请考虑在另一种语言中实现。\n\
    \n## WATCH OUT FOR BASH VERSION WITH HASHES\n\n你真的需要小心你的 bash 版本。正如我们刚才所说，bash\
    \ 直到 4.0 版本才获得关联数组，并且花了几个版本才理清一些细节，例如允许 `$list[-1]` 引用最后一个整数元素（v4.3），而不是需要 `mylist[${#mylist[*]}-1]`.\
    \ 哎呀。\n\n正如我们在 *earlier content* 中所说，要注意 Mac 上的 stock `bash`，它相当老旧。你可以在 MacPorts、Homebrew\
    \ 或 Fink 中找到更新的版本。\n\n此外，数组（列表和哈希）未被 POSIX 指定，因此如果可移植性超出 bash 的范围是一个问题，你在使用它们时需要非常小心，因为它们可能无法工作。\n\
    \n## Commonalities\n\n在 bash 中，列表和哈希非常相似，所以我们将从它们共同之处开始，然后再讨论它们的不同之处。事实上，你可以将列表视为哈希的一个子集，只是恰好具有有序的整数索引。我们不认为你*应该*这样做，但你*可以*。\n\
    \n列表本质上是有序的，而哈希本质上是无序的，因此像 `shift` 或 `push` 这样的操作只对有序列表有意义。另一方面，你永远不需要对有序列表的键进行排序，但对于哈希你可能需要。\n\
    \n> **ACCIDENTAL ASSIGNMENT**\n> \n> 没有 *subscript* 的意外赋值会影响元素零，因此 `myarray=foo`\
    \ 会导致创建或覆盖 `$myarray[0]` 为 `foo`，即使它是一个哈希！\n\n来自 bash 文档：\n\n> *If the subscript\
    \ is @ or *, the word expands to all members of the array name. These subscripts\
    \ differ only when the word appears within double quotes. If the word is double-quoted,\
    \ `${name[*]}` expands to a single word with the value of each array member separated\
    \ by the first character of the IFS variable, and `${name[@]}` expands each element\
    \ of name to a separate word.*\n\n这不是很拗口吗？但它很重要，因为，正如我们将展示的那样，如果你做错了，你可能会伤害自己。我们在下面的示例代码中使用了\
    \ printf \"%q\" 并用管道（|）分隔符来显示“shell quoted”字符串（技术上是“words”），以便在屏幕上或本页上的输出中可见。引用规则实际上与我们在第\
    \ 2 章中介绍的相同，只是放在列表或哈希的上下文中。\n\n## BEWARE OF UNSET\n\n我们下面使用了 unset，并且有一个微妙的陷阱。如果恰好有一个与变量同名的文件，globbing\
    \ ¹ 可能会伤害你，你可能会破坏意想不到的东西。为了避免这种情况，最好引用你的变量。使用 -v 来强制 unset 将你的参数视为 shell 变量会更安全，例如\
    \ unset -v 'list'。\n\n## Lists\n\n正如我们所说，数组，也称为列表，是包含多个元素并由整数索引或引用的变量。\n\n在 bash\
    \ 中，它们从零开始，可以使用 declare -a、local -a、readonly -a 声明，或通过简单地为新变量赋值来声明，如 mylist[0]=foo\
    \ 或 mylist=()（空列表）。一旦变量被声明为列表，像 mylist+=(bar) 这样的简单赋值就相当于 push，但请注意 \\+ 和 () 两者都很关键。\n\
    \nTable 4-1. Sample bash List\n\n| Element | Value |\n|---|---|\n| mylist[0] |\
    \ foo |\n| mylist[1] | bar |\n| mylist[2] | baz |\n\n"

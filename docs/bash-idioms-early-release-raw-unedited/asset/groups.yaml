    list instead of a scalar or single value. An associative array is a type of list
    that is indexed by a string instead of an integer. So it’s a list of key-value
    pairs, that basically forms a dictionary or look-up table, where internally the
    key is hashed to form a memory location. More or less.


    The bash documentation uses the terms “array” and “associative arrays,” but depending
    on your background, “lists” and “hashes,” or possibly “dictionaries” or “dicts,”
    may be more familiar and they are certainly easier to type and say. The bash documentation
    also use “subscript” where other people might say “index.” We usually follow the
    bash docs for consistency, but for these we’re going to use the more common and
    understandable “list,” “hash,” and “subscript” terms.


    Even though lists (arrays) came first, hashes (associative arrays) are slightly
    simpler because there is never any question about supplying the index (subscript),
    because it’s required. The integer index of a list may be implied and while it’s
    not really complicated, there are operations that work for them that make no sense
    for a hash.


    As the bash reference says, *Bash provides one-dimensional indexed and associative

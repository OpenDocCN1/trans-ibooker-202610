    \ a bit odd, as there is no “then” action to be taken. The code after the `||`\
    \ is like the “else” clause:\n\n```\nif [ -z \"$DIR\" ]; then\n  :\nelse\n  cd\
    \ \"$DIR\"\nfi\n```\n\nThe \":\" is a null statement in shell - so it does nothing\
    \ in that case.\n\nIn summary: two commands separated by a `&&` are like an “if”\
    \ and its “then” clause; two commands separated by a `||` are like an “if” and\
    \ its “else” clause.\n\n### More Than One\n\nYou might want to do more than one\
    \ thing in this else clause - and therein lies a danger. It might be tempting\
    \ to write something like this:\n\n```\n# caution: not what you might think!\n\
    cd \"$DIR\" || echo \"cd to '$DIR' failed.\" ;  exit\n```\n\nThe “or” connection\
    \ tells us that if the cd fails we will execute the echo command, telling the\
    \ user that the cd failed. But here’s the catch: the exit will happen regardless.\
    \ Not what you expected, right?\n\nThink of the semicolon as equivalent to a newline\
    \ and it all becomes much clearer (and more obviously not what you wanted):\n\n\
    ```\ncd \"$DIR\" || echo \"cd to '$DIR' failed.\"\nexit\n```\n\nHow can we get\
    \ the behavior we want? We can group the echo and exit together so that they are,\
    \ taken together, the clause on the right hand side of the OR, like this:\n\n\
    ```\n# succeed with the cd or bail with a message\ncd $DIR || { echo \"cd to $DIR\
    \ failed.\" ;  exit ; }\n```\n\nThe braces are bash syntax for a compound command,\
    \ i.e., grouping statements together. You may have seen something similar using\
    \ parentheses, but using parentheses executes the statements in a sub-shell. That\
    \ would incur an overhead we don’t need, and the exit occurring from within a\
    \ sub-shell wouldn’t accomplish much either.\n\n"

  - "[PAGE 14]\n\nA similar idiom is available using the | | characters to separate\
    \ two items in a bash list. Pronounced “or”, the second part will execute only\
    \ if the first part fails. This is meant to remind you of the logic rule for “OR”,\
    \ as in: A OR B. The whole expression is true if either A is true or B is true.\
    \ Put another way, if A is true it doesn’t matter if B is true or false. For example,\
    \ consider the phrase “I own a dog OR I own a cat”. If I do, in fact, own a dog,\
    \ then this expression is true for me regardless of my cat situation.\n\nApplying\
    \ this to bash:\n\n```\n[ -z \"$DIR\" ] || cd \"$DIR\"\n```\n\nDo you think you\
    \ can explain this one? If the variable is of length zero then it is “true” so\
    \ there is no need to execute the second half; no cd command will be run. But\
    \ if the length of $DIR is non-zero, that would be “false”, so only then would\
    \ we run the cd command.\n\nYou might read the line of bash as “Either $DIR is\
    \ zero length, OR we attempt to cd into that directory”.\n\nTo write that as an\
    \ explicit “if” statement is a bit odd, as there is no “then” action to be taken.\
    \ The code after the | | is like the “else” clause:\n\n```\nif [ -z \"$DIR\" ];\
    \ then\n  :\nelse\n  cd \"$DIR\"\nfi\n```\n\nThe \":\" is a null statement in\
    \ shell - so it does nothing in that case.\n\nIn summary: two commands separated\
    \ by a && are like an “if” and its “then” clause; two commands separated by a\
    \ | | are like an “if” and its “else” clause."
  - '[PAGE 15]


    # More Than One


    You might want to do more than one thing in this else clause - and therein lies
    a danger. It might be tempting to write something like this:


    ```

    # caution: not what you might think!

    cd "$DIR" || echo "cd to ''$DIR'' failed." ;  exit

    ```


    The “or” connection tells us that if the cd fails we will execute the echo command,
    telling the user that the cd failed. But here’s the catch: the exit will happen
    regardless. Not what you expected, right?


    Think of the semicolon as equivalent to a newline and it all becomes much clearer
    (and more obviously not what you wanted):


    ```

    cd "$DIR" || echo "cd to ''$DIR'' failed."

    exit

    ```


    How can we get the behavior we want? We can group the echo and exit together so
    that they are, taken together, the clause on the right hand side of the OR, like
    this:


    ```

    # succeed with the cd or bail with a message

    cd $DIR || { echo "cd to $DIR failed." ;  exit ; }

    ```


    The braces are bash syntax for a compound command, i.e., grouping statements together.
    You may have seen something similar using parentheses, but using parentheses executes
    the statements in a sub-shell. That would incur an overhead we don’t need, and
    the exit occurring from within a sub-shell wouldn’t accomplish much either.'

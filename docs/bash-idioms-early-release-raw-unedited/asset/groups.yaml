    \n现在你已经深入了解了一个 bash 习惯用法，让我们看看其他习惯用法，并真正提升你的 bash 技能。\n\n# 第 2 章。循环用语\n\n## 早期发布读者的注意\n\
    \n使用 Early Release 电子书，你可以在这些标题的正式发布之前很久就利用这些技术——作者在写作时提供的原始未编辑内容。\n\n这将是最终书籍的第\
    \ 2 章。请注意 GitHub 仓库将在稍后激活。\n\n如果你对如何改进本书的内容和/或示例有评论，或者如果你注意到本章中缺少材料，请联系作者 bash-idioms@jpsdomain.org。\n\
    \n不仅仅是 C 风格的 `for` 循环——bash 包含其他语法和风格；有些对 Python 程序员来说更熟悉，但每种都有其用途。有一种没有明显参数的\
    \ `for` 循环，可用于脚本和函数内部。还有一种类似迭代器的 `for` 循环，具有显式值，值可以来自其他命令。\n\n## 循环构造\n\n循环构造在编程语言中很常见。自\
    \ C 语言发明以来，许多编程语言都采用了 C 风格的“for”循环。因为它将初始化代码、终止条件和迭代代码全部集中到一个地方，所以非常强大且可读。例如，在\
    \ C（或 Java，或 ...）中：\n\n```\n/* NOT bash */\nfor (i=0; i<10; i++) {\n    printf(\"\
    %d\\n\", i);\n}\n```\n\nbash 在只有少数语法差异的情况下遵循了几乎相同的方法：\n\n```\nfor ((i=0; i<10;\
    \ i++)); do\n    printf '%d\\n' \"$i\"\ndone\n```\n\n注意，尤其是双圆括号的使用。与大括号不同，bash\
    \ 使用“do”和“done”来包围循环的语句。如同 C/C+，使用“for”循环的一个惯用用法是空的“for”循环，给出有意的无限循环（你也会看到 +while\
    \ true; do）：\n\n```\nfor ((;;)); do\n    printf 'forever'\ndone\n```\n\n但这并不是\
    \ bash 中唯一的“for”循环类型。这里是 shell 脚本中的一个常见习惯用法：\n\n```\nfor value; do\n    echo \"\
    $value\"\n    # do more stuff with $value...\ndone\n```\n\n这看起来好像缺少了什么，对吧？value\
    \ 的值从哪里来？这在命令行上不会为你做任何事情，但如果你在 shell 脚本中使用这个 for 循环，那么 for 循环将遍历脚本的参数。也就是说，它将使用\
    \ $1 然后 $2，然后 $3，等等，作为 value 的值。\n\n把这个“for”循环放在名为 myloop.sh 的文件中，然后你可以像这样运行它，看到三个参数（“-c”、“17”和“core”）被打印出来：\n\
    \n```\n$ bash myloop.sh -c 17 core\n-c\n17\ncore\n$\n```\n\n这种简化的 for 循环在函数定义中也很常见：\n\
    \n```\nfunction listem {\n  for arg; do\n    echo \"arg to func: '$arg'\"\n  done\n\
    \  echo \"Inside func: \\$0 is still: '$0'\"\n}\n```\n\n在函数定义内部，参数 $1、$2 等是传递给函数而不是传递给包含\
    \ shell 脚本的参数。因此，在函数定义内部，for 循环将遍历传递给函数参数。\n\n这个极简的“for”循环遍历一个隐含的值列表——传递给脚本或函数的参数。当在脚本主体中使用时，它遍历传递给脚本的参数；当在\
    \ shell 函数内部使用时，它遍历传递给该函数参数。\n\n这绝对是 bash 习惯用法中晦涩的一种。你需要知道如何阅读它，但我们将在下面几节中讨论如何编写它。\n\
    \n我们可能想要一个同样简单的循环，但使用我们自己选择的显式值，而不是局限于参数。bash 正好有这个功能。\n\n## 显式值\n\n在 bash 中，for\
    \ 循环可以被赋予要循环的值列表，像这样：\n\n```\nfor num in 1 2 3 4 5; do\n    echo \"$num\"\ndone\n\
    ```\n\n由于 bash 处理的是字符串，我们不必只使用数字：\n\n```\nfor person in Sue Neil Pat Harry; do\n\
    \    echo $person\ndone\n```\n\n当然，值列表可以同时包含变量和字面量：\n\n```\nfor person in $ME\
    \ $3 Pat ${RA[2]} Sue; do\n    echo $person\ndone\n```\n\n## 引用\n\n你可能对所有这些命令中的引号感到好奇。你应该的，bash\
    \ 中的引用可能相当棘手。继续阅读，我们将在本章结束前介绍到。\n\nfor 循环的另一个值来源可以来自其他命令，要么是单个命令，要么是命令管道：\n\n\
    ```\nfor arg in $( some cmd or other | sort -u)\n```\n\n这种类型的例子有：\n\n```\nfor\
    \ arg in $(cat /some/file)\nfor pic in $(find . -name '*.jpg')\nfor val in $(find\
    \ . -type d | LC_ALL=C sort)\n```\n\n一个常见用法，尤其是在旧脚本中，是这样的：\n\n```\nfor i in $(seq\
    \ 1 10)\n```\n\n因为 seq 命令会生成一系列数字。这种情况可以被认为等同于：\n\n```\nfor ((i = 1; i <= 10;\
    \ i++))\n```\n\n后者的 for 更高效，也可能更易读。（注意，循环终止后，i 的值在这两种形式之间会不同（10 与 11），不过通常人们不会在循环外部使用该值。）\n\
    \n还有这种变体，但它有 bash 版本可移植性问题，因为大括号展开是在 v3.0 中引入的，而展开数值值的零填充是在 v4.0 中引入的：\n\n```\n\
    for {01..10}\n```\n\n> 前导零\n> \n> 当 {start..end..inc} 大括号展开中的前两个项之一以零开头时，它会强制每个输出值具有相同的宽度——在\
    \ bash v4.0 或更新版本中使用零在左侧填充它们。所以 {098..100} 将产生：098 099 100 而 {98..0100} 将填充到四个字符，结果为：0098\
    \ 0099 0100。\n\n这种大括号展开构造在你希望生成的数字成为更大字符串的一部分时特别有用。你只需将大括号构造作为字符串的一部分。例如，如果你想生成\
    \ 5 个像 log01.txt 到 log05.txt 这样的文件名，你可以写：\n\n```\nfor FN in log{01..5}.txt ; do\n\
    \  # do something with the filenames here\n  echo $FN\ndone\n```\n"

    +   - Distinguish between types of referents, like `$input_file` vs. `$input_dir`

    +   - Use consistent "FIXME" and "TODO" labels, with names and ticket numbers
    if appropriate


    # Functions


    +   - ALWAYS USE A HEADER

    +   - Good names are critical!

    +   - Functions must be defined before they are used

    +     - Group them at the top and use two blank lines and a function separator
    between each function.

    +     - do NOT intersperse code between functions!'
  - '[PAGE 80]


    +   - Use Camel_Case and "_" to make function names stand out from variable names.

    +   - Use `function My_Func_Name {` instead of `My_Func_Name() {` because it’s
    more clear and easier to grep -P ''^\s*function ''.

    +   - Each function should have comments defining: what it does, inputs (including
    GLOBALS), and outputs

    +   - When you have useful, standalone pieces of code, make them a function.

    +   - Use a function any time you use the same (or substantially similar) block
    of code more than once. If they are very common, like logging or emailing, consider
    creating a "library." that is, a single common file you can source as needed.

    +     - Prefix "library" functions with "_", like `_Log`, or some other prefix.

    +   - Consider using "filler" words for readability in arguments if it makes sense,
    then define them as `local junk1="$2" # unused filler`, e.g.:

    +     - `_Create_File_If_Needed "/path/to/$file" containing important value`

    +   - Do use the `local` builtin when setting variables in functions.

    +     - But be aware that it will mask a return code, so declare and assign it
    on separate lines if using command substitution, like `local my_input` and then
    `my_input="$(some-command)"`.

    +   - For any function longer than about 25 lines, close it with `} # end of function
    MyFuncName` to make it easier to track'

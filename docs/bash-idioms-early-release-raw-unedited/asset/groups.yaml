    # Lists


    As we said, arrays, also known as lists, are variables containing multiple elements
    that are indexed or referred to by an integer.


    In bash they start from zero and may be declared using declare -a, local -a, readonly
    -a or by just assigning to a new variable like mylist[0]=foo or mylist=() (empty
    list). Once a variable is declared as a list, a simple assignment like mylist+=(bar)
    is the same as a push, but note the \+ and () both of which are critical.



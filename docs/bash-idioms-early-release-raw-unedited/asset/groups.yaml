    - 考虑在主部分上方使用 2 行空白和主分隔符，尤其是在顶部有很多函数和定义时。\n\n另外，在你的库中定义一个单一的日志函数（例如 `_Log`），并使用它！否则你最终会得到各种各样的日志函数、样式和目的地。理想情况下，正如我们上面所说，将日志记录到\
    \ syslog，让操作系统担心最终目的地、日志轮转等。\n\n## Quoting\n\n引用很简单，直到它变得不简单然后你就头疼了。我们知道这是怎么回事，我们仍然有时会做试错，尤其是尝试创建作为另一用户通过\
    \ `sudo` 运行或通过 `ssh` 在另一节点上运行的一行命令时。添加一些 `echo` 行，小心。以下是与引用相关的风格指南：\n\n- 确实要在变量和字符串周围加上引号，因为它使它们更突出并澄清你的意图\n\
    \  - 除非变得太混乱\n  - 或它们需要不加引号以进行展开\n- 不要引用整数\n- 除非需要插值，否则使用单引号\n- 不要使用 `${var}`\
    \ 除非需要，它太混乱了\n  - 但有时确实需要，例如\n    `${variable}_suffix` 或\n    `${being_lower_cased,,}`\n\
    - 对命令替换加引号，例如：`var=\"$(command)\"`\n- 对任何测试语句的两侧 *始终* 加引号，例如 [[\n  \"$foo\" ==\
    \ bar ]]\n  - FIXME-TOOLS: AsciiDoc missing single quotes again!\n  - 除非你使用 ~=，在这种情况下你不能引用正则表达式！\n\
    - 考虑在 echo 语句中对变量使用单引号，例如 echo \"cd to $DIR failed.\" 因为当变量意外未定义或为空时更清晰\n  - FIXME-TOOLS:\
    \ AsciiDoc missing single quotes again!\n  - 或 echo \"cd to [$DIR] failed.\" 随你喜欢\n\
    - 优先在 printf 格式周围使用单引号（参见第 6 章）\n\n和一个 IDE。首先，这取决于团队和个人，可能并非如此，其次即使是这样，当它 *真的*\
    \ 坏掉并且你最终在 80x24 控制台上的 `vi` 中在火线调试时，你不会欣赏 200+ 列的代码。\n\n换行。\n\n在重要部分 *之前* 换行，这样当你扫描列的左侧时，续行会跳出来。我们还喜欢对换行的行使用通常缩进的一半。我们无法在此书中做一个好的（坏的？）长行示例，因为它只会在奇怪的地方断开。但我们可以提供一个简单且我们认为可读的示例：\n\
    \n```\n... Lots of code, indented a ways...\n    /long/path/to/some/interesting/command\
    \ \\\n      | grep \"$re_stuff_we_care_about \\\n      | grep -v \"$re_stuff_to_ignore\
    \ \\\n      | /path/to/email_or_log_command ...\n...more code\n```\n\n## Syntax\n\
    \n以下是与语法相关的风格指南：\n\n- 编写 bash 代码时使用 `#!/bin/bash` 或 `#!/usr/bin/env bash`，而不是\
    \ `#!/bin/sh`\n  - FIXME-TOOLS: there’s a Markdown/Asciidoctor rendering issue\
    \ with the three # ! above\n- 除非你 *真的* 确定需要 `$*`，否则使用 `$@`\n- 使用 `==` 而不是 `=`\
    \ 进行相等比较，以减少与赋值的混淆\n- 使用 `$()` 而不是反引号/反引号\n\n"

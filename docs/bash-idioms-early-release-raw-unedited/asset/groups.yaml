    +   - Don''t use a `main` function, it''s almost always just an unnecessary layer.

    +     - That said, using “main” makes sense to Python and C programmers, or if
    the code is also used as a library, and it may be required if you do a lot of
    unit testing.

    +   - Consider using 2 blank lines and a main separator above the main section,
    especially when you have a lot of functions and definitions at the top.


    # Quoting


    +   - Do put quotes around variables and strings because it makes them stand out
    a little and clarifies your intent

    +     - Unless it gets too cluttered

    +     - Or they need to be unquoted for expansion

    +   - Don''t quote integers

    +   - Use single quotes unless interpolation is required

    +   - Don''t use `${var}` unless needed, it''s too cluttered

    +     - But that IS needed sometimes, like

    +       `${variable}_suffix` or

    +       `${being_lower_cased,,}`

    +   - Do quote command substitutions, like: `var="$(command)"`'

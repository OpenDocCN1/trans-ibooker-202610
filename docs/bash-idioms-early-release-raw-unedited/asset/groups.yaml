    When looping over a sequence of integer values, the C-style for loop with double
    parentheses is probably the most readable as well as the most efficient. (If efficiency
    is a big concern be sure to use "declare -i i" early in your script to make your
    variable "i" an explicit integer, avoiding conversion to/from a string.)


    # Summary


    In this chapter we first took a quick look at the C/C++ style numerical for loop.
    Then we went farther. Bash is very string oriented and has some other styles of
    for loops worth knowing. Its minimalist loop “for variable” provides implicit
    (and arguably obscure) iteration over the arguments to a script or a function.
    An explicit list of values, string or otherwise, provided to the for loop also
    provide the perfect mechanism for iterating over all the elements of a list or
    over all keys in a hash.


    Knowing that you have all these values readily available what might you do with
    them? What goes on inside the loop, making use of these values? Decisions must
    be made about the values encountered - and decision making provides another showpiece
    for bash - its supercharged and superflexible case statement, the topic of the
    next chapter.'

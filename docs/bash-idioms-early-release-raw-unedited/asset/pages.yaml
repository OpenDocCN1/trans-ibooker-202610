    # Names


    Naming is **important**. We can’t stress that enough. The difference between `$file`
    and `$critical_process_daily_log_file` doesn’t seem like anything except some
    extra typing *now*, when all the details are in your head. But we guarantee if
    you take the extra time to really think about what you are naming and how it will
    read in the code, that will pay off soon, by reducing coding errors, and in the
    future when re-reading, debugging, and enhancing. Following are style guidelines
    related to names:


    +   - Good names are critical!

    +   - Global variables and constants are in UPPER case

    +     - Prefer not to make changes to global variables, but sometimes that’s just
    much simpler

    +     - Use `readonly` or `declare -r` for constants

    +   - Other variables are in lower case

    +   - Functions are in Mixed_Case

    +   - Use "_" in place of space or CamelCase (remember "-" is not allowed in variable
    names)'

  md: 'That’s a mouthful isn’t it? But it’s important because, as we’ll show, if you
    get it wrong you can hurt yourself. We’ve used printf "%q" with a pipe (|) delimiter
    in the example code below to show “shell quoted” strings (technically “words”)
    in a way that is visible in the output on the screen or on this page. The quoting
    rules are actually the same as we cover in Chapter 2, just in the context of a
    list or hash.


    # BEWARE OF UNSET


    We use unset below, and there’s a subtle catch. If you happen to have a file with
    the same name as a variable, globbing ¹ can hurt you and you can clobber unexpected
    things. To avoid that it’s best to quote your variable. It’s even safer to use
    -v to force unset to treat your argument as a shell variable, like unset -v ''list''.


    # Lists


    As we said, arrays, also known as lists, are variables containing multiple elements
    that are indexed or referred to by an integer.


    In bash they start from zero and may be declared using declare -a, local -a, readonly
    -a or by just assigning to a new variable like mylist[0]=foo or mylist=() (empty
    list). Once a variable is declared as a list, a simple assignment like mylist+=(bar)
    is the same as a push, but note the \+ and () both of which are critical.


    Table 4-1. Sample bash List


    | Element | Value |

    |---|---|

    | mylist[0] | foo |

    | mylist[1] | bar |

    | mylist[2] | baz |'

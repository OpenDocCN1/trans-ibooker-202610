  md: '```

    declare -i SEE

    X=9

    Y=3

    SEE=X+Y            # only this one will be arithmetic

    SAW=X+Y            # this is just a literal string

    SUM=$X$Y           # this is string concatenation

    echo "SEE = $SEE"

    echo "SAW = $SAW"

    echo "SUM = $SUM"

    ```


    What you get if you run these statements shows how bash is mostly string oriented.
    The values of SAW and SUM are formed by string operations. Only SEE is given its
    value by doing arithmetic.


    ```

    $ bash seesaw.sh

    SEE = 12

    SAW = X+Y

    SUM = 9+3

    $

    ```


    This shows that you can do arithmetic without the need for double parentheses
    - but we usually avoid this, as it requires that you declare the variable assigned
    to as an integer. If you forget the declare statement or if you assign such an
    expression to a variable not so declared, you won’t get any error message - just
    an unwanted result.'

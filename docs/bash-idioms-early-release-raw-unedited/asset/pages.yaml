- pgno: 59
  md: 'understanding. Sure, modern systems and circumstances are complex, so try hard
    not to make it any worse than it already is.


    +   - The corollary, as Brian Kernighan famously said, is that debugging is twice
    as hard as writing the code in the first place, so if your code is as clever as
    you can make it, you are—by definition—not smart enough to debug it.

    +   - Try not to re-invent the wheel. Whatever you are trying to do has probably
    been done before, and there’s likely a tool or library for it. If that tool is
    already installed, just use it. No matter how how hard you try you are never going
    to be able to match the effort and testing that went into `rsync`, so just use
    it. If you find random code on the internet…well, think about that one for a bit.

    +   - Plan ahead for special cases or overrides, since they will happen. Take
    a page out of Linux distribution packaging systems and provide an `/etc/thing/global.cfg`
    for defaults that you can blindly overwrite, then allow for overrides in `/etc/thing/config.d/`
    or similar, see *The dropin directories section in Chapter 9*.

    +   - If it’s not in revision control it doesn’t exist! (And sooner or later,
    it will be lost and then *really* won’t exist.)

    +   - Document everything. (But you don’t have to write a book about it…oh wait…)
    Write your code, your comments, and your docs for the new person who will join
    the team a year from now, when you’ve forgotten *why* you did it *that* way, so
    you can’t explain it to them. Document what *didn’t* work, and maybe why, and
    cross-reference things, especially things that you can predict can hurt you. (Yes,
    `rm -rf /$undefined_variable` turned out to be a *really bad idea!*)'

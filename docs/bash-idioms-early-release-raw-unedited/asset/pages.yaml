    \ hash!\n\nFrom the bash docs:\n\n> *If the subscript is @ or *, the word expands\
    \ to all members of the array name. These subscripts differ only when the word\
    \ appears within double quotes. If the word is double-quoted, `${name[*]}` expands\
    \ to a single word with the value of each array member separated by the first\
    \ character of the IFS variable, and `${name[@]}` expands each element of name\
    \ to a separate word.*"

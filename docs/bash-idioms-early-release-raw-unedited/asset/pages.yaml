    # Other Style Guides


    We strongly suggestion you have a style guide and use it! If you don’t like ours,
    and you don’t want to tweak it yourself, you can go steal one from someplace else.


    +   - https://google.github.io/styleguide/shellguide.html

    +     - While we have a few quibbles and disagreements with this, it’s very good
    and quite extensive. At best you can just use it, and at worst it’s a place to
    start. There is a lot to like and you could do worse (like not having anything),
    and a lot of other projects have adopted it, so…

    +     - Among other things, we don’t agree with:

    +       - The 100 line limit. We see the point, especially for an environment
    like Google’s, but we’ve got lots of scripts over that limit that are “mostly
    calling other utilities and are doing relatively little data manipulation.”

    +       - “Indent 2 spaces” is a bit shallow for us, we like 2 spaces for continued
    lines and 4 spaces otherwise. (Oops, we weren’t going to admit that, were we?)

    +       - "${var}" is too busy, we prefer "$var" when possible.

    +       - function cleanup() {? Ouch, no.'

    It’s not just C-style `for` loops—bash includes other syntax and styles; some
    are more familiar to Python programmers, but each has its place. There is a `for`
    loop with no apparent arguments, useful in both scripts and inside functions.
    There is an iterator-like `for` loop with explicit values and values that can
    come from other commands.


    # Looping constructs


    Looping constructs are common in programming languages. Since the invention of
    C language many programming languages have adopted the C-style “for” loop. It’s
    such a powerful, readable construct because it groups the initialization code,
    the termination condition and the iteration code all into one place. For example,
    in C (or Java, or ...):'
  merge: -1
  img_proc: true
- pgno: 20
  md: "```\n/* NOT bash */\nfor (i=0; i<10; i++) {\n    printf(\"%d\\n\", i);\n}\n\
    ```\n\nWith just a few minor syntax differences, bash follows much the same approach:\n\
    \n```\nfor ((i=0; i<10; i++)); do\n    printf '%d\\n' \"$i\"\ndone\n```\n\nNote,\
    \ especially, the use of double parentheses. Rather than braces, bash uses “do”\
    \ and “done” to enclose the statements of the loop. As with C/C+, an idiomatic\
    \ use of the \"for\" loop is the empty \"for\" loop, giving a deliberate infinite\
    \ loop (you’ll also see +while true; do):\n\n```\nfor ((;;)); do\n    printf 'forever'\n\
    done\n```\n\nBut that’s not the only kind of “for” loop in bash. Here’s a common\
    \ idiom in shell scripts:\n\n```\nfor value; do\n    echo \"$value\"\n    # do\
    \ more stuff with $value...\ndone\n```\n\nThis looks like something is missing,\
    \ doesn’t it? Where does value get its values? This won’t do anything for you\
    \ on the command line, but if you use this in a shell script then the for loop\
    \ will iterate over the parameters to the script. That is, it will use $1 then\
    \ $2, then $3, and so on, as the values for value.\n\nPut that “for” loop in a\
    \ file called myloop.sh then you can run it like this and see the three arguments\
    \ (“-c”, “17” and “core”) printed out:"
  merge: -1
  img_proc: true
- pgno: 21
  md: "```\n$ bash myloop.sh -c 17 core\n-c\n17\ncore\n$\n```\n\nThis abbreviated\
    \ for loop is also very often found in function definitions:\n\n```\nfunction\
    \ listem {\n  for arg; do\n    echo \"arg to func: '$arg'\"\n  done\n  echo \"\
    Inside func: \\$0 is still: '$0'\"\n}\n```\n\nInside a function definition the\
    \ parameters $1, $2, etc. are the parameters to the function and not parameters\
    \ to the enclosing shell script. Therefore, inside the function definition the\
    \ for loop will iterate over the parameters passed to the function.\n\nThis minimalist\
    \ “for” loop iterates over an implied list of values - the parameters passed either\
    \ to the script or the function. When used in the main body of a script, it iterates\
    \ over the parameters that were passed to the script; when used inside a shell\
    \ function, it iterates over the parameters that were passed to that function.\n\
    \nThis is definitely one of the obscure bash idioms. You need to know how to read\
    \ it, but we’ll circle back to debate how to write it a few sections below.\n\n\
    We might like a similarly simple loop but one with explicit values of our own\
    \ choosing not limited to the parameters. Bash has just the thing.\n\n# Explicit\
    \ Values"
  merge: -1
  img_proc: true
- pgno: 22
  md: "In bash, the for loop can be given a list of values to loop over, like this:\n\
    \n```\nfor num in 1 2 3 4 5; do\n    echo \"$num\"\ndone\n```\n\nSince bash is\
    \ dealing with strings we don’t have to use just numbers:\n\n```\nfor person in\
    \ Sue Neil Pat Harry; do\n    echo $person\ndone\n```\n\nOf course the list of\

    # Style and Readability


    With so many variations to choose from, which if statement style do you choose?
    We choose the style that best fits the calculation under consideration. When it
    is a very mathematical expression we use the double parentheses. Since the $ isn’t
    needed on variables to get their values inside double parentheses we try to omit
    them consistently. For text-heavy comparisons we use the double brackets, especially
    because that lets us use regular expressions.


    For arithmetic expressions some people may prefer the double parentheses around
    the expression, consistent with the if statements. However, for other the simple
    let builtin command reads cleanly and simply. Though bash will allow arithem etic
    operations without brackets or let, provided the variables are declared as integer-only,
    we avoid that style. It is too easy to mix and match variables, some of which
    may not have been declared as integers. Confusion ensues. Putting the expression
    in double parentheses (or using let) guarantees that it will remain an arithem
    etic evaluation.


    # Summary


    As a rule, in bash, double parens indicate arithmetic is going on. The dollar
    sign indicates that you want the value of the expression returned, otherwise you
    just get a success/fail result status. But operator-rich bash makes it possible
    to do similar things using either'

  md: '# INTEGER ONLY


    The bash shell uses only integer arithmetic. It’s main purpose is for counting
    things: iterations, numbers of files, sizes in bytes. What if you want or need
    a floating point calculation? After all, the sleep command now allows a fractional
    value: `sleep 0.25` will sleep for a quarter of a second. What if you want to
    sleep multiples of a quarter of a second? You’d like to write: `sleep $(( 6 *
    0.25 ))` but that won’t work.


    The easiest solution is to do the calculation using another program like `bc`
    or `awk`. For example, here’s a script called `fp` that you could put in your
    `~/bin` directory or somewhere else on your `PATH` (and give it execute permissions):


    ```

    # /bin/bash -

    # fp - provide floating point, via awk

    # usage:  fp "expression"


    awk "BEGIN { print $* }"

    ```


    With that in place you could then write: `sleep $(fp "6 * 0.25")` to get the desired
    floating point calculation. It may not be bash doing the calculation, but it is
    bash helping you get the calculation done.


    # Compound Commands


    You are probably very familiar with seeing a single command on a line by itself
    in a script. You may also be familiar with using a single command in an `if` statement’s
    condition to see if the command succeeded and taking action depending on the result.
    If you’ve read Chapter 1, you’ve seen the “no-if” `if` statement idiom, too. Now
    let’s'

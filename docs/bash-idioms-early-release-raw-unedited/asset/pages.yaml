- pgno: 11
  md: '# Chapter 1. A Big “If” Idiom


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 1st chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the authors at bash-idioms@jpsdomain.org.


    To get you started in your understanding bash idioms we’ll look at a bash construct
    that allows you to do what you might normally do with an if/then/else construct
    but with sparser syntax. The idiomatic expression we’ll show you in this chapter
    has some real advantages - mostly terseness - and some pitfalls to avoid. But
    if you don’t know bash idioms you might not recognize or realize what is going
    on.


    Take a look at this piece of code:


    ```

    [ -n "$DIR" ] && cd "$DIR"

    ```


    Do you think that looks like an “if” statement? If you’re conversant in bash you’ll
    recognize that it is functionally the same thing; you’ll understand it as an “if”
    statement even though the “if” keyword doesn’t appear in the code.


    What’s going on?'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# The Big “if”


    Let’s now look at a similar but simpler example:


    ```

    cd tmp && rm scratchfile

    ```


    This too, is, in effect, an if statement. If the cd command succeeds then (and
    only then) execute the rm command. The “idiom” here is the use of the double ampersand
    "&&" (typically read as “and”) to separate the two commands.


    Logic or philosophy classes teach the rule: the expression “A AND B” is true if
    and only if both A and B are each true. Therefore if A is false, there is no need
    to even consider the value of B. For example, consider “I own a dog AND I own
    a cat”. If I do not own a dog then this compound expression is false for me, regardless
    of my cat situation.


    Let’s apply this to bash. Remember that the basic function of bash is to execute
    programs. The first part of this statement has the cd command execute. Similar
    to the logic of the AND, if this first command fails, bash will not bother to
    execute the second part, the rm command.


    The use of the && is meant to remind you of the AND behavior. bash isn’t actually
    performing an “AND” operation on these two results. (If this were C/C++ that would
    be a different story, though the conditional execution is the same.) However,
    this bash idiom does provide the conditional execution of the second command -
    it isn’t run if the first command fails.


    Let’s go back and look at the original example we gave, namely this expression:


    ```

    [ -n "$DIR" ] && cd "$DIR"

    ```'
  merge: -1
  img_proc: true
- pgno: 13
  md: "Do you think you “get it” now? The first expression tests to see if the length\
    \ of the value of the variable called DIR is non-zero. If it has a value, that\
    \ is, if its length is non-zero - and only if it’s non-zero - the cd command will\
    \ attempt to change into a directory named by the value of DIR.\n\nWe could have\
    \ written this as an explicit IF statement:\n\n```\nif [ -n \"$DIR\" ]; then\n\
    \  cd \"$DIR\"\nfi\n```\n\nTo someone less familiar with bash, this latter format\
    \ is certainly more readable and easily understood. But there isn’t much going\
    \ on inside the “then” clause, just the cd command, so it seems a bit “bulky”\
    \ in its syntax. You’ll have to decide which to use based on who your likely readers\
    \ will be and how likely other commands would be added inside the “then” clause.\
    \ We’ll offer more opinions on this topic below.\n\n# BASH HELP\n\nThe Bash help\
    \ command is great for any builtin command, but help test provides especially\
    \ helpful clues about the test commands line -n. You might think to check man\
    \ bash but if you do you’ll get a very long and somewhat cryptic “all about bash”\
    \ page. Don’t get us wrong, there is great information in man bash, but help <thing>\
    \ is probably what you really want. If you are not sure if the command in question\
    \ is a bash builtin, just try it, or use type -a to find out.\n\nAdmittedly, knowing\
    \ that help test will tell you what -n means is tricky, but then, you were smart\
    \ enough to buy this book, so now you know. Here is another subtle little tidbit,\
    \ go try it: help [. You’re welcome.\n\n# Or ELSE..."
  merge: -1
  img_proc: true
- pgno: 14
  md: "A similar idiom is available using the | | characters to separate two items\
    \ in a bash list. Pronounced “or”, the second part will execute only if the first\
    \ part fails. This is meant to remind you of the logic rule for “OR”, as in: A\
    \ OR B. The whole expression is true if either A is true or B is true. Put another\
    \ way, if A is true it doesn’t matter if B is true or false. For example, consider\
    \ the phrase “I own a dog OR I own a cat”. If I do, in fact, own a dog, then this\
    \ expression is true for me regardless of my cat situation.\n\nApplying this to\
    \ bash:\n\n```\n[ -z \"$DIR\" ] || cd \"$DIR\"\n```\n\nDo you think you can explain\
    \ this one? If the variable is of length zero then it is “true” so there is no\
    \ need to execute the second half; no cd command will be run. But if the length\
    \ of $DIR is non-zero, that would be “false”, so only then would we run the cd\
    \ command.\n\nYou might read the line of bash as “Either $DIR is zero length,\
    \ OR we attempt to cd into that directory”.\n\nTo write that as an explicit “if”\
    \ statement is a bit odd, as there is no “then” action to be taken. The code after\
    \ the | | is like the “else” clause:\n\n```\nif [ -z \"$DIR\" ]; then\n  :\nelse\n\
    \  cd \"$DIR\"\nfi\n```\n\nThe \":\" is a null statement in shell - so it does\
    \ nothing in that case.\n\nIn summary: two commands separated by a && are like\
    \ an “if” and its “then” clause; two commands separated by a | | are like an “if”\
    \ and its “else” clause."
  merge: -1
  img_proc: true
- pgno: 15
  md: '# More Than One


    You might want to do more than one thing in this else clause - and therein lies
    a danger. It might be tempting to write something like this:


    ```

    # caution: not what you might think!

    cd "$DIR" || echo "cd to ''$DIR'' failed." ;  exit

    ```


    The “or” connection tells us that if the cd fails we will execute the echo command,
    telling the user that the cd failed. But here’s the catch: the exit will happen
    regardless. Not what you expected, right?


    Think of the semicolon as equivalent to a newline and it all becomes much clearer
    (and more obviously not what you wanted):


    ```

    cd "$DIR" || echo "cd to ''$DIR'' failed."

    exit

    ```


    How can we get the behavior we want? We can group the echo and exit together so
    that they are, taken together, the clause on the right hand side of the OR, like
    this:


    ```

    # succeed with the cd or bail with a message

    cd $DIR || { echo "cd to $DIR failed." ;  exit ; }

    ```


    The braces are bash syntax for a compound command, i.e., grouping statements together.
    You may have seen something similar using parentheses, but using parentheses executes
    the statements in a sub-shell. That would incur an overhead we don’t need, and
    the exit occurring from within a sub-shell wouldn’t accomplish much either.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# CLOSING COMPOUND COMMANDS


    A quirk of bash requires a specific syntax for how you close the compound command.
    It must end with either a semicolon or a newline before the closing brace. If
    you use a semicolon, there needs to be whitespace before the brace so that the
    brace can be recognized as a reserved word (otherwise it gets confused with the
    closing brace of shell variable syntax, as in ${VAR} for example). That is why
    our example, above, ends with what looks to be an extraneous semicolon: { echo
    "..." ; exit ; }. Using a newline, that final semicolon isn’t needed:


    ```

    # succeed with the cd or bail with a message

    cd $DIR || { echo "cd to $DIR failed." ; exit

    }

    ```


    but that might not read as cleanly. At the left edge it seems oddly placed; indented
    with whitespace it groups more logically, but seems bare.


    We recommend you stick with the extra semicolon, and don’t forget the space between
    it and the closing brace.


    # More Than One Again


    What if you need more complex logic? What about multiple AND and OR constructs?
    How are they handled? What do you think the following line of code will do?


    ```

    [ -n "$DIR" ] && [ -d "$DIR" ] && cd "$DIR" || exit 2

    ```


    That does what you might think—but maybe not for the reason you think. You might,
    from this example, be tempted to think that && is higher precedence than the ||
    operator, but it’s not. They’re just grouping from left to right. The syntax for
    bash says that the && and || operators are of equal precedence and are left associative.
    Need convincing?'
  merge: -1
  img_proc: true
- pgno: 17
  md: '```

    $ echo 1 && echo 2 || echo 3

    1

    2

    $

    ```


    but also:


    ```

    $ echo 1 || echo 2 && echo 3

    1

    3

    $

    ```


    Notice that it always evaluates the left-most operator regardless of whether its
    AND or OR; it’s not operator precedence but simple left associativity that determines
    the order of evaluation.


    # Style and Readability: When To Use Which Form of If


    By using && and || operators you can write if/then/else logic without the use
    of those familiar keywords. But bash does have if, then, and else as keywords.
    So when do you use them and when do you use the shorthand? The answer comes down
    to readability.


    For complex logic, it makes the most sense to use the familiar keywords. But for
    simple test and check situations with simple, single actions, the shorthand using
    the && and || operators can be very convenient and will not distract from the
    main flow of logic.


    # Summary


    In this chapter we took a look at a particular bash idiom - the “no-if” if statement.
    It doesn’t look like a traditional if/then/else but it can behave exactly like
    one. Unless this is something you recognize, some scripts that you read might
    remain obscure. It makes it worth using, too, as a way to check that any necessary
    preconditions are in'
  merge: -1
  img_proc: true

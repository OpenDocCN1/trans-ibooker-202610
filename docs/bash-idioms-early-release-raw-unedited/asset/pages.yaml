    In theory it should not be necessary to explain *what* something does if you write
    clear code. But sometimes bash itself is just convoluted or obscure, e.g., variable
    substitution like:


    ```

    PROGRAM=${0##*/}   # Basename in bash, see "Prefix Removal" in Chapter 4

    ```


    Separators are often useful for delimited logical blocks of code. But don’t add
    a closing separator at the bottom to “box” it out, that just adds clutter and
    reduces your on-screen lines-of-code by 1.


    Whatever you do, do *not* build boxes with characters on the right-hand-side!
    It’s totally unnecessary and you’ll waste a lot of time getting it to “look right”
    up front. What’s worse is that it’s a strong disincentive to fixing or updating
    comments later, because then you have to go fix the box again.


    Don’t do this:


    ```

    ################################################################################################

    ######

    # Please don''t build boxes like this!

    #

    #

    #

    # They make it VERY painful to edit the comments later,

    because #

    # now you have to worry about the closing character on the

    #

    # right-hand-side.  This example isn''t too bad, but it gets

    #

    # out of hand quickly.

    #

    ################################################################################################

    ######

    ```'

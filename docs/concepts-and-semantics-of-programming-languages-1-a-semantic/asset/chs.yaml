  \n[[c3]]_Env = [[c5]]_Env ∘ [[c4]]_Env\n[[c3]]_Env : Mem ↦ [[c5]]_Env(Mem[ry :=\
  \ Mem(ry) × Mem(rx)])\n           = Mem[ry := Mem(ry) × Mem(rx)][rx := Mem(rx) -\
  \ 1]\n\n[[c2]]_Env = lfp(F) where F : f ↦ cond([[e]]_Env, f ∘ [[c3]]_Env, id)\n\
  F(f) : Mem ↦ {\n    f([[c3]]_Env(Mem)) if Mem(r_x) ≠ 1\n    Mem              if\
  \ Mem(r_x) = 1\n}\n```\n\n函数 [[c3]]_Env 描述了执行循环体后获得的状态。当循环体执行两次时，函数 [[c3]]²_Env\

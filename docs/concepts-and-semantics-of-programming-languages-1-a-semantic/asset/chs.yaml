  text{Env}(y)) = n\\)。有两种可能的情况：\n\n- 1) 如果 \\(m = n\\)，则我们得到 \\(P_{\\text{Env}}(\\\
  text{Mem})\\)，因为我们可以构造以下树：\n\n```\n(C_7) [[e]]_Env^Mem = (false, Mem)\n      <Mem,\

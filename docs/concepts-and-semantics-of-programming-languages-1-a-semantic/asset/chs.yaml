  )。\n\n#### 4.5.4. 大步与小步\n\n大步和小步运行语义提供了描述 \\(\\text{Lang}_3\\) 中程序执行的两种方式。这些描述基于不同的形式主义，但从语义角度来看是等价的。正如我们从示例\

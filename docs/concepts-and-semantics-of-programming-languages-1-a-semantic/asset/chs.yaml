  \ 进行归纳定义。因此，该语言中的表达式可以是：\n\n- 1) 表示 K 中某个值的常量，该值可以是相对整数、*真* 或 *假*；\n- 2) 标识符，这里称为变量，以保持与表达式通常术语的一致性；\n\
  - 3) 对一个表达式应用一元算子；\n- 4) 对两个表达式应用二元算子，使用中缀表示法；\n- 5) 条件表达式；\n- 6) 表达式 let x = e1\
  \ in e2，它声明变量 x（称为表达式 e2 中的局部变量），并由表达式 e1 对其进行定义（换句话说，e1 的值在表达式 e2 中被命名为 x）；\n-\
  \ 7) 变量 x 的函数，其主体是表达式 e，通过在 e 中对 x 进行抽象获得。变量 x 通常称为函数的参数（或形式参数）；\n- 8) 递归函数，由标识符\
  \ f 指定，其参数是 x，主体是表达式 e，该表达式可能包含对 f 的递归调用；\n- 9) 对表达式 e1 与表达式 e2 进行应用（表达式 e2 称为 e1\
  \ 的参数或实际参数）。\n\n| e ::= v | 常量 (v in K) | (1) |\n| --- | --- | --- |\n| | x | 变量\
  \ (x in X) | (2) |\n| | op e1 | 原始一元算子的应用 (op in {not}) | (3) |\n| | e1 op e2 |\
  \ 原始二元算子的应用 (op in {+, -, *, /, and, or, =, <=}) | (4) |\n| | if e1 then e2 else\
  \ e3 | 条件表达式 | (5) |\n| | let x = e1 in e2 | 局部绑定 (x in X) | (6) |\n| | fun x ->\
  \ e | 函数定义 (x in X) | (7) |\n| | rec f x = e | 递归函数定义 (x, f in X) | (8) |\n| | (e1\
  \ e2) | 函数应用 | (9) |\n\n表 3.1. 表达式语言 Exp2 的语法\n\n#### 3.1.2. 抽象语法树\n\n该语言中的每个表达式都可以用一棵树表示，即抽象语法树（AST），其中每个节点都标记了所应用构造规则的标签。例如，表达式：\n\
  \n```\nfun x1 -> x1 + x2\n```\n\n是通过对表达式 x1 + x2 中的 x1 进行抽象得到的，该表达式以此方式构造的函数作为主体。同样，表达式\
  \ efact：\n\n```\nrec fact n = if n <= 1 then 1 else (fact (n - 1)) * n\n```\n\n\
  通过对函数主体中的 n 进行抽象，递归定义了计算 n! 的函数。\n\n其 AST 为：\n\n![](img/c9a176746efdbd36ba74d71dfdc86e86_52_0.png)\n\
  \n程序中引入的所有算子（用 Python 和 OCaml 编写）的名称都以 2 结尾，以引用 Exp2 这个名称。常量集合 K 包含相对整数和布尔值，可以表示如下：\n\
  \n```python\nclass CInt2:\n    def __init__(self,cst_int):\n        self.cst_int\
  \ = cst_int\n\nclass CBool2:\n    def __init__(self,cst_bool):\n        self.cst_bool\
  \ = cst_bool\n```\n```ocaml\ntype const2 = CInt2 of int | CBool2 of bool\n```\n\n\
  让我们定义 Exp2 表达式中使用的算子：\n\n```python\nclass Not2:\n    pass\nclass Plus2:\n    pass\n\
  class Minus2:\n    pass\nclass Mult2:\n    pass\nclass Div2:\n    pass\nclass And2:\n\
  \    pass\nclass Or2:\n    pass\nclass Eq2:\n    pass\nclass Leq2:\n    pass\n```\n\
  ```ocaml\ntype unary_op2 = Not2\ntype bin_op2 = Plus2 | Minus2 | Mult2 | Div2 |\
  \ And2 | Or2 | Eq2 | Leq2\n```\n\n```python\nclass B_Op2:\n    def __init__(self,op,exp1,exp2):\n\
  \        self.op = op\n        self.exp1 = exp1\n        self.exp2 = exp2\n\nclass\
  \ If2:\n    def __init__(self,exp1,exp2,exp3):\n        self.exp1 = exp1\n     \
  \   self.exp2 = exp2\n        self.exp3 = exp3\n\nclass Rec2:\n    def __init__(self,nom,param,corps):\n\
  \        self.nom = nom\n        self.param = param\n        self.corps = corps\n\
  \nclass App2:\n    def __init__(self,exp1,exp2):\n        self.exp1 = exp1\n   \
  \     self.exp2 = exp2\n```\n\n```ocaml\ntype 'a exp2 =\n  | Cste2 of const2   \
  \             | Var2 of 'a\n  | U_Op2 of unary_op2 * 'a exp2   | B_Op2 of bin_op2\
  \ * 'a exp2 * 'a exp2\n  | If2 of 'a exp2 * 'a exp2 * 'a exp2 | Letin2 of 'a * 'a\
  \ exp2 * 'a exp2\n  | Fun2 of 'a * 'a exp2           | Rec2 of 'a * 'a * 'a exp2\n\
  \  | App2 of 'a exp2 * 'a exp2\n```\n\n例如，表达式 fun \\(x_1 \\mapsto x_1 + x_2\\)、let\
  \ \\(x_1 = x_1 + x_2\\) in \\(x_1 + x_3\\) 以及在 [3.2] 中定义的表达式 \\(e_{fact}\\) 可以写成：\n\
  \n```\nex_exp1 = Fun2(\"x1\",B_Op2(Plus2(),Var2(\"x1\"),Var2(\"x2\")))\nex_exp2\
  \ = Letin2(\"x1\",B_Op2(Plus2()),Var2(\"x1\"),Var2(\"x2\")),\n        B_Op2(Plus2(),Var2(\"\
  x1\"),Var2(\"x3\")))\n\na_fact = \\\n    Rec2(\"fact\",\"n\",\n        If2(B_Op2(Leq2()),Var2(\"\
  n\"),Cste2(CInt2(1))),\n            Cste2(CInt2(1)),\n            B_Op2(Mult2(),App2(Var2(\"\
  fact\"),\n                                B_Op2(Minus2(),Var2(\"n\"),Cste2(CInt2(1)))),\n\
  \                        Var2(\"n\"))))\n```\n\n```\nlet ex_exp1 = Fun2 (\"x1\"\
  , B_Op2 (Plus2, Var2 \"x1\", Var2 \"x2\"))\nval ex_exp1 : string exp2\nlet ex_exp2\
  \ =\n    Letin2 (\"x1\", B_Op2 (Plus2, Var2 \"x1\", Var2 \"x2\"),\n            B_Op2\
  \ (Plus2, Var2 \"x1\", Var2 \"x3\"))\nval ex_exp2 : string exp2\nlet ex_fact =\n\
  \    (\"fact\", \"n\",\n    If2 (B_Op2 (Leq2, Var2 \"n\", Cste2 (CInt2 1)),\n  \
  \      Cste2 (CInt2 1),\n        B_Op2 (Mult2,\n            App2 (Var2 \"fact\"\
  , B_Op2 (Minus2, Var2 \"n\", Cste2 (CInt2 1))),\n            Var2 \"n\"))))\nval\
  \ a_fact : string exp2\n```\n\n\n\n\n\n#### 3.1.3. 通过归纳对表达式进行推理\n\n集合 Exp₂ 以归纳方式定义：每个表达式\
  \ \\(e \\in \\text{Exp}_2\\) 都是通过有限次应用 Exp₂ 的构造规则获得的。这意味着，可以通过应用 Box 3.1 中所示的结构归纳方案，对\
  \ Exp₂ 的元素证明属性 P：我们只需针对每个构造项证明属性 P，并假设 P 对该构造项的每个组件都成立。这种归纳推理在本书余下部分中将多次使用。\n\n\
  ```\nif ∀v ∈ K P(v)\nand ∀x ∈ X P(x)\nand ∀e₁ ∈ Exp₂ P(e₁) ⇒ P(op e₁)\nand ∀e₁,\
  \ e₂ ∈ Exp₂ (P(e₁) and P(e₂)) ⇒ P(e₁ op e₂)\nand ∀e₁, e₂, e₃ ∈ Exp₂ (P(e₁) and P(e₂)\
  \ and P(e₃)) ⇒ P(if e₁ then e₂ else e₃)\nand ∀x ∈ X ∀e₁, e₂ ∈ Exp₂ (P(e₁) and P(e₂))\
  \ ⇒ P(let x = e₁ in e₂)\nand ∀x ∈ X ∀e ∈ Exp₂ P(e) ⇒ P(fun x ↦ e)\nand ∀x, f ∈ X\
  \ ∀e ∈ Exp₂ P(e) ⇒ P(rec f x = e)\nand ∀e₁, e₂ ∈ Exp₂ (P(e₁) and P(e₂)) ⇒ P((e₁\
  \ e₂))\nthen ∀e ∈ Exp₂ P(e)\n```\n\n### Box 3.1. 针对 e ∈ Exp₂ 的结构归纳方案\n\n#### 3.1.4.\
  \ 变量声明、绑定变量和自由变量\n\n同一个标识符可以在同一个表达式中使用多次，每次使用都称为标识符的一次出现。同一个标识符的不同出现并不都起相同的作用。在构造项\
  \ (6) let x = e₁ in e₂ 中，标识符 x 被声明，并在环境中绑定到 e₁ 的值，该值将用于求值 e₂。构造项 (7) 在表达式 e 中抽象了变量\
  \ x。该参数 x 在表达式 fun x ↦ e 中被认为是绑定（或抽象）的。它可以重命名而不修改函数的定义；因此，它有时被称为哑变量。例如，在 fun x ↦\
  \ x + y 中将 x 替换为 z 得到 fun z ↦ z + y，两者是等价的。显然，我们不能将 x 替换为 y，因为 y 已经出现在函数体 x + y\
  \ 中。在构造项 (8) 中，标识符 f 被声明，变量 x 在表达式 e 中被绑定。例如，表达式是：\n\n```\nlet x₁ = 25 in let f\
  \ = fun x₂ ↦ x₃ + 3 in (f 7) + x₄ [3.3]\n```\n\n包含四个 $x$ 的出现，索引从 1 到 4。出现 2 在 $f$\
  \ 的函数体中抽象了出现 3。这些哑变量 $x$ 的出现可以重命名。出现 1 声明了标识符 $x$，用于为出现 4 赋值。\n\n当表达式中变量的出现既未被声明也未被绑定时，可以说该出现在该表达式中是\
  \ *自由* 的。对于 $e \\in \\mathbf{Exp}_2$，变量集合 $\\mathcal{F}(e)$（即在 $e$ 中至少有一次自由出现的变量）以归纳方式定义为：\n\
  \n```\n\\mathcal{F} : \\mathbf{Exp}_2 \\to \\wp(\\mathbf{X})\n\\mathcal{F}(v) =\
  \ \\emptyset \\quad (v \\in \\mathbf{K})\n\\mathcal{F}(x) = \\{x\\} \\quad (x \\\
  in \\mathbf{X})\n\\mathcal{F}(\\mathbf{op} \\ e_1) = \\mathcal{F}(e_1)\n\\mathcal{F}(e_1\
  \ \\mathbf{op} \\ e_2) = \\mathcal{F}(e_1) \\cup \\mathcal{F}(e_2)\n\\mathcal{F}(\\\
  mathbf{if} \\ e_1 \\ \\mathbf{then} \\ e_2 \\ \\mathbf{else} \\ e_3) = \\mathcal{F}(e_1)\
  \ \\cup \\mathcal{F}(e_2) \\cup \\mathcal{F}(e_3)\n\\mathcal{F}(\\mathbf{let} \\\
  \ x = e_1 \\ \\mathbf{in} \\ e_2) = \\mathcal{F}(e_1) \\cup (\\mathcal{F}(e_2) \\\
  setminus \\{x\\})\n\\mathcal{F}(\\mathbf{fun} \\ x \\mapsto e) = \\mathcal{F}(e)\
  \ \\setminus \\{x\\}\n\\mathcal{F}(\\mathbf{rec} \\ f \\ x = e) = \\mathcal{F}(e)\
  \ \\setminus \\{x, f\\}\n\\mathcal{F}((e_1 e_2)) = \\mathcal{F}(e_1) \\cup \\mathcal{F}(e_2)\n\
  ```\n\n不包含自由变量的表达式称为 *闭合*。对于函数 $\\mathbf{fun}\\ x \\mapsto e$，如果它是常量函数（$\\mathcal{F}(e)\
  \ = \\emptyset$ 且 $x$ 不出现在 $e$ 中）或者 $\\mathcal{F}(e) = \\{x\\}$（即函数体 $e$ 除了 $x$\
  \ 外没有自由变量），则称其为闭合。例如，函数 $\\mathbf{fun}\\ x \\mapsto x + 1$ 是闭合的。$\\mathbf{fun}\\\
  \ x_1 \\mapsto \\mathbf{fun}\\ x_2 \\mapsto x_1 + x_2$ 也是闭合的，但 $\\mathbf{fun}\\\
  \ x_2 \\mapsto x_1 + x_2$ 不是，因为在此例中 $x_1$ 是自由变量：在切换到子表达式时，这一概念并不稳定（表达式是闭合的并不必然意味着其子表达式也是闭合的）。\n\
  \n示例 3.1. 对于在 [3.2] 中定义的表达式 $e_{fact}$ 和在 [3.3] 中定义的表达式 $e_{25}$，有 $\\mathcal{F}(e_{fact})\
  \ = \\mathcal{F}(e_{25}) = \\emptyset$。在表达式 $e_{25}$ 中，$x$ 的出现 3 在子表达式 $x + 3$ 中是自由的，但在表达式\
  \ $\\mathbf{fun}\\ x \\mapsto x + 3$ 中变为绑定。以下两个示例不是闭合表达式：\n\n```\n\\mathcal{F}(\\\
  mathbf{fun}\\ x_1 \\mapsto x_1 + x_2) = \\{x_2\\}\n\\mathcal{F}(\\mathbf{let}\\\
  \ x_1 = x_1 + x_2\\ \\mathbf{in}\\ x_1 + x_3) = \\{x_1, x_2, x_3\\}\n```\n\n直观地说，求值一个表达式需要知道其变量的值。表达式中自由变量的值在求值环境中查找。例如，要对表达式\
  \ $x + 1$ 求值，需要知道 $x$ 的值。相比之下，表达式 $\\mathbf{let}\\ x = 3\\ \\mathbf{in}\\ 2 * x$\
  \ 是闭合的，可以在不涉及其所含（绑定）变量“外部”信息的情况下求值。\n\n**Exp₂** 中表达式的自由变量集合可以递归定义如下：\n\n```python\n\
  def free_var2(e):\n    if isinstance(e,Cste2): return emptyset\n    if isinstance(e,Var2):\
  \ return [e.symb]\n    if isinstance(e,U_Op2): return free_var2(e.exp1)\n    if\
  \ isinstance(e,B_Op2): return union(free_var2(e.exp1),free_var2(e.exp2))\n    if\
  \ isinstance(e,IF2):\n        return union(union(free_var2(e.exp1),free_var2(e.exp2)),\n\
  \                     free_var2(e.exp3))\n    if isinstance(e,Letin2):\n       \
  \ return union(free_var2(e.exp1),\n                     diff_set(free_var2(e.exp2),[e.symb]))\n\
  \    if isinstance(e,Fun2): return diff_set(free_var2(e.corps),[e.param])\n    if\
  \ isinstance(e,Rec2): return diff_set(free_var2(e.corps),[e.param,e.nom])\n    if\
  \ isinstance(e,App2): return union(free_var2(e.exp1),free_var2(e.exp2))\n    raise\
  \ ValueError\n```\n\n```ocaml\nlet rec free_var2 e = match e with\n  | Cste2 ->\
  \ emptyset\n  | Var2 x -> [x]\n  | U_Op2 (op, e1) -> free_var2 e1\n  | B_Op2 (op,\
  \ e1, e2) -> union (free_var2 e1) (free_var2 e2)\n  | IF2 (e1, e2, e3) ->\n    \
  \  union (union (free_var2 e1) (free_var2 e2)) (free_var2 e3)\n  | Letin2 (x, e1,\
  \ e2) -> union (free_var2 e1) (diff_set (free_var2 e2) [x])\n  | Fun2 (x, e1) ->\
  \ diff_set (free_var2 e1) [x]\n  | Rec2 (f, x, e1) -> diff_set (free_var2 e1) [x;\
  \ f]\n  | App2 (e1, e2) -> union (free_var2 e1) (free_var2 e2)\nval free_var2 :\
  \ 'a exp2 -> 'a list\n```\n\n考虑示例 3.1 中的表达式，得到：\n\n```python\n>>> free_var2(ex_exp1)\n\
  ['x2']\n>>> free_var2(ex_exp2)\n['x2', 'x1', 'x3']\n>>> free_var2(a_fact)\n[]\n\
  ```\n\n```ocaml\n# free_var2_ex_exp1 ;;\n- : string list = [\"x2\"]\n# free_var2\
  \ ex_exp2 ;;\n- : string list = [\"x1\"; \"x2\"; \"x3\"]\n# free_var2 a_fact ;;\n\
  - : string list = []\n```\n\n### 3.2. 执行语义：求值函数\n\n编程语言的执行语义（或 *动态语义*）描述了该语言中所有语法正确程序的执行。在本节中，我们研究“纯”函数式语言\
  \ **Exp$_2$**。由于该语言不提供对内存的操作，只需要求值环境的概念。请注意，与内存（内容可修改）不同，执行环境（也称为求值环境）只能通过将标识符绑定到新值来扩展；该标识符的任何现有绑定都会被新绑定简单地遮蔽。\n\
  \n**Exp$_2$** 中的程序是一个表达式。其执行包括对表达式求值，即计算其值。为此，我们首先定义一个求值函数，如第 2 章所示：\n\n```\n$[[\
  \ \\_ ]]_{\\_} : \\mathbf{E} \\times \\mathbf{Exp}_2 \\rightarrow \\mathbb{V}$\n\
  ```\n\n值 $[[e]]_{Env}$ 是表达式 $e$ 在环境 $Env$ 中求值的结果。在这里，环境 $Env \\in \\mathbf{E}$ 是绑定\
  \ $(x, v) \\in \\mathbf{X} \\times \\mathbf{V}$ 的列表。集合 $\\mathbf{V}$（在第 3.2.2 节中定义）是与变量关联的值的集合，而\
  \ $\\mathbb{V}$ 是 $\\mathbf{V}$ 与一组用于指示求值失败的特殊值的并集。\n\n#### 3.2.1. 求值错误\n\n我们选择区分在对表达式\
  \ $e \\in \\mathbf{Exp}_2$ 求值期间产生的三种不同类型的错误。\n\n- 1) 表达式 $e$ 中自由变量出现的值必须在当前执行环境中找到。如果该变量不属于环境的域，则对\
  \ $e$ 的求值返回一个标记为 Err$_U$ 的错误（U 表示未绑定）。\n\n- 2) 算术错误，例如溢出或数学上未定义的值，标记为 Err$_E$（E\
  \ 表示异常，即处理器用于指示“异常”情况的机制，这种情况使得无法继续正常执行）。出于我们的目的，我们将考虑限制在除以零的情况。\n\n- 3) **Exp$_2$**\
  \ 中的表达式表示整数、布尔值或函数。因此，可能尝试将布尔值与整数相加（3 + true），或者将整数应用于表达式（8(x + 1)）。此类表达式在语法上是正确的，但不能表示\
  \ V 中的值。在我们的模型中，对此类表达式的求值会导致一种称为类型错误 Err$_T$ 的错误。类型错误在执行前的检测将在第 5 章中介绍。请注意，某些语言为我们认为在\
  \ **Exp$_2$** 中无效的表达式赋予语义。例如，在 Python（v3.6）中，表达式 3 + True 返回值 4。\n\n\n\n\n\n此处考虑的错误集合为\
  \ IE = {ErrU, ErrE, ErrT}。这一选择有些任意：既可以只使用一种错误，也可以，反之，对不同的错误原因做出更精细的区分。这可以通过修改错误处理规则来完成。\n\
  \n在 Exp2 中，某些表达式 e 的求值可能不会终止，在这种情况下，值 [[e]]Env 未定义：不会返回任何值——甚至错误值也不会返回。求值函数 [[_]]_\
  \ 因此是一个偏函数。非终止的正式处理超出了本书的范围。\n\n#### 3.2.2. 值\n\n集合 V 包含整数、布尔值以及称为闭包的函数值，将在 3.2.4\
  \ 节中介绍。对于非递归函数 (fun x -> e)，闭包是一个三元组 (x, e, Env)，由函数参数名 (x)、函数体 (e) 以及求值函数定义的环境\
  \ (Env) 组成。对于递归函数 (rec f x = e)，闭包是一个四元组 <f, x, e, Env>，由函数名 (f)、函数参数名 (x)、函数体 (e)\
  \ 以及求值函数定义的环境 (Env) 组成。因此，闭包集合 IF 定义为：\n\nIF = (X x Exp2 x E) U (X x X x Exp2 x\
  \ E)\n\n绑定到环境中标识符的每个值都是集合 V = Z U IB U IF 中的一个元素。集合 V = V U IE 包含表达式求值的所有可能结果。\n\
  \n集合 IE、V 和 V 可定义如下：\n\n```python\nclass E_Typ2:\n    pass\nclass E_Exec2:\n   \
  \ pass\nclass E_Undef2:\n    pass\nclass VInt2:\n    def __init__(self,val_int):\n\
  \        self.val_int = val_int\nclass VBool2:\n    def __init__(self,val_bool):\n\
  \        self.val_bool = val_bool\nclass Clos2:\n    def __init__(self,param,corps,envdef):\n\
  \        self.param = param\n        self.corps = corps\n        self.envdef = envdef\n\
  class ClosRec2:\n    def __init__(self,nomf,param,corps,envdef):\n        self.nomf\
  \ = nomf\n        self.param = param\n        self.corps = corps\n        self.envdef\
  \ = envdef\nclass Val2:\n    def __init__(self,val):\n        self.val = val\nclass\
  \ Err2:\n    def __init__(self,err):\n        self.err = err\n```\n\n```ocaml\n\
  type erreur2 = E_Typ2 | E_Exec2 | E_Undef2\ntype 'a valeur2 =\n| VInt2 of int |\
  \ VBool2 of bool\n| Clos2 of 'a * 'a exp2 * ('a * 'a valeur2) list\n| ClosRec2 of\
  \ 'a * 'a * 'a exp2 * ('a * 'a valeur2) list\ntype 'a val_err2 = Val2 of 'a valeur2\
  \ | Err2 of erreur2\n```\n\n| | 真 | 假 | b ∈ V \\ IB |\n|---|---|---|---|\n| not_v\
  \ | 假 | 真 | Err_T |\n\n| and_v | 真 | 假 | b2 ∈ V \\ IB |\n|---|---|---|---|\n| 真\

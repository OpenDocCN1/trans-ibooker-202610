- "## 5 类型\n\n考虑程序 $c_d$，它通过连续减法计算 $x$ 除以 $y$ 的欧几里得除法的商和余数，定义如下：\n\n```\n$(a := 0\
  \ ; b := x) ; \\mathbf{while} \\downarrow b \\ge y \\mathbf{do} b := \\downarrow\
  \ b - y ; a := \\downarrow a + 1$\n```\n\n- 1) 计算 $[[c_d]]_{\\text{Env}}$ 并推导出 $[[c_d]]_{\\\
  text{Env}}(\\text{Mem})(\\text{Env}(a))$ 是 $\\text{Env}(x)$ 除以 $\\text{Env}(y)$\
  \ 的整数除法的商，$[[c_d]]_{\\text{Env}}(\\text{Mem})(\\text{Env}(b))$ 是此除法的余数。\n\n- 2)\
  \ 证明以下 Hoare 三元组的全部正确性：\n\n```\n$\\{x \\ge 0 \\text{ and } y > 0\\} c_d \\{x = (\\\
  downarrow a \\times y) + \\downarrow b \\text{ and } \\downarrow b < y\\}$\n```\n\
  \n语言 Exp2 的语法，即定义构成该语言的表达式正确形式的规则，已在第 3 章中介绍。该语言的执行语义，说明用该语言编写的程序如何执行，已采用多种方法描述。\n\
  \n然而，在引入语言表达式时（特别是应用，参见第 3.1.1 节），接着是求值函数（参见第 3.2 节）以及运算符的解释（参见第 3.2.3 节），我们注意到语法并不能阻止我们编写无法求值的表达式，例如\
  \ 3 + true、(1 2) 或 1 = false。换句话说，为该语言选择的执行语义无法为这些表达式赋值。现有语法也允许我们编写表达式 f = g，其中\
  \ f 和 g 是函数，这引发了关于此类表达式含义的实质性问题。下文将更深入地讨论这些语法正确但含义不明确的表达式的语义。\n\n在表达式 3 + true 中，原语\
  \ + 的语义是 Z 上的加法。分配给 true 的语义不是 Z 的元素，因此不属于该加法的定义域。因此，此表达式无法求值。但是，可以通过将 true 与某个整数（例如\
  \ 1）关联来在 Z 中为其分配语义。这可能不明智，因为 true 将承担双重角色，既表示真值又表示整数 1。开发人员、编译器、解释器和代码审查人员随后需要确定程序中每个\
  \ true 出现的角色，以分配正确的语义（这会造成显著的混淆风险，进而导致错误风险）。因此，在源代码中用整数对 true 进行编码容易出错。出于这个原因，我们引入了一组\
  \ IB 来为布尔值分配语义。\n\n函数应用必须将函数值作为其左操作数。一旦形式参数被右操作数（即参数）替换，对函数值主体的求值将返回该应用的值。在表达式“(1\
  \ 2)”中，常量 1 不是函数，因此没有主体；此应用无法求值。\n\n在数学中，相等是定义在同一集合元素上的二元关系。由于 Exp₂ 的语义是在数学上定义的，ℤ\
  \ 和 IB 是两个不相交的集合，其元素不可比较。例如，表达式 1 = false 的语义未定义。有些语言摆脱了与数学的这种联系。例如，在 Python 中，整数与布尔值之间存在已定义的相等关系。例如，1\
  \ = false 求值为 false，而 1 = true 求值为 true，但 42 = true 求值为 false。这对其他关系运算符也成立，因此，例如，在\
  \ Python 中 true < 2 求值为 true。\n\n对于 f = g 这样的函数之间的相等，存在多种可能的语义。最好避免在程序中测试此类相等，因为结果往往不可预测。如果\
  \ f 和 g 的定义域或值域不同，它们显然不能相等。它们的类型将被称作“不兼容”（这一概念将在后面讨论）。但是，具有相同定义域和值域的两个函数之间的相等在数学中经常使用，例如，在以下陈述中：“如果两个关于实数的函数\
  \ f 和 g 满足 f = g，那么 ∫ᵇₐ f(t)dt = ∫ᵇₐ g(t)dt”。要使用此定理，我们首先需要证明 f = g。在程序执行过程中对该表达式求值需要一个算法，该算法要么写在源代码中，要么从库中导入，能够证明对于\
  \ f 和 g 定义域中的任何值 x，等式 f(x) = g(x) 为真。20 世纪初，逻辑学家证明，不存在能够在有限时间内确定任何两个函数是否“相同”的一般算法。函数相等性问题被称为不可判定。如果定义域是有限的，则仍然可以找到适应的算法，但执行所需的时间取决于定义域中元素的数量。在\
  \ Exp₂ 中，函数之间的相等不分配语义，因为这些相等的含义在很大程度上取决于函数的定义域。证明布尔值集合上两个函数的相等性很容易。另一方面，证明整数集合上两个函数（限于内存中可表示的整数）的相等性可能需要一些时间。尽管如此，出于各种原因，某些编程语言的设计者选择允许函数相等性测试。分配给表达式\
  \ f = g 的语义因此相当是临时性的。一个版本涉及定义的语法相等：x ↦ x + 2 等于其自身，但不等于 x ↦ 1 + x + 1，也不等于 x ↦ 2\
  \ + x 或 y ↦ y + 2。另一个选项关注编译后 f 和 g 的代码在内存中的位置相等性。\n\n我们鼓励使用测试函数相等性的语言的读者查阅相关参考手册，了解分配给\
  \ f = g 的含义。但是，我们不建议使用此类表达式。\n\n### 5.1. 类型检查：何时以及如何进行？\n\n在本章开头介绍的示例中，我们引用了数学集合的概念，同时解释了为什么某些表达式应该被拒绝。出于源自数学逻辑研究的原因，编程语言研究中的“集合”概念被\
  \ *类型* 概念所取代。\n\n在类型语言中，所有表达式都有类型，函数本身也是如此。例如，整数加法是一个函数，其参数是两个整数，结果是一个整数。浮点数（称为\
  \ floats）的加法是一个函数，其参数和结果都是 floats。但是，两种加法不能使用相同的算法，因为内存中整数和浮点数的内部表示完全不同：它们的编码结构不同，位的含义也不同。例如，要计算表达式\
  \ 3 + 4.5，我们必须先确定使用哪种加法算法。某些强类型语言会拒绝此表达式，因为它“类型错误”。其他一些语言会接受它，但 3 会被视为浮点数值。这种转换通常保持隐式；最好的情况下，它们可能导致难以理解的程序，最坏的情况下，可能导致难以检测的执行错误。这些隐式转换很难在类型规则中予以考虑。\n\
  \n对程序进行类型检查是指验证其所有表达式的构造是否符合关于类型的良构规则，这些规则称为 *类型规则*。如果类型规则设计良好，可以证明类型正确的程序是 *一致*\
  \ 的，也就是说，该程序的任何执行（如果不死循环）都会提供类型检查所给出的类型的结果。在这种情况下，该语言被称为 *强类型*。如果类型系统不能保证此属性，则称为\
  \ *弱类型*。例如，当系统允许在类型之间进行显式转换时就是这种情况：程序员可以强制编译器认为表达式的类型与编译器自身声明或计算的类型任意不同。\n\n类型检查显著降低了编写和执行错误程序的风险。语言的类型语言及其表达式的类型规则定义了该语言的\
  \ *类型语义*，本章将对其进行正式研究。\n\n#### 5.1.1. 何时验证类型？\n\n有两种可能的类型检查机制。第一种是在程序执行期间验证类型，并确定执行是否可以安全继续或是否会发生运行时错误。这种语义称为\
  \ *动态类型*，它与语言的动态执行语义交互。当表达式被识别为类型正确时，其求值将返回一个\n\n\n\n值不可能是输入错误；否则，将引发错误（该机制最初在第3章中与ErrT错误相关介绍）。在此情况下，语义规则必须包括类型规则，并必须解释由类型不兼容导致的错误。第二种机制是在执行前进行类型检查：这称为静态类型。只有当类型检查未检测到类型不兼容时，程序才能执行。因此，类型错误检测比动态类型的情况发生得更早，并且执行保证没有类型错误。执行语义只需处理类型正确的程序，使其更易于处理。\n\
  \n#### 5.1.2. 如何验证类型？\n\n一旦选择了静态或动态类型机制，验证就有两种选择。某些编程语言要求程序员显式声明变量的类型。例如，在C语言中，示例3.3中介绍的计算n!的函数写作如下：\n\
  \n```c\nint fact (int n) {\n  if (n <= 1) return 1 ;\n  else return n * fact (n\
  \ - 1) ;\n}\n```\n\n其中给出了参数n和结果的类型（int）。\n\n如果该函数的代码使用了临时变量，则应声明该变量的类型：\n\n```c\n\
  int fact (int n) {\n  if (n <= 1) return 1 ;\n  else {\n    int rec_result = fact\
  \ (n - 1) ;\n    return n * rec_result ;\n  }\n}\n```\n\n类型检查器在应用类型规则时使用此显式类型信息，以保证该程序是类型正确的。其他一些语言不要求源代码中包含类型注解，任何表达式的类型都会自动推导。这种机制称为类型推断或类型综合。它也基于类型规则，但需要额外的分析。由此获得的类型被称为综合或推断的类型。\n\
  \nExp2的设计采用了类型推断机制。第5.3节研究了定义第5.4节中描述的类型推断算法所用的正式类型验证规则。关于类型的更详细研究可见[PIE 02]。\n\n\
  ### 5.2. 程序Exp<sub>2</sub>的非正式类型\n\n#### 5.2.1. 第一个示例\n\n让我们先直观地计算第3.1.4节中介绍的表达式[3.3]的类型：\n\
  \nlet x(1) = 25 in let f = fun x(2) ↦ x(3) + 3 in (f 7) + x(4)\n\n- let x(1) = 25\
  \ in ...\n\n第一个let将x(1)绑定到常量值25。由于这个字面常量表示一个整数，我们推断x(1)必须具有整数类型，表示为int。\n\n- let\
  \ f = fun x(2) ↦ x(3) + 3 in ...\n\n第二个let将f绑定到一个函数表达式。因此，它的类型必须是接受某种类型的参数并返回另一种类型值的函数的类型。现在，我们需要确定这两种类型。目前，参数x(2)的类型是未知的，因为没有为其提供类型注解。我们引入一个未知类型α（也称为类型变量）来表示这个未知类型。让我们检查f的函数体以推断结果的类型。这个函数体包含对+运算符的应用，其语义是两个整数的加法。这意味着f的结果必须是int类型；此外，作为+参数的两个子表达式也必须是int类型。3就是这种情况，因为它是表示整数的字面常量。左边的子表达式x(3)也需要是int类型。但是，x(3)是标识符x(2)的一个出现，由这个函数f绑定。只有当x(3)和x(2)（我们为其分配了未知类型α）具有相同类型时，这个函数才是类型正确的。因此，α\
  \ = int。最后，f的类型是一个参数为整数并返回整数的函数的类型。这个类型表示为int → int，其中箭头表示函数的类型，其参数类型在箭头左侧，返回值类型在箭头右侧。\n\
  \n- (f 7) + x(4)\n\n这个表达式是对+运算符的应用，它接受两个int类型的参数。左边，函数f明显被应用于一个整数（7是int类型）并返回一个整数。右边，x(4)是由let\
  \ x(1) = 25 in ...绑定的标识符x(1)的一个出现，也是int类型。因此，+的应用是类型正确的，并返回一个int类型的结果，即整个表达式的类型。\n\
  \n在类型检查机制的这种非正式描述中，我们不得不检索标识符的类型。就像表达式在执行环境中求值一样，类型检查需要一个类型环境。作为一种初步方法，我们将考虑该环境将标识符绑定到其类型；这一点将在后面更详细地讨论。\n\
  \n#### 5.2.2. 条件表达式的类型检查\n\n沿用我们的非正式方法，我们现在将计算表达式fun x ↦ if x then true else 0的类型。这是一个具有参数x的函数。与前一个示例一样，我们没有类型注解，因此x的类型是未知类型α。分析函数体，我们看到x充当条件，意味着它必须是布尔值，表示为bool。因此我们必须有α\
  \ = bool。这个表达式结果的类型是条件表达式的类型。then分支的类型是bool，else分支的类型是int。应该选择哪种类型？让我们从另一个角度来看这个问题。当将此函数应用于实际值时，结果的类型将取决于参数的值，这一点阻止了该结果在源代码中进一步使用。因此，类型正确的条件表达式必须对布尔值进行测试，并在两种可能的情况下返回相同类型的值。结论，我们正在研究的这个表达式是类型错误的。\n\
  \n#### 5.2.3. 无类型约束的类型检查\n\n在类型检查介绍的这最后部分，我们考虑以下表达式：\n\nlet f_(1) = fun x_(1) ↦\
  \ x_(2) in if (f_(2) true) then 8 else (f_(3) 7)\n\n- let f_(1) = fun x_(1) ↦ x_(2)\
  \ in ...\n\n与我们的第一个示例一样，let将f_(1)绑定到一个函数表达式。因此，我们需要确定其参数和函数体的类型。同样，由于出现的x_(1)没有类型注解，其类型未知，将用α表示。f的函数体只是返回参数；这没有提供关于x类型的任何进一步信息。因此，该类型没有约束，意味着α可以被任何类型替代。确实，这个函数可以应用于任何值，因为它只是将该值作为结果返回。因此，f_(1)的类型是α\
  \ → α。\n\n- if (f_(2) true), then 8 else (f_(3) 7)\n\n在条件表达式中，条件表达式必须是bool类型。因此，我们必须确保(f_(2)\
  \ true)是bool类型。函数f_(1)的类型是α → α，由于它被应用于类型为bool的常量true，我们必须有α = bool。条件的类型是bool，因为α也是f_(1)结果的类型。现在，我们必须确保这个条件表达式两个分支中的表达式具有相同的类型。由于then分支是int类型，else分支也必须是int类型。最后一个分支是将f_(3)应用于类型为int的参数7，因此结果也是int类型。因此，条件表达式的两个分支具有相同的类型，这也是整个表达式的类型。但是，我们的推理中存在一个微妙的一致性问题，将在5.2.4节中解释。\n\
  \n#### 5.2.4. 多态\n\n在第5.2.3节的最后一个示例中，将\\( f_{(2)} \\)应用于\\( true \\)时，我们使用了\\( \\\
  alpha = \\text{bool} \\)。然后，将\\( f_{(3)} \\)应用于7时，我们隐式地使用了\\( \\alpha = \\text{int}\
  \ \\)。根据等价的传递性，我们得到\\( \\text{bool} = \\text{int} \\)，这当然是错误的。但是，由于\\( f \\)是恒等函数，\\\
  ( f \\)的两种用法似乎都是合法的。虽然关于\\( f_{(1)} \\)的类型没有约束，但类型表达式\\( \\alpha \\to \\alpha \\\
  )不能直接用于在\\( \\alpha \\)与几种可能不兼容的不同类型之间建立等式约束。对于\\( f \\)的每个出现，我们必须使用其类型表达式的一个“副本”，并将类型变量\\\
  ( \\alpha \\)替换为新的类型变量（称为*新鲜变量*）。这可以防止由\\( f \\)的不同出现引入的类型约束之间产生干扰。因此，类型环境将标识符绑定到其类型的“形式”，而不是类型本身；这种形式称为*类型方案*。该方案可能包含称为*泛化*类型变量的特殊类型变量。在类型环境中查找标识符的类型时，会生成类型方案的一个“新鲜”副本，其中泛化类型变量被替换为新变量。这个副本称为方案的一个*实例*，这些新变量不是泛化的，因为它们表示某些尚未知晓的类型。因此，一个类型方案，记为\\\
  ( \\sigma \\)，由泛化类型变量列表（待复制）和用这些变量编写的类型形状组成。上面描述的函数\\( f \\)的类型方案因此表示为\\( \\forall\
  \ \\alpha. \\alpha \\to \\alpha \\)。\n\n在类型检查过程结束时，其类型包含类型变量的表达式被称为*多态*的。如我们将在第5.6节中看到，在类型检查过程结束时，某些表达式的类型可能包含无法泛化的未知变量。\n\
  \n### 5.3. Typing rules in Exp<sub>2</sub>\n\n我们现在转向类型检查规则的正式定义。这些规则目前尚不允许我们在程序中综合类型，但它们使检查程序是否类型正确成为可能。这些规则将在第5.4节中用于开发自动类型计算的推断算法。\n\
  \n#### 5.3.1. 类型、类型方案和类型环境\n\n首先，必须定义用于表示类型的表达式中使用的语言，称为*类型代数*。每种类型\\( \\tau \\\
  )对应一组值。Exp2包括整数、布尔和函数值。如我们所见，还需要类型变量。类型使用表5.1所示的文法归纳定义。\n\n在以下内容中，\\( \\alpha_1\
  \ \\to \\alpha_2 \\to \\cdots \\to \\alpha_{n+1} \\)将用于表示类型：\n\n\\(\\alpha_1 \\\
  to (\\alpha_2 \\to (\\cdots (\\alpha_n \\to \\alpha_{n+1})))\\)\n\n\n\n\n\n## 表\
  \ 5.1. Exp$_2$ 的类型代数\n\n| $\\tau := \\alpha$ | 变量 |\n| :--- | :--- |\n| int | 整数\
  \ |\n| bool | 布尔值 |\n| $\\tau_1 \\to \\tau_2$ | 函数 |\n\n这种记法反映了这样一个事实：带有 \\(n\\\
  ) 个参数的函数 \\(f : \\alpha_1 \\times \\alpha_2 \\times \\cdots \\times \\alpha_n \\\
  rightarrow \\alpha_{n+1}\\) 总可以定义为单参数函数，该函数返回一个带有 \\(n - 1\\) 个参数的函数。\n\n```ocaml\n\
  type var_name_t = string\ntype type_t = T_var of var_name_t | T_int | T_bool | T_fun\
  \ of (type_t * type_t)\n\nlet new_ty_var =\n  let cpt = ref 0 in\n  function ()\
  \ -> cpt := !cpt + 1 ; T_var (\"t\" ^ (string_of_int !cpt))\nval new_ty_var : unit\
  \ -> type_t\n```\n\n类型代数在 OCaml 中使用和类型实现。变量通过名称（字符串）来区分。我们还定义了一个函数 new_ty_var，用于创建一个新的类型变量，其名称与所有已创建的变量不同。这种名称上的唯一性是通过一个局部于该函数的计数器实现的；该计数器在每次创建变量时递增，其值用作变量的名称。与之前的实现一样，Python\
  \ 中使用类来对 OCaml 的和类型进行编码。\n\n```python\nclass T_int:\n    def __init__(self):\n \
  \       pass\n\nclass T_bool:\n    def __init__(self):\n        pass\n\nclass T_fun:\n\
  \    def __init__(self, t1, t2):\n        self.t1 = t1\n        self.t2 = t2\n\n\
  class T_var:\n    def __init__(self, vname):\n        self.vname = vname\n\nvar_cpt\
  \ = 0\n\n\ndef new_ty_var():\n    global var_cpt\n    var_cpt = var_cpt + 1\n  \
  \  return T_var(\"t\" + str(var_cpt))\n```\n\n每个类都定义为表示类型代数的一个构造子。虽然 OCaml 允许创建局部于函数的持久引用，但在\
  \ Python 中，用于为每个新变量分配唯一名称的计数器必须定义为全局变量。显然，只有函数 new_ty_var 会使用这个计数器。例如，第一次应用此函数将返回字符串\
  \ \"t0\"，第二次将返回 \"t1\"，以此类推。\n\n与使用自然语言给出类型规则不同，我们引入了类型关系 Env ⊢ e : τ 的数学定义，它表示在类型环境\
  \ Env 中，表达式 e 具有类型 τ。对表达式进行类型化时，我们需要一个类型环境，该环境将每个标识符与一个类型方案关联，正如我们在 5.2.4 节中看到的，一个表达式可能从同一个类型方案中导出多种类型。在这种情况下，每种类型都源自一个“骨架”类型方案：这就是多态的定义。\n\
  \n### 定义 5.1. 类型方案：类型方案的语法由以下文法定义：σ := ∀α1 ... αn.τ，其中 τ 是方案的主体，α1, ..., αn 是泛化变量。\n\
  \n在方案中普遍量化变量 αi 出现的顺序并不重要。假设它们的名称都不同。例如，∀α1 α2. α1 → α2 和 ∀α2 α1. α1 → α2 表示相同的方案。此外，仅因量化变量名称不同而不同的两个类型方案被视为相同（这些方案也可以说是模\
  \ α-变换等价）。例如，∀α1 α2. α1 → α2 和 ∀α3 α4. α3 → α4 表示相同的方案。\n\n类型环境由一组绑定列表表示：\n\nEnv\
  \ = [(x1, σ1), · · · , (xn, σn)]\n\n其中每个标识符 xi 都绑定到其类型方案 σi。\n\n```ocaml\ntype scheme_t\
  \ = (var_name_t list * type_t)\n```\n\n类型方案在 OCaml 中编码为一对，第一个组件是泛化变量的列表，第二个组件是表示方案主体的类型。Python\
  \ 不允许类型定义，因此无法给出该语言的编码。然而，我们在 Python 和 OCaml 中使用相同的数据结构（即第一个组件是列表的一对）。类型环境的表示与执行环境中使用的表示类似。绑定到标识符的值简单地被类型方案替换。\n\
  \n```ocaml\ntype ty_env_t = (string * scheme_t) list\nexception Unbound_var of string\n\
  \nlet rec find_id_ty idname = function\n  | [] -> raise (Unbound_var idname)\n \
  \ | h :: q -> if fst h = idname then snd h else find_id_ty idname q\nval find_id_ty\
  \ : string -> (string * 'a) list -> 'a\n```\n\n```python\nclass Unbound_var(Exception):\n\
  \    def __init__(self, id):\n        self.id = id\n\ndef find_id_ty(idname, env):\n\
  \    for (n, ty) in env:\n        if n == idname: return ty\n    raise Unbound_var(idname)\n\
  ```\n\n类型环境定义为标识符与其类型方案之间的关联列表。函数 `find_id_ty` 在其第二个参数（编码当前环境的列表）中搜索其第一个参数（标识符）的第一个出现位置。它从列表的开头开始，如果在到达列表末尾时未找到该参数，则引发特定错误。这种表示与执行环境中使用的表示类似；绑定到标识符的值简单地被类型方案替换。\n\
  \n#### 5.3.2. 泛化、替换和实例化\n\n要构建环境，标识符必须绑定到类型方案，因此类型必须转换为方案。此转换需要两个步骤。然而，在少数不应进行泛化的情况下，类型会转换为所谓的平凡类型方案。\n\
  \n### 定义 5.2. 平凡类型方案：平凡方案是形式为 ∀0.τ 的方案。\n\n```ocaml\nlet trivial_scheme ty = (([]),\
  \ ty) : scheme_t\nval trivial_scheme : type_t -> scheme_t\n```\n\n如果没有在 `trivial_scheme`\
  \ 上显式添加类型注解 `scheme_t`，OCaml 将会将“更一般”的类型 `’a -> (’b list * ’a)` 与 `trivial_scheme`\
  \ 关联。该注解会导致更精确的类型，这一点有助于开发人员。\n\n```python\ndef trivial_scheme(ty):\n    return\
  \ ([], ty)\n```\n\n相反，对类型表达式中出现的变量进行泛化需要一个类型泛化操作，该操作返回一个多态类型方案。然而，只有某些变量才应被泛化：\n\
  \n- 在环境中任何位置都未出现的变量；\n- 在环境中存在的类型方案中被泛化的变量；这些变量可以重命名而不改变方案的指称，称为绑定变量。\n\n换句话说，环境中存在但未被\
  \ ∀ 绑定的变量不会被泛化：这些变量称为所涉环境的自由变量。自由变量表示一种尚未知晓的类型，环境中该变量的所有自由出现都表示同一类型。\n\n### 定义 5.3.\
  \ 类型方案的自由变量：类型方案 σ 的自由变量集合 F(σ) 包含 σ 的类型变量，即那些未被泛化的变量。该集合定义为：\n\nF(∀α1 ... αn .\
  \ τ) = F(τ) \\ {α1, ..., αn}\n\n其中 F(τ) 定义为：\n\n- F(int) = F(bool) = ∅\n- F(α) =\
  \ {α}\n- F(τ1 → τ2) = F(τ1) ∪ F(τ2)\n\n此定义可扩展到类型环境：\n\nF(Env) = ⋃ (x,σ)∈Env F(σ)\n\
  \n### 定义 5.4. 泛化：环境 Env 中类型 τ 的泛化是定义的类型方案：\n\nGen(τ, Env) = ∀α1 ... αn. τ，其中 {α1\
  \ ... αn} = F(τ) \\ F(Env)\n\n### 示例 5.1. 给定环境：\n\nEnv = [(x, ∀α1. α1 → α1), (y,\
  \ ∀α1. α1 → α2), (z, ∀∅. α3), (w, ∀∅. int)]\n\n我们有 F(Env) = {α2, α3}，并且：\n\nGen((α1\
  \ → α2) → (α3 → α4), Env) = ∀α1 α4. (α1 → α2) → (α3 → α4)\n\n```ocaml\nlet find_vars_in_type\
  \ in_ty =\n  let rec rec_find accu = function\n    | T_int | T_bool -> accu\n  \
  \  | T_fun (t1, t2) ->\n        let new_accu = rec_find accu t1 in rec_find new_accu\
  \ t2\n    | T_var v_name ->\n        if not (List.mem v_name accu) then v_name ::\
  \ accu else accu\n  in\n  rec_find [] in_ty\nval find_vars_in_type : type_t -> var_name_t\
  \ list\n```\n\n```python\ndef find_vars_in_type(in_ty):\n    def rec_find(accu,\
  \ ty):\n        if isinstance(ty, T_int) or isinstance(ty, T_bool):\n          \
  \  return []\n        elif isinstance(ty, T_fun):\n            return find_vars_in_type(ty.t1)\
  \ + find_vars_in_type(ty.t2)\n        elif isinstance(ty, T_var):\n            if\
  \ ty.vname in accu: return accu\n            else: return [ty.vname] + accu\n  \
  \      else: raise ValueError\n    return rec_find([], in_ty)\n```\n\n用于在类型中查找自由变量的函数在类型结构上递归操作。在类型变量的情况下，我们使用标准库中的\
  \ List.mem 函数来验证元素是否属于列表；这防止将变量多次插入到累加器中。\n\n```ocaml\nlet rec find_vars_in_env\
  \ = function\n  | [] -> []\n  | (_, (gen_vars, body)) :: rem ->\n      let vars_of_body\
  \ = find_vars_in_type body in\n      let sch_free_vars =\n        List.filter (fun\
  \ var -> not (List.mem var gen_vars)) vars_of_body in\n      sch_free_vars @ (find_vars_in_env\
  \ rem)\nval find_vars_in_env :\n  ('a * (var_name_t list * type_t)) list -> var_name_t\
  \ list\n```\n\n```python\ndef find_vars_in_env(env):\n    accu = []\n    for (_,\
  \ (gen_vars, body)) in env:\n        vars_of_body = find_vars_in_type(body)\n  \
  \      sch_free_vars = \\\n            list(filter(lambda var: not (var in gen_vars),\
  \ vars_of_body))\n        accu = accu + sch_free_vars\n    return accu\n```\n\n\
  ```ocaml\nlet generalize env ty =\n    let vars_of_ty = find_vars_in_type ty in\n\
  \    let vars_of_env = find_vars_in_env env in\n    let gen_vars =\n      List.filter\
  \ (fun var -> not (List.mem var vars_of_env)) vars_of_ty in\n    (gen_vars, ty)\n\
  val generalize :\n  ('a * ('b * type_t)) list -> type_t -> (var_name_t list * type_t)\n\
  ```\n\n```python\ndef generalize(env, ty):\n    vars_of_ty = find_vars_in_type(ty)\n\
  \    vars_of_env = find_vars_in_env(env)\n    gen_vars = list(filter(lambda var:\
  \ not (var in vars_of_env), vars_of_ty))\n    return (gen_vars, ty)\n```\n\n\n\n\
  \n\n泛型化函数分三个阶段进行。首先，获取待泛型化类型中存在的所有变量。然后，计算环境中的自由变量集合。最后一步计算类型中存在的变量列表，排除环境中找到的变量。在\
  \ OCaml 中，此过滤操作使用标准库中的 `List.filter` 函数执行，该函数仅保留列表中满足给定谓词的元素。在 Python 中，通过使用 `lambda`\
  \ 构造定义此谓词来执行过滤。\n\n相反，若要为标识符表达式进行类型推导，需要从环境中绑定到该标识符的类型方案生成一个类型。这由 `instantiation`\
  \ 操作完成，该操作通过“特化”方案返回一个方案的 `instance`。一个实例的正式定义使用 `substitution` 的概念，如下所示。\n\n**定义\
  \ 5.5. 替换：** 替换是从类型变量集合到类型代数的偏函数，具有有限定义域。\n\\([\\alpha_1 \\leftarrow \\tau_1; \\\
  dots; \\alpha_n \\leftarrow \\tau_n]\\) 表示替换 \\(\\theta\\)。\\(\\theta\\) 的定义域，记作\
  \ \\(\\text{dom}(\\theta)\\)，是集合 \\(\\{\\alpha_1, \\dots, \\alpha_n\\}\\)。\\(\\\
  theta\\) 的值域，记作 \\(\\text{codom}(\\theta)\\)，是集合 \\(\\{\\tau_1, \\dots, \\tau_n\\\
  }\\)。\\(\\theta\\) 将类型 \\(\\tau_i\\) 关联到变量 \\(\\alpha_i\\)。\n\n_为简化起见，在以下内容中，我们假设_\
  \ \\(\\text{dom}(\\theta)\\) _中的变量互不相同，并且：_\n\n\\(\\text{dom}(\\theta) \\cap \\\
  bigcup_{\\tau \\in \\text{codom}(\\theta)} \\mathcal{F}(\\tau) = \\emptyset\\)\n\
  \n替换自然扩展为从类型到类型的偏函数，仍具有有限定义域，方式如下：\n\n\\(\\overline{\\theta}(\\text{int}) = \\text{int}\
  \ \\quad \\overline{\\theta}(\\text{bool}) = \\text{bool}\\)\n\n\\(\\overline{\\\
  theta}(\\alpha) = \\begin{cases} \\theta(\\alpha) & \\text{if } \\alpha \\in \\\
  text{dom}(\\theta) \\\\ \\alpha & \\text{else} \\end{cases}\\)\n\n\\(\\overline{\\\
  theta}(\\tau_1 \\to \\tau_2) = \\overline{\\theta}(\\tau_1) \\to \\overline{\\theta}(\\\
  tau_2)\\)\n\n从今以后，我们将把替换 \\(\\theta\\) 及其扩展 \\(\\overline{\\theta}\\) 视为同一对象，两者均记作\
  \ \\(\\theta\\)。定义替换所用的假设保证，对于任意类型 \\(\\tau\\)，\\(\\overline{\\theta}(\\overline{\\\
  theta}(\\tau)) = \\overline{\\theta}(\\tau)\\)（在这种情况下，\\(\\theta\\) 被称为 _幂等的_）。\n\
  \n```ocaml\ntype subst_t = (var_name_t * type_t) list\nlet empty_subst = ([]) :\
  \ subst_t\nval empty_subst : subst_t\nlet singleton var_name ty = ([(var_name, ty)]\
  \ : subst_t)\nval singleton : var_name_t -> type_t -> subst_t\n```\n\n```python\n\
  empty_subst = []\ndef singleton(var_name, ty):\n    return [(var_name, ty)]\n```\n\
  \n替换由关联列表表示，即一对对的列表，其中第一个组件表示类型变量的名称，第二个组件表示用于替换该变量的类型。如果关联列表只包含一个元素，则该替换称为初等替换。\n\
  \n```ocaml\nlet rec apply_one transf = function\n| T_fun (t1, t2) -> T_fun (apply_one\
  \ transf t1, apply_one transf t2)\n| T_var var_name ->\n  if (fst transf) = var_name\
  \ then snd transf else T_var var_name\n| any -> any\nval apply_one : (var_name_t\
  \ * type_t) -> type_t -> type_t\n```\n\n```python\ndef apply_one(transf, ty):\n\
  \    if isinstance(ty, T_int) or isinstance(ty, T_bool):\n        return ty\n  \
  \  elif isinstance(ty, T_fun):\n        return T_fun(apply_one(transf, ty.t1), apply_one(transf,\
  \ ty.t2))\n    elif isinstance(ty, T_var):\n        (fst_transf, snd_transf) = transf\n\
  \        if fst_transf == ty.vname:\n            return snd_transf\n        else:\n\
  \            return ty\n    else:\n        raise ValueError\n```\n\n函数 apply_one\
  \ 的第一个参数是编码初等替换的列表，第二个参数是一个类型。该函数返回该类型的更新，其中初等替换涉及的变量被其关联的类型所替换。\n\n```ocaml\nlet\
  \ rec apply ty = function\n| [] -> ty\n| h :: q -> apply (apply_one h ty) q\nval\
  \ apply : type_t -> (var_name_t * type_t) list -> type_t\n```\n\n```python\ndef\
  \ apply(ty, subst):\n    ty_res = ty\n    for transf in subst:\n        ty_res =\
  \ apply_one(transf, ty_res)\n    return ty_res\n```\n\napply 函数将替换应用于类型。换句话说，该类型的更新是通过迭代执行表示替换的列表中包含的初等替换来完成的。这种做法之所以正确，是基于定义\
  \ 5.5 中确立的假设。\n\n替换的概念用于定义类型方案的实例。\n\n**定义 5.6.** 实例：如果存在替换 \\(\\theta\\)，使得 \\\
  (\\text{dom}(\\theta) = \\{\\alpha_1, \\dots, \\alpha_k\\}\\) 且 \\(\\tau' = \\theta(\\\
  tau)\\)，则称 \\(\\tau'\\) 是类型方案 \\(\\sigma = \\forall \\alpha_1 \\dots \\alpha_k .\
  \ \\tau\\) 的一个实例，记作 \\(\\sigma \\le \\tau'\\)。在这种情况下，类型 \\(\\tau'\\) 与 \\(\\tau\\\
  ) 兼容。\n\n#### 5.3.3. 类型规则与类型树\n\n我们现在可以给出用于确保表达式具有良好类型的规则。这些规则在 Box 5.1 中给出，采用了\
  \ 3.3 节中已用于描述 **Exp**<sub>2</sub> 的大步运行语义的符号。我们给出关系 \\(\\text{Env} \\vdash e : \\\
  tau\\) 的正式定义，这意味着在类型环境 Env 中，表达式 \\(e\\) 的类型为 \\(\\tau\\)。\n\n\\((T_\\text{true})\
  \ \\frac{}{\\text{Env} \\vdash true : \\text{bool}} \\quad (T_\\text{false}) \\\
  frac{}{\\text{Env} \\vdash false : \\text{bool}} \\quad (T_\\text{int}) \\frac{}{\\\
  text{Env} \\vdash i : \\text{int}}\\)\n\\((T_\\text{var}) \\frac{\\text{Env}(x)\
  \ \\le \\tau}{\\text{Env} \\vdash x : \\tau} \\quad (T_\\text{unop}) \\frac{\\text{Env}\
  \ \\vdash \\text{op} : \\tau_1 \\to \\tau_2 \\quad \\text{Env} \\vdash e : \\tau_1}{\\\
  text{Env} \\vdash \\text{op } e : \\tau_2}\\)\n\\((T_\\text{binop}) \\frac{\\text{Env}\
  \ \\vdash \\text{op} : \\tau_1 \\to \\tau_2 \\to \\tau_3 \\quad \\text{Env} \\vdash\
  \ e_1 : \\tau_1 \\quad \\text{Env} \\vdash e_2 : \\tau_2}{\\text{Env} \\vdash e_1\
  \ \\text{ op } e_2 : \\tau_3}\\)\n\\((T_\\text{ite}) \\frac{\\text{Env} \\vdash\
  \ e_1 : \\text{bool} \\quad \\text{Env} \\vdash e_2 : \\tau \\quad \\text{Env} \\\
  vdash e_3 : \\tau}{\\text{Env} \\vdash \\text{if } e_1 \\text{ then } e_2 \\text{\
  \ else } e_3 : \\tau}\\)\n\\((T_\\text{fun}) \\frac{(x, \\forall \\emptyset . \\\
  tau_1) \\oplus \\text{Env} \\vdash e : \\tau_2}{\\text{Env} \\vdash \\text{fun }\
  \ x \\mapsto e : \\tau_1 \\to \\tau_2}\\)\n\\((T_\\text{let}) \\frac{\\text{Env}\
  \ \\vdash e_1 : \\tau_1 \\quad \\sigma = \\text{Gen}(\\tau_1, \\text{Env}) \\quad\
  \ (x, \\sigma) \\oplus \\text{Env} \\vdash e_2 : \\tau_2}{\\text{Env} \\vdash \\\
  text{let } x = e_1 \\text{ in } e_2 : \\tau_2}\\)\n\\((T_\\text{rec}) \\frac{(f,\
  \ \\forall \\emptyset . \\tau_1 \\to \\tau_2) \\oplus (x, \\forall \\emptyset .\
  \ \\tau_1) \\oplus \\text{Env} \\vdash e : \\tau_2}{\\text{Env} \\vdash \\text{rec\
  \ } f \\, x = e : \\tau_1 \\to \\tau_2}\\)\n\\((T_\\text{app}) \\frac{\\text{Env}\
  \ \\vdash e_1 : \\tau_2 \\to \\tau_1 \\quad \\text{Env} \\vdash e_2 : \\tau_2}{\\\
  text{Env} \\vdash (e_1 \\, e_2) : \\tau_1}\\)\n\n**Box 5.1.** _**Exp**<sub>2</sub>\
  \ 中的类型规则_\n\n规则 \\(T_\\text{true}\\)、\\(T_\\text{false}\\) 和 \\(T_\\text{int}\\\
  ) 表示布尔常量的类型为 \\(\\text{bool}\\)，整数常量的类型为 \\(\\text{int}\\)。根据规则 \\(T_\\text{var}\\\
  )，标识符的类型是其在类型环境中绑定的方案的一个实例，且 \\(\\text{Env}(x)\\) 表示在 Env 中绑定到 \\(x\\) 的类型方案。规则\
  \ \\(T_\\text{unop}\\) 指出，一元运算符作用于参数的表达式的类型是该运算符返回的类型，前提是参数的类型是该运算符要求的类型。类似地，规则\
  \ \\(T_{binop}\\) 指出，二元运算符作用于两个参数的表达式的类型是该运算符返回的类型，前提是两个参数的类型都是该运算符要求的类型。规则 \\(T_{ite}\\\
  ) 指出，条件表达式的类型是其 then 和 else 分支所构成的两个子表达式共享的类型，前提是条件子表达式的类型为 bool。\n\n根据规则 \\(T_{fun}\\\
  )，如果当变量 \\(x\\) 的类型被取为 \\(\\tau_1\\) 时表达式 \\(e\\) 的类型为 \\(\\tau_2\\)，那么一个主体为表达式\
  \ \\(e\\) 的变量 \\(x\\) 的函数的类型为 \\(\\tau_1 \\to \\tau_2\\)。请注意，绑定到参数 \\(x\\) 的方案是平凡的：\\\
  (\\tau_1\\) 中可能出现的类型变量不会被泛型化。如果这些变量被泛型化，则可能对不正确的程序进行类型推导。例如，考虑表达式 fun \\(x \\mapsto\\\
  ) if \\(x\\) then \\(x + 1\\) else \\(x + 2\\)。对该表达式进行类型推导必须失败，因为 \\(x\\) 既被用作布尔值（规则\
  \ \\(T_{ite}\\)），又被用作整数（规则 \\(T_{binop}\\)）。如果将 \\(x\\) 的类型泛型化为一个用于类型检查函数主体的方案，那么\
  \ \\(x\\) 的每个出现都将使用方案的一个新实例进行类型推导：第一个实例与布尔值兼容，而第二个实例与整数兼容。因此，类型 \\(\\tau_1\\) 不会被泛型化，这意味着函数主体中\
  \ \\(x\\) 的所有出现都必须使用同一个实例。\n\n规则 \\(T_{let}\\) 指出，表达式 let \\(x = e_1\\) in \\(e_2\\\
  ) 的类型是子表达式 \\(e_2\\) 的类型，假设 \\(x\\) 绑定到泛型化 \\(e_1\\) 类型的方案。根据规则 \\(T_{rec}\\)，一个主体为表达式\
  \ \\(e\\) 的变量 \\(x\\) 的递归函数 \\(f\\) 的类型为 \\(\\tau_1 \\to \\tau_2\\)，其中 \\(\\tau_2\\\
  ) 是 \\(e\\) 在以下假设下的类型：\\(x\\) 的类型为 \\(\\tau_1\\)，以及 \\(f\\) 的类型方案与 \\(\\tau_1 \\\
  to \\tau_2\\) 兼容。最后，规则 \\(T_{app}\\) 指出，要将表达式 \\(e_1\\) 应用于参数 \\(e_2\\)，\\(e_1\\\
  ) 必须是函数类型 \\(\\tau_1 \\to \\tau_2\\)，且 \\(e_2\\) 必须是类型 \\(\\tau_1\\)。整体表达式的类型是函数结果的类型，即\
  \ \\(\\tau_2\\)。\n\n请注意，规则 \\(T_{rec}\\) 将递归定义的函数与一个平凡的类型方案之间的绑定引入环境。因此，表达式\n\n\
  ```\nrec f x = let y = (f 7) in (f true)\n```\n\n会被类型检查过程拒绝。确实，\\(f\\) 在该表达式中既被用作类型\
  \ int \\(\\to \\alpha\\)，也被用作类型 bool \\(\\to \\alpha\\)。\n\n请注意，将 \\(f\\) 的类型泛型化，即给\
  \ \\(f\\) 赋予类型 \\(\\beta \\to \\alpha\\)，在表达式求值所用的执行语义方面仍然是正确的。\\(f\\) 的方案必须限制为一个平凡方案，以保证类型推导的可判定性（即设计一种保证终止的类型计算算法的可能性）。\n\
  \n\n\n\n\n注.-- 此限制也适用于允许定义互递归函数的语言，即使互定义的函数并不执行实际的递归调用。因此，下面这个显然正确的程序将被类型检查过程拒绝：\n\
  \n```OCaml\nlet rec map f l = match l with [] -> [] | h :: q -> (f h) :: (map f\
  \ q)\nand map_succ l = map (fun x -> x + 1) l\nand map_not l = map (fun x -> not\
  \ x) l ;;\nError: This expression has type int but an expression was\n expected\
  \ of type bool\n```\n\n该程序重新定义了对列表 l 上作为参数传入的函数 f 进行迭代的函数 map。在这个互递归定义中（由 let rec\
  \ 和 and 引入），它还定义了一个给整数列表的每个元素加 1 的函数，以及一个对布尔列表的每个元素取补的函数。由于在同一定义中 map 被应用于整数列表和布尔列表，OCaml\
  \ 编译器拒绝了这三个函数的联合定义。子表达式 map 的类型检查不会对其类型进行泛化。如果 map 独立于其两种用途进行递归定义，则会进行泛化。\n\n```OCaml\n\
  let rec map f l = match l with [] -> [] | h :: q -> (f h) :: (map f q) ;;\nval map\
  \ : ('a -> 'b) -> 'a list -> 'b list = <fun>\n```\n\n```OCaml\nlet map_succ l =\
  \ map (fun x -> x + 1) l\nand map_not l = map (fun x -> not x) l ;;\nval map_succ\
  \ : int list -> int list = <fun>\nval map_not : bool list -> bool list = <fun>\n\
  ```\n\n为避免此类困难，OCaml 提供了关键字 rec 来标注其作者认为是递归的函数。使用此标注可避免隐式地将所有函数视为递归函数（如许多没有类型推断的语言所做），这将禁止对其类型进行泛化，从而取消任何多态性的可能性。\n\
  \n请注意，在编译期间区分递归函数和非递归函数还有其他优势，包括能够生成更高效的代码。\n\n计算表达式类型所涉及的不同阶段可以用类型树的形式描述，类似于第 3\
  \ 章中用于表示表达式求值的树。\n\n## 示例 5.2.- 表达式 let f = fun x -> x in (f 5) 的类型树如下：\n\n(T_var)\
  \ α ≤ α\n----------------\n(x, ∀θ, α) ⊕ Env ⊢ x : α\n(T_var) β → β ≤ int → int\n\
  Env' ⊢ 5 : int\n----------------\n(T_app) ...\n(T_let) Env ⊢ let f = fun x -> x\
  \ in (f 5) : int\n\n### 5.4. Exp2 中的类型推断算法\n\n第 5.3 节介绍的规则用于验证包含类型注释的程序的类型。它们还定义了语言的类型系统，并且如我们在第\
  \ 5.5 节中将看到的那样，保证类型正确程序的某些安全性属性。在本节中，我们描述一个从程序表达式生成类型的算法。推而广之，此推断算法也可用于检查程序是否类型正确。显然，类型推断算法必须相对于类型系统及其相关规则是正确的。类型推断的优势在于，程序员无需在程序中提供显式的类型注释。\n\
  \n#### 5.4.1. 主类型\n\n类型推断算法由一组规则正式描述。这些规则确立了这样一个事实：在类型环境 Env 中，当类型上由替换 θ 描述的一组约束可以被满足时，表达式\
  \ e 的类型为 τ（例如，这组约束不得要求类型变量 α 同时等于 int 和 bool）。这表示为 Env ⊢ e ▷ (τ, θ)。\n\n此外，在多态性情况下，此算法计算的类型\
  \ τ 必须尽可能一般：它称为 e 的主类型。例如，表达式 fun x -> fun y -> (x y) 的类型是 τ0 = (α → β) → α → β，但也可能是：\n\
  \n- τ1 : (int → int) → int → int\n- τ2 : (int → bool) → int → bool\n- τ3 : (int\
  \ → bool → int) → int → bool → int\n\n然而，类型 τ0 是最一般的，因为它允许该表达式在最多的上下文中使用。其他可能的类型都由应用于\
  \ τ0 的替换得到。例如，类型 τ1、τ2 和 τ3 可按以下方式获得：\n\n- τ1 = τ0[α ← int, β ← int]\n- τ2 = τ0[α\
  \ ← int, β ← bool]\n- τ3 = τ0[α ← int, β ← (bool → int)]\n\n考虑表达式的主类型可以防止某些类型冲突。如果类型推断算法不使用表达式的主类型，它可能会拒绝实际上是类型正确的表达式。出于这个原因，任何表达式都必须具有属于类型系统的主类型（在\
  \ Exp2 语言中情况如此），否则推断将不可能，或者用户将被迫为程序的某些部分提供类型注释。\n\n#### 5.4.2. 约束集与一元化\n\n类型推断算法确立，当一组约束可以被满足时，即存在一个解时，表达式\
  \ \\( e \\) 的类型为 \\( \\tau \\)。约束引入了两种类型之间的等式。例如，从表达式 if \\( (f\\ 4) \\) then \\\
  ( 5 \\) else \\( (g\\ true) \\)，我们推导出以下需要满足的约束集：\n\n- \\( f \\) 的类型 \\( \\tau_f\
  \ \\) 是函数类型：\\( \\tau_f = \\alpha \\rightarrow \\beta \\)；\n- \\( f \\) 的参数是整数：\\\
  ( \\alpha = \\text{int} \\)；\n- 由于 \\( f \\) 的结果用作条件，因此它是布尔值：\\( \\beta = \\text{bool}\
  \ \\)；\n- \\( g \\) 的类型 \\( \\tau_g \\) 是函数类型：\\( \\tau_g = \\gamma \\rightarrow\
  \ \\delta \\)；\n- \\( g \\) 的参数是布尔值：\\( \\gamma = \\text{bool} \\)；\n- \\( g \\\
  ) 的结果与表达式 5 具有相同的类型，即它是整数：\\( \\delta = \\text{int} \\)。\n\n如果所有这些等式约束可以同时被满足，那么该表达式就是类型正确的。在这里，如果取\
  \ \\( \\alpha = \\text{int} \\)、\\( \\beta = \\text{bool} \\)、\\( \\gamma = \\text{bool}\
  \ \\) 和 \\( \\delta = \\text{int} \\)，则成立。此时未受约束的变量是可泛化的（在某些条件下），并有助于建立类型的多态性。\n\
  \n证明约束 \\( \\tau_1 = \\tau_2 \\) 已被满足，需要能够将等号左边和/或右边的某些变量替换为类型，这些类型本身可能包含其自己的变量。换句话说，必须存在一个替换\
  \ \\( \\theta \\)，使得 \\( \\theta(\\tau_1) = \\theta(\\tau_2) \\)。确定是否存在这样的替换被称为类型一元化问题。如果存在这样的替换，则称\
  \ \\( \\tau_1 \\) 和 \\( \\tau_2 \\) 为 *可一元化的*，并称替换 \\( \\theta \\) 为术语 \\( \\tau_1\
  \ \\) 和 \\( \\tau_2 \\) 的 *一元子*。因此，如果两个术语的全部或部分变量可以被同一替换实例化，从而使它们在结构上相等，则它们是可一元化的。\n\
  \n由于一个表达式可能被赋予多种类型，因此可能存在多个替换来识别两个术语（这就是类型多重性的原因）。考虑两个术语 \\( \\tau_1 = \\alpha \\\
  rightarrow \\beta \\) 和 \\( \\tau_2 = \\alpha \\rightarrow \\text{bool} \\)。两个替换\
  \ \\( \\theta_1 = [\\alpha \\leftarrow \\text{int}; \\beta \\leftarrow \\text{bool}]\
  \ \\) 和 \\( \\theta_2 = [\\beta \\leftarrow \\text{bool}] \\) 是 \\( \\tau_1 \\)\
  \ 和 \\( \\tau_2 \\) 的一元子，因为 \\( \\theta_1(\\tau_1) = \\theta_1(\\tau_2) = \\text{int}\
  \ \\rightarrow \\text{bool} \\) 且 \\( \\theta_2(\\tau_1) = \\theta_2(\\tau_2) =\
  \ \\alpha \\rightarrow \\text{bool} \\)。\n\n\\(\\tau_1\\) 和 \\(\\tau_2\\) 的 _主一元子_（也常称为\
  \ _最一般一元子_）是一个替换 \\(\\mu\\)，使得对于任何其他一元子 \\(\\theta\\)，\\(\\theta(\\tau_1)\\) 是 \\\
  (\\mu(\\tau_1)\\) 的一个实例，即 \\(\\theta(\\tau_1)\\) 可以通过对 \\(\\mu(\\tau_1)\\) 应用替换\
  \ \\(\\theta'\\) 得到。这基本上相当于说主一元子 \\(\\mu\\) 是一个最小替换，因此所有其他一元子 \\(\\theta\\) 都包含此替换，并可写为\
  \ \\(\\theta = \\theta' \\circ \\mu\\)。在前一个示例中，\\(\\theta_2\\) 是主一元子，而 \\(\\theta_1\\\
  ) 不是。在这种情况下，有 \\(\\theta_1 = [\\alpha \\leftarrow \\text{int}] \\circ \\theta_2\\\
  )。\n\n两种类型 \\(\\tau_1\\) 和 \\(\\tau_2\\) 的主一元子是通过求解方程组 \\(\\{\\tau_1 = \\tau_2\\\
  }\\) 计算得出的。第 5.4.2 节介绍的一元化算法 Mgu 可用于求解此类方程组。它以类型之间的等式集 \\(Q\\)（称为 _约束_）作为参数。系统 \\\
  (Q\\) 的解（当存在时）是一个替换 \\(\\theta\\)，使得对 \\(Q\\) 中的每个方程 \\(\\tau_1 = \\tau_2\\)，都有\
  \ \\(\\theta(\\tau_1) = \\theta(\\tau_2)\\)。该算法是递归的，并计算系统 \\(Q\\) 的最一般一元子。系统 \\\
  (Q[\\alpha \\leftarrow \\tau]\\) 表示系统 \\(Q\\)，其中在每个方程中 \\(\\alpha\\) 被 \\(\\tau\\\
  ) 替换。如果没有列出的情况适用，则操作失败，触发类型推断过程的失败。值得注意的是，如果等式的一边是变量，则另一边不能是包含该变量的类型（除非它本身是变量）。此约束对于避免对形式\
  \ Mgu (\\(\\{\\alpha = \\text{int} \\to \\alpha\\}\\)) 的问题进行无限循环是必需的，此类问题不存在有限大小的类型来求解该方程。如果\
  \ \\(\\alpha = \\text{int} \\to \\alpha\\)，则有 \\(\\alpha = \\text{int} \\to \\text{int}\
  \ \\to \\alpha\\)、\\(\\alpha = \\text{int} \\to \\text{int} \\to \\text{int} \\\
  to \\alpha$，以此类推。\n\n```\nMgu (∅) = id\nMgu ({α = α} ∪ Q) = Mgu (Q)\nMgu ({α = τ}\
  \ ∪ Q) = Mgu (Q[α ← τ]) ◦ [α ← τ] if α ∉ F(τ)\nMgu ({τ = α} ∪ Q) = Mgu (Q[α ← τ])\
  \ ◦ [α ← τ] if α ∉ F(τ)\nMgu ({int = int} ∪ Q) = Mgu (Q)\nMgu ({bool = bool} ∪ Q)\
  \ = Mgu (Q)\nMgu ({τ₁ → τ'₁ = τ₂ → τ'₂} ∪ Q) = Mgu ({τ₁ = τ₂; τ'₁ = τ'₂} ∪ Q)\n\
  ```\n\n### 方框 5.2. Exp\\(_2\\) 的类型一元化算法\n\n### 示例 5.3.- 让我们计算 \\(\\tau_1 = \\alpha_1\
  \ \\to (\\alpha_2 \\to \\text{int})\\) 和 \\(\\tau_2 = \\text{int} \\to (\\alpha_3\
  \ \\to \\alpha_1)\\) 的主一元子。\n\nMgu ({\\alpha_1 \\to (\\alpha_2 \\to \\text{int})\
  \ = \\text{int} \\to (\\alpha_3 \\to \\alpha_1)})\n= Mgu ({\\alpha_1 = \\text{int};\
  \ \\alpha_2 \\to \\text{int} = \\alpha_3 \\to \\alpha_1})\n= Mgu ({\\alpha_2 \\\
  to \\text{int} = \\alpha_3 \\to \\text{int}}) \\circ [\\alpha_1 \\leftarrow \\text{int}]\n\
  = Mgu ({\\alpha_2 = \\alpha_3; \\text{int} = \\text{int}}) \\circ [\\alpha_1 \\\
  leftarrow \\text{int}]\n= Mgu ({\\text{int} = \\text{int}}) \\circ [\\alpha_2 \\\
  leftarrow \\alpha_3] \\circ [\\alpha_1 \\leftarrow \\text{int}]\n= Mgu (\\emptyset)\
  \ \\circ [\\alpha_2 \\leftarrow \\alpha_3] \\circ [\\alpha_1 \\leftarrow \\text{int}]\n\
  = \\text{id} \\circ [\\alpha_2 \\leftarrow \\alpha_3] \\circ [\\alpha_1 \\leftarrow\
  \ \\text{int}]\n= [\\alpha_2 \\leftarrow \\alpha_3; \\alpha_1 \\leftarrow \\text{int}]\
  \ = \\theta\n\n\n我们可以验证 \\(\\theta(\\tau_1) = \\theta(\\tau_2) = \\text{int} \\\
  to (\\alpha_2 \\to \\text{int})\\)。\n\n```OCaml\nexception Cycle\nexception Incompatible_tys\
  \ of (type_t * type_t)\n\nlet rec occur_check v_name = function\n  | T_int | T_bool\
  \ -> false\n  | T_fun (t1, t2) -> (occur_check v_name t1) || (occur_check v_name\
  \ t2)\n  | T_var n -> v_name = n\n\nval occur_check : var_name -> type_t -> bool\n\
  ```\n\n```OCaml\nlet rec unify t1 t2 =\n  match (t1, t2) with\n  | (T_int, T_int)\
  \ | (T_bool, T_bool) -> empty_subst\n  | (T_fun (a, b), T_fun (c, d)) ->\n    let\
  \ subst_left = unify a c in\n    let b_subst = apply b subst_left in\n    let d_subst\
  \ = apply d subst_left in\n    compose (unify b_subst d_subst) subst_left\n  | (T_var\
  \ v, other) | (other, T_var v) ->\n    if occur_check v other then raise Cycle ;\n\
  \    singleton v other\n  | _ -> raise (Incompatible_tys (t1, t2))\n\nval unify\
  \ : type_t -> type_t -> subst_t\n```\n\n```Python\nclass Cycle (Exception) :\n \
  \   pass\n\nclass Incompatible_tys (Exception) :\n    def __init__ (self, ty1, ty2)\
  \ :\n        self.ty1 = ty1\n        self.ty2 = ty2\n\ndef occur_check (v_name,\
  \ ty) :\n    if isinstance (ty, T_int) or isinstance (ty, T_bool) : return False\n\
  \    elif isinstance (ty, T_fun) :\n        return occur_check (v_name, ty.t1) or\
  \ occur_check (v_name, ty.t2)\n    elif isinstance (ty, T_var) : return ty.vname\
  \ == v_name\n    else : raise ValueError\n```\n\n```Python\ndef unify (ty1, ty2)\
  \ :\n    if (isinstance (ty1, T_int) and isinstance (ty2, T_int)) or\\\n       (isinstance\
  \ (ty1, T_bool) and isinstance (ty2, T_bool)) :\n        return empty_subst\n  \
  \  elif isinstance (ty1, T_fun) and isinstance (ty2, T_fun) :\n        a, b, c,\
  \ d = ty1.t1, ty1.t2, ty2.t1, ty2.t2\n        subst_left = unify (a, c)\n      \
  \  b_subst = apply (b, subst_left)\n        d_subst = apply (d, subst_left)\n  \
  \      return compose (unify (b_subst, d_subst), subst_left)\n    elif isinstance\
  \ (ty1, T_var) or isinstance (ty2, T_var) :\n        (other, v) = (ty1, ty2.vname)\
  \ if isinstance (ty2, T_var) \\\n        else (ty2, ty1.vname)\n        if occur_check\
  \ (v, other) : raise Cycle\n        return singleton (v, other)\n    else : raise\
  \ Incompatible_tys (ty1, ty2)\n```\n\n验证“如果 \\(\\alpha \\notin \\mathcal{F}(\\tau)\\\
  )”是通过函数 `occur_check` 进行的，该函数检查变量是否出现在类型中。正如我们从规则中所见，该函数用于变量必须与类型统一的两种情况。\n\n函数\
  \ unify 通过两种类型的结构工作，在基本类型的情况下验证相等性，对函数类型进行递归调用，并在两种类型中有一个是变量的情况下扩展替换结果。\n\n异常 `Incompatible_tys`\
  \ 有两个参数：引发统一冲突的两种类型。这种可能性有助于创建错误消息，向用户提供有关问题性质的更多细节。出于效率考虑，此处给出的实现不是对一组约束进行操作，而仅对要统一的两种类型进行操作。\n\
  \n现在可以使用示例 5.3 测试统一函数 `unify`，使用 Python 语法定义此示例中的两种类型。\n\n```Python\nType1 = T_fun\
  \ ((T_var (\"t1\")), (T_fun ((T_var (\"t2\")), (T_int )))))\ntype2 = T_fun ((T_int\
  \ )), (T_fun ((T_var (\"t3\")), (T_var (\"t1\"))))))\nmgu = unify (type1, type2)\n\
  print_subst (mgu)\n[('t1', <type.T_int object at 0x10cb29290>),\n ('t3', <type.T_var\
  \ object at 0x10cb29150>)]\n(t1 <- T_int); (t3 <- T_var (t2))\n```\n\n使用通用函数 `print`\
  \ 显示替换并不能揭示替换本身的完整结构。使用用于显示类型和替换的函数（`print_subst`，未包含在此实现中），我们看到实现返回的结果与我们理论计算的结果相符。不过请注意，实现返回的替换中，\\\
  (\\alpha_3\\) 被替换为 \\(\\alpha_2\\)；而在我们的示例中我们计算的是相反的情况，尽管两者都正确。这种差异是因为实现将两个不相交的情况\
  \ \\(\\mathsf{Mgu} \\left( \\{ \\alpha = \\tau \\} \\cup Q \\right)\\) 和 \\(\\mathsf{Mgu}\
  \ \\left( \\{ \\tau = \\alpha \\} \\cup Q \\right)\\) 合并为单一情况处理（在某些情况下会导致定义域和陪域变量的反转）。\n\
  \n使用类型统一算法，我们现在可以介绍用于计算任何表达式类型的推理算法。\n\n#### 5.4.3. 类型推理算法\n\n##### 5.4.3.1. 类型方案的实例化\n\
  \n定义 5.7. – 类型方案的新鲜实例。我们定义函数 Inst (σ)，它返回类型方案 σ 的一个实例，其中广义化类型变量 αᵢ 被新鲜变量 α'ᵢ 替换，即在当前类型环境中没有自由出现的变量。\n\
  \nInst (∀α₁, ..., αₙ.τ) = τ[α₁ ← α'₁, ..., αₙ ← α'ₙ]\n\n为“新鲜变量”概念赋予正式含义意味着在整个形式化中包含无限可计数变量集合的存在，并跟踪\
  \ 5.4.3 节所介绍推理算法中每条规则的假设和结论中使用的变量集合。为简单起见，我们将在记法中省略此技术细节。\n\n```OCaml\nlet specialize\
  \ (vars, body) =\n  let fresh_assoc =\n    List.map\n    (fun var -> let fresh_var\
  \ = new_ty_var () in (var, fresh_var)) vars in\n  let rec copy ty =\n    match ty\
  \ with\n    | T_int | T_bool -> ty\n    | T_fun (t1, t2) ->\n        let t1_copied\
  \ = copy t1 in\n        let t2_copied = copy t2 in\n        T_fun (t1_copied, t2_copied)\n\
  \    | T_var v_name ->\n        (try List.assoc v_name fresh_assoc with Not_found\
  \ -> ty) in\n  copy body\n\nval specialize : (var_name_t list * type_t) -> type_t\n\
  ```\n\n```Python\nclass Not_found (Exception) :\n    pass\n\ndef list_assoc (key,\
  \ l) :\n    for (k, v) in l :\n        if k == key : return v\n    raise Not_found\n\
  \ndef specialize (sch) :\n    (vars, body) = sch\n    fresh_assoc = list (map (lambda\
  \ var : (var, new_ty_var ()), vars))\n    def copy (ty) :\n        if isinstance\
  \ (ty, T_int) or isinstance (ty, T_bool) : return ty\n        elif isinstance (ty,\
  \ T_fun) :\n            t1_copied = copy (ty.t1)\n            t2_copied = copy (ty.t2)\n\
  \            return T_fun (t1_copied, t2_copied)\n        elif isinstance (ty, T_var)\
  \ :\n            try :\n                return list_assoc (ty.vname, fresh_assoc)\n\
  \            except Not_found : return ty\n            else : raise ValueError\n\
  \    return copy ( body)\n```\n\n函数 specialize 用于获取类型方案的一个实例，它创建一个关联列表，将方案中的每个广义化变量绑定到一个新鲜变量。随后，它沿着递归路径，复制方案体的结构，并将每个广义化变量替换为其对应的新鲜版本（否则，保留非广义化变量）。OCaml\
  \ 实现使用标准库中的函数 List.assoc，该函数在关联列表中搜索与键关联的值，如果找不到，则引发异常 Not_found。此函数在 Python 中不存在，因此我们将其定义为\
  \ list_assoc。\n\n由于环境包含类型方案，我们还需要能够将替换应用于方案和环境。\n\n定义 5.8. – 应用于类型方案的替换：取一个类型方案\
  \ \\(\\sigma = \\forall \\alpha_1 \\dots . \\alpha_n . \\tau\\) 和一个替换 \\(\\theta\\\
  )，使得：\n\n\\((dom(\\theta) \\cup \\mathcal{F}(\\theta(\\tau))) \\cap \\{ \\alpha_1,\
  \ \\dots , \\alpha_n \\} = \\emptyset\\)\n\n我们定义 \\(\\theta(\\sigma) = \\forall\
  \ \\alpha_1 \\dots . \\alpha_n . \\theta(\\tau)\\)。\n\n此定义显著禁止替换类型方案的广义化变量。在以下实现中，我们不验证替换的定义域和陪域中的变量是否出现在方案中。这一选择对推理算法的正确性没有影响，该算法仅在类型之间建立相等约束。此处的类型永远不包含广义化变量，因为它们由实例化操作产生，该操作用新鲜变量替换广义化变量。因此，构建的替换永远不会包含广义化变量。\n\
  \n注意.– 将替换 \\(\\theta\\) 应用于类型方案 \\(\\sigma\\) 的更一般定义是可能的，无需对 \\(\\sigma\\) 和 \\\
  (\\theta\\) 作出任何假设。这是通过用既不在 \\(\\theta\\) 的定义域中也不在 \\(\\theta(\\tau)\\) 中的变量重命名\
  \ \\(\\sigma\\) 的广义化变量 \\(\\alpha_1 \\dots . \\alpha_n\\) 来实现的。\n\n将替换应用于环境归根结底是创建一个环境，其中绑定所涉及的方案的主体已被替换所转换。\n\
  \n\n\n\n```\nOCaml\nlet subst_env subst env =\n  List.map\n    (fun (name, (vars,\
  \ body)) ->\n       let body' = apply body subst in\n       let sch' = (vars, body')\
  \ in\n       (name, sch'))\n    env\nval subst_env :\n  subst_t -> ('a * ('b * type_t))\
  \ list -> ('a * ('b * type_t)) list\n```\n\n```\nPython\ndef subst_env (subst, env)\
  \ :\n  def do_binding (binding) :\n    (name, sch) = binding\n    (vars, body) =\
  \ sch\n    body_new = apply (body, subst)\n    sch_new = (vars, body_new)\n    return\
  \ (name, sch_new)\n```\n\n##### 5.4.3.2. 替换的组合\n\n推理算法通过递归处理表达式，确定等式约束。每一步，它构造一个替换和一个类型。类型是当前表达式的类型，替换记忆为获得该类型而必须满足的等式约束。为每个子表达式构造的替换必须组合。两个替换的组合定义如下。\n\
  \n组合两个替换 \\(\\theta_1\\) 和 \\(\\theta_2\\)，由列表表示\n\\[\\theta_1 = [(\\alpha_1, \\\
  tau_1), \\cdots, (\\alpha_n, \\tau_n)] \\quad \\theta_2 = [(\\beta_1, \\tau'_1),\
  \ \\cdots, (\\beta_k, \\tau'_k)]\\)\n\n归结为计算替换 \\(\\theta_1 \\circ \\theta_2\\)，使得\
  \ \\(\\theta_1 \\circ \\theta_2(x) = \\theta_1(\\theta_2(x))\\)。因此，我们将 \\(\\theta_1\\\
  ) 应用于 \\(\\theta_2\\) 中包含的所有类型；替换 \\(\\theta_1\\) 中仅保留那些变量不在 \\(\\theta_2\\) 的定义域中的绑定。替换\
  \ \\(\\theta_1 \\circ \\theta_2\\) 因此由列表表示：\n\n\\[[(\\beta_1, \\theta_1(\\tau'_1)),\
  \ \\cdots, (\\beta_k, \\theta_1(\\tau'_k)), (\\alpha_1, \\tau_1), \\cdots, (\\alpha_n,\
  \ \\tau_n)]\\)\n\n从中消去了所有满足 \\(\\beta_i = \\theta_1(\\tau'_i)\\) 的对 \\((\\beta_i,\
  \ \\theta_1(\\tau'_i))\\)（因为在这种情况下，\\(\\beta_i\\) 不再属于 \\(\\theta_1 \\circ \\theta_2\\\
  ) 的定义域）以及所有满足 \\(\\alpha_i \\in \\{\\beta_1, \\cdots, \\beta_k\\}\\) 的对 \\((\\alpha_i,\
  \ \\tau_i)\\)（这些对不再有用，因为替换 \\(\\theta_2\\) 在替换 \\(\\theta_1\\) 之前应用）。\n\n示例 5.4.–\
  \ 给定两个替换：\n\n\\(\\theta_1 = [(\\alpha_1, \\tau_1), (\\alpha_2, \\alpha_4)] \\text{\
  \ and } \\theta_2 = [(\\alpha_3, \\alpha_1 \\rightarrow \\tau_2), (\\alpha_1, \\\
  tau_3), (\\alpha_4, \\alpha_2)]\\)\n\n组合 $\\theta_1 \\circ \\theta_2$ 是替换：\n\n$\\\
  theta_1 \\circ \\theta_2 = [(\\alpha_1, \\tau_3), (\\alpha_3, \\tau_1 \\rightarrow\
  \ \\tau_2), (\\alpha_2, \\alpha_4)]$\n\n在这种情况下，来自 \\(\\theta_1\\) 的绑定 \\((\\alpha_1,\
  \ \\tau_1)\\) 不被保留，因为 \\(\\alpha_1\\) 属于 \\(\\theta_2\\) 的定义域；绑定 \\((\\alpha_4,\
  \ \\theta_1(\\alpha_2))\\) 不被保留，因为 \\(\\alpha_4 = \\theta_1(\\alpha_2)\\)。\n\n```\n\
  OCaml\nlet compose subst1 subst2 =\n  let subst_1_2 =\n    (List.map (fun (name,\
  \ ty) -> (name, apply ty subst1)) subst2) @\n    (List.filter (fun (name, _) ->\
  \ not (List.mem_assoc name subst2)) subst1) in\n  List.filter\n    (fun (name, ty)\
  \ ->\n      match ty with Types.T_var name -> name <> name' | _ -> true)\n    subst_1_2\n\
  val compose : subst_t -> subst_t -> subst_t\n```\n\n```\nPython\ndef list_mem_assoc\
  \ (key, l) :\n    for (k, v) in l :\n        if k == key : return True\n    return\
  \ False\n\ndef compose (subst1, subst2) :\n    def subst1_on_binding (binding) :\n\
  \        (name, ty) = binding\n        return (name, apply (ty, subst1))\n    def\
  \ filter_not_in_subst2 (binding) :\n        (name, _) = binding\n        return\
  \ not (utils.list_mem_assoc (name, subst2))\n    def filter_not_identity (binding)\
  \ :\n        (name, ty) = binding\n        if isinstance (ty, T_var) : return name\
  \ != ty.vname\n        return True\n    part1 = list (map (subst1_on_binding, subst2))\n\
  \    part2 = list (filter (filter_not_in_subst2, subst1))\n    return list (filter\
  \ (filter_not_identity, part1 + part2))\n```\n\n该实现使用标准 OCaml 库中的函数 List.mem_assoc。该函数的参数是一个键和一个关联列表，它返回一个布尔值，指示该键是否出现在关联列表的定义域中。此函数在\
  \ Python 中不存在，因此我们将其命名为 list_mem_assoc 来定义。\n\n##### 5.4.3.3. 类型推断\n\n为了限制推理规则的数量，我们选择将一元和二元运算符的应用视为函数一般应用的特殊情况。通常（且无损失一般性），运算符的类型位于任何程序的初始环境中。运算符的名称与程序员声明的标识符的名称起完全相同的作用。在框\
  \ 5.3 中呈现的规则中，id 表示恒等替换。\n\n示例 5.5.- 用于推断表达式 $e$ 类型的树，定义如下：\n\n```\nlet f = fun\

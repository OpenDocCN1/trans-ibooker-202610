  )。取 \\(\\text{Mem} \\in M_{\\text{Env}}\\)。根据归纳假设，我们有 \\(\\forall \\text{Mem}' \\\
  prec_{\\text{Env}} \\text{Mem}, P_{\\text{Env}}(\\text{Mem}')\\)，并且必须证明性质 \\(P_{\\\

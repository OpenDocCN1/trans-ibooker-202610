  ]\n\n那么规则 $S_1$ 得出 $\\langle x := e, \\text{Mem}_1 \\rangle \\mapsto_{\\text{Env}}\
  \ \\langle \\text{skip}, \\text{Mem}[r := v] \\rangle$，且由于 $\\langle \\text{skip},\
  \ \\text{Mem}[r := v] \\rangle$ 是一个终止配置，我们得出：\n\n\\[\\langle x := e, \\text{Mem}_1\
  \ \\rangle \\mapsto^*_{\\text{Env}} \\text{Mem}[r := v]\\]\n\n如果 $\\langle \\text{Mem}_1,\
  \ c \\rangle \\mapsto_{\\text{Env}} \\text{Mem}_2$ 是通过规则 $C_2$ 得到的，那么 $c$ 是指令 skip\
  \ 且 $\\text{Mem}_1 = \\text{Mem}_2$，并且由于 $\\langle \\text{skip}, \\text{Mem}_2 \\\
  rangle$ 是一个终止配置，通过考虑长度为零的序列，我们得出：\n\n\\[\\langle \\text{skip}, \\text{Mem}_1 \\\
  rangle \\mapsto^*_{\\text{Env}} \\text{Mem}_2\\]\n\n如果 $\\langle \\text{Mem}_1,\
  \ c \\rangle \\mapsto_{\\text{Env}} \\text{Mem}_2$ 是通过规则 $C_3$ 得到的：\n\n\\[(C_3)\
  \ \\frac{\\begin{array}{c} (C_i) \\vdots \\\\ \\langle \\text{Mem}_1, c_1 \\rangle\
  \ \\mapsto_{\\text{Env}} \\text{Mem} \\end{array} \\quad \\begin{array}{c} (C_j)\
  \ \\vdots \\\\ \\langle \\text{Mem}, c_2 \\rangle \\mapsto_{\\text{Env}} \\text{Mem}_2\
  \ \\end{array}}{\\langle \\text{Mem}_1, c_1 ; c_2 \\rangle \\mapsto_{\\text{Env}}\
  \ \\text{Mem}_2}\\]\n\n根据归纳假设，我们有 $\\langle c_1, \\text{Mem}_1 \\rangle \\mapsto^*_{\\\
  text{Env}} \\text{Mem}$ 和 $\\langle c_2, \\text{Mem} \\rangle \\mapsto^*_{\\text{Env}}\
  \ \\text{Mem}_2$。因此，我们有两个转移序列：\n\n\\[\\langle c_1, \\text{Mem}_1 \\rangle \\mapsto_{\\\
  text{Env}} \\cdots \\mapsto_{\\text{Env}} \\langle \\text{skip}, \\text{Mem} \\\
  rangle\\] [4.4]\n\n\\[\\langle c_2, \\text{Mem} \\rangle \\mapsto_{\\text{Env}}\
  \ \\cdots \\mapsto_{\\text{Env}} \\langle \\text{skip}, \\text{Mem}_2 \\rangle\\\
  ] [4.5]\n\n将规则 $S_2$ 应用于序列 [4.4] 中的每个转移，我们可以构建以下序列：\n\n\\[\\langle c_1 ; c_2, \\\
  text{Mem}_1 \\rangle \\mapsto_{\\text{Env}} \\cdots \\mapsto_{\\text{Env}} \\langle\
  \ \\text{skip} ; c_2, \\text{Mem} \\rangle\\] [4.6]\n\n并且由于规则 $S_3$ 允许我们构建转移：\n\n\
  \\[\\langle \\text{skip} ; c_2, \\text{Mem} \\rangle \\mapsto_{\\text{Env}} \\langle\
  \ c_2, \\text{Mem} \\rangle\\] [4.7]\n\n通过连接 [4.6]、[4.7] 和 [4.5]，我们得到以下序列：\n\n\\\
  [\\langle c_1 ; c_2, \\text{Mem}_1 \\rangle \\mapsto_{\\text{Env}} \\cdots \\mapsto_{\\\
  text{Env}} \\langle \\text{skip}, \\text{Mem}_2 \\rangle\\]\n\n从而 $\\langle c_1\
  \ ; c_2, \\text{Mem}_1 \\rangle \\mapsto^*_{\\text{Env}} \\text{Mem}_2$。\n\n- 如果\
  \ $\\langle \\text{Mem}_1, c \\rangle \\mapsto_{\\text{Env}} \\text{Mem}_2$ 是通过规则\
  \ $C_4$ 得到的：\n\n\\[(C_4) \\frac{\\llbracket e \\rrbracket^{\\text{Mem}_1}_{\\text{Env}}\
  \ = (\\text{true}, \\text{Mem}) \\quad \\begin{array}{c} (C_i) \\vdots \\\\ \\langle\
  \ \\text{Mem}, c_1 \\rangle \\mapsto_{\\text{Env}} \\text{Mem}_2 \\end{array}}{\\\
  langle \\text{Mem}_1, \\text{if } e \\text{ then } c_1 \\text{ else } c_2 \\rangle\
  \ \\mapsto_{\\text{Env}} \\text{Mem}_2}\\]\n\n那么，根据归纳假设，我们有 $\\langle c_1, \\text{Mem}_1\
  \ \\rangle \\mapsto^*_{\\text{Env}} \\text{Mem}$ 并且存在一个转移序列：\n\n\\[\\langle c_1,\
  \ \\text{Mem}_1 \\rangle \\mapsto_{\\text{Env}} \\cdots \\mapsto_{\\text{Env}} \\\
  langle \\text{skip}, \\text{Mem} \\rangle\\]\n\n由此，通过应用规则 $S_4$，我们可以得到：\n\n\\[\\\
  langle \\text{if } e \\text{ then } c_1 \\text{ else } c_2, \\text{Mem}_1 \\rangle\
  \ \\mapsto_{\\text{Env}} \\langle c_1, \\text{Mem}_1 \\rangle \\mapsto_{\\text{Env}}\
  \ \\cdots \\mapsto_{\\text{Env}} \\langle \\text{skip}, \\text{Mem} \\rangle\\]\n\
  \n这给出了 $\\langle \\text{if } e \\text{ then } c_1 \\text{ else } c_2, \\text{Mem}_1\
  \ \\rangle \\mapsto^*_{\\text{Env}} \\text{Mem}_2$。\n\n- 如果 $\\langle \\text{Mem}_1,\
  \ c \\rangle \\mapsto_{\\text{Env}} \\text{Mem}_2$ 是通过规则 $C_5$ 得到的，推理过程与前一种情况类似。\n\
  \n- 如果 $\\langle \\text{Mem}_1, c \\rangle \\mapsto_{\\text{Env}} \\text{Mem}_2$\
  \ 是通过规则 $C_6$ 得到的：\n\n\\[(C_6) \\frac{\\begin{array}{c} \\llbracket e \\rrbracket^{\\\
  text{Mem}_1}_{\\text{Env}} = (\\text{true}, \\text{Mem}) \\\\ \\begin{array}{c}\
  \ (C_i) \\vdots \\\\ \\langle \\text{Mem}, c_0 \\rangle \\mapsto_{\\text{Env}} \\\
  text{Mem}' \\end{array} \\qquad \\begin{array}{c} (C_j) \\vdots \\\\ \\langle \\\
  text{Mem}', \\text{while } e \\text{ do } c_0 \\rangle \\mapsto_{\\text{Env}} \\\
  text{Mem}_2 \\end{array} \\end{array}}{\\langle \\text{Mem}_1, \\text{while } e\
  \ \\text{ do } c_0 \\rangle \\mapsto_{\\text{Env}} \\text{Mem}_2}\\]\n\n那么，根据归纳假设，我们得到\
  \ $\\langle c_0, \\text{Mem} \\rangle \\mapsto^*_{\\text{Env}} \\text{Mem}'$ 和 $\\\
  langle \\text{while } e \\text{ do } c_0, \\text{Mem}' \\rangle \\mapsto^*_{\\text{Env}}\
  \ \\text{Mem}_2$，因此我们有两个转移序列：\n\n\\[\\langle c_0, \\text{Mem} \\rangle \\mapsto_{\\\
  text{Env}} \\cdots \\mapsto_{\\text{Env}} \\langle \\text{skip}, \\text{Mem}' \\\
  rangle\\] [4.8]\n\n\\[\\langle \\text{while } e \\text{ do } c_0, \\text{Mem}' \\\
  rangle \\mapsto_{\\text{Env}} \\cdots \\mapsto_{\\text{Env}} \\langle \\text{skip},\
  \ \\text{Mem}_2 \\rangle\\] [4.9]\n\n将规则 $S_2$ 应用于序列 [4.8] 中的每个转移，可以构建以下序列：\n\n\\\
  [\\langle c_0 ; \\text{while } e \\text{ do } c_0, \\text{Mem} \\rangle \\mapsto_{\\\
  text{Env}} \\cdots \\mapsto_{\\text{Env}} \\langle \\text{skip} ; \\text{while }\
  \ e \\text{ do } c_0, \\text{Mem}' \\rangle\\] [4.10]\n\n并且由于规则 $S_3$ 和 $S_6$ 允许我们构建转移：\n\
  \n\\[\\langle \\text{skip} ; \\text{while } e \\text{ do } c_0, \\text{Mem}' \\\
  rangle \\mapsto_{\\text{Env}} \\langle \\text{while } e \\text{ do } c_0, \\text{Mem}'\
  \ \\rangle\\] [4.11]\n\n\\[\\langle \\text{while } e \\text{ do } c_0, \\text{Mem}_1\
  \ \\rangle \\mapsto_{\\text{Env}} \\langle c_0 ; \\text{while } e \\text{ do } c_0,\
  \ \\text{Mem} \\rangle\\] [4.12]\n\n通过连接 [4.12]、[4.10]、[4.11] 和 [4.9]，我们得到以下序列：\n\
  \n\\[\\langle \\text{while } e \\text{ do } c_0, \\text{Mem}_1 \\rangle \\mapsto_{\\\
  text{Env}} \\cdots \\mapsto_{\\text{Env}} \\langle \\text{skip}, \\text{Mem}_2 \\\
  rangle\\]\n\n因此 $\\langle \\text{while } e \\text{ do } c_0, \\text{Mem}_1 \\rangle\
  \ \\mapsto^*_{\\text{Env}} \\text{Mem}_2$。\n\n- 如果 $\\langle \\text{Mem}_1, c \\\
  rangle \\mapsto_{\\text{Env}} \\text{Mem}_2$ 是通过规则 $C_7$ 得到的，那么 $c$ 是指令 while $e$\
  \ do $c_0$ 且 $\\llbracket e \\rrbracket^{\\text{Mem}_1}_{\\text{Env}} = (\\text{false},\
  \ \\text{Mem}_2)$。规则 $S_7$ 给出转移 $\\langle \\text{while } e \\text{ do } c, \\text{Mem}_1\
  \ \\rangle \\mapsto_{\\text{Env}} \\langle \\text{skip}, \\text{Mem}_2 \\rangle$，且由于\
  \ $\\langle \\text{skip}, \\text{Mem}_2 \\rangle$ 是一个终止配置，我们得到 $\\langle \\text{while\
  \ } e \\text{ do } c_0, \\text{Mem}_1 \\rangle \\mapsto^*_{\\text{Env}} \\text{Mem}_2$。\n\
  \n(<=) 由于根据假设 $\\langle c, \\text{Mem}_1 \\rangle \\mapsto^*_{\\text{Env}} \\text{Mem}_2$，存在一个长度为\
  \ \\(k\\) 的转移序列：\n\n\\[\\langle c, \\text{Mem}_1 \\rangle \\mapsto_{\\text{Env}}\
  \ \\langle c'_1, \\text{Mem}'_1 \\rangle \\mapsto_{\\text{Env}} \\cdots \\mapsto_{\\\
  text{Env}} \\langle c'_k, \\text{Mem}'_k \\rangle = \\langle \\text{skip}, \\text{Mem}_2\
  \ \\rangle\\]\n\n证明通过对 \\(k\\) 进行 well-founded 归纳，然后针对该序列中的第一个转移进行分类讨论获得。如果 \\(k\
  \ = 0\\)，则初始配置为终止配置，$\\text{Mem}_1 = \\text{Mem}_2$ 且规则 $C_2$ 允许我们得出结论。否则，存在多种可能的情况。\n\
  \n- 如果第一个转移是 $\\langle x := e, \\text{Mem}_1 \\rangle \\mapsto_{\\text{Env}} \\\
  langle \\text{skip}, \\text{Mem}[r := v] \\rangle$（通过规则 $S_1$ 得到），那么 $k = 1$ 因为\
  \ $\\langle \\text{skip}, \\text{Mem}[r := v] \\rangle$ 是一个终止配置，并且使用规则 $C_1$ 我们得到：\n\
  \n\\[\\langle \\text{Mem}_1, x := e \\rangle \\mapsto_{\\text{Env}} \\text{Mem}[r\
  \ := v]\\]\n\n- 如果第一个转移是通过规则 $S_2$ 得到的：\n\n\\[\\langle c_1 ; c_2, \\text{Mem}_1\
  \ \\rangle \\mapsto_{\\text{Env}} \\underbrace{\\langle c''_1 ; c_2, \\text{Mem}'_1\
  \ \\rangle}_{c'_1} \\mapsto_{\\text{Env}} \\cdots \\mapsto_{\\text{Env}} \\underbrace{\\\
  langle c'_k, \\text{Mem}'_k \\rangle}_{= (\\text{skip}, \\text{Mem}_2)}\\]\n\n其中\
  \ $\\langle c_1, \\text{Mem}_1 \\rangle \\mapsto_{\\text{Env}} \\langle c''_1, \\\
  text{Mem}'_1 \\rangle$，那么，根据引理 4.1，存在两个整数 $k_1$ 和 $k_2$ 使得 $\\langle c_1, \\text{Mem}_1\
  \ \\rangle \\mapsto^{k_1}_{\\text{Env}} \\text{Mem}'$ 和 $\\langle c_2, \\text{Mem}'\
  \ \\rangle \\mapsto^{k_2}_{\\text{Env}} \\text{Mem}_2$ 且 $k_1 + k_2 + 1 = k$。因此\
  \ $k_1 < k$ 且 $k_2 < k$ 并且，根据归纳假设，我们得到 $\\langle \\text{Mem}_1, c_1 \\rangle \\\
  mapsto_{\\text{Env}} \\text{Mem}'$ 和 $\\langle \\text{Mem}', c_2 \\rangle \\mapsto_{\\\
  text{Env}} \\text{Mem}_2$ 并可以通过构建以下树来得出结论：\n\n\\[\\begin{array}{c} (C_i) \\frac{\\\
  vdots}{\\langle \\text{Mem}_1, c_1 \\rangle \\mapsto_{\\text{Env}} \\text{Mem}'}\
  \ \\qquad \\qquad (C_j) \\frac{\\vdots}{\\langle \\text{Mem}', c_2 \\rangle \\mapsto_{\\\
  text{Env}} \\text{Mem}_2} \\\\ (C_3) \\frac{ }{\\langle \\text{Mem}_1, c_1 ; c_2\
  \ \\rangle \\mapsto_{\\text{Env}} \\text{Mem}_2} \\end{array}\\]\n\n- 如果第一个转移是通过规则\
  \ $S_3$ 得到的：\n\n\\[\\langle \\text{skip} ; c'_1, \\text{Mem}_1 \\rangle \\mapsto_{\\\
  text{Env}} \\langle c'_1, \\text{Mem}'_1 \\rangle \\mapsto_{\\text{Env}} \\cdots\
  \ \\mapsto_{\\text{Env}} \\underbrace{\\langle c'_k, \\text{Mem}'_k \\rangle}_{=\
  \ (\\text{skip}, \\text{Mem}_2)}\\]\n\n其中 $\\text{Mem}_1 = \\text{Mem}'_1$，那么我们根据归纳假设得到\
  \ $\\langle \\text{Mem}_1, c'_1 \\rangle \\mapsto_{\\text{Env}} \\text{Mem}_2$ 并可以通过构建以下树来得出结论：\n\
  \n\\[\\begin{array}{c} (C_2) \\frac{\\vdots}{\\langle \\text{Mem}_1, \\text{skip}\
  \ \\rangle \\mapsto_{\\text{Env}} \\text{Mem}_1} \\qquad \\qquad (C_i) \\frac{\\\
  vdots}{\\langle \\text{Mem}_1, c'_1 \\rangle \\mapsto_{\\text{Env}} \\text{Mem}_2}\
  \ \\\\ (C_3) \\frac{ }{\\langle \\text{Mem}_1, \\text{skip} ; c'_1 \\rangle \\mapsto_{\\\
  text{Env}} \\text{Mem}_2} \\end{array}\\]\n\n- 如果第一个转移是通过规则 $S_4$ 得到的：\n\n\\[\\\
  langle \\text{if } e \\text{ then } c'_1 \\text{ else } c_2, \\text{Mem}_1 \\rangle\
  \ \\mapsto_{\\text{Env}} \\langle c'_1, \\text{Mem}'_1 \\rangle \\mapsto_{\\text{Env}}\
  \ \\cdots \\mapsto_{\\text{Env}} \\langle c'_k, \\text{Mem}'_k \\rangle = \\langle\
  \ \\text{skip}, \\text{Mem}_2 \\rangle\\]\n\n其中 $\\llbracket e \\rrbracket^{\\text{Mem}_1}_{\\\
  text{Env}} = (\\text{true}, \\text{Mem}'_1)$，那么 $\\langle \\text{Mem}_1, c'_1 \\\
  rangle \\mapsto^*_{\\text{Env}} \\text{Mem}_2$ 根据归纳假设，并且我们通过构建以下树来得出结论：\n\n\\[\\\
  llbracket e \\rrbracket^{\\text{Mem}_1}_{\\text{Env}} = (\\text{true}, \\text{Mem}'_1)\
  \ \\quad (C_i) \\frac{\\vdots}{\\langle \\text{Mem}_1, c'_1 \\rangle \\mapsto^*_{\\\
  text{Env}} \\text{Mem}_2}\\]\n\\[(C_4) \\frac{\\langle \\text{Mem}_1, \\text{if\
  \ } e \\text{ then } c'_1 \\text{ else } c_2 \\rangle \\mapsto_{\\text{Env}} \\\
  text{Mem}_2}{}\\]\n\n- 如果第一个转移是通过规则 $S_5$ 得到的，则使用类似推理。\n\n- 如果第一个转移是通过规则 $S_6$ 得到的：\n\
  \n\\[\\langle \\text{while } e \\text{ do } c_0, \\text{Mem}_1 \\rangle \\mapsto_{\\\
  text{Env}} \\langle c_0 ; \\text{while } e \\text{ do } c_0, \\text{Mem}'_1 \\rangle\
  \ \\mapsto_{\\text{Env}} \\cdots \\mapsto_{\\text{Env}} \\langle c'_k, \\text{Mem}'_k\
  \ \\rangle = \\langle \\text{skip}, \\text{Mem}_2 \\rangle\\]\n\n其中 $\\llbracket\
  \ e \\rrbracket^{\\text{Mem}_1}_{\\text{Env}} = (\\text{true}, \\text{Mem}'_1)$，那么\
  \ $\\langle \\text{Mem}_1, c'_1 \\rangle \\mapsto^*_{\\text{Env}} \\text{Mem}_2$\
  \ 根据归纳假设，并且我们可以构建以下树：\n\n\\[\\llbracket e \\rrbracket^{\\text{Mem}_1}_{\\text{Env}}\
  \ = (\\text{true}, \\text{Mem}'_1) \\quad (C_i) \\frac{\\vdots}{\\langle \\text{Mem}'_1,\
  \ c'_1 \\rangle \\mapsto_{\\text{Env}} \\text{Mem}_2}\\]\n\\[(C_4) \\frac{\\langle\
  \ \\text{Mem}_1, \\text{if } e \\text{ then } (c_0 ; \\text{while } e \\text{ do\
  \ } c_0) \\text{ else skip} \\rangle \\mapsto_{\\text{Env}} \\text{Mem}_2}{}\\]\n\
  \n并且由于我们可以证明（参见练习 4.1）：\n\n\\[\\text{while } e \\text{ do } c_0 \\equiv \\text{if\
  \ } e \\text{ then } (c_0 ; \\text{while } e \\text{ do } c_0) \\text{ else skip}\\\
  ]\n\n我们得到 $\\langle \\text{Mem}_1, \\text{while } e \\text{ do } c_0 \\rangle \\\
  mapsto_{\\text{Env}} \\text{Mem}_2$。\n\n- 如果第一个转移是通过规则 $S_7$ 得到的：\n\n\\[\\langle\
  \ \\text{while } e \\text{ do } c_0, \\text{Mem}_1 \\rangle \\mapsto_{\\text{Env}}\
  \ \\langle \\text{skip}, \\text{Mem}_2 \\rangle\\]\n\n其中 $\\llbracket e \\rrbracket^{\\\
  text{Mem}_1}_{\\text{Env}} = (\\text{false}, \\text{Mem}_2)$（因此 $k=1$），我们可以构建以下树：\n\
  \n\\[(C_7) \\frac{\\llbracket e \\rrbracket^{\\text{Mem}_1}_{\\text{Env}} = (\\\
  text{false}, \\text{Mem}_2)}{\\langle \\text{Mem}_1, \\text{while } e \\text{ do\
  \ } c_0 \\rangle \\mapsto_{\\text{Env}} \\text{Mem}_2}\\]\n\n\n\n\n\n### 4.6. 过程\n\
  \n过程用于构建程序的代码结构，隔离某些部分，并使其可从程序中的任何位置访问（通过过程调用指令）。我们将首先引入块的概念，块将变量和过程的定义限制在代码的一部分中。然后，我们将在此概念基础上引入过程，过程触发块的执行，并概述不同的参数传递模式。函数和过程的概念构成了程序架构的基础，并将在第\
  \ 2 卷中通过模块化和面向对象特性进行扩展。大步操作语义形式主义将贯穿本节，作为介绍新构造的基础。\n\n#### 4.6.1. 块\n\nLang3 的语法通过添加以下构造进行扩展：\n\
  \n```\nbegin d c end\n```\n\n其中 d 是 Def3 语言中的定义序列（可能为空，可扩展以允许过程的局部定义），c 是 Lang3\
  \ 语言中的一个程序。这个新构造确保由 d 定义的变量和过程在执行 c 期间可访问。在状态 (Env, Mem) 中执行 begin d c end 是一个两步过程：\n\
  \n- 1) 通过对 d 中的定义求值，构建执行程序 c 的状态：\n\n```\n(Env, Mem) ->*d_Def3 (Env1, Mem1)\n```\n\
  \n其中 ->*d_Def3 是第 4.2 节中定义的关系（针对语言 Def3 进行了调整）；\n\n- 2) 在状态 (Env1, Mem1) 中执行程序 c：\n\
  \n```\n<Mem1, c> ->Env1 Mem2\n```\n\n为了考虑这个新构造，方框 4.5 中给出的规则 C8 被添加到方框 4.2 中的规则。\n\
  \n(C8) (Env, Mem) ->*d_Def3 (Env1, Mem1)   <Mem1, c> ->Env1 Mem2\n-----------------------------------------------\n\
  <Mem, begin d c end> ->Env Mem2\n\n### 方框 4.5. 大步操作语义：块\n\n再次强调，执行块只能修改内存：对声明 d\
  \ 的求值将 Mem 转换为 Mem1，从而导致指令 c 开始执行的状态；该执行导致 Mem2。起始环境仅在执行 c 期间被临时修改。\n\n我们引入向语言 **Lang₃**\
  \ 添加块的语法构造。首先，使用 Python，我们定义以下类：\n\n```\nclass IBLoc4:\n    def __init__(self,list_def,pgm):\n\
  \        self.list_def = list_def\n        self.pgm = pgm\n```\n\n使用 OCaml，将以下构造函数添加到和类型\
  \ ‘a pgm4 的定义中（参见第 4.1 节）：\n\n```\n| IBLoc4 of (‘a def4) list * ‘a pgm4\n```\n\n\
  执行 **Lang₃** 程序的函数 exec_pgm4（参见第 4.1 节）已扩展以处理这个新构造。使用 Python，我们只需在函数代码中插入以下指令：\n\
  \n```\nif isinstance(c,IBLoc4):\n    env1,mem1 = trans_def4_exec((env,mem),c.list_def)\n\
  \    return exec_pgm4(env1,mem1,c.pgm)\n```\n\n使用 OCaml，将以下模式添加到函数中：\n\n```\n| IBLoc4\
  \ (d, c1) ->\nlet (env1, mem1) = trans_def4_exec (env, mem) d in exec_pgm4 env1\
  \ mem1 c1\n```\n\n### 示例 4.8.\n\n在由 Env = (y, ry) ⊕ (x, rx) ⊕ Env0 和 Mem = Mem0[rx\
  \ := 3][ry := 0] 定义的状态（Env0, Mem0）为任意给定状态）中，由以下内容定义的块 c 的执行：\n\nbegin (let z = x;let\
  \ w = ↑↓x;let x = 5); z := x ; y := w end\n\n首先通过构建要执行块指令的状态来获得：\n\n(Env, Mem)\n\
  let z = x; →Def₃ ((z, rₓ) ⊕ Env, Mem)\nlet w = ↑↓x; →Def₃ ((w, r_w) ⊕ (z, rₓ) ⊕\
  \ Env, Mem[r_w := 3])\nlet x = 5; →Def₃ ( (x, 5) ⊕ (w, r_w) ⊕ (z, rₓ) ⊕ Env, Mem[r_w\
  \ := 3] )\n             <---------- Env₁ ----------> <--- Mem₁ --->\n\n使用规则 C₈，我们得到以下执行树：\n\
  \n(Env, Mem) →* Def₃ (Env₁, Mem₁)   (C₃)   ∇₁   ∇₂\n                           \
  \    1       2\n(C₈) ---------------------------------------------------------------\n\
  \                 <Mem, c> →Env Mem₁[r_x := 5][r_y := r_w]\n                   \
  \                 Mem'\n\n其中 ∇₁ 和 ∇₂ 是以下树：\n\n∇₁ : (C₁) Env₁(z) = rₓ [[x]]Mem₁Env₁\
  \ = (5, Mem₁)\n<Mem₁, z := x> →Env₁ Mem₁[r_x := 5]\n\n∇₂ : (C₁) Env₁(y) = r_y [[w]]Mem₁Env₁[r_z:=5]\
  \ = (r_w, Mem₁[r_x := 5])\n<Mem₁[r_x := 5], y := w> →Env₁ Mem₁[r_x := 5] [r_y :=\
  \ r_w]\n\n在执行块 c 期间，环境 Env₁ 将变量 x 绑定到值 5，将变量 z 绑定到引用 rₓ。因此，赋值 z := x 将值 5 存储在 rₓ\
  \ 所表示的位置中。块执行期间也会发生分配：环境 Env₁ 将变量 w 绑定到引用 r_w。在该块执行结束时，环境 Env₁ 不再可访问，该绑定也不再可用。尽管如此，赋值\
  \ y := w 将引用 r_w 存储在 r_y 所表示的位置中，因此 r_w 所表示位置的内容可通过求值表达式 ↓↓y 保持可访问。\n\n本示例开头介绍的状态\
  \ (Env, Mem) 和块 c 的定义，以及构建满足 <Mem, c> →Env Mem' 的状态 (Env, Mem')，分别如下：\n\n```python\n\
  (env_ex_ld4_3,mem_ex_ld4_3) \\\n= trans_def4_exec(([],[]),\n[Let_def4(\"x\",Ref4(Cste4(CInt4(3)))),\n\

  \nclass Minus4:\n    pass\n\nclass Div4:\n    pass\n\nclass Or4:\n    pass\n\nclass\
  \ Leq4:\n    pass\n\nclass Plus4:\n    pass\n\nclass Mult4:\n    pass\n\nclass And4:\n\
  \    pass\n\nclass Eq4:\n    pass\n```\n\n```ocaml\ntype unary_op4 = Not4\ntype\
  \ bin_op4 = Plus4 | Minus4 | Mult4 | Div4 | And4 | Or4 | Eq4 | Leq4\n```\n\nExp₃\
  \ 的表达式定义如下：\n\n```python\nclass Cste4:\n    def __init__(self, cste):\n        self.cste\

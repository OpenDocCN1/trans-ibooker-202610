  \ (VInt2 6)\n```\n\n##### 3.2.5.1. 子表达式求值顺序\n\n表达式的子表达式求值顺序会影响最终求值的结果。表 3.3 中定义的求值函数任意确定了\
  \ e1 op e2 子表达式的求值顺序：我们选择先求值 e1，再求值 e2。如果求值 e1 触发错误，则不会求值 e2。因此，数学上交换的二元运算符的实现失去了这一属性。例如，如果变量\
  \ x 不属于环境 Env 的定义域，则 [[(3 / 0) + x]]Env ≠ [[x + (3 / 0)]]Env。确实，我们有：\n\n[[(3 / 0)\
  \ + x]]Env = [[3 / 0]]Env = ErrTE [[x + (3 / 0)]]Env = [[x]]Env = ErrTU\n\n同理，一些所谓的“惰性”布尔运算符也是如此。例如，在求值\
  \ e1 和 e2 时，如果 e1 求值为 false，则可能在不求值 e2 的情况下返回结果 false（因为无论何种情况合取值都为 false）；因此，e2\
  \ 中的执行错误不会被检测到。\n\n另一方面，在应用 (e1 e2) 的求值中，未指定 e1 和 e2 的求值顺序。尽管如此，当语义在编译器或解释器中实现时，必须做出选择。例如，在前面介绍的解释器\
  \ eval2 中，e1 在 e2 之前求值。在某些“惰性”语言中，函数的参数 e2 仅在必要时才求值（如果 e1 是常量函数，则无需求值参数；这意味着参数中的执行错误不会被检测到）。\n\
  \n\n\n\n对于其他表达式，求值顺序由语法结构的语义决定。例如，求值 if e1 then e2 else e3 从求值 e1 开始，并根据返回的布尔值继续求值\
  \ e2 或 e3 中的一个。显然，如果表达式 e1 的求值导致错误，则不会求值任何子表达式。\n\n##### 3.2.5.2. 词法作用域与动态作用域\n\n\
  相同的程序，根据所选的作用域机制，可能会产生不同的结果。请考虑以下表达式：\n\n```\nlet x2 = 3 in\nlet f = fun x1 ↦ x1\
  \ + x2 in\nlet x2 = 8 in (f 2)   [3.4]\n```\n\n使用词法作用域，该表达式的求值过程如下：\n\n```\n[[let\
  \ x2 = 3 in let f = fun x1 ↦ x1 + x2 in let x2 = 8 in (f 2)]]Env\n= [[let f = fun\
  \ x1 ↦ x1 + x2 in let x2 = 8 in (f 2)]](x2,3)⊕Env\n= [[let x2 = 8 in (f 2)]](f,⟨x1,x1+x2,⊕(x2,3)⊕Env)⊕(x2,3)⊕Env\n\
  = [[(f 2)]](x2,8)⊕(f,⟨x1,x1+x2,⊕(x2,3)⊕Env)⊕(x2,3)⊕Env\n= [[x1 + x2]](x1,2)⊕(x2,3)⊕Env\
  \ = 2 + 3 = 5\n```\n\n使用动态作用域时，采用表 3.3 中所示的求值规则，但有关函数定义和应用的规则除外：在这种情况下，函数的定义环境不会记录在闭包中。如果在环境\
  \ Env_a 中对某个应用求值，则函数体将在 Env_a 的扩展环境中求值，该扩展环境将形式参数绑定到实参的值。在前面的示例中，该求值过程如下：\n\n```\n\
  [[let x2 = 3 in let f = fun x1 ↦ x1 + x2 in let x2 = 8 in (f 2)]]Env\n= [[let f\
  \ = fun x1 ↦ x1 + x2 in let x2 = 8 in (f 2)]](x2,3)⊕Env\n= [[let x2 = 8 in (f 2)]](f,⟨x1,x1+x2⟩)⊕(x2,3)⊕Env\n\
  = [[(f 2)]](x2,8)⊕(f,⟨x1,x1+x2⟩)⊕(x2,3)⊕Env\n= [[x1 + x2]](x1,2)⊕(x2,8)⊕(f,⟨x1,x1+x2⟩)⊕(x2,3)⊕Env\
  \ = 2 + 8 = 10\n```\n\n动态作用域机制存在两个缺点。首先，如果函数体包含自由变量，则其含义取决于自由变量当前值（在 Env_a 中），该值可能在不同调用之间发生变化。这在尝试审查源代码时尤其成问题：函数的含义会随执行而被修改。此外，自由变量在执行过程中可能绑定到不同类型的值，这在求值函数应用时可能导致类型错误。例如，如果表达式\
  \ [3.4] 中的 x2 关联的是布尔值而不是整数值 8，则求值 (f 2) 将涉及将 2 与布尔值相加，从而导致错误。但是，在函数 \\( f \\) 的定义期间，与\
  \ \\( x_2 \\) 关联的值是整数 3，且在该情况下，\\( f \\) 函数体中运算符 \\( + \\) 的应用不会出现任何问题。因此，函数 \\\
  ( f \\) 在定义期间是“正确类型”的。\n\n使用词法作用域机制，函数体中变量自由出现所关联的值由函数定义所在的环境决定。因此，在前面示例中函数 \\(\
  \ f \\) 的函数体内，\\( x_2 \\) 的值始终为 3，且表达式 [3.4] 始终会被求值为 5。词法作用域机制将在本章余下部分中使用。\n\n###\
  \ 3.3. 执行语义：操作语义\n\n操作语义通过一组推理规则来描述语言编译器的规范，如下所示：\n\n\\( (R) \\frac{h_1 \\cdots\
  \ h_n}{c} (I) \\)\n\n该规则名为 \\( R \\)，表示如果假设 \\( h_1, \\cdots, h_n \\) 为真，则可以推导出\
  \ \\( c \\)，或者等价地，可以通过建立 \\( h_1, \\cdots, h_n \\) 来推导出 \\( c \\)。\\( I \\) 对应附加信息（规则应用条件或中间计算）。例如，考虑一个指定两个表达式相加求值的规则：\n\
  \n\\( (R) \\frac{\\text{Env} \\vdash e_1 \\rightsquigarrow v_1 \\quad \\text{Env}\
  \ \\vdash e_2 \\rightsquigarrow v_2}{\\text{Env} \\vdash e_1 + e_2 \\rightsquigarrow\
  \ v} (v = v_1 + v_2) \\)\n\n在这种情况下，\\( \\text{Env} \\vdash e \\rightsquigarrow v\
  \ \\) 表示在环境 Env 中，表达式 \\( e \\) 的求值返回值 \\( v \\)。\\( e_1 \\) 和 \\( e_2 \\) 的求值顺序未指定，下面两个规则将错误传播的选择留给了（编译器的）开发者：\n\
  \n\\( (R_1) \\frac{\\text{Env} \\vdash e_1 \\rightsquigarrow v_1}{\\text{Env} \\\
  vdash e_1 + e_2 \\rightsquigarrow v_1} (v_1 \\in \\text{IE}) \\quad (R_2) \\frac{\\\
  text{Env} \\vdash e_2 \\rightsquigarrow v_2}{\\text{Env} \\vdash e_1 + e_2 \\rightsquigarrow\
  \ v_2} (v_2 \\in \\text{IE}) \\)\n\n这是一个求值关系，而非函数。在第 3.2 节中定义的函数 \\( [[\\_]] \\\
  ) 实现了规则 \\( R_1 \\)。\n\n第 3.2 节中介绍的函数 eval12 定义了一种非常精确的求值策略，确定了求值子表达式的顺序。因此，该函数为求值提供了完全确定性的定义。\n\
  \n另一方面，函数 \\( [[\\_]] \\) 保留了一些选择（例如应用中子表达式的求值顺序），同时固定了其他选择（例如运算符中子表达式的求值顺序）。\n\n\
  注意.- 当表达式的求值结果取决于编译器用于求值子表达式所选择的实现时，该表达式本身被认为在语义上是不正确的。与表达式关联的值取决于编译器。某些编程语言的参考手册详细说明了这些情况。\n\
  \n操作语义允许我们安全地忽略某些约束，例如运算符中实参的求值顺序。例如，编译器设计者可能更愿意不遵循强制的实参计算顺序，这通常出于优化方面的原因。可以通过使用一种语义来指定编译器的义务，该语义建立语言中结构的含义，同时在某些实现选择上保留一定的自由度。例如，交换二元运算符中实参的求值顺序可以在语义中留空。这意味着同一个表达式可能关联多个不同的值，例如，如果语义包含上面定义的两条规则\
  \ R1 和 R2。\n\n#### 3.3.1. 简单表达式\n\n语言 Exp2 中简单表达式的求值关系（记为 ~~ ）使用框 3.2 中介绍的推理系统来定义。我们选择定义一种尊重函数\
  \ [[_]] 中所用选择的操作语义。这产生了两种等价的语义。\n\n```\n(F1) ENV |- v ~~ v (v ∈ K)\n(F2) ENV |-\
  \ op e1 ~~ opv v1 (v1 ∈ V)\n(F3) ENV |- e1 ~~ v1 (v1 ∈ IE)\n(F4) ENV |- e1 ~~ v1\
  \   ENV |- e2 ~~ v2\n     -----------------------------------\n     ENV |- e1 op\
  \ e2 ~~ v1 opv v2 (v1 ∈ V)\n     (v2 ∈ V)\n(F5) ENV |- e1 ~~ v1 (v1 ∈ IE)\n(F6)\
  \ ENV |- e1 ~~ v1   ENV |- e2 ~~ v2\n     -----------------------------------\n\
  \     ENV |- e1 op e2 ~~ v1 (v1 ∈ V)\n     (v2 ∈ IE)\n(F7) ENV |- e1 ~~ true   ENV\
  \ |- e2 ~~ v\n     -----------------------------------\n     ENV |- if e1 then e2\
  \ else e3 ~~ v\n(F8) ENV |- e1 ~~ false   ENV |- e3 ~~ v\n     -----------------------------------\n\
  \     ENV |- if e1 then e2 else e3 ~~ v\n(F9) ENV |- e1 ~~ v\n     -----------------------------------\n\
  \     ENV |- if e1 then e2 else e3 ~~ ErrT (v ∈ V \\ IB)\n(F10) ENV |- e1 ~~ v\n\
  \      -----------------------------------\n      ENV |- if e1 then e2 else e3 ~~\
  \ v (v ∈ IE)\n```\n\n### 框 3.2. Exp2 中简单表达式的操作语义\n\n规则 F1 表明语言中的常量求值为其自身。规则 F2、F3、F4、F5\
  \ 和 F6 表明，将一元或二元运算符应用于一个或两个表达式的求值，是通过将该运算符应用于所涉及子表达式的求值结果来获得的。当然，如果在求值这些表达式之一时遇到错误，则运算符的任何应用都将返回相同的错误。规则\
  \ F7、F8、F9 和 F10 处理 if e1 then e2 else e3 形式的条件表达式的求值。根据 e1 的求值结果，将求值表达式 e2 或 e3。再次强调，如果在求值\
  \ e1 时遇到错误，则条件表达式的求值将导致相同的错误。此外，如果 e1 的求值返回非布尔值，则在求值条件表达式时会发生类型错误 (ErrTT)。\n\n####\
  \ 3.3.2. 按值调用\n\n定义 3.1.- 按值调用：按值调用机制定义了求值函数应用的策略，指出实参（即实际参数）必须始终求值。该策略扩展到 let x\
  \ = e1 in e2 表达式，其中 e1 始终求值。\n\n框 3.3 中列出的规则定义了 Exp2 的操作语义。这些规则应用按值调用机制。\n\n```\n\
  (F11) Env |- x ~~> Env(x) (x in dom(Env))\n(F12) Env |- x ~~> ErrU (x not in dom(Env))\n\
  \n(F13) Env |- e1 ~~> v1   (x, v1) in Env |- e2 ~~> v2\n      -----------------------------------------------\n\
  \      Env |- let x = e1 in e2 ~~> v2   (v1 in V)\n\n(F14) Env |- e1 ~~> v1\n  \
  \    -----------------------\n      Env |- let x = e1 in e2 ~~> v1   (v1 in I)\n\
  \n(F15) Env |- fun x -> e ~~> <x, e, Env>\n(F16) Env |- rec f x = e ~~> <f, x, e,\
  \ Env>\n\n      Env |- e1 ~~> <x, e, ef, Envf>   Env |- e2 ~~> v2\n      (x, v2)\
  \ + Envf |- e ~~> v\n      ------------------------------------------------\n  \
  \    (F17) Env |- (e1 e2) ~~> v   (v2 not in I)\n\n      Env |- e1 ~~> <f, x, ef,\
  \ Envf>   Env |- e2 ~~> v2\n      <f, <f, x, ef, Envf>> + (x, v2) + Envf + ef ~~>\
  \ v   (v2 not in I)\n      ------------------------------------------------\n  \
  \    (F18) Env |- (e1 e2) ~~> v\n\n      Env |- e1 ~~> v1   Env |- e2 ~~> v2   (v1\
  \ in I, v2 in I)\n      -----------------------------------------\n      (F19) Env\
  \ |- (e1 e2) ~~> v2\n\n      Env |- e1 ~~> v\n      ---------------\n      (F20)\
  \ Env |- (e1 e2) ~~> ErrTT   (v not in I)\n```\n\n### 框 3.3. Exp2 的操作语义：按值调用\n\n\
  \n\n\n\n规则 $F_{11}$ 和 $F_{12}$ 用于获取环境 Env 中变量 \\(x\\) 关联的值。如果该变量不属于 Env 的定义域，则返回值\
  \ Err\\(_\\text{U}\\)。规则 $F_{13}$ 和 $F_{14}$ 描述了在环境 Env 中求值形式为 let \\(x = e_1\\\
  ) in \\(e_2\\) 的表达式。首先，在 Env 中求值表达式 \\(e_1\\)，得到值 \\(v_1\\)。接下来，在扩展了绑定 \\((x, v_1)\\\
  ) 的 Env 中求值 \\(e_2\\)，以获得最终结果。如果在求值表达式 \\(e_1\\) 时发生错误，那么求值表达式 let \\(x = e_1\\\
  ) in \\(e_2\\) 将导致相同的错误。规则 $F_{15}$ 和 $F_{16}$ 定义函数的值，即包含当前环境（函数定义所在的环境）的闭包。\n\n\
  规则 $F_{17}$ 和 $F_{18}$ 描述了应用 \\((e_1 e_2)\\) 的求值。如果 \\(e_1\\) 被求值为闭包，且 \\(e_2\\\
  ) 的求值不产生错误，则此求值不会产生错误。规则 \\(F_{17}\\) 适用于表达式 \\(e_1\\) 的情况，该表达式被求值为非递归函数，即形式为 \\\
  (\\langle x, e_f, \\text{Env}_f \\rangle\\) 的闭包。参数 \\(e_2\\) 在当前环境（即调用所在的环境）Env\
  \ 中求值，得到值 \\(v_2\\)。函数 \\(e_1\\) 的函数体，即 \\(e_f\\)，在 \\(\\text{Env}_f\\) 中求值，\\(\\\
  text{Env}_f\\) 是 \\(e_1\\) 的定义环境，并扩展了将形式参数绑定到实际参数值的绑定 \\((x, v_2)\\)。\n\n规则 \\(F_{18}\\\
  ) 适用于 \\(e_1\\) 被求值为递归函数的情况，即形式为 \\(\\langle f, x, e_f, \\text{Env}_f \\rangle\\\
  ) 的闭包。此应用的求值与规则 \\(F_{17}\\) 定义的求值类似，但 \\(\\text{Env}_f\\) 包含一个额外的绑定 \\((f, \\langle\
  \ f, x, e_f, \\text{Env}_f \\rangle)\\)，用于求值对应于在 \\(e_f\\) 中对函数进行递归调用的应用。请注意词法绑定机制的使用：函数体中的自由变量保留函数定义时的值，无论之后发生什么。\n\
  \n### 示例 3.4.\n\n再次考虑 [3.3] 中定义的表达式：\n\n```\nlet x = 25 in let f = fun x -> x +\
  \ 3 in (f 7) + x\n```\n\n该表达式的求值树如下：\n\n![](img/c9a176746efdbd36ba74d71dfdc86e86_72_0.png)\n\
  \n其中 \\(\\nabla_1\\) 是求值树：\n\n```\n\\((F_{11})\\overline{\\text{Env}_2 \\vdash f\
  \ \\rightsquigarrow F_f} \\quad (F_1)\\overline{\\text{Env}_2 \\vdash 7 \\rightsquigarrow\
  \ 7} \\quad \\nabla_2\\)\n\\((F_{17})\\overline{\\text{Env}_2 \\vdash (f \\ 7) \\\
  rightsquigarrow 10} \\quad (F_{11})\\overline{\\text{Env}_2 \\vdash x \\rightsquigarrow\
  \ 25}\\)\n\\((F_4)\\overline{(f, F_f) \\oplus \\text{Env}_1 \\vdash (f \\ 7) + x\
  \ \\rightsquigarrow 35}\\)\n```\n\n其中 \\(\\nabla_2\\) 是求值树：\n\n```\n\\((F_{11})\\\
  overline{(x, 7) \\oplus \\text{Env}_1 \\vdash x \\rightsquigarrow 7} \\quad (F_{11})\\\
  overline{(x, 7) \\oplus \\text{Env}_1 \\vdash 3 \\rightsquigarrow 3}\\)\n\\((F_4)\\\
  overline{(x, 7) \\oplus \\text{Env}_1 \\vdash x + 3 \\rightsquigarrow 10}\\)\n```\n\
  \n### 示例 3.5.\n\n对 \\((e_{fact} 3)\\) 进行求值，其中 \\(e_{fact}\\) 是 [3.2] 中定义的表达式：\n\n\
  ```\n(rec fact n = if n <= 1 then 1 else (fact (n - 1)) * n)\n```\n\n求值过程如下：\n\n\
  ```\n\\((F_{16})\\overline{\\text{Env}_0 \\vdash e_{fact} \\rightsquigarrow \\langle\
  \ fact, n, e_1, \\text{Env}_0 \\rangle} \\quad (F_1)\\overline{\\text{Env}_0 \\\
  vdash 3 \\rightsquigarrow 3} \\quad \\nabla_1\\)\n\\((F_{18})\\overline{F_{fact}}\\\
  )\n\\(\\text{Env}_0 \\vdash (e_{fact} \\ 3) \\rightsquigarrow 6\\)\n```\n\n其中 \\\
  (\\nabla_1\\) 是求值树：\n\n```\n\\((F_4)\\overline{\\text{Env}_1 \\vdash n \\rightsquigarrow\
  \ 3} \\quad (F_1)\\overline{\\text{Env}_1 \\vdash 1 \\rightsquigarrow 1} \\quad\
  \ \\nabla_2 \\quad (F_{11})\\overline{\\text{Env}_1 \\vdash n \\rightsquigarrow\
  \ 3}\\)\n\\((F_4)\\overline{\\text{Env}_1 \\vdash n \\le 1 \\rightsquigarrow false}\
  \ \\quad (F_4)\\overline{\\text{Env}_1 \\vdash e_2 \\rightsquigarrow 6}\\)\n\\((F_8)\\\
  overline{\\langle fact, F_{fact} \\rangle \\oplus (n, 3) \\oplus \\text{Env}_0 \\\
  vdash e_1 \\rightsquigarrow 6}\\)\n```\n\n其中 \\(\\nabla_2\\) 是求值树：\n\n```\n\\((F_{11})\\\
  overline{\\text{Env}_1 \\vdash fact \\rightsquigarrow F_{fact}} \\quad (F_4)\\overline{\\\
  text{Env}_1 \\vdash n \\rightsquigarrow 3} \\quad (F_1)\\overline{\\text{Env}_1\
  \ \\vdash 1 \\rightsquigarrow 1} \\quad \\nabla_3\\)\n\\((F_{11})\\overline{\\text{Env}_1\
  \ \\vdash fact \\rightsquigarrow F_{fact}}\\)\n\\(\\text{Env}_1 \\vdash (fact (n\
  \ - 1)) \\rightsquigarrow 2\\)\n```\n\n其中 \\(\\nabla_3\\) 是求值树：\n\n![](img/c9a176746efdbd36ba74d71dfdc86e86_74_0.png)\n\
  \n其中 \\(\\nabla_4\\) 是求值树：\n\n![](img/c9a176746efdbd36ba74d71dfdc86e86_74_1.png)\n\
  \n其中 \\(\\nabla_5\\) 是求值树：\n\n![](img/c9a176746efdbd36ba74d71dfdc86e86_74_2.png)\n\
  \n### 备注。\n\n求值机制的终止性：使用语法构造 rec f x = e，可以定义那些求值不终止的表达式。例如，由以下定义的表达式 e_foo：\n\n\
  ```\nrec f x = (f x) [3.5]\n```\n\n我们可以构造表达式：\n\n```\nlet foo = (rec f x = (f x))\
  \ in (foo 2) [3.6]\n```\n\n此表达式的求值不终止。此表达式求值树的构建是无休止的：\n\n![](img/c9a176746efdbd36ba74d71dfdc86e86_74_3.png)\n\
  \n![](img/c9a176746efdbd36ba74d71dfdc86e86_74_4.png)\n\n其中 \\(\\nabla_1\\) 的构建如下：\n\
  \n![](img/c9a176746efdbd36ba74d71dfdc86e86_74_5.png)\n\n其中 \\(\\nabla_2\\) 的构建如下：\n\
  \n(F_{11}) \\frac{\\text{Env}_2 \\vdash f \\rightsquigarrow F_{foo}}{} \\quad (F_{11})\
  \ \\frac{\\text{Env}_2 \\vdash x \\rightsquigarrow 2}{} \\quad (F_{18}) \\frac{\\\
  text{Env}_2 \\vdash (fx) \\rightsquigarrow}{} \\quad \\vdots \\\\\n(F_{18}) \\frac{((f,\
  \ F_{foo}) \\oplus (x, 2) \\oplus \\text{Env} \\vdash (fx) \\rightsquigarrow)}{\\\
  text{Env}_2}\n\n此语义仅可用于描述终止的执行。换言之，Env \\(\\vdash e \\rightsquigarrow v\\) 表达的事实是：\\\
  (v\\) 是通过有限求值树获得的 \\(e\\) 的值，该求值树使用框 3.2 和框 3.3 中呈现的推理规则构建。对于表达式 [3.6] 不存在这样的求值树。此语义称为\
  \ *大步操作语义*：Env \\(\\vdash e \\rightsquigarrow v\\) 不描述计算，只描述结果。为了使用包括非终止计算在内的计算进行描述和推理，语义可以形式化为\
  \ *小步语义*（或归约语义），这是第 4 章详细讨论的主题。\n\n#### 3.3.3. 递归和互递归函数\n\n在规则 \\(F_{18}\\) 中，符号\
  \ \\(\\vdash\\) 两侧各出现两次 \\(e_f\\)，该规则涉及递归函数的应用。乍一看，这似乎很悖论：对右侧 \\(e_f\\) 求值会导致我们对左侧\
  \ \\(e_f\\) 求值。如第 3.2.5 节所示，这个问题可以直接通过使用规则 \\(F_{16}\\) 并将 \\(f\\) 绑定到闭包来表达：\n\n\
  \\(F = \\langle x, e, (f, F) \\oplus \\text{Env} \\rangle\\)\n\n再次，\\(F\\) 出现在等号两边。值\
  \ \\(F\\) 的存在性可以使用最小不动点（LFP）数学理论来证明，该理论在 4.7.1 节中简要介绍；更详细的描述可见 [JAU 16]。采用这种方法，规则\
  \ \\(F_{16}\\)、\\(F_{17}\\) 和 \\(F_{18}\\) 可以浓缩为两条规则：\n\n(N_{16}) \\text{Env} \\\
  vdash \\text{rec } f \\ x = e \\rightsquigarrow \\langle x, e, (f, F) \\oplus \\\
  text{Env} \\rangle \\stackrel{\\text{Env}_f}{=} F\n\n(N_{17\\_18}) \\frac{\\text{Env}\
  \ \\vdash e_1 \\rightsquigarrow \\langle x, e, \\text{Env}_f \\rangle \\quad \\\
  text{Env} \\vdash e_2 \\rightsquigarrow v_2}{(x, v_2) \\oplus \\text{Env}_f \\vdash\
  \ e \\rightsquigarrow v} \\text{Env} \\vdash (e_1 e_2) \\rightsquigarrow v\n\n递归和非递归函数的应用基于相同的机制。LFP\
  \ 理论使我们可以确定，任何具有有限次递归调用的表达式的求值都会终止。此外，相同的理论可以用来证明，这两种方法为 \\(\\text{Exp}_2\\) 定义了相同的语义。\n\
  \n\n\n\n\n现在，让我们考虑互递归函数的情况。例如，以下函数用于确定整数的奇偶性：\n\n```\nrec even n = if n = 0 then\
  \ true else odd(n - 1)\nrec odd n = if n = 0 then false else even(n - 1)\n```\n\n\
  函数 even 的函数体中包含对函数 odd 的调用，而后者的函数体中也包含对函数 even 的调用。这两个函数被称为互递归，某些编程语言使用语法结构来表达两个函数之间的这种依赖关系。当两个函数互递归时，不可能为它们提供两个独立的值：例如，与函数\
  \ even 关联的闭包中包含的定义环境必须包含对函数 odd 的绑定，反之亦然。解决此问题的一种简单方法是从语法上处理。例如，结构\n\n```\nlet_rec\
  \ f x = e_f and g y = e_g;\n```\n\n可用于定义两个互递归函数 f 和 g。对该结构的求值将同时将 f 和 g 的绑定添加到当前环境中。\n\
  \n考虑到本节开头介绍的闭包方法，对这些定义的求值将当前环境 ENV 扩展如下：\n\n```\n(g, G) ⊕ (f, F) ⊕ ENV with\nF =\
  \ ⟨x, e_f, (g, G) ⊕ (f, F) ⊕ ENV⟩\nG = ⟨y, e_g, (g, G) ⊕ (f, F) ⊕ ENV⟩\n```\n\n\
  #### 3.3.4. 按名调用\n\n定义 3.2.– 按名调用：按名调用机制定义了求值函数应用和其他表达式的策略。表达式 e 的子表达式只有在其值用于求值\
  \ e 时才会被求值。\n\n要对 (f e) 求值，我们在当前环境 ENV 中对 f 求值。仅当对 f 在其定义环境 Env_f 中的函数体求值需要 ENV\
  \ 中 e 的值时，表达式 e 才会被求值。因此，必须保留对 [e, ENV]（称为冻结表达式）。环境因此变成一个关联列表，其中元素为对 (x, [e, ENV_e])，其中\
  \ x 是一个“冻结”变量，e 是定义 x 的表达式，ENV_e 是 e 应在其中求值的环境：\n\n```\nENV = [(x_1, [e_1, ENV_{e1}]),\
  \ ..., (x_n, [e_n, ENV_{en}])]\n```\n\n因此，闭包的概念被推广到所有表达式，而不仅仅是函数。\n\n按名调用策略的大步操作语义在框\
  \ 3.2 和框 3.4 中定义。框 3.2 中定义的简单表达式求值规则对两种调用策略均有效。例如，条件表达式的求值始终取决于条件的求值，而算术表达式的求值要求我们至少求值一个操作数。框\
  \ 3.4 所示规则使用新的环境概念。要在环境 ENV 中对变量 x 求值，ENV 将 [e_x, ENV_x] 与 x 关联，我们只需在环境 ENV_x 中对\
  \ e_x 求值，即应用规则 F'11 和 F'12。要在环境 ENV 中对形式为 let x = e_1 in e_2 的表达式求值，我们在环境 (x, [e_1,\
  \ ENV]) ⊕ ENV 中对 e_2 求值；这是规则 F'13 的应用。对函数求值会产生额外的闭包。第 3.3.3 节中提出的表述也用于规则 F'14 和\
  \ F'15。要在环境 ENV 中将函数 f 应用于参数 e，首先将 f 在 ENV 中作为闭包 <x, e_f, ENV_f> 求值，然后在环境 (x, [e,\
  \ ENV]) ⊕ ENV_f 中对 e_f 求值，遵循规则 F'16。\n\n```\n(F'11) ENV |- e_x ~~ v   (F'12) ENV\
  \ |- x ~~ ERR_U  (x ∉ dom(ENV))\n       ---------------------------- ------------------------------------\n\
  \       ENV |- x ~~ v          (x, [e_x, ENV_x]) ∈ ENV\n\n(F'13) (x, [e_1, ENV])\
  \ ⊕ ENV |- e_2 ~~ v\n       ---------------------------------\n       ENV |- let\
  \ x = e_1 in e_2 ~~ v\n\n(F'14) ENV |- fun x -> e ~~ <x, e, ENV>\n\n(F'15) ENV |-\
  \ rec f x = e ~~ <x, e, f, [rec f x = e, ENV]> ⊕ ENV\n\n(F'16) ENV |- e_1 ~~ <x,\
  \ e_f, ENV_f>   (x, [e_2, ENV]) ⊕ ENV_f |- e_f ~~ v\n       -------------------------------------------------------------\n\
  \       ENV |- (e_1 e_2) ~~ v\n\n(F'17) ENV |- e_1 ~~ v\n       ---------------\n\
  \       ENV |- (e_1 e_2) ~~ ERR_T  (v ∉ F)\n```\n\n### 框 3.4. Exp2 的操作语义：按名调用\n\n\
  #### 3.3.5. 按值调用与按名调用\n\n两种调用策略不一定产生相同的结果。例如，使用按值调用策略对表达式 ((fun x ↦ 3) (8 / 0))\
  \ 的求值操作如下：\n\n```\n(F1)       (F1)\nENV |- 8 ~~ 8   ENV |- 0 ~~ 0\n---------------------------\
  \ (F4)\nENV |- 8 / 0 ~~ ERR_E\n\n(F15) ENV |- fun x -> 3 ~~ <x, 3, ENV>\n-------------------------------------\
  \ (F19)\nENV |- ((fun x -> 3) (8 / 0)) ~~ ERR_E\n```\n\n如果按值调用策略产生有限求值树，则按名调用策略也会产生有限树。另一方面，使用按名调用策略获得有限树并不意味着使用按值调用一定会产生有限树。例如，使用按值调用策略对表达式\
  \ ((fun x ↦ 3) (e_foo 2)) 的求值不会终止（参见第 3.3.2 节），而使用按名调用则获得值 3：\n\n```\n(F'14) Env\
  \ |- fun x -> 3 ~~ <x, 3, Env> (F1) (x, [(e_foo 2), Env]) ⊕ Env |- 3 ~~ 3\n(F'16)\
  \ -------------------------------------------------------------------------------\n\
  Env |- ((fun x -> 3) (e_foo 2)) ~~ 3\n```\n\n两种策略在共享子表达式求值的能力上也有所不同。例如，使用按值调用，((fun\
  \ x ↦ x + x) e) 的求值如下：\n\n```\n(F15) Env |- e_f ~~ <x, x + x, Env> (R) ... ∇\n(F17)\
  \ -------------------------------------------------------------------------------\n\
  Env |- ((fun x -> x + x) e) ~~ v\n       e_f\n```\n\n其中 ∇ 是以下树：\n\n```\n(F11) Env_1\
  \ |- x ~~ v_e (F11) Env_1 |- x ~~ v_e\n(F4) -------------------------------------------------------------------------------\n\
  \       (x, v_e) ⊕ Env |- x + x ~~ v\n       Env_1\n```\n\n这里，值 v 通过仅计算一次 e 的值 v_e\
  \ 而获得。另一方面，使用按名调用机制，我们得到：\n\n```\n(F'14) ... (F11) ... ∇ ... (F11) ... ∇ ...\n \
  \      Env |- e ~~ v_e   Env |- e ~~ v_e\n(F4)   Env_1 |- x ~~ v_e   Env_1 |- x\
  \ ~~ v_e\n       -------------------------------------------------------------------------------\n\
  \       (x, [e, Env]) ⊕ Env |- x + x ~~ v\n       Env_1\n(F'16) -------------------------------------------------------------------------------\n\
  Env |- ((fun x -> x + x) e) ~~ v\n       e_f\n```\n\ne 的值 v_e 被计算两次以获得表达式 x + x\
  \ 的值 v。按需调用策略是按名调用策略的一种实现，它试图最大限度地共享子表达式，以便仅计算一次函数的参数。\n\n备注。—— 在允许副作用（读取/写入/赋值）的语言中，通常使用按值调用，因为该策略可以预测副作用何时发生；按名调用策略则不然。使用按名调用策略的语言的编译器会对产生副作用的子表达式使用按值调用策略。\n\
  \n### 3.4. 求值函与求值关系\n\n在本节中，我们考察按值调用策略下求值函的确定性。这引导我们研究一种新的归纳形式。\n\n#### 3.4.1. 求值函的状态\n\
  \n本节考察的问题是，对于每个表达式 \\( e \\in \\mathbf{Exp}_2 \\)，是否存在一个唯一的值 \\( v \\in \\mathbb{V}\
  \ \\) 使得 \\( \\llbracket e \\rrbracket_{\\text{Env}} = v \\)。答案是否定的。如果 \\( e \\\
  ) 是一个需要对非终止递归函数应用求值的表达式（例如第 3.3.2 节中称为“foo”的表达式 [3.6]），那么我们无法获得一个值 \\( v \\in \\\
  mathbb{V} \\) 使得 \\( \\llbracket e \\rrbracket_{\\text{Env}} = v \\)。因此，\\( \\llbracket\
  \ \\_ \\rrbracket \\) 不是全函数。但是，如果存在这样的值 \\( v \\)，则可以证明它是唯一的（因此 \\( \\llbracket\
  \ \\_ \\rrbracket \\) 是偏函数）：\n\n```\n\\(\\forall e \\in \\mathbf{Exp}_2 \\quad \\\
  underline{\\forall_{\\text{Env}} \\in \\mathbf{E} \\quad \\forall v, v' \\in \\\
  mathbb{V} \\quad (\\llbracket e \\rrbracket_{\\text{Env}} = v \\text{ and } \\llbracket\
  \ e \\rrbracket_{\\text{Env}} = v') \\Rightarrow v = v'} \\quad P(e)\\)\n```\n\n\
  让我们称此属性为 \\( P \\)。我们可以尝试通过对 \\( e \\) 进行归纳，使用框 3.1 中定义的归纳方案来证明 \\( P \\ 对于所有表达式\
  \ \\( e \\in \\mathbf{Exp}_2 \\) 都成立。对于大多数语法结构，这是可能的，例如形式为 let \\( x = e_1 \\) in\
  \ \\( e_2 \\) 的表达式。设 Env 为一个环境，\\( v \\) 和 \\( v' \\) 为两个值。如果 \\( \\llbracket \\\
  text{let } x = e_1 \\text{ in } e_2 \\rrbracket_{\\text{Env}} = v \\) 和 \\( \\llbracket\
  \ \\text{let } x = e_1 \\text{ in } e_2 \\rrbracket_{\\text{Env}} = v' \\)，那么我们可以证明\
  \ \\( v = v' \\)。首先，注意根据归纳假设，\\( P(e_1) \\) 得到验证，因此如果 \\( [\\![e_1]!]_{\\text{Env}}\
  \ = v_1 \\) 和 \\( [\\![e_1]!]_{\\text{Env}} = v'_1 \\)，则 \\( v_1 = v'_1 \\)。现在有两种情况。如果\
  \ \\( v_1 \\in \\mathbf{V} \\)，那么根据定义，\\( v = [\\![e_2]!]_{(x,v_1) \\oplus \\text{Env}}\
  \ \\) 和 \\( v' = [\\![e_2]!]_{(x,v'_1) \\oplus \\text{Env}} \\)，由于 \\( v_1 = v'_1\
  \ \\)，根据对 \\( e_2 \\) 的归纳假设，我们得到 \\( v = v' \\)。否则，如果 \\( v_1 \\in \\mathbf{IE}\
  \ \\)，那么根据定义，\\( v = v_1 \\) 和 \\( v' = v'_1 \\)，由于 \\( v_1 = v'_1 \\)，我们直接得到 \\\
  ( v = v' \\)。\n\n类似的推理可以用于证明除了函数应用（即形式为 \\( (e_1 e_2) \\) 的表达式）之外的所有结构的 \\( P \\\
  )。在这种情况下，可用的唯一归纳假设与 \\( (e_1 e_2) \\) 中的子表达式 \\( e_1 \\) 和 \\( e_2 \\) 相关。但是，当 \\\
  ( e_1 \\) 作为包含表达式 \\( e_f \\) 的闭包求值时，应用 \\( (e_1 e_2) \\) 的求值会导致对函数体 \\( e_f \\\
  ) 的求值，其\n\n1 注意，属性 \\( P \\) 陈述中量词的顺序会影响归纳假设的形式。例如，首先对环境进行量化（\\( \\forall_{\\text{Env}}\
  \ \\in \\mathbf{E} \\forall e \\in \\mathbf{Exp}_2 \\forall v, v' \\in \\mathbb{V}\
  \ \\)）允许我们对 \\( e_1 \\) 使用归纳假设，因为 \\( e_1 \\) 在 Env 中求值，但禁止我们对 \\( e_2 \\) 使用归纳假设，因为\
  \ \\( e_2 \\) 在与 Env 不同的环境中求值。\n\n\n\n\n\n不是 $(e_1 e_2)$ 的子表达式（例如，$e_1$ 可能只是函数的名称）。我们不能假设\
  \ $P$ 对 $e_f$ 成立，也无法得出结论。因此，无法通过对表达式 $e$ 进行结构归纳来证明 $P(e)$。该属性不能通过对表达式结构进行归纳来证明，而需要对求值过程中涉及的计算的“大小”进行归纳。考虑到求值函数\
  \ $\\lfloor \\_ \\rfloor$，可以使用连续函数的最小不动点理论来完成，如第 4.7.1 节所述。这里将使用大步操作语义来证明该属性，它允许我们通过对求值树进行归纳来推理；这是一种考虑求值过程中涉及的计算“大小”的方法。\n\
  \n#### 3.4.2. 对求值树进行归纳\n\n我们在这里的目标是证明一个属性 $P$，即如果一个表达式被求值为一个值，那么这个值是唯一的。形式上，在大步操作语义框架内，我们希望证明以下命题：\n\
  \n### 命题 3.1. – 确定性：\n\n\\[\n\\forall e \\in \\mathbf{Exp}_2 \\ \\forall Env \\\
  in \\mathbf{E} \\ \\forall v, v' \\in \\mathbb{V} \\ (Env \\vdash e \\rightsquigarrow\
  \ v \\text{ and } Env \\vdash e \\rightsquigarrow v') \\Rightarrow v = v'\n\\]\n\
  \n$\\mathbf{Exp}_2$ 中表达式的求值（或推导）树集合可以归纳定义，这意味着我们可以通过对这些树进行归纳来推理，即对求值过程中执行的计算的“大小”进行归纳。更一般地，给定一个推理系统\
  \ $\\mathbb{S}$，即一组形式的推理规则\n\n\\[\n(R) \\frac{e_1 \\cdots e_n}{e}\n\\]\n\n可以推导的元素\
  \ $e$ 的集合 $\\mathbb{A}_\\mathbb{S}$（有时也称为 $\\mathbb{S}$ 的定理集）归纳定义如下：\n\n- 对于 $\\\
  mathbb{S}$ 中的每个公理，即每种形式 $(R)-$ 的规则，结论 $e$ 属于 $\\mathbb{A}_\\mathbb{S}$；\n- 如果 $e_1,\
  \ \\cdots, e_n$ 是 $\\mathbb{A}_\\mathbb{S}$ 中的元素，且\n\n\\[\n(R) \\frac{e_1 \\cdots\
  \ e_n}{e}\n\\]\n\n是 $\\mathbb{S}$ 中的规则，则 \\( e \\in \\mathbb{A}_{\\mathbb{S}} \\\
  )。确实，如果 \\( e_1, \\cdots, e_n \\) 是 \\( \\mathbb{A}_{\\mathbb{S}} \\) 中的元素，那么对每个元素都存在树\
  \ \\( \\nabla_1, \\cdots, \\nabla_n \\)，因此我们可以构造以下树：\n\n\\[\n\\frac{ \\begin{array}{c}\
  \ \\nabla_1 \\quad \\cdots \\quad \\nabla_n \\\\ e_1 \\quad \\cdots \\quad e_n \\\
  end{array} }{ e } (R)\n\\]\n\n对 \\( \\mathbb{A}_{\\mathbb{S}} \\) 的元素证明属性 \\( P\
  \ \\)，归结为证明该属性对 $\\mathbb{S}$ 中结束每个公理的所有元素都成立，并证明对于每条规则\n\n\\[\n(R) \\frac{ e_1\
  \ \\cdots e_n }{ e }\n\\]\n\n在 $\\mathbb{S}$ 中，如果所有 \\( e_1, \\cdots, e_n \\) 都满足属性\
  \ \\( P \\)，那么 \\( e \\) 也满足属性 \\( P \\)。这产生了一个基于 \\( e \\) 的推导树的归纳推理方案。在 \\( \\\
  mathbf{Exp}_2 \\) 表达式的求值树的情况下，这使我们能够通过对求值过程中执行的计算进行归纳来推理。\n\n使用此技术，并将 \\( \\mathbb{S}_{\\\
  mathbf{Exp}_2} \\) 视为定义 \\( \\mathbf{Exp}_2 \\) 表达式大步操作语义的推理系统，命题 3.1 可以通过考虑以下等价表述来证明：\n\
  \n\\[\n\\forall \\text{Env} \\vdash e \\rightsquigarrow v \\in \\mathbb{A}_{\\mathbb{S}_{\\\
  mathbf{Exp}_2}} \\quad \\underbrace{(\\forall v' \\in \\mathbb{V} \\text{ Env} \\\
  vdash e \\rightsquigarrow v' \\in \\mathbb{A}_{\\mathbb{S}_{\\mathbf{Exp}_2}} \\\
  Rightarrow v = v')}_{P(\\text{Env} \\vdash e \\rightsquigarrow v)} \\quad \\text{[3.7]}\n\
  \\]\n\n证明。设 \\( P \\) 为要证明的属性，并让我们证明该属性被所有求值树 \\( \\text{Env} \\vdash e \\rightsquigarrow\
  \ v \\in \\mathbb{A}_{\\mathbb{S}_{\\mathbf{Exp}_2}} \\) 满足。\n\n如果 \\( \\text{Env}\
  \ \\vdash e \\rightsquigarrow v \\) 是使用规则 \\( F_1 \\) 得到的，那么 \\( e = v \\) 是 \\\
  ( \\mathbf{K} \\) 中的一个常量，并且由于 \\( F_1 \\) 是可用于求值常量的唯一规则，因此 \\( v = v' \\)。\n\n如果\
  \ \\( \\text{Env} \\vdash e \\rightsquigarrow v \\) 是使用规则 \\( F_2 \\) 得到的，那么 \\\
  ( e = \\text{op } e_1 \\)，\\( \\text{Env} \\vdash e_1 \\rightsquigarrow v_1 \\)，\\\
  ( v_1 \\in \\mathbf{V} \\) 且 \\( v = \\text{op}_\\mathbf{V} v_1 \\)。根据归纳假设，如果 \\\
  ( \\text{Env} \\vdash e_1 \\rightsquigarrow v'_1 \\)，那么 \\( v'_1 = v_1 \\in \\mathbf{V}\
  \ \\)，并且由于 \\( F_2 \\) 是求值 \\( e \\) 的唯一适用规则，我们得到 \\( v' = \\text{op}_\\mathbf{V}\
  \ v'_1 = \\text{op}_\\mathbf{V} v_1 = v \\)。\n\n如果 \\( \\text{Env} \\vdash e \\\
  rightsquigarrow v \\) 是使用规则 \\( F_3 \\) 得到的，那么 \\( e = \\text{op } e_1 \\)，\\( \\\
  text{Env} \\vdash e_1 \\rightsquigarrow v_1 \\)，\\( v_1 \\in \\mathbf{E} \\) 且 \\\
  ( v = v_1 \\)。根据归纳假设，如果 \\( \\text{Env} \\vdash e_1 \\rightsquigarrow v'_1 \\)，那么\
  \ \\( v'_1 = v_1 \\in \\mathbf{E} \\)。\\( F_3 \\) 是求值 \\( e \\) 的唯一适用规则，我们得到 \\\
  ( v' = v'_1 = v_1 = v \\)。\n\n如果 \\( \\text{Env} \\vdash e \\rightsquigarrow v \\\
  ) 是使用规则 \\( F_4 \\) 得到的，那么 \\( e = e_1 \\text{ op } e_2 \\)，\\( \\text{Env} \\vdash\
  \ e_1 \\rightsquigarrow v_1 \\)，\\( \\text{Env} \\vdash e_2 \\rightsquigarrow v_2\
  \ \\)，\\( v_1, v_2 \\in \\mathbf{V} \\) 且 \\( v = v_1 \\text{ op}_\\mathbf{V} v_2\
  \ \\)。根据归纳假设，如果 \\( \\text{Env} \\vdash e_1 \\rightsquigarrow v'_1 \\)，那么 \\( v'_1\
  \ = v_1 \\in \\mathbf{V} \\)，如果 \\( \\text{Env} \\vdash e_2 \\rightsquigarrow v'_2\
  \ \\)，那么 \\( v'_2 = v_2 \\in \\mathbf{V} \\)。规则 \\( F_4 \\) 是求值 \\( e \\) 的唯一适用规则，我们得到\
  \ \\( v' = v'_1 \\text{ op}_\\mathbf{V} v'_2 = v_1 \\text{ op}_\\mathbf{V} v_2 =\
  \ v \\)。\n\n如果 \\( \\text{Env} \\vdash e \\rightsquigarrow v \\) 是使用规则 \\( F_5 \\\
  ) 得到的，那么 \\( e = e_1 \\text{ op } e_2 \\)，\\( \\text{Env} \\vdash e_1 \\rightsquigarrow\
  \ v_1 \\)，\\( v_1 \\in \\mathbf{I} \\) 且 \\( v = v_1 \\)。根据归纳假设，如果 \\( \\text{Env}\
  \ \\vdash e_1 \\rightsquigarrow v'_1 \\)，那么 \\( v'_1 = v_1 \\in \\mathbf{I} \\)。规则\
  \ \\( F_5 \\) 是求值 \\( e \\) 的唯一适用规则，我们得到 \\( v' = v'_1 = v_1 = v \\)。\n\n如果 \\(\
  \ \\text{Env} \\vdash e \\rightsquigarrow v \\) 是使用规则 \\( F_6 \\) 得到的，那么 \\( e =\
  \ e_1 \\text{ op } e_2 \\)，\\( \\text{Env} \\vdash e_1 \\rightsquigarrow v_1 \\\
  )，\\( \\text{Env} \\vdash e_2 \\rightsquigarrow v_2 \\)，\\( v_1 \\in \\mathbf{V}\
  \ \\)，\\( v_2 \\in \\mathbf{I} \\) 且 \\( v = v_2 \\)。根据归纳假设，如果 \\( \\text{Env} \\\
  vdash e_1 \\rightsquigarrow v'_1 \\)，那么 \\( v'_1 = v_1 \\in \\mathbf{V} \\)，如果 \\\
  ( \\text{Env} \\vdash e_2 \\rightsquigarrow v'_2 \\)，那么 \\( v'_2 = v_2 \\in \\mathbf{I}\
  \ \\)。规则 \\( F_6 \\) 是求值 \\( e \\) 的唯一适用规则，我们得到 \\( v' = v'_2 = v_2 = v \\)。\n\n\
  如果 \\( \\text{Env} \\vdash e \\rightsquigarrow v \\) 是使用规则 \\( F_7 \\)（或 \\( F_8\
  \ \\)）得到的，那么 \\( e \\) 是条件表达式 if \\( e_1 \\) then \\( e_2 \\) else \\( e_3 \\)，\\\
  ( \\text{Env} \\vdash e_1 \\rightsquigarrow \\text{true} \\)（或 \\( \\text{Env} \\\
  vdash e_1 \\rightsquigarrow \\text{false} \\)）以及 \\( \\text{Env} \\vdash e_2 \\\
  rightsquigarrow v \\)（或 \\( \\text{Env} \\vdash e_3 \\rightsquigarrow v \\)）。根据归纳假设，如果：\n\
  \n\\[\n\\text{Env} \\vdash e_1 \\rightsquigarrow v_1' \\quad \\text{then} \\quad\
  \ v_1' = \\text{true} \\quad (\\text{respectively } v_1' = \\text{false})\n\\]\n\
  \n和如果：\n\n\\[\n\\text{Env} \\vdash e_2 \\rightsquigarrow v' \\quad (\\text{respectively,\
  \ } \\text{Env} \\vdash e_3 \\rightsquigarrow v') \\quad \\text{then} \\quad v'\
  \ = v\n\\]\n\n规则 \\( F_7 \\)（或 \\( F_8 \\)）是求值 \\( e \\) 的唯一适用规则，我们得到 \\( v' = v\
  \ \\)。\n\n如果 \\( \\text{Env} \\vdash e \\rightsquigarrow v \\) 是使用规则 \\( F_9 \\\
  )（或 \\( F_{10} \\)）得到的，那么 \\( e = \\text{if } e_1 \\text{ then } e_2 \\text{ else\
  \ } e_3 \\)，\\( \\text{Env} \\vdash e_1 \\rightsquigarrow v_1 \\)，\\( v_1 \\in \\\
  mathbf{V} \\backslash \\mathbf{IB} \\)（或 \\( v_1 \\in \\mathbf{IE} \\））以及 \\( v\
  \ = \\text{ErrT} \\)（或 \\( v = v_1 \\)）。根据归纳假设，如果 \\( \\text{Env} \\vdash e_1 \\\
  rightsquigarrow v_1' \\)，那么 \\( v_1' = v_1 \\)。规则 \\( F_9 \\)（或 \\( F_{10} \\)）是求值\
  \ \\( e \\) 的唯一适用规则，我们得到 \\( v' = v \\)。\n\n如果 \\( \\text{Env} \\vdash e \\rightsquigarrow\
  \ v \\) 是使用规则 \\( F_{11} \\)（或 \\( F_{12} \\)）得到的，那么 \\( e = x \\) 是 \\( \\mathbf{X}\
  \ \\) 中的一个变量，满足 \\( x \\in \\text{dom}(\\text{Env}) \\)（或 \\( x \\notin \\text{dom}(\\\
  text{Env}) \\）以及 \\( v = \\text{Env}(x) \\)（或 \\( v = \\text{ErrU} \\)）。规则 \\( F_{11}\
  \ \\)（或 \\( F_{12} \\)）是求值 \\( e \\) 的唯一适用规则，我们得到 \\( v' = v \\)。\n\n如果 \\( \\text{Env}\
  \ \\vdash e \\rightsquigarrow v \\) 是使用规则 \\( F_{13} \\) 得到的，那么 \\( e = \\text{let\
  \ } x = e_1 \\text{ in } e_2 \\)，\\( \\text{Env} \\vdash e_1 \\rightsquigarrow v_1\
  \ \\)，\\( (x, v_1) \\oplus \\text{Env} \\vdash e_2 \\rightsquigarrow v_2 \\)，\\\
  ( v_1 \\in \\mathbf{V} \\) 且 \\( v = v_2 \\)。根据归纳假设，如果 \\( \\text{Env} \\vdash e_1\
  \ \\rightsquigarrow v_1' \\)，那么 \\( v_1' = v_1 \\in \\mathbf{V} \\)，如果 \\( (x, v_1)\
  \ \\oplus \\text{Env} \\vdash e_2 \\rightsquigarrow v_2' \\)，那么 \\( v_2' = v_2 \\\
  )。规则 \\( F_{13} \\) 是求值 \\( e \\) 的唯一适用规则，并且由于 \\( v_1' = v_1 \\)，则 \\( (x, v_1')\
  \ \\oplus \\text{Env} = (x, v_1) \\oplus \\text{Env} \\)，我们得到 \\( v' = v_2' = v_2\
  \ = v \\)。\n\n如果 \\( \\text{Env} \\vdash e \\rightsquigarrow v \\) 是使用规则 \\( F_{14}\
  \ \\) 得到的，那么 \\( e = \\text{let } x = e_1 \\text{ in } e_2 \\)，\\( \\text{Env} \\\
  vdash e_1 \\rightsquigarrow v_1 \\)，\\( v_1 \\in \\mathbf{IE} \\) 且 \\( v = v_1\
  \ \\)。根据归纳假设，如果 \\( \\text{Env} \\vdash e_1 \\rightsquigarrow v_1' \\)，那么 \\( v_1'\
  \ = v_1 \\in \\mathbf{IE} \\)，并且 \\( F_{14} \\) 是求值 \\( e \\) 的唯一适用规则，我们得到 \\( v'\
  \ = v_1' = v_1 = v \\)。\n\n\n\n\n若使用规则 F15（分别，F16）推导出 Env ⊢ e ↝ v，则 e = fun x ↦\
  \ e_f 且 v = ⟨x, e_f, Env⟩（分别，e = rec f x = e_f 且 v = ⟨f, x, e_f, Env⟩），且由于 F15（分别，F16）是对函数（分别，递归函数）求值的唯一适用规则，则\
  \ v = v'。\n\n若使用规则 F17（分别，F18）推导出 Env ⊢ e ↝ v，则 e = (e₁ e₂) 且：\n\nEnv ⊢ e₁ ↝ ⟨x,\
  \ e_f, Env_f⟩（分别，Env ⊢ e₁ ↝ ⟨f, x, e_f, Env_f⟩）\n\nEnv ⊢ e₂ ↝ v₂\n\n(x, v₂) ⊕ Env_f\
  \ ⊢ e_f ↝ v（分别，(f, ⟨f, x, e_f, Env_f⟩) ⊕ (x, v₂) ⊕ Env_f ⊢ e_f ↝ v）\n\n根据归纳假设，若：\n\
  \nEnv ⊢ e₁ ↝ v'₁ 则 v'₁ = ⟨x, e_f, Env_f⟩（分别 v'₁ = ⟨f, x, e_f, Env_f⟩）\n\n且若：\n\n\
  Env ⊢ e₂ ↝ v'₂ 则 v'₂ = v₂\n\n因此：\n\n(x, v'₂) ⊕ Env_f = (x, v₂) ⊕ Env_f\n\n（分别 (f,\
  \ v'₁) ⊕ (x, v'₂) ⊕ Env_f = (f, ⟨f, x, e_f, Env_f⟩) ⊕ (x, v₂) ⊕ Env_f）\n\n唯一适用规则是\
  \ F17（分别，F18），且根据归纳假设，由于：\n\n(x, v₂) ⊕ Env_f ⊢ e_f ↝ v\n\n（分别，(f, ⟨f, x, e_f, Env_f⟩)\
  \ ⊕ (x, v₂) ⊕ Env_f ⊢ e_f ↝ v）\n\n我们得到 v = v'。\n\n若使用规则 F19 推导出 Env ⊢ e ↝ v，则 e\
  \ = (e₁ e₂)，Env ⊢ e₁ ↝ v₁，Env ⊢ e₂ ↝ v₂，v₁ ∈ IF，v₂ ∈ IE 且 v = v₂。根据归纳假设，若 Env ⊢\
  \ e₁ ↝ v'₁，则 v'₁ = v₁ ∈ IF；且若 Env ⊢ e₂ ↝ v'₂，则 v'₂ = v₂ ∈ IE。规则 F19 是对 e 求值的唯一适用规则，我们得到\
  \ v' = v'₂ = v₂ = v。\n\n若使用规则 F20 推导出 Env ⊢ e ↝ v，则 e = (e₁ e₂)，Env ⊢ e₁ ↝ v₁，v₁\
  \ ∉ IF 且 v = Err_T。根据归纳假设，若 Env ⊢ e₁ ↝ v'₁，则 v'₁ = v₁ ∉ IF。规则 F20 是对 e 求值的唯一适用规则，我们得到\
  \ v' = v。\n\n下述命题建立了由求值函数 [[\\_]] 定义的语义与在方框 3.2 和方框 3.3 中定义的按值调用运算语义之间的等价性。\n\n\
  ## 命题 3.2. 等价性:\n\n∀e ∈ **Exp₂** ∀Env ∈ **E** ∀v ∈ V [[e]]_Env = v ⇔ Env ⊢ e ↝ v\n\
  \n蕴含 ⇒ 可使用 LFP 理论证明，但这超出了本书的范围。蕴含 ⇐ 的证明是采用与命题 3.1 相同的技术，通过对 Env ⊢ e ↝ v 的求值树进行归纳得到的。对于每条规则：\n\
  \n```\n(Fᵢ) Env₁ ⊢ e₁ ↝ v₁ ... Envₙ ⊢ eₙ ↝ vₙ\n--------------------------------------\n\
  Env ⊢ e ↝ v\n```\n\n在定义 **Exp₂** 中表达式的大步运算语义的推理系统 S_**Exp₂** 中，我们必须证明 [[e]]_Env\
  \ = v，在归纳假设下，即 [[e₁]]_Env₁ = v₁，等等，[[eₙ]]_Envₙ = vₙ。此证明是直接的，因为运算语义的求值规则是按照与定义求值函数完全相同的选择来定义的。\n\
  \n### 3.5. 语义属性\n\n编程语言中用于证明表达式语义属性的常用技术如下所示。\n\n#### 3.5.1. 等价表达式\n\n### 定义 3.3.\
  \ 等价表达式：\n\n两个表达式等价，当且仅当，在每个环境中，它们的求值返回相同的值：\n\n∀e₁, e₂ ∈ **Exp₂** e₁ ≡ e₂ ⇔ (∀Env\
  \ ∈ **E** [[e₁]]_Env = [[e₂]]_Env) [3.8]\n\n在本定义中，我们使用了求值函数 [[__]]_ 对表达式进行求值。用于求值大步运算语义的关系\
  \ ↝ 也可用于定义等价表达式的概念：\n\n∀e₁, e₂ ∈ **Exp₂**\ne₁ ≡ e₂ ⇔ (∀Env ∈ **E** ∀v ∈ V Env ⊢\
  \ e₁ ↝ v ⇔ Env ⊢ e₂ ↝ v) [3.9]\n\n使用第二个定义，证明 e₁ ≡ e₂ 相当于证明如何从 Env ⊢ e₁ ↝ v 的树得到\
  \ Env ⊢ e₂ ↝ v 的求值树，反之亦然。根据命题 3.2，这两种方法是等价的。我们可以轻松证明 ≡ 定义了一个同余关系，即与 **Exp₂** 的内部组成规律兼容的等价关系。例如，若\
  \ e₁ ≡ e₂ 且 e'₁ ≡ e'₂，则 (e₁ + e'₁) ≡ (e₂ + e'₂)。\n\n### 示例 3.6。\n\n我们可以证明 let x\
  \ = e1 in e2 ≡ ((fun x ↦ e2) e1)。使用定义 [3.8]，通过分情况证明，利用 e1 的求值来证得此等价性。\n\n若 [[e1]]Env\
  \ = v ∈ V，则 [[let x = e1 in e2]]Env = [[e2]](x,v)⊕Env，且由于 [[fun x ↦ e2]]Env = ⟨x,\
  \ e2, Env⟩，我们得到 [[(fun x ↦ e2) e1]]Env = [[e2]](x,v)⊕Env，从而证明结束。\n\n若 [[e1]]Env\
  \ = v ∈ IE，也可以完成证明。在此情况下，有 [[let x = e1 in e2]]Env = v = [[(fun x ↦ e2) e1]]Env'。\n\
  \n该等价性可通过考虑定义 [3.9] 来建立。首先，取一棵树 Env ⊢ let x = e1 in e2 ↝ v。有两种可能性。若此树是通过应用规则 F13\
  \ 得到的，它将采用以下形式：\n\n![](img/c9a176746efdbd36ba74d71dfdc86e86_85_0.png)\n\n且一棵 Env\
  \ ⊢ ((fun x ↦ e2) e1) ↝ v 的树可以从树 ∇1 和 ∇2 容易构造：\n\n![](img/c9a176746efdbd36ba74d71dfdc86e86_85_1.png)\n\
  \n其次，树 Env ⊢ let x = e1 in e2 ↝ v 是使用规则 F14 得到的：\n\n![](img/c9a176746efdbd36ba74d71dfdc86e86_85_2.png)\n\
  \n再次，一棵 Env ⊢ ((fun x ↦ e2) e1) ↝ v 的树可以从 ∇ 容易构造：\n\n![](img/c9a176746efdbd36ba74d71dfdc86e86_85_3.png)\n\
  \n反过来，一棵 Env ⊢ ((fun x ↦ e2) e1) ↝ v 的树可用于构造一棵 Env ⊢ let x = e1 in e2 ↝ v 的树，因为树\
  \ [3.10] 和 [3.12] 分别可从树 [3.11] 和 [3.13] 得到。\n\n#### 3.5.2. 等价环境\n\n如我们在 3.1.4 节中非正式所述，在环境\
  \ ENV 中对表达式 e 求值的结果仅取决于 ENV 与 e 的自由变量关联的值。换句话说，e 的求值结果在所有将相同值关联到 e 的自由变量的环境中都是相同的。给出此属性的正式定义需要引入变量集上等价环境的概念，如下所示：\n\
  \n### 定义 3.4. 等价环境：\n\n令 \\( F \\subseteq \\mathbf{X} \\) 为变量集，ENV₁ 和 ENV₂ 为两个环境：\n\
  \nENV\\(_1 \\equiv_F\\) ENV\\(_2 \\Leftrightarrow \\forall x \\in F \\, \\) ENV\\\
  (_1(x) = \\) ENV\\(_2(x)\\)\n\n显然，给定 \\(\\mathbf{X}\\) 的两个子集 \\( F_1 \\) 和 \\( F_2\
  \ \\)，若 \\( F_1 \\subseteq F_2 \\) 且 ENV₁ ≡_{F₂} ENV₂，则 ENV₁ ≡_{F₁} ENV₂。现在可以正式地表达，对于任何表达式\
  \ e，[[e]]_Env 的值仅取决于 ENV 中绑定到 e 的自由变量（\\(\\mathcal{F}(e)\\)）的值。\n\n### 命题 3.3。\n\
  \n对于任何表达式 \\( e \\in \\mathbf{Exp}_2 \\):\n\n\\(\\forall \\text{ENV}_1, \\text{ENV}_2\
  \ \\in \\mathbf{E}\\)\nENV\\(_1 \\equiv_{\\mathcal{F}(e)}\\) ENV\\(_2\\)\n\\(\\\
  Rightarrow\\)\n\\(\\left( \\begin{aligned} [[e]]_{\\text{ENV}_1} = [[e]]_{\\text{ENV}_2}\
  \ \\\\ \\text{or} [[e]]_{\\text{ENV}_1} = \\langle x, e', \\text{ENV}'_1 \\rangle\
  \ \\text{ and } [[e]]_{\\text{ENV}_2} = \\langle x, e', \\text{ENV}'_2 \\rangle\
  \ \\\\ \\text{and } \\text{ENV}'_1 \\equiv_{\\mathcal{F}(e)\\backslash \\{x\\}}\
  \ \\text{ENV}'_2 \\\\ \\text{or} [[e]]_{\\text{ENV}_1} = \\langle f, x, e', \\text{ENV}'_1\
  \ \\rangle \\text{ and } [[e]]_{\\text{ENV}_2} = \\langle f, x, e', \\text{ENV}'_2\
  \ \\rangle \\\\ \\text{and } \\text{ENV}'_1 \\equiv_{\\mathcal{F}(e)\\backslash\
  \ \\{x\\}} \\text{ENV}'_2 \\end{aligned} \\right)\\)\n\n此命题的证明冗长而复杂。练习 3.5 为不含函数表达式的语言建立了此属性。在此情况下，证明通过对表达式的句法结构进行归纳得到。在存在函数值的情况下，此归纳不再充分，证明需要使用不动点理论的定理。\n\
  \n### 3.6. 习题\n\n### 练习 3.1\n\n给定环境 Env，计算：\n\n\\( [[\\text{fun } x \\mapsto \\\
  text{let } y = 3 \\text{ in } x + y]]_{\\text{Env}} \\text{ and } [[\\text{let }\
  \ y = 3 \\text{ in } \\text{fun } x \\mapsto x + y]]_{\\text{Env}} \\)\n\n\n\n\n\
  ## Exercise 3.2\n\n令 Env 为由表达式 $e \\in \\mathbf{Exp}_2$ 和初始环境 $ENV_0$ 定义的以下环境：\n\

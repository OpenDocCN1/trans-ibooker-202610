- "## 4. 命令式特性的语义\n\n本章介绍了编程语言中最常见命令式特性的三种经典语义方法，处理方式通常如下（参见 [NIE 07, WIN 93]）。\n\n\
  ### 4.1. 命令式语言内核的语法\n\n我们在此考虑一种语言 Lang₃，它对应于大多数命令式语言的内核。它允许显式处理 _引用_ 的位置，即内存地址。这种语言由两种语言构成：用于定义的\
  \ Def₃ 和用于表达式的 Exp₃。两者都是第 2 章中引入的语言 Def₁ 和 Exp₁ 的变体。在表 4.1 中定义的语言 Def₃ 包含一个结构，用于将绑定引入执行环境。\n\
  \n| Construct | Description |\n|---|---|\n| d ::= let x = e; | 不可变变量的定义（x ∈ X，e\
  \ ∈ Exp₃） |\n\n**表 4.1。** 定义语言 Def₃\n\n用于表达式的语言 Exp₃ 旨在操纵值并通过为新值分配位置来修改内存。Exp₃ 的语法在表\
  \ 4.2 中给出。\n\n因此，表达式 e ∈ Exp₃ 可以是：\n- 常数 k ∈ K = Z ∪ IB；\n- 标识符 x ∈ X；\n- 通过对一个表达式（或两个表达式）应用一元（或二元）运算符得到的表达式；\n\
  - 分配 \\(\\uparrow e\\)，它保留一个位置，将 \\(e\\) 的求值结果存储在该位置，并返回该位置的引用 \\(r \\in \\mathbf{R}\\\
  )；\n- 解引用 \\(\\downarrow e\\)，它求值表达式 \\(e\\)，并且如果 \\(e\\) 的值是一个引用，则返回存储在该位置的值。\n\
  \n| Construct | Description | No. |\n|---|---|---|\n| k | 常数（\\(k \\in \\mathbf{K}\\\
  )） | (1) |\n| x | 变量（\\(x \\in \\mathbf{X}\\)） | (2) |\n| op e1 | 原始一元运算符的应用 | (3)\
  \ |\n| e1 op e2 | 原始二元运算符的应用 | (4) |\n| \\(\\uparrow\\) e | 间接，内存分配 | (5) |\n| \\\
  (\\downarrow\\) e | 解引用 | (6) |\n\n**表 4.2.** 表达式语言 Exp₃\n\n这里不描述可能的原始运算符；取决于所选语言，这些运算符可以处理整数、布尔值或引用（指针算术）。\n\
  \n常数集定义为整数、布尔值和引用的并集。使用整数表示引用，使用以下定义来表示 \\(\\mathbf{K} \\cup \\mathbf{R}\\)。\n\n\
  ```python\nclass CInt4:\n    def __init__(self, cst_int):\n        self.cst_int\
  \ = cst_int\n\nclass CRef4:\n    def __init__(self, cst_adr):\n        self.cst_adr\

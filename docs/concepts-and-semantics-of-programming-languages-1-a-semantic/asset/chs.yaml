  \ 2)]\n```\n\n#### 4.4.2. 小步语义\n\n4.4.1 节中介绍的大步运行语义处理形式为 <Mem1,c> ↦_Env Mem2 的元素，这些元素只能指定程序\
  \ c 执行后获得的内存最终状态 Mem2，而不能提供关于导致该状态的步骤的任何精确信息（此信息可以在 <Mem1,c> ↦_Env Mem2 的树中检索）。此外，由于按惯例推导树是有限对象，此语义无法解释非终止程序的执行，正如我们之前所见。小步运行语义提供了关于程序执行的更精细、更详细的信息。为了阐述它，我们将配置定义为\
  \ Lang₃ × M 中程序 c 和内存状态 Mem 的一对 <c, Mem>。然后我们使用 Box 4.3 中定义的推导系统定义了配置之间的迁移关系。\n\n\
  直观而言，<c1,Mem1> ↦_Env <c2,Mem2> 表示在状态 (Env,Mem1) 下执行程序 c1 的一步（这对应于配置 <c1,Mem1>）会导致状态\
  \ (Env,Mem2)，其中 c2 是待执行的程序其余部分：这对应于配置 <c2,Mem2>。如果配置采用形式 <skip,Mem>，则称其为终端配置，在这种情况下，内存\
  \ Mem 不再被修改。从形式上讲，通向终端配置的仅有两条规则分别对应赋值（S1）和循环退出（S7）。\n\n## Box 4.3. Lang$_3$ 的小步运行语义\n\
  \n计算序列是下述形式的序列，可能为无限：\n\n\\((c_0, \\text{Mem}_0) \\mapsto_{\\text{Env}} (c_1, \\\
  text{Mem}_1) \\mapsto_{\\text{Env}} (c_2, \\text{Mem}_2) \\mapsto_{\\text{Env}}\
  \ \\cdots\\)\n\n使得对所有 \\(i \\ge 0\\) 都存在 \\((c_i, \\text{Mem}_i) \\mapsto_{\\text{Env}}\
  \ (c_{i+1}, \\text{Mem}_{i+1})\\) 的推导树。关系 \\(\\mapsto^*_{\\text{Env}}\\) 可定义为：\\\
  ((c, \\text{Mem}) \\mapsto^*_{\\text{Env}} \\text{Mem}'\\) 当且仅当存在一个仅包含有限次迁移（或零次迁移）的计算序列\n\
  \n\\((c_0, \\text{Mem}_0) \\mapsto_{\\text{Env}} (c_1, \\text{Mem}_1) \\mapsto_{\\\
  text{Env}} (c_2, \\text{Mem}_2) \\mapsto_{\\text{Env}} \\cdots \\mapsto_{\\text{Env}}\
  \ (c_k, \\text{Mem}_k)\\)\n\n使得 \\(c = c_0\\)、\\(\\text{Mem} = \\text{Mem}_0\\)\
  \ 且 \\(\\text{Mem}' = \\text{Mem}_k\\)，并且配置 \\((c_k, \\text{Mem}_k)\\) 是终端的（即 \\\
  (c_k = \\text{skip}\\)）。如果我们知道序列的长度，如本例所示，则记作 \\((c, \\text{Mem}) \\mapsto^k_{\\\
  text{Env}} \\text{Mem}'\\)。\n\n示例 4.4.– 考虑示例 4.1 中所示程序片段的执行：\n\n```\nwhile not(↓x\
  \ = ↓y) do if ↓x ≤ ↓y then y := ↓y − ↓x else x := ↓x − ↓y\n```\n\n在状态 (Env, Mem)\
  \ = ((y, ry) ⊕ (x, rx) ⊕ Env₀, Mem₀[rx := 4][ry := 2]) 中。该程序的小步语义构建如下序列：\n\n⟨c,\
  \ Mem⟩                                  (S₆)   [[e_w]]_Env^Mem = (true, Mem)\n↦_Env\
  \ ⟨c_w ; c, Mem⟩      (S₂, S₅)   [[e]]_Env^Mem = (false, Mem)\n↦_Env ⟨c₂ ; c, Mem⟩\
  \       (S₂, S₁)   Env(x) = r_x and\n                                          [[↓x\
  \ - ↓y]]_Env^Mem = (2, Mem)\n↦_Env ⟨skip ; c, Mem[rx := 2]⟩   (S₃)\n↦_Env ⟨c, Mem[rx\
  \ := 2]⟩          (S₇)   [[e_w]]_Env^Mem[rx:=2]\n                              \
  \            = (false, Mem[rx := 2])\n↦_Env ⟨skip, Mem[rx := 2]⟩\n\n因此我们得到 ⟨c, Mem⟩\
  \ ↦^*_Env Mem[rx := 2]。\n\n#### 4.4.3. 运行语义的表达能力\n\n如示例 4.3 和 4.4 所示，当用于描述 Lang₃\
  \ 中终止程序的执行时，大步和小步运行语义产生相同的结果。这种语义等价性在 4.5.4 节中得到证明。尽管如此，由于它对程序执行提供了更精细的描述，小步语义可以处理某些编程语言的特性，这些特性无法使用大步语义描述。并行性就是这样一个特性。考虑表示两个程序\
  \ c₁ 和 c₂ 并行执行的结构 c₁ || c₂。大步语义仅允许我们描述程序 c₁ 和 c₂ 执行后的内存状态；在这种方法中，执行 c₁ || c₂ 的唯一可能方式是先执行\
  \ c₁ 再执行 c₂，或者先执行 c₂ 再执行 c₁：\n\n(C_P^1) ⟨Mem, c₁⟩ ↦_Env Mem'   ⟨Mem', c₂⟩ ↦_Env\
  \ Mem''\n           ---------------------------------------------\n            \
  \        ⟨Mem, c₁ || c₂⟩ ↦_Env Mem''\n(C_P^2) ⟨Mem, c₂⟩ ↦_Env Mem'   ⟨Mem', c₁⟩\
  \ ↦_Env Mem''\n           ---------------------------------------------\n      \
  \              ⟨Mem, c₁ || c₂⟩ ↦_Env Mem''\n\n例如，使用这些规则，程序 c 仅有两种可能的执行：\n\nx :=\
  \ 2 || (x := 3 ; x := ↓ x * ↓ x)\n\n这给出：\n\n⟨Mem, c⟩ ↦_Env Mem[Env(x) := 2] 和 ⟨Mem,\
  \ c⟩ ↦_Env Mem[Env(x) := 9]\n\n这种语义无法考虑 c1 和 c2 执行之间的可能交错。另一方面，小步语义允许我们描述程序仅一部分的执行：\n\
  \n```\n(S_P^1) <c1, Mem> ↦_Env <c1', Mem'>\n-----------------------------\n<c1 ||\
  \ c2, Mem> ↦_Env <c1' || c2, Mem'>\n```\n\n```\n(S_P^2) <c2, Mem> ↦_Env <c2', Mem'>\n\
  -----------------------------\n<c1 || c2, Mem> ↦_Env <c1 || c2', Mem'>\n```\n\n\
  ```\n(S_P^3) <c1, Mem> ↦_Env <skip, Mem'>     (S_P^4) <c2, Mem> ↦_Env <skip, Mem'>\n\
  ----------------------------------     ----------------------------------\n<c1 ||\
  \ c2, Mem> ↦_Env <c2, Mem'>       <c1 || c2, Mem> ↦_Env <c1, Mem'>\n```\n\n这些规则可用于描述程序\
  \ c 的以下三种执行：\n\n```\n<c, Mem> ↦_Env <x := 3 ; x := ↓ x * ↓ x, Mem[Env(x) := 2]>\n\
  \    ↦_Env <skip ; x := ↓ x * ↓ x, Mem[Env(x) := 3]>\n    ↦_Env <x := ↓ x * ↓ x,\
  \ Mem[Env(x) := 3]>\n    ↦_Env <skip, Mem[Env(x) := 9]>\n\n<c, Mem> ↦_Env <x :=\
  \ 2 || (skip ; x := ↓ x * ↓ x), Mem[Env(x) := 3]>\n    ↦_Env <x := 2 || x := ↓ x\
  \ * ↓ x, Mem[Env(x) := 3]>\n    ↦_Env <x := 2, Mem[Env(x) := 9]>\n    ↦_Env <skip,\
  \ Mem[Env(x) := 2]>\n\n<c, Mem> ↦_Env <x := 2 || (skip ; x := ↓ x * ↓ x), Mem[Env(x)\
  \ := 3]>\n    ↦_Env <x := 2 || x := ↓ x * ↓ x, Mem[Env(x) := 3]>\n    ↦_Env <x :=\
  \ ↓ x * ↓ x, Mem[Env(x) := 2]>\n    ↦_Env <skip, Mem[Env(x) := 4]>\n```\n\n### 4.5.\
  \ 语义属性\n\n在本节中，我们将介绍先前给出的语义定义的应用，以及使用这些形式主义的几种经典证明技术。\n\n#### 4.5.1. 等价程序\n\n由于运行语义描述程序行为，因此可以识别“等价”程序，即执行终止并导致相同内存状态的程序。使用大步运行语义，这种等价关系可以正式定义如下：\n\
  \n\n### 定义 4.1. 等价程序：两个程序 \\(c_1\\) 和 \\(c_2\\) 是等价的，记作 \\(c_1 \\equiv c_2\\)，当且仅如果：\n\
  \n\\(\\forall Env \\in \\mathbf{E} \\forall Mem, Mem' \\in \\mathbf{M} \\langle\
  \ Mem, c_1 \\rangle \\Rightarrow_{Env} Mem' \\Leftrightarrow \\langle Mem, c_2 \\\
  rangle \\Rightarrow_{Env} Mem'\\)\n\n### 示例 4.5. 考虑以下两个程序：\n\n\\(c_1 : (if \\ e\
  \ \\ then \\ c \\ else \\ c') ; c'' \\quad c_2 : if \\ e \\ then \\ c; c'' \\ else\
  \ \\ c' ; c''\\)\n\n要证明 \\(c_1 \\equiv c_2\\)，我们从 \\(\\langle Mem, c_2 \\rangle\
  \ \\Rightarrow_{Env} Mem'\\) 的推导树构建 \\(\\langle Mem, c_1 \\rangle \\Rightarrow_{Env}\
  \ Mem'\\) 的推导树，反之亦然。为此，我们考察构建此类树的所有可能规则，并区分 \\(e\\) 的两种可能求值情况。然后，我们只需将推导树“组合”起来即可。如果\
  \ \\(e\\) 的求值结果为 \\(true\\)，那么，从树\n\n![](img/c9a176746efdbd36ba74d71dfdc86e86_112_0.png)\n\
  \n我们可以得到树\n\n![](img/c9a176746efdbd36ba74d71dfdc86e86_112_1.png)\n\n反之亦然。当 \\(e\\\
  ) 的求值结果为 \\(false\\) 时，适用类似的推理。\n\n### 示例 4.6. 考虑以下两个程序：\n\n\\(c_1 : c ; (if \\\
  \ e \\ then \\ c' else \\ c'') \\quad c_2 : if \\ e \\ then \\ c; c' else \\ c;\
  \ c''\\)\n\n要证明 \\(c_1 \\not\\equiv c_2\\)，只需构造一个反例，其中 \\(c\\)、\\(c'\\) 和 \\(c''\\\
  ) 分别为指令 \\(x := 0\\)、\\(x := \\downarrow x + 1\\) 和 \\(x := \\downarrow x + 5\\\
  )，且 \\(e\\) 为表达式 \\(1 \\le \\downarrow x\\)。从状态 \\((Env, Mem)\\) 出发，其中 \\(Env(x)\
  \ = r_x \\in \\mathbf{R}\\) 且 \\(Mem(r_x) = 2\\)，我们得到：\n\n\\(\\langle Mem, c ; (if\
  \ \\ e \\ then \\ c' else \\ c'') \\rangle \\Rightarrow_{Env} Mem_1 \\text{ with\
  \ } Mem_1(x) = 5\\)\n\n\\(\\langle Mem, if \\ e \\ then \\ c; c' else \\ c; c''\
  \ \\rangle \\Rightarrow_{Env} Mem_2 \\text{ with } Mem_2(x) = 1\\)\n\n#### 4.5.2.\
  \ 程序终止\n\n描述程序执行的推导树的存在保证该执行是有限的。由于所有推导树都是有限的，使用大步操作语义证明程序 $c$ 从初始状态 $(\\text{Env},\
  \ \\text{Mem})$ 终止，归结为证明存在一个内存状态 $\\text{Mem}'$，使得 $\\langle \\text{Mem}, c \\rangle\
  \ \\rightarrow_{\\text{Env}} \\text{Mem}'$。\n\n### 示例 4.7. 回到示例 4.1 中使用的程序片段：\n\n\
  while not(↓x = ↓y) do if ↓x ≤↓y then y := ↓y - ↓x else x := ↓x - ↓y\n\n让我们证明，当从任何在位置\
  \ $x$ 和 $y$ 处存储严格正整数值的内存状态开始时，该程序的执行会终止。正式地，我们必须证明：\n\n\\(\\forall \\text{Env} \\\
  in \\mathbf{E} \\forall \\text{Mem} \\in \\mathbf{M}\\)\n\\((\\text{Mem}(\\text{Env}(x))\
  \ \\ge 1 \\text{ and } \\text{Mem}(\\text{Env}(y)) \\ge 1) \\Rightarrow \\exists\
  \ \\text{Mem}' \\in \\mathbf{M} \\langle \\text{Mem}, c \\rangle \\rightarrow_{\\\
  text{Env}} \\text{Mem}'\\)\n\n要证明此性质，给定环境 $\\text{Env} \\in \\mathbf{E}$，我们定义集合：\n\
  \n\\(M_{\\text{Env}} = \\{ \\text{Mem} \\mid \\text{Mem}(\\text{Env}(x)) \\ge 1\
  \ \\text{ and } \\text{Mem}(\\text{Env}(y)) \\ge 1 \\} \\subseteq \\mathbf{M}\\\
  )\n\n并且我们必须证明：\n\n\\(\\forall \\text{Mem} \\in M_{\\text{Env}} \\exists \\text{Mem}'\
  \ \\in \\mathbf{M} \\langle \\text{Mem}, c \\rangle \\rightarrow_{\\text{Env}} \\\
  text{Mem}'\\)\n\n该证明通过良好归纳法获得。首先，我们在 $M_{\\text{Env}}$ 的元素上定义一个关系 $\\preceq_{\\\
  text{Env}}$。然后，我们证明该关系是良基序关系，即不存在根据 $\\preceq_{\\text{Env}}$ 的严格递减无限值序列。最后，我们证明对于任何元素\
  \ $\\text{Mem} \\in M_{\\text{Env}}$，在对所有 $\\text{Mem}' \\prec_{\\text{Env}} \\\
  text{Mem}$ 的假设 $P_{\\text{Env}}(\\text{Mem}')$ 下，我们可以得到 $P_{\\text{Env}}(\\text{Mem})$。\n\
  \n由于循环体每次执行时，与两个变量 $x$ 和 $y$ 相关的值中至少有一个会减小，因此 $M_{\\text{Env}}$ 上的关系 $\\preceq_{\\\
  text{Env}}$ 可定义如下：\n\n\\(\\text{Mem}_1 \\preceq_{\\text{Env}} \\text{Mem}_2 \\Leftrightarrow\
  \ \\left( \\begin{array}{l} \\text{Mem}_1(\\text{Env}(x)) \\le \\text{Mem}_2(\\\
  text{Env}(x)) \\\\ \\text{and } \\text{Mem}_1(\\text{Env}(y)) \\le \\text{Mem}_2(\\\
  text{Env}(y)) \\\\ \\text{and } \\forall z \\in \\mathbf{X} \\setminus \\{x, y\\\
  } \\text{ Mem}_1(\\text{Env}(z)) = \\text{Mem}_2(\\text{Env}(z)) \\end{array} \\\
  right)\\)\n\n与 \\(\\preceq_{\\text{Env}}\\) 相关的严格序 \\(\\prec_{\\text{Env}}\\) 由此定义为：\n\
  \n\\(\\text{Mem}_1 \\prec_{\\text{Env}} \\text{Mem}_2 \\Leftrightarrow \\big( \\\
  big( \\text{Mem}_1(\\text{Env}(x)) \\neq \\text{Mem}_2(\\text{Env}(x)) \\text{ or\
  \ } \\text{Mem}_1(\\text{Env}(y)) \\neq \\text{Mem}_2(\\text{Env}(y)) \\big) \\\
  text{ and } \\text{Mem}_1(\\text{Env}(x)) \\le \\text{Mem}_2(\\text{Env}(x)) \\\
  text{ and } \\text{Mem}_1(\\text{Env}(y)) \\le \\text{Mem}_2(\\text{Env}(y)) \\\
  text{ and } \\forall z \\in \\mathbf{X} \\setminus \\{x, y\\} \\text{ Mem}_1(\\\
  text{Env}(z)) = \\text{Mem}_2(\\text{Env}(z)) \\big)\\)\n\n在下面的证明中，有用的是注意到如果 Mem1\
  \ \\(\\prec_{\\text{Env}}\\) Mem2，则 Mem1(Env(x)) < Mem2(Env(x)) 或 Mem1(Env(y)) <\
  \ Mem2(Env(y))。关系 \\(\\preceq_{\\text{Env}}\\) 明确定义了一个序关系（即它是自反的、反对称的和传递的）。\n\n\
  让我们证明 \\(\\preceq_{\\text{Env}}\\) 是良基的。\n\n假设存在一个严格递减的无限序列：\n\n- Mem1 \\(\\succ_{\\\
  text{Env}}\\) Mem2 \\(\\succ_{\\text{Env}}\\) \\(\\cdots\\)\n\n\\(M_{\\text{Env}}\\\
  ) 中的内存仅将严格正值关联到变量 \\(x\\) 和 \\(y\\)，且这些值本身会减小或保持不变。由于不存在严格正整数的无限递减序列，因此存在某个秩 \\\

  \ } \\text{Mem}(r_x) \\neq 1 \\\\ \\text{Mem} & \\text{if } \\text{Mem}(r_x) = 1\
  \ \\end{cases}\\)\n```\n\n并且由于 \\(\\llbracket c_3 \\rrbracket_{\\text{Env}}(\\text{Mem})(r_x)\
  \ = \\text{Mem}(r_x) - 1\\)，我们有：\n\n```\n\\(F^2(\\perp) : \\text{Mem} \\mapsto \\\
  begin{cases} \\text{undef} & \\text{if } \\text{Mem}(r_x) \\neq 1 \\text{ and }\
  \ \\text{Mem}(r_x) \\neq 2 \\\\ \\llbracket c_3 \\rrbracket_{\\text{Env}}(\\text{Mem})\

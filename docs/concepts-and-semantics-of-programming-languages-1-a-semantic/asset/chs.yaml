  \ (int * const4) list\n```\n\n### 4.3. 定义的求值\n\n语言 Def3 引入的定义仅修改执行环境。其语义定义为：\n\n\
  (Env, Mem) --let x = e;-->_{Def_3} ((x, v) \\oplus Env, Mem') if [[e]]^{Mem}_{Env}\
  \ = (v, Mem')\n\n当 [[e]]^{Mem}_{Env} = (v, Mem') 时，该定义将绑定 (x, v) 添加到环境 Env 中，并将内存设置为\
  \ Mem'。使用有限定义序列 d = [d_1, ..., d_n] 和初始状态 (Env_0, Mem_0)，该关系计算状态 (Env_n, Mem_n)：\n\
  \n((Env_0, Mem_0) -->_{d_1 --> Def_3} (Env_1, Mem_1) -->_{d_2 --> Def_3} ... -->_{d_n\
  \ --> Def_3} (Env_n, Mem_n)\n\n该转换序列表示为：(Env_0, Mem_0) -->*_{d} Def_3 (Env_n, Mem_n)。\n\
  \n由一个定义（或定义列表）生成的状态转换定义如下。随着语言 Def_3 的扩展，这些定义将进一步完善。\n\n```python\ndef trans_def4(e,\
  \ d):\n    env, mem = e\n    if isinstance(d, Let_def4):\n        v, mem1 = eval_exp4(env,\
  \ mem, d.exp)\n        return (ajout_liaison_env(env, d.symb, v), mem1)\n    if\
  \ ...\n        raise ValueError\n\ndef trans_def4_exec(e, ld):\n    if len(ld) ==\
  \ 0: return e\n    else: return trans_def4_exec(trans_def4(e, ld[0]), ld[1:])\n\
  ```\n\n```ocaml\nlet trans_def4 (env, mem) d = match d with\n| Let_def4 (x, e) ->\
  \ (match eval_exp4 env mem e with\n| (VCste4(v), mem1) -> ((ajout_liaison_env env\
  \ x v), mem1))\n| ...\nval trans_def4 : ('a * 'a valeurs4) list * (int * const4)\
  \ list -> 'a def4\n-> ('a * 'a valeurs4) list * (int * const4) list\n\nlet trans_def4_exec\
  \ (env, mem) ld = (List.fold_left trans_def4 (env, mem) ld)\nval trans_def4_exec\
  \ : ('a * 'a valeurs4) list * (int * const4) list\n-> 'a def4 list -> ('a * 'a valeurs4)\
  \ list * (int * const4) list\n```\n\n与第 2 章介绍的定义语言 Def1 不同，Def3 不包含形式为 var x = e;\
  \ 的命令来定义可变变量。然而，从语义角度来看，可以使用 ↑ 运算符获得相同的效果。考虑一个表达式 e，其求值产生一个值 v 且不修改内存，即满足 [[e]]^Mem_Env\
  \ = (v, Mem)，则有 [[↑e]]^Mem_Env = (r, Mem[r := v])，因此：\n\n(Env, Mem) var x = e; ==>Def1\
  \ ((x,r) ⊕ Env, Mem[r := v])\n(Env, Mem) let x = ↑e; ==>Def3 ((x,r) ⊕ Env, Mem[r\
  \ := v])\n\n### 示例 4.2.– 框 4.1 中的转换序列展示了，从以下定义序列开始：\n\nlet x1 = ↑4; let x2 = x1;\

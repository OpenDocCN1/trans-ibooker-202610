  \ exp, pgm1, pgm2):\n        self.exp = exp\n        self.pgm1 = pgm1\n        self.pgm2\
  \ = pgm2\n\nclass IAffect4:\n    def __init__(self, symb, exp):\n        self.symb\
  \ = symb\n        self.exp = exp\n\nclass ISkip4:\n    pass\n\nclass ISeq4:\n  \
  \  def __init__(self, pgm1, pgm2):\n        self.pgm1 = pgm1\n        self.pgm2\

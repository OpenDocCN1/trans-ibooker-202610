  \ 2); (0, CInt 5)])\n```\n\n#### 4.6.2. 过程\n\n##### 4.6.2.1. 定义语言\n\n向 Def3 添加了一个新的语法构造：proc\
  \ p(x){c}。该构造定义了一个名为 p（标识符）的过程，该过程具有一个由变量 x 表示的参数和一个主体，主体是 Lang3 中的程序 c。为了简单起见，我们将讨论限制在只有一个参数的过程。下面的描述可以轻松扩展到具有多个参数的过程，例如将单个参数替换为\
  \ n 元组。对于没有参数的过程，参数是“空”类型的值。\n\n我们实现了在 Def3 中用于定义过程的语法构造。使用 Python，我们定义以下类：\n\n\
  ```python\nclass Let_proc4:\n    def __init__(self,name,param,pgm):\n        self.name\
  \ = name\n        self.param = param\n        self.pgm = pgm\n```\n\n使用 OCaml，和类型\
  \ ’a def4（参见第 4.1 节）的定义通过以下构造函数进行扩展：\n\n```ocaml\n| Let_proc4 of ’a * ’a * ’a pgm4\n\
  ```\n\n过程的执行是通过对其进行调用（也称为激活）来触发的。如第 3 章中描述函数应用时，确定过程应在其下执行的状态有几种可能的选择。\n\n使用静态（或词法）作用域机制，过程在其定义时的状态中执行（并为其参数添加绑定），因此与过程关联的值是包含其定义环境的闭包。\n\
  \n使用动态作用域机制，过程在调用时的状态中执行，因此与过程关联的值是仅包含参数名称和过程主体的闭包。\n\n在这两种情况下，将过程名称绑定到其值的绑定被添加到执行环境中，从而允许定义递归过程。表\
  \ 4.5 描述了在两种情况下如何扩展关系 →Def₃。\n\n| 作用域 | 规则 |\n|---|---|\n| 静态作用域 | \\( (Env, Mem)\
  \ \\frac{proc p(x)\\{c\\}}{\\rightarrow Def_3} ((p, \\langle x, c, Env \\rangle)\
  \ \\oplus Env, Mem) \\) |\n| 动态作用域 | \\( (Env, Mem) \\frac{proc p(x)\\{c\\}}{\\\
  rightarrow Def_3} ((p, \\langle x, c \\rangle) \\oplus Env, Mem) \\) |\n\n表 4.5.\
  \ 关系 →Def₃ 的扩展：过程\n\n允许定义过程需要定义与闭包对应的新值。首先考虑静态作用域机制。使用 Python，我们只需添加以下类：\n\n```python\n\
  class Ferm4:\n    def __init__(self,param,pgm,env):\n        self.param = param\n\
  \        self.pgm = pgm\n        self.env = env\n```\n\n使用 OCaml，和类型 ’a valeurs4（参见第\
  \ 4.2 节）必须通过以下构造函数进行扩展：\n\n```ocaml\n| Ferm4 of ’a * ’a pgm4 * (’a * ’a valeurs4)\
  \ list\n```\n\n\n\n\n\n采用动态作用域机制，使用 Python 时，我们添加以下类：\n\n```\nclass Ferm4:\n   \
  \ def __init__(self,param,pgm):\n        self.param = param\n        self.pgm =\
  \ pgm\n```\n\n而使用 OCaml 时，和类型 ’a valeurs4 的定义通过构造函数进行扩展：\n\n```\n| Ferm4 of ’a *\
  \ ’a pgm4\n```\n\n为了在考虑过程定义的同时扩展关系 →Def3，我们需要修改在第 4.3 节中定义的函数 trans_def4。\n\n使用\
  \ Python 时，在静态作用域的情况下，这是通过将以下指令插入函数代码中完成的：\n\n```\nif isinstance(d,Let_proc4):\n\
  \    return (ajout_liaison_env(env,d.name,Ferm4(d.symb,d.pgm,d.env)),mem)\n```\n\
  \n而在动态作用域的情况下，插入以下指令：\n\n```\nif isinstance(d,Let_proc4):\n    return (ajout_liaison_env(env,d.name,Ferm4(d.symb,d.pgm)),mem)\n\
  ```\n\n使用 OCaml 时，在静态作用域下，我们使用以下模式扩展函数 trans_def4：\n\n```\n| Let_proc4(p,x,c) ->\
  \ ((ajout_liaison_env env p (Ferm4(x,c,env))),mem)\n```\n\n在动态作用域下，我们添加以下模式：\n\n\
  ```\n| Let_proc4(p,x,c) -> ((ajout_liaison_env env p (Ferm4(x,c))),mem)\n```\n\n\
  ##### 4.6.2.2. 过程调用机制\n\n###### 4.6.2.2.1. 按值调用\n\n在调用过程时，按值调用机制传递一个值，该值是在调用的当前环境中对表达式\
  \ e 求值得到的结果。使用此机制，Lang$_3$ 中过程调用的语法结构如下所示：\n\ncall p(e)\n\n为了在 Python 中添加过程调用的语法结构，我们定义以下类：\n\
  \n```\nclass ICall4:\n    def __init__(self,name,exp):\n        self.name = name\n\
  \        self.exp = exp\n```\n\n使用 OCaml 时，和类型 ’a pgm4（参见第 4.1 节）的定义通过以下构造函数进行扩展：\n\
  \n```\n| ICall4 of ’a * ’a exp4\n```\n\n方框 4.6 介绍了该调用机制的不同语义。在第一种版本中，传递的值被视为常量：参数与该值的绑定直接出现在环境中（因此该值不能被修改）。\n\
  \n在第二种版本中，过程的参数被视为过程局部的可变变量，并使用传递的值进行初始化。在此情况下，会进行一次分配，参数引用该位置，并且该位置的内容可以由过程体中的指令修改。与块的情况一样，一旦过程执行完毕，该引用可能仍然可访问，前提是它被赋值给了过程“外部”的变量。这两种版本均针对静态和动态作用域机制进行了介绍。\n\
  \n### 按值调用：常量参数\n\n静态作用域   \\( (C_9) \\)   \n\\( \\text{Env}(p) = \\langle x, c,\
  \ \\text{Env}_p \\rangle \\quad \\llbracket e \\rrbracket^{\\text{Mem}}_{\\text{Env}}\
  \ = (v, \\text{Mem}') \\\\ \\text{Env}' = (p, \\langle x, c, \\text{Env}_p \\rangle)\
  \ \\oplus \\langle x, v \\rangle \\oplus \\text{Env}_p \\\\ \\langle \\text{Mem}',\
  \ c \\rangle \\rightarrow_{\\text{Env}'} \\text{Mem}'' \\\\ \\hline \\langle \\\
  text{Mem}, \\text{call } p(e) \\rangle \\rightarrow_{\\text{Env}} \\text{Mem}''\
  \ \\)\n\n动态作用域   \\( (C_9) \\)   \n\\( \\text{Env}(p) = \\langle x, c \\rangle \\\
  quad \\llbracket e \\rrbracket^{\\text{Mem}}_{\\text{Env}} = (v, \\text{Mem}') \\\
  \\ \\text{Env}' = (p, \\langle x, c \\rangle) \\oplus \\langle x, v \\rangle \\\
  oplus \\text{Env} \\\\ \\langle \\text{Mem}', c \\rangle \\rightarrow_{\\text{Env}'}\
  \ \\text{Mem}'' \\\\ \\hline \\langle \\text{Mem}, \\text{call } p(e) \\rangle \\\
  rightarrow_{\\text{Env}} \\text{Mem}'' \\)\n\n### 按值调用：可变参数\n\n静态作用域   \\( (C_9)\
  \ \\)   \n\\( \\text{Env}(p) = \\langle x, c, \\text{Env}_p \\rangle \\quad \\llbracket\
  \ e \\rrbracket^{\\text{Mem}}_{\\text{Env}} = (v, \\text{Mem}') \\\\ \\text{Env}'\
  \ = (p, \\langle x, c, \\text{Env}_p \\rangle) \\oplus \\langle x, r_x \\rangle\
  \ \\oplus \\text{Env}_p \\\\ \\langle \\text{Mem}'[r_x := v], c \\rangle \\rightarrow_{\\\
  text{Env}'} \\text{Mem}'' \\\\ \\hline \\langle \\text{Mem}, \\text{call } p(e)\
  \ \\rangle \\rightarrow_{\\text{Env}} \\text{Mem}'' \\)\n\n动态作用域   \\( (C_9) \\\
  )   \n\\( \\text{Env}(p) = \\langle x, c \\rangle \\quad \\llbracket e \\rrbracket^{\\\
  text{Mem}}_{\\text{Env}} = (v, \\text{Mem}') \\\\ \\text{Env}' = (p, \\langle x,\
  \ c \\rangle) \\oplus \\langle x, r_x \\rangle \\oplus \\text{Env} \\\\ \\langle\
  \ \\text{Mem}'[r_x := v], c \\rangle \\rightarrow_{\\text{Env}'} \\text{Mem}'' \\\
  \\ \\hline \\langle \\text{Mem}, \\text{call } p(e) \\rangle \\rightarrow_{\\text{Env}}\
  \ \\text{Mem}'' \\)\n\n### 按引用调用\n\n静态作用域   \\( (C_9) \\)   \n\\( \\text{Env}(p)\
  \ = \\langle x_p, c, \\text{Env}_p \\rangle \\quad \\text{Env}(x) = r_x \\in \\\
  mathbf{R} \\\\ \\text{Env}' = (p, \\langle x_p, c, \\text{Env}_p \\rangle) \\oplus\
  \ \\langle x_p, r_x \\rangle \\oplus \\text{Env}_p \\\\ \\langle \\text{Mem}, c\
  \ \\rangle \\rightarrow_{\\text{Env}'} \\text{Mem}' \\\\ \\hline \\langle \\text{Mem},\
  \ \\text{call } p(x) \\rangle \\rightarrow_{\\text{Env}} \\text{Mem}' \\)\n\n动态作用域\
  \   \\( (C_9) \\)   \n\\( \\text{Env}(p) = \\langle x_p, c \\rangle \\quad \\text{Env}(x)\
  \ = r_x \\in \\mathbf{R} \\\\ \\text{Env}' = (p, \\langle x_p, c \\rangle) \\oplus\
  \ \\langle x_p, r_x \\rangle \\oplus \\text{Env} \\\\ \\langle \\text{Mem}, c \\\
  rangle \\rightarrow_{\\text{Env}'} \\text{Mem}' \\\\ \\hline \\langle \\text{Mem},\
  \ \\text{call } p(x) \\rangle \\rightarrow_{\\text{Env}} \\text{Mem}' \\)\n\n###\
  \ 方框 4.6. 大步操作语义：过程调用\n\n使用静态作用域机制和按常量参数传值调用，我们向 Python 函数 exec_pgm4（参见第 4.4.1 节）的代码中添加以下指令：\n\
  \n```\nif isinstance(c, ICall4):\n    v,mem1 = eval_exp4(env,mem,c.exp)\n    fp\
  \ = valeur_de(env,c.name)\n    if fp is None: raise ValueError\n    if isinstance(fp,\
  \ Ferm4) and isinstance(v, VCste4):\n        enve = ajout_liaison(ajout_liaison_env(fp.env,fp.param,v),\n\
  \            c.name,fp)\n        return exec_pgm4(enve,mem1,fp.pgm)\n    raise ValueError\n\
  raise ValueError\n```\n\n在这种情况下，使用 OCaml 时，函数 exec_pgm4 的定义被扩展以包含以下模式：\n\n```\n\
  | ICall4(p,e) -> (match ((valeur_de env p),(eval_exp4 env mem e)) with\n    (Some(Ferm4(xp,cp)),(VCste4(v),mem1))\n\
  \    -> let enve = (ajout_liaison_env\n        (ajout_liaison_env envp xp (VCste4(v)))\n\
  \        p (Ferm4(xp,cp,envp)))\n    in (exec_pgm4 enve mem1 cp)\n| _ -> raise Exec_Error)\n\
  ```\n\n使用动态作用域机制和按常量参数传值调用，我们向 Python 函数 exec_pgm4 的代码中添加以下指令：\n\n```\nif isinstance(c,\
  \ ICall4):\n    v,mem1 = eval_exp4(env,mem,c.exp)\n    fp = valeur_de(env,c.name)\n\
  \    if fp is None:\n        raise ValueError\n    if isinstance(fp, Ferm4) and\
  \ isinstance(v, VCste4):\n        enve = ajout_liaison(ajout_liaison_env(env,fp.param,v),\n\
  \            c.name,fp)\n        return exec_pgm4(enve,mem1,fp.pgm)\n    raise ValueError\n\
  ```\n\n在这种情况下，使用 OCaml 时，函数 exec_pgm4 的定义被扩展以包含以下模式：\n\n```\n| ICall4(p,e) -> (match\
  \ ((valeur_de env p),(eval_exp4 env mem e)) with\n    (Some(Ferm4(xp,cp)),(VCste4(v),mem1))\n\
  -> let env = (ajout_liaison_env\n(ajout_liaison_env env xp (VCste4(v)))\np (Ferm4(xp,cp)))\n\
  in (exec_pgm4 env mem1 cp)\n| _ -> raise Exec_Error)\n```\n\n我们仅考虑上述两种情况的实现。其他情况（可变参数和按引用调用）以类似方式获得。\n\
  \n###### 4.6.2.2.2. 按引用调用\n\n按引用调用机制向过程传递一个值，该值是调用当前环境中存在的可变变量的引用。使用此机制，Lang3 中过程调用的语法结构为：\n\
  \ncall p(x)\n\n其中 x 是调用环境中的一个可变变量。执行 p 的过程体时，其内容可能会被直接修改。\n\n该机制的正式定义在方框 4.6 中给出。与按值调用机制不同（在按值调用中，参数被视为过程局部变量），此情况下不进行分配。该机制将在第\
  \ 7.4 节中更详细地讨论，我们将在其中解释使用指针的实现。\n\n### 4.7. 其他方法\n\n到目前为止，只考虑了小步和大步操作语义。两种情况都涉及定义一个转换关系，以表征由程序执行（以及程序中出现的表达式的求值，因为所选表达式语言允许副作用）导致的状态转换。在本节中，我们介绍了命令式语言语义的另外两种经典方法。为求简化，我们假设表达式的求值不会修改内存的状态，并写作\
  \ [[e]]Env Mem = v 以表示在状态 (Env, Mem) 中对 e 的求值返回值 v。我们使用语言 Lang3（不包含块和过程），其语法定义在表\
  \ 4.3 中。\n\n#### 4.7.1. 直表示语义\n\n##### 4.7.1.1. 与程序关联的偏函数\n\n函数 exec_pgm4（在第 4.4.1\
  \ 节中定义）计算在状态 (Env, Mem) 中执行程序 c 后获得的内存状态 Mem'。然而，如我们所述，exec_pgm4 不对应于一个数学函数，因为\n\
  \n\n\nMem' 的计算不一定终止。我们现在希望用一个真正的数学函数来定义这个语义：\n\n[[ ]] : (E x Lang_3) -> (M -> M)\n\
  \n这是直译语义的目的。在这个框架内，关于程序及其执行的某些属性更容易证明，该框架在 [STO 77] 中有详细阐述。\n\n当然，这个函数 [[ ]] 与操作语义必须在语义上等价。用正式术语说：\n\
  \n```\nforall Env in E forall c in Lang_3 [[c]]_Env(Mem) = Mem' <-> <Mem, c> -->_Env\
  \ Mem'\nforall Mem, Mem' in M\n[4.13]\n```\n\n因此，[[c]]_Env 是一个从 M 到 M（记作 M -> M）的偏函数，它给定一个内存状态\
  \ Mem，在有限时间内计算出在环境 Env 中执行程序 c 后得到的内存状态 Mem'。如果程序 c 在状态 (Env, Mem) 中的执行不终止，则函数 [[c]]_Env\
  \ 对 Mem 未定义（我们用 [[c]]_Env(Mem) = undef 表示这种情况）。因此，直译语义定义了一个函数 [[ ]]_Env，为每个程序 c\
  \ 提供一个描述执行 c 时发生的内存状态转换的函数。这个函数 [[ ]]_Env 是偏函数，而且也是组合式的：函数 [[c]]_Env 是通过组合与 c 的组件对应的函数得到的。exec_pgm\
  \ 的情况并非如此，它通过在不同状态下递归使用相同指令的语义来定义某个状态下 while e do c 的语义，该状态是在循环体执行一次后得到的。\n\n```\n\
  [[x := e]]_Env = Mem |-> { Mem[r := v] if Env(x) = r in R and v = [[e]]_Env^Mem\
  \ in V\n                             undef      otherwise\n\n[[skip]]_Env = id =\
  \ Mem |-> Mem\n\n[[c1 ; c2]]_Env = [[c2]]_Env o [[c1]]_Env = Mem |-> [[c2]]_Env([[c1]]_Env(Mem))\n\
  \n[[if e then c1 else c2]]_Env = cond([[e]]_Env, [[c1]]_Env, [[c2]]_Env)\ncond :\
  \ (M -> IB) x (M -> M) x (M -> M) -> (M -> M)\n\ncond(fb, f1, f2) = Mem |-> { f1(Mem)\
  \ if fb(Mem) = 1\n                             f2(Mem) if fb(Mem) = 0\n        \
  \                     undef    if fb(Mem) = undef\n\n[[while e do c]]_Env = lfp(F)\
  \ = Union { F^n(perp) | n >= 0 }\nF : (M -> M) -> (M -> M)\nF : f |-> cond([[e]]_Env,\
  \ f o [[c]]_Env, id)\nperp : Mem |-> undef\n```\n\n## 框 4.7. 直译语义\n\n$[[c]]_{\\\
  text{Env}}$ 的定义在框 4.7 中给出。赋值指令 $x := e$ 与一个函数相关联，该函数通过将表达式 $e$ 的求值结果（如果不引发错误）存储在\
  \ $x$ 所表示的位置（如果 $x$ 表示一个引用）来转换内存状态。与指令 $\\mathbf{skip}$ 相关联的函数是恒等函数。对于序列 $c_1 ;\
  \ c_2$，我们组合与 $c_1$ 和 $c_2$ 相关联的两个函数；此外，如果其中一个函数应用于其未定义的状态，那么应用该组合的结果也是未定义的。与 if\
  \ $e$ then $c_1$ else $c_2$ 相关联的函数使用函数 $\\mathbf{cond}(f_b, f_1, f_2)$，该函数给定一个内存状态，根据该状态下布尔函数（$f_b$）的结果选择应用于该状态的函数（$f_1$\
  \ 或 $f_2$）。最后，考虑指令 $\\mathbf{while}\\ e\\ \\mathbf{do}\\ c$。使用大步操作语义形式主义，可以很容易地证明（参见练习\
  \ 4.1）：\n\n\\(\\mathbf{while}\\ e\\ \\mathbf{do}\\ c \\equiv \\text{if } e \\text{\
  \ then } (c; \\mathbf{while}\\ e\\ \\mathbf{do}\\ c) \\text{ else skip}\\)\n\n因此，使用上述定义，与循环\
  \ while e do c 相关联的函数可以是：\n\n\\([[\\mathbf{while}\\ e\\ \\mathbf{do}\\ c]]_{\\text{Env}}\
  \ = \\mathbf{cond}([[e]]_{\\text{Env}}, [[\\mathbf{while}\\ e\\ \\mathbf{do}\\ c]]_{\\\
  text{Env}} \\circ [[c]]_{\\text{Env}}, id)\\)\n\n但是，使用 $[[\\mathbf{while}\\ e\\\
  \ \\mathbf{do}\\ c]]_{\\text{Env}}$ 的这种定义不是组合式的。解决这个问题的一个方案是将函数 $[[\\mathbf{while}\\\
  \ e\\ \\mathbf{do}\\ c]]_{\\text{Env}}$ 抽象化以得到函数：\n\n\\(F : f \\mapsto \\mathbf{cond}([[e]]_{\\\
  text{Env}}, f \\circ [[c]]_{\\text{Env}}, id)\\)\n\n这个函数 $F$ 被称为泛函，因为它的参数本身也是一个函数。它的主体仅使用\
  \ $\\mathbf{while}\\ e\\ \\mathbf{do}\\ c$ 的组件，因此 $F$ 是组合式的。此外，它验证：\n\n\\(F([[ \\\
  mathbf{while}\\ e\\ \\mathbf{do}\\ c ]]_{\\text{Env}}) = [[ \\mathbf{while}\\ e\\\
  \ \\mathbf{do}\\ c ]]_{\\text{Env}}\\)\n\n换句话说，$[[\\mathbf{while}\\ e\\ \\mathbf{do}\\\
  \ c]]_{\\text{Env}}$ 是 $F$ 的一个不动点。要采用这种方法，我们必须建立 $F$ 至少存在一个不动点，并且当存在多个不动点时，确定使用哪一个。\n\
  \n例如，考虑程序 $\\mathbf{while}\\ \\downarrow x = 0\\ \\mathbf{do}\\ \\mathbf{skip}$，它可以与泛函\
  \ $F : f \\mapsto \\mathbf{cond}((\\downarrow x = 0)_{\\text{Env}}, f, id)$ 相关联，因为\
  \ $[[\\mathbf{skip}]]_{\\text{Env}} = id$ 且 $f \\circ id = f$。根据 $\\mathbf{cond}$\
  \ 的定义，我们因此有：\n\n\\(F : f \\mapsto \\left( \\text{Mem} \\mapsto \\begin{cases} f(\\\
  text{Mem}) & \\text{if } \\text{Mem}(\\text{Env}(x)) = 0 \\text{ and } \\text{Env}(x)\
  \ \\in \\mathbf{R} \\\\ \\text{Mem} & \\text{if } \\text{Mem}(\\text{Env}(x)) \\\
  neq 0 \\text{ and } \\text{Env}(x) \\in \\mathbf{R} \\\\ \\text{undef} & \\text{else}\
  \ \\end{cases} \\right)\\)\n\n给定一个函数 $h : \\mathbf{M} \\rightarrow \\mathbf{M}$，我们定义如下函数\
  \ $g_h : \\mathbf{M} \\rightarrow \\mathbf{M}$：\n\n\\(g_h : \\text{Mem} \\mapsto\
  \ \\begin{cases} h(\\text{Mem}) & \\text{if } \\text{Mem}(\\text{Env}(x)) = 0 \\\
  text{ and } \\text{Env}(x) \\in \\mathbf{R} \\\\ \\text{Mem} & \\text{if } \\text{Mem}(\\\
  text{Env}(x)) \\neq 0 \\text{ and } \\text{Env}(x) \\in \\mathbf{R} \\\\ \\text{undef}\
  \ & \\text{else} \\end{cases}\\)\n\n根据 $F$ 的定义，我们因此有：\n\n$$\nF(g_h) : \\text{Mem}\
  \ \\mapsto \\left\\{\\begin{array}{ll} g_h(\\text{Mem}) & \\text{if } \\text{Mem}(\\\
  text{Env}(x)) = 0 \\text{ and } \\text{Env}(x) \\in \\mathbf{R} \\\\ \\text{Mem}\
  \ & \\text{if } \\text{Mem}(\\text{Env}(x)) \\neq 0 \\text{ and } \\text{Env}(x)\
  \ \\in \\mathbf{R} \\\\ \\text{undef} & \\text{else} \\end{array}\\right.\n$$\n\n\
  并且从 $g_h$ 的定义我们得到：\n\n$$\nF(g_h) : \\text{Mem} \\mapsto \\left\\{\\begin{array}{ll}\
  \ h(\\text{Mem}) & \\text{if } \\text{Mem}(\\text{Env}(x)) = 0 \\text{ and } \\\
  text{Env}(x) \\in \\mathbf{R} \\\\ \\text{Mem} & \\text{if } \\text{Mem}(\\text{Env}(x))\
  \ \\neq 0 \\text{ and } \\text{Env}(x) \\in \\mathbf{R} \\\\ \\text{undef} & \\\
  text{else} \\end{array}\\right.\n$$\n\n因此 $F(g_h) = g_h$，所以对于每个函数 $h : \\mathbf{M}\
  \ \\nrightarrow \\mathbf{M}$，$g_h$ 都是 $F$ 的一个不动点。这个例子表明泛函 $F$ 存在多个不动点。\n\n我们现在需要确定这些不动点中哪一个与操作语义刻画完全相同的状态（参见属性\
  \ [4.13]）。对于满足 $\\text{Mem}(\\text{Env}(x)) = 2$ 的内存状态 Mem，循环体不执行，内存也不修改。对于满足 $\\\
  text{Mem}(\\text{Env}(x)) = 0$ 的内存状态 Mem，循环体执行无穷多次，程序不终止，因此我们希望 $[[\\text{while\
  \ } \\downarrow x = 0 \\text{ do skip}]]_{\\text{Env}}(\\text{Mem}) = \\text{undef}$。从函数\
  \ $k : \\text{Mem} \\mapsto \\text{undef}$，我们定义 $g_k$：\n\n$$\ng_k : \\text{Mem}\
  \ \\mapsto \\left\\{\\begin{array}{ll} \\text{Mem} & \\text{if } \\text{Mem}(\\\
  text{Env}(x)) \\neq 0 \\text{ and } \\text{Env}(x) \\in \\mathbf{R} \\\\ \\text{undef}\
  \ & \\text{else} \\end{array}\\right.\n$$\n\n我们看到 $g_k$ 是 $F$ 的一个不动点，而且这是我们希望与 $[[\\\
  text{while } \\downarrow x = 0 \\text{ do skip}]]_{\\text{Env}}$ 关联的不动点。\n\n对于 $F$\
  \ 中的任何其他不动点 $g_h$，如果 $g_k(\\text{Mem}) \\neq \\text{undef}$，那么 $g_k(\\text{Mem})\
  \ = g_h(\\text{Mem})$。如我们将看到的，通过定义从 $\\mathbf{M}$ 到 $\\mathbf{M}$ 的偏函数上的偏序关系，这个不动点对应于泛函\
  \ $F$ 的最小不动点，记为 $\\text{lfp}(F)$。这个不动点的存在性和唯一性证明，以及用于计算它的程序，将在下面介绍。\n\n##### 4.7.1.2.\
  \ 泛函最小不动点的存在性、唯一性与计算\n\n###### 4.7.1.2.1. 偏函数上的偏序关系\n\n为了定义泛函最小不动点的概念，我们在从 $A$ 到\
  \ $B$ 的偏函数集合（记作 $[A \\to B]$）上引入了序关系 $\\sqsubseteq$：\n\n$$\nf_1 \\sqsubseteq f_2\
  \ \\Leftrightarrow (\\forall x \\in A \\ f_1(x) \\neq \\text{undef} \\Rightarrow\
  \ f_1(x) = f_2(x))\n$$\n\n直观上，$f_1 \\sqsubseteq f_2$ 当且仅当 $f_2$ 扩展了 $f_1$，即 $f_2$\
  \ 保留了 $f_1$ 的所有结果，并可能提供一些新结果。我们可以轻松证明该关系定义了\n\n\n一个记作（\\(\\sqsubseteq\\), [\\(A\
  \ \\to B\\)]）的偏序：该关系是自反的、反对称的和传递的。\n\n我们回顾一下，给定一个偏序 (D, \\(\\sqsubseteq\\))，子集 \\\
  (Y \\subseteq D\\) 的上界和下界定义如下：\n\n\\(Maj(Y) = \\{d \\in D \\mid \\forall y \\in\
  \ Y \\, y \\sqsubseteq d\\} \\qquad Min(Y) = \\{d \\in D \\mid \\forall y \\in Y\
  \ \\, d \\sqsubseteq y\\}\\)\n\n\\(Y \\subseteq D\\) 的上确界 \\(\\sqcup Y\\) 是 Y 的最小上界，如果存在：\n\
  \n\\(\\forall d \\in D \\, (\\forall y \\in Y \\, y \\sqsubseteq d) \\Rightarrow\
  \ \\sqcup Y \\sqsubseteq d\\)\n\n\\(Y \\subseteq D\\) 的最小元（最小值），如果存在，是 \\(Min(Y)\
  \ \\cap Y\\) 中的唯一元素。下面的命题易证。\n\n命题 4.3.— \\(\\bot : \\text{Mem} \\mapsto \\text{undef}\\\
  ) 是 [\\(\\text{M} \\to \\text{M}\\)] 的最小元。\n\n给定一个偏序 (D, \\(\\sqsubseteq\\)) 和一个函数\
  \ \\(f : D \\to D\\)，元素 \\(d \\in D\\) 当且仅当 \\(f(d) = d\\) 时是 \\(f\\) 的不动点。如果存在，\\\
  (f\\) 的最小不动点，记作 lfp(f)，是 \\(f\\) 的一个不动点，使得：\n\n\\(\\forall d \\in D \\, (f(d) =\
  \ d \\Rightarrow \\text{lfp}(f) \\sqsubseteq d)\\)\n\n###### 4.7.1.2.2. 完全偏序\n\n\
  函式的最小不动点通过构造一系列越来越精确的近似值以增量方式获得。最小不动点是这系列近似值的最小上界。完全偏序为在这些情况下建立最小上界存在性提供了框架。给定一个偏序\
  \ (D, \\(\\sqsubseteq\\))，如果子集 \\(Y \\subseteq D\\) 的元素全序，则它是一个 *链*：\n\n\\(\\forall\
  \ y_1, y_2 \\in Y \\, y_1 \\sqsubseteq y_2 \\text{ or } y_2 \\sqsubseteq y_1\\)\n\
  \n一个 ccpo —— *链完全偏序* —— 是一个偏序 (D, \\(\\sqsubseteq\\))，使得对于任何链 \\(Y \\subseteq D\\\
  )，\\(\\sqcup Y\\) 存在。如果对于每个子集 \\(Y \\subseteq D\\)，\\(\\sqcup Y\\) 都存在，则偏序 (D, \\\
  (\\sqsubseteq\\)) 是一个完备格（因此也是一个 ccpo）。\n\n引理 4.4.— 每个 ccpo (D, \\(\\sqsubseteq\\\
  )) 都有一个最小元 \\(\\bot = \\sqcup \\emptyset\\)。\n\n证明。—— \\(\\emptyset\\) 显然是一个链，且由于\
  \ (D, \\(\\sqsubseteq\\)) 是一个 ccpo，\\(\\sqcup \\emptyset\\) 存在。因为 \\(\\sqcup \\\
  emptyset \\in D\\)，要证明 \\(\\sqcup \\emptyset\\) 是 D 中的最小元，只需证明它是 D 的一个下界。根据 \\(\\\
  sqcup \\emptyset\\) 的定义，我们有：\n\n\\(\\forall d \\in D \\, (\\forall x \\in \\emptyset\
  \ \\, x \\sqsubseteq d) \\Rightarrow \\sqcup \\emptyset \\sqsubseteq d\\)\n\n并且由于\
  \ \\(\\forall x \\in \\emptyset \\ x \\sqsubseteq d\\) 恒成立，我们有 \\(\\forall d \\\
  in D \\ \\sqcup \\emptyset \\sqsubseteq d\\)，因此 \\(\\sqcup \\emptyset\\) 是 D 的一个下界。\n\
  \n下面的引理是定义的直接推论，将按如下方式使用。\n\n引理 4.3.— 给定一个 ccpo \\((D, \\sqsubseteq)\\) 和一个链 \\\
  (Y \\subseteq D\\)，我们有：\n\n\\(\\sqcup(Y \\cup \\{\\bot\\}) = \\sqcup Y\\)\n\n下面的命题刻画了从\
  \ \\(\\mathbf{M}\\) 到 \\(\\mathbf{M}\\) 的部分函数链的最小上界。\n\n命题 4.4.— \\(([\\mathbf{M}\
  \ \\rightarrow \\mathbf{M}], \\sqsubseteq)\\) 是一个 ccpo，使得对于任何链 \\(Y\\)：\n\n\\(\\\
  sqcup Y : \\text{Mem} \\mapsto \\begin{cases} f(\\text{Mem}) & \\text{if there exists\
  \ } f \\in Y \\text{ such that } f(\\text{Mem}) \\neq \\text{undef} \\\\ \\text{undef}\
  \ & \\text{else} \\end{cases}\\)\n\n证明。—— 设 \\(Y\\) 是 \\(([\\mathbf{M} \\rightarrow\
  \ \\mathbf{M}], \\sqsubseteq)\\) 中的一个链。\n\n首先，让我们证明 \\(\\sqcup Y\\) 定义了一个函数。如果存在一个函数\
  \ \\(f \\in Y\\) 使得 \\(f(\\text{Mem}) \\neq \\text{undef}\\)，那么对于任何函数 \\(f' \\in\
  \ Y\\) 使得 \\(f'(\\text{Mem}) \\neq \\text{undef}\\)，我们有 \\(f'(\\text{Mem}) = f(\\\
  text{Mem})\\)。因为 \\(Y\\) 是一个链，根据定义，要么 \\(f \\sqsubseteq f'\\) 从而 \\(f'(\\text{Mem})\
  \ = f(\\text{Mem})\\)（因为 \\(f(\\text{Mem}) \\neq \\text{undef}\\)），要么 \\(f' \\sqsubseteq\
  \ f\\) 并且因为 \\(f'(\\text{Mem}) \\neq \\text{undef}\\) 我们有 \\(f(\\text{Mem}) = f'(\\\
  text{Mem})\\)。\n\n现在，让我们证明 \\(\\sqcup Y\\) 定义了 \\(Y\\) 的最小上界。给定 \\(f \\in Y\\) 和\
  \ \\(\\text{Mem} \\in \\mathbf{M}\\)，如果 \\(f(\\text{Mem}) \\neq \\text{undef}\\\
  )，则根据构造我们有 \\((\\sqcup Y)(\\text{Mem}) = f(\\text{Mem})\\) 且 \\(f \\sqsubseteq \\\
  sqcup Y\\)。所以 \\(\\sqcup Y\\) 定义了 \\(Y\\) 的一个上界。现在我们证明这是 \\(Y\\) 的最小上界：设 \\(g\\\
  ) 是 \\(Y\\) 的一个上界，我们需要证明 \\(\\sqcup Y \\sqsubseteq g\\)。取 \\(\\text{Mem} \\in \\\
  mathbf{M}\\) 使得 \\((\\sqcup Y)(\\text{Mem}) \\neq \\text{undef}\\)；根据定义，存在 \\(f\
  \ \\in Y\\) 使得 \\(f(\\text{Mem}) = (\\sqcup Y)(\\text{Mem})\\)，并且因为 \\(f \\sqsubseteq\
  \ g\\)（因为 \\(g\\) 是 \\(Y\\) 的一个上界），我们得到 \\((\\sqcup Y)(\\text{Mem}) = f(\\text{Mem})\
  \ = g(\\text{Mem})\\)，从而得出结论。\n\n###### 4.7.1.2.3. 连续函数\n\n函式 \\(F\\) 的最小不动点计算基于该函数的连续性。给定两个偏序\
  \ \\((D_1, \\sqsubseteq_1)\\) 和 \\((D_2, \\sqsubseteq_2)\\)，函数 \\(f : D_1 \\rightarrow\
  \ D_2\\) 是单调的，当且仅当它保持序，即当且仅当：\n\n\\(\\forall x, y \\in D_1 \\ x \\sqsubseteq_1 y\
  \ \\Rightarrow f(x) \\sqsubseteq_2 f(y)\\)\n\n下面的引理易证，因为 \\(\\sqsubseteq\\) 是传递关系。\n\
  \n引理 4.4.— 设 \\((D_1, \\sqsubseteq_1)\\)、\\((D_2, \\sqsubseteq_2)\\) 和 \\((D_3,\
  \ \\sqsubseteq_3)\\) 为三个偏序。如果函数 \\(f : D_1 \\rightarrow D_2\\) 和 \\(f' : D_2 \\\
  rightarrow D_3\\) 是单调的，则 \\(f' \\circ f : D_1 \\rightarrow D_3\\) 是单调的。\n\n下面的引理建立了关于链及其在单调函数下的像的最小上界的一个性质。\n\
  \n引理 4.5.— 设 \\((D_1, \\sqsubseteq_1), (D_2, \\sqsubseteq_2)\\) 为两个 ccpo，\\(f :\
  \ D_1 \\to D_2\\) 为单调函数。如果 \\(Y\\) 是 \\((D_1, \\sqsubseteq_1)\\) 的一个链，则 \\(f(Y)\\\
  ) 是 \\((D_2, \\sqsubseteq_2)\\) 的一个链，且 \\(\\sqcup_2 f(Y) \\sqsubseteq_2 f(\\sqcup_1\
  \ Y)\\)。\n\n证明。—— 如果 \\(Y = \\emptyset\\)，则 \\(f(Y) = \\emptyset\\) 是 \\((D_2, \\\
  sqsubseteq_2)\\) 的一个链，且由于 \\((D_2, \\sqsubseteq_2)\\) 是一个 ccpo，根据引理 4.2，\\(\\sqcup_2\
  \ \\emptyset\\) 是 \\(D_2\\) 中的最小元，因此 \\(\\sqcup_2 \\emptyset \\sqsubseteq_2 f(\\\
  sqcup_1 \\emptyset)\\)。如果 \\(Y \\neq \\emptyset\\)，则对于 \\(x_2, y_2 \\in f(Y)\\)，根据定义，存在\
  \ \\(x_1, y_1 \\in Y\\) 使得 \\(x_2 = f(x_1)\\) 且 \\(y_2 = f(y_1)\\)。因为 \\(Y\\) 是\
  \ \\((D_1, \\sqsubseteq_1)\\) 的一个链，要么 \\(x_1 \\sqsubseteq_1 y_1\\) 从而 \\(x_2 = f(x_1)\
  \ \\sqsubseteq_2 f(y_1) = y_2\\)，要么 \\(y_1 \\sqsubseteq_1 x_1\\) 从而 \\(y_2 = f(y_1)\
  \ \\sqsubseteq_2 f(x_1) = x_2\\)（因为 \\(f\\) 是单调的）。因此 \\(f(Y)\\) 是 \\((D_2, \\sqsubseteq_2)\\\
  ) 的一个链。\n\n让我们证明 \\(\\sqcup_2 f(Y) \\sqsubseteq_2 f(\\sqcup_1 Y)\\)。根据定义，\\(\\forall\
  \ y \\in Y\\, y \\sqsubseteq_1 \\sqcup_1 Y\\)，且因为 \\(f\\) 是单调的，\\(\\forall y \\\
  in Y\\, f(y) \\sqsubseteq_2 f(\\sqcup_1 Y)\\)，因此 \\(f(\\sqcup_1 Y)\\) 是 \\(f(Y)\\\
  ) 的一个上界。我们知道 \\(\\sqcup_2 f(Y)\\) 是 \\(Y\\) 的最小上界，所以 \\(\\sqcup_2 f(Y) \\sqsubseteq_2\
  \ f(\\sqcup_1 Y)\\)。\n\n给定两个偏序 \\((D_1, \\sqsubseteq_1)\\) 和 \\((D_2, \\sqsubseteq_2)\\\
  )，函数 \\(f : D_1 \\to D_2\\) 被称为 _连续_，当且仅当它是单调的并且保持链的最小上界，即当且仅当 \\(f\\) 是单调的并且对于\
  \ \\((D_1, \\sqsubseteq_1)\\) 中任何非空链 \\(Y\\) 都有 \\(\\sqcup_2 f(Y) = f(\\sqcup_1\
  \ Y)\\)。函数 \\(f\\) 被称为 _严格_，如果该性质对空链也成立：\n\n\\(\\sqcup_2 f(\\emptyset) = \\sqcup_2\
  \ \\emptyset = \\bot_2 = f(\\bot_1) = f(\\sqcup_1 \\emptyset)\\)\n\n再次，两个连续函数的复合本身也是一个连续函数。\n\
  \n引理 4.6.— 取三个 ccpo \\((D_1, \\sqsubseteq_1)\\)、\\((D_2, \\sqsubseteq_2)\\) 和 \\\
  ((D_3, \\sqsubseteq_3)\\)。如果 \\(f : D_1 \\to D_2\\) 和 \\(f' : D_2 \\to D_3\\) 是连续的，则\
  \ \\(f' \\circ f : D_1 \\to D_3\\) 是连续的。\n\n证明。—— 函数 \\(f\\) 和 \\(f'\\) 是连续的，因此我们可以像引理\
  \ 4.4 所述那样证明 \\(f' \\circ f\\) 是单调的。设 \\(Y\\) 是 \\((D_1, \\sqsubseteq_1)\\) 中的一个非空链。由于\
  \ \\(f\\) 是连续的，根据定义，\\(\\sqcup_2 f(Y) = f(\\sqcup_1 Y)\\) 且 \\(f\\) 是单调的。根据引理 4.5，\\\
  (f(Y)\\) 是 \\((D_2, \\sqsubseteq_2)\\) 中的一个非空链，且由于 \\(f'\\) 是连续的，我们得到 \\(\\sqcup_3\
  \ f'(f(Y)) = f'(\\sqcup_2 f(Y))\\)；由于 \\(\\sqcup_2 f(Y) = f(\\sqcup_1 Y)\\)，我们得到\
  \ \\(\\sqcup_3 (f' \\circ f)(Y) = f'(f(\\sqcup_1 Y))\\)，从而 \\(\\sqcup_3 (f' \\circ\
  \ f)(Y) = (f' \\circ f)(\\sqcup_1 Y)\\)，这证明了 \\(f' \\circ f\\) 是连续的。\n\n现在可以建立以下函式是连续的：\n\
  \n$F : f \\mapsto \\mathsf{cond}([\\![e]\\!]_{\\text{Env}}, f \\circ [\\![c]\\!]_{\\\
  text{Env}}, id)$\n\n为此，我们将函式视为两个函数的复合，它们的连续性证明如下：\n\n\n## 命题 4.5.- 取两个偏函数 \\(f_b\
  \ : \\mathbf{M} \\rightarrowtail \\mathbf{IB}\\) 和 \\(f_0 : \\mathbf{M} \\rightarrowtail\
  \ \\mathbf{M}\\)。函数 \\(F : f \\mapsto \\mathbf{cond}(f_b, f, f_0)\\) 是连续的。\n\n证明.-\
  \ 首先，让我们证明函数 \\(F\\) 是单调的。\n\n设 \\(f_1\\) 和 \\(f_2\\) 为 \\([\\mathbf{M} \\rightarrowtail\
  \ \\mathbf{M}]\\) 中的两个函数，使得 \\(f_1 \\sqsubseteq f_2\\)，并让我们展示 \\(F(f_1) \\sqsubseteq\
  \ F(f_2)\\)。假设 \\(\\mathsf{Mem} \\in \\mathbf{M}\\) 使得 \\((F(f_1))(\\mathsf{Mem})\
  \ \\neq \\mathsf{undef}\\)；我们展示 \\((F(f_1))(\\mathsf{Mem}) = (F(f_2))(\\mathsf{Mem})\\\
  )。\n\n如果 \\(f_b(\\mathsf{Mem}) = 1\\)，则：\n\n```\n\\((F(f_1))(\\mathsf{Mem}) = f_1(\\\
  mathsf{Mem})\\) and \\((F(f_2))(\\mathsf{Mem}) = f_2(\\mathsf{Mem})\\)\n```\n\n\
  由于 \\(f_1 \\sqsubseteq f_2\\) 且 \\(f_1(\\mathsf{Mem}) = (F(f_1))(\\mathsf{Mem})\
  \ \\neq \\mathsf{undef}\\)，我们有 \\(f_1(\\mathsf{Mem}) = f_2(\\mathsf{Mem})\\)，因此\
  \ \\((F(f_1))(\\mathsf{Mem}) = (F(f_2))(\\mathsf{Mem})\\)，从而确立 \\(F(f_1) \\sqsubseteq\
  \ F(f_2)\\)。如果 \\(f_b(\\mathsf{Mem}) = 0\\)，则 \\((F(f_1))(\\mathsf{Mem}) = f_0(\\\
  mathsf{Mem})\\) 且 \\((F(f_2))(\\mathsf{Mem}) = f_0(\\mathsf{Mem})\\)，故 \\((F(f_1))(\\\
  mathsf{Mem}) = (F(f_2))(\\mathsf{Mem})\\)，这使我们能够确立 \\(F(f_1) \\sqsubseteq F(f_2)\\\
  )。如果 \\(f_b(\\mathsf{Mem}) = \\mathsf{undef}\\)，则 \\((F(f_1))(\\mathsf{Mem}) = \\\
  mathsf{undef}\\)，这与假设矛盾。\n\n让我们证明，对于 \\(([\\mathbf{M} \\rightarrowtail \\mathbf{M}],\
  \ \\sqsubseteq)\\) 中的任何非空链 \\(Y\\)，\\(\\sqcup F(Y) = F(\\sqcup Y)\\)。\n\n由于我们知道\
  \ \\(F\\) 是单调的，根据引理 4.5，我们得到 \\(\\sqcup F(Y) \\sqsubseteq F(\\sqcup Y)\\)。仍需证明 \\\
  (F(\\sqcup Y) \\sqsubseteq \\sqcup F(Y)\\)，即 \\(F(\\sqcup Y) \\sqsubseteq \\sqcup\
  \ \\{F(f) \\mid f \\in Y\\}\\)。取 \\(\\mathsf{Mem}_1 \\in \\mathbf{M}\\)。让我们证明，如果\
  \ \\((F(\\sqcup Y))(\\mathsf{Mem}_1) = \\mathsf{Mem}_2 \\neq \\mathsf{undef}\\)，则\
  \ \\((\\sqcup F(Y))(\\mathsf{Mem}_1) = \\mathsf{Mem}_2\\)。如果 \\(f_b(\\mathsf{Mem}_1)\
  \ = 1\\)，则 \\((F(\\sqcup Y))(\\mathsf{Mem}_1) = (\\sqcup Y)(\\mathsf{Mem}_1) = \\\
  mathsf{Mem}_2\\)，并且根据命题 4.4，存在 \\(f \\in Y\\) 使得 \\(f(\\mathsf{Mem}_1) = \\mathsf{Mem}_2\\\
  )。根据定义，对于所有 \\(f \\in Y\\)，我们有 \\(F(f) \\sqsubseteq \\sqcup F(Y)\\)，因此得到 \\((\\\
  sqcup F(Y))(\\mathsf{Mem}_1) = \\mathsf{Mem}_2\\)。否则，如果 \\(f_b(\\mathsf{Mem}_1)\
  \ = 0\\)，则 \\((F(\\sqcup Y))(\\mathsf{Mem}_1) = f_0(\\mathsf{Mem}_1) = \\mathsf{Mem}_2\\\
  )，并且对于某个函数 \\(f \\in Y\\)：\n\n```\n\\((F(f))(\\mathsf{Mem}_1) = f_0(\\mathsf{Mem}_1)\
  \ = \\mathsf{Mem}_2 \\neq \\mathsf{undef}\\)\n```\n\n再次，根据定义，对于所有 \\(f \\in Y\\\
  )，我们有 \\(F(f) \\sqsubseteq \\sqcup F(Y)\\)，因此得到 \\((\\sqcup F(Y))(\\mathsf{Mem}_1)\
  \ = \\mathsf{Mem}_2\\)。最后，如果 \\(f_b(\\mathsf{Mem}_1) = \\mathsf{undef}\\)，则 \\((F(\\\
  sqcup Y))(\\mathsf{Mem}_1) = \\mathsf{undef}\\)，这与假设矛盾。\n\n## 命题 4.6.- 取 \\(f_0\
  \ : \\mathbf{M} \\rightarrowtail \\mathbf{M}\\)。函数 \\(F : f \\mapsto f \\circ f_0\\\
  ) 是连续的。\n\n证明.- 首先，让我们证明 \\(F\\) 是单调的。设 \\(f_1\\) 和 \\(f_2\\) 为 \\([\\mathbf{M}\
  \ \\rightarrowtail \\mathbf{M}]\\) 中的两个函数，使得 \\(f_1 \\sqsubseteq f_2\\)，并让我们证明 \\\
  (F(f_1) \\sqsubseteq F(f_2)\\)。取 \\(\\mathsf{Mem} \\in \\mathbf{M}\\) 使得 \\((F(f_1))(\\\
  mathsf{Mem}) \\neq \\mathsf{undef}\\)：我们可以证明 \\((F(f_1))(\\mathsf{Mem}) = (F(f_2))(\\\
  mathsf{Mem})\\)。根据定义，\\((F(f_1))(\\mathsf{Mem}) = f_1(f_0(\\mathsf{Mem})) \\neq\
  \ \\mathsf{undef}\\)，故 \\(f_0(\\mathsf{Mem}) \\neq \\mathsf{undef}\\)，并且由于 \\(f_1\
  \ \\sqsubseteq f_2\\)，我们得到 \\(f_1(f_0(\\mathsf{Mem})) = f_2(f_0(\\mathsf{Mem}))\\\
  )，从而得出结论。现在，我们必须证明 \\(F\\) 是连续的：\n\n\\((F(\\sqcup Y))(\\mathsf{Mem}_1) = (\\sqcup\
  \ Y)(f_0(\\mathsf{Mem}_1)) = \\mathsf{Mem}_2\\)\n\\(\\Leftrightarrow \\exists f\
  \ \\in Y\\ f(f_0(\\mathsf{Mem}_1)) = \\mathsf{Mem}_2\\)（参见命题 4.4）\n\\(\\Leftrightarrow\
  \ \\exists f \\in Y\\ (F(f))(\\mathsf{Mem}_1) = \\mathsf{Mem}_2\\)\n\\(\\Leftrightarrow\
  \ (\\sqcup F(Y))(\\mathsf{Mem}_1) = \\mathsf{Mem}_2\\)（参见命题 4.4）\n\n## 命题 4.7.--\
  \ 函数项 \\(F : f \\mapsto \\text{cond}([\\![e]\\!]_{\\text{Env}}, f \\circ [\\![c]\\\
  !]_{\\text{Env}}, id)\\) 是一个连续函数。\n\n证明.-- 取 \\(F_1 : f \\mapsto \\text{cond}([\\\
  ![e]\\!]_{\\text{Env}}, f, id)\\) 和 \\(F_2 : f \\mapsto f \\circ [\\![c]\\!]_{\\\
  text{Env}}\\)，则 \\(F(f) = F_1(F_2(f)) = F_1(f \\circ [\\![c]\\!]_{\\text{Env}})\
  \ = \\text{cond}([\\![e]\\!]_{\\text{Env}}, f \\circ [\\![c]\\!]_{\\text{Env}},\
  \ id)\\)，故 \\(F = F_1 \\circ F_2\\)。根据命题 4.5，函数 \\(F_1\\) 是连续的，且根据命题 4.6，函数 \\(F_2\\\
  ) 是连续的。引理 4.6 从而得出结论。\n\n###### 4.7.1.2.4. ccpo 上连续函数的最小不动点\n\n现在让我们展示如何对函数项 \\\
  (F\\) 的最小不动点进行增量计算。该构造基于以下定理。\n\n###### 定理 4.2.-- 令 \\((D, \\sqsubseteq)\\) 为一个\
  \ ccpo，\\(f : D \\to D\\) 为一个连续函数：\n\n\\[\n\\text{lfp}(f) = \\sqcup(\\{f^n(\\bot)\
  \ \\mid n \\ge 0\\})\n\\]\n\n证明.-- 首先，让我们证明 \\(\\sqcup(\\{f^n(\\bot) \\mid n \\\
  ge 0\\})\\) 的存在性。这可以通过对 \\(n\\) 进行归纳证明来轻松完成：\n\n\\[\n\\forall n \\in \\mathbb{N}\\\
  \ \\forall m \\in \\mathbb{N}\\ m \\ge n \\Rightarrow f^n(\\bot) \\sqsubseteq f^m(\\\
  bot)\n\\]\n\n（因为，根据引理 4.2，\\(\\bot\\) 是 \\(D\\) 的最小元素，且 \\(f\\) 是连续的，因此也是单调的）。\\\
  (\\{f^n(\\bot) \\mid n \\ge 0\\}\\) 因此是一条链，并且由于 \\((D, \\sqsubseteq)\\) 是一个 ccpo，\\\
  (\\sqcup(\\{f^n(\\bot) \\mid n \\ge 0\\})\\) 存在。现在，我们可以证明 \\(\\sqcup(\\{f^n(\\bot)\
  \ \\mid n \\ge 0\\})\\) 是 \\(f\\) 的一个不动点：\n\n\\[\nf(\\sqcup(\\{f^n(\\bot) \\mid\
  \ n \\ge 0\\})) = \\sqcup(f(\\{f^n(\\bot) \\mid n \\ge 0\\})) \\quad \\text{因为 }\
  \ f \\text{ 是连续的}\n\\]\n\\[\n= \\sqcup(\\{f^n(\\bot) \\mid n \\ge 1\\}) = \\sqcup(\\\
  {f^n(\\bot) \\mid n \\ge 1\\} \\cup \\{\\bot\\}) = \\sqcup(\\{f^n(\\bot) \\mid n\
  \ \\ge 0\\})\n\\]\n\n仍需证明 \\(\\sqcup(\\{f^n(\\bot) \\mid n \\ge 0\\})\\) 是 \\(f\\\
  ) 的最小不动点。设 \\(d \\in D\\) 为 \\(f\\) 的一个不动点。根据引理 4.2，\\(\\bot \\sqsubseteq d\\)，因此对于任何自然数\
  \ \\(n\\)，我们有 \\(f^n(\\bot) \\sqsubseteq f^n(d)\\)（这可以通过对 \\(n\\) 进行归纳证明，因为 \\(f\\\
  ) 是连续的，因此也是单调的）。此外，我们通过对 \\(n\\) 进行归纳得到 \\(\\forall n \\in \\mathbb{N}\\ f^n(d)\
  \ = d\\)，因为 \\(d\\) 是 \\(f\\) 的一个不动点。\\(d\\) 因此是 \\(\\{f^n(\\bot) \\mid n \\ge 0\\\
  }\\) 的一个上界，并且由于 \\(\\sqcup(\\{f^n(\\bot) \\mid n \\ge 0\\})\\) 是 \\(\\{f^n(\\bot)\
  \ \\mid n \\ge 0\\}\\) 的最小上界，我们得到 \\(\\sqcup(\\{f^n(\\bot) \\mid n \\ge 0\\}) \\\
  sqsubseteq d\\)。\n\n## 4.7.1.2.5. 示例\n\n考虑以下程序，它计算 ↓y = ↓x!，其中 ↓x 是一个严格正整数：\n\n\
  ```\ny := 1; while not(↓x = 1) do (y := ↓y × ↓x; x := ↓x - 1)\n```\n\n让我们计算在状态 (Env₀,\
  \ Mem₀) 中执行此程序的结果，使得 Mem₀(Env₀(x)) = 5 且 Env₀(y) ∈ R。在以下内容中，我们假设 Env(x) 和 Env(y)\

  \ f) 2)$ 补全树。\n- 3) 为 $e_4 = ((h g) 2)$ 补全树。\n\n## Exercise 3.4\n\n考虑以下表达式 $e_0$：\n\
  \n```\nlet x = 2 in (let f = e_1 in e)\n```\n\n其中 $e_1$ 是表达式 fun $y \\mapsto y +\
  \ x$。本练习中，表达式求值采用按名调用策略。\n\n- 1) 在环境 $ENV_0$ 中为表达式 $e_0$ 构建一棵“部分”求值树，以确定将用于求值表达式\
  \ $e$ 的环境 $ENV_2$。\n- 2) 为以下表达式 $e$ 补全树：let $x = 3$ in $(f x)$。\n- 3) 为以下表达式 $e$\
  \ 补全树：\n  let $x = 3$ in $((fun y \\mapsto y + x) x)$\n- 4) 为以下表达式 $e$ 补全树：\n  let\
  \ $g = e_2$ in $((g (x - 1)) f)$，其中 $e_2$ 是表达式：\n  rec $g z = fun k \\mapsto if\
  \ z = 0 then (k x) else ((g (z - 1)) k)$\n\n## Exercise 3.5\n\n本练习中，我们考虑 $\\mathbf{Exp2}$\
  \ 的一个子集，该子集仅包含简单的算术表达式，仅保留框 3.1 中的构造 (1)、(2)、(4) 和 (6)，其中 $\\mathbf{K} = \\mathbb{Z}$\
  \ 且 $\\text{op} \\in \\{+, -, *\\}$。该语言（记为 EA）的语法如下：\n\n```\ne ::= k | x | e_1 +\
  \ e_2 | e_1 - e_2 | e_1 * e_2 | let x = e_1 in e_2\n```\n\n为简化起见，我们在此假设，用于求值任意表达式\
  \ $e$ 的环境始终包含 $e$ 中出现的每个自由变量的绑定；因此，我们无需考虑错误情况。因此，EA 中表达式的运行语义可由值集合 $V = \\mathbb{Z}$（因为\
  \ $\\text{IE} = \\emptyset$）定义，且仅考虑框 3.2 和框 3.3 中的规则 F1、F4、F11 和 F13。证明：在环境 Env\
  \ 中求值表达式 $a \\in \\text{EA}$ 的结果仅取决于环境 Env 中与 $a$ 的自由变量关联的值。\n\n$$\n\\forall a \\\
  in \\text{EA} \\;\\forall \\text{Env}_1, \\text{Env}_2 \\in \\mathbf{E} \\;\\text{Env}_1\

  \ \\text{lfp}(F) = \\sqcup_{n \\ge 0}\\{F^n(\\perp)\\}\\) 由此定义为：\n\n```\n[[c_2]]_{Env}\
  \ : Mem \\mapsto \\left\\{\\begin{array}{ c c }\\text{undef} & \\text{if } Mem(r_x)\

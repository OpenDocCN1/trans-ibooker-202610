  Python\ndef add_mem(mem,v):\n    if len(mem) == 0: return (0,[(0,v)])\n    else:\n\
  \        n1,v1 = mem[0]\n        return (n1+1,[(n1+1,v)]+mem)\n```\n\n```\nOCaml\n\

  x\"))),\nLet_def4(\"w\",Ref4(Deref4(Var4(\"x\")))),\nLet_def4(\"x\",Cste4(CInt4(5)))],\n\
  ISq4(IAffect4(\"z\",Var4(\"x\")),IAffect4(\"y\",Var4(\"w\"))))\n>>> print_state(env_ex_ld4_3,ex_def4.pgm(env_ex_ld4_3,mem_ex_ld4_3,ex_pgm4_2))\n\

  text{if } \\text{Mem}(r_x) = n \\\\ \\llbracket c_3 \\rrbracket^{n-2}_{\\text{Env}}(\\\
  text{Mem}) & \\text{if } \\text{Mem}(r_x) = n - 1 \\\\ \\dots \\\\ \\llbracket c_3\
  \ \\rrbracket_{\\text{Env}}(\\text{Mem}) & \\text{if } \\text{Mem}(r_x) = 2 \\\\\
  \ \\llbracket c_3 \\rrbracket^0_{\\text{Env}}(\\text{Mem}) & \\text{if } \\text{Mem}(r_x)\
  \ = 1 \\end{cases}\\)\n```\n\n\n\n\n\n可以写成更简单的形式：\n\n```\nF^n(\\perp) : Mem \\mapsto\
  \ \\left\\{\\begin{array}{ c c }\\text{undef} & \\text{if } Mem(r_x) < 1 \\text{\
  \ or } Mem(r_x) > n \\\\ [[c_3]]_{Env}^{p-1}(Mem) & \\text{if } Mem(r_x) = p \\\

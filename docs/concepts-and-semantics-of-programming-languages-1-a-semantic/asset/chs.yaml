  \ -> 'b valeur2 -> 'c val_err2\n```\n\n#### 3.2.4. 闭包\n\n语言 Exp2 允许我们定义函数并将其应用于实际参数（也称为实参）。设\
  \ f 为具有形式参数 x 和函数体 e_f 的函数。要在当前环境 Env_a 中对 (f e) 求值，必须在此环境中对 e 求值以得到值 v。然后必须在一个环境\
  \ Env 中对函数体 e_f 求值，其中 x 绑定到 v：这种绑定允许用实际参数替换形式参数。那么这个环境 Env 是什么呢？设 f 为表达式 fun x1\
  \ -> x1 + x2：对 (f 2) 求值会创建绑定 (x1,2)，其余就是找到 x2 的值——但在哪个环境中呢？有两种可能：这个值要么由对应用 (f 2)\
  \ 求值的环境 Env_a 提供，要么由定义 f 的环境提供。在第一种情况中，我们称之为动态作用域，而在第二种情况中，我们称之为静态作用域或词法作用域。对于 Exp2，我们采用词法作用域：因此闭包记录了函数定义所在的环境。这样一来，函数体中自由变量的值（形式参数除外）就是函数定义阶段的值，即这些变量在函数定义环境中绑定的值。\n\
  \n编译器通常使用词法作用域，而解释器则常选择动态作用域。编译器提供闭包概念的优化实现，避免代码重复。在使用词法作用域的语言中，函数体仅在该函数应用于实际参数时才求值。然而，这并不意味着会保留该函数体的源代码；函数体被翻译成目标代码，其中包含记录定义环境所需的指令（至少包括该环境中函数自由变量的绑定），以及将形式参数绑定到调用提供的实际参数值的指令。将函数应用于实际参数的执行会导致在正确的环境中执行其函数体的目标代码。\n\
  \n#### 3.2.5. 表达式的求值\n\n表 3.3 通过归纳法定义了 Exp2 中表达式的求值函数，遵循抽象语法规则。让我们来看看这个表中的各行。常量的值是常量本身。在环境中绑定变量会提供该变量的值。要对形式为\
  \ op e 或 e1 op e2 的表达式求值，必须对子表达式 e 或 e1 和 e2 求值。条件表达式 if e1 then e2 else e3 的求值取决于\
  \ e1 求值返回的结果。要对 let x = e1 in e2 求值，先对 e1 求值得到 v，然后用绑定 (x, v) 扩展当前环境，以便对 e2 求值。函数的值是一个闭包。如果该函数是递归的，则闭包还将包含函数\
  \ f 的名称。为了对应用 (e1 e2) 求值，必须首先在当前环境 Env 中对 e1 和 e2 求值。然后在闭包中包含的环境 Env_f（并通过绑定 (x,\
  \ v) 扩展）中对函数体求值。对于递归函数 f，将函数名 f 添加到闭包意味着我们可以在 f 绑定到该闭包的环境中对其函数体 e_f 求值。构造递归函数 f\
  \ 的闭包的另一种方法（在 3.3.3 节中使用）是扩展 f 的定义环境，以包含 f 与其自身闭包的绑定，从而可以求值递归调用：\n\n[[rec f x =\
  \ e]]Env = F   with   F = <x, e, (f, F) ⊕ Env>\n\n\n\n\n这两种方法是等价的。\n\n| e | [[e]]_Env\

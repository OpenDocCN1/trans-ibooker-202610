  \ (Var4 \"x\"),\n       Deref4 (Var4 \"y\")))))\n```\n\n用于定义函数和过程的构造将在后面介绍。但是，以下定理表征了在此阶段定义的语言\
  \ Lang₃ 的表达能力。\n\n### 定理 4.1.\n\nBöhm 和 Jacopini [BOE 66]：任何算法都可以表示为三种控制结构的组合：序列、条件指令和迭代。\n\
  \n为语言 Lang₃ 定义语义使我们能够对赋值和控制指令产生的内存修改进行精确描述。在本章中，我们假设所有定义了语义的表达式和程序在语法上都是正确且类型正确的（参见第\
  \ 5 章）：对表达式的求值或程序的执行永远不会产生类型错误。\n\n### 4.2. 表达式求值\n\n如第 2 章一样，Exp₃ 中的表达式在由执行环境 Env\
  \ E 和内存 Mem M 组成的状态中求值。但是，表达式语言 Exp₃ 包含一个运算符 ^，它分配内存，将其参数的值存储在这个新位置，并返回其引用。因此，虽然求值表达式永远不会修改执行环境，但它可能会触发内存状态的修改（称为求值的副作用）。求值表达式返回一个值，该值可以是整数、布尔值或引用，因此\
  \ V = Z ∪ B ∪ R。由于我们只考虑类型正确的表达式（即求值不会导致类型错误的表达式），唯一可能的错误是定义错误 ErrU（访问环境中未定义的标识符）和执行错误\
  \ ErrE（例如除以 0 的情况）。因此，IE = {ErrU, ErrE}，V = V ∪ IE 是表达式求值所有可能结果的集合。\n\n我们定义如下求值函数：\n\
  \n```\n[[ ]]_- : (E x M x Exp₃) → (V x M)\n```\n\n这意味着 [[e]]Env^Mem = (v, Mem')\
  \ 表示 v 是在状态 (Env, Mem) 中对表达式 e 求值得到的值，而 Mem' 是计算 v 时从 Mem 得到的内存。该函数在表 4.4 中定义。\n\
  \n我们假设每个运算符 op 都有一个语义，定义如何通过值域上的运算符 opV 来解释它。我们还假设在分配（运算符 ^）期间，一个外部机制在内存中提供位置并返回它们的引用。对于\
  \ e1 op e2 形式的表达式，我们选择求值\n\n\n\n先对表达式 $e_1$ 求值，然后 – 根据结果 – 对 $e_2$ 求值。此外，当表达式求值过程中产生错误时，返回的值对应于该错误，内存是上一次无错误求值所产生的内存。\n\

  \ := r_x1])\n(v) [[↑↑ x1]] = (r_x5, Mem2[r_a := r_x1][r_x5 := r_a])\nsince [[↑ x1]]\
  \ = (r_a, Mem2[r_a := Env4(x1)]) = (r_a, Mem2[r_a := r_x1])\n\n### 框 4.1. 示例：定义序列的执行\n\
  \n### 4.4. 操作语义\n\n所有命令式语言核心的指令是 *赋值*，它改变内存的状态，即修改其内容。在状态 $(Env, Mem)$ 中执行赋值 $x\
  \ := e$ 包括：在此状态下求值表达式 $e$ 以获得值 $v$ 和新的内存状态 $Mem'$，在环境 $Env$ 中查找 $x$ 的值 $r = Env(x)\
  \ \\in \\mathbf{R}$，最后，将值 $v$ 写入位置 $r$ 以获得内存 $Mem'[r := v]$。\n\n### 注。—— 很少有高级语言包含用于区分变量位置的引用和存储在此位置的值的语法结构。这两个不同的值通常仅由变量名称表示；由用户确定表达式中每个变量名出现时应使用哪个值。如我们在\
  \ 2.3 节末尾所见，在这些语言中，赋值中出现的变量名的含义取决于其位于赋值符号左侧还是右侧：左侧变量名表示位置，右侧变量名表示值。\n\n命令式程序的执行包括执行一系列赋值和测试。程序中包含的控制结构指定了要执行的赋值、执行顺序以及应执行的次数。给定执行环境，$\\\
  mathbf{Lang}_3$ 的语义描述了与 $\\mathbf{Lang}_3$ 中每条指令相关的内存转换。这些转换由一个关系描述，遵循 [PLO 04]\
  \ 首先引入的方法。\n\n#### 4.4.1. 大步语义\n\n给定执行环境 $ENV$，语言 $\\mathbf{Lang}_3$ 的大步操作语义定义了一个转换关系：\n\
  \n$$\n\\rightarrow_{ENV} \\subseteq M \\times \\mathbf{Lang}_3 \\times M\n$$\n\n\
  这样，$\\langle Mem, c \\rangle \\rightarrow_{ENV} Mem'$ 意味着在状态 $(ENV, Mem)$ 中执行指令\
  \ $c$ 会导致内存状态 $Mem'$。该关系通过归纳法定义，使用框 4.2 中呈现的推理系统。\n\n规则 $C_1$ 定义了赋值 $x := e$ 的语义：在状态\
  \ $(ENV, Mem)$ 中对 $e$ 的求值不得引发错误，且在环境 $ENV$ 中对变量 $x$ 的求值必须产生一个引用，否则执行中止。由于该规则的前提不采用\
  \ $\\langle Mem, c \\rangle \\rightarrow_{ENV} Mem'$ 的形式，它们必须被视为应用规则的条件。\n\n\n\n\
  \n\n## 框 4.2. Lang3 的大步操作语义\n\n$(C_1) \\frac{\\text{Env}(x) = r \\in \\mathbf{R}\
  \ \\quad \\llbracket e \\rrbracket_{\\text{Env}}^{\\text{Mem}_1} = (v, \\text{Mem}_2)\
  \ \\in \\mathbf{V} \\times \\mathbf{M}}{\\langle \\text{Mem}_1, x := e \\rangle\
  \ \\rightarrow_{\\text{Env}} \\text{Mem}_2[r := v]}$\n\n$(C_2) \\frac{}{\\langle\
  \ \\text{Mem}, \\text{\\textbf{跳过}} \\rangle \\rightarrow_{\\text{Env}} \\text{Mem}}$\n\
  \n$(C_3) \\frac{\\langle \\text{Mem}, c_1 \\rangle \\rightarrow_{\\text{Env}} \\\
  text{Mem}_1 \\quad \\langle \\text{Mem}_1, c_2 \\rangle \\rightarrow_{\\text{Env}}\
  \ \\text{Mem}_2}{\\langle \\text{Mem}, c_1 ; c_2 \\rangle \\rightarrow_{\\text{Env}}\
  \ \\text{Mem}_2}$\n\n$(C_4) \\frac{\\llbracket e \\rrbracket_{\\text{Env}}^{\\text{Mem}}\
  \ = (\\text{\\textit{真}}, \\text{Mem}_1) \\quad \\langle \\text{Mem}_1, c_1 \\rangle\
  \ \\rightarrow_{\\text{Env}} \\text{Mem}_2}{\\langle \\text{Mem}, \\text{\\textbf{如果}}\
  \ e \\text{\\textbf{则}} c_1 \\text{\\textbf{否则}} c_2 \\rangle \\rightarrow_{\\text{Env}}\
  \ \\text{Mem}_2}$\n\n$(C_5) \\frac{\\llbracket e \\rrbracket_{\\text{Env}}^{\\text{Mem}}\
  \ = (\\text{\\textit{假}}, \\text{Mem}_1) \\quad \\langle \\text{Mem}_1, c_2 \\rangle\
  \ \\rightarrow_{\\text{Env}} \\text{Mem}_2}{\\langle \\text{Mem}, \\text{\\textbf{如果}}\
  \ e \\text{\\textbf{则}} c_1 \\text{\\textbf{否则}} c_2 \\rangle \\rightarrow_{\\text{Env}}\
  \ \\text{Mem}_2}$\n\n$(C_6) \\frac{\\llbracket e \\rrbracket_{\\text{Env}}^{\\text{Mem}}\
  \ = (\\text{\\textit{真}}, \\text{Mem}_1) \\quad \\langle \\text{Mem}_1, c \\rangle\
  \ \\rightarrow_{\\text{Env}} \\text{Mem}_2 \\quad \\langle \\text{Mem}_2, \\text{\\\
  textbf{当}} e \\text{\\textbf{执行}} c \\rangle \\rightarrow_{\\text{Env}} \\text{Mem}_3}{\\\
  langle \\text{Mem}, \\text{\\textbf{当}} e \\text{\\textbf{执行}} c \\rangle \\rightarrow_{\\\
  text{Env}} \\text{Mem}_3}$\n\n$(C_7) \\frac{\\llbracket e \\rrbracket_{\\text{Env}}^{\\\
  text{Mem}} = (\\text{\\textit{假}}, \\text{Mem}_1)}{\\langle \\text{Mem}, \\text{\\\
  textbf{当}} e \\text{\\textbf{执行}} c \\rangle \\rightarrow_{\\text{Env}} \\text{Mem}_1}$\n\
  \n规则 \\(C_2\\) 仅指示执行指令 skip 不会影响状态。规则 \\(C_3\\) 描述了执行两条指令序列期间内存的演变。规则 \\(C_4\\)\
  \ 和 \\(C_5\\) 指定与条件语句相关的内存转换；它们包含一个应用条件，该条件取决于表达式 \\(e\\) 的求值结果。\n\n最后，规则 \\(C_6\\\
  ) 和 \\(C_7\\) 与 **当** \\(e\\) **执行** \\(c\\) 循环相关，并指定根据条件表达式 \\(e\\) 的值，循环体 \\(c\\\
  ) 的执行应重复多少次。与其他指令不同，**当** \\(e\\) **执行** \\(c\\) 允许我们编写执行不会终止的程序，因此，这种程序无法由推导树描述，因为这样的树是有限的树。对于这种非终止程序\
  \ \\(c\\)，不存在内存状态 \\(\\text{Mem}'\\) 使得 \\(\\langle \\text{Mem}, c \\rangle \\rightarrow_{\\\
  text{Env}} \\text{Mem}'\\)。例如，取程序 \\(\\text{\\textit{foo}} = \\text{\\textbf{当}}\
  \ \\text{\\textit{真}} \\text{\\textbf{执行}} c\\)，不存在内存状态 \\(\\text{Mem}'\\) 使得 \\\
  (\\langle \\text{Mem}, \\text{\\textit{foo}} \\rangle \\rightarrow_{\\text{Env}}\
  \ \\text{Mem}'\\)。事实上，这个程序包含一个无限循环，因此不可能为它构建有限执行树：\n\n$\\frac{ \\begin{array}{c}\
  \ \\llbracket \\text{\\textit{真}} \\rrbracket_{\\text{Env}}^{\\text{Mem}} \\\\ (C_2)\
  \ \\frac{ \\langle \\text{Mem}, \\text{\\textbf{跳过}} \\rangle \\rightarrow_{\\text{Env}}\
  \ \\text{Mem} }{ } \\\\ (C_6) \\frac{ \\vdots }{ \\langle \\text{Mem}, \\text{\\\
  textit{foo}} \\rangle \\rightarrow_{\\text{Env}} ? } \\end{array} }{ \\langle \\\
  text{Mem}, \\text{\\textit{foo}} \\rangle \\rightarrow_{\\text{Env}} ? }$ \\\\\n\
  \\((C_6) \\frac{ \\dots }{ \\langle \\text{Mem}, \\text{\\textit{foo}} \\rangle\
  \ \\rightarrow_{\\text{Env}} ? }\\)\n\n由于 \\(\\langle \\text{Mem}, \\text{\\textit{foo}}\
  \ \\rangle \\rightarrow_{\\text{Env}} ?\\) 既出现在根节点，也出现在前提中。大步操作语义使用推导树——这些树是有限的——因此无法考虑非终止程序的执行。一种更精细的方法，适合描述非终止程序的执行，将在第\
  \ 4.4.2 节中介绍。\n\n让我们实现一个函数，给定状态 (Env, Mem) 和程序 c，计算新内存 Mem’，使得 \\(\\langle\\text{Mem},\
  \ c\\rangle \\rightarrow_\\text{Env} \\text{Mem}'\\)。然而请注意，就像第 3 章中定义的求值函数一样，这不符合数学函数。实际上，如果将此函数应用于在给定状态下执行不会终止的程序，则该函数可能不会终止。当执行导致无限循环时就会出现这种情况（如我们在第\
  \ 3 章中看到的，对应于递归函数应用的表达式，求值导致了无限次递归调用）。此函数复制了框 4.2 中语义规则描述的执行机制。因此，它不是组合式的：程序的执行不仅仅对应于其各个组件的执行。规则\
  \ \\(C_6\\) 描述了使用组件 c 的执行来执行指令 **当** 执行 c，但也包括循环本身的执行。我们将在第 4.7.1 节回到这一点。由于我们假设程序执行不会产生类型错误，因此这里只需引入一个异常\
  \ Exec_Error，在执行出错时引发。再次说明，随着语言 \\(\\text{Lang}_3\\) 的扩展，此函数的定义将被扩展。\n\n```\nPython\n\
  def exec_pgm4(env,mem,c):\n    if isinstance(c,IAffect4):\n        r = valeur_de(env,c.symb)\n\

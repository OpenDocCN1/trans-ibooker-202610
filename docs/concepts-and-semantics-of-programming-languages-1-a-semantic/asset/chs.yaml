  \ App2 的特例。\n\n### 5.5. 属性\n\n#### 5.5.1. 类型检查的属性\n\n我们可以建立框 5.1 中阐述的类型系统的若干属性，这些属性保证了其相对于语言语义的正确性。这里列出了这些属性中最重要的一项，尽管我们不提供证明；相关证明可见\
  \ [DAM 82]。\n\n> 提议 5.1.– 强安全性：设 e 为一个表达式，τ 为一个类型，Env$_t$ 为一个类型环境，Env 为一个求值环境，使得对\
  \ ∀x ∈ X，Env$_t$ ⊢ Env$(x)$ : Env$_t(x)$。如果 Env$_t$ ⊢ e : τ 且 Env ⊢ e $\\rightsquigarrow\
  \ v$，则 $v$ 是类型 τ 的一个值。\n\n#### 5.5.2. 推断算法的属性\n\n正如类型规则需要满足若干属性一样，算法本身必须满足四个要求：终止性、正确性、完备性和最一般性。终止性保证表达式的类型将在有限时间内被推断（编译器不会进入无限循环）。如果对于给定的表达式\
  \ e 和类型环境 Env，算法返回的类型相对于框 5.1 中阐述的类型规则是正确的，则该算法是正确的。这种正确性意味着推断算法不会产生错误结果。完备性意味着如果存在给定表达式\
  \ e 和类型环境 Env 的类型，则算法将找到它：换句话说，算法不会“遗漏”任何解。最一般性保证算法始终计算最一般的类型，其含义如第 5.4 节中所示。\n\n\
  提议 5.2.– 推断算法的正确性：如果 Env ⊢ e ▷ (τ, θ)，则 θ(Env) ⊢ e : τ。\n\n提议 5.3.– 推断的完备性和最一般性：设\
  \ Env 为一个环境，e 为一个表达式。如果存在替换 θ′ 和类型 τ′，使得 θ′(Env) ⊢ e : τ′，则 Env ⊢ e ▷ (τ, θ)，并且存在替换\
  \ θ″，使得 τ′ = θ″(τ) 且 θ′ = θ″ ◦ θ。\n\n### 5.6. 命令式构造的类型检查\n\n为了引入命令式语言的类型检查，我们将为第\
  \ 4 章中引入的语言 Lang3 定义规则，该语言使用块结构进行了扩展（参见第 4.6.1 节）。这里给出的类型系统不是框 5.1 中所示规则的扩展，因为我们不考虑函数特性，只考虑可变变量。因此，我们需要对定义语言（见表\
  \ 4.1）、表达式语言（见表 4.2）和指令（见表 4.3）进行类型化。出于简洁考虑，将使用相同的符号来表示所有三种类型关系。\n\n#### 5.6.1.\
  \ 类型代数\n\n由于引用属于值集合，因此必须为其指定一个类型，该类型称为 ref。为了以一致的方式处理引用所表示地址处存储的值，类型 ref 还必须指示被引用值的类型。Lang3\
  \ 的内核不包含函数或多态性，仅包含整型和布尔型常量；因此类型代数非常简单。该代数如表 5.2 所示，包含整型 int、布尔型 bool 以及对类型 τ 值的引用类型，表示为\
  \ τ ref。\n\n由于未考虑多态性，类型环境不将标识符绑定到类型方案，而只是绑定到类型。\n\n\n\n\n\n| τ := int | 整数 |\n|\

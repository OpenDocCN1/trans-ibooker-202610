  \ isinstance(v,VBool2): return Val2(VBool2(not v.val_bool))\n        return Err2(E_Typ2)\n\
  \    raise ValueError\n\ndef apply2_binary_op(op,v1,v2):\n    if isinstance(op,Plus2):\n\

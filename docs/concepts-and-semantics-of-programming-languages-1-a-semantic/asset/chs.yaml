  ge 1\\end{array}\\right.\n```\n\n利用前面建立的 \\([[c_3]]_{Env}^{p-1}\\) 的表达式，我们最终得到：\n\
  \n```\n[[c_2]]_{Env} : Mem \\mapsto \\left\\{\\begin{array}{ l }\\text{undef if\
  \ } Mem(r_x) < 1 \\\\ Mem[r_y := Mem(r_y) \\times p!][r_x := Mem(r_x) - 1] \\\\\
  \ \\text{if } Mem(r_x) = p \\text{ and } p \\ge 1\\end{array}\\right.\n```\n\n现在可以按以下方式计算\
  \ \\([[c]]_{Env_0}(Mem_0)\\)：\n\n```\n[[c]]_{Env_0}(Mem_0) = [[c_2]]_{Env_0}([[c_1]]_{Env_0}(Mem_0))\
  \ = [[c_2]]_{Env_0}(Mem_0[r_y := 1]) \\\\\n= Mem_0[r_y := 5!][r_x := 1]\n```\n\n\
  在状态 (Env_0, Mem_0) 下执行程序 c 结束时，单元 y 中包含的值因此为 Mem_0(Env_0(x))! = 5! = 120，单元 x 中包含的值为\
  \ 1。\n\n#### 4.7.2. 公理语义，Hoare 逻辑\n\n本章介绍的语言 **Lang**_3_ 的操作语义和指称语义描述了程序执行过程中状态的转换。这些语义提供的状态描述是“完整”的，因为它们确定了每个内存单元中包含的值。公理语义通过状态所验证的属性来描述这些状态。这些属性通常称为\
  \ _断言_，可能涉及任何位置的内容，但也可以考虑仅为位置子集定义的属性。此外，这种公理语义通常用于证明关于程序预期结果的属性，而不是描述它们的执行。它还提供了一种形式主义，用于建立程序相对于所期望属性（即程序规格）的正确性。这种形式主义在\
  \ [HOA 83] 中提出，基于一种规范语言，用于为程序分配的任务创建形式化描述，并表达程序输入和输出之间的关系。正确性属性使用 Hoare 三元组来表示：\n\
  \n```\n{P_1}c{P_2}\n```\n\n其中 P1 和 P2 是某种规范语言中给出的表达式，c 是一个程序。直观地说，这个三元组表达了这样的概念：如果内存状态满足断言\
  \ P1（前条件），那么程序 c 的执行将导致满足断言 P2（后条件）的内存状态。\n\n公理语义表征“真”的 Hoare 三元组（例如，三元组 {↓x = 2}x\
  \ := ↓x + 1{↓x = 3} 是“真”的，而三元组 {↓x = 2}x := ↓x + 1{↓x = 5} 是“假”的）。用于表达断言的逻辑形式主义可能对应于一阶逻辑（带有演绎方法）的一个片段，或者对应于外延方法，其中断言\
  \ P 被视为状态上的一个谓词，使得 P((Env, Mem)) 当且仅当 [[P]]_Env^Mem = 1 时得到满足。在这种情况下，断言与语言中使用的布尔表达式同化。我们在此采用这种方法。\n\
  \n##### 4.7.2.1. 部分正确性\n\n###### 4.7.2.1.1. 可证明的 Hoare 三元组\n\n方框 4.8 中的推理系统包含一组规则，表征了一组可证明的\
  \ Hoare 三元组，表达了 c 在前条件 P1 和后条件 P2 下的部分正确性。\n\n```\n(Skp) {P} skip {P}          \
  \   (Aff) {P[↓x ← e]}x := e{P}\n\n(Seq) {P1} c1 {P2}   {P2} c2 {P3}\n      ---------------------------\n\
  \      {P1} c1 ; c2 {P3}\n\n(Cond) {P1 and e} c1 {P2}   {P1 and not e} c2 {P2}\n\
  \       -------------------------------------------\n       {P1} if e then c1 else\
  \ c2 {P2}\n\n(WP) {P1 and e} c {P1}\n     ----------------\n     {P1} while e do\
  \ c {P1 and not e}\n\n(Cons) {P1'} c {P2'}   (P1 => P1')\n       {P1} c {P2}   \
  \  (P2' => P2)\n       ---------------------------\n```\n\n### 方框 4.8. 公理语义：部分正确性\n\
  \n由于指令 skip 不修改内存状态，规则 (Skp) 仅表示 skip 执行前后的状态验证相同的属性。规则 (Aff) 指出，要使在执行 x := e 之后被指定为\
  \ x 的内存单元的内容验证某个属性，该属性必须在赋值执行之前对 e 验证。例如，我们有：\n\n```\n(Aff) {↓x + 1 = 3}x := ↓x\
  \ + 1{↓x = 3}\n```\n\n请注意，这里的前条件 \\(\\downarrow x + 1 = 3\\)（等价于 \\(\\downarrow\
  \ x = 2\\)）对应于后条件 \\(\\downarrow x = 3\\)，其中 \\(\\downarrow x\\)（其中 x 是赋值的左部）已被\
  \ \\(\\downarrow x + 1\\)（赋值的右部）替换，记作 \\((\\downarrow x + 1) [\\downarrow x \\leftarrow\
  \ \\downarrow x + 1]\\)。在本规则中，\\(P[\\downarrow x \\leftarrow e]\\) 指的是通过在 \\(P\\\
  ) 中将 \\(\\downarrow x\\) 替换为 \\(e\\) 得到的断言：替换机制取决于用于表达断言的规范语言。\n\n使用上面描述的外延方法，断言\
  \ \\(P[\\downarrow x \\leftarrow e]\\) 满足：\n\n\\([[P[\\downarrow x \\leftarrow e]]]^{\\\
  text{Mem}}_{\\text{Env}} = [[P]]^{\\text{Mem}'}_{\\text{Env}}\\) where \\(\\text{Mem}'\
  \ = \\text{Mem}[\\text{Env}(x) := [[e]]^{\\text{Mem}}_{\\text{Env}}]\\)\n\n规则 (Seq)\
  \ 指出，如果在满足 \\(P_1\\) 的状态中执行 \\(c_1\\) 导致满足 \\(P_2\\) 的状态，并且在这样的状态中执行 \\(c_2\\) 导致满足\
  \ \\(P_3\\) 的状态，那么在满足 \\(P_1\\) 的状态中执行序列 \\(c_1 ; c_2\\) 导致满足 \\(P_3\\) 的状态。例如，我们有：\n\
  \n(Aff) \\(\\{0 + x \\ge 0\\} a := 0 \\{ \\downarrow a + x \\ge 0 \\}\\)   (Aff)\
  \ \\(\\{ \\downarrow a + x \\ge 0 \\} b := x \\{ \\downarrow a + \\downarrow b \\\
  ge 0 \\}\\)\n(Seq) \\(\\frac{}{\\{0 + x \\ge 0\\} a := 0 ; b := x \\{ \\downarrow\
  \ a + \\downarrow b \\ge 0 \\}}\\)\n\n在这个示例中，我们希望以更简单的形式写出前条件，将 \\(0 + x \\ge 0\\\
  ) 替换为 \\(x \\ge 0\\) 并将后条件表示为 \\(\\downarrow a \\ge - \\downarrow b\\) 的形式。这种转换可以使用规则\
  \ (Cons) 实现：如果每个满足 \\(x \\ge 0\\) 的状态也满足 \\(0 + x \\ge 0\\)，并且从这样的状态执行序列 \\(a :=\
  \ 0 ; b := x\\) 导致一个满足 \\(\\downarrow a + \\downarrow b \\ge 0\\) 的状态（该状态必须验证 \\\
  (\\downarrow a \\ge - \\downarrow b\\)），那么 \\(\\{x \\ge 0\\} a := 0 ; b := x \\\
  { \\downarrow a \\ge - \\downarrow b \\}\\) 是一个可证明的三元组：\n\n(Seq) \\(\\frac{\\{0\
  \ + x \\ge 0\\} a := 0 ; b := x \\{ \\downarrow a + \\downarrow b \\ge 0 \\}}{\\\
  {x \\ge 0\\} a := 0 ; b := x \\{ \\downarrow a \\ge - \\downarrow b \\}}\\)   (Cons)\
  \ \\(\\begin{pmatrix} x \\ge 0 \\Rightarrow 0 + x \\ge 0 \\\\ \\downarrow a + \\\
  downarrow b \\ge 0 \\Rightarrow \\downarrow a \\ge - \\downarrow b \\end{pmatrix}\\\
  )\n\n此规则对 Hoare 三元组断言的转换基于必须建立的逻辑蕴含。采用外延方法，证明 \\(P_1 \\Rightarrow P_2\\) 要求我们表明：对于任何状态\
  \ \\((\\text{Env}, \\text{Mem})\\)，如果 \\([[P_1]]^{\\text{Mem}}_{\\text{Env}} = 1\\\
  )，则 \\([[P_2]]^{\\text{Mem}}_{\\text{Env}} = 1\\)。可以仅使用以下两条规则之一转换 Hoare 三元组中的两个断言中的一个：\n\
  \n(Consg) \\(\\frac{\\{P'_1\\} c \\{P_2\\}}{\\{P_1\\} c \\{P_2\\}} (P_1 \\Rightarrow\

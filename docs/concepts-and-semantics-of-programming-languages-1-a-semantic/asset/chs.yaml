  \ $e$ 的一个条件，使得：\n\n$[[let f = fun y \\mapsto e \\text{ in } (f x)]]_{Env} = [[(f\
  \ x)]]_{Env}$\n\n- 2) 当 $e = y + x$ 时，计算 $[[let f = fun x \\mapsto x + (f x) \\\
  text{ in } (f x)]]_{Env}$。\n\n## Exercise 3.3\n\n考虑以下表达式 $e$：\n\n```\nlet x = 3\
  \ in (let f = e_1 in (let g = e_2 in (let h = e_3 in e_4)))\n```\n\n其中：\n\n- $e_1$:\

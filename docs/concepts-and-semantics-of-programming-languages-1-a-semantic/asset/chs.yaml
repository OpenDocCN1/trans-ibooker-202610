- "## 1. 从硬件到软件\n\n本章首先对所有计算机中存在的组件进行简要概述，从大型机到平板电脑、智能手机和智能对象中的处理芯片，中间经过台式机或笔记本电脑。在此基于硬件的呈现之上，我们将接着给出计算机执行的操作的更抽象描述，从而对“程序”和“执行”这两个术语给出统一定义，超越所谓电子设备的各种特性。\n\
  \n### 1.1. 计算机：低层视图\n\n计算机科学是计算机对信息进行理性处理的科学。计算机有能力根据给定的指令执行各种进程。每个 _信息_ 项都是知识元素，可以使用信号传输，并使用一组符号序列结合一组用于解码它们的规则进行编码，即从符号序列重建信号。计算机使用二进制编码，涉及两个符号；这些符号可称为“真”/“假”、“0”/“1”或“高”/“低”；这些术语可以互换，都代表数字电子电路中电势的两个稳定状态。\n\
  \n#### 1.1.1. 信息处理\n\n从示意图上看，计算机由以下三类组件组成：\n\n- 内存：存储数据（信息）和可执行代码（即所谓的冯·诺依曼架构）；\n\
  - 一个或多个微处理器，称为 CPU（中央处理单元），通过应用基本操作来处理信息；\n- 外围设备：这些设备使 CPU/内存组合与外部之间能够交换信息。\n\n\
  计算机的信息处理——换句话说，程序的执行——可以总结为三个步骤的序列：获取数据、计算结果并返回它们。每个基本处理操作对应于 CPU 逻辑电路的配置，称为逻辑函数。如果该函数的结果仅取决于输入，并且计算中不涉及“时间”概念，则该函数称为组合逻辑函数；否则，称为时序逻辑函数。\n\
  \n例如，如图 1.1 所示的二进制半加器是一个电路，用于计算两个二进制数字（输入）的和，以及可能的进位值。它因此实现了一个组合逻辑函数。\n\n![](img/c9a176746efdbd36ba74d71dfdc86e86_17_0.png)\n\
  \n图 1.1. 二进制半加器\n\n组合函数的基本特征是，对于相同的输入，函数始终产生相同的输出，无论情况如何。时序逻辑函数则不然。\n\n例如，一个计算其输入变化次数的逻辑函数依赖于“时间”概念（变化随时间发生），并且在两个输入之间需要持久状态来记录计数器的先前值。该状态保存在内存中。对于时序函数，相同的输入值可能导致不同的输出值，因为每个输出不仅取决于输入，还取决于读取新输入时内存的状态。\n\
  \n#### 1.1.2. 内存\n\n计算机使用内存来保存程序和数据。内存组件中使用了几种不同的技术，简化的呈现如下：\n\n- RAM（随机存取存储器）：RAM\
  \ 内存既可读又可写。RAM 组件通常速度快，但也是易失性的：如果电力失效，其内容将丢失；\n- ROM（只读存储器）：存储在 ROM 中的信息在制造时写入，并且是只读的。ROM\
  \ 比 RAM 慢，但是非易失性的，例如，刻录的 DVD；\n- EPROM（可擦除可编程只读存储器）：该内存是非易失性的，但可以使用特定设备写入，通过紫外线照射，或通过修改电源电压等方式。它比\
  \ RAM 慢，无论是读取还是写入。EPROM 可以被视为相当于可重写 DVD。\n\n计算机使用几种技术的内存组件。随着访问速度的提高，存储容量会减小，因为快速访问内存成本更高。通常区分四种不同类型的内存：\n\
  \n- 大容量存储以太字节为单位，由机械磁盘（访问时间约为 10 ms）或——越来越多地——固态硬盘（SSD）块组成。这些块使用 EEPROM 变体（电可擦除），访问时间约为\
  \ 0.1–0.3 ms，称为闪存。大容量存储是非易失性的，主要用于文件系统；\n- RAM，位于微处理器外部。最近的家用计算机和智能手机通常具有较大的 RAM\
  \ 容量（以千兆字节为单位）。嵌入式系统或消费者开发电子板的 RAM 容量可能要低得多。访问时间约为 40–50 ns；\n- 缓存通常包含在现代机器的 CPU\
  \ 中。这是一个小容量的 RAM 内存（几千字节或兆字节），访问时间约为 5–10 ns。通常有多个缓存级别，访问时间随大小减小。缓存用于保存经常使用和/或连续的数据和/或指令，通过在本地保留信息来减少访问较慢\
  \ RAM 的需求。缓存管理很复杂：需要确保主内存和缓存中的数据一致性，不同 CPU 或不同内核（同一 CPU 中的完整独立处理单元）之间的一致性，以及决定丢弃哪些数据以释放空间等；\n\
  - 寄存器是速度最快的内存单元，位于微处理器本身的中心。微处理器包含有限数量（几十个）的这些存储区，由 CPU 指令直接使用。访问时间约为一个处理器周期，即约\
  \ 1 ns。\n\n#### 1.1.3. CPU\n\n顾名思义，CPU 是负责通过执行基本指令来处理信息的单元，这些指令大致可分为五类：\n\n- 数据传输指令（在寄存器之间或内存与寄存器之间复制）；\n\
  \n\n\n\n\n- 算术指令（两个寄存器中包含的两个整数值相加，乘以常数等。）；\n- 逻辑指令（按位与/或/非，移位，旋转等。）；\n- 分支操作（条件分支、无条件分支、子例程调用等。）；\n\
  - 其他指令（停止处理器、重置、中断请求、测试并置、比较并交换等。）。\n\n指令以特定于每个微处理器的格式编码为二进制字。高级编程语言中的几行程序被翻译成几十甚至几百条基本指令，手动编写这些指令既困难又容易出错且耗时。图1.2对此进行了说明，其中展示了用C编写的“Hello\
  \ World！”程序，旁边是其对应的x86-64指令，由gcc编译器生成。\n\n```\n#include <stdio.h>\nint main () {\n\
  \ printf (\"Hello world!\\n\") ;\n return (0) ;\n }\n\n.section __TEXT\n.globl _main\n\
  .align 4, 0x90\n_main:\n.cfi_startproc\n## BB#0:\npushq %rbp\nLtmp0:\n.cfi_def_cfa_offset\
  \ 16\nLtmp1:\n.cfi_offset %rbp, -16\nmovq %rsp, %rbp\nLtmp2:\n.cfi_def_cfa_register\
  \ %rbp\nsubq $16, %rsp\nleaq L_.str(%rip), %rdi\nmovb $0, -4(%rbp)\nmovb $0, %al\n\
  callq _printf\nxorl %ecx, %ecx\nmovl %eax, -8(%rbp)\nmovl %ecx, %eax\naddq $16,\
  \ %rsp\npopq %rbp\nretq\n.cfi_endproc\n.section __TEXT\nL_.str:\n.asciz \"Hello\
  \ world!\\n\"\n```\n\n## 图1.2. C和x86-64指令中的“Hello world！”\n\n简单来说，微处理器分为两部分：控制单元，负责解码和排序要执行的指令；以及一个或多个算术逻辑单元（ALU），负责执行指令规定的操作。CPU永久地运行一个三阶段循环：\n\
  \n- 1) 从内存中获取下一条要执行的指令：每个微处理器都包含一个特殊寄存器，即程序计数器（PC），它记录这条指令的位置（地址）。然后PC递增，即将获取的指令的大小加到其中；\n\
  - 2) 解码获取的指令；\n- 3) 执行这条指令。\n\n然而，下一条指令并不总是位于当前指令旁边。考虑示例1.1中用C编写的函数min，它返回其两个参数中较小的一个。\n\
  \n## 示例1.1\n\n```\nint min (int a, int b) {\nif (a < b) return (a) ;\nelse return\
  \ (b) ;\n}\n```\n\n该函数可以直观而天真地翻译成基本指令，首先将a和b放入寄存器，然后比较它们：\n\n```\nmin:\nload\ta,\
  \ reg0\nload\tb, reg1\ncompare\treg0, reg1\n```\n\n根据测试结果（真或假），会考虑不同的后续执行流程。执行继续使用其中一种后续流程的指令：因此我们有两条可能的控制路径。在这种情况下，必须使用条件跳转指令，在需要时修改PC值，以选择两条可能路径中的第一条指令。\n\
  \n```\nbranchgt\ta_gt_b\nload\treg0, reg2\njump\tend\na_gt_b:\nload\treg1, reg2\n\
  end:\nreturn\treg2\n```\n\nbranchgt指令将标签a_gt_b处指令的位置加载到PC中。如果compare指令的结果是reg0 >\
  \ reg1，则下一条指令是该地址处的指令：load reg1, reg2。否则，下一条指令是branchgt之后的指令：load reg0, reg2。随后是无条件跳转指令jump，它能无条件修改PC，将其加载为end标签的地址。因此，无论比较结果如何，执行都以指令`return\
  \ reg2`结束。\n\n条件分支需要使用特定的存储器来确定先前指令的执行是否满足某些条件（溢出、正结果、零结果、优越性等）。每个CPU都包含一个专用寄存器，即状态寄存器（SR），其中每一位都用于指示这些条件之一。执行大多数指令可能会修改寄存器中的所有或某些位。条件指令（包括跳转和更“异国情调”的变体）在执行时使用相应的位值。某些ARM®架构[ARM\
  \ 10]甚至允许所有指令本质上都是条件性的。\n\n每个程序都由函数组成，这些函数可以在程序的不同点调用，并且这些调用可以嵌套。当调用函数时，必须记录函数执行完成后执行应恢复的位置——即_返回地址_。考虑一个由函数g()\
  \ = k() + h()和f() = g() + h()组成的程序，其中包含多个函数调用，有些是嵌套的。\n\n```\ng () =\n  t11 = k\
  \ ()\n  t12 = h ()\n  return t11 + t12\n\nf () =\n  v11 = g ()\n  v12 = h ()\n \
  \ return v11 + v12\n```\n\n单个寄存器不足以记录不同调用的返回地址。从g调用k之后，必须调用h来计算t12。但这次g的调用是由f完成的，因此其在f中的返回地址也应被记录，以便后续计算v12。需要记录的返回地址数量随嵌套调用数量的增加而增加，并在退出这些调用时减少，这非常自然地暗示将这些地址保存在栈中。图1.3展示了连续函数调用期间栈结构的演变，证明了记录多个返回地址的必要性。栈的状态在每个执行步骤中都会显示，即在执行程序中的某一行时。\n\
  \n一个专用寄存器，栈指针（SP），始终包含栈中下一个空闲槽的地址（或者，最后一个已用槽的地址）。因此，在嵌套调用的情况下，返回地址被保存到SP指示的地址中，并且SP按该地址的大小递增。当函数返回时，PC会加载从栈中保存的地址，并且SP相应地递减。\n\
  \n![](img/c9a176746efdbd36ba74d71dfdc86e86_22_0.png)\n\n## 图1.3. 函数调用和返回地址\n\n总之，微处理器的内部状态由其通用寄存器、程序计数器、状态寄存器和栈指针组成。请注意，不过，这是一种高度简化的观点。存在许多不同种类的微处理器，具有不同的内部架构和/或指令集（例如，有些不具备整数除法指令）。因此，直接使用某个微处理器的指令集编写的程序无法在另一种微处理器型号上执行，需要重写。用给定微处理器的汇编语言编写的程序的可移植性几乎为零。高级语言通过提供与目标微处理器无关的语法结构来解决这个问题。编译器或解释器必须将这些结构翻译成微处理器使用的语言。\n\
  \n#### 1.1.4. 外围设备\n\n如1.1.3节所见，处理器执行获取、解码和执行指令的持续循环。计算使用存储在内存中的数据进行，无论是由程序本身还是由输入/输出机制完成。计算结果也存储在内存中，并可以使用此输入/输出机制返回给用户。\n\
  \n任何可编程系统的兴趣点本质上取决于输入/输出能力，系统通过该能力对外部环境做出反应并可能作用于该环境。即使是汽车工厂中一遍又一遍重复相同动作的装配机器人，也必须对来自环境的数据输入做出反应。例如，抓握机构的压力在抓住螺栓后必须停止增加，而完成此操作所需的时间会根据螺栓的确切位置而有所不同。\n\
  \n输入/输出系统使用外围设备运行，外围设备是可能是电子的、机械的或两者结合的辅助设备。这些设备允许微处理器获取外部信息，并将信息传输到外部。计算机\n\n\n\
  \n鼠标、屏幕和键盘是与台式计算机一起使用的外围设备，但电机、模拟/数字采集卡等其他元素也是外围设备。\n\n如果存在外围设备，微处理器需要将部分处理时间用于数据采集和计算结果的传输。与外围设备的这种交互可以直接集成到程序中。但在这种情况下，程序必须包含对输入外围设备的定期检查，以查看是否有新信息可用。在每个程序中包含此类监控在技术上是困难的（如果不是不可能的话）。此外，如果没有新数据可用，定期检查外围设备是对时间和精力的浪费。最后，无法保证信息会在检查时刻准确到达，因为数据可能是异步发送的。\n\
  \n该问题可以通过依赖硬件来指示新外部事件的发生，而不是使用软件来检查这些事件来避免。*中断*机制用于中断当前代码的执行并启动与外部事件相关的中断处理程序。该处理程序是一段代码，不会由正在执行的程序显式调用；它位于微处理器已知的地址。由于任何程序都可能在任何点被中断，因此在处理中断之前必须保存处理器状态，尤其是寄存器。用于处理中断的代码确实会使用寄存器并修改\
  \ SR、SP 和 PC。因此，必须恢复寄存器的先前值，以便恢复中断代码的执行。这种上下文保存部分由硬件执行，部分由软件执行。\n\n### 1.2. 计算机：高层视图\n\
  \n1.1 节中介绍的冯·诺依曼机器的低层视角，很好地概述了计算机的组件和程序执行，而无需深入电子元件的操作细节。然而，在日常编程活动的背景下，这种视角并不特别有帮助。二进制代码，甚至汇编代码编写的程序难以编写，因为它们需要考虑执行的每一个细节；它们本质上冗长，难以审阅、理解和调试。第一批“高级”编程语言在第一批计算机出现后不久就出现了。这些语言为内存中的某些值和地址赋予名称，提供一组可以拆分为低层机器指令的指令。换句话说，编程语言提供了计算机的抽象视角，使用户在编写程序时可以忽略低层细节。图\
  \ 1.2 中的“hello world”程序清楚地展示了 C 语言与 X86 汇编语言相比的抽象能力。\n\n#### 1.2.1. 建模计算\n\n任何程序只是在其自身编程语言中对一系列计算（包括读写操作）的描述，而这些是计算机能够执行的唯一操作。对计算机的抽象视角需要对计算概念的抽象视角——我们称之为*模型*。该主题早在计算机出现之前很久，即19世纪末，就由逻辑学家、数学家和哲学家首次探讨，他们引入了关于可计算性理论的多种不同方法。\n\
  \n图灵机 [TUR 95] 是1936年引入的一种计算数学模型。该机在分为单元的无限内存磁带上运行，并有三条指令：将磁带向左或向右移动一个单元，在单元中写入或读取符号，或比较两个单元的内容。已正式证明，任何具有赋值、条件指令和while循环的“命令式”编程语言，都具有与该图灵机相同的表达能力。\n\
  \n在20世纪期间，引入了若干其他算法计算概念模型，并已正式证明它们与图灵机等效。一个显著的例子是克莱尼的递归理论 [KLE 52]，它是“纯函数”语言的基础，基于（潜在）递归函数的概念；因此，这些语言也具有与图灵机相同的表达能力。纯函数语言和命令式语言在高级编程的历史上并行发展，导致了不同的编程风格。\n\
  \n#### 1.2.2. 高级语言\n\n广义上说，函数式程序的执行是进行一系列导致结果的函数调用，中间值完全存储在寄存器中。命令式程序的执行是对由标识符命名的内存单元进行一系列修改，单元中的值在执行期间计算。最广泛使用的高级语言同时包含函数式和命令式特性，以及各种可能性（模块、对象特性等），用于将源代码分割成可重用的片段。\n\
  \n无论使用何种编程风格，任何用高级语言编写的程序都需要被翻译成二进制语言才能执行。这些翻译要么在每次执行程序时执行——在这种情况下，翻译程序称为*解释器*——要么只执行一次并存储生成的二进制代码——在这种情况下，翻译器称为*编译器*。\n\
  \n正如我们所见，高级语言有助于算法的编码。它们便于审阅程序的源代码，因为与汇编代码中的相同算法相比，文本更加简洁。然而，这并不意味着用户能更好地理解程序的工作方式。编写程序时，对所使用的构造（换句话说，它们的*语义*，即它们做什么和意味着什么）有精确的了解，对于理解源代码至关重要。错误并不总是算法编码错误的结果，而且通常是由对语言元素的错误解释引起的。例如，C语言中的递增运算符`++`存在两种形式（`i++`或`++i`），其理解并不像看起来那么简单。例如，以下程序：\n\
  \n```\n#include <stdio.h>\nint main () {\nint i = 0 ;\nprintf (\"%d\\n\", i++) ;\n\
  return (0) ;\n}\n```\n\n将打印0，但如果将`i++`替换为`++i`，同一程序将打印1。\n\n所有高级语言都共有若干概念：值命名、命名空间组织、显式内存管理等。然而，这些概念可以使用不同的语法结构来表达。语言语义领域涵盖一组逻辑-数学理论，用于描述这些概念及其属性。构建程序的语义允许正式验证程序是否具备所有所需属性。\n\
  \n#### 1.2.3. 从源代码到可执行程序\n\n从程序源代码到其执行的过程是一个多步骤过程。这些步骤在不同语言中可能有所不同。在本节中，我们将概述分析和转换源代码涉及的主要步骤，适用于大多数编程语言。\n\
  \n程序的源代码由一个或多个文本文件组成。确实，为了便于软件架构，大多数语言允许将源代码拆分为多个文件，称为*编译单元*。每个文件在最终阶段之前单独处理，在该阶段中，处理结果将合并为一个单一的*可执行文件*。\n\
  \n##### 1.2.3.1. 词法分析\n\n词法分析是翻译的第一阶段：它将确实是源文件的字符序列转换为一系列*单词*，并将每个分配到一个类别。注释通常在此阶段被删除。因此，在以下被假设用C语言编写的文本中\n\
  \n\n/* This is a comment. */\nif [x == 3 int +) cos ($v\n\n词法分析将识别关键字 if、左括号、标识符\
  \ x、运算符 ==、整数常量 3、类型标识符 int 等。C 语言中的单词不能包含字符 $，因此在遇到 $v 时会高亮显示词法错误。\n\n词法分析可视为一种“拼写检查”形式，其中每个被识别的单词都会被分配到一个类别（关键字、常量、标识符）。这些单词被称为\
  \ token。\n\n##### 1.2.3.2. 语法分析\n\n每种语言都遵循语法。例如，在英语中，如果一个句子包含主语、动词和补语，并且顺序易于理解，则通常被认为构成正确。编程语言也不例外：语法分析验证源文件中的短语是否符合其语言的语法。例如，在\
  \ C 语言中，关键字 if 后必须跟一个带括号的表达式，一条语句必须以分号结束，等等。很明显，上面在词法分析语境下给出的源文本不符合 C 语言的语法。\n\n\
  从技术角度看，语法分析器负责源文件的完整语法分析。每当需要一个 token 来推进已分析源码的进度时，它就会调用词法分析器。因此，语法分析是一种语法验证形式，同时它还通过一种数据结构（通常是一棵树，称为抽象语法树（AST））构建源文件的表示。该数据结构将被编译的所有后续阶段使用，一直到由解释器执行或创建可执行文件为止。\n\
  \n##### 1.2.3.3. 语义分析\n\n编译的前两个分析阶段仅关注源码的文本结构。它们不关注程序的含义，即其语义。通过语法分析阶段的源文本并不总是有意义。短语“大海吃了一只可派生的兔子”在语法上是正确的，但显然是胡言乱语。\n\
  \n最著名的语义分析是类型分析，它禁止组合性质不兼容的元素。因此，在上一阶段中，“可派生的”可能适用于函数，但绝不适用于“兔子”。\n\n语义分析不仅限于一种类型分析形式，但它们都会根据所选语言的语义来解释程序的结构。语义分析可用于消除会导致执行错误的程序。它们还可以对程序代码应用某些转换，以生成可执行文件（依赖分析、闭包消除等）。这些语义分析可以在源代码处理的后续遍中执行，甚至在下一节描述的代码生成阶段之后执行。\n\
  \n##### 1.2.3.4. 代码解释/生成\n\n一旦创建了抽象语法树（或其派生树），就有两种选择。要么通过编程语言提供的 *解释器* 直接执行该树，要么使用\
  \ AST 生成 *目标代码* 文件，旨在创建可以独立运行的可执行文件。我们先关注第二种方法。解释机制将在后面讨论。\n\n编译使用从源文件生成的 AST 来生成一系列指令，这些指令将由\
  \ CPU 或虚拟机（VM）执行。如果执行这一系列指令的结果符合程序的语义，则编译是正确的。\n\n优化阶段可能在目标代码生成期间或之后进行，旨在提高其紧凑性或执行速度。现代编译器实现了一系列优化，其研究超出了本书的范围。某些优化是“通用”的，而其他优化可能特定于生成代码所针对的\
  \ CPU。\n\n编译器生成的目标代码可以是直接编码指令的二进制代码，也可以是汇编代码形式的源文本。在后一种情况下，必须调用一个称为 *汇编器* 的程序，将这种低级源代码转换为二进制代码。一般来说，汇编器只是以机械方式将助记符编写的指令（mov、add、jmp\
  \ 等）转换为二进制表示。然而，某些更复杂的汇编器也可能在此级别执行优化操作。\n\n将助记符代码汇编为二进制代码是一个非常简单的操作，不会改变程序的结构。目标\
  \ CPU 的参考手册为每条指令提供了相应二进制字中各位的含义。例如，MIPS32® 架构 [MIP 13] 的参考手册描述了指令 ADD rd , rs ,\
  \ rt（对寄存器产生的效果为 rd ← rs + rt）的 32 位二进制格式如下：\n\n| 位权重 | 31 | 26 | 25 | 21 | 20 |\
  \ 16 | 15 | 11 | 10 | 0 |\n|---|---|---|---|---|---|---|---|---|---|---|\n| 位值 |\
  \ 000000 | num.rs | num.rt | num.rd | | | | | | 000000100000 |\n\n图 1.4. 在 MIPS32®\
  \ 中对 ADD 指令进行编码\n\n三个 6 位的组保留用于编码寄存器编号；该字中的其他位是固定的，用于编码指令。汇编器的任务是根据源代码中遇到的指令生成此类位模式。\n\
  \n##### 1.2.3.5. 链接\n\n一个程序可能由多个分别编译的源文件组成。一旦每个源文件的目标代码被生成，所有这些代码都必须收集到一个可执行文件中。每个目标文件都包括“空洞”，指示在生成该目标代码时未知的信息。了解在哪里可以找到这段缺失代码非常重要，例如在调用在不同编译单元中定义的函数时，或在当前单元之外定义的变量的位置。\n\
  \n链接器必须收集所有目标文件并填充所有空洞。显然，要使一组目标文件生成可执行文件，所有空洞都必须填充；因此，源代码中调用的每个函数的代码都必须可用。链接过程还必须集成所需代码，如果这些代码来自某些库（无论是标准语言库还是第三方库）。还有一个最终问题需要回答，即关于执行应从何处开始。在某些语言（如\
  \ C、C++ 和 Java）中，源代码必须包含一个且仅一个特殊函数，通常名为 main，用于启动执行。在其他语言（如 Python 和 OCaml）中，定义按照它们出现的顺序执行，该顺序由链接过程中的文件顺序定义。因此，“执行”函数的定义并不会调用该函数：相反，该函数的“值”会被创建并存储，以便在以后调用函数时使用。这意味着程序员必须在源文件中插入对他们认为是执行“起点”的函数的调用。此调用通常是链接器处理的最后一个源文件的最后一条指令。\n\
  \n源代码编译中涉及的不同转换阶段的简化图示如图 1.5 所示。\n\n![](img/c9a176746efdbd36ba74d71dfdc86e86_28_0.png)\n\
  \n**图 1.5. 编译过程**\n\n##### 1.2.3.6. 解释和虚拟机\n\n如我们所见，非正式地说，解释器直接从 AST “执行” 程序。此外，代码生成过程可以为虚拟机生成代码。实际上，解释器很少直接在树上工作；编译到虚拟机通常作为中间阶段进行。虚拟机（VM）可以被视为一种伪微处理器，具有一个或多个栈、寄存器和相当高级别的指令。VM\
  \ 的代码通常被称为字节码。在这种情况下，编译不会生成由 CPU 直接执行的文件。执行由虚拟机解释器执行，这是由编程语言环境提供的程序。因此，解释和编译之间的区别并不明显。\n\
  \n使用 VM 有几个优点：编译器不再需要考虑 CPU 的特定性，代码通常更加紧凑且可移植性更高。只要计算机上有虚拟机解释器的可执行文件，就可以为该计算机生成二进制文件。这种方法的缺点是，以这种方式获得的程序通常比编译为“原生”机器码的程序要慢。\n\
  \n\n\n"
- "## 2. 编程语言语义介绍\n\n本章直观地介绍了名称、环境、内存等概念，并对这些概念给出了初步的形式化描述。它使读者能够熟悉我们与多位其他作者共享的编程语义方法\
  \ [ACC 92, DOW 09, DOW 11, FRI 01, WIN 93]。\n\n任何高级编程语言都使用名称来表示程序处理的实体。这些名称通常称为标识符，强调了它们是按照所选语言的语法规则构建的这一事实。它们可用于表示特定于程序的值或在执行期间计算的值。它们也可以表示位置（即内存中的地址），此时它们称为可变变量。并且，标识符还可以表示运算符、函数、过程、模块、对象等，具体取决于语言中存在的语法结构。例如，π\
  \ 通常用于表示 π 的近似值；+ 也是一个标识符，表示加法运算符，并且通常放在两个操作数之间，即中缀位置，如 2 + 3。表达式 2 * x + 1 使用标识符\
  \ x，要计算其值，我们需要知道 x 所表示的值。检索给定标识符关联的值是任何高级语言核心机制。语言的语义为这种机制提供了一个模型，以简化形式在第 2.1 节中介绍。\n\
  \n以下给出的所有语言、指令、算法等的形式定义，都在编程语言 OCaml 和 Python 中进行了编码，力求对这些定义进行意译，并在这两种语言中生成非常相似的代码版本，即使这些语言的开发者可能会发现这里使用的编程风格相当不同。对于不熟悉这些语言的读者，在代码展示中给出了一些非常简短的说明。但是，OCaml\
  \ 和 Python 的几乎所有特性都将在第一卷或第二卷中予以考虑，第二卷中涉及面向对象编程。我们希望，正式概念的这两种编码可以帮助那些不太熟悉数学形式化的读者。\n\
  \n### 2.1. 环境、内存和状态\n\n#### 2.1.1. 求值环境\n\n令 **X** 为标识符集，**V** 为值集。将标识符 \\(x \\\
  in \\mathbf{X}\\) 与值 \\(v \\in \\mathbf{V}\\) 关联称为 *绑定*（标识符到其值的绑定），而一组绑定 ENV 称为\
  \ *执行环境* 或 *求值环境*。ENV(\\(x\\)) 表示 ENV 中标识符 \\(x\\) 所关联的值。环境集记作 **E**。\n\n在实践中，实际使用的标识符集\
  \ **X** 是有限的：通常，我们只考虑出现在程序中的那些标识符。因此，环境可以由一组绑定列表表示，也称为 ENV：\n\n```\n[(x_1, ENV(x_1)),\
  \ (x_2, ENV(x_2)), ... , (x_n, ENV(x_n))]\n```\n\n其中 \\(\\{x_1, x_2, \\dots, x_n\\\
  }\\) 表示 **X** 的一个有限子集，称为环境的 *域*，记作 dom(ENV)。按惯例，ENV(\\(x\\)) 表示值 \\(v\\)，该值出现在从头部读取列表\
  \ ENV（即从左到右）时遇到的第一个 \\((x, v)\\) 绑定中。\n\n在此模型中，可以使用运算符 \\(\\oplus\\) 将绑定添加到环境中。按惯例，绑定被添加到表示环境的列表头部（左侧）：\n\
  \n```\n\\(\\(x_{new}, v_{new}) \\oplus [(x_1, v_1), (x_2, v_2), \\dots , (x_n, v_n)]\\\
  )\n\\(= [(x_{new}, v_{new}), (x_1, v_1), (x_2, v_2), \\dots , (x_n, v_n)]\\)\n```\n\
  \n假设某个操作引入了标识符的新绑定，而该标识符已存在于环境中，例如 \\((x_2, v_{new})\\)：\n\n```\n\\(\\(x_2, v_{new})\
  \ \\oplus [(x_1, v_1), (x_2, v_2), \\dots , (x_n, v_n)]\\)\n\\(= [(x_2, v_{new}),\
  \ (x_1, v_1), (x_2, v_2), \\dots , (x_n, v_n)]\\)\n```\n\n由此获得的环境 \\((x_2, v_{new})\
  \ \\oplus \\text{ENV}\\) 包含两个针对 \\(x_2\\) 的绑定。查找绑定从环境头部开始，并且按照我们的惯例，新绑定被添加到头部。因此，最近添加的\
  \ \\((x_2, v_{new})\\) 将首先被找到。绑定 \\((x_2, v_2)\\) 并未被删除，但被认为被新绑定 \\((x_2, v_{new})\\\
  ) *遮蔽*。因此，同一环境中可能存在针对单个标识符 \\(x\\) 的多个绑定，而为 \\(x\\) 添加的最后一个绑定将被用来确定环境中 \\(x\\) 的关联值。正式地，环境\
  \ \\((x, v) \\oplus \\text{ENV}\\) 验证以下属性：\n\n\\(\\big((x, v) \\oplus \\text{ENV}\\\
  big)(x') = \\begin{cases} v & \\text{if } x = x' \\\\ \\text{ENV}(x') & \\text{if\
  \ } x \\neq x' \\end{cases}\\)\n\n按惯例，记号 \\((x_2, v_2) \\oplus (x_1, v_1) \\oplus\
  \ \\text{ENV}\\) 用于表示环境 \\((x_2, v_2) \\oplus \\big((x_1, v_1) \\oplus \\text{ENV}\\\
  big)\\)。例如，\\(\\big((x, v_2) \\oplus (x, v_1) \\oplus \\text{ENV}\\big)(x) = v_2\\\
  )\n\n当环境由绑定列表表示时，值 \\(\\text{ENV}(x)\\) 的查找方式如下：\n\n```\nPython\ndef valeur_de(env,x):\n\
  \   for (x1,v1) in env:\n      if x==x1: return v1\n   return None\n```\n\n```\n\
  OCaml\nlet rec valeur_de env x = match env with\n | [] -> None\n | (x1, v1) :: t\
  \ -> if x = x1 then Some v1 else (valeur_de t x)\nval valeur_de : ('a * 'b) list\
  \ -> 'a -> 'b option\n```\n\n如果环境中找不到给定标识符的绑定，该函数将返回一个特殊值，以指示绑定的缺失。在 Python 中，使用常量\
  \ None 来表达这种值的缺失，而在 OCaml 中，使用预定义的和类型 'a option：\n\n```\nOCaml\ntype 'a option =\
  \ Some of 'a | None\n```\n\n'a option 类型的值要么是 'a 类型的值，要么是常量 None。将类型 'a 的值 \\(v\\\
  ) 转换为类型 'a option 的值，是通过将构造器 Some 应用于 \\(v\\) 来完成的（参见第 5 章）。值 None 用于表示类型 'a 的值的缺失；更准确地说，None\
  \ 是一个不是类型 'a 的值的常量。这种类型 'a option 将进一步用于表示某种无意义或缺失的值，但这些值对于完全完成某些定义是必需的。\n\n环境的域可以通过遍历表示它的列表来简单地计算。这里定义的有限集是所有无重复元素的列表。\n\
  \n```\nPython\ndef union_singleton(e,l):\n    if e in l: return l\n    else: return\
  \ [e]+l\n\ndef dom_env(env):\n    r=[]\n    for (x,v) in env: r = union_singleton(x,r)\n\
  \    return r\n```\n\n```\nOCaml\nlet rec union_singleton e l = if (List.mem e l)\
  \ then l else e::l\nval union_singleton : 'a -> 'a list -> 'a list\nlet rec dom_env\
  \ env = match env with\n| [] -> [] | (x, v) :: t -> (union_singleton x (dom_env\
  \ t))\nval dom_env : ('a * 'b) list -> 'a list\n```\n\n由于函数 valeur_de 返回的值是通过从列表头部遍历获得的，因此将新绑定\
  \ \\((x,v)\\) 添加到环境中是在列表头部进行的，而 \\(x\\) 的先前绑定（如果有）会被遮蔽，但不会被删除。\n\n```\nPython\n\
  def ajout_liaison_env(env,x,v): return [(x,v)]+env\n```\n\n```\nOCaml\nlet ajout_liaison_env\
  \ x v = (x, v) :: env\nval ajout_liaison_env : ('a * 'b) list -> 'a -> 'b -> ('a\
  \ * 'b) list\n```\n\n#### 2.1.2. 内存\n\n下面介绍的内存形式模型不对第 1 章中描述的各种物理内存做出区分。内存的状态通过将值与存储该值的单元的位置关联来描述。位置本身被视为值，称为引用。正如我们所见，高级语言允许我们用绑定到单元\
  \ c 的引用 r 的标识符 x 来命名包含值 v 的位置 c。\n\n令 \\(\\mathbf{R}\\) 为引用集，\\(\\mathbf{V}\\) 为值集。将引用\
  \ \\(r \\in \\mathbf{R}\\) 与值 \\(v \\in \\mathbf{V}\\) 关联表示为一对 \\((r,v)\\)，而这样的一对集合\
  \ Mem 在这里称为内存。Mem(r) 表示在 Mem 中引用 r 处存储的值。令 M 为内存集。在实践中，实际使用的引用集是有限的：再次强调，通常只考虑程序使用的那些位置。这意味着内存可以由一个列表表示，也称为\
  \ Mem：\n\n```\n[(r_1, Mem(r_1)), (r_2, Mem(r_2)), \\cdots , (r_n, Mem(r_n))]\n```\n\
  \n\n\n\n\n内存中存在一对 $(r, v)$ 记录表明在这个位置已经执行过一次初始化或写入操作。每个被引用的内存单元都可以通过 *读取* 来查询，并可以通过\
  \ *写入* 赋予新值。在这种情况下，单元中先前保存的值被删除，它已经 \"崩溃\"。\n\n在地址 $r$ 上写入值 $v$ 会将内存 $\\text{Mem}$\
  \ 转换为记为 $\\text{Mem}[r := v]$ 的内存；如果在位置 $r$ 上在 $\\text{Mem}$ 中存储了一个值，那么这个 \"旧\"\
  \ 值将被 $v$ 替换；否则，将一对新的添加到 $\\text{Mem}$ 中以考虑写入操作。不存在屏蔽，这与环境的情况相反。在一个已经包含值的位置 $r$\
  \ 上写入新值 $v$ 会删除旧值 $\\text{Mem}(r)$：\n\n```\n[(r_1, v_1), \\cdots, (r_i, v_i), \\\
  cdots, (r_n, v_n)][r_i := v'_i] = [(r_1, v_1), \\cdots, (r_i, v'_i), \\cdots, (r_n,\
  \ v_n)]\n```\n\n内存的域 $\\text{dom}(\\text{Mem})$ 取决于当前环境，并表示引用的空间，这些引用可以（直接或间接）从当前执行环境中绑定且未被屏蔽的标识符访问。将绑定\
  \ $(x, r)$ 添加到环境 $\\text{Env}$ 具有双重效果，即创建 $(x, r) \\oplus \\text{Env}$ 并将 $\\text{Mem}$\
  \ 扩展为 $\\text{Mem}[r := v]$。\n\n注。—— 取决于所涉及的语言或程序，值 $v$ 可能在引入 $x$ 时提供，或者稍后提供，或者从不提供。如果在首次使用之前未提供任何值，程序的结果是不可预测的，从而导致称为初始化错误的错误。确实，一个位置始终包含一个值，如果该值未由程序显式确定，则不需要适合当前计算。\n\
  \n请注意，在环境 $\\text{Env}$ 中添加绑定 $(x, r)$（其域包含 $x$）可能会屏蔽 $\\text{Env}$ 中 $x$ 的先前绑定，但如果\
  \ $r$ 已经存在于 $\\text{Mem}$ 的域中，则不会将一对新的 $(r, v)$ 添加到 $\\text{Mem}$。因此，表示内存的任何对列表都不能包含两个针对相同引用的不同对。内存\
  \ $\\text{Mem}[r := v]$ 验证以下属性：\n\n```\n\\text{Mem}[r := v](r') = \\begin{cases}\
  \ v & \\text{if } r = r' \\\\ \\text{Mem}(r') & \\text{if } r \\neq r' \\end{cases}\n\
  ```\n\n内存 $(\\text{Mem}[r_1 := v_1])[r_2 := v_2]$ 记为 $\\text{Mem}[r_1 := v_1][r_2\
  \ := v_2]$。\n\n例如，$(\\text{Mem}[r := v_1][r := v_2])(r) = v_2$。\n\n> 函数 *valeur_ref*\
  \ 计算给定位置存储的值。如果此位置之前没有写入任何内容，该函数返回一个特殊值 (None)，表示没有已知值（即由初始化或计算产生的值）。\n\n```python\n\
  def valeur_ref(mem,a):\n    if len(mem) == 0: return None\n    else:\n        a1,v1\
  \ = mem[0]\n        if a == a1: return v1\n        else: return valeur_ref(mem[1:],a)\n\
  ```\n\n```ocaml\nlet rec valeur_ref mem a = match mem with\n  | [] -> None\n  |\
  \ (a1, v1) :: t -> if a = a1 then Some v1 else (valeur_ref t a)\nval valeur_ref\
  \ : ('a * 'b) list -> 'a -> 'b option\n```\n\n以下函数将值写入内存：\n\n```python\ndef write_mem(mem,a,v):\n\
  \    if len(mem) == 0: return [(a,v)]\n    else:\n        a1,v1 = mem[0]\n     \
  \   if a == a1: return [(a1,v)] + mem[1:]\n        else: return [(a1,v1)] + write_mem(mem[1:],a,v)\n\
  ```\n\n```ocaml\nlet rec write_mem mem a v = match mem with\n  | [] -> [(a, v)]\n\
  \  | (a1, v1) :: t ->\n      if a = a1 then (a1, v) :: t else (a1, v1) :: (write_mem\
  \ t a v)\nval write_mem : ('a * 'b) list -> 'a -> 'b -> ('a * 'b) list\n```\n\n\
  #### 2.1.3. 状态\n\n状态定义为一对 $(\\text{Env}, \\text{Mem}) \\in \\mathbf{E} \\times \\\
  mathbf{M}$，使得 Mem 域中的任何引用都可以从 Env 中的绑定访问。如果一个引用的值可以通过 Env 中包含的标识符，通过一系列读取、写入或引用操作来读取或写入，则该引用被认为是\
  \ *可访问* 的。\n\n给定环境 Env，标识符集合 **X** 被划分为两个子集：$\\mathbf{X}^{\\text{ref}}_{\\text{Env}}$，包含绑定到引用的标识符，以及\
  \ $\\mathbf{X}^{\\text{cst}}_{\\text{Env}}$，包含其他标识符：\n\n$\\mathbf{X}^{\\text{ref}}_{\\\
  text{Env}} = \\{x \\in \\mathbf{X} \\mid \\text{Env}(x) \\in \\mathbf{R}\\} \\qquad\
  \ \\mathbf{X}^{\\text{cst}}_{\\text{Env}} = \\{x \\in \\mathbf{X} \\mid \\text{Env}(x)\
  \ \\in \\mathbf{V} \\setminus \\mathbf{R}\\}$\n\n与 $\\mathbf{X}^{\\text{ref}}_{\\\
  text{Env}}$ 中标识符 $x$ 关联的值是一个引用 $\\text{Env}(x) = r$，其中存储了一个值 $\\text{Mem}(r)$，该值可以通过写入来修改。$\\\
  mathbf{X}^{\\text{ref}}_{\\text{Env}}$ 的标识符通常称为 *可变变量*。\n\n### 2.2. 表达式的求值\n\n表达式的值是根据求值环境和内存计算的，即在给定状态下计算。此计算由表达式的求值语义定义。\n\
  \n#### 2.2.1. 语法\n\n此处使用的表达式语言 Exp1 将在第 3 章和第 4 章中扩展。其语法在表 2.1 中定义。\n\n| e ::= k\
  \ | 整数常量 | (k ∈ Z) |\n|---|---|---|\n| x | 标识符 | (x ∈ X) |\n| e1 + e2 | 加法 | (e1,\
  \ e2 ∈ Exp1) |\n| !x | 解引用 | (x ∈ X) |\n\n表 2.1. 表达式语言 Exp1\n\n因此，表达式 e ∈ Exp1 要么是整数常量\
  \ k ∈ Z，要么是标识符 x ∈ X，要么是对 Exp1 中两个表达式应用加法运算符得到的表达式，要么是形式为 !x 的表达式，表示绑定到可变变量 x 的内存位置中存储的值。因此，这是集合\
  \ Exp1 的归纳定义。请注意，Exp1 不包括赋值构造。这是一个刻意的选择。这一点将通过 Exp1 的扩展在第 2.3 节中更详细地讨论。\n\n注。——\
  \ 在定义表达式语法时使用的符号 + 并不表示整数加法运算符。它可以被任何其他符号替换（例如 ⊠）。其含义将由求值语义分配。常量符号也是如此：例如，符号 4 可以被解释为自然整数、相对整数或字符。\n\
  \n示例 2.1.— !x + y 是 Exp1 中的表达式，如同 (x + 2) + 3 一样。此处使用括号来构建表达式，它们属于所谓的具体语法，并在 AST\
  \ 中消失。\n\n> 语言中格式良好的表达式集合 Exp1 通过归纳定义，并直接用递归求和类型表示。这类类型可以在 OCaml 中构建，但在 Python 中不能；在后一种情况下，可以通过为每个求和类型构造函数定义一个类来部分模拟。每个类必须包含一个方法，其参数与其所实现的求和类型构造函数的参数完全对应。这种类型在\
  \ Python 中的实现是 naive 的，用户必须确保这些类被正确使用。我们知道在 Python 中有编程动态类型验证机制的可能性，这些机制模拟强类型（类似于\
  \ OCaml 中使用的类型）并确保代码被正确使用；然而，这些技术超出了本书的范围。本书中显示的所有实现的目的仅仅是说明并直观地证明概念的正确处理。如我们已经做过的那样，我们选择这种方法来实现求和类型。\n\
  \n使用 Python，我们定义以下类来表示集合 Exp1 的构造函数：\n\n```python\nclass Cste1:\n    def __init__(self,cste):\n\
  \        self.cste = cste\n\nclass Var1:\n    def __init__(self,symb):\n       \
  \ self.symb = symb\n\nclass Plus1:\n    def __init__(self,exp1,exp2):\n        self.exp1\
  \ = exp1\n        self.exp2 = exp2\n\nclass Bang1:\n    def __init__(self,symb):\n\
  \        self.symb = symb\n```\n\n例如，示例 2.1 中定义的表达式 e1 = !x + y 写作：\n\n```python\n\
  ex_exp1 = Plus1(Bang1(\"x\"),Var1(\"y\"))\n```\n\n使用 OCaml，算术表达式的类型直接定义如下：\n\n```ocaml\n\
  type 'a exp1 =\n    Cste1 of int | Var1 of 'a | Plus1 of 'a exp1 * 'a exp1 | Bang1\
  \ of 'a\n```\n\n因此，此类型的值可以通过以下方式获得：将 Cste1 构造函数应用于整数值，在这种情况下它们对应于常量表达式；或者将 Var1\
  \ 构造函数应用于类型 'a 的值，该值对应于用于表示标识符的类型（因此类型 'a exp1 是多态的，因为它取决于另一个类型）；或者将 Plus1 构造函数应用于两个类型\
  \ 'a exp1 的值；或者将 Bang1 构造函数应用于类型 'a 的值。例如，表达式 e1 = !x + y 写作：\n\n```ocaml\nlet ex_exp1\
  \ = Plus1 (Bang1 (\"x\"), Var1 (\"y\"))\nval ex_exp1 : string exp1\n```\n\n####\
  \ 2.2.2. 值\n\n给定状态 (Env,Mem)，我们通过计算 e 在该状态中的值来确定表达式 e ∈ Exp1 的求值语义，即通过在该状态中求值 e\
  \ 来\n\n\n\n此状态。值可以是相对整数或引用，故 V = Z ∪ R。向集合 V 添加一个特定的值 Err；该结果作为“无意义”表达式的值返回。因此，在\
  \ Exp₁ 中对表达式求值的结果将是属于集合 V = V ∪ {Err} 的值。\n\nV 中的值要么是相对整数，要么是引用。通过定义求和类型，这两组值可以被归组为一个单一类型。\n\
  \n```python\nclass CInt1:\n    def __init__(self,cst_int):\n        self.cst_int\
  \ = cst_int\n\nclass CRef1:\n    def __init__(self,cst_adr):\n        self.cst_adr\
  \ = cst_adr\n```\n\n每个类都有一个与类同名的（对象）构造函数：从整数 n（或分别从引用 r）获得的常量 k 因此写作 CInt1(n)（分别为\
  \ CRef1(r)），并且该整数（分别为引用）可以通过从（对象）k 编写 k.cst_int（分别为 k.cst_adr）来访问。使用 OCaml 时，V 中元素的类型直接定义如下：\n\
  \n```ocaml\ntype 'a const1 = CInt1 of int | CRef1 of 'a\n```\n\n此类型的值可以通过将构造函数 CInt1\
  \ 应用于整数值，或将构造函数 CRef1 应用于类型为 'a 的值（该值对应于用于表示引用的类型）来获得。\n\n通过应用相同的方法，定义了一个对 V = V\
  \ ∪ {Err} 元素进行分组的类型：\n\n```python\nclass VCste1:\n    def __init__(self,cste):\n\
  \        self.cste = cste\n\nclass Erreur1:\n    pass\n```\n\nV 中的元素 v 要么是从常量 k\
  \ 获得的 V 中的值，写作 VCste1(k)，要么是类 Erreur1 中的对象（此处使用 pass 来表示（对象）构造函数没有参数）。使用 OCaml 时，V\
  \ 中元素的类型直接定义如下：\n\n```ocaml\ntype 'a valeurs1 = VCste1 of 'a const1 | Erreur1\n\
  ```\n\n#### 2.2.3. 求值语义\n\n可用于描述表达式求值的形式主义有几种，这些将在后面介绍。让我们构造一个求值函数：\n\n```\n[[-]]_-\
  \ : E × M × Exp_1 → V\n```\n\n表达式 e 在环境 Env 和内存状态 Mem 中的求值表示为 [[e]]^Mem_Env = v，其中\
  \ v ∈ V。表 2.2 包含函数 [[-]]_- 的递归定义：\n\n| [[k]]^Mem_Env = k | (k ∈ Z) |\n| --- | ---\
  \ |\n| [[x]]^Mem_Env = Env(x) | 如果 x ∈ X 且 x ∈ dom(Env) |\n| [[x]]^Mem_Env = Err\
  \ | 如果 x ∈ X 且 x ∉ dom(Env) |\n| [[e1 + e2]]^Mem_Env = [[e1]]^Mem_Env + [[e2]]^Mem_Env\
  \ | 如果 [[e1]]^Mem_Env ∈ Z 且 [[e2]]^Mem_Env ∈ Z |\n| [[e1 + e2]]^Mem_Env = Err |\
  \ 如果 [[e1]]^Mem_Env ∉ Z 或 [[e2]]^Mem_Env ∉ Z |\n| [[!x]]^Mem_Env = Mem(Env(x)) |\
  \ 如果 x ∈ X^ref_Env |\n| [[!x]]^Mem_Env = Err | 如果 x ∉ X^ref_Env |\n\n表 2.2. Exp_1\
  \ 中表达式的求值\n\n整数常量的值是其表示的整数。标识符的值是绑定到它在环境中的值，或为 Err。由加法符号和两个表达式 e1 及 e2 构造的表达式的值，通过将\
  \ e1 和 e2 的求值得到的相对整数相加来获得；如果 e1 或 e2 不是整数，则结果为 Err。当 x 是可变变量时，!x 的值是存储在引用 Env(x)\
  \ 处的值，否则为 Err。\n\n因此，如果 e 被求值为引用，那么 e 只能是一个标识符。此外，Exp1 中某些表达式在语法上是正确的，但毫无意义：例如，表达式\
  \ !x 在 x 不是可变变量时，即当 x 在环境中不绑定引用时，或者 x1 + x2 在 x1（或 x2）是可变变量时。另一方面，!x + y 是一个有意义的表达式，当\
  \ y 绑定一个整数且 x 绑定一个指向整数的引用时，它表示一个值。\n\n示例 2.2.– 让我们求值表达式 !x + y\n\n```\nin the state\
  \ Env = [(x, rx), (y, 2)] and Mem = [(rx, 3)]:\n```\n\n```\n[[!x + y]]^Mem_Env =\
  \ [[!x]]^Mem_Env + [[y]]^Mem_Env\n= Mem(Env(x)) + Env(y) = Mem(rx) + 2 = 3 + 2 =\

  \ v1 > v2 时为假 | |\n| v1 ∉ Z | Err_T | Err_T |\n\n#### 3.2.3. 运算符的解释\n\nExp2 中的原始运算符是用于从现有表达式构造新表达式的符号。要对表达式求值，必须确定每个符号\

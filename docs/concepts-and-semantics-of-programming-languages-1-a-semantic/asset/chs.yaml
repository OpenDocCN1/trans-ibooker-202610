  \ \\times p \\times (p - 1) \\times \\dots \\times 2 \\\\ r_x := \\text{Mem}(r_x)\
  \ - 1 \\end{bmatrix} \\right)\\)\n\\(= \\text{Mem}[r_y := \\text{Mem}(r_y) \\times\
  \ p!][r_x := \\text{Mem}(r_x) - 1]\\)\n```\n\n使用定理 4.2，我们可以从 \\(F^0(\\perp) = \\\
  perp : \\text{Mem} \\mapsto \\text{undef}\\) 计算 \\(\\text{lfp}(F) = \\sqcup \\{\
  \ F^n(\\perp) \\mid n \\ge 0 \\}\\)。根据定义，我们有：\n\n```\n\\(F^1(\\perp) = F(\\perp)\
  \ : \\text{Mem} \\mapsto \\begin{cases} \\text{undef} & \\text{if } \\text{Mem}(r_x)\
  \ \\neq 1 \\\\ \\text{Mem} & \\text{if } \\text{Mem}(r_x) = 1 \\end{cases}\\)\n\
  ```\n\n同样：\n\n```\n\\(F^2(\\perp) = F(F^1(\\perp)) : \\text{Mem} \\mapsto \\begin{cases}\

  \ = 1 \\end{cases}\\)\n```\n\n经过进一步迭代，我们得到：\n\n```\n\\(F^3(\\perp) = F(F^2(\\perp))\
  \ : \\text{Mem} \\mapsto \\begin{cases} F^2(\\perp)(\\llbracket c_3 \\rrbracket_{\\\
  text{Env}}(\\text{Mem})) & \\text{if } \\text{Mem}(r_x) \\neq 1 \\\\ \\text{Mem}\
  \ & \\text{if } \\text{Mem}(r_x) = 1 \\end{cases}\\)\n```\n\n因此：\n\n```\n\\(F^3(\\\
  perp) : \\text{Mem} \\mapsto \\begin{cases} \\text{undef} & \\text{if } \\text{Mem}(r_x)\
  \ \\neq 1 \\text{ and } \\text{Mem}(r_x) \\neq 2 \\text{ and } \\text{Mem}(r_x)\
  \ \\neq 3 \\\\ \\llbracket c_3 \\rrbracket^2_{\\text{Env}}(\\text{Mem}) & \\text{if\
  \ } \\text{Mem}(r_x) = 3 \\\\ \\llbracket c_3 \\rrbracket_{\\text{Env}}(\\text{Mem})\
  \ & \\text{if } \\text{Mem}(r_x) = 2 \\\\ \\text{Mem} & \\text{if } \\text{Mem}(r_x)\
  \ = 1 \\end{cases}\\)\n```\n\n通过归纳，我们得到：\n\n```\n\\(F^n(\\perp) : \\text{Mem} \\\
  mapsto \\begin{cases} \\text{undef} & \\text{if } \\text{Mem}(r_x) \\neq 1 \\text{\

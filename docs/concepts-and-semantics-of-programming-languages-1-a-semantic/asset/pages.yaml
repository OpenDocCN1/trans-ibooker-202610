    integer, boolean and functional values. As we have seen, type variables are also
    required. Types are defined inductively using the grammar shown in Table 5.1.


    In what follows, \( \alpha_1 \to \alpha_2 \to \cdots \to \alpha_{n+1} \) will
    be used to denote the type:


    ```

    \(\alpha_1 \to (\alpha_2 \to (\cdots (\alpha_n \to \alpha_{n+1})))\)

    ```'

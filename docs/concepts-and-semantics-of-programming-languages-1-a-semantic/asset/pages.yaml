    # ## 6.6. Equality


    In section 6.5, we introduced constructs generalizing the conditional, first to
    deal with more than two cases, then to provide a notion of “equality” broadened
    by the pattern matching. While the concept of equality used in programming languages
    appears straightforward, it merits more detailed examination.


    In a mathematical context, equality is defined as a reflexive, symmetric and transitive
    relation between two elements of the same set. The intuitive semantics of the
    equality of two elements consists of stating that if, in a mathematical expression,
    the first is replaced by the second (or vice versa), the value of the expression
    remains unchanged. The notion of equality was formalized in the 17th century by
    Gottfried Wilhelm Leibniz, who stated that two values $x$ and $y$ are equal if,
    and only if, for any predicate $P$, $P(x)$ is true if and only if $P(y)$ is true:


    $(x = y) \Leftrightarrow \forall P, P(x) \Leftrightarrow P(y)$


    The difficulty with this definition lies in the need for universal quantification
    on predicates, i.e. on functions returning a truth value. Hence, this definition
    cannot be directly applied in computer science.


    It is often said that two “computer” values are considered to be equal if their
    representations in the memory are identical. In other terms, the sequences of
    bits encoding these values must be of the same length and contain two-by-two identical
    bits. Using the usual semantics for adding integers, it is easy to understand
    that $4 = 3 + 1$; in other terms, the *values* resulting from the evaluation of
    the expressions 4 and $3 + 1$ are equal, and both will be represented internally,
    in binary, as $100_b$.


    NOTE.– The syntax used for equality varies between languages. For example, in
    C, Java, Python and others, the notation == is used. In OCaml, on the other hand,
    equality is noted = (== has a different equality semantics) like in Basic, Pascal
    and Ada. Given that assignment is also noted = in many languages, users are strongly
    advised to study the syntax of any new language in order to avoid misinterpretations.'

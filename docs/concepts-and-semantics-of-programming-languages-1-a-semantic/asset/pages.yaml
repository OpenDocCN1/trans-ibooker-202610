- pgno: 124
  md: '# 4.6. Procedures


    Procedures are used to structure the code of a program, isolating certain parts
    and making them accessible from any point in the program (by means of a procedure
    call instruction). We shall begin by introducing the notion of a block, which
    confines definitions of variables and procedures in a portion of code. We will
    then build on this notion to introduce procedures, which trigger the execution
    of a block, and outline different possible modes of parameter transmission. The
    concepts of functions and procedures give the basis of program architecture and
    will be extended with modular and object features in Volume 2. The big-step operational
    semantics formalism will be used throughout this section as a basis for presenting
    new constructs.


    # 4.6.1. Blocks


    The syntax of Lang3 is extended by adding the construct:


    ```

    begin d c end

    ```


    where d is a sequence (which may be empty) of definitions in language Def3 (which
    may be extended in order to allow local definition of procedures) and c is a program
    in Lang3. This new construct ensures that the variables and procedures defined
    by d will be accessible during an execution of c. The execution of begin d c end
    in a state (Env, Mem) is a two-step process:


    +   1) construction of the state in which program c is to be executed by evaluating
    the definitions in d:


    ```

    (Env, Mem) ->*d_Def3 (Env1, Mem1)

    ```


    where ->*d_Def3 is the relation defined in section 4.2 (adapted for language Def3);


    +   2) execution of the program c in state (Env1, Mem1):


    ```

    <Mem1, c> ->Env1 Mem2

    ```


    To take account of this new construct, the rule C8 given in Box 4.5 is added to
    the rules in Box 4.2.


    (C8) (Env, Mem) ->*d_Def3 (Env1, Mem1)   <Mem1, c> ->Env1 Mem2

    -----------------------------------------------

    <Mem, begin d c end> ->Env Mem2


    # Box 4.5. Big-step operational semantics: blocks'

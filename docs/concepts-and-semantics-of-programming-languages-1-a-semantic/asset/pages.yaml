  md: '# ### 6.6.3.2. OCaml


    In this case, any attempt to test the structural equality of two functions will
    result in an error message, even if the two operands are the same function identifier.
    Nevertheless, physical equality can still be tested, using the same semantics
    found in C or C++, as shown in example 6.55.


    # #### EXAMPLE 6.55.-


    ```

    OCaml

    # let f x = x ;;

    val f : ''a -> ''a = <fun>

    # f = f ;;

    Exception: Invalid_argument "compare: functional value".

    Raised by primitive operation at unknown location

    Called from file "toplevel/toplevel.ml", line 180, characters 17-56

    # let g x = x ;;

    val g : ''a -> ''a = <fun>

    # f == f ;;

    - : bool = true

    # g == f ;;

    - : bool = false

    ```


    # ### 6.6.3.3. Java


    Function comparison is illegal in Java, and this is indicated during the compilation.
    There is no implementation of the predefined == operator for functions, so the
    compiler simply rejects these expressions. Furthermore, functions (methods) are
    not objects belonging to classes, so the equal method, used to test equality between
    objects in a class, is not applicable.


    # ### 6.6.3.4. Coq


    This tool is both an environment for formal proof and a programming language.
    It is widely used to construct proofs for properties verified by computer, such
    as those concerning communication protocols [DUB 18]. Users may write expressions,
    including functions, and prove properties over them. Under certain conditions
    – which lie beyond the scope of this book – OCaml code can be extracted automatically
    from a development in Coq.


    Coq can manipulate terms representing a program, and thus can rewrite certain
    terms and deduce an equality. This even holds true for certain functions, meaning
    that it is possible to prove an equality between functions which are a priori
    syntactically different, as shown in example 6.56.'

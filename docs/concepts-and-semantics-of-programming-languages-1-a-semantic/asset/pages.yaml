- pgno: 240
  md: '# 7.2. Endianness


    The way in which integers are stored in the memory varies from processor to processor.
    Storage of integers needs several bytes, which may be stored in the memory from
    left to right or from right to left. This order, known as *endianness*, is imposed
    by the processor’s architecture. Processors that store the least important bytes
    of an integer at the lowest addresses are said to be “little endian”. In an architecture
    of this kind, for the hexadecimal value 01020304, the byte 01 would be placed
    at the address at the start of the integer, 02 would be placed at the following
    address, and so on. Intel x86 and ARM processors are little endian. Processors
    that store bytes in the reverse order, with the most important byte at the lowest
    address, are said to be “big endian”. In this case, for the value 01020304, the
    byte 04 would be stored at the address of the start of the integer, followed by
    03, and so on. The MC68000 family of Motorola processors are big endian. Certain
    processors, such as MIPS or PowerPC models, can be configured (using hardware,
    software, or both) to operate in either mode. Of course, endianness can lead to
    compatibility problems if data structures are directly extracted from memory and
    transmitted (over a network, or as a file on a disk) to a processor with a different
    endianness. In these cases, a program must be used to reorder the bytes in question
    before attempting to access the received integer values.


    # 7.3. Pointers and arrays


    As we have seen, an address represents a “location” in the memory. As such, it
    may be the location of a variable, or the start of a contiguous data zone. In
    certain languages, arrays – which are contiguous sequences of data of the same
    type – are simply represented by the address of the start of the memory zone in
    which they are located. Thus, as we saw in section 6.2, an element in an array
    is accessed by computing its address from the start of the array, the size of
    each element and the index. Computation using addresses is often referred to as
    *pointer arithmetic*. In C and C++, the addition operation *p + n*, using a pointer
    *p* over a type *t* and an integer *n*, is interpreted by the compiler as a “shift
    of *n* elements of type *t* from *p*” and this is the only permitted arithmetic
    operation on pointers.


    For example, if *p* is declared by `int *p`, the memory access operation for expression
    `p[5]` will occur at address `p + 5 * 4`, since an integer is made up of 4 bytes.
    In practice, the bracketed notation `p[5]` is identical to the dereferencing of
    the address `p + 5`. In C, this is written `*(p + 5)` (as addition is commutative,
    the notation `i[tab]`, which is semantically equivalent to `tab[i]` in C, also
    denotes cell `i` in the array `tab` but should be avoided for readability reasons).'

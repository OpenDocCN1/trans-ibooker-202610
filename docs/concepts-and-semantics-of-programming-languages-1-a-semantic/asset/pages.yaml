    \ may correspond to a fragment of first-order logic (with deduction methods),\
    \ or to an extensional approach where an assertion P is considered to be a predicate\
    \ over states such that P((Env, Mem)) is satisfied if and only if [[P]]_Env^Mem\
    \ = 1. In this case, assertions are assimilated to the boolean expressions used\

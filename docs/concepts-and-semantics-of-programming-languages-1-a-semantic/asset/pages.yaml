  md: "# 3.2.3. Interpretation of operators\n\nThe primitive operators in Exp2 are\
    \ symbols that are used to construct new expressions from existing expressions.\
    \ To evaluate an expression, we must decide which operation opv on the values\
    \ of V is represented by each symbol op; in other terms, we must interpret these\
    \ symbols. The interpretation of the operators used in Exp2 is defined in Table\
    \ 3.2.\n\nThe interpretation of primitive operators is defined as follows:\n\n\
    ```\nPython\ndef apply2_unary_op(op,v):\n    if isinstance(op,Not2):\n       \
    \ if isinstance(v,VBool2): return Val2(VBool2(not v.val_bool))\n        return\
    \ Err2(E_Typ2)\n    raise ValueError\n\ndef apply2_binary_op(op,v1,v2):\n    if\
    \ isinstance(op,Plus2):\n        if isinstance(v1,VInt2) and isinstance(v2,VInt2):\n\
    \            return Val2(VInt2(v1.val_int + v2.val_int()))\n        return Err2(E_Typ2)\n\
    \    if isinstance(op,Minus2):\n        if isinstance(v1,VInt2) and isinstance(v2,VInt2):\n\
    \            return Val2(VInt2(v1.val_int - v2.val_int()))\n        return Err2(E_Typ2)\n\
    \    if isinstance(op,Mult2):\n        if isinstance(v1,VInt2) and isinstance(v2,VInt2):\n\
    \            return Val2(VInt2(v1.val_int * v2.val_int()))\n        return Err2(E_Typ2)\n\
    \    if isinstance(op,Div2):\n        if isinstance(v1,VInt2) and isinstance(v2,VInt2):\n\
    \            if v2.val_int == 0: return Err2(E_Exec2)\n            return Val2(VInt2(v1.val_int\
    \ / v2.val_int()))\n        return Err2(E_Typ2)\n    if isinstance(op,And2):\n\
    \        if isinstance(v1,VBool2) and isinstance(v2,VBool2):\n            return\
    \ Val2(VBool2(v1.val_bool and v2.val_bool))\n        return Err2(E_Typ2)\n   \
    \ if isinstance(op,Or2):\n        if isinstance(v1,VBool2) and isinstance(v2,VBool2):\n\
    \            return Val2(VBool2(v1.val_bool or v2.val_bool))\n        return Err2(E_Typ2)\n\
    \    if isinstance(op,Eq2):\n        if isinstance(v1,VBool2) and isinstance(v2,VBool2):\n\
    \            return Val2(VBool2(v1.val_bool == v2.val_bool))\n        if isinstance(v1,VInt2)\
    \ and isinstance(v2,VInt2):\n            return Val2(VBool2(v1.val_int == v2.val_int()))\n\
    \        return Err2(E_Typ2)\n```"

  md: "# 4.6.2.2. Procedure call mechanisms\n\n# 4.6.2.2.1. Call by value\n\nWhen\
    \ calling a procedure, the call by value mechanism transmits a value, which is\
    \ the result of evaluating an expression e in the current environment of the call.\
    \ Using this mechanism, the syntactic construct of a procedure call in Lang$_3$\
    \ is given as:\n\ncall p(e)\n\nTo add the syntactic construct for a procedure\
    \ call with Python, we define the following class:\n\n```\nclass ICall4:\n   \
    \ def __init__(self,name,exp):\n        self.name = name\n        self.exp = exp\n\
    ```\n\nWith OCaml, the definition of the sum type ’a pgm4 (see section 4.1) is\
    \ extended with the following constructor:\n\n```\n| ICall4 of ’a * ’a exp4\n\
    ```\n\nBox 4.6 presents different semantics of this call mechanism. In the first\
    \ version, the transmitted value is seen as a constant: the binding of the parameter\
    \ to the value is directly present in the environment (and thus this value cannot\
    \ be modified).\n\nIn the second version, the parameter of the procedure is considered\
    \ as a mutable variable local to the procedure, which is initialized using the\
    \ transmitted value. In this case, an allocation is done, the parameter references\
    \ this location and the contents of this location may be modified by the instructions\
    \ in the procedure body. As in the case of blocks, this reference may remain accessible\
    \ once the procedure has been executed, if it was assigned to a variable “external”\
    \ to the procedure. Both versions are presented for static and dynamic scope mechanisms."

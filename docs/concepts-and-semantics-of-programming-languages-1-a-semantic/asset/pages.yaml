    ∀e ∈ **Exp₂** ∀Env ∈ **E** ∀v ∈ V [[e]]_Env = v ⇔ Env ⊢ e ↝ v


    The implication ⇒ can be proved using the LFP theory but it is out of the scope

    of this book. The proof of the implication ⇐ is obtained using the same technique

    applied for proposition 3.1, by induction over the evaluation tree for Env ⊢ e

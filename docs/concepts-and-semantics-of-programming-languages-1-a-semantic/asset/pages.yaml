  md: '# 3.2. Execution semantics: evaluation functions


    The execution semantics (or *dynamic semantics*) of a programming language describes
    the execution of all syntactically correct programs in this language. In this
    section, we study the “pure” functional language **Exp$_2$**. As operations acting
    on memory are not provided by this language, only the notion of an execution environment
    is required. Note that, unlike memory (with modifiable contents), an execution
    environment (also called evaluation environment) can only be extended by a new
    binding of an identifier to its value; any existing bindings for this identifier
    are simply masked by the new binding.


    A program in **Exp$_2$** is an expression. Its execution consists of evaluating
    the expression, i.e. of computing its value. To do this, we begin by defining
    an evaluation function, as in Chapter 2:


    ```

    $[[ \_ ]]_{\_} : \mathbf{E} \times \mathbf{Exp}_2 \rightarrow \mathbb{V}$

    ```


    The value $[[e]]_{Env}$ is the result of the evaluation of expression $e$ in environment
    $Env$. Here, an environment $Env \in \mathbf{E}$ is a list of bindings $(x, v)
    \in \mathbf{X} \times \mathbf{V}$. The set $\mathbf{V}$ (defined in section 3.2.2)
    is the set of values associated with the variables, and $\mathbb{V}$ is the union
    of $\mathbf{V}$ and of a set of special values used to indicate evaluation failures.


    # 3.2.1. Evaluation errors


    We have chosen to distinguish between three different kinds of errors produced
    during the evaluation of an expression $e \in \mathbf{Exp}_2$.


    +   1) The value of a free occurrence of a variable in $e$ must be found in the
    current execution environment. If this variable does not belong to the environment
    domain, evaluation of $e$ returns an error denoted as Err$_U$ (with U signifying
    unbound).


    +   2) Arithmetic errors, such as overflow or mathematically undefined values,
    are denoted as Err$_E$ (E for exception, the mechanism used by the processor to
    indicate an “exceptional” situation which makes it impossible to continue normal
    execution). For our purposes, we shall limit our considerations to division by
    zero.


    +   3) The expressions of **Exp$_2$** denote either integers, booleans or functions.
    Thus, attempts may be made to add a boolean and an integer (3 + true), or to apply
    an integer to an expression (8(x + 1)). Such expressions are syntactically correct,
    but cannot denote a value in V. In our model, the evaluation of such expressions
    leads to an error called typing error Err$_T$. Detection of typing errors prior
    to execution will be presented in Chapter 5. Note that certain languages assign
    semantics to expressions, which we consider to be invalid in **Exp$_2$**. In Python
    (v3.6), for example, the expression 3 + True returns the value 4.'

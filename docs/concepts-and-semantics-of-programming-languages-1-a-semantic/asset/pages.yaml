  md: '![](img/c9a176746efdbd36ba74d71dfdc86e86_189_0.png)


    Figure 5.1. Covariance and contravariance. For a color version of this figure,
    see www.iste.co.uk/hardin/programming1.zip


    A preorder over types that verify this rule is said to be *contravariant* over
    the type of the function arguments and *covariant* over the type of the results.
    It can be proved that a typing algorithm using such a preorder can be constructed
    from the two rules shown in Box 5.7 (and, potentially, from similar rules for
    certain other type constructors).


    | Rule | Derivation |

    | :--- | :--- |

    | \((T_{\preceq})\) | \(\dfrac{\text{Env} \vdash e : t_s \quad t_s \preceq t_b}{\text{Env}
    \vdash e : t_b}\) |

    | \((T_{app \preceq})\) | \(\dfrac{\text{Env} \vdash e_1 : t_b \to t \quad \text{Env}
    \vdash e_2 : t_s \quad t_s \preceq t_b}{\text{Env} \vdash (e_1 \ e_2) : t}\) |


    # Box 5.7. Subtyping rules


    Rule \(T_{\preceq}\) defines the semantics of the order relation over types: any
    expression \(e\) of a type \(t_s\) that is smaller than a type \(t_b\) is also
    of type \(t_b\). Rule \(T_{app \preceq}\) is a consequence of this semantics:
    any function that requires an expression of type \(t_b\) as its argument will
    accept an argument with a type \(t_s\), which is a subtype of \(t_b\).


    This order is frequently used in the case described below using our example. Consider
    a function \(f\), taking individuals as its parameter and returning, for example,
    their birth year (\(f\) is therefore of the type \(t_b \rightarrow \text{int}\)).
    \(f\) may be restricted to data of type \(t_s\), i.e. for individual employees.
    Noting this restriction \(g\), the type of \(g\) is thus \(t_s \rightarrow \text{int}\).
    We have \((t_b \rightarrow \text{int}) \preceq (t_s \rightarrow \text{int})\),
    ensuring the consistency of this restriction in terms of typing.


    Conventionally, the name \(f\) is retained for the restriction (instead of introducing
    a new name \(g\)). Programming language manuals often specify that any function
    of type \(t_1 \rightarrow t_2\) can be applied to any value of type \(t\), if
    \(t\) is a subtype of \(t_1\), and the type of the result \(t_2\) remains unchanged.
    This approach does not exploit the full potential of functional type comparison.
    We shall return to this point in Volume 2, Chapter 1.'

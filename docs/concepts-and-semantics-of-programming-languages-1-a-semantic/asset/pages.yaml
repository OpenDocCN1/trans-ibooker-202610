  md: "# 6.5.2.2.2. Disjunction of patterns\n\nSome situations require the same treatment\
    \ to be applied to several cases. In this situation, instead of enumerating patterns\
    \ one by one and repeating the same body each time, we may use a single pattern\
    \ defined by a disjunction of (sub-)patterns and a single processing may then\
    \ be applied, as shown in example 6.47.\n\n# EXAMPLE 6.47.-\n\n```\nOCaml\nlet\
    \ crowned_head c = match c with Queen -> true | King -> true | _ -> false\nlet\
    \ crowned_head2 c = match c with Queen | King -> true | _ -> false\n```\n\nThe\
    \ function crowned_head, which specifies whether a crown is shown on a playing\
    \ card, produces the same code twice: once for Queen, and once for King. In the\
    \ second version, the first two patterns are replaced by a single pattern that\
    \ accepts both Queen and King. This pattern may be read as “match Queen or King”.\
    \ Using “or”-patterns is particularly helpful in situations where the (identical)\
    \ processing to apply to each case is a long piece of code. Sharing the code in\
    \ these situations reduces the sizes of the source code and the executable.\n\n\
    Given that a disjunction pattern uses the same processing for each subpattern,\
    \ if one of these subpatterns contains a variable, this one must also occur –\
    \ and be of the same type – in the other subpatterns. This condition is necessary\
    \ to ensure that this pattern variable will be well bound, independently of the\
    \ specific subpattern used to catch the examined value, and will only have one\
    \ type. This point is illustrated in example 6.48.\n\n# EXAMPLE 6.48.-\n\n```\n\
    OCaml\ntype expirith =\n  | Plus of (expirith * expirith) | Minus of (expirith\
    \ * expirith)\n  | Mult of (expirith * expirith) | Div of (expirith * expirith)\
    \ | Num of int\n\nlet rec count_operators e =\n  match e with\n  | Plus (e1, e2)\
    \ | Minus (e1, e2) | Mult (e1, e2) | Div (e1, e2) ->\n      1 + (count_operators\
    \ e1) + (count_operators e2)\n  | Num _ -> 0\n```\n\nThe purpose of the count_operators\
    \ function is to count the number of operators present in an arithmetic expression.\
    \ The four cases concerning +,-,*,/ all require two recursive calls, one for each\
    \ subexpression. The treatment of the associated constructors can be factorized,\
    \ as they allow the same variables e1 and e2 to be bound to the same type on every\
    \ occasion.\n\n# 6.5.2.2.3. Matching records\n\nPatterns syntax also includes\
    \ records with named fields, as presented in section 6.4.2. In a pattern, only\
    \ those fields that are relevant to a treatment need to be named. This avoids\
    \ the need to include all fields with a _ as a subpattern, as we see in example\
    \ 6.49."

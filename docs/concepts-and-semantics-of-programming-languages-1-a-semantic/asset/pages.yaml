    For character strings, the standard library of C includes a function `strcmp`
    for structural comparison purposes. This function is easy to write, as strings
    are arrays terminating with a sentinel marker (`''\0''`). In object-oriented languages,
    such as Java or C++, strings are encapsulated within classes from their standard
    library, which include a structural comparison function. Nevertheless, this function
    is not one of the primitives of these languages and was written by the library''s
    developers. In languages that include an operator overloading mechanism, such
    as C++ (see section 5.7.2), it is possible to change the behavior of `==` when
    used with data structures in order to assign a dedicated semantics, for example
    structural equality. This redefinition is done during the implementation of the
    data structure. Once again, this approach relies on explicit development work
    carried out by the designer of the data structure based on a thorough knowledge
    of the semantics of this structure.


    # 6.6.3. Equality between functions


    We discussed the semantics of equality tests for functions at the start of Chapter
    5, indicating that there cannot exist a satisfactory response to this problem.
    The choices used by a number of languages are described as follows.


    # 6.6.3.1. C, C++, Python


    These languages compare the addresses of the code of the compared functions. The
    equality is thus implicitly physical in nature. The only way to obtain a positive
    test result is to compare a function identifier with itself.'

  md: '# 3.5.2. Equivalent environments


    As we said informally in section 3.1.4, the result of evaluating an expression
    \( e \) in an environment ENV depends only on the values associated with the free
    variables of \( e \) by ENV. In other terms, the evaluation result of \( e \)
    is the same in all environments, which associate the same values with the free
    variables of \( e \). Giving a formal definition of this property requires the
    introduction of the notion of equivalent environments over a set of variables
    as follows:


    DEFINITION 3.4.– Equivalent environments: let \( F \subseteq \mathbf{X} \) be
    a set of variables and ENV\(_1\) and ENV\(_2\) two environments:


    ENV\(_1 \equiv_F\) ENV\(_2 \Leftrightarrow \forall x \in F \, \) ENV\(_1(x) =
    \) ENV\(_2(x)\)


    Obviously, given two subsets of \(\mathbf{X}\), \( F_1 \) and \( F_2 \), if \(
    F_1 \subseteq F_2 \) and ENV\(_1 \equiv_{F_2}\) ENV\(_2\), then ENV\(_1 \equiv_{F_1}\)
    ENV\(_2\). It is now possible to express, formally, that for any expression \(
    e \), the value of \([[e]]_{\text{Env}}\) depends only on the values bound in
    ENV to the free variables of \( e \) (\( \mathcal{F}(e) \)).


    PROPOSITION 3.3.– For any expression \( e \in \mathbf{Exp}_2 \):


    \(\forall \text{ENV}_1, \text{ENV}_2 \in \mathbf{E}\)

    ENV\(_1 \equiv_{\mathcal{F}(e)}\) ENV\(_2\)

    \(\Rightarrow\)

    \(\left( \begin{aligned} \ \[[e]]_{\text{ENV}_1} = [[e]]_{\text{ENV}_2} \\\vee
    \backslash \mathbf{F} \\ \text{or} \[[e]]_{\text{ENV}_1} = \langle x, e'', \text{ENV}''_1
    \rangle \text{ and } [[e]]_{\text{ENV}_2} = \langle x, e'', \text{ENV}''_2 \rangle
    \\ \text{and } \text{ENV}''_1 \equiv_{\mathcal{F}(e)\backslash \{x\}} \text{ENV}''_2
    \\ \text{or} \[[e]]_{\text{ENV}_1} = \langle f, x, e'', \text{ENV}''_1 \rangle
    \text{ and } [[e]]_{\text{ENV}_2} = \langle f, x, e'', \text{ENV}''_2 \rangle
    \\ \text{and } \text{ENV}''_1 \equiv_{\mathcal{F}(e)\backslash \{x\}} \text{ENV}''_2
    \end{aligned} \right)\)


    The proof of this proposition is long and complex. Exercise 3.5 establishes this
    property for a language containing no functional expressions. In this case, proof
    is obtained by induction over the syntactic structure of the expression. In cases
    where functional values are present, this induction is no longer sufficient, and
    the proof requires the use of theorems of the fixpoint theory.



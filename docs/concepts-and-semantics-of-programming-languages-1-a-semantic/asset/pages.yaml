- pgno: 55
  md: 'contains four occurrences of $x$, indexed from 1 to 4. Occurrence 2 abstracts
    occurrence 3 in the body of $f$. These occurrences of the dummy variable $x$ may
    be renamed. Occurrence 1 declares the identifier $x$, which is used to give a
    value to occurrence 4.


    When an occurrence of a variable in an expression is neither declared nor bound,
    it is said to be *free* in this expression. For $e \in \mathbf{Exp}_2$, the set
    $\mathcal{F}(e)$ of variables, which has at least one free occurrence in $e$,
    is defined inductively by:


    ```

    \mathcal{F} : \mathbf{Exp}_2 \to \wp(\mathbf{X})

    \mathcal{F}(v) = \emptyset \quad (v \in \mathbf{K})

    \mathcal{F}(x) = \{x\} \quad (x \in \mathbf{X})

    \mathcal{F}(\mathbf{op} \ e_1) = \mathcal{F}(e_1)

    \mathcal{F}(e_1 \mathbf{op} \ e_2) = \mathcal{F}(e_1) \cup \mathcal{F}(e_2)

    \mathcal{F}(\mathbf{if} \ e_1 \ \mathbf{then} \ e_2 \ \mathbf{else} \ e_3) = \mathcal{F}(e_1)
    \cup \mathcal{F}(e_2) \cup \mathcal{F}(e_3)

    \mathcal{F}(\mathbf{let} \ x = e_1 \ \mathbf{in} \ e_2) = \mathcal{F}(e_1) \cup
    (\mathcal{F}(e_2) \setminus \{x\})

    \mathcal{F}(\mathbf{fun} \ x \mapsto e) = \mathcal{F}(e) \setminus \{x\}

    \mathcal{F}(\mathbf{rec} \ f \ x = e) = \mathcal{F}(e) \setminus \{x, f\}

    \mathcal{F}((e_1 e_2)) = \mathcal{F}(e_1) \cup \mathcal{F}(e_2)

    ```


    Expressions that do not contain a free variable are said to be *closed*. This
    is the case for a function $\mathbf{fun}\ x \mapsto e$, which is said to be closed
    if it is a constant function ($\mathcal{F}(e) = \emptyset$ and $x$ does not occur
    in $e$) or if $\mathcal{F}(e) = \{x\}$ (i.e. the body $e$ has no free variable
    except $x$). For example, the function $\mathbf{fun}\ x \mapsto x + 1$ is closed.
    This is also the case for $\mathbf{fun}\ x_1 \mapsto \mathbf{fun}\ x_2 \mapsto
    x_1 + x_2$, but not for $\mathbf{fun}\ x_2 \mapsto x_1 + x_2$ since $x_1$ is free
    in this instance: the notion is not stable when switching to a subexpression (the
    fact that an expression is closed does not necessarily imply that its subexpressions
    are also closed).


    EXAMPLE 3.1.- For the expressions $e_{fact}$ defined in [3.2] and $e_{25}$ defined
    in [3.3], we have $\mathcal{F}(e_{fact}) = \mathcal{F}(e_{25}) = \emptyset$. In
    expression $e_{25}$, the occurrence 3 of $x$ is free in the subexpression $x +
    3$ but becomes bound in the expression $\mathbf{fun}\ x \mapsto x + 3$. The following
    two examples are not closed expressions:


    ```

    \mathcal{F}(\mathbf{fun}\ x_1 \mapsto x_1 + x_2) = \{x_2\}

    \mathcal{F}(\mathbf{let}\ x_1 = x_1 + x_2\ \mathbf{in}\ x_1 + x_3) = \{x_1, x_2,
    x_3\}

    ```


    Intuitively, to evaluate an expression, we need to know the values of its variables.
    The value of a free variable in an expression is searched for in the evaluation
    environment. For example, to evaluate the expression $x + 1$, we need to know
    the value of $x$. The expression $\mathbf{let}\ x = 3\ \mathbf{in}\ 2 * x$, on
    the other hand, is closed and can be evaluated without “external” information
    concerning the (bound) variables it contains.'

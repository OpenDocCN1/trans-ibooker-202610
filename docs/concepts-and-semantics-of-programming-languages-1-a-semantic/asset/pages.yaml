- pgno: 50
  md: "# # Semantics of Functional Features\n\nIn this chapter, we examine the semantics\
    \ of the constructs that form the kernel of functional languages. We shall present\
    \ several methods for expressing the meaning of these constructs, along with different\
    \ ways of describing their semantics. The functional language studied here corresponds\
    \ to the functional kernel of MLstyle languages. Many other published presentations\
    \ of the semantics of functional features of languages exist, for example [DOW\
    \ 11, FRI 01].\n\n# ## 3.1. Syntactic aspects\n\n# ### 3.1.1. Syntax of a functional\
    \ kernel\n\nThe language studied here, denoted as **Exp₂**, includes only one\
    \ syntactic category: expressions. Its abstract syntax is defined from a set **X**\
    \ of (symbols of) variables, the set **K = Z ∪ IB** of constant values (where\
    \ **Z** is the set of relative integers and **IB** the set of booleans) and a\
    \ set of primitive operators.\n\nTable 3.1 presents the nine construction rules\
    \ that enable the inductive definition of the set **Exp₂**. An expression in this\
    \ language can therefore be:\n\n+   1) a constant denoting a value of **K**, which\
    \ will be either a relative integer or *true* or *false*;\n+   \n+   2) an identifier,\
    \ here called a variable to maintain consistency with the usual terminology of\
    \ expressions;\n+   \n+   3) an application of a unary operator to an expression;\n\
    +   \n+   4) an application of a binary operator to two expressions with infix\
    \ notation;\n+   \n+   5) a conditional expression;"
  merge: -1
  img_proc: true
- pgno: 51
  md: '6) an expression let x = e1 in e2 which declares the variable x, called the
    local variable in the expression e2, and defines it by the expression e1 (in other
    words, the value of e1 is named x in the expression e2);


    7) a function of a variable x, the body of which is an expression e, obtained
    by the abstraction of x in e. The variable x is generally called the parameter
    (or the formal parameter) of the function;


    8) a recursive function, designated by an identifier f, of which the parameter
    is x and the body is an expression e, which may contain recursive calls to f;


    9) an application of an expression e1 to an expression e2 (the expression e2 is
    called the argument or the actual parameter of e1).


    | e ::= v | Constant (v in K) | (1) |

    | --- | --- | --- |

    | | x | Variable (x in X) | (2) |

    | | op e1 | Application of a primitive unary operator (op in {not}) | (3) |

    | | e1 op e2 | Application of a primitive binary operator (op in {+, -, *, /,
    and, or, =, <=}) | (4) |

    | | if e1 then e2 else e3 | Conditional expression | (5) |

    | | let x = e1 in e2 | Local binding (x in X) | (6) |

    | | fun x -> e | Function definition (x in X) | (7) |

    | | rec f x = e | Recursive function definition (x, f in X) | (8) |

    | | (e1 e2) | Application of a function | (9) |


    Table 3.1. Syntax of the language of expressions Exp2


    # 3.1.2. Abstract syntax tree


    Each expression in this language can be represented by a tree, the abstract syntax
    tree (AST), every node of which is annotated with the label of the applied construction
    rule. For example, the expression:


    ```

    fun x1 -> x1 + x2

    ```


    is obtained by abstraction of x1 in the expression x1 + x2, which becomes the
    body of the function constructed in this way. Similarly, the expression efact:


    ```

    rec fact n = if n <= 1 then 1 else (fact (n - 1)) * n

    ```


    recursively defines the function computing n! by abstraction of n in the function
    body.'

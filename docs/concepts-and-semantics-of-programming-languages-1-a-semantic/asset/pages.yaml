- pgno: 188
  md: '# 5.7.1. Subtyping


    If the typing algorithm used by a language satisfies the partial correctness property,
    any well-typed program will be evaluated as a value of the expected type or will
    loop. Certain programs rejected by the typing process also respect this property
    of partial correctness, but the typechecking is unable to determine this. For
    this reason, the type language and the typing algorithm may be enriched in order
    to reduce program rejection, while maintaining the partial correctness property.


    Subtyping is a way of refining the typing process using a comparison relation
    on types noted $t_s \preceq t_b$ 1 and a typing algorithm that permits any expression
    $e$ of type $t_s$ to be accepted as an expression of type $t_b$. The comparison
    relation must be reflexive and transitive: in other words, this relation $\preceq$
    is a partial preorder (there is no need to compare any two types using $\preceq$).
    We have already encountered such a preorder in section 5.4. The relation "\(\tau''\)
    is an instance of the type scheme \(\sigma = \forall \alpha_1 ... \alpha_k . \tau\)",
    denoted as \(\sigma \le \tau''\), is indeed a partial preorder over polymorphic
    type schemes, type schemes \(\forall \emptyset . \text{int}\) and \(\forall \emptyset
    . \text{bool}\) are not comparable, and \(\forall \alpha . \alpha \to \alpha\)
    is smaller than \(\text{int} \to \text{int}\).


    A preorder on types can be defined in the following manner. We first choose the
    family $F$ of types, which we already know how to compare. Next, we extend (when
    necessary: the preorder does not need to be total) the preorder chosen for $F$
    to other types. Since type languages are often constructed by induction, extension
    is also usually carried out by induction. This gives some guarantees on the consistency
    between inductive construction and comparison. For example, consider $t_s \preceq
    t_b$ and $s_s \preceq s_b$. If the type language includes product types, it seems
    consistent to extend this order by taking $t_s \times s_s \preceq t_b \times s_b$.


    Suppose now that the order on types is the order of inclusion of their sets of
    values: $t_s \preceq t_b$ if the set of values of type $t_s$ is included in the
    set of values of type $t_b$. For example, this would be the case if values of
    type $t_b$ represent individual people, and values of type $t_s$ represent individual
    employees. Suppose that $t_s \preceq t_b$ and $s_s \preceq s_b$. consider a function
    $f : t_b \to s_s$. In this case, $f$ allows us to define a function $g : t_s \to
    s_b$ by simply restricting $f$ to the subset of values of type $t_s$. Furthermore,
    as $g$ takes values in $s_s$, it also takes values in $s_b$, as shown in Figure
    5.1.


    Function $f$ is defined over a domain that contains the domain of $g$ and the
    codomain of $f$ is included in that of $g$. Thus, anything which is treated by
    $g$ is also treated by $f$, and any value returned by $f$ is included in the values
    returned by $g$. From this intuitive interpretation, it is possible to prove that
    the subtyping relation defined over the type family $F$ can be extended by taking
    the following rule: if $t_s \preceq t_b$ and $s_s \preceq s_b$, then $(t_b \to
    s_s) \preceq (t_s \to s_b)$.'

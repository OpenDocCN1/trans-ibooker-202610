  md: 'In other words, variables that are present in the environment but not bound
    by a ∀ are not generalized: these variables are called the free variables of the
    environment in question. A free variable denotes a yet unknown type and all the
    free occurrences of this variable in the environment denote the same type.


    # DEFINITION 5.3.- Free variables of a type scheme: the set F(σ) of free variables
    of the type scheme σ contains the type variables of σ, that is, those which are
    not generalized. This set is defined by:


    F(∀α1 ... αn . τ) = F(τ) \ {α1, ..., αn}


    where F(τ) is defined by:


    +   F(int) = F(bool) = ∅

    +   F(α) = {α}

    +   F(τ1 → τ2) = F(τ1) ∪ F(τ2)


    This definition can be extended to typing environments:


    F(Env) = ⋃ (x,σ)∈Env F(σ)


    # DEFINITION 5.4.- Generalization: the generalization of a type τ in an environment
    Env is the type scheme defined by:


    Gen(τ, Env) = ∀α1 ... αn. τ with {α1 ... αn} = F(τ) \ F(Env)


    # EXAMPLE 5.1.- With the environment:


    Env = [(x, ∀α1. α1 → α1), (y, ∀α1. α1 → α2), (z, ∀∅. α3), (w, ∀∅. int)]


    we have F(Env) = {α2, α3}, and:


    Gen((α1 → α2) → (α3 → α4), Env) = ∀α1 α4. (α1 → α2) → (α3 → α4)



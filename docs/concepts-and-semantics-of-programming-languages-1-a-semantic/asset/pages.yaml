  md: 'a partial order noted (\(\sqsubseteq\), [\(A \to B\)]): the relation is reflexive,
    anti-symmetric and transitive.


    We recall that, given a partial order (D, \(\sqsubseteq\)), the upper bounds and
    lower bounds of a subset \(Y \subseteq D\) are defined by:


    \(Maj(Y) = \{d \in D \mid \forall y \in Y \, y \sqsubseteq d\} \qquad Min(Y) =
    \{d \in D \mid \forall y \in Y \, d \sqsubseteq y\}\)


    The supremum \(\sqcup Y\) of \(Y \subseteq D\) is the least upper bound of Y,
    if there exists:


    \(\forall d \in D \, (\forall y \in Y \, y \sqsubseteq d) \Rightarrow \sqcup Y
    \sqsubseteq d\)


    The least element (minimum) of \(Y \subseteq D\), if it exists, is the only element
    in \(Min(Y) \cap Y\). The proposition below can be proved easily.


    PROPOSITION 4.3.-- \(\bot : \text{Mem} \mapsto \text{undef}\) is the least element
    of [\(\text{M} \to \text{M}\)].


    Given a partial order (D, \(\sqsubseteq\)) and a function \(f : D \to D\), an
    element \(d \in D\) is a fixpoint of \(f\) if and only if \(f(d) = d\). If it
    exists, the least fixpoint of \(f\), denoted as lfp(f), is a fixpoint of \(f\)
    such that:


    \(\forall d \in D \, (f(d) = d \Rightarrow \text{lfp}(f) \sqsubseteq d)\)


    # 4.7.1.2.2. Complete partial orders


    The least fixpoint of a functional is obtained in an incremental way by constructing
    a sequence of increasingly precise approximations. The least fixpoint is the least
    upper bound of this sequence of approximations. Complete partial orders provide
    a framework for establishing the existence of a least upper bound in these situations.
    Given a partial order (D, \(\sqsubseteq\)), a subset \(Y \subseteq D\) is a *chain*
    if its elements are totally ordered:


    \(\forall y_1, y_2 \in Y \, y_1 \sqsubseteq y_2 \text{ or } y_2 \sqsubseteq y_1\)


    A ccpo - *chain-complete partial order* - is a partial order (D, \(\sqsubseteq\))
    such that, for any chain \(Y \subseteq D\), \(\sqcup Y\) exists. If \(\sqcup Y\)
    exists for every subset \(Y \subseteq D\), the partial order (D, \(\sqsubseteq\))
    is a complete lattice (and consequently a ccpo).


    LEMMA 4.4.-- Every ccpo (D, \(\sqsubseteq\)) has a least element \(\bot = \sqcup
    \emptyset\).


    PROOF.-- \(\emptyset\) is clearly a chain, and since (D, \(\sqsubseteq\)) is a
    ccpo, \(\sqcup \emptyset\) exists. Since \(\sqcup \emptyset \in D\), to show that
    \(\sqcup \emptyset\) is the least element in D, it suffices to prove that it is
    a lower bound of D. Using the definition of \(\sqcup \emptyset\), we have:


    \(\forall d \in D \, (\forall x \in \emptyset \, x \sqsubseteq d) \Rightarrow
    \sqcup \emptyset \sqsubseteq d\)'

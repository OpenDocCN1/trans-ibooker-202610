    # Figure 1.3. Function calls and return addresses


    In summary, the internal state of a microprocessor is made up of its general registers,
    the program counter, the state register and the stack pointer. Note, however,
    that this is a highly simplified vision. There are many different varieties of
    microprocessors with different internal architectures and/or instruction sets
    (for example, some do not possess an integer division instruction). Thus, a program
    written directly using the instruction set of a microprocessor will not be executable
    using another model of microprocessor, and it will need to be rewritten. The portability
    of programs written in the assembly language of a given microprocessor is practically
    null. High-level languages respond to this problem by providing syntactic constructs,
    which are independent of the target microprocessors. The compiler or the interpreter
    have to translate these constructs into the language used by the microprocessor.


    # 1.1.4. Peripheral devices


    As we saw in section 1.1.3, processors execute a constant cycle of fetching, decoding
    and executing instructions. Computations are carried out using data stored in
    the memory, either by the program itself or by an input/output mechanism. The
    results of computations are also stored in the memory, and may be returned to
    users using this input/output mechanism.


    The interest of any programmable system is inherently dependent on input/output
    capacities through which the system reacts to the external environment and may
    act on this environment. Even an assembly robot in a car factory, which repeats
    the same actions again and again, must react to data input from the environment.
    For example, the pressure of the grip mechanism must stop increasing once it has
    caught a bolt, and the time it takes to do this will differ depending on the exact
    position of the bolt.


    Input/output systems operate using peripherals, ancillary devices that may be
    electronic, mechanical or a combination of the two. These allow the microprocessor
    to acquire external information, and to transmit information to the exterior.

  md: "NOTE.-- This restriction is also applicable to languages that permit the definition\
    \ of mutually recursive functions, although if the mutually defined functions\
    \ do not perform actual recursive calls. Thus, the following program – which is\
    \ evidently correct – will be rejected by the typing process:\n\n```\nOCaml\n\
    let rec map f l = match l with [] -> [] | h :: q -> (f h) :: (map f q)\nand map_succ\
    \ l = map (fun x -> x + 1) l\nand map_not l = map (fun x -> not x) l ;;\nError:\
    \ This expression has type int but an expression was\n expected of type bool\n\
    ```\n\nThis program redefines the function map that iterates a function f, given\
    \ as an argument over a list l. Within this mutually recursive definition (introduced\
    \ by let rec and and), it also defines a function that adds 1 to each element\
    \ of a list of integers, and a function that complements each element of a list\
    \ of booleans. This joint definition of the three functions is rejected by the\
    \ OCaml compiler, as map is applied to a list of integers and to a list of booleans\
    \ in the same definition. Typechecking of the subexpression map does not generalize\
    \ its type. Generalization would have been done if map had been recursively defined\
    \ independently of its two uses.\n\n```\nOCaml\nlet rec map f l = match l with\
    \ [] -> [] | h :: q -> (f h) :: (map f q) ;;\nval map : ('a -> 'b) -> 'a list\
    \ -> 'b list = <fun>\n```\n\n```\nOCaml\nlet map_succ l = map (fun x -> x + 1)\
    \ l\nand map_not l = map (fun x -> not x) l ;;\nval map_succ : int list -> int\
    \ list = <fun>\nval map_not : bool list -> bool list = <fun>\n```\n\nTo avoid\
    \ such difficulties, OCaml provides the keyword rec to annotate the functions\
    \ recognized as recursive by their author. Using this annotation avoids implicitly\
    \ considering all functions as recursive ones (as is done in many languages without\
    \ type inference), which would forbid the generalization of their types, hence\
    \ cancelling any possibility of polymorphism.\n\nNote that there are other advantages\
    \ to distinguishing between recursive and non-recursive functions during compilation,\
    \ including the capacity to generate more efficient code.\n\nThe different stages\
    \ involved in computing the type of an expression can be described in the form\
    \ of a typing tree, similar to the trees used to represent the evaluation of expressions\
    \ in Chapter 3."

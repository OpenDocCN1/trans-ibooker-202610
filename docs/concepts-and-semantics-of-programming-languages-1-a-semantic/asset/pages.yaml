    Unlike the language of definitions Def1 presented in Chapter 2, Def3 includes
    no commands of the form var x = e; to define mutable variables. From a semantic
    perspective, however, the same effect can be obtained using the ↑ operator. Considering
    an expression e, of which the evaluation produces a value v and does not modify

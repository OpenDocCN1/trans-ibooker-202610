    [((y, r_y), (x, 8), (z, r_z)], [(r_y, 5), (r_z, 2))] \xrightarrow{\text{let }
    x = 3;\rightarrow_{\text{Def}}} \eta_{\text{at}0}\)

    ```


    There are several sequences of definitions, which lead to state \(\eta_{\text{at}0}\).
    For example, in the sequence d, the definition let \(x = 8\) may be replaced by
    let \(x = !z + 6\) since, in state \([((z, r_z)], [(r_z, 2))]\), the expression

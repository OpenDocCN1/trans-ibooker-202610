  md: '# 5.2. Informal typing of a program Exp<sub>2</sub>


    # 5.2.1. A first example


    Let us begin by computing, intuitively, the type of the expression [3.3] presented
    in section 3.1.4:


    ```

    let x(1) = 25 in let f = fun x(2) ↦ x(3) + 3 in (f 7) + x(4)

    ```


    +   - let x(1) = 25 in ...


    This first let binds x(1) to the constant value 25. As this literal constant represents
    an integer, we deduce that x(1) must have an integer type, denoted as int.


    +   - let f = fun x(2) ↦ x(3) + 3 in ...


    The second let binds f to a functional expression. Thus, its type must be that
    of a function taking an argument of a certain type and returning a value of another
    type. Now, we have to determine these two types. For the moment, the type of the
    argument x(2) is unknown as no type annotation is provided for it. We introduce
    an unknown α (also known as a type variable) to denote this unknown type. Let
    us examine the body of f to deduce the type of the result. This body contains
    an application of the + operator, the semantics of which is the addition of two
    integers. This means that the result of f must be of type int; furthermore, the
    two subexpressions that are arguments of + must also be of type int. This is the
    case for 3 as it is a literal constant representing an integer. The subexpression
    on the left, x(3), also needs to be of type int. However, x(3) is an occurrence
    of the identifier x(2), bound by this function f. This function is well-typed
    only if x(3) and x(2) (to which we assigned the unknown type α) have the same
    type. Hence α = int. Finally, the type of f is that of a function for which argument
    is an integer and which returns an integer. This type is denoted as int → int,
    where the arrow represents the type of a function, the type of its parameter is
    on the left of the arrow and the type of the return value on the right.


    +   - (f 7) + x(4)


    This expression is an application of the + operator, which takes two arguments
    of the type int. On the left, the function f is clearly applied to an integer
    (7 is of type int) and returns an integer. On the right, x(4) is an occurrence
    of the identifier x(1) bound by let x(1) = 25 in ..., and is also of type int.
    Thus, the application of + is well-typed and returns a result of type int, which
    is the type of the whole expression.


    In this informal description of the typechecking mechanism, we had to retrieve
    the types of the identifiers. Just as expressions are evaluated in an execution
    environment, a typing environment is required for typechecking. As a first approach,
    we shall consider that this environment binds identifiers to their type; this
    point will be discussed in more detail later.'

  md: 'There are two possible interpretations when testing the equality of two identifiers
    _x_<sub>1</sub> and _x_<sub>2</sub>: we may wish to check whether Env(_x_<sub>1</sub>)
    = Env(_x_<sub>2</sub>), or whether Mem(Env(_x_<sub>1</sub>)) = Mem(Env(_x_<sub>2</sub>)).


    # 6.6.1. Physical equality


    In languages such as C, the equality operator == tests the identity of values
    in the compared expressions. These values must be scalar, otherwise the test will
    be rejected during the compilation. This point has significant implications for
    comparing data structures. Generally, the encoding used to construct evolved data
    structures involves pointers, which are scalar values. Equalities between data
    structures can relate to the addresses of these structures, in the case of physical
    equality, or to the values of the structures, known as structural equality, a
    notion presented in section 6.6.2. In C, when the equality == is used in relation
    to data structures, it denotes physical equality.


    The most striking example of this concerns the comparison of strings. As we saw
    in section 6.3, strings in C are encoded as arrays of characters (terminating
    with the character ‘\0’) and the arrays are denoted by pointers (see section 7.3).
    In testing the equality of two variables representing strings, we are, in fact,
    testing the equality of the pointers representing these strings, and not equality
    of the data stored at these locations. This is illustrated in example 6.51.


    # EXAMPLE 6.51.–


    ```

    #include <stdio.h>

    int main () {

    char *s1 = "Foo" ;

    char s2[4] = { ''F'', ''o'', ''o'', ''\0'' } ;

    if (s1 == s2) printf ("Equal\n") ;

    else printf ("Different\n") ;

    return (0) ;

    }

    ```


    This program declares the variable s1, containing the string "Foo" and the variable
    s2 as a character array containing the same letters as the string "Foo" and ending
    with a ''\0''. Thus, s1 and s2 “contain” identical strings. However, at runtime,
    this program will return Different, as the locations denoted by s1 and s2 differ.


    The semantics of equality in C is even more complex when we consider the case
    of constant string declarations. The compiler operates by creating only one occurrence
    of each constant string in a program. Thus, different variables initialized with
    the same constant string will denote the same reference. A modified version of
    example 6.51 is shown below, in which s1 and s2 are initialized with the same
    string "Foo".'

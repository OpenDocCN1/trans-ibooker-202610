  md: '- peripherals: these enable information to be exchanged between the CPU/memory
    couple and the outside.


    Information processing by a computer – in other terms, the execution of a program
    – can be summarized as a sequence of three steps: fetching data, computing the
    results and returning them. Each elementary processing operation corresponds to
    a configuration of the logical circuits of the CPU, known as a logic function.
    If the result of this function is solely dependent on input, and if no notion
    of “time” is involved in the computations, then the function is said to be combinatorial;
    otherwise, it is said to be sequential.


    For example, a binary half-adder, as shown in Figure 1.1, is a circuit that computes
    the sum of two binary digits (input), along with the possible carry value. It
    thus implements a combinatorial logic function.


    ![](img/c9a176746efdbd36ba74d71dfdc86e86_17_0.png)


    # Figure 1.1. Binary half-adder


    The essential character of a combinatorial function is that, for the same input,
    the function always produces the same output, no matter what the circumstances.
    This is not true of sequential logic functions.


    For example, a logic function that counts the number of times its input changes
    relies on a notion of “time” (changes take place in time), and a persistent state
    between two inputs is required in order to record the previous value of the counter.
    This state is saved in a memory. For sequential functions, a same input value
    can result in different output values, as every output depends not only on the
    input, but also on the state of the memory at the moment of reading the new input.


    # 1.1.2. Memories


    Computers use memory to save programs and data. There are several different technologies
    used in memory components, and a simplified presentation is as follows:


    +   - RAM (Random Access Memory): RAM memory is both readable and writeable. RAM
    components are generally fast, but also volatile: if electric power falls down,
    their content is lost;'

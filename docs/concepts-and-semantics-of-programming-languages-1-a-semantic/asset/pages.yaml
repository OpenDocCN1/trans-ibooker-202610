    \ in the environment is computed. The final step computes the list of variables\
    \ present in the type, excluding those found in the environment. In OCaml, this\
    \ filtering operation is carried out using the `List.filter` function from the\
    \ standard library, which only retains those elements of a list that satisfy a\
    \ given predicate. In Python, filtering is carried out by defining this predicate\
    \ using the construct `lambda`.\n\nConversely, to type an expression which is\
    \ an identifier, we need to generate a type from the type scheme bound to this\
    \ identifier in the environment. This is done by the `instantiation` operation,\

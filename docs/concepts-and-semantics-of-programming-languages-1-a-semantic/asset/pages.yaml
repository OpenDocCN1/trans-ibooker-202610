    a construct that allow users to perform tests enumerating all possible cases of
    a type’s values and verifying exhaustiveness (no values are left out). In a case
    where light values are encoded by integers, we would need to write, at best, a
    general case that should never occur, or, at worst, all other possible cases that
    should never occur. The capacity to define a new type with two-by-two disjunct
    values, only compatible with other values of this type, eliminates these drawbacks.
    An enumerated type definition of this kind enumerates the names given to values,
    known as _value constructors_.



    # 3.3.3. Recursive and mutually recursive functions


    Two occurrences of \(e_f\) occur on either side of the symbol \(\vdash\) in rule
    \(F_{18}\), which concerns the application of a recursive function. At first glance,
    this may seem paradoxical: evaluating \(e_f\) on the right leads us to evaluate
    \(e_f\) on the left. As we saw in section 3.2.5, this question may be expressed
    directly by using rule \(F_{16}\) and binding \(f\) to the closure:


    \(F = \langle x, e, (f, F) \oplus \text{Env} \rangle\)


    Once again, \(F\) appears on both sides of the equals sign. The existence of value
    \(F\) can be proven using the mathematical theory of the least fixpoint (LFP),
    briefly presented in section 4.7.1; a more detailed description can be found in
    [JAU 16]. Taking this approach, rules \(F_{16}\), \(F_{17}\) and \(F_{18}\) can
    be condensed into two rules:


    (N_{16}) \text{Env} \vdash \text{rec } f \ x = e \rightsquigaret \langle x, e,
    (f, F) \oplus \text{Env} \rangle \stackrel{\text{Env}_f}{=} F


    (N_{17\_18}) \frac{\text{Env} \vdash e_1 \rightsquigaret \langle x, e, \text{Env}_f
    \rangle \quad \text{Env} \vdash e_2 \rightsquigaret v_2}{(x, v_2) \oplus \text{Env}_f
    \vdash e \rightsquigaret v} \text{Env} \vdash (e_1 e_2) \rightsquigaret v



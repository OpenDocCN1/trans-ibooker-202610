    # 6.1.3. Characters


    Prior to the introduction of the Unicode standard and UTF-8, UTF-16 and UTF-32
    encodings, characters were represented by integers over 8 bits (one byte). Each
    of the first 128 values was associated with a "letter", following the ASCII standard.
    The integer value used to represent each character was referred to as its ASCII
    code. The ASCII standard was extended, with different variants in which the 128
    remaining values were used to represent other "letters" (including accented characters).


    Unicode extended character encoding by allowing "letters" to take up several bytes,
    vastly broadening the field of possibilities. Certain languages have dedicated
    types for handling Unicode encoding; for example, Java uses the `char` type (an
    integer over 16 bits) in addition to the `byte` type to handle ASCII encoding.
    Others, such as OCaml and C/C++ only include a `char` type, used for integers
    over 8 bits. In this case, the programmer is left to encode characters manually
    using a different type if extended ASCII is not sufficient.


    In Python 3, no difference is made between character strings and individual characters.
    At syntax level, anything that looks like a character (shown between apostrophes
    in many languages) produces a value of the same type used for character strings
    (usually shown between speech marks). Example 6.8 provides an illustration of
    this point.'

  md: '# 4.4. Operational semantics


    The instruction at the heart of all imperative languages is *assignment*, which
    changes the state of the memory, i.e. modifies its contents. Execution of an assignment
    $x := e$ in a state $(Env, Mem)$ consists of evaluating the expression $e$ in
    this state to obtain a value $v$ and a new memory state $Mem''$, searching the
    value $r = Env(x) \in \mathbf{R}$ of $x$ in environment $Env$, and then, finally,
    writing the value $v$ at the location $r$ to obtain memory $Mem''[r := v]$.


    REMARK.— Few high-level languages include a syntactic construct to distinguish
    between the reference of the location of a variable and the value stored at this
    location. These two distinct values are often denoted by the variable name alone;
    it is left to users to determine which value is to be used for each occurrence
    of the variable name in an expression. As we saw at the end of section 2.3, in
    these languages, the meaning of variable names occurring in assignments depends
    on their position to the left or to the right of the assignment symbol, on the
    left variable names denote a location, and on the right, they denote a value.


    The execution of an imperative program consists of executing a sequence of assignments
    and tests. The control structures included in a program specify the assignments
    to execute, the order of execution and the number of times they should be executed.
    Given an execution environment, the semantics of $\mathbf{Lang}_3$ describes the
    memory transformations associated with each instruction in $\mathbf{Lang}_3$.
    These transformations are described by a relation, following the approach first
    introduced in [PLO 04].


    # 4.4.1. Big-step semantics


    Given an execution environment $ENV$, the big-step operational semantics of language
    $\mathbf{Lang}_3$ defines a transition relation:


    ```

    $\rightarrow_{ENV} \subseteq M \times \mathbf{Lang}_3 \times M$

    ```


    such that $\langle Mem, c \rangle \rightarrow_{ENV} Mem''$ means that the execution
    of instruction $c$ in state $(ENV, Mem)$ leads to the memory state $Mem''$. This
    relation is defined by induction, using the inference system presented in Box
    4.2.


    Rule $C_1$ defines the semantics of the assignment $x := e$: the evaluation of
    $e$ in state $(ENV, Mem)$ must not raise an error, and evaluation of the variable
    $x$ in the environment $ENV$ must produce a reference, otherwise the execution
    is aborted. As the premises for this rule do not take the form $\langle Mem, c
    \rangle \rightarrow_{ENV} Mem''$, they must be considered as conditions for applying
    the rule.'

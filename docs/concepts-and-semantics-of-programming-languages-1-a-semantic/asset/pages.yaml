  md: '# 5.2.2. Typing a conditional expression


    Staying with our informal approach, we shall now compute the type of the expression
    fun x ↦ if x then true else 0. This is a function with a parameter x. As in the
    previous example, we have no type annotation, so the type of x is an unknown α.
    Analyzing the body of the function, we see that x acts as a condition, implying
    that it must be a boolean, denoted as bool. We must therefore have α = bool. The
    type of the result of this expression is the one of the conditional expression.
    The type of the then branch is bool, and the type of the else branch is int. Which
    type to choose? Let us look at the question from another angle. When applying
    this function to an actual value, the type of the result will depend on the value
    of the argument a point that prevents the further use of this result in source
    code. For this reason, a well-typed conditional expression must apply a test to
    a boolean value and return a value of the same type in both possible cases. In
    conclusion, the expression we are studying here is ill-typed.


    # 5.2.3. Typing without type constraints


    In this final part of our presentation of typechecking, we consider the following
    expression:


    ```

    let f_(1) = fun x_(1) ↦ x_(2) in if (f_(2) true) then 8 else (f_(3) 7)

    ```


    +   - let f_(1) = fun x_(1) ↦ x_(2) in ...


    As in our first example, let binds f_(1) to a functional expression. We thus need
    to determine the types of its argument and of its body. Once again, as there is
    no type annotation for the occurrence x_(1), its type is unknown and will be denoted
    by α. The body of f simply returns the argument; this does not provide any further
    information about the type of x. Thus, there are no constraints on this type,
    meaning that α can be replaced by any type. Indeed, this function may be applied
    to any value, since it simply returns this value as a result. Hence, the type
    of f_(1) is α → α.


    +   - if (f_(2) true), then 8 else (f_(3) 7)


    In a conditional expression, the condition expression must be of the type bool.
    We must therefore ensure that (f_(2) true) is of the type bool. The type of the
    function f_(1) is α → α, and, as it is applied to the constant true of type bool,
    we must have α = bool. The type of the condition is bool since α is also the type
    of the result of f_(1). Now, we must ensure that the expressions found in each
    of the two branches of this conditional have the same type. As the then branch
    is of type int, the else branch must also have type int. This last branch is an
    application of f_(3) to the argument 7 of type int, so the result is also of type
    int. Both branches of the conditional are therefore of the same type, which is
    also the type of the full expression. However, there is a subtle consistency issue
    in our reasoning, to be explained in section 5.2.4.'

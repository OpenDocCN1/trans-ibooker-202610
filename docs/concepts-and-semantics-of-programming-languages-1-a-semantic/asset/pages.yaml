  md: "# 5.4.3. Type inference algorithm\n\n# 5.4.3.1. Instantiation of type schemes\n\
    \nDEFINITION 5.7.– A fresh instance of a type scheme. We define a function Inst\
    \ (σ) which returns an instance of the type scheme σ, in which the generalized-type\
    \ variables αᵢ are replaced by fresh variables α'ᵢ, i.e. variables having no free\
    \ occurrence in the current typing environment.\n\nInst (∀α₁, ..., αₙ.τ) = τ[α₁\
    \ ← α'₁, ..., αₙ ← α'ₙ]\n\nGiving a formal meaning to the notion of fresh variables\
    \ implies including, in the whole formalization, the existence of an infinite\
    \ countable set of variables and keeping trace of the set of variables used in\
    \ the hypothesis and the conclusion of each rule within the inference algorithm\
    \ presented in section 5.4.3. For the sake of simplicity, we shall omit this technical\
    \ detail from our notation.\n\n```\nOCaml\nlet specialize (vars, body) =\n  let\
    \ fresh_assoc =\n    List.map\n    (fun var -> let fresh_var = new_ty_var () in\
    \ (var, fresh_var)) vars in\n  let rec copy ty =\n    match ty with\n    | T_int\
    \ | T_bool -> ty\n    | T_fun (t1, t2) ->\n        let t1_copied = copy t1 in\n\
    \        let t2_copied = copy t2 in\n        T_fun (t1_copied, t2_copied)\n  \
    \  | T_var v_name ->\n        (try List.assoc v_name fresh_assoc with Not_found\
    \ -> ty) in\n  copy body\n\nval specialize : (var_name_t list * type_t) -> type_t\n\
    ```\n\n```\nPython\nclass Not_found (Exception) :\n    pass\n\ndef list_assoc\
    \ (key, l) :\n    for (k, v) in l :\n        if k == key : return v\n    raise\
    \ Not_found\n\ndef specialize (sch) :\n    (vars, body) = sch\n    fresh_assoc\
    \ = list (map (lambda var : (var, new_ty_var ()), vars))\n    def copy (ty) :\n\
    \        if isinstance (ty, T_int) or isinstance (ty, T_bool) : return ty\n  \
    \      elif isinstance (ty, T_fun) :\n            t1_copied = copy (ty.t1)\n \
    \           t2_copied = copy (ty.t2)\n            return T_fun (t1_copied, t2_copied)\n\
    ```"

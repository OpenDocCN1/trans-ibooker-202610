    may also result in overflow. The value of the computation must therefore be converted
    to a value with the same type as the variable. This “signed ↔ unsigned” conversion
    is somewhat dangerous.


    Let us consider the conversion of the signed number –4 into an unsigned number
    using integers encoded over 4 bits. Using two’s complement, the encoding for –4
    is 1100. If an unsigned variable is assigned this bit sequence (without two’s
    complement), then its value is decoded as an unsigned value and represents the
    (necessarily) positive value 12. Now, consider the conversion of the unsigned
    number 15 into a signed number. The encoding for 15 is the sequence 1111, which
    is interpreted as a signed number using two’s complement as the value –1.


    Similarly, mixing signed and unsigned integers in computations can lead to overflow.
    In such cases, the value of one of the operands must be converted in order to
    acquire the type of the other operand. Example 6.4 shows a case of mixing and
    its effects.



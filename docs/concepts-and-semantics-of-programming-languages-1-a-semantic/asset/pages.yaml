  md: "# 7.4. Passing parameters by address\n\nIn section 4.6, we examined different\
    \ procedure call mechanisms, defining different modes of communication between\
    \ the caller and the called procedure. In the case of passing by value, the caller\
    \ transmits the value to the called procedure: this value is either a constant\
    \ or a mutable variable, which is local to the procedure and initialized by the\
    \ transmitted value. In the case of passing by reference, communication between\
    \ the caller and the called procedure operates in both directions: the address\
    \ of a mutable variable from the calling environment is transmitted to the procedure,\
    \ and the procedure can then modify the value of this variable. Box 4.6 describes\
    \ the possible semantics of these different call mechanisms. In this section,\
    \ we shall present the use of pointers in passing arguments: this is known as\
    \ *passing an argument by address*. This is a technique for implementing passing\
    \ by reference but also, for certain compilers, a means of optimizing the transmission\
    \ of large arguments. Several situations in which passing by address is helpful\
    \ are described below.\n\nBy definition, a function returns a single value. However,\
    \ we may require several values to be returned. One simple example is a function\
    \ designed to take an array of integers and return the numbers of negative, null\
    \ and positive values found in the array. In languages with native support for\
    \ n-uples, a single triple value will be returned. Example 7.1 shows the definition\
    \ of this function in Python.\n\n```\nEXAMPLE 7.1.--\nPython\n```\ndef count (t)\
    \ :\n    vneg = 0\n    vnu1 = 0\n    vpos = 0\n    i = 0\n    while i < len (t)\
    \ :\n        if t[i] < 0 : vneg = vneg + 1\n        elif t[i] == 0 : vnu1 = vnu1\
    \ + 1\n        else : vpos = vpos + 1\n        i = i + 1\n    return (vneg, vnu1,\
    \ vpos)\n```\n```\n\nIf the chosen language does not support n-tuples – as in\
    \ C – another mechanism must be used, such as creating a record type containing\
    \ three integers and returning a value of this type, as shown in example 7.2."

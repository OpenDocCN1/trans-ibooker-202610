  md: "# Solution to exercise 4.3\n\nTo ease proof reading, we introduce the following\
    \ notation:\n\n```\n(a := 0 ; b := x) ; while ↓b ≥ y do b := ↓b − y ; a := ↓a\
    \ + 1\nc1     c2         ew         c3         c4\n     cw\n          cd\n```\n\
    \n1) In what follows, we assume that Env(a) and Env(b) are elements in R,\ndenoted\
    \ as ra and rb, respectively. Let vx and vy be the values Env(x) and Env(y).\n\
    By definition, the functions associated with each of the components of this program\n\
    are as follows:\n\n```\n[[c1]]Env : Mem ↦ Mem[ra := 0]\n[[c2]]Env : Mem ↦ Mem[rb\
    \ := vx]\n[[c1; c2]]Env : Mem ↦ Mem[ra := 0][rb := vx]\n[[c3]]Env : Mem ↦ Mem[rb\
    \ := Mem(rb) − vy]\n[[c4]]Env : Mem ↦ Mem[ra := Mem(ra) + 1]\n[[c3; c4]]Env :\
    \ Mem ↦ Mem[rb := Mem(rb) − vy][ra := Mem(ra) + 1]\n[[cw]]Env = lfp(F) where F\
    \ : f ↦ cond([[ew]]Env, f ◦ [[c3; c4]]Env, id)\nF(f) : Mem ↦ { f([[c3; c4]]Env(Mem))\
    \ if Mem(rb) ≥ vy\n       Mem       if Mem(rb) < vy\n```\n\nThe function [[c3;\
    \ c4]]Env describes the state obtained after executing one\niteration of the loop.\
    \ When the body of the loop is executed twice, the function\n[[c3; c4]]2Env =\
    \ [[c3; c4]]Env ◦ [[c3; c4]]Env is defined by:\n\n```\nMem ↦ ( Mem [rb := Mem(rb)\
    \ − vy][ra := Mem(ra) + 1]\n       [rb := Mem(rb) − vy − vy][ra := Mem(ra) + 1\
    \ + 1] )\n   = Mem[rb := Mem(rb) − 2vy][ra := Mem(ra) + 2]\n```\n\nMore generally,\
    \ when the body of the loop is executed n times, we have (by an\neasy induction\
    \ on n):\n\n```\n[[c3; c4]]nEnv : Mem ↦ Mem[rb := Mem(rb) − nvy][ra := Mem(ra)\
    \ + n]\n```\n\nUsing theorem 4.2, let us compute lfp(F) = ⊔({Fn(⊥) | n ≥ 0}) from\n\
    F 0(⊥) = ⊥ : Mem ↦ undef. By definition, we have:\n\n```\nF 1(⊥) = F(⊥) : Mem\
    \ ↦ { undef if Mem(rb) ≥ vy\n                    Mem if Mem(rb) < vy\n```\n\n\
    Similarly:\n\n```\nF 2(⊥) = F(F 1(⊥)) : Mem ↦ { F 1(⊥)([[c3; c4]]Env(Mem)) if\
    \ Mem(rb) ≥ vy\n                      Mem       if Mem(rb) < vy\n```"

  md: '# 5.2.4. Polymorphism


    In the last example in section 5.2.3, in applying \( f_{(2)} \) to \( true \),
    we used \( \alpha = \text{bool} \). Then, when applying \( f_{(3)} \) to 7, we
    implicitly used \( \alpha = \text{int} \). By transitivity of the equality, we
    get \( \text{bool} = \text{int} \), which is certainly wrong. However, as \( f
    \) is the identity function, both uses of \( f \) appear to be licit. While there
    are no constraints concerning the type of \( f_{(1)} \), the type expression \(
    \alpha \to \alpha \) cannot serve directly to establish equality constraints between
    \( \alpha \) and several different types which may be incompatible. For each occurrence
    of \( f \), we must use a “copy” of its type expression and replace the type variable
    \( \alpha \) with a new type variable (known as a *fresh variable*). This prevents
    interferences between type constraints introduced by different occurrences of
    \( f \). Thus, the typing environment binds identifiers to the “form” of their
    types, rather than to the types themselves; this form is called a *type scheme*.
    This scheme may contain special type variables called *generalized* type variables.
    When searching for the type of an identifier in a typing environment, a “fresh”
    copy of the type scheme is produced, in which the generalized type variables are
    replaced by new variables. This copy is known as an *instance* of the scheme,
    and these new variables are not generalized, as they denote some yet unknown types.
    A type scheme, noted \( \sigma \), is thus made up of the list of generalized
    type variables (to be copied) and the shape of the type written with these variables.
    The type scheme of the function \( f \) described above is thus denoted as \(
    \forall \alpha. \alpha \to \alpha \).


    An expression for which the type includes type variables at the end of the typechecking
    process is said to be *polymorphic*. As we shall see in section 5.6, at the end
    of the typechecking process, the types of some expressions may contain unknown
    variables that cannot be generalized.


    # 5.3. Typing rules in Exp$_2$


    We turn now to the formal definitions of the rules of typechecking. These rules
    do not yet allow us to synthesize types in a program, but they make it possible
    to check that a program is well-typed. These rules will be used in section 5.4
    to develop an inference algorithm for automatic type computation.



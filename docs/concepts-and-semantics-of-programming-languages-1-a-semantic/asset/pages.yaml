  md: 'Structural equality is only possible in languages with native data structures,
    and the size and form of the information composing the structure must be known
    at compile-time. This is the case in both OCaml and Python, which allow structural
    comparison of lists, arrays, etc. In these languages, the compiler chooses the
    representation of these structures, unlike in C, where encoding is left to the
    programmer. The internal implementation of equality draws on knowledge of the
    compiler’s representation choices. Note that these languages also have the capacity
    to test for physical equality (== in OCaml, is in Python).


    In languages such as C or C++, the compiler cannot automatically determine which
    semantics to use in comparing two arbitrary data structures. There is no means
    of knowing whether any given pointer represents either the address of a single
    entity, or that of an array (and thus of multiple values). This task can only
    be carried out by the developer, who knows the semantics of the structures which
    she or he has created. Thus, in the case of a linked list structure, the programmer
    must implement a comparison which follows the links in the list, knowing that
    each pointer only provides the address of the next element. In a situation involving
    arrays of linked lists, the programmer must develop an operation to compare consecutive
    objects, knowing that the pointer for an array designates the beginning of a sequence
    of elements. This point is illustrated in example 6.54.



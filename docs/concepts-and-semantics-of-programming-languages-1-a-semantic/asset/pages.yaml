  md: '# 3.1.3. Reasoning by induction over expressions


    The set Exp₂ is defined inductively: each expression e ∈ Exp₂ is obtained by applying
    the construction rules of Exp₂ a finite number of times. This process means that
    a property P can be proved over the elements of Exp₂ by applying the structural
    induction scheme shown in Box 3.1: we simply prove the property P for each construct
    assuming that P is satisfied by each component of the construct. This reasoning
    by induction will be used several times in the remainder of the book.


    ```

    if ∀v ∈ K P(v)

    and ∀x ∈ X P(x)

    and ∀e₁ ∈ Exp₂ P(e₁) ⇒ P(op e₁)

    and ∀e₁, e₂ ∈ Exp₂ (P(e₁) and P(e₂)) ⇒ P(e₁ op e₂)

    and ∀e₁, e₂, e₃ ∈ Exp₂ (P(e₁) and P(e₂) and P(e₃)) ⇒ P(if e₁ then e₂ else e₃)

    and ∀x ∈ X ∀e₁, e₂ ∈ Exp₂ (P(e₁) and P(e₂)) ⇒ P(let x = e₁ in e₂)

    and ∀x ∈ X ∀e ∈ Exp₂ P(e) ⇒ P(fun x ↦ e)

    and ∀x, f ∈ X ∀e ∈ Exp₂ P(e) ⇒ P(rec f x = e)

    and ∀e₁, e₂ ∈ Exp₂ (P(e₁) and P(e₂)) ⇒ P((e₁ e₂))

    then ∀e ∈ Exp₂ P(e)

    ```


    # Box 3.1. Structural induction scheme over e ∈ Exp₂


    # 3.1.4. Declaration of variables, bound and free variables


    An identifier can be used several times within the same expression, and each of
    its uses is called an occurrence of the identifier. The occurrences of the same
    identifier do not all play the same role. In construct (6) let x = e₁ in e₂, the
    identifier x is declared and bound to the value of e₁ in the environment, which
    will be used to evaluate e₂. Construct (7) abstracts the variable x in the expression
    e. This parameter x is said to be bound (or abstracted) in the expression fun
    x ↦ e. It can be renamed without modifying the definition of the function; thus,
    it is sometimes called a dummy variable. For example, replacing x with z in fun
    x ↦ x + y gives fun z ↦ z + y, which is equivalent. Evidently, we cannot replace
    x with y since y already occurs in the function body x + y. In construct (8),
    the identifier f is declared and the variable x is bound in the expression e.
    For example, the expression is:


    ```

    let x₍₁₎ = 25 in let f = fun x₍₂₎ ↦ x₍₃₎ + 3 in (f 7) + x₍₄₎ [3.3]

    ```'

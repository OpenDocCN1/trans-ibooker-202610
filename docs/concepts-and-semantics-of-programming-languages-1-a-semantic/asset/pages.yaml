  md: '# EXAMPLE 6.43.-


    ```

    type intlist = End | Cell of (int * intlist)

    let rec sum l = match l with Cell (i, remainder) -> i + sum remainder | End ->
    0

    ```


    The `intlist` type represents lists of integers, and the function `sum` returns
    the sum of the integers in a list. If `l = Cell (a, r)`, then the variable `i`
    is bound to `a` and the variable `remainder` is bound to `r`. The bindings of
    these two pattern variables are used in the body of the case, enabling the addition
    of the current integer value and the sum of the remainder list, computed recursively.
    If `l = End`, the recursion stops and the value 0 is returned.


    Note that a “catch-all” pattern, denoted as `_,` may replace a pattern variable
    if the value matched by this variable is unused in the body of the case. This
    pattern is equivalent to a variable, but avoids introducing a new name. It provides
    a clear indication to readers that this part of the matched value is not used.


    # EXAMPLE 6.44.-


    ```

    let is_empty l = match l with Cell (_, _) -> false | _ -> true

    ```


    A list is empty if the `Cell` constructor has no occurrence in its value, which
    is therefore `End`. We first consider the case of a value built with the constructor
    `Cell`, which will return `false` whatever is the integer and the remainder list
    arguments of this constructor. Thus, the corresponding pattern is `Cell (_,_)`
    with two occurrences of `_`. For all other cases (in our example, only `End`),
    the list is empty. Note that the final `“catches” the only remaining case `End`;
    as such, we could write `| End -> true` in a completely equivalent manner.


    # 6.5.2.1. ML style pattern matching: formalization


    Before establishing a formal semantics of pattern matching, we need to provide
    a more detailed explanation of the notion of _term_, which we have discussed briefly
    in the context of type inference in section 5.4 where the word _term_ referred
    to type expressions. More generally, terms are constructed from a set \(\Sigma\)
    of symbols, which each have an _arity_ (the number of “arguments” of the symbol)
    and a set of variables _V_, according to the following inductive definition.


    # DEFINITION 6.1.- Term: the set \(\mathcal{T}(\Sigma, V)\) of terms over \(\Sigma\)
    and _V_ is defined by:


    +   - every symbol of arity 0 is a term in \(\mathcal{T}(\Sigma, V)\);

    +   - every variable in _V_ is a term in \(\mathcal{T}(\Sigma, V)\);

    +   - if _t_<sub>1</sub>, ..., _t<sub>n</sub>_ are terms in \(\mathcal{T}(\Sigma,
    V)\), and if _C_ is a symbol of arity _n_, then _C_(_t_<sub>1</sub>, ..., _t<sub>n</sub>_)
    is a term in \(\mathcal{T}(\Sigma, V)\).'

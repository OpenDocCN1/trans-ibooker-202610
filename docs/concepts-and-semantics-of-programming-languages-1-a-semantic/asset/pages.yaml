  md: 'mice, screens and keyboards are peripherals used with desktop computers, but
    other elements such as motors, analog/digital acquisition cards, etc. are also
    peripherals.


    If peripherals are present, the microprocessor needs to devote part of its processing
    time to data acquisition and to the transmission of computed results. This interaction
    with peripherals may be directly integrated into programs. But in this case, the
    programs have to include regular checking of input peripherals to see if new information
    is available. It is technically difficult (if not impossible) to include such
    a monitoring in every program. Furthermore, regular peripheral checks are a waste
    of time and energy if no new data is available. Finally, there is no guarantee
    that information would arrive exactly at the moment of checking, as data may be
    asynchronously emitted.


    This problem can be avoided by relying on the hardware to indicate the occurrence
    of new external events, instead of using software to check for these events. The
    *interrupt* mechanism is used to interrupt the execution of the current code and
    to launch the interrupt handler associated with the external event. This handler
    is a section of code, which is not explicitly called by the program being executed;
    it is located at an address known by the microprocessor. As any program may be
    interrupted at any point, the processor state, and notably the registers, must
    be saved before processing the interrupt. The code that is executed to process
    the interrupt will indeed use the registers and modify the SR, SP and PC. Therefore,
    previous values of registers must be restored in order to resume execution of
    the interrupted code. This context saving is carried out partially by the hardware
    and partially by the software.


    # 1.2. Computers: a high-level view


    The low-level vision of a von Neumann machine presented in section 1.1 provides
    a good overview of the components of a computer and of program execution, without
    going into detail concerning the operations of electronic components. However,
    this view is not particularly helpful in the context of everyday programming activity.
    Programs in binary code, or even assembly code, are difficult to write as they
    need to take account of every detail of execution; they are, by nature, long and
    hard to review, understand and debug. The first “high-level” programming languages
    emerged very shortly after the first computers. These languages assign names to
    certain values and addresses in the memory, providing a set of instructions that
    can be split into low-level machine instructions. In other terms, programming
    languages offer an abstract vision of the computer, enabling users to ignore low-level
    details while writing a program. The “hello world” program in Figure 1.2 clearly
    demonstrates the power of abstraction of C compared to the X86 assembly language.'

    # ### 8.2.2. Values


    In **Exp**<sub>2</sub>, an exception is a constant value just like an integer
    in \( \mathbb{Z} \), a boolean in \( \mathbb{B} \) or a closure in \( \mathbb{F}
    \). The fact that exceptions are values means that they can be results of evaluating
    arbitrary expressions, before – possibly – being raised. We must therefore differentiate
    between a result being an exception value and one being an explicitly raised exception.
    In the first case, no error is reported; the result is simply a value allowing
    a later error notification. In the second case, the result is an actual and characterized
    error.


    In section 3.2.2, “error results” (denoted by **E**) were “highlighted” errors
    and not values. In addition to the existing values, we must introduce values for
    non-raised exceptions. Let **E** be the set of exception values and \(\hat{\mathbb{E}}\)
    the set of raised exceptions. Thus, the set of values in our language is now defined
    by \(\mathbf{V} = \mathbb{Z} \cup \mathbb{B} \cup \mathbb{F} \cup \mathbb{E}\).
    The set containing all possible results of the evaluation of an expression, that
    is either a value or a raised exception, is now defined as \(\forall = \mathbf{V}
    \cup \hat{\mathbb{E}}\).



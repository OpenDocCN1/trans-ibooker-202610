    # 6.5.2.1.2. Operational semantics


    We shall extend the abstract syntax of `Exp₂`, presented in section 3.1.1, as
    shown in Table 6.3.


    | p ::= | v | Pattern variable |

    |---|---|---|

    | | C(p1, ..., pn) | Value constructor |

    | e ::= | ... | Previous expressions |

    | | match e with p -> e | _ -> e | Pattern matching |


    # Table 6.3. Extension of the syntax of Exp2 for pattern matching


    First, we need to define the syntax of patterns, which are essentially composed
    of constructors and variables (the catch-all pattern can be assimilated to a variable
    of which the name is irrelevant. We then add a construct for pattern matching
    with only two cases. The first case is a given pattern, and the second is the
    catch-all, which always succeeds. This structural limitation is used to simplify
    presentation, and it has no effect on the generality of the language. It is always
    possible to rewrite


    ```

    match e with P1 -> e1 | P2 -> e2 | P3 -> e3

    as


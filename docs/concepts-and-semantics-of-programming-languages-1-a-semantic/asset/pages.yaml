    # 4.5.3. Determinism of program execution


    To ensure that the same program executed from the same state will always produce
    the same result, we prove that the execution of instructions is deterministic.


    PROPOSITION 4.1. – Determinism of instruction execution:


    ```

    ∀ c ∈ Lang3 ∀ Env ∈ E ∀ Mem, Mem1, Mem2 ∈ M

    (<Mem, c> →Env Mem1 and <Mem, c> →Env Mem2) ⇒ Mem1 = Mem2

    ```


    We first attempt to prove this proposition by induction over the program structure.
    For the program while e do c, by induction hypothesis, we may suppose that the
    property is verified for c. Using the following two trees


    ```

    (V1) (Cj) :: ... (V2) (Cj'') :: ...

    ```


    we therefore obtain Mem1 = Mem''1.'

    Exceptions provide a simple and flexible way of handling errors in software. If
    an exception is not explicitly handled by the call which raised it, it is automatically
    propagated upstream in the functions calls graph until a function which “knows”
    how to handle the exception is found. If there is no handler for this exception,
    then the execution of the program is interrupted, highlighting the existence of
    a configuration not foreseen in the algorithm. We can see that this mechanism
    contrasts radically with the one previously used to report errors in the traditional
    style, where the “impossible values” returned by functions must be encoded and
    propagated manually.


    Exceptions can be “entities” of different kinds, depending on the language. Nevertheless,
    the same two functions – raising and catching exceptions – are always present.


    # 8.2. A simple formalization: ML-style exceptions


    In this section, we shall give a formal presentation of the syntax, the execution

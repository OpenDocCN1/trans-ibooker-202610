    # ## 4.7.2. Axiomatic semantics, Hoare logic


    The operational and denotational semantics of the language **Lang**<sub>3</sub>
    presented in this chapter characterize the transformations of the state along
    the execution of a program. The state descriptions provided by these semantics
    are "complete" in the sense that they determine the values contained in every
    memory cell. Axiomatic semantics describes these states in terms of the properties
    they verify. These properties, which are often called _assertions_, may concern
    the contents of any location, but it is also possible to consider properties defined
    only for a subset of the locations. Moreover, this axiomatic semantics is generally
    used to prove properties concerning the expected results of programs, rather than
    to describe their execution. It also provides a formalism for establishing the
    correctness of a program with regard to desired properties, i.e. with regard to
    a program specification. This formalism, introduced in [HOA 83], is based on a
    specification language used to create formal descriptions of tasks assigned to
    programs, and to express the relation between program input and output. The correctness
    property is expressed using a Hoare triple:


    ```

    \{P_1\}c\{P_2\}

    ```'

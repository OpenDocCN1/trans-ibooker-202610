  md: '- ROM (Read Only Memory): information stored in a ROM is written at the time
    of manufacturing, and it is read-only. ROM is slower than RAM, but is non-volatile,
    like, for example, a burned DVD;


    - EPROM (Erasable Programmable Read Only Memory): this memory is non-volatile,
    but can be written using a specific device, through exposure to ultra-violet light,
    or by modifying the power voltage, etc. It is slower than RAM, for both reading
    and writing. EPROM may be considered equivalent to a rewritable DVD.


    Computers use the memory components of several technologies. Storage size diminishes
    as access speed increases, as fast-access memory is more costly. A distinction
    is generally made between four different types of memory:


    - mass storage is measured in terabytes and is made either of mechanical disks
    (with an access time of ~ 10 ms) or – increasingly – of solid-state drive (SSD)
    blocks. These blocks use an EEPROM variant (electrically erasable) with an access
    time of ~ 0.1–0.3 ms, known as flash memory. Mass storage is non-volatile and
    is principally used for the file system;


    - RAM, which is external to the microprocessor. Recent home computers and smartphones
    generally possess large RAM capacities (measured in gigabytes). Embedded systems
    or consumer development electronic boards may have a much lower RAM capacity.
    The access time is around 40–50 ns;


    - the cache is generally included in the CPU of modern machines. This is a small
    RAM memory of a few kilobytes (or megabytes), with an access time of around 5–10
    ns. There are often multiple levels of cache, and access time decreases with size.
    The cache is used to save frequently used and/or consecutive data and/or instructions,
    reducing the need to access slower RAM by retaining information locally. Cache
    management is complex: it is important to ensure consistency between the data
    in the main memory and the cache, between different CPUs or different cores (full,
    independent processing units within the same CPU) and to decide which data to
    discard to free up space, etc.;


    - registers are the fastest memory units and are located in the center of the
    microprocessor itself. The microprocessor contains a limited number (a few dozen)
    of these storage zones, used directly by CPU instructions. Access time is around
    one processor cycle, i.e. around 1 ns.



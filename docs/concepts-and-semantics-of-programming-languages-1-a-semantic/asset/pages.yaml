  md: '```

    if r is error then return error

    ...

    ```


    This mechanism, which is entirely reliant on the programmer, presents several
    drawbacks. Error propagation is explicit in the algorithm. Furthermore, forgetting
    to check the validity of the result of a function call could go unnoticed. In
    addition, it must be possible to notify an error in the returned value. This is
    easy when the codomain of a function is partial: just encode the error in a value
    outside the codomain. For example, a function computing the absolute value of
    the difference between its arguments, which are assumed to be strictly positive,
    can only return positive or null integer values. Hence, errors can be represented
    using −1, −2, etc., as follows:


    ```

    abs_diff_positive_ints (x, y)

    if x = 0 or y = 0 then return (-1)

    if x < 0 or y < 0 then return (-2)

    if x > y then return (x - y)

    else return (y - x)

    ```


    This mechanism for encoding error values becomes impossible if the codomain of
    the function is total: all the values that can be returned are legal values. In
    other words, there is no available value to represent an error. In the following
    (simplistic) example computing the acceleration of a mass subjected to a force,
    if the mass is null, we do not know what value to return.


    ```

    accel (force, mass)

    if mass = 0 then return ???

    else return (force / mass)

    ```


    Some languages natively include n-uples. In this case, a pair may be returned,
    the first component being a flag stating whether or not this result is meaningful,
    the other one being the value of the result. If the flag indicates an error, any
    value may be chosen for the result, as it is known to be meaningless.


    ```

    accel (force, mass)

    if mass = 0 then return (false, 42)

    else return (true, (force / mass))

    ```


    In languages with sum types, the type of returned values can also be modified
    to include a notion of validity or invalidity.


    ```

    type result = Error | Valid (float)

    accel (force, mass)

    if mass = 0 then return (Error)

    else return (Valid (force / mass))

    ```


    For languages without native n-uples or sum types, there are three possible solutions.'

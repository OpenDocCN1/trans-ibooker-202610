    \ compatible with $\tau_1 \rightarrow \tau_2$. Finally, rule $T_{app}$ states\
    \ that, in order to apply an expression $e_1$ to an argument $e_2$, $e_1$ must\
    \ be of the functional type $\tau_1 \rightarrow \tau_2$ and $e_2$ must be of the\
    \ type $\tau_1$. The type of the overall expression is that of the result of the\
    \ function, i.e. $\tau_2$.\n\nNote that rule $T_{rec}$ introduces a binding between\
    \ the recursively defined function and a trivial type scheme into the environment.\
    \ Thus, the expression\n\n```\nrec f x = let y = (f 7) in (f true)\n```\n\nis\
    \ rejected by the typechecking process. Indeed, $f$ is used in the expression\
    \ with both the type int $\rightarrow \\alpha$ and the type bool $\rightarrow\
    \ \\alpha$.\n\nNote that generalizing the type of $f$, i.e. assigning type $\b\
    eta \rightarrow \\alpha$ to $f$, would still have been correct in terms of the\
    \ execution semantics used in evaluating expressions. The scheme of $f$ must be\
    \ limited to a trivial scheme in order to guarantee the decidability of type inference\
    \ (i.e. the possibility of designing a type computation algorithm which is guaranteed\
    \ to terminate)."

  md: '# 6.3. Strings


    A character string (or *string*) is a contiguous sequence of characters. A string
    is, intrinsically, an array of characters, independent of the way an individual
    character is represented (see section 6.1.3). Many languages have a predefined
    type for strings, along with a range of associated operations (concatenation,
    access to characters, length computation, etc.). Java and C++ offer a dedicated
    class for strings; OCaml and Python use a predefined type and a module providing
    operations. In C, strings are encoded by the developer as a character array. A
    special character (known as the *sentinel*), with value 0 and noted `\0`, is used
    to mark the end of a string. This representation is used internally by C++, ensuring
    compatibility with C-style strings.


    Depending on the chosen language, it may or may not be possible to modify some
    characters in a string. Python, Java and OCaml do not permit modifications, strings
    in these languages are not *mutable*. These languages provide alternative types,
    which implement sequences of characters using mutable bytes. However, a suitable
    function from the language''s standard library may be used to convert these sequences
    into strings. In C (and C++ if the dedicated class is not used), although strings
    take the form of arrays, mutability is not entirely straightforward. A string
    may be defined in two ways, as shown in example 6.19.


    EXAMPLE 6.19.-


    ```

    char arr[] = "A string" ;

    char *str = "A string" ;

    ```


    In the first case, the compiler creates an array of characters that is stored
    in the memory zone of the program variables; characters in the string can be modified.
    In the second case, the compiler creates a non-mutable string of characters, which
    is stored in a read-only area of the memory. Any attempt to modify characters
    in the string will result in an execution error, as the operating system will
    detect an illegal attempt to write to a read-only zone.


    All of the languages, which include a specific type for strings, also supply comparison
    primitives, which are used to test equality or order relations between strings.
    And C, which does not include a dedicated type, does not provide comparison operators
    for strings. In this case, a comparison operator applied to two strings will simply
    compare the addresses of the respective arrays, rather than inspecting the contents
    of the strings (see section 6.6). The language''s standard library provides a
    string comparison function (`strcmp`).



  md: '# ## 1.2.1. Modeling computations


    Any program is simply a description, in its own programming language, of a series
    of computations (including reading and writing), which are the only operations
    that a computer can carry out. An abstract view of a computer requires an abstract
    view – we call it a _model_ – of the notion of computation. This subject was first
    addressed well before the emergence of computers, in the late 19th century, by
    logicians, mathematicians and philosophers, who introduced a range of different
    approaches to the theory of calculability.


    The Turing machine [TUR 95] is a mathematical model of computation introduced
    in 1936. This machine operates on an infinite memory tape divided into cells and
    has three instructions: move one cell of the tape right or left, write or read
    a symbol in the cell or compare the contents of two cells. It has been formally
    proven that any “imperative” programming language, featuring assignment, a conditional
    instruction and a while loop, has the same power of expression as this Turing
    machine.


    Several other models of the notion of algorithmic computation were introduced
    over the course of the 20th century, and have been formally proven to be equivalent
    to the Turing machine. One notable example is Kleene’s recursion theory [KLE 52],
    the basis for the “pure functional” languages, based on the notion of (potentially)
    recursive functions; hence, these languages also have the same power of expression
    as the Turing machine. Pure functional and imperative languages have developed
    in parallel throughout the history of high-level programming, leading to different
    programming styles.


    # ## 1.2.2. High-level languages


    Broadly speaking, the execution of a functional program carries out a series of
    function calls that lead to the result, with intermediate values stored exclusively
    in the registers. The execution of an imperative program carries out a sequence
    of modifications of memory cells named by identifiers, the values in the cells
    being computed during execution. The most widespread high-level languages include
    both functional and imperative features, along with various possibilities (modules,
    object features, etc.) to divide source code into pieces that can be reused.


    Whatever the style of programming used, any program written in a high-level language
    needs to be translated into binary language to be executed. These translations
    are executed either every time the program is executed – in which case the translation
    program is known as an _interpreter_ or just once, storing the produced binary
    code – in which case the translator is known as a _compiler_.


    As we have seen, high-level languages facilitate the coding of algorithms. They
    ease reviewing of the source code of a program, as the text is more concise than
    it'

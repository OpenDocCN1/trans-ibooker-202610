  md: "The set of errors considered here is thus IE = {ErrU, ErrE, ErrT}. This choice\
    \ is somewhat arbitrary: it would be possible to use only one sort of error, or,\
    \ on the contrary, to make a finer distinction between different causes of errors.\
    \ This can be done by modifying the error handling rules.\n\nIn Exp2, the evaluation\
    \ of some expressions e may not terminate, and in this case, the value [[e]]Env\
    \ is undefined: no value – not even an error value – will be returned. The evaluation\
    \ function [[_]]_ is thus a partial function. The formal processing of non-termination\
    \ lies outside the scope of this book.\n\n# ### 3.2.2. Values\n\nThe set V contains\
    \ integers, booleans and the values of functions called closures, presented in\
    \ section 3.2.4. For a non-recursive function (fun x -> e), the closure is a triple\
    \ (x, e, Env) made up of the name of the function parameter (x), the function\
    \ body (e) and the environment in which the definition of the function is evaluated\
    \ (Env). For a recursive function (rec f x = e), the closure is a quadruple <f,\
    \ x, e, Env> made up of the name of the function (f), the name of the function\
    \ parameter (x), the function body (e) and the environment in which the definition\
    \ of the function is evaluated (Env). Hence, the set of closures IF is defined\
    \ by:\n\nIF = (X x Exp2 x E) U (X x X x Exp2 x E)\n\nEvery value bound to an identifier\
    \ in an environment is an element in the set V = Z U IB U IF. The set V = V U\
    \ IE comprises all possible results of the evaluation of an expression.\n\nSets\
    \ IE, V and V can be defined as follows:\n\n```\n```python\nclass E_Typ2:\n  \
    \  pass\nclass E_Exec2:\n    pass\nclass E_Undef2:\n    pass\nclass VInt2:\n \
    \   def __init__(self,val_int):\n        self.val_int = val_int\nclass VBool2:\n\
    \    def __init__(self,val_bool):\n        self.val_bool = val_bool\nclass Clos2:\n\

    # ### 1.2.3.5. Linking


    A single program may be made up of several source files, compiled separately.
    Once the object code from each source file has been produced, all these codes
    must be collected into a single executable file. Each object file includes “holes”,
    indicating unknown information at the moment of production of this object code.
    It is important to know where to find this missing code, when calling functions
    defined in a different compilation unit, or where to find variables defined in
    a location outside of the current unit.


    The linker has to gather all the object files and fill all the holes. Evidently,
    for a set of object files to lead to an executable file, all holes must be filled;
    so the code of every function called in the source must be available. The linking
    process also has to integrate the needed code, if it comes from some libraries,
    whether from the standard language library or a third-party library. There is
    one final question to answer, concerning the point at which execution should begin.
    In certain languages (such as C, C++ and Java), the source code must contain one,
    and only one, special function, often named main, which is called to start the
    execution. In other languages (such as Python and OCaml), definitions are executed
    in the order in which they appear, defined by the file ordering during the linking
    process. Thus, “executing” the definition of a function does not call the function:
    instead, the “value” of this function is created and stored to be used later when
    the function is called. This means that programmers have to insert into the source

  md: 'As we defined a substitution on types, replacing type variables by types, we
    define a substitution on terms as a partial finite domain function of the set
    of variables into the set of terms and extend it naturally into a function of
    terms into terms.


    Substitutions can be used to establish a preorder of generality on terms. A term
    _t_<sub>1</sub> is _less general_ than a term _t_<sub>2</sub> if there exists
    a substitution \(\phi\) such that _t_<sub>1</sub> = \(\phi(t_2)\) and it is noted
    _t_<sub>1</sub> ≤ _t_<sub>2</sub>.


    Formally, matching a value _v_ against a pattern _m_ consists of considering the
    pattern _m_ as a term and determining if _v_ ≤ _m_. So we have to compute the
    substitution \(\phi\) associating the variables of the pattern with subterms (subvalues)
    of _v_. If such a substitution \(\phi\) exists, then _m_ is said to _match v_
    and \(\phi\) is used to extend the execution environment of the pattern matching
    case.


    # 6.5.2.1.1. Order of patterns


    Pattern matching is done according to the patterns involved in the match/with
    construct and, before giving a formal semantics to this mechanism, we precise
    how the choice of the right pattern is done. Patterns are examined in the order
    in which they appear. If the first pattern does not match the examined value,
    the second case is tested, and so on for as long as necessary.


    If no pattern is found that matches the value in question, an execution error
    is raised. Note that languages in the ML family analyze pattern exhaustiveness
    at compile-time and a warning is emitted by their compiler in case of non-exhaustive
    pattern matching.


    If a value matches more than one pattern, the order in which patterns are listed
    is decisive: the first matching pattern is used, and the other matching patterns
    are ignored.


    If several patterns always match the same values, then the principle of choosing
    the first one still holds; however, for example in OCaml, the compiler raises
    a warning to indicate the existence of this redundancy in the match/with construct.


    These different situations – partially overlapping cases, totally overlapping
    cases and missing cases – are illustrated in example 6.45.


    # EXAMPLE 6.45.–


    ```

    OCaml

    type logic_op = Or of (bool * bool) | And of (bool * bool)

    let eval e =

    match e with

    | Or (true, _) | Or (_, true) | Or (false, true) | And (true, true) -> true

    ```'

- pgno: 170
  md: 'Considering the principal type of an expression prevents some type conflicts.
    If the type inference algorithm does not use the principal type of an expression,
    it may reject expressions which are indeed well-typed. For this reason, any expression
    must have a principal type belonging to the type system (this is the case in the
    Exp2 language), otherwise inference will be impossible or users will be forced
    to provide type annotation for certain parts of their programs.


    # 5.4.2. Sets of constraints and unification


    The type inference algorithm establishes that an expression \( e \) is of type
    \( \tau \) when a set of constraints can be satisfied, i.e. when a solution exists.
    A constraint introduces an equality between two types. For example, from the expression
    if \( (f\ 4) \) then \( 5 \) else \( (g\ true) \), we deduce the following set
    of constraints to be satisfied:


    +   - the type \( \tau_f \) of \( f \) is functional: \( \tau_f = \alpha \rightarrow
    \beta \);

    +   - the argument of \( f \) is an integer: \( \alpha = \text{int} \);

    +   - as the result of \( f \) being used as a condition, it is a boolean: \(
    \beta = \text{bool} \);

    +   - the type \( \tau_g \) of \( g \) is functional: \( \tau_g = \gamma \rightarrow
    \delta \);

    +   - the argument of \( g \) is a boolean: \( \gamma = \text{bool} \);

    +   - the result of \( g \) is of the same type as the expression 5, meaning that
    it is an integer: \( \delta = \text{int} \).


    If all these equality constraints can be satisfied together, then the expression
    is well-typed. This is true here if we take \( \alpha = \text{int} \), \( \beta
    = \text{bool} \), \( \gamma = \text{bool} \) and \( \delta = \text{int} \). The
    non-constrained variables are then generalizable (with certain conditions), and
    contribute to establishing the polymorphism of the type.


    Proving that a constraint \( \tau_1 = \tau_2 \) is satisfied requires the ability
    to replace certain variables in the left and/or right of the equals sign with
    types, which may themselves contain their own variables. In other words, a substitution
    \( \theta \) must exist such that \( \theta(\tau_1) = \theta(\tau_2) \). Determining
    whether such a substitution exists is known as a type unification problem. If
    this substitution exists, then \( \tau_1 \) and \( \tau_2 \) are said to be *unifiable*,
    and substitution \( \theta \) is said to be an *unifier* of terms \( \tau_1 \)
    and \( \tau_2 \). Thus, two terms are unifiable if all or part of their variables
    can be instantiated by the same substitution in a way which makes them structurally
    equal.


    As several types may be assigned to an expression, several substitutions may exist
    to identify two terms (this is the reason for type plurality). Consider the two
    terms \( \tau_1 = \alpha \rightarrow \beta \) and \( \tau_2 = \alpha \rightarrow
    \text{bool} \). The two substitutions \( \theta_1 = [\alpha \leftarrow \text{int};
    \beta \leftarrow \text{bool}] \) and \( \theta_2 = [\beta \leftarrow \text{bool}]
    \) are unifiers of \( \tau_1 \) and \( \tau_2 \) since \( \theta_1(\tau_1) = \theta_1(\tau_2)
    = \text{int} \rightarrow \text{bool} \) and \( \theta_2(\tau_1) = \theta_2(\tau_2)
    = \alpha \rightarrow \text{bool} \).'

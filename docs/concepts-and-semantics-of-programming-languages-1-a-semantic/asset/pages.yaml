  md: 'evaluation of the body of the functional value returns the value of this application.
    In the expression “(1 2)”, the constant 1 is not a function, and therefore has
    no body; this application cannot be evaluated.


    In mathematics, an equality is a binary relation defined over elements of a same
    set. As the semantics of Exp₂ is defined mathematically, ℤ and IB are two disjoint
    sets, and their elements cannot be compared. For example, the semantics of the
    expression 1 = false is undefined. Some languages get rid of this link with mathematics.
    For example, in Python there is a defined equality relation between integers in
    booleans. For example, 1 = false is evaluated as false, while 1 = true is evaluated
    as true but 42 = true is evaluated as false. This holds true for other relational
    operators, so, for example, true < 2 is evaluated as true in Python.


    There are several possible semantics for an equality between functions such as
    f = g. It is best to avoid testing equalities of this kind in programs, as the
    results are often unpredictable. If the domains or codomains of f and g are different,
    they clearly cannot be equal. Their types will be said to be “incompatible” (a
    notion which will be discussed later). However, equalities between two functions
    with the same domain and codomain are often used in mathematics, for example,
    in the following statement: “If two functions f and g over reals verify f = g,
    then ∫ᵇₐ f(t)dt = ∫ᵇₐ g(t)dt”. To use this theorem, we first need to prove that
    f = g. The evaluation of this expression along program execution requires an algorithm,
    either written in the source code or imported from a library, which is able to
    prove that, for any value x of the domain of f and g, the equality f(x) = g(x)
    is true. At the beginning of the 20th century, logicians proved that there can
    be no general algorithm for determining whether any two functions are “identical”
    in a finite time. The problem of equality of functions is said to be undecidable.
    If the domain is finite, then it is still possible to find an adapted algorithm,
    but the time required to execute it depends on the number of elements in the domain.
    In Exp₂, no semantics is assigned to equalities between functions as the meaning
    of these equalities heavily depends on the domain of the functions. Proving the
    equality of two functions over the set of booleans is easy. On the other hand,
    proving the equality of two functions over the set of integers (restricted to
    integers representable in the memory) may take some time. Nevertheless, for a
    variety of reasons, the designers of certain programming languages have chosen
    to allow function equality tests. The semantics assigned to an expression f =
    g are consequently rather ad hoc. One version involves the syntactic equality
    of definitions: x ↦ x + 2 is equal to itself, but is not equal to x ↦ 1 + x +
    1, nor to x ↦ 2 + x or to y ↦ y + 2. Another option focuses on the equality of
    the locations of the codes for f and g in the memory after the compilation.


    We encourage readers who use a language that tests function equality to consult
    the relevant reference manual concerning the meaning assigned to f = g. However,
    we do not advise using expressions of this kind.'

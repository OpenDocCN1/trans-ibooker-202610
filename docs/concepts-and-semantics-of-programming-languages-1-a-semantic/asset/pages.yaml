    # 2.3. Definition and assignment


    # 2.3.1. Defining an identifier


    The language Def1 extends Exp1 by adding definitions of identifiers. There are
    two constructs that make it possible to introduce an identifier naming a mutable
    or non-mutable variable (as defined in section 2.1.3). Note that, in both cases,
    the initial value must be provided. This value corresponds to a constant or to
    the result of a computation specified by an expression \( e \in \mathbf{Exp}_1
    \). These constructs modify the current state of the system; after computing \(
    [[e]]^{\text{Mem}}_{\text{Env}} \), the next step in evaluating \(\text{let }
    x = e;\) is to add the binding \( (x, [[e]]^{\text{Mem}}_{\text{Env}}) \) to the
    environment, while the evaluation of \(\text{var } x = e;\) adds a binding \(
    (x, r_x) \) to the environment and writes the value \( [[e]]^{\text{Mem}}_{\text{Env}}
    \) to the reference \( r_x \). In this case, we assume that the location denoted
    by the reference \( r_x \) is computed by an external mechanism responsible for
    memory allocation.


    | d ::= | let x = e; | Definition of a non-mutable variable | (x \in \mathbf{X},
    e \in \mathbf{Exp}_1) |

    | | var x = e; | Definition of a mutable variable | (x \in \mathbf{X}, e \in \mathbf{Exp}_1)
    |


    Table 2.3. Language Def1 of definitions


    The evaluation of a definition is expressed as follows:


    (\text{Env}, \text{Mem}) \xrightarrow{\text{let } x = e;}_{\text{Def}_1} ((x,
    [[e]]^{\text{Mem}}_{\text{Env}}) \oplus \text{Env}, \text{Mem}) \quad \text{[2.1]}

    (\text{Env}, \text{Mem}) \xrightarrow{\text{var } x = e;}_{\text{Def}_1} ((x,
    r_x) \oplus \text{Env}, \text{Mem}[r_x := [[e]]^{\text{Mem}}_{\text{Env}}])


    This evaluation \(\rightarrow_{\text{Def}_1}\) defines a relation between a state,
    a definition and a resulting state, or, in formal terms:


    \(\rightarrow_{\text{Def}_1} \subseteq (\mathbf{E} \times \mathbf{M}) \times \text{Def}_1
    \times (\mathbf{E} \times \mathbf{M})\)


    Starting with a finite sequence of definitions \(\mathbf{d} = [d_1; \dots ; d_n]\)
    and an initial state \((\text{Env}_0, \text{Mem}_0)\), this relation produces
    the state \((\text{Env}_n, \text{Mem}_n)\):


    \((\text{Env}_0, \text{Mem}_0) \xrightarrow{d_1}_{\text{Def}_1} (\text{Env}_1,
    \text{Mem}_1) \xrightarrow{d_2}_{\text{Def}_1} \cdots \xrightarrow{d_n}_{\text{Def}_1}
    (\text{Env}_n, \text{Mem}_n)\)'

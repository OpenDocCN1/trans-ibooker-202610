  md: "The function filter, used to check if a pattern p matches a value v, is defined\
    \ by recursively comparing the structures of p and v. It calls a function filter’\
    \ using an empty initial substitution. The substitution that is used as input\
    \ for filter’ accumulates the bindings created by the comparison between the pattern\
    \ and the value. Box 6.1 shows the definition of these two functions, providing\
    \ only nominal cases. The matching process implicitly fails on all other cases.\n\
    \n```\nx \notin dom(phi)\nfilter'(phi, x, v) = phi \\oplus (x, v)           phi(x)\
    \ = v\nfilter'(phi, x, v) = phi\n\nphi1 = filter'(phi, p1, v1)   ...   phi_n =\
    \ filter'(phi_{n-1}, p_n, v_n)\nfilter'(phi, C(p1, ..., pn), C(v1, ..., vn)) =\
    \ phi_n\n\nfilter(p, v) = filter'(empty, p, v)\n```\n\n# Box 6.1. Matching function\n\
    \nThe rules of the operational semantics are shown in Box 6.2 and use the matching\
    \ function of Box 6.1. The rule E_match1 corresponds to the case where the first\
    \ pattern p matches the value v of the expression e, returning a substitution\
    \ phi. It is interesting to note that the structures of a substitution and an\
    \ environment are identical, that is, lists of associations of a variable and\
    \ a value. Thus, we may extend the environment with the substitution phi returned\
    \ by filter to evaluate e1, the expression associated with the first pattern.\
    \ The rule E_match2 corresponds to the case where the first pattern does not match\

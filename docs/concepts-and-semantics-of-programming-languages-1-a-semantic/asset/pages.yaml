    \ : ('a * 'b) list -> 'a -> 'b -> ('a * 'b) list\n```\n\n# ### 2.1.2. Memory\n\
    \nThe formal model of the memory presented below makes no distinction between\
    \ the different varieties of physical memory described in Chapter 1. The state\
    \ of the memory is described by associating a value with the location of the cell\
    \ in which it is stored. The locations themselves are considered as values, called\
    \ references. As we have seen, high-level languages allow us to name a location\
    \ c, containing a value v, by an identifier x bound to the reference r of c.\n\
    \nLet \\(\\mathbf{R}\\) be a set of references and \\(\\mathbf{V}\\) a set of\
    \ values. The association of a reference \\(r \\in \\mathbf{R}\\) with a value\
    \ \\(v \\in \\mathbf{V}\\) is represented by a pair \\((r,v)\\), and a set Mem\
    \ of such pairs is called here a memory. Mem(r) denotes the value stored at the\
    \ reference r in Mem. Let M be the set of memories. In practice, the set of references,\

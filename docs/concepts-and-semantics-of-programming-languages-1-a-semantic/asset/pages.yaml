  md: '# 5.1. Type checking: when and how?


    In the examples presented at the start of this chapter, we referred to the notion
    of

    a mathematical set while explaining why certain expressions should be rejected.
    For

    reasons issued from mathematical logical studies, this notion of “set” is replaced
    by

    the notion of *type* in programming languages studies.


    In a typed language, all expressions have a type, as do the functions themselves.

    For example, the addition of integers is a function, of which the parameters are
    two

    integers and the result is an integer. The addition of floating point numbers
    (called

    floats) is a function, of which the parameters and result are floats. However,
    the two

    additions cannot use the same algorithm as the internal representations of integers

    and floating points in memory are totally different: the structure of their encodings

    is different and the bits do not have the same meaning. To evaluate the expression

    3 + 4.5, for example, we must first determine which algorithm to use for the addition.

    Some strongly typed languages reject this expression as it is “ill-typed”. Some
    others

    will accept it but 3 will be considered as a floating point value. Such conversions

    often remain implicit; at best, they can lead to programs, which are difficult
    to understand,

    and at worst, they can lead to execution errors, which can be hard to detect.
    These

    implicit conversions are hard to take into account in typing rules.


    Typechecking a program consists of verifying that the construction of all its

    expressions respect the rules of well-formedness regarding types, which are called

    the *typing rules*. If the typing rules are well designed, a well-typed program
    can be

    shown to be *consistent*, that is, any execution of this program, if it does not
    loop,

    provides a result of the type given by the typechecking. In this case, the language
    in

    question is said to be *strongly typed*. If a type system does not guarantee this

    property, it is said to be *weakly typed*. This is the case, for example, when
    a system

    permits explicit conversions between types: programmers can force the compiler
    to

    consider that the type of an expression is arbitrarily different from the one
    declared or

    computed by the compiler itself.


    Typechecking significantly reduces the risk of writing and executing incorrect

    programs. The type language and the typing rules of the expressions of a language

    define the *typing semantics* of this language, which is formally studied in this
    chapter.


    # 5.1.1. When to verify types?


    There are two possible typechecking mechanisms. The first consists of verifying

    types during the execution of the program and determining whether execution can

    safely go on or whether a runtime error will occur. This semantics, known as

    *dynamic typing*, interacts with the dynamic execution semantics of the language.


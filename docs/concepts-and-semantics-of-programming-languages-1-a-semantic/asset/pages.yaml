  md: '# 7.6. Memory management


    In this section, we shall discuss memory allocation and disallocation using manual
    or automatic approaches. In high-level languages, data are stored in the memory
    by the execution process, without direct intervention from the developer. In certain
    languages, developers also have the option to use lower level features to obtain
    full or partial control over memory storage. A relatively brief presentation of
    memory management by the execution process, sometimes with the participation of
    the programmer, is now discussed.


    # 7.6.1. Memory allocation


    When a compiler analyzes the definition of a variable, it assigns an area of memory
    in which to store the value bound to this variable. This operation is known as
    _memory allocation_. For variables, and arrays whose size can be determined at
    compile-time, the memory requirements are known and the allocation can be planned
    during the compilation. This is known as _static allocation_.


    In example 7.13, the size of variables i and s cannot vary from one execution
    to the next: their allocation is static.


    ```

    EXAMPLE 7.13.--

    C

    int i = 42 ;

    char s[20] ;

    ```


    # 7.6.1.1. Dynamic allocation


    In other cases, the quantity of memory required for all possible executions of
    a program cannot be determined in advance. For example, the designers of the text
    editor used to write this book had no means of knowing how many characters each
    text file would contain, meaning that they had no knowledge of the amount of memory
    required during the writing process. In other words, memory requirements are unknown
    at compile-time.


    The programmer can certainly reserve a “fairly large” amount of memory (for example
    using a very large array), and say to themselves that “that will be enough”. This
    solution is unsatisfactory for several reasons. First of all, when an execution
    uses less memory than expected at the time of allocation, the unused space cannot
    be used for the execution of another program. Recall that, as a resource, memory
    is shared by all programs, and its size is necessarily limited. Then, if the default
    memory allocation is insufficient, all that remains is to modify the source code
    to request a larger size. This is unacceptable because, on the one hand, a software
    user'

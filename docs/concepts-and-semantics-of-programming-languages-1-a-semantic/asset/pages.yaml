    \ the head of the list representing the memory. The function below carries out\
    \ this operation and returns a pair made up of the new reference and the list\
    \ representing the new memory.\n\n```\nPython\ndef add_add_mem(mem,v):\n    if\
    \ len(mem) == 0: return (0,[(0,v)])\n    else:\n        n1,v1 = mem[0]\n     \
    \   return (n1+1,[(n1+1,v)]+mem)\n```\n\n```\nOCaml\nlet add_mem mem v = match\
    \ mem with\n| [] -> (0, [(0, v)])\n| (n1, v1) :: mem1 -> (n1 + 1, ((n1 + 1), v)\
    \ :: mem)\nval add_mem : (int * 'a) list -> 'a -> int * (int * 'a) list\n```\n\

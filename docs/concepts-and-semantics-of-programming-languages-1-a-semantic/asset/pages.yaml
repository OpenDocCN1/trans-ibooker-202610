  md: 'Using type abbreviations also makes code easier to read and maintain. Consider
    a function for which the inputs are a pressure and a speed, and which returns
    a power order for a machine. The type of this function is `float → float → float`.
    With this type, it is not possible to differentiate between the `float` numbers
    representing these different kinds of values, and the type of the function provides
    no semantical information on its arguments. The introduction of three type abbreviations,
    as shown in example 6.21, allows a more informative function type.


    # EXAMPLE 6.21.-


    ```

    OCaml

    # type pressure_t = float ;;

    type pressure_t = float

    # type speed_t = float ;;

    type speed_t = float

    # type command_t = float ;;

    type command_t = float

    # let regulate (p : pressure_t) (s : speed_t) : command_t = ... ;;

    val regulate : pressure_t -> speed_t -> command_t = <fun>

    ```


    In many languages, such as C, C++ and OCaml, type abbreviations do not imply nominal
    typing. An alias remains equal to the body of its definition. This makes it possible
    to define a variable p of type pressure_t and a variable s of type speed_t, and
    to compare them or use the operator + . of type float → float → float, as shown
    in example 6.22.


    # EXAMPLE 6.22.-


    ```

    OCaml

    # let p : pressure_t = 2.0 ;;

    val p : pressure_t = 2.

    # let s : speed_t = 25.0 ;;

    val s : speed_t = 25.

    # p +. 2.5 = s ;;

    - : bool = false

    ```


    # 6.4.2. Records


    An individual person may be characterized by data including their surname, first
    name and date of birth. Surnames and first names are strings, whereas a date of
    birth is composed of three integers. As these data elements are of different types,
    they cannot be stored in an array. The notion of a record (or structure) is used
    to aggregate data of different types within a single type.


    Each data element is named and represents a field of the record. Each field is
    thus assigned the type corresponding to the data element, which it is intended
    to contain. The definition of a record type is given by the name of the type and
    the enumeration of the field names, along with their respective types.'

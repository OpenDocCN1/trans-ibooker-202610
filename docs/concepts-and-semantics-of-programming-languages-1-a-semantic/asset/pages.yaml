- pgno: 194
  md: '# Data Types


    # 6.1. Basic types


    The languages Exp2, ..., Lang3 that we used to describe the notions of semantics
    and typing only consider two data types: integers and booleans. However, most
    programming languages include many more basic types. In this section, we shall
    present the most widespread data types, along with the ways in which they differ
    between languages.


    # 6.1.1. Booleans


    For certain languages, such as OCaml, Java, Ada and Pascal, the boolean type bool
    is a constructor of the type algebra and has two possible values: true and false.
    Other languages, such as C and C++, encode boolean values as integers, with a
    value of 0 conventionally used to mean “false” and any other value corresponding
    to “true”. Some of these languages, such as C++, include a type bool and predefined
    identifiers false and true but these values are fully compatible with integer
    values. Any integer expression may be used as the condition for a loop or an if-then-else.
    Any boolean expression may be used as an index in an array, or as an operand in
    an arithmetic operation. This makes the source text harder to understand and may
    lead to errors, which are difficult to detect.


    Python behaves somewhat differently. It supplies two values, True and False, but
    allows integers and booleans to be mixed. It is thus possible to test whether
    or not an integer value is equal or different to a boolean value, or to use an
    integer value as the test for a condition. These practices are not recommended,
    see the examples given in the following. Remember that an integer, such as the
    value 2 in example 6.1, may be the result of evaluating a more complex expression.
    If using this value 2 as a boolean leads to an execution error, it may be difficult
    to retrieve its origin in the source code.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# EXAMPLE 6.1.--


    ```

    $ python3.7

    >>> 0 == True

    False

    >>> 0 == False

    True

    >>> 1 == True

    True

    >>> 1 == False

    False

    >>> 2 == True

    False

    >>> 2 == False

    False

    ```


    Example 6.1 shows that version 3.7 of Python interprets False as the value 0 and
    True as the value 1. It is interesting to note that the value 2 (or any other
    value which is not 0 or 1) is neither True nor False. Thus, the two expressions
    in example 6.2 – which have identical intuitive semantics – give different results.


    # EXAMPLE 6.2.--


    ```

    >>> if 2 == True :

    ...     print ("2 == True")

    ... else :

    ...     print ("2 != True")

    ...

    2 != True

    >>> if 2 == False :

    ...     print ("2 != True")

    ... else :

    ...     print ("2 == True")

    ...

    2 == True

    ```


    As the tests 2 == True and 2 == False are both always false, these two expressions
    evaluate the else branch, displaying contradictory results. However, if we use
    the integer value 2 directly as a condition, the then branch will be evaluated,
    as if 2 was equivalent to True.


    # EXAMPLE 6.3.--


    ```

    >>> if 2 :

    ...     print ("Then branch")

    ... else :

    ...     print ("Else branch")

    ...

    Then branch

    ```'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# ### 6.1.2. Integers


    Given the finite size of a register, it is only possible to represent a finite
    number of binary configurations. As every integer is encoded in binary (base 2),
    a register can only encode a finite number of integers.


    For positive integers, the bit of rank n in a binary configuration represents
    the value 2^n. The value of the integer encoded by a binary configuration is the
    sum of its powers. For example, the configuration 01100101 over 8 bits corresponds
    to 2^6+2^5+2^2+2^0 = 101.


    Positive and negative integers are differentiated by the use of a sign bit, which
    is the most significant bit (MSB) in the binary representation of the integer.
    Furthermore, negative integers are encoded using two''s complement. To obtain
    the opposite of a positive number, we invert the bits of the binary representation
    of the absolute value and then add 1 to the result. Thus, the value 4 is represented
    over 4 bits as 0100, and the value – 4 is represented as 1100. This encoding guarantees
    the uniqueness of the value 0 and provides an addition instruction, which is not
    dependent on the signs of the operands.


    # ### 6.1.2.1. Size of integers


    Up to this point, we have only used one integer type, int, representing relative
    integers. Some languages, such as C, C++ and Java, include several integer types:
    char, short, long, long long and int. These differ in terms of the number of bits
    used to encode values. In Java, the number of bits for each integer type is clearly
    specified; in C, however, successive versions of the standard simply indicate
    a minimum size for each integer type. The values of int in C/C++ are generally
    coded over 32 bits and those of long int are coded over 64 bits, at least in current
    architectures.


    | Java | Bits | C/C++ | Bits |

    | :--- | :--- | :--- | :--- |

    | byte | 8 | char | ≥ 8 |

    | short | 16 | short (int) | ≥ 16 |

    | int | 32 | int | ≥ 16 |

    | long | 64 | long (int) | ≥ 32 |

    | | | long long (int) | ≥ 64 |


    # **Table 6.1. Integer size by language**


    In other languages, such as OCaml or Python 3 (Python 2 permitted the specification
    of long), integer size cannot be specified, and is set by the standard of the
    language. In any case, users should keep integer size in mind in order to avoid
    certain errors.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# 6.1.2.2. Signed and unsigned integers


    Working in C and C++, programmers may choose to work with signed integers (used
    to represent relative integers) or unsigned integers (used to represent natural
    numbers). This choice defines the way the MSB is used. For signed integers, this
    bit is used for the sign, using two’s complement encoding. For unsigned integers,
    this bit is used in the same way as the others to encode values. This choice is
    not available in OCaml, Java and Python, where integers are always signed.


    The range of data that may be represented by an integer type depends on the presence
    of a sign and on the number of bits assigned to the type. This is presented in
    Table 6.2.


    | Bits | Sign | Min | Max |

    |---|---|---|---|

    | 8 | No | 0 | 255 ($2^8 - 1$) |


    5) is:


    (T_var) α ≤ α

    ----------------

    (x, ∀θ, α) ⊕ Env ⊢ x : α

    (T_var) β → β ≤ int → int

    Env'' ⊢ 5 : int

    ----------------

    (T_app) ...

    (T_let) Env ⊢ let f = fun x -> x in (f 5) : int


    # 5.4. Type inference algorithm in Exp2


    The rules presented in section 5.3 are used to verify the type of a program including
    type annotations. They also define the typing system of the language and, as we
    shall see in section 5.5, guarantee certain safety properties of well-typed programs.
    In this section, we describe an algorithm that generates types from expressions
    in a program. By extension, this inference algorithm can also be used to check
    whether a program is well-typed. Obviously, the type inference algorithm must
    be correct with regard to the type system and the associated rules. The advantage
    of type inference lies in the fact that programmers do not have to provide explicit
    type annotation within programs.


    # 5.4.1. Principal type


    The type inference algorithm is described formally by a set of rules. These rules
    establish the fact that, in a typing environment Env, an expression e is of type
    τ when a set of constraints described by a substitution θ over the types can be
    satisfied (for example, this set of constraints must not require a type variable
    α to be equal to both int and bool). This is noted Env ⊢ e ▷ (τ, θ).


    Furthermore, in case of polymorphism, the type τ computed by this algorithm must
    be as general as possible: it is called the principal type of e. For example,
    the type of fun x -> fun y -> (x y) is τ0 = (α → β) → α → β, but it could also
    be:


    +   τ1 : (int → int) → int → int

    +   τ2 : (int → bool) → int → bool

    +   τ3 : (int → bool → int) → int → bool → int


    However, type τ0 is the most general, as it allows this expression to be used
    in the highest number of contexts. The other possible types all result from a
    substitution applied to τ0. For example, types τ1, τ2 and τ3 may be obtained in
    the following manner:


    +   τ1 = τ0[α ← int, β ← int]

    +   τ2 = τ0[α ← int, β ← bool]

    +   τ3 = τ0[α ← int, β ← (bool → int)]'

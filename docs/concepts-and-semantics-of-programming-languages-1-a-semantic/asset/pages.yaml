  md: '# # Semantics of Imperative Features


    This chapter presents the three classical semantic approaches to the most common
    imperative features of programming languages, as they are usually treated (see
    [NIE 07, WIN 93]).


    # ## 4.1. Syntax of a kernel of an imperative language


    We consider here a language, Lang₃, corresponding to the kernel of most imperative
    languages. It allows explicit handling of _references_ of locations, i.e. memory
    addresses. This language is built from two languages: Def₃ for definitions and
    Exp₃ for expressions. Both are variations of languages Def₁ and Exp₁, introduced
    in Chapter 2. The language Def₃, defined in Table 4.1, contains a single construct
    that introduces a binding into an execution environment.


    | d ::= let x = e; | definition of a non-mutable variable (x ∈ X, e ∈ Exp₃) |


    # **Table 4.1.** _Language of definitions_ Def₃


    The language Exp₃, used for expressions, aims at manipulating values and modifying
    the memory by allocating locations for new values. The syntax of Exp₃ is presented
    in Table 4.2.


    +   Thus, an expression e ∈ Exp₃ is either:

    +   - a constant k ∈ K = Z ∪ IB;

    +   - an identifier x ∈ X;

    +   - an expression obtained by applying a unary (or binary) operator to an expression
    (or two expressions);'

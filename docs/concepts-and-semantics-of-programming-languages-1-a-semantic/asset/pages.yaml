  md: 'NOTE.- When the result of the evaluation of an expression depends on the choice
    of implementation used by the compiler to evaluate subexpressions, the expression
    itself is considered to be semantically incorrect. The value associated with the
    expression depends on the compiler. The reference handbooks of certain programming
    languages detail these situations.


    Operational semantics allows us to safely ignore certain constraints, such as
    the order of evaluation of arguments in an operator. For example, a compiler designer
    may prefer not to follow an imposed order for argument computation, often for
    reasons relating to optimization. The obligations of a compiler may be specified
    by using a semantics that establishes the meaning of constructs in a language,
    while maintaining a degree of freedom regarding certain implementation choices.
    The evaluation order for arguments of a commutative binary operator may, for example,
    be left unspecified in the semantics. This means that several different values
    may be associated with the same expression, for example if the semantics contains
    the two rules R1 and R2 defined above.



- pgno: 171
  md: 'A _principal unifier_, also often called a _most general unifier_, of \(\tau_1\)
    and \(\tau_2\) is a substitution \(\mu\) such that, for any other unifier \(\theta\),
    \(\theta(\tau_1)\) is an instance of \(\mu(\tau_1)\), i.e. \(\theta(\tau_1)\)
    can be obtained by applying a substitution \(\theta''\) to \(\mu(\tau_1)\). This
    is essentially the same as saying that the principal unifier \(\mu\) is a minimal
    substitution, and thus all other unifiers \(\theta\) include this substitution
    and can be written as \(\theta = \theta'' \circ \mu\). In the previous example,
    \(\theta_2\) is a principal unifier, whereas \(\theta_1\) is not. In this case,
    we have \(\theta_1 = [\alpha \leftarrow \text{int}] \circ \theta_2\).


    The principal unifier of two types \(\tau_1\) and \(\tau_2\) is computed by solving
    the system of equations \(\{\tau_1 = \tau_2\}\). The unification algorithm Mgu
    presented in section 5.4.2 can be used to solve systems of this kind. It takes
    a set \(Q\) of equalities between types, called _constraints_, as an argument.
    The solution of a system \(Q\), when it exists, is a substitution \(\theta\) such
    that, for every equation \(\tau_1 = \tau_2\) in \(Q\), we have \(\theta(\tau_1)
    = \theta(\tau_2)\). This algorithm is recursive and computes the most general
    unifier of system \(Q\). The system \(Q[\alpha \leftarrow \tau]\) denotes the
    system \(Q\) in which \(\alpha\) is replaced by \(\tau\) in every equation. If
    none of the listed cases apply, the operation fails, triggering the failure of
    the type inference process. Notably, if one member of an equality is a variable,
    the other cannot be a type containing this variable (unless it is itself a variable).
    This constraint is needed to avoid infinite looping over problems of the form
    Mgu (\(\{\alpha = \text{int} \to \alpha\}\)) for which there is no type of finite
    size which solves this equation. If \(\alpha = \text{int} \to \alpha\), we have
    \(\alpha = \text{int} \to \text{int} \to \alpha\), \(\alpha = \text{int} \to \text{int}
    \to \text{int} \to \alpha\), and so on.


    ```

    Mgu (∅) = id

    Mgu ({α = α} ∪ Q) = Mgu (Q)

    Mgu ({α = τ} ∪ Q) = Mgu (Q[α ← τ]) ◦ [α ← τ] if α ∉ F(τ)

    Mgu ({τ = α} ∪ Q) = Mgu (Q[α ← τ]) ◦ [α ← τ] if α ∉ F(τ)

    Mgu ({int = int} ∪ Q) = Mgu (Q)

    Mgu ({bool = bool} ∪ Q) = Mgu (Q)

    Mgu ({τ₁ → τ''₁ = τ₂ → τ''₂} ∪ Q) = Mgu ({τ₁ = τ₂; τ''₁ = τ''₂} ∪ Q)

    ```


    # Box 5.2. Type unification algorithm for Exp\(_2\)


    EXAMPLE 5.3.- Let us compute the principal unifier of \(\tau_1 = \alpha_1 \to
    (\alpha_2 \to \text{int})\) and \(\tau_2 = \text{int} \to (\alpha_3 \to \alpha_1)\).


    ```

    Mgu ({\alpha_1 \to (\alpha_2 \to \text{int}) = \text{int} \to (\alpha_3 \to \alpha_1)})

    = Mgu ({\alpha_1 = \text{int}; \alpha_2 \to \text{int} = \alpha_3 \to \alpha_1})

    = Mgu ({\alpha_2 \to \text{int} = \alpha_3 \to \text{int}}) \circ [\alpha_1 \leftarrow
    \text{int}]

    = Mgu ({\alpha_2 = \alpha_3; \text{int} = \text{int}}) \circ [\alpha_1 \leftarrow
    \text{int}]

    = Mgu ({\text{int} = \text{int}}) \circ [\alpha_2 \leftarrow \alpha_3] \circ [\alpha_1
    \leftarrow \text{int}]

    = Mgu (\emptyset) \circ [\alpha_2 \leftarrow \alpha_3] \circ [\alpha_1 \leftarrow
    \text{int}]

    = \text{id} \circ [\alpha_2 \leftarrow \alpha_3] \circ [\alpha_1 \leftarrow \text{int}]

    = [\alpha_2 \leftarrow \alpha_3; \alpha_1 \leftarrow \text{int}] = \theta

    ```'

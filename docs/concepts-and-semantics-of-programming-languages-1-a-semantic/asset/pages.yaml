  md: 'principality. Termination guarantees that the type of an expression will be
    inferred in a finite period of time (the compiler will not enter into an infinite
    loop). The algorithm is correct if, for a given expression e and a typing environment
    Env, it returns a type which is correct with respect to the typing rules set out
    in Box 5.1. This correctness means that the inference algorithm will not produce
    wrong results. Completeness means that if a type exists for a given expression
    e and a typing environment Env, then it will be found by the algorithm: in other
    words, the algorithm will not “miss” a solution. Principality guarantees that
    the algorithm will always compute the most general type, in the sense presented
    in section 5.4.


    PROPOSITION 5.2.– Correctness of the inference algorithm: if Env ⊢ e ▷ (τ, θ),
    then θ(Env) ⊢ e : τ.


    PROPOSITION 5.3.– Completeness and principality of the inference: let Env be an
    environment and e an expression. If there exists a substitution θ′ and a type
    τ′ such that θ′(Env) ⊢ e : τ′, then Env ⊢ e ▷ (τ, θ) and there exists a substitution
    θ″ such that τ′ = θ″(τ) and θ′ = θ″ ◦ θ.


    # 5.6. Typechecking of imperative constructs


    To introduce typechecking of imperative languages, we shall define rules for the
    language Lang3 introduced in Chapter 4, extended using the block structure (see
    section 4.6.1). The type system given here is not an extension of the rules shown
    in Box 5.1, as we are not considering functional features, only mutable variables.
    We thus need to type the language of definitions (given in Table 4.1), the language
    of expressions (given in Table 4.2) and the instructions (described in Table 4.3).
    For reasons of simplicity, the same symbol will be used to denote all three typing
    relations.


    # 5.6.1. Type algebra


    As references belong to the set of values, they must be assigned a type, which
    is called ref. To handle, in a consistent manner, the value stored at the address
    denoted by a reference, the type ref must also indicate the type of the referenced
    value. The kernel of Lang3 contains no function nor polymorphism and only integer
    and boolean constants; the type algebra is thus very simple. This algebra, presented
    in Table 5.2, contains an integer type int, a boolean type bool and a type of
    references on a value of type τ, denoted as τ ref.


    As polymorphism is not considered, the typing environment does not bind identifiers
    to type schemes, but simply to types.'

  md: 'Now, let us consider the case of mutually recursive functions. For example,
    the following functions determine the parity of an integer:


    ```

    rec even n = if n = 0 then true else odd(n - 1)

    rec odd n = if n = 0 then false else even(n - 1)

    ```


    The body of function even contains a call to function odd, of which the body also
    contains a call to function even. These two functions are said to be mutually
    recursive, and some programming languages use a syntactic construct to express
    this form of dependency between two functions. When two functions are mutually
    recursive, it is impossible to give them two independent values: for example,
    the definition environment contained in the closure associated with function even
    must contain a binding for function odd and vice versa. One simple way of solving
    this problem is to handle it syntactically. For example, the construct


    ```

    let_rec f x = e_f and g y = e_g;

    ```


    can be used to define two mutually recursive functions f and g. Evaluation of
    this construct simultaneously adds the bindings of f and g to the current environment.


    Considering the approach presented at the start of this section for closures,
    the evaluation of these definitions extends the current environment ENV as follows:


    ```

    (g, G) ⊕ (f, F) ⊕ ENV with

    F = ⟨x, ef, (g, G) ⊕ (f, F) ⊕ ENV⟩

    G = ⟨y, eg, (g, G) ⊕ (f, F) ⊕ ENV⟩

    ```


    # 3.3.4. Call-by-name


    DEFINITION 3.2.– Call-by-name: the call-by-name mechanism defines a strategy for
    evaluating function applications and other expressions. The subexpressions of
    an expression e will only be evaluated if their values are needed for the evaluation
    of e.


    To evaluate (fe), we evaluate f in the current environment ENV. The expression
    e is only evaluated if the evaluation of the body of f in the definition environment
    Envf of f requires a value for e in ENV. The pair [e, ENV], called a frozen expression,
    must therefore be retained. An environment thus becomes a list of associations,
    where the elements are pairs (x, [e, ENVe]), where x is a “frozen” variable, e
    is the expression defining x and ENVe is the environment in which e is to be evaluated:


    ```

    ENV = [(x1, [e1, ENVe1]), ..., (xn, [en, ENVen])]

    ```


    The notion of closure is thus generalized to all expressions, not only functions.


    Big-step operational semantics with the call-by-name strategy is defined in Box
    3.2 and Box 3.4. The evaluation rules for simple expressions, defined in Box 3.2,'

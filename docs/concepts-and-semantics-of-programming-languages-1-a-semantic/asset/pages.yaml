    # 3.3. Execution semantics: operational semantics


    Operational semantics describes the specification of a language’s compiler through
    a set of inference rules as:


    \( (R) \frac{h_1 \cdots h_n}{c} (I) \)


    This rule, named \( R \), means that, if hypotheses \( h_1, \cdots, h_n \) are
    true, we can deduce \( c \), or, in an equivalent form, that \( c \) can be deduced
    by establishing \( h_1, \cdots, h_n \). \( I \) corresponds to additional information
    (condition for application of the rule, or intermediate computation). For example,
    consider a rule specifying the evaluation of the addition of two expressions:


    \( (R) \frac{\text{Env} \vdash e_1 \rightsquigarrow v_1 \quad \text{Env} \vdash
    e_2 \rightsquigarrow v_2}{\text{Env} \vdash e_1 + e_2 \rightsquigarrow v} (v =
    v_1 + v_2) \)


    In this case, \( \text{Env} \vdash e \rightsquigarrow v \) expresses the fact
    that, in environment Env, the evaluation of expression \( e \) returns a value
    \( v \). The order of evaluation of \( e_1 \) and \( e_2 \) is not specified,
    and the two rules below leave the choice of the error propagation to the (developer
    of the) compiler:


    \( (R_1) \frac{\text{Env} \vdash e_1 \rightsquigarrow v_1}{\text{Env} \vdash e_1
    + e_2 \rightsquigarrow v_1} (v_1 \in \text{IE}) \quad (R_2) \frac{\text{Env} \vdash
    e_2 \rightsquigarrow v_2}{\text{Env} \vdash e_1 + e_2 \rightsquigarrow v_2} (v_2
    \in \text{IE}) \)



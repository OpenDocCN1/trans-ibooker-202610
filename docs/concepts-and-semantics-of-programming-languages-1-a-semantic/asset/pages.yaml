    \ a v)\nval write_mem : ('a * 'b) list -> 'a -> 'b -> ('a * 'b) list\n```\n\n\
    # 2.1.3. State\n\nA state is defined as a pair $(\\text{Env}, \\text{Mem}) \\\
    in \\mathbf{E} \\times \\mathbf{M}$ such that any reference in the domain of Mem\
    \ is accessible from a binding in Env. A reference is said to be *accessible*\
    \ if its value can be read or written from an identifier contained in Env by a\
    \ series of operations of reading, writing, or reference manipulation.\n\nGiven\
    \ an environment Env, the set of identifiers **X** is partitioned into two subsets:\
    \ $\\mathbf{X}^{\\text{ref}}_{\\text{Env}}$, which contains the identifiers bound\
    \ to a reference, and $\\mathbf{X}^{\\text{cst}}_{\\text{Env}}$, which contains\
    \ the others:\n\n$\\mathbf{X}^{\\text{ref}}_{\\text{Env}} = \\{x \\in \\mathbf{X}\
    \ \\mid \\text{Env}(x) \\in \\mathbf{R}\\} \\qquad \\mathbf{X}^{\\text{cst}}_{\\\
    text{Env}} = \\{x \\in \\mathbf{X} \\mid \\text{Env}(x) \\in \\mathbf{V} \\setminus\
    \ \\mathbf{R}\\}$\n\nThe value associated with an identifier $x$ in $\\mathbf{X}^{\\\
    text{ref}}_{\\text{Env}}$ is a reference $\\text{Env}(x) = r$ where a value $\\\
    text{Mem}(r)$ is stored, which can be modified by writing. Identifiers of $\\\
    mathbf{X}^{\\text{ref}}_{\\text{Env}}$ are generally called *mutable variables*."

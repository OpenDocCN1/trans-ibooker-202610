  md: 'tree, in the case of big-step semantics, or by a transition sequence in the
    case of small-step semantics; the results obtained using the two approaches are
    identical. We now formally prove this semantic equivalence. We begin by proving
    the following lemma.


    LEMMA 4.1.- If \(\langle c_1 ; c_2, \text{Mem} \rangle \leftrightarrow^k_{\text{Env}}
    \text{Mem}''''\), then there exists \(\text{Mem}'' \in \mathbf{M}\) and two integers
    \(k_1\) and \(k_2\) such that \(\langle c_1, \text{Mem} \rangle \leftrightarrow^{k_1}_{\text{Env}}
    \text{Mem}''\) and \(\langle c_2, \text{Mem}'' \rangle \leftrightarrow^{k_2}_{\text{Env}}
    \text{Mem}''''\) with \(k = k_1 + k_2 + 1\).


    PROOF.- We proceed by induction over \(k\). If \(k=0\), the property is trivial
    (since in this case the hypothesis \(\langle c_1 ; c_2, \text{Mem} \rangle \leftrightarrow^0_{\text{Env}}
    \text{Mem}\) cannot be verified, since \(\langle c_1 ; c_2, \text{Mem} \rangle\)
    is not a terminal configuration). If \(k = k_0 + 1\), two cases are possible:


    +   1) If the transition sequence in the hypothesis is:


    \(\langle c_1 ; c_2, \text{Mem} \rangle \leftrightarrow_{\text{Env}} \langle c''_1
    ; c_2, \text{Mem}_1 \rangle \leftrightarrow_{\text{Env}} \dots \leftrightarrow_{\text{Env}}
    \langle \text{skip}, \text{Mem}'''' \rangle\)

    ⏐⏐⏐⏐⏐⏐⏐⏐⏐⏐⏐⏐⏐⏐⏐⏐⏐⏐ sequence of length \(k_0\)


    with \(\langle c_1, \text{Mem} \rangle \leftrightarrow_{\text{Env}} \langle c''_1,
    \text{Mem}_1 \rangle\), then, by induction hypothesis, there exists two integers
    \(k''_1\) and \(k''_2\) such that \(\langle c''_1, \text{Mem}_1 \rangle \leftrightarrow^{k''_1}_{\text{Env}}
    \text{Mem}''_1\) and \(\langle c_2, \text{Mem}''_1 \rangle \leftrightarrow^{k''_2}_{\text{Env}}
    \text{Mem}''''\) with \(k_0 = k''_1 + k''_2 + 1\). We construct the following
    sequence of length \(k''_1 + 1\):

    \(\langle c_1, \text{Mem} \rangle \leftrightarrow_{\text{Env}} \langle c''_1,
    \text{Mem}_1 \rangle \leftrightarrow^{k''_1}_{\text{Env}} \text{Mem}''_1\)


    which allows us to conclude with \(k_1 = k''_1 + 1\) and \(k_2 = k''_2\).


    +   2) If the transition sequence in the hypothesis is:


    \(\langle \text{skip} ; c_2, \text{Mem} \rangle \leftrightarrow_{\text{Env}} \langle

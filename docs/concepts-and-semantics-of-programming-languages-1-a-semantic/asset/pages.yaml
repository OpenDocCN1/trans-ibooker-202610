    # 4.6.2.2.2. Call by reference


    The call by reference mechanism transmits to the procedure a value, which is the
    reference of a mutable variable present in the current environment of the call.
    Using this mechanism, the syntactic construct of the procedure call in Lang3 is:


    call p(x)


    where x is a mutable variable in the calling environment. Its contents may be
    directly modified when executing the body of p.


    The formal definition of this mechanism is presented in Box 4.6. Unlike the call
    by value mechanism, where the parameter is considered as a variable that is local
    to the procedure, there is no allocation in this case. This mechanism will be
    discussed in more detail in section 7.4, where we explain its implementation using
    pointers.


    # 4.7. Other approaches


    Only small-step and big-step operational semantics have been considered up to
    this point. Both cases involve the definition of a transition relation, which
    characterizes the transformation of states resulting from program execution (and
    from the evaluation of expressions occurring in the program, as the selected expression
    language permits side-effects). In this section, we present two other classical
    approaches to the semantics of imperative languages. For the sake of simplicity,
    we suppose that the evaluation of expressions does not modify the states of the
    memory, and we write [[e]]Env Mem = v to express that the evaluation of e in a
    state (Env, Mem) returns the value v. We use the language Lang3 (without blocks
    and procedures), whose syntax is defined in Table 4.3.



  md: 'Instead of giving typing rules using natural language, we introduce a mathematical
    definition of the typing relation Env ⊢ e : τ, which expresses that, in a typing
    environment Env, the expression e is of type τ. To type an expression, we need
    a typing environment that associates a type scheme to each identifier, as we saw,
    in section 5.2.4, that a single expression may have several types issued from
    the same type scheme. In this case, each type is derived from a “skeleton” type
    scheme: this is the definition of polymorphism.


    # DEFINITION 5.1.- Type scheme: the syntax of a type scheme is defined by the
    following grammar: σ := ∀α1 ... αn.τ where τ is the body of the scheme and α1,
    ..., αn are the generalized variables.


    The order in which universally quantified variables αi appear in a scheme is not
    important. It is assumed that their names are all different. For example, ∀α1
    α2. α1 → α2 and ∀α2 α1. α1 → α2 denote the same scheme. Furthermore, two type
    schemes differing only by quantified variable names are considered to be identical
    (these schemes may also be said to be equivalent modulo α-conversion). For example,
    ∀α1 α2. α1 → α2 and ∀α3 α4. α3 → α4 denote the same scheme.


    A typing environment is represented by a list of bindings:


    Env = [(x1, σ1), · · · , (xn, σn)]


    where each identifier xi is bound to its type scheme σi.


    ```

    OCaml

    type scheme_t = (var_name_t list * type_t)

    ```


    A type scheme is encoded in OCaml as a pair, the first component being the list
    of generalized variables and the second component being the type representing
    the body of the scheme. Python does not permit type definitions, so an encoding
    in this language cannot be given. However, we use the same data structure in Python
    and OCaml (i.e. a pair in which the first component is a list). The representation
    of typing environments is similar to the one used for execution environments.
    The values bound to identifiers are simply replaced by type schemes.



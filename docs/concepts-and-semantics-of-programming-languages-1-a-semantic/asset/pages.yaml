- pgno: 29
  md: 'code for a virtual machine. In reality, interpreters rarely work directly on
    the tree; compilation to a virtual machine is often carried out as an intermediate
    stage. A virtual machine (VM) may be seen as a pseudo-microprocessor, with one
    or more stacks, registers and fairly high-level instructions. The code for a VM
    is often referred to as bytecode. In this case, compilation does not generate
    a file directly executable by the CPU. Execution is carried out by the virtual
    machine interpreter, a program supplied by the programming language environment.
    So, the difference between interpretation and compilation is not clear-cut.


    There are several advantages of using a VM: the compiler no longer needs to take
    the specificities of the CPU into account, the code is often more compact and
    portability is higher. As long as the executable file for the virtual machine
    interpreter is available on a computer, it will be possible to generate a binary
    file for the computer in question. The drawback to this approach is that the programs
    obtained in this way are often slower than programs compiled as “native” machine
    code.'

  md: 'where the function head (supposed to exist) returns the first element of a
    (non-empty) list. In this program, as the type of x is polymorphic, it is possible
    to assign x with any given list. The final instruction in the program is well-typed:
    x is of type (α list) ref, so ↓ x is of type α list, and so head returns a value
    of type α, the latter being instantiated in int in the addition expression. However,
    in practice, x contains a boolean value, so execution will necessarily raise an
    error, as addition is only defined for integers.


    Conversely, consider the following program:


    ```

    let f = fun x -> ^ x ;

    ```


    which creates a reference upon an input value. The type of the function f is α
    → α ref. The generalization of α is not problematic. Function f can be applied
    to a value of any type t, and will return a reference of type t ref, which is
    not polymorphic.


    One simple solution to this problem is to only generalize certain variables. The
    types of expressions that correspond to constants, variables or functions are
    generalized, and those of applications of functions or operators are not generalized.
    In the example above, in the declaration let x = ↑ [] ; the expression ↑ [] is
    an application of the operator ↑, hence the type α list ref should not be generalized.
    This solution relies on a syntactic criterion alone. Other methods have been developed
    (e.g. [LER 91, PIE 02]) to relax this restriction and increase the number of safe
    generalizations, but these lie outside the scope of this book.


    # 5.7. Subtyping and overloading


    Many languages offer extensions to the notion of type, designed to make the type
    algorithm accept expressions which it would otherwise reject. This increases flexibility
    when writing code, but makes it harder to review: in addition to typing rules,
    users must also master the rules of subtyping and overloading.


    Subtyping makes it possible to relax the constraint concerning the type t1 of
    the argument of a function, which may then be applied to an expression of type
    t2, as long as the values of type t2 share at least the characteristics of the
    values of type t1.


    Overloading enables the same name f to be used to denote different values (usually
    functions), leaving the typing algorithm to determine which binding to use for
    each occurrence of f in an expression. The aim, in this case, is to relax the
    constraint brought by the typing discipline: an identifier must have one, and
    only one, type.


    In this section, we provide a brief presentation of subtyping and overloading.
    These features will be discussed in greater detail in Volume 2, in Chapters 1
    and 3, with examples provided in Chapters 2 and 4.'

    # 6.1.2.5. Integer arithmetic


    We shall conclude our study of integers in computer science according to their
    characteristics in most programming languages by considering some properties of
    integer arithmetic in a mathematical context. Addition is a total operation over
    N, extended to a total operation over Z. Subtraction is not total over N (5 –
    25 cannot be computed in N) but becomes total in Z. The division encountered in
    N is the Euclidean division (with an integer quotient and remainder). The exact
    division operation is defined in Q.


    In practice, the passage from N to Z is generally implicit: “the temperature is
    10°, it falls by 25°, it is now – 15°”. This implicit passage from N to Z or from
    Z to R corresponds to a type change in computing. In N, the expression 1 / 4 denotes
    a Euclidean division with a result of 0, while in R, 1 / 4 is equal to 0.25. Ignoring
    these shifts between number sets can produce some surprising results: for example,
    (1 / 4) * 4 gives a result of 0, whereas (1 * 4) / 4 gives a result of 1. These
    results are perfectly correct, since in integer arithmetic / is used to denote
    Euclidean division. However, / is often interpreted implicitly as representing
    exact division, hence the surprise.


    When writing arithmetic expressions using integers, the order of evaluation of
    certain operations (such as multiplications and divisions) is essential, and should
    be specified using parentheses. Otherwise, in the expression 1 / 4 * 4, the compiler
    will choose to compute either the division or the multiplication first, depending
    on the implementation. Switching to another compiler may therefore lead to a change
    in the result and, possibly, an error. This error does not necessarily become
    apparent immediately: it may remain latent, giving the impression that the program
    is correct.



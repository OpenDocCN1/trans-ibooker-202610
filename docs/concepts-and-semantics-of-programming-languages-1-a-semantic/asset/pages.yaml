    # Solution to exercise 3.6


    We proceed by induction over e.


    +   - If e = k ∈ Z, then [[k[x ← e′]]]ENV = [[k]]ENV = k = [[k]]<sub>(x,[[e′]]ENV)⊕ENV</sub>


    +   - If e = z ∈ X, then if z = x we obtain:


    ```

    [[x[x ← e′]]]ENV = [[e′]]ENV = [[x]]<sub>(x,[[e′]]ENV)⊕ENV</sub>

    ```


    otherwise, if z ≠ x we obtain


    ```

    [[z[x ← e′]]]ENV = [[z]]ENV = ENV(z) = [[z]]<sub>(x,[[e′]]ENV)⊕ENV</sub>

    ```


    +   - If e = e1 op e2, then:


    ```

    [[(e1 op e2)[x ← e′]]]ENV

    = [[e1[x ← e′] op e2[x ← e′]]]ENV          (substitution)

    = [[e1[x ← e′]]]ENV OPV [[e2[x ← e′]]]ENV   (evaluation function)

    = [[e1]]<sub>(x,[[e′]]ENV)⊕ENV</sub> OPV [[e2]]<sub>(x,[[e′]]ENV)⊕ENV</sub> (induction
    hypothesis)

    = [[e1 op e2]]<sub>(x,[[e′]]ENV)⊕ENV</sub>   (evaluation function)

    ```


    # Solution to exercise 3.7


    1) The transition sequence is as follows:


    ```

    ⟨(z + (x - y)) * (x + 7), ENV⟩ ↔ ⟨(2 + (x - y)) * (x + 7), ENV⟩

    ↔ ⟨(2 + (1 - y)) * (x + 7), ENV⟩ → ⟨(2 + (1 - 3)) * (x + 7), ENV⟩

    ↔ ⟨(2 + -2) * (x + 7), ENV⟩ → ⟨0 * (x + 7), ENV⟩ ↔ ⟨0 * (1 + 7), ENV⟩

    ↔ ⟨0 * 8, ENV⟩ → ⟨0, ENV⟩

    ```


    2) a) We consider the lexicographic order ⊴ over IN × IN, defined from the order
    relation ≤ over IN:


    ```

    (n1, n2) ⊴ (n''1, n''2) if (n1 < n''1) or (n1 = n''1 and n2 ≤ n''2)

    ```'

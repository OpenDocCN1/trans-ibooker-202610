- pgno: 46
  md: 'NOTE.- In the presentation above, assignment concerns only mutable variables.
    Similarly, the dereferencing operator ! can only be applied to a reference to
    obtain the stored value at this location. Thus, the assignment of a value to a
    mutable variable from a given reference requires here the use of the dedicated
    syntactic structures: x := ! x + 1. However, in many languages, assignment does
    not explicitly mention the dereferencing operator, and the syntactic use of variables
    is identical on both sides of the assignment: x = x + 1. Hence, an identifier
    x denotes two different notions: the value Env(x) on the left of the assignment
    symbol, and the value Mem(Env(x)) on the right of the assignment symbol.


    These languages mask the different roles of a variable according to its position
    in the assignment. When a variable x is positioned to the left of the assignment,
    it is known as an l-value and it denotes a location where the value to be assigned
    should be stored. In this way, it acts as a pointer. The variable x on the right
    of the assignment is known as the r-value, and implicitly acts as a dereferenced
    pointer: the value to fetch is found at the location denoted by the variable.
    Thus, in the expression x = x + 1, even if x is used in the same way from a syntactic
    perspective, the instance on the right implicitly denotes !x. In some languages,
    variable declaration implicitly involves the creation of a reference, unless otherwise
    stated; the name of the variable represents the location where the compiler will
    store the values assigned to it.



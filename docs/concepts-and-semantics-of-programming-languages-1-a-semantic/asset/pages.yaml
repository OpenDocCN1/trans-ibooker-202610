    ```\n\nThe execution of a procedure is triggered by a call (also called an invocation)\
    \ to\nit. As in Chapter 3, where we describe the application of functions, there\
    \ are several\npossible choices for determining the state in which a procedure\
    \ should be executed.\n\nUsing a static (or lexical) scope mechanism, a procedure\
    \ is executed in the state\nin which it was defined (augmented with the binding\
    \ for its parameter), and the value\nassociated with the procedure is therefore\
    \ a closure containing its definition\nenvironment.\n\nUsing a dynamic scope mechanism,\
    \ a procedure is executed in the state in which\nthe call is done, and the value\
    \ associated with the procedure is therefore a closure\ncontaining only the name\
    \ of the parameter and the procedure body.\n\nIn both cases, the binding of the\
    \ procedure name to its value is added to the\nexecution environment, allowing\
    \ definitions of recursive procedures. Table 4.5\ndescribes how relation →Def₃\

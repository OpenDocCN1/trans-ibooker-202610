    For each rule:


    (Fᵢ) Env₁ ⊢ e₁ ↝ v₁ ... Envₙ ⊢ eₙ ↝ vₙ

    --------------------------------------

    Env ⊢ e ↝ v


    of the inference system S_**Exp₂**, which defines the big-step operational semantics
    of

    expressions in **Exp₂**, we must prove that [[e]]_Env = v, under the induction
    hypothesis

    that [[e₁]]_Env₁ = v₁, etc., [[eₙ]]_Envₙ = vₙ. This proof is immediate, as the
    rules for

    evaluating the operational semantics were defined following exactly the same choices

    used to define the evaluation function.


    # 3.5. Semantic properties


    The usual techniques used to prove semantic properties over expressions in a

    programming language are presented as follows.


    # 3.5.1. Equivalent expressions


    DEFINITION 3.3.- Equivalent expressions: two expressions are equivalent if and
    only

    if, in each environment, their evaluations return the same value:


    ∀e₁, e₂ ∈ **Exp₂** e₁ ≡ e₂ ⇔ (∀Env ∈ **E** [[e₁]]_Env = [[e₂]]_Env) [3.8]


    In this definition, we used the evaluation function [[__]]_ for the evaluation
    of the

    expressions. The relation ↝ for evaluating big-step operational semantics can
    also be

    used to define the notion of equivalent expressions:


    ∀e₁, e₂ ∈ **Exp₂**

    e₁ ≡ e₂ ⇔ (∀Env ∈ **E** ∀v ∈ V Env ⊢ e₁ ↝ v ⇔ Env ⊢ e₂ ↝ v) [3.9]


    Using this second definition, proving that e₁ ≡ e₂ amounts to proving how the

    evaluation tree for Env ⊢ e₂ ↝ v can be obtained from the tree for Env ⊢ e₁ ↝
    v

    and vice versa. Following proposition 3.2, these two approaches are equivalent.
    We

    can easily prove that ≡ defines a congruence, i.e. an equivalence relation compatible

    with the internal composition laws of **Exp₂**. For example, if e₁ ≡ e₂ and e''₁
    ≡ e''₂,

    then (e₁ + e''₁) ≡ (e₂ + e''₂).'

  md: '# 2.2.3. Evaluation semantics


    There are several formalisms that may be used to describe the evaluation of an
    expression. These will be introduced later. Let us construct an evaluation function:


    ```

    [[-]]_- : E x M x Exp_1 → V

    ```


    The evaluation of the expression e in the environment Env and memory state Mem
    is denoted as [[e]]^Mem_Env = v with v ∈ V. Table 2.2 contains the recursive definition
    of the function [[-]]_-.


    | [[k]]^Mem_Env = k | (k ∈ Z) |

    | --- | --- |

    | [[x]]^Mem_Env = Env(x) | if x ∈ X and x ∈ dom(Env) |

    | [[x]]^Mem_Env = Err | if x ∈ X and x ∉ dom(Env) |

    | [[e1 + e2]]^Mem_Env = [[e1]]^Mem_Env + [[e2]]^Mem_Env | if [[e1]]^Mem_Env ∈
    Z and [[e2]]^Mem_Env ∈ Z |

    | [[e1 + e2]]^Mem_Env = Err | if [[e1]]^Mem_Env ∉ Z or [[e2]]^Mem_Env ∉ Z |

    | [[!x]]^Mem_Env = Mem(Env(x)) | if x ∈ X^ref_Env |

    | [[!x]]^Mem_Env = Err | if x ∉ X^ref_Env |


    Table 2.2. Evaluation of the expressions of Exp_1


    The value of an integer constant is the integer that it represents. The value
    of an identifier is that which is bound to it in the environment, or Err. The
    value of an expression constructed with an addition symbol and two expressions
    e1 and e2 is obtained by adding the relative integers resulting from the evaluations
    of e1 and e2; the result will be Err if e1 or e2 is not an integer. The value
    of !x is the value stored at the reference Env(x) when x is a mutable variable,
    and Err otherwise.


    Thus, if e is evaluated as a reference, then e can only be an identifier. Furthermore,
    certain expressions in Exp1 are syntactically correct, but meaningless: for example,
    the expression !x when x is not a mutable variable, i.e. when x does not bind
    a reference in the environment, or x1 + x2 when x1 (or x2) is a mutable variable.
    On the other hand, !x + y is a meaningful expression that denotes a value when
    y binds an integer and x binds a reference to an integer.


    EXAMPLE 2.2.– Let us evaluate the expression !x + y


    ```


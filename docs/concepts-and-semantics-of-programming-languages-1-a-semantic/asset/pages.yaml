    ) and \\(\\theta_2\\), represented by the lists\n\\[\\theta_1 = [(\\alpha_1, \\\
    tau_1), \\cdots, (\\alpha_n, \\tau_n)] \\quad \\theta_2 = [(\\beta_1, \\tau'_1),\

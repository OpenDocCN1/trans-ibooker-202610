    \ or `B` of something”, and use the value “something” in the treatment devoted\
    \ to the case.\n\nA *pattern* is a kind of skeleton built from value constructors,\
    \ labels of records and variables, defining a shape. Such a pattern matches all\
    \ values having the same shape and this matching binds the variables of the pattern\
    \ to the corresponding subterms of the value. The names of these variables may\
    \ be used by the instructions associated with the pattern and their bindings will\

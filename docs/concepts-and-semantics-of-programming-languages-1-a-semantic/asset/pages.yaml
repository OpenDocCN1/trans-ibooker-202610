  md: 'and it remains to find the value of x2 – but in which environment? Two choices
    are possible: this value will be supplied either by the environment Env_a in which
    application (f 2) is evaluated, or by the environment in which f was defined.
    In the first case, we speak of dynamic scope, whereas in the second case, we speak
    of static or lexical scope. For Exp2, we adopt lexical scope: closures therefore
    record the environment in which functions are defined. In this way, the values
    of free variables of the function body (except the formal parameter) are those
    at the function definition stage, i.e. those bound to these variables in the definition
    environment of the function.


    Compilers generally work with lexical scope, whereas interpreters often choose
    dynamic scope. Compilers supply optimized implementations of the closure notion,
    avoiding code duplication. In a language using lexical scope, the function body
    is only evaluated when the function in question is applied to an actual parameter.
    This does not, however, imply that the source code of this body is retained; the
    function body is translated into object code, which contains the instructions
    needed to record the definition environment (at least the bindings of the free
    variables of the function in this environment), along with instructions that bind
    the formal parameter to the value of the actual parameter, provided by a call.
    Execution of application of a function to an actual parameter leads to execution
    of the object code of its body, in the right environment.


    # 3.2.5. Evaluation of expressions


    Table 3.3 defines the evaluation function for the expressions in Exp2 by induction,
    following the rules of abstract syntax. Let us examine the rows in this table.
    The value of a constant is the constant itself. Binding a variable in an environment
    provides the value of that variable. To evaluate an expression of the form op
    e or e1 op e2, we must evaluate the subexpressions e or e1 and e2. The evaluation
    of a conditional expression if e1 then e2 else e3 depends on the result returned
    by the evaluation of e1. To evaluate let x = e1 in e2, we evaluate e1 getting
    v, then extend the current environment with the binding (x, v) to enable evaluation
    of e2. The value of a function is a closure. If this function is recursive then
    the closure will, in addition, contain the name of the function f. In order to
    evaluate an application (e1 e2), we must first evaluate e1 and e2 in the current
    environment Env. The function body is then evaluated in the environment Envf contained
    in the closure, extended by the binding (x, v). In the case of a recursive function
    f, adding the name f to the closure means that we can evaluate its body ef in
    an environment where f is bound to the closure. Another way of constructing the
    closure of a recursive function f (used in section 3.3.3) consists of extending
    the definition environment of f to include the binding of f with its own closure,
    making it possible to evaluate recursive calls:


    ```

    [[rec f x = e]]Env = F   with   F = <x, e, (f, F) ⊕ Env>

    ```'

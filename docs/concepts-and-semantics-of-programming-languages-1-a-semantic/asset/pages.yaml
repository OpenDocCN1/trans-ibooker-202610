    # 6.1.2.3. Overflow


    As integer size is predetermined, _overflow_ may occur in cases where an integer
    is “too big” or “too small” to be represented over the number $n$ of bits assigned
    to its type. Integer operations and their properties do not, therefore, belong
    to $\mathbb{Z}$ but to arithmetic _modulo_ $\mathbb{Z}/n\mathbb{Z}$.


    Consider the following example. The decimal value 9 is represented in $\mathbb{Z}$
    in binary by 1001; the value 7 is represented by 0111 and the value of their sum
    is represented by 10000. Take a representation using unsigned integers, coded
    over 4 bits. The representations of 9 and 7 are those found in $\mathbb{Z}$, as
    they only require 4 bits. The representation of 16, however, becomes 0000: the
    MSB has been lost. The actual computation is $(9+7) \mod 2^4$ and not $9+7$. Symmetrically,
    consider $-8-1$: assuming that these are signed values, do we obtain $-9$? The
    decimal value $-8$ is represented in binary by 1000, and the value 1 is represented
    by 0001. Their difference is thus 1111, which now requires 5 bits. Again, the
    MSB has been lost, and we obtain a result of 1111, equal to $-1$ in decimal.


    Similarly, if the location of a given integer variable is fixed to $n$ bits and
    if this variable is assigned with a value requiring $m$ bits with $m > n$, then
    overflow will occur: $(m-n)$ bits are lost.'

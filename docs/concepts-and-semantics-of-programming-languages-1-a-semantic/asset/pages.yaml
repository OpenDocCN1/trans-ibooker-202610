    \ v   phi = filter(p, v)   phi \\oplus Env |- e1 ~~ v1\n                    Env\
    \ |- match e with p -> e1 | _ -> e2 ~~ v1\n\n(E_match2)    Env |- e ~~ v   not(phi\
    \ = filter(p, v))   Env |- e2 ~~ v2\n                    Env |- match e with p\
    \ -> e1 | _ -> e2 ~~ v2\n```\n\n# Box 6.2. Operational semantics of pattern matching\n\
    \n# 6.5.2.1.3. Typing rules\n\nThere are similarities between the typing of the\

- pgno: 190
  md: 'These rules extending the typing relation cannot be generalized indiscriminately
    to any operation; however, this does not decrease the utility of subtyping, as
    only a partial preorder is required. For example, the subtyping relation cannot
    be extended to assignment. Consider \( t_s \ge t_b \): in our example, \( t_s
    \) is the type of individual employees and gives their name and salary, and \(
    t_b \) is the type of all individuals, giving only their name. Now, suppose that
    the values of type \( t_s \) are stored over a greater number of bytes than the
    values of type \( t_b \). This is the case in our example. The assignment of \(
    v : t_b \) to \( x : t_s \text{ ref} \) will leave a number of "free" bytes in
    the zone pointed by \( x \); evidently, this is not acceptable, unless the compiler
    identifies the issue and handles it in a suitable manner. Now, let us examine
    how this "common sense" constraint is obtained through a detailed examination
    of extension to assignment. Consider an assignment operator \( := : \text{type
    } t_b \text{ ref} \times t_b \to \text{unit} \). If we extend subtyping to this
    operator by induction, then \( := \) will also be of the type \( t_s \text{ ref}
    \times t_b \to \text{unit} \). This means that a reference to a value of type
    \( t_s \) will become a reference to a value of type \( t_b \). This raises the
    question of the effective meaning of the word "reference" (see Chapter 6).


    We do not intend to go into detail concerning subtyping and its properties here;
    our presentation is limited to the most commonly encountered notion. Other approaches
    exist, for example, using different orders induced over functional types, which
    may be covariant on the argument types. In all cases, complex theoretical studies
    are required to prove the partial correctness properties of these notions of subtyping,
    and, finally, to create effective and efficient typing algorithms. A number of
    examples of subtyping will be studied in Volume 2, notably in Chapters 2 and 4.


    # 5.7.2. Overloading


    Identifier overloading is a syntactic facility proposed by certain programming
    languages. In this case, the same identifier can be used for functions or operators
    with different definitions, and, consequently, different types and values. Overloading
    is often used to give the same name to operations, which have very similar specifications,
    but are applied to different data types. For example, the expressions 3 + 4, 3.5
    + 4.6 and "aa" + "bb" all use +, but the code and type of the operations denoted
    by this identifier are very different. The compiler is responsible for choosing
    the correct version of + to use in evaluating each of these expressions. This
    task is known as overload resolution.


    In order to take account of overloading, the environment model must be adapted.
    Without overloading, adding a new binding for an identifier f, which is already
    bound in an environment E, will mask the pre-existing bindings of f in E. In cases
    where a licit overloading is present, several bindings of f may be accessible
    in E. The typing algorithm must determine which binding of f to use when typing
    the application f(e), according to the type of e. Overloading resolution may be
    carried out during compilation or execution of the program. The overloading resolution'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'algorithm used is highly dependent on choices made by the language. Different
    forms, such as operator overloading, function and procedure overloading, constant
    overloading and method overloading, may or may not be included, independently
    of one another. The overloading resolution method may be described, informally,
    as follows. Let $exp$ be an expression containing an overloaded identifier $f$.
    To type this expression and thus determine which value of $f$ to use, we must:


    +   1) associate a type variable with each occurrence of $f$, denoting one of
    the possible types for this identifier;


    +   2) establish the system of equations which these variables must satisfy, using
    the typing rules of the language. Additional information may also be used, such
    as the names of formal parameters if these are used in passing the actual parameters;


    +   3) at the end of this step, each type variable is associated with at least
    a type;


    +   4) verify that there is only one solution to the system of equations. To do
    this, we substitute each type variable, one by one, with one of its associated
    types. If there is no solution, then $exp$ is ill-typed. If several solutions
    exist, then we have an ambiguity and $exp$ is rejected by the typing process.


    Consider the following example, written in a pseudo-language that permits overloading
    for functions and for constants defining enumerated types, i.e. types defined
    by a set of explicitly named and non-mutable values:


    ```

    type color is (blue, green, red)

    type light is (green, red)

    function F(c:color):light = ...

    function F(x:light):color = ...

    ```


    Let F_a be the first declaration of F and let F_b be the second declaration. Let
    green_C and red_C be the overloaded values of the type color and green_F and red_F
    the overloaded values of the type light. The expression F(blue) is clearly typable,
    taking F_a for F since blue is clearly and unambiguously of type color. The expressions
    F(green) and F(F(green)), on the other hand, are evidently ambiguous and will
    therefore be rejected.


    This ambiguity is removed in F(F(green)) = F(blue): typing this expression leads
    us to resolve the overloading of F and green. To do this, we write the expression
    in the form F_1(F_2(green)) = F_3(blue). Let $\tau_1 = \tau_{11} \rightarrow \tau_{12}$
    be the type of F_1, $\tau_2 = \tau_{21} \rightarrow \tau_{22}$ the type of F_2
    and $\tau_3 = \tau_{31} \rightarrow \tau_{32}$ that of F_3, where $t_{ij}$ denotes
    the type variables. The possible values of $\tau_1$ are light $\rightarrow$ color
    and color $\rightarrow$ light. Since F_1 is applied to the result of F_2, we deduce
    the equation $\tau_{11} = \tau_{22}$. The results of F_1 and F_3 must be of the
    same type, giving us the equation $\tau_{12} = \tau_{32}$. Since F_3 is applied
    to blue, we have $\tau_{31} =$ color, hence'
  merge: -1
  img_proc: true
- pgno: 192
  md: '\(\tau_{32} = \text{light}\), hence \(\tau_{12} = \text{light}\) and \(\tau_{11}
    = \tau_{32} = \text{color}\), and thus the type of green is light. The expression
    F(F(green)) = F(blue) is then analyzed by the typing algorithm, following resolution,
    as F\_a(F\_b(green)) = F\_a(blue).


    The rules used in overloading resolution may be more complex in cases where functions
    may have a variable number of arguments, in the presence of optional arguments,
    where the language includes object features that permit overloading for methods
    interacting with inheritance and subclassing. A brief presentation of overloading
    is given in Chapters 1 and 3 of Volume 2, and the subject is also discussed in
    relation to each of the languages presented in Chapters 2 and 4 of Volume 2. Note
    that overloading is not permitted in C.


    It is important to note that, although overloading makes it easier to write programs,
    it can make them difficult to review; users must have an in-depth knowledge of
    the associated semantics, which may differ from one language to the next. This
    point will be addressed further in Volume 2, Chapters 3 and 4.'

    # 3.4. Evaluation functions versus evaluation relations


    In this section, we examine the determinism of the evaluation function with the
    call-by-value strategy. This leads us to study a new form of induction.


    # 3.4.1. Status of the evaluation function


    The question examined here is whether, for every expression \( e \in \mathbf{Exp}_2
    \), there exists a single value \( v \in \mathbb{V} \) such that \( \llbracket
    e \rrbracket_{\text{Env}} = v \). The answer is no. If \( e \) is an expression
    that requires evaluation of the application of a non-terminating recursive function
    (such as expression [3.6], called “foo”, in section 3.3.2), then we cannot obtain
    a value \( v \in \mathbb{V} \) such that \( \llbracket e \rrbracket_{\text{Env}}
    = v \). So \( \llbracket \_ \rrbracket \) is not a total function. However, if
    such a value \( v \) exists, it is provably unique (thus \( \llbracket \_ \rrbracket
    \) is a partial function):


    ```

    \(\forall e \in \mathbf{Exp}_2 \quad \underline{\forall_{\text{Env}} \in \mathbf{E}
    \quad \forall v, v'' \in \mathbb{V} \quad (\llbracket e \rrbracket_{\text{Env}}
    = v \text{ and } \llbracket e \rrbracket_{\text{Env}} = v'') \Rightarrow v = v''}
    \quad P(e)\)

    ```


    Let us call this property \( P \). We may try to prove that \( P \) holds for
    all expressions \( e \in \mathbf{Exp}_2 \) by induction over \( e \), using the
    induction scheme defined in Box 3.1. This is possible for most of the syntactic
    constructs, for example for expressions of the form let \( x = e_1 \) in \( e_2

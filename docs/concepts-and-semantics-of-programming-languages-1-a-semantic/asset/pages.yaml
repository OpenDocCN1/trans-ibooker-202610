    not } \downarrow b \ge y \}\)

    \((Cons_G) \downarrow 1\)

    \(\{P_1\} c_1 ; c_2 (P_1) (Cons_D)\)

    \(\---------------------------------------------------\)

    \((Seq)\)

    \(\{P_1\} c_d {P_2}\)


    The application of rule (ConsD) is based on the following implication:


    \((x = (\downarrow a \times y) + \downarrow b \text{ and } \downarrow b \ge 0
    \text{ and } y > 0 \text{ and not } \downarrow b \ge y) \Rightarrow P_2\)


    The loop invariant \(P_I\) used here is:


    \(x = (\downarrow a \times y) + \downarrow b \text{ and } \downarrow b \ge 0 \text{
    and } y > 0\)


    and the variant is \(V = \downarrow b\). Since \(P_I \Rightarrow \downarrow b
    \ge 0\), the rule \((W_T)\) can be applied. The inference tree \(\nabla_2\) is

    # ## 2.1. Environment, memory and state


    # ### 2.1.1. Evaluation environment


    Let **X** be a set of identifiers and **V** a set of values. The association of
    an identifier \(x \in \mathbf{X}\) with a value \(v \in \mathbf{V}\) is called
    a *binding* (of the identifier to its value), and a set ENV of bindings is called
    an *execution environment* or *evaluation environment*. ENV(\(x\)) denotes the
    value associated with the identifier \(x\) in ENV. The set of environments is
    denoted as **E**.


    In practice, the set of identifiers **X** that are actually used is finite: usually,
    we only consider those identifiers that appear in a program. An environment may
    thus be represented by a list of bindings, also called ENV:


    ```

    [(x_1, ENV(x_1)), (x_2, ENV(x_2)), ... , (x_n, ENV(x_n))]

    ```


    where \(\{x_1, x_2, \dots, x_n\}\) denotes a finite subset of **X**, known as
    the *domain* of the environment and denoted as dom(ENV). By convention, ENV(\(x\))
    denotes the value \(v\), which appears in the first \((x, v)\) binding encountered
    when reading the list ENV from the head (here, from left to right).


    In this model, a binding can be added to an environment using the operator \(\oplus\).
    By convention, bindings are added at (the left of) the head of the list representing
    the environment:


    ```

    \((x_{new}, v_{new}) \oplus [(x_1, v_1), (x_2, v_2), \dots , (x_n, v_n)]\)

    \(= [(x_{new}, v_{new}), (x_1, v_1), (x_2, v_2), \dots , (x_n, v_n)]\)

    ```


    Suppose that a certain operation introduces a new binding of an identifier, which
    is already present in the environment, for example \((x_2, v_{new})\):


    ```

    \((x_2, v_{new}) \oplus [(x_1, v_1), (x_2, v_2), \dots , (x_n, v_n)]\)

    \(= [(x_2, v_{new}), (x_1, v_1), (x_2, v_2), \dots , (x_n, v_n)]\)

    ```


    The so-obtained environment \((x_2, v_{new}) \oplus \text{ENV}\) contains two
    bindings for \(x_2\). Searching for a binding starts at the head of the environment,
    and, with our convention, new bindings are added at the head. So the most recent
    addition, \((x_2, v_{new})\), will be the first found. The binding \((x_2, v_2)\)
    is not deleted, but it is said to be *masked* by the new binding \((x_2, v_{new})\).
    Several bindings for a single identifier \(x\) may therefore exist within the
    same environment, and the last binding added for \(x\)'

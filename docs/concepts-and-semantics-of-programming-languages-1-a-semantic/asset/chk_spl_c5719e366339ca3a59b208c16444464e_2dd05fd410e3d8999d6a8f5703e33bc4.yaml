reviews:
- 'no': 9451
  overturn_probability: 0.88
  alternative: 附录内的正文小标题（符号对照表/参考列表）
  counter_evidence:
  - 标记为 `## 符号列表`，是 Markdown 二级标题，非全书最高层级章标题，不符合“第 X 章”或“一级标题”的章节划分规则。
  - 内容本质是符号与页码的对照列表（如 `- F, 120`），属于参考工具表，缺乏统领后续正文的章节语义。
  - 标题后直接是列表项，没有章节概述段落，也不后跟子节编号，不符合章标题的上下文特征。
  - 它与前后的“练习解答”“程序索引”连续出现，更可能是同一附录或参考部分内的子目，不应独立成章。
  keep_split: false
- 'no': 9532
  overturn_probability: 0.82
  alternative: 文末索引或附录中的子节（程序索引列表）
  counter_evidence:
  - 同样使用 `##` 二级标题，而非最高层级章标题，缺乏章号（如“第 X 章”或“X. ”）。
  - 标题后内容全是带页码的程序符号列表项（`- 'a const1 (类型), 23`），属于索引清单，不是章节绪论。
  - 紧邻“符号列表”和“参考文献”等书末材料，应视为同一索引/附录章节下的小节，而非独立章。
  - 规则虽说文末索引划分为一章，但并未说每一个索引子标题都要单独分章；此处应归入前序索引章。
  keep_split: false
- 'no': 9689
  overturn_probability: 0.78
  alternative: 附录或书末材料中的参考文献列表小节
  counter_evidence:
  - 为 `## 参考文献`，二级标题而非一级章标题，未达到全书最高层级。
  - 内容为文献条目列表（`- [ACC 92] ...`），属于参考资料清单，缺乏章节统领性。
  - 前后均为索引字母分组等书末内容，可能隶属于同一“附录/索引”大章，不应再拆分。
  - 真正的章标题通常单独成行且后有概述段落，而此处后面直接是参考文献条目。
  keep_split: false
- 'no': 9713
  overturn_probability: 0.93
  alternative: 主题索引内的字母分组小标题（A 字头索引项）
  counter_evidence:
  - 原判断自身理由已承认“文末索引整体划分为一章，后续字母标题为该章内小节”，此处 `## A` 显然属于索引内部字母分组，不应另立章节。
  - 标题仅一个字母“A”，语义范围极窄，不具备章节统领后续大量内容的能力。
  - 与 `## B, C`、`## D, E` 等同级，明显是索引的内部结构而非独立章。
  - 使用 `##` 二级标题，非最高层级章标题。
  keep_split: false
- 'no': 10329
  overturn_probability: 0.75
  alternative: 版权页或书末法律声明（出版元数据/EULA 残留）
  counter_evidence:
  - 位于文件极末尾，年份索引（2005 等）之后，性质更接近出版社版权声明或电子书许可协议残留，而非正文章节。
  - 使用 `##` 二级标题，且无章号，不符合全书最高层级章节特征。
  - 内容为法律条款引导语（“访问 www.wiley.com/go/eula ...”），属于法律声明，缺乏书籍章节应有的统领性与概括性。
  - 前后是年份和书目列表，明显属于书末附录或版权页区域，不应作为正文章节切分。
  keep_split: false

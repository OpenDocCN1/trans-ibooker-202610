    - IBM Informix database (Beta)

    - IBM Netezza

    - MySQL database


    - Certified Connectors

    - Template Apps

    - Connect

    - Cancel


    Figure 2-4. Here''s a look at the full Get Data window, for when you need the
    whole enchilada, meaning the entire list of data connectors.


    If you click on the bottom half of the button, you''ll see a smaller, truncated
    list of more commonly used data sources. This can be very convenient when you
    don''t need to go into the full list of connectors. The truncated list is shown
    in Figure 2-5.


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_27_0.png)


    *Figure 2-5. The quick data selection list is a shorter list of data connectors,
    for when you''re having a classic for lunch.*


    The Excel Workbook button will immediately open an Explorer window to navigate
    to your Excel file. Click on the Power BI Datasets button, and a window will appear
    so you can select a dataset that is already published in Power BI Service to connect
    to via a ''live connection.'' For reference, see the window in the example in
    Figure 2-6.


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_28_0.png)


    Figure 2-6. Connecting to a dataset already in Power BI Service.


    If you click on the SQL Server button, a pop-up menu will appear for you to put
    in the server''s name or address, along with an optional database name. The server
    will ask for your credentials when you try to connect. You''ll also see an option
    for selecting Import or DirectQuery, which we''ll discuss in more detail later
    in the book. That window is shown in Figure 2-7.


    There is also an Advanced Options button you can press that will allow you to
    add a command timeout in minutes, pass a custom SQL statement, include relationship
    columns, navigate using full hierarchies, and enable SQL Server Failover support.


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_29_0.png)


    Figure 2-7. Connecting to your friendly neighborhood SQL Server.


    The Enter Data button (going back to Figure 2-3) will give you an interface that
    should feel familiar if you use Excel, as it opens a table-like structure where
    you can add columns, name them, and put data into cells, as shown in Figure 2-8.
    It''s important to note there is no formula function in this interface. It''s
    only for simple data entry. You can copy and paste information into this window,
    as well, but be careful before going copy-paste crazy in this window. This can
    be useful for testing or if you have a lookup table that you want to generate
    for your model, but I recommend that you do not put large amounts of information
    into this type of table structure because it has to be manually managed.


    ### The Clipboard Subsection


    Moving on to the Queries subsection, there are two buttons, Transform Data and
    Refresh. Refresh is greyed out in Figure 2-11 because I have no data in my model
    to refresh. However, when that button is available and pressed, it will do a complete
    refresh of all data sources in your data model.


    Transform Data has two separate functions, depending on whether you click the
    top or bottom of the button. If you click the top half, it takes you straight
    to the Power Query interface, which we will discuss in more detail in another
    chapter. If you click the bottom half, you''ll get a drop-down menu with a couple
    different options. Data Source Settings takes you to a pop-up to modify those
    settings for things like credentials or locations of files and the like. If you
    have parameters and variables, they can be modified here, as well.


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_32_0.png)


    *Figure 2-11. Transform Data options. (Not sure we need this one)*


    ### The Insert Subsection


    Next is the Insert tab, which has three options. You can insert a new visual onto
    your report page, insert a text box, or add more visualizations to your list of
    visualizations in the Visualizations pane.


    If you click on New Visual, you''ll see a visual will be put onto your canvas.
    The default visual that will be placed on the canvas is the Stacked Column Chart.


    The Text Box button will put a text box onto your canvas in the same way it would
    appear in PowerPoint.


    The More Visuals button, when clicked, will look like Figure 2-12. If you select
    from My Files, you''ll be directed to an Explorer window where you can select
    a visual to add from a pbviz file you have on your local machine.


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_33_0.png)


    Figure 2-12. Adding visuals from two possible sources.


    If you select From AppSource, you''ll see the window shown in Figure 2-13. Here
    you can select a third-party visualization to add to your list of visualizations.


    Figure 2-13. Power BI AppSource has a wealth of additional visualizations you
    can select for your reports.


    ### The Calculations Subsection


    Under Calculations, you have Measures and Quick Measure.


    Measures are calculations across your data using DAX. We will discuss measures
    more later in this book, but, for now, if you click on New Measure, you''ll see
    a formula bar appear below the ribbon where you can put in the DAX for your measure.
    This is like the formula bar you might use in Excel.


    The Quick Measure button will have a pop-up box that appears to help you create
    a measure using a wizard with several predefined calculations. You can see both
    below in Figure 2-14. Here''s a helpful tip: Microsoft adds new quick measures
    in some releases, so it''s always worth going back after an update to see if new
    quick measures have been added.


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_35_0.png)


    *Figure 2-14. The DAX Formula Bar and Quick Measure menu. You will use these.
    I promise.*


    ### The Final Subsections: Sensitivity and Share


    The last two buttons on the Home tab deal with sensitivity labels and the ability
    to publish your report to service. We''ll deal more with these options later.


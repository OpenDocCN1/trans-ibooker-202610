    # The Scale to Fit Subsection


    In Scale to Fit, the Page View button gives you the option to either fit your
    canvas to fit the page, fit to width, or show it in its actual size. This goes
    hand in hand with the Mobile subsection’s Mobile Layout button, which will change
    your report canvas to a size and shape suitable for reports being displayed on
    a mobile device. Mobile report development is quite a bit different than standard
    report development in terms of what you must think about since you have more limited
    real estate.'
  - '[PAGE 53]


    # The Page Options Subsection


    In this subsection, you have three buttons to select from. You can show the Gridlines,
    you can have items Snap to Grid, and you can Lock Objects.


    Gridlines are helpful in giving you guiding references for where your items are
    in respect to other items.


    Snap to Grid only has a function while in Mobile layout and will force all visuals
    to fit neatly into a given pixel density.


    Lock Objects prevents items on a page from being moved around.'
  - '[PAGE 54]


    # # The Show Panes Subsection


    The Show Panes subsection is the last one on the View tab. This subsection is
    related to the different panes you can have added or removed at any time from
    that portion of the user interface.


    We will detail these functions user interfaces later in this chapter, but as a
    general overview, the Filters pane allows you to modify filters at a visual, page,
    or report level.


    Bookmarks allow you to set a report page to a certain series of events and then
    return to that state at a later point, like a web bookmark.


    The Selection pane shows you all the objects on your canvas in each report page
    and can allow you to quickly select a specific object. You can also use this to
    group objects and determine their hierarchy of importance when they might overlap.


    The Performance Analyzer lets you see what’s impacting your report page’s performance
    and can allow you to extract machine-generated DAX.


    The Sync Slicers pane allows you to determine which slicers, if any, should be
    synced across report pages, allowing a way to keep comparisons the same across
    different report pages.


    # ## Report View: Help Section


    The Help tab on the ribbon will provide you a way to see what version of Power
    BI Desktop you’re using, provide links to guided learning, training videos, documentation,
    and support links, as shown in Figure 2-22.'

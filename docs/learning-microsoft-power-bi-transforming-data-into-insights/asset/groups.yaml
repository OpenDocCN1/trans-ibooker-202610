    2015年7月24日，Power BI Desktop 的第一个正式公开版本面向全球发布。Power BI Desktop 内部包含了一整套企业级语义建模工具，搭载
    VertiPaq 引擎和 DAX 公式语言。它使用 Power Query 从各种不同的来源获取信息，将其导入引擎，并允许对这些数据进行转换，以便为后续分析做好准备。


    图 1-1 展示了 Microsoft BI 的发展轨迹以及它们如何汇聚融合，突出显示了过去 30 年来企业级 BI 和自助式 BI 的一些里程碑。


    没有人会考你这段历史，但希望它能让你理解我们是如何走到今天的。我的意思是，当然……并非所有人都会在书架上摆放关于 Microsoft 的历史书籍，但也不是所有人都会为萨蒂亚·纳德拉设立秘密神龛。这是一种人生选择。


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_16_0.png)


    图 1-1：这条 Power BI 时间线展示了商业智能从 Excel 到当今 Power BI Desktop 的演变过程。


    ## Power BI Desktop 的内部机制


    Power BI Desktop 之所以能够工作，是因为其内部拥有两个强大的引擎。正是它们在技术层面上让整个系统得以运转。其中一个是公式引擎，它接收数据请求、处理请求，并生成用于执行的查询计划。另一个是存储引擎，它存储数据模型的数据，并提取公式引擎所请求的数据以满足查询需求。


    另一种理解方式是，将公式引擎视为大脑。它找出解决问题的最佳方法，并将相应的工作指令发送到身体合适的部位去完成。存储引擎


    ## Power BI 与竞争对手有何不同？


    说实话，对于数据分析师来说，从来没有比现在更好的时代。市场上的许多工具各有优缺点，Power BI 也不例外。事实上，为了看看这个市场上有多少竞争对手，让我们快速看一下图
    1-2，它展示了 Gartner 2021 年分析与商业智能平台魔力象限。


    ## 图 1：分析与商业智能平台魔力象限


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_19_0.png)


    来源：Gartner（2021 年 2 月）


    图 1-2：Gartner 分析与商业智能平台魔力象限。


    现在，无论你对各竞争对手在该分析中的位置有何看法，仅仅是它们的数量之多就足以让你眼花缭乱。每个竞争对手都有其今天立足于市场的理由。不过请注意，在领导者象限中只有三个玩家：Qlik、Tableau
    和 Microsoft。


    Microsoft 与该领域竞争对手之间真正的差异化来源，在于其执行软件规划的能力。Microsoft 在商业智能领域拥有超过 30 年的历史，而 SQL
    Server 本身如今也已超过 30 岁。Microsoft 在这场游戏中已经深耕了很长时间，与其他厂商相比，其商业智能平台拥有最多的配套支持技术。


    所有这些主要竞争对手都提供产品，让你获取数据并将其转化为出色的数据可视化，帮助你从数据中发现此前未知的信息。例如，我将永远羡慕 Tableau 那种点击拖拽即可分组的能力。


    ## 为什么选择 Power BI，以及它在全球范围内的应用实例


    暂且不论 Tableau 的耀眼光芒，Power BI 在 Power Query 中提供了一种在易用性方面无与伦比的数据接入工具，非常适合非技术背景的用户。它还拥有当今地球上最强大的分析引擎之一（即便不是最强大的），即
    Analysis Services 表格模型。这些工具加速了许多组织内部的数据民主化进程。Power BI 在世界各地培养了一批使用数据开展变革性工作的平民数据分析师。事实上，当你付出努力阅读并消化本书时，你正是在迈出加入这个社区所需的步骤！


    以下是一些实例。世界领先的保护组织世界自然基金会使用 Power BI 与捐赠者分享影响力效果。康明斯的工程师使用 Power BI 进行高级产能规划，以更快地将发动机交付出厂。Humana
    利用 Power BI 将整个企业中超过 45 个不同的独特数据源进行集中和可视化，将 Power BI 作为最终用户的整合平台。伦敦国王学院使用 Power
    BI 的人工智能视觉对象来识别可能预示学生学业表现发生变化的关键因素，从而进行有针对性的外联，最大限度地增加学生成功的机会。这些只是当今在该平台上各种应用案例中的一小部分。


    Power BI 背后有数十年的 Analysis Services 经验积累，其前端如今也名副其实。此外，Microsoft 每月都会发布 Power BI
    Desktop 更新，带来新功能、连接器和可视化对象。Microsoft 致力于 Power Platform，可以肯定地说，Microsoft 将长期坚持下去。当
    97% 的财富 500 强公司都对某件事达成共识时，很可能有充分的理由。


    ## 总结


    Power BI 的核心不仅仅是一个桌面创作工具。它是一个完整的平台，是 Microsoft 近三十年来一直致力于构建的目标。它拥有独特的优势，即拥有 VertiPaq
    和 DAX 这两个全球经受最多企业级检验的分析引擎。它还提供了一个出色的工具，让非技术用户能够将不同的数据整合在一起，并通过 Power Query 对这些数据开始真正的分析。


    Power BI Desktop 如今已成为企业级解决方案，被全球最大的公司、非营利组织甚至小型企业所使用，帮助他们从数据中获取以往不可能获得的洞察。


    在了解了 Power BI 是什么之后，我们终于可以带着清晰的愿景打开这款软件，明确我们将用它做什么。这一切从报表视图开始，所以拿一罐汽水，摸摸你的狗，让我们开始吧。下一章将介绍用户界面及其使用方法。



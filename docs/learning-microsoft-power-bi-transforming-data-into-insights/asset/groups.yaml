    ... context menu for adding a new measure, a new calculated column, a new quick
    measure, refreshing the data, editing the query for that table in Power Query,
    and more. If you right click on a column in this area, you’ll get a context menu
    for adding it to your canvas, creating a hierarchy from that first column, adding
    a new measure or column, adding the column to your filters list, or adding it
    to drill through. You’ll also have the option to hide it from sight in case you
    don’t want that data element used at that time.


    The Filters pane has three subsections. You’ve likely used filters already, but
    a filter is a function that sets a condition by which the data must be true in
    order to be displayed. For example, if I have a filter of an age bracket and selected
    the grouping from 12 to 18 years old, that is all the data I would see. All other
    data would be ignored.


    On the Filters pane, when you have a specific visual selected, it will allow you
    to apply filters to that specific visual. Filters on This Page filters all visuals
    on that specific report page. Filters on All Pages sets a filter condition for
    the entire report. By default, any fields that are in a visual will also show
    up in the Filters pane in the Filters on This Visual subsection and can be interacted
    with there.


    There are three common filter types you can set in the Filters pane, each with
    their own behavior. The basic filtering displays all the values for the given
    column and allows you to select any number of those values to be true. It’s very
    straightforward. The advanced filtering offers you a combination of two separate
    and unique conditions with logic available based on what type of data the column
    represents:


    - Contains (Text)

    - Does not contain (Text)

    - Starts with (Text)

    - Does not start with (Text)

    - Is (All)

    - Is not (All)

    - Is blank (All)

    - Is not blank (All)

    - Is empty (Text)

    - Is not empty (Text)

    - Is after (Date)

    - Is on or after (Date)

    - Is before (Date)

    - Is on or before (Date)

    - Is less than (Number)

    - Is less than or equal to (Number)

    - Is greater than (Number)

    - Is greater than or equal to (Number)


    Most of these conditions are clear-cut, but it’s important to remember that you
    must put the value into the subsection yourself, unlike with basic filtering,
    which allows you to see a selection of values. You can then select the button
    to make an and/or condition and set a second logic set. You don’t need to set
    a second logic condition to use advanced filtering.


    The third common filter type is a Top N type filter. Here you can set a specific
    number of top or bottom values you want to display by a certain value in your
    model that can be, but does not have to be, in that visual. A classic example
    of this would be to see your top ten sales clients by state, country, revenue,
    or volume. You set the number of values to display and whether you want the top
    or bottom values for that specific field in the visual. You will note that Top
    N is not available when filtering for an entire page or report. Top N filtering
    only works when used at the visual level.


    Dates also have two other possible types of filters that can be utilized, relative
    date and relative time. Relative time will only show if the date field has a time
    component as well. These filter options allow you to set specific time intervals
    for a visual or for the report, like the last 10 days or the next week or the
    last year. Relative time allows you to get into this level of detail with hours
    and minutes.


    ## A Quick Rundown of the Other Panes


    There are four panes that are not visible by default, but you can turn them on
    in the View tab, and they’ll appear in whatever order you add them. Those are
    Bookmarks, Selection, Performance Analyzer, and Sync Slicers panes. See them in
    Figure 2-25.


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_62_0.png)


    Figure 2-25. Here they are, the Bookmarks, Selection, Performance Analyzer, and
    Sync Slicers panes.


    The Bookmarks pane allows you to save filters, drilling, and other conditions
    you may have set for a given report page, like a bookmark that you can return
    to. Let’s say, for instance, we have an example of our report page that shows
    all the data, but we would like end users to be able to quickly change the report
    to a specific filtered view. We can use Bookmarks to toggle the conditions of
    the page from one point to another. Bookmarks are a very powerful feature that
    we will discuss in more detail later.


    The Selection pane allows you to quickly manage visibility and layering order
    of objects in the report. Say you have a logo that you want to appear in a very
    specific location on the report at all times, but as you put visuals onto the
    canvas, the logo gets covered up by the visual’s box, even if the portion of the
    box that’s overlapping the logo is blank. Well, to fix that, you would want to
    bring the logo to the front, and you can do that and manage your entire layering
    order from this menu. You can also group objects to be treated and moved together.


    The Performance Analyzer helps you when you’re ready to troubleshoot why something
    in a report might be taking longer to display than you think it should or why
    it loads slower than it perhaps did in the past. You can use the Performance Analyzer
    to gather information around how many milliseconds it took to generate the DAX
    query, visualize the results, and other items, including the DAX that Power BI
    generated to create the visual. While machine-generated DAX isn’t always the easiest
    to learn from as a beginner, when you have some DAX experience under your belt,
    it can be useful knowing all the filter and row context to see how Power BI generates
    the appropriate code to power the visualization. Likewise, when your report is
    having issues, you can test different configurations to see if your report performance
    improves or degrades.


    The last pane to discuss is the Sync Slicers pane. When you put slicer visuals
    onto a report, they only function for that page. However, with the Sync Slicers
    pane, you can select a slicer and add that slicer to other pages and sync them
    – so that when the slicer is changed on one page, that slicer changes on all the
    other pages. This can be great for exploratory analysis when someone is looking
    at the data and they find, for example, a specific company they want to hone in
    on. If they set that filter in one portion of the report, this will carry that
    slicer selection to all the other pages that also have that slicer. You even have
    control to say it should sync on Page A, but not on Page B, for instance.


    ## Data View


    The Data view allows you to see the table level data inside your report. It will
    display the columns in your report in their ordinal order instead of their alphabetical
    order. The ordinal order is the order of the columns from the data source, or
    in our case, the order of the columns as they appear in Power Query before being
    loaded into our data model. Let’s take a look at my sample Date Dimension table
    to see what an entire table looks like in the Data view in Figure 2-26.


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_64_0.png)


    Figure 2-26. An example table in the Data view.


    ### Table and Column Tools


    First, you’ll note that there are two new subsections of the ribbon to interact
    with. The Table Tools tab of the ribbon will show up when you have any table or
    column selected in the Fields pane. The Column Tools tab will appear only when
    a specific column is selected. Let’s see that by zooming into Figure 2-27.


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_64_1.png)


    Figure 2-27. New view, new ribbon options.


    The Table Tools subsection allows you to change the table name, mark it as a date
    table, or view our relationships here in the same way we did from the ribbon as
    discussed previously. In addition, we have our calculation options for creating
    measures and tables. There is not too much here that is new, and this view also
    shows up in the Report view when you have a table or column selected.



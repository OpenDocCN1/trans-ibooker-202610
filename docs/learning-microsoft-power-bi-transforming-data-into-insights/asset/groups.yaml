    ...用于添加新度量值、新计算列、新快速度量值、刷新数据、在 Power Query 中编辑该表的查询，以及更多操作的上下文菜单。如果你右键单击此区域中的某一列，则会看到用于将其添加到画布、从该首列创建层次结构、添加新度量值或列、将该列添加到筛选器列表，或将其添加到钻取中的上下文菜单。如果你不希望该数据元素在当时被使用，还可以选择将其隐藏。


    “筛选器”窗格包含三个子分区。你可能已经使用过筛选器，但筛选器本质上是一种函数，它设置一个条件，数据必须满足该条件才能被显示。例如，如果我设置了一个年龄段筛选器，并选择了
    12 到 18 岁这一分组，那么我只会看到符合该条件的所有数据，其他所有数据都会被忽略。


    在“筛选器”窗格中，当你选中某个特定视觉对象时，可以对该特定视觉对象应用筛选器。“此页面上的筛选器”会筛选该特定报表页面上的所有视觉对象。“所有页面上的筛选器”则为整个报表设置筛选条件。默认情况下，视觉对象中的任何字段也会出现在“筛选器”窗格的“此视觉对象上的筛选器”子分区中，并可在其中进行交互。


    你可以在“筛选器”窗格中设置三种常见的筛选器类型，每种类型都有各自的行为。基本筛选会显示给定列的所有值，并允许你选择任意数量的这些值作为有效条件。这非常直观。高级筛选则基于列所代表的数据类型，提供两个独立且唯一的条件的组合，并可选择相应逻辑：


    -   包含（文本）

    -   不包含（文本）

    -   开头为（文本）

    -   开头不为（文本）

    -   是（所有）

    -   不是（所有）

    -   为空（所有）

    -   不为空（所有）

    -   为空（文本）

    -   不为空（文本）

    -   晚于（日期）

    -   不早于（日期）

    -   早于（日期）

    -   不晚于（日期）

    -   小于（数字）

    -   小于或等于（数字）

    -   大于（数字）

    -   大于或等于（数字）


    这些条件大多非常明确，但请务必记住，与基本筛选允许你查看一组可选值不同，使用高级筛选时，你必须自己将值输入到子分区中。然后，你可以选择按钮来设置“与/或”条件，并设置第二组逻辑。使用高级筛选时，你并非必须设置第二个逻辑条件。


    第三种常见的筛选器类型是“前 N 项”筛选器。你可以在此处根据模型中的某个值（该值可以但不一定位于该视觉对象中）设置要显示的前 N 个或后 N 个值的具体数量。一个典型的例子是按州、国家/地区、收入或数量查看销售额排名前十的客户。你可以设置要显示的值数量，并选择在视觉对象中显示该特定字段的前几个还是后几个值。请注意，“前
    N 项”在筛选整个页面或整个报表时不可用。“前 N 项”筛选仅在视觉对象级别有效。


    日期还有另外两种可用的筛选器类型：相对日期和相对时间。相对时间仅当日期字段同时包含时间分量时才会显示。这些筛选选项允许你为视觉对象或报表设置特定的时间间隔，例如最近
    10 天、下周或最近一年。相对时间则可以让你细化到小时和分钟。


    ## 其他窗格快速概览


    默认情况下有四个窗格不可见，但你可以在“视图”选项卡中将其打开，它们会按照你添加的顺序出现。这些窗格分别是“书签”、“选择”、“性能分析器”和“同步切片器”窗格。请参见图
    2-25。


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_62_0.png)


    图 2-25. 这就是“书签”、“选择”、“性能分析器”和“同步切片器”窗格。


    “书签”窗格允许你保存可能为给定报表页面设置的筛选器、钻取和其他条件，就像一个可以返回的书签。例如，假设我们的报表页面示例显示了所有数据，但我们希望最终用户能够快速将报表切换为特定的筛选视图。我们可以使用“书签”在页面条件之间切换。“书签”是一个非常强大的功能，我们稍后将更详细地讨论。


    “选择”窗格允许你快速管理报表中对象的可见性和层叠顺序。假设你有一个徽标，希望它始终出现在报表的特定位置，但是当你将视觉对象放到画布上时，徽标会被视觉对象的方框遮住，即使方框与徽标重叠的部分是空白的。要解决这个问题，你可以将徽标移到最前面，并且可以通过此菜单完成该操作并管理整个层叠顺序。你还可以将对象分组，以便将其作为一个整体进行移动和处理。


    “性能分析器”可以帮助你排查报表中某些内容显示时间比预期更长，或加载速度比以前更慢的原因。你可以使用“性能分析器”收集信息，了解生成 DAX 查询、可视化结果以及其他项目（包括
    Power BI 为创建视觉对象而生成的 DAX）所需的毫秒数。虽然机器生成的 DAX 并不总是最容易让初学者学习，但当你积累了一些 DAX 经验后，了解所有筛选器和行上下文以查看
    Power BI 如何生成适当的代码来驱动视觉对象将会很有用。同样，当报表出现问题时，你可以测试不同的配置，看看报表性能是提升还是下降。


    要讨论的最后一个窗格是“同步切片器”窗格。当你将切片器视觉对象放到报表上时，它们仅在该页面中起作用。但是，使用“同步切片器”窗格，你可以选择一个切片器并将其添加到其他页面并使其同步——这样，当一个页面上的切片器发生变化时，其他所有页面上的该切片器也会随之变化。这对于探索性分析非常有用，例如，当某人查看数据时，发现了一家想要重点研究的特定公司。如果他们在报表的一个部分设置了该筛选器，此操作会将切片器选择传递到所有包含该切片器的其他页面。你甚至可以控制它只同步到
    A 页面，而不同步到 B 页面。


    ## 数据视图


    数据视图允许你查看报表中的表级数据。它会按原始顺序而不是字母顺序显示报表中的列。原始顺序是指列在数据源中的顺序，或者就我们而言，是列在加载到数据模型之前在
    Power Query 中出现的顺序。让我们看一下示例“日期维度”表，了解整个表在数据视图中的样子，如图 2-26 所示。


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_64_0.png)


    图 2-26. 数据视图中的示例表。


    ### 表和列工具


    首先，你会注意到功能区中有两个新的子分区可以交互。当你在“字段”窗格中选中任何表或列时，功能区中的“表工具”选项卡会显示出来。只有当选中特定列时，“列工具”选项卡才会出现。让我们放大图
    2-27 来看一下。


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_64_1.png)


    图 2-27. 新视图，新的功能区选项。


    “表工具”子分区允许你更改表名称、将其标记为日期表，或者像我们之前从功能区操作的那样查看关系。此外，我们还有用于创建度量值表的计算选项。这里没有太多新内容，而且当你选中表或列时，此视图也会在报表视图中出现。


    这里唯一值得讨论的独特功能是“标记为日期表”功能。默认情况下，在后台，Power BI 会为数据模型中的每个日期字段创建一个日期表，其中包含该字段第一个和最后一个日期之间的所有日期。这样做是为了实现日期层次结构功能以及后台的其他一些必要功能。在小型模型中，这没什么大不了的。然而，当你开始使用大型模型（包含几十甚至上百个隐藏日期表）时，模型大小会迅速增长。Power
    BI 允许你通过设置模型中的一个日期表来替代所有这些日期表，从而绕过此过程。由于我有一个日期维度表，我打算这样做，我们将在后续章节中回到这个话题。


    当我选中某一列时，我还可以看到“列工具”选项卡，如图 2-28 所示。


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_65_0.png)


    图 2-28. “列工具”选项卡。


    从左侧开始，我可以看到列的名称以及列的数据类型。在这种情况下，我查看的是“日期”列，它的数据类型是“日期”，与“日期/时间”数据类型不同。我可以选择数据在视觉对象中呈现时的格式。由于它是日期，我可以选择下拉菜单查看各种选项。如果我选中的是包含数字的列，我可以选择将值显示为货币、小数、整数、百分比或科学计数法。“常规”选项将默认采用数据在数据模型中的存储方式。货币、百分比、在值中显示千位分隔符以及设置要显示的小数位数等选项呈灰色显示。



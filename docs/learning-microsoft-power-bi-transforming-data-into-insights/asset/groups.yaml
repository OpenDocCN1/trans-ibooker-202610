    # The Security Subsection


    This subsection has two buttons that are very important. The Manage Roles and
    View As buttons are how we do row-level security (RLS) in Power BI. RLS is a feature
    by which we control how people see the data in our model based on creating roles
    that are formulaically constructed using DAX. Again, we''ll discuss this more
    in a later chapter.'

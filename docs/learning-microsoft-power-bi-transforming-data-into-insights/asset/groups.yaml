  - '[PAGE 10]


    natural language questions using the Q&A feature to get insights from the data.


    Power BI service also includes several other features, such as the ability to
    create special objects known as Dataflows. These dataflows can be used to get
    information in the Power BI service outside of a database, while allowing end
    users to access that data and combine it with other data inside of a Power BI
    Desktop model.


    Developers can manage Deployment Pipelines for workspaces in the Power BI service,
    which lets you create and manage the Development, Test, and Production workspaces.
    Deployment Pipelines enable ongoing development work on Power BI Projects, without
    impacting the user experience for items already being used by end users.


    A new feature in Power BI service gives users the ability to create goals. The
    goals are tracked using data in the Power BI service. Information on the goals
    can then be shared with appropriate users for quick actionable insight.


    In sum, the Power BI service is the critical glue that makes Power BI different
    from, say, simply sharing an Excel workbook around the office. It creates a shared
    space where people can see the same insights securely, while inviting them to
    explore shared data elements that can be curated for meeting the specific needs
    of each end user.


    # The Power Platform


    Now let’s take a step back and look at the big picture: what are the “Power” products
    within the Microsoft family? The Power Platform is a larger compilation of products
    that support each other, with Power BI as just one component. While we won’t train
    you on these other items, it’s good to know what else is out there in case you
    develop a need to integrate one of the products into your Power BI reports in
    the future.


    Power Apps'

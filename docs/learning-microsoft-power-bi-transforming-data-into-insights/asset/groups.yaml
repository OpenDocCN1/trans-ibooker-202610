    ## 报表视图：功能区的主页部分


    Power BI 打开时默认显示报表视图。你可以看到顶部有一个经典的功能区界面，可以用来搜索你可能执行的各种操作。在右侧，你会看到用户界面的窗格部分。这部分与微软在最初的
    Xbox 360 界面上所做的非常相似。


    你可以通过功能区的“视图”部分添加不同的窗格来查看。你也可以将当前可见的窗格最小化，正如上面的示例中，在“可视化”窗格打开的情况下，你可以看到“筛选器”和“字段”窗格被最小化。


    在底部，你会看到“报表页面导航”选项。你可以单击各个报表页面，或者，如果你的报表很大，可以使用箭头在页面列表中滚动浏览，这与在 Excel 中浏览工作表的方式非常相似。最后，在左侧，你会看到三个图标，它们表示视图选择器。视图从上到下依次是“报表”、“数据”和“模型”。功能区菜单会根据你所处的视图而变化。


    从功能区界面开始，默认视图是“主页”选项卡，如图 2-2 所示。“主页”选项卡有几个不同的名称，包括主页视图、主页功能区和主页部分。在后续内容中，我将把不同的部分（主页、插入、建模）称为“选项卡”。


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_24_0.png)


    图 2-2. “主页”选项卡，也称为主页功能区、主页视图或主页部分，是 Power BI Desktop 的默认视图。


    图 2-2 中的所有选项卡或主要功能区部分都被划分为多个“子部分”，并用一条淡色的垂直虚线分隔。各部分的名称位于功能区的底部行。在图 2-2 中，这些子部分分别是：剪贴板、数据、查询、插入、计算、敏感度和共享。因此


    ## 获取数据


    - 全部

    - 文件

    - 数据库

    - Power Platform

    - Azure

    - 在线服务

    - 其他


    - 全部

    - Excel 工作簿

    - 文本/CSV

    - XML

    - JSON

    - 文件夹

    - PDF

    - Parquet

    - SharePoint 文件夹

    - SQL Server 数据库

    - Access 数据库

    - SQL Server Analysis Services 数据库

    - Oracle 数据库

    - IBM Db2 数据库

    - IBM Informix 数据库（Beta）

    - IBM Netezza

    - MySQL 数据库


    - 认证连接器

    - 模板应用

    - 连接

    - 取消


    图 2-4. 这里是完整的“获取数据”窗口，用于当你需要“全套”时，即完整的数据连接器列表。


    如果你单击按钮的下半部分，你会看到一个较小的、截断的列表，其中包含更常用的数据源。当你不需要进入完整的连接器列表时，这会非常方便。这个截断的列表如图 2-5
    所示。


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_27_0.png)


    *图 2-5. 快速数据选择列表是一个较短的数据连接器列表，适用于你只想“简单吃点”的时候。*


    “Excel 工作簿”按钮将立即打开一个资源管理器窗口，以便你导航到 Excel 文件。单击“Power BI 数据集”按钮，将出现一个窗口，以便你可以选择已发布到
    Power BI 服务中的数据集，并通过“实时连接”进行连接。参考图 2-6 中的示例窗口。


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_28_0.png)


    图 2-6. 连接到已存在于 Power BI 服务中的数据集。


    如果你单击“SQL Server”按钮，将出现一个弹出菜单，供你输入服务器名称或地址，以及可选的数据库名称。当你尝试连接时，服务器会要求你提供凭据。你还会看到选择“导入”或“DirectQuery”的选项，我们将在本书后面更详细地讨论这些选项。该窗口如图
    2-7 所示。


    你还可以按“高级选项”按钮，该按钮允许你添加以分钟为单位的命令超时、传递自定义 SQL 语句、包含关系列、使用完整层次结构导航，以及启用 SQL Server
    故障转移支持。


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_29_0.png)


    图 2-7. 连接到你的友好邻居 SQL Server。


    “输入数据”按钮（回到图 2-3）会提供一个界面，如果你使用 Excel，应该会感到熟悉，因为它会打开一个类似表格的结构，你可以在其中添加列、为列命名并将数据放入单元格中，如图
    2-8 所示。需要注意的是，此界面中没有公式功能。它仅用于简单的数据输入。你也可以将信息复制并粘贴到此窗口中，但在该窗口中疯狂复制粘贴之前要小心。这对于测试或者当你想要为模型生成一个查找表时可能很有用，但我建议你不要将大量信息放入这种类型的表格结构中，因为它必须手动管理。


    ### 剪贴板子部分


    继续看“查询”子部分，有两个按钮：“转换数据”和“刷新”。在图 2-11 中，“刷新”按钮呈灰色，因为我的模型中没有数据可供刷新。但是，当该按钮可用并按下时，它将完全刷新数据模型中的所有数据源。


    “转换数据”有两个不同的功能，具体取决于你单击按钮的上半部分还是下半部分。如果你单击上半部分，它会直接带你进入 Power Query 界面，我们将在另一章中更详细地讨论该界面。如果你单击下半部分，你将看到一个下拉菜单，其中包含几个不同的选项。“数据源设置”会打开一个弹出窗口，用于修改这些设置，例如凭据或文件位置等。如果你有参数和变量，也可以在这里修改。


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_32_0.png)


    *图 2-11. “转换数据”选项。（不确定是否需要这个）*


    ### 插入子部分


    接下来是“插入”选项卡，它有三个选项。你可以将新的视觉对象插入到报表页面中，插入文本框，或者向“可视化”窗格中的可视化列表中添加更多可视化对象。


    如果你单击“新建视觉对象”，你会看到一个视觉对象被放置到画布上。默认放置在画布上的视觉对象是“堆积柱形图”。


    “文本框”按钮会将一个文本框放置到画布上，其方式与在 PowerPoint 中的显示方式相同。


    单击“更多视觉对象”按钮后，将显示如图 2-12 所示的内容。如果你选择“从我的文件”，你将被引导至资源管理器窗口，在那里你可以从本地机器上的 pbviz
    文件中选择要添加的视觉对象。


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_33_0.png)


    图 2-12. 从两个可能来源添加视觉对象。


    如果你选择“从 AppSource”，你将看到如图 2-13 所示的窗口。在这里，你可以选择第三方可视化对象以添加到你的可视化列表。


    图 2-13. Power BI AppSource 拥有大量额外的可视化对象，你可以为报表选择这些对象。


    ### 计算子部分


    在“计算”下，你有“度量值”和“快速度量值”。


    度量值是使用 DAX 对数据进行的计算。我们将在本书后面更详细地讨论度量值，但现在，如果你单击“新建度量值”，你会看到功能区下方出现一个公式栏，你可以在其中输入度量值的
    DAX。这类似于你可能在 Excel 中使用的公式栏。


    单击“快速度量值”按钮将出现一个弹出框，帮助你使用包含若干预定义计算向导来创建度量值。你可以在下面的图 2-14 中看到这两者。这里有一个有用的提示：Microsoft
    在某些版本中会添加新的快速度量值，因此，在更新后总是值得回来检查是否添加了新的快速度量值。


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_35_0.png)


    *图 2-14. DAX 公式栏和快速度量值菜单。你会用到这些的。我保证。*


    ### 最后两个子部分：敏感度和共享


    “主页”选项卡上的最后两个按钮涉及敏感度标签以及将报表发布到服务的能力。我们稍后将更详细地讨论这些选项。



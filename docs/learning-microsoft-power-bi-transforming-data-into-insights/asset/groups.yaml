    ## 安全子部分


    此子部分有两个非常重要的按钮。“管理角色”和“查看为”按钮是我们在 Power BI 中实现行级安全性（RLS）的方式。RLS 是一项功能，通过创建基于 DAX
    以公式方式构造的角色，来控制人员如何查看我们模型中的数据。我们将在后面的章节中再次详细讨论这一点。


    功能区的下一个主要部分是“视图”选项卡，如图 2-21 所示。此选项卡很重要，因为它允许你设置主题、设置不同的页面视图以查看用户可能如何查看你的报表等。你想在
    Power BI 中拥有一些 PowerPoint 风格吗？就在这里实现。


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_50_0.png)


    *图 2-21. 使用“视图”选项卡，在 Power BI 中加入一些 PowerPoint 风格。*


    ## 缩放以适合子部分


    在“缩放以适合”中，“页面视图”按钮允许你选择将画布适应页面、适应宽度或按实际大小显示。这与“移动”子部分的“移动布局”按钮密切相关，后者会将报表画布更改为适合在移动设备上显示的报表的大小和形状。在移动报表开发中，由于可用空间更为有限，你需要考虑的事项与标准报表开发有很大不同。


    ## 页面选项子部分


    在此子部分中，你可以选择三个按钮。可以显示网格线、使项目对齐到网格，以及锁定对象。


    网格线有助于为你提供项目相对其他项目位置的参考指引。


    “对齐到网格”仅在移动布局中起作用，并会强制所有视觉对象整齐地适应给定的像素密度。


    “锁定对象”可防止页面上的项目被移动。


    ## 显示窗格子部分


    “显示窗格”子部分是“视图”选项卡上的最后一个子部分。此子部分与可以在用户界面的该部分随时添加或删除的不同窗格相关。


    本章稍后我们将详细介绍这些功能和用户界面，但作为总体概述，“筛选器”窗格允许你在视觉对象、页面或报表级别修改筛选器。


    “书签”允许你将报表页设置为特定的状态，然后在以后返回该状态，就像网页书签一样。


    “选择”窗格显示每个报表页中画布上的所有对象，并允许你快速选择特定对象。你还可以使用它来对对象进行分组，并在对象可能重叠时确定其重要性的层级。


    “性能分析器”允许你查看哪些因素影响报表页的性能，并允许你提取机器生成的 DAX。


    “同步切片器”窗格允许你确定哪些切片器（如果有）应在各报表页之间同步，从而在不同报表页之间保持比较一致。


    ## 报表视图：帮助部分


    功能区上的“帮助”选项卡为你提供一种查看正在使用的 Power BI Desktop 版本的方法，并提供指向引导式学习、培训视频、文档和支持链接的链接，如图
    2-22 所示。


    ### 社区子部分


    我将跳到“社区”子部分，因为“信息”、“帮助”和“资源”子部分不言自明。此外，“社区”子部分非常强大。


    在“社区”下，你会找到指向 Power BI 博客的链接、连接到更广泛的 Power Platform 社区的途径、面向开发人员的特定文档（称为“适用于开发人员的
    Power BI”）、为 Power BI Desktop 提交想法的能力，以及常用外部工具的链接。


    我确实想强调提交和投票想法，因为这会对你有帮助。Microsoft Power BI 开发团队已多次表示，他们会倾听这些想法，并关注哪些内容获得投票。几乎每一两个月，软件就会有一次更新，他们会讨论某个想法在
    ideas.powerbi.com 上的受欢迎程度。因此，如果你有想法，这里就是合适的论坛。


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_55_0.png)


    *图 2-22. 我们都需要朋友的些许帮助，而“帮助”选项卡正是获取帮助的地方。*



    # The Community Subsection


    I’m going to skip to the Community subsection because the Info, Help, and Resources
    subsections are self-explanatory. Plus, the Community subsection is very powerful.


    Under Community, you’ll find links to the Power BI Blog, ways to connect to the
    broader Power Platform community, specific documentation for developers (called
    Power BI for Developers), the ability to Submit an Idea for Power BI Desktop,

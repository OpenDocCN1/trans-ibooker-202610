  Power BI Desktop 是一款强大的数据可视化工具，允许你获取数据并以各种不同的方式从中创建可视化洞察。在本章中，我们将介绍 Power BI Desktop
  界面的基础知识，重点讨论报表视图和数据视图。


  接下来会非常详细，请保持耐心。本章的某些部分可能会有点枯燥，因为我会专注于用户界面（UI）的功能，而不一定是我们如何使用它。


  我们的大部分注意力将集中在报表视图上，因为那是你工作最多的地方。此外，报表视图拥有最多可交互的元素。在 UI 中，你需要了解的两个最重要部分是功能区中“开始”选项卡的功能和“可视化”窗格，请在阅读时记住这一点。


  Microsoft 曾表示，他们为 Power BI Desktop 设定的目标是使其成为“你的数据的 PowerPoint”。在本书撰写时，你可以看到 Power
  BI 已经采用了 Microsoft Office 家族中其他工具（包括 PowerPoint）的许多设计原则。


  如果你从 2010 年起使用过任何其他 Microsoft Office 产品，你就会在 Word、Excel、PowerPoint 和其他产品中见过某种版本的
  Ribbon 用户界面。对这种界面的熟悉能为你带来优势，但 Power BI 的用户界面确实有一些独特之处。你会时不时地看到 Power BI 根据项目选择的上下文在功能区中添加或移除项目，这在最初可能会让人感到有些别扭。



  图 2-13. Power BI AppSource 拥有大量额外的可视化对象，你可以为报表选择这些对象。


  ### 计算子部分


  在“计算”下，你有“度量值”和“快速度量值”。


  度量值是使用 DAX 对数据进行的计算。我们将在本书后面更详细地讨论度量值，但现在，如果你单击“新建度量值”，你会看到功能区下方出现一个公式栏，你可以在其中输入度量值的
  DAX。这类似于你可能在 Excel 中使用的公式栏。


  单击“快速度量值”按钮将出现一个弹出框，帮助你使用包含若干预定义计算向导来创建度量值。你可以在下面的图 2-14 中看到这两者。这里有一个有用的提示：Microsoft
  在某些版本中会添加新的快速度量值，因此，在更新后总是值得回来检查是否添加了新的快速度量值。


  ![](img/f5dc9faf226ccd0a92e48aecbde6db96_35_0.png)


  *图 2-14. DAX 公式栏和快速度量值菜单。你会用到这些的。我保证。*


  ### 最后两个子部分：敏感度和共享


  “主页”选项卡上的最后两个按钮涉及敏感度标签以及将报表发布到服务的能力。我们稍后将更详细地讨论这些选项。






  ## 报表视图：插入选项卡


  在 Report 视图的 ribbon 下，接下来我们进入图 2-15 所示的插入选项卡。


  ![](img/f5dc9faf226ccd0a92e48aecbde6db96_36_0.png)


  图 2-15. Ribbon 中的插入选项卡。


  ### 页面子部分


  在页面子部分，无论点击哪个部分，新建页面按钮都会弹出一个下拉菜单。该菜单提供两个选项：空白页面和复制页面。空白页面会在报告的最右侧创建新页面。复制页面会按当前配置完整复制当前报告页面，包括画布上的所有视觉对象，新副本会位于报告所有其他页面的最右侧。


  ### 视觉对象子部分


  视觉对象子部分有两个与主页选项卡中完全相同的按钮，即新建视觉对象和更多视觉对象按钮。它们的功能也完全相同。这里重复提供是为了方便，如果你想在 ribbon 的这一子部分中放置内容到画布上，可以直接在这里操作。


  ### AI 视觉对象子部分


  插入选项卡中的下一个子部分是 AI 视觉对象，如图 2-15 所示。截至本文撰写时，已有四种 AI 驱动的视觉对象正式发布。如果你点击其中任何一个，它会将该视觉对象的空白版本放置到画布上尽可能靠上、靠左的位置。我们将在第
  3 章更详细地讨论这些视觉对象，在那里我们将全面介绍 Power BI 原生提供的所有视觉对象。


  这里需要注意的是，这些视觉对象在分析能力方面提供了非常独特的功能。微软希望在尽可能多的 Power Platform 产品中展示其 AI 实力，Power BI
  也不例外。我预计未来会有更多 AI 驱动的视觉对象逐步进入正式发布。


  ### Power Platform 子部分


  下一个子部分 Power Platform 处理的是技术上属于视觉对象，但从根本上与其他所有平台视觉对象不同的项目。Power Platform 视觉对象提供了与我们之前讨论过的
  Power Platform 其他部分进行交互和集成的能力，将其嵌入到你的 Power BI 报表中。我们稍后会更详细地讨论这些内容，但请知晓它们非常强大，有助于展示
  Power Platform 在组织内部的整体价值。


  ### 元素子部分


  插入选项卡的最后一个子部分元素，处理的是报表元素。这些项目不像 Power BI 视觉对象那样一定是交互式的，但它们可以帮助增强报表或使其更清晰。不同的元素选项包括文本框、按钮、形状和图像控件。


  Power BI 中的文本框与 PowerPoint 中的功能完全相同。它在画布上放置一个可编辑的文本框，并附带基本的文本格式工具。该工具允许你更改字体、字号、文字颜色、加粗、斜体、下划线、文本对齐，并为报表外的网页添加超链接。文本框的其他元素可以在选中文本框时出现的格式文本框窗格中进行编辑。参见图
  2-16 中画布上的示例。


  ![](img/f5dc9faf226ccd0a92e48aecbde6db96_41_0.png)


  图 2-16. 文本框界面让你可以应用各种格式选项。


  按下按钮元素即可获得可帮助报表导航或提供额外信息的选项列表。选项相当多，因此图 2-17 显示了完整列表，以便你开始思考如何在未来的报表中使用它们。


  ![](img/f5dc9faf226ccd0a92e48aecbde6db96_42_0.png)


  图 2-17. 按钮……目之所及皆是按钮。


  需要注意的是，对于所有这些按钮，除了 Q&A 和书签之外，将按钮放置在画布上并不会起作用，直到你为 Power BI 提供该按钮的使用上下文。当你在画布上放置其中一个按钮时，右侧会出现格式按钮窗格，其中包含视觉格式选项，并注明该按钮应执行的操作。


  Q&A 和书签按钮已分别默认设置为 Q&A 和书签功能。然而，你仍然可以将这些操作更改为其他操作，如果你认为报表在不同上下文中使用该按钮会更合适。


  形状按钮会显示可放入报表的各种形状列表。形状被选中时，会以基于你主题的默认颜色填充后出现在画布上。你可以从那里通过调整画布上视觉对象的大小来更改它。选中时也可以进行格式调整，因为形状有其专用的窗格。


  最后，如果你选择图像按钮，资源管理器窗口会弹出，以便你选择要导入 Power BI 报表中的图像。Power BI 可以添加以下格式的图片，如图 2-18 所示。顺带一提，GIF
  有正确的发音方式……不要站错队。


  ![](img/f5dc9faf226ccd0a92e48aecbde6db96_43_0.png)


  图 2-18. 说真的，几乎每个人都有对应的图像格式。


  一旦图像出现在报表页面上，与 ribbon 元素子部分中的所有其他项目一样，选中后右侧会出现其专用的格式窗格。形状可以像所有其他 Power BI 元素一样，通过点击并拖动框来修改报表中的大小。


  ## 报表视图：建模选项卡


  Report 视图中 ribbon 的第三部分是建模选项卡。在这里你可以在 Report 视图中获得更多的数据管理选项。图 2-19 中有很多魔力。


  ![](img/f5dc9faf226ccd0a92e48aecbde6db96_43_1.png)


  图 2-19. 建模数据对于在 Power BI 中取得成功至关重要。


  ### 关系子部分


  首先是管理关系。该按钮打开一个窗口，让你查看模型中的所有关系，并在此处添加或编辑现有关系。


  默认情况下，Power BI 会根据列名自动检测关系。这对于为数据模型建立初始关系集很有用，但不一定总是你想要的模型设置方式。需要注意的是，如果你的数据模型中少于两个表，该按钮将被禁用。我们将在下一章讨论模型视图时更详细地介绍关系。


  ### 计算子部分


  下一个区域涉及计算。新建度量和快速度量按钮的功能与之前关于主页选项卡的描述完全相同。


  另外两个项目是提示，会弹出我们之前展示的内联 DAX 编辑器，以便你从新建列按钮创建 DAX 计算列，或从新建表按钮创建 DAX 计算表。请注意，新建列按钮有一个不便的怪癖。如果你未在字段窗格中先高亮一个表再选择此按钮，Power
  BI 会假设计算列将进入该窗格中它看到的第一个表。


  ### 页面刷新子部分


  页面刷新子部分有一个变更检测按钮，仅在 DirectQuery 场景中相关。你可以确定是否希望在检测到数据变更时刷新页面，或按固定的刷新间隔刷新。你可以在 Power
  BI Desktop 中使用此功能模拟该功能。


  ### What If 子部分


  What If 仅允许你创建假设参数。它们将在第 6 章中进一步详细讨论。






  ## 安全子部分


  此子部分有两个非常重要的按钮。“管理角色”和“查看为”按钮是我们在 Power BI 中实现行级安全性（RLS）的方式。RLS 是一项功能，通过创建基于 DAX
  以公式方式构造的角色，来控制人员如何查看我们模型中的数据。我们将在后面的章节中再次详细讨论这一点。


  功能区的下一个主要部分是“视图”选项卡，如图 2-21 所示。此选项卡很重要，因为它允许你设置主题、设置不同的页面视图以查看用户可能如何查看你的报表等。你想在
  Power BI 中拥有一些 PowerPoint 风格吗？就在这里实现。


  ![](img/f5dc9faf226ccd0a92e48aecbde6db96_50_0.png)


  *图 2-21. 使用“视图”选项卡，在 Power BI 中加入一些 PowerPoint 风格。*


  ## 缩放以适合子部分


  在“缩放以适合”中，“页面视图”按钮允许你选择将画布适应页面、适应宽度或按实际大小显示。这与“移动”子部分的“移动布局”按钮密切相关，后者会将报表画布更改为适合在移动设备上显示的报表的大小和形状。在移动报表开发中，由于可用空间更为有限，你需要考虑的事项与标准报表开发有很大不同。


  ## 页面选项子部分


  在此子部分中，你可以选择三个按钮。可以显示网格线、使项目对齐到网格，以及锁定对象。


  网格线有助于为你提供项目相对其他项目位置的参考指引。


  “对齐到网格”仅在移动布局中起作用，并会强制所有视觉对象整齐地适应给定的像素密度。


  “锁定对象”可防止页面上的项目被移动。


  ## 显示窗格子部分


  “显示窗格”子部分是“视图”选项卡上的最后一个子部分。此子部分与可以在用户界面的该部分随时添加或删除的不同窗格相关。


  本章稍后我们将详细介绍这些功能和用户界面，但作为总体概述，“筛选器”窗格允许你在视觉对象、页面或报表级别修改筛选器。


  “书签”允许你将报表页设置为特定的状态，然后在以后返回该状态，就像网页书签一样。


  “选择”窗格显示每个报表页中画布上的所有对象，并允许你快速选择特定对象。你还可以使用它来对对象进行分组，并在对象可能重叠时确定其重要性的层级。


  “性能分析器”允许你查看哪些因素影响报表页的性能，并允许你提取机器生成的 DAX。


  “同步切片器”窗格允许你确定哪些切片器（如果有）应在各报表页之间同步，从而在不同报表页之间保持比较一致。


  ## 报表视图：帮助部分


  功能区上的“帮助”选项卡为你提供一种查看正在使用的 Power BI Desktop 版本的方法，并提供指向引导式学习、培训视频、文档和支持链接的链接，如图 2-22
  所示。


  ### 社区子部分


  我将跳到“社区”子部分，因为“信息”、“帮助”和“资源”子部分不言自明。此外，“社区”子部分非常强大。


  在“社区”下，你会找到指向 Power BI 博客的链接、连接到更广泛的 Power Platform 社区的途径、面向开发人员的特定文档（称为“适用于开发人员的
  Power BI”）、为 Power BI Desktop 提交想法的能力，以及常用外部工具的链接。


  我确实想强调提交和投票想法，因为这会对你有帮助。Microsoft Power BI 开发团队已多次表示，他们会倾听这些想法，并关注哪些内容获得投票。几乎每一两个月，软件就会有一次更新，他们会讨论某个想法在
  ideas.powerbi.com 上的受欢迎程度。因此，如果你有想法，这里就是合适的论坛。


  ![](img/f5dc9faf226ccd0a92e48aecbde6db96_55_0.png)


  *图 2-22. 我们都需要朋友的些许帮助，而“帮助”选项卡正是获取帮助的地方。*


  ## 报表视图：外部工具部分



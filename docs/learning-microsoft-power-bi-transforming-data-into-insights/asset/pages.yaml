- pgno: 18
  md: '# What Makes Power BI Different from its Competitors?


    Honestly, there has never been a better time to be a data analyst than today.
    Many of the tools in the marketplace have a variety of strengths and weaknesses,
    and Power BI is no exception. In fact, just to see how many competitors there
    are in this marketplace, let’s take a quick look at Figure 1-2, which shows Gartner’s
    Magic Quadrant for Analytics and Business Intelligence Platforms for 2021.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Figure 1: Magic Quadrant for Analytics and Business Intelligence Platforms


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_19_0.png)


    Source: Gartner (February 2021)


    Figure 1-2. Gartner’s Magic Quadrant for Analytics and Business Intelligence platforms.


    Now, whatever you think about the position of the competitors on the analysis,
    the sheer number of them can be enough to make your head spin. Each competitor
    has a reason they’re in the market today. Notice, though, that in the leader’s
    quadrant there are only three players, Qlik, Tableau, and Microsoft.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'The real source of differentiation between Microsoft and its competitors in
    this space is the ability to execute on their plan for their software. Microsoft
    has a more-than-30-year history in business intelligence, and SQL Server is itself
    now over 30 years old. Microsoft has been in this game a very long time and has
    the highest number of supporting technologies to its business intelligence platform,
    as compared to the others.


    All these major competitors offer products that allow you take data and turn it
    into great data visualizations that help you learn something you didn’t know from
    your data. I will forever be jealous of Tableau’s ability to click and drag for
    groupings, for instance.


    # Why Power BI, and Examples of Its Use Across the Globe


    Regardless of Tableau’s dazzle, Power BI offers a tool for data ingestion that
    is unequaled in terms of ease of use for non-technical resources in Power Query.
    It also has one of, if not the strongest analysis engines on the planet today
    in the form of Analysis Services tabular. These tools have accelerated the rate
    of data democratization inside many organizations. Power BI has created citizen
    data analysts around the world who use data to do transformative work. Indeed,
    by putting in the effort to read and digest this book, you’re taking the steps
    necessary to join that community!


    Here are some examples. The world’s leading conversation organization, the World
    Wide Fund for Nature, uses Power BI to share impact effects with donors. Engineers
    at Cummins use Power BI to do advanced capacity planning to get engines out the
    door more quickly. Humana leverages Power BI to centralize and visualize data
    against more than 45 different unique data sources across its enterprise, using
    Power BI as a consolidation platform for end users. King’s College London uses
    Power BI’s Artificial Intelligence visuals to identify key factors that could
    identify shifts in student performance, allowing for targeted outreach to maximize
    the opportunities for student success. These are just some of the varied use cases
    happening today on this platform.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Power BI has decades of Analysis Services experience behind it, with a front
    end that can now match its promise. In addition, Microsoft releases updates for
    Power BI Desktop every single month with new features, connectors, and visualizations.
    Microsoft is committed to the Power Platform, and it’s safe to say Microsoft will
    be here for the long haul. When 97% of the Fortune 500 agree on something, there’s
    probably a good reason.


    # Summary


    Power BI at its core is more than just a desktop authorship tool. It’s an entire
    platform that Microsoft has been working towards for the better part of three
    decades. It has the unique strength of having two of the most enterprise-tested
    analysis engines in the world with VertiPaq and DAX. It also has a great tool
    to allow non-technical users to get disparate data together and begin real analysis
    on that data with Power Query.


    Power BI Desktop is now an enterprise-level solution that is used by the world’s
    largest companies, non-profits, and even small businesses to help get insights
    from their data that would have previously been impossible.


    With an understanding of what Power BI is, we are ready to finally open the software
    with a clear vision about what we’ll do with it. That begins with the Report view,
    so get a soda, pet your dog, and let’s dive in. This next chapter will go into
    the user interface and how to use it.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Chapter 2. The User Interface I: Report and Data Views


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 2nd chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the author at feedback.powerbifundamentals@outlook.com.


    Power BI Desktop is a robust data visualization tool that allows you to take your
    data and create visualized insights from it in a variety of different ways. In
    this chapter, we’ll go over the basics of the Power BI Desktop interface, specifically
    looking at the Report and Data views.


    It’s going to get pretty detailed, so stay with me. Parts of this chapter might
    be a bit dry since I’m going to concentrate on what the user interface (UI) does,
    not necessarily on how we’ll use it.


    A majority of our focus will be on the Report view because that’s where you’ll
    be working the most. Plus, Report view has the largest number of elements to interact
    with. The two most important things you need to know about in the UI are the functions
    of the Home tab of the ribbon and the Visualization pane, so keep that in mind
    as you read.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Microsoft said their goal for Power BI Desktop was to make it “PowerPoint for
    your data.” As of the writing of this book, you can see that Power BI has adopted
    many design principles from other tools in the Microsoft Office family, PowerPoint
    included.


    If you’ve used any other Microsoft Office product since 2010, you’ve seen some
    version of the Ribbon user interface in Word, Excel, PowerPoint, and other products.
    Having that familiarity with the interface gives you an advantage, but the Power
    BI user interface does have some quirks. Now and then, you’ll see that Power BI
    will add and remove items from the ribbon based on item selection context, which
    can feel awkward at first.


    Let’s look at how Power BI integrates the ribbon and show you the first thing
    you’ll see when you open Power BI Desktop. See Figure 2-1.


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_23_0.png)


    Figure 2-1. This is the first thing you see when you open Power BI Desktop.


    Looking at the View Selector in Figure 2-1 we see three possible views, the Report
    view, the Data view, and the Relationship view.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Report View: Home Section of the Ribbon


    Power BI defaults to the Report view when you open it. You can see there’s a classic
    Ribbon interface at the top that allows you to search for different actions you
    might take. On the right, you’ll see the pane portion of the UI. This part is
    very similar to what Microsoft did with the original Xbox 360 interface.


    You can add different panes to see using the View portion of the ribbon. You can
    also take panes that are currently visible and minimize them, as you can see with
    the Filters and Fields panes in the example above where the Visualizations pane
    is open.


    At the bottom, you’ll see the Report Page Navigation options. You can click on
    individual report pages or, if your report is large, you can use the arrows to
    scroll across your list of pages, very similar to how you would explore worksheets
    in Excel. Finally, on the left, you’ll see the three icons that indicate the view
    selector. The views in order from top to bottom are Report, Data, and Model. The
    Ribbon menu changes based on which view you are in.


    Starting with the Ribbon interface, the default view is the Home tab, as seen
    in Figure 2-2. The Home tab goes by a few different names, including Home view,
    Home ribbon, and Home section. I’ll refer to the different parts (Home, Insert,
    Modeling) as “tabs” moving forward.


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_24_0.png)


    Figure 2-2. The Home tab, also called the Home ribbon, Home view, or Home section,
    is Power BI Desktop’s default view.


    All of the tabs or main ribbon sections in Figure 2-2 are divided into “subsections”
    and separated by a faint vertical line. The names of the sections are on the bottom
    row of the ribbon. In Figure 2-2, the subsections are Clipboard, Data, Queries,
    Insert, Calculations, Sensitivity, and Share. So'
  merge: -1
  img_proc: true

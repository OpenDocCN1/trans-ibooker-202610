- pgno: 32
  md: '# # The Clipboard Subsection


    Moving on to the Queries subsection, there are two buttons, Transform Data and
    Refresh. Refresh is greyed out in Figure 2-11 because I have no data in my model
    to refresh. However, when that button is available and pressed, it will do a complete
    refresh of all data sources in your data model.


    Transform Data has two separate functions, depending on whether you click the
    top or bottom of the button. If you click the top half, it takes you straight
    to the Power Query interface, which we will discuss in more detail in another
    chapter. If you click the bottom half, you’ll get a drop-down menu with a couple
    different options. Data Source Settings takes you to a pop-up to modify those
    settings for things like credentials or locations of files and the like. If you
    have parameters and variables, they can be modified here, as well.


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_32_0.png)


    *Figure 2-11. Transform Data options. (Not sure we need this one)*


    # # The Insert Subsection


    Next is the Insert tab, which has three options. You can insert a new visual onto
    your report page, insert a text box, or add more visualizations to your list of
    visualizations in the Visualizations pane.


    If you click on New Visual, you’ll see a visual will be put onto your canvas.
    The default visual that will be placed on the canvas is the Stacked Column Chart.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'The Text Box button will put a text box onto your canvas in the same way it
    would appear in Power Point.


    The More Visuals button, when clicked, will look like Figure 2-12. If you select
    from My Files, you’ll be directed to an Explorer window where you can select a
    visual to add from a pbviz file you have on your local machine.


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_33_0.png)


    Figure 2-12. Adding visuals from two possible sources.


    If you select From AppSource, you’ll see the window shown in Figure 2-13. Here
    you can select a third-party visualization to add to your list of visualizations.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Figure 2-13. Power BI AppSource has a wealth of additional visualizations you
    can select for your reports.


    # The Calculations Subsection


    Under Calculations, you have Measures and Quick Measure.


    Measures are calculations across your data using DAX. We will discuss measures
    more later in this book, but, for now, if you click on New Measure, you’ll see
    a formula bar appear below the ribbon where you can put in the DAX for your measure.
    This is like the formula bar you might use in Excel.


    The Quick Measure button will have a pop-up box that appears to help you create
    a measure using a wizard with several predefined calculations. You can see both
    below in Figure 2-14. Here’s a helpful tip: Microsoft adds new'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'quick measures in some releases, so it’s always worth going back after an update
    to see if new quick measures have been added.


    ![](img/f5dc9faf226ccd0a92e48aecbde6db96_35_0.png)


    *Figure 2-14. The DAX Formula Bar and Quick Measure menu. You will use these.
    I promise.*


    # The Final Subsections: Sensitivity and Share


    The last two buttons on the Home tab deal with sensitivity labels and the ability
    to publish your report to service. We’ll deal more with these options later.'

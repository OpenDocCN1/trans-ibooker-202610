    TPM 2.0 specification. The vTPM enables attestation by verifying the integrity
    of the virtual machine’s whole boot chain (UEFI, boot loader, OS, system, and
    drivers). Trusted launch utilizes vTPM to perform cloud-based remote attestation,
    which is used for platform health assessments and decisions based on trust. As

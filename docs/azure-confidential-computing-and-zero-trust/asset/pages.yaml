  md: 'Microsoft Research developed the CCF for building secure, highly available,
    and performant applications that focus on multi-party compute and data. It combines
    TEEs and flexible decentralized governance to enable scalable and high-performance
    confidential applications, backed by an immutable ledger for auditability purposes.
    Figure 4-1 shows key characteristics of the CCF.


    ![](img/521134c58cee92470f3ee0ff421e2295_51_0.png)



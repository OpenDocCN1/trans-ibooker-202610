    Protect/encrypt data that is in use, while in RAM, and during computation


    Figure 1-1. Confidential computing in the data protection lifecycle


    In a nutshell, the primary goal of confidential computing is to protect the data
    in use during computation by using a hardware-based, attested TEE. We will discuss
    why attestation is crucial for confidential computing in the next section. For
    now, let''s examine some of the key characteristics of a TEE and the role it plays
    in confidential computing.


    # NOTE


    Please note that there are several techniques to protect data while it is in use
    during computation, with varying degrees of maturity, including but not limited
    to homomorphic encryption (HE), secure multiparty computation (SMPC), and zero-knowledge
    proof (ZKP). Please see Appendix B for additional resources on privacy-enhancing
    technologies.


    # Memory Isolation Levels'

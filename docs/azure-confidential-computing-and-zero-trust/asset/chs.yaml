  本报告探讨了保密计算的基本原理、其在保护使用中数据隐私方面的作用，以及它如何与零信任原则保持一致。它还概述了 Microsoft ACC 如何将保密计算引入 Azure
  云。ACC 通过提供由加密证明支持的保证，使组织能够在云中部署高度敏感的工作负载，确保其工作负载（包括数据和代码）在使用时不会被任何未经授权的方（包括 Microsoft）访问。这通过在使用
  ACC 功能（如证明）时消除任何隐式信任，从而实现纵深防御并遵守零信任原则，这些功能可确保硬件和软件未被篡改。此外，此策略使组织能够完成数据安全的整个三位一体：静态数据、传输中数据和使用中数据的保护。它帮助组织以“始终假设已发生泄露”的思维方式运营，这是零信任的基本原则。


- '## 前言


  传统系统加密静态数据和传输中数据，但无法加密正在使用的数据。机密计算将数据保护扩展到内存中正在使用的数据，从而在整个数据生命周期内实现保护，并增加另一层防御，增强知识产权
  (IP) 保护、数据隐私和数据完整性。这在当今尤为关键，因为数据集和用于分析这些数据集的机器学习软件的指数级增长，导致人们对数据和代码暴露方式的审查日益严格。


  机密计算通过将数据隔离在可信执行环境 (TEE) 内来保护正在使用的数据，TEE 就像数据处理的密封盒。从外部看，数据似乎是加密的，只有在密钥持有者验证后才会在
  TEE 内解密。这种隔离植根于硬件，有效地使即使是云托管基础设施及其管理员也无法访问数据。


  这意味着可以将零信任理念纳入服务设计中。可以根据最小权限访问原则对数据进行分段。例如，数据可能仅可由需要访问以执行其功能的代码访问，而系统中所有其他代码只能看到加密数据。最小权限访问不是机密计算强制执行零信任原则的唯一方式。零信任还包括验证
  TEE 内硬件和软件适当状态的能力，从而支持零信任“始终验证”的原则。最后，机密计算支持“假设已发生泄露”的原则，因为任何不在 TEE 内的软件都无法访问 TEE
  的内存，即使该软件被攻破。


  机密计算不仅有助于组织改善安全态势，还能帮助释放数据的更多潜力，推动创新，并赋能企业和开发人员构建之前因安全或隐私限制而受阻的新型服务。组织可以在不向其他方泄露数据的前提下，对合并数据集进行协作，实现比单一公司独立发现更丰富的洞察。他们还可以让人工智能
  (AI) 研究人员以保护隐私的方式访问数据集。这将有助于解锁隐私增强型个人 AI 服务，提供可信且透明的硬件和软件供应链，并彻底改变跨各个领域大规模解决问题的方式。


  Microsoft 并非独自使用机密计算来推动数据保护的发展。机密计算联盟 (CCC) 的成立旨在使硬件供应商、云服务提供商和构建软件的公司能够协作并共同创造造福所有人的解决方案。这个跨行业团队正在合作，确保机密计算成为计算的新常态，特别是通过制定标准和实践，确保机密计算设备、协议和服务的互操作性。在不久的将来，“机密计算”将只是“计算”。


  本报告旨在介绍机密计算、它如何从硬件级别开始支持零信任，以及它如何造福当今的 Azure 客户。它还提供了 Azure 机密计算产品和功能组合的快照，以及了解更多信息的链接。它将帮助组织探索、理解并考虑这项技术如何创造更安全、更具创新性的未来。


  *Mark Russinovich*

  *Azure 首席技术官和技术院士*

  *微软*


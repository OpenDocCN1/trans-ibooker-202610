  \ Azure 托管 CCF | |\n\n### ACC 虚拟机\n\nACC 虚拟机是希望将现有 VM 工作负载迁移到 Azure 的客户的构建基块。它们包括机密虚拟机、带有应用安全区的虚拟机以及带有机密\
  \ GPU 的机密虚拟机。\n\n### 机密虚拟机\n\n机密虚拟机提供强大的安全性和保密性，以及硬件强制执行的边界，以满足最严格的安全要求。机密虚拟机特别适用于客户迁移现有工作负载并寻求在不修改代码的情况下将应用程序“提升并移位”的场景，同时确保平台防止未经授权的实体读取或更新\
  \ VM 的状态。机密虚拟机可以与使用客户托管密钥加密的磁盘配对，帮助确保客户随时控制对其数据的访问。作为受信任启动的一部分，安全启动功能也在所有机密虚拟机中默认启用，以提供额外的完整性和保护。\n\
  \n图 3-2 说明了机密虚拟机如何防止虚拟机监控程序读取或修改 VM 状态（即，虚拟机监控程序位于 TEE 之外）。\n\n机密虚拟机\n应用程序 (app)\n\
  1. 证明\n2. 执行\n\n加密内存\n(保密性和完整性)\n\n虚拟机监控程序\n\nCPU BIOS、设备驱动程序, ...\n\n硬件\n\n图 3-2.\
  \ 机密虚拟机\n\n请阅读文章“DCasv5 和 ECasv5 系列机密虚拟机”以获取更多详细信息。\n\n### 带有应用安全区的虚拟机\n\n带有应用安全区\
  \ (app enclave) 的虚拟机使用 Intel 软件防护扩展 (SGX) 技术支持代码级别隔离。在创建应用安全区时，识别应用程序的哪个部分在安全区内运行非常重要。安全区将该部分代码与应用程序的其余部分隔离开来。安全区初始化代码并将其加载到内存后，不受信任的组件无法读取或修改该代码，该代码由底层\
  \ SGX 固件生成的唯一密钥加密。应用安全区如图 3-3 所示。\n\n应用程序 (app)\n\n安全区\n\n应用程序的受信任部分\n\n应用程序的不受信任部分\n\
  \n1. 划分应用程序\n2. 创建安全区\n3. 证明\n4. CallTrusted()\n7. 业务逻辑\n\n5. 执行\n6. 返回\n\n调用桥\n\
  \n硬件\n\nOS、VMM、BIOS, ...\n\n请阅读文章“应用安全区开发”以获取更多详细信息。\n\n### 带有机密 GPU 的机密虚拟机\n\n\
  Microsoft Azure 提供了基于采用 SEV-SNP 技术的 AMD CPU 和使用机密计算的 NVIDIA® H100 Tensor Core GPU\
  \ 的带有机密 GPU 的机密虚拟机的预览版。\n\n带有机密 GPU 的机密虚拟机的目标是在 Azure 中建立一个安全环境，用于运行受益于 GPU 加速的机器学习工作负载，并增加一层安全性，以确保虚拟机在受信任环境中启动和运行。用于模型的数据以及模型本身的代码保持加密状态，而\
  \ VM 则利用 GPU 的增强性能来运行机器学习和基于 AI 的应用程序。\n\n请阅读文章“宣布推出带有 NVIDIA H100 Tensor Core GPU\
  \ 的 Azure 机密虚拟机预览版”以获取更多详细信息。\n\n### ACC 基于容器的 PaaS\n\nAzure 当前提供四种机密容器 PaaS。有些具有\
  \ VM 级别内存隔离 (适用于 AKS 的机密 VM 节点池)，有些具有代码级别内存隔离 (适用于 AKS 的带应用安全区 VM 节点池)，有些具有容器组级别内存隔离\
  \ (ACI 上的机密容器和 AKS 上的机密容器)。表 3-1 按内存隔离级别汇总了此类 ACC 容器服务的分类。\n\n表 3-1. 按内存隔离级别划分的\
  \ ACC 容器服务\n\n| 内存隔离级别 | 服务 |\n|---|---|\n| 虚拟机 | 适用于 AKS 的机密 VM 节点池 |\n| 代码 | 适用于\
  \ AKS 的带应用安全区 VM 节点池 |\n| 容器组 | ACI 上的机密容器，AKS 上的机密容器 |\n\n### 适用于 Azure Kubernetes\
  \ Service (AKS) 的机密 VM 节点池\n\n机密节点池利用具有基于硬件的可信执行环境 (TEE) 的 VM。它们通过拒绝虚拟机监控程序和其他主机管理代码访问\
  \ VM 内存和状态，以及防止云操作员访问，为 AKS 提供纵深防御功能。这些功能使高度敏感的容器工作负载能够在无需重构代码的情况下迁移到 AKS，同时保持 VM\
  \ 级别内存隔离。\n\n请阅读文章“使用 AMD SEV-SNP 机密虚拟机在 AKS 上支持机密 VM 节点池”以获取更多详细信息。\n\n### 适用于\
  \ Azure Kubernetes Service (AKS) 的带应用安全区 VM 节点池\n\n带应用安全区 VM 节点池能够在 AKS 内以一种方式执行容器化应用程序，该方式保护安全区中的代码不受操作员或其他租户以及客户自身租户管理员的访问。这是因为内存隔离发生在代码级别。\n\
  \n请阅读文章“Azure Kubernetes Service 上基于 Intel SGX 的机密计算节点的应用安全区支持”以获取更多详细信息。\n\n###\
  \ 适用于 Azure Container Instance (ACI) 的机密容器\n\nACI 上的机密容器提供容器组级别内存隔离，CPU 为每个容器组生成一个唯一的加密密钥。机密容器利用\
  \ AMD SEV-SNP 处理器的嵌套虚拟化功能，其中每个机密容器组在其自身的第 2 层实用工具 VM 内运行，该 VM 由在基础 VM 的来宾 OS 上运行的虚拟机监控程序创建。因此，它不仅防止云操作员和其他云租户访问，还防止客户自身租户管理员访问，从而也保护容器组的内存免受内部威胁。由于\
  \ ACI 是“无服务器”产品，支持这些容器组的基础设施对客户隐藏并由 Azure 管理。Microsoft 提供了一个开源的“边车”容器映像，可以将其包含在机密容器组中，以便与依赖方（例如密钥管理服务）交换机密信息。\n\
  \n请阅读文章“Azure 容器实例上的机密容器”以获取更多详细信息。\n\n### 适用于 Azure Kubernetes Service (AKS) 的机密容器\n\
  \nAKS 上的机密容器提供 Pod 级别内存隔离，每个 Pod 都有由 CPU 生成的独特加密密钥。机密容器利用 AMD SEV-SNP 处理器的嵌套虚拟化功能，其中每个\
  \ Pod 在由在基础 VM 的来宾 OS 上运行的虚拟机监控程序创建的其自身第 2 层实用工具 VM 内运行。因此，它们不仅防止云操作员和其他云租户访问，还防止客户自身租户管理员访问。因此，它们也保护\
  \ Pod 的内存免受内部威胁。这些功能使高度敏感的容器工作负载能够在无需重构代码的情况下迁移到 AKS，同时利用 Pod 级别隔离。Microsoft 提供了一个开源的“边车”容器映像，可以将其包含在机密\
  \ Pod 中，以便与依赖方（例如密钥管理服务）交换机密信息。\n\n请阅读文章“公共预览版：AKS 上的机密容器”以获取更多详细信息。\n\n\n\n\n\n\
  ### ACC 的支持服务和功能\n\nAzure 提供多种功能和服务，用于支持 TEE 证明以及 Azure 防御纵深策略的其他方面。所有这些功能均可与 ACC\
  \ VM 一起使用，而其中一些功能对机密容器和其他 PaaS 也有用。与证明相关的服务和功能包括 Microsoft Azure 证明服务、适用于机密 VM 的来宾证明功能以及安全密钥释放。支持防御纵深其他方面的其他服务和功能包括受信启动、使用客户托管密钥的机密磁盘加密以及\
  \ Azure Key Vault 托管 HSM（硬件安全模块）服务。\n\n### Microsoft Azure 证明\n\nMicrosoft Azure\
  \ 证明是一项服务，用于验证硬件平台及其运行的软件是否符合预期的证据的可信度。该服务支持对受信任平台模块 (TPM) 支持的平台进行证明，以及对 TEE 状态进行证明。这为依赖方（例如密钥管理器）提供保证，即在释放密钥和处理敏感工作负载之前，预定软件正在受信任硬件上执行。\n\
  \n证明可以遵循以下两种模式之一：\n\n- 在护照模型中，TEE 中的应用程序（证明者）将证据直接传递给验证者（Azure 证明或第三方证明服务），并在从依赖方请求密钥之前接收来自验证者的验证结果（图\
  \ 3-4）。\n- 在背景调查模型中，TEE 中的应用程序首先通过将证据传递给依赖方来从该方请求密钥，并让依赖方在将密钥释放到 TEE 之前验证证据是否可信（图\
  \ 3-5）。\n\n受信任执行环境（证明者）\n\n- 1. 证据\n  - 与硬件提供商受信任根链接的签名 TEE 测量值\n  - TEE 内运行的客户软件的测量值（例如，已执行代码的哈希值）\n\
  - 2. 验证者\n  满足要求。\n- 3. 证明结果\n- 4. 证明结果\n- 6. 安全密钥交换\n- 5. 密钥管理器（依赖方）\n  我是否认为此证明结果有效？\n\
  \  我是否信任 Microsoft Azure 证明？\n\n图 3-4. TEE 证明的护照模型\n\n![](img/521134c58cee92470f3ee0ff421e2295_40_0.png)\n\
  \n图 3-5. TEE 证明的背景调查模型\n\n有关 Azure 证明的更多信息，请阅读“Microsoft Azure 证明：用例”。\n\n### 来宾证明\n\
  \nAzure 来宾证明软件是 Azure 上机密 VM 的证明支持工具。它允许用户设计基于 VM 的应用程序，以便在交换密钥和处理敏感数据之前验证底层硬件和来宾操作系统的状态。它可以加载到\
  \ VM 的 OS 磁盘上，以提供基于加密的证明，证明 VM 正在运行于具有所需隔离级别和完整性的基于硬件的 TEE 中。来宾证明软件还可以为依赖方（例如密钥管理服务）提供证据，证明\
  \ TEE 硬件和 TEE 内的软件均符合预期，然后才允许交换密钥。（有关更多详细信息，请参阅下一节。）\n\n有关更多详细信息，请阅读文章“什么是机密 VM\
  \ 的来宾证明？”。\n\n### 安全密钥释放\n\n安全密钥释放 (SKR) 的目标是确保密钥在其生命周期内保持加密状态，并且仅发布到授权的代码/应用程序。SKR\
  \ 使密钥能够从密钥管理服务转移到已证明的 TEE，例如安全 enclave、基于 VM 的 TEE 或机密容器组。SKR 为数据解密/加密密钥增加了额外的访问保护层，仅允许\
  \ TEE 访问密钥。对这些密钥的访问由密钥发行前定义的 SKR 策略控制。安全密钥释放的高级别流程如图 3-6 所示，其中在 TEE 中运行的代码通过出示证明报告来请求密钥，而\
  \ AKV 等密钥管理服务根据预定义的密钥释放策略发布密钥。\n\n![](img/521134c58cee92470f3ee0ff421e2295_42_0.png)\n\
  \n图 3-6. 安全密钥释放\n\n有关更多信息，请阅读文章“安全密钥释放功能与 AKV 和 Azure 机密计算 (ACC)”。\n\n### 第 2 代\
  \ VM 的受信启动\n\nAzure 受信启动通过启用虚拟受信任平台模块 (vTPM) 来保护 Azure 托管的虚拟机（第 2 代）免受 rootkit 和\
  \ bootkit 攻击，从而提高其安全性。vTPM 是遵循 TPM 2.0 规范的硬件受信任平台模块的虚拟化版本。vTPM 通过验证虚拟机整个启动链（UEFI、启动加载程序、操作系统、系统和驱动程序）的完整性来实现证明。受信启动利用\
  \ vTPM 执行基于云的远程证明，用于平台运行状况评估和基于信任的决策。作为运行状况检查，受信启动可以加密验证虚拟机是否已成功启动。\n\n有关更多详细信息，请阅读文章“Azure\
  \ 虚拟机的受信启动”。\n\n### 使用客户托管密钥的磁盘加密\n\nAzure 托管磁盘（OS 磁盘和数据磁盘）支持使用客户托管密钥的磁盘加密。它允许客户使用自己的密钥加密单个磁盘。对于客户托管密钥，此密钥用于保护并限制对用于保护数据的加密密钥的访问。客户可以将其托管密钥存储在\
  \ Azure Key Vault 或 Azure Key Vault 托管 HSM 中。\n\n通过使用自己的密钥，客户可以完全控制密钥，这为某些行业提供了满足合规性和监管要求所需的灵活性。\n\
  \n有关更多详细信息，请阅读文章“Azure 磁盘存储的服务器端加密：客户托管密钥”。\n\n### 托管 HSM\n\nAzure Key Vault 托管硬件安全模块\
  \ (MHSM) 是一种单租户、基于云的、FIPS 140-2 第 3 级验证的密钥管理服务，可确保对客户拥有的密钥提供最高级别的保护。这种“密钥主权”意味着客户组织对谁可以访问密钥和更改密钥管理策略，以及哪些\
  \ Azure 服务消耗这些密钥拥有完全且排他性的控制权。\n\n客户做出这些决定后，通过技术手段防止 Microsoft 人员更改这些决定。托管 HSM 服务利用\
  \ Azure 机密计算的功能，在基于 Intel Software Guard Extensions (SGX) 构建的 TEE 中运行。Intel SGX\
  \ 利用应用程序 enclave 内的基于硬件的隔离来提供针对内部和外部威胁的增强安全措施，以在数据处于活动使用状态时保护数据。即使使用调试器，也无法查看应用程序\
  \ enclave 内部的数据或代码。如果不受信任的代码尝试更改应用程序 enclave 内存中的内容，Intel SGX 会禁用该环境并拒绝该操作。这些独特功能可帮助您保护加密密钥材料，防止其作为明文被访问或可见。托管\
  \ HSM 的功能包括：\n\n- 单租户且完全托管。\n- FIPS 140-2 第 3 级验证。\n- 高可用性且支持区域恢复。\n- 每个 HSM 池包含多个\
  \ HSM 分区，这些分区跨越多个数据中心中多个机架上的三台服务器。在发生硬件故障的情况下，HSM 的成员分区将自动迁移到健康硬件上。\n- 每个 HSM 实例使用单独的客户特定安全域，以加密方式隔离每个客户的\
  \ HSM。\n\n有关更多详细信息，请阅读文章“什么是 Azure Key Vault 托管 HSM？”。\n\n### 其他 ACC PaaS 和 SaaS\n\
  \n本节讨论 Azure 中所有其他支持机密计算的 PaaS 和 SaaS 服务。\n\n### Azure 机密分类账 (ACL)\n\n\n\n\n\nMicrosoft\
  \ Azure 的机密分类账 (ACL) 是一项高度安全的服务，用于提供防篡改分类账，用于安全的审计日志记录和管理敏感数据记录。它仅在硬件支持的安全隔区中运行，这是一种经过广泛监控且与世隔绝的运行时环境，可防止潜在攻击。除了不可变性、抗篡改和仅追加操作之外，ACL\
  \ 还提供独特的数据完整性优势。这些功能可保证所有记录的完整性，非常适合关键元数据记录不得修改的场景，例如用于法规合规和存档目的。\n\n例如，ACL 通过充当时间点事实来源来保护数据库和应用程序，该来源在验证场景中提供加密证明。它还可作为审计跟踪或需要保持完整并选择性地与特定人员共享的记录的存储库。分类账中记录的数据保持不可变、隐私增强，并受到组织甚至云提供商内部内部人员威胁的保护。请阅读文章“Microsoft\
  \ Azure 机密分类账”了解更多详细信息。您还可以了解 Microsoft 如何使用 Azure 机密分类账保护其自身的硬件供应链。\n\n### 机密联盟框架\
  \ (CCF) 的托管版本\n\n机密联盟框架 (CCF) 是一个开源框架，用于开发高可用有状态服务，这些服务利用集中式计算来提高可用性和性能，同时提供去中心化的信任。它使多方能够在机密数据上执行可审计的计算，而无需相互信任或信任特权操作员。\n\
  \nAzure 托管机密联盟框架 (Azure Managed CCF) 有助于在整个生命周期内在 Azure 的托管环境中托管 CCF。除了 CCF 功能之外，Azure\
  \ Managed CCF 还提供可扩展性、高可用性、自动代码升级和灾难恢复等云优势。\n\n使用 Azure Managed CCF，客户可以构建需要对数据和多方可能需要的信息进行可编程机密性的机密应用程序。通常，成员将就网络的宪章达成一致并设置治理和业务事务规则，业务事务将基于已定义的内容进行。如果治理发生影响业务规则的变更，联盟需要批准这些变更。\n\
  \n请阅读 [此博客文章]() 了解更多详细信息。\n\n### 带安全隔区的 Always Encrypted\n\nAzure SQL Database 中的带安全隔区的\
  \ Always Encrypted 启用了原位加密和丰富的机密查询，包括模式匹配、范围比较和排序。如图 3-7 所示，Always Encrypted 的工作原理是在应用程序端的客户端驱动程序内部加密查询参数并解密查询结果。在数据库引擎内，只有安全隔区可以访问明文数据，从而加强了对数据机密性的保护，防止客户组织中的流氓\
  \ DBA、云操作员和恶意软件。\n\n![](img/521134c58cee92470f3ee0ff421e2295_47_0.png)\n\n图 3-7。带安全隔区的\
  \ Always Encrypted\n\n有关更多详细信息，请参阅“带安全隔区的 Always Encrypted 文档”。\n\n### 带机密 VM 选项的\
  \ PaaS\n\n表 3-2 列出了支持机密 VM 选项的各种 Azure 服务。\n\n表 3-2。各种 Azure 服务的机密 VM 支持\n\n| 功能\
  \ | 说明 |\n|---|---|\n| Azure 虚拟桌面的机密 VM 支持 | Azure 虚拟桌面中的机密 VM 支持，可通过保护使用中的数据来帮助提高数据隐私和安全性。有关更多信息，请阅读文章“宣布\
  \ Azure 虚拟桌面中机密 VM 正式发布”。 |\n| Azure Databricks 的机密 VM 支持 | Azure Databricks 的机密\
  \ VM 支持，适用于其群集驱动程序节点和群集工作器节点。有关更多信息，请阅读“宣布 Azure Databricks 上基于 AMD 的机密 VM 正式发布”。\
  \ |\n| Azure 数据资源管理器的机密 VM 支持 | Azure 数据资源管理器的机密 VM 选项，通过允许 ADX 工作负载在基于硬件且经过认证的\
  \ TEE 中执行来增强安全性。有关更多信息，请阅读“Azure 数据资源管理器的机密 VM 选项：公共预览版发布”。 |\n"
- '## 第 4 章。未来之路


  在本最终章中，您将了解 Microsoft 对机密计算的愿景、其对社区进步的贡献、客户和合作伙伴案例研究的参考资料，以及有助于深入了解 Azure 机密计算的有用资源。


  ### Microsoft 对机密计算的愿景


  信任是组织拥抱云计算的关键因素，而机密计算在建立信任方面至关重要，该信任通过加密保证支持，确保数据在使用过程中始终受到保护，防止未经授权的访问。Microsoft
  已将为客户提供 Azure 中一流的安全和隐私功能而不牺牲性能列为首要任务。Microsoft 于 2017 年 9 月提供了其首个机密计算产品/服务（带应用程序隔区的
  VM）的预览版，以帮助客户在 Azure 云中处理数据和代码时保障其机密性和完整性。


  2018 年，Microsoft 在 MIT 许可下发布了 Open Enclave SDK，旨在围绕隔区抽象提供一致的 API 表面，实现 Intel SGX
  和 Arm TrustZone 等 TEE 类型之间的可移植性以及架构自由。该 SDK 最终被纳入 CCC 项目。Microsoft Research 不仅在开发改进
  Microsoft 平台上机密计算能力的尖端算法方面发挥了关键作用，还将这些算法共享到研究出版物和开源项目中，以造福全球社区。


  ### 创新


  Microsoft 的 Azure Research 团队一直在开展开创性研究，以识别在公共云以及私有云和混合云环境中部署的应用程序和工作负载中保护隐私的方法。这项研究开发了内存标记、恶意软件遏制和数据干净室方面的尖端技术，这些技术已被行业内多种硬件和软件产品实现。这些创新还催生了许多开源项目：


  - 机密联盟框架 (CCF) 是一个开源框架，用于构建一类新的安全、高可用且高性能的应用程序，这些应用程序专注于多方计算和数据。

  - Verona 项目是一种研究型编程语言，开发目的是探索并发所有权的概念。Microsoft 正在提供一种无缝集成所有权的新并发模型。

  - snmalloc 是一种高性能分配器。它可以直接在项目中作为仅头文件的 C++ 库使用，适用于 Elf 平台（例如 Linux、BSD），以及 Rust。

  - Revizor 是一种面向安全的模糊测试器，用于检测 CPU 中的信息泄露，例如来自 Spectre 和 Meltdown 的泄露。

  - 隐私估计是一个库，用于在机器学习训练管道遭受成员推理攻击时统计地估计其隐私性。


  此外，该团队的研发直接为多个 Microsoft 产品做出了贡献，包括：


  - Azure 容器实例上的机密容器

  - Azure 机密分类账

  - Azure 托管机密联盟框架 (基于 CCF)

  - 带 GPU 的机密计算

  - Azure SQL Always Encrypted


  ### 机密联盟框架 (CCF)


  Microsoft Research 开发了 CCF，用于构建专注于多方计算和数据的安全、高可用且高性能的应用程序。它结合了 TEE 和灵活的去中心化治理，以实现可扩展且高性能的机密应用程序，并以不可变分类账作为审计目的的支撑。图
  4-1 显示了 CCF 的关键特征。


  ![](img/521134c58cee92470f3ee0ff421e2295_51_0.png)


  基本 CCF 网络由三个节点组成，所有节点在 TEE 内运行相同的应用程序。用户和成员进行的所有交易都存储在复制的加密分类账中，您可以从中提取可用于审计的收据。客户端使用
  JavaScript/TypeScript 等现代语言与 CCF 交互，连接通过 TLS 进行保护。


  Microsoft 还发布了 Azure 托管机密联盟框架服务，该服务为客户提供使用 CCF 构建自己的多方应用程序的功能，并使用 ACC。


  有关 CCF 的更多详细信息，请访问 https://ccf.microsoft.com。


  ### 机密计算联盟 (CCC)


  CCC 将硬件供应商、云提供商和软件开发人员聚集在一起，以加快 TEE 技术和标准的采用。Microsoft 在 2019 年成为 CCC 的创始成员，并一直是活跃的




  自成立以来一直是会员。CCC 已成长为汇聚多样化市场领先供应商的平台，这些供应商正在推动转型。该联盟还在 Linux 基金会下制定跨行业标准，通过广泛关注开源社区和项目，推动保密计算的采用。


  有关 CCC 的更多信息，请访问 https://confidentialcomputing.io。


  ## 资源


  Azure 保密计算已被来自各个领域的多种客户和合作伙伴使用。下一部分中介绍的案例研究将向您展示 ACC 如何在不同场景下帮助保护云规模数据。本部分最后列出了有用的资源，有助于深入了解
  ACC 的各种功能。


  ## 客户和合作伙伴案例研究


  以下是客户和合作伙伴在实际场景中使用 ACC 保护使用中数据免受未经授权访问的几个示例。


  有关更多详细信息，请访问 Microsoft 客户案例网站。


  - Signal 是一款免费、开源的私密消息传递应用程序，旨在保护消息和用户数据的隐私。它将 ACC 作为其云解决方案之一，使用安全 Enclave 托管后端服务。


  - 加拿大皇家银行 (RBC) 通过提供可信赖的大规模现代金融服务，为数百万客户创造价值。结合数据和数字分析，使 RBC 能够通过试点的虚拟干净室 (VCR)
  将数据转化为个性化报价。VCR 是一个基于 ACC 构建的隐私保护多方数据共享和集体洞察生成平台，依赖于 Intel SGX 安全 Enclave 技术。


  - Leidos 是一家专注于解决医疗保健领域最具挑战性问题的科学、工程和技术组织。共享和汇总真实世界的患者数据和证据是推动更好医疗保健结果的关键。同时，需要维护患者隐私和医疗记录安全。Leidos
  已采用基于 Intel SGX 的 Microsoft Azure 保密计算来加速临床试验并获得新洞察，从而改善患者结果并解决隐私问题。


  - BeeKeeperAI 使用 ACC 创建基于 Intel SGX 的安全数据 Enclave。在 Enclave 内部，加密 AI 对加密数据集进行计算，使解决方案的所有方面都保留在符合
  HIPAA 的云环境中。


  - Fireblocks 是一家区块链基础设施提供商，旨在创建一个生态系统，以降低处理数字资产和加密货币的复杂性并提供更高级别的安全性。Fireblocks 使用
  ACC 和 Intel SGX 来重新定义数字资产行业，处理超过 4 万亿美元的资产，同时获得最高国际安全认证，并为各类组织在区块链网络上创造新机会。


  - Decentriq 是一家瑞士公司，提供面向保密数据协作的企业级 SaaS 平台。Decentriq 不仅让数据协作更加简单，而且在许多情况下还使用 ACC
  来允许多个群体汇聚在一起使用敏感数据。自迁移到云并借助 Azure 加速其保密计算之旅以来，Decentriq 已使敏感数据集的协作高度可扩展，并帮助客户达到新里程碑，包括使数字广告的点击率翻倍。


  - Swift 是金融消息传递服务领域的领先基础设施提供商，已与超过 11,500 家机构合作，推动发现和拦截欺诈交易的新方式。它已与 Microsoft 合作，在打击金融犯罪方面进一步创新。Swift
  和 Microsoft 正在使用联邦学习技术，以及 Azure Machine Learning 和 ACC，为事务数据构建异常检测模型，无需从安全位置复制或移动数据。


  - Carbon Asset Solutions 的目标是帮助地球摆脱有害的大气二氧化碳。它需要捕获并加密精确碳测量数据，在碳信贷流程的两端都防止数据篡改，同时着眼于长期的全球可扩展性。通过使用
  ACC，Carbon Asset Solutions 正在努力解决地球上最关键的环境问题之一。



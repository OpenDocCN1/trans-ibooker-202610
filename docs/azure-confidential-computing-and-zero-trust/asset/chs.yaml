  图 2-3. 银行之间机密共享数据以检测欺诈


  有关 Azure 中机密 AI 行业用例的更多信息，请查看文章“机密 AI”。


  近年来，生成式 AI 已成为创新和颠覆的重要领域。大语言模型（LLM）如生成式预训练变换器（GPT）、大语言模型 Meta AI（LLaMA）及其他许多模型的普及程度呈指数级增长。由于这些模型及相关工作负载高度依赖
  GPU，Microsoft 和 NVIDIA 正在密切合作，如博客文章“Azure Confidential Computing with NVIDIA GPUs
  for Trustworthy AI”中所述，将 GPU 加速计算引入 Azure 上的机密计算。


  这一点很重要，因为当数据在 CPU 与 GPU 之间传输时，数据始终处于加密状态，并且只能在 GPU 内硬件保护的隔离安全区中解密。在那里，数据可以被处理以构建
  AI 模型或生成 AI 推理输出。如需更深入地了解 NVIDIA 的 GPU 安全模型，请阅读白皮书“Confidential Compute on NVIDIA
  Hopper H100”。


  ### 其他用例


  Azure 机密计算是一项宝贵的技术，适用于各行各业的广泛场景，包括政府、金融服务、医疗保健等许多领域。以下列表概述了机密计算影响巨大的各个行业。如需了解机密计算的其他用例，请阅读“用例和场景”。


  ### 政府


  - 数字身份

  - 关键基础设施

  - 反腐败

  - 网络犯罪防范

  - 司法程序和案件管理

  - 已部署和断开连接的操作


  ### 金融服务


  - 反洗钱

  - 数字货币

  - 安全支付处理

  - 欺诈预防

  - 基于合并银行记录的信用风险评估和资格

  - 资本市场/保护量化对冲基金代码和模型

  - 专有分析/算法


  ### 医疗保健


  - 疾病诊断

  - 保险欺诈预防

  - 药物开发

  - 接触者追踪

  - 记录和证据管理

  - 保险欺诈、浪费和滥用预防






- '## 第 2 章。用例和场景


  本章探讨机密计算的各种用例及其如何在不同场景中保护数据隐私。这些场景包括受监管行业中敏感工作负载的平移式迁移、主权政府工作负载、数据干净室、机密 AI 和其他用例。


  ### 平移式迁移


  当今的机密计算技术使组织（尤其是高度监管行业的组织）能够以最小的努力将现有敏感工作负载迁移到公有云，或为已经在公有云中运行的工作负载增加进一步保护。借助 VM
  级别和容器级别隔离技术，组织现在可以将其最敏感的基于 VM 和容器的工作负载迁移到支持机密计算的基础架构，无需对代码进行任何更改，从而加速这些技术的采用。


  ### 主权政府工作负载


  政府和公共机构由于其管理的数据具有敏感性，因此需要高度的数据主权。此外，内部风险和间谍活动等威胁的存在，为政府在考虑使用公有云时带来了巨大的障碍，因为这样做需要信任云运营商。机密计算通过实施确保数据和代码免受未经授权访问（甚至云运营商也无法访问）的方法，减少了对云运营商固有信任的需求。机密计算使高度机密的工作负载能够在云中运行，并使政府在云中迁移和运行工作负载时能够采用永不信任、始终验证的安全思维。Microsoft
  Azure 通过 Microsoft Cloud for Sovereignty 满足这些要求。


  ### 数据干净室


  数据干净室的目标是允许多个数据提供者与模型和算法提供者共享数据，以便从更广泛的、此前不可用的数据集中获得洞察，同时保持治理和隐私规则。机密计算通过提供加密验证来实现数据干净室，该验证证明数据提供者无法访问数据或相关模型，即使正在对其进行计算。这通过保证不允许任何方访问数据或模型，强化了零信任原则。


  在 TEE 中运行的数据分析


  图 2-1. 数据干净室的典型用法


  请查看“客户和合作伙伴案例研究”并阅读文章“干净室和多方数据分析”，以了解有关使用数据干净室和多方计算的客户案例研究的更多详细信息。


  ### 机密 AI


  机密 AI 是一组基于硬件的技术，例如通用 CPU 和 GPU，用于建立可信执行环境（TEE），旨在保护 AI 生命周期中的数据和模型，即使在数据和模型使用过程中也是如此。其目标是在
  AI 数据处理的所有阶段（包括数据收集、预处理、训练和 AI 模型部署）中保护数据。机密计算在促进机密 AI 解决方案方面发挥着关键作用，因为它可以在性能开销极小的情况下访问敏感数据集，同时解决与同态加密等技术相比的安全性和合规性问题。图
  2-2 说明了机密 AI 的各种用例。


  机密计算使数据提供者能够为其数据集的非常具体的目的授权使用，例如训练或调整已商定的模型，同时在计算过程中保持数据的机密性。数据提供者还可以通过证明请求证明，证明其数据集仅在
  TEE 中处理。


  ![](img/521134c58cee92470f3ee0ff421e2295_24_0.png)


  图 2-3 显示了两家竞争银行如何通过在共享数据集上训练模型来协作以保护客户免受欺诈，从而为双方带来双赢局面。在此场景中，机密计算使组织能够在不牺牲性能或数据隐私的情况下充分利用机密
  AI 的全部优势。



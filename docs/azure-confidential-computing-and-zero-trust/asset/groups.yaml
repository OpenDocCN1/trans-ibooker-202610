    Microsoft Azure’s Confidential Ledger (ACL) is a highly secure service that provides
    a tamper-proof ledger for secure audit logging and managing sensitive data records.
    It operates solely within hardware-supported secure enclaves, an extensively monitored
    and isolated runtime environment that prevents potential attacks. In addition
    to immutability, tamper resistance, and append-only operations, ACL provides distinct
    data integrity benefits. These features, which guarantee the integrity of all
    records, are ideal for scenarios in which critical metadata records must not be
    modified, such as for regulatory compliance and archival purposes.


    For instance, ACL protects databases and applications by acting as a point-in-time
    source of truth that provides cryptographic proofs in verification scenarios.
    It is also beneficial as a repository of audit trails or records that need to
    be kept intact and selectively shared with certain personas. Data logged in the
    ledger remains immutable, privacy enhanced, and protected from insider threats
    within an organization or even the cloud provider. Please read the article “Microsoft
    Azure Confidential Ledger” for additional details. You can also learn how Microsoft
    is protecting its own hardware supply chain with Azure Confidential Ledger.


    ## Managed Confidential Consortium Framework (CCF)


    The Confidential Consortium Framework (CCF) is an open source framework for developing
    highly available stateful services that leverage centralized compute for usability
    and performance, while providing decentralized trust. It enables multiple parties
    to execute auditable computations on confidential data without having to trust
    one another or a privileged operator.


    The Azure Managed Confidential Consortium Framework (Azure Managed CCF) facilitates
    hosting the CCF in a managed environment within Azure throughout its lifecycle.
    In addition to CCF capabilities, Azure Managed CCF provides cloud benefits such
    as scalability, high availability, automatic code upgrades, and disaster recovery.


    With Azure Managed CCF, customers can build confidential applications that require
    programmable confidentiality of data and information that may be needed by multiple
    parties. Typically, members will agree on the constitution of the network and
    set governance and business transaction rules, and the business transactions will
    take place based on what has been defined. If there are changes to governance
    that impact the business rules, the consortium needs to approve those changes.


    Please read [this blog post]() for additional details.


    ## Always Encrypted with Secure Enclaves


    Always Encrypted with secure enclaves in Azure SQL Database enables in-place encryption
    and rich confidential queries, including pattern matching, range comparisons,
    and sorting. As shown in Figure 3-7, Always Encrypted works by encrypting query
    parameters and decrypting query results inside the client driver on the application
    side. Within the database engine, only the secure enclave has access to plaintext
    data, reinforcing the protection of data confidentiality from rogue DBAs in customer’s
    organization, cloud operators, and malware.


    ![](img/521134c58cee92470f3ee0ff421e2295_47_0.png)


    Figure 3-7. Always Encrypted with secure enclave


    For additional details, see “Always Encrypted with Secure Enclaves Documentation”.


    ## PaaS with a Confidential VM Option


    Table 3-2 lists various Azure services that support a confidential VM option.


    Table 3-2. Confidential VM support for various Azure services


    | Capability | Description |

    |---|---|

    | Confidential VM support for Azure Virtual Desktop | Confidential VM support
    in Azure Virtual Desktop that helps increase data privacy and security by protecting
    data in use. For more information please read the article “Announcing General
    Availability of Confidential VMs in Azure Virtual Desktop”. |

    | Confidential VM support for Azure Databricks | Confidential VM support for Azure
    Databricks that is available for its cluster driver node and cluster worker nodes.
    For more information please read “Announcing the General Availability of AMD-based
    Confidential VMs on Azure Databricks”. |

    | Confidential VM support for Azure Data Explorer | Confidential VM option for
    Azure Data Explorer that enhances security by permitting the ADX workload to execute
    in a hardware-based and attested TEE. For more information, please read “Confidential
    VM Option for Azure Data Explorer: Public Preview Release”. |


    ## Chapter 4. Road Ahead


    In this final chapter, you will learn about Microsoft’s vision for confidential
    computing, its contributions to the advancement of the community, references to
    customer and partner case studies, and helpful resources for gaining more in-depth
    knowledge of Azure confidential computing.


    ### Microsoft’s Vision for Confidential Computing


    Trust is an essential factor for organizations to embrace cloud computing, and
    confidential computing is critical in building the trust, backed up by cryptographic
    guarantees, that data is always protected from unauthorized access even when it
    is in use. Microsoft has made it a top priority to provide customers with best-in-class
    security and privacy capabilities in Azure without sacrificing performance. Microsoft
    offered a preview of its first confidential computing offering, VMs with application
    enclaves, in September 2017 to assist customers in securing the confidentiality
    and integrity of their data and code while it is processed in the Azure cloud.


    In 2018, Microsoft released the Open Enclave SDK under the MIT license, aiming
    for a consistent API surface centered on enclave abstraction, portability between
    TEE types such as Intel SGX and Arm TrustZone, and architectural freedom. This
    SDK was eventually incorporated into a CCC project. Microsoft Research has been
    instrumental not only in developing cutting-edge algorithms that improve confidential
    computing capabilities on the Microsoft platform but also in sharing them in research
    publications and open source projects for the benefit of the global community.


    ### Innovation


    Microsoft’s Azure Research team has been conducting groundbreaking research to
    identify methods for protecting privacy in applications and workloads deployed
    in public cloud as well as private and hybrid cloud environments. This research
    has developed cutting-edge techniques for memory tagging, malware containment,
    and data clean rooms that have been implemented by several hardware and software
    products across the industry. These innovations have also led to many open source
    projects:


    - Confidential Consortium Framework (CCF) is an open source framework for building
    a new category of secure, highly available, and performant applications that focus
    on multi-party compute and data.

    - Project Verona is a research programming language developed to explore the concept
    of concurrent ownership. Microsoft is providing a new concurrency model that seamlessly
    integrates ownership.

    - snmalloc is a high-performance allocator. It can be used directly in a project
    as a header-only C++ library, on Elf platforms (e.g., Linux, BSD), and in Rust.

    - Revizor is a security-oriented fuzzer for detecting information leaks in CPUs,
    such as from Spectre and Meltdown.

    - Privacy Estimates is a library for statistically estimating the privacy of machine

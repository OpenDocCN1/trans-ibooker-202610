    \ 托管 HSM（硬件安全模块）服务。\n\n### Microsoft Azure 证明\n\nMicrosoft Azure 证明是一项服务，用于验证硬件平台及其运行的软件是否符合预期的证据的可信度。该服务支持对受信任平台模块\
    \ (TPM) 支持的平台进行证明，以及对 TEE 状态进行证明。这为依赖方（例如密钥管理器）提供保证，即在释放密钥和处理敏感工作负载之前，预定软件正在受信任硬件上执行。\n\
    \n证明可以遵循以下两种模式之一：\n\n- 在护照模型中，TEE 中的应用程序（证明者）将证据直接传递给验证者（Azure 证明或第三方证明服务），并在从依赖方请求密钥之前接收来自验证者的验证结果（图\
    \ 3-4）。\n- 在背景调查模型中，TEE 中的应用程序首先通过将证据传递给依赖方来从该方请求密钥，并让依赖方在将密钥释放到 TEE 之前验证证据是否可信（图\
    \ 3-5）。\n\n受信任执行环境（证明者）\n\n- 1. 证据\n  - 与硬件提供商受信任根链接的签名 TEE 测量值\n  - TEE 内运行的客户软件的测量值（例如，已执行代码的哈希值）\n\
    - 2. 验证者\n  满足要求。\n- 3. 证明结果\n- 4. 证明结果\n- 6. 安全密钥交换\n- 5. 密钥管理器（依赖方）\n  我是否认为此证明结果有效？\n\
    \  我是否信任 Microsoft Azure 证明？\n\n图 3-4. TEE 证明的护照模型\n\n![](img/521134c58cee92470f3ee0ff421e2295_40_0.png)\n\
    \n图 3-5. TEE 证明的背景调查模型\n\n有关 Azure 证明的更多信息，请阅读“Microsoft Azure 证明：用例”。\n\n###\
    \ 来宾证明\n\nAzure 来宾证明软件是 Azure 上机密 VM 的证明支持工具。它允许用户设计基于 VM 的应用程序，以便在交换密钥和处理敏感数据之前验证底层硬件和来宾操作系统的状态。它可以加载到\

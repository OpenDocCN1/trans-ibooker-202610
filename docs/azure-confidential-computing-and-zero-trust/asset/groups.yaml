    ## 附录 B. 机密计算和其他隐私增强技术


    隐私增强技术（PETs）的主要目标是促进对数据的计算，而不对执行计算的方或托管平台泄露数据。这种隐私方法与传统的加密原语根本不同，后者通常侧重于数据机密性，但不允许对加密数据（密文）执行任何操作。然而，近年来，对可投入生产的
    PETs 的需求大幅增加。这最初由 2010 年代向云计算的大规模转变所推动，尤其是向公有云的转移，最近则由备受期待的 AI 颠覆所加速，该颠覆由生成式 AI
    等技术推动，要求大型语言模型在云端甚至边缘进行训练。


    多年来，涌现了成熟度各异的多种 PETs，包括但不限于同态加密、可信执行环境、可信平台模块等。尽管详尽覆盖超出了本报告的范围，但表 B-1 对几种 PETs
    进行了比较。另外，请记住，根据用例，这些技术可能是互补的，而非相互排斥。


    ### 表 B-1. 隐私增强技术


    | | 机密计算/硬件 TEE^a | 同态加密^b | 可信平台模块^c |

    |---|---|---|---|

    | 数据完整性 | 是 | 是 (依赖 | 是 (有限 |

    | 代码完整性 | 是 | 否 | 是 |

    | 数据机密性 | 是 | 是 | 是 |

    | 证明 | 是 | 否 | 是 |

    | 可扩展性 | 是 | 否 | 是 (仅限密钥) |


    - a https://confidentialcomputing.io

    - b https://homomorphicencryption.org

    - c https://trustedcomputinggroup.org



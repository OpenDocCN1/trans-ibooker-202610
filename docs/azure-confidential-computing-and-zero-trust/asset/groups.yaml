    This chapter provides an understanding of confidential computing, beginning with
    its definition as published by the Confidential Computing Consortium (CCC), its
    key features, and an overview of how it helps complete the data protection lifecycle.
    It then discusses how vendor-specific confidential computing technologies allow
    you to choose the size of your TEE, and the types of threats it can address, by
    selecting the appropriate memory isolation level. Finally, it establishes confidential
    computing’s alignment with zero-trust principles.


    In subsequent chapters, this report covers various use cases for confidential
    computing, the Azure confidential computing portfolio of products, and the road
    ahead for confidential computing on Azure.


    ## Confidential Computing Overview


    This section discusses the definition of confidential computing as established
    by the CCC, the key features of confidential computing, and how confidential computing
    helps complete the data protection lifecycle.


    ### Confidential Computing Definition


    The term *confidential computing* is defined by the CCC as “the protection of
    data in-use by performing computation in a hardware-based, attested trusted execution
    environment (TEE).” This definition is meant to be inclusive of and relevant to
    a wide range of computing models, including public, private (on-premises), and
    hybrid cloud, as well as edge computing, Internet of Things (IoT) devices, mobile
    devices, and even operational technology (OT) and more. Furthermore, it is vendor
    agnostic in the sense that it is not associated with a particular processor type
    or technology.


    ### Key Features of Confidential Computing


    The key features of confidential computing are a hardware root of trust, memory
    protection, and attestation.


    ### Hardware root of trust


    Hardware root of trust ensures that data encryption is performed using keys derived
    from a universally unique master key that is recorded in the CPU silicon itself
    when it is manufactured. This master key cannot be exported from the CPU and so
    is inaccessible from outside the CPU hardware. The keys used to encrypt data in
    memory are generated by the firmware running on the underlying TEE hardware and
    are also inaccessible outside the bounds of the CPU hardware. This allows all
    software outside of the TEE to be untrusted. If memory encryption were managed
    by software in the cloud service provider’s host OS or hypervisor, it would violate
    a key principle of confidential computing.


    ### Memory protection


    Memory protection ensures that data is always encrypted when written to memory,
    using keys generated by the firmware that runs on the underlying TEE hardware
    and is inaccessible to cloud operators. Only the software in the TEE that owns
    that memory can write over it or read it, protecting it from unauthorized access
    or modification. Memory protection enables the following:


    ### Data and code confidentiality


    This ensures that an unauthorized entity has no ability to view or access the
    data or code resident in the TEE memory. It practically eliminates the risk of
    leaking sensitive data such as personal data or intellectual property (IP), like
    AI models, that costs millions of dollars to develop.


    ### Data and code integrity


    This ensures that an unauthorized entity has no ability to add, alter, or delete
    the data or code resident in the TEE memory. This is crucial because data and
    code integrity must be assured during computation; otherwise, the computation
    cannot be trusted.


    ### Attestation


    Attestation is a critical method for establishing trust over the hardware and
    software components of the TEE. A successful attestation ensures:


    - The validity and trustworthiness of the TEE hardware. This establishes that
    the TEE is indeed based on the expected hardware (manufacturer, version, firmware,
    and so on) and that the associated memory protection functions are enabled.

    - The validity and trustworthiness of the software executing inside the TEE. This
    establishes that the software has a valid identity (version, runtime attributes,
    and so on) and has not been tampered with.


    ### Confidential Computing in the Data Protection Lifecycle


    One of the main goals of security is to keep data protected from unauthorized
    access, which can result from a variety of threats, including rogue administrators,
    rogue datacenter operators, and external threats such as hackers and corporate
    spies. The need for data protection manifests itself under three primary conditions:
    while data is at rest, in transit, and in use. While techniques for protecting
    data at rest and in transit, such as encryption, have matured over time, protecting
    data while in use during computation has proved much more difficult. For instance,
    data in transit can be protected with the [TLS protocol](), and data at rest can
    be protected with well-established cryptographic methods, such as those prescribed
    by [FIPS-140]().


    However, with the widespread adoption of cloud computing, the need to protect
    data while it is in use in memory has grown drastically, leading to the emergence
    of various technologies, including confidential computing. [Figure 1-1]() shows
    how confidential computing helps fill a gap in the overall data protection lifecycle.


    Existing encryption

    Confidential computing


    Data at rest

    Encrypt inactive data when stored in blob storage, database, etc.


    Data in transit

    Encrypt data that is flowing between untrusted public or private networks


    Data in use

    Protect/encrypt data that is in use, while in RAM, and during computation


    Figure 1-1. Confidential computing in the data protection lifecycle


    In a nutshell, the primary goal of confidential computing is to protect the data
    in use during computation by using a hardware-based, attested TEE. We will discuss
    why attestation is crucial for confidential computing in the next section. For
    now, let''s examine some of the key characteristics of a TEE and the role it plays
    in confidential computing.


    ### NOTE


    Please note that there are several techniques to protect data while it is in use
    during computation, with varying degrees of maturity, including but not limited
    to homomorphic encryption (HE), secure multiparty computation (SMPC), and zero-knowledge
    proof (ZKP). Please see Appendix B for additional resources on privacy-enhancing
    technologies.


    ## Memory Isolation Levels


    The CCC definition of confidential computing is vendor agnostic and does not specify
    what is included or excluded from the TEE’s protected memory, which is encrypted
    with a single CPU-generated key. Varying confidential computing implementations
    from the CPU vendors add a new dimension to the TEE: the level of memory isolation.


    Currently, CPU vendors offer three levels of TEE memory isolation: virtual machine
    level, container group level, and code level (down to the level of a code fragment).
    Each level gets its own unique memory encryption key assigned by the underlying
    CPU firmware. These three levels of isolation are summarized in Table 1-1.


    ### Table 1-1. TEE levels of memory isolation


    | Level of isolation | Technologies | Ease of migration | Protection from cloud
    operators and malicious third parties | Protection from threats |

    | :--- | :--- | :--- | :--- | :--- |

    | Virtual machine | Intel® TDX,<sup>a</sup><br>AMD® SEV-SNP<sup>b</sup> | Lift
    and shift | Yes | Not <sup>b</sup> |

    | Container group | AMD® SEV-SNP | Lift and shift | Yes | Yes |

    | Application code | Intel® SGX<sup>c</sup> | Code refactoring required | Yes
    | Yes |


    <sup>a</sup> Intel® Trust Domain Extensions (TDX)

    <sup>b</sup> 3rd Gen AMD® EPYC™ processors with Secure Encrypted Virtualization–Secure
    Nested Paging (SNP)


    Note that while virtual machine-level isolation supports the lift and shift of
    existing workloads, it does not, by default, protect any code or data within the
    virtual machine (VM) from insider threats such as a rogue or fallible user with
    administrator privileges. Also note that while code-level isolation offers the
    smallest code base in the TEE, that level of isolation comes at the cost of having
    to refactor code to use open source SDKs for implementation. For this reason,
    container group-level isolation holds great promise for more easily protecting
    cloud-native workloads from even insider threats.


    ## Confidential Computing and Zero Trust


    The term zero trust was first coined by Forrester in 2009, although its roots
    may be traced all the way back to “de-perimeterisation,” as discussed in publications
    such as Defense Information Systems Agency (DISA) Black Core and Jericho Forum
    Commandments. In recent years, zero trust has gained broad support. Its significance
    is demonstrated by the fact that it is an integral part of the national cybersecurity
    strategy of the United States (and others), as stated in memorandum M-22-09 “Moving
    the U.S. Government Toward Zero Trust Cybersecurity Principles”. The philosophy
    behind zero-trust security is that “security” cannot be inferred by virtue of
    a perimeter. Instead, we should embrace a security approach that is deeply rooted
    in a never-trust, always-verify mindset. This section discusses the three key
    principles of zero trust and the importance of hardware root of trust, attestation,
    and TEE size in addressing these principles.


    ### Zero-Trust Principles


    To understand zero trust and its guiding principles, let’s examine the definition
    provided by NIST: “Zero trust (ZT) provides a collection of concepts and ideas
    designed to minimize uncertainty in enforcing accurate, least privilege per-request
    access decisions in information systems and services in the face of a network
    viewed as compromised.”


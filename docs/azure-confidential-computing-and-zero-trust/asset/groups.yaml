    ## 第 3 章。Azure 机密计算产品组合


    Azure 机密计算 (ACC) 由一系列产品和支持服务组成，这些产品和服务使客户能够根据第 1 章中概述的定义和原则，在使用过程中保护敏感数据。该产品组合包括虚拟机
    (VM)、基于容器的平台即服务 (PaaS) 以及其他 PaaS 和软件即服务 (SaaS)。截至 2023 年 11 月的产品组合如图 3-1 所示。


    本章按如下方式对 ACC 产品组合进行分组：


    - 虚拟机，支持 VM 级别和代码级别隔离

    - 基于容器的 PaaS，支持 VM 级别、代码级别和容器组级别隔离

    - 支持的服务和功能，例如证明、受信任启动以及使用客户托管密钥的 OS 磁盘加密

    - 其他启用 ACC 的 SaaS 和 PaaS


    | 类别 | 列 2 | 列 3 | 列 4 | 列 5 | 列 6 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 虚拟机 | AMD [1] DCa/EcA AMD SEV-SNP 虚拟机 | Intel [1] DCsv2/DCsv3/DCdsV3 Intel SGX
    虚拟机 | NVIDIA [3] 带 NVIDIA H100 GPU 的 NCCv5 机密虚拟机 | Intel [2] DCesv5 Intel TDX
    虚拟机 | |

    | 基于容器的 PaaS | [1] AKS 上的 Intel SGX 应用安全区节点 | [1] 机密 VM AKS 工作节点 | [1] | [2] AKS
    上的机密容器 | |

    | 其他 PaaS/SaaS | [1] 机密 VM 上的 SQL IaaS | [1] 始终使用安全区加密的 SQL IaaS | [1] 机密 VM 上的
    AVD | [2] 机密 VM 上的 Azure Data Explorer | [1] 机密 VM 上的 Azure Data Explorer |


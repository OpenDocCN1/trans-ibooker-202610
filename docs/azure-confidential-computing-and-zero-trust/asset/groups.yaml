    被称为机密清洁室。


    本章旨在让读者了解机密计算，首先从机密计算联盟（CCC）发布的定义入手，阐述其关键特性，并概述其如何帮助完成数据保护生命周期。接着，本章探讨了厂商特定的机密计算技术如何让你通过选择合适的内存隔离级别来确定
    TEE 的大小以及其可应对的威胁类型。最后，本章阐明了机密计算与零信任原则的一致性。


    在后续章节中，本报告将涵盖机密计算的各种用例、Azure 机密计算产品组合以及 Azure 上机密计算的未来发展方向。


    ## 机密计算概览


    本节讨论 CCC 确立的机密计算定义、机密计算的关键特性，以及机密计算如何帮助完成数据保护生命周期。


    ### 机密计算定义


    术语 *机密计算* 由 CCC 定义为“在基于硬件、可证明的可信执行环境（TEE）中执行计算，以保护使用中的数据”。该定义旨在涵盖并适用于广泛的计算模型，包括公有云、私有云（本地）和混合云，以及边缘计算、物联网（IoT）设备、移动设备，甚至运营技术（OT）等。此外，它是厂商中立的，因为它不与特定的处理器类型或技术相关联。


    ### 机密计算的关键特性


    机密计算的关键特性包括硬件信任根、内存保护和证明。


    ### 硬件信任根


    硬件信任根确保数据加密使用的密钥源自在 CPU 制造时即记录在 CPU 硅片本身中的全球唯一主密钥。该主密钥无法从 CPU 导出，因此 CPU 硬件之外无法访问。用于加密内存中数据的密钥由运行在底层
    TEE 硬件上的固件生成，同样超出 CPU 硬件范围之外无法访问。这使得 TEE 之外的所有软件都不可信。如果内存加密由云服务提供商的主机操作系统或虚拟机监控程序（hypervisor）中的软件管理，将违反机密计算的一项关键原则。


    ### 内存保护


    内存保护确保数据在写入内存时始终是加密的，使用的密钥由运行在底层 TEE 硬件上的固件生成，云运营商无法访问。只有拥有该内存的 TEE 内软件才能对其进行写入或读取，从而防止未经授权的访问或修改。内存保护支持以下功能：


    ### 数据和代码机密性


    这确保未经授权的实体无法查看或访问驻留在 TEE 内存中的数据或代码。这在实际上消除了泄露敏感数据（如个人数据或知识产权（IP），例如开发成本高达数百万美元的
    AI 模型）的风险。


    ### 数据和代码完整性


    这确保未经授权的实体无法添加、修改或删除驻留在 TEE 内存中的数据或代码。这一点至关重要，因为计算过程中必须保证数据和代码的完整性；否则，计算结果不可信。


    ### 证明


    证明是建立对 TEE 硬件和软件组件信任的关键方法。成功的证明可确保：


    - TEE 硬件的有效性和可信度。这确认 TEE 确实基于预期的硬件（制造商、版本、固件等），并且相关的内存保护功能已启用。

    - TEE 内运行的软件的有效性和可信度。这确认软件具有有效的身份（版本、运行时属性等），且未被篡改。


    ### 数据保护生命周期中的机密计算


    安全的主要目标之一是保护数据免受未经授权的访问，这类威胁来源众多，包括不法管理员、不法数据中心运营商以及黑客和企业间谍等外部威胁。数据保护的需求主要体现在三种状态下：数据静止、传输中和使用中。虽然保护静止数据和传输中数据的技术（如加密）已随时间成熟，但保护计算过程中使用中的数据却证明要困难得多。例如，传输中数据可以通过
    [TLS 协议]() 进行保护，而静止数据可以通过成熟的加密方法进行保护，例如 [FIPS-140]() 中规定的方法。


    然而，随着云计算的广泛采用，保护内存中使用中数据的需求急剧增加，从而导致了包括机密计算在内的各种技术的出现。[图 1-1]() 说明了机密计算如何帮助填补整体数据保护生命周期中的空白。


    现有加密

    机密计算


    静止数据

    在 blob 存储、数据库等中存储非活动数据时对其进行加密。


    传输中数据

    对在不受信任的公共或私有网络之间流动的数据进行加密。


    使用中数据

    保护/加密正在使用、位于 RAM 中以及正在计算过程中的数据。


    图 1-1. 数据保护生命周期中的机密计算


    简而言之，机密计算的主要目标是使用基于硬件、可证明的 TEE 来保护计算过程中使用中的数据。我们将在下一节讨论为什么证明对机密计算至关重要。目前，让我们先来看看
    TEE 的一些关键特性及其在机密计算中发挥的作用。


    ### 注意


    请注意，有几种技术可用于保护计算过程中使用中的数据，成熟度各不相同，包括但不限于同态加密（HE）、安全多方计算（SMPC）和零知识证明（ZKP）。有关隐私增强技术的更多资源，请参见附录
    B。


    ## 内存隔离级别


    CCC 对机密计算的定义是厂商中立的，并未规定 TEE 受保护内存中包含或排除的内容（该内存使用单个 CPU 生成的密钥进行加密）。CPU 厂商提供的不同机密计算实现为
    TEE 增加了一个新维度：内存隔离级别。


    目前，CPU 厂商提供三级 TEE 内存隔离：虚拟机级别、容器组级别和代码级别（细化到代码片段级别）。每个级别都由底层 CPU 固件分配唯一的内存加密密钥。表
    1-1 总结了这三种隔离级别。


    ### 表 1-1. TEE 内存隔离级别


    | 隔离级别 | 技术 | 迁移便捷性 | 防御云运营商和恶意第三方 | 防御威胁 |

    | :--- | :--- | :--- | :--- | :--- |

    | 虚拟机 | Intel® TDX,<sup>a</sup><br>AMD® SEV-SNP<sup>b</sup> | 原样迁移（Lift and shift）
    | 是 | 不是 <sup>b</sup> |

    | 容器组 | AMD® SEV-SNP | 原样迁移（Lift and shift） | 是 | 是 |

    | 应用程序代码 | Intel® SGX<sup>c</sup> | 需要重构代码 | 是 | 是 |


    <sup>a</sup> Intel® 信任域扩展（TDX）

    <sup>b</sup> 第 3 代 AMD® EPYC™ 处理器，支持安全加密虚拟化 - 安全嵌套分页（SNP）


    请注意，尽管虚拟机级别的隔离支持现有工作负载的原样迁移（Lift and shift），但默认情况下，它并不保护虚拟机（VM）内部的任何代码或数据免受内部威胁（例如拥有管理员权限的不法或失职用户）的影响。同样需要注意的是，尽管代码级别的隔离在
    TEE 中提供了最小的代码基，但这种隔离级别的代价是需要重构代码才能使用开源 SDK 进行实现。出于此原因，容器组级别的隔离在更轻松地保护云原生工作负载免受甚至内部威胁方面具有巨大潜力。


    ## 机密计算与零信任


    “零信任”一词最早由 Forrester 于 2009 年提出，尽管其根源可以追溯到“去边界化”概念，如《国防信息系统局（DISA）黑芯》和《杰里科论坛戒律》等出版物中所述。近年来，零信任获得了广泛支持。其重要性在于它已成为美国（及其他国家）国家网络安全战略的组成部分，如备忘录
    M-22-09《推动美国政府迈向零信任网络安全原则》中所述。零信任安全背后的理念是，不能仅凭边界来推断“安全”。相反，我们应采纳一种深植于“永不信任、始终验证”心态的安全方法。本节讨论了零信任的三个关键原则，以及硬件信任根、证明和
    TEE 大小在应对这些原则方面的重要性。


    ### 零信任原则


    要了解零信任及其指导原则，让我们来看看 NIST 提供的定义：“零信任（ZT）提供了一套概念和理念，旨在将在被视为已被攻破的网络环境中，强制执行信息系统和服务中准确的、按请求最小特权访问决策所带来的不确定性降至最低。”



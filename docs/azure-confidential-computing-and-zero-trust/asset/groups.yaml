    ## Azure 机密计算和零信任


    Azure 已经使用加密技术帮助保护静态数据和传输中数据。Azure 机密计算解决方案旨在通过在基于硬件、经过验证的可信执行环境 (TEE) 中处理数据，帮助防止未授权访问内存中正在使用的数据。在此过程中，这些解决方案通过支持零信任的三个关键原则（从硬件级别开始）：始终验证、应用最小权限访问和假设已发生泄露，帮助组织加强安全态势。


    Azure 提供一系列使用机密计算的服务，范围从虚拟机和容器服务到支持机密计算的 SaaS 和开发人员工具。


    了解 Azure 机密计算如何帮助您迁移和现代化最敏感的应用程序，或构建新的多方应用程序，这些应用程序结合跨组织的数据以产生洞察，同时不影响数据隐私。

    https://aka.ms/accdocs-ZT


    使用 Azure 免费帐户和 200 美元信用额度开始使用。

    https://aka.ms/Azure-free-ZT



  md: "\nmember since its inception. The CCC has grown to become home to a diverse\
    \ group of market-leading vendors that are driving transformation. The consortium\
    \ is also developing cross-industry standards under the Linux Foundation to promote\
    \ the adoption of confidential computing by focusing extensively on open source\
    \ communities and projects.\n\nFor more information on the CCC, please visit https://confidentialcomputing.io.\n\
    \n## Resources\n\nAzure confidential computing has been used by a diverse range\
    \ of customers and partners from a variety of sectors. The case studies highlighted\
    \ in the next section will show you how ACC helps protect data at cloud scale\
    \ in different scenarios. The section concludes with a list of helpful resources\
    \ that will aid in developing a more in-depth understanding of various features\
    \ of ACC.\n\n## Customer and Partner Case Studies\n\nThe following are a few examples\
    \ of how customers and partners are using ACC in real-world scenarios to protect\
    \ data from unauthorized access while it is in use.\n\nFor more details, please\
    \ visit the Microsoft Customer Stories site.\n\n- Signal is a free, open source,\
    \ private messaging application designed to protect the privacy of messages and\
    \ user data. It employed ACC as one of its cloud solutions, using secure enclaves\
    \ to host backend services.\n\n- Royal Bank of Canada (RBC) provides value to\
    \ millions of clients by offering trustworthy, modern financial services at scale.\
    \ Combining data and digital analysis allows RBC to turn data into personalized\
    \ offers with the piloted virtual clean room (VCR). The VCR is a privacy-preserving\
    \ multi-party data-sharing and collective insight generation platform built on\
    \ ACC that relies on Intel SGX secure enclave technology.\n\n- Leidos is a science,\
    \ engineering, and technology organization focused on solving some of healthcare’s\
    \ most demanding challenges. Sharing and aggregating real-world patient data and\
    \ evidence is key to driving better healthcare outcomes. At the same time, patient\
    \ privacy and medical records security need to be maintained. Leidos has employed\
    \ Microsoft Azure confidential computing using Intel SGX to accelerate clinical\
    \ trials and drive new insights, resulting in better patient outcomes while addressing\
    \ privacy concerns.\n\n- BeeKeeperAI uses ACC to create secure data enclaves built\
    \ on Intel SGX. Within the enclave, encrypted AI computes against an encrypted\
    \ dataset such that all aspects of the solution remain within the HIPAA-compliant\
    \ cloud environment.\n\n- Fireblocks is a blockchain infrastructure provider for\
    \ creating an ecosystem to reduce the complexity of working with digital assets\
    \ and cryptocurrencies and provide a higher level of security. Fireblocks uses\
    \ ACC and Intel SGX to redefine the digital assets industry, processing more than\
    \ $4 trillion in assets while achieving the highest international security certifications\
    \ and creating new opportunities on the blockchain network for organizations of\
    \ all types.\n\n- Decentriq is a Swiss company that offers an enterprise-grade\
    \ SaaS platform for confidential data collaboration. Decentriq is not only making\
    \ data collaboration simpler but, in many cases, is also using ACC to allow multiple\
    \ groups to come together and use sensitive data. Since migrating to the cloud\
    \ and accelerating its confidential computing journey with Azure, Decentriq has\
    \ made collaboration on sensitive datasets highly scalable and helped customers\
    \ to reach new milestones, including doubling the clickthrough rates for digital\
    \ advertising.\n\n- Swift is a leading infrastructure provider for financial messaging\
    \ services that has worked with over 11,500 institutions to drive new ways to\
    \ detect and catch fraudulent transactions. It has partnered with Microsoft to\
    \ innovate further in the fight against financial crime. Using federated learning\
    \ techniques along with Azure Machine Learning and ACC, Swift and Microsoft are\
    \ building an anomaly detection model for transactional data without copying or\
    \ moving data from secure locations.\n\n- Carbon Asset Solutions has a goal to\
    \ help the planet to get rid of damaging atmospheric carbon dioxide. It needed\
    \ to capture and encrypt precision carbon measurement data, protecting against\
    \ data tampering at both ends of the carbon credit process, while keeping long-term\
    \ global scalability in mind. By using ACC, Carbon Asset Solutions is working\
    \ to solve one of the earth’s pivotal environmental problems.\n\n## Readiness\n\
    \nHere are more resources to dive deeper into the capabilities of ACC:\n\n- Azure\
    \ Confidential Computing Official Blog\n- Microsoft Zero Trust Principles\n- Microsoft\
    \ Learn course: “Intro to confidential computing with Azure Virtual Machines”\n\
    \nHere are conference sessions and other training videos:\n\n- Microsoft Build\
    \ Conference 2023\n- Open for AI: Secure Paths to Data Collaboration Volume and\
    \ Diversity\n- AMD + Azure: Outstanding Performance and the Latest Security Features\n\
    - Designing Secure Azure SQL Database Solutions\n- Harnessing Generative AI with\
    \ NVIDIA AI and Microsoft Azure\n- Microsoft Secure Conference 2023\n- Azure Confidential\
    \ Computing and Zero Trust\n- Secure Data Sharing & Privacy Preserving Computation\n\
    - Trust Your Hardware & Software: Microsoft Azure Attestation\n- Open Confidential\
    \ Computing Conference 2023\n- Industry Perspectives: The Impact and Future of\
    \ Confidential Computing\n- CTO Panel: The Impact of Confidential Computing with\
    \ Intel, Azure, AMD, & NVIDIA\n- Others\n- Learn Live: Intro to Confidential Computing\
    \ with Azure Virtual Machines\n- Azure Confidential Computing with Confidential\
    \ VMs and AKS Nodes: Azure Friday\n- How to Use Azure Confidential VM Guest Attestation\n\
    - Azure confidential computing partners\n- DCasv5 and ECasv5 Series Confidential\
    \ VMs\n\nThis report examines the fundamental principles of confidential computing,\
    \ the roles it plays in protecting the privacy of data while in use, and how it\
    \ aligns with zero-trust principles. It also outlines how Microsoft ACC brings\
    \ confidential computing to the Azure cloud. ACC enables organizations to deploy\
    \ highly sensitive workloads in the cloud by providing guarantees backed up by\
    \ cryptographic proofs that their workloads, including data and code, are not\
    \ accessible when in use by any unauthorized party, including Microsoft. This\
    \ allows for defense in depth and adherence to zero-trust principles by removing\
    \ any implicit trust in using ACC features like attestation that provide assurance\
    \ that hardware and software have not been tampered with. Furthermore, this strategy\
    \ allows organizations to complete the entire trifecta of data security: protection\
    \ of data at rest, in transit, and in-use. It helps organizations operate with\
    \ an “always assume a breach” mindset, which is a fundamental tenet of zero trust.\n\
    \n## Appendix A. Abbreviations and Acronyms\n\n| Abbreviation | Meaning |\n| ---\
    \ | --- |\n| AI | artificial intelligence |\n| ACC | Azure confidential computing\
    \ |\n| AKS | Azure Kubernetes Service |\n| AKV | Azure Key Vault |\n| ACI | Azure\
    \ Container Instances |\n| ACL | Azure Confidential Ledger |\n| CCC | Confidential\
    \ Computing Consortium |\n| CCF | Confidential Consortium Framework |\n| GPT |\
    \ generative pre-trained transformer |\n| HE | homomorphic encryption |\n| HSM\
    \ | Hardware Security Module |\n| IoT | Internet of Things |\n| JIT/JEA | just-in-time\
    \ and just-enough access |\n| LLM | large language model |\n| LLaMA | Large Language\
    \ Model Meta AI |\n| MHSM | Managed Hardware Security Module |\n| NIST | National\
    \ Institute of Standards and Technology |\n| OT | operational technology |\n|\
    \ PaaS | platform as a service |\n| PET | privacy-enhancing technology |\n| SaaS\
    \ | software as a service |\n| SEV-SNP | AMD Secure Encrypted Virtualization–Secure\
    \ Nested Paging |\n| SGX | Intel Software Guard Extensions |\n| SKR | Secure Key\
    \ Release |\n| SMPC | secure multiparty computation |\n| TDX | Intel Trust Domain\
    \ Extensions |\n| TEE | trusted execution environment |\n| TPM | Trusted Platform\
    \ Module |\n| VCR | virtual clean room |\n| vTPM | \n"
  mdcn: "\n\n自成立以来一直是会员。CCC 已成长为汇聚多样化市场领先供应商的平台，这些供应商正在推动转型。该联盟还在 Linux 基金会下制定跨行业标准，通过广泛关注开源社区和项目，推动保密计算的采用。\n\
    \n有关 CCC 的更多信息，请访问 https://confidentialcomputing.io。\n\n## 资源\n\nAzure 保密计算已被来自各个领域的多种客户和合作伙伴使用。下一部分中介绍的案例研究将向您展示\
    \ ACC 如何在不同场景下帮助保护云规模数据。本部分最后列出了有用的资源，有助于深入了解 ACC 的各种功能。\n\n## 客户和合作伙伴案例研究\n\n\
    以下是客户和合作伙伴在实际场景中使用 ACC 保护使用中数据免受未经授权访问的几个示例。\n\n有关更多详细信息，请访问 Microsoft 客户案例网站。\n\
    \n- Signal 是一款免费、开源的私密消息传递应用程序，旨在保护消息和用户数据的隐私。它将 ACC 作为其云解决方案之一，使用安全 Enclave 托管后端服务。\n\
    \n- 加拿大皇家银行 (RBC) 通过提供可信赖的大规模现代金融服务，为数百万客户创造价值。结合数据和数字分析，使 RBC 能够通过试点的虚拟干净室 (VCR)\
    \ 将数据转化为个性化报价。VCR 是一个基于 ACC 构建的隐私保护多方数据共享和集体洞察生成平台，依赖于 Intel SGX 安全 Enclave 技术。\n\
    \n- Leidos 是一家专注于解决医疗保健领域最具挑战性问题的科学、工程和技术组织。共享和汇总真实世界的患者数据和证据是推动更好医疗保健结果的关键。同时，需要维护患者隐私和医疗记录安全。Leidos\
    \ 已采用基于 Intel SGX 的 Microsoft Azure 保密计算来加速临床试验并获得新洞察，从而改善患者结果并解决隐私问题。\n\n- BeeKeeperAI\
    \ 使用 ACC 创建基于 Intel SGX 的安全数据 Enclave。在 Enclave 内部，加密 AI 对加密数据集进行计算，使解决方案的所有方面都保留在符合\
    \ HIPAA 的云环境中。\n\n- Fireblocks 是一家区块链基础设施提供商，旨在创建一个生态系统，以降低处理数字资产和加密货币的复杂性并提供更高级别的安全性。Fireblocks\
    \ 使用 ACC 和 Intel SGX 来重新定义数字资产行业，处理超过 4 万亿美元的资产，同时获得最高国际安全认证，并为各类组织在区块链网络上创造新机会。\n\
    \n- Decentriq 是一家瑞士公司，提供面向保密数据协作的企业级 SaaS 平台。Decentriq 不仅让数据协作更加简单，而且在许多情况下还使用\
    \ ACC 来允许多个群体汇聚在一起使用敏感数据。自迁移到云并借助 Azure 加速其保密计算之旅以来，Decentriq 已使敏感数据集的协作高度可扩展，并帮助客户达到新里程碑，包括使数字广告的点击率翻倍。\n\
    \n- Swift 是金融消息传递服务领域的领先基础设施提供商，已与超过 11,500 家机构合作，推动发现和拦截欺诈交易的新方式。它已与 Microsoft\
    \ 合作，在打击金融犯罪方面进一步创新。Swift 和 Microsoft 正在使用联邦学习技术，以及 Azure Machine Learning 和 ACC，为事务数据构建异常检测模型，无需从安全位置复制或移动数据。\n\
    \n- Carbon Asset Solutions 的目标是帮助地球摆脱有害的大气二氧化碳。它需要捕获并加密精确碳测量数据，在碳信贷流程的两端都防止数据篡改，同时着眼于长期的全球可扩展性。通过使用\
    \ ACC，Carbon Asset Solutions 正在努力解决地球上最关键的环境问题之一。\n\n## 就绪性\n\n以下是更多资源，可深入了解 ACC\
    \ 的功能：\n\n- Azure 保密计算官方博客\n- Microsoft 零信任原则\n- Microsoft Learn 课程：“使用 Azure\
    \ 虚拟机进行保密计算简介”\n\n以下是会议环节和其他培训视频：\n\n- Microsoft Build 2023 会议\n- Open for AI：安全数据协作路径——规模与多样性\n\
    - AMD + Azure：出色的性能和最新安全功能\n- 设计安全的 Azure SQL 数据库解决方案\n- 利用 NVIDIA AI 和 Microsoft\
    \ Azure 发挥生成式 AI 的潜力\n- Microsoft Secure 2023 会议\n- Azure 保密计算和零信任\n- 安全数据共享和隐私保护计算\n\
    - 信任您的硬件和软件：Microsoft Azure 证明\n- 开放保密计算会议 2023\n- 行业观点：保密计算的影响与未来\n- CTO 小组讨论：与\
    \ Intel、Azure、AMD 和 NVIDIA 的保密计算影响\n- 其他\n- Learn Live：使用 Azure 虚拟机进行保密计算简介\n\
    - Azure 保密计算与保密 VM 和 AKS 节点：Azure Friday\n- 如何使用 Azure 保密 VM 来宾证明\n- Azure 保密计算合作伙伴\n\
    - DCasv5 和 ECasv5 系列保密 VM\n\n本报告探讨了保密计算的基本原理、其在保护使用中数据隐私方面的作用，以及它如何与零信任原则保持一致。它还概述了\
    \ Microsoft ACC 如何将保密计算引入 Azure 云。ACC 通过提供由加密证明支持的保证，使组织能够在云中部署高度敏感的工作负载，确保其工作负载（包括数据和代码）在使用时不会被任何未经授权的方（包括\
    \ Microsoft）访问。这通过在使用 ACC 功能（如证明）时消除任何隐式信任，从而实现纵深防御并遵守零信任原则，这些功能可确保硬件和软件未被篡改。此外，此策略使组织能够完成数据安全的整个三位一体：静态数据、传输中数据和使用中数据的保护。它帮助组织以“始终假设已发生泄露”的思维方式运营，这是零信任的基本原则。\n\

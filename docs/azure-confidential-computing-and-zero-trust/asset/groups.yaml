    among others. Explicit verification, a key tenet of zero trust, represents a significant
    departure from the commonly used security approach known as perimeter-based security,
    which has a more relaxed security posture and allows entity access to resources
    within the perimeter (e.g., applications, services, etc.) without verifying the
    full context of the request every time a request is made. In essence, the principle
    of explicit verification achieves a higher security posture by requiring all requests
    to be explicitly scrutinized every time an access request is made.


    ## Use least-privilege access


    The principle of least-privilege access stresses applying security techniques
    such as just-in-time and just-enough-access (JIT/JEA) to ensure that when access
    is granted, it is limited to what is necessary. This reduces the attack surface
    area by limiting access privileges and the access duration to the absolute minimums
    required to complete the task. In addition to JIT/JEA, machine learning–based
    risk policies that are adaptive in nature should be implemented to ensure least-privilege
    access is enforced consistently throughout the environment.


    ## Assume breach


    The principle of assume breach focuses on operating and protecting organizational
    resources with the assumption that an adversary is already present in the environment.
    This mindset leads to security measures such as “deny by default” and the application
    of thorough scrutiny to all users, devices, data flows, and access requests on
    a continual basis. Assuming a breach has occurred also emphasizes the necessity
    of logging, inspecting, and continuously monitoring any configuration changes,
    resource accesses, and network traffic for suspicious behavior.


    ## Importance of Hardware Root of Trust for Zero Trust


    The hardware root of trust serves as a bedrock for the security of any confidential
    computing platform. According to NIST, the root of trust is “a starting point
    that is implicitly trusted.” The hardware root of trust is typically a silicon
    chip, or set of chips, specifically designed to be highly tamper resistant. Once
    the chips are produced, they are nonfungible, so their trustworthiness cannot
    practically be compromised after they are deployed in the field (though that doesn’t
    mean it is impossible). This trust stems from the fact that silicon chips first
    measure themselves using cryptographic methods and provide assurances that they
    have not been tampered with, and these assurances can be verified at any time.
    The underlying idea is that a hardware chip establishes trust at the root level
    before any other components further down the boot process chain, and so on, are
    executed.


    When organizations maintain exclusive data centers in a private cloud, they control
    the hardware infrastructure and assume responsibility for managing the servers.
    However, when organizations adopt public cloud, they increase their dependence
    on cloud operators for infrastructure management and datacenter operations. The
    hardware root of trust for TEEs helps ensure that customer data is kept private
    even when in use in a public cloud.


    As its name indicates, hardware root of trust is established by hardware provided
    by the chip manufacturer instead of software provided by the cloud operator. This
    provides a separation of concerns that helps safeguard against various types of
    threats, including those that may arise when a cloud operator gains access to
    data while it is in use in memory. This is because the keys used to encrypt data
    in memory are generated by CPU firmware and unavailable to cloud operators. Furthermore,
    the attestation process helps ensure data and code integrity and confidentiality
    by preventing that workload from executing if it is migrated to hardware without
    memory protection enabled.


    In this way, hardware root of trust along with attestation facilitate the implementation
    of the zero-trust principles of explicitly verifying and assuming breach. Organizations
    may always assume a compromise by anyone, including the cloud operator, and still
    maintain a high security posture by explicitly verifying the TEE and the code
    executing within it. This decoupling, which removes the need to trust the cloud
    operator hosting the infrastructure, is a significant step toward implementing
    zero trust.


    The verification of the root of trust establishes that the hardware is authentic
    and is configured to support a TEE. It also establishes that the code running
    within the TEE has not been tampered with. This is achieved through attestation,
    which is discussed next.


    ## Importance of Attestation for Zero Trust


    Attestation is a key enabler for organizations implementing zero trust to move
    their confidential workloads to the cloud and enjoy the benefits of cloud scalability
    and performance. Without attestation, they must rely on the cloud operator’s word
    regarding the privacy safeguards in place to prevent unauthorized access to data
    while it is in use.


    Attestation removes the need for an organization to implicitly trust the TEE hardware
    and the code running within it. It provides a mechanism for verification by expressly
    requesting cryptographic evidence that proves both the validity of the TEE itself
    (e.g., it is a valid hardware-based TEE with the required attributes) and that
    the code has not been altered (e.g., code hash).


    Additionally, attestation facilitates the implementation of the zero-trust principles
    of explicitly verifying and assuming breach. Organizations may assume a compromise
    by anyone, including the cloud operator, and still maintain a high security posture
    by explicitly verifying TEE and the code executing within it.


    ## Memory Isolation Level and Zero Trust


    When designing a secure system, reducing the size of the code in the TEE is desirable
    because it reduces the attack surface area available for malicious actors to exploit.
    Moreover, when it removes the guest OS (the OS within the VM) from the TEE, as
    in the case with code-level and container-level isolation, it can help protect
    against insider threats. In this way, less is more when it comes to how much code
    is in the TEE. Any component that is a part of the TEE must also be able to provide
    assurances via attestation using cryptographic methods regarding its authenticity—that
    its measurements at deployment time were as intended; otherwise, the other components
    in the system that depend on it won’t “trust” it.


    In confidential computing, trust must be established all the way down to the silicon/CPU
    manufacturer, using the previously described concepts of hardware root of trust
    and attestation. These allow you to explicitly verify the state of the TEE components
    and that all access to and from the TEE adheres to the principle of least-privilege
    access. Various vendor-specific technologies enable reduction of what is in the
    TEE by providing memory isolation at different levels such as virtual machine
    level, container group level, and code level (even reducing it to few lines of
    code). As a result, more software can be moved outside of the TEE and can be breached
    without affecting the data in the TEE.


    Figure 1-3 highlights how the three zero-trust principles of assume breach, verify
    explicitly, and use least-privilege access align with the key features of confidential
    computing and the significance of the level of memory isolation in assuming what
    can be breached.


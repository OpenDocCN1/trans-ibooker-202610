    \ 虚拟机的受信启动”。\n\n### 使用客户托管密钥的磁盘加密\n\nAzure 托管磁盘（OS 磁盘和数据磁盘）支持使用客户托管密钥的磁盘加密。它允许客户使用自己的密钥加密单个磁盘。对于客户托管密钥，此密钥用于保护并限制对用于保护数据的加密密钥的访问。客户可以将其托管密钥存储在\

    ## Foreword


    Traditional systems encrypt data at rest and in transit, but they could not encrypt
    data while it is in use. Confidential computing extends data protection to data
    in use in memory, enabling protection throughout the entire data lifecycle and
    adding another layer of defense, enhancing intellectual property (IP) protection,
    data privacy, and data integrity. This is especially critical today, as the exponential
    growth of datasets and the machine learning software for analyzing those datasets
    have led to increased scrutiny of how data and code are exposed.


    Confidential computing protects data in use by isolating data within a trusted
    execution environment (TEE), which is like a sealed box for data processing. From
    the outside, the data appears encrypted, and it is only decrypted inside the TEE
    once it is verified by the key holder. This isolation is rooted in hardware, effectively
    rendering even the cloud-hosting infrastructure and its administrators incapable
    of accessing the data.


    This means that services can be designed with zero trust in mind. They can segment
    data based on least-privilege access principles. For example, data may be accessible
    only to the code that needs access to perform its function, while all other code
    in the system sees only encrypted data. Least privilege access isn''t the only
    way confidential computing enforces zero trust principles. Zero trust also includes
    the ability to attest the proper state of the hardware and software within the
    TEE, thereby supporting the zero trust principle of “always verify.” Finally,
    confidential computing supports the principle of “assume breach,” because any
    software not in the TEE cannot access the memory of the TEE, even if that software
    is breached.


    Confidential computing does more than help organizations improve their security
    posture. It also helps unlock more of the potential in data, enabling innovation
    and empowering businesses and developers to build new kinds of services previously
    inhibited by security or privacy constraints. Organizations can collaborate on
    combined datasets without revealing data to other parties, achieving richer insights
    than one company could discover alone. They can also enable artificial intelligence
    (AI) researchers to access datasets in a privacy-preserving fashion. This will
    help unlock privacy-enhanced personal AI services, make available trustworthy
    and transparent hardware and software supply chains, and revolutionize solving
    problems at scale across various domains.


    Microsoft isn’t alone in using confidential computing to evolve data protection.
    The Confidential Computing Consortium (CCC) was founded to enable hardware vendors,
    cloud providers, and companies that build software to collaborate and co-create
    solutions for the benefit of all. This cross-industry group is cooperating to
    ensure that confidential computing becomes the new norm for computing, notably
    by developing standards and practices that can ensure the interoperability of
    confidential computing devices, protocols, and services. In the near future, “confidential
    computing” will just be “computing.”


    This report serves as an introduction to confidential computing, how it supports
    zero trust starting at the hardware level, and how it is benefiting Azure customers
    today. It also provides a snapshot of Azure’s confidential computing portfolio
    of products and features along with links to learn more. It will help organizations
    explore, understand, and consider how this technology can create a more secure
    and innovative future.


    *Mark Russinovich*

    *Azure CTO and Technical Fellow*

    *Microsoft*



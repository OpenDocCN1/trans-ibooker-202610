    \n有关更多详细信息，请阅读文章“Azure 磁盘存储的服务器端加密：客户托管密钥”。\n\n### 托管 HSM\n\nAzure Key Vault 托管硬件安全模块\
    \ (MHSM) 是一种单租户、基于云的、FIPS 140-2 第 3 级验证的密钥管理服务，可确保对客户拥有的密钥提供最高级别的保护。这种“密钥主权”意味着客户组织对谁可以访问密钥和更改密钥管理策略，以及哪些\
    \ Azure 服务消耗这些密钥拥有完全且排他性的控制权。\n\n客户做出这些决定后，通过技术手段防止 Microsoft 人员更改这些决定。托管 HSM\
    \ 服务利用 Azure 机密计算的功能，在基于 Intel Software Guard Extensions (SGX) 构建的 TEE 中运行。Intel\
    \ SGX 利用应用程序 enclave 内的基于硬件的隔离来提供针对内部和外部威胁的增强安全措施，以在数据处于活动使用状态时保护数据。即使使用调试器，也无法查看应用程序\
    \ enclave 内部的数据或代码。如果不受信任的代码尝试更改应用程序 enclave 内存中的内容，Intel SGX 会禁用该环境并拒绝该操作。这些独特功能可帮助您保护加密密钥材料，防止其作为明文被访问或可见。托管\
    \ HSM 的功能包括：\n\n- 单租户且完全托管。\n- FIPS 140-2 第 3 级验证。\n- 高可用性且支持区域恢复。\n- 每个 HSM 池包含多个\
    \ HSM 分区，这些分区跨越多个数据中心中多个机架上的三台服务器。在发生硬件故障的情况下，HSM 的成员分区将自动迁移到健康硬件上。\n- 每个 HSM\
    \ 实例使用单独的客户特定安全域，以加密方式隔离每个客户的 HSM。\n\n有关更多详细信息，请阅读文章“什么是 Azure Key Vault 托管 HSM？”。\n\

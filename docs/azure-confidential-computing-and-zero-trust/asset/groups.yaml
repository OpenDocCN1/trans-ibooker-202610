    ### Assume breach

    - By the cloud vendor who operates the data center

    - By other tenants (due to the multitenant nature of the cloud)


    ### Verify explicitly

    - The identity of the software attempting to access the encrypted memory

    - The authenticity and state of the TEE hardware and software


    ### Use least-privilege access

    - Memory can only be read and written by the VM, container group, or code segment
    that originally wrote it

    - By company''s own administrators (by using container-level or code-level memory
    isolation)


    Figure 1-3. How confidential computing addresses zero-trust principles and the
    role of memory isolation level in reducing insider threats


    Confidential computing enables organizations to prevent unauthorized access to
    their data and code while they are in use. The hardware root of trust and attestation
    act as the bedrock of confidential computing, allowing organizations to implement
    zero trust while fully utilizing the public cloud because they have the ability
    to verify the cloud environment. In the next chapter, you will learn about the
    Azure confidential computing (ACC) platform, including its various features and
    supporting services that enable organizations to run a variety of confidential
    workloads on Azure.


    ## Chapter 2. Use Cases and Scenarios


    This chapter explores various use cases of confidential computing and how it protects
    data privacy in different scenarios. These scenarios include the lift and shift
    of sensitive workloads in regulated industries, sovereign government workloads,
    data clean rooms, confidential AI, and other use cases.


    ### Lift and Shift


    Today’s confidential computing technologies are an enabler for organizations,
    particularly in highly regulated industries, that want to migrate existing sensitive
    workloads to the public cloud with minimal effort or add further protection to
    workloads already running in the public cloud. With VM-level and container-level
    isolation technologies, organizations can now migrate their most sensitive VM-
    and container-based workloads to confidential computing-enabled infrastructure
    with no changes to their code, accelerating the adoption of these technologies.


    ### Sovereign Government Workloads


    Governments and public institutions require a high degree of data sovereignty
    due to the sensitive nature of the data they manage. Moreover, the presence of
    threats such as insider risk and espionage present substantial hurdles for governments
    when considering the use of a public cloud, since doing so requires trust in the
    cloud operator. Confidential computing reduces the need for inherent trust in
    cloud operators by implementing methods that ensure the protection of both data
    and code from unauthorized access, even by the cloud operator. Confidential computing
    enables highly confidential workloads to run in the cloud and enables governments
    to adopt a never-trust, always-verify security mindset when migrating and running
    their workloads in the cloud. Microsoft Azure addresses these requirements with
    Microsoft Cloud for Sovereignty.


    ### Data Clean Rooms


    The goal of a data clean room is to allow multiple data providers to share data
    with model and algorithm providers to gain insights from a broader, previously
    unavailable set of data, all while maintaining governance and privacy rules. Confidential
    computing enables data clean rooms by providing cryptographic verification that
    data providers do not have access to data or associated models even when computation
    is taking place on them. This reinforces the zero-trust principle by guaranteeing
    that no party is allowed to access data or models.



    信任是组织拥抱云计算的关键因素，而机密计算在建立信任方面至关重要，该信任通过加密保证支持，确保数据在使用过程中始终受到保护，防止未经授权的访问。Microsoft
    已将为客户提供 Azure 中一流的安全和隐私功能而不牺牲性能列为首要任务。Microsoft 于 2017 年 9 月提供了其首个机密计算产品/服务（带应用程序隔区的

    ![](img/32b055c352c70d22a656320349173d95_204_0.png)


    Figure 14-5. Shortcut for List Members


    ## Documentation


    IntelliSense can give you many tips. It can also show you the basic usage of the
    feature you search for. However, the place where you can find all the detailed
    information is the online documentation.


    ### docs.microsoft.com


    The Web at http://docs.microsoft.com is the best place to start looking for anything
    concerning C# and other Microsoft technologies (see Figure 14-6). On the page,
    click “Documentation” and then go directly to “C#”.


    ![](img/32b055c352c70d22a656320349173d95_205_0.png)


    *Figure 14-6. Microsoft documentation*


    ### Search


    You can work with the documentation site using the links provided. However, more
    frequently you are going to search for specific things. For example, enter **Console
    class** in the search field and press the Enter key (see Figure 14-7).


    ![](img/32b055c352c70d22a656320349173d95_206_0.png)


    *Figure 14-7.* Searching for “Console class”


    The link you are interested in is often the first one returned (see Figure 14-8).


    ![](img/32b055c352c70d22a656320349173d95_206_1.png)


    *Figure 14-8.* Viewing documentation for “Console class”


    ### Specific Class Page


    After clicking the correct link, you will find all the things about a specific
    class, such as Console in this example.


    When I am getting acquainted with some class I do not know yet, I usually look
    for “Common Operations” and “Remarks” sections, which cover basic information
    about the class usage and entry points to further details (see Figures 14-9 and
    14-10).


    ![](img/32b055c352c70d22a656320349173d95_207_0.png)


    ### Common Operations


    The Console class contains the following methods for reading console input and
    writing console output:


    - The overloads of the ReadKey method read an individual character.

    - The ReadLine method reads an entire line of input.

    - The Write method overloads convert an instance of a value type, an array of
    characters, or a set of objects to a formatted or unformatted string, and then
    write that string to the console.

    - A parallel set of WriteLine method overloads output the same string as the Write
    overloads but also add a line termination string.


    The Console class also contains methods and properties to perform the following
    operations:


    - Get or set the size of the screen buffer. The BufferHeight and BufferWidth properties
    let you get or set the buffer height and width, respectively, and the SetBufferSize
    method lets you set the buffer size in a single method call.


    Figure 14-9. Getting introductory information in the Common Operations section


    ### Remarks


    The console is an operating system window where users interact with the operating
    system or with a text-based console application by entering text input through
    the computer keyboard, and by reading text output from the computer terminal.
    For example, in the Windows operating system, the console is called the Command
    Prompt window and accepts MS-DOS commands. The Console class provides basic support
    for applications that read characters from, and write characters to, the console.


    For information about developing with the Console class, see the following sections:


    - Console I/O Streams

    - Screen Buffer and Console Window

    - Unicode Support for the Console

    - Common Operations

    - .NET Core Notes


    ![](img/32b055c352c70d22a656320349173d95_208_0.png)


    ### Common Search


    To conclude this section about documentation, note that you can perform your searches
    outside of the Microsoft documentation site, too. Simply use your favorite web
    browser to search.


    However, contrary to a documentation site search, a common search displays irrelevant
    results more frequently. To compensate for this, you can refine your query using
    the programming language name, such as entering **Console class C#** in your favorite
    web browser’s search field.


    ## Debugging Tools


    Besides IntelliSense and documentation, there are other tools that you are going
    to find helpful. Specifically, you can use debugging tools that allow you to look
    inside a computer, so to speak. You can use them to see how the computer executes
    individual commands, what values are stored in memory, and so on.


    These are the tools you are going to study now. Originally, they were developed
    to facilitate program debugging, in other words, searching for and removing errors.
    However, they are probably even more useful as illustrative tools to facilitate
    your understanding of various programming constructions.


    ### Project


    It is best to try all the tools in practice, so please open the “Treating incorrect
    input” project in Visual Studio from Chapter 8. The program adds two numbers and
    treats possible input errors using try-catch.


    ### Stepping Through the Code


    A computer works so fast that it is impossible to follow it with its gigahertz
    speed. That is why it’s often helpful to *step through* the code, which forces
    the computer to execute one statement at a time, upon your command.


    Go to your opened “Treating incorrect input” project and launch it using the F10
    key instead of the usual F5. Of course, selecting the Debug ➤ Step Over menu does
    the same thing (see Figure 14-11).


    ### Breakpoints


    I have covered what to do if you do not want to step through your code after you
    have passed the point you are interested in. There is another situation. Say you
    do not want to do any stepping before you get to the place of interest. In that
    case, you can use a breakpoint.


    Click the statement where the computer is to stop and press F9 (alternatively,
    right-click and choose Breakpoint ➤ Insert Breakpoint). The fact a breakpoint
    has been placed is indicated with a dark red background and a dark red bullet
    at the beginning of the line (see Figure 14-12).


    ![](img/32b055c352c70d22a656320349173d95_211_0.png)


    Figure 14-12. Inserted breakpoint


    ### Using a Breakpoint


    If your program is still running from the previous exercise, terminate it by using
    the Shift+F5 key combination. Now launch the program the regular way, in other
    words, using the F5 key. It will run normally, and it will stop when it reaches
    the breakpoint. Visual Studio pops up in front of the program’s window.


    After that, you can step through the code or just look at something and use the
    F5 key to run your program further until its end or until the next breakpoint.


    ### Removing a Breakpoint


    To remove a breakpoint that you do not need any longer, press F9 again on a particular
    line, or right-click and choose Breakpoint ➤ Delete Breakpoint from the context
    menu.


    ### Memory Inspection


    Whenever your program is suspended (from a breakpoint, stepping, and so on), you
    can inspect the memory that is available to your program and explore the values
    of individual variables.


    To facilitate memory inspection, Visual Studio shows the Autos, Locals, and Watch
    panes at the bottom of its window. If those panes are not there, you can display
    them using the Debug ➤ Windows menu.


    While the Autos and Locals panes automatically select the variables to display,
    the Watch pane is populated manually according to what you want to see. You can
    enter a particular variable’s name in the pane, or you can right-click the variable
    in the code and select Add Watch from the context menu (see Figure 14-13).


    ```\n\nIt is better with usings, isn’t it?\n\n### C# 9.0 Minimalistic Program\n\
    \nSince we are experimenting with things outside the Main method, it is a proper\
    \ time now to get acquainted with a C# 9.0 innovation allowing you to omit “boilerplate\
    \ code,” namely, namespace, class, and Main lines (plus corresponding braces,\
    \ of course).\n\nGet back to the “Working with Date Components” earlier in this\
    \ chapter, and open the appropriate project in Visual Studio once more.\n\nRemove\
    \ everything that is not our code with the exception of the using lines. Specifically,\
    \ you should delete three lines beginning with namespace, class, and Main, plus\
    \ three opening braces and three closing braces. Your code editor in Visual Studio\
    \ will look like Figure 5-7.\n\n![](img/32b055c352c70d22a656320349173d95_91_0.png)\n\
    \n*Figure 5-7.* Omitting “boilerplate code”\n\nHit the F5 key to run the program.\
    \ At first, it may look like deleting all these lines was not a good idea (see\
    \ Figure 5-8).\n\n```csharp\nConsole.WriteLine(\"64-bit system: \" + Environment.Is64BitOperatingSystem);\n\
    Console.WriteLine(\"User name: \" + Environment.UserName);\n\n// Waiting for Enter\n\
    Console.ReadLine();\n}\n```\n\nContrary to the previous program, I have not extracted\
    \ object components into variables here. I have used them directly just so you\
    \ could see another possible way of using them.\n\n## Summary\n\nIn this chapter,\
    \ you got acquainted with objects, which are essentially conglomerates of several\
    \ components. Contrary to “atomic” (single-valued) types such as int or string,\
    \ objects usually contain a number of values.\n\nSpecifically, you met the following:\n\
    \n- The DateTime object, which can be used to retrieve the current date or time\n\
    - The Environment object, which can be used to retrieve information about a program’s\
    \ “surroundings” such as computer names or usernames\n\nYou also learned the following:\n\
    \n- The objects can be stored in variables of the appropriate type.\n- An object’s\
    \ components can be accessed via the so-called dot notation. You write the name\
    \ of an object’s variable and append the dot, and a list of available components\
    \ pops up thanks to Visual Studio IntelliSense.\n- Each object type belongs to\
    \ some namespace. To put it simply, namespaces can be viewed as containers of\
    \ similar object types.\n- An important namespace is the System namespace, which\
    \ contains basic object types such as DateTime or Console.\n"
  mdcn: "\n\n## 小结\n\n在本章中，你了解了变量这一重要概念。在每个实际程序中，您都需要将值（计算结果、用户输入等）临时存储在计算机的内存中，而变量正是用来实现这一点的。变量是内存中的一个位置，它有引用的名称，并通过数据类型明确存储其中数据的类型。\n\
    \n具体来说，你学习了以下内容：\n\n-   在使用变量之前，必须先声明它。一个合适的声明语句是`string message;`。\n-   要将值存储到变量中，需要使用*哪个\
    \ = 什么;* 的赋值语句格式。例如：`message = \"Some text\";`。\n-   在C#中，文本的数据类型是`string`。\n\
    -   整数（整数）的数据类型是`int`。\n-   在编程中，与日常用法不同，必须注意区分整数和小数。\n-   小数的数据类型是`double`。\n\
    -   有一个特殊的数据类型叫做`bool`，用于存储所谓的逻辑值 true 和 false，它们对应着计算机中的“是”和“否”。\n\n## 第5章 使用对象\n\
    \n`string`、`int`、`double`和`bool`类型的变量总是包含一个单一值——文本、一个数字或一个“是/否”值。然而，这些“原子”值可以组合成聚合体，称为*对象*。一个对象可以包含多个值，这些值被称为其*组成部分*或*成员*。这种组合甚至可以更进一步，例如，一个对象内部可以包含多个其他对象。在本章中，你将学习有关对象的知识。\n\
    \n### 现在几点？\n\n你将遇到的第一个对象是DateTime对象，它包含某个时间点（如日、月、年、小时、分钟、秒等）的各种组成部分。\n\n###\
    \ 任务\n\n你将编写一个向用户显示当前日期和时间的程序（见图5-1）。\n\n![](img/32b055c352c70d22a656320349173d95_82_0.png)\n\
    \n*图5-1.* 显示当前日期和时间\n\n在此任务中，你将了解DateTime类型的对象。\n\n### 解决方案\n\n代码如下：\n\n```csharp\n\
    static void Main(string[] args)\n{\n    // Variable of DateTime type, at first\
    \ empty\n    DateTime now;\n\n    // Storing of current date and time into our\
    \ variable\n    now = DateTime.Now;\n\n    // Output\n    Console.WriteLine(\"\
    Now is \" + now);\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\
    \n### 今天是几号？\n\n让我们进一步探索DateTime对象。\n\n### 任务\n\n假设你只对今天的日期感兴趣，而不包含时间部分（见图5-2）。\n\
    \n### 处理日期组成部分\n\n你可能想知道对象的*组成部分*在哪里。让我们来看看DateTime对象的组成部分。如果在DateTime类型的变量后附加一个点，Visual\
    \ Studio的IntelliSense会显示所有可用的组成部分。\n\n### 任务\n\n你将学习DateTime对象的各个组成部分。\n\n###\
    \ 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Current\

    Variables of type `string`, `int`, `double`, and `bool` always contain a single
    value—text, a single number, or a single yes/no value. However, such “atomic”
    values can be grouped into aggregates that are called *objects*. A single object
    can contain multiple values that are called its *components* or *members*. Grouping
    can go so far that an object can contain several other objects inside itself,
    for example. In this chapter, you are going to learn about objects.



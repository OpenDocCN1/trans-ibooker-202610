    \ latest and greatest version of Windows. As of January 2021, you can even have\
    \ Windows 7 with Service Pack 1 installed. Also, to work with the book, you do\
    \ not even need the latest Visual Studio version. Almost all the examples in the\
    \ book will run on older versions perfectly well.\n\n### Non-Windows Operating\
    \ Systems\n\nIf you do not have the Windows operating system on your computer,\
    \ you will be happy to hear about the Visual Studio Code development environment.\
    \ This is a free-of-charge, multiplatform IDE running also on Linux or Mac, allowing\
    \ you to program in C# on these systems.\n\nIn this book’s examples, I will use\
    \ Visual Studio Community installed on Windows. I recommend you do the same. If\
    \ this is not feasible for you, use Visual Studio Code, taking into account that\
    \ some things might be a little different from what you see in the book.\n\n![](img/32b055c352c70d22a656320349173d95_34_0.png)\n\

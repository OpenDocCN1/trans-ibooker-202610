    ```\n\n### 讨论\n\n请注意以下几点：\n\n- 在代码中，你始终需要使用一个小数*点*作为数字整数部分和小数部分之间的分隔符。\n- 但是，输出取决于你的Windows设置。如图4-3所示，我的计算机输出使用逗号作为小数点分隔符，因为我的计算机设置为捷克语。\n\

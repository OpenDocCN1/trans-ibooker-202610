    # # Debugging Tools


    Besides IntelliSense and documentation, there are other tools that you are going
    to find helpful. Specifically, you can use debugging tools that allow you to look
    inside a computer, so to speak. You can use them to see how the computer executes
    individual commands, what values are stored in memory, and so on.


    These are the tools you are going to study now. Originally, they were developed
    to facilitate program debugging, in other words, searching for and removing errors.
    However, they are probably even more useful as illustrative tools to facilitate
    your understanding of various programming constructions.


    # ## Project


    It is best to try all the tools in practice, so please open the “Treating incorrect
    input” project in Visual Studio from Chapter 8. The program adds two numbers and
    treats possible input errors using try-catch.


    # ## Stepping Through the Code


    A computer works so fast that it is impossible to follow it with its gigahertz
    speed. That is why it’s often helpful to *step through* the code, which forces
    the computer to execute one statement at a time, upon your command.


    Go to your opened “Treating incorrect input” project and launch it using the F10
    key instead of the usual F5. Of course, selecting the Debug ➤ Step Over menu does
    the same thing (see Figure 14-11).'

    \ name>` Properties (see Figure 12-4).\n\n![](img/32b055c352c70d22a656320349173d95_181_0.png)\n\
    \n**Figure 12-4.** Opening the properties\n\nChoose the Build tab next, scroll\
    \ vertically (and maybe also horizontally) so that you can see the Advanced button\
    \ (it is really hidden!), and then click that button (see Figure 12-5).\n\n![](img/32b055c352c70d22a656320349173d95_182_0.png)\n\
    \n**Figure 12-5.** *Build tab*\n\nIn the dialog that appears, select the “Check\
    \ for arithmetic overflow/underflow” check box and confirm by clicking the OK\
    \ button (see Figure 12-6).\n\n![](img/32b055c352c70d22a656320349173d95_183_0.png)\n\
    \n**Figure 12-6.** *“Check for arithmetic overflow/underflow” check box*\n\nYour\
    \ project is finally ready to run now.\n\n## Results\n\nNow the program behaves\
    \ according to expectations, as shown in Figure 12-7.\n\n![](img/32b055c352c70d22a656320349173d95_183_1.png)\n\
    \n**Figure 12-7.** *Multiplying a million by a million*\n\n## First Alternative\n\
    \nThe first calculation correctly reports a problem. Omitting the try-catch construct\
    \ would cause a runtime error, but at least it does not display an incorrect result.\n\
    \n## Other Alternatives\n\nA correct calculation converts the million into a `long`\
    \ type *before* the calculation starts.\nHere are two ways to perform this conversion:\n\
    \n- Assigning the million to a variable of type `long`\n- Using an explicit *type\
    \ cast* with `(long)million`\n\nIf you do not require precise integer arithmetic,\
    \ you might also calculate in the `double` type. Unless you solve some very exotic\
    \ math, `double` does not have a chance to overflow.\n\n## Summary\n\nIn this\
    \ chapter, you studied advanced number calculations. You got to know all the numeric\
    \ data types that are available in C#. The types differ in whether they allow\
    \ integers or decimals, and they differ also in the ranges of allowed values.\
    \ Types for decimals mutually differ also in the precision with which the number\
    \ is stored.\n\nAt the beginner’s level, knowledge of `int` and `double` is enough;\
    \ you can always work using them only. When you become more experienced, you might\
    \ also use the following:\n\n- The `long` type for big integers such as file sizes,\
    \ ten-digit payment numbers, or multiplication results of moderately sized numbers\n\
    - The `decimal` type for working with currency\n- The `byte` type for working\
    \ with binary data\n\nYou also studied the question of overflow. When a calculated\
    \ value is too big to fit into the range of a particular data type, nonsense results.\
    \ The default behavior of Visual Studio is to continue as normally. However, now\
    \ you know how to change the settings to cause a runtime error at least, because\
    \ continuing with the incorrect result is the worst alternative.\n\nThe best alternative\
    \ is to avoid the overflow completely by choosing a data type with an appropriate\
    \ range. However, keep in mind that changing the type of variable used to store\
    \ the result may not be enough. For example, int multiplied by int is always int\
    \ with a maximum value of about two billion, regardless of where you store it.\
    \ It may be suitable to convert the number into a `long` type before the calculation.\n\
    \n## CHAPTER 13\n\n## Accumulating Values\n\nUp to now, you have worked with variables\
    \ where you stored a value that you later used. After the initial assignment,\
    \ the value of the variable did not change. Now you are ready to go to the next\
    \ step, which is to study a case when a variable’s value changes during the program\
    \ run, in other words, when a new value is determined from the old one.\n\n##\
    \ Ten More, Revisited\n\nFirst, you will return to the task of adding ten to a\
    \ number, which you studied in Chapter 8. The program’s goal is to present a value\
    \ that is greater by ten than the number entered by the user (see Figure 13-1).\n\
    \n![](img/32b055c352c70d22a656320349173d95_186_0.png)\n\n## Task\n\nYou will now\
    \ solve this task in a new way; specifically, you will store the calculation result\
    \ in the same variable where you originally stored the entered number.\n\nThis\
    \ is not necessarily a better solution, but you will learn how to build upon it\
    \ further in later sections.\n\n## Solution\n\nHere is the code:\n\n```csharp\n\
    static void Main(string[] args)\n{\n    // Input\n    Console.Write(\"Enter a\
    \ number: \");\n    string input = Console.ReadLine();\n    int number = Convert.ToInt32(input);\n\
    \n    // Calculation\n    number = number + 10;\n\n    // Result output\n    Console.WriteLine(\"\
    Number ten more greater is: \" + number);\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
    }\n```\n\n## Discussion\n\nThe core statement of the solution is as follows: `number\
    \ = number + 10;`. This statement is unusual in the sense that the same thing—the\
    \ variable number—appears on both sides of the equal sign!\n\nThe computer executes\
    \ the statement like this: “Take the present value of the variable number, add\
    \ ten to it, and store the result as the new value of the variable number.” Thus,\
    \ the net result of the statement is augmenting number’s value by ten.\n"

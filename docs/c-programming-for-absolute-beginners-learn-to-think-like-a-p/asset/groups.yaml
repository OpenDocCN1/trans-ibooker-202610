    # Discussion


    When you mix numbers with text, the result might appear different from what you
    expect!


    Let’s consider the first answer (a). The computer calculates the whole expression
    from left to right. First, it takes the text a) and a number (the first 1). It
    joins them together to be a) 1. Then, it takes this new text and the final number
    (the second 1) and again joins them together to obtain the text a) 11.


    The second answer (b) is different. The parentheses make the computer perform
    the addition of the numbers first, joining the text on the left only afterward.


    Sometimes, it may be more transparent to precalculate the intermediate results
    and store them in variables. This is what you are going to study in the next chapter.
    Of course, variables have many more uses than this, as you are going to see.


    # Summary


    In this chapter, you explored several possibilities that the Console.WriteLine
    statement gives you for different kinds of output. Specifically, you have learned
    the following:


    +   - In addition to text, you can work with numbers in your programs. Unlike
    with text, you do not surround numbers with quotes.

    +   - You can combine several values into expressions. For this purpose, you use
    operators such as +, -, and *. With numbers, they do ordinary arithmetic. The
    plus operator works also with text, in which case it joins two pieces of text
    into a single one.

    +   - In calculations, you always have to be careful about the order in which
    the result is evaluated. Multiplication and division have precedence over addition
    and subtraction. To force a different evaluation order, use parentheses.

    +   - Special characters such as quotes or newlines are output using escape sequences
    starting with backslash.

    +   - You can conveniently output preformatted multiline text by prepending it
    with an at (@) sign.'

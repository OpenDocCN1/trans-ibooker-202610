    # The Loop Starts at 1


    The previous exercise (repeatedly throwing a die) used the loop with its control
    variable running from 0 to 19. Contrary to that, this time it was more convenient
    to start at 1 rather than at 0. This change also caused the loop condition to
    change. You used a “less than or equal” test rather than a “less than” one.


    # Summary


    The chapter introduced you to the topic of loops, which are a mighty programming
    tool allowing you to specify repetitions of the same or, more often, a similar
    activity.


    For loops, C# offers several programming constructs; you learned about the most
    fundamental for loop in this chapter. In the code, the for loop consists of a
    header controlling the loop and a body consisting of the statements to be repeated
    surrounded with braces. The header itself consists of three parts separated by
    semicolons:


    +   - The *initializer* is the statement to be executed once before the loop starts
    “revolving.”

    +   - The *loop condition* is the condition evaluated before each turn of the
    loop. If it is fulfilled (i.e., evaluated to true), another round of statements
    of the loop’s body is executed. If it is not fulfilled (i.e., evaluated to false),
    the loop is terminated, and the program’s execution continues to the statements
    after the loop.

    +   - The *iterator* is the statement to be executed after each turn of the loop.


    To get a deeper understanding of how for loops work, definitely use debugging
    tools like stepping and memory inspection.


    The for loop is most often controlled by a variable working more or less like
    a counter of loop turns. This variable is called the *control variable*. In the
    last task, you learned how to use the value of the control variable also inside
    the loop’s body.'

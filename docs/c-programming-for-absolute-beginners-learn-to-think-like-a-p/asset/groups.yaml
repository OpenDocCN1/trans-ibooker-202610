  mdcn: "\n\n接下来，你接触了几种解决交替循环的方法，也就是重复相似成对活动的循环。具体而言，你学习了以下解决方案：\n\n- 根据控制变量是奇数还是偶数来交替输出\n\
    - 切换一个布尔变量，用于指示你是否需要第一个输出\n- 在循环的一轮中执行成对的两个活动\n\n最后一个示例（石头剪刀布游戏）实际上并不是以循环为核心的。循环只是用来重复游戏回合的手段。一个游戏回合就是一个真实的、更复杂过程的示例，你可以用本书目前所学的知识来实现这个过程。\n\
    \n## 第 22 章 数列\n\n许多编程任务都可以归结为生成有规律的数列。这就是本章将要学习的内容。通过这种方式，你还将更好地理解循环。\n\n###\
    \ 每隔一个\n\n你已经能够生成一个简单的数列，比如从 1 到 10。现在你将着手生成更复杂一些的数列。\n\n#### 任务\n\n在此任务中，你将显示“每隔一个”的数，直到\
    \ 20（见图22-1）。\n\n![](img/32b055c352c70d22a656320349173d95_318_0.png)\n\n*图 22-2.\
    \ 数字递减*\n\n#### 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    // Output\n    for (int number = 10; number >= 1; number--)\n    {\n  \
    \      Console.WriteLine(number);\n    }\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
    }\n```\n\n#### 讨论\n\n请注意以下几点：\n\n- 循环的*初始化器*可能是最简单的。你只需从 10 开始。\n- *迭代器*也不难；数字是递减的，所以你只需在每一轮结束时减\
    \ 1。\n- 最困难的是*循环条件*。你必须以这样的方式来构造它：只要你想让循环继续，它就成立；当你想退出时，它就不再成立。正确的判断标准是 number\
    \ 变量是否大于或等于 1。\n\n### 小数\n\n包含小数的数列可能会让你惊讶。\n\n#### 任务\n\n在此任务中，你将生成一个从 9 到 0\
    \ 的数列，每一步递减 0.9（见图22-3）。\n\n![](img/32b055c352c70d22a656320349173d95_320_0.png)\n\
    \n*图 22-3. 每次递减 0.9*\n\n#### 看似正确的解决方案\n\n沿用上一个练习的风格，你可以编写如下代码：\n\n```csharp\n\
    static void Main(string[] args)\n{\n    // Output\n    for (double number = 9;\
    \ number >= 0; number -= 0.9)\n    {\n        Console.WriteLine(number.ToString(\"\
    N1\"));\n    }\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n\
    #### 测试\n\n然而，测试结果表明数列缺少了最后一项：0（见图22-4）。\n\n![](img/32b055c352c70d22a656320349173d95_321_0.png)\n\
    \n*图 22-4. 缺少最后一个数字*\n\n这是怎么回事？\n\n#### 出错原因\n\n这个练习表明，处理小数可能会很棘手；你需要小心，因为小数运算可能是不精确的！\n\
    \n当你省略保留一位小数的格式（`.ToString(\"N1\")`）时，你就能感觉到原因了。试试看（见图22-5）。\n\n### 二次幂\n\n那么，如果在一行中显示两个相关联的数字呢？\n\
    \n#### 任务\n\n除了显示 1 到 10 数列中的数字之外，你还可以在每一行输出中显示对应的二次幂（见图22-6）。\n\n![](img/32b055c352c70d22a656320349173d95_323_0.png)\n\
    \n*图 22-6. 显示二次幂*\n\n#### 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    // Output\n    for (int number = 1; number <= 10; number++)\n\
    \    {\n        int secondPower = number * number;\n        Console.WriteLine(number.ToString()\
    \ + \" + \" + secondPower.ToString());\n    }\n\n    // Waiting for Enter\n  \
    \  Console.ReadLine();\n}\n```\n\n### 每行两个数\n\n这里我们继续讨论一行中有两个数字的情况。\n\n#### 任务\n\
    \n在此任务中，你将生成一个 1–20 的数列，每一行输出包含两个数字（见图22-7）。\n\n```csharp\n// What goes after\
    \ the number depends on the even/odd test\nif (number % 2 != 0)\n{\n    // Odd\
    \ number, displaying space\n    Console.Write(\" \");\n}\nelse\n{\n    // Even\
    \ number, new line\n    Console.WriteLine();\n}\n}\n\n// Waiting for Enter\nConsole.ReadLine();\n\
    }\n```\n\n### 两个独立数列\n\n将来某天你可能会遇到另一个有趣的情况：两个独立的数列。\n\n#### 任务\n\n你将有两个略显随意、成员数量不同的数列。第一个数列每次递减\
    \ 2（111, 109, ..., 97），第二个数列每次递增 3（237, 240, ..., 270）。\n\n程序将在每一行同时显示第一个数列中的一个数和第二个数列中的一个数（见图22-8）。\n\
    \n![](img/32b055c352c70d22a656320349173d95_327_0.png)\n\n*图 22-8. 更复杂的交替*\n\n\
    #### 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Preparation\n\
    \    int first = 111;\n\n    // Output\n    for (int second = 237; second <= 270;\
    \ second += 3)\n    {\n        // Preparing first text\n        string firstText\
    \ = first >= 97 ?\n            first.ToString().PadLeft(3) : \"   \";\n\n    \
    \    // Actual output\n        Console.WriteLine(firstText + \" \" + second.ToString());\n\
    \n        // Changing x\n        first -= 2;\n    }\n\n    // Waiting for Enter\n\
    \    Console.ReadLine();\n}\n```\n\n#### 讨论\n\n请注意以下几点：\n\n- 其中一个数列（较长的那个）使用循环的控制变量来显示，另一个数列则使用一个独立的变量。\n\
    - 在每一步中，你都要检查较短的数列是否仍在继续。\n- 为了实现良好的格式，你使用了 PadLeft 方法调用，它会在其参数的左侧添加空格，以达到指定的总字符数。\n\
    \n### 小结\n\n在本章中，你在生成各种数列的任务中练习了循环。具体来说，你学习了以下内容：\n\n- 当数列以 2 为步长时，如何编写循环的迭代器。\n\
    - 如何在循环体中不直接显示控制变量，而是显示由它推导（计算）出的值。\n- 如何在循环的迭代器中使用 -- 运算符来生成递减数列，并使用 >= 运算符指定循环条件，使它在你想继续循环的期间一直成立。\n\
    - 小数数列需要格外小心，因为小数在内存中的表示并不精确。这意味着，例如，你需要在循环条件中留出额外的余量。\n\n你还解决了单个输出行中有两个数字的情况，以及最后更有难度的两个独立数列的任务。\n\
    \n## 第 23 章 未知的重复次数\n\n到目前为止，你所解决的所有循环中，你都知道迭代次数。但有时在编写程序时你并不知道这个次数，因为次数要由用户输入。不过，在所有情况下，当循环开始运行时，它将要迭代多少次就已经确定了。\n\
    \n有时，循环开始执行时，重复次数仍是未知的。你经常会遇到这样一个问题：循环应该继续还是终止。\n\n### 输入密码\n\n第一个任务与登录有关。你无法预先知道用户需要尝试多少次。\n\
    \n#### 任务\n\n你将反复要求用户输入密码，直到用户输入正确的密码为止（见图23-1）。正确的密码是 *friend*。\n\n![](img/32b055c352c70d22a656320349173d95_331_0.png)\n\
    \n*图 23-1. 反复询问*\n\n#### 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[]\

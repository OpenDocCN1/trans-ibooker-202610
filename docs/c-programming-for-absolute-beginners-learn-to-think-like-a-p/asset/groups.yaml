    \ 2-12）。\n\n![](img/32b055c352c70d22a656320349173d95_48_1.png)\n\n**图 2-12.**\
    \ *禁用新措施*\n\n### 注意\n\n在计算机的默认设置下，你的程序将以白字黑底显示，如图 2-10 所示。不过，为了更好的可读性，我将在后续所有截图中使用黑字浅底显示（见图\
    \ 2-11）。\n\n### 更改文本大小\n\n你认为输出的文本太小了吗？是否需要放大程序使用的字体？\n\n如果是，请单击已启动程序的“黑屏”左上角的标题栏图标，并选择“默认值”（见图\
    \ 2-13）。\n\n![](img/32b055c352c70d22a656320349173d95_49_0.png)\n\n***图 2-13.***\
    \ *选择默认设置*\n\n然后点击“字体”选项卡，根据你的偏好更改字体，并通过单击“确定”按钮确认更改（见图 2-14）。\n\n![](img/32b055c352c70d22a656320349173d95_50_0.png)\n\
    \n*图 2-14.*  *更改字体*\n\n下次程序启动时，将使用新字体。\n\n### 处理错误\n\n如果你没有完全按照我展示的方式编写语句，或者写错了位置，程序生成将以错误结束并失败。\n\
    \n我们来试试！删除带有 `Console.WriteLine` 语句的行末分号。\n\n当你尝试启动程序（按 F5 键）时，尝试会以错误对话框结束（见图\
    \ 2-15）。\n\n![](img/32b055c352c70d22a656320349173d95_51_0.png)\n\n*图 2-15.*  出现错误\n\
    \n在此对话框中，**始终单击“否”**；你不会希望运行程序的某个旧版本（如果存在的话）。\n\n单击“否”后，底部会出现“错误列表”窗格（见图 2-16）。\n\
    \n![](img/32b055c352c70d22a656320349173d95_51_1.png)\n\n*图 2-16.* 错误列表\n\n把删除的分号放回去，一切就恢复正常了。将来，找出你做错的地方可能会更困难，尤其是在你编程生涯的起步阶段。没关系——我的观点是，只有犯过所有可能犯的错误，你才能成为某个领域的专家。\n\
    \n### 完成你的工作\n\n你刚刚经历了程序开发的所有基本步骤。在以后的每个项目中，你都将按照同样的流程进行。\n\n现在你需要学习如何结束工作，以及之后如何恢复工作。前者很简单；你可以通过从菜单中选择“文件\
    \ ► 关闭解决方案”或关闭整个 Visual Studio 程序来完成此项目的工作。\n\n### 恢复你的工作\n\n当你想稍后回到你的项目时，可以通过以下方式之一在\
    \ Visual Studio 中重新打开它：\n\n- *通过“开始页面”：* 这是在 Visual Studio 启动后立即出现的页面，其中包含指向你最近项目的链接（见图\
    \ 2-17）。只需单击正确的项目即可。\n\n![](img/32b055c352c70d22a656320349173d95_53_0.png)\n\n\
    **图 2-17.** *使用“开始页面”*\n\n- *通过“打开项目”对话框：* 从 Visual Studio 菜单中选择“文件 ▶ 打开 ▶ 项目/解决方案”。出现“打开项目”对话框，你应在其中找到你的项目（见图\
    \ 2-18）。具体来说，查找扩展名为 `.sln` 的文件。如果你看不到文件扩展名，请在 Windows 文件资源管理器中开启其显示（在“查看”选项卡上选中“文件扩展名”复选框），如图\
    \ 2-19 所示。\n\n![](img/32b055c352c70d22a656320349173d95_55_0.png)\n\n*图 2-20.*\
    \ 从“文件”菜单打开你的项目\n\n### 转移你的工作\n\n你可能还想知道如何将项目从计算机转移到其他地方，以便以后在不同的计算机上继续处理。答案很简单。如果你使用的是闪存驱动器、OneDrive\
    \ 或类似工具，只需转移项目的整个文件夹即可。\n\n### 使用解决方案资源管理器\n\n在将项目转移到另一台计算机时，有一个你应该熟悉的重要问题。有时，项目打开时没有源代码编辑器（见图\
    \ 2-21）。\n\n![](img/32b055c352c70d22a656320349173d95_56_0.png)\n\n**图 2-21.**\
    \ *在没有源代码编辑器的情况下打开项目*\n\n在这种情况下你该怎么办？有一个名为“解决方案资源管理器”的窗格（子窗口），通常位于 Visual Studio\
    \ 窗口的右侧。只需双击你的源代码文件 `Program.cs` 即可（见图 2-22）。\n\n![](img/32b055c352c70d22a656320349173d95_57_0.png)\n\
    \n**图 2-22.** *通过解决方案资源管理器打开源代码*\n\n连“解决方案资源管理器”也消失了吗？没问题！你可以随时通过菜单选择“视图 ▶ 解决方案资源管理器”来显示它（见图\
    \ 2-23）。\n\n![](img/32b055c352c70d22a656320349173d95_58_0.png)\n\n图 2-23. 打开解决方案资源管理器\n\
    \n### 小结\n\n在本章中，你制作了第一个程序，并开始学习如何使用 Visual Studio 开发环境。你经历了程序开发的所有步骤，基本上如下：\n\
    \n- 创建项目\n- 编辑源代码\n- 保存源代码\n- 启动程序\n- 检测并清除可能的错误\n- 将你的项目转移到你的另一台计算机上，以便在其他地方处理\n\
    \n### 解决方案\n\n在 Visual Studio 中，创建一个名为“Numeric Output”的新项目。代码与你之前在第二章编写的程序类似，如下所示：\n\
    \n```\nstatic void Main(string[] args)\n{\n    // Output of a number to the user\n\
    \    Console.WriteLine(37);\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
    }\n```\n\n> **注意**  在本例以及本书后续所有示例中，我只向你展示 `Main` 一词所在行之后的代码块。这是你掌控的代码块；换句话说，这是你修改的代码块。`Program.cs`\
    \ 源代码的其余部分应保持原样，就像你在上一章的第一个程序中留下它时一样。\n\n为了确保你理解我的意思，完整的源代码如下所示：\n\n```\nusing\
    \ System;\n\nnamespace Numeric_output\n{\n    class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            // Output of a number to the\
    \ user\n            Console.WriteLine(37);\n\n            // Waiting for Enter\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\n\n但同样，这是你最后一次看到完整的源代码。每次展示示例时，没有必要重复\

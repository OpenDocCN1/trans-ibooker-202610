    As you can see, in the Czech language, you use a space as the thousands separator
    and a comma as a decimal separator. The same comma is used as a thousands separator
    in American formatting, so you can imagine that letting a computer decide what
    language to use (according to Windows settings) can sometimes lead to a confusion
    and incorrect program behavior.'

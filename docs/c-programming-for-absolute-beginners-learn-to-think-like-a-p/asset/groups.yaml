    # Discussion


    Note the following:


    +   - You use the `Trim` method to cut off possible leading or trailing spaces
    of the entered text in order to allow termination with any blank input, including
    several spaces.

    +   - At the end, you have to get rid of the last two characters in both accumulated
    pieces of text. Before doing it, you test whether these two characters (a comma
    and a space) appear at the end of the text at all. These characters will not be
    there if the user immediately terminates the program by entering a blank line.

    +   - To test whether text ends with something, you use the `EndsWith` method.


    # Summary


    One of the most frequent usages of loops is processing large amounts of data,
    be it numbers, text, or whole objects. In the loop’s body, you process a single
    piece of data, while the loop ascertains that all the data gets its turn.


    You practiced processing larger amounts of data with examples of summing, multiplying,
    and finding extremes.


    The most difficult exercise was that of finding the second greatest number, which
    required careful thinking about the possible situation that may arise depending
    on the data.


    The last task showed you several methods to cope with text: `Trim`, `EndsWith`,
    and `Remove`.'

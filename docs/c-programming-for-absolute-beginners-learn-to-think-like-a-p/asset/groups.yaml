    # CHAPTER 20  FIRST LOOPS


    The for loop works like this:


    +   - `initializer` is performed once before entering the loop.

    +   - `loopCondition` is being evaluated before every turn of the loop. If it
    holds, the computer enters the loop and executes the statements inside its body.

    +   - The iterator statement is executed after every turn of the loop is completed.
    After that, `loopCondition` is evaluated again.


    Figure 20-2 shows the program flow.


    ![](img/32b055c352c70d22a656320349173d95_297_0.png)


    *Figure 20-2.*  The program flow'

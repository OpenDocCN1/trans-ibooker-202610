  md: "\n## What Is It?\n\nUp to now, you have always had to write a program with\
    \ several statements and then launch it to see it in action. The interactive mode\
    \ allows you to enter individual C# statements and run them immediately. You can\
    \ explore some C# features much faster this way.\n\n## How to Launch It?\n\nYou\
    \ can start the interactive mode by selecting View ➤ Other Windows ➤ C# Interactive\
    \ (see Figure 14-15). You do not even need to have a project created/opened.\n\
    \n![](img/32b055c352c70d22a656320349173d95_215_0.png)\n\n*Figure 14-15.* Switching\
    \ to interactive mode\n\nFigure 14-16 shows an example interactive session—I have\
    \ declared a numeric variable, augmented it by ten, and displayed its value.\n\
    \n![](img/32b055c352c70d22a656320349173d95_216_0.png)\n\nFigure 14-16. Example\
    \ interactive session\n\n## Notes\n\nNote the following:\n\n- If you need to enter\
    \ a multiline statement, you can terminate lines with Shift+Enter instead of simply\
    \ Enter.\n- Using `#help` displays concise information about how to work with\
    \ the interactive mode.\n\n![](img/32b055c352c70d22a656320349173d95_219_0.png)\n\
    \n**Figure 15-1.** Incorrect password\n\n![](img/32b055c352c70d22a656320349173d95_219_1.png)\n\
    \n**Figure 15-2.** Correct password\n\n## Analysis\n\nLet’s look at this program\
    \ in more detail.\n\n### The Program\n\nIn this program, some activity is performed\
    \ when both passwords (the entered one and the stored one) agree, and a different\
    \ activity is performed when they disagree. In this case, you either allow or\
    \ refuse the user with an appropriate message (see Figure 15-3).\n\n![](img/32b055c352c70d22a656320349173d95_220_0.png)\n\
    \nFigure 15-3. The program flow\n\n### Program Branching\n\nGenerally, program\
    \ branching means taking different paths depending on the fulfillment of a condition\
    \ (see Figure 15-4).\n\n![](img/32b055c352c70d22a656320349173d95_220_1.png)\n\n\
    Figure 15-4. Branching\n\n### Syntax\n\nFor branching, C# uses the if-else construction\
    \ shown here:\n\n```csharp\nif (condition)\n{\n    Statements to perform when\
    \ the condition holds\n}\nelse\n{\n    Statements to perform otherwise\n}\n```\n\
    \n### Solution\n\nHere is the code:\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    // Input\n    Console.Write(\"Enter password: \");\n    string enteredPassword\
    \ = Console.ReadLine();\n\n    // Password check\n    if (enteredPassword == \"\
    friend\")\n    {\n        Console.WriteLine(\"Password is OK, please enter\");\n\
    \    }\n    else\n    {\n        Console.WriteLine(\"Incorrect password\");\n\
    \    }\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n### Discussion\n\
    \nTo formulate the condition, I have used an equality test, which is entered using\
    \ a couple of equal signs. If the compared values are the same, the test evaluates\
    \ to true, the condition is considered fulfilled, and the statements in the if\
    \ branch are executed. If the compared values are different, the test evaluates\
    \ to false, the condition is considered not fulfilled, and the statements in the\
    \ else branch are executed.\n\n### Test\n\nNow you can check how the program executes!\
    \ Besides doing an ordinary program run, you can also step through the code, as\
    \ you learned in the previous chapter.\n\n## Reversed Condition\n\nSo that you\
    \ get more familiar with conditions, it is useful to see them from different perspectives.\
    \ Staying with the password issue, let’s view it in another way.\n\n### Task\n\
    \nThe task now is to solve the previous exercise alternatively, namely, with the\
    \ condition reversed. In other words, you will test for inequality instead of\
    \ equality.\n\n### Solution\n\nHere is the code:\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    // Correct password\n    string correctPassword = \"friend\";\n\
    \n    // Input\n    Console.Write(\"Enter password: \");\n    string enteredPassword\
    \ = Console.ReadLine();\n\n    // Password check\n    if (enteredPassword != correctPassword)\n\
    \    {\n        Console.WriteLine(\"Incorrect password\");\n    }\n    else\n\
    \    {\n        Console.WriteLine(\"Password is OK, please enter\");\n    }\n\n\
    \    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n### Discussion\n\
    \nIn this exercise, I have used an inequality test, which is typed using an exclamation\
    \ mark followed by an equal sign. The test returns true when the compared values\
    \ **disagree**.\n\n## Length Check\n\nWhile two pieces of text can only be compared\
    \ to find out if they are the same or different, two numbers can also be compared\
    \ to figure out which one is larger (or smaller). Let's take a look.\n\n### Task\n\
    \nIn this section, you will study number comparisons in a program that evaluates\
    \ whether the entered text is at most four characters long (see Figures 15-5 and\
    \ 15-6).\n\n![](img/32b055c352c70d22a656320349173d95_224_0.png)\n\nFigure 15-5.\
    \ Short text\n\n![](img/32b055c352c70d22a656320349173d95_224_1.png)\n\nFigure\
    \ 15-6. Long text\n\n### Solution\n\nPresumably, you should determine the number\
    \ of characters of the entered text and compare it to the number four. You learned\
    \ how to determine the number of characters of text—using its `Length` property—in\
    \ Chapter 7 (the program was “Texts as objects”). Anyway, if you do not remember\
    \ the name of the property, you can add a dot to the end of a text variable and\
    \ browse through the IntelliSense possibilities to see what might be appropriate,\
    \ as covered in the previous chapter.\n\nHere is the code:\n\n```csharp\nstatic\
    \ void Main(string[] args)\n{\n    // Input\n    Console.Write(\"Enter a word:\
    \ \");\n    string word = Console.ReadLine();\n\n    // Determining length\n \
    \   int wordLength = word.Length;\n\n    // Checking length\n    if (wordLength\
    \ <= 4)\n    {\n        Console.WriteLine(\"Word is short (at most 4 characters)\"\
    );\n    }\n    else\n    {\n        Console.WriteLine(\"Word is long (more than\
    \ 4 characters)\");\n    }\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
    }\n```\n\n### Note\n\nI have used a less-than-or-equal-to operator in this solution,\
    \ which looks like this: `<=`.\n\n## Positive Numbers\n\nIn this section, you\
    \ will get some more practice with number comparisons.\n\n### Task\n\nYou will\
    \ write a program that evaluates whether the number entered by the user is positive\
    \ or not (see Figures 15-7 and 15-8).\n\n### Solution\n\n```csharp\n// Evaluation\n\
    if (number > 0)\n{\n    Console.WriteLine(\"The number is positive\");\n}\nelse\n\
    {\n    Console.WriteLine(\"The number is NOT positive\");\n}\n\n// Waiting for\
    \ Enter\nConsole.ReadLine();\n```\n\n### Discussion\n\nI have used a greater-than\
    \ operator to compare the entered number to zero.\nWhat do you think the program\
    \ does when the user enters zero? It checks the condition `0 > 0` and finds it\
    \ is not fulfilled. Therefore, it displays that the number is not positive. This\
    \ is the reason for the rather unusual message wording (\"... NOT positive\"),\
    \ as shown in Figure 15-9. I have not used \"...is negative\".\n\n![](img/32b055c352c70d22a656320349173d95_227_0.png)\n\
    \nFigure 15-9. Results for zero\n\n## Odd and Even Numbers\n\nLet’s proceed to\
    \ another number comparison.\n\n### Task\n\nYour task now is to write a program\
    \ that evaluates whether the number entered by the user is odd or even (see Figures\
    \ 15-10 and 15-11).\n\n![](img/32b055c352c70d22a656320349173d95_228_0.png)\n\n\
    **Figure 15-10.** Determining even\n\n![](img/32b055c352c70d22a656320349173d95_228_1.png)\n\
    \n**Figure 15-11.** Determining odd\n\n### Solution\n\nThe core of the solution\
    \ is to determine the remainder of dividing the entered number by two. If the\
    \ remainder is zero, the number is even. If there is some remainder, the number\
    \ is odd.\n\nHere is the code:\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    // Input\n    Console.Write(\"Enter a number: \");\n    string input =\
    \ Console.ReadLine();\n    int number = Convert.ToInt32(input);\n\n    // Remainder\
    \ calculation\n    int remainderAfterDivisionByTwo = number % 2;\n\n    // Evaluation\n\
    \    if (remainderAfterDivisionByTwo == 0)\n    {\n        Console.WriteLine(\"\
    The number is even\");\n    }\n    else\n    {\n        Console.WriteLine(\"The\
    \ number is odd\");\n    }\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
    }\n```\n\n## Case Indifference\n\nYou already know that two pieces of text can\
    \ be compared to see if they are equal or unequal. This comparison is case sensitive.\
    \ In other words, hobbit and Hobbit are considered different words. Frequently,\
    \ however, you need case-insensitive comparisons, which I will show you now.\n"
  mdcn: "\n\n## 它是什么？\n\n到目前为止，你总是需要编写一个包含多个语句的程序，然后运行它才能看到实际效果。交互模式允许你输入单条 C# 语句并立即运行。通过这种方式，你可以更快地探索某些\
    \ C# 特性。\n\n## 如何启动它？\n\n你可以通过选择“视图 ➤ 其他窗口 ➤ C# 交互”来启动交互模式（见图 14-15）。你甚至不需要创建或打开项目。\n\
    \n![](img/32b055c352c70d22a656320349173d95_215_0.png)\n\n*图 14-15.* 切换到交互模式\n\n\
    图 14-16 显示了一个交互式会话示例——我声明了一个数值变量，将其增加 10，并显示其值。\n\n![](img/32b055c352c70d22a656320349173d95_216_0.png)\n\
    \n图 14-16. 交互式会话示例\n\n## 注释\n\n请注意以下事项：\n\n- 如果需要输入多行语句，可以用 Shift+Enter 换行，而不是直接按\
    \ Enter。\n- 使用 `#help` 可以显示有关如何使用交互模式的简明信息。\n\n![](img/32b055c352c70d22a656320349173d95_219_0.png)\n\
    \n**图 15-1.** 密码错误\n\n![](img/32b055c352c70d22a656320349173d95_219_1.png)\n\n\
    **图 15-2.** 密码正确\n\n## 分析\n\n让我们更详细地看一下这个程序。\n\n### 程序\n\n在这个程序中，当两个密码（输入的密码和存储的密码）一致时执行某种操作，当它们不一致时执行另一种操作。在这种情况下，你要么允许用户进入，要么拒绝用户，并显示相应的消息（见图\
    \ 15-3）。\n\n![](img/32b055c352c70d22a656320349173d95_220_0.png)\n\n图 15-3. 程序流程\n\
    \n### 程序分支\n\n一般来说，程序分支意味着根据条件是否成立而走不同的路径（见图 15-4）。\n\n![](img/32b055c352c70d22a656320349173d95_220_1.png)\n\
    \n图 15-4. 分支\n\n### 语法\n\n对于分支，C# 使用如下所示的 if-else 结构：\n\n```csharp\nif (condition)\n\
    {\n    Statements to perform when the condition holds\n}\nelse\n{\n    Statements\
    \ to perform otherwise\n}\n```\n\n### 解决方案\n\n代码如下：\n\n```csharp\nstatic void\
    \ Main(string[] args)\n{\n    // Input\n    Console.Write(\"Enter password: \"\
    );\n    string enteredPassword = Console.ReadLine();\n\n    // Password check\n\
    \    if (enteredPassword == \"friend\")\n    {\n        Console.WriteLine(\"Password\
    \ is OK, please enter\");\n    }\n    else\n    {\n        Console.WriteLine(\"\
    Incorrect password\");\n    }\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
    }\n```\n\n### 讨论\n\n为了构造条件，我使用了相等性测试，它由两个等号组成。如果比较的值相同，测试结果为 true，条件被视为成立，执行 if\
    \ 分支中的语句。如果比较的值不同，测试结果为 false，条件被视为不成立，执行 else 分支中的语句。\n\n### 测试\n\n现在你可以检查程序的执行情况了！除了正常运行程序外，你还可以像上一章学到的那样逐行执行代码。\n\
    \n## 反向条件\n\n为了让你更熟悉条件，从不同角度来认识它们是很有帮助的。继续以密码问题为例，让我们换一种方式来思考。\n\n### 任务\n\n现在的任务是用另一种方式解决前面的练习，即使用反向条件。换句话说，你将测试不相等而不是相等。\n\
    \n### 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Correct\
    \ password\n    string correctPassword = \"friend\";\n\n    // Input\n    Console.Write(\"\
    Enter password: \");\n    string enteredPassword = Console.ReadLine();\n\n   \
    \ // Password check\n    if (enteredPassword != correctPassword)\n    {\n    \
    \    Console.WriteLine(\"Incorrect password\");\n    }\n    else\n    {\n    \
    \    Console.WriteLine(\"Password is OK, please enter\");\n    }\n\n    // Waiting\
    \ for Enter\n    Console.ReadLine();\n}\n```\n\n### 讨论\n\n在这个练习中，我使用了不相等性测试，它由一个感叹号后跟一个等号组成。当比较的值**不相同**时，测试返回\
    \ true。\n\n## 长度检查\n\n两段文本只能比较是相同还是不同，而两个数字还可以比较哪个更大（或更小）。让我们来看一看。\n\n### 任务\n\
    \n在本节中，你将学习在程序中进行数字比较，该程序会判断输入的文本是否最多为四个字符（见图 15-5 和图 15-6）。\n\n![](img/32b055c352c70d22a656320349173d95_224_0.png)\n\
    \n图 15-5. 短文本\n\n![](img/32b055c352c70d22a656320349173d95_224_1.png)\n\n图 15-6.\
    \ 长文本\n\n### 解决方案\n\n想必你应该先确定输入文本的字符数，然后将其与数字四进行比较。你在第 7 章中学习了如何确定文本的字符数——即使用其\
    \ `Length` 属性（那个程序是“文本作为对象”）。无论如何，如果你不记得该属性的名称，可以在文本变量末尾添加一个点，然后浏览 IntelliSense\
    \ 中的选项，看看哪些可能是合适的，正如上一章所介绍的那样。\n\n代码如下：\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    // Input\n    Console.Write(\"Enter a word: \");\n    string word\
    \ = Console.ReadLine();\n\n    // Determining length\n    int wordLength = word.Length;\n\
    \n    // Checking length\n    if (wordLength <= 4)\n    {\n        Console.WriteLine(\"\
    Word is short (at most 4 characters)\");\n    }\n    else\n    {\n        Console.WriteLine(\"\
    Word is long (more than 4 characters)\");\n    }\n\n    // Waiting for Enter\n\
    \    Console.ReadLine();\n}\n```\n\n### 注释\n\n在这个解决方案中，我使用了小于或等于运算符，它看起来像这样：`<=`。\n\
    \n## 正数\n\n在本节中，你将获得更多关于数字比较的练习。\n\n### 任务\n\n你将编写一个程序，判断用户输入的数字是否为正数（见图 15-7\
    \ 和图 15-8）。\n\n### 解决方案\n\n```csharp\n// Evaluation\nif (number > 0)\n{\n    Console.WriteLine(\"\
    The number is positive\");\n}\nelse\n{\n    Console.WriteLine(\"The number is\
    \ NOT positive\");\n}\n\n// Waiting for Enter\nConsole.ReadLine();\n```\n\n###\
    \ 讨论\n\n我使用了大于运算符来将输入的数字与零进行比较。\n你认为当用户输入零时程序会做什么？它会检查条件 `0 > 0`，并发现该条件不成立。因此，它会显示该数字不是正数。这就是为什么消息措辞相当不寻常（“……不是正数”），如图\
    \ 15-9 所示。我没有使用“……是负数”。\n\n![](img/32b055c352c70d22a656320349173d95_227_0.png)\n\
    \n图 15-9. 零时的结果\n\n## 奇数和偶数\n\n让我们继续看另一个数字比较。\n\n### 任务\n\n你现在的任务是编写一个程序，判断用户输入的数字是奇数还是偶数（见图\
    \ 15-10 和图 15-11）。\n\n![](img/32b055c352c70d22a656320349173d95_228_0.png)\n\n\
    **图 15-10.** 判断偶数\n\n![](img/32b055c352c70d22a656320349173d95_228_1.png)\n\n**图\
    \ 15-11.** 判断奇数\n\n### 解决方案\n\n解决方案的核心是确定输入数字除以二的余数。如果余数为零，则该数字是偶数。如果存在余数，则该数字是奇数。\n\
    \n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Input\n    Console.Write(\"\
    Enter a number: \");\n    string input = Console.ReadLine();\n    int number =\
    \ Convert.ToInt32(input);\n\n    // Remainder calculation\n    int remainderAfterDivisionByTwo\
    \ = number % 2;\n\n    // Evaluation\n    if (remainderAfterDivisionByTwo == 0)\n\
    \    {\n        Console.WriteLine(\"The number is even\");\n    }\n    else\n\
    \    {\n        Console.WriteLine(\"The number is odd\");\n    }\n\n    // Waiting\
    \ for Enter\n    Console.ReadLine();\n}\n```\n\n## 不区分大小写\n\n你已经知道，可以对两段文本进行比较，看它们是否相等或不相等。这种比较是区分大小写的。换句话说，`hobbit`\
    \ 和 `Hobbit` 被认为是不同的单词。然而，你经常需要进行不区分大小写的比较，我现在就来向你展示如何操作。\n\n"

    \ via many practical exercises that will guide you toward more and more complex\
    \ topics. To be able to follow along with the exercises, you should prepare your\
    \ computer in the following ways:\n\n- You need a computer with the Windows operating\
    \ system (at least Windows 7 with Service Pack 1).\n- You need to install an appropriate\
    \ development environment. In this book, I will work with the free Visual Studio\
    \ Community.\n\n## PART I: Data\n\n## CHAPTER 2: Your First Program\n\nYou have\
    \ your computer ready now, so let’s start programming! In this chapter, you will\
    \ create your first program in the C# language and learn all the steps that you\
    \ need to perform to do this.\n\n### Seeing It in Action\n\nIn this chapter, you’ll\
    \ create a program that displays message “I am starting to program in C#.” to\

    # CHAPTER 8


    # Input


    Up to now, all of your programs have been manipulating data (numbers, text, and
    so on) that was either fixed directly in source code or drawn from the operating
    system (dates, random numbers, and so on). Typically, programs get their data
    from the user, which is what you will learn about in this chapter.


    # Text Input


    You will start your study of input with the simplest possible case.


    # Task


    You will write a program that accepts a single line of text from the user and
    immediately repeats the inputted text to the output (see Figure 8-1).


    ![](img/32b055c352c70d22a656320349173d95_119_0.png)


    Figure 8-1. The completed program'

    # Note


    It is interesting to note that when joining the people’s names in reverse order,
    the compound assignment is of no help.


    # Summary


    The central topic of this chapter has been the accumulation of values in the same
    variable. Contrary to the programs so far, the programs here were repeatedly changing
    the value of a variable, usually using its original value, and modifying it somehow.
    Specifically, you studied the following:


    +   - Statements such as `variable = variable + change;` that take the present
    value of variable, add change to it, and store the result as a new value of variable

    +   - Compound assignments such as `variable += change;`, which are short equivalents
    of previous statements

    +   - Compound assignments with other arithmetic operations: `-=`, `*=`, `/=`

    +   - Compound assignments with text (only `+=`)

    +   - Incrementing (adding one) and decrementing (subtracting one) variables using
    the super-short notation of `variable++;` and `variable--;`


    At the end of the chapter, you got acquainted with the principle of progressive
    summation (and progressive accumulation), which means summing numbers one by one
    while storing intermediate results in a special variable. This principle is mostly
    used when summing a large number of values, and you will appreciate its extreme
    importance when studying loops later in this book.'

    # Classes


    Every documentation or textbook dealing with objects abounds with usage of the
    word *class*. So, what does this mean? To put it simply, a *class* is a synonym
    for an object data type. Instead of “an object of Random type,” you can speak
    about “an object of the Random class.” This means a class can also be viewed as
    the name of a certain type of objects.


    # Relation Between Class and Object


    From a different perspective, a class is also a C# source code defining what an
    object of a particular kind contains and how it behaves. You can also say that
    classes serve as templates for objects. For example, the Random class source code
    (which Microsoft has, not you) defines what properties and what methods *all*
    Randoms will have.


    As a consequence, all Random objects behave in the same way because all of them
    are created from the same template, or from the same class. The same can be said
    about all DateTimes, all CultureInfos, and so on.


    To put it another way, as a well-known maxim of object-oriented programming, an
    *object* is a class instance. The word *instance* means a single realization,
    or a single occurrence.


    # Special Classes


    You saw in this chapter that text, numbers, and so on also behave like objects.
    Here are their corresponding classes:


    | Data Type | Corresponding Class |

    |---|---|

    | string | String |

    | int | Int32 |

    | double | Double |

    | bool | Boolean |

    | ... | ... |


    In C#, you can use string and String interchangeably, int and Int32 interchangeably,
    and so on. Of course, you need a using System; line at the top of your source
    code since all the corresponding classes belong to that particular namespace.'

  mdcn: "\n## 结构\n\n在 C# 中，你同样可能会遇到术语*结构*或*结构体*。什么是结构？\n\n嗯，你可以将它们视为某种轻量级的类。在初学者水平上，它们与普通类几乎无法区分，因此在很长一段时间内，你可以在任何看到*结构*或*结构体*的地方简单地用*类*一词替代。\n\
    \n例如，DateTime 就是结构的一个典型例子。然而，为了简便起见，在本书中所有地方我都将 DateTime 与 Random 或 CultureInfo\
    \ 等普通类同等对待。在本书的层面上，你可能会感觉到的唯一细微差别是，DateTime 对象不一定非要通过构造函数调用等方式显式创建。只需声明一个该类型的变量即可，尽管这可能不太实际。\n\
    \n## 小结\n\n在本章中，你了解到即使是普通的文本和数字也可以表现得像对象一样。具体来说，你学习了以下内容：\n\n- Length 属性，以及文本/字符串的\
    \ ToUpper 和 Contains 方法\n- 数字的 ToString 方法\n\n在后一种情况中，你还看到了 ToString 方法生成的输出可以由格式字符串（如\
    \ N2 等）和语言规范（CultureInfo 对象）来控制。将来，你会发现对 C# 中的几乎所有内容使用 ToString 方法都很方便，而不仅仅是数字。\n\
    \n你首次初步了解了对象编程的术语。具体请注意以下几点：\n\n- 与普通对象相反，静态对象始终以单一副本存在。虽然你可以拥有任意多个 DateTime，但你始终只有一个\
    \ Console。\n- *类*一词是“对象数据类型”的同义词。你经常会读到特定类的对象，这意味着“特定类型的对象”。\n\n## 第二部分：计算\n\n\
    ## 第 8 章：输入\n\n到目前为止，你的所有程序都在处理数据（数字、文本等），这些数据要么直接固定在源代码中，要么来自操作系统（日期、随机数等）。通常，程序会从用户那里获取数据，而这正是你将在本章中学习的内容。\n\
    \n### 文本输入\n\n你将从一个最简单的案例开始学习输入。\n\n### 任务\n\n你将编写一个程序，接受用户输入的一行文本，并立即将输入的文本重复输出（见图\
    \ 8-1）。\n\n![](img/32b055c352c70d22a656320349173d95_119_0.png)\n\n图 8-1. 完成的程序\n\
    \n### 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Hinting\
    \ user what we want from her\n    Console.Write(\"Enter a sentence (and press\
    \ Enter): \");\n\n    // Reading line of text\n    string input = Console.ReadLine();\n\
    \n    // Repeating to the output\n    Console.WriteLine(\"You have entered: \"\
    \ + input);\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n###\
    \ 讨论\n\nConsole.Write 不会将光标移到下一行，这与 Console.WriteLine 相反，后者是你到目前为止一直在使用的。\n\n\
    ### 数字输入\n\n在之前的练习中，你处理的是用户输入的文本信息。现在你将转向同样重要的数字。\n\n### 任务\n\n你将编写一个程序，从用户那里获取一个数字，将其存储在一个数字变量中，最后将其重复显示给用户（见图\
    \ 8-3）。\n\n![](img/32b055c352c70d22a656320349173d95_122_0.png)\n\n图 8-3. 从屏幕读取数字\n\
    \n### 解决方案\n\nConsole.ReadLine 始终读取文本，即使其含义是数字。如果你想保存一个真正的数字（即 int 类型的值），你必须使用\
    \ Convert.ToInt32 调用来生成它。\n\n```csharp\nstatic void Main(string[] args)\n{\n \
    \   // Prompting the user\n    Console.Write(\"How old are you? \");\n\n    //\
    \ Reading line of text\n    string input = Console.ReadLine();\n\n    // CONVERTING\
    \ TO NUMBER (of entered text)\n    int enteredNumber = Convert.ToInt32(input);\n\
    \n    // Output of entered number\n    Console.WriteLine(\"Your age: \" + enteredNumber);\n\
    \n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n### 讨论\n\n严格来说，你实际上还不需要一个真正的数字，因为你还没有对这些数字进行任何计算。不过，这将在下一个练习中改变。在这里，你是在以最简单的形式探索数字输入。\n\
    \n### 使用输入的数字进行计算\n\n你现在将对用户输入的值进行第一次计算。\n\n### 任务\n\n你将编写一个程序，接受用户输入的出生年份，然后计算他们的年龄（见图\
    \ 8-4）。\n\n![](img/32b055c352c70d22a656320349173d95_123_0.png)\n\n图 8-4. 计算年龄\n\
    \n### 解决方案\n\n解决方案如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n    //\
    \ Prompting the user\n    Console.Write(\"Enter year of your birth: \");\n\n \
    \   // Reading line of text\n    string input = Console.ReadLine();\n\n    //\
    \ CONVERTING TO NUMBER (of entered text)\n    int yearOfBirth = Convert.ToInt32(input);\n\
    \n    // Finding this year\n    DateTime today = DateTime.Today;\n    int thisYear\
    \ = today.Year;\n\n    // Calculating age\n    int age = thisYear - yearOfBirth;\n\
    \n    // Outputting the result\n    Console.WriteLine(\"This year you are/will\
    \ be: \" + age);\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\
    \n### 加上十\n\n让我们继续进行计算。\n\n### 任务\n\n你将编写一个程序，从用户那里接受一个数字。然后，它显示一个比输入的数字大十的数字（见图\
    \ 8-5）。\n\n![](img/32b055c352c70d22a656320349173d95_125_0.png)\n\n### 解决方案\n\n\
    代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Number input\n\
    \    Console.Write(\"Enter a number: \");\n    string input = Console.ReadLine();\n\
    \    int number = Convert.ToInt32(input);\n\n    // Calculating\n    int result\
    \ = number + 10;\n\n    // Displaying the result\n    Console.WriteLine(\"Number\
    \ greater by ten: \" + result);\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
    }\n```\n\n### 加法\n\n现在你将更进一步，使用用户输入的两个数字进行计算。\n\n### 任务\n\n你将编写一个程序，对用户输入的两个数字求和（见图\
    \ 8-6）。\n\n![](img/32b055c352c70d22a656320349173d95_126_0.png)\n\n### 解决方案\n\n\
    代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Input of 1. number\n\
    \    Console.Write(\"Enter 1. number: \");\n    string input1 = Console.ReadLine();\n\
    \    int number1 = Convert.ToInt32(input1);\n\n    // Input of 2. number\n   \
    \ Console.Write(\"Enter 2. number: \");\n    string input2 = Console.ReadLine();\n\
    \    int number2 = Convert.ToInt32(input2);\n\n    // Calculating\n    int result\
    \ = number1 + number2;\n\n    // Result output\n    Console.WriteLine(\"Sum of\
    \ entered numbers is: \" + result);\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
    }\n```\n\n### 错误的输入\n\n在之前的数字程序中，如果用户输入了数字以外的内容，程序会以*运行时错误*终止。然而，生产环境中的程序不应该这样表现。现在你将学习如何处理运行时错误。\n\
    \n### 任务\n\n在本练习中，你将修改之前的程序，使其能正确处理用户的非数字输入（见图 8-7）。\n\n![](img/32b055c352c70d22a656320349173d95_127_0.png)\n\

  md: "\n## Visual Studio\n\nFor C#, the number-one development environment is Visual\
    \ Studio. At the time of writing, the latest production version is 2019, and it\
    \ is available in a free-of-charge edition called Community (see Figure 1-1).\
    \ In a minute, you are going to learn how to install it. Throughout this book,\
    \ I will use the version of Visual Studio available in January 2021, which includes\
    \ a preview of features planned for the next production release, .NET 5 platform\
    \ and C# 9.0 language, among others.\n\n![](img/32b055c352c70d22a656320349173d95_31_0.png)\n\
    \n**Figure 1-1.** *Visual Studio Community*\n\n### Windows Versions\n\nVisual\
    \ Studio requires the Windows operating system. If you perform a web search for\
    \ *Visual Studio system requirements*, you will find the Windows versions supported\
    \ (see Figure 1-2).\n\n### Visual Studio 2019 System Requirements\n\nThe following\
    \ products support the minimum system requirements below:\n\n| Supported Operating\
    \ Systems | Visual Studio 2019 will install and run on the following operating\
    \ systems (64 bit recommended; ARM is not supported): |\n|---|---|\n|  | • Windows\
    \ 10 version 1703 or higher: Home, Professional, Education, and Enterprise (LTSC\
    \ and S are not supported)<br>• Windows Server 2019: Standard and Datacenter<br>•\
    \ Windows Server 2016: Standard and Datacenter<br>• Windows 8.1 (with Update 2919355):\
    \ Core, Professional, and Enterprise<br>• Windows Server 2012 R2 (with Update\
    \ 2919355): Essentials, Standard, Datacenter<br>• Windows 7 SP1 (with latest Windows\
    \ Updates): Home Premium, Professional, Enterprise, Ultimate |\n\n**Figure 1-2.**\

    # Getting the Character


    You access the second character using the `Substring` method that generally pulls
    a specific part (*substring*) out of the given text. The method requires two parameters:


    +   - *The position of the first character of the required substring:* The position
    numbering starts with zero, so the second character position is one.

    +   - *The number of characters of the required substring:* In this case, what
    you need is just a single character, which is why the second parameter is one,
    too.


    # Existence Test


    The test of whether a given character equals something has a hidden catch: the
    second character does not have to exist at all. This happens when the user enters
    zero or one character.


    In such a case, the `Substring(1,1)` call would cause a runtime error.


    This means you have to test first whether the text is at least two characters
    long. Only if this test passes can you access the second character.


    There is a compound condition in the code, as shown here:


    ```

    if (label.Length >= 2 && label.Substring(1, 1) == "X")

    ```


    Its functioning relies upon the *short-circuit evaluation* of the `&&` operator.
    If the first partial condition of an AND join does not hold, the second one is
    not evaluated at all, since it is useless. Even if it held, it would not change
    the overall result because the AND operator requires both parts to hold simultaneously.


    In this case, when the length of a label is less than two, then the `Substring`
    call, which would fail, is skipped, and the program does not crash!


    Note that an analogous statement can be made about the `||` operator, too.


    # An Experiment


    Try to omit the first partial condition (the length check). Then enter a single
    character as a user. The program would terminate with a runtime error. This way
    you will see that the first condition really is important.'

  md: "\n## Structures\n\nIn C#, you may encounter the term *structure* or *struct*,\
    \ as well. What are structures?\n\nWell, you can view them as something like lightweight\
    \ classes. At a beginner’s level, they are almost indistinguishable from normal\
    \ classes, so you may simply substitute the word *class* wherever you see *structure*\
    \ or *struct* for a long time.\n\nFor example, DateTime is the prime example of\
    \ a structure. However, for the sake of simplicity, everywhere in this book I\
    \ treat DateTime on equal terms with normal classes like Random or CultureInfo.\
    \ The only subtle difference you might perceive when working at the level of this\
    \ book is that DateTime objects do not necessarily have to be explicitly created,\
    \ for example, via a constructor call. It is enough, though possibly not practical,\
    \ to declare a variable of that type.\n\n## Summary\n\nIn this chapter, you learned\
    \ that even ordinary text and numbers can behave like objects. Specifically, you\
    \ studied the following:\n\n- Length property, plus ToUpper and Contains methods\
    \ of text/strings\n- ToString method of numbers\n\nIn the latter case, you also\
    \ saw that the output generated by the ToString method can be controlled by format\
    \ strings (like N2, etc.) and language specifications (CultureInfo objects). In\
    \ the future, you will find it convenient to use the ToString method with absolutely\
    \ everything in C#, not just with numbers.\n\nYou got your first glimpse into\
    \ object programming terminology. Specifically, note the following:\n\n- Contrary\
    \ to ordinary objects, static objects always exist in a single copy. While you\
    \ can have as many DateTimes as you like, you always have precisely one Console.\n\
    - The word *class* is synonymous to “object data type.” You will often read about\
    \ objects of a specific class, which means “object of a particular type.”\n\n\
    ## PART II: Calculations\n\n## CHAPTER 8: Input\n\nUp to now, all of your programs\
    \ have been manipulating data (numbers, text, and so on) that was either fixed\
    \ directly in source code or drawn from the operating system (dates, random numbers,\
    \ and so on). Typically, programs get their data from the user, which is what\
    \ you will learn about in this chapter.\n\n### Text Input\n\nYou will start your\
    \ study of input with the simplest possible case.\n\n### Task\n\nYou will write\
    \ a program that accepts a single line of text from the user and immediately repeats\
    \ the inputted text to the output (see Figure 8-1).\n\n![](img/32b055c352c70d22a656320349173d95_119_0.png)\n\
    \nFigure 8-1. The completed program\n\n### Solution\n\nHere is the code:\n\n```csharp\n\
    static void Main(string[] args)\n{\n    // Hinting user what we want from her\n\
    \    Console.Write(\"Enter a sentence (and press Enter): \");\n\n    // Reading\
    \ line of text\n    string input = Console.ReadLine();\n\n    // Repeating to\
    \ the output\n    Console.WriteLine(\"You have entered: \" + input);\n\n    //\
    \ Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n### Discussion\n\nConsole.Write\
    \ does not transfer the cursor to the next line, contrary to Console.WriteLine,\
    \ which you have been using exclusively up to now.\n\n### Numeric Input\n\nIn\
    \ previous exercises, you were engaged with the input of text information from\
    \ the user. Now you will switch to numbers, which are equally important.\n\n###\
    \ Task\n\nYou will write a program that takes a number from the user, stores it\
    \ in a numeric variable, and finally repeats it to the user (see Figure 8-3).\n\
    \n![](img/32b055c352c70d22a656320349173d95_122_0.png)\n\nFigure 8-3. Reading a\
    \ number from the screen\n\n### Solution\n\nConsole.ReadLine always reads text\
    \ even if its meaning is a number. If you want to hold a real number (i.e., a\
    \ value of the int type), you have to manufacture it using the Convert.ToInt32\
    \ call.\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Prompting the\
    \ user\n    Console.Write(\"How old are you? \");\n\n    // Reading line of text\n\
    \    string input = Console.ReadLine();\n\n    // CONVERTING TO NUMBER (of entered\
    \ text)\n    int enteredNumber = Convert.ToInt32(input);\n\n    // Output of entered\
    \ number\n    Console.WriteLine(\"Your age: \" + enteredNumber);\n\n    // Waiting\
    \ for Enter\n    Console.ReadLine();\n}\n```\n\n### Discussion\n\nStrictly speaking,\
    \ you have not actually needed a real number yet since you have not made any calculation\
    \ on the numbers. However, this will change in the next exercise. Here, you were\
    \ exploring numeric input in the simplest possible form.\n\n### Calculation with\
    \ Entered Number\n\nYou will now do your first calculation with the value entered\
    \ by the user.\n\n### Task\n\nYou will write a program that accepts a year of\
    \ birth from the user and calculates their age afterward (see Figure 8-4).\n\n\
    ![](img/32b055c352c70d22a656320349173d95_123_0.png)\n\nFigure 8-4. Calculating\
    \ an age\n\n### Solution\n\nHere is the solution:\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    // Prompting the user\n    Console.Write(\"Enter year of your\
    \ birth: \");\n\n    // Reading line of text\n    string input = Console.ReadLine();\n\
    \n    // CONVERTING TO NUMBER (of entered text)\n    int yearOfBirth = Convert.ToInt32(input);\n\
    \n    // Finding this year\n    DateTime today = DateTime.Today;\n    int thisYear\
    \ = today.Year;\n\n    // Calculating age\n    int age = thisYear - yearOfBirth;\n\
    \n    // Outputting the result\n    Console.WriteLine(\"This year you are/will\
    \ be: \" + age);\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\
    \n### Ten More\n\nLet’s continue with the calculations.\n\n### Task\n\nYou will\
    \ write a program that accepts a number from the user. After that, it displays\
    \ a number that is greater by ten than the one entered (see Figure 8-5).\n\n![](img/32b055c352c70d22a656320349173d95_125_0.png)\n\
    \n### Solution\n\nHere is the code:\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    // Number input\n    Console.Write(\"Enter a number: \");\n    string input\
    \ = Console.ReadLine();\n    int number = Convert.ToInt32(input);\n\n    // Calculating\n\
    \    int result = number + 10;\n\n    // Displaying the result\n    Console.WriteLine(\"\
    Number greater by ten: \" + result);\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
    }\n```\n\n### Addition\n\nYou will take this step further now and make calculations\
    \ with two numbers from the user.\n\n### Task\n\nYou will write a program that\
    \ sums two numbers entered by the user (see Figure 8-6).\n\n![](img/32b055c352c70d22a656320349173d95_126_0.png)\n\
    \n### Solution\n\nHere is the code:\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    // Input of 1. number\n    Console.Write(\"Enter 1. number: \");\n    string\
    \ input1 = Console.ReadLine();\n    int number1 = Convert.ToInt32(input1);\n\n\
    \    // Input of 2. number\n    Console.Write(\"Enter 2. number: \");\n    string\
    \ input2 = Console.ReadLine();\n    int number2 = Convert.ToInt32(input2);\n\n\
    \    // Calculating\n    int result = number1 + number2;\n\n    // Result output\n\
    \    Console.WriteLine(\"Sum of entered numbers is: \" + result);\n\n    // Waiting\
    \ for Enter\n    Console.ReadLine();\n}\n```\n\n### Incorrect Input\n\nIn the\
    \ previous programs with numbers, if the user entered something other than a number,\
    \ the program terminated with a *runtime error*. Production programs, however,\
    \ should not behave like this. Now you will learn how to deal with a runtime error.\n\
    \n### Task\n\nIn this exercise, you will modify the previous program so that it\

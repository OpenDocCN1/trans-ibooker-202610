    # Common Operations


    The Console class contains the following methods for reading console input and
    writing console output:


    +   - The overloads of the ReadKey method read an individual character.

    +   - The ReadLine method reads an entire line of input.

    +   - The Write method overloads convert an instance of a value type, an array
    of characters, or a set of objects to a formatted or unformatted string, and then
    write that string to the console.

    +   - A parallel set of WriteLine method overloads output the same string as the
    Write overloads but also add a line termination string.


    The Console class also contains methods and properties to perform the following
    operations:


    +   - Get or set the size of the screen buffer. The BufferHeight and BufferWidth
    properties let you get or set the buffer height and width, respectively, and the
    SetBufferSize method lets you set the buffer size in a single method call.


    Figure 14-9. Getting introductory information in the Common Operations section'

    {\n    // Input\n    Console.Write(\"Enter a number: \");\n    string input =\
    \ Console.ReadLine();\n    int number = Convert.ToInt32(input);\n    Console.WriteLine();\n\
    ```\n\n![](img/32b055c352c70d22a656320349173d95_191_0.png)\n\n*Figure 13-3. Increment\
    \ and decrement operators*\n\n### Solution\n\nHere is the code:\n\n```csharp\n\
    static void Main(string[] args)\n{\n    // Input\n    Console.Write(\"Enter a\
    \ number: \");\n    string input = Console.ReadLine();\n    int number = Convert.ToInt32(input);\n\
    \n    // Increasing by 1 using INCREMENT OPERATOR\n    number++; // same as number\
    \ = number + 1;\n    Console.WriteLine(\"Increased by 1: \" + number);\n\n   \
    \ // Decreasing by 1 using DECREMENT OPERATOR\n    number--; // same as number\
    \ = number - 1;\n    Console.WriteLine(\"Back again: \" + number);\n\n    // Waiting\
    \ for Enter\n    Console.ReadLine();\n}\n```\n\n## Compound Assignment and Text\n\
    \nSince the + operator can be used with text, you can use the compound assignment\
    \ operator (+=) with text, too. You will probably use this frequently.\n\n###\
    \ Task\n\nThis task will get you familiar with text concatenations using compound\
    \ assignment (see Figure 13-4).\n\n![](img/32b055c352c70d22a656320349173d95_192_0.png)\n\
    \n*Figure 13-4. Text concatenations using compound assignment*\n\n### Solution\n\
    \nHere is the code:\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Initial\
    \ value (empty text)\n    string books = \"\";\n\n    // Appending\n    books\
    \ += \"Homage to Catalonia\" + Environment.NewLine;\n    books += \"Silent Spring\"\
    \ + Environment.NewLine;\n    books += \"The beat of a different drum\" + Environment.NewLine;\n\
    \n    // Output\n    Console.WriteLine(\"Valuable books\");\n    Console.WriteLine(\"\
    -------------\");\n    Console.WriteLine(books);\n\n    // Waiting for Enter\n\
    \    Console.ReadLine();\n}\n```\n\n## Progressive Summation\n\nProgressive summation\
    \ is an important principle of summing a large number of values. It means summing\
    \ them not all at once in a single statement but summing them one by one, progressively\
    \ accumulating intermediate results in a special variable.\n\n### Task\n\nYou\
    \ will write a program that progressively sums three entered numbers. Sure, summing\
    \ three numbers would be more conveniently done at once in a single line. However,\
    \ I want to illustrate the important principle of progressive summation on a simple\
    \ example and get you used to the idea before covering a more complex topic, namely,\
    \ loops (see Figure 13-5).\n\n![](img/32b055c352c70d22a656320349173d95_193_0.png)\n\
    \n*Figure 13-5. Progressively summing three entered numbers*\n\n### Solution\n\
    \nHere is the code:\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Preparation\
    \ - variable to accumulate intermediate result\n    int sum = 0;\n\n    // Input\
    \ - 1. number\n    Console.Write(\"Enter first number: \");\n    string input\
    \ = Console.ReadLine();\n    int number = Convert.ToInt32(input);\n\n    // Adding\
    \ first number to intermediate result\n    sum += number;\n\n    // Input - 2.\
    \ number\n    Console.Write(\"Enter second number: \");\n    input = Console.ReadLine();\n\
    \    number = Convert.ToInt32(input);\n\n    // Adding second number to intermediate\
    \ result\n    sum += number;\n\n    // Input - 3. number\n    Console.Write(\"\
    Enter third number: \");\n    input = Console.ReadLine();\n    number = Convert.ToInt32(input);\n\
    \n    // Adding third number to intermediate result\n    sum += number;\n\n  \
    \  // Output\n    Console.WriteLine();\n    Console.WriteLine(\"Sum of entered\
    \ numbers: \" + sum);\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n\
    ```\n\n## Multiple Text Join\n\nAgain, since the + operator can be used with text,\
    \ too, you can extend the principle of progressive summation to text. In this\
    \ context, it may rather be called *progressive accumulation*.\n\n### Task\n\n\
    You will write a program that progressively accumulates names entered by the user.\
    \ It will be interesting to make two accumulations; the first one is in the original\
    \ order, and the second one is in the reverse order.\n\nFor simplicity, you will\
    \ work with three values only (see Figure 13-6).\n\n![](img/32b055c352c70d22a656320349173d95_195_0.png)\n\
    \n*Figure 13-6. Progressively accumulating names*\n\n### Solution\n\nHere is the\
    \ code:\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Preparation -\
    \ variables to accumulate intermediate results\n    string inOriginalOrder = \"\
    \";\n    string inReversedOrder = \"\";\n\n    // Input of the first person\n\
    \    Console.Write(\"Enter first person: \");\n    string person = Console.ReadLine();\n\
    \n    // Appending the first person to intermediate result\n    inOriginalOrder\
    \ += person + Environment.NewLine;\n    inReversedOrder = person + Environment.NewLine\
    \ + inReversedOrder;\n\n    // Input of the second person\n    Console.Write(\"\
    Enter second person: \");\n    person = Console.ReadLine();\n\n    // Appending\
    \ the second person to intermediate result\n    inOriginalOrder += person + Environment.NewLine;\n\
    \    inReversedOrder = person + Environment.NewLine + inReversedOrder;\n\n   \
    \ // Input of the third person\n    Console.Write(\"Enter third person: \");\n\
    \    person = Console.ReadLine();\n\n    // Appending the third person to intermediate\
    \ result\n    inOriginalOrder += person + Environment.NewLine;\n    inReversedOrder\
    \ = person + Environment.NewLine + inReversedOrder;\n\n    // Output\n    Console.WriteLine();\n\
    \    Console.WriteLine(\"Entered persons\");\n    Console.WriteLine(\"---------------\"\
    );\n    Console.WriteLine(inOriginalOrder);\n    Console.WriteLine(\"In reversed\
    \ order\");\n    Console.WriteLine(\"----------------\");\n    Console.WriteLine(inReversedOrder);\n\
    \n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n### Note\n\nIt\
    \ is interesting to note that when joining the people’s names in reverse order,\
    \ the compound assignment is of no help.\n\n## Summary\n\nThe central topic of\
    \ this chapter has been the accumulation of values in the same variable. Contrary\
    \ to the programs so far, the programs here were repeatedly changing the value\
    \ of a variable, usually using its original value, and modifying it somehow. Specifically,\
    \ you studied the following:\n\n- Statements such as `variable = variable + change;`\
    \ that take the present value of variable, add change to it, and store the result\
    \ as a new value of variable\n- Compound assignments such as `variable += change;`,\
    \ which are short equivalents of previous statements\n- Compound assignments with\
    \ other arithmetic operations: `-=`, `*=`, `/=`\n- Compound assignments with text\
    \ (only `+=`)\n- Incrementing (adding one) and decrementing (subtracting one)\
    \ variables using the super-short notation of `variable++;` and `variable--;`\n\
    \nAt the end of the chapter, you got acquainted with the principle of progressive\
    \ summation (and progressive accumulation), which means summing numbers one by\
    \ one while storing intermediate results in a special variable. This principle\
    \ is mostly used when summing a large number of values, and you will appreciate\
    \ its extreme importance when studying loops later in this book.\n\n## Part III:\
    \ Conditionals\n\n### Chapter 14: Essential Tools\n\nYou have already completed\
    \ two parts of this book. In the next two parts, you will learn about more complicated\
    \ topics, such as dealing with conditions and loops. So that you properly understand\
    \ these topics, in this chapter I will cover some tools that can be of great help\
    \ to you in your programming.\n\n### IntelliSense\n\nYou know the first tool I\
    \ will cover: Visual Studio IntelliSense. Whenever you start typing anything,\
    \ Visual Studio immediately offers you options for completing the text. When you\
    \ choose one of the options, the development environment shows you further details\
    \ about the option in a tooltip—what the option does, what parameters it requires,\
    \ and so on.\n\nI am covering IntelliSense in this chapter because it is often\
    \ underused by beginning programmers. I recommend you get used to completing virtually\
    \ every word you type using IntelliSense. You will spare yourself of a huge number\
    \ of typos.\n\n### Exploring the Possibilities\n\nUsing IntelliSense is also a\
    \ way to explore all the possibilities that every contemporary computing platform\
    \ offers.\n\nIn former days, you had to study the possibilities in manuals or\
    \ books. Some of them were capable enough to cover almost all the questions a\
    \ programmer had. Today, however, there are so many possibilities that even a\
    \ 1000-page book cannot show them all.\n\nYou still need books (definitely this\
    \ one!) to give you reliable and systematic instruction so you can understand\
    \ the principles, but you will probably want to explore further possibilities\
    \ not mentioned there. IntelliSense is a tool that can show you many of them.\n"
  mdcn: "\n\n## 进一步的复合赋值\n\n你喜欢复合赋值吗？在处理其他算术运算时，还有更多类似的赋值可以使用。\n\n### 任务\n\n我将向你展示一个程序，该程序说明了复合赋值与减法、乘法和除法的关联（见图\

    图 14-2. 输入数据类型和一个点


    你是否在寻找可以对日期执行的操作？输入 DateTime 变量，然后输入一个点（见图 14-3）。


    ![](img/32b055c352c70d22a656320349173d95_201_0.png)


    ![](img/32b055c352c70d22a656320349173d95_202_0.png)


    图 14-3. 输入 DateTime 和一个点


    与文本一样，你可以输入 DateTime 和一个点，然后获得一些关于哪些操作可能有用的提示（见图 14-4）。


    ![](img/32b055c352c70d22a656320349173d95_204_0.png)


    图 14-5. 列表成员的快捷方式


    ## 文档


    IntelliSense 可以给你许多提示。它还可以显示你搜索的功能的基本用法。但是，能找到所有详细信息的地方是在线文档。


    ### docs.microsoft.com


    http://docs.microsoft.com 是开始查找有关 C# 和其他 Microsoft 技术任何内容的最佳地点（见图 14-6）。在页面上，点击“Documentation”，然后直接转到“C#”。


    ![](img/32b055c352c70d22a656320349173d95_205_0.png)


    *图 14-6. Microsoft 文档*


    ### 搜索


    你可以使用所提供的链接来使用文档站点。然而，更常见的是搜索特定内容。例如，在搜索字段中输入 **Console 类**，然后按 Enter 键（见图 14-7）。


    ![](img/32b055c352c70d22a656320349173d95_206_0.png)


    *图 14-7.* 搜索“Console class”


    你感兴趣的链接通常是最先返回的那一个（见图 14-8）。


    ![](img/32b055c352c70d22a656320349173d95_206_1.png)


    *图 14-8.* 查看“Console class”的文档


    ### 特定类页面


    点击正确的链接后，你会找到关于某个特定类的所有内容，例如本例中的 Console。


    当我初步了解某个还不熟悉的类时，我通常会查找“Common Operations”和“Remarks”部分，这些部分涵盖了类使用的基本信息和进一步细节的入口点（见图
    14-9 和 14-10）。


    ![](img/32b055c352c70d22a656320349173d95_207_0.png)


    ### 常见操作


    Console 类包含以下用于读取控制台输入和写入控制台输出的方法：


    - ReadKey 方法的重载读取单个字符。

    - ReadLine 方法读取整行输入。

    - Write 方法的重载将值类型的实例、字符数组或一组对象转换为格式化或未格式化的字符串，然后将该字符串写入控制台。

    - 一组并行的 WriteLine 方法重载输出与 Write 重载相同的字符串，但还会附加一个行终止字符串。


    Console 类还包含用于执行以下操作的方法和属性：


    - 获取或设置屏幕缓冲区的大小。BufferHeight 和 BufferWidth 属性分别让你获取或设置缓冲区的高度和宽度，而 SetBufferSize
    方法让你在一个方法调用中设置缓冲区大小。


    图 14-9. 在“常见操作”部分获取介绍性信息


    ### 备注


    控制台是一个操作系统窗口，用户通过计算机键盘输入文本，并从计算机终端读取文本输出，从而与操作系统或基于文本的控制台应用程序交互。例如，在 Windows 操作系统中，控制台被称为命令提示符窗口，接受
    MS-DOS 命令。Console 类为从控制台读取字符和向控制台写入字符的应用程序提供基本支持。


    有关使用 Console 类进行开发的信息，请参阅以下部分：


    - 控制台 I/O 流

    - 屏幕缓冲区和控制台窗口

    - 控制台的 Unicode 支持

    - 常见操作

    - .NET Core 备注


    ![](img/32b055c352c70d22a656320349173d95_208_0.png)


    ### 常见搜索


    作为文档这一节的总结，请注意你也可以在 Microsoft 文档站点之外进行搜索。只需使用你喜欢的 Web 浏览器进行搜索。


    然而，与文档站点搜索相反，常见搜索会更频繁地显示不相关的结果。为了弥补这一点，你可以使用编程语言名称来细化查询，例如在你喜欢的 Web 浏览器的搜索字段中输入
    **Console 类 C#**。


    ## 调试工具


    除了 IntelliSense 和文档之外，还有其他一些工具对你有所帮助。具体来说，你可以使用调试工具，可以说是能够“窥视”计算机内部。你可以用它们来查看计算机如何执行单条命令、内存中存储了哪些值，等等。


    这些是你现在要学习的工具。最初，它们是为了方便程序调试而开发的，换句话说，是为了查找和消除错误。然而，它们作为说明性工具，可能更有助于你理解各种编程结构。


    ### 项目


    最好在实践中尝试所有工具，因此请打开第 8 章中 Visual Studio 中的“处理错误输入”项目。该程序将两个数字相加，并使用 try-catch 处理可能的输入错误。


    ### 单步执行代码


    计算机运行速度如此之快，以它的千兆赫兹速度，人眼不可能跟上。因此，*单步执行*代码常常很有帮助，它迫使计算机按照你的命令一次执行一条语句。


    转到你打开的“处理错误输入”项目，使用 F10 键而不是通常的 F5 键启动它。当然，选择“调试 ➤ 单步跳过”菜单也会执行相同的操作（见图 14-11）。


    ### 断点


    我已经介绍了当你经过感兴趣的点之后不想单步执行代码时该怎么办。还有另一种情况。假设在到达感兴趣的位置之前，你不想进行任何单步执行。在这种情况下，你可以使用断点。


    单击希望计算机停止的语句，然后按 F9（或者右键单击并选择“断点 ➤ 插入断点”）。已放置断点的事实会以深红色背景和行首的深红色圆点来表示（见图 14-12）。


    ![](img/32b055c352c70d22a656320349173d95_211_0.png)


    图 14-12. 插入的断点


    ### 使用断点


    如果你的程序仍在运行（来自之前的练习），请使用 Shift+F5 组合键终止它。现在用常规方式启动程序，即使用 F5 键。程序将正常运行，并在到达断点时停止。Visual
    Studio 会弹到程序窗口的前面。


    之后，你可以单步执行代码，或者只是查看某些内容，然后使用 F5 键继续运行程序，直到程序结束，或者遇到下一个断点。


    ### 移除断点


    要移除不再需要的断点，请在特定行上再次按 F9，或者右键单击并从上下文菜单中选择“断点 ➤ 删除断点”。


    ### 内存检查


    每当你的程序被挂起时（由于断点、单步执行等原因），你都可以检查程序可用的内存，并查看各个变量的值。


    为了方便内存检查，Visual Studio 会在其窗口底部显示“自动”、“局部变量”和“监视”窗格。如果这些窗格不存在，你可以通过“调试 ➤ 窗口”菜单显示它们。


    “自动”和“局部变量”窗格会自动选择要显示的变量，而“监视”窗格则根据你想看的内容手动填充。你可以在窗格中输入特定变量的名称，也可以右键单击代码中的变量并从上下文菜单中选择“添加监视”（见图
    14-13）。


    # Summary


    The main purpose of this chapter was to show you that objects are more complex
    entities than just conglomerates of data components. Specifically, they frequently
    contain methods, which are actions you can perform that usually operate on the
    object’s data.


    You got acquainted with various methods of the DateTime, Random, and Environment
    objects. Specifically, you studied the following:


    +   - Conversions of dates to text using the `ToLongDateString` and `ToShortDateString`
    methods

    +   - One of the methods for date arithmetic, namely, `AddDays`

    +   - The `Next` method for producing a single random number within a specified
    range

    +   - The `GetFolderPath` method, which can be used to get the file system path
    to special folders such as Desktop, Documents, and so on


    You also learned about creating objects using constructor calls. You entered the
    new word, followed by the object type’s name and parentheses. Some constructors,
    like that of Random objects, require just empty parentheses, while others, like
    that of DateTime, require you to specify some values (year, month, and day) between
    the parentheses.


    Within the final example, you also found usage of so-called enumerations, which
    are essentially sets of predefined (enumerated) values. Visual Studio’s IntelliSense
    is of great help when working with the enumerations.'

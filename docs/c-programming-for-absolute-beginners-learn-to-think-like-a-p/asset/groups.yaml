    N0\"));\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n## 注意\n\
    \n然而，这段代码并不能解决所有问题。当你立即启动程序时，第一次计算仍然会是错误的。人们有时把 try-catch 当作万灵丹，但它绝对不是。你需要其他手段，如下文所讨论的。\n\
    \n## Visual Studio 中的设置\n\n你需要在 Visual Studio 中设置你的项目，使其将溢出从程序中报告出来，而不是将其掩盖。\n\
    \n在 Visual Studio 菜单中，选择“项目”，然后选择“<项目名> 属性”（见图12-4）。\n\n![](img/32b055c352c70d22a656320349173d95_181_0.png)\n\
    \n**图 12-4.** 打开属性\n\n接下来选择“生成”选项卡，垂直（也许还要水平）滚动，以便能看到“高级”按钮（它确实很隐蔽！），然后点击该按钮（见图12-5）。\n\
    \n![](img/32b055c352c70d22a656320349173d95_182_0.png)\n\n**图 12-5.** *生成选项卡*\n\
    \n在出现的对话框中，选中“检查算术溢出/下溢”复选框，然后点击“确定”按钮确认（见图12-6）。\n\n![](img/32b055c352c70d22a656320349173d95_183_0.png)\n\
    \n**图 12-6.** *“检查算术溢出/下溢”复选框*\n\n你的项目现在终于可以运行了。\n\n## 结果\n\n现在程序按预期运行，如图12-7所示。\n\
    \n![](img/32b055c352c70d22a656320349173d95_183_1.png)\n\n**图 12-7.** *一百万乘以一百万*\n\
    \n## 第一种替代方案\n\n第一次计算正确地报告了问题。省略 try-catch 构造会引发运行时错误，但至少它不会显示错误的结果。\n\n## 其他替代方案\n\
    \n正确的计算在计算开始*之前*将 million 转换为 `long` 类型。\n执行此转换有两种方式：\n\n- 将 million 赋值给类型为 `long`\
    \ 的变量\n- 使用 `(long)million` 进行显式*类型转换*\n\n如果你不需要精确的整数运算，你也可以使用 `double` 类型进行计算。除非你处理某些非常特殊的数学问题，否则\
    \ `double` 不太可能溢出。\n\n## 小结\n\n在本章中，你学习了高级数值计算。你认识了 C# 中可用的所有数值数据类型。这些类型的区别在于它们是否允许整数或小数，也在于取值范围的不同。用于小数的类型在存储数字的精度上也各不相同。\n\
    \n在初学者层面，了解 `int` 和 `double` 就足够了；你完全可以只使用它们。当你更有经验时，可能还会使用以下类型：\n\n- `long` 类型用于较大的整数，例如文件大小、十位数字的支付编号，或中等大小数字的乘法结果\n\
    - `decimal` 类型用于处理货币\n- `byte` 类型用于处理二进制数据\n\n你还研究了溢出问题。当计算出的值太大，无法放入特定数据类型的取值范围时，就会产生无意义的结果。Visual\
    \ Studio 的默认行为是像往常一样继续运行。然而，现在你知道如何修改设置，以至少引发运行时错误，因为继续使用错误的结果才是糟糕的选择。\n\n最好的替代方案是选择取值范围合适的数据类型，从而完全避免溢出。但请记住，仅仅更改用于存储结果的变量的类型可能还不够。例如，int\
    \ 乘以 int 永远是 int，其最大值约为 20 亿，无论你将结果存储在哪里。在计算之前将数字转换为 `long` 类型可能是合适的。\n\n## 第13章\n\
    \n## 累加值\n\n到目前为止，你使用的变量都是存储一个值，然后稍后使用它。在初始赋值后，变量的值不会改变。现在，你可以进入下一步，研究变量值在程序运行期间发生变化的情况，换句话说，就是根据旧值确定新值的情况。\n\
    \n## 再谈“加十”\n\n首先，你将回到给一个数字加十的任务，这在第8章中学过。程序的目标是显示一个比用户输入的数字大十的值（见图13-1）。\n\n\
    ![](img/32b055c352c70d22a656320349173d95_186_0.png)\n\n## 任务\n\n你现在将用一种新方法来解决这个任务；具体来说，你会将计算结果存储在同一个变量中，也就是最初存储输入数字的那个变量。\n\
    \n这未必是更好的解决方案，但你将学习如何在后续小节中进一步以此为基础。\n\n## 解决方案\n\n代码如下：\n\n```csharp\nstatic\
    \ void Main(string[] args)\n{\n    // Input\n    Console.Write(\"Enter a number:\
    \ \");\n    string input = Console.ReadLine();\n    int number = Convert.ToInt32(input);\n\
    \n    // Calculation\n    number = number + 10;\n\n    // Result output\n    Console.WriteLine(\"\
    Number ten more greater is: \" + number);\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
    }\n```\n\n## 讨论\n\n解决方案的核心语句如下：`number = number + 10;`。这条语句很不寻常，因为同一个东西——变量 number——出现在等号的两边！\n\
    \n计算机是这样执行这条语句的：“取变量 number 的当前值，加上十，并把结果存储为变量 number 的新值。”因此，这条语句的净效果是将 number\
    \ 的值增加十。\n"

    # Summary


    In this chapter, you were introduced to the important concept of variables. In
    every real program, you need to temporarily store values (calculation results,
    user inputs, etc.) in a computer’s memory, and this is exactly what you use variables
    for. A variable is a place in memory that has a name to reference it and its data
    type to be clear about what kind of data you will store in it.


    Specifically, you learned the following:


    +   - Before you can use a variable, you must declare it. An appropriate statement
    is `string message;`.

    +   - To store a value in a variable, you use the assignment statement format

    \n*Figure 2-3.* Choosing for a new project\n\n![](img/32b055c352c70d22a656320349173d95_40_0.png)\n\
    \n*Figure 2-4.* Selecting a project template\n\n### Creating New Project\n\nThe\
    \ dialog that appears (see Figure [2-4](#)) requires you to choose a new project\
    \ template. Select the Console App C# template and press the Next button.\n\n\
    In the next dialog (see Figure [2-5](#)), type “My first program” as a new project\
    \ name and press the Create button.\n\n![](img/32b055c352c70d22a656320349173d95_41_0.png)\n\
    \nFigure 2-5. Entering a name for your new project\n\n### Writing the Program\
    \ Code\n\nThe most important step is writing the program's code, so read on.\n\
    \n### The Look of the Development Environment\n\nAfter project creation, Visual\
    \ Studio looks like Figure 2-6.\n\n![](img/32b055c352c70d22a656320349173d95_42_0.png)\n\
    \n**Figure 2-6.** *The look of Visual Studio*\n\nThe main part of the development\
    \ environment window is occupied by the *source code editor*. In it, the Program.cs\
    \ file is opened, as is suggested by the tab’s title. Program.cs is the main file\
    \ of your new Console project. As you can see, it already contains some source\
    \ code.\n\nYou might wonder where this code came from. You haven’t written any\

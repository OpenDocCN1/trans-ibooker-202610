    \n具体来说，你遇到了以下内容：\n\n-   DateTime对象，可用于获取当前日期或时间\n-   Environment对象，可用于获取关于程序“环境”的信息，如计算机名称或用户名\n\
    \n你还学习了以下内容：\n\n-   对象可以存储在适当类型的变量中。\n-   可以通过所谓的点表示法访问对象的组成部分。你写出对象变量的名称并附加一个点，然后借助Visual\

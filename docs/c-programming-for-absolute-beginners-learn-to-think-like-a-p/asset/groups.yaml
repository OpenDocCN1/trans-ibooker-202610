    \   Console.WriteLine();\n    Console.WriteLine(\"Sum of entered numbers: \" +\
    \ sum);\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n## 多重文本连接\n\
    \n同样，由于 + 运算符也可以用于文本，因此你可以将渐进求和的原则扩展到文本。在这种情况下，它可能更被称为 *渐进累积*。\n\n### 任务\n\n你将编写一个程序，逐步累积用户输入的名称。将进行两次累积会很有趣；第一次按原始顺序，第二次按相反顺序。\n\
    \n为简单起见，你将只处理三个值（见图 13-6）。\n\n![](img/32b055c352c70d22a656320349173d95_195_0.png)\n\
    \n*Figure 13-6. Progressively accumulating names*\n\n### 解决方案\n\n以下是代码：\n\n```csharp\n\
    static void Main(string[] args)\n{\n    // Preparation - variables to accumulate\
    \ intermediate results\n    string inOriginalOrder = \"\";\n    string inReversedOrder\
    \ = \"\";\n\n    // Input of the first person\n    Console.Write(\"Enter first\
    \ person: \");\n    string person = Console.ReadLine();\n\n    // Appending the\

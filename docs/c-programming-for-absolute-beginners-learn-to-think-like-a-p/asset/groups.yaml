    # CHAPTER 25　ADVANCED LOOPS


    # Dice


    I noted already that there are lots of exercises in this book simulating dice
    throwing because I played lots of board games as a child. These were not just
    games purchased from a store. I invented many of my own games then, with most
    of them simulating sport events. There were different rules for sprints, long
    runs, jumps, bike races, soccer, and so on. That was possibly a good preparation
    for becoming a programmer.


    # The Sine Task


    I admit the Sine task of this chapter is substantially above a beginner’s level.
    I included it to give you a glimpse at your possible future in the Wonderful Land
    of Programming.


    To me, the task also has a personal connection. At some point when I was in school,
    I wondered how a calculator computes sines. I was thinking the function values
    are tabulated (“hardwired”) in the calculator and further interpolated. Only later
    did I find out the other way, the one you saw.


    # Moon Landing


    A simplified version of the moon landing task was actually my first encounter
    with programming. No, I didn’t program it; I was its computer instead.


    When I was young, I read a special issue of a journal explaining programming to
    youngsters like me. The issue contained a paper computer. It was a piece of paper
    with windows representing variables. In these windows, you could pull paper strips,
    writing a variable’s values on them. Assigning a new value to a variable? You
    just pulled the strip to hide the old value and wrote down a new value on the
    same strip with a pencil.


    I performed all the calculations using an electronic calculator. I was executing
    the program’s statements, and I was the computer’s CPU running at a marvelous
    speed of 0.5 Hz (yes, the G is omitted intentionally), which could be boosted
    to 0.6 Hz using a chocolate bar.


    At that time, which was 1982 in Czechoslovakia, I landed that moon module possibly
    several hundred times, later also using my software on a programmable calculator.
    Perhaps I was the most experienced astronaut of the days. Regardless, that was
    a highly motivating road toward programming.'

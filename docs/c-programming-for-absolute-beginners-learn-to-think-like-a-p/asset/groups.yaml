    \ const。我只是想让你见识一下，以防你在工作过程中遇到它。\n\n### 佣金\n\n在资本主义中，最重要的不是创造、生产或种植什么。最重要的是销售！而销售商品的人通常会获得佣金，因此你必须学会如何计算佣金。\n\

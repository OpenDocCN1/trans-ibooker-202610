    # Summary


    In this chapter, you got acquainted with objects, which are essentially conglomerates
    of several components. Contrary to “atomic” (single-valued) types such as int
    or string, objects usually contain a number of values.


    Specifically, you met the following:


    +   - The DateTime object, which can be used to retrieve the current date or time

    +   - The Environment object, which can be used to retrieve information about
    a program’s “surroundings” such as computer names or usernames


    You also learned the following:


    +   - The objects can be stored in variables of the appropriate type.

    +   - An object’s components can be accessed via the so-called dot notation. You
    write the name of an object’s variable and append the dot, and a list of available
    components pops up thanks to Visual Studio IntelliSense.

    +   - Each object type belongs to some namespace. To put it simply, namespaces
    can be viewed as containers of similar object types.

    +   - An important namespace is the System namespace, which contains basic object
    types such as DateTime or Console.'

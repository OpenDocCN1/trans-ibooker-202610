    \n## 小结\n\n在本章中，你学习了几个高级条件的示例。\n\n你从所谓的条件运算符（`?:`）入手，它也被称为三元运算符，因为它处理三个值。根据指定条件（问号之前的第一个值）是否满足，该运算符的“工作”结果要么是\
    \ *yesValue*（第二个值，位于问号和冒号之间），要么是 *noValue*（第三个值，位于冒号之后）。条件运算符是某些 if-else 情况的合适简写替代方式。\n\
    \n总结评估中的中间任务是对你学到的关于条件执行的所有内容的一种回顾。在那里，你遇到了各种测试、许多复合条件，以及使用 `!` 运算符进行取反。\n\n最后一项任务，即测试某段文本的第二个字符，向你展示了在探究第二个字符是什么之前，测试它是否确实存在的重要性。在那里，你使用了条件的短路求值。如果复合条件的结果在第一个部分条件求值后就已经能够确定，那么第二个部分条件就会被完全跳过。\n\
    \n## 第四部分\n\n## 循环\n\n## 最初的循环\n\n你将进入本书最困难的章节。循环是一种强大的工具，所有程序员都需要它，如同呼吸空气一样不可或缺。理解循环并不容易，因此你将经历许多与循环相关的练习。\n\
    \n### 重复同一段文本\n\n循环是一种工具，用来高效地实现同一或（更常见的）类似活动的重复。为了让你能够恰当地体会循环，某些任务你将解决两次：第一次不用循环，第二次使用循环。你将从重复同一活动开始，之后继续使用循环来重复类似活动。\n\
    \n### 任务\n\n你将编写一个程序，连续显示“I will start learning tomorrow.”十次（见图 20-1）。\n\n###\
    \ 使用循环的解决方案\n\n稍微想一想前面的练习。你能想象有人可能想让你更改显示的句子吗？你能想象将它重复一百次而不是十次吗？你能想象重复次数由用户输入吗？\n\
    \n要解决这些问题，你需要一个新工具：循环。\n\n### 解决方案\n\n这是代码：\n\n```\nstatic void Main(string[]\
    \ args)\n{\n    // Output\n    for (int count = 0; count < 10; count++)\n    {\n\
    \        Console.WriteLine(\"I will start learning tomorrow.\");\n    }\n\n  \
    \  // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n### for 循环的工作原理\n\n\
    你使用 for 结构来表示重复。它的通用语法如下：\n\n```\nfor (initializer; loopCondition; iterator)\n\
    {\n    statement;\n    statement;\n    statement;\n    ...\n}\n```\n\nfor 循环的工作原理如下：\n\
    \n- `initializer` 在进入循环前执行一次。\n- `loopCondition` 在每轮循环之前被求值。如果它成立，计算机进入循环并执行循环体内的语句。\n\
    - 迭代器语句在每轮循环完成后执行。之后，重新求值 `loopCondition`。\n\n图 20-2 显示了程序流程。\n\n![](img/32b055c352c70d22a656320349173d95_297_0.png)\n\
    \n*图 20-2.*  程序流程\n\n### 循环\n\n在这种情况下，所需的重复次数是通过对目前已执行的循环轮数进行计数来实现的。为此，你使用 count\
    \ 变量。\n\n在开始（初始化器）时，变量被设置为零。每完成一轮循环（迭代器）后，变量增加一。只要（循环条件）输出中的行数尚未达到十，循环体（显示一行文本）就会重复。一旦\
    \ count 变量变为十，条件（count < 10，也就是 10 < 10）将不再成立，循环将终止，计算机将继续执行循环之后的语句。\n\n### 自行探索\n\

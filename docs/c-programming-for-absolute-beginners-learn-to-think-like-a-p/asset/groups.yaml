    difference in the two displayed lines of Figure 7-3:


    +   - The Console.WriteLine method converts everything it gets into text. It does
    this silently using the ToString conversion behind the scenes.


    +   - If you join some text with a number using the plus sign, the number gets
    automatically converted to text in C#. If you desire greater control, always write
    down .ToString() in connection with numbers.



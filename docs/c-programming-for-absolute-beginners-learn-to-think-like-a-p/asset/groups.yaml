    # About the Author


    ![](img/32b055c352c70d22a656320349173d95_24_0.png)


    **Radek Vystavěl** started programming at a young age and has been doing it ever
    since, as well as sharing it with others. Having worked as both a programming
    teacher in college and privately as a programmer, Radek started writing books
    on programming because many of his students had no previous knowledge of programming,
    and he had difficulty finding a suitable textbook for them. Throughout the years,
    he has gained a unique insight into what resonates when teaching beginners.'
  - '[PAGE 25]


    # # About the Technical Reviewer


    ![](img/32b055c352c70d22a656320349173d95_25_0.png)



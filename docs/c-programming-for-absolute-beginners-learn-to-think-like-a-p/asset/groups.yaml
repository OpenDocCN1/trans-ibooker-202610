    # ### Remarks


    The console is an operating system window where users interact with the operating
    system or with a text-based console application by entering text input through
    the computer keyboard, and by reading text output from the computer terminal.
    For example, in the Windows operating system, the console is called the Command
    Prompt window and accepts MS-DOS commands. The Console class provides basic support
    for applications that read characters from, and write characters to, the console.


    For information about developing with the Console class, see the following sections:


    +   - Console I/O Streams

    +   - Screen Buffer and Console Window

    +   - Unicode Support for the Console

    +   - Common Operations

    +   - .NET Core Notes


    ![](img/32b055c352c70d22a656320349173d95_208_0.png)


    # ### Common Search


    To conclude this section about documentation, note that you can perform your searches
    outside of the Microsoft documentation site, too. Simply use your favorite web
    browser to search.


    However, contrary to a documentation site search, a common search displays irrelevant
    results more frequently. To compensate for this, you can refine your query using
    the programming language name, such as entering **Console class C#** in your favorite
    web browser’s search field.'

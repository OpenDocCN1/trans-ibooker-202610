    \nDateTime objects have more actions available than just converting a date into\
    \ text. Date arithmetic is especially important.\n\n**Task**\n\nYou will write\
    \ a program that displays tomorrow's date (see Figure 6-2).\n\n![](img/32b055c352c70d22a656320349173d95_98_0.png)\n\
    \nFigure 6-2. Displaying tomorrow's date\n\n**Solution**\n\nDateTime objects can\
    \ perform further interesting actions (methods), such as the following:\n\n- Using\
    \ `AddDays` for date arithmetic\n- Using `ToShortDateString` for displaying the\
    \ date in short form\n\nHere is the code:\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    // Today's date\n    DateTime today = DateTime.Today;\n\n    //\
    \ Tomorrow's date\n    DateTime tomorrow = today.AddDays(1);\n\n    // Output\n\
    \    Console.WriteLine(\"Today is \" + today.ToShortDateString() + \".\");\n \
    \   Console.WriteLine(\"I will start learning on \" + tomorrow.ToShortDateString()\
    \ + \".\");\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n###\
    \ Displaying a Specific Date\n\nLet’s continue with dates and see what a constructor\
    \ is.\n\n**Task**\n\nWhen working with dates, you do not have to always start\
    \ from today’s date. You can choose some specific date (see Figure 6-3).\n\n![](img/32b055c352c70d22a656320349173d95_99_0.png)\n\
    \nFigure 6-3. Starting with a specific date\n\n**Solution**\n\nYou can create\
    \ a DateTime object initialized with a specific date by calling an object’s constructor.\
    \ You enter the `new` keyword, type the name (i.e., DateTime), and use parentheses\
    \ with the possible parameters. In this case, the parameters are the year, month,\
    \ and day.\n\n```csharp\nstatic void Main(string[] args)\n{\n    // A specific\
    \ date\n    DateTime overlordDday = new DateTime(1944, 6, 6);\n\n    // Output\n\
    \    Console.WriteLine(\"D-Day (Overlord operation): \" +\n                  \
    \    overlordDday.ToLongDateString() + \".\");\n\n    // Waiting for Enter\n \
    \   Console.ReadLine();\n}\n```\n\n### Rolling a Single Die\n\nEnough dates. Now\
    \ you will learn how to work with chance or randomness.\n\n**Task**\n\nYou will\
    \ write a program that “throws” a die three times (see Figure 6-4).\n\n![](img/32b055c352c70d22a656320349173d95_100_0.png)\n\
    \nFigure 6-4. Rolling a die\n\n**Solution**\n\nTo work with chance, you need a\
    \ *random number generator*. In C#, you use the Random object for that purpose.\n\
    \nYou first create a Random object by calling its constructor **once** at the\
    \ beginning of the program run, and afterward you **repeatedly** call its method\
    \ called Next.\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Creating\
    \ random number generator object\n    Random randomNumbers = new Random();\n\n\
    \    // Repeatedly throwing a die\n    int number1 = randomNumbers.Next(1, 6 +\
    \ 1);\n    int number2 = randomNumbers.Next(1, 6 + 1);\n    int number3 = randomNumbers.Next(1,\
    \ 6 + 1);\n\n    // Output\n    Console.WriteLine(\"Thrown numbers: \" +\n   \
    \     number1 + \", \" +\n        number2 + \", \" +\n        number3);\n\n  \
    \  // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n**Note**\n\nThe Next\
    \ method (action) requires two parameters in parentheses:\n\n- The lower bound\
    \ of the interval of generated numbers\n- The upper bound **increased by 1** (I’m\
    \ sorry, but I was not the one who invented this strangeness)\n\n### Rolling Two\
    \ Dice\n\nStaying with the topic of random numbers, you will now see how to use\
    \ more than one random number series.\n\n**Task**\n\nYou will write a program\
    \ that throws a pair of dice three times (see Figure 6-5). I will show you the\
    \ right way to do this and the wrong way.\n\n![](img/32b055c352c70d22a656320349173d95_102_0.png)\n\
    \nFigure 6-5. Rolling dice three times\n\n**Solution**\n\nThe main message of\
    \ the solution is to use a single random number generator. If you had two of them\
    \ created practically at the same time, they would usually generate the same numbers!\
    \ Here is the code:\n\n```csharp\nstatic void Main(string[] args)\n{\n    // 1.\
    \ CORRECT SOLUTION\n    // Creating random number generator object\n    Random\
    \ randomNumbers = new Random();\n\n    // Repeatedly throwing two dice\n    int\
    \ correctNumber11 = randomNumbers.Next(1, 6 + 1);\n    int correctNumber12 = randomNumbers.Next(1,\
    \ 6 + 1);\n\n    int correctNumber21 = randomNumbers.Next(1, 6 + 1);\n    int\
    \ correctNumber22 = randomNumbers.Next(1, 6 + 1);\n\n    int correctNumber31 =\
    \ randomNumbers.Next(1, 6 + 1);\n    int correctNumber32 = randomNumbers.Next(1,\
    \ 6 + 1);\n\n    // Output\n    Console.WriteLine(\"CORRECTLY\");\n    Console.WriteLine(\"\
    Thrown couples: \" +\n        correctNumber11 + \"-\" + correctNumber12 + \",\
    \ \" +\n        correctNumber21 + \"-\" + correctNumber22 + \", \" +\n       \
    \ correctNumber31 + \"-\" + correctNumber32);\n\n    // 2. INCORRECT SOLUTION\n\
    \    // Two random number generators\n    Random randomNumbers1 = new Random();\n\
    \    Random randomNumbers2 = new Random();\n\n    // Repeatedly throwing two dice\n\
    \    int incorrectNumber11 = randomNumbers1.Next(1, 6 + 1);\n    int incorrectNumber12\
    \ = randomNumbers2.Next(1, 6 + 1);\n\n    int incorrectNumber21 = randomNumbers1.Next(1,\
    \ 6 + 1);\n    int incorrectNumber22 = randomNumbers2.Next(1, 6 + 1);\n\n    int\
    \ incorrectNumber31 = randomNumbers1.Next(1, 6 + 1);\n    int incorrectNumber32\
    \ = randomNumbers2.Next(1, 6 + 1);\n\n    // Output\n    Console.WriteLine();\
    \ // empty line\n    Console.WriteLine(\"INCORRECTLY\");\n    Console.WriteLine(\"\
    Thrown couples: \" +\n        incorrectNumber11 + \"-\" + incorrectNumber12 +\
    \ \", \" +\n        incorrectNumber21 + \"-\" + incorrectNumber22 + \", \" +\n\
    \        incorrectNumber31 + \"-\" + incorrectNumber32);\n\n    // Waiting for\
    \ Enter\n    Console.ReadLine();\n}\n```\n\n### Getting the Path to the Desktop\n\
    \nTo conclude the chapter, you will learn about the actions of yet another object.\n\
    \n**Task**\n\nWhen you work with files, you might want to create a file on the\
    \ user’s desktop. However, everybody has their own file system path to the desktop.\
    \ I will show you how to find that path (see Figure 6-6).\n\n![](img/32b055c352c70d22a656320349173d95_104_0.png)\n\
    \nFigure 6-6. Finding the path\n\n**Solution**\n\nYou can use your old friend,\
    \ the Environment object. Here is the code:\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    // Finding path to the desktop\n    string pathToDesktop = Environment.GetFolderPath(Environment.\n\
    \        SpecialFolder.Desktop);\n\n    // Output\n    Console.WriteLine(\"Path\
    \ to your desktop: \" + pathToDesktop);\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
    }\n```\n"
  mdcn: "\n## 第5章 使用对象\n\n- 你通过源代码开头的 using 行来表示你要使用特定的命名空间。\n- 如果不包含相应的 using 行，则必须完整限定类型的名称。这意味着你需要将命名空间名称和点放在类型名称之前。\n\

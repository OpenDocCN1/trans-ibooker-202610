    +   - In C#, the data type for text is `string`.

    +   - The data type for the whole numbers (integers) is `int`.

    +   - In programming, contrary to common usage, care must be taken to distinguish
    between whole and decimal numbers.

    +   - The data type for decimal numbers is `double`.

    +   - There is a special data type called `bool` for storing so-called logical
    values true and false, which are computer equivalents of “yes” and “no.”'

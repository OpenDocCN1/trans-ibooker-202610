- pgno: 359
  md: '# Infinite Series


    The series to be summed is infinite, but you may wonder how to sum an infinite
    number of numbers.


    You cannot do this, of course. The trick is that you actually do not need to sum
    an infinite number of members of the series. At a certain point, they become so
    small that their contribution is somewhere far behind the decimal point.


    For practical reasons, you need only a definite precision, say 15 decimal places;
    the double type does not accommodate more places anyway. You will thus be calculating
    the sum as long as the series members are greater than one on the 15th place after
    the decimal point.


    # Series Members


    All the series members are similar to one another. They have an odd power up,
    odd factorial down, and a changing sign.


    To remind you, 7! = 1 × 2 × 3 × ... × 7. In other words, the factorial is the
    product of all the numbers from one to the number given.


    # Factorial


    It is possible to calculate the factorial in a way similar to how you calculated
    the power earlier in this chapter, in other words, progressively multiplying all
    the numbers in a loop.


    However, you can do it in a smarter way. You do not need to calculate every factorial
    from scratch. You can always get it much faster from the previously calculated
    one.


    For example, 7! = 7 × 6 × 5!. The factorial of 7 can be calculated from the factorial
    of 5 by multiplying by “missing numbers” 6 and 7.


    # Power


    A similar trick can be used to calculate the “power part” of each series member.
    The power does not have to be calculated from scratch. The next power is simply
    the previous power times x squared.


    For example, x⁷ = x⁵ × x².'
  merge: -1
  img_proc: true

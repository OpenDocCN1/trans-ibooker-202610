  md: '# Visual Studio 2019 System Requirements


    The following products support the minimum system requirements below:


    | Supported Operating Systems | Visual Studio 2019 will install and run on the
    following operating systems (64 bit recommended; ARM is not supported):\n|---|---|\n|  |
    • Windows 10 version 1703 or higher: Home, Professional, Education, and Enterprise
    (LTSC and S are not supported)\n• Windows Server 2019: Standard and Datacenter\n•
    Windows Server 2016: Standard and Datacenter\n• Windows 8.1 (with Update 2919355):
    Core, Professional, and Enterprise\n• Windows Server 2012 R2 (with Update 2919355):
    Essentials, Standard, Datacenter\n• Windows 7 SP1 (with latest Windows Updates):
    Home Premium, Professional, Enterprise, Ultimate |


    **Figure 1-2.** *Windows versions supported*


    As you can see, you do not need to have the latest and greatest version of Windows.
    As of January 2021, you can even have Windows 7 with Service Pack 1 installed.
    Also, to work with the book, you do not even need the latest Visual Studio version.
    Almost all the examples in the book will run on older versions perfectly well.


    # Non-Windows Operating Systems


    If you do not have the Windows operating system on your computer, you will be
    happy to hear about the Visual Studio Code development environment. This is a
    free-of-charge, multiplatform IDE running also on Linux or Mac, allowing you to
    program in C# on these systems.


    In this book’s examples, I will use Visual Studio Community installed on Windows.
    I recommend you do the same. If this is not feasible for you, use Visual Studio
    Code, taking into account that some things might be a little different from what
    you see in the book.'

- pgno: 237
  md: '+   - Testing the equality of two pieces of text or two numbers with the ==
    operator

    +   - Testing the inequality of two pieces of text or two numbers with the !=
    operator

    +   - Testing whether a number is greater (or less) than another number with the
    > (or <) operator


    The last test can be extended to “greater than or equal to” (or “less than or
    equal to”) with the >= (or <=) operator.


    To use conditional execution in your code, you learned about the if-else construct.
    This consists of a condition and two branches. If the condition is evaluated to
    be true (fulfilled), the statements in the if branch are executed. If the condition
    is evaluated to be false (not fulfilled), the statements in the else branch are
    executed.


    You learned that if a branch consists of a single statement, C# syntax allows
    you to omit the braces surrounding the branch, though I discourage you from doing
    that because people frequently forget to include the braces later when they extend
    a branch to several statements.


    More important, you learned that the else branch can be omitted if you want. This
    means there is no alternative action—nothing is done when the condition is not
    fulfilled.


    As a bonus, you learned about the useful built-in function Math.Max. (You can
    probably guess that there is a similar function called Math.Min.)'

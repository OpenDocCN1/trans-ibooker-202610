    # Discussion


    You may feel confused about the variety of numeric data types. To help you understand
    them, here is a summary of when you should use each one:


    +   - **int**: For regular work with values that are intrinsically integers (e.g.,
    counts of something).

    +   - **double**: For regular work with values that may be decimal (e.g., measured
    values) or values you do math with. Money amounts are also mostly OK.

    +   - **byte**: For work with binary data.

    +   - **long**: For big integer values such as file sizes, payment identifications
    (e.g., ten digits may be required), or multiplication results of regular (whole)
    values.

    +   - **decimal**: A common choice for money amounts.


    The other types are not used that often.


    # Overflow


    When the program calculates a value that does not “fit” into an appropriate type’s
    range, what happens is called *overflow*. The behavior of your program can be
    very strange, as shown in Figure 12-3.'

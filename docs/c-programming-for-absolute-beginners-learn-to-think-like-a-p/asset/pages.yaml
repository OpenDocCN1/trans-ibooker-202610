  md: "# Task\n\nYou will now solve this task in a new way; specifically, you will\
    \ store the calculation result in the same variable where you originally stored\
    \ the entered number.\n\nThis is not necessarily a better solution, but you will\
    \ learn how to build upon it further in later sections.\n\n# Solution\n\nHere\
    \ is the code:\n\n```\nstatic void Main(string[] args)\n{\n    // Input\n    Console.Write(\"\
    Enter a number: \");\n    string input = Console.ReadLine();\n    int number =\
    \ Convert.ToInt32(input);\n\n    // Calculation\n    number = number + 10;\n\n\
    \    // Result output\n    Console.WriteLine(\"Number ten more greater is: \"\
    \ + number);\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n\
    # Discussion\n\nThe core statement of the solution is as follows: number = number\
    \ + 10;. This statement is unusual in the sense that the same thing—the variable\
    \ number—appears on both sides of the equal sign!\n\nThe computer executes the\
    \ statement like this: “Take the present value of the variable number, add ten\
    \ to it, and store the result as the new value of the variable number.” Thus,\
    \ the net result of the statement is augmenting number’s value by ten."

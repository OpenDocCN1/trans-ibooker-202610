- pgno: 212
  md: '# Using a Breakpoint


    If your program is still running from the previous exercise, terminate it by using
    the Shift+F5 key combination. Now launch the program the regular way, in other
    words, using the F5 key. It will run normally, and it will stop when it reaches
    the breakpoint. Visual Studio pops up in front of the program’s window.


    After that, you can step through the code or just look at something and use the
    F5 key to run your program further until its end or until the next breakpoint.


    # Removing a Breakpoint


    To remove a breakpoint that you do not need any longer, press F9 again on a particular
    line, or right-click and choose Breakpoint ➤ Delete Breakpoint from the context
    menu.


    # Memory Inspection


    Whenever your program is suspended (from a breakpoint, stepping, and so on), you
    can inspect the memory that is available to your program and explore the values
    of individual variables.


    To facilitate memory inspection, Visual Studio shows the Autos, Locals, and Watch
    panes at the bottom of its window. If those panes are not there, you can display
    them using the Debug ➤ Windows menu.


    While the Autos and Locals panes automatically select the variables to display,
    the Watch pane is populated manually according to what you want to see. You can
    enter a particular variable’s name in the pane, or you can right-click the variable
    in the code and select Add Watch from the context menu (see Figure 14–13).'

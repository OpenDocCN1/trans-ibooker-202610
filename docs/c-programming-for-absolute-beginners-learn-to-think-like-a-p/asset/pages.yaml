  md: '# CHAPTER 9    NUMBERS


    On various computing platforms, you will do integer division differently from
    “normal” division. Unfortunately, in C#, you use the same operator, the slash
    (/), for both types. It works like this:


    +   - If you put a slash between two values of the int type, the slash performs
    integer division.

    +   - If at least one of the two values is of double type, the slash performs
    “normal” division.


    This behavior may be the source of ugly, difficult-to-find errors. The behavior
    is 45 years old and stems from when the C language was created; unfortunately,
    several newer languages, such as C#, inherited the behavior. Just be aware of
    it and be careful when using a slash.


    # Task



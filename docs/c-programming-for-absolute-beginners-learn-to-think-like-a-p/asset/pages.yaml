- pgno: 45
  md: "The source code of Program.cs now looks like this:\n\n```\nusing System;\n\n\
    namespace My_first_program\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            // Output of text to the user\n            Console.WriteLine(\"\
    I am starting to program in C#.\");\n\n            // Waiting for Enter\n    \
    \        Console.ReadLine();\n        }\n    }\n}\n```\n\n# Understanding Your\
    \ First Statements\n\nWhat do these statements do?\n\n+   - Console.WriteLine\
    \ outputs (writes) a single line to the user.\n+   - Console.ReadLine, in general,\
    \ reads a line of text that the user enters with the keyboard. In this case, however,\
    \ the purpose of the statement is to make your program wait for the user to press\
    \ Enter when everything is done. In other words, you do not want the program window\
    \ to disappear immediately.\n+   - Everything following the two slashes (//) until\
    \ the end of a corresponding line is ignored. This text contains your remarks/comments.\
    \ Visual Studio colors them in green."

- pgno: 61
  md: 'But, again, this is the last time you will see the whole source code. There
    is no need to repeat the Visual Studio–generated code each time I show an example
    because you will never change it. If you are ever in doubt, you can consult the
    complete sample projects accompanying the book.


    After typing in the code, launch the program using the F5 key. To terminate the
    program, press Enter.


    # Discussion



  md: '# CHAPTER 23


    # # Unknown Number

    # of Repetitions


    In all the loops you have solved so far, you knew the number of iterations. Sometimes,
    you do not know it when writing a program, simply because the user is supposed
    to enter it. However, in all the cases, when a loop started, it had already been
    determined how many times it would iterate.


    Sometimes, the number of repetitions is not known at the moment a loop starts
    executing. Frequently, you will be concerned with the question of whether a loop
    should go on or terminate.


    # ## Entering a Password


    The first task concerns logging in. You do not know in advance how many attempts
    the user will need.


    # ## Task


    You will repeatedly ask the user to enter a password until the user enters the
    correct one (see Figure 23-1). The correct password will be *friend*.'

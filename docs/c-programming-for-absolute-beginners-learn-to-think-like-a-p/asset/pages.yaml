- pgno: 363
  md: 'As soon as the height decreases below zero, the module has landed. The program
    notifies the user on the landing velocity and performs the evaluation according
    to the following table:


    | Landing Velocity | Evaluation |

    |---|---|

    | Less than 4 m/s | Soft landing |

    | 4–8 m/s | Hard landing |

    | Greater than 8 m/s | † |


    If all the fuel is consumed before the landing is over, the program starts ignoring
    the entered braking values, and the braking force is set to zero.


    # Physical Model


    The program will be based on the model of reality discussed here.

    Here are the initial values:


    +   - $h = 50$ (m)

    +   - $v = 8$ (m/s)

    +   - $m_F = 35$ (kg)


    In each step representing one second of the landing maneuver, the values of the
    tracked physical quantities will change according to the following relations (means
    the change of the corresponding quantity, as is usual in physics):


    $h = -v - a/2$


    $v = a$


    $m_F = -F / 3000$


    where


    +   - The braking force is $F = 360 \times \textit{percent of braking}$.

    +   - The acceleration toward the surface is $a = 1.62 - F / 8000$.'

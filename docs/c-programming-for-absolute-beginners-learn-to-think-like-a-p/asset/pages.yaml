    is because I have not specified any localization in the output statements, and
    my Windows settings are currently set to American English. Both tests show that
    decimal input may betray you if you are not careful enough. Just to remind you,
    if you enter a decimal number directly in your C# source code, you should always
    use a decimal point regardless of your settings.'

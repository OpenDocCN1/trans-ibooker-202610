  md: "# Solution\n\nThe core of the solution is to determine the remainder of dividing\
    \ the entered number by two. If the remainder is zero, the number is even. If\
    \ there is some remainder, the number is odd.\n\nHere is the code:\n\n```\nstatic\
    \ void Main(string[] args)\n{\n    // Input\n    Console.Write(\"Enter a number:\
    \ \");\n    string input = Console.ReadLine();\n    int number = Convert.ToInt32(input);\n\
    \n    // Remainder calculation\n    int remainderAfterDivisionByTwo = number %\
    \ 2;\n\n    // Evaluation\n    if (remainderAfterDivisionByTwo == 0)\n    {\n\
    \        Console.WriteLine(\"The number is even\");\n    }\n    else\n    {\n\
    \        Console.WriteLine(\"The number is odd\");\n    }\n\n    // Waiting for\
    \ Enter\n    Console.ReadLine();\n}\n```\n\n# Case Indifference\n\nYou already\
    \ know that two pieces of text can be compared to see if they are equal or unequal.\
    \ This comparison is case sensitive. In other words, hobbit and Hobbit are considered\
    \ different words. Frequently, however, you need case-insensitive comparisons,\
    \ which I will show you now."

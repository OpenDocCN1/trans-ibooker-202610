    # Progressive Summation


    Progressive summation is an important principle of summing a large number of values.
    It means summing them not all at once in a single statement but summing them one
    by one, progressively accumulating intermediate results in a special variable.


    # Task


    You will write a program that progressively sums three entered numbers. Sure,
    summing three numbers would be more conveniently done at once in a single line.
    However, I want to illustrate the important principle of progressive summation
    on a simple example and get you used to the idea before covering a more complex
    topic, namely, loops (see Figure 13-5).


    ![](img/32b055c352c70d22a656320349173d95_193_0.png)


    ***Figure 13-5.*** *Progressively summing three entered numbers*'

  md: '# First Alternative


    The first calculation correctly reports a problem. Omitting the try-catch construct
    would cause a runtime error, but at least it does not display an incorrect result.


    # Other Alternatives


    A correct calculation converts the million into a long type *before* the calculation
    starts.

    Here are two ways to perform this conversion:


    +   - Assigning the million to a variable of type `long`

    +   - Using an explicit *type cast* with `(long)million`


    If you do not require precise integer arithmetic, you might also calculate in
    the double type. Unless you solve some very exotic math, double does not have
    a chance to overflow.


    # Summary


    In this chapter, you studied advanced number calculations. You got to know all
    the numeric data types that are available in C#. The types differ in whether they
    allow integers or decimals, and they differ also in the ranges of allowed values.
    Types for decimals mutually differ also in the precision with which the number
    is stored.


    At the beginner’s level, knowledge of `int` and `double` is enough; you can always
    work using them only. When you become more experienced, you might also use the
    following:


    +   - The long type for big integers such as file sizes, ten-digit payment numbers,
    or multiplication results of moderately sized numbers

    +   - The decimal type for working with currency

    +   - The byte type for working with binary data


    You also studied the question of overflow. When a calculated value is too big
    to fit into the range of a particular data type, nonsense results. The default
    behavior of Visual Studio is to continue as normally. However, now you know how
    to change the settings to cause a runtime error at least, because continuing with
    the incorrect result is the worst alternative.'

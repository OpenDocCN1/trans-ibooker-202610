  md: '# CHAPTER 14


    # Essential Tools


    You have already completed two parts of this book. In the next two parts, you
    will learn about more complicated topics, such as dealing with conditions and
    loops. So that you properly understand these topics, in this chapter I will cover
    some tools that can be of great help to you in your programming.


    # IntelliSense


    You know the first tool I will cover: Visual Studio IntelliSense. Whenever you
    start typing anything, Visual Studio immediately offers you options for completing
    the text. When you choose one of the options, the development environment shows
    you further details about the option in a tooltip—what the option does, what parameters
    it requires, and so on.


    I am covering IntelliSense in this chapter because it is often underused by beginning
    programmers. I recommend you get used to completing virtually every word you type
    using IntelliSense. You will spare yourself of a huge number of typos.


    # Exploring the Possibilities


    Using IntelliSense is also a way to explore all the possibilities that every contemporary
    computing platform offers.


    In former days, you had to study the possibilities in manuals or books. Some of
    them were capable enough to cover almost all the questions a programmer had. Today,
    however, there are so many possibilities that even a 1000-page book cannot show
    them all.


    You still need books (definitely this one!) to give you reliable and systematic
    instruction so you can understand the principles, but you will probably want to
    explore further possibilities not mentioned there. IntelliSense is a tool that
    can show you many of them.'

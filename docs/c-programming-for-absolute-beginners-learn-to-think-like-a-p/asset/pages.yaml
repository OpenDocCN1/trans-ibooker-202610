  md: '# Summary


    In this chapter, you studied several examples of advanced conditions.


    You started with the so-called conditional operator (`?:`), which is also called
    a ternary operator because it works with three values. Depending on the fulfillment
    of the specified condition (the first value, before the question mark), the operator’s
    “work” results in either *yesValue* (the second value, between the question mark
    and the colon) or *noValue* (the third value, after the colon). The conditional
    operator is a suitable shortcut replacement for certain types of if-else situations.


    The middle task of summary evaluation was a kind of recap of all the things you
    learned about conditional execution. There you have met various tests and many
    compound conditions, as well as negation with the `!` operator.


    The final task of testing the second character of some text has shown you the
    importance of testing that the second character exists at all before you explore
    what it is. There you used the short-circuit evaluation of conditions. If the
    result of a compound condition can be decided already after the first partial
    condition is evaluated, then the second partial condition is skipped altogether.'

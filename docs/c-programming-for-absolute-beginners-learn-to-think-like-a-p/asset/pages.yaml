    # Beware of Integer Division!


    When calculating the grade average, you divide the sum by the value of 4.0, not
    by the value of 4. You do not want the computer to consider the slash as an integer
    division operator. That is why you are avoiding the division of int by int.


    If you entered just 4, then the case of 1, 2, 2, 2 grades would be mistakenly
    evaluated as Excellent since the average would be calculated to a precise 1 instead
    of the correct 1.75!


    # Decimal Arithmetic


    Why did you enter the check of the average as follows?


    ```

    average < 1.5001

    ```


    Why didn’t you use the following?


    ```

    average <= 1.5

    ```


    It was because decimal arithmetic does not have to be precise. Sometimes, it is
    possible that the computer calculates something like 1.50000000001 instead of
    the correct 1.5. That is why you use a little bit greater number in the test.


    # Second Character Test


    Many programs crash because a programmer forgets to test that something exists
    before accessing it. This task will be your first acquaintance with this frequent
    issue.


    # Task


    I will show you how to test the second character of the entered text. Let’s say
    a product label has to always have a capital X in the second position (see Figures
    19-3 and 19-4).'

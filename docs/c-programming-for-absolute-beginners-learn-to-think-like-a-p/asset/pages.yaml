  md: '# CHAPTER 11　CALCULATIONS WITH DATES


    # Analysis


    The key to this task is to determine the quarter’s number. From that, the quarter’s
    first month follows.


    # Quarter’s Number


    You need to transform the month number into the quarter’s number like this:


    +   - Month 1, 2, or 3 = 1

    +   - Month 4, 5, or 6 = 2

    +   - Month 7, 8, or 9 = 3

    +   - Month 10, 11, or 12 = 4


    This is a beautiful case of integer division use. You can see that you need to
    add two to the month number first and perform integer division by three after
    that:


    ```

    int numberOfQuarter = (enteredMonth + 2) / 3;

    ```


    # Quarter’s First Month Number


    If you already have the quarter’s number, you get the quarter’s first month like
    this:


    +   - 1 (January) for the first quarter

    +   - 4 (April) for the second quarter

    +   - 7 (July) for the third quarter

    +   - 10 (October) for the fourth quarter


    You may realize that the quarter’s number must be multiplied by three. To get
    the correct results, you need to subtract two subsequently:


    ```

    int monthOfQuarterStart = 3 * numberOfQuarter - 2;

    ```


    # First and Last Days


    Having the first month available, you can proceed in steps similar to the previous
    exercise. To get the first day, you use the DateTime constructor with the day
    number set to one. To get the last day, you add three months and subtract one
    day.'

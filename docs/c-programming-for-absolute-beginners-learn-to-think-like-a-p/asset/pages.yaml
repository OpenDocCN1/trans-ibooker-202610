    The using line is quite important, isn’t it? I am going to explain why next.


    # Namespaces


    Almost everything in C# belongs to some hierarchically higher unit. In this case,
    both DateTime and Console belong to the System *namespace*. If you want to use
    them, you have to declare the corresponding namespace with a using line at the
    top of your source code. Otherwise, Visual Studio does not understand them.


    Why are there things like namespaces? What do you need them for? Well, there are
    not an infinite number of names for objects, so you need to specify which one
    you are using. For example, you do not need to use the DateTime class just from
    Microsoft; you could program your own DateTime, or you could buy some wonderful
    DateTime from another programmer. That is why you need a way to distinguish among
    them. This way is through *namespaces*.'

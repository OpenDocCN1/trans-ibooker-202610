    # Discussion


    The most interesting point of this exercise is the way you enter the formula in
    code. Note that the numerator and the denominator have to be enclosed in parentheses
    to ascertain the correct order of calculations! The mathematical formula does
    not contain them because mathematicians use fractions.


    When calculating the discriminant, I do not use parentheses; I just rely on the
    precedence of multiplication to subtraction.


    # Test


    To check that the program calculates correctly, you can write further code as
    a test; the left side should become zero after substituting the solution for *x*.


    # Summary


    In this chapter, you saw several examples of using more than one condition to
    do the task assigned.


    First, you solved a soccer match evaluation in two alternative ways. The first
    one considered the individual possibilities one after another using three simple
    if statements. The second one used a branch nested inside another branch.


    You further exercised multiple conditions in a row one after another to find the
    smallest of three numbers. To do this, you stored a “minimum-so-far” value in
    a helper variable.


    The same task was then solved using the built-in function `Math.Min`. You already
    know that the function determines the minimum of two values. Here, I showed you
    an interesting case of how you can use it for three numbers.


    In the final two tasks, you practiced multiple conditions in examples from mathematics,
    namely, solving linear and quadratic equations. The last task gave you the opportunity
    to see a bit more complex calculation written in code.'

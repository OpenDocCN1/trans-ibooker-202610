    \ void Main(string[] args)\n{\n    string correctPassword = \"friend\";\n\n  \
    \  bool ok; // the variable must be declared outside of the loop!\n    do\n  \
    \  {\n        // Input\n        Console.Write(\"Enter password: \");\n       \
    \ string enteredPassword = Console.ReadLine();\n\n        // Evaluating\n    \

  md: "# Solution\n\nIn Visual Studio, create a new project called Numeric Output.\
    \ The code is similar to the previous program you wrote in Chapter 2, as shown\
    \ here:\n\n```\nstatic void Main(string[] args)\n{\n    // Output of a number\
    \ to the user\n    Console.WriteLine(37);\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
    }\n```\n\n> **Note**  In this example, and all the following examples in the book,\
    \ I show you just the block of code after the line with the `Main` word. This\
    \ is the block of code you are in control of; in other words, it’s the block of\
    \ code you change. The rest of the `Program.cs` source code should remain intact\
    \ the same way you left it in your first program from the previous chapter.\n\n\
    To be sure you understand me, the whole source code looks like this:\n\n```\n\
    using System;\n\nnamespace Numeric_output\n{\n    class Program\n    {\n     \
    \   static void Main(string[] args)\n        {\n            // Output of a number\
    \ to the user\n            Console.WriteLine(37);\n\n            // Waiting for\
    \ Enter\n            Console.ReadLine();\n        }\n    }\n}\n```"

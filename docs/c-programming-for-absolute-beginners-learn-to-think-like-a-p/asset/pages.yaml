    To conclude this section about documentation, note that you can perform your searches
    outside of the Microsoft documentation site, too. Simply use your favorite web
    browser to search.


    However, contrary to a documentation site search, a common search displays irrelevant
    results more frequently. To compensate for this, you can refine your query using
    the programming language name, such as entering **Console class C#** in your favorite

  \ 运算符变成了 AND 运算符，也使相等变成了不相等。\n\n### 成绩检查\n\n现在我想让你关注一个常见的问题：检查一个数字是否属于指定的集合或指定的范围。接下来的两个任务都与这有关。\n\
  \n### 任务\n\n用户输入一个学生的成绩。程序随后会检查输入的数字是否在可能的值 1、2、3、4 或 5 的集合中（见图17-5和图17-6）。\n\n\
  ![](img/32b055c352c70d22a656320349173d95_262_0.png)\n\n*图17-5.* 在范围内\n\n![](img/32b055c352c70d22a656320349173d95_262_1.png)\n\
  \n*图17-6.* 不在范围内\n\n### 解决方案\n\n该条件可以逐一列举各个备选值来构造。为简单起见，我不检查可能出现的非数值输入。你可以像往常一样使用\
  \ try-catch 自己处理这一点。\n\n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n\
  \    // Input\n    Console.Write(\"Enter a grade: \");\n    string input = Console.ReadLine();\n\
  \    int grade = Convert.ToInt32(input);\n\n    // Evaluating\n    if (grade ==\
  \ 1 ||\n        grade == 2 ||\n        grade == 3 ||\n        grade == 4 ||\n  \
  \      grade == 5)\n    {\n        Console.WriteLine(\"Input OK.\");\n    }\n  \
  \  else\n    {\n        Console.WriteLine(\"Incorrect input.\");\n    }\n\n    //\
  \ Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n### 更好的范围检查\n\n允许的数字（可能的成绩）实际上构成了一到五的范围（一个没有间断的连续范围）。在这种情况下，你可以用一种更好的方式来检查一个数字是否属于特定范围。\n\
  \n### 任务\n\n任务是用范围检查来解决前面的练习。\n\n### 解决方案\n\n当一个数字大于或等于下界，且同时小于或等于上界时，它就属于由下界和上界给出的范围。\n\
  \n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Input\n    Console.Write(\"\
  Enter a grade: \");\n    string input = Console.ReadLine();\n    int grade = Convert.ToInt32(input);\n\
  \n    // Evaluating\n    if (grade >= 1 && grade <= 5)\n    {\n        Console.WriteLine(\"\
  Input OK.\");\n    }\n    else\n    {\n        Console.WriteLine(\"Incorrect input.\"\
  );\n    }\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n### 小结\n\
  \n本章向你介绍了复合条件这一主题。你学会了如何使用条件与运算符和条件或运算符，将多个部分条件连接起来，构成 if 语句中的复合条件。\n\n在 C# 中，AND\
  \ 运算符写作 &&，当两个部分条件都满足时，它的计算结果为 true。另一方面，OR 运算符写作 ||，当至少一个部分条件满足时，它的计算结果为 true。\n\
  \n你还看到了将更多数量部分条件组合成一个条件的情况。在这种情况下，运算符优先级的问题就很重要。在没有括号的情况下，AND 总是在 OR 之前被求值。但请注意，这样的条件可能会变得相当复杂且难以阅读。建议提前分别计算整个条件的各个部分，并将其临时存储在\
  \ bool 类型的变量中。\n\n\n\n\n\n# 第 17 章 复合条件\n\n我还曾试图让你注意复合条件取反的问题，这需要格外小心和专注才能做对。具体来说，你学到了：取反时，AND\
  \ 会变成 OR（反之亦然），等号会变成不等号（反之亦然）。\n\n最后，我向你展示了如何检查一个数字是属于某个指定集合还是属于某个指定范围。在后一种情况下，你要同时针对范围的下界和上界进行测试。\n\

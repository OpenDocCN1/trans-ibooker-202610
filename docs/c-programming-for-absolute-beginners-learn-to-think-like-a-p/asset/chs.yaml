  \ 判断奇数\n\n### 解决方案\n\n解决方案的核心是确定输入数字除以二的余数。如果余数为零，则该数字是偶数。如果存在余数，则该数字是奇数。\n\n代码如下：\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    // Input\n    Console.Write(\"\

  Basic decimal numbers\");\nConsole.WriteLine(\"---------------------\");\nConsole.WriteLine(\"\
  float:  \" + float.MinValue + \" to \" + float.MaxValue);\nConsole.WriteLine(\"\
  double: \" + double.MinValue + \" to \" + double.MaxValue);\nConsole.WriteLine();\n\
  \nConsole.WriteLine(\"Exact decimal numbers\");\nConsole.WriteLine(\"---------------------\"\
  );\nConsole.WriteLine(\"decimal: \" + decimal.MinValue + \" to \" + decimal.MaxValue);\n\

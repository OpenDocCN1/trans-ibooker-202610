  \ + greater);\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n###\
  \ 使用内置函数\n\n在本书中，我经常从不同角度向你展示内容。我坚信这能加深你的理解。对于当前“找出两个数中较大值”的问题，我将向你展示第三种解决方法。事实上，这项任务非常常见，因此\
  \ C# 提供了一个方便的内置函数。\n\n### 任务\n\n你将使用内置函数`Math.Max`来解决之前的练习。\n\n### 解决方案\n\n代码如下：\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    // Inputs\n    Console.Write(\"\
  Enter first number: \");\n    string input1 = Console.ReadLine();\n    int number1\
  \ = Convert.ToInt32(input1);\n\n    Console.Write(\"Enter second number: \");\n\
  \    string input2 = Console.ReadLine();\n    int number2 = Convert.ToInt32(input2);\n\
  \n    // Evaluating\n    int greater = Math.Max(number1, number2);\n\n    // Output\n\
  \    Console.WriteLine(\"Greater of entered numbers is: \" + greater);\n\n    //\
  \ Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n### 小结\n\n在本章中，你开始学习程序语句的条件执行，这意味着一条或多条语句是否执行可以由某个测试来决定。你看到了以下测试示例：\n\
  \n- 使用`==`运算符测试两段文本或两个数字是否相等\n- 使用`!=`运算符测试两段文本或两个数字是否不相等\n- 使用`>`（或`<`）运算符测试一个数字是否大于（或小于）另一个数字\n\
  \n最后一个测试还可以使用`>=`（或`<=`）运算符扩展为“大于或等于”（或“小于或等于”）。\n\n为了在代码中使用条件执行，你学习了if-else结构。它由一个条件和两个分支组成。如果条件被判定为真（满足），则执行if分支中的语句；如果条件被判定为假（不满足），则执行else分支中的语句。\n\
  \n你了解到，如果某个分支只包含一条语句，C#语法允许你省略包围该分支的大括号，但我不建议你这样做，因为人们在之后将分支扩展为多条语句时，常常会忘记补上大括号。\n\
  \n更重要的是，你了解到else分支可以根据需要省略。这意味着没有备选操作——当条件不满足时，什么都不做。\n\n作为额外收获，你了解了实用的内置函数Math.Max。（你大概能猜到还有一个类似的函数叫Math.Min。）\n"
- "## 第16章：实用条件语句\n\n在上一章中，你学习了程序语句的条件执行。在本章中，你将加深对这一主题的理解。我将向你展示如何在几个简单的任务中使用条件和分支，这些任务在你未来的编程生涯中迟早会遇到。\n\
  \n### 追加扩展名\n\n有时，你想向用户询问文件名，但你不知道用户输入时是否带扩展名。\n\n### 任务\n\n你将编写一个程序，为输入的文件名追加.png扩展名，除非该扩展名已经是输入的一部分（见图16-1和图16-2）。\n\
  \n![](img/32b055c352c70d22a656320349173d95_238_0.png)\n\n**图16-1.** *追加.png扩展名*\n\
  \n![](img/32b055c352c70d22a656320349173d95_239_0.png)\n\n**图16-2.** *不追加.png扩展名*\n\
  \n### 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Input\n\
  \    Console.Write(\"Enter image name: \");\n    string fileName = Console.ReadLine();\n\
  \n    // Appending extension (ONLY IN CASE OF NEED)\n    if (!fileName.ToLower().EndsWith(\"\
  .png\"))\n    {\n        fileName += \".png\";\n    }\n\n    // Output\n    Console.WriteLine(\"\
  We are going to use name: \" + fileName);\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
  }\n```\n\n### 讨论\n\n让我们稍微讨论一下这个程序。\n\n### 链式调用\n\n请注意ToLower和EndsWith方法的*链式调用*。小写转换的输出并没有存储到任何变量中，而是作为链中下一个方法（即EndsWith）的输入。\n\
  \n### 正面与反面\n\n我们再做一些与条件相关的练习。\n\n### 任务\n\n你将编写一个程序，抛一次硬币（见图16-3）。\n\n![](img/32b055c352c70d22a656320349173d95_241_0.png)\n\
  \n**图16-3.** *抛硬币*\n\n### 解决方案\n\n解决方案的核心是生成一个随机数——0或1——然后将其转换为正面或反面。\n\n代码如下：\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    // Random number generator\n\
  \    Random randomNumbers = new Random();\n\n    // Random number 0/1 and its transformation\n\
  \    int randomNumber = randomNumbers.Next(0, 1 + 1);\n\n    if (randomNumber ==\
  \ 0)\n    {\n        Console.WriteLine(\"Head tossed\");\n    }\n    else\n    {\n\
  \        Console.WriteLine(\"Tail tossed\");\n    }\n\n    // Waiting for Enter\n\
  \    Console.ReadLine();\n}\n```\n\n### 讨论\n\n我只想提醒你，Next方法要求随机数范围的上限在指定时已经加1。这就是为什么你在前面的程序中写了1+1。当然，你也可以直接写2，但1+1在我看来更符合逻辑：将1作为上限，再加上（有点奇怪的）必需的1。\n\
  \n### 截止日期检查\n\n俗话说：“永远不要相信用户。”这意味着作为程序员，你在生产软件中必须始终检查用户输入的数据。\n\n你通常需要检查用户数据，并不是因为恶意使用，因为99.9%的用户都没有滥用你软件的意图。用户只是会犯错。这就是为什么你应该检查他们的输入并提示他们更正。\n\
  \n所以，现在你将学习如何实现一些输入检查。\n\n### 任务\n\n你将编写一个程序，提示用户输入订单截止日期，如果用户输入的日期是过去的日期，则显示警告（见图16-4）。\n\
  \n\n\n\n\n![](img/32b055c352c70d22a656320349173d95_243_0.png)\n\n*图 16-4.* 检查日期。\n\
  \n## 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Input\n\
  \    Console.Write(\"Enter order deadline: \");\n    string input = Console.ReadLine();\n\
  \    DateTime enteredDeadline = Convert.ToDateTime(input);\n\n    // Checking entered\
  \ value\n    DateTime today = DateTime.Today;\n    if (enteredDeadline < today)\n\
  \    {\n        Console.WriteLine(\"Error! You have entered date in the past.\"\
  );\n    }\n    else\n    {\n        Console.WriteLine(\"Deadline accepted.\");\n\
  \    }\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n## 讨论\n\n\
  请注意以下几点：\n\n- 要将文本形式输入的日期转换为 `DateTime` 对象，需要使用 `Convert.ToDateTime` 方法调用。\n- 如果输入了不存在的日期，转换会失败。你可以使用\
  \ `try-catch` 来处理这种情况。\n- 与数字转换类似，`Convert.ToDateTime` 可以接受第二个参数，用于指定转换所用的语言。\n\n\
  ## 发票日期检查\n\n我们再做一个检查用户输入数据的练习。\n\n### 任务\n\n我国增值税法规要求，发票开具日期不能早于付款日期，同时也不能晚于付款日期后\
  \ 15 天。\n\n当前任务是执行这两项检查（见图 16-5、16-6 和 16-7）。\n\n![](img/32b055c352c70d22a656320349173d95_244_0.png)\n\
  \n*图 16-5.* 日期过早\n\n![](img/32b055c352c70d22a656320349173d95_245_0.png)\n\n*图 16-6.*\
  \ 日期过晚\n\n![](img/32b055c352c70d22a656320349173d95_245_1.png)\n\n*图 16-7.* 日期均被接受\n\
  \n### 解决方案\n\n解决方案如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Inputs\n\
  \    Console.Write(\"Payment date: \");\n    string inputPayment = Console.ReadLine();\n\
  \    DateTime paymentDate = Convert.ToDateTime(inputPayment);\n\n    Console.Write(\"\
  Invoice date: \");\n    string inputInvoice = Console.ReadLine();\n    DateTime\
  \ invoiceDate = Convert.ToDateTime(inputInvoice);\n\n    // Checking\n    bool ok\
  \ = true;\n    if (invoiceDate < paymentDate)\n    {\n        Console.WriteLine(\"\
  Invoice date cannot precede payment date.\");\n        ok = false;\n    }\n    if\
  \ (invoiceDate > paymentDate.AddDays(15))\n    {\n        Console.WriteLine(\"Invoice\
  \ cannot be issued later than 15 days\\nafter payment.\");\n        ok = false;\n\
  \    }\n    if (ok)\n    {\n        Console.WriteLine(\"Dates accepted.\");\n  \
  \  }\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n### 讨论\n\n\
  在这个解决方案中，你使用了一个名为 `ok` 的辅助变量。该变量用于监视一切是否正常。起初，你将其设置为 `true`。如果执行的任何检查失败，你就将该值切换为\
  \ `false`。如果两次检查后该变量仍为 `true`，则说明一切正常，并向用户显示确认消息。\n\n## 西班牙语星期几\n\n现在你将学习如何将代码的执行分支到多个路径。\n\
  \n### 任务\n\n你将编写一个程序，对于用户输入的日期，显示该日期的西班牙语星期几（lunes、martes、miércoles 等）（见图 16-8）。\n\
  \n### 解决方案\n\n```csharp\nif (dayOfWeek == DayOfWeek.Friday)\n    spanish = \"Viernes\"\
  ;\nif (dayOfWeek == DayOfWeek.Saturday)\n    spanish = \"Sábado\";\nif (dayOfWeek\
  \ == DayOfWeek.Sunday)\n    spanish = \"Domingo\";\n\n// Output\nConsole.WriteLine(spanish);\n\
  if (enteredDate == new DateTime(1945, 5, 8))\n    Console.WriteLine(\"The happiest\
  \ day of the 20th century.\");\n\n// Waiting for Enter\nConsole.ReadLine();\n}\n\
  ```\n\n### 讨论\n\n请注意以下几点：\n\n- 你省略了各个 `if` 分支周围的花括号。这样做是可以的，因为每个分支中都只有一条语句。我通常不会这样做，但在这种有许多简单\
  \ `if` 的情况下，在我看来这样会让代码更整洁。\n- 一周中的各天是 `DayOfWeek` 枚举的成员。当你输入两个等号后按空格键时，Visual Studio\
  \ 会立即为你提供该枚举（见图 16-9）。使用 Visual Studio 提供的内容！\n\n```csharp\nstring input = Console.ReadLine();\n\
  DateTime enteredDate = Convert.ToDateTime(input);\n\n// Finding day of week (in\
  \ enumeration)\nDayOfWeek dayOfWeek = enteredDate.DayOfWeek;\n\n// Spanish texts\n\
  string spanish = \"\";\nswitch (dayOfWeek)\n{\n    case DayOfWeek.Monday:\n    \
  \    spanish = \"Lunes\";\n        break;\n    case DayOfWeek.Tuesday:\n       \
  \ spanish = \"Martes\";\n        break;\n    case DayOfWeek.Wednesday:\n       \
  \ spanish = \"Miércoles\";\n        break;\n    case DayOfWeek.Thursday:\n     \
  \   spanish = \"Jueves\";\n        break;\n    case DayOfWeek.Friday:\n        spanish\
  \ = \"Viernes\";\n        break;\n    case DayOfWeek.Saturday:\n        spanish\
  \ = \"Sábado\";\n        break;\n    case DayOfWeek.Sunday:\n        spanish = \"\
  Domingo\";\n        break;\n}\n\n// Output\nConsole.WriteLine(spanish);\nif (enteredDate\
  \ == new DateTime(1945, 5, 8))\n    Console.WriteLine(\"The happiest day of the\
  \ 20th century.\");\n\n// Waiting for Enter\nConsole.ReadLine();\n}\n```\n\n###\
  \ 讨论\n\n如果重复的分支总是基于同一个值，你可以使用 `switch` 语句来替代一系列 `if` 语句。在本例中，这个值就是 `dayOfWeek` 变量的值。\n\
  \n关于语法，`switch` 关键字后面（在括号中）跟一个变量（或表达式），其值决定执行将走哪个分支。各个分支以 `case` 关键字开头，后跟控制变量的特定值和一个冒号。你应该用\
  \ `break` 关键字终止每个分支。\n\n## 小结\n\n在本章中，你编写了针对各种实际任务进行条件执行的程序。具体来说，你学习了以下内容：\n\n-\
  \ 输入条件时不使用任何关系运算符，如 `<`、`==` 等。条件只需计算结果为 `bool` 类型。当计算结果为 `true` 时，即视为满足条件。\n- 使用\
  \ `!` 运算符对条件取反。\n- 将随机数转换为另一种数据，例如正反面配对。\n- 对用户输入（尤其是日期）进行各种检查。\n- 使用一系列 `if` 语句或\
  \ `switch` 语句，将程序分支到多个备选执行路径。\n"
- "## 第 17 章：复合条件\n\n你现在已经有一些制定条件并使用它们解决实际问题的经验了。对于更复杂的问题，你通常需要将条件组装成两个或更多部分条件。这就是你将在本章中学习的内容。\n\
  \n### 是或否\n\n你对复合条件的第一次使用，将是检查用户输入是否属于允许的备选项之一。\n\n### 任务\n\n你将编写一个程序，检查用户输入的是“yes”还是“no”。所有其他输入都将被视为不正确（见图\
  \ 17-1 和 17-2）。\n\n![](img/32b055c352c70d22a656320349173d95_252_0.png)\n\n*图 17-1.*\
  \ 可接受的答案，但令人难过\n\n![](img/32b055c352c70d22a656320349173d95_253_0.png)\n\n*图 17-2.*\
  \ 是的！\n\n### 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n  \
  \  // Input\n    Console.Write(\"Do you love me? \");\n    string input = Console.ReadLine();\n\
  \n    // Evaluating\n    string inputInSmall = input.ToLower();\n    if (inputInSmall\
  \ == \"yes\" || inputInSmall == \"no\")\n    {\n        Console.WriteLine(\"OK.\"\
  );\n    }\n    else\n    {\n        Console.WriteLine(\"Say it straight!\");\n \
  \   }\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n### 讨论\n\n\
  请注意以下几点：\n\n- 为了忽略大小写差异，你将输入转换为小写字母。\n- 所用条件是一个复合条件。它由两个部分条件组成，使用条件或运算符连接，该运算符输入为\
  \ `||`（两条竖线）。\n- 如果**至少一个**部分条件满足，则条件成立（并执行 `if` 分支）。这意味着用户输入了 *yes 或 no*。在这种情况下，这些备选项是互斥的。但是，你也会遇到两个条件可以同时满足的情况。\n\
  - 如果第一个和第二个部分条件都不满足，则条件不成立（并执行 `else` 分支）。换句话说，用户输入了 yes 或 no 以外的内容。\n\n### 用户名和密码\n\
  \n现在你将查看应始终同时满足的部分条件。\n\n### 任务\n\n你将编写一个程序，检查用户是否输入了正确的用户名（Orwell）并且同时输入了正确的密码（Catalonia）。用户名不区分大小写，也就是说它可以是小写或大写（见图\
  \ 17-3 和 17-4）。\n\n\n\n\n## 第17章 复合条件\n\n![](img/32b055c352c70d22a656320349173d95_255_0.png)\n\

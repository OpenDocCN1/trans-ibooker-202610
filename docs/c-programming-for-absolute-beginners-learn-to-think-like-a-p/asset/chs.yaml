  \ the equation has \"normal\" solution\n        double solution = -b / a;\n    \
  \    Console.WriteLine(\"Solution is x=\" + solution);\n    }\n    else\n    {\n\
  \        // a is zero, result depends on b\n```\n\n```\nif (b == 0)\n{\n    Console.WriteLine(\"\
  The equation \\\"is solved\\\" by any x\");\n}\nelse\n{\n    Console.WriteLine(\"\
  The equation does not have a solution\");\n}\n}\n\n// Waiting for Enter\nConsole.ReadLine();\n\
  }\n```\n\n# 二次方程\n\n继续数学话题，下一个练习涉及更难一点的二次方程。\n\n# 任务\n\n你将编写一个程序来求解二次方程，也就是形如 $ax^2\
  \ + bx + c = 0$ 的方程。例如，$x^2 - x - 2 = 0$ 是一个二次方程，其中 $a$ 是 1，$b$ 是 -1，$c$ 是 -2。该方程有两个解：-1\
  \ 和 2。代入这两个解中的任何一个都会使左边变为零。\n\n要求解的方程将以系数 $a$、$b$ 和 $c$ 的形式输入。程序计算并显示其解（见图 18-8）。\n\
  \n![](img/32b055c352c70d22a656320349173d95_278_0.png)\n\n*图 18-8.* 求解二次方程\n\n为简单起见，你不考虑\
  \ *a* 等于零的情况，那会将任务转化为前面的一元线性方程。\n\n# 分析\n\n从前，某个聪明人想出了一个求解二次方程的方法。你可能在学校里就学过。首先计算所谓的判别式：\n\
  \n$$D = b^2 - 4ac$$\n\n然后根据判别式的值进行分支。\n\n+   - 当 $D > 0$ 时，方程有两个解，公式如下：\n+   \n\
  +     $$x_{1,2} = \\frac{-b \\pm \\sqrt{D}}{2a}$$\n+   \n+   - 当 $D = 0$ 时，同样的公式仍然适用，但两个解重合。\n\
  +   \n+   - 当 $D < 0$ 时，方程在实数范围内没有解。\n\n\n\n\n\n## 解决方案\n\n以下是代码：\n\n```csharp\n\
  static void Main(string[] args)\n{\n    // Inputs\n    Console.Write(\"Enter a:\
  \ \");\n    string input = Console.ReadLine();\n    double a = Convert.ToDouble(input);\n\
  \n    Console.Write(\"Enter b: \");\n    string inputB = Console.ReadLine();\n \
  \   double b = Convert.ToDouble(inputB);\n\n    Console.Write(\"Enter c: \");\n\
  \    string inputC = Console.ReadLine();\n    double c = Convert.ToDouble(inputC);\n\
  \n    // Solving + output\n    double d = b * b - 4 * a * c;\n    if (d > 0)\n \
  \   {\n        double x1 = (-b - Math.Sqrt(d)) / (2 * a);\n        double x2 = (-b\
  \ + Math.Sqrt(d)) / (2 * a);\n        Console.WriteLine(\"The equation has two solutions:\"\
  );\n        Console.WriteLine(x1);\n        Console.WriteLine(x2);\n    }\n    if\
  \ (d == 0)\n    {\n        double x = -b / (2 * a);\n        Console.WriteLine(\"\
  The equation has a single solution: \" + x);\n    }\n    if (d < 0)\n    {\n   \
  \     Console.WriteLine(\"The equation does not have a solution\");\n    }\n\n \
  \   // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n## 讨论\n\n这个练习最有趣的一点是你在代码中输入公式的方式。注意，分子和分母必须用括号括起来，以确保正确的计算顺序！数学公式中没有括号，因为数学家使用分数。\n\
  \n在计算判别式时，我没有使用括号；我只依赖乘法优先于减法的规则。\n\n## 测试\n\n为了检查程序计算是否正确，你可以编写更多代码作为测试；在将解代入*x*后，左边应该变为零。\n\
  \n## 总结\n\n在本章中，你看到了几个使用多个条件来完成指定任务的示例。\n\n首先，你以两种替代方式解决了足球比赛评估。第一种使用三个简单的`if`语句逐一考虑了各种可能性。第二种使用了一个分支嵌套在另一个分支中。\n\
  \n你进一步连续使用多个条件来找出三个数中最小的一个。为此，你在一个辅助变量中存储了一个“当前最小值”。\n\n随后，你使用内置函数`Math.Min`解决了同样的任务。你已经知道该函数确定两个值中的最小值。在这里，我向你展示了一个有趣的情况，即如何将其用于三个数。\n\
  \n在最后两个任务中，你在数学示例中练习了多个条件，即求解线性和二次方程。最后一个任务让你有机会看到在代码中编写的稍微复杂的计算。\n"
- "## 第19章 高级条件\n\n本书第三部分以几个可能被视为高级的条件执行任务作为结尾。首先，你将学习条件运算符，然后你将编写一个包含多个复杂条件的程序，最后你将学习一条重要的准则：当你想测试某样东西时，你必须确保它是存在的。\n\
  \n### 条件运算符\n\n在许多情况下，if-else 结构可以被条件运算符替代，该运算符根据条件是否满足而产生两个值之一。如果你熟悉 Excel 的 IF\
  \ 函数，你会觉得条件运算符似曾相识。\n\n#### 任务\n\n你将使用条件运算符解决之前的“正面和反面”任务（来自第16章）（见图19-1）。\n\n![](img/32b055c352c70d22a656320349173d95_281_0.png)\n\
  \n*图19-1.* 使用条件运算符\n\n#### 解决方案\n\n以下是代码：\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    // Random number generator\n    Random randomNumbers = new Random();\n\
  \n    // Random number 0/1 and its transformation\n    int randomNumber = randomNumbers.Next(0,\
  \ 1 + 1);\n    string message = randomNumber == 0 ? \"Head tossed\" : \"Tail tossed\"\
  ;\n    Console.WriteLine(message);\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
  }\n```\n\n#### 讨论\n\n条件运算符（?:）的语法如下：\n\n`condition ? yesValue : noValue`\n\n此类表达式的结果如下：\n\
  \n- 如果*条件*成立（满足），则为*yesValue*\n- 否则为*noValue*\n\n#### 程序\n\n在这种情况下，条件是对 randomNumber\
  \ 变量是否等于零的测试。如果为真，则 message 变量被赋值为“正面朝上”文本。否则，被赋值为“反面朝上”文本。\n\n#### 术语\n\n条件运算符也被称为*三元*运算符，因为它是唯一接受三个操作数（它所处理的值）的运算符：一个条件、一个*yesValue*和一个*noValue*。\n\
  \n学生在以下情况获得*优秀*评价：\n\n- 所有成绩的算术平均值不高于1.5。\n- 学生没有任何低于2分的成绩。\n- 学生没有任何无故缺勤。\n\n如果学生的成绩中至少有一个是5分，则被视为*不及格*。\n\
  \n在所有其他情况下，总结性评价为*良好*。\n\n你现在大概能猜到，这个程序不会那么简单。\n\n### 解决方案\n\n以下是代码：\n\n```csharp\n\
  static void Main(string[] args)\n{\n    // 1. PREPARATIONS\n    string errorMessage\
  \ = \"Incorrect input\";\n    int mathematics, informationTechnology, science, english;\n\
  \    bool hasUnexcusedAbsences;\n\n    // 2. INPUTS\n    try\n    {\n        Console.WriteLine(\"\
  Enter grades from individual subjects:\");\n\n        Console.Write(\"Mathematics:\
  \ \");\n        string input = Console.ReadLine();\n        mathematics = Convert.ToInt32(input);\n\
  \        if (mathematics < 1 || mathematics > 5)\n        {\n            Console.WriteLine(errorMessage);\n\
  \            return;\n        }\n\n        Console.Write(\"Information technology:\
  \ \");\n        input = Console.ReadLine();\n        informationTechnology = Convert.ToInt32(input);\n\
  \        if (informationTechnology < 1 || informationTechnology > 5)\n        {\n\
  \            Console.WriteLine(errorMessage);\n            return;\n        }\n\n\
  \        Console.Write(\"Science: \");\n        input = Console.ReadLine();\n  \
  \      science = Convert.ToInt32(input);\n        if (science < 1 || science > 5)\n\
  \        {\n            Console.WriteLine(errorMessage);\n            return;\n\
  \        }\n\n        Console.Write(\"English: \");\n        input = Console.ReadLine();\n\
  \        english = Convert.ToInt32(input);\n        if (english < 1 || english >\
  \ 5)\n        {\n            Console.WriteLine(errorMessage);\n            return;\n\
  \        }\n\n        Console.Write(\"Any unexcused absences? (yes/no): \");\n \
  \       input = Console.ReadLine();\n        input = input.ToLower(); // not distinguishing\
  \ upper/lower\n        if (input != \"yes\" && input != \"no\")\n        {\n   \
  \         Console.WriteLine(errorMessage);\n            return;\n        }\n   \
  \     hasUnexcusedAbsences = input == \"yes\";\n    }\n    catch (Exception)\n \
  \   {\n        Console.WriteLine(errorMessage);\n        return;\n    }\n\n    //\
  \ 3. EVALUATION\n    // You need arithmetic average of all the grades\n    double\
  \ average = (mathematics + informationTechnology + science +\n    english) / 4.0;\n\
  \    string message;\n    // Testing all conditions for excellence\n    if (average\
  \ < 1.5001 &&\n        mathematics <= 2 && informationTechnology <= 2 &&\n     \
  \   science <= 2 && english <= 2 &&\n        !hasUnexcusedAbsences)\n    {\n   \
  \     message = \"Excellent\";\n    }\n    else\n    {\n        // Here you know\
  \ the result is not excellent, so testing the other\n        // two possibilities\n\
  \        if (mathematics == 5 || informationTechnology == 5 ||\n            science\
  \ == 5 || english == 5)\n        {\n            message = \"Failed\";\n        }\n\
  \        else\n        {\n            message = \"Good\";\n        }\n    }\n\n\
  \    // 4. OUTPUT\n    Console.WriteLine(\"Summary evaluation: \" + message);\n\n\
  \    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n### 讨论\n\n以下部分将解释该程序。\n\
  \n#### 成绩输入\n\n在本练习中，你需要认真进行输入数据检查。try-catch 包裹了整个输入部分。你还需要检查成绩是否属于1到5的范围。\n\n注意，成绩小于1或大于5表示错误。你使用了`||`运算符（“至少一个”）。\n\
  \n#### 程序终止\n\n错误的输入会立即终止程序。你在这里使用 return 语句，该语句通常用于终止子程序。然而，当在 Main 内部使用时，它直接终止整个程序。\n\
  \n#### 是/否输入\n\n为了输入学生是否有无故缺勤，用户输入 yes 或 no。与 yes 和 no 都不相同的输入表示错误。我使用了`&&`运算符（“同时”）。\n\
  \n在检查之前，你将输入转换为小写，这样用户使用大写字母时就无关紧要了。\n\n有趣的是包含单等号和双等号（单等号用于赋值，双等号用于比较）的那一行：\n\n\
  ```csharp\nhasUnexcusedAbsences = input == \"yes\";\n```\n\n\n`==` 运算符的“工作”根据相等是否成立产生\
  \ true 或 false 值。结果值随后被赋给 bool 类型的 hasUnexcusedAbsences 变量。\n\n## 当心整数除法！\n\n计算成绩平均值时，你要用总和除以\
  \ 4.0，而不是除以 4。你不希望计算机把斜杠视为整数除法运算符。这就是为什么你要避免 int 除以 int。\n\n如果你只输入 4，那么 1、2、2、2\
  \ 这种成绩情况会被误判为“优秀”，因为平均值会被计算为精确的 1，而不是正确的 1.75！\n\n## 小数运算\n\n为什么你要像下面这样输入平均值的检查？\n\
  \n```\naverage < 1.5001\n```\n\n为什么你不使用下面这种写法？\n\n```\naverage <= 1.5\n```\n\n因为小数运算不一定是精确的。有时，计算机可能会计算出类似\
  \ 1.50000000001 的值，而不是正确的 1.5。这就是为什么在测试中使用一个稍大一点的数。\n\n## 第二个字符测试\n\n许多程序崩溃，是因为程序员在访问某个对象之前忘了测试它是否存在。这项任务将是你首次接触这个常见问题。\n\
  \n### 任务\n\n我将向你展示如何测试输入文本的第二个字符。假设产品标签的第二位必须始终是大写 X（见图 19-3 和图 19-4）。\n\n![](img/32b055c352c70d22a656320349173d95_290_0.png)\n\
  \n**图 19-5.** *不正确的标签，未崩溃*\n\n## 解决方案\n\n这是代码：\n\n```\nstatic void Main(string[]\
  \ args)\n{\n    // Input\n    Console.Write(\"Enter product label: \");\n    string\
  \ label = Console.ReadLine();\n\n    // Evaluating\n    if (label.Length >= 2 &&\
  \ label.Substring(1, 1) == \"X\")\n    {\n        Console.WriteLine(\"Label is OK\"\
  );\n    }\n    else\n    {\n        Console.WriteLine(\"Incorrect label\");\n  \
  \  }\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n## 讨论\n\n以下各节将解释该程序。\n\
  \n### 获取字符\n\n你使用 `Substring` 方法来访问第二个字符，该方法通常从给定文本中提取特定部分（*子字符串*）。此方法需要两个参数：\n\n\
  - *所需子字符串第一个字符的位置：* 位置编号从零开始，所以第二个字符的位置是 1。\n- *所需子字符串的字符数：* 在这种情况下，你只需要一个字符，因此第二个参数也是\
  \ 1。\n\n### 存在性测试\n\n测试给定字符是否等于某值有一个隐藏的陷阱：第二个字符可能根本不存在。当用户输入零个或一个字符时，就会发生这种情况。\n\
  \n在这种情况下，调用 `Substring(1,1)` 会导致运行时错误。\n\n这意味着你必须首先测试文本长度是否至少为两个字符。只有通过这个测试，你才能访问第二个字符。\n\
  \n代码中有一个复合条件，如下所示：\n\n```\nif (label.Length >= 2 && label.Substring(1, 1) == \"\
  X\")\n```\n\n它的工作原理依赖于 `&&` 运算符的*短路求值*。如果 AND 连接中的第一个部分条件不成立，那么第二个部分条件根本不会被求值，因为它没有用处。即使它成立，也不会改变整体结果，因为\
  \ AND 运算符要求两个部分同时成立。\n\n在这种情况下，当标签长度小于 2 时，本来会失败的 `Substring` 调用会被跳过，程序不会崩溃！\n\n\
  请注意，对于 `||` 运算符也可以作出类似的说明。\n\n### 一个实验\n\n尝试省略第一个部分条件（长度检查）。然后以用户身份输入单个字符。程序将以运行时错误终止。这样你就会看到第一个条件确实很重要。\n\
  \n## 小结\n\n在本章中，你学习了几个高级条件的示例。\n\n你从所谓的条件运算符（`?:`）入手，它也被称为三元运算符，因为它处理三个值。根据指定条件（问号之前的第一个值）是否满足，该运算符的“工作”结果要么是\
  \ *yesValue*（第二个值，位于问号和冒号之间），要么是 *noValue*（第三个值，位于冒号之后）。条件运算符是某些 if-else 情况的合适简写替代方式。\n\
  \n总结评估中的中间任务是对你学到的关于条件执行的所有内容的一种回顾。在那里，你遇到了各种测试、许多复合条件，以及使用 `!` 运算符进行取反。\n\n最后一项任务，即测试某段文本的第二个字符，向你展示了在探究第二个字符是什么之前，测试它是否确实存在的重要性。在那里，你使用了条件的短路求值。如果复合条件的结果在第一个部分条件求值后就已经能够确定，那么第二个部分条件就会被完全跳过。\n"

  short:   \" + sizeof(short));\n    Console.WriteLine(\"ushort:  \" + sizeof(ushort));\n\
  \    Console.WriteLine();\n    Console.WriteLine(\"int:     \" + sizeof(int));\n\
  \    Console.WriteLine(\"uint:    \" + sizeof(uint));\n    Console.WriteLine();\n\
  \    Console.WriteLine(\"long:    \" + sizeof(long));\n    Console.WriteLine(\"\
  ulong:   \" + sizeof(ulong));\n    Console.WriteLine();\n    Console.WriteLine(\"\
  Decimal numbers\");\n    Console.WriteLine(\"---------------\");\n    Console.WriteLine(\"\
  float:   \" + sizeof(float));\n    Console.WriteLine(\"double:  \" + sizeof(double));\n\

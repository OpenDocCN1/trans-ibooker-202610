  \ Console App 模板时，Visual Studio 生成了代码。正如你在创建项目时所看到的，Visual Studio 包含许多不同的模板；这些模板是不同类型程序的现成项目骨架。\n\
  \n你可以看到代码中包含了一些奇怪的词，如 `using`、`namespace`、`class` 等等。我现在不会解释这些，因为你目前不需要详细理解它们。但\

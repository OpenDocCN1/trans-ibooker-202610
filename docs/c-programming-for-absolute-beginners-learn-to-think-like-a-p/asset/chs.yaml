- "## 最初的循环\n\n你将进入本书最困难的章节。循环是一种强大的工具，所有程序员都需要它，如同呼吸空气一样不可或缺。理解循环并不容易，因此你将经历许多与循环相关的练习。\n\
  \n### 重复同一段文本\n\n循环是一种工具，用来高效地实现同一或（更常见的）类似活动的重复。为了让你能够恰当地体会循环，某些任务你将解决两次：第一次不用循环，第二次使用循环。你将从重复同一活动开始，之后继续使用循环来重复类似活动。\n\
  \n### 任务\n\n你将编写一个程序，连续显示“I will start learning tomorrow.”十次（见图 20-1）。\n\n### 使用循环的解决方案\n\
  \n稍微想一想前面的练习。你能想象有人可能想让你更改显示的句子吗？你能想象将它重复一百次而不是十次吗？你能想象重复次数由用户输入吗？\n\n要解决这些问题，你需要一个新工具：循环。\n\
  \n### 解决方案\n\n这是代码：\n\n```\nstatic void Main(string[] args)\n{\n    // Output\n\
  \    for (int count = 0; count < 10; count++)\n    {\n        Console.WriteLine(\"\
  I will start learning tomorrow.\");\n    }\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
  }\n```\n\n### for 循环的工作原理\n\n你使用 for 结构来表示重复。它的通用语法如下：\n\n```\nfor (initializer;\
  \ loopCondition; iterator)\n{\n    statement;\n    statement;\n    statement;\n\
  \    ...\n}\n```\n\nfor 循环的工作原理如下：\n\n- `initializer` 在进入循环前执行一次。\n- `loopCondition`\
  \ 在每轮循环之前被求值。如果它成立，计算机进入循环并执行循环体内的语句。\n- 迭代器语句在每轮循环完成后执行。之后，重新求值 `loopCondition`。\n\
  \n图 20-2 显示了程序流程。\n\n![](img/32b055c352c70d22a656320349173d95_297_0.png)\n\n*图 20-2.*\
  \  程序流程\n\n### 循环\n\n在这种情况下，所需的重复次数是通过对目前已执行的循环轮数进行计数来实现的。为此，你使用 count 变量。\n\n在开始（初始化器）时，变量被设置为零。每完成一轮循环（迭代器）后，变量增加一。只要（循环条件）输出中的行数尚未达到十，循环体（显示一行文本）就会重复。一旦\
  \ count 变量变为十，条件（count < 10，也就是 10 < 10）将不再成立，循环将终止，计算机将继续执行循环之后的语句。\n\n### 自行探索\n\
  \n你应该花时间探索循环的内部机制，以彻底理解它们。使用你已经知道的调试工具：单步执行并检查 count 变量。\n\n### 提示\n\nVisual Studio\
  \ 可以帮助你写出无差错的 for 循环。只需输入 for，按两次 Tab 键，然后编辑生成的循环头即可。\n\n### 选择重复次数\n\nfor 循环让你能够处理在事先（编写代码时）不知道重复次数的情况。\n\
  \n### 任务\n\n你将修改前面的练习，让用户指定句子重复的次数（见图 20-3）。\n\n\n\n\n\n```csharp\n// Waiting for\
  \ Enter\nConsole.ReadLine();\n}\n```\n\n## 讨论\n\n请注意以下几点：\n\n- 与之前的任务相比，你将固定的重复次数替换为用户输入的变量值。\n\
  - 仔细选择存储所需总重复次数的变量名；这里是 `howManyTimes`。具体来说，你应该将其与存储当前重复次数的计数变量区分开。\n\n## 反复掷骰子\n\
  \n你将看到另一个重复相同活动的示例。\n\n## 任务\n\n你将编写一个程序，掷骰子20次（见图20-4）。\n\n![](img/32b055c352c70d22a656320349173d95_300_0.png)\n\
  \n*图20-4.* 掷骰子20次\n\n```csharp\nConsole.WriteLine(\"7. To learn\");\nConsole.WriteLine(\"\
  8. To learn\");\nConsole.WriteLine(\"9. To learn\");\nConsole.WriteLine(\"10. To\
  \ learn\");\n\n// Waiting for Enter\nConsole.ReadLine();\n}\n```\n\n## 使用循环的解决方案\n\
  \n循环可以高效地解决这类问题。实际上，你会发现更多时候需要使用循环来重复类似的活动，而不是完全相同的活动。\n\n```csharp\nstatic void\
  \ Main(string[] args)\n{\n    // Output\n    Console.WriteLine(\"My main to-do list:\"\
  );\n\n    for (int taskNumber = 1; taskNumber <= 10; taskNumber++)\n    {\n    \
  \    Console.WriteLine(taskNumber.ToString() + \". To learn\");\n    }\n\n    //\
  \ Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n## 讨论\n\n以下各节讨论该程序。\n\n\
  ## 控制变量\n\n解决方案的核心是在循环体内使用循环控制变量的值。在该程序中，你将变量命名为 taskNumber，并使用其值进行输出。这样，你就能在第一次循环时显示1，第二次循环时显示2，以此类推。你可以使用调试工具自行检查这种情况。\n\
  \n## 循环从1开始\n\n上一个练习（反复掷骰子）中，循环控制变量从0运行到19。与此相反，这次从1开始比从0开始更方便。这种改变也导致了循环条件的变化。你使用了“小于或等于”测试，而不是“小于”测试。\n\
  \n## 小结\n\n本章向你介绍了循环的主题，循环是一种强大的编程工具，允许你指定重复相同或更常见的类似活动。\n\n对于循环，C# 提供了几种编程结构；你在本章中学习了最基本的\
  \ for 循环。在代码中，for 循环由一个控制循环的头部和一个由花括号括起来的、包含要重复语句的循环体组成。头部本身由三个用分号分隔的部分组成：\n\n-\
  \   *初始化器*是在循环开始“转动”之前执行一次的语句。\n-   *循环条件*是在每次循环之前评估的条件。如果条件满足（即计算结果为 true），则执行循环体的另一轮语句。如果条件不满足（即计算结果为\
  \ false），则循环终止，程序执行继续到循环之后的语句。\n-   *迭代器*是在每次循环之后执行的语句。\n\n为了更深入地理解 for 循环的工作原理，一定要使用调试工具，如单步执行和内存检查。\n\
  \nfor 循环通常由一个变量控制，该变量多少类似于循环轮次的计数器。这个变量称为*控制变量*。在最后一个任务中，你学习了如何在循环体内使用控制变量的值。\n"
- "## 第21章 改进循环\n\n正如你所了解的，循环功能强大，但也并非微不足道。这就是为什么本书剩余的所有章节都致力于更好地理解循环。让我们继续做一些更难的练习。\n\
  \n### 选择文本\n\n首先，你将回到上一章中关于文本重复的练习并对其进行改进。\n\n### 任务\n\n在“选择重复次数”一节中，用户可以改变给定句子的重复次数。现在，你将允许用户改变句子本身（见图21-1）。\n\
  \n![](img/32b055c352c70d22a656320349173d95_305_0.png)\n\n*图21-1.* 改变句子\n\n### 解决方案\n\
  \n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Inputs\n    Console.Write(\"\
  Enter text to repeat: \");\n    string textToRepeat = Console.ReadLine();\n\n  \
  \  Console.Write(\"Enter number of repetitions: \");\n    string input = Console.ReadLine();\n\
  \    int howManyTimes = Convert.ToInt32(input);\n\n    // Output\n    for (int count\
  \ = 0; count < howManyTimes; count++)\n    {\n        Console.WriteLine(textToRepeat);\n\
  \    }\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n### 交替循环\n\
  \n很多时候，你需要重复几个活动。你做完第一件事，然后做第二件事，然后再做第一件事，依此类推。在代码中查看这样的任务很有趣。我将向你展示三种解决这个问题的方法。\n\
  \n### 任务\n\n你将编写一个程序，在待办事项列表中交替执行两项任务（见图21-2）。\n\n### 备注\n\n请注意以下几点：\n\n-   条件不必写成\
  \ `learning == true`。learning 变量已经是 bool 类型，这意味着你可以直接将其用作条件。当它为 true 时，条件成立。\n-\
  \   你需要在进入循环之前设置变量的初始值。初始值在循环的第一次迭代中使用。在本例中，你将其设置为 true。\n-   使用取反运算符（`!`）在 true\
  \ 和 false 之间切换。\n\n### 第三种解决方案\n\n第三种解决方法是循环五次而不是十次，并在循环的每一次迭代中同时执行“奇数活动”和“偶数活动”。\n\
  \n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Preparations\n\
  \    Console.WriteLine(\"My main to-do list:\");\n    int taskNumber = 1;\n\n  \
  \  for (int coupleCount = 0; coupleCount < 5; coupleCount++)\n    {\n        //\
  \ Couple output and adjusting task number\n        Console.WriteLine(taskNumber.ToString()\
  \ + \". Learning\");\n        taskNumber++;\n        Console.WriteLine(taskNumber.ToString()\
  \ + \". Dating\");\n        taskNumber++;\n    }\n\n    // Waiting for Enter\n \
  \   Console.ReadLine();\n}\n```\n\n### 石头剪刀布\n\n在下一个练习中，你将看到循环体中有许多语句的 for 循环。循环将代表游戏的各个回合。\n\
  \n### 任务\n\n你将编写一个程序，与用户进行指定回合数的石头剪刀布游戏（见图21-3）。\n\n![](img/32b055c352c70d22a656320349173d95_310_0.png)\n\
  \n*图21-3.* 游戏\n\n计分方式类似于国际象棋：胜利得一分，平局得半分。\n\n```csharp\n// Game evaluation\nConsole.WriteLine(\"\
  GAME OVER - OVERALL RESULT\");\nConsole.WriteLine(playerName + \":Computer - \"\
  \ +\n    playerPoints.ToString() + \":\" + computerPoints.ToString());\n\n// Waiting\
  \ for Enter\nConsole.ReadLine();\n}\n```\n\n### 讨论\n\n请注意以下几点：\n\n-   电脑使用随机数进行“选择”：1代表石头，2代表剪刀，3代表布。\n\
  -   为了简化，当用户输入的不是R、S或P时，将其视为“布”。\n-   用户输入不区分大小写。\n-   在多个地方，使用两个嵌套的条件（三元）运算符而不是两个嵌套的\
  \ if-else 来解决三分支问题。请注意，第一个条件运算符的值是如何用另一个用括号括起来的三元运算符来指定的。\n-   如果你不喜欢条件（三元）运算符，那就不要使用它。它只是特殊\
  \ if-else 情况的一种简写。我个人非常喜欢它，所以经常使用。\n\n### 小结\n\n在本章中，你继续学习了循环。第一个练习基本上是对上一章所学内容的回顾。你修改了之前的一个任务。\n\
  \n\n\n\n\n接下来，你接触了几种解决交替循环的方法，也就是重复相似成对活动的循环。具体而言，你学习了以下解决方案：\n\n- 根据控制变量是奇数还是偶数来交替输出\n\
  - 切换一个布尔变量，用于指示你是否需要第一个输出\n- 在循环的一轮中执行成对的两个活动\n\n最后一个示例（石头剪刀布游戏）实际上并不是以循环为核心的。循环只是用来重复游戏回合的手段。一个游戏回合就是一个真实的、更复杂过程的示例，你可以用本书目前所学的知识来实现这个过程。\n"
- "## 第 22 章 数列\n\n许多编程任务都可以归结为生成有规律的数列。这就是本章将要学习的内容。通过这种方式，你还将更好地理解循环。\n\n### 每隔一个\n\
  \n你已经能够生成一个简单的数列，比如从 1 到 10。现在你将着手生成更复杂一些的数列。\n\n#### 任务\n\n在此任务中，你将显示“每隔一个”的数，直到\
  \ 20（见图22-1）。\n\n![](img/32b055c352c70d22a656320349173d95_318_0.png)\n\n*图 22-2.\
  \ 数字递减*\n\n#### 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n\
  \    // Output\n    for (int number = 10; number >= 1; number--)\n    {\n      \
  \  Console.WriteLine(number);\n    }\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
  }\n```\n\n#### 讨论\n\n请注意以下几点：\n\n- 循环的*初始化器*可能是最简单的。你只需从 10 开始。\n- *迭代器*也不难；数字是递减的，所以你只需在每一轮结束时减\
  \ 1。\n- 最困难的是*循环条件*。你必须以这样的方式来构造它：只要你想让循环继续，它就成立；当你想退出时，它就不再成立。正确的判断标准是 number 变量是否大于或等于\
  \ 1。\n\n### 小数\n\n包含小数的数列可能会让你惊讶。\n\n#### 任务\n\n在此任务中，你将生成一个从 9 到 0 的数列，每一步递减 0.9（见图22-3）。\n\
  \n![](img/32b055c352c70d22a656320349173d95_320_0.png)\n\n*图 22-3. 每次递减 0.9*\n\n\
  #### 看似正确的解决方案\n\n沿用上一个练习的风格，你可以编写如下代码：\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    // Output\n    for (double number = 9; number >= 0; number -= 0.9)\n\
  \    {\n        Console.WriteLine(number.ToString(\"N1\"));\n    }\n\n    // Waiting\
  \ for Enter\n    Console.ReadLine();\n}\n```\n\n#### 测试\n\n然而，测试结果表明数列缺少了最后一项：0（见图22-4）。\n\
  \n![](img/32b055c352c70d22a656320349173d95_321_0.png)\n\n*图 22-4. 缺少最后一个数字*\n\n\
  这是怎么回事？\n\n#### 出错原因\n\n这个练习表明，处理小数可能会很棘手；你需要小心，因为小数运算可能是不精确的！\n\n当你省略保留一位小数的格式（`.ToString(\"\
  N1\")`）时，你就能感觉到原因了。试试看（见图22-5）。\n\n### 二次幂\n\n那么，如果在一行中显示两个相关联的数字呢？\n\n#### 任务\n\
  \n除了显示 1 到 10 数列中的数字之外，你还可以在每一行输出中显示对应的二次幂（见图22-6）。\n\n![](img/32b055c352c70d22a656320349173d95_323_0.png)\n\
  \n*图 22-6. 显示二次幂*\n\n#### 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    // Output\n    for (int number = 1; number <= 10; number++)\n  \
  \  {\n        int secondPower = number * number;\n        Console.WriteLine(number.ToString()\
  \ + \" + \" + secondPower.ToString());\n    }\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
  }\n```\n\n### 每行两个数\n\n这里我们继续讨论一行中有两个数字的情况。\n\n#### 任务\n\n在此任务中，你将生成一个 1–20 的数列，每一行输出包含两个数字（见图22-7）。\n\
  \n```csharp\n// What goes after the number depends on the even/odd test\nif (number\
  \ % 2 != 0)\n{\n    // Odd number, displaying space\n    Console.Write(\" \");\n\
  }\nelse\n{\n    // Even number, new line\n    Console.WriteLine();\n}\n}\n\n// Waiting\
  \ for Enter\nConsole.ReadLine();\n}\n```\n\n### 两个独立数列\n\n将来某天你可能会遇到另一个有趣的情况：两个独立的数列。\n\
  \n#### 任务\n\n你将有两个略显随意、成员数量不同的数列。第一个数列每次递减 2（111, 109, ..., 97），第二个数列每次递增 3（237,\
  \ 240, ..., 270）。\n\n程序将在每一行同时显示第一个数列中的一个数和第二个数列中的一个数（见图22-8）。\n\n![](img/32b055c352c70d22a656320349173d95_327_0.png)\n\
  \n*图 22-8. 更复杂的交替*\n\n#### 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    // Preparation\n    int first = 111;\n\n    // Output\n    for (int\
  \ second = 237; second <= 270; second += 3)\n    {\n        // Preparing first text\n\
  \        string firstText = first >= 97 ?\n            first.ToString().PadLeft(3)\
  \ : \"   \";\n\n        // Actual output\n        Console.WriteLine(firstText +\
  \ \" \" + second.ToString());\n\n        // Changing x\n        first -= 2;\n  \
  \  }\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n#### 讨论\n\n\
  请注意以下几点：\n\n- 其中一个数列（较长的那个）使用循环的控制变量来显示，另一个数列则使用一个独立的变量。\n- 在每一步中，你都要检查较短的数列是否仍在继续。\n\
  - 为了实现良好的格式，你使用了 PadLeft 方法调用，它会在其参数的左侧添加空格，以达到指定的总字符数。\n\n### 小结\n\n在本章中，你在生成各种数列的任务中练习了循环。具体来说，你学习了以下内容：\n\
  \n- 当数列以 2 为步长时，如何编写循环的迭代器。\n- 如何在循环体中不直接显示控制变量，而是显示由它推导（计算）出的值。\n- 如何在循环的迭代器中使用\
  \ -- 运算符来生成递减数列，并使用 >= 运算符指定循环条件，使它在你想继续循环的期间一直成立。\n- 小数数列需要格外小心，因为小数在内存中的表示并不精确。这意味着，例如，你需要在循环条件中留出额外的余量。\n\
  \n你还解决了单个输出行中有两个数字的情况，以及最后更有难度的两个独立数列的任务。\n"
- "## 第 23 章 未知的重复次数\n\n到目前为止，你所解决的所有循环中，你都知道迭代次数。但有时在编写程序时你并不知道这个次数，因为次数要由用户输入。不过，在所有情况下，当循环开始运行时，它将要迭代多少次就已经确定了。\n\
  \n有时，循环开始执行时，重复次数仍是未知的。你经常会遇到这样一个问题：循环应该继续还是终止。\n\n### 输入密码\n\n第一个任务与登录有关。你无法预先知道用户需要尝试多少次。\n\
  \n#### 任务\n\n你将反复要求用户输入密码，直到用户输入正确的密码为止（见图23-1）。正确的密码是 *friend*。\n\n![](img/32b055c352c70d22a656320349173d95_331_0.png)\n\
  \n*图 23-1. 反复询问*\n\n#### 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n\
  {\n    string correctPassword = \"friend\";\n\n    bool ok; // the variable must\
  \ be declared outside of the loop!\n    do\n    {\n        // Input\n        Console.Write(\"\
  Enter password: \");\n        string enteredPassword = Console.ReadLine();\n\n \
  \       // Evaluating\n        ok = enteredPassword == correctPassword;\n    } while\
  \ (!ok); // loop repeats when the condition holds\n\n    Console.WriteLine(\"Come\
  \ inside, please...\");\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n\
  ```\n\n\n\n## 第 23 章 重复次数未知\n\n### do-while 构造\n\n要编写这种循环，可以使用 `do-while` 构造。\n\n\
  计算机在遇到 `do` 后进入循环体，执行其中的语句，然后询问“再来一次？”。如果 `while` 后面的条件成立，计算机就会回到循环的开头，也就是 `do`\
  \ 后面。如此反复。\n\n当 `while` 后面的条件被判断为不成立（`false`）时，循环终止。\n\n### 本例的场景\n\n在本例中，程序会在每次输入后对输入的密码进行评估，评估结果存储在一个名为\
  \ `ok` 的 bool 类型变量中。\n\n你希望在输入密码不正确时继续循环，因此在 `while` 条件中使用了取反运算符（感叹号）。\n\n### 循环外部的变量\n\
  \nC# 要求循环条件中使用的所有变量都必须在循环外部声明。如果在循环内部声明，则在指定条件时这些变量不可见。\n\n### 提示\n\nVisual Studio\
  \ 可以帮助你编写 do-while 循环。只需输入 `do`，然后按两次 Tab 键。\n\n### 等待数值下降\n\n假设计算机在观察某个大多数时间都在增长的数值，而你的任务是检测到它（可能很少出现的）变小（下降）的时刻。\n\
  \n在处理存储在文件或数据库中的大量数据时，你通常会遇到这类问题。不过，这里你将在用户输入的数据上解决它。\n\n### 任务\n\n你将编写一个程序，反复要求用户输入（见图\
  \ 23-2）。每当用户输入的数字小于前一个数字时，程序就会通知用户并终止。\n\n![](img/32b055c352c70d22a656320349173d95_333_0.png)\n\
  \n*图 23-2. 当数字变小时终止*\n\n### 解法\n\n解法的核心是记住前一个值，而不仅仅是当前输入的值。\n\n代码如下：\n\n```csharp\n\
  static void Main(string[] args)\n{\n    // Preparations\n    int previous = int.MinValue;\n\
  \    bool ok;\n\n    // Repeating until descend\n    do\n    {\n        // Input\n\
  \        Console.Write(\"Enter a value (number): \");\n        string input = Console.ReadLine();\n\
  \        int value = Convert.ToInt32(input);\n\n        // Evaluating\n        ok\
  \ = value >= previous; // ok = still not descending\n\n        // Storing for the\
  \ next round of the loop\n        previous = value;\n    } while (ok);\n\n    //\
  \ Message to the user\n    Console.WriteLine(\"Descend detected...\");\n\n    //\
  \ Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n### 讨论\n\n第一个值有些特殊，因为它没有前驱值。你可以用一个很小的数来模拟这个前驱值，从而绕开这个问题。C#\
  \ 提供了 `int.MinValue`，它是 `int` 类型可以存储的最小值，大约是负二十亿。\n\n### 每周一次直到年末\n\n我们继续下一个练习，这个练习与日期有关。\n\
  \n### 任务\n\n任务是从今天开始，以一周为步长，显示日期，直到年末为止（见图 23-3）。\n\n![](img/32b055c352c70d22a656320349173d95_335_0.png)\n\
  \n*图 23-3. 每次一周，遍历整年*\n\n### 解法\n\n代码如下：\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    // Today\n    DateTime today = DateTime.Today;\n    int thisYear\
  \ = today.Year;\n\n    // Repeating\n    DateTime date = today;\n    do\n    {\n\
  \        // Output\n        Console.WriteLine(date.ToLongDateString());\n\n    \
  \    // Preparing next output (a week later)\n        date = date.AddDays(7);\n\
  \    } while (date.Year == thisYear);\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
  }\n```\n\n### 任务\n\n在这个程序中，你将反复掷骰子，直到连续两次掷出 6 为止（见图 23-7）。\n\n![](img/32b055c352c70d22a656320349173d95_340_0.png)\n\
  \n### 解法\n\n除了当前掷出的数字，你还需要跟踪前一次掷出的数字。这与“等待数值下降”一节中的程序类似。\n\n如果当前数字和前一个数字都是 6，程序就终止。\n\
  \n同样，第一个值比较特殊，因为它没有前驱值。因此，`previous` 变量初始化为 0，这是一个永远不会出现在骰子上的值。\n\n代码如下：\n\n```csharp\n\
  static void Main(string[] args)\n{\n    // Random number generator\n    Random randomNumbers\
  \ = new Random();\n\n    // Preparations\n    int previous = 0;\n    bool ending;\n\
  \n    // Throwing until two sixes in a row\n    do\n    {\n        // Actually throwing\n\
  \        int thrown = randomNumbers.Next(1, 6 + 1);\n        Console.WriteLine(thrown);\n\
  \n        // Evaluating\n        ending = thrown == 6 && previous == 6;\n\n    \
  \    // Preparing for next round of the loop\n        previous = thrown;\n    }\
  \ while (!ending);\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\
  \n### 小结\n\n在本章中，你学习了在循环开始时重复次数未知的循环。在 C# 中，这种循环适合使用 `do-while` 构造编写。它的功能是先执行循环体中的语句，然后询问“再来一次？”。你评估条件，如果条件成立，就再执行一轮循环。\n\
  \n你还看到，要在 `do-while` 循环的条件中使用某个变量，该变量必须在循环外部声明。\n\n使用 `do-while` 循环时，一个常见错误是条件的表述不正确。你必须小心，将其写成：如果希望继续循环，条件就应评估为\
  \ `true`。\n\n在本章的若干任务中，你需要用到上一轮循环中的某个值。为此，你使用了一个特殊变量来存储该值。当然，循环的第一轮需要特殊处理。\n"
- "## 第 24 章 累加中间结果\n\n在本章中，你将学习使用循环处理大量数据的重要情形。你经常会使用循环遍历大量数据，以累加（聚合）某个中间结果，这个中间结果会在循环结束后成为最终结果。\n\
  \n### 输入数字的总和\n\n这类任务中的一个典型问题是对大量值求和。\n\n### 任务\n\n假设用户正在输入数字，最后一个数字是 0。换句话说，用户通过输入\
  \ 0 来表示输入结束。程序随后显示所有输入数字的总和（见图 24-1）。\n\n![](img/32b055c352c70d22a656320349173d95_343_0.png)\n\
  \n*图 24-1. 累加所有数字直到输入 0*\n\n### 解法\n\n解法的核心是累加中间结果。你必须把它保存在一个变量中，并把每个输入的数字都加到该变量中。一旦用户结束输入，该变量就会包含所有输入值的总和。\n\
  \n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Preparations\n\
  \    int sum = 0;\n    int number;\n\n    // Entering numbers until zero\n    do\n\
  \    {\n        // Input\n        Console.Write(\"Enter a number (0 = end): \");\n\
  \        string input = Console.ReadLine();\n        number = Convert.ToInt32(input);\n\
  \n        // Adding to intermediate sum\n        sum += number;\n    } while (number\
  \ != 0);\n\n    // Output\n    Console.WriteLine(\"Sum of entered numbers is: \"\
  \ + sum.ToString());\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\
  \n### 输入数字的乘积\n\n如果把输入的数字相乘而不是相加，会怎样？你觉得任务一样吗？其实并不完全一样。\n\n### 任务\n\n在这个程序中，用户输入数字，最后一个数字是\
  \ 0（见图 24-2）。程序随后显示所有输入数字的乘积，显然要排除最后的 0，因为如果不排除，乘积就会变成 0。\n\n![](img/32b055c352c70d22a656320349173d95_345_0.png)\n\
  \n*图 24-2. 将所有数字相乘*\n\n### 解法\n\n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n\
  {\n    // Preparations\n    double product = 1;\n    int number;\n\n    // Entering\
  \ numbers until zero\n    do\n    {\n        // Input\n        Console.Write(\"\
  Enter a number (0 = end): \");\n        string input = Console.ReadLine();\n   \

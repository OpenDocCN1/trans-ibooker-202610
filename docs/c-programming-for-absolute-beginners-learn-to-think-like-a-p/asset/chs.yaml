  \n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n### 联系\n\n将当前程序和之前程序的结果联系起来是可能的。例如，让我们讨论重要的\
  \ `int` 类型。它使用 4 字节，即 32 位内存。这意味着可能的值有 2 的 32 次方个，超过四十亿。`int` 是一种有符号\n\n\n类型，因此你有20亿个正数和20亿个负数。其无符号对应类型\
  \ `uint` 则将所有约40亿个值都用于正数（当然，还有零）。\n\n## 讨论\n\n你可能会对各种数值数据类型感到困惑。为了帮助你理解，这里总结了每种类型的使用时机：\n\
  \n- `int`：用于本质上为整数的常规值（例如对某物的计数）。\n- `double`：用于可能是小数的常规值（例如测量值）或需要做数学运算的值。金额大多数情况下也可以用。\n\
  - `byte`：用于处理二进制数据。\n- `long`：用于较大的整数值，例如文件大小、支付标识（例如可能需要十位数字），或常规（整数）值的乘法结果。\n\
  - `decimal`：常用于金额。\n\n其他类型则不常用。\n\n## 溢出\n\n当程序计算出无法“适合”相应类型范围的值时，就会发生所谓的 *溢出*。程序的行为可能非常奇怪，如图12-3所示。\n\
  \n![](img/32b055c352c70d22a656320349173d95_178_0.png)\n\n**图 12-3.** *溢出*\n\n溢出尤其容易在乘法运算时发生，因为乘法通常会产生较大的数字。\n\
  \n## 任务\n\n在本节中，你将编写一个程序，尝试计算一百万乘以一百万。\n\n## 解决方案\n\n代码如下：\n\n```csharp\nstatic\
  \ void Main(string[] args)\n{\n    // Multiplying million by million\n    int million\
  \ = 1000000;\n    int result = million * million;\n    long resultInLong = million\
  \ * million;\n\n    // Outputs\n    Console.WriteLine(\"Million times million: \"\
  \ + result);\n    Console.WriteLine(\"also in long: \" + resultInLong);\n\n    //\
  \ Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n## 解决方案\n\n新项目的源代码如下：\n\n\
  ```csharp\nstatic void Main(string[] args)\n{\n    // 0. Preparation\n    int million\
  \ = 1000000;\n\n    // 1. Crash at least, we do not\n    //    definitely want a\
  \ nonsense\n    Console.WriteLine(\"1. calculation\");\n    try\n    {\n       \
  \ long result = million * million;\n        Console.WriteLine(\"Million times million:\"\
  \ + result);\n    }\n    catch (Exception)\n    {\n        Console.WriteLine(\"\
  I cannot calculate this.\");\n    }\n\n    // 2. Correct calculation of a big value\n\
  \    Console.WriteLine(\"2. calculation\");\n    long millionInLong = million;\n\
  \    long correctResult = millionInLong * millionInLong;\n    Console.WriteLine(\"\
  Million times million: \" + correctResult.ToString(\"N0\"));\n\n    // 3. Alternative\
  \ calculation of a big value\n    Console.WriteLine(\"3. calculation\");\n    long\
  \ correctResultAlternatively = (long)million * (long)million;\n    Console.WriteLine(\"\
  Million times million: \" + correctResultAlternatively.ToString(\"N0\"));\n\n  \
  \  // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n## 注意\n\n然而，这段代码并不能解决所有问题。当你立即启动程序时，第一次计算仍然会是错误的。人们有时把\
  \ try-catch 当作万灵丹，但它绝对不是。你需要其他手段，如下文所讨论的。\n\n## Visual Studio 中的设置\n\n你需要在 Visual\
  \ Studio 中设置你的项目，使其将溢出从程序中报告出来，而不是将其掩盖。\n\n在 Visual Studio 菜单中，选择“项目”，然后选择“<项目名>\
  \ 属性”（见图12-4）。\n\n![](img/32b055c352c70d22a656320349173d95_181_0.png)\n\n**图 12-4.**\
  \ 打开属性\n\n接下来选择“生成”选项卡，垂直（也许还要水平）滚动，以便能看到“高级”按钮（它确实很隐蔽！），然后点击该按钮（见图12-5）。\n\n![](img/32b055c352c70d22a656320349173d95_182_0.png)\n\
  \n**图 12-5.** *生成选项卡*\n\n在出现的对话框中，选中“检查算术溢出/下溢”复选框，然后点击“确定”按钮确认（见图12-6）。\n\n![](img/32b055c352c70d22a656320349173d95_183_0.png)\n\
  \n**图 12-6.** *“检查算术溢出/下溢”复选框*\n\n你的项目现在终于可以运行了。\n\n## 结果\n\n现在程序按预期运行，如图12-7所示。\n\
  \n![](img/32b055c352c70d22a656320349173d95_183_1.png)\n\n**图 12-7.** *一百万乘以一百万*\n\
  \n## 第一种替代方案\n\n第一次计算正确地报告了问题。省略 try-catch 构造会引发运行时错误，但至少它不会显示错误的结果。\n\n## 其他替代方案\n\
  \n正确的计算在计算开始*之前*将 million 转换为 `long` 类型。\n执行此转换有两种方式：\n\n- 将 million 赋值给类型为 `long`\
  \ 的变量\n- 使用 `(long)million` 进行显式*类型转换*\n\n如果你不需要精确的整数运算，你也可以使用 `double` 类型进行计算。除非你处理某些非常特殊的数学问题，否则\
  \ `double` 不太可能溢出。\n\n## 小结\n\n在本章中，你学习了高级数值计算。你认识了 C# 中可用的所有数值数据类型。这些类型的区别在于它们是否允许整数或小数，也在于取值范围的不同。用于小数的类型在存储数字的精度上也各不相同。\n\
  \n在初学者层面，了解 `int` 和 `double` 就足够了；你完全可以只使用它们。当你更有经验时，可能还会使用以下类型：\n\n- `long` 类型用于较大的整数，例如文件大小、十位数字的支付编号，或中等大小数字的乘法结果\n\
  - `decimal` 类型用于处理货币\n- `byte` 类型用于处理二进制数据\n\n你还研究了溢出问题。当计算出的值太大，无法放入特定数据类型的取值范围时，就会产生无意义的结果。Visual\
  \ Studio 的默认行为是像往常一样继续运行。然而，现在你知道如何修改设置，以至少引发运行时错误，因为继续使用错误的结果才是糟糕的选择。\n\n最好的替代方案是选择取值范围合适的数据类型，从而完全避免溢出。但请记住，仅仅更改用于存储结果的变量的类型可能还不够。例如，int\
  \ 乘以 int 永远是 int，其最大值约为 20 亿，无论你将结果存储在哪里。在计算之前将数字转换为 `long` 类型可能是合适的。\n"
- "## 第13章\n\n## 累加值\n\n到目前为止，你使用的变量都是存储一个值，然后稍后使用它。在初始赋值后，变量的值不会改变。现在，你可以进入下一步，研究变量值在程序运行期间发生变化的情况，换句话说，就是根据旧值确定新值的情况。\n\
  \n## 再谈“加十”\n\n首先，你将回到给一个数字加十的任务，这在第8章中学过。程序的目标是显示一个比用户输入的数字大十的值（见图13-1）。\n\n![](img/32b055c352c70d22a656320349173d95_186_0.png)\n\
  \n## 任务\n\n你现在将用一种新方法来解决这个任务；具体来说，你会将计算结果存储在同一个变量中，也就是最初存储输入数字的那个变量。\n\n这未必是更好的解决方案，但你将学习如何在后续小节中进一步以此为基础。\n\
  \n## 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Input\n\
  \    Console.Write(\"Enter a number: \");\n    string input = Console.ReadLine();\n\
  \    int number = Convert.ToInt32(input);\n\n    // Calculation\n    number = number\
  \ + 10;\n\n    // Result output\n    Console.WriteLine(\"Number ten more greater\
  \ is: \" + number);\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\
  \n## 讨论\n\n解决方案的核心语句如下：`number = number + 10;`。这条语句很不寻常，因为同一个东西——变量 number——出现在等号的两边！\n\
  \n计算机是这样执行这条语句的：“取变量 number 的当前值，加上十，并把结果存储为变量 number 的新值。”因此，这条语句的净效果是将 number\
  \ 的值增加十。\n\n\n\n\n## 进一步的复合赋值\n\n你喜欢复合赋值吗？在处理其他算术运算时，还有更多类似的赋值可以使用。\n\n### 任务\n\n\
  我将向你展示一个程序，该程序说明了复合赋值与减法、乘法和除法的关联（见图 13-2）。\n\n![](img/32b055c352c70d22a656320349173d95_189_0.png)\n\
  \n### 解决方案\n\n以下是代码：\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Input\n\
  \    Console.Write(\"Enter a number: \");\n    string input = Console.ReadLine();\n\
  \    int number = Convert.ToInt32(input);\n    Console.WriteLine();\n```\n\n![](img/32b055c352c70d22a656320349173d95_191_0.png)\n\
  \n*Figure 13-3. Increment and decrement operators*\n\n### 解决方案\n\n以下是代码：\n\n```csharp\n\
  static void Main(string[] args)\n{\n    // Input\n    Console.Write(\"Enter a number:\
  \ \");\n    string input = Console.ReadLine();\n    int number = Convert.ToInt32(input);\n\
  \n    // Increasing by 1 using INCREMENT OPERATOR\n    number++; // same as number\
  \ = number + 1;\n    Console.WriteLine(\"Increased by 1: \" + number);\n\n    //\
  \ Decreasing by 1 using DECREMENT OPERATOR\n    number--; // same as number = number\
  \ - 1;\n    Console.WriteLine(\"Back again: \" + number);\n\n    // Waiting for\
  \ Enter\n    Console.ReadLine();\n}\n```\n\n## 复合赋值与文本\n\n由于 + 运算符可以用于文本，因此你也可以将复合赋值运算符\
  \ (+=) 与文本一起使用。你可能会经常使用它。\n\n### 任务\n\n此任务将使你熟悉使用复合赋值进行文本连接（见图 13-4）。\n\n![](img/32b055c352c70d22a656320349173d95_192_0.png)\n\
  \n*Figure 13-4. Text concatenations using compound assignment*\n\n### 解决方案\n\n以下是代码：\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    // Initial value (empty text)\n\
  \    string books = \"\";\n\n    // Appending\n    books += \"Homage to Catalonia\"\
  \ + Environment.NewLine;\n    books += \"Silent Spring\" + Environment.NewLine;\n\
  \    books += \"The beat of a different drum\" + Environment.NewLine;\n\n    //\
  \ Output\n    Console.WriteLine(\"Valuable books\");\n    Console.WriteLine(\"-------------\"\
  );\n    Console.WriteLine(books);\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
  }\n```\n\n## 渐进求和\n\n渐进求和是求和大量值的重要原则。它意味着不是一次性在单个语句中全部求和，而是逐个求和，逐步将中间结果累积到一个特殊变量中。\n\
  \n### 任务\n\n你将编写一个程序，逐步求和三个输入的数字。当然，求和三个数字更方便地可以在一行中一次性完成。然而，我想在简单示例上说明渐进求和的重要原则，并在介绍更复杂主题——循环之前让你熟悉这一思想（见图\
  \ 13-5）。\n\n![](img/32b055c352c70d22a656320349173d95_193_0.png)\n\n*Figure 13-5.\
  \ Progressively summing three entered numbers*\n\n### 解决方案\n\n以下是代码：\n\n```csharp\n\
  static void Main(string[] args)\n{\n    // Preparation - variable to accumulate\
  \ intermediate result\n    int sum = 0;\n\n    // Input - 1. number\n    Console.Write(\"\
  Enter first number: \");\n    string input = Console.ReadLine();\n    int number\
  \ = Convert.ToInt32(input);\n\n    // Adding first number to intermediate result\n\
  \    sum += number;\n\n    // Input - 2. number\n    Console.Write(\"Enter second\
  \ number: \");\n    input = Console.ReadLine();\n    number = Convert.ToInt32(input);\n\
  \n    // Adding second number to intermediate result\n    sum += number;\n\n   \
  \ // Input - 3. number\n    Console.Write(\"Enter third number: \");\n    input\
  \ = Console.ReadLine();\n    number = Convert.ToInt32(input);\n\n    // Adding third\
  \ number to intermediate result\n    sum += number;\n\n    // Output\n    Console.WriteLine();\n\
  \    Console.WriteLine(\"Sum of entered numbers: \" + sum);\n\n    // Waiting for\
  \ Enter\n    Console.ReadLine();\n}\n```\n\n## 多重文本连接\n\n同样，由于 + 运算符也可以用于文本，因此你可以将渐进求和的原则扩展到文本。在这种情况下，它可能更被称为\
  \ *渐进累积*。\n\n### 任务\n\n你将编写一个程序，逐步累积用户输入的名称。将进行两次累积会很有趣；第一次按原始顺序，第二次按相反顺序。\n\n为简单起见，你将只处理三个值（见图\
  \ 13-6）。\n\n![](img/32b055c352c70d22a656320349173d95_195_0.png)\n\n*Figure 13-6.\
  \ Progressively accumulating names*\n\n### 解决方案\n\n以下是代码：\n\n```csharp\nstatic void\
  \ Main(string[] args)\n{\n    // Preparation - variables to accumulate intermediate\
  \ results\n    string inOriginalOrder = \"\";\n    string inReversedOrder = \"\"\
  ;\n\n    // Input of the first person\n    Console.Write(\"Enter first person: \"\
  );\n    string person = Console.ReadLine();\n\n    // Appending the first person\
  \ to intermediate result\n    inOriginalOrder += person + Environment.NewLine;\n\
  \    inReversedOrder = person + Environment.NewLine + inReversedOrder;\n\n    //\
  \ Input of the second person\n    Console.Write(\"Enter second person: \");\n  \
  \  person = Console.ReadLine();\n\n    // Appending the second person to intermediate\
  \ result\n    inOriginalOrder += person + Environment.NewLine;\n    inReversedOrder\
  \ = person + Environment.NewLine + inReversedOrder;\n\n    // Input of the third\
  \ person\n    Console.Write(\"Enter third person: \");\n    person = Console.ReadLine();\n\
  \n    // Appending the third person to intermediate result\n    inOriginalOrder\
  \ += person + Environment.NewLine;\n    inReversedOrder = person + Environment.NewLine\
  \ + inReversedOrder;\n\n    // Output\n    Console.WriteLine();\n    Console.WriteLine(\"\
  Entered persons\");\n    Console.WriteLine(\"---------------\");\n    Console.WriteLine(inOriginalOrder);\n\
  \    Console.WriteLine(\"In reversed order\");\n    Console.WriteLine(\"----------------\"\
  );\n    Console.WriteLine(inReversedOrder);\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
  }\n```\n\n### 注意\n\n值得注意的是，当以相反顺序连接人名时，复合赋值是无济于事的。\n\n## 总结\n\n本章的核心主题是向同一变量中累积值。与迄今为止的程序相反，此处的程序会反复更改变量的值，通常使用其原始值并以某种方式修改它。具体来说，你研究了以下内容：\n\
  \n- 诸如 `variable = variable + change;` 这样的语句，它取变量的当前值，将 change 加到它上面，并将结果存储为变量的新值\n\
  - 复合赋值，如 `variable += change;`，它是前述语句的简写形式\n- 使用其他算术运算的复合赋值： `-=`、 `*=`、 `/=`\n\
  - 与文本的复合赋值（仅 `+=`）\n- 使用超简洁的记法 `variable++;` 和 `variable--;` 对变量进行递增（加一）和递减（减一）\n\
  \n在本章结束时，你熟悉了渐进求和（和渐进累积）的原则，这意味着逐个求和数字，同时将中间结果存储在特殊变量中。该原则主要用于求和大量值，当你在本书后面学习循环时，你会体会到其极端重要性。\n"

  \ $ax+b=0$ 的方程。\n\n例如，$2x+6=0$ 是一个线性方程，其中 2 是 $a$，6 是 $b$。\n\n显然，解是 -3。当你将 -3 代入\
  \ $x$ 时，左边变为 0，也就是说，与右边相等。\n\n用户以系数 $a$ 和 $b$ 的形式输入要求解的方程。程序随后计算并显示其解（见图 18-7）。\n\

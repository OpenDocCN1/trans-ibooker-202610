- "## 第 9 章：数字\n\n在上一章中，你学习了输入的一般知识，特别是数字输入。你还对用户输入的数字进行了一些简单的计算。在本章中，你将更详细地了解数字。毕竟，计算机之所以被称为计算机，是因为它经常进行计算！\n\
  \n### 十进制数字输入\n\n你将从读取用户输入的十进制数字这一任务开始。\n\n### 任务\n\n你将编写一个程序，从用户那里接受一个十进制数字，并立即在屏幕上重复显示它（见图\
  \ 9-1）。\n\n![](img/32b055c352c70d22a656320349173d95_132_0.png)\n\n图 9-1. 最终的程序\n\
  \n\n\n\n\n## 解决方案\n\n整数和小数的输入之间存在两个区别：\n\n- 通过调用 `Convert.ToDouble` 方法，将文本输入转换为相应的数字。\n\
  - 要存储转换后的数字，需要使用 `double` 类型的变量。\n\n代码如下：\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    // Decimal input\n    Console.Write(\"Enter a decimal number: \"\
  );\n    string input = Console.ReadLine();\n    double decimalNumber = Convert.ToDouble(input);\n\
  \n    // Repeating entered number to the output\n    Console.WriteLine(\"You have\
  \ entered number \" + decimalNumber);\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
  }\n```\n\n## 本地化数字输入\n\n在之前的练习中，用户根据 Windows 语言设置输入小数分隔符。对于英语来说，这意味着小数点。但在其他语言中，情况可能有所不同。例如，捷克语使用逗号作为小数分隔符。\n\
  \n在当前的练习中，我将向你展示如何强制数字输入使用特定的本地化设置，而忽略 Windows 的设置。你之前已经在书中完成了类似的关于本地化输出的任务；现在你将专注于输入。\n\
  \n### 任务\n\n任务是编写一个程序，读取一个十进制数，并使用两种固定的语言设置：美式英语和捷克语。\n\n### 解决方案\n\n要使用特定的本地化设置，请使用\
  \ `CultureInfo` 对象。同时，请记得在源代码顶部添加 `using System.Globalization;` 这一行。\n\n代码如下：\n\n\
  ```csharp\nstatic void Main(string[] args)\n{\n    // AMERICAN\n    CultureInfo\
  \ american = new CultureInfo(\"en-US\");\n    try\n    {\n        // Input\n   \
  \     Console.Write(\"Enter American decimal number: \");\n        string input\
  \ = Console.ReadLine();\n        double number = Convert.ToDouble(input, american);\n\
  \        // Output\n        Console.WriteLine(\"You have entered \" + number);\n\
  \    }\n    catch (Exception)\n    {\n        // Error message\n        Console.WriteLine(\"\
  Incorrect input\");\n    }\n\n    // CZECH\n    CultureInfo czech = new CultureInfo(\"\
  cs-CZ\");\n    try\n    {\n        // Input\n        Console.WriteLine();\n    \
  \    Console.Write(\"Enter Czech decimal number: \");\n        string input = Console.ReadLine();\n\
  \        double number = Convert.ToDouble(input, czech);\n\n        // Output\n\
  \        Console.WriteLine(\"You have entered \" + number);\n    }\n    catch (Exception)\n\
  \    {\n        // Error message\n        Console.WriteLine(\"Incorrect input\"\
  );\n    }\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n## 测试与结论\n\
  \n以下章节将介绍其工作原理。\n\n### 使用小数点测试\n\n运行你的程序并输入带小数点的数字两次（见图 9-2）。\n\n![](img/32b055c352c70d22a656320349173d95_135_0.png)\n\
  \n图 9-2. 输入两个带小数点的数字\n\n使用美国本地化设置时，程序接受点作为小数分隔符。同时，使用捷克本地化设置时，程序会拒绝小数点，因为在捷克语中，点不是有效的小数分隔符。\n\
  \n### 使用小数逗号测试\n\n再次运行程序，这次输入带小数逗号的数字两次（见图 9–3）。\n\n![](img/32b055c352c70d22a656320349173d95_136_0.png)\n\
  \n**图 9–3.** *使用逗号两次输入一个数字*\n\n现在，程序接受小数逗号作为捷克语中的有效分隔符。使用美国本地化设置时，程序不会识别出任何小数。它只是忽略逗号，并将用户输入转换为整数！\n\
  \n### 进一步结论\n\n在本书中，我在图中显示的输出使用小数点。这是因为我没有在输出语句中指定任何本地化设置，而我当前的 Windows 设置是美式英语。这两项测试都表明，如果你不够小心，小数输入可能会让你出错。提醒你一下，如果直接在\
  \ C# 源代码中输入小数，无论你的设置如何，都应始终使用小数点。\n\n## 基本算术运算\n\n本章中你正在处理数字，因此现在是执行所有四种基本算术运算的好时机。\n\
  \n### 任务\n\n你将编写一个程序，接受用户输入的两个十进制数，并显示它们的加法、减法、乘法和除法结果（见图 9-4）。\n\n![](img/32b055c352c70d22a656320349173d95_137_0.png)\n\
  \n*图 9-4.* *执行基本算术运算*\n\n### 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    // Inputs\n    Console.Write(\"Enter first number: \");\n    string\
  \ input1 = Console.ReadLine();\n    double number1 = Convert.ToDouble(input1);\n\
  \n    Console.Write(\"Enter second number: \");\n    string input2 = Console.ReadLine();\n\
  \    double number2 = Convert.ToDouble(input2);\n\n    // Calculations\n    double\

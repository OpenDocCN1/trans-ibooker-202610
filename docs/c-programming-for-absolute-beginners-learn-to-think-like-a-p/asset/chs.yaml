  Console.ReadLine();\n}\n```\n\n### 讨论\n\n在解决方案中，你应该特别注意以下几点：\n\n- 你使用了不同数据类型的变量来存储不同类型的值。\n\
  - 你构建的显示消息由九个部分组成，并由八个加号连接。消息的某些部分是固定的，而另一些是可变的。\n\n### 使用小数\n\n在编程中，你需要仔细区分整数和小数。你已经知道如何处理整数，现在你将要了解小数。\n\
  \n### 任务\n\n在这个任务中，我将向你展示一些处理小数的示例。\n\n### 解决方案\n\n在C#中，有一种用于小数的类型叫做 `double`。以下是代码：\n\
  \n```\nstatic void Main(string[] args)\n{\n    // IN CODE, decimal separator is\
  \ always DOT regardless of computer language settings\n    double piApproximately\
  \ = 3.14;\n\n    // Pi is already available in C#\n    double piMorePrecisely =\
  \ Math.PI;\n```\n\n```\n```csharp\n// Decimal numbers have always limited precision\n\
  double notCompletelyOne = 0.99999999999999999;\n\n// Outputs\nConsole.WriteLine(\"\
  Pi value from our code: \" + piApproximately);\nConsole.WriteLine(\"Pi value from\
  \ C#: \" + piMorePrecisely);\nConsole.WriteLine(\"This should not be exact one:\
  \ \" + notCompletelyOne);\n\n// Waiting for Enter\nConsole.ReadLine();\n}\n```\n\
  ```\n\n### 讨论\n\n请注意以下几点：\n\n- 在代码中，你始终需要使用一个小数*点*作为数字整数部分和小数部分之间的分隔符。\n- 但是，输出取决于你的Windows设置。如图4-3所示，我的计算机输出使用逗号作为小数点分隔符，因为我的计算机设置为捷克语。\n\
  - 你还可以看到，小数没有无限精度。它们在大约15位有效数字后会被四舍五入。\n\n![](img/32b055c352c70d22a656320349173d95_79_0.png)\n\
  \n*图4-3.* 小数程序的结果\n\n## 第4章   使用变量\n\n### 使用逻辑值\n\n在编程中，你经常处理*逻辑值*，即“是”和“否”的值。\n\
  \n### 任务\n\n在这个任务中，我将向你展示如何处理逻辑值。\n\n### 解决方案\n\n在C#中，逻辑值的类型叫做 `bool`。“是”的值写成 `true`，“否”的值写成\
  \ `false`。以下是代码：\n\n```\n```csharp\nstatic void Main(string[] args)\n{\n    // Two\
  \ logical (Boolean) variables\n    bool thePrettiestGirlLovesMe = true;\n    bool\
  \ iAmHungry = false;\n\n    // Use exclamation mark to negate logical value\n  \
  \  bool iAmNotHungry = !iAmHungry;\n\n    // Output\n    Console.WriteLine(\"She\
  \ loves me: \" + thePrettiestGirlLovesMe);\n    Console.WriteLine(\"I am hungry:\
  \ \" + iAmHungry);\n    Console.WriteLine(\"I am not hungry: \" + iAmNotHungry);\n\
  \n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n```\n\n### 讨论\n\n请注意，当你需要对逻辑值取反（将其从“是”翻转为“否”，反之亦然）时，使用感叹号。\n\
  \n\n\n\n\n## 小结\n\n在本章中，你了解了变量这一重要概念。在每个实际程序中，您都需要将值（计算结果、用户输入等）临时存储在计算机的内存中，而变量正是用来实现这一点的。变量是内存中的一个位置，它有引用的名称，并通过数据类型明确存储其中数据的类型。\n\
  \n具体来说，你学习了以下内容：\n\n-   在使用变量之前，必须先声明它。一个合适的声明语句是`string message;`。\n-   要将值存储到变量中，需要使用*哪个\
  \ = 什么;* 的赋值语句格式。例如：`message = \"Some text\";`。\n-   在C#中，文本的数据类型是`string`。\n- \
  \  整数（整数）的数据类型是`int`。\n-   在编程中，与日常用法不同，必须注意区分整数和小数。\n-   小数的数据类型是`double`。\n- \
  \  有一个特殊的数据类型叫做`bool`，用于存储所谓的逻辑值 true 和 false，它们对应着计算机中的“是”和“否”。\n"
- "## 第5章 使用对象\n\n`string`、`int`、`double`和`bool`类型的变量总是包含一个单一值——文本、一个数字或一个“是/否”值。然而，这些“原子”值可以组合成聚合体，称为*对象*。一个对象可以包含多个值，这些值被称为其*组成部分*或*成员*。这种组合甚至可以更进一步，例如，一个对象内部可以包含多个其他对象。在本章中，你将学习有关对象的知识。\n\
  \n### 现在几点？\n\n你将遇到的第一个对象是DateTime对象，它包含某个时间点（如日、月、年、小时、分钟、秒等）的各种组成部分。\n\n### 任务\n\
  \n你将编写一个向用户显示当前日期和时间的程序（见图5-1）。\n\n![](img/32b055c352c70d22a656320349173d95_82_0.png)\n\
  \n*图5-1.* 显示当前日期和时间\n\n在此任务中，你将了解DateTime类型的对象。\n\n### 解决方案\n\n代码如下：\n\n```csharp\n\
  static void Main(string[] args)\n{\n    // Variable of DateTime type, at first empty\n\
  \    DateTime now;\n\n    // Storing of current date and time into our variable\n\
  \    now = DateTime.Now;\n\n    // Output\n    Console.WriteLine(\"Now is \" + now);\n\
  \n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n### 今天是几号？\n\n让我们进一步探索DateTime对象。\n\
  \n### 任务\n\n假设你只对今天的日期感兴趣，而不包含时间部分（见图5-2）。\n\n### 处理日期组成部分\n\n你可能想知道对象的*组成部分*在哪里。让我们来看看DateTime对象的组成部分。如果在DateTime类型的变量后附加一个点，Visual\
  \ Studio的IntelliSense会显示所有可用的组成部分。\n\n### 任务\n\n你将学习DateTime对象的各个组成部分。\n\n### 解决方案\n\
  \n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Current date and\
  \ time (using single statement)\n    DateTime now = DateTime.Now;\n\n    // Picking\
  \ up individual components\n    int day = now.Day;\n    int month = now.Month;\n\
  \    int year = now.Year;\n    int hours = now.Hour;\n    int minutes = now.Minute;\n\
  \    int seconds = now.Second;\n    DateTime justDateWithoutTime = now.Date;\n\n\
  \    // Output\n    Console.WriteLine(\"Day: \" + day);\n    Console.WriteLine(\"\
  Month: \" + month);\n    Console.WriteLine(\"Year: \" + year);\n    Console.WriteLine(\"\
  Hours: \" + hours);\n    Console.WriteLine(\"Minutes: \" + minutes);\n    Console.WriteLine(\"\
  Seconds: \" + seconds);\n    Console.WriteLine(\"Date component: \" + justDateWithoutTime);\n\
  \n    // Formatting output our way\n    Console.WriteLine(\"Our output: \" +\n \
  \       year + \", \" + month + \"/\" + day +\n        \" \" +\n        hours +\
  \ \" hours \" + minutes + \" minutes\");\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
  }\n```\n\n图5-3显示了DateTime对象的组成部分。\n\n![](img/32b055c352c70d22a656320349173d95_86_0.png)\n\
  \n*图5-3.* DateTime对象的组成部分\n\n### 使用命名空间\n\n好了，既然你已经遇到了第一个对象，我应该向你介绍一些关于命名空间的知识。\n\
  \n### 重要的using\n\n保持上一个项目处于打开状态，在Program.cs源代码中用两个斜杠注释掉第一行（`using System;`）（见图5-4）。你也可以直接删除该行。但是，为了恢复原始版本，更便捷的方式是注释掉该行。\n\
  \n提醒一下，在出现的错误对话框中，始终点击“否”。出现的“错误列表”窗格会显示大量错误——突然Visual Studio“不认识”DateTime或Console了（见图5-6）。\n\
  \n![](img/32b055c352c70d22a656320349173d95_88_0.png)\n\n*图5-6.* 错误列表窗格\n\nusing行相当重要，不是吗？我接下来将解释原因。\n\
  \n### 命名空间\n\nC#中几乎所有内容都属于某个层次更高的单元。在这种情况下，DateTime和Console都属于System *命名空间*。如果你想使用它们，必须在源代码顶部使用using行声明相应的命名空间。否则，Visual\
  \ Studio无法识别它们。\n\n为什么会有命名空间这样的东西？你为什么要用到它们？嗯，对象的名称并不是无限的，所以你需要指定你正在使用的是哪一个。例如，你不一定非要使用微软的DateTime类；你可以自己编写DateTime，或者从另一个程序员那里购买一个很棒的DateTime。这就是为什么你需要一种区分它们的方法。这个方法就是通过*命名空间*。\n\
  \n```csharp\nint year = now.Year;\nint hours = now.Hour;\nint minutes = now.Minute;\n\
  int seconds = now.Second;\nSystem.DateTime justDateWithoutTime = now.Date;\n\n//\
  \ Output\nSystem.Console.WriteLine(\"Day: \" + day);\nSystem.Console.WriteLine(\"\
  Month: \" + month);\nSystem.Console.WriteLine(\"Year: \" + year);\nSystem.Console.WriteLine(\"\
  Hours: \" + hours);\nSystem.Console.WriteLine(\"Minutes: \" + minutes);\nSystem.Console.WriteLine(\"\
  Seconds: \" + seconds);\nSystem.Console.WriteLine(\"Date component: \" +\njustDateWithoutTime);\n\
  \n// Formatting output our way\nSystem.Console.WriteLine(\"Our output: \" +\n  \
  \  year + \", \" + month + \"/\" + day +\n    \" \" +\n    hours + \" hours \" +\
  \ minutes + \" minutes\");\n\n// Waiting for Enter\nSystem.Console.ReadLine();\n\
  }\n}\n}\n```\n\n使用using是不是更好？\n\n### C# 9.0极简程序\n\n既然我们正在尝试Main方法之外的内容，现在是时候了解一下C#\
  \ 9.0的一项创新了，它允许你省略“样板代码”，即命名空间、类以及Main方法所在行（当然，还包括相应的大括号）。\n\n回到本章前面的“处理日期组成部分”，并在Visual\
  \ Studio中再次打开相应的项目。\n\n删除除了using行之外的所有非我们编写的代码。具体来说，你应该删除以namespace、class和Main开头的三行，以及三个左大括号和三个右大括号。你的Visual\
  \ Studio代码编辑器将看起来如图5-7所示。\n\n![](img/32b055c352c70d22a656320349173d95_91_0.png)\n\
  \n*图5-7.* 省略“样板代码”\n\n按F5键运行程序。起初，这可能看起来删除所有这些行并不是一个好主意（见图5-8）。\n\n```csharp\nConsole.WriteLine(\"\
  64-bit system: \" + Environment.Is64BitOperatingSystem);\nConsole.WriteLine(\"User\
  \ name: \" + Environment.UserName);\n\n// Waiting for Enter\nConsole.ReadLine();\n\
  }\n```\n\n与之前的程序不同，这里我没有将对象的组成部分提取到变量中。我直接使用了它们，以便你能看到使用它们的另一种可能方式。\n\n## 小结\n\n\
  在本章中，你了解了对象，它本质上是多个组成部分的集合体。与`int`或`string`这样的“原子”（单值）类型相反，对象通常包含多个值。\n\n具体来说，你遇到了以下内容：\n\
  \n-   DateTime对象，可用于获取当前日期或时间\n-   Environment对象，可用于获取关于程序“环境”的信息，如计算机名称或用户名\n\n\
  你还学习了以下内容：\n\n-   对象可以存储在适当类型的变量中。\n-   可以通过所谓的点表示法访问对象的组成部分。你写出对象变量的名称并附加一个点，然后借助Visual\
  \ Studio IntelliSense，就会弹出一个可用组成部分的列表。\n-   每种对象类型都属于某个命名空间。简单来说，命名空间可以看作是相似对象类型的容器。\n\
  -   一个重要的命名空间是System命名空间，它包含基本的对象类型，如DateTime或Console。\n\n\n\n\n## 第5章 使用对象\n\n\
  - 你通过源代码开头的 using 行来表示你要使用特定的命名空间。\n- 如果不包含相应的 using 行，则必须完整限定类型的名称。这意味着你需要将命名空间名称和点放在类型名称之前。\n\
  - C# 9.0 允许你省略所谓的“样板”代码，即由项目模板生成而非你手写的代码。\n"
- "## 第6章 使用对象操作\n\n你已经从前一章了解到，对象是一种由几个“数据块”组成的数据集合体。你还知道，输入对象名、点和组件名即可访问对象的各个组件。在本章中，你将发现编程中的对象更为复杂。你将学习到，除了数据组件之外，对象还能封装你可以对该对象执行的操作。通过几个任务，你将练习使用对象操作。\n\
  \n### 以文本形式显示月份\n\n第一个任务将向你介绍可以对 DateTime 对象执行的操作。\n\n**任务**\n\n你将编写一个程序，以文本形式（而非数字形式，或一般称为长格式）显示当前日期中的月份，如图\
  \ 6-1 所示。\n\n![](img/32b055c352c70d22a656320349173d95_96_0.png)\n\n图 6-1 以文本形式显示当前日期中的月份\n\
  \n你可以使用 DateTime 对象的 ToLongDateString 操作来完成此任务。\n\n**解决方案**\n\n代码如下：\n\n```csharp\n\
  static void Main(string[] args)\n{\n    // Today's date\n    DateTime today = DateTime.Today;\n\
  \n    // Output\n    Console.WriteLine(\"Today is \" + today.ToLongDateString());\n\
  \n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n**讨论**\n\n请注意以下几点：\n\
  \n- 在 C# 中调用某个对象操作时，操作名称后面总是带有括号（圆括号），即使括号内没有任何内容。\n- 括号内通常不是空的，而是包含一个*参数*（或多个参数），这些参数是操作特有的信息。例如，在\
  \ `Console.WriteLine` 操作中，你在括号内指定要显示的内容。\n- 可以对对象执行的操作也称作*方法*。\n- `ToLongDateString`\
  \ 方法显示的月份名称取决于操作系统的语言设置。\n\n### 显示明天\n\nDateTime 对象除了能将日期转换为文本外，还有更多可用的操作。日期算术尤其重要。\n\
  \n**任务**\n\n你将编写一个显示明天日期的程序（见图 6-2）。\n\n![](img/32b055c352c70d22a656320349173d95_98_0.png)\n\
  \n图 6-2 显示明天的日期\n\n**解决方案**\n\nDateTime 对象可以执行更多有趣的操作（方法），例如：\n\n- 使用 `AddDays`\
  \ 进行日期算术\n- 使用 `ToShortDateString` 以短格式显示日期\n\n代码如下：\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    // Today's date\n    DateTime today = DateTime.Today;\n\n    //\
  \ Tomorrow's date\n    DateTime tomorrow = today.AddDays(1);\n\n    // Output\n\
  \    Console.WriteLine(\"Today is \" + today.ToShortDateString() + \".\");\n   \
  \ Console.WriteLine(\"I will start learning on \" + tomorrow.ToShortDateString()\
  \ + \".\");\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n###\
  \ 显示指定日期\n\n让我们继续处理日期，并了解什么是构造函数。\n\n**任务**\n\n处理日期时，你不必总是从今天的日期开始。你也可以选择某个特定的日期（见图\
  \ 6-3）。\n\n![](img/32b055c352c70d22a656320349173d95_99_0.png)\n\n图 6-3 从指定日期开始\n\
  \n**解决方案**\n\n你可以通过调用对象的构造函数来创建一个以特定日期初始化的 DateTime 对象。输入 `new` 关键字，输入类型名称（即 DateTime），并在括号内传入可能的参数。在这种情况下，参数是年、月、日。\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    // A specific date\n    DateTime\
  \ overlordDday = new DateTime(1944, 6, 6);\n\n    // Output\n    Console.WriteLine(\"\
  D-Day (Overlord operation): \" +\n                      overlordDday.ToLongDateString()\
  \ + \".\");\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n###\
  \ 掷一个骰子\n\n关于日期的内容到此为止。现在你将学习如何处理随机性。\n\n**任务**\n\n你将编写一个“掷”三次骰子的程序（见图 6-4）。\n\n\
  ![](img/32b055c352c70d22a656320349173d95_100_0.png)\n\n图 6-4 掷骰子\n\n**解决方案**\n\n\
  要处理随机性，你需要一个*随机数生成器*。在 C# 中，你可以使用 Random 对象来实现此目的。\n\n首先，在程序运行开始时，通过调用其构造函数**一次**来创建\
  \ Random 对象，然后**重复**调用名为 Next 的方法。\n\n```csharp\nstatic void Main(string[] args)\n\
  {\n    // Creating random number generator object\n    Random randomNumbers = new\
  \ Random();\n\n    // Repeatedly throwing a die\n    int number1 = randomNumbers.Next(1,\
  \ 6 + 1);\n    int number2 = randomNumbers.Next(1, 6 + 1);\n    int number3 = randomNumbers.Next(1,\
  \ 6 + 1);\n\n    // Output\n    Console.WriteLine(\"Thrown numbers: \" +\n     \
  \   number1 + \", \" +\n        number2 + \", \" +\n        number3);\n\n    //\
  \ Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n**注意**\n\nNext 方法（操作）在括号内需要两个参数：\n\
  \n- 生成数字区间的下界\n- 上界**加上1**（抱歉，这个怪癖并不是我发明的）\n\n### 掷两个骰子\n\n继续随机数的话题，你将看到如何使用多个随机数序列。\n\
  \n**任务**\n\n你将编写一个程序，投掷一对骰子三次（见图 6-5）。我会向你展示正确的方法和错误的方法。\n\n![](img/32b055c352c70d22a656320349173d95_102_0.png)\n\
  \n图 6-5 三次掷骰子\n\n**解决方案**\n\n解决方案的关键信息是使用单一的随机数生成器。如果你几乎同时创建两个生成器，它们通常会生成相同的数字！代码如下：\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    // 1. CORRECT SOLUTION\n  \
  \  // Creating random number generator object\n    Random randomNumbers = new Random();\n\
  \n    // Repeatedly throwing two dice\n    int correctNumber11 = randomNumbers.Next(1,\
  \ 6 + 1);\n    int correctNumber12 = randomNumbers.Next(1, 6 + 1);\n\n    int correctNumber21\
  \ = randomNumbers.Next(1, 6 + 1);\n    int correctNumber22 = randomNumbers.Next(1,\
  \ 6 + 1);\n\n    int correctNumber31 = randomNumbers.Next(1, 6 + 1);\n    int correctNumber32\
  \ = randomNumbers.Next(1, 6 + 1);\n\n    // Output\n    Console.WriteLine(\"CORRECTLY\"\
  );\n    Console.WriteLine(\"Thrown couples: \" +\n        correctNumber11 + \"-\"\
  \ + correctNumber12 + \", \" +\n        correctNumber21 + \"-\" + correctNumber22\
  \ + \", \" +\n        correctNumber31 + \"-\" + correctNumber32);\n\n    // 2. INCORRECT\
  \ SOLUTION\n    // Two random number generators\n    Random randomNumbers1 = new\
  \ Random();\n    Random randomNumbers2 = new Random();\n\n    // Repeatedly throwing\
  \ two dice\n    int incorrectNumber11 = randomNumbers1.Next(1, 6 + 1);\n    int\
  \ incorrectNumber12 = randomNumbers2.Next(1, 6 + 1);\n\n    int incorrectNumber21\
  \ = randomNumbers1.Next(1, 6 + 1);\n    int incorrectNumber22 = randomNumbers2.Next(1,\
  \ 6 + 1);\n\n    int incorrectNumber31 = randomNumbers1.Next(1, 6 + 1);\n    int\
  \ incorrectNumber32 = randomNumbers2.Next(1, 6 + 1);\n\n    // Output\n    Console.WriteLine();\
  \ // empty line\n    Console.WriteLine(\"INCORRECTLY\");\n    Console.WriteLine(\"\
  Thrown couples: \" +\n        incorrectNumber11 + \"-\" + incorrectNumber12 + \"\
  , \" +\n        incorrectNumber21 + \"-\" + incorrectNumber22 + \", \" +\n     \
  \   incorrectNumber31 + \"-\" + incorrectNumber32);\n\n    // Waiting for Enter\n\
  \    Console.ReadLine();\n}\n```\n\n### 获取桌面路径\n\n作为本章的结尾，你将了解另一个对象的操作。\n\n**任务**\n\
  \n处理文件时，你可能想在用户的桌面上创建文件。但是，每个人访问桌面的文件系统路径都不同。我将向你展示如何找到该路径（见图 6-6）。\n\n![](img/32b055c352c70d22a656320349173d95_104_0.png)\n\
  \n图 6-6 查找路径\n\n**解决方案**\n\n你可以使用老朋友 Environment 对象。代码如下：\n\n```csharp\nstatic void\
  \ Main(string[] args)\n{\n    // Finding path to the desktop\n    string pathToDesktop\
  \ = Environment.GetFolderPath(Environment.\n        SpecialFolder.Desktop);\n\n\
  \    // Output\n    Console.WriteLine(\"Path to your desktop: \" + pathToDesktop);\n\
  \n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n\n## 枚举\n\n请特别注意你指定感兴趣桌面的方式。Desktop\
  \ 的值是名为 `Environment.SpecialFolder` 的*枚举*值之一。\n\n每当 Visual Studio 希望你输入枚举值时，它通常会提供相应的枚举。在这种情况下，当你从\
  \ IntelliSense 中选择 `GetFolderPath` 并随后输入左括号时，`Environment.SpecialFolder` 枚举会立即弹出（参见图\
  \ 6-7）。\n\n![](img/32b055c352c70d22a656320349173d95_105_0.png)\n\n**图 6-7.** *使用\
  \ IntelliSense*\n\n使用 Tab 键选择所提供的枚举，输入一个点，然后选择 Desktop 值。\n\n## 小结\n\n本章的主要目的是让你了解对象是比单纯的数据组件集合更复杂的实体。具体来说，它们通常包含方法，即你可以执行的操作，这些操作通常作用于对象的数据。\n\
  \n你已经熟悉了 DateTime、Random 和 Environment 对象的各种方法。具体来说，你学习了以下内容：\n\n-   使用 `ToLongDateString`\
  \ 和 `ToShortDateString` 方法将日期转换为文本\n-   日期运算的方法之一，即 `AddDays`\n-   用于在指定范围内生成单个随机数的\
  \ `Next` 方法\n-   `GetFolderPath` 方法，可用于获取特殊文件夹（如 Desktop、Documents 等）的文件系统路径\n\n\
  你还学习了如何使用构造函数调用来创建对象。你输入了 `new` 关键字，后跟对象类型的名称和括号。一些构造函数（如 Random 对象的构造函数）只需要空括号，而另一些构造函数（如\
  \ DateTime 的构造函数）则要求你在括号之间指定一些值（年、月、日）。\n\n在最后一个示例中，你还发现了所谓的枚举的用法，枚举本质上是一组预定义（枚举）值。在处理枚举时，Visual\
  \ Studio 的 IntelliSense 非常有帮助。\n\n![](img/32b055c352c70d22a656320349173d95_108_0.png)\n\
  \n## 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Some\
  \ text to try things on\n    string text = \"This is the last day of our acquaintance\"\
  ;\n\n    // What e.g. can be done with texts\n    Console.WriteLine(\"Original text:\
  \ \" + text);\n    Console.WriteLine(\"Number of characters: \" + text.Length);\n\
  \    Console.WriteLine(\"In uppercase: \" + text.ToUpper());\n    Console.WriteLine(\"\
  Does it contain word \\\"last\\\"? \" + text.Contains(\"last\"));\n\n    // Waiting\
  \ for Enter\n    Console.ReadLine();\n}\n```\n\n## 讨论\n\n数据成员（例如 `Length`）不带括号，而方法（如\
  \ `ToUpper`、`Contains`）则始终需要括号，即使括号之间没有任何内容。\n\n## 解决方案\n\n要将数字转换为其文本表示形式，请使用 `ToString`\
  \ 方法。实际上，要将**任何**内容转换为文本，在 C# 中你始终可以使用 `ToString` 方法（操作）。\n\n```csharp\nstatic void\
  \ Main(string[] args)\n{\n    // Some number\n    int number = 1234;\n\n    // Conversion\
  \ to text\n    //string numberAsText = number; // DOES NOT WORK!\n    string numberAsText\
  \ = number.ToString();\n\n    // Output\n    Console.WriteLine(\"Output of number:\
  \ \" + number);\n    Console.WriteLine(\"Output of text: \" + numberAsText);\n\n\
  \    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n## 讨论\n\n你可以看到，`int`\
  \ 类型的值不能直接赋值给 `string` 类型的变量。你必须先将其转换为文本形式。\n\n当然，在输出中你不会看到任何差异（参见图 7-3）。\n\n![](img/32b055c352c70d22a656320349173d95_111_0.png)\n\
  \n**图 7-3.** *输出*\n\n然而，很多时候你需要将数字转换为文本，但并不立即显示它。这时你会将值的文本形式存储在 string 类型的变量中，这正是你刚才看到的。\n\
  \n为了结束讨论，我将告诉你为什么在图 7-3 中显示的两行看不出任何区别：\n\n-   `Console.WriteLine` 方法会将其获得的所有内容都转换为文本。它会在幕后静默地使用\
  \ `ToString` 转换来实现这一点。\n\n-   如果你使用加号将某些文本与数字连接起来，则该数字会在 C# 中自动转换为文本。如果你希望获得更多控制权，请在处理数字时始终写下\
  \ `.ToString()`。\n\n## 数字格式化\n\n在之前的练习中，你一直在忙于将数字转换为其文本表示形式。然而，一个数字可以以多种文本形式表达。你现在将了解小数位、四舍五入、千位分隔等。\n\
  \n### 任务\n\n在本练习中，你将看到使用 `ToString` 方法获取格式良好数字输出的几个示例（参见图 7-4）。\n\n![](img/32b055c352c70d22a656320349173d95_112_0.png)\n\
  \n**图 7-4.** *格式良好的输出*\n\n### 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    // Some money amounts and a number\n    double amount = 1234.56;\n\
  \    double anotherAmount = 789;\n    int wholeNumber = 1234567;\n\n    // Formatted\
  \ outputs\n    Console.WriteLine(\"Separating thousands and millions + money to\
  \ cents\");\n    Console.WriteLine(amount.ToString(\"N2\"));\n    Console.WriteLine(anotherAmount.ToString(\"\
  N2\"));\n    Console.WriteLine(wholeNumber.ToString(\"N0\"));\n\n    // Waiting\
  \ for Enter\n    Console.ReadLine();\n}\n```\n\n与之前的练习相反，`ToString` 方法调用现在在括号之间有一个参数。*格式字符串*指定了输出的样式。\n\
  \n在此处使用的格式字符串中，`N` 表示需要千位分隔，而 2 和 0 表示输出中的小数位数。\n\n## 本地化输出\n\n普通数字格式化（如上一个任务中的格式化）根据\
  \ Windows 语言设置进行。但有时你希望输出不依赖于用户设置。你可能想要固定的语言设置，例如美式、捷克语或其他。\n\n### 任务\n\n在本练习中，你将研究两种不同语言风格（捷克语和美式）下的数字显示（参见图\
  \ 7-5）。\n\n![](img/32b055c352c70d22a656320349173d95_113_0.png)\n\n**图 7-5.** *两种不同的数字风格*\n\
  \n正如你所看到的，在捷克语中，使用空格作为千位分隔符，逗号作为小数分隔符。而在美式格式中，同一个逗号用作千位分隔符，因此你可以想象，让计算机根据 Windows\
  \ 设置决定使用哪种语言有时会导致混乱和不正确的程序行为。\n\n### 解决方案\n\n首先，在源代码顶部添加相应的 using 行（引用 `System.Globalization`\
  \ 命名空间），如图 7-6 所示。\n\n![](img/32b055c352c70d22a656320349173d95_114_0.png)\n\n**图\
  \ 7-6.** *添加 using 行*\n\n之后，像往常一样在 `Main` 方法中输入代码：\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    // Whole and decimal number\n    int wholeNumber = 1234567;\n  \
  \  double decimalNumber = 1234567.89;\n\n    // Localization objects\n    CultureInfo\
  \ czech    = new CultureInfo(\"cs-CZ\");\n    CultureInfo american = new CultureInfo(\"\
  en-US\");\n```\n\n## 类\n\n任何涉及对象的文档或教科书都充满了*类*一词的用法。那么，这是什么意思呢？简单来说，*类*是对象数据类型的同义词。你可以说“Random\
  \ 类的对象”，而不是“Random 类型的对象”。这意味着类也可以视为某种对象类型的名称。\n\n### 类与对象的关系\n\n从另一个角度来看，类也是定义特定种类对象包含什么以及如何行为的\
  \ C# 源代码。你也可以说，类充当对象的模板。例如，Random 类的源代码（由 Microsoft 拥有，而不是你）定义了*所有* Random 对象将具有哪些属性和方法。\n\
  \n因此，所有 Random 对象的行为方式相同，因为它们都是从同一个模板或同一个类创建的。对于所有 DateTime、所有 CultureInfo 等也是如此。\n\
  \n换句话说，正如面向对象编程的一句著名格言所说，*对象*是类的一个实例。*实例*一词表示单个实现或单个出现。\n\n### 特殊类\n\n在本章中，你看到了文本、数字等也具有对象般的行为。以下是它们对应的类：\n\
  \n| 数据类型 | 对应的类 |\n| --- | --- |\n| `string` | `String` |\n| `int` | `Int32` |\n\
  | `double` | `Double` |\n| `bool` | `Boolean` |\n| `...` | `...` |\n\n在 C# 中，你可以互换使用\
  \ `string` 和 `String`、`int` 和 `Int32`，以此类推。当然，你需要在源代码顶部添加 `using System;` 行，因为所有对应的类都属于该特定命名空间。\n\
  \n\n\n\n## 结构\n\n在 C# 中，你同样可能会遇到术语*结构*或*结构体*。什么是结构？\n\n嗯，你可以将它们视为某种轻量级的类。在初学者水平上，它们与普通类几乎无法区分，因此在很长一段时间内，你可以在任何看到*结构*或*结构体*的地方简单地用*类*一词替代。\n\
  \n例如，DateTime 就是结构的一个典型例子。然而，为了简便起见，在本书中所有地方我都将 DateTime 与 Random 或 CultureInfo\
  \ 等普通类同等对待。在本书的层面上，你可能会感觉到的唯一细微差别是，DateTime 对象不一定非要通过构造函数调用等方式显式创建。只需声明一个该类型的变量即可，尽管这可能不太实际。\n\
  \n## 小结\n\n在本章中，你了解到即使是普通的文本和数字也可以表现得像对象一样。具体来说，你学习了以下内容：\n\n- Length 属性，以及文本/字符串的\
  \ ToUpper 和 Contains 方法\n- 数字的 ToString 方法\n\n在后一种情况中，你还看到了 ToString 方法生成的输出可以由格式字符串（如\
  \ N2 等）和语言规范（CultureInfo 对象）来控制。将来，你会发现对 C# 中的几乎所有内容使用 ToString 方法都很方便，而不仅仅是数字。\n\
  \n你首次初步了解了对象编程的术语。具体请注意以下几点：\n\n- 与普通对象相反，静态对象始终以单一副本存在。虽然你可以拥有任意多个 DateTime，但你始终只有一个\
  \ Console。\n- *类*一词是“对象数据类型”的同义词。你经常会读到特定类的对象，这意味着“特定类型的对象”。\n"

  - 该条件有意让 AND 运算符比 OR 运算符具有*更高的优先级*（优先顺序）。具体来说，先分别对两个潜在用户进行判断，然后再对部分结果进行 OR 运算。\n\
  - 如果你需要不同的求值顺序，只需像数学中那样使用圆括号即可。\n\n### 条件预计算\n\n上一个练习中的复合条件已经相当复杂。要理解它，阅读时必须集中注意力。在类似情况下，预先计算（提前计算）部分条件可能会更好。我现在就来演示这一点。\n\

  \ number is odd\");\n    }\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
  }\n```\n\n## 不区分大小写\n\n你已经知道，可以对两段文本进行比较，看它们是否相等或不相等。这种比较是区分大小写的。换句话说，`hobbit` 和\
  \ `Hobbit` 被认为是不同的单词。然而，你经常需要进行不区分大小写的比较，我现在就来向你展示如何操作。\n\n\n\n"

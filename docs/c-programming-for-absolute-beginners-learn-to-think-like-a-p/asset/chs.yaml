  \    Console.ReadLine();\n}\n```\n\n#### 讨论\n\n有时候，佣金百分比可能是小数。在这个例子中，我选择了整数，因为我想通过一个实际示例向你展示如何正确地进行整数除法。如你所知，要执行“正常”除法，你需要至少一个数字——无论位于斜杠前还是斜杠后——必须是\
  \ double 类型。这就是你使用 100.0 的原因。\n\n如果你改用 100，结果会令人惊讶（见图 10-4）。\n\n### 舍入\n\n![](img/32b055c352c70d22a656320349173d95_152_0.png)\n\
  \n*图 10-5. 舍入程序*\n\n#### 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n\

  我使用了大于运算符来将输入的数字与零进行比较。\n你认为当用户输入零时程序会做什么？它会检查条件 `0 > 0`，并发现该条件不成立。因此，它会显示该数字不是正数。这就是为什么消息措辞相当不寻常（“……不是正数”），如图\

  \n图4-1. 1加1程序的结果\n\n### 讨论\n\n请将1加1的计算与上一章中的计算进行比较。在这里，你显式地将结果存储在变量中。这样可以避免求值顺序可能带来的问题，以及得到错误答案11。\n\
  \n### 使用变量进行计算\n\n在下一个任务中，你将学习如何同时使用多个变量。\n\n### 任务\n\n你将把一些数字存储在两个变量中。然后，你将它们的总和计算到第三个变量中。\n\
  \n### 解决方案\n\n以下是代码：\n\n```\nstatic void Main(string[] args)\n{\n    // 1. SOLUTION\n\
  \    // Values to be summed\n```\n```\nint firstNumber = 42;\nint secondNumber =\
  \ 11;\n\n// Calculating\nint sum = firstNumber + secondNumber;\n\n// Output\nConsole.WriteLine(\"\
  Sum is: \" + sum);\n\n// 2. SOLUTION\n// Declaring all variables at once\nint thirdNumber,\
  \ fourthNumber, newSum;\n\n// Values to be summed\nthirdNumber = 42;\nfourthNumber\

  \n这种情况类似于滑雪比赛，选手们一个接一个到达终点。某一时刻，有人是第一名；稍后，其他人可能会把第一名挤到第二名。可能在更晚的时候，那名滑雪者甚至会失去第二名，只是因为有人比他们更好，甚至比新的领跑者更好。\n\

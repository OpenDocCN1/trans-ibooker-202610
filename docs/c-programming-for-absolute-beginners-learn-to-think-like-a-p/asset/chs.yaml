  N2\"));\n    Console.WriteLine(\"VAT: \" + vat.ToString(\"N2\"));\n\n    // Waiting\
  \ for Enter\n    Console.ReadLine();\n}\n```\n\n## 总结\n\n在本章中，你练习了对来自经济世界的各种实际示例进行计算。这些计算中最重要的始终是首先理解现实世界的问题。为了理解如何在没有程序的情况下得到结果，请先使用铅笔、纸和计算器。适当的结构化程序也很常见，将整个计算分成小块，并为变量使用描述性的名称。\n\

  \n## 进行更复杂的计算\n\n当然，你不需要计算机来计算 1 加 1。但如果是 1 加 2 乘以 3 呢？你是否又觉得这简单得可笑？稍等一下，因为即使在这种简单的情况下也很容易出错！\n\
  \n## 任务\n\n你将创建一个程序来计算 1 加 2 乘以 3。\n\n## 解决方案\n\n代码如下：\n\n```csharp\nstatic void\
  \ Main(string[] args)\n{\n    // Multiplication has greater priority\n    Console.WriteLine(1\
  \ + 2*3);\n\n    // Forcing priority using parentheses\n    Console.WriteLine((1\
  \ + 2)*3);\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n运行后的程序如图\
  \ **3-3** 所示。\n\n![图 3-3](img/32b055c352c70d22a656320349173d95_63_0.png)\n\n***图\
  \ 3-3.*** *进行更复杂的计算*\n\n## 讨论\n\n关于这个程序，请注意以下几点：\n\n- 本任务旨在向你展示，你必须始终清楚到底需要计算什么。在这个示例中，你需要决定先进行加法还是先进行乘法。\n\
  - 在基础数学规则中，乘法和除法的优先级高于加法和减法。编程中的规则与数学中相同。如果你想先计算 1 加 2，再乘以 3，就需要用括号将 1 和 2 括起来。\n\
  - 我没有在乘号（星号）周围添加空格，但这与计算顺序无关。我只是认为这样看起来更好。在 C# 中，空格和换行无关紧要。（当然，你不应该把一个单词从中间断开。）\n\
  - 最后，这个示例表明计算机按照语句编写的顺序执行程序语句。也就是说，从上到下执行。\n\n## 拼接文本\n\n你现在将了解加号运算符（+）不仅可以用于数字，也可以用于文本。换句话说，它可以将文本拼接在一起。\n\
  \n## 任务\n\n任务是探索如何将文本拼接在一起（见图 3-4）。\n\n![图 3-4](img/32b055c352c70d22a656320349173d95_64_0.png)\n\
  \n*图 3-4.* 拼接文本\n\n## 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[] args)\n\
  {\n    // Normal text\n    Console.WriteLine(\"I have started to program\");\n \
  \   // Also normal text\n    Console.WriteLine(\" in C#.\");\n\n    // Joining two\
  \ texts using plus sign\n    Console.WriteLine(\"I have started to program\" + \"\
  \ in C#.\");\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\n注意介词\
  \ *in* 前面的空格！\n\n## 输出特殊字符\n\n有时，你需要向屏幕输出特殊字符。以下是一些示例：\n\n- 输出回车来结束一行。\n- 输出引号。（在\
  \ C# 中，引号用作文本分隔符，因此必须特殊处理。）\n- 输出 Unicode 字符（当然，前提是你的字体能够显示它）。\n\n## 任务\n\n现在你将编写一个程序，演示如何处理特殊字符。\n\
  \n## 解决方案\n\n要处理特殊字符，你需要使用*转义序列*。在 C# 中，转义序列以反斜杠开头。\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    // Multiline output\n    Console.WriteLine(\"First line\\r\\nSecond\
  \ line\");\n\n    // I prefer specifying \"Enter\" in more human form\n    Console.WriteLine(\"\
  First line\" + Environment.NewLine + \"Second line\");\n\n    // Text containing\
  \ a quote\n    Console.WriteLine(\"The letter started so sweet: \\\"My Darling\\\
  \"\");\n\n    // Unicode characters, in this case Greek beta\n    Console.WriteLine(\"\
  If the font knows, here is Greek beta: \\u03B2\");\n\n    // Backslashes themselves\
  \ need to be doubled\n    Console.WriteLine(\"Path to desktop on my computer: \"\
  \ + \"C:\\\\Users\\\\vystavel\\\\Desktop\");\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
  }\n```\n\n结果应如图 3-5 所示。\n\n![图 3-5](img/32b055c352c70d22a656320349173d95_66_0.png)\n\
  \n*图 3-5. 处理特殊字符*\n\n## 讨论\n\n关于这个程序，请注意以下几点：\n\n- 在 C# 中，文本中的反斜杠会引入所谓的转义序列。但如果想要输出反斜杠该怎么办？那就需要将其写两次。在处理\
  \ Windows 操作系统中的文件路径时，经常会出现这种情况。\n- 控制台应用程序甚至会将简单的 \\n 识别为行终止符（表示回车）。然而，在许多其他 C#\
  \ 程序中，你需要“完整的回车”，即 \\r\\n。这就是为什么你在本程序中使用了它。你还使用了 Environment.NewLine，这绝对是最佳选择，因为它具有良好的可读性。\n\
  \n## 使用预格式化文本\n\n有时，你可能希望一次性显示多行文本（见图 3-6）。\n\n![图 3-6](img/32b055c352c70d22a656320349173d95_67_0.png)\n\
  \n**图 3-6.** 多行文本\n\n## 任务\n\n你将创建一个程序来显示多行文本。\n\n## 解决方案\n\n在文本的开头引号前加上 at（@）符号，如下所示：\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    // Bob Dylan...\n    Console.WriteLine(@\"\
  \ Yes, and how many times can a man turn his head\n    and pretend that he just\
  \ doesn’t see?\");\n\n    // Waiting for Enter\n    Console.ReadLine();\n}\n```\n\
  \n## 注意\n\nat（@）符号也会关闭转义序列。这就是为什么在处理 Windows 中的文件路径（前面提到过）时，它可能很有用；在这种情况下，你不需要将每个反斜杠都写成双份。\n\
  \n## 计算 1 加 1\n\n在下一个任务中，你将回到 1 加 1 的问题。你是否奇怪为什么我要回到这么简单的任务？嗯，即使像 1 加 1 这样简单的事情也可能出错。让我们来看看。\n\
  \n## 任务\n\n任务是探索将两个数字组合在一起的不同方式（见图 3-7）。\n\n![图 3-7](img/32b055c352c70d22a656320349173d95_69_0.png)\n\
  \n*图 3-7. 将数字组合在一起*\n\n## 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    // Pay special attention when mixing texts with numbers!\n    Console.WriteLine(\n\
  @\"Senior math test\n=================\n\nOne and one is:\");\n    Console.WriteLine(\"\
  a) \" + 1 + 1);\n    Console.WriteLine(\"b) \" + (1 + 1));\n    Console.WriteLine(\"\
  c) \" + \"mostly fun\");\n\n    // Waiting for Enter\n    Console.ReadLine();\n\
  }\n```\n\n## 讨论\n\n当你将数字与文本混合时，结果可能与你的预期不同！\n\n让我们考虑第一个答案 (a)。计算机从左到右计算整个表达式。首先，它取文本\
  \ a) 和一个数字（第一个 1），将它们拼接成 a) 1。然后，它再取这个新文本和最后一个数字（第二个 1），再次拼接，得到文本 a) 11。\n\n第二个答案\
  \ (b) 则不同。括号让计算机先执行数字相加，之后才拼接左侧的文本。\n\n有时，预先计算中间结果并将其存储在变量中可能更清晰。这正是你将在下一章学习的内容。当然，变量远不止这些用途，你接下来会看到。\n\
  \n## 小结\n\n在本章中，你探索了 Console.WriteLine 语句为你提供的几种不同输出可能性。具体来说，你学习了以下内容：\n\n- 除了文本之外，你还可以在程序中使用数字。与文本不同，数字不需要用引号括起来。\n\
  - 你可以将多个值组合成表达式。为此，可以使用 +、- 和 * 等运算符。对于数字，它们执行普通算术运算。加号运算符也可以用于文本，在这种情况下，它会将两段文本拼接成一段。\n\
  - 在计算中，你始终要注意结果的求值顺序。乘法和除法的优先级高于加法和减法。要强制使用不同的求值顺序，请使用括号。\n- 特殊字符（如引号或换行符）可以用以反斜杠开头的转义序列输出。\n\
  - 通过在文本前加上 at（@）符号，你可以方便地输出预格式化的多行文本。\n\n\n\n\n"
- "## 第4章\n### 使用变量\n\n在本章中，你将全面了解变量。*变量*是计算机内存中的一个具名位置，程序可以在其中存储内容。它可以是任何你想要的东西。事实上，你可以在程序中拥有任意数量的变量，只要需要。\n\
  \n本章将从一些简单的示例开始，但最终你会看到变量对于编程来说是绝对基础的。\n\n### 存储文本\n\n第一个任务将向你介绍变量。你将学习如何使用变量执行一些基本操作。\n\
  \n### 任务\n\n你将创建一个名为 `message` 的变量。随后，你将在其中存储一些文本。最后，你将向用户显示该变量的值。\n\n### 解决方案\n\
  \n以下是代码：\n\n```\nstatic void Main(string[] args)\n{\n    // Declaration of a variable\
  \ to store text\n    string message;\n\n    // Storing a value in prepared variable\
  \ (assignment statement)\n    message = \"I can't live with you.\";\n```\n```\n\
  ```csharp\n// Another variable (initialized with some value)\nstring anotherMessage\
  \ = \"I can't live without you.\";\n\n// Output of variables\nConsole.WriteLine(message);\n\
  Console.WriteLine(anotherMessage);\n\n// Waiting for Enter\nConsole.ReadLine();\n\
  }\n```\n```\n\n### 讨论\n\n现在让我们来讨论这个解决方案。\n\n### 变量声明\n\n如果要使用变量，你需要首先*声明*（创建）它。\n\
  \n变量声明语句的一般语法如下：\n\n*类型名*`[space]`*变量名*`[semicolon]`.\n\n在这种情况下，其写法如下：\n\n```\n\
  ```csharp\nstring message;\n```\n```\n\n### 另一种方式\n\n还有一种编写变量声明语句的方式。在分号之前，你可以使用等号和变量的初始值。\n\
  \n以下是这种语法的一个示例：\n\n```\n```csharp\nstring anotherMessage = \"I can't live without\

  \ product = number1 * number2;\n    double quotient = number1 / number2;\n\n   \
  \ // Output\n    Console.WriteLine(\"Sum is \" + sum);\n    Console.WriteLine(\"\
  Difference is \" + difference);\n    Console.WriteLine(\"Product is \" + product);\n\
  \    Console.WriteLine(\"Quotient is \" + quotient);\n\n    // Waiting for Enter\n\
  \    Console.ReadLine();\n}\n```\n\n## 数学函数\n\n在进行工程或财务计算时，你通常需要比前一练习中展示的四种基本运算更复杂的操作。现在你将看到如何使用内置（预定义）数学函数来执行这些复杂操作。\n\
  \n### 任务\n\n为了让你初步了解可用的数学函数，在本任务中，你将计算输入数字的正弦值和平方根（见图 9-5）。\n\n![](img/32b055c352c70d22a656320349173d95_139_0.png)\n\
  \n*图 9-5.* *计算正弦值和平方根*\n\n### 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    // Input of angle\n    Console.Write(\"Enter an angle in degrees:\
  \ \");\n    string input = Console.ReadLine();\n    double angleInDegrees = Convert.ToDouble(input);\n\
  \n    // Calculation and output of sine value\n    double angleInRadians = angleInDegrees\
  \ * Math.PI / 180;\n    double result = Math.Sin(angleInRadians);\n    Console.WriteLine(\"\
  Sine of the angle is: \" + result);\n\n    // Input of a positive number\n    Console.WriteLine();\n\
  \    Console.Write(\"Enter a positive number: \");\n    input = Console.ReadLine();\n\
  \    double number = Convert.ToDouble(input);\n\n    // Calculation and output of\
  \ square root\n    Console.WriteLine(\"Square root of the number is: \" + Math.Sqrt(number));\n\
  }\n```\n\n## 整数除法\n\n在各种计算平台上，整数除法的运算方式与“普通”除法不同。遗憾的是，在 C# 中，两种除法都使用相同的运算符——斜杠 (/)。具体规则如下：\n\
  \n- 如果在两个 `int` 类型的值之间放置斜杠，该斜杠将执行整数除法。\n- 如果两个值中至少有一个是 `double` 类型，则斜杠执行“普通”除法。\n\
  \n这种行为可能会导致糟糕且难以发现的错误。这种行为已有 45 年的历史，源于 C 语言诞生之时；遗憾的是，C# 等一些较新的语言也继承了这种行为。只需注意这一点，并在使用斜杠时小心谨慎。\n\
  \n### 任务\n\n在本练习中，你将探索用户输入的两个数字的“普通”除法和整数除法（见图 9-6）。\n\n![](img/32b055c352c70d22a656320349173d95_141_0.png)\n\
  \n*图 9-6.* 探索“普通”除法和整数除法\n\n### 解决方案\n\n代码如下：\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    // Inputs\n    Console.Write(\"Enter 1. whole number (dividend):\
  \ \");\n    string input1 = Console.ReadLine();\n    int number1 = Convert.ToInt32(input1);\n\
  \n    Console.Write(\"Enter 2. whole number (divisor): \");\n    string input2 =\
  \ Console.ReadLine();\n    int number2 = Convert.ToInt32(input2);\n\n    // Integer\
  \ calculations\n    int integerQuotient = number1 / number2;\n    int remainder\
  \ = number1 % number2;\n\n    // \"Normal\" calculations\n    double number1double\
  \ = number1;\n    double number2double = number2;\n    double normalQuotient = number1double\
  \ / number2double;\n\n    // Alternatively\n    double normalQuotientAlternatively\
  \ = (double)number1 / (double)number2;\n\n    // Outputs\n    Console.WriteLine(\"\
  ----------------\");\n    Console.WriteLine(\"Integer quotient: \" + integerQuotient\
  \ +\n        \" with remainder \" + remainder);\n    Console.WriteLine(\"\\\"Normal\\\
  \" quotient : \" + normalQuotient);\n    Console.WriteLine(\"\\\"Normal\\\" quotient\
  \ (alternatively): \" +\n        normalQuotientAlternatively);\n\n    // Waiting\
  \ for Enter\n    Console.ReadLine();\n}\n```\n\n\n\n## 讨论\n\n请注意以下事项：\n\n- 要计算余数，可以使用\
  \ `%` 运算符（百分号）。\n- 我已经向你展示了两种将输入值强制转换为 double 类型以实现“正常”除法的方法。\n  - 赋值给 `double`\
  \ 类型的变量。\n  - *类型转换*为 `double`；在值前面加上括号中的目标类型。\n\n## 小结\n\n在本章中，你更详细地探讨了数字。你已经知道在计算中整数和小数之间的区别，也知道如何读取整数；在本章中，你学习了如何读取小数。你还发现，读取小数是与语言相关的，如果不小心，可能会导致令人惊讶的结果。如果你没有指定要使用的语言，将使用\
  \ Windows 语言设置来读取数字。具体来说，你学习了以下内容：\n\n- 使用 `Convert.ToDouble` 方法将文本形式的用户输入转换为实际的小数\n\
  - 将转换后的值存储在 `double` 类型的变量中\n- 通过将 `CultureInfo` 对象作为第二个参数传递给转换方法，来强制执行语言设置\n\n\
  此外，你学习了如何使用运算符 `+`、`-`、`*` 和 `/` 进行基本算术运算，以及如何使用（静态）`Math` 对象的内置数学函数执行更复杂的操作。\n"

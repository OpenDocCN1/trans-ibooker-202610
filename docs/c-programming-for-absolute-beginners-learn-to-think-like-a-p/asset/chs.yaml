  ```\n\n不要忘记，数字输入时*不带引号*。\n\n### 1加1相加\n\n什么？又是1加1？你可能以为我疯了！\n\n### 任务\n\n在上一章中，我告诉过你，将数字与文本组合时，变量可以为你提供更高的确定性。现在我要回到那个建议。\n\
  \n### 解决方案\n\n以下是代码：\n\n```\n```csharp\nstatic void Main(string[] args)\n{\n   \
  \ // Precalculation of result (into a variable)\n    int sum = 1 + 1;\n    // Output\

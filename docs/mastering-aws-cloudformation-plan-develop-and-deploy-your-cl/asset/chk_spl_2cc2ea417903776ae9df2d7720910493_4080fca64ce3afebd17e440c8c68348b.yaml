- 'no': 6216
  overturn_probability: 0.15
  alternative: 正文小标题
  counter_evidence:
  - 标题使用 `##` (二级标记) 而非 `#` (一级标记)，在标准 Markdown 语义中通常代表章节内的 Section 而非顶层 Chapter，若全书以
    `#` 为章标题则此行应为节标题。
  - 上下文中前一章结束标志（如 `### 概要`、`### 问题`、`### 延伸阅读`）均为三级标题 `###`，跳跃至 `##` 存在层级不连贯嫌疑，可能源于排版格式不统一而非真实章界。
  - 标题含冒号及长副标题（'使用 AWS CDK 生成 CloudFormation 模板'），长度接近 30 字，超出典型章标题简短概括特征，更符合节标题描述性命名风格。
  keep_split: true

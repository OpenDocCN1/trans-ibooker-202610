  * 包含示例自定义资源的 GitHub 仓库：<https://github.com/aws-samples/aws-cfn-custom-resource-examples>\n\
  \n---\n\n## 第 8 章：使用模板宏动态渲染模板"
- "\n有时当我们使用模板时，希望在堆栈操作期间动态地为资源分配值或快速修改模板。\n\n最知名的模板宏之一是 **SAM** 或 **无服务器应用程序模型**，它是用于无服务器应用程序的简化\
  \ CloudFormation 模板（我们将在接下来的几章中介绍 SAM）。另一个知名的宏是 **AWS::Include**，它允许我们用样板代码片段扩展\
  \ CloudFormation 模板。\n\n在本章中，我们将了解模板宏及其用例，并开发我们自己的宏。\n\n在本章中，我们将涵盖以下主题：\n\n* 理解模板宏的用例\n\
  * 介绍模板宏\n* 编写您自己的宏\n\n### 技术要求\n\n本章使用的代码可以在本书的 GitHub 仓库中找到：<https://github.com/PacktPublishing/Mastering-AWS-CloudFormation/tree/master/Chapter8>。\n\
  \n查看以下视频以了解代码实战：\n\n<https://bit.ly/2zBBLnd>\n\n### 理解模板宏的用例\n\n在深入了解宏的内部机制之前，我们需要知道可以用它们解决什么问题。让我们看几个案例和示例。\n\
  \n### 自动填充资源属性值\n\n想象一下，您有一个启动模板，需要在其中定义 AMI ID。对于 Amazon Linux AMI，您可以使用 AWS 的参数存储：\n\
  \n```yaml\nParameters:\n  ImageId:\n    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>\n\
  \    Default: '/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2'\n\n\
  Resources:\n  LaunchTemplate:\n    Type: \"AWS::EC2::LaunchTemplate\"\n```\n\n\n\
  \n### 属性\n\n```yaml\nLaunchTemplateData:\n  ImageId: !Ref ImageId\n```\n\n但如果我们不使用\
  \ Amazon Linux，而是使用 Ubuntu 怎么办？我们将不得不手动指定 AMI ID 并使用映射：\n\n```yaml\nMappings:\n\
  \  RegionMap:\n    us-east-1:\n      \"HVM64\": \"ami-123\"\n    us-west-1:\n  \
  \    \"HVM64\": \"ami-456\"\n    # 以此类推...\n```\n\n```yaml\nResources:\n  Inst:\n\
  \    Type: AWS::EC2::Instance\n    Properties:\n      ImageId: !FindInMap [RegionMap,\
  \ !Ref \"AWS::Region\", HVM64]\n```\n\n或者我们可以构建一个宏来为我们查找并在模板中使用它。\n\n以下模板展示了如何使用宏填充\
  \ AMI ID：\n\n```yaml\nResources:\n  LaunchTemplate:\n    Type: \"AWS::EC2::LaunchTemplate\"\
  \n    Properties:\n      LaunchTemplateData:\n        ImageId:\n          Fn::Transform:\n\
  \            Name: FindAmi\n            Parameters:\n              OSFamily: ubuntu\n\
  ```\n\n正如前面的示例所示，宏名称在内部函数 `Fn::Transform` 之后提供，随后是其参数。在堆栈操作期间，宏将存储必要的 AMI ID。让我们看另一个例子。\n\
  \n### 添加额外资源\n\n假设我们有一种资源，它对每个堆栈都相同，但必须单独成为每个堆栈的一部分——例如，应用程序的 CloudWatch 规则和警报。我们可以反复复制粘贴相同的资源声明，这被视为代码重复，属于不良实践。\n\
  \n对于这种情况，有一个名为 `AWS::Include` 的 CloudFormation 宏。`AWS::Include` 宏会在 S3 上查找模板，并将当前模板追加一个额外的模板。`AWS::Include`\
  \ 宏不是*全局*宏，因此必须在 `Resources` 部分声明，如下面的代码所示：\n\n```yaml\nResources:\n  # ... 我们的一些资源...\n\
  \  \"Fn::Transform\":\n    Name: \"AWS::Include\"\n    Parameters:\n      Location:\
  \ \"s3://mybucket/my_set_of_resources.yaml\"\n```\n\n虽然这是一个常用宏，但我们应该避免使用重复资源并妥善组织我们的堆栈。\n\
  \n### 让资源声明对开发者更简单\n\n我们有一套标准的应用程序开发方式。假设每个应用程序都是一个在 Fargate 上运行的 ECS 任务。它可能有也可能没有额外资源，并且将始终与其他应用程序运行在同一个\
  \ ECS 集群上。我们可以制作一个包含条件元素的巨大模板，要求开发者提供大量参数，或者我们可以借助宏为他们制作一个简洁易用的模板。\n\n以下示例模板展示了这种*标准*应用程序的样子：\n\
  \n```yaml\nTransform: StandardApplication\nResources:\n  Application:\n    Properties:\n\
  \      TaskCount: 1\n      Memory: 512\n      CPU: 256\n      RDS: postgresql\n\
  \      RDSSize: db.t2.micro\n      # 以此类推...\n```\n\n在转换期间，宏将评估属性并渲染一个新模板，如下所示：\n\
  \n```yaml\nResources:\n  EcsTaskDefinition:\n    Type: # ...\n    Properties:\n\
  \      Cpu: 256\n      Memory: 512\n      # ...\n  EcsService:\n    Type: #...\n\
  \    Propeties:\n      DesiredCount: 1\n      # ...\n### 以此类推...\n```\n\n开发者将始终掌控其应用程序的基础设施和资源，但无需深入钻研\
  \ CloudFormation 和 AWS。\n\n这听起来不错，但我们如何实现？让我们看看模板宏到底是什么。\n\n### 介绍模板宏\n\n首先，宏是 CloudFormation\
  \ 的可选部分。AWS 已经为我们提供了自己的宏（`AWS::Serverless` 和 `AWS::Include`）——它们是 CloudFormation\
  \ 的一部分，每当我们在模板或资源中使用转换时就会执行。\n\n自定义宏（即我们创建的宏）也是 CloudFormation 的一部分，并作为类型为 `AWS::CloudFormation::Macro`\
  \ 的资源创建。每个宏本质上都是一个 Lambda 函数，类似于自定义资源，因为它接收来自 CloudFormation 的事件并需要返回响应。\n\n此 Lambda\
  \ 函数将接收模板的一部分（或完整模板），运行自定义处理，并返回转换后的模板。\n\n来自 CloudFormation 的请求将如下所示：\n\n```json\n\
  {\n  \"region\" : \"...\",\n  \"accountId\" : \"...\",\n  \"fragment\" : { ... },\n\
  \  \"transformId\" : \"...\",\n  \"params\" : { ... },\n  \"requestId\" : \"...\"\
  ,\n  \"templateParameterValues\" : { ... }\n}\n```\n\n以下是关键代码术语及其说明：\n\n- **fragment**：模板的一部分或完整模板\n\
  - **params**：参数列表，如果宏函数通过内部函数 `Fn::Transform` 调用\n- **templateParameterValues**：模板参数\n\
  \n`templateParameterValues` 与 `params` 不同，这些值在处理前（模板验证步骤期间）进行求值。\n\n处理后，我们的 Lambda\
  \ 应返回响应。此响应应包含请求标识符（与原始请求完全相同）、状态和处理后的内容。总之，它将如下所示：\n\n```json\n{\n  \"requestId\"\
  \ : \"...\",\n  \"status\" : \"...\",\n  \"fragment\" : { ... }\n}\n```\n\n在创建我们自己的宏之前，我们需要了解一些可能面临的限制。\n\
  \n### 注意事项\n\n宏为简化 CloudFormation 模板开发带来了诸多好处，但编写时需要牢记许多事项。\n\n主要是，我们需要知道以下事实：\n\
  \n- 宏仅在 AWS Lambda 可用的区域工作\n- 处理后的模板必须通过验证检查\n- 宏不支持迭代——我们不能在宏中包含宏\n- 宏不支持 `Fn::ImportValue`\n\
  - 宏在 `StackSets` 中不受支持\n\n> **重要提示**\n>\n> 有关完整注意事项列表，请阅读 CloudFormation 文档 (https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/template-macros.html)。\n\
  \n这些是我们需要牢记的主要事项。现在，让我们为本章开头提到的几种情况构建宏。\n\n### 编写你自己的宏\n\n在本节中，我们将开发宏来解决本章第一节《理解模板宏的用例》中介绍的情况。这将帮助我们获得一些实践经验，并练习部分和完整模板处理。\n\
  \n让我们从 AMI ID 填充器开始！\n\n### AMI ID 填充器\n\n让我们从一个简单的任务开始，创建一个自动为 EC2 查找 AMI ID 的宏。在本节结束时，我们将拥有一个能自动将正确的\
  \ AMI 放入资源属性的宏。\n\n正如你可能记得的，我们的主模板将如下所示：\n\n```yaml\nResources:\n  LaunchTemplate:\n\
  \    Type: \"AWS::EC2::LaunchTemplate\"\n    Properties:\n      LaunchTemplateData:\n\
  \        # 这是 ImageId 字段的替代品：\n        Fn::Transform:\n          Name: AMIFiller\n\
  \          Parameters:\n            OSFamily: ubuntu\n```\n\n这意味着 CloudFormation\
  \ 将发送带有以下负载的请求：\n\n```json\n{\n  \"region\" : \"...\", # 堆栈所在的区域名称\n  \"accountId\"\
  \ : \"...\",  # AWS 账户 ID\n  \"fragment\" : { ... }, # 模板片段\n  \"transformId\" :\
  \ \"...\", # 转换的唯一 ID\n  \"params\" : { \"OSFamily\": \"ubuntu\" },\n  \"requestId\"\
  \ : \"...\", # Lambda 的请求 ID\n  \"templateParameterValues\" : { ... } # 模板参数\n}\n\
  ```\n\n因此我们只需返回包含所需 AMI ID 的字符串。响应体将如下所示：\n\n```json\n{\n  \"requestId\" : \"...\"\
  , # 与原始请求相同\n  \"status\" : \"...\",  # SUCCESS 或 FAILURE\n  \"fragment\" : { \"\
  ImageId\": \"ami-123454321\" }\n}\n```\n\n让我们开始开发一个 Lambda 函数，以便我们的宏能找到合适的 AMI：\n\
  \n\n\n### 1. 我们将从一个实际函数开始，该函数将调用 EC2 的 API 以检索 AMI ID\n\n**amifinder.py**\n\n```python\n\
  image_names = {\n    \"amazonlinux2\": \"amzn2-ami-hvm-2.0.20191217.0-x86_64-gp2\"\
  ,\n    \"ubuntu\": \"ubuntu/images/hvm-ssd/ubuntu-bionic-18.04-amd64-server-20200112\"\
  ,\n    \"rhel\": \"RHEL-8.0.0_HVM-20190618-x86_64-1-Hourly2-GP2\",\n    \"sles\"\
  : \"suse-sles-15-sp1-v20191112-hvm-ssd-x86_64\"\n}\n\ndef get_image(img_name):\n\
  \    client = boto3.client(\"ec2\")\n    resp = client.describe_images(Filters=[{\"\
  Name\": \"name\",\n                                            \"Values\": [img_name]}])\n\
  \    return resp['Images'][0]['ImageId']\n```\n\n由于 AWS 拥有大量 AMI（包括新旧版本），很难用单个词（如\
  \ `ubuntu` 或 `rhel`）找到所需的镜像，因此我们将创建一个包含确切 AMI 名称的字典。\n\n然后我们使用一个函数来连接 API 并请求该名称的\
  \ AMI ID。\n\n### 2. 现在我们需要处理程序函数\n\n**amifinder.py**\n\n```python\ndef lambda_handler(event,\
  \ context):\n    response = {}\n    response['requestId'] = event['requestId']\n\
  \    response['fragment'] = {\"ImageId\": \"\"}\n    response['status'] = \"SUCCESS\"\
  \n    osfamily = event['params']['OSFamily']\n    if osfamily not in image_names.keys():\n\
  \        response['status'] = \"FAILURE\"\n        return response\n    image_id\
  \ = get_image(image_names[osfamily])\n    response['fragment'][\"ImageId\"] = image_id\n\
  \    return response\n```\n\n此函数将解析来自 CloudFormation 的事件。如果提供的参数 `OSFamily` 不等于\
  \ `ubuntu`、`amazonlinux2`、`rhel` 或 `sles`，它将立即返回带有空主体的 `FAILURE`，向 CloudFormation\
  \ 发出宏失败的信号；否则，它将调用 `get_image()` 函数并形成适当的响应。\n\n### 3. 现在我们需要创建一个宏堆栈（从而注册宏函数）\n\n\
  ```bash\n$ aws cloudformation deploy --stack-name amimacro \\\n    --template-file\
  \ macro.yaml \\\n    --capabilities CAPABILITY_IAM\n```\n\n### 4. 我们的宏已就位。让我们创建一个模板来测试它。我们的测试模板小而简单；我们只需要检查宏是否执行其功能\n\
  \n**lt.yaml**\n\n```yaml\nResources:\n  Lt:\n    Type: AWS::EC2::LaunchTemplate\n\
  \    Properties:\n      LaunchTemplateData:\n        Fn::Transform:\n          Name:\
  \ AMIFiller\n          Parameters:\n            OSFamily: \"ubuntu\"\n```\n\n###\
  \ 5. 我们将从该模板创建一个堆栈\n\n```bash\n$ aws cloudformation deploy --stack-name lt --template-file\
  \ lt.yaml\n```\n\n### 6. 过一会儿，我们将看到堆栈已创建。让我们在 CloudFormation 控制台上检查模板\n\n![图 8.1\
  \ – CloudFormation 控制台 – 未处理的模板](img/B10533_08_001.jpg)\n\n图 8.1 – CloudFormation\
  \ 控制台 – 未处理的模板\n\n有一个有趣的触发器。让我们点击它看看会发生什么！\n\n![图 8.2 – CloudFormation 控制台 – 已处理的模板](img/B10533_08_002.jpg)\n\
  \n图 8.2 – CloudFormation 控制台 – 已处理的模板\n\n实际上发生的是宏运行了一个转换，将我们调用 `Fn::Transform` 的块更改为镜像\
  \ ID。这正是我们想要的！\n\n现在，让我们模拟一个错误。我们将把 `OSFamily` 参数从 `ubuntu` 改为宏字典中不存在的内容，然后重新运行堆栈部署：\n\
  \n**lt.yaml**\n\n```yaml\nResources:\n  Lt:\n    Type: AWS::EC2::LaunchTemplate\n\
  \    Properties:\n      LaunchTemplateData:\n        Fn::Transform:\n          Name:\
  \ AMIFiller\n          Parameters:\n            OSFamily: \"yolo\"\n```\n\n### 7.\
  \ 现在让我们部署堆栈\n\n```bash\n$ aws cloudformation deploy --stack-name lt --template-file\
  \ lt.yaml\nWaiting for changeset to be created..\nFailed to create the changeset:\
  \ Waiter ChangeSetCreateComplete failed: Waiter encountered a terminal failure state\
  \ Status: FAILED. Reason: Transform ACCT_ID::AMIFiller failed without an error message.\n\
  ```\n\n> **重要提示**\n>\n> 注意，堆栈更新在 changeset 执行*之前*就失败了。这是因为 CloudFormation 在宏处理*之前*和*之后*都运行模板验证，由于我们的函数返回了\
  \ `FAILED`，CloudFormation 无法继续。\n\n话虽如此，让我们创建一个更强大的模板宏，它将仅从一堆输入数据中渲染整个应用程序模板。\n\n\
  ### 从简短声明渲染应用程序模板\n\n在本节中，我们将开发一个宏，通过转换其缩短版本——*标准应用程序*声明，来创建完整的 CloudFormation 堆栈。\n\
  \n> **重要提示**\n>\n> 别忘了查看存储库以获取宏的完整版本！\n\n因此，我们有以下类型的模板用于我们所谓的标准应用程序：\n\n**app.yaml**\n\
  \n```yaml\nTransform: StandardApplication\nResources:\n  Application:\n    Properties:\n\
  \      ApplicationImage: \"\"\n      ApplicationPort: 0\n      TaskCount: 0\n  \
  \    Memory: 0\n      CPU: 0\n      RDS: \"\"\n      RDSSize: \"\"\n      RDSMultiAz:\
  \ False\n      NeedsBalancer: False\n      PubliclyAvailable: False\n```\n\n此应用程序可能具有也可能不具有以下资源：\n\
  \n*   **关系型数据库服务 (RDS)** 实例\n*   **弹性负载均衡 (ELB)**\n*   **弹性容器服务 (ECS)** 服务\n\n想象一种情况：开发人员主要专注于解决业务案例，不关心底层基础设施，因此我们作为云工程师必须负责它。开发人员的唯一要求是他们必须提供有效的\
  \ Docker 镜像。\n\n转换应用于整个模板——这意味着我们需要更严格和更复杂的处理逻辑。通过输入，我们将了解要创建哪些资源以及为它们分配哪些属性。\n\n\
  让我们首先构建宏的骨架：\n\n**standard-app.py**\n\n```python\ndef render_ecs(input):\n    ecs_definition\
  \ = {}\n    return ecs_definition\n\ndef render_rds(input):\n    rds_definition\
  \ = {}\n    return rds_definition\n\ndef render_elb(input):\n    elb_definition\
  \ = {}\n    return elb_definition\n\ndef lambda_handler(event, context):\n    response\
  \ = {}\n    response['requestId'] = event['requestId']\n    response['status'] =\
  \ \"SUCCESS\"\n    response['fragment'] = {}\n    return response\n```\n\n在这里我们创建了三个额外的函数，每个函数负责处理输入数据（例如属性）并创建必要的资源声明。\n\
  \n这些函数如下：\n\n*   `render_ecs()`\n*   `render_rds()`\n*   `render_elb()`\n\n但在此之前，我们将在\
  \ Lambda 处理程序函数中解析传入的负载。\n\n### 解析属性\n\n在渲染最终模板之前，我们需要根据要创建哪些资源做出决定。我们通过解析输入属性来实现这一点。根据我们的模板，CloudFormation\
  \ 请求的 `fragment` 将如下所示：\n\n```json\n\"fragment\" : {\n  \"Resources\": {\n    \"\
  Application\": {\n      \"Properties\": {\n        \"ApplicationImage\": \"\",\n\
  \        \"ApplicationPort\": 0,\n        \"TaskCount\": 0,\n        \"Memory\"\
  : 0,\n        \"CPU\": 0,\n        \"RDSEngine\": \"\",\n        \"RDSSize\": \"\
  \",\n        \"RDSMultiAz\": \"\",\n        \"NeedsBalancer\": false,\n        \"\
  PublciclyAvailable\": false\n      }\n    }\n  }\n}\n```\n\n\n\n至少有四个属性是强制性的：`image`、`network\
  \ port`、`count`、`memory` 和 `CPU`；否则，我们无法为 ECS 任务声明任何内容。让我们在 Lambda 处理程序中添加检查：\n\n\
  `standard-app.py`\n\n```python\ndef lambda_handler(event, context):\n    # ...\n\
  \    required_properties = [\"ApplicationImage\", \"ApplicationPort\", \"TaskCount\"\
  , \"Memory\", \"CPU\"]\n    properties = event['fragment']['Resources']['Application']['Properties']\n\
  \    for req in required_properties:\n        if req not in properties.keys() or\
  \ not properties[req]:\n            response['status'] = \"FAILED\"\n          \
  \  return response\n    # ...\n```\n\n如果至少有一个属性未设置或设置为 `null`，Lambda 将响应 `FAILED`。\n\
  \n除了必需属性外，我们还有可选属性。这些属性声明是否需要额外资源（如 RDS 实例或 ELB）及其属性。\n\n`RDSEngine`、`RDSSize` 和\
  \ `RDSMultiAz` 属性提供我们将要配置的 RDS 实例的信息。如果未指定 `RDSEngine`，我们假设不需要数据库。对于 `RDSSize`，我们将使用默认值\
  \ `db.t2.micro`；对于 `RDSMultiAz`，默认值为 `false`。让我们将其添加到处理程序中：\n\n`standard-app.py`\n\
  \n```python\ndef lambda_handler(event, context):\n    # ...\n    rds_props = {}\n\
  \    rds_props['RDSEngine'] = \"\"\n    rds_props['RDSSize'] = \"db.t2.micro\"\n\
  \    rds_props['RDSMultiAz'] = \"false\"\n    for key in rds_props.keys():\n   \
  \     if key in properties.keys() and properties[key]:\n            rds_props[key]\
  \ = properties[key]\n    # ...\n```\n\n这里我们将默认值设置给 RDS 属性，并将 `RDSEngine` 设为 `null`。如果在\
  \ CloudFormation 请求中提供了这些值，我们将覆盖它们。\n\n我们将对 ELB 属性执行相同操作：\n\n`standard-app.py`\n\
  \n```python\ndef lambda_handler(event, context):\n    # ...\n    elb_props = {}\n\
  \    elb_props['NeedBalancer'] = False\n    elb_props['PubliclyAvailable'] = False\n\
  \    for key in elb_props.keys():\n        if key in properties.keys() and properties[key]:\n\
  \            elb_props[key] = properties[key]\n    # ...\n```\n\n现在我们已整理好所有属性，可以开始开发配置逻辑。\n\
  \n### 从宏声明资源\n\n由于宏必须返回有效的 JSON 模板，这是我们第一次（希望也是最后一次）以 JSON 格式编写模板。\n\n我们将改进 `render_ecs()`\
  \ 函数，使其返回有效的声明。我们已经知道会接收应用程序镜像、端口、CPU 共享设置、任务数量和内存设置属性。\n\n同时，我们知道需要配置 CloudWatch\
  \ 日志、ECS 任务定义及其服务，两者均兼容 ECS Fargate。\n\n让我们构建 ECS 任务定义的框架。我们将遵循与 CloudFormation\
  \ JSON 模板相同的格式（完整版本可在 GitHub 上找到）：\n\n`standard-app.py`\n\n```python\ndef render_ecs(input):\n\
  \    # ...\n    ecs_task_definition = {\n        # ...\n        \"Family\": \"\"\
  ,  # placeholder\n        # ...\n        \"Name\": \"\",  # placeholder\n      \
  \  \"Image\": \"\",  # placeholder\n        # ...\n        \"ContainerPort\": \"\
  \",  # placeholder\n        # ...\n        \"awslogs-stream-prefix\": \"\"  # placeholder\n\
  \        # ...\n        \"Cpu\": \"\",  # placeholder\n        \"Memory\": \"\"\
  ,  # placeholder\n        # ...\n    }\n```\n\n我们的 ECS 任务定义现在是一个字典对象。我们需要用输入中的值填充这些占位符：\n\
  \n`standard-app.py`\n\n```python\ndef render_ecs(input):\n    # ...\n    application_image\
  \ = input['ApplicationImage']\n    application_name = application_image.strip(\"\
  :\")\n    ecs_task_definition_properties = ecs_task_definition['TaskDefinition']['Properties']\n\
  \    ecs_task_definition_properties['Family'] = application_name\n    ecs_task_definition_properties['ContainerDefinitions'][0]['Name']\
  \ = application_name\n    ecs_task_definition_properties['ContainerDefinitions'][0]['Image']\
  \ = application_image\n    # and so on...\n```\n\n任务定义填入所有值后，我们可以继续配置 ECS 和 CloudWatch\
  \ 日志。\n\n最终，我们的函数将如下所示：\n\n`standard-app.py`\n\n```python\ndef render_ecs(input):\n\
  \    ecs_definition = {}\n    ecs_task_definition = { ... }\n    # generation of\
  \ ecs_task_definition...\n    ecs_service_definition = { ... }\n    # generation\
  \ of ecs_service_definition...\n    ecs_definition['Logs'] = { ... }\n    ecs_definition['Sg']\
  \ = { ... }\n    # generation of the rest...\n    ecs_definition.update(ecs_task_definition)\n\
  \    ecs_definition.update(ecs_service_definition)\n    return ecs_definition\n\
  ```\n\n最后，我们将获得应用程序所需的 CloudFormation 资源集合，例如 ECS 任务定义、服务、CloudWatch 日志、EC2 安全组等。\n\
  \n额外资源（ELB 和 RDS 实例）的生成方式类似，因此我们不再重点介绍，直接跳转到宏的部署。\n\n### 部署标准应用\n\n通过以下步骤，我们将部署宏并进行测试：\n\
  \n1.  由于我们的应用程序需要基础设施（ECS 集群、网络等），我们首先需要配置这些资源（可在代码库中找到）：\n\n    ```bash\n    $\
  \ aws cloudformation deploy --stack-name core \\\n        --template-file core.yaml\
  \ \\\n        --capabilities CAPABILITY_IAM\n    ```\n\n2.  部署完成后，我们可以配置宏。我们的代码太大，无法放入\
  \ CloudFormation 模板，因此必须手动上传到 S3：\n\n    ```bash\n    $ aws s3 mb s3://masteringcfn\
  \  # your bucket name may differ\n    $ zip lambda-macro.zip standard-app.py\n \
  \   $ aws cloudformation deploy --stack-name standard-app-macro \\\n        --template-file\
  \ macro.yaml \\\n        --capabilities CAPABILITY_IAM\n    ```\n\n3.  准备就绪。我们可以继续部署应用程序：\n\
  \n    ```bash\n    $ aws cloudformation deploy --stack-name app \\\n        --template-file\
  \ app.yaml\n    ```\n\n4.  让我们查看 CloudFormation 控制台。我们关注模板处理后的样子：\n\n![Figure 8.3\
  \ – CloudFormation console – unprocessed template](img/B10533_08_003.jpg)\n\nFigure\
  \ 8.3 – CloudFormation console – unprocessed template\n\n但我们关注的是处理后的模板：\n\n![Figure\
  \ 8.4 – CloudFormation console – processed template](img/B10533_08_004.jpg)\n\n\
  Figure 8.4 – CloudFormation console – processed template\n\n大功告成！我们成功创建了第一个处理整个模板的宏！有了这些知识，我们可以根据需要调整和扩展\
  \ CloudFormation 模板。\n\n### 概要\n\n在本章中，我们了解了宏——一种允许我们转换模板的工具。我们学习了 AWS 自带的宏——`AWS::Serverless`\
  \ 和 `AWS::Include`——以及宏的组成。\n\n为了理解宏处理，我们还开发了自己的宏。现在我们知道如何以及何时使用它们。\n\n宏让 AWS 工程师能够避免模板中的复杂性，将复杂性交由\
  \ Lambda 函数解决。宏如何使模板编写和阅读变得简单的最佳示例是 AWS `Serverless Application Model (SAM)`，我们将在\
  \ *第 10 章* *使用 AWS SAM 部署无服务器应用程序* 中详细介绍。\n\n在下一章中，我们将学习 AWS **Cloud Development\
  \ Kit (CDK)**。CDK 引入了一种完全不同的创建和管理 CloudFormation 栈的方式，允许 AWS 工程师以编程方式声明基础设施。\n\n\
  下一章见！\n\n### 问题\n\n1.  当宏处理模板时，以何种格式返回？\n\n\n\n### 复习问题\n\n2. 在 CloudFormation 的转换请求中，什么是\
  \ `fragment`？\n\n3. 如果宏函数部署在 `us-east-1` 区域，我们能否在 `us-east-2` 中创建一个使用它的堆栈？\n\n4.\
  \ 如果宏函数返回的状态不是 `SUCCESS` 会发生什么？\n\n5. 能否在单个模板中使用多个宏？\n\n### 进一步阅读\n\n*   Alex DeBrie\
  \ 关于 CloudFormation 宏的博客：<https://www.alexdebrie.com/posts/cloudformation-macros/>\n\
  *   包含宏示例的 GitHub 仓库：<https://github.com/aws-cloudformation/aws-cloudformation-macros>\n"
- "## 第 9 章：使用 AWS CDK 生成 CloudFormation 模板\n\n现在我们将了解 AWS 的最新发展之一——`Cloud Development\
  \ Kit`，即 `CDK`。\nCDK 并非旨在取代 CloudFormation。\n相反，它的开发是为了给 CloudFormation 增加额外的功能。\n\
  \nCDK 是一个支持多种编程语言的框架，允许 AWS 工程师真正地将基础设施声明为代码，从而提高 AWS 开发速度。\n本章结束时，你将拥有一个由 CDK 生成的运行中基础设施。\n\
  \n本章将涵盖以下主题：\n\n*   介绍 AWS CDK\n*   使用 AWS CDK 促进模板开发\n*   使用 AWS CDK 和 Python 编写你的第一个模板\n\
  \n### 技术要求\n\n本章使用的代码可以在本书的 GitHub 仓库中找到：<https://github.com/PacktPublishing/Mastering-AWS-CloudFormation>\
  \ 和 <https://github.com/PacktPublishing/Mastering-AWS-CloudFormation/tree/master/Chapter9/app>。\n\
  \n查看以下视频以了解代码实战：\n\n<https://bit.ly/3aPNXxJ>\n\n### 介绍 AWS CDK\n\nCDK 并非首次尝试使用高级编程语言生成\
  \ CloudFormation 模板。\n由于编写复杂的 CloudFormation 模板可能是一项包含许多重复操作的长期任务，开发者们有兴趣寻找一种不同的模板生成方式。\n\
  \n其中一种方式是一个名为 `Troposphere` 的 Python 框架，由 Cloudtools 团队开发并于 2013 年发布 (<https://github.com/cloudtools/troposphere>)。\n\
  AWS Labs 在 2017 年做出了另一次尝试，当时他们发布了一个名为 `GoFormation` 的类似库，用 Golang 编写 (<https://github.com/awslabs/goformation>)。\n\
  \n最终，AWS 推出了一个框架，它不仅提供了完整的基础设施即代码体验，还支持多种编程语言。\n该框架被称为 AWS Cloud Development Kit，即\
  \ CDK。\n\nCDK 支持以下编程语言：\n\n*   TypeScript\n*   JavaScript\n*   Python\n*   C#\n\
  *   Java\n\nCDK 团队承诺会向此列表添加更多语言，但在此期间，任何愿意将 CDK 集成到其开发工作流中的公司都应使用其最熟悉的语言。\n\n作为一个框架，CDK\
  \ 有一个术语叫 `constructs`（构造），它代表需要预配置的基础设施构建块。\n这些构造可以是以下内容：\n\n*   `CloudFormation\
  \ 资源`：示例包括 S3 存储桶、DynamoDB 表和 EC2 实例。\n*   `Apps`：作为单一目的的资源逻辑分组，并生成一个或多个堆栈。\n* \
  \  `Stacks`：部署单元，类似于 CloudFormation 堆栈。\n*   `Environments`：部署目标；可以是不同的区域和/或账户。\n\
  *   `Assets`：与应用程序捆绑的本地文件或 Docker 镜像。可以是 Lambda 函数的处理程序代码或 ECS 任务的 Docker 镜像。\n\n\
  当模板开发者开始使用 CDK 时，他们需要将每个资源定义为变量——例如，S3 存储桶的定义如下所示。\n\n如果你还不理解下面的代码，别担心！我们稍后会介绍：\n\
  \n```python\nfrom aws_cdk import core\nimport aws_cdk.aws_s3 as s3\n\nclass BucketStack(core.Stack):\n\
  \    def __init__(self, scope: core.Construct, id: str, **kwargs) -> None:\n   \
  \     super().__init__(scope, id, **kwargs)\n        bucket = s3.Bucket(self, \"\
  myBucket\")\n\napp = core.App()\nBucketStack(app, \"bucket\", env=core.Environment(account=\"\
  X\"))\napp.synth()\n```\n\n在此代码中，堆栈实际上是一个 Python `class`（`BucketStack`），带有必要的构造属性。\n\
  我们声明一个 `bucket` 变量，它是 `s3.Bucket` 类型的对象，其中 `s3` 是一个导入的库，即 `aws_cdk.aws_s3`。\n堆栈被分配为应用程序\
  \ `App` 的成员。\n我们还指定了要部署的账户，但我们将在下一节中介绍这一点。\n\n一旦我们构建自己的模板，将获得更深入的 CDK 知识，但首先，让我们看看\
  \ CDK 如何让我们的模板开发生活更轻松。\n\n### 使用 AWS CDK 促进模板开发\n\n如果我们已经拥有丰富的 CloudFormation 经验，为什么还要选择\
  \ CDK？\n虽然 CloudFormation 拥有许多强大的功能和与 AWS 的深度集成，但其声明式的本质可能会给刚开始实践基础设施即代码和 AWS 的人带来负担。\n\
  \n当你需要创建一组示例资源并希望将大多数属性设置为默认值时，CloudFormation 很简单。\n但让我们看看 S3 存储桶的完整声明：\n\n```yaml\n\
  Type: AWS::S3::Bucket\nProperties:\n  AccelerateConfiguration: ...\n  AccessControl:\
  \ ...\n  AnalyticsConfigurations: [...]\n  BucketEncryption: ...\n  BucketName:\
  \ ...\n  CorsConfiguration: ...\n  InventoryConfigurations: [...]\n  LifecycleConfiguration:\
  \ ...\n  LoggingConfiguration: ...\n  MetricsConfigurations: [...]\n  NotificationConfiguration:\
  \ [...]\n  # And counting!..\n```\n\n大多数属性甚至不是字符串或布尔值；它们是需要填充的单独键值部分。\n这不是最难的任务，但它需要时间来找到适当的声明部分，并避免弄乱\
  \ YAML 或 JSON 格式。\n添加属性块甚至额外资源可能更简单。\n\n假设我们想要在一个 VPC 中拥有一个与路由表关联的子网，该路由表有一条通往互联网的路由。\n\
  \n使用 CloudFormation 将包含以下资源：\n\n```yaml\nVpc:\n  Type: AWS::EC2::VPC\n  Properties:\
  \ ...\nIgw:\n  Type: AWS::EC2::InternetGateway\nIgwAttach:\n  Type: AWS::EC2::VPCGatewayAttachment\n\
  \  Properties: ...\nSubnet:\n  Type: AWS::EC2::Subnet\n  Properties: ...\nRouteTable:\n\
  \  Type: AWS::EC2::RouteTable\n  Properties: ...\nPublicRoute:\n  Type: AWS::EC2::Route\n\
  \  Properties: ...\nPublicRouteTableAssoc:\n  Type: AWS::EC2::SubnetRouteTableAssociation\n\
  \  Properties: ...\n```\n\n同样，这是我们必须进行的最少资源声明数量。\n\n在 CDK 中执行此操作将更简单，因为其编程性质：\n\n\
  ```python\nCIDR = \"10.0.0.0/16\"\nvpc = ec2.Vpc(self,\n              \"Vpc\",\n\
  \              cidr=CIDR,\n              subnet_configuration=[\n              \
  \    ec2.SubnetConfiguration(name=\"Public\", subnet_type=ec2.SubnetType.PUBLIC,\
  \ cidr_mask=24),\n                  ec2.SubnetConfiguration(name=\"Private\", subnet_type=ec2.SubnetType.PRIVATE,\
  \ cidr_mask=24)\n              ])\n```\n\n因为 CDK 内部有大量抽象，我们不需要显式地逐一定义资源——CDK 会为我们完成这项工作。\n\
  \n另一个有益的特性是我们可以使用编程语言的所有能力，例如迭代和条件判断。\n\n例如，假设我们想要在多个区域部署我们的堆栈。\n我们可以通过初始化 `Stack`\
  \ 类来指示 CDK 创建一个堆栈：\n\n```python\nMyStack(app, \"StackName\", env=core.Environment(account=\"\
  X\",\n                                               region=\"foo\"))\n```\n\n\n\
  \n### 使用 AWS CDK 和 Python 编写您的第一个模板\n\n我们将从安装 CDK 的先决条件开始。尽管我们将使用 Python 编写代码，但仍然需要安装\
  \ `nodejs`。完成此操作后，我们可以安装 CDK：\n\n```\n$ npm install -g aws-cdk\n```\n\n之后，我们需要通过打印\
  \ CDK 版本来检查一切是否正确：\n\n```\n$ cdk --version\n```\n\n安装 CDK 并不意味着我们拥有所有的构建库。\n\n首先，我们需要初始化环境：\n\
  \n```\n$ mkdir app && cd app\n$ cdk init app --profile personal --language=python\n\
  $ source .env/bin/activate\n$ pip install -r requirements.txt\n```\n\n然后，我们安装 CDK\
  \ 的核心组件：\n\n```\n$ pip install --upgrade aws-cdk.core\n```\n\n`cdk init` 命令将创建所有文件，因此我们可以立即开始开发基础设施。\n\
  \n### 准备构建\n\n我们将构建与在*第 2 章 高级模板开发*中构建的相同基础设施。我们的基础设施将包含以下堆栈：\n\n*   核心（网络、安全等）\n\
  *   Web 层\n*   存储层\n\n我们将从构建核心堆栈开始，因为许多资源将从中继承。\n\n运行 `cdk init` 后，将创建多个文件和目录。\n\
  \n处理生成和部署的主文件称为 `app.py`，内容如下：\n\n```\napp.py\nfrom aws_cdk import core\nfrom app.app_stack\
  \ import AppStack\n\napp = core.App()\nAppStack(app, \"app\")\napp.synth()\n```\n\
  \n此脚本初始化*构建* `app` 和 `AppStack` 类，最后运行 `synth()` 方法，该方法生成 CloudFormation 模板。\n\n\
  此外，我们还有一个实际包含 `AppStack` 类的文件：\n\n```\napp/app_stack.py\nfrom aws_cdk import core\n\
  \nclass AppStack(core.Stack):\n    def __init__(self, scope: core.Construct, id:\
  \ str, **kwargs) -> None:\n        super().__init__(scope, id, **kwargs)\n     \
  \   # The code that defines your stack goes here\n```\n\n这是我们必须在其中声明资源的类。\n\n> **重要提示**\n\
  >\n> CDK 创建的文件和对象命名可能看起来很奇怪。当我们运行 `cdk init` 时，它将创建一个 `app.py` 文件（此处 `app` 代表 *App*，即\
  \ CDK 中的主要构建）和一个目录 `X`，其中 `X` 是运行 `cdk init` 的当前工作目录的名称。在该新目录中，`cdk init` 将创建一个\
  \ `X_stack.py` 文件和一个 `XStack()` 类。为了开发方便和透明度，您应该花时间相应地重命名文件和对象。\n\nCDK 创建了一个堆栈类，但此处的命名并非我们所需（此外，我们将需要多个类）。因此，我们将把\
  \ `app_stack.py` 重命名为 `core_stack.py`，将 `AppStack` 重命名为 `CoreStack`：\n\n```\napp/core_stack.py\n\
  from aws_cdk import core\n\nclass CoreStack(core.Stack):\n    # ...\n```\n\n我们还将对\
  \ `app.py` 进行一些更改，以便导入正常工作：\n\n```\napp.py\nfrom aws_cdk import core\nfrom app.core_stack\
  \ import CoreStack\n\napp = core.App()\nCoreStack(app, \"core\")\napp.synth()\n\
  ```\n\n我们还在类初始化调用中做了一个更改，将 `\"app\"` 改为 `\"core\"`：\n\n```\nCoreStack(app, \"core\"\
  )\n```\n\n引号中的字符串代表 `Id`，即 CDK 内部堆栈的唯一标识符。部署期间，此 ID 将成为堆栈名称，但我们现在进行此更改是为了让我们更清晰。\n\
  \n我们已完成所有准备工作。现在，让我们开始编写核心模板。\n\n### 渲染核心资源\n\n正如我们所记得的，核心堆栈需要以下资源：\n\n*   1 个 VPC\n\
  *   3 个公有子网\n*   3 个私有子网\n*   1 个互联网网关\n*   1 个 NAT 网关\n*   1 个公有路由表\n*   1 个私有路由表\n\
  *   2 个 IAM 角色（供管理员和开发人员使用）\n\nCDK 不会安装所有构建库，因此我们需要安装其中两个：`aws_cdk.aws_iam` 和 `aws_cdk.aws_ec2`：\n\
  \n```\n$ pip install aws_cdk.aws_iam aws_cdk.aws_ec2\n```\n\n现在我们可以导入它们：\n\n```\n\
  app/core_stack.py\nfrom aws_cdk import core\nfrom aws_cdk.core import Fn\nimport\
  \ aws_cdk.aws_ec2 as ec2\nimport aws_cdk.aws_iam as iam\n```\n\n通过以下步骤，我们将使用 CDK\
  \ 声明核心堆栈：\n\n1.  让我们从 IAM 角色开始。我们通过在堆栈类中声明变量来创建它们：\n\n    ```\n    app/core_stack.py\n\
  \    # imports...\n    class CoreStack(core.Stack):\n        def __init__(self,\
  \ scope: core.Construct, id: str, **kwargs) -> None:\n            super().__init__(scope,\
  \ id, **kwargs)\n            admin_role = iam.Role(self,\n                     \
  \             \"admin\",\n                                  assumed_by=iam.AccountPrincipal(Fn.ref(\"\
  AWS::AccountId\")))\n            dev_role = iam.Role(self,\n                   \
  \             \"developer\",\n                                assumed_by=iam.AccountPrincipal(Fn.ref(\"\
  AWS::AccountId\")))\n    ```\n\n    同样，我们需要编写的代码更少，因为 `iam.Role` 对象有一个 `assumed_by`\
  \ 属性。这将自动转换为 `AssumeRolePolicyDocument`。\n\n2.  为了检查一切是否按预期生成，我们可以运行 `cdk synth`：\n\
  \n    ```\n    $ cdk synth\n    Resources:\n      admin81D8EBF0:\n        Type:\
  \ AWS::IAM::Role\n        Properties:\n          AssumeRolePolicyDocument:\n   \
  \         Statement:\n              - Action: sts:AssumeRole\n                Effect:\
  \ Allow\n                Principal:\n                  AWS:\n                  \
  \  Fn::Join:\n                      - \"\"\n                      - - \"arn:\"\n\
  \                        - Ref: AWS::Partition\n                        - \":iam::\"\
  \n                        - Ref: AWS::AccountId\n                        - :root\n\
  \            Version: \"2012-10-17\"\n    # the rest of the output...\n    ```\n\
  \n3.  模板看起来有效，因此我们可以继续为角色添加策略：\n\n    ```\n    app/core_stack.py\n    class CoreStack(core.Stack):\n\
  \        def __init__(self, scope: core.Construct, id: str, **kwargs) -> None:\n\
  \            # ...\n            admin_role.add_managed_policy(iam.ManagedPolicy.from_aws_managed_policy_name(\"\
  AdministratorAccess\"))\n            dev_role.add_managed_policy(iam.ManagedPolicy.from_aws_managed_policy_name(\"\
  ReadOnlyAccess\"))\n    ```\n\n    我们只需添加托管策略，因此将使用 `add_managed_policy()` 方法。\n\
  \n4.  现在我们可以开始构建网络。我们需要一个公有子网和若干私有子网：\n\n    ```\n    class CoreStack(core.Stack):\n\
  \        # ...\n        # VPC section\n        self.vpc = ec2.Vpc(self,\n      \
  \                     \"vpc\",\n    ```\n\n\n\n\n### VPC 配置\n\n```python\ncidr=\"\
  10.0.0.0/16\",\nenable_dns_hostnames=True,\nenable_dns_support=True,\nmax_azs=3,\n\
  nat_gateways=1,\nsubnet_configuration=[\n    ec2.SubnetConfiguration(name=\"Public\"\
  , subnet_type=ec2.SubnetType.PUBLIC, cidr_mask=24),\n    ec2.SubnetConfiguration(name=\"\
  Private\", subnet_type=ec2.SubnetType.PRIVATE, cidr_mask=24)\n])\n```\n\n这里有几个参数可以调整。我们将\
  \ `max_azs` 设置为 `3`，以确保我们的栈能支持几乎所有区域（大多数区域有三个可用区）。如果该数字高于某区域的 AZ 数量，则栈创建将失败。我们还将\
  \ `nat_gateways` 设置为 `1`，这样 VPC 中只会有一个 NAT 网关，仅为了在个人账户中练习使用 CDK 时避免额外费用（最佳实践是每个可用区有一个\
  \ NAT 网关）。\n\n每个子网组（public、web、middleware 和 storage）都是一个单独的 `SubnetConfiguration`\
  \ 对象。通过使用 `PUBLIC` 或 `PRIVATE` 子网类型，我们指示 CDK 为子网配置合适的路由表（通过互联网网关或 NAT 网关）。\n\n这里的主要好处是我们定义了一个单一的\
  \ Python `vpc` 对象，但 CDK 会代表我们生成大量资源：互联网网关、NAT 网关、子网、带有路由和关联的路由表、带有关联的网络 ACL —— 几乎是我们之前必须手动声明的每一项核心基础设施！\n\
  \n我们可以继续处理其余层级。\n\n### 渲染 Web 层\n\nWeb 层是构建在核心栈之上的栈。我们将生成一个引用另一个我们心中已有的栈的模板。\n\n\
  在 Web 层中，我们期望包含以下内容：\n\n- 应用程序负载均衡器\n- 启动配置\n- 自动扩缩组\n- 一堆安全组\n\n在以下代码中，我们将生成一个使用核心栈部分资源的\
  \ Web 层声明：\n\n### 1. 创建新文件\n\n在核心栈所在的同一目录下创建一个新文件：\n\n`app/web_stack.py`\n\n```python\n\
  from aws_cdk import core\n\nclass WebStack(core.Stack):\n    def __init__(self,\
  \ scope: core.Construct, id: str, vpc: ec2.Vpc, **kwargs) -> None:\n        super().__init__(scope,\
  \ id, **kwargs)\n```\n\n我们给类添加了一个额外属性 `vpc`。这是因为我们想从 `Core` 栈继承属性（就像使用 `Exports`\
  \ 和 `Fn::ImportValue` 一样）。\n\n### 2. 添加资源\n\n`app/web_stack.py`\n\n```python\nclass\
  \ WebStack(core.Stack):\n    def __init__(self, scope: core.Construct, id: str,\
  \ vpc: ec2.Vpc, **kwargs) -> None:\n        super().__init__(scope, id, **kwargs)\n\
  \        self.vpc = vpc\n        asg = autoscaling.AutoScalingGroup(self,\n    \
  \        \"WebAsg\",\n            instance_type=ec2.InstanceType.of(ec2.InstanceClass.BURSTABLE2,\
  \ ec2.InstanceSize.MICRO),\n            machine_image=ec2.AmazonLinuxImage(),\n\
  \            vpc=vpc,\n            vpc_subnets=ec2.SubnetSelection(subnet_group_name=\"\
  Private\"),\n            min_capacity=1,\n            max_capacity=1\n        )\n\
  ```\n\n正如我们所见，一些属性并不属于 EC2 自动扩缩组 —— 例如 `instance_type` 和 `machine_image`。这些属性将用于生成启动配置资源。\n\
  \n此外，让我们看看如何为自动扩缩组提供 VPC 和子网。我们所做的是将一个类（`CoreStack`）的资源构造属性（`vpc`）传递给另一个类（`WebStack`）。\n\
  \n### 3. 在 app.py 中添加 WebStack 类\n\n`app.py`\n\n```python\nfrom aws_cdk import core\n\
  from app.core_stack import CoreStack\nfrom app.web_stack import WebStack\n\napp\
  \ = core.App()\ncore = CoreStack(app, \"core\")\nweb = WebStack(app, \"web\", vpc=core.vpc)\n\
  app.synth()\n```\n\n### 4. 运行 cdk synth 检查资源属性分配\n\n```bash\n$ cdk synth web\nIncluding\
  \ dependency stacks: core\nSuccessfully synthesized to /Users/ktovmasyan/app/cdk.out\n\
  Supply a stack id (core, web) to display its template.\n```\n\n### 5. 评估生成的模板\n\n\
  ```json\n{\n  \"Resources\": {\n    # some resources...  \n    \"WebAsgASGEE4061A2\"\
  : {\n      \"Type\": \"AWS::AutoScaling::AutoScalingGroup\",\n      \"Properties\"\
  : {\n        # some properties...\n        \"VPCZoneIdentifier\": [\n          {\n\
  \            \"Fn::ImportValue\": \"core:ExportsOutputRefvpcPrivateSubnet1Subnet934893E8236\
  \ E2271\"\n          },\n          {\n            \"Fn::ImportValue\": \"core:ExportsOutputRefvpcPrivateSubnet2Subnet7031C2BA60\
  \ DCB1EE\"\n          }\n        ]\n      }\n    },\n    # the rest of the resources\n\
  \  }\n}\n```\n\nCDK *理解*了我们要做什么，并在核心栈中创建了导出，然后使用 `Fn::ImportValue`。\n\n> **重要提示**\n\
  >\n> CDK 的最佳实践是在栈类之间暴露类字段；但是，这仅在同一个应用程序内有效。如果你仍然需要导出值以在不同的 CDK 应用程序之间共享，则需要使用 `aws_cdk.core`\
  \ 中的 `CfnOutput` 方法。\n\n### 6. 继续向 Web 栈添加资源\n\n我们只需要添加一个应用程序负载均衡器：\n\n`app/web_stack.py`\n\
  \n```python\nclass WebStack(core.Stack):\n    def __init__(self, scope: core.Construct,\
  \ id: str, vpc: ec2.Vpc, **kwargs) -> None:\n        # ...\n        alb = elbv2.ApplicationLoadBalancer(self,\n\
  \            \"WebLb\",\n            vpc=vpc,\n            internet_facing=True,\n\
  \            vpc_subnets=ec2.SubnetSelection(subnet_group_name=\"Public\"))\n  \
  \      listener = alb.add_listener(\"WebListener\",\n            port=80)\n    \
  \    listener.add_targets(\"Target\",\n            port=80,\n            targets=[asg])\n\
  ```\n\n我们不需要单独创建目标组。当我们使用 `add_targets()` 方法时，CDK 会自动声明一个目标组，并从监听器和自动扩缩组引用它。\n\n\
  ### 7. 部署 Web 栈以验证代码可运行\n\n![Figure 9.1 – Terminal output](img/B10533_09_001.jpg)\n\
  \nFigure 9.1 – Terminal output\n\n由于核心栈是依赖栈，它将首先部署。我们感兴趣的是构建一个设置，让 CDK 告知我们安全相关的更改，例如\
  \ IAM 和安全组规则，如下所示：\n\n![Figure 9.2 – Terminal output](img/B10533_09_002.jpg)\n\n\
  Figure 9.2 – Terminal output\n\n另一个值得指出的有趣现象是：当我们将自动扩缩组与应用程序负载均衡器关联时，CDK 会自动添加一条安全组规则，仅允许来自负载均衡器安全组的流量进入流量端口。\n\
  \n让我们也使用用户数据在启动配置上安装一些软件。\n\n### 8. 声明用户数据\n\n我们将 `userdata` 声明为多行字符串变量：\n\n\n\n\
  \n### 渲染存储层\n\n我们的存储层将是一个 RDS 实例，在核心堆栈的 VPC 中创建。\n\n### 1. 在单独的文件中创建新的堆栈类\n\n**文件：**\
  \ `app/rds_stack.py`\n\n```python\nfrom aws_cdk import core\nimport aws_cdk.aws_ec2\
  \ as ec2\nimport aws_cdk.aws_rds as rds\n\nclass RdsStack(core.Stack):\n    def\
  \ __init__(self, scope: core.Construct, id: str, vpc: ec2.Vpc, webserver_sg: ec2.SecurityGroup,\
  \ **kwargs) -> None:\n        super().__init__(scope, id, **kwargs)\n        self.vpc\
  \ = vpc\n        self.webserver_sg = webserver_sg\n```\n\n我们向类声明添加了两个额外字段：`vpc`（我们将使用来自核心堆栈的\
  \ VPC 构造）和 `webserver_sg`（我们在上一节末尾声明的安全组构造）。\n\n### 2. 创建 RDS 实例并向其安全组添加规则\n\n**文件：**\
  \ `app/rds_stack.py`\n\n```python\nclass RdsStack(core.Stack):\n    def __init__(self,\
  \ scope: core.Construct, id: str, vpc: ec2.Vpc, webserver_sg: ec2.SecurityGroup,\
  \ **kwargs) -> None:\n        # 避免在生产环境中硬编码密码！\n        # 相反——尝试使用 Secrets Manager\
  \ 并配合\n        # 随机字符串生成。\n        pw = core.SecretValue.plain_text(\"password\"\
  )\n        rds_instance = rds.DatabaseInstance(\n            self, \"Rds\",\n  \
  \          master_username=\"user\",\n            master_user_password=pw,\n   \
  \         database_name=\"db\",\n            engine=rds.DatabaseInstanceEngine.MYSQL,\n\
  \            vpc=vpc,\n            instance_class=ec2.InstanceType.of(\n       \
  \         ec2.InstanceClass.BURSTABLE2,\n                ec2.InstanceSize.MICRO),\n\
  \            removal_policy=core.RemovalPolicy.DESTROY,\n            deletion_protection=False)\n\
  \        rds_instance.connections.allow_from(\n            webserver_sg,\n     \
  \       ec2.Port.tcp(3306))\n```\n\n这将创建一组资源——一个数据库子网组、一个带有安全组的 RDS 实例，新规则将添加到该安全组中。因为我们引用了另一个类（Web\
  \ 层）的字段，CDK 将创建一个包含安全组 ID 的导出。\n\n### 3. 向 `app.py` 添加新类\n\n**文件：** `app.py`\n\n\
  ```python\nfrom aws_cdk import core\nfrom app.core_stack import CoreStack\nfrom\
  \ app.web_stack import WebStack\nfrom app.rds_stack import RdsStack\n\napp = core.App()\n\
  core = CoreStack(app, \"core\")\nweb = WebStack(app, \"web\", vpc=core.vpc)\nrds\
  \ = RdsStack(app, \"rds\", vpc=core.vpc, webserver_sg=web.webserver_sg)\napp.synth()\n\
  ```\n\n我们已将所有三个堆栈添加到应用程序中，因此现在可以开始部署。\n\n### 部署 CDK 应用程序\n\nCDK 应用程序的部署通过 `cdk deploy`\
  \ 命令完成。该命令将运行 `synth` 以生成 CloudFormation 模板，然后创建并执行更改集。\n\n如果我们有任何与安全相关的资源（如安全组和\
  \ IAM 实体），CDK 将请求我们的确认。如果我们想避免这种情况（例如，部署作为 CI/CD 流水线的一部分进行时），可以使用 `--require-approval\
  \ never` 参数。\n\n我们可以逐个部署堆栈：\n\n```bash\n$ cdk deploy core\n$ cdk deploy web\n$ cdk\
  \ deploy rds\n```\n\n然而，我们的 RDS 堆栈依赖于核心和 Web 堆栈。因此，如果我们只运行该堆栈的部署，CDK 将尝试首先部署所有依赖项：\n\
  \n```bash\n$ cdk deploy rds\nIncluding dependency stacks: core, web\n### the rest\
  \ of the output\n```\n\nCDK 应用程序的部署具有交互式响应。这意味着我们可以持续观察 CloudFormation 部署的当前状态：\n\
  \n![图 9.3 – 终端输出](img/B10533_09_003.jpg)\n\n*图 9.3 – 终端输出*\n\n部署结束时，我们将看到堆栈已部署的确认消息。CDK\
  \ 还将在终端打印堆栈 ARN 和输出：\n\n![图 9.4 – 终端输出](img/B10533_09_004.jpg)\n\n*图 9.4 – 终端输出*\n\
  \n如果我们需要删除所有堆栈，只需运行 `cdk destroy`。因为我们要删除多个堆栈，我们需要销毁主要依赖项，即核心堆栈：\n\n```bash\n$ cdk\
  \ destroy core\nIncluding depending stacks: web, rds\nAre you sure you want to delete:\
  \ rds, web, core (y/n)?\n```\n\n一旦我们选择 `y`，CDK 将按相反顺序销毁所有堆栈。\n\n我们已经介绍了 CDK 应用程序的部署和删除。现在，让我们了解另一个重要主题——测试\
  \ CDK 应用程序。\n\n### 测试 CDK 应用程序\n\n直到现在，测试 CloudFormation 的唯一方法要么是创建一个堆栈并针对资源运行一些测试，要么是使用自定义规则通过\
  \ `cfn-lint` 进行检查。\n\n在 CDK 中，测试的方式与常见的软件测试相同，但针对堆栈类及其属性。\n\n> **重要提示**\n> 在撰写本文时，使用原生\
  \ CDK 测试库测试 CDK 代码仅适用于 TypeScript 编写的代码。\n\n由于我们无法在 Python 中使用 CDK 的断言库，我们将使用 `unittest`\
  \ 编写自己的测试。\n\n### 1. 创建测试框架\n\n**文件：** `tests/test_app.py`\n\n```python\nimport\
  \ unittest\n\nclass StackCase(unittest.TestCase):\n    def test_True(self):\n  \
  \      self.assertTrue(True)\n\nif __name__ == '__main__':\n    unittest.main()\n\
  ```\n\n### 2. 运行测试框架\n\n```bash\n$ python tests/test_app.py\n.\n----------------------------------------------------------------------\n\
  Ran 1 test in 0.000s\n```\n\n\n\n### 测试 CDK 应用程序\n\n### 3. 测试 VPC 公有子网\n\n**文件：**\
  \ `tests/test_app.py`\n\n```python\nimport unittest\n\nfrom app.core_stack import\
  \ CoreStack\n\nimport aws_cdk.aws_ec2 as ec2\n\nimport aws_cdk.core as core\n\n\
  class StackCase(unittest.TestCase):\n\n    def test_if_vpc_has_public_subnets(self):\n\
  \        app = core.App()\n        core_construct = CoreStack(app, \"core\")\n \
  \       selected_subnets = core_construct.vpc.select_subnets(\n            subnet_type=ec2.SubnetType.PUBLIC)\n\
  \        self.assertTrue(selected_subnets.has_public)\n```\n\n我们将测试当使用 `PUBLIC`\
  \ 子网类型检查选定子网的属性时，`vpc` 构造是否返回 `True`。为此，我们初始化 `app` 对象和核心构造。初始化完成后，我们读取 `vpc` 对象的属性，查看它是否具有公有子网。\n\
  \n### 4. 运行公有子网测试\n\n```bash\n$ python tests/test_app.py -v\n```\n\n```\ntest_if_vpc_has_public_subnets\
  \ (__main__.StackCase) ... ok\n-------------------------------------------------------------\n\
  Ran 1 test in 0.057s\nOK\n```\n\n### 5. 测试 VPC 私有子网\n\n**文件：** `tests/test_app.py`\n\
  \n```python\nclass StackCase(unittest.TestCase):\n\n    # previous tests...\n\n\
  \    def test_if_vpc_has_private_subnets(self):\n        app = core.App()\n    \
  \    core_construct = CoreStack(app, \"core\")\n        selected_subnets = core_construct.vpc.select_subnets(\n\
  \            subnet_type=ec2.SubnetType.PRIVATE)\n        self.assertFalse(selected_subnets.has_public)\n\
  ```\n\n### 6. 运行私有子网测试\n\n```bash\n$ python tests/test_app.py -v\n```\n\n```\ntest_if_vpc_has_private_subnets\
  \ (__main__.StackCase) ... ok\ntest_if_vpc_has_public_subnets (__main__.StackCase)\
  \ ... ok\n--------------------------------------------------------------\nRan 2\
  \ tests in 0.088s\nOK\n```\n\n### 7. 测试开发者角色权限\n\n我们还可以检查我们的开发者角色是否没有 `AdministratorAccess`。这会有点困难，因为我们无法直接从角色类访问托管策略，所以我们必须先生成一个模板，然后解析它。\n\
  \n**文件：** `tests/test_app.py`\n\n```python\nclass StackCase(unittest.TestCase):\n\
  \n    def test_if_dev_role_is_not_admin(self):\n        app = core.App()\n     \
  \   CoreStack(app, \"core\")\n        stack = app.synth()\n        core_stack =\
  \ stack.get_stack_by_name(\"core\").template\n        resources = core_stack['Resources']\n\
  \        for resource in resources.keys():\n            if str(resource).startswith(\"\
  developer\"):\n                developer_role = resource\n        self.assertNotEqual(\n\
  \            \"[{'Fn::Join': ['', ['arn:', {'Ref': 'AWS::Partition'}, ':iam::aws:policy/AdministratorAccess']]}]\"\
  ,\n            str(resources[developer_role]['Properties']['ManagedPolicyArns']))\n\
  ```\n\n我们必须部分匹配 `developer` 资源，因为 CDK 会在其后添加一些编码字符串。一旦我们在模板中定位到该资源，我们就确保其 `ManagedPolicyArns`\
  \ 属性不等于生成模板中的同一行。\n\n### 8. 运行所有测试\n\n```bash\n$ python tests/test_app.py -v\n```\n\
  \n```\ntest_if_dev_role_is_not_admin (__main__.StackCase) ... ok\ntest_if_vpc_has_private_subnets\
  \ (__main__.StackCase) ... ok\ntest_if_vpc_has_public_subnets (__main__.StackCase)\
  \ ... ok\n-------------------------------------------------------------\nRan 3 tests\
  \ in 0.183s\nOK\n```\n\n我们现在能够在实际部署之前针对我们的 CDK 代码运行测试。这将使我们的基础设施预置更加安全可靠！\n\n在本节中，我们涵盖了使用\
  \ CDK 的所有步骤，从 CDK 项目的初始化到编写多层基础设施声明、部署它，甚至为其编写测试套件！\n\n### 总结\n\nCDK 引入了一种管理 AWS\
  \ 的新方式，允许我们以完全不同的方式创建模板和运行栈操作。\n\n在本章中，我们了解了 CDK 及其功能。我们创建了包含多个栈的应用程序，并创建了一个测试套件，以确保我们的核心基础设施模板在部署前可正常运行。\n\
  \nCDK 适用于由具有良好软件工程知识的开发人员担任 AWS 工程师角色，并希望将这些知识与 CloudFormation 自动化相结合的情况。\n\n在下一章中，我们将介绍\
  \ CloudFormation 的另一个扩展，称为 **SAM**—**无服务器应用程序模型**。SAM 与 CloudFormation 类似，但为开发无服务器应用程序提供了不同的方法。\n\
  \n下一章见！\n\n### 问题\n\n1. CDK 中的构造是什么？\n2. 如何在单个应用程序中拥有多个栈？\n3. 如何在 CDK 中为 VPC 声明私有和公有子网？\n\
  4. CDK 目前支持哪些编程语言？\n5. 在 CDK 中是否必须添加 AWS 账户 ID？\n\n### 延伸阅读\n\n* AWS CDK 示例：<https://github.com/aws-samples/aws-cdk-examples>\n\
  * 使用 AWS CDK 测试基础设施：<https://aws.amazon.com/blogs/developer/testing-infrastructure-with-the-aws-cloud-development-kit-cdk/>\n"
- "## 第 10 章：使用 AWS SAM 部署无服务器应用程序\n\nCloudFormation 是一个强大的工具。然而，随着新技术和工作方式的出现，**基础设施即代码**（**IaC**）工具出现了新的需求。在\
  \ Lambda 发布及其与其他 AWS 服务（包括 S3、SNS、SQS 和 DynamoDB）集成后，发现 CloudFormation 的大多数功能对于无服务器开发来说并非必需。\n\
  \n因此，开发了 **无服务器应用程序模型**（**SAM**）。SAM 引入了一种不同且更简化的方式来开发、构建、测试、部署和运行无服务器应用程序。在本章中，我们将了解\
  \ SAM 以及如何使用它来促进无服务器应用程序的开发。\n\n在本章中，我们将涵盖以下主题：\n\n* 介绍 AWS SAM\n* 理解 SAM 与 CloudFormation\
  \ 的区别\n* 使用 SAM 编写你的第一个无服务器应用程序\n\n### 技术要求\n\n本章使用的代码可以在本书的 GitHub 存储库中找到：<https://github.com/PacktPublishing/Mastering-AWS-CloudFormation/tree/master/Chapter10>。\n\
  \n查看以下视频以了解代码实战：\n\n<https://bit.ly/2yWn7a1>\n\n### 介绍 AWS SAM\n\n在了解 SAM 之前，让我们快速看看什么是无服务器。*无服务器*\
  \ 是一种开发、运行和操作应用程序的方式，无需管理其底层基础设施。你可能会想知道关键区别是什么，因为你在 AWS 中不管理*任何*基础设施，你是对的。\n\n\
  你不必在 AWS 中管理任何物理基础设施，但如果你运行 EC2 实例，你需要负责其底层操作系统、安全性、补丁和更新。\n\n然后，你需要考虑 AWS 的托管 **关系数据库服务**（**RDS**），在那里你不必担心底层操作系统，但你仍然需要调整其参数、通过重组查询和表来进行性能调优，并创建数据库索引。\n\
  \n\n\n\nServerless 并不保证完全不需要运维工作，但基于实例的服务（如 EC2、RDS、EMR 和 MSK）与无服务器服务（如 S3、SNS、SQS、Lambda\
  \ 和 DynamoDB）之间存在几个关键差异。\n\n对于无服务器服务，以下几点尤为突出：\n\n*   您仅需为存储（美元/GB）和实际的计算操作（请求次数）付费。\n\
  *   您不再操作实例，而是操作计算和存储单元。\n*   您使用特定实体（例如函数而非完整运行时，或表而非完整数据库）。\n\n这些核心概念使得无服务器计算在许多业务场景下具有成本效益。\n\
  \n推出 SAM 是为了全面支持使用 IaC 作为方法论来开发、打包和部署无服务器应用程序。\n\nSAM 由两部分组成：\n\n*   实际框架（执行所有操作的\
  \ CLI）\n*   一个模板，其规范与 CloudFormation 类似\n\n与 CDK 类似，SAM 可以开箱即用地执行其所有操作，例如构建、本地测试和将无服务器堆栈预配到\
  \ AWS。\n\n由于 SAM 模板的功能受限，因此编写起来更容易。例如，DynamoDB 表定义如下所示：\n\n```yaml\nTransform: AWS::Serverless-2016-10-31\n\
  Resources:\n  DynamoDb:\n    Type: AWS::Serverless::SimpleTable\n    Properties:\n\
  \      TableName: myTable\n      PrimaryKey:\n        Name: id\n        Type: string\n\
  ```\n\n`Transform: AWS::Serverless-2016-10-31` 这一行看起来熟悉吗？\n\n还记得 *第 8 章* *使用模板宏动态渲染模板*\
  \ 中提到的，AWS 有两个内部宏：`AWS::Serverless` 和 `AWS::Include`。SAM 模板本身只不过是一个宏模板，将在部署期间由 CloudFormation\
  \ 处理。转换后，上述模板将变为如下所示：\n\n```json\n{\n  \"Resources\": {\n    \"DynamoDb\": {\n \
  \     \"Type\": \"AWS::DynamoDB::Table\",\n      \"Properties\": {\n        \"KeySchema\"\
  : [\n          {\n            \"KeyType\": \"HASH\",\n            \"AttributeName\"\
  : \"id\"\n          }\n        ],\n        \"TableName\": \"myTable\",\n       \
  \ \"AttributeDefinitions\": [\n          {\n            \"AttributeName\": \"id\"\
  ,\n            \"AttributeType\": \"S\"\n          }\n        ],\n        \"BillingMode\"\
  : \"PAY_PER_REQUEST\"\n      }\n    }\n  }\n}\n```\n\nSAM 中的 `SimpleTable` 与 CloudFormation\
  \ 中的 DynamoDB 表是同一回事！\n\n当我们开始构建自己的应用程序时，将更多地介绍 SAM，但现在，让我们对比一下 SAM 和 CloudFormation，以便充分发挥两者的优势。\n\
  \n### 理解 SAM 与 CloudFormation 的区别\n\n首先，SAM 模板旨在用于无服务器应用程序和服务。在撰写本文时，SAM 模板参考支持以下资源类型：\n\
  \n*   `AWS::Serverless::API`：创建 API 网关及相关资源\n*   `AWS::Serverless::Application`：创建无服务器应用程序\n\
  *   `AWS::Serverless::Function`：创建 Lambda 函数及相关资源\n*   `AWS::Serverless::HttpApi`：创建\
  \ HTTP API 网关及相关资源\n*   `AWS::Serverless::LayerVersion`：创建 Lambda 层\n*   `AWS::Serverless::SimpleTable`：创建简化的\
  \ DynamoDB 表（仅主键，无排序键）\n\n仍然可以将 CloudFormation 的资源与 SAM 的资源结合使用。例如，如果我们想创建一个带有 `SimpleTable`\
  \ 的 S3 存储桶，可以通过添加 CloudFormation 资源来实现，如下代码所示：\n\n```yaml\nTransform: AWS::Serverless-2016-10-31\n\
  Resources:\n  DynamoDb:\n    Type: AWS::Serverless::SimpleTable\n    Properties:\n\
  \      TableName: myTable\n      PrimaryKey:\n        Name: id\n        Type: string\n\
  \  Bucket:\n    Type: AWS::S3::Bucket\n```\n\n我们只需指定 CloudFormation 特有的资源类型即可。\n\
  \n其次，当您想通过 CLI 部署 SAM 应用程序且无需交互式对话时，*必须* 拥有一个存储桶。原因在于 SAM 应用程序由源代码和模板组成。`SAM CLI`\
  \ 将负责构建应用程序（如果需要编译），并将 Lambda 函数的构建产物上传到 S3。\n\n第三，您*无法*使用 `SAM CLI` 删除 SAM 应用程序。您必须运行\
  \ `aws cloudformation delete-stack` 才能进行清理。\n\n最后但同样重要的是，SAM 允许您通过创建本地 API 网关或针对应用程序运行测试事件来在本地运行测试。\n\
  \n话虽如此，让我们开始使用 SAM 构建我们自己的无服务器应用程序。\n\n### 使用 SAM 编写您的第一个无服务器应用程序\n\n在本节中，我们将创建几个无服务器应用程序，以涵盖\
  \ SAM 的大多数功能。第一个——Hello, World——将使用 AWS Quick Start 模板创建，以便我们快速获得 SAM 的实践经验。\n\n\
  第二个——Party Planner——将从头开发。您无需担心——实际代码不在本书范围内，重点将放在创建包含多个函数的复杂应用程序上。\n\n在开始开发之前，让我们确保拥有所需的一切。\n\
  \n### 先决条件\n\n为了运行 SAM 命令，我们首先需要安装 SAM 及其依赖项。根据您使用的操作系统，步骤会有所不同。以下步骤适用于 macOS 上的安装。\n\
  \n有关如何在其他操作系统上安装 SAM 的指南，请访问 [`docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-install.html`](https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-install.html)。\n\
  \n以下步骤展示了如何安装 SAM：\n\n1.  确保已安装 Docker 和 Homebrew。\n2.  通过发出以下命令安装 SAM CLI：\n  \
  \  ```bash\n    $ brew tap aws/tap\n    $ brew install aws-sam-cli\n    ```\n3.\
  \  通过运行以下命令检查安装：\n    ```bash\n    $ sam --version\n    ```\n\n如果输出中没有任何错误，您就可以开始了！\n\
  \n我们已经安装好了一切，所以让我们开始构建第一个应用程序。\n\n### 开发 Hello, World 应用程序\n\n如果不是一个传统的 Hello, World\
  \ 应用程序，什么才是最好的切入点呢？在本节结束时，我们将部署一个标准的 AWS Quick Start 应用程序，以便获得 SAM 的实践经验：\n\n1.\
  \  我们将从项目初始化开始：\n    `sam init`\n2.  SAM 将响应一个对话框。既然是我们的第一个应用程序，就跟着它走吧。这次我们将选择 **1\
  \ - AWS Quick Start Templates**：\n    Which template source would you like to use?\n\
  \        1 - AWS Quick Start Templates\n        2 - Custom Template Location\n \
  \   Choice: 1\n3.  接下来，我们需要为应用程序选择运行时。让我们选择 `python3.8`：\n    Which runtime would\
  \ you like to use?\n        1 - nodejs12.x\n        2 - python3.8\n        3 - ruby2.5\n\
  \        4 - go1.x\n        5 - java11\n        # the rest of the options...\n \
  \   Runtime: 2\n4.  对于应用程序名称，只需输入 `hello-world`：\n    Project name [sam-app]: hello-world\n\
  5.  SAM 将从 GitHub 克隆模板并要求我们选择一个 Quick Start 模板。我们将选择 `Hello World Example`：\n  \
  \  AWS quick start application templates:\n        1 - Hello World Example\n   \
  \     2 - EventBridge Hello World\n        3 - EventBridge App from scratch (100+\
  \ Event Schemas)\n    Template selection: 1\n6.  完成所有响应后，SAM 将生成一个应用程序并告知我们后续步骤：\n\
  \    -----------------------\n    Generating application:\n    -----------------------\n\
  \    Name: hello-world\n    Runtime: python3.8\n    Dependency Manager: pip\n\n\n\
  \n\n### 应用程序模板：hello-world\n\n### 输出目录\n\n`.\n\n### 后续步骤\n\n后续步骤可在 `./hello-world/README.md`\
  \ 的 README 文件中找到。\n\n### 步骤 7：检查新目录\n\n让我们检查一下新目录：\n\n```\n$ tree .\n.\n├── README.md\n\
  ├── __init__.py\n├── events\n│   └── event.json\n├── hello_world\n│   ├── __init__.py\n\
  │   ├── app.py\n│   └── requirements.txt\n├── template.yaml\n└── tests\n    ├──\
  \ __init__.py\n    └── unit\n        ├── __init__.py\n        └── test_handler.py\n\
  ```\n\n看起来一切都已就绪！我们可以立即部署此应用程序，但首先，让我们检查一下模板中有什么！有几个地方看起来很有趣：\n\n### template.yaml：Globals（全局设置）\n\
  \n```yaml\nGlobals:\n  Function:\n    Timeout: 3\n```\n\n`Globals` 部分用于当我们需要为多个资源定义相同属性时。假设你正在构建一个由多个函数组成的\
  \ Lambda 应用程序。它们都将使用相同的运行时并具有相同的超时时间。为了避免多次重复相同的属性，我们只需将它们存储在 `Globals` 中。\n\n###\
  \ template.yaml：Resources（资源）\n\n```yaml\nResources:\n  HelloWorldFunction:\n  \
  \  Type: AWS::Serverless::Function\n    Properties:\n      CodeUri: hello_world/\n\
  \      Handler: app.lambda_handler\n      Runtime: python3.8\n      Events:\n  \
  \      HelloWorld:\n          Type: Api\n          Properties:\n            Path:\
  \ /hello\n            Method: get\n```\n\n从这里我们可以了解到，`function` 定义有一个 `CodeUri`\
  \ 属性，它指向存放源代码的本地路径。\n\n其次，请看 `Events` 属性。此属性定义将触发函数的事件源。此外，当应用程序部署时，SAM 将 `create`（创建）此资源！在本例中，它将创建一个\
  \ API 网关。\n\n### template.yaml：Outputs（输出）\n\n```yaml\nOutputs:\n  HelloWorldApi:\n\
  \    Description: \"API Gateway endpoint URL for Prod stage for Hello World function\"\
  \n    Value: !Sub \"https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/hello/\"\
  \n  HelloWorldFunction:\n    Description: \"Hello World Lambda Function ARN\"\n\
  \    Value: !GetAtt HelloWorldFunction.Arn\n  HelloWorldFunctionIamRole:\n    Description:\
  \ \"Implicit IAM Role created for Hello World function\"\n    Value: !GetAtt HelloWorldFunctionRole.Arn\n\
  ```\n\n顶部的 API 是作为 `Events` 属性的一部分创建的。然而，IAM 角色在任何地方都未定义，那么我们如何获取其属性呢？\n\n请记住，SAM\
  \ 是一个宏。此角色（以及许多其他资源）将随在此模板中声明的函数一起创建。\n\n### 步骤 8：构建并运行本地测试\n\n接下来，让我们构建此应用程序并运行本地测试：\n\
  \n```\n$ sam build --use-container\nStarting Build inside a container\nBuilding\
  \ resource 'HelloWorldFunction'\nFetching lambci/lambda:build-python3.8 Docker container\
  \ image....\nMounting /Users/karentovmasyan/hello-world/hello_world as /tmp/samcli/source:ro,delegated\
  \ inside runtime container\nBuild Succeeded\nBuilt Artifacts  : .aws-sam/build\n\
  Built Template   : .aws-sam/build/template.yaml\nCommands you can use next\n=========================\n\
  [*] Invoke Function: sam local invoke\n[*] Deploy: sam deploy --guided\nRunning\
  \ PythonPipBuilder:ResolveDependencies\nRunning PythonPipBuilder:CopySource\n```\n\
  \n`build` 命令配合 `--use-container` 参数，将拉取 Docker 镜像并构建源函数，从而安装所有依赖项。构建产物将存储在本地目录中。\n\
  \n### 步骤 9：调用函数\n\n让我们调用它：\n\n```\n$ sam local invoke\nInvoking app.lambda_handler\
  \ (python3.8)\nFetching lambci/lambda:python3.8 Docker container image...\nMounting\
  \ /Users/karentovmasyan/hello-world/.aws-sam/build/HelloWorldFunction as /var/task:ro,delegated\
  \ inside runtime container\nSTART RequestId: c165be27-ff86-1ed2-f5c7-9158dce5d95b\
  \ Version: $LATEST\nEND RequestId: c165be27-ff86-1ed2-f5c7-9158dce5d95b\nREPORT\
  \ RequestId: c165be27-ff86-1ed2-f5c7-9158dce5d95b  Init Duration: 199.95 ms  Duration:\
  \ 3.57 ms  Billed Duration: 100 ms Memory Size: 128 MB  Max Memory Used: 23 MB\n\
  {\"statusCode\":200,\"body\":\"{\\\"message\\\": \\\"hello world\\\"}\"}\n```\n\n\
  我们不需要为本地调用提供许多参数，因为只有一个 Lambda 函数和一个事件。但是，如果我们有多个事件和函数，我们就需要按名称指定它们，如下所示：\n\n```\n\
  $ sam local invoke FunctionNameAsInTemplate \\\n  --event path/to/the/event.json\n\
  ```\n\n在实际响应之前，我们还会获得 Lambda 执行的持续时间和内存信息。当我们需要估算未来无服务器应用程序的成本时，这非常有用。\n\n还有另一种测试函数执行的方法。让我们通过调用\
  \ API 网关来做同样的事情。\n\n### 步骤 10：启动 API\n\n我们将启动 API：\n\n```\n$ sam local start-api\n\
  ```\n\n在输出中，将会有一个我们可以调用的 URL。我们必须使用一个不同的终端窗口，因为当前窗口将显示 API 网关的日志：\n\n```\n$ curl\
  \ localhost:3000/hello\n{\"message\": \"hello world\"}\n```\n\n在 API 网关的日志中，我们将看到与运行本地调用时类似的输出。\n\
  \n我们玩得差不多了——现在让我们在云端运行此应用程序！\n\n### 运行 SAM 应用程序\n\n创建和运行 SAM 应用程序与创建 CloudFormation\
  \ 堆栈略有不同。\n\n遵循之前的步骤，我们将启动我们的 Hello, World 应用程序：\n\n### 步骤 1：打包应用程序\n\n```\n$ aws\
  \ s3 mb s3://mastering-cfn-sam-bucket\n### your bucket name might differ!\n$ sam\
  \ package \\\n  --s3-bucket mastering-cfn-sam-bucket\n```\n\n最后一个命令将打包 Lambda 函数及其依赖项，将它们上传到\
  \ S3，然后用一个新值（指向 S3 对象）替换 `CodeUri`：\n\n```yaml\nAWSTemplateFormatVersion: '2010-09-09'\n\
  Transform: AWS::Serverless-2016-10-31\n### ...\nResources:\n  HelloWorldFunction:\n\
  \    Type: AWS::Serverless::Function\n    Properties:\n      CodeUri: s3://mastering-cfn-sam-bucket/849dd527a4c6568a34af04808b924158\n\
  \      Handler: app.lambda_handler\n      Runtime: python3.8\n### the rest of the\
  \ template...\n```\n\n### 步骤 2：部署应用程序\n\n为了在本地存储此模板并将其用于部署，我们需要添加一个额外的参数：\n\n```\n\
  sam package \\\n  --s3-bucket mastering-cfn-sam-bucket \\\n  --output-template-file\
  \ template-out.yaml\n```\n\n这将把模板存储在工作目录中，并为我们提供创建应用程序堆栈所需的命令：\n\n```\nSuccessfully\
  \ packaged artifacts and wrote output template to file template-out.yaml.\nExecute\
  \ the following command to deploy the packaged template\nsam deploy --template-file\
  \ /Users/karentovmasyan/MasteringCloudformation/Chapter10/hello-world/template-out.yaml\
  \ --stack-name <YOUR STACK NAME>\n```\n\n让我们使用前面的命令进行部署：\n\n```\n$ sam deploy \\\
  \n  --template-file template-out.yaml \\\n  --stack-name hello-world\n  Deploying\
  \ with following values\n  ===============================\n  Stack name       \
  \    : hello-world\n  Region               : None\n  Confirm changeset    : False\n\
  \  Deployment s3 bucket : None\n```\n\n\n\n### 部署输出与错误处理\n\n**功能**: `null`\n\n**参数覆盖**:\
  \ `{}`\n\n### 启动部署\n\n```\n=====================\n```\n\n**错误：为堆栈 `hello-world`\
  \ 创建更改集失败：参数验证失败：**\n\n**参数 `Capabilities` 类型无效，值：`None`，类型：`<class 'NoneType'>`，有效类型：`<class\
  \ 'list'>`，`<class 'tuple'>`**\n\n失败的原因是 SAM 将创建一个 IAM 角色，但我们未提供任何功能。\n\n### 修复部署命令\n\
  \n3. 让我们通过命令行参数添加必要的功能来修复此问题：\n\n```\n$ sam deploy \\\n    --template-file template-out.yaml\
  \ \\\n    --stack-name hello-world \\\n    --capabilities CAPABILITY_IAM\n```\n\n\
  在输出中，我们将看到类似于 CDK 部署的内容—SAM 将要创建的资源、事件日志和输出：\n\n![图 10.1 – 终端输出 (资源)](img/B10533_10_001.jpg)\n\
  \n图 10.1 – 终端输出 (资源)\n\n我们可以通过直接在终端输出中检查事件来跟踪部署过程：\n\n![图 10.2 – 终端输出 (事件)](img/B10533_10_002.jpg)\n\
  \n图 10.2 – 终端输出 (事件)\n\n### 验证部署\n\n4. 最后，让我们调用 API 以确保应用程序部署成功：\n\n```\n$ curl\
  \ https://39llxp6wl2.execute-api.eu-central-1.amazonaws.com/Prod/hello/ # your output\
  \ will be different\n```\n\n```\n{\"message\": \"hello world\"}\n```\n\n就这样！我们拥有了一个在\
  \ AWS 环境中运行的应用程序，它是使用 AWS SAM 开发和部署的。\n\n但这并不是 SAM 能做的唯一事情！除了构建和部署操作外，它还可以用来检查应用程序日志。\n\
  \n### 使用 SAM 检查日志\n\nSAM 允许您直接从 CLI 获取 CloudWatch 日志。这使得在生产环境中调试或跟踪应用程序变得更容易一些。\n\
  \n要读取日志，我们只需提供以下参数：\n\n```\n$ sam logs \\\n    -n FUNCTION_LOGICAL_NAME \\\n   \
  \ --stack-name STACK_NAME \\\n    --tail\n```\n\n因此，在我们的案例中，我们将按如下方式运行命令：\n\n```\n\
  $ sam logs \\\n    -n HelloWorldFunction \\\n    --stack-name hello-world \\\n \
  \   --tail\n```\n\n运行后，我们将从 CloudWatch Logs 获取确切的条目。由于我们的函数代码中没有打印语句，日志不会显示太多内容：\n\
  \n![图 10.3 – 终端输出 (SAM 日志)](img/B10533_10_003.jpg)\n\n图 10.3 – 终端输出 (SAM 日志)\n\n\
  要清理 `hello-world` 堆栈，我们需要使用 `awscli`：\n\n```\n$ aws cloudformation delete-stack\
  \ \\\n    --stack-name hello-world\n```\n\n我们现在完成了 Hello, World 应用程序的尝试。让我们构建一些更复杂的东西——我们的第二个应用程序。\n\
  \n### 使用 SAM 创建复杂应用程序\n\n我们将创建一个小型派对规划器——一个处理和存储派对及客人信息的应用程序。\n\n让我们看看这个应用程序的设计：\n\
  \n![图 10.4 – 无服务器派对规划器](img/B10533_10_004.jpg)\n\n图 10.4 – 无服务器派对规划器\n\n此应用程序中有几个步骤：\n\
  \n1. **API** 网关将发送包含派对和客人信息的负载。\n2. **Registration** 函数将在 **Parties** 表中创建一个新条目（如果该派对不存在），并存储客人信息（如姓名和饮食限制）。\n\
  3. **Reporting** 函数将检查是否有未来的派对（派对日期不在过去）。\n4. **Reporting** 函数（一个计划任务）将获取客人信息并生成规划报告。\n\
  5. **Reporting** 函数将此报告存储在 S3 存储桶中。\n\n我们知道我们的应用程序长什么样，以及它应该做什么。现在让我们使用 SAM 来构建它！\n\
  \n我们将首先创建项目结构：\n\n```\n$ mkdir registration reporting\n$ touch template.yaml\n```\n\
  \n接下来，我们需要为模板定义资源。我们将需要以下资源：\n\n* 两个 Lambda 函数（`Registration` 和 `Reporting`）\n*\
  \ 一个 S3 存储桶（`Reports`）\n* 两个 DynamoDB 表（`Parties` 和 `Guests`）\n* 一个 API 网关\n\n请记住，Lambda\
  \ 函数使用不同的类型（`AWS::Serverless::Function`）进行定义。我们将使用此类型创建函数，以便我们可以将事件触发器（在我们的例子中是\
  \ API 网关）作为此资源的一部分创建。\n\n以下步骤将帮助我们实现本节的目标：\n\n### 1. 声明 Registration 函数\n\n**template.yaml**\n\
  \n```yaml\nResources:\n  RegistrationFunction:\n    Type: AWS::Serverless::Function\n\
  \    Properties:\n      CodeUri: registration/\n      Events:\n        register:\n\
  \          Type: Api\n          Properties:\n            Path: /register\n     \
  \       Method: post\n```\n\n此函数类似于我们作为 Hello, World 应用程序一部分创建的函数。但是，我们需要向它添加一些额外的内容。\n\
  \nSAM 堆栈还将具有 `RegistrationFunctionRole`，这是一个具有 Lambda 函数基本 IAM 策略的 IAM 角色。我们还需要一个允许我们的函数向\
  \ DynamoDB 放入项目的策略。\n\n### 2. 创建 DynamoDB 表\n\n**template.yaml**\n\n```yaml\nResources:\n\
  \  # ...\n  PartiesTable:\n    Type: AWS::Serverless::SimpleTable\n    Properties:\n\
  \      PrimaryKey:\n        Name: PartyName\n        Type: String\n  GuestsTable:\n\
  \    Type: AWS::Serverless::SimpleTable\n    Properties:\n      PrimaryKey:\n  \
  \      Name: GuestName\n        Type: String\n```\n\n### 3. 添加访问表的策略\n\n**template.yaml**\n\
  \n```yaml\nResources:\n  RegistrationFunction:\n    Type: AWS::Serverless::Function\n\
  \    Properties:\n      # ...\n      Policies:\n        Statement:\n          -\
  \ Effect: Allow\n            Action:\n              - dynamodb:PutItem\n       \
  \       - dynamodb:GetItem\n            Resource:\n              - !Sub \"arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PartiesTable}\"\
  \n              - !Sub \"arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${GuestsTable}\"\
  \n```\n\n由于 `AWS::Serverless::SimpleTable` 不返回 DynamoDB 表的 ARN，我们必须使用 `Fn::Sub`\
  \ 来生成它。\n\n### 4. 创建报告存储桶\n\n**template.yaml**\n\n```yaml\nResources:\n  # ...\n\
  \  ReportsBucket:\n    Type: AWS::S3::Bucket\n```\n\n别忘了我们将为此使用 CloudFormation 的类型，因为\
  \ S3 不是 SAM 规范的一部分。\n\n最后，我们将声明一个有一些差异的报告函数。\n\n### 5. Reporting 函数的策略\n\n第一个区别是策略，因为我们需要不同的\
  \ IAM 权限来让 **Reporting** 函数工作：\n\n**template.yaml**\n\n```yaml\nResources:\n  #\
  \ ...\n  ReportingFunction:\n    # ...\n    Policies:\n      Statement:\n      \
  \  - Effect: Allow\n          Action:\n            - dynamodb:GetItem\n        \
  \    - dynamodb:Scan\n          Resource:\n            - !Sub \"arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PartiesTable}\"\
  \n            - !Sub \"arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${GuestsTable}\"\
  \n        - Effect: Allow\n          Action:\n            - s3:ListBucket\n    \
  \        - s3:GetBucketAcl\n            - s3:PutObject\n          Resource:\n  \
  \          - !GetAtt ReportsBucket.Arn\n            - !Sub \"${ReportsBucket.Arn}/*\"\
  \n```\n\n### 6. 定时事件触发\n\n接下来，我们需要更改事件，因为此函数是一个计划作业。在 Lambda 中运行计划作业的唯一方法是使用 CloudWatch\
  \ 计划事件。\n\n我们通过为 `Events` 使用不同的类型来添加计划事件：\n\n**template.yaml**\n\n```yaml\nResources:\n\
  \  # ...\n  ReportingFunction:\n```\n\n\n\n### SAM 模板片段\n\n```yaml\nType: AWS::Serverless::Function\n\
  Properties:\n  # ...\n  Events:\n    scheduled:\n      Type: Schedule\n      Properties:\n\
  \        Schedule: \"rate(1 day)\"\n```\n\n这将创建一个具有生成名称的计划事件，并将其映射到 `Reporting`\
  \ 函数。\n\n应用程序的代码不在本书范围内，但这些函数将使用作为堆栈一部分创建的 DynamoDB 表工作。然而，我们没有在 `Properties` 资源中设置表的名称，因此它们需要在堆栈创建期间生成。\n\
  \n那么，我们如何让应用程序知道连接哪个表？我们可以通过模板中的环境变量来实现！\n\n### 7. 向 `Globals` 部分添加环境变量\n\n**template.yaml**\n\
  \n```yaml\nGlobals:\n  Function:\n    Timeout: 30\n    Runtime: python3.8\n    Handler:\
  \ app.lambda_handler\n    Environment:\n      Variables:\n        PARTIES_TABLE:\
  \ !Ref PartiesTable\n        GUESTS_TABLE: !Ref GuestsTable\n        REPORTS_BUCKET:\
  \ !Ref ReportsBucket\n```\n\n这些属性将被两个 Lambda 函数（`Registration` 和 `Reporting`）继承，因此我们不需要在资源定义中重复这些内容。\n\
  \n还有一件事我们可以做。我们可以创建一个事件，用于测试我们的部署。将来我们也可以用它来测试本地调用。\n\n### 8. 创建一个简单的虚拟事件\n\n**events/event.json**\n\
  \n```json\n{\n  \"PartyName\": \"Birthday\",\n  \"PartyDate\": \"2020-01-01\",\n\
  \  \"GuestName\": \"John Doe\",\n  \"GuestDiet\": \"Vegan\"\n}\n```\n\n一旦我们创建了应用程序堆栈，稍后将使用此事件。\n\
  \n### 9. 构建、打包并部署我们的应用程序\n\n```bash\n$ sam build \\\n    --use-container\n\n$ sam\
  \ package \\\n    --s3-bucket mastering-cfn-sam-bucket \\\n    --output-template-file\
  \ template-out.yaml\n\n$ sam deploy \\\n    --template-file template-out.yaml \\\
  \n    --stack-name party \\\n    --capabilities CAPABILITY_IAM\n```\n\n### 10. 通过运行简单的\
  \ curl 来检查我们的函数是否正确执行\n\n```bash\ncurl -X POST \\\n    -d @events/event.json \\\n\
  \    -H \"Content-Type: application/json\" \\\n    # Your API URL might differ\n\
  \    https://tzsewdylmj.execute-api.eu-central-1.amazonaws.com/Prod/register\n```\n\
  \n我们在响应中什么也得不到，因为我们的函数只返回 `200 OK` HTTP 代码。\n\n要检查结果，我们将转到 DynamoDB 控制台并检查项目：\n\n\
  ![图 10.5 – DynamoDB 控制台](img/B10533_10_005.jpg)\n\n图 10.5 – DynamoDB 控制台\n\n新派对也被添加到了\
  \ `PartiesTable`：\n\n![图 10.6 – DynamoDB 控制台](img/B10533_10_006.jpg)\n\n图 10.6 –\
  \ DynamoDB 控制台\n\n### 11. 最后要测试的是运行第二个函数。这是一个计划任务，所以我们必须手动调用它：\n\n```bash\n$ aws\
  \ lambda invoke \\\n    # Your function will have a different name!\n    --function-name\
  \ party-ReportingFunction-17431GZNIJXPE \\\n    --payload '{}' \\\n    out.txt\n\
  \n{\n  \"StatusCode\": 200,\n  \"ExecutedVersion\": \"$LATEST\"\n}\n```\n\n响应显示执行期间没有未处理的异常，这是个好迹象！\n\
  \n让我们检查上传到 S3 的文件：\n\n```bash\n$ aws s3 ls \\\n    # Your bucket name will be different!\n\
  \    s3://party-reportsbucket-1usezdtprgt9z\n\n2020-02-19 19:58:42       124 Birthday.txt\n\
  \n$ aws s3 cp \\\n    s3://party-reportsbucket-1usezdtprgt9z/Birthday.txt .\n\n\
  $ cat Birthday.txt\n---\nParty Planning Report!!!\nPrepare for Birthday on 2021-01-01!\n\
  Guests list:\n- John Doe who is restricted to eat Vegan\n---\n```\n\n这显示了我们刚刚存储在\
  \ DynamoDB 中的数据的确切输出！\n\n我们刚刚成功部署并运行了一个由多个 Lambda 函数组成的无服务器应用程序，使用 SAM 作为一个一体化工具！\n\
  \n### 摘要\n\n在本章中，我们了解了 AWS SAM——一个专为无服务器应用程序设计的易于使用的 CloudFormation 扩展。我们学习了 SAM，它与\
  \ CloudFormation 的区别，以及它的组成部分。\n\n我们了解了 SAM 项目的结构、部署和操作选项，以及如何开发简单和复杂的无服务器应用程序。这些知识将帮助你理解是否想要开始对特定项目或应用程序使用\
  \ SAM，还是坚持使用 CloudFormation。\n\n这是本书的最后一章*技术*章节。你做得很好，希望你从本书中学到了很多，并将利用这些知识使用 CloudFormation\
  \ 在 AWS 上构建生产就绪、可扩展的解决方案。\n\n在下一章中，我们将坐下来，放松一下，尝试找出我们可以从 CloudFormation 和 IaC 整体中期待什么。\n\
  \n敬请期待！\n\n### 问题\n\n1. 是否可以创建不属于 SAM 引用一部分的资源？\n2. 哪个命令启动本地 API 网关？\n3. 是否可以使用\
  \ SAM CLI 删除 SAM 堆栈？\n4. 是否可以使用 SAM 在 DynamoDB 表中创建排序键？\n5. 运行 `sam package` 时会发生什么？\n\
  \n### 延伸阅读\n\n* 对比 SAM 与 Serverless Framework：<https://sanderknape.com/2018/02/comparing-aws-sam-with-serverless-framework/>\n\
  * SAM 应用程序示例：<https://github.com/aws-samples/serverless-app-examples>\n* Jeff Barr\
  \ 关于 SAM 的博客文章：<https://aws.amazon.com/blogs/aws/aws-serverless-application-model-sam-command-line-interface-build-test-and-debug-serverless-apps-locally/>\n"
- "## 第 11 章：未来展望\n\n欢迎来到《精通 AWS CloudFormation》的最后一章！\n\n在本章中，我们将坐下来放松一下，因为我们已经花费了大量精力学习\
  \ CloudFormation、它的功能、特性和扩展。本章将让我们洞悉 CloudFormation 和基础设施即代码的未来发展。\n\n你可能会好奇，为什么我们要通过预测来结束这本书，而你可能更有兴趣继续练习使用\
  \ CloudFormation。\n\n你可能是对的。这本书旨在帮助你精通 CloudFormation，你已经为此忙碌了 10 个漫长的章节。但有一件事你需要考虑。\n\
  \n世界在不断变化，IT、开发、云提供商和 AWS 也是如此。我们无法完全准备好迎接未来，但我们可以尝试预测它。归根结底，不仅是技术技能，还有博学和心态造就了一名优秀的工程师。\n\
  \n我们将尝试了解以下主题：\n\n* 基础设施即代码的未来\n* 理解 Terraform 与 CloudFormation 的区别\n* 理解云开发工具包\
  \ (CDK) 的价值\n\n### 基础设施即代码的未来\n\n在预见未来之前，我们需要了解过去。\n\n*基础设施即代码* 这个术语并不新鲜。它的根源可以追溯到\
  \ 90 年代，当时系统管理员使用 Perl 和 Shell 脚本来自动化他们的日常工作。系统管理员与开发人员相似，但关注点不同（主要关注自动化和基础设施的稳定性）。\n\
  \n\n\n\n### 基础设施即代码的演进\n\n这种关注点的转变始于 2006 年 Amazon Web Services 的推出，只需几分钟，您就能拥有一队随时可用的虚拟机。供应速度的提升引入了扩展性能的问题。\n\
  \n此外，使用高级编程语言开发自己的基础设施管理工具也很困难。最终，配置管理工具开始出现：`Chef`、`Puppet`、`Ansible` 等。\n\n后来，幂等性和可声明式基础设施成为必要需求。配置管理工具能提供基础设施的状态，但将其从几十台扩展到几百台、再到数千台受管机器很困难，这些系统无法承受如此负载。\n\
  \n工程师们还希望将资源供应和配置管理结合起来。`CloudFormation` 于 2011 年发布，是第一个能同时做到这两点的工具。它是一个复杂的系统，但改变了我们实施运维和基础设施部署的方式。您不再需要创建服务请求或在\
  \ AWS 控制台中点击操作，只需编写一个 `JSON` 模板即可供应整个基础设施。\n\n随后在 2014 年，HashiCorp 推出了 CloudFormation\
  \ 的竞争对手——`Terraform`。Terraform 提供了不同的方法，并支持多云提供商，例如 `GCP` 和 `Azure`。另一个所谓的 `killer\
  \ feature`（杀手级特性）是其创建 Provider 的能力，Provider 是充当 Terraform 与服务提供商之间接口的软件程序。\n\nTerraform\
  \ 使用其自己的 `domain-specific language`（`DSL`，领域特定语言），称为 `HashiCorp Configuration Language`（`HCL`）。其语法类似于\
  \ `JSON`，但更易于阅读和审查。\n\nCloudFormation 和 Terraform 走上了不同的发展道路，我们将在下一节中回顾这一点，但目前我们需要坚持讲述这个故事。\n\
  \n随着云服务提供商的成长和发展，术语 `infrastructure`（基础设施）越来越多地失去了其原始含义。基础设施不再是一堆虚拟机或数据库：它是作为软件业务和产品的基础基石而存在的事物。\n\
  \n在越来越多的服务中应用 `infrastructure as code` 并将其与 `software development life cycle`（`SDLC`，软件开发生命周期）集成，引入了另一组问题。\n\
  \n什么是 `build artifact`（构建产物）？它是基础设施即代码的最终产品吗？它是指示服务提供商启动特定资源的声明文件吗？它是一个框架？还是提供了必要资源和端点的基础设施状态？\n\
  \n如果是这样，它的 `code`（代码）部分是什么？我们如何将通用的软件工程实践应用于它，例如单元测试和集成测试？我们如何确保基础设施的变更不会破坏应用程序？\n\
  \n此外，我们能否将应用软件与基础设施集成？我们能否真正将它们作为单个软件组件结合起来？\n\n各种平台，例如 `Kubernetes`，提供了将应用程序的基础设施（或其引用）与源代码结合在一起的机会，而底层基础设施是自我管理的，不需要太多关注。\n\
  \n基础设施已从互联网时代的 `just virtual machines`（仅仅是虚拟机）演进为基础设施即服务、平台即服务和软件即服务。现在您可以简单地订购计算、存储或任何其他单元，并获得一个用于工作的端点。例如，您无需创建\
  \ NoSQL 数据库，而是可以创建一个 `DynamoDB` 表并立即使用它，而无需考虑底层基础设施、冗余和性能。\n\n在这种抽象层级上，我们开始注意到应用程序（例如，一段软件）与底层基础设施之间没有太大区别。这是否意味着我们可以开始将它们结合起来？\n\
  \n让我们看看这段伪代码：\n\n```\nfrom infrastructure import network, database, compute\nfrom\
  \ application import Application\nimport source_code\n\n### Declare infrastructure\
  \ to run application on\nnet = network.new(cidr=\"10.0.0.0/16\",\n             \
  \     subnets=3,\n                  mask=24)\n\ndb = database.new(engine=\"mysql\"\
  ,\n                  cpu=2,\n                  mem=2048,\n                  network=net)\n\
  \nnode_cluster = compute.vm_cluster.new(count=3,\n                             \
  \         cpu=2,\n                                      mem=2048,\n            \
  \                          network=net)\n\n### Declare application and attach to\
  \ an infrastructure\napp = Application.new()\napp.use_db(db)\napp.run_on(node_cluster)\n\
  app.build.from_source(source_code)\n```\n\n如果这段代码存在，它将连接到云环境，创建我们声明使用的所有内容，然后在其上构建和部署应用程序。\n\
  \n即使我们可以在同一代码中结合实际应用程序和基础设施，我们仍然面临工程角色的问题。那么运维人员是谁？软件工程师？系统工程师？DevOps 工程师？站点可靠性工程师？\n\
  \n可以肯定的是，经典的孤岛模型——开发人员和运维人员在不同的责任区工作，拥有不同的优先级——正在逐渐消失。如今，我们有了解操作系统和计算机网络的开发人员，也有会写代码的系统工程师。\n\
  \n行业正朝着融合方向转变，基础设施即代码极有可能最终仅仅成为 `code`（代码）。\n\n但我们尚未到达那里。在您继续云自动化之旅之前，我希望您比较这两个竞争对手——CloudFormation\
  \ 和 Terraform——并了解它们的区别。学习这一点将帮助您为您特定的当前或未来情况做出正确决策。\n\n### 理解 Terraform 与 CloudFormation\
  \ 的区别\n\n首先，我们评估 CloudFormation 和 Terraform 并非为了找出市场上**最好**的基础设施即代码工具。我们的目标是找到一个适合目的和我们用例（无论它将是什么）的工具。\n\
  \n我们将查看以下特性：\n\n*   Provider 支持\n*   声明语法\n*   开发和部署方法论\n\n让我们从 Provider 支持开始。\n\
  \n### Provider 支持\n\n作为 Amazon Web Services 的发明，CloudFormation 最初仅支持其自身作为唯一的服务提供商。\n\
  \nTerraform 被开发为一种 `cloud-agnostic`（云无关/云中立）工具，意味着它能与各种云和服务提供商通信，从而使其成为统管一切的单一工具。\n\
  \n这一概念通过使用 Provider 实现——Provider 是处理服务提供商与 Terraform 之间通信的特定抽象。Provider 使用与 Terraform\
  \ 相同的语言编写（例如 `Golang`），可在本地使用（如果您需要为特定目的创建自己的 Provider），或通过 `OpenSource` 分发并通过特殊表单提交给\
  \ HashiCorp。\n\nTerraform 拥有大量 Provider，既有由供应商开发的（`https://www.terraform.io/docs/providers/index.html`），也有社区开发的（`https://www.terraform.io/docs/providers/type/community-index.html`）。HashiCorp\
  \ 在构建框架和包装器上投入巨资，以使 Provider 开发对每个人都变得可行。\n\n\n\n\n\n一方面，Terraform 作为一种通用的基础设施即代码工具取得的成功，让主要云提供商的竞争对手——AWS\
  \ CloudFormation、Azure Resource Manager 和 Google Cloud Deployment Manager——毫无机会。另一方面，Terraform\
  \ 严重依赖这些提供商的开发速度——显而易见，云提供商的工具将率先支持最新的服务和 API 变更。除此之外，工程师还必须负责向后兼容性，因为提供商的新版本可能无法与模板中资源声明的旧版本配合工作。\n\
  \n然而，创建外部资源（例如 AWS 之外的资源）的能力是令人向往的。虽然自定义资源（CRs）允许我们这样做，但很难大规模地妥善组织它们。想象一下为 GCP 创建\
  \ CRs，以便你可以使用 CloudFormation 在 GCP 中创建资源。\n\nCloudFormation 开发团队针对这一问题提出了一个集中式解决方案。一项名为\
  \ CloudFormation Registry 的新功能允许我们创建自己的资源提供商——以类似于 Terraform 的方式——不仅使用 Go，还使用 Java（正式发布）和\
  \ Python（撰写时处于开发者预览阶段）！\n\nCloudFormation Registry 不在本书讨论范围内，因为 AWS 工程师极不可能需要创建自己的提供商；然而，Atlassian、Datadog、New\
  \ Relic、SpotInst 等服务提供商已经在接入过程中。CloudFormation 很快很可能会在支持的供应商种类上与 Terraform 竞争。\n\
  \n让我们继续探索，看看语法差异。\n\n### 声明语法\n\n我们知道，CloudFormation 模板根据开发者的偏好使用 JSON 或 YAML 编写。CloudFormation\
  \ 的声明是一个键值块，其中键是资源的逻辑名称，值是其属性，如类型和属性。\n\n以下代码展示了 CloudFormation 资源的资源声明：\n\n```yaml\n\
  MyResourceLogicalName:\n  Type: AWS::Service::ResourceType\n  Properties:\n    PropertyA:\
  \ some value\n    PropertyB: some value\n    # and so on\n```\n\n此声明使得在声明中使用 `Fn::Sub`、`Fn::Ref`\
  \ 和 `Fn::GetAtt` 等函数引用资源标识符变得容易。\n\nTerraform 拥有自己的领域特定语言，称为 HashiCorp Configuration\
  \ Language (HCL)。HCL 是一种类 JSON 语言，在其之上添加了少量的语法糖。\n\n假设我们想使用 Terraform 在 AWS 中创建一个\
  \ VPC 和一个子网。我们的模板文件将如下所示：\n\n```hcl\nresource \"aws_vpc\" \"vpc\" {\n  cidr_block\
  \ = \"10.0.0.0/16\"\n}\n\nresource \"aws_subnet\" \"subnet\" {\n  vpc_id     = \"\
  ${aws_vpc.vpc.id}\"\n  cidr_block = \"10.0.1.0/24\"\n}\n```\n\n正如你所见，存在巨大差异。\n\n\
  资源的实际类型是关键字 `resource` 后的第一个字符串，随后是逻辑名称（`resource \"RESOURCE_TYPE\" \"LOGICAL_NAME\"\
  \ {}`），而在 CloudFormation 中，我们拥有资源的逻辑名称，后跟在单独字段中的类型。\n\n第二个区别是，我们需要提供资源类型、逻辑名称和属性（`${aws_vpc.vpc.id}`），以便我们可以在另一个资源中引用它，因为\
  \ Terraform 不支持任何默认返回值，如 CloudFormation 和 `Fn::Ref`。\n\n还有许多其他差异，例如 HCL 中的迭代和条件，它们用于赋予提供\
  \ CloudFormation 已支持的相同功能的能力，但这不是我们目前的主要关注点。\n\n现在让我们看看最后但同样重要的一点——部署和开发。让我们深入了解。\n\
  \n### 开发和部署方法论\n\nCloudFormation 在开发方面很灵活。AWS 工程师可以使用嵌套堆栈，或使用 `exports` 和 `Fn::ImportValue`\
  \ 进行跨堆栈资源引用，以独立管理每一块基础设施。内部函数的巨大多样性和敏捷性使 AWS 工程师能够创建可复用的模板。\n\n说到部署和堆栈操作，CloudFormation\
  \ 应有尽有。ChangeSets 允许对堆栈更新进行细粒度控制，而 `aws cloudformation deploy` 命令使为新旧堆栈创建持续交付管道变得简单。\n\
  \n如下列表所示，CloudFormation 拥有针对各种情况的大量能力：\n\n*   对于大规模基础设施或产品，有 StackSets。\n*   对于定制化，有模板宏和自定义资源。\n\
  *   对于配置管理，有 `cfn-init`。\n*   对于预置安全，有 CloudFormation 服务角色。\n*   在发生故障时，有 CloudFormation\
  \ 最重要且最有用的功能之一，即自动无缝回滚。\n\nAmazon Web Services 通过使 CloudFormation 适应任何类型的公司，在 AWS\
  \ 上运行其应用程序和系统，做了一项出色的工作。\n\nTerraform 遵循不同的路径。它不专注于单一云——相反，它试图支持尽可能多的云提供商、第三方服务，甚至外部系统。\n\
  \n你可以将已知的配置管理系统（如 Ansible、Puppet、Chef 和 SaltStack）与 Terraform 结合使用，通过预配器（provisioners）来实现，如果你曾将它们用于本地基础设施并正在迁移到云端，这将节省大量时间。Terraform\
  \ 能够通过其 API 使用 `data` 从提供商检索信息，例如，它可以调用 AWS 的 API 以获取现有 VPC 的 ID 并用其创建子网。\n\nTerraform\
  \ 不支持回滚，所以如果事情变糟，你必须依赖其状态文件备份——存储在本地或远程。\n\n话虽如此，决定权在你——工程师——手中，由你决定是想使用 Terraform\
  \ 还是 CloudFormation。如果你习惯使用 YAML 和 JSON 并计划仅与 AWS 合作，则选择 CloudFormation。如果你正在寻找一个供应商无关的工具，拥有数十种服务和开源社区的支持，那么你可能想看看\
  \ Terraform。\n\n本章不仅关乎使用声明式语言定义基础设施。在下一节中，我们将看看它们潜在的继任者以及它们为 IT 领域的每个人带来的价值。\n\n\
  ### 理解 Cloud Development Kit 的价值\n\n基于 DSL 的工具，如 CloudFormation 和 Terraform，仍然是基础设施即代码的标准。它们广为人知，拥有庞大的全球社区，并持续发展。\n\
  \n然而，它们也存在一些问题，而其继任者 CDK 能够解决这些问题。\n\n在本节中，我们将抢先了解 CDK 为行业带来的变化和价值。\n\n我们将从测试能力开始，因为这是基础设施即代码的主要痛点之一。\n\
  \n### 测试基础设施\n\n为了测试计算机程序，我们所要做的就是构建它，然后运行一些编写好的测试场景。软件的预期行为是已知的，所以你所需要的只是获得正确的结果。\n\
  \n在*第 4 章* *持续集成和部署* 中，我们通过部署基础设施并在其上运行特定的基础设施测试，用 CloudFormation 做到了这一点。对于声明式工具，这是我们测试它们的唯一可行方法，但为测试启动单独的基础设施是一个漫长且在某些情况下非常昂贵的过程。在某些情况下，这甚至是不可能的。\n\
  \n这主要是因为模板中声明资源的方式并不意味着服务提供商能够处理该信息。例如，CloudFormation 无法判断我们为 EC2 实例提供的 AMI ID 是否正确。此外，当我们编写\
  \ Pod 声明时，Kubernetes 无法判断 Docker 镜像是否存在。\n\n\n\n\n\n### CDK：测试、资产与集成\n\n缺乏测试支持也源于对测试内容的模糊认识。我们需要测试什么？资源是否会被创建？资源是否会*完全*按照我们的声明被创建？为什么不应该这样做？\n\
  \n然而，始终应该测试的是集成。在大型项目和基础设施中，我们不仅仅关心一个包含一堆机器的小型网络。那里有成百上千个计算、存储、传输、分析及其他资源，所有这些都由不同的团队开发和预配。\n\
  \nCDK 提供了一种创建基础设施的不同方式。我们不再编写关于创建什么的声明式指令，而是使用**面向对象编程**（**OOP**）范式编写计算机程序。每个资源都是一个类，并与其他类存在关系。`VPC`\
  \ 是一个类。`Subnet` 是一个与 `VPC` 相关的类。`RDS 数据库子网组` 是一个与子网相关的类。\n\n这些关系是以编程方式声明的，此外，CDK\
  \ 是一个编程语言框架。这意味着你不是在编写模板——你实际上是在编写一段软件！\n\n这使你能够针对它运行复杂的测试，利用软件工程领域的最佳实践。而这一切甚至不需要花费一分钱去创建数十或数百个资源来进行验证！\n\
  \n而在 CDK 的帮助下，测试并不是我们能做的唯一事情。将应用程序与基础设施结合起来又如何？\n\n### 添加工件\n\n当我们使用纯 CloudFormation\
  \ 时，无法向其中添加工件，仅仅因为 CloudFormation 是一个用于预配基础设施和资源的系统，我们的应用程序将运行在其上。通过 `cfn-init`\
  \ 部分添加了对将应用程序添加到堆栈的支持。借助无服务器应用程序模型，可以拥有包含基础设施模板的一体化源代码，但这仅适用于基于 AWS Lambda 的应用程序。\n\
  \nCDK 不仅仅是一个生成 CloudFormation 模板的框架——它在其之上附带了许多抽象。\n\n其中一种抽象是 `assets`（资产），即 CDK\
  \ 构造，用于打包应用程序工件，无论它是二进制文件、ZIP 文件、目录还是 Docker 镜像。\n\n想象一下，你有一个项目结构，源代码位于 `foo` 目录中。该目录还包含一个\
  \ Dockerfile，它会被构建并推送到 AWS ECR 仓库。\n\n在这种情况下，我们可以使用资产来打包镜像并将其包含在我们的基础设施中，如下例所示：\n\
  \n```python\nimport aws_cdk.aws_ecs as ecs\n\nfrom aws_cdk.aws_ecr_assets import\
  \ DockerImageAsset\n\n### 使用应用路径声明 Asset 对象\nasset = DockerImageAsset(self,\n  \
  \                       \"image\",\n                         directory=\"/path/to/foo\"\
  )\n\n### 声明任务定义\ntd = ecs.FargateTaskDefinition(self,\n                        \
  \       \"td\",\n                               memory_limit_mib=512,\n        \
  \                       cpu=256)\n\n### 将基于 Asset 镜像构建的容器添加到任务定义\ntd.add_container(\"\
  container\", image=ecs.ContainerImage.from_ecr_repository(asset.repository,\n  \
  \                                                                         asset.image_uri))\n\
  ```\n\n这段代码的作用是：它构建并推送包含原始应用程序源代码的 Docker 镜像，并将其发送到 ECR 仓库。然后，它创建一个包含容器定义的 ECS 任务定义，指向\
  \ ECR 镜像 URI 作为源。\n\n这种抽象使我们能够真正地将应用程序与基础设施混合在一起，将它们作为一个整体进行管理！而且由于 CDK 是一个多语言项目，越来越多的产品和项目可以利用这一点进行构建，而无需强迫开发者学习额外的语言（尽管这仍然是一项很不错的技能）。\n\
  \nCDK 才刚刚开始它的旅程，但其未来充满希望且将改变游戏规则。它可能不会取代 CloudFormation（这样一个系统根本无法被取代），但迟早，它将充当开发者编写的代码与实际运行、服务的基础设施之间的翻译机制。\n\
  \n### 总结\n\n在本章中，我们了解了未来可以期待什么。首先，我们回顾了基础设施的过去与未来——什么在改变，这些变化对我们这些 AWS 专业人士意味着什么。然后，我们定义了\
  \ CloudFormation 与其最大竞争对手 Terraform 之间的主要区别，以及为什么这两个系统遵循如此不同的路径。在本章末尾，我们探讨了 CDK\
  \ 为我们带来的实际价值。\n\n牢记这些，你应该能够理解在你的旅程中下一步该去向何方。你是否想继续精通 CloudFormation？读完这本书后，你所需要的唯一信息都在\
  \ CloudFormation 的文档中。CloudFormation 开发团队正在努力开发和演进他们的产品，所以请花些时间查看他们的覆盖路线图和公共仓库，那里有大量有用的信息。\n\
  \n你是否想开始实践软件开发？如果是，CDK 是一个很好的起点。\n\n祝你在这段旅程中一切顺利。让我们看看它将带我们去往何方！\n\n### 延伸阅读\n\n\

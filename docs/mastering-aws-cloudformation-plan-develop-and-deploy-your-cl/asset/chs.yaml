  \ Medium 和 Telegram 上的两个个人博客撰写内容。\n\n我要感谢我的家人、朋友、读者，以及所有日复一日坚持学习和提升自己的人们。\n\n# 关于审阅者\n\
  \n**Anton Tokarev** 目前在一家名为 Softeq 的公司工作，使用 AWS 服务。近 10 年前，他作为网络工程师开始了 IT 职业生涯。他喜欢用\
  \ Python 和 Go 编写代码。他拥有初创公司、大公司、产品开发公司和外包公司的经验。\n\n**Aleksandr Patrushev** 在 IT 领域工作了\
  \ 12 年以上，担任系统工程师和公开演讲者，他职业生涯的每一步都与前一步形成对比：从 x86 系统工程师到 IBM 的 IBM Power Systems 系统工程师，到\
  \ Vmware 的 VMware 系统工程师，再到 AWS 的 AWS 解决方案架构师。每一次他都跳出舒适区，奔向新的理念和技术。目前，他是一名 AWS 解决方案架构师，帮助各种规模的公司（从初创公司到大型企业）完成适应云技术以满足业务需求的激动人心的过程。他喜欢为复杂的项目和挑战寻找最高效的解决方案。本书评论中表达的观点仅代表他个人。\n\
  \n我想感谢本书作者 Karen Tovmasyan，他决定花费时间创作这本有趣的书，将帮助人们理解如何用简单的语言和示例实施 IaC 方法。\n\n# Packt\
  \ 正在寻找像您这样的作者\n\n如果您有兴趣成为 Packt 的作者，请访问 [authors.packtpub.com](http://authors.packtpub.com)\
  \ 立即申请。我们已与数千名开发人员和技术专业人士合作，就像您一样，帮助他们与全球技术社区分享见解。您可以提交一般申请，申请我们正在招募作者的特定热门主题，或提交您自己的想法。\n\
  \n# 前言\n\nAWS CloudFormation 于 2011 年发布，是对 `infrastructure as code`（基础设施即代码）这一管理现代应用程序、系统和服务器的新兴方法的首次回应。\n\
  \n在本书中，您将学习如何以最高效的方式在 AWS 上使用 CloudFormation 应用 `Infrastructure-as-Code`（基础设施即代码）。\n\
  \n读完本书后，您将了解 CloudFormation 的所有内部原理、实际使用方法、相关最佳实践，以及使用模板宏和自定义资源扩展其功能的各种方式。\n\n您还将了解其无服务器应用程序的替代方案——无服务器应用程序模型，以及其可能的未来继任者——云开发工具包。\n\
  \n# 适读人群\n\n本书适合日常使用 AWS 的工程师。虽然您将在书中找到对大多数示例和代码块的广泛而深入的解释，但我希望您具备基本的编程知识（最好是 Python）、通用\
  \ IT 知识，尤其是 AWS 知识，以及对 RESTful API、JSON 和 YAML 的理解。\n\n# 本书内容\n\n*   **第 1 章**，*CloudFormation\
  \ 复习*，提醒您什么是 CloudFormation 以及它是如何工作的。\n*   **第 2 章**，*高级模板开发*，涵盖模板的每一个组成部分——CloudFormation\
  \ 的核心组件。\n*   **第 3 章**，*堆栈的验证、检查和部署*，教导您关于堆栈操作的最佳实践，从验证到在生产环境中运行堆栈。\n*   **第 4\
  \ 章**，*持续集成和部署*，涵盖持续交付的另一个概念及其如何与 CloudFormation 结合应用。\n*   **第 5 章**，*使用 StackSets\
  \ 部署到多个区域和账户*，解释如何在多区域和多账户环境中管理堆栈。\n\n\n\n\n# 章节概览\n\n- *第 6 章*, *使用 `cfn-init`\
  \ 对 EC2 实例进行配置管理*，介绍如何使用 CloudFormation 在 EC2 实例上安装软件并应用配置管理。\n- *第 7 章*, *使用自定义资源创建\
  \ AWS 之外的资源*，介绍如何创建 CloudFormation 之外的资源。\n- *第 8 章*, *使用模板宏动态渲染模板*，涵盖宏——CloudFormation\
  \ 的高级概念——及其用例。\n- *第 9 章*, *使用 AWS CDK 生成 CloudFormation 模板*，介绍云开发工具包——一个支持多种语言的框架，用于生成\
  \ CloudFormation 模板和操作堆栈。\n- *第 10 章*, *使用 AWS SAM 部署无服务器应用程序*，教你如何使用无服务器应用程序模型——CloudFormation\
  \ 的简化实现——为无服务器应用程序预配资源。\n- *第 11 章*, *后续展望？*，让你抢先一睹基础设施即代码未来的发展。\n\n# 如何充分利用本书\n\
  \n为了编写和测试本书中的代码，你需要一台安装了 `WSL`（Windows Subsystem for Linux，适用于 Linux 的 Windows 子系统）的\
  \ Linux、macOS 或 Windows 机器。你需要 `AWS CLI`、`Python`，当然还需要一个 AWS 账户。你可以使用任何你喜欢的 IDE\
  \ 或代码编辑器。为了编写本书的代码，我使用了 JetBrains PyCharm 和 Visual Studio Code，因为它们有很好的 CloudFormation\
  \ 插件。\n\n对于 CDK 和 SAM，你还需要 `Docker`、`Homebrew` 和 `Node package manager`（`npm`）。\n\
  \n所有代码示例都是在 macOS 上编写的，但它们可以轻松地在 Linux 系统或 `WSL` 上运行。\n\n![](img/B10533_Preface_Table.jpg)\n\

  \ 分支，这将执行 GitLab CI/CD 流水线，在我们的框架中它将部署源代码到 Google Cloud Function。\n\n## Cloud Native\
  \ Checkpoint\n\n让我们回顾一下我们为云原生架构列出的考虑因素，以及我们如何通过 Cloud Storage 和 Cloud Functions\
  \ 来解决每个问题。\n\n+ 1. 我们的应用程序需要从云基础设施中抽象出来。\n+ a. 在这里，我们使用 Google Cloud Functions 和\
  \ Cloud Storage，这使我们无需管理操作系统、担心可扩展性，并让我们专注于应用程序功能。✓\n+ 2. 我们需要一种持续集成和持续交付的方法。\n\
  + a. 在这里，我们使用 GitLab 进行 CI/CD。我们还限制了经批准的用户才能合并到 master 分支，并且只有在合并到 master 分支被接受时才执行\
  \ CI/CD 流水线。✓\n+ b. 我们缺少什么？我们将在后面的章节中介绍这些主题：\n+ Staging\n+ Unit Testing\n+ Rollbacks\n\
  + 3. 我们的应用程序必须能够根据需要进行扩展和缩减。\n+ a. Cloud Functions 拯救了我们。Google Cloud 会自动管理和扩展函数，我们的函数必须是无状态的，这意味着一次函数调用不应依赖于由之前的调用设置的内存状态。✓\n\
  + b. Cloud Storage 会通过将请求负载分布到多个服务器来自动增加存储桶的 IO 容量。✓\n  存储桶的初始 IO 容量约为每秒 1000 次对象写入请求和每秒\
  \ 5000 次对象读取请求。\n+ 4. 我们的应用程序将如何管理故障？\n+ a. 我们尚未讨论这个问题，但请记住 Cloud Functions 是 Google\
  \ Cloud 提供的完全托管服务。Google Cloud 将管理托管我们云函数的基础设施，然而，我们仍需要考虑代码中的错误导致的故障。我们将在后面详细介绍，但此功能将由\
  \ GitLab 提供回滚功能。\n\n+ 5. 应用程序需要全局可访问。\n+ a. 此时，我们仅使用 Cloud Storage 和 Cloud Functions。这不是面向客户端的应用程序部分。然而，我们可以在录音发生的呼叫中心附近的相应区域构建存储桶和\
  \ Cloud Functions。我们将在即将到来的章节中深入介绍这一点。\n\n+ 6. 我们的框架需要基于微服务架构。\n+ a. 尚不适用，但将来会适用。但您可以将我们的函数视为微服务，因为它执行单一功能。我们的前端以及端点将部署在\
  \ Kubernetes 上，这将是我们微服务的编排软件。\n\n+ 7. 我们的应用程序将如何得到保护？\n+ a. 始终尝试使用最小权限。在我们的框架中，当我们为\
  \ GitLab 创建服务账号时，我们只提供了 GitLab 部署函数所需的角色。\n\n## Closing Remarks\n\n您在本章中涵盖了大量内容，开始构建框架。您学习了如何以编程方式、通过命令行以及使用\

  \n## Cloud Dataflow Monitoring\n\nGoogle Cloud provides a powerful monitoring interface\
  \ that lets you see and monitor your Dataflow jobs. The monitoring interface can\
  \ show you:\n\n- A list of all currently running Dataflow jobs\n- A graphical view\
  \ of your pipelines\n- Details about your job's status\n- Any errors or warnings\
  \ that occured during a job execution\n\nTo access the Dataflow monitoring interface,\
  \ navigate from the Google Cloud to the Big Data section and click Dataflow. A list\
  \ of the Dataflow jobs appears along with their status as seen in Figure 5-6\n\n\
  ![](img/eac8762c24ec77948aa0c3277f8e6eb3_151_0.png)\n\nFigure 5-6. Cloud Dataflow\
  \ Job List\n\nA Cloud Dataflow pipeline job can have the following statuses:\n\n\
  ## Running\n\nthe job is currently running\n\n## Starting\n\nthe job is created,\
  \ but the job is still being prepared\n\n## Queued\n\na FlexRS (Flexible Resource\
  \ Scheduling) job is queued\n\n## Canceling\n\nthe job is being canceled\n\n## Canceled\n\
  \nthe job that was canceled by the user\n\n## Draining\n\nthe job is being drained\n\
  \n## Drained\n\nthe user drained the job\n\n## Updating\n\nthe job is being updated\n\
  \n## Updated\n\nthe user updated the job\n\n## Succeeded\n\nthe job has finished\
  \ successfully\n\n## Failed\n\nthe job failed to complete\n\nTo access a job’s monitoring\
  \ charts and metrics, click the job **Name**.\nThis will navigate you to the **Job\
  \ details** page as seen in Figure 5-7.\n\nFigure 5-7. Cloud Dataflow Job Details\n\
  \nThe Job details page contains the following information:\n\n## Job graph\n\nThe\
  \ visual representation of your pipeline\n\n## Job metrics\n\nMetrics about the\
  \ execution of your job\n\n## Job info\n\nDescriptive information about your pipeline\n\
  \n## Job logs\n\n## Logs generated by Dataflow\n\n## Worker logs\n\nlogs generated\
  \ by the Dataflow service at at the worker level\n\n## Job error reporting\n\nCharts\
  \ showing where errors occurred\n\n## Time selector\n\nTool that lets you adjust\
  \ the timespan of your metrics\n\n## Job metrics\n\nTo view, (Figure 5-8) click\
  \ on the Job metrics tab.\n\n## Figure 5-8. Cloud Dataflow Job Metrics Page Details\n\
  \nThe Job metrics page details provide you with a wealth of information about your\
  \ pipeline. Below are key metrics you should review when troubleshooting performance\
  \ issues with your job.\n\nCloud Dataflow throughput is the volume of data being\
  \ processed at any point in time (Figure 5-9).\n\n## Throughput (elements/sec)\n\
  \nCreate alerting policy\n\nFigure 5-9. Cloud Dataflow Throughput Metrics\n\nCPU\
  \ utilization is the amount of CPU being used divided by the amount of CPU available\
  \ for processing (Figure 5-10).\n\n## CPU utilization (All Workers)\n\nCreate alerting\
  \ policy\n\nFigure 5-10. Cloud Dataflow CPU Utilization Metrics\n\n| Name | Value\
  \ |\n| Read PubSub Messages/Read | 0.017/s |\n| Window into/Abandon Dummy Key |\
  \ 0 |\n| Window into/Add Dummy Key | 0.017/s |\n| Window into/Add timestamps to\
  \ messages | 0.017/s |\n\n| Name | Value |\n| beamapp-ruicosta-09261842-09261142-nl86-harness-jz8c\
  \ | 3.14% |\n\nInput metrics and output metrics are displayed if your streaming\
  \ Dataflow job has read or written records using Pub/Sub (Figure 5-11).\n\n## Input\
  \ Metrics\n\nAll Pub/Sub subscriptions\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_157_0.png)\n\
  \nFigure 5-11. Cloud Dataflow Input and Output Metrics for Cloud Pub/Sub\n\nRequests\
  \ latency is the response time of the elements processes either being an input to\
  \ a transform or an output to a transform. If you notice high latency it would be\
  \ recommended to check the transform operation code (Figure 5-12).\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_157_1.png)\n\
  \nFigure 5-12. Cloud Dataflow Requests Latency Metrics\n\nThere are many more metrics\
  \ to explore that go beyond the scope of this chapter. I recommend you visit the\
  \ Google Cloud documentation (https://cloud.google.com/dataflow) on Cloud Dataflow\
  \ Monitoring that provides a wider array of metrics you can explore further to make\
  \ sure you have a healthy pipeline.\n\n## Using Cloud Monitoring for Cloud Dataflow\
  \ pipelines\n\nGoogle Cloud Monitoring provides you with the ability to log and\
  \ troubleshoot your application including your Dataflow pipelines.\n\nYou can explore\
  \ Cloud Dataflow metrics by accessing the Cloud Monitoring, go to Google Cloud Console\
  \ and click on Monitoring.\n\n- 1. In the left navigation pane, click Metrics Explorer.\n\
  - 2. In the Find resource type and metric enter Dataflow Job.\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_158_0.png)\n\
  \nFigure 5-13. Cloud Logging Resource Type Selection\n\n3. From the list that appears,\
  \ select a metric you’d like to view, example Element Count\n\n\n\n\n\n### 查找资源类型和指标？\n\

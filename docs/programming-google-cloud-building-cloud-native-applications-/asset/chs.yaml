  \ Explorer\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_96_0.png)\n\n3. 对于资源类型和指标选择以下内容：\n\
  \n+   a. Cloud Pub/Sub Subscription\n+   b. Unacked Messages\n\n4. 要在您喜欢的 IDE 中模拟未确认消息，请前往\
  \ chapter-three/pub-sub\n\n+   a. 如果您尚未 Git Clone 仓库，请继续克隆以下仓库：\n+   b. 编辑 sendMessageLoad.js\
  \ 并将 topicName 变量更改为您的主题名称\n+   c. 在终端中运行以下命令：`node sendMessageLoad.js`，应用程序将向您的\
  \ Pub/Sub 主题发送 100 条新消息并将其分发到关联的订阅\n\n5. 返回 Cloud Monitoring > Metrics Explorer，您应该会看到订阅的折线图跃升至\

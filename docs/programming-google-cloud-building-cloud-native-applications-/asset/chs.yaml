  \ GET Bucket PUT POST | GET Bucket GET Object HEAD | DELETE |\n\n让我们退一步，介绍文件存储、块存储和对象存储。\n\
  \n### File Storage\n\n文件存储以分层结构存储数据。数据保存在文件和文件夹中，无论是从提供视图的系统还是从检索数据视图的系统呈现，都是一致的。文件存储传统上通过\
  \ Network File System 协议或 Server Message Block 协议访问。\n\n### Block Storage\n\n块存储以存储区域网络或本地附加磁盘的形式呈现。块存储通常安装在操作系统上，就像块设备是本地附加存储一样。一旦本地挂载，用户就可以创建文件系统供操作系统使用：应用程序或数据库。\n\
  \n### Object-Based Storage\n\n对象存储以编程方式访问，而块存储只能通过操作系统访问。对象存储也是平面的；它不具有文件系统的分层结构。Cloud\
  \ Storage 没有文件夹的概念，文件夹是一个恰好在其名称中包含 \"/\" 字符的对象。每个对象包含数据以及相关的元数据，这些元数据分布在多个硬件系统上以提供可扩展性和可靠性。\n\
  \n### Options for Getting Data to Cloud Storage\n\n> NOTE\n> 你现在或稍后可以使用 Qwiklabs\
  \ 进行练习。本书的 Qwiklabs Quest 即将推出。\n\n\n\n\n\n用于管理云存储的 Cloud Console 是一个执行管理任务的绝佳选择。典型的管理任务包括：\n\
  \n- 创建和删除存储桶\n- 上传、下载和删除对象\n- 管理身份和访问管理策略，例如允许 allUsers 访问提供对象公共访问的存储桶\n\n如前所述，基于对象的存储使用扁平命名空间来存储您的数据。Cloud\
  \ Console 界面的关键功能是它将此扁平命名空间翻译为复制文件夹层次结构。Cloud Storage 没有文件夹的概念。\n\n### sample-42892\n\
  \nObjects Overview Permissions Bucket Lock\n\nUpload files Upload folder Create\
  \ folder Manage holds Delete\n\nFilter by prefix...\n\nBuckets / sample-42892 /\
  \ folder\n\n| Name | Size | Type | Storage class | Last modified | Public access\
  \ | Encryption | Retention expiration date | Holds |\n|---|---|---|---|---|---|---|---|---|\n\
  | image.png | 2.52 MB | image/png | Standard | 6/21/20, 8:56:39 PM UTC-4 | Not public\
  \ | Google-managed key | - | None |\n\n*Figure 2-1. Console Storage Folder Screenshot*\n\

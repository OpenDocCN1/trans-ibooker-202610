  ### 使用 Python 的签名 URL\n\n到目前为止，我们一直专注于 Node.js 客户端库，但我们可以用其他语言执行迄今为止所做的一切操作。假设我想将存在于\
  \ Cloud Storage 中的文件发送到端点。我们可以通过对我们可用的签名 URL 方法来实现这一点。示例：我们想将 PDF 文件发送到端点以便端点将 PDF\
  \ 转换为 PNG 文件。下面是示例代码，展示了如何在 Python 中使用签名 URL。\n\n签名 URL 是一个在有限时间内为用户和应用程序提供访问权限的\
  \ URL。签名 URL 允许用户在无需身份验证的情况下访问对象。在我们的框架中，我们通过 Identity Aware Proxy 对用户进行身份验证和授权。此时我们为有限时间生成一个签名\
  \ URL，允许用户播放相应的音频文件，该文件是 Cloud Storage 中的对象。\n\n> 注意\n> 任何拥有签名 URL 的人将在定义的时间段内能够对对象执行操作，例如读取对象。\n\
  \n```\nfrom google.cloud import storage\nstorage_client = storage.Client.from_service_account_json(service_acct)\n\
  bucket = storage_client.bucket(bucket_name)\nfor blob in bucket.list_blobs(prefix=str(prefix\
  \ + \"/\")):\n    if blob.name.endswith(\".png\"):\n        url_lifetime = 3600\
  \  # Seconds in an hour\n        serving_url = blob.generate_signed_url(expiration=url_lifetime,\
  \ version='v4')\n```\n\n让我们回顾一下代码片段。在第 5 行，我们有一个 for 循环，遍历第 3 行定义的存储桶名称。对于每个以 \"\
  .png\" 扩展名结尾的对象，我们生成一个签名 URL，其过期时间设置为 3600 秒。签名 URL 可以作为参数传递给端点。由于 URL 具有对象所需的身份验证和授权，因此端点在设定的时间内无需进行身份验证。Google\
  \ 使我们能够生成签名 URL 变得相当容易，这些 URL 允许用户或应用程序在无需身份验证或授权的情况下访问我们的对象。\n\n### 为我们的框架上传音频文件\n\
  \n现在我们对可用的存储选项有了很好的理解，并且练习了如何将数据传入和传出 Google Cloud，让我们继续了解我们将如何将数据获取到我们的云原生应用程序。对于我们的初始原型，我们将使用\
  \ gsutil 命令将音频文件上传到 Cloud Storage，并附带关联的自定义元数据。存储在 Cloud Storage 上的对象具有与相应对象关联的元数据。元数据提供有关对象的相关信息。例如，存储类别是一个键值对，说明对象属于哪个类别。键值对看起来像\
  \ storageClass:STANDARD。我们可以与对象关联的元数据有两种类型：\n\n- 固定键元数据：键由你定义，但你可以设置值的元数据。\n- 自定义元数据：你通过客户端库或\
  \ gsutil 设置的元数据。\n\n在我们的框架中，元数据起着关键作用。以下命令是我们如何在框架中将音频文件上传到 Cloud Storage 的方式。\n\
  \n```\ngsutil -h x-goog-meta-callid:1234567 -h x-goog-meta-stereo:true -h x-goog-meta-pubsubtopicname:[TOPIC_NAME]\
  \ -h x-goog-meta-year:2019 -h x-goog-meta-month:11 -h x-goog-meta-day:06 -h x-goog-meta-starttime:1116\
  \ cp [YOUR_FILE_NAME.wav] gs://[YOUR_UPLOADED_AUDIO_FILES_BUCKET_NAME]\n```\n\n\
  此命令将使用以下键值对将音频文件上传到定义的存储桶：\n\n- callid:1234567\n- stereo:true\n- pubsubtopicname:[TOPIC_NAME]\n\
  - year:2019\n- month:11\n- day:06\n- starttime:1116\n\n请记住，使用 gsutil 添加自定义元数据时，必须将元数据键以\
  \ x-goog-meta- 为前缀。x-goog-meta 不会作为键的一部分存储，只有 x-goog-meta 前缀后的名称。例如，我们的 gsutil 命令具有自定义元数据键\
  \ x-goog-meta-stereo，然而 x-goog-meta 不会被存储，只有 stereo 将用作键名。\n\n\n\n\n\n正如所讨论的，一旦文件写入\
  \ Cloud Storage，就会触发一个 Cloud Function。以下是我们将部署的云函数的代码片段。\n\n```\nlet pubSubObj =\
  \ {\n  'fileid': uniqid.time(),\n  'filename': `gs://${file.bucket}/${file.name}`,\n\
  \  'callid': file.metadata.callid === undefined ? 'undefined' : file.metadata.callid,\n\
  \  'date': Date(Date.now()),\n  'year': file.metadata.year === undefined ? 'undefined'\
  \ : file.metadata.year,\n  'month': file.metadata.month === undefined ? 'undefined'\
  \ : file.metadata.month,\n  'day': file.metadata.day === undefined ? 'undefined'\
  \ : file.metadata.day,\n  'starttime': file.metadata.starttime === undefined ? 'undefined'\
  \ :\n    file.metadata.starttime,\n  'duration': duration, //get value from fluent-ffmpeg\n\
  \  'stereo': file.metadata.stereo === undefined ? 'undefined' : file.metadata.stereo,\n\
  };\n```\n\n这个 Javascript 对象将保存我们自定义元数据的 key:value 对。请注意，我们在提取值时并未引用 x-goog-meta。同样，我们在代码库内部也忽略了该前缀。\n\
  \n现在我们对 Cloud Storage 以及框架如何与 Cloud Storage 协同工作有了良好的理解，让我们继续学习 Cloud Functions。Cloud\
  \ Functions 在我们的框架中发挥着重要作用，它将是开始转录音频文件流程的第一步。\n\n### Cloud Functions\n\nGoogle Cloud\
  \ Functions 是一种无服务器计算解决方案，允许您运行基于事件的应用程序。Cloud Functions 允许您编写单一用途的函数，这些函数可以附加到服务的事件上。一个例子就是我们的框架将如何利用云函数。我们的函数将由一个事件触发，并且当对象写入函数所附加的\
  \ Cloud Storage 存储桶时，该事件会触发 Cloud Function。\n\nCloud Functions 是 Google Cloud 的一项无服务器服务。它抽象了计算基础设施，让您可以专注于代码。您无需担心修补操作系统或配置资源。Cloud\
  \ Functions 会自动扩展；它们可以在无需开发人员干预的情况下从一次调用扩展到数百万次调用。对于 Cloud Storage，Cloud Functions\
  \ 支持以下触发类型：\n\n- google.storage.object.finalize\n- google.storage.object.delete\n\
  - google.storage.object.archive\n- google.storage.object.metadataUpdate\n\n我们的框架将利用\
  \ google.storage.object.finalize 触发类型。此事件在存储桶中创建新对象或覆盖现有对象时触发。以下是我们 Cloud Function\
  \ 的代码片段。\n\n```\nexports.safLongRunJobFunc = (event, context, callback) => {\n \
  \ const file = event;\n  const topicName = file.metadata.pubsubtopicname;\n  const\
  \ audioPath = { uri: `gs://${file.bucket}/${file.name}` };\n  const readFile = storage.bucket(file.bucket).file(file.name);\n\
  ```\n\n在第 1 行，第一个参数中的 event 参数是 Cloud Storage 对象格式中传递的存储事件数据。当我们的事件被触发时，Cloud Storage\
  \ 会公开此对象，其中包含有关我们的对象的信息，包括您在通过 gsutil 命令上传文件时应用的自定义元数据。以下是公开给云函数的对象值：\n\n```\n{\n\
  \  \"kind\": \"storage#object\",\n  \"id\": string,\n  \"selfLink\": string,\n \
  \ \"name\": string,\n  \"bucket\": string,\n  \"generation\": long,\n  \"metageneration\"\
  : long,\n  \"contentType\": string,\n  \"timeCreated\": datetime,\n  \"updated\"\
  : datetime,\n  \"timeDeleted\": datetime,\n  \"temporaryHold\": boolean,\n  \"eventBasedHold\"\
  : boolean,\n  \"retentionExpirationTime\": datetime,\n  \"storageClass\": string,\n\
  \  \"timeStorageClassUpdated\": datetime,\n  \"size\": unsigned long,\n  \"md5Hash\"\
  : string,\n  \"mediaLink\": string,\n  \"contentEncoding\": string,\n  \"contentDisposition\"\
  : string,\n  \"contentLanguage\": string,\n  \"cacheControl\": string,\n  \"metadata\"\
  : {\n    (key): string\n  },\n  \"acl\": [\n    objectAccessControls Resource\n\
  \  ],\n  \"owner\": {\n    \"entity\": string,\n    \"entityId\": string\n  },\n\
  \  \"crc32c\": string,\n  \"componentCount\": integer,\n  \"etag\": string,\n  \"\
  customerEncryption\": {\n    \"encryptionAlgorithm\": string,\n    \"keySha256\"\
  : string\n  },\n  \"kmsKeyName\": string\n}\n```\n\n从我们的代码片段中，我们提取了以下值：\n\n```\n\
  const topicName = file.metadata.pubsubtopicname;\nconst audioPath = { uri: `gs://${file.bucket}/${file.name}`\
  \ };\nconst readFile = storage.bucket(file.bucket).file(file.name);\n```\n\ntopicName\
  \ 是我们在上传时应用的自定义元数据，-h x-goog-meta-pubsubtopicname: [TOPIC_NAME]，现在我们可以在代码中访问它。\n\
  \n### Cloud Function Libraries\n\nCloud Functions 提供了使用外部模块的能力。我们框架的依赖项通过 npm 管理，并在名为\
  \ package.json 的文件中定义。这使开发人员能够在函数中发挥创造力。我们的框架利用了以下外部模块：\n\n```\nconst PubSub = require(`@google-cloud/pubsub`);\n\
  const storage = require('@google-cloud/storage')();\nconst speech = require('@google-cloud/speech').v1p1beta1;\n\
  const client = new speech.SpeechClient();\nconst uniqid = require('uniqid');\nconst\
  \ ffmpeg = require('fluent-ffmpeg');\nconst ffmpegPath = require('@ffmpeg-installer/ffmpeg').path;\n\
  ```\n\nfluent-ffmpeg 和 ffmpeg-installer/ffmpeg 使我们的函数能够检查音频文件的编解码器和长度。当向 Speech-to-Text\
  \ 提交作业进行转录时，我们需要配置 sampleRateHertz 参数。使用外部库，我们提取此信息并将其传递给 Speech-to-Text API。我们使用\
  \ Speech-to-Text API 提供的长运行作业方法。当我们提交音频文件进行长运行作业转录时，我们需要等待 API 完成，此过程可能需要几分钟到数小时。使用的公式是\
  \ n/2 来估算 API 完成所需的时间。为此，我们需要在检查 API 是否完成之前等待一段时间。\n\n如果我们持续轮询 API，我们可能会达到 Google\
  \ Cloud 的配额限制。为了避免达到配额，我们仅在音频文件时长除以二的时间过去后才检查 API 是否已完成作业。例如：如果音频文件长 1 小时，我们将在 30\
  \ 分钟过去后才检查 API 是否完成。我们将在 Dataflow 章节中深入介绍这一点，因为在这里我们只是向 Speech-to-Text 提交作业并接收作业名称，然后将其作为\
  \ key:value 对发送到 Pub/Sub。\n\n### GitLab CI/CD and Cloud Functions\n\n让我们练习使用 GitLab\

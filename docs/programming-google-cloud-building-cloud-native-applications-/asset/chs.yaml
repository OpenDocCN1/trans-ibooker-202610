  \ Usage of gsutil\n\nReview Figure 2-2 and 2-3. What is different between the two?\
  \ Not much except their content-type. gsutil displays a hierarchical file structure\
  \ but the underlying Cloud Storage is a flat namespace. To the service, the object\
  \ gs://sample-42892/folder/image.png is just an object that happens to have \"/\"\
  \ character in its name. There is no \"folder\" directory; just a single object\
  \ with the given name. If we try to run gsutil stat gs://sample-42892/folder, what\

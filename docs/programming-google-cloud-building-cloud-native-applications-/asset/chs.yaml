  \nFigure 4-16. Five Minute Dataflow Windowing Output\n\n\n\n\n\n恭喜！你已创建了两个使用 Tumbling\
  \ 窗口（在 Apache Beam 中称为 fixed windows）的 Cloud Dataflow 作业，间隔分别为 2 分钟和 5 分钟。这是一种强大的方法，可对流式数据集执行聚合。想象一下构建计分卡，你可以让\
  \ Dataflow 执行聚合计算平均值并将其写入数据库，以便向用户展示计分卡。此时，你无需在前端执行聚合，从而提供快速的用户体验。\n\n## Watermark\n\
  \nWatermark 是你定义的一个值，用于让 Dataflow 知道何时预期数据到来。如果你将该值设置为 30 秒，并且一个元素在 30 秒的 watermark\
  \ 之后到达，即使其时间戳在窗口范围内，也会被视为迟到。\n\n例如，如果你有一个窗口用于存储 30 秒内的事件项，并且你收到了以下 3 个元素 [element\
  \ 1: 2020-01-09 0:00:01]、[element 2: 2020-01-09 0:00:05] 和 [element 3: 2020-01-09\
  \ 0:00:15]，但 element 3 的事件时间包含在此间隔内，但它在窗口计算完成后才到达系统，被视为迟到。\n\n## Trigger\n\n触发器决定何时为每个窗口发出聚合结果。\n\
  \nBeam 提供了许多可设置的预构建触发器：\n\n### *Event time triggers*\n\n这些触发器基于由每个元素的时间戳标识的事件时间运行。例如，AfterWatermark()\
  \ 触发器会在 watermark 通过窗口结束时发出窗口中的元素，该结束时间基于附加到数据元素的时间戳。以下示例同时使用了 early 的 AfterProcessingTime()\
  \ 和 late 的 late=AfterCount(1)：\n\n```\nAfterWatermark(\n    early=AfterProcessingTime(delay=1\
  \ * 60),\nlate=AfterCount(1))\n```\n\n### Processing time triggers\n\n这些触发器基于处理时间运行，即元素被处理的时间。AfterProcessingTime()\
  \ 触发器会在数据接收后经过一定处理时间后发出窗口。处理时间由系统时钟决定，而不是数据元素的时间戳。\n\n### Data-driven triggers\n\
  \n这些触发器通过检查每个窗口中到达的数据，并在数据满足特定属性时触发。Apache Beam 提供了一个数据驱动触发器 AfterCount()。需要注意的是，例如，你指定\
  \ AfterCount(25) 但只有 10 个元素到达，这 10 个元素将不会被处理，因为未满足 25 的条件。如果你需要这 10 个元素，应考虑使用复合触发器。\n\
  \n### Composite triggers\n\n这些触发器组合多个触发器。Apache Beam 文档指出以下复合触发器：\n\n- 你可以通过 .withEarlyFirings\
  \ 和 .withLateFirings 向 AfterWatermark.pastEndOfWindow 添加额外的 early 触发或 late 触发。\n\
  - Repeatedly.forever 指定一个永远执行的触发器。每当触发器的条件满足时，它会使窗口发出结果，然后重置并重新开始。将 Repeatedly.forever\
  \ 与 .orFinally 结合使用很有用，以指定使重复触发器停止的条件。\n- AfterEach.inOrder 将多个触发器组合起来按特定顺序触发。每当序列中的一个触发器发出窗口时，序列会推进到下一个触发器。\n\
  - AfterFirst 接收多个触发器，并在其任一参数触发器满足时发出。这相当于多个触发器的逻辑或操作。\n- AfterAll 接收多个触发器，并在其所有参数触发器都满足时发出。这相当于多个触发器的逻辑与操作。\n\
  - orFinally 可作为最终条件，使任何触发器最后触发一次且不再触发。\n\n## Composition triggers with AfterWatermark()\n\
  \n有用的复合触发器会在 Beam 估计所有数据都已到达时执行一次。例如，以下示例触发器代码在以下条件下执行：\n\n- watermark 通过窗口结束\n\
  - 任何迟到数据到达后，经过十分钟延迟\n- 两天后，我们假设不会再有感兴趣的数据到达，触发器停止执行\n\n```\npcollection | WindowInto(\n\
  \    FixedWindows(1 * 60),\n    trigger=AfterWatermark(late=AfterProcessingTime(10\
  \ * 60)),\n    allowed_lateness=Duration(seconds=2*24*60*60))  # 2 days,\n    accumulation_mode=AccumulationMode.DISCARDING)\n\
  ```\n\n## Closing Remarks\n\n在本章中，你学习了 Cloud Dataflow。Cloud Dataflow 是一个完全托管的数据处理管道，可让你大规模地对数据执行转换。在此框架内，你利用它来丰富语音转文本数据，为用户提供音频录音的分析。在第\
  \ 5 章中，你将部署应用程序的第二部分，并且随着章节的推进，你将继续在此应用程序的基础上构建。\n\nCitations:\nhttps://beam.apache.org/documentation/programming-guide/#data-driven-triggers\n\
